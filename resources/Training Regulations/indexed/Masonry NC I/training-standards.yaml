    "source_text": "3.1\nCURRICULUM DESIGN\n\nTESDA shall provide the training on the development of competency-based\ncurricula to enable training providers develop their own curricula with the components\nmentioned below.\n\nDelivery of knowledge requirements for the basic, common and core units of\ncompetency\nspecifically\nin\nthe\nareas\nof\nmathematics,\nscience/technology,\ncommunication/language and other academic subjects shall be contextualized. To this\nend, TVET providers shall develop a Contextual Learning Matrix (CLM) to accompany\ntheir curricula.\n\nCourse Title: MASONRY NC I\n\nNominal Training Duration:\n47 Hours Basic Competencies\n20 Hours Common Competencies\n\n56 Hours Core Competencies\n\n Total 123 Hours\n\nCourse Description:\n\nThis course is designed to provide the learner with knowledge, practical skills and\nattitude, applicable in performing work activities involve in preparing masonry materials, tools\nand equipment and preparing basic masonry works. This includes classroom learning\nactivities and practical work in actual work site or simulation area.\n\nUpon completion of the course, the learners are expected to demonstrate the above-\nmentioned competencies to be employed. To obtain this, all units prescribed for this\nqualification must be achieved.\n\n--- PDF PAGE 77 ---\nMASONRY NC I Revision 01 Promulgated (10/29/2018) 73\nBASIC COMPETENCIES\n(47 HOURS)\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n1. Receive and\nrespond to\nworkplace\ncommunication\n1.1 Follow routine\nspoken messages\n• Exercise Conciseness in\nreceiving and clarifying\nmessages/ information/\ncommunication\n• Group\ndiscussion\n• Interaction\n• Reportorial\n• Modular\n• Interviews/\n• Questioning\n• Practical/\n• Performance\nTest\n• Observation\n4 Hours\n\n1.2 Perform workplace\nduties following\nwritten notices\n• Practice Accuracy in\nfollowing written/ oral\ninstruction/ information\n• Practice written and oral\ncommunication skills\n• Case Study in handling\nwritten communication\n• Practice relaying/\ndisseminating messages/\ninformation\n• Analyze different messages\n\n• Lecture/\n• Discussion\n• Demonstration\n• Case Study\n\n• Written\n• Practical\n• Written\n• Demonstration\n\n4 Hours\n\n--- PDF PAGE 78 ---\nMASONRY NC I Revision 01 Promulgated (10/29/2018) 74\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n2. Work with\nothers\n2.1 Develop effective\nworkplace\nrelationships\n\n• Read job description and\norganizations policies\nrelevant to work role\n• Read personnel code of\nconduct and discipline\n• Role play on cooperation\nand good relationship\n• Study table of organization\nand identify team members\n• Role play on team work.\n• Role play on receiving\nfeedback from supervisor\n• Role play on providing\nfeedback.\n• Listen to lecture on Valuing\nand exemplifying respect\nand empathy in the\nworkplace\n• Individual Work\n• Discussion\n• Role Play\n• Lecture\n• Role Play\n• Structured activity\n• Written Test\n2 Hours\n\n2.2 Contribute to work\ngroup activities\n•\nDiscussion on creative\ncollaboration, social\nperceptiveness and problem\nsensitivity\n•\nRole play on creative\ncollaboration, social\nperceptiveness and problem\nsensitivity.\n•\nParticipate in a goal setting\nactivity\n•\nParticipate in planning and\nimplementation of a group\nactivity.\n•\nParticipate in evaluation of\nthe group activity\n\n• Lecture/\nDiscussion\n• Role Play\n• Group Work\n• Role Play\n• Structured activity\n• Written Test\n1 Hour\n\n--- PDF PAGE 79 ---\nMASONRY NC I Revision 01 Promulgated (10/29/2018) 75\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n3. Solve/address\nroutine\nproblems\n3.1 Identify the problem\n•\nShow mastery of the\ncurrent industry hardware\nand software products and\nservices\n- Show mastery of\nknowledge and\nunderstanding of the\nprocess, normal\noperating parameters,\nand product quality to\nrecognize non-\nstandard situations\n- Relevant equipment\nand operational\nprocesses\n- Enterprise goals,\ntargets and measures\n- Enterprise quality OHS\nand environmental\nrequirement\n- Enterprise information\nsystems and data\ncollation\n- Industry codes and\nstandards\n•\nUse range of formal\nproblem-solving\ntechniques (e.g., planning,\nattention, simultaneous\nand successive processing\nof information)\n•\nIdentify and clarify the\nnature of the problem\n\n• Interactive\nLecture\n• Appreciative\nInquiry\n• Demonstration\n• Case\nFormulation\n• Life Narrative\nInquiry\n(Interview)\n• Standardized\ntest\n\n1 Hour\n\n--- PDF PAGE 80 ---\nMASONRY NC I Revision 01 Promulgated (10/29/2018) 76\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\n3.2 Assess fundamental\ncauses of problem\n\n•\nShow mastery of the\ncurrent industry hardware\nand software products and\nservices\n- Show mastery of\nknowledge and\nunderstanding of the\nprocess, normal\noperating parameters,\nand product quality to\nrecognize non-\nstandard situations\n- Relevant equipment\nand operational\nprocesses\n- Enterprise goals,\ntargets and measures\n- Enterprise quality OHS\nand environmental\nrequirement\n- Enterprise information\nsystems and data\ncollation\n- Industry codes and\nstandards\n•\nUse range of formal\nproblem-solving\ntechniques (e.g., planning,\nattention, simultaneous\nand successive processing\nof information)\n•\nIdentify and clarify the\nnature of the problem\n\n• Group discussion\n• Lecture\n• Demonstration\n• Role play\n• Case\nFormulation\n• Life Narrative\nInquiry\n(Interview)\n• Standardized\ntest\n\n1 Hour\n\n--- PDF PAGE 81 ---\nMASONRY NC I Revision 01 Promulgated (10/29/2018) 77\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\n3.3 Determine\ncorrective action\n•\nShow mastery of the\ncurrent industry hardware\nand software products and\nservices\n- Show mastery of\nknowledge and\nunderstanding of the\nprocess, normal\noperating parameters,\nand product quality to\nrecognize non-\nstandard situations\n- Relevant equipment\nand operational\nprocesses\n- Enterprise goals,\ntargets and measures\n- Enterprise quality OHS\nand environmental\nrequirement\n- Enterprise information\nsystems and data\ncollation\n- Industry codes and\nstandards\n•\nUse range of formal\nproblem-solving\ntechniques (e.g., planning,\nattention, simultaneous\nand successive processing\nof information)\n•\nIdentify and clarify the\nnature of the problem\n\n• Group discussion\n• Lecture\n• Demonstration\n• Role play\n• Case Formulation\n• Life Narrative\nInquiry (Interview)\n• Standardized test\n\n1 Hour\n\n--- PDF PAGE 82 ---\nMASONRY NC I Revision 01 Promulgated (10/29/2018) 78\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\n3.4 Communicate\naction plans and\nrecommendations\nto routine problems\n•\nShow mastery of the\ncurrent industry hardware\nand software products and\nservices\n- Show mastery of\nknowledge and\nunderstanding of the\nprocess, normal\noperating parameters,\nand product quality to\nrecognize non-\nstandard situations\n- Relevant equipment\nand operational\nprocesses\n- Enterprise goals,\ntargets and measures\n- Enterprise quality OHS\nand environmental\nrequirement\n- Enterprise information\nsystems and data\ncollation\n- Industry codes and\nstandards\n•\nUse range of formal\nproblem-solving\ntechniques (e.g., planning,\nattention, simultaneous\nand successive processing\nof information)\n•\nIdentify and clarify the\nnature of the problem\n\n• Group discussion\n• Lecture\n• Demonstration\n• Role playing\n• Case Formulation\n• Life Narrative\nInquiry (Interview)\n• Standardized test\n1 Hour\n\n--- PDF PAGE 83 ---\nMASONRY NC I Revision 01 Promulgated (10/29/2018) 79\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n4. Enhance Self-\nManagement\nSkills\n\n4.1 Set personal and\ncareer goals\n•\nDefine and set personal\ngoals and career goals\n•\nDescribe the SMART\nModel for goal setting\n•\nCreate personal and\ncareer goals using SMART\nModel for goal setting\n•\nExplain and apply the\nprinciples of goal setting\naccording to Locke &\nLatham\n• Discussion\n• Making of\npersonal and\ncareer goals by\nstudents\n• Brainstorming\n• Demonstration or\nsimulation with oral\nquestioning\n• Case problems\ninvolving workplace\ndiversity issues\n\n1 Hour\n\n4.2 Recognize\nemotions\n•\nIdentify common positive\nand negative emotions\nmanifested in the\nworkplace\n•\nDistinguish professional\nand non-professional\nbehaviors in the workplace\n•\nRecognize triggers and\nimplications of positive and\nnegative emotions in the\nworkplace\n•\nRespond with appropriate\nemotions and identify\npossible consequences of\ninappropriate emotional\nresponses in a social and\nwork-related context\n• Discussion\n• Interactive\nLecture\n• Brainstorming\n• Demonstration or\nsimulation with oral\nquestioning\n• Case problems\ninvolving workplace\ndiversity issues\n\n1 Hour\n\n--- PDF PAGE 84 ---\nMASONRY NC I Revision 01 Promulgated (10/29/2018) 80\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\n4.3 Describe oneself as\na learner\n3.1.1 Review Kolb’s Theory of\nLearning Styles\n3.1.2 Describe VAK Learning\nStyle Model (Visual,\nAuditory, Kinesthetic)\n3.1.3 Cite learning strategies\nappropriate to specific\ntasks and describe work\npractices that assist\nlearning\n3.1.4 Identify factors and\nstrategies that assist\nlearning\n3.1.5 Apply learning styles to\npositively influence\nschool/work performance\n3.1.6 Use appropriate learning\nstrategies to improve\nstudy habits and learning\n•\nDiscussion\n•\nInteractive\nLecture\n•\n Brainstorming\n•\nSimulation\n•\nDemonstration or\nsimulation with\noral questioning\n•\nCase problems\ninvolving\nworkplace\ndiversity issues\n\n1 Hour\n\n--- PDF PAGE 85 ---\nMASONRY NC I Revision 01 Promulgated (10/29/2018) 81\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n5. Support\nInnovation\n5.1 Identify the need\nfor innovation in\none’s area of work\n• Show mastery of the clear-\ncut definition of innovation\nand its characteristics\n• Identify the need for\ninnovation in one’s work\narea\n• Identify work procedures\nneeding change\n• Contribute to brainstorming\nsessions with co-workers on\nidentifying tasks needing\nchange\n• Interactive\nLecture\n• Appreciative\nInquiry\n• Demonstration\n• Group work\n• Psychological and\nbehavioral\nInterviews\n• Performance\nEvaluation\n• Life Narrative\nInquiry\n• Review of\nportfolios of\nevidence and third-\nparty workplace\nreports of on-the-\njob performance.\n• Standardized\nassessment of\ncharacter\nstrengths and\nvirtues applied\n1 Hour\n\n--- PDF PAGE 86 ---\nMASONRY NC I Revision 01 Promulgated (10/29/2018) 82\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\n5.2 Recognize\ninnovative and\ncreative ideas\n\n• Identify resources needed\nfor change and potential\nobstacles as well\n• Show positive attitudes and\nbehaviors in accepting and\nin needing change in one’s\nwork area\n• Delineate differences\nbetween creativity and\ninnovation\n• Interactive\nLecture\n• Appreciative\nInquiry\n• Demonstration\n• Group work\n• Psychological and\nbehavioral\nInterviews\n• Performance\nEvaluation\n• Life Narrative\nInquiry\n• Review of\nportfolios of\nevidence and third-\nparty workplace\nreports of on-the-\njob performance.\n• Standardized\nassessment of\ncharacter\nstrengths and\nvirtues applied\n1 Hour\n\n--- PDF PAGE 87 ---\nMASONRY NC I Revision 01 Promulgated (10/29/2018) 83\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\n5.3 Support individuals’\naccess to flexible\nand innovative\nways of working\n• Identify different roles of\nemployees/workers in the\nimprovement of practices in\nthe organization\n• Identify practices for flexible\nand innovative ways of\nworking\n• Share information with co-\nworkers\n• Detect potential problems in\nimplementing flexible ways\nof working\n\n• Interactive\nLecture\n• Appreciative\nInquiry\n• Demonstration\n• Group work\n• Psychological and\nbehavioral\nInterviews\n• Performance\nEvaluation\n• Life Narrative\nInquiry\n• Review of\nportfolios of\nevidence and third-\nparty workplace\nreports of on-the-\njob performance.\n• Standardized\nassessment of\ncharacter\nstrengths and\nvirtues applied\n• Review of\nportfolios of\nevidence and third-\nparty workplace\nreports of on-the-\njob performance.\n• Standardized\nassessment of\ncharacter\nstrengths and\nvirtues applied\n\n1 Hour\n\n--- PDF PAGE 88 ---\nMASONRY NC I Revision 01 Promulgated (10/29/2018) 84\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n6. Access and\nmaintain\ninformation\n\n6.1 Identify and gather\nneeded information\n• Lecture and discussion on:\n-\nPolicies, procedures and\nguidelines relating to\ninformation handling in\nthe public and private\nsector, including\nconfidentiality, privacy,\nsecurity, freedom of\ninformation\n-\nData collection and\nmanagement\nprocedures\n-\nPublic/private sector\nstandards\n• Identify sources to produce\nrequired information\n• Perform exercises on\ninformation gathering\n• Lecture\n• Demonstration\n• Practical\nexercises\n• Oral evaluation\n• Written Test\n• Observation\n3 Hours\n\n6.2 Search for\ninformation on the\ninternet or an\nintranet\n• Lecture and discussion on:\n-\nTechniques in finding\nuseful information\n-\nSearch engines for\ninformation\n• Find and select appropriate\ninformation\n• Perform information\nsearching on the internet\nusing different search\nengines\n• Group\ndiscussion\n• Lecture\n• Demonstration\n• Practical\nexercises\n• Oral evaluation\n• Written Test\n• Observation\n• Presentation\n2 Hours\n\n--- PDF PAGE 89 ---\nMASONRY NC I Revision 01 Promulgated (10/29/2018) 85\n\n6.3 Examine\ninformation\n• Lecture and discussion on:\n-\nData evaluation\nprocedures\n-\nCultural aspects of\ninformation and\nmeaning\n-\nSources of public sector\nwork-related information\n• Evaluation of searched\ninformation\n• Group\ndiscussion\n• Lecture\n• Demonstration\n• Practical\nexercises\n• Oral evaluation\n• Written Test\n• Observation\n• Presentation\n2 Hours\n\n6.4 Secure information\n• Lecture and discussion on:\n- Basic file-handling\ntechniques\n- Techniques in handling,\norganizing and saving\nfiles\n- Electronic and manual\nfiling systems\n• Performance of basic file-\nhandling techniques\n• Application of electronic and\nmanual filing systems\n• Group\ndiscussion\n• Lecture\n• Demonstration\n• Role Play\n• Practical\nexercises\n• Oral evaluation\n• Written Test\n• Observation\n• Presentation\n3 Hours\n\n6.5 Manage\ninformation\n• Lecture and discussion on:\n- Organizational\ninformation handling and\nstorage procedures\n- Databases and data\nstorage systems\n• Managing databases and\ndata storage systems\n• Group\ndiscussion\n• Lecture\n• Demonstration\n• Practical\nexercises\n• Oral evaluation\n• Written Test\n• Observation\n• Presentation\n2 Hours\n7. Follow\nOccupational\nSafety And\nHealth\nPolicies And\nProcedures\n7.1 Identify relevant\noccupational safety\nand health policies\nand procedures\n•\nDiscussion of Risks\nand Hazards\n•\nRisk and Hazard\nIdentification\n\n•\nLecture\n•\nGroup\nDiscussion\n\n•\nWritten Exam\n•\nDemonstration\n•\nObservation\n•\nInterviews /\nQuestioning\n2 Hours\n\n--- PDF PAGE 90 ---\nMASONRY NC I Revision 01 Promulgated (10/29/2018) 86\n\n7.2 Perform relevant\noccupational safety\nand health\nprocedures\n•\nDemonstration of\nproper use of Personal\nProtective Equipment\nand Materials Handling\n•\nPractice Emergency\nPlan\n•\nLecture\n•\nGroup\nDiscussion\n\n•\nWritten Exam\n•\nDemonstration\n•\nObservation\n•\nInterviews /\nQuestioning\n2 Hours\n\n7.3 Comply with\nrelevant\noccupational safety\nand health policies\nand standards\n•\nDiscussion on Personal\nHygiene and\nPreventive Control\nMeasures\n•\nPractice 5S and waste\nsegregation\n•\nLecture\n•\nGroup\nDiscussion\n\n•\nWritten Exam\n•\nDemonstration\n•\nObservation\n•\nInterviews /\nQuestioning\n4 Hours\n8. Apply\nEnvironmental\nWork\nStandards\n8.1 Identify\nenvironmental work\nhazards\n•\nDiscussions in\n-\nReduction in\ngreenhouse gas\nemissions,\n-\nIncrease the share of\nrenewables of gross\nfinal energy\nconsumption,\n-\nLong-term reduction of\nenergy consumption,\n-\nRelease of materials\ninto the environment\nshould, in the long run,\nnot exceed the\nadaptability of the eco-\nsystem,\n-\nDangers and\nunjustifiable risks to\nhuman health\n-\nEnergy and natural\nresource consumption\nand the provision of\ntransport services\n•\nLecture\n•\nGroup\nDiscussion\n\n•\nWritten Exam\n•\nDemonstration\n•\nObservation\n•\nInterviews /\nQuestioning\n1 Hour\n\n--- PDF PAGE 91 ---\nMASONRY NC I Revision 01 Promulgated (10/29/2018) 87\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\n8.2 Follow\nenvironmental work\nprocedures\n•\nDiscussions Protection\nagainst\n- Human Dangers\n- Overconsumption of\nResources\n- Destruction of\nEcosystems\n- Habitat Destructions\n- Extinction of Wildlife\n- Pollutions\n- Water Degradation\n•\nLecture\n•\nGroup\nDiscussion\n•\nDemonstration\n\n•\nWritten Exam\n•\nDemonstration\n•\nObservation\n•\nInterviews /\nQuestioning\n1 Hour\n\n8.3 Comply with\nenvironmental work\nrequirements\n•\nDiscussions\nEnvironmental\nRegulations and its\nrequirements relevant to\nthe industry and work\nactivities\n•\nDemonstration and\nPractice Environmental\nCompliance\n\n•\nLecture\n•\nGroup\nDiscussion\n•\nDemonstration\n\n•\nWritten Exam\n•\nDemonstration\n•\nObservation\n•\nInterviews /\nQuestioning\n\n1 Hour\n9. Adopt\nEntrepreneurial\nMindset in the\nWorkplace\n9.1 Determine\nentrepreneurial\nmindset\n•\nDiscussion on\nEntrepreneurial Mindset\n•\nGames to develop\nentrepreneurial mind set\n•\nLecture\ndiscussion\n•\nGames\n•\nWritten Test\n•\nRole play\n2 Hours\n\n9.2 Identify\nentrepreneurial\npractices\n•\nCase study- quality\nassurance practices\n•\nDiscussion on cost\neffective measures\n•\nDiscussion on Workplace\nquality Policy\n•\nCase study\n•\nLecture\ndiscussion\n•\nWritten Test\n•\nCase Study\n1 Hour\n\n--- PDF PAGE 92 ---\nMASONRY NC I Revision 01 Promulgated (10/29/2018) 88\n\nCOMMON COMPETENCIES\n(20 HOURS)\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n1. Prepare\nconstruction\nmaterials and\ntools\n\n1.1 Identify materials\n\n•\nIdentifying tools according\nto the job requirements\n•\nIdentifying materials and\naccessories according to\nthe job requirements\n• Lecture-\ndemonstration\n• Group\ndiscussion\n• PowerPoint\npresentation\n• Demonstration\nwith oral\nquestioning\n• Written\nexamination\n• Portfolio\n(credentials)\n\n1 Hour\n\n1.2 Requisition\n materials\n•\nPreparing material take-off\n•\nRequesting materials and\ntools\n• Simulation\n• Discussion\n• Demonstration\nwith oral\nquestioning\n1 Hour\n\n1.3 Receive and\ninspect materials\n•\nChecking and inspecting\nmaterials and tools\n•\nStoring/ stacking of tool\nand materials\n• Practical\nExercise\n• Demonstration\n• Written / Oral\nTest\n• Demonstration\nwith oral\nquestioning\n2 Hours\n\n2. Observe\nprocedures,\nspecifications\nand manuals of\ninstructions\n2.1 Identify and access\nspecification/\nmanuals\n•\nIdentifying manuals and\nspecifications\n•\nAccessing 