ativity and\ninnovation\n• Interactive\nLecture\n• Appreciative\nInquiry\n• Demonstration\n• Group work\n• Psychological and\nbehavioral\nInterviews\n• Performance\nEvaluation\n• Life Narrative\nInquiry\n• Review of\nportfolios of\nevidence and third-\nparty workplace\nreports of on-the-\njob performance.\n• Standardized\nassessment of\ncharacter\nstrengths and\nvirtues applied\n1 Hour\n\n--- PDF PAGE 87 ---\nMASONRY NC I Revision 01 Promulgated (10/29/2018) 83\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\n5.3 Support individuals’\naccess to flexible\nand innovative\nways of working\n• Identify different roles of\nemployees/workers in the\nimprovement of practices in\nthe organization\n• Identify practices for flexible\nand innovative ways of\nworking\n• Share information with co-\nworkers\n• Detect potential problems in\nimplementing flexible ways\nof working\n\n• Interactive\nLecture\n• Appreciative\nInquiry\n• Demonstration\n• Group work\n• Psychological and\nbehavioral\nInterviews\n• Performance\nEvaluation\n• Life Narrative\nInquiry\n• Review of\nportfolios of\nevidence and third-\nparty workplace\nreports of on-the-\njob performance.\n• Standardized\nassessment of\ncharacter\nstrengths and\nvirtues applied\n• Review of\nportfolios of\nevidence and third-\nparty workplace\nreports of on-the-\njob performance.\n• Standardized\nassessment of\ncharacter\nstrengths and\nvirtues applied\n\n1 Hour\n\n--- PDF PAGE 88 ---\nMASONRY NC I Revision 01 Promulgated (10/29/2018) 84\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n6. Access and\nmaintain\ninformation\n\n6.1 Identify and gather\nneeded information\n• Lecture and discussion on:\n-\nPolicies, procedures and\nguidelines relating to\ninformation handling in\nthe public and private\nsector, including\nconfidentiality, privacy,\nsecurity, freedom of\ninformation\n-\nData colle