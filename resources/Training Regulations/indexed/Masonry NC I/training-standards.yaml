    "source_text": "SECTION 3\nTRAINING ARRANGEMENTS\n\nThese standards are set to provide technical and vocational education and training\n(TVET) providers with information and other important requirements to consider when\ndesigning training programs for MASONRY NC I.\n\nThey include information on curriculum design; training delivery; trainee entry\nrequirements; tools and equipment; training facilities; and trainer’s qualification.\n\n3.1\nCURRICULUM DESIGN\n\nTESDA shall provide the training on the development of competency-based\ncurricula to enable training providers develop their own curricula with the components\nmentioned below.\n\nDelivery of knowledge requirements for the basic, common and core units of\ncompetency\nspecifically\nin\nthe\nareas\nof\nmathematics,\nscience/technology,\ncommunication/language and other academic subjects shall be contextualized. To this\nend, TVET providers shall develop a Contextual Learning Matrix (CLM) to accompany\ntheir curricula.\n\nCourse Title: MASONRY NC I\n\nNominal Training Duration:\n47 Hours Basic Competencies\n20 Hours Common Competencies\n\n56 Hours Core Competencies\n\n Total 123 Hours\n\nCourse Description:\n\nThis course is designed to provide the learner with knowledge, practical skills and\nattitude, applicable in performing work activities involve in preparing masonry materials, tools\nand equipment and preparing basic masonry works. This includes classroom learning\nactivities and practical work in actual work site or simulation area.\n\nUpon completion of the course, the learners are expected to demonstrate the above-\nmentioned competencies to be employed. To obtain this, all units prescribed for this\nqualification must be achieved.\n\n--- PDF PAGE 77 ---\nMASONRY NC I Revision 01 Promulgated (10/29/2018) 73\nBASIC COMPETENCIES\n(47 HOURS)\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n1. Receive and\nrespond to\nworkplace\ncommunication\n1.1 Follow routine\nspoken messages\n• Exercise Conciseness in\nreceiving and clarifying\nmessages/ information/\ncommunication\n• Group\ndiscussion\n• Interaction\n• Reportorial\n• Modular\n• Interviews/\n• Questioning\n• Practical/\n• Performance\nTest\n• Observation\n4 Hours\n\n1.2 Perform workplace\nduties following\nwritten notices\n• Practice Accuracy in\nfollowing written/ oral\ninstruction/ information\n• Practice written and oral\ncommunication skills\n• Case Study in handling\nwritten communication\n• Practice relaying/\ndisseminating messages/\ninformation\n• Analyze different messages\n\n• Lecture/\n• Discussion\n• Demonstration\n• Case Study\n\n• Written\n• Practical\n• Written\n• Demonstration\n\n4 Hours\n\n--- PDF PAGE 78 ---\nMASONRY NC I Revision 01 Promulgated (10/29/2018) 74\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n2. Work with\nothers\n2.1 Develop effective\nworkplace\nrelationships\n\n• Read job description and\norganizations policies\nrelevant to work role\n• Read personnel code of\nconduct and discipline\n• Role play on cooperation\nand good relationship\n• Study table of organization\nand identify team members\n• Role play on team work.\n• Role play on receiving\nfeedback from supervisor\n• Role play on providing\nfeedback.\n• Listen to lecture on Valuing\nand exemplifying respect\nand empathy in the\nworkplace\n• Individual Work\n• Discussion\n• Role Play\n• Lecture\n• Role Play\n• Structured activity\n• Written Test\n2 Hours\n\n2.2 Contribute to work\ngroup activities\n•\nDiscussion on creative\ncollaboration, social\nperceptiveness and problem\nsensitivity\n•\nRole play on creative\ncollaboration, social\nperceptiveness and problem\nsensitivity.\n•\nParticipate in a goal setting\nactivity\n•\nParticipate in planning and\nimplementation of a group\nactivity.\n•\nParticipate in evaluation of\nthe group activity\n\n• Lecture/\nDiscussion\n• Role Play\n• Group Work\n• Role Play\n• Structured activity\n• Written Test\n1 Hour\n\n--- PDF PAGE 79 ---\nMASONRY NC I Revision 01 Promulgated (10/29/2018) 75\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n3. Solve/address\nroutine\nproblems\n3.1 Identify the problem\n•\nShow mastery of the\ncurrent industry hardware\nand software products and\nservices\n- Show mastery of\nknowledge and\nunderstanding of the\nprocess, normal\noperating parameters,\nand product quality to\nrecognize non-\nstandard situations\n- Relevant equipment\nand operational\nprocesses\n- Enterprise goals,\ntargets and measures\n- Enterprise quality OHS\nand environmental\nrequirement\n- Enterprise information\nsystems and data\ncollation\n- Industry codes and\nstandards\n•\nUse range of formal\nproblem-solving\ntechniques (e.g., planning,\nattention, simultaneous\nand successive processing\nof information)\n•\nIdentify and clarify the\nnature of the problem\n\n• Interactive\nLecture\n• Appreciative\nInquiry\n• Demonstration\n• Case\nFormulation\n• Life Narrative\nInquiry\n(Interview)\n• Standardized\ntest\n\n1 Hour\n\n--- PDF PAGE 80 ---\nMASONRY NC I Revision 01 Promulgated (10/29/2018) 76\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\n3.2 Assess fundamental\ncauses of problem\n\n•\nShow mastery of the\ncurrent industry hardware\nand software products and\nservices\n- Show mastery of\nknowledge and\nunderstanding of the\nprocess, normal\noperating parameters,\nand product quality to\nrecognize non-\nstandard situations\n- Relevant equipment\nand operational\nprocesses\n- Enterprise goals,\ntargets and measures\n- Enterprise quality OHS\nand environmental\nrequirement\n- Enterprise information\nsystems and data\ncollation\n- Industry codes and\nstandards\n•\nUse range of formal\nproblem-solving\ntechniques (e.g., planning,\nattention, simultaneous\nand successive processing\nof information)\n•\nIdentify and clarify the\nnature of the problem\n\n• Group discussion\n• Lecture\n• Demonstration\n• Role play\n• Case\nFormulation\n• Life Narrative\nInquiry\n(Interview)\n• Standardized\ntest\n\n1 Hour\n\n--- PDF PAGE 81 ---\nMASONRY NC I Revision 01 Promulgated (10/29/2018) 77\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\n3.3 Determine\ncorrective action\n•\nShow mastery of the\ncurrent industry hardware\nand software products and\nservices\n- Show mastery of\nknowledge and\nunderstanding of the\nprocess, normal\noperating parameters,\nand product quality to\nrecognize non-\nstandard situations\n- Relevant equipment\nand operational\nprocesses\n- Enterprise goals,\ntargets and measures\n- Enterprise quality OHS\nand environmental\nrequirement\n- Enterprise information\nsystems and data\ncollation\n- Industry codes and\nstandards\n•\nUse range of formal\nproblem-solving\ntechniques (e.g., planning,\nattention, simultaneous\nand successive processing\nof information)\n•\nIdentify and clarify the\nnature of the problem\n\n• Group discussion\n• Lecture\n• Demonstration\n• Role play\n• Case Formulation\n• Life Narrative\nInquiry (Interview)\n• Standardized test\n\n1 Hour\n\n--- PDF PAGE 82 ---\nMASONRY NC I Revision 01 Promulgated (10/29/2018) 78\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\n3.4 Communicate\naction plans and\nrecommendations\nto routine problems\n•\nShow mastery of the\ncurrent industry hardware\nand software products and\nservices\n- Show mastery of\nknowledge and\nunderstanding of the\nprocess, normal\noperating parameters,\nand product quality to\nrecognize non-\nstandard situations\n- Relevant equipment\nand operational\nprocesses\n- Enterprise goals,\ntargets and measures\n- Enterprise quality OHS\nand environmental\nrequirement\n- Enterprise information\nsystems and data\ncollation\n- Industry codes and\nstandards\n•\nUse range of formal\nproblem-solving\ntechniques (e.g., planning,\nattention, simultaneous\nand successive processing\nof information)\n•\nIdentify and clarify the\nnature of the problem\n\n• Group discussion\n• Lecture\n• Demonstration\n• Role playing\n• Case Formulation\n• Life Narrative\nInquiry (Interview)\n• Standardized test\n1 Hour\n\n--- PDF PAGE 83 ---\nMASONRY NC I Revision 01 Promulgated (10/29/2018) 79\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n4. Enhance Self-\nManagement\nSkills\n\n4.1 Set personal and\ncareer goals\n•\nDefine and set personal\ngoals and career goals\n•\nDescribe the SMART\nModel for goal setting\n•\nCreate personal and\ncareer goals using SMART\nModel for goal setting\n•\nExplain and apply the\nprinciples of goal setting\naccording to Locke &\nLatham\n• Discussion\n• Making of\npersonal and\ncareer goals by\nstudents\n• Brainstorming\n• Demonstration or\nsimulation with oral\nquestioning\n• Case problems\ninvolving workplace\ndiversity issues\n\n1 Hour\n\n4.2 Recognize\nemotions\n•\nIdentify common positive\nand negative emotions\nmanifested in the\nworkplace\n•\nDistinguish professional\nand non-professional\nbehaviors in the workplace\n•\nRecognize triggers and\nimplications of positive and\nnegative emotions in the\nworkplace\n•\nRespond with appropriate\nemotions and identify\npossible consequences of\ninappropriate emotional\nresponses in a social and\nwork-related context\n• Discussion\n• Interactive\nLecture\n• Brainstorming\n• Demonstration or\nsimulation with oral\nquestioning\n• Case problems\ninvolving workplace\ndiversity issues\n\n1 Hour\n\n--- PDF PAGE 84 ---\nMASONRY NC I Revision 01 Promulgated (10/29/2018) 80\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\n4.3 Describe oneself as\na learner\n3.1.1 Review Kolb’s Theory of\nLearning Styles\n3.1.2 Describe VAK Learning\nStyle Model (Visual,\nAuditory, Kinesthetic)\n3.1.3 Cite learning strategies\nappropriate to specific\ntasks and describe work\npractices that assist\nlearning\n3.1.4 Identify factors and\nstrategies that assist\nlearning\n3.1.5 Apply learning styles to\npositively influence\nschool/work performance\n3.1.6 Use appropriate learning\nstrategies to improve\nstudy habits and learning\n•\nDiscussion\n•\nInteractive\nLecture\n•\n Brainstorming\n•\nSimulation\n•\nDemonstration or\nsimulation with\noral questioning\n•\nCase problems\ninvolving\nworkplace\ndiversity issues\n\n1 Hour\n\n--- PDF PAGE 85 ---\nMASONRY NC I Revision 01 Promulgated (10/29/2018) 81\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n5. Support\nInnovation\n5.1 Identify the need\nfor innovation in\none’s area of work\n• Show mastery of the clear-\ncut definition of innovation\nand its characteristics\n• Identify the need for\ninnovation in one’s work\narea\n• Identify work procedures\nneeding change\n• Contribute to brainstorming\nsessions with co-workers on\nidentifying tasks needing\nchange\n• Interactive\nLecture\n• Appreciative\nInquiry\n• Demonstration\n• Group work\n• Psychological and\nbehavioral\nInterviews\n• Performance\nEvaluation\n• Life Narrative\nInquiry\n• Review of\nportfolios of\nevidence and third-\nparty workplace\nreports of on-the-\njob performance.\n• Standardized\nassessment of\ncharacter\nstrengths and\nvirtues applied\n1 Hour\n\n--- PDF PAGE 86 ---\nMASONRY NC I Revision 01 Promulgated (10/29/2018) 82\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\n5.2 Recognize\ninnovative and\ncreative ideas\n\n• Identify resources needed\nfor change and potential\nobstacles as well\n• Show positive attitudes and\nbehaviors in accepting and\nin needing change in one’s\nwork area\n• Delineate differences\nbetween creativity and\ninnovation\n• Interactive\nLecture\n• Appreciative\nInquiry\n• Demonstration\n• Group work\n• Psychological and\nbehavioral\nInterviews\n• Performance\nEvaluation\n• Life Narrative\nInquiry\n• Review of\nportfolios of\nevidence and third-\nparty workplace\nreports of on-the-\njob performance.\n• Standardized\nassessment of\ncharacter\nstrengths and\nvirtues applied\n1 Hour\n\n--- PDF PAGE 87 ---\nMASONRY NC I Revision 01 Promulgated (10/29/2018) 83\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\n5.3 Support individuals’\naccess to flexible\nand innovative\nways of working\n• Identify different roles of\nemployees/workers in the\nimprovement of practices in\nthe organization\n• Identify practices for flexible\nand innovative ways of\nworking\n• Share information with co-\nworkers\n• Detect potential problems in\nimplementing flexible ways\nof working\n\n• Interactive\nLecture\n• Appreciative\nInquiry\n• Demonstration\n• Group work\n• Psychological and\nbehavioral\nInterviews\n• Performance\nEvaluation\n• Life Narrative\nInquiry\n• Review of\nportfolios of\nevidence and third-\nparty workplace\nreports of on-the-\njob performance.\n• Standardized\nassessment of\ncharacter\nstrengths and\nvirtues applied\n• Review of\nportfolios of\nevidence and third-\nparty workplace\nreports of on-the-\njob performance.\n• Standardized\nassessment of\ncharacter\nstrengths and\nvirtues applied\n\n1 Hour\n\n--- PDF PAGE 88 ---\nMASONRY NC I Revision 01 Promulgated (10/29/2018) 84\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n6. Access and\nmaintain\ninformation\n\n6.1 Identify and gather\nneeded information\n• Lecture and discussion on:\n-\nPolicies, procedures and\nguidelines relating to\ninformation handling in\nthe public and private\nsector, including\nconfidentiality, privacy,\nsecurity, freedom of\ninformation\n-\nData collection and\nmanagement\nprocedures\n-\nPublic/private sector\nstandards\n• Identify sources to produce\nrequired information\n• Perform exercises on\ninformation gathering\n• Lecture\n• Demonstration\n• Practical\nexercises\n• Oral evaluation\n• Written Test\n• Observation\n3 Hours\n\n6.2 Search for\ninformation on the\ninternet or an\nintranet\n• Lecture and discussion on:\n-\nTechniques in finding\nuseful information\n-\nSearch engines for\ninformation\n• Find and select appropriate\ninformation\n• Perform information\nsearching on the internet\nusing different search\nengines\n• Group\ndiscussion\n• Lecture\n• Demonstration\n• Practical\nexercises\n• Oral evaluation\n• Written Test\n• Observation\n• Presentation\n2 Hours\n\n--- PDF PAGE 89 ---\nMASONRY NC I Revision 01 Promulgated (10/29/2018) 85\n\n6.3 Examine\ninformation\n• Lecture and discussion on:\n-\nData evaluation\nprocedures\n-\nCultural aspects of\ninformation and\nmeaning\n-\nSources of public sector\nwork-related information\n• Evaluation of searched\ninformation\n• Group\ndiscussion\n• Lecture\n• Demonstration\n• Practical\nexercises\n• Oral evaluation\n• Written Test\n• Observation\n• Presentation\n2 Hours\n\n6.4 Secure information\n• Lecture and discussion on:\n- Basic file-handling\ntechniques\n- Techniques in handling,\norganizing and saving\nfiles\n- Electronic and manual\nfiling systems\n• Performance of basic file-\nhandling techniques\n• Application of electronic and\nmanual filing systems\n• Group\ndiscussion\n• Lecture\n• Demonstration\n• Role Play\n• Practical\nexercises\n• Oral evaluation\n• Written Test\n• Observation\n• Presentation\n3 Hours\n\n6.5 Manage\ninformation\n• Lecture and discussion on:\n- Organizational\ninformation handling and\nstorage procedures\n- Databases and data\nstorage systems\n• Managing databases and\ndata storage systems\n• Group\ndiscussion\n• Lecture\n• Demonstration\n• Practical\nexercises\n• Oral evaluation\n• Written Test\n• Observation\n• Presentation\n2 Hours\n7. Follow\nOccupational\nSafety And\nHealth\nPolicies And\nProcedures\n7.1 Identify relevant\noccupational safety\nand health policies\nand procedures\n•\nDiscussion of Risks\nand Hazards\n•\nRisk and Hazard\nIdentification\n\n•\nLecture\n•\nGroup\nDiscussion\n\n•\nWritten Exam\n•\nDemonstration\n•\nObservation\n•\nInterviews /\nQuestioning\n2 Hours\n\n--- PDF PAGE 90 ---\nMASONRY NC I Revision 01 Promulgated (10/29/2018) 86\n\n7.2 Perform relevant\noccupational safety\nand health\nprocedures\n•\nDemonstration of\nproper use of Personal\nProtective Equipment\nand Materials Handling\n•\nPractice Emergency\nPlan\n•\nLecture\n•\nGroup\nDiscussion\n\n•\nWritten Exam\n•\nDemonstration\n•\nObservation\n•\nInterviews /\nQuestioning\n2 Hours\n\n7.3 Comply with\nrelevant\noccupational safety\nand health policies\nand standards\n•\nDiscussion on Personal\nHygiene and\nPreventive Control\nMeasures\n•\nPractice 5S and waste\nsegregation\n•\nLecture\n•\nGroup\nDiscussion\n\n•\nWritten Exam\n•\nDemonstration\n•\nObservation\n•\nInterviews /\nQuestioning\n4 Hours\n8. Apply\nEnvironmental\nWork\nStandards\n8.1 Identify\nenvironmental work\nhazards\n•\nDiscussions in\n-\nReduction in\ngreenhouse gas\nemissions,\n-\nIncrease the share of\nrenewables of gross\nfinal energy\nconsumption,\n-\nLong-term reduction of\nenergy consumption,\n-\nRelease of materials\ninto the environment\nshould, in the long run,\nnot exceed the\nadaptability of the eco-\nsystem,\n-\nDangers and\nunjustifiable risks to\nhuman health\n-\nEnergy and natural\nresource consumption\nand the provision of\ntransport services\n•\nLecture\n•\nGroup\nDiscussion\n\n•\nWritten Exam\n•\nDemonstration\n•\nObservation\n•\nInterviews /\nQuestioning\n1 Hour\n\n--- PDF PAGE 91 ---\nMASONRY NC I Revision 01 Promulgated (10/29/2018) 87\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\n8.2 Follow\nenvironmental work\nprocedures\n•\nDiscussions Protection\nagainst\n- Human Dangers\n- Overconsumption of\nResources\n- Destruction of\nEcosystems\n- Habitat Destructions\n- Extinction of Wildlife\n- Pollutions\n- Water Degradation\n•\nLecture\n•\nGroup\nDiscussion\n•\nDemonstration\n\n•\nWritten Exam\n•\nDemonstration\n•\nObservation\n•\nInterviews /\nQuestioning\n1 Hour\n\n8.3 Comply with\nenvironmental work\nrequirements\n•\nDiscussions\nEnvironmental\nRegulations and its\nrequirements relevant to\nthe industry and work\nactivities\n•\nDemonstration and\nPractice Environmental\nCompliance\n\n•\nLecture\n•\nGroup\nDiscussion\n•\nDemonstration\n\n•\nWritten Exam\n•\nDemonstration\n•\nObservation\n•\nInterviews /\nQuestioning\n\n1 Hour\n9. Adopt\nEntrepreneurial\nMindset in the\nWorkplace\n9.1 Determine\nentrepreneurial\nmindset\n•\nDiscussion on\nEntrepreneurial Mindset\n•\nGames to develop\nentrepreneurial mind set\n•\nLecture\ndiscussion\n•\nGames\n•\nWritten Test\n•\nRole play\n2 Hours\n\n9.2 Identify\nentrepreneurial\npractices\n•\nCase study- quality\nassurance practices\n•\nDiscussion on cost\neffective measures\n•\nDiscussion on Workplace\nquality Policy\n•\nCase study\n•\nLecture\ndiscussion\n•\nWritten Test\n•\nCase Study\n1 Hour\n\n--- PDF PAGE 92 ---\nMASONRY NC I Revision 01 Promulgated (10/29/2018) 88\n\nCOMMON COMPETENCIES\n(20 HOURS)\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n1. Prepare\nconstruction\nmaterials and\ntools\n\n1.1 Identify materials\n\n•\nIdentifying tools according\nto the job requirements\n•\nIdentifying materials and\naccessories according to\nthe job requirements\n• Lecture-\ndemonstration\n• Group\ndiscussion\n• PowerPoint\npresentation\n• Demonstration\nwith oral\nquestioning\n• Written\nexamination\n• Portfolio\n(credentials)\n\n1 Hour\n\n1.2 Requisition\n materials\n•\nPreparing material take-off\n•\nRequesting materials and\ntools\n• Simulation\n• Discussion\n• Demonstration\nwith oral\nquestioning\n1 Hour\n\n1.3 Receive and\ninspect materials\n•\nChecking and inspecting\nmaterials and tools\n•\nStoring/ stacking of tool\nand materials\n• Practical\nExercise\n• Demonstration\n• Written / Oral\nTest\n• Demonstration\nwith oral\nquestioning\n2 Hours\n\n2. Observe\nprocedures,\nspecifications\nand manuals of\ninstructions\n2.1 Identify and access\nspecification/\nmanuals\n•\nIdentifying manuals and\nspecifications\n•\nAccessing information and\ndata\n• Lecture-\ndemonstration\n• Demonstration\nwith oral\nquestioning\n• Written\nexamination\n2 Hours\n\n2.2 Interpret manuals\n•\nInterpreting symbols and\nspecifications\n• Accessing information and\ndata\n• Applying conversion of\nunits of measurements\n\n• Actual\ndemonstration\n• Group\ndiscussion\n• Demonstration\nwith oral\nquestioning\n• Written\nexamination\n\n2 Hours\n\n--- PDF PAGE 93 ---\nMASONRY NC I Revision 01 Promulgated (10/29/2018) 89\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n\n2.3 Apply information\nin manual\n• Applying information from\nmanuals\n• Demonstration\n• Group\ndiscussion\n• Demonstration\nwith oral\nquestioning\n2 Hours\n\n2.4 Store Manual\n• Storing and maintaining\nmanuals\n• Demonstration\n• Group\ndiscussion\n• Demonstration\nwith oral\nquestioning\n• Practical and\noral exam\n2 Hours\n\n3. Perform\nmensurations\nand\ncalculations\n4.1 Select measuring\ninstruments\n\n• Selecting measuring\ninstruments\n• Lecture-\ndemonstration\n• Group\ndiscussion\n• Demonstration\nwith oral\nquestioning\n\n2 Hours\n\n4.2 Carry out\nmeasurements and\ncalculations\n\n• Interpreting formulas for\nvolume, areas, perimeters of\nplane and geometric figures\n• Handling of measuring\ninstruments\n\n• Group\ndiscussion\n• Practical Lab\n• Demonstration\n• Written\nexamination\n• Third party\nreport\n• Demonstration\nwith oral\nquestioning\n2 Hours\n\n--- PDF PAGE 94 ---\nMASONRY NC I Revision 01 Promulgated (10/29/2018) 90\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n4. Maintain tools\nand equipment\n5.1 Check condition of\ntools and\nequipment\n\n• Maintaining tools and\nequipment\n• Handling of tools and\nequipment\n• Identifying tools and\nequipment defects\n• Lecture-\ndemonstration\n• Group\ndiscussion\n• Demonstration\nwith oral\nquestioning\n\n1 Hour\n\n5.2 Perform basic\npreventive\nmaintenance\n• Handling of tools and\nequipment\n• Performing preventive\nmaintenance\n\n• Simulation\n• Group\ndiscussion\n• Practical Lab\n• Demonstration\n\n• Written\nexamination\n• Third party report\n• Demonstration\nwith oral\nquestioning\n2 Hours\n\n5.3 Store tools and\nequipment\n• Storing tools and equipment\n• Handling of tools and\nequipment\n• Demonstration\n• Group\ndiscussion\n• Practical Lab\n• Practical exam\n• Written\nexamination\n• Demonstration\nwith oral\nquestioning\n\n1 Hour\n\n--- PDF PAGE 95 ---\nMASONRY NC I Revision 01 Promulgated (10/29/2018) 91\nCORE COMPETENCIES\n( 56 HOURS)\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n1. Prepare masonry\nmaterials\n1.1 Gather materials to\nbe hauled\n\n• Identify and explain the\ncomposition, uses and\ntypes of masonry\nmaterials\n• Select and use\nappropriate PPE to\nspecific tasks\n• Enumerate and explain\nthe basic methods and\nprocesses in masonry\nconstruction\n• Practicing 3R and 5S\n• Identify and describe safe\nwork practices and first aid\nregulations\n• Perform safe work\npractices and respond to\nemergency situations\n• Measuring work productivity\n• Utilizing most productive\npractice\n• Lecture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nwith oral\nquestioning\n\n8 Hours\n\n--- PDF PAGE 96 ---\nMASONRY NC I Revision 01 Promulgated (10/29/2018) 92\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\n1.2 Haul/transport\nmaterials\n\n• Identify hauling equipment\nfor specific material\n• Enumerate and explain\nthe basic methods and\nprocesses in\nhauling/transporting\nmaterials\n• Select and use\nappropriate PPE to\nspecific tasks\n• Identify and describe safe\nwork practices and first aid\nregulations\n• Practicing 3R and 5S\n• Perform safe work\npractices and respond to\nemergency situations.\n• Measuring work productivity\n• Utilizing most productive\npractice\n\n• Lecture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nwith oral\nquestioning\n\n--- PDF PAGE 97 ---\nMASONRY NC I Revision 01 Promulgated (10/29/2018) 93\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n\n1.3 Stockpile hauled\nmaterials\n\n• Identify location of\nstockpiling for specific\nmaterials\n• Enumerate and explain the\nbasic methods and\nprocesses in stockpiling\n• Select and use appropriate\nPPE to specific tasks\n• Identify and describe safe\nwork practices and first aid\nregulations\n• Perform safe work practices\nand respond to emergency\nsituations\n• Practicing 3R and 5S\n• Measuring work productivity\n• Utilizing most productive\npractice\n• Lecture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nwith oral\nquestioning\n\n2. Prepare\nmasonry tools\nand equipment\n2.1 Select tools and\nequipment\n• Identify and explain the uses\nof tools and equipment in\nbasic masonry works\n• Identify and describe safety\npractices in operating tools\nand equipment\n• Select and use appropriate\nPPE to specific tasks\n• Practicing 3R and 5S\n• Lecture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nwith oral\nquestioning\n\n8 Hours\n2.2 Transfer tools and\nequipment\n•\nExplain safe handling and\ntransferring procedures of\ntools and equipment\n•\nMeasuring work productivity\n•\nUtilizing most productive\npractice\n•\n Practicing 3R and 5S\n\n• Lecture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nwith oral\nquestioning\n\n--- PDF PAGE 98 ---\nMASONRY NC I Revision 01 Promulgated (10/29/2018) 94\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n3. Perform basic\nmasonry works\n3.1 Perform\nexcavation and\nback filling /\ncompaction\n•\nSelect and use appropriate\nPPE to specific tasks\n•\nExplain excavation\nprocedures based on\nexisting conditions\n•\nExplain\nbackfilling/compaction\nprocedures based on\nexisting conditions\n•\nPerform safe work\npractices and respond to\n emergency situations\n•\nMeasuring work productivity\n•\nUtilizing most productive\npractice\n•\nPracticing 3R and 5S\n• Lecture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nwith oral\nquestioning\n\n40 Hours\n3.2 Perform basic\nrebar\nfabrication\n\n•\nIdentify re-bar sizes\n•\nExplain cutting, bending and\ntagging procedures\n•\nMeasuring work productivity\n•\nUtilizing most productive\npractice\n•\nPracticing 3R and 5S\n• Lecture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nwith oral\nquestioning\n\n3.3 Erect and\ndismantle working\nplatform\n•\nIdentify scaffolds\nparts/components\n•\nExplain scaffold erection and\ndismantle procedures\n•\nMeasuring work productivity\n•\nUtilizing most productive\npractice\n•\nPracticing 3R and 5S\n• Lecture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nwith oral\nquestioning\n\n--- PDF PAGE 99 ---\nMASONRY NC I Revision 01 Promulgated (10/29/2018) 95\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n\n3.4 Fabricate and\nstrip basic\nformworks\n•\nIdentify formworks\nparts/components\n•\nExplain fabrication,\ninstallation and stripping\nprocedures\n•\nMeasuring work productivity\n•\nUtilizing most productive\npractice\n•\nPracticing 3R and 5S\n\n• Lecture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nwith oral\nquestioning\n\n3.5 Mix mortar\n•\nDetermine quantity of mortar\nmaterials\n•\nExplain mixing procedures\n•\nMeasuring work productivity\n•\nUtilizing most productive\npractice\n•\nPracticing 3R and 5S\n\n• Lecture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nwith oral\nquestioning\n\n3.6 Mix concrete\n•\nDetermine quantity of\nconcrete materials\n•\nExplain mixing procedures\n•\nMeasuring work productivity\n•\nUtilizing most productive\npractice\n•\nPracticing 3R and 5S\n• Lecture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nwith oral\nquestioning\n3.7 Perform\nconcreting work\n•\nExplain conveying,\ndepositing, consolidation,\nfinishing and curing\nprocedures\n•\nMeasuring work productivity\n•\nUtilizing most productive\npractice\n•\nPracticing 3R and 5S\n• Lecture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nwith oral\nquestioning\n\n--- PDF PAGE 100 ---\nMASONRY NC I Revision 01 Promulgated (10/29/2018) 96\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n\n3.8 Perform basic\nblock laying\n•\nIdentify and explain methods\nof laying blocks\n•\nEnumerate block laying\nprocedures\n•\nMeasuring work productivity\n•\nUtilizing most productive\npractice\n•\nPracticing 3R and 5S\n\n• Lecture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nwith oral\nquestioning\n\n3.9 Perform\nhousekeeping\n•\nExplain 3R and 5S\n• Lecture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nwith oral\nquestioning\n\n--- PDF PAGE 101 ---\nMASONRY NC I Revision 01 Promulgated (10/29/2018)\n97\n\n3.2\nTRAINING DELIVERY\n\n1. The delivery of training shall adhere to the design of the curriculum.\nDelivery shall be guided by the principles of competency-based TVET.\n\na. Course design is based on competency standards set by the industry\nor recognized industry sector; (Learning system is driven by\ncompetencies written to industry standards)\n\nb. Training delivery is learner-centered and should accommodate\nindividualized and self-paced learning strategies;\n\nc. Training can be done on an actual workplace setting, simulation of a\nworkplace and/or through adoption of modern technology.\n\nd. Assessment is based in the collection of evidence of the performance\nof work to the industry required standards;\n\ne. Assessment of competency takes the trainee’s knowledge and\nattitude into account but requires evidence of actual performance of\nthe competency as the primary source of evidence.\n\nf. Training program allows for recognition of prior learning (RPL) or\ncurrent competencies;\n\ng. Training completion is based on satisfactory completion of all\nspecified competencies not on the specified nominal duration of\nlearning.\n\n2. The competency-based TVET system recognizes various types of\ndelivery modes, both on-and off-the-job as long as the learning is driven\nby the competency standards specified by the industry. The following\ntraining modalities and their variations/components may be adopted\nsingly or in combination with other modalities when designing and\ndelivering training programs:\n\n2.1 Institution- Based:\n\n• Dual Training System (DTS)/Dualized Training Program (DTP)\nwhich contain both in-school and in-industry training or fieldwork\ncomponents. Details can be referred to the Implementing Rules\nand Regulations of the DTS Law and the TESDA Guidelines on\nthe DTP;\n\n--- PDF PAGE 102 ---\nMASONRY NC I Revision 01 Promulgated (10/29/2018) 98\n\n• Distance learning is a formal education process in which\nmajority of the instruction occurs when the students and\ninstructor are not in the same place. Distance learning may\nemploy\ncorrespondence\nstudy,\naudio,\nvideo,\ncomputer\ntechnologies or other modern technology that can be used to\nfacilitate learning and formal and non-formal training. Specific\nguidelines on this mode shall be issued by the TESDA\nSecretariat.\n\n• The traditional classroom-based or in-center instruction may be\nenhanced through use of learner-centered methods as well as\nlaboratory or field-work components.\n\n2.2 Enterprise-Based:\n\n• Formal Apprenticeship – Training within employment involving a\ncontract between an apprentice and an enterprise on an\napproved apprenticeable occupation.\n\n• Informal Apprenticeship - is based on a training (and working)\nagreement between an apprentice and a master craftsperson\nwherein the agreement may be written or oral and the master\ncraftsperson commits to training the apprentice in all the skills\nrelevant to his or her trade over a significant period of time,\nusually between one and four years, while the apprentice\ncommits to contributing productively to the work of the business.\nTraining is integrated into the production process and\napprentices learn by working alongside the experienced\ncraftsperson.\n\n• Enterprise-based Training- where training is implemented within\nthe company in accordance with the requirements of the specific\ncompany. Specific guidelines on this mode shall be issued by\nthe TESDA Secretariat.\n\n2.3 Community-Based – Community-Based – short term programs\nconducted by non-government organizations (NGOs), LGUs,\ntraining centers and other TVET providers which are intended to\naddress the specific needs of a community. Such programs can be\nconducted in informal settings such as barangay hall, basketball\ncourts, etc. These programs can also be mobile training program\n(MTP).\n\n--- PDF PAGE 103 ---\nMASONRY NC I Revision 01 Promulgated (10/29/2018) 99\n\n3.1 TRAINEE ENTRY REQUIREMENTS\n\nTrainees or students who wish to enter this training should possess the\nfollowing requirements:\n\n• Can communicate both orally and in writing\n• Can perform basic arithmetic operation\n• Physically fit\n\n--- PDF PAGE 104 ---\nMASONRY NC I Revision 01 Promulgated (10/29/2018) 100\n\n3.2 LIST OF TOOLS, EQUIPMENT AND MATERIALS\n\nList of tools, equipment and materials for the training of a maximum of 25\ntrainees for MASONRY NC I are as follows:\n\nA. (Full Qualification)\n\nTOOLS\nQTY\nDESCRIPTION\n10 pcs.\nBucket / Pail\n1 pc.\nMixing board\n(4x8 feet)\n12 pcs.\nShovel, flat\n25 pcs.\nSteel trowel\n(8 inches straight-edged pointed)\n25 pcs.\nWooden float\n25 pcs.\nSteel tape (5 meters)\n5 pcs.\nPlumb bob\n2 sets\nScaffolding\n(2 layers, 1.2 meters)\n5 pcs.\nChalk line\n5 pcs.\nCross-cut saw (18 inches)\n2 pcs.\nBar cutter\n2 pcs.\nBar bender\n5 pcs.\nSteel square\n5 pcs.\nCold chisel\n5 pcs.\nHacksaw\n5 pcs.\nLevel hose\n(5 meters)\n25 pcs.\nClaw hammer\n5 pcs.\nMeasuring box\n\n--- PDF PAGE 105 ---\nMASONRY NC I Revision 01 Promulgated (10/29/2018) 101\nTOOLS\nQTY\nDESCRIPTION\n5 pcs.\nHack saw blade\n5 pcs.\nSteel brush\n5 pcs.\nWheelbarrow\n5 pcs.\nCrow bar, 18 inches\n5 pcs.\nManual tampering tool\n1 pc.\nConcrete vibrator\n5 pcs.\nLevel bar\n\nEQUIPMENT\nQTY\nDESCRIPTION\n1 unit\nOne bagger mixer (gas operated)\n2 pcs.\nBlock cutter (7 inches blade diameter)\n\nMATERIAL\nQTY\nDESCRIPTION\n250 pcs.\nConcrete Hollow blocks ( 4 inches)\n10 bags\nCement\n25 pcs.\nReinforcing bars (10 mm diameter)\n3 m3\nSand\nVar\nWater\n5 kls.\nGI wire, #20\n10 kls.\nCommon wire Nails (assorted sizes)\n30 pcs.\nLumber (2” x 2” x 10’)\n\n--- PDF PAGE 106 ---\nMASONRY NC I Revision 01 Promulgated (10/29/2018) 102\nMATERIAL\nQTY\nDESCRIPTION\n2.5 kls.\nConcrete nails\n(1 1/2 inch)\n5 bags\nLime\n25 pcs.\nPencil\n5 rolls\nNylon string (5 meter length)\n2.5 m3\nGravel (¾ inch)\n5 m\nSand Screen (100mm)\n10 pcs\nPlywood\n(½” X 4’ X 8’)\n\nPERSONAL PROTECTIVE EQUIPMENT (PPE)\nQTY\nDESCRIPTION\nOne per trainee\nSafety shoes/ rubber boots (Trainee to provide)\nOne per trainee\nProper uniform/clothing (Trainee to provide)\nOne per trainee\nGloves (cotton) (Trainee to provide)\nOne per trainee\nSafety goggles (Trainee to provide)\n25 pcs.\nReflectorized vest\n\n--- PDF PAGE 107 ---\nMASONRY NC I Revision 01 Promulgated (10/29/2018) 103\n\n3.5 TRAINING FACILITIES\n\nThe masonry workshop must be of concrete structure. Based on class size\nof 25 students/trainees the space requirements for the teaching/learning and\ncirculation areas are as follows:\n\nSpace Requirement\nSize in Meters\nArea in\nSq. Meters\nPractical Training Area\n20 x 25\n500\nLibrary\n4 x 5\n20\nLecture Room\n8 x 6\n\n48\nTool Room/Storage\n4 x 5\n20\nWash room/Toilet\n4 x 5\n\n20\nCirculation area\n10 x 6\n\n60\nTOTAL AREA\n\n668\n\n--- PDF PAGE 108 ---\nMASONRY NC I Revision 01 Promulgated (10/29/2018) 104\n\n3.6 TRAINERS’ QUALIFICATION\n\n• Holder of National TVET Trainer Certificate Level I (NTTC Level I) in\nMASONRY NC II\n• Must have completed the 40-Hour Construction Occupational Safety\nand Health (COSH) per Department Order No. 13 s. 1998, Guidelines\nGoverning Occupational Safety and Health in the Construction\nIndustry conducted by OSHC and DOLE accredited Safety Training\nOrganizations\n• Must have had at least 2-years job/industry experience in Masonry\n\n3.7 INSTITUTIONAL ASSESSMENT\n\nInstitutional assessment is undertaken by trainees to determine their\nachievement of units of competency. A certificate of achievement is\nissued for each unit of Competency.\n\n--- PDF PAGE 109 ---\nMASONRY NC I Revision 01 Promulgated (10/29/2018) 105"
