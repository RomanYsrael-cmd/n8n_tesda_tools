      "source_text": "3.1\nCURRICULUM DESIGN\n\nTESDA shall provide the training on the development of competency-based\ncurricula to enable training providers develop their own curricula with the components\nmentioned below.\n\nDelivery of knowledge requirements for the basic, common and core units of\ncompetency\nspecifically\nin\nthe\nareas\nof\nmathematics,\nscience/technology,\ncommunication/language and other academic subjects shall be contextualized. To this\nend, TVET providers shall develop a Contextual Learning Matrix (CLM) to accompany\ntheir curricula.\n\nCourse Title: MASONRY NC I\n\nNominal Training Duration:\n47 Hours Basic Competencies\n20 Hours Common Competencies\n\n56 Hours Core Competencies\n\n Total 123 Hours\n\nCourse Description:\n\nThis course is designed to provide the learner with knowledge, practical skills and\nattitude, applicable in performing work activities involve in preparing masonry materials, tools\nand equipment and preparing basic masonry works. This includes classroom learning\nactivities and practical work in actual work site or simulation area.\n\nUpon completion of the course, the learners are expected to demonstrate the above-\nmentioned competencies to be employed. To obtain this, all units prescribed for this\nqualification must be achieved.\n\n--- PDF PAGE 77 ---\nMASONRY NC I Revision 01 Promulgated (10/29/2018) 73\nBASIC COMPETENCIES\n(47 HOURS)\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n1. Receive and\nrespond to\nworkplace\ncommunication\n1.1 Follow routine\nspoken messages\n• Exercise Conciseness in\nreceiving and clarifying\nmessages/ information/\ncommunication\n• Group\ndiscussion\n• Interaction\n• Reportorial\n• Modular\n• Interviews/\n• Questioning\n• Practical/\n• Performance\nTest\n• Observation\n4 Hours\n\n1.2 Perform workplace\nduties following\nwritten notices\n• Practice Accuracy in\nfollowing written/ oral\ninstruction/ information\n• Practice written and oral\ncommunication skills\n• Case Study in handling\nwritten communication\n• Practice relaying/\ndisseminating messages/\ninformation\n• Analyze different messages\n\n• Lecture/\n• Discussion\n• Demonstration\n• Case Study\n\n• Written\n• Practical\n• Written\n• Demonstration\n\n4 Hours\n\n--- PDF PAGE 78 ---\nMASONRY NC I Revision 01 Promulgated (10/29/2018) 74\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n2. Work with\nothers\n2.1 Develop effective\nworkplace\nrelationships\n\n• Read job description and\norganizations policies\nrelevant to work role\n• Read personnel code of\nconduct and discipline\n• Role play on cooperation\nand good relationship\n• Study table of organization\nand identify team members\n• Role play on team work.\n• Role play on receiving\nfeedback from supervisor\n• Role play on providing\nfeedback.\n• Listen to lecture on Valuing\nand exemplifying respect\nand empathy in the\nworkplace\n• Individual Work\n• Discussion\n• Role Play\n• Lecture\n• Role Play\n• Structured activity\n• Written Test\n2 Hours\n\n2.2 Contribute to work\ngroup activities\n•\nDiscussion on creative\ncollaboration, social\nperceptiveness and problem\nsensitivity\n•\nRole play on creative\ncollaboration, social\nperceptiveness and problem\nsensitivity.\n•\nParticipate in a goal setting\nactivity\n•\nParticipate in planning and\nimplementation of a group\nactivity.\n•\nParticipate in evaluation of\nthe group activity\n\n• Lecture/\nDiscussion\n• Role Play\n• Group Work\n• Role Play\n• Structured activity\n• Written Test\n1 Hour\n\n--- PDF PAGE 79 ---\nMASONRY NC I Revision 01 Promulgated (10/29/2018) 75\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n3. Solve/address\nroutine\nproblems\n3.1 Identify the problem\n•\nShow mastery of the\ncurrent industry hardware\nand software products and\nservices\n- Show mastery of\nknowledge and\nunderstanding of the\nprocess, normal\noperating parameters,\nand product quality to\nrecognize non-\nstandard situations\n- Relevant equipment\nand operational\nprocesses\n- Enterprise goals,\ntargets and measures\n- Enterprise quality OHS\nand environmental\nrequirement\n- Enterprise information\nsystems and data\ncollation\n- Industry codes and\nstandards\n•\nUse range of formal\nproblem-solving\ntechniques (e.g., planning,\nattention, simultaneous\nand successive processing\nof information)\n•\nIdentify and clarify the\nnature of the problem\n\n• Interactive\nLecture\n• Appreciative\nInquiry\n• Demonstration\n• Case\nFormulation\n• Life Narrative\nInquiry\n(Interview)\n• Standardized\ntest\n\n1 Hour\n\n--- PDF PAGE 80 ---\nMASONRY NC I Revision 01 Promulgated (10/29/2018) 76\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\n3.2 Assess fundamental\ncauses of problem\n\n•\nShow mastery of the\ncurrent industry hardware\nand software products and\nservices\n- Show mastery of\nknowledge and\nunderstanding of the\nprocess, normal\noperating parameters,\nand product quality to\nrecognize non-\nstandard situations\n- Relevant equipment\nand operational\nprocesses\n- Enterprise goals,\ntargets and measures\n- Enterprise quality OHS\nand environmental\nrequirement\n- Enterprise information\nsystems and data\ncollation\n- Industry codes and\nstandards\n•\nUse range of formal\nproblem-solving\ntechniques (e.g., planning,\nattention, simultaneous\nand successive processing\nof information)\n•\nIdentify and clarify the\nnature of the problem\n\n• Group discussion\n• Lecture\n• Demonstration\n• Role play\n• Case\nFormulation\n• Life Narrative\nInquiry\n(Interview)\n• Standardized\ntest\n\n1 Hour\n\n--- PDF PAGE 81 ---\nMASONRY NC I Revision 01 Promulgated (10/29/2018) 77\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\n3.3 Determine\ncorrective action\n•\nShow mastery of the\ncurrent industry hardware\nand software products and\nservices\n- Show mastery of\nknowledge and\nunderstanding of the\nprocess, normal\noperating parameters,\nand product quality to\nrecognize non-\nstandard situations\n- Relevant equipment\nand operational\nprocesses\n- Enterprise goals,\ntargets and measures\n- Enterprise quality OHS\nand environmental\nrequirement\n- Enterprise information\nsystems and data\ncollation\n- Industry codes and\nstandards\n•\nUse range of formal\nproblem-solving\ntechniques (e.g., planning,\nattention, simultaneous\nand successive processing\nof information)\n•\nIdentify and clarify the\nnature of the problem\n\n• Group discussion\n• Lecture\n• Demonstration\n• Role play\n• Case Formulation\n• Life Narrative\nInquiry (Interview)\n• Standardized test\n\n1 Hour\n\n--- PDF PAGE 82 ---\nMASONRY NC I Revision 01 Promulgated (10/29/2018) 78\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\n3.4 Communicate\naction plans and\nrecommendations\nto routine problems\n•\nShow mastery of the\ncurrent industry hardware\nand software products and\nservices\n- Show mastery of\nknowledge and\nunderstanding of the\nprocess, normal\noperating parameters,\nand product quality to\nrecognize non-\nstandard situations\n- Relevant equipment\nand operational\nprocesses\n- Enterprise goals,\ntargets and measures\n- Enterprise quality OHS\nand environmental\nrequirement\n- Enterprise information\nsystems and data\ncollation\n- Industry codes and\nstandards\n•\nUse range of formal\nproblem-solving\ntechniques (e.g., planning,\nattention, simultaneous\nand successive processing\nof information)\n•\nIdentify and clarify the\nnature of the problem\n\n• Group discussion\n• Lecture\n• Demonstration\n• Role playing\n• Case Formulation\n• Life Narrative\nInquiry (Interview)\n• Standardized test\n1 Hour\n\n--- PDF PAGE 83 ---\nMASONRY NC I Revision 01 Promulgated (10/29/2018) 79\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n4. Enhance Self-\nManagement\nSkills\n\n4.1 Set personal and\ncareer goals\n•\nDefine and set personal\ngoals and career goals\n•\nDescribe the SMART\nModel for goal setting\n•\nCreate personal and\ncareer goals using SMART\nModel for goal setting\n•\nExplain and apply the\nprinciples of goal setting\naccording to Locke &\nLatham\n• Discussion\n• Making of\npersonal and\ncareer goals by\nstudents\n• Brainstorming\n• Demonstration or\nsimulation with oral\nquestioning\n• Case problems\ninvolving workplace\ndiversity issues\n\n1 Hour\n\n4.2 Recognize\nemotions\n•\nIdentify common positive\nand negative emotions\nmanifested in the\nworkplace\n•\nDistinguish professional\nand non-professional\nbehaviors in the workplace\n•\nRecognize triggers and\nimplications of positive and\nnegative emotions in the\nworkplace\n•\nRespond with appropriate\nemotions and identify\npossible consequences of\ninappropriate emotional\nresponses in a social and\nwork-related context\n• Discussion\n• Interactive\nLecture\n• Brainstorming\n• Demonstration or\nsimulation with oral\nquestioning\n• Case problems\ninvolving workplace\ndiversity issues\n\n1 Hour\n\n--- PDF PAGE 84 ---\nMASONRY NC I Revision 01 Promulgated (10/29/2018) 80\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\n4.3 Describe oneself as\na learner\n3.1.1 Review Kolb’s Theory of\nLearning Styles\n3.1.2 Describe VAK Learning\nStyle Model (Visual,\nAuditory, Kinesthetic)\n3.1.3 Cite learning strategies\nappropriate to specific\ntasks and describe work\npractices that assist\nlearning\n3.1.4 Identify factors and\nstrategies that assist\nlearning\n3.1.5 Apply learning styles to\npositively influence\nschool/work performance\n3.1.6 Use appropriate learning\nstrategies to improve\nstudy habits and learning\n•\nDiscussion\n•\nInteractive\nLecture\n•\n Brainstorming\n•\nSimulation\n•\nDemonstration or\nsimulation with\noral questioning\n•\nCase problems\ninvolving\nworkplace\ndiversity issues\n\n1 Hour\n\n--- PDF PAGE 85 ---\nMASONRY NC I Revision 01 Promulgated (10/29/2018) 81\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n5. Support\nInnovation\n5.1 Identify the need\nfor innovation in\none’s area of work\n• Show mastery of the clear-\ncut definition of innovation\nand its characteristics\n• Identify the need for\ninnovation in one’s work\narea\n• Identify work procedures\nneeding change\n• Contribute to brainstorming\nsessions with co-workers on\nidentifying tasks needing\nchange\n• Interactive\nLecture\n• Appreciative\nInquiry\n• Demonstration\n• Group work\n• Psychological and\nbehavioral\nInterviews\n• Performance\nEvaluation\n• Life Narrative\nInquiry\n• Review of\nportfolios of\nevidence and third-\nparty workplace\nreports of on-the-\njob performance.\n• Standardized\nassessment of\ncharacter\nstrengths and\nvirtues applied\n1 Hour\n\n--- PDF PAGE 86 ---\nMASONRY NC I Revision 01 Promulgated (10/29/2018) 82\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\n5.2 Recognize\ninnovative and\ncreative ideas\n\n• Identify resources needed\nfor change and potential\nobstacles as well\n• Show positive attitudes and\nbehaviors in accepting and\nin needing change in one’s\nwork area\n• Delineate differences\nbetween creativity and\ninnovation\n• Interactive\nLecture\n• Appreciative\nInquiry\n• Demonstration\n• Group work\n• Psychological and\nbehavioral\nInterviews\n• Performance\nEvaluation\n• Life Narrative\nInquiry\n• Review of\nportfolios of\nevidence and third-\nparty workplace\nreports of on-the-\njob performance.\n• Standardized\nassessment of\ncharacter\nstrengths and\nvirtues applied\n1 Hour\n\n--- PDF PAGE 87 ---\nMASONRY NC