ermine quantity of\nconcrete materials\n•\nExplain mixing procedures\n•\nMeasuring work productivity\n•\nUtilizing most productive\npractice\n•\nPracticing 3R and 5S\n• Lecture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nwith oral\nquestioning\n3.7 Perform\nconcreting work\n•\nExplain conveying,\ndepositing, consolidation,\nfinishing and curing\nprocedures\n•\nMeasuring work productivity\n•\nUtilizing most productive\npractice\n•\nPracticing 3R and 5S\n• Lecture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nwith oral\nquestioning\n\n--- PDF PAGE 100 ---\nMASONRY NC I Revision 01 Promulgated (10/29/2018) 96\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n\n3.8 Perform basic\nblock laying\n•\nIdentify and explain methods\nof laying blocks\n•\nEnumerate block laying\nprocedures\n•\nMeasuring work productivity\n•\nUtilizing most productive\npractice\n•\nPracticing 3R and 5S\n\n• Lecture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nwith oral\nquestioning\n\n3.9 Perform\nhousekeeping\n•\nExplain 3R and 5S\n• Lecture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nwith oral\nquestioning\n\n--- PDF PAGE 101 ---\nMASONRY NC I Revision 01 Promulgated (10/29/2018)\n97"
