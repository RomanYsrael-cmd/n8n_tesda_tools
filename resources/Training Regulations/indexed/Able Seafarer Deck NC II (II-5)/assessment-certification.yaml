  "source_text": "SECTION 4 NATIONAL ASSESSSMENT AND CERTIFICATION ARRANGEMENTS \n \nAssessment of an individual’s competence leads to the issuance of a Certificate of Proficiency \n(COP) in the relevant unit of competency. \n \nA Certificate of Proficiency (COP) is issued when a candidate has demonstrated competence in all \nthe units of competency that comprise the relevant promulgated qualification. \n \n1. \nCandidate wanting to be certified will have to be assessed in accordance with the \nrequirements identified in the evidence guide of the relevant unit/s of competency. As a \nrule, the unit/s of competency shall be the benchmark for all assessment under the Training \nRegulations for Maritime Sector. \n \n2. \nCandidate must have completed the prescribed course of instruction or acquired all the \nunits of competency contained in this Training Regulation and with equivalent sea service \nexperience. The following are qualified to apply for assessment and certification: \n \n \nHolder of COP for Rating Forming Part of Navigational Watch NC II (STCW Regulation \nII/4); and \n \nHave completed TESDA-registered training program for ABLE SEAFARER DECK \ninclusive of an approved sea going service in the deck department of not less than \ntwelve (12) months on board seagoing vessel of 500 GRT or more, supported by an \naccomplished Training Record Book as prescribed by the TESDA/MARINA; OR \n \nMinimum eighteen (18) months sea going service in the deck department and qualified \nas a rating forming part of a navigational watch on board seagoing vessel of 500 GRT \nor more, evidenced by a certificate from the manning agency/shipping company which \nmust be reflected in the Seafarers’ Identification and Record Book (SIRB) and in \naddition, a duly accomplished Training Record Book as prescribed by the \nTESDA/MARINA. \n \n3. \nCandidates for a COP shall be required to undergo assessment using the methods \nidentified in the units of competency. \n \n4. \nConduct of assessment and issuance of certificates shall follow the procedures manuals \nand implementing guidelines developed for the assessment and certification of Able \nSeafarer Deck as institutionalized by and between TESDA and MARINA through a \nMemorandum of Agreement (MOA). \n \n5. \nCandidates who are found to be competent under the qualification for Able Seafarer Deck \nas contained in Section 1 shall be awarded with the corresponding Certificate of Proficiency \n(COP).\n\n--- PDF PAGE 69 ---\nTR-Able Seafarer Deck NC II (STCW Regulation II/5) \nRevised June 26, 2013 \n65 \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \nCORE \nCOMPETENCIES \n \n \nCOMMON \nCOMPETENCIES\n \n \nBASIC \nCOMPETENCIES\n \nCOMPETENCY MAP \nFor Maritime Sector \nPerform \nmaintenance and \nsanitation of galley \nequipment and \nPerform cargo \nhandling and \nstowage at the \nsupport level \nPerform marine \nengineering at \nthe support level \nCarry out a watch \nroutine appropriate to \nthe duties of rating \nforming part of an \nengine room watch \nSteer the ship and \nalso comply with \nhelm orders in the \nEnglish language \nPerform \nvictualing \nservices \nPerform \nhousekeeping \nservices \nPerform safe usage \nof electrical \nequipment at the \nsupport level \nMaintain the \ncorrect boiler \nwater levels and \nsteam pressure \nKeep a proper \nlook-out by sight \nand hearing \nSupervise the \nmaintenance and \nsanitation of galley \nequipment and \nutensils and related \nareas \nPerform mess hall \nservice \nPerform \nmaintenance and \nrepair at the \nsupport level \nOperate emergency \nequipment and apply \nemergency \nprocedures \nContribute to \nmonitoring and \ncontrolling a safe \nwatch \nProvide assistance \nin receiving and \nstoring provisions \nAssist engineer \nin the \nmaintenance of \nmain engine \nOperate emergency \nequipment and apply \nemergency \nprocedures \nPrepare and \ncook meat dishes \nPrepare stocks, \nsauces and soups \nEstablish and \nmaintain catering \nstandards \nControl the \noperation of the \nship and care for \npersons on board at \nthe support level\nPerform \nnavigation at \nthe support level \nSupervise \npreparation of \nmeals \nPrepare bread \nproducts and hot \nand cold desserts \nPrepare and \ncook seafood \nPrepare and \ncook poultry \nproducts \nPrepare side \ndishes and \nbreakfast meal \nPrepare \nappetizers, salads \nand sandwiches \n(hot and cold and \nopen) \nTake precautions to \nprevent pollution of \nthe marine \nenvironment\nComply with \nemergency \nprocedures \nTake immediate \naction upon \nencountering an \naccident or other \nmedical emergency \nFight and \nextinguish fire \nMinimize the risk of \nfire and maintain a \nstate of readiness to \nrespond emergency \nsituations involving \nfi\nSurvive at sea in \nthe event of ship \nabandonment \nPerform stock \ncontrol \nWork within \nmulti-cultural and \nreligious \nenvironment \nProtect marine \nenvironment/ waste \nsegregation mgmt. \nObserve catering \nhealth and safety \npractices \nPractice food \nsafety, sanitation \nand hygiene \nObserve \npersonal hygiene \nObserve safe \nworking \npractices \nLead small teams \nLead in workplace \ncommunication \nWork in team \nenvironment \nParticipate in \nworkplace \ncommunication \nWork with others \nReceive and \nrespond to \nworkplace \ncommunication \nSolve problems \nrelated to work \nactivities \nDevelop and \npractice negotiation \nskills \nPractice \noccupational \nhealth and \nsafety \nd\nPractice career \nprofessionalism \nPractice basic \nhousekeeping \nprocedures \nDemonstrate \nwork values \nUse relevant \ntechnologies \nUse mathematical \nconcepts and \ntechniques \nDemonstrate \nsecurity \nawareness \npractices\nPerform \nmaintenance \nand repair at the \nsupport level\n\n--- PDF PAGE 70 ---\nTR-Able Seafarer Deck NC II (STCW Regulation II/5) \nRevised June 26, 2013 \n66 \nDEFINITION OF TERMS \nFor the purpose of this training regulations, the words: \n \n1. Accommodation ladder \na portable flight of steps down a ship's side \n2. Anchor \nan object designed to prevent or slow the drift of a ship, \nattached to the ship by a line or chain; typically a metal, hook-\nlike or plough-like object designed to grip the bottom under the \nbody of water. \n3. Anchor ball \nround black shape hoisted in the forepart of a vessel to show \nthat it is anchored. \n4. Batten down the \nhatches \nto prepare for inclement weather by securing the closed hatch \ncovers with wooden battens so as to prevent water from \nentering from any angle \n5. Bitt or bitts \na post or pair mounted on the ship's bow, for fastening ropes or \ncables \n6. Boatswain or bosun \nA non-commissioned officer responsible for the sails, ropes, \nrigging and boats on a ship who issues \"piped\" commands to \nseamen. \n7. Bollard \na substantial vertical pillar to which lines may be made fast. \nGenerally on the quayside rather than the ship. \n8. Bearing \nthe horizontal direction of a line of sight between two objects on \nthe surface of the earth. \n9. Bridge \na structure above the weather deck, extending the full width of \nthe vessel, which houses a command center, itself called by \nassociation, the bridge \n10. Bridge wing \nan open-air extension of the bridge to port or starboard, \nintended for use in signaling \n11. Bosun’s chair \na short narrow board suspended by a bridle, used to sway a \nman aloft. For scrapping masts, tarring, rigging, etc. \n12. Bulkhead \none of several upright partitions separating various \ncompartments in a vessel preventing passage of oil, water or \nfire from one part of a ship to another. They serve as an \nimportant strength and stiffening members in a vessel’s \nstructure \n13. Capstan \na large winch with a vertical axis. A full-sized human-powered \ncapstan is a waist-high cylindrical machine, operated by a \nnumber of hands who each insert a horizontal capstan bar in \nholes in the capstan and walk in a circle. Used to wind in \nanchors or other heavy objects. \n14. Chain locker \na space in the forward part of the ship, typically beneath the \nbow in front of the foremost collision bulkhead, that contains the \nanchor chain when the anchor is secured for sea. \n15. Contaminants \nunwanted substances on ship surface such as oil, grease, salt, \nwaste, etc., which would prevent the paint from serving its \npurpose. \n16. Deck \nplating or planking secured to, and covering all or part of, any \ntier of beams; the floor of any compartment \n17. Deck stores \nstorage rooms where deck supplies and materials used in the \nday to day operation on board a ship are stored \n18. Fairlead \na ring, hook or other device used to keep a line or chain running \nin the correct direction or to prevent it rubbing or fouling.\n\n--- PDF PAGE 71 ---\nTR-Able Seafarer Deck NC II (STCW Regulation II/5) \nRevised June 26, 2013 \n67 \n \n19. Fid \na tapered wooden tool used for separating the strands of rope \nfor splicing. \n20. Flag hoist \na number of signal flags strung together to convey a message \n21. Gangway \nan opening in the rail or bulwark of a ship through which one \ncan enter or leave the ship \n22. Ground tackle \nanchors, chains, including apparel. \n23. Gyro compass \na mechanical indicator of the direction of the true (geographic) \nmeridian, designed for determining the course of an object, as \nwell as the azimuth (bearing) of the direction of orientation. \n24. Hatch \nan opening in a ship’s deck. Generally rectangular affording \naccess into the compartment below. \n25. Helm order \ncommand ordered by pilot or mastering to helmsman in \nsteering a ship. \n26. Hold \na general name for the spaces below deck, designated for the \nstowage of cargo. \n27. Holiday \na gap in the coverage of newly applied paint, slush, tar or other \nPreservative \n28. Lashing \nmaterials used for securing by binding, wrapping, e/g/ \nfastening-rope, chain, canvas \n29. Look-out \na seaman stationed in the forecastle or in the crow’s nest for \nthe purpose of maintaining watchful eye for any lights, land, or \nfloating objects that may heave in sight, or reporting such to \nofficer of the watch \n30. Marlinspike \na metal tool used in rope work for tasks such as unlaying rope, \nfor splicing, untying knots \n31. Riggings \nropes and chains used to hold the masts, booms, etc. of vessel. \nA sailor’s palm sailor’s thimble, it is for leather and fits over the \nhand. \n32. Splice \njoin lines (ropes, cables etc.) by unraveling their ends and \nintertwining them to form a continuous line. To form an eye or a \nknot by splicing. \n33. Safety net \na net placed under the accommodation ladder as a safety \nprecaution for persons embarking and disembarking from the \nship \n34. Seize \nto bind with small stuff, as, one rope to another, a rope to a \nspur, etc. \n35. Slack \na part of something that hangs loose without stain. \n36. Stage \na scaffold for workmen usually over the sides of a ship \n37. Stocks \nsupplies, materials, spare parts, tools and other gears kept in \nstorage until needed for use. \n38. Stoppers \npieces of fiber ropes or chains about two meters in length, used \nto hold the mooring lines tight while transferring the lines from \nthe winch drum to be secured on the bits. \n39. Synthetic rope \na rope made of nylon, Terylene or any material produced from \nchemical, mineral sources and general petroleum products \n40. Tail rope \nis fastened to the end of the jumbo boom of a schooner and \nused to back the fore stay sail and she will lie-to with sail so \ntrimmed.\n\n--- PDF PAGE 72 ---\nACKNOWLEDGEMENTS \n \n \nThe Technical Education and Skills Development Authority (TESDA) wishes to extend thanks and \nappreciation to the many representatives of business, industry, academe and government \nagencies who donated their time and expertise to the development and validation of these \nTraining Regulations. \n \nTHE TECHNICAL AND INDUSTRY EXPERT PANEL \n \nDECK DEPARTMENT \n \nCAPT. RODOLFO A. ASPILLAGA \nTechnical Consultant \nMARINA-STCW Office \n6th Floor Parkview Plaza, 984 Taft Ave. cor. \n T. M. Kalaw, Ermta, Manila \nCAPT. EDWIN M. ITABLE \nVice-President \nMaster and Mates Association of the Philippines \n(MMAP) \nRm. 503/504, 5th Floor, CTC Commercial Bldg. \nPedro Gil cor. Taft Ave., Malate, Manila \nThe PARTICIPANTS in the Validation of these Training Regulations \nCAPT. JONATHAN V. TABINO \nUFS \nCAPT. FERNANDO J. ALANO \n FAME \nCAPT. SIMEON E. FLORES \nPHILSAFE/MMAP \nCAPT. PEDRO U. BERIÑA, JR. \nNEWSIM \nCAPT. FIDEL V. OJERA \nPHILCAMSAT \nCAPT. VICTOR DEL PRADO \nFAME-FILSCAPT \nCAPT. DANNY S TAMPUS \nUFS \n \n \nENGINEERING DEPARTMENT \n \nC/E DIOSDADO G. RAMOS \nGeneral Manager \nMonsoon Maritime Services Phils., Inc. \nUnit 103, G/F Marbella Manila Bldg. 2071 \nRoxas Blvd., Malate, Manila \n \nC/E FERDINAND R. PASCUA \nMember, \nBoard of Marine Engineer Officers \nProfessional Regulation Commission (PRC) P. \nParedes St. cor. Morayta St. \nSampaloc, Manila \nC/E JANVIER PATRICK ROSETE \nTraining Manager for STCW \nAJ Center for Excellence \n2/F Delgado Bldg., 637 Bonifacio Drive \nSouth Harbor, Port Area, Manila \n \nThe PARTICIPANTS in the Validation of these Training Regulations \nC/E ANTONINO R. GASCON \nPROTECT MARINE \nC/E SOLIMAN V. DILAG \nEXACT \n \nMembers of the TESDA Board \nThe MANAGEMENT and STAFF of the TESDA Secretariat \nTESDA EXCOM \n \nQSO"
