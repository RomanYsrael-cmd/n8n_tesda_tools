  "source_text": "SECTION 4 NATIONAL ASSESSSMENT AND CERTIFICATION ARRANGEMENTS\n\nAssessment of an individual’s competence leads to the issuance of a Certificate of Proficiency\n(COP) in the relevant unit of competency.\n\nA Certificate of Proficiency (COP) is issued when a candidate has demonstrated competence in all\nthe units of competency that comprise the relevant promulgated qualification.\n\n1.\nCandidate wanting to be certified will have to be assessed in accordance with the\nrequirements identified in the evidence guide of the relevant unit/s of competency. As a\nrule, the unit/s of competency shall be the benchmark for all assessment under the Training\nRegulations for Maritime Sector.\n\n2.\nCandidate must have completed the prescribed course of instruction or acquired all the\nunits of competency contained in this Training Regulation and with equivalent sea service\nexperience. The following are qualified to apply for assessment and certification:\n\n\nHolder of COP for Rating Forming Part of Navigational Watch NC II (STCW Regulation\nII/4); and\n\nHave completed TESDA-registered training program for ABLE SEAFARER DECK\ninclusive of an approved sea going service in the deck department of not less than\ntwelve (12) months on board seagoing vessel of 500 GRT or more, supported by an\naccomplished Training Record Book as prescribed by the TESDA/MARINA; OR\n\nMinimum eighteen (18) months sea going service in the deck department and qualified\nas a rating forming part of a navigational watch on board seagoing vessel of 500 GRT\nor more, evidenced by a certificate from the manning agency/shipping company which\nmust be reflected in the Seafarers’ Identification and Record Book (SIRB) and in\naddition, a duly accomplished Training Record Book as prescribed by the\nTESDA/MARINA.\n\n3.\nCandidates for a COP shall be required to undergo assessment using the methods\nidentified in the units of competency.\n\n4.\nConduct of assessment and issuance of certificates shall follow the procedures manuals\nand implementing guidelines developed for the assessment and certification of Able\nSeafarer Deck as institutionalized by and between TESDA and MARINA through a\nMemorandum of Agreement (MOA).\n\n5.\nCandidates who are found to be competent under the qualification for Able Seafarer Deck\nas contained in Section 1 shall be awarded with the corresponding Certificate of Proficiency\n(COP).\n\n--- PDF PAGE 69 ---\nTR-Able Seafarer Deck NC II (STCW Regulation II/5)\nRevised June 26, 2013\n65\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nCORE\nCOMPETENCIES\n\n\nCOMMON\nCOMPETENCIES\n\n\nBASIC\nCOMPETENCIES\n\n"
}
