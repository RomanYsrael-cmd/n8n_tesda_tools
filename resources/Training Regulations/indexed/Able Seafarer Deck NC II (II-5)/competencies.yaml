        "source_text": "MTM 834210 \n \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge, skills and attitudes in fighting and \nextinguishing fires \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1. Operate portable fire-\nfighting equipment \n \n1.1 \nType of fires is correctly identified in accordance with \naccepted fire-fighting practice. \n1.2 \nCorrect portable fire-fighting equipment is selected and used \nto fight specific classes of fires. \n1.3 \nClass F fires are correctly extinguished with a fire blanket in \naccordance with accepted fire-fighting practice. \n1.4 \nCorrect techniques are applied for the use of hose lines to \nextinguish fires on board a vessel. \n1.5 \nWhere applicable, correct techniques are applied for the \nsetting up of foam making equipment to extinguish B Class \nfires on board a vessel. \n \n2. Carry out fire-fighting \noperations \n2.1 \nFire is extinguished using appropriate procedures, techniques, \nequipment and fire-fighting agents. \n2.2 \nCorrect portable fire-extinguisher(s) are selected and used for \nthe class of fire involved in a fire emergency. \n2.3 \nAppropriate safety clothing, appliances and equipment is \nused and safety precautions and procedures are applied when \nfighting fires in accordance with regulatory requirements, \nvessel’s procedures and established fire-fighting practice. \n2.4 \nThe timing and sequence of individual actions when fighting \nfires onboard a vessel are appropriate to the prevailing \ncircumstances and conditions. \n2.5 \nSearch and rescue operations in a smoke filled environment \nare correctly conducted as a member of a fire-fighting team in \naccordance with accepted fire-fighting practice. \n2.6 \nInterior fires are extinguished using appropriate fire-fighting \nequipment and procedures as a member of a fire-fighting team \nin accordance with accepted fire-fighting practice. \n2.7 \nLifeline signals are correctly used during interior fire-fighting \noperations.\n\n--- PDF PAGE 26 ---\nTESDA-SOP-QSO-01-F08 \nTR-Able Seafarer Deck NC II (STCW Regulation II/5) \nRevised June 26, 2013 \n22 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Type of fire \nStandard types of fires may include: \n1.1 Class A \n1.2 Class B \n1.3 Class C \n1.4 Class F \n \n2. Fire-fighting equipment Fire-fighting equipment, appliances and systems may include: \n2.1 Portable fire extinguishers including foam, water, CO 2 , dry \nchemical and wet foam \n2.2 Fire blankets \n2.3 CO2 fixed systems \n2.4 Foam installations including semi-portable and fixed systems \n2.5 Sprinkler systems \n2.6 Fire pumps (main and emergency fire pump) \n2.7 Fire hoses, hydrants, branches and international shore \nconnection \n \n3. Fire on board a vessel \n \nFire emergencies on board vessel may occur: \n3.1 By day or night in both normal and emergency situations \n3.2 Under any possible conditions of weather and loading \n3.3 While underway \n3.4 During berthing and un-berthing operations \n3.5 While anchoring or mooring \n3.6 While in port \n3.7 While moored or at anchor \n \n4. Safety clothing, \nappliances and \nequipment \nSafety clothing and equipment may include: \n4.1 Fire-resistant clothing \n4.2 Self-contained breathing apparatus (SCBA) \n4.3 Masks \n4.4 Eye and ear protection \n4.5 Gloves \n4.6 Boots\n\n--- PDF PAGE 27 ---\nTESDA-SOP-QSO-01-F08 \nTR-Able Seafarer Deck NC II (STCW Regulation II/5) \nRevised June 26, 2013 \n23 \nEVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate : \n1.1 \nparticipated in simulated on-boar d fire-fighting activities \n1.2 \nparticipated in search and rescue and fire-fighting teams \n1.3 \napplied OHS principles and policies when carrying out fire-\nfighting duties \n1.4 \ncommunicated effectively with others as required during fire \nemergencies \n \n2. Required Knowledge \n2.1 \nKnowledge of relevant maritime regulations \n2.2 \nThe chemistry of fire and its relationship to materials typically \ncarried on vessels \n2.3 \nPrinciples underlying the spread of fire and how it is \nextinguished \n2.4 \nThe different types of fire, their characteristics and strategies \nand equipment needed to extinguish them \n2.5 \nPrinciples and procedures for the use of self-contained \nbreathing apparatus (SCBA) when fighting fires \n2.6 \nFire-fighting clothing, outfits and personal safety equipment \nused when fighting a fire onboard a vessel \n2.7 \nTypes fire-fighting appliances, equipment and systems used \non board vessels, their features, principles of operation and \nthe procedures for their use and maintenance \n2.8 \nFixed fire prevention and extinguishing installations used on \nvessels and their principles of operation \n2.9 \nFire-fighting techniques, agents and precautions applicable to \ndifferent types of fire on board a vessel \n2.10 Maritime communication techniques applicable to fire-fighting \nactivities onboard a vessel \n2.11 Typical problems that can occur with shipboard fire-fighting \nequipment and operations and appropriate remedial action \nand solutions \n2.12 Sources of information on shipboard fire prevention and \nextinguishment \n \n3. Required Skills \n3.1 \nApplying fire prevention measures and procedures \n3.2 \nIdentifying fire fighting problems and determining appropriate \ncourses of action \n3.3 \nParticipating as a member of an interior search and rescue \nand fire-fighting team on board a vessel \n3.4 \nDetermining the operational capability of fire-fighting \nappliances, equipment and systems \n \n4. Resource Implications \nThe following resources should be provided: \n4.1 \nwork place with recommended facilities \n4.2 \ntools and equipment appropriate to the activity \n4.3 \nmaterials relevant to the proposed activity and tasks \n \n5. Methods of \nAssessment \nCompetency in this unit must be assessed through: \n5.1 \nDemonstration and questioning of related underpinning \nknowledge \n5.2 \nWritten examination \n5.3 \nPortfolio \n \n6. Context of Assessment 6.1 Competency may be assessed in workplace or in a simulated \nworkplace setting\n\n--- PDF PAGE 28 ---\nTESDA-SOP-QSO-01-F08 \nTR-Able Seafarer Deck NC II (STCW Regulation II/5) \nRevised June 26, 2013 \n24 \nUNIT OF COMPETENCY \n: \nTAKE IMMEDIATE ACTION UPON ENCOUNTERING AN \nACCIDENT OR OTHER MEDICAL EMERGENCY \n \nUNIT CODE \n:"
