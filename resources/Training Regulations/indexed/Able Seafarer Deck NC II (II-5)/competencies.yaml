        "source_text": "MTM834212 \n \nUNIT DESCRIPTOR \n: \nThis unit deals with the knowledge and skills required to take \nappropriate initial action on becoming aware of an emergency on \nboard a commercial vessel in conformance with the established \nemergency response procedures. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized items are elaborated in the Range of Variables \n1. Take action on becoming \naware of an emergency \n1.1 Emergency situations are recognized and identified. \n1.2 Responses to an emergency situation followed the \nestablished vessel’s emergency response procedures. \n1.3 Correct actions are taken on discovery of an actual or \npotential emergencies/emergency situation in \naccordance with established vessel’s emergency response \nprocedures. \n1.4 Information given on raising alarm is prompt, accurate, \ncomplete and clear. \n \n2. Follow established \nemergency procedures \n2.1 Vessel’s contingency plans for emergency response are \nknown and are implemented in real and simulated \nemergency situations. \n2.2 Escape routes and internal and external communications \nand alarm systems are used in real and simulated \nemergency situations in accordance with regulatory \nrequirements and established procedures. \n2.3 Emergency communications and alarm signals and systems \nare understood and required action implemented in \naccordance with emergency procedures and regulatory \nrequirements. \n2.4 Planned damage control procedures for dealing with \ndamage to the vessel and its hull are implemented in \naccordance with company procedures and regulatory \nrequirements. \n \n3. Follow procedures for the \nuse of various life-saving \nequipment \n3.1 Participation in life saving drills confirms readiness to \ncorrectly carry out life-saving procedures and use life-\nsaving equipment. \n3.2 Procedures for the use of various shipboard life-saving \nappliances are followed in accordance with regulatory \nrequirements, manufacturer’s instructions and company \nprocedures.\n\n--- PDF PAGE 32 ---\nTESDA-SOP-QSO-01-F08 \nTR-Able Seafarer Deck NC II (STCW Regulation II/5) \nRevised June 26, 2013 \n28 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Emergency situations \nMay include: \n1.1 Collision with another vessel \n1.2 Explosion on board vessel \n1.3 Fire on board vessel \n1.4 Impairment of integrity of hull and ingress of water \n1.5 Loss of steering control \n1.6 Lost of motive power \n1.7 Foundering \n1.8 Grounding \n1.9 Beaching a Vessel \n1.10 Person overboard \n1.11 Rescue and evacuation of injured personnel \n \n2. Potential emergencies \nMay occur: \n2.1 By day or night \n2.2 Under any possible conditions of weather and loading \n2.3 While underway \n2.4 During berthing and unberthing operations \n2.5 While anchoring or mooring \n2.6 When bunkering \n2.7 During cargo handling operations \n \n3. Regulatory requirements \nMay include: \n3.1 SOLAS convention \n3.2 IMO STCW Codes and Convention \n3.3 Relevant domestic and international OH&S legislation \n \n4. Life-saving equipment \nMay include: \n4.1 Life jackets \n4.2 Exposure and immersion suits \n4.3 Survival craft\n\n--- PDF PAGE 33 ---\nTESDA-SOP-QSO-01-F08 \nTR-Able Seafarer Deck NC II (STCW Regulation II/5) \nRevised June 26, 2013 \n29 \nEVIDENCE GUIDE \n \n1. Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1 \nundertook appropriate action in the event of emergency \nsituations \n1.2 \nfollowed established procedures and regulatory requirements \nduring emergency responses’ procedures \n1.3 \nfollowed procedures for the use of various life-saving equipment \n1.4 \nparticipated in drills in preparation for the implementation of \nemergency responses \n1.5 \ncommunicated effectively with others during emergency \nresponses’ procedures \n \n2. Required Knowledge 2.1 \nTypes of emergencies \n2.2 \nShipboard contingency plans \n2.3 \nKnowledge of relevant maritime regulations \n2.4 \nRelevant OH&S legislation and policies \n2.5 \nNavigational emergencies for vessels and appropriate action \nand solutions \n2.6 \nIndications of various types of emergency situations and the \naction to be followed when various types of actual or potential \nemergency situations are identified \n2.7 \nEmergency alarm signals and systems in use on vessels and \nprocedures to be followed when an emergency alarm is raised \n2.8 \nEscape routes and internal and external communications \nsystems and alarms on board a vessel \n2.9 \nGeneral principles of damage control and the manner in which \nwatertight integrity of hull is maintained on a vessel, including \nthe importance of preparation, control and repair \n2.10 Ways of controlling damage during a flooding emergency, \nincluding the use of various shipboard items that can be used \nfor damage control purposes such as mattresses, canvas and \nclothing \n2.11 Maritime communication techniques used during navigational \nemergencies of actual or potential emergency situations are \nidentified \n2.12 Emergency alarm signals and systems in use on vessels and \nprocedures to be followed when an emergency alarm is raised \n2.13 Escape routes and internal and external communications \nsystems and alarms on board a vessel \n2.14 General principles of damage control and the manner in which \nwatertight integrity of hull is maintained on a vessel, including \nthe importance of preparation, control and repair \n2.15 Ways of controlling damage during a flooding emergency, \nincluding the use of various shipboard items that can be used \nfor damage control purposes such as mattresses, canvas and \nclothing\n\n--- PDF PAGE 34 ---\nTESDA-SOP-QSO-01-F08 \nTR-Able Seafarer Deck NC II (STCW Regulation II/5) \nRevised June 26, 2013 \n30 \n \n3. Required Skills \n3.1 Applying navigational emergencies for vessels and appropriate \naction and solutions \n3.2 Applying appropriate action in various types of actual or \npotential emergency situations \n3.3 Using emergency alarm signals and systems \n3.4 Using various shipboard items to be used for damage control \npurposes such as mattresses, canvas and clothing \n3.5 Using personal safety equipment \n \n4. Resource \nImplications \nThe following resources should be provided: \n4.1 simulated workplace environment \n4.2 workplace standards, procedures, policies, guidelines \n4.3 tools and equipment relevant to work activities \n \n5. Methods of \nAssessment \n \nCompetency in this unit may be assessed through: \n5.1 \nObservation/simulated practical demonstration in responding to \nemergency situations onboard a commercial vessel, and/or \n5.2 \nSimulation/role plays to test the candidate’s knowledge and \nskills in complying with emergency procedures \n \n6. Context of \nAssessment \n6.1 Competency may be assessed in workplace or in a simulated \nworkplace setting\n\n--- PDF PAGE 35 ---\nTESDA-SOP-QSO-01-F08 \nTR-Able Seafarer Deck NC II (STCW Regulation II/5) \nRevised June 26, 2013 \n31 \nUNIT OF COMPETENCY \n: \nTAKE PRECAUTIONS TO PREVENT POLLUTION OF THE \nMARINE ENVIRONMENT \n \nUNIT CODE \n:"
