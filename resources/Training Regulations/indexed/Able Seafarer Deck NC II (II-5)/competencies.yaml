        "evidence_guide": {
          "source_text": "1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 performed watchkeeping in accordance with bridge procedures \nmanual \n1.2 performed proper relief and handing over procedures. \n1.3 contributed to berthing, anchoring and other mooring operations \n1.4 communicated effectively with other members of the bridge \nteam \n \n2. Required Knowledge \n \n2.1 Sections of IMO STCW Code and Convention, as amended \ndealing with bridge watchkeeping principles. \n2.2 Lights, shapes and sound signals as per COLREGS. \n2.3 BRM Principles as part of the bridge team \n2.4 Function of mooring lines and tug lines \n2.5 Capacities, safe working loads, and breaking strength of \nmooring and anchoring equipment \n \n3. Required Skills \n \n3.1 Identifying light , sounds and shapes \n3.2 Demonstrating steering procedures \n3.3 Demonstrating watch hand-over procedures \n3.4 Handling mooring lines and anchoring equipment \n3.5 Using communication equipment \n \n4. Resource Implications \n \nAccess is required to opportunities to either: \n4.1 Execute watchkeeping using a bridge simulator, meeting the \nrequirements of Section A I/12 of the IMO STCW Code, over an \nappropriate range of simulated maneuvering situations, weather \nand loading conditions; and/or \n4.2 Conduct watchkeeping on board a training vessel under the \ndirection of the Officer in Charge of the Watch over an appropriate \nrange of situations, weather and loading conditions \n4.3 Conduct mooring, unmooring, berthing, unberthing and anchoring \noperations under the supervision of the officer-in-charge in a \nsimulated environment or a training vessel. \n \n5. Methods of \nAssessment \n \n Competency in this unit must be assessed through: \n5.1 practical test using a suitably simulated watchkeeping situation; or \n5.2 approved in-service experience, or \n5.3 approved training ship experience, or \n5.4 written examinations \n \n6. Context of Assessment \n \n6.1 Assessment of competence must comply with the assessment \nrequirements of the relevant maritime regulations \n6.2 Assessment of this unit must be undertaken within relevant marine \nauthority approved and audited arrangements by a registered \ntraining and/or assessment institution: \n6.2.1 Appropriate practical assessment must occur: \n6.2.1.1 at the registered training organization, and/or \n6.2.1.2 on an appropriate working or training vessel\n\n--- PDF PAGE 48 ---\nTESDA-SOP-QSO-01-F08 \nTR-Able Seafarer Deck NC II (STCW Regulation II/5) \nRevised June 26, 2013 \n44 \nUNIT OF COMPETENCY : \nPERFORM CARGO HANDLING AND STOWAGE AT THE \nSUPPORT LEVEL \n \nUNIT CODE \n:"
        },
        "source_text": "MTM834317 \n \nUNIT DESCRIPTOR \n: \nThis unit identifies the knowledge, skills and attitude required to \ncontribute in the performance of a safe navigational watch at the \nsupport level. This unit also covers berthing, anchoring, and other \nmooring operations. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1. Contribute to a safe \nnavigational watch \n1.1 Orders are understood and communications are made with the \nofficer of the watch on matters relevant to the factors in \ncarrying out watchkeeping duties. \n1.2 Element procedures for the relief, maintenance and handover \nof a watch are observed and followed. \n1.3 Information required to maintain a safe watch contained in the \nInternational Regulations for preventing collision at sea are \ncorrectly recognized/interpreted. \n \n2. Contribute to berthing, \nanchoring and other \nmooring operations \n2.1 Procedures and order of event for letting go mooring lines and \ntug lines, including towing lines are followed as ordered by the \nofficer in charge. \n2.2 Procedures and order of event for the use of anchors in various \noperations are followed in accordance with Safe Working \nPractices. \n2.3 Procedures and order of events associated with mooring to a \nbuoy or buoys are followed as ordered by the officer in charge. \n2.4 Tasks required of a rating in preparation for arrival and \ndeparture from an anchorage or mooring are completed in \naccordance with shipboard procedures. \n2.5 Communications during mooring and anchor handling \noperations are clear and timely and involve the correct use of \ncommunications equipment where required.\n\n--- PDF PAGE 46 ---\nTESDA-SOP-QSO-01-F08 \nTR-Able Seafarer Deck NC II (STCW Regulation II/5) \nRevised June 26, 2013 \n42 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Factors to be \nconsidered when \ncarrying out \nwatchkeeping duties \nMay include: \n1.1 \nBridge must never be left unattended \n1.2 \nWeather, sea conditions and visibility, in daylight or darkness \n1.3 \nProximity of navigational hazards \n1.4 \nUse and operational condition of navigational aids \n1.5 \nThe operational status of bridge instrumentation, controls and \nalarms \n1.6 \nProvision on the bridge of unmanned machinery (UMS) \ncontrols, alarms and indicators \n1.7 \nUnusual demands on the navigational watch arising from \noperational conditions \n1.8 \nTraffic density and other activities occurring in the area in \nwhich the vessel is navigating \n1.9 \nThe size of the vessel and the field of vision available from the \ncoming position \n1.10 Attention necessary when navigating in or near traffic \nseparation schemes or other routing measures \n1.11 Rudder and propeller control and vessel maneuvering \ncharacteristics \n1.12 Physical and mental state of the watchkeeper \n \n2. Elements Procedures \nMay include: \n2.1 \nCommand \n2.2 \nConfirmation \n2.3 \nExecution \n2.4 \nMonitoring \n2.5 \nReporting \n2.6 \nAcknowledgement \n \n3. Information \nInformation acquired during navigational watch: \n3.1 \nLights \n3.2 \nShapes \n3.3 \nSound Signals \n3.4 \nVessel traffic situations \n \n4. Mooring Lines \nMooring lines and anchoring equipment include: \n4.1 \nMooring lines \n4.1.1. Headline \n4.1.2. Forward spring line \n4.1.3. Breast line \n4.1.4. Back spring line \n4.1.5. Stern Line \n4.2 \nAnchoring equipment \n4.2.1. Mooring Winch \n4.2.2. Bitts \n4.2.3. Chocks \n4.2.4. Bollards \n4.2.5. Fairleads \n4.2.6. Windlass \n4.2.7. Anchor \n4.2.8. Anchor chain \n4.2.9. Stoppers\n\n--- PDF PAGE 47 ---\nTESDA-SOP-QSO-01-F08 \nTR-Able Seafarer Deck NC II (STCW Regulation II/5) \nRevised June 26, 2013 \n43 \nEVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 performed watchkeeping in accordance with bridge procedures \nmanual \n1.2 performed proper relief and handing over procedures. \n1.3 contributed to berthing, anchoring and other mooring operations \n1.4 communicated effectively with other members of the bridge \nteam \n \n2. Required Knowledge \n \n2.1 Sections of IMO STCW Code and Convention, as amended \ndealing with bridge watchkeeping principles. \n2.2 Lights, shapes and sound signals as per COLREGS. \n2.3 BRM Principles as part of the bridge team \n2.4 Function of mooring lines and tug lines \n2.5 Capacities, safe working loads, and breaking strength of \nmooring and anchoring equipment \n \n3. Required Skills \n \n3.1 Identifying light , sounds and shapes \n3.2 Demonstrating steering procedures \n3.3 Demonstrating watch hand-over procedures \n3.4 Handling mooring lines and anchoring equipment \n3.5 Using communication equipment \n \n4. Resource Implications \n \nAccess is required to opportunities to either: \n4.1 Execute watchkeeping using a bridge simulator, meeting the \nrequirements of Section A I/12 of the IMO STCW Code, over an \nappropriate range of simulated maneuvering situations, weather \nand loading conditions; and/or \n4.2 Conduct watchkeeping on board a training vessel under the \ndirection of the Officer in Charge of the Watch over an appropriate \nrange of situations, weather and loading conditions \n4.3 Conduct mooring, unmooring, berthing, unberthing and anchoring \noperations under the supervision of the officer-in-charge in a \nsimulated environment or a training vessel. \n \n5. Methods of \nAssessment \n \n Competency in this unit must be assessed through: \n5.1 practical test using a suitably simulated watchkeeping situation; or \n5.2 approved in-service experience, or \n5.3 approved training ship experience, or \n5.4 written examinations \n \n6. Context of Assessment \n \n6.1 Assessment of competence must comply with the assessment \nrequirements of the relevant maritime regulations \n6.2 Assessment of this unit must be undertaken within relevant marine \nauthority approved and audited arrangements by a registered \ntraining and/or assessment institution: \n6.2.1 Appropriate practical assessment must occur: \n6.2.1.1 at the registered training organization, and/or \n6.2.1.2 on an appropriate working or training vessel\n\n--- PDF PAGE 48 ---\nTESDA-SOP-QSO-01-F08 \nTR-Able Seafarer Deck NC II (STCW Regulation II/5) \nRevised June 26, 2013 \n44 \nUNIT OF COMPETENCY : \nPERFORM CARGO HANDLING AND STOWAGE AT THE \nSUPPORT LEVEL \n \nUNIT CODE \n:"
      }
