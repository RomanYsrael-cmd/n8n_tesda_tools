  "source_section_text": "SECTION 2 COMPETENCY STANDARDS \n \nThis section gives the details of the contents of the basic, common and core units of \ncompetency required in ABLE SEAFARER DECK NC II (STCW Regulation II/5). \n \nBASIC COMPETENCIES \n \nUNIT OF COMPETENCY : \nPARTICIPATE IN WORKPLACE COMMUNICATION \n \nUNIT CODE \n: \n500311105 \n \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge, skills and attitudes required to \ngather, interpret and convey information in response to workplace \nrequirements. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1. Obtain and convey \nworkplace information \n1.1 \nSpecific and relevant information is accessed from \nappropriate sources \n1.2 \nEffective questioning , active listening and speaking skills are \nused to gather and convey information \n1.3 \nAppropriate medium is used to transfer information and ideas \n1.4 \nAppropriate non- verbal communication is used \n1.5 \nAppropriate lines of communication with supervisors and \ncolleagues are identified and followed \n1.6 \nDefined workplace procedures for the location and storage of \ninformation are used \n1.7 \nPersonal interaction is carried out clearly and concisely \n \n2. Participate in \nworkplace meetings \nand discussions \n2.1 \nTeam meetings are attended on time \n2.2 \nOwn opinions are clearly expressed and those of others are \nlistened to without interruption \n2.3 \nMeeting inputs are consistent with the meeting purpose and \nestablished protocols \n2.4 \nWorkplace interactions are conducted in a courteous \nmanner \n2.5 \nQuestions about simple routine workplace procedures and \nmaters concerning working conditions of employment are \nasked and responded to \n2.6 \nMeetings outcomes are interpreted and implemented \n \n3. Complete relevant \nwork related \ndocuments \n3.1 \nRange of forms relating to conditions of employment are \ncompleted accurately and legibly \n3.2 \nWorkplace data is recorded on standard workplace forms and \ndocuments \n3.3 \nBasic mathematical processes are used for routine \ncalculations \n3.4 \nErrors in recording information on forms/ documents are \nidentified and properly acted upon \n3.5 \nReporting requirements to supervisor are completed \naccording to organizational guidelines\n\n--- PDF PAGE 7 ---\nTR-Able Seafarer Deck NC II (STCW Regulation II/5) \nRevised June 26, 2013 \n3 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Appropriate sources \n1.1 \nTeam members \n1.2 \nSuppliers \n1.3 \nTrade personnel \n1.4 \nLocal government \n1.5 \nIndustry bodies \n \n2. Medium \n2.1 \nMemorandum \n2.2 \nCircular \n2.3 \nNotice \n2.4 \nInformation discussion \n2.5 \nFollow-up or verbal instructions \n2.6 \nFace to face communication \n \n3. Storage \n3.1 \nManual filing system \n3.2 \nComputer-based filing system \n \n4. Forms \n4.1 \nPersonnel forms, telephone message forms, safety reports \n \n5. Workplace interactions \n5.1 \nFace to face \n5.2 \nTelephone \n5.3 \nElectronic and two way radio \n5.4 \nWritten including electronic, memos, instruction and forms, \nnon-verbal including gestures, signals, signs and diagrams \n \n6. Protocols \n6.1 \nObserving meeting \n6.2 \nCompliance with meeting decisions \n6.3 \nObeying meeting instructions\n\n--- PDF PAGE 8 ---\nTR-Able Seafarer Deck NC II (STCW Regulation II/5) \nRevised June 26, 2013 \n4 \nEVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 \nPrepared written communication following standard format of \nthe organization \n1.2 \nAccessed information using communication equipment \n1.3 \nMade use of relevant terms as an aid to transfer information \neffectively \n1.4 \nConveyed information effectively adopting the formal or \ninformal communication \n \n2. Underpinning \nKnowledge and \nAttitudes \n \n2.1 \nEffective communication \n2.2 \nDifferent modes of communication \n2.3 \nWritten communication \n2.4 \nOrganizational policies \n2.5 \nCommunication procedures and systems \n2.6 \nTechnology relevant to the enterprise and the individual’s \nwork responsibilities \n \n3. Underpinning Skills \n3.1 \nFollow simple spoken language \n3.2 \nPerform routine workplace duties following simple written \nnotices \n3.3 \nParticipate in workplace meetings and discussions \n3.4 \nComplete work related documents \n3.5 \nEstimate, calculate and record routine workplace measures \n3.6 \nBasic mathematical processes of addition, subtraction, \ndivision and multiplication \n3.7 \nAbility to relate to people of social range in the workplace \n3.8 \nGather and provide information in response to workplace \nRequirements \n \n4. Resource Implications \n4.1 \nFax machine \n4.2 \nTelephone \n4.3 \nWriting materials \n4.4 \nInternet \n \n5. Methods of \nAssessment \n5.1 \nDirect Observation \n5.2 \nOral interview and written test \n \n6. Context of Assessment 6.1 \nCompetency may be assessed individually in the actual \nworkplace or through accredited institution\n\n--- PDF PAGE 9 ---\nTR-Able Seafarer Deck NC II (STCW Regulation II/5) \nRevised June 26, 2013 \n5 \nUNIT OF COMPETENCY : \nWORK IN TEAM ENVIRONMENT \n \nUNIT CODE \n: \n500311106 \n \nUNIT DESCRIPTOR \n: \nThis unit covers the skills, knowledge and attitudes to identify role \nand responsibility as a member of a team. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1. Describe team role and \nscope \n1.1 \nThe role and objective of the team is identified from \navailable sources of information \n1.2 \nTeam parameters, reporting relationships and responsibilities \nare identified from team discussions and appropriate external \nsources \n \n2. Identify own role and \nresponsibility within \nteam \n2.1 \nIndividual role and responsibilities within the team \nenvironment are identified \n2.2 \nRoles and responsibility of other team members are identified \nand recognized \n2.3 \nReporting relationships within team and external to team are \nidentified \n \n3. Work as a team \nmember \n3.1 \nEffective and appropriate forms of communications used and \ninteractions undertaken with team members who contribute to \nknown team activities and objectives \n3.2 \nEffective and appropriate contributions made to complement \nteam activities and objectives, based on individual skills and \ncompetencies and workplace context \n3.3 \nObserved protocols in reporting using standard operating \nprocedures \n3.4 \nContribute to the development of team work plans based on \nan understanding of team’s role and objectives and individual \ncompetencies of the members.\n\n--- PDF PAGE 10 ---\nTR-Able Seafarer Deck NC II (STCW Regulation II/5) \nRevised June 26, 2013 \n6 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Role and objective of \nteam \n1.1 \nWork activities in a team environment with enterprise or \nspecific sector \n1.2 \nLimited discretion, initiative and judgement maybe \ndemonstrated on the job, either individually or in a team \nenvironment \n \n2. Sources of information \n2.1 \nStandard operating and/or other workplace procedures \n2.2 \nJob procedures \n2.3 \nMachine/equipment manufacturer’s specifications and \ninstructions \n2.4 \nOrganizational or external personnel \n2.5 \nClient/supplier instructions \n2.6 \nQuality standards \n2.7 \nOHS and environmental standards \n \n3. Workplace context \n3.1 \nWork procedures and practices \n3.2 \nConditions of work environments \n3.3 \nLegislation and industrial agreements \n3.4 \nStandard work practice including the storage, safe handling \nand disposal of chemicals \n3.5 \nSafety, environmental, housekeeping and quality guidelines\n\n--- PDF PAGE 11 ---\nTR-Able Seafarer Deck NC II (STCW Regulation II/5) \nRevised June 26, 2013 \n7 \nEVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 \nOperated in a team to complete workplace activity \n1.2 \nWorked effectively with others \n1.3 \nConveyed information in written or oral form \n1.4 \nSelected and used appropriate workplace language \n1.5 \nFollowed designated work plan for the job \n1.6 \nReported outcomes \n \n2. Underpinning \nKnowledge and \nAttitude \n2.1 \nCommunication process \n2.2 \nTeam structure \n2.3 \nTeam roles \n2.4 \nGroup planning and decision making \n \n3. Underpinning Skills \n3.1 \nCommunicate appropriately, consistent with the culture of the \nworkplace \n \n4. Resource Implications \nThe following resources MUST be provided: \n4.1 \nAccess to relevant workplace or appropriately simulated \nenvironment where assessment can take place \n4.2 \nMaterials relevant to the proposed activity or tasks \n \n5. Methods of \nAssessment \nCompetency may be assessed through: \n5.1 \nObservation of the individual member in relation to the work \nactivities of the group \n5.2 \nObservation of simulation and or role play involving the \nparticipation of individual member to the attainment of \norganizational goal \n5.3 \nCase studies and scenarios as a basis for discussion of \nissues and strategies in teamwork \n \n6. Context for \nAssessment \n6.1 \nCompetency may be assessed in workplace or in a simulated \nworkplace setting \n6.2 \nAssessment shall be observed while task are being \nundertaken whether individually or in group\n\n--- PDF PAGE 12 ---\nTR-Able Seafarer Deck NC II (STCW Regulation II/5) \nRevised June 26, 2013 \n8 \nUNIT OF COMPETENCY : \nPRACTICE CAREER PROFESSIONALISM \n \nUNIT CODE \n: \n500311107 \n \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge, skills and attitudes in promoting \ncareer growth and advancement. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1. Integrate personal \nobjectives with \norganizational goals \n1.1 \nPersonal growth and work plans are pursued towards \nimproving the qualifications set for the profession \n1.2 \nIntra- and interpersonal relationships is are maintained in the \ncourse of managing oneself based on performance \nevaluation \n1.3 \nCommitment to the organization and its goal is demonstrated \nin the performance of duties \n \n2. Set and meet work \npriorities \n2.1 \nCompeting demands are prioritized to achieve personal, team \nand organizational goals and objectives. \n2.2 \nResources are utilized efficiently and effectively to manage \nwork priorities and commitments \n2.3 \nPractices along economic use and maintenance of equipment \nand facilities are followed as per established procedures \n \n3. Maintain professional \ngrowth and \ndevelopment \n3.1 \nTrainings and career opportunities are identified and \navailed of based on job requirements \n3.2 \nRecognitions are sought/received and demonstrated as \nproof of career advancement \n3.3 \nLicenses and/or certifications relevant to job and career are \nobtained and renewed\n\n--- PDF PAGE 13 ---\nTR-Able Seafarer Deck NC II (STCW Regulation II/5) \nRevised June 26, 2013 \n9 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Evaluation \n1.1 \nPerformance Appraisal \n1.2 \nPsychological Profile \n1.3 \nAptitude Tests \n \n2. Resources \n2.1 \nHuman \n2.2 \nFinancial \n2.3 \nTechnology \n2.3.1 Hardware \n2.3.2 Software \n \n3. Trainings and career \nopportunities \n3.1 \nParticipation in training programs \n3.1.1 Technical \n3.1.2 Supervisory \n3.1.3 Managerial \n3.1.4 Continuing Education \n3.2 \nServing as Resource Persons in conferences and workshops \n \n4. Recognitions \n4.1 \nRecommendations \n4.2 \nCitations \n4.3 \nCertificate of Appreciations \n4.4 \nCommendations \n4.5 \nAwards \n4.6 \nTangible and Intangible Rewards \n \n5. Licenses and/or \ncertifications \n5.1 \nNational Certificates \n5.2 \nCertificate of Competency \n5.3 \nSupport Level Licenses \n5.4 \nProfessional Licenses\n\n--- PDF PAGE 14 ---\nTR-Able Seafarer Deck NC II (STCW Regulation II/5) \nRevised June 26, 2013 \n10 \nEVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 \nAttained job targets within key result areas (KRAs) \n1.2 \nMaintained intra - and interpersonal relationship in the course \nof managing oneself based on performance evaluation \n1.3 \nCompleted trainings and career opportunities which are based \non the requirements of the industries \n1.4 \nAcquired and maintained licenses and/or certifications \naccording to the requirement of the qualification \n \n2. Underpinning \nKnowledge \n2.1 \nWork values and ethics (Code of Conduct, Code of Ethics, \netc.) \n2.2 \nCompany policies \n2.3 \nCompany operations, procedures and standards \n2.4 \nFundamental rights at work including gender sensitivity \n2.5 \nPersonal hygiene practices \n \n3. Underpinning Skills \n3.1 \nAppropriate practice of personal hygiene \n3.2 \nIntra and Interpersonal skills \n3.3 \nCommunication skills \n \n4. Resource Implications \nThe following resources MUST be provided: \n4.1 \nWorkplace or assessment location \n4.2 \nCase studies/scenarios \n \n5. Methods of \nAssessment \nCompetency may be assessed through: \n5.1 \nPortfolio Assessment \n5.2 \nInterview \n5.3 \nSimulation/Role-plays \n5.4 \nObservation \n5.5 \nThird Party Reports \n5.6 \nExams and Tests \n \n6. Context of Assessment \n6.1 \nCompetency may be assessed in the work place or in a \nsimulated work place setting\n\n--- PDF PAGE 15 ---\nTR-Able Seafarer Deck NC II (STCW Regulation II/5) \nRevised June 26, 2013 \n11 \n \nUNIT OF COMPETENCY : \nPRACTICE OCCUPATIONAL HEALTH AND SAFETY \nPROCEDURES \n \nUNIT CODE : \n500311108 \n \nUNIT DESCRIPTOR : \nThis unit covers the outcomes required to comply with regulatory \nand organizational requirements for occupational health and \nsafety. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1. Identify hazards and \nrisks \n1.1 \nSafety regulations and workplace safety and hazard control \npractices and procedures are clarified and explained based on \norganization procedures \n1.2 \nHazards/risks in the workplace and their corresponding \nindicators are identified to minimize or eliminate risk to co-\nworkers, workplace and environment in accordance with \norganization procedures \n1.3 \nContingency measures during workplace accidents, fire and \nother emergencies are recognized and established in \naccordance with organization procedures \n \n2. Evaluate hazards and \nrisks \n2.1 \nTerms of maximum tolerable limits which when exceeded will \nresult in harm or damage are identified based on threshold \nlimit values (TLV) \n2.2 \nEffects of the hazards are determined \n2.3 \n OHS issues and/or concerns and identified safety hazards \nare reported to designated personnel in accordance with \nworkplace requirements and relevant workplace OHS \nlegislation \n \n3. Control hazards and \nrisks \n3.1 \nOccupational Health and Safety (OHS) procedures for \ncontrolling hazards/risks in workplace are consistently \nfollowed \n3.2 \nProcedures for dealing with workplace accidents, fire and \nemergencies are followed in accordance with organization \nOHS policies \n3.3 \nPersonal protective equipment (PPE) is correctly used in \naccordance with organization OHS procedures and practices \n3.4 \nAppropriate assistance is provided in the event of a workplace \nemergency in accordance with established organization \nprotocol \n \n4. Maintain OHS \nawareness \n4.1 \nEmergency-related drills and trainings are participated in \nas per established organization guidelines and procedures \n4.2 \nOHS personal records are completed and updated in \naccordance with workplace requirements\n\n--- PDF PAGE 16 ---\nTR-Able Seafarer Deck NC II (STCW Regulation II/5) \nRevised June 26, 2013 \n12 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Safety regulations \nMay include but are not limited to: \n1.1 \nClean Air Act \n1.2 \nBuilding code \n1.3 \nNational Electrical and Fire Safety Codes \n1.4 \nWaste management statutes and rules \n1.5 \nPhilippine Occupational Safety and Health Standards \n1.6 \nDOLE regulations on safety legal requirements \n1.7 \nECC regulations \n2. Hazards/Risks \nMay include but are not limited to: \n2.1 \nPhysical hazards – impact, illumination, pressure, noise, \nvibration, temperature, radiation \n2.2 \nBiological hazards- bacteria, viruses, plants, parasites, mites, \nmolds, fungi, insects \n2.3 \nChemical hazards – dusts, fibers, mists, fumes, smoke, \ngasses, vapors \n2.4 \nErgonomics \n• Psychological factors – over exertion/ excessive force, \nawkward/static positions, fatigue, direct pressure, varying \nmetabolic cycles \n• Physiological factors – monotony, personal relationship, \nwork out cycle \n3. Contingency measures \nMay include but are not limited to: \n3.1 \nEvacuation \n3.2 \nIsolation \n3.3 \nDecontamination \n3.4 \n(Calling designed) emergency personnel \n4. PPE \nMay include but are not limited to: \n4.1 \nMask \n4.2 \nGloves \n4.3 \nGoggles \n4.4 \nHair Net/cap/bonnet \n4.5 \nFace mask/shield \n4.6 \nEar muffs \n4.7 \nApron/Gown/coverall/jump suit \n4.8 \nAnti-static suits \n5. Emergency-related \ndrills and training \n5.1 \nFire drill \n5.2 \nEarthquake drill \n5.3 \nBasic life support/CPR \n5.4 \nFirst aid \n5.5 \nSpillage control \n5.6 \nDecontamination of chemical and toxic \n5.7 \nDisaster preparedness/management \n6. OHS personal records \n6.1 \nMedical/Health records \n6.2 \nIncident reports \n6.3 \nAccident reports \n6.4 \nOHS-related training completed\n\n--- PDF PAGE 17 ---\nTR-Able Seafarer Deck NC II (STCW Regulation II/5) \nRevised June 26, 2013 \n13 \nEVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 \nExplained clearly established workplace safety and hazard \ncontrol practices and procedures \n1.2 \nIdentified hazards/risks in the workplace and its corresponding \nindicators in accordance with company procedures \n1.3 \nRecognized contingency measures during workplace \naccidents, fire and other emergencies \n1.4 \nIdentified terms of maximum tolerable limits based on \nthreshold limit value- TLV. \n1.5 \nFollowed Occupational Health and Safety (OHS) procedures \nfor controlling hazards/risks in workplace \n1.6 \nUsed Personal Protective Equipment (PPE) in accordance \nwith company OHS procedures and practices \n1.7 \nCompleted and updated OHS personal records in accordance \nwith workplace requirements \n \n2. Underpinning \nKnowledge and \nAttitude \n2.1 \nOHS procedures and practices and regulations \n2.2 \nPPE types and uses \n2.3 \nPersonal hygiene practices \n2.4 \nHazards/risks identification and control \n2.5 \nThreshold Limit Value -TLV \n2.6 \nOHS indicators \n2.7 \nOrganization safety and health protocol \n2.8 \nSafety consciousness \n2.9 \nHealth consciousness \n \n3. Underpinning Skills \n3.1 \nPractice of personal hygiene \n3.2 \nHazards/risks identification and control skills \n3.3 \nInterpersonal skills \n3.4 \nCommunication skills \n \n4. Resource Implications \nThe following resources must be provided: \n4.1 \nWorkplace or assessment location \n4.2 \nOHS personal records \n4.3 \nPPE \n4.4 \nHealth records \n \n5. Methods of \nAssessment \nCompetency may be assessed through: \n5.1 \nPortfolio Assessment \n5.2 \nInterview \n5.3 \nCase Study/Situation \n \n6. Context for \nAssessment \n6.1 \nCompetency may be assessed in the work place or in a \nsimulated work place setting\n\n--- PDF PAGE 18 ---\nTESDA-SOP-QSO-01-F08 \nTR-Able Seafarer Deck NC II (STCW Regulation II/5) \nRevised June 26, 2013 \n14 \nCOMMON COMPETENCIES \n \nUNIT OF COMPETENCY \n: \nSURVIVE AT SEA IN THE EVENT OF SHIP ABANDONMENT \n \nUNIT CODE \n: \nMTM834208 \n \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge, skills and attitudes in surviving at \nsea in the event of ship abandonment. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1. Respond to the \nindicated emergency \n \n \n1.1 \nMuster signal is identified and appropriate action to respond \nto the identified emergency is taken based on established \nprocedures. \n1.2 \nTiming and sequence of individual actions are practiced \nbased on prevailing circumstances and conditions and \npotential dangers and threats to survival are minimized. \n1.3 \nLife-saving appliances are used in accordance with \nstandards operating procedures. \n1.4 \nRecommended swimming techniques are practiced with or \nwithout wearing a lifejacket. \n \n2. Board a survival craft \n2.1 \nSurvival craft is boarded and dangers to other survivors are \navoided based on recommended method. \n2.2 \nInitial actions after leaving the ship are taken to minimize \nthreats to survival. \n2.3 \nSurvival craft equipment and location devices, including radio \nequipment, are operated based on established procedures \nand manufacturer’s instruction.\n\n--- PDF PAGE 19 ---\nTESDA-SOP-QSO-01-F08 \nTR-Able Seafarer Deck NC II (STCW Regulation II/5) \nRevised June 26, 2013 \n15 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Identified emergency \nMay include: \n1.1 \nCollision \n1.2 \nFire \n1.3 \nFoundering \n1.4 \nPerson falling overboard (man overboard) \n \n2. Dangers and threats to \nsurvival \nMay include: \n2.1 \nCold water shock \n2.2 \nHypothermia \n2.3 \nPsychological response to disaster \n2.4 \nLoss of will to live \n2.5 \nSea sickness \n2.6 \nDehydration \n2.7 \nInjuries \n2.8 \nStarvation \n \n3. Life-saving appliances \nMay include: \n3.1 \nLife jackets \n3.2 \nLife buoys \n3.3 \nHard hats \n3.4 \nImmersion suits and other thermal protective aid \n3.5 \nRocket line throwing appliances \n3.6 \nPyrotechnic distress signals \n3.7 \nGMDSS survival craft VHF radios \n3.8 \nSatellite emergency position indicating radio beacons \nEPIRBs \n3.9 \nSARTs \n3.10 Whistles \n \n4. Survival Craft \nMay include: \n4.1 \nFree fall life boats \n4.2 \nDavit launched life boats \n4.3 \nLife rafts\n\n--- PDF PAGE 20 ---\nTESDA-SOP-QSO-01-F08 \nTR-Able Seafarer Deck NC II (STCW Regulation II/5) \nRevised June 26, 2013 \n16 \nEVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate : \n1.1 \nresponded to indicated emergency \n1.2 \nboarded survival craft \n \n2. Required Knowledge \n2.1 \nTypes of emergency situations and actions to be taken when- \n2.1.1 called to survival craft stations \n2.1.2 required to abandon ship \n2.1.3 in the water \n2.1.4 aboard a survival craft \n2.1.5 a person falls overboard (man overboard) \n2.2 \nTypes, uses and location of life-saving appliances \n2.3 \nSurvival craft equipment and how to operate them \n2.4 \nValue of training and drills \n2.5 \nTypes and uses of personal protective clothing and \nequipment \n \n3. Required Skills \n3.1 \nDonning lifejacket \n3.2 \nDonning and using an immersion suit \n3.3 \nJumping from a height into the water \n3.4 \nRighting an inverted life raft while wearing a lifejacket \n3.5 \nKeeping afloat without a lifejacket \n3.6 \nTaking initial action on boarding survival craft \n3.7 \nStreaming a drogue or sea-anchor \n3.8 \nOperating survival craft equipment \n3.9 \nOperating location devices including radio equipment \n \n4. Resource Implications \nThe following resources should be provided: \n4.1 \nwork place with recommended facilities \n4.2 \ntools and equipment appropriate to the activity \n4.3 \nmaterials relevant to the proposed activity and tasks \n \n5. Methods of \nAssessment \nCompetency in this unit must be assessed through: \n5.1 \nDemonstration and questioning of related underpinning \nknowledge \n5.2 \nWritten examination \n5.3 \nPortfolio \n \n6. Context of Assessment 6.1 Competency may be assessed in workplace or in a simulated \nworkplace setting\n\n--- PDF PAGE 21 ---\nTESDA-SOP-QSO-01-F08 \nTR-Able Seafarer Deck NC II (STCW Regulation II/5) \nRevised June 26, 2013 \n17 \nUNIT OF COMPETENCY \n: \nMINIMIZE THE RISK OF FIRE AND MAINTAIN A STATE OF \nREADINESS TO RESPOND TO EMERGENCY SITUATIONS \nINVOLVING FIRE \n \nUNIT CODE \n: \nMTM 834209 \n \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge, skills and attitudes in performing \nfire prevention and firefighting activities \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1. Carry out fire \nminimization \nprocedures \n \n1.1 \nFire hazards on board vessel are identified and action is \ntaken to eliminate or minimize them. \n1.2 \nResponsibilities for checking fire prevention equipment and \nsystems are fulfilled and appropriate action is taken to ensure \nthat they are operational. \n1.3 \nAn awareness and understanding of the causes of fire and \nits minimization is maintained through participation in fire \ndrills and related instructional programs. \n1.4 \nA state of readiness to respond to fire emergencies is \nmaintained at all times. \n \n2. Respond to \nemergencies involving \nfire \n2.1. \nEmergency situations involving fire are correctly identified in \naccordance with established nautical practice. \n2.2. \nType of fire is identified in accordance with the established \nclassification system for fires. \n2.3. \nInitial action on becoming aware of fire emergency is in \nconformity with established practices and procedures. \n2.4. \nAction taken is timely and appropriate for seriousness of the \nfire emergency. \n2.5. \nAction taken on identifying muster signals for a fire \nemergency is appropriate and complies with established \nprocedures. \n2.6. \nAppropriate precautions and procedures are implemented \nwhen responding to electrical fires. \n2.7. \nAppropriate precautions and procedures are implemented \nwhen responding to uptake and hydrogen fires. \n2.8. \nCommunications are clear and concise at all times and orders \nare acknowledged in a timely and seamanlike manner.\n\n--- PDF PAGE 22 ---\nTESDA-SOP-QSO-01-F08 \nTR-Able Seafarer Deck NC II (STCW Regulation II/5) \nRevised June 26, 2013 \n18 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Fire and its \nminimization \nFire hazard minimization procedures may include: \n1.1. Housekeeping in work areas \n1.2. Following of fire safety procedures \n1.3. Checking and maintaining shipboard fire prevention systems \n1.4. Identification and elimination or minimization of fire hazards \n1.5. Precautions when using and storing flammable materials \n1.6. Precautions that need to be taken when responding to an \nelectrical fire \n1.7. Precautions that need to be taken when responding to uptake \nand hydrogen fires \n1.8. Precautions when using naked flames or welding equipment \n \n2. Fire emergencies \n Fire emergencies on board vessel may occur: \n2.1. By day or night in both normal and emergency situations \n2.2. Under any possible conditions of weather and loading \n2.3. While underway \n2.4. During berthing and un-berthing operations \n2.5. While anchoring or mooring \n2.6. While in port \n2.7. While moored or at anchor \n \n3. Type of fire \nStandard types of fires may include: \n3.1 \nClass A \n3.2 \nClass B \n3.3 \nClass C \n3.4 \nClass F\n\n--- PDF PAGE 23 ---\nTESDA-SOP-QSO-01-F08 \nTR-Able Seafarer Deck NC II (STCW Regulation II/5) \nRevised June 26, 2013 \n19 \nEVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate : \n1.1 implemented fire prevention and minimization measures and \nprocedures on board vessel \n1.2 recognized fire hazards onboard vessel and take appropriate \naction to eliminate or minimize them \n1.3 assessed the operational capability of fire-detection and fire- \nfighting equipment and systems and initiate any required \nmaintenance or replenishment action \n1.4 responded to emergency situations involving fire \n1.5 implemented OHS principles and policies when carrying out fire \nprevention and fire–fighting duties \n1.6 communicate effectively with others as required during fire \nprevention activities and fire emergencies \n \n2. Required Knowledge \n2.1 Relevant maritime regulations concerning minimization of the \nrisk of fire on board vessel \n2.2 The chemistry of fire and its relationship to materials typically \ncarried on vessels \n2.3 Principles underlying the spread of fire and its extinguishment, \nincluding the elements of fire and explosion (the fire triangle) \n2.4 Types and sources of ignition \n2.5 Flammable materials and fire hazards \n2.6 Factors that influence the spread of fire \n2.7 The importance of constant vigilance in fire prevention and \nminimization \n2.8 The different classes of fire, their characteristics and strategies \nand equipment needed for their extinguishment \n2.9 A basic understanding of the types of fire-detection, fire- fighting \nequipment and systems used on board vessels, their features, \nprinciples of operation and the procedures for their use and \nmaintenance \n2.10 Relevant regulations and policies related to the maintenance of \nfire equipment and systems \n2.11 Precautions and procedures that must be followed when \nresponding to electrical fires \n2.12 Precautions and procedures that must be followed when \nresponding to uptake and hydrogen fires \n2.13 Maritime communication techniques applicable to fire \nprevention and fire-minimization activities on board vessel \n2.14 Problems that can occur with shipboard fire-detection and fire \nhazards on board a vessel and appropriate action that should \nbe taken \n2.15 Sources of information on shipboard fire prevention and \nminimization\n\n--- PDF PAGE 24 ---\nTESDA-SOP-QSO-01-F08 \nTR-Able Seafarer Deck NC II (STCW Regulation II/5) \nRevised June 26, 2013 \n20 \n \n3. Required Skills \n3.1 Implementing of fire prevention and minimization measures and \nprocedures \n3.2 Identifying and evaluating fire hazards and taking appropriate \ncourses of action \n3.3 Responding to simulated and real emergency situations \ninvolving fire \n3.4 Assessing the operational capability of fire-detection equipment \nand systems and taking any required maintenance or \nreplenishment action \n \n4. Resource Implications \nThe following resources should be provided: \n4.1 work place with recommended facilities \n4.2 tools and equipment appropriate to the activity \n4.3 materials relevant to the proposed activity and tasks \n \n5. Methods of \nAssessment \nCompetency in this unit must be assessed through: \n5.1 Demonstration and questioning of related underpinning \nknowledge \n5.2 Written examination \n5.3 Portfolio \n \n6. Context of Assessment 6.1 Competency may be assessed in workplace or in a simulated \nworkplace setting\n\n--- PDF PAGE 25 ---\nTESDA-SOP-QSO-01-F08 \nTR-Able Seafarer Deck NC II (STCW Regulation II/5) \nRevised June 26, 2013 \n21 \nUNIT OF COMPETENCY \n: \nFIGHT AND EXTINGUISH FIRES \n \nUNIT CODE \n: \nMTM 834210 \n \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge, skills and attitudes in fighting and \nextinguishing fires \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1. Operate portable fire-\nfighting equipment \n \n1.1 \nType of fires is correctly identified in accordance with \naccepted fire-fighting practice. \n1.2 \nCorrect portable fire-fighting equipment is selected and used \nto fight specific classes of fires. \n1.3 \nClass F fires are correctly extinguished with a fire blanket in \naccordance with accepted fire-fighting practice. \n1.4 \nCorrect techniques are applied for the use of hose lines to \nextinguish fires on board a vessel. \n1.5 \nWhere applicable, correct techniques are applied for the \nsetting up of foam making equipment to extinguish B Class \nfires on board a vessel. \n \n2. Carry out fire-fighting \noperations \n2.1 \nFire is extinguished using appropriate procedures, techniques, \nequipment and fire-fighting agents. \n2.2 \nCorrect portable fire-extinguisher(s) are selected and used for \nthe class of fire involved in a fire emergency. \n2.3 \nAppropriate safety clothing, appliances and equipment is \nused and safety precautions and procedures are applied when \nfighting fires in accordance with regulatory requirements, \nvessel’s procedures and established fire-fighting practice. \n2.4 \nThe timing and sequence of individual actions when fighting \nfires onboard a vessel are appropriate to the prevailing \ncircumstances and conditions. \n2.5 \nSearch and rescue operations in a smoke filled environment \nare correctly conducted as a member of a fire-fighting team in \naccordance with accepted fire-fighting practice. \n2.6 \nInterior fires are extinguished using appropriate fire-fighting \nequipment and procedures as a member of a fire-fighting team \nin accordance with accepted fire-fighting practice. \n2.7 \nLifeline signals are correctly used during interior fire-fighting \noperations.\n\n--- PDF PAGE 26 ---\nTESDA-SOP-QSO-01-F08 \nTR-Able Seafarer Deck NC II (STCW Regulation II/5) \nRevised June 26, 2013 \n22 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Type of fire \nStandard types of fires may include: \n1.1 Class A \n1.2 Class B \n1.3 Class C \n1.4 Class F \n \n2. Fire-fighting equipment Fire-fighting equipment, appliances and systems may include: \n2.1 Portable fire extinguishers including foam, water, CO 2 , dry \nchemical and wet foam \n2.2 Fire blankets \n2.3 CO2 fixed systems \n2.4 Foam installations including semi-portable and fixed systems \n2.5 Sprinkler systems \n2.6 Fire pumps (main and emergency fire pump) \n2.7 Fire hoses, hydrants, branches and international shore \nconnection \n \n3. Fire on board a vessel \n \nFire emergencies on board vessel may occur: \n3.1 By day or night in both normal and emergency situations \n3.2 Under any possible conditions of weather and loading \n3.3 While underway \n3.4 During berthing and un-berthing operations \n3.5 While anchoring or mooring \n3.6 While in port \n3.7 While moored or at anchor \n \n4. Safety clothing, \nappliances and \nequipment \nSafety clothing and equipment may include: \n4.1 Fire-resistant clothing \n4.2 Self-contained breathing apparatus (SCBA) \n4.3 Masks \n4.4 Eye and ear protection \n4.5 Gloves \n4.6 Boots\n\n--- PDF PAGE 27 ---\nTESDA-SOP-QSO-01-F08 \nTR-Able Seafarer Deck NC II (STCW Regulation II/5) \nRevised June 26, 2013 \n23 \nEVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate : \n1.1 \nparticipated in simulated on-boar d fire-fighting activities \n1.2 \nparticipated in search and rescue and fire-fighting teams \n1.3 \napplied OHS principles and policies when carrying out fire-\nfighting duties \n1.4 \ncommunicated effectively with others as required during fire \nemergencies \n \n2. Required Knowledge \n2.1 \nKnowledge of relevant maritime regulations \n2.2 \nThe chemistry of fire and its relationship to materials typically \ncarried on vessels \n2.3 \nPrinciples underlying the spread of fire and how it is \nextinguished \n2.4 \nThe different types of fire, their characteristics and strategies \nand equipment needed to extinguish them \n2.5 \nPrinciples and procedures for the use of self-contained \nbreathing apparatus (SCBA) when fighting fires \n2.6 \nFire-fighting clothing, outfits and personal safety equipment \nused when fighting a fire onboard a vessel \n2.7 \nTypes fire-fighting appliances, equipment and systems used \non board vessels, their features, principles of operation and \nthe procedures for their use and maintenance \n2.8 \nFixed fire prevention and extinguishing installations used on \nvessels and their principles of operation \n2.9 \nFire-fighting techniques, agents and precautions applicable to \ndifferent types of fire on board a vessel \n2.10 Maritime communication techniques applicable to fire-fighting \nactivities onboard a vessel \n2.11 Typical problems that can occur with shipboard fire-fighting \nequipment and operations and appropriate remedial action \nand solutions \n2.12 Sources of information on shipboard fire prevention and \nextinguishment \n \n3. Required Skills \n3.1 \nApplying fire prevention measures and procedures \n3.2 \nIdentifying fire fighting problems and determining appropriate \ncourses of action \n3.3 \nParticipating as a member of an interior search and rescue \nand fire-fighting team on board a vessel \n3.4 \nDetermining the operational capability of fire-fighting \nappliances, equipment and systems \n \n4. Resource Implications \nThe following resources should be provided: \n4.1 \nwork place with recommended facilities \n4.2 \ntools and equipment appropriate to the activity \n4.3 \nmaterials relevant to the proposed activity and tasks \n \n5. Methods of \nAssessment \nCompetency in this unit must be assessed through: \n5.1 \nDemonstration and questioning of related underpinning \nknowledge \n5.2 \nWritten examination \n5.3 \nPortfolio \n \n6. Context of Assessment 6.1 Competency may be assessed in workplace or in a simulated \nworkplace setting\n\n--- PDF PAGE 28 ---\nTESDA-SOP-QSO-01-F08 \nTR-Able Seafarer Deck NC II (STCW Regulation II/5) \nRevised June 26, 2013 \n24 \nUNIT OF COMPETENCY \n: \nTAKE IMMEDIATE ACTION UPON ENCOUNTERING AN \nACCIDENT OR OTHER MEDICAL EMERGENCY \n \nUNIT CODE \n: \nMTM834211 \n \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge, skills and attitudes in taking \nimmediate action upon encountering an accident or other medical \nemergency. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1. Determine the need of \ncasualty \n \n1.1 \nPatient condition is determined in accordance with established \nfirst aid procedures and the nature of injury or illness is \nestablished. \n1.2 \nProbable cause, nature and extent of injuries is identified and \nappropriate action is taken to prevent further harm to the victim \nand to self. \n1.3 \nThe position of the patient is adjusted to optimize personal \ncomfort for the medical condition or injury concerned. \n1.4 \nWhere there are doubts over the seriousness of the injury or \nillness and how to treat the patient, assistance is sought from \nsenior officers or shore-based medical advisers. \n \n2. Administer first-aid to \nthe victim \n \n2.1 \nAppropriate first aid procedures are used to treat the identified \ninjury or illness in accordance with the first-aider’s limits of \nresponsibility. \n2.2 \nAseptic techniques are applied during any wound dressing. \n2.3 \nHygiene measures are used that are appropriate for the \ndegree of illness or injury. \n2.4 \nCardio-pulmonary resuscitation techniques are correctly \napplied where required. \n2.5 \nCondition of the patient is regularly monitored both visually and \nthrough appropriate measures of bodily signs. \n2.6 \nHealth precautions and disease prevention measures are \nimplemented in accordance with regulatory requirements and \ncompany procedures. \n2.7 \nAppropriate action is taken if there are signs of a deterioration \nin the condition of the patient. \n2.8 \nWhere necessary, assistance is provided in the preparation \nand transporting of the victim.\n\n--- PDF PAGE 29 ---\nTESDA-SOP-QSO-01-F08 \nTR-Able Seafarer Deck NC II (STCW Regulation II/5) \nRevised June 26, 2013 \n25 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Patient \nMay include patient having: \n1.1 \nHeart attack \n1.2 \nStroke \n1.3 \nAsthma attack \n1.4 \nDiabetes \n1.5 \nEpilepsy seizures \n \n2. Injuries \nInjuries on board a vessel may include: \n2.1 \nExternal bleeding \n2.2 \nAn amputation \n2.3 \nA foreign body in the eye \n2.4 \nA penetrating chest wound \n2.5 \nA nose bleed \n2.6 \nInternal bleeding \n2.7 \nFractures, sprains, strains and dislocations \n2.8 \nElectric shock \n2.9 \nAsphyxia\n\n--- PDF PAGE 30 ---\nTESDA-SOP-QSO-01-F08 \nTR-Able Seafarer Deck NC II (STCW Regulation II/5) \nRevised June 26, 2013 \n26 \nEVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate : \n1.1 \nidentified and prioritized the need for medical first aid in life-\nthreatening medical emergencies \n1.2 \nadministered first aid on board a vessel \n1.3 \ncommunicated effectively with others during medical \nemergencies and health care \n \n2. Required Knowledge \n2.1 \nRelevant sections of maritime regulations \n2.2 \nEmergencies, injuries and medical problems that may occur \non board a vessel and appropriate action, treatments and \nsolutions \n2.3 \nRelevant OH&S and health legislation and policies \n2.4 \nDuties and responsibilities of the designated first aid officer on \nboard a vessel \n2.5 \nFirst aid procedures \n2.6 \nShipboard procedures for: \n2.6.1 conducting an initial patient first aid assessment \n2.6.2 managing injuries \n2.6.3 managing medical emergencies \n2.6.4 carrying out resuscitation techniques \n2.7 \nTechniques for care of wounds \n2.8 \nWays in which disease can spread on board a vessel and \nways of preventing the spread \n2.9 \nLegal issues related to the administration of drugs and \nmedicines on board a vessel \n2.10 Knowledge of body structures and functions relevant to \npossible injury, illnesses and disease that may be encountered \non board a vessel \n2.11 Maritime communication techniques related to health care and \nreceiving radio medical advice from shore-based advisers \n2.12 Marine publications containing information on first aid and \nmedical treatment on board a vessel \n \n3. Required Skills \n3.1 \nProviding first-aid on board a vessel \n3.2 \nIdentifying and problems and emergencies and taking \nappropriate courses of action \n3.3 \nApplying aseptic and other precautionary techniques when \ncarrying out first-aid procedures on board a vessel \n \n4. Resource Implications \nThe following resources should be provided: \n4.1 \nwork place with recommended facilities \n4.2 \ntools and equipment appropriate to the activity \n4.3 \nmaterials relevant to the proposed activity and tasks \n \n5. Methods of \nAssessment \nCompetency in this unit must be assessed through: \n5.1 \nDemonstration and questioning of related underpinning \nknowledge \n5.2 \nWritten examination \n5.3 \nPortfolio \n \n6. Context of Assessment 6.1 Competency may be assessed in workplace or in a simulated \nworkplace setting\n\n--- PDF PAGE 31 ---\nTESDA-SOP-QSO-01-F08 \nTR-Able Seafarer Deck NC II (STCW Regulation II/5) \nRevised June 26, 2013 \n27 \nUNIT OF COMPETENCY \n: \nCOMPLY WITH EMERGENCY PROCEDURES \n \nUNIT CODE \n: \nMTM834212 \n \nUNIT DESCRIPTOR \n: \nThis unit deals with the knowledge and skills required to take \nappropriate initial action on becoming aware of an emergency on \nboard a commercial vessel in conformance with the established \nemergency response procedures. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized items are elaborated in the Range of Variables \n1. Take action on becoming \naware of an emergency \n1.1 Emergency situations are recognized and identified. \n1.2 Responses to an emergency situation followed the \nestablished vessel’s emergency response procedures. \n1.3 Correct actions are taken on discovery of an actual or \npotential emergencies/emergency situation in \naccordance with established vessel’s emergency response \nprocedures. \n1.4 Information given on raising alarm is prompt, accurate, \ncomplete and clear. \n \n2. Follow established \nemergency procedures \n2.1 Vessel’s contingency plans for emergency response are \nknown and are implemented in real and simulated \nemergency situations. \n2.2 Escape routes and internal and external communications \nand alarm systems are used in real and simulated \nemergency situations in accordance with regulatory \nrequirements and established procedures. \n2.3 Emergency communications and alarm signals and systems \nare understood and required action implemented in \naccordance with emergency procedures and regulatory \nrequirements. \n2.4 Planned damage control procedures for dealing with \ndamage to the vessel and its hull are implemented in \naccordance with company procedures and regulatory \nrequirements. \n \n3. Follow procedures for the \nuse of various life-saving \nequipment \n3.1 Participation in life saving drills confirms readiness to \ncorrectly carry out life-saving procedures and use life-\nsaving equipment. \n3.2 Procedures for the use of various shipboard life-saving \nappliances are followed in accordance with regulatory \nrequirements, manufacturer’s instructions and company \nprocedures.\n\n--- PDF PAGE 32 ---\nTESDA-SOP-QSO-01-F08 \nTR-Able Seafarer Deck NC II (STCW Regulation II/5) \nRevised June 26, 2013 \n28 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Emergency situations \nMay include: \n1.1 Collision with another vessel \n1.2 Explosion on board vessel \n1.3 Fire on board vessel \n1.4 Impairment of integrity of hull and ingress of water \n1.5 Loss of steering control \n1.6 Lost of motive power \n1.7 Foundering \n1.8 Grounding \n1.9 Beaching a Vessel \n1.10 Person overboard \n1.11 Rescue and evacuation of injured personnel \n \n2. Potential emergencies \nMay occur: \n2.1 By day or night \n2.2 Under any possible conditions of weather and loading \n2.3 While underway \n2.4 During berthing and unberthing operations \n2.5 While anchoring or mooring \n2.6 When bunkering \n2.7 During cargo handling operations \n \n3. Regulatory requirements \nMay include: \n3.1 SOLAS convention \n3.2 IMO STCW Codes and Convention \n3.3 Relevant domestic and international OH&S legislation \n \n4. Life-saving equipment \nMay include: \n4.1 Life jackets \n4.2 Exposure and immersion suits \n4.3 Survival craft\n\n--- PDF PAGE 33 ---\nTESDA-SOP-QSO-01-F08 \nTR-Able Seafarer Deck NC II (STCW Regulation II/5) \nRevised June 26, 2013 \n29 \nEVIDENCE GUIDE \n \n1. Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1 \nundertook appropriate action in the event of emergency \nsituations \n1.2 \nfollowed established procedures and regulatory requirements \nduring emergency responses’ procedures \n1.3 \nfollowed procedures for the use of various life-saving equipment \n1.4 \nparticipated in drills in preparation for the implementation of \nemergency responses \n1.5 \ncommunicated effectively with others during emergency \nresponses’ procedures \n \n2. Required Knowledge 2.1 \nTypes of emergencies \n2.2 \nShipboard contingency plans \n2.3 \nKnowledge of relevant maritime regulations \n2.4 \nRelevant OH&S legislation and policies \n2.5 \nNavigational emergencies for vessels and appropriate action \nand solutions \n2.6 \nIndications of various types of emergency situations and the \naction to be followed when various types of actual or potential \nemergency situations are identified \n2.7 \nEmergency alarm signals and systems in use on vessels and \nprocedures to be followed when an emergency alarm is raised \n2.8 \nEscape routes and internal and external communications \nsystems and alarms on board a vessel \n2.9 \nGeneral principles of damage control and the manner in which \nwatertight integrity of hull is maintained on a vessel, including \nthe importance of preparation, control and repair \n2.10 Ways of controlling damage during a flooding emergency, \nincluding the use of various shipboard items that can be used \nfor damage control purposes such as mattresses, canvas and \nclothing \n2.11 Maritime communication techniques used during navigational \nemergencies of actual or potential emergency situations are \nidentified \n2.12 Emergency alarm signals and systems in use on vessels and \nprocedures to be followed when an emergency alarm is raised \n2.13 Escape routes and internal and external communications \nsystems and alarms on board a vessel \n2.14 General principles of damage control and the manner in which \nwatertight integrity of hull is maintained on a vessel, including \nthe importance of preparation, control and repair \n2.15 Ways of controlling damage during a flooding emergency, \nincluding the use of various shipboard items that can be used \nfor damage control purposes such as mattresses, canvas and \nclothing\n\n--- PDF PAGE 34 ---\nTESDA-SOP-QSO-01-F08 \nTR-Able Seafarer Deck NC II (STCW Regulation II/5) \nRevised June 26, 2013 \n30 \n \n3. Required Skills \n3.1 Applying navigational emergencies for vessels and appropriate \naction and solutions \n3.2 Applying appropriate action in various types of actual or \npotential emergency situations \n3.3 Using emergency alarm signals and systems \n3.4 Using various shipboard items to be used for damage control \npurposes such as mattresses, canvas and clothing \n3.5 Using personal safety equipment \n \n4. Resource \nImplications \nThe following resources should be provided: \n4.1 simulated workplace environment \n4.2 workplace standards, procedures, policies, guidelines \n4.3 tools and equipment relevant to work activities \n \n5. Methods of \nAssessment \n \nCompetency in this unit may be assessed through: \n5.1 \nObservation/simulated practical demonstration in responding to \nemergency situations onboard a commercial vessel, and/or \n5.2 \nSimulation/role plays to test the candidate’s knowledge and \nskills in complying with emergency procedures \n \n6. Context of \nAssessment \n6.1 Competency may be assessed in workplace or in a simulated \nworkplace setting\n\n--- PDF PAGE 35 ---\nTESDA-SOP-QSO-01-F08 \nTR-Able Seafarer Deck NC II (STCW Regulation II/5) \nRevised June 26, 2013 \n31 \nUNIT OF COMPETENCY \n: \nTAKE PRECAUTIONS TO PREVENT POLLUTION OF THE \nMARINE ENVIRONMENT \n \nUNIT CODE \n: \nMTM834213 \n \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge, skills and attitudes in taking \nprecautions towards protection of the marine environment. \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1. Practice compliance \nwith legislative \nrequirements for \nprotection of the \nmarine environment \n1.1 Relevant regulations and procedures for the protection of the \nmarine environment are identified. \n1.2 Appropriate action is taken in day-to-day work to ensure \ncompliance with relevant regulations and procedures for the \nprotection of the marine environment as required. \n1.3 Appropriate action is taken where incidences of non-compliance \nor potential non-compliance are identified in accordance with \nregulations and procedures. \n1.4 Any breach of regulations and procedures concerning \nprotection of the marine environment is rectified and/or reported \nas required within the limits of the crew’s/ officer’s responsibility. \n \n2. Practice anti-pollution \nprocedures \n \n2.1 Anti-pollution procedures applicable to vessel operations are \nfollowed in the course of day-to-day work. \n2.2 Appropriate preventive measures are undertaken to prevent \npollution of the marine environment in accordance with \nregulations and procedures. \n2.3 Inputs are provided in the preparation of reports and other \ndocumentation related to the protection of marine environment \nin accordance with regulations and procedures.\n\n--- PDF PAGE 36 ---\nTESDA-SOP-QSO-01-F08 \nTR-Able Seafarer Deck NC II (STCW Regulation II/5) \nRevised June 26, 2013 \n32 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Protection of the \nmarine environment \nProtection of the marine environment may be observed: \n1.1 By day or night in both normal and emergency situations \n1.2 Under any possible conditions of sea and weather \n1.3 While underway \n1.4 During berthing and unberthing operations \n1.5 While anchoring or mooring \n1.6 While moored or at anchor \n1.7 During loading and unloading operations \n1.8 During maintenance operations \n \n2. Anti-pollution \nprocedures \nAnti-pollution procedures include checking of items and equipment \nsuch as: \n2.1 Pumps \n2.2 Valves \n2.3 Emission control equipment \n2.4 Water management equipment including: cooling water, ballast \nwater and bilge systems \n2.5 Waste storage and recycling equipment \n2.6 Ballast management equipment \n \n3. Preventive measures \nPreventative measures to protect the marine environment may \ninclude: \n3.1 Prevention of spillages of cargo \n3.2 Prevention of spillage s of fuel and oil \n3.3 Control of polluting emissions of gas and smoke \n3.4 Effective management of waste, pollution and recycling \nprocesses \n3.5 Effective management of ballast operations \n3.6 Shipboard housekeeping \n3.7 Pollution control instructions \n \n4. Regulations \nApplicable regulations may include: \n4.1 MARPOL Convention \n4.2 IMO STCW Code and Convention related to the protection of \nmarine environment \n4.3 Relevant international and/or local legislation related to the \nprotection of the marine environment\n\n--- PDF PAGE 37 ---\nTESDA-SOP-QSO-01-F08 \nTR-Able Seafarer Deck NC II (STCW Regulation II/5) \nRevised June 26, 2013 \n33 \nEVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate : \n1.1 practiced compliance with legislative requirements for \nprotection of the marine environment \n1.2 practiced preventative and remedial anti-pollution procedures \nas per relevant regulations and procedures \n1.3 identified typical pollution control problems and take appropriate \naction \n1.4 communicate effectively with others concerning measures to \nprotect the marine environment \n \n2. Required Knowledge \n2.1 Relevant legislation, codes of practice, policies and procedures \nto protect the marine environment \n2.2 Impact of shipping on the marine environment and the effects of \noperational or accidental pollution on it \n2.3 Basic environmental protection procedures \n2.4 Pollution control problems and related measures to protect the \nmarine environment \n2.5 Complexity and diversity of the marine environment \n2.6 Requirements under local and/or international legislation and \nconventions for reporting incidents related to breaches of the \nstatutory codes and measures for the protection of the marine \nenvironment \n \n3. Required Skills \n3.1 Completing activities aimed at compliance with relevant \nregulatory requirements for protection of the marine \nenvironment \n3.2 Identifying and evaluating problems related to compliance with \nrelevant regulations for environmental protection and \ndetermining an appropriate courses of action \n3.3 Following anti-pollution procedures \n4. Resource Implications \nThe following resources should be provided: \n4.1. work place with recommended facilities \n4.2. tools and equipment appropriate to the activity \n4.3. materials relevant to the proposed activity and tasks \n \n5. Methods of \nAssessment \nCompetency in this unit must be assessed through: \n5.1. Demonstration and questioning of related underpinning \nknowledge \n5.2. Written examination \n5.3. Portfolio \n \n6. Context of Assessment 6.1 Competency may be assessed in workplace or in a simulated \nworkplace setting\n\n--- PDF PAGE 38 ---\nTESDA-SOP-QSO-01-F08 \nTR-Able Seafarer Deck NC II (STCW Regulation II/5) \nRevised June 26, 2013 \n34 \nUNIT OF COMPETENCY \n: \nOBSERVE SAFE WORKING PRACTICES \n \nUNIT CODE \n: \nMTM834214 \n \nUNIT DESCRIPTOR \n: \nThis unit deals with the knowledge and skills required to observe \nestablished maritime safe working practices. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized items are elaborated in the Range of Variables \n1. Identify and follow \nworkplace procedures \nfor hazard \nidentification and risk \ncontrol \n1.1 Safety regulations and established vessel’s safety and hazard \ncontrol practices and procedures are obtained, interpreted and \napplied to day-to-day work activities. \n1.2 Workplace procedures for Occupational Health and Safety and \nrelated work instructions for controlling risks onboard a vessel \nare followed. \n1.3 Workplace procedures for dealing with shipboard accidents, fire \nand emergencies are known and followed. \n1.4 Hazards in the workplace are identified and appropriate action \nis taken to report them and to minimize or eliminate risk to \npersonnel, vessel and the environment. \n1.5 Where relevant, procedures and precautions necessary for entry \ninto a pump room, fuel tanks or other confined spaces on a \nvessel are followed. \n1.6 Personal protection clothing and equipment is used in \naccordance with established shipboard safety practices and \nprocedures. \n1.7 Appropriate assistance is provided in the event of a shipboard \nemergency to secure the vessel and its machinery and \nequipment and to maintain the safety of the vessel and persons \ninvolved. \n1.8 Established emergency and contingency plans are followed in \nthe event of a shipboard emergency. \n2. Contribute to \narrangements for the \nmanagement of \noccupational health \nand safety \n2.1 Occupational Health and Safety issues and identified safety \nhazards are raised with designated personnel in accordance \nwith workplace procedures and relevant occupational health and \nsafety legislation. \n2.2 Contributions to occupational health and safety management in \nthe workplace are made within workplace procedures and \nprovisions of relevant legislation. \n2.3 Occupational health and safety issues are raised with \ndesignated personnel in accordance with workplace procedures \nand relevant occupational health and safety legislation. \n2.4 Contribute to participative arrangements for occupational \nhealth and safety management in the workplace within vessel’s \nprocedures and scope of responsibilities and competencies. \n3. Take necessary \nactions to control \nfatigue \n3.1 Fatigue symptoms are recognized and identified. \n3.2 Corrective actions are taken on discovery of fatigue in \naccordance with established company procedures. \n3.3 Fatigue management practices are observed at all times. \n3.4 Reports related to incidence of fatigue are communicated to \nappropriate authority in accordance with established company \nprocedures. \n4. Complete occupational \nhealth and safety \nrecords \n4.1 Occupational health and safety records for self are completed in \naccordance with workplace requirements. \n4.2 Legal requirements for the maintenance of records of \noccupational injury and diseases are followed.\n\n--- PDF PAGE 39 ---\nTESDA-SOP-QSO-01-F08 \nTR-Able Seafarer Deck NC II (STCW Regulation II/5) \nRevised June 26, 2013 \n35 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Emergencies \nMay include: \n1.1 \nLoss of propulsion \n1.2 \nLoss of electrical power \n1.3 \nLoss of steerage \n1.4 \nFlooding of vessel \n1.5 \nFire or explosion \n1.6 \nLoss of refrigeration \n1.7 \nLoss of water making ability \n1.8 \nFuel oil, lubrication oil, steam and gas leaks \n1.9 \nOverheating and over speed of machinery, governors, \nemergency trips \n \n2. Hazards in the workplace \nMay include: \n2.1 \nMoving heavy loads in an unsafe work environment \n2.2 \nUnsecure machinery, components or repair equipment \n2.3 \nSlippery deck \n2.4 \nWelding equipment \n2.5 \nSharp tools and implements \n2.6 \nPower tools \n2.7 \nMoving and rotating machinery \n2.8 \nFlammable liquids, vapors and fuel \n2.9 \nUsing equipment beyond safe working limits \n2.10 Poor housekeeping procedures \n2.11 Electrical wiring and systems \n2.12 Hot pipes and valves (steam, fuel oil, lubricating oil) \n2.13 Cold pipes and valves (refrigeration and liquefied gas \ncargoes) \n2.14 Working at heights \n2.15 Exposed electrical circuits \n2.16 Toxic gases and substances \n2.17 Chemicals and other harmful substances \n2.18 Damaged cargo and containers \n \n3. Participative \narrangements \nMay include: \n3.1 \nFormal and informal meetings which include \noccupational health and safety \n3.2 \nOccupational health and safety committees \n3.3 \nOther committees, for example, consultative, planning \nand purchasing \n3.4 \nHealth and safety representatives \n3.5 \nSuggestions, requests, reports and concerns put \nforward by vessel’s crew to senior officers\n\n--- PDF PAGE 40 ---\nTESDA-SOP-QSO-01-F08 \nTR-Able Seafarer Deck NC II (STCW Regulation II/5) \nRevised June 26, 2013 \n36 \nEVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency \nAssessment requires evidences that the candidate: \n1.1 \nidentified and followed workplace procedures for hazard \nidentification and risk control \n1.2 \ncontributed to arrangements for the management of OHS \nonboard a vessel \n1.3 \nunderstood and taken necessary actions to control fatigue \n1.4 \ncompleted OHS records as required \n1.5 \ncommunicated effectively with others on workplace safety \nmatters \n \n2. Required Knowledge 2.1 \nKnowledge of relevant maritime and OHS regulations \n2.2 \nISM Code Safety Management System procedures (where \napplicable) \n2.3 \nThe provisions of OHS Acts, regulations and codes of practice \nrelevant to the workplace, including the rights and \nresponsibilities of the workplace parties under OHS Acts, \nregulations and codes of practice; \n2.4 \nThe ways in which OHS is managed in the workplace, and \nactivities required under OHS legislation, for example: \n2.4.1 policies \n2.4.2 procedures \n2.4.3 plant and equipment maintenance \n2.4.4 hazard identification \n2.4.5 risk assessment and control \n2.4.6 OHS instruction \n2.4.7 training and provision of OHS information \n2.5 \nHazards that exist in the workplace \n2.6 \nThe preferred order of ways to control risks (known as the \nhierarchy of control); \n2.7 \nWorkplace OHS procedures relevant to the work being \nundertaken, including procedures for: \n2.7.1 recognizing and reporting on hazards, for example, work \narea inspections \n2.7.2 work operations to control risks, for example, permit to \nwork systems and isolation procedures \n2.7.3 responding to accidents, fires and emergencies \n2.7.4 raising OHS issues \n2.7.5 employee participation in OHS management, for \nexample, consultative or OHS committees and \n2.7.6 joint employer/employee inspections \n2.8 \nThe meaning of OHS symbols found on signs and labels in the \nworkplace \n2.9 \nDesignated personnel responsible for OHS onboard a vessel \n2.10 Effects of sleep, schedules, and the circadian rhythm on fatigue \n2.11 Effects of physical stressors on seafarers \n2.12 Effects of environmental stressors in and outside the ship and \ntheir impact \n2.13 Effects of schedule changes on seafarer fatigue\n\n--- PDF PAGE 41 ---\nTESDA-SOP-QSO-01-F08 \nTR-Able Seafarer Deck NC II (STCW Regulation II/5) \nRevised June 26, 2013 \n37 \n \n3. Required Skills \na. \nApplying OHS in the workplace, and activities required under \nOHS legislation, \nb. \nApplying order of ways to control risks (known as the hierarchy \nof control) \nc. \nDesignating personnel responsible for OHS onboard a vessel \nd. \nCommunication skills \n \n4. Resource \nImplications \nThe following resources should be provided: \n4.1 simulated workplace environment \n4.2 workplace standards, procedures, policies, guidelines \n4.3 tools and equipment relevant to work activities \n \n5. Methods of \nAssessment \n \nCompetency in this unit may be assessed through: \n5.1 Observation/simulated practical demonstration in the application \nof safe working practices and safety hazard control onboard a \nvessel \n5.2 Simulation/role plays to test the candidate’s knowledge and skills \nin the application of safe working practices and hazard control \nand safety hazard control on a commercial/or training vessel \n \n6. Context of \nAssessment \n6.1 Assessment may be conducted in the workplace or in simulated \nwork environment\n\n--- PDF PAGE 42 ---\nTESDA-SOP-QSO-01-F08 \nTR-Able Seafarer Deck NC II (STCW Regulation II/5) \nRevised June 26, 2013 \n38 \nUNIT OF COMPETENCY \n: \nDEMONSTRATE SECURITY AWARENESS PRACTICES \n \nUNIT CODE \n: \nMTM834215 \n \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge, skills and attitudes in \ndemonstrating security awareness practices. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1. Contribute to the \nenhancement of \nmaritime security \nthrough heightened \nawareness \n1.1 Requirements relating to enhanced maritime security are \nidentified. \n1.2 All critical factors relevant to the security and safety of a \nmaritime workplace are monitored continuously during work \noperations. \n1.3 Relevant information concerning the security and safety of a \nmaritime workplace is recognized and interpreted and \ntimely action is taken in accordance with workplace \nprocedures. \n1.4 Changes to work environment and related risks are \nmonitored and managed to ensure a safe outcome to \nworkplace operations. \n1.5 A security-related contingency plan action is studied and \ninterpreted and where necessary appropriate action is taken. \n1.6 Reports on matters related to vessel security are prepared \nand submitted to designated personnel in accordance with \nthe ship security plan and company and maritime regulatory \nrequirements. \n \n2. Recognize security \nthreats \n \n2.1 Factors that may adversely affect the security and safety of a \nmaritime workplace are identified. \n2.2 Risks to vessel or port security and safety are recognized \nand reported to relevant security personnel and appropriate \naction is taken to control the risk in accordance with \nworkplace procedures and security requirements. \n2.3 Persons posing potential security risks are recognized \nand reported to relevant security personnel and appropriate \naction is taken to control the risk in accordance with \nworkplace procedures and security requirements. \n2.4 All relevant indications of a security situation are \nrecognized and appropriate action is taken to alert relevant \npersonnel and/or take appropriate action in accordance with \nworkplace procedures and regulatory requirements. \n \n3. Understand the need \nfor and maintaining \nsecurity awareness \nand vigilance \n3.1 Security instruction programs are participated in as per \ncompany and regulatory requirements. \n3.2 Requirements and processes for security awareness and \nvigilance are identified. \n3.3 Security and emergency drills are participated in \naccordance with the ship security plan and company and \nmaritime regulatory requirements. \n3.4 Inputs to improve/enhance security training programs and drills \nare provided, where necessary.\n\n--- PDF PAGE 43 ---\nTESDA-SOP-QSO-01-F08 \nTR-Able Seafarer Deck NC II (STCW Regulation II/5) \nRevised June 26, 2013 \n39 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Maritime workplace \nWorkplace may include: \n1.1. Vessels \n1.2. Port facilities \n2. Relevant security \npersonnel \nMay include: \n2.1. Ship security officer \n2.2. Port security officer \n2.3. Company security officer \n2.4. Master or skipper of the vessel \n2.5. \nOther personnel on vessel (in terms of their security awareness, \npreparedness and vigilance) \n3. Persons posing \npotential security risks \nMay include: \n3.1. \nUnknown persons photographing vessels or facilities \n3.2. \nUnknown persons attempting to gain access to vessels or \nfacilities \n3.3. \nUnknown persons loitering in the vicinity of vessels or port \nfacilities \n3.4. \nUnknown persons telephoning to ascertain security, personnel \nor standard operating procedures on a vessel or at a port \nfacility \n3.5. \nVehicles or small vessels with personnel in them loitering \nand perhaps taking photographs or drawing diagrams of \nvessels or facilities \n3.6. \nGeneral aviation aircraft operating in proximity of vessels or \nfacilities \n3.7. \nUnauthorized vendors attempting to sell merchandise \n3.8. \nPersons carrying suspicious parcels which could be bombs \n3.9. \nUnknown persons acting suspiciously \n3.10. Unknown persons seeking information from vessel personnel \nor their families about vessels or port facilities via either face-\nto-face discussion or email \n3.11. Unauthorized workers attempting to gain access to a vessel or \nport facilities to repair, replace, service or install equipment \n4. Security situation \nMay include:: \n4.1. \nPiracy/hijacking \n4.2. \nArmed robbery \n4.3. \nBomb threat \n4.4. \nUnidentified objects/explosives on vessel \n4.5. \nDamage to or destruction of port facility \n4.6. \nDamage to or destruction of vessel \n4.7. \nPiracy and other depredations \n4.8. \nStowaways \n5. Security and \nemergency drills \nSecurity and emergency drills may relate to incidents such as: \n5.1. \nDamage to or destruction of the vessel or port facility (e.g. by \nexplosive devices, arson, sabotage or vandalism) \n5.2. \nHijacking or seizure of a vessel or of persons on board \n5.3. \nTampering with cargo or essential vessel equipment or \nsystems or vessel's stores \n5.4. \nUnauthorized access to or use of the vessel (including \npresence of stowaways) \n5.5. \nSmuggling of weapons or equipment (including weapons of \nmass destruction) \n5.6. \nUse of the vessel to carry persons intending to cause a \nsecurity incident (or their equipment) \n5.7. \nUse of the vessel itself as a weapon or as a means to cause \ndamage or destruction \n5.8. \nAttacks from seaward while at berth or at anchor \n5.9. \nAttacks while at sea\n\n--- PDF PAGE 44 ---\nTESDA-SOP-QSO-01-F08 \nTR-Able Seafarer Deck NC II (STCW Regulation II/5) \nRevised June 26, 2013 \n40 \nEVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate : \n1.1. contributed to the enhancement of maritime security through \nheightened awareness \n1.2. recognized security threats \n1.3. understood the need for and methods of maintaining security \nawareness and vigilance \n \n2. Required Knowledge \n2.1. IMO ISPS Code applicable to vessels and ports \n2.2. Procedures for maintaining security awareness \n2.3. Relevant security and safety regulations, rules, policies and \nprocedures \n2.4. Relevant security personnel on a vessel or at a port facility \n2.5. Communication procedures and protocols on matters related to \nvessel and port security \n2.6. Security and safety problems that may be identified when \nmaintaining and managing situation awareness and action that \ncan be taken to overcome them \n2.7. Security and safety hazards and risks that may be identified in \nthe maritime workplace and ways of controlling those hazards \nand associated risks \n \n3. Required Skills \n3.1. Applying the above knowledge to the management of situation \nawareness during workplace operations \n3.2. Reading and interpreting instructions, procedures and other \ninformation relevant to the maintenance of vessel and port \nsecurity \n3.3. Working as a team with others on matters relevant to the \nmaintenance of vessel and port security \n3.4. Selecting and using appropriate communications equipment \n3.5. Taking appropriate initiatives related to vessel and port security \nwithin limits of role and responsibility \n3.6. Interpreting and applying security and safety practices and \nregulations \n3.7. Communicating with others on matters related to vessel and \nport security \n3.8. Modifying activities dependent on differing workplace \ncontingencies, risk situations and environments \n3.9. Identifying and solving problems associated with the \nmaintenance of vessel and port security and to report security \nissues and take appropriate action based on available \ninformation \n3.10. Monitoring and anticipating security problems and risks and \ntaking appropriate action \n \n4. Resource Implications \nThe following resources should be provided: \n4.1. work place with recommended facilities \n4.2. tools and equipment appropriate to the activity \n4.3. materials relevant to the proposed activity and tasks \n \n5. Methods of Assessment Competency in this unit must be assessed through: \n5.1 \nDemonstration and questioning of related underpinning \nknowledge \n5.2 \nWritten examination \n5.3 \nPortfolio \n \n6. Context of Assessment \n6.1 Competency may be assessed in workplace or in a simulated \nworkplace setting\n\n--- PDF PAGE 45 ---\nTESDA-SOP-QSO-01-F08 \nTR-Able Seafarer Deck NC II (STCW Regulation II/5) \nRevised June 26, 2013 \n41 \nCORE COMPETENCIES \n \nUNIT OF COMPETENCY \n: \nPERFORM NAVIGATION AT THE SUPPORTLEVEL \n \nUNIT CODE \n: \nMTM834317 \n \nUNIT DESCRIPTOR \n: \nThis unit identifies the knowledge, skills and attitude required to \ncontribute in the performance of a safe navigational watch at the \nsupport level. This unit also covers berthing, anchoring, and other \nmooring operations. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1. Contribute to a safe \nnavigational watch \n1.1 Orders are understood and communications are made with the \nofficer of the watch on matters relevant to the factors in \ncarrying out watchkeeping duties. \n1.2 Element procedures for the relief, maintenance and handover \nof a watch are observed and followed. \n1.3 Information required to maintain a safe watch contained in the \nInternational Regulations for preventing collision at sea are \ncorrectly recognized/interpreted. \n \n2. Contribute to berthing, \nanchoring and other \nmooring operations \n2.1 Procedures and order of event for letting go mooring lines and \ntug lines, including towing lines are followed as ordered by the \nofficer in charge. \n2.2 Procedures and order of event for the use of anchors in various \noperations are followed in accordance with Safe Working \nPractices. \n2.3 Procedures and order of events associated with mooring to a \nbuoy or buoys are followed as ordered by the officer in charge. \n2.4 Tasks required of a rating in preparation for arrival and \ndeparture from an anchorage or mooring are completed in \naccordance with shipboard procedures. \n2.5 Communications during mooring and anchor handling \noperations are clear and timely and involve the correct use of \ncommunications equipment where required.\n\n--- PDF PAGE 46 ---\nTESDA-SOP-QSO-01-F08 \nTR-Able Seafarer Deck NC II (STCW Regulation II/5) \nRevised June 26, 2013 \n42 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Factors to be \nconsidered when \ncarrying out \nwatchkeeping duties \nMay include: \n1.1 \nBridge must never be left unattended \n1.2 \nWeather, sea conditions and visibility, in daylight or darkness \n1.3 \nProximity of navigational hazards \n1.4 \nUse and operational condition of navigational aids \n1.5 \nThe operational status of bridge instrumentation, controls and \nalarms \n1.6 \nProvision on the bridge of unmanned machinery (UMS) \ncontrols, alarms and indicators \n1.7 \nUnusual demands on the navigational watch arising from \noperational conditions \n1.8 \nTraffic density and other activities occurring in the area in \nwhich the vessel is navigating \n1.9 \nThe size of the vessel and the field of vision available from the \ncoming position \n1.10 Attention necessary when navigating in or near traffic \nseparation schemes or other routing measures \n1.11 Rudder and propeller control and vessel maneuvering \ncharacteristics \n1.12 Physical and mental state of the watchkeeper \n \n2. Elements Procedures \nMay include: \n2.1 \nCommand \n2.2 \nConfirmation \n2.3 \nExecution \n2.4 \nMonitoring \n2.5 \nReporting \n2.6 \nAcknowledgement \n \n3. Information \nInformation acquired during navigational watch: \n3.1 \nLights \n3.2 \nShapes \n3.3 \nSound Signals \n3.4 \nVessel traffic situations \n \n4. Mooring Lines \nMooring lines and anchoring equipment include: \n4.1 \nMooring lines \n4.1.1. Headline \n4.1.2. Forward spring line \n4.1.3. Breast line \n4.1.4. Back spring line \n4.1.5. Stern Line \n4.2 \nAnchoring equipment \n4.2.1. Mooring Winch \n4.2.2. Bitts \n4.2.3. Chocks \n4.2.4. Bollards \n4.2.5. Fairleads \n4.2.6. Windlass \n4.2.7. Anchor \n4.2.8. Anchor chain \n4.2.9. Stoppers\n\n--- PDF PAGE 47 ---\nTESDA-SOP-QSO-01-F08 \nTR-Able Seafarer Deck NC II (STCW Regulation II/5) \nRevised June 26, 2013 \n43 \nEVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 performed watchkeeping in accordance with bridge procedures \nmanual \n1.2 performed proper relief and handing over procedures. \n1.3 contributed to berthing, anchoring and other mooring operations \n1.4 communicated effectively with other members of the bridge \nteam \n \n2. Required Knowledge \n \n2.1 Sections of IMO STCW Code and Convention, as amended \ndealing with bridge watchkeeping principles. \n2.2 Lights, shapes and sound signals as per COLREGS. \n2.3 BRM Principles as part of the bridge team \n2.4 Function of mooring lines and tug lines \n2.5 Capacities, safe working loads, and breaking strength of \nmooring and anchoring equipment \n \n3. Required Skills \n \n3.1 Identifying light , sounds and shapes \n3.2 Demonstrating steering procedures \n3.3 Demonstrating watch hand-over procedures \n3.4 Handling mooring lines and anchoring equipment \n3.5 Using communication equipment \n \n4. Resource Implications \n \nAccess is required to opportunities to either: \n4.1 Execute watchkeeping using a bridge simulator, meeting the \nrequirements of Section A I/12 of the IMO STCW Code, over an \nappropriate range of simulated maneuvering situations, weather \nand loading conditions; and/or \n4.2 Conduct watchkeeping on board a training vessel under the \ndirection of the Officer in Charge of the Watch over an appropriate \nrange of situations, weather and loading conditions \n4.3 Conduct mooring, unmooring, berthing, unberthing and anchoring \noperations under the supervision of the officer-in-charge in a \nsimulated environment or a training vessel. \n \n5. Methods of \nAssessment \n \n Competency in this unit must be assessed through: \n5.1 practical test using a suitably simulated watchkeeping situation; or \n5.2 approved in-service experience, or \n5.3 approved training ship experience, or \n5.4 written examinations \n \n6. Context of Assessment \n \n6.1 Assessment of competence must comply with the assessment \nrequirements of the relevant maritime regulations \n6.2 Assessment of this unit must be undertaken within relevant marine \nauthority approved and audited arrangements by a registered \ntraining and/or assessment institution: \n6.2.1 Appropriate practical assessment must occur: \n6.2.1.1 at the registered training organization, and/or \n6.2.1.2 on an appropriate working or training vessel\n\n--- PDF PAGE 48 ---\nTESDA-SOP-QSO-01-F08 \nTR-Able Seafarer Deck NC II (STCW Regulation II/5) \nRevised June 26, 2013 \n44 \nUNIT OF COMPETENCY : \nPERFORM CARGO HANDLING AND STOWAGE AT THE \nSUPPORT LEVEL \n \nUNIT CODE \n: \nMTM834318 \n \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge, skills and attitude required in \nperforming cargo handling and stowage, securing of cargo and \nstores. It includes proper handling of dangerous, hazardous and \nharmful substances and liquids. \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1. Contribute to the \nproper handling of \ncargo and Stores \n \n1.1 \nTypes of cargo carried onboard are properly identified. \n1.2 \nProcedures for safe handling, stowage and securing of \ncargoes and stores are practiced based on IMO cargo \nsecuring and stowage code. \n \n2. Contribute to proper \nhandling of dangerous, \nhazardous and harmful \nsubstances and liquids \n \n2.1 \nProper personal protective equipment for handling \ndangerous, hazardous and harmful substances and liquids are \nused. \n2.2 \nSafety precautions in handling dangerous, hazardous and \nharmful substances and liquids are followed as per IMDG \ncode are followed. \n \n \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Types of Cargo \nMay include: \n1.1 \nSolid Bulk Cargoes \n1.2 \nUnitized Cargoes \n1.3 \nRolling Cargoes \n1.4 \nRefrigerated Cargoes \n1.5 \nLiquid Cargoes in Bulk \n \n2. Securing \nMay include: \n2.1 \nLashing \n2.2 \nShoring \n2.3 \nChocking \n \n3. Proper personal \nprotective equipment \n \n \nMay include: \n3.1 \nhard hat (safety helmet) \n3.2 \nsafety shoes \n3.3 \ncoveralls \n3.4 \ngoggles \n3.5 \near muff \n3.6 \nworking gloves \n3.7 \ndust mask \n3.8 \nwelding visor \n3.9 \nsafety belt/harness\n\n--- PDF PAGE 49 ---\nTESDA-SOP-QSO-01-F08 \nTR-Able Seafarer Deck NC II (STCW Regulation II/5) \nRevised June 26, 2013 \n45 \nEVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate : \n1.1 \nperformed the preparation of cargo handling and securing \ngears and equipment \n1.2 \ncarried out proper securing of cargo and stores \n1.3 \nexhibited all required safety, environmental and hazard control \nprecautions and procedures in handling dangerous, \nhazardous and harmful substances \n1.4 \ncommunicated effectively with officer in charge during loading \nand unloading operations \n \n2. Required Knowledge \n2.1 \nKnowledge of sections of relevant to securing of different \ntypes of cargo in the CSS code. \n2.2 \nRelevant OH&S and pollution control legislation and policies \n2.3 \nCategories of hazardous materials and substances \n \n3. Required Skills \n3.1 \nUsing Standard Maritime Communication Procedures (SMCP) \n3.2 \nSecuring of cargo as per ship’s securing manual \n3.3 \nHandling of hazardous and dangerous cargo or stores in \naccordance with established safety practices \n \n4. Resource Implications \nThe following resources should be provided: \n4.4 \nwork place location \n4.5 \ntools and equipment needed to undertake the activities \n4.6 \nmaterial relevant to the proposed activity and tasks \n \n5. Methods of \nAssessment \nCompetency in this unit must be assessed through: \n5.1 \nDemonstration and questioning of related underpinning \nknowledge \n5.2 \nWritten examination \n5.3 \nPortfolio \n \n6. Context of Assessment \n \n6.1 \nCompetency may be assessed in workplace or in a simulated \nworkplace setting \n6.2 \nAssessment shall be observed while task are being \nundertaken whether individually or as a team under limited \nsupervision\n\n--- PDF PAGE 50 ---\nTESDA-SOP-QSO-01-F08 \nTR-Able Seafarer Deck NC II (STCW Regulation II/5) \nRevised June 26, 2013 \n46 \nUNIT OF COMPETENCY : \nCONTROL THE OPERATION OF THE SHIP AND CARE FOR \nPERSONS ON BOARD AT THE SUPPORT LEVEL \n \nUNIT CODE \n: \nMTM834319 \n \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge, skills and attitude required to \nprovide and support safe operation of deck equipment and \nmachinery and apply occupational health and safety precautions \nalso in the prevention of pollution in the marine environment. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1. Contribute to the safe \noperation of deck \nequipment and \nmachinery \n1.1 Valves and pumps, hoists, cranes, booms, and related \nequipment are operated as per safe working practices and \nwithin their safe working loads in accordance with equipment \noperating instruction. \n1.2 Winches, windlasses, capstans and related equipment are used \nand operated within their safe working capacities in accordance \nwith equipment operating instruction. \n1.3 Hatches, watertight doors, ports, and related equipment are \nsecured as per safe working practices. \n1.4 Fibre and wire ropes, cables and chains, including their \nconstruction are marked, used, maintained and properly stowed \nin accordance with industry standards. \n1.5 Basic signals for the operation of equipment, including \nwinches, windlasses, cranes, and hoists are executed with the \noperator as per safe working practices. \n1.6 Anchoring equipment under various conditions, such as \nanchoring, weighing anchor, securing for sea, and in \nemergencies is operated as per safety management procedures. \n1.7 Bosun’s chairs and staging are properly rigged and unrigged as \nper safe working practices. \n1.8 Pilot ladders and hoists are rigged and unrigged as per \ninternational regulations. Rat-guards and gangways are rigged in \naccordance with industry standards and local port requirement. \n1.9 Marlin spike seamanship skills, including the proper use of knots, \nsplices and stoppers are performed as per industry standards \nand safe working practices. \n1.10 Access arrangements, hatches and hatch covers, ramps, \nside/bow/stern doors or elevators are operated and secured in \naccordance with the vessels safety management system \nprocedures. \n1.11 Pipeline systems – bilge and ballast suctions and wells are \nidentified as per the vessel’s pumping arrangement. \n1.12 Cranes, derricks and winches are maintained and operated \nwithin its working capacities in accordance with equipment \noperating instruction. \n1.13 State flag are hoisted and dipped in accordance with the state \nrequirement. Signal flags are hoisted as required in accordance \nto International Code of Signals.\n\n--- PDF PAGE 51 ---\nTESDA-SOP-QSO-01-F08 \nTR-Able Seafarer Deck NC II (STCW Regulation II/5) \nRevised June 26, 2013 \n47 \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n2.Apply occupational \nhealth and safety \nprecautions \n2.1 Shipboard safe working practices are observed at all times as \nper Code of Safe Working Practices for Merchant Seaman. \n2.2 Personal shipboard safety are observed and personal \nprotective equipment are used in accordance with the vessel’s \nsafety management system. \n \n3.Apply precautions and \ncontribute to the \nprevention of pollution \nof the marine \nenvironment \n3.1 Procedures to prevent pollution of the marine environment are \nfollowed as per relevant annexes of IMO MARPOL Convention. \n3.2 Shipboard pollution prevention equipment are used and \nmaintained in accordance with the vessel Environmental \nManagement System. \n3.3 Shipboard marine pollutants are disposed in accordance with the \nIMO MARPOL Regulations. \n \n4.Operate Survival Craft \nand rescue boat \n4.1 Abandon ship and survival situations are responded to under the \nprevailing circumstances and conditions with survival craft and \nrescue boat is launched and operated in accordance with the \nvessel’s safety manual. \n4.2 Survival techniques are observed in accordance with safety \npractices and standards.\n\n--- PDF PAGE 52 ---\nTESDA-SOP-QSO-01-F08 \nTR-Able Seafarer Deck NC II (STCW Regulation II/5) \nRevised June 26, 2013 \n48 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Related Equipment \nMay include: \n1.1. Controls \n1.2. Switches \n1.3. Limit mechanism and switches \n \n2. Basic Signals \nMay include: \n2.1 \nHoisting of load \n2.2 \nLowering of load \n2.3 \nTopping of jib \n2.4 \nLowering of jib \n2.5 \nSwinging of jib \n2.6 \nSlack away \n2.7 \nHeave away \n2.8 \nHold \n \n3. Anchoring Equipment \nMay include: \n3.1 \nWindlass \n3.2 \nAnchor chain \n3.3 \nAnchor \n3.4 \nAnchor lashing \n3.5 \nChain stopping bar \n \n4. Pipeline System \nMay include: \n4.1 \nBilge piping and pumping arrangement \n4.2 \nBallast piping and pumping arrangement \n \n5. Personal Protective \nEquipment \nMay include: \n5.1 \nSafety Helmet \n5.2 \nEar muff or plug \n5.3 \nAppropriate goggles or face mask \n5.4 \nCoveralls \n5.5 \nAppropriate gloves \n5.6 \nSafety shoes or appropriate boots \n5.7 \nAppropriate protection against weather conditions \n5.8 \nRespiratory equipment (CABA and Air filter) \n5.9 \nChemical Suits\n\n--- PDF PAGE 53 ---\nTESDA-SOP-QSO-01-F08 \nTR-Able Seafarer Deck NC II (STCW Regulation II/5) \nRevised June 26, 2013 \n49 \nEVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate : \n1.1 \nassisted in operation of various deck equipment and \nmachineries \n1.2 \nassisted in maintenance of various deck equipment and \nmachineries \n1.3 \nassisted in rigging of deck equipment \n1.4 \napplied all required safety, environmental and hazard control \nprecautions and procedures during deck operations \n1.5 \ncommunicated effectively with other deck hands \n \n2. Required Knowledge \n2.1 \nVessel Safety Management System policies and procedures \n2.2 \nVessel’s Environmental Management System \n2.3 \nRelated MARPOL regulations \n2.4 \nRequirement from the Code of Safe Working Practices \n2.5 \nRelevant signals from the International Code of Signals \n2.6 \nProcedures in use of deck machineries \n2.7 \nTechniques and precautions in rigging Bosun’s chair and \nstages. \n2.8 \nTechniques and precautions in rigging Pilot ladder and hoists.. \n2.9 \nCommunication techniques and signals during deck \noperations \n2.10 Actions in responding to abandonship and survival situations \nunder the prevailing circumstances and conditions \n \n3. Required Skills \n3.1 \nOperating deck machineries \n3.2 \nRigging Bosun’s chair and stages. \n3.3 \nRigging and securing of Pilot ladder \n3.4 \nApplying communication techniques and signaling during deck \noperations \n3.5 \nOperate survival craft and rescue boats \n \n4. Resource Implications \nThe following resources should be provided: \n4.1 \nwork place location \n4.2 \ntools and equipment needed to undertake the activities \n4.3 \nmaterial relevant to the activity and tasks \n \n5. Methods of \nAssessment \nCompetency in this unit must be assessed through : \n5.1 \nPractical assessment or demonstration and questioning of \nrelated underpinning knowledge \n5.2 \nWritten examination \n5.3 \nPortfolio \n \n6. Context of Assessment 6.1 \nCompetency may be assessed in workplace or in a simulated \nworkplace setting \n6.2 \nAssessment shall be observed while task are being \nundertaken whether individually or in-group\n\n--- PDF PAGE 54 ---\nTESDA-SOP-QSO-01-F08 \nTR-Able Seafarer Deck NC II (STCW Regulation II/5) \nRevised June 26, 2013 \n50 \nUNIT OF COMPETENCY : \nPERFORM MAINTENANCE AND REPAIR AT THE SUPPORT \nLEVEL \n \nUNIT CODE \n: \nMTM834320 \n \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge, skills and attitude required to \nperform support level function for shipboard maintenance and \nrepair under the direction of the responsible Key Rating or Deck \nOfficer in compliance with international regulations and guidelines \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1. Contribute to shipboard \nmaintenance \n1.1 Any deterioration or corrosion of a vessel’s deck surfaces \nis identified and appropriate maintenance action initiated or \ncarried out in accordance with planned maintenance system \n(PMS). \n1.2 Surface preparation is accomplished applying “prescribed-in” \ntechniques. Marine surfaces are prepared for the application of \nthe required marine coating. \n1.3 Appropriate paint systems is selected and applied for areas \naboard a vessel. \n1.4 Maintenance materials are obtained, handled, prepared and \napplied in accordance with OH&S and pollution control \nrequirements, company procedures and manufacturer'’ \ninstructions. \n1.5 Paints, lubricants, cleaning materials and equipment in deck \nmaintenance are used based on ship’s procedures. \n1.6 Appropriate chemicals, cleaning agents and equipment are \nselected to clean an assigned area of the vessel and stored \nafter use as per ship’s procedures and manufacturer’s \ninstructions. \n1.7 Safety and hazard control procedures are followed in \naccordance with relevant occupational health and safety \npractices. \n1.8 Basic maintenance on deck fittings, equipment and systems \nare performed according to procedures. \n1.9 Hand and power tools are used and maintained in \naccordance with manufacturer’s manual. \n1.10 Records of maintenance work carried out are completed in \naccordance with procedures. \n \n2. Contribute to shipboard \nrepair \n2.1 Minor faults and imperfections in painted surfaces are repaired \nin accordance with procedures. \n2.2 Routine repair procedures are analyzed and executed as per \nmaintenance procedures. \n2.3 Weathered surfaces are restored using cleaners and liquid \nabrasives in accordance with OH&S and pollution control \nrequirements, planned maintenance procedures and \nmanufacturer’s instruction. \n2.4 Manufacturer’s warning and instructions regarding the use of \nchemicals and cleaning agents are read, understood and \napplied.\n\n--- PDF PAGE 55 ---\nTESDA-SOP-QSO-01-F08 \nTR-Able Seafarer Deck NC II (STCW Regulation II/5) \nRevised June 26, 2013 \n51 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Deterioration or \ncorrosion of vessel’s \ndeck surfaces \nMay include: \n1.1 Corrosion to deck, fittings and equipment \n1.2 Weathering of surfaces \n1.3 Wearing of fittings and equipment \n \n2. Appropriate paint \nsystems \nMay include: \n2.1. Appropriate paints and painting equipment for a particular \nsurface are selected in accordance with planned maintenance \nprocedures and the paint manufacturer’s instruction \n2.2. Marine paints are applied using appropriate application \nequipment in accordance with OH&S requirements, planned \nmaintenance procedures and manufacturer’s instruction \n2.3. Debris from maintenance activities is disposed of, or stored in \naccordance with established procedures \n2.4. Paint and painting equipment are correctly stored after use \n \n3. Safety and hazard \ncontrol procedures \nMay include: \n3.1. Personal Protective Equipment is used in accordance with \nregulations and OHS policy \n3.2. Maintenance hazards are identified and action is taken to \nminimize or eliminate risk to personnel, vessel and environment \n3.3. Safety, hazard and pollution control procedures and regulations \nare followed at all time during maintenance and repair \noperations \n \n4. Hand and power tools \nMay include: \n4.1 Hand tools including chipping hammers and scrapers \n4.2 Electric power tools such as grinders, sanders and drills, \n4.3 Pneumatic power tools such as grinders, sanders and drills \n4.4 Marine preservative finish application equipment such as \nbrushes, spay guns, rollers \n4.5 Rinsing and storing equipment \n \n5. Maintenance work \ncarried out \nMay include: \n5.1. Identification of any deterioration of a deck areas, machinery \nand fittings \n5.2. Cleaning of areas of the vessel \n5.3. Repairs of minor faults and imperfections in painted surfaces \n5.4. Identification of faulty equipment or fittings and arranging for \nrepair or replacement \n5.5. Restoration of weathered surfaces \n5.6. Preparation of marine surfaces prior to the application of the \nprescribed marine coating \n5.7. Selection and application of appropriate marine paints for \nparticular surfaces\n\n--- PDF PAGE 56 ---\nTESDA-SOP-QSO-01-F08 \nTR-Able Seafarer Deck NC II (STCW Regulation II/5) \nRevised June 26, 2013 \n52 \nEVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate : \n1.1 performed rigging of stages and bosun’s chair \n1.2 performed basic deck maintenance \n1.3 carried out cleaning activities \n1.4 selected and applied appropriate paint systems for areas \naboard a vessel \n1.5 checked and performed basic maintenance on deck fittings, \nequipment and system \n1.6 exhibited all required safety, environmental and hazard control \nprecautions and procedures during planned maintenance \noperations \n1.7 communicated effectively with others when carrying out \nmaintenance procedures onboard a vessel \n2. Required Knowledge \n2.1 Knowledge of sections of relevant regulations \n2.2 ISM Code Safety Management System as it is related to \nplanned vessel maintenance \n2.3 Relevant OH&S regulations and policies \n2.4 Nature and causes of corrosion of marine surfaces and \nstructures and the available method for its control \n2.5 Corrosion control measures including surface preparation and \npainting and antifouling \n2.6 Paints and painting equipment used in marine maintenance and \nthe related procedures and precautions to be taken for \npreparation, application and storage \n2.7 Safety, environmental and hazard control precautions and \nprocedures relevant to maintenance operation \n2.8 Storage principles of paints, chemicals and cleaning agents \nused in planned maintenance operations \n3. Required Skills \n3.1 Rigging of stages and bosun’s chair. \n3.2 Checking of deck areas, machinery and fittings for corrosion, \nwear and tear as part routine maintenance procedures. \n3.3 Implement planned maintenance program and repairs. \n3.4 Dispose debris and waste during planned maintenance \noperation. \n3.5 Mix and apply paints evenly to prepared surfaces and in \naccordance to company manual. \n4. Resource Implications \n \nThe following resources should be provided: \n4.1 work place location \n4.2 tools and equipment needed to undertake the activities \n4.3 materials relevant to the activity or tasks \n5. Methods of \nAssessment \nCompetency in this unit must be assessed through : \n5.1 Practical demonstration \n5.2 Written examination \n5.3 Approved in-service or training ship experience \n6. Context of Assessment \n \n6.1 Competency may be assessed in workplace or in a simulated \nworkplace setting \n6.2 Assessment shall be observed while task are being undertaken \nwhether individually or in-group\n\n--- PDF PAGE 57 ---\nTR-Able Seafarer Deck NC II (STCW Regulation II/5) \nRevised June 26, 2013 \n53"
