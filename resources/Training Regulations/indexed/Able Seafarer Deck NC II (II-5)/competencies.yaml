        "evidence_guide": {
          "source_text": "1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate : \n1.1 \nassisted in operation of various deck equipment and \nmachineries \n1.2 \nassisted in maintenance of various deck equipment and \nmachineries \n1.3 \nassisted in rigging of deck equipment \n1.4 \napplied all required safety, environmental and hazard control \nprecautions and procedures during deck operations \n1.5 \ncommunicated effectively with other deck hands \n \n2. Required Knowledge \n2.1 \nVessel Safety Management System policies and procedures \n2.2 \nVessel’s Environmental Management System \n2.3 \nRelated MARPOL regulations \n2.4 \nRequirement from the Code of Safe Working Practices \n2.5 \nRelevant signals from the International Code of Signals \n2.6 \nProcedures in use of deck machineries \n2.7 \nTechniques and precautions in rigging Bosun’s chair and \nstages. \n2.8 \nTechniques and precautions in rigging Pilot ladder and hoists.. \n2.9 \nCommunication techniques and signals during deck \noperations \n2.10 Actions in responding to abandonship and survival situations \nunder the prevailing circumstances and conditions \n \n3. Required Skills \n3.1 \nOperating deck machineries \n3.2 \nRigging Bosun’s chair and stages. \n3.3 \nRigging and securing of Pilot ladder \n3.4 \nApplying communication techniques and signaling during deck \noperations \n3.5 \nOperate survival craft and rescue boats \n \n4. Resource Implications \nThe following resources should be provided: \n4.1 \nwork place location \n4.2 \ntools and equipment needed to undertake the activities \n4.3 \nmaterial relevant to the activity and tasks \n \n5. Methods of \nAssessment \nCompetency in this unit must be assessed through : \n5.1 \nPractical assessment or demonstration and questioning of \nrelated underpinning knowledge \n5.2 \nWritten examination \n5.3 \nPortfolio \n \n6. Context of Assessment 6.1 \nCompetency may be assessed in workplace or in a simulated \nworkplace setting \n6.2 \nAssessment shall be observed while task are being \nundertaken whether individually or in-group\n\n--- PDF PAGE 54 ---\nTESDA-SOP-QSO-01-F08 \nTR-Able Seafarer Deck NC II (STCW Regulation II/5) \nRevised June 26, 2013 \n50 \nUNIT OF COMPETENCY : \nPERFORM MAINTENANCE AND REPAIR AT THE SUPPORT \nLEVEL \n \nUNIT CODE \n:"
