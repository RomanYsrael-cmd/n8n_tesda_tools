        "evidence_guide": {
          "source_text": "1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate : \n1.1. contributed to the enhancement of maritime security through \nheightened awareness \n1.2. recognized security threats \n1.3. understood the need for and methods of maintaining security \nawareness and vigilance \n \n2. Required Knowledge \n2.1. IMO ISPS Code applicable to vessels and ports \n2.2. Procedures for maintaining security awareness \n2.3. Relevant security and safety regulations, rules, policies and \nprocedures \n2.4. Relevant security personnel on a vessel or at a port facility \n2.5. Communication procedures and protocols on matters related to \nvessel and port security \n2.6. Security and safety problems that may be identified when \nmaintaining and managing situation awareness and action that \ncan be taken to overcome them \n2.7. Security and safety hazards and risks that may be identified in \nthe maritime workplace and ways of controlling those hazards \nand associated risks \n \n3. Required Skills \n3.1. Applying the above knowledge to the management of situation \nawareness during workplace operations \n3.2. Reading and interpreting instructions, procedures and other \ninformation relevant to the maintenance of vessel and port \nsecurity \n3.3. Working as a team with others on matters relevant to the \nmaintenance of vessel and port security \n3.4. Selecting and using appropriate communications equipment \n3.5. Taking appropriate initiatives related to vessel and port security \nwithin limits of role and responsibility \n3.6. Interpreting and applying security and safety practices and \nregulations \n3.7. Communicating with others on matters related to vessel and \nport security \n3.8. Modifying activities dependent on differing workplace \ncontingencies, risk situations and environments \n3.9. Identifying and solving problems associated with the \nmaintenance of vessel and port security and to report security \nissues and take appropriate action based on available \ninformation \n3.10. Monitoring and anticipating security problems and risks and \ntaking appropriate action \n \n4. Resource Implications \nThe following resources should be provided: \n4.1. work place with recommended facilities \n4.2. tools and equipment appropriate to the activity \n4.3. materials relevant to the proposed activity and tasks \n \n5. Methods of Assessment Competency in this unit must be assessed through: \n5.1 \nDemonstration and questioning of related underpinning \nknowledge \n5.2 \nWritten examination \n5.3 \nPortfolio \n \n6. Context of Assessment \n6.1 Competency may be assessed in workplace or in a simulated \nworkplace setting\n\n--- PDF PAGE 45 ---\nTESDA-SOP-QSO-01-F08 \nTR-Able Seafarer Deck NC II (STCW Regulation II/5) \nRevised June 26, 2013 \n41 \nCORE COMPETENCIES \n \nUNIT OF COMPETENCY \n: \nPERFORM NAVIGATION AT THE SUPPORTLEVEL \n \nUNIT CODE \n:"
        },
        "source_text": "MTM834215 \n \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge, skills and attitudes in \ndemonstrating security awareness practices. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1. Contribute to the \nenhancement of \nmaritime security \nthrough heightened \nawareness \n1.1 Requirements relating to enhanced maritime security are \nidentified. \n1.2 All critical factors relevant to the security and safety of a \nmaritime workplace are monitored continuously during work \noperations. \n1.3 Relevant information concerning the security and safety of a \nmaritime workplace is recognized and interpreted and \ntimely action is taken in accordance with workplace \nprocedures. \n1.4 Changes to work environment and related risks are \nmonitored and managed to ensure a safe outcome to \nworkplace operations. \n1.5 A security-related contingency plan action is studied and \ninterpreted and where necessary appropriate action is taken. \n1.6 Reports on matters related to vessel security are prepared \nand submitted to designated personnel in accordance with \nthe ship security plan and company and maritime regulatory \nrequirements. \n \n2. Recognize security \nthreats \n \n2.1 Factors that may adversely affect the security and safety of a \nmaritime workplace are identified. \n2.2 Risks to vessel or port security and safety are recognized \nand reported to relevant security personnel and appropriate \naction is taken to control the risk in accordance with \nworkplace procedures and security requirements. \n2.3 Persons posing potential security risks are recognized \nand reported to relevant security personnel and appropriate \naction is taken to control the risk in accordance with \nworkplace procedures and security requirements. \n2.4 All relevant indications of a security situation are \nrecognized and appropriate action is taken to alert relevant \npersonnel and/or take appropriate action in accordance with \nworkplace procedures and regulatory requirements. \n \n3. Understand the need \nfor and maintaining \nsecurity awareness \nand vigilance \n3.1 Security instruction programs are participated in as per \ncompany and regulatory requirements. \n3.2 Requirements and processes for security awareness and \nvigilance are identified. \n3.3 Security and emergency drills are participated in \naccordance with the ship security plan and company and \nmaritime regulatory requirements. \n3.4 Inputs to improve/enhance security training programs and drills \nare provided, where necessary.\n\n--- PDF PAGE 43 ---\nTESDA-SOP-QSO-01-F08 \nTR-Able Seafarer Deck NC II (STCW Regulation II/5) \nRevised June 26, 2013 \n39 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Maritime workplace \nWorkplace may include: \n1.1. Vessels \n1.2. Port facilities \n2. Relevant security \npersonnel \nMay include: \n2.1. Ship security officer \n2.2. Port security officer \n2.3. Company security officer \n2.4. Master or skipper of the vessel \n2.5. \nOther personnel on vessel (in terms of their security awareness, \npreparedness and vigilance) \n3. Persons posing \npotential security risks \nMay include: \n3.1. \nUnknown persons photographing vessels or facilities \n3.2. \nUnknown persons attempting to gain access to vessels or \nfacilities \n3.3. \nUnknown persons loitering in the vicinity of vessels or port \nfacilities \n3.4. \nUnknown persons telephoning to ascertain security, personnel \nor standard operating procedures on a vessel or at a port \nfacility \n3.5. \nVehicles or small vessels with personnel in them loitering \nand perhaps taking photographs or drawing diagrams of \nvessels or facilities \n3.6. \nGeneral aviation aircraft operating in proximity of vessels or \nfacilities \n3.7. \nUnauthorized vendors attempting to sell merchandise \n3.8. \nPersons carrying suspicious parcels which could be bombs \n3.9. \nUnknown persons acting suspiciously \n3.10. Unknown persons seeking information from vessel personnel \nor their families about vessels or port facilities via either face-\nto-face discussion or email \n3.11. Unauthorized workers attempting to gain access to a vessel or \nport facilities to repair, replace, service or install equipment \n4. Security situation \nMay include:: \n4.1. \nPiracy/hijacking \n4.2. \nArmed robbery \n4.3. \nBomb threat \n4.4. \nUnidentified objects/explosives on vessel \n4.5. \nDamage to or destruction of port facility \n4.6. \nDamage to or destruction of vessel \n4.7. \nPiracy and other depredations \n4.8. \nStowaways \n5. Security and \nemergency drills \nSecurity and emergency drills may relate to incidents such as: \n5.1. \nDamage to or destruction of the vessel or port facility (e.g. by \nexplosive devices, arson, sabotage or vandalism) \n5.2. \nHijacking or seizure of a vessel or of persons on board \n5.3. \nTampering with cargo or essential vessel equipment or \nsystems or vessel's stores \n5.4. \nUnauthorized access to or use of the vessel (including \npresence of stowaways) \n5.5. \nSmuggling of weapons or equipment (including weapons of \nmass destruction) \n5.6. \nUse of the vessel to carry persons intending to cause a \nsecurity incident (or their equipment) \n5.7. \nUse of the vessel itself as a weapon or as a means to cause \ndamage or destruction \n5.8. \nAttacks from seaward while at berth or at anchor \n5.9. \nAttacks while at sea\n\n--- PDF PAGE 44 ---\nTESDA-SOP-QSO-01-F08 \nTR-Able Seafarer Deck NC II (STCW Regulation II/5) \nRevised June 26, 2013 \n40 \nEVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate : \n1.1. contributed to the enhancement of maritime security through \nheightened awareness \n1.2. recognized security threats \n1.3. understood the need for and methods of maintaining security \nawareness and vigilance \n \n2. Required Knowledge \n2.1. IMO ISPS Code applicable to vessels and ports \n2.2. Procedures for maintaining security awareness \n2.3. Relevant security and safety regulations, rules, policies and \nprocedures \n2.4. Relevant security personnel on a vessel or at a port facility \n2.5. Communication procedures and protocols on matters related to \nvessel and port security \n2.6. Security and safety problems that may be identified when \nmaintaining and managing situation awareness and action that \ncan be taken to overcome them \n2.7. Security and safety hazards and risks that may be identified in \nthe maritime workplace and ways of controlling those hazards \nand associated risks \n \n3. Required Skills \n3.1. Applying the above knowledge to the management of situation \nawareness during workplace operations \n3.2. Reading and interpreting instructions, procedures and other \ninformation relevant to the maintenance of vessel and port \nsecurity \n3.3. Working as a team with others on matters relevant to the \nmaintenance of vessel and port security \n3.4. Selecting and using appropriate communications equipment \n3.5. Taking appropriate initiatives related to vessel and port security \nwithin limits of role and responsibility \n3.6. Interpreting and applying security and safety practices and \nregulations \n3.7. Communicating with others on matters related to vessel and \nport security \n3.8. Modifying activities dependent on differing workplace \ncontingencies, risk situations and environments \n3.9. Identifying and solving problems associated with the \nmaintenance of vessel and port security and to report security \nissues and take appropriate action based on available \ninformation \n3.10. Monitoring and anticipating security problems and risks and \ntaking appropriate action \n \n4. Resource Implications \nThe following resources should be provided: \n4.1. work place with recommended facilities \n4.2. tools and equipment appropriate to the activity \n4.3. materials relevant to the proposed activity and tasks \n \n5. Methods of Assessment Competency in this unit must be assessed through: \n5.1 \nDemonstration and questioning of related underpinning \nknowledge \n5.2 \nWritten examination \n5.3 \nPortfolio \n \n6. Context of Assessment \n6.1 Competency may be assessed in workplace or in a simulated \nworkplace setting\n\n--- PDF PAGE 45 ---\nTESDA-SOP-QSO-01-F08 \nTR-Able Seafarer Deck NC II (STCW Regulation II/5) \nRevised June 26, 2013 \n41 \nCORE COMPETENCIES \n \nUNIT OF COMPETENCY \n: \nPERFORM NAVIGATION AT THE SUPPORTLEVEL \n \nUNIT CODE \n:"
