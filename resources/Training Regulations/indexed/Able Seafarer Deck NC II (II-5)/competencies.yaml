        "source_text": "MTM834320 \n \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge, skills and attitude required to \nperform support level function for shipboard maintenance and \nrepair under the direction of the responsible Key Rating or Deck \nOfficer in compliance with international regulations and guidelines \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1. Contribute to shipboard \nmaintenance \n1.1 Any deterioration or corrosion of a vessel’s deck surfaces \nis identified and appropriate maintenance action initiated or \ncarried out in accordance with planned maintenance system \n(PMS). \n1.2 Surface preparation is accomplished applying “prescribed-in” \ntechniques. Marine surfaces are prepared for the application of \nthe required marine coating. \n1.3 Appropriate paint systems is selected and applied for areas \naboard a vessel. \n1.4 Maintenance materials are obtained, handled, prepared and \napplied in accordance with OH&S and pollution control \nrequirements, company procedures and manufacturer'’ \ninstructions. \n1.5 Paints, lubricants, cleaning materials and equipment in deck \nmaintenance are used based on ship’s procedures. \n1.6 Appropriate chemicals, cleaning agents and equipment are \nselected to clean an assigned area of the vessel and stored \nafter use as per ship’s procedures and manufacturer’s \ninstructions. \n1.7 Safety and hazard control procedures are followed in \naccordance with relevant occupational health and safety \npractices. \n1.8 Basic maintenance on deck fittings, equipment and systems \nare performed according to procedures. \n1.9 Hand and power tools are used and maintained in \naccordance with manufacturer’s manual. \n1.10 Records of maintenance work carried out are completed in \naccordance with procedures. \n \n2. Contribute to shipboard \nrepair \n2.1 Minor faults and imperfections in painted surfaces are repaired \nin accordance with procedures. \n2.2 Routine repair procedures are analyzed and executed as per \nmaintenance procedures. \n2.3 Weathered surfaces are restored using cleaners and liquid \nabrasives in accordance with OH&S and pollution control \nrequirements, planned maintenance procedures and \nmanufacturer’s instruction. \n2.4 Manufacturer’s warning and instructions regarding the use of \nchemicals and cleaning agents are read, understood and \napplied.\n\n--- PDF PAGE 55 ---\nTESDA-SOP-QSO-01-F08 \nTR-Able Seafarer Deck NC II (STCW Regulation II/5) \nRevised June 26, 2013 \n51 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Deterioration or \ncorrosion of vessel’s \ndeck surfaces \nMay include: \n1.1 Corrosion to deck, fittings and equipment \n1.2 Weathering of surfaces \n1.3 Wearing of fittings and equipment \n \n2. Appropriate paint \nsystems \nMay include: \n2.1. Appropriate paints and painting equipment for a particular \nsurface are selected in accordance with planned maintenance \nprocedures and the paint manufacturer’s instruction \n2.2. Marine paints are applied using appropriate application \nequipment in accordance with OH&S requirements, planned \nmaintenance procedures and manufacturer’s instruction \n2.3. Debris from maintenance activities is disposed of, or stored in \naccordance with established procedures \n2.4. Paint and painting equipment are correctly stored after use \n \n3. Safety and hazard \ncontrol procedures \nMay include: \n3.1. Personal Protective Equipment is used in accordance with \nregulations and OHS policy \n3.2. Maintenance hazards are identified and action is taken to \nminimize or eliminate risk to personnel, vessel and environment \n3.3. Safety, hazard and pollution control procedures and regulations \nare followed at all time during maintenance and repair \noperations \n \n4. Hand and power tools \nMay include: \n4.1 Hand tools including chipping hammers and scrapers \n4.2 Electric power tools such as grinders, sanders and drills, \n4.3 Pneumatic power tools such as grinders, sanders and drills \n4.4 Marine preservative finish application equipment such as \nbrushes, spay guns, rollers \n4.5 Rinsing and storing equipment \n \n5. Maintenance work \ncarried out \nMay include: \n5.1. Identification of any deterioration of a deck areas, machinery \nand fittings \n5.2. Cleaning of areas of the vessel \n5.3. Repairs of minor faults and imperfections in painted surfaces \n5.4. Identification of faulty equipment or fittings and arranging for \nrepair or replacement \n5.5. Restoration of weathered surfaces \n5.6. Preparation of marine surfaces prior to the application of the \nprescribed marine coating \n5.7. Selection and application of appropriate marine paints for \nparticular surfaces\n\n--- PDF PAGE 56 ---\nTESDA-SOP-QSO-01-F08 \nTR-Able Seafarer Deck NC II (STCW Regulation II/5) \nRevised June 26, 2013 \n52 \nEVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate : \n1.1 performed rigging of stages and bosun’s chair \n1.2 performed basic deck maintenance \n1.3 carried out cleaning activities \n1.4 selected and applied appropriate paint systems for areas \naboard a vessel \n1.5 checked and performed basic maintenance on deck fittings, \nequipment and system \n1.6 exhibited all required safety, environmental and hazard control \nprecautions and procedures during planned maintenance \noperations \n1.7 communicated effectively with others when carrying out \nmaintenance procedures onboard a vessel \n2. Required Knowledge \n2.1 Knowledge of sections of relevant regulations \n2.2 ISM Code Safety Management System as it is related to \nplanned vessel maintenance \n2.3 Relevant OH&S regulations and policies \n2.4 Nature and causes of corrosion of marine surfaces and \nstructures and the available method for its control \n2.5 Corrosion control measures including surface preparation and \npainting and antifouling \n2.6 Paints and painting equipment used in marine maintenance and \nthe related procedures and precautions to be taken for \npreparation, application and storage \n2.7 Safety, environmental and hazard control precautions and \nprocedures relevant to maintenance operation \n2.8 Storage principles of paints, chemicals and cleaning agents \nused in planned maintenance operations \n3. Required Skills \n3.1 Rigging of stages and bosun’s chair. \n3.2 Checking of deck areas, machinery and fittings for corrosion, \nwear and tear as part routine maintenance procedures. \n3.3 Implement planned maintenance program and repairs. \n3.4 Dispose debris and waste during planned maintenance \noperation. \n3.5 Mix and apply paints evenly to prepared surfaces and in \naccordance to company manual. \n4. Resource Implications \n \nThe following resources should be provided: \n4.1 work place location \n4.2 tools and equipment needed to undertake the activities \n4.3 materials relevant to the activity or tasks \n5. Methods of \nAssessment \nCompetency in this unit must be assessed through : \n5.1 Practical demonstration \n5.2 Written examination \n5.3 Approved in-service or training ship experience \n6. Context of Assessment \n \n6.1 Competency may be assessed in workplace or in a simulated \nworkplace setting \n6.2 Assessment shall be observed while task are being undertaken \nwhether individually or in-group\n\n--- PDF PAGE 57 ---\nTR-Able Seafarer Deck NC II (STCW Regulation II/5) \nRevised June 26, 2013 \n53"
      }
    ]
