        "evidence_guide": {
          "source_text": "1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate : \n1.1 \nperformed the preparation of cargo handling and securing \ngears and equipment \n1.2 \ncarried out proper securing of cargo and stores \n1.3 \nexhibited all required safety, environmental and hazard control \nprecautions and procedures in handling dangerous, \nhazardous and harmful substances \n1.4 \ncommunicated effectively with officer in charge during loading \nand unloading operations \n \n2. Required Knowledge \n2.1 \nKnowledge of sections of relevant to securing of different \ntypes of cargo in the CSS code. \n2.2 \nRelevant OH&S and pollution control legislation and policies \n2.3 \nCategories of hazardous materials and substances \n \n3. Required Skills \n3.1 \nUsing Standard Maritime Communication Procedures (SMCP) \n3.2 \nSecuring of cargo as per ship’s securing manual \n3.3 \nHandling of hazardous and dangerous cargo or stores in \naccordance with established safety practices \n \n4. Resource Implications \nThe following resources should be provided: \n4.4 \nwork place location \n4.5 \ntools and equipment needed to undertake the activities \n4.6 \nmaterial relevant to the proposed activity and tasks \n \n5. Methods of \nAssessment \nCompetency in this unit must be assessed through: \n5.1 \nDemonstration and questioning of related underpinning \nknowledge \n5.2 \nWritten examination \n5.3 \nPortfolio \n \n6. Context of Assessment \n \n6.1 \nCompetency may be assessed in workplace or in a simulated \nworkplace setting \n6.2 \nAssessment shall be observed while task are being \nundertaken whether individually or as a team under limited \nsupervision\n\n--- PDF PAGE 50 ---\nTESDA-SOP-QSO-01-F08 \nTR-Able Seafarer Deck NC II (STCW Regulation II/5) \nRevised June 26, 2013 \n46 \nUNIT OF COMPETENCY : \nCONTROL THE OPERATION OF THE SHIP AND CARE FOR \nPERSONS ON BOARD AT THE SUPPORT LEVEL \n \nUNIT CODE \n:"
        },
        "source_text": "MTM834318 \n \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge, skills and attitude required in \nperforming cargo handling and stowage, securing of cargo and \nstores. It includes proper handling of dangerous, hazardous and \nharmful substances and liquids. \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1. Contribute to the \nproper handling of \ncargo and Stores \n \n1.1 \nTypes of cargo carried onboard are properly identified. \n1.2 \nProcedures for safe handling, stowage and securing of \ncargoes and stores are practiced based on IMO cargo \nsecuring and stowage code. \n \n2. Contribute to proper \nhandling of dangerous, \nhazardous and harmful \nsubstances and liquids \n \n2.1 \nProper personal protective equipment for handling \ndangerous, hazardous and harmful substances and liquids are \nused. \n2.2 \nSafety precautions in handling dangerous, hazardous and \nharmful substances and liquids are followed as per IMDG \ncode are followed. \n \n \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Types of Cargo \nMay include: \n1.1 \nSolid Bulk Cargoes \n1.2 \nUnitized Cargoes \n1.3 \nRolling Cargoes \n1.4 \nRefrigerated Cargoes \n1.5 \nLiquid Cargoes in Bulk \n \n2. Securing \nMay include: \n2.1 \nLashing \n2.2 \nShoring \n2.3 \nChocking \n \n3. Proper personal \nprotective equipment \n \n \nMay include: \n3.1 \nhard hat (safety helmet) \n3.2 \nsafety shoes \n3.3 \ncoveralls \n3.4 \ngoggles \n3.5 \near muff \n3.6 \nworking gloves \n3.7 \ndust mask \n3.8 \nwelding visor \n3.9 \nsafety belt/harness\n\n--- PDF PAGE 49 ---\nTESDA-SOP-QSO-01-F08 \nTR-Able Seafarer Deck NC II (STCW Regulation II/5) \nRevised June 26, 2013 \n45 \nEVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate : \n1.1 \nperformed the preparation of cargo handling and securing \ngears and equipment \n1.2 \ncarried out proper securing of cargo and stores \n1.3 \nexhibited all required safety, environmental and hazard control \nprecautions and procedures in handling dangerous, \nhazardous and harmful substances \n1.4 \ncommunicated effectively with officer in charge during loading \nand unloading operations \n \n2. Required Knowledge \n2.1 \nKnowledge of sections of relevant to securing of different \ntypes of cargo in the CSS code. \n2.2 \nRelevant OH&S and pollution control legislation and policies \n2.3 \nCategories of hazardous materials and substances \n \n3. Required Skills \n3.1 \nUsing Standard Maritime Communication Procedures (SMCP) \n3.2 \nSecuring of cargo as per ship’s securing manual \n3.3 \nHandling of hazardous and dangerous cargo or stores in \naccordance with established safety practices \n \n4. Resource Implications \nThe following resources should be provided: \n4.4 \nwork place location \n4.5 \ntools and equipment needed to undertake the activities \n4.6 \nmaterial relevant to the proposed activity and tasks \n \n5. Methods of \nAssessment \nCompetency in this unit must be assessed through: \n5.1 \nDemonstration and questioning of related underpinning \nknowledge \n5.2 \nWritten examination \n5.3 \nPortfolio \n \n6. Context of Assessment \n \n6.1 \nCompetency may be assessed in workplace or in a simulated \nworkplace setting \n6.2 \nAssessment shall be observed while task are being \nundertaken whether individually or as a team under limited \nsupervision\n\n--- PDF PAGE 50 ---\nTESDA-SOP-QSO-01-F08 \nTR-Able Seafarer Deck NC II (STCW Regulation II/5) \nRevised June 26, 2013 \n46 \nUNIT OF COMPETENCY : \nCONTROL THE OPERATION OF THE SHIP AND CARE FOR \nPERSONS ON BOARD AT THE SUPPORT LEVEL \n \nUNIT CODE \n:"
