re-check and \nprecautions required \nprior to handling ship’s \ncargo gear \n• Safety procedures and \nequipment operating \ninstructions in carrying \nout cargo and stores \noperations \n• Safe handling, stowage \nand securing cargo and \nstores \n• Precautions to be \nobserved in handling \nvarious types of \ncargoes such as: heavy \nlifts, containers, roll on \nroll off, vehicles, timber \nand deck cargo. \n• Precautions required \nfor handling \ndangerous, hazardous, \nand harmful \nsubstances and liquid \nincluding crude oil and \npetroleum products. \n• Precautions required \nwhen handling LPG and \nLNG Cargoes. \n• IMDG Class, labeling, \nsegregation of IMDG \ncargoes and type of risk \nassociated with each \nclass\n\n--- PDF PAGE 63 ---\nTR-Able Seafarer Deck NC II (STCW Regulation II/5) \nRevised June 26, 2013 \n59 \n \nTOOLS \nEQUIPMENT \nMATERIALS \nQTY \nDESCRIPTION \nQTY \nDESCRIPTION \nQTY \nDESCRIPTION \nFor the Core Competence – Control the Operation of the Ship and Care for Persons on Board at \nthe Support Level \n1 per \nclass \n \n \n \n \n12 pcs \n12 pcs \n12 pcs \n12 pcs \n24 pcs \n24 pcs \n24 prs \n24 prs \n24 pcs \n24 pcs \n \n4 pcs \n \n4 pcs \n4 pcs \n \n1 pc \n \n \n \n4 pc \n1 set \n \n \n• AVR equipment \nthat can handle the \nvideo or \nPowerPoint \npresentation \nmaterials \n• Wire cuter \n• Marlinspike \n• Fid \n• Hammer \n• Safety goggles \n• Working gloves \n• Safety shoes \n• Coveralls \n• Safety helmets \n• Safety \nbelts/harness \n• Boatswain’s chair \nwith riggings \n• Stage with riggings \n• Pilot ladder, \nstandard \n• Accommodation \nladder, with \naccessories, and \nsafety net \n• Rat guards \n• Set of signal flags \nfrom A to Z and \nanswering \npennants \n \n \n12 \npcs \n \n \n \n1 \narea \n \n \n \n \n1 unit \n \n \n \n \n \n1 @ \n \n \n \n \n \n \n \n1 unit \n• Work tables \nequipped with vice \ngrip for wire splicing \nand marlinspike \nworks. \n• Wall with overhead \nfittings for rigging \nboatswain’s chair, \nstages