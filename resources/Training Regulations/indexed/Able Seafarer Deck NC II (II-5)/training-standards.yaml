      "source_text": "This section specifies the qualifications of trainees and educational experience. Other \nrequirements like health and physical requirements are also stated. Passing entry written \nexaminations may also be indicated if necessary. \n \n• \nHolder of Certificate of Proficiency (COP) for Rating Forming Part of Navigational \nWatch II (STCW Regulation II/4) or \n• \nMust have completed the course on Rating Forming Part of Navigational Watch from \nan accredited training centers of TESDA/MARINA; and \n• \nMust have passed the medical examination for eyesight and hearing as per DOH \nAdministrative Order No. 2013-0006\n\n--- PDF PAGE 61 ---\nTR-Able Seafarer Deck NC II (STCW Regulation II/5) \nRevised June 26, 2013 \n57 \nLIST OF TOOLS, EQUIPMENT AND MATERIALS FOR \n ABLE SEAFARER DECK NC II (STCW Regulation II/5) \n \nRecommended list of tools, equipment and materials for a batch of 24 trainees for ABLE \nSEAFARER DECK NC II \n \nTOOLS \nEQUIPMENT \nMATERIALS \nQTY \nDESCRIPTION \nQTY \nDESCRIPTION \nQTY \nDESCRIPTION \nFor the Core Competence - Perform Navigation at the Support Level: \nIntegral \n \n \n \n \n \n \n1 per \nclass \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n• Tools inherent for \nbridge operations \nare deemed \nintegrated in the full \nmission bridge \nsimulator. \n• AVR equipment that \ncan handle the video \nor PowerPoint \npresentation \nmaterials \n1 set \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n• Bridge simulator \n• 1 Instructor Station \nNote: \nSimulator must have \nvisualization of not \nless than 225 \ndegrees arc of \nhorizontal visibility \ncapable to simulate \nship’s standard \nsteering system \n(hand and auto-\npilot), multiple \nprogrammed ships’ \nand targets’ \nnavigational lights, \nsound signals, and \nvarious state of \nweather and sea \nconditions. \n \n \n \n1 pc \n \n \n \n1 pc \n1 pc \n \n1 pc \n \n1 pc \n \n1 pc \n \n \n1 pc \n \n \n \n \n \n \n1 set \n \n \n \n \n \n \n \n \n \n \n \n \n \n2 pcs \n \n \n \n2 pcs \n \n \n \n \n \n \n2 pcs \n4 pcs \n2 pcs \nVideo or PowerPoint \npresentation for: \n• Watch handover \nprocedures and taking \norders from the watch \nofficer \n• Sound and light signals \n• Applying Rules of the \nRoad \n• Various emergencies \non board \n• Protection of \nenvironment \n• Vessel’s mooring and \nanchoring \narrangements \n• Bridge team \ncommunication to \nforward and aft stations \nduring \nmooring/unmooring, \nberthing/unberthing \nand anchoring \n• Vessel’s mooring \narrangements for the \nforward or forecastle \ndeck including \nanchoring arrangement, \nand at the astern deck. \nArrangements shall be \nable to show \noperationalization to \ninclude, mooring winch, \nbitts, chocks, bollards, \nfairleads, windlass, \nanchor, anchor chain \nand stoppers. \n• Mooring rope of at least \n50 meters in length and \n70 mm diameter with \neye on both ends. \n• Towing wire coiled in a \ndrum of at least 50 \nmeters length and 18 \nmm diameter with eye \non one end and the \nother end secured in \nthe drum. \n• Messenger ropes \n• Stoppers \n• Heaving lines\n\n--- PDF PAGE 62 ---\nTR-Able Seafarer Deck NC II (STCW Regulation II/5) \nRevised June 26, 2013 \n58 \n \nTOOLS \nEQUIPMENT \nMATERIALS \nQTY \nDESCRIPTION \nQTY \nDESCRIPTION \nQTY \nDESCRIPTION \nFor the Core Competence – Perform Cargo Handling And Stowage at the Support Level \n1 per \nclass \n• AVR equipment that \ncan handle the video \nor PowerPoint \npresentation \nmaterials \n \n1 set \n \n \n \n \n1 set \n \n• Various cargo lifting \nequipment such as, \ncargo net, cargo \nhook, spreaders and \ncargo slings. \n• Various cargo \nsecuring and lashing \nequipment such as, \nlashing chain, \nturnbuckles, pelican \nhook, wires, clips, \ncables and \ntensioning tools. \n \n \n \n1 pc \n \n \n \n1 pc \n \n \n \n \n1 pc \n \n \n1 pc \n \n \n \n \n \n \n1 pc \n \n \n \n \n \n \n1 pc \n \n \n1 pc \nVideo or PowerPoint \npresentation for: \n \n• Pre-check and \nprecautions required \nprior to handling ship’s \ncargo gear \n• Safety procedures and \nequipment operating \ninstructions in carrying \nout cargo and stores \noperations \n• Safe handling, stowage \nand securing cargo and \nstores \n• Precautions to be \nobserved in handling \nvarious types of \ncargoes such as: heavy \nlifts, containers, roll on \nroll off, vehicles, timber \nand deck cargo. \n• Precautions required \nfor handling \ndangerous, hazardous, \nand harmful \nsubstances and liquid \nincluding crude oil and \npetroleum products. \n• Precautions required \nwhen handling LPG and \nLNG Cargoes. \n• IMDG Class, labeling, \nsegregation of IMDG \ncargoes and type of risk \nassociated with each \nclass\n\n--- PDF PAGE 63 ---\nTR-Able Seafarer Deck NC II (STCW Regulation II/5) \nRevised June 26, 2013 \n59 \n \nTOOLS \nEQUIPMENT \nMATERIALS \nQTY \nDESCRIPTION \nQTY \nDESCRIPTION \nQTY \nDESCRIPTION \nFor the Core Competence – Control the Operation of the Ship and Care for Persons on Board at \nthe Support Level \n1 per \nclass \n \n \n \n \n12 pcs \n12 pcs \n12 pcs \n12 pcs \n24 pcs \n24 pcs \n24 prs \n24 prs \n24 pcs \n24 pcs \n \n4 pcs \n \n4 pcs \n4 pcs \n \n1 pc \n \n \n \n4 pc \n1 set \n \n \n• AVR equipment \nthat can handle the \nvideo or \nPowerPoint \npresentation \nmaterials \n• Wire cuter \n• Marlinspike \n• Fid \n• Hammer \n• Safety goggles \n• Working gloves \n• Safety shoes \n• Coveralls \n• Safety helmets \n• Safety \nbelts/harness \n• Boatswain’s chair \nwith riggings \n• Stage with riggings \n• Pilot ladder, \nstandard \n• Accommodation \nladder, with \naccessories, and \nsafety net \n• Rat guards \n• Set of signal flags \nfrom A to Z and \nanswering \npennants \n \n \n12 \npcs \n \n \n \n1 \narea \n \n \n \n \n1 unit \n \n \n \n \n \n1 @ \n \n \n \n \n \n \n \n1 unit \n• Work tables \nequipped with vice \ngrip for wire splicing \nand marlinspike \nworks. \n• Wall with overhead \nfittings for rigging \nboatswain’s chair, \nstages, pilot ladder \nand accommodation \nladder. \n• Lifting gear, i.e. \nCrane or derrick, \nactual or simulator \nthat can operate by \nlifting and lowering \ncargoes or loads \n \n \n \n \n1 pc \n \n \n \n1 pc \n \n \n \n \n1 pc \n \n \n1 pc \n \n \n \n \n \n1 pc \n \n \n \n \n1 pc \n \n \n \n \n \n1 pc \n \n \n \n \n \n \n \n \n \n \n \nVideo or PowerPoint \npresentation for: \n \n• Functions and uses of \nvalves and pumps, \nhoists, cranes, booms \nand related equipment \n• Functions and uses of \nwinches, windlasses, \ncapstans, and related \nequipment including its \noperation. \n• Functions of hatches, \nwatertight doors, ports \nand related equipment \n• Purpose of fiber and \nwire ropes, cables and \nchains, including their \nconstruction, use, \nmarkings maintenance \nand proper stowage. \n• Basic signals for the \noperation of equipment, \nincluding winches, \nwindlasses, cranes, and \nhoists. \n• Operation of anchoring \nequipment under \nvarious conditions, such \nas anchoring, weighing \nanchor, securing for sea \nand in emergencies. \n• Procedures in: \no Rig/unrig bosun’s \nchair and staging \no Rig and unrig pilot \nladders, hoists, rat \nguards and \ngangways or \naccommodation \nladders \no Use marlinspike \nseamanship skills\n\n--- PDF PAGE 64 ---\nTR-Able Seafarer Deck NC II (STCW Regulation II/5) \nRevised June 26, 2013 \n60 \n \nTOOLS \nEQUIPMENT \nMATERIALS \nQTY \nDESCRIPTION \nQTY \nDESCRIPTION \nQTY \nDESCRIPTION \nFor the Core Competence – Control the Operation of the Ship and Care for Persons on Board at \nthe Support Level \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n1 \n \n \n1 \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n1 \n \n \n \n \n50 \nmeters \neach \n \n• Handling deck and \ncargo-handling gear and \nequipment such as: \no Access \narrangements, \nhatches and hatch \ncovers, ramps, \nside/bow/stern \ndoors or elevators \no Pipeline sytems – \nbilge and ballast \nsuctions and wells \no Cranes, derricks, \nwinches \n• Hoisting and dipping \nflags and the main single \nflag signals \n• Safe working practices \nand personal shipboard \nsafety including: \no Working aloft \no Working over the \nside \no Working in enclosed \nspaces \no Permit to work \nsystem \no Line handling \no Lifting techniques \nand methods of \npreventing back \ninjury \no Electric safety \no Mechanical safety \no Chemical and \nbiohazard safety \no Personal safety \nequipment \n• Preventing pollution of \nthe marine environment \n \nAmple supply of the \nfollowing consumables: \n• Wires for splicing, \n18mm diameter \n• Mooring ropes for \nsplicing, 70mm diameter \n• Synthetic and fiber \nropes for splicing, 18mm \ndiameter\n\n--- PDF PAGE 65 ---\nTR-Able Seafarer Deck NC II (STCW Regulation II/5) \nRevised June 26, 2013 \n61 \n \nTOOLS \nEQUIPMENT \nMATERIALS \nQTY \nDESCRIPTION \nQTY \nDESCRIPTION \nQTY \nDESCRIPTION \nFor the Core Competence – Perform Maintenance and Repair at the Support Level \n1 per \nclass \n• AVR equipment \nthat can handle the \nvideo or \nPowerPoint \npresentation \nmaterials \n• Chipping hammer \n• Angular scraper \n• Long handle \nscraper \n• Power tools: \no Grinder \no Sander \no Drills \n \n1 set \n• Complete set of \npaint spray \nequipment \n• Air compressor \n• Grease gun \n• Lubricant applicator \n \n \n1 set \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n40 ltrs \n20 ltrs \n20 ltrs \n20 ltrs \n24 pcs \n24 pcs \n24 pcs \n24 pcs \n24 pcs \n20 ltrs \n20 ltrs \n24 pcs \nVideo or PowerPoint \npresentation for: \n• Shipboard \nMaintenance and \nRepair to include: \no Properties, handling \nand applications of \npaints, lubrication, \ncleaning materials and \nequipment \no Deck routine \nmaintenance and \nrepairs \no Surface preparations \ntechniques \no Understanding \nmanufacturer’s safety \nguidelines and \nshipboard instructions \no Safe disposal of waste \nmaterials \no Application, \nmaintenance and use \nof hand and power \ntools. \n \nAmple supply of the \nfollowing consumables: \n• Primer, 2 types \n• Enamel black \n• Enamel white \n• Enamel blue \n• Paint rollers 8” \n• Paint rollers 6” \n• Paint rollers 4” \n• Paint brush 4” \n• Paint brush 2” \n• Pain thinners \n• Cleaning chemicals \n• Rusty steel plates for \npaint preparation and \npainting 1m x 1m x 3mm \n(thickness) \n \nREMARKS: \n \n1. The tools, equipment and materials for the delivery of the ELEMENT “Operate Survival Craft and \nRescue Boat” under the CORE COMPETENCY “Control the Operation of the Ship and Care for \nPersons on Board at the Support Level” shall comply with the standards prescribed by the \nMARITIME INDUSTRY AUTHORITY (MARINA) in their regulated training program PROFICIENCY IN \nSURVIVAL CRAFT AND RESCUE BOAT (PSCRB). \n \n2. The tools, equipment and materials for the delivery of the COMMON COMPETENCIES shall comply \nwith the standards prescribed by the MARITIME INDUSTRY AUTHORITY (MARINA) in their \nprescribed and regulated training program in BASIC SAFETY TRAINING (BST) and SECURITY \nAWARENESS TRAINING courses.\n\n--- PDF PAGE 66 ---\nTR-Able Seafarer Deck NC II (STCW Regulation II/5) \nRevised June 26, 2013 \n62",
