      "source_text": "SECTION 3 TRAINING STANDARDS\n\nThese guidelines are set to provide the Technical and Vocational Education and Training\n(TVET) providers with information and other important requirements to consider when designing\ntraining programs for ABLE SEAFARER DECK NC II (STCW Regulation II/5).\n\n\n3.1\nCURRICULUM DESIGN\n\n\nCourse Title: ABLESEAFARER DECK NC II (STCW Regulation II/5)\n\n\nNominal Training Duration 18 Hours (Basic Competencies)\n60 Hours (Common Competencies)\n80 Hours (Core Competencies)\nCourse Description:\n\nThis course is designed to enhance the knowledge, skills and desirable work attitude in\nAble Seafarer Deck. It covers the basic, common and core competencies.\n\n\nBASIC COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and convey workplace\ninformation.\n1.2 Complete relevant work related\ndocuments.\n1.3 Participate in workplace\nmeeting and discussion.\n\n• Group\ndiscussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n2. Work in a team\nenvironment\n2.1 Describe and identify team role\nand responsibility in a team.\n2.2 Describe work as a team\nmember.\n\n• Discussion\n• Interaction\n\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n3. Practice career\nprofessionalism\n3.1 Integrate personal objectives\nwith organizational goals.\n3.2 Set and meet work priorities.\n3.3 Maintain professional growth\nand development\n\n• Discussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n4. Practice\noccupational\nhealth and\nsafety\n4.1 Evaluate hazard and risks\n4.2 Control hazards and risks\n4.3 Maintain occupational health\nand safety awareness\n\nDiscussion\nPlant tour\nSymposium\n• Observation\n• Interview\n\n--- PDF PAGE 58 ---\nTR-Able Seafarer Deck NC II (STCW Regulation II/5)\nRevised June 26, 2013\n54\nCOMMON COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1 Survive at sea in\nthe event of\nship\nabandonment\n1.1 Respond to the indicated\nemergency\n1.2 Board a survival craft\n• Discussion\n• Lecture\n• Demonstration\n• Simulation\n• Written\n• Questioning\n• Observation\n• Practical\nperformance\n2 Minimize the\nrisk of fire and\nmaintain a state\nof readiness to\nrespond to\nemergency\nsituations\ninvolving fire\n2.1 Carry out fire minimization\nprocedures\n2.2 Respond to emergencies\ninvolving fire\n• Discussion\n• Lecture\n• Demonstration\n• Simulation\n• Observation\n• Demonstration\n• Practical\nperformance\n\n3 Fight and\nextinguish fires\n3.1 Operate portable fire fighting\nequipment\n3.2 Carry out fire fighting operations\n• Discussion\n• Lecture\n• Demonstration\n• Simulation\n• Observation\n• Demonstration\n• Practical\nperformance\n4 Take immediate\naction upon\nencountering an\naccident or\nother medical\nemergency\n4.1 Determine need of casualty\n4.2 Administer first aid to the victim\n• Discussion\n• Lecture\n• Demonstration\n• Simulation\n\n• Observation\n• Demonstration\n• Practical\nperformance\n5 Comply with\nemergency\nprocedures\n5.1. Take action on becoming aware\nof an emergency\n5.2. Follow established emergency\nprocedures\n• Discussion\n• Lecture\n• Demonstration\n• Simulation\n• Observation\n• Demonstration\n• Practical\nperformance\n6 Take\nprecautions to\nprevent\npollution of the\nmarine\nenvironment\n6.1. Practice compliance with\nlegislative requirements for\nprotection of the marine\nenvironment\n6.2. Practice anti-pollution\nprocedures\n• Discussion\n• Lecture\n• Demonstration\n• Simulation\n\n• Observation\n• Demonstration\n• Practical\nperformance\n7 Observe safe\nworking\npractices\n7.1. Identify and follow workplace\nprocedures for hazard\nidentification and risk control\n7.2. Contribute to arrangements for\nthe management of occupational\nhealth and safety\n7.3. Understand and take necessary\nactions to control fatigue\n7.4. Complete occupational health\nand safety records\n• Discussion\n• Lecture\n• Demonstration\n• Simulation\n\n• Observation\n• Demonstration\n• Practical\nperformance\n8 Demonstrate\nsecurity\nawareness\npractices\n8.1. Contribute to the enhancement\nof maritime security through\nheightened awareness\n8.2. Recognize security threats\n8.3. Understand the need for and\nmaintaining security awareness\nand vigilance\n• Discussion\n• Lecture\n• Demonstration\n• Simulation\n\n• Observation\n• Demonstration\n• Practical\nperformance\nNote*: Applicant trainee who already possesses relevant certificate of training and/or certificate of competency in\nBasic Safety Training (BST) and Security Awareness Training shall not be required to undergo training/\ncertification on Common Competencies\n\n--- PDF PAGE 59 ---\nTR-Able Seafarer Deck NC II (STCW Regulation II/5)\nRevised June 26, 2013\n55\nCORE COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Perform\nnavigation at\nthe support\nlevel\n1.1 Contribute to a safe navigational\nwatch\n1.2 Contribute to berthing,\nanchoring and other mooring\noperations\n• Demonstration\n• Discussion\n• Simulation\n• Observation\n• Practical\ndemonstration\nand oral\nexamination\n\n2. Perform cargo\nhandling and\nstowage at the\nsupport level\n2.1. Contribute to the proper\nhandling of cargo and stores\n2.2. Contribute to proper handling of\ndangerous, hazardous and\nharmful substances and liquids\n\n• Demonstration\n• Discussion\n• Simulation\n• Observation\n• Practical\ndemonstration\nand oral\nexamination\n\n3. Control the\noperation of\nthe ship and\ncare for\npersons on\nboard at the\nsupport level\n3.1 Contribute to the safe operation\nof deck equipment and\nmachinery\n3.2 Apply occupational health and\nsafety precautions\n3.3 Apply precautions and\ncontribute to the prevention of\npollution of the marine\nenvironment\n3.4 Operate survival craft and\nrescue boats\n\n• Demonstration\n• Discussion\n• Simulation\n• Observation\n• Practical\ndemonstration\nand oral\nexamination\n• Written Test\n\n4. Perform\nmaintenance\nand repair at\nthe support\nlevel\n4.1 Contribute to shipboard\nmaintenance\n4.2 Contribute to shipboard repair\n• Demonstration\n• Discussion\n• Simulation\n• Observation\n• Practical\ndemonstration\nand oral\nexamination\n• Written Test\n\n--- PDF PAGE 60 ---\nTR-Able Seafarer Deck NC II (STCW Regulation II/5)\nRevised June 26, 2013\n56\n3.2\nTRAINING DELIVERY\n\nThe delivery of training should adhere to the design of the curriculum. Delivery should be\nguided by the 10 basic principles of competency-based TVET.\n\n•\nThe training is based on curriculum developed from the competency standards;\n•\nLearning is modular in its structure;\n•\nTraining delivery is learner-centered and should accommodate individualized and self-\npaced learning strategies;\n•\nTraining is based on work that must be performed;\n•\nTraining materials are directly related to the competency standards and the curriculum\nmodules;\n•\nAssessment is based in the collection of evidence of the performance of work to the\nindustry required standard;\n•\nTraining is based both on and off the job components;\n•\nAllows for recognition of prior learning (RPL) or current competencies\n•\nTraining allows for multiple entry and exit; and\n•\nApproved training programs are Nationally Accredited\n\nThe competency-based TVET system recognizes various types of delivery modes, both on\nand off-the-job as long as the learning is driven by the competency standards specified by the\nindustry. The following training modalities may be adopted when designing training programs:\n\n•\nThe dualized mode of training delivery is preferred and recommended. Thus programs\nwould contain both in-school and in-industry training or fieldwork components. Details\ncan be referred to the Dual Training System (DTS) Implementing Rules and\nRegulations.\n•\nModular/self-paced learning is a competency-based training modality wherein the\ntrainee is allowed to progress at his own pace. The trainer facilitates the training\ndelivery\n•\nPeer teaching/mentoring is a training modality wherein fast learners are given the\nopportunity to assist the slow learners.\n•\nSupervised industry training or on-the-job training is an approach in training designed\nto enhance the knowledge and skills of the trainee through actual experience in the\nworkplace to acquire specific competencies prescribed in the training regulations.\n•\nDistance learning is a formal education process in which majority of the instruction\noccurs when the students and instructor are not in the same place. Distance learning\nmay employ correspondence study, or audio, video or computer technologies.\n•\nProject-Based Instruction is an authentic instructional model or strategy in which\nstudents plan, implement and evaluate projects that have real world applications.\n\n\n\n3.3\nTRAINEE ENTRY REQUIREMENTS\n\nThis section specifies the qualifications of trainees and educational experience. Other\nrequirements like health and physical requirements are also stated. Passing entry written\nexaminations may also be indicated if necessary.\n\n•\nHolder of Certificate of Proficiency (COP) for Rating Forming Part of Navigational\nWatch II (STCW Regulation II/4) or\n•\nMust have completed the course on Rating Forming Part of Navigational Watch from\nan accredited training centers of TESDA/MARINA; and\n•\nMust have passed the medical examination for eyesight and hearing as per DOH\nAdministrative Order No. 2013-0006\n\n--- PDF PAGE 61 ---\nTR-Able Seafarer Deck NC II (STCW Regulation II/5)\nRevised June 26, 2013\n57\nLIST OF TOOLS, EQUIPMENT AND MATERIALS FOR\n ABLE SEAFARER DECK NC II (STCW Regulation II/5)\n\nRecommended list of tools, equipment and materials for a batch of 24 trainees for ABLE\nSEAFARER DECK NC II\n\nTOOLS\nEQUIPMENT\nMATERIALS\nQTY\nDESCRIPTION\nQTY\nDESCRIPTION\nQTY\nDESCRIPTION\nFor the Core Competence - Pe