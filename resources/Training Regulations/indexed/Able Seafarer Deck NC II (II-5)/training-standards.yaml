\n\n\n\n\n\n1\n\n\n1\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n1\n\n\n\n\n50\nmeters\neach\n\n• Handling deck and\ncargo-handling gear and\nequipment such as:\no Access\narrangements,\nhatches and hatch\ncovers, ramps,\nside/bow/stern\ndoors or elevators\no Pipeline sytems –\nbilge and ballast\nsuctions and wells\no Cranes, derricks,\nwinches\n• Hoisting and dipping\nflags and the main single\nflag signals\n• Safe working practices\nand personal shipboard\nsafety including:\no Working aloft\no Working over the\nside\no Working in enclosed\nspaces\no Permit to work\nsystem\no Line handling\no Lifting techniques\nand methods of\npreventing back\ninjury\no Electric safety\no Mechanical safety\no Chemical and\nbiohazard safety\no Personal safety\nequipment\n• Preventing pollution of\nthe marine environment\n\nAmple supply of the\nfollowing consumables:\n• Wires for splicing,\n18mm diameter\n• Mooring ropes for\nsplicing, 70mm diameter\n• Synthetic and fiber\nropes for splicing, 18mm\ndiameter\n\n--- PDF PAGE 65 ---\nTR-Able Seafarer Deck NC II (STCW Regulation II/5)\nRevised June 26, 2013\n61\n\nTOOLS\nEQUIPMENT\nMATERIALS\nQTY\nDESCRIPTION\nQTY\nDESCRIPTION\nQTY\nDESCRIPTION\nFor the Core Competence – Perform Maintenance and Repair at the Support Level\n1 per\nclass\n• AVR equipment\nthat can handle the\nvideo or\nPowerPoint\npresentation\nmaterials\n• Chipping hammer\n• Angular scraper\n• Long handle\nscraper\n• Power tools:\no Grinder\no Sander\no Drills\n\n1 set\n• Complete set of\npaint spray\nequipment\n• Air compressor\n• Grease gun\n• Lubricant applicator\n\n\n1 set\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n40 ltrs\n20 ltrs\n20 ltrs\n20 ltrs\n24 pcs\n24 pcs\n24 pcs\n24 pcs\n24 pcs\n20 ltrs\n20 ltrs\n24 pcs\nVideo or PowerPoint\npresentation for:\n• Shipboard\nMaintenance and\nRepair to include:\no Properties, handling\nand applications of\npaints, lubrication,\ncleaning materials and\nequipment\no Deck routine\nmaintenance and\nrepairs\no Surface preparations\ntechniques\no Understanding\nmanufacturer’s safety\nguidelines and\nshipboard instructions\no Safe disposal of waste\nmaterials\no Application,\nmaintenance and use\nof hand and power\ntools.\n\nAmple supply of the\nfollowing consumables:\n• Primer, 2 types\n• Enamel black\n• Enamel white\n• Enamel blue\n• Paint rollers 8”\n• Paint rollers 6”\n• Paint rollers 4”\n• Paint brush 4”\n• Paint brush 2”\n• Pain thinners\n• Cleaning chemicals\n• Rusty steel plates for\npaint preparation and\npainting 1m x 1m x 3mm\n(thickness)\n\nREMARKS:\n\n1. The tools, equipment and materials for the delivery of the ELEMENT “Operate Survival Craft and\nRescue Boat” under the CORE COMPETENCY “Control the Operation of the Ship and Care for\nPersons on Board at the Support Level” shall comply with the standards prescribed by the\nMARITIME INDUSTRY AUTHORITY (MARINA) in their regulated training program PROFICIENCY IN\nSURVIVAL CRAFT AND RESCUE BOAT (PSCRB).\n\n2. The tools, equipment and materials for the delivery of the COMMON COMPETENCIES shall comply\nwith the standards prescribed by the MARITIME INDUSTRY AUTHORITY (MARINA) in their\nprescribed and regulated training program in BASIC SAFETY TRAINING (BST) and SECURITY\nAWARENESS TRAINING courses.\n\n--- PDF PAGE 66 ---\nTR-Able Seafarer Deck NC II (STCW Regulation II/5)\nRevised June 26, 2013\n62\n3.5\nTRAINING FACILITIES\n\nABLE SEAFARER DECK NC II (STCW Regulation II/5)\n\nThe Able Seafarer Deck workshop must be of concrete structure. Based on class of size\n24 students / trainees the space requirements for the teaching / learning and circulation areas are\nas follows:\n\nSPACE REQUIREMENT\nSIZE IN METERS\nAREA IN SQ.\nMETERS\nTOTAL AREA IN SQ.\nMETERS\nWorkshop/Laboratory area:\n\n• Bridge simulator with (1)\ninstructor station;\n• mooring arrangements\n• seamanship\n• cargo handling\n• ship operation\n• deck maintenance\n\n\n\n\n\n\n\n\n\n\n\n\n150 sq. mtrs\n• Lecture Room\n\n\n42\n• Learning Resource Center\n4.00 x 5.00\n20\n