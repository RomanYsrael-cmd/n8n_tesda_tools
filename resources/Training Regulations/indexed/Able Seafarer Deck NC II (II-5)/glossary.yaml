      "term": "19. Fid",
      "definition": "a tapered wooden tool used for separating the strands of rope for splicing. 20. Flag hoist a number of signal flags strung together to convey a message 21. Gangway an opening in the rail or bulwark of a ship through which one can enter or leave the ship 22. Ground tackle anchors, chains, including apparel. 23. Gyro compass a mechanical indicator of the direction of the true (geographic) meridian, designed for determining the course of an object, as well as the azimuth (bearing) of the direction of orientation. 24. Hatch an opening in a ship’s deck. Generally rectangular affording access into the compartment below. 25. Helm order command ordered by pilot or mastering to helmsman in steering a ship. 26. Hold a general name for the spaces below deck, designated for the stowage of cargo. 27. Holiday a gap in the coverage of newly applied paint, slush, tar or other Preservative 28. Lashing materials used for securing by binding, wrapping, e/g/ fastening-rope, chain, canvas 29. Look-out a seaman stationed in the forecastle or in the crow’s nest for the purpose of maintaining watchful eye for any lights, land, or floating objects that may heave in sight, or reporting such to officer of the watch 30. Marlinspike a metal tool used in rope work for tasks such as unlaying rope, for splicing, untying knots 31. Riggings ropes and chains used to hold the masts, booms, etc. of vessel. A sailor’s palm sailor’s thimble, it is for leather and fits over the hand. 32. Splice join lines (ropes, cables etc.) by unraveling their ends and intertwining them to form a continuous line. To form an eye or a knot by splicing. 33. Safety net a net placed under the accommodation ladder as a safety precaution for persons embarking and disembarking from the ship 34. Seize to bind with small stuff, as, one rope to another, a rope to a spur, etc. 35. Slack a part of something that hangs loose without stain. 36. Stage a scaffold for workmen usually over the sides of a ship 37. Stocks supplies, materials, spare parts, tools and other gears kept in storage until needed for use. 38. Stoppers pieces of fiber ropes or chains about two meters in length, used to hold the mooring lines tight while transferring the lines from the winch drum to be secured on the bits. 39. Synthetic rope a rope made of nylon, Terylene or any material produced from chemical, mineral sources and general petroleum products 40. Tail rope is fastened to the end of the jumbo boom of a schooner and used to back the fore stay sail and she will lie-to with sail so trimmed."
