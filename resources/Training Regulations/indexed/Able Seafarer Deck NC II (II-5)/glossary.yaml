  "source_text": "DEFINITION OF TERMS \nFor the purpose of this training regulations, the words: \n \n1. Accommodation ladder \na portable flight of steps down a ship's side \n2. Anchor \nan object designed to prevent or slow the drift of a ship, \nattached to the ship by a line or chain; typically a metal, hook-\nlike or plough-like object designed to grip the bottom under the \nbody of water. \n3. Anchor ball \nround black shape hoisted in the forepart of a vessel to show \nthat it is anchored. \n4. Batten down the \nhatches \nto prepare for inclement weather by securing the closed hatch \ncovers with wooden battens so as to prevent water from \nentering from any angle \n5. Bitt or bitts \na post or pair mounted on the ship's bow, for fastening ropes or \ncables \n6. Boatswain or bosun \nA non-commissioned officer responsible for the sails, ropes, \nrigging and boats on a ship who issues \"piped\" commands to \nseamen. \n7. Bollard \na substantial vertical pillar to which lines may be made fast. \nGenerally on the quayside rather than the ship. \n8. Bearing \nthe horizontal direction of a line of sight between two objects on \nthe surface of the earth. \n9. Bridge \na structure above the weather deck, extending the full width of \nthe vessel, which houses a command center, itself called by \nassociation, the bridge \n10. Bridge wing \nan open-air extension of the bridge to port or starboard, \nintended for use in signaling \n11. Bosun’s chair \na short narrow board suspended by a bridle, used to sway a \nman aloft. For scrapping masts, tarring, rigging, etc. \n12. Bulkhead \none of several upright partitions separating various \ncompartments in a vessel preventing passage of oil, water or \nfire from one part of a ship to another. They serve as an \nimportant strength and stiffening members in a vessel’s \nstructure \n13. Capstan \na large winch with a vertical axis. A full-sized human-powered \ncapstan is a waist-high cylindrical machine, operated by a \nnumber of hands who each insert a horizontal capstan bar in \nholes in the capstan and walk in a circle. Used to wind in \nanchors or other heavy objects. \n14. Chain locker \na space in the forward part of the ship, typically beneath the \nbow in front of the foremost collision bulkhead, that contains the \nanchor chain when the anchor is secured for sea. \n15. Contaminants \nunwanted substances on ship surface such as oil, grease, salt, \nwaste, etc., which would prevent the paint from serving its \npurpose. \n16. Deck \nplating or planking secured to, and covering all or part of, any \ntier of beams; the floor of any compartment \n17. Deck stores \nstorage rooms where deck supplies and materials used in the \nday to day operation on board a ship are stored \n18. Fairlead \na ring, hook or other device used to keep a line or chain running \nin the correct direction or to prevent it rubbing or fouling.\n\n--- PDF PAGE 71 ---\nTR-Able Seafarer Deck NC II (STCW Regulation II/5) \nRevised June 26, 2013 \n67 \n \n19. Fid \na tapered wooden tool used for separating the strands of rope \nfor splicing. \n20. Flag hoist \na number of signal flags strung together to convey a message \n21. Gangway \nan opening in the rail or bulwark of a ship through which one \ncan enter or leave the ship \n22. Ground tackle \nanchors, chains, including apparel. \n23. Gyro compass \na mechanical indicator of the direction of the true (geographic) \nmeridian, designed for determining the course of an object, as \nwell as the azimuth (bearing) of the direction of orientation. \n24. Hatch \nan opening in a ship’s deck. Generally rectangular affording \naccess into the compartment below. \n25. Helm order \ncommand ordered by pilot or mastering to helmsman in \nsteering a ship. \n26. Hold \na general name for the spaces below deck, designated for the \nstowage of cargo. \n27. Holiday \na gap in the coverage of newly applied paint, slush, tar or other \nPreservative \n28. Lashing \nmaterials used for securing by binding, wrapping, e/g/ \nfastening-rope, chain, canvas \n29. Look-out \na seaman stationed in the forecastle or in the crow’s nest for \nthe purpose of maintaining watchful eye for any lights, land, or \nfloating objects that may heave in sight, or reporting such to \nofficer of the watch \n30. Marlinspike \na metal tool used in rope work for tasks such as unlaying rope, \nfor splicing, untying knots \n31. Riggings \nropes and chains used to hold the masts, booms, etc. of vessel. \nA sailor’s palm sailor’s thimble, it is for leather and fits over the \nhand. \n32. Splice \njoin lines (ropes, cables etc.) by unraveling their ends and \nintertwining them to form a continuous line. To form an eye or a \nknot by splicing. \n33. Safety net \na net placed under the accommodation ladder as a safety \nprecaution for persons embarking and disembarking from the \nship \n34. Seize \nto bind with small stuff, as, one rope to another, a rope to a \nspur, etc. \n35. Slack \na part of something that hangs loose without stain. \n36. Stage \na scaffold for workmen usually over the sides of a ship \n37. Stocks \nsupplies, materials, spare parts, tools and other gears kept in \nstorage until needed for use. \n38. Stoppers \npieces of fiber ropes or chains about two meters in length, used \nto hold the mooring lines tight while transferring the lines from \nthe winch drum to be secured on the bits. \n39. Synthetic rope \na rope made of nylon, Terylene or any material produced from \nchemical, mineral sources and general petroleum products \n40. Tail rope \nis fastened to the end of the jumbo boom of a schooner and \nused to back the fore stay sail and she will lie-to with sail so \ntrimmed.\n\n--- PDF PAGE 72 ---",
