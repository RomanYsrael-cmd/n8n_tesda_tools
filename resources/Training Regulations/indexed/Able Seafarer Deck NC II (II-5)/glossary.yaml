      "term": "1. Accommodation ladder",
      "definition": "a portable flight of steps down a ship's side 2. Anchor an object designed to prevent or slow the drift of a ship, attached to the ship by a line or chain; typically a metal, hook- like or plough-like object designed to grip the bottom under the body of water. 3. Anchor ball round black shape hoisted in the forepart of a vessel to show that it is anchored. 4. Batten down the hatches to prepare for inclement weather by securing the closed hatch covers with wooden battens so as to prevent water from entering from any angle 5. Bitt or bitts a post or pair mounted on the ship's bow, for fastening ropes or cables 6. Boatswain or bosun A non-commissioned officer responsible for the sails, ropes, rigging and boats on a ship who issues \"piped\" commands to seamen. 7. Bollard a substantial vertical pillar to which lines may be made fast. Generally on the quayside rather than the ship. 8. Bearing the horizontal direction of a line of sight between two objects on the surface of the earth. 9. Bridge a structure above the weather deck, extending the full width of the vessel, which houses a command center, itself called by association, the bridge 10. Bridge wing an open-air extension of the bridge to port or starboard, intended for use in signaling 11. Bosun’s chair a short narrow board suspended by a bridle, used to sway a man aloft. For scrapping masts, tarring, rigging, etc. 12. Bulkhead one of several upright partitions separating various compartments in a vessel preventing passage of oil, water or fire from one part of a ship to another. They serve as an important strength and stiffening members in a vessel’s structure 13. Capstan a large winch with a vertical axis. A full-sized human-powered capstan is a waist-high cylindrical machine, operated by a number of hands who each insert a horizontal capstan bar in holes in the capstan and walk in a circle. Used to wind in anchors or other heavy objects. 14. Chain locker a space in the forward part of the ship, typically beneath the bow in front of the foremost collision bulkhead, that contains the anchor chain when the anchor is secured for sea. 15. Contaminants unwanted substances on ship surface such as oil, grease, salt, waste, etc., which would prevent the paint from serving its purpose. 16. Deck plating or planking secured to, and covering all or part of, any tier of beams; the floor of any compartment 17. Deck stores storage rooms where deck supplies and materials used in the day to day operation on board a ship are stored 18. Fairlead a ring, hook or other device used to keep a line or chain running in the correct direction or to prevent it rubbing or fouling."
    },
