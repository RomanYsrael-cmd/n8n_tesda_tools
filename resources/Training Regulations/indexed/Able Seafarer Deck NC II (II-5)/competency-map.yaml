  "source_text": "COMPETENCY MAP \nFor Maritime Sector \nPerform \nmaintenance and \nsanitation of galley \nequipment and \nPerform cargo \nhandling and \nstowage at the \nsupport level \nPerform marine \nengineering at \nthe support level \nCarry out a watch \nroutine appropriate to \nthe duties of rating \nforming part of an \nengine room watch \nSteer the ship and \nalso comply with \nhelm orders in the \nEnglish language \nPerform \nvictualing \nservices \nPerform \nhousekeeping \nservices \nPerform safe usage \nof electrical \nequipment at the \nsupport level \nMaintain the \ncorrect boiler \nwater levels and \nsteam pressure \nKeep a proper \nlook-out by sight \nand hearing \nSupervise the \nmaintenance and \nsanitation of galley \nequipment and \nutensils and related \nareas \nPerform mess hall \nservice \nPerform \nmaintenance and \nrepair at the \nsupport level \nOperate emergency \nequipment and apply \nemergency \nprocedures \nContribute to \nmonitoring and \ncontrolling a safe \nwatch \nProvide assistance \nin receiving and \nstoring provisions \nAssist engineer \nin the \nmaintenance of \nmain engine \nOperate emergency \nequipment and apply \nemergency \nprocedures \nPrepare and \ncook meat dishes \nPrepare stocks, \nsauces and soups \nEstablish and \nmaintain catering \nstandards \nControl the \noperation of the \nship and care for \npersons on board at \nthe support level\nPerform \nnavigation at \nthe support level \nSupervise \npreparation of \nmeals \nPrepare bread \nproducts and hot \nand cold desserts \nPrepare and \ncook seafood \nPrepare and \ncook poultry \nproducts \nPrepare side \ndishes and \nbreakfast meal \nPrepare \nappetizers, salads \nand sandwiches \n(hot and cold and \nopen) \nTake precautions to \nprevent pollution of \nthe marine \nenvironment\nComply with \nemergency \nprocedures \nTake immediate \naction upon \nencountering an \naccident or other \nmedical emergency \nFight and \nextinguish fire \nMinimize the risk of \nfire and maintain a \nstate of readiness to \nrespond emergency \nsituations involving \nfi\nSurvive at sea in \nthe event of ship \nabandonment \nPerform stock \ncontrol \nWork within \nmulti-cultural and \nreligious \nenvironment \nProtect marine \nenvironment/ waste \nsegregation mgmt. \nObserve catering \nhealth and safety \npractices \nPractice food \nsafety, sanitation \nand hygiene \nObserve \npersonal hygiene \nObserve safe \nworking \npractices \nLead small teams \nLead in workplace \ncommunication \nWork in team \nenvironment \nParticipate in \nworkplace \ncommunication \nWork with others \nReceive and \nrespond to \nworkplace \ncommunication \nSolve problems \nrelated to work \nactivities \nDevelop and \npractice negotiation \nskills \nPractice \noccupational \nhealth and \nsafety \nd\nPractice career \nprofessionalism \nPractice basic \nhousekeeping \nprocedures \nDemonstrate \nwork values \nUse relevant \ntechnologies \nUse mathematical \nconcepts and \ntechniques \nDemonstrate \nsecurity \nawareness \npractices\nPerform \nmaintenance \nand repair at the \nsupport level\n\n--- PDF PAGE 70 ---\nTR-Able Seafarer Deck NC II (STCW Regulation II/5) \nRevised June 26, 2013 \n66",
