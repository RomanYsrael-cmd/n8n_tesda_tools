        "source_text": "UTL723211\nUNIT DESCRIPTOR: The unit identifies the competence required to disassemble, inspect,\nevaluate and determine preferred repair action for alternator/generator.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Disassemble\nalternator/generator\n1.1.\nMain circuit breaker is locked open and tagged-out as\nper enterprise policy.\n1.2.\nTerminals are disconnected and properly marked without\ndamaging other components.\n1.3.\nAlternator is decoupled without damaging other\ncomponents\n1.4.\nBaseline data are taken using prescribed methods.\n1.5.\nComponents are cleaned and freed of dust, grease and\nother foreign materials in preparation for the inspection\nand testing.\n1.6.\nAll disassembling and cleaning activities are carried out\naccording to manufacturers recommendations and\noccupational health and safety procedures\n1.7.\nService report is prepared in accordance with enterprise\npolicy.\n\n2. Assess and repair\nalternator\ncomponents\n2.1.\nComponents are tested and assessed using prescribed\nmethods and without causing damage to any component.\n2.2.\nRepair / replacement requirements are identified and\nreported according to enterprise policy and procedure.\n2.3.\nRequired component repair or replacements are carried\nout in accordance with manufacturer’s recommendations\nand specification.\n2.4.\nRepaired or replaced component’s data are recorded in\naccordance with enterprise policy.\n\n3. Re-assemble and re-\nterminate alternators\n3.1.\nAlternator are assembled following manufacturers\nmanual and without damage to the components or\nworkplace property\n3.2.\nAlternator is coupled to the engine according to\nmanufacturer’s instruction.\n3.3.\nAlignment of the alternator to the diesel engine is\nperformed following manufacturer’s instruction.\n\n4. Carry-out test\nprocedure\n\n3.5\nTesting methods are carried out in accordance with\nmanufacturer’s manual and without causing damage to\ncomponents or workplace property.\n3.6\nFaults in alternator operation are remedied following\nmanufacturer’s manual.\n3.7\nService report is finalized according enterprise policy.\n\n--- PDF PAGE 47 ---\nTR-Diesel Power Plant Maintenance NC III\n- 43 -\nRANGE OF VARIABLES\n1 Baseline data\n1.1\nExciter air gap\n1.2\nBolts torque loading\n1.3\nParts dimensions\n1.4\nResistance\n1.5\nInsulation Resistance\n\n2 Components\nMay include but not limited to :\n2.1\nMain stator assembly\n2.2\nMain rotor and exciter rotor assembly\n2.3\nExciter stator assembly\n2.4\nRevolving diode\n2.5\nCompounding Transformer\n2.6\nAutomatic Voltage Regulator\n2.7\nBridge rectifier\n2.8\nCurrent Transformer\n2.9\nPotential Transformer\n\n3 Prescribed method\n3.1\nInsulation test\n3.2\nContinuity test\n3.3\nResistance test\n3.4\nOcular inspection\n4 Component repair\n4.1\nRe-insulation and baking\n4.2\nRe-connection of components\n5 Workplace property\nMay include the following:\n5.1\nTools\n5.2\nEquipment\n5.3\nFacilities\n5.4\nDiesel generating set\n\n6 Testing Methods\nTesting methods may include:\n6.1\nVoltage regulation\n6.2\nPhase sequence\n6.3\nFrequency\n6.4\nLoad acceptance\n\n--- PDF PAGE 48 ---\nTR-Diesel Power Plant Maintenance NC III\n- 44 -\nEVIDENCE GUIDE\n1 Critical Aspect of\nCompetency\nAssessment requires that the candidate:\n1.1\nDisassembled and assembled alternator\n1.2\nAssessed alternator components\n1.3\nCarried out test procedures and repairs\n1.4\nPrepared service reports\n\n2 Underpinning\nKnowledge\n2.1\nInterpreting manufacturer’s manual and preparation of\nreports\n2.2\nAlternator operations\n2.3\nParts of alternator\n2.4\nSpecifications of alternator and components\n2.5\nSafety and environmental procedures related to servicing\nof alternator\n\n3 Underpinning Skills\n3.1\nHandling of tools and test equipments\n3.2\nTaking component measurements\n3.3\nAnalysis of acquired data\n3.4\nPerforming various electrical testing\n3.5\nCommunication skills\n\n4 Resource Implications 4.1\nMechanical and electrical hand tools\n4.2\nElectrical test equipments\n4.3\nCleaning and insulating materials\n4.4\nPPE\n4.5\nDiesel Generating set 15kw to 750kw\n\n5 Method of\nAssessment\n5.1\nWritten\n5.2\nDirect observation with oral questioning\n5.3\nThird party report\n5.4\nPortfolio\n5.5\nInterview\n5.6\nDemonstration with oral questioning\n\n6 Context of\nAssessment\n6.1\nCompetency may be assess on the job or simulated\nenvironment\n6.2\nThe assessment of practical skills may take place after a\nperiod of supervised practice and repetitive experience\n\n--- PDF PAGE 49 ---\nTR-Diesel Power Plant Maintenance NC III\n- 45 -\nUNIT OF COMPETENCY : DIAGNOSE AND REPAIR ELECTRICAL SYSTEM\nUNIT CODE\n\n:"
