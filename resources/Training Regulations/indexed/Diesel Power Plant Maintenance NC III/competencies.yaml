          "source_text": "1. Disassemble \nalternator/generator \n1.1. \nMain circuit breaker is locked open and tagged-out as \nper enterprise policy. \n1.2. \nTerminals are disconnected and properly marked without \ndamaging other components. \n1.3. \nAlternator is decoupled without damaging other \ncomponents \n1.4. \nBaseline data are taken using prescribed methods. \n1.5. \nComponents are cleaned and freed of dust, grease and \nother foreign materials in preparation for the inspection \nand testing. \n1.6. \nAll disassembling and cleaning activities are carried out \naccording to manufacturers recommendations and \noccupational health and safety procedures \n1.7. \nService report is prepared in accordance with enterprise \npolicy. \n \n2. Assess and repair \nalternator \ncomponents \n2.1. \nComponents are tested and assessed using prescribed \nmethods and without causing damage to any component. \n2.2. \nRepair / replacement requirements are identified and \nreported according to enterprise policy and procedure. \n2.3. \nRequired component repair or replacements are carried \nout in accordance with manufacturer’s recommendations \nand specification. \n2.4. \nRepaired or replaced component’s data are recorded in \naccordance with enterprise policy. \n \n3. Re-assemble and re-\nterminate alternators \n3.1. \nAlternator are assembled following manufacturers \nmanual and without damage to the components or \nworkplace property  \n3.2. \nAlternator is coupled to the engine according to \nmanufacturer’s instruction. \n3.3. \nAlignment of the alternator to the diesel engine is \nperformed following manufacturer’s instruction. \n \n4. Carry-out test \nprocedure \n \n \n \n3.5 \nTesting methods are carried out in accordance with \nmanufacturer’s manual and without causing damage to \ncomponents or workplace property. \n3.6 \nFaults in alternator operation are remedied following \nmanufacturer’s manual. \n3.7 \nService report is finalized according enterprise policy.\n\n