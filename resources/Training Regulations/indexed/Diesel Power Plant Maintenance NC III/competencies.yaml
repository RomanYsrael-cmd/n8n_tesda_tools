        "evidence_guide": {
          "source_text": "1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nIdentified the problem\n1.2\nDetermined the fundamental causes of the problem\n1.3\nDetermined the correct / preventive action\n1.4\nProvided recommendation to manager\nThese aspects may be best assessed using a range of scenarios /\ncase studies / what ifs as a stimulus with a walk through forming part\nof the response. These assessment activities should include a range\nof problems, including new, unusual and improbable situations that\nmay have happened.\n2. Underpinning\nknowledge\n2.1\nCompetence includes a thorough knowledge and\nunderstanding of the process, normal operating parameters,\nand product quality to recognize non-standard situations\n2.2\nCompetence to include the ability to apply and explain,\nsufficient for the identification of fundamental cause,\ndetermining the corrective action and provision of\nrecommendations\n2.2.1\nRelevant equipment and operational processes\n2.2.2\nEnterprise goals, targets and measures\n2.2.3\nEnterprise quality, OHS and environmental requirement\n2.2.4\nPrinciples of decision making strategies and techniques\n2.2.5\nEnterprise information systems and data collation\n2.2.6\nIndustry codes and standards\n3. Underpinning skills\n3.1\nUsing range of formal problem solving techniques\n3.2\nIdentifying and clarifying the nature of the problem\n3.3\nDevising the best solution\n3.4\nEvaluating the solution\n3.5\nImplementation of a developed plan to rectify the problem\n4. Resource\nimplications\n4.1\nAssessment will require access to an operating plant over an\nextended period of time, or a suitable method of gathering\nevidence of operating ability over a range of situations. A bank\nof scenarios / case studies / what ifs will be required as well as\nbank of questions which will be used to probe the reason\nbehind the observable action.\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1\nCase studies on solving problems in the workplace\n5.2\n Observation\nThe unit will be assessed in a holistic manner as is practical and may\nbe integrated with the assessment of other relevant units of\ncompetency. Assessment will occur over a range of situations, which\nwill include disruptions to normal, smooth operation. Simulation may\nbe required to allow for timely assessment of parts of this unit of\ncompetency. Simulation should be based on the actual workplace\nand will include walk through of the relevant competency\ncomponents.\n6. Context of\nassessment\n6.1\nIn all workplace, it may be appropriate to assess this unit\nconcurrently with relevant teamwork or operation units.\n\n--- PDF PAGE 18 ---\nTR-Diesel Power Plant Maintenance NC III\n- 14 -\n\nUNIT OF COMPETENCY :\nUSE MATHEMATICAL CONCEPTS AND TECHNIQUES\n\nUNIT CODE\n:"
        },
        "source_text": "500311112\nUNIT DESCRIPTOR\n:\nThis unit of covers the knowledge, skills and attitudes required to\nsolve problems in the workplace including the application of\nproblem solving techniques and to determine and resolve the root\ncause of problems.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Identify the problem\n1.1\nVariances are identified from normal operating parameters;\nand product quality\n1.2 Extent, cause and nature are of the problem are defined\nthrough observation, investigation and analytical techniques\n1.3 Problems are clearly stated and specified\n2. Determine\nfundamental causes\nof the problem\n2.1 Possible causes are identified based on experience and the\nuse of problem solving tools / analytical techniques.\n2.2 Possible cause statements are developed based on findings\n2.3 Fundamental causes are identified per results of investigation\nconducted\n3. Determine corrective\naction\n3.1 All possible options are considered for resolution of the\nproblem\n3.2 Strengths and weaknesses of possible options are considered\n3.3 Corrective actions are determined to resolve the problem and\npossible future causes\n3.4 Action plans are developed identifying measurable objectives,\nresource needs and timelines in accordance with safety and\noperating procedures\n4. Provide\nrecommendation/s to\nmanager\n4.1 Report on recommendations are prepared\n4.2 Recommendations are presented to appropriate personnel.\n4.3 Recommendations are followed-up, if required\n\n--- PDF PAGE 16 ---\nTR-Diesel Power Plant Maintenance NC III\n- 12 -\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Analytical techniques\n1.1\nBrainstorming\n1.2 Intuitions/Logic\n1.3 Cause and effect diagrams\n1.4 Pareto analysis\n1.5 SWOT analysis\n1.6 Gant chart, Pert CPM and graphs\n1.7 Scattergrams\n2. Problem\n\n2.1 Non – routine process and quality problems\n2.2 Equipment selection, availability and failure\n2.3 Teamwork and work allocation problem\n2.4\nSafety and emergency situations and incidents\n3. Action plans\n\n3.1 Priority requirements\n3.2 Measurable objectives\n3.3 Resource requirements\n3.4 Timelines\n3.5 Co-ordination and feedback requirements\n3.6 Safety requirements\n3.7 Risk assessment\n3.8 Environmental requirements\n\n--- PDF PAGE 17 ---\nTR-Diesel Power Plant Maintenance NC III\n- 13 -\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nIdentified the problem\n1.2\nDetermined the fundamental causes of the problem\n1.3\nDetermined the correct / preventive action\n1.4\nProvided recommendation to manager\nThese aspects may be best assessed using a range of scenarios /\ncase studies / what ifs as a stimulus with a walk through forming part\nof the response. These assessment activities should include a range\nof problems, including new, unusual and improbable situations that\nmay have happened.\n2. Underpinning\nknowledge\n2.1\nCompetence includes a thorough knowledge and\nunderstanding of the process, normal operating parameters,\nand product quality to recognize non-standard situations\n2.2\nCompetence to include the ability to apply and explain,\nsufficient for the identification of fundamental cause,\ndetermining the corrective action and provision of\nrecommendations\n2.2.1\nRelevant equipment and operational processes\n2.2.2\nEnterprise goals, targets and measures\n2.2.3\nEnterprise quality, OHS and environmental requirement\n2.2.4\nPrinciples of decision making strategies and techniques\n2.2.5\nEnterprise information systems and data collation\n2.2.6\nIndustry codes and standards\n3. Underpinning skills\n3.1\nUsing range of formal problem solving techniques\n3.2\nIdentifying and clarifying the nature of the problem\n3.3\nDevising the best solution\n3.4\nEvaluating the solution\n3.5\nImplementation of a developed plan to rectify the problem\n4. Resource\nimplications\n4.1\nAssessment will require access to an operating plant over an\nextended period of time, or a suitable method of gathering\nevidence of operating ability over a range of situations. A bank\nof scenarios / case studies / what ifs will be required as well as\nbank of questions which will be used to probe the reason\nbehind the observable action.\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1\nCase studies on solving problems in the workplace\n5.2\n Observation\nThe unit will be assessed in a holistic manner as is practical and may\nbe integrated with the assessment of other relevant units of\ncompetency. Assessment will occur over a range of situations, which\nwill include disruptions to normal, smooth operation. Simulation may\nbe required to allow for timely assessment of parts of this unit of\ncompetency. Simulation should be based on the actual workplace\nand will include walk through of the relevant competency\ncomponents.\n6. Context of\nassessment\n6.1\nIn all workplace, it may be appropriate to assess this unit\nconcurrently with relevant teamwork or operation units.\n\n--- PDF PAGE 18 ---\nTR-Diesel Power Plant Maintenance NC III\n- 14 -\n\nUNIT OF COMPETENCY :\nUSE MATHEMATICAL CONCEPTS AND TECHNIQUES\n\nUNIT CODE\n:"
      },
