          "source_text": "1. Disassemble \nengine block and \nsub-assemblies \n \n1.1 Engine block and sub-assemblies are disassembled without \ncausing damage to any component or system and in accordance \nwith manufacturers manual. \n1.2 Components or system are ensured to be free of dirt, grease, rust \nand other foreign materials in preparation for the inspection and \ntesting. \n1.3 Disassembled components are marked and arranged according \nto prescribed arrangements. \n1.4 All disassembling and cleaning activities are carried out according \nto industry regulations or guidelines and occupational health and \nsafety procedures. \n2. Assess engine \nblock and sub-\nassembly \ncomponents \n \n \n2.1 Components and systems are tested and measured using \nprescribed method and without causing damage to any \ncomponent or system. \n2.2 Fuel injector is serviced and calibrated in accordance with the \nmanufacturer’s instruction manual. \n2.3 Result of testing and measurement are assessed using \nmanufacturer specifications. \n2.4 Repair or replacement requirements are identified and reported \naccording to enterprise policy and procedure. \n2.5 Pre-repair inspection report is completed and dealt with relevant \nto the assessment outcome. \n2.6 Required component repair or replacements are carried out in \naccordance with manufacturer’s recommendations \n \n3. Re-assemble \nengine blocks and \nsub-assemblies \n \n \n3.1 Component measurements are checked  in accordance with \nmanufacturer’s specification \n3.2 Faults in measurements are rectified in accordance with \nmanufacture’s specification. \n3.3 Engine block and sub assemblies are assembled following \nmanufacturers manual and without damage to the components or \nworkplace property. \n4. Carry out test \nprocedure \n \n \n4.1 Pre-testing activities are performed following system normal \noperating procedure \n4.2 Engines performance is checked for normal operation using \ndifferent testing methods in accordance with manufacturer’s \nmanual and without causing damage to the workplace property. \n4.3 Faults in engine operation are remedied following manufacturer’s \nmanual. \n4.4 Overhaul report is prepared according enterprise policy.\n\n--- PDF PAGE 41 ---\nTR-Diesel Power Plant Maintenance NC III                                        \n- 37 - \nRANGE OF VARIABLES \n \n1. \nEngine block and \nsub-assemblies \n \nMay include: \n1.1 Cylinder head assembly \n1.2 Crankshaft and flywheel \nassembly \n1.3 Piston, cylinder liner and \nconnecting rod assembly \n1.4 Gear train and wheelcase \nassembly \n1.5 Cam shaft, cam follower \nand push rod assembly \n1.6 Air cleaner and bracket \nassembly \n1.7 Turbocharger assembly \n \n1.8 Coolant pump assembly \n1.9 Lube oil pump assembly \n1.10 Lube oil cooler assembly \n1.11 Charged alternator \nassembly \n1.12 Actuator assembly \n1.13 Air cooler assembly \n1.14 Rocker arm assembly \n1.15 Starter motor assembly \n1.16 Fuel injector valve \nassembly \n \n2. System \n2.1 May include but not limited to: \n2.2 Cooling system \n2.3 Fuel system \n2.4 Lube oil system \n2.5 Aspiration (intake and exhaust) system \n2.6 DC system \n2.7 Speed regulating system \n3. Prescribed \narrangements \n3.1 Grouped per sub-assembly \n3.2 First out-Last-in \n4. Prescribed \nmethods \n4.1 Non destructive testing \n4.2 Pressure testing \n4.3 Clearance measurement \n4.4 Leak testing \n5. Component \nmeasurements \nMay include but not limited to: \n5.1 Tappet clearance \n5.2 Bolts torque loading \n5.3 Gear train backlash \nclearances  \n5.4 Bearing thickness and \nclearances  \n5.5 Radial and axial clearances \n \n5.6 Cylinder liner diameter \n5.7 Cylinder head, i.e. valve \nstem, guide, spring  \n5.8 Piston diameter and piston \nring grooves \n5.9 Crankshaft deflection \n5.10 Camshaft bore \n \n6. Workplace \nproperty \n6.1 Tools \n6.2 Equipment \n6.3 Facilities \n7. Pre-testing \nactivities \nThis includes the preparation of: \n7.1 dc system \n7.2 cooling system \n7.3 lube oil system \n \n7.4 fuel system \n7.5 aspiration system \n7.6 speed regulating system \n8. Different testing \nmethods \nDifferent testing methods may \ninclude: \n8.1 Temperature and pressure \ntesting \n8.2 Vibration and sound \ninspection \n \n8.3 Leakage detection \n8.4 Exhaust gas monitoring \n8.5 Protection simulation \ntesting \n8.6 Load testing\n\n--- PDF PAGE 42 ---\nTR-Diesel Power Plant Maintenance NC III                                        \n- 38 -"
