  "source_section_text": "Section 1. Successful candidates shall be awarded a National\nCertificate signed by the TESDA Director General.\n\n4.2 Individual: aspiring to be awarded the qualification of Diesel Power Plant Maintenance NC\nIII must acquire Certificates of Competency in all the following core units of the\nQualification. Candidates may apply for assessment in any accredited assessment center.\n\n4.2.1.1 Overhaul Diesel Engine\n4.2.1.2 Diagnose and Repair Diesel Engine\n4.2.1.3 Service alternator\n4.2.1.4 Diagnose and Repair Electrical System\n\nSuccessful candidates shall be awarded Certificates of Competency (COC).\n\n4.3 Accumulation and submission of all COCs acquired for the relevant units of competency\ncomprising a qualification, an individual shall be issued the corresponding National\nCertificate.\n\n4.4 Assessment shall focus on the core units of competency. The basic and common units\nshall be integrated or assessed concurrently with the core units.\n\n4.5 The following are qualified to apply for assessment and certification:\n\n4.5.1 Graduates of formal, non-formal and informal including enterprise-based training\nprograms.\n\n4.5.2 Experienced workers (wage employed or self employed)\n\n4.6 The guidelines on assessment and certification are discussed in detail in the “Procedures\nManual on Assessment and Certification” and “Guidelines on the Implementation of the\nPhilippine TVET Qualification and Certification System (PTOQCS)”.\n\n--- PDF PAGE 60 ---\nTR-Diesel Power Plant Maintenance NC III\n- 56 -\n\nANNEX A - COMPETENCY MAP – DIESEL POWER PLANT MAINTENANCE NC III\n\nBASIC COMPETENCIES\n\nReceive and\nRespond to\nWorkplace\nCommunication\nWork with Others\nDemonstrate work\nvalues\nPractice basic\nhousekeeping\nprocedures\nParticipate in\nWorkplace\nCommunication\nWork in a Team\nEnvironment\nPractice career\nprofessionalism\nPractice occupational\nhealth and safety\nprocedures\nLead Workplace\nCommunication\nLead Small Team\nDevelop and\npractice negotiation\nskills\nSolve Problems\nRelated to Work\nActivities\nUse mathematical\nconcepts and\ntechniques\nUse relevant\ntechnologies\nUtilize Specialist\nCommunication Skills\nDevelop Team and\nIndividuals\nApply Problem\nSolving Techniques\nin the Workplace\nCollect, analyze and\norganize information\nPlan and Organize\nWork\nPromote\nenvironmental\nprotection\n\nCOMMON COMPETENCIES\n\nApply Appropriate\nSealant/Adhesive\nPerform\nMensuration and\nCalculation\nRead, Interpret and\nApply\nSpecifications and\nManuals\nUse and Apply\nLubricants/Coolants\nPerform Shop\nMaintenance\nPerform Basic\nBench Works\nPerform Basic\nElectrical Works\n\nCORE COMPETENCIES\n\nTender Diesel\nEngine\nOperate Diesel\nPower plant\nService Alternator/\nGenerator\nMaintain and Repair\nDiesel Engine\nSystems\nDiagnose and\nRepair Diesel\nEngine\nDiagnose and\nRepair Electrical\nSystem\nOverhaul Diesel\nEngine\n\n--- PDF PAGE 61 ---\nTR-Diesel Power Plant Maintenance NC III\n- 57 -\nDEFINITION OF TERMS\n\nGENERAL\n\n1) Certification - is the process of verifying and validating the competencies of a person\nthrough assessment\n\n2) Certificate of Competency (COC) – is a certification issued to individuals who pass the\nassessment for a single unit or cluster of units of competency\n\n3) Common Competencies - are the skills and knowledge needed by all people working in\na particular industry\n\n4) Competency - is the possession and application of knowledge, skills and attitudes to\nperform work activities to the standard expected in the workplace\n\n5) Competency Assessment - is the process of collecting evidence and making judgments\non whether competency has been achieved\n\n6) Competency Standard (CS) - is the industry-determined specification of competencies\nrequired for effective work performance\n\n7) Context of Assessment - refers to the place where assessment is to be conducted or\ncarried out\n\n8) Core Competencies - are the specific skills and knowledge needed in a particular area of\nwork - industry sector/occupation/job role\n\n9) Critical aspects of competency - refers to the evidence that is essential for successful\nperformance of the unit of competency\n\n10) Elective Competencies - are the additional skills and knowledge required by the\nindividual or enterprise for work\n\n11) Elements - are the building blocks of a unit of competency. They describe in outcome\nterms the functions that a person performs in the workplace.\n\n12) Evidence Guide - is a component of the unit of competency that defines or identifies the\nevidences required to determine the competence of the individual. It provides\ninformation on critical aspects of competency, underpinning knowledge, underpinning\nskills, resource implications, assessment method and context of assessment\n\n13) Level - refers to the category of skills and knowledge required to do a job\n\n14) Method of Assessment - refers to the ways of collecting evidence and when, evidence\nshould be collected\n\n15) National Certificate (NC) – is a certification issued to individuals who achieve all the\nrequired units of competency for a national qualification defined under the Training\nRegulations. NCs are aligned to specific levels within the PTQF\n\n16) Performance Criteria - are evaluative statements that specify what is to be assessed\nand the required level of performance\n\n--- PDF PAGE 62 ---\nTR-Diesel Power Plant Maintenance NC III\n- 58 -\n17) Qualification - is a cluster of units of competencies that meets job roles and is significant\nin the workplace. It is also a certification awarded to a person on successful completion\nof a course in recognition of having demonstrated competencies in an industry sector\n\n18) Range of Variables - describes the circumstances or context in which the work is to be\nperformed\n\n19) Recognition of Prior Learning (RPL) – is the acknowledgement of an individual’s skills,\nknowledge and attitudes gained from life and work experiences outside registered\ntraining programs\n\n20) Resource Implications - refers to the resources needed for the successful performance\nof the work activity described in the unit of competency. It includes work environment\nand conditions, materials, tools and equipment\n\n21) Basic Competencies - are the skills and knowledge that everyone needs for work\n\n22) Training Regulations (TR) – refers to the document promulgated and issued by TESDA\nconsisting of competency standards, national qualifications and training guidelines for\nspecific sectors/occupations. The TR serves as basis for establishment of qualification\nand certification under the PTQF. It also serves as guide for development of\ncompetency-based curricula and instructional materials including registration of TVET\nprograms offered by TVET providers\n\n23) Underpinning Knowledge - refers to the competency that involves in applying\nknowledge to perform work activities. It includes specific knowledge that is essential to\nthe performance of the competency\n\n24) Underpinning Skills - refers to the list of the skills needed to achieve the elements and\nperformance criteria in the unit of competency. It includes generic and industry specific\nskills\n\n25) Unit of Competency – is a component of the competency standards stating a specific\nkey function or role in a particular job or occupation; it is the smallest component of\nachievement that can be assessed and certified under the PTQF\n\nSECTOR SPECIFIC\n\n1. Cooling system\nA closed system of the generator set that provides a continuous\nflow of coolant (soft water with 0-40 ppm hardness) primarily to\nreduce the heat at the cylinder heads and liners. It also reduces\nthe heat from the lubricating oil.\n\n2. Lube oil system\nA closed system of the generator set that provides a continuous\nflow of lubricating oil that reduces heat and friction to all moving\nparts of the engine.\n\n3. Fuel system\nAn open system of the generator set that provides a continuous\nflow of clean, high pressure and atomized fuel to the\ncombustion chamber.\n\n--- PDF PAGE 63 ---\nTR-Diesel Power Plant Maintenance NC III\n- 59 -\n4. Aspiration system\nAn open system of the generator set that provides clean, high\ndensity compressed air to the combustion chamber by utilizing\nthe exhaust gas to drive the turbocharger.\n\n5. DC system\nA system of the generator set that supplies 24 volts DC power\nto the various DC equipment, protections and controls.\n\n6. Alternator\nA system of the generator set that converts mechanical energy\ninto electrical energy. It includes the exciter component and\nmain windings.\n\n7. Speed regulating\nsystem\nA system of the generator set that maintains the rated speed of\nthe engine at various load.\n\n8. Enterprise policy\nAlso refer as corporate policy\n\n9. PMS\nrefers as preventive maintenance schedule\n\n10. coolants\nRefers to the cooling medium of the cooling system which is the\nsoft water with a hardness of 0-40 ppm.\n\n11. indicating\nparameters\n\nAlso refers to as engine and control panel parameters\n12. SOP\nRefers to the plant system normal operating procedure\n\n--- PDF PAGE 64 ---\nACKNOWLEDGEMENTS\n\nThe Technical Education and Skills Development Authority (TESDA) wishes to extend thanks\nand appreciation to the many representatives of business, industry, academe and government\nagencies who donated their time and expertise to the development and validation of this Training\nRegulation.\n\nTHE TECHNICAL EXPERTS PANEL\n\nFROM NAPOCOR\n\nHILARIO S. AÑO\nPrincipal Engineer C\nPatnanungan DPP\n\nTEOFE C. CADIZ\nSuperintendent\nSouthern Palawan S/S & 69 KV TL\nLEO G. CINCO\nPrincipal Engineer C\nTingloy DPP\n\nLOUIE C. LIBARRA\nSuperintendent, Busuanga DPP\nEUGENE WILLY G. FRANCISCO\nPrincipal Engineer C\nBanton DPP\nLARRY I. SABELLINA\nSuperintendent\nPuerto Princesa DPP\n\nJESUS J. MENDOZA\nPlant Superintendent\nKabugao DPP\n\nNORBERTO R. ESPINO III\nPrincipal Engineer A\nWMTSD\nRICKY M. UMBAN\nPlant Sup