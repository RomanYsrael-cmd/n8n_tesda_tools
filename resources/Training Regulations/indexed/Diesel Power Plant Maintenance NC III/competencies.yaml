n \n10.4 Exhaust gas monitoring\n\n--- PDF PAGE 45 ---\nTR-Diesel Power Plant Maintenance NC III                                        \n- 41 - \nEVIDENCE GUIDE \n \n1 \nCritical Aspect of \nCompetency \nAssessment requires that the candidate: \n1.1 Determined and located the defects \n1.2 Assessed the cause of defect \n1.3 Repaired and carried out test run and monitoring \n1.4 Documented the repair activities \n2 \nUnderpinning \nKnowledge \n2.1 \nInterpreting manufacturer’s manual and preparation of reports \n2.2 \nDiesel engine operations \n2.3 \nParts and sub-assemblies of diesel engine \n2.4 \nSpecifications of diesel engine and components \n2.5 \nSafety and environmental procedures related to servicing of \ndiesel engine \n3 \nUnderpinning Skills 3.1 \nHandling of tools and test equipments \n3.2 \nTaking component measurements \n3.3 \nAnalysis of acquired data \n3.4 \nPerforming various diesel engine testing \n3.5 \nCommunication skills \n4 \nResource \nImplications \n4.1 \nMechanical hand tools \n4.2 \nMechanical test equipments \n4.3 \nCleaning and other consumable materials \n4.4 \nPPE \n4.5 \nDiesel Engine 15kw to 750kw \n5 \nMethod of \nAssessment \n5.1 \nWritten \n5.2 \nDirect observation with oral questioning \n5.3 \nThird party report \n5.4 \nPortfolio \n5.5 \nInterview \n5.6 \nDemonstration with oral questioning \n6 \nContext of \nAssessment \n6.1 \nCompetency may be assess on the job or simulated \nenvironment \n6.2 \nThe assessment of practical skills may take place after a \nperiod of supervised practice and repetitive experience\n",
