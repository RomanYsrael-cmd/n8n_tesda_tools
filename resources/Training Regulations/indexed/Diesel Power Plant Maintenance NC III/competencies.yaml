        "source_text": "UTL723210\nUNIT DESCRIPTOR: The unit identifies the competence required to troubleshoot and repair\ndiesel engine. This involves planning, preparing and performing\ntroubleshooting and repair as well as\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Plan and prepare for\ntroubleshooting and\nrepair\n1.1. Work requirements are identified from relevant personnel\nand documentation.\n1.2. Service prerequisites are carried out in accordance with\nenterprise policy.\n1.3. Required resources are identified and prepared based on\nenterprise policy and on-site validation report.\n1.4. 5s and safety practices are implemented in accordance\nwith the enterprise policy\n\n2. Perform\ntroubleshooting and\nrepair\n2.1. Engine defects or defective components are identified\nthrough systematic and logical method of isolation and\ntesting without causing damage to the engine and other\nworkplace property\n2.2. Root cause analysis is performed using data gathered and\nwithout causing damage to engine and other workplace\nproperty\n2.3. Repair or replacement of defective components are carried\nout in accordance with the result of troubleshooting and root\ncause analysis and manufacturers instruction.\n\n3. Carry out test\nprocedure\n\n3.1\nPre-testing activities are performed following system\nnormal operating procedure\n3.2\nTest run is carried out while monitoring the condition of the\nengine in accordance with manufacturer’s manual and\nwithout causing damage to components or workplace\nproperty.\n3.3\nFaults in engine operation are corrected following\nmanufacturer’s manual.\n3.4\nService report is prepared according enterprise policy.\n\n--- PDF PAGE 44 ---\nTR-Diesel Power Plant Maintenance NC III\n- 40 -\nRANGE OF VARIABLES\n\n1. Work requirements\nMay include the following:\n1.1\nInitial report\n1.2\nRecords of annunciators and indicators\n1.3\nInitial analysis of troubles\n1.4\nEngine brand, type, model and capacity\n2. Service pre-requisites\n2.1\nConfirmation to undergo service\n2.2\nEstablishment of downtime\n2.3\nOn site validation of initial report\n2.4\nPreparation of on-site validation report\n3. Required resources\nMay include but not limited to:\n1.1\nConsumables\n1.2\nSpare parts\n1.3\nTools\n1.4\nEquipment\n\n1.5\nEngine documentations,\ne.g. manuals, history\ncard\n4. Safety practices\nMay include:\n4.1\nIsolation of genset\n4.2\nProper tagging\n5. Systematic and logical\nmethod of isolation and\ntesting\nMay include:\n5.1\nIsolation and elimination by system\n5.2\nIsolation and elimination based on data gathered\n6. Testing\n\nMay include but not limited to:\n6.1\nPressure test and leak\ntest\n6.2\nNDT – surface method\ntesting\n6.3\nRadial and axial test\n\n6.4\nTemperature\nmeasurement\n6.5\nDimensional\nmeasurement\n6.6\nChemical test\n7. Data gathered\nMay include but not limited to:\n7.1\nResults of visual, hearing and smell inspection\n7.2\nBased on measurement conducted\n7.3\nInformation indicated by annunciator\n7.4\nInitial report\n8. Workplace property\nMay include but not limited to:\n8.1\nTools\n8.2\nEquipment\n8.3\nFacilities\n9. Pre-testing activities\nThis may include:\n9.1\npreparation of:\n9.1.1\ndc system\n9.1.2\ncooling system\n9.1.3\nlube oil system\n9.1.4\nfuel system\n9.1.5\naspiration (intake and exhaust) system\n9.1.6\nspeed regulating system\n9.2\nProtection simulation testing\n10. Monitoring\nMonitoring may include:\n10.1 Temperature and pressure monitoring\n10.2 Excessive vibration and unusual sound monitoring\n10.3 Leakage detection\n10.4 Exhaust gas monitoring\n\n--- PDF PAGE 45 ---\nTR-Diesel Power Plant Maintenance NC III\n- 41 -\nEVIDENCE GUIDE\n\n1\nCritical Aspect of\nCompetency\nAssessment requires that the candidate:\n1.1 Determined and located the defects\n1.2 Assessed the cause of defect\n1.3 Repaired and carried out test run and monitoring\n1.4 Documented the repair activities\n2\nUnderpinning\nKnowledge\n2.1\nInterpreting manufacturer’s manual and preparation of reports\n2.2\nDiesel engine operations\n2.3\nParts and sub-assemblies of diesel engine\n2.4\nSpecifications of diesel engine and components\n2.5\nSafety and environmental procedures related to servicing of\ndiesel engine\n3\nUnderpinning Skills 3.1\nHandling of tools and test equipments\n3.2\nTaking component measurements\n3.3\nAnalysis of acquired data\n3.4\nPerforming various diesel engine testing\n3.5\nCommunication skills\n4\nResource\nImplications\n4.1\nMechanical hand tools\n4.2\nMechanical test equipments\n4.3\nCleaning and other consumable materials\n4.4\nPPE\n4.5\nDiesel Engine 15kw to 750kw\n5\nMethod of\nAssessment\n5.1\nWritten\n5.2\nDirect observation with oral questioning\n5.3\nThird party report\n5.4\nPortfolio\n5.5\nInterview\n5.6\nDemonstration with oral questioning\n6\nContext of\nAssessment\n6.1\nCompetency may be assess on the job or simulated\nenvironment\n6.2\nThe assessment of practical skills may take place after a\nperiod of supervised practice and repetitive experience\n\n--- PDF PAGE 46 ---\nTR-Diesel Power Plant Maintenance NC III\n- 42 -\nUNIT OF COMPETENCY : SERVICE ALTERNATOR/GENERATOR\nUNIT CODE\n\n:"
