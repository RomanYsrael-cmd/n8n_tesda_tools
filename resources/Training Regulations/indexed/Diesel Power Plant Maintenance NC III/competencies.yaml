        "source_text": "UTL723212\nUNIT DESCRIPTOR: The unit identifies the competence required to troubleshoot and repair\nelectrical system.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Plan and prepare for\ntroubleshooting and\nrepair\n1.1. Work requirements are identified from relevant\npersonnel and documentation.\n1.2. Service prerequisites are carried out in accordance with\nenterprise policy.\n1.3. Required resources are identified and prepared based\non enterprise policy and on-site validation report.\n1.4. 5s and safety practices are implemented in accordance\nwith the enterprise policy\n\n2. Perform\ntroubleshooting and\nrepair\n2.1. Electrical system defects or defective components are\nidentified through systematic and logical method of\nisolation and testing without causing damage to the\nelectrical system and other workplace property.\n2.2. Root cause analysis is performed using data gathered\nand without causing damage to electrical components and\nother workplace property.\n2.3. Repair or replacement of defective components are\ncarried out in accordance with the result of\ntroubleshooting and root cause analysis and\nmanufacturers instruction.\n2.4. Repairs requiring outside services are identified and\nreported in accordance with enterprise policy.\n\n3. Carry out test\nprocedure\n\n3.1\nPre-testing activities are performed following system\nnormal operating procedure.\n3.2\nTesting methods are carried out in accordance with\nmanufacturer’s manual and without causing damage to\ncomponents or workplace property.\n3.3\nFaults in electrical system operation are corrected\nfollowing manufacturer’s manual.\n3.4\nService report is prepared according enterprise policy.\n\n--- PDF PAGE 50 ---\nTR-Diesel Power Plant Maintenance NC III\n- 46 -\nRANGE OF VARIABLES\n\n1 Work requirements\nMay include but not limited to:\n1.1\nInitial report\n1.2\nRecords of annunciators and indicators\n1.3\nInitial analysis of troubles\n1.4\nAlternator brand, type, model and capacity\n2 Service pre-\nrequisites\nMay include:\n2.1\nConfirmation to undergo service\n2.2\nAgreement of downtime\n2.3\nOn site validation of initial report\n2.4\nPreparation of on-site validation report\n3 Required resources\nMay include but not limited to:\n3.1\nConsumables\n3.2\nSpare parts\n3.3\nTools\n\n3.4\nEquipment\n3.5\nElectrical system\ndocuments\n4 Safety practices\nMay include:\n4.1 Circuit Breaker Lock-out\n4.2 Proper tagging\n4.3 Emergency stop is engaged\n4.4 Disconnection of charger and battery terminals\n4.5 Wearing of PPE\n5 Electrical System\nMay include but not limited to:\n5.1\nAlternator assembly\n5.2\nControls and protection\n5.3\nDC and AC System\n6 Systematic and\nlogical method of\nisolation and testing\n6.1\nIsolation and elimination by system\n6.2\nIsolation and elimination by components\n7. Testing\n\nMay include but not limited to:\n7.1\nContinuity and polarity\nmeasurement\n7.2\nInsulation Test\n7.3\nFunctional Test\n\n7.4\nFrequency Test\n7.5\nVoltage Test\n7.6\nCurrent Test\n7.7\nPhase Sequence Test\n8 Data gathered\nMay include:\n8.1\nResults of visual, hearing and smell inspection\n8.2\nBased on measurement conducted\n8.3\nInformation indicated by annunciator\n8.4\nInitial report\n9 Workplace property\nMay include but not limited to:\n9.1\nTools\n9.2\nEquipment\n9.3\nFacilities\n10 Pre-testing activities\nThis may include:\n10.1 Checking of air gap clearance and connections\n10.2 Refitting of power and control cables\n10.3 Unlock main circuit breaker\n11 Testing methods\nTesting methods may include:\n11.1\nFunctional Test\no Voltage Testing\no Frequency Testing\no Phase sequence Testing\n\no Protection Simulation\nTesting\n11.2\nLoad Test\n\n--- PDF PAGE 51 ---\nTR-Diesel Power Plant Maintenance NC III\n- 47 -\n\nEVIDENCE GUIDE\n\n1. Critical Aspect of\nCompetency\nAssessment requires that the candidate:\n1.1\nDetermine and locate the defects\n1.2\nAssessed the cause of defect\n1.3\nRepaired and carried out test methods\n1.4\nDocumented the repair activities\n2. Underpinning\nKnowledge\n2.1\nInterpreting manufacturer’s manual and electrical\nschematic diagrams\n2.2\nDiesel power plant electrical systems operation\n2.3\nParts and assembly of alternator and associated electrical\nsystems\n2.4\nSpecifications of alternator and associated electrical\nsystems and components\n2.5\nMotor controls\n2.6\nSafety and environmental procedures related to servicing\nof electrical system\n3. Underpinning Skills\n3.1\nHandling of tools and test equipments\n3.2\nTaking component and electrical measurement\n3.3\nAnalysis of acquired data\n3.4\nPerforming various electrical system testing\n3.5\nCommunication skills\n3.6\nPerforming root cause analysis\n4. Resource Implications\n4.1\nHand and power tools\n4.2\nElectrical test instruments\n4.3\nHeater and/or baking lamps\n4.4\nSpare parts, cleaning and other consumable materials\n4.5\nPlant electrical diagrams\n4.6\nService report forms\n4.7\nPPE\n4.8\nGenerating Set 15kw to 750kw\n5. Method of Assessment\n5.1\nWritten\n5.2\nDirect observation with oral questioning\n5.3\nThird party report\n5.4\nPortfolio\n5.5\nInterview\n5.6\nDemonstration with oral questioning\n6. Context of Assessment\n6.1\nCompetency may be assessed on the job or simulated\nenvironment\n6.2\nThe assessment of practical skills may take place after a\nperiod of supervised practice and repetitive experience\n\n--- PDF PAGE 52 ---\nTR-Diesel Power Plant Maintenance NC III\n- 48 -"
      }
    ]
