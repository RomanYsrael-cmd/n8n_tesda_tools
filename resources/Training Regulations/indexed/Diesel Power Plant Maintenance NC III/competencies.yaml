        "source_title": "OVERHAUL DIESEL ENGINE",
        "source_text": "--- PDF PAGE 40 ---\nTR-Diesel Power Plant Maintenance NC III                                        \n- 36 - \nCORE COMPETENCIES \n \nThis section gives the details of the contents of the core units of competency required in \nDIESEL POWER PLANT MAINTENANCE NC III.  \n \nUNIT OF COMPETENCY :   OVERHAUL DIESEL ENGINE  \nUNIT CODE  \n   \n:   UTL723209 \nUNIT DESCRIPTOR: This unit identifies the competence required to disassemble, inspect, \nevaluate and determine preferred repair action for engine block and sub-\nassemblies as part of a regular preventive-maintenance schedule and \ncovering top, intermediate and major overhauling procedures. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1. Disassemble \nengine block and \nsub-assemblies \n \n1.1 Engine block and sub-assemblies are disassembled without \ncausing damage to any component or system and in accordance \nwith manufacturers manual. \n1.2 Components or system are ensured to be free of dirt, grease, rust \nand other foreign materials in preparation for the inspection and \ntesting. \n1.3 Disassembled components are marked and arranged according \nto prescribed arrangements. \n1.4 All disassembling and cleaning activities are carried out according \nto industry regulations or guidelines and occupational health and \nsafety procedures. \n2. Assess engine \nblock and sub-\nassembly \ncomponents \n \n \n2.1 Components and systems are tested and measured using \nprescribed method and without causing damage to any \ncomponent or system. \n2.2 Fuel injector is serviced and calibrated in accordance with the \nmanufacturer’s instruction manual. \n2.3 Result of testing and measurement are assessed using \nmanufacturer specifications. \n2.4 Repair or replacement requirements are identified and reported \naccording to enterprise policy and procedure. \n2.5 Pre-repair inspection report is completed and dealt with relevant \nto the assessment outcome. \n2.6 Required component repair or replacements are carried out in \naccordance with manufacturer’s recommendations \n \n3. Re-assemble \nengine blocks and \nsub-assemblies \n \n \n3.1 Component measurements are checked  in accordance with \nmanufacturer’s specification \n3.2 Faults in measurements are rectified in accordance with \nmanufacture’s specification. \n3.3 Engine block and sub assemblies are assembled following \nmanufacturers manual and without damage to the components or \nworkplace property. \n4. Carry out test \nprocedure \n \n \n4.1 Pre-testing activities are performed following system normal \noperating procedure \n4.2 Engines performance is checked for normal operation using \ndifferent testing methods in accordance with manufacturer’s \nmanual and without causing damage to the workplace property. \n4.3 Faults in engine operation are remedied following manufacturer’s \nmanual. \n4.4 Overhaul report is prepared according enterprise policy.\n\n--- PDF PAGE 41 ---\nTR-Diesel Power Plant Maintenance NC III                                        \n- 37 - \nRANGE OF VARIABLES \n \n1. \nEngine block and \nsub-assemblies \n \nMay include: \n1.1 Cylinder head assembly \n1.2 Crankshaft and flywheel \nassembly \n1.3 Piston, cylinder liner and \nconnecting rod assembly \n1.4 Gear train and wheelcase \nassembly \n1.5 Cam shaft, cam follower \nand push rod assembly \n1.6 Air cleaner and bracket \nassembly \n1.7 Turbocharger assembly \n \n1.8 Coolant pump assembly \n1.9 Lube oil pump assembly \n1.10 Lube oil cooler assembly \n1.11 Charged alternator \nassembly \n1.12 Actuator assembly \n1.13 Air cooler assembly \n1.14 Rocker arm assembly \n1.15 Starter motor assembly \n1.16 Fuel injector valve \nassembly \n \n2. System \n2.1 May include but not limited to: \n2.2 Cooling system \n2.3 Fuel system \n2.4 Lube oil system \n2.5 Aspiration (intake and exhaust) system \n2.6 DC system \n2.7 Speed regulating system \n3. Prescribed \narrangements \n3.1 Grouped per sub-assembly \n3.2 First out-Last-in \n4. Prescribed \nmethods \n4.1 Non destructive testing \n4.2 Pressure testing \n4.3 Clearance measurement \n4.4 Leak testing \n5. Component \nmeasurements \nMay include but not limited to: \n5.1 Tappet clearance \n5.2 Bolts torque loading \n5.3 Gear train backlash \nclearances  \n5.4 Bearing thickness and \nclearances  \n5.5 Radial and axial clearances \n \n5.6 Cylinder liner diameter \n5.7 Cylinder head, i.e. valve \nstem, guide, spring  \n5.8 Piston diameter and piston \nring grooves \n5.9 Crankshaft deflection \n5.10 Camshaft bore \n \n6. Workplace \nproperty \n6.1 Tools \n6.2 Equipment \n6.3 Facilities \n7. Pre-testing \nactivities \nThis includes the preparation of: \n7.1 dc system \n7.2 cooling system \n7.3 lube oil system \n \n7.4 fuel system \n7.5 aspiration system \n7.6 speed regulating system \n8. Different testing \nmethods \nDifferent testing methods may \ninclude: \n8.1 Temperature and pressure \ntesting \n8.2 Vibration and sound \ninspection \n \n8.3 Leakage detection \n8.4 Exhaust gas monitoring \n8.5 Protection simulation \ntesting \n8.6 Load testing\n\n--- PDF PAGE 42 ---\nTR-Diesel Power Plant Maintenance NC III                                        \n- 38 - \nEVIDENCE GUIDE \n \n1. \nCritical Aspect of \nCompetency \nAssessment requires evidence that the candidate: \n1.1. \nDisassembled engine block and sub-assemblies \n1.2. \nCleaned components after disassembly \n1.3. \nAssessed condition of engine block and sub-assembly \ncomponents \n1.4. \nRe-assembled engine blocks and sub-assemblies \n1.5. \nCarried out test procedure \n1.6. \nPrepared service report \n \n2. \nUnderpinning \nKnowledge \n2.1. \nInterpreting manufacturers manual and preparation of \nreports \n2.2. \nDiesel engine operation \n2.3. \nDiesel engine systems operation \n2.4. \nParts and assembly of diesel engine \n2.5. \nSpecification of diesel engine and components \n2.6. \nSafety and environmental procedures related to servicing \ndiesel engines \n \n3. \nUnderpinning Skills \n3.1. \nHandling of tools and equipment. \n3.2. \nHandling of precision measuring tools and equipment \n3.3. \nTaking component measurements \n3.4. \nAnalysis of acquired data \n3.5. \nPerforming various non destructive testing such as surface \nmethod testing and visual inspection \n3.6. \nCommunication skills \n \n4. \nResource Implication 4.1. \nMechanical tools \n4.2. \nPrecision measuring tools \n4.3. \nSpecial tools \n4.4. \nLubricants, coolants and fuel \n4.5. \nGaskets and sealants \n4.6. \nDye penetrant, developer and solvent \n4.7. \nCleaning tools and materials \n4.8. \nPPE \n4.9. \nDiesel engine 15 KW - 750 KW and spare parts \n \n5. \nMethod of \nassessment \n5.1. \nWritten \n5.2. \nDirect observation with oral questioning \n5.3. \nThird party report \n5.4. \nPortfolio \n5.5. \nInterview \n \n6. \nContext of \nAssessment \n6.1. \nCompetency may be assessed on the job or simulated \nenvironment \n6.2. \nThe assessment of practical skills may take place after a \nperiod of supervised practice and repetitive experience.\n",
