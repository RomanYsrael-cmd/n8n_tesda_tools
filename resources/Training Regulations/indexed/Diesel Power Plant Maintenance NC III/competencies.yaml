uctions manual \n1.6 \nSpare Parts Catalogue\n\n--- PDF PAGE 29 ---\nTR-Diesel Power Plant Maintenance NC III                                        \n- 25 - \n \n \n \n \n \n \nEVIDENCE GUIDE \n \n1. Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1 \nIdentified and accessed manual/specification \n1.2 \nInterpreted manuals \n1.3 \nApplied information in manuals \n1.4 \nStored manuals \n2. Underpinning  \nknowledge  \n2.1  Types of manuals used in automotive industry \n2.2  Identification of symbols used in the manuals \n2.3     Identification of units of measurements \n2.4     Unit conversion \n3. Underpinning skills \n \n3.1 \nReading and comprehension skills required to identify and \ninterpret automotive manuals and specifications \n3.2 \nAccessing information and data \n4. Resource Implication \n \nThe following resources MUST be provided: \n4.1 \nAll manuals/catalogues relative to Automotive \n4.2 \nJob order, requisitions \n4.3 \nActual vehicle or simulator \n5. Method of \nassessment \n \nCompetency MUST be assessed through: \n5.1 \nObservation with questioning \n5.2 \nInterview  \n6. Context of  \nassessment  \n \n6.1  Assessment must be undertaken in accordance with the \nendorsed TESDA assessment guidelines \n6.2 \nAssessment may be conducted in the workplace or in a \nsimulated environment.\n",
