PDF PAGE 40 ---\nTR-Diesel Power Plant Maintenance NC III\n- 36 -\nCORE COMPETENCIES\n\nThis section gives the details of the contents of the core units of competency required in\nDIESEL POWER PLANT MAINTENANCE NC III.\n\nUNIT OF COMPETENCY : OVERHAUL DIESEL ENGINE\nUNIT CODE\n\n: UTL723209\nUNIT DESCRIPTOR: This unit identifies the competence required to disassemble, inspect,\nevaluate and determine preferred repair action for engine block and sub-\nassemblies as part of a regular preventive-maintenance schedule and\ncovering top, intermediate and major overhauling procedures.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Disassemble\nengine block and\nsub-assemblies\n\n1.1 Engine block and sub-assemblies are disassembled without\ncausing damage to any component or system and in accordance\nwith manufacturers manual.\n1.2 Components or system are ensured to be free of dirt, grease, rust\nand other foreign materials in preparation for the inspection and\ntesting.\n1.3 Disassembled components are marked and arranged according\nto prescribed arrangements.\n1.4 All disassembling and cleaning activities are carried out according\nto industry regulations or guidelines and occupational health and\nsafety procedures.\n2. Assess engine\nblock and sub-\nassembly\ncomponents\n\n2.1 Components and systems are tested and measured using\nprescribed method and without causing damage to any\ncomponent or system.\n2.2 Fuel injector is serviced and calibrated in accordance with the\nmanufacturer’s instruction manual.\n2.3 Result of testing and measurement are assessed using\nmanufacturer specifications.\n2.4 Repair or replacement requirements are identified and reported\naccording to enterprise policy and procedure.\n2.5 Pre-repair inspection report is completed and dealt with relevant\nto the assessment outcome.\n2.6 Required component repair or replacements are carried out in\naccordance with manufacturer’s recommendations\n\n3. Re-assemble\nengine blocks and\nsub-assemblies\n\n3.1 Component measurements are checked in accordance with\nmanufacturer’s specification\n3.2 Faults in measurements are rectified in accordance with\nmanufacture’s specification.\n3.3 Engine block and sub assemblies are assembled following\nmanufacturers manual and without damage to the components or\nworkplace property.\n4. Carry out test\nprocedure\n\n4.1 Pre-testing activities are performed following system normal\noperating procedure\n4.2 Engines performance is checked for normal operation using\ndifferent testing methods in accordance with manufacturer’s\nmanual and without causing damage to the workplace property.\n4.3 Faults in engine operation are remedied following manufacturer’s\nmanual.\n4.4 Overhaul report is prepared according enterprise policy.\n\n--- PDF PAGE 41 ---\nTR-Diesel Power Plant Maintenance NC III\n- 37 -\nRANGE OF VARIABLES\n\n1.\nEngine block and\nsub-assemblies\n\nMay include:\n1.1 Cylinder head assembly\n1.2 Crankshaft and flywheel\nassembly\n1.3 Piston, cylinder liner and\nconnecting rod assembly\n1.4 Gear train and wheelcase\nassembly\n1.5 Cam shaft, cam follower\nand push rod assembly\n1.6 Air cleaner and bracket\nassembly\n1.7 Turbocharger assembly\n\n1.8 Coolant pump assembly\n1.9 Lube oil pump assembly\n1.10 Lube oil cooler assembly\n1.11 Charged alternator\nassembly\n1.12 Actuator assembly\n1.13 Air cooler assembly\n1.14 Rocker arm assembly\n1.15 Starter motor assembly\n1.16 Fuel injector valve\nassembly\n\n2. System\n2.1 May include but not limited to:\n2.2 Cooling system\n2.3 Fuel system\n2.4 Lube oil system\n2.5 Aspiration (intake and exhaust) system\n2.6 DC system\n2.7 Speed regulating system\n3. Prescribed\narrangements\n3.1 Grouped per sub-assembly\n3.2 First out-Last-in\n4. Prescribed\nmethods\n4.1 Non destructive testing\n4.2 Pressure testing\n4.3 Clearance measurement\n4.4 Leak testing\n5. Component\nmeasurements\nMay include but not limited to:\n5.1 Tappet clearance\n5.2 Bolts torque loading\n5.3 Gear train backlash\nclearances\n5.4 Bearing thickness and\nclearances\n5.5 Radial and axial clearances\n\n5.6 Cylinder liner diameter\n5.7 Cylinder head, i.e. valve\nstem, guide, spring\n5.8 Piston diameter and piston\nring grooves\n5.9 Crankshaft deflection\n5.10 Camshaft bore\n\n6. Workplace\nproperty\n6.1 Tools\n6.2 Equipment\n6.3 Facilities\n7. Pre-testing\nactivities\nThis includes the preparation of:\n7.1 dc system\n7.2 cooling system\n7.3 lube oil system\n\n7.4 fuel system\n7.5 aspiration system\n7.6 speed regulating system\n8. Different testing\nmethods\nDifferent testing methods may\ninclude:\n8.1 Temperature and pressure\ntesting\n8.2 Vibration and sound\ninspection\n\n8.3 Leakage detection\n8.4 Exhaust gas monitoring\n8.5 Protection simulation\ntesting\n8.6 Load testing\n\n--- PDF PAGE 42 ---\nTR-Diesel Power Plant Maintenance NC III\n- 38 -\nEVIDENCE GUIDE\n\n1.\nCritical Aspect of\nCompetency\nAssessment requires evidence that the candidate:\n1.1.\nDisassembled engine block and sub-assemblies\n1.2.\nCleaned components after disassembly\n1.3.\nAssessed condition of engine block and sub-assembly\ncomponents\n1.4.\nRe-assembled engine blocks and sub-assemblies\n1.5.\nCarried out test procedure\n1.6.\nPrepared service report\n\n2.\nUnderpinning\nKnowledge\n2.1.\nInterpreting manufacturers manual and preparation of\nreports\n2.2.\nDiesel engine operation\n2.3.\nDiesel engine systems operation\n2.4.\nParts and assembly of diesel engine\n2.5.\nSpecification of diesel engine and components\n2.6.\nSafety and environmental procedures related to servicing\ndiesel engines\n\n3.\nUnderpinning Skills\n3.1.\nHandling of tools and equipment.\n3.2.\nHandling of precision measuring tools and equipment\n3.3.\nTaking component measurements\n3.4.\nAnalysis of acquired data\n3.5.\nPerforming various non destructive testing such as surface\nmethod testing and visual inspection\n3.6.\nCommunication skills\n\n4.\nResource Implication 4.1.\nMechanical tools\n4.2.\nPrecision measuring tools\n4.3.\nSpecial tools\n4.4.\nLubricants, coolants and fuel\n4.5.\nGaskets and sealants\n4.6.\nDye penetrant, developer and solvent\n4.7.\nCleaning tools and materials\n4.8.\nPPE\n4.9.\nDiesel engine 15 KW - 750 KW and spare parts\n\n5.\nMethod of\nassessment\n5.1.\nWritten\n5.2.\nDirect observation with oral questioning\n5.3.\nThird party report\n5.4.\nPortfolio\n5.5.\nInterview\n\n6.\nContext of\nAssessment\n6.1.\nCompetency may be assessed on the job or simulated\nenvironment\n6.2.\nThe assessment of practical skills may take place after a\nperiod of supervised practice and repetitive experience.\n\n--- PDF PAGE 43 ---\nTR-Diesel Power Plant Maintenance NC III\n- 39 -\nUNIT OF COMPETENCY : DIAGNOSE AND REPAIR DIESEL ENGINE\nUNIT CODE\n\n: UTL723210\nUNIT DESCRIPTOR: The unit identifies the competence required to troubleshoot and repair\ndiesel engine. This involves planning, preparing and performing\ntroubleshooting and repair as well as\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Plan and prepare for\ntroubleshooting and\nrepair\n1.1. Work requirements are identified from relevant personnel\nand documentation.\n1.2. Service prerequisites are carried out in accordance with\nenterprise policy.\n1.3. Required resources are identified and prepared based on\nenterprise policy and on-site validation report.\n1.4. 5s and safety practices are implemented in accordance\nwith the enterprise policy\n\n2. Perform\ntroubleshooting and\nrepair\n2.1. Engine defects or defective components are identified\nthrough systematic and logical method of isolation and\ntesting without causing damage to the engine and other\nworkplace property\n2.2. Root cause analysis is performed using data gathered and\nwithout causing damage to engine and other workplace\nproperty\n2.3. Repair or replacement of defective components are carried\nout in accordance with the result of troubleshooting and root\ncause analysis and manufacturers instruction.\n\n3. Carry out test\nprocedure\n\n3.1\nPre-testing activities are performed following system\nnormal operating procedure\n3.2\nTest run is carried out while monitoring the condition of the\nengine in accordance with manufacturer’s manual and\nwithout causing damage to components or workplace\nproperty.\n3.3\nFaults in engine operation are corrected following\nmanufacturer’s manual.\n3.4\nService report is prepared according enterprise policy.\n\n--- PDF PAGE 44 ---\nTR-Diesel Power Plant Maintenance NC III\n- 40 -\nRANGE OF VARIABLES\n\n1. Work requirements\nMay include the following:\n1.1\nInitial report\n1.2\nRecords of annunciators and indicators\n1.3\nInitial analysis of troubles\n1.4\nEngine brand, type, model and capacity\n2. Service pre-requisites\n2.1\nConfirmation to undergo service\n2.2\nEstablishment of downtime\n2.3\nOn site validation of initial report\n2.4\nPreparation of on-site validation report\n3. Required resources\nMay include but not limited to:\n1.1\nConsumables\n1.2\nSpare parts\n1.3\nTools\n1.4\nEquipment\n\n1.5\nEngine documentations,\ne.g. manuals, history\ncard\n4. Safety practices\nMay include:\n4.1\nIsolation of genset\n4.2\nProper tagging\n5. Systematic and logical\nmethod of isolation and\ntesting\nMay include:\n5.1\nIsolation and elimination by system\n5.2\nIsolation and elimination based on data gathered\n6. Testing\n\nMay include but not limited to:\n6.1\nPressure test and leak\ntest\n6.2\nNDT – surface method\ntesting\n6.3\nRadial and axial test\n\n6.4\nTemperature\nmeasurement\n6.5\nDimensional\nmeasurement\n6.6\nChemical test\n7. Data gathered\nMay include but not limited to:\n7.1\nResults of visual, hearing and smell inspection\n7.2\nBased on measurement conducted\n7.3\nInformation indicated by annunciator\n7.4\nInitial report\n8. Workplace property\nMay include but not limited to:\n8.1\nTools\n8.2\nEquipment\n8.3\nFacilities\n9. Pre-testing activities\nThis may include:\n9.1\npreparation of:\n9.1.1\ndc system\n9.1.2\ncooling system\n9.1.3\nlube oil system\n9.1.4\nfuel system\n9.1.5\naspiration (intake and exhaust) system\n9.1.6\nspeed regulating system\n9.2\nProtection simulation testing\n10. Monitoring\nMonitoring may include:\n10.1 Temperature and pressure monitoring\n10.2 Excessive vibration and unusual sound monitoring\n10.3 Leakage detection\n10.4 Exhaust gas monitoring\n\n--- PDF PAGE 45 ---\nTR-Diesel Power Plant Maintenance NC III\n- 41 -\nEVIDENCE GUIDE\n\n1\nCritical Aspect of\nCompetency\nAssessment requires that the candidate:\n1.1 Determined and located the defects\n1.2 Assessed the cause of defect\n1.3 Repaired and carried out test run and monitoring\n1.4 Documented the repair activities\n2\nUnderpinning\nKnowledge\n2.1\nInterpreting manufacturer’s manual and preparation of reports\n2.2\nDiesel engine operations\n2.3\nParts and sub-assemblies of diesel engine\n2.4\nSpecifications of diesel engine and components\n2.5\nSafety and environmental procedures related to servicing of\ndiesel engine\n3\nUnderpinning Skills 3.1\nHandling of tools and test equipments\n3.2\nTaking component measurements\n3.3\nAnalysis of acquired data\n3.4\nPerforming various diesel engine testing\n3.5\nCommunication skills\n4\nResource\nImplications\n4.1\nMechanical hand tools\n4.2\nMechanical test equipments\n4.3\nCleaning and other consumable materials\n4.4\nPPE\n4.5\nDiesel Engine 15kw to 750kw\n5\nMethod of\nAssessment\n5.1\nWritten\n5.2\nDirect observation with oral questioning\n5.3\nThird party report\n5.4\nPortfolio\n5.5\nInterview\n5.6\nDemonstration with oral questioning\n6\nContext of\nAssessment\n6.1\nCompetency may be assess on the job or simulated\nenvironment\n6.2\nThe assessment of practical skills may take place after a\nperiod of supervised practice and repetitive experience\n\n--- PDF PAGE 46 ---\nTR-Diesel Power Plant Maintenance NC III\n- 42 -\nUNIT OF COMPETENCY : SERVICE ALTERNATOR/GENERATOR\nUNIT CODE\n\n: UTL723211\nUNIT DESCRIPTOR: The unit identifies the competence required to disassemble, inspect,\nevaluate and determine preferred repair action for alternator/generator.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Disassemble\nalternator/generator\n1.1.\nMain circuit breaker is locked open and tagged-out as\nper enterprise policy.\n1.2.\nTerminals are disconnected and properly marked without\ndamaging other components.\n1.3.\nAlternator is decoupled without damaging other\ncomponents\n1.4.\nBaseline data are taken using prescribed methods.\n1.5.\nComponents are cleaned and freed of dust, grease and\nother foreign materials in preparation for the inspection\nand testing.\n1.6.\nAll disassembling and cleaning activities are carried out\naccording to manufacturers recommendations and\noccupational health and safety procedures\n1.7.\nService report is prepared in accordance with enterprise\npolicy.\n\n2. Assess and repair\nalternator\ncomponents\n2.1.\nComponents are tested and assessed using prescribed\nmethods and without causing damage to any component.\n2.2.\nRepair / replacement requirements are identified and\nreported according to enterprise policy and procedure.\n2.3.\nRequired component repair or replacements are carried\nout in accordance with manufacturer’s recommendations\nand specification.\n2.4.\nRepaired or replaced component’s data are recorded in\naccordance with enterprise policy.\n\n3. Re-assemble and re-\nterminate alternators\n3.1.\nAlternator are assembled following manufacturers\nmanual and without damage to the components or\nworkplace property\n3.2.\nAlternator is coupled to the engine according to\nmanufacturer’s instruction.\n3.3.\nAlignment of the alternator to the diesel engine is\nperformed following manufacturer’s instruction.\n\n4. Carry-out test\nprocedure\n\n3.5\nTesting methods are carried out in accordance with\nmanufacturer’s manual and without causing damage to\ncomponents or workplace property.\n3.6\nFaults in alternator operation are remedied following\nmanufacturer’s manual.\n3.7\nService report is finalized according enterprise policy.\n\n--- PDF PAGE 47 ---\nTR-Diesel Power Plant Maintenance NC III\n- 43 -\nRANGE OF VARIABLES\n1 Baseline data\n1.1\nExciter air gap\n1.2\nBolts torque loading\n1.3\nParts dimensions\n1.4\nResistance\n1.5\nInsulation Resistance\n\n2 Components\nMay include but not limited to :\n2.1\nMain stator assembly\n2.2\nMain rotor and exciter rotor assembly\n2.3\nExciter stator assembly\n2.4\nRevolving diode\n2.5\nCompounding Transformer\n2.6\nAutomatic Voltage Regulator\n2.7\nBridge rectifier\n2.8\nCurrent Transformer\n2.9\nPotential Transformer\n\n3 Prescribed method\n3.1\nInsulation test\n3.2\nContinuity test\n3.3\nResistance test\n3.4\nOcular inspection\n4 Component repair\n4.1\nRe-insulation and baking\n4.2\nRe-connection of components\n5 Workplace property\nMay include the following:\n5.1\nTools\n5.2\nEquipment\n5.3\nFacilities\n5.4\nDiesel generating set\n\n6 Testing Methods\nTesting methods may include:\n6.1\nVoltage regulation\n6.2\nPhase sequence\n6.3\nFrequency\n6.4\nLoad acceptance\n\n--- PDF PAGE 48 ---\nTR-Diesel Power Plant Maintenance NC III\n- 44 -\nEVIDENCE GUIDE\n1 Critical Aspect of\nCompetency\nAssessment requires that the candidate:\n1.1\nDisassembled and assembled alternator\n1.2\nAssessed alternator components\n1.3\nCarried out test procedures and repairs\n1.4\nPrepared service reports\n\n2 Underpinning\nKnowledge\n2.1\nInterpreting manufacturer’s manual and preparation of\nreports\n2.2\nAlternator operations\n2.3\nParts of alternator\n2.4\nSpecifications of alternator and components\n2.5\nSafety and environmental procedures related to servicing\nof alternator\n\n3 Underpinning Skills\n3.1\nHandling of tools and test equipments\n3.2\nTaking component measurements\n3.3\nAnalysis of acquired data\n3.4\nPerforming various electrical testing\n3.5\nCommunication skills\n\n4 Resource Implications 4.1\nMechanical and electrical hand tools\n4.2\nElectrical test equipments\n4.3\nCleaning and insulating materials\n4.4\nPPE\n4.5\nDiesel Generating set 15kw to 750kw\n\n5 Method of\nAssessment\n5.1\nWritten\n5.2\nDirect observation with oral questioning\n5.3\nThird party report\n5.4\nPortfolio\n5.5\nInterview\n5.6\nDemonstration with oral questioning\n\n6 Context of\nAssessment\n6.1\nCompetency may be assess on the job or simulated\nenvironment\n6.2\nThe assessment of practical skills may take place after a\nperiod of supervised practice and repetitive experience\n\n--- PDF PAGE 49 ---\nTR-Diesel Power Plant Maintenance NC III\n- 45 -\nUNIT OF COMPETENCY : DIAGNOSE AND REPAIR ELECTRICAL SYSTEM\nUNIT CODE\n\n: UTL723212\nUNIT DESCRIPTOR: The unit identifies the competence required to troubleshoot and repair\nelectrical system.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Plan and prepare for\ntroubleshooting and\nrepair\n1.1. Work requirements are identified from relevant\npersonnel and documentation.\n1.2. Service prerequisites are carried out in accordance with\nenterprise policy.\n1.3. Required resources are identified and prepared based\non enterprise policy and on-site validation report.\n1.4. 5s and safety practices are implemented in accordance\nwith the enterprise policy\n\n2. Perform\ntroubleshooting and\nrepair\n2.1. Electrical system defects or defective components are\nidentified through systematic and logical method of\nisolation and testing without causing damage to the\nelectrical system and other workplace property.\n2.2. Root cause analysis is performed using data gathered\nand without causing damage to electrical components and\nother workplace property.\n2.3. Repair or replacement of defective components are\ncarried out in accordance with the result of\ntroubleshooting and root cause analysis and\nmanufacturers instruction.\n2.4. Repairs requiring outside services are identified and\nreported in accordance with enterprise policy.\n\n