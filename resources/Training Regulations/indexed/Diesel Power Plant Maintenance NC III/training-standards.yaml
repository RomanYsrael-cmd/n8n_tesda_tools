      "source_text": "SECTION 3 TRAINING STANDARDS\n\nThese standards are set to provide technical and vocational education and training (TVET)\nproviders with information and other important requirements to consider when designing training\nprograms for Diesel Power Plant Maintenance NCIII.\n\n3.1 CURRICULUM DESIGN\n\nCourse Title: DIESEL POWER PLANT MAINTENANCE\nNC Level: NC III\n\nNominal Training Duration: 352 Hours\n\nCourse Description:\n\nThis course is designed to enhance the knowledge, skills and attitudes of a trainee/student\nin overhauling diesel engine, diagnosing and repairing diesel engine and electrical system of a\ndiesel power plant as well as servicing of alternator/generator.\n\nThis course also includes leading workplace communication, leading small teams, developing\nand practicing negotiation skills, solving workplace problem related to work activities, using\nmathematical concepts and techniques, and using relevant technologies. It also includes\nperforming mensuration and calculation, reading, interpreting and applying specifications and\nmanual, performing shop maintenance, performing basic bench work and performing basic\nelectrical works.\n\nBASIC COMPETENCIES\n(56 Hours)\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Lead\nworkplace\ncommunication\n1.1 Communicate information about\nworkplace processes.\n1.2 Lead workplace discussions.\n1.3 Identify and communicate issues\narising in the workplace\n• Group\ndiscussion\n• Role Play\n• Brainstorming\n\n• Observation\n• Interviews\n2. Lead small\nteams\n2.1 Provide team leadership.\n2.2 Assign responsibilities among\nmembers.\n2.3 Set performance expectation for\nteam members.\n\n2.4 Supervise team performance\n• Lecture\n• Demonstration\n• Self-paced\n(modular)\n• Demonstration\n• Case studies\n3. Develop and\npractice\nnegotiation\nskills\n3.1 Identify relevant information in\nplanning negotiations\n3.2 Participate in negotiations\n3.3 Document areas for agreement\n• Direct\nobservation\n• Simulation/role\nplaying\n• Case studies\n• Written test\n• Practical/\nperformance\ntest\n4. Solve\nworkplace\nproblem related\nto work\nactivities\n4.1 Explain the analytical\ntechniques.\n4.2 Identify the problem.\n4.3 Determine the possible cause/s\nof the problem.\n• Direct\nobservation\n• Simulation/role\nplaying\n• Case studies\n• Written test\n• Practical/\nperformance\ntest\n\n--- PDF PAGE 53 ---\nTR-Diesel Power Plant Maintenance NC III\n- 49 -\n5. Use\nmathematical\nconcepts and\ntechniques\n5.1 Identify mathematical tools and\ntechniques to solve problem\n5.2 Apply mathematical\nprocedures/solution\n5.3 Analyze results\n• Direct\nobservation\n• Simulation/role\nplaying\n• Case studies\n• Written test\n• Practical/\nperformance\ntest\n6. Use relevant\ntechnologies\n1.1 Identify appropriate technology\n1.2 Apply relevant technology\n1.3 Maintain/enhance relevant\ntechnology\n• Direct\nobservation\n• Simulation/role\nplaying\n• Case studies\n• Written test\n• Practical/\nperformance\ntest\n\nCOMMON COMPETENCIES\n(80 Hours)\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Perform\nmensuration\nand calculation\n1.1 Select measuring instrument\nand carry out measurement\nand calculations\n1.2 Carry out measurement and\ncalculation\n1.3 Maintain measuring\ninstruments\n• Lecture\n• Discussion\n• Demonstration\n\n• Written test\n• Oral\nquestioning\n• Direct\nobservation\n• Interview\n2. Read, interpret\nand apply\nspecifications\nand manual\n2.1 Identify/access manuals and\ninterpret data and specification\n2.2 Apply information accessed in\nmanual\n2.3 Store manual\n• Lecture\n• Discussion\n• Demonstration\n\n• Written test\n• Oral\nquestioning\n• Direct\nobservation\n• Interview\n3. Perform shop\nmaintenance\n3.1 Inspect/clean tools and work\narea\n3.2 Store/arrange tools and shop\nequipment\n3.3 Dispose waste/used lubricants\n3.4 Report damaged\ntools/equipment\n• Lecture\n• Discussion\n• Demonstration\n\n• Written test\n• Oral\nquestioning\n• Direct\nobservation\n• Interview\n4. Perform basic\nbench work\n4.1.\nPrepare supplies, materials,\ntools, and equipment\n4.2.\nLayout necessary\ndimensions\n4.3.\nPerform grinding, cutting,\nfiling, drilling and boring\n\n• Lecture\n• Discussion\n• Demonstration\n\n• Interview\n• Demonstration\n• Direct\nObservation\n5. Perform basic\nelectrical works\n5.1.\nTest power supply and\nelectrical components\n5.2.\nPerform basic repairs and\ninstallation\n\n• Lecture\n• Discussion\n• Demonstration\n\n• Written test\n• Oral\nquestioning\n• Direct\nobservation\n• Interview\n\n--- PDF PAGE 54 ---\nTR-Diesel Power Plant Maintenance NC III\n- 50 -\n\nCORE COMPETENCIES\n(216 Hours)\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Overhaul diesel\nengine\n\n1.1.\nDisassemble the engine\nTend diesel engine\n1.2.\nAssess and repair engine\nBlock, parts and sub-\nassembly\n1.3.\nRe-assemble engine\n1.4.\nTest run the engine\n\n• Discussion\n• Demonstration\n• Practical\napplication\n\n• Written test\n• Demonstration\nof practical\nskills\n• Interview\n2. Diagnose and\nrepair diesel\nengine\n\n3.1\nPlan and prepare for\ntroubleshooting and repair\n3.2\nPerform troubleshooting and\nrepair\n• Discussion\n• Demonstration\n• Practical\napplication\n• Written test\n• Demonstration\nof practical\nskills\n• Interview\n3. Service\nAlternator/\nGenerator\n\n3.1 Perform dismantling of\nalternator/generator\n3.2 Assess and repair\nalternator/generator\ncomponents\n3.3 Reassemble and test\nalternator/generator\n\n• Lecture/\nDiscussion\n• Demonstration\n• Practical\napplication\n• Practicum\n\n• Written\nexamination\n• Demonstration\nof practical\nskills\n• Interview\n4. Diagnose and\nrepair electrical\nsystem\n\n4.1\nPlan and prepare for\ntroubleshooting and repair\n4.2\nPerform trouble shooting\nand repair of\nalternator/generator\n4.3\nPerform troubleshooting and\nrepair of control and\nprotection system\n• Discussion\n• Demonstration\n• Practical\napplication\n\n• Written test\n• Demonstration\nof practical\nskills\n• Interview\n\n--- PDF PAGE 55 ---\nTR-Diesel Power Plant Maintenance NC III\n- 51 -\n\n2.1 TRAINING DELIVERY\n\nThe delivery of training should adhere to the design of the curriculum. Delivery should\nbe guided by the 10 basic principles of competency-based TVET.\n\n•\nThe training is based on curriculum developed from the competency standards;\n•\nLearning is modular in its structure;\n•\nTraining delivery is individualized and self-paced;\n•\nTraining is based on work that must be performed;\n•\nTraining materials are directly related to the competency standards and the curriculum\nmodules;\n•\nAssessment is based in the collection of evidence of the performance of work to the\nindustry required standard;\n•\nTraining is based both on and off-the-job components;\n•\nAllows for recognition of prior learning (RPL) or current competencies;\n•\nTraining allows for multiple entry and exit; and\n•\nApproved training programs are nationally accredited.\n\nThe competency-based TVET system recognizes various types of delivery modes,\nboth on and off-the-job as long as the learning is driven by the competency standards\nspecified by the industry. The following training modalities may be adopted when designing\ntraining programs:\n\n•\nThe dualized mode of training delivery is preferred and recommended. Thus programs\nwould contain both in-school and in-industry training or fieldwork components. Details\ncan be referred to the Practical application System (DTS) Implementing Rules and\nRegulations.\n•\nModular/self-paced learning is a competency-based training modality wherein the\ntrainee is allowed to progress at his own pace. The trainer facilitates the training\ndelivery\n•\nPeer teaching/mentoring is a training modality wherein fast learners are given the\nopportunity to assist the slow learners.\n•\nSupervised industry training or on-the-job training is an approach in training designed\nto enhance the knowledge and skills of the trainee through actual experience in the\nworkplace to acquire specific competencies prescribed in the training regulations.\n•\nDistance learning is a formal education process in which majority of the instruction\noccurs when the students and instructor are not in the same place. Distance learning\nmay employ correspondence study, or audio, video or computer technologies.\n\n--- PDF PAGE 56 ---\nTR-Diesel Power Plant Maintenance NC III\n- 52 -\n\n2.2 TRAINEE ENTRY REQUIREMENTS\n\nTrainees or students should possess the following requirements:\n\n•\ncan communicate both oral and written;\n•\nwith good moral character; and\n•\ncan perform basic mathematical computation.\n•\nmust have completed training in all the units of competency in Diesel Power Plant\nOperation and Maintenance NC II\n\nThis list does not include specific institutional requirements such as educational\nattainment, appropriate work experience, and others that may be required of the trainees by\nthe school or training center delivering the TVET program.\n\n3.4 LIST OF TOOLS, EQUIPMENT AND MATERIALS\n\nDIESEL POWER PLANT OPERATION AND MAINTENANCE – NC III\n\nRecommended list of tools, equipment and materials for the training in Diesel Power\nPlant Maintenance – NC III\n\nTOOLS\nEQUIPMENT\nMATERIALS\nQTY\n\nQTY\n\nQTY\n\n1 set A frame\n1\nunit\nGenerating set with\ncontrol panel, 160 KW\n40\npcs\nAssorted abrasive\npaper\n1 set Allen wrench\n1 set PPE\n2 m\nAutomotive wire #14\n1 unt Bearing heater\n1 set Dummy load\n2 m\nAutomotive wire #18\n1 unt Bearing Puller\n2 set Hydraulic jack 10 tons\n10 m\nAutomotive wire, no.\n12 AWG\n1 unt Bench vise\n1 set Air compressor with\nspray gun\n1 pc\nBearing\n1 pc\nCaliper 150 mm\n1 unt AC Clamp ammeter\n9 pcs\nBrush 2”, 3”, 4”\n1 set Combination wrench\n(8-32)\n1 set Insulation tester\n2 box\nCable ties Assorted\n1 set Crimping tool\n1 set Multi tester\n1 pail\nCarbon remover\n1 set Electric hand drill with\nbits\n2\nunits\nChain Block at least 3\ntons\n3 can\nContact cleaner 16oz\n1 unt Empty drum 210 L\n10\nunits\nPersonal Computer\n40\nltrs\nCoolant\n2 set Eye bolts and shackles\n\n3 roll\nCotton tapes\n1 set Feeler gauge\n\n1 gal\nDegreaser\n1 unt Flashlight\n\n1 pail\nDescaler\n1 unt Grinder\n\n124 L\nDiesel fuel\n1 set Hacksaw\n\n4 set\nDye penetrant and\ndeveloper\n2 set Heater\n\n8 ltr\nElectrical enamel\n1 unt Magnetic dial gauge\n\n1 roll\nFoam\n1 set Mechanical tools (i.e.\nwrenches, pliers, screw\ndrivers, etc.)\n\n16\nrolls\nElectrical tapes\n1 set micrometer 150mm\n(inside and outside)\n\n6\nsheet\nGasket\n\n--- PDF PAGE 57 ---\nTR-Diesel Power Plant Maintenance NC III\n- 53 -\n\nTOOLS\nEQUIPMENT\nMATERIALS\n\n1 set micrometer 150mm\n(inside and outside)\n\n4\npack\nGrease and\ndegreasers\n1\nunit\nNozzle tester\n\n3 set\nGrinding compound\n(fine and coarse)\n1 pc\nPanelboard key\n\n15 pc\nGrinding sticks\n1 set Pliers and screw driver\n\n2 kg\nHi temp grease\n1 unt Pressure washer\n\n20 ltr\nInsulating varnish\n4\nsets\nSling and shackles for\n5 tons\n\n1 set\nLog sheet/ Log book\nand writing tools\n1 set Socket wrench (8-32)\n\n1 set\nForms and writing\nmaterials\n2 set Soldering set\n\n124 L\nLube oil\n1\nunit\nTorque wrench 0-\n1000N·m\n\n1 set\nManuals, Drawings\nand Diagrams\n1\nunit\nTorque wrench 50-\n300N·m\n\n1 pc\nMetal marker\n2 set Wooden blocks\n\n2 m\nNylon Rope or sling\n\n1 kit\nO-rings\n\n3 can\nPenetrating oil\n\n1set\nPlastic gauge\n\n40 kg\nRags\n\n1 lot\nReplacement\ncomponents[Tdd1]\n(assorted)\n\n10\nroll\nRubber tapes\n\n1 pail\nRust converter\n\n20 ltr\nSafety Solvent\n\n2 pc\nScrubbing pad\n\n5 pc\nSilicon gasket maker\n\n1 roll\nSoldering lead\n\n5 m\nSpaghetti tube, 10 mm\n\n5 pc\nSteel brush\n\n1 set\nSystem diagrams and\nservice manuals\n\n2 box\nTerminal lugs assorted\n\n20 pc\nTerminal lugs, ½” dia,\n\n2\ntubes\nThread sealant\n\n1 set\nRepair kits for\n\n- Turbo charger\n\n- Water pump\n\n- Primary fuel filter\n\n1 kit\nWire marker\n\n1 set\nWiring diagrams and\nservice manuals\n\n1 lot\nBrochures/Catalogs\n\n1 lot\nReference materials\n\n--- PDF PAGE 58 ---\nTR-Diesel Power Plant Maintenance NC III\n- 54 -\n\n3.5 TRAINING FACILITIES\nDIESEL POWER PLANT OPERATION AND MAINTENANCE – NC III\n\nThe workshop must be made of reinforced concrete or steel structure. The size must\nbe suited on the requirements of the competencies. The facility should accommodate a\nmaximum of 20 students/trainees.\n\nSPACE REQUIREMENT\nSIZE IN METERS\nAREA IN SQ.\nMETERS\nTOTAL AREA IN\nSQ. METERS\nWorkshop Component Areas\n• Laboratory/Workshop Area\n-\n-\n100.00\n• Lecture Room\n6.00 x 5.00\n30.00\n30.00\n• Tool, Supply & Storage Room\n4.00 X 5.00\n20.00\n20.00\n• Learning Resource Center\n4.00 x 5.00\n20.00\n20.00\n• Wash Room and Toilet\n2.00 X 5.00\n10.00\n10.00\nTotal (Workshop Component)\n180.00\n1. Circulation Area (30% of Workshop Component Space)\n54.00\n Grand Total (Building Space)\n234.00\nNote: The entries in the size in meters column are recommendations only. The grand total (building space) is\nthe minimum space requirement for registration.\n\n3.6 TRAINERS’ QUALIFICATION\nUTILITIES SECTOR\n\nDIESEL POWER PLANT MAINTENANCE – NC III\nTRAINER QUALIFICATION (TQ III)\n• Must be a holder of Diesel Power Plant Maintenance NC III or it’s equivalent\n• Must have undergone training on Training Methodology III (TM III)\n• Must be computer literate\n• Must be physically and mentally fit\n• *Must have at least 2 years job/industry experience related to Diesel Power Plant\nOperation and Maintenance specifically in generating set servicing\n• • Must be a civil service eligible (for government position or appropriate professional\nlicense issued by the Professional Regulatory Commission)\n\n*\nOptional. Only when required by the hiring institution.\n\nReference: TESDA Board Resolution No. 2004 03\n\n3.7 INSTITUTIONAL ASSESSMENT\n\n Institutional assessment is undertaken by trainees to determine their achievement of\nunits of competency. A certificate of achievement is issued for each unit of competency.\n\n--- PDF PAGE 59 ---\nTR-Diesel Power Plant Maintenance NC III\n- 55 -"
