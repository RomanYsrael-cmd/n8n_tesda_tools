ilter\n\n1 kit\nWire marker\n\n1 set\nWiring diagrams and\nservice manuals\n\n1 lot\nBrochures/Catalogs\n\n1 lot\nReference materials\n\n--- PDF PAGE 58 ---\nTR-Diesel Power Plant Maintenance NC III\n- 54 -\n\n3.5 TRAINING FACILITIES\nDIESEL POWER PLANT OPERATION AND MAINTENANCE – NC III\n\nThe workshop must be made of reinforced concrete or steel structure. The size must\nbe suited on the requirements of the competencies. The facility should accommodate a\nmaximum of 20 students/trainees.\n\nSPACE REQUIREMENT\nSIZE IN METERS\nAREA IN SQ.\nMETERS\nTOTAL AREA IN\nSQ. METERS\nWorkshop Component Areas\n• Laboratory/Workshop Area\n-\n-\n100.00\n• Lecture Room\n6.00 x 5.00\n30.00\n30.00\n• Tool, Supply & Storage Room\n4.00 X 5.00\n20.00\n20.00\n• Learning Resource Center\n4.00 x 5.00\n20.00\n20.00\n• Wash Room and Toilet\n2.00 X 5.00\n10.00\n10.00\nTotal (Workshop Component)\n180.00\n1. Circulation Area (30% of Workshop Component Space)\n54.00\n Grand Total (Building Space)\n234.00\nNote: The entries in the size in meters column are recommendations only. The grand total (building space) is\nthe minimum space requirement for registration.\n\n3.6 TRAINERS’ QUALIFICATION\nUTILITIES SECTOR\n\nDIESEL POWER PLANT MAINTENANCE – NC III\nTRAINER QUALIFICATION (TQ III)\n• Must be a holder of Diesel Power Plant Maintenance NC III or it’s equivalent\n• Must have undergone training on Training Methodology III (TM III)\n• Must be computer literate\n• Must be physically and mentally fit\n• *Must have at least 2 years job/industry experience related to Diesel Power Plant\nOperation and Maintenance specifically in generating set servicing\n• • Must be a civil service eligible (for government position or appropriate professional\nlicense issued by the Professional Regulatory Commission)\n\n*\nOptional. Only when required by the hiring institution.\n\nReference: TESDA Board Resolution No. 2004 03\n\n3.7 INSTITUTIONAL ASSESSMENT\n\n Institutional assessment is undertaken by trainees to determine their achievement of\nunits of competency. A certificate of achievement is issued for each unit of competency.\n\n--- PDF PAGE 59 ---\nTR-Diesel Power Plant Maintenance NC III\n- 55 -"
