iscussion\n• Demonstration\n• Practical\napplication\n\n• Written test\n• Demonstration\nof practical\nskills\n• Interview\n\n--- PDF PAGE 55 ---\nTR-Diesel Power Plant Maintenance NC III\n- 51 -\n\n2.1 TRAINING DELIVERY\n\nThe delivery of training should adhere to the design of the curriculum. Delivery should\nbe guided by the 10 basic principles of competency-based TVET.\n\n•\nThe training is based on curriculum developed from the competency standards;\n•\nLearning is modular in its structure;\n•\nTraining delivery is individualized and self-paced;\n•\nTraining is based on work that must be performed;\n•\nTraining materials are directly related to the competency standards and the curriculum\nmodules;\n•\nAssessment is based in the collection of evidence of the performance of work to the\nindustry required standard;\n•\nTraining is based both on and off-the-job components;\n•\nAllows for recognition of prior learning (RPL) or current competencies;\n•\nTraining allows for multiple entry and exit; and\n•\nApproved training programs are nationally accredited.\n\nThe competency-based TVET system recognizes various types of delivery modes,\nboth on and off-the-job as long as the learning is driven by the competency standards\nspecified by the industry. The following training modalities may be adopted when designing\ntraining programs:\n\n•\nThe dualized mode of training delivery is preferred and recommended. Thus programs\nwould contain both in-school and in-industry training or fieldwork components. Details\ncan be referred to the Practical application System (DTS) Implementing Rules and\nRegulations.\n•\nModular/self-paced learning is a competency-based training modality wherein the\ntrainee is allowed to progress at his own pace. The trainer facilitates the training\ndelivery\n•\nPeer teaching/mentoring is a training modality wherein fast learners are given the\nopportunity to assist the slow learners.\n•\nSupervised industry training or on-the-job training is an approach in training designed\nto enhance the knowledge and skills of the trainee through actual experience in the\nworkplace to acquire specific competencies prescribed in the training regulations.\n•\nDistance learning is a formal education process in which majority of the instruction\noccurs when the students and instructor are not in the same place. Distance learning\nmay employ correspondence study, or audio, video or computer technologies.\n\n--- PDF PAGE 56 ---\nTR-Diesel Power Plant Maintenance NC III\n- 52 -\n\n2.2 TRAINEE ENTRY REQUIREMENTS\n\nTrainees or students should possess the following requirements:\n\n•\ncan communicate both oral and written;\n•\nwith good moral character; and\n•\ncan perform basic mathematical computation.\n•\nmust have completed training in all the units of competency in Diesel Power Plant\nOperation and Maintenance NC II\n\nThis list does not include specific institutional requirements such as educational\nattainment, appropriate work experience, and others that may be required of the trainees by\nthe school or training center delivering the TVET program.\n\n3.4 LIST OF TOOLS, EQUIPMENT AND MATERIALS\n\nDIESEL POWER PLANT OPERATION AND MAINTENANCE – NC III\n\nRecommended list of tools, equipment and materials for the training in Diesel Power\nPlant Maintenance – NC III\n\nTOOLS\nEQUIPMENT\nMATERIALS\nQTY\n\nQTY\n\nQTY\n\n1 set A frame\n1\nunit\nGenerating set with\ncontrol panel, 160 KW\n40\npcs\nAssorted abrasive\npaper\n1 set Allen wrench\n1 set PPE\n2 m\nAutomotive wire #14\n1 unt Bearing heater\n1 set Dummy load\n2 m\nAutomotive wire #18\n1 unt Bearing Puller\n2 set Hydraulic jack 10 tons\n10 m\nAutomotive wire, no.\n12 AWG\n1 unt Bench vise\n1 set Air compressor with\nspray gun\n1 pc\nBearing\n1 pc\nCaliper 150 mm\n1 unt AC Clamp ammeter\n9 pcs\nBrush 2”, 3”, 4”\n1 set Combination wrench\n(8-32)\n1 set Insulation tester\n2 box\nCable ties Assorted\n1 set Crimping tool\n1 set Multi tester\n1 pail\nCarbon remover\n1 set Electric