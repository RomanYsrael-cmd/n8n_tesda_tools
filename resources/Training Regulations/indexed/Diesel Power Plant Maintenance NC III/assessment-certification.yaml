  "source_text": "SECTION 4 NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1 To attain the National Qualification of Diesel Power Plant Maintenance NC III, the candidate\nmust demonstrate competence through project-type assessment covering all the units of\ncompetency listed in Section 1. Successful candidates shall be awarded a National\nCertificate signed by the TESDA Director General.\n\n4.2 Individual: aspiring to be awarded the qualification of Diesel Power Plant Maintenance NC\nIII must acquire Certificates of Competency in all the following core units of the\nQualification. Candidates may apply for assessment in any accredited assessment center.\n\n4.2.1.1 Overhaul Diesel Engine\n4.2.1.2 Diagnose and Repair Diesel Engine\n4.2.1.3 Service alternator\n4.2.1.4 Diagnose and Repair Electrical System\n\nSuccessful candidates shall be awarded Certificates of Competency (COC).\n\n4.3 Accumulation and submission of all COCs acquired for the relevant units of competency\ncomprising a qualification, an individual shall be issued the corresponding National\nCertificate.\n\n4.4 Assessment shall focus on the core units of competency. The basic and common units\nshall be integrated or assessed concurrently with the core units.\n\n4.5 The following are qualified to apply for assessment and certification:\n\n4.5.1 Graduates of formal, non-formal and informal including enterprise-based training\nprograms.\n\n4.5.2 Experienced workers (wage employed or self employed)\n\n4.6 The guidelines on assessment and certification are discussed in detail in the “Procedures\nManual on Assessment and Certification” and “Guidelines on the Implementation of the\nPhilippine TVET Qualification and Certification System (PTOQCS)”.\n\n--- PDF PAGE 60 ---\nTR-Diesel Power Plant Maintenance NC III\n- 56 -\n\n"
}
