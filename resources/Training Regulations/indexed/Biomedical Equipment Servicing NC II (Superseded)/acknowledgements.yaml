    {
      "source_text": "COMPETENCY MAP – HEALTH SECTOR (BIOMEDICAL EQUIPMENT SERVICING NC II) BASIC COMPETENCIES"
    },
    {
      "source_text": "Receive and respond to workplace communication Work with others Demonstrate work values Participate in workplace communication Work in a team environment Practice career professionalism Practice occupational health and safety procedures Practice housekeeping procedures (5S) Lead workplace communication Lead small team Develop and practice negotiation skills Solve problems related to work activities Use mathematical concepts and techniques Use relevant technologies Utilize specialized communication skills Develop team and individual Apply problem solving techniques in the workplace Collect, analyze and organize information Plan and organize work Promote environmental protection"
    },
    {
      "source_text": "COMMON COMPETENCIES"
    },
    {
      "source_text": "Implement and monitor infection control policies and procedures Respond effectively to difficult/challenging behavior Apply basic first aid Maintain high standard of patient services"
    },
    {
      "source_text": "CORE COMPETENCIES"
    },
    {
      "source_text": "Provide care and support to infants and toddlers Provide care and support to children Foster social, intellectual, creative and emotional development of children Foster the physical development of children Provide care and support to elderly Provide care and support to people with special needs Maintain a healthy and safe environment Respond to emergency Clean living room, dining room, bedrooms, toilet and bathroom Wash and iron clothes, linen and fabric Prepare hot and cold meals/food Prepare and maintain beds Collect and maintain linen stocks at end- users location Assist in patient mobility Assist in transporting patients Assist in bio-psychosocial support care of patients Handle waste in a health care environment Install biomedical equipment Perform corrective maintenance on biomedical equipment Perform preventive maintenance on biomedical equipment Repair biomedical equipment Assess and refer biomedical equipment Perform basic life support Maintain life support equipment and resources Implement safe access and extrication procedures in an emergency Manage request for an ambulance service Allocate ambulance service resources Coordinate emergency resources Deliver basic ambulance communication skills Supervise on-road operations Manage the scene of an emergency Manage the scene of a special event Manage routine scene Deliver pre-hospital patient care Deliver intensive pre- hospital patient care Manage ambulance operations Transport emergency patients Transport non- emergency patients Drive vehicles under operational conditions Work within a holistic therapeutic massage framework Perform therapeutic massage assessment Plan the therapeutic massage treatment Implement therapeutic massage treatment Perform remedial therapeutic massage treatment Work within a community development framework Prepare for work in the community service industry Support community resources Provide primary/residential care Support community participation Recruit and coordinate volunteers Respond holistically to client issues Develop and provide health education program in the community Implement health promotion and community interventions"
    },
