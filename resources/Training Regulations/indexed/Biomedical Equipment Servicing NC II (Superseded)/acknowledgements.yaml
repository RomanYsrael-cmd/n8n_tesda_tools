    {
      "source_text": "UNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes necessary to repair biomedical equipment related to patient care."
    },
    {
      "source_text": "ELEMENTS PERFORMANCE CRITERIA Italicized terms are elaborated in the Range of Variables 1. Inspect equipment for repair 1.1 Identify equipment for repair in accordance to institutional rules and regulations. 1.2 Sort and classify equipment for repair. 1.3 Prioritize equipment for repair. 2 Plan and prepare for repair 2.1 Repair is planned and prepared in line with job requirements. 2.2 OSH policies and procedures are followed in line with job requirements. 2.3 Equipment is checked against specification and requirements. 2.4 Materials and supplies necessary to complete the work are obtained in accordance with established procedures and checked against job requirements. 2.5 Tools, equipment and testing devices needed to carry out the work are obtained in accordance with established procedures and checked for correct operation and safety. 3. Repair equipment 3.1 Appropriate personal protective equipment is used and OSH policies and procedures are followed. 3.2 Normal function of equipment is checked in accordance with manufacturer’s instructions. 3.3 Fault or problem in the equipment is diagnosed in line with the standard operating procedures. 3.4 Determine most cost-effective repair solution in accordance with institution’s requirements. 3.5 Equipment is repaired or replaced in line with the standard operating procedures. 4 Inspect the test equipment 4.1 Final inspections are undertaken to ensure that the testing conducted on the equipment and circuits conforms with the manufacturer’s instruction/manual. 4.2 Equipment is checked to ensure safe operation. 4.3 Unplanned events or conditions are responded to in accordance with established procedures. 4.4 Work site is cleaned and cleared of all debris and left in a safe condition in accordance with established procedures. 4.5 Report is prepared/completed according to company requirements. 4.6 Endorse equipment to appropriate end user according to institution’s requirements."
