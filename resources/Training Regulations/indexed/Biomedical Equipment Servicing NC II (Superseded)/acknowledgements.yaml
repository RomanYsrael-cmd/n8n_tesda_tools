      "source_text": "DEFINITION OF TERMS"
    },
    {
      "source_text": "For the purpose of this standard, the word"
    },
    {
      "source_text": "Maintenance A combination of any action carried out to retain an item in, or restore it to an acceptable operation condition."
    },
    {
      "source_text": "Preventive Maintenance Maintained carried out a predetermined interval, or to other prescribed criteria, and intended to reduce the like hood of an item not meeting an acceptable condition."
    },
    {
      "source_text": "Corrective Maintenance Maintenance carried out to restore (including adjustment and repair) an item, which has ceased to meet an acceptable condition."
    },
    {
      "source_text": "Electro cardiograph (ECG) An instrument for recording the changes of electrical potential occurring during the heartbeat; used especially in diagnosing abnormalities of the heart action."
    },
    {
      "source_text": "Spectrophotometer A device for measuring the concentration of a substance in a solution using single beam of light that passes through the solution."
    },
    {
      "source_text": "Blood Pressure Apparatus An equipment use to measure arterial blood pressure in the lateral pressure of force exerted by blood on a unit area of the blood vessel wall."
    },
    {
      "source_text": "Weighing Scale A measuring instrument for determining the weight of an object: amount of mass in terms of kilogram (kg) or pounds (lbs)"
    },
    {
      "source_text": "Nebulizer A device used to turn liquid medicine into a fine spray, or nebulas, usually liquid form medicine for asthma; for quick nasal ingestion."
    },
    {
      "source_text": "Laryngoscope A flexible, lighted tube used to examine the larynx."
    },
    {
      "source_text": "Stethoscope A medical instrument for listening to the sounds generated inside the body which otherwise could not be heard by a human ear unaided."
    },
    {
      "source_text": "Sterilizer A device for heating substances above their boiling point. Use to manufacture chemicals of to sterilized surgical instrument."
    },
    {
      "source_text": "Water bath A device for regulating the temperature of anything subjected to heat, by surrounding the vessel containing it with another vessel containing water that can be kept at a desired temperature."
    },
