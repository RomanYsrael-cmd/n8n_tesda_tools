    {
      "source_text": "UNIT OF COMPETENCY : RESPOND EFFECTIVELY TO DIFFICULT/ CHALLENGING BEHAVIOR UNIT CODE : HCS323202 UNIT DESCRIPTOR : This unit of competency covers the knowledge, skills and attitudes required to effectively respond to difficult or challenging behaviour of patients."
    },
    {
      "source_text": "ELEMENT PERFORMANCE CRITERIA Italicized terms are elaborated in the Range of Variables 1. Plan responses 1.1 Responses are planned to instances of difficult or challenging behavior to maximize the availability of other appropriate staff and resources. 1.2 Specific manifestations of difficult or challenging behavior are identified and strategies appropriate to these behaviors are planned as required. 1.3 Safety of self and others is given priority in responding to difficult or challenging behavior according to institutional policies and procedures. 2. Apply response 2.1 Difficult or challenging behavior is dealt with promptly, firmly and diplomatically in accordance with institutional policy and procedures. 2.2 Communication is used effectively to achieve the desired outcomes in responding to difficult or challenging behavior. 2.3 Appropriate strategies are selected to suit particular instances of difficult or challenging behavior. 3. Report and review incidents 3.1 Incidents are reported according to institutional policies and procedures. 3.2 Incidents are reviewed with appropriate staff and suggestions appropriate to area of responsibility are made. 3.3 Debriefing mechanisms and other activities are used and participated in. 3.4 Advice and assistance is sought from legitimate sources when appropriate."
    },
    {
      "source_text": "-- PDF PAGE 24 --- TR Biomedical Equipment Servicing NCII"
    },
