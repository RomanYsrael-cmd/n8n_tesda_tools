      "source_text": "UNIT OF COMPETENCY : APPLY BASIC FIRST AID UNIT CODE : HCS323203 UNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes required to provide an initial response where First Aid is required. In this unit it is assumed that the First Aider is working under supervision and / or according to established workplace First Aid procedures and policies"
    },
    {
      "source_text": "ELEMENT PERFORMANCE CRITERIA Italicized terms are elaborated in the Range of Variables 1. Assess the situation 1.1 Physical hazards to self and casualty’s health and safety are identified. 1.2 Immediate risks to self and casualty’s occupational health and safety (OSH )are minimized by controlling the hazard in accordance with OSH requirements. 1.3 Casualty’s vital signs and physical condition are assessed in accordance with workplace procedures. 2. Apply basic first aid techniques 2.1 First Aid management is provided in accordance with established First Aid procedures. 2.2 Casualty is reassured in a caring and calm manner and made comfortable using available resources. 2.3 First Aid assistance is sought from others in a timely manner and as appropriate. 2.4 Casualty’s condition is monitored and responded to in accordance with effective First Aid principles and workplace procedures. 2.5 Details of casualty’s physical condition, changes in conditions, management and response are accurately recorded in line with organizational procedures. 2.6 Casualty management is finalized according to his/her needs and First Aid principles. 3. Communicate details of the incident 3.1 Appropriate medical assistance is requested using relevant communication media and equipment. 3.2 Details of casualty’s condition and management activities are accurately conveyed to emergency services/relieving personnel. 3.3 Reports to supervisors are prepared in a timely manner, presenting all relevant facts according to established company procedures."
    },
