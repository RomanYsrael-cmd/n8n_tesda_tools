    {
      "source_text": "3.3 TRAINEE ENTRY REQUIREMENTS:"
    },
    {
      "source_text": "Trainees or students wishing to gain entry into these qualifications should possess the following requirements:"
    },
    {
      "source_text": " 16 years old and above  Must pass the trainability / aptitude test  Can communicate effectively both in oral and written form  Physically, emotionally and mentally fit  Can perform basic mathematical computation"
    },
    {
      "source_text": "This list does not include specific institutional requirements such as educational attainment, appropriate work experience, and others that may be required of the trainees by the school or training center delivering this TVET program."
    },
    {
