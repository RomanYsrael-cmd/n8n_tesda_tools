en designing training\nprograms for BIOMEDICAL EQUIPMENT SERVICING NCII.\n\nThis includes information on curriculum design, training delivery, trainee entry requirements,\ntools, materials and equipment, training facilities and trainers qualification and national\nassessment and certification arrangements.\n\n3.1 CURRICULUM DESIGN\n\nCourse Title: BIOMEDICAL EQUIPMENT SERVICING\nNC Level: NC II\n\nNominal Training Hours: 960 Hours\n\nCourse Description:\n\nThis course is designed to enhance the knowledge, skills and attitudes of BIOMEDICAL\nEQUIPMENT SERVICING in accordance with industry standards. It covers basic, common and\ncore competencies in NC II.\n\nBASIC COMPETENCIES\n\nUNIT OF\nCOMPETENCY\nLEARNING OUTCOMES\nMETHODOLOGY\nASSESSMENT\nAPPROACH\n1. Participate in\nworkplace\ncommunication\n1.1\nObtain and convey\nworkplace information.\n1.2\nComplete relevant work\nrelated documents.\n1.3\nParticipate in workplace\nmeeting and discussion.\n• Group\ndiscussion\n• Interaction\n\n• Demonstration\n Observation\n• Interviews/\n• Questioning\n2. Work in a team\nenvironment\n2.1\nDescribe and identify\nteam role and\nresponsibility in a team.\n2.2\nDescribe work as a\nteam member.\n• Discussion\n• Interaction\n• Demonstration\n• Observation\n• Interviews/\n• Questioning\n3. Practice career\nprofessionalism\n3.1\nIntegrate personal\nobjectives with\norganizational goals.\n3.2\nSet and meet work\npriorities.\n3.3\nMaintain professional\ngrowth and\ndevelopment.\n• Group\ndiscussion\n• Interaction\n\n• Demonstration\n Observation\n• Interviews/\n• Questioning\n4. Practice\noccupational health\nand safety\n4.1\nEvaluate hazard and\nrisks.\n4.2\nControl hazards and\nrisks.\n4.3\nMaintain occupational\nhealth and safety\nawareness.\n• Discussion\n• Plant Tour\n• Symposium\n• Observation\n• Interviews\n\n--- PDF PAGE 58 ---\nTR Biomedical Equipment Servicing NCII\n\n- 54 -\n\nCOMMON COMPETENCIES\n\nUNIT OF\nCOMPETENCY\nLEARNING OUTCOMES\nMETHODOLOGY\nASSESSMENT\nAPPROACH\n1. Implement and\nmonitor infection\ncontrol policies and\nprocedures\n1.1\nProvide information to\nthe work group about\nthe organization’s\ninfection control policies\nand procedures.\n1.2\nIntegrate the\norganization’s infection\ncontrol policy and\nprocedure into work\npractices.\n1.3\nMonitor infection control\nperformance and\nimplement\nimprovements in\npractices\n• Lecturette\n• Interaction\n\n• Observation\nand oral\nquestioning\n• Grid\nquestioning\n• Practical\nexercise\n2. Respond\neffectively to\ndifficult/challenging\nbehavior\n2.1\nPlan and respond to\nemergencies.\n2.2\nReport and review\nincidents.\n\n• Lecturette\n• Brainstroming\n\n• Observation\nand oral\nquestioning\n• Grid\nquestioning\n• Practical\nexercise\n3. Apply basic first aid\n3.1\nAssess the situation.\n3.2\nApply basic first aid\ntechniques.\n3.3\nCommunicate details of\nthe incident.\n• Lecturrette\n• Brainstorming\n• Observation\nand oral\nquestioning\n• Grid\nquestioning\n• Practical\nexercise\n4. Maintain high\nstandard of patient\nservices\n4.1\nCommunicate\nappropriately with\npatients.\n4.2\nEstablish and maintain\ngood interpersonal\nrelationship with\npatients.\n4.3\nAct in a respectful\nmanner at all times.\n4.4\nEvaluate own work to\nmaintain a high\nstandard of patient\nservice.\n• Lecturrette\n• Brainstorming\n• Observation\nand oral\nquestioning\n• Grid\nquestioning\n• Practical\nexercise\n\n--- PDF PAGE 59 ---\nTR Biomedical Equipment Servicing NCII\n\n- 55 -\n\nCORE COMPETENCIES\n\nUNIT OF\nCOMPETENCY\nLEARNING OUTCOME\nMETHODOLOGY\nASSESSMENT\nAPPROACH\n1. Install biomedical\nequipment\n1.1\nInterpret work\ninstructions\n1.2\nInstall instrumentation\nand control devices\n1.3\nTest installed\ninstrumentation and\ncontrol devices\n• Lecture\n• Questioning\n• On-the- Job\nPractice\n\n• Observation\n• Demonstration\n• Third Party\nReport\n• Return\nDemonstration\n2. Perform corrective\nmaintenance on\nbiomedical\nequipment\n2.1\nRespond to\nclient/customer service\nrequest\n2.2\nPrepare unit\n2.3\nDiagnose faults\n2.4\nRepair Basic\nBiomedical Equipment\n2.5\nReassemble and test\nrepaired unit\n2.6\nRe-commission Basic\nBiomedical Equipment\n2.7\nPerform and maintain\nbasic biomedical\nequipment corrective\nmaintenance\ndocumentation\n• Lecture\n• Questioning\n• On-the- Job\nPractice\n\n• Observation\n• Demonstration\n• Third Party\nReport\n• Return\n Demonstration\n3. Perform preventive\nmaintenance on\nbiomedical\nequipment\n3.1\nPrepare preventive\nmaintenance protocol\n3.2\nImplements preliminary\npreventive maintenance\nprotocol\n3.3\nPerform electrical\nsafety testing\n3.4\nPerform basic\nbiomedical equipment\nfunctional test.\n• Lecture\n• Questioning\n• On-the- Job\nPractice\n• Demonstration\n• Observation\n• Demonstration\n• Third Party\nReport\n• Return\n Demonstration\n\n3.5\nCheck and perform\nbasic biomedical\nequipment calibration.\n3.6\nRe-commission Basic\nBiomedical Equipment.\n3.7\nPerform and maintain\nbasic biomedical\nequipment preventive\nmaintenance\ndocumentation.\n• Lecture\n• Questioning\n• On-the- Job\nPractice\n• Demonstration\n• Observation\n• Demonstration\n• Third Party\nReport\n• Return\n Demonstration\n4. Repair biomedical\nequipment\n\n4.1\nInspect equipment for\nrepair.\n4.2\nPlan and prepare for\nrepair.\n4.3\nRepair equipment.\n4.4\nInspect the test\nequipment.\n• Lecture\n• Questioning\n• On-the- Job\nPractice\n• Demonstration\n• Observation\n• Demonstration\n• Third Party\nReport\n• Return\n Demonstration\n\n--- PDF PAGE 60 ---\nTR Biomedical Equipment Servicing NCII\n\n- 56 -\n\nUNIT OF\nCOMPETENCY\nLEARNING OUTCOME\nMETHODOLOGY\nASSESSMENT\nAPPROACH\n5. Assess and refer\n biomedical\nequipment\n5.1 Plan and prepare.\n5.2 Assess faults/defects\n5.3 Refer for further re-\nassessment\n\n• Lecture\n• Questioning\n• On-the- Job\nPractice\n• Demonstration\n• Observation\n• Demonstration\n• Third Party\nReport\n• Return\n Demonstration\n\n3.2 TRAINING DELIVERY\n\nThe delivery of training should adhere to the design of the curriculum. Delivery should be\nguided by the 10 basic principles of competency-based TVET.\n\n The training is based on curriculum developed from the competency standards;\n Learning is modular in its structure;\n Training delivery is individualized and self-paced;\n Training is based on work that must be performed;\n Training materials are directly related to the competency standards and the curriculum\nmodules;\n Assessment is based in the collection of evidence of the performance of work to the\nindustry required standard;\n Training is based both on and off-the-job components;\n Allows for recognition of prior learning (RPL) or current competencies;\n Training allows for multiple entry and exit; and\n Approved training programs are nationally accredited.\n\nThe competency – based TVET system recognizes various types of delivery modes, both\non and off-the-job as long as the learning is driven by the competency standards specified by\nthe industry. The following training modalities may be adopted when designing training\nprograms:\n\n The dualized mode of training delivery is preferred and recommended. Thus programs\nwould contain both in-school and in – industry training or fieldwork components. Details can\nbe referred to the Dual Training System (DTS) Implementing Rules and Regulations.\n Modular/self-paced learning is a competency-based training modality wherein the trainee is\nallowed to progress at his own pace. The trainer facilitates the training delivery\n Peer teaching/mentoring is a training modality wherein fast learners are given the\nopportunity to assist the slow learners\n Supervised industry training or on-the-job training is an approach in training designed to\nenhance the knowledge an skills of the trainee through actual experience in the workplace\nto acquire specific competencies prescribed in the training regulations.\n Distance learning is a formal education process in which majority of the instruction occurs\nwhen the students and instructor are not in the same place. Distance learning may employ\ncorrespondence study, or audio, video or computer technologies.\n Project-Based Instruction is an authentic instructional model or strategy in which students\nplan, implement and evaluate projects that have real world applicants.\n\n--- PDF PAGE 61 ---\nTR Biomedical Equipment Servicing NCII\n\n- 57 -\n\n3.3 TRAINEE ENTRY REQUIREMENTS:\n\nTrainees or students wishing to gain entry into these qualifications should possess the\nfollowing requirements:\n\n 16 years old and above\n Must pass the trainability / aptitude test\n Can communicate effectively both in oral and written form\n Physically, emotionally and mentally fit\n Can perform basic mathematical computation\n\nThis list does not include specific institutional requirements such as educational\nattainment, appropriate work experience, and others that may be required of the trainees by\nthe school or training center delivering this TVET program.\n\n3.4 TOOLS, MATERIALS AND EQUIPMENT:\nBIOMEDICAL EQUIPMENT SERVICING NC II\n\nRecommended list of tools, equipment and materials for the training of 25 trainees for\nBIOMEDICAL EQUIPMENT SERVICING NCII are as follows:\n\nTOOLS\nEQUIPMENT\nMATERIALS\nQty.\nDescription\nQty.\nDescription\nQty.\nDescription\n4 sets\nPliers; (assorted)\n1\nMicroscope\n\nElectronic devices\nassorted\n\nScrewdrivers;\n(assorted)\n1\nMedical\nRefrigerator/Freezer\n\nSoldering lead\nSoldering iron/gun\n1\nECG machine\nSealing materials\n\nElectric hand drill and\nassorted bits\n1\nClinical weighing\nscale\n\nWork clothes\nAlligator clip with wire\n1\nDefibrillator\nHand gloves\nDe-soldering tool\n1\nEENT Diagnostic set\nGoggles\n\nWrenches (assorted)\n1\nGooseneck lamp/\nExamining light\n\n Mask\n\nPower supply\nvariables\n1\nLaryngoscope with\nblades\n\nTape (assorted)\nCleaning brush\n1\nOxygen unit\nOil, cleaning agent\nWork bench\n1\nSphygmomanometer\n\nHammer\n(Shock less/Mechanical)\n1\nSuction apparatus\n\nBreadboard\n1\nAnesthesia machine\nTester Analog/Digital\n1\nAutoclave\nOscilloscope\n1\nOR/DR light\nSignal Generator\n1\nOR table\n\nIntegrated Circuit\nExtractor\nInfant Incubator\n1\nClinical Incubator\n1\nNebulizer\n1\nHeart/Lung machine\n1\nCardiac monitor\n1\nCircoelectric bed\n1\nCentrifuge\n\n--- PDF PAGE 62 ---\nTR Biomedical Equipment Servicing NCII\n\n- 58 -\n\n3.5 TRAINING FACILITIES\nBIOMEDICAL EQUIPMENT SERVICING NC II\n\nThe Biomedical Equipment Servicing Learning Facility must be of concrete structure.\nBased on class size of 25 students / trainees the space requirements for the teaching /\nlearning and curriculum areas are as follows.\n\nTEACHING / LEARNING AREAS\nSIZE IN\nMETERS\nAREA IN S.\nMETERS\nQTY.\nTOTAL AREA IN\nSQ. METERS\nLaboratory Area\n5 X 10\n50\n1\n50\nTool Room\n4 X 5\n20\n1\n20\nStorage Room/\n4X5\n20\n1\n20\nLearning Resources Area*\n5 X 7\n35\n1\n35\nWash Area/Comfort Room (male &\nfemale)*\n2.5 X 4\n10\n1\n10\nAdmin and Staff Room\n5 X 5\n25\n1\n25\nCirculation Area**\n1\n30\nTotal\n200\nTotal Workshop Area\n\n200\n\n3.6 TRAINER QUALIFICATION (TQ II)\n\n Must be a certified electrical or electronic technician with background/orientation on health\ncare/services\n Must have undergone training on Training Methodology II (TM II) or equivalent in\ntraining/experience\n Must be physically, emotionally and mentally fit\n Must possess good moral character\n With at least 2 years experience in the health service industry\n\n3.7 INSTITUTIONAL ASSESSMENT\n\nInstitutional Assessment is undertaken by trainees to determine their achievement of units\nof competency. A certificate of achievement is issued for each unit of competency.\n\n--- PDF PAGE 63 ---\nTR Biomedical Equipment Servicing NCII\n\n- 59 -\n\nSECTION 4 NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1 To attain the National Qualification of Biomedical Equipment Servicing NC II, the\ncandidate must demonstrate competence through project-type assessment covering\nall units listed in Section 1. Successful candidates shall be awarded a National\nCertificate, NC II signed by the TESDA Director General.\n\n4.2\nAssessment shall focus on the core units of competency. The basic and common\nunits shall be integrated or assessed concurrently with the core units.\n\n4.3\nThe following are qualified to apply for assessment and certification:\n\n4.3.1 Graduates of formal, non-formal and informal including enterprise-based\ntraining programs.\n\n4.3.2 Experienced Workers (wage employed or self – employed)\n\n4.4\nRe-assessment in a unit of competency is allowed only after one month from the date\nof assessment. Re-assessment for a National Certificate shall be done only on the\ntask/s that the candidate did not successfully achieve.\n\n4.5\nA candidate who fails the assessment for two (2) consecutive times will be required to\ngo through a refresher course before taking another assessment.\n\n4.6\nThe guidelines on assessment and certification are discussed in detail in the\nProcedures Manual on Assessment and Certification.\n\n--- PDF PAGE 64 ---\nTR Biomedical Equipment Servicing NCII\n\n- 60 -\n\nCOMPETENCY MAP – HEALTH SECTOR (BIOMEDICAL EQUIPMENT SERVICING NC II)\nBASIC COMPETENCIES\n\nReceive and respond to\nworkplace communication\nWork with others\nDemonstrate work\nvalues\nParticipate in\nworkplace\ncommunication\nWork in a team\nenvironment\nPractice career\nprofessionalism\nPractice occupational\nhealth and safety\nprocedures\nPractice housekeeping\nprocedures (5S)\nLead workplace\ncommunication\nLead small team\nDevelop and practice\nnegotiation skills\nSolve problems related\nto work activities\nUse mathematical\nconcepts and\ntechniques\nUse relevant\ntechnologies\nUtilize specialized\ncommunication skills\nDevelop team and\nindividual\nApply problem solving\ntechniques in the\nworkplace\nCollect, analyze and\norganize information\nPlan and organize work\nPromote environmental\nprotection\n\nCOMMON COMPETENCIES\n\nImplement and monitor\ninfection control policies\nand procedures\nRespond effectively to\ndifficult/challenging\nbehavior\nApply basic first aid\nMaintain high standard\nof patient services\n\nCORE COMPETENCIES\n\nProvide care and support to\ninfants and toddlers\nProvide care and support\nto children\nFoster social, intellectual,\ncreative and emotional\ndevelopment of children\nFoster the physical\ndevelopment of\nchildren\nProvide care and\nsupport to elderly\nProvide care and\nsupport to people with\nspecial needs\nMaintain a healthy and\nsafe environment\nRespond to emergency\nClean living room, dining\nroom, bedrooms, toilet\nand bathroom\nWash and iron clothes,\nlinen and fabric\nPrepare hot and cold\nmeals/food\nPrepare and maintain\nbeds\nCollect and maintain\nlinen stocks at end-\nusers location\nAssist in patient\nmobility\nAssist in transporting\npatients\nAssist in bio-psychosocial\nsupport care of patients\nHandle waste in a health\ncare environment\nInstall biomedical\nequipment\nPerform corrective\nmaintenance on\nbiomedical equipment\nPerform preventive\nmaintenance on\nbiomedical equipment\nRepair biomedical\nequipment\nAssess and refer biomedical\nequipment\nPerform basic life support\nMaintain life support\nequipment and resources\nImplement safe\naccess and extrication\nprocedures in an\nemergency\nManage request for an\nambulance service\nAllocate ambulance\nservice resources\nCoordinate emergency\nresources\nDeliver basic ambulance\ncommunication skills\nSupervise on-road\noperations\nManage the scene of an\nemergency\nManage the scene of\na special event\nManage routine scene\nDeliver pre-hospital\npatient care\nDeliver intensive pre-\nhospital patient care\nManage ambulance\noperations\nTransport emergency\npatients\nTransport non-\nemergency patients\nDrive vehicles under\noperational conditions\nWork within a holistic\ntherapeutic massage\nframework\nPerform therapeutic\nmassage assessment\nPlan the therapeutic\nmassage treatment\nImplement therapeutic\nmassage treatment\nPerform remedial\ntherapeutic massage\ntreatment\nWork within a community\ndevelopment framework\nPrepare for work in the\ncommunity service\nindustry\nSupport community\nresources\nProvide\nprimary/residential care\nSupport community\nparticipation\nRecruit and coordinate\nvolunteers\nRespond holistically to\nclient issues\nDevelop and provide\nhealth education program\nin the community\nImplement health\npromotion and\ncommunity\ninterventions\n\n--- PDF PAGE 65 ---\nTR Biomedical Equipment Servicing NCII\n\n- 61 -\n\nDEFINITION OF TERMS\n\nFor the purpose of this standard, the word\n\nMaintenance\nA combination of any action carried out to retain an item in, or\nrestore it to an acceptable operation condition.\n\nPreventive Maintenance\nMaintained carried out a predetermined interval, or to other\nprescribed criteria, and intended to reduce the like hood of an\nitem not meeting an acceptable condition.\n\nCorrective Maintenance\nMaintenance carried out to restore (including adjustment and\nrepair) an item, which has ceased to meet an acceptable\ncondition.\n\nElectro cardiograph (ECG)\nAn instrument for recording the changes of electrical potential\noccurring during the heartbeat; used especially in diagnosing\nabnormalities of the heart action.\n\nSpectrophotometer\nA device for measuring the concentration of a substance in a\nsolution using single beam of light that passes through the\nsolution.\n\nBlood Pressure Apparatus\nAn equipment use to measure arterial blood pressure in the\nlateral pressure of force exerted by blood on a unit area of the\nblood vessel wall.\n\nWeighing Scale\nA measuring instrument for determining the weight of an object:\namount of mass in terms of kilogram (kg) or pounds (lbs)\n\nNebulizer\nA device used to turn liquid medicine into a fine spray, or\nnebulas, usually liquid form medicine for asthma; for quick nasal\ningestion.\n\nLaryngoscope\nA flexible, lighted tube used to examine the larynx.\n\nStethoscope\nA medical instrument for listening to the sounds generated\ninside the body which otherwise could not be heard by a human\near unaided.\n\nSterilizer\nA device for heating substances above their boiling point. Use to\nmanufacture chemicals of to sterilized surgical instrument.\n\nWater bath\nA device for regulating the temperature of anything subjected to\nheat, by surrounding the vessel containing it with another vessel\ncontaining water that can be kept at a desired temperature.\n\n--- PDF PAGE 66 ---\nACKNOWLEDGMENT\n\nThe Technical Education and Skills Development Authority (TESDA) wishes to extend thanks and\nappreciation to the many representatives of business, industry, academe and government agencies, non-\ngovernment organizations including professional associations who donated their time and expertise to the\ndevelopment and validation of this Training Regulations.\n\nEXECUTIVE COMMITTEE, Health Care Industry Training Council, Inc.\n•\nDr. Juan Ma. Pablo R. Nañagas, MPH, MNSA\nChairperson\n•\nDr. Kenneth Vincent Ronquillo, MPHM\nDeputy Chair\n•\nPilar L. Singson Malabunga, RN, MAN\nSecretary (2003-2004)\n•\nEvangeline E. Rafael, RN, MPA, MHA, PhD\nSecretary\n•\nDr. Irineo Bernardo, III\nTreasurer\n•\nProfessor Quintin G. Tan\nBoard Member\n•\nMa. Rita V. Tamse, RN, MN\nBoard Member\nCommittee Chairs, Health Care Industry Training Council\n\n•\nDr. Rodel Nodora, EMBA\nPlanning Research, Marketing and Advocacy\nCommittee\n•\nMa. Rita V. Tamse, RN, MN\nStandards and Assessment Development\nCommittee (2003-2004)\n•\nMs. Gwyn Grace M. Dacurawat\nStandards and Assessment Development\nCommittee\n•\nProf. Agnes Rosario A. De Leon, RN,\nMHA, CHCM\nTraining and Development Committee\nPAQTVET\n•\nMark Douglas Kilner\nAustralian Project Director and Industry Advisor,\nHealth Sector\n•\nMr. Nicholas Crosling\n•\nMs. Sonya Casey\n•\nMr. Patrick Cummings\n•\nMr. Anthony Audley\n•\nMr. Dexter Merquita\n•\nMs. Erma David\n•\nMs. Olivia Angel\n•