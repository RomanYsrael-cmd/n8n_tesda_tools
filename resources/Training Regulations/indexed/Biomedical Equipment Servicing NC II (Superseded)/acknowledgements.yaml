      "source_text": "UNIT OF COMPETENCY : MAINTAIN HIGH STANDARDS OF PATIENT SERVICES UNIT CODE : HCS323204 UNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes required in the maintenance of high standards of patient services."
    },
    {
      "source_text": "ELEMENT PERFORMANCE CRITERIA Italicized terms are elaborated in the Range of Variables 1. Communicate appropriately with patients 1.1 Effective communication strategies and techniques are identified and used to achieve best patient service outcomes. 1.2 Complaints are responded to in accordance with organizational policy to ensure best service to patients. 1.3 Complaints are dealt with in accordance with established procedures. 1.4 Interpreter services are accessed as required. 1.5 Action is taken to resolve conflicts either directly, where a positive outcome can be immediately achieved, or by referral to the appropriate personnel. 1.6 Participation in work team is constructive and collaborative and demonstrates an understanding of own role. 2. Establish and maintain good interpersonal relationship with patients 2.1 Rapport is established to ensure the service is appropriate to and in the best interests of patients. 2.2 Effective listening skills are used to ensure a high level of effective communication and quality of service. 2.3 Patient concerns and needs are correctly identified and responded to responsibly and accordingly established procedures and guidelines. 2.4 Effectiveness of interpersonal interaction is consistently monitored and evaluated to ensure best patient service outcomes. 3. Act in a respectful manner at all times 3.1 Respect for differences is positively, actively and consistently demonstrated in all work. 3.2 Confidentiality and privacy of patients is maintained. 3.3 Courtesy is demonstrated in all interactions with patients, their visitors, carers and family. 3.4 Assistance with the care of patients with challenging behaviors is provided in accordance with established procedures. 3.5 Techniques are used to manage and minimize aggression. 4. Evaluate own work to maintain a high standard of patient service 4.1 Advice and assistance is received or sought from appropriate sources on own performance. 4.2 Own work is adjusted, incorporating recommendations that address performance issues, to maintain the agreed standard of patient support."
