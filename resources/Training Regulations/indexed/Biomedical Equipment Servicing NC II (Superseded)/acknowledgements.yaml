      "source_text": "UNIT OF COMPETENCY : INSTALL BIOMEDICAL EQUIPMENT UNIT CODE : HCS311301"
    },
    {
      "source_text": "UNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes necessary to install biomedical equipment related to patient care."
    },
    {
      "source_text": "ELEMENT PERFORMANCE CRITERIA Italicized terms are elaborated in the Range of Variables 1. Interpret work instructions 1.1 Work instructions are read and interpreted to determine job requirements. 1.2 Tools and testing devices needed to carry out the installation work are selected in accordance with established procedures and checked for correct operation and safety. 1.3 Materials necessary to complete the work are obtained in accordance with job requirements. 2. Install equipment and accessories 2.1 Equipment and components are prepared for correct sequential installation. 2.2 OSH policies and procedures for installation are followed according to manufacturer’s specifications. 2.3 PPE is used according to institution’s requirements. 2.4 Electrical cabling and wiring devices of correct loading capacity are selected and safely installed according to National Electrical Code. 2.5 Equipment is installed in accordance with manufacturer’s instructions, requirements, and without damage to self and others or surrounding place or environment. 2.6 Unplanned events or conditions are responded to in accordance with established institutional procedures. 3. Test installed equipment and accessories 3.1 Equipment is tested in accordance with manufacturer’s instructions. 3.2 Final inspections are undertaken to ensure that the installed device conforms with manufacturer’s instructions. 3.3 Work site is cleaned and cleared of all debris and left safe in accordance with the institution’s requirements. 3.4 Report on installation and testing of equipment is prepared and submitted according to institution’s procedures. 3.5 Endorse equipment to appropriate end user according to institution’s requirements."
    },
