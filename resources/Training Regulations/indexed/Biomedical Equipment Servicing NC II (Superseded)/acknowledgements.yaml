      "source_text": "UNIT OF COMPETENCY : PERFORM PREVENTIVE MAINTENANCE ON BIOMEDICAL EQUIPMENT UNIT CODE : HCS311303 UNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes required in conducting preventive maintenance."
    },
    {
      "source_text": "ELEMENT PERFORMANCE CRITERIA Italicized terms are elaborated in the Range of Variables 1. Prepare preventive maintenance protocol 1.1 Covered biomedical equipment and accessories is identified. 1.2 Update basic biomedical equipment inventory on the covered BBE is secured and used as reference for preventive maintenance preparation. 1.3 Repair history and equipment consumables are verified in line with the institution’s procedure. 1.4 Appropriate checklist forms tools, test equipment, calibrating tools, fast moving consumables and personal protective equipment are secured in line with job requirements. 2. Implement preliminary preventive maintenance protocol 2.1 Preventive maintenance program is properly communicated with the appropriate staff. 2.2 Immediate surrounding of covered BBE is secured from unnecessary hazards. 2.3 Performed basic biomedical equipment ocular inspection in accordance with institution’s procedure. 2.4 Cleaned and sanitized BBE in accordance with manufacturer standard and/or institution’s procedure. 3. Perform electrical safety testing 3.1 Set-up appropriate test equipment in accordance with equipment manufacturer standards and established occupational health and safety practices. 3.2 Line voltage, ground resistance and current leakage of the covered BBE are measured in accordance with manufacturer standards and in strict observance of the established occupational health and safety practices. 3.3 Electrical safety test results with equipment manufacturer’s safety standards are analyzed. 3.4 Electrical faults are corrected in accordance with equipment manufacture standards. 4. Perform health care equipment functional test 4.1 Equipment set-up and start-up operation is performed in accordance with equipment manufacturer standards. 4.2 Set equipment controls in accordance with equipment manufacture’s functional test standard. 4.3 Controls and start up signals are checked in accordance with manufacture standard operating procedure and safety regulations."
    },
