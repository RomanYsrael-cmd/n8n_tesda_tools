      "source_text": "EVIDENCE GUIDE"
    },
    {
      "source_text": "1. Critical aspects of competency Assessment requires evidence that the candidate: 1.1 Communicated with team and individuals on organizational policy and procedures for infection control 1.2 Applied infection control policies and procedures which impact on work processes of the specific work unit 1.3 Applied procedures for adopting appropriate infection practices within work unit 1.4 Provided appropriate supervision of work group 2. Underpinning knowledge 2.1 Working knowledge, consistent with the elements of competence, of the organization's applicable infection control policy and procedures and relevant industry codes of practice 2.2 The hierarchy risk control measures from most to least preferred, that is, elimination, engineering controls, administrative control, and lastly, personal protective equipment 2.3 Knowledge of infection risks and control measures in specific work unit and related work processes 2.4 The significance of patient confidentiality in relation to infection control 2.5 The significance of other management systems and procedures for infection control 2.6 Literacy levels and communication skills of work group members and consequent suitable communication techniques 2.7 Organizational procedures for monitoring, training 2.8 Basic understanding of communicable disease transmission 3. Underpinning skills 3.1 Effective communication and interpersonal skills including:  language competence  literacy and reading competence 3.2 Negotiation 3.3 Work planning and management 3.4 Management of change of work processes 3.5 Monitoring compliance with policy and procedures 3.6 Maintain and interpret infection control records 4. Resource implications The following resources MUST be provided 4.1 Workplace infection control and health and safety policies and procedures 4.2 Waste management procedures 4.3 Food safety procedures 4.4 Other organizational policies and procedures 4.5 Duties statements and/or job descriptions 5. Method of assessment Competency may be assessed through: 5.1 Observation with questioning 5.2 Interview 5.3 Portfolio 5.4 Demonstration with questioning 6. Context of assessment 6.1 Assessment may be done in the workplace or in a simulated workplace setting."
