      "source_text": "UNIT OF COMPETENCY : PRACTICE OCCUPATIONAL HEALTH AND SAFETY PROCEDURES UNIT CODE : 500311108 UNIT DESCRIPTOR : This unit covers the outcomes required to comply with regulatory and organizational requirements for occupational health and safety."
    },
    {
      "source_text": "ELEMENT PERFORMANCE CRITERIA Italicized terms are elaborated in the Range of Variables 1. Identify hazards and risks 1.1 Safety regulations and workplace safety and hazard control practices and procedures are clarified and explained based on organization procedures. 1.2 Hazards/risks in the workplace and their corresponding indicators are identified to minimize or eliminate risk to co- workers, workplace and environment in accordance with organization procedures. 1.3 Contingency measures during workplace accidents, fire and other emergencies are recognized and established in accordance with organization procedures. 2. Evaluate hazards and risks 2.1 Terms of maximum tolerable limits which when exceeded will result in harm or damage are identified based on threshold limit values (TLV). 2.2 Effects of the hazards are determined. 2.3 OHS issues and/or concerns and identified safety hazards are reported to designated personnel in accordance with workplace requirements and relevant workplace OHS legislation. 3. Control hazards and risks 3.1 Occupational Health and Safety (OHS) procedures for controlling hazards/risks in workplace are consistently followed. 3.2 Procedures for dealing with workplace accidents, fire and emergencies are followed in accordance with organization OHS policies. 3.3 Personal protective equipment (PPE) is correctly used in accordance with organization OHS procedures and practices. 3.4 Appropriate assistance is provided in the event of a workplace emergency in accordance with established organization protocol. 4. Maintain OHS awareness 4.1 Emergency-related drills and trainings are participated in as per established organization guidelines and procedures. 4.2 OHS personal records are completed and updated in accordance with workplace requirements."
    },
    {
      "source_text": "-- PDF PAGE 16 --- TR Biomedical Equipment Servicing NCII"
    },
    {
      "source_text": "12 -"
    },
    {
      "source_text": "RANGE OF VARIABLES"
    },
    {
      "source_text": "VARIABLE RANGE 1. Safety regulations May include but are not limited to: 1.1 Clean Air Act 1.2 Building code 1.3 National Electrical and Fire Safety Codes 1.4 Waste management statutes and rules 1.5 Philippine Occupational Safety and Health Standards 1.6 DOLE regulations on safety legal requirements 1.7 ECC regulations 2. Hazards/risks May include but are not limited to: 2.1 Physical hazards – impact, illumination, pressure, noise, vibration, temperature, radiation 2.2 Biological hazards- bacteria, viruses, plants, parasites, mites, molds, fungi, insects 2.3 Chemical hazards – dusts, fibers, mists, fumes, smoke, gasses, vapors 2.4 Ergonomics"
    },
    {
      "source_text": "Psychological factors – over exertion/ excessive force, awkward/static positions, fatigue, direct pressure, varying metabolic cycles"
    },
    {
      "source_text": "Physiological factors – monotony, personal relationship, work out cycle 3. Contingency measures May include but are not limited to: 3.1 Evacuation 3.2 Isolation 3.3 Decontamination 3.4 (Calling designed) emergency personnel 4. PPE May include but are not limited to: 4.1 Mask 4.2 Gloves 4.3 Goggles 4.4 Hair Net/cap/bonnet 4.5 Face mask/shield 4.6 Ear muffs 4.7 Apron/Gown/coverall/jump suit 4.8 Anti-static suits 5. Emergency-related drills and training 5.1 Fire drill 5.2 Earthquake drill 5.3 Basic life support/CPR 5.4 First aid 5.5 Spillage control 5.6 Decontamination of chemical and toxic 5.7 Disaster preparedness/management 6. OHS personal records 6.1 Medical/Health records 6.2 Incident reports 6.3 Accident reports 6.4 OHS-related training completed"
    },
