      "source_text": "TRAINING REGULATIONS FOR BIOMEDICAL EQUIPMENT SERVICING NC II"
    },
    {
      "source_text": "SECTION 1 BIOMEDICAL EQUIPMENT SERVICING NC II QUALIFICATION"
    },
    {
      "source_text": "This BIOMEDICAL EQUIPMENT SERVICING NC II Qualification consists of competencies that a person must achieve to install, perform corrective and preventive maintenance, repair biomedical equipment, assess and refer biomedical equipment. The Units of Competency comprising this qualification include the following:"
    },
    {
      "source_text": "UNIT CODE BASIC COMPETENCIES 500311105 Participate in workplace communication 500311106 Work in a team environment 500311107 Practice career professionalism 500311108 Practice occupational health and safety procedures"
    },
    {
      "source_text": "UNIT CODE COMMON COMPETENCIES HCS323201 Implement and monitor infection control policies and procedures HCS323202 Respond effectively to difficult/challenging behavior HCS323203 Apply basic first aid HCS323204 Maintain high standard of patient services"
    },
    {
      "source_text": "UNIT CODE CORE COMPETENCIES HCS311301 Install biomedical equipment HCS311302 Perform corrective maintenance on biomedical equipment HCS311303 Perform preventive maintenance on biomedical equipment HCS311304 Repair biomedical equipment HCS311305 Assess and refer biomedical equipment"
    },
    {
      "source_text": "A person who has achieved this Qualification is competent to be:"
    },
    {
      "source_text": " Biomedical Equipment Technician (BMET)  Medical Equipment Mechanic / Repairer"
    },
    {
      "source_text": "-- PDF PAGE 6 --- TR Biomedical Equipment Servicing NCII"
    },
