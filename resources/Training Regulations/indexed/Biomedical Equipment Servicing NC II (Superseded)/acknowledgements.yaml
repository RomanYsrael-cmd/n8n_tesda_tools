      "source_text": "ELEMENT PERFORMANCE CRITERIA Italicized terms are elaborated in the Range of Variables 1. Integrate personal objectives with organizational goals 1.1 Personal growth and work plans are pursued towards improving the qualifications set for the profession. 1.2 Intra and interpersonal relationships is are maintained in the course of managing oneself based on performance evaluation. 1.3 Commitment to the organization and its goal is demonstrated in the performance of duties. 2. Set and meet work priorities 2.1 Competing demands are prioritized to achieve personal, team and organizational goals and objectives. 2.2 Resources are utilized efficiently and effectively to manage work priorities and commitments. 2.3 Practices along economic use and maintenance of equipment and facilities are followed as per established procedures. 3. Maintain professional growth and development 3.1 Trainings and career opportunities are identified and availed of based on job requirements. 3.2 Recognitions are sought/received and demonstrated as proof of career advancement. 3.3 Licenses and/or certifications relevant to job and career are obtained and renewed."
