    {
      "source_text": "VARIABLE RANGE 1. Planned responses 1.1 Own ability and experience 1.2 Established institutional procedures 1.3 Knowledge of individual persons and underlying causes 2. Difficult or challenging behaviors 2.1 Aggression/Assaultive behavior 2.2 Confusion or other cognitive impairment 2.3 Noisiness 2.4 Manipulative 2.5 Wandering 2.6 Self-destructive 2.7 Intoxication 2.8 Withdrawn/depressed 2.9 Negativistic 2.10 Intrusive behavior 2.11 Verbal offensiveness 3. Strategies for dealing with challenging behaviors 3.1 Diversional activities 3.2 Referring to appropriate personnel e.g. supervisor, security officer 3.3 Following established emergency response procedures 4. Selection of strategies for dealing with challenging behaviors 4.1 The nature of the incident 4.2 Potential effect on different parties, patient, staff and others 4.3 Established procedures and guidelines 5. Institutional policies and procedures 5.1 Incident reporting and documentation 5.2 Operational guidelines for handling incidents and/or cases involving difficult and challenging behavior 5.3 Debriefing of staff involved in the incident"
