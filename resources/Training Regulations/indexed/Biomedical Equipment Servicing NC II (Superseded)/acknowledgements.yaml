      "source_text": "3.6 TRAINER QUALIFICATION (TQ II)"
    },
    {
      "source_text": " Must be a certified electrical or electronic technician with background/orientation on health care/services  Must have undergone training on Training Methodology II (TM II) or equivalent in training/experience  Must be physically, emotionally and mentally fit  Must possess good moral character  With at least 2 years experience in the health service industry"
    },
    {
      "source_text": "3.7 INSTITUTIONAL ASSESSMENT"
    },
    {
      "source_text": "Institutional Assessment is undertaken by trainees to determine their achievement of units of competency. A certificate of achievement is issued for each unit of competency."
    },
    {
      "source_text": "-- PDF PAGE 63 --- TR Biomedical Equipment Servicing NCII"
    },
    {
      "source_text": "59 -"
    },
    {
      "source_text": "SECTION 4 NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS"
    },
    {
      "source_text": "4.1 To attain the National Qualification of Biomedical Equipment Servicing NC II, the candidate must demonstrate competence through project-type assessment covering all units listed in Section 1. Successful candidates shall be awarded a National Certificate, NC II signed by the TESDA Director General."
    },
    {
      "source_text": "4.2 Assessment shall focus on the core units of competency. The basic and common units shall be integrated or assessed concurrently with the core units."
    },
    {
      "source_text": "4.3 The following are qualified to apply for assessment and certification:"
    },
    {
      "source_text": "4.3.1 Graduates of formal, non-formal and informal including enterprise-based training programs."
    },
    {
      "source_text": "4.3.2 Experienced Workers (wage employed or self – employed)"
    },
    {
      "source_text": "4.4 Re-assessment in a unit of competency is allowed only after one month from the date of assessment. Re-assessment for a National Certificate shall be done only on the task/s that the candidate did not successfully achieve."
    },
    {
      "source_text": "4.5 A candidate who fails the assessment for two (2) consecutive times will be required to go through a refresher course before taking another assessment."
    },
    {
      "source_text": "4.6 The guidelines on assessment and certification are discussed in detail in the Procedures Manual on Assessment and Certification."
    },
    {
      "source_text": "-- PDF PAGE 64 --- TR Biomedical Equipment Servicing NCII"
