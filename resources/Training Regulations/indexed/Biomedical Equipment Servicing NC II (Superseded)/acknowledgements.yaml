      "source_text": "UNIT OF COMPETENCY : PERFORM CORRECTIVE MAINTENANCE ON BIOMEDICAL EQUIPMENT UNIT CODE : HCS311302 UNIT DESCRIPTOR : This unit covers the knowledge, skills and attitude required in conducting corrective maintenance."
    },
    {
      "source_text": "ELEMENT PERFORMANCE CRITERIA Italicized terms are elaborated in the Range of Variables 1. Respond to client/customer service request 1.1 Appropriate request form is received in accordance with institution protocols. 1.2 Covered biomedical equipment is identified. 1.3 Prompt service is conducted on-site or in the workshop. 2. Prepare unit/equipment 2.1. Complete assembly check-up and fault symptoms are conducted, identified, and verified against client description and properly documented. 2.2. Repair history is verified in line with the institution procedures. 2.3. Service manuals and service information required for the corrective maintenance are made available at the beginning of the corrective maintenance activities. 2.4. Workplace is cleaned in accordance with the institution procedure. 2.5. Necessary tools, test instrument and personal protective equipment are prepared in line with job requirement. 3. Diagnose faults 3.1. Systematic pre-testing procedure is observed in accordance with manufacturer’s instruction. 3.2. System detect is identified using appropriate tools and test equipment and in accordance with organizational policies and procedures. 3.3. Accurate diagnosis is completed within the specified timeframe. 3.4. Diagnosis and findings of basic biomedical equipment failures or technical problems are completely and accurately documented in accordance with institution standard. 3.5 Fault/s, defects and range of the problems are properly and courteously explained to the client in accordance with institution policy. 4. Repair biomedical equipment 4.1 Safety equipment is used to protect self and others in accordance with established Occupational Health and Safety practices. 4.2 Defective spare parts/components are replaced with equivalent and/or better performing spare parts/components. 4.3 Repair and/or replaced parts/components are soldered in accordance to current best industry practice. 4.4 Necessary circuit adjustment, re-calibration and testing"
    },
    {
      "source_text": "-- PDF PAGE 39 --- TR Biomedical Equipment Servicing NCII"
    },
    {
      "source_text": "35 -"
    },
    {
      "source_text": "ELEMENT PERFORMANCE CRITERIA Italicized terms are elaborated in the Range of Variables procedure is done and in conformance with equipment manufacturer specification standards. 4.5 Necessary modification, conversion of parts and/or circuits is applied in accordance with industry best practice and equipment manufacturer specifications. 4.6 Spare parts substitution is in accordance with the manufacturer’s specification or equivalent. 4.7 Corrective maintenance activity is accomplished within the required time frame. 4.8 Care and extreme precaution in handling the unit is observed. 5. Reassemble and test repaired unit 5.1 Performance and functional test is conducted immediately after re-assembly. 5.2 Equipment status and performance is checked and ensured conformance with equipment manufacturer standard and other health safety regulations. 5.3 Complete and accurate documentation is prepared. 5.4 Tools and test instrument are cleaned and cared as per organizational procedure. 5.5 Waste materials are disposed in accordance with hospital waste management and other environmental requirements. 6. Re-commission biomedical equipment 6.1. Basic biomedical equipment and its immediate surrounding are cleaned in accordance with institution policy. 6.2. Appropriate staff is communicated on the status of the equipment as per institution standards. 7. Perform and maintain biomedical equipment corrective maintenance documentation. 7.1 Health care equipment corrective maintenance form and other relevant reports are accomplished in strict observance of institution standards. 7.2 Reports are submitted to proper officer/offices in accordance with institution policy. 7.3 Corrective maintenance documents are systematically kept and updated as per institution standards."
