      "source_text": "1. Critical aspects of competency Assessment requires evidence that the candidate: 1.1 Explained clearly established workplace safety and hazard control practices and procedures 1.2 Identified hazards/risks in the workplace and its corresponding indicators in accordance with company procedures 1.3 Recognized contingency measures during workplace accidents, fire and other emergencies 1.4 Identified terms of maximum tolerable limits based on threshold limit value- TLV. 1.5 Followed Occupational Health and Safety (OHS) procedures for controlling hazards/risks in workplace 1.6 Used Personal Protective Equipment (PPE) in accordance with company OHS procedures and practices 1.7 Completed and updated OHS personal records in accordance with workplace requirements 2. Underpinning knowledge 2.1 OHS procedures and practices and regulations 2.2 PPE types and uses 2.3 Personal hygiene practices 2.4 Hazards/risks identification and control 2.5 Threshold Limit Value -TLV 2.6 OHS indicators 2.7 Organization safety and health protocol 2.8 Safety consciousness 2.9 Health consciousness 3. Underpinning skills 3.1 Practice of personal hygiene 3.2 Hazards/risks identification and control skills 3.3 Interpersonal skills 3.4 Communication skills 4. Resource implications The following resources MUST be provided: 4.1 Workplace or assessment location 4.2 OHS personal records 4.3 PPE 4.4 Health records 5. Method of assessment Competency may be assessed through: 5.1 Portfolio Assessment 5.2 Interview 5.3 Case Study/Situation 6. Context of assessment 6.1 Competency may be assessed in the work place or in a simulated work place setting"
