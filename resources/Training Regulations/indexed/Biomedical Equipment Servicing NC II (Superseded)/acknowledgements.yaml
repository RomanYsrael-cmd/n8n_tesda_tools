  "source_text": "ACKNOWLEDGEMENTS\n\n--- PDF PAGE 5 ---\nTR Biomedical Equipment Servicing NCII\n\n- 1 -\n\nTRAINING REGULATIONS FOR\n BIOMEDICAL EQUIPMENT SERVICING NC II\n\nSECTION 1 BIOMEDICAL EQUIPMENT SERVICING NC II QUALIFICATION\n\nThis BIOMEDICAL EQUIPMENT SERVICING NC II Qualification consists of competencies\nthat a person must achieve to install, perform corrective and preventive maintenance, repair\nbiomedical equipment, assess and refer biomedical equipment.\nThe Units of Competency comprising this qualification include the following:\n\nUNIT CODE\nBASIC COMPETENCIES\n500311105\nParticipate in workplace communication\n500311106\nWork in a team environment\n500311107\nPractice career professionalism\n500311108\nPractice occupational health and safety procedures\n\nUNIT CODE\nCOMMON COMPETENCIES\nHCS323201\nImplement and monitor infection control policies and procedures\nHCS323202\nRespond effectively to difficult/challenging behavior\nHCS323203\nApply basic first aid\nHCS323204\nMaintain high standard of patient services\n\nUNIT CODE\nCORE COMPETENCIES\nHCS311301\nInstall biomedical equipment\nHCS311302\nPerform corrective maintenance on biomedical equipment\nHCS311303\nPerform preventive maintenance on biomedical equipment\nHCS311304\nRepair biomedical equipment\nHCS311305\nAssess and refer biomedical equipment\n\nA person who has achieved this Qualification is competent to be:\n\n Biomedical Equipment Technician (BMET)\n Medical Equipment Mechanic / Repairer\n\n--- PDF PAGE 6 ---\nTR Biomedical Equipment Servicing NCII\n\n- 2 -\n\nSECTION 2 COMPETENCY STANDARDS\n\nThis section gives the details of the contents of the basic, common and core units of\ncompetency required in BIOMEDICAL EQUIPMENT SERVICING NC II.\n\nBASIC COMPETENCIES\n\nUNIT OF COMPETENCY : PARTICIPATE IN WORKPLACE COMMUNICATION\nUNIT CODE\n: 500311105\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes required to\ngather, interpret and convey information in response to workplace\nrequirements.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Obtain and convey\nworkplace\ninformation\n1.1\nSpecific and relevant information is accessed from\nappropriate sources.\n1.2\nEffective questioning , active listening and speaking skills are\nused to gather and convey information.\n1.3\nAppropriate medium is used to transfer information and ideas\n1.4\nAppropriate non- verbal communication is used.\n1.5\nAppropriate lines of communication with supervisors and\ncolleagues are identified and followed.\n1.6\nDefined workplace procedures for the location and storage of\ninformation are used.\n1.7\nPersonal interaction is carried out clearly and concisely.\n2. Participate in\nworkplace meetings\nand discussions\n2.1\nTeam meetings are attended on time.\n2.2\nOwn opinions are clearly expressed and those of others are\nlistened to without interruption.\n2.3\nMeeting inputs are consistent with the meeting purpose and\nestablished protocols.\n2.4\nWorkplace interactions are conducted in a courteous\nmanner.\n2.5\nQuestions about simple routine workplace procedures and\nmaters concerning working conditions of employment are\nasked and responded to.\n2.6\nMeetings outcomes are interpreted and implemented.\n3. Complete relevant\nwork related\ndocuments\n3.1\nRange of forms relating to conditions of employment are\ncompleted accurately and legibly.\n3.2\nWorkplace data is recorded on standard workplace forms and\ndocuments.\n3.3\nBasic mathematical processes are used for routine\ncalculations.\n3.4\nErrors in recording information on forms/ documents are\nidentified and properly acted upon.\n3.5\nReporting requirements to supervisor are completed\naccording to organizational guidelines.\n\n--- PDF PAGE 7 ---\nTR Biomedical Equipment Servicing NCII\n\n- 3 -\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Appropriate sources\n1.1\nTeam members\n1.2\nSuppliers\n1.3\nTrade personnel\n1.4\nLocal government\n1.5\nIndustry bodies\n2. Medium\n2.1\nMemorandum\n2.2\nCircular\n2.3\nNotice\n2.4\nInformation discussion\n2.5\nFollow-up or verbal instructions\n2.6\nFace to face communication\n3. Storage\n3.1\nManual filing system\n3.2\nComputer-based filing system\n4. Forms\n4.1\nPersonnel forms, telephone message forms, safety reports\n5. Workplace\ninteractions\n5.1\nFace to face\n5.2\nTelephone\n5.3\nElectronic and two way radio\n5.4\nWritten including electronic, memos, instruction and forms,\nnon-verbal including gestures, signals, signs and diagrams\n6. Protocols\n6.1\nObserving meeting\n6.2\nCompliance with meeting decisions\n6.3\nObeying meeting instructions\n\n--- PDF PAGE 8 ---\nTR Biomedical Equipment Servicing NCII\n\n- 4 -\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nPrepared written communication following standard format of\nthe organization\n1.2\nAccessed information using communication equipment\n1.3\nMade use of relevant terms as an aid to transfer information\neffectively\n1.4\nConveyed information effectively adopting the formal or\ninformal communication\n2. Underpinning\nknowledge\n\n2.1\nEffective communication\n2.2\nDifferent modes of communication\n2.3\nWritten communication\n2.4\nOrganizational policies\n2.5\nCommunication procedures and systems\n2.6\nTechnology relevant to the enterprise and the individual’s\nwork responsibilities\n3. Underpinning skills\n3.1\nFollow simple spoken language\n3.2\nPerform routine workplace duties following simple written\nnotices\n3.3\nParticipate in workplace meetings and discussions\n3.4\nComplete work related documents\n3.5\nEstimate, calculate and record routine workplace measures\n3.6\nBasic mathematical processes of addition, subtraction,\ndivision and multiplication\n3.7\nAbility to relate to people of social range in the workplace\n3.8\nGather and provide information in response to workplace\nRequirements\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nFax machine\n4.2\nTelephone\n4.3\nWriting materials\n4.4\nInternet\n5. Method of\nassessment\nCompetency MUST be assessed through:\n5.1\nDirect observation with questioning\n5.2\nOral interview and written test\n6. Context of\nassessment\n6.1\nCompetency may be assessed individually in the actual\nworkplace or through accredited institution\n\n--- PDF PAGE 9 ---\nTR Biomedical Equipment Servicing NCII\n\n- 5 -\n\nUNIT OF COMPETENCY :\nWORK IN A TEAM ENVIRONMENT\nUNIT CODE\n: 500311106\nUNIT DESCRIPTOR\n:\nThis unit covers the skills, knowledge and attitudes to identify role\nand responsibility as a member of a team.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Describe team role\nand scope\n1.1\nThe role and objective of the team is identified from\navailable sources of information.\n1.2\nTeam parameters, reporting relationships and responsibilities\nare identified from team discussions and appropriate external\nsources.\n2. Identify own role and\nresponsibility within\nteam\n2.1\nIndividual role and responsibilities within the team\nenvironment are identified.\n2.2\nRoles and responsibility of other team members are identified\nand recognized.\n2.3\nReporting relationships within team and external to team are\nidentified.\n3. Work as a team\nmember\n3.1\nEffective and appropriate forms of communications used and\ninteractions undertaken with team members who contribute to\nknown team activities and objectives.\n3.2\nEffective and appropriate contributions made to complement\nteam activities and objectives, based on individual skills and\ncompetencies and workplace context.\n3.3\nObserved protocols in reporting using standard operating\nprocedures.\n3.4\nContribute to the development of team work plans based on\nan understanding of team’s role and objectives and individual\ncompetencies of the members.\n\n--- PDF PAGE 10 ---\nTR Biomedical Equipment Servicing NCII\n\n- 6 -\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Role and objective of\nteam\n1.1\nWork activities in a team environment with enterprise or\nspecific sector\n1.2\nLimited discretion, initiative and judgment maybe\ndemonstrated on the job, either individually or in a team\nenvironment\n2. Sources of\ninformation\n2.1\nStandard operating and/or other workplace procedures\n2.2\nJob procedures\n2.3\nMachine/equipment manufacturer’s specifications and\ninstructions\n2.4\nOrganizational or external personnel\n2.5\nClient/supplier instructions\n2.6\nQuality standards\n2.7\nOHS and environmental standards\n3. Workplace context\n3.1\nWork procedures and practices\n3.2\nConditions of work environments\n3.3\nLegislation and industrial agreements\n3.4\nStandard work practice including the storage, safe handling\nand disposal of chemicals\n3.5\nSafety, environmental, housekeeping and quality guidelines\n\n--- PDF PAGE 11 ---\nTR Biomedical Equipment Servicing NCII\n\n- 7 -\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nOperated in a team to complete workplace activity\n1.2\nWorked effectively with others\n1.3\nConveyed information in written or oral form\n1.4\nSelected and used appropriate workplace language\n1.5\nFollowed designated work plan for the job\n1.6\nReported outcomes\n2. Underpinning\nknowledge\n2.1\nCommunication process\n2.2\nTeam structure\n2.3\nTeam roles\n2.4\nGroup planning and decision making\n3. Underpinning skills\n3.1\nCommunicate appropriately, consistent with the culture of the\nworkplace\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nAccess to relevant workplace or appropriately simulated\nenvironment where assessment can take place\n4.2\nMaterials relevant to the proposed activity or tasks\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1\nObservation of the individual member in relation to the work\nactivities of the group\n5.2\nObservation of simulation and or role play involving the\nparticipation of individual member to the attainment of\norganizational goal\n5.3\nCase studies and scenarios as a basis for discussion of\nissues and strategies in teamwork\n6. Context of\nassessment\n6.1\nCompetency may be assessed in workplace or in a simulated\nworkplace setting\n6.2\nAssessment shall be observed while task are being\nundertaken whether individually or in group\n\n--- PDF PAGE 12 ---\nTR Biomedical Equipment Servicing NCII\n\n- 8 -\n\nUNIT OF COMPETENCY :\nPRACTICE CAREER PROFESSIONALISM\nUNIT CODE\n:\n500311107\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes in promoting\ncareer growth and advancement.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Integrate personal\nobjectives with\norganizational goals\n1.1\nPersonal growth and work plans are pursued towards\nimproving the qualifications set for the profession.\n1.2\nIntra and interpersonal relationships is are maintained in the\ncourse of managing oneself based on performance\nevaluation.\n1.3\nCommitment to the organization and its goal is demonstrated\nin the performance of duties.\n2. Set and meet work\npriorities\n2.1\nCompeting demands are prioritized to achieve personal, team\nand organizational goals and objectives.\n2.2\nResources are utilized efficiently and effectively to manage\nwork priorities and commitments.\n2.3\nPractices along economic use and maintenance of equipment\nand facilities are followed as per established procedures.\n3. Maintain professional\ngrowth and\ndevelopment\n3.1\nTrainings and career opportunities are identified and\navailed of based on job requirements.\n3.2\nRecognitions are sought/received and demonstrated as\nproof of career advancement.\n3.3\nLicenses and/or certifications relevant to job and career are\nobtained and renewed.\n\n--- PDF PAGE 13 ---\nTR Biomedical Equipment Servicing NCII\n\n- 9 -\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Evaluation\n1.1\nPerformance Appraisal\n1.2\nPsychological Profile\n1.3\nAptitude Tests\n2. Resources\n2.1\nHuman\n2.2\nFinancial\n2.3\nTechnology\n2.3.1 Hardware\n2.3.2 Software\n3. Trainings and career\nopportunities\n3.1\nParticipation in training programs\n3.1.1 Technical\n3.1.2 Supervisory\n3.1.3 Managerial\n3.1.4 Continuing Education\n3.2 Serving as Resource Persons in conferences and workshops\n4. Recognitions\n4.1\nRecommendations\n4.2\nCitations\n4.3\nCertificate of Appreciations\n4.4\nCommendations\n4.5\nAwards\n4.6\nTangible and Intangible Rewards\n5. Licenses and/or\ncertifications\n5.1\nNational Certificates\n5.2\nCertificate of Competency\n5.3\nSupport Level Licenses\n5.4\nProfessional Licenses\n\n--- PDF PAGE 14 ---\nTR Biomedical Equipment Servicing NCII\n\n- 10 -\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nAttained job targets within key result areas (KRAs)\n1.2\nMaintained intra - and interpersonal relationship in the course\nof managing oneself based on performance evaluation\n1.3\nCompleted trainings and career opportunities which are based\non the requirements of the industries\n1.4\nAcquired and maintained licenses and/or certifications\naccording to the requirement of the qualification\n2. Underpinning\nknowledge\n2.1\nWork values and ethics (Code of Conduct, Code of Ethics,\netc.)\n2.2\nCompany policies\n2.3\nCompany operations, procedures and standards\n2.4\nFundamental rights at work including gender sensitivity\n2.5\nPersonal hygiene practices\n3. Underpinning skills\n3.1\nAppropriate practice of personal hygiene\n3.2\nIntra and Interpersonal skills\n3.3\nCommunication skills\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nWorkplace or assessment location\n4.2\nCase studies/scenarios\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1\nPortfolio Assessment\n5.2\nInterview\n5.3\nSimulation/Role-plays\n5.4\nObservation with questioning\n5.5\nThird Party Reports\n5.6\nExams and Tests\n6. Context of\nassessment\n6.1\nCompetency may be assessed in the work place or in a\nsimulated work place setting\n\n--- PDF PAGE 15 ---\nTR Biomedical Equipment Servicing NCII\n\n- 11 -\n\nUNIT OF COMPETENCY :\nPRACTICE OCCUPATIONAL HEALTH AND SAFETY\nPROCEDURES\nUNIT CODE\n:\n500311108\nUNIT DESCRIPTOR\n:\nThis unit covers the outcomes required to comply with regulatory\nand organizational requirements for occupational health and safety.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Identify hazards and\nrisks\n1.1\nSafety regulations and workplace safety and hazard control\npractices and procedures are clarified and explained based on\norganization procedures.\n1.2\nHazards/risks in the workplace and their corresponding\nindicators are identified to minimize or eliminate risk to co-\nworkers, workplace and environment in accordance with\norganization procedures.\n1.3\nContingency measures during workplace accidents, fire and\nother emergencies are recognized and established in\naccordance with organization procedures.\n2. Evaluate hazards and\nrisks\n2.1\nTerms of maximum tolerable limits which when exceeded will\nresult in harm or damage are identified based on threshold\nlimit values (TLV).\n2.2\nEffects of the hazards are determined.\n2.3\n OHS issues and/or concerns and identified safety hazards\nare reported to designated personnel in accordance with\nworkplace requirements and relevant workplace OHS\nlegislation.\n3. Control hazards and\nrisks\n3.1\nOccupational Health and Safety (OHS) procedures for\ncontrolling hazards/risks in workplace are consistently\nfollowed.\n3.2\nProcedures for dealing with workplace accidents, fire and\nemergencies are followed in accordance with organization\nOHS policies.\n3.3\nPersonal protective equipment (PPE) is correctly used in\naccordance with organization OHS procedures and practices.\n3.4\nAppropriate assistance is provided in the event of a workplace\nemergency in accordance with established organization\nprotocol.\n4. Maintain OHS\nawareness\n4.1\nEmergency-related drills and trainings are participated in\nas per established organization guidelines and procedures.\n4.2\nOHS personal records are completed and updated in\naccordance with workplace requirements.\n\n--- PDF PAGE 16 ---\nTR Biomedical Equipment Servicing NCII\n\n- 12 -\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Safety regulations\nMay include but are not limited to:\n1.1\nClean Air Act\n1.2\nBuilding code\n1.3\nNational Electrical and Fire Safety Codes\n1.4\nWaste management statutes and rules\n1.5\nPhilippine Occupational Safety and Health Standards\n1.6\nDOLE regulations on safety legal requirements\n1.7\nECC regulations\n2. Hazards/risks\nMay include but are not limited to:\n2.1\nPhysical hazards – impact, illumination, pressure, noise,\nvibration, temperature, radiation\n2.2\nBiological hazards- bacteria, viruses, plants, parasites, mites,\nmolds, fungi, insects\n2.3\nChemical hazards – dusts, fibers, mists, fumes, smoke,\ngasses, vapors\n2.4\nErgonomics\n• Psychological factors – over exertion/ excessive force,\nawkward/static positions, fatigue, direct pressure, varying\nmetabolic cycles\n• Physiological factors – monotony, personal relationship,\nwork out cycle\n3. Contingency\nmeasures\nMay include but are not limited to:\n3.1\nEvacuation\n3.2\nIsolation\n3.3\nDecontamination\n3.4\n(Calling designed) emergency personnel\n4. PPE\nMay include but are not limited to:\n4.1\nMask\n4.2\nGloves\n4.3\nGoggles\n4.4\nHair Net/cap/bonnet\n4.5\nFace mask/shield\n4.6\nEar muffs\n4.7\nApron/Gown/coverall/jump suit\n4.8\nAnti-static suits\n5. Emergency-related\ndrills and training\n5.1\nFire drill\n5.2\nEarthquake drill\n5.3\nBasic life support/CPR\n5.4\nFirst aid\n5.5\nSpillage control\n5.6\nDecontamination of chemical and toxic\n5.7\nDisaster preparedness/management\n6. OHS personal\nrecords\n6.1\nMedical/Health records\n6.2\nIncident reports\n6.3\nAccident reports\n6.4\nOHS-related training completed\n\n--- PDF PAGE 17 ---\nTR Biomedical Equipment Servicing NCII\n\n- 13 -\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nExplained clearly established workplace safety and hazard\ncontrol practices and procedures\n1.2\nIdentified hazards/risks in the workplace and its corresponding\nindicators in accordance with company procedures\n1.3\nRecognized contingency measures during workplace\naccidents, fire and other emergencies\n1.4\nIdentified terms of maximum tolerable limits based on\nthreshold limit value- TLV.\n1.5\nFollowed Occupational Health and Safety (OHS) procedures\nfor controlling hazards/risks in workplace\n1.6\nUsed Personal Protective Equipment (PPE) in accordance\nwith company OHS procedures and practices\n1.7\nCompleted and updated OHS personal records in accordance\nwith workplace requirements\n2. Underpinning\nknowledge\n2.1\nOHS procedures and practices and regulations\n2.2\nPPE types and uses\n2.3\nPersonal hygiene practices\n2.4\nHazards/risks identification and control\n2.5\nThreshold Limit Value -TLV\n2.6\nOHS indicators\n2.7\nOrganization safety and health protocol\n2.8\nSafety consciousness\n2.9\nHealth consciousness\n3. Underpinning\n skills\n3.1 Practice of personal hygiene\n3.2\nHazards/risks identification and control skills\n3.3\nInterpersonal skills\n3.4 Communication skills\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\n Workplace or assessment location\n4.2\nOHS personal records\n4.3\nPPE\n4.4\nHealth records\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1\nPortfolio Assessment\n5.2\nInterview\n5.3\nCase Study/Situation\n6. Context of\nassessment\n6.1\nCompetency may be assessed in the work place or in a\nsimulated work place setting\n\n--- PDF PAGE 18 ---\nTR Biomedical Equipment Servicing NCII\n\n- 14 -\n\nCOMMON COMPETENCIES\n\nUNIT OF COMPETENCY :\nIMPLEMENT AND MONITOR INFECTION- CONTROL POLICIES\nAND PROCEDURES\nUNIT CODE\n: HCS323201\nUNIT DESCRIPTOR\n:\nThis unit is concerned with infection control responsibilities of\nemployees with supervisory accountability to implement and\nmonitor infection control policy and procedures in a specific work\nunit or team within an organization. This unit does not apply to a\nrole with organization-wide responsibilities for infection control\npolicy and procedure development, implementation or monitoring.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Provide information\nto the work group\nabout the\norganization's\ninfection control\npolicies and\nprocedures\n\n1.1\nRelevant information about the organization's infection control\npolicy and procedures, and applicable industry codes of\npractice are accurately and clearly explained to the work\ngroup.\n1.2\nInformation about identified hazards and the outcomes of\ninfection risk assessments is regularly provided to the work\ngroup.\n1.3\nOpportunity is provided for the work group to seek further\ninformation on workplace infection control issues and\npractices.\n2. Integrate the\norganization's\ninfection control\npolicy and procedure\ninto work practices\n\n2.1\nInfection-control policy and procedures are implemented by\nsupervisor and members of the work group.\n2.2\nLiaison is maintained with person responsible for organization-\nwide infection control.\n2.3\nThe Supervisor's coaching support ensures that\nindividuals/teams are able to implement infection control\npractices.\n2.4\nWork procedures are adopted to reflect appropriate infection\ncontrol practice.\n2.5\nIssues raised through consultation are dealt with and resolved\npromptly or referred to the appropriate personnel for\nresolution.\n2.6\nWorkplace procedures for dealing with infection control risks\nand hazardous events are implemented whenever necessary.\n2.7\nEmployees are encouraged to report infection risks and to\nimprove infection control procedures.\n\n--- PDF PAGE 19 ---\nTR Biomedical Equipment Servicing NCII\n\n- 15 -\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n3. Monitor infection\ncontrol performance\nand implement\nimprovements in\npractices\n\n3.1\nInfection control hazardous events are investigated promptly\nto identify their cause in accordance with organization policy\nand procedures.\n3.2\nWork procedures to control infection risks are monitored to\nensure compliance.\n3.3\nWork procedures are regularly reviewed and adjusted to\nensure improvements in infection control practice.\n3.4\nSupervisor provides feedback to team and individuals on\ncompliance issues, changes in work procedures and infection\ncontrol outcomes.\n3.5\nTraining in work procedures is provided as required to ensure\nmaintenance of infection control standards.\n3.6\nInadequacies in work procedures and infection control\nmeasures are identified, corrected or reported to designated\npersonnel.\n3.7\nRecords of infection control risks and incidents are accurately\nmaintained as required.\n3.8\nAggregate infection control information reports are used to\nidentify hazards, to monitor and improve risk control methods\nand to indicate training needs.\n\n--- PDF PAGE 20 ---\nTR Biomedical Equipment Servicing NCII\n\n- 16 -\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Infection Control\nPolicies and\nProcedures\nThis may include but not limited to:\n1.1\nCleaning procedures and schedules\n1.2\nCleaning agents\n1.3\nCleaning equipment\n1.4\nHandling, storage and disposal of all types of waste\n1.5\nFood handling and food safety\n1.6\nHygiene procedures\n1.7\nInfection control risk management\n1.8\nInfection control incident and hazard reporting\n1.9\nSterilizing\n1.10 Linen production and handling\n1.11 Maintenance procedures\n1.12 Storage requirements\n1.13 Personal protective clothing\n1.14 Work flows\n1.15 Management of blood and body fluid spills\n1.16 Single use of disposables\n1.17 Aseptic techniques\n1.18 Skin preparation procedures\n1.19 Immunization\n1.20 Needle stick injuries\n1.21 Personal contact with infectious patients\n1.22 Standard and additional precautions\n1.23 Confidentiality\n1.24 Employee training\n1.25 Contractors\n 2. Industry Codes of\nPractice\n2.1\nNational Health and Medical Research Council Guidelines for\ninfection control\n2.2\nLocal & National Government Guidelines and Standards\n2.3\nManufacturer's recommendations and operating manuals\n3. Identified hazards\nand the outcomes of\ninfection risk\nassessments\n3.1\nSharps\n3.2\nGlass\n3.3\nWaste\n3.4\nHuman waste and human tissues\n3.5\nPersonal contact with infectious patients\n3.6\nAnimals, insects and vermin\n3.7\nStock, including food, which has passed \"used-by\" dates.\n3.8\nIncorrect concentration of disinfectants and chemicals\n3.9\nCleaning procedures\n\n--- PDF PAGE 21 ---\nTR Biomedical Equipment Servicing NCII\n\n- 17 -\n\nVARIABLE\nRANGE\n3.10 Linen handling procedures\n3.11 Work flows\n3.12 Use of personal protective clothing\n3.13 Food safety\n3.14 Personal hygiene\n4. Infection Control\nMonitoring\nProcedures\n4.1\nObservations\n4.2\nInterviews\n4.3\nSurveys and inspections\n4.4\nQuality assurance activities\n4.5\nReview of outcomes\n4.6\nData analysis\n5. Designated\nPersonnel\n5.1\nManager\n5.2\nInfection Control Coordinator\n5.3\nQuality Improvement Coordinator\n5.4\nInfection Control Committee\n5.5\nOccupational Health and Safety Committee\n6. Aggregate Infection\nControl Information\n6.1\nRecords of needle stick injuries\n6.2\nHospital-acquired infection rates\n6.3\nDOH healthcare standards clinical indicators\n6.4\nHACCP records\n6.5\nHazard reports\n\n--- PDF PAGE 22 ---\nTR Biomedical Equipment Servicing NCII\n\n- 18 -\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nCommunicated with team and individuals on organizational\npolicy and procedures for infection control\n1.2\nApplied infection control policies and procedures which impact\non work processes of the specific work unit\n1.3\nApplied procedures for adopting appropriate infection\npractices within work unit\n1.4\nProvided appropriate supervision of work group\n2. Underpinning\nknowledge\n2.1\nWorking knowledge, consistent with the elements of\ncompetence, of the organization's applicable infection control\npolicy and procedures and relevant industry codes of practice\n2.2\nThe hierarchy risk control measures from most to least\npreferred, that is, elimination, engineering controls,\nadministrative control, and lastly, personal protective\nequipment\n2.3\nKnowledge of infection risks and control measures in specific\nwork unit and related work processes\n2.4\nThe significance of patient confidentiality in relation to\ninfection control\n2.5\nThe significance of other management systems and\nprocedures for infection control\n2.6\nLiteracy levels and communication skills of work group\nmembers and consequent suitable communication techniques\n2.7\nOrganizational procedures for monitoring, training\n2.8\nBasic understanding of communicable disease transmission\n3. Underpinning skills\n3.1\nEffective communication and interpersonal skills including:\n language competence\n literacy and reading competence\n3.2\nNegotiation\n3.3\nWork planning and management\n3.4\nManagement of change of work processes\n3.5\nMonitoring compliance with policy and procedures\n3.6\nMaintain and interpret infection control records\n4. Resource\nimplications\nThe following resources MUST be provided\n4.1\nWorkplace infection control and health and safety policies and\nprocedures\n4.2\nWaste management procedures\n4.3\nFood safety procedures\n4.4\nOther organizational policies and procedures\n4.5\nDuties statements and/or job descriptions\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1\nObservation with questioning\n5.2\nInterview\n5.3\nPortfolio\n5.4\nDemonstration with questioning\n6. Context of\nassessment\n6.1 Assessment may be done in the workplace or in a simulated\nworkplace setting.\n\n--- PDF PAGE 23 ---\nTR Biomedical Equipment Servicing NCII\n\n- 19 -\n\nUNIT OF COMPETENCY :\nRESPOND EFFECTIVELY TO DIFFICULT/ CHALLENGING\nBEHAVIOR\nUNIT CODE : HCS323202\nUNIT DESCRIPTOR\n: This unit of competency covers the knowledge, skills and attitudes\nrequired to effectively respond to difficult or challenging behaviour\nof patients.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Plan responses\n1.1\nResponses are planned to instances of difficult or\nchallenging behavior to maximize the availability of other\nappropriate staff and resources.\n1.2\nSpecific manifestations of difficult or challenging behavior\nare identified and strategies appropriate to these behaviors\nare planned as required.\n1.3\nSafety of self and others is given priority in responding to\ndifficult or challenging behavior according to institutional\npolicies and procedures.\n2. Apply response\n2.1\nDifficult or challenging behavior is dealt with promptly, firmly\nand diplomatically in accordance with institutional policy\nand procedures.\n2.2\nCommunication is used effectively to achieve the desired\noutcomes in responding to difficult or challenging behavior.\n2.3\nAppropriate strategies are selected to suit particular\ninstances of difficult or challenging behavior.\n3. Report and review\nincidents\n3.1\nIncidents are reported according to institutional policies and\nprocedures.\n3.2\nIncidents are reviewed with appropriate staff and suggestions\nappropriate to area of responsibility are made.\n3.3\nDebriefing mechanisms and other activities are used and\nparticipated in.\n3.4\nAdvice and assistance is sought from legitimate sources when\nappropriate.\n\n--- PDF PAGE 24 ---\nTR Biomedical Equipment Servicing NCII\n\n- 20 -\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Planned responses\n1.1\nOwn ability and experience\n1.2\nEstablished institutional procedures\n1.3\nKnowledge of individual persons and underlying causes\n2. Difficult or\nchallenging behaviors\n2.1\nAggression/Assaultive behavior\n2.2\nConfusion or other cognitive impairment\n2.3\nNoisiness\n2.4\nManipulative\n2.5\nWandering\n2.6\nSelf-destructive\n2.7\nIntoxication\n2.8\nWithdrawn/depressed\n2.9\nNegativistic\n2.10 Intrusive behavior\n2.11 Verbal offensiveness\n3. Strategies for dealing\nwith challenging\nbehaviors\n3.1\nDiversional activities\n3.2\nReferring to appropriate personnel e.g. supervisor, security\nofficer\n3.3\nFollowing established emergency response procedures\n4. Selection of\nstrategies for dealing\nwith challenging\nbehaviors\n4.1\nThe nature of the incident\n4.2\nPotential effect on different parties, patient, staff and others\n4.3\nEstablished procedures and guidelines\n5. Institutional policies\nand procedures\n5.1\nIncident reporting and documentation\n5.2\nOperational guidelines for handling incidents and/or cases\ninvolving difficult and challenging behavior\n5.3\nDebriefing of staff involved in the incident\n\n--- PDF PAGE 25 ---\nTR Biomedical Equipment Servicing NCII\n\n- 21 -\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nIdentified specific manifestations of difficult or challenging\nbehavior and strategies are planned, selected and applied as\nrequired\n1.2\nMaintained personal safety and the safety of others\n1.3\nReported incidents, reviewed and responded quickly and\neffectively to contingencies\n1.4\nDebriefing mechanisms are used\n2. Underpinning\nknowledge\n2.1\nOSH and issues relating to difficult and challenging behavior\n2.2\nPatient issues which need to be referred to an appropriate\nhealth professional\n2.3\nAbility to interpret and follow the instructions and guidance of\nhealth professionals involved with the care of patient/client\n3. Underpinning skills\n3.1\nEffectively using techniques for monitoring own service area\nincluding client satisfaction\n3.2\nSpeaking in a firm, diplomatic and culturally appropriate\nmanner\n3.3\nRemaining calm and positive in adversity\n3.4\nThinking and responding quickly and strategically\n3.5\nRemaining alert to potential incidents of difficult or challenging\nbehavior\n3.6\nMonitoring and/or maintaining security equipment\n3.7\nWorking with others and displaying empathy with patient and\nrelatives\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nAccess to relevant workplace or appropriately simulated\nenvironment where assessment can take place\n4.2\nRelevant institutional policy, guidelines, procedures and\nprotocols\n4.3\nEmergency response procedures and employee support\narrangements\n5. Method of\nassessment\nCompetency MUST be assessed through:\n5.1\nObservation with questioning\n5.2\nDemonstration with questioning\n6. Context of\nassessment:\n6.1\nAssessment may be done in the workplace or in a simulated\nworkplace setting.\n\n--- PDF PAGE 26 ---\nTR Biomedical Equipment Servicing NCII\n\n- 22 -\n\nUNIT OF COMPETENCY :\nAPPLY BASIC FIRST AID\nUNIT CODE\n:\nHCS323203\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes required to\nprovide an initial response where First Aid is required. In this unit it\nis assumed that the First Aider is working under supervision and / or\naccording to established workplace First Aid procedures and\npolicies\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Assess the situation\n1.1\n Physical hazards to self and casualty’s health and safety are\nidentified.\n1.2\nImmediate risks to self and casualty’s occupational health\nand safety (OSH )are minimized by controlling the hazard in\naccordance with OSH requirements.\n1.3\nCasualty’s vital signs and physical condition are assessed in\naccordance with workplace procedures.\n2. Apply basic first aid\ntechniques\n2.1\nFirst Aid management is provided in accordance with\nestablished First Aid procedures.\n2.2\nCasualty is reassured in a caring and calm manner and made\ncomfortable using available resources.\n2.3\nFirst Aid assistance is sought from others in a timely manner\nand as appropriate.\n2.4\nCasualty’s condition is monitored and responded to in\naccordance with effective First Aid principles and workplace\nprocedures.\n2.5\nDetails of casualty’s physical condition, changes in conditions,\nmanagement and response are accurately recorded in line\nwith organizational procedures.\n2.6\nCasualty management is finalized according to his/her needs\nand First Aid principles.\n3. Communicate details\nof the incident\n3.1\nAppropriate medical assistance is requested using relevant\ncommunication media and equipment.\n3.2\nDetails of casualty’s condition and management activities are\naccurately\nconveyed\nto\nemergency\nservices/relieving\npersonnel.\n3.3\nReports to supervisors are prepared in a timely manner,\npresenting all relevant facts according to established company\nprocedures.\n\n--- PDF PAGE 27 ---\nTR Biomedical Equipment Servicing NCII\n\n- 23 -\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. First Aid\nManagement\nThis may include but not limited to:\n1.1\nWorkplace policies and procedures\n1.2\nIndustry/site specific regulations, codes\n1.3\nOSH\n1.4\nState and territory workplace health and safety requirements\n1.5\nAllergies the casualty may have\n2. Physical Hazards\nPhysical hazards may include:\n2.1\nWorkplace hazards\n2.2\nEnvironmental hazards\n2.3\nProximity of other people\n2.4\nHazards associated with casualty management processes\n3. Risks\nRisks may include:\n3.1\nWorksite equipment, machinery and substances\n3.2\nEnvironmental risks\n3.3\nBodily fluids\n3.4\nRisk of further injury to the casualty\n3.5\nRisk associated with the proximity of the others and\nbystanders\n4. Casualty’s Condition\nCasualty’s condition may include but not limited to the following:\n4.1\nAbdominal injuries\n4.2\nAllergic reactions\n4.3\nBleeding\n4.4\nBurns-thermal, chemical, friction, electrical\n4.5\nCardiac conditions\n4.6\nChemical contamination\n4.7\nCod injuries\n4.8\nCrush injuries\n4.9\nDislocations\n4.10 Drowning\n4.11 Eye injuries\n4.12 Fractures\n4.13 Head injuries\n4.14 Epilepsy\n4.15 Minor skin injuries\n4.16 Neck and spinal injuries\n4.17 Needle stick injuries\n4.18 Poisoning and toxic substances\n4.19 Shock\n4.20 Smoke inhalation\n\n--- PDF PAGE 28 ---\nTR Biomedical Equipment Servicing NCII\n\n- 24 -\n\nVARIABLE\nRANGE\n5. Equipment and\nResources\nEquipment and other resources may include:\n5.1\nDefibrillation units\n5.1\nPressure bandages\n5.2\nThermometers\n5.3\nFirst Aid kit\n5.4\nEyewash\n5.5\nThermal blankets\n5.6\nPocket face masks\n5.7\nRubber gloves\n5.8\nDressing\n5.9\nSpace device\n5.10 Cervical collars\n6. Communication\nsystem\n6.1\nMobile phone\n6.2\nSatellite phones\n6.3\nHF/VHF radio\n6.4\nFlags\n6.5\nFlares\n6.6\nTwo - way radio\n6.7\nEmail\n6.8\nElectronic equipment\n7. Vital signs\n7.1\nBreathing\n7.2\nCirculation\n7.3\nConsciousness\n8. First Aid Principles\n8.1\nChecking the site for danger to self, casualty’ and others and\nminimizing the danger\n8.2\nChecking and maintaining the casualty’s airways, breathing\nand circulation\n\n--- PDF PAGE 29 ---\nTR Biomedical Equipment Servicing NCII\n\n- 25 -\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nComplied with institutional requirements, OSH laws infections\ncontrol and manual handling procedures and relevant health\nregulations\n1.2\nIdentified physical hazards of the casualty and minimized\nimmediate risks\n1.3\nAssessed and monitored the physical condition of the casualty\n1.4\nResponded to emergency using basic life support measures.\n1.5\nProvided initial response where First Aid is required\n1.6\nDealt with complex casualties or incident\n1.7\nPrepared reports to concerned personnel in a timely manner\n2. Underpinning\nknowledge\n2.1\nBasic anatomy and physiology\n2.2\nCompany standard operating procedures (SOPs)\n2.3\nDealing with confidentiality\n2.4\nKnowledge of the First Aiders’ skills limitations\n2.5\nOSH legislation and regulations\n2.6\nHow to gain access to and interpret material safety data\nsheets\n3. Underpinning skills\n3.1\nResuscitation\n3.2\nSafe manual handling of casualty\n3.3\nConsideration of the welfare of the casualty\n3.4\nReport preparation\n3.5\nCommunication skills\n3.6\nAbility to interpret and use listed documents\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nAccess to relevant work station\n4.2\nRelevant institutional policies, guidelines procedure and\nprotocol\n4.3\nEquipment and materials relevant to the proposed activities\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1\nDemonstration with questioning\n5.2\nInterview\n5.3\nThird Party Report\n5.4\nPortfolio\n6. Context of\nassessment\n6.1\nAssessment may be done in a workplace or simulated work\narea setting.\n\n--- PDF PAGE 30 ---\nTR Biomedical Equipment Servicing NCII\n\n- 26 -\n\nUNIT OF COMPETENCY :\nMAINTAIN HIGH STANDARDS OF PATIENT SERVICES\nUNIT CODE\n:\nHCS323204\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes required in the\nmaintenance of high standards of patient services.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Communicate\nappropriately with\npatients\n1.1\nEffective communication strategies and techniques are\nidentified and used to achieve best patient service outcomes.\n1.2\nComplaints are responded to in accordance with\norganizational policy to ensure best service to patients.\n1.3\nComplaints are dealt with in accordance with established\nprocedures.\n1.4\nInterpreter services are accessed as required.\n1.5\nAction is taken to resolve conflicts either directly, where a\npositive outcome can be immediately achieved, or by referral\nto the appropriate personnel.\n1.6\nParticipation in work team is constructive and collaborative\nand demonstrates an understanding of own role.\n2. Establish and\nmaintain good\ninterpersonal\nrelationship with\npatients\n2.1\nRapport is established to ensure the service is appropriate to\nand in the best interests of patients.\n2.2\nEffective listening skills are used to ensure a high level of\neffective communication and quality of service.\n2.3\nPatient concerns and needs are correctly identified and\nresponded to responsibly and accordingly established\nprocedures and guidelines.\n2.4\nEffectiveness of interpersonal interaction is consistently\nmonitored and evaluated to ensure best patient service\noutcomes.\n3. Act in a respectful\nmanner at all times\n3.1\nRespect for differences is positively, actively and\nconsistently demonstrated in all work.\n3.2\nConfidentiality and privacy of patients is maintained.\n3.3\nCourtesy is demonstrated in all interactions with patients, their\nvisitors, carers and family.\n3.4\nAssistance with the care of patients with challenging\nbehaviors is provided in accordance with established\nprocedures.\n3.5\nTechniques are used to manage and minimize aggression.\n4. Evaluate own work to\nmaintain a high\nstandard of patient\nservice\n4.1\nAdvice and assistance is received or sought from appropriate\nsources on own performance.\n4.2\nOwn work is adjusted, incorporating recommendations that\naddress performance issues, to maintain the agreed standard\nof patient support.\n\n--- PDF PAGE 31 ---\nTR Biomedical Equipment Servicing NCII\n\n- 27 -\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Patients\nThis may include but not limited to:\n1.1\nPatients\n1.2\nProspective patients to the service or services\n1.3\nPatients may be in contact with the institution through\nappropriate health care personnel and professionals or other\nadvocates or agencies\n2. Others with whom\ninteraction is required\nin regard to patient\nservices\n2.1\nOther staff and team members\n2.2\nService units or departments\n2.3\nFamily members, carers and friends of patients\n2.4\nProfessional representatives or agents of patients such as:\n Medical specialists\n Nurses\n Social workers\n Dietitians\n Therapists\n Allied health professionals\n Volunteers\n Teachers and/or spiritual\n Community\n2.5\nGeneral public\n3. Communication\n3.1\nEnglish/Tagalog/vernacular\n3.2\nSign language\n3.3\nThrough an interpreter\n3.4\nCommunity language as required by the service / organization\n4. Modes of\ncommunication\n4.1\nContinuing interaction with patients and clients\n4.2\nVerbal conversations either in person or via telephone\n4.3\nWritten notes by post or electronic media\n4.4\nWorker, family member friend or professional interpreter who\nhas relevant languages\n5. Respect for\ndifference\n5.1\nPhysical\n5.2\nCognitive/mental or intellectual issues that may impact on\ncommunication\n5.3\nCultural and ethnic\n5.4\nReligious/spiritual\n5.5\nSocial\n5.6\nAge\n5.7\nLanguage literacy and numeracy abilities\n5.8\nSexuality and sexual preference\n\n--- PDF PAGE 32 ---\nTR Biomedical Equipment Servicing NCII\n\n- 28 -\n\nVARIABLE\nRANGE\n6. Confidentiality and\nprivacy of patients\n6.1\nFees\n6.2\nHealth fund entitlements\n6.3\nWelfare entitlements\n6.4\nPayment methods and records\n6.5\nPublic environments\n6.6\nLegal and ethical requirements\n6.7\nWriting details i.e. medical and consent forms\n6.8\nConversations on the telephone\n6.9\nSecure location for written records\n6.10 Offering a private location for discussions\n6.11 Information disclosed to an appropriate person consistent with\none’s level of responsibility\n7. Performance\nmonitoring\n7.1\nSelf-monitoring\n7.2\nSupervisor assessment\n7.3\nPatient feedback\n\n--- PDF PAGE 33 ---\nTR Biomedical Equipment Servicing NCII\n\n- 29 -\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nCommunicated appropriately with patients\n1.2\nHandled complaints and resolved conflict, or referred matters\nto supervisors when required\n1.3\nComplied with relevant policies, protocols, guidelines and\nprocedures of the organization\n1.4\nEstablished and maintained good interpersonal relationship\nwith patients\n1.5\nDemonstrated courtesy in all interactions with patients, their\nvisitors, and family\n2. Underpinning\nknowledge\n2.1\nRoles and responsibilities of self and other workers within the\norganization\n2.2\nWhen client/patient issues need to be referred to an\nappropriate health professional\n2.3\nOrganizational policies and procedures for privacy and\nconfidentiality of information provided by patients and others\n2.4\nKnowledge of cultures relevant to the particular service\n2.5\nInstitutional policy on patient rights and responsibilities\n3. Underpinning skills\n3.1\nEstablishing and maintaining relationships, taking into account\nindividual differences\n3.2\nUsing effective listening techniques\n3.3\nUsing appropriate verbal and non verbal communication styles\n3.4\nInterpreting and following the instructions and guidance of\nhealth professionals involved with the care of patient/clients\n3.5\nOral and written communication\n3.6\nProblem solving skills required include the ability to use\navailable resources and prioritise workload\n3.7\nDealing with conflict\n3.8 Working with others and displaying empathy with patient and\nrelatives\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nAccess to relevant workplace or appropriately simulated\nenvironment where assessment can take place\n4.2\nRelevant government and organizational policy, guidelines,\nprocedures and protocols\n4.3 Any relevant legislation in relation to service delivery\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1\nDemonstration with questioning\n5.2\nInterview\n5.3\nThird party report\n6. Context of\nassessment\n6.1\nAssessment may be done in a simulated workplace setting\n\n--- PDF PAGE 34 ---\nTR Biomedical Equipment Servicing NCII\n\n- 30 -\n\nCORE COMPETENCIES\n\nUNIT OF COMPETENCY :\nINSTALL BIOMEDICAL EQUIPMENT\nUNIT CODE\n:\nHCS311301\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes necessary to\ninstall biomedical equipment related to patient care.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Interpret work\ninstructions\n1.1\nWork instructions are read and interpreted to determine job\nrequirements.\n1.2\nTools and testing devices needed to carry out the\ninstallation work are selected in accordance with established\nprocedures and checked for correct operation and safety.\n1.3\nMaterials necessary to complete the work are obtained in\naccordance with job requirements.\n2. Install equipment and\naccessories\n2.1\nEquipment and components are prepared for correct\nsequential installation.\n2.2\nOSH policies and procedures for installation are followed\naccording to manufacturer’s specifications.\n2.3\nPPE is used according to institution’s requirements.\n2.4\nElectrical cabling and wiring devices of correct loading\ncapacity are selected and safely installed according to\nNational Electrical Code.\n2.5\nEquipment is installed in accordance with manufacturer’s\ninstructions, requirements, and without damage to self and\nothers or surrounding place or environment.\n2.6\nUnplanned events or conditions are responded to in\naccordance with established institutional procedures.\n3. Test installed\nequipment and\naccessories\n3.1\nEquipment is tested in accordance with manufacturer’s\ninstructions.\n3.2\nFinal inspections are undertaken to ensure that the installed\ndevice conforms with manufacturer’s instructions.\n3.3\nWork site is cleaned and cleared of all debris and left safe in\naccordance with the institution’s requirements.\n3.4\nReport on installation and testing of equipment is prepared\nand submitted according to institution’s procedures.\n3.5\nEndorse equipment to appropriate end user according to\ninstitution’s requirements.\n\n--- PDF PAGE 35 ---\nTR Biomedical Equipment Servicing NCII\n\n- 31 -\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Tools\nTools for: cutting, shaping, drilling, threading, tapping, finishing,\ndismantling/assembling. Tool set includes but is not limited to:\n1.1\nPliers; (assorted)\n1.2\nScrewdrivers; (assorted)\n1.3\nSoldering gun/iron\n1.4\nElectric drill and assorted bits\n1.5\nTool kit\n1.6\nWrench and spanners (spanners)\n1.7\nStaple gun\n2. Testing devices\nInclude but are not limited to:\n2.1\nMulti-tester\n2.2\nSignal generator\n2.3\nOscilloscope\n2.4\nCalibrators\n2.5\nGauges (assorted)\n3. Materials\nInclude but are not limited to:\n3.1\nTape (assorted)\n3.2\nSealing materials\n3.3\nCables\n3.4\nWires\n3.5\nSoldering Lead\n3.6\nWire tie\n4. Equipment\nEquipment includes but not limited to:\n4.1\nWeighing scale, Infant/Adult\n4.2\nClinical weighing scale\n4.3\nGooseneck lamp/Examining light\n4.4\nOxygen gauge\n4.5\nSphygmomanometer\n4.6\nSuction apparatus\n4.7\nAutoclave\n4.8\nOR/DR light\n4.9\nOR table\n4.10 Nebulizer\n4.11 Rotator/Shaker\n4.12 Electromuscular stimulator\n4.13 Spectrophotometer\n4.14 Uninterruptible power supply\n4.15 Bag valve mask (Pedia and Adult)\n4.16 Anesthesia bag\n4.17\nClinical oven\n5. Personal protection\nequipment\nIncludes but is not limited to:\n5.1\nIndustrial Mask\n5.2\nSafety goggles\n5.3\nCoveralls\n5.4\nGloves\n5.5\nShoe cover\n6. OSH policies and\nprocedures\n6.1\nNational Electrical Code\n6.2\nOSH guidelines\n6.3\nPhilippine environmental standards\n\n--- PDF PAGE 36 ---\nTR Biomedical Equipment Servicing NCII\n\n- 32 -\n\nVARIABLE\nRANGE\n7. Unplanned events or\nconditions\nInclude but are not limited to:\n7.1\nFire\n7.2\nFlood\n7.3\nEarthquake\n7.4\nElectrical shock\n7.5\nPower interruption\n7.6\nPower overload\n7.7\nAlert levels\n8. Worksite\nIncludes but not limited to:\n8.1\nLaboratory\n8.2\nClinics\n8.3\nOperating room/Delivery room\n8.4\nWards/Units\n8.5\nEmergency room\n\n--- PDF PAGE 37 ---\nTR Biomedical Equipment Servicing NCII\n\n- 33 -\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nInterpreted work instructions according to job requirements\n1.2\nAppropriately selected electrical cabling and wiring devices\nused\n1.3\nInstalled equipment in accordance with manufacturer’s\ninstructions\n1.4\nTested installed equipment according to manufacturer’s\ninstructions\n2. Underpinning\nknowledge\n2.1\nOccupational safety and health guidelines\n2.2\nSpecifications and proper use of tools\n2.3\nGeneral concepts and principles in electronics and electricity\n2.3.1 AC/DC power supplies\n2.3.2 Operational amplifiers\n2.3.3 Digital electronics\n2.3.4 Wiring techniques\n2.4\nUse of test equipment and/ or instruments\n2.5\nClinical application of equipment/instruments/tools\n2.6\nDrawing interpretation\n2.7\nElectronic hand soldering\n2.8\nKnowledge in computer\n3. Underpinning skills\n3.1\nReading skills required to interpret work instructions,\ndiagrams, schematics\n3.2\nCommunication skills needed to interpret, define and explain\nwork procedures\n3.3\nProblem solving in emergency situation(s)\n3.4\nSoldering skills\n3.5\nTroubleshooting\n3.6\nCourtesy and helping attitude\n3.7\nUse of computer\n4. Method of\nassessment\nCompetency may be assessed through:\n4.1\nObservation with questioning\n4.2\nInterview\n4.3\nDemonstration with questioning\n4.4\nThird party assessment\n4.5\nPortfolio\n5. Resource\nimplications\nThe following resources MUST be provided:\n5.1\nTools\n5.2\nTest equipment and instruments\n5.3\nMaterials\n5.4\nWork station\n5.5\nJob orders/requests\n6. Context of\nassessment\n6.1\nAssessment may be conducted in the workplace or in a\nsimulated environment\n\n--- PDF PAGE 38 ---\nTR Biomedical Equipment Servicing NCII\n\n- 34 -\n\nUNIT OF COMPETENCY :\nPERFORM CORRECTIVE MAINTENANCE ON BIOMEDICAL\nEQUIPMENT\nUNIT CODE\n:\nHCS311302\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitude required in\nconducting corrective maintenance.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Respond to\nclient/customer\nservice request\n1.1 Appropriate request form is received in\n accordance with institution protocols.\n1.2\nCovered biomedical equipment is identified.\n1.3\nPrompt service is conducted on-site or in the workshop.\n2. Prepare\nunit/equipment\n2.1.\nComplete assembly check-up and fault symptoms are\nconducted, identified, and verified against client description\nand properly documented.\n2.2.\nRepair history is verified in line with the institution procedures.\n2.3.\nService manuals and service information required for the\ncorrective maintenance are made available at the beginning of\nthe corrective maintenance activities.\n2.4.\nWorkplace is cleaned in accordance with the institution\nprocedure.\n2.5.\nNecessary tools, test instrument and personal protective\nequipment are prepared in line with job requirement.\n3. Diagnose faults\n3.1.\nSystematic pre-testing procedure is observed in accordance\nwith manufacturer’s instruction.\n3.2.\nSystem detect is identified using appropriate tools and test\nequipment and in accordance with organizational policies and\nprocedures.\n3.3.\nAccurate diagnosis is completed within the specified\ntimeframe.\n3.4.\nDiagnosis and findings of basic biomedical equipment failures\nor technical problems are completely and accurately\ndocumented in accordance with institution standard.\n3.5\nFault/s, defects and range of the problems are properly and\ncourteously explained to the client in accordance with\ninstitution policy.\n4. Repair biomedical\nequipment\n4.1\nSafety equipment is used to protect self and others in\naccordance with established Occupational Health and Safety\npractices.\n4.2\nDefective spare parts/components are replaced with\nequivalent and/or better performing spare parts/components.\n4.3\nRepair and/or replaced parts/components are soldered in\naccordance to current best industry practice.\n4.4\nNecessary circuit adjustment, re-calibration and testing\n\n--- PDF PAGE 39 ---\nTR Biomedical Equipment Servicing NCII\n\n- 35 -\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\nprocedure is done and in conformance with equipment\nmanufacturer specification standards.\n4.5\nNecessary modification, conversion of parts and/or circuits is\napplied in accordance with industry best practice and\nequipment manufacturer specifications.\n4.6\nSpare parts substitution is in accordance with the\nmanufacturer’s specification or equivalent.\n4.7\nCorrective maintenance activity is accomplished within the\nrequired time frame.\n4.8\nCare and extreme precaution in handling the unit is observed.\n5. Reassemble and test\nrepaired unit\n5.1\nPerformance and functional test is conducted immediately\nafter re-assembly.\n5.2\nEquipment status and performance is checked and ensured\nconformance with equipment manufacturer standard and other\nhealth safety regulations.\n5.3\nComplete and accurate documentation is prepared.\n5.4\nTools and test instrument are cleaned and cared as per\norganizational procedure.\n5.5\nWaste materials are disposed in accordance with hospital\nwaste management and other environmental requirements.\n6. Re-commission\nbiomedical\nequipment\n6.1.\nBasic biomedical equipment and its immediate surrounding\nare cleaned in accordance with institution policy.\n6.2.\nAppropriate staff is communicated on the status of the\nequipment as per institution standards.\n7. Perform and maintain\nbiomedical\nequipment corrective\nmaintenance\ndocumentation.\n7.1\nHealth care equipment corrective maintenance form and other\nrelevant reports are accomplished in strict observance of\ninstitution standards.\n7.2\nReports are submitted to proper officer/offices in accordance\nwith institution policy.\n7.3\nCorrective maintenance documents are systematically kept\nand updated as per institution standards.\n\n--- PDF PAGE 40 ---\nTR Biomedical Equipment Servicing NCII\n\n- 36 -\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Appropriate request\nform\n1.1\nProper service request form\n1.2\nFormal service request letter\n1.3\nVerbal service request (actual or phone)\n1.4\nElectronic communication equipment\n2. Biomedical\nequipment\n2.1\nWeighing scale; Infant/digital\n2.2\nClinical weighing scale\n2.3\nGooseneck lamp/Examining light\n2.4\nOxygen gauge\n2.5\nSphygmomanometer\n2.6\nSuction apparatus\n2.7\nAutoclave\n2.8\nOR/DR light\n2.9\nOR table\n2.10 Nebulizer\n2.11 Rotator/Shaker\n2.12 Electromuscular stimulator\n2.13 Spectrophotometer\n2.14 Uninterrupted power supply\n2.15 Bag valve mask (Pedia and Adult)\n2.16 Anesthesia bag\n2.17 Clinical oven\n3. Service manuals and\ninformation\n3.1\nOperation’s Manuals\n3.2\n Service/Technical Manual\n3.3\n Installation Manual\n3.4\nParts List Manual\n3.5\nJob Report Sheets\n3.6\n Job Request/Order\n3.7\nSpare-Parts List Replacement Guide Book\n3.8\n Requisition Slip\n3.9\nEquipment History Card\n3.10 Supplier Index\n\n--- PDF PAGE 41 ---\nTR Biomedical Equipment Servicing NCII\n\n- 37 -\n\nVARIABLE\nRANGE\n4. Tools and test\ninstrument\nIncludes but not limited to:\n4.1\nScrewdrivers (assorted)\n4.2\nSoldering iron/gun\n4.3\nDe-soldering tool\n4.4\nWrenches (assorted)\n4.5\nPliers (assorted)\n4.6\nCleaning Brush\n4.7\nThermometer (digital & mercurial)\n4.8\nElectrical Safety Analyzer\n4.9\nMulti-tester (analog/digital)\n4.10 Utility knife\n4.11 Hammer (Shock less/mechanical)\n4.12 Alignment tool\n5. Personal Protective\nEquipment\n5.1\nWork clothes\n5.2\nHand gloves\n5.3\nGoggles\n5.4\nMask\n5.5\nShoe cover\n6. Environment\nrequirement\n6.1\nDOH Hospital Waste Management Circular\n6.2\nDENR Circular\n\n--- PDF PAGE 42 ---\nTR Biomedical Equipment Servicing NCII\n\n- 38 -\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nDemonstrate efficient application of effective troubleshooting\ntechnique.\n1.2\nDemonstrate effective testing of parts and components\n1.3\nDemonstrate quality corrective service.\n1.4\nDemonstrate the proper procedures in equipment testing\nelectrical safety, calibration, cleaning and basic biomedical\nequipment disinfecting.\n1.5\nDemonstrate the conversion, substitution, modification of parts\nand circuits and in compliance with basic biomedical\nequipment manufacturer standards and established\noccupational health safety regulations.\n1.6\nDemonstrate the use of proper use of tools, test equipment\nand other equipment properly.\n1.7\nDemonstrate proper interpretation of service manual\nspecification/instructions.\n1.8\nIdentify faults and problem accurately.\n1.9\nReceive service request promptly and courteously.\n1.10 Correct the basic biomedical equipment problem accurately\nand properly within the established timeframe.\n1.11 Document the required corrective maintenance works\naccurately.\n2. Underpinning\nknowledge\n2.1\nGeneral knowledge on the human physiology and anatomy\nsystem on the covered basic biomedical equipment.\n2.2\nGeneral knowledge on the block and schematic diagrams and\nother essential circuits and components of the covered basic\nbiomedical equipment.\n2.3\nGeneral knowledge on the various mechanical, pneumatic,\nelectronic and electrical and components used directly or\nindirectly in the covered basic biomedical equipment.\n2.4\nGeneral knowledge on efficient application of effective\ntroubleshooting technique.\n2.5\nGeneral knowledge on the principle of operation, operating\nrequirement, essential parts and functions of the covered\nbasic biomedical equipment.\n2.6\nGeneral knowledge on the special safety precautions and the\nestablished Occupational Health and Safety Practices.\n2.7\nGeneral knowledge on the technical specification, reading and\ninterpreting diagrams, troubleshooting technique,\nmaintenance management, spare parts suppliers and list of\ntechnical persons capable to assist in the corrective\n\n--- PDF PAGE 43 ---\nTR Biomedical Equipment Servicing NCII\n\n- 39 -\n\nmaintenance of the covered basic biomedical equipment.\n2.8\nGeneral knowledge on the use of mathematics, physics,\nelectrical, electronics, pneumatic, hydraulic, mechanical and\nother related subjects use to solve the technical problem on\nthe covered basic biomedical equipment.\n2.9\nGeneral knowledge on various types and models and the\ndistinctions between one unit with the other of the covered\nbasic biomedical equipment.\n2.10 Knowledge in computer\n3. Underpinning skills\n3.1\nEffective client human relations and communications.\n3.2\nEffective information gathering with the client, peers,\nequipment service engineers/staff and supervisors relevant in\nthe corrective maintenance activity.\n3.3\nEffective and efficient work and safety practices.\n3.4\nEffective data analysis.\n3.5\nEffective work safety practices and time management.\n3.6\nEffective documentation\n3.7\nUse of computer\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nTools and test instrument.\n4.2\nComplete spare parts and consumables.\n4.3\nCalibrating instrument (Air pressure calibrator …etc.)\n4.4\nBasic Biomedical Equipment service Manuals\n4.5\nWork area/bench\n4.6\nBasic Biomedical Equipment checklist forms and other\nreporting forms.\n5. Method of\nassessment\nCompetency MUST be assessed through:\n5.1\nCompetency in this unit may be assessed through direct\nobservation of application of task and questions (written/oral)\nto underpinning knowledge.\n6. Context of\nassessment\n6.1\nCompetency may be assessed in the workplace, assessment\ncenter or in a simulated workplace.\n\n--- PDF PAGE 44 ---\nTR Biomedical Equipment Servicing NCII\n\n- 40 -\n\nUNIT OF COMPETENCY :\nPERFORM PREVENTIVE MAINTENANCE ON BIOMEDICAL\nEQUIPMENT\nUNIT CODE\n:\nHCS311303\nUNIT DESCRIPTOR\n: This unit covers the knowledge, skills and attitudes required in\nconducting preventive maintenance.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Prepare preventive\nmaintenance protocol\n1.1 Covered biomedical equipment and\n accessories is identified.\n1.2\nUpdate basic biomedical equipment inventory on the covered\nBBE is secured and used as reference for preventive\nmaintenance preparation.\n1.3\nRepair history and equipment consumables are verified in line\nwith the institution’s procedure.\n1.4\nAppropriate checklist forms tools, test equipment,\ncalibrating tools, fast moving consumables and personal\nprotective equipment are secured in line with job\nrequirements.\n2. Implement\npreliminary\npreventive\nmaintenance protocol\n2.1\nPreventive maintenance program is properly communicated\nwith the appropriate staff.\n2.2\nImmediate surrounding of covered BBE is secured from\nunnecessary hazards.\n2.3\nPerformed basic biomedical equipment ocular inspection in\naccordance with institution’s procedure.\n2.4\nCleaned and sanitized BBE in accordance with manufacturer\nstandard and/or institution’s procedure.\n3. Perform electrical\nsafety testing\n3.1\nSet-up appropriate test equipment in accordance with\nequipment manufacturer standards and established\noccupational health and safety practices.\n3.2\nLine voltage, ground resistance and current leakage of the\ncovered BBE are measured in accordance with manufacturer\nstandards and in strict observance of the established\noccupational health and safety practices.\n3.3\nElectrical safety test results with equipment manufacturer’s\nsafety standards are analyzed.\n3.4\nElectrical faults are corrected in accordance with equipment\nmanufacture standards.\n4. Perform health care\nequipment functional\ntest\n4.1\nEquipment set-up and start-up operation is performed in\naccordance with equipment manufacturer standards.\n4.2\nSet equipment controls in accordance with equipment\nmanufacture’s functional test standard.\n4.3\nControls and start up signals are checked in accordance with\nmanufacture standard operating procedure and safety\nregulations.\n\n--- PDF PAGE 45 ---\nTR Biomedical Equipment Servicing NCII\n\n- 41 -\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n4.4\nBBE operation protocols are simulated in accordance with\nmanufacturer standard.\n4.6\nEquipment lubrication is done in accordance with\nmanufacturer standards.\n4.7\nAccessories of the covered BBE are inspected and set-up in\naccordance with institution and equipment manufacturer\nstandard respectively.\n4.8\nAppropriate equipment consumables are replaced in\naccordance with manufacturer standards\n4.9\nFunctional test is completed within the specified time as\nprovided in the institution BBE preventive maintenance\nprocedure.\n5. Check and perform\nBBE calibration\n5.1\nAppropriate calibration procedures and parameters are\ndetermined in accordance with equipment manufacturer\nstandards and/or institution’s guidelines.\n5.2\nCalibration equipment is set-up in accordance with\nmanufacturer standard and occupational and health safety\npractices.\n5.3\nBBE operation is simulated in accordance with equipment\nmanufacturer standards.\n5.4\nCalibration controls are crossed check and verified in\naccordance with manufacturer’s standards.\n5.5\nNecessary adjustments are made in accordance with\nequipment manufacturer’s instruction.\n5.6\nCovered BBE is subjected to final test in accordance with\ninstitution guidelines and procedures.\n6. Re-commission BBE.\n6.1\nReassembled BBE are subjected to final testing in accordance\nwith institution standard.\n6.2\nBBE and its immediate surrounding are cleaned in\naccordance with institution policy.\n6.3\nCommunicated with appropriate staff that preventive\nmaintenance procedure is done and brief’s the same on\nequipment status as per institution standard.\n7. Perform and maintain\nBBE preventive\nmaintenance\ndocumentation\n7.1\nBasic biomedical equipment checklist forms and other\npreventive maintenance documents are accomplished in strict\nobservance of institution standards.\n7.2\nReports are submitted to proper officer/office in accordance\nwith institution policy.\n7.3\nPreventive maintenance documents are systematically kept\nand updated as per institution standards.\n\n--- PDF PAGE 46 ---\nTR Biomedical Equipment Servicing NCII\n\n- 42 -\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Equipment\n1.1\nWeighing scale (Infant/Adult)\n1.2\nClinical weighing scale\n1.3\nGooseneck lamp/Examining light\n1.4\nOxygen gauge\n1.5\nSphygmomanometer\n1.6\nSuction apparatus\n1.7\nAutoclave\n1.8\nOR/DR light\n1.9\nOR table\n1.10 Nebulizer\n1.11 Clinical Rotator/Shaker\n1.12 Electromuscular stimulator\n1.13 Spectrophotometer\n1.14 Uninterrupted power supply\n1.15 Bag valve (Pedia and Adult)\n1.16 Anesthesia bag\n1.17 Clinical oven\n2. Checklist form\n2.1 Covered equipment P.M. checklist form\n3. Tools, test equipment\nand calibrating tool\nIncludes but not limited to:\n3.1\nScrewdrivers (assorted)\n3.2\nSoldering iron/gun\n3.3\nDe-soldering tool\n3.4\nWrenches (assorted)\n3.5\nPliers (assorted)\n3.6\nCleaning Brush\n3.7\nThermometer ( digital & mercurial)\n3.8\nElectrical Safety Analyzer\n3.9\nMulti-tester (analog/digital)\n3.10 Utility knife\n3.11 Alignment tool\n4. Service manuals and\ninformation\n4.1\nOperation’s Manuals\n4.2\nService/Technical Manual\n4.3\nInstallation Manual\n4.4\nParts List Manual\n4.5\nJob Report Sheets\n4.6\nJob Request/Order\n4.7\nEquipment History Card\n4.8.\nSupplier Index\n\n--- PDF PAGE 47 ---\nTR Biomedical Equipment Servicing NCII\n\n- 43 -\n\nVARIABLE\nRANGE\n5. Fast moving\nconsumables\n5.1\nOil, cleaning agents\n5.2\nFuses (assorted)\n5.3\nContact cleaner\n5.4\nSoldering lead\n5.5\nTape (assorted)\n5.6\nFilters (assorted)\n5.7\nSealing materials\n5.8\nScrews (assorted)\n5.9\nWire tie\n6. Appropriate staff\n6.1\nEnd-user\n6.2\nImmediate supervisor\n6.3\nManagers\n7. Personal Protective\nEquipment\n7.1\nWorking clothes\n7.2\nHand Gloves\n7.3\nGoggles\n7.4\nMask\n7.5\nShoe cover\n8. Unnecessary hazards\n8.1\nPeople\n8.2\nWet floors\n8.3\nOpen electrical wiring\n8.4\nLocation\n\n--- PDF PAGE 48 ---\nTR Biomedical Equipment Servicing NCII\n\n- 44 -\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nInterpreted work instructions according to job requirements.\n1.2\nAppropriately selected electrical cabling and wiring devices\nused.\n1.3\n Installed equipment in accordance with manufacturer’s\ninstructions.\n1.4\nTested installed equipment according to manufacturer’s\ninstructions\n2. Underpinning\nknowledge\n2.1\nOccupational safety and health guidelines\n2.2\nSpecification and proper use of tools\n2.3\nGeneral concepts and principles of in electronics and\nelectricity\n2.3.1 AC/DC power supplies\n2.3.2 Operational amplifiers\n2.3.3 Digital electronics\n2.3.4 Wiring techniques\n2.4\nUse of test equipment/instruments\n2.5\nClinical application of equipment/instruments/tools\n2.6\nDrawing interpretation\n2.7\nElectronic hand soldering\n3. Underpinning skills\n3.1\nReading skills required to interpret work instructions,\ndiagrams, schematics\n3.2\nCommunication skills needed to interpret and define and\nexplain work procedures\n3.3\nProblem solving in emergency situation\n3.4\nSoldering skills\n3.5\nTroubleshooting\n3.6\nCourtesy and helping attitude\n4. Method of\nassessment\nCompetency may be assessed through:\n4.1\nObservation with questioning\n4.2\nInterview\n4.3\nDemonstration with questioning\n4.4\nThird party report\n4.5\nPortfolio\n5. Resource\nimplications\nThe following resources MUST be provided:\n5.1\nTools\n5.2\nTest equipment and instruments\n5.3\nMaterials\n5.4\nWork station\n5.5\nJob orders/requests\n6. Context of\nassessment\n6.1\nAssessment may be conducted in the workplace or in a\nsimulated environment\n\n--- PDF PAGE 49 ---\nTR Biomedical Equipment Servicing NCII\n\n- 45 -\n\nUNIT OF COMPETENCY :\nREPAIR BIOMEDICAL EQUIPMENT\nUNIT CODE\n\n : HCS311304\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes necessary to\nrepair biomedical equipment related to patient care.\n\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Inspect equipment for\nrepair\n1.1\nIdentify equipment for repair in accordance to institutional\nrules and regulations.\n1.2\nSort and classify equipment for repair.\n1.3\nPrioritize equipment for repair.\n2 Plan and prepare for\nrepair\n2.1\nRepair is planned and prepared in line with job requirements.\n2.2\nOSH policies and procedures are followed in line with job\nrequirements.\n2.3\nEquipment is checked against specification and\nrequirements.\n2.4\nMaterials and supplies necessary to complete the work are\nobtained in accordance with established procedures and\nchecked against job requirements.\n2.5\nTools, equipment and testing devices needed to carry out\nthe work are obtained in accordance with established\nprocedures and checked for correct operation and safety.\n3. Repair equipment\n3.1\nAppropriate personal protective equipment is used and\nOSH policies and procedures are followed.\n3.2\nNormal function of equipment is checked in accordance with\nmanufacturer’s instructions.\n3.3\nFault or problem in the equipment is diagnosed in line with the\nstandard operating procedures.\n3.4\nDetermine most cost-effective repair solution in accordance\nwith institution’s requirements.\n3.5\nEquipment is repaired or replaced in line with the standard\noperating procedures.\n4 Inspect the test\nequipment\n4.1\nFinal inspections are undertaken to ensure that the testing\nconducted on the equipment and circuits conforms with the\nmanufacturer’s instruction/manual.\n4.2\nEquipment is checked to ensure safe operation.\n4.3\nUnplanned events or conditions are responded to in\naccordance with established procedures.\n4.4\nWork site is cleaned and cleared of all debris and left in a\nsafe condition in accordance with established procedures.\n4.5\nReport is prepared/completed according to company\nrequirements.\n4.6\nEndorse equipment to appropriate end user according to\ninstitution’s requirements.\n\n--- PDF PAGE 50 ---\nTR Biomedical Equipment Servicing NCII\n\n- 46 -\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Tools\nTools for: cutting, shaping, drilling, threading, tapping, finishing,\ndismantling/assembling. Tool set includes but not limited to:\n1.1\nPliers; (assorted)\n1.2\nScrewdrivers; (assorted)\n1.3\nSoldering gun/iron\n1.4\nDrill and assorted bits\n1.5\nTool kit\n1.6\nWrench and spanners (assorted)\n1.7\nPuller\n2. Testing devices\nIncludes but not limited to:\n2.1\nMulti-tester\n2.2\nSignal generator\n2.3\nOscilloscope\n2.4\nCalibrators\n2.5\nGauges (assorted)\n2.6\nVariable power supply\n3. Materials and\nsupplies\nIncludes but not limited to:\n3.1\nTape (assorted)\n3.2\nSealing materials (assorted)\n3.3\nCables\n3.4\nWires\n3.5\nSoldering Lead\n3.6\nWire tie\n3.7\nOil, Cleaning agent\n3.8\nGrease\n4. Equipment\nIncludes but not limited to:\n4.1\nWeighing scale, (Infant/Digital)\n4.2\nClinical weighing scale\n4.3\nGooseneck lamp/Examining light\n4.4\nMedical gauges\n4.5\nSphygmomanometer\n4.6\nSuction apparatus\n4.7\nAutoclave\n4.8\nOR/DR light\n4.9\nOR table\n4.10 Nebulizer\n4.11 Clinical Rotator/Shaker\n4.12 Electromuscular stimulator\n4.13 Spectrophotometer\n\n--- PDF PAGE 51 ---\nTR Biomedical Equipment Servicing NCII\n\n- 47 -\n\nVARIABLE\nRANGE\n4.14 Uninterrupted power supply\n4.15 Bag valve (Pedia and Adult)\n4.16 Anesthesia bag\n4.17 Clinical oven\n5. Personal Protective\nEquipment\nIncludes but not limited to:\n5.1\nGloves\n5.2\nIndustrial Mask\n5.3\nSafety goggles\n5.4\nCoveralls\n5.5\nShoe cover\n6. OHS policies and\nprocedures\n6.1\nNational Electrical Code\n6.2\nOSH guidelines\n6.3\nPhilippine environment