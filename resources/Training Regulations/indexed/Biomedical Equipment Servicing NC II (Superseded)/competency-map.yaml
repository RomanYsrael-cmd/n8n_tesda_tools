  "source_text": "SECTION 1 BIOMEDICAL EQUIPMENT SERVICING NC II QUALIFICATION\n\nThis BIOMEDICAL EQUIPMENT SERVICING NC II Qualification consists of competencies\nthat a person must achieve to install, perform corrective and preventive maintenance, repair\nbiomedical equipment, assess and refer biomedical equipment.\nThe Units of Competency comprising this qualification include the following:\n\nUNIT CODE\nBASIC COMPETENCIES\n500311105\nParticipate in workplace communication\n500311106\nWork in a team environment\n500311107\nPractice career professionalism\n500311108\nPractice occupational health and safety procedures\n\nUNIT CODE\nCOMMON COMPETENCIES\nHCS323201\nImplement and monitor infection control policies and procedures\nHCS323202\nRespond effectively to difficult/challenging behavior\nHCS323203\nApply basic first aid\nHCS323204\nMaintain high standard of patient services\n\nUNIT CODE\nCORE COMPETENCIES\nHCS311301\nInstall biomedical equipment\nHCS311302\nPerform corrective maintenance on biomedical equipment\nHCS311303\nPerform preventive maintenance on biomedical equipment\nHCS311304\nRepair biomedical equipment\nHCS311305\nAssess and refer biomedical equipment\n\nA person who has achieved this Qualification is competent to be:\n\n Biomedical Equipment Technician (BMET)\n Medical Equipment Mechanic / Repairer\n\n--- PDF PAGE 6 ---\nTR Biomedical Equipment Servicing NCII\n\n- 2 -"
