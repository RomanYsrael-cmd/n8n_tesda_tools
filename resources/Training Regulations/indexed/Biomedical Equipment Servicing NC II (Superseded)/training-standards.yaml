    "source_text": "3.1 CURRICULUM DESIGN\n\nCourse Title: BIOMEDICAL EQUIPMENT SERVICING\nNC Level: NC II\n\nNominal Training Hours: 960 Hours\n\nCourse Description:\n\nThis course is designed to enhance the knowledge, skills and attitudes of BIOMEDICAL\nEQUIPMENT SERVICING in accordance with industry standards. It covers basic, common and\ncore competencies in NC II.\n\nBASIC COMPETENCIES\n\nUNIT OF\nCOMPETENCY\nLEARNING OUTCOMES\nMETHODOLOGY\nASSESSMENT\nAPPROACH\n1. Participate in\nworkplace\ncommunication\n1.1\nObtain and convey\nworkplace information.\n1.2\nComplete relevant work\nrelated documents.\n1.3\nParticipate in workplace\nmeeting and discussion.\n• Group\ndiscussion\n• Interaction\n\n• Demonstration\n Observation\n• Interviews/\n• Questioning\n2. Work in a team\nenvironment\n2.1\nDescribe and identify\nteam role and\nresponsibility in a team.\n2.2\nDescribe work as a\nteam member.\n• Discussion\n• Interaction\n• Demonstration\n• Observation\n• Interviews/\n• Questioning\n3. Practice career\nprofessionalism\n3.1\nIntegrate personal\nobjectives with\norganizational goals.\n3.2\nSet and meet work\npriorities.\n3.3\nMaintain professional\ngrowth and\ndevelopment.\n• Group\ndiscussion\n• Interaction\n\n• Demonstration\n Observation\n• Interviews/\n• Questioning\n4. Practice\noccupational health\nand safety\n4.1\nEvaluate hazard and\nrisks.\n4.2\nControl hazards and\nrisks.\n4.3\nMaintain occupational\nhealth and safety\nawareness.\n• Discussion\n• Plant Tour\n• Symposium\n• Observation\n• Interviews\n\n--- PDF PAGE 58 ---\nTR Biomedical Equipment Servicing NCII\n\n- 54 -\n\nCOMMON COMPETENCIES\n\nUNIT OF\nCOMPETENCY\nLEARNING OUTCOMES\nMETHODOLOGY\nASSESSMENT\nAPPROACH\n1. Implement and\nmonitor infection\ncontrol policies and\nprocedures\n1.1\nProvide information to\nthe work group about\nthe organization’s\ninfection control policies\nand procedures.\n1.2\nIntegrate the\norganization’s infection\ncontrol policy and\nprocedure into work\npractices.\n1.3\nMonitor infection control\nperformance and\nimplement\nimprovements in\npractices\n• Lecturette\n• Interaction\n\n• Observation\nand oral\nquestioning\n• Grid\nquestioning\n• Practical\nexercise\n2. Respond\neffectively to\ndifficult/challenging\nbehavior\n2.1\nPlan and respond to\nemergencies.\n2.2\nReport and review\nincidents.\n\n• Lecturette\n• Brainstroming\n\n• Observation\nand oral\nquestioning\n• Grid\nquestioning\n• Practical\nexercise\n3. Apply basic first aid\n3.1\nAssess the situation.\n3.2\nApply basic first aid\ntechniques.\n3.3\nCommunicate details of\nthe incident.\n• Lecturrette\n• Brainstorming\n• Observation\nand oral\nquestioning\n• Grid\nquestioning\n• Practical\nexercise\n4. Maintain high\nstandard of patient\nservices\n4.1\nCommunicate\nappropriately with\npatients.\n4.2\nEstablish and maintain\ngood interpersonal\nrelationship with\npatients.\n4.3\nAct in a respectful\nmanner at all times.\n4.4\nEvaluate own work to\nmaintain a high\nstandard of patient\nservice.\n• Lecturrette\n• Brainstorming\n• Observation\nand oral\nquestioning\n• Grid\nquestioning\n• Practical\nexercise\n\n--- PDF PAGE 59 ---\nTR Biomedical Equipment Servicing NCII\n\n- 55 -\n\nCORE COMPETENCIES\n\nUNIT OF\nCOMPETENCY\nLEARNING OUTCOME\nMETHODOLOGY\nASSESSMENT\nAPPROACH\n1. Install biomedical\nequipment\n1.1\nInterpret work\ninstructions\n1.2\nInstall instrumentation\nand control devices\n1.3\nTest installed\ninstrumentation and\ncontrol devices\n• Lecture\n• Questioning\n• On-the- Job\nPractice\n\n• Observation\n• Demonstration\n• Third Party\nReport\n• Return\nDemonstration\n2. Perform corrective\nmaintenance on\nbiomedical\nequipment\n2.1\nRespond to\nclient/customer service\nrequest\n2.2\nPrepare unit\n2.3\nDiagnose faults\n2.4\nRepair Basic\nBiomedical Equipment\n2.5\nReassemble and test\nrepaired unit\n2.6\nRe-commission Basic\nBiomedical Equipment\n2.7\nPerform and maintain\nbasic biomedical\nequipment corrective\nmaintenance\ndocumentation\n• Lecture\n• Questioning\n• On-the- Job\nPractice\n\n• Observation\n• Demonstration\n• Third Party\nReport\n• Return\n Demonstration\n3. Perform preventive\nmaintenance on\nbiomedical\nequipment\n3.1\nPrepare preventive\nmaintenance protocol\n3.2\nImplements preliminary\npreventive maintenance\nprotocol\n3.3\nPerform electrical\nsafety testing\n3.4\nPerform basic\nbiomedical equipment\nfunctional test.\n• Lecture\n• Questioning\n• On-the- Job\nPractice\n• Demonstration\n• Observation\n• Demonstration\n• Third Party\nReport\n• Return\n Demonstration\n\n3.5\nCheck and perform\nbasic biomedical\nequipment calibration.\n3.6\nRe-commission Basic\nBiomedical Equipment.\n3.7\nPerform and maintain\nbasic biomedical\nequipment preventive\nmaintenance\ndocumentation.\n• Lecture\n• Questioning\n• On-the- Job\nPractice\n• Demonstration\n• Observation\n• Demonstration\n• Third Party\nReport\n• Return\n Demonstration\n4. Repair biomedical\nequipment\n\n4.1\nInspect equipment for\nrepair.\n4.2\nPlan and prepare for\nrepair.\n4.3\nRepair equipment.\n4.4\nInspect the test\nequipment.\n• Lecture\n• Questioning\n• On-the- Job\nPractice\n• Demonstration\n• Observation\n• Demonstration\n• Third Party\nReport\n• Return\n Demonstration\n\n--- PDF PAGE 60 ---\nTR Biomedical Equipment Servicing NCII\n\n- 56 -\n\nUNIT OF\nCOMPETENCY\nLEARNING OUTCOME\nMETHODOLOGY\nASSESSMENT\nAPPROACH\n5. Assess and refer\n biomedical\nequipment\n5.1 Plan and prepare.\n5.2 Assess faults/defects\n5.3 Refer for further re-\nassessment\n\n• Lecture\n• Questioning\n• On-the- Job\nPractice\n• Demonstration\n• Observation\n• Demonstration\n• Third Party\nReport\n• Return\n Demonstration"
