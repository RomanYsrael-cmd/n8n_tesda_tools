        "evidence_guide": {
          "source_text": "1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nInterpreted work instructions according to job requirements\n1.2\nAppropriately selected electrical cabling and wiring devices\nused\n1.3\nInstalled equipment in accordance with manufacturer’s\ninstructions\n1.4\nTested installed equipment according to manufacturer’s\ninstructions\n2. Underpinning\nknowledge\n2.1\nOccupational safety and health guidelines\n2.2\nSpecifications and proper use of tools\n2.3\nGeneral concepts and principles in electronics and electricity\n2.3.1 AC/DC power supplies\n2.3.2 Operational amplifiers\n2.3.3 Digital electronics\n2.3.4 Wiring techniques\n2.4\nUse of test equipment and/ or instruments\n2.5\nClinical application of equipment/instruments/tools\n2.6\nDrawing interpretation\n2.7\nElectronic hand soldering\n2.8\nKnowledge in computer\n3. Underpinning skills\n3.1\nReading skills required to interpret work instructions,\ndiagrams, schematics\n3.2\nCommunication skills needed to interpret, define and explain\nwork procedures\n3.3\nProblem solving in emergency situation(s)\n3.4\nSoldering skills\n3.5\nTroubleshooting\n3.6\nCourtesy and helping attitude\n3.7\nUse of computer\n4. Method of\nassessment\nCompetency may be assessed through:\n4.1\nObservation with questioning\n4.2\nInterview\n4.3\nDemonstration with questioning\n4.4\nThird party assessment\n4.5\nPortfolio\n5. Resource\nimplications\nThe following resources MUST be provided:\n5.1\nTools\n5.2\nTest equipment and instruments\n5.3\nMaterials\n5.4\nWork station\n5.5\nJob orders/requests\n6. Context of\nassessment\n6.1\nAssessment may be conducted in the workplace or in a\nsimulated environment\n\n--- PDF PAGE 38 ---\nTR Biomedical Equipment Servicing NCII\n\n- 34 -\n\nUNIT OF COMPETENCY :\nPERFORM CORRECTIVE MAINTENANCE ON BIOMEDICAL\nEQUIPMENT\nUNIT CODE\n:"
        },
        "source_text": "HCS311301\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes necessary to\ninstall biomedical equipment related to patient care.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Interpret work\ninstructions\n1.1\nWork instructions are read and interpreted to determine job\nrequirements.\n1.2\nTools and testing devices needed to carry out the\ninstallation work are selected in accordance with established\nprocedures and checked for correct operation and safety.\n1.3\nMaterials necessary to complete the work are obtained in\naccordance with job requirements.\n2. Install equipment and\naccessories\n2.1\nEquipment and components are prepared for correct\nsequential installation.\n2.2\nOSH policies and procedures for installation are followed\naccording to manufacturer’s specifications.\n2.3\nPPE is used according to institution’s requirements.\n2.4\nElectrical cabling and wiring devices of correct loading\ncapacity are selected and safely installed according to\nNational Electrical Code.\n2.5\nEquipment is installed in accordance with manufacturer’s\ninstructions, requirements, and without damage to self and\nothers or surrounding place or environment.\n2.6\nUnplanned events or conditions are responded to in\naccordance with established institutional procedures.\n3. Test installed\nequipment and\naccessories\n3.1\nEquipment is tested in accordance with manufacturer’s\ninstructions.\n3.2\nFinal inspections are undertaken to ensure that the installed\ndevice conforms with manufacturer’s instructions.\n3.3\nWork site is cleaned and cleared of all debris and left safe in\naccordance with the institution’s requirements.\n3.4\nReport on installation and testing of equipment is prepared\nand submitted according to institution’s procedures.\n3.5\nEndorse equipment to appropriate end user according to\ninstitution’s requirements.\n\n--- PDF PAGE 35 ---\nTR Biomedical Equipment Servicing NCII\n\n- 31 -\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Tools\nTools for: cutting, shaping, drilling, threading, tapping, finishing,\ndismantling/assembling. Tool set includes but is not limited to:\n1.1\nPliers; (assorted)\n1.2\nScrewdrivers; (assorted)\n1.3\nSoldering gun/iron\n1.4\nElectric drill and assorted bits\n1.5\nTool kit\n1.6\nWrench and spanners (spanners)\n1.7\nStaple gun\n2. Testing devices\nInclude but are not limited to:\n2.1\nMulti-tester\n2.2\nSignal generator\n2.3\nOscilloscope\n2.4\nCalibrators\n2.5\nGauges (assorted)\n3. Materials\nInclude but are not limited to:\n3.1\nTape (assorted)\n3.2\nSealing materials\n3.3\nCables\n3.4\nWires\n3.5\nSoldering Lead\n3.6\nWire tie\n4. Equipment\nEquipment includes but not limited to:\n4.1\nWeighing scale, Infant/Adult\n4.2\nClinical weighing scale\n4.3\nGooseneck lamp/Examining light\n4.4\nOxygen gauge\n4.5\nSphygmomanometer\n4.6\nSuction apparatus\n4.7\nAutoclave\n4.8\nOR/DR light\n4.9\nOR table\n4.10 Nebulizer\n4.11 Rotator/Shaker\n4.12 Electromuscular stimulator\n4.13 Spectrophotometer\n4.14 Uninterruptible power supply\n4.15 Bag valve mask (Pedia and Adult)\n4.16 Anesthesia bag\n4.17\nClinical oven\n5. Personal protection\nequipment\nIncludes but is not limited to:\n5.1\nIndustrial Mask\n5.2\nSafety goggles\n5.3\nCoveralls\n5.4\nGloves\n5.5\nShoe cover\n6. OSH policies and\nprocedures\n6.1\nNational Electrical Code\n6.2\nOSH guidelines\n6.3\nPhilippine environmental standards\n\n--- PDF PAGE 36 ---\nTR Biomedical Equipment Servicing NCII\n\n- 32 -\n\nVARIABLE\nRANGE\n7. Unplanned events or\nconditions\nInclude but are not limited to:\n7.1\nFire\n7.2\nFlood\n7.3\nEarthquake\n7.4\nElectrical shock\n7.5\nPower interruption\n7.6\nPower overload\n7.7\nAlert levels\n8. Worksite\nIncludes but not limited to:\n8.1\nLaboratory\n8.2\nClinics\n8.3\nOperating room/Delivery room\n8.4\nWards/Units\n8.5\nEmergency room\n\n--- PDF PAGE 37 ---\nTR Biomedical Equipment Servicing NCII\n\n- 33 -\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nInterpreted work instructions according to job requirements\n1.2\nAppropriately selected electrical cabling and wiring devices\nused\n1.3\nInstalled equipment in accordance with manufacturer’s\ninstructions\n1.4\nTested installed equipment according to manufacturer’s\ninstructions\n2. Underpinning\nknowledge\n2.1\nOccupational safety and health guidelines\n2.2\nSpecifications and proper use of tools\n2.3\nGeneral concepts and principles in electronics and electricity\n2.3.1 AC/DC power supplies\n2.3.2 Operational amplifiers\n2.3.3 Digital electronics\n2.3.4 Wiring techniques\n2.4\nUse of test equipment and/ or instruments\n2.5\nClinical application of equipment/instruments/tools\n2.6\nDrawing interpretation\n2.7\nElectronic hand soldering\n2.8\nKnowledge in computer\n3. Underpinning skills\n3.1\nReading skills required to interpret work instructions,\ndiagrams, schematics\n3.2\nCommunication skills needed to interpret, define and explain\nwork procedures\n3.3\nProblem solving in emergency situation(s)\n3.4\nSoldering skills\n3.5\nTroubleshooting\n3.6\nCourtesy and helping attitude\n3.7\nUse of computer\n4. Method of\nassessment\nCompetency may be assessed through:\n4.1\nObservation with questioning\n4.2\nInterview\n4.3\nDemonstration with questioning\n4.4\nThird party assessment\n4.5\nPortfolio\n5. Resource\nimplications\nThe following resources MUST be provided:\n5.1\nTools\n5.2\nTest equipment and instruments\n5.3\nMaterials\n5.4\nWork station\n5.5\nJob orders/requests\n6. Context of\nassessment\n6.1\nAssessment may be conducted in the workplace or in a\nsimulated environment\n\n--- PDF PAGE 38 ---\nTR Biomedical Equipment Servicing NCII\n\n- 34 -\n\nUNIT OF COMPETENCY :\nPERFORM CORRECTIVE MAINTENANCE ON BIOMEDICAL\nEQUIPMENT\nUNIT CODE\n:"
