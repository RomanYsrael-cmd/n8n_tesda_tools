tional Electrical Code\n6.2\nOSH guidelines\n6.3\nPhilippine environmental standards\n\n--- PDF PAGE 36 ---\nTR Biomedical Equipment Servicing NCII\n\n- 32 -\n\nVARIABLE\nRANGE\n7. Unplanned events or\nconditions\nInclude but are not limited to:\n7.1\nFire\n7.2\nFlood\n7.3\nEarthquake\n7.4\nElectrical shock\n7.5\nPower interruption\n7.6\nPower overload\n7.7\nAlert levels\n8. Worksite\nIncludes but not limited to:\n8.1\nLaboratory\n8.2\nClinics\n8.3\nOperating room/Delivery room\n8.4\nWards/Units\n8.5\nEmergency room\n\n--- PDF PAGE 37 ---\nTR Biomedical Equipment Servicing NCII\n\n- 33 -\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nInterpreted work instructions according to job requirements\n1.2\nAppropriately selected electrical cabling and wiring devices\nused\n1.3\nInstalled equipment in accordance with manufacturer’s\ninstructions\n1.4\nTested installed equipment according to manufacturer’s\ninstructions\n2. Underpinning\nknowledge\n2.1\nOccupational safety and health guidelines\n2.2\nSpecifications and proper use of tools\n2.3\nGeneral concepts and principles in electronics and electricity\n2.3.1 AC/DC power supplies\n2.3.2 Operational amplifiers\n2.3.3 Digital electronics\n2.3.4 Wiring techniques\n2.4\nUse of test equipment and/ or instruments\n2.5\nClinical application of equipment/instruments/tools\n2.6\nDrawing interpretation\n2.7\nElectronic hand soldering\n2.8\nKnowledge in computer\n3. Underpinning skills\n3.1\nReading skills required to interpret work instructions,\ndiagrams, schematics\n3.2\nCommunication skills needed to interpret, define and explain\nwork procedures\n3.3\nProblem solving in emergency situation(s)\n3.4\nSoldering skills\n3.5\nTroubleshooting\n3.6\nCourtesy and helping attitude\n3.7\nUse of computer\n4. Method of\nassessment\nCompetency may be assessed through:\n4.1\nObservation with questioning\n4.2\nInterview\n4.3\nDemonstration with questioning\n4.4\nThird party assessment\n4.5\nPortfolio\n5. Resource\nimplications\nThe following resources MUST be provided:\n5.1\nTools\n5.2\nTest equipment and instruments\n5.3\nMaterials\n5.4\nWork station\n5.5\nJob orders/requests\n6. Context of\nassessment\n6.1\nAssessment may be conducted in the workplace or in a\nsimulated environment\n\n--- PDF PAGE 38 ---\nTR Biomedical Equipment Servicing NCII\n\n- 34 -\n\nUNIT OF COMPETENCY :\nPERFORM CORRECTIVE MAINTENANCE ON BIOMEDICAL\nEQUIPMENT\nUNIT CODE\n:\nHCS311302\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitude required in\nconducting corrective maintenance.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Respond to\nclient/customer\nservice request\n1.1 Appropriate request form is received in\n accordance with institution protocols.\n1.2\nCovered biomedical equipment is identified.\n1.3\nPrompt service is conducted on-site or in the workshop.\n2. Prepare\nunit/equipment\n2.1.\nComplete assembly check-up and fault symptoms are\nconducted, identified, and verified against client description\nand properly documented.\n2.2.\nRepair history is verified in line with the institution procedures.\n2.3.\nService manuals and service information required for the\ncorrective maintenance are made available at the beginning of\nthe corrective maintenance activities.\n2.4.\nWorkplace is cleaned in accordance with the institution\nprocedure.\n2.5.\nNecessary tools, test instrument and personal protective\nequipment are prepared in line with job requirement.\n3. Diagnose faults\n3.1.\nSystematic pre-testing procedure is observed in accordance\nwith manufacturer’s instruction.\n3.2.\nSystem detect is identified using appropriate tools and test\nequipment and in accordance with organizational policies and\nprocedures.\n3.3.\nAccurate diagnosis is completed within the specified\ntimeframe.\n3.4.\nDiagnosis and findings of basic biomedical equipment failures\nor technical problems are completely and accurately\ndocumented in accordance with institution standard.\n3.5\nFault/s, defects and range of the problems are properly and\ncourteously explained to the client in accordance with\ninstitution policy.\n4. Repair biomedical\nequipment\n4.1\nSafety equipment is used to protect self and others in\naccordance with established Occupational Health and Safety\npractices.\n4.2\nDefective spare parts/components are replaced with\nequivalent and/or better performing spare parts/components.\n4.3\nRepair and/or replaced parts/components are soldered in\naccordance to current best industry practice.\n4.4\nNecessary circuit adjustment, re-calibration and testing\n\n--- PDF PAGE 39 ---\nTR Biomedical Equipment Servicing NCII\n\n- 35 -\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\nprocedure is done and in conformance with equipment\nmanufacturer specification standards.\n4.5\nNecessary modification, conversion of parts and/or circuits is\napplied in accordance with industry best practice and\nequipment manufacturer specifications.\n4.6\nSpare parts substitution is in accordance with the\nmanufacturer’s specification or equivalent.\n4.7\nCorrective maintenance activity is accomplished within the\nrequired time frame.\n4.8\nCare and extreme precaution in handling the unit is observed.\n5. Reassemble and test\nrepaired unit\n5.1\nPerformance and functional test is conducted immediately\nafter re-assembly.\n5.2\nEquipment status and performance is checked and ensured\nconformance with equipment manufacturer standard and other\nhealth safety regulations.\n5.3\nComplete and accurate documentation is prepared.\n5.4\nTools and test instrument are cleaned and cared as per\norganizational procedure.\n5.5\nWaste materials are disposed in accordance with hospital\nwaste management and other environmental requirements.\n6. Re-commission\nbiomedical\nequipment\n6.1.\nBasic biomedical equipment and its immediate surrounding\nare cleaned in accordance with institution policy.\n6.2.\nAppropriate staff is communicated on the status of the\nequipment as per institution standards.\n7. Perform and maintain\nbiomedical\nequipment corrective\nmaintenance\ndocumentation.\n7.1\nHealth care equipment corrective maintenance form and other\nrelevant reports are accomplished in strict observance of\ninstitution standards.\n7.2\nReports are submitted to proper officer/offices in accordance\nwith institution policy.\n7.3\nCorrective maintenance documents are systematically kept\nand updated as per institution standards.\n\n--- PDF PAGE 40 ---\nTR Biomedical Equipment Servicing NCII\n\n- 36 -\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Appropriate request\nform\n1.1\nProper service request form\n1.2\nFormal service request letter\n1.3\nVerbal service request (actual or phone)\n1.4\nElectronic communication equipment\n2. Biomedical\nequipment\n2.1\nWeighing scale; Infant/digital\n2.2\nClinical weighing scale\n2.3\nGooseneck lamp/Examining light\n2.4\nOxygen gauge\n2.5\nSphygmomanometer\n2.6\nSuction apparatus\n2.7\nAutoclave\n2.8\nOR/DR light\n2.9\nOR table\n2.10 Nebulizer\n2.11 Rotator/Shaker\n2.12 Electromuscular stimulator\n2.13 Spectrophotometer\n2.14 Uninterrupted power supply\n2.15 Bag valve mask (Pedia and Adult)\n2.16 Anesthesia bag\n2.17 Clinical oven\n3. Service manuals and\ninformation\n3.1\nOperation’s Manuals\n3.2\n Service/Technical Manual\n3.3\n Installation Manual\n3.4\nParts List Manual\n3.5\nJob Report Sheets\n3.6\n Job Request/Order\n3.7\nSpare-Parts List Replacement Guide Book\n3.8\n Requisition Slip\n3.9\nEquipment History Card\n3.10 Supplier Index\n\n--- PDF PAGE 41 ---\nTR Biomedical Equipment Servicing NCII\n\n- 37 -\n\nVARIABLE\nRANGE\n4. Tools and test\ninstrument\nIncludes but not limited to:\n4.1\nScrewdrivers (assorted)\n4.2\nSoldering iron/gun\n4.3\nDe-soldering tool\n4.4\nWrenches (assorted)\n4.5\nPliers (assorted)\n4.6\nCleaning Brush\n4.7\nThermometer (digital & mercurial)\n4.8\nElectrical Safety Analyzer\n4.9\nMulti-tester (analog/digital)\n4.10 Utility knife\n4.11 Hammer (Shock less/mechanical)\n4.12 Alignment tool\n5. Personal Protective\nEquipment\n5.1\nWork clothes\n5.2\nHand gloves\n5.3\nGoggles\n5.4\nMask\n5.5\nShoe cover\n6. Environment\nrequirement\n6.1\nDOH Hospital Waste Management Circular\n6.2\nDENR Circular\n\n--- PDF PAGE 42 ---\nTR Biomedical Equipment Servicing NCII\n\n- 38 -\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nDemonstrate efficient application of effective troubleshooting\ntechnique.\n1.2\nDemonstrate effective testing of parts and components\n1.3\nDemonstrate quality corrective service.\n1.4\nDemonstrate the proper procedures in equipment testing\nelectrical safety, calibration, cleaning and basic biomedical\nequipment disinfecting.\n1.5\nDemonstrate the conversion, substitution, modification of parts\nand circuits and in compliance with basic biomedical\nequipment manufacturer standards and established\noccupational health safety regulations.\n1.6\nDemonstrate the use of proper use of tools, test equipment\nand other equipment properly.\n1.7\nDemonstrate proper interpretation of service manual\nspecification/instructions.\n1.8\nIdentify faults and problem accurately.\n1.9\nReceive service request promptly and courteously.\n1.10 Correct the basic biomedical equipment problem accurately\nand properly within the established timeframe.\n1.11 Document the required corrective maintenance works\naccurately.\n2. Underpinning\nknowledge\n2.1\nGeneral knowledge on the human physiology and anatomy\nsystem on the covered basic biomedical equipment.\n2.2\nGeneral knowledge on the block and schematic diagrams and\nother essential circuits and components of the covered basic\nbiomedical equipment.\n2.3\nGeneral knowledge on the various mechanical, pneumatic,\nelectronic and electrical and components used directly or\nindirectly in the covered basic biomedical equipment.\n2.4\nGeneral knowledge on efficient application of effective\ntroubleshooting technique.\n2.5\nGeneral knowledge on the principle of operation, operating\nrequirement, essential parts and functions of the covered\nbasic biomedical equipment.\n2.6\nGeneral knowledge on the special safety precautions and the\nestablished Occupational Health and Safety Practices.\n2.7\nGeneral knowledge on the technical specification, reading and\ninterpreting diagrams, troubleshooting technique,\nmaintenance management, spare parts suppliers and list of\ntechnical persons capable to assist in the corrective\n\n--- PDF PAGE 43 ---\nTR Biomedical Equipment Servicing NCII\n\n- 39 -\n\nmaintenance of the covered basic biomedical equipment.\n2.8\nGeneral knowledge on the use of mathematics, physics,\nelectrical, electronics, pneumatic, hydraulic, mechanical and\nother related subjects use to solve the technical problem on\nthe covered basic biomedical equipment.\n2.9\nGeneral knowledge on various types and models and the\ndistinctions between one unit with the other of the covered\nbasic biomedical equipment.\n2.10 Knowledge in computer\n3. Underpinning skills\n3.1\nEffective client human relations and communications.\n3.2\nEffective information gathering with the client, peers,\nequipment service engineers/staff and supervisors relevant in\nthe corrective maintenance activity.\n3.3\nEffective and efficient work and safety practices.\n3.4\nEffective data analysis.\n3.5\nEffective work safety practices and time management.\n3.6\nEffective documentation\n3.7\nUse of computer\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nTools and test instrument.\n4.2\nComplete spare parts and consumables.\n4.3\nCalibrating instrument (Air pressure calibrator …etc.)\n4.4\nBasic Biomedical Equipment service Manuals\n4.5\nWork area/bench\n4.6\nBasic Biomedical Equipment checklist forms and other\nreporting forms.\n5. Method of\nassessment\nCompetency MUST be assessed through:\n5.1\nCompetency in this unit may be assessed through direct\nobservation of application of task and questions (written/oral)\nto underpinning knowledge.\n6. Context of\nassessment\n6.1\nCompetency may be assessed in the workplace, assessment\ncenter or in a simulated workplace.\n\n--- PDF PAGE 44 ---\nTR Biomedical Equipment Servicing NCII\n\n- 40 -\n\nUNIT OF COMPETENCY :\nPERFORM PREVENTIVE MAINTENANCE ON BIOMEDICAL\nEQUIPMENT\nUNIT CODE\n:\nHCS311303\nUNIT DESCRIPTOR\n: This unit covers the knowledge, skills and attitudes required in\nconducting preventive maintenance.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Prepare preventive\nmaintenance protocol\n1.1 Covered biomedical equipment and\n accessories is identified.\n1.2\nUpdate basic biomedical equipment inventory on the covered\nBBE is secured and used as reference for preventive\nmaintenance preparation.\n1.3\nRepair history and equipment consumables are verified in line\nwith the institution’s procedure.\n1.4\nAppropriate checklist forms tools, test equipment,\ncalibrating tools, fast moving consumables and personal\nprotective equipment are secured in line with job\nrequirements.\n2. Implement\npreliminary\npreventive\nmaintenance protocol\n2.1\nPreventive maintenance program is properly communicated\nwith the appropriate staff.\n2.2\nImmediate surrounding of covered BBE is secured from\nunnecessary hazards.\n2.3\nPerformed basic biomedical equipment ocular inspection in\naccordance with institution’s procedure.\n2.4\nCleaned and sanitized BBE in accordance with manufacturer\nstandard and/or institution’s procedure.\n3. Perform electrical\nsafety testing\n3.1\nSet-up appropriate test equipment in accordance with\nequipment manufacturer standards and established\noccupational health and safety practices.\n3.2\nLine voltage, ground resistance and current leakage of the\ncovered BBE are measured in accordance with manufacturer\nstandards and in strict observance of the established\noccupational health and safety practices.\n3.3\nElectrical safety test results with equipment manufacturer’s\nsafety standards are analyzed.\n3.4\nElectrical faults are corrected in accordance with equipment\nmanufacture standards.\n4. Perform health care\nequipment functional\ntest\n4.1\nEquipment set-up and start-up operation is performed in\naccordance with equipment manufacturer standards.\n4.2\nSet equipment controls in accordance with equipment\nmanufacture’s functional test standard.\n4.3\nControls and start up signals are checked in accordance with\nmanufacture standard operating procedure and safety\nregulations.\n\n--- PDF PAGE 45 ---\nTR Biomedical Equipment Servicing NCII\n\n- 41 -\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n4.4\nBBE operation protocols are simulated in accordance with\nmanufacturer standard.\n4.6\nEquipment lubrication is done in accordance with\nmanufacturer standards.\n4.7\nAccessories of the covered BBE are inspected and set-up in\naccordance with institution and equipment manufacturer\nstandard respectively.\n4.8\nAppropriate equipment consumables are replaced in\naccordance with manufacturer standards\n4.9\nFunctional test is completed within the specified time as\nprovided in the institution BBE preventive maintenance\nprocedure.\n5. Check and perform\nBBE calibration\n5.1\nAppropriate calibration procedures and parameters are\ndetermined in accordance with equipment manufacturer\nstandards and/or institution’s guidelines.\n5.2\nCalibration equipment is set-up in accordance with\nmanufacturer standard and occupational and health safety\npractices.\n5.3\nBBE operation is simulated in accordance with equipment\nmanufacturer standards.\n5.4\nCalibration controls are crossed check and verified in\naccordance with manufacturer’s standards.\n5.5\nNecessary adjustments are made in accordance with\nequipment manufacturer’s instruction.\n5.6\nCovered BBE is subjected to final test in accordance with\ninstitution guidelines and procedures.\n6. Re-commission BBE.\n6.1\nReassembled BBE are subjected to final testing in accordance\nwith institution standard.\n6.2\nBBE and its immediate surrounding are cleaned in\naccordance with institution policy.\n6.3\nCommunicated with appropriate staff that preventive\nmaintenance procedure is done and brief’s the same on\nequipment status as per institution standard.\n7. Perform and maintain\nBBE preventive\nmaintenance\ndocumentation\n7.1\nBasic biomedical equipment checklist forms and other\npreventive maintenance documents are accomplished in strict\nobservance of institution standards.\n7.2\nReports are submitted to proper officer/office in accordance\nwith institution policy.\n7.3\nPreventive maintenance documents are systematically kept\nand updated as per institution standards.\n\n--- PDF PAGE 46 ---\nTR Biomedical Equipment Servicing NCII\n\n- 42 -\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Equipment\n1.1\nWeighing scale (Infant/Adult)\n1.2\nClinical weighing scale\n1.3\nGooseneck lamp/Examining light\n1.4\nOxygen gauge\n1.5\nSphygmomanometer\n1.6\nSuction apparatus\n1.7\nAutoclave\n1.8\nOR/DR light\n1.9\nOR table\n1.10 Nebulizer\n1.11 Clinical Rotator/Shaker\n1.12 Electromuscular stimulator\n1.13 Spectrophotometer\n1.14 Uninterrupted power supply\n1.15 Bag valve (Pedia and Adult)\n1.16 Anesthesia bag\n1.17 Clinical oven\n2. Checklist form\n2.1 Covered equipment P.M. checklist form\n3. Tools, test equipment\nand calibrating tool\nIncludes but not limited to:\n3.1\nScrewdrivers (assorted)\n3.2\nSoldering iron/gun\n3.3\nDe-soldering tool\n3.4\nWrenches (assorted)\n3.5\nPliers (assorted)\n3.6\nCleaning Brush\n3.7\nThermometer ( digital & mercurial)\n3.8\nElectrical Safety Analyzer\n3.9\nMulti-tester (analog/digital)\n3.10 Utility knife\n3.11 Alignment tool\n4. Service manuals and\ninformation\n4.1\nOperation’s Manuals\n4.2\nService/Technical Manual\n4.3\nInstallation Manual\n4.4\nP