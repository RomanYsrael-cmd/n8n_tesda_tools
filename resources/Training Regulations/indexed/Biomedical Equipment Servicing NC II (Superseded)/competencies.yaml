        "source_text": "HCS311304\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes necessary to\nrepair biomedical equipment related to patient care.\n\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Inspect equipment for\nrepair\n1.1\nIdentify equipment for repair in accordance to institutional\nrules and regulations.\n1.2\nSort and classify equipment for repair.\n1.3\nPrioritize equipment for repair.\n2 Plan and prepare for\nrepair\n2.1\nRepair is planned and prepared in line with job requirements.\n2.2\nOSH policies and procedures are followed in line with job\nrequirements.\n2.3\nEquipment is checked against specification and\nrequirements.\n2.4\nMaterials and supplies necessary to complete the work are\nobtained in accordance with established procedures and\nchecked against job requirements.\n2.5\nTools, equipment and testing devices needed to carry out\nthe work are obtained in accordance with established\nprocedures and checked for correct operation and safety.\n3. Repair equipment\n3.1\nAppropriate personal protective equipment is used and\nOSH policies and procedures are followed.\n3.2\nNormal function of equipment is checked in accordance with\nmanufacturer’s instructions.\n3.3\nFault or problem in the equipment is diagnosed in line with the\nstandard operating procedures.\n3.4\nDetermine most cost-effective repair solution in accordance\nwith institution’s requirements.\n3.5\nEquipment is repaired or replaced in line with the standard\noperating procedures.\n4 Inspect the test\nequipment\n4.1\nFinal inspections are undertaken to ensure that the testing\nconducted on the equipment and circuits conforms with the\nmanufacturer’s instruction/manual.\n4.2\nEquipment is checked to ensure safe operation.\n4.3\nUnplanned events or conditions are responded to in\naccordance with established procedures.\n4.4\nWork site is cleaned and cleared of all debris and left in a\nsafe condition in accordance with established procedures.\n4.5\nReport is prepared/completed according to company\nrequirements.\n4.6\nEndorse equipment to appropriate end user according to\ninstitution’s requirements.\n\n--- PDF PAGE 50 ---\nTR Biomedical Equipment Servicing NCII\n\n- 46 -\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Tools\nTools for: cutting, shaping, drilling, threading, tapping, finishing,\ndismantling/assembling. Tool set includes but not limited to:\n1.1\nPliers; (assorted)\n1.2\nScrewdrivers; (assorted)\n1.3\nSoldering gun/iron\n1.4\nDrill and assorted bits\n1.5\nTool kit\n1.6\nWrench and spanners (assorted)\n1.7\nPuller\n2. Testing devices\nIncludes but not limited to:\n2.1\nMulti-tester\n2.2\nSignal generator\n2.3\nOscilloscope\n2.4\nCalibrators\n2.5\nGauges (assorted)\n2.6\nVariable power supply\n3. Materials and\nsupplies\nIncludes but not limited to:\n3.1\nTape (assorted)\n3.2\nSealing materials (assorted)\n3.3\nCables\n3.4\nWires\n3.5\nSoldering Lead\n3.6\nWire tie\n3.7\nOil, Cleaning agent\n3.8\nGrease\n4. Equipment\nIncludes but not limited to:\n4.1\nWeighing scale, (Infant/Digital)\n4.2\nClinical weighing scale\n4.3\nGooseneck lamp/Examining light\n4.4\nMedical gauges\n4.5\nSphygmomanometer\n4.6\nSuction apparatus\n4.7\nAutoclave\n4.8\nOR/DR light\n4.9\nOR table\n4.10 Nebulizer\n4.11 Clinical Rotator/Shaker\n4.12 Electromuscular stimulator\n4.13 Spectrophotometer\n\n--- PDF PAGE 51 ---\nTR Biomedical Equipment Servicing NCII\n\n- 47 -\n\nVARIABLE\nRANGE\n4.14 Uninterrupted power supply\n4.15 Bag valve (Pedia and Adult)\n4.16 Anesthesia bag\n4.17 Clinical oven\n5. Personal Protective\nEquipment\nIncludes but not limited to:\n5.1\nGloves\n5.2\nIndustrial Mask\n5.3\nSafety goggles\n5.4\nCoveralls\n5.5\nShoe cover\n6. OHS policies and\nprocedures\n6.1\nNational Electrical Code\n6.2\nOSH guidelines\n6.3\nPhilippine environmental standards\n7. Unplanned events or\nconditions\nIncludes but not limited to:\n7.1\nFire\n7.2\nFlood\n7.3\nEarthquake\n7.4\nElectrical shock\n7.5\nPower interruption\n7.6\nPower overload\n7.7\nAlert levels\n8. Worksite\nIncludes but not limited to:\n8.1\nLaboratory\n8.2\nClinics\n8.3\nOperating room\n8.4\nWards/Units\n8.5\nEmergency room\n\n--- PDF PAGE 52 ---\nTR Biomedical Equipment Servicing NCII\n\n- 48 -\n\nEVIDENCE GUIDE\n\n1. Critical aspect of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nInterpreted work instructions according to job requirements.\n1.2\nDiagnosed faults in equipment and circuits\n1.3\nRepaired or replaced defective components.\n1.4\nConducted test on the repaired equipment according to\nmanufacturer’s instructions\n1.5\nDocumented tasks undertaken\n2. Underpinning\nknowledge\n2.1\nFundamentals of Chemistry\n2.2\nFundamentals of Physics\n2.3\nMedical terminologies\n2.4\nOHS requirements\n2.5\nUse of tools\n2.6\nUse of tools equipment\n2.7\nElectrical theory\n2.8\nAC/DC principles\n2.9\nWiring techniques\n2.10 Drawing interpretation and sketching\n2.11 Digital electronics\n2.12 Hospital ethics\n2.13 Hospital safety\n2.14 Concepts of instrumentation\n2.15 Pressure measurement\n2.16 Fluid flow\n2.17 Temperature measurement\n2.18 Process control\n2.19 Process control system\n2.20 Transmitters and converters\n2.21 Programmable controllers\n2.22 Control valves\n2.23 Telemetry\n2.24\nIndicators and recorders\n3. Underpinning skills\n3.1\nReading skills required to interpret work instructions\n3.2\nCommunication skills needed to interpret and explain work\nprocedures\n3.3\nProblem solving in emergency situation\n3.4\nSoldering skills\n4. Method of\nassessment\nCompetency assessment may be assessed through:\n4.1 Observation with questioning\n4.2 Third party report\n4.3 Portfolio\n5. Resource\nimplications\nThe following resources MUST be provided:\n5.1\nMaterials\n5.2\nTools and test equipment/instrument\n5.3\nEquipment to be used in a real or simulated situations\n6. Context of\nassessment\n6.1\nAssessment may be conducted in the workplace or in a\nsimulated environment\n\n--- PDF PAGE 53 ---\nTR Biomedical Equipment Servicing NCII\n\n- 49 -\n\nUNIT OF COMPETENCY : ASSESS AND REFER BIOMEDICAL EQUIPMENT\nUNIT CODE\n:"
