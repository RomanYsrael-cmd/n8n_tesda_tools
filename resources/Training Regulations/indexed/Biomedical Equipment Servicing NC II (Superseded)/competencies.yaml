        "evidence_guide": {
          "source_text": "1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nIdentified specific manifestations of difficult or challenging\nbehavior and strategies are planned, selected and applied as\nrequired\n1.2\nMaintained personal safety and the safety of others\n1.3\nReported incidents, reviewed and responded quickly and\neffectively to contingencies\n1.4\nDebriefing mechanisms are used\n2. Underpinning\nknowledge\n2.1\nOSH and issues relating to difficult and challenging behavior\n2.2\nPatient issues which need to be referred to an appropriate\nhealth professional\n2.3\nAbility to interpret and follow the instructions and guidance of\nhealth professionals involved with the care of patient/client\n3. Underpinning skills\n3.1\nEffectively using techniques for monitoring own service area\nincluding client satisfaction\n3.2\nSpeaking in a firm, diplomatic and culturally appropriate\nmanner\n3.3\nRemaining calm and positive in adversity\n3.4\nThinking and responding quickly and strategically\n3.5\nRemaining alert to potential incidents of difficult or challenging\nbehavior\n3.6\nMonitoring and/or maintaining security equipment\n3.7\nWorking with others and displaying empathy with patient and\nrelatives\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nAccess to relevant workplace or appropriately simulated\nenvironment where assessment can take place\n4.2\nRelevant institutional policy, guidelines, procedures and\nprotocols\n4.3\nEmergency response procedures and employee support\narrangements\n5. Method of\nassessment\nCompetency MUST be assessed through:\n5.1\nObservation with questioning\n5.2\nDemonstration with questioning\n6. Context of\nassessment:\n6.1\nAssessment may be done in the workplace or in a simulated\nworkplace setting.\n\n--- PDF PAGE 26 ---\nTR Biomedical Equipment Servicing NCII\n\n- 22 -\n\nUNIT OF COMPETENCY :\nAPPLY BASIC FIRST AID\nUNIT CODE\n:"
        },
        "source_text": "HCS323202\nUNIT DESCRIPTOR\n: This unit of competency covers the knowledge, skills and attitudes\nrequired to effectively respond to difficult or challenging behaviour\nof patients.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Plan responses\n1.1\nResponses are planned to instances of difficult or\nchallenging behavior to maximize the availability of other\nappropriate staff and resources.\n1.2\nSpecific manifestations of difficult or challenging behavior\nare identified and strategies appropriate to these behaviors\nare planned as required.\n1.3\nSafety of self and others is given priority in responding to\ndifficult or challenging behavior according to institutional\npolicies and procedures.\n2. Apply response\n2.1\nDifficult or challenging behavior is dealt with promptly, firmly\nand diplomatically in accordance with institutional policy\nand procedures.\n2.2\nCommunication is used effectively to achieve the desired\noutcomes in responding to difficult or challenging behavior.\n2.3\nAppropriate strategies are selected to suit particular\ninstances of difficult or challenging behavior.\n3. Report and review\nincidents\n3.1\nIncidents are reported according to institutional policies and\nprocedures.\n3.2\nIncidents are reviewed with appropriate staff and suggestions\nappropriate to area of responsibility are made.\n3.3\nDebriefing mechanisms and other activities are used and\nparticipated in.\n3.4\nAdvice and assistance is sought from legitimate sources when\nappropriate.\n\n--- PDF PAGE 24 ---\nTR Biomedical Equipment Servicing NCII\n\n- 20 -\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Planned responses\n1.1\nOwn ability and experience\n1.2\nEstablished institutional procedures\n1.3\nKnowledge of individual persons and underlying causes\n2. Difficult or\nchallenging behaviors\n2.1\nAggression/Assaultive behavior\n2.2\nConfusion or other cognitive impairment\n2.3\nNoisiness\n2.4\nManipulative\n2.5\nWandering\n2.6\nSelf-destructive\n2.7\nIntoxication\n2.8\nWithdrawn/depressed\n2.9\nNegativistic\n2.10 Intrusive behavior\n2.11 Verbal offensiveness\n3. Strategies for dealing\nwith challenging\nbehaviors\n3.1\nDiversional activities\n3.2\nReferring to appropriate personnel e.g. supervisor, security\nofficer\n3.3\nFollowing established emergency response procedures\n4. Selection of\nstrategies for dealing\nwith challenging\nbehaviors\n4.1\nThe nature of the incident\n4.2\nPotential effect on different parties, patient, staff and others\n4.3\nEstablished procedures and guidelines\n5. Institutional policies\nand procedures\n5.1\nIncident reporting and documentation\n5.2\nOperational guidelines for handling incidents and/or cases\ninvolving difficult and challenging behavior\n5.3\nDebriefing of staff involved in the incident\n\n--- PDF PAGE 25 ---\nTR Biomedical Equipment Servicing NCII\n\n- 21 -\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nIdentified specific manifestations of difficult or challenging\nbehavior and strategies are planned, selected and applied as\nrequired\n1.2\nMaintained personal safety and the safety of others\n1.3\nReported incidents, reviewed and responded quickly and\neffectively to contingencies\n1.4\nDebriefing mechanisms are used\n2. Underpinning\nknowledge\n2.1\nOSH and issues relating to difficult and challenging behavior\n2.2\nPatient issues which need to be referred to an appropriate\nhealth professional\n2.3\nAbility to interpret and follow the instructions and guidance of\nhealth professionals involved with the care of patient/client\n3. Underpinning skills\n3.1\nEffectively using techniques for monitoring own service area\nincluding client satisfaction\n3.2\nSpeaking in a firm, diplomatic and culturally appropriate\nmanner\n3.3\nRemaining calm and positive in adversity\n3.4\nThinking and responding quickly and strategically\n3.5\nRemaining alert to potential incidents of difficult or challenging\nbehavior\n3.6\nMonitoring and/or maintaining security equipment\n3.7\nWorking with others and displaying empathy with patient and\nrelatives\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nAccess to relevant workplace or appropriately simulated\nenvironment where assessment can take place\n4.2\nRelevant institutional policy, guidelines, procedures and\nprotocols\n4.3\nEmergency response procedures and employee support\narrangements\n5. Method of\nassessment\nCompetency MUST be assessed through:\n5.1\nObservation with questioning\n5.2\nDemonstration with questioning\n6. Context of\nassessment:\n6.1\nAssessment may be done in the workplace or in a simulated\nworkplace setting.\n\n--- PDF PAGE 26 ---\nTR Biomedical Equipment Servicing NCII\n\n- 22 -\n\nUNIT OF COMPETENCY :\nAPPLY BASIC FIRST AID\nUNIT CODE\n:"
