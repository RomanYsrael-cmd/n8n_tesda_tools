        "source_text": "HCS311305\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes required in the\nassessment and referral of biomedical equipment.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Plan and prepare\n1.1\nIdentification of equipment faults / defects is planned and\nprepared in line with job requirements.\n1.2\nOccupational Safety and Health (OSH) policies and\nprocedures needed are followed in line with job requirements.\n1.3\nMaterials necessary to complete the work are obtained in\naccordance with job establish procedures and checked\nagainst job requirements.\n1.4\nAppropriate personnel are consulted to ensure that the work is\neffectively coordinated.\n1.5\nTools, equipment and testing devices needed to carry out\nthe work are obtained in accordance with established\nprocedures and checked for proper operation and safety.\n1.6\nSystem and equipment defects are checked against job\nrequirements.\n2. Assess faults /\ndefects\n2.1\nAppropriate personal protective equipment (PPE) is used in\naccordance with job requirements and manufacturer’s\nrequirements.\n2.2\nEquipment faults / defects are assessed in accordance with\nstandard operating procedures.\n2.3\nContingency measures are managed and implemented in\naccordance with established procedures.\n2.4\nUnplanned events or conditions are responded to in\naccordance with established institutional procedures.\n3. Refer for re-\nassessment / repair\n3.1\nNecessary report prepared as per institutional requirements.\n3.2\nWhere applicable, details of referrals (e.g. name, company,\nspecialization) are identified based on equipment assessment\n3.3\nIdentify and inform appropriate personnel regarding\nassessment findings according to established protocol.\n3.4\nSubmit report in accordance with institutional policies and\nrequirements.\n\n--- PDF PAGE 54 ---\nTR Biomedical Equipment Servicing NCII\n\n- 50 -\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Tools\nTools for: cutting, shaping, drilling, threading, tapping, finishing,\ndismantling/assembling. Tool set includes but not limited to:\n1.1 Pliers; (assorted)\n1.2\nScrewdrivers; (assorted)\n1.3\nSoldering gun/iron\n1.4\nDrill and assorted bits\n1.5\nTool kit\n1.6\nWrench and spanners (assorted)\n2. Testing devices\nIncludes but not limited to:\n2.1\nMulti-tester\n2.2\nSignal generator\n2.3\nOscilloscope\n2.4\nCalibrators\n2.5\nGauges (assorted)\n3. Materials\nIncludes but not limited to:\n3.1\nTape (assorted)\n3.2\nSealing materials\n3.3\nCables\n3.4\nWires\n3.5\nSoldering Lead\n4. Equipment\nIncludes but not limited to:\n4.1\nDigital weighing scale\n4.2\nInfant weighing scale\n4.3\nClinical weighing scale\n4.4\nGooseneck lamp/Examining light\n4.5\nOxygen gauge\n4.6\nSphygmomanometer\n4.7\nSuction apparatus\n4.8\nAutoclave\n4.9\nOR/DR light\n4.10 OR table\n4.11 Nebulizer\n4.12 Rotator/Shaker\n4.13 Electromuscular stimulator\n4.14 Spectrophotometer\n4.15 *Uninterrupted power supply\n4.16 Bag valve (Pedia and Adult)\n4.17 Anesthesia bag\n4.18 Clinical oven\n\n--- PDF PAGE 55 ---\nTR Biomedical Equipment Servicing NCII\n\n- 51 -\n\nVARIABLE\nRANGE\n5. PPE\nIncludes but not limited to:\n5.1\nGloves\n5.2\nIndustrial Mask\n5.3\nSafety goggles\n5.4\nCoveralls\n6. OSH policies and\nprocedures\n6.1\nNational Electrical Code\n6.2\nOSH guidelines\n6.3\nPhilippine environmental standards\n7. Unplanned events or\nconditions\nIncludes but not limited to:\na. Fire\nb. Flood\nc. Earthquake\nd. Electrical shock\ne. Power interruption\nf. Power overload\ng. Alert levels\n8. Worksite\nIncludes but not limited to:\na. Laboratory\nb. Clinics\nc. Operating room\nd. Wards/Units\ne. Emergency room\n\n--- PDF PAGE 56 ---\nTR Biomedical Equipment Servicing NCII\n\n- 52 -\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nInterpreted work instructions according to job requirements.\n1.2\nAssessed and referred faults / defects equipment.\n1.3\nAppropriately selected electrical cabling and wiring devices\nused\n1.4\nConducted test accurately on the equipment.\n1.5\nReported the task undertaken.\n2. Underpinning\nknowledge\n2.1\nOccupational safety and health guidelines\n2.2\nSpecifications and proper use of tools.\n2.3\nGeneral concepts and principles of in electronics and\nelectricity\n2.3.1 AC/DC power supplies\n2.3.2 Operational amplifiers\n2.3.3 Digital electronics\n2.3.4 Wiring techniques\n2.4\nKnowledge of test equipment/instruments\n2.5\nKnowledge on faults / defects.\n2.6\nClinical application of equipment/instruments/tools\n2.7\nDrawing interpretation\n3. Underpinning skills\n3.1\nReading skills required interpreting work instructions,\ndiagrams, and schematics.\n3.2\nCommunication skills needed to interpret and explain work\nprocedures\n3.3\nProblem solving in emergency situation\n3.4\nSoldering skills\n3.5\nTroubleshooting\n3.6\nCourtesy and helping attitude\n4. Method of\nassessment\nCompetency may be assessed through:\n4.1\nObservation with questioning\n4.2\nInterview\n4.3\nDemonstration with questioning\n4.4\nThird party report\n4.5\nPortfolio\n5. Resource\nimplications\nThe following resources MUST be provided:\n5.1\nTools\n5.2\nTest equipment and instruments\n5.3\nMaterials\n5.4\nWork station\n5.5\nJob orders/requests\n6. Context of\nassessment\n6.1\nAssessment may be conducted in the workplace or in a\nsimulated environment\n\n--- PDF PAGE 57 ---\nTR Biomedical Equipment Servicing NCII\n\n- 53 -"
      }
    ]
