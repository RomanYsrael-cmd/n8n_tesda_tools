ccording to established protocol. \n3.4 \nSubmit report in accordance with institutional policies and \nrequirements.\n\n--- PDF PAGE 54 ---\nTR Biomedical Equipment Servicing NCII \n \n- 50 - \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Tools \nTools for: cutting, shaping, drilling, threading, tapping, finishing, \ndismantling/assembling.  Tool set includes but not limited to: \n1.1      Pliers; (assorted) \n1.2 \nScrewdrivers; (assorted) \n1.3 \nSoldering gun/iron \n1.4 \nDrill and assorted bits \n1.5 \nTool kit \n1.6 \nWrench and spanners (assorted) \n2. Testing devices \nIncludes but not limited to: \n2.1 \nMulti-tester \n2.2 \nSignal generator \n2.3 \nOscilloscope \n2.4 \nCalibrators \n2.5 \nGauges (assorted) \n3. Materials \nIncludes but not limited to: \n3.1 \nTape (assorted) \n3.2 \nSealing materials \n3.3 \nCables  \n3.4 \nWires \n3.5 \nSoldering Lead \n4. Equipment \nIncludes but not limited to: \n4.1 \nDigital weighing scale \n4.2 \nInfant weighing scale \n4.3 \nClinical weighing scale \n4.4 \nGooseneck lamp/Examining light \n4.5 \nOxygen gauge \n4.6 \nSphygmomanometer \n4.7 \nSuction apparatus \n4.8 \nAutoclave \n4.9 \nOR/DR light \n4.10 OR table \n4.11 Nebulizer \n4.12 Rotator/Shaker \n4.13 Electromuscular stimulator \n4.14 Spectrophotometer \n4.15 *Uninterrupted power supply \n4.16 Bag valve  (Pedia and Adult) \n4.17 Anesthesia bag \n4.18 Clinical oven\n\n--- PDF PAGE 55 ---\nTR Biomedical Equipment Servicing NCII \n \n- 51 - \n \nVARIABLE \nRANGE \n5. PPE \nIncludes but not limited to: \n5.1 \nGloves \n5.2 \nIndustrial Mask \n5.3 \nSafety goggles \n5.4 \nCoveralls \n6. OSH policies and \nprocedures \n6.1 \nNational Electrical Code \n6.2 \nOSH guidelines \n6.3 \nPhilippine environmental standards \n7. Unplanned events or \nconditions \nIncludes but not limited to: \na. Fire \nb. Flood  \nc. Earthquake \nd. Electrical shock \ne. Power interruption \nf. Power overload \ng. Alert levels \n8. Worksite \nIncludes but not limited to: \na. Laboratory \n