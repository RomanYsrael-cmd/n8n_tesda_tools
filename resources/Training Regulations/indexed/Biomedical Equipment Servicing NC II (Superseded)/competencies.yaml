        "evidence_guide": {
          "source_text": "1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nComplied with institutional requirements, OSH laws infections\ncontrol and manual handling procedures and relevant health\nregulations\n1.2\nIdentified physical hazards of the casualty and minimized\nimmediate risks\n1.3\nAssessed and monitored the physical condition of the casualty\n1.4\nResponded to emergency using basic life support measures.\n1.5\nProvided initial response where First Aid is required\n1.6\nDealt with complex casualties or incident\n1.7\nPrepared reports to concerned personnel in a timely manner\n2. Underpinning\nknowledge\n2.1\nBasic anatomy and physiology\n2.2\nCompany standard operating procedures (SOPs)\n2.3\nDealing with confidentiality\n2.4\nKnowledge of the First Aiders’ skills limitations\n2.5\nOSH legislation and regulations\n2.6\nHow to gain access to and interpret material safety data\nsheets\n3. Underpinning skills\n3.1\nResuscitation\n3.2\nSafe manual handling of casualty\n3.3\nConsideration of the welfare of the casualty\n3.4\nReport preparation\n3.5\nCommunication skills\n3.6\nAbility to interpret and use listed documents\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nAccess to relevant work station\n4.2\nRelevant institutional policies, guidelines procedure and\nprotocol\n4.3\nEquipment and materials relevant to the proposed activities\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1\nDemonstration with questioning\n5.2\nInterview\n5.3\nThird Party Report\n5.4\nPortfolio\n6. Context of\nassessment\n6.1\nAssessment may be done in a workplace or simulated work\narea setting.\n\n--- PDF PAGE 30 ---\nTR Biomedical Equipment Servicing NCII\n\n- 26 -\n\nUNIT OF COMPETENCY :\nMAINTAIN HIGH STANDARDS OF PATIENT SERVICES\nUNIT CODE\n:"
        },
        "source_text": "HCS323203\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes required to\nprovide an initial response where First Aid is required. In this unit it\nis assumed that the First Aider is working under supervision and / or\naccording to established workplace First Aid procedures and\npolicies\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Assess the situation\n1.1\n Physical hazards to self and casualty’s health and safety are\nidentified.\n1.2\nImmediate risks to self and casualty’s occupational health\nand safety (OSH )are minimized by controlling the hazard in\naccordance with OSH requirements.\n1.3\nCasualty’s vital signs and physical condition are assessed in\naccordance with workplace procedures.\n2. Apply basic first aid\ntechniques\n2.1\nFirst Aid management is provided in accordance with\nestablished First Aid procedures.\n2.2\nCasualty is reassured in a caring and calm manner and made\ncomfortable using available resources.\n2.3\nFirst Aid assistance is sought from others in a timely manner\nand as appropriate.\n2.4\nCasualty’s condition is monitored and responded to in\naccordance with effective First Aid principles and workplace\nprocedures.\n2.5\nDetails of casualty’s physical condition, changes in conditions,\nmanagement and response are accurately recorded in line\nwith organizational procedures.\n2.6\nCasualty management is finalized according to his/her needs\nand First Aid principles.\n3. Communicate details\nof the incident\n3.1\nAppropriate medical assistance is requested using relevant\ncommunication media and equipment.\n3.2\nDetails of casualty’s condition and management activities are\naccurately\nconveyed\nto\nemergency\nservices/relieving\npersonnel.\n3.3\nReports to supervisors are prepared in a timely manner,\npresenting all relevant facts according to established company\nprocedures.\n\n--- PDF PAGE 27 ---\nTR Biomedical Equipment Servicing NCII\n\n- 23 -\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. First Aid\nManagement\nThis may include but not limited to:\n1.1\nWorkplace policies and procedures\n1.2\nIndustry/site specific regulations, codes\n1.3\nOSH\n1.4\nState and territory workplace health and safety requirements\n1.5\nAllergies the casualty may have\n2. Physical Hazards\nPhysical hazards may include:\n2.1\nWorkplace hazards\n2.2\nEnvironmental hazards\n2.3\nProximity of other people\n2.4\nHazards associated with casualty management processes\n3. Risks\nRisks may include:\n3.1\nWorksite equipment, machinery and substances\n3.2\nEnvironmental risks\n3.3\nBodily fluids\n3.4\nRisk of further injury to the casualty\n3.5\nRisk associated with the proximity of the others and\nbystanders\n4. Casualty’s Condition\nCasualty’s condition may include but not limited to the following:\n4.1\nAbdominal injuries\n4.2\nAllergic reactions\n4.3\nBleeding\n4.4\nBurns-thermal, chemical, friction, electrical\n4.5\nCardiac conditions\n4.6\nChemical contamination\n4.7\nCod injuries\n4.8\nCrush injuries\n4.9\nDislocations\n4.10 Drowning\n4.11 Eye injuries\n4.12 Fractures\n4.13 Head injuries\n4.14 Epilepsy\n4.15 Minor skin injuries\n4.16 Neck and spinal injuries\n4.17 Needle stick injuries\n4.18 Poisoning and toxic substances\n4.19 Shock\n4.20 Smoke inhalation\n\n--- PDF PAGE 28 ---\nTR Biomedical Equipment Servicing NCII\n\n- 24 -\n\nVARIABLE\nRANGE\n5. Equipment and\nResources\nEquipment and other resources may include:\n5.1\nDefibrillation units\n5.1\nPressure bandages\n5.2\nThermometers\n5.3\nFirst Aid kit\n5.4\nEyewash\n5.5\nThermal blankets\n5.6\nPocket face masks\n5.7\nRubber gloves\n5.8\nDressing\n5.9\nSpace device\n5.10 Cervical collars\n6. Communication\nsystem\n6.1\nMobile phone\n6.2\nSatellite phones\n6.3\nHF/VHF radio\n6.4\nFlags\n6.5\nFlares\n6.6\nTwo - way radio\n6.7\nEmail\n6.8\nElectronic equipment\n7. Vital signs\n7.1\nBreathing\n7.2\nCirculation\n7.3\nConsciousness\n8. First Aid Principles\n8.1\nChecking the site for danger to self, casualty’ and others and\nminimizing the danger\n8.2\nChecking and maintaining the casualty’s airways, breathing\nand circulation\n\n--- PDF PAGE 29 ---\nTR Biomedical Equipment Servicing NCII\n\n- 25 -\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nComplied with institutional requirements, OSH laws infections\ncontrol and manual handling procedures and relevant health\nregulations\n1.2\nIdentified physical hazards of the casualty and minimized\nimmediate risks\n1.3\nAssessed and monitored the physical condition of the casualty\n1.4\nResponded to emergency using basic life support measures.\n1.5\nProvided initial response where First Aid is required\n1.6\nDealt with complex casualties or incident\n1.7\nPrepared reports to concerned personnel in a timely manner\n2. Underpinning\nknowledge\n2.1\nBasic anatomy and physiology\n2.2\nCompany standard operating procedures (SOPs)\n2.3\nDealing with confidentiality\n2.4\nKnowledge of the First Aiders’ skills limitations\n2.5\nOSH legislation and regulations\n2.6\nHow to gain access to and interpret material safety data\nsheets\n3. Underpinning skills\n3.1\nResuscitation\n3.2\nSafe manual handling of casualty\n3.3\nConsideration of the welfare of the casualty\n3.4\nReport preparation\n3.5\nCommunication skills\n3.6\nAbility to interpret and use listed documents\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nAccess to relevant work station\n4.2\nRelevant institutional policies, guidelines procedure and\nprotocol\n4.3\nEquipment and materials relevant to the proposed activities\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1\nDemonstration with questioning\n5.2\nInterview\n5.3\nThird Party Report\n5.4\nPortfolio\n6. Context of\nassessment\n6.1\nAssessment may be done in a workplace or simulated work\narea setting.\n\n--- PDF PAGE 30 ---\nTR Biomedical Equipment Servicing NCII\n\n- 26 -\n\nUNIT OF COMPETENCY :\nMAINTAIN HIGH STANDARDS OF PATIENT SERVICES\nUNIT CODE\n:"
