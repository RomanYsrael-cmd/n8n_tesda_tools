        "source_text": "HCS323204\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes required in the\nmaintenance of high standards of patient services.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Communicate\nappropriately with\npatients\n1.1\nEffective communication strategies and techniques are\nidentified and used to achieve best patient service outcomes.\n1.2\nComplaints are responded to in accordance with\norganizational policy to ensure best service to patients.\n1.3\nComplaints are dealt with in accordance with established\nprocedures.\n1.4\nInterpreter services are accessed as required.\n1.5\nAction is taken to resolve conflicts either directly, where a\npositive outcome can be immediately achieved, or by referral\nto the appropriate personnel.\n1.6\nParticipation in work team is constructive and collaborative\nand demonstrates an understanding of own role.\n2. Establish and\nmaintain good\ninterpersonal\nrelationship with\npatients\n2.1\nRapport is established to ensure the service is appropriate to\nand in the best interests of patients.\n2.2\nEffective listening skills are used to ensure a high level of\neffective communication and quality of service.\n2.3\nPatient concerns and needs are correctly identified and\nresponded to responsibly and accordingly established\nprocedures and guidelines.\n2.4\nEffectiveness of interpersonal interaction is consistently\nmonitored and evaluated to ensure best patient service\noutcomes.\n3. Act in a respectful\nmanner at all times\n3.1\nRespect for differences is positively, actively and\nconsistently demonstrated in all work.\n3.2\nConfidentiality and privacy of patients is maintained.\n3.3\nCourtesy is demonstrated in all interactions with patients, their\nvisitors, carers and family.\n3.4\nAssistance with the care of patients with challenging\nbehaviors is provided in accordance with established\nprocedures.\n3.5\nTechniques are used to manage and minimize aggression.\n4. Evaluate own work to\nmaintain a high\nstandard of patient\nservice\n4.1\nAdvice and assistance is received or sought from appropriate\nsources on own performance.\n4.2\nOwn work is adjusted, incorporating recommendations that\naddress performance issues, to maintain the agreed standard\nof patient support.\n\n--- PDF PAGE 31 ---\nTR Biomedical Equipment Servicing NCII\n\n- 27 -\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Patients\nThis may include but not limited to:\n1.1\nPatients\n1.2\nProspective patients to the service or services\n1.3\nPatients may be in contact with the institution through\nappropriate health care personnel and professionals or other\nadvocates or agencies\n2. Others with whom\ninteraction is required\nin regard to patient\nservices\n2.1\nOther staff and team members\n2.2\nService units or departments\n2.3\nFamily members, carers and friends of patients\n2.4\nProfessional representatives or agents of patients such as:\n Medical specialists\n Nurses\n Social workers\n Dietitians\n Therapists\n Allied health professionals\n Volunteers\n Teachers and/or spiritual\n Community\n2.5\nGeneral public\n3. Communication\n3.1\nEnglish/Tagalog/vernacular\n3.2\nSign language\n3.3\nThrough an interpreter\n3.4\nCommunity language as required by the service / organization\n4. Modes of\ncommunication\n4.1\nContinuing interaction with patients and clients\n4.2\nVerbal conversations either in person or via telephone\n4.3\nWritten notes by post or electronic media\n4.4\nWorker, family member friend or professional interpreter who\nhas relevant languages\n5. Respect for\ndifference\n5.1\nPhysical\n5.2\nCognitive/mental or intellectual issues that may impact on\ncommunication\n5.3\nCultural and ethnic\n5.4\nReligious/spiritual\n5.5\nSocial\n5.6\nAge\n5.7\nLanguage literacy and numeracy abilities\n5.8\nSexuality and sexual preference\n\n--- PDF PAGE 32 ---\nTR Biomedical Equipment Servicing NCII\n\n- 28 -\n\nVARIABLE\nRANGE\n6. Confidentiality and\nprivacy of patients\n6.1\nFees\n6.2\nHealth fund entitlements\n6.3\nWelfare entitlements\n6.4\nPayment methods and records\n6.5\nPublic environments\n6.6\nLegal and ethical requirements\n6.7\nWriting details i.e. medical and consent forms\n6.8\nConversations on the telephone\n6.9\nSecure location for written records\n6.10 Offering a private location for discussions\n6.11 Information disclosed to an appropriate person consistent with\none’s level of responsibility\n7. Performance\nmonitoring\n7.1\nSelf-monitoring\n7.2\nSupervisor assessment\n7.3\nPatient feedback\n\n--- PDF PAGE 33 ---\nTR Biomedical Equipment Servicing NCII\n\n- 29 -\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nCommunicated appropriately with patients\n1.2\nHandled complaints and resolved conflict, or referred matters\nto supervisors when required\n1.3\nComplied with relevant policies, protocols, guidelines and\nprocedures of the organization\n1.4\nEstablished and maintained good interpersonal relationship\nwith patients\n1.5\nDemonstrated courtesy in all interactions with patients, their\nvisitors, and family\n2. Underpinning\nknowledge\n2.1\nRoles and responsibilities of self and other workers within the\norganization\n2.2\nWhen client/patient issues need to be referred to an\nappropriate health professional\n2.3\nOrganizational policies and procedures for privacy and\nconfidentiality of information provided by patients and others\n2.4\nKnowledge of cultures relevant to the particular service\n2.5\nInstitutional policy on patient rights and responsibilities\n3. Underpinning skills\n3.1\nEstablishing and maintaining relationships, taking into account\nindividual differences\n3.2\nUsing effective listening techniques\n3.3\nUsing appropriate verbal and non verbal communication styles\n3.4\nInterpreting and following the instructions and guidance of\nhealth professionals involved with the care of patient/clients\n3.5\nOral and written communication\n3.6\nProblem solving skills required include the ability to use\navailable resources and prioritise workload\n3.7\nDealing with conflict\n3.8 Working with others and displaying empathy with patient and\nrelatives\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nAccess to relevant workplace or appropriately simulated\nenvironment where assessment can take place\n4.2\nRelevant government and organizational policy, guidelines,\nprocedures and protocols\n4.3 Any relevant legislation in relation to service delivery\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1\nDemonstration with questioning\n5.2\nInterview\n5.3\nThird party report\n6. Context of\nassessment\n6.1\nAssessment may be done in a simulated workplace setting\n\n--- PDF PAGE 34 ---\nTR Biomedical Equipment Servicing NCII\n\n- 30 -\n\nCORE COMPETENCIES\n\nUNIT OF COMPETENCY :\nINSTALL BIOMEDICAL EQUIPMENT\nUNIT CODE\n:"
