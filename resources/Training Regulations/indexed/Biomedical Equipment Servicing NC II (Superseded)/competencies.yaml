ion with questioning\n5.2\nInterview\n5.3\nThird party report\n6. Context of\nassessment\n6.1\nAssessment may be done in a simulated workplace setting\n\n--- PDF PAGE 34 ---\nTR Biomedical Equipment Servicing NCII\n\n- 30 -\n\nCORE COMPETENCIES\n\nUNIT OF COMPETENCY :\nINSTALL BIOMEDICAL EQUIPMENT\nUNIT CODE\n:"
