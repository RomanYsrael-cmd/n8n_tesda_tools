  "source_text": "DEFINITION OF TERMS\n\nFor the purpose of this standard, the word\n\nMaintenance\nA combination of any action carried out to retain an item in, or\nrestore it to an acceptable operation condition.\n\nPreventive Maintenance\nMaintained carried out a predetermined interval, or to other\nprescribed criteria, and intended to reduce the like hood of an\nitem not meeting an acceptable condition.\n\nCorrective Maintenance\nMaintenance carried out to restore (including adjustment and\nrepair) an item, which has ceased to meet an acceptable\ncondition.\n\nElectro cardiograph (ECG)\nAn instrument for recording the changes of electrical potential\noccurring during the heartbeat; used especially in diagnosing\nabnormalities of the heart action.\n\nSpectrophotometer\nA device for measuring the concentration of a substance in a\nsolution using single beam of light that passes through the\nsolution.\n\nBlood Pressure Apparatus\nAn equipment use to measure arterial blood pressure in the\nlateral pressure of force exerted by blood on a unit area of the\nblood vessel wall.\n\nWeighing Scale\nA measuring instrument for determining the weight of an object:\namount of mass in terms of kilogram (kg) or pounds (lbs)\n\nNebulizer\nA device used to turn liquid medicine into a fine spray, or\nnebulas, usually liquid form medicine for asthma; for quick nasal\ningestion.\n\nLaryngoscope\nA flexible, lighted tube used to examine the larynx.\n\nStethoscope\nA medical instrument for listening to the sounds generated\ninside the body which otherwise could not be heard by a human\near unaided.\n\nSterilizer\nA device for heating substances above their boiling point. Use to\nmanufacture chemicals of to sterilized surgical instrument.\n\nWater bath\nA device for regulating the temperature of anything subjected to\nheat, by surrounding the vessel containing it with another vessel\ncontaining water that can be kept at a desired temperature.\n\n--- PDF PAGE 66 ---\nACKNOWLEDGMENT\n\nTh