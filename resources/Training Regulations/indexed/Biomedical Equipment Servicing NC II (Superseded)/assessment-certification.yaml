  "source_text": "SECTION 4 NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1 To attain the National Qualification of Biomedical Equipment Servicing NC II, the\ncandidate must demonstrate competence through project-type assessment covering\nall units listed in Section 1. Successful candidates shall be awarded a National\nCertificate, NC II signed by the TESDA Director General.\n\n4.2\nAssessment shall focus on the core units of competency. The basic and common\nunits shall be integrated or assessed concurrently with the core units.\n\n4.3\nThe following are qualified to apply for assessment and certification:\n\n4.3.1 Graduates of formal, non-formal and informal including enterprise-based\ntraining programs.\n\n4.3.2 Experienced Workers (wage employed or self – employed)\n\n4.4\nRe-assessment in a unit of competency is allowed only after one month from the date\nof assessment. Re-assessment for a National Certificate shall be done only on the\ntask/s that the candidate did not successfully achieve.\n\n4.5\nA candidate who fails the assessment for two (2) consecutive times will be required to\ngo through a refresher course before taking another assessment.\n\n4.6\nThe guidelines on assessment and certification are discussed in detail in the\nProcedures Manual on Assessment and Certification.\n\n--- PDF PAGE 64 ---\nTR Biomedical Equipment Servicing NCII\n\n- 60 -\n\nCOMPETENCY MAP – HEALTH SECTOR (BIOMEDICAL EQUIPMENT SERVICING NC II)\nBASIC COMPETENCIES\n\nReceive and respond to\nworkplace communication\nWork with others\nDemonstrate work\nvalues\nParticipate in\nworkplace\ncommunication\nWork in a team\nenvironment\nPractice career\nprofessionalism\nPractice occupational\nhealth and safety\nprocedures\nPractice housekeeping\nprocedures (5S)\nLead workplace\ncommunication\nLead small team\nDevelop and practice\nnegotiation skills\nSolve problems related\nto work activities\nUse mathematical\nconcepts and\ntechniques\nUse relevant\ntechnologies\nUtilize specialized\ncommunication skills\nDevelop team and\nindividual\nApply problem solving\ntechniques in the\nworkplace\nCollect, analyze and\norganize information\nPlan and organize work\nPromote environmental\nprotection\n\nCOMMON COMPETENCIES\n\nImplement and monitor\ninfection control policies\nand procedures\nRespond effectively to\ndifficult/challenging\nbehavior\nApply basic first aid\nMaintain high standard\nof patient services\n\nCORE COMPETENCIES\n\nProvide care and support to\ninfants and toddlers\nProvide care and support\nto children\nFoster social, intellectual,\ncreative and emotional\ndevelopment of children\nFoster the physical\ndevelopment of\nchildren\nProvide care and\nsupport to elderly\nProvide care and\nsupport to people with\nspecial needs\nMaintain a healthy and\nsafe environment\nRespond to emergency\nClean living room, dining\nroom, bedrooms, toilet\nand bathroom\nWash and iron clothes,\nlinen and fabric\nPrepare hot and cold\nmeals/food\nPrepare and maintain\nbeds\nCollect and maintain\nlinen stocks at end-\nusers location\nAssist in patient\nmobility\nAssist in transporting\npatients\nAssist in bio-psychosocial\nsupport care of patients\nHandle waste in a health\ncare environment\nInstall biomedical\nequipment\nPerform corrective\nmaintenance on\nbiomedical equipment\nPerform preventive\nmaintenance on\nbiomedical equipment\nRepair biomedical\nequipment\nAssess and refer biomedical\nequipment\nPerform basic life support\nMaintain life support\nequipment and resources\nImplement safe\naccess and extrication\nprocedures in an\nemergency\nManage request for an\nambulance service\nAllocate ambulance\nservice resources\nCoordinate emergency\nresources\nDeliver basic ambulance\ncommunication skills\nSupervise on-road\noperations\nManage the scene of an\nemergency\nManage the scene of\na special event\nManage routine scene\nDeliver pre-hospital\npatient care\nDeliver intensive pre-\nhospital patient care\nManage ambulance\noperations\nTransport emergency\npatients\nTransport non-\nemergency patients\nDrive vehicles under\noperational conditions\nWork within a holistic\ntherapeutic massage\nframework\nPerform therapeutic\nmassage assessment\nPlan the therapeutic\nmassage treatment\nImplement therapeutic\nmassage treatment\nPerform remedial\ntherapeutic massage\ntreatment\nWork within a community\ndevelopment framework\nPrepare for work in the\ncommunity service\nindustry\nSupport community\nresources\nProvide\nprimary/residential care\nSupport community\nparticipation\nRecruit and coordinate\nvolunteers\nRespond holistically to\nclient issues\nDevelop and provide\nhealth education program\nin the community\nImplement health\npromotion and\ncommunity\ninterventions\n\n--- PDF PAGE 65 ---\nTR Biomedical Equipment Servicing NCII\n\n- 61 -\n\nDEFINITION OF TERMS\n\nFor the purpose of this standard, the word\n\nMaintenance\nA combination of any action carried out to retain an item in, or\nrestore it to an acceptable operation condition.\n\nPreventive Maintenance\nMaintained carried out a predetermined interval, or to other\nprescribed criteria, and intended to reduce the like hood of an\nitem not meeting an acceptable condition.\n\nCorrective Maintenance\nMaintenance carried out to restore (including adjustment and\nrepair) an item, which has ceased to meet an acceptable\ncondition.\n\nElectro cardiograph (ECG)\nAn instrument for recording the changes of electrical potential\noccurring during the heartbeat; used especially in diagnosing\nabnormalities of the heart action.\n\nSpectrophotometer\nA device for measuring the concentration of a substance in a\nsolution using single beam of light that passes through the\nsolution.\n\nBlood Pressure Apparatus\nAn equipment use to measure arterial blood pressure in the\nlateral pressure of force exerted by blood on a unit area of the\nblood vessel wall.\n\nWeighing Scale\nA measuring instrument for determining the weight of an object:\namount of mass in terms of kilogram (kg) or pounds (lbs)\n\nNebulizer\nA device used to turn liquid medicine into a fine spray, or\nnebulas, usually liquid form medicine for asthma; for quick nasal\ningestion.\n\nLaryngoscope\nA flexible, lighted tube used to examine the larynx.\n\nStethoscope\nA medical instrument for listening to the sounds generated\ninside the body which otherwise could not be heard by a human\near unaided.\n\nSterilizer\nA device for heating substances above their boiling point. Use to\nmanufacture chemicals of to sterilized surgical instrument.\n\nWater bath\nA device for regulating the temperature of anything subjected to\nheat, by surrounding the vessel containing it with another vessel\ncontaining water that can be kept at a desired temperature.\n\n--- PDF PAGE 66 ---\nACKNOWLEDGMENT\n\nThe Technical Education and Skills Development Authority (TESDA) wishes to extend thanks and\nappreciation to the many representatives of business, industry, academe and government agencies, non-\ngovernment organizations including professional associations who donated their time and expertise to the\ndevelopment and validation of this Training Regulations.\n\nEXECUTIVE COMMITTEE, Health Care Industry Training Council, Inc.\n•\nDr. Juan Ma. Pablo R. Nañagas, MPH, MNSA\nChairperson\n•\nDr. Kenneth Vincent Ronquillo, MPHM\nDeputy Chair\n•\nPilar L. Singson Malabunga, RN, MAN\nSecretary (2003-2004)\n•\nEvangeline E. Rafael, RN, MPA, MHA, PhD\nSecretary\n•\nDr. Irineo Bernardo, III\nTreasurer\n•\nProfessor Quintin G. Tan\nBoard Member\n•\nMa. Rita V. Tamse, RN, MN\nBoard Member\nCommittee Chairs, Health Care Industry Training Council\n\n•\nDr. Rodel Nodora, EMBA\nPlanning Research, Marketing and Advocacy\nCommittee\n•\nMa. Rita V. Tamse, RN, MN\nStandards and Assessment Development\nCommittee (2003-2004)\n•\nMs. Gwyn Grace M. Dacurawat\nStandards and Assessment Development\nCommittee\n•\nProf. Agnes Rosario A. De Leon, RN,\nMHA, CHCM\nTraining and Development Committee\nPAQTVET\n•\nMark Douglas Kilner\n