edical equipment Repair biomedical equipment Assess and refer biomedical equipment Perform basic life support Maintain life support equipment and resources Implement safe access and extrication procedures in an emergency Manage request for an ambulance service Allocate ambulance service resources Coordinate emergency resources Deliver basic ambulance communication skills Supervise on-road operations Manage the scene of an emergency Manage the scene of a special event Manage routine scene Deliver pre-hospital patient care Deliver intensive pre- hospital patient care Manage ambulance operations Transport emergency patients Transport non- emergency patients Drive vehicles under operational conditions Work within a holistic therapeutic massage framework Perform therapeutic massage assessment Plan the therapeutic massage treatment Implement therapeutic massage treatment Perform remedial therapeutic massage treatment Work within a community development framework Prepare for work in the community service industry Support community resources Provide primary/residential care Support community participation Recruit and coordinate volunteers Respond holistically to client issues Develop and provide health education program in the community Implement health promotion and community interventions --- PDF PAGE 65 --- TR Biomedical Equipment Servicing NCII - 61 - For the purpose of this standard, the word Maintenance A combination of any action carried out to retain an item in, or restore it to an acceptable operation condition. Preventive Maintenance Maintained carried out a predetermined interval, or to other prescribed criteria, and intended to reduce the like hood of an item not meeting an acceptable condition. Corrective Maintenance Maintenance carried out to restore (including adjustment and repair) an item, which has ceased to meet an acceptable condition. Electro cardiograph (ECG) An instrument for recording the changes of electrical potential occurring during the heartbeat; used especially in diagnosing abnormalities of the heart action. Spectrophotometer A device for measuring the concentration of a substance in a solution using single beam of light that passes through the solution. Blood Pressure Apparatus An equipment use to measure arterial blood pressure in the lateral pressure of force exerted by blood on a unit area of the blood vessel wall. Weighing Scale A measuring instrument for determining the weight of an object: amount of mass in terms of kilogram (kg) or pounds (lbs) Nebulizer A device used to turn liquid medicine into a fine spray, or nebulas, usually liquid form medicine for asthma; for quick nasal ingestion. Laryngoscope A flexible, lighted tube used to examine the larynx. Stethoscope A medical instrument for listening to the sounds generated inside the body which otherwise could not be heard by a human ear unaided. Sterilizer A device for heating substances above their boiling point. Use to manufacture chemicals of to sterilized surgical instrument. Water bath A device for regulating the temperature of anything subjected to heat, by surrounding the vessel containing it with another vessel containing water that can be kept at a desired temperature. --- PDF PAGE 66 --- The Technical Education and Skills Development Authority (TESDA) wishes to extend thanks and appreciation to the many representatives of business, industry, academe and government agencies, non- government organizations including professional associations who donated their time and expertise to the development and validation of this Training Regulations. EXECUTIVE COMMITTEE, Health Care Industry Training Council, Inc. • Dr. Juan Ma. Pablo R. Nañagas, MPH, MNSA Chairperson • Dr. Kenneth Vincent Ronquillo, MPHM Deputy Chair • Pilar L. Singson Malabunga, RN, MAN Secretary (2003-2004) • Evangeline E. Rafael, RN, MPA, MHA, PhD Secretary • Dr. Irineo Bernardo, III Treasurer • Professor Quintin G. Tan Board Member • Ma. Rita V. Tamse, RN, MN Board Member Comm