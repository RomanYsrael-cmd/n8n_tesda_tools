otiate to\nsolve differences with\ncolleagues\n• Lecture-\n Discussion\n• Group discussion\n• Demonstration\n• Written Examination\n• Oral Questioning\n• Observation\n\n3.3 Resolve conflict\nsituations\n• Identify enterprise policies\nand procedures in regard to\nresolving conflict\n• Identify scope of individual\nresponsibility and job role\n• Discuss the ability to\nmanaging conflict\n• Lecture-\nDiscussion\n• Group discussion\n• Demonstration\n• Written Examination\n• Oral Questioning\n• Observation\n\n4. Manage\nguests\nfinancial\nrecords\n4.1 Determine the\ncontext of guest\nfinancial records\n\n⚫\nIdentify financial\ndocumentation\n⚫\nIdentify goods and\nservices that require\nrecord\n⚫\nDiscuss accounting\nprocess for the\nestablishment\n⚫\nIdentify types of\ntransaction\n⚫\nDiscuss deposit and\nadvance payment\nrequirements\n• Lecture-\n Discussion\n• Group discussion\n• Demonstration\n• Written Examination\n• Oral Questioning\n• Observation\n\n80 Hours\n\n--- PDF PAGE 143 ---\nFRONT OFFICE SERVICES NC IV Revision 00 Promulgated (12/17/2019)\n139\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Contents\nPractical Activities\nMethodologies\nAssessment Methods\nNominal\nDuration\n⚫\nDiscuss room rates that\napply to the property\n⚫\nDiscuss guest record\nkeeping system\n⚫\nDiscuss limitations and\nrestrictions that apply to\nguest financial\ntransactions\n⚫\nIdentify procedures for\ndealing with problem\naccount situations\n⚫\nDiscuss payment options\nfor guests\n\n4.2 Establish guest\nfinancial record\n⚫\nIdentify guest account\n⚫\nDiscuss payment from\nguests\n⚫\nCheck guest history\n⚫\nDemonstrate the ability to\nuse the reservation and\naccount keeping system of\nthe host enterprise\n• Lecture-\nDiscussion\n• Group discussion\n• Demonstration\n• Written Examination\n• Oral Questioning\n• Observation\n\n4.3 Manage guest\nfinancial record\n1. Identify all reception\nrecords and reports that\nneed to be created,\namended, produced,\nupdated and distributed\n2. Discuss role of night\nauditing in the overall\noperational and financial\nmanagement of the property\n3. Demonstrate the ability to\nnegotiate with guests,\nconflict and complaint\n• Lecture-\n Discussion\n• Group discussion\n• Demonstration\n• Written Examination\n• Oral Questioning\n• Observation\n\n--- PDF PAGE 144 ---\nFRONT OFFICE SERVICES NC IV Revision 00 Promulgated (12/17/2019)\n140\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Contents\nPractical Activities\nMethodologies\nAssessment Methods\nNominal\nDuration\nresolution skills, literacy and\nnumeracy skills and cash\nhandling skills\n4.4 Finalize guest\nfinancial record\n4. Explain how to review,\ncheck, post and analyze\ntrading data, statistics and\nguest charges\n5. Demonstrate the ability to\nfinalize the guest accounts\nfollowing establishment\nstandards\n• Lecture-\n Discussion\n• Group discussion\n• Demonstration\n• Written Examination\n• Oral Questioning\n• Observation\n\n--- PDF PAGE 145 ---\nFRONT OFFICE SERVICES NC IV Revision 00 Promulgated (12/17/2019)\n141\n3.2\nTRAINING DELIVERY\n\n1. The delivery of training shall adhere to the design of the curriculum. Delivery\nshall be guided by the principles of competency-based TVET.\n\na. Course design is based on competency standards set by the industry or\nrecognized industry sector; (Learning system is driven by competencies\nwritten to industry standards)\n\nb. Training\ndelivery\nis\nlearner-centered\nand\nshould\naccommodate\nindividualized and self-paced learning strategies;\n\nc. Training can be done on an actual workplace setting, simulation of a\nworkplace and/or through adoption of modern technology.\n\nd. Assessment is based in the collection of evidence of the performance of\nwork to the industry required standards;\n\ne. Assessment of competency takes the trainee’s knowledge and attitude into\naccount but requires evidence of actual performance of the competency as\nthe primary source of evidence.\n\nf. Training program allows for recognition of prior learning (RPL) or current\ncompetencies;\n\ng. Training completion is based on satisfactory completion of all specified\ncompetencies not on the specified nominal duration of learning.\n\n2. The competency-based TVET system recognizes various types of delivery\nmodes, both on-and off-the-job as long as the learning is driven by the\ncompetency standards specified by the industry. The following training\nmodalities and their variations/components may be adopted singly or in\ncombination with other modalities when designing and delivering training\nprograms:\n\n2.1 Institution- Based:\n\n• Dual Training System (DTS)/Dualized Training Program (DTP) which\ncontain both in-school and in-industry training or fieldwork\ncomponents. Details can be referred to the Implementing Rules and\nRegulations of the DTS Law and the TESDA Guidelines on the DTP;\n\n--- PDF PAGE 146 ---\nFRONT OFFICE SERVICES NC IV Revision 00 Promulgated (12/17/2019)\n142\n• Distance learning is a formal education process in which majority of\nthe instruction occurs when the students and instructor are not in the\nsame place. Distance learning may employ correspondence study,\naudio, video, computer technologies or other modern technology that\ncan be used to facilitate learning and formal and non-formal training.\nSpecific guidelines on this mode shall be issued by the TESDA\nSecretariat.\n\n• The traditional classroom-based or in-center instruction may be\nenhanced through use of learner-centered methods as well as\nlaboratory or field-work components.\n\n2.2 Enterprise-Based:\n\n• Formal Apprenticeship – Training within employment involving a\ncontract between an apprentice and an enterprise on an approved\napprenticeable occupation.\n\n• Informal Apprenticeship - is based on a training (and working)\nagreement between an apprentice and a master craftsperson wherein\nthe agreement may be written or oral and the master craftsperson\ncommits to training the apprentice in all the skills relevant to his or her\ntrade over a significant period of time, usually between one and four\nyears, while the apprentice commits to contributing productively to the\nwork of the business. Training is integrated into the production process\nand apprentices learn by working alongside the experienced\ncraftsperson.\n\n• Enterprise-based Training- where training is implemented within the\ncompany in accordance with the requirements of the specific\ncompany. Specific guidelines on this mode shall be issued by the\nTESDA Secretariat.\n\n2.3 Community-Based – Community-Based – short term programs\nconducted by non-government organizations (NGOs), LGUs, training\ncenters and other TVET providers which are intended to address the\nspecific needs of a community. Such programs can be conducted in\ninformal settings such as barangay hall, basketball courts, etc. These\nprograms can also be mobile training program (MTP).\n\n--- PDF PAGE 147 ---\nFRONT OFFICE SERVICES NC IV Revision 00 Promulgated (12/17/2019)\n143\n\n3.3\nTRAINEE ENTRY REQUIREMENTS\n\nTrainees or students who wish to enter this training should possess the\nfollowing requirements:\n\n• Must have completed the 10-year basic education or an Alternative\nLearning System (ALS) Certificate of Completion with grade 10 equivalent\nholder\n• Must possess good communications skills\n• Must be computer literate\n• Can perform basic mathematical computation\n• Must be competent in Front Office Services NC III qualification gained\nthrough training or experience or certification\n\n3.4 LIST OF TOOLS, EQUIPMENT AND MATERIALS\n\nList of tools, equipment and materials for the training of a maximum of 25\ntrainees for FRONT OFFICE SERVICES NC IV are as follows:\n\nTOOLS\nEQUIPMENT\nMATERIALS\nQTY\n\nQTY\n\nQTY\n\nN/A\n4\nunits\nComputer with\nProperty\nManagement\nSystem and printer\n25 pcs.\n\nRegistration form\n\n1 pc\nCash register\n5 pcs.\nCancellation\nbooking form\n\n1 pc.\nFake Bills detector\n5 pcs.\nNo-show forms\n\n1 pc\nMagnetic card\nreader\n25 pcs. General folio\n\n1 pc.\nCredit card\nimprinter\n25 pcs. Credit card\nvoucher\n\n1 unit Front office counter\n25 pcs. Different forms\n\n1 pc.\nCash box drawer\n5 pcs.\nNotice slip\n\n5 pcs. Guest folio rack\n\n1 pc\nTelephone\n\n 1 pc\nCalculator\n\n--- PDF PAGE 148 ---\nFRONT OFFICE SERVICES NC IV Revision 00 Promulgated (12/17/2019)\n144\n3.5\nTRAINING FACILITIES\n\nBased on a class intake of 25 students/trainees.\n\nSPACE REQUIREMENT\nSIZE IN METERS\nAREA IN SQ.\nMETERS\nTOTAL AREA IN\nSQ. METERS\nLecture Room\n8 x 7\n56\n56\nLearning Resource Center\n3 x 5\n15\n15\nFacilities/Equipment/ Circulation\nArea\n\n21\n\n Total Workshop Area :\n92\n\n3.6\nTRAINER’S QUALIFICATIONS\n\n• Must be a holder of National TVET Trainer Certificate (NTTC) Level I in Front\n Office Services NC IV\n• Must have at least two years in industry experience in any FO related works\n as manager\n\n3.7\nINSTITUTIONAL ASSESSMENT\n\nInstitutional assessment is undertaken by trainees to determine their\nachievement of units of competency. A certificate of achievement is issued for\neach unit of competency.\n\n--- PDF PAGE 149 ---\nFRONT OFFICE SERVICES NC IV Revision 00 Promulgated (12/17/2019)\n145"
