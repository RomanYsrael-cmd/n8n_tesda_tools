CIES\n(215 hours)\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Contents\nPractical Activities\nMethodologies\nAssessment Methods\nNominal\nDuration\n1. Plan and\nestablish\nsystems and\nprocedures\n1.1 Plan and develop\nsystems and\nprocedures\n•\nIdentify enterprise\nsystems and\nprocedures\n•\nPlanning and\norganizing activities\n•\nDeveloping systems\nand procedures\n•\nIdentify legal and\nethical constraints\n• Lecture-\n Discussion\n• Group discussion\n• Demonstration\n\n• Written Examination\n• Oral Questioning\n• Observation\n\n40 Hours\n\n1.2 Establish systems\nand procedures\n•\nEstablishing systems\nand procedures\n•\nIdentify customer and\ncolleague needs\n•\nDevelop training and\nsupport to colleagues\nand staff\n• Lecture-\n Discussion\n• Demonstration\n• Role play\n\n• Written Examination\n• Oral Questioning\n• Observation\n\n1.3 Review systems\nand procedures\n\n•\nMonitor efficiency and\neffectiveness of\nsystems and\nprocedures\n•\nIdentify problems or\npotential problems in\nproposed or existing\nsystems and\nprocedures\n• Lecture-\n Discussion\n• Group discussion\n\n• Written Examination\n• Oral Questioning\n\n2. Lead and\nmanage\npeople\n2.1 Standards of\nperformance and\nbehavior\n•\nIdentify leadership styles\nand the characteristics of\neffective leadership\n•\nIdentify organizational\nstructure and group\ndynamics\n• Lecture-\n Discussion\n• Group discussion\n• Demonstration\n• Written Examination\n• Oral Questioning\n• Observation\n\n45 Hours\n\n--- PDF PAGE 141 ---\nFRONT OFFICE SERVICES NC IV Revision 00 Promulgated (12/17/2019)\n137\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Contents\nPractical Activities\nMethodologies\nAssessment Methods\nNominal\nDuration\n•\nIdentify workplace conflict,\ntypical causes including\ncultural differences and\nhow they impact on the\nrole of leaders\n2.2 Develop team\ncommitment and\nco-operation\n\n•\n Explaining and discussing\nthe rationale for a\nmanagement decision that\naffects the team\n•\nDiscuss calculating sales\ntargets\n•\nIdentify role and theories of\nmotivation and its\napplication to different\nworkplace contexts\n\n• Lecture-\n Discussion\n• Group discussion\n• Demonstration\n• Written Examination\n• Oral Questioning\n• Observation\n\n2.3 Manage team\nperformance\n•\nIdentify sales figures to\nassess team performance\n•\nLeadership styles and the\ncharacteristics of effective\nleadership\n•\nDiscuss mentoring and\ncoaching to ensure\nprogress towards\nachievement of goals\n• Lecture-\n Discussion\n• Group discussion\n• Demonstration\n\n• Written Examination\n• Oral Questioning\n• Observation\n\n3. Manage and\nresolve\nconflict\nsituations\n3.1 Respond to\ncomplaints\n\n• Identify enterprise policies\nand procedures in regard to\ncomplaints\n• Discuss positive\ncommunication to encourage\ndifferent points of view\n• Identify different kinds of\ncomplaints\n• Lecture-\n Discussion\n• Group discussion\n• Demonstration\n• Written Examination\n• Oral Questioning\n• Observation\n\n50 Hours\n\n--- PDF PAGE 142 ---\nFRONT OFFICE SERVICES NC IV Revision 00 Promulgated (12/17/2019)\n138\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Contents\nPractical Activities\nMethodologies\nAssessment Methods\nNominal\nDuration\n• Discuss principles of conflict\nresolution and respond to\ncomplaints\n\n3.2 Identify and\nmanage conflict\nsituations\n• Identify enterprise policies\nand procedures in regard to\nmanaging conflict\n• Identify the nature of a\nconflict situation\n• Discuss how to negotiate to\nsolve differences with\ncolleagues\n• Lecture-\n Discussion\n• Group discussion\n• Demonstration\n• Written Examination\n• Oral Questioning\n• Observation\n\n3.3 Resolve conflict\nsituations\n• Identify enterprise policies\nand procedures in regard to\nresolving conflict\n• Identify scope of individual\nresponsibility and job role\n• Discuss the ability to\nmanaging conflict\n• Lecture-\nDiscussion\n• Group discussion\n• Demonstration\n• Written Examination\n• Oral Questioning\n• Observation\n\n4. Manage\nguests\nfinancial\nrecords\n4.1 Determine the\ncontext of guest\nfinancial records\n\n⚫\nIdentify financial\ndocumentation\n⚫\nIdentify goods and\nservices that require\nrecord\n⚫\nDiscuss accounting\nprocess for the\nestablishment\n⚫\nIdentify types of\ntransaction\n⚫\nDiscuss deposit and\nadvance payment\nrequirements\n• Lecture-\n Discussion\n• Group discussion\n• Demonstration\n• Written Examination\n• Oral Questioning\n• Observation\n\n80 Hours\n\n--- PDF PAGE 143 ---\nFRONT OFFICE SERVICES NC IV Revision 00 Promulgated (12/17/2019)\n139\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Contents\nPractical Activities\nMethodologies\nAssessment Methods\nNominal\nDuration\n⚫\nDiscuss room rates that\napply to the property\n⚫\nDiscuss guest record\nkeeping system\n⚫\nDiscuss limitations and\nrestrictions that apply to\nguest financial\ntransactions\n⚫\nIdentify procedures for\ndealing with problem\naccount situations\n⚫\nDiscuss payment options\nfor guests\n\n4.2 Establish guest\nfinancial record\n⚫\nIdentify guest account\n⚫\nDiscuss payment from\nguests\n⚫\nCheck guest history\n⚫\nDemonstrate the ability to\nuse the reservation and\naccount keeping system of\nthe host enterprise\n• Lecture-\nDiscussion\n• Group discussion\n• Demonstration\n• Written Examination\n• Oral Questioning\n• Observation\n\n4.3 Manage guest\nfinancial record\n1. Identify all reception\nrecords and reports that\nneed to be created,\namended, produced,\nupdated and distributed\n2. Discuss role of night\nauditing in the overall\noperational and financial\nmanagement of the property\n3. Demonstrate the ability to\nnegotiate with guests,\nconflict and complaint\n• Lecture-\n Discussion\n• Group discussion\n• Demonstration\n• Written Examination\n• Oral Questioning\n• Observation\n\n--- PDF PAGE 144 ---\nFRONT OFFICE SERVICES NC IV Revision 00 Promulgated (12/17/2019)\n140\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Contents\nPractical Activities\nMethodologies\nAssessment Methods\nNominal\nDuration\nresolution skills, literacy and\nnumeracy skills and cash\nhandling skills\n4.4 Finalize guest\nfinancial record\n4. Explain how to review,\ncheck, post and analyze\ntrading data, statistics and\nguest charges\n5. Demonstrate the ability to\nfinalize the guest accounts\nfollowing establishment\nstandards\n• Lecture-\n Discussion\n• Group discussion\n• Demonstration\n• Written Examination\n• Oral Questioning\n• Observation\n\n--- PDF PAGE 145 ---\nFRONT OFFICE SERVICES NC IV Revision 00 Promulgated (12/17/2019)\n141",
