  "source_section_text": "SECTION 3 TRAINING ARRANGEMENTS\n\nThese standards are set to provide technical and vocational education and training (TVET)\nproviders with information and other important requirements to consider when designing training\nprograms for FRONT OFFICE SERVICES NC IV.\n\nThey include information on curriculum design; training delivery; trainee entry requirements;\ntools and equipment; training facilities; and trainer’s qualification.\n\n3.1\nCURRICULUM DESIGN\n\nTESDA shall provide the training on the development of competency-based curricula\nto enable training providers develop their own curricula with the components mentioned\nbelow.\n\nDelivery of knowledge requirements for the basic, common and core units of\ncompetency\nspecifically\nin\nthe\nareas\nof\nmathematics,\nscience/technology,\ncommunication/language and other academic subjects shall be contextualized. To this end,\nTVET providers shall develop a Contextual Learning Matrix (CLM) to accompany their\ncurricula.\n\nCourse Title: FRONT OFFICE SERVICES\n\nNC Level IV\n\nNominal Training Duration: 47 Hours Basic Competencies\n\n 190 Hours Common Competencies\n\n 215 Hours Core Competencies\n\nTotal 452 Hours\n\n 64 Hours Supervised Industry Learning (SIL)\n\nCourse Description:\nThis course is designed to enhance the knowledge, skill and attitudes of FRONT\nOFFICE SERVICES NC IV in accordance with industry standards. This covers\ncompetencies that a person must achieve in planning and establishing systems and\nprocedures, leading and managing people, managing and resolving conflict situations and\nmanaging guests’ financial records. These competencies are required to individuals who\nwill work at any tourism and hospitality enterprises.\n\nTo complete the course, all units prescribed for this qualification must be achieved.\n\n--- PDF PAGE 118 ---\nFRONT OFFICE SERVICES NC IV Revision 00 Promulgated (12/17/2019)\n114\nBASIC COMPETENCIES\n(47 Hours)\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nMethod\nNominal\nDuration\n1. Utilize\nspecialized\ncommunication\nskills\n\n1.1 Meet common and\nspecific\ncommunication\nneeds of clients\nand colleagues\n\n• Read\n➢\nCommunication process\n➢\nDynamics of groups and\ndifferent styles of group\nleadership\n• Identify different approaches to meet the\nneeds of clients and colleagues\n• Lecture\n• Written examination\n1 Hour\n1.2. Contribute to the\ndevelopment of\ncommunication\nstrategies\n• Apply communication skills to fulfill job\nroles as specified by the organization\n• Apply communication techniques in\ncommunicating with clients and\ncolleagues\n➢\nActive listening\n➢\nFeedback\n➢\nInterpretation\n➢\nRole boundaries setting\n➢\nNegotiation\n➢\nEstablishing empathy\n• Describe strategies for internal and\nexternal dissemination of information\n• Demonstration\n• Group\ndiscussion\n• Observation\n• Oral evaluation\n1 Hour\n1.3. Deliver a technical\npresentation\n• Enhance the presentation using\nappropriate media\n• Deliver a clear and sequential\npresentation within given time\n• Demonstration\n• Observation\n1 Hour\n\n1.4 Represent the\norganization\n\n• Describe criteria for a good presentation\n• Prepare presentation material for internal\nor external forums to promote the\norganization\n• Demonstration\n• Observation\n1 Hour\n\n--- PDF PAGE 119 ---\nFRONT OFFICE SERVICES NC IV Revision 00 Promulgated (12/17/2019)\n115\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nMethod\nNominal\nDuration\n1.5 Facilitate group\ndiscussion\n• Gather relevant information\n• Apply values in facilitating differences in\nviews\n• Demonstration\n• Observation\n1 Hour\n1.6 Conduct interview\n• Describe communication strategies\nemployed in interview situations\n• Conduct interview\n• Apply organizations procedure in\nmaintaining records of interviews\n• Use questioning, listening and nonverbal\ncommunication techniques to client\ngroups\n• Group\ndiscussion\n• Demonstration\n• Oral evaluation\n• Observation\n1 Hour\n2. Develop and\nlead teams\n2.1 Foster individual\ngrowth\n\n• Discussion on Team Leadership and\nexpectation from team leaders\n• Case study on learning and development\nneeds of team members\n• Discussion on organizational\nrequirements from team members\n• Role play on coaching and mentoring\n• Discussion on preparation of team\nmembers development plan\n• Role Play on providing feedback on\nperformance\n•\nObservation\nLecture/\nDiscussion\n•\nCase Study\n•\nRole Play\n•\nRole Play\n•\nCase Study\n•\nWritten Test\n• Observation\n• Role Play\n• Case Study\n▪ Written Test\n2 Hours\n2.2 Foster individual\nand team growth\n• Discussion on learning and development\nprogram goal setting\n• Preparation of learning and development\nprogram goals\n• Discussion on learning delivery methods\n• Role play on the different learning\ndelivery methods\n• Discussion on workplace learning\nopportunities\n• Role play on coaching and mentoring\n• Lecture/\nDiscussion\n• Case Study\n• Role Play\n• Observation\n• Role Play\n• Case Study\n• Written Test\n2 Hours\n\n--- PDF PAGE 120 ---\nFRONT OFFICE SERVICES NC IV Revision 00 Promulgated (12/17/2019)\n116\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nMethod\nNominal\nDuration\n\n2.3 Monitor and\nevaluate workplace\nlearning\n•\nDiscussion on the different levels of\nlearning evaluation.\n•\nDiscussion on the different methods\nused to evaluate learning\n•\nDevelop reporting system for\nmonitoring of performance attributed\nto learning programs\n•\nGathering of information to evaluate\nindividual performance attributed to\nlearning programs\n•\nCase study on modification of\nlearning plan based on performance\n• Lecture/\nDiscussion\n• Case Study\nRole Play\n• Observation\n• Role Play\n• Case Study\n• Written Test\n2 Hours\n\n2.4 Develop team\ncommitment and\ncooperation\n• Discussion on team commitment and\ncooperation and its impact to attainment\nof goals\n• Play games on team commitment and\ncooperation\n• Discussion on team dynamics and its\nrelation to team performance\n• Play games on team dynamics and\nperformance\n• Development of career plans\n\n• Lecture/\nDiscussion\n• Case Study\n• Role Play\n• Observation\n• Role Play\n• Case Study\n• Written Test\n1 Hour\n\n2.5 Facilitate\naccomplishment of\nteam goals\n• Perform team building activities towards\nimproving communication among team\nmembers, goal setting and improving\nperformance\n• Case studies involving collaborative\nactivities to improve attainment of group\ngoals\n• Group Activity\n• Case Study\n\n• Role Play\n• Case Study\n• Observation\n1 Hour\n\n--- PDF PAGE 121 ---\nFRONT OFFICE SERVICES NC IV Revision 00 Promulgated (12/17/2019)\n117\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nMethod\nNominal\nDuration\n3. Perform\nhigher-order\nthinking\nprocesses and\napply\ntechniques in\nthe workplace\n3.1 Evaluate\neffectiveness and\nefficiency of the\nworkplace systems,\nprocesses and\nprocedures\n• Examine current systems, standards,\nprocedures and protocols in the\nworkplace\n• Discuss different methods of critical and\nappreciative inquiry and their relevance\nto different situations\n• Form habit of asking questions and\ntaking responsibility for answers\n• Appreciate importance of why questions\nfor individuals, businesses and\ncommunities\n• Use range of analytical techniques\n• Examine different strategies and\ntechniques in communicating results,\napplying critical thinking pathway,\nassessing effectiveness and efficiency\nof systems, processes and procedures\n\n• Group\ndiscussion\n• Lecture\n• Demonstration\n• Role playing\n• Case Formulation\n• Life Narrative Inquiry\n(Interview)\n• Standardized test\n1 Hour\n\n--- PDF PAGE 122 ---\nFRONT OFFICE SERVICES NC IV Revision 00 Promulgated (12/17/2019)\n118\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nMethod\nNominal\nDuration\n\n3.2 Foster the habit of\ncritical inquiry and\ncuriosity in the\nworkplace\n• Discuss different methods of critical and\nappreciative inquiry and their relevance\nto different situations\n• Form habit of asking questions and\ntaking responsibility for answers\n• Appreciate importance of why questions\nfor individuals, businesses and\ncommunities\n• Use range of analytical techniques,\ngrowth mindset and positive\ncommunication strategies\n• Examine different strategies and\ntechniques in communicating results,\napplying critical thinking pathway,\nassessing effectiveness and efficiency of\nsystems, processes and procedures\n• Discuss insights on workplace\neffectiveness and efficiency\n• Group\ndiscussion\n• Lecture\n• Demonstration\n• Role playing\n• Case Formulation\n• Life Narrative\nInquiry (Interview)\n• Standardized test\n1 Hour\n\n3.3 Develop practical\naction plans for\nimproving\nworkplace\nconditions\n• Use range of analytical techniques,\ngrowth mindset and positive\ncommunication strategies in developing\naction plans for efficiency and\neffectiveness\n• Examine different strategies and\ntechniques in communicating results,\napplying critical thinking pathway,\nassessing effectiveness and efficiency of\nsystems, processes and procedures\n• Discuss concepts creative negotiation\nskills, change management and\nimprovement strategies\n• Group\ndiscussion\n• Lecture\n• Demonstration\n• Role playing\n• Case Formulation\n• Life Narrative\nInquiry (Interview)\n• Standardized test\n• Project-based\nlearning\n2 Hours\n\n--- PDF PAGE 123 ---\nFRONT OFFICE SERVICES NC IV Revision 00 Promulgated (12/17/2019)\n119\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nMethod\nNominal\nDuration\n4. Contribute to\nthe practice of\nsocial justice in\nthe workplace\n\n4.1 Update self on\nlocal, national and\nglobal trends/\nissues in the\nworkplace\n• Explain the local, national and global\nsystems and structures\n• Discuss issues affecting interaction and\nconnectedness of communities at local,\nnational and global levels\n• Explain underlying assumptions and\npower dynamics (politics, understanding\npolitical system, social structures, labor\nlaws, labor relations, human right)\n• Monitor trends and issues relevant to\nhuman rights, gender equality, culture of\npeace, global citizenship, and cultural\ndiversity using different media platforms\n• Analyze trends and issues relevant to\nhuman rights, gender equality, culture of\npeace, global citizenship, and cultural\ndiversity\n• Engage in discourse about the local,\nnational and global issues\n• Interactive\nLecture\n• Small Group\nDiscussion\n• Brainstorming\n• Role-playing\n• Demonstration or\nsimulation with oral\nquestioning\n• Group discussions\nand interactive\nactivities\n• Case studies/\nproblems involving\nworkplace diversity\nissues\n• Written\nexamination\n(Essay)\n• Role Playing\n1 Hour\n\n4.2 Relate local and\nglobal trends to\nworkplace context\n• Discuss the different levels of human\nidentity according to Amber Mayer (2015)\n• Explain different communities people\nbelong to and how these are connected\n• Recognize cultural differences and\nrespect for cultural diversity\n• Recognize differences and\ncommonalities among people\n• Demonstrate attitudes of empathy,\nsolidarity and respect for diversity\n• Connect local issues to global trends,\nand vice versa.\n• Interactive\nLecture\n• Small Group\nDiscussion\n• Brainstorming\n• Role-playing\n• Demonstration or\nsimulation with oral\nquestioning\n• Group discussions\nand interactive\nactivities\n• Case studies/\nproblems involving\nworkplace diversity\nissues\n• Written\nexamination\n(Essay)\n1 Hour\n\n--- PDF PAGE 124 ---\nFRONT OFFICE SERVICES NC IV Revision 00 Promulgated (12/17/2019)\n120\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nMethod\nNominal\nDuration\n\n4.3 Engage and take\nactions on\nworkplace issues\nand concerns\n• Identify the actions that can be taken\nindividually and collectively\n• Describe ethically responsible behaviour\n• Explain the importance and benefits of\ncivic engagement\n• Employ appropriate actions to address\nworkplace issues involving national and\nglobal trends\n• Show concern and willingness to take\npart in the development efforts to\ndiscuss workplace issues and concerns\n• Apply the attitude of “thinking globally\nand acting locally” in the workplace\n• Interactive\nLecture\n• Small Group\nDiscussion\n• Brainstorming\n• Role-playing\n• Demonstration or\nsimulation with oral\nquestioning\n• Group discussions\nand interactive\nactivities\n• Case studies/\nproblems involving\nworkplace diversity\nissues\n• Written\nexamination\n(Essay)\n• Role Playing\n1 Hour\n5. Manage\ninnovative\nwork\ninstructions\n5.1 Review and\nanalyze existing\nworkplace\npractices\n• Show mastery of basic management\nconcepts according to Gallup, nine\ndimensions of innovative practices and\nclimate; and different types of innovation\n• Contextualize innovation to different\nvariables in the organization\n• Review current organizational practices\nwhere innovation is contextualized\n• Interactive\nLecture\n• Appreciative\nInquiry\n• Demonstration\n• Group work\n• Psychological and\nbehavioral\nInterviews\n• Performance\nEvaluation\n• Life Narrative\nInquiry\n• Review of portfolios\nof evidence and\nthird-party\nworkplace reports\nof on-the-job\nperformance.\n• Standardized\nassessment of\ncharacter strengths\nand virtues applied\n1 Hour\n\n--- PDF PAGE 125 ---\nFRONT OFFICE SERVICES NC IV Revision 00 Promulgated (12/17/2019)\n121\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nMethod\nNominal\nDuration\n\n5.2 Examine\nopportunities for\ncontinuous\nimprovement and\ninnovation of\npractices in the\nworkplace\n\n• Show mastery of the determinants of\ninnovative behaviors and principles of\ninnovation\n• Review current organizational practices\nwhere innovation is contextualized\n• Evaluate innovative practices in the\norganization\n• Assess innovative behaviors for\npromoting innovation and learning in the\nworkplace\n• Interactive\nLecture\n• Appreciative\nInquiry\n• Demonstration\n• Group work\n• Psychological and\nbehavioral\nInterviews\n• Performance\nEvaluation\n• Life Narrative\nInquiry\n• Review of portfolios\nof evidence and\nthird-party\nworkplace reports\nof on-the-job\nperformance.\n• Standardized\nassessment of\ncharacter strengths\nand virtues applied\n1 Hour\n\n5.3 Implement\ninnovative ways in\nthe conduct of\nusual workplace\npractices\n\n• Show mastery of the determinants of\ninnovative behaviors, principles of\ninnovation; and dimensions of innovation\nclimate and strategies and techniques\nfor implementing innovation in the\nworkplace\n• Evaluate impact of innovative practices\nin the organization\n• Demonstrate skills in managing changes\nin the workplace\n• Interactive\nLecture\n• Appreciative\nInquiry\n• Demonstration\n• Group work\n• Psychological and\nbehavioral\nInterviews\n• Performance\nEvaluation\n• Life Narrative\nInquiry\n• Review of portfolios\nof evidence and\nthird-party\nworkplace reports\nof on-the-job\nperformance.\n• Standardized\nassessment of\n1 Hour\n\n--- PDF PAGE 126 ---\nFRONT OFFICE SERVICES NC IV Revision 00 Promulgated (12/17/2019)\n122\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nMethod\nNominal\nDuration\ncharacter strengths\nand virtues applied\n6. Manage and\nevaluate\nusage of\ninformation\n\n6.1 Review information\nneeds and sources\n• Lecture and discussion on:\no Kinds of information\no Information evaluation issues\no Information storage requirements\nand methods\n• Analysing record information\n• Identification of information sources\n• Lecture\n• Group\nDiscussion\n• Hands on\n• Demonstration\n• Practical\nexercises\n• Oral evaluation\n• Written Test\n• Observation\n• Presentation\n2 Hours\n\n6.2 Collect and analyze\ninformation\n• Lecture and discussion on:\no Information collection and collation\no Relevant trends and developments\n• Collection of information\n• Analyzation of information\n• Lecture\n• Group\nDiscussion\n• Hands on\n• Demonstration\n• Practical\nexercises\n• Oral evaluation\n• Written Test\n• Observation\n• Presentation\n2 Hours\n\n6.3 Use management\ninformation\nsystems\n• Lecture and discussion on:\no Management information systems\no Available technology in information\nmanagement\no Advance strategies for customer\nservice excellence\n• Use of available technology in\ninformation management\n• Lecture\n• Group\nDiscussion\n• Hands on\n• Demonstration\n• Practical\nexercises\n• Oral evaluation\n• Written Test\n• Observation\n• Presentation\n2 Hours\n\n6.4 Report and\ndisseminate\nanalyzed\ninformation\n• Lecture and discussion on:\no Reporting procedures of the\norganisation\no Analysis and display techniques\n• Using management information systems\nto store and retrieve data\n• Lecture\n• Group\nDiscussion\n• Hands on\n• Demonstration\n• Practical\nexercises\n• Oral evaluation\n• Written Test\n• Observation\n• Presentation\n2 Hours\n\n--- PDF PAGE 127 ---\nFRONT OFFICE SERVICES NC IV Revision 00 Promulgated (12/17/2019)\n123\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nMethod\nNominal\nDuration\n7. Lead in\nimprovement\nof\nOccupational\nSafety and\nHealth (OSH)\nprograms,\npolicies and\nprocedures\n7.1 Assess\nOccupational\nSafety and Health\n(OSH) practices\nand programs\n• Case Study in evaluating current OSH\nprograms effectiveness\n• Practice auditing the workplace\n•\nLecture\n•\nGroup\nDiscussion\n•\nCase Study\n•\nGroup\nProject\n\n•\nWritten Exam\n•\nDemonstration\n•\nObservation\n•\nInterviews /\nQuestioning\nPortfolio\n2 Hours\n\n7.2 Recommend OSH\n program\n improvement\n initiatives\n• Writing and Presenting Action Plans to\nimprove OSH compliance in the\nworkplace and/or increase effectiveness\nof OSH Programs\n•\nLecture\n•\nGroup\nDiscussion\n•\nCase Study\n•\nGroup\nProject\n\n•\nWritten Exam\n•\nDemonstration\n•\nObservation\n•\nInterviews /\nQuestioning\nPortfolio\n4 Hours\n\n7.3 Implement\nrecommended\nimprovements on\nOccupational\nSafety and Health\n(OSH) Programs,\nProcedures and\nPolicies\n• Role play in increasing the OSH\nawareness\n• Measuring the impact of the new OHS\nprogram or initiative\n•\nLecture\n•\nGroup\nDiscussion\n•\nCase Study\n•\nGroup\nProject\n•\nWritten Exam\n•\nDemonstration\n•\nObservation\n•\nInterviews /\n Questioning\n Portfolio\n2 Hours\n8. Lead towards\nimprovement\nof\nenvironmental\nwork\nprograms,\npolicies and\nprocedures\n8.1 Assess\nenvironmental work\npractices and\nprograms\n• Discussion of Green structural change\nand retraining needs\n-\nWhat is green structural change and\nwhere is it happening\n-\nWorkforce restructuring and\nadjustment\n-\nEmployment effects of Environment\n-\nSectors most affected by green\nrestructuring\n• Lecture\n• Group\nDiscussion\n• Demonstration\n• Case Study\n• Reporting\n\n• Written Exam\n• Demonstration\n• Observation\n• Interviews /\nQuestioning\n• Third Party\nReports\n1 Hour\n\n--- PDF PAGE 128 ---\nFRONT OFFICE SERVICES NC IV Revision 00 Promulgated (12/17/2019)\n124\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nMethod\nNominal\nDuration\n-\nRetraining and skills upgrading\n-\nEffective and equitable\nrestructuring: Good practices and\nprograms by public and private\nsector actors\n• Perform Impact Assessment\n• Discussions of Gender Implications\n\n8.2 Recommend\nenvironmental\nprogram\nimprovement\ninitiatives\n• Practicing Leadership skills: The biggest\nchallenge in transition to a low-carbon\neconomy or environment friendly\nactivities\n• Practicing Basic Business planning\n• Opportunities Management -\nIdentification of low-carbon and\nResource scarcity risks\n• Perform Cost–benefit Analysis\n• Lecture\n• Group\nDiscussion\n• Demonstration\n• Case Study\n• Reporting\n\n• Written Exam\n• Demonstration\n• Observation\n• Interviews /\nQuestioning\n• Third Party\nReports\n1 Hour\n\n8.3 Implement\nrecommended\nimprovements on\nenvironmental\nprograms, policies\nand procedures\n• Practicing Environmental Awareness\nRaising (Communication/\nImplementation campaigns)\n• Teaching and training personnel -\nnecessary skills and methods to impart\nenvironmental knowledge, to create\nawareness and to react flexibly to ever-\nchanging labor market needs.\n• Lecture\n• Group\nDiscussion\n• Demonstration\n• Case Study\n• Reporting\n\n• Written Exam\n• Demonstration\n• Observation\n• Interviews /\nQuestioning\n• Third Party\nReports\n1 Hour\n9. Sustain\nentrepreneurial\nskills\n9.1 Enhance one’s\nbusiness skills\n• Discussion on entrepreneurial skills\n• Identifying market trends\n• Case studies on new technologies,\nproducts and processes\n• Practice gathering information on new\ntrends\n\n• Lecture/\nDiscussion\n• Case study\n• Group work\n• Written Report\n• Case problem\n3 Hours\n\n--- PDF PAGE 129 ---\nFRONT OFFICE SERVICES NC IV Revision 00 Promulgated (12/17/2019)\n125\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nMethod\nNominal\nDuration\n\n9.2 Manage entrepreneurial\npractices\n\n• Discussion on continuous improvement\n• Presentation of plans for continuous\nimprovement\n• Evaluation of new products and services\n\n• Lecture\ndiscussion\n• Group work\n• Written Report\n• Case problem\n1 Hour\n\n9.3 Expand markets\nand clientele\n• Prepare business plan and proposal\n• Lecture\ndiscussion\n• Group work\n• Portfolio\n1 Hour\n\n--- PDF PAGE 130 ---\nFRONT OFFICE SERVICES NC IV Revision 00 Promulgated (12/17/2019)\n126\nCOMMON COMPETENCIES\n(190 Hours)\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n1. Maintain\nhospitality\nindustry\nknowledge\n1.1 Seek\ninformation on\nthe hospitality\nindustry\n\n•\nIdentify and access sources of\ninformation on the hotel and travel\nindustries, appropriately and correctly\n•\nObtain information on the hotel and\ntravel industries to assist effective work\nperformance within the industries\n•\nAccess and update specific information\non relevant sector(s) of work\n•\nUse knowledge of the hotel and travel\nindustries in the correct context to\nenhance quality of work performance\n•\nObtain information on other industries to\nenhance quality of work performance\n• Discussion\n• Demonstration\n• Lecture\n• Group discussion\n• Simulation\n\n• Observation\n• Demonstration\n• Written\nExamination\n• Interview\n\n5 Hours\n\n1.2 Source and\napply\ninformation on\nlegal and ethical\nissues for the\nhospitality\nindustry\n•\nObtain information on legal issues and\nethical issues to assist effective work\nperformance\n•\nConduct day-to-day hospitality industry\nactivities in accordance with legal\nobligations and ethical industry\npractices\n• Discussion\n• Demonstration\n• Lecture\n• Group discussion\n• Simulation\n\n• Observation\n• Demonstration\n• Written\nExamination\n• Interview\n\n5 Hours\n\n1.3 Update\nhospitality\nindustry\nknowledge\n•\nIdentify and use a range of opportunities\nto update general knowledge of the\nhotel and travel industries\n•\nMonitor current issues of concern to the\nindustries\n•\nShare updated knowledge with\ncustomers and colleagues as appropriate\nand incorporate this knowledge into day-\nto-day work activities\n• Discussion\n• Demonstration\n• Lecture\n• Group discussion\n• Simulation\n\n• Observation\n• Demonstration\n• Written\nExamination\n• Interview\n\n10 Hours\n\n--- PDF PAGE 131 ---\nFRONT OFFICE SERVICES NC IV Revision 00 Promulgated (12/17/2019)\n127\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n2. Perform child\nprotection duties\nrelevant to the\ntourism indu