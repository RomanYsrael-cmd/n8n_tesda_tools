ies.\n•\nChanges in income and expenditure\npriorities are discussed with\nappropriate colleagues prior to\nimplementation\n•\nAll relevant personnel are consulted\nand informed in relation to resource\ndecisions\n•\nAwareness of the importance of\nbudget control is promoted\n•\nDetailed records of resource\nallocation are maintained in\naccordance with enterprise control\nsystems.\n• Discussion\n• Demonstration\n• Lecture\n• Group discussion\n• Power Point\npresentation\n• Simulation\n• Video\npresentation\n• Self-paced\nhandouts or\nmodule\n• Group reporting\n\n• Observation\n• Demonstration\n• Written\nExamination\n• Oral Examination\n• Practical\nExamination\n• Interview\n• Oral Questioning\n\n6 Hours\n\n5.8 Monitor financial\nactivities against\nbudget\n•\nActual income and expenditure are\nchecked against budgets accurately and\nat regular intervals.\n•\nFinancial commitments are included in\nall documentation to ensure accurate\nmonitoring.\n•\nDeviations are identified and reported\naccording to company policy and\nsignificance of deviation.\n•\nAppropriate options for more effective\nmanagement of deviations are\ninvestigated.\n• Discussion\n• Demonstration\n• Lecture\n• Group discussion\n• Power Point\npresentation\n• Simulation\n• Video\npresentation\n• Self-paced\nhandouts or\nmodule\n• Group reporting\n• Observation\n• Demonstration\n• Written\nExamination\n• Oral Examination\n• Practical\nExamination\n• Interview\n• Oral Questioning\n\n4 Hours\n\n--- PDF PAGE 135 ---\nFRONT OFFICE SERVICES NC IV Revision 00 Promulgated (12/17/2019)\n131\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n•\nAppropriate colleagues are advised of\nbudget status in relation to targets\nwithin agreed timeframes.\n\n5.9 Identify and\nevaluate options\nfor improved\nbudget\nperformance\n•\nExisting costs and resources are\nassessed and areas for improvement\nare identified.\n•\nDesired outcomes are discussed with\nrelevant colleagues.\n•\nAppropriate research is conducted to\ninvestigate new approaches.\n•\nBenefits and disadvantages of new\napproaches are defined and clearly\ncommunicated.\n•\nImpacts on customer service levels and\ncolleagues are considered when\ndeveloping new approaches.\n•\n Recommendations are presented\nclearly and logically to the appropriate\nperson/ department.\n• Discussion\n• Demonstration\n• Lecture\n• Group discussion\n• Power Point\npresentation\n• Simulation\n• Video\npresentation\n• Self-paced\nhandouts or\nmodule\n• Group reporting\n\n• Observation\n• Demonstration\n• Written\nExamination\n• Oral Examination\n• Practical\nExamination\n• Interview\n• Oral Questioning\n\n5 Hours\n\n5.4 Complete\nfinancial reports\n•\nAll required financial reports are\ncompleted accurately and within\ndesignated timelines.\n•\nClear and concise information are\nproduced to enable informed decision-\nmaking.\n•\nReports are promptly forwarded to the\nappropriate person/department.\n• Discussion\n• Demonstration\n• Lecture\n• Group discussion\n• Power Point\npresentation\n• Simulation\n• Video\npresentation\n• Self-paced\nhandouts or\nmodule\n• Group reporting\n• Observation\n• Demonstration\n• Written\nExamination\n• Oral Examination\n• Practical\nExamination\n• Interview\n• Oral Questioning\n\n5 Hours\n\n--- PDF PAGE 136 ---\nFRONT OFFICE SERVICES NC IV Revision 00 Promulgated (12/17/2019)\n132\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n6. Plan and\nimplement a\nseries of training\nevents\n6.1 Plan a series of\ntraining events\n•\nVerify identified training need\n•\nPrioritize identified training need\n•\nDetermine resources available to\nsupport training events to address\nidentified training need\n•\nIdentify training events that will address\nidentified workplace training need\n•\nDetermine availability of learners to\nattend and participate in identified\ntraining events\n•\nInvolve stakeholders in planning\nactivities\n•\nDevelop a schedule for implementing\nidentified training events\n•\nDevelop an operational plan to support\nthe implementation of identified training\nevents\n•\nShare the implementation plan for\ntraining events with stakeholders\n•\nEncourage identified learners to engage\nwith established training events\n• Discussion\n• Demonstration\n• Lecture\n• Group discussion\n• Power Point\npresentation\n• Simulation\n• Video\npresentation\n• Self-paced\nhandouts or\nmodule\n• Group reporting\n\n• Observation\n• Demonstration\n• Written\nExamination\n• Oral Examination\n• Practical\nExamination\n• Interview\n• Oral Questioning\n\n10 Hours\n\n6.2 Implement a\nseries of\ntraining events\n•\nProvide identified support for learners to\nattend identified training events.\n•\nProvide required resources for\nsupervisors to maintain required service\nlevels during identified training events\n•\nAdvise learners of attendance\nrequirements as required by the\norganization\n•\nCapture feedback from learners on\nindividual training events.\n• Discussion\n• Demonstration\n• Lecture\n• Group discussion\n• Power Point\npresentation\n• Simulation\n• Video\npresentation\n• Observation\n• Demonstration\n• Written\nExamination\n• Oral Examination\n• Practical\nExamination\n• Interview\n• Oral Questioning\n\n10 Hours\n\n--- PDF PAGE 137 ---\nFRONT OFFICE SERVICES NC IV Revision 00 Promulgated (12/17/2019)\n133\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n•\nModify planned schedule of training\nevents on the basis of feedback and\nother issues arising\n•\nAttend training events to monitor and\nevaluate their implementation\n•\nMaintain contact with training event\norganizers/providers\n• Self-paced\nhandouts or\nmodule\n• Group reporting\n\n6.3 Review planning\nand\nimplementation\nof a series of\ntraining events\n•\nEvaluate the impact of attendance at\ntraining event.\n•\nA