ion\n• Simulation\n• Video\npresentation\n• Self-paced\nhandouts or\nmodule\n• Group reporting\n\n• Observation\n• Demonstration\n• Written\nExamination\n• Oral Examination\n• Practical\nExamination\n• Interview\n• Oral Questioning\n\n10 Hours\n\n6.2 Implement a\nseries of\ntraining events\n•\nProvide identified support for learners to\nattend identified training events.\n•\nProvide required resources for\nsupervisors to maintain required service\nlevels during identified training events\n•\nAdvise learners of attendance\nrequirements as required by the\norganization\n•\nCapture feedback from learners on\nindividual training events.\n• Discussion\n• Demonstration\n• Lecture\n• Group discussion\n• Power Point\npresentation\n• Simulation\n• Video\npresentation\n• Observation\n• Demonstration\n• Written\nExamination\n• Oral Examination\n• Practical\nExamination\n• Interview\n• Oral Questioning\n\n10 Hours\n\n--- PDF PAGE 137 ---\nFRONT OFFICE SERVICES NC IV Revision 00 Promulgated (12/17/2019)\n133\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n•\nModify planned schedule of training\nevents on the basis of feedback and\nother issues arising\n•\nAttend training events to monitor and\nevaluate their implementation\n•\nMaintain contact with training event\norganizers/providers\n• Self-paced\nhandouts or\nmodule\n• Group reporting\n\n6.3 Review planning\nand\nimplementation\nof a series of\ntraining events\n•\nEvaluate the impact of attendance at\ntraining event.\n•\nAssess the value-for-money provided by\nengagement with training events\n•\nIdentify ways in which more cost-\neffective use of training events could be\neffected\n•\nPrepare a report on the use of training\nevents within the organization\n• Discussion\n• Demonstration\n• Lecture\n• Group discussion\n• Power Point\npresentation\n• Simulation\n• Video\npresentation\n• Self-paced\nhandouts or\nmodule\n• Group reporting\n• Observation\n• Demon