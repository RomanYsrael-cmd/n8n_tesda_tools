        "source_text": "--- PDF PAGE 37 ---\nFRONT OFFICE SERVICES NC IV                Revision 00             Promulgated  (12/17/2019) \n33 \nUNIT OF COMPETENCY :  LEAD IN IMPROVEMENT OF OCCUPATIONAL SAFETY AND \nHEALTH (OSH) PROGRAMS, POLICIES AND PROCEDURES \n \nUNIT CODE \n:    500311407 \n \nUNIT DESCRIPTOR \n:   This unit covers the knowledge, skills and attitudes required to assess \nOccupational Safety and Health (OSH) practices and programs, \nrecommend OSH program improvement initiatives, and implement \nrecommended improvements on Occupational Safety and Health \n(OSH) Programs, Procedures and Policies \n \n \n \nELEMENTS \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \n \nREQUIRED \nKNOWLEDGE \n \nREQUIRED \nSKILLS \n1. Assess \n    Occupational \nSafety and \nHealth (OSH) \npractices and \nprograms  \n1.1 OSH practices and \nprograms are reviewed \nbased on workplace \npolicies and procedures \n1.2 Appropriate personnel \nor OSH reference \nguides are consulted \nfor proper guidance \nbased on workplace \npolicies and procedures  \n1.3 Current practices and \nprograms are evaluated \nbased on acceptable \nlevel of OSH work \nstandards  \n1.1. OSH practices \nand programs \nworkplace \npolicies and \nprocedures \n1.2. OSH reference \nguides \n1.3. OSH work \nstandards \n1.1. Critical thinking \nskills \n1.2. Evaluating skills \n2. Recommend \nOSH program  \nimprovement \ninitiatives \n2.1 OSH work improvement \ninitiatives are identified \nthat are relevant with \nthe workplace scenario  \n2.2 OSH program \nimprovement plans are \norganized based on \nworkplace policies and \nprocedures \n2.3 OSH program \nimprovement plans are \npresented based on \nworkplace policies and \nprocedures  \n2.1. OSH Programs \n2.2. OSH work \nimprovement \ninitiatives \n2.1. Presentation Skills \n2.2. Communication \nskills \n2.3. Collaborating skills \n2.4. Critical thinking \nskills \n2.5. Observation skills\n\n--- PDF PAGE 38 