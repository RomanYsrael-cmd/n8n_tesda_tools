        "source_text": "--- PDF PAGE 89 ---\nFRONT OFFICE SERVICES NC IV                Revision 00             Promulgated  (12/17/2019) \n85 \nUNIT OF COMPETENCY \n:    USE THE ASSESSMENT SYSTEM FOR TRAINING  \n                                                  OUTCOMES \n \nUNIT CODE \n        :    TRS141214 \n \nUNIT DESCRIPTOR            :    This unit covers the knowledge, skills and  behavior required to \nmanage an assessment system for employees within a work context \n \n \nELEMENT \n PERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the  \nRange of Variables \n \nREQUIRED \nKNOWLEDGE \n \nREQUIRED \nSKILLS \n1.  Communicate \nthe assessment \nsystem \n1.1 The purpose of the \nassessment system \nis defined \n1.2 Assessment system \nfeatures and \nprocedures to \nrelevant \nstakeholders is \ndocumented and \ncirculated \n1.3 Procedures for \nkeeping relevant \nstakeholders \ninformed about key \nfeatures of the \nassessment system \nare established \n1.1 Communication \ntechniques \n1.2 Assessment system \nfeatures and \nprocedures \n1.3 Enterprise policies \nand procedures \n1.4 Impact of \nassessment system \nfor training outcomes \n1.1 Questioning and \ncommunication skills \n1.2 Research skills \n1.3 Analytical skills \n1.4 Ability to research \nindustry information \nsources \n1.5 Networking skills \n1.6 Defining the purpose \nof assessment \nsystem \n \n2. Provide support \nfor enterprise \nassessors \n2.1 Assessors meet \nrequired \ncompetency \nstandards is verified \n2.2 Required training \nfor assessors is \nidentified \n2.3 Moderation of \nassessments is \nprovided.  \n2.4 Feedback to \nassessors on their \nperformance is \nprovided  \n2.5 Networking amongst \nassessors is \nfacilitated  \n \n \n2.1 Communication \ntechniques \n2.2 Assessment system \nfeatures and \nprocedures \n2.3 Enterprise policies \nand procedures \n2.4 Moderation of \nassessment \n2.5 Requirements for \nassessors \n2.6 Feedback \nmechanism \n \n2.1 Questioning and \ncommunication skills \n2.2 Research skills \n2.3 Analytical skills \n2.4 Ability to research \nindustry information \nsources \n2.5 Networking skills \n2.6 Providing support for \nenterprise assessors\n\n--- PDF PAGE 90 ---\nFRONT OFFICE SERVICES NC IV                Revision 00             Promulgated  (12/17/2019) \n86 \nELEMENT \n PERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the  \nRange of Variables \n \nREQUIRED \nKNOWLEDGE \n \nREQUIRED \nSKILLS \n3. Manage the \nassessment \nrecord keeping \nsystem \n \n3.1 The internal records \nrequired to support \nthe assessment \nsystem is identified \nand developed  \n3.2 The requirements \nfor completing the \nassessment records \nare described  \n3.3 The assessment \nrecords are filed.  \n3.4 The assessment \nrecord keeping \nsystem is reviewed \nand updated.  \n3.1 Communication \ntechniques \n3.2 Assessment system \nfeatures and \nprocedures \n3.3 Enterprise policies \nand procedures \n3.4 Standards for \norganizational \nrecordkeeping and \naudit requirements \n3.5 Requirements for \ncompleting the \nassessment records \n \n3.1 Questioning and \ncommunication skills \n3.2 Research skills \n3.3 Analytical skills \n3.4 Ability to research \nindustry information \nsources \n3.5 Networking skills \n3.6 Updating the \nassessment record \nkeeping system \n \n4. Maintain quality \nassurance \nprocedures \n4.1 Quality assurance \nprocedures for the \nassessment system \nare defined \n4.2 Internal audits of \nthe assessment \nsystem are \nundertaken \n4.3 The results of \nquality assurance \naudits to improve the \nassessment system \nare used \n4.4  The applicability of \nthe existing quality \nassurance \nprocedures to the \ndynamic nature of the \nassessment system \nis reviewed  \n4.1 Communication \ntechniques \n4.2 Assessment system \nfeatures and \nprocedures \n4.3 Enterprise policies \nand procedures \n4.4 Standards for \norganizational \nrecordkeeping and \naudit requirements \n4.5 Quality assurance \nprocedures \n4.1 Questioning and \ncommunication skills \n4.2 Research skills \n4.3 Analytical skills \n4.4 Ability to research \nindustry information \nsources \n4.5 Networking skills \n4.6 Defining the quality \nassurance \nprocedures for the \nassessment system \n \n5. Report on the \ncontribution \nmade by the \nassessment \nsystem to \nenterprise \ntraining and \nperformance \n5.1 The outcomes that \nthe assessment \nsystem has produced \nare identified  \n5.2 The assessment \nsystem is reviewed \n5.3 Recommendations \nfor change to the \nassessment system \nare made  \n \n5.1 Communication \ntechniques \n5.2 Assessment system \nfeatures and \nprocedures \n5.3 Enterprise policies \nand procedures \n5.4 Standards for \norganizational \nrecordkeeping and \naudit requirements \n5.1 Questioning and \ncommunication skills \n5.2 Research skills \n5.3 Analytical skills \n5.4 Ability to research \nindustry information \nsources \n5.5 Networking skills \n5.6 Reviewing the \nassessment system\n\n--- PDF PAGE 91 ---\nFRONT OFFICE SERVICES NC IV                Revision 00             Promulgated  (12/17/2019) \n87 \nELEMENT \n PERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the  \nRange of Variables \n \nREQUIRED \nKNOWLEDGE \n \nREQUIRED \nSKILLS \n5.4 A report is produced \nand circulated  \n5.5 The existing \nassessment system \non the basis of \nresponses to the \nreport is revised \n5.5 Quality assurance \nprocedures \n5.6 Preparation of report\n\n--- PDF PAGE 92 ---\nFRONT OFFICE SERVICES NC IV                Revision 00             Promulgated  (12/17/2019) \n88 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Purpose of the assessment \nsystem  \n \nMay include: \n1.1 Recognizing current competencies  \n1.2 Identifying training needs of staff \n1.3 Maintaining workplace skill levels \n1.4 Diagnosing employee workplace performance \n1.5 Classifying workers in relation to remuneration levels \n1.6 Assisting in confirming staff competencies in relation to \nproposed promotion and/or job re-location \n1.7  Issuing internal certificates/awards \n1.8  Confirming progress in learning \n2. Assessment system \nfeatures and procedures  \n \nMay include: \n2.1 Establishing minimum requirements for competencies and \ncertification of assessors \n2.2  Record keeping system requirements, including \nprocedures and policies, and the development of \nsupporting documentation \n2.3 Timing and duration arrangements for assessments, \nincluding need to integrate assessment with operational \nissues while maintaining the flexibility and integrity of the \ninternal training and assessment system \n2.4 Allowable adjustments to assessments for participants, \nincluding language, literacy and innumeracy requirements \nand the inclusion of candidate assistants \n2.5 Access and equity considerations \n2.6  Legislated requirements of the host country in relation to \nemployment, workplace safety, workplace licensing \nrequirements and equal opportunity, where applicable \n2.7 Arrangements for recognition of competencies gained via \nother training providers \n2.8 Location of assessments, including in-house and external \nassessment, where applicable \n2.9 Review and evaluation processes for assessment \nprocedures \n2.10 \nEnterprise policies and procedures related to \nassessment, including grievances, re-assessment and the \nrelationship between competency and remuneration \n3. Relevant stakeholders  \nMay include: \n3.1 Trainers and assessors, including external trainers and \nassessors, where applicable \n3.2 Team leaders, supervisors, managers and business \nowners \n3.3 Training and assessment coordinators, where applicable\n\n--- PDF PAGE 93 ---\nFRONT OFFICE SERVICES NC IV                Revision 00             Promulgated  (12/17/2019) \n89 \nVARIABLE \nRANGE \n3.4 Candidates, including a representative sample of past \ncandidates and existing learners \n3.5 Technical experts, relative to specialist areas in which \nassessments are conducted \n4. Procedures for keeping \nrelevant stakeholders \ninformed  \nMay include: \n4.1 Regular scheduled meetings specific to assessment \nissues, including the use of special meetings as the need \ndictates \n4.2 Standing agenda item at all staff meetings regarding \nassessment issues \n4.3 Preparation of a dedicated newsletter, either paper-based \nor electronic format \n4.4 Development of an internal network of assessors \n5. Required competency \nstandards  \nMay include: \n5.1 Externally imposed accredited competency standards as \nrequired by training providers and other relevant agencies, \nwhere relevant \n5.2 Internally described competencies, which may or may not \ninclude formal assessor qualifications \n5.3 Currency of qualifications \n5.4 Relevance of industry experience to the areas being \nassessed \n6. Required training for \nassessors  \nMay include: \n6.1 Externally provided accredited training, including initial \nassessor training and identified additional training, where \nrelevant \n6.2 Provision of refresher training for assessors who have \nbeen identified as requiring such training \n6.3 Providing gap training for assessors on the basis of \nidentified need \n6.4 Provision of job-specific training to enable assessors to \nassess areas with which they are not familiar \n7. Moderation of assessments  \n \nMay include: \n7.1 Analysing results of assessments with a view to identifying \nissues that require attention \n7.2 Developing a standard assessment matrix against which to \nconduct assessments \n7.3 Confirming the material that will be counted as evidence \nfor the purpose of making a decision regarding candidate \ncompetency \n7.4 Confirming the operation of internal assessments against \nexternal requirements \n7.5 Evaluating assessment methods and tools\n\n--- PDF PAGE 94 ---\nFRONT OFFICE SERVICES NC IV                Revision 00             Promulgated  (12/17/2019) \n90 \nVARIABLE \nRANGE \n7.6 Modifying existing assessment arrangements on the basis \nof valid conclusions reached as a result of the moderation \nprocess \n8. Feedback to assessors \n \nMay include: \n8.1 Analysing their assessments, including results and \nmaterials/tools as part of the assessment process \n8.2 Developing feedback instruments for candidates to \ncomplete following assessments \n8.3 Providing observation sessions while assessors conduct \nassessments \n8.4 Identifying specific foci for evaluation and feedback \n8.5 Encouraging self-evaluation as part of the feedback \nprocess \n8.6 Recognising effort and positive outcomes \n8.7 Supporting assessors where feedback identifies negative \noutcomes \n9. Internal records required to \nsupport the assessment \nsystem  \n \nMay include: \n9.1 Personal information relating to candidates \n9.2  Evidence that required training has been delivered prior to \nassessment being attempted \n9.3 Assessment tools and assessment items \n9.4 Copies of relevant training curricula/training plans \n9.5 Training rolls \n9.6 Evidence captured as part of the assessment process \n9.7 Documentation used to record the resources used and \ncosts involved as part of the assessment process \n10. The requirements for \ncompleting the assessment \nrecords \n \nMay include: \n10.1 Explaining record keeping requirements to assessors \n10.2 Providing examples of acceptable records \n10.3 Monitoring the compilation of records completed by \nassessors on an on-going basis \n10.4 Highlighting applicable time-related issues that apply to \nthe completion, collection and forwarding of assessment \nrecords, including forwarding to internal locations \n10.5 Defining the security and confidentiality arrangements that \nassessors must comply with \n11. Assessment records  \n \nMay include: \n11.1 Creating a dedicated filing system for assessment \nrecords, such as paper-based, electronic or a combination \nof both \n11.2  Complying with external requirements relating to filing of \nassessment records\n\n--- PDF PAGE 95 ---\nFRONT OFFICE SERVICES NC IV                Revision 00             Promulgated  (12/17/2019) \n91 \nVARIABLE \nRANGE \n11.3  Maintaining security and confidentiality of assessment \nrecords \n11.4  Enabling easy access to existing records \n11.5  Enabling easy up-dating of records and files \n11.6  Integrating assessment records with training records in  \nkeeping with identified internal requirements \n11.7  Establishing processes to enable validation of \nassessment records \n12. Quality assurance \nprocedures for the \nassessment system  \nMay include: \n12.1 Identification of relevant documentation \n12.2 Establishment of relevant benchmarks \n12.3 Identification of appropriate ‘best practice’ as it applies to \nthe enterprise, including any externally imposed ‘best \npractice’ requirements \n12.4 Nomination of relevant timeframes, including timelines for \nremitting results, forwarding documentation, undertaking \nreviews, conducting audits  \n12.5 Identification of specific quality assurance procedures that \napply to assessments, including development of a formal \nquality assurance section dedicated to assessment and \ntraining, where appropriate \n12.6 Communication to assessors of the quality assurance \nrequirements, including training relevant to the \nimplementation of identified procedures \n13. Internal audits of the \nassessment system  \n \nMay include: \n13.1 Scheduling audits \n13.2 Defining the topics that will be addressed at each audit, \nincluding the possibility of cyclical audits and full audits \n13.3 Training staff in undertaking audits \n13.4 Allocating resources for the conduct of audits \n13.5 Designing and/or obtaining necessary documentation to \nrecord audit information/data \n13.6 Capturing audit information \n13.7 Ensuring captured data allows satisfactory analysis and \nevaluation of identified topics/areas, including the \ngathering of supplementary information as necessary \n14. The results of quality \nassurance audits  \n \nMay include: \n14.1 Ensuring recommendations for change are based on hard \nevidence \n14.2 Applying audit results to all aspects of the assessment \nsystem, including documentation and record keeping, \nassessment methods and tools, assessors, timing and \nduration of assessments, locations used for assessments\n\n--- PDF PAGE 96 ---\nFRONT OFFICE SERVICES NC IV                Revision 00             Promulgated  (12/17/2019) \n92 \nVARIABLE \nRANGE \n14.3 Revising written policies and procedures to reflect \nchanges, including confirming changes with management, \nand advising trainers and assessors as appropriate in \nrelation to the changes. \n14.4 Identify the outcomes that the assessment system has \nproduced may relate to: \n14.5 Aligning outcomes with identified purposes of the \nassessment system \n14.6 Quantifying the benefits that the assessment system has \nbrought to the enterprise, including identification of \ncompetencies attained, certificates issued, examples of \nflexibility and options that assessment has provided to the \nbusiness. \n15. Assessment system  \n15.1 May include: \n15.2 Comparing actual outcomes with identified key \nperformance indicators established for the assessment \nsystem, where applicable \n15.3 Reviewing performance of assessors \n15.4 Reviewing effectiveness of assessment tools and \nmethods \n15.5 Detailing the expenses that were incurred in implementing \nthe assessment system \n15.6 Reviewing complaints and grievances lodged by \ncandidates \n15.7 Quantifying and evaluating the number of reassessments \nrequired \n15.8 Integrating qualitative feedback from assessors and \ncandidates on the operation of the assessment system \n16. Recommendations for \nchange \n \n16.1 May include: \n16.2 Continuing with the existing assessment system, including \nimplementation of minor modifications to accommodate \nidentified issues  \n16.3 Expanding the existing assessment system \n16.4  Reducing the scope of the existing assessment system \n16.5 Winding up the existing assessment system, including \nmovement to total assessment service provision by \nexternal providers \n17. Existing assessment \nsystem  \n17.1 May include: \n17.2 Revising assessment-related policies and procedures \n17.3 Revising assessment tools \n17.4 Revising assessment times and locations \n17.5 Communicating changes to the assessment system to \nrelevant stakeholders, including the provision of training, \nas appropriate\n\n--- PDF PAGE 97 ---\nFRONT OFFICE SERVICES NC IV                Revision 00             Promulgated  (12/17/2019) \n93 \nEVIDENCE GUIDE \n \n1.  Critical aspects of \nCompetency  \nAssessment requires evidence that the candidate: \n1.1 Understood host enterprise policies and procedures in regard to \ntraining and assessment \n1.2 Demonstrated ability to identify the purpose(s), features and \nprocedures for a nominated assessment system \n1.3 Demonstrated ability to generate effective procedures to enable \ncommunication of key features of a nominated assessment system \nwith relevant stakeholders \n1.4 Demonstrated ability to provide support for assessors in a \nnominated workplace context, including: \n▪ Verified assessors meet stated competency requirements \n▪ Identified whether training assessors may need to attain required \nassessor competencies \n▪ Arranged and supervised an identified moderation session of the \ncandidate’s choosing \n▪ Provided verbal feedback to one assessor on their work-related \nassessment performance \n1.5 Demonstrated ability to identify and develop appropriate, effective \nand comprehensive internal assessment records for a nominated \nworkplace context, including: \n▪ Description of how assessors would be advised on how to \ncomplete and maintain such records \n▪ Description of the filing system to be used by assessors to store \nsuch records \n1.6 Demonstrated ability to identify and apply quality assurance \nprocedures to a nominated workplace assessment system \n1.7 Demonstrated ability to prepare a comprehensive report that \noutlines the contribution that a nominated workplace assessment \nsystem has made to enterprise training and overall business \nperformance \n2. Resource \nImplications \nThe following resources should be provided: \n2.1 Access to a real or simulated workplace \n2.2 Access to workplace standards, procedures, policies, guidelines,  \n2.3 tools and equipment. \n3. Methods of \nAssessment \nCompetency in this unit may be assessed through: \n3.1 Observation of practical candidate performance \n3.2 Oral and written questions \n3.3 Portfolio evidence, including copies of assessment and training \npolicies and procedures, assessment tools, assessment records, \nfeedback forms relating to assessment, samples of evidence \ncaptured, reports and recommendations on the assessment system \n3.4 Third party reports completed by a supervisor \n3.5 Project and assignment work \n4. Context for \nAssessment \n4.1  Competency may be assessed in actual workplace or  at the \ndesignated TESDA Accredited Assessment Center.\n",
