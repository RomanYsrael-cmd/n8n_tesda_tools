        "evidence_guide": {
          "source_text": "1.   Critical aspects \nof Competency  \nAssessment requires evidence that the candidate: \n1.1 Understood host enterprise policies and procedures in regard \nto workplace training and assessment \n1.2 Demonstrated ability to plan an effective and practical series of \nat least eight training events for a nominated organization to \nenable twelve identified learners from multiple \ndepartments/sites to attain specified training objectives and \noutcomes relevant to the industry context in which the \ncandidate is working, including: \n▪ Identified and quantified the complete range of expenses \ninvolved \n▪ Described the training events, including \norganizers/providers, dates and times, content, nature of the \nactivities within the training events, pre-event preparation \nthat learners are expected to complete prior to attendance \n▪ Identified back-filling staffing requirements to enable release \nof learners to attend all the identified (8) training events \n▪ Prepared an operational plan to guide implementation of the \nidentified training events, including resources allocation and \ndevelopment of criteria that will be used to evaluate the \neffectiveness of those training events  \n1.3 Demonstrated ability to implement a nominated series of \ntraining events, which may be the ones identified in the above \nassessment activity, by: \n▪ Evaluated the effectiveness of the training events using pre-\ndetermined criteria, which may be the ones developed for \nthe above assessment activity \n▪ Evaluated the extent of learner satisfaction with the training \nevents \n▪ Determined: \nWhether or not continued engagement with previous training \nevents is appropriate  \nWhether the training events previously used should be \nreplaced  \nWhether the training events previously used should be \nmodified in some way, and if so, how \nPossible suitable alternative to using a series of training \nevents to provide workplace training \n1.4 Determined the actual cost of using the identified training \nevents, including all relevant expenses associated with travel, \nattendance, back-filling  \n1.5 Provided a personal account of attendance at one nominated \ntraining event \n1.6 Developed a report outlining the relevant factors, including \ncosts and benefits, alternatives, future training events relating \nto the use of training events for the organisation in question\n\n--- PDF PAGE 88 ---\nFRONT OFFICE SERVICES NC IV                Revision 00             Promulgated  (12/17/2019) \n84 \n2.  Resource \nImplications \nThe following resources should be provided: \n2.1 Access to a real or simulated workplace \n2.2 Access to workplace standards, procedures, policies,  \n      Guidelines \n2.3 Tools and equipment \n \n3.  Methods of \nAssessment \nCompetency in this unit may be assessed through: \n3.1 Case studies \n3.2 Observation of practical candidate performance \n3.3 Oral and written questions \n3.4 Portfolio evidence \n3.5 Problem solving \n3.6 Role plays \n3.7 Third party reports completed by a supervisor \n3.8 Project and assignment work \n4.  Context for \nAssessment \n4.1  Competency may be assessed in actual workplace or  at the \ndesignated TESDA Accredited Assessment Center",
