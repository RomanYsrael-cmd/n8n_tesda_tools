        "source_title": "MANAGE AND RESOLVE CONFLICT SITUATIONS",
        "source_text": "--- PDF PAGE 107 ---\nFRONT OFFICE SERVICES NC IV                Revision 00             Promulgated  (12/17/2019) \n103 \nUNIT OF COMPETENCY : \n MANAGE AND RESOLVE CONFLICT SITUATIONS \n \n UNIT CODE \n:     TRS122307 \n \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge, skills and attitudes required to \nresolve complex or escalated complaints and disputes with internal \nand external customers and colleagues. It requires the ability to \nuse effective conflict resolution techniques and communication \nskills to manage conflict and develop solutions. It does not cover \nformal negotiation, counseling or mediation.                                                 \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range of \nVariables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1.  Respond to \ncomplaints \n1.1 Complaints are handled  \nsensitively, courteously \nand discreetly in \naccordance with \nenterprise procedures \n1.2 Responsibility is taken for \nresolving complaints  \n \n1.1 Enterprise policies \nand procedures in \nregard to \ncomplaints \n1.2 Positive \ncommunication to \nencourage \ndifferent points of \nview \n1.3 Different kinds of \ncomplaints \n1.4 Principles of \nconflict resolution \nand respond to \ncomplaints \n1.1 Planning and \norganizing \nactivities \n1.2 Handling \ncomplaints \n1.3 Communication \nskills \n1.4 Interpersonal skills \n \n \n2.  Identify and \nmanage \nconflict \nsituations \n \n2.1 Potential for conflict is \nidentified quickly and  \nappropriate action is taken \nto prevent escalation \n2.2 Threats to personal \nsafety of customers or \ncolleagues are identified \nquickly and appropriate \nassistance is organized \n2.3 Problem areas are \nidentified and prompt \naction taken to identify \npossible responses  \n2.1 Enterprise policies \nand procedures in \nregard to \nmanaging conflict \n2.2 Assess the nature \nof a conflict \nsituation \n2.1 Working with \nothers and in \nteams \no Negotiate to \nsolve \ndifferences with \ncolleagues \n3.  Resolve conflict \nsituations \n3.1  Responsibility for finding a \nsolution to the conflict \nsituations are taken \nwithin scope of individual \nresponsibility and job role \n \n \n3.1 Enterprise policies \nand procedures in \nregard to resolving \nconflict \n3.2 Scope of individual \nresponsibility and \njob role  \n3.1 Solving problems \no Resolve \ncustomer \ncomplaints \n3.2 Communication \nskills \n3.3 Managing conflict\n\n--- PDF PAGE 108 ---\nFRONT OFFICE SERVICES NC IV                Revision 00             Promulgated  (12/17/2019) \n104 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range of \nVariables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n3.2  Conflict is managed by \napplying effective \ncommunication skills and \nanger management \ntechniques  \n3.3  Conflict resolution skills \nare used to manage the \nconflict situation and \ndevelop solutions \n \n3.3 Effective \ncommunication \nskills\n\n--- PDF PAGE 109 ---\nFRONT OFFICE SERVICES NC IV                Revision 00             Promulgated  (12/17/2019) \n105 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.  Complaints \nMay include: \n1.1 Level of service \n1.2 Product standards \n1.3 Processes \n1.4 Information given \n1.5 Charges and fees \n1.6 Marketing materials \n  \n2.  Potential for conflict  \nMay include: \n2.1 Dissatisfied customers  \n2.2 Suppliers \n2.3 Co-workers \n \n3.  Threats to personal safety May include: \n3.1 Violent customers \n3.2 Drug and alcohol affected customers \n3.3 Customers fighting among themselves \n \n4.  Assistance \nMay include: \n4.1 Asking management for assistance \n4.2 Seeking the help of security personnel on site \n4.3 Requesting police to attend \n4.4 Requesting an ambulance to attend \n5. Conflict situations \nMay include: \n5.1 Customer complaints \n5.2 Conflicts among work colleagues \n5.3 Drug or alcohol affected persons \n5.4 Delayed or late customers  \n5.5 Refused entry \n5.6 Ejection from premises \n5.7 Denied requests for refunds or exchanges \n5.8 Dissatisfaction with service or quality of food/ \nbeverages provided \n \n6. Conflict resolution skills \nMay include: \n6.1 Assertiveness \n6.2 Listening \n6.3 Non-verbal communication \n6.4 Language style \n6.5 Problem solving \n6.6 Negotiation \n6.7 Using defusing techniques\n\n--- PDF PAGE 110 ---\nFRONT OFFICE SERVICES NC IV                Revision 00             Promulgated  (12/17/2019) \n106 \nEVIDENCE GUIDE \n \n1.  Critical aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 Demonstrated ability to resolve conflict and respond to \ncomplaints within the context of own job role \n1.2 Demonstrated ability to apply conflict resolution techniques \nand resolve a range of different conflict situations in contexts \nappropriate to the job role and workplace \n1.3 Demonstrated ability to recognize typical symptoms and \ncauses of conflict in the workplace and ways of resolving \nconflict situations \n1.4 Demonstrated knowledge of conflict/grievance resolution \nstrategies \n1.5 Demonstrated use effective interpersonal skills \n1.6 Communicated effectively with others to ensure effective \nwork operation \n2.  Resource \nImplications \nThe following resources should be provided: \n2.1 Access to a real or simulated workplace that provides the     \n      candidate with an opportunity to develop, implement and     \n      review conflict situations. \n2.2 Access to workplace standards, procedures, policies,  \n      guidelines, tools, computer equipment and relevant software. \n3.  Methods of \nAssessment \nCompetency in this unit may be assessed through: \n3.1 Demonstration with oral questioning \n3.2 Case studies \n3.3 Portfolio \n \n4.  Context of \nAssessment \n4.1 Competency maybe assessed in simulated workplace or at \nthe designated TESDA Accredited Assessment Center\n",
