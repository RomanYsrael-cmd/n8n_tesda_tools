        "source_text": "--- PDF PAGE 56 ---\nFRONT OFFICE SERVICES NC IV                Revision 00             Promulgated  (12/17/2019) \n52 \nUNIT OF COMPETENCY : \n \nPERFORM CHILD PROTECTION DUTIES  \n \n \n \nRELEVANT TO THE TOURISM INDUSTRY \n \nUNIT CODE  \n: \n \nTRS141209 \n \nUNIT DESCRIPTOR \n:  \nThis unit deals with skills and knowledge required to  \nunderstand the issue of child sexual exploitation by tourists and \napply simple protective measures which are applicable for staff \nworking in the hotel and travel industries. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. \nIdentify the \nissue of sexual \nexploitation of \nchildren by \ntourists \n1.1 The problem of child \nsexual exploitation of \nchildren by tourists \n(otherwise known as \nchild-sex tourism) is \ndefined  \n1.2 The impact of child \nsexual exploitation on \nchildren, communities \nand the hotel and travel \nindustries is described \n1.3 Suspicious \nbehaviours that may \nbe exhibited by child \nsex tourists are \nidentified \n1.1 Basic research \n1.2 Preventive \nmeasures for sexual \nexploitation of \nchildren by tourists \n1.3 Child sexual \nexploitation in \ntourism destinations \n1.4 Negative impact of \nchild sexual \nexploitation in \ntourism destinations \n1.5 Awareness of \nsuspicious \nbehaviours which \nmay be exhibited by \nchild sex tourists \n1.6 Rules, regulations, \npolicies and laws to \nprotect children from \nsexual exploitation \nby tourists \n1.1 Questioning and \ncommunication skills \n1.2 Research skills \n1.3 Analytical skills \n1.4 Networking skills \n1.5 Identifying suspicious \nbehaviors exhibited \nby child sex tourist \n \n2 Describe \nnational, \nregional and \ninternational \nactions to \nprevent the \nsexual \nexploitation of \nchildren by \ntourists \n2.1 The United Nations \nConvention on the \nRights (UNCRC) of the \nChild and the main UN \nArticles relating to \nthe rights of all \nchildren to be safe \nfrom sexual \nexploitation are \nlocated and familiarized \n2.2 The national, regional \nand international \ninitiatives to prevent \nthe sexual exploitation \n2.1 Knowledge to \ncommunicate to \nstakeholders  \n2.2 Actions that can be \nimplemented by staff \nworking in the hotel \nand travel industries \nwhich can prevent \nthe sexual \nexploitation of \nchildren by tourists. \n2.1 Questioning and \ncommunication skills \n2.2 Research skills \n2.3 Analytical skills \n2.4 Networking skills \n2.5 Identifying reporting \nmechanisms\n\n--- PDF PAGE 57 ---\nFRONT OFFICE SERVICES NC IV                Revision 00             Promulgated  (12/17/2019) \n53 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \nof children by tourists \nare examined \n2.3 Reporting \nmechanisms if \nsuspicious behaviour is \nobserved are   \nidentified \n2.3 Child sexual \nexploitation in \ntourism destinations \n2.4 Negative impact of \nchild sexual \nexploitation in \ntourism destinations \n2.5 Awareness of \nsuspicious \nbehaviours which \nmay be exhibited by \nchild sex tourists \n2.6 Awareness of \nconventions, rules, \nregulations, policies \nand laws to protect \nchildren from sexual \nexploitation by \ntourists \n3.  Describe actions \nthat can be taken \nin the workplace \nto protect \nchildren from \nsexual \nexploitation by \ntourists \n \n3.1 A list of actions that \ncan be taken by staff \nworking in each labor \ndivision of the hotel \nand travel industries \nare prepared to prevent \nthe sexual exploitation \nof children by tourists \n3.2 The best action that \ncan be taken by a staff \nfor particular situations \nin preventing the \nsexual exploitation of \nchildren by tourists are \nselected  \n3.3 Participating in national \nand regional \ncampaigns to promote \ngreater public \nawareness and action \nto prevent child sexual \nexploitation in tourism \ndestinations \n \n \n1.4 Knowledge to \ncommunicate to \nstakeholders  \n1.5 Actions that can be \nimplemented by staff \nworking in the hotel \nand travel industries \nwhich can prevent the\nsexual exploitation of \nchildren by tourists \n1.6 Child sexual \nexploitation in \ntourism destinations \n1.7 Negative impact of \nchild sexual \nexploitation in \ntourism destinations \n1.8 Awareness of \nsuspicious \nbehaviours which \nmay be exhibited by \nchild sex tourists \n1.9 Awareness of \nconventions, rules, \nregulations, policies \nand laws to protect \nchildren from sexual \n3.1 Questioning and \ncommunication skills \n3.2 Research skills \n3.3 Analytical skills \n3.4 Networking skills \n3.5 Preparing list of \nactions to prevent the \nsexual exploitation of \nchildren by tourists\n\n--- PDF PAGE 58 ---\nFRONT OFFICE SERVICES NC IV                Revision 00             Promulgated  (12/17/2019) \n54 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \nexploitation by \ntourists \n \nRANGE OF VARIABLES  \n \nVARIABLE \nRANGE \n1. Tourists  \nMay include: \n1.1 International tourists \n1.2 Domestic tourists \n1.3 Business travellers \n1.4 Expatriates \n2. Child sex tourism \nMay include: \n2.1 Child sex tourism \n2.2 Child pornography \n2.3 Child prostitution \n2.4 Child sexual abuse \n3. Suspicious behaviours  \nMay include: \n3.1 Tourist taking local children to their hotel room, a \nrestaurant/café/bar, a private place or an excursion/outing \n3.2 Tourist being very affectionate with local children \n3.3 Tourist touching local children inappropriately \n3.4 Tourist giving excessive gifts or money to local children \n3.5 Tourist asking hotel and travel staff where they can locate \nchildren for sex \n3.6 Tourist leaves sexually explicit images of children in their \nhotel room, or views sexually explicit images of children at \nan internet café \n4. UN Articles relating to the \nrights of all children to be \nsafe from sexual \nexploitation  \nMay include: \nSpecific Articles in the United Nations Convention on the \nRights of the Child which refer to child sexual abuse \nincluding Articles 19, 34 and 36 \n5. National, regional and \ninternational initiatives  \nMay include: \n5.1 Tourism policies and codes \n5.2 Rules and regulations  \n5.3 Legal provisions, national legislation, extra-territorial \nlegislation \n5.4 Public education campaigns \n5.5 Training for the hotel and travel industries\n\n--- PDF PAGE 59 ---\nFRONT OFFICE SERVICES NC IV                Revision 00             Promulgated  (12/17/2019) \n55 \nVARIABLE \nRANGE \n6. Reporting mechanisms  \nMay include: \n6.1 Reporting to line management at the place of employment \n6.2 Local and national reporting hotline phone numbers \n6.3 Local authorities \n6.4 International police \n6.5 Law enforcement websites \n6.6 Non-government organizations \n7. Actions  \nMay include: \n7.1 Being vigilant and aware of suspicious behaviour \n7.2 Reporting suspicious behaviour through the appropriate \nchannels \n7.3 Establishing and implementing organizational policies to \nprotect children in the hotel and travel industries \n7.4 Participating in national and regional campaigns to \npromote greater public awareness and action to prevent \nchild sexual exploitation in tourism destinations \n7.5 Sharing information about child protection with family, \nfriends and work colleagues\n\n--- PDF PAGE 60 ---\nFRONT OFFICE SERVICES NC IV                Revision 00             Promulgated  (12/17/2019) \n56 \nEVIDENCE GUIDE \n \n1. Critical aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 Demonstrated understanding of the critical requirement to \nprotect children from sexual exploitation by tourists \n1.2 Demonstrated ability to articulate those behaviours which \ncould be viewed as suspicious and awareness of \nappropriate reporting mechanisms \n1.3 Demonstrated understanding of rules, regulations, \nlegislation, policies and procedures which relate to the \nprevention of child sexual exploitation in tourism \ndestinations \n1.4 Demonstrated ability to outline actions that could be taken \nby tourism staff in particular labour divisions which could \nprotect children from sexual exploitation by tourists \n2. Resource Implications \nThe following resources should be provided: \n2.1  Training and assessment to include access to a real or \nsimulated workplace; and access to workplace customer \nservice standards, procedures, policies, guidelines, tools \nand equipment and in particular those procedures, \npolicies and guidelines that guide effective complaint \nresolution \n3. Method of Assessment \nCompetency in this unit may be assessed through: \n3.1 Oral and written questions \n3.2 Case studies \n3.3 Observation of candidate performance \n3.4 Simulation exercises and role plays \n3.5 Problem solving \n3.6 Third party reports completed by a supervisor \n3.7 Project and assignment work \n4. Context of Assessment \n4.1  Competency may be assessed in actual workplace or  at \nthe designated TESDA Accredited Assessment Center.\n",
