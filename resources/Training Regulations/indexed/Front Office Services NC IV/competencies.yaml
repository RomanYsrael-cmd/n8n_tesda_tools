        "descriptor": "This unit covers the knowledge, skills and attitudes required to use specialized communication skills to meet specific needs of internal and internal clients, conduct interviews, facilitate discussion with groups, and contribute to the development of communication strategies. ELEMENTS",
        "elements": [
          {
            "number": 1,
            "title": "Meet common and specific communication needs of clients and colleagues",
            "performance_criteria": [
              {
                "number": "1.1",
                "text": "Specific communication needs of clients and colleagues are identified and met"
              },
              {
                "number": "1.2",
                "text": "Different approaches are used to meet communication needs of clients and colleagues"
              },
              {
                "number": "1.3",
                "text": "Conflict is addressed promptly in a manner which does not compromise the organization"
              }
            ],
            "required_knowledge": [
              "1.1 Communication processes",
              "1.2 Dynamics of groups and different styles of group leadership",
              "1.3 Communication skills relevant to client groups",
              "1.4 Flexibility in communication"
            ],
            "required_skills": [
              "1.1 Full range of communication techniques including:",
              "1.1 1 Effective communication process",
              "1.1 2 Active listening",
              "1.1 3 Giving/ receiving feedback",
              "1.1 4 Interpretation of information",
              "1.1 5 Role boundaries setting",
              "1.1 6 Negotiation",
              "1.1 7 Establishing empathy",
              "1.1 8 Conduct seminars",
              "1.1 9 Public speaking",
              "1.2 Communication skills required to fulfill job roles as specified by the organization 3"
            ],
            "source_number": 1
          },
          {
            "number": 2,
            "title": "Contribute to the development of communication strategies",
            "performance_criteria": [
              {
                "number": "2.1",
                "text": "Strategies for internal and external dissemination of information are developed, promoted, implemented and reviewed as required"
              },
              {
                "number": "2.2",
                "text": "Channels of communication are established and reviewed regularly"
              },
              {
                "number": "2.3",
                "text": "Coaching in effective communication is provided"
              },
              {
                "number": "2.4",
                "text": "Work related network and relationship are maintained"
              },
              {
                "number": "2.5",
                "text": "Negotiation and conflict resolution strategies are used where required"
              },
              {
                "number": "2.6",
                "text": "Communication with clients and colleagues is performed appropriate to individual needs and organizational objectives",
                "source_number": "2.5"
              }
            ],
            "required_knowledge": [
              "2.1 Communication process",
              "2.2 Dynamics of groups and different styles of group leadership",
              "2.3 Openness and flexibility in communication",
              "2.4 Communication skills relevant to client groups"
            ],
            "required_skills": [
              "2.1 Full range of communication techniques including:",
              "2.1 1 Effective communication process",
              "2.1 2 Active listening",
