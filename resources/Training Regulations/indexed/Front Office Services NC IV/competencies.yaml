        "source_title": "MANAGE QUALITY CUSTOMER SERVICE",
        "source_text": "--- PDF PAGE 68 ---\nFRONT OFFICE SERVICES NC IV                Revision 00             Promulgated  (12/17/2019) \n64 \n      UNIT OF COMPETENCY : \nMANAGE QUALITY CUSTOMER SERVICE \n \nUNIT CODE \n: \nTRS141211 \n \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge, skills and attitudes required to \nmanage customer service quality in the workplace within a tourism \nor hospitality context.  It focuses on the need to develop active \napproaches to service quality issues with some strategic focus. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \n Range of Variables \n \nREQUIRED \nKNOWLEDGE \n \nREQUIRED \nSKILLS \n1. Develop \napproaches to \nenhance \ncustomer \nservice quality \n1.1 Information on \ncustomer needs, \nexpectations and \nsatisfaction levels is \nobtained using both \ninformal and formal \nresearch. \n1.2 Opportunities are \nprovided for both \ncustomers and \ncolleagues to provide \nfeedback on \nproducts and \nservices. \n1.3 Changes in internal \nand external \nenvironments are \nreviewed and \nfindings are \nintegrated into \nplanning for quality \nservice. \n1.4 Opportunities are \nprovided for \ncolleagues to \nparticipate in the \ncustomer service \nplanning process. \n1.5 Standards and plans \nare developed to \naddress key quality \nservice issues. \n1.1 Communication \ntechniques \n1.2 Informal and formal \nresearch \n1.3 Customer service \nrelations \n1.4 Actions that can be \nimplemented by \nstaff working in the \nhotel and travel \nindustries \n1.5 Quality customer \nservice \n1.6 Feedback \nmechanism \n \n1.1 Questioning and \ncommunication skills \n1.2 Research skills \n1.3 Analytical skills \n1.4 Ability to research \nindustry information \nsources \n1.5 Identifying relevant \ninformation \n1.6 Compilation and \nclassification of \ninformation and data \n1.7 Networking skills \n \n2. Manage the \ndelivery of \nquality service \n2.1 Customer service \nstandards and \nexpectations are \nclearly \n2.1 Communication \ntechniques \n2.2 Customer service \nstandards \n2.1 Questioning and \ncommunication skills \n2.2 Research skills \n2.3 Analytical skills\n\n--- PDF PAGE 69 ---\nFRONT OFFICE SERVICES NC IV                Revision 00             Promulgated  (12/17/2019) \n65 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \n Range of Variables \n \nREQUIRED \nKNOWLEDGE \n \nREQUIRED \nSKILLS \ncommunicated to \ncolleagues. \n2.2 Access to \ninformation on \nservice standards \nand delivery is \nprovided to \ncolleagues. \n2.3 Coaching is used to \nassist colleagues to \ndeal with customer \nservice issues and \nto take responsibility \nfor service \noutcomes. \n2.4  Customer service in \nthe workplace is \nmonitored to ensure \nstandards are met in \naccordance with \nenterprise policies \nand procedures. \n2.3 Actions that can be \nimplemented by \nstaff \n \n2.4  working in the hotel \nand travel industries \n \n \n2.4 Ability to research \nindustry information \nsources \n2.5 Identifying relevant \ninformation \n2.6 Compilation and \nclassification of \ninformation and data \n2.7 Networking skills \n2.8 Monitoring customer \nservice \n \n3.  Monitor and \nadjust customer \nservice \n2.1 Feedback is sought \nfrom customers on \nan ongoing basis \nand this is used to \nimprove \nperformance where \napplicable. \n2.2 Customer service \nproblems are \nidentified and \nadjustments to \nstandards, systems \nand procedures are \nmade to ensure \ncontinued service \nquality. \n2.3 New approaches are \ncommunicated to all \nthose involved in \nservice delivery \nwithin appropriate \ntimeframes. \n2.1 Communication \ntechniques \n2.2 Customer service \nstandards \n2.3 Actions that can be \nimplemented by \nstaff working in the \nhotel and travel \nindustries \n2.4 Quality customer \nservice \n2.5 Feedback \nmechanism \n2.6 Quality service \nprinciples and \nprocesses \n \n \n2.1 Questioning and \ncommunication skills \n2.2 Research skills \n2.3 Analytical skills \n2.4 Identifying relevant \ninformation \n2.5 Networking skills \n2.6 Identifying customer \nservice problems\n\n--- PDF PAGE 70 ---\nFRONT OFFICE SERVICES NC IV                Revision 00             Promulgated  (12/17/2019) \n66 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Informal and formal \nresearch  \nMay include: \n1.1 Talking to customers \n1.2 Qualitative or quantitative research \n1.3 Seeking feedback from service delivery colleagues \n1.4 Analysis of competitive environment \n1.5 Analysis of industry and market trends \n2. Changes in internal and \nexternal environments \nMay include: \n2.1 Management changes \n2.2 Organizational restructuring \n2.3 Introduction of new equipment \n2.4 Recruitment practices \n2.5 Technological changes affecting service delivery \n2.6 Changes in the competitive environment \n2.7 Economic climate \n2.8 Trends in customer preferences \n2.9 Advent of E-business \n3. Customer service \nstandards \nMay include: \n3.1 Response times \n3.2 Service guarantees \n3.3 Pricing guarantees \n3.4 Product quality \n3.5 Document presentation standards \n3.6 Personal presentation standards \n3.7 Complaint management \n4. Customer service issues \nMay include: \n4.1 Response times \n4.2 Service guarantees \n4.3 Pricing guarantees \n4.4 Product quality \n4.5 Document presentation standards \n4.6 Personal presentation standards \n4.7 Complaint management\n\n--- PDF PAGE 71 ---\nFRONT OFFICE SERVICES NC IV                Revision 00             Promulgated  (12/17/2019) \n67 \nEVIDENCE GUIDE \n \n1. Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1 Demonstrated ability to develop proactive approaches to \nthe delivery and monitoring of quality customer service \nwithin a specific tourism/hospitality context \n1.1 Demonstrated knowledge of quality service principles and \nprocesses \n2. Resource implications \nThe following resources should be provided: \n2.1 Project or work activities conducted over a period of time \nto allow the candidate to establish, monitor and evaluate \nservice delivery in a tourism or hospitality context \n2.2 Involvement of a team for which the candidate is leader \n3. Methods of assessment \nCompetency in this unit may be assessed through: \n3.1 Evaluation of projects managed by the candidate in \nconjunction with industry to enhance service delivery in a \ngiven operation \n3.2 Evaluation of projects managed by the candidate to create, \nmarket and deliver a tourism or hospitality service \n3.3 Case studies to assess specific service delivery issues in \ndifferent workplace contexts \n3.4 Oral or written questions to assess knowledge of quality \nassurance concepts and principles \n3.5 Review of portfolios of evidence and third party workplace \nreports of on-the-job performance by the candidate \n4. Context of assessment \n4.1  Competency may be assessed in actual workplace or  at \nthe designated TESDA Accredited Assessment Center.\n",
