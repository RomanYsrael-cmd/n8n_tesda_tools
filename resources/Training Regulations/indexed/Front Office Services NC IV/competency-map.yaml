  "source_text": "SECTION 1 FRONT OFFICE SERVICES NC IV QUALIFICATION\n\nThe Front Office Services NC IV Qualification consists of competencies that a person must\nachieve to perform a broad range of guest service tasks including evaluation and planning,\nmanaging of accounts, provide leadership and guidance to others with some responsibility for group\noutcomes.\n\nThis Qualification is packaged from the competency map of the Tourism Sector (Hotel and\nRestaurant) as shown in Annex A.\n\nThe Units of Competency comprising this Qualification include the following:\n\n .\nCODE NO.\nBASIC COMPETENCIES\n500311401\nUtilize specialized communication skills\n500311402\nDevelop and lead teams\n500311403\nPerform higher-order thinking processes and apply techniques in the\n\nworkplace\n500311404\nContribute to the practice of social justice in the workplace\n500311405\nManage innovative work instructions\n500311406\nManage and evaluate usage of information\n500311407\nLead in improvement of Occupational Safety and Health (OSH)\nprograms, policies and procedures\n 500311408\nLead towards improvement of environment work programs, policies\nand procedures\n 500311409\nSustain entrepreneurial skills\n\nCODE NO.\nCOMMON COMPETENCIES\nTRS141208\n Maintain hospitality industry knowledge\n TRS141209 Perform child protection duties relevant to the tourism industry\nTRS141210 Develop and supervise operational approaches\nTRS141211\n Manage quality customer service\nTRS141212 Manage finances within a budget\nTRS141213 Plan and implement a series of training events\n TRS141214 Use the assessment system for training outcomes\n\n--- PDF PAGE 6 ---\nFRONT OFFICE SERVICES NC IV Revision 00 Promulgated (12/17/2019)\n2\nCODE NO.\nCORE COMPETENCIES\n\n TRS122305\nPlan and establish systems and procedures\n TRS122306 Lead and manage people\n TRS122307\nManage and resolve conflict situations\n TRS122308\nManage guests financial records\n\nA person who has achieved this Qualification is competent to be a/an:\n❑ Front Office Assistant Manager\n❑ Night Auditor\n❑ Guest Relations Manager\n\n--- PDF PAGE 7 ---\nFRONT OFFICE SERVICES NC IV Revision 00 Promulgated (12/17/2019)\n3"
