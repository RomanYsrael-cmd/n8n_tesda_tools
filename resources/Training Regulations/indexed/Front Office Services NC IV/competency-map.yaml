  "source_text": "COMPETENCY MAP - TOURISM SECTOR\n(Hotel and Restaurant)\n FRONT OFFICE SERVICES NC IV\nBASIC\nCOMPETENCIES\n\n--- PDF PAGE 152 ---\nFRONT OFFICE SERVICES NC IV Revision 00 Promulgated (12/17/2019)\n148\n\nReceive and process\nreservations\nOperate computerized\nreservations system\nProvide accommodation\nreception services\nConduct night audit\nProvide club reception\nservices\nProvide concierge and\nbell services\nProvide cashiering services\nMonitor routine workplace\noperations\nCoach and mentor others in\nJob skills\nMaintain financial\nstandards and records\nProvide for the safety\nof VIPs\nPlan and establish systems\nand procedures\nLead and manage people\nManage and resolve conflict\nsituations\nManage guests’\nfinancial records\n\nCOMMON COMPETENCIES\n\n--- PDF PAGE 153 ---\nFRONT OFFICE SERVICES NC IV Revision 00 Promulgated (12/17/2019)\n149\n\nReceive and\nresolve\ncustomer\ncomplaints\nWork\ncooperatively\nin a general\nadministration\nenvironment\nMaintain\nquality\ncustomer/\nguest service\n\nRoster staff\nControl and\nOrder stock*\nPrepare and\ndeliver\ntraining\nsessions\nPlan, conduct\nand evaluate\nstaff\nperformance\nassessment\n\nMaintain\nhospitality\nindustry\nknowledge\nPerform child\nprotection\nduties relevant\nto the tourism\nindustry\nDevelop and\nsupervise\noperational\napproaches\nManage\nquality\ncustomer\nservice\nManage\nfinances within\na budget\nPlan and\nimplement a\nseries of\ntraining\nevents\nUse the\nassessment\nsystem for\ntraining\noutcome\n\nDevelop and\nupdate tourism\nindustry\nknowledge\nDevelop\nprotective\nenvironments\nfor children in\ntourism\ndestinations\nEstablish and\nmaintain a\nbusiness\nrelationship\nGather and\npresent\nproduct\ninformation\nMaintain\nquality\ncustomer/gues\nt service\nManage and\nresolve\nconflict\nsituations\nManage\nfinancial\nperformance\nwithin a budget\nMonitor and\nevaluate the\neffectiveness\nof training\noutcome\nEvaluate the\neffectiveness\nof assessment\nsystem\n\nCORE COMPETENCIES\n\n--- PDF PAGE 154 ---\nFRONT OFFICE SERVICES NC IV Revision 00 Promulgated (12/17/2019) 150\n\nGLOSSARY OF TERMS\n\n1. Front Office Agent\n\n2. Property Standards\n\n3. System\n\n4. Mentoring\n\n5. Colleague\n\n6. Procedure\n\n7. Process\n\n8. Team\n\n9. Coaching\n\n10. Guest Accounts/Folios\n\n11. Room/Rack Rate\n\n12. Property Management\nSystem (PMS)\n\n 13 Computer Literate\n\na front office staff in-charge of accepting hotel\nreservations; registering and checking–out guest;\nhandling guest inquiries, request and complaints and\nF.O. Cashiering\n\nbased according to the hotel, hotel school, training\ninstitution or similar/related commercial establishment\n\nAn arrangement or combination of interrelated and\ninterdependent things or parts that form a whole\n\nThe practice of assigning a junior member of staff to the\ncare of a more experienced person who assists him in\nhis career\n\nA fellow worker or member of a staff, department,\nprofession\n\nSeries of ordered steps that are used to get a job done or\nto solve a problem\n\nThe action or activity turning a resource into a product or\nservice\n\nTwo or more interacting and interdependent individuals\ncoming together to achieve particular objectives\n\nThe ability to improve the performance of others\n\nCurrent accurate record of what the guest owes the\nestablishment\n\nThe standard rate charged for a particular room type\n\nSystem that co-ordinates the activities and transactions\nwithin an accommodation venue\n\nIs defined as the knowledge and ability to utilize\ncomputers and related technology efficiently, with a\nrange of skills covering levels from elementary use to\ncomputer programming and advanced problem solving.\n\n--- PDF PAGE 155 ---\nFRONT OFFICE SERVICES NC IV Revision 00 Promulgated (12/17/2019) 151\n\nTRAINING REGULATIONS (TR)\nDOCUMENT REVISION HISTORY\n\nQualification Title: Front Office Services NC IV\nQualification Code: TRSFOS419\n\nRevision\nNo.\nDocument\nDescripti