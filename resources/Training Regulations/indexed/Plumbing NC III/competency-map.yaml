  "source_text": "SECTION 1 PLUMBING NC III QUALIFICATION\n\nThe Plumbing NC III Qualification consists of competencies that a person must\nachieve in installing simple and complex plumbing systems including centralized and\nstorage type of water heater system for high-rise buildings. He/she leads, supervises and\nworks with the team.\n\nThis Qualification is packaged from the competency map of Construction – Civil\nWorks sub-sector as shown in Annex A.\n\nThe Units of Competency comprising this Qualification include the following:\n\nCODE NO.\nBASIC COMPETENCIES\n\nUnits of Competency\n500311109\nLead workplace communication\n500311110\nLead small teams\n500311111\nDevelop and practice negotiation skills\n500311112\nSolve problems related to work activities\n500311113\nUse Mathematical concepts and techniques\n500311114\nUse relevant technologies\n\nCODE NO.\nCOMMON COMPETENCIES\n\nUnits of Competency\nCON931201\nPrepare construction materials and tools\nCON311201\nObserve procedures, specifications and manuals of instruction\nCON311202\nInterpret technical drawings and plans\nCON311203\nPerform mensurations and calculations\nCON311204\nMaintain tools and equipment\n\nCODE NO.\nCORE COMPETENCIES\n\nUnits of Competency\nCON712352\nInstall centralized hot, chilled and /or potable water piping system\nCON712353\nInstall riser/downfeed and distribution water supply system\nCON712354\nCON712355\n\nCON712356\nInstall and connect pumps to plumbing system\nPerform finishing and trimming of plumbing fixtures and\naccessories\nOversee plumbing works\n\nA person who has achieved this Qualification is competent to be a:\n Plumber III\n\n--- PDF PAGE 4 ---\nTESDA-SOP-QSO-01-F08\nTR – Plumbing NC III (Amended) Promulgated October 2014 Page 2"
