 workshop must be of concrete structure.\nBased on class size of 25 students/trainees the space requirements for the\nteaching/learning and circulation areas are as follows:\n\nSPACE REQUIREMENT\nSIZE IN\nMETERS\nAREA IN\nSQ.\nMETERS\nTOTAL AREA\nIN\nSQ. METERS\n•\nStudent/Trainee Working Space\n5 x 8\n40\n40\n•\nLecture Room/Demo Room\n5 x 5\n25\n25\n• Wash Room\n2 x 5\n10\n10\n•\nTool Room\n5 x 5\n25\n25\n•\nLaboratory Area\n5 unit – 2 x 4\n40\n40\n• Facilities/Equipment/\nCirculation area\n6 x 7\n42\n42\nWorkshop Area\n10 x 18\n\n180\n\n3.6\nTRAINER’S QUALIFICATION\n\n• Holder of National TVET Trainers Certificate level I - Plumbing NC III\n•\nPreferably a Registered Master Plumber;\n•\nPreferably with a minimum of 5 years relevant industry experience *\n(plumbing works) in all of the following:\n\nInstall hot, chilled and /or potable water piping system\n\nInstall riser/downfeed and distribution water supply system\n\nInstall and connect pumps to plumbing system.\n\nPerform finishing and trimming of plumbing fixtures and accessories\n\nDraft plumbing plan\nNote: *Certified by the employer or Registered Master Plumber\n•\nMust be computer-literate\n•\nMust have completed the 40-Hour Construction Safety Training Course\n(COSH) as per (COSH) as per Department Order No. 13 s. 1998,\n(Guidelines Governing Occupational Safety and Health in the\nConstruction Industry) conducted by OSHC and DOLE-accredited Safety\nTraining Organizations\n\n3.7\nINSTITUTIONAL ASSESSMENT\n\nInstitutional assessment is undertaken by trainees to determine their\nachievement of units of competency. A certificate of achievement is issued for\neach unit of competency.\n\n--- PDF PAGE 101 ---\nTR – Plumbing NC III (Amended) Promulgated October 2014\nPage 99"
