  "source_section_text": "SECTION 3 TRAINING ARRANGEMENTS\n\nThese standards are developed to give technical and vocational education\nand training (TVET) provides information and guidance on important requirements\nneeded to when designing training programs for certain qualifications.\n\nThese include information on curriculum design; training delivery; trainee\nentry requirements; tools and equipment; training facilities; and trainer’s\nqualification.\n\n3.1\nCURRICULUM DESIGN\n\nTESDA shall provide the training on the development of competency-based\ncurricula to training providers. This will equip them with needed knowledge and\nskill in developing their own curricula based on the components mentioned below.\n\nDelivery of knowledge requirements for the basic, common and core units of\ncompetency specifically in the areas of mathematics, science/technology,\ncommunication/language and other academic subjects shall be contextualized. To\nthis end, TVET providers shall develop a Contextual Learning Matrix (CLM) to\naccompany their curricula.\n\nCourse Title: PLUMBING NC Level: III\n\nNominal Training Duration:\n24 hours (Basic)\n24 hours (Common)\n200 hours (Core)\n\n248 hours\nCourse Description:\n\nThis course is designed to equip individual with operation skills in Plumbing, such\nas install centralized hot, chilled and/or potable water piping system, install\nriser/downfeed and distribution water supply system, install and connect pumps to\nplumbing system, perform finishing and trimming of plumbing fixtures and accessories\nand oversee plumbing works.\n\nTo complete the course, all units prescribed for this qualification must be achieved:\n\n--- PDF PAGE 74 ---\nPage 72\nTR – Plumbing NC III (Amended) Promulgated October 2014\n\nBASIC COMPETENCIES\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Contents\nPractical Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n1. Lead\nworkplace\ncommunicati\non\n1.1 Communicate\ninformation\nabout\nworkplace\nprocesses\n\n• Organization\nrequirements for\nwritten and\nelectronic\ncommunication\nmethods\n• Effective verbal\ncommunication\nmethods\n• Sources of\ninformation\n• Organize information\n• Understand and\nconvey intended\nmeaning\n• Comply with\norganization\nrequirements for the\nuse of written and\nelectronic\ncommunication\nmethods\n• Lecture\n• Demonstration\n• Practical exercises\n• Observation\nand oral\nquestioning\n• Written test\n1 hour\n\n1 hour\n\n2 hours\n\n1.2 Lead\nworkplace\ndiscussions\n• Effective verbal\ncommunication\nmethods\n• Organizational policy\non production,\nquality and safety\n• Goals/ objectives\nand action plan\nsetting\n• Participate in variety of\nworkplace discussions\n• Prepare/set action\nplans based on\norganizational goals\nand objectives\n• Group discussion\n• Practical exercises\n• Observation\nand oral\nquestioning\n• Written test\n1.3 Identify and\ncommunicate\nissues arising\nin the\nworkplace\n• Effective verbal and\nwritten\ncommunication\nmethods\n• Organizational policy\nin dealing with\nissues and problems\n• Organize information\n• Understand and\nconvey intended\nmeaning\n• Group discussion\n• Practical exercises\n• Observation\nand oral\nquestioning\n• Written test\n2. Lead small\nteam\n2.1 Provide team\nleadership\n• Company policies\nand procedures\n• Client expectations\n• Communication skills\nrequired for leading\nteams\n• Lecture\n• Demonstration\n•Practical exercises\n• Observation\nand oral\nquestioning\n1 hour\n\n--- PDF PAGE 75 ---\nTR – Plumbing NC III (Amended) Promulgated October 2014\nPage 73\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Contents\nPractical Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n•Team building skills\n•Written test\n\n1 hour\n\n1 hour\n\n1 hour\n\n2.2 Assign\nresponsibilities\n• Client expectations\n• Team member’s\nduties and\nresponsibilities\n• Skills and techniques in\npromoting team\nbuilding\n• Negotiating skills\nDemonstration\n• 