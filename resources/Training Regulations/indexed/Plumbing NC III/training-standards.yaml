      "source_text": "TESDA shall provide the training on the development of competency-based\ncurricula to training providers. This will equip them with needed knowledge and\nskill in developing their own curricula based on the components mentioned below.\n\nDelivery of knowledge requirements for the basic, common and core units of\ncompetency specifically in the areas of mathematics, science/technology,\ncommunication/language and other academic subjects shall be contextualized. To\nthis end, TVET providers shall develop a Contextual Learning Matrix (CLM) to\naccompany their curricula.\n\nCourse Title: PLUMBING NC Level: III\n\nNominal Training Duration:\n24 hours (Basic)\n24 hours (Common)\n200 hours (Core)\n\n248 hours\nCourse Description:\n\nThis course is designed to equip individual with operation skills in Plumbing, such\nas install centralized hot, chilled and/or potable water piping system, install\nriser/downfeed and distribution water supply system, install and connect pumps to\nplumbing system, perform finishing and trimming of plumbing fixtures and accessories\nand oversee plumbing works.\n\nTo complete the course, all units prescribed for this qualification must be achieved:\n\n--- PDF PAGE 74 ---\nPage 72\nTR – Plumbing NC III (Amended) Promulgated October 2014\n\nBASIC COMPETENCIES\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Contents\nPractical Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n1. Lead\nworkplace\ncommunicati\non\n1.1 Communicate\ninformation\nabout\nworkplace\nprocesses\n\n• Organization\nrequirements for\nwritten and\nelectronic\ncommunication\nmethods\n• Effective verbal\ncommunication\nmethods\n• Sources of\ninformation\n• Organize information\n• Understand and\nconvey intended\nmeaning\n• Comply with\norganization\nrequirements for the\nuse of written and\nelectronic\ncommunication\nmethods\n• Lecture\n• Demonstration\n• Practical exercises\n• Observation\nand oral\nquestioning\n• Written test\n1 hour\n