 principles of competency-based TVET.\n\na. Course design is based on competency standards set by the industry or\nrecognized industry sector; (Learning system is driven by competencies\nwritten to industry standards)\nb. Training delivery is learner-centered and should accommodate individualized\nand self-paced learning strategies;\nc. Training can be done on an actual workplace setting, simulation of a\nworkplace and/or through adoption of modern technology.\nd. Assessment is based in the collection of evidence of the performance of\nwork to the industry required standards;\ne. Assessment of competency takes the trainee’s knowledge and attitude into\naccount but requires evidence of actual performance of the competency as\nthe primary source of evidence.\nf. Training program allows for recognition of prior learning (RPL) or current\ncompetencies;\ng. Training completion is based on satisfactory performance of all specified\ncompetencies.\n2. The competency-based TVET system recognizes various types of delivery\nmodes, both on-and off-the-job, as long as learning is guided by the competency\nstandards specified by the industry. The following training modalities and its\nvariations/components may be adopted singly or in combination with other\nmodalities when designing and delivering training programs:\n\n2.1\nInstitution- Based:\n\n• Dual Training System (DTS)/Dualized Training Program (DTP) which\ncontain\nboth\nin-school\nand\nin-industry\ntraining\nor\nfieldwork\ncomponents. Details can be referred to the Implementing Rules and\nRegulations of the DTS Law and the TESDA Guidelines on the DTP;\n\n• Distance learning is a formal education process in which majority of\nthe instruction occurs when the students and instructor are not in the\nsame place. Distance learning may employ correspondence study,\naudio, video, computer technologies or other modern technology that\ncan be used to facilitate learning and formal and non-formal training.\nSpecific guidelines on this mode shall be issued by the TESDA\nSecretariat.\n• The traditional classroom-based or in-center instruction may be\nenhanced through use of learner-centered methods as well as\nlaboratory or field-work components.\n\n--- PDF PAGE 95 ---\nTR – Plumbing NC III (Amended) Promulgated October 2014\nPage 93\n\n2.2\nEnterprise-Based:\n\n• Formal Apprenticeship – Training within employment involving a\ncontract between an apprentice and an enterprise on an approved\napprenticeable occupation.\n\n• Informal Apprenticeship - is based on a training (and working)\nagreement between an apprentice and a master craftsperson wherein\nthe agreement may be written or oral and the master craftsperson\ncommits to training the apprentice in all the skills relevant to his or her\ntrade over a significant period of time, usually between one and four\nyears, while the apprentice commits to contributing productively to the\nwork of the business. Training is integrated into the production\nprocess and apprentices learn by working alongside the experienced\ncraftsperson.\n\n• Enterprise-based Training- where training is implemented within the\ncompany in accordance with the requirements of the specific\ncompany. Specific guidelines on this mode shall be issued by the\nTESDA Secretariat.\n\n2.3\nCommunity-Based – Community-Based – short term programs conducted\nby non-government organizations (NGOs), LGUs, training centers and\nother TVET providers which are intended to address the specific needs of\na community. Such programs can be conducted in informal settings such\nas barangay hall, basketball courts, etc. These programs can also be\nmobile training program (MTP).\n\n--- PDF PAGE 96 ---\nTR – Plumbing NC III (Amended) Promulgated October 2014\nPage 94\n\n3.3 TRAINEE ENTRY REQUIREMENTS\n\nThis section specifies the qualifications of trainees including their education/\nexperience.\n\n• At least Grade 12 graduate\n• Holder of National Certificate for Plumbing NC II or relevant industry experience\n(plumbing works) for a minimum of 3 years * in all of the following:\n\nPrepare estimation of materials for single plumbing unit\n\nPerform Complex Plumbing Installation and Assemblies\n\nConduct pipe leak testing\n\nPerform plumbing repair and maintenance works\nNote: * Certified by the employer or a Registered Plumber\n• Able to communicate orally and in writing\n\nThis list does not include specific institutional requirements such as written entrance exam, and other that\nmay be required of the trainees by the school or training center delivering TVET program.\n\n--- PDF PAGE 97 ---\nTR – Plumbing NC III (Amended) Promulgated October 2014\nPage 95\n\n3.4\nLIST OF TOOLS, EQUIPMENT AND MATERIALS FOR CIVIL WORKS (PLUMBING) NC III\n\nRecommended list of tools, equipment and materials for the training of 25 trainees for (Plumbing)\nNC III.\n\nTOOLS\nQty\nDescription\nQty\nDescription\nQty\nDescription\n6 pcs.\nPipe wrench\n (2 pcs each sizes\n10”, 12” ,14”)\n4\nunits\nPipe Vise 1” – 4” (2\nYoke vise and 2 chain\nvise)\n5 pcs\nMechanical Plier\n5 pcs.\nPressure gauges\n(3” dia. X ¼” dia.\n0-300 psi)\n5 pcs.\nPipe Cutter ½” – 2”\n6 pcs\nAdjustable wrench\n(3each 10” & 12”)\n25 pcs.\nSteel Tape (5m)\n25\npcs.\nBallpeen Hammer\n5 pcs.\nFlat Screw Driver 10”\n25 pcs\nHacksaw with Blade\n25\npcs\nPointed Cold Chisel\n(various length 10” -12”)\n5 pcs.\nPhilip Screw Driver\n10”\n5 pcs.\nSpirit level bar 24”\nlength\n5 pcs.\nElectrical Plier\n25\npcs\nCold Chisel (var.\nlengths 8”-12” dia.\n5/8”)\n5 units\nPipe Reamer\n5 pcs\nPlumb Bob (Std. size)\n1 set\nManual Pipe\nThreader (2 ½” – 4”)\n4 pcs.\nPipe wrench\n (2 pcs each sizes\n24”, 36” )\n1pc\nPipe Cutter 2 ½” –4”\n\nTOOLS\nQty\nDescription\nQty\nDescription\nQty\nDescription\n5pcs.\nMonkey wrench\n5pcs.\nBack wrench\n5pcs.\nCombination wrench\n5pcs.\nPlum bob\n5pcs.\nOpen wrench\n5pcs.\nVise grip\nEQUIPMENT\nQty\nDescription\nQty\nDescription\nQty\nDescription\n1 unit\nThreading Machine\ncomplete with the\nf