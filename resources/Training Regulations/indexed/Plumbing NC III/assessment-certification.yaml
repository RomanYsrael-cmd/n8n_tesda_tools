  "source_text": "SECTION 4\nASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\nCompetency Assessment is the process of collecting evidence and making judgments\nwhether competency has been achieved. The purpose of assessment is to confirm that an\nindividual can perform according to the standards expected at the workplace as expressed\nin relevant competency standards.\nThe assessment process is based on evidence or information gathered to prove\nachievement of competencies. The process may be applied to an employable unit(s) of\ncompetency in partial fulfillment of the requirements of the national qualification.\n\n4.1 NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n4.1.1 A National Certificate (NC) is issued when a candidate has\ndemonstrated competence through project-type assessment covering all\nthe units of competency that comprise the Training Regulations for\nPlumbing NC III as follows:\n\nBASIC COMPETENCIES\nLead workplace communication\nLead small teams\nDevelop and practice negotiation skills\nSolve problems related to work activities\nUse Mathematical concepts and techniques\nUse relevant technologies\nCOMMON COMPETENCIES\nPrepare construction materials and tools\nObserve procedures, specifications and manuals of instruction\nInterpret technical drawings and plans\nPerform mensuration and calculations\nMaintain tools and equipment\nCORE COMPETENCIES\nInstall centralized hot, chilled and /or potable water piping system\nInstall riser/downfeed and distribution water supply system\nInstall and connect pumps to plumbing system\nPerform finishing and trimming of plumbing fixtures and accessories\nOversee plumbing works\n4.12\nCandidates aiming to be certified will have to be assessed in accordance\nwith the requirements identified in the evidence guide of the relevant unit/s\nof competency.\n\n--- PDF PAGE 102 ---\nTR – Plumbing NC III (Amended) Promulgated October 2014\nPage 100\n\n4.13\nCandidates applying for competency assessment and certification for\nPlumbing NC III should be:\n\n4.13.1 Graduates of formal, non-formal and informal institutions including\nenterprise-based training programs\n4.13.2 Experienced workers (wage-employed or self-employed)\n4.14\nConduct of assessment and issuance of certificates shall follow the\nprocedures manual and implementing guidelines developed for the purpose.\n\n4.2 COMPETENCY ASSESSMENT REQUISITES\n\n4.2.1 Self-Assessment Guide. The self-assessment guide (SAG) is accomplished\nby the candidate prior to actual competency assessment. SAG is a pre-\nassessment tool to help the candidate and the assessor determine what\nevidence is available, where gaps exist, including readiness for assessment.\nThis document can:\n\na. Identify the candidate’s skills and knowledge\nb. Highlight gaps in candidate’s skills and knowledge\nc. Provide critical guidance to the assessor and candidate on the evidence\nthat need to be presented\nd. Assist the candidate to identify key areas in which practice is needed or\nadditional information or skills that should be gained prior `\n4.2.2 Accredited Assessment Center. Only Assessment Center accredited by\nTESDA is authorized to conduct competency assessment. Assessment\ncenters undergo a quality assured procedure for accreditation before they\nare authorized by TESDA to manage the assessment for National\nCertification.\n4.2.3 Accredited Competency Assessor. Only accredited competency assessor is\nauthorized to conduct assessment of competence. Competency assessors\nundergo a quality assured system of accreditation procedure before they are\nauthorized by TESDA to assess the competencies of candidates for\nNational Certification.\n\n--- PDF PAGE 103 ---\nTR – Plumbing NC III (Amended) Promulgated October 2014\nPage 101\n\nCOMMON\nCOMPETENCIES\nCORE\nCOMPETENCIES\n"
}
