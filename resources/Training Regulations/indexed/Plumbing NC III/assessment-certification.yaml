  "source_text": "SECTION 4\nASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\nCompetency Assessment is the process of collecting evidence and making judgments\nwhether competency has been achieved. The purpose of assessment is to confirm that an\nindividual can perform according to the standards expected at the workplace as expressed\nin relevant competency standards.\nThe assessment process is based on evidence or information gathered to prove\nachievement of competencies. The process may be applied to an employable unit(s) of\ncompetency in partial fulfillment of the requirements of the national qualification.\n\n4.1 NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n4.1.1 A National Certificate (NC) is issued when a candidate has\ndemonstrated competence through project-type assessment covering all\nthe units of competency that comprise the Training Regulations for\nPlumbing NC III as follows:\n\nBASIC COMPETENCIES\nLead workplace communication\nLead small teams\nDevelop and practice negotiation skills\nSolve problems related to work activities\nUse Mathematical concepts and techniques\nUse relevant technologies\nCOMMON COMPETENCIES\nPrepare construction materials and tools\nObserve procedures, specifications and manuals of instruction\nInterpret technical drawings and plans\nPerform mensuration and calculations\nMaintain tools and equipment\nCORE COMPETENCIES\nInstall centralized hot, chilled and /or potable water piping system\nInstall riser/downfeed and distribution water supply system\nInstall and connect pumps to plumbing system\nPerform finishing and trimming of plumbing fixtures and accessories\nOversee plumbing works\n4.12\nCandidates aiming to be certified will have to be assessed in accordance\nwith the requirements identified in the evidence guide of the relevant unit/s\nof competency.\n\n--- PDF PAGE 102 ---\nTR – Plumbing NC III (Amended) Promulgated October 2014\nPage 100\n\n4.13\nCandidates applying for competency assessment and certification for\nPlumbing NC III should be:\n\n4.13.1 Graduates of formal, non-formal and informal institutions including\nenterprise-based training programs\n4.13.2 Experienced workers (wage-employed or self-employed)\n4.14\nConduct of assessment and issuance of certificates shall follow the\nprocedures manual and implementing guidelines developed for the purpose.\n\n4.2 COMPETENCY ASSESSMENT REQUISITES\n\n4.2.1 Self-Assessment Guide. The self-assessment guide (SAG) is accomplished\nby the candidate prior to actual competency assessment. SAG is a pre-\nassessment tool to help the candidate and the assessor determine what\nevidence is available, where gaps exist, including readiness for assessment.\nThis document can:\n\na. Identify the candidate’s skills and knowledge\nb. Highlight gaps in candidate’s skills and knowledge\nc. Provide critical guidance to the assessor and candidate on the evidence\nthat need to be presented\nd. Assist the candidate to identify key areas in which practice is needed or\nadditional information or skills that should be gained prior `\n4.2.2 Accredited Assessment Center. Only Assessment Center accredited by\nTESDA is authorized to conduct competency assessment. Assessment\ncenters undergo a quality assured procedure for accreditation before they\nare authorized by TESDA to manage the assessment for National\nCertification.\n4.2.3 Accredited Competency Assessor. Only accredited competency assessor is\nauthorized to conduct assessment of competence. Competency assessors\nundergo a quality assured system of accreditation procedure before they are\nauthorized by TESDA to assess the competencies of candidates for\nNational Certification.\n\n--- PDF PAGE 103 ---\nTR – Plumbing NC III (Amended) Promulgated October 2014\nPage 101\n\nCOMMON\nCOMPETENCIES\nCORE\nCOMPETENCIES\nANNEX A\nPLUMBING NC III\n\nCOMPETENCY MAP\nCONSTRUCTION\nPLUMBING SUB-SECTOR\nInstall centralized hot,\nchilled and/or potable\nwater piping system\nInstall\nriser/downfeed\nand distribution\nwater supply\nsystem\nPerform finishing\nand trimming of\nplumbing fixtures\nand accessories\nInstall and\nconnect pumps to\nplumbing system\nOversee\nplumbing works\nPrepare\nconstruction\nmaterials and\ntools\nObserve\nprocedures,\nspecifications and\nmanuals of\ninstruction\nMaintain tools\nand equipment\nPerform\nmensurations\nand\ncalculations\nInterpret\ntechnical\ndrawings and\nplans\nLead workplace\ncommunication\nLead small\nteam\nDevelop and\npractice\nnegotiation skills\nSolve problems\nrelated to work\nactivities\nUse mathematical\nconcepts and\ntechniques\nUse relevant\ntechnologies\nBASIC\nCOMPETENCIES\nPrepare\nestimation of\nmaterials for\nsingle plumbing\nunit\nPerform\nComplex\nPlumbing\nInstallation and\nAssemblies\nPerform plumbing\nrepair and\nmaintenance\nworks\nConduct pipe\nleak testing\nInstall and\nAssemble\nSingle\nPlumbing Unit\nPerform\nMinor\nConstruction\nWorks\nMake Piping\nJoints and\nConnections\nPrepare\nPlumbing\nLayout\nReceive and\nrespond to\nworkplace\ncommunication\nWork with\nothers\nDemonstrate\nwork values\nPractice basic\nhousekeeping\nprocedures\nParticipate in\nworkplace\ncommunication\nWork in a team\nenvironment\nPractice career\nprofessionalism\nPractice\noccupational health\nand safety\nprocedures\n\n--- PDF PAGE 104 ---\nTR – Plumbing NC III (Amended) Promulgated October 2014\nPage 102\n\nDEFINITION OF TERMS\n\n1. Certification\nRefers to the process of verifying and validating competencies of\na person through assessment.\n2. Competency\nIs the application of knowledge, skills and attitudes to perform\nwork activities to the standard expected in the workplace.\n3. Element\nRefers to the building blocks of a unit of competency. It\ndescribes in outcome terms the functions that a person who\nworks in a particular area of work is able to perform.\n4. Evidence\nGuide\nIt is a guide for assessment that provides information on critical\naspects of competency, underpinning knowledge, underpinning\nskills, resource implications, context of assessment and\nassessment method.\n5. Level\nRefers to the category following the level of difficulty and\ncomplexity of skills and knowledge required to do the job.\n6. Performance\nCriteria\nIs an evaluative statement that specifies what is to be assessed\nand the required level of performance.\n7. Philippine\nQualifications\nFramework\nA quality-assured national system for the development,\nrecognition and award of qualifications based on standards of\nknowledge, skills and values acquired in different ways and\nmethods by learners and workers in the country\n8. Pipe\nRefers to a cylindrical conduit or conductor conforming to the\nparticular dimensions commonly known as “pipe size” and is\ndenoted by its interior diameter or I.D.\n9. Plumbing\nappliance\nRefers to any one of a special class of device or equipment\nintended to perform a special plumbing function. Its operation\nand/or control may be dependent upon one or more energized\ncomponents, such as motors, controls, heating elements and\npressure-temperature-sensing elements. Such device or\nequipment may operate automatically through one or more of\nthe following actions; a time cycle, a temperature range, a\npressure range, a measured volume or weight; or the device or\nequipment may be manually adjusted or controlled by the user\nor operator.\n\n--- PDF PAGE 105 ---\nTR – Plumbing NC III (Amended) Promulgated October 2014\nPage 103\n\n10. Plumbing\nappurtenance\nIt is a manufactured device or a prefabricated assembly or an\non-the-job assembly of component parts, and serve as adjunct\nto the basic piping system and plumbing fixtures. An\nappurtenance demands no additional water supply nor does it\nadd any discharge load to fixture or the drainage system. It\nperforms some useful functions in the operation, maintenance,\nservicing, economy or safety of the plumbing system.\n11. Plumbing\nIt is the art and technique of installing pipes, fixtures and other\napparatuses in buildings for bringing in the supply, liquids,\nsubstances and/or ingredients and removing them; and such\nwater, liquid and other carried-wastes hazardous to health,\nsanitation, life, property; also the pipes and fixtures after\ninstallation i.e., the plumbing system.\n12. Plumbing\nfixtures\nAre approved-type installed receptacles, devices or appliances\nsupplied with water or receive liquid or liquid-borne wastes and\ndischarge such wastes into the drainage system to which they\nmay be directly or indirectly connected. Industrial or commercial\ntanks, vats and similar processing equipment are not plumbing\nsystem fixtures, but may be connected to or discharged into\napproved traps or plumbing fixtures as provided for in this Code.\n13. Plumbing\nsystem\nRefers to all potable water supply and distribution pipes, all\nplumbing fixtures and traps, all sanitary and storm drainage\nsystems; vent pipes, roof drains, leaders and downspouts; and\nall building drains and sewers, including their respective joints\nand connections; devices, receptacles, and appurtenances\nwithin the property; water lines in the premises; potable , tap, hot\nand chilled water pipings; potable water treating or using\nequipment; fuel gas piping; water heaters and vents for same.\n14. Plumbing unit\nRefers to a minimum standard quantity of plumbing fixtures that\ndischarge wastes into a plumbing installation including; one (1)\nwater meter, one (1) water closet, one (1) lavatory, one (1)\nshower head and drain for a bathtub or shower stall, one (1)\nkitchen sink, one (1) laundry tray and three (3) floor drains and\nfour (4) faucets/hose bibb.\n15. Potable water\nIs a water satisfactory for drinking, culinary and domestic\npurposes and meets the requirements of the Philippine National\nStandards for Drinking Water.\n\n--- PDF PAGE 106 ---\nTR – Plumbing NC III (Amended) Promulgated October 2014\nPage 104\n\n16. Pressure\nIs a normal force exerted by a homogenous liquid or gas, per\nunit of area on the wall of the container.\n17. Qualification\nRefers to the national certificate issued by the TESDA or its\naccredited industry organizations in recognition that a person\nhas achieved competencies relevant to a trade or industry.\n18. Range of\nVariable\nIt describes the circumstances or context in which the work is to\nbe performed.\n19. Unit of\nCompetency\nRefers to a discrete aspect of work, which would normally be\nperformed by only one person.\n20. Unplasticized\nPolyvinyl\nChloride\nConduit\n(UPVC)\n\n21. Multiple\nplumbing\nsystem\n\n22. Centralized\nmultiple\nplumbing hot\nwater\n\n23. High-rise\nbuilding\n\n24. Medium-rise\nbuilding\nRefers to a non-metallic conduit into which electrical wire may be\ndrawn and with an outside diameter sufficiently different from\nthat of metallic conduit.\n\na battery of fixture; composed of two or more plumbing system\nconnections\n\nis a system that supplies or distribute hot water to fixtures that\nrequires hot water using storage type water heater and boilers\n\nmulti-storey building minimum of 15 storey and above\n\nmulti - level storey building from ground floor to 15 storey\nbuilding\n\n--- PDF PAGE 107 ---\nTR – Plumbing NC III (Amended) Promulgated October 2014\nPage 105\n\nACKNOWLEDGEMENTS\n\nThe Technical Education and Skills Development Authority (TESDA) wishes\nto thanks the following persons from Philippine Society of Plumbing Engineers\nInc. (PSPE), industry, academe and government agencies for sacrificing their time\nand sharing expertise in the development and validation of these Training\nRegulations.\n\nTHE TECHNICAL EXPERTS PANEL (TEP) – REVIEW PANEL\n\nMR. ALBERTO T. CABAEL\nAAA Plumbing Services Inc.\nNo. 446 –A Kennedy 1 Bldg. F.\nBlumentritt St.,\nKabayanan, San Juan City\nTel. Nos.: 655-9633; 664-5033\nFax No.: 726-9145\nMR. JASON MAGOS\nGreen Line Construction Works, Inc.\n6B Rodriguez Drive, Jordan Valley\nSubd.,\nBaesa, Quezon City\nTelefax. No.: 361-5179\nemail add.: jasonmagos @yahoo.com\n\nMR. IGNAC