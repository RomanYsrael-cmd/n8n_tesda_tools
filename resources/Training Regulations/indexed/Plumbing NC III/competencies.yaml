        "source_text": "--- PDF PAGE 53 ---\nTESDA-SOP-QSO-01-F08 \n \nTR – Plumbing NC III (Amended)                       Promulgated October 2014 \nPage 51 \n \nUNIT OF COMPETENCY       : INSTALL RISER/DOWNFEED AND DISTRIBUTION \nWATER SUPPLY SYSTEM \nUNIT CODE                            : CON712353\nUNIT DESCRIPTOR               :\nThis unit covers the knowledge, skills and attitudes in \ninstalling/assembling riser/downfeed and distribution of \nwater supply pipes in all types of building.\nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n1. Fit-up  joints  of \npipes and fittings  \n1.1  All measurements \nare in accordance \nwith the piping lay-\nout/plans and \nspecifications \n1.2 Joints are made with \nstrict compliance to \nplumbness and \nlevelness and / or \nalignment in \naccordance with job \nrequirements. \n1.3  Appropriate tools \nand equipments are \nselected in   line with \njob requirements \n1.4 Appropriate PPE is \nselected in \naccordance with \njobrequirements \n1.5 Joints between pipes \nand fittings are \nproperly cleaned and \nfitted-up for a leak \nfree connections. \n1.6 Dry fittings are \nperformed in \naccordance with job  \nrequirements. \n1.7 All valves are   \ntagged and identified \naccording to its usage \nand specifications. \n1.8 Pipe supports and \nbraces are installed \nrigidly and secured in \naccordance with the \napproved plans\n1.1 Linear \nmeasurements \n1.2 Blue print reading \n1.3 Materials \nspecification \n1.4 Scaffolding erection \nprocedures \n1.5 Plumbing codes \n1.6 Use of tools and \nequipment \n1.7 Environmental-\nconservation \nprocedures, e.g. 3R \n(reduce, reuse, \nrecycle) \n1.8 DOLE Department \nOrder No. 13 s. \n1998 Guidelines \nGoverning \nOccupational \nSafety and Health \nin the Construction \nIndustry \n \n1.1 Interpreting  \nplan  \n1.2 Handling of tools \nand equipment  \n1.3 Erecting \nscaffolding  \n flat form  \nassembly \n1.4 Installing pipe \nsupports and \nbraces  \n1.5 Communication \n(written and \nverbal)\n\n--- PDF PAGE 54 ---\nTESDA-SOP-QSO-01-F08 \n \nTR – Plumbing NC III (Amended)                       Promulgated October 2014 \nPage 52 \n \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n \n1.9 Erect scaffoldings \nand flat forms \naccording to job \nrequirements and \nsafety standards \n \n \n \n2. Perform precise \npipe cutting and \nconnection   \n2.1 All measurements \nare in accordance \nwith the piping lay-\nout/plans and \nspecifications \n2.2 Threaded connections \nare done in line with \nthe piping table and \napproved specification\n2.3 Teflon tape or any \nother type of jointing \nmaterials are used to \nensure the water \ntightness of the joint \naccording to job \ndescription. \n2.4 Testing is applied \nafter completion of \ninstallation in \naccordance with the \njob requirements \n2.5 Appropriate PPE are \nused in accordance \nwith job requirements \n2.6 Materials tools and \nequipment are \nselected in \naccordance to job \nrequirements \n2.1 Linear \nmeasurements \n2.2 Blue print reading \n2.3 Materials \nspecification \n2.4 Pipe cutting and \nconnecting \nprocedures \n2.5 Plumbing codes \n2.6 5S \n2.7 Use of materials \ntools and \nequipment \n2.8 Environmental-\nconservation \nprocedures, e.g. 3R \n(reduce, reuse, \nrecycle) \n2.9 DOLE Department \nOrder No. 13 s. \n1998 Guidelines \nGoverning \nOccupational \nSafety and Health \nin the Construction \nIndustry \n \n2.1  Interpreting plan  \n2.2 Handling of tools, \nequipment and \nmaterials \n2.3 Performing linear \nmeasurement \n2.4 Cutting pipes and \nconnecting \ntechniques \n \n3. Make piping \nconnections  using \nfussed, butt and \nflange \n3.1 PP-R pipes and \nfittings connections \nare fitted and fussed \naccording to \nstandard practice  \n3.2 Flange is fully \nwelded according to \nstandard practice \n \n3.1 Linear \nmeasurements \n3.2 Blue print reading \n3.3 Materials \nspecification \n3.4 Plumbing codes \n3.5 5S \n3.6 Types of pipes and \ncharacteristics\n3.1  Interpreting plans \n3.2 Handling of tools, \nequipment and \nmaterials \n3.3 Performing linear \nmeasurement\n\n--- PDF PAGE 55 ---\nTESDA-SOP-QSO-01-F08 \n \nTR – Plumbing NC III (Amended)                       Promulgated October 2014 \nPage 53 \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n \n3.3 HDPE pipes and \nfittings connections \nare fitted according \nto standard practice  \n3.4 Appropriate PPE are  \nused in accordance \nwith job \nrequirements \n3.5 Tools and \nequipment are \nselected according \nto job requirements \n3.6 Scaffoldings and \nplatforms are \nerected according to \njob requirements \nand safety standards\n3.7 Installing PP-R and \nHDPE pipes and \nfittings installation \nprocedures \n3.8 Use of materials, tools \nand equipment \n3.9 Environmental-\nconservation \nprocedures, e.g. 3R \n(reduce, reuse, \nrecycle) \n3.10 DOLE Department \nOrder No. 13 s. 1998 \n(Guidelines \nGoverning \nOccupational Safety \nand Health in the \nConstruction \nIndustry) \n3.4 Applying \nscaffoldings and \nflat form \nassembly \n3.5 Connecting pipes \nthrough fuse, \nbutts and flange  \n \n4. Fabricate & install \npipe hangers, \nsway braces and \nsupports \n4.1 Pipe hangers, sway \nbraces and supports \nare fabricated and \ninstalled according \nto standards and \nspecifications. \n4.2 Appropriate tools \nand equipments are  \nselected in line with \njob requirements \n4.3 Pipes and fittings \nsupports are \nproperly anchored \naccording to job \nrequirements \n4.4 Erect scaffoldings \nand flat forms \naccording to job \nrequirements and \nsafety standards \n4.1 Linear measurements \n4.2 Blue print reading \n4.3 Materials \nspecification \n4.4 Plumbing codes \n4.5 5S \n4.6 Piping supports \nfabrications and \ninstallation \n4.7 Scaffolding erection \n4.8 Use of materials, tools \nand equipment \n4.9 Environmental-\nconservation \nprocedures, e.g. 3R \n(reduce, reuse, \nrecycle) \n4.10 DOLE Department  \nOrder No. 13 s. \n1998`Guidelines \nGoverning \nOccupational Safety \nand Health in the \nConstruction Industry\n4.1  Interpreting plans \n4.2 Handling of \nmaterials tools, \nequipment  \n4.3 Handling and \nmaintenance of \ntools and \nequipment \n4.4 Erecting \nscaffolding \nflatform assembly \n4.5 Fabricating and \ninstalling of \nvarious pipe \nhangers and \nsupports \nRANGE OF VARIABLES\n\n--- PDF PAGE 56 ---\nTESDA-SOP-QSO-01-F08 \n \nTR – Plumbing NC III (Amended)                       Promulgated October 2014 \nPage 54 \n \nVARIABLE \nRANGE \n1. Tools and Equipment \nMay include: \n1.1 Pipe threader  \n1.2 Pipe  wrench  14”- 36” \n1.3 Push – pull rule/steel tape          \n1.4 Reamer                                          \n1.5 Pipe Vise \n1.6 Pipe cutter/hacksaw \n1.7 Hammer \n1.8 Leveling tools \n1.9  Welding machine \n1.10 Threading machine \n1.11 Cutting outfit set \n1.12 Electric drill \n1.13 Combination wrench  \n1.14 Screw Drivers ( phillips & flat) \n1.15 Flash Light \n1.16 Chain Block  \n1.17 Rope and Pulley \n1.18 Fusion tools \n1.19 Fire extinguisher \n2. Personal Protective Equipment \n(PPE) \nMust include: \n2.1 Gloves \n2.2 Hard hat \n2.3 Safety Shoes \n2.4 Goggles \n2.5 Safety Harness \n2.6 Safety Belts \n2.7 Face shield \n2.8 Welding mask \n2.9 Apron \n3. Pipes and fittings \nMay include: \n3.1 Stainless Steel pipes and fittings \n3.2 PP-r pipes and fittings \n3.3 G.I. pipes and fittings \n3.4 HDPE pipes and fittings \n3.5 Copper pipes and fittings \n3.6 ABS pipes and fittings\n\n--- PDF PAGE 57 ---\nTESDA-SOP-QSO-01-F08 \n \nTR – Plumbing NC III (Amended)                       Promulgated October 2014 \nPage 55 \n \nVARIABLE \nRANGE \n4. Valves \nMay include: \n4.1 Foot Valve \n4.2 Check Valve \n4.3 Float Valve \n4.4 Gate Valve \n4.5 Butterfly Valve \n4.6 Pressure Reducing Valve \n4.7 Pressure Relief Valve \n4.8 Globe Valve\n\n--- PDF PAGE 58 ---\nTESDA-SOP-QSO-01-F08 \n \nTR – Plumbing NC III (Amended)                       Promulgated October 2014 \nPage 56 \n \nEVIDENCE GUIDE \n \n1.  Critical aspects of \ncompetency  \nCompetency assessment requires evidence that the \ncandidate: \n1.1 Read and interpreted work instructions/plans in accordance \nwith the job requirements \n1.2 Selected and prepared materials, tools and equipment \naccording to job requirements \n1.3 Installed pipes and fittings in accordance with the approved \nworking plan and materials specifications \n1.4 Installed building upfeed/downfeed pipes in accordance with \napproved working plan and materials specifications and \nfollowed standard plumbness and alignment requirements \n1.5 Installed horizontal pipes according to specified rough-in \nmeasurements and/or manufacturer's specifications and \nrequired standard in the RNPCP \n1.6 Demonstrated compliance with safety regulations applicable to \nwork site operations \n1.7 Identified faults and problems that occur and made necessary \naction to rectify \n1.8 Communicated interactively with others where applicable to \nensure safe and effective work operations \n1.9 Completed performing installation of riser/down feed piping for \nthe complex/multi-storey plumbing installation / assemblies  \nwithin specifications \n1.10 Fabricated & installed pipe hangers, sway braces and \nsupports \n2. Resource Implications \nThe following resources should be provided: \n1.11 Tools and equipment appropriate to construction processes \n1.12 Materials relevant to the proposed activity \n1.13 Drawings and specifications relevant to the task \n3. Methods of Assessment \nCompetency should be assessed through: \n3.1  Direct observation of application to tasks  \n3.2  Questions related to underpinning knowledge \n3.3  Oral Questioning or written examination \n4. Context for Assessment \n1.14 Competency may be assessed in the workplace or in a  \nsimulated workplace setting\n",
