enance manual \nof each valve are \nidentified according \nto each application. \n2.1 Blue print reading \n2.2 Mensuration  \n(Volume, \nPressure) \n2.3 Valves \nspecifications  \n2.4 Valve connections \nand procedures \n2.5 Plumbing codes \n2.6 DOLE Department  \nOrder No. 13 s. \n1998 Guidelines \nGoverning \nOccupational \nSafety and Health \nin the Construction \nIndustry \n2.1 Interpreting plans, \nsymbols  \n2.2 Communication \n(written and verbal) \n2.3 Identifying and \nselecting various \ntypes of valves \n3. Test and \ncommission \npumps and \naccessories \n1.1 All pumps and \naccessories are \ninstalled in \naccordance with \napproved plan. \n1.2 Power requirements \nof pumps and \naccessories are \nchecked and verified \nin accordance with \nthe application.   \n1.3 Testing and \ncommissioning of \npumps and \naccessories are \nstrictly followed in \naccordance with the \noperation and \nmaintenance manual. \n1.4 Appropriate tools are \nselected in line with \njob requirements \n3.1 Blue print reading \n3.2 Pumps \nspecifications  \n3.3 Testing and \ncommissioning \nprocedures \n3.4 Environmental-\nconservation \nprocedures, e.g. \n3R (reduce, reuse, \nrecycle) \n3.5 DOLE Department \nOrder No. 13 s. \n1998 (Guidelines \nGoverning \nOccupational \nSafety and Health \nin the Construction \nIndustry) \n \n \n3.1 Interpreting plans \n3.2 Handling of tools  \n3.3 Communication \n(written and verbal) \n3.4 Applying pump \ntesting and \ncommissioning\n\n--- PDF PAGE 61 ---\nTESDA-SOP-QSO-01-F08 \n \nTR – Plumbing NC III (Amended)                       Promulgated October 2014 \nPage 59 \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Rating and capacity  \nMay include: \n1.1 Horsepower/KW requirement \n1.2 Total dynamic head (TDH) \n1.3 1800 – 3600 RPM          \n1.4 Vertical Turbine or Centrifugal type  \n1.5 Clogged or non - clogged type \n2. Operation and Maintenance \nMay include: \n2.1 Predictive Maintenance \n2.2 Preventive Maintenance \n2.3 Reactive M