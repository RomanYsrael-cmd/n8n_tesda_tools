        "source_title": "LEAD WORKPLACE COMMUNICATION",
        "source_text": "--- PDF PAGE 4 ---\nTESDA-SOP-QSO-01-F08 \nTR – Plumbing NC III (Amended)                       Promulgated  October 2014                                                        Page 2 \n \nSECTION 2 COMPETENCY STANDARDS \n \nThis section gives the details of the contents of the core units of competency required for \nPLUMBING NC III.   \n \n \n \nBASIC COMPETENCIES \n \nUNIT OF COMPETENCY \n: \nLEAD WORKPLACE COMMUNICATION \n \nUNIT CODE \n: \n500311109 \n \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge, skills and attitudes required to lead   \nin the dissemination and discussion of ideas, information and issues \nin the workplace. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range of \nVariables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Communicate \ninformation \nabout \nworkplace \nprocesses \n1.1 Appropriate \ncommunication \nmethod  is selected  \n1.2 Multiple operations \ninvolving several topics \nareas are \ncommunicated \naccordingly \n1.3 Questions are used to \ngain extra information \n1.4 Correct sources of \ninformation are \nidentified \n1.5 Information is selected \nand organized correctly \n1.6 Verbal and written \nreporting is undertaken \nwhen required \n1.7 Communication skills \nare maintained in all \nsituations\n1.1 Organization \nrequirements for \nwritten and \nelectronic \ncommunication \nmethods \n1.2 Effective verbal \ncommunication \nmethods \n1.1 Organize \ninformation \n1.2 Understand \nand convey \nintended \nmeaning \n1.3 Participate in \nvariety of \nworkplace \ndiscussions \n1.4 Comply with \norganization  \nrequirements \nfor the use of \nwritten and \nelectronic \ncommunication \nmethods \n2. Lead \nworkplace \ndiscussions \n2.1 Response to workplace \nissues are sought  \n2.2 Response to workplace \nissues are provided \nimmediately \n \n2.1 Organization \nrequirements for \nwritten and \nelectronic \ncommunication \nmethods \n2.1 Organize \ninformation \n2.2 Understand \nand convey \nintended \nmeaning\n\n--- PDF PAGE 5 ---\nTESDA-SOP-QSO-01-F08 \n \nTR – Plumbing NC III (Amended)                       Promulgated October 2014 \nPage 3 \n \nELEMENT \nPERFORMANCE CRITERIA\nItalicized terms are \nelaborated in the Range of \nVariables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n \n2.3 Constructive \ncontributions are made \nto workplace \ndiscussions on such \nissues as production, \nquality and safety \n2.4 Goals/objectives and   \naction plan undertaken \nin the workplace are \ncommunicated \n \n2.2 Effective verbal \ncommunication \nmethods \n2.3 Participate in \nvariety of \nworkplace \ndiscussions \n2.4 Comply with \norganization  \nrequirements \nfor the use of \nwritten and \nelectronic \ncommunication \nmethods\n3. Identify and \ncommunicate \nissues arising \nin the \nworkplace \n3.1  Issues and problems \nare identified as they \narise \n3.2 Information regarding \nproblems and issues \nare organized \ncoherently to ensure \nclear and effective \ncommunication \n3.3 Dialogue is initiated with \nappropriate personnel \n3.4 Communication \nproblems and issues \nare raised as they arise \n3.1 Organization \nrequirements for \nwritten and \nelectronic \ncommunication \nmethods \n3.2 Effective verbal \ncommunication \nmethods \n3.1 Organize \ninformation \n3.2 Understand and \nconvey \nintended \nmeaning \n3.3 Participate in \nvariety of \nworkplace   \ndiscussions \n3.4 Comply with \norganization  \nrequirements \nfor the use of \nwritten and \nelectronic \ncommunication \nmethods\n\n--- PDF PAGE 6 ---\nTESDA-SOP-QSO-01-F08 \n \nTR – Plumbing NC III (Amended)                       Promulgated October 2014 \nPage 4 \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Methods of communication \n1.1. Non-verbal gestures \n1.2. Verbal \n1.3. Face to face \n1.4. Two-way radio \n1.5. Speaking to groups \n1.6. Using telephone \n1.7. Written \n1.8. Internet\n\n--- PDF PAGE 7 ---\nTESDA-SOP-QSO-01-F08 \n \nTR – Plumbing NC III (Amended)                       Promulgated October 2014 \nPage 5 \n \nEVIDENCE GUIDE \n \n1. Critical aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 Dealt with a range of communication/information at one time \n1.2 Made constructive contributions in workplace issues \n1.3 Sought workplace issues effectively \n1.4 Responded to workplace issues promptly \n1.5 Presented information clearly and effectively written form \n1.6 Used appropriate sources of information \n1.7 Asked appropriate  questions \n1.8 Provided accurate information  \n \n2. Resource Implications \nThe following resources should be provided: \n2.1 \nVariety of Information \n2.2 \nCommunication tools \n2.3 \nSimulated workplace \n \n3. Methods of Assessment \nCompetency in this unit may be assessed through: \n3.1 \nCompetency in this unit must be assessed through \n3.2 \nDirect Observation \n3.3 \nInterview \n \n4. Context  for Assessment \n4.1. Competency may be assessed in the workplace or in \nsimulated workplace environment\n",
