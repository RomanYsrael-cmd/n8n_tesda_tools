ment \nsystem \n3.3 Precision and \naccuracy \n3.4 Basic measuring \ntools/devices \n3.1 Applying \nmathematical \ncomputations \n3.2 Using \ncalculator \n3.3 Using different \nmeasuring tools\n\n--- PDF PAGE 24 ---\nTESDA-SOP-QSO-01-F08 \n \nTR – Plumbing NC III (Amended)                       Promulgated October 2014 \nPage 22 \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Mathematical techniques \nMay include: \n1.1 Four fundamental operations \n1.2 Measurements \n1.3 Use/Conversion of units of measurements \n1.4 Use of standard formulas \n2. Appropriate action \n2.1 Review in the use of mathematical techniques \n(e.g. recalculation, re-modeling) \n2.2 Report error to immediate superior for proper \naction \n \n \n \nEVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 Identified, applied and reviewed the use of mathematical \nconcepts and techniques to workplace problems \n2. Resource \nImplications \nThe following resources should be provided: \n2.1 Calculator \n2.2 Basic measuring tools \n2.3 Case Problems \n3. Methods of \nAssessment \nCompetency in this unit may be assessed through: \n3.1 Authenticated portfolio \n3.2 Written Test \n3.3 Interview/Oral Questioning \n3.4 Demonstration \n4. Context for \nAssessment \n4.1 Competency may be assessed in the work place or in a \nsimulated work place setting\n",
