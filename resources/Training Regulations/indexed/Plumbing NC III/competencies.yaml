        "source_text": "--- PDF PAGE 48 ---\nTESDA-SOP-QSO-01-F08 \n \nTR – Plumbing NC III (Amended)                       Promulgated October 2014 \nPage 46 \n \nCORE COMPETENCIES \n \nUNIT OF COMPETENCY       : INSTALL CENTRALIZED HOT-, CHILLED- AND / OR \nPOTABLE-WATER PIPING SYSTEM\nUNIT CODE                            : CON712352 \nUNIT DESCRIPTOR               :\nThis unit covers the knowledge, skills and attitude in \npreparing, connecting, and installing centralized hot-, \nchilled- and potable-water piping system using copper \npipes and fittings and other approved materials in a range \nof workplace settings.\n \n  \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEGE \nREQUIRED SKILLS\n1. Prepare pipes \nprior to assembly/ \ninstallation \n \n1.1 Work instructions are \nread and interpreted \nin accordance with \nthe job requirements \n1.2 Pipes and fittings \nincluding materials \nand consumables \nare prepared \naccording to the \nprescribed \nprocedures, \ntolerances and \nfinishes consistent \nwith job requirements \n1.3 Tools and \nequipment are \nselected and \nprepared in \naccordance with job \nrequirements \n1.4 Appropriate PPE is \nselected in \naccordance with job \nrequirements \n \n1.1 Workplace \nprocedures \n1.2 Material take-off \n1.3 Blue print reading \n1.4 Materials \nspecification \n1.5 work processes \n1.6 Use of plumbing \nmaterials, \nconsumables,  \ntools and \nequipment \n1.7 Plumbing codes \n1.8 Environmental-\nconservation \nprocedures, e.g. \n3R (reduce, \nreuse, recycle) \n1.9 DOLE Department \nOrder No. 13 s. \n1998 Guidelines \nGoverning \nOccupational \nSafety and Health \nin the Construction \nIndustry \n1.1 Observing work \ninstructions \n1.2 Interpreting plan \nsymbols and \ndetails \n1.3 Handling of \ntools and \nequipment \n1.4 Communication \n(written and \nverbal)\n\n--- PDF PAGE 49 ---\nTESDA-SOP-QSO-01-F08 \n \nTR – Plumbing NC III (Amended)                       Promulgated October 2014 \nPage 47 \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables\nREQUIRED \nKNOWLEGE \nREQUIRED SKILLS\n2. Perform potable-, \nhot- and chilled- \nwater piping \ninstallation \n \n2.1 Pipes and fittings are \naligned, connected \nand welded \nconsistent with job \nrequirements \n2.2 Pipe \nsupport/braces/insul\nation materials are \ninstalled according \nto the prescribed \nprocedures, material \nspecification, \nlocation and finishes \nconsistent with job \nrequirements \n2.3 Proper use of tools \nand equipment is \nobserved in \naccordance with the \njob requirements \n2.4 Appropriate PPE is \nused in accordance \nwith the job \nrequirements \n2.5 Work site is cleaned \nand kept in safe \nstate and in \naccordance with \nOccupational Safety \nand Health \nStandards (OSHS)  \n \n2.1 Linear \nmeasurement \n2.2 Blue print reading \n2.3 Materials \nspecification \n2.4 Piping supports/ \nbraces and \ninsulations \n2.5 Piping installation \nprocedures \n2.6 Plumbing codes \n2.7 5S \n2.8  Welding, \nsoldering and \nbrazing \nprocedures \n2.9 Use of plumbing \ntools and \nequipment \n2.10 Temperature \ncontrol \ncomponents and \nsettings \n2.11 Environmental-\nconservation \nprocedures, e.g. \n3R (reduce, \nreuse, recycle) \n2.12 DOLE \nDepartment Order \nNo.  13 s. \n1998Guidelines \nGoverning \nOccupational \nSafety and Health \nin the \nConstruction \nIndustry \n2.1 Interpreting plan \n2.2 Handling of \ntools and \nequipment \n2.3 Joining copper \npipes and  \nfittings \n2.4 Brazing or \nsoldering of \ncopper pipes \nand fittings \n2.5 Setting/ \nadjustment \ntemperature \ncontrols  \n2.6 Installing \ndifferent types \nof pipes and \nfittings for hot \nand cold water \nline \n2.7 Installing piping \nsupports/ braces \nand insulations \n2.8 Communication \n(written and \nverbal)\n\n--- PDF PAGE 50 ---\nTESDA-SOP-QSO-01-F08 \n \nTR – Plumbing NC III (Amended)                       Promulgated October 2014 \nPage 48 \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables\nREQUIRED \nKNOWLEGE \nREQUIRED SKILLS\n3. Perform pipe leak \ntesting \n3.1 All openings in the \npipe system are \ntightly closed except \nthe highest opening \nprior to leak testing  \n3.2 Leak testing is \napplied after \ncompletion of \nroughing-ins and \ncomplete installation \nof pipe supports. \n3.3 Testing apparatus is \nset to specified \npressure rating \naccording to testing \nstandards. \n3.4 Gravity or flood \ntesting are applied to \nsanitary, waste, vent \nand storm drainage \npiping. \n3.5 Pressure testing are \napplied to hot and \ncold water piping. \n3.6 Proper use of tools \nand equipment is \nobserved in \naccordance with \nmanufacturer's \nspecifications \n3.7 Appropriate PPE are \nused in accordance \nwith job \nrequirements \n3.8 Work site is cleaned \nand kept in safe \nstate and in \naccordance with \nOSHS \n3.1 Blue print reading \n3.2 5S \n3.3 Use of plumbing \nmaterials, tools \nand equipment \n3.4 Environmental-\nconservation \nprocedures, e.g. \n3R (reduce, \nreuse, recycle) \n3.5 DOLE \nDepartment  \nOrder No. 13 s. \n1998 Guidelines \nGoverning \nOccupational \nSafety and Health \nin the \nConstruction \nIndustry \n \n2.1 Interpreting plan \nand details \n2.2 Handling of \nmaterials, tools \nand equipment  \n2.3 Communication \n(written and \nverbal)  \n2.4 Applying \nmethods and \ntechniques in \npipe leak testing\n\n--- PDF PAGE 51 ---\nTESDA-SOP-QSO-01-F08 \n \nTR – Plumbing NC III (Amended)                       Promulgated October 2014 \nPage 49 \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Pipes and fittings \nMay include: \n1.1 Copper pipes and fittings \n1.2 Pipe support and braces \n1.3 PP-R pipes and fittings \n1.4 Stainless pipes and fittings \n1.5 Bl / GI pipes and fittings \n2. Materials and consumables \nMay include: \n2.1 Soldering paste \n2.2 Brazing compound \n2.3 Silver rod \n2.4 Soldering lead \n2.5 Pipe insulation \n3. Tools and equipment \nMay include: \n3.1 Pipe cutter \n3.2 Hack saw with blade \n3.3 Blow torch \n3.4 Steel tape \n3.5 Manual Test pump \n3.6 Electric test pump \n3.7 Pipe wrench \n3.8 Adjustable wrench \n3.9 Screw driver (philip and flat) \n3.10 Ballpeen Hammer \n3.11 Cutting and welding outfit with oxygen and \nacetylene tank \n3.12 Fire extinguisher \n4. \nPersonal Protective Equipment \n(PPE) \nMust include: \n4.1 Gloves \n4.2 Hard hat \n4.3 Safety shoes \n4.4 Goggles \n4.5 Dust mask \n4.6 Face shield \n4.7 Welding mask \n4.8 Apron\n\n--- PDF PAGE 52 ---\nTESDA-SOP-QSO-01-F08 \n \nTR – Plumbing NC III (Amended)                       Promulgated October 2014 \nPage 50 \n \nEVIDENCE GUIDE \n \n1. Critical aspects of \ncompetency  \nCompetency assessment requires evidence that the \ncandidate: \n1.1 Read and interpreted work instructions in accordance with \nthe  job requirements \n1.2 Prepared pipes and fittings according to the prescribed  \nprocedures, tolerances and finishes consistent with job \nrequirements \n1.3 Selected and prepared tools and equipment in accordance \nwith job requirements \n1.4 Performed potable-, hot- and  chilled-water piping \ninstallation  \n1.5 Demonstrated \ncompliance \nwith \nsafety \nregulations \napplicable to work site operations \n1.6 Identified and rectified faults and problems related to \ninstallation of potable-, hot- and chilled-water piping system \n1.7 Communicated interactively with others where applicable to \nensure safe and effective work operations  \n \n2. Resource   Implications \nThe following resources should be provided: \n2.1 Workplace location \n2.2 Tools \nand \nequipment \nappropriate \nto \nconstruction \nprocesses \n2.3 Materials relevant to the proposed activity \n2.4 Drawings and specifications relevant to the task \n3. Methods of   Assessment \nCompetency should be assessed through: \n3.1 Direct observation on application of tasks \n3.2 Questions related to required knowledge \n3.3 Written examination \n4. Context for Assessment \n4.1 Competency may be assessed in the workplace or in a \nsimulated workplace setting\n",
