pment are \nchecked in \naccordance with \noccupational \nhealth and \nsafety \nguidelines \n2.2 All valves, pipe \nsupports, \nhangers and \nsway braces are \nchecked for \nplumbness in \naccordance with \nwork standards \n2.3 Safety of \nmanpower is \nobserved in \naccordance with \njob \nrequirements \n \n2.1 Linear measurement \n2.2 Blue print reading \n2.3 Materials \nspecification \n2.4 Piping supports/ \nbraces and \ninsulations \n2.5 Piping installation \nprocedures \n2.6 Plumbing codes \n2.7 5S \n2.8  Welding, soldering \nand brazing \nprocedures \n2.9 Use of plumbing tools \nand equipment \n2.10 Temperature control \ncomponents and \nsettings \n2.11 Environmental-\nconservation \nprocedures, e.g. 3R \n(reduce, reuse, \nrecycle) \n2.12 DOLE Department \nOrder No.  13 s. 1998  \nGuidelines Governing \nOccupational Safety \nand Health in the \nConstruction Industry \n2.1 Interpreting plan  \n2.2 Handling of tools and \nequipment \n2.3 Joining copper pipes \nand fittings \n2.4 Brazing or soldering \nof copper pipes and \nfittings \n2.5 Setting adjustment \ntemperature controls  \n2.6 Installing different \ntypes of pipes and \nfittings for hot and \ncold water line \n2.7 Installing piping \nsupports/ braces and \ninsulations \n2.8 Communication \n(written and verbal) \n2.9 Handling of Manpower \nand safety control\n\n--- PDF PAGE 70 ---\nTESDA-SOP-QSO-01-F08 \n \nTR – Plumbing NC III (Amended)                       Promulgated October 2014 \nPage 68 \n \nELEMENT \nPERFORMANCE \nCRITERIA \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \nItalicized terms are \nelaborated in the \nRange of Variables \n3 Check quality of \nwork \nperformance  \n3.1 Location of \npump, ratings, \ncapacity and \npower \nrequirements \nare determined, \nand evaluated \nin accordance \nwith \nmanufacturer’s \nmanual. \n3.2 Pump \noperation, \nmaintenance \nmanual, and \nappropriate \ntools and \nequipment are \nchecked in \naccordance with \nwork standards. \n3.3 Safety of \nmanpower is \nobserved  in \naccordance with \njob \nrequirements \n3.6 Blue print reading \n3.7 Types of Pumps  and \nspecifications \n3.8 Various pump \nmounting/ installation \nprocedures \n3.9 Plumbing codes and \nlocal regulations \n3.10 Environmental-\nconservation \nprocedures, e.g. 3R \n(reduce, reuse, \nrecycle) \n3.11 DOLE Department \nOrder No.  13 s. 1998  \nGuidelines Governing \nOccupational Safety \nand Health in the \nConstruction Industry \n \n3.1 Interpreting plans,  \n3.2 Handling of tools and \nequipment \n3.3 Communication \n(written and verbal) \n3.4 Mounting and \ninstalling of pumps \nand accessories \n3.5 Applying waste \nmanagement \nprocedures \n3.6 Handling of \nManpower and safety \ncontrol\n\n--- PDF PAGE 71 ---\nTESDA-SOP-QSO-01-F08 \n \nTR – Plumbing NC III (Amended)                       Promulgated October 2014 \nPage 69 \n \nRANGE OF VARIABLES   \n \nVARIABLE \nRANGE \n1. Tools and equipment  \n \n \nMay include: \n1.1 Pipe cutter  \n1.2 Hack saw with blade \n1.3 Blow torch  \n1.4 Steel tape  \n1.5 Manual Test pump \n1.6 Electric Test pump \n1.7 Pipe wrench  \n1.8 Adjustable wrench  \n1.9 Screw driver (Philip and flat) \n1.10 Ballpeen Hammer \n1.11 Cutting and welding outfit with oxygen and acetylene \ntank \n1.12 Fire extinguisher \n2. Personal Protective Equipment \n(PPE) \n \nMay include:\n2.1 Gloves \n2.2 Hard hat \n2.3 Safety shoes \n2.4 Goggles \n2.5 Dust mask \n2.6 Face shield \n2.7 Welding mask \n2.8 Apron \n3. Valves \nMay include:\n3.1 Foot Valve  \n3.2 Check Valve \n3.3 Float Valve  \n3.4 Gate Valve  \n3.5 Butterfly Valve  \n3.6 Pressure Reducing Valve  \n3.7 Pressure Relief Valve  \n3.8 Globe Valve  \n4. Rating and capacity \nMay include:\n4.1 Horsepower/KW requirement \n4.2 Total dynamic head (TDH) \n4.3 1800 – 3600 RPM \n4.4 Vertical Turbine or Centrifugal type  \n4.5 Clogged or non - clogged type \n5. Power requirements \n5.1 220 / 440 volts \n5.2 380 – 400 volts \n5.3 Single Phase or 3 phase  \n5.4 50 – 60 Hertz\n\n--- PDF PAGE 72 ---\nTESDA-SOP-QSO-01-F08 \n \nTR – Plumbing NC III (Amended)                       Promulgated October 2014 \nPage 70 \n \nEVIDENCE GUIDE \n \n1. Critical aspects of \ncompetency \n \nAssessment requires evidence that the candidate : \n1.1 Checked preparation undertaken prior to conduct of plumbing \nwork \n1.2 Ensured compliance with occupational work and safety \nstandards \n1.3 Ensured quality of work performance \n1.4 Demonstrated awareness of DOLE Department Order No.  \n13 s. 1998 (Guidelines Governing Occupational Safety and \nHealth in the Construction Industry) \n2. Resource \nImplications \n \nThe following resources should be provided : \n2.1 Access to relevant workplace where assessment can take place \n2.2 Tools, equipment and materials/supplies relevant to the  activity \nor task   \n3. Methods of \nAssessment \n \nCompetency in this unit may be assessed through: \n3.1 Written Examination \n3.2 Oral Questioning \n3.3 Portfolio \n4. Context of \nAssessment \n \n4.1 Competency may be assessed in relevant workplace setting  \n(accredited assessment centers) \n4.2 Assessment shall be observed while tasks are being undertaken \nindividually\n",
