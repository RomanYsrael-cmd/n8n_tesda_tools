        "source_text": "--- PDF PAGE 17 ---\nTESDA-SOP-QSO-01-F08 \n \nTR – Plumbing NC III (Amended)                       Promulgated October 2014 \nPage 15 \n \nUNIT OF COMPETENCY \n: \nSOLVE PROBLEMS RELATED TO WORK ACTIVITIES  \nUNIT CODE \n:     500311112 \nUNIT DESCRIPTOR \n: \nThis unit of covers the knowledge, skills and attitudes required  \nto solve problems in the workplace including the application of \nproblem solving techniques and to  determine and resolve the \nroot cause of problems. \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Identify the \nproblem \n1.1 Variances are \nidentified from \nnormal operating \nparameters; and \nproduct quality \n1.2 Extent, cause and \nnature are of the \nproblem are \ndefined through \nobservation, \ninvestigation and \nanalytical \ntechniques  \n1.3 Problems are \nclearly stated and \nspecified \n1.1 Competence includes \na thorough knowledge \nand understanding of \nthe process, normal \noperating parameters, \nand product quality to \nrecognize non-\nstandard situations \n1.2 Competence to \ninclude the ability to \napply and explain, \nsufficient for the \nidentification of \nfundamental cause, \ndetermining the \ncorrective action and \nprovision of \nrecommendations \n1.2.1 Relevant \nequipment and \noperational \nprocesses \n1.2.2 Enterprise goals, \ntargets and \nmeasures \n1.2.3 Enterprise \nquality, OSH and \nenvironmental \nrequirement \n1.2.4 Enterprise \ninformation \nsystems and \ndata collation \n1.2.5 Industry codes \nand standards\n1.1 Using range of \nformal problem \nsolving \ntechniques \n1.2 Identifying and \nclarifying the \nnature of the \nproblem\n\n--- PDF PAGE 18 ---\nTESDA-SOP-QSO-01-F08 \n \nTR – Plumbing NC III (Amended)                       Promulgated October 2014 \nPage 16 \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n2. Determine \nfundamental \ncauses of the \nproblem  \n2.1 Possible causes \nare identified based \non experience and \nthe use of problem \nsolving tools / \nanalytical \ntechniques. \n2.2 Possible cause \nstatements are \ndeveloped based \non findings \n2.3 Fundamental \ncauses are \nidentified per \nresults of \ninvestigation \nconducted \n2.1 Competence \nincludes a thorough \nknowledge and \nunderstanding of the \nprocess, normal \noperating \nparameters, and \nproduct quality to \nrecognize non-\nstandard situations \n2.2 Competence to \ninclude the ability to \napply and explain, \nsufficient for the \nidentification of \nfundamental cause, \ndetermining the \ncorrective action \nand provision of \nrecommendations \n2.2.1 Relevant \nequipment and \noperational \nprocesses \n2.2.2 Enterprise \ngoals, targets \nand measures \n2.2.3 Enterprise \nquality, OSH \nand \nenvironmental \nrequirement \n2.2.4  Enterprise \ninformation \nsystems and \ndata collation \n2.2.5 Industry codes \nand standards\n2.1 Using range of \nformal problem \nsolving \ntechniques \n2.2 Identifying and \nclarifying the \nnature of the \nproblem\n\n--- PDF PAGE 19 ---\nTESDA-SOP-QSO-01-F08 \n \nTR – Plumbing NC III (Amended)                       Promulgated October 2014 \nPage 17 \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n3. Determine \ncorrective action \n3.1 All possible options \nare considered for \nresolution of the \nproblem \n3.2 Strengths and \nweaknesses of \npossible options are \nconsidered \n3.3 Corrective actions \nare determined to \nresolve the problem \nand possible future \ncauses \n3.4 Action plans are \ndeveloped \nidentifying \nmeasurable \nobjectives, resource \nneeds and timelines \nin accordance with \nsafety and \noperating \nprocedures \n3.1 Competence \nincludes a thorough \nknowledge and \nunderstanding of \nthe process, normal \noperating \nparameters, and \nproduct quality to \nrecognize non-\nstandard situations \n3.2 Competence to \ninclude the ability to \napply and explain, \nsufficient for the \nidentification of \nfundamental cause, \ndetermining the \ncorrective action \nand provision of \nrecommendations \n3.2.1 Relevant \nequipment \nand \noperational \nprocesses \n3.2.2 Enterprise \ngoals, targets \nand measures \n3.2.3 Enterprise \nquality, OSH \nand \nenvironmental \nrequirement \n3.2.4 Principles of \ndecision \nmaking \nstrategies and \ntechniques \n3.2.5 Enterprise \ninformation \nsystems and \ndata collation \n3.2.6 Industry \ncodes and \nstandards\n3.1 Using range of \nformal problem \nsolving \ntechniques \n3.2 Identifying and \nclarifying the \nnature of the \nproblem \n3.3 Devising the \nbest solution \n3.4 Evaluating the \nsolution \n3.5 Implementation \nof a developed \nplan to rectify \nthe problem\n\n--- PDF PAGE 20 ---\nTESDA-SOP-QSO-01-F08 \n \nTR – Plumbing NC III (Amended)                       Promulgated October 2014 \nPage 18 \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n4. Provide \nrecommendation/s \nto manager \n4.1 Report on \nrecommendations \nare prepared \n4.2 Recommendations \nare presented to \nappropriate \npersonnel. \n4.3 Recommendations \nare followed-up, if \nrequired \n4.1 Competence \nincludes a thorough \nknowledge and \nunderstanding of the \nprocess, normal \noperating \nparameters, and \nproduct quality to \nrecognize non-\nstandard situations \n4.2 Competence to \ninclude the ability to \napply and explain, \nsufficient for the \nidentification of \nfundamental cause, \ndetermining the \ncorrective action and \nprovision of \nrecommendations \n4.2.1 Relevant \nequipment \nand \noperational \nprocesses \n4.2.2 Enterprise \ngoals, targets \nand measures \n4.2.3 Enterprise \nquality, OSH \nand \nenvironmental \nrequirement \n4.2.4 Principles of \ndecision \nmaking \nstrategies and \ntechniques \n4.2.5 Enterprise \ninformation \nsystems and \ndata collation \n4.2.6 Industry codes \nand standards \n4.1 Using range of \nformal problem \nsolving \ntechniques \n4.2 Identifying and \nclarifying the \nnature of the \nproblem \n4.3 Devising the \nbest solution \n4.4 Evaluating the \nsolution \n4.5 Implementation \nof a developed \nplan to rectify \nthe problem\n\n--- PDF PAGE 21 ---\nTESDA-SOP-QSO-01-F08 \n \nTR – Plumbing NC III (Amended)                       Promulgated October 2014 \nPage 19 \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Analytical techniques \n1.1 Brainstorming \n1.2 Intuitions/Logic \n1.3 Cause and effect diagrams \n1.4 Pareto analysis \n1.5 SWOT analysis \n1.6 Gant chart, Pert CPM and graphs \n1.7 Scattergrams  \n2. Problem \n \n2.1 Non – routine process and quality problems \n2.2 Equipment selection, availability and failure \n2.3 Teamwork and work allocation problem \n2.4 Safety and emergency situations and incidents \n3. Action plans  \n \n3.1 Priority requirements \n3.2 Measurable objectives \n3.3 Resource requirements \n3.4 Timelines \n3.5 Co-ordination and feedback requirements \n3.6 Safety requirements \n3.7 Risk assessment \n3.8 Environmental requirements\n\n--- PDF PAGE 22 ---\nTESDA-SOP-QSO-01-F08 \n \nTR – Plumbing NC III (Amended)                       Promulgated October 2014 \nPage 20 \n \nEVIDENCE GUIDE \n \n1. Critical aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 Identified the problem \n1.2 Determined the fundamental causes of the problem \n1.3 Determined the correct / preventive action \n1.4 Provided recommendation to manager \nThese aspects may be best assessed using a range of \nscenarios / case studies / what ifs as a stimulus with a walk \nthrough forming part of the response. These assessment \nactivities should include a range of problems, including new, \nunusual and improbable situations that may have happened. \n2. Resource Implications \n2.1. \nAssessment will require access to an operating plant \nover an extended period of time, or a suitable method of \ngathering evidence of operating ability over a range of \nsituations. A bank of scenarios / case studies / what ifs \nwill be required as well as bank of questions which will \nbe used to probe the reason behind the observable \naction.  \n3. Methods of Assessment \nCompetency in this unit may be assessed through: \n3.1 Case studies on solving problems in the workplace \n3.2  Observation \nThe unit will be assessed in a holistic manner as is practical and \nmay be integrated with the assessment of other relevant units of \ncompetency. Assessment will occur over a range of situations, \nwhich will include disruptions to normal, smooth operation. \nSimulation may be required to allow for timely assessment of \nparts of this unit of competency. Simulation should be based on \nthe actual workplace and will include walk through of the \nrelevant competency components.  \n4. Context for Assessment \n4.1. \nIn all workplace, it may be appropriate to assess this unit \nconcurrently with relevant teamwork or operation units.\n",
