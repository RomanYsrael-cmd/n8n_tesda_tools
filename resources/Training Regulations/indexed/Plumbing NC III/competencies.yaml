b \nrequirements \n3.2 Work steps are \ncorrectly identified in \naccordance with \nmanufacturer's \nspecification \n3.3 Manual data are \napplied according to \nthe given task \n3.4 All correct sequencing \nand adjustments are \ninterpreted in \naccordance with \ninformation contained \non the manual or \nspecifications \n3.1 Types of  manuals \nused in plumbing  \n3.2 Types and \napplication of \nsymbols in manuals \n3.3 Unit conversion \n3.1 Applying \ninformation from \nmanuals \n \n4. Store manuals \n4.1 Manual or \nspecification is stored \nappropriately to \nprevent damage, \nready access and \nupdating of \ninformation when \nrequired in \naccordance with \ncompany \nrequirements \n4.1 Types of manuals \nused in plumbing  \n4.2 Manual storing and \nmaintaining \nprocedures  \n  \n4.1 Storing and \nmaintaining \nmanuals\n\n--- PDF PAGE 34 ---\nTESDA-SOP-QSO-01-F08 \n \nTR – Plumbing NC III (Amended)                       Promulgated October 2014 \nPage 32 \n \n \nRANGE OF VARIABLES \nVARIABLE \nRANGE \n1. Procedures, Specifications and \nManuals of Instructions \n \n \nMay include: \n1.1 Manufacturer's Specification Manual \n1.2 Repair Manual \n1.3 Maintenance Procedure Manual \n1.4 Periodic Maintenance Manual \n \n \n \nEVIDENCE GUIDE \n \n1. Critical aspects of competency \nAssessment requires that the candidate: \n1.1 Identified and accessed specification/manuals as per job \nrequirements \n1.2 Interpreted manuals in accordance with industry practices \n1.3 Applied information in manuals according to the given task \n1.4 Stored manuals in accordance with company requirements \n2. Resource implications \nThe following resources should be provided: \n2.1 All manuals/catalogues relative to construction sector \n3. Methods of assessment \nCompetency should be assessed through: \n3.1 Direct observation  \n3.2 Questions/interview \n \nAssessment of underpinning knowledge and practical skills \nmay be combined \n4. Context of assessment \n4.1 Competency \nassessment \nmust \nbe \nundertaken \nin \naccordance with the endorsed TESDA assessment \nguidelines \n4.2 Assessment may be conducted in the workplace or a \nsimulated environment\n",
