      "number": "4.1",
      "text": "NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS 4.1.1 To attain the national qualification of TOUR GUIDING SERVICES NC III, the candidate must demonstrate competence in all units listed in Section 1. Successful candidates shall be awarded a National Certificate signed by the TESDA Director General. 4.1.2 Assessment shall cover all competencies with basic and common integrated or assessed concurrently with the core units of competency. 4.1.3 Any of the following are qualified to apply for assessment and certification: 4.1.3.1 Graduates of WTR-registered programs, NTR-registered programs or formal/non-formal/informal including enterprise- based trainings related to TOUR GUIDING SERVICES NC III; or 4.1.3.2 K-12 graduates of Home Economics Strand with Tour Guiding Services NC II / Local Guiding Services NC II; or 4.1.3.3 Students with at least two (2) years of higher education; or 4.1.3.4 Experienced workers (wage employed or self-employed) who gained competencies in TOUR GUIDING SERVICES for at least two consecutive (2) years within the last five (5) years. 4.1.4 Recognition of Prior Learning (RPL). Candidates who have gained competencies through education, informal training, previous work or life experiences with at least three (3) years of tour guiding services experience within the last five (5) years may apply for recognition in this Qualification through Portfolio Assessment. Requirements and implementation procedure of Portfolio Assessment must be consistent with TESDA Circular No. 47, series of 2018 on “Implementing Guidelines on the Implementation of Portfolio Assessment Leading to Recognition of Prior Learning (RPL) within the TESDA Assessment and Certification System”. 4.1.5 The guidelines on assessment and certification are discussed in detail in the “Procedures Manual on Assessment and Certification” and “Guidelines on the Implementation of the “Philippine TVET Competency Assessment and Certification System (PTCACS)”. Tour Guiding Services NC III-TRSTGS321 Promulgated (09/14/2021) 122"
