        "source_text": "TRS141202\n\n UNIT DESCRIPTOR :\nThis unit deals with the skills and knowledge required to work\ncooperatively in a general administration environment in a range\nof settings within the labor divisions of the hospitality industry.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n1. Develop\neffective team\nrelationships\n1.1 Relationships with\nteam members and\npromote benefits of\ncooperative work\nconsistent with\norganizational goals\nand objectives are\ndeveloped and\nmaintained\n1.2 Responsibilities and\nassignments in a\npositive manner to\npromote effective\nrelationships within the\nwork group are\nundertaken\n1.3 Courteous and\nappropriate\ncommunication with\nothers in a manner,\nwhich reflects\nsensitivity to individual\nsocial and cultural\ndifferences in\naccordance with\norganizational\nrequirements, are\nconducted\n1.4 Communication\ntechniques to relay\ninformation in a clear\nand concise manner\nare used\n1.5 Language and tone\nappropriate to a\nparticular audience,\npurpose and situation,\n1.1 Principles of\neffective\ncommunication skills\n1.2 Feedback\ntechniques and\nteam building\ntechniques to build\nand maintain\ninterpersonal\nrelationships within\na designated work\ngroup or team\n1.3 Communicate\neffectively with a\nrange of people\nrelevant to position\nand role\n1.4 Customer relations\n1.5 Enterprise’s policies\nand procedures in\nresolving complaints\nand conflict\n\n1.1 Questioning and\ncommunication\nskills\n1.2 Research skills\n1.3 Analytical skills\n1.4 Ability to research\nindustry information\nsources\n1.5 Identifying relevant\ninformation\n1.6 Compilation and\nclassification of\ninformation and\ndata\n1.7 Networking skills\n\n--- PDF PAGE 58 ---\nTour Guiding Services NC III-TRSTGS321 Promulgated (09/14/2021) 54\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\ntaking into account the\nrelevant factors\ninvolved are used\n1.6 Issues that may lead\nto, or involve conflict\nwith team members, or\nrefer to appropriate\npersons are\nrecognized and\ndiscussed\n1.7 Routine workplace\ndocumentation is\ncompleted accurately\nand in a timely manner\n2. Participate in\nteam\nassignments\n2.1 Individual\nresponsibilities within\nthe workgroup in\naccordance with\norganisational\nrequirements are\nidentified and met\n2.1 Cultural differences\nwithin the team are\nrecognized and\naccommodated\n2.1 Principles of\neffective\ncommunication\nskills\n2.2 Feedback\ntechniques and\nteam building\ntechniques to build\nand maintain\ninterpersonal\nrelationships within\na designated work\ngroup or team\n2.3 Communicate\neffectively with a\nrange of people\nrelevant to position\nand role\n2.4 Customer relations\n2.5 Enterprise’s policies\nand procedures in\nresolving\ncomplaints and\nconflict\n2.1 Questioning and\ncommunication\nskills\n2.2 Research skills\n2.3 Analytical skills\n2.4 Ability to research\nindustry information\nsources\n2.5 Identifying relevant\ninformation\n2.6 Compilation and\nclassification of\ninformation and\ndata\n2.7 Networking skills\n\n3. Contribute to\nteam\ndevelopment\n\n3.1 Both internal\ncustomer and\nexternal customer\nneeds and\nexpectations in\naccordance with\norganization\nstandards, policies\nand procedures and\n3.1 Principles of\neffective\ncommunication skills\n3.2 Feedback\ntechniques and\nteam building\ntechniques to build\nand maintain\ninterpersonal\nrelationships within\n3.1 Questioning and\ncommunication\nskills\n3.2 Research skills\n3.3 Analytical skills\n3.4 Ability to research\nindustry information\nsources\n3.5 Identifying relevant\ninformation\n\n--- PDF PAGE 59 ---\nTour Guiding Services NC III-TRSTGS321 Promulgated (09/14/2021) 55\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\nwithin acceptable time\nframes are met\n3.2 Encouragement and\nsupport to other team\nmembers to identify\nand organise\nprofessional\ndevelopment\nopportunities are\ngiven\n3.3 Formal feedback and\ninformal feedback on\nindividual and team\nperformance regularly\nfrom colleagues and\nsupervisors to identify\nand implement\nimprovements to\nproducts, services,\nprocesses or outcomes\nare sought\n3.4 Personal work\nstandards in a manner\nthat supports the\nworkgroup and\norganisational\nrequirements are\nmaintained\n3.5 Positive contributions to\nthe planning process to\nimprove work practices\nare made\n3.6 Non-discriminatory\nattitudes and\nlanguage when\ninteracting with\ncustomers, staff and\nmanagement,\nconsistently are used\na designated work\ngroup or team\n3.3 Communicate\neffectively with a\nrange of people\nrelevant to position\nand role\n3.4 Customer relations\n3.5 Enterprise’s policies\nand procedures in\nresolving complaints\nand conflict\n\n3.6 Compilation and\nclassification of\ninformation and\ndata\n3.7 Networking skills\n\n--- PDF PAGE 60 ---\nTour Guiding Services NC III-TRSTGS321 Promulgated (09/14/2021) 56\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Team members\nMay Include:\n1.1 Specific groups of employees assigned to complete\ndesignated tasks, or to work together\n1.2 The organization as a whole\n1.3 Individual branches\n1.4 Individual work sections\n2. Organizational goals\nand objectives\nMay Include:\n2.1 Reporting deadlines\n2.2 Budgetary targets\n2.3 Team participation\n2.4 Team and individual learning goals\n2.5 Professional development\n3. Responsibility\nMay Include:\n3.1 Obeying lawful orders\n3.2 Confidentiality and privacy requirements\n3.3 Safety and care with respect to occupational safety and\nhealth requirements\n3.4 Terms and conditions of own employment\n3.5 Responsibility of providing a safe environment, free from\ndiscrimination and sexual harassment\n4. Appropriate\ncommunication\nMay Include:\n4.1 Using active listening\n4.2 Using both open and closed questions\n4.3 Speaking clearly and concisely\n4.4 Using appropriate language and tone of voice\n4.5 Being attentive\n4.6 Maintaining eye contact in face-to face interactions\n4.7 Using appropriate non-verbal communication in face-to-face\ninteractions, e.g. Body language, attention and personal\npresentation\n5. Social and cultural\ndifferences\nMay Include:\n5.1 Language\n5.2 Traditional practices and observations\n5.3 Beliefs, values, practices\n5.4 Food, diet\n5.5 Dress\n5.6 Religious and spiritual observances\n5.7 Social conventions\n5.8 Cultural stereotypes\n5.9 Conventions of gender/sexuality\n6. Organizational\nrequirements\nMay Include:\n6.1 Legal and organizational policy and procedures, including\npersonnel practices and guidelines\n6.2 Organizational goals, objectives, plans, systems and\nprocesses\n\n--- PDF PAGE 61 ---\nTour Guiding Services NC III-TRSTGS321 Promulgated (09/14/2021) 57\nVARIABLE\nRANGE\n6.3 Legislation relevant to the operation, incident and/or\nresponse\n6.4 Employer and employee rights and responsibilities\n6.5 Business and performance plans\n6.6 Policies and procedures relating to own role, responsibility\nand delegation\n6.7 Quality and continuous improvement processes and\nstandards\n6.8 Client service standards\n6.9 Defined resource parameters\n7. Language and tone\nMay Include:\n7.1 Using simple, concise language that can be easily\nunderstood by the audience\n7.2 Using appropriate tone, i.e. not patronizing, not too loud, not\ntoo soft, not yelling, not angry\n8. Conflict\nMay Include:\n8.1 Group conflict\n8.2 Conflict with individuals\n8.3 Conflict with co-workers\n9. Appropriate persons\nMay Include:\n9.1 Supervisors, managers\n9.2 Colleagues\n9.3 Human resource personnel\n9.4 Members of the public\n9.5 Clients\n10. Workplace\ndocumentation\nMay Include:\n10.1 Letters\n10.2 Memos\n10.3 Faxes\n10.4 Emails\n10.5 Invoices and purchase orders\n10.6 Policies and procedures\n11. Cultural differences\n\nMay Include:\n11.1 Forms of address\n11.2 Levels of formality, or informality\n11.3 Non-verbal behavior\n11.4 Work ethics\n11.5 Personal grooming\n11.6 Family obligations\n11.7 Recognized holidays\n11.8 Special needs\n11.9 Preferences for personal interactions\n\n12. Internal customer\n\nMay Include:\n12.1 Colleagues working in another department\n12.2 Team members\n12.3 Supervisor or managers\n\n--- PDF PAGE 62 ---\nTour Guiding Services NC III-TRSTGS321 Promulgated (09/14/2021) 58\nVARIABLE\nRANGE\n13. External customer\n\nMay Include:\n13.1 Suppliers\n13.2 People who buy the goods and services the enterprise sells\n14. Organization\nstandards, policies\nand procedures\nMay Include:\n14.1 Complaints procedures\n14.2 Organizational standard report forms\n14.3 Job descriptions\n14.4 Code of ethics\n14.5 Quality systems, standards and guidelines\n15. Professional\ndevelopment\nopportunities\n\nMay Include:\n15.1 Coaching, mentoring and/or supervision\n15.2 Formal and/or informal learning programs\n15.3 Internal and/or external training provision\n15.4 Work experience and exchange opportunities\n15.5 Personal study\n15.6 Career planning and development\n15.7 Performance appraisals\n15.8 Workplace skills assessment\n15.9 Quality assurance assessments and recommendations\n16. Formal feedback\n\nMay Include:\n16.1 360-degree assessment\n16.2 Customer satisfaction surveys/forms\n16.3 Team evaluations\n16.4 Performance reviews/appraisals\n16.5 Workplace assessment\n17. Informal feedback\nMay Include:\n17.1 Critical incident reviews\n17.2 Impromptu questioning of customers to obtain view of\nproducts and/or service provided\n17.3 Chance discussions with customers\n17.4 Coaching and mentoring\n17.5 Seeking the opinions of others\n17.6 Comments from supervisors, colleagues or clients\n17.7 Personal, reflective behavior strategies\n18. Non-discriminatory\nattitudes and\nlanguage\nMay Include:\n18.1 Language in relation to race and ethnicity\n18.2 Not making assumptions about physical or intellectual\nabilities\n18.3 The use of non-discriminatory language in relation to the\nportrayal of people with disabilities\n18.4 Using and gender inclusive language\n\n--- PDF PAGE 63 ---\nTour Guiding Services NC III-TRSTGS321 Promulgated (09/14/2021) 59\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Demonstrated ability to apply active listening techniques\n1.2 Demonstrated ability to use effective communication skills\nto build and maintain interpersonal relationships within a\ndesignated work group or team\n1.3 Demonstrated ability to apply the principles of good\nteamwork to assist self and others to complete\nassignments within designated timeframes\n1.4 Demonstrated ability to interpret and comply with a range\nof legislative and procedural requirements relevant to\nsecurity operations\n1.5 Demonstrated ability to actively seek and interpret\nfeedback on quality of work performance and identify\nopportunities for professional development to develop and\nimprove future career options\n1.6 Demonstrated ability to communicate in a clear, concise\nand accurate manner which reflects sensitivity to individual\nsocial and cultural differences\n2. Resource Implications\nThe following resources should be provided:\n2.1 Training and assessment to include access to a real or\nsimulated workplace; and access to workplace\nstandards, procedures, policies, guidelines, tools and\nequipment\n3. Method of Assessment\nCompetency in this unit may be assessed through:\n3.1 Case studies\n3.2 Observation of practical candidate performance\n3.3 Oral and written questions\n3.4 Portfolio evidence\n3.5 Problem solving\n3.6 Role plays\n3.7 Third party reports completed by a supervisor\n3.8 Project and assignment work\n4. Context of Assessment\n4.1 Competency may be assessed in actual workplace or at\nthe designated TESDA Accredited Assessment Center.\n\n--- PDF PAGE 64 ---\nTour Guiding Services NC III-T