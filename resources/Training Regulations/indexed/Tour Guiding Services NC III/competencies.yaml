        "source_title": "RECEIVE AND RESOLVE CUSTOMER COMPLAINTS",
        "source_text": "--- PDF PAGE 52 ---\nTour Guiding Services NC III-TRSTGS321     Promulgated  (09/14/2021)                                           48 \nUNIT OF COMPETENCY :        RECEIVE AND RESOLVE CUSTOMER COMPLAINTS \n \n     UNIT CODE  \n:        TRS141201 \n \nUNIT DESCRIPTOR      \n: \nThis unit deals with the skills and knowledge required to  \n \nreceive and resolve customer complaints in a range of  \n \nsettings within the hospitality industry workplace context. \n  \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1.  Identify and \nanalyse the \ncomplaint \n \n1.1 Verbal complaint, \nusing active listening \nand empathy \ntechniques is received \nand accurately \nrecorded \n1.2 The exact nature of \nthe customer \ncomplaint are \nidentified through \nappropriate \ncommunication \ntechniques \n1.3 Register or complaint \nfile/s in accordance \nwith the requirements \nof the enterprise \ninformation system \nare maintained  \n1.1 Communication \ntechniques \n1.2 Anger management \ntechniques and \nconflict resolution \ntechniques  \n1.3 Customer complaints  \n1.4 Records and \ndocumentation \n1.5 Enterprise’s policies \nand procedures \n \n \n1.1 Questioning and \ncommunication skills \n1.2 Research skills \n1.3 Analytical skills \n1.4 Identifying relevant \ninformation \n1.5 Compilation and \nclassification of \ninformation and data \n1.6 Networking skills \n1.7 Handling complaints \n \n2.  Respond to \ncomplaints \n2.1 Complaints in \naccordance with \norganizational \nstandards, policies \nand procedures are \nprocessed  \n2.2 Documentation in \nrelation to complaints \nis obtained and \nreviewed \n2.3 Register of \ncomplaints/disputes \nare updated   \n \n \n2.1 Communication \ntechniques \n2.2 Anger management \ntechniques and \nconflict resolution \ntechniques  \n2.3 Customer complaints  \n2.4 Records and \ndocumentation \n2.5 Enterprise’s policies \nand procedures \n \n \n2.1 Questioning and \ncommunication skills \n2.2 Analytical skills \n2.3 Identifying relevant \ninformation \n2.4 Compilation and \nclassification of \ninformation and data \n2.5 Networking skills \n2.6 Processing \ncomplaints \n \n \n3.  Determine and \nagree upon \nappropriate \naction to resolve \ncomplaint \n3.1 Options to resolve the \ncomplaint within \nenterprise policy, \nprocedures and \n3.1 Communication \ntechniques \n3.2 Anger management \ntechniques and \nconflict resolution \n3.1 Questioning and \ncommunication skills \n3.2 Analytical skills\n\n--- PDF PAGE 53 ---\nTour Guiding Services NC III-TRSTGS321     Promulgated  (09/14/2021)                                           49 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \nguidelines are \nidentified and reviewed \n3.2 Action to resolve the \ncomplaint with the \ncustomer is agreed \nand confirmed. \n3.3 A commitment to the \ncustomer to resolve \nthe complaint is \ndemonstrated \n3.4 Customer is \ninformed on the \noutcome of \ninvestigation of \ncomplaint investigation \ntechniques to resolve \ncustomer complaints \n3.3 Communicate \neffectively with all \nrelevant people \nthroughout the \ncomplaint resolution \nprocess \n3.4 Written complaints \n3.5 Workplace records \nand documentation. \n3.6 Enterprise’s policies \nand procedures in \nregard to receiving \nand resolving \ncustomer complaints \n3.3 Ability to research \nindustry information \nsources \n3.4 Identifying relevant \ninformation \n3.5 Compilation and \nclassification of \ninformation and data \n3.6 Networking skills \n3.7 Resolving complaint \n \n \n \n4.  Refer complaints \n4.1 Complaints that \nrequire referral to \nother personnel or \nexternal bodies are \nidentified \n4.2 Complaint to \nappropriate \npersonnel for follow-\nup in accordance with \nindividual level of \nresponsibility are \nreferred \n4.3 All necessary \ndocumentation \nincluding investigation \nreports to appropriate \npersonnel are \nforwarded \n4.4 Complaints which \ncannot be resolved to \nan appropriate person \nare referred \n4.1 Communication \ntechniques \n4.2 Anger management \ntechniques and \nconflict resolution \ntechniques to resolve \ncustomer complaints \n4.3 Communicate \neffectively with all \nrelevant people \nthroughout the \ncomplaint resolution \nprocess \n4.4 Written complaints \n4.5 Workplace records \nand documentation. \n4.6 Enterprise’s policies \nand procedures in \nregard to receiving \nand resolving \ncustomer complaints \n4.1 Questioning and \ncommunication skills \n4.2 Analytical skills \n4.3 Ability to research \nindustry information \nsources \n4.4 Identifying relevant \ninformation \n4.5 Compilation and \nclassification of \ninformation and data \n4.6 Networking skills\n\n--- PDF PAGE 54 ---\nTour Guiding Services NC III-TRSTGS321     Promulgated  (09/14/2021)                                           50 \nRANGE OF VARIABLES  \n \nVARIABLE \nRANGE \n1  Complaint  \nMay include:  \n1.1 Any expression of dissatisfaction with food and beverage \nproducts or food service by a customer  \n1.2 Written complaints, e.g. Letter, email, complaint and/or \nfeedback form \n1.3 Verbal, face-to-face, complaints \n1.4 Verbal complaints over the telephone \n2.  Appropriate \ncommunication techniques  \nMay include:  \n2.1 The use of active listening \n2.2 The use of both open and closed questions \n2.3 Speaking clearly and concisely \n2.4 Using appropriate language and tone of voice \n2.5 Giving customers full attention \n2.6 Maintaining eye contact in face-to face interactions \n2.7 Appropriate non-verbal communication in face-to-face \ninteractions, e.g. Body language, attention and personal \npresentation \n2.8 and should include: \n2.9 Conflict resolution techniques \n2.10 Anger management techniques \n2.11 Observation of personal safety \n3.  Organizational standards, \npolicies and procedures  \nMay include:   \n3.1 Complaints procedures \n3.2 Organisational standard report forms \n3.3 Job descriptions \n3.4 Code of ethics \n3.5 Quality systems, standards and guidelines  \n3.6 Insurance/liabilities policies \n4.  Documentation  \nMay include: \n4.1 Letters of complaint \n4.2 Customer feedback forms outlining complaints, such as \npaper-based customer satisfaction questionnaires, \ninternet-based customer satisfaction questionnaires \n4.3 Complaint emails \n5.  Options \n \nMay include: \n5.1 Options that satisfy the customer \n5.2 Options that partially satisfy the customer \n5.3 Options that do not satisfy the customer. \n5.4 and should include: \n5.5 Options that reflect enterprise policy, procedures and \nguidelines. \n6.  Inform customer of \noutcome  \nMay include: \n6.1 Providing documentation and/or evidence that supports \ncustomer complaint\n\n--- PDF PAGE 55 ---\nTour Guiding Services NC III-TRSTGS321     Promulgated  (09/14/2021)                                           51 \nVARIABLE \nRANGE \n6.2 Providing documentation and/or evidence that does not \nsupport customer complaint. \n6.3 Information (verbal or written) that directly relates to the \ncomplaint being investigated \n6.4 Information (verbal or written) that is presented in a calm \nand accurate manner \n7.  Appropriate person  \nMay include: \n7.1 Immediate superior within the organisational hierarchy \n7.2 Specialist customer service staff \n7.3 External bodies\n\n--- PDF PAGE 56 ---\nTour Guiding Services NC III-TRSTGS321     Promulgated  (09/14/2021)                                           52 \nEVIDENCE GUIDE \n \n1.  Critical aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 Demonstrated ability to apply anger management \ntechniques \n1.2 Demonstrated ability to apply conflict resolution \ntechniques \n1.3 Demonstrated ability to use effective communication \nskills to accurately determine the nature of complaints \n1.4 Demonstrated ability to obtain written and verbal \ninformation relevant to the complaint \n1.5 Demonstrated ability to working with enterprise policies \nand procedures to resolve customer complaints \n1.6 Demonstrated ability to initiate escalation procedures at \nan appropriate time within the complaint resolution \nprocess \n1.7 Demonstrated ability to maintain effective communication \nlines with customers, other personnel and management \nin order to resolve customer complaints quickly \n1.8 Demonstrated ability to apply knowledge of different \ncultures and cultural characteristics appropriately in \ncommunications with customers and colleagues from \ndiverse backgrounds \n2.  Resource Implications \nThe following resources should be provided: \nTraining and assessment to include access to a real or \nsimulated workplace; and access to workplace customer \nservice standards, procedures, policies, guidelines, tools and \nequipment and in particular those procedures, policies and \nguidelines that guide effective complaint resolution. \n3.  Method of Assessment \n5 Competency in this unit may be assessed through: \n3.1 Case studies \n3.2 Observation of practical candidate performance \n3.3 Oral and written questions \n3.4 Portfolio evidence \n3.5 Problem solving \n3.6 Role plays \n3.7 Third party reports completed by a supervisor \n3.8 Project and assignment work. \n 4.  Context of Assessment \n4.1   Competency may be assessed in actual workplace or at \nthe designated TESDA Accredited Assessment Center.\n",
