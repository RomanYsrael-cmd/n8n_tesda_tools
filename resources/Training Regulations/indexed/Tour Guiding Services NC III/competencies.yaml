        "evidence_guide": {
          "source_text": "1. Critical Aspects of\nCompetency\n\nAssessment requires evidence that the candidate:\n1.1\nMet and assisted visitors upon arrival at the destination\n1.2\nGuided and escorted visitors while on tour in the region\n1.3\nDelivered information, tour spiels and commentaries\n1.4\nResolved complaints and emergency situations\n1.5\nProvided send-off assistance and hotel departure formalities\n1.6\nMaintained harmonious working relationship with tour driver\n1.7\nEstablished good working attitude with the local guide\n\n2. Resource\nImplications\nThe following resources should be provided:\n2.1\nAccess to workplace location\n2.2\nAccess to telephone, two-way radio, fax, computer and any\nrelevant equipment for tour guiding\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1 Direct observation with oral questioning\n3.2 Simulated or actual demonstration (mock tour and/or role play)\n\n4. Context for\n Assessment\n4.1\nCompetency may be assessed in actual workplace or at the\ndesignated TESDA accredited assessment center\n\n--- PDF PAGE 93 ---\nTour Guiding Services NC III-TRSTGS321 Promulgated (09/14/2021) 89"
        },
        "source_text": "TRS511309\n\nUNIT DESCRIPTOR :\nThis unit deals with the knowledge and skills required\nfor guiding and escorting visitors in a region, performing safety\npractices, resolving complaints and other emergencies.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Meet and assist\nvisitors upon\narrival at the\ndestination\n1.1 Determined the role\nand responsibilities\nof the tour guide as\nper company policies\nand procedures.\n1.2 Arrival details are\nchecked.\n1.3 Reservations of the\nitinerary are doubled-\nchecked with the local\nguide when applicable.\n1.4 Tour itinerary is\nchecked for compliance\nwith the visitors’\nrequirements.\n1.5 Meets and greets the\nvisitors at the\ndestination’s gateway.\n1.6 Visitors are properly\npositioned to give\nwelcome briefing\nbefore boarding\n(whenever possible).\n1.7 Visitors’ baggage is\nchecked and ensured\nbaggage is boarded.\n1.8 Accompanies visitors to\nthe place of lodging.\n1.9 Assistance is provided\nin the registration\nformalities at the place\nof lodging during\ncheck-in, when\napplicable.\n1.10 Visitors are reminded\nof the next activity.\n\n1.1 Role and\nresponsibilities of the\ntour guide\n1.2 Pre-arrival\nprocedures\n1.3 Procedures at the\ngateway\n1.4 Baggage handling\n1.5 Arrival transfer\nprocedures and\ncommentaries\n1.6 Hotel check-in\nformalities\n1.7 Tour guide’s code of\nethics\n1.8 General knowledge of\nthe Philippines and\nspecific knowledge of\nthe region including:\n-\nClimate\n-\nGeography and\ngeology\n-\nHistory\n-\nArchitecture\n-\nCultural events\n-\nReligion\n-\nArt, theatre,\nmusic and\nliterature\n-\nNatural\nenvironment and\ntourism\n-\nFlora and fauna\n-\nGovernment and\npolitics\n-\nTransport\n-\nAgriculture\n1.1 Ability to speak\nfluently in English\nand the local dialects\n1.2 Ability to tactfully\nanswer and handle\nsensitive question\nand situation\n1.3 Assisting visitors to\nplace of lodging\n1.4 Ability to work with\nthe local guide when\napplicable\n\n--- PDF PAGE 84 ---\nTour Guiding Services NC III-TRSTGS321 Promulgated (09/14/2021) 80\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n-\nScience and\nTechnology\n-\nSports\n-\nEconomy\n-\nTrade\n-\nFood (Local\ndishes)\n-\nLifestyle\n-\nShopping\n-\nTourism services\nand facilities\n1.9 Health and Safety\nGuidelines issued by\nconcerned\ngovernment\nagencies, i.e. DOLE,\nDOH, DOT, DTI\n(DOLE DO 198s2018\npolicies on OSH)\n1.10 Awareness of\npersons with different\nabilities (BP344\nAccessibility Law)\n\n2. Guide and escort\nvisitors while on\ntour in the region\n2.1 Ensure that\nappropriate attire are\nworn for different\nactivities or occasions.\n2.2 Personal hygiene is\nobserved and practiced\nper accepted social\nnorms.\n2.3 Tourist driver and local\nguide are briefed on\nthe pick-up points,\nroute and stop-over.\n2.4 Summary of the day’s\nactivities are provided\nto visitors\n2.5 Assistance to visitors\nare provided and\nquestions and\nconcerns are\naddressed\n2.6 Visitors’ movements\nduring stop-over and\nwalkabouts are\nmanaged or monitored\n2.1 Role of tour guide as\na time keeper,\nshepherd and giver\nof care\n2.2 Tour guide’s code of\nethics\n2.3 Tour guiding\ntechniques\n2.4 Optional tours\n2.5 Safety rules and\nprocedures\n2.6 Situation awareness\n2.7 General knowledge\nof the Philippines\nand specific\nknowledge of the\nregion including:\n-\nClimate\n-\nGeography and\ngeology\n-\nHistory\n-\nArchitecture\n-\nCultural events\n-\nReligion\n2.1 Ability to speak\nfluently In English\nand the local dialects\n2.2 Ability to tactfully\nanswer and handle\nsensitive question\nand situation\n2.3 Guiding and\nescorting visitors on\ndifferent tour\nlocations\n\n--- PDF PAGE 85 ---\nTour Guiding Services NC III-TRSTGS321 Promulgated (09/14/2021) 81\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\nwith the local guide\nwhen applicable\n2.7 Tour arrangements\nwith suppliers are\ncoordinated\n2.8 Optional tours are\npromoted and\nencouraged for clients\nto avail\n2.9 Safety precautions are\nobserved and followed\nat all times\n2.10 Vehicles are checked\nfor belonging left\nbehind after every tour\n2.11 Practices situation\nawareness at all times\nto prevent accidents\nand other unforeseen\nsituations.\n\n-\nArt, theatre,\nmusic and\nliterature\n-\nNatural\nenvironment and\ntourism\n-\nFlora and fauna\n-\nGovernment and\npolitics\n-\nTransport\n-\nAgriculture\n-\nScience and\nTechnology\n-\nSports\n-\nEconomy\n-\nTrade\n-\nFood (Local\ndishes)\n-\nLifestyle\n-\nShopping\n-\nTourism services\nand facilities\n2.8 Health and Safety\nGuidelines issued by\nconcerned\ngovernment\nagencies, i.e. DOLE,\nDOH, DOT, DTI\n(DOLE DO\n198s2018 policies\non OSH)\n2.9 Awareness of\npersons with\ndifferent abilities\n(BP344\nAccessibility Law)\n\n3. Deliver\ninformation, tour\nspiels and\ncommentaries\n3.1 Relevant and timely\ncommentaries and\ninstructions are\nprovided\n3.2 Posture and safe\npositioning are\nmaintained at all times\n3.3 Commentaries are\ndelivered with proper\n3.1 Role of tour guide\nas an interpreter and\npresenter\n3.2 Tour commentary\ndelivery techniques\n3.3 Informative\ncommentaries and\nspiels\n3.4 Application of\npositive social skills\n3.1 Ability to speak\nfluently In English\nand the local\ndialects\n3.2 Ability to tactfully\nanswer and handle\nsensitive question\nand situation\n3.3 Delivering\ninformation, tour\n\n--- PDF PAGE 86 ---\nTour Guiding Services NC III-TRSTGS321 Promulgated (09/14/2021) 82\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\nvoice modulation and\npronunciation.\n3.4 Appropriate\nterminologies are used\nand updated\ninformation is provided\nat all times.\n3.5 Positive interaction is\ndeveloped and rapport\nis established with\nvisitors.\n\n3.5 Tour guide’s code of\nethics\n3.6 General knowledge\nof the Philippines\nand specific\nknowledge of the\nregion including:\n-\nClimate\n-\nGeography and\ngeology\n-\nHistory\n-\nArchitecture\n-\nCultural events\n-\nReligion\n-\nArt, theatre,\nmusic and\nliterature\n-\nNatural\nenvironment and\ntourism\n-\nFlora and fauna\n-\nGovernment and\npolitics\n-\nTransport\n-\nAgriculture\n-\nScience and\nTechnology\n-\nSports\n-\nEconomy\n-\nTrade\n-\nFood (Local\ndishes)\n-\nLifestyle\n-\nShopping\n-\nTourism services\nand facilities\n3.7 Health and Safety\nGuidelines issued by\nconcerned\ngovernment\nagencies, i.e. DOLE,\nDOH, DOT, DTI\n(DOLE DO\n198s2018 policies\non OSH)\n3.8 Awareness of\npersons with\ndifferent abilities\nspiels and\ncommentaries\n3.4 Ability to augment\nthe local guide’s\ncommentary\ntactfully\n\n--- PDF PAGE 87 ---\nTour Guiding Services NC III-TRSTGS321 Promulgated (09/14/2021) 83\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n(BP344 Accessibility\nLaw)\n\n4. Resolve\ncomplaints and\nemergency\nsituations\n4.1 Complaints are\nattended to and\nreferred to the persons\nconcerned\n4.2 Visitors’ safety and\ncomfort are ensured\nduring the entire tour\n4.3 Stressful situations are\navoided and handled\ntactfully\n4.4 Damage control is\nadopted in unforeseen\nsituations.\n4.5 Best solutions are\napplied to unforeseen\nsituations with\ncompany’s approval\n4.6 Tour operator is\nnotified on the remedial\nmeasures in\nunforeseen situations.\n4.7 Emergency situations\nare handled.\n\n4.1 Visitor’s complaints\n4.2 Safety precautions\nduring the entire tour\n4.3 Solutions on\nresolving complaints\n4.4 Documentation of\ncomplaints\n4.5 Tour guide’s code of\nethics\n4.6 Crisis Management\nAwareness and\nPreparedness (Man\nmade and\notherwise)\n4.7 Health and Safety\nGuidelines issued by\nconcerned\ngovernment\nagencies, i.e. DOLE,\nDOH, DOT, DTI\n(DOLE DO\n198s2018 policies\non OSH)\n4.8 Awareness of\npersons with\ndifferent abilities\n(BP344 Accessibility\nLaw)\n\n4.1 Resolving complaints\nand other\nemergencies\n4.2 Ability to speak\nfluently In English\nand the local dialects\n4.3 Ability to tactfully\nanswer and handle\nsensitive question\nand situation\n4.4 First Aid Techniques\n4.5 Ability to work with\nthe local guide to\nresolve complaints\nwhen applicable\n4.6\n\n5. Provide send-off\nassistance and\nhotel departure\nformalities\n5.1 Assistance with check-\nout formalities at the\nplace of lodging is\nprovided.\n5.2 Collection and boarding\nof visitors’ baggage is\nsupervised.\n5.3 Visitors are\naccompanied to the\nplace of departure\n5.4 Relevant information\nen route to the place of\ndeparture is provided.\n5.5 Appropriate closing\nspiel is delivered.\n5.1 Departure\nprocedures\n5.2 Baggage handling\n5.3 Departure transfer\nprocedures and\ncommentaries\n5.4 Hotel check-out\nformalities\n5.5 Closing spiel\n5.6 Role of tour guide\nas an interpreter\n5.7 Tour guide’s code of\nethics\n\n5.1 Providing send- off\nassistance and hotel\ndeparture formalities\n5.2 Ability to speak\nfluently In English\nand the local dialects\n5.3 Ability to tactfully\nanswer and handle\nsensitive question\nand situation\n\n--- PDF PAGE 88 ---\nTour Guiding Services NC III-TRSTGS321 Promulgated (09/14/2021) 84\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n6. Maintain\nharmonious\nworking\nrelationship with\ntour driver\n6.1 Rapport with the tour\ndriver is established\n6.2 Cleanliness of tour\nvehicles and working\norder of seats and\npublic address system\nare checked including\nfirst aid kit and fire\nextinguisher.\n6.3 Tour driver is\nfamiliarized with the\nitinerary, route and\nstop-over.\n6.4 Driver’s attitude and\nprotocol to passengers\nare observed and\ngently corrects these if\nthe driver has an\nattitude problem.\n6.5 Driver’s meals and\nphysical condition are\nchecked especially\nduring long trips\n6.6 Assistance to the driver\nis provided whenever\npossible and\nrecognition is given to\nthe bus driver for a job\nwell done when\nwarranted.\n\n6.1 People skills\n6.2 Teamwork\n6.3 Vehicles registration\n6.4 Protocol to\npassengers\n6.5 Role of tour guide\n6.6 Tour guide’s code of\nethics\n\n6.1 Developing tour\nguide-tour driver\nwork relationship\n6.2 Ability to\ncommunicate In\nEnglish and the local\ndialects\n6.3 Ability to use office\nequipment\n6.4 Ability to tactfully\nanswer and handle\nsensitive question\nand situation\n\n7. Establish good\nworking attitude\nwith the local\nguide\n7.1 Coordinate with the\nlocal guide for itinerary\nand inclusions\n7.2 Rapport with the local\nguide is established\n7.3 Provide assistance to\nthe local guide\nwhenever necessary\n7.1 People skills\n7.2 Teamwork\n7.3 Protocol to\npassengers\n7.4 Role of tour guide\n7.5 Tour guide’s code of\nethics\n7.6 Health and Safety\nGuidelines issued by\nconcerned\ngovernment\nagencies, i.e. DOLE,\nDOH, DOT, DTI\n(DOLE DO\n198s2018 policies\non OSH)\n7.1 Ability to develop\npartnerships with\nlocal guide\n7.2 Ability to tactfully\nanswer sensitive\nquestions and\nmanage sensitive\nsituation\n7.3 Ability to interpret\nitinerary inclusions\nclearly\n\n--- PDF PAGE 89 ---\nTour Guiding Services NC III-TRSTGS321 Promulgated (09/14/2021) 85\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n7.7 Awareness of\npersons with\ndifferent abilities\n(BP344 Accessibility\nLaw)\n\n--- PDF PAGE 90 ---\nTour Guiding Services NC III-TRSTGS321 Promulgated (09/14/2021) 86\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Role and responsibilities\nof the tour guide\nMay include:\n1.1 The use of map, compass, ballpen, pencil, camera,\ntwo-way radio, cell phone, whistle, banner, hat, bull\nhorn, sun block, lotion, first aid kit\n\n2. Appropriate attire\nMay include:\n2.1 Authorized tour guide apparel is based on the type\nof tour and type of visitor to be guided\n2.2 Tour guide name plate is desirable\n3. Complaints\nMay include:\n3.1 Loss of luggage\n3.2 Lost, misplaced or damaged personal belongings and\ndocuments\n3.3 Pilferage\n3.4 Also includes arrangements not in accordance with\nthe reservations or delayed delivery of services\n4. Emergency situations\nMay include:\n4.1 Man made\n4.1.1 Hostage taking\n4.1.2 Fire\n4.1.3 Bombing\n4.1.4 Petty crimes\n4.1.5 Traffic accidents\n4.2 Natural\n4.2.1 Earthquake\n4.2.2 Typhoon\n4.2.3 Volcanic eruption\n4.2.4 Epidemic\n4.2.5 Flooding\n5. Relevant information\nMay include:\n4.1 Economy – agriculture, aqua-culture, trade,\ncommerce and industry\n4.2 Social Sciences – geography, history, heritage,\nculture, music, arts, crafts\n4.3 Environment – climate, endemic flora. fauna, fruits,\nenvironmental protection and conservation\n4.4 Religion, Education, Sports and Governance – K-12,\npolitical and sports figures\n4.5 Support Services – transportation and accessibility,\nbanking and finance, health and sanitation, food and\nbeverage\n4.6 Current events and holidays\n\n--- PDF PAGE 91 ---\nTour Guiding Services NC III-TRSTGS321 Promulgated (09/14/2021) 87\n6. Local guide\nMay include:\n5.1 Museum guide\n5.2 Farm guide\n5.3 Community guide\n5.4 Eco guide\n5.5 Trail guide\n5.6 Cave guide\n5.7 Mountain guide\n5.8 Heritage guide\n5.9 Indigenous guide\n\n--- PDF PAGE 92 ---\nTour Guiding Services NC III-TRSTGS321 Promulgated (09/14/2021) 88\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\n\nAssessment requires evidence that the candidate:\n1.1\nMet and assisted visitors upon arrival at the destination\n1.2\nGuided and escorted visitors while on tour in the region\n1.3\nDelivered information, tour spiels and commentaries\n1.4\nResolved complaints and emergency situations\n1.5\nProvided send-off assistance and hotel departure formalities\n1.6\nMaintained harmonious working relationship with tour driver\n1.7\nEstablished good working attitude with the local guide\n\n2. Resource\nImplications\nThe following resources should be provided:\n2.1\nAccess to workplace location\n2.2\nAccess to telephone, two-way radio, fax, computer and any\nrelevant equipment for tour guiding\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1 Direct observation with oral questioning\n3.2 Simulated or actual demonstration (mock tour and/or role play)\n\n4. Context for\n Assessment\n4.1\nCompetency may be assessed in actual workplace or at the\ndesignated TESDA accredited assessment center\n\n--- PDF PAGE 93 ---\nTour Guiding Services NC III-TRSTGS321 Promulgated (09/14/2021) 89"
