        "source_text": "--- PDF PAGE 57 ---\nTour Guiding Services NC III-TRSTGS321     Promulgated  (09/14/2021)                                           53 \n  \n      UNIT OF COMPETENCY    :      WORK COOPERATIVELY IN A GENERAL   ADMINISTRATION \nENVIRONMENT \n                                                    \n   UNIT CODE  \n   : \nTRS141202 \n \n   UNIT DESCRIPTOR            : \nThis unit deals with the skills and knowledge required to work \ncooperatively in a general administration environment in a range \nof settings within the labor divisions of the hospitality industry. \n \n \n \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range of \nVariables \n \nREQUIRED  \nKNOWLEDGE \n \nREQUIRED  \nSKILLS \n1. Develop \neffective team \nrelationships \n1.1 Relationships with \nteam members and \npromote benefits of \ncooperative work \nconsistent with \norganizational goals \nand objectives are \ndeveloped and \nmaintained \n1.2 Responsibilities and \nassignments in a \npositive manner to \npromote effective \nrelationships within the \nwork group are \nundertaken \n1.3 Courteous and \nappropriate \ncommunication with \nothers in a manner, \nwhich reflects \nsensitivity to individual \nsocial and cultural \ndifferences in \naccordance with \norganizational \nrequirements, are \nconducted  \n1.4 Communication \ntechniques to relay \ninformation in a clear \nand concise manner \nare used  \n1.5 Language and tone \nappropriate to a \nparticular audience, \npurpose and situation, \n1.1 Principles of \neffective \ncommunication skills \n1.2 Feedback \ntechniques and \nteam building \ntechniques to build \nand maintain \ninterpersonal \nrelationships within \na designated work \ngroup or team \n1.3 Communicate \neffectively with a \nrange of people \nrelevant to position \nand role \n1.4 Customer relations \n1.5 Enterprise’s policies \nand procedures in \nresolving complaints \nand conflict \n \n1.1 Questioning and \ncommunication \nskills \n1.2 Research skills \n1.3 Analytical skills \n1.4 Ability to research \nindustry information \nsources \n1.5 Identifying relevant \ninformation \n1.6 Compilation and \nclassification of \ninformation and \ndata \n1.7 Networking skills\n\n--- PDF PAGE 58 ---\nTour Guiding Services NC III-TRSTGS321     Promulgated  (09/14/2021)                                           54 \n \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range of \nVariables \n \nREQUIRED  \nKNOWLEDGE \n \nREQUIRED  \nSKILLS \ntaking into account the \nrelevant factors \ninvolved are used \n1.6 Issues that may lead \nto, or involve conflict \nwith team members, or \nrefer to appropriate \npersons are \nrecognized and \ndiscussed \n1.7 Routine workplace \ndocumentation is \ncompleted accurately \nand in a timely manner  \n2.  Participate in \nteam \nassignments \n2.1 Individual \nresponsibilities within \nthe workgroup in \naccordance with \norganisational \nrequirements are \nidentified and met \n2.1 Cultural differences \nwithin the team are \nrecognized and \naccommodated  \n2.1 Principles of \neffective \ncommunication \nskills \n2.2 Feedback \ntechniques and \nteam building \ntechniques to build \nand maintain \ninterpersonal \nrelationships within \na designated work \ngroup or team \n2.3 Communicate \neffectively with a \nrange of people \nrelevant to position \nand role \n2.4 Customer relations \n2.5 Enterprise’s policies \nand procedures in  \nresolving \ncomplaints and \nconflict \n2.1 Questioning and \ncommunication \nskills \n2.2 Research skills \n2.3 Analytical skills \n2.4 Ability to research \nindustry information \nsources \n2.5 Identifying relevant \ninformation \n2.6 Compilation and \nclassification of \ninformation and \ndata \n2.7 Networking skills \n \n \n \n3.  Contribute to \nteam \ndevelopment \n \n \n \n3.1  Both internal \ncustomer and \nexternal customer \nneeds and \nexpectations in \naccordance with \norganization \nstandards, policies \nand procedures and \n3.1 Principles of \neffective \ncommunication skills \n3.2 Feedback \ntechniques and \nteam building \ntechniques to build \nand maintain \ninterpersonal \nrelationships within \n3.1 Questioning and \ncommunication \nskills \n3.2 Research skills \n3.3 Analytical skills \n3.4 Ability to research \nindustry information \nsources \n3.5 Identifying relevant \ninformation\n\n--- PDF PAGE 59 ---\nTour Guiding Services NC III-TRSTGS321     Promulgated  (09/14/2021)                                           55 \n \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range of \nVariables \n \nREQUIRED  \nKNOWLEDGE \n \nREQUIRED  \nSKILLS \nwithin acceptable time \nframes are met  \n3.2  Encouragement and \nsupport to other team \nmembers to identify \nand organise \nprofessional \ndevelopment \nopportunities are \ngiven \n3.3  Formal feedback and \ninformal feedback on \nindividual and team \nperformance regularly \nfrom colleagues and \nsupervisors to identify \nand implement \nimprovements to \nproducts, services, \nprocesses or outcomes \nare sought  \n3.4  Personal work \nstandards in a manner \nthat supports the \nworkgroup and \norganisational \nrequirements are \nmaintained \n3.5  Positive contributions to \nthe planning process to \nimprove work practices \nare made  \n3.6  Non-discriminatory \nattitudes and \nlanguage when \ninteracting with \ncustomers, staff and \nmanagement, \nconsistently are used \na designated work \ngroup or team \n3.3 Communicate \neffectively with a \nrange of people \nrelevant to position \nand role \n3.4 Customer relations \n3.5 Enterprise’s policies \nand procedures in \nresolving complaints \nand conflict \n \n3.6 Compilation and \nclassification of \ninformation and \ndata \n3.7 Networking skills\n\n--- PDF PAGE 60 ---\nTour Guiding Services NC III-TRSTGS321     Promulgated  (09/14/2021)                                           56 \nRANGE OF VARIABLES  \n \nVARIABLE \nRANGE \n1. Te