ices NC III-TRSTGS321 Promulgated (09/14/2021) 84\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n6. Maintain\nharmonious\nworking\nrelationship with\ntour driver\n6.1 Rapport with the tour\ndriver is established\n6.2 Cleanliness of tour\nvehicles and working\norder of seats and\npublic address system\nare checked including\nfirst aid kit and fire\nextinguisher.\n6.3 Tour driver is\nfamiliarized with the\nitinerary, route and\nstop-over.\n6.4 Driver’s attitude and\nprotocol to passengers\nare observed and\ngently corrects these if\nthe driver has an\nattitude problem.\n6.5 Driver’s meals and\nphysical condition are\nchecked especially\nduring long trips\n6.6 Assistance to the driver\nis provided whenever\npossible and\nrecognition is given to\nthe bus driver for a job\nwell done when\nwarranted.\n\n6.1 People skills\n6.2 Teamwork\n6.3 Vehicles registration\n6.4 Protocol to\npassengers\n6.5 Role of tour guide\n6.6 Tour guide’s code of\nethics\n\n6.1 Developing tour\nguide-tour driver\nwork relationship\n6.2 Ability to\ncommunicate In\nEnglish and the local\ndialects\n6.3 Ability to use office\nequipment\n6.4 Ability to tactfully\nanswer and handle\nsensitive question\nand situation\n\n7. Establish good\nworking attitude\nwith the local\nguide\n7.1 Coordinate with the\nlocal guide for itinerary\nand inclusions\n7.2 Rapport with the local\nguide is established\n7.3 Provide assistance to\nthe local guide\nwhenever necessary\n7.1 People skills\n7.2 Teamwork\n7.3 Protocol to\npassengers\n7.4 Role of tour guide\n7.5 Tour guide’s code of\nethics\n7.6 Health and Safety\nGuidelines issued by\nconcerned\ngovernment\nagencies, i.e. DOLE,\nDOH, DOT, DTI\n(DOLE DO\n198s2018 policies\non OSH)\n7.1 Ability to develop\npartnerships with\nlocal guide\n7.2 Ability to tactfully\nanswer sensitive\nquestions and\nmanage sensitive\nsituation\n7.3 Ability to interpret\nitinerary inclusions\nclearly\n\n--- 