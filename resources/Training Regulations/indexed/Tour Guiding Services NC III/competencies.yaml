  "source_section_text": "Section 1.\nSuccessful candidates shall be awarded a National Certificate signed by the\nTESDA Director General.\n\n4.1.2 Assessment shall cover all competencies with basic and common integrated\nor assessed concurrently with the core units of competency.\n\n4.1.3 Any of the following are qualified to apply for assessment and certification:\n\n4.1.3.1\nGraduates\nof\nWTR-registered\nprograms,\nNTR-registered\nprograms or formal/non-formal/informal including enterprise-\nbased trainings related to TOUR GUIDING SERVICES NC III; or\n4.1.3.2\nK-12 graduates of Home Economics Strand with Tour Guiding\nServices NC II / Local Guiding Services NC II; or\n4.1.3.3\nStudents with at least two (2) years of higher education; or\n4.1.3.4\nExperienced workers (wage employed or self-employed) who\ngained competencies in TOUR GUIDING SERVICES for at least\ntwo consecutive (2) years within the last five (5) years.\n\n4.1.4 Recognition of Prior Learning (RPL). Candidates who have gained\ncompetencies through education, informal training, previous work or life\nexperiences with at least three (3) years of tour guiding services experience\nwithin the last five (5) years may apply for recognition in this Qualification\nthrough Portfolio Assessment.\n\nRequirements and implementation procedure of Portfolio Assessment must\nbe consistent with TESDA Circular No. 47, series of 2018 on “Implementing\nGuidelines on the Implementation of Portfolio Assessment Leading to\nRecognition of Prior Learning (RPL) within the TESDA Assessment and\nCertification System”.\n\n4.1.5 The guidelines on assessment and certification are discussed in detail in the\n“Procedures Manual on Assessment and Certification” and “Guidelines on\nthe Implementation of the “Philippine TVET Competency Assessment and\nCertification System (PTCACS)”.\n\n--- PDF PAGE 126 ---\nTour Guiding Services NC III-TRSTGS321 Promulgated (09/14/2021) 122\n4.2 Competency Assessment Requisite\n4.2.1 Self-Assessment\nGuide.\nThe\nself-assessment\nguide\n(SAG)\nis\naccomplished by the candidate prior to actual competency assessment.\nSAG is a pre-assessment tool to help the candidate and the assessor\ndetermine what evidence is available, where gaps exist, including\nreadiness for assessment.\n\n This document can:\na. Identify the candidate’s skills and knowledge\nb. Highlight gaps in candidate’s skills and knowledge\nc. Provide critical guidance to the assessor and candidate on the evidence\nthat need to be presented\nd. Assist the candidate to identify key areas in which practice is needed or\nadditional information or skills that should be gained prior `\n4.2.2 Accredited Assessment Center. Only Assessment Center accredited by\nTESDA is authorized to conduct competency assessment. Assessment\ncenters undergo a quality assured procedure for accreditation before they\nare authorized by TESDA to manage the assessment for National\nCertification.\n4.2.3 Accredited Competency Assessor. Only accredited competency\nassessor is authorized to conduct assessment of competence.\nCompetency assessors undergo a quality assured system of accreditation\nprocedure before they are authorized by TESDA to assess the\ncompetencies of candidates for National Certification.\n\n--- PDF PAGE 127 ---\nTour Guiding Services NC III-TRSTGS321 Promulgated (09/14/2021) 123\n\nLead\nworkplace\ncommunication\nLead small\nteams\nApply critical\nthinking and\nproblem-solving\ntechniques in\nthe workplace\n\nWork in a\ndiverse\nenvironment\nPropose\nmethods of\napplying\nlearning and\ninnovation in\nthe\norganization\nUse\ninformation\nsystematically\nEvaluate\noccupational\nsafety and\nhealth work\npractices\n\nEvaluate\nenvironmental\nwork\npractices\n\nFacilitate\nentrepreneurial\nskills for micro-\nsmall-medium\nenterprises\n(MSMEs)\n\nReceive and\nrespond to\nworkplace\ncommunication\nWork with\nothers\nSolve/address\nroutine\nproblems\nEnhance\nself-\nmanagement\nskills\nSupport\nInnovation\nAccess and\nmaintain\ninformation\nFollow\noccupational\nsafety and\nhealth policies\nand procedures\nApply\nenvironmental\nwork\nstandards\nAdopt\nentrepreneurial\nmindset in the\nworkplace\nParticipate in\nworkplace\ncommunication\nWork in\nTeam\nEnvironme\nnt\nSolve/address\ngeneral\nworkplace\nproblems\nDevelop\ncareer and\nlife decisions\nContribute to\nworkplace\ninnovation\nPresent\nrelevant\ninformation\nPractice\noccupational\nsafety and\nhealth policies\nand procedures\nExercise\nefficient and\neffective\nsustainable\npractices in\nthe workplace\nPractice\nentrepreneurial\nskills in the\nworkplace\nUtilize\nspecialize\nspecialized\ncommunication\nskill\nDevelop\nand lead\nteams\nPerform higher\norder thinking\nprocesses and\napply\ntechniques in\nthe workplace\nContribute to\nthe practice\nof social\njustice in the\nworkplace\nManage\ninnovative\nwork\ninstructions\nManage\nevaluate\nusage of\ninformation\nLead in\nimprovement of\nOccupational\nSafety and\nHealth\nProgram,\nPolicies and\nProcedures\nLead towards\nimprovement\nof\nenvironmental\nwork\nprograms,\npolicies and\nprocedures\nSustain\nentrepreneurial\nskills\nManage and\nsustain\neffective\ncommunication\nstrategies\nManage\nand\nsustain\nhigh\nperforming\nteams\nEvaluate higher\norder thinking\nskills and adjust\nproblem solving\nAdvocate\nstrategic\nthinking for\nglobal\ncitizenship\nIncorporate\ninnovation into\nwork\nprocedures\nDevelop\nsystems in\nmanaging,\nand\nmaintaining\ninformation\nManage\nImplementation\nof OSH\nprograms in the\nworkplace\nManage\nimplementation\nof\nenvironmental\nprogram in the\nworkplace\nDevelop and\nsustain a high-\nperforming\nenterprise\nBASIC\nCOMPETENCIES\nCOMPETENCY MAP TOURISM SECTOR\n(Travel and Tour)\n TOUR GUIDING SERVICES NC III\n\n--- PDF PAGE 128 ---\nTour Guiding Services NC III-TRSTGS321 Promulgated (09/14/2021) 124\n\nReceive and\nresolve\ncustomer\ncomplaints\nWork\ncooperatively\nin a general\nadministration\nenvironment\nMaintain\nquality\ncustomer/\nguest service\n\nRoster staff\nControl and\nOrder stock*\nPrepare and\ndeliver\ntraining\nsessions\nPlan, conduct\nand evaluate\nstaff\nperformance\nassessment\n\nMaintain\nhospitality\nindustry\nknowledge\nPerform child\nprotection\nduties relevant\nto the tourism\nindustry\nDevelop and\nsupervise\noperational\napproaches\nManage\nquality\ncustomer\nservice\nManage\nfinances within\na budget\nPlan and\nimplement a\nseries of\ntraining\nevents\nUse the\nassessment\nsystem for\ntraining\noutcome\n\nDevelop and\nupdate tourism\nindustry\nknowledge\nDevelop\nprotective\nenvironments\nfor children in\ntourism\ndestinations\nEstablish and\nmaintain a\nbusiness\nrelationship\nGather and\npresent\nproduct\ninformation\nMaintain\nquality\ncustomer/gues\nt service\nManage and\nresolve\nconflict\nsituations\nManage\nfinancial\nperformance\nwithin a budget\nMonitor and\nevaluate the\neffectiveness\nof training\noutcome\nEvaluate the\neffectiveness\nof\nassessment\nsystem\n\nCOMMON COMPETENCIES\n\n--- PDF PAGE 129 ---\nTour Guiding Services NC III-TRSTGS321 Promulgated (09/14/2021) 125\n\nInterpret and respond\nto request for\nindividual/\nindependent tour\nservices\nDesign and develop a\ntour package itinerary\nDetermine tour package\ncost and selling price\nOperate technology-based\ninformation system\n\nProvide information and\nadvice on a destination,\nproduct or service\n\nPromote\ntourism\nproducts and services\n\nResearch information\nrelevant to\n locality and tour Itinerary\n\nCoordinate tour\narrangements for clients\n\nAccompany and guide\nclients in accordance with\nthe tour itinerary\n\nAccompany and guide\nclients in accordance with\nthe tour itinerary\n\nReceive and process\nreservations\n\nOperate computerized\nreservations system\n\nProvide accommodation\nreception\nConduct night audit\n\nProvide club reception\nservices\n\nProvide porter\nservices\n\nPlan and develop event\nproposal and bid\n\nDevelop an event concept\n\nDevelop event program\n\nSelect event venue and\nsite\n\nDevelop and update\nevent industry\nProvide on-site event\nmanagement\nManage contractors for\nindoor events\n\nDevelop and update\nknowledge on\nProvide on-site information\nand assistance\n\nMonitor entry to venue\n\nProvide a site briefing or\nscripted\nOperate a ride location\n\nLoad and unload a ride\n\nMaintain safety in water-\nbased rides\n\nOperate a games\nlocation\n\nPromote at a games\nlocation\n\nOperate animal enclosure\nexhibit\n\nProvide general animal\ncare\n\nRescue animals\n\nResearch information\nrelevant to the\ndestination and tour\nitinerary\nOversee regional tour\narrangements for clients\n\nGuide and escort clients in\naccordance with the tour\nitinerary\n\nCORE COMPETENCIES\n\n--- PDF PAGE 130 ---\nTour Guiding Services NC III-TRSTGS321 Promulgated (09/14/2021) 126\nGLOSSARY OF TERMS\n\n1. COSTING SHEET\nan enterprise generated spread sheet that details\nthe per person cost of the components of a tour\npackage and reflect the total cost, mark-up and\ntaxes due\n\n2. DOT\nDepartment of Tourism\n\n3. GATEWAY\nentry/exit point of a destination\n\n4. INTERNET\nelectronic information distribution system\n\n5. ITINERARY\na schedule of products, services and activities\narranged in a chronological order\n\n6. ITINERARY – SKELETAL\na general day-to-day schedule of products,\nservices and activities arranged in a\nchronological order\n\n7. ITINERARY – TECHNICAL\na specific schedule detailing transportation\nmodes, times, location and duration of products,\nservices and activities arranged in a\nchronological order\n\n8. LGU\nLocal Government Unit\n\n9. MARK UP\na percentage of tour costs or fixed amount that is\nadded to the tour costs and reflects the profit of\nthe enterprise\n\n10. PRICE\nthe sum total amount to be collected from the\nclient on a per person basis that comprises the\ntour cost, mark-up, and government taxes\n\n11. REGULAR PACKAGE\nA tour package assembled based on the interests\nof target market\n12. RESERVATION\nrefers to an advance request for a product or\nservice\n\n13. SUPPLIER\nrefers\nto\nhotels,\nrestaurants,\nresorts,\ntransportation operators and other entities that\nsupplies and accommodates travelers/tourists\n\n14. TOUR COSTS\nthe sum total of all cost per person based on tour\ncomponents included in the tour package; it\nrepresents all payments due to suppliers\n\n15. TOUR COORDINATOR\nan enterprise employee who assist the tour guide\nand the travelers on arrival, during and on\ndeparture for all scheduled activities in the\nitinerary\n\n--- PDF PAGE 131 ---\nTour Guiding Services NC III-TRSTGS321 Promulgated (09/14/2021) 127\n16. TOUR GUIDE\nan individual duly trained and licensed by the\nLGU and accredited by the DOT who guides,\nescorts, and manages local or foreign travelers to\nseveral destination/s, provides information and\noversees the delivery of the tour components by\nthe different suppliers\n17. TOUR OPERATOR\nis an entity that assembles and is responsible for\nthe delivery of the various tour package\ncomponents for commercial or other purposes.\n18. OPTIONAL TOURS\nTour activities that are not included in the basic\ntour package\n19. PRODUCTIVITY\nefficient delivery of tour guiding competencies\n20. RESEARCH\nGathering data and or updating information that is\nrelevant to the tour itinerary or destination\n21. FILIPINO BRAND OF\nSERVICE\nEffective application of Filipino hospitality as\nexpressed on the oral or gestural and spiels\n22. VISITOR\nA local or foreign traveler taking a trip to a\ndestination/s outside his usual environment for\nless than year for any reason (business, leisure\nor any other purpose)\n23. TOUR LEADER\nA member of the group who manages the tour\nfrom the origin point to the destination(s) and\nback\n24. LOCAL GUIDE\nan individual duly trained and licensed by the\nLGU who accompanies and guides local or\nforeign travelers within a site or destination,\nprovides information and oversees the delivery of\ntour components\n\n--- PDF PAGE 132 ---\nTour Guiding Services NC III-TRSTGS321 Promulgated (09/14/2021) 128\nREFERENCES:\n\n1.\nTraining Regulations for Tour Guiding Services NC II\n2.\nTraining Regulations for Local Guiding Services NC II\n3.\nCBC for Local Guiding Services NC II\n\n--- PDF PAGE 133 ---\nTour Guiding Services NC III-TRSTGS321 Promulgated (09/14/2021) 129\nACKNOWLEDGMENTS\n\nThe Technical Education and Skills Development Authority (TESDA) wishes to extend\nthanks and appreciation to the many representatives of business, industry, academe and\ngovernment agencies who donated their time and expertise to the development and\nvalidation of these Training Regulations.\n\nTECHNICAL EXPERTS REVIEW PANEL\n\nBIENVENIDO G. CLARAVALL\nFormer Faculty\nUniversity of the Philippines – Asian Institute\nof Tourism\nASEAN Master Assessor\n\nMARISSA COS ALCANTARA\nPresident\nPirkko & Troytours, Inc.\nASEAN Master Trainer\n\nMARIA LUISA Q. GOMEZ\nManaging Director\nAMG Global Travel and Tours\nASEAN Master Assessor\n\nALBERTO B. GADIA, JR.\nPresident\nPhilippine Federation of Professional Tour\nGuide Associations Inc. (TGFED)\n\nLORNA B. MAROLLANO\nPhilippine Federation of Professional Tour\nGuide Associations Inc. (TGFED)\n\n--- PDF PAGE 134 ---\nTour Guiding Services NC III-TRSTGS321 Promulgated (09/14/2021) 130\n\nThe Participants in the Validation of these Training Regulations\n\nDavid John D. Apigo\nPolytechnic University of the Philippines\n\nJess Odilon Agbisit\nRajah Travel Corp.\nJaime Barrientos\nTGFED\n\nEllaine Marie Gamier\nJP Fourseasons Travel and Tours\nSylvia P. Goloyugo\nTGFED\n\nJay Lester Hernandez\nTGFED\nNestor Logmao, Jr.\nCygnal Travel & Tours Co.\nTessie Grail F. Lomas-e\nBlistt Tour Guides, Inc.\n\nDanica Mayen Nario\nLakbay Kabayan Tours & Travel Services\n\nAlma M. Ronquillo\nASM Travel and Tours Services\nMa. Dolores Salamanca\nOLFU, Quezon City\n\nStella Marie M. Salvacion\nMY Journey Travel & Tour\nArjun Shroff\nShroff Travel\nNoriel P. Pili, Jr.\nEC Minds T