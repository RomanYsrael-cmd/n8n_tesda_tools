        "source_text": "--- PDF PAGE 69 ---\nTour Guiding Services NC III-TRSTGS321     Promulgated  (09/14/2021)                                           65 \n  \nCORE COMPETENCIES \n \nUNIT OF COMPETENCY : \nRESEARCH INFORMATION RELEVANT TO THE  DESTINATION \nAND TOUR ITINERARY   \n \nUNIT CODE \n: \nTRS511307 \n \nUNIT DESCRIPTOR \n:  This unit covers the knowledge, skills and attitude required to  \naccess and research information about a regional destinations for \ndeveloping and completing the itinerary of a tour package.  \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range of \nVariables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Source \ninformation \n1.1 Research sources \nand appropriate \nmethodologies are \nselected based on \nthe types of \ninformation sought \n1.2 Essential \ninformation on the \nregional \ndestinations  are \nidentified \n1.3 Sites, sensory \nexperiences, events \nand features of the \nregion are identified \nin consultation with \nother tour guides, \ncolleagues and \ncompany officials \n1.4 Sites and sensory \nexperiences are \nassessed for client \nsuitability  \n \n1.1 Standard procedure \nin gathering \ninformation about \nspecific \nsites/attractions/ \nactivities/ \naccessibility/ \naccommodation/ \namenities \n1.2 Definition and \nattributes of a tour \nguide \n1.3 Types of information  \n1.4 Sourced information \nfor visitors’ suitability \nand interests \n1.5 Sensory experiences \n1.6  Local regulations \nand their impact on \nthe tour itinerary  \n1.7 Industry practices \nrelevant to sites and \nsights \n1.8 Knowledge of the  \nclients’ interest in \nrelation to the tour \nitinerary \n1.9 Industry practices in \nthe packaging of tour \nproducts as \nappropriate to \ndifferent sectors \n1.10 Tour spiel formats \n1.1 Gathering information \n1.2 Assessing the \nSources of \ninformation  \n1.3 Assessing information  \n1.4 Matching sourced \ninformation for \nvisitors’ suitability and \ninterests \n1.5 Use of electronic \nresources for \nresearch \n1.6 Communication skills \n \n,\n\n--- PDF PAGE 70 ---\nTour Guiding Services NC III-TRSTGS321     Promulgated  (09/14/2021)                                           66 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range of \nVariables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1.11 Research \nmethodology \n \n2. Arrange and file \ninformation \n2.1 Multiple topic \ncomponents to \ncreate maximum \nvalue and interest \nare combined and \nintegrated. \n2.2 Researched \ninformation is \nclassified and filed \nin a logical and \nsystematic manner. \n2.3 Company officials \nare informed of \nchanges in costs of \ntour components. \n2.4 Revised cost \nstructures to include \nfull details of all \nchanges, inclusions, \nexclusions and add-\nons are presented to \ncompany officials. \n2.5 Changes in response \nto feedback from \nvisitors and \ncolleagues are \nreviewed and \nadjusted. \n2.6 Legal requirements \nare checked and \nincorporated in the \nfiles based on \nnational and local \nstatutes. \n2.1 Sourced information \nresponsibly \n2.2 Tourism support \nservices \n2.3 Types of filing \nsystems   \n2.4 Change of cost \ncomponents  \n2.5 Feedback from \nvisitors and \ncolleagues \n2.6 Legal requirements  \n2.7 Local regulations \nand their impact on \nthe tour itinerary  \n2.8 Knowledge of the  \nclients’ interest in \nrelation to the tour \nitinerary \n2.9 Industry practices in \nthe packaging of tour \nproducts as \nappropriate to \ndifferent sectors \n \n \n2.1 Classifying sourced \ninformation \n2.2 Preparing feedback \nreport \n2.3 Use of electronic \nresources for \nresearch \n2.4 Communication \nskills\n\n--- PDF PAGE 71 ---\nTour Guiding Services NC III-TRSTGS321     Promulgated  (09/14/2021)                                           67 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range of \nVariables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n3. Develop tour \nscripts and \ncommentaries \nrelevant to the \ntour itinerary \nand/or the \ninterest of the \nclients \n \n3.1 Tour spiels are \ndeveloped in \naccordance with \nrequirements of \nspecific tour \nitineraries or \nspecific clients  \n3.2 Appropriate \ncommentary and tour \nspiels are prepared \nbased on the research \nconducted. \n3.3 On a case-to-case \nbasis, tour scripts are \ntailored-fit to the \ninterest of the clients. \n3.4 Commentary and tour \nscripts are made \nacceptable to visitor \nwithout political or \nreligious attachments \nare developed. \n3.5 Tour script and \nitineraries are \npresented to \nappropriate authorities \nfor approval prior to \nimplementation. \n \n3.1 Role of tour guide \n3.2 Develop oral \npresentation \n3.3 Oral presentation \ndelivery \n3.4 High sensory \nexperiences \n3.5 Tour script \npreparation \n3.6 Local regulations \nand their impact on \nthe tour itinerary  \n3.7 Industry practices \nrelevant to sites and \nsights \n3.8 Knowledge of the  \nclients’ interest in \nrelation to the tour \nitinerary \n3.9 Industry practices in \nthe packaging of tour \nproducts as \nappropriate to \ndifferent sectors \n \n \n3.1 Developing oral \npresentation \n3.2 Selling optional \ntours script  \n3.3 Identifying high \nsensory \nexperiences \n3.4 Use of electronic \nresources for \nresearch \n3.5 Communication \nskills \n3.6 Spiel \nconstructions \nsequencing and \ndevelopment \nskills\n\n--- PDF PAGE 72 ---\nTour Guiding Services NC III-TRSTGS321     Promulgated  (09/14/2021)                                           68 \nRANGE OF VARIABLES \n \nVARIABLE \nRange \n1. \nAppropriate \nmethodologies \nMay include: \n1.1 Desk research \n1.2 Personal contact with tourism authorities \n1.3 Product suppliers \n1.4 Distribution networks \n1.5 Ocular inspections and sharing of information with industry \ncolleagues \n2. \nTypes of information \nMay include: \n2.1 Basic/essential \n2.2 Tourism highlights \n2.3 Support services \n3. \nEssential information on \nthe regional destinations \nMay include: \n3.1 Climate and geography – location and major geo-physical \nfeatures; weather patterns of the locality; extreme weather \nrisk conditions and seasons \n3.2 Environment, flora and fauna – an overview of native flora \nand fauna and their characteristics; major natural \nattractions and the key features in the locality; the natural \nenvironment as a tourism asset: including environmental \nconcerns such as climate change, laws on protection and  \nconservation of the natural environment \n3.3 History – overview of Philippine history and the history of \nthe region – main events, dates, characters and structures  \n3.4 Philippines and regional Indigenous Culture – art, theatre, \nmusic and literature – key performer, writers and artists; \nmajor works by the Filipinos and major cultural events;  \nincluding preservation of tangible and intangible cultural \nheritage of indigenous people \n3.5 Architecture – major styles and their proponents; Key \ncultural structures in the locality.   \n3.6 Religion and Education – religious make-up Filipino \nsociety; religious beliefs, practices and events in the \nlocality; K-12. Filipino as the national language; English as \na second language.  Local languages \n3.7 Government and governance – political units of \ngovernance; political parties, major political figures, \ncurrent political issues, laws and ordinances \n3.8 Transportation and other services – mainstream modes of \ntransport in the locality and the Philippines; other support:  \nbanking services, communications, health, sanitation \n3.9 Economy – key elements: agriculture, trade and industry.   \nMajor local and Philippine products;  current issues of the \neconomy; science and technology: key inventions or \ndiscoveries including sustainable practices\n\n--- PDF PAGE 73 ---\nTour Guiding Services NC III-TRSTGS321     Promulgated  (09/14/2021)                                  