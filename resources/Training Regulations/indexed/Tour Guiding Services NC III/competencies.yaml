        "required_skills": [
          "1. Examine specific workplace challenges. 1.1 Variances are examined from normal operating parameters; and product quality. 1.2 Extent, cause and nature of the specific problem are defined through observation, investigation and analytical techniques. 1.3 Problems are clearly stated and specified. 1.1 Competence includes a thorough knowledge and understanding of the process, normal operating parameters, and product quality to recognize non- standard situations. 1.2 Competence to include the ability to apply and explain, enough for the identification of fundamental causes of specific workplace challenges. 1.3 Relevant equipment and operational processes. 1.4 Enterprise goals, targets and measures. 1.5 Enterprise quality OHS and environmental requirement. 1.6 Enterprise information systems and data collation 1.7 Industry codes and standards.",
