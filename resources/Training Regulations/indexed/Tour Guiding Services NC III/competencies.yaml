bles\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\nnot part of the tour\npackage\n\namenities, service,\nfacilities, highlights\nand rates\n2.10 Local/municipal\ntravel tour regulation\nand ordinances\n2.11 Accommodations,\nrestaurants,\nshopping sites and\ntourism-related\nestablishments in\nthe\nlocality/destination\n2.12\nHealth and\nSafety Guidelines\nissued by concerned\ngovernment\nagencies, i.e. DOLE,\nDOH, DOT, DTI\n(DOLE DO\n198s2018 policies\non OSH)\n2.13\nAwareness of\npersons with\ndifferent abilities\n(BP344 Accessibility\nLaw)\n\n3.\nResolve\ncomplaints\nand\nemergency\nsituations\n3.1 Resolution of\ncomplaints with\nsuppliers and other\nconcerns are given\nassistance based on\nenterprise policy with\nthe local guide.\n3.2 Emergency\nsituations are\nhandled as deemed\nnecessary and\nappropriate solutions\nare determined and\napplied.\n3.3 Government\nauthorities concerned\nare notified about the\ncrisis situation\nwhenever necessary.\n3.1 Enterprise Standard\nOperating\nProcedures for\ncomplaints and\nemergencies\n3.2 Visitor’s complaints\n3.3 Different solutions\nin resolving\ncomplaints\n3.4 Government\nagencies, required\ninformation and\ndocumentation\nneeded for\nemergency\nsituations\n3.5 Check-in and check-\nout procedures\n3.5.1 Transportation\ncompany\n3.1 Evaluating the\nvalidity of the\nvisitor’s complaint\n3.2 Seeking and\napplying suitable\nsolutions to the\nsituation in\ncooperation with the\nlocal guide\n3.3 Informing\ngovernment\nauthorities as and\nwhen necessary\n3.4 Documenting and\nreporting the\ncomplaints\n3.5 Communication\nskills\n\n--- PDF PAGE 78 ---\nTour Guiding Services NC III-TRSTGS321 Promulgated (09/14/2021) 74\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n3.4 Tour operator or tour\norganizer is notified\nabout the emergency\nsituation.\n3.5 All incidents are\ndocumented in the\nfinal report.\n\n3.5.2 Lodging\nestablishment\n3.5.3 Any other