mplaints, commendations and emergency\nsituations\n\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1\nDemonstration with Oral Questioning\n3.2\nProject and assignment work\n\n4. Context for\nAssessment\n4.1 Competency may be assessed in actual workplace or at the\n designated TESDA accredited assessment center\n4.2 Assessment shall be observed while tasks are being undertaken\n whether individually or in a group\n\n--- PDF PAGE 83 ---\nTour Guiding Services NC III-TRSTGS321 Promulgated (09/14/2021) 79\nUNIT OF COMPETENCY\n:\nGUIDE AND ESCORT VISITORS IN ACCORDANCE WITH\n THE REGIONAL TOUR ITINERARY\n\nUNIT CODE\n: TRS511309\n\nUNIT DESCRIPTOR :\nThis unit deals with the knowledge and skills required\nfor guiding and escorting visitors in a region, performing safety\npractices, resolving complaints and other emergencies.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Meet and assist\nvisitors upon\narrival at the\ndestination\n1.1 Determined the role\nand responsibilities\nof the tour guide as\nper company policies\nand procedures.\n1.2 Arrival details are\nchecked.\n1.3 Reservations of the\nitinerary are doubled-\nchecked with the local\nguide when applicable.\n1.4 Tour itinerary is\nchecked for compliance\nwith the visitors’\nrequirements.\n1.5 Meets and greets the\nvisitors at the\ndestination’s gateway.\n1.6 Visitors are properly\npositioned to give\nwelcome briefing\nbefore boarding\n(whenever possible).\n1.7 Visitors’ baggage is\nchecked and ensured\nbaggage is boarded.\n1.8 Accompanies visitors to\nthe place of lodging.\n1.9 Assistance is provided\nin the registration\nformalities at the place\nof lodging during\ncheck-in, when\napplicable.\n1.10 Visitors are reminded\nof the next activity.\n\n1.1 Role and\nresponsibilities of the\ntour guide\n1.2 Pre-arrival\nprocedures\n1.3 Procedures at the\ngateway\n1.4 Baggage handling\n1.5 Arrival transfer\nprocedures and\ncommentaries\n1.6 Hotel check-in\nformalities\n1.7 Tour guide’s code of\nethics\n1.8 General knowledge of\nthe Philippines and\nspecific knowledge of\nthe region including:\n-\nClimate\n-\nGeography and\ngeology\n-\nHistory\n-\nArchitecture\n-\nCultural events\n-\nReligion\n-\nArt, theatre,\nmusic and\nliterature\n-\nNatural\nenvironment and\ntourism\n-\nFlora and fauna\n-\nGovernment and\npolitics\n-\nTransport\n-\nAgriculture\n1.1 Ability to speak\nfluently in English\nand the local dialects\n1.2 Ability to tactfully\nanswer and handle\nsensitive question\nand situation\n1.3 Assisting visitors to\nplace of lodging\n1.4 Ability to work with\nthe local guide when\napplicable\n\n--- PDF PAGE 84 ---\nTour Guiding Services NC III-TRSTGS321 Promulgated (09/14/2021) 80\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n-\nScience and\nTechnology\n-\nSports\n-\nEconomy\n-\nTrade\n-\nFood (Local\ndishes)\n-\nLifestyle\n-\nShopping\n-\nTourism services\nand facilities\n1.9 Health and Safety\nGuidelines issued by\nconcerned\ngovernment\nagencies, i.e. DOLE,\nDOH, DOT, DTI\n(DOLE DO 198s2018\npolicies on OSH)\n1.10 Awareness of\npersons with different\nabilities (BP344\nAccessibility Law)\n\n2. Guide and escort\nvisitors while on\ntour in the region\n2.1 Ensure that\nappropriate attire are\nworn for different\nactivities or occasions.\n2.2 Personal hygiene is\nobserved and practiced\nper accepted social\nnorms.\n2.3 Tourist driver and local\nguide are briefed on\nthe pick-up points,\nroute and stop-over.\n2.4 Summary of the day’s\nactivities are provided\nto visitors\n2.5 Assistance to visitors\nare provided and\nquestions and\nconcerns are\naddressed\n2.6 Visitors’ movements\nduring stop-over and\nwalkabouts are\nmanaged or monitored\n2.1 Role of tour guide as\na time keeper,\nshepherd and giver\nof care\n2.2 Tour guide’s code of\nethics\n2.3 Tour guiding\ntechniques\n2