        "source_text": "400311325\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes\nrequired to interpret Occupational Safety and Health\npractices, set OSH work targets, and evaluate\neffectiveness of Occupational Safety and Health work\ninstructions\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Interpret\nOccupational\nSafety and\nHealth practices\n\n1.1 OSH work practices\nissues are identified\nrelevant to work\nrequirements\n1.2 OSH work standards and\nprocedures are determined\nbased on applicability to\nnature of work\n1.3 Gaps in work practices are\nidentified related to\nrelevant OSH work\nstandards\n\n1.1. OSH work\npractices issues\n1.2. OSH work\nstandards\n1.3. General OSH\nprinciples and\nlegislations\n1.4. Company/\nworkplace policies/\nguidelines\n1.5. Standards and\nsafety\nrequirements of\nwork process and\nprocedures\n\n1.1. Communication\nskills\n1.2. Interpersonal\nskills\n1.3. Critical thinking\nskills\n1.4. Observation\nskills\n2. Set OSH work\ntargets\n\n2.1 Relevant work information\nare gathered necessary to\ndetermine OSH work\ntargets\n2.2 OSH Indicators based on\ngathered information are\nagreed upon to measure\neffectiveness of workplace\nOSH policies and\nprocedures\n2.3 Agreed OSH indicators are\nendorsed for approval from\nappropriate personnel\n2.4 OSH work instructions\nare received in accordance\nwith workplace policies and\nprocedures*\n2.1. OSH work targets\n2.2. OSH Indicators\n2.3. OSH work\ninstructions\n2.4. Safety and health\nrequirements of\ntasks\n2.5. Workplace\nguidelines on\nproviding\nfeedback on OSH\nand security\nconcerns\n2.6. OSH regulations\nHazard control\nprocedures\n2.7. OSH trainings\nrelevant to work\n2.1. Communication\nskills\n2.2. Collaborating\nskills\n2.3. Critical thinking\nskills\n2.4. Observation\nskills\n\n--- PDF PAGE 37 ---\nTour Guiding Services NC III-TRSTGS321 Promulgated (09/14/2021) 33\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n3. Evaluate\neffectiveness of\nOccupational\nSafety and\nHealth work\ninstructions\n\n3.1 OSH Practices are\nobserved based on\nworkplace standards\n3.2 Observed OSH\npractices are measured\nagainst approved OSH\nmetrics\n3.3 Findings regarding\neffectiveness are\nassessed and gaps\nidentified are\nimplemented based on\nOSH work standards\n\n3.1. OSH Practices\n3.2. OSH metrics\n3.3. OSH Evaluation\nTechniques\n3.4. OSH work\nstandards\n3.1. Critical thinking\nskills\n3.2. Evaluating skills\n\n--- PDF PAGE 38 ---\nTour Guiding Services NC III-TRSTGS321 Promulgated (09/14/2021) 34\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. OSH Work\nPractices Issues\nMay include but not limited to:\n1.1\nWorkers’ experience/observance on presence of work\nhazards\n1.2\nUnsafe/unhealthy administrative arrangements (prolonged\nwork hours, no break-time, constant overtime, scheduling of\ntasks)\n1.3\nReasons for compliance/non-compliance to use of PPEs or\nother OSH procedures/policies/ guidelines\n2. OSH Indicators\nMay include but not limited to:\n2.1\nIncreased of incidents of accidents, injuries\n2.2\nIncreased occurrence of sickness or health\ncomplaints/symptoms\n2.3\nCommon complaints of workers’ related to OSH\n2.4\nHigh absenteeism for work-related reasons\n3. OSH Work\nInstructions\nMay include but not limited to:\n3.1 Preventive and control measures, and targets\n3.2 Eliminate the hazard (i.e., get rid of the dangerous machine\n3.3 Isolate the hazard (i.e. keep the machine in a closed room and\noperate it remotely; barricade an unsafe area off)\n3.4 Substitute the hazard with a safer alternative (i.e., replace the\nmachine with a safer one)\n3.5 Use administrative controls to reduce the risk (i.e. give trainings\non how to use equipment safely; OSH-related topics, issue\nwarning signages, rotation/shifting work schedule)\n3.6 Use engineering controls to reduce the risk (i.e. use safety\nguards to machine)\n3.7 Use personal protective equipment\n3.8 Safety, Health and Work Environment Evaluation\n3.9 Periodic and/or special medical examinations of workers\n4. OSH metrics\nMay include but not limited to:\n4.1 Statistics on incidence of accidence and injuries\n4.2 Morbidity (Type and Number of Sickness)\n4.3 Mortality (Cause and Number of Deaths)\n4.4 Accident Rate\n\n--- PDF PAGE 39 ---\nTour Guiding Services NC III-TRSTGS321 Promulgated (09/14/2021) 35\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\n\nAssessment requires evidence that the candidate:\n1.1. Identify OSH work practices issues relevant to work\nrequirements\n1.2. Identify gaps in work practices related to relevant OSH\nwork standards\n1.3. Agree upon OSH Indicators based on gathered\ninformation to measure effectiveness of workplace OSH\npolicies and procedures\n1.4. Receive OSH work instructions in accordance with\nworkplace policies and procedures\n1.5. Compare Observed OSH practices with against approved\nOSH work instructions\n1.6. Assess findings regarding effectiveness based on OSH\nwork standards\n2. Resource Implications\nThe following resources should be provided:\n2.1 Facilities, materials, tools and equipment necessary for\nthe activity\n3. Methods of Assessment Competency in this unit may be assessed through:\n3.1 Observation/Demonstration with oral questioning\n3.2 Third party report\n3.3 Written exam\n\n4. Context for Assessment\n4.1 Competency may be assessed in the work place or in a\nsimulated work place setting\n\n--- PDF PAGE 40 ---\nTour Guiding Services NC III-TRSTGS321 Promulgated (09/14/2021) 36\nUNIT OF COMPETENCY\n: EVALUATE ENVIRONMENTAL WORK\nPRACTICES\n\nUNIT CODE\n:"
