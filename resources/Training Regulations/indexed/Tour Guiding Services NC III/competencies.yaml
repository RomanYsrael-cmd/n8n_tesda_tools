        "source_text": "--- PDF PAGE 16 ---\nTour Guiding Services NC III-TRSTGS321     Promulgated  (09/14/2021)                                           12 \nUNIT OF COMPETENCY     : APPLY CRITICAL THINKING AND PROBLEM-   SOLVING \nTECHNIQUES IN THE WORKPLACE  \n \n    UNIT CODE \n                 :      400311321 \n \nUNIT DESCRIPTOR            : This unit covers the knowledge, skills and attitudes required to \nsolve problems in the workplace including the application of \nproblem solving techniques and to determine and resolve the \nroot cause/s of specific problems in the workplace. \n \n \n \nELEMENTS \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \n \nREQUIRED \nKNOWLEDGE \n \nREQUIRED \nSKILLS \n1. Examine \nspecific \nworkplace \nchallenges. \n1.1 Variances are \nexamined from \nnormal operating \nparameters; and \nproduct quality. \n1.2 Extent, cause and \nnature of the \nspecific problem \nare defined \nthrough \nobservation, \ninvestigation and \nanalytical \ntechniques. \n1.3  Problems are \nclearly stated and \nspecified. \n1.1  Competence includes \na thorough \nknowledge and \nunderstanding of the \nprocess, normal \noperating \nparameters, and \nproduct quality to \nrecognize non-\nstandard situations. \n1.2  Competence to \ninclude the ability to \napply and explain, \nenough for the \nidentification of \nfundamental causes \nof specific \nworkplace \nchallenges. \n1.3   Relevant equipment \nand operational \nprocesses. \n1.4   Enterprise goals, \ntargets and \nmeasures. \n1.5   Enterprise quality \nOHS and \nenvironmental \nrequirement. \n1.6   Enterprise \ninformation systems \nand data collation \n1.7  Industry codes and \nstandards. \n \n1.1 Using range of \nanalytical techniques \n(e.g., planning, \nattention, \nsimultaneous and \nsuccessive \nprocessing of \ninformation) in \nexamining specific \nchallenges in the \nworkplace. \n1.2 Identifying extent \nand causes of \nspecific challenges in \nthe workplace.\n\n--- PDF PAGE 17 ---\nTour Guiding Services NC III-TRSTGS321     Promulgated  (09/14/2021)                                           13 \n \n \nELEMENTS \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \n \nREQUIRED \nKNOWLEDGE \n \nREQUIRED \nSKILLS \n2. Analyze the \ncauses of \nspecific \nworkplace \nchallenges. \n2.1  Possible causes of \nspecific problems \nare identified \nbased on \nexperience and \nthe use of \nproblem solving \ntools / analytical \ntechniques. \n2.2  Possible cause \nstatements are \ndeveloped based \non findings. \n2.3  Fundamental \ncauses are \nidentified per \nresults of \ninvestigation \nconducted. \n2.1  Competence \nincludes a thorough \nknowledge and \nunderstanding of \nthe process, normal \noperating \nparameters, and \nproduct quality to \nrecognize non-\nstandard situations. \n2.2  Competence to \ninclude the ability to \napply and explain, \nsufficient for the \nidentification of \nfundamental cause, \ndetermining the \ncorrective action \nand provision of \nrecommendations. \n2.3   Relevant equipment \nand operational \nprocesses. \n2.4   Enterprise goals, \ntargets and \nmeasures. \n2.5   Enterprise quality \nOSH and \nenvironmental \nrequirement. \n2.6   Enterprise \ninformation systems \nand data collation. \n2.7  Industry codes and \nstandards. \n2.1 Using range of \nanalytical techniques \n(e.g., planning, \nattention, \nsimultaneous and \nsuccessive \nprocessing of \ninformation) in \nexamining specific \nchallenges in the \nworkplace. \n2.2 Identifying extent \nand causes of \nspecific challenges \nin the workplace. \n2.3 Providing clear-cut \nfindings on the \nnature of each \nidentified workplace \nchallenges.\n\n--- PDF PAGE 18 ---\nTour Guiding Services NC III-TRSTGS321     Promulgated  (09/14/2021)                                           14 \n \n \nELEMENTS \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \n \nREQUIRED \nKNOWLEDGE \n \nREQUIRED \nSKILLS \n3. Formulate \nresolutions \nto specific \nworkplace \nchallenges. \n3.1  All possible options \nare considered for \nresolution of the \nproblem. \n3.2 Strengths and \nweaknesses of \npossible options \nare considered. \n3.3 Corrective actions \nare determined to \nresolve the \nproblem and \npossible future \ncauses. \n3.4 Action plans are \ndeveloped \nidentifying \nmeasurable \nobjectives, \nresource needs \nand timelines in \naccordance with \nsafety and \noperating \nprocedures \n3.1 Competence to \ninclude the ability \nto apply and \nexplain, sufficient \nfor the identification \nof fundamental \ncause, determining \nthe corrective \naction and \nprovision of \nrecommendations \n3.2Relevant equipment \nand operational \nprocesses \n3.3 Enterprise goals, \ntargets and \nmeasures \n3.4 Enterprise quality \nOSH and \nenvironmental \nrequirement \n3.5 Principles of \ndecision making \nstrategies and \ntechniques \n3.6 Enterprise \ninformation \nsystems and data \ncollation \n3.7 Industry codes and \nstandards \n3.1 Using range of \nanalytical \ntechniques (e.g., \nplanning, \nattention, \nsimultaneous \nand successive \nprocessing of \ninformation) in \nexamining \nspecific \nchallenges in the \nworkplace. \n3.2 Identifying extent \nand causes of \nspecific \nchallenges in the \nworkplace. \n3.3 Providing clear-\ncut findings on \nthe nature of \neach identified \nworkplace \nchallenges. \n3.4 Devising, \ncommunicating, \nimplementing \nand evaluating \nstrategies and \ntechniques in \naddressing \nspecific \nworkplace \nchallenges.\n\n--- PDF PAGE 19 ---\nTour Guiding Services NC III-TRSTGS321     Promulgated  (09/14/2021)                                           15 \n \n \nELEMENTS \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \n \nREQUIRED \nKNOWLEDGE \n \nREQUIRED \nSKILLS \n4. Implement \naction plans \nand \ncommunicate \nresults. \n4.1 Action plans are \nimplemented and \nevaluated. \n4.2 Results of plan \nimplementation and \nrecommendations \nare prepared. \n4.2 Recommendations \nare presented to \nappropriate \npersonnel. \n4.3 Recommendations \nare followed-up, if \nrequired. \n4.1  Competence to \ninclude the ability \nto apply and \nexplain, sufficient \nfor the identification \nof fundamental \ncause, determining \nthe corrective \naction and \nprovision of \nrecommendations \n4.2. Relevant \nequipment and \noperational \nprocesses \n4.3  Enterprise goals, \ntargets and \nmeasures \n4.4  Enterprise quality, \nOSH and \nenvironmental \nrequirement \n4.5  Principles of \ndecision making \nstrategies and \ntechniques \n4.6  Enterprise \ninformation \nsystems and data \ncollation \n4.7  Industry codes and \nstandards \n4.1 Using range of \nanalytical \ntechniques \n(e.g., planning, \nattention, \nsimultaneous \nand successive \nprocessing of \ninformation) in \nexamining \nspecific \nchallenges in \nthe workplace. \n4.2 Identifying \nextent and \ncauses of \nspecific \nchallenges in \nthe workplace. \n4.3 Providing clear-\ncut findings on \nthe nature of \neach identified \nworkplace \nchallenges. \n4.4 Devising, \ncommunicating, \nimplementing \nand evaluating \nstrategies and \ntechniques in \naddressing \nspecific \nworkplace \nchallenges.\n\n--- PDF PAGE 20 ---\nTour Guiding Services NC III-TRSTGS321     Promulgated  (09/14/2021)                                           16 \n   RANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Parameters \nMay include: \n1.1 Processes \n1.2 Procedures \n1.3 Systems \n2. Analytical techniques \nMay include: \n2.1. Brainstorming \n2.2. Intuitions/Logic \n2.3. Cause and effect diagrams \n2.4. Pareto analysis \n2.5. SWOT analysis \n2.6. Gant chart, Pert CPM and graphs \n2.7. Scattergrams  \n3. Problem \n \nMay include: \n3.1. Routine, non – routine and complex workplace and \nquality problems \n3.2. Equipment selection, availability and failure \n3.3. Teamwork and work allocation problem \n3.4. Safety and emergency situations and incidents \n3.5. Risk assessment and management \n4. Action plans  \n \nMay include: \n4.1. Priority requirements \n4.2. Measurable objectives \n4.3. Resource requirements \n4.4. Timelines \n4.5. Co-ordination and feedback requirements \n4.6. Safety requirements \n4.7. Risk assessment \n4.8. \nEnvironmental requirements\n\n--- PDF PAGE 21 ---\nTour Guiding Services NC III-TRSTGS321     Promulgated  (09/14/2021)                                           17 \nEVIDENCE GUIDE \n \n1. Critical aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1. \nExamined specific workplace challenges. \n1.2. \nAnalyzed the causes of specific workplace challenges. \n1.3. \nFormulated resolutions to specific workplace challenges. \n1.4. \nImplemented action plans and communicated results on \nspecific workplace challenges. \n2. Resource \nImplications \n2.1. \nAssessment will require access to an operating plant over an \nextended period of time, or a suitable method of gathering \nevidence of operating ability over a range of situations. A bank \nof scenarios / case studies / what ifs will be required as well as \nbank of questions which will be used to probe the reason behind \nthe observable action.  \n3. Methods of \nAssessment \nCompetency in this unit may be assessed through: \n3.1. \nObservation \n3.2. \nCase Formulation \n3.3. \nLife Narrative Inquiry \n3.4. \nStandardized test \nThe unit will be assessed in a holistic manner as is practical and may \nbe integrated with the assessment of other relevant units of \ncompetency. Assessment will occur over a range of situations, which \nwill include disruptions to normal, smooth operation. Simulation may be \nrequired to allow for timely assessment of parts of this unit of \ncompetency. Simulation should be based on the actual workplace and \nwill include walk through of the relevant competency components.  \n \nThese assessment activities should include a range of problems, \nincluding new, unusual and improbable situations that may have \nhappened. \n4. Context for \nAssessment \nIn all workplace, it may be appropriate to assess this unit concurrently \nwith relevant teamwork or operation units.\n",
