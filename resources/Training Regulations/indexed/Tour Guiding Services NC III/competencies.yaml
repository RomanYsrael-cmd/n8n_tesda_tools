  "source_section_text": "SECTION 2\nCOMPETENCY STANDARDS\n\nThis section details the contents of the basic, common and core units of competency required in\nTOUR GUIDING SERVICES NC III.\n\nBASIC COMPETENCIES\n\nUNIT OF COMPETENCY : LEAD WORKPLACE COMMUNICATION\n\nUNIT CODE\n : 400311319\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes required to\nlead in the effective dissemination and discussion of ideas,\ninformation, and issues in the workplace. This includes\npreparation of written communication materials.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Communicate\ninformation\nabout\nworkplace\nprocesses\n1.1 Relevant\ncommunication method\nis selected based on\nworkplace procedures\n1.2 Multiple operations\ninvolving several\ntopics/areas are\ncommunicated following\nenterprise requirements\n1.3 Questioning is applied to\ngain extra information\n1.4 Relevant sources of\ninformation are identified\nin accordance with\nworkplace/ client\nrequirements\n1.5 Information is selected and\norganized following\nenterprise procedures\n1.6 Verbal and written\nreporting is undertaken\nwhen required\n1.7 Communication and\nnegotiation skills are\napplied and maintained in\nall relevant situations\n1.1. Organization\nrequirements\nfor written and\nelectronic\ncommunicatio\nn methods\n1.2. Effective\nverbal\ncommunicatio\nn methods\n1.3. Business\nwriting\n1.4. Workplace\netiquette\n1.1 Organizing\ninformation\n1.2 Conveying\nintended meaning\n1.3 Participating in a\nvariety of workplace\ndiscussions\n1.4 Complying with\norganization\nrequirements for the\nuse of written and\nelectronic\ncommunication\nmethods\n1.5 Effective business\nwriting\n1.6 Effective clarifying\nand probing skills\n1.7 Effective\nquestioning\ntechniques\n(clarifying and\nprobing)\n\n--- PDF PAGE 8 ---\nTour Guiding Services NC III-TRSTGS321 Promulgated (09/14/2021) 4\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n2. Lead\nworkplace\ndiscussions\n2.1 Response to workplace\nissues are sought\nfollowing enterprise\nprocedures\n2.2 Response to workplace\nissues are provided\nimmediately\n2.3 Constructive contributions\nare made to workplace\ndiscussions on such\nissues as production,\nquality and safety\n2.4 Goals/ objectives and\naction plans undertaken\nin the workplace are\ncommunicated promptly\n2.1 Organization\nrequirements for\nwritten and\nelectronic\ncommunication\nmethods\n2.2 Effective\nverbal\ncommunication\nmethods\n2.3 Workplace\netiquette\n2.1 Organizing\ninformation\n2.2 Conveying\nintended meaning\n2.3 Participating in\nvariety of\nworkplace\ndiscussions\n2.4 Complying with\norganization\nrequirements for\nthe use of written\nand electronic\ncommunication\nmethods\n2.5 Effective clarifying\nand probing skills\n\n3. Identify and\ncommunicat\ne issues\narising in the\nworkplace\n3.1 Issues and problems are\nidentified as they arise\n3.2 Information regarding\nproblems and issues are\norganized coherently to\nensure clear and effective\ncommunication\n3.3 Dialogue is initiated with\nappropriate personnel\n3.4 Communication problems\nand issues are raised as\nthey arise\n3.5 Identify barriers in\ncommunication to be\naddressed appropriately\n\n3.1 Organization\nrequirements for\nwritten and\nelectronic\ncommunication\nmethods\n3.2 Effective verbal\ncommunication\nmethods\n3.3 Workplace\netiquette\n3.4 Communication\nproblems and\nissues\n3.5 Barriers in\ncommunication\n\n3.1 Organizing\ninformation\n3.2 Conveying intended\nmeaning\n3.3 Participating in a\nvariety of workplace\ndiscussions\n3.4 Complying with\norganization\nrequirements for\nthe use of written\nand electronic\ncommunication\nmethods\n3.5 Effective clarifying\nand probing skills\n3.6 Identifying issues\n3.7 Negotiation and\ncommunication\nskills\n\n--- PDF PAGE 9 ---\nTour Guiding Services NC III-TRSTGS321 Promulgated (09/14/2021) 5\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Methods of\ncommunication\nMay include but not limited to:\n1.1. Non-verbal gestures\n1.2. Verbal\n1.3. Face-to-face\n1.4. Two-way radio\n1.5. Speaking to groups\n1.6. Using telephone\n1.7. Written\n1.8. Internet\n2. Workplace discussions\nMay include but not limited to:\n2.1. Coordination meetings\n2.2. Toolbox discussion\n2.3. Peer-to-peer discussion\n\n--- PDF PAGE 10 ---\nTour Guiding Services NC III-TRSTGS321 Promulgated (09/14/2021) 6\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Dealt with a range of communication/information at one\ntime\n1.2 Demonstrated leadership skills in workplace\ncommunication\n1.3 Made constructive contributions in workplace issues\n1.4 Sought workplace issues effectively\n1.5 Responded to workplace issues promptly\n1.6 Presented information clearly and effectively written\nform\n1.7 Used appropriate sources of information\n1.8 Asked appropriate questions\n1.9 Provided accurate information\n2. Resource\nImplications\nThe following resources should be provided:\n2.1 Variety of Information\n2.2 Communication tools\n2.3 Simulated workplace\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\nCase problem\n3.1. Third-party report\n3.2. Portfolio\n3.3. Interview\n3.4. Demonstration/Role-playing\n4. Context for\nAssessment\n4.1. Competency may be assessed in the workplace or in a\nsimulated workplace environment\n\n--- PDF PAGE 11 ---\nTour Guiding Services NC III-TRSTGS321 Promulgated (09/14/2021) 7\nUNIT OF COMPETENCY\n\n:\nLEAD SMALL TEAMS\n\nUNIT CODE\n\n:\n400311320\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and\n\nattitudes to lead small teams including setting,\n\nmaintaining and monitoring team and individual\n\nperformance standards.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Provide team\nleadership\n1.1 Work\nrequirements are\nidentified and\npresented to team\nmembers based on\ncompany policies\nand procedures\n1.2 Reasons for\ninstructions and\nrequirements are\ncommunicated to\nteam members\nbased on company\npolicies and\nprocedures\n1.3 Team members’\nand leaders’\nconcerns are\nrecognized,\ndiscussed and\ndealt with based on\ncompany practices\n1.1 Facilitation of\nTeam work\n1.2 Company policies\nand procedures\nrelating to work\nperformance\n1.3 Performance\nstandards and\nexpectations\n1.4 Monitoring\nindividual’s and\nteam’s\nperformance vis a\nvis client’s and\ngroup’s\nexpectations\n1.1 Communication\nskills required for\nleading teams\n1.2 Group facilitation\nskills\n1.3 Negotiating skills\n1.4 Setting performance\nexpectation\n2. Assign\nresponsibilities\n2.1. Responsibilities are\nallocated having\nregard to the skills,\nknowledge and\naptitude required to\nundertake the\nassigned task\nbased on company\npolicies.\n2.2. Duties are\nallocated having\nregard to individual\npreference,\ndomestic and\n2.1 Work plan and\nprocedures\n2.2 Work\nrequirements and\ntargets\n2.2 Individual and\ngroup\nexpectations and\nassignments\n2.3 Ways to improve\ngroup leadership\nand membership\n2.1 Communication\nskills\n2.2 Management skills\n2.3 Negotiating skills\n2.4 Evaluation skills\n2.5 Identifying team\nmember’s strengths\nand rooms for\nimprovement\n\n--- PDF PAGE 12 ---\nTour Guiding Services NC III-TRSTGS321 Promulgated (09/14/2021) 8\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\npersonal\nconsiderations,\nwhenever possible\n3. Set\nperformance\nexpectations for\nteam members\n3.1 Performance\nexpectations are\nestablished based\non client needs\n3.2 Performance\nexpectations are\nbased on individual\nteam members\nknowledge, skills\nand aptitude\n3.3 Performance\nexpectations are\ndiscussed and\ndisseminated to