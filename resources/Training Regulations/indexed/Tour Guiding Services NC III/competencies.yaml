 are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n3.  Edit, format and \ncheck \ninformation \n3.1 Basic editing \ntechniques are \nused  \n3.2 Accuracy of \ndocuments are \nchecked  \n3.3 Editing and \nformatting tools and \ntechniques are \nused for more \ncomplex documents \n3.4 Proof reading \ntechniques is used \nto check that \ndocuments look \nprofessional \n3.1 Basic file-handling \ntechniques \n3.2 Techniques in \nchecking \ndocuments \n3.3 Techniques in \nediting and \nformatting \n3.4 Proof reading \ntechniques  \n \n3.1 Using basic file-\nhandling techniques \nis used for the \nsoftware \n3.2 Using different \ntechniques in \nchecking documents \n3.3 Applying editing and \nformatting techniques \n3.4 Applying proof \nreading techniques\n\n--- PDF PAGE 34 ---\nTour Guiding Services NC III-TRSTGS321     Promulgated  (09/14/2021)                                           30 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Information \nMay include: \n1.1. \nProperty  \n1.2. \nOrganizational \n1.3. \nTechnical reference \n2. Technical information \nMay include: \n2.1. \npaper based  \n2.2. \nelectronic \n3. Software   \nMay include: \n3.1. \nspreadsheets  \n3.2. \ndatabases \n3.3. \nword processing \n3.4. \n presentation  \n4. Sources \nMay include: \n4.1. \nother IT systems \n4.2. \nmanually created  \n4.3. \nwithin own organization  \n4.4. \noutside own organization  \n4.5. \ngeographically remote \n5. Customers \nMay include: \n5.1. \ncolleagues \n5.2. \ncompany and project management \n5.3. \nclients \n6. Security measures \nMay include: \n6.1. \naccess rights to input;  \n6.2. \npasswords;  \n6.3. \naccess rights to outputs;  \n6.4. \ndata consistency and back-up;  \n6.5. \nrecovery plans\n\n--- PDF PAGE 35 ---\nTour Guiding Services NC III-TRSTGS321     Promulgated  (09/14/2021)                                           31 \nEVIDENCE GUIDE \n \n1. Critical aspects of \nCompetency \nAssessment requires evidence th