          "1. Source information 1.1 Research sources and appropriate methodologies are selected based on the types of information sought 1.2 Essential information on the regional destinations are identified 1.3 Sites, sensory experiences, events and features of the region are identified in consultation with other tour guides, colleagues and company officials 1.4 Sites and sensory experiences are assessed for client suitability",
