        "source_title": "GUIDE AND ESCORT VISITORS IN ACCORDANCE WITH THE REGIONAL TOUR ITINERARY",
        "source_text": "--- PDF PAGE 83 ---\nTour Guiding Services NC III-TRSTGS321     Promulgated  (09/14/2021)                                           79 \nUNIT OF COMPETENCY \n: \nGUIDE AND ESCORT VISITORS IN ACCORDANCE WITH   \n                                                          THE REGIONAL TOUR ITINERARY \n \n \nUNIT CODE \n:          TRS511309 \n \nUNIT DESCRIPTOR              : \nThis unit deals with the knowledge and skills required   \nfor  guiding and escorting visitors in a region, performing safety \npractices, resolving complaints and other emergencies.    \n \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Meet and assist  \nvisitors upon \narrival at the \ndestination \n1.1 Determined the role \nand responsibilities \nof the tour guide as \nper company policies \nand procedures. \n1.2 Arrival details are \nchecked. \n1.3 Reservations of the \nitinerary are doubled-\nchecked with the local \nguide when applicable. \n1.4 Tour itinerary is \nchecked for compliance \nwith the visitors’ \nrequirements. \n1.5 Meets and greets the \nvisitors at the \ndestination’s gateway. \n1.6 Visitors are properly \npositioned to give \nwelcome briefing \nbefore boarding \n(whenever possible). \n1.7 Visitors’ baggage is \nchecked and ensured \nbaggage is boarded. \n1.8 Accompanies visitors to \nthe place of lodging. \n1.9 Assistance is provided \nin the registration \nformalities at the place \nof lodging during \ncheck-in, when \napplicable. \n1.10 Visitors are reminded \nof the next activity. \n \n1.1 Role and \nresponsibilities of the \ntour guide \n1.2 Pre-arrival \nprocedures  \n1.3 Procedures at the \ngateway \n1.4 Baggage handling  \n1.5 Arrival transfer \nprocedures and \ncommentaries  \n1.6 Hotel check-in \nformalities  \n1.7 Tour guide’s code of \nethics \n1.8 General knowledge of \nthe Philippines and \nspecific knowledge of \nthe region including: \n- \nClimate \n- \nGeography and \ngeology \n- \nHistory \n- \nArchitecture \n- \nCultural events \n- \nReligion \n- \nArt, theatre, \nmusic and \nliterature \n- \nNatural \nenvironment and \ntourism \n- \nFlora and fauna \n- \nGovernment and \npolitics \n- \nTransport \n- \nAgriculture \n1.1 Ability to speak \nfluently in English \nand the local dialects \n1.2 Ability to tactfully \nanswer and handle \nsensitive question \nand situation \n1.3 Assisting visitors to \nplace of lodging \n1.4 Ability to work with \nthe local guide when \napplicable\n\n--- PDF PAGE 84 ---\nTour Guiding Services NC III-TRSTGS321     Promulgated  (09/14/2021)                                           80 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n- \nScience and \nTechnology \n- \nSports \n- \nEconomy \n- \nTrade \n- \nFood (Local \ndishes) \n- \nLifestyle \n- \nShopping \n- \nTourism services \nand facilities \n1.9 Health and Safety \nGuidelines issued by \nconcerned \ngovernment \nagencies, i.e. DOLE, \nDOH, DOT, DTI  \n(DOLE DO 198s2018 \npolicies on OSH) \n1.10 Awareness of \npersons with different \nabilities (BP344 \nAccessibility Law) \n \n2. Guide and escort \nvisitors while on \ntour in the region \n2.1 Ensure that  \nappropriate attire are  \nworn for different \nactivities or occasions. \n2.2 Personal hygiene is \nobserved and practiced \nper accepted social \nnorms. \n2.3 Tourist driver and local \nguide are briefed on \nthe pick-up points, \nroute and stop-over. \n2.4 Summary of the day’s \nactivities are provided \nto visitors \n2.5 Assistance to visitors \nare provided and \nquestions and \nconcerns are \naddressed \n2.6 Visitors’ movements \nduring stop-over and \nwalkabouts are \nmanaged or monitored \n2.1 Role of tour guide as \na time keeper, \nshepherd and giver \nof care \n2.2 Tour guide’s code of \nethics \n2.3 Tour guiding \ntechniques \n2.4 Optional tours \n2.5 Safety rules and \nprocedures   \n2.6 Situation awareness \n2.7 General knowledge \nof the Philippines \nand specific \nknowledge of the \nregion  including: \n- \nClimate \n- \nGeography and \ngeology \n- \nHistory \n- \nArchitecture \n- \nCultural events \n- \nReligion \n2.1 Ability to speak \nfluently In English \nand the local dialects \n2.2 Ability to tactfully \nanswer and handle \nsensitive question \nand situation \n2.3 Guiding and \nescorting visitors on \ndifferent tour \nlocations\n\n--- PDF PAGE 85 ---\nTour Guiding Services NC III-TRSTGS321     Promulgated  (09/14/2021)                                           81 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \nwith the local guide \nwhen applicable \n2.7 Tour arrangements \nwith suppliers are \ncoordinated \n2.8 Optional tours are \npromoted and \nencouraged for clients \nto avail  \n2.9 Safety precautions  are \nobserved and followed \nat all times \n2.10 Vehicles are checked \nfor belonging left \nbehind after every tour \n2.11 Practices situation \nawareness at all times \nto prevent accidents \nand other unforeseen \nsituations. \n \n- \nArt, theatre, \nmusic and \nliterature \n- \nNatural \nenvironment and \ntourism \n- \nFlora and fauna \n- \nGovernment and \npolitics \n- \nTransport \n- \nAgriculture \n- \nScience and \nTechnology \n- \nSports \n- \nEconomy \n- \nTrade \n- \nFood (Local \ndishes) \n- \nLifestyle \n- \nShopping \n- \nTourism services \nand facilities \n2.8 Health and Safety \nGuidelines issued by \nconcerned \ngovernment \nagencies, i.e. DOLE, \nDOH, DOT, DTI  \n(DOLE DO \n198s2018 policies \non OSH) \n2.9 Awareness of \npersons with \ndifferent abilities \n(BP344 \nAccessibility Law) \n \n3. Deliver \ninformation, tour \nspiels and \ncommentaries \n3.1 Relevant and timely \ncommentaries and \ninstructions are \nprovided \n3.2 Posture and safe \npositioning are \nmaintained at all times \n3.3 Commentaries are \ndelivered with proper \n3.1 Role of  tour guide \nas an interpreter and \npresenter \n3.2 Tour commentary \ndelivery techniques \n3.3 Informative \ncommentaries and \nspiels  \n3.4 Application of \npositive social skills  \n3.1 Ability to speak \nfluently In English \nand the local \ndialects \n3.2 Ability to tactfully \nanswer and handle \nsensitive question \nand situation \n3.3 Delivering \ninformation, tour\n\n--- PDF PAGE 86 ---\nTour Guiding Services NC III-TRSTGS321     Promulgated  (09/14/2021)                                           82 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \nvoice modulation and \npronunciation. \n3.4 Appropriate  \nterminologies are used \nand updated \ninformation is provided  \nat all times. \n3.5 Positive interaction is \ndeveloped and rapport \nis established with \nvisitors. \n \n3.5 Tour guide’s code of \nethics \n3.6 General knowledge \nof the Philippines \nand specific \nknowledge of the \nregion including: \n- \nClimate \n- \nGeography and \ngeology \n- \nHistory \n- \nArchitecture \n- \nCultural events \n- \nReligion \n- \nArt, theatre, \nmusic and \nliterature \n- \nNatural \nenvironment and \ntourism \n- \nFlora and fauna \n- \nGovernment and \npolitics \n- \nTransport \n- \nAgriculture \n- \nScience and \nTechnology \n- \nSports \n- \nEconomy \n- \nTrade \n- \nFood (Local \ndishes) \n- \nLifestyle \n- \nShopping \n- \nTourism services \nand facilities \n3.7 Health and Safety \nGuidelines issued by \nconcerned \ngovernment \nagencies, i.e. DOLE, \nDOH, DOT, DTI  \n(DOLE DO \n198s2018 policies \non OSH) \n3.8 Awareness of \npersons with \ndifferent abilities \nspiels and \ncommentaries \n3.4 Ability to augment \nthe local guide’s \ncommentary \ntactfully\n\n--- PDF PAGE 87 ---\nTour Guiding Services NC III-TRSTGS321     Promulgated  (09/14/2021)                                           83 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n(BP344 Accessibility \nLaw) \n \n4. Resolve \ncomplaints and \nemergency \nsituations \n4.1 Complaints are \nattended to and \nreferred to the persons \nconcerned \n4.2 Visitors’ safety and \ncomfort are ensured \nduring the entire tour \n4.3 Stressful situations are \navoided and handled  \ntactfully \n4.4 Damage control is \nadopted in unforeseen \nsituations. \n4.5 Best solutions are \napplied to unforeseen \nsituations with  \ncompany’s approval \n4.6 Tour operator is \nnotified on the remedial \nmeasures in  \nunforeseen situations. \n4.7 Emergency situations \nare handled. \n \n4.1 Visitor’s complaints \n4.2 Safety precautions \nduring the entire tour \n4.3 Solutions on \nresolving complaints \n4.4 Documentation of \ncomplaints \n4.5 Tour guide’s code of \nethics \n4.6 Crisis Management \nAwareness and  \nPreparedness (Man \nmade and \notherwise) \n4.7 Health and Safety \nGuidelines issued by \nconcerned \ngovernment \nagencies, i.e. DOLE, \nDOH, DOT, DTI  \n(DOLE DO \n198s2018 policies \non OSH) \n4.8 Awareness of \npersons with \ndifferent abilities \n(BP344 Accessibility \nLaw) \n \n4.1 Resolving complaints \nand other \nemergencies \n4.2 Ability to speak \nfluently In English \nand the local dialects \n4.3 Ability to tactfully \nanswer and handle \nsensitive question \nand situation \n4.4 First Aid Techniques \n4.5 Ability to work with \nthe local guide to \nresolve complaints \nwhen applicable \n4.6  \n \n5. Provide send-off \nassistance and \nhotel departure \nformalities  \n5.1 Assistance with check-\nout formalities at the \nplace of lodging is \nprovided. \n5.2 Collection and boarding \nof visitors’ baggage is \nsupervised. \n5.3 Visitors are \naccompanied to the \nplace of departure  \n5.4 Relevant information \nen route to the place of \ndeparture is provided. \n5.5 Appropriate closing \nspiel is delivered. \n5.1 Departure