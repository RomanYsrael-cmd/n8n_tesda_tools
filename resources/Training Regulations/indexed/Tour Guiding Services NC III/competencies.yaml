        "source_title": "OVERSEE REGIONAL TOUR ARRANGEMENTS FOR CLIENTS",
        "source_text": "--- PDF PAGE 75 ---\nTour Guiding Services NC III-TRSTGS321     Promulgated  (09/14/2021)                                           71 \nUNIT OF COMPETENCY :   OVERSEE REGIONAL TOUR ARRANGEMENTS FOR CLIENTS  \n \n \n \nUNIT CODE \n:    TRS511308 \n \nUNIT DESCRIPTOR           :   This unit describes the performance outcomes, skills and  \n                                                knowledge required to oversee the regional tour arrangements  \n \n     included in the tour itinerary and making provisions for  \n \n     additional changes and revisions as contracted by a tour  \n \n     operator or tour organizer. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range of \nVariables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. \nPerform pre-\narrival checks \n1.1 Inclusions of the tour \nitinerary are \ndetermined as to the \nclients \nrequirements  \n1.2 Tours components \nthat are for the \nvisitors’ personal \naccount are \ndetermined based \non company policy  \n1.3 Reserved tour \ncomponents are \nverified and changes \naffected as \nnecessary \n1.4 Required tour \ndocuments and \ncash advances are \ncollected as \nnecessary. \n \n1.1 Tour components \nreservation \n1.2 Tour vouchers and \nexchange orders \n1.3 Cash advances \n1.4 Tour documents  \n1.5 Check-in and check-\nout procedures \n1.5.1 Transportation \ncompany \n1.5.2 Lodging \nestablishment  \n1.5.3 Any other \nestablishment \n1.6 Standard Operating \nProcedures  \n1.7 Knowledge of room \ncategories, room \ntypes and published \nrates and the \nschedules of \nairlines, shipping \ncompanies, bus / \ntrain companies \n1.8 Knowledge of other \nsuppliers’ locations, \namenities, service, \nfacilities, highlights \nand rates including \nlocal guide services \n1.9 Local/municipal \ntravel tour regulation \nand ordinances \n1.10 \nCultural \nsensitivity \n1.1 Checking tour \ncomponents in the \nitinerary \n1.2 Noting and advising \nchanges to the suppliers \nincluding local guide \nservices   \n1.3 Collecting and checking \ntour vouchers and \nexchange orders \n1.4 Collecting cash \nadvances \n1.5 Communication skills  \n1.6 Decision-making \nand \nproblem solving skills\n\n--- PDF PAGE 76 ---\nTour Guiding Services NC III-TRSTGS321     Promulgated  (09/14/2021)                                           72 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range of \nVariables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \nawareness and \npractices \n1.11 \nHealth and \nSafety Guidelines \nissued by concerned \ngovernment \nagencies, i.e. DOLE, \nDOH, DOT, DTI  \n(DOLE DO \n198s2018 policies \non OSH) \n1.12 \nAwareness of \npersons with \ndifferent abilities \n(BP344 Accessibility \nLaw) \n \n2. \nCoordinate \nregional tour \narrangements \n2.1 Delivery of tour \ncomponents are \nsupervised in \naccordance with tour \narrangements  \n2.2 Delivery compliance \nby suppliers of \nreserved tour \ncomponents are \nchecked \n2.3 Monitoring and \nrecording of money \npaid or account due to \nand from visitors \nand/or suppliers are \nconducted based on \nenterprise instructions \nand procedures \n2.4 Relevant information \non the suppliers’ \nservices, amenities \nand facilities are \nprovided \n2.5 Optional visitors’ \nrequests from \nsuppliers are \nfacilitated \n2.6 Visitors are politely \nreminded to pay for all \nexpenses which are \n2.1 Role of the tour \nguide \n2.2 Delivery of tour \ncomponents \n2.3 Payable to clients or \nsuppliers \n2.4 Information on \nsuppliers services, \namenities and \nfacilities \n2.5 Visitor’s request  \n2.6 Check-in and check-\nout procedures \n2.6.1 Transportation \ncompany \n2.6.2 Lodging \nestablishment  \n2.6.3 Any other \nestablishment \n2.7 Standard Operating \nProcedures  \n2.8 Knowledge of room \ncategories, room \ntypes and published \nrates and the \nschedules of \nairlines, shipping \ncompanies, bus / \ntrain companies \n2.9 Knowledge of other \nsuppliers’ locations, \n2.1 Checking the delivery of \ntour components  \n2.2 Determining money due \nand money payable to \nclients or suppliers \n2.3 Providing information on \nsuppliers services, \namenities and facilities \n2.4 Facilitating visitor’s \nrequests for optional \nservices with the local \nguide \n2.5 Communication skills  \n2.6 Decision-making \nand \nproblem solving skills\n\n--- PDF PAGE 77 ---\nTour Guiding Services NC III-TRSTGS321     Promulgated  (09/14/2021)                                           73 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range of \nVariables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \nnot part of the tour \npackage \n \namenities, service, \nfacilities, highlights \nand rates \n2.10 Local/municipal \ntravel tour regulation \nand ordinances \n2.11 Accommodations, \nrestaurants, \nshopping sites and \ntourism-related \nestablishments in \nthe \nlocality/destination \n2.12 \nHealth and \nSafety Guidelines \nissued by concerned \ngovernment \nagencies, i.e. DOLE, \nDOH, DOT, DTI  \n(DOLE DO \n198s2018 policies \non OSH) \n2.13 \nAwareness of \npersons with \ndifferent abilities \n(BP344 Accessibility \nLaw) \n \n3. \nResolve \ncomplaints \nand  \nemergency \nsituations \n3.1 Resolution of \ncomplaints with \nsuppliers and other \nconcerns are given \nassistance based on \nenterprise policy with \nthe local guide. \n3.2 Emergency \nsituations are \nhandled as deemed \nnecessary and \nappropriate solutions \nare determined and \napplied. \n3.3 Government \nauthorities concerned \nare notified about the \ncrisis situation \nwhenever necessary. \n3.1 Enterprise Standard \nOperating \nProcedures for \ncomplaints and \nemergencies \n3.2 Visitor’s complaints \n3.3  Different solutions \nin resolving \ncomplaints \n3.4 Government \nagencies, required \ninformation and \ndocumentation  \nneeded for  \nemergency \nsituations \n3.5 Check-in and check-\nout procedures \n3.5.1 Transportation \nco