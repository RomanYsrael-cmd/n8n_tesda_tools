 service\n\n•\nExplain how to review\ncustomer/guest satisfaction with\nservice delivery using appropriate\nmethods that produce verifiable\ndata\n•\nIdentify steps on how to evaluate\ncustomer service evaluation\noutcomes\n•\nObtain agreements on\nappropriate action to overcome\nproblems\n• Discussion\n• Demonstration\n• Lecture\n• Group\ndiscussion\n• Simulation\n\n• Observation\n• Demonstration\n• Written\nexamination\n• Interview\n\n4 Hours\n\n--- PDF PAGE 110 ---\nTour Guiding Services NC III-TRSTGS321 Promulgated (09/14/2021) 106\nCORE COMPENTENCIES\n(156 Hours)\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nMethod\nNominal\nDuration\n1. Research\ninformation\nrelevant to the\ndestination and\ntour itinerary\n1.1 Source\ninformation\n\nDiscuss:\n•\nStandard procedure in gathering\ninformation about specific\nsites/attractions/activities/\naccessibility/accommodation\namenities\n•\nIdentification of Research\nMethods\n•\nDefinition and attributes of a local\ntour guide\n•\nAssessing the Sources of\ninformation\n•\nTypes of information –\nbasic/essential, tourism\nhighlights, support services\n•\nAssessing information –\naccessibility, uniqueness,\nfeatures, benefits, significance,\nenvironmental impact, among\nothers\n•\nMatching sourced information for\nvisitors’ suitability and interests\n•\nSensory experiences – sight,\nsound, taste, smell, feel\n• Lecture/\ndiscussion\n• Practical\nresearch\napplications\n\n• Interview\n• Oral\nquestioning\n\n12 Hours\n\n1.2 Arrange and file\ninformation\n\nDiscuss:\n•\nClassifying sourced\ninformation\n•\nEssential information –\nclimate, geography, history,\nculture, trade, industry,\neducation, religion,\ngovernance, food and local\n• Lecture/\ndiscussion\n• Practical filing\napplications\n\n• Interview and\noral\nquestioning\n• Demonstratio\nn of filing\nsystems\n8 Hours\n\n--- PDF PAGE 111 ---\nTour Guiding Services NC III-TRSTGS321 Promulgated (09/14/2021) 107\nUnit of\nCompete