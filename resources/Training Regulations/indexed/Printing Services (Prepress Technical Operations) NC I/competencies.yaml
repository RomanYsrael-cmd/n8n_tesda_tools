ns \n1.3.1. Mentors \n1.3.2. Training institutions \n1.3.3. Technical organizations \n1.4 \nIndustry journals \n1.5 \nInternet \n1.6 \nPersonal observation and experience \n2.  Information to assist \neffective work \nperformance \nMay include: \n2.1 Different sectors of the industry and the services \navailable in each sector \n2.2 Awareness on different culture \n2.3 Relationship between the industry and other industries \n2.4 Industry working conditions \n2.5 Legislation that affects the industry \n2.5.1 Dangerous Drug Act (DDA) \n2.5.2 Intellectual Property Ownership (IPO) \n2.5.3 Health and safety \n2.5.4 Hygiene \n2.5.5 Labor work practices \n2.5.6 Workers’ rights and compensation \n2.5.7 Viewer advisory \n2.5.8 Building and other related regulations \n2.5.9 Other related legislations \n2.6 Guilds and associations \n2.7 Industrial relations issues and major organizations \n2.8 Career opportunities within the industry \n2.9 Work ethics \n2.10 Quality assurance\n\n--- PDF PAGE 46 ---\nPrinting Services (Prepress Technical Operations) NC I            December 2023 \n42 \n \nEVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 Sought and applied information on the industry \n1.2 Updated industry knowledge \n2. Resource Implications \nThe following resources should be provided: \n2.1 Tools, prepress equipment/machine and facilities \nappropriate to processes or activity \n2.2 Supplies and materials relevant to the proposed \nactivity \n2.3 Appropriate software \n2.4 Sample files \n3. Methods of Assessment Competency in this unit may be assessed through: \n3.1 Direct observation of activities with questioning \n3.2 Oral or written questioning \n3.3 Case study \n3.4 Interview \n4. Context of Assessment \n4.1   Competency may be assessed in the actual \nworkplace or at the designated TESDA Accredited \nAssessment Center.\n",
