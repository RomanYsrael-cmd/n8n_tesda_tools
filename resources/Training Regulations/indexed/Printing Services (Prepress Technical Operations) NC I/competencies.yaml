        "evidence_guide": {
          "source_text": "1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Determined requirements of task.\n1.2 Checked supplied storage devices for comparability\nof company’s input device and for viruses.\n1.3 Selected appropriate hardware and software.\n1.4 Planned task to ensure that file handling guidelines\nand procedures are followed.\n1.5 Entered data into the computer file server either by\nappropriate software or through drag-and-drop\nprocess.\n1.6 Checked and saved accuracy of information.\n1.7 Stored checked data in storage media using proper\nfolder structure.\n1.8 Selected correct data for retrieval.\n1.9 Opened data by selecting the correct software.\n1.10 Retrieved data from the file server.\n1.11 Implemented procedures for handling data files.\n1.12 Backed-up saved files.\n2. Resource Implications\nThe following resources should be provided:\n4.1 Tools, prepress equipment/machine and facilities\nappropriate to processes or activity\n4.2 Supplies and materials relevant to the proposed\nactivity\n4.3 Appropriate Softwares\n4.4 Sample Files\n3. Methods of Assessment Competency in this unit may be assessed through:\n3.1 Direct observation of activities with questioning\n3.2 Oral or written questioning\n3.3 Case Study\n3.4 Interview\n4. Context of Assessment\n4.1 Competency may be assessed in the actual\nworkplace or at the designated TESDA Accredited\nAssessment Center.\n\n--- PDF PAGE 67 ---\nPrinting Services (Prepress Technical Operations) NC I December 2023\n63\nUNIT OF COMPETENCY\n:\nPERFORM INPUT PROCESSING PROCEDURES\n\nUNIT CODE\n:"
        },
        "source_text": "SOC732302\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, discipline, attitudes and\nvalues needed to perform file handling which include\ntransferring, accessing, handling data, using appropriate\nhardware and software and the application of commonly\nused tools and equipment.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Prepare task to\nbe undertaken\n1.1 Requirements of task\nare determined\naccording to job\nspecifications.\n1.2 Supplied storage\ndevices are checked\nfor compatibility of\ncompany’s input device\nand for viruses.\n1.3 Appropriate hardware\nand software are\nselected according to\ntask assigned and\nrequired outcome.\n1.4 Task is planned to\nensure that file handling\nguidelines and\nprocedures are\nfollowed.\nTECHNOLOGY\n1.1\nComputer\noperations\n1.2\nVarious storage\ndevices\n1.3\nVarious\ncomputer\nhardware\nCOMMUNICATION\n1.4\nWork instruction\n1.5\nOral and written\ncommunication\n1.1 Reading and\nunderstanding\nwork instruction\n1.2 Communication\nSkills\n1.3 Using computer\nsoftware\n2. Input data into\ncomputer\n2.1 Data are entered into\nthe computer file\nserver either by\nappropriate software or\nthrough drag-and-drop\nprocess.\n2.2 Accuracy of\ninformation is checked\nand saved in\naccordance with\nprepress pre-flighting\nprocedures.\n2.3 Checked data are\nstored in storage media\nusing proper folder\nstructure according to\ncompany’s archiving\nprocedure.\nTECHNOLOGY\n2.1\nVarious desktop\npublishing\nsoftware\nfunctions/\napplications\n2.2\nPre-flighting of\ndata\nCOMMUNICATION\n2.3\nIntellectual\nProperty\n2.4\nData file\norganization\n2.1 Operating\ncomputer\n2.2 Using desktop\nsoftware\n2.3 Applying correct\npre-flighting of\nfile\n2.4 Performing\ninternet\nbrowsing\n2.5 Labeling of soft\nfiles\n2.6 Organizing of\nfiles\n\n--- PDF PAGE 63 ---\nPrinting Services (Prepress Technical Operations) NC I December 2023\n59\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n3. Retrieve data\nfrom the file\nserver\n3.1 Correct data for retrieval\nis selected in\naccordance with client’s\nspecifications &\ninstructions.\n3.2 Data are opened by\nselecting the correct\nsoftware in accordance\nwith established\nprocedures.\n3.3 Data are retrieved from\nthe file server in\naccordance with\nestablished procedures.\nTECHNOLOGY\n3.1\nFonts handling\n3.2\nConcept of\nlinking graphics\nMATHEMATICS\n3.3\nData file Check\n3.1 Activating\nneeded fonts\n3.2 Linking of\nimages\n3.3 Comprehension\nskills\n4. Handle data\n4.1 Procedures for\nhandling data files are\nimplemented in\naccordance with\nestablished procedures.\n4.2 Out-of-date and\nunnecessary contents\nare purged according to\nwork instructions from\nauthorized personnel.\n4.3 Saved files are back-up\nin accordance with\nestablished procedures.\nTECHNOLOGY\n4.1\nData files backup\nprocedures\nCOMMUNICATION\n4.2\nSecurity of data\nfile insight\n4.3\nData procedures\n4.1 Following written\norders\n4.2 Operating\nvarious backup\ndevices\n4.3 Handling backup\ndevices with care\n4.4 Critical thinking\n4.5 Managing data\n\n--- PDF PAGE 64 ---\nPrinting Services (Prepress Technical Operations) NC I December 2023\n60\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Requirements of Task\nMay include:\n1.1 Archiving\n1.2 Retrieval\n1.3 Purging\n1.4 File Handling\n2. Storage Devices\nMay include:\n2.1 Internet Downloadable Files\n2.2 Mobile Device\n2.3 Flash Drive\n2.4 CD/DVD\n2.5 Computer Hard Drive\n2.6 Memory Cards\n3. Hardware\n\nMay include:\n3.1 Computer Set\n3.2 Data Storage Device\n4. Software\nMay include:\n4.1 Design and Lay-Out\n4.2 Vector Graphics\n4.3 Image Manipulation and Editing Software\n4.4 Portable Document Format Reader\n5 Guidelines and\nProcedures\nMay include:\n5.1 Proper Labeling\n5.2 Proper File Location\n5.3 Cataloguing of File\n5.4 Indexing of Files\n6 Computer File Server\nMay include:\n6.1 Stand-alone File Server\n6.2 Workstation File Server\n6.3 Network Assisted Server (NAS)\n7 Information\nMay include:\n7.1 Client’s Name\n7.2 Job Title\n7.3 Job Order Number\n7.4 Date Received\n7.5 Production Deadline\n7.6 Technical Specifications\n8 Data\nMay include:\n8.1 Raw File\n8.2 Work-On-Process File\n8.3 Print Ready File\n8.4 File for Archiving\n\n--- PDF PAGE 65 ---\nPrinting Services (Prepress Technical Operations) NC I December 2023\n61\nVARIABLE\nRANGE\n9 Specifications and\nInstructions\nMay include:\n9.1 Client’s File\n9.2 Reference File\n9.3 Revised File\n10 Opened\nMay include:\n10.1 File-open Procedure\n10.2 Drag-and-drop Procedure\n10.3 Double-click Procedure\n10.4 Right-click-open-with Procedure\n11 Managing Data\nMay include:\n11.1 Assurance of confidentiality of data files\n11.2 Virus check-ups\n12 Unnecessary Content\nMay include:\n12.1 File Duplicates\n12.2 Malware\n12.3 Irrelevant Software\n12.4 Temporary Files\n12.5 Irrelevant Files\n13 Back-up\nMay include:\n13.1 Manual Back-Up\n13.2 Computer Generated Back-Up\n13.3 Mirroring\n13.4 Cloud Back-Up\n\n--- PDF PAGE 66 ---\nPrinting Services (Prepress Technical Operations) NC I December 2023\n62\n\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Determined requirements of task.\n1.2 Checked supplied storage devices for comparability\nof company’s input device and for viruses.\n1.3 Selected appropriate hardware and software.\n1.4 Planned task to ensure that file handling guidelines\nand procedures are followed.\n1.5 Entered data into the computer file server either by\nappropriate software or through drag-and-drop\nprocess.\n1.6 Checked and saved accuracy of information.\n1.7 Stored checked data in storage media using proper\nfolder structure.\n1.8 Selected correct data for retrieval.\n1.9 Opened data by selecting the correct software.\n1.10 Retrieved data from the file server.\n1.11 Implemented procedures for handling data files.\n1.12 Backed-up saved files.\n2. Resource Implications\nThe following resources should be provided:\n4.1 Tools, prepress equipment/machine and facilities\nappropriate to processes or activity\n4.2 Supplies and materials relevant to the proposed\nactivity\n4.3 Appropriate Softwares\n4.4 Sample Files\n3. Methods of Assessment Competency in this unit may be assessed through:\n3.1 Direct observation of activities with questioning\n3.2 Oral or written questioning\n3.3 Case Study\n3.4 Interview\n4. Context of Assessment\n4.1 Competency may be assessed in the actual\nworkplace or at the designated TESDA Accredited\nAssessment Center.\n\n--- PDF PAGE 67 ---\nPrinting Services (Prepress Technical Operations) NC I December 2023\n63\nUNIT OF COMPETENCY\n:\nPERFORM INPUT PROCESSING PROCEDURES\n\nUNIT CODE\n:"
