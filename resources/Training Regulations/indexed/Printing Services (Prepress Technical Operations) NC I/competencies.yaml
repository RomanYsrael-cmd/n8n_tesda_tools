        "source_title": "RECEIVE AND RESPOND TO WORKPLACE COMMUNICATION",
        "source_text": "--- PDF PAGE 6 ---\nPrinting Services (Prepress Technical Operations) NC I            December 2023 \n2 \nSECTION 2 COMPETENCY STANDARDS \n \n \nThis section gives the details of the contents of the units of competency required in \nPRINTING SERVICES (PREPRESS TECHNICAL OPERATIONS) NC I. \n \n \nBASIC COMPETENCIES \n \n \nUNIT OF COMPETENCY \n: \nRECEIVE AND RESPOND TO WORKPLACE         \nCOMMUNICATION \n \n \n \nUNIT CODE \n: \n400311101 \n \n \n \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge, skills and attitudes \nrequired to receive, respond and act on verbal and \nwritten communication. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range of \nVariables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Follow routine \nspoken \nmessages \n1.1 Required information is \ngathered by listening \nattentively and correctly \ninterpreting or \nunderstanding \ninformation/instructions. \n1.2 Instructions/information \nare recorded in \naccordance with \nworkplace requirements. \n1.3 Instructions are acted \nupon immediately in \naccordance with \ninformation received. \n1.4 Clarification is sought \nfrom workplace \nsupervisor on all \noccasions when any \ninstruction/ information is \nnot clear.  \n1.1 Organizational \npolicies/guidelines \nin regard to \nprocessing \ninternal/external \ninformation \n1.2 Ethical work \npractices in \nhandling \ncommunications \n1.3 Overview of the \nCommunication \nprocess \n1.4 Effective note-\ntaking and \nquestioning \ntechniques \n1.1 Conciseness in \nreceiving and \nclarifying \nmessages/ \ninformation/ \ncommunication \n1.2 Accuracy in \nrecording \nmessages/ \ninformation \n1.3 Basic \ncommunication \nskills \n1.4 Active-listening \nSkills \n1.5 Note-taking skills \n1.6 Clarifying and \nprobing \nquestions \n(questioning \nskills) \n2. Perform \nworkplace \nduties \nfollowing \nwritten notices \n2.1 Written notices and \ninstructions are read \nand   interpreted \ncorrectly in accordance \nwith organizational \nguidelines. \n2.1   Organizational \nguidelines in \nregard to \nprocessing \ninternal/ external \ninformation \n2.1 Conciseness in \nreceiving and \nclarifying \nmessages/ \ninformation/ \ncommunication\n\n--- PDF PAGE 7 ---\nPrinting Services (Prepress Technical Operations) NC I            December 2023 \n3 \n2.2 Routine written \ninstructions are followed \nin sequence. \n2.3 Feedback is given to \nworkplace supervisor \nbased on the \ninstructions/ information \nreceived. \n2.2   Ethical work \npractices in \nhandling \ncommunications \n2.3   Overview of the \nCommunication \nprocess \n2.4   Effective \nquestioning \ntechniques \n(clarifying and \nprobing) \n \n2.2 Accuracy in \nrecording \nmessages/ \ninformation \n2.3 Clarifying and \nprobing \nquestions \n(Questioning \nSkills) \n2.4 Skills in reading \nand recording \nand labeling data  \n2.5 Skills in locating \ninformation \n \n \n \n \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Written notices and \ninstructions \nMay include: \n1.1 \nWritten work instructions \n1.2 \nInternal memos/memorandum \n1.3 \nBusiness letters \n1.4 \nExternal communications \n1.5 \nElectronic mail \n1.6 \nBriefing notes \n1.7 \nGeneral correspondence \n1.8 \nMarketing materials \n1.9 \nGuidelines/Circulars  \n2. Organizational \nguidelines \nMay include: \n2.1 \nInformation documentation procedures \n2.2 \nCompany guidelines and procedures \n2.3 \nStandard Operating Procedure (SOPs) \n2.4 \nOrganization manuals \n2.5 \nDepartmental Policies and Procedures Manual \n2.6 \nService manual\n\n--- PDF PAGE 8 ---\nPrinting Services (Prepress Technical Operations) NC I            December 2023 \n4 \nEVIDENCE GUIDE \n \n1.   Critical aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 Demonstrated knowledge and understanding of \norganizational procedures in handling verbal and \nwritten communications \n1.2 Received and acted on verbal messages and \ninstructions correctly and efficiently \n1.3 Demonstrated ability in recording \ninstructions/information \n1.4 Utilized effective clarifying and probing techniques \nwhere necessary  \n2.   Resource Implications \nThe following resources should be provided: \n2.1   Pens \n2.2   Note pads \n2.3   Computer (if applicable) \n3.   Methods of Assessment \nCompetency in this unit may be assessed through: \n3.1   Demonstration on communication skills (e. g., role-   \nplaying) \n3.3   Oral questioning/Interview \n3.3   Written Test      \n4.   Context for Assessment \n4.1   Competency may be assessed individually in the \nactual workplace or in a simulated environment in \nTESDA-accredited institutions\n",
