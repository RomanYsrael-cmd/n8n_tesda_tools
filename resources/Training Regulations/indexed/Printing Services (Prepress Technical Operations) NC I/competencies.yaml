nd select\nappropriate\ninformation\n2.2 Using suitable\ntechniques to find\nuseful\ninformation\neasier\n2.3 Using records\n2.4 Carrying out\nSearches\n\n--- PDF PAGE 27 ---\nPrinting Services (Prepress Technical Operations) NC I December 2023\n23\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n2.5 Search engine is\nchosen appropriate for\nthe information that is\nneeded.\n2.6 Searches are carried\nout as per\nrequirements.\n3. Examine\ninformation\n3.1 Information and its\nsources are evaluated\nfor relevance and\nvalidity to business\nand/or client\nrequirements.\n3.2 Information is\nexamined as required\nto identify key issues.\n3.3 Detailed evaluation of\ninformation is carried\nout as required using\nrelevant techniques\nincluding mathematical\ncalculations.\n3.1 Data evaluation\nprocedures\n3.2 Cultural aspects of\ninformation and\nmeaning\n3.3 Sources of public\nsector work-related\ninformation\n3.4 Public sector\nstandards\n3.1 Evaluating data\n3.2 Practicing cultural\naspects of\ninformation and\nmeaning\n3.3 Using public\nsector standards\n\n4. Secure\ninformation\n4.1 Basic file-handling\ntechniques are used for\nthe software\n4.2 Techniques is used to\nhandle, organize and\nsecure information\n4.1 Policies,\nprocedures and\nguidelines relating\nto information\nhandling in the\npublic sector,\nincluding\nconfidentiality,\nprivacy, security,\nfreedom of\ninformation\n4.2 Basic file-handling\ntechniques\n4.3 Techniques in\nhandling,\norganizing and\nsaving files\n4.4 Electronic and\nmanual filing\nsystems\n4.1 Handling policies,\nprocedures and\nguidelines relating\nto information\nhandling in the\npublic sector,\nincluding\nconfidentiality,\nprivacy, security,\nfreedom of\ninformation\n4.2 Using basic file-\nhandling\ntechniques is\nused for the\nsoftware\n4.3 Using different\ntechniques in\nhandling,\norganizing and\nsaving files\n4.4 Using electronic\nand manual filing\nsystems\n\n--- PDF PAGE 28 ---\nPrinting Services (Prepress Technical Operations) NC I December 2023\n24\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n5. Manage\ninformation\n5.1 Information and\nrecords are maintained\nto ensure data and\nsystem integrity using\na range of standard\nand complex\ninformation systems\nand operations.\n5.2 Routine data and\nrecords are reconciled\nas required.\n5.3 Inadequacies in\nsystem/s relating to\ninformation retrieval\nare identified and\ncorrected or reported\nto relevant staff as\nrequired.\n5.1 Policies, procedures\nand guidelines\nrelating to\ninformation handling\nin the public sector,\nincluding\nconfidentiality,\nprivacy, security,\nfreedom of\ninformation\n5.2 Data collection and\nmanagement\nprocedures\n5.3 Organizational\ninformation handling\nand storage\nprocedures\n5.4 Cultural aspects of\ninformation and\nmeaning\n5.5 Sources of public\nsector work-related\ninformation\n5.6 Public sector\nstandards\n5.7 Databases and data\nstorage systems\n\n5.1 Handling policies,\nprocedures and\nguidelines relating\nto information\nhandling in the\npublic sector,\nincluding\nconfidentiality,\nprivacy, security,\nfreedom of\ninformation\n5.2 Collecting data\nand managing\nprocedures\n5.3 Handling\norganizational\ninformation and\nstorage\nprocedures\n5.4 Practicing cultural\naspects of\ninformation and\nmeaning\n5.5 Using public\nsector standards\n5.6 Managing\ndatabases and\ndata storage\nsystems\n\n--- PDF PAGE 29 ---\nPrinting Services (Prepress Technical Operations) NC I December 2023\n25\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Information\nMay include:\n1.1. Property\n1.2. Organizational\n1.3. Technical reference\n2. Search engine\nMay include:\n2.1. Crawler-based search engine\n2.1.1. Google\n2.1.2. AlltheWeb\n2.1.3. AltaVista\n2.2. Human-powered directories\n2.2.1. Yahoo directory\n2.2.2. Open directory\n2.2.3. Looksmart\