etency in this unit may be assessed through:\n2.1 Demonstration with questioning\n2.2 Observation with questioning\n2.3 Interviews\n2.4 Written Examination\n3. Resource Implications\nThe following resources must be provided:\n3.1 Applicable equipment and software appropriate for\nthe unit of competency\n3.2 Printed materials to be reproduced appropriate for the\nunit of competency\n3.3 Work area appropriate for the unit of competency\n3.4 Tools, supplies, materials and equipment appropriate\nfor the unit of competency\n4. Context of Assessment\n4.1 Competency may be assessed in the actual workplace\nor at the designated TESDA Accredited Assessment\nCenter.\n\n--- PDF PAGE 75 ---\nPrinting Services (Prepress Technical Operations) NC I December 2023\n71\nUNIT OF COMPETENCY\n:\nPERFORM PREVENTIVE MAINTENANCE OF\nPREPRESS EQUIPMENT / MACHINES\n\nUNIT CODE\n:\nSOC732305\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, discipline, attitudes and\nvalues needed to perform preventive maintenance of\nprepress equipment and machines.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n\n1. Perform minor\npreventive\nmaintenance of\nequipment /\nmachine\n1.1 Equipment/machines\nare identified and\ninspected in\naccordance to standard\nmaintenance\nprocedure.\n1.2 Equipment/machines\nare cleaned as per\nmanufacturer’s\nrecommendation using\nappropriate cleaning\nmaterials.\n1.3 Room temperature\nand humidity are\ncontrolled according to\nmanufacturer’s\nrecommendation.\nTECHNOLOGY\n1.1\nDifferent types of\nequipment /\nmachines\n1.2\nDifferent parts of\nequipment /\nmachines\nENVIRONMENT\n1.3\nAwareness on\nhealth and safety\nprocedures\n1.4\nCleaning\nmaterials and its\nusage\n1.5\n5S principles\n1.6\n3R principles\n(Reduce, Reuse,\nRecycle)\n1.1 Performing\nbasic machine/\nequipment\noperations\n1.2 Applying\nappropriate\ncleaning\nmaterials and\nminor\nmaintenance\nprocedures\n1.3 Practicing 5s\n1.4 Practicing 3Rs\n2. Perform major\npreventive\nmaintenance of\nequipment\n/machine\n2.1 Processing\nchemicals are\nchanged according to\nmanufacturer’s\nstandard maintenance\nprocedure.\n2.2 Computer to plate\n(CTP) systems are\ncleaned according to\nmanufacturer’s\nmaintenance\nprocedure.\n2.3 Wastes are disposed\naccording to proper\nwaste disposal\npractice.\n2.4 Selected parts of\nequipment / machine\nand its consumables\nare replaced according\nTECHNOLOGY\n2.1\nCompany policy\nin relation to\nrelevant\ntechnology\n2.2\nCTP workflow\nsystems and its\noperation\n2.3\nRelevant\nequipment and\noperational\nprocesses\n2.4\nPreventive\nmaintenance\nprocedures\nestablished in the\nplant\nENVIRONMENT\n2.1 Replacing\nprocessing\nchemicals\n2.2 Disposing\nwastes properly\n2.3 Following oral &\nwritten\ninstructions\n\n--- PDF PAGE 76 ---\nPrinting Services (Prepress Technical Operations) NC I December 2023\n72\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n\nto manufacturer’s\nstandard maintenance\nprocedure.\n2.5\nProper waste\ndisposal\n2.6\nAwareness on\nhealth and safety\nprocedures\n3. Perform\nrecording of\nmaintenance\nreport\n3.1 Inspection of\nequipment /machine is\nrecorded in\naccordance with\ncompany’s policies and\nprocedures.\n3.2 Cleaning procedures\nare recorded in\naccordance with\ncompany’s policies and\nprocedures.\n3.3 Parts to be replaced\nare requested for\nreplacement in\naccordance with\ncompany’s policies and\nprocedures.\n3.4 Reports are submitted\nto relevant personnel\nfor validation in\naccordance with\nestablished procedure.\nCOMMUNICATION\n3.1\nEffective\ncommunication\n3.2\nProcedures in\nrecording and\nreporting\n3.1 Written & oral\ncommunications\n3.2 Follow work\ninstructions\n3.3 Attention to\ndetails\n3.4 Time conscious\n\n--- PDF PAGE 77 ---\nPrinting Services (Prepress Technical Operations) NC I December 2023\n73\nRANGE OF VARIABLES\