        "source_text": "--- PDF PAGE 19 ---\nPrinting Services (Prepress Technical Operations) NC I            December 2023 \n15 \nUNIT OF COMPETENCY \n: \nENHANCE SELF-MANAGEMENT SKILLS \n \n \n \nUNIT CODE \n: \n400311104 \n \n \n \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge, skills, and attitudes in \napplying the ability to regulate actions, make good \ndecisions, and show appropriate behavior based on self-\nawareness. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range of \nVariables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Set personal \nand career \ngoals \n1.1 The difference between \npersonal and career \ngoals are described. \n1.2 Clear and concise \npersonal and career \ngoals are developed. \n1.3 Characteristics of \nmotivational goals \naccording to Locke \n&Latham are identified. \n1.1 Definition of \npersonal goals and \ncareer goals \n1.2 SMART Model for \ngoal setting \n1.3 Five principles of \ngoal setting \naccording to Locke \n& Latham (Clarity, \nChallenge, \nCommitment, \nFeedback, and \nTask complexity) \n1.1 Setting of \npersonal and \ncareer goals \n1.2 Defining, \ncreating, and \nmapping \npersonal and \ncareer goals \nusing SMART \nModel for goal \nsetting \n1.3 Applying goal \nsetting principles \nto personal and \ncareer goals \n2. Recognize \nemotions   \n2.1 Influence that people, \nsituations and events \nhave on emotions are \ndescribed. \n2.2 Importance of \nresponding with \nappropriate emotions \nare explained. \n2.3 Influences on and \nconsequences of \nemotional responses in \nsocial and work-\nrelated contexts are \nexamined. \n2.1 Common positive \nand negative \nemotions \nmanifested in the \nworkplace \n2.2 Professional and \nnon-professional \nbehaviors in the \nworkplace \n2.3 Triggers and \nimplications of \npositive and \nnegative emotions \nin the workplace \n2.1 Identifying \nsensitively the \npositive and \nnegative \nemotions in the \nworkplace \n2.2 Responding with \nappropriate \nemotions in the \nworkplace \n2.3 Identifying \npossible \nconsequences of \ninappropriate \nemotional \nresponses in a \nsocial and work-\nrelated context\n\n--- PDF PAGE 20 ---\nPrinting Services (Prepress Technical Operations) NC I            December 2023 \n16 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range of \nVariables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n3. Describe \noneself as a \nlearner \n3.1 Factors and strategies \nthat assist learning are \nidentified and described. \n3.2 Preferred learning \nstyles according to VAK \nLearning Style Model \nand Kolb’s Theory of \nLearning Styles are \nidentified. \n3.3 Range of learning \nstrategies appropriate \nto specific tasks and \ndescribe work practices \nthat assist their learning \nare identified and \nchosen. \n3.1 Kolb’s Theory of \nLearning Styles \n(Converger, \nDiverger, \nAssimilator, \nAccommodator) \n3.2 VAK Learning \nStyle Model \n(Visual, Auditory, \nKinesthetic) \n3.3 Range of learning \nstrategies \nappropriate to \nspecific tasks and \ndescribe work \npractices that \nassist their \nlearning \n \n3.1 Identifying \nfactors and \nstrategies that \nassist learning \n3.2 Applying \nlearning styles \nto positively \ninfluence \nschool/work \nperformance \n3.3 Using \nappropriate \nlearning \nstrategies to \nimprove study \nhabits and \nlearning\n\n--- PDF PAGE 21 ---\nPrinting Services (Prepress Technical Operations) NC I            December 2023 \n17 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Personal goals \nMay include:  \n1.1 \nGraduate from Tech-Voc training \n1.2 \nBuy a car \n1.3 \nTravel around the world \n2. Career goals \nMay include but not limited to:  \n2.1 \nGraduate from Tech-Voc training \n2.2 \nGraduate from college \n2.3 \nBuy a car \n2.4 \nRetire at 50 years old \n3. Emotions \nPositive emotions may include:  \n3.1 \nJoy \n3.2 \nGratitude \n3.3 \nHope \n3.4 \nSerenity \nNegative emotions may include:  \n3.5 \nAnger \n3.6 \nFear \n3.7 \nDisgust \n3.8 \nSadness \n4. Social and work-related \ncontexts \nMay include professional behavior such as:  \n4.1 Committed to developing and improving their skills \n4.2 Professionals get the job done \n4.3 They keep their word and deliver what they promise. \n \nMay include non-professional behavior such as–  \n4.4 They engage in office politics \n4.5 Bluffing and misrepresenting their skills \n4.6 Blaming a colleague \n5. Learning styles \nMay include:  \n5.1 Visual \n5.2 Auditory \n5.3 Kinesthetic \n5.4 Converger \n5.5 Diverger \n5.6 Assimilator \n5.7 Accommodator  \n6. Learning strategies \nMay include:  \n6.1 \nExplain and describe ideas with many details \n6.2 \nSwitch between ideas while studying \n6.3 \nUse specific examples to understand abstract ideas\n\n--- PDF PAGE 22 ---\nPrinting Services (Prepress Technical Operations) NC I            December 2023 \n18 \n \nEVIDENCE GUIDE \n \n1. Critical aspects of \nCompetency  \nAssessment requires evidence that the candidate: \n1.1 \nDeveloped SMART personal and career goals \n1.2 \nApplied goal setting principles \n1.3 \nIdentified sensitively the positive and negative \nemotions in the workplace \n1.4 \nResponded with appropriate emotions in the \nworkplace \n1.5 \nIdentified possible consequences of inappropriate \nemotional responses in a social and work-related \ncontext \n1.6 \nApplied learning styles to positively influence \nschool/work performance \n1.7 \nDeveloped reflective practice through realization of \nlimitations, likes/ dislikes; through showing of self-\nconfidence   \n2. Resource Implications \nThe following resources for should be provided: \n2.1   Access to workplace and resources \n3. Methods of Assessment \nCompetency in this unit may be assessed through: \n3.1 \nDemonstration or simulation with oral questioning (ex. \nhow to recognize emotions) \n3.2 Case problems involving workplace diversity issues \n3.3 Third-party report \n4. Context for Assessment \n4.1 \nCompetency assessment may occur in workplace or \nany appropriately simulated environment\n",
