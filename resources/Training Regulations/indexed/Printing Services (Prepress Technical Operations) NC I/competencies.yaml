  "source_section_text": "SECTION 2 COMPETENCY STANDARDS\n\nThis section gives the details of the contents of the units of competency required in\nPRINTING SERVICES (PREPRESS TECHNICAL OPERATIONS) NC I.\n\nBASIC COMPETENCIES\n\nUNIT OF COMPETENCY\n:\nRECEIVE AND RESPOND TO WORKPLACE\nCOMMUNICATION\n\nUNIT CODE\n:\n400311101\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes\nrequired to receive, respond and act on verbal and\nwritten communication.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Follow routine\nspoken\nmessages\n1.1 Required information is\ngathered by listening\nattentively and correctly\ninterpreting or\nunderstanding\ninformation/instructions.\n1.2 Instructions/information\nare recorded in\naccordance with\nworkplace requirements.\n1.3 Instructions are acted\nupon immediately in\naccordance with\ninformation received.\n1.4 Clarification is sought\nfrom workplace\nsupervisor on all\noccasions when any\ninstruction/ information is\nnot clear.\n1.1 Organizational\npolicies/guidelines\nin regard to\nprocessing\ninternal/external\ninformation\n1.2 Ethical work\npractices in\nhandling\ncommunications\n1.3 Overview of the\nCommunication\nprocess\n1.4 Effective note-\ntaking and\nquestioning\ntechniques\n1.1 Conciseness in\nreceiving and\nclarifying\nmessages/\ninformation/\ncommunication\n1.2 Accuracy in\nrecording\nmessages/\ninformation\n1.3 Basic\ncommunication\nskills\n1.4 Active-listening\nSkills\n1.5 Note-taking skills\n1.6 Clarifying and\nprobing\nquestions\n(questioning\nskills)\n2. Perform\nworkplace\nduties\nfollowing\nwritten notices\n2.1 Written notices and\ninstructions are read\nand interpreted\ncorrectly in accordance\nwith organizational\nguidelines.\n2.1 Organizational\nguidelines in\nregard to\nprocessing\ninternal/ external\ninformation\n2.1 Conciseness in\nreceiving and\nclarifying\nmessages/\ninformation/\ncommunication\n\n--- PDF PAGE 7 ---\nPrinting Services (Prepress Technical Operations) NC I December 2023\n3\n2.2 Routine written\ninstructions are followed\nin sequence.\n2.3 Feedback is given to\nworkplace supervisor\nbased on the\ninstructions/ information\nreceived.\n2.2 Ethical work\npractices in\nhandling\ncommunications\n2.3 Overview of the\nCommunication\nprocess\n2.4 Effective\nquestioning\ntechniques\n(clarifying and\nprobing)\n\n2.2 Accuracy in\nrecording\nmessages/\ninformation\n2.3 Clarifying and\nprobing\nquestions\n(Questioning\nSkills)\n2.4 Skills in reading\nand recording\nand labeling data\n2.5 Skills in locating\ninformation\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Written notices and\ninstructions\nMay include:\n1.1\nWritten work instructions\n1.2\nInternal memos/memorandum\n1.3\nBusiness letters\n1.4\nExternal communications\n1.5\nElectronic mail\n1.6\nBriefing notes\n1.7\nGeneral correspondence\n1.8\nMarketing materials\n1.9\nGuidelines/Circulars\n2. Organizational\nguidelines\nMay include:\n2.1\nInformation documentation procedures\n2.2\nCompany guidelines and procedures\n2.3\nStandard Operating Procedure (SOPs)\n2.4\nOrganization manuals\n2.5\nDepartmental Policies and Procedures Manual\n2.6\nService manual\n\n--- PDF PAGE 8 ---\nPrinting Services (Prepress Technical Operations) NC I December 2023\n4\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Demonstrated knowledge and understanding of\norganizational procedures in handling verbal and\nwritten communications\n1.2 Received and acted on verbal messages and\ninstructions correctly and efficiently\n1.3 Demonstrated ability in recording\ninstructions/information\n1.4 Utilized effective clarifying and probing techniques\nwhere necessary\n2. Resource Implications\nThe following resources should be provided:\n2.1 Pens\n2.2 Note pads\n2.3 Computer (if applicable)\n3. Methods of Assessment\nCompetency in this unit may be assessed through:\n3.1 Demonstration on communication skills (e. g., role-\nplaying)\n3.3 Oral questioning/Interview\n3.3 Written Test\n4. Context for Assessment\n4.1 Competency may be assessed individually in the\nactual workplace or in a simulated environment in\nTESDA-accredited institutions\n\n--- PDF PAGE 9 ---\nPrinting Services (Prepress Technical Operations) NC I December 2023\n5\nUNIT OF COMPETENCY\n:\nWORK WITH OTHERS\n\nUNIT CODE\n:\n400311102\n\nUNIT DESCRIPTOR\n:\nThis unit covers the skills, knowledge and attitudes\nrequired in working as member of a team, interacting with\nco-members and performing one’s role in the team.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Develop\neffective\nworkplace\nrelationships\n1.1 Duties and\nresponsibilities are\ndone in a positive\nmanner to promote\ncooperation and good\nrelationship.\n1.2 Assistance is sought\nfrom workgroup when\ndifficulties arise and\naddressed through\ndiscussions.\n1.3 Feedback provided by\nothers in the team is\nencouraged,\nacknowledged and\nacted upon.\n1.4 Differences in personal\nvalues and beliefs are\nrespected and\nacknowledged during\ninteraction.\n1.1 One’s role, duties\nand responsibilities\nin the workplace\n1.2 Acknowledging/\nreceiving and\ngiving feedback\n1.3 Valuing respect\nand empathy in the\nworkplace\n1.4 Workplace\ncommunication\nprotocols\n1.5 Teamwork\n1.6 Collaboration and\nteambuilding within\nthe enterprise\n1.1 Communication\nskills – oral and\nwritten\n(e. g.,\nrequesting\nadvice,\nreceiving\nfeedback)\n1.2 Ability to relate\nto/interact with\npeople from a\nrange of social\nand cultural\nbackgrounds\n\n--- PDF PAGE 10 ---\nPrinting Services (Prepress Technical Operations) NC I December 2023\n6\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n2. Contribute to\nwork group\nactivities\n2.1 Support is provided to\nteam members to\nensure workgroup goals\nare met.\n2.2 Constructive\ncontributions to\nworkgroup goals and\ntasks are made\naccording to\norganizational\nrequirements.\n2.3 Information relevant to\nwork is shared with team\nmembers to ensure\ndesignated goals are\nmet.\n2.1 Importance of\ncreative\ncollaboration,\nsocial\nperceptiveness\nand problem\nsensitivity in the\nworkplace\n2.2 Organizational\nRequirements\n2.3 Importance of\ninitiative and\ndedication in group\nprocess\n2.4 Office and\nworkplace\ntechnologies and\nautomation\n(hardware,\nsoftware systems)\n\n2.1 Communication\nskills – oral and\nwritten (e. g.,\nrequesting\nadvice, receiving\nfeedback)\n2.2 Organizing work\npriorities and\narrangements\n2.3 Team player\nskills\n2.4 Technology\nskills including\nthe ability to\nselect and use\ntechnology\nappropriate to a\ntask\n\n--- PDF PAGE 11 ---\nPrinting Services (Prepress Technical Operations) NC I December 2023\n7\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Duties and\nresponsibilities\nMay include:\n1.1 Job description and employment arrangements\n1.2 Organization’s policy relevant to work role\n1.3 Organizational structures\n1.4 Supervision and accountability requirements including\nOHS\n1.5 Enterprise code of conduct\n2. Work group\nMay include:\n2.1 Supervisor or manager\n2.2 Peers/work colleagues and clients\n2.3 Other members of the organization\n3. Feedback\nMay include:\n3.1 Formal/Informal performance appraisal\n3.2 Obtaining feedback from supervisors and colleagues and\nclients\n3.3 Personal, reflective behavior strategies\n3.4 Routine organizational methods for monitoring service\ndelivery\n4. Providing support to\nteam members\nMay include:\n4.1 Explaining/clarifying\n4.2 Helping colleagues\n4.3 Providing encouragement\n4.4 Providing feedback to another team member\n4.5 Undertaking extra tasks if necessary\n5. Organizational\nrequirements\n\nMay include:\n5.1 Goals, objectives, plans, system and processes\n5.2 Legal and organization policy/guidelines\n5.3 OHS policies, procedures and programs\n5.4 Ethical standards\n5.5 Defined resources parameters\n5.6 Quality and continuous improvement processes and\nstandards\n\n--- PDF PAGE 12 ---\nPrinting Services (Prepress Technical Operations) NC I December 2023\n8\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\n\nAssessment requires evidence that the candidate:\n1.1.\nProvided support to team members to ensure goals\nare met\n1.2.\nActed on feedback from clients and colleagues\n1.3.\nDemonstrated quality/active participation in team\nmeetings and activities\n2. Resource Implications\nThe following resources should be provided:\n2.1.\nAccess to relevant workplace or appropriately\nsimulated environment where assessment can take\nplace\n2.2.\nMaterials relevant to the proposed activity or task\n3. Methods of Assessment\nCompetency in this unit may be assessed through:\n3.1\nWritten Test\n3.2\nRole play\n3.3\nInterview/Oral questioning\n3.4\nStructured and unstructured activity\n4. Context for Assessment\n4.1.\nCompetency assessment may occur in workplace or\nany appropriately simulated environment\n4.2.\nAssessment shall be observed while task are being\nundertaken whether individually or in group\n\n--- PDF PAGE 13 ---\nPrinting Services (Prepress Technical Operations) NC I December 2023\n9\nUNIT OF COMPETENCY\n:\nSOLVE/ADDRESS ROUTINE PROBLEMS\n\nUNIT CODE\n:\n400311103\n\nUNIT DESCRIPTOR\n:\nThis unit of covers the knowledge, skills and attitudes\nrequired to solve problems in the workplace including the\napplication of problem solving techniques and to\ndetermine and resolve the root cause of routine\nproblems.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Identify the\nproblem\n1.1 Desired operating/output\nparameters and expected\nquality of\nproducts/services are\nidentified.\n1.2 The nature of the problem\nby observation on\nroutines are defined.\n1.3 Problems are stated and\nspecified clearly.\n1.1 Competence\nincludes mastery\nof knowledge and\nunderstanding of\nthe process,\nnormal operating\nparameters, and\nproduct quality to\nrecognize non-\nstandard situations\n1.2 Competence to\ninclude the ability\nto apply and\nexplain\nfundamental\ncauses of\nproblems routine\nproblems and to\ndetermine the\ncorrective actions\n1.3 Relevant\nequipment and\noperational\nprocesses\n1.4 Enterprise goals,\ntargets and\nmeasures\n1.5 Enterprise quality\nOHS and\nenvironmental\nrequirement\n1.6 Enterprise\ninformation\nsystems and data\ncollation\n1.7 Industry codes and\nstandards\n1.1 Using range of\nformal problem-\nsolving\ntechniques (e.g.,\nplanning,\nattention,\nsimultaneous\nand successive\nprocessing of\ninformation)\n1.2 Identifying and\nclarifying the\nnature of the\nproblem\n\n--- PDF PAGE 14 ---\nPrinting Services (Prepress Technical Operations) NC I December 2023\n10\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n2. Assess\nfundamental\ncauses of the\nproblem\n2.1 Problem-solving tool\nappropriate to the\nproblem and the context\nis selected.\n2.2 Possible causes based\non experience and the\nuse of problem-solving\ntools/basic analytical\ntechniques are\nidentified.\n2.3 Possible fundamental\ncauses of problems are\nspecified.\n\n2.1 Competence\nincludes a\nthorough\nknowledge and\nunderstanding of\nthe process,\nnormal operating\nparameters, and\nproduct quality to\nrecognize non-\nstandard\nsituations\n2.2 Competence to\ninclude the ability\nto apply and\nexplain\nfundamental\ncauses of\nproblems routine\nproblems and to\ndetermine the\ncorrective actions.\n2.3 Relevant\nequipment and\noperational\nprocesses\n2.4 Enterprise goals,\ntargets and\nmeasures\n2.5 Enterprise quality\nOHS and\nenvironmental\nrequirement\n2.6 Enterprise\ninformation\nsystems and data\ncollation\n2.7 Industry codes\nand standards\n2.1 Using range of\nforma