        "source_text": "SOC732304\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes\nrequired\nto\nperform\nline\nreproduction\nand\nits\nrequirements and using the appropriate hardware and\nsoftware and the application of commonly used tools and\nequipment.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Prepare\nrequirements for\nline\nreproduction\n\n1.1 Check is conducted on\nreproducible copies\nfor line reproduction in\naccordance with\nestablished\nprocedures.\n1.2 Image capturing\ndevice is prepared to\ndigitize a copy in\naccordance with\nestablished\nprocedures.\n1.3 Appropriate settings\nare set on the image\ncapturing device in\naccordance with\nestablished\nprocedures.\n1.4 Check is conducted\naccording to the\nguidelines/\ninstructions provided\nby client.\nTECHNOLOGY\n1.1\nDifferences\nbetween vector\nand raster image\nCOMMUNICATION\n1.2\nCheck the\noriginal copy\n1.3\nCheck the\nguidelines/instruc\ntions\nENVIRONMENT\n1.4\nMaterials safe\nkeeping\n1.1 Conducting\ncheck of original\ncopy\n1.2 Handling\nmaterials for\nsafe keeping\n1.3 Using\nappropriate\nequipment for\nline reproduction\n1.4 Oral and written\ncommunication\n2. Convert a line\ncopy into a\nprintable image\n2.1 Reproducible copies\nare converted into a\ndigitize form in\naccordance with\nestablished\nprocedures.\n2.2 Rasterized image is\nimported to vector\ngraphic editor software.\n2.3 Tracing procedures are\nperformed using\nappropriate tracing\ntools.\n2.4 Rasterized text\nimages are converted\nTECHNOLOGY\n2.1\nScanner setting\nand operation\n2.2\nSoftware\napplication for\nline reproduction\n2.3\nVector software\napplication\n2.4\nDifferent drawing\ntools\n2.1 Executing\nscanning\noperations\n2.2 Performing\ntracing\ntechniques\n2.3 Applying\ndrawing skills\n2.4 Applying\ncomputer\noperating skills\n\n--- PDF PAGE 72 ---\nPrinting Services (Prepress Technical Operations) NC I December 2023\n68\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\nto vector images in\naccordance with\nestablished\nprocedures.\n2.5 Guidelines/ instructions\nare applied to produce\na line copy.\n3. Save a line\ncopy in an\nappropriate\nformat and\nprint\n3.1 Copy for archiving\npurposes is saved in\naccordance with\nestablished procedures.\n3.2 A line copy is saved for\nclient’s approval.\n3.3 A proof is printed for\nevaluation in\naccordance with\nestablished procedures.\n\nTECHNOLOGY\n3.1\nVarious file\nformat\n3.2\nVarious machines\nfor proofing\n3.3\nOperation of\nvarious proofing\nmachines\n3.1 Choosing\ncorrect file\nformat\n3.2 Selecting\nappropriate\nprinter for\nproofing\n3.3 Operating\nvarious proofing\nmachines\n\n--- PDF PAGE 73 ---\nPrinting Services (Prepress Technical Operations) NC I December 2023\n69\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Reproducible Copies\nMay include:\n1.1 Printed or Reflective Copies\n1.2 Artwork Materials\n1.3 Digital Files\n2. Image Capturing Device\n\nMay include:\n2.1 Flatbed Scanner\n2.2 Digital Camera\n2.3 Mobile Camera\n2.4 3D Camera\n2.5 Print Screen or Screen Capture\n3. Settings\nMay include:\n3.1 Aperture\n3.2 Resolution\n3.3 Focus\n3.4 Contrast\n3.5 Lens\n3.6 Speed\n4. Guidelines/Instructions\nMay include:\n4.1 Color\n4.2 Dimension\n4.3 Element Location\n4.4 Measurement\n4.5 Font Size\n4.6 Font Style\n4.7 Leading\n4.8 Kerning\n5. Tracing Tools\n\nMay include:\n5.1 Computer Mouse\n5.2 Track Pad\n5.3 Touch Screen\n5.4 Pen Tablet\n6. Text Images\n\nMay include:\n6.1 Flattened Text Files\n6.2 Layered Text Files\n6.3 Scanned Text Files\n7. Archiving\n\nMay include:\n7.1 Raw File\n7.2 Post Script File\n7.3 Portable Document Format File\n7.4 Encapsulated Postscript File\n7.5 Scalable Vector Graphics File\n8. Proof\n\nMay include:\n8.1 Laser Print Copy\n8.2 Ink Jet Print Copy\n\n--- PDF PAGE 74 ---\nPrinting Services (Prepress Technical Operations) NC I December 2023\n70\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Conducted checking on reproducible copies for line\nreproduction.\n1.2 Set appropriate settings on the image capturing\ndevice.\n1.3 Conducted checking according to the guidelines and\ninstructions by client.\n1.4 Converted reproducible copies into a digitized form.\n1.5 Performed tracing procedures using appropriate\ntracing tools.\n1.6 Converted rasterized text images to vector images.\n1.7 Saved copy for archiving purposes.\n1.8 Saved a line copy for client’s approval.\n1.9 Printed a proof for evaluation.\n2. Methods of Assessment Competency in this unit may be assessed through:\n2.1 Demonstration with questioning\n2.2 Observation with questioning\n2.3 Interviews\n2.4 Written Examination\n3. Resource Implications\nThe following resources must be provided:\n3.1 Applicable equipment and software appropriate for\nthe unit of competency\n3.2 Printed materials to be reproduced appropriate for the\nunit of competency\n3.3 Work area appropriate for the unit of competency\n3.4 Tools, supplies, materials and equipment appropriate\nfor the unit of competency\n4. Context of Assessment\n4.1 Competency may be assessed in the actual workplace\nor at the designated TESDA Accredited Assessment\nCenter.\n\n--- PDF PAGE 75 ---\nPrinting Services (Prepress Technical Operations) NC I December 2023\n71\nUNIT OF COMPETENCY\n:\nPERFORM PREVENTIVE MAINTENANCE OF\nPREPRESS EQUIPMENT / MACHINES\n\nUNIT CODE\n:"
