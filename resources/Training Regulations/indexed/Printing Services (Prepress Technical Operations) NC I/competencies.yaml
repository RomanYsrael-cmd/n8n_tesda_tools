        "source_title": "PERFORM PRE-FLIGHTING PROCEDURES",
        "source_text": "--- PDF PAGE 55 ---\nPrinting Services (Prepress Technical Operations) NC I                       December 2023 \n51 \n \nCORE COMPETENCIES \n \n \nUNIT OF COMPETENCY \n: \nPERFORM PRE-FLIGHTING PROCEDURES \n \n \n \nUNIT CODE \n: \nSOC732301 \n \n \n \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge skills and attitudes \nrequired to perform pre-flight procedures and the \napplication of commonly used tools and equipment.  \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range of \nVariables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Inspect \nclient’s \nsupplied \nmaterials \n1.1 Client’s supplied \nmaterials are \nidentified, labeled and \ncounted in accordance \nwith established \nprocedures. \n1.2 File source is \nidentified in \naccordance with \nestablished \nprocedures. \n1.3 File source is checked \nfor accessibility, \ncompatibility and for \nviruses in accordance \nwith established \nprocedures. \n1.4 Supplied soft file is \nclassified if it is valid for \noutput and in \naccordance with \nestablished \nprocedures. \nTECHNOLOGY \n1.1 Client supplied \nmaterial \n1.2 Faulty materials \nrelated to work \n1.3 Computer \noperations \nMATHEMATICS \n1.4   Basic math \nCOMMUNICATION \n1.5 Verbal and written \ncommunication \n1.6 Intellectual \nproperty \n1.7 Various materials \n& its specification \nENVIRONMENT  \n1.8 6s principles \n(Sort, Set orders, \nShine, \nStandardize, \nSustain, Safety) \n1.1 Communication \nskills \n1.2 Interpersonal \nskills \n1.3 Critical thinking \n1.4 Comprehension \nskills \n1.5 Recognizing \nvarious types of \nmaterials \nsupplied by \nclient \n1.6 Operating \ncomputer  \n2. Gather client’s \nspecifications \nand \nrequirements \n2.1 Job specifications \nprovided by client are \nreceived for reference \nand use. \n2.2 Clients supplied \nmaterials are checked \nin conformance with \nprinting condition. \nCOMMUNICATION \n2.1 \nJob specification  \n2.2 \nClient’s \nrequirements \n2.3 \nFlow of \ncommunication \n2.4 \nTask planning \nand preparation \n2.1 Gathering \nclient’s \nspecifications \n2.2 Evaluating \nclient’s \nrequirements \n2.3 Handling / \nkeeping supplied\n\n--- PDF PAGE 56 ---\nPrinting Services (Prepress Technical Operations) NC I                       December 2023 \n52 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range of \nVariables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n2.3 Client’s requirements \nare reviewed from the \njob order as \nappropriate. \n2.5 \nInformation on \ncharacteristic of \nmaterials \nmaterials with \ncare \n2.4 Planning and \npreparing task \n3. Prepare \nequipment for \npre-flighting \n3.1 Computer to be used is \nprepared to perform \nthe preflight operation. \n3.2 Appropriate software \nis selected in \naccordance with \nclient’s supplied data \nfile. \n3.3 Supplied fonts are \ninstalled in compliant \nwith established \nprocedures. \nTECHNOLOGY \n3.1 \nComputer \nfunctions \n3.2 \nVarious software \nand their usage \n3.3 \nInstallation of \nidentified various \ntypes of fonts \n3.1 Computer skills \n3.2 Using different \nsoftware related \nto printing \n3.3 Identifying and \ninstalling various \nfonts \n4. Perform \nmanual \nchecking of file \n4.1 Layout size, \ndimension, number of \npages, number of \ncolors, orientation, and \ncontents are inspected \nif it conforms to client’s \nrequirement and \nsupplied hard copy \n(100% Size). \n4.2 Fonts are checked for \nany problem or \nsubstitutions compared \nto the hard copy \nprovided by the client. \n4.3 Linked images are \nchecked if it is \ncomplete, at the \ncorrect file format, \nappropriate resolution, \nquality and with the \ncorrect color \nassignment in \naccordance with \nestablished \nprocedures. \n4.4 Bleeds and margins \nare present and are \nset according to the \nprint requirements. \n4.5 Texts and line \ndrawings are checked \nif vectored and in the \nTECHNOLOGY \n4.1 \nVarious file \nformat, image \nresolution and \ncolor mode  \n4.2 \nVector and \nRaster \nawareness \n4.3 \nImage trapping \nprocedures \nENGINEERING \n4.4 \nProper binding \nand finishing \nprocedures \nMATHEMATICS \n4.5 \nMetric system \nand English \nsystem \nmeasurement \n4.1 Converting \nMetric system to \nEnglish system \nmeasurement \nand vice versa \n4.2 Checking file \nformat, correct \nimage resolution \nand color mode \n4.3 Identifying areas \nto be trimmed \n4.4 Identifying raster \nimages areas to \nbe vectored \n4.5 Identifying areas \nwhich require \nimage trapping \nand overprinting\n\n--- PDF PAGE 57 ---\nPrinting Services (Prepress Technical Operations) NC I                       December 2023 \n53 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range of \nVariables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \ncorrect assignment in \naccordance with \nestablished \nprocedures. \n4.6 Image trapping is \napplied to eliminate \nprinting misregistration \nin accordance with \nestablished \nprocedures. \n4.7 Black texts are \ninspected and should \nbe in single black \ncolor. \n5. Submit  pre-\nflight report \n5.1 Written pre-flight \nreport is submitted to \nauthorized personnel in \naccordance with \nestablished \nprocedures. \n5.2 Recommendations are \npresented to \nauthorized personnel in \naccordance with \nestablished \nprocedures. \n5.3 Supplied materials, \ndevices and other \nrelated materials are \nlabeled, counted, \ncollected and returned \nto relevant personnel \nand in accordance with \nestablished procedures. \nCOMMUNICATION \n5.1 \nProper filing of \nreport \n5.2 \nCorrect \npresentation of \nreport \n5.3 \nPre-flight reports \nand \nrecommendations \nENVIRONMENT \n5.4 \nMaterials \nsafekeeping \n5.1 Recommending \nand suggesting \nsolutions \n5.2 Writing reports \n5.3 Performing the \n5s\n\n--- PDF PAGE 58 ---\nPrinting Services (Prepress Technical Operations) NC I                       December 2023 \n54 \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Supplied Materials \nMay include: \n1.1 Hard Copy \n1.2 Storage Device \n1.3 \nWritten Information \n1.4 \nDie Guides \n2. File Source \nMay include: \n2.1. Internet Downloadable Files  \n2.2. Mobile Device \n2.3. Flash Drive \n2.4. CD/DVD  \n2.5. Memory Cards \n2.6. Computer Hard Drive \n3. Soft File \nMay include: \n3.1. Productivity Files \n3.2. Desktop Publishing Files \n3.3. Vectored Files \n3.4. Raster Files \n3.5. Encapsulated Postscript File (EPS) \n3.6. Postscript File (PS) \n3.7. Portable Document Format file (PDF) \n4. Job Specification \nMay include: \n4.1. Size \n4.2. Dimension \n4.3. Materials information \n4.4. Color information \n4.5. Number of pages \n4.6. Printing process \n4.7. Binding/finishing information \n5. Client’s Requirements \nMay include: \n5.1. Quality \n5.2. Quantity \n5.3. Deadline \n6. Software  \nMay include: \n6.1. Image Manipulation and Editing Software \n6.2. Vector Graphic Editing Software \n6.3. Design and Lay-out Software \n6.4. Portable Document File Reader/Editor \n6.5. Preflight software \n6.6. Productivity Software \n7. Fonts \nMay include: \n7.1. Truetype font\n\n--- PDF PAGE 59 ---\nPrinting Services (Prepress Technical Operations) NC I                       December 2023 \n55 \nVARIABLE \nRANGE \n7.2. Postscript font \n7.3. Open Type font \n8. File Format  \nMay include: \n8.1. Joint Photographic Group (.jpeg/jpg) \n8.2. Encapsulated Postscript (.eps) \n8.3. Portable Document Format (.pdf) \n8.4. Tagged Image File Format (.tif/tiff) \n8.5. Photoshop Data (.psd) \n8.6. Portable Network Graphics (.png) \n8.7. Scalable Vector Graphics (.svg) \n8.8. Adobe InDesign file (.indd) \n8.9. Adobe Illustrator file (.ai) \n9. Quality \nMay include: \n9.1. Pixelated \n9.2. High Key Image \n9.3. Low Key Image \n9.4. Unsharpened Image \n9.5. Blurred Image \n9.6. Unwanted Images \n10. Color Assignment \nMay include: \n10.1. Cyan, Magenta, Yellow, Black (CMYK) \n10.2. Red, Green, Blue (RGB) \n10.3. Grayscale \n10.4. Spot Color \n10.5. Pantone Extended Gamut  \n11. Bleeds \nMay include: \n11.1. Image/Layout Extension \n11.2. Final Cutting Guide \n11.3. Layout Margin \n12. Vectored \nMay include: \n12.1. Lines \n12.2. Path \n12.3. Joints \n12.4. Points \n13. Image Trapping \nMay include: \n13.1. Overprinting \n13.2. Choking \n13.3. Spreading \n13.4. Image Registration \n13.5. Knockout \n14. Preflight Report \nMay include: \n14.1. Written Report \n14.2. Recommendations\n\n--- PDF PAGE 60 ---\nPrinting Services (Prepress Technical Operations) NC I                       December 2023 \n56 \n \nEVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 \nIdentified labelled and counted client’s supplied \nmaterials. \n1.2 \nIdentified file source. \n1.3 \nChecked file source for accessibility, compatibility \nand for viruses. \n1.4 \nClassified the supplied soft file if valid for output. \n1.5 \nReceived job specifications provided by client. \n1.6 \nChecked client’s supplied materials if in conformance \nwith printing condition. \n1.7 \nReviewed client’s requirements from the job order as \nappropriate. \n1.8 \nPrepared computer to be used to perform the \npreflight operation. \n1.9 \nSelected appropriate software application in \naccordance with client’s supplied data file. \n1.10 Installed supplied fonts. \n1.11 Inspected layout size, dimension, number of pages, \nnumber of colors, orientation, and contents if it \nconforms to client’s requirement and supplied hard \ncopy (100% size). \n1.12 Checked fonts for any problem or substitutions \ncompared to the hard copy provided by the client. \n1.13 Checked completeness of linked images in correct \nfile format, appropriate resolution, quality and with the \ncorrect color assignment. \n1.14 Checked presence and set the bleeds and margins. \n1.15 Checked texts and line drawings if vectored and in \nthe correct assignment. \n1.16 Applied image trapping to eliminate printing \nmisregistration. \n1.17 Inspected black texts and ensured it is in single black \ncolor. \n1.18 Submitted written pre-flight report to authorized \npersonnel. \n1.19 Presented recommendations to authorized \npersonnel. \n1.20 Labelled, counted, collected and returned supplied \nmaterials, devices and other related materials to \nrelevant personnel. \n2. Resource Implications \nThe following resources should be provided: \n2.1 \nWorkshop appropriate for the unit of competency \n2.2 \nTools, materials and equipment, appropriate for the \nunit of competency \n2.3 \nVideo clips \n2.4 \nCase work\n\n--- PDF PAGE 61 ---\nPrinting Services (Prepress Technical Operations) NC I                       December 2023 \n57 \n3. Methods of Assessment \nCompetency in this unit may be assessed through:     \n3.1 \nDemonstration with questioning \n3.2 \nObservation with questioning \n3.3 \nWritten Examination \n3.4 \nInterview \n4. Context for Assessment \n4.1 \nCompetency may be assessed in the actual \nworkplace or at the designated TESDA Accredited \nAssessment Center.\n",
