        "source_text": "400311108\n\nUNIT DESCRIPTOR\n\n:\n\nThis unit covers the knowledge, skills and attitude to\nidentify\nenvironmental\nwork\nhazards,\nfollow\nenvironment work procedures and comply with\nenvironmental requirements\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Identify\nenvironmental\nwork hazards\n\n1.1 Related environmental\nhazards are recognized\nbased on\nenvironmental work\nstandards.\n1.2 Environmental work\nstandards are\ninterpreted in\naccordance to relevant\npolicies.\n1.3 Required resources to\nminimize effect of\nenvironmental hazards\nare prepared based on\nrelevant environmental\nwork standards.\n1.1 Environmental\nHazards\n1.2 Environmental\nWork Standards\n1.3 Required\nResources\n1.4 OSH Standards\n1.5 Fight against\npoverty rights\n1.6 Environmental\nProtection\n1.7 Respect of Human\nRights\n\n1.1. Critical thinking\n1.2. Problem solving\n1.3. Observation\nSkills\n\n2. Follow\nenvironmental\nwork\nprocedures\n\n2.1 Environmental\nprotection pre-\ncautionary activities are\npracticed based on\nenvironmental work\nprocedures.\n2.2 Work activities are\nexecuted in accordance\nwith Environmental\nwork procedures.\n2.3 Environmental\nProtection Post-Activities\nare accomplished based\non environmental work\nprocedures.\n2.1 Environmental\nProtection\n2.2 Environmental\nWork Procedures\n2.3 Renewable\nEnergies\n2.1 Critical thinking\n2.2 Problem solving\n2.3 Observation\nSkills\n\n3. Comply with\nenvironmental\nwork\nrequirements\n\n3.1 Required resources are\nutilized in accordance\nwith workplace\nenvironmental policies.\n3.2 Environmental\nhazardous and non-\n3.1 Environmental\nWork Procedures\n3.2 Environmental\nLaws\n3.1 Critical thinking\n3.2 Problem solving\n3.3 Observation\nSkills\n\n--- PDF PAGE 38 ---\nPrinting Services (Prepress Technical Operations) NC I December 2023\n34\nhazardous materials\nare stored in\naccordance with\nenvironmental\nregulations.\n3.3 Hazardous and Non-\nhazardous Wastes\ndisposed according to\nenvironmental\nregulations.\n3.3 Environmental\nHazardous and\nNon-Hazardous\nMaterials\n\n--- PDF PAGE 39 ---\nPrinting Services (Prepress Technical Operations) NC I December 2023\n35\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Environmental Hazards\nMay include:\n1.1\nTobacco Smoke\n1.2\nAsbestos\n1.3\nLead\n1.4\nCombustion Gases\n1.5\nChemicals\n1.6\nPesticides\n1.7\nPollutants\n1.8\nContaminated Drinking Water\n1.9\nNoise\n1.10 Dust\n2. Environmental Work\nStandards\nMay include:\n2.1\nAir Quality Standards\n2.2\nEmission Standards\n2.3\nISO 14001: Environmental Management System\n2.4\nEnvironmental Statements\n2.5\nEnvironmental Quality Standards\n2.6\nWork Environment Measurement Standard\n3. Required Resources\nMay include:\n3.1\nElectric\n3.2\nWater\n3.3\nFuel\n3.4\nTelecommunications\n3.5\nSupplies and Materials\n3.6\nTrash Cans\n3.7\nRelevant Data Sheets\n3.8\nBarriers or Barricades\n4. Environmental\nProtection\nMay include protection against\n4.1\nOverconsumption of Resources\n4.2\nDestruction of Ecosystems\n4.3\nHabitat Destructions\n4.4\nExtinction of Wildlife\n4.5\nPollutions\n4.6\nWater Degradation\n5. Environmental Work\nProcedures\nMay include:\n5.1\nEnvironmental pollution control measures\n5.2\nOil and Fuel use\n5.3\nDisposal and Reuse\n5.4\nHerbicide applications\n5.5\nBreed Bird Mitigation\n5.6\nTree Removal Works\n5.7 Erosion Protection\n\n--- PDF PAGE 40 ---\nPrinting Services (Prepress Technical Operations) NC I December 2023\n36\n5.8 Scrub Clearance\n5.9 Bankside sediment clearance\n6. Environmental\nHazardous and Non-\nHazardous Materials\nMay include but not limited:\n6.1\nAcids\n6.2\nAdhesives\n6.3\nAerosols\n6.4\nAsbestos\n6.5\nBatteries\n6.6\nChemicals\n6.7\nCompact fluorescent lamps\n6.8\nDrugs\n6.9\nDyes\n6.10 E-Waste\n6.11 Gasoline\n6.12 Grease\n6.13 Lead\n6.14 Motor Oil\n6.15 Solvents\n6.16 Weed Killers\n7. Environmental\nRegulations\nMay include:\n7.1\nClean Air Act\n7.2\nClean Water Act\n7.3\nEndangered Species Act\n7.4\nResource Conservation and Recovery Act\n7.5\nCave Resources and Management Act\n7.6\nFisheries Code\n7.7\nForestry Code\n7.8\nMining Act\n\n--- PDF PAGE 41 ---\nPrinting Services (Prepress Technical Operations) NC I December 2023\n37\n EVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1. Interpreted the Environmental Work Standards\n1.2. Prepared required resources to minimize effects of\nenvironmental hazards\n1.3. Practiced environmental protection pre-cautionary\nactivities\n1.4. Executed work activities\n1.5. Accomplished environmental protection post-activities\n1.6. Stored environmental hazardous and non-hazardous\nmaterials\n1.7. Disposed hazardous and non-hazardous wastes\n2. Resource Implications\nThe following resources should be provided:\n2.1. Workplace with storage facilities\n2.2. Tools, materials and equipment relevant to the tasks\n(ex. Cleaning tools, cleaning materials, trash bags,\netc.)\n2.3. PPE\n2.4. Manuals and references\n3. Methods of Assessment\nCompetency in this unit may be assessed through:\n3.1. Demonstration\n3.2. Oral questioning\n3.3. Written examination\n4. Context for Assessment\n4.1. Competency assessment may occur in workplace or\nany appropriately simulated environment\n4.2. Assessment shall be observed while task are being\nundertaken whether individually or in-group\n\n--- PDF PAGE 42 ---\nPrinting Services (Prepress Technical Operations) NC I December 2023\n38\nUNIT OF COMPETENCY\n:\nADOPT ENTREPRENEURIAL MINDSET IN THE\nWORKPLACE\n\nUNIT CODE\n:"
