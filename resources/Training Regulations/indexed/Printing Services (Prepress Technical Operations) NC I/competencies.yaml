        "source_text": "400311109\n\nUNIT DESCRIPTOR\n:\nThis unit covers the outcomes required to support and\ninternalize an entrepreneurial mindset and observe basic\nentrepreneurial practices in the workplace.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Determine\nentrepreneurial\nmindset\n1.1 Entrepreneurial\nmindset in the\nworkplace is determined\nfrom enterprise practices\nand policies.\n1.2 Entrepreneurial\nmindset in the\nworkplace is studied and\naffirmed based on\ncurrent enterprise\npractices.\n1.3 Clarification from reliable\nsources is sought\nregarding\nentrepreneurial mindset\nand corporate culture.\n1.1 Workplace policies\nand practices\nrelating to\nentrepreneurship\n1.2 Elements of\ncorporate culture\n1.3 Entrepreneurial\nmindset\n1.4 Entrepreneurial\npractices in the\nworkplace\n1.5 Desirable attitudes:\n- Patience\n- Willingness to\nlearn\n- Attention to\ndetails\n1.1 Identifying\nentrepreneurial\nmindset\n1.2 Studying and\naffirming\nentrepreneurial\nmindset\n1.3 Selecting and\nemulating\ndesirable\nentrepreneurial\npractices\n1.4 Communication\nskills\n\n2. Identify\nentrepreneurial\npractices\n2.1 Entrepreneurial\npractices are\ndetermined based on\nenterprise requirements.\n2.2 Entrepreneurial\npractices are performed\nfollowing workplace and\nclient requirements.\n2.3 Cost-effective measures\nare complied with\nreference to workplace\nbest practices.\n\n2.1 Quality assurance\npractices\n2.2 Workplace and\nclient requirements\n2.3 Types of cost-\neffective measures\n2.4 Workplace quality\npolicy\n2.5 Attitude:\n- Patience\n- Attention to\ndetails\n2.1 Performing\nquality assurance\npractices\n2.2 Complying quality\nassurance\nrequirements\n2.3 Complying to\ncost-effective\nmeasures\n2.4 Communication\nskills\n\n--- PDF PAGE 43 ---\nPrinting Services (Prepress Technical Operations) NC I December 2023\n39\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Entrepreneurial mindset\nMay include workplace thinking relating to:\n1.1 Economy in the use of resources\n1.2 Waste management\n1.3 Quality-consciousness\n1.4 Cost-consciousness\n1.5 Safety- and health- consciousness\n2. Quality assurance\npractices\nMay include:\n2.1 Use of quality procedures manual\n2.2 Quality policy\n2.3 Best/Good practices\n2.4 Continuous improvement program\n3. Reliable sources\nMay include:\n3.1 Supervisors\n3.2 Colleagues\n3.3 Clients/Partners\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nDemonstrated affirmation of entrepreneurial mindset\n1.2\nObserved entrepreneurial practices\n1.3\nComplied with cost effective measures\n2. Resource Implications\nThe following resources should be provided:\n2.1\nSimulated or actual workplace\n2.2\nTools, materials and supplies needed to demonstrate\nthe required tasks\n2.3\nReferences and manuals\n3. Methods of Assessment\nCompetency in this unit may be assessed through :\n3.1\nWritten examination\n3.2\nDemonstration/observation with oral questioning\n3.3\nThird-party report\n4. Context of Assessment\n4.1\nCompetency may be assessed in workplace or in a\nsimulated workplace setting\n4.2\nAssessment shall be observed while tasks are being\nundertaken whether individually or in-group\n\n--- PDF PAGE 44 ---\nPrinting Services (Prepress Technical Operations) NC I December 2023\n40\nCOMMON COMPETENCIES\n\nUNIT OF COMPETENCY\n:\nUPDATE INDUSTRY KNOWLEDGE\n\nUNIT CODE\n:"
