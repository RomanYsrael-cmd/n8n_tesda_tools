        "evidence_guide": {
          "source_text": "1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Prepared machines needed for typesetting and\nencoding.\n1.2 Typeset text into the computer using word\nprocessing software.\n1.3 Encoded variable data.\n1.4 Checked copy materials to be scanned for OCR\ntechnology.\n1.5 Performed OCR scanning.\n1.6 Proofread soft copy of input data.\n2. Resource Implications\nThe following resource should be provided:\n2.1 Work area appropriate for the unit of competency\n2.2 Industry standard hardware and software\n2.3 Work instruction appropriate for the unit of\ncompetency\n2.4 Sample materials to be copied\n3. Methods of Assessment\nCompetency in this unit may be assessed through:\n3.1 Demonstration with oral questioning\n3.2 Observation with questioning\n3.3 Interview\n4. Context of Assessment\n4.1 Competency may be assessed in the actual\nworkplace or at the designated TESDA Accredited\nAssessment Center.\n\n--- PDF PAGE 71 ---\nPrinting Services (Prepress Technical Operations) NC I December 2023\n67\nUNIT OF COMPETENCY\n:\nPERFORM LINE REPRODUCTION AND ITS\nREQUIREMENTS\n\nUNIT CODE\n:"
        },
        "source_text": "SOC732303\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes in\nperforming input processing procedures using the\nappropriate hardware and software and the application\nof commonly used tools and equipment.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Typeset /\nencode data\nand variable\ndata\ninformation\ninto the\ncomputer\n1.1 Machines needed for\ntypesetting and\nencoding are prepared\naccording to\nestablished procedure.\n1.2 Texts are typeset into\nthe computer using\nword processing\nsoftware in\naccordance with\nestablished\nprocedures.\n1.3 Paragraph and text\nstyles are applied in\naccordance with\nestablished\nprocedures.\n1.4 Variable data are\nencoded using\nappropriate application.\nTECHNOLOGY\n1.1\nBasic computer\noperations\n1.2\nBasic character\nand paragraph\nstyle\n1.3\nConcept and\nprocedures of\nvariable data\nMATHEMATICS\n1.4\nBasic Math\n1.5\nMensuration\nCOMMUNICATION\n1.6\nVerbal and\nwritten\ncommunication\n1.7\nIntellectual\nproperty\n1.1 Typing words at\nthe average\nspeed set by the\nindustry with\nminimal errors\n1.2 Encoding and\ncoding data\n1.3 Applying\nparagraph and\ntext styles\n2. Perform\nOptical\nCharacter\nRecognition\n(OCR)\nscanning\nprocedures\n2.1 Scanner used for\nOptical Character\nRecognition scanning\nis prepared according\nto established\nprocedures.\n2.2 Copy materials to be\nscanned is checked for\nOptical Character\nRecognition (OCR)\ntechnology.\n2.3 Scanner settings are\nprepared for Optical\nCharacter Recognition\n(OCR) procedures.\n2.4 Optical Character\nRecognition (OCR)\nscanning is performed\nTECHNOLOGY\n2.1\nSelection of\nscanner capable\nof Optical\nCharacter\nRecognition\n(OCR)\n2.2\nOptical Character\nRecognition\n(OCR)\ntechnology\n2.3\nProcedures on\nOptical Character\nRecognition\n(OCR) scanning\n2.1 Checking copy\nmaterials to be\nscanned\n2.2 Operating\ndevice for\nscanning\n2.3 Setting Optical\nCharacter\nRecognition\n(OCR) scanning\n2.4 Handling/keepin\ng supplied\nmaterials with\ncare\n\n--- PDF PAGE 68 ---\nPrinting Services (Prepress Technical Operations) NC I December 2023\n64\nin accordance with\nestablished procedure.\n3. Proofread\ninput data\n3.1 Soft copy of input data\nis proofread in\naccordance with\nestablished\nprocedures.\n3.2 Errors and omissions\nare corrected.\n3.3 Final input data is\nprinted on a desktop\nprinter.\nTECHNOLOGY\n3.1\nProduction of\nhardcopy\nCOMMUNICATION\n3.2\nProcedures of\nproofreading\n3.3\nInsertion of\ncorrections\n3.1 Recognizing\nsoft file marked\nerrors\n3.2 Identifying\nmisspelled\nwords\n3.3 Printing of hard\ncopy\n\n--- PDF PAGE 69 ---\nPrinting Services (Prepress Technical Operations) NC I December 2023\n65\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Word Processing Software May include:\n1.1 MS Word\n1.2 Google Docs\n1.3 Adobe InDesign\n1.4 Notepad\n1.5 Word Perfect\n1.6 Apple Text Edit\n2. Paragraph and Text Styles May include:\n2.1 Capitalization of letter\n2.2 Indention\n2.3 Paragraph Layout\n2.4 Bold, Underline and Italics\n2.5 Tab Alignment\n2.6 Line Spacing\n2.7 Margin\n2.8 Kerning\n3. Variable Data\nMay include:\n3.1 Names and Titles\n3.2 Address\n3.3 Personal Information\n3.4 Contact Details\n3.5 Serial Numbers\n4. Prepared\nMay include:\n4.1 Check Scanner Connection\n4.2 Cleaning of Scanning Table\n4.3 Checking of Sensing Device\n5. Copy Materials\nMay include:\n5.1 Manuscripts\n5.2 Printed Copy\n6. Scanner Settings\nMay include:\n6.1 Reduction/Enlargement\n6.2 Resolutions\n6.3 Batch Scanning\n6.4 Fonts Recognition\n6.5 Image Contrast\n6.6 Bitmapped, Grayscale or Colored\n6.7 Output File Format\n6.8 Saved File Location\n7. Scanning\nMay include:\n7.1 Copy Checking\n7.2 Scanner Copy Settings\n7.3 Scanning Operations\n\n--- PDF PAGE 70 ---\nPrinting Services (Prepress Technical Operations) NC I December 2023\n66\n7.4 Saving Format\n8. Desktop Printer\n\nMay include:\n8.1 Laser Printer\n8.2 Inkjet Printer\n\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Prepared machines needed for typesetting and\nencoding.\n1.2 Typeset text into the computer using word\nprocessing software.\n1.3 Encoded variable data.\n1.4 Checked copy materials to be scanned for OCR\ntechnology.\n1.5 Performed OCR scanning.\n1.6 Proofread soft copy of input data.\n2. Resource Implications\nThe following resource should be provided:\n2.1 Work area appropriate for the unit of competency\n2.2 Industry standard hardware and software\n2.3 Work instruction appropriate for the unit of\ncompetency\n2.4 Sample materials to be copied\n3. Methods of Assessment\nCompetency in this unit may be assessed through:\n3.1 Demonstration with oral questioning\n3.2 Observation with questioning\n3.3 Interview\n4. Context of Assessment\n4.1 Competency may be assessed in the actual\nworkplace or at the designated TESDA Accredited\nAssessment Center.\n\n--- PDF PAGE 71 ---\nPrinting Services (Prepress Technical Operations) NC I December 2023\n67\nUNIT OF COMPETENCY\n:\nPERFORM LINE REPRODUCTION AND ITS\nREQUIREMENTS\n\nUNIT CODE\n:"
