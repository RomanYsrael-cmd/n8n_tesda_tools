        "source_text": "SOC514204\n\nUNIT DESCRIPTOR\n:\nThis unit of competency covers the knowledge, skills and\nattitudes needed to maintain clean, safe and efficient\nworking environment. The unit incorporates the work\nsafety guidelines.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWL EDGE\nREQUIRED\nSKILLS\n1. Comply with\nsafety and\nhealth\nregulations\n1.1 Safety and health\nregulations are\nidentified and complied\nwith.\n1.2 Policies and\nprocedures are\nadapted and applied.\nENVIRONMENT\n1.1 OSHS policies\nand standards\n1.2 Fire code\n1.1 Complying with\nhealth and safety\nregulations\n1.2 Reading and\ncomprehension\n2. Assess work\narea\n2.1 Work areas and\nwalkways are\nmaintained in a safe\nand hazard free\nenvironment.\n2.2 All routines are carried\nout in accordance with\nOccupational Safety\nand Health Standards\n(OSHS).\n2.3 Waste is stored and\ndisposed of according to\nOSHS.\nENVIRONMENT\n2.1 Work Hazards\nPolicies and\nProcedures\n2.2 OSHS policies\nand procedures\n2.3 Waste\nmanagement\n2.1 Complying with\nhealth and\nsafety\nregulations\n3. Check and\nmaintain\ntools,\nequipment\nand\nresources\n3.1 Tools, equipment and\nresources are stored\naccording to safety\nregulations.\n3.2 Tools, equipment and\nresources are checked\nfor maintenance\nrequirements.\n3.3 Tools and equipment are\nreferred for repair as\nrequired.\nENVIRONMENT\n3.1 Maintenance of\ntools and\nequipment\n3.2 Tools,\nequipment and\nresource\nmaintenance\nrequirements\n3.1 Checking for\nmaintenance\nrequirements\n3.2 Storing tools\nand equipment\n\n--- PDF PAGE 50 ---\nPrinting Services (Prepress Technical Operations) NC I December 2023\n46\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Safety and Health\nRegulations\nMay include:\n1.1\nClean Air Act\n1.2\nNational Building Code\n1.3\nPhilippine Electrical Code\n1.4\nFire Code of the Philippines\n1.5\nWaste management statutes and rules\n1.6\nPhilippine Occupational Safety and Health Standards\n1.7\nDOLE OSH related issuances\n1.8\nECC regulations\n2. Policies and\nProcedures\nMay include:\n2.1\nHazard Policies and Procedures\n2.2\nEmergency, Fire and Accident Procedures\n2.3\nPersonal Safety Procedures\n2.4\nProcedures for the use of personal protective clothing\nand equipment\n2.5\nHazard Identification\n2.6\nStandard Operating Procedures\n\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nComplied with safety and health regulations\n1.2\nAssessed work area\n1.3\nChecked and maintained tools, equipment\nand resources\n2. Resource Implications\nThe following resources should be provided:\n2.1\nAccess to relevant venue, tools, equipment\nand resources to perform the tasks\n2.2\nRequired operating manual/s\n2.3\nSafety regulations\n2.4\nRelevant policies and procedures\n3. Method of Assessment\nCompetency in this unit may be assessed through:\n3.1\nDemonstration/Observation with oral questioning\n4. Context of Assessment\n4.1\nCompetency may be assessed in actual workplace or\nat the designated TESDA Accredited Assessment\nCenter.\n\n--- PDF PAGE 51 ---\nPrinting Services (Prepress Technical Operations) NC I December 2023\n47\nUNIT OF COMPETENCY\n:\nPERFORM BASIC COMPUTER OPERATIONS\n\nUNIT CODE\n:"
