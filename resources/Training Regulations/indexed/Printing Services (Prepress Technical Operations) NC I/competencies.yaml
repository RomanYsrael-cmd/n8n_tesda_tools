        "evidence_guide": {
          "source_text": "1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Identified and inspected equipment/machines.\n1.2 Cleaned equipment/machines as per\nmanufacturer’s recommendation using appropriate\ncleaning materials.\n1.3 Changed processing chemicals.\n1.4 Cleaned computer to plate (CTP) systems.\n1.5 Disposed wastes properly.\n1.6 Recorded inspection of equipment/machines.\n1.7 Recorded cleaning procedures.\n1.8 Requested replacement for parts that needs to be\nreplaced.\n1.9 Submitted reports to relevant personnel for\nvalidation.\n2. Methods of Assessment\nCompetency in this unit may be assessed through:\n2.1 Demonstration with questioning\n2.2 Interviews\n2.3 Written examination\n3. Resource Implications\nThe following resources must be provided:\n3.1 Tools, prepress equipment/machine and facilities\nappropriate to processes or activity\n3.2 Supplies and materials relevant to the unit of\ncompetency\n3.3 Workplace or Work Area relevant to the unit of\ncompetency\n4. Context of Assessment\n4.1 Competency may be assessed in the actual\nworkplace or at the designated TESDA Accredited\nAssessment Center.\n\n--- PDF PAGE 80 ---\nPrinting Services (Prepress Technical Operations) NC I December 2023\n76"
        },
        "source_text": "SOC732305\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, discipline, attitudes and\nvalues needed to perform preventive maintenance of\nprepress equipment and machines.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n\n1. Perform minor\npreventive\nmaintenance of\nequipment /\nmachine\n1.1 Equipment/machines\nare identified and\ninspected in\naccordance to standard\nmaintenance\nprocedure.\n1.2 Equipment/machines\nare cleaned as per\nmanufacturer’s\nrecommendation using\nappropriate cleaning\nmaterials.\n1.3 Room temperature\nand humidity are\ncontrolled according to\nmanufacturer’s\nrecommendation.\nTECHNOLOGY\n1.1\nDifferent types of\nequipment /\nmachines\n1.2\nDifferent parts of\nequipment /\nmachines\nENVIRONMENT\n1.3\nAwareness on\nhealth and safety\nprocedures\n1.4\nCleaning\nmaterials and its\nusage\n1.5\n5S principles\n1.6\n3R principles\n(Reduce, Reuse,\nRecycle)\n1.1 Performing\nbasic machine/\nequipment\noperations\n1.2 Applying\nappropriate\ncleaning\nmaterials and\nminor\nmaintenance\nprocedures\n1.3 Practicing 5s\n1.4 Practicing 3Rs\n2. Perform major\npreventive\nmaintenance of\nequipment\n/machine\n2.1 Processing\nchemicals are\nchanged according to\nmanufacturer’s\nstandard maintenance\nprocedure.\n2.2 Computer to plate\n(CTP) systems are\ncleaned according to\nmanufacturer’s\nmaintenance\nprocedure.\n2.3 Wastes are disposed\naccording to proper\nwaste disposal\npractice.\n2.4 Selected parts of\nequipment / machine\nand its consumables\nare replaced according\nTECHNOLOGY\n2.1\nCompany policy\nin relation to\nrelevant\ntechnology\n2.2\nCTP workflow\nsystems and its\noperation\n2.3\nRelevant\nequipment and\noperational\nprocesses\n2.4\nPreventive\nmaintenance\nprocedures\nestablished in the\nplant\nENVIRONMENT\n2.1 Replacing\nprocessing\nchemicals\n2.2 Disposing\nwastes properly\n2.3 Following oral &\nwritten\ninstructions\n\n--- PDF PAGE 76 ---\nPrinting Services (Prepress Technical Operations) NC I December 2023\n72\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n\nto manufacturer’s\nstandard maintenance\nprocedure.\n2.5\nProper waste\ndisposal\n2.6\nAwareness on\nhealth and safety\nprocedures\n3. Perform\nrecording of\nmaintenance\nreport\n3.1 Inspection of\nequipment /machine is\nrecorded in\naccordance with\ncompany’s policies and\nprocedures.\n3.2 Cleaning procedures\nare recorded in\naccordance with\ncompany’s policies and\nprocedures.\n3.3 Parts to be replaced\nare requested for\nreplacement in\naccordance with\ncompany’s policies and\nprocedures.\n3.4 Reports are submitted\nto relevant personnel\nfor validation in\naccordance with\nestablished procedure.\nCOMMUNICATION\n3.1\nEffective\ncommunication\n3.2\nProcedures in\nrecording and\nreporting\n3.1 Written & oral\ncommunications\n3.2 Follow work\ninstructions\n3.3 Attention to\ndetails\n3.4 Time conscious\n\n--- PDF PAGE 77 ---\nPrinting Services (Prepress Technical Operations) NC I December 2023\n73\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Equipment / Machine\nMay include:\n1.1 Computer\n1.2 Desktop Printer\n1.3 Plate Recording Unit\n1.4 Plate Processing Unit\n1.5 Plate Pre-Registering System Device\n1.6 Scanner\n1.7 Digital Cutting Plotter\n1.8 Viewing Light Table\n1.9 Flexographic Plate Imaging System\n1.10 Gravure Cylinder Imaging System\n1.11 Room Air-conditioning Units\n2. Cleaning Materials\n\nMay include:\n2.1 Cleaning Cloth\n2.2 Cleaning Solution\n2.3 Sponge\n2.4 Light Duty Vacuum Cleaner\n2.5 Blower\n2.6 Camel’s Hair Brush\n3. Room Temperature and\nHumidity\n\nMay include:\n3.1 20°c to 25°c temperature\n3.2 30% to 50% humidity\n4. Processing Chemicals\n\nMay include:\n4.1 Developer\n4.2 Plate Protective Gum Solutions\n5. CTP Systems\n\nMay include:\n5.1 Plate Recording Unit\n5.2 Plate Processing Unit\n5.3 Plate Staging Unit\n5.4 Plate Pre-registering System\n6. Wastes\nMay include:\n6.1 Used Developing Solutions\n6.2 Plate Strips\n6.3 Ink Waste\n6.4 Empty Ink Cartridges\n6.5 Used Water\n6.6 Paper Waste\n7. Selected Parts\n\nMay include:\n7.1 Replenishing Hose\n7.2 Viewing Table Light\n7.3 Processing Rollers\n7.4 Ink Cartridges\n8. Consumables\nMay include:\n\n--- PDF PAGE 78 ---\nPrinting Services (Prepress Technical Operations) NC I December 2023\n74\nVARIABLE\nRANGE\n\n8.1 Water Filter\n8.2 Air Filter\n8.3 Ink Pad\n8.4 Printer Ink\n8.5 Plotting Blade\n9. Inspection\nMay include:\n9.1 Inspection Schedules\n9.2 Inspection Checklists\n9.3 Inspection Procedures\n10. Reports\nMay include:\n10.1 Routine Maintenance Report\n10.2 Parts Replacement Report\n\n--- PDF PAGE 79 ---\nPrinting Services (Prepress Technical Operations) NC I December 2023\n75\n\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Identified and inspected equipment/machines.\n1.2 Cleaned equipment/machines as per\nmanufacturer’s recommendation using appropriate\ncleaning materials.\n1.3 Changed processing chemicals.\n1.4 Cleaned computer to plate (CTP) systems.\n1.5 Disposed wastes properly.\n1.6 Recorded inspection of equipment/machines.\n1.7 Recorded cleaning procedures.\n1.8 Requested replacement for parts that needs to be\nreplaced.\n1.9 Submitted reports to relevant personnel for\nvalidation.\n2. Methods of Assessment\nCompetency in this unit may be assessed through:\n2.1 Demonstration with questioning\n2.2 Interviews\n2.3 Written examination\n3. Resource Implications\nThe following resources must be provided:\n3.1 Tools, prepress equipment/machine and facilities\nappropriate to processes or activity\n3.2 Supplies and materials relevant to the unit of\ncompetency\n3.3 Workplace or Work Area relevant to the unit of\ncompetency\n4. Context of Assessment\n4.1 Competency may be assessed in the actual\nworkplace or at the designated TESDA Accredited\nAssessment Center.\n\n--- PDF PAGE 80 ---\nPrinting Services (Prepress Technical Operations) NC I December 2023\n76"
