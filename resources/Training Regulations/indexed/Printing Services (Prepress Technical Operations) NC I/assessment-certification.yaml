tient / client services Apply quality standards Maintain a safe, clean and efficient environment Maintain an effective relationship with clients/ customers (marketing) Perform facial cleansing Perform temporary hair removal activity Perform body scrub Perform pre and post hair care activities Perform hair and scalp treatment Perform basic hair coloring Perform basic hair bleaching Perform basic hair perming Perform hair straightening Perform basic haircutting Perform advanced and creative haircutting Perform advanced and creative hair coloring Perform advanced and creative hair perming Perform basic men’s haircutting Perform shave and style beard and mustache Perform chair manipulative relaxing services Perform manicure and pedicure Perform hand and foot spa Perform preparatory activities Prepare appropriate products, tools and equipment Perform nail enhancement technology procedures Perform post service activities Perform advanced nail polish procedures Apply facial make- up Perform body bleach Network with stakeholders Process labor market information Market and promote services of public employment services office Perform job matching services Perform referral and placement services Perform monitoring of jobseekers Perform livelihood/training referral and facilitation services Perform monitoring of referred livelihood and training applicants Assist in the conduct of career coaching and employment orientation seminar to school-based clients Provide employment orientation and coaching to walk-in clients Provide employment orientation and coaching to other clients --- PDF PAGE 123 --- Printing Services (Prepress Technical Operations) NC I December 2023 119 Participate in the conduct of research and development of new programs Implement employment facilitation services and special programs Organize recruitment activities Clean living room, dining room, bedroom, bathroom and kitchen Wash and iron clothes, linen and fabric Prepare hot and cold meals Provide food and beverage service Perform preparatory activities for data collection Gather data Perform post-data collection activities Perform pre-flighting procedures Perform file handling Perform input processing procedures Perform line reproduction and its requirements Perform preventive maintenance of prepress equipment/machines Perform halftone reproduction and its requirements Perform basic color separation process Perform digital output processing operations Perform imposition procedures Perform regular maintenance of condition-based prepress machines/equipment --- PDF PAGE 124 --- Printing Services (Prepress Technical Operations) NC I December 2023 120 BITMAP File format Also known as bitmap image file, device independent bitmap file format and bitmap, is a raster graphics image file format used to store bitmap digital images, independently of the display device, especially on Microsoft Windows and OS/2 operating systems. Bleed image Refers to an extra 1/8” (. 125 in) of image or background color that extends beyond the trim area of your printing piece. The project is printed on an oversized sheet that is then cut down to size with the appearance that the image is “bleeding” off the edge of the paper. Cloud backup A remote, online, or managed backup service, sometimes marketed as cloud backup or backup-as-a-service, is a service that provides users with a system for the backup, storage, and recovery of computer files. The CMYK acronym stands for Cyan, Magenta, Yellow, and Key: those are the colours used in the printing process. A printing press uses dots of ink to make up the image from these four colours. 'Key' actually means black. Computer file server A central server in a computer network that provides file systems or at least parts of a file system to connected clients. Computer hardware Includes the physical parts of a computer, such as the case, central processing unit (CPU), monitor, mouse, keyboard, computer data storage, graphics card, sound card, speakers and motherboard. By contrast, software is the set of instructions that can be stored and run by hardware. Computer network A group of computers that use a set of common communication protocols over digital interconnections for the purpose of sharing resources located on or provided by the network nodes. Computer peripherals External devices that enhance your machine's functionality through better performance, design, sound quality and more. Add-ons range from essential input devices like keyboards, to enjoyable output devices like speakers. Computer software Software is a set of programs, which is designed to perform a well-defined function. A program is a sequence of instructions written to solve a particular problem. Computer-to-Plate (CTP) An imaging technology used in modern printing processes. In this technology, an image created in a Desktop Publishing (DTP) application is output directly to a printing plate. Consumables Goods used by individuals and businesses that must be replaced regularly because they wear out or are used up. They can also be defined as the components of an end product that is used up or permanently altered in the process of manufacturing such as semiconductor wafers and basic chemicals. --- PDF PAGE 125 --- Printing Services (Prepress Technical Operations) NC I December 2023 121 Data purging A process involving methods that permanently erase and remove data from a storage space. Digital images Raster images have a finite set of digital values, called picture elements or pixels. The digital image contains a fixed number of rows and columns of pixels. Digital proof or Proof A preliminary version of a printed piece, intended to show how the final piece will appear. Proofs are used to view the content, color and design elements before committing the piece to copy plates and press. Disk mirroring The replication of logical disk volumes onto separate physical hard disks in real time to ensure continuous availability. It is most commonly used in RAID 1. A mirrored volume is a complete logical representation of separate volume copies. File format The structure of a file that tells a program how to display its contents. For example, a Microsoft Word document saved in the .DOC file format is best viewed in Microsoft Word. Even if another program can open the file, it may not have all the features needed to display the document correctly. Font A collection of characters with a similar design. These characters include lowercase and uppercase letters, numbers, punctuation marks, and symbols. Changing the font can alter the look and feel of a block of text. Hard copy A printed document. High key image A style of image that uses unusually bright lighting to reduce or completely blow out dark shadows in the image. High key shots usually lack dark tones and the high key look is generally thought of as positive and upbeat. Image capture An application program from Apple that enables users to upload pictures from digital cameras or scanners which are either connected directly to the computer or the network. It provides no organizational tools like iPhoto but is useful for collating pictures from a variety of sources with no need for drivers. Image resolution The number of pixels in an image. Resolution is sometimes identified by the width and height of the image as well as the total number of pixels in the image. Image trapping The compensation for misregistration between printing units on a multicolor press. This misregistration causes gaps or white space on the final printed packaging. Kerning The process of adjusting the spacing between characters in a proportional font, usually to achieve a visually pleasing result. Kerning adjusts the space between individual letterforms, while tracking adjusts spacing uniformly over a range of characters. Leading The distance between each line of text. It is pronounced ledding (like \"sledding\" without the \"s\"). The name comes from a time when typesetting was done by hand and pieces of lead were used to separate the lines. --- PDF PAGE 126 --- Printing Services (Prepress Technical Operations) NC I December 2023 122 Low key image A style of image that utilizes predominantly dark tones to create a dramatic looking image. Where high key lighting seeks to over light the subject to the point of reduced contrast, low key lighting intensifies the contrast in an image through intensely reduced lighting. Malicious software Any malicious program that causes harm to a computer system or network. Malicious Malware Software attacks a computer or network in the form of viruses, worms, trojans, spyware, adware or rootkits. Optical Character Recognition (OCR) The electronic or mechanical conversion of images of typed, handwritten or printed text into machine-encoded text, whether from a scanned document, a photo of a document, a scene-photo (for example the text on signs and billboards in a landscape photo) Overprinting The process of printing one color on top of another in reprographics. This is closely linked to the reprographic technique of 'trapping'. It is also used to create a rich black (often regarded as a color that is \"blacker than black\") by printing black over another dark color. Page layout The arrangement of visual elements on a page. It generally involves organizational principles of composition to achieve specific communication objectives. Paragraph styles Generally applied to one or more paragraphs. Note that border and background attributes are set separately but they are actually a subset of the paragraph attributes. Pixelated The pixel (a word invented from \"picture element\") is the basic unit of programmable color on a computer display or in a computer image. Think of it as a logical - rather than a physical - unit. The physical size of a pixel depends on how you've set the resolution for the display screen. Pre-flighting The process of checking if the digital data required to print a job are all present and valid. Nowadays PDF files are sent to printing companies. The PDF file format is a solid standard to exchange pages, ranging from single ads to complete publications. Prepress The term used in the printing and publishing industries for the processes and procedures that occur between the creation of a print layout and the final printing. Press Printing presses use ink to transfer text and images to paper. Medieval presses used a handle to turn a wooden screw and push against paper laid over the type and mounted on a platen. Metal presses, developed late in the 18th century, and used steam to drive a cylinder press. Process colors A way of mixing inks to create colors during the actual printing process itself. A process color is printed using a combination of the four standard process inks: cyan, magenta, yellow and black (CMYK). Also used in offset printing, process colors are the more common method of printing. --- PDF PAGE 127 --- Printing Services (Prepress Technical Operations) NC I December 2023 123 Raster image A dot matrix data structure that represents a generally rectangular grid of pixels (points of color), viewable via a computer display, paper, or other display medium. Raster image processor A component used in a printing system which produces a raster image also known as a bitmap. Such a bitmap is used by a later stage of the printing system to produce the printed output. Raw file Collection of unprocessed data. This means the file has not been altered, compressed, or manipulated in any way by the computer. Reproducible copies To make a copy, representation, or imitation of; duplicate Image resolution The detail an image holds. The term applies to raster digital images, film images, and other types of images. Higher resolution means more image detail. Image resolution can be measured in various ways. Resolution quantifies how close lines can be to each other and still be visibly resolved. Scanning procedures A process of recording an exact image of a document Soft copy A document saved on a computer. It is the electronic version of a document, which can be opened and edited using a software program. Spot color Any color generated by an ink (pure or mixed) that is printed using a single run, whereas a process color is produced by printing a series of dots of different colors. Storage devices Any type of hardware that stores data. The most common type of storage device, which nearly all computers have, is a hard drive. Text styles A resource that specifies text attributes, including the font, size, line spacing, font style, text alignment, and text and background colors. Typesetting/Encoding The process of putting text onto a page so it's print-ready. Variable data Aata that is acquired through measurements, such as length, time, diameter, strength, weight, temperature, density, thickness, pressure, and height. Vector graphics Vector graphics are computer graphics images that are defined in terms of points which are connected by lines and curves to form polygons and other shapes. Word processing software A word processor is a device or computer program that provides for input, editing, formatting, and output of text, often with some additional features. --- PDF PAGE 128 --- Printing Services (Prepress Technical Operations) NC I December 2023 124 AI Adobe Illustrator file extension CDR CorelDRAW file extension CMS Color Management System Cyan, Magenta, Yellow, Black CtP Computer-to-Plate DVI Digital Visual Interface EPS Encapsulated PostScript file extension GCR Gray Component Replacement High-Definition Multimedia Interface Adobe InDesign file extension JO Job Order Joint Photographic Experts Group LED Light-Emitting Diode OCR Optical Character Recognition OHS Occupational Health and Safety PDF Portable Document Format PS Postscript PSD Photoshop Document file extension RAM Random-Access Memory RGB Red, Green, and Blue RIP Raster Image Processor Tagged Image File Format file extension UCR Under Color Removal USB Universal Serial Bus VGA Video 