  "source_text": "COMPETENCY MAP – SOCIAL AND OTHER COMMUNITY\nDEVELOPMENT SERVICES SECTOR\nPRINTING SERVICES (PREPRESS TECHNICAL OPERATIONS) NC I\nBASIC\nCOMPETENCIES\n\n--- PDF PAGE 122 ---\nPrinting Services (Prepress Technical Operations) NC I\nDecember 2023\n\n118\n\nMaintain instruments\nand equipment in\nwork area\nAssist in dental\nlaboratory\nprocedures\nAssist with\nadministration in\ndental laboratory\npractice\nImplement and\nmonitor infection\ncontrol policies and\nprocedures\nRespond effectively\nto difficult/\nchallenging\nbehavior\nApply basic first\naid\nMaintain high\nstandard of\npatient / client\nservices\nApply quality\nstandards\nMaintain an\neffective\nrelationship with\ncustomers and\nclients\nMaintain an\neffective\nrelationship with\nclients/ customers\n(marketing)\n\nUpdate industry\nknowledge\nManage own\nperformance\nMaintain a safe,\nclean and efficient\nenvironment\nPerform computer\noperations\n\nFollow occupational\nhealth and safety\npolicies in dental\nlaboratory facilities\nMaintain\ninfection control\nin dental\npractice\nOperate a\npersonal\ncomputer\nPerform\nworkplace\nsecurity and\nsafety practices\nUpdate industry\nknowledge and\npractice through\ncontinuing\neducation\nUse\npharmaceutical\ncalculation\ntechniques and\nterminologies\n\nMaintain instruments\nand equipment in\nwork area\nAssist in dental\nlaboratory\nprocedures\nAssist with\nadministration in\ndental laboratory\npractice\nImplement and\nmonitor infection\ncontrol policies and\nprocedures\nRespond effectively\nto difficult/\nchallenging\nbehavior\nApply basic first\naid\nMaintain high\nstandard of\npatient / client\nservices\nApply quality\nstandards\nMaintain a safe,\nclean and\nefficient\nenvironment\nMaintain an\neffective\nrelationship with\nclients/ customers\n(marketing)\n\nPerform facial\ncleansing\nPerform temporary hair\nremoval activity\nPerform body scrub\nPerform pre and post\nhair care activities\nPerform hair and\nscalp treatment\nPerform basic hair\ncoloring\nPerform basic hair\nbleaching\nPerform basic hair\nperming\nPerform hair\nstraightening\nPerform basic\nhaircutting\nPerform advanced and\ncreative haircutting\nPerform advanced\nand creative hair\ncoloring\nPerform advanced\nand creative hair\nperming\nPerform basic men’s\nhaircutting\nPerform shave and\nstyle beard and\nmustache\nPerform chair\nmanipulative\nrelaxing services\nPerform manicure\nand pedicure\nPerform hand and\nfoot spa\nPerform preparatory\nactivities\nPrepare appropriate\nproducts, tools and\nequipment\nPerform nail\nenhancement\ntechnology\nprocedures\nPerform post service\nactivities\nPerform advanced\nnail polish\nprocedures\nApply facial make-\nup\nPerform body\nbleach\nNetwork with\nstakeholders\nProcess labor\nmarket information\nMarket and promote\nservices of public\nemployment\nservices office\nPerform job matching\nservices\nPerform referral and\nplacement services\nPerform monitoring of\njobseekers\nPerform\nlivelihood/training\nreferral and\nfacilitation services\nPerform monitoring\nof referred livelihood\nand training\napplicants\nAssist in the\nconduct of career\ncoaching and\nemployment\norientation seminar\nto school-based\nclients\nProvide\nemployment\norientation and\ncoaching to walk-in\nclients\nProvide\nemployment\norientation and\ncoaching to other\nclients\nCORE\nCOMPETENCIES\n\n--- PDF PAGE 123 ---\nPrinting Services (Prepress Technical Operations) NC I\nDecember 2023\n\n119\n\nParticipate in the\nconduct of research\nand development of\nnew programs\nImplement employment\nfacilitation services and\nspecial programs\nOrganize\nrecruitment\nactivities\nClean living room,\ndining room,\nbedroom, bathroom\nand kitchen\nWash and iron\nclothes, linen and\nfabric\nPrepare hot and\ncold meals\nProvide food and\nbeverage service\nPerform preparatory\nactivities for data\ncollection\nGather data\nPerform post-data\ncollection activities\nPerform pre-flighting\nprocedures\nPerform file\nhandling\nPerform input\nprocessing\nprocedures\nPerform line\nreproduction and its\nrequirements\nPerform preventive\nmaintenance of\nprepress\nequipment/machines\nPerform halftone\nreproduction and its\nrequirements\nPerform basic color\nseparation process\nPerform digital\noutput processing\noperations\nPerform imposition\nprocedures\nPerform regular\nmaintenance of\ncondition-based\nprepress\nmachines/equipment\n\n--- PDF PAGE 124 ---\nPrinting Services (Prepress Technical Operations) NC I December 2023\n\n120\n\nGLOSSARY OF TERMS\n\nBITMAP File format\nAlso known as bitmap image file, device independent\nbitmap file format and bitmap, is a raster graphics image file\nformat used to store bitmap digital images, independently of\nthe display device, especially on Microsoft Windows and\nOS/2 operating systems.\nBleed image\nRefers to an extra 1/8” (. 125 in) of image or background\ncolor that extends beyond the trim area of your printing\npiece. The project is printed on an oversized sheet that is\nthen cut down to size with the appearance that the image is\n“bleeding” off the edge of the paper.\nCloud backup\nA remote, online, or managed backup service, sometimes\nmarketed as cloud backup or backup-as-a-service, is a\nservice that provides users with a system for the backup,\nstorage, and recovery of computer files.\nCMYK\nThe CMYK acronym stands for Cyan, Magenta, Yellow, and\nKey: those are the colours used in the printing process. A\nprinting press uses dots of ink to make up the image from\nthese four colours. 'Key' actually means black.\nComputer file server\nA central server in a computer network that provides file\nsystems or at least parts of a file system to connected\nclients.\nComputer hardware\nIncludes the physical parts of a computer, such as the case,\ncentral processing unit (CPU), monitor, mouse, keyboard,\ncomputer data storage, graphics card, sound card,\nspeakers and motherboard. By contrast, software is the set\nof instructions that can be stored and run by hardware.\nComputer network\nA group of computers that use a set of common\ncommunication protocols over digital interconnections for\nthe purpose of sharing resources located on or provided by\nthe network nodes.\nComputer peripherals\nExternal devices that enhance your machine's functionality\nthrough better performance, design, sound quality and\nmore. Add-ons range from essential input devices like\nkeyboards, to enjoyable output devices like speakers.\nComputer software\nSoftware is a set of programs, which is designed to perform\na well-defined function. A program is a sequence of\ninstructions written to solve a particular problem.\nComputer-to-Plate (CTP)\nAn imaging technology used in modern printing processes.\nIn this technology, an image created in a Desktop\nPublishing (DTP) application is output directly to a printing\nplate.\nConsumables\nGoods used by individuals and businesses that must be\nreplaced regularly because they wear out or are used up.\nThey can also be defined as the components of an end\nproduct that is used up or permanently altered in the\nprocess of manufacturing such as semiconductor wafers\nand basic chemicals.\n\n--- PDF PAGE 125 ---\nPrinting Services (Prepress Technical Operations) NC I December 2023\n\n121\n\nData purging\nA process involving methods that permanently erase and\nremove data from a storage space.\nDigital images\nRaster images have a finite set of digital values, called\npicture elements or pixels. The digital image contains a\nfixed number of rows and columns of pixels.\nDigital proof or Proof\nA preliminary version of a printed piece, intended to show\nhow the final piece will appear. Proofs are used to view the\ncontent, color and design elements before committing the\npiece to copy plates and press.\nDisk mirroring\nThe replication of logical disk volumes onto separate\nphysical hard disks in real time to ensure continuous\navailability. It is most commonly used in RAID 1. A mirrored\nvolume is a complete logical representation of separate\nvolume copies.\nFile format\nThe structure of a file that tells a program how to display its\ncontents. For example, a Microsoft Word document saved\nin the .DOC file format is best viewed in Microsoft Word.\nEven if another program can open the file, it may not have\nall the features needed to display the document correctly.\nFont\nA collection of characters with a similar design. These\ncharacters include lowercase and uppercase letters,\nnumbers, punctuation marks, and symbols. Changing the\nfont can alter the look and feel of a block of text.\nHard copy\nA printed document.\nHigh key image\nA style of image that uses unusually bright lighting to reduce\nor completely blow out dark shadows in the image. High key\nshots usually lack dark tones and the high key look is\ngenerally thought of as positive and upbeat.\nImage capture\nAn application program from Apple that enables users to\nupload pictures from digital cameras or scanners which are\neither connected directly to the computer or the network. It\nprovides no organizational tools like iPhoto but is useful for\ncollating pictures from a variety of sources with no need for\ndrivers.\nImage resolution\nThe number of pixels in an image. Resolution is sometimes\nidentified by the width and height of the image as well as\nthe total number of pixels in the image.\nImage trapping\nThe compensation for misregistration between printing units\non a multicolor press. This misregistration causes gaps or\nwhite space on the final printed packaging.\nKerning\nThe process of adjusting the spacing between characters in\na proportional font, usually to achieve a visually pleasing\nresult. Kerning adjusts the space between individual\nletterforms, while tracking adjusts spacing uniformly over a\nrange of characters.\nLeading\nThe distance between each line of text. It is pronounced\nledding (like \"sledding\" without the \"s\"). The name comes\nfrom a time when typesetting was done by hand and pieces\nof lead were used to separate the lines.\n\n--- PDF PAGE 126 ---\nPrinting Services (Prepress Technical Operations) NC I December 2023\n\n122\n\nLow key image\nA style of image that utilizes predominantly dark tones to\ncreate a dramatic looking image. Where high key lighting\nseeks to over light the subject to the point of reduced\ncontrast, low key lighting intensifies the contrast in an image\nthrough intensely reduced lighting.\nMalicious software\nAny malicious program that causes harm to a computer\nsystem or network. Malicious Malware Software attacks a\ncomputer or network in the form of viruses, worms, trojans,\nspyware, adware or rootkits.\nOptical Character Recognition\n(OCR)\nThe electronic or mechanical conversion of images of typed,\nhandwritten or printed text into machine-encoded text,\nwhether from a scanned document, a photo of a document,\na scene-photo (for example the text on signs and billboards\nin a landscape photo)\nOverprinting\nThe process of printing one color on top of another in\nreprographics. This is closely linked to the reprographic\ntechnique of 'trapping'. It is also used to create a rich black\n(often regarded as a color that is \"blacker than black\") by\nprinting black over another dark color.\nPage layout\nThe arrangement of visual elements on a page. It generally\ninvolves organizational principles of composition to achieve\nspecific communication objectives.\nParagraph styles\nGenerally applied to one or more paragraphs. Note that\nborder and background attributes are set separately but\nthey are actually a subset of the paragraph attributes.\nPixelated\nThe pixel (a word invented from \"picture element\") is the\nbasic unit of programmable color on a computer display or\nin a computer image. Think of it as a logical - rather than a\nphysical - unit. The physical size of a pixel depends on how\nyou've set the resolution for the display screen.\nPre-flighting\nThe process of checking if the digital data required to print\na job are all present and valid. Nowadays PDF files are sent\nto printing companies. The PDF file format is a solid\nstandard to exchange pages, ranging from single ads to\ncomplete publications.\nPrepress\nThe term used in the printing and publishing industries for\nthe processes and procedures that occur between the\ncreation of a print layout and the final printing.\nPress\nPrinting presses use ink to transfer text and images to\npaper. Medieval presses used a handle to turn a wooden\nscrew and push against paper laid over the type and\nmounted on a platen. Metal presses, developed late in the\n18th century, and used steam to drive a cylinder press.\nProcess colors\nA way of mixing inks to create colors during the actual\nprinting process itself. A process color is printed using a\ncombination of the four standard process inks: cyan,\nmagenta, yellow and black (CMYK). Also used in offset\nprinting, process colors are the more common method of\nprinting.\n\n--- PDF PAGE 127 ---\nPrinting Services (Prepress Technical Operations) NC I December 2023\n\n123\n\nRaster image\nA dot matrix data structure that represents a generally\nrectangular grid of pixels (points of color), viewable via a\ncomputer display, paper, or other display medium.\nRaster image processor\nA component used in a printing system which produces a\nraster image also known as a bitmap. Such a bitmap is used\nby a later stage of the printing system to produce the printed\noutput.\nRaw file\nCollection of unprocessed data. This means the file has not\nbeen altered, compressed, or manipulated in any way by\nthe computer.\nReproducible copies\nTo make a copy, representation, or imitation of; duplicate\nImage resolution\nThe detail an image holds. The term applies to raster digital\nimages, film images, and other types of images. Higher\nresolution means more image detail. Image resolution can\nbe measured in various ways. Resolution quantifies how\nclose lines can be to each other and still be visibly resolved.\nScanning procedures\nA process of recording an exact image of a document\nSoft copy\nA document saved on a computer. It is the electronic\nversion of a document, which can be opened and edited\nusing a software program.\nSpot color\nAny color generated by an ink (pure or mixed) that is printed\nusing a single run, whereas a process color is produced by\nprinting a series of dots of different colors.\nStorage devices\nAny type of hardware that stores data. The most common\ntype of storage device, which nearly all computers have, is\na hard drive.\nText styles\nA resource that specifies text attributes, including the font,\nsize, line spacing, font style, text alignment, and text and\nbackground colors.\nTypesetting/Encoding\nThe process of putting text onto a page so it's print-ready.\nVariable data\nAata that is acquired through measurements, such as\nlength, time, diameter, strength, weight, temperature,\ndensity, thickness, pressure, and height.\nVector graphics\nVector graphics are computer graphics images that are\ndefined in terms of points which are connected by lines and\ncurves to form polygons and other shapes.\nWord processing software\nA word processor is a device or computer program that\nprovides for input, editing, formatting, and output of text,\noften with some additional features.\n\n--- PDF PAGE 128 ---\nPrinting Services (Prepress Technical Operations) NC I December 2023\n\n124\n\nACRONYMS\n\nAI\nAdobe Illustrator file extension\nCDR\nCorelDRAW file extension\nCMS\nColor Management System\nCMYK\nCyan, Magenta, Yellow, Black\nCtP\nComputer-to-Plate\nDVI\nDigital Visual Interface\nEPS\nEncapsulated PostScript file extension\nGCR\nGray Component Replacement\nHDMI\nHigh-Definition Multimedia Interface\nINDD\nAdobe InDesign file extension\nJO\nJob Order\nJPEG\nJoint Photographic Experts Group\nLED\nLight-Emitting Diode\nOCR\nOptical Character Recognition\nOHS\nOccupational Health and Safety\nPDF\nPortable Document Format\nPS\nPostscript\nPSD\nPhotoshop Document file extension\nRAM\nRandom-Access Memory\nRGB\nRed, Green, and Blue\nRIP\nRaster Image Processor\nTIFF/TIF\nTagged Image File Format file extension\nUCR\nUnder Color Removal\nUSB\nUniversal Serial Bus\nVGA\nVideo Graphics Array\n\n--- PDF PAGE 129 ---\nPrinting Services (Prepress Technical Operations) NC I December 2023\n\n125",
