  "source_section_text": "SECTION 3 TRAINING ARRANGEMENTS\n\nThese standards are set to provide technical and vocational education and training\n(TVET) providers with information and other important requirements to consider when\ndesigning training programs for PRINTING SERVICES (PREPRESS TECHNICAL\nOPERATIONS) NC I.\n\n3.1\nCURRICULUM DESIGN\n\nTESDA shall provide the training on the development of competency-based\ncurricula to enable training providers develop their own curricula with the components\nmentioned below.\n\nDelivery of knowledge requirements for the basic, common and core units of\ncompetency specifically in the areas of mathematics, science/technology,\ncommunication/language and other academic subjects shall be contextualized. To this\nend, TVET providers shall develop a Contextual Learning Matrix (CLM) to accompany\nthe curricula.\n\nCourse Title: PRINTING SERVICES NC Level: NC I\n (PREPRESS TECHNICAL OPERATIONS)\n\nNominal Training Duration:\n\n47 hours\nBasic Competencies\n\n45 hours\nCommon Competencies\n\n308 hours\nCore Competencies\n\n400 hours TOTAL\n\nCourse Description:\n\nThis course is designed to provide the learner with knowledge, skills and\nattitude, applicable in performing work activities involve in performing pre-flighting\nprocedures, performing file management, performing input processing procedures,\nperforming line reproduction and its requirements, performing preventive maintenance\nof prepress equipment/machines\n\nUpon completion of the course, the learners are expected to demonstrate the\nabove-mentioned competencies to be employed. To obtain this, all units prescribed\nfor this qualification must be achieved.\n\n--- PDF PAGE 81 ---\nPrinting Services (Prepress Technical Operations) NC I December 2023\n77\nBASIC COMPETENCIES\n(47 HOURS)\n\n Unit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n1. Receive and\nrespond to\nworkplace\ncommunication\n1.1 Follow rout