    "source_text": "3.1\nCURRICULUM DESIGN\n\nTESDA shall provide the training on the development of competency-based\ncurricula to enable training providers develop their own curricula with the components\nmentioned below.\n\nDelivery of knowledge requirements for the basic, common and core units of\ncompetency specifically in the areas of mathematics, science/technology,\ncommunication/language and other academic subjects shall be contextualized. To this\nend, TVET providers shall develop a Contextual Learning Matrix (CLM) to accompany\nthe curricula.\n\nCourse Title: PRINTING SERVICES NC Level: NC I\n (PREPRESS TECHNICAL OPERATIONS)\n\nNominal Training Duration:\n\n47 hours\nBasic Competencies\n\n45 hours\nCommon Competencies\n\n308 hours\nCore Competencies\n\n400 hours TOTAL\n\nCourse Description:\n\nThis course is designed to provide the learner with knowledge, skills and\nattitude, applicable in performing work activities involve in performing pre-flighting\nprocedures, performing file management, performing input processing procedures,\nperforming line reproduction and its requirements, performing preventive maintenance\nof prepress equipment/machines\n\nUpon completion of the course, the learners are expected to demonstrate the\nabove-mentioned competencies to be employed. To obtain this, all units prescribed\nfor this qualification must be achieved.\n\n--- PDF PAGE 81 ---\nPrinting Services (Prepress Technical Operations) NC I December 2023\n77\nBASIC COMPETENCIES\n(47 HOURS)\n\n Unit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n1. Receive and\nrespond to\nworkplace\ncommunication\n1.1 Follow routine\nspoken\nmessages\n• Exercise Conciseness in receiving and\nclarifying messages/ information/\ncommunication\n• Group discussion\n• Interaction\n• Reportorial\n• Modular\n• Interviews/\n• Questioning\n• Practical/\n• Performance Test\n• Observation\n4 hours\n\n1.2 Perform\nworkplace duties\nfollowing written\nnotices\n• Practice Accuracy in following written/ oral\ninstruction/ information\n• Practice written and oral communication\nskills\n• Case Study in handling written\ncommunication\n• Practice relaying/ disseminating messages/\ninformation\n• Analyze different messages\n\n• Lecture/\n• Discussion\n• Demonstration\n• Case Study\n\n• Written\n• Practical\n• Written\n• Demonstration\n\n4 hours\n2. Work with\nothers\n2.1 Develop effective\nworkplace\nrelationships\n\n• Read job description and organizations\npolicies relevant to work role\n• Read personnel code of conduct and\ndiscipline\n• Role play on cooperation and good\nrelationship\n• Study table of organization and identify team\nmembers\n• Role play on team work.\n• Role play on receiving feedback from\nsupervisor\n• Role play on providing feedback.\n• Listen to lecture on Valuing and\nexemplifying respect and empathy in the\nworkplace\n• Individual Work\n• Discussion\n• Role Play\n• Lecture\n• Role Play\n• Structured\nactivity\n• Written Test\n2 hours\n\n--- PDF PAGE 82 ---\nPrinting Services (Prepress Technical Operations) NC I December 2023\n78\n Unit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\n2.2 Contribute to\nwork group\nactivities\n•\nDiscussion on creative collaboration, social\nperceptiveness and problem sensitivity\n•\nRole play on creative collaboration, social\nperceptiveness and problem sensitivity.\n•\nParticipate in a goal setting activity\n•\nParticipate in planning and implementation\nof a group activity.\n•\nParticipate in evaluation of the group\nactivity\n• Lecture/\nDiscussion\n• Role Play\n• Group Work\n• Role Play\n• Structured\nactivity\n• Written Test\n1 hour\n3. Solve/address\nroutine\nproblems\n3.1 Identify the\nproblem\n•\nShow mastery of the current industry\nhardware and software products and\nservices\n- Show mastery of knowledge and\nunderstanding of the process, normal\noperating parameters, and product\nquality to recognize non-standard\nsituations\n- Relevant equipment and operational\nprocesses\n- Enterprise goals, targets and\nmeasures\n- Enterprise quality OHS and\nenvironmental requirement\n- Enterprise information systems and\ndata collation\n- Industry codes and standards\n•\nUse range of formal problem-solving\ntechniques (e.g., planning, attention,\nsimultaneous and successive processing\nof information)\n•\nIdentify and clarify the nature of the\nproblem\n\n• Interactive Lecture\n• Appreciative\nInquiry\n• Demonstration\n• Case Formulation\n• Life Narrative\nInquiry (Interview)\n• Standardized test\n\n1 hour\n\n--- PDF PAGE 83 ---\nPrinting Services (Prepress Technical Operations) NC I December 2023\n79\n Unit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\n3.2 Assess\nfundamental\ncauses of\nproblem\n\n•\nShow mastery of the current industry\nhardware and software products and\nservices\n- Show mastery of knowledge and\nunderstanding of the process, normal\noperating parameters, and product\nquality to recognize non-standard\nsituations\n- Relevant equipment and operational\nprocesses\n- Enterprise goals, targets and\nmeasures\n- Enterprise quality OHS and\nenvironmental requirement\n- Enterprise information systems and\ndata collation\n- Industry codes and standards\n•\nUse range of formal problem-solving\ntechniques (e.g., planning, attention,\nsimultaneous and successive processing\nof information)\n•\nIdentify and clarify the nature of the\nproblem\n\n• Group discussion\n• Lecture\n• Demonstration\n• Role play\n• Case Formulation\n• Life Narrative\nInquiry (Interview)\n• Standardized test\n\n1 hour\n\n--- PDF PAGE 84 ---\nPrinting Services (Prepress Technical Operations) NC I December 2023\n80\n Unit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\n3.3 Determine\ncorrective action\n•\nShow mastery of the current industry\nhardware and software products and\nservices\n- Show mastery of knowledge and\nunderstanding of the process, normal\noperating parameters, and product\nquality to recognize non-standard\nsituations\n- Relevant equipment and operational\nprocesses\n- Enterprise goals, targets and\nmeasures\n- Enterprise quality OHS and\nenvironmental requirement\n- Enterprise information systems and\ndata collation\n- Industry codes and standards\n•\nUse range of formal problem-solving\ntechniques (e.g., planning, attention,\nsimultaneous and successive processing\nof information)\n•\nIdentify and clarify the nature of the\nproblem\n\n• Group discussion\n• Lecture\n• Demonstration\n• Role play\n• Case Formulation\n• Life Narrative\nInquiry (Interview)\n• Standardized test\n\n1 hour\n\n--- PDF PAGE 85 ---\nPrinting Services (Prepress Technical Operations) NC I December 2023\n81\n Unit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\n3.4 Communicate\naction plans and\nrecommendations\nto routine\nproblems\n•\nShow mastery of the current industry\nhardware and software products and\nservices\n- Show mastery of knowledge and\nunderstanding of the process, normal\noperating parameters, and product\nquality to recognize non-standard\nsituations\n- Relevant equipment and operational\nprocesses\n- Enterprise goals, targets and\nmeasures\n- Enterprise quality OHS and\nenvironmental requirement\n- Enterprise information systems and\ndata collation\n- Industry codes and standards\n•\nUse range of formal problem-solving\ntechniques (e.g., planning, attention,\nsimultaneous and successive processing\nof information)\n•\nIdentify and clarify the nature of the\nproblem\n• Group discussion\n• Lecture\n• Demonstration\n• Role playing\n• Case Formulation\n• Life Narrative\nInquiry (Interview)\n• Standardized test\n1 hour\n4. Enhance Self-\nManagement\nSkills\n\n4.1 Set personal and\ncareer goals\n•\nDefine and set personal goals and career\ngoals\n•\nDescribe the SMART Model for goal\nsetting\n•\nCreate personal and career goals using\nSMART Model for goal setting\n•\nExplain and apply the principles of goal\nsetting according to Locke & Latham\n• Discussion\n• Making of personal\nand career goals\nby students\n• Brainstorming\n• Demonstration or\nsimulation with oral\nquestioning\n• Case problems\ninvolving\nworkplace diversity\nissues\n1 hour\n\n--- PDF PAGE 86 ---\nPrinting Services (Prepress Technical Operations) NC I December 2023\n82\n Unit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\n4.2 Recognize\nemotions\n•\nIdentify common positive and negative\nemotions manifested in the workplace\n•\nDistinguish professional and non-\nprofessional behaviors in the workplace\n•\nRecognize triggers and implications of\npositive and negative emotions in the\nworkplace\n•\nRespond with appropriate emotions and\nidentify possible consequences of\ninappropriate emotional responses in a\nsocial and work-related context\n• Discussion\n• Interactive Lecture\n• Brainstorming\n• Demonstration or\nsimulation with oral\nquestioning\n• Case problems\ninvolving\nworkplace diversity\nissues\n\n1 hour\n\n4.3 Describe oneself\nas a learner\n• Review Kolb’s Theory of Learning Styles\n• Describe VAK Learning Style Model\n(Visual, Auditory, Kinesthetic)\n• Cite learning strategies appropriate to\nspecific tasks and describe work practices\nthat assist learning\n• Identify factors and strategies that assist\nlearning\n• Apply learning styles to positively influence\nschool/work performance\n• Use appropriate learning strategies to\nimprove study habits and learning\n• Discussion\n• Interactive Lecture\n• Brainstorming\n• Simulation\n• Demonstration or\nsimulation with oral\nquestioning\n• Case problems\ninvolving\nworkplace diversity\nissues\n1 hour\n\n--- PDF PAGE 87 ---\nPrinting Services (Prepress Technical Operations) NC I December 2023\n83\n Unit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n5. Support\nInnovation\n5.1 Identify the need\nfor innovation in\none’s area of work\n• Show mastery of the clear-cut definition of\ninnovation and its characteristics\n• Identify the need for innovation in one’s\nwork area\n• Identify work procedures needing change\n• Contribute to brainstorming sessions with\nco-workers on identifying tasks needing\nchange\n• Interactive Lecture\n• Appreciative\nInquiry\n• Demonstration\n• Group work\n• Psychological and\nbehavioral\nInterviews\n• Performance\nEvaluation\n• Life Narrative\nInquiry\n• Review of\nportfolios of\nevidence and\nthird-party\nworkplace reports\nof on-the-job\nperformance.\n• Standardized\nassessment of\ncharacter\nstrengths and\nvirtues applied\n1 hour\n\n--- PDF PAGE 88 ---\nPrinting Services (Prepress Technical Operations) NC I December 2023\n84\n Unit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\n5.2 Recognize\ninnovative and\ncreative ideas\n• Identify resources needed for change and\npotential obstacles as well\n• Show positive attitudes and behaviors in\naccepting and in needing change in one’s\nwork area\n• Delineate differences between creativity and\ninnovation\n• Interactive Lecture\n• Appreciative\nInquiry\n• Demonstration\n• Group work\n• Psychological and\nbehavioral\nInterviews\n• Performance\nEvaluation\n• Life Narrative\nInquiry\n• Review of\nportfolios of\nevidence and\nthird-party\nworkplace reports\nof on-the-job\nperformance.\n• Standardized\nassessment of\ncharacter\nstrengths and\nvirtues applied\n1 hour\n\n--- PDF PAGE 89 ---\nPrinting Services (Prepress Technical Operations) NC I December 2023\n85\n Unit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\n5.3 Support\nindividuals’\naccess to flexible\nand innovative\nways of working\n• Identify different roles of employees/workers\nin the improvement of practices in the\norganization\n• Identify practices for flexible and innovative\nways of working\n• Share information with co-workers\n• Detect potential problems in implementing\nflexible ways of working\n• Interactive\nLecture\n• Appreciative\nInquiry\n• Demonstration\n• Group work\n• Psychological and\nbehavioral\nInterviews\n• Performance\nEvaluation\n• Life Narrative\nInquiry\n• Review of\nportfolios of\nevidence and\nthird-party\nworkplace reports\nof on-the-job\nperformance.\n• Standardized\nassessment of\ncharacter\nstrengths and\nvirtues applied\n• Review of\nportfolios of\nevidence and\nthird-party\nworkplace reports\nof on-the-job\nperformance.\n• Standardized\nassessment of\ncharacter\nstrengths and\nvirtues applied\n1 hour\n\n--- PDF PAGE 90 ---\nPrinting Services (Prepress Technical Operations) NC I December 2023\n86\n Unit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n6. Access and\nmaintain\ninformation\n\n6.1 Identify and\ngather needed\ninformation\n• Lecture and discussion on:\n-\nPolicies, procedures and guidelines\nrelating to information handling in the\npublic and private sector, including\nconfidentiality, privacy, security, freedom\nof information\n-\nData collection and management\nprocedures\n-\nPublic/private sector standards\n• Identify sources to produce required\ninformation\n• Perform exercises on information gathering\n• Lecture\n• Demonstration\n• Practical exercises\n• Oral evaluation\n• Written Test\n• Observation\n3 hours\n\n6.2 Search for\ninformation on\nthe internet or an\nintranet\n• Lecture and discussion on:\n-\nTechniques in finding useful information\n-\nSearch engines for information\n• Find and select appropriate information\n• Perform information searching on the\ninternet using different search engines\n• Group discussion\n• Lecture\n• Demonstration\n• Practical exercises\n• Oral evaluation\n• Written T