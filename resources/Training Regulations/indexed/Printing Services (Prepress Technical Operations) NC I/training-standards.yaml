    "source_text": "SECTION 3 TRAINING ARRANGEMENTS\n\nThese standards are set to provide technical and vocational education and training\n(TVET) providers with information and other important requirements to consider when\ndesigning training programs for PRINTING SERVICES (PREPRESS TECHNICAL\nOPERATIONS) NC I.\n\n3.1\nCURRICULUM DESIGN\n\nTESDA shall provide the training on the development of competency-based\ncurricula to enable training providers develop their own curricula with the components\nmentioned below.\n\nDelivery of knowledge requirements for the basic, common and core units of\ncompetency specifically in the areas of mathematics, science/technology,\ncommunication/language and other academic subjects shall be contextualized. To this\nend, TVET providers shall develop a Contextual Learning Matrix (CLM) to accompany\nthe curricula.\n\nCourse Title: PRINTING SERVICES NC Level: NC I\n (PREPRESS TECHNICAL OPERATIONS)\n\nNominal Training Duration:\n\n47 hours\nBasic Competencies\n\n45 hours\nCommon Competencies\n\n308 hours\nCore Competencies\n\n400 hours TOTAL\n\nCourse Description:\n\nThis course is designed to provide the learner with knowledge, skills and\nattitude, applicable in performing work activities involve in performing pre-flighting\nprocedures, performing file management, performing input processing procedures,\nperforming line reproduction and its requirements, performing preventive maintenance\nof prepress equipment/machines\n\nUpon completion of the course, the learners are expected to demonstrate the\nabove-mentioned competencies to be employed. To obtain this, all units prescribed\nfor this qualification must be achieved.\n\n--- PDF PAGE 81 ---\nPrinting Services (Prepress Technical Operations) NC I December 2023\n77\nBASIC COMPETENCIES\n(47 HOURS)\n\n Unit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n1. Receive and\nrespond to\nworkplace\ncommunication\n1.1 Follow routine\nspoken\nmessages\n• Exercise Conciseness in receiving and\nclarifying messages/ information/\ncommunication\n• Group discussion\n• Interaction\n• Reportorial\n• Modular\n• Interviews/\n• Questioning\n• Practical/\n• Performance Test\n• Observation\n4 hours\n\n1.2 Perform\nworkplace duties\nfollowing written\nnotices\n• Practice Accuracy in following written/ oral\ninstruction/ information\n• Practice written and oral communication\nskills\n• Case Study in handling written\ncommunication\n• Practice relaying/ disseminating messages/\ninformation\n• Analyze different messages\n\n• Lecture/\n• Discussion\n• Demonstration\n• Case Study\n\n• Written\n• Practical\n• Written\n• Demonstration\n\n4 hours\n2. Work with\nothers\n2.1 Develop effective\nworkplace\nrelationships\n\n• Read job description and organizations\npolicies relevant to work role\n• Read personnel code of conduct and\ndiscipline\n• Role play on cooperation and good\nrelationship\n• Study table of organization and identify team\nmembers\n• Role play on team work.\n• Role play on receiving feedback from\nsupervisor\n• Role play on providing feedback.\n• Listen to lecture on Valuing and\nexemplifying respect and empathy in the\nworkplace\n• Individual Work\n• Discussion\n• Role Play\n• Lecture\n• Role Play\n• Structured\nactivity\n• Written Test\n2 hours\n\n--- PDF PAGE 82 ---\nPrinting Services (Prepress Technical Operations) NC I December 2023\n78\n Unit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\n2.2 Contribute to\nwork group\nactivities\n•\nDiscussion on creative collaboration, social\nperceptiveness and problem sensitivity\n•\nRole play on creative collaboration, social\nperceptiveness and problem sensitivity.\n•\nParticipate in a goal setting activity\n•\nParticipate in planning and implementation\nof a group activity.\n•\nParticipate in evaluation of the group\nactivity\n• Lecture/\nDiscussion\n• Role Play\n• Group Work\n• Role Play\n• Structured\nactivity\n• Written Test\n1 hour\n3. Solve/address\nroutine\nproblems\n3.1 Identify the\nproblem\n•\nShow mastery of the current industry\nhardware and software products and\nservices\n- Show mastery of knowledge and\nunderstanding of the process, normal\noperating parameters, and product\nquality to recognize non-standard\nsituations\n- Relevant equipment and operational\nprocesses\n- Enterprise goals, targets and\nmeasures\n- Enterprise quality OHS and\nenvironmental requirement\n- Enterprise information systems and\ndata collation\n- Industry codes and standards\n•\nUse range of formal problem-solving\ntechniques (e.g., planning, attention,\nsimultaneous and successive processing\nof information)\n•\nIdentify and clarify the nature of the\nproblem\n\n• Interactive Lecture\n• Appreciative\nInquiry\n• Demonstration\n• Case Formulation\n• Life Narrative\nInquiry (Interview)\n• Standardized test\n\n1 hour\n\n--- PDF PAGE 83 ---\nPrinting Services (Prepress Technical Operations) NC I December 2023\n79\n Unit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\n3.2 Assess\nfundamental\ncauses of\nproblem\n\n•\nShow mastery of the current industry\nhardware and software products and\nservices\n- Show mastery of knowledge and\nunderstanding of the process, normal\noperating parameters, and product\nquality to recognize non-standard\nsituations\n- Relevant equipment and operational\nprocesses\n- Enterprise goals, targets and\nmeasures\n- Enterprise quality OHS and\nenvironmental requirement\n- Enterprise information systems and\ndata collation\n- Industry codes and standards\n•\nUse range of formal problem-solving\ntechniques (e.g., planning, attention,\nsimultaneous and successive processing\nof information)\n•\nIdentify and clarify the nature of the\nproblem\n\n• Group discussion\n• Lecture\n• Demonstration\n• Role play\n• Case Formulation\n• Life Narrative\nInquiry (Interview)\n• Standardized test\n