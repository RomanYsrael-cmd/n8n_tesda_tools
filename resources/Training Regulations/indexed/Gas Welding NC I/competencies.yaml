nt and capacity of welding  \n       accessories \n2.3  Operating capacity of welding accessories \n2.4  Shop safety, housekeeping and 5S procedures \n3.  Underpinning skills \n3.1  Setting and operating welding accessories \n3.2  Communication skills \n3.3  Recognizing operational abnormalities and  \n       faults in welding accessories \n3.4  Fine tuning of welding accessories for optimum \n       operation \n3.5  Minor repairs/maintenance of welding  \n       accessories \n3.6  Use of PPE \n4.  Resource implications \nThe following resources must be provided: \n4.1  Appropriately ventilated work area/shop with \nwelding facilities and accessories   \n4.2  PPE \n5.  Method of assessment \nCompetency must be assessed through: \n5.1  Observation/evaluation \n5.2  Oral questioning \n6.  Context of assessment \nCompetency to be assessed while a task is being \nundertaken in the workplace or in a simulated \nworkplace setting.\n",
