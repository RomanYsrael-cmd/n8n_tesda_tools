    "source_text": "3.1 CURRICULUM DESIGN\n\nCourse Title: GAS WELDING\n\nNC Level I\n\n Suggested Nominal Training Hours: 28 hrs. ( Basic Competencies)\n\n 56 hrs. ( Common Competencies)\n\n 72 hrs. ( Core Competencies)\n\nCourse Description:\n\nThis course is designed to enhance the knowledge, skills and attitudes\nof trainees in Gas Welding in accordance with industry standards. It covers core\ncompetencies such as Performing Gas Welding in Carbon Steel Plates and Pipes.\n\nBASIC COMPETENCIES\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Receive and\nrespond to\nworkplace\ncommunication\n1.1 Explain routinary\n speaking & messages in\n a workplace\n1.2 Follow routinary\n speaking & message\n1.3 Perform work duties\n following written notices\n• Group\n discussion\n• Interaction\n• Interviews/\n questioning\n• Observation\n2. Work with\nothers\n2.1 Develop effective\n workplace relationship\n2.2 Contribute to work group\n activities\n• Group\n discussion\n• Interaction\n• Interviews/\n questioning\n• Demonstration\n• Observation\n3. Demonstrate\nwork values\n\n3.1 Define the purpose of\n work\n3.2 Apply work values/ethics\n3.3 Deal with ethical\n problems\n3.4 Maintain integrity of\n conduct in the workplace\n• Group\n discussion\n• Interaction\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n\n--- PDF PAGE 49 ---\n11/03/04\nWeldncii11-3\n\n48\n4. Practice\nhousekeeping\nprocedures\n4.1 Sort and remove\n unnecessary items\n4.2 Arrange items\n4.3 Maintain work areas,\n tools and equipment\n4.4 Follow standardize work\n process and procedures\n4.5 Perform work\n spontaneously\n• Group\n discussion\n• Interaction\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n\nCOMMON COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Apply Safety\nPractices\n1.1 Identify hazardous areas\n1.2 Use protective clothing\nand devices\n1.3 Perform safe handling of\ntools, equipment and\n materials\n1.4 Perform first aid\n1.5 Use fire extinguisher\n• Lecturette\n• Practical\n application\n\n• Oral\n questioning\n• Written\n• Demonstration\n2. Interpret\nworking\ndrawings and\nsketches\n2.1 Identify standard\nalphabet of lines\n2.2 Identify orthographic/\nisometric views\n2.3 Interpret standard\ndrawing symbols,\ndimensional tolerances\nand notations\n• Lecturette\n• Practical\n application\n\n• Oral\n questioning\n• Written\n\n3. Perform\nIndustry\ncalculations\n3.1 Perform four\n fundamental operations\n3.2 Perform conversion of\n units\n3.3 Perform calculations on\n algebraic expressions\n3.4 Compute percentage and\n ratio\n• Lecturette\n• Practical\n application\n\n• Oral questioning\n• Written test\n\n4. Contribute to\n quality\n system\n4.1 Inspect work done\n4.2 Apply quality standards\n to work\n4.3 Protect company\n property and customer\n interest\n• Lecturette\n• Practical\n application\n\n• Oral\n questioning\n• Written\n• Demonstration\n5. Use hand tools\n5.1 Select hand tools\n5.2 Use hand tools\n5.3 Maintain hand tools\n• Lecturette\n• Practical\n application\n\n• Oral\n questioning\n• Written\n•Demonstration\n\n--- PDF PAGE 50 ---\n11/03/04\nWeldncii11-3\n\n49\n\n 6. Prepare Weld\n Materials\n\n6.1 Set-up cutting equipment\n6.2 Cut and prepare edge of\n materials\n6.3 Clean surfaces and\n edges\n6.4 Prepare welding\n consumables\n6.5 Prepare welding safety\n and protective equipment\n\n• Lecturette\n• Practical\n application\n\n• Observation\n• Demonstration\nand oral\nquestioning\n• Written test\n\n7. Set-up Welding\n Equipment\n7.1 Set up welding machine\n7.2 Set up welding\naccessories\n7.3 Set up welding\npositioners, jigs and\nfixtures\n7.4 Set up pre-heating\ntools/equipment as\nrequired\n• Lecturette\n• Demonstration\n• Observation and\noral questioning\n• Demonstration\nand oral\nquestioning\n• Written test\n8. Fit up Weld\n Materials\n8.1 Perform tack welding\n8.2 Check gap and\nalignment\n8.3 Set up welding positioner\n\n• Lecturette\n• Demonstration\n\n• Observation and\noral questioning\n• Demonstration\nand oral\nquestioning\n•Written test\n9. Repair Welds\n\n9.1 Mark/locate weld defects\n9.2 Prepare tools and\nequipment\n9.3 Remove defects\n9.4 Perform re-welding\n\n• Lecturette\n• Demonstration\n\n• Observation and\noral questioning\n• Demonstration\nand oral\nquestioning\n•Written test\n\nCORE COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Perform Gas\nWelding in\nCarbon Steel\nPlates and\nTubes\n1.1 Perform gas welding in\ncarbon steel plates and\ntubes in all positions\n\n• Lecturette\n• Demonstration\n\n• Observation\nand oral\nquestioning\n• Demonstration\n and oral\n questioning\n• Written test\n\n--- PDF PAGE 51 ---\n11/03/04\nWeldncii11-3\n\n50"
