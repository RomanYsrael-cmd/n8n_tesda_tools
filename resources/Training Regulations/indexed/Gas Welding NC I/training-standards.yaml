    "source_text": "SECTION 3 TRAINING STANDARDS\n\nThese guidelines are set to provide the Technical and Vocational Education\nand Training (TVET) providers with information and other important requirements to\nconsider when designing training programs for GAS WELDING.\n\n3.1 CURRICULUM DESIGN\n\nCourse Title: GAS WELDING\n\nNC Level I\n\n Suggested Nominal Training Hours: 28 hrs. ( Basic Competencies)\n\n 56 hrs. ( Common Competencies)\n\n 72 hrs. ( Core Competencies)\n\nCourse Description:\n\nThis course is designed to enhance the knowledge, skills and attitudes\nof trainees in Gas Welding in accordance with industry standards. It covers core\ncompetencies such as Performing Gas Welding in Carbon Steel Plates and Pipes.\n\nBASIC COMPETENCIES\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Receive and\nrespond to\nworkplace\ncommunication\n1.1 Explain routinary\n speaking & messages in\n a workplace\n1.2 Follow routinary\n speaking & message\n1.3 Perform work duties\n following written notices\n• Group\n discussion\n• Interaction\n• Interviews/\n questioning\n• Observation\n2. Work with\nothers\n2.1 Develop effective\n workplace relationship\n2.2 Contribute to work group\n activities\n• Group\n discussion\n• Interaction\n• Interviews/\n questioning\n• Demonstration\n• Observation\n3. Demonstrate\nwork values\n\n3.1 Define the purpose of\n work\n3.2 Apply work values/ethics\n3.3 Deal with ethical\n problems\n3.4 Maintain integrity of\n conduct in the workplace\n• Group\n discussion\n• Interaction\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n\n--- PDF PAGE 49 ---\n11/03/04\nWeldncii11-3\n\n48\n4. Practice\nhousekeeping\nprocedures\n4.1 Sort and remove\n unnecessary items\n4.2 Arrange items\n4.3 Maintain work areas,\n tools and equipment\n4.4 Follow standardize work\n process and procedures\n4.5 Perform work\n spontaneously\n• Group\n discussion\n• Interaction\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n\nCOMMON COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Apply Safety\nPractices\n1.1 Identify hazardous areas\n1.2 Use protective clothing\nand devices\n1.3 Perform safe handling of\ntools, equipment and\n materials\n1.4 Perform first aid\n1.5 Use fire extinguisher\n• Lecturette\n• Practical\n application\n\n• Oral\n questioning\n• Written\n• Demonstration\n2. Interpret\nworking\ndrawings and\nsketches\n2.1 Identify standard\nalphabet of lines\n2.2 Identify orthographic/\nisometric views\n2.3 Interpret standard\ndrawing symbols,\ndimensional tolerances\nand notations\n• Lecturette\n• Practical\n application\n\n• Oral\n questioning\n• Written\n\n3. Perform\nIndustry\ncalculations\n3.1 Perform four\n fundamental operations\n3.2 Perform conversion of\n units\n3.3 Perform calculations on\n algebraic expressions\n3.4 Compute percentage and\n ratio\n• Lecturette\n• Practical\n application\n\n• Oral questioning\n• Written test\n\n4. Contribute to\n quality\n system\n4.1 Inspect work done\n4.2 Apply quality standards\n to work\n4.3 Protect company\n property and customer\n interest\n• Lecturette\n• Practical\n application\n\n• Oral\n questioning\n• Written\n• Demonstration\n5. Use hand tools\n5.1 Select hand tools\n5.2 Use hand tools\n5.3 Maintain hand tools\n• Lecturette\n• Practical\n application\n\n• Oral\n questioning\n• Written\n•Demonstration\n\n--- PDF PAGE 50 ---\n11/03/04\nWeldncii11-3\n\n49\n\n 6. Prepare Weld\n Materials\n\n6.1 Set-up cutting equipment\n6.2 Cut and prepare edge of\n materials\n6.3 Clean surfaces and\n edges\n6.4 Prepare welding\n consumables\n6.5 Prepare welding safety\n and protective equipment\n\n• Lecturette\n• Practical\n application\n\n• Observation\n• Demonstration\nand oral\nquestioning\n• Written test\n\n7. Set-up Welding\n Equipment\n7.1 Set up welding machine\n7.2 Set up welding\naccessories\n7.3 Set up welding\npositioners, jigs and\nfixtures\n7.4 Set up pre-heating\ntools/equipment as\nrequired\n• Lecturette\n• Demonstration\n• Observation and\noral questioning\n• Demonstration\nand oral\nquestioning\n• Written test\n8. Fit up Weld\n Materials\n8.1 Perform tack welding\n8.2 Check gap and\nalignment\n8.3 Set up welding positioner\n\n• Lecturette\n• Demonstration\n\n• Observation and\noral questioning\n• Demonstration\nand oral\nquestioning\n•Written test\n9. Repair Welds\n\n9.1 Mark/locate weld defects\n9.2 Prepare tools and\nequipment\n9.3 Remove defects\n9.4 Perform re-welding\n\n• Lecturette\n• Demonstration\n\n• Observation and\noral questioning\n• Demonstration\nand oral\nquestioning\n•Written test\n\nCORE COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Perform Gas\nWelding in\nCarbon Steel\nPlates and\nTubes\n1.1 Perform gas welding in\ncarbon steel plates and\ntubes in all positions\n\n• Lecturette\n• Demonstration\n\n• Observation\nand oral\nquestioning\n• Demonstration\n and oral\n questioning\n• Written test\n\n--- PDF PAGE 51 ---\n11/03/04\nWeldncii11-3\n\n50\n3.2 TRAINING DELIVERY\n\nThe delivery of training should adhere to the design of the curriculum.\nDelivery should be guided by the 10 basic principles of competency-based\nTVET.\n\n• The training is based on curriculum developed from the competency\nstandards;\n• Learning is modular in its structure;\n• Training delivery is individualized and self-paced;\n• Training is based on work that must be performed;\n• Training materials are directly related to the competency standards and the\ncurriculum modules;\n• Assessment is based in the collection of evidence of the performance of work\nto the industry required standard;\n• Training is based both on and off-the-job components;\n• Allows for recognition of prior learning (RPL) or current competencies;\n• Training allows for multiple entry and exit; and\n• Approved training programs are Nationally Accredited\n\n The competency-based TVET system recognizes various types of delivery\nmodes, both on and off-the-job as long as the learning is driven by the\ncompetency standards specified by the industry. The following training\nmodalities may be adopted when designing training programs:\n• The dualized mode of training delivery is preferred and recommended. Thus\nprograms would contain both in-school and in-industry training or fieldwork\ncomponents. Details can be referred to the Dual Training System (DTS)\nImplementing Rules and Regulations.\n• Modular/self-paced learning is a competency-based training modality wherein\nthe trainee is allowed to progress at his own pace. The trainer just facilitates\nthe training delivery.\n• Peer teaching/mentoring is a training modality wherein fast learners are given\nthe opportunity to assist the slow learners.\n• Supervised industry training or on-the-job training is an approach in training\ndesigned to enhance the knowledge and skills of the trainee through actual\nexperience in the workplace to acquire specific competencies prescribed in\nthe training regulations.\n• Distance learning is a formal education process in which majority of the\ninstruction occurs when the students and instructor are not in the same\nplace. Distance learning may employ correspondence study, audio, video or\ncomputer technologies.\n\n--- PDF PAGE 52 ---\n11/03/04\nWeldncii11-3\n\n51\n3.3 TRAINEE ENTRY REQUIREMENTS\n\nTrainees or students wishing to gain entry into this course should possess\nthe following requirements:\n\n•\ncan communicate either oral and written\n•\nphysically and mentally fit\n•\ncan perform basic mathematical computation\n\n3.4 LIST OF TOOLS, EQUIPMENT AND MATERIALS\n\nRecommended list of tools and materials per trainee for GAS WELDING - NC I\n\nTOOLS\n(for 25 trainees)\nEQUIPMENT\n(for 25 trainees)\nMATERIAL\n(per trainee)\nQty.\nDescription\nQty.\nDescription\nQty.\nDescription\n25 pcs.\nChipping\nHammer\n12\nunits\nGAS\nWelding/cutting\noutfit *\n3 kgs\nFiller rod\n2.4mm dia.\n75 pcs.\nSteel brush\n12\npcs.\nWelding positioners\n12 pcs.\nMild steel sheet\n3.2mm X 150mm\nx 200mm\n12 pcs.\nPlier/tongs\n12\nunits\nPortable disc\ngrinder\n6 pcs.\nMild steel sheet\n2.4mm X 150mm\nX 200mm\n20 pcs.\nFiles-bastard\ncut\n1 unit\nExhaust fan\n5 pcs.\n\nCarbon steel\npipe, schedule 40\n75 dia. X 150mm\n5 pcs.\nWelding\ngoggles\n(swivel)\n2 units\nWork bench w/\nbench vice on 4\ncorners\n2 pcs.\nDark glass\n25 sets\nLeather\napron/jacket\n1 unit\nIndustrial fan\n6 pcs.\nLens clear glass\n5 pcs.\nSafety\ngoggles,\nwide vision,\nclear\n1 cyl.\nLPG / acetylene\n20 pcs\nCut off disc 3/32”\nx 5/8\" x4\" dia.\n5 pcs.\nOxy-\nacetylene\ngoggles\n1 cyl.\nOxygen\n1 tube\nMetal marker\n12 pcs.\nTry square\n300 mm.\nlong\n\n1 kg\nFiller wire\nm.s. 1.6 dia.\n12 pcs.\nSteel square\n300 mm.\nlong\n\n--- PDF PAGE 53 ---\n11/03/04\nWeldncii11-3\n\n52\n1 pc.\nFiles-half\nround\n\n1 pc.\nFillet gauge\n1 pc.\nWire Cutter\n1 pc.\nHand\nHacksaw\n\nNote: Tools and equipment for all welding process.\n* for GAS WELDING process\n\n--- PDF PAGE 54 ---\n11/03/04\nWeldncii11-3\n\n53\n3.5 TRAINING FACILITIES\n\nGAS WELDING - NC I\n\nThe welding workshop must be of concrete structure. Based on class size of 25\nstudents/trainees the space requirements for the teaching/learning and circulation\nareas are as follows:\n\nTEACHING/LEARNING\nAREAS\nSIZE IN\nMETERS\nAREA IN\nSQ.\nMETERS\nQTY\nTOTAL AREA\nIN SQ.\nMETERS\nWelding Booth\n2 X 1.5\n3\n5\n15\nGrinding Booth*\n2 X 1.5\n3\n2\n6\nMaterials/Preparation\nArea*\n2 X 2\n4\n\n4\nBench work Area*\n1.5 X 2.5\n4\n2\n8\nTool Room & S/M\nStorage Area*\n4 X 5\n20\n\n20\nLearning Resource\nArea*\n5 X 9\n45\n\n45\nWash Area /Comfort\nRoom (male & female) *\n2.5 X 4\n10\n\n10\nTotal\n\n108\nCirculation Area**\n\n32\nTotal Workshop Area\n\n140\n\n* This area can also be used by other welding courses.\n** Area requirement is equivalent to 30% of the total teaching/learning areas\n\n--- PDF PAGE 55 ---\n11/03/04\nWeldncii11-3\n\n54\n3.6 TRAINERS QUALIFICATIONS FOR GAS WELDING WELDER\n\nGAS WELDING - NC I\n\nTRAINER QUALIFICATION (TQ I)\n\n•\nMust be a holder of GAS WELDING NC I\n•\nMust have undergone training on Training Methodology I (TM I)\n•\nMust be physically and mentally fit\n•\n*Must have at least 2 years job/industry experience\n•\nMust be a civil service eligible (for government position or appropriate\nprofessional license issued by the Professional Regulatory Commission)\n\n* Optional. Only when required by the hiring institution\n\nReference: TESDA Board Resolution No. 2004 03\n\n3.7 INSTITUTIONAL ASSESSMENT\n\nInstitutional Assessment is to be undertaken by trainees to determine the\nachievement of units of competency. A certificate of achievement is issued for\neach unit of competency.\n\n--- PDF PAGE 56 ---\n11/03/04\nWeldncii11-3\n\n55"
