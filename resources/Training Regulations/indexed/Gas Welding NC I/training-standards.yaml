s, both on and off-the-job as long as the learning is driven by the\ncompetency standards specified by the industry. The following training\nmodalities may be adopted when designing training programs:\n• The dualized mode of training delivery is preferred and recommended. Thus\nprograms would contain both in-school and in-industry training or fieldwork\ncomponents. Details can be referred to the Dual Training System (DTS)\nImplementing Rules and Regulations.\n• Modular/self-paced learning is a competency-based training modality wherein\nthe trainee is allowed to progress at his own pace. The trainer just facilitates\nthe training delivery.\n• Peer teaching/mentoring is a training modality wherein fast learners are given\nthe opportunity to assist the slow learners.\n• Supervised industry training or on-the-job training is an approach in training\ndesigned to enhance the knowledge and skills of the trainee through actual\nexperience in the workplace to acquire specific competencies prescribed in\nthe training regulations.\n• Distance learning is a formal education process in which majority of the\ninstruction occurs when the students and instructor are not in the same\nplace. Distance learning may employ correspondence study, audio, video or\ncomputer technologies.\n\n--- PDF PAGE 52 ---\n11/03/04\nWeldncii11-3\n\n51\n3.3 TRAINEE ENTRY REQUIREMENTS\n\nTrainees or students wishing to gain entry into this course should possess\nthe following requirements:\n\n•\ncan communicate either oral and written\n•\nphysically and mentally fit\n•\ncan perform basic mathematical computation\n\n3.4 LIST OF TOOLS, EQUIPMENT AND MATERIALS\n\nRecommended list of tools and materials per trainee for GAS WELDING - NC I\n\nTOOLS\n(for 25 trainees)\nEQUIPMENT\n(for 25 trainees)\nMATERIAL\n(per trainee)\nQty.\nDescription\nQty.\nDescription\nQty.\nDescription\n25 pcs.\nChipping\nHammer\n12\nunits\nGAS\nWelding/cutting\noutfit *\n3 kgs\nFiller rod\n2.4mm dia.\n75 pcs.\nSteel brush\n12\npcs.\nWelding positioners\n12 pcs.\nMild steel sheet\n3.2mm X 150mm\nx 200mm\n12 pcs.\nPlier/tongs\n12\nunits\nPortable disc\ngrinder\n6 pcs.\nMild steel sheet\n2.4mm X 150mm\nX 200mm\n20 pcs.\nFiles-bastard\ncut\n1 unit\nExhaust fan\n5 pcs.\n\nCarbon steel\npipe, schedule 40\n75 dia. X 150mm\n5 pcs.\nWelding\ngoggles\n(swivel)\n2 units\nWork bench w/\nbench vice on 4\ncorners\n2 pcs.\nDark glass\n25 sets\nLeather\napron/jacket\n1 unit\nIndustrial fan\n6 pcs.\nLens clear glass\n5 pcs.\nSafety\ngoggles,\nwide vision,\nclear\n1 cyl.\nLPG / acetylene\n20 pcs\nCut off disc 3/32”\nx 5/8\" x4\" dia.\n5 pcs.\nOxy-\nacetylene\ngoggles\n1 cyl.\nOxygen\n1 tube\nMetal marker\n12 pcs.\nTry square\n300 mm.\nlong\n\n1 kg\nFiller wire\nm.s. 1.6 dia.\n12 pcs.\nSteel square\n300 mm.\nlong\n\n--- PDF PAGE 53 ---\n11/03/04\nWeldncii11-3\n\n52\n1 pc.\nFiles-half\nround\n\n1 pc.\nFillet gauge\n1 pc.\nWire Cutter\n1 pc.\nHand\nHacksaw\n\nNote: Tools and equipment for all welding process.\n* for GAS WELDING process\n\n--- PDF PAGE 54 ---\n11/03/04\nWeldncii11-3\n\n53\n3.5 TRAINING FACILITIES\n\nGAS WELDING - NC I\n\nThe welding workshop must be of concrete structure. Based on class size of 25\nstudents/trainees the space requirements for the teaching/learning and circulation\nareas are as follows:\n\nTEACHING/LEARNING\nAREAS\nSIZE IN\nMETERS\nAREA IN\nSQ.\nMETERS\nQTY\nTOTAL AREA\nIN SQ.\nMETERS\nWelding Booth\n2 X 1.5\n3\n5\n15\nGrinding Booth*\n2 X 1.5\n3\n2\n6\nMaterials/Preparation\nArea*\n2 X 2\n4\n\n4\nBench work Area*\n1.5 X 2.5\n4\n2\n8\nTool Room & S/M\nStorage Area*\n4 X 5\n20\n\n20\nLearning Resource\nArea*\n5 X 9\n45\n\n45\nWash Area /Comfort\nRoom (male & female) *\n2.5 X 4\n10\n\n10\nTotal\n\n108\nCirculation Area**\n\n32\nTotal Workshop Area\n\n140\n\n* This area can also be used by other welding courses.\n** Area requirement is equivalent to 30% of the total teaching/learning areas\n\n--- PDF PAGE 55 ---\n11/03/04\nWeldncii11-3\n\n54\n3.6 TRAINERS QUALIFICATIONS FOR GAS WELDING WELDER\n\nGAS WELDING - NC I\n\nTRAINER QUALIFICATION (TQ I)\n\n•\nMust be a holder of GAS WELDING NC I\n•\nMust have undergone training on Training Methodology I (TM I)\n•\nMust be physically and mentally fit\n•\n*Must have at least 2 years job/industry experience\n•\nMust be a civil service eligible (for government position or appropriate\nprofessional license issued by the Professional Regulatory Commission)\n\n* Optional. Only when required by the hiring institution\n\nReference: TESDA Board Resolution No. 2004 03\n\n3.7 INSTITUTIONAL ASSESSMENT\n\nInstitutional Assessment is to be undertaken by trainees to determine the\nachievement of units of competency. A certificate of achievement is issued for\neach unit of competency.\n\n--- PDF PAGE 56 ---\n11/03/04\nWeldncii11-3\n\n55"
