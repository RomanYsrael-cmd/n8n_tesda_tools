oning\n\nCOMMON COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Apply Safety\nPractices\n1.1 Identify hazardous areas\n1.2 Use protective clothing\nand devices\n1.3 Perform safe handling of\ntools, equipment and\n materials\n1.4 Perform first aid\n1.5 Use fire extinguisher\n• Lecturette\n• Practical\n application\n\n• Oral\n questioning\n• Written\n• Demonstration\n2. Interpret\nworking\ndrawings and\nsketches\n2.1 Identify standard\nalphabet of lines\n2.2 Identify orthographic/\nisometric views\n2.3 Interpret standard\ndrawing symbols,\ndimensional tolerances\nand notations\n• Lecturette\n• Practical\n application\n\n• Oral\n questioning\n• Written\n\n3. Perform\nIndustry\ncalculations\n3.1 Perform four\n fundamental operations\n3.2 Perform conversion of\n units\n3.3 Perform calculations on\n algebraic expressions\n3.4 Compute percentage and\n ratio\n• Lecturette\n• Practical\n application\n\n• Oral questioning\n• Written test\n\n4. Contribute to\n quality\n system\n4.1 Inspect work done\n4.2 Apply quality standards\n to work\n4.3 Protect company\n property and customer\n interest\n• Lecturette\n• Practical\n application\n\n• Oral\n questioning\n• Written\n• Demonstration\n5. Use hand tools\n5.1 Select hand tools\n5.2 Use hand tools\n5.3 Maintain hand tools\n• Lecturette\n• Practical\n application\n\n• Oral\n questioning\n• Written\n•Demonstration\n\n--- PDF PAGE 50 ---\n11/03/04\nWeldncii11-3\n\n49\n\n 6. Prepare Weld\n Materials\n\n6.1 Set-up cutting equipment\n6.2 Cut and prepare edge of\n materials\n6.3 Clean surfaces and\n edges\n6.4 Prepare welding\n consumables\n6.5 Prepare welding safety\n and protective equipment\n\n• Lecturette\n• Practical\n application\n\n• Observation\n• Demonstration\nand oral\nquestioning\n• Written test\n\n7. Set-up Welding\n Equipment\n7.1 Set up welding machine\n7.2 Set up welding\naccessories\n7.3 Set up welding\npositioners, jigs and\nfixtures\n7.4 Set up pre-heating\ntools/equipment