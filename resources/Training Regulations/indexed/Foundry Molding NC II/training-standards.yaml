    "source_text": "3.1 CURRICULUM DESIGN\n\nCourse Title: FOUNDRY MOULDING\n\n NC Level: NC II\n\nNominal Training Duration:\n18 Hours (Basic Competencies)\n\n20 Hours (Common Competencies)\n120 Hours (Core Competencies)\nCourse Description:\n\nThis course is designed to equip individual with competency to produce all types\nof molds and cores using different kinds of binders and sand manually or with the use\nmolding machines and core making machines.\n\nIt also includes competencies on interpreting specifications, drawings, technical\nsketches and/or customer requirements. Tasks undertaken would also include\nutilizing appropriate sand binding agents, patterns, core boxes and proper\nmachineries using principles and techniques; designated procedures, correct and\nappropriate tools and equipment; inspection, measure and repair procedures; sets up\nand operates variety of specialized molding and core making machines and uses\nprecision measuring instrument in operating and maintaining patterns and molding\nequipment.\n\nThis course is also designed to provide basic and common skills to equip\nindividual with operational skills in foundry molding.\n\nTo obtain this, all units prescribed for this qualification must be achieved.\n\nBASIC COMPETENCIES\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and convey\n workplace information.\n1.2 Complete relevant work\nrelated documents.\n1.3 Participate in workplace\n meeting and\ndiscussion.\n•\nGroup discussion\n•\nInteraction\n\n•\nWritten test\n•\nPractical/perform\nance test\n•\nInterview\n2. Work in a team\nenvironment\n2.1 Describe and identify\nteam role and\nresponsibility in a team.\n2.2 Describe work as a\nteam\n member.\n•\nDiscussion\n•\nInteraction\n\n•\nObservation\n•\nSimulation\n•\nRole playing\n\n--- PDF PAGE 54 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY MOLDING NC II Promulgated\n\n52\n3. Practice career\nprofessionalism\n3.1 Integrate personal\nobjectives with\norganizational goals.\n3.2 Set and meet work\npriorities.\n3.3 Maintain professional\ngrowth and\ndevelopment.\n•\nGroup Discussion\n•\nInteraction\n\n•\nDemonstration\n•\nObservation\n•\nInterviews/\nquestioning\n4. Practice\noccupational\nhealth and\nsafety\n4.1Identify hazardous risks\n4.2 Evaluate hazard and\nrisks\n4.3 Control hazards and\nrisks\n4.4 Maintain occupational\nhealth and safety\nawareness\n•\nDiscussion\n•\nPlant tour\n•\nSymposium\n•\nObservation\n•\nInterview\n\nCOMMON COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Read, Interpret\nand Apply\nEngineering\nDrawings\n1.1 Identify and access\nengineering drawings/\nspecification\n1.2.Interpret drawings\n1.3.Apply information in\nthe drawings &\nspecifications\n1.4 Store drawings\n• Lecture/\nDemonstration\n• Dual training\n\n• Direct observation\n• Interview\n2. Perform\nMensuration\nand\nCalculation\n2.1. Select measuring\ninstrument and\n2.2 Carry out\nmeasurement and\ncalculations.\n2.3. Maintain measuring\ninstruments\n• Lecture/\nDemonstration\n• Simulation\n• Exercises\n\n• Written test\n• Oral questioning\n• Direct observation\n\n3. Read, Interpret\nand Apply\nSpecifications\nand Manual\n4.1. Identify/accessed\nmanuals and interpret\ndata and specification\n4.2 Apply information\naccessed in manual\n4.3 Store manual\n• Lecture/\nDemonstration\n• Dual training\n• Distance Learning\n\n• Written test\n• Direct observation\n• Project method\n• Interview\n4. Perform Shop\nMaintenance\n\n4.1 Inspect/clean tools and\nwork area\n4.2 Store/arrange tools and\nshop equipment\n4.3 Dispose wastes/used\nlubricants\n4.4 Report damaged\ntools/equipment\n• Lecture/\nDemonstration\n• Dual training\n• Self paced (modular)\n• Simulation\n• Written test\n• Direct observation\n• Demonstration\n• Interview\n\n--- PDF PAGE 55 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY MOLDING NC II Promulgated\n\n53\nCORE COMPETENCIES\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Prepare and\nMix Sand for\nMolding and\nCoremaking\n1.1 Load mixer (mill/muller)\n1.2 Mix sand\n1.3 Take and test samples\n1.4 Discharge mixture\n1.5 Clean mixer\n•\nLecture/\nDemonstration\n•\nDiscussion\n•\nDual training\n\n•\nObservation w/\nquestioning\n•\nDemonstration\nof practical\nskills\n•\nPortfolio\n•\nThird party\nreport\n2. Produce Molds\nby Hand\n(Jobbing)\n2.1Identify job requirements\n2.2 Determine sequence of\noperation\n2.3 Select inspect and\nprepare pattern\nequipment\n2.4 Make mould\n2.5 Clean and restore work\narea\n•\nLecture/\nDemonstration\n•\nDiscussion\n•\nDual training\n\n•\nObservation w/\nquestioning\n•\nDemonstration\nof practical\nskills\n•\nPortfolio\n•\nThird party\nreport\n3. Produce Core\nby hand\n(Jobbing)\n3.1 Identify job requirements\n3.2 Determine sequence of\noperation\n3.3 Select inspect and\nprepare core box\nequipment\n3.4 Make sand core\n3.5 Clean and restore work\narea\n•\nLecture/\nDemonstration\n•\nDiscussion\n•\nDual training\n\n•\nObservation w/\nquestioning\n•\nDemonstration\nof practical\nskills\n•\nPortfolio\nThird party\nreport\n4. Operate Sand\nMolding\nMachine\n4.1 Determine job\nrequirements\n4.2 Conduct pre- operational\nchecks\n4.3 Operate machine to\nproduce mould/cores\n4.4 Assemble moulds/cores\n4.5 Clean and restore work\n•\nLecture/\nDemonstration\n•\nDiscussion\n•\nDual training\n\n•\nObservation w/\nquestioning\n•\nDemonstration\nof practical\nskills\n•\nPortfolio\n•\nThird party\nreport\n5. Operate Sand\nCore Making\nMachine\n5.1Determine job\nrequirements\n5.2.Conduct pre- operational\n checks\n5.3 Operate machine to\n produce cores\n5.4 Assemble cores\n5.5 Clean and restore work\n•\nLecture/\nDemonstration\n•\nDiscussion\n•\nDual training\n\n•\nObservation w/\nquestioning\n•\nDemonstration\nof practical\nskills\n•\nPortfolio\nThird party\nreport\n\n--- PDF PAGE 56 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY MOLDING NC II Promulgated\n\n54\n\n6. Pour Molten\nMetal\n6.1Prepare for pouring\nmolten metal\n6.2 Preheat or prepare ladle\n6.3Transfer ladle to furnace\n6.4 Pour molten metal\n•\nLecture/\nDemonstration\n•\nDiscussion\n•\nDual training\n\n•\nObservation w/\nquestioning\n•\nDemonstration\nof practical\nskills\n•\nPortfolio\n•\nThird party\nreport\n7. Use and\nMaintain\nMeasuring\nInstrument\n7.1 Measure dimensions or\nvariables using\nappropriate instrument\n7.2 Maintain measuring\ninstrument\n\n•\nLecture/\nDemonstration\n•\nDiscussion\n•\nDual training\n\n•\nObservation w/\nquestioning\n•\nDemonstration\nof practical\nskills\n•\nPortfolio\n•\nThird party\nreport\n\n--- PDF PAGE 57 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY MOLDING NC II Promulgated\n\n55"
