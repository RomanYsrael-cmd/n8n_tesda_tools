  "source_section_text": "SECTION 3 TRAINING STANDARDS\n\nThese guidelines are set to provide the Technical and Vocational Education\nand Training (TVET) providers with information and other important requirements to\nconsider when designing training programs for FOUNDRY MOLDING NC II.\n\n3.1 CURRICULUM DESIGN\n\nCourse Title: FOUNDRY MOULDING\n\n NC Level: NC II\n\nNominal Training Duration:\n18 Hours (Basic Competencies)\n\n20 Hours (Common Competencies)\n120 Hours (Core Competencies)\nCourse Description:\n\nThis course is designed to equip individual with competency to produce all types\nof molds and cores using different kinds of binders and sand manually or with the use\nmolding machines and core making machines.\n\nIt also includes competencies on interpreting specifications, drawings, technical\nsketches and/or customer requirements. Tasks undertaken would also include\nutilizing appropriate sand binding agents, patterns, core boxes and proper\nmachineries using principles and techniques; designated procedures, correct and\nappropriate tools and equipment; inspection, measure and repair procedures; sets up\nand operates variety of specialized molding and core making machines and uses\nprecision measuring instrument in operating and maintaining patterns and molding\nequipment.\n\nThis course is also designed to provide basic and common skills to equip\nindividual with operational skills in foundry molding.\n\nTo obtain this, all units prescribed for this qualification must be achieved.\n\nBASIC COMPETENCIES\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and convey\n workplace information.\n1.2 Complete relevant work\nrelated documents.\n1.3 Participate in workplace\n meeting and\ndiscussion.\n•\nGroup discussion\n•\nInteraction\n\n•\nWritten test\n•\nPractical/perform\nance test\n•\nInterview\n2. Work in a team\nenvironment\n2.1 Describe and identify\nteam role and\nresponsibility in a team.\n2.2 Describe work as a\nteam\n member.\n•\nDiscussion\n•\nInteraction\n\n•\nObservation\n•\nSimulation\n•\nRole playing\n\n--- PDF PAGE 54 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY MOLDING NC II Promulgated\n\n52\n3. Practice career\nprofessionalism\n3.1 Integrate personal\nobjectives with\norganizational goals.\n3.2 Set and meet work\npriorities.\n3.3 Maintain professional\ngrowth and\ndevelopment.\n•\nGroup Discussion\n•\nInteraction\n\n•\nDemonstration\n•\nObservation\n•\nInterviews/\nquestioning\n4. Practice\noccupational\nhealth and\nsafety\n4.1Identify hazardous risks\n4.2 Evaluate hazard and\nrisks\n4.3 Control hazards and\nrisks\n4.4 Maintain occupational\nhealth and safety\nawareness\n•\nDiscussion\n•\nPlant tour\n•\nSymposium\n•\nObservation\n•\nInterview\n\nCOMMON COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Read, Interpret\nand Apply\nEngineering\nDrawings\n1.1 Identify and access\nengineering drawings/\nspecification\n1.2.Interpret drawings\n1.3.Apply information in\nthe drawings &\nspecifications\n1.4 Store drawings\n• Lecture/\nDemonstration\n• Dual training\n\n• Direct observation\n• Interview\n2. Perform\nMensuration\nand\nCalculation\n2.1. Select measuring\ninstrument and\n2.2 Carry out\nmeasurement and\ncalculations.\n2.3. Maintain measuring\ninstruments\n• Lecture/\nDemonstration\n• Simulation\n• Exercises\n\n• Written test\n• Oral questioning\n• Direct observation\n\n3. Read, Interpret\nand Apply\nSpecifications\nand Manual\n4.1. Identify/accessed\nmanuals and interpret\ndata and specification\n4.2 Apply information\naccessed in manual\n4.3 Store manual\n• Lecture/\nDemonstration\n• Dual training\n• Distance Learning\n\n• Written test\n• Direct observation\n• Project method\n• Interview\n4. Perform Shop\nMaintenance\n\n4.1 Inspect/clean tools and\nwork area\n4.2 Store/arrange tools and\nshop equipment\n4.3 Dispose wastes/used\nlubricants\n4.4 Report damaged\ntools/equipment\n• Lecture/\nDemonstration\n• Dual training\n• Self paced (modular)\n• Simulation\n• Written test\n• Direct observation\n• Demonstration\n• Interview\n\n--- PDF PAGE 55 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY MOLDING NC II Promulgated\n\n53\nCORE COMPETENCIES\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Prepare and\nMix Sand for\nMolding and\nCoremaking\n1.1 Load mixer (mill/muller)\n1.2 Mix sand\n1.3 Take and test samples\n1.4 Discharge mixture\n1.5 Clean mixer\n•\nLecture/\nDemonstration\n•\nDiscussion\n•\nDual training\n\n•\nObservation w/\nquestioning\n•\nDemonstration\nof practical\nskills\n•\nPortfolio\n•\nThird party\nreport\n2. Produce Molds\nby Hand\n(Jobbing)\n2.1Identify job requirements\n2.2 Determine sequence of\noperation\n2.3 Select inspect and\nprepare pattern\nequipment\n2.4 Make mould\n2.5 Clean and restore work\narea\n•\nLecture/\nDemonstration\n•\nDiscussion\n•\nDual training\n\n•\nObservation w/\nquestioning\n•\nDemonstration\nof practical\nskills\n•\nPortfolio\n•\nThird party\nreport\n3. Produce Core\nby hand\n(Jobbing)\n3.1 Identify job requirements\n3.2 Determine sequence of\noperation\n3.3 Select inspect and\nprepare core box\nequipment\n3.4 Make sand core\n3.5 Clean and restore work\narea\n•\nLecture/\nDemonstration\n•\nDiscussion\n•\nDual training\n\n•\nObservation w/\nquestioning\n•\nDemonstration\nof practical\nskills\n•\nPortfolio\nThird party\nreport\n4. Operate Sand\nMolding\nMachine\n4.1 Determine job\nrequirements\n4.2 Conduct pre- operational\nchecks\n4.3 Operate machine to\nproduce mould/cores\n4.4 Assemble moulds/cores\n4.5 Clean and restore work\n•\nLecture/\nDemonstration\n•\nDiscussion\n•\nDual training\n\n•\nObservation w/\nquestioning\n•\nDemonstration\nof practical\nskills\n•\nPortfolio\n•\nThird party\nreport\n5. Operate Sand\nCore Making\nMachine\n5.1Determine job\nrequirements\n5.2.Conduct pre- operational\n checks\n5.3 Operate machine to\n produce cores\n5.4 Assemble cores\n5.5 Clean and restore work\n•\nLecture/\nDemonstration\n•\nDiscussion\n•\nDual training\n\n•\nObservation w/\nquestioning\n•\nDemonstration\nof practical\nskills\n•\nPortfolio\nThird party\nreport\n\n--- PDF PAGE 56 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY MOLDING NC II Promulgated\n\n54\n\n6. Pour Molten\nMetal\n6.1Prepare for pouring\nmolten metal\n6.2 Preheat or prepare ladle\n6.3Transfer ladle to furnace\n6.4 Pour molten metal\n•\nLecture/\nDemonstration\n•\nDiscussion\n•\nDual training\n\n•\nObservation w/\nquestioning\n•\nDemonstration\nof practical\nskills\n•\nPortfolio\n•\nThird party\nreport\n7. Use and\nMaintain\nMeasuring\nInstrument\n7.1 Measure dimensions or\nvariables using\nappropriate instrument\n7.2 Maintain measuring\ninstrument\n\n•\nLecture/\nDemonstration\n•\nDiscussion\n•\nDual training\n\n•\nObservation w/\nquestioning\n•\nDemonstration\nof practical\nskills\n•\nPortfolio\n•\nThird party\nreport\n\n--- PDF PAGE 57 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY MOLDING NC II Promulgated\n\n55\n3.2 TRAINING DELIVERY\n\nThe delivery of training should adhere to the design of the curriculum.\nDelivery should be guided by the 10 basic principles of competency-based\nTVET.\n\n The training is based on curriculum developed from the competency\nstandards;\n Learning is modular in its structure;\n Training delivery is learner-centered and should accommodate\nindividualized and self-paced learning strategies;\n Training is based on work that must be performed;\n Training materials are directly related to the competency standards and\nthe curriculum modules;\n Assessment is based in the collection of evidence of the performance of\nwork to the industry required standard;\n Training is based on and off-the-job components;\n Allows for recognition of prior learning (RPL) or current competencies;\n Training allows for multiple entry and exit; and\n Approved training programs are nationally accredited.\n\nThe competency-based TVET system recognizes various types of\ndelivery modes, both on and off-the-job as long as the learning is driven by the\ncompetency standards specified by the industry. The following training\nmodalities may be adopted when designing training programs:\n\n The dualized mode of training delivery is preferred and recommended.\nThus programs would contain both in-school and in-industry training\nor fieldwork components. Details can be referred to the Dual Training\nSystem (DTS) Implementing Rules and Regulations.\n Modular/self-paced learning is a competency-based training modality\nwherein the trainee is allowed to progress at his own pace. The trainer\nfacilitates the training delivery\n Peer teaching/mentoring is a training modality wherein fast learners are\ngiven the opportunity to assist the slow learners.\n Supervised industry training or on-the-job training is an approach in\ntraining designed to enhance the knowledge and skills of the trainee\nthrough actual experience in the workplace to acquire specific\ncompetencies prescribed in the training regulations.\n Distance learning is a formal education process in which majority of the\ninstruction occurs when the students and instructor are not in the\nsame place. Distance learning may employ correspondence study, or\naudio, video or computer technologies.\n Project-Based Instruction is an authentic instructional model or strategy\nin which students plan, implement and evaluate projects that have\nreal world applications.\n\n--- PDF PAGE 58 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY MOLDING NC II Promulgated\n\n56\n3.3 TRAINEE ENTRY REQUIREMENTS\n\nThis section specifies the qualifications of trainees and educational\nexperience. Other requirements like health and physical requirements are\nalso stated. Passing entry written examinations may also be indicated if\nnecessary.\n\n• With background in basic machining\n• With good moral character;\n• Ability to communicate both oral and written; and\n• Physically and mentally fit\n\n 3.4 LIST OF TOOLS, EQUIPMENT AND MATERIALS\n FOUNDRY MOLDING NC II\n\nRecommended list of tools, equipment and materials for the training of 12\ntrainees for Foundry Molding NC II\n\nTOOLS\nEQUIPMENT\nMATERIALS\nQTY\nQTY\nQTY\n2 sets\nBox wrench\n1 set Sand muller\n(250Kgs capacity)\n5 tons\nSilica sand\n(minimum 96%\nsilica)\n2 sets\nOpen wrench\n1 set Sand mixer\n(250Kgs capacity)\n5 tons\nChromite sand\n2 sets\nSocket wrench\n1 set 1-AS or 3-DS shell\ncore\n2 tons\nResin bonded\nshell core sand\n2 pcs\nAdjustable\nwrench (300mm)\n1 set Air compressor\n(50hp)\n500Kg\ns\nBentonite\n(Volclay)\n2 pcs\nScrewdriver\n(Minus 200mm)\n1 set CO2 gas regulator\n400Kg\ns\nSodium silicate\n(ratio 2.5 - 3)\n2 pcs\nScrewdriver\n(Philips 200mm)\n1 set LPG burner\n50Kgs\nSea coal\n2 pcs\nElectrical pliers\n1 set Weighing scale\n50Kgs capacity\n100Kg\ns\nMolasses\n2 sets\nStopwatch with\nlap time\n2\nsets\nWorking bench (1m\nx 2m x 1m)\n5Kgs\nParting compound\n(Dry)\n3 pcs\nShovel\n1 set Weighing scale\n100Kgs capacity\n10Kgs\nGraphite coating\n2 sets\nSpray gun\n2\nsets\nWeighing scale\n15Kgs capacity\n10Kgs\nMagnesia based\ncoating\n4 pcs\nWood mallet\n4\nsets\nMolding box\n(16”x20”x6”)\n5\ncylinde\nr\nLPG 50Kgs\ncapacity\n10 pcs Paint brush (1”)\n1 set Spirit based\nleveling device\n2Kgs\nGrease\n10 pcs Paint brush (2”)\n1 set A-crane (1 ton\ncapacity)\n50m\nWire rope (1/2”\ndia, 6 strand)\n\n--- PDF PAGE 59 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY MOLDING NC II Promulgated\n\n