        "source_text": "ALT812301\n\nUNIT DESCRIPTOR: This unit covers loading up a mixer, mixing the sand, taking\ntest samples and interpreting the results, discharging the\nsand and cleaning the mixer.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n\n1. Load mixer\n(mill/muller)\n\n1.1 All pre start-up checks are performed safely and\naccording to standard operating procedures.\n1.2 Formula for sand mix is determined according to\nstandard operating procedures.\n1.3 Materials are measured and loaded according to\nformula specification.\n\n2. Mix sand\n\n2.1 Sand is mixed for correct time to specifications.\n2.2 The performance of mixer and the condition of the\nsand is monitored.\n2.3 Material supply is maintained.\n2.4 Faults are reported.\n\n3. Take and test\nsamples\n\n3.1 Sample is correctly extracted.\n3.2 Test is applied in accordance with standard operating\nprocedures.\n3.3 Test results are compared against specifications.\n3.4 Adjustments to formula/mix are made as required in\naccordance with standard operating procedures.\n\n4. Discharge mixture\n\n4.1 Load is charged correctly according to standard\noperating procedures.\n4.2 Unwanted treated sand is disposed of according to\nstandard operating procedures.\n\n5. Clean mixer\n\n5.1 Mixer is shut down to standard safety and operating\nprocedures.\n5.2 Mixer is cleaned according to standard operating\nprocedures.\n\n--- PDF PAGE 30 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY MOLDING NC II Promulgated\n\n28\nRANGE OF VARIABLE\n\nVARIABLE\nRANGE\n\n1. Materials\n\n1.1.\nSand\n1.2.\nSilica\n1.3.\nZircon\n1.4.\nChromite\n1.5.\nMixtures\n1.6.\nWater\n\n2. Faults\n\n2.1.\nChemical ratios\n2.2.\nAcid\n2.3.\nBinder\n2.4.\nWater\n\n3. Mixer\n\n3.1.\nBatch\n3.2.\nContinuous mixers\n\n--- PDF PAGE 31 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY MOLDING NC II Promulgated\n\n29\nEVIDENCE GUIDE\n\n1. Critical aspects\nof competency\nAssessment requires evidence that the candidate:\n1.1 Loaded the mixer\n1.2 Mixed sand\n1.3 Took and tested the samples\n1.4 Discharged the mixture\n1.5\nCleaned the mixer\n\n2. Underpinning\nknowledge and\nattitudes\n2.1 Characteristics, safe handling procedure and mixture\n applications of sand and binding agent\n2.2 Moulding requirements\n2.3 Mixers, applications, loading, operating and unloading\n procedures\n2.4 Volumes, quantities, ratios and percentages\n2.5 Sampling, testing and acceptance criteria for mixed sand\n2.6 Procedures for cleaning and shutting down mixer\n2.7 Environmental requirements for the disposal of unwanted\n sand\n2.8 Use and application of personal protective equipment\n2.9 Safe work practices and procedures\n2.10 Hazards and control measures related to preparing and\nmixing sand for metal moulding\n\n3. Underpinning\nskills\n3.1 Reading and following written instructions and standard\n operating procedures\n3.2 Setting parameters for mixing\n3.3 Loading mixers\n3.4 Mixing sand and monitoring the process\n3.5 Sampling and testing mixed sand\n3.6 Discharging sand\n3.7 Closing down and cleaning\n3.8 Using measurement skills for preparing and mixing sand\n within the scope of this unit.\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Workplace area: Simulated or actual\n4.2 Access to all tools, equipment, materials and documentation\n4.3 Relevant workplace procedures, product and manufacturing\n specifications, codes, standards, and reference materials.\n\n5. Method of\nassessment\nCompetency MUST be assessed through:\n5.1 Observation with Questioning\n5.2 Demonstration with Questioning\n5.3 Portfolio\n5.4 Third party report\n6. Context of\nassessment\n6.1 This unit may be assessed on-the-job, off-the-job or a\n combination of both on-and off-the-job.\n6.2 Where assessment occurs off-the-job, then an appropriate\n simulation must be used where the range of conditions\n reflects realistic workplace situations.\n6.3 The competencies covered by this unit would be\n demonstrated by an individual working alone or as part of a\n team. The assessment environment should not disadvantage\nthe candidate.\n\n--- PDF PAGE 32 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY MOLDING NC II Promulgated\n\n30\n\nUNIT OF COMPETENCY: PRODUCE MOLDS BY HAND (JOBBING)\n\nUNIT CODE:"
