        "source_text": "--- PDF PAGE 44 ---\n________________________________________________________________________________________________________________ \nTR FOUNDRY MOLDING NC II                                                                                                                Promulgated   \n           \n42\nUNIT OF COMPETENCY: OPERATE SAND CORE MAKING MACHINES \n \nUNIT CODE: ALT812305 \n \nUNIT DESCRIPTOR: This unit covers operating automatic and semi-automatic \nsand moulding and core making machines \n. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n \n1. Determine job \nrequirements \n \n1.1 Instructions and specifications are interpreted correctly. \n \n \n2. Conduct pre- \noperational checks \n \n \n2.1 Core box is selected and inspected to specifications and \ncleaned as required. Damaged core boxes are identified for \nrepair or replacement to standard operating procedures. \n2.2 Core box is set up in bolster according to standard operating \nprocedures. \n \n3. Operate machine \nto produce cores \n \n \n3.1 Appropriate core making  media is selected to produce core \nto specification. \n3.2 Cores are filled to specification according to standard \noperating procedures. \n3.3 Machine is operated in accordance with standard operating \nprocedures. \n3.4 Machine is unloaded safely to standard operating \nprocedures. \n3.5 Cores are stripped, inspected and painted as required \naccording to standard operating procedures. \n \n4. Assemble cores \n \n4.1 Cores are dried, glued and vented as required to specification \nand closed in accordance with standard operating \nprocedures.  \n \n5.  Clean and restore \nwork \n \n5.1 All material/debris is cleared and work site is cleaned \nand left in a safe state.\n\n--- PDF PAGE 45 ---\n________________________________________________________________________________________________________________ \nTR FOUNDRY MOLDING NC II                                                                                                                Promulgated   \n           \n43\nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n \n1 \nCore Making \nMedia \n \n1.1 Shell \n1.2 Chemically bonded sand as appropriate for the \nparticular machine \n2 \nMachine \n \n2.1 Automatic core making or core blowing machine \n2.2 Semi-automatic core making or core blowing machine\n\n--- PDF PAGE 46 ---\n________________________________________________________________________________________________________________ \nTR FOUNDRY MOLDING NC II                                                                                                                Promulgated   \n           \n44\nEVIDENCE GUIDE \n \n \n1. Critical aspects of \ncompetency \n \nAssessment required evidence that the candidate: \n1.1 Determined job requirements. \n1.2 Conducted pre- operational checks. \n1.3 Operated machine to produce cores. \n1.4 Assembled cores. \n1.5 Cleaned and restored work.\n \n2. Underpinning \nknowledge and \nattitudes \n2.1 Characteristics and applications of sand and binding \nagents \n2.2 Machine operation, fault identification, analysis and \nrectification procedures \n2.3 Core selection and loading procedures \n2.4 Use and application of personal protective equipment \n2.5 Safe work practices and procedures  \n2.6 Hazards and control measures associated with operating \nand moulding and core making machines\n \n3. Underpinning skills\n3.1 Interpreting written instructions and specifications \n3.2 Preparing and installing core box \n3.3 Programming operating parameters \n3.4 Operating and monitoring core making machines \n3.5 Assembling cores \n3.6 Maintaining integrity of core \n3.7 Maintaining integration of interrelated metal melting, \n3.8 Core making and sand mixing processes \n3.9 Maintaining operational capability of moulding and core \nmaking machines  \n3.10 Entering routine and familiar information onto \nproformas and standard workplace forms\n \n4. Resource \nimplications \nThe following resources MUST be provided \n4.1 Workplace area: Simulated or actual \n4.2 Access to all tools, equipment, materials and \ndocumentation required \n4.3 Relevant workplace procedures, product and  \nmanufacturing specifications, codes, standards,  manuals \nand reference materials.\n \n5. Method of \nassessment \nCompetency MUST be assessment through: \n5.1 Observation with Questioning \n5.2 Demonstration with Questioning \n5.3 Portfolio \n5.4 Third party report\n \n6. Context of \nassessment \n6.1 This unit may be assessed on-the-job, off-the-job or a \ncombination of both on-and off-the-job.  \n6.2 Where assessment occurs off the job, then an appropriate \nsimulation must be used where the range of conditions \nreflects realistic workplace situations.  \n6.3 The competencies covered by this unit would be \ndemonstrated by an individual working alone or as part of \na team.\n",
