nts\n2.16 Use and application of personal protective equipment\n2.17 Safe work practices and procedures\n2.18 Hazards and control measures associated with producing\nmoulds and cores by hand (jobbing)\n\n3. Underpinning\nskills\n3.1 Interpreting written instruction sketches and drawings\n3.2 Assembling and positioning pattern in the moulding box\n3.3 Positioning ancillary methoding components\n3.4 Preparing moulding media\n3.5 Filling and compacting the mould assembly\n3.6 Stripping the pattern\n3.7 Inspecting the mould\n3.8 Finishing the mould\n3.9 Positioning cores in prints\n3.10 Closing moulds\n3.11 Placing pouring basin\n3.12 Securing mould\n3.13 Following oral instruction\n3.14 Entering routine and familiar information onto proforma\n and standard workplace forms.\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Workplace area: Simulated or actual\n4.2 Access to all tools, equipment, materials and documentation\nrequired.\n4.3 Relevant workplace procedures, product and manufacturing\nspecifications, codes, standards, manuals and reference\nmaterials.\n\n--- PDF PAGE 36 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY MOLDING NC II Promulgated\n\n34\n\n5. Method of\nassessment\nCompetency MUST be assessed through:\n5.1 Observation with Questioning\n5.2 Demonstration with Questioning\n5.3 Portfolio\n5.4Third party report\n\n6 Context of\nassessment\n6.1 This unit may be assessed on-the-job, off-the-job or a\ncombination of both on-and off-the-job.\n6.2 Where assessment occurs off-the-job, appropriate\nsimulation must be used where the range of conditions\nreflects realistic workplace situations.\n6.3 This unit could be assessed in conjunction with any\nother units addressing the safety, quality,\ncommunication, materials handling, recording and\nreporting associated with producing jobbing moulds\nand cores by hand or other units requiring the exercise\nof the skills and knowledge covered by this unit.\n6.4 The competencies covered by this unit would be\ndemonstrated by an individual working alone or as part\nof a team\n\n--- PDF PAGE 37 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY MOLDING NC II Promulgated\n\n35\nUNIT OF COMPETENCY: PRODUCE CORES BY HAND (JOBBING)\n\nUNIT CODE: ALT812303\n\nUNIT DESCRIPTOR: This unit covers hand making of sand cores for\nmetal casting.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n\n1. Identify job\nrequirements\n\n1.1 Job requirements are correctly identified from\ndrawings, instructions and specifications.\n1.2 Material is selected appropriate to job requirements.\n\n2. Determine\nsequence of\noperation\n\n2.1 Sequence of operation including job set-up is\ndetermined for maximum efficiency and to meet job\nspecifications.\n\n3. Select inspect and\nprepare core box\nequipment\n\n3.1 Core box is correctly identified from specifications to\nstandard operating procedures.\n3.2 The core box is inspected to specifications, and\ndamaged patterns are identified for repair or\nreplacement to standard operating procedures. Core\nbox is assembled to specification.\n3.4 Core box is set up to specification according to\nstandard operating procedures.\n\n4 Make sand core\n\n4.1 Core box is positioned and wires and gagers are\ninserted as required. Then cavity is filled with mixed\ncore sand according to standard operating procedures.\n4.2 Core box is closed and checked for compliance to\ncomponent specification in accordance with standard\noperating procedures.\n4.3 Appropriate core making equipment is selected and\npositioned according to standard operating\nprocedures.\n4.4 Appropriate core curing media is selected to produce\ncore to specification.\n4.5 Core is secured according to standard operating\nprocedures.\n4.6 Core curing media is used to produce core according\nto standard operating procedures.\n4.7 Core is allowed to harden or cure\n4.8 Parting and stripping systems are utilized in\naccordance with standard operating procedures.\n4.9 Core is finished by removing fins and protrusions, and\nthen coated with refractory core wash.\n4.10 Core is secured and stored according to standard\n\n--- PDF PAGE 38 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY MOLDING NC II Promulgated\n\n36\noperating procedures.\n4.11 Core box is inspected and repaired as required.\n4.13 Core box is cleaned and painted according to\nspecification using standard operating procedures.\n\n5. Clean and restore\nwork area\n\n5.1 All materials/debris is cleared and work site cleaned\nand left in a safe state.\n5.2 Unwanted treated sand is disposed of according to\nstandard operating procedures and legislative and\nstatutory requirements.\n\n--- PDF PAGE 39 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY MOLDING NC II Promulgated\n\n37\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n\n1.\nMaterials\n1.1 Binders\n1.2 Catalyst\n1.3 Sand additives\n1.4 Break down agents\n1.5 Mould coatings\n\n2. Core-box\n2.1 Full\n2.2 Half\n2.3 Segment core-box\n\n3. Secured\n3.1 Weights\n3.2 Clamps\n3.3 Bolting\n\n4. Core curing media\n\n4.1 Silica sand\n4.2 Chromite sand\n4.3 Shell sand\n4.4 Sodium silicate\n4.5 Breakdown agents\n4.6 Chemically bonded media etc.\n\n5. Parting and stripping\nsystems\n\n5.1 Dry\n5.2 Wet\n\n--- PDF PAGE 40 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY MOLDING NC II Promulgated\n\n38\nEVIDENCE GUIDE\n1. Critical\naspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Demonstrated the competency to produce jobbing molds and\ncores by hand.\n\n2. Underpinning\nknowledge\nand attitudes\n2.1 Metal casting process\n2.2 Core box types, assembly techniques and their application\n2.3 Selection of core box and ancillary components\n2.4 Sand types and their bonding systems\n2.5 Compaction processes\n2.6 Parting and stripping systems\n2.7 Mold requirements\n2.8 Finishing and closing techniques\n2.9 Core placement\n2.10 Pouring requirements\n2.11 Securing systems\n2.12 Core box care and storage\n2.13 Environmental requirements\n2.14 Use and application of personal protective equipment\n2.15 Safe work practices and procedures\n2.16 Hazards and control measures associated with producing\ncores by hand (jobbing)\n\n3. Underpinning\nskills\n3.1 Interpreting written instruction sketches and drawings\n3.2 Assembling and positioning core box\n3.3 Positioning ancillary methoding components\n3.4 Preparing core making media\n3.5 Filling and compacting the core box assembly\n3.6 Stripping, inspecting, finishing the core box\n3.7 Following oral instruction\n3.8 Entering routine and familiar information onto proforma\n and standard workplace forms\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Workplace area: Simulated of actual\n4.2 Access to all tools, equipment, materials and documentation\nrequired\n4.3 Relevant workplace procedures, product and manufacturing\nspecifications, codes, standards, manuals and references\n5 Method of\nassessment\nCompetency MUST be assessed through:\n5.1 Observation with questioning\n5.2 Demonstration with questioning\n5.3 Portfolio\n5.4 Third party report\n\n6. Context of\nassessment\n6.1 This unit may be assessed on-the-job, off-the-job or a\ncombination of both on-and off-the-job.\n6.2 Where assessment occurs off the job, an appropriate simulation\nmust be used where the range of conditions reflects realistic\nworkplace situations.\n6.3 The competencies covered by this unit would be demonstrated\nby an individual working alone or as part of a team.\n\n--- PDF PAGE 41 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY MOLDING NC II Promulgated\n\n39\nUNIT OF COMPETENCY: OPERATE SAND MOLDING MACHINES\n\nUNIT CODE: ALT812304\n\nUNIT DESCRIPTOR: This unit covers operating automatic and semi-automatic\nsand molding and core making machines\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n\n1. Determine job\nrequirements\n\n1.1 Instructions and specifications are interpreted correctly.\n\n2. Conduct pre-\noperational checks\n\n2.1 Pattern is selected and inspected to specifications and\ncleaned as required. Damaged patterns/core boxes are\nidentified for repair or replacement to standard operating\nprocedures.\n2.2 Pattern is set up in bolster and core box according to\nstandard operating procedures.\n\n3. Operate machine\nto produce\nmould/cores\n\n3.1 Appropriate molding media is selected to produce mould\nand core to specification.\n3.2 Moulds are filled to specification according to standard\noperating procedures.\n3.3 Machine is operated in accordance with standard operating\nprocedures.\n3.4 Machine is unloaded safely to standard operating\nprocedures.\n3.5 Moulds are stripped, inspected and painted as required\naccording to standard operating procedures.\n\n4. Assemble\nmoulds/cores\n\n4.1 Molds are dried and vented as required to specification and\nclosed in accordance with standard operating procedures.\n4.2 Runner bush is set to specification as required.\n\n5. Clean and restore\nwork\n\n5.1 All material/debris is cleared and work site is cleaned\nand left in a safe state.\n\n--- PDF PAGE 42 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY MOLDING NC II Promulgated\n\n40\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n\n1. Molding media\nMolding media may include the following or as appropriate\nfor the particular machine:\n\n1.1 Shell\n1.2 Chemically bonded\n1.3 Green sand\n2. Machine\n2\n\n2.1 Automatic molding machine\n2.2 Semi-automatic molding machine\n\n--- PDF PAGE 43 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY MOLDING NC II Promulgated\n\n41\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\n\nAssessment requires evidence that the candidate:\n1.1. Determined job requirements\n1.2. Conducted pre- operational checks\n1.3. Operated machine to produce mold/cores\n1.4. Assembled molds/cores\n1.5.Cleaned and restored work\n\n2. Underpinning\nknowledge and\nattitudes\n2.1 Characteristics and applications of sand and binding\nagents\n2.2 Machine operation, fault identification, analysis and\nrectification procedures\n2.3 Core selection and loading procedures\n2.4 Use and application of personal protective equipment\n2.5 Safe work practices and procedures\n2.6 Hazards and control measures associated with operating\nsand moulding machines.\n\n3. Underpinning\nskills\n3.1 Interpreting written instructions and specifications\n3.2 Preparing and installing pattern\n3.3 Programming operating parameters\n3.4 Operating and monitoring moulding machines\n3.5 Assembling molds\n3.6 Inserting cores (in moulding machines)\n3.7 Inserting runner bushes\n3.8 Maintaining integrity of mold\n3.9 Maintaining integration of interrelated metal melting,\ncore making and sand mixing processes\n3.10 Maintaining operational capability of molding machines\n3.11 Entering routine and familiar information onto\nproformas and standard workplace forms\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Workplace area: Simulated or actual\n4.2 Access to all tools, equipment, materials and documentation\nrequired\n4.3 Relevant workplace procedures, product and manufacturing\nspecifications, codes, standards, manuals and reference\nmaterials.\n\n5. Method of\nassessment\nCompetency MUST be assessed through:\n5.1. Observation with questioning\n5.2. Demonstration with questioning\n5.3. Portfolio\n5.4.Third party report\n\n6. Context of\nassessment\n6.1. This unit may be assessed on-the-job, off-the-job or a\ncombination of both on-and off-the-job.\n6.2. Where assessment occurs off the job, then an appropriate\nsimulation must be used where the range of conditions\nreflects realistic workplace situations.\n6.3 The competencies covered by this unit would be\ndemonstrated by an individual working alone or as part of a\nteam.\n\n--- PDF PAGE 44 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY MOLDING NC II Promulgated\n\n42\nUNIT OF COMPETENCY: OPERATE SAND CORE MAKING MACHINES\n\nUNIT CODE: ALT812305\n\nUNIT DESCRIPTOR: This unit covers operating automatic and semi-automatic\nsand moulding and core making machines\n.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n\n1. Determine job\nrequirements\n\n1.1 Instructions and specifications are interpreted correctly.\n\n2. Conduct pre-\noperational checks\n\n2.1 Core box is selected and inspected to specifications and\ncleaned as required. Damaged core boxes are identified for\nrepair or replacement to standard operating procedures.\n2.2 Core box is set up in bolster according to standard operating\nprocedures.\n\n3. Operate machine\nto produce cores\n\n3.1 Appropriate core making media is selected to produce core\nto specification.\n3.2 Cores are filled to specification according to standard\noperating procedures.\n3.3 Machine is operated in accordance with standard operating\nprocedures.\n3.4 Machine is unloaded safely to standard operating\nprocedures.\n3.5 Cores are stripped, inspected and painted as required\naccording to standard operating procedures.\n\n4. Assemble cores\n\n4.1 Cores are dried, glued and vented as required to specification\nand closed in accordance with standard operating\nprocedures.\n\n5. Clean and restore\nwork\n\n5.1 All material/debris is cleared and work site is cleaned\nand left in a safe state.\n\n--- PDF PAGE 45 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY MOLDING NC II Promulgated\n\n43\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n\n1\nCore Making\nMedia\n\n1.1 Shell\n1.2 Chemically bonded sand as appropriate for the\nparticular machine\n2\nMachine\n\n2.1 Automatic core making or core blowing machine\n2.2 Semi-automatic core making or core blowing machine\n\n--- PDF PAGE 46 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY MOLDING NC II Promulgated\n\n44\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\n\nAssessment required evidence that the candidate:\n1.1 Determined job requirements.\n1.2 Conducted pre- operational checks.\n1.3 Operated machine to produce cores.\n1.4 Assembled cores.\n1.5 Cleaned and restored work.\n\n2. Underpinning\nknowledge and\nattitudes\n2.1 Characteristics and applications of sand and binding\nagents\n2.2 Machine operation, fault identification, analysis and\nrectification procedures\n2.3 Core selection and loading procedures\n2.4 Use and application of personal protective equipment\n2.5 Safe work practices and procedures\n2.6 Hazards and control measures associated with operating\nand moulding and core making machines\n\n3. Underpinning skills\n3.1 Interpreting written instructions and specifications\n3.2 Preparing and installing core box\n3.3 Programming operating parameters\n3.4 Operating and monitoring core making machines\n3.5 Assembling cores\n3.6 Maintaining integrity of core\n3.7 Maintaining integration of interrelated metal melting,\n3.8 Core making and sand mixing processes\n3.9 Maintaining operational capability of moulding and core\nmaking machines\n3.10 Entering routine and familiar information onto\nproformas and standard workplace forms\n\n4. Resource\nimplications\nThe following resources MUST be provided\n4.1 Workplace area: Simulated or actual\n4.2 Access to all tools, equipment, materials and\ndocumentation required\n4.3 Relevant workplace procedures, product and\nmanufacturing specifications, codes, standards, manuals\nand reference materials.\n\n5. Method of\nassessment\nCompetency MUST be assessment through:\n5.1 Observation with Questioning\n5.2 Demonstration with Questioning\n5.3 Portfolio\n5.4 Third party report\n\n6. Context of\nassessment\n6.1 This unit may be assessed on-the-job, off-the-job or a\ncombination of both on-and off-the-job.\n6.2 Where assessment occurs off the job, then an appropriate\nsimulation must be used where the range of conditions\nreflects realistic workplace situations.\n6.3 The competencies covered by this unit would be\ndemonstrated by an individual working alone or as part of\na team.\n\n--- PDF PAGE 47 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY MOLDING NC II Promulgated\n\n45\nUNIT OF COMPETENCY: POUR MOLTEN METAL TO MOLDS\n\nUNIT CODE: ALT812306\n\nUNIT DESCRIPTOR: This unit covers the competency in manually pouring molten\nmetal. to molds\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n\n1. Prepare for\npouring molten\nmetal\n\n1.1 The condition of the mould is checked according to\nstandard operating procedures.\n1.2 The condition of the ladle is checked according to\nstandard operating procedures.\n1.3 The temperature of molten metal is checked for\nconformance to specification, and pouring method is\nsequenced to standard operating procedures.\n1.4 The capacity of the required pour is identified against\nspecification according to standard operating\nprocedures.\n2. Preheat or\nprepare ladle\n2.1 The ladle is preheated/ prepared to receive molten\nmetal.\n3. Transfer ladle to\npouring area\n\n3.1 Safety clips are checked according to standard operating\nprocedures.\n3.2 The ladle is filled and transferred to the pouring area in\naccordance with standard operating procedures.\n3.3 Additives are determined from specification and added\nto molten metal as required.\n4. Maintain quality of\nmetal as required\n\n4.1 Slag/dross is removed where necessary.\n4.2 The temperature is monitored as required.\n4.3 Chemical analysis is undertaken and remedial action is\napplied as required to standard operating procedures.\n5. Pour molten metal\n5.1 Personnel in the immediate area of the metal pour are\ninformed that pour is to take place and appropriate\nsafety clothing and equipment is used as specified in\nstandard operating procedures.\n5.2 Metal is poured safely to specification and in accordance\nwith standard operating procedures.\n5.3 Metal is poured at an appropriate and continuous rate.\n5.4 A test bar is poured in accordance with standard\noperating procedures as required.\n\n The ladle is emptied of excess metal and cleaned and\nmaintained according to standard operating procedures.\nLadle is returned to appropriate location.\n\n--- PDF PAGE 48 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY MOLDING NC II Promulgated\n\n46\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n\n1. Ladle\n\n1.1 Lip pour\n1.2 Tea pot\n1.3 Bottom pour\n1.4 Barrel\n1.5 Bull ladles of varying capacity\n2. Additives\n\n2.1 Alloys\n2.2 Inoculants\n2.3 Spheroidisers\n2.4 Coagulants\n\n--- PDF PAGE 49 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY MOLDING NC II Promulgated\n\n47\nEVIDENCE GUIDE\n\n1. Critical aspects\nof competency\n\nAssessment requires evidence that the candidate:\n1.1 Prepared for pouring molten metal\n1.2 Preheated or prepared ladle\n1.3 Transferred ladle to furnace\n1.4 Poured molten metal and maintained quality of metal as\nrequired\n2. Underpinning\nknowledge and\nattitudes\n2.1 Types and pouring characteristics of metals\n2.2 Types and characteristics of ladles\n2.3 Procedures for maintaining condition and integrity of ladle\n2.4 Procedure on safe handling and transfer of molten metal\n2.5 Metal treatments procedures for making additions to\nmolten metal\n2.6 Slag and dross removing procedures\n2.7 Techniques for sampling/testing molten metal pouring\n2.8 Metal identification and tagging procedures\n2.9 Use and application of personal protective equipment\n2.10Safe work practices and procedures\n2.11 Hazards and control measures on pouring molten metal\n3. Underpinning\nskills\n3.1 Reading and following written instructions, standard\noperating procedures, specifications and standard test\ndata sheets\n3.2 Selecting and checking ladle\n3.3 Preparing ladle for pouring\n3.4 Transferring metal to ladle\n3.5 Treating metal\n3.6 Removing slag and dross\n3.7 Sampling and testing molten metal\n3.8 Pouring molten metal into moulds and pigs\n3.9 Tagging pig metal\n4. Resource\nimplications\nThe following resources MUST be provided\n4.1 Workplace area: Simulated or actual\n4.2 Access to all tools, equipment, materials and\ndocumentation required\n4.3 Relevant workplace procedures, product and\nmanufacturing specifications, codes, standards, manuals\nand reference materials.\n5. Method of\nassessment\nCompetency MUST be assessment through:\n5.1 Observation with Questioning\n5.2 Demonstration with Questioning\n5.3 Portfolio\n5.4 Third party report\n6 Context of\nassessment\n6.1 This unit may be assessed on-the-job, off-the-job or a\ncombination of both on-and off-the-job.\n6.2 Where assessment occurs off the job, then an\nappropriate simulation must be used where the range of\nconditions reflects realistic workplace situations.\n6.3 The competencies covered by this unit would be\ndemonstrated by an individual working alone or as part of\na team.\n\n--- PDF PAGE 50 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY MOLDING NC II Promulgated\n\n48\nUNIT OF COMPETENCY: USE AND MAINTAIN MEASURING INSTRUMENT\n\nUNIT CODE: ALT821303\n\nUNIT DESCRIPTOR: This unit identifies the competence required to measure\ncomponents or sections using non-specialist instrument and\nmaintain the measuring instrument.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n\n1. Measure\ndimensions or\nvariables using\nappropriate\ninstrument\n\n1.1 Measurement of dimensions and variables are\ncompleted without causing damage to any instrument\nor components\n1.2 Appropriate measuring instrument is selected\n1.3 Relevant measuring techniques are used and\nresults appropriately recorded\n1.4 All measuring activities are carried out according to\nindustry regulations/guidelines OHS & requirements\nand enterprise/procedures policies\n\n2. Maintain\nmeasuring\ninstrument\n2.1 Maintenance of measuring instrument is achieved\nwithout causing damage to any instrument or\ncomponent\n2.2 Routine care and storage of measuring\ninstrument is undertaken according to manufacture\nspecifications\n2.3 Checking and calibrating of measuring devices is\ndone prior to use.\n2.4 All maintenance activities of measuring instruments\nare carried out according to industry\nregulations/guidelines OHS legislation, and\nenterprise procedures policies\n\n--- PDF PAGE 51 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY MOLDING NC II Promulgated\n\n49\n\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Dimension and\nVariables\nMeasurement\n1.1 Length\n1.2 Width\n1.3 Diameter\n1.4 Tapes\n1.5 Machinery Allowance\n1.6 Angles\n2. Measuring\ninstrument and\ntools\n2.1 Handtools\n2.2 Vernier Caliper\n2.3 Straight edge\n2.4 Inside Caliper\n2.5 T-squares,\n2.6 Flat edges,\n2.7Protractors\n3. Measuring\ntechnique\n3.1 Correct usage of the above mentioned measuring\n instrument and tools.\n3.2 Out of round or ovality\n3.3 Cylindricity or taper conicity\n4. OHS\nRequirements\n4.1 Wearing of personal protective instrument such as\n apron, goggles, gloves, safety shoes\n4.2 Disposal of wastes materials\n4.3 Workshop housekeeping\n5. Routine care\nand storage of\nmeasuring\ninstrument\n5.1 Periodic check up of micrometer with standard bars\n5.2 Storage in box separated from hand tools\n5.3 Proper handling\n5.4 Not to exposed to liquid such as water.\n\n--- PDF PAGE 52 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY MOLDING NC II Promulgated\n\n50\n\nEVIDENCE GUIDE\n1. Critical aspects\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Measured components or section using correct\ninstrument.\n1.2Maintained measuring instrument.\n2. Underpinning\nknowledge and\nattitudes\n2.1 Personal and instrument safety requirements\n2.2 Measuring instrument types and their application\n2.3 Measuring procedures\n2.4 Measuring instrument graduation\n2.5 Measuring instrument maintenance procedures\n2.6 Positive Work values ( Perseverance, Patience,\n Honesty, Attention to Details)\n3. Underpinning\nskills\n3.1 Accessing, interpreting and applying technical\n information\n3.2 Using tools and instrument correctly and safely\n3.3 Maintain measuring instrument\n3.4 Using measuring instrument\n4 Resource\nimplications\nThe following resources MUST be provided:\n4.1 Workplace: Real or simulated work area\n4.2 Appropriate Tools & instrument\n4.3 Materials relevant to the activity\n5 Method of\nassessment\nCompetency MUST be assessed through\n5.1 Demonstration of skills in measurement of length,\nsquareness, flatness, angles, roundness, depth,\nclearance or any measurements that can be taken from\nanalogue or digital devices.\n5.2 Written examination\n6 Context of\nassessment\n6.1 The assessment of practical skills must only take place\nafter a period of supervised practice and repetitive\nexperience in a safe working environment. If workplace\nconditions are not available, assessment in simulated\nworkplace conditions is acceptable.\n\n--- PDF PAGE 53 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY MOLDING NC II Promulgated\n\n51"
