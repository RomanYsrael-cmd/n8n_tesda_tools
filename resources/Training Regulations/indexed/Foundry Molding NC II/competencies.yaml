        "source_title": "OPERATE SAND MOLDING MACHINES",
        "source_text": "--- PDF PAGE 41 ---\n________________________________________________________________________________________________________________ \nTR FOUNDRY MOLDING NC II                                                                                                                Promulgated   \n           \n39\nUNIT OF COMPETENCY: OPERATE SAND MOLDING MACHINES \n \nUNIT CODE: ALT812304 \n \nUNIT DESCRIPTOR: This unit covers operating automatic and semi-automatic \nsand molding and core making machines \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n \n1. Determine job \nrequirements \n \n1.1 Instructions and specifications are interpreted correctly. \n \n \n2. Conduct pre- \noperational checks \n \n \n2.1 Pattern is selected and inspected to specifications and \ncleaned as required. Damaged patterns/core boxes are \nidentified for repair or replacement to standard operating \nprocedures. \n2.2 Pattern is set up in bolster and core box according to \nstandard operating procedures. \n \n3. Operate machine \nto produce \nmould/cores \n \n \n3.1 Appropriate molding media is selected to produce mould \nand core to specification. \n3.2 Moulds are filled to specification according to standard \noperating procedures. \n3.3 Machine is operated in accordance with standard operating \nprocedures. \n3.4 Machine is unloaded safely to standard operating \nprocedures. \n3.5 Moulds are stripped, inspected and painted as required \naccording to standard operating procedures. \n \n4.  Assemble \nmoulds/cores \n \n4.1 Molds are dried and vented as required to specification and \nclosed in accordance with standard operating procedures. \n4.2 Runner bush is set to specification as required. \n \n5.  Clean and restore \nwork \n \n5.1 All material/debris is cleared and work site is cleaned \nand left in a safe state.\n\n--- PDF PAGE 42 ---\n________________________________________________________________________________________________________________ \nTR FOUNDRY MOLDING NC II                                                                                                                Promulgated   \n           \n40\nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n \n1. Molding media \nMolding media may include the following or as appropriate \nfor the particular machine: \n \n1.1 Shell \n1.2 Chemically bonded  \n1.3 Green sand  \n2. Machine \n2 \n \n2.1 Automatic molding machine \n2.2 Semi-automatic molding machine\n\n--- PDF PAGE 43 ---\n________________________________________________________________________________________________________________ \nTR FOUNDRY MOLDING NC II                                                                                                                Promulgated   \n           \n41\nEVIDENCE GUIDE \n \n1. Critical aspects of \ncompetency \n \nAssessment requires evidence that the candidate: \n1.1. Determined job requirements \n1.2. Conducted pre- operational checks \n1.3. Operated machine to produce mold/cores \n1.4. Assembled molds/cores \n1.5.Cleaned and restored work\n \n2. Underpinning \nknowledge and \nattitudes \n2.1 Characteristics and applications of sand and binding \nagents \n2.2 Machine operation, fault identification, analysis and \nrectification procedures \n2.3 Core selection and loading procedures \n2.4 Use and application of personal protective equipment \n2.5 Safe work practices and procedures  \n2.6 Hazards and control measures associated with operating \nsand moulding machines.\n \n3. Underpinning \nskills \n3.1 Interpreting written instructions and specifications \n3.2 Preparing and installing pattern \n3.3 Programming operating parameters \n3.4 Operating and monitoring moulding machines \n3.5 Assembling molds \n3.6 Inserting cores (in moulding machines) \n3.7 Inserting runner bushes \n3.8 Maintaining integrity of mold  \n3.9 Maintaining integration of interrelated metal melting, \ncore making and sand mixing processes \n3.10 Maintaining operational capability of molding  machines  \n3.11 Entering routine and familiar information onto \nproformas and standard workplace forms\n4. Resource \nimplications \nThe following resources MUST be provided: \n4.1  Workplace area: Simulated or actual \n4.2  Access to all tools, equipment, materials and  documentation \nrequired \n4.3  Relevant workplace procedures, product and manufacturing \nspecifications, codes, standards, manuals and reference \nmaterials.\n \n5. Method of \nassessment \nCompetency MUST be assessed through: \n5.1. Observation with questioning \n5.2. Demonstration with questioning \n5.3. Portfolio \n5.4.Third party report\n \n6. Context of \nassessment \n6.1. This unit may be assessed on-the-job, off-the-job or a \ncombination of both on-and off-the-job.  \n6.2.  Where assessment occurs off the job, then an appropriate \nsimulation must be used where the range of conditions \nreflects realistic workplace situations.  \n6.3 The competencies covered by this unit would be \ndemonstrated by an individual working alone or as part of a \nteam.\n",
        "required_knowledge": null,
        "required_skills": null
      },
