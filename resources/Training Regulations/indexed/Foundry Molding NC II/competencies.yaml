 PAGE 33 ---\n________________________________________________________________________________________________________________ \nTR FOUNDRY MOLDING NC II                                                                                                                Promulgated   \n           \n31\n4.11 Mold and core is cleaned and painted according to    \n        specification using standard operating procedures. \n4.12 Mold is secured according to standard operating  \n        procedures. \n4.13 Pouring basin is selected or manufactured to  \n        specification and positioned in accordance with  \n       standard operating procedures.\n \n5. Clean and restore \nwork area \n \n \n5.1 All materials/debris is cleared and work site cleaned and \nleft in a safe state. \n5.2 Unwanted treated sand is disposed of according to \nstandard operating procedures and legislative and statutory \nrequirements.\n\n--- PDF PAGE 34 ---\n________________________________________________________________________________________________________________ \nTR FOUNDRY MOLDING NC II                                                                                                                Promulgated   \n           \n32\nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n \n1. Materials \n1.1 Binders \n1.2 Hardeners \n1.3 Sand additives \n1.4 Mold coatings\n \n2 \nPatterns \n2.1 Flatback \n2.2 Uneven \n2.3 Plated patterns  \n2.4 Multi-joint \n2.5 Consumable \n2.6 Split patterns \n2.7  Loose piece patterns \n2.8  Patterns requiring odd sides \n2.9  Cored moulds \n2.10 Drag and cope mould etc.\n \n3 \nMolds \n3.1 Flatback \n3.2 Uneven jointed \n3.3 Multi-part molds\n \n4 \nMolding media  \n4.1 Green sand \n4.2 Shell sand \n4.3 Chemically bonded media etc. \n5 \nParting and \nstripping systems \n \n5.1 Dry  \n5.2 Wet \n \n6 \nRunners  \n \n6.1 Hand-formed \n6.2 Pattern-formed \n7. Secured \n \n6.1 Weights \n6.2 Clamps \n6.3 Bolting \n8. Core \n8.1 Full \n8.2 Half  \n8.3 Segment cores \n \n9. Pouring basin  \n \n \n9.1 Hand-formed \n9.2 Pattern-formed\n\n--- PDF PAGE 35 ---\n________________________________________________________________________________________________________________ \nTR FOUNDRY MOLDING NC II                                                                                                                Promulgated   \n           \n33"
