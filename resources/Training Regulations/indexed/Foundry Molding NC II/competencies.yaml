        "source_text": "ALT812302\n\nUNIT DESCRIPTOR: This unit covers hand making of sand molds and cores for\nmetal casting.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n\n1. Identify job\nrequirements\n1.1 Job requirements are correctly identified from drawings,\ninstructions and specifications.\n1.2 Material is selected appropriate to job requirements.\n\n2. Determine\nsequence of\noperation\n\n2.1 Sequence of operation including job set-up is determined\nfor maximum efficiency and to meet job specifications.\n\n3. Select inspect and\nprepare pattern\nequipment\n3.1 Pattern equipment is correctly identified from specifications\nto standard operating procedures.\n3.2 Pattern equipment is inspected to specifications, and\ndamaged patterns are identified for repair or replacement\nto standard operating procedures. Pattern is assembled to\nspecification.\n3.3 Pattern equipment is set up to specification according to\nstandard operating procedures.\n\n4. Make mould\n4.1 Appropriate mold-making equipment is selected and\npositioned according to standard operating procedures.\n4.2 Appropriate molding media is selected to produce mold to\nspecification.\n4.3 Molding media is used to produce mold according to\nstandard operating procedures.\n4.4 Molds are rammed up with joints and drawbacks as\nrequired to standard operating procedures.\n4.5 Parting and stripping systems are utilized in accordance\nwith standard operating procedures.\n4.6 Loose pieces, vents, risers and runners are positioned and\nsecured as required to standard operating procedures.\n4.7 Pattern and loose pieces are removed from mold and core\nbox in a safe manner least likely to cause damage to the\npattern and in accordance with standard operating\nprocedures.\n4.8 Core is positioned in prints utilizing chaplets and chills as\nrequired and vented to specification according to standard\noperating procedures.\n4.9 Mold is closed and checked for compliance to\n component specification in accordance with standard\noperating procedures.\n4.10 Mold is inspected and repaired as required.\n\n--- PDF PAGE 33 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY MOLDING NC II Promulgated\n\n31\n4.11 Mold and core is cleaned and painted according to\n specification using standard operating procedures.\n4.12 Mold is secured according to standard operating\n procedures.\n4.13 Pouring basin is selected or manufactured to\n specification and positioned in accordance with\n standard operating procedures.\n\n5. Clean and restore\nwork area\n\n5.1 All materials/debris is cleared and work site cleaned and\nleft in a safe state.\n5.2 Unwanted treated sand is disposed of according to\nstandard operating procedures and legislative and statutory\nrequirements.\n\n--- PDF PAGE 34 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY MOLDING NC II Promulgated\n\n32\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n\n1. Materials\n1.1 Binders\n1.2 Hardeners\n1.3 Sand additives\n1.4 Mold coatings\n\n2\nPatterns\n2.1 Flatback\n2.2 Uneven\n2.3 Plated patterns\n2.4 Multi-joint\n2.5 Consumable\n2.6 Split patterns\n2.7 Loose piece patterns\n2.8 Patterns requiring odd sides\n2.9 Cored moulds\n2.10 Drag and cope mould etc.\n\n3\nMolds\n3.1 Flatback\n3.2 Uneven jointed\n3.3 Multi-part molds\n\n4\nMolding media\n4.1 Green sand\n4.2 Shell sand\n4.3 Chemically bonded media etc.\n5\nParting and\nstripping systems\n\n5.1 Dry\n5.2 Wet\n\n6\nRunners\n\n6.1 Hand-formed\n6.2 Pattern-formed\n7. Secured\n\n6.1 Weights\n6.2 Clamps\n6.3 Bolting\n8. Core\n8.1 Full\n8.2 Half\n8.3 Segment cores\n\n9. Pouring basin\n\n9.1 Hand-formed\n9.2 Pattern-formed\n\n--- PDF PAGE 35 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY MOLDING NC II Promulgated\n\n33\nEVIDENCE GUIDE\n\n1. Critical aspects\nof competency\n\nAssessment required evidence that the candidate:\n1.1 Identified job requirements.\n1.2 Determined sequence of operation.\n1.3 Selected, inspected and prepared pattern equipment.\n1.4 Made mould.\n1.5 Cleaned and restored work area.\n\n2. Underpinning\nknowledge and\nattitudes\n2.1 Metal casting process\n2.2 Variety of pattern types and their application\n2.3 Pattern assembly techniques\n2,4 Selection of moulding box\n2.5 How to select ancillary components\n2.6 Sand types and their bonding systems\n2.7 Compaction processes\n2.8 Parting and stripping systems\n2.9 Mould requirements\n2.10 Finishing and closing techniques\n2.11 Core placement\n2.12 Pouring requirements\n2.13 Securing systems\n2.14 Pattern care and storage\n2.15 Environmental requirements\n2.16 Use and application of personal protective equipment\n2.17 Safe work practices and procedures\n2.18 Hazards and control measures associated with producing\nmoulds and cores by hand (jobbing)\n\n3. Underpinning\nskills\n3.1 Interpreting written instruction sketches and drawings\n3.2 Assembling and positioning pattern in the moulding box\n3.3 Positioning ancillary methoding components\n3.4 Preparing moulding media\n3.5 Filling and compacting the mould assembly\n3.6 Stripping the pattern\n3.7 Inspecting the mould\n3.8 Finishing the mould\n3.9 Positioning cores in prints\n3.10 Closing moulds\n3.11 Placing pouring basin\n3.12 Securing mould\n3.13 Following oral instruction\n3.14 Entering routine and familiar information onto proforma\n and standard workplace forms.\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Workplace area: Simulated or actual\n4.2 Access to all tools, equipment, materials and documentation\nrequired.\n4.3 Relevant workplace procedures, product and manufacturing\nspecifications, codes, standards, manuals and reference\nmaterials.\n\n--- PDF PAGE 36 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY MOLDING NC II Promulgated\n\n34\n\n5. Method of\nassessment\nCompetency MUST be assessed through:\n5.1 Observation with Questioning\n5.2 Demonstration with Questioning\n5.3 Portfolio\n5.4Third party report\n\n6 Context of\nassessment\n6.1 This unit may be assessed on-the-job, off-the-job or a\ncombination of both on-and off-the-job.\n6.2 Where assessment occurs off-the-job, appropriate\nsimulation must be used where the range of conditions\nreflects realistic workplace situations.\n6.3 This unit could be assessed in conjunction with any\nother units addressing the safety, quality,\ncommunication, materials handling, recording and\nreporting associated with producing jobbing moulds\nand cores by hand or other units requiring the exercise\nof the skills and knowledge covered by this unit.\n6.4 The competencies covered by this unit would be\ndemonstrated by an individual working alone or as part\nof a team\n\n--- PDF PAGE 37 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY MOLDING NC II Promulgated\n\n35\nUNIT OF COMPETENCY: PRODUCE CORES BY HAND (JOBBING)\n\nUNIT CODE:"
