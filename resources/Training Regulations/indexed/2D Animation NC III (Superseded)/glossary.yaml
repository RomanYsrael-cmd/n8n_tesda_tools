      "definition": "____________________________________________________________________________________________ TR - ANIMATION (2D Digital) NC III Promulgated - July 27, 2007 / secjr 58 4. Clean-up - refers to the process of refining the rough artwork of 2D animation. The purpose of clean-up is to recreate the animation with smooth, consistent line art and line weights before it is transferred to cels for painting. 5. Computer – a device that has the ability to accept data; internally store and execute a program of instructions; perform mathematical, logical, and manipulative operations on data; and report the results. 6. Computer Terminal – any input/output device connected by telecommunications links to a computer. 7. Data - objective measurements of the attributes (characteristics) of entities such as people, places, things, and events. 8. Documentation – a collection of documents or information. 9. Edit – to modify the form or format of data 10. Encryption – to scramble data or convert it, prior to transmission, to a secret code that masks the meaning of he data to unauthorized recipients. 11. End user – anyone who uses an information system or the information it produces. 12. Ergonomics - the science and technology emphasizing the safety, comfort, and ease of use of human-operated machines. The goal of ergonomics is to produce systems that are user-friendly: safe, comfortable and easy to use. 13. Information – data placed in a meaningful and useful context for an end user. 14. Information and Communication Technology (ICT) - refers to technologies associated with the transmission and exchange of data in the form of sound, text, visual images, signals or any combination of those forms through the use of digital technology. It encompasses such services as telecommunications, posts, multimedia, electronic commerce, broadcasting, and information technology. 15. Key frame - is a single still image in an animated sequence that occurs at an important point in that sequence; key frames are defined throughout an animated sequence, in order to define pivotal points of motion before the frames in between are drawn or otherwise created to \"tween\" the motion between the two key frames. 16. Local Area Network (LAN) – a communications network that typically connects computers, terminals, and other computerized devices within a limited physical area such as an office, building, manufacturing plant and other work sites. 17. Outsourcing – turning over all or part of an organization’s information systems operation to outside contractors, known as systems integrators or facilities management companies. 18. Quality Assurance – methods for ensuring that information systems are free from errors and fraud and provide information products of high quality. 19. Simulation - the process of imitating a real phenomenon with a set of mathematical formulas. Advanced computer programs can simulate weather conditions, chemical reactions, atomic reactions, even biological processes. 20. Software – computer programs and procedures concerned with the operation of an information system. 21. Standards – measures of performance developed to evaluate the progress of a system toward its objectives"
