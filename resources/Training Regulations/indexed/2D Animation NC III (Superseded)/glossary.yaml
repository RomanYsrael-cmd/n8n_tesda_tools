      "definition": "____________________________________________________________________________________________ TR - ANIMATION (2D Digital) NC III Promulgated - July 27, 2007 / secjr 59 22. System – an assembly of methods, procedures, or techniques unified by regulated interaction to form an organized whole 23. Tween - is actually short for \"in-between\", and refers to the creation of successive frames of animation between key frames. In computer animation, the term is most commonly used for Flash's \"shape tweening\" and \"motion tweening\" processes, where the user can define two key frames and Flash will automatically create the in-between frames, either morphing one shape into another over a set period of time or else moving a shape or shapes from point A to point B over a set period of time. 3D animation programs also have their own method of \"tweening\". 24. Vector - is a line or a movement defined by end-points or, essentially, the distance between point A and point B. Vectors can be used to calculate animated motion mathematically instead of through the use of manual key frames; vectors can also be used to define computer-animated shapes. 25. Vector animation - is a term used to refer to animation whose art or motion is controlled by vectors rather than pixels. Vector animation often allows cleaner, smoother animation, because images are displayed and/or resized using mathematical values instead of stored pixel values. One of the most commonly used vector animation programs is Macromedia's Flash. 26. User- friendly – a characteristic of human-operated equipment and systems that makes them safe, comfortable, and easy to use."
