        "source_title": "USE AN AUTHORING TOOL TO CREATE AN INTERACTIVE SEQUENCE",
        "source_text": "--- PDF PAGE 46 ---\n____________________________________________________________________________________________ \nTR - ANIMATION (2D Digital) NC III                                                                             Promulgated   -   July 27, 2007  \n/ secjr \n44\nUNIT TITLE \n: \nUSE AN AUTHORING TOOL TO CREATE AN INTERACTIVE \nSEQUENCE \nUNIT CODE \n:     ICT 313323 \nUNIT DESRIPTOR : \nThis unit covers the knowledge, skills and attitude required to \nuse an authoring tool to create a discrete interactive sequence \nfor a multimedia production. \n \nELEMENT \n PERFORMANCE CRITERIA \nItalicized  terms are elaborated in the Range of Variables \n1. Plan use of authoring \ntool \n1.1 Range of authoring tools and their application to \nvarious multimedia projects are identified and \ndiscussed with relevant personnel. \n1.2 Purpose, scope, storyboard and design of \nmultimedia projects are discussed with relevant \npersonnel. \n1.3 The technical requirements of the multimedia \nproject and use of authoring program are discussed \nwith relevant personnel. \n2. Use authoring tool \n2.1 Use tools and features of software relevant to the \nauthoring process \n2.2 Create a new file for the specified task and name \nappropriately \n2.3 Multimedia components are imported into the \nauthoring tool. \n2.4 Design principles are applied to the screen design \nand layout. \n2.5 Screen and layout are designed according to \ncreative production requirements and technical \nspecifications. \n2.6 Buttons and other interactive elements are created. \n2.7 All components are linked according to storyboard. \n2.8 Data files, images, and audio are saved and stored \nin appropriate file format. \n3. Check functionality of \nmultimedia sequence \n3.1 All links function is checked and debugging is done \nto make sure that these are fully interactive and \npresented to relevant personnel. \n3.2 Required changes in the sequence are incorporated \nin the final delivery platform.\n\n--- PDF PAGE 47 ---\n____________________________________________________________________________________________ \nTR - ANIMATION (2D Digital) NC III                                                                             Promulgated   -   July 27, 2007  \n/ secjr \n45\nRANGE OF VARIABLES \nVARIABLE \nRANGE \n1. Multimedia projects \n1.1 Interactive CD \n1.2 Corporate Audio-Visual Presentations (AVPs) \n1.3 Instructional materials in CD \n1.4 Online Gaming \n1.5 Computer Simulation \n1.6 Webpage Design & Development \n1.7 E-learning  \n2. Relevant personnel \n2.1 Creative Director \n2.2 Project manager \n2.3 Technical Director \n2.4 Navigation designers \n2.5 Programmers \n2.6 Visual Designer \n2.7 Flash animator \n3. Software \nMay include: \n3.1 Macromedia Director/Flash \n3.2 Movie Works  \n3.3 Web Authoring Software \n3.4 E-learning Software \n3.5 Slide Show Software \n4. Creative, production \nrequirements and \ntechnical specifications \nRelevant  specifications may be found in: \n4.1   Storyboard \n4.2    Layout drawings \n4.3    Model Sheets \n4.4    Director’s instructions \n4.5    Camera sheet \n4.6    Soundtrack breakdown \n5. Delivery platform \nDelivery platform may include: \n5.1    World wide web \n5.2    CD-ROM \n5.3    DVD\n\n--- PDF PAGE 48 ---\n____________________________________________________________________________________________ \nTR - ANIMATION (2D Digital) NC III                                                                             Promulgated   -   July 27, 2007  \n/ secjr \n46\nEVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency \nAssessment must show that the candidate: \n1.1 Selected suitable software in relation to the \nspecified multimedia project \n1.2 Created a multimedia sequence using \nappropriate tools and features of the \nselected software to meet requirements \n2.  Underpinning Knowledge \n2.1 \nComputer and computer operating system \n2.2 \nInterpreting creative information, scripts and \nimages \n2.3 \nScope and elements of multimedia \n2.4 \nDigital components of multimedia, their \ndistinguishing features and functions \n2.5 \nBasic techniques/methods of graphics \ndesign \n2.6 \nLife drawing and translation to animated \ncharacters \n2.7 \nCreative elements of a production \n2.8 \nMaintaining design integrity \n2.9 \nColor theory, line, dimension, depth and \ntheir application on the screen \n2.10 Basic editing principles, e.g., composition, \nframing, pacing, timing \n2.11 Copyright laws, regulations \n3.  Underpinning Skills \n3.1  Design and Drawing skills \n3.2  Use of appropriate authoring software \n3.3  Effective Communication skills \n3.4  Presentation skills \n3.5  Computer operation \n4. Method of Assessment \n4.1 The assessor must select two of the \nfollowing to objectively assess the \ncandidate: \n4.1.1 Direct Observation and oral \nquestioning \n4.1.2 Third party report \n4.1.3 Portfolio  \n5. Resource Implication \n5.1 Appropriate materials  \n5.2 Applicable software and equipment \n6. Context of Assessment \n6.1 Assessment maybe conducted in the \nworkplace  or in a simulated environment\n",
