        "source_text": "--- PDF PAGE 33 ---\n____________________________________________________________________________________________ \nTR - ANIMATION (2D Digital) NC III                                                                             Promulgated   -   July 27, 2007  \n/ secjr \n31\nUNIT TITLE \n: \nPRODUCE CLEANED-UP & IN-BETWEENED DRAWINGS \nUNIT CODE \n:     ICT 313313 \nUNIT DESRIPTOR : \nThis unit covers the knowledge, skills and attitude required to \nrefine key drawings and to produce in-between drawings to \nensure that the creative brief is fully met for productions. \nELEMENT \n PERFORMANCE CRITERIA \nItalicized  terms are elaborated in the Range of Variables \n1. Identify  requirements \nfor cleaned -up    \ndrawings \n1.1 All relevant clean up requirements are \nidentified from the appropriate source \nmaterial \n1.2 All relevant model sheets are collected for \nready reference. \n1.3 All key drawings are checked and any \nproblems or errors encountered are referred \nto appropriate personnel. \n1.4 All animation breakdowns are checked \nagainst the camera sheet, and any problems \nor errors are referred to relevant personnel. \n1.5 All necessary materials and equipment   are \nidentified and prepared according to the task \nundertaken \n2. Produce cleaned-up \ndrawings  \n2.1 \nCleaned-up drawings produced are consistent \nwith requirements of source materials and \nwithin the constraints of the production. \n2.2 \nCleaned-up drawings are matched and \nmodeled to animators’ keys. \n2.3 \nAgreed design/model in the cleaned-up \ndrawings are precisely reflected in the \ndrawings and that they are within the agreed \nstandards \n2.4 \n All animation breakdowns are accurately \ncopied and numbered onto cleaned-up \ndrawings. \n2.5 \nAny revision or corrections required are \nreferred to relevant personnel. \n2.6 \nCleaned-up drawings are properly recorded \nand stored in accordance with company \nprocedures and policies.\n\n--- PDF PAGE 34 -