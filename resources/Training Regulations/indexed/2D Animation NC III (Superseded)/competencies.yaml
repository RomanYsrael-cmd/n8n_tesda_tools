ng creative information, scripts and images 2.3 Principles of 3D modeling sequencing 2.4 Application of different 3D modeling and digital imaging methods and formats 2.5 Techniques/Methods of 3D animation 2.6 Life drawing and translation to animated characters 2.7 Creative elements of a production 2.8 Maintaining design integrity 2.9 Color theory, line, dimension, depth and their application on the screen 2.10 Basic editing principles, e.g., composition, framing, pacing, timing 2.11 Copyright laws, regulations 3. Underpinning Skills 3.1 Design and Drawing skills 3.2 Effective Communication skills 3.3 Presentation skills 3.4 Computer operation 4. Method of Assessment 4.1 The assessor must select two of the following to objectively assess the candidate: 4.1.1 Direct Observation and oral questioning 4.1.2 Third party report 4.1.3 Portfolio 5. Resource Implication 5.1 Appropriate materials 5.2 Applicable software and equipment 6. Context of Assessment 6.1 Assessment maybe conducted in the workplace or in a simulated environment"
