        ],
        "descriptor": "This unit covers the knowledge, skills and attitudes to lead small teams including setting and maintaining team and individual performance standards.",
        "elements": [
          {
            "number": 1,
            "title": "Provide team leadership",
            "performance_criteria": [
              {
                "number": "1.1",
                "text": "Work requirements are identified and presented to team members"
              },
              {
                "number": "1.2",
                "text": "Reasons for instructions and requirements are communicated to team members"
              },
              {
                "number": "1.3",
                "text": "Team members’ queries and concerns are recognized, discussed and dealt with"
              }
            ]
          },
          {
            "number": 2,
            "title": "Assign responsibilities",
            "performance_criteria": [
              {
                "number": "2.1",
                "text": "Duties, and responsibilities are allocated having regard to the skills, knowledge and aptitude required to properly undertake the assigned task and according to company policy"
              },
              {
                "number": "2.2",
                "text": "Duties are allocated having regard to individual preference, domestic and personal considerations, whenever possible"
              }
            ]
          },
          {
            "number": 3,
            "title": "Set performance expectations for team members",
            "performance_criteria": [
              {
                "number": "3.1",
                "text": "Performance expectations are established based on client needs and according to assignment requirements"
              },
              {
                "number": "3.2",
                "text": "Performance expectations are based on individual team members duties and area of responsibility"
              },
              {
                "number": "3.3",
                "text": "Performance expectations are discussed and disseminated to individual team members"
              }
            ]
          },
          {
            "number": 4,
            "title": "Supervise team performance",
            "performance_criteria": [
              {
                "number": "4.1",
                "text": "Monitoring of performance takes place against defined performance criteria and/or assignment instructions and corrective action taken if required"
              },
              {
                "number": "4.2",
                "text": "Team members are provided with feedback, positive support and advice on strategies to overcome any deficiencies"
              },
              {
                "number": "4.3",
                "text": "Performance issues which cannot be rectified or addressed within the team are referenced to appropriate personnel according to employer policy"
              },
              {
                "number": "4.4",
                "text": "Team members are kept informed of any changes in the priority allocated to assignments or tasks which might impact on client/customer needs and satisfaction"
              },
              {
                "number": "4.5",
                "text": "Team operations are monitored to ensure that employer/client needs and requirements are met"
              },
              {
                "number": "4.6",
                "text": "Follow-up communication is provided on all issues affecting the team"
              },
              {
                "number": "4.7",
                "text": "All relevant documentation is completed in accordance with company procedures ____________________________________________________________________________________________ 5 III Promulgated - July 27, 2007"
              }
            ]
          }
        ],
