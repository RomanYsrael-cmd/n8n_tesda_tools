  "source_text": "SECTION 4: NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1\nTo attain the National Qualification of 2D Animation NC III, the candidate\nmust demonstrate competency in all the units listed in Section 1. Successful\ncandidates shall be awarded a National Certificate III level signed by the\nTESDA Director General.\n\n4.2\nThe qualification of 2D Animation NC III may be attained through:\n4.2.1\nAccumulation of Certificates of Competency (COCs) in all the\nfollowing units of competencies:\n4.2.1.1\nProduce key drawings for animation\n4.2.1.2\nProduce cleaned-up and in-betweened drawings\n4.2.1.3\nCreate 2D digital animation\n4.2.1.4\nUse an authoring tool to create an interactive sequence\n\nSuccessful candidates shall be awarded a Certificate of\nCompetency (COC) in each of the core units.\n\n4.3\nUpon accumulation and submission of all COCs acquired for all the relevant\nunits of competency comprising this qualification, an individual shall be issued\nthe corresponding National Certificate.\n\n4.4\nAssessment shall focus on the core units of competency. The basic and\ncommon units shall be integrated or assessed concurrently with the core units.\n\n4.5\nThe following are qualified to apply for assessment and certification:\n\n4.5.1.\nGraduate of formal, non-formal, and informal, including enterprise-\nbased, training programs.\n\n4.5.2.\nExperienced workers (wage employed or self employed)\n\n4.6\nThe guidelines on assessment and certification are discussed in detail in the\n“Procedures Manual on Assessment and Certification” and “Guidelines on the\nImplementation of the Philippine TVET Qualification and Certification System\n(PTQCS)”.\n\n--- PDF PAGE 57 ---\n____________________________________________________________________________________________\nTR - ANIMATION (2D Digital) NC III Promulgated - July 27, 2007\n/ secjr\n55\n"
}
