      "number": "4",
      "text": "1 NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS"
    },
    {
      "number": "4.1",
      "text": "1. To attain the National Qualification of the qualification, the candidate must demonstrate in all the units listed in Section 1. Successful candidates shall be awarded a National Certificate III signed by the TESDA Director General."
    },
    {
      "number": "4.1",
      "text": "2. The qualification of Mechatronics Servicing NC III may be attained through:"
    },
    {
      "number": "4.1",
      "text": "2.1. Accumulation of Certificates of Competency (COCs) in all the following units of competencies: COC #1. Develop Mechatronics and Automation Control Circuits and PLC Application Programs COC #2. Develop Motion Control and System Configuration COC #3. Maintain and Repair PLC-based Mechatronics and Automation System Successful candidates shall be awarded a Certificate of Competency (COC) in each of the core units."
    },
    {
      "number": "4.1",
      "text": "2.2. Demonstration of competence through project-type assessment covering all the units required in the qualification."
    },
    {
      "number": "4.1",
      "text": "3. Accumulation and submission of all COCs acquired for the relevant units of competency comprising a qualification, an individual shall be issued the corresponding National Certificate (NC)."
    },
    {
      "number": "4.1",
      "text": "4. Assessment shall focus on the core units of competency. The basic and common units shall be integrated or assessed concurrently with the core units."
    },
    {
      "number": "4.1",
      "text": "5. The following are qualified to apply for assessment and certification:"
    },
    {
      "number": "4.1",
      "text": "5.1. Graduate of formal and non-formal including enterprise-based training programs."
    },
    {
      "number": "4.1",
      "text": "5.2. Experienced workers (wage employed or self employed)"
    },
    {
      "number": "4.1",
      "text": "6. The existing NCs or COCs in Mechatronics Servicing NC III shall be in effect until the said NCs or COCs have expired. The NCs or COCs in this qualification maybe renewed provided that the: --- PDF PAGE 87 --- ------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- TR – MECHATRONICS SERVICING NC III (Amended) Promulgated June 16, 2015 Page 83"
    },
    {
      "number": "4.1",
      "text": "6.1. Holders present the evidence that they are currently or have been employed in mechatronics and/or industrial automation job for the past three (3) years;"
    },
    {
      "number": "4.1",
      "text": "6.2. Holders pass the performance assessment of the new COC#2 (Develop Motion Control and System Configuration) under Mechatronics and Automation Servicing NC III."
    },
    {
      "number": "4.1",
      "text": "7. The conduct of assessment and issuance of certificates shall follow the procedures manual and implementing guidelines developed for the purpose."
    },
