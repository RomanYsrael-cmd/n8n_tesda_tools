  "source_text": "SECTION 4 ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\nCompetency Assessment is the process of collecting evidence and making\njudgments whether competency has been achieved. The purpose of assessment is to\nconfirm that an individual can perform to the standards expected at the workplace as\nexpressed in relevant competency standards.\nThe assessment process is based on evidence or information gathered to prove\nachievement of competencies. The process may be applied to an employable unit(s) of\ncompetency in partial fulfillment of the requirements of the national qualification.\n\n4.1 NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1.1. To attain the National Qualification of the qualification, the candidate must\ndemonstrate in all the units listed in Section 1. Successful candidates shall be\nawarded a National Certificate III signed by the TESDA Director General.\n\n4.1.2. The qualification of Mechatronics Servicing NC III may be attained through:\n\n4.1.2.1. Accumulation of Certificates of Competency (COCs) in all the\nfollowing units of competencies:\nCOC #1. Develop Mechatronics and Automation Control Circuits\nand PLC Application Programs\nCOC #2. Develop Motion Control and System Configuration\nCOC #3. Maintain and Repair PLC-based Mechatronics and\nAutomation System\n\nSuccessful candidates shall be awarded a Certificate of\nCompetency (COC) in each of the core units.\n\n4.1.2.2. Demonstration of competence through project-type assessment\ncovering all the units required in the qualification.\n\n4.1.3. Accumulation and submission of all COCs acquired for the relevant units of\ncompetency comprising a qualification, an individual shall be issued the\ncorresponding National Certificate (NC).\n\n4.1.4. Assessment shall focus on the core units of competency. The basic and\ncommon units shall be integrated or assessed concurrently with the core units.\n\n4.1.5. The following are qualified to apply for assessment and certification:\n\n4.1.5.1.\nGraduate of formal and non-formal including enterprise-based\ntraining programs.\n\n4.1.5.2.\nExperienced workers (wage employed or self employed)\n\n4.1.6. The existing NCs or COCs in Mechatronics Servicing NC III shall be in effect\nuntil the said NCs or COCs have expired. The NCs or COCs in this\nqualification maybe renewed provided that the:\n\n--- PDF PAGE 87 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – MECHATRONICS SERVICING NC III (Amended) Promulgated June 16, 2015\n\n Page 83\n\n4.1.6.1.\nHolders present the evidence that they are currently or have been\nemployed in mechatronics and/or industrial automation job for the\npast three (3) years;\n\n4.1.6.2.\nHolders pass the performance assessment of the new COC#2\n(Develop Motion Control and System Configuration) under\nMechatronics and Automation Servicing NC III.\n\n4.1.7. The conduct of assessment and issuance of certificates shall follow the\nprocedures manual and implementing guidelines developed for the purpose.\n\n4.2 COMPETENCY ASSESSMENT REQUISITE\n\n4.2.1 Self-Assessment Guide. The self-assessment guide (SAG) is accomplished\nby the candidate prior to actual competency assessment. SAG is a pre-\nassessment tool to help the candidate and the assessor determine what\nevidence is available, where gaps exist, including readiness for\nassessment.\n\nThis document can:\n\na.\nIdentify the candidate’s skills and knowledge\nb.\nHighlight gaps in candidate’s skills and knowledge\nc.\nProvide critical guidance to the assessor and candidate on the evidence\nthat need to be presented\nd.\nAssist the candidate to identify key areas in which practice is needed or\nadditional information or skills that should be gained prior `\n\n4.2.2 Accredited Assessment Center. Only Assessment Center accredited by\nTESDA is authorized to conduct competency assessment. Assessment\ncenters undergo a quality assured procedure for accreditation before they\nare authorized by TESDA to manage the assessment for National\nCertification.\n\n4.2.3 Accredited Competency Assessor. Only accredited competency assessor is\nauthorized to conduct assessment of competence. Competency assessors\nundergo a quality assured system of accreditation procedure before they\nare authorized by TESDA to assess the competencies of candidates for\nNational Certification.\n\n--- PDF PAGE 88 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – MECHATRONICS SERVICING NC III (Amended) Promulgated June 16, 2015\n\n Page 84\n\n"
