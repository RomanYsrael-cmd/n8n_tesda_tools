  "source_section_text": "SECTION 3 TRAINING ARRANGEMENTS\n\nThis set of standards provides Technical and Vocational Education and Training\n(TVET) providers with information and other important requirements to consider when\ndesigning training programs for Mechatronics Servicing NC III.\n\nThis includes information on curriculum design; training delivery; trainee entry\nrequirements; tools and equipment; training facilities; and trainer’s qualification and\ninstitutional assessment.\n\n3.1\nCURRICULUM DESIGN\n\nTESDA shall provide the training on the development of competency-based\ncurricula to enable training providers develop their own curricula with the components\nmentioned below.\n\nDelivery of knowledge requirements for the basic, common and core units of\ncompetency\nspecifically\nin\nthe\nareas\nof\nmathematics,\nscience/technology,\ncommunication/language and other academic subjects shall be contextualized. To this\nend, TVET providers shall develop a Contextual Learning Matrix (CLM) to accompany\ntheir curricula.\n\nCourse Title:\nMechatronics Servicing\n\nNC Level: NC III\n\nNominal Training Duration:\n32 hrs – Basic Competencies\n\n60 hrs – Common Competencies\n\n 104 hrs – Core Competencies\n\n ------------\n\n 196 hrs\n\nCourse Description:\n\nThis course is designed to develop & enhance the knowledge, skills, & attitudes of\na mechatronics and automation technician, in accordance with industry standards. It\ncovers the basic & common competencies in addition to the core competencies such as\ndeveloping mechatronics and automation control circuits and PLC application programs,\ndeveloping motion control and system configuration on mechatronics and automation\nsystem as well as maintaining and repairing PLC-based mechatronics and automation\nsytems.\n\n(The nominal duration of 196 hours covers only the basic, common and core units at\nMechatronics Servicing NC III level. TVET providers can however, offer a longer,\nladderized course covering both Mechatronics Servicing NC II and NC III basic, common\nand core units. )\n\n--- PDF PAGE 65 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – MECHATRONICS SERVICING NC III (Amended) Promulgated June 16, 2015\n\n Page 61\n\nBASIC COMPETENCIES\n32 hrs\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Content\n(Required Knowledge)\nPractical Activities\n(Required Skills)\nMethodology\nAssessment\nApproach\nNominal\nDuration\n1. Lead workplace\ncommunication\n\n1.1 Communicate\ninformation\nabout\nworkplace\nprocesses.\n.\n\n• Method of communication\n• Communication skills\n• Communication tools\n• Questioning techniques\n\n• Expressing One self\n• Practice on Public speaking\n• Written activities on workplace\nprocess\n• Group\ndiscussion\n• Role Play\n• Brainstorming\n• Demonstration\n• Written Test\n• Interview\n• Observation\n2 hours\n\n1.2 Lead\nworkplace\ndiscussions\n• Method/technique of discussion\n• How to lead discussion\n• How to solicit response\n\n• Written and Electronic\ncommunication activities\n• Debate Exercises\n• Self-paced\nhandout/\nmodule\n• Discussion\n• Role Play\n\n• Written Test\n• Demonstration\n\n2 hours\n\n1.3 Identify and\ncommunicate\nissues arising\nin the\nworkplace\n• Identify problems and issues\n• Organizing information on problem\nand issues\n• Relating problems and issues\n• Communication barriers affecting\nworkplace discussions\n\n• Resolving conflict in the workplace\n• Making a report about problem and\nissues\n• Practice communication model\n• Brainstorming\n• Self-paced\nhandout/\nmodule\n• Role Play\n• Self-paced\nhandout/\nmodule\n• Interviews\n• Written exam\n• Demonstration\n\n2 hours\n\n2. Lead small\nteams\n\n2.1 Provide team\nleadership.\n• Communication skills required for\nleading small team\n• Skills and techniques in promoting\nteam building\n• Negotiating skills\n• Up to date dissemination of\ninstruction and requirements to\nmembers\n• Art of listening and treating\nindividual team members concern\n• Evaluate the success factors in the\ncontribution of the personnel in the\nimplementation of the safety, quality\nand environmental objectives of the\ncompany\n• Practice leadership activities\n• Teambuilding activities\n• Write simple negotiation strategy on\nworkplace issues\n• Role play on communication model\nand the art of listening\n• Self-paced\nhandout/\nmodule\n• Role Play\n• Case Study\n• Written\n• Oral\nQuestioning\n• Demonstration\n\n2 hours\n\n--- PDF PAGE 66 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – MECHATRONICS SERVICING NC III (Amended) Promulgated June 16, 2015\n\n Page 62\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Content\n(Required Knowledge)\nPractical Activities\n(Required Skills)\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\n2.2 Assign\nresponsibilities\namong\nmembers\n• Duties and responsibilities of each\nteam member\n• Skills in identifying individual skills,\nknowledge and attitude as basis\nfor allocating responsibilities\n• Knowledge in identifying each\nteam member duties and\nresponsibilities\n• Planning session regarding duties\nand responsibilities of each team\nmember\n• Writeshop of interpersonal abilities,\nattitude and knowledge\n• Identification of team members\nresponsibilities thru simulation\n• Role Play\n• Workshop\n• Demonstration\n• Case studies\n• Interview\n• Demonstration\n\n2 hours\n2.3 Set\nperformance\nexpectation for\nteam\nmembers.\n• Knowledge and skills in setting\nindividual performance\ntarget/expectation\n• Team members duties and\nresponsibilities\n• Employee policies and procedures\n• Defining performance expectations\ncriteria\n• Develop /implement an appraisal\ndocument for the technician\n• Workshop on setting individual\nperformance target\n• Writeshop on team members duties\nand responsibilities\n• Video presentation regarding\nemployees performance role and\nexpectation towards work\n• Group\ndiscussion\n• Writeshop\n• Multimedia\npresentation\n• Written exam\n• Demonstration\n• Written Exam\n1 hour\n2.4 Supervise\nteam\nperformance\n• Knowledge and skills in monitoring\nteam member performance\n• Monitoring team operation to\nensure client needs and\nsatisfaction\n• Methods of monitoring\nperformance\n• Informal/formal counseling skills\n• Practice monitoring skills\n• Design monitoring scheme for team\noperation as well as client\nsatisfaction and needs\n• Evaluate performance of\ntechnicians\n• Role Play\n• Writeshop\n• Discussions\n• Self-paced\nhandout/\nmodule\n• Group\nDynamics\n\n• Written Test\n• Demonstration\n• Written Test\n• Demonstration\n\n1 hour\n3. Develop and\npractice\nnegotiation\nskills\n\n3.1 Identify\nrelevant\ninformation in\nplanning\nnegotiations\n• Background information on other\nparties to the negotiation\n• Observing differences between\ncontent and process\n• Identifying bargaining information\n• Applying strategies to manage\nprocess\n• Perform Data gathering regarding\nrelevant information related to\nnegotiation\n• Designing a negotiation process\n• Practice negotiation strategies and\nmanage the process\n• Direct\nobservation\n• Self-paced\nhandout/\nmodule\n• Discussion\n• Workshop\n• Interview\n• Written exam\n• Demonstration\n\n2 hours\n\n--- PDF PAGE 67 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – MECHATRONICS SERVICING NC III (Amended) Promulgated June 16, 2015\n\n Page 63\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Content\n(Required Knowledge)\nPractical Activities\n(Required Skills)\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\n3.2 Participate in\nnegotiations\n• Applying steps in negotiating\nprocess\n• Strategies to manage conflict\n•Steps in negotiating process\n• Writeshop on identifying negotiation\nprocess\n• Perform background information\ngathering\n• Simulation/\nrole playing\n• Writeshop\n•Discussion\n• Written exam\n• Practical/\nperformance\ntest\n2 hour\n3.3 Document\nareas for\nagreement\n• Procedure in documenting\nnegotiations\n• Managing information\n•Filing documents\n• Practice documentation\ntechniques/minutes of meeting\n• Practice recording of agreement\n•Keeping of records\n• Case studies\n• Role play\n• Written exam\n• Practical/\nperformance\ntest\n2 unit\n4. Solve\nworkplace\nproblem related\nto work\nactivities\n4.1 Explain the\nanalytical\ntechniques\n• Observation, investigation &\nanalytical techniques\n• Brainstorming\n• Cause and effect diagrams\n• Conduct investigation and root\ncause analyses and implement\ncorrective actions\n• Perform analytical skills in solving\nproblem related to work\n• Direct\nobservation\n• Simulation\n• Written test\n• Demonstration\n2 hours\n4.2 Identify the\nproblem\n• Normal operating parameters &\nproduct quality\n• Identifying & clarifying the nature of\nproblem\n• Application of analytical techniques\n• Evaluate the present status of the\nperformance against the\nestablished safety, quality and\nenvironmental policies in the\nworkplace\n• Discussion in identifying and\nclarifying the nature of problem\n• Simulation/\nrole playing\n• Discussion\n• Simulation\n• Written exam\n• Practical/\nperformance\ntest\n• Demonstration\n1 hour\n4.3 Determine the\npossible\ncause/s of the\nproblem\n• Non-routine process and quality\nproblems\n• Teamwork and work allocation\nproblem\n• Safety and emergency situations\nand incidents\n• Implement corrective or preventive\nactions based on root cause\nanalyses\n• View video presentation on possible\ncause of problem in the workplace\n• Writeshop on the determining\nproblems in the workplace\n• Case studies\n• Multimedia\npresentation\n• Writeshop\n\n• Written exam\n• Interviews\n• Written Test\n\n1 hour\n5. Use\nmathematical\nconcepts and\ntechniques\n5.1 Identify\nmathematical\ntools and\ntechniques to\nsolve problem\n• Measurement system\n• Basic measuring tools/devices\n• Practice mathematical concepts to\nsolve problem in the workplace\n• Direct\nobservation\n• Demonstration\n• Written exam\n• Practical/\nperformance\ntest\n1 hour\n5.2 Apply\nmathematical\nprocedures/\nsolution\n• Fundamental operation (addition,\nsubtraction, division, multiplication)\n• Practice linear measurements and\nconversion\n• Practice mathematical calculation\non workplace situation\n• Simulation/\nrole playing\n• Demonstration\n• Written exam\n• Practical/\nperformance\ntest\n2 hours\n\n--- PDF PAGE 68 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – MECHATRONICS SERVICING NC III (Amended) Promulgated June 16, 2015\n\n Page 64\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Content\n(Required Knowledge)\nPractical Activities\n(Required Skills)\nMethodology\nAssessment\nApproach\nNominal\nDuration\n5.3 Analyze\nresults\n• Precision and accuracy\n• Compare the results against the\nnew requirements and identify gaps\n•Analysis of result\n• Case studies\n• Demonstration\n• Written exam\n• Interviews\n2 hours\n6. Use relevant\ntechnologies\n\n6.1 Identify\nappropriate\ntechnology\n• Awareness on technology and its\nfunction\n• Communication techniques\n• Film Viewing regarding technology\nand its benefits\n• Identify different technology\napplicable to workplace\n• Direct\nobservation\n• Multimedia\npresentation\n• Written exam\n• Demonstration\n1 hour\n6.2 Apply relevant\ntechnology\n• Study different relevant technology\nin the workplace\n• Relate 5s to technology\n• Conduct risk assessment for a\nroutine or non-routine task in the\nworkplace using the established\nsystems\n• Application of relevant technology to\nthe workplace\n• Direct\nobservation\n• Simulation/\nrole playing\n• Written exam\n• Demonstration\n2 hour\n6.3 Maintain/\nenhance\nrelevant\ntechnology\n• Corrective and preventive\nmaintenance\n• Upgrading of technology\n• Communication Skills\n• Organizational set–up / work flow\n• Identify monthly maintenance tasks\nbased on the Planned Maintenance\nSystem\n• Application of corrective and\npreventive maintenance to\nworkplace\n• Case studies\n• Simulation/\nrole playing\n• Interviews\n• Demonstration\n2 hour\nNote: Basic competencies may be embedded in the core competencies.\n\n--- PDF PAGE 69 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – MECHATRONICS SERVICING NC III (Amended) Promulgated June 16, 2015\n\n Page 65\n\nCOMMON COMPETENCIES\n60 hrs\n\nNote: Those who have completed the course on Mechatronics and Automation Servicing NC II or have acquired the Mechatronics and\nAutomation Servicing NC II qualification can skip this portion on common competencies.\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Contents\nPractical Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n1. Use Hand\nTools\n1.1. Plan and\nprepare for\ntasks to be\nundertaken\n•\nIdentification of different types of\nhand tools\n•\nElectronics hand tools and their\nuses\n•\nFunction, operation and common\nfaults in electronics hand tools\n\n•\nPlanning and\npreparing\ntask/activity\n Lecture /\nDemonstration\n Distance\neducation\n Film Showing\n Written/Oral\nexamination\n Practical\ndemonstration\n\n2 hours\n1.2. Prepare\nhand tools\n•\nProper use of hand tools\n•\nChecking and safety\nrequirements in handling tools\n•\nStandard procedures in checking,\nidentification and marking of safe\nor unsafe/ faulty tools\n\n•\nIdentifying and\nchecking hand tools\n•\nMarkin