-------------------\nTR – MECHATRONICS SERVICING NC III (Amended) Promulgated June 16, 2015\n\n Page 78\n\n3.2\nTRAINING DELIVERY\n\n1. The delivery of training shall adhere to the design of the curriculum. Delivery shall be\nguided by the principles of competency-based TVET.\n\na. Course design is based on competency standards set by the industry or\nrecognized industry sector; (Learning system is driven by competencies\nwritten to industry standards)\n\nb. Training delivery is learner-centered and should accommodate individualized\nand self-paced learning strategies;\n\nc. Training can be done on an actual workplace setting, simulation of a workplace\nand/or through adoption of modern technology.\n\nd. Assessment is based in the collection of evidence of the performance of work to\nthe industry required standards;\n\ne. Assessment of competency takes the trainee’s knowledge and attitude into\naccount but requires evidence of actual performance of the competency as the\nprimary source of evidence.\n\nf. Training program allows for recognition of prior learning (RPL) or current\ncompetencies;\n\ng. Training completion is based on satisfactory performance of all specified\ncompetencies.\n\n2. The competency-based TVET system recognizes various types of delivery modes,\nboth on-and off-the-job as long as the learning is driven by the competency standards\nspecified by the industry. The following training modalities and their\nvariations/components may be adopted singly or in combination with other modalities\nwhen designing and delivering training programs:\n\n2.1.\nInstitution- Based:\n\n• Dual Training System (DTS)/Dualized Training Program (DTP) which contain\nboth in-school and in-industry training or fieldwork components. Details can be\nreferred to the Implementing Rules and Regulations of the DTS Law and the\nTESDA Guidelines on the DTP;\n\n• Distance learning is a formal education process in which majority of the\ninstruction occurs when the students and instructor are not in the same place.\nDistance learning may employ correspondence study, audio, video, computer\ntechnologies or other modern technology that can be used to facilitate learning\nand formal and non-formal training. Specific guidelines on this mode shall be\nissued by the TESDA Secretariat.\n\n--- PDF PAGE 83 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – MECHATRONICS SERVICING NC III (Amended) Promulgated June 16, 2015\n\n Page 79\n\n• The traditional classroom-based or in-center instruction may be enhanced\nthrough use of learner-centered methods as well as laboratory or field-work\ncomponents.\n\n2.2 Enterprise-Based:\n\n• Formal Apprenticeship – Training within employment involving a contract\nbetween an apprentice and an enterprise on an approved apprenticeable\noccupation.\n\n• Enterprise-based Training- where training is implemented within the company\nin accordance with the requirements of the specific company. Specific\nguidelines on this mode shall be issued by the TESDA Secretariat.\n\n3.3\nTRAINEE ENTRY REQUIREMENTS\n\nThe trainees who wish to enter the course should possess the following\nrequirements:\n\n•\nMust have completed training in Mechatronics Servicing NCII\n•\nCan communicate orally & in writing\n•\nCan perform basic mathematical computations\n\nThis list does not include specific institutional requirements such as written\nentrance exam, and other that may be required of the trainees by the school or\ntraining center delivering TVET program.\n\n--- PDF PAGE 84 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – MECHATRONICS SERVICING NC III (Amended) Promulgated June 16, 2015\n\n Page 80\n\n3.4 LIST OF TOOLS, EQUIPMENT AND MATERIALS\n\nRecommended list of tools, equipment and materials for the training of\n\n25 trainees for Mechatronics Servicing NC III:\n\nTOOLS\nEQUIPMENT\nMATERIAL\nQty.\nDescription\nQty.\nDescription\nQty.\nDescription\n10 pcs\nLong-nosed pliers\n5 sets\nPLC system\n1 spool\nSolder lead\n10 pcs\nDiagonal cutters\n5 sets\nPLC software\n1 spool\nShielded cable\n10 pcs\nStandard\nscrewdrivers\n10 pcs\nMultimeters\n1 lot\nTerminal lugs\n10 pcs\nPhillips\nscrewdrivers\n3 pcs\nTransmitters or\nTransducers\n1 lot\nTerminal\nstrips/blocks\n10 pcs\nElectrical pliers\n1 pc.\nAir compressor\n25 pcs\nCotton gloves\n10 pcs\nSoldering iron\n5 pcs\nRegulated power\nsupplies\n1 lot\nPlastic tubing\n10 pcs\nAdjustable wrench\n20 pcs\nCylinder Actuator\n1 lot\nQuick-connect\nfittings\n5 pcs\nWire stripper\n1 pc.\nStepper motor\n10 rolls\nElectrical tape\n5 pcs\nCrimping tool\n1 pc.\nServomotor\n1 lot\nWire markers\n5 sets\nAllen wrench\n2 pc.\nVariable frequency\ndrive\n1 lot\nCable ties\n5 sets\nPrecision\nscrewdrivers\n10 pcs\nBuzzers\n\n25 pcs\nIndustrial panel\nswitches\n\n10 pcs\nIndicating lamps\n\n10 pcs\nDirectional solenoid\nvalves\n\n5 pcs\nFilter-Regulator-\nLubricator set\n\n10 pcs\nLimit switches\n\n10 pcs\nPhotoelectric\nswitches\n\n10 pcs\nProximity switches\n25 pcs\nRelays\n\n10 pcs\nMagnetic\ncontactors\n\n10 pcs\nDesktop/Laptop PC\n5 pcs.\nSafety helmet\n5 pcs.\nSafety shoes\n5 pcs.\nSafety harness\n\n5 pcs.\nSafety\nglasses/goggles\n\n5 pcs.\nEar plugs/ear muffs\n5 pcs.\nGas mask\n\n--- PDF PAGE 85 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – MECHATRONICS SERVICING NC III (Amended) Promulgated June 16, 2015\n\n Page 81\n\n3.5 TRAINING FACILITIES\n\nBased on class size of 25 students/trainees the space requirements for\n\nthe teaching/learning and circulation areas are as follows:\n\nTEACHING/LEARNING\nAREAS\nSIZE IN\nMETERS\nAREA IN SQ.\nMETERS