cted\nin line with job requirements\n\n• Category of measuring\ninstruments\n• Types and uses of\nmeasuring instruments\n• Shapes and Dimensions\n• Formulas for volume,\nareas, perimeters of\nplane and geometric\nfigures\n• Identifying and\nselecting\nmeasuring\ninstruments\n• Visualizing\nobjects and\nshapes\n2. Carry out\nmeasurements\nand calculation\n2.1. Appropriate measuring\ninstrument is selected to\nachieve required outcome\n2.2. Accurate measurements are\nobtained for job\n2.3. Calculation needed to\ncomplete work tasks are\nperformed using the four\nbasic process of addition (+),\nsubtraction (-), multiplication\n(x), and division (/)\n2.4. Calculation involving\nfractions, percentages and\nmixed numbers are used to\ncomplete workplace tasks.\n2.5. Numerical computation is\nself-checked and corrected\nfor accuracy\n2.6. Instruments are read to the\nlimit of accuracy of the tool\n\n• Calculation &\nmeasurement\n• Four fundamental\noperation\n• Linear measurement\n• Dimensions\n• Unit conversion\n• Ratio and proportion\n\n• Performing\ncalculation by\naddition,\nsubtraction,\nmultiplication\nand division;\n• Interpreting\nformulas for\nvolume, areas,\nperimeters of\nplane and\ngeometric\nfigures\n• Handling of\nmeasuring\ninstruments\n3. Maintain\nmeasuring\ninstruments\n3.1. Measuring instruments are\nnot dropped to avoid\ndamage\n3.2. Measuring instruments are\ncleaned before and after\nusing.\n3.3. Proper storage of\ninstruments undertaken\naccording to manufacturer’s\nspecifications and standard\noperating procedures.\n• Types of measuring\ninstruments and their\nuses\n• Safe handling\nprocedures in using\nmeasuring instruments\n• Four fundamental\noperation of\nmathematics\n• Formula for volume,\narea, perimeter and\nother geometric figures\n• Handling and\nmaintaining\nmeasuring\ninstruments\n\n--- PDF PAGE 29 ---\nTESDA-SOP-QSO-01-F08\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – MECHATRONICS SERVICING NC III (Amended) Promulgated June 16, 2015\n\n Page 25\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Measuring instruments\n1.1. Straight edge\n1.2. Torque gauge\n1.3. Try square\n1.4. Protractor\n1.5. Combination gauge\n1.6.\nSteel rule\n2. Calculation\n\nKinds of part mensuration includes the following\nbut not limited to:\n2.1. Volume\n2.2. Area\n2.3. Displacement\n2.4. Inside diameter\n2.5. Circumference\n2.6. Length\n2.7. Thickness\n2.8. Outside diameter\n2.9. Taper\n2.10. Out of roundness\n\nEVIDENCE GUIDE\n\n1. Critical aspect of competency\nAssessment requires evidence that the candidate:\n1.1. Selected proper measuring instruments\naccording to tasks\n1.2. Carried out measurement and calculations\n1.3. Maintained and stores instruments\n2. Method of assessment\nCompetency in this unit must be assessed through:\n2.1. Observation\n2.2. Oral questioning\n\n3. Resource implication\n3.1. Place of assessment\n3.2. Measuring instruments\n3.3. Straight edge\n3.4. Torque gauge\n3.5. Try square\n3.6. Protractor\n3.7. Combination gauge\n3.8. Steel rule\n4. Context of Assessment\n4.1. Assessment may be conducted in the\nworkplace or in a simulated environment\n\n--- PDF PAGE 30 ---\nTESDA-SOP-QSO-01-F08\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – MECHATRONICS SERVICING NC III (Amended) Promulgated June 16, 2015\n\n Page 26\n\nUNIT TITLE\n:\nPREPARE AND INTERPRET TECHNICAL DRAWING\n\nUNIT CODE\n: ELC311202\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes and values\nneeded to prepare/interpret diagrams, engineering abbreviation\nand drawings, symbols, dimension.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED KNOWLEDGE\nREQUIRED SKILLS\n1. Identify\ndifferent\nkinds of\ntechnical\ndrawings\n1.1. Correct technical\ndrawing is selected\naccording to job\nrequirements.\n1.2. Technical drawings are\nsegregated in\naccordance with the\ntypes and kinds of\ndrawings\n• Types of technical\ndrawings\n• Applications for technical\ndrawing\n• Methods of technical\ndrawings\n• Symbols\n• Mark up/ Notation of\nDrawings\n• Reading skills\nrequired to\ninterpret work\ninstruction\n• Interpreting\nelectrical/\nelectronic signs\nand symbols\n\n2. Interpret\ntechnical\ndrawing\n2.1. Components, assemblies\nor objects are recognized\nas required.\n2.2. Dimensions of the key\nfeatures of the objects\ndepicted in the drawing\nare correctly identified.\n2.3. Symbols used in the\ndrawing are identified\nand interpreted correctly.\n2.4. Drawing is checked and\nvalidated against job\nrequirements or\nequipment in accordance\nwith standard operating\nprocedures.\n\n• Trade Mathematics\no Linear measurement\no Dimension\no Unit conversion\n• Blueprint Reading and\nPlan Specification\no Architectural,\nelectrical, electronics,\nmechanical plan,\nsymbols and\nabbreviations\no Drawing standard\nsymbols\n• Trade Theory\no Basic technical\ndrawing\no Types technical plans\no Various types of\ndrawings\no Notes and\nspecifications\n• Interpreting\ndrawing/\northographic\ndrawing\n• Interpreting\ntechnical plans\n• Matching\nspecification\ndetails with\nexisting resources\n• Safety handling of\ndrawing\ninstruments\n\n3. Prepare/\nmake\nchanges to\nelectrical/\nelectronic\nschematics\nand\ndrawings\n3.1. Electrical/electronic\nschematic is drawn and\ncorrectly identified.\n3.2. Correct drawing is\nidentified, equipment are\nselected and used in\naccordance with job\nrequirements.\n• Drawing conventions\n• Dimensioning\nConventions\n• Mathematics\no Four fundamental\noperations\no Percentage\no Fraction\no Algebra\no Geometry\n• Reading skills\nrequired to\ninterpret work\ninstruction\n• Communication\nskills\n• Preparing/ Making\nelectrical/\nelectronic signs\nand symbols\n• Computing\nformulas\n\n--- PDF PAGE 31 ---\nTESDA-SOP-QSO-01-F08\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – MECHATRONICS SERVICING NC III (Amended) Promulgated June 16, 2015\n\n Page 27\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED KNOWLEDGE\nREQUIRED SKILLS\n4. Store\ntechnical\ndrawings\nand\nequipment /\ninstruments\n4.1. Care and maintenance of\ndrawings are undertaken\naccording to company\nprocedures.\n4.2. Technical drawings are\nrecorded and inventory is\nprepared in accordance\nwith company\nprocedures.\n4.3. Proper storage of\ninstruments is\nundertaken according to\ncompany procedures.\n• Effective ways to\ncatalogue and store\ntechnical drawings\n• Manual methods of\nhandling, storing and\nmaintaining paper\ndrawings\n• Storing drawing in digital\nforms\no Scanner\no CAD\n\n• Handling and\nstoring of\ndrawings\n• Scanning and\nstoring drawings\nin digital form\n• Matching\nspecification\ndetails with\nexisting resources\n• Handling of\ndrawing\ninstruments\n\n--- PDF PAGE 32 ---\nTESDA-SOP-QSO-01-F08\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – MECHATRONICS SERVICING NC III (Amended) Promulgated June 16, 2015\n\n Page 28\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Technical drawings\nTechnical drawings include the following but not\nlimited to:\n\n1.1. Schematic diagrams\n1.2. Charts\n1.3. Block diagrams\n1.4. Lay-out plans\n1.5. Location plans\n1.6. Process and instrumentation diagrams\n1.7. Loop diagrams\n1.8. System Control Diagrams\n2. Dimensions\nDimensions may include but not limited to:\n\n2.1. Length\n2.2. Width\n2.3. Height\n2.4. Diameter\n2.5. Angles\n3. Symbols\nMay include but not limited to:\n\n3.1. NEC- National Electric Code\n3.2. IEC -International Electrotechnical Commission\n3.3. ASME - American Society of Mechanical\nEngineers\n3.4. IEEE - Institute of Electrical and Electronics\nEngineers\n3.5. ISA - Instrumentation System and Automation\nSociety\n4. Instruments/Equipment\n4.1. Components/dividers\n4.2. Drawing boards\n4.3. Rulers\n4.4. T-square\n4.5. Calculator\n\n--- PDF PAGE 33 ---\nTESDA-SOP-QSO-01-F08\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – MECHATRONICS SERVICING NC III (Amended) Promulgated June 16, 2015\n\n Page 29\n\nEVIDENCE GUIDE\n\n1. Critical aspect of\ncompetencies\nAssessment requires evidence that the candidate:\n\n1.1. selected correct technical drawing in line with job\nrequirements\n1.2. correctly identified the objects represented in the\ndrawing\n1.3. identified and interpreted symbols used in the\ndrawing correctly\n1.4. prepared/produced electrical/electronic drawings\nincluding all relevant specifications\n1.5. stored diagrams/equipment\n2. Method of assessment\nCompetency in this unit must be assessed through:\n\n2.1. Practical tasks involving interpretation of a range of\ntechnical drawings\n2.2. Oral questioning\n3. Resource implication\n3.1. Drawings\n3.2. Diagrams\n3.3. Charts\n3.4. Plans\n4. Context of Assessment\nAssessment may be conducted in the workplace or in a\nsimulated work environment\n\n--- PDF PAGE 34 ---\nTESDA-SOP-QSO-01-F08\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – MECHATRONICS SERVICING NC III (Amended) Promulgated June 16, 2015\n\n Page 30\n\nUNIT TITLE\n:\nAPPLY QUALITY STANDARDS\n\nUNIT CODE\n:\nELC311204\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills, (and) attitudes and\nvalues needed to apply quality standards in the workplace.\nThe unit also includes the application of relevant safety\nprocedures and regulations, organization procedures and\ncustomer requirements\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized Bold terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Assess\nquality of\nreceived\nmaterials or\ncomponents\n1.1. Work instructions are obtained\nand work is carried out in\naccordance with standard\noperating procedures\n1.2. Received materials or\ncomponent parts are\nchecked against workplace\nstandards and specifications\n1.3. Faulty material or components\nrelated to work are identified\nand isolated\n1.4. Faults and any identified\ncauses are recorded and/or\nreported to the supervisor\nconcerned in accordance with\nworkplace procedures\n1.5. Faulty materials or\ncomponents are replaced in\naccordance with workplace\nprocedures\n\n• Relevant production\nprocesses, materials\nand products\n• Characteristics of\nmaterials, software\nand hardware used in\nproduction processes\n• Quality checking\nprocedures\n• Quality Workplace\nprocedures\n• Identification of faulty\nmaterials related to\nwork\n• Reading skills\nrequired to\ninterpret work\ninstruction\n• Critical thinking\n• Interpreting work\ninstructions\n2. Assess own\nwork\n2.1. Documentation relative to\nquality within the company is\nidentified and used\n2.2. Completed work is checked\nagainst workplace standards\nrelevant to the task undertaken\n2.3. Faulty pieces are identified\nand isolated\n2.4. Information on the quality and\nother indicators of production\nperformance is recorded in\naccordance with workplace\nprocedures\n2.5. Deviations from specified\nquality standards, causes are\ndocumented and reported in\naccordance with the\nworkplace’ standards\noperating procedures\n\n• Safety and\nenvironmental\naspects of production\nprocesses\n• Fault identification\nand reporting\n• Workplace procedure\nin documenting\ncompleted work\n• Workplace Quality\nIndicators\n• Carry out work in\naccordance with\nOHS policies\nand procedures\n\n--- PDF PAGE 35 ---\nTESDA-SOP-QSO-01-F08\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – MECHATRONICS SERVICING NC III (Amended) Promulgated June 16, 2015\n\n Page 31\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized Bold terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n3. Engage in\nquality\nimprovement\n3.1. Process improvement\nprocedures are participated in\nrelation to workplace\nassignment\n3.2. Work is carried out in\naccordance with process\nimprovement procedures\n3.3. Performance of operation or\nquality of product or service to\nensure customer satisfaction\nis monitored\n• Quality improvement\nprocesses\n• Company customers\ndefined\n• Solution\nproviding and\ndecision-making\n• Practice\ncompany\nprocess\nimprovement\nprocedure\n\n--- PDF PAGE 36 ---\nTESDA-SOP-QSO-01-F08\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – MECHATRONICS SERVICING NC III (Amended) Promulgated June 16, 2015\n\n Page 32\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Materials/components\n1.1. Materials may include but not limited to:\n1.1.1. wires\n1.1.2. cables, soldering lead\n1.1.3. electrical tape\n1.2. Components may include but not limited to:\n1.2.1. ICs\n1.2.2. Diodes\n2. Faults\nFaults may include but not limited to:\n2.1. Components/materials not according to\nspecification\n2.2. Components/materials contain manufacturing\ndefects\n2.3. Components/materials do not conform with\ngovernment regulation i.e., PEC, environmental\ncode\n2.4. Components/materials have safety defect\n3. Documentation\n3.1. Organization work procedures\n3.2. Manufacturer’s instruction manual\n3.3. Customer requirements\n3.4. Forms\n4. Quality standards\n4.1. Quality standards may relate but not limited to\nthe following:\n4.1.1. materials\n4.1.2. component parts\n4.1.3. final product\n4.1.4. production processes\n5. Customer\n5.1. Co-worker\n5.2. Supplier\n5.3. Client\n5.4. Organization receiving the product or service\n\n--- PDF PAGE 37 ---\nTESDA-SOP-QSO-01-F08\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – MECHATRONICS SERVICING NC III (Amended) Promulgated June 16, 2015\n\n Page 33\n\nEVIDENCE GUIDE\n\n1. Critical aspect of\ncompetency\nAssessment requires evidence that the candidate:\n\n1.1. Carried out work in accordance with the\ncompany’s standard operating procedures\n1.2. Performed task according to specifications\n1.3. Reported defects detected in accordance with\nstandard operating procedures\n1.4. Carried out work in accordance with the process\nimprovement procedures\n2. Method of assessment\n2.1. The assessor may select two (2) of the following\nassessment methods to objectively assess the\ncandidate:\n2.1.1. Observation\n2.1.2. Questioning\n2.1.3. Practical demonstration\n3. Resource implication\n\n3.1. Materials and component parts and equipment to\nbe used in a real or simulated electronic\nproduction situation\n4. Context of Assessment\n\n4.1. Assessment may be conducted in the workplace\nor in a simulated work environment.\n\n--- PDF PAGE 38 ---\nTESDA-SOP-QSO-01-F08\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – MECHATRONICS SERVICING NC III (Amended) Promulgated June 16, 2015\n\n Page 34\n\nUNIT TITLE\n:\nPERFORM COMPUTER OPERATIONS\n\nUNIT CODE\n:\nELC311203\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills, (and) attitudes and\nvalues needed to perform computer operations which include\ninputting, accessing, producing and transferring data using the\nappropriate hardware and software\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Plan and\nprepare for\ntask to be\nundertaken\n1.1. Requirements of task are\ndetermined according to job\nspecifications\n1.2. Appropriate hardware and\nsoftware are selected\naccording to task assigned\nand required outcome\n1.3. Task is planned to ensure\nOH & S guidelines and\nprocedures are followed\n• Main types of\ncomputers and basic\nfeatures of different\noperating systems\n• Main parts of a\ncomputer\n• Information on\nhardware and\nsoftware\n• Data security\nguidelines\n• Reading and\ncomprehension\nskills required to\ninterpret work\ninstruction and to\ninterpret basic user\nmanuals.\n• Communication\nskills to identify\nlines of\ncommunication,\nrequest advice,\nfollow instructions\nand receive\nfeedback.\n• Interpreting user\nmanuals and\nsecurity guidelines\n2. Input data\ninto\ncomputer\n2.1. Data are entered into the\ncomputer using appropriate\nprogram/application in\naccordance with company\nprocedures\n2.2. Accuracy of information is\nchecked and information is\nsaved in accordance with\nstandard operating\nprocedures\n2.3. Inputted data are stored in\nstorage media according to\nrequirements\n2.4. Work is performed within\nergonomic guidelines\n\n• Basic ergonomics of\nkeyboard and\ncomputer user\n• Storage devices and\nbasic categories of\nmemory\n• Relevant types of\nsoftware\n• Technology skills\nto use equipment\nsafely including\nkeyboard skills.\n• Entering data\n3. Access\ninformation\nusing\ncomputer\n3.1. Correct program/\napplication is selected\nbased on job requirements\n3.2. Program/application\ncontaining the information\nrequired is accessed\naccording to company\nprocedures\n• General security,\nprivacy legislation and\ncopyright\n• Productivity\nApplication\n• Business Application\n• Accessing\ninformation\n• Searching and\nbrowsing files and\ndata\n\n--- PDF PAGE 39 ---\nTESDA-SOP-QSO-01-F08\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – MECHATRONICS SERVICING NC III (Amended) Promulgated June 16, 2015\n\n Page 35\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n3.3. Desktop icons are\ncorrectly selected, opened\nand closed for navigation\npurposes\n3.4. Keyboard techniques are\ncarried out in line with OH &\nS requirements for safe use\nof keyboards\n4. Produce/\noutput data\nusing\ncomputer\nsystem\n4.1. Entered data are processed\nusing appropriate software\ncommands\n4.2. Data printed out as required\nusing computer\nhardware/peripheral devices\nin accordance with standard\noperating procedures\n4.3. Files, data are transferred\nbetween compatible\nsystems using computer\nsoftware, hardware/\nperipheral devices in\naccordance with standard\noperating procedures\n\n• Computer application\nin printing, scanning\nand sending facsimile\n• Types and function of\ncomputer peripheral\ndevices\n• Computer data\nprocessing\n• Printing of data\n• Transferring files\nand data\n5. Maintain\ncomputer\nequipment\nand systems\n5.1. Systems for cleaning, minor\nmaintenance and\nreplacement of\nconsumables are\nimplemented\n5.2. Procedures for ensuring\nsecurity of data, including\nregular back-ups and virus\nchecks are implemented in\naccordance with standard\noperating procedures\n5.3. Basic file maintenance\nprocedures are\nimplemented in line with the\nstandard operating\nprocedures\n• Computer\nequipment/system\nbasic maintenance\nprocedures\n• Viruses\n• OH & S principles and\nresponsibilities\n• Calculating computer\ncapacity\n• System Software\n• Basic file maintenance\nprocedures\n• Removing\ncomputer viruses\nfrom infected\nmachines\n• Making backup\nfiles\n\n--- PDF PAGE 40 ---\nTESDA-SOP-QSO-01-F08\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – MECHATRONICS SERVICING NC III (Amended) Promulgated June 16, 2015\n\n Page 36\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Hardware and peripheral\ndevices\n1.1. Personal computers\n1.2. Networked systems\n1.3. Communication equipment\n1.4. Printers\n1.5. Scanners\n1.6. Keyboard\n1.7. Mouse\n2. Software\nSoftware includes the following but not limited to:\n2.1. Word processing packages\n2.2. Data base packages\n2.3. Internet\n2.4. Spreadsheets\n3. OH & S guidelines\n3.1. OHS guidelines\n3.2.\nEnterprise procedures\n4. Storage media\nStorage media include the following but not limited to:\n4.1. diskettes\n4.2. CDs\n4.3. zip disks\n4.4. hard disk drives, local and remote\n5. Ergonomic guidelines\n5.1. Types of equipment used\n5.2. Appropriate furniture\n5.3. Seating posture\n5.4. Lifting posture\n5.5. Visual display unit screen brightness\n6. Desktop icons\nIcons include the following but not limited to:\n6.1. directories/folders\n6.2. files\n6.3. network devices\n6.4. recycle bin\n7. Maintenance\n7.1. Creating more space in the hard disk\n7.2. Reviewing programs\n7.3. Deleting unwanted files\n7.4. Backing up files\n7.5. Checking hard drive for errors\n7.6. Using up to date anti-virus programs\n7.7. Cleaning dust from internal and external surfaces\n\n--- PDF PAGE 41 ---\nTESDA-SOP-QSO-01-F08\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – MECHATRONICS SERVICING NC III (Amended) Promulgated June 16, 2015\n\n Page 37\n\nEVIDENCE GUIDE\n\n1. Critical aspect of\ncompetency\nAssessment requires evidence that the candidate:\n\n1.1. Selected and used hardware components correctly\nand according to the task requirement\n1.2. Identified and explained the functions of both\nhardware and software used, their general features\nand capabilities\n1.3. Produced accurate and complete data in\naccordance with the requirements\n1.4. Used appropriate devices and procedures to\ntransfer files/data accurately\n1.5. Maintained computer system\n2. Method of assessment\n2.1. The assessor may select two of the following\nassessment methods to objectively assess the\ncandidate:\n2.1.1. Observation\n2.1.2. Questioning\n2.1.3. Practical demonstration\n3. Resource implication\n3.1. Computer hardware with peripherals\n3.2. Appropriate software\n4. Context of Assessment\n4.1. Assessment may be conducted in the workplace or\nin a simulated environment\n\n--- PDF PAGE 42 ---\nTESDA-SOP-QSO-01-F08\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – MECHATRONICS SERVICING NC III (Amended) Promulgated June 16, 2015\n\n Page 38\n\nUNIT TITLE\n:\nTERMINATE AND CONNECT ELECTRICAL WIRING AND\nELECTRONICS CIRCUIT\n\nUNIT CODE\n:\nELC311206\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills, attitudes and values\nneeded to terminate and connect electrical wiring and\nelectronic circuits\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Plan and\nprepare for\ntermination/\nconnection of\nelectrical\nwiring/\nelectronics\ncircuits\n1.1. Materials are checked\naccording to specifications\nand tasks\n1.2. Appropriate tools and\nequipment are selected\naccording to tasks\nrequirements\n1.3. Task is planned to ensure\nOH & S guidelines and\nprocedures are followed\n1.4. Electrical wiring/electronic\ncircuits are correctly\nprepared for\nconnecting/termination in\naccordance with instructions\