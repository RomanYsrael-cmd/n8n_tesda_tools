tools\n• Identifying and\nchecking hand\ntools\n• Marking of safe or\nunsafe/ faulty\nhand tools\n3. Use\nappropriate\nhand tools\nand test\nequipment\n3.1. Tools are used according to\ntasks undertaken\n3.2. All safety procedures in using\ntools are observed at all times\nand appropriate personal\nprotective equipment (PPE) are\nused\n3.3. Malfunctions, unplanned or\nunusual events are reported to\nthe supervisor\n• Safety requirements in\nusing electronics hand\ntools and test\nequipment\n• Electronics hand tools\nfor adjusting,\ndismantling,\nassembling, finishing,\nand cutting.\n• Processes, Operations,\nSystems\no Proper usage and\ncare of hand tools\no Types and uses of\ntest equipment\n• Common faults in the\nuse of hand tools\n• Reading skills\nrequired to\ninterpret work\ninstruction and\nnumerical skills\n• Using PPE\nproperly\n• Problem solving in\nemergency\nsituation\n4. Maintain\nhand tools\n4.1. Tools are handled without\ndamage according to procedures.\n4.2. Routine maintenance of tools is\nundertaken according to standard\noperational procedures, principles\nand techniques\n4.3. Tools are stored safely in\nappropriate locations in\naccordance with manufacturer’s\nspecifications or standard\noperating procedures\n• Safety requirements in\nmaintenance of hand\ntools\n• Processes, Operations,\nSystems\no Maintenance of\ntools\no Storage of hand\ntools\n\n• Checking and\ncleaning hand\ntools\n• Storing hand tools\nproperly\n\n--- PDF PAGE 27 ---\nTESDA-SOP-QSO-01-F08\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – MECHATRONICS SERVICING NC III (Amended) Promulgated June 16, 2015\n\n Page 23\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Hand tools\n1.1. Hand tools for adjusting, dismantling, assembling,\nfinishing, and cutting. Tool set includes the following\nbut not limited to: screw drivers, pliers, punches,\nwren