ions. A bank of scenarios / case studies /\nwhat ifs will be required as well as bank of questions\nwhich will be used to probe the reason behind the\nobservable action.\n3. Methods of\nAssessment\nCompetency may be assessed through:\n3.1.\nCase studies on solving problems in the workplace\n3.2.\n Observation\nThe unit will be assessed in a holistic manner as is practical\nand may be integrated with the assessment of other relevant\nunits of competency. Assessment will occur over a range of\nsituations, which will include disruptions to normal, smooth\noperation. Simulation may be required to allow for timely\nassessment of parts of this unit of competency. Simulation\nshould be based on the actual workplace and will include\nwalk through of the relevant competency components.\n4. Context for\nAssessment\n4.1.\nIn all workplace, it may be appropriate to assess this\nunit concurrently with relevant teamwork or operation\nunits.\n\n--- PDF PAGE 20 ---\nTESDA-SOP-QSO-01-F08\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – MECHATRONICS SERVICING NC III (Amended) Promulgated June 16, 2015 16\n\nUNIT OF COMPETENCY: USE MATHEMATICAL CONCEPTS AND\n TECHNIQUES\n\nUNIT CODE : 500311113\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes required\nin the application of mathematical concepts and techniques.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\n\nREQUIRED SKILLS\n1. Identify\nmathematical\ntools and\ntechniques to\nsolve problem\n1.1 Problem areas are\nidentified based on given\ncondition\n1.2 Mathematical techniques\nare selected based on the\ngiven problem\n• Fundamental\noperation (addition,\nsubtraction, division,\nmultiplication)\n• Units of\nmeasurement and its\nconversion\n• Fundamental of units\n• Standard formulas\n• Basic measuring\ntools/devices\n• Measurement system\n• Basic measuring\ntools/devices\n• Steps in solving\nproblem\n• Identifying and\nselecting different\nmeasuring tools\n• Applying different\nformulas in solving\nproblems\n• Describing the units\nof measurement and\nfundamental units\n• Stating arithmetic\ncalculations involving\nthe following;\naddition, subtraction,\ndivision, multiplication\n• Applying theory into\nactual application on\nshipboard catering\nprocesses\n2. Apply\nmathematical\nprocedure/\nsolution\n2.1 Mathematical techniques\nare applied based on the\nproblem identified\n2.2 Mathematical computations\nare performed to the level\nof accuracy required for the\nproblem\n2.3 Results of mathematical\ncomputation is determined\nand verified based on job\nrequirements\n• Problem-based\nquestions\n• Estimation\n• Use of mathematical\ntools and standard\nformulas\n• Mathematical\ntechniques\n\n• Solving mathematical\ncomputations\n• Converting Metric to\nEnglish\n• Selecting and using\nappropriate and\nefficient techniques\nand strategies to\nsolve problems\n\n3. Analyze results 3.1 Result of application is\nreviewed based on\nexpected and required\nspecifications and outcome\n3.2 Appropriate action is\napplied in case of error\n\n• Techniques in\nanalyzing the results\n• Process in reviewing\nthe results\n• Precision and\naccuracy\n• Four fundamental\noperations\n• Steps in solving\nproblem\n• Standard formulas\n• Conversion\nmeasurement\n• Analyzing the result\nbased on the\nspecified\nrequirements\n• Interpreting and\ncommunicating the\nresults of the analysis\n\n--- PDF PAGE 21 ---\nTESDA-SOP-QSO-01-F08\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – MECHATRONICS SERVICING NC III (Amended) Promulgated June 16, 2015 17\n\n RANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Mathematical techniques\nMay include but are not limited to:\n1.1 