        "source_text": "--- PDF PAGE 26 ---\nTESDA-SOP-QSO-01-F08 \n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- \nTR – MECHATRONICS SERVICING NC III (Amended)                Promulgated June 16, 2015 \n \n                Page 22  \n \nCOMMON COMPETENCIES \n \nUNIT TITLE \n:  USE HAND TOOLS     \nUNIT CODE \n: \nELC311205 \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge, skills and attitudes on the safe \nuse, handling and maintenance of tools. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Plan and \nprepare for \ntasks to be \nundertaken \n1.1. Tasks to be undertaken are \nproperly identified \n1.2. Appropriate hand tools are \nidentified and selected according \nto the task requirements \n Planning and preparing \ntask/activity \n Electronics hand tools \nand their uses \n Function, operation and \ncommon faults in \nelectronics hand tools \n Preparing \nrequired tasks \n Communication \nskills \n Using hand tools \nproperly \n2. Prepare \nhand tools \n2.1. Appropriate hand tools are \nchecked for proper operation and \nsafety \n2.2. Unsafe or faulty tools are \nidentified and marked for repair \naccording to standard company \nprocedure \n Checking and  safety \nrequirements in \nhandling tools   \n Standard procedures in \nchecking, identification \nand marking of safe or \nunsafe/ faulty tools \n Identifying and \nchecking  hand \ntools \n Marking of safe or \nunsafe/ faulty \nhand tools \n3. Use \nappropriate \nhand tools \nand test \nequipment \n3.1. Tools are used according to  \ntasks undertaken \n3.2. All safety procedures in using \ntools are observed at all times \nand appropriate personal \nprotective equipment (PPE) are \nused \n3.3. Malfunctions, unplanned or \nunusual events are reported to \nthe supervisor \n Safety requirements in \nusing electronics hand \ntools and test \nequipment    \n Electronics hand tools \nfor adjusting, \ndismantling, \nassembling, finishing, \nand cutting. \n Processes, Operations, \nSystems \no Proper usage and \ncare of hand tools \no Types and uses of \ntest equipment \n Common faults in the \nuse of hand tools\n Reading skills \nrequired to  \ninterpret work \ninstruction and \nnumerical skills \n Using PPE \nproperly \n Problem solving in \nemergency \nsituation \n4. Maintain \nhand tools  \n4.1. Tools are handled without \ndamage according to procedures. \n4.2. Routine maintenance of tools is \nundertaken according to standard \noperational procedures, principles \nand techniques \n4.3. Tools are stored safely in \nappropriate locations in \naccordance with manufacturer’s \nspecifications or standard \noperating procedures \n Safety requirements in \nmaintenance of hand \ntools   \n Processes, Operations, \nSystems \no Maintenance of \ntools \no Storage of hand \ntools \n \n Checking and \ncleaning  hand \ntools \n Storing hand tools \nproperly\n\n--- PDF PAGE 27 ---\nTESDA-SOP-QSO-01-F08 \n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- \nTR – MECHATRONICS SERVICING NC III (Amended)                Promulgated June 16, 2015 \n \n                Page 23  \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Hand tools \n1.1. Hand tools for adjusting, dismantling, assembling, \nfinishing, and cutting. Tool set includes the following \nbut not limited to: screw drivers, pliers, punches, \nwrenches, files \n2. Personal Protective \nEquipment (PPE) \n2.1. Gloves \n2.2. Protective eyewear \n2.3. Apron/overall \n \n3. Maintenance \n3.1. Cleaning \n3.2. Lubricating \n3.3. Tightening \n3.4. Simple tool repairs \n3.5. Hand sharpening \n3.6. Adjustment using correct procedures \n \n \n \n \nEVIDENCE GUIDE \n \n1. Critical aspect of \ncompetency \nAssessment requires evidence that the candidate: \n \n1.1. Demonstrated safe working practices at all  times \n1.2. Communicated information about processes, \nevents or tasks being undertaken to ensure a \nsafe and efficient working environment \n1.3. Planned  tasks in all situations and reviewed task \nrequirements as appropriate \n1.4. Performed  all tasks to specification \n1.5. Maintained and stored tools in appropriate \nlocation \n2. Method of assessment \nCompetency in this unit must be assessed through: \n2.1. Observation \n2.2. Oral questioning \n3. Resource Implication \n3.1. Tools may include the following but not limited to: \n3.1.1. screw drivers  \n3.1.2. pliers \n3.1.3. punches  \n3.1.4. wrenches, files  \n \n4. Context of Assessment \n \n4.1. Assessment may be conducted in the workplace \nor in a simulated   environment\n",
