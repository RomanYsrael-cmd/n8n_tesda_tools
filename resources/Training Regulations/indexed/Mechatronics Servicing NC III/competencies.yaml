        "source_text": "ELC311202\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes and values\nneeded to prepare/interpret diagrams, engineering abbreviation\nand drawings, symbols, dimension.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED KNOWLEDGE\nREQUIRED SKILLS\n1. Identify\ndifferent\nkinds of\ntechnical\ndrawings\n1.1. Correct technical\ndrawing is selected\naccording to job\nrequirements.\n1.2. Technical drawings are\nsegregated in\naccordance with the\ntypes and kinds of\ndrawings\n• Types of technical\ndrawings\n• Applications for technical\ndrawing\n• Methods of technical\ndrawings\n• Symbols\n• Mark up/ Notation of\nDrawings\n• Reading skills\nrequired to\ninterpret work\ninstruction\n• Interpreting\nelectrical/\nelectronic signs\nand symbols\n\n2. Interpret\ntechnical\ndrawing\n2.1. Components, assemblies\nor objects are recognized\nas required.\n2.2. Dimensions of the key\nfeatures of the objects\ndepicted in the drawing\nare correctly identified.\n2.3. Symbols used in the\ndrawing are identified\nand interpreted correctly.\n2.4. Drawing is checked and\nvalidated against job\nrequirements or\nequipment in accordance\nwith standard operating\nprocedures.\n\n• Trade Mathematics\no Linear measurement\no Dimension\no Unit conversion\n• Blueprint Reading and\nPlan Specification\no Architectural,\nelectrical, electronics,\nmechanical plan,\nsymbols and\nabbreviations\no Drawing standard\nsymbols\n• Trade Theory\no Basic technical\ndrawing\no Types technical plans\no Various types of\ndrawings\no Notes and\nspecifications\n• Interpreting\ndrawing/\northographic\ndrawing\n• Interpreting\ntechnical plans\n• Matching\nspecification\ndetails with\nexisting resources\n• Safety handling of\ndrawing\ninstruments\n\n3. Prepare/\nmake\nchanges to\nelectrical/\nelectronic\nschematics\nand\ndrawings\n3.1. Electrical/electronic\nschematic is drawn and\ncorrectly identified.\n3.2. Correct drawing is\nidentified, equipment are\nselected and used in\naccordance with job\nrequirements.\n• Drawing conventions\n• Dimensioning\nConventions\n• Mathematics\no Four fundamental\noperations\no Percentage\no Fraction\no Algebra\no Geometry\n• Reading skills\nrequired to\ninterpret work\ninstruction\n• Communication\nskills\n• Preparing/ Making\nelectrical/\nelectronic signs\nand symbols\n• Computing\nformulas\n\n--- PDF PAGE 31 ---\nTESDA-SOP-QSO-01-F08\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – MECHATRONICS SERVICING NC III (Amended) Promulgated June 16, 2015\n\n Page 27\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED KNOWLEDGE\nREQUIRED SKILLS\n4. Store\ntechnical\ndrawings\nand\nequipment /\ninstruments\n4.1. Care and maintenance of\ndrawings are undertaken\naccording to company\nprocedures.\n4.2. Technical drawings are\nrecorded and inventory is\nprepared in accordance\nwith company\nprocedures.\n4.3. Proper storage of\ninstruments is\nundertaken according to\ncompany procedures.\n• Effective ways to\ncatalogue and store\ntechnical drawings\n• Manual methods of\nhandling, storing and\nmaintaining paper\ndrawings\n• Storing drawing in digital\nforms\no Scanner\no CAD\n\n• Handling and\nstoring of\ndrawings\n• Scanning and\nstoring drawings\nin digital form\n• Matching\nspecification\ndetails with\nexisting resources\n• Handling of\ndrawing\ninstruments\n\n--- PDF PAGE 32 ---\nTESDA-SOP-QSO-01-F08\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – MECHATRONICS SERVICING NC III (Amended) Promulgated June 16, 2015\n\n Page 28\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Technical drawings\nTechnical drawings include the following but not\nlimited to:\n\n1.1. Schematic diagrams\n1.2. Charts\n1.3. Block diagrams\n1.4. Lay-out plans\n1.5. Location plans\n1.6. Process and instrumentation diagrams\n1.7. Loop diagrams\n1.8. System Control Diagrams\n2. Dimensions\nDimensions may include but not limited to:\n\n2.1. Length\n2.2. Width\n2.3. Height\n2.4. Diameter\n2.5. Angles\n3. Symbols\nMay include but not limited to:\n\n3.1. NEC- National Electric Code\n3.2. IEC -International Electrotechnical Commission\n3.3. ASME - American Society of Mechanical\nEngineers\n3.4. IEEE - Institute of Electrical and Electronics\nEngineers\n3.5. ISA - Instrumentation System and Automation\nSociety\n4. Instruments/Equipment\n4.1. Components/dividers\n4.2. Drawing boards\n4.3. Rulers\n4.4. T-square\n4.5. Calculator\n\n--- PDF PAGE 33 ---\nTESDA-SOP-QSO-01-F08\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – MECHATRONICS SERVICING NC III (Amended) Promulgated June 16, 2015\n\n Page 29\n\nEVIDENCE GUIDE\n\n1. Critical aspect of\ncompetencies\nAssessment requires evidence that the candidate:\n\n1.1. selected correct technical drawing in line with job\nrequirements\n1.2. correctly identified the objects represented in the\ndrawing\n1.3. identified and interpreted symbols used in the\ndrawing correctly\n1.4. prepared/produced electrical/electronic drawings\nincluding all relevant specifications\n1.5. stored diagrams/equipment\n2. Method of assessment\nCompetency in this unit must be assessed through:\n\n2.1. Practical tasks involving interpretation of a range of\ntechnical drawings\n2.2. Oral questioning\n3. Resource implication\n3.1. Drawings\n3.2. Diagrams\n3.3. Charts\n3.4. Plans\n4. Context of Assessment\nAssessment may be conducted in the workplace or in a\nsimulated work environment\n\n--- PDF PAGE 34 ---\nTESDA-SOP-QSO-01-F08\n-----------------------------------------------------