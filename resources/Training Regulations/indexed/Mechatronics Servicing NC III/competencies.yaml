        "source_text": "500311114\n\nUNIT DESCRIPTOR : This unit of competency covers the knowledge, skills, and\nattitude\nrequired\nin\nselecting,\nsourcing\nand\napplying\nappropriate and affordable technologies in the workplace.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Study/select\nappropriate\ntechnology\n1.1 Usage of different\ntechnologies is\ndetermined based on job\nrequirements\n1.2 Appropriate technology is\nselected as per work\nspecification\n• Awareness on\ntechnology and its\nfunction\n• Communication\ntechniques\n• Health and safety\nprocedure\n• Company policy in\nrelation to relevant\ntechnology\n• Machineries/\nequipment and their\napplication\n• Software programs\n• Identifying\nrelevant\ntechnology on job\n\n2. Apply\nrelevant\ntechnology\n\n2.1 Relevant technology is\neffectively used in carrying\nout function\n2.2 Applicable software and\nhardware are used as per\ntask requirement\n2.3 Management concepts\nare observed and practiced\nas per established industry\npractices\n• Knowledge on\noperating instructions\n• Understanding\nsoftware and hardware\nsystem\n• Communication\ntechniques\n• Health and safety\nprocedure\n• Company policy in\nrelation to relevant\ntechnology\n• Different management\nconcepts\n• Technology\nadaptability\n• Applying relevant\ntechnology\n• Communicating\nskills\n• Using software\napplications skills\n• Conducting risk\nassessment\n\n3. Maintain/\nenhance\nrelevant\ntechnology\n3.1 Maintenance of technology\nis applied in accordance\nwith the industry standard\noperating procedure,\nmanufacturer’s operating\nguidelines and\noccupational health and\nsafety procedure to\nensure its operative ability\n3.2 Updating of technology is\nmaintained through\n• Awareness on\ntechnology and its\nfunction\n• Repair and\nmaintenance\nprocedure\n• Health and safety\nprocedure\n• Company policy in\nrelation to relevant\ntechnology\n• Performing basic\ntroubleshooting\nskills\n• Identifying failures\nor defects\n• Communication\nskills\n• Applying corrective\nand preventive\nmaintenance\n\n--- PDF PAGE 23 ---\nTESDA-SOP-QSO-01-F08\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – MECHATRONICS SERVICING NC III (Amended) Promulgated June 16, 2015 19\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\ncontinuing education or\ntraining in accordance with\njob requirement\n3.3 Technology failure/ defect\nis immediately reported to\nthe concern/responsible\nperson or section for\nappropriate action\n\n• Upgrading of\ntechnology\n• Organizational set-\nup/work flow\n\n--- PDF PAGE 24 ---\nTESDA-SOP-QSO-01-F08\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – MECHATRONICS SERVICING NC III (Amended) Promulgated June 16, 2015\n\n Page 20\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Technology\nMay include but are not limited to:\n1.1 Office technology\n1.2 Industrial technology\n1.3 System technology\n1.4 Information technology\n1.5 Training technology\n2. Management concepts\nMay include but not limited to:\n2.1 Real Time Management\n2.2 KAIZEN or continuous improvement\n2.3 5s\n2.4 Total Quality Management\n2.5 Other management/productivity tools\n3. Industry standard operating\nprocedure\n3.1 Written guidelines relative to the usage of\noffice technology/equipment\n3.2 Verbal advise/instruction from the co-worker\n4. Manufacturer’s operating\nguidelines/ instructions\n4.1 Written instruction/manuals of specific\ntechnology/ equipment\n4.2 General instruction manual\n4.3 Verbal advise from manufacturer relative to\nthe operation of equipment\n5. Occupational health and\nsafety procedure\n5.1 Relevant statutes on OHS\n5.2 Company guidelines in using\n technology/equipment\n6. Appropriate action\n6.1 Implementing preventive maintenance\nschedule\n6.2 Coordinating with manufacturer’s technician\n\n--- PDF PAGE 25 ---\nTESDA-SOP-QSO-01-F08\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – MECHATRONICS SERVICING NC III (Amended) Promulgated June 16, 2015\n\n Page 21\n\nEVIDENCE GUIDE\n\n2 1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Studied and selected appropriate technology\nconsistent with work requirements\n1.2 Applied relevant technology\n1.3 Maintained and enhanced operative ability of relevant\ntechnology\n2. Resource\nImplications\nThe following resources MUST be provided:\n2.1 Relevant technology\n2.2 Interview and demonstration questionnaires\n2.3 Assessment packages\n3. Methods of\nAssessment\nCompetency must be assessed through:\n3.1 Interview\n3.2 Actual demonstration\n3.3 Authenticated portfolio (related certificates of\ntraining/seminar)\n4. Context for\nAssessment\n4.1 Competency may be assessed in actual workplace or\nsimulated environment\n\n--- PDF PAGE 26 ---\nTESDA-SOP-QSO-01-F08\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – MECHATRONICS SERVICING NC III (Amended) Promulgated June 16, 2015\n\n Page 22\n\nCOMMON COMPETENCIES\n\nUNIT TITLE\n: USE HAND TOOLS\nUNIT CODE\n:"
