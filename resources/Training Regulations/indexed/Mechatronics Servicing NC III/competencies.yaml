        "source_text": "500311113\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes required\nin the application of mathematical concepts and techniques.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\n\nREQUIRED SKILLS\n1. Identify\nmathematical\ntools and\ntechniques to\nsolve problem\n1.1 Problem areas are\nidentified based on given\ncondition\n1.2 Mathematical techniques\nare selected based on the\ngiven problem\n• Fundamental\noperation (addition,\nsubtraction, division,\nmultiplication)\n• Units of\nmeasurement and its\nconversion\n• Fundamental of units\n• Standard formulas\n• Basic measuring\ntools/devices\n• Measurement system\n• Basic measuring\ntools/devices\n• Steps in solving\nproblem\n• Identifying and\nselecting different\nmeasuring tools\n• Applying different\nformulas in solving\nproblems\n• Describing the units\nof measurement and\nfundamental units\n• Stating arithmetic\ncalculations involving\nthe following;\naddition, subtraction,\ndivision, multiplication\n• Applying theory into\nactual application on\nshipboard catering\nprocesses\n2. Apply\nmathematical\nprocedure/\nsolution\n2.1 Mathematical techniques\nare applied based on the\nproblem identified\n2.2 Mathematical computations\nare performed to the level\nof accuracy required for the\nproblem\n2.3 Results of mathematical\ncomputation is determined\nand verified based on job\nrequirements\n• Problem-based\nquestions\n• Estimation\n• Use of mathematical\ntools and standard\nformulas\n• Mathematical\ntechniques\n\n• Solving mathematical\ncomputations\n• Converting Metric to\nEnglish\n• Selecting and using\nappropriate and\nefficient techniques\nand strategies to\nsolve problems\n\n3. Analyze results 3.1 Result of application is\nreviewed based on\nexpected and required\nspecifications and outcome\n3.2 Appropriate action is\napplied in case of error\n\n• Techniques in\nanalyzing the results\n• Process in reviewing\nthe results\n• Precision and\naccuracy\n• Four fundamental\noperations\n• Steps in solving\nproblem\n• Standard formulas\n• Conversion\nmeasurement\n• Analyzing the result\nbased on the\nspecified\nrequirements\n• Interpreting and\ncommunicating the\nresults of the analysis\n\n--- PDF PAGE 21 ---\nTESDA-SOP-QSO-01-F08\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – MECHATRONICS SERVICING NC III (Amended) Promulgated June 16, 2015 17\n\n RANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Mathematical techniques\nMay include but are not limited to:\n1.1 Four fundamental operations\n1.2 Measurements\n1.3 Use/Conversion of units of measurements\n1.4 Use of standard formulas\n2. Appropriate action\n2.1 Review in the use of mathematical\ntechniques (e.g. recalculation, re-modeling)\n2.2 Report error to immediate superior for proper\naction\n\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Identified, applied and reviewed the use of\nmathematical concepts and techniques to workplace\nproblems\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1 Calculator\n4.2 Basic measuring tools\n4.3 Case Problems\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1 Authenticated portfolio\n5.2 Written Test\n5.3 Interview/Oral Questioning\n5.4 Demonstration\n6. Context for\nAssessment\n6.1 Competency may be assessed in the work place or in a\nsimulated work place setting\n\n--- PDF PAGE 22 ---\nTESDA-SOP-QSO-01-F08\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – MECHATRONICS SERVICING NC III (Amended) Promulgated June 16, 2015 18\n\nUNIT OF COMPETENCY: USE RELEVANT TECHNOLOGIES\n\nUNIT CODE :"
