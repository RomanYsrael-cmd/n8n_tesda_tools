ills \nrequired to \nunderstand \nwork \ninstructions \n2.2 Communication \nskills needed to \ncollect and \ninterchange \ninformation\n\n--- PDF PAGE 61 ---\nTESDA-SOP-QSO-01-F08 \n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- \nTR – MECHATRONICS SERVICING NC III (Amended)                Promulgated June 16, 2015 \n \n                Page 57  \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized items are elaborated in \nthe Range of Variables \nREQUIRED KNOWLEDGE \nREQUIRED SKILLS\n2.3. Scheduled/periodic \nmaintenance is performed \nin accordance with \nmanufacturer’s & company \nrequirements. \n2.4. Unplanned events or \nconditions are responded \nto in accordance with \nestablished procedures \nmaintenance checklist \n2.5 Use of tools \n2.6 Use of test equipment/ \ninstruments \n2.7 Knowledge & \ninterpretation of \nmanufacturer’s/ \ncompany preventive \nmaintenance \nrequirements   \n2.8 Out-of-control action \nplan (OCAP) \n2.3 Analytical skills  \n2.4 Problem solving \nskills \n3. Repair \nmechatronics \nand \nautomation \nsystem \n3.1. Appropriate personal \nprotective equipment is \nused and OHS policies & \nprocedures are followed \n3.2. Normal function of \nmechatronics and \nautomation system are \nchecked in accordance \nwith manufacturer’s \ninstructions. \n3.3.  Fault or problem in \ncomponent is diagnosed \nand corrected in line with \nthe standard operating \nprocedures. \n3.4. Unplanned events or \nconditions are responded \nto in accordance with \nestablished procedures\n3.1 Principles of 3R’s \n3.2 Environmental Safety \n Waste Segregation \n3.3 Fault finding on control \ncircuits \n Electro-mechanical \n Pneumatic & \nelectro-pneumatic \n Hydraulic and \nelectro-hydraulic \n Electronic logic \n3.4 Mechatronics and \nautomation devices \nspecifications  \n3.1 Reading skills \nrequired to \nunderstand \nmanufactu