          "source_text": "1. Critical aspect of\ncompetency\nAssessment requires evidence that the candidate:\n\n1.1. Undertook work safely and according to workplace\nand standard procedures\n1.2. Used appropriate termination/ connection methods\n1.3. Followed correct sequence in termination /\nconnection process\n1.4. Conducted testing of terminated connected\nelectrical wiring/electronic circuits using\nappropriate procedures and standards\n2. Method of assessment\n2.1. The assessor may select two (2) of the following\nassessment methods to objectively assess the\ncandidate:\n2.1.1. Observation\n2.1.2. Oral Questioning\n2.1.3. Practical demonstration\n3. Resource implication\n3.1. Tools for measuring, cutting, drilling,\nassembling/disassembling, connecting. Tool set\nincludes the following but not limited to:\n3.1.1. screw drivers\n3.1.2. pliers\n3.1.3. cutters\n4. Context of Assessment\n4.1. Assessment may be conducted in the workplace\nor in a simulated environment\n\n--- PDF PAGE 46 ---\nTESDA-SOP-QSO-01-F08\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – MECHATRONICS SERVICING NC III (Amended) Promulgated June 16, 2015\n\n Page 42\n\nUNIT OF COMPETENCY: TEST ELECTRONIC COMPONENTS\n\nUNIT CODE :"
        },
        "source_text": "ELC311206\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills, attitudes and values\nneeded to terminate and connect electrical wiring and\nelectronic circuits\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Plan and\nprepare for\ntermination/\nconnection of\nelectrical\nwiring/\nelectronics\ncircuits\n1.1. Materials are checked\naccording to specifications\nand tasks\n1.2. Appropriate tools and\nequipment are selected\naccording to tasks\nrequirements\n1.3. Task is planned to ensure\nOH & S guidelines and\nprocedures are followed\n1.4. Electrical wiring/electronic\ncircuits are correctly\nprepared for\nconnecting/termination in\naccordance with instructions\nand work site procedures\n• Use of tools\n• Use of test\ninstruments /\nequipment\n• Electrical theory\n• Principals of AC\nand DC\n• OH & S guidelines\nand procedures\n• Basic electrical and\nelectronic devices\n• Reading skills\nrequired to\ninterpret work\ninstruction\n• Checking\nmaterials for\nconformance to\nspecifications\n• Checking existing\nand new\ninstallation site for\ncorrect location\nand specification\n2. Terminate/\nconnect\nelectrical\nwiring/\nelectronic\ncircuits\n2.1. Safety procedures in using\ntools are observed at all\ntimes and appropriate\npersonal protective\nequipment are used\n2.2. Work is undertaken safely in\naccordance with the\nworkplace and standard\nprocedures\n2.3. Appropriate range of\nmethods in\ntermination/connection are\nused according to\nspecifications,\nmanufacturer’s requirements\nand safety\n2.4. Correct sequence of\noperation is followed\naccording to job\nspecifications\n2.5. Accessories used are\nadjusted, if necessary\n2.6. Confirm termination/\nconnection undertaken\nsuccessfully in accordance\nwith job specification\n\n• Wiring techniques\n• OH & S principles\n• Use of lead-free\nsoldering\ntechnology\n• Specifications and\nmethods for\nterminating different\nmaterials\n• Communication\nskills\n• Marking, tagging\nand labeling\nrequirements for\ncables, wires,\nconductors and\nconnections\n\n--- PDF PAGE 43 ---\nTESDA-SOP-QSO-01-F08\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – MECHATRONICS SERVICING NC III (Amended) Promulgated June 16, 2015\n\n Page 39\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n3. Test\ntermination/\nconnections\nof electrical\nwiring/\nelectronics\ncircuits\n3.1. Testing of all completed\ntermination/ connections of\nelectric wiring/electronic\ncircuits is conducted for\ncompliance with\nspecifications and\nregulations using appropriate\nprocedures and equipment\n3.2. Wiring and circuits are\nchecked using specified\ntesting procedures\n3.3. Unplanned events or\nconditions are responded to\nin accordance with\nestablished procedures\n\n• AC and DC power\nsupplies\n• Use of diagnostic\nequipments\n• Surface mount\nsoldering\ntechniques\n• Tests for wiring and\nconnections\n• Wiring support\ntechniques and\nalternatives\n\n• Soldering\ntechniques\n• Printed circuit\nboard repair and\ntechniques\n• Electronic\nassembly\nfunctional and\nquality testing\n• Undertaking\ntesting of wiring\nand connections\nfor conformance\nto specification\n• Using language\nand literacy skills\nto complete short\nreports and\nrequired\n• Adjusting and\nfixing wiring\nsupports\n\n--- PDF PAGE 44 ---\nTESDA-SOP-QSO-01-F08\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – MECHATRONICS SERVICING NC III (Amended) Promulgated June 16, 2015\n\n Page 40\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Materials\n1.1\nMaterials included the following but not limited to:\n1.1.1 Soldering lead\n1.1.2 Cables\n1.1.3 Wires\n2. Tools and equipment\n2.1\nTools for measuring, cutting, drilling,\nassembling/disassembling. Tool set includes the\nfollowing but not limited to:\n2.1.1 Pliers\n2.1.2 Cutters\n2.1.3 Screw drivers\n2.2\nEquipment\n2.2.1 Soldering gun\n2.2.2 Multi-tester\n3. Personal protective\nequipment\n3.1\ngoggles\n3.2\ngloves\n3.3\napron/overall\n4. Methods\n4.1\nClamping\n4.2\nPin connection\n4.3\nSoldered joints\n4.4\nPlugs\n5. Accessories\n5.1\nAccessories may include the following but not limited to:\n5.1.1 brackets\n5.1.2 clamps\n\n--- PDF PAGE 45 ---\nTESDA-SOP-QSO-01-F08\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – MECHATRONICS SERVICING NC III (Amended) Promulgated June 16, 2015\n\n Page 41\n\nEVIDENCE GUIDE\n\n1. Critical aspect of\ncompetency\nAssessment requires evidence that the candidate:\n\n1.1. Undertook work safely and according to workplace\nand standard procedures\n1.2. Used appropriate termination/ connection methods\n1.3. Followed correct sequence in termination /\nconnection process\n1.4. Conducted testing of terminated connected\nelectrical wiring/electronic circuits using\nappropriate procedures and standards\n2. Method of assessment\n2.1. The assessor may select two (2) of the following\nassessment methods to objectively assess the\ncandidate:\n2.1.1. Observation\n2.1.2. Oral Questioning\n2.1.3. Practical demonstration\n3. Resource implication\n3.1. Tools for measuring, cutting, drilling,\nassembling/disassembling, connecting. Tool set\nincludes the following but not limited to:\n3.1.1. screw drivers\n3.1.2. pliers\n3.1.3. cutters\n4. Context of Assessment\n4.1. Assessment may be conducted in the workplace\nor in a simulated environment\n\n--- PDF PAGE 46 ---\nTESDA-SOP-QSO-01-F08\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – MECHATRONICS SERVICING NC III (Amended) Promulgated June 16, 2015\n\n Page 42\n\nUNIT OF COMPETENCY: TEST ELECTRONIC COMPONENTS\n\nUNIT CODE :"
