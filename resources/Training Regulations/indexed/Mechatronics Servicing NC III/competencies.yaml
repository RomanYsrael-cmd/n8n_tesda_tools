        "evidence_guide": {
          "source_text": "1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1.\nIdentified the problem\n1.2.\nDetermined the fundamental causes of the problem\n1.3.\nDetermined the correct / preventive action\n1.4.\nProvided recommendation to manager\nThese aspects may be best assessed using a range of\nscenarios / case studies / what ifs as a stimulus with a walk\nthrough forming part of the response. These assessment\nactivities should include a range of problems, including new,\nunusual and improbable situations that may have happened.\n2. Resource\nImplications\n2.1.\nAssessment will require access to an operating plant\nover an extended period of time, or a suitable method\nof gathering evidence of operating ability over a range\nof situations. A bank of scenarios / case studies /\nwhat ifs will be required as well as bank of questions\nwhich will be used to probe the reason behind the\nobservable action.\n3. Methods of\nAssessment\nCompetency may be assessed through:\n3.1.\nCase studies on solving problems in the workplace\n3.2.\n Observation\nThe unit will be assessed in a holistic manner as is practical\nand may be integrated with the assessment of other relevant\nunits of competency. Assessment will occur over a range of\nsituations, which will include disruptions to normal, smooth\noperation. Simulation may be required to allow for timely\nassessment of parts of this unit of competency. Simulation\nshould be based on the actual workplace and will include\nwalk through of the relevant competency components.\n4. Context for\nAssessment\n4.1.\nIn all workplace, it may be appropriate to assess this\nunit concurrently with relevant teamwork or operation\nunits.\n\n--- PDF PAGE 20 ---\nTESDA-SOP-QSO-01-F08\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – MECHATRONICS SERVICING NC III (Amended) Promulgated June 16, 2015 16\n\nUNIT OF COMPETENCY: USE MATHEMATICAL CONCEPTS AND\n TECHNIQUES\n\nUNIT CODE :"
        },
        "source_text": "500311112\nUNIT DESCRIPTOR\n:\nThis unit of covers the knowledge, skills and attitudes\nrequired to solve problems in the workplace including the\napplication of problem solving techniques and to determine\nand resolve the root cause of problems.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Identify the\nproblem\n1.1. Variances are identified\nfrom normal operating\nparameters; and product\nquality\n1.2. Extent, cause and nature\nof the problem are defined\nthrough observation,\ninvestigation and\nanalytical techniques\n1.3. Problems are clearly\nstated and specified\n\n• Competence includes a\nthorough knowledge and\nunderstanding of the\nprocess, normal\noperating parameters,\nand product quality to\nrecognize non-standard\nsituations\n• Competence to include\nthe ability to apply and\nexplain, sufficient for the\nidentification of\nfundamental cause,\ndetermining the\ncorrective action and\nprovision of\nrecommendations\no Relevant equipment\nand operational\nprocesses\no Enterprise goals,\ntargets and measures\no Enterprise quality,\nOHS and\nenvironmental\nrequirement\no Enterprise\ninformation systems\nand data collation\no Industry codes and\nstandards\n• Normal operating\nparameters and product\nquality\n• Identifying and clarifying\nthe nature of problem\n\n• Using range of\nformal problem\nsolving\ntechniques\n• Identifying and\nclarifying the\nnature of the\nproblem\n• Evaluating the\neffectiveness of\na present\nprocess in the\nworkplace\n• Applying\nanalytical\ntechniques\n\n2. Determine\nfundamental\ncauses of the\nproblem\n2.1 Possible causes are\nidentified based on\nexperience and the use of\nproblem solving tools /\nanalytical techniques.\n2.2 Possible cause statements\nare developed based on\n• Relevant equipment and\noperational processes\n• Enterprise goals, targets\nand measures\n• Enterprise quality, OHS\nand environmental\nrequirements\n• Analysis of root\ncauses\n\n--- PDF PAGE 17 ---\nTESDA-SOP-QSO-01-F08\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – MECHATRONICS SERVICING NC III (Amended) Promulgated June 16, 2015 13\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\nfindings\n2.3 Fundamental causes are\nidentified per results of\ninvestigation conducted\n\n• Enterprise information\nsystems and data\ncollation\n• Industry codes and\nstandards\n3. Determine\ncorrective\naction\n3.1 All possible options are\nconsidered for resolution\nof the problem\n3.2 Strengths and\nweaknesses of possible\noptions are considered\n3.3 Corrective actions are\ndetermined to resolve the\nproblem and possible\nfuture causes\n3.4 Action plans are\ndeveloped identifying\nmeasurable objectives,\nresource needs and\ntimelines in accordance\nwith safety and operating\nprocedures\n• Understanding the\nprocedure in undertaking\ncorrective action\n• Principles of decision\nmaking strategies and\ntechniques\n• Enterprise information\nsystems and data\ncollation\n• Action planning\n• Identifying and\nclarifying the\nnature of the\nproblem\n• Devising the best\nsolution\n• Evaluating the\nsolution\n• Implementing\ndeveloped plan to\nrectify the\nproblem\n• Implementing\ncorrective and\npreventive actions\nbased on root\ncause analysis\n4. Provide\nrecommenda\ntion/s to\nmanager\n4.1 Report on\nrecommendations is\nprepared according to\nprocedures.\n4.2 Recommendations are\npresented to appropriate\npersonnel.\n4.3 Recommendations are\nfollowed-up, if required\n• How to make a report\nand recommendation\n• Writing report and\nrecommendations\n\n--- PDF PAGE 18 ---\nTESDA-SOP-QSO-01-F08\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – MECHATRONICS SERVICING NC III (Amended) Promulgated June 16, 2015 14\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Analytical techniques\n1.1.\nBrainstorming\n1.2.\nIntuitions/Logic\n1.3.\nCause and effect diagrams\n1.4.\nPareto analysis\n1.5.\nSWOT analysis\n1.6.\nGant chart, Pert CPM and graphs\n1.7.\nScatter grams\n2. Problem\n\n2.1.\nNon – routine process and quality problems\n2.2.\nEquipment selection, availability and failure\n2.3.\nTeamwork and work allocation problem\n2.4.\nSafety and emergency situations and\nincidents\n3. Action plans\n\n3.1.\nPriority requirements\n3.2.\nMeasurable objectives\n3.3.\nResource requirements\n3.4.\nTimelines\n3.5.\nCo-ordination and feedback requirements\n3.6.\nSafety requirements\n3.7.\nRisk assessment\n3.8.\nEnvironmental requirements\n\n--- PDF PAGE 19 ---\nTESDA-SOP-QSO-01-F08\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – MECHATRONICS SERVICING NC III (Amended) Promulgated June 16, 2015 15\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1.\nIdentified the problem\n1.2.\nDetermined the fundamental causes of the problem\n1.3.\nDetermined the correct / preventive action\n1.4.\nProvided recommendation to manager\nThese aspects may be best assessed using a range of\nscenarios / case studies / what ifs as a stimulus with a walk\nthrough forming part of the response. These assessment\nactivities should include a range of problems, including new,\nunusual and improbable situations that may have happened.\n2. Resource\nImplications\n2.1.\nAssessment will require access to an operating plant\nover an extended period of time, or a suitable method\nof gathering evidence of operating ability over a range\nof situations. A bank of scenarios / case studies /\nwhat ifs will be required as well as bank of questions\nwhich will be used to probe the reason behind the\nobservable action.\n3. Methods of\nAssessment\nCompetency may be assessed through:\n3.1.\nCase studies on solving problems in the workplace\n3.2.\n Observation\nThe unit will be assessed in a holistic manner as is practical\nand may be integrated with the assessment of other relevant\nunits of competency. Assessment will occur over a range of\nsituations, which will include disruptions to normal, smooth\noperation. Simulation may be required to allow for timely\nassessment of parts of this unit of competency. Simulation\nshould be based on the actual workplace and will include\nwalk through of the relevant competency components.\n4. Context for\nAssessment\n4.1.\nIn all workplace, it may be appropriate to assess this\nunit concurrently with relevant teamwork or operation\nunits.\n\n--- PDF PAGE 20 ---\nTESDA-SOP-QSO-01-F08\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – MECHATRONICS SERVICING NC III (Amended) Promulgated June 16, 2015 16\n\nUNIT OF COMPETENCY: USE MATHEMATICAL CONCEPTS AND\n TECHNIQUES\n\nUNIT CODE :"
