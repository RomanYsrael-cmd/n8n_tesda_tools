--------------------------------------------------------------------------------------------------------------------\nTR – MECHATRONICS SERVICING NC III (Amended) Promulgated June 16, 2015\n\n Page 48\n\nCORE COMPETENCIES\n\nUNIT TITLE : DEVELOP MECHATRONICS AND AUTOMATION CONTROL\nCIRCUITS AND PLC APPLICATION PROGRAMS\n\nUNIT CODE\n: ELC311303\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes needed to develop,\nanalyze, implement and review mechatronics and automation control\ncircuits and basic/intermediate PLC application programs in line with\nrequirements, software specifications and applications. This includes\ncompetencies in determining control circuits requirements, developing\nPLC application program, testing the developed control circuits and PLC\napplication program and documenting control circuits and PLC application\nprogram being developed.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized items are elaborated\nin the range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Determine\ncontrol circuits\nrequirements\n1.1. Control circuits\nrequirements and design\ndata are obtained and\nclarified as needed for\nthe application.\n1.2. PLC software application\nprogram flow is\ndocumented according to\nthe validated\nrequirements of the\napplication.\n1.3. The coding, modules and\nlinks required are\ndetermined according to\nthe application.\n1.4. Appropriate language is\nused according to the\napplication\n• Logic circuit analysis and\ndevelopment\no Sequential circuit\no Ladder circuit\n• Operation process\nflowcharting\n• PLC data types\n• PLC modules\n• PLC hardware\nconfiguration\n• Standard programming\nlanguages\no Ladder\no Function block\ndiagram (FBD)\no Instructions list (IL)\no Sequential function\nflowchart (SFC)\no Structured Text\nLanguage (STL)\n• Reading skills\nrequired to\nunderstand work\ninstructions\n• Communication\nskills needed to\ncollect and\ninterchange\ninformation\n• Documentation\nskills\n• Analytical skills\n• Programming skills\n• Skills in computer\noperation\n\n2. Develop PLC\napplication\nprogram\n2.1. PLC application program\nis developed using\nappropriate code.\n2.2. PLC application program\nis debugged and\nreworked for correction of\nerrors\n2.3. Appropriate ergonomic\nstandards are observed\nto reduce fatigue while\nworking on a computer\n\n• PLC programming\no Program organization\no Data types\no Variables\no Configuration\n• PLC program instructions\no Relay / Logic/ Bit\no Timer\no Counter\no Arithmetic instructions\no Data manipulation\no Program control\n• Skills in computer\noperation\n• PLC programming\nskills\n• Debugging skills\n• Documentation\nskills\n• Analytical skills\n\n--- PDF PAGE 53 ---\nTESDA-SOP-QSO-01-F08\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – MECHATRONICS SERVICING NC III (Amended) Promulgated June 16, 2015\n\n Page 49\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized items are elaborated\nin the range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n\n• Ergonomic guidelines/\nstandards\no Movement space\no Furniture dimensions\no Working postures\no Illumination and glare\n• PLC program debugging\ntechniques\no Online\no Off-line\n3. Test developed\ncontrol circuits\nand PLC\napplication\nprogram\n3.1 Developed control\ncircuits and PLC software\napplication program is\nrun to ensure all syntax\nerrors are corrected.\n3.2 Program is downloaded\nusing manufacturer’s\nprocedures.\n3.3 Any limits, exceptions\nand other aspects built\ninto the control circuits\nand PLC software\napplication program are\ntested against user’s\ncontrol requirements.\n3.4 Control circuits and PLC\nsoftware application\nprogram is tested for\nuser’s acceptance\n• Computer interfacing\n• Concepts of I/O driver\nsoftware\n• Downloading and\nuploading procedures of\nPLC software program\n• Control concepts and\napplications\n• Standard operating\nprocedures for PLC\nsoftware application\nprogram\n• Testing and\ncommissioning\nprocedures for control\ncircuits and PLC software\napplication program\n\n• Skills in computer\noperation\n• PLC programming\nskills\n• Debugging skills\n• Analytical skills\n• Testing and\ncommissioning\nskills\n4. Document\ncontrol circuits\nand PLC\napplication\nprogram\ndeveloped\n4.1 Final control circuits and\nPLC application program\nflow or flowchart is\nprepared according to\ncompany standards.\n4.2 Labels and comments\nare indicated into the\nprogram for user–\nfriendliness.\n4.3 Final revision of the PLC\napplication program and\nexternal devices\nassignment are prepared\nin softcopy and printed\nformats\n• Computer software\napplications\no Computer Aided\nDesign (CAD)\no Microsoft office\napplication\n• Tagging and labeling of\nprogram components\n• Exporting PLC software\nprogram\n• Compilation of softcopy\nand printed formats\n\n• Skills in computer\noperation\n• Documentation\nskills\n\n--- PDF PAGE 54 ---\nTESDA-SOP-QSO-01-F08\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – MECHATRONICS SERVICING NC III (Amended) Promulgated June 16, 2015\n\n Page 50\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Language\nInclude but not limited to:\n1.1.\nStandard Programming languages\n• Ladder\n• Function block diagram (FBD)\n• Instructions list (IL)\n• Sequential function flowchart (SFC)\n• Structured Text Language (STL)\n\n1.2.\nProcedural language\n2. Ergonomic guidelines/\nstandards\nInclude but not limited to:\n2.1.\nMovement space\n2.2.\nFurniture dimensions\n2.3.\nWorking postures\n2.4.\nIllumination and glare\n3. Debugging\nPLC program debugging techniques:\n3.1.\nOnline\n3.2.\nOff-line\n4. Labels and comments\nInclude but not limited to:\n4.1 Elements tagging\n4.2 Labeling\n4.3 Remarks and description\n\n--- PDF PAGE 55 ---\nTESDA-SOP-QSO-01-F08\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – MECHATRONICS SERVICING NC III (Amended) Promulgated June 16, 2015\n\n Page 51\n\nEVIDENCE GUIDE\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1.\nObtained and clarified control circuits\nrequirements and design data as needed for the\napplication\n1.2.\nDeveloped PLC software application program\nusing appropriate code\n1.3.\nDownloaded program using manufacturer’s\nprocedure\n1.4.\nRun developed control circuits and PLC software\napplication program\n1.5.\nTested developed control circuits and PLC\nsoftware application\n1.6.\nDebugged and reworked PLC software application\nprogram\n1.7.\nPrepared a user-friendly documentation of the\ndeveloped control circuits and PLC software\napplication programs\n2. Method of assessment\n2.1.\nThe assessor may select two of the following\nassessment methods to objectively assess the\ncandidate:\n2.1.1. Practical Demonstration with Oral\nquestioning\n2.1.2. Written Examination\n2.1.3. Direct Observation with Oral questioning\n3. Resource Implication\n3.1.\nComputer hardware with peripherals\n3.2.\nSoftware application programs\n3.3.\nAppropriate control equipment\n3.4.\nMaterials\n4. Context of Assessment\n4.1.\nAssessment may be conducted in the workplace\nor in a simulated work process and procedures\n\n--- PDF PAGE 56 ---\nTESDA-SOP-QSO-01-F08\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – MECHATRONICS SERVICING NC III (Amended) Promulgated June 16, 2015\n\n Page 52\n\nUNIT TITLE : DEVELOP MOTION CONTROL AND SYSTEM CONFIGURATION\nUNIT CODE\n: ELC311304\nUNIT DESCRIPTOR:\nThis unit covers the knowledge, skills and attitudes needed to develop\nmotion control and system configuration in line with application\nrequirements and specifications. This includes competencies in\ndetermining motion control system requirements, developing and\nconfiguring motion control system, testing the developed motion control\nsystem and documenting motion control system being developed.\nELEMENT\n PERFORMANCE CRITERIA\nItalicized items are elaborated in\nthe range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Determine\nmotion control\nsystem\nrequirements\n1.1. Motion control system\nrequirements and design\ndata are obtained and\nclarified as needed for the\napplication.\n1.2. Input and output signals\nare identified according to\nsystem requirements\n1.3. Motion control system\nspecifications are identified\naccording to system\nrequirements.\n1.4. Motion control system\nrequirements are\ndocumented according to\nthe validated application.\n• Logic circuit analysis\nand development\no Sequential circuit\no Ladder circuit\n• Motion control\nelements\no Variable Frequency\nDrive (VFD)\no Servo motor\no Stepper motor\n• Operation process\nflowcharting and\napplication\n• Motion control system\ninput and output\nsignals\n• Reading skills\nrequired to\nunderstand work\ninstructions\n• Communication\nskills needed to\ncollect and\ninterchange\ninformation\n• Documentation\nskills\n• Analytical skills\n• Skills in computer\noperation\n\n2. Develop and\nconfigure\nmotion control\nsystem\n2.1. Motion control system\ndiagram is developed\naccording to application\nrequirements\n2.2. Motion control devices\nare integrated according to\nsystem diagram\n2.3. Motion control devices are\nconfigured according to\nsystem requirements\n• Computer Aided\nDesign\n• Software operation for\nsystem diagram\n• Motion control system\noperation\n• Functions and\napplications of motion\ncontrol devices\n• Motion control devices\ntechnical specifications\n• Reading skills\nrequired to\nunderstand work\ninstructions\n• Communication\nskills needed to\ncollect and\ninterchange\ninformation\n• Analytical skills\n• Skills in computer\noperation\n3. Test developed\nmotion control\nsystem\n3.1. Developed motion control\nsystem is run to ensure all\nconfiguration errors are\ncorrected.\n3.2. Any limits, exceptions and\nother aspects built into the\nmotion control system are\ntested against user’s\ncontrol requirements.\n3.3. Motion Control system is\ntested for user’s\nacceptance\n• Concepts of I/O types\n• Motion control\nconcepts and\napplications\n• Standard operating\nprocedures for testing\nmotion control system\n• Commissioning\nprocedures for motion\ncontrol system\n• Reading skills\nrequired to\nunderstand work\ninstructions\n• Communication\nskills needed to\ncollect and\ninterchange\ninformation\n• Analytical skills\n• Skills in computer\noperation\n\n--- PDF PAGE 57 ---\nTESDA-SOP-QSO-01-F08\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – MECHATRONICS SERVICING NC III (Amended) Promulgated June 16, 2015\n\n Page 53\n\nELEMENT\n PERFORMANCE CRITERIA\nItalicized items are elaborated in\nthe range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n4.\nDocument\nmotion control\nsystem\n4.1. Final motion control system\nflowchart is prepared\naccording to company\nstandards.\n4.2. Labels and comments\nare indicated into the\nmotion control system for\nuser–friendliness.\n4.3. Final revision of motion\ncontrol system external\ndevices assignment are\nprepared in softcopy and\nprinted formats\n\n• Tagging and labeling of\nmotion control system\ndevices\n• Compilation of softcopy\nand printed formats\n\n• Skills in computer\noperation\n• Documentation\nskills\n\n--- PDF PAGE 58 ---\nTESDA-SOP-QSO-01-F08\n---------------------------------------------------------------------------------------------------------------------------------