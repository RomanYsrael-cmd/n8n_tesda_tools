          "source_text": "2 1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Studied and selected appropriate technology\nconsistent with work requirements\n1.2 Applied relevant technology\n1.3 Maintained and enhanced operative ability of relevant\ntechnology\n2. Resource\nImplications\nThe following resources MUST be provided:\n2.1 Relevant technology\n2.2 Interview and demonstration questionnaires\n2.3 Assessment packages\n3. Methods of\nAssessment\nCompetency must be assessed through:\n3.1 Interview\n3.2 Actual demonstration\n3.3 Authenticated portfolio (related certificates of\ntraining/seminar)\n4. Context for\nAssessment\n4.1 Competency may be assessed in actual workplace or\nsimulated environment\n\n--- PDF PAGE 26 ---\nTESDA-SOP-QSO-01-F08\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – MECHATRONICS SERVICING NC III (Amended) Promulgated June 16, 2015\n\n Page 22\n\nCOMMON COMPETENCIES\n\nUNIT TITLE\n: USE HAND TOOLS\nUNIT CODE\n:"
