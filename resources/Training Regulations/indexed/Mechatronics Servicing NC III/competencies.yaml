        "evidence_guide": {
          "source_text": "1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1. Obtained and clarified motion control system\nrequirements and design data\n1.2. Identified input and output signals according to\nsystem requirements.\n1.3. Identified motion control system specification\naccording to system requirements\n1.4. Integrated motion control devices according to\nsystem diagram\n1.5. Developed and configured motion control\nsystem based on application requirements.\n1.6. Run developed motion control system to ensure\nall configuration errors are corrected.\n1.7. Tested any limits, exceptions and other aspects\nbuilt into the motion control system against\nuser’s control requirements.\n1.8. Prepared final motion control system flowchart\naccording to company standards.\n2. Method of assessment\n2.1. The assessor may select two of the following\nassessment methods to objectively assess the\ncandidate:\n2.1.1. Practical Demonstration with Oral\nquestioning\n2.1.2. Written Examination\n2.1.3. Direct Observation with Oral\nquestioning\n3. Resource Implication\n3.1. Computer hardware with peripherals\n3.2. Software application programs\n3.3. Appropriate control equipment\n3.4. Materials\n4. Context of Assessment\n4.1. Assessment may be conducted in the\nworkplace or in a simulated work process and\nprocedures\n\n--- PDF PAGE 60 ---\nTESDA-SOP-QSO-01-F08\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – MECHATRONICS SERVICING NC III (Amended) Promulgated June 16, 2015\n\n Page 56\n\nUNIT TITLE : MAINTAIN AND REPAIR PLC-BASED MECHATRONICS AND\nAUTOMATION SYSTEM\nUNIT CODE :"
        },
        "source_text": "ELC311304\nUNIT DESCRIPTOR:\nThis unit covers the knowledge, skills and attitudes needed to develop\nmotion control and system configuration in line with application\nrequirements and specifications. This includes competencies in\ndetermining motion control system requirements, developing and\nconfiguring motion control system, testing the developed motion control\nsystem and documenting motion control system being developed.\nELEMENT\n PERFORMANCE CRITERIA\nItalicized items are elaborated in\nthe range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Determine\nmotion control\nsystem\nrequirements\n1.1. Motion control system\nrequirements and design\ndata are obtained and\nclarified as needed for the\napplication.\n1.2. Input and output signals\nare identified according to\nsystem requirements\n1.3. Motion control system\nspecifications are identified\naccording to system\nrequirements.\n1.4. Motion control system\nrequirements are\ndocumented according to\nthe validated application.\n• Logic circuit analysis\nand development\no Sequential circuit\no Ladder circuit\n• Motion control\nelements\no Variable Frequency\nDrive (VFD)\no Servo motor\no Stepper motor\n• Operation process\nflowcharting and\napplication\n• Motion control system\ninput and output\nsignals\n• Reading skills\nrequired to\nunderstand work\ninstructions\n• Communication\nskills needed to\ncollect and\ninterchange\ninformation\n• Documentation\nskills\n• Analytical skills\n• Skills in computer\noperation\n\n2. Develop and\nconfigure\nmotion control\nsystem\n2.1. Motion control system\ndiagram is developed\naccording to application\nrequirements\n2.2. Motion control devices\nare integrated according to\nsystem diagram\n2.3. Motion control devices are\nconfigured according to\nsystem requirements\n• Computer Aided\nDesign\n• Software operation for\nsystem diagram\n• Motion control system\noperation\n• Functions and\napplications of motion\ncontrol devices\n• Motion control devices\ntechnical specifications\n• Reading skills\nrequired to\nunderstand work\ninstructions\n• Communication\nskills needed to\ncollect and\ninterchange\ninformation\n• Analytical skills\n• Skills in computer\noperation\n3. Test developed\nmotion control\nsystem\n3.1. Developed motion control\nsystem is run to ensure all\nconfiguration errors are\ncorrected.\n3.2. Any limits, exceptions and\nother aspects built into the\nmotion control system are\ntested against user’s\ncontrol requirements.\n3.3. Motion Control system is\ntested for user’s\nacceptance\n• Concepts of I/O types\n• Motion control\nconcepts and\napplications\n• Standard operating\nprocedures for testing\nmotion control system\n• Commissioning\nprocedures for motion\ncontrol system\n• Reading skills\nrequired to\nunderstand work\ninstructions\n• Communication\nskills needed to\ncollect and\ninterchange\ninformation\n• Analytical skills\n• Skills in computer\noperation\n\n--- PDF PAGE 57 ---\nTESDA-SOP-QSO-01-F08\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – MECHATRONICS SERVICING NC III (Amended) Promulgated June 16, 2015\n\n Page 53\n\nELEMENT\n PERFORMANCE CRITERIA\nItalicized items are elaborated in\nthe range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n4.\nDocument\nmotion control\nsystem\n4.1. Final motion control system\nflowchart is prepared\naccording to company\nstandards.\n4.2. Labels and comments\nare indicated into the\nmotion control system for\nuser–friendliness.\n4.3. Final revision of motion\ncontrol system external\ndevices assignment are\nprepared in softcopy and\nprinted formats\n\n• Tagging and labeling of\nmotion control system\ndevices\n• Compilation of softcopy\nand printed formats\n\n• Skills in computer\noperation\n• Documentation\nskills\n\n--- PDF PAGE 58 ---\nTESDA-SOP-QSO-01-F08\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – MECHATRONICS SERVICING NC III (Amended) Promulgated June 16, 2015\n\n Page 54\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Motion Control Devices\nInclude but not limited to:\n1.1.\nVariable Frequency Drive (VFD)\n1.2.\nStepper Motor\n1.3.\nServo Motor\n\n2. Input and Output signals\n2.1.\nAnalog\n2.2.\nDigital\n\n3. Labels and comments\nInclude but not limited to:\n5.1 Elements tagging\n5.2 Labeling\n5.3 Remarks and description\n\n--- PDF PAGE 59 ---\nTESDA-SOP-QSO-01-F08\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – MECHATRONICS SERVICING NC III (Amended) Promulgated June 16, 2015\n\n Page 55\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1. Obtained and clarified motion control system\nrequirements and design data\n1.2. Identified input and output signals according to\nsystem requirements.\n1.3. Identified motion control system specification\naccording to system requirements\n1.4. Integrated motion control devices according to\nsystem diagram\n1.5. Developed and configured motion control\nsystem based on application requirements.\n1.6. Run developed motion control system to ensure\nall configuration errors are corrected.\n1.7. Tested any limits, exceptions and other aspects\nbuilt into the motion control system against\nuser’s control requirements.\n1.8. Prepared final motion control system flowchart\naccording to company standards.\n2. Method of assessment\n2.1. The assessor may select two of the following\nassessment methods to objectively assess the\ncandidate:\n2.1.1. Practical Demonstration with Oral\nquestioning\n2.1.2. Written Examination\n2.1.3. Direct Observation with Oral\nquestioning\n3. Resource Implication\n3.1. Computer hardware with peripherals\n3.2. Software application programs\n3.3. Appropriate control equipment\n3.4. Materials\n4. Context of Assessment\n4.1. Assessment may be conducted in the\nworkplace or in a simulated work process and\nprocedures\n\n--- PDF PAGE 60 ---\nTESDA-SOP-QSO-01-F08\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – MECHATRONICS SERVICING NC III (Amended) Promulgated June 16, 2015\n\n Page 56\n\nUNIT TITLE : MAINTAIN AND REPAIR PLC-BASED MECHATRONICS AND\nAUTOMATION SYSTEM\nUNIT CODE :"
