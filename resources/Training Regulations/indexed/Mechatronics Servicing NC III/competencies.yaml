  "source_section_text": "SECTION 2:\nCOMPETENCY STANDARDS\n\nThis section gives the details of the contents of the basic, common, and core units\nof competency required for Mechatronics Servicing NC III.\n\nBASIC COMPETENCIES\n\nUNIT OF COMPETENCY : LEAD WORKPLACE COMMUNICATION\n\nUNIT CODE\n : 500311109\n\n UNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes required\nto lead in the dissemination and discussion of ideas,\ninformation and issues in the workplace.\n\nELEMENT\n PERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Communicate\ninformation\nabout\nworkplace\nprocesses\n1.1. Appropriate communication\nmethod is selected\n1.2. Multiple operations involving\nseveral topics areas are\ncommunicated accordingly\n1.3. Questions are used to gain\nextra information\n1.4. Correct sources of information\nare identified\n1.5. Information is selected and\norganized correctly\n1.6. Verbal and written reporting is\nundertaken when required\n1.7. Communication skills are\nmaintained in all situations\n• Organization\nrequirements for\nwritten and electronic\ncommunication\nmethods\n• Effective verbal\ncommunication\nmethods\n• Methods of\nCommunication\n• Types of Question\n• Communication Tools\n• Questioning\nTechniques\n• Organizing\ninformation\n• Understanding\nand conveying\nintended\nmeaning\n• Participating in\nvariety of\nworkplace\ndiscussions\n• Complying with\norganization\nrequirements for\nthe use of written\nand electronic\ncommunication\nmethods\n• Reporting\noccupational\nhazards during\nsafety meeting\n2. Lead\nworkplace\ndiscussions\n1.1. Response to workplace\nissues are sought\n1.2. Response to workplace\nissues are provided\nimmediately\n1.3. Constructive contributions are\nmade to workplace\ndiscussions on such issues as\nproduction, quality and safety\n1.4. Goals/objectives and action\nplan are undertaken in the\nworkplace are communicated\n• Leading as a\nmanagement function\n• Barriers of\ncommunication\n• Effective verbal\ncommunication\nmethods\n• Method/techniques of\ndiscussion\n• How to lead\ndiscussion\n• Communicating\neffectively\n• Consulting the\ncrew on the\nprepared menu\nfor the month\n\n--- PDF PAGE 7 ---\nTESDA-SOP-QSO-01-F08\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – MECHATRONICS SERVICING NC III (Amended) Promulgated June 16, 2015 3\n\nELEMENT\n PERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n• How to solicit\nresponse\n• Goal setting and\naction planning\n3. Identify and\ncommunicate\nissues arising\nin the\nworkplace\n3.1 Issues and problems are\nidentified as they arise\n3.2 Information regarding\nproblems and issues are\norganized coherently to\nensure clear and effective\ncommunication\n3.3 Dialogue is initiated with\nappropriate personnel\n3.4 Communication problems and\nissues are raised as they\narise\n\n• Types of issues and\nproblems in the\nworkplace\n• Written and electronic\ncommunication\nmethods\n• Communication\nbarriers affecting\nworkplace\ndiscussions\n• Identifying cause\nof problems\n• Identifying\nproblems and\nissues\n• Organizing\ninformation on\nproblems and\nissues\n• Relating\nproblems and\nissues in the\nworkplace\n\n--- PDF PAGE 8 ---\nTESDA-SOP-QSO-01-F08\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – MECHATRONICS SERVICING NC III (Amended) Promulgated June 16, 2015 4\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Methods of\ncommunication\n1.1. Non-verbal gestures\n1.2. Verbal\n1.3. Face to face\n1.4. Two-way radio\n1.5. Speaking to groups\n1.6. Using telephone\n1.7. Written\n1.8. Internet\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1.\nDealt with a range of communication/information at one\ntime\n1.2.\nMade constructive contributions in workplace issues\n1.3.\nSought workplace issues effectively\n1.4.\nResponded to workplace issues promptly\n1.5.\nPresented information clearly and effectively written form\n1.6.\nUsed appropriate sources of information\n1.7.\nAsked appropriate questions\n1.8.\nProvided accurate information\n2. Resource\nImplications\nThe following resources MUST be provided:\n2.1.\nVariety of Information\n2.2.\nCommunication tools\n2.3.\nSimulated workplace\n3. Methods of\nAssessment\nCompetency may be assessed through:\n3.1.\nCompetency in this unit must be assessed through\n3.2.\nDirect Observation\n3.3.\nInterview\n4. Context for\nAssessment\n4.1.\nCompetency may be assessed in the workplace or in\nsimulated workplace environment\n\n--- PDF PAGE 9 ---\nTESDA-SOP-QSO-01-F08\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – MECHATRONICS SERVICING NC III (Amended) Promulgated June 16, 2015 5\n\nUNIT OF COMPETENCY\n: LEAD SMALL TEAMS\nUNIT CODE\n : 500311110\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes to lead\nsmall teams including setting and maintaining team and\nindividual performance standards.\n\nELEMENT\n PERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Provide team\nleadership\n1.1. Work requirements are\nidentified and presented to\nteam members\n1.2. Reasons for instructions\nand requirements are\ncommunicated to team\nmembers\n1.3. Team members’ queries\nand concerns are\nrecognized, discussed and\ndealt with\n• Company policies and\nprocedures\n• How performance\nexpectations are set\n• Methods of Monitoring\nPerformance\n• Client expectations\n• Team member’s duties\nand responsibilities\n• Definition of Team\n• Skills and techniques in\npromoting team building\n• Up-to-date\ndissemination of\ninstructions and\nrequirements to\nmembers\n• Art of listening and\ntreating individual team\nmembers concern\n\n• Communication\nskills required\nfor leading\nteams\n• Team building\nskills\n• Negotiating\nskills\n• Evaluation skills\n2. Assign\nresponsibilities\n2.1 Duties and responsibilities\nare allocated having regard\nto the skills, knowledge and\naptitude required to properly\nundertake the assigned task\nand according to company\npolicy\n2.2 Duties are allocated having\nregard to individual\npreference, domestic and\npersonal considerations,\nwhenever possible\n• Concept of delegation\n• How to delegate\n• Understanding\nindividual differences\n• Methods of monitoring\nperformance\n• Duties and\nresponsibilities of each\nteam member\n• Knowledge in identifying\neach team member\nduties and\nresponsibilities\n\n• Delegating skills\n• Identifying\nindividual skills,\nknowledge and\nattitude as basis\nfor allocating\nresponsibilities\n• Identifying each\nteam member\nduties and\nresponsibilities\n3. Set\nperformance\nexpectations\nfor team\nmembers\n3.1 Performance expectations\nare established based on\nclient needs and according to\nassignment requirements\n3.2 Performance expectations\nare based on individual team\nmembers duties and area of\nresponsibility\n• Definition of\nperformance indicators/\ncriteria\n• Definition of team goals\nand expectations\n• Methods of monitoring\nperformance\n• Identifying\nperformance\nindicators\n• Evaluating\nperformance\n• Setting\nindividual\nperformance\n\n--- PDF PAGE 10 ---\nTESDA-SOP-QSO-01-F08\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – MECHATRONICS SERVICING NC III (Amended) Promulgated June 16, 2015 6\n\nELEMENT\n PERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n3.3 Performance expectations\nare discussed and\ndisseminated to individual\nteam members\n• Client expectations\n• Team members duties\nand responsibilities\n• Defining performance\nexpectations criteria\n\ntarget/\nexpectation\nindicators\n4. Supervised\nteam\nperformance\n4.1 Monitoring of performance\ntakes place against defined\nperformance criteria and/or\nassignment instructions and\ncorrective action taken if\nrequired\n4.2 Team members are provided\nwith feedback, positive\nsupport and advice on\nstrategies to overcome any\ndeficiencies\n4.3 Performance issues which\ncannot be rectified or\naddressed within the team\nare referenced to appropriate\npersonnel according to\nemployer policy\n4.4 Team members are kept\ninformed of any changes in\nthe priority allocated to\nassignments or tasks which\nmight impact on\nclient/customer needs and\nsatisfaction\n4.5 Team operations are\nmonitored to ensure that\nemployer/client needs and\nrequirements are met\n4.6 Follow-up communication is\nprovided on all issues\naffecting the team\n4.7 All relevant documentation is\ncompleted in accordance\nwith company procedures\n\n• Understanding\nMonitoring of work\n• How to undertake\ncorrective action\n• Understanding feedback\nand procedure\n• Feedback reporting\nprocedure\n• Methods of monitoring\nperformance\n• Team member’s duties\nand responsibilities\n• Monitoring team\noperation to ensure\nclient needs and\nsatisfaction\n• Monitoring skills\n• Setting priorities\n• Evaluating\nperformance\n• Informal/ formal\ncounseling skills\n\n--- PDF PAGE 11 ---\nTESDA-SOP-QSO-01-F08\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – MECHATRONICS SERVICING NC III (Amended) Promulgated June 16, 2015 7\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Work requirements\n1.1. Client Profile\n1.2. Assignment instructions\n2. Team member’s concerns\n2.1. Roster/shift details\n3. Monitor performance\n3.1. Formal process\n3.2. Informal process\n4. Feedback\n4.1. Formal process\n4.2. Informal process\n5. Performance issues\n5.1. Work output\n5.2. Work quality\n5.3. Team participation\n5.4. Compliance with workplace protocols\n5.5. Safety\n5.6. Customer service\n\n--- PDF PAGE 12 ---\nTESDA-SOP-QSO-01-F08\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – MECHATRONICS SERVICING NC III (Amended) Promulgated June 16, 2015 8\n\nEVIDENCE GUIDE\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1. Maintained or improved individuals and/or team\nperformance given a variety of possible scenario\n1.2. Assessed and monitored team and individual\nperformance against set criteria\n1.3. Represented concerns of a team and individual to next\nlevel of management or appropriate specialist and to\nnegotiate on their behalf\n1.4. Allocated duties and responsibilities, having regard to\nindividual’s knowledge, skills and aptitude and the needs\nof the tasks to be performed\n1.5. Set and communicated performance expectations for a\nrange of tasks and duties within the team and provided\nfeedback to team members\n2. Resource\nImplications\nThe following resources MUST be provided:\n2.1. Access to relevant workplace or appropriately simulated\nenvironment where assessment can take place\n2.2. Materials relevant to the proposed activity or task\n3. Methods of\nAssessment\nCompetency may be assessed through:\n3.1. Direct observations of work activities of the individual\nmember in relation to the work activities of the group\n3.2. Observation of simulation and/or role play involving the\nparticipation of individual member to the attainment of\norganizational goal\n3.3. Case studies and scenarios as a basis for discussion of\nissues and strategies in teamwork\n\n4. Context for\nAssessment\n4.1. Competency assessment may occur in workplace or any\nappropriately simulated environment\n4.2. Assessment shall be observed while task are being\nundertaken whether individually or in-group\n\n--- PDF PAGE 13 ---\nTESDA-SOP-QSO-01-F08\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – MECHATRONICS SERVICING NC III (Amended) Promulgated June 16, 2015 9\n\nUNIT OF COMPETENCY: DEVELOP AND PRACTICE NEGOTIATION SKILLS\n\nUNIT CODE : 500311111\n\nUNIT DESCRIPTOR : This unit covers the skills, knowledge and attitudes required to\ncollect information in order to negotiate to a desired outcome\nand participate in the negotiation.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1. Plan\nnegotiations\n1.1 Information on preparing\nfor negotiation is identified\nand included in the plan\n1.2 Information on creating\nnonverbal environments\nfor positive negotiating is\nidentified and included in\nthe plan\n1.3 Information on active\nlistening is identified and\nincluded in the plan\n1.4 Information on different\nquestioning techniques is\nidentified and included in\nthe plan\n1.5 Information is checked to\nensure it is correct and up-\nto- date\n\n• Knowledge on\nCodes of practice\nand guidelines for\nthe organization\n• Knowledge of\norganizations\npolicy and\nprocedures for\nnegotiations\n• Decision making\nand conflict\nresolution\nstrategies\nprocedures\n• Concept of\nnegotiation\n\n• Communication\nskills (verbal and\nlistening)\n• Active listening\n• Setting conflict\n• Preparing conflict\nresolution\n• Problem solving\nstrategies on how\nto deal with\nunexpected\nquestions and\nattitudes during\nnegotiation\n• Interpersonal skills\nto develop rapport\nwith other parties\n2. Participate in\nnegotiations\n2.1 Criteria for successful\noutcome are agreed upon\nby all parties\n2.2 Desired outcome of all\nparties are considered\n2.3 Appropriate language is\nused throughout the\nnegotiation\n2.4 A variety of questioning\ntechniques are used\n2.5 The issues and processes\nare documented and agreed\nupon by all parties\n2.6 Possible solutions are\ndiscussed and their viability\nassessed\n2.7 Areas for agreement are\nconfirmed and recorded\n2.8 Follow-up action is agreed\nupon by all parties\n\n• Outcome of\nnegotiation\n• Knowledge on\nLanguage\n• Different\nQuestioning\ntechniques\n• Problem solving\nstrategies on how\nto deal with\nunexpected\nquestions and\nattitudes during\nnegotiation\n\n• Negotiating skill\n• Communication\nskills (verbal and\nlistening)\n• Observation skills\n• Interpersonal skills\nto develop rapport\nwith other parties\n• Applying effective\nquestioning\ntechniques\n• Setting conflict\n\n--- PDF PAGE 14 ---\nTESDA-SOP-QSO-01-F08\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – MECHATRONICS SERVICING NC III (Amended) Promulgated June 16, 2015 10\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Preparing for\nnegotiation\n1.1\n\n1.2\n1.3\n1.4\n\n1.5\n\n1.6\nBackground information on other parties to the\nnegotiation\nGood understanding of topic to be negotiated\nClear understanding of desired outcome/s\nPersonal attributes\n1.4.1 self awareness\n1.4.2 self esteem\n1.4.3 objectivity\n1.4.4 empathy\n1.4.5 respect for others\nInterpersonal skills\n1.5.1 listening/reflecting\n1.5.2 non verbal communication\n1.5.3 assertiveness\n1.5.4 behavior labeling\n1.5.5 testing understanding\n1.5.6 seeking information\n1.5.7 self disclosing\nAnalytic skills\n1.6.1 observing differences between content and\nprocess\n1.6.2 identifying bargaining information\n