 \ninformation on \nproblems and \nissues \n Relating \nproblems and \nissues in the \nworkplace\n\n--- PDF PAGE 8 ---\nTESDA-SOP-QSO-01-F08 \n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ \nTR – MECHATRONICS SERVICING NC III (Amended)                Promulgated June 16, 2015                                                            4  \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Methods of \ncommunication \n1.1. Non-verbal gestures \n1.2. Verbal \n1.3. Face to face \n1.4. Two-way radio \n1.5. Speaking to groups \n1.6. Using telephone \n1.7. Written \n1.8. Internet \n \n \n \n \n \nEVIDENCE GUIDE \n \n1. Critical aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1. \nDealt with a range of communication/information at one \ntime \n1.2. \nMade constructive contributions in workplace issues \n1.3. \nSought workplace issues effectively \n1.4. \nResponded to workplace issues promptly \n1.5. \nPresented information clearly and effectively written form \n1.6. \nUsed appropriate sources of information \n1.7. \nAsked appropriate  questions \n1.8. \nProvided accurate information  \n2. Resource \nImplications \nThe following resources MUST be provided: \n2.1. \nVariety of Information \n2.2. \nCommunication tools \n2.3. \nSimulated workplace \n3. Methods of \nAssessment \nCompetency may be assessed through: \n3.1. \nCompetency in this unit must be assessed through \n3.2. \nDirect Observation \n3.3. \nInterview \n4. Context  for \nAssessment \n4.1. \nCompetency may be assessed in the workplace or in \nsimulated workplace environment\n",
