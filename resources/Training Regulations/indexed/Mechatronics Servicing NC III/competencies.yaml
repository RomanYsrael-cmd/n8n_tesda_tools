        "evidence_guide": {
          "source_text": "1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1. Maintained or improved individuals and/or team\nperformance given a variety of possible scenario\n1.2. Assessed and monitored team and individual\nperformance against set criteria\n1.3. Represented concerns of a team and individual to next\nlevel of management or appropriate specialist and to\nnegotiate on their behalf\n1.4. Allocated duties and responsibilities, having regard to\nindividual’s knowledge, skills and aptitude and the needs\nof the tasks to be performed\n1.5. Set and communicated performance expectations for a\nrange of tasks and duties within the team and provided\nfeedback to team members\n2. Resource\nImplications\nThe following resources MUST be provided:\n2.1. Access to relevant workplace or appropriately simulated\nenvironment where assessment can take place\n2.2. Materials relevant to the proposed activity or task\n3. Methods of\nAssessment\nCompetency may be assessed through:\n3.1. Direct observations of work activities of the individual\nmember in relation to the work activities of the group\n3.2. Observation of simulation and/or role play involving the\nparticipation of individual member to the attainment of\norganizational goal\n3.3. Case studies and scenarios as a basis for discussion of\nissues and strategies in teamwork\n\n4. Context for\nAssessment\n4.1. Competency assessment may occur in workplace or any\nappropriately simulated environment\n4.2. Assessment shall be observed while task are being\nundertaken whether individually or in-group\n\n--- PDF PAGE 13 ---\nTESDA-SOP-QSO-01-F08\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – MECHATRONICS SERVICING NC III (Amended) Promulgated June 16, 2015 9\n\nUNIT OF COMPETENCY: DEVELOP AND PRACTICE NEGOTIATION SKILLS\n\nUNIT CODE :"
        },
        "source_text": "500311110\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes to lead\nsmall teams including setting and maintaining team and\nindividual performance standards.\n\nELEMENT\n PERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Provide team\nleadership\n1.1. Work requirements are\nidentified and presented to\nteam members\n1.2. Reasons for instructions\nand requirements are\ncommunicated to team\nmembers\n1.3. Team members’ queries\nand concerns are\nrecognized, discussed and\ndealt with\n• Company policies and\nprocedures\n• How performance\nexpectations are set\n• Methods of Monitoring\nPerformance\n• Client expectations\n• Team member’s duties\nand responsibilities\n• Definition of Team\n• Skills and techniques in\npromoting team building\n• Up-to-date\ndissemination of\ninstructions and\nrequirements to\nmembers\n• Art of listening and\ntreating individual team\nmembers concern\n\n• Communication\nskills required\nfor leading\nteams\n• Team building\nskills\n• Negotiating\nskills\n• Evaluation skills\n2. Assign\nresponsibilities\n2.1 Duties and responsibilities\nare allocated having regard\nto the skills, knowledge and\naptitude required to properly\nundertake the assigned task\nand according to company\npolicy\n2.2 Duties are allocated having\nregard to individual\npreference, domestic and\npersonal considerations,\nwhenever possible\n• Concept of delegation\n• How to delegate\n• Understanding\nindividual differences\n• Methods of monitoring\nperformance\n• Duties and\nresponsibilities of each\nteam member\n• Knowledge in identifying\neach team member\nduties and\nresponsibilities\n\n• Delegating skills\n• Identifying\nindividual skills,\nknowledge and\nattitude as basis\nfor allocating\nresponsibilities\n• Identifying each\nteam member\nduties and\nresponsibilities\n3. Set\nperformance\nexpectations\nfor team\nmembers\n3.1 Performance expectations\nare established based on\nclient needs and according to\nassignment requirements\n3.2 Performance expectations\nare based on individual team\nmembers duties and area of\nresponsibility\n• Definition of\nperformance indicators/\ncriteria\n• Definition of team goals\nand expectations\n• Methods of monitoring\nperformance\n• Identifying\nperformance\nindicators\n• Evaluating\nperformance\n• Setting\nindividual\nperformance\n\n--- PDF PAGE 10 ---\nTESDA-SOP-QSO-01-F08\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – MECHATRONICS SERVICING NC III (Amended) Promulgated June 16, 2015 6\n\nELEMENT\n PERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n3.3 Performance expectations\nare discussed and\ndisseminated to individual\nteam members\n• Client expectations\n• Team members duties\nand responsibilities\n• Defining performance\nexpectations criteria\n\ntarget/\nexpectation\nindicators\n4. Supervised\nteam\nperformance\n4.1 Monitoring of performance\ntakes place against defined\nperformance criteria and/or\nassignment instructions and\ncorrective action taken if\nrequired\n4.2 Team members are provided\nwith feedback, positive\nsupport and advice on\nstrategies to overcome any\ndeficiencies\n4.3 Performance issues which\ncannot be rectified or\naddressed within the team\nare referenced to appropriate\npersonnel according to\nemployer policy\n4.4 Team members are kept\ninformed of any changes in\nthe priority allocated to\nassignments or tasks which\nmight impact on\nclient/customer needs and\nsatisfaction\n4.5 Team operations are\nmonitored to ensure that\nemployer/client needs and\nrequirements are met\n4.6 Follow-up communication is\nprovided on all issues\naffecting the team\n4.7 All relevant documentation is\ncompleted in accordance\nwith company procedures\n\n• Understanding\nMonitoring of work\n• How to undertake\ncorrective action\n• Understanding feedback\nand procedure\n• Feedback reporting\nprocedure\n• Methods of monitoring\nperformance\n• Team member’s duties\nand responsibilities\n• Monitoring team\noperation to ensure\nclient needs and\nsatisfaction\n• Monitoring skills\n• Setting priorities\n• Evaluating\nperformance\n• Informal/ formal\ncounseling skills\n\n--- PDF PAGE 11 ---\nTESDA-SOP-QSO-01-F08\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – MECHATRONICS SERVICING NC III (Amended) Promulgated June 16, 2015 7\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Work requirements\n1.1. Client Profile\n1.2. Assignment instructions\n2. Team member’s concerns\n2.1. Roster/shift details\n3. Monitor performance\n3.1. Formal process\n3.2. Informal process\n4. Feedback\n4.1. Formal process\n4.2. Informal process\n5. Performance issues\n5.1. Work output\n5.2. Work quality\n5.3. Team participation\n5.4. Compliance with workplace protocols\n5.5. Safety\n5.6. Customer service\n\n--- PDF PAGE 12 ---\nTESDA-SOP-QSO-01-F08\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – MECHATRONICS SERVICING NC III (Amended) Promulgated June 16, 2015 8\n\nEVIDENCE GUIDE\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1. Maintained or improved individuals and/or team\nperformance given a variety of possible scenario\n1.2. Assessed and monitored team and individual\nperformance against set criteria\n1.3. Represented concerns of a team and individual to next\nlevel of management or appropriate specialist and to\nnegotiate on their behalf\n1.4. Allocated duties and responsibilities, having regard to\nindividual’s knowledge, skills and aptitude and the needs\nof the tasks to be performed\n1.5. Set and communicated performance expectations for a\nrange of tasks and duties within the team and provided\nfeedback to team members\n2. Resource\nImplications\nThe following resources MUST be provided:\n2.1. Access to relevant workplace or appropriately simulated\nenvironment where assessment can take place\n2.2. Materials relevant to the proposed activity or task\n3. Methods of\nAssessment\nCompetency may be assessed through:\n3.1. Direct observations of work activities of the individual\nmember in relation to the work activities of the group\n3.2. Observation of simulation and/or role play involving the\nparticipation of individual member to the attainment of\norganizational goal\n3.3. Case studies and scenarios as a basis for discussion of\nissues and strategies in teamwork\n\n4. Context for\nAssessment\n4.1. Competency assessment may occur in workplace or any\nappropriately simulated environment\n4.2. Assessment shall be observed while task are being\nundertaken whether individually or in-group\n\n--- PDF PAGE 13 ---\nTESDA-SOP-QSO-01-F08\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – MECHATRONICS SERVICING NC III (Amended) Promulgated June 16, 2015 9\n\nUNIT OF COMPETENCY: DEVELOP AND PRACTICE NEGOTIATION SKILLS\n\nUNIT CODE :"
