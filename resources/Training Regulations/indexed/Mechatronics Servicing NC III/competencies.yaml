        "source_text": "ELC311209\n\nDESCRIPTON : This unit covers the knowledge, skills and attitudes required to\ntest electronic components. It includes competencies in\ndetermining the criteria for testing electronics components,\nplanning an approach for component testing, testing the\ncomponents and evaluating the testing process.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Determine\ncriteria for\ntesting\nelectronics\ncomponents\n1.1 Work instructions are\nobtained and clarified\nbased on job order or client\nrequirements\n1.2 Responsible person is\nconsulted for effective and\nproper work coordination\n1.3 Data sheets/Application\nnotes are obtained and\ninterpreted based on\nmanufacturer’s\nspecifications\n1.4 Testing criteria are\ndefined to ensure that\ncomponents meet technical\nand quality requirements\n1.5 Document and\ncommunicate testing\ncriteria to relevant\npersonnel\n• Mensuration/ Mathematics\no Conversion of Units\no Applied Mathematics\n• Safety\no Work Safety\nrequirements and\neconomy of materials\nwith durability\n• Systems and Processes\no Principles of\nelectrical/ electronic\ncircuits\no Identifying sources of\nelectricity\no Identifying conductors\nand insulators\no Supplying different\nvoltage using variable\npower supply\no Measuring resistance\nusing VOM\no Testing resistors\no Measuring current\nand voltage using\nVOM\n• Testing Criteria\no Controls\no Effectiveness\no Efficiency\no Bug detection\no Functionality,\nincluding flow\no Interoperability\no Performance\no Reliability\no Operating parameters\n\n• Work efficiently\n& systematically\n• Communication\nskills\n• Skills in testing\nelectronic\ncomponents\n• Work safety\npractices and\ntime\nmanagement\n• Reading skills\n\n--- PDF PAGE 47 ---\nTESDA-SOP-QSO-01-F08\n---------------------------------------------------------------------------------------------------------------------------