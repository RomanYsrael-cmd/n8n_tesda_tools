asuring\ninstruments and\ntools\n• Documentation\nskills\n3. Test\ncomponents\n3.1 Testing methods are\napplied to ensure that\nproducts meet creative,\nproduction and technical\nrequirements\n3.2 Problems and faults\ndetected by testing are\n• Safety\no Work Safety\nrequirements and\neconomy of materials\nwith durability\n• Materials, tools and\nequipment uses and\n• Skills in testing\nelectronic\ncomponents\n• Troubleshooting\nskills\n• Problem solving\n\n--- PDF PAGE 48 ---\nTESDA-SOP-QSO-01-F08\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – MECHATRONICS SERVICING NC III (Amended) Promulgated June 16, 2015\n\n Page 44\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED KNOWLEDGE\nREQUIRED\nSKILLS\nrecorded and remedial\nsteps taken in records\nsystem is documented\n3.3 Problems and faults\ndetected during testing are\nresolved in accordance\nwith agreed project or\nindustry practice\n3.4 Evaluate final products\nagainst the previously\ndetermined criteria\n3.5 Testing process is\ndocumented and\nsummarized evaluation\nreport is submitted to\nrelevant personnel\nspecifications\no Proper care and use of\ntools\n• Systems and Processes\no Principles of electrical/\nelectronic circuits\no Supplying different\nvoltage using variable\npower supply\no Measuring resistance\nusing VOM\no Testing resistors\no Measuring current and\nvoltage using VOM\no Observing waveform\nusing oscilloscope\no Generating waveform in\nvarious frequency using\nfunction generator\no Measuring frequency\nusing oscilloscope\no Measuring capacitance\nusing VOM\no Testing capacitors\no Testing inductors\no Testing semiconductor\ndiode\no Testing bipolar transistor\no Testing logic gates\nskills\n• Documentation\nskills\n• Work efficiently\n& systematically\n• Product\nanalysis and\nevaluation skills\n• Communication\nskills\n• Reading skills\n4. Evaluate the\ntesting\nprocess\n4.1 Testing methods that were\nsuccessful and those that\nled to difficulties are\nidentified based on industry\nstandards\n4.2 Testing process and\nrecords system are\nevaluated based on\nstandard procedures\n4.3 Test results/findings are\ndocumented for\nsubsequent components\ntesting.\n• Evaluation of testing\nprocess and records system\n• Systems and Processes\no Analyzing simple circuit\nusing ohms & power law\no Analyzing series/parallel\ncircuits using ohms and\npower law\no Analyzing series/parallel\ncapacitances\no analyzing series parallel\ninductors\no Analyzing rectifier\ncircuits\no Analyzing amplifier\ncircuit\no Analyzing multi-vibrator\ncircuit\no Analyzing logic networks\no Analyzing sequence\ncircuits\n• Work efficiently\n& systematically\n• Skills in testing\nelectronic\ncomponents\n• Product\nanalysis and\nevaluation skills\n• Documentation\nskills\n• Communication\nskills\n• Reading skills\n\n--- PDF PAGE 49 ---\nTESDA-SOP-QSO-01-F08\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – MECHATRONICS SERVICING NC III (Amended) Promulgated June 16, 2015\n\n Page 45\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Responsible person\nRelevant personnel may include:\n1.1. Immediate supervisor\n1.2. Manager\n2. Testing criteria\nTesting criteria may include:\n2.1. controls\n2.2. effectiveness\n2.3. efficiency\n2.4. bug detection\n2.5. functionality, including flow\n2.6. interoperability\n2.7. performance\n2.8. reliability\n2.9. operating parameters\n3. Testing methods\nTesting methods may include:\n3.1. automated\n3.2. debugging\n3.3. inspection\n3.4. platform testing\n3.5. prototyping\n4. Types of electronic\ncomponents\n4.1. Passive components\n4.2. Active components\n4.3. Dynamic components\n4.4. Hybrid components\n5. Testing strategy\nTesting strategy may be determined by:\n5.1. Passive testing\n5.2. Dynamic testing\n5.3. In-circuit testing\n6. Test and measuring\ninstruments\nTest and measuring instruments may include:\n6.1. Variable DC power supply\n6.2. Digital VOM\n6.3. analog VOM\n6.4. dual trace triggered oscilloscope\n6.5. function generator\n7. Tools\nTools may include:\n7.1. set of pliers\n7.2. set of screw drivers\n7.3. set of wrenches\n7.4. Hand drills,\n7.5. Hack saw\n7.6. set of files\n7.7. tin snip\n7.8. hammer\n\n--- PDF PAGE 50 ---\nTESDA-SOP-QSO-01-F08\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – MECHATRONICS SERVICING NC III (Amended) Promulgated June 16, 2015\n\n Page 46\n\nVARIABLE\nRANGE\n8. Records system\nRecords system may include:\n8.1. metadata that includes:\n8.1.1. description of fault\n8.1.2. identification of code\n8.1.3. user responses\n8.1.4. written or verbal comments\n8.1.5. quantitative data\n8.1.6. remedial action taken\n8.1.7. retest result\n8.1.8. date\n8.1.9. tester's details\n8.2. questionnaire\n8.3. survey\n\n--- PDF PAGE 51 ---\nTESDA-SOP-QSO-01-F08\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – MECHATRONICS SERVICING NC III (Amended) Promulgated June 16, 2015\n\n Page 47\n\nEVIDENCE GUIDE\n\n1\nCritical aspects of\ncompetency\n\nAssessment requires evidence that the candidate:\n1.1\nDetermined criteria for testing electronics components\n1.2\nPlanned an approach for component testing\n1.3\nTested components\n1.4\nEvaluated the testing process\n\n2 Method of\nassessment\n\nCompetency may be assessed through two or more of the\nfollowing methods:\n2.1\nDirect observation of application to tasks and questions\nrelated to required knowledge\n2.2\nDemonstration with oral questioning\n2.3\nThird party report\n2.4\nWritten test\n2.5\nPortfolio\n3 Resource\nimplications\n\nThe following resources must be provided:\n3.1\nTools and equipment (see range of variables)\n3.2\nWorking area/bench\n3.3\nElectronic components\n3.4\nTesting instruments and equipment\n3.5\nAssessment rating sheet\n3.6\nReporting forms\n4 Context of\nassessment\n4.1\nAssessment maybe conducted in the workplace or in a\nsimulated workplace setting\n\n--- PDF PAGE 52 ---\nTESDA-SOP-QSO-01-F08\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – MECHATRONICS SERVICING NC III (Amended) Promulgated June 16, 2015\n\n Page 48\n\nCORE COMPETENCIES\n\nUNIT TITLE : DEVELOP MECHATRONICS AND AUTOMATION CONTROL\nCIRCUITS AND PLC APPLICATION PROGRAMS\n\nUNIT CODE\n:"
