        "source_text": "ELC311305\nUNIT DESCRIPTOR:\nThis unit covers the knowledge, skills and attitudes needed to\nmaintain & repair PLC-based mechatronics and automation system.\nThis includes competencies in planning and preparing for\nmaintenance\nand\nrepair\nof\nPLC-based\nmechatronics\nand\nautomation system, maintaining mechatronics and automation\nsystem, repairing mechatronics and automation system, and\ninspecting and testing mechatronics system.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized items are elaborated in\nthe Range of Variables\nREQUIRED KNOWLEDGE\nREQUIRED SKILLS\n1. Plan and\nprepare for\nmaintenance\nand repair of\nPLC-based\nmechatronics\nand\nautomation\nsystem\n1.1. Maintenance and repair is\nplanned and prepared in\nline with job requirements.\n1.2. OHS policies and\nprocedures are followed in\nline with job requirements.\n1.3. Mechatronics and\nautomation devices for\nmaintenance or repair are\nchecked against\nspecifications and\nrequirements.\n1.4. Materials necessary to\ncomplete the work are\nobtained in accordance\nwith established\nprocedures and checked\nagainst job requirements.\n1.5. Tools, equipment and\ntesting devices needed\nfor the maintenance/repair\nare obtained and checked\nfor correct operation and\nsafety\n1.6. Mechatronics and\nautomation system to be\nmaintained or repaired are\nidentified from the job\ninstructions\n1.1. PLC-based\nmechatronics and\nautomation system\nmaintenance\nprocedures\n1.2. Occupational health\nand safety standards\n1.3. Mechatronics devices\nspecifications\n1.4. Materials planning and\nworkflow\n1.5. Testing procedures of\nequipment and devices\n1.6. Proper use of tools\n1.7. Maintenance and repair\ninstruction manuals\n1.1. Reading skills\nrequired to\nunderstand\nwork\ninstructions\n1.2. Communication\nskills needed to\ncollect and\ninterchange\ninformation\n1.3. Analytical skills\n1.4. Skills in\ncomputer\noperation\n1.5. Planning skills\n\n2. Maintain\nmechatronics\nand\nautomation\nsystem\n2.1. Appropriate personal\nprotective equipment is\nused and OHS policies &\nprocedures are followed\n2.2. Normal functions of the\nmechatronics and\nautomation devices are\nchecked in accordance\nwith manufacturer’s\ninstructions.\n2.1 Uses of personal\nprotective equipment\n(PPE)\n2.2 Principles of 5S\n2.3 Functions and\napplications of\nmechatronics and\nautomation devices\n2.4 Understanding of\npreventive\n2.1 Reading skills\nrequired to\nunderstand\nwork\ninstructions\n2.2 Communication\nskills needed to\ncollect and\ninterchange\ninformation\n\n--- PDF PAGE 61 ---\nTESDA-SOP-QSO-01-F08\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – MECHATRONICS SERVICING NC III (Amended) Promulgated June 16, 2015\n\n Page 57\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized items are elaborated in\nthe Range of Variables\nREQUIRED KNOWLEDGE\nREQUIRED SKILLS\n2.3. Scheduled/periodic\nmaintenance is performed\nin accordance with\nmanufacturer’s & company\nrequirements.\n2.4. Unplanned events or\nconditions are responded\nto in accordance with\nestablished procedures\nmaintenance checklist\n2.5 Use of tools\n2.6 Use of test equipment/\ninstruments\n2.7 Knowledge &\ninterpretation of\nmanufacturer’s/\ncompany preventive\nmaintenance\nrequirements\n2.8 Out-of-control action\nplan (OCAP)\n2.3 Analytical skills\n2.4 Problem solving\nskills\n3. Repair\nmechatronics\nand\nautomation\nsystem\n3.1. Appropriate personal\nprotective equipment is\nused and OHS policies &\nprocedures are followed\n3.2. Normal function of\nmechatronics and\nautomation system are\nchecked in accordance\nwith manufacturer’s\ninstructions.\n3.3. Fault or problem in\ncomponent is diagnosed\nand corrected in line with\nthe standard operating\nprocedures.\n3.4. Unplanned events or\nconditions are responded\nto in accordance with\nestablished procedures\n3.1 Principles of 3R’s\n3.2 Environmental Safety\n• Waste Segregation\n3.3 Fault finding on control\ncircuits\n• Electro-mechanical\n• Pneumatic &\nelectro-pneumatic\n• Hydraulic and\nelectro-hydraulic\n• Electronic logic\n3.4 Mechatronics and\nautomation devices\nspecifications\n3.1 Reading skills\nrequired to\nunderstand\nmanufacturers\nspecification\n3.2 Analytical skills\n3.3 Problem solving\nskills\n3.4 Troubleshooting\nskills\n\n4. Inspect and\ntest\nmechatronics\nand\nautomation\nsystem\n4.1 Mechatronics and\nautomation system are\nchecked to ensure safe\noperation.\n4.2 Final inspection and testing\nare undertaken according\nto manufacturer’s\ninstructions.\n4.3 Work site is cleaned and\ncleared of all debris and\nleft in safe condition in\naccordance with company\nprocedures.\n4.4 Report is prepared in\naccordance with company\nrequirements.\n4.1 Mechatronics and\nautomation devices\nconfiguration\n4.2 Final inspection and\ntesting\n procedures\n• Visual Inspection\n• Functional\ninspection\n4.3 Applicable technical\nreports\n• Commissioning\n• Inspection\n• Testing\n• Operation\n4.4 Office software\napplication\n• Word\n•Excel\n4.1 Reading skills\nrequired to\nunderstand\nmanufacturers\nspecification\n4.2 Problem solving\nskills\n4.3 Documentation\nSkills\n4.4 Skills in\ncomputer\noperation\n\n--- PDF PAGE 62 ---\nTESDA-SOP-QSO-01-F08\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – MECHATRONICS SERVICING NC III (Amended) Promulgated June 16, 2015\n\n Page 58\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. OH & S policies and procedures\n1.1.\nOH & S guidelines\n1.2.\nPhilippine environmental standards\n1.3.\nOSHE standards\n2. Mechatronics and automation\ndevices\nInclude the following but not limited to:\n•\nServo & Stepper Motors\n•\nFrequency drives\n•\nActuators\n•\nBuzzers\n•\nIndicating Lamps\n•\nLimit switches\n•\nMagnetic contactors\n•\nPhoto-sensors\n•\nProximity sensors\n•\nDirectional solenoid valves\n3. Materials\nInclude the following but not limited to:\n3.1.\nConnectors\n3.2.\nAdaptors\n3.3.\nFittings and tube\n3.4.\nRags\n\n4. Tools\nInclude the following but not limited to:\n4.1.\nPliers; assorted\n4.2.\nScrewdrivers; assorted\n4.3.\nSoldering iron\n5. Test equipment/instruments\n5.1.\nMulti-tester\n• Digital\n• Analog\n5.2.\nProgramming device (PC/ Laptop)\n6. Personal protective equipment\n6.1.\nSafety hat\n6.2.\nSafety shoes\n6.3.\nEar muffs\n6.4.\nGoggles\n6.5.\nSafety\nbelt/Harness\n6.6.\nGloves\n6.7.\nMask\n\n--- PDF PAGE 63 ---\nTESDA-SOP-QSO-01-F08\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – MECHATRONICS SERVICING NC III (Amended) Promulgated June 16, 2015\n\n Page 59\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1. Checked mechatronics devices for\nmaintenance and repair against specification\nand requirements\n1.2. Identified mechatronics devices to be\nmaintained or repaired from the job\ninstructions\n1.3. Conducted test accurately on the\nmechatronics and automation devices using\nstandard procedures\n1.4. Diagnosed faults on the mechatronics and\nautomation devices/system\n1.5. Repaired or replaced defective mechatronics\nand automation devices\n1.6. Inspected/checked and tested repaired\nmechatronics and automation system to\nensure safety\n1.7. Prepared report in accordance with the\ncompany requirements\n2. Method of assessment\n2.1. The assessor may select two of the following\nassessment methods to objectively assess\nthe candidate:\n2.1.1. Demonstration with oral questioning\n2.1.2. Direct observation with oral\nquestioning\n2.1.3. Written Examination\n3. Resource Implication\n3.1. Tools\n3.2. Test equipment/instruments\n3.3. Mechatronic devices\n3.4. Materials\n3.5. PPE\n3.6. Technical manuals\n4. Context of Assessment\n4.1. Assessment may be conducted in the\nworkplace or in a simulated environment\n\n--- PDF PAGE 64 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – MECHATRONICS SERVICING NC III (Amended) Promulgated June 16, 2015\n\n Page 60"
