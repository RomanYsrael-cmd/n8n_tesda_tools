and\nequipment\n5.2 Perform basic\npreventive\nmaintenance\n5.3 Sharpen edge and\ntooth cutting tools\n5.4 Store tools and\nequipment\nAudio Visual\nSimulation\nDiscussion\nPractical Lab\nDemonstration\n• Direct observation\nof application of\ntasks\n• Oral questioning\n• Written test or\nexamination\n• Third party report\n• Demonstration\n\n--- PDF PAGE 66 ---\nTR HEAVY-EQUIPMENT OPERATION (Truck-Mounted Crane) NC II Promulgated December 2004/July 2007\n65 / 79\n\nCORE COMPETENCIES\n\nCourse Title\n: HEAVY EQUIPMENT OPERATION Level:\n\n TRUCK-MOUNTED CRANE\n\nNominal Training Hours:\n120 Hours\n\nCourse Description:\n\nThis course is designed to enhance the knowledge, desirable attitudes\nand skills in the use of truck-mounted crane in accordance with industry\nstandards. It covers the core competencies of: perform pre- and post operation\nprocedure, perform productive operation, and perform basic preventive-\nmaintenance servicing on a given truck-mounted crane.\n\nTo obtain this, all units prescribed for this qualification must be achieved:\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Perform pre- and\npost-operation\n procedure for\nTruck-mounted\nCrane\n1.1 Identify truck-mounted\ncrane types /\ncomponents parts\n1.2 Perform visual check of\nequipment\n1.3 Check BLOWAF of\ntruck-mounted crane\n1.3.1 Battery\n1.3.2 Light\n1.3.3 Oil\n1.3.4 Water\n1.3.5 Air\n1.3.6 Fuel\n1.4 Check truck-mounted\ncrane systems\noperation\n1.5 Check safety devices\n& accessories\n1.6 Perform post operation\ncheck\nLecture\nPractical /\nDemonstration\n\n• Observation /\nDemonstration\nand interview\n• Written test\n\n--- PDF PAGE 67 ---\nTR HEAVY-EQUIPMENT OPERATION (Truck-Mounted Crane) NC II Promulgated December 2004/July 2007\n66 / 79\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n2. Perform productive\noperation for Truck\n Mounted Crane\n\n2.1 Perform loading\n and unloading of\n truck-mounted\n crane to\n trailer (low bed)\n4.2 Perform truck\n mounted crane\n application\nLecture\nPractical /\nDemonstration\n\n• Observation /\nDemonstration\nand interview\n• Written test\n\n3. Perform basic\n preventive\n maintenance\nservicing for Truck\nMounted Crane\n4.1 Perform safety\npractices, and\nhousekeeping\n4.2 Perform preventive\nmaintenance and\nservicing\nLecture\nPractical /\nDemonstration\n\n• Observation /\nDemonstration\nand interview\n• Written test\n\n--- PDF PAGE 68 ---\nTR HEAVY-EQUIPMENT OPERATION (Truck-Mounted Crane) NC II Promulgated December 2004/July 2007\n67 / 79\n\n3.2\nTRAINING DELIVERY\n\nThe delivery of training should adhere to the design of the curriculum.\nDelivery should be guided by the 10 basic principles of competency-based TVET.\n\n• The training is based on curriculum developed from the\ncompetency standards;\n• Learning is modular in its structure;\n• Training delivery is individualized and self-paced;\n• Training is based on work that must be performed;\n• Training materials are directly related to the competency standards\nand the curriculum modules;\n• Assessment is based in the collection of evidence of the\nperformance of work to the industry required standard;\n• Training is based both on and off-the-job components;\n• Allows for recognition of prior learning (RPL) or current\ncompetencies;\n• Training allows for multiple entry and exit; and\n• Approved training programs are nationally accredited.\n\nThe competency-based TVET system recognizes various types of delivery\nmodes, both on and off-the-job as long as the learning is driven by the\ncompetency standards specified by the industry. The following training modalities\nmay be adopted when designing training programs:\n\n• The dualized mode of training delivery is preferred and\nrecommended. Thus programs would contain both in-school and in-\nindustry training or fieldwork components. Details can be referred to\nthe Dual Training System (DTS) Implementing Rules and\nRegulations.\n• Modular/self-paced learning is a competency-based training\nmodality wherein the trainee is allowed to progress at his own pace.\nThe trainer facilitates the training delivery\n• Peer teaching/mentoring is a training modality wherein fast learners\nare given the opportunity to assist the slow learners.\n• Supervised industry training or on-the-job training is an approach in\ntraining designed to enhance the knowledge and skills of the\ntrainee through actual experience in the workplace to acquire\nspecific competencies prescribed in the training regulations.\n• Distance learning is a formal education process in which majority of\nthe instruction occurs when the students and instructor are not in\n\n--- PDF PAGE 69 ---\nTR HEAVY-EQUIPMENT OPERATION (Truck-Mounted Crane) NC II Promulgated December 2004/July 2007\n68 / 79\n\nthe same place. Distance learning may employ correspondence\nstudy, or audio, video or computer technologies.\n\n3.3\n TRAINEE ENTRY REQUIREMENTS\n\nThis section specifies the qualifications of trainees and educational\nexperience. Other requirements like health and physical requirements may also\nbe included. Passing written entrance examinations may also be indicated if\nnecessary.\n\n• Can communicate both orally and in writing\n\n• Physically and mentally fit\n\n• With good moral character\n\n• Can perform basic mathematical computation.\n\n3.4\nLIST OF TOOLS, EQUIPMENT AND MATERIALS\n\n--- PDF PAGE 70 ---\nTR HEAVY-EQUIPMENT OPERATION (Truck-Mounted Crane) NC II Promulgated December 2004/July 2007\n69 / 79\n\nRecommended list of tools, equipment and materials for the training of 25\ntrainees for the operation for truck-mounted crane.\n\nTOOLS\nEQUIPMENT\nMATERIALS\nQTY\nQTY\nQTY\n1 set\n• Wrenches (box\nand open-end 8-\n24 mm- metric &\n7/16 –1” -English )\n1 unit\n• Truck-mounted\ncrane(MOA /\nrental)\n5 kls\n• Multi-\npurpose\ngrease\n1 set\n• Hammer ballpeen\n(3-4 lbs)\n\n4 liters\n• Engine oil (\nSAE 15w40)\n1 set\n• Pliers (\nmechanical 10 “)\n1 