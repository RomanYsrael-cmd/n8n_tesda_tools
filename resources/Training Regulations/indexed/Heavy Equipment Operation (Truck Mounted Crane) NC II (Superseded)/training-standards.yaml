    "source_text": "SECTION 3 TRAINING STANDARDS\n\nThese guidelines are set to provide the Technical and Vocational\nEducation and Training (TVET) providers with information and other important\nrequirements to consider when designing training programs for HEAVY-\nEQUIPMENT OPERATION (Truck-Mounted Crane) NC II.\n\n 3.1 CURRICULUM DESIGN\n\nCourse Title : HEAVY EQUIPMENT OPERATION - TRUCK-MOUNTED\n CRANE\nNC Level: II\n\nBASIC COMPETENCIES\nNominal Training Hours:\n18 Hours (Basic) + 18 Hours (Common)\nCourse Description:\n\nThis course is designed to equip individuals with the basic, common and\ncore competencies in Construction Sector particularly in Heavy Equipment\nOperation (Truck-Mounted Crane).\n\nTo obtain this, all units prescribed for this qualification must be achieved:\n\nBASIC COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and convey\nworkplace information.\n1.2 Complete relevant work\n related documents\n1.3 Participate in\nworkplace meeting and\ndiscussion.\nGroup\ndiscussion\nInteraction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n1. Work in a team\n environment\n2.1 Describe and identify\nteam role and\nresponsibility in a team.\n2.2 Describe work as a team\nmember.\nDiscussion\nInteraction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n\n--- PDF PAGE 63 ---\nTR HEAVY-EQUIPMENT OPERATION (Truck-Mounted Crane) NC II Promulgated December 2004/July 2007\n62 / 79\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n3. Practice career\nprofessionalism\n3.1 Integrate personal\nobjectives with\norganizational goals.\n3.2 Set and meet work\npriorities.\n3.3 Maintain professional\ngrowth and development.\nDiscussion\nInteraction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n4. Practice\noccupational\nhealth and safety\n4.1 Evaluate hazard and\nrisks\n4.2 Control hazards and risks\n4.3 Maintain occupational\nhealth and safety\nawareness\nDiscussion\nPlant tour\nSymposium\n• Observation\n• Interview\n\n--- PDF PAGE 64 ---\nTR HEAVY-EQUIPMENT OPERATION (Truck-Mounted Crane) NC II Promulgated December 2004/July 2007\n63 / 79\n\nCOMMON COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Prepare\nconstruction\nmaterials and\ntools\n1.8 Identify Materials\n1.9 Requisition\nMaterials\n1.10 Receive and\ninspect materials\nAudio Visual\nsimulation\nDiscussion\nPractical\nexercise\nDemonstration\n• Direct observation\n• Questions or\ninterview\n• Portfolio\n(credentials)\n• Written / Oral Test\n•\nDemonstration\n2. Observe\nprocedures,\nSpecifications\nand Manuals of\nInstructions\n2.1 Identify and access\nspecification/\nmanuals\nAudio Visual\nSimulation\nDiscussion\nPractical Lab\nDemonstration\n• Direct observation\n• Oral questioning\n• Written test or\nexamination\n• Third party report\n• Demonstration\n(able to impart\nknowledge and\nskills)\n3. Interpret\nTechnical\nDrawing\n3.1 Analyze sign,\nsymbols and data\n3.2 Interpret technical\ndrawing and plans\n3.3 Apply freehand\nsketching\nAudio Visual\nSimulation\nDiscussion\nPractical Lab\nDemonstration\n• Direct observation\n• Oral questioning\n• Written test or\nexamination\n• Third party report\n• Demonstration\n(able to impart\nknowledge and\nskills)\n4. Perform\nmensurations\nand calculation\n4.1 Select measuring\ninstruments\n4.2 Carry out\nmeasurements\nand calculations\nAudio Visual\nSimulation\nDiscussion\nPractical Lab\nDemonstration\n• Direct observation\n• Oral questioning\n• Written test or\nexamination\n• Third party report\n• Demonstration\n(able to impart\nknowledge and\nskills)\n\n--- PDF PAGE 65 ---\nTR HEAVY-EQUIPMENT OPERATION (Truck-Mounted Crane) NC II Promulgated December 2004/July 2007\n64 / 79\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n5. Maintain tools\nand equipment\n5.1 Check condition of\ntools and\nequipment\n5.2 Perform basic\npreventive\nmaintenance\n5.3 Sharpen edge and\ntooth cutting tools\n5.4 Store tools and\nequipment\nAudio Visual\nSimulation\nDiscussion\nPractical Lab\nDemonstration\n• Direct observation\nof application of\ntasks\n• Oral questioning\n• Written test or\nexamination\n• Third party report\n• Demonstration\n\n--- PDF PAGE 66 ---\nTR HEAVY-EQUIPMENT OPERATION (Truck-Mounted Crane) NC II Promulgated December 2004/July 2007\n65 / 79\n\nCORE COMPETENCIES\n\nCourse Title\n: HEAVY EQUIPMENT OPERATION Level:\n\n TRUCK-MOUNTED CRANE\n\nNominal Training Hours:\n120 Hours\n\nCourse Description:\n\nThis course is designed to enhance the knowledge, desirable attitudes\nand skills in the use of truck-mounted crane in accordance with industry\nstandards. It covers the core competencies of: perform pre- and post operation\nprocedure, perform productive operation, and perform basic preventive-\nmaintenance servicing on a given truck-mounted crane.\n\nTo obtain this, all units prescribed for this qualification must be achieved:\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Perform pre- and\npost-operation\n procedure for\nTruck-mounted\nCrane\n1.1 Identify truck-mounted\ncrane types /\ncomponents parts\n1.2 Perform visual check of\nequipment\n1.3 Check BLOWAF of\ntruck-mounted crane\n1.3.1 Battery\n1.3.2 Light\n1.3.3 Oil\n1.3.4 Water\n1.3.5 Air\n1.3.6 Fuel\n1.4 Check truck-mounted\ncrane systems\noperation\n1.5 Check safety devices\n& accessories\n1.6 Perform post operation\ncheck\nLecture\nPractical /\nDemonstration\n\n• Observation /\nDemonstration\nand interview\n• Written test\n\n--- PDF PAGE 67 ---\nTR HEAVY-EQUIPMENT OPERATION (Truck-Mounted Crane) NC II Promulgated December 2004/July 2007\n66 / 79\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n2. Perform productive\noperation for Truck\n Mounted Crane\n\n2.1 Perform loading\n and unloading of\n truck-mounted\n crane to\n trailer (low bed)\n4.2 Perform truck\n mounted crane\n application\nLecture\nPractical /\nDemonstration\n\n• Observation /\nDemonstration\nand interview\n• Written test\n\n3. Perform basic\n preventive\n maintenance\nservicing for Truck\nMounted Crane\n4.1 Perform safety\npractices, and\nhousekeeping\n4.2 Perform preventive\nmaintenance and\nservicing\nLecture\nPractical /\nDemonstration\n\n• Observation /\nDemonstration\nand interview\n• Written test\n\n--- PDF PAGE 68 ---\nTR HEAVY-EQUIPMENT OPERATION (Truck-Mounted Crane) NC II Promulgated December 2004/July 2007\n67 / 79\n\n3.2\nTRAINING DELIVERY\n\nThe delivery of training should adhere to the design of the curriculum.\nDelivery should be guided by the 10 basic principles of competency-based TVET.\n\n• The training is based on curriculum developed from the\ncompetency standards;\n• Learning is modular in its structure;\n• Training delivery is individualized and self-paced;\n• Training is based on work that must be performed;\n• Training materials are directly related to the competency standards\nand the curriculum modules;\n• Assessment is based in the collection of evidence of the\nperformance of work to the industry required standard;\n• Training is based both on and off-the-job components;\n• Allows for recognition of prior learning (RPL) or current\ncompetencies;\n• Training allows for multiple entry and exit; and\n• Approved training programs are nationally accredited.\n\nThe competency-based TVET system recognizes various types of delivery\nmodes, both on and off-the-job as long as the learning is driven by the\ncompetency standards specified by the industry. The following training modalities\nmay be adopted when designing training programs:\n\n• The dualized mode of training delivery is preferred and\nrecommended. Thus programs would contain both in-school and in-\nindustry training or fieldwork components. Details can be referred to\nthe Dual Training System (DTS) Implementing Rules and\nRegulations.\n• Modular/self-paced learning is a competency-based training\nmodality wherein the trainee is allowed to progress at his own pace.\nThe trainer facilitates the training delivery\n• Peer teaching/mentoring is a training modality wherein fast learners\nare given the opportunity to assist the slow learners.\n• Supervised industry training or on-the-job training is an approach in\ntraining designed to enhance the knowledge and skills of the\ntrainee through actual experience in the workplace to acquire\nspecific competencies prescribed in the training regulations.\n• Distance learning is a formal education process in which majority of\nthe instruction occurs when the students and instructor are not in\n\n--- PDF PAGE 69 ---\nTR HEAVY-EQUIPMENT OPERATION (Truck-Mounted Crane) NC II Promulgated December 2004/July 2007\n68 / 79\n\nthe same place. Distance learning may employ correspondence\nstudy, or audio, video or computer technologies.\n\n3.3\n TRAINEE ENTRY REQUIREMENTS\n\nThis section specifies the qualifications of trainees and educational\nexperience. Other requirements like health and physical requirements may also\nbe included. Passing written entrance examinations may also be indicated if\nnecessary.\n\n• Can communicate both orally and in writing\n\n• Physically and mentally fit\n\n• With good moral character\n\n• Can perform basic mathematical computation.\n\n3.4\nLIST OF TOOLS, EQUIPMENT AND MATERIALS\n\n--- PDF PAGE 70 ---\nTR HEAVY-EQUIPMENT OPERATION (Truck-Mounted Crane) NC II Promulgated December 2004/July 2007\n69 / 79\n\nRecommended list of tools, equipment and materials for the training of 25\ntrainees for the operation for truck-mounted crane.\n\nTOOLS\nEQUIPMENT\nMATERIALS\nQTY\nQTY\nQTY\n1 set\n• Wrenches (box\nand open-end 8-\n24 mm- metric &\n7/16 –1” -English )\n1 unit\n• Truck-mounted\ncrane(MOA /\nrental)\n5 kls\n• Multi-\npurpose\ngrease\n1 set\n• Hammer ballpeen\n(3-4 lbs)\n\n4 liters\n• Engine oil (\nSAE 15w40)\n1 set\n• Pliers (\nmechanical 10 “)\n1 unit\n• Vacuum cleaner\n20 liters • Hydraulic /\nsteering\nfluid\n(TELLUS\n68/10W)\n1 pc\n\n• Adjustable wrench\n(18 “)\n1 unit\n• Portable electric\nair compressor\n10 liters • PTO /\ndifferential\nand transfer\ncase drive\n(gear oil\nGP90/ 140)\n1 pc\n• Grease gun\n\n10 liters • Automatic\nTrans-\nmission oil\n(ATF)\n1 set\n• Screw driver ( 10 “\nflat &\n Philips)\n\n10 liters • Manual\ntransmission\noil GP\n90/140\n1 pc\n• Putty knife\n\n4 liters\n• Water\ncoolant\n1 pc\n• Pry bar (heavy\nduty)\n\n200\nliters\n• Diesel fuel\n1 pc\n• Tire gauge (0-150\npsi)\n\n5 liters\n• Battery\n distilled\n water\n\n--- PDF PAGE 71 ---\nTR HEAVY-EQUIPMENT OPERATION (Truck-Mounted Crane) NC II Promulgated December 2004/July 2007\n70 / 79\n\nTOOLS\nEQUIPMENT\nMATERIALS\nQTY\nQTY\nQTY\n\n1 set\n• Primary &\nsecondary air\nfilter,\n\n1 pair\n• Working\n clothes\n\n10\npairs\n• Safety shoes\n\n10\npairs\n• Gloves\n\n10\npcs\n• Goggles\n\n10\npcs\n• Dust Mask\n\n10\npcs\n• Hard hat\n\n2\nunits\n• Test weights\n- 3 tons\n - 10 tons\n\n1 pc\n• Truck-\nmounted\ncrane\nminiature\n\n1 pc\n• Operator’s\nmanual with\nload chart\n\n--- PDF PAGE 72 ---\nTR HEAVY-EQUIPMENT OPERATION (Truck-Mounted Crane) NC II Promulgated December 2004/July 2007\n71 / 79\n\n3.5\nTRAINING FACILITIES\n\nThe truck-mounted crane operation workshop must be of concrete\nstructure. Based on class size of 25 students/trainees the space requirements\nfor the teaching/learning and circulation areas are as follows:\n\nSPACE REQUIREMENT\nSIZE IN METERS\nAREA IN SQ.\nMETERS\nTOTAL AREA\nIN SQ.\nMETERS\n• Student/Trainee’s Working\nSpace\n 2.0 x 2.0 meters\n4 sq.m per\nstudent\n100.0 sq.m.\n•\nLecture Room\n8.00 x 6.00\n48.00\n48.0\n•\nLearning Resource Center\n4.00 x 6.00\n24.00\n24.0\n•\n\n172\n• Facilities/Equipment/\nCirculation Area\n-\n-\n52\nTOTAL WORK AREA\n-\n224\nWorking field\n0.25 hectare (MOA/Rental)\n\n--- PDF PAGE 73 ---\nTR HEAVY-EQUIPMENT OPERATION (Truck-Mounted Crane) NC II Promulgated December 2004/July 2007\n72 / 79\n\n 3.6 TRAINERS’ QUALIFICATION\n\n HEAVY EQUIPMENT OPERATION (TRUCK-MOUNTED CRANE)\n\nTRAINER QUALIFICATION (TQ II)\n•\nMust be a holder of Heavy-Equipment Operation (Truck-Mounted\nCrane) NC-II or equivalent qualification\n•\nMust have undergone training on Training Methodology II (TM II)\nor equivalent in training/experience\n•\nMust be computer-literate\n•\nMust be physically and mentally fit\n•\nMust have had at least 5 years job/industry experience*\n•\nMust be a civil-service eligible or holder of appropriate\nprofessional license issued by the Professional Regulations\nCommission (for government positions)\n\n* Optional. Only when required by the hiring institution.\n\nReference: TESDA Board Resolution No. 2004-03\n\n--- PDF PAGE 74 ---\nTR HEAVY-EQUIPMENT OPERATION (Truck-Mounted Crane) NC II Promulgated December 2004/July 2007\n73 / 79"
