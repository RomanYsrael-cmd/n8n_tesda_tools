      "source_text": "3.5\nTRAINING FACILITIES\n\nThe truck-mounted crane operation workshop must be of concrete\nstructure. Based on class size of 25 students/trainees the space requirements\nfor the teaching/learning and circulation areas are as follows:\n\nSPACE REQUIREMENT\nSIZE IN METERS\nAREA IN SQ.\nMETERS\nTOTAL AREA\nIN SQ.\nMETERS\n• Student/Trainee’s Working\nSpace\n 2.0 x 2.0 meters\n4 sq.m per\nstudent\n100.0 sq.m.\n•\nLecture Room\n8.00 x 6.00\n48.00\n48.0\n•\nLearning Resource Center\n4.00 x 6.00\n24.00\n24.0\n•\n\n172\n• Facilities/Equipment/\nCirculation Area\n-\n-\n52\nTOTAL WORK AREA\n-\n224\nWorking field\n0.25 hectare (MOA/Rental)\n\n--- PDF PAGE 73 ---\nTR HEAVY-EQUIPMENT OPERATION (Truck-Mounted Crane) NC II Promulgated December 2004/July 2007\n72 / 79\n\n 3.6 TRAINERS’ QUALIFICATION\n\n HEAVY EQUIPMENT OPERATION (TRUCK-MOUNTED CRANE)\n\nTRAINER QUALIFICATION (TQ II)\n•\nMust be a holder of Heavy-Equipment Operation (Truck-Mounted\nCrane) NC-II or equivalent qualification\n•\nMust have undergone training on Training Methodology II (TM II)\nor equivalent in training/experience\n•\nMust be computer-literate\n•\nMust be physically and mentally fit\n•\nMust have had at least 5 years job/industry experience*\n•\nMust be a civil-service eligible or holder of appropriate\nprofessional license issued by the Professional Regulations\nCommission (for government positions)\n\n* Optional. Only when required by the hiring institution.\n\nReference: TESDA Board Resolution No. 2004-03\n\n--- PDF PAGE 74 ---\nTR HEAVY-EQUIPMENT OPERATION (Truck-Mounted Crane) NC II Promulgated December 2004/July 2007\n73 / 79"
