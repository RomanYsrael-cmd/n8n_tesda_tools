  "source_text": "For the purpose of this Competency Standard, the words\n\n1. Attachment\nRefers to anything like fly jib used instead of the conventional lift\nblock to perform different types of lifting jobs.\n2. Boom (crane)\nRefers to telescopic boom used for supporting the hoisting\ntackle.\n3. Boom Length\nRefers to the measurement from the boom foot pins to the center\nof the boom point sheaves.\n4. Reeving\nRefers to a rope system in which the rope travels around the\ndrums and sheaves.\n5. Telescopic Boom\nRefers to a component of crane attached to the superstructure\nand is used to support hoisting tackle. Its extended and retracted\nmovement is controlled by hydraulic cylinder.\n6. Truck-mounted\nCrane\nRefers to a mobile type of crane consists of rotating\nsuperstructure with power plant operating machinery and with\ntelescopic boom mounted on a base equipped with tires. It is\nnormally based on 85 percent of tipping capacity.\n7. Standard\nRefers to a degree or level of requirement set by the\nmanufacturer.\n8. Stability\nRefers to the machine resistance to overturning (Truck-mounted\nCrane - lifting on outriggers are based on 85 percent of the\ntipping capacity).\n9. Safety Devices\nRefer to boom angle indicators, load moment indicators, anti-two\nblocking devices (where applicable), boom kick out lever, etc.\n10. Work Area\nRefers to any place inside the swing circle of the crane. It must\nbe barricaded off and only those directly involve in the lift shall\nbe allowed to entry.\n11. Derated capacity\nof equipment\nRefers to the reduction of lifting capacity of equipment as\ncertified by a third party.\n\n--- PDF PAGE 78 ---\nTR HEAVY-EQUIPMENT (Truck-Mounted Crane) OPERATION NC II Promulgated July 2007\n77 / 79\n\nACKNOWLEDGMENTS\n\nThe Technical Education and Skills Development Authority (TESDA)\nwishes to extend thanks and appreciation to the many representatives of\nbusiness, industry, academe and government agencies who contributed their\ntime and expertise to the development and validation of these Training\nRegulations.\n\n•\nTHE TECHNICAL EXPERT PANEL (TEP)\n\nFlorello P. Quianzon\nConsultant, Equipment Concrete Product Division\n(Equipment Management)\nMakati Development Corporation\nAyala-Alabang, Muntinlupa City\nRenato P. Faigao\nEquipment Manager (Operations and\nMaintenance Management)\nMANCON-CBDC Joint Venture\nPasong Tamo, Extension,\nMakati City\nSamuel M. Puquiz\nHead, Mechanical and Technical (Construction\nEquipment Repair and Maintenance)\nDM Consunji Inc.\nPasong Tamo Extension, Makati City\nArturo M. Abrera\nHead, Mechanical Works Training Division\n(Civil Works, Heavy Equipment Operation)\nDepartment of Trade and Industry -\nConstruction Manpower Development\nFoundation\nPasong Tamo, Makati City\nLuciano E. Policarpio\nSafety Engineer (Construction Safety)\nFoundation Specialists, Inc.\nPaseo de Roxas, Legaspi Village, Makati City\nRoberto B. Ocampo\nSenior Technical Trainer\nMonark Equipment Corporation\nE. Rodriguez Jr., Avenue,\nLibis, Quezon City\nTito C. Tadios\nTraining Manager (Heavy Equipment Operation\nand Maintenance)\nMaxima Equipment Co. Inc.\nMapulang lupa, Valenzuela City\nCresencio B. Maramag Jr.\nVice President for Operations (Equipment\nManagement, Testing and Certification)\nFirst Philippines Skills and Equipment Testing\nCorp.\nBagong Ilog, Pasig City\nNicanor A. Lucanas Jr.\nMachine Operations Specialist\nMonark Equipment Corporation\nE. Rodriguez Jr. Avenue,\nLibis, Quezon City\nRudolfo D. Ancheta\nQuality Controller Supervisor (Repair and\nMaintenance of Hydraulic Excavator/Basic\nHydraulic)\nCivil Merchanidising Inc.\nPag-asa, Quezon City\n\n--- PDF PAGE 79 ---\nTR HEAVY-EQUIPMENT (Truck-Mounted Crane) OPERATION NC II Promulgated July 2007\n78 / 79\n\nNestor T. Butacan\nTechnical Trainer\nMaxima Equipment Co. Inc.\nQuezon Avenue,\nQuezon City\nMichael B. Rudolfo\nMaintenance Engineer\nC.M. Pancho Construction Inc.\nScout Borromeo St.,\nDiliman, Quezon City\nVerano 