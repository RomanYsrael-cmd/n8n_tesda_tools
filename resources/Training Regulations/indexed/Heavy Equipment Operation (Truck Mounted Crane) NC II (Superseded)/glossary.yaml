      "term": "For the purpose of this Competency Standard, the words",
      "definition": "1. Attachment Refers to anything like fly jib used instead of the conventional lift block to perform different types of lifting jobs. 2. Boom (crane) Refers to telescopic boom used for supporting the hoisting tackle. 3. Boom Length Refers to the measurement from the boom foot pins to the center of the boom point sheaves. 4. Reeving Refers to a rope system in which the rope travels around the drums and sheaves. 5. Telescopic Boom Refers to a component of crane attached to the superstructure and is used to support hoisting tackle. Its extended and retracted movement is controlled by hydraulic cylinder. 6. Truck-mounted"
    },
    {
      "term": "Crane",
      "definition": "Refers to a mobile type of crane consists of rotating superstructure with power plant operating machinery and with telescopic boom mounted on a base equipped with tires. It is normally based on 85 percent of tipping capacity. 7. Standard Refers to a degree or level of requirement set by the manufacturer. 8. Stability Refers to the machine resistance to overturning (Truck-mounted"
    },
    {
      "term": "Crane",
      "definition": "lifting on outriggers are based on 85 percent of the tipping capacity). 9. Safety Devices Refer to boom angle indicators, load moment indicators, anti-two blocking devices (where applicable), boom kick out lever, etc. 10. Work Area Refers to any place inside the swing circle of the crane. It must be barricaded off and only those directly involve in the lift shall be allowed to entry. 11. Derated capacity of equipment Refers to the reduction of lifting capacity of equipment as certified by a third party."
