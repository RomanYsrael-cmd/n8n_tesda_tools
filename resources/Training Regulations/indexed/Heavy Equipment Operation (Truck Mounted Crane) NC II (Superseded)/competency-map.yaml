  "source_text": "Section 1. Successful\ncandidates shall be awarded National Certificates signed by the TESDA\nDirector General.\n\n4.2\nThe qualification of HEAVY EQUIPMENT OPERATION (Bulldozer) NC II\nmaybe attained through demonstration of competence in a project-type\nassessment covering the following core units. Candidates may apply for\nassessment in any accredited assessment center.\n\n4.2.1\nTruck-mounted Crane operation\n Perform pre-and post operation for lifting equipment\n Perform productive operation for truck-mounted crane\n Perform basic preventive maintenance servicing for lifting\nequipment\n\n4.3\nAssessment shall focus on the core units of competency. The basic and\ncommon units shall be integrated or assessed concurrently with the core\nunits.\n\n4.4\nThe following are qualified to apply for assessment and certification:\n\n4.4.1\nGraduates of formal, non-formal and/or informal training including\nenterprise-based training programs\n\n4.4.2\nExperienced Workers (wage-employed or self-employed)\n\n4.5 The guidelines on assessment and certification are discussed in detail in the\nProcedures Manual on Assessment and Certification and the Guidelines on\nthe Implementation of the Philippine TVET Qualification and Certification\nSystem (PTQCS).\n\n--- PDF PAGE 75 ---\n\n--- PDF PAGE 76 ---\nTR HEAVY-EQUIPMENT (Truck-Mounted Crane) OPERATION NC II Promulgated July 2007\n75 / 79\n\nCOMPETENCY MAP\nCONSTRUCTION-HEAVY EQUIPMENT OPERATION - SUB- SECTOR\nBA\nSIC\nInspect\nrigging\ngears\nPerform productive\noperation for\nhydraulic excavator\nPerform productive\noperation for truck-\nmounted crane\nPerform productive\noperation for tower crane\nPerform productive\noperation for forklift\nInstall\nrigging\ngears\nPerform productive\noperation for\nbackhoe loader\nPerform pre- and post-\noperation procedures for\nlifting equipment\nPerform basic\npreventive maintenance\nservicing for hauling\nPerform productive\noperation for off-\nhigh way dump\ntruck (articulated)\nPerform productive\noperation for\nbulldozer\nPerform productive\noperation for wheel\nloader\nPerform productive\noperation for motor\ngrader\nPerform pre- and post-\noperation procedures for\nhauling equipment\nPerform productive\noperation for road\nroller\nPerform basic preventive\nmaintenance servicing for\nlifting equipment\nAssist\ncrane\noperator\nPerform pre- and post-\noperation procedures for\nearth moving equipment\nPerform productive\noperation for\ncrawler crane\nPerform basic preventive\nmaintenance servicing for\nearth moving equipment\nPerform productive\noperation for rough-\nterrain crane\nPerform productive\noperation for off-highway\ndump truck (rigid)\nPerform productive\noperation for\nconcrete pump\nPerform productive\noperation for paver\nPerform basic preventive\nmaintenance servicing for\nconcreting and asphalting\nequipment\nPerform productive\noperation for on-\nhighway dump truck\n(rigid)\nPerform pre- and post-\noperation procedures for\nconcreting and asphalting\nequipment\nPerform productive\noperation for transit\nmixer\nCORE\nCOMPETENCIES\nPrepare\nconstruction\nmaterials and\ntools\nInterpret technical\ndrawings and plans\nObserve procedures,\nspecifications and\nmanual of instructions\nMaintain tools and\nequipment\nPerform\nmensuration and\ncalculations\nCOMMON\nCOMPETENCIES\nBASIC\nCOMPETENCIES\nReceive and respond\nto workplace\ncommunication\nWork with others\nUse relevant\ntechnologies\nPractice career\nprofessionalism\nUtilize specialized\ncommunication\nskills\nPractice occupational\nhealth and safety\nprocedures\nDevelop teams and\nindividuals\nLead workplace\ncommunication\nDemonstrate work\nvalues\nSolve problems\nrelated to work\nactivities\nDevelop and\npractice negotiation\nskills\nPractice\nhousekeeping\nprocedure (5s)\nUse mathematical\nconcepts and\ntechniques\nWork in a team\nenvironment\nParticipate in\nworkplace\ncommunication\nApply problem-\nsolving techniques\nin the workplace\nPlan and organize\nwork\nCollect, analyze\nand organize\ninformation\nLead small team\nPromote\nenvironmental\nprotection\n\n--- PDF PAGE 77 ---\nTR HEAVY-EQUIPMENT (Truck-Mounted Crane) OPERATION NC II Promulgated July 2007\n76 / 79\n\nDefinition of Terms\n\nFor the purpose of this Competency Standard, the words\n\n1. Attachment\nRefers to anything like fly jib used instead of the conventional lift\nblock to perform different types of lifting jobs.\n2. Boom (crane)\nRefers to telescopic boom used for supporting the hoisting\ntackle.\n3. Boom Length\nRefers to the measurement from the boom foot pins to the center\nof the boom point sheaves.\n4. Reeving\nRefers to a rope system in which the rope travels around the\ndrums and sheaves.\n5. Telescopic Boom\nRefers to a component of crane attached to the superstructure\nand is used to support hoisting tackle. Its extended and retracted\nmovement is controlled by hydraulic cylinder.\n6. Truck-mounted\nCrane\nRefers to a mobile type of crane consists of rotating\nsuperstructure with power plant operating machinery and with\ntelescopic boom mounted on a base equipped with tires. It is\nnormally based on 85 percent of tipping capacity.\n7. Standard\nRefers to a degree or level of requirement set by the\nmanufacturer.\n8. Stability\nRefers to the machine resistance to overturning (Truck-mounted\nCrane - lifting on outriggers are based on 85 percent of the\ntipping capacity).\n9. Safety Devices\nRefer to boom angle indicators, load moment indicators, anti-two\nblocking devices (where applicable), boom kick out lever, etc.\n10. Work Area\nRefers to any place inside the swing circle of the crane. It must\nbe barricaded off and only those directly involve in the lift shall\nbe allowed to entry.\n11. Derated capacity\nof equipment\nRefers to the reduction of lifting capacity of equipment as\ncertified by a third party.\n\n--- PDF PAGE 78 ---\nTR HEAVY-EQUIPMENT (Truck-Mounted Crane) OPERATION NC II Promulgated July 2007\n77 / 79\n\nACKNOWLEDGMENTS\n\nThe Technical Education and Skills Development Authority (TESDA)\nwishes to extend thanks and appreciation to the many representatives of\nbusiness, industry, academe and government agencies who contributed their\ntime and expertise to the development and validation of these Training\nRegulations.\n\n•\nTHE TECHNICAL EXPERT PANEL (TEP)\n\nFlorello P. Quianzon\nConsultant, Equipment Concrete Product Division\n(Equipment Management)\nMakati Development Corporation\nAyala-Alabang, Muntinlupa City\nRenato P. Faigao\nEquipment Manager (Operations and\nMaintenance Management)\nMANCON-CBDC Joint Venture\nPasong Tamo, Extension,\nMakati City\nSamuel M. Puquiz\nHead, Mechanical and Technical (Construction\nEquipment Repair and Maintenance)\nDM Consunji Inc.\nPasong Tamo Extension, Makati City\nArturo M. Abrera\nHead, Mechanical Works Training Division\n(Civil Works, Heavy Equipment Operation)\nDepartment of Trade and Industry -\nConstruction Manpower Development\nFoundation\nPasong Tamo, Makati City\nLuciano E. Policarpio\nSafety Engineer (Construction Safety)\nFoundation Specialists, Inc.\nPaseo de Roxas, Legaspi Village, Makati City\nRoberto B. Ocampo\nSenior Technical Trainer\nMonark Equipment Corporation\nE. Rodriguez Jr., Avenue,\nLibis, Quezon City\nTito C. Tadios\nTraining Manager (Heavy Equipment Operation\nand Maintenance)\nMaxima Equipment Co. Inc.\nMapulang lupa, Valenzuela City\nCresencio B. Maramag Jr.\nVice President for Operations (Equipment\nManagement, Testing and Certification)\nFirst Philippines Skills and Equipment Testing\nCorp.\nBagong Ilog, Pasig City\nNicanor A. Lucanas Jr.\nMachine Operations Specialist\nMonark Equipment Corporation\nE. Rodriguez Jr. Avenue,\nLibis, Quezon City\nRudolfo D. Ancheta\nQuality Controller Supervisor (Repair and\nMaintenance of Hydraulic Excavator/Basic\nHydraulic)\nCivil Merchanidising Inc.\nPag-asa, Quezon City\n\n--- PDF PAGE 79 ---\nTR HEAVY-EQUIPMENT (Truck-Mounted Crane) OPERATION NC II Promulgated July 2007\n78 /