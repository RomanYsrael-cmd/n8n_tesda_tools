  "source_text": "1. Protective Clothing – used to safeguard a worker from harmful chemicals\nand other cleaning supplies and equipment; examples include gloves, face\nmasks, aprons and rubber boots\n\n2. Caddy – used to carry different kinds of cleaning materials\n\n3. Carpet Sweeper – A handy type of sweeper used to pick-up dirt and foreign\nmatters from the carpet surface\n\n4. Disinfectant – Chemical used to eliminate the growth of disease and odor-\ncausing germs and bacteria\n\n5. Squeegee – Hand-held tool used to clean glass windows and doors\n\n6. Lodging Agreement – House rules as defined by the establishments\n\n7. Contact List – Directory of establishments and services around the area\nsuch as churches, restaurants, hospitals, and jogging routes\n\n8. Customer Preference Profiles – Information pertaining to guest and his/her\npreferences such as dietary requirements, birthday, religion, and contact\ndetails\n\n--- PDF PAGE 67 ---\nTR - HOUSEKEEPING NC II (Amended)\nPromulgated December 2013\n63\nACKNOWLEDGMENTS\n\nThe Technical Education and Skills Development Authority (TESDA) wishes to\nextend thanks and appreciation to the many representatives of business, industry,\nacademe and government agencies who donated their time and expertise to the\ndevelopment and validation of these Training Regulations.\n\nREVIEW PANEL\n\nANABELLE O. MORENO\nChair,\nTourism Industry Board Foundation, Inc.\n(TIBFI)\nFormer President, Association of Human\nResource\nManagers for Hotels and Restaurants\n(AHRM)\nASEAN Master Trainer\n\nLILIBETH ARAGON\nLyceum of the Philippines University\nIntramuros, Manila\nASEAN Master Trainer\n\nDR. GLORIA BAKEN WONG-SIY\n\nImmediate Past President, AAHRMEI\n ASEAN Master Trainer\n\n MA. CHRISTINA G. AQUINO\n TIBFI – Board Secretary\n Immediate Past President, COHREP,\n Lyceum of the Philippines University\n Intramuros, Manila\nASEAN Master Assessor\n\n IRENE P. MENDOZA\n Sr. TESD Specialist-Trainer\n TESDA IV-A – PO Rizal\nASEAN Master Assessor\nThe Participants in the Validation of these Training Regulations\nMERLIN T. ONGTECO\nTrainer/Assessor- Housekeeping\nAAHRMEI\nc/o 620 Gochangco Bldg., Room 303\nKalaw St., Ermita, Manila\n\n ROWENA P. SAGAYSAY\n Director/Auditor, COHREP\n Dean\n College of Hospitality Management\n Lyceum of the Philippines\n University, Intramuros, Manila\nELEANOR L. NILO\nPast President\nExecutive Helpers Association of the\nPhil. (EHAP)\nExecutive Housekeeper -Heritage Hotel,\nManila\nCor Roxas Blvd., EDSA Extension\nPasay City\nASEAN Master Assessor\n CHESTER MAGSINO\n Senior Faculty- Housekeeping\n Lyceum of the Philippines\n Intramuros, Manila\n\nABREGALE JOSEPH L. MONZON\nSenior Faculty - Housekeeping\nLyceum of the Philippines University\nIntramuros, Manila\nDANIEL L. EDRALIN\n Board Member\nTourism Industry Board Foundation,\nInc. (TIBFI)\nNational Union of Workers in Hotels\nand Restaurant and Allied Industries\n(NUWHRAIN-APL)\n\nThe TESDA Board Members and Secretariat\nThe Management and Staff of the TESDA Secretariat\nQualifications and Standards Office (QSO)\n\n--- PDF PAGE 68 ---\n\n--- PDF PAGE 69 ---\n\n--- PDF PAGE 70 ---",
