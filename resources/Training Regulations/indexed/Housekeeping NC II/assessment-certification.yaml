  "source_text": "SECTION 4 NATIONAL ASSESSMENT AND CERTIFICATION\nARRANGEMENTS\n\n4.1\nTo attain the National Qualification of HOUSEKEEPING NC II, the\ncandidate must demonstrate competence in all the units of competency\nlisted in Section l. Successful candidates shall be awarded a National\nCertificate signed by the TESDA Director General.\n\n4.2\nThe qualification of HOUSEKEEPING NC II may be attained through:\n\n4.2.1 Demonstration of competencies covering all the required core units\nof qualifications\n\n4.2.2 Accumulation of Certificates of Competency (COCs) in all the\nfollowing areas:\n\n4.2.2.1\nProviding Butler Service\n Provide Valet/Butler Service\n Deal with/Handle intoxicated guests\n\n4.2.2.2\nProviding Housekeeping to Guests\n Provide Housekeeping Services to Guests\n Clean and Prepare Rooms for Incoming Guests\n Deal with/Handle intoxicated guests\n\n4.2.2.3\nCleaning public areas\n Clean Public Areas, Facilities & Equipment\n Deal with/Handle intoxicated guests\n\n4.2.2.4\nProviding laundry service\n- Laundry linen and guest clothes\n- Deal with/handle intoxicated guests\n\n4.3\nAssessment shall focus on the core units of competency. The basic and\ncommon units shall be integrated or assessed concurrently with the core\nunits.\n\n4.4\nThe following are qualified to apply for assessment and certification:\n\n4.4.1\nGraduates\nof\nformal,\nnon-formal\nand\ninformal\nincluding\nenterprise-based training programs.\n4.4.2\nExperienced Workers (wage employed or self-employed)\n\n4.5\nThe guidelines on assessment and certification are discussed in detail in\nthe \"Procedures Manual on Assessment and Certification\" and\n\"Guidelines on the Implementation of the Philippine TVET Qualification\nand Certification System (PTQCS)\".\n\n--- PDF PAGE 65 ---\nTR - HOUSEKEEPING NC II (Amended)\n Promulgated December 2013 61\n\nBASIC\nCOMPETENCIES\nCOMPETENCY MAP - TOURISM Sector\n(Hotel and Restaurant)\nHOUSEKEEPING NC II\nDevelop and\nupdate industry\nknowledge\n\nPerform computer\noperations\n\nProvide effective\ncustomer service\n\nObserve\nworkplace\n hygiene\nprocedures\nPerform\n workplace\nsafety\npractices\nCORE\nCOMPETENCIES\nCOMMON\nCOMPETENCIES\n\nPrepare\nsandwiches\n\nANNEX A\n\nOrganize\nand prepare\nfood\n\nPlan and control\nmenu based on\ncatering\n\nSelect, prepare\nand cook meat\n\nPackage prepare\nfoodstuffs\nEstablish and\nmaintain quality\ncontrol\n\n Manage facilities\nassociated with\ncommercial\ncatering\nApply\ncook-freeze\n production\nprocess\nOrganize\nbulk cooking\noperations\n\nPrepare\nhot and cold\ndesserts\n\nDevelop\n food safety\nprogram\nPrepare\nchocolate and\nchocolate\nconfectionery\nReceive and\nstore kitchen\nsupplies\n\nDevelop menus\nto meet special\ndietary and\ncultural needs\nPrepare\npastry, cakes\nand yeast-based\nproducts\nPrepare\nvegetables, eggs\nand starch\nproducts\nPrepare\ncook and serve\nfood for menus\n\nSelect, prepare\nand serve\nspecialized food\nitem\nSelect\ncatering\nsystems\n\nOperate\nfast food\noutlet\n\nPrepare\nand cook\npoultry and game\n\nClean\nand maintain\nkitchen premises\n\n Plan, prepare\nand display\nbuffet\n\n Plan\nand prepare food\nfor buffets\n\n Plan\ncatering for an\nevent or function\n\n Select, prepare\nand serve\nspecialist\ncuisines\n\nPresent food\n\nApply\nCook, chill\noperation\nprocesses\nPrepare\nand cook\nseafood\n\nPrepare\nappetizers and\nsalads\nPrepare\nportion controlled\nmeat cuts\n\nImplement\nfood safety\nprocedures\n\n Prepare food\naccording to\ndietary and\ncultural needs\n\nMonitor\ncatering revenue\nand costs\nApply\ncatering control\nprinciples\n\nProvide\nhousekeeping\nservices\nto guests\nHandle and\nserve cheese\n\nPrepare\nstocks, sauces\nand soups\nTransport and\nstore food in a\nsafe and hygienic\nmanner\nPrepare\npates and\nterrines\n\nLaundry linen\nand guest clothes\nProvide\nValet/Butler\nservice\nClean public\nareas, facilities\nand equipment\nClean and prepare\nrooms for incoming\nguest\nDem onstrate\nwork values\nPractice\nhousekeeping\nprocedures\n(5S)\nParticipate\nin workplace\ncom m unication\nWork\n in team\nenvironm ent\nPractice\ncareer\nprofessionalism\nWork\nwith others\nDevelop and\npractice\nnegotiation\nskills\nUse\nm athem atical\nconcepts and\ntechniques\nUse\nrelevant\ntechnologies\nSolve problem s\nrelated to work\nactivities\nReceive and\nrespond to\nworkplace\ncom m unication\nDevelop\nteam s and\nindividuals\nUtilize\nspecialized\ncom m unication\nskills\nPractice\noccupational\nhealth and\nsafety procedures\nLead\nworkplace\n com m unication\nCollect,\nanalyze and\norganize\ninform ation\nPlan\nand organize\nwork\nApply\nproblem -\nsolving\ntechniques in\nthe workplace\nLead\nsm all team s\nProm ote\nenvironm ental\nprotection\n\nDeal with/Handle\nIntoxicated guests\n\n--- PDF PAGE 66 ---\nTR - HOUSEKEEPING NC II (Amended)\nPromulgated December 2013\n62\nDEFINITION OF TERMS\n\n1. Protective Clothing – used to safeguard a worker from harmful chemicals\nand other cleaning supplies and equipment; examples include gloves, face\nmasks, aprons and rubber boots\n\n2. Caddy – used to carry different kinds of cleaning materials\n\n3. Carpet Sweeper – A handy type of sweeper used to pick-up dirt and foreign\nmatters from the carpet surface\n\n4. Disinfectant – Chemical used to eliminate the growth of disease and odor-\ncausing germs and bacteria\n\n5. Squeegee – Hand-held tool used to clean glass windows and doors\n\n6. Lodging Agreement – House rules as defined by the establishments\n\n7. Contact List – Directory of establishments and services around the area\nsuch as churches, restaurants, hospitals, and jogging routes\n\n8. Customer Preference Profiles – Information pertaining to guest and his/her\npreferences such as dietary requirements, birthday, religion, and contact\ndetails\n\n--- PDF PAGE 67 ---\nTR - HOUSEKEEPING NC II (Amended)\nPromulgated December 2013\n63\nACKNOWLEDGMENTS\n\nThe Technical Education and Skills Development Authority (TESDA) wishes to\nextend thanks and appreciation to the many representatives of business, industry,\nacademe and government agencies who donated their time and expertise to the\ndevelopment and validation of these Training Regulations.\n\nREVIEW PANEL\n\nANABELLE O. MORENO\nChair,\nTourism Industry Board Foundation, Inc.\n(TIBFI)\nFormer President, Association of Human\nResource\nManagers for Hotels and Restaurants\n(AHRM)\nASEAN Master Trainer\n\nLILIBETH ARAGON\nLyceum of the Philippines University\nIntramuros, Manila\nASEAN Master Trainer\n\nDR. GLORIA BAKEN WONG-SIY\n\nImmediate Past President, AAHRMEI\n ASEAN Master Trainer\n\n MA. CHRISTINA G. AQUINO\n TIBFI – Board Secretary\n Immediate Past President, COHREP,\n Lyceum of the Philippines University\n Intramuros, Manila\nASEAN Master Assessor\n\n IRENE P. MENDOZA\n Sr. TESD Specialist-Trainer\n TESDA IV-A – PO Rizal\nASEAN Master Assessor\nThe Participants in the Validation of these Training Regulations\nMERLIN T. ONGTECO\nTrainer/Assessor- Housekeeping\nAAHRMEI\nc/o 620 Gochangco Bldg., Room 303\nKalaw St., Ermita, Manila\n\n ROWENA P. SAGAYSAY\n Director/Auditor, COHREP\n Dean\n College of Hospitality Management\n Lyceum of the Philippines\n University, Intramuros, Manila\nELEANOR L. NILO\nPast President\nExecutive Helpers Association of the\nPhil. (EHAP)\nExecutive Housekeeper -Heritage Hotel,\nManila\nCor Roxas Blvd., EDSA Extension\nPasay City\nASEAN Master Assessor\n CHESTER MAGSINO\n Senior Faculty- Housekeeping\n Lyceum of the Philippines\n Intramuros, Manila\n\nABREGALE JOSEPH L. MONZON\nSenior Faculty - Housekeeping\nLyceum of the Philippines University\nIntramuros, Manila\nDANIEL L. EDRALIN\n Board Member\nTourism Industry Board Foundation,\nInc. (TIBFI)\nNational Union of Workers in Hotels\nand Restaurant and Allied Industries\n(NUWHRAIN-APL)\n\nThe TESDA Board Members and Secretariat\nThe Management and Staff of the TESDA Secretariat\nQualifications and Standards Office (QSO)\n\n--- PDF PAGE 68 ---\n