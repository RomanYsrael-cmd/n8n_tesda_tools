  "source_text": "SECTION 4 NATIONAL ASSESSMENT AND CERTIFICATION\nARRANGEMENTS\n\n4.1\nTo attain the National Qualification of HOUSEKEEPING NC II, the\ncandidate must demonstrate competence in all the units of competency\nlisted in Section l. Successful candidates shall be awarded a National\nCertificate signed by the TESDA Director General.\n\n4.2\nThe qualification of HOUSEKEEPING NC II may be attained through:\n\n4.2.1 Demonstration of competencies covering all the required core units\nof qualifications\n\n4.2.2 Accumulation of Certificates of Competency (COCs) in all the\nfollowing areas:\n\n4.2.2.1\nProviding Butler Service\n Provide Valet/Butler Service\n Deal with/Handle intoxicated guests\n\n4.2.2.2\nProviding Housekeeping to Guests\n Provide Housekeeping Services to Guests\n Clean and Prepare Rooms for Incoming Guests\n Deal with/Handle intoxicated guests\n\n4.2.2.3\nCleaning public areas\n Clean Public Areas, Facilities & Equipment\n Deal with/Handle intoxicated guests\n\n4.2.2.4\nProviding laundry service\n- Laundry linen and guest clothes\n- Deal with/handle intoxicated guests\n\n4.3\nAssessment shall focus on the core units of competency. The basic and\ncommon units shall be integrated or assessed concurrently with the core\nunits.\n\n4.4\nThe following are qualified to apply for assessment and certification:\n\n4.4.1\nGraduates\nof\nformal,\nnon-formal\nand\ninformal\nincluding\nenterprise-based training programs.\n4.4.2\nExperienced Workers (wage employed or self-employed)\n\n4.5\nThe guidelines on assessment and certification are discussed in detail in\nthe \"Procedures Manual on Assessment and Certification\" and\n\"Guidelines on the Implementation of the Philippine TVET Qualification\nand Certification System (PTQCS)\".\n\n--- PDF PAGE 65 ---\nTR - HOUSEKEEPING NC II (Amended)\n Promulgated December 2013 61\n\nBASIC\nCOMPETENCIES\n"
}
