- provision_id: assessment:4.3
  number: '4.3'
  source_text: Assessment shall focus on the core units of competency. The basic and common units shall be integrated or assessed
    concurrently with the core units.
  normalized_rule: Assessment focuses on core units; basic and common units are integrated or assessed concurrently with core
    units.
- provision_id: assessment:4.4
  number: '4.4'
  source_text: 'The following are qualified to apply for assessment and certification:'
  normalized_rule: Eligibility is defined by subprovisions 4.4.1 and 4.4.2.
- provision_id: assessment:4.4.1
  number: 4.4.1
  source_text: Graduates of formal, non-formal and informal including enterprise-based training programs.
  normalized_rule: Graduates of formal, non-formal, informal, and enterprise-based training programs may apply.
- provision_id: assessment:4.4.2
  number: 4.4.2
  source_text: Experienced Workers (wage employed or self-employed)
  normalized_rule: Experienced workers, whether wage-employed or self-employed, may apply.
- provision_id: assessment:4.5
  number: '4.5'
  source_text: The guidelines on assessment and certification are discussed in detail in the "Procedures Manual on Assessment
    and Certification" and "Guidelines on the Implementation of the Philippine TVET Qualification and Certification System
    (PTQCS)".
  normalized_rule: Detailed assessment and certification procedures are governed by the named TESDA manuals/guidelines.
