provisions:
- provision_id: assessment:4.1
  number: '4.1'
  source_text: To attain the National Qualification of HOUSEKEEPING NC II, the candidate must demonstrate competence in all
    the units of competency listed in Section l. Successful candidates shall be awarded a National Certificate signed by the
    TESDA Director General.
  normalized_rule: National Certificate requires competence in all units listed in Section 1; successful candidates receive
    a National Certificate signed by the TESDA Director General.
  fidelity_ref: tesda:housekeeping-nc-ii:anomaly:section-4.1-section-l
- provision_id: assessment:4.2
  number: '4.2'
  source_text: 'The qualification of HOUSEKEEPING NC II may be attained through:'
  normalized_rule: The qualification may be attained by either full demonstration of required core competencies or accumulation
    of all specified Certificates of Competency.
- provision_id: assessment:4.2.1
  number: 4.2.1
  source_text: Demonstration of competencies covering all the required core units of qualifications
  normalized_rule: Demonstrate competencies covering all required core units of the qualification.
- provision_id: assessment:4.2.2
  number: 4.2.2
  source_text: 'Accumulation of Certificates of Competency (COCs) in all the following areas:'
  normalized_rule: Accumulate COCs in all four specified areas.
