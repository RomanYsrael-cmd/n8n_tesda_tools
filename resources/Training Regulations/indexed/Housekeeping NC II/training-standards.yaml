    "source_text": "3.1 CURRICULUM DESIGN\n\nCourse Title: HOUSEKEEPING\n\n NC Level: NC II\n\nNominal Training Duration: 18 Hrs. (Basic)\n\n 18 Hrs. (Common)\n\n 400 Hrs. (Core)\nCourse Description:\n\nThis course is designed to enhance the knowledge, skills and attitude of\nhousekeeping staff in housekeeping services, preparing guest’s rooms, providing\nvalet/butler service, laundering linen and guest’s clothes, cleaning premises and\nequipment in accordance with industry standards. It covers the basic, core and\ncommon competencies in HOUSEKEEPING NC II.\n\nBASIC COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and convey\nworkplace information\n1.2 Speak English at a basic\noperational level\n1.3 Participate in workplace\nmeeting and discussion\n1.4 Complete relevant work\nrelated documents\n•Group\ndiscussion\n• Interaction\n• Practice\nsession\n•Demonstration\n• Observation\n• Interviews/\nquestioning\n2. Work in team\nenvironment\n2.1 Describe and identify\nteam role and\nresponsibility in a team\n2.2 Describe work as a team\nmember\n2.3 Work effectively with\ncolleagues\n2.4 Work in socially diverse\nenvironment\n•Discussion\n• Interaction\n• Simulation\ngames\n\n•Demonstration\n• Observation\n• Interviews/\nquestioning\n3. Practice career\nprofessionalism\n3.1 Integrate personal\nobjectives with\norganizational goals\n3.2 Set and meet work\npriorities\n3.3 Maintain professional\ngrowth and development\n•Discussion\n• Interaction\n• Role play\n\n•Demonstration\n• Observation\n• Interviews/\nquestioning\n\n--- PDF PAGE 57 ---\nTR - HOUSEKEEPING NC II (Amended)\nPromulgated December 2013\n53\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n4. Practice\noccupational\nhealth and\nsafety\nprocedures\n4.1 Evaluate hazard and risks\n4.2 Control hazards and risks\n4.3 Maintain occupational\nhealth and safety\nawareness\n4.4 Perform basic first-aid\nprocedures\n•Lecture-\nDiscussion\n• Case study\n• Plant tour\n• Symposium\n•Observation\n• Interview\n\nCOMMON COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Develop and\nupdate\nindustry\nknowledge\n1.1 Seek information on the\nindustry\n1.2 Update continuously\nrelevant industry\nknowledge\n1.3 Develop and update\nlocal knowledge\n1.4 Promote products and\nservices to customers\n•Lecture\n• Group\nDiscussion\n• Individual/\nGroup\nAssignment\n\n• Field visit\n• Video\npresentation\n•Interviews/\n Questioning\n• Individual/\nGroup Project\nor Report\n2. Observe\nworkplace\nhygiene\nprocedures\n2.1 Follow hygiene\nprocedures\n2.2 Identify and prevent\nhygiene risk\n•Lecture\n• Demonstration\n• Role-play\n\n•Case study\n•Demonstration\n• Written\nExamination\n• Interviews/\nQuestioning\n3. Perform\ncomputer\noperations\n3.1 Plan and prepare task to\nbe undertaken\n3.2 Input data into a\ncomputer\n3.3 Assess information using\ncomputer\n3.4 Produce/ output data\nusing computer system\n3.5 Maintain computer\nsystem\n•Lecture\n• Group\nDiscussion\n• Tutorial or self-\npace\n• Demonstration\n\n• Practice\nsession\n•Interviews/\nQuestioning\n• Practical\nDemonstration\n• Observation\n4. Perform\nworkplace and\nsafety\npractices\n4.1 Practice workplace\nprocedures for health,\nsafety and security\npractices\n4.2 Perform child protection\nduties relevant to the\ntourism industry\n4.3 Observe and monitor\npeople\n4.4 Deal with emergency\nsituations\n4.5 Maintain safe personal\npresentation standards\n4.6 Maintain a safe and\nsecure workplace\n•Lecture\n• Demonstration\n• Role-play\n• Simulation\n•Demonstration\n• Interviews/\nQuestioning\n• Written\nExamination\n\n--- PDF PAGE 58 ---\nTR - HOUSEKEEPING NC II (Amended)\nPromulgated December 2013\n54\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n5. Provide\neffective\ncustomer\nservice\n5.1 Greet customers\n5.2 Identify customer needs\n5.3 Deliver service to\ncustomer\n5.6 Handle queries through\nuse of common business\ntools and technology\n5.5 Handle\ncomplaints/conflict\nsituations, evaluation\nand recommendations\n•Lecture\n• Demonstration\n• Role-play\n• Simulation\n•Demonstration\n• Interviews/\nQuestioning\n• Observation\n\nCORE COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Provide\nHousekeeping\nServices to\nGuests\n1.1 Receive housekeeping\nrequests\n1.2 Provide/Service\nhousekeeping requests\n1.3 Provide advice to guest\n1.4 Liaise with other\ndepartments\n• Lecture –\nDiscussion\n• Interaction\n• Demonstration\n• Interviews/\nquestioning\n• Demonstration\n• Observation\n2. Clean and\nPrepare rooms\nfor incoming\nguests\n2.1 Set up equipment and\ntrolleys\n2.2 Access rooms for\nservicing\n2.3 Make up beds\n2.4 Clean and clear rooms\n2.5 Clean and store trolleys\nand equipment\n• Lecture –\nDiscussion\n• Interaction\n• Demonstration\n\n• Demonstration\n• Observation\n• Inspection\n• Written\nexamination\n(optional)\n\n3. Provide Valet/\nButler Service\n3.1 Provide valet services to\nguests\n3.2 Display professional\nvalet standards\n3.3 Care for guest property\n• Lecture –\nDiscussion\n• Interaction\n• OJT\n• Demonstration\n• Observation\n• Written\nexamination\n(optional)\n\n--- PDF PAGE 59 ---\nTR - HOUSEKEEPING NC II (Amended)\nPromulgated December 2013\n55\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n4. Laundry Linen\nand Guest\nClothes\n4.1 Collect laundry for\nlaundering functions\n4.2 Perform laundering\nfunctions\n4.3 Process laundered item\n4.4 Return laundered item\n• Lecture –\nDiscussion\n• Interaction\n• Demonstration\n• Simulation\n• Demonstration\n• Interview/\nQuestioning\n• Observation\n• Written\nexamination\n(optional)\n5. Clean public\nareas, facilities\nand equipment\n5.1 Select and set up\nequipment and materials\n5.2 Apply cleaning technique\n5.3 Clean dry and wet areas\n5.4 Maintain and store\ncleaning equipment and\nchemicals\n• Lecture –\nDiscussion\n• Interaction\n• Demonstration\n• Demonstration\n• Interviews/\nquestioning\n• Observation\n• Written\nexamination\n(optional)\n6. Deal with/\nhandle\nintoxicated\nguests\n6.1 Determine the level of\nintoxication\n6.2 Apply appropriate\nprocedures\n6.3 Comply with legislation\n• Lecture –\nDiscussion\n• Interaction\n• Demonstration\n• Simulation\n• Oral questions\n• Written\nquestions\n• Work projects\n• Workplace\nobservation of\npractical skills\n• Practical\nexercises/\nRole Play/\nDemonstration\n• Formal report\nfrom\nsupervisor\n\n--- PDF PAGE 60 ---\nTR - HOUSEKEEPING NC II (Amended)\nPromulgated December 2013\n56"
