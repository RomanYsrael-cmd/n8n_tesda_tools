  "source_section_text": "SECTION 3 TRAINING STANDARDS\n\nThese guidelines are set to provide the Technical and Vocational Education\nand Training (TVET) providers with information and other important requirements to\nconsider when designing training programs for HOUSEKEEPING NC II.\n\nThe guidelines include information on curriculum design, training delivery,\ntrainee entry requirements, tools and equipment, training facilities, and trainers\nqualifications, among others.\n\n3.1 CURRICULUM DESIGN\n\nCourse Title: HOUSEKEEPING\n\n NC Level: NC II\n\nNominal Training Duration: 18 Hrs. (Basic)\n\n 18 Hrs. (Common)\n\n 400 Hrs. (Core)\nCourse Description:\n\nThis course is designed to enhance the knowledge, skills and attitude of\nhousekeeping staff in housekeeping services, preparing guest’s rooms, providing\nvalet/butler service, laundering linen and guest’s clothes, cleaning premises and\nequipment in accordance with industry standards. It covers the basic, core and\ncommon competencies in HOUSEKEEPING NC II.\n\nBASIC COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and convey\nworkplace information\n1.2 Speak English at a basic\noperational level\n1.3 Participate in workplace\nmeeting and discussion\n1.4 Complete relevant work\nrelated documents\n•Group\ndiscussion\n• Interaction\n• Practice\nsession\n•Demonstration\n• Observation\n• Interviews/\nquestioning\n2. Work in team\nenvironment\n2.1 Describe and identify\nteam role and\nresponsibility in a team\n2.2 Describe work as a team\nmember\n2.3 Work effectively with\ncolleagues\n2.4 Work in socially diverse\nenvironment\n•Discussion\n• Interaction\n• Simulation\ngames\n\n•Demonstration\n• Observation\n• Interviews/\nquestioning\n3. Practice career\nprofessionalism\n3.1 Integrate personal\nobjectives with\norganizational goals\n3.2 Set and meet work\npriorities\n3.3 Maintain professional\ngrowth and development\n•Discussion\n• Interaction\n• Role play\n\n•Demonstration\n• Observation\n• Interviews/\nquestioning\n\n--- PDF PAGE 57 ---\nTR - HOUSEKEEPING NC II (Amended)\nPromulgated December 2013\n53\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n4. Practice\noccupational\nhealth and\nsafety\nprocedures\n4.1 Evaluate hazard and risks\n4.2 Control hazards and risks\n4.3 Maintain occupational\nhealth and safety\nawareness\n4.4 Perform basic first-aid\nprocedures\n•Lecture-\nDiscussion\n• Case study\n• Plant tour\n• Symposium\n•Observation\n• Interview\n\nCOMMON COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Develop and\nupdate\nindustry\nknowledge\n1.1 Seek information on the\nindustry\n1.2 Update continuously\nrelevant industry\nknowledge\n1.3 Develop and update\nlocal knowledge\n1.4 Promote products and\nservices to customers\n•Lecture\n• Group\nDiscussion\n• Individual/\nGroup\nAssignment\n\n• Field visit\n• Video\npresentation\n•Interviews/\n Questioning\n• Individual/\nGroup Project\nor Report\n2. Observe\nworkplace\nhygiene\nprocedures\n2.1 Follow hygiene\nprocedures\n2.2 Identify and prevent\nhygiene risk\n•Lecture\n• Demonstration\n• Role-play\n\n•Case study\n•Demonstration\n• Written\nExamination\n• Interviews/\nQuestioning\n3. Perform\ncomputer\noperations\n3.1 Plan and prepare task to\nbe undertaken\n3.2 Input data into a\ncomputer\n3.3 Assess information using\ncomputer\n3.4 Produce/ output data\nusing computer system\n3.5 Maintain computer\nsystem\n•Lecture\n• Group\nDiscussion\n• Tutorial or self-\npace\n• Demonstration\n\n• Practice\nsession\n•Interviews/\nQuestioning\n• Practical\nDemonstration\n• Observation\n4. Perform\nworkplace and\nsafety\npractices\n4.1 Practice workplace\nprocedures for health,\nsafety and security\npractices\n4.2 Perform child protection\nduties relevant to the\ntourism industry\n4.3 Observe and monitor\npeople\n4.4 Deal with emergency\nsituations\n4.5 Maintain safe personal\npresentation standards\n4.6 Maintain a safe and\nsecure workplace\n•Lecture\n• Demonstration\n• Role-play\n• Simulation\n•Demonstration\n• Interviews/\nQuestioning\n• Written\nExamination\n\n--- PDF PAGE 58 ---\nTR - HOUSEKEEPING NC II (Amended)\nPromulgated December 2013\n54\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n5. Provide\neffective\ncustomer\nservice\n5.1 Greet customers\n5.2 Identify customer needs\n5.3 Deliver service to\ncustomer\n5.6 Handle queries through\nuse of common business\ntools and technology\n5.5 Handle\ncomplaints/conflict\nsituations, evaluation\nand recommendations\n•Lecture\n• Demonstration\n• Role-play\n• Simulation\n•Demonstration\n• Interviews/\nQuestioning\n• Observation\n\nCORE COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Provide\nHousekeeping\nServices to\nGuests\n1.1 Receive housekeeping\nrequests\n1.2 Provide/Service\nhousekeeping requests\n1.3 Provide advice to guest\n1.4 Liaise with other\ndepartments\n• Lecture –\nDiscussion\n• Interaction\n• Demonstration\n• Interviews/\nquestioning\n• Demonstration\n• Observation\n2. Clean and\nPrepare rooms\nfor incoming\nguests\n2.1 Set up equipment and\ntrolleys\n2.2 Access rooms for\nservicing\n2.3 Make up beds\n2.4 Clean and clear rooms\n2.5 Clean and store trolleys\nand equipment\n• Lecture –\nDiscussion\n• Interaction\n• Demonstration\n\n• Demonstration\n• Observation\n• Inspection\n• Written\nexamination\n(optional)\n\n3. Provide Valet/\nButler Service\n3.1 Provide valet services to\nguests\n3.2 Display professional\nvalet standards\n3.3 Care for guest property\n• Lecture –\nDiscussion\n• Interaction\n• OJT\n• Demonstration\n• Observation\n• Written\nexamination\n(optional)\n\n--- PDF PAGE 59 ---\nTR - HOUSEKEEPING NC II (Amended)\nPromulgated December 2013\n55\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n4. Laundry Linen\nand Guest\nClothes\n4.1 Collect laundry for\nlaundering functions\n4.2 Perform laundering\nfunctions\n4.3 Process laundered item\n4.4 Return laundered item\n• Lecture –\nDiscussion\n• Interaction\n• Demonstration\n• Simulation\n• Demonstration\n• Interview/\nQuestioning\n• Observation\n• Written\nexamination\n(optional)\n5. Clean public\nareas, facilities\nand equipment\n5.1 Select and set up\nequipment and materials\n5.2 Apply cleaning technique\n5.3 Clean dry and wet areas\n5.4 Maintain and store\ncleaning equipment and\nchemicals\n• Lecture –\nDiscussion\n• Interaction\n• Demonstration\n• Demonstration\n• Interviews/\nquestioning\n• Observation\n• Written\nexamination\n(optional)\n6. Deal with/\nhandle\nintoxicated\nguests\n6.1 Determine the level of\nintoxication\n6.2 Apply appropriate\nprocedures\n6.3 Comply with legislation\n• Lecture –\nDiscussion\n• Interaction\n• Demonstration\n• Simulation\n• Oral questions\n• Written\nquestions\n• Work projects\n• Workplace\nobservation of\npractical skills\n• Practical\nexercises/\nRole Play/\nDemonstration\n• Formal report\nfrom\nsupervisor\n\n--- PDF PAGE 60 ---\nTR - HOUSEKEEPING NC II (Amended)\nPromulgated December 2013\n56\n3.2\nTRAINING DELIVERY\n\nThe delivery of training should follow the design of the curriculum. Delivery\nshould be guided by the 10 basic principles of competency-based TVET.\n\n• The training is based on curriculum developed from the competency\nstandards;\n• Learning is modular in its structure;\n• Training delivery is individualized and self-paced;\n• Training is based on work that must be performed;\n• Training materials are directly related to the competency standards and\nthe curriculum modules;\n• Assessment is based on the collection of evidence of the performance of\nwork to the industry required standard;\n• Training is based on both on and off-the-job components;\n• Allows for recognition of prior learning (RPL) or current competencies;\n• Training allows for multiple entry and exit; and\n• Approved training programs are Nationally Accredited\n\nThe competency-based TVET system recognizes various types of delivery\nmodes, both on and off-the-job as long as the learning is driven by the competency\nstandards specified by the industry. The following training modalities may be\nadopted when designing training programs:\n\n• The dual- mode of training delivery is preferred and recommended. Thus\nprograms would contain both in-school and in-industry training or fieldwork\ncomponents. Details can be referred to the Dual Training System (DTS)\nImplementing Rules and Regulations.\n• Modular/self-paced learning is a competency-based training modality\nwherein the trainee is allowed to progress at his/her own pace. The trainer\nonly facilitates the training delivery.\n• Peer teaching/mentoring is a training modality wherein fast learners are\ngiven the opportunity to assist the slow learners.\n• Supervised industry training or on-the-job training is an approach in\ntraining designed to enhance the knowledge and skills of the trainee\nthrough actual experience in the workplace to acquire specific\ncompetencies prescribed in the training regulations.\n• Distance learning is a formal education process in which majority of the\ninstruction occurs when the students and instructor are not in the same\nplace. Distance learning may employ correspondence study, audio, video\nor computer technologies.\n\n--- PDF PAGE 61 ---\nTR - HOUSEKEEPING NC II (Amended)\nPromulgated December 2013\n57\n3.3\nTRAINEE ENTRY REQUIREMENTS\n\nTrainees or students who wish to enter this course should possess the\nfollowing requirements:\n\n• can communicate in English both oral and written;\n• can perform basic mathematical computation.\n\nThis list does not include specific institutional requirements such as\neducational attainment, appropriate work experience and others that may be\nrequired of the trainees by the school or training center delivering the TVET program.\n\n3.4\nLIST OF TOOLS AND EQUIPMENT\n\nRecommended list of tools, equipment and materials for the training of a\nmaximum of 25 trainees for Housekeeping NC II are as follows:\n\nTOOLS\nEQUIPMENT\nQTY\nITEM\nQTY\nITEM\n5 pcs.\nMops\n1 unit\nProjector Screen\n5 pcs.\nBrushes\n1 unit\nOverhead Projector\n5 pcs.\nBrooms\n2 unit\nElectric Fan\n5 pcs.\nBuckets\n1 pc.\nFirst Aid Cabinet\n5 pcs.\nDust Pans\n1 pc.\nInstructor’s desk chairs\n2 pcs.\nGarbage Receptacles\n3 pcs.\nFire Extinguisher\n5 pcs.\nSorting Baskets/ Laundry Baskets\n2 pcs. Emergency Light\n1 pc.\nStep Ladder\n2 pcs.\nDirectional Signage\n2 pcs.\nSqueegee\n2\nunits.\nAir condition\n2 pcs.\nWater Hoses\n25\npcs.\nArmed Chairs\n10 pcs. Lint Free Cleaning Cloths\n1 unit\nTelephone\n10 pcs\nScrubbing Foam\n1 unit\nComputer\n10 pcs. Dish Sponges\n1 unit.\nTV\n5 pcs.\nSpray Bottles\n1 unit.\nVideo player\n5 pcs.\nAnti-Static Dusters\n1 unit.\nFax machine\n25 pcs. Gloves\n1 unit.\nRefrigerator\n5 pcs.\nCaution Signs\n1 unit.\nHairdryer\n2 pcs.\nMop Squeezer\n1 pc.\nAlarm clock\n1 pc.\nShelving\nMATERIALS\n1 pc.\nCart\nQTY\nITEM\n1 pc.\nTrolley\n2 reams\nBond paper\n1 unit.\nCoffee Maker\n25 pcs.\nFolders\n1 unit.\nElectric kettle\n1 pc.\nLogbook\n1 unit.\nElectric jug\n\n--- PDF PAGE 62 ---\nTR - HOUSEKEEPING NC II (Amended)\nPromulgated December 2013\n58\n\nTOOLS\nEQUIPMENT\nQTY\nITEM\nQTY\nITEM\n1 box\nTransparency acetate\n1 unit\nToilet Caddy\n2 pcs.\nWhite Board\n1 unit\nCarpet sweeper\n5 pcs.\nWhiteboard Markers\n1 unit\nVacuum cleaner (dry and wet )\n2 pcs.\nWhiteboard Eraser\n1 unit\nPolisher (electric with complete\naccessories)\n5 pcs.\nMarking Pen\n1 unit\nWashers\n2 pcs.\nStationery\n1 unit\nDryer\n2 sets\nLinen (for single bed\n1 unit\nFlat iron\n2 sets\nLinen (for double bed)\n1 set\nGlassware\n1 pc.\nIroning Board\n1 set\nCutlery\n1 pc.\nSteam pressers\n1 pack\nTea\n1 pc.\nSorting shelves\n1 pack\nCoffee\n1 unit\nDrying cleaning machine\n1 pack\nSugar\n1 pack\nPowdered Milk\n1 pack\nBiscuits\n1 unit\nBed (Single )\nCleaning agents\n1 unit\nBed (Quee