training_delivery:
  source_heading: 3.2 TRAINING DELIVERY
  provenance:
    printed_page: 56
    pdf_page: 60
  principles:
  - The training is based on curriculum developed from the competency standards;
  - Learning is modular in its structure;
  - Training delivery is individualized and self-paced;
  - Training is based on work that must be performed;
  - Training materials are directly related to the competency standards and the curriculum modules;
  - Assessment is based on the collection of evidence of the performance of work to the industry required standard;
  - Training is based on both on and off-the-job components;
  - Allows for recognition of prior learning (RPL) or current competencies;
  - Training allows for multiple entry and exit; and
  - Approved training programs are Nationally Accredited
  modalities:
  - name: Dual-mode training delivery
    source_text: The dual- mode of training delivery is preferred and recommended. Thus programs would contain both in-school
      and in-industry training or fieldwork components. Details can be referred to the Dual Training System (DTS) Implementing
      Rules and Regulations.
  - name: Modular/self-paced learning
    source_text: Modular/self-paced learning is a competency-based training modality wherein the trainee is allowed to progress
      at his/her own pace. The trainer only facilitates the training delivery.
  - name: Peer teaching/mentoring
    source_text: Peer teaching/mentoring is a training modality wherein fast learners are given the opportunity to assist
      the slow learners.
  - name: Supervised industry training or on-the-job training
    source_text: Supervised industry training or on-the-job training is an approach in training designed to enhance the knowledge
      and skills of the trainee through actual experience in the workplace to acquire specific competencies prescribed in
      the training regulations.
  - name: Distance learning
    source_text: Distance learning is a formal education process in which majority of the instruction occurs when the students
      and instructor are not in the same place. Distance learning may employ correspondence study, audio, video or computer
      technologies.
