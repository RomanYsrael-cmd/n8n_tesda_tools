  "source_text": "SECTION 1 HOUSEKEEPING NC II QUALIFICATION\n\nThe HOUSEKEEPING NC II Qualification consists of competencies that a person\nmust achieve to prepare guest rooms, clean public areas and equipment, provide\nhousekeeping services, provide valet services, handle intoxicated guest, and laundry linen\nand guest clothes to a range of accommodation services.\n\nThis Qualification is packaged from the competency map of the Tourism Sector\n(Hotel and Restaurant) as shown in Annex A\n\nThe Units of Competency comprising this Qualification include the following:\n\nCODE NO.\nBASIC COMPETENCIES\n\n500311105\nParticipate in workplace communication\n500311106\nWork in team environment\n500311107\nPractice career professionalism\n500311108\nPractice occupational health and safety procedures\n\nCODE NO.\nCOMMON COMPETENCIES\n\nTRS311201\nDevelop and update industry knowledge\nTRS311202\nObserve workplace hygiene procedures\nTRS311203\nPerform computer operations\nTRS311204\nPerform workplace and safety practices\nTRS311205\nProvide effective customer service\n\nCODE NO.\nCORE COMPETENCIES\n\nTRS5123111\nProvide housekeeping services to guests\nTRS5123112\nClean and prepare rooms for incoming guests\nTRS5123113\nProvide valet/butler service\nTRS5123114\nLaundry linen and guest clothes\nTRS5123115\nClean public areas, facilities and equipment\nTRS5123122\nDeal with/Handle intoxicated guests\n\nA person who has achieved this Qualification is competent to be:\n\n Junior Cleaner\n Assistant Cleaner\n Assistant Public Area Cleaner\n Cleaner\n Public Area Cleaner\n Attendant\n Room/Cabin Attendant/Room Maid\n Laundry Attendant\n Housekeeping Attendant\n Butler\n\n--- PDF PAGE 6 ---\nTR - HOUSEKEEPING NC II (Amended)\nPromulgated December 2013\n2"
