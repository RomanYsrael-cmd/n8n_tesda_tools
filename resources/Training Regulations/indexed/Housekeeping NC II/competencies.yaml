        "source_title": "PRACTICE OCCUPATIONAL HEALTH AND SAFETY PROCEDURES",
        "source_text": "--- PDF PAGE 15 ---\nTR - HOUSEKEEPING NC II (Amended) \nPromulgated December 2013 \n11 \nUNIT OF COMPETENCY : \nPRACTICE OCCUPATIONAL HEALTH AND SAFETY   \nPROCEDURES \n \nUNIT CODE \n: \n500311108 \n \nUNIT DESCRIPTOR \n: \nThis unit covers the outcomes required to comply with \nregulatory \nand \norganizational \nrequirements \nfor \noccupational health and safety.  \n \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables\n1.  Identify hazards and \nrisks \n1.1\nSafety regulations and workplace safety and hazard \ncontrol practices and procedures are clarified and \nexplained based on organization procedures \n1.2 \nHazards/risks in the workplace and their \ncorresponding indicators are identified to minimize or \neliminate risk to co-workers, workplace and \nenvironment in accordance with organization \nprocedures \n1.3 \nContingency measures during workplace accidents, \nfire and other emergencies are recognized and \nestablished in accordance with organization procedures\n2.  Evaluate hazards and \nrisks \n2.1\nTerms of maximum tolerable limits which when \nexceeded will result in harm or damage are identified \nbased on threshold limit values (TLV) \n2.2 \nEffects of the hazards are determined \n2.3 \nOHS issues and/or concerns and identified safety \nhazards are reported to designated personnel in \naccordance with workplace requirements and relevant \nworkplace OHS legislation \n3.  Control hazards and \nrisks  \n3.1\nOccupational Health and Safety (OHS) procedures for \ncontrolling hazards/risks in workplace are consistently \nfollowed \n3.2 \nProcedures for dealing with workplace accidents, fire \nand emergencies are followed in accordance with \norganization OHS policies \n3.3 \nPersonal protective equipment (PPE) is correctly \nused in accordance with organization OHS procedures \nand practices  \n3.4 \nAppropriate assistance is provided in the event of a \nworkplace emergency in accordance with established \norganization protocol \n4.  Maintain OHS \nawareness \n4.1\nEmergency-related drills and trainings are \nparticipated in as per established organization \nguidelines and procedures \n4.2 \nOHS personal records are completed and updated in \naccordance with workplace requirements  \n5.  Perform basic first-aid \nprocedures \n \n5.1    Situation is assessed in accordance with accepted \npractice \n5.2    Basic first-aid techniques is applied in accordance with \nestablished first-aid procedures and enterprise policy \n5.3    Details of the incident is communicated in a timely \nmanner according to enterprise policy\n\n--- PDF PAGE 16 ---\nTR - HOUSEKEEPING NC II (Amended) \nPromulgated December 2013 \n12 \nRANGE OF VARIABLES   \n \nVARIABLE \nRANGE \n1.  Safety regulations\nMay include:\n1.1 \nClean Air Act \n1.2 \nBuilding code \n1.3 \nNational Electrical and Fire Safety Codes \n1.4 \nWaste management statutes and rules \n1.5 \nPhilippine Occupational Safety and Health Standards \n1.6 \nDOLE regulations on safety legal requirements \n1.7\nECC regulations\n2.  Hazards/Risks\nMay include:\n2.1 \nPhysical hazards – impact, illumination, pressure, \nnoise, vibration, temperature, radiation  \n2.2 \nBiological hazards- bacteria, viruses, plants,   \nparasites, mites, molds, fungi, insects \n2.3 \nChemical hazards – dusts, fibers, mists, fumes, smoke, \ngasses, vapors \n2.4 \nErgonomics \n2.4.1 Psychological factors – over exertion/ excessive \nforce, awkward/static positions, fatigue, direct \npressure, varying metabolic cycles \n2.4.2 Physiological factors – monotony, personal \nrelationship, work out cycle \n3.  Contingency measures\nMay include:\n3.1 \nEvacuation \n3.2 \nIsolation \n3.3 \nDecontamination \n3.4 \nCalling emergency personnel \n3.5\nFirst Aid Application\n4.  PPE\nMay include:\n4.1 \nMask \n4.2 \nGloves \n4.3 \nGoggles \n4.4 \nHair Net/cap/bonnet \n4.5 \nFace mask/shield \n4.6 \nEar muffs \n4.7 \nApron/Gown/coverall/jump suit \n4.8 \nAnti-static suits \n \n5.  Emergency-related \ndrills and training \n5.1\nFire drill\n5.2 \nEarthquake drill  \n5.3 \nBasic life support/CPR \n5.4 \nFirst aid \n5.5 \nSpillage control  \n5.6 \nDecontamination of chemical and toxic \n5.7 \nDisaster preparedness/management \n6.  OHS personal records\n6.1\nMedical/Health records\n6.2 \nIncident reports \n6.3 \nAccident reports \n6.4 \nOHS-related training completed\n\n--- PDF PAGE 17 ---\nTR - HOUSEKEEPING NC II (Amended) \nPromulgated December 2013 \n13 \nEVIDENCE GUIDE \n \n1.  Critical aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 \nExplained clearly established workplace safety and \nhazard control practices and procedures \n1.2 \nIdentified hazards/risks in the workplace and its \ncorresponding indicators in accordance with  company  \nprocedures \n1.3 \nRecognized contingency measures during workplace \naccidents, fire and other emergencies \n1.4 \nIdentified terms of maximum tolerable limits based on \nthreshold limit value- TLV. \n1.5 \nApplied basic first-aid procedures \n1.6 \nFollowed Occupational Health and Safety (OHS) \nprocedures for controlling hazards/risks in workplace \n1.7 \nUsed Personal Protective Equipment (PPE) in \naccordance with company OHS procedures and \npractices  \n1.8 \nCompleted and updated OHS personal records in \naccordance with workplace requirements   \n2.  Underpinning \nKnowledge and  \n2.1 \nOHS procedures and practices and regulations \n2.2 \nPPE types and uses \n2.3 \nPersonal hygiene practices \n2.4 \nHazards/risks identification and control \n2.5 \nThreshold Limit Value -TLV \n2.6 \nOHS indicators  \n2.7 \nOrganization safety and health protocol \n2.8 \nSafety consciousness \n2.9 \nHealth consciousness \n2.10 First-aid procedures and practices \n3.  Underpinning Skills \n3.1 \nPractice of personal hygiene  \n3.2 \nHazards/risks identification and control skills \n3.3 \nInterpersonal skills \n3.4 \nCommunication skills \n3.5 \nSafe manual handling of casualty \n4.  Resource Implications \nThe following resources must be provided: \n4.1 \nWorkplace or assessment location \n4.2 \nOHS personal records \n4.3 \nPPE \n4.4 \nHealth records \n5.  Methods of \nAssessment \nCompetency may be assessed through: \n5.1 \nPortfolio Assessment  \n5.2 \nInterview \n5.3 \nCase Study/Situation \n6.  Context for \nAssessment \n6.1 \nCompetency may be assessed in the work place or in a  \nsimulated work place setting\n",
