        "evidence_guide": {
          "source_text": "1. Critical aspect of\nCompetency\nAssessment must show that the candidate:\n1.1\nSelected and used hardware components correctly and\naccording to the task requirement\n1.2\nIdentified and explain the functions of both hardware\nand software used, their general features and\ncapabilities\n1.3\nProduced accurate and complete data in accordance\nwith the requirements\n1.4\nUsed appropriate devices and procedures to transfer\nfiles/data accurately\n1.5\nMaintained computer system\n2. Required Knowledge\n2.1\nBasic ergonomics of keyboard and computer use\n2.2\nMain types of computers and basic features of different\noperating systems\n2.3\nMain parts of a computer\n2.4\nStorage devices and basic categories of memory\n2.5\nRelevant types of software\n2.6\nGeneral security\n2.7\nViruses\n2.8\nOHS principles and responsibilities\n2.9\nCalculating computer capacity\n3. Required Skills\n3.1\nReading skills required to interpret work instruction\n3.2\nCommunication skills\n4. Methods of\nAssessment\nCompetency in this unit may or must be assessed through\n4.1\nObservation\n4.2\nQuestioning\n4.3\nPractical demonstration\n5. Resource implications\nThe following resources should be provided\n5.1\nComputer hardware with peripherals\n5.2\nAppropriate software\n6. Context of\nAssessment\n6.1\nAssessment may be conducted in the workplace or in a\nsimulated environment\n\n--- PDF PAGE 28 ---\nTESDA-SOP-QSO-01-F08\nTR - HOUSEKEEPING NC II (Amended)\nPromulgated December 2013\n24\nUNIT OF COMPETENCY :\nPERFORM WORKPLACE AND SAFETY PRACTICES\n\nUNIT CODE\n:"
        },
        "source_text": "TRS311203\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes and\nvalues needed to perform computer operations which\nincludes inputting, accessing, producing and transferring\ndata using the appropriate hardware and software\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Plan and prepare for\ntask to be undertaken\n1.1\nRequirements of task are determined\n1.2\nAppropriate hardware and software is selected\naccording to task assigned and required outcome\n1.3\nTask is planned to ensure OHS guidelines and\nprocedures are followed\n2. Input data into\ncomputer\n2.1\nData are entered into the computer using appropriate\nprogram/application in accordance with company\nprocedures\n2.2\nAccuracy of information is checked and information is\nsaved in accordance with standard operating\nprocedures\n2.3\nInputted data are stored in storage media according to\nrequirements\n2.4\nWork is performed within ergonomic guidelines\n3. Access information\nusing computer\n3.1\nCorrect program/application is selected based on job\nrequirements\n3.2\nProgram/application containing the information required\nis accessed according to company procedures\n3.3\nDesktop icons are correctly selected, opened and\nclosed for navigation purposes\n3.4\nKeyboard techniques are carried out in line with OHS\nrequirements for safe use of keyboards\n4. Produce/output data\nusing computer system\n4.1\nEntered data are processed using appropriate software\ncommands\n4.2\nData are printed out as required using computer\nhardware/peripheral devices in accordance with\nstandard operating procedures\n4.3\nFiles and data are transferred between compatible\nsystems using computer software, hardware/ peripheral\ndevices in accordance with standard operating\nprocedures\n5. Maintain computer\nequipment and\nsystems\n5.1\nSystems for cleaning, minor maintenance and\nreplacement of consumables are implemented\n5.2\nProcedures for ensuring security of data, including\nregular back-ups and virus checks are implemented in\naccordance with standard operating procedures\n5.3\nBasic file maintenance procedures are implemented in\nline with the standard operating procedures\n5.4\nDocument systems are maintained\n\n--- PDF PAGE 26 ---\nTESDA-SOP-QSO-01-F08\nTR - HOUSEKEEPING NC II (Amended)\nPromulgated December 2013\n22\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Hardware and\nperipheral devices\nMay include:\n1.1\nPersonal computers\n1.2\nNetworked systems\n1.3\nCommunication equipment\n1.4\nPrinters\n1.5\nScanners\n1.6\nKeyboard\n1.7\nMouse\n2. Software\nMay include:\n2.1\nWord processing packages\n2.2\nData base packages\n2.3\nInternet\n2.4\nSpreadsheets\n3. OHS guidelines\nMay include:\n3.1\nOHS guidelines\n3.2\nEnterprise procedures\n4. Storage media\nMay include:\n4.1\ndiskettes\n4.2\nCDs\n4.3\nzip disks\n4.4\nhard disk drives, local and remote\n5. Ergonomic guidelines\nMay include:\n5.1\nTypes of equipment used\n5.2\nAppropriate furniture\n5.3\nSeating posture\n5.4\nLifting posture\n5.5\nVisual display unit screen brightness\n6. Desktop icons\nMay include:\n6.1\ndirectories/folders\n6.2\nfiles\n6.3\nnetwork devices\n6.4\nrecycle bin\n7. Maintenance\nMay include:\n7.1\nCreating more spaces in the hard disk\n7.2\nReviewing programs\n7.3\nDeleting unwanted files\n7.4\nBacking up files\n7.5\nChecking hard drive for errors\n7.6\nUsing up to date anti-virus programs\n7.7\nCleaning dust from internal and external surfaces\n\n--- PDF PAGE 27 ---\nTESDA-SOP-QSO-01-F08\nTR - HOUSEKEEPING NC II (Amended)\nPromulgated December 2013\n23\nEVIDENCE GUIDE\n\n1. Critical aspect of\nCompetency\nAssessment must show that the candidate:\n1.1\nSelected and used hardware components correctly and\naccording to the task requirement\n1.2\nIdentified and explain the functions of both hardware\nand software used, their general features and\ncapabilities\n1.3\nProduced accurate and complete data in accordance\nwith the requirements\n1.4\nUsed appropriate devices and procedures to transfer\nfiles/data accurately\n1.5\nMaintained computer system\n2. Required Knowledge\n2.1\nBasic ergonomics of keyboard and computer use\n2.2\nMain types of computers and basic features of different\noperating systems\n2.3\nMain parts of a computer\n2.4\nStorage devices and basic categories of memory\n2.5\nRelevant types of software\n2.6\nGeneral security\n2.7\nViruses\n2.8\nOHS principles and responsibilities\n2.9\nCalculating computer capacity\n3. Required Skills\n3.1\nReading skills required to interpret work instruction\n3.2\nCommunication skills\n4. Methods of\nAssessment\nCompetency in this unit may or must be assessed through\n4.1\nObservation\n4.2\nQuestioning\n4.3\nPractical demonstration\n5. Resource implications\nThe following resources should be provided\n5.1\nComputer hardware with peripherals\n5.2\nAppropriate software\n6. Context of\nAssessment\n6.1\nAssessment may be conducted in the workplace or in a\nsimulated environment\n\n--- PDF PAGE 28 ---\nTESDA-SOP-QSO-01-F08\nTR - HOUSEKEEPING NC II (Amended)\nPromulgated December 2013\n24\nUNIT OF COMPETENCY :\nPERFORM WORKPLACE AND SAFETY PRACTICES\n\nUNIT CODE\n:"
