  - unit_code: TRS5123113
    title: Provide valet/butler service
    descriptor: This unit of competency deals with the skills and knowledge required to provide valet/butler services in a
      commercial accommodation establishment.  This role would generally be undertaken by staff members with sound organizational
      and interpersonal skills within limit of responsibility.
    provenance:
      printed_pages: 40-42
      pdf_pages: 44-46
    elements:
    - element_id: TRS5123113:element:1
      number: 1
      title: Provide valet services to guests
      performance_criteria:
      - pc_id: TRS5123113:pc:1.1:1
        number: '1.1'
        text: Role of valet is defined in accordance with enterprise policy
      - pc_id: TRS5123113:pc:1.2:1
        number: '1.2'
        text: Valet services are prepared to be delivered
      - pc_id: TRS5123113:pc:1.3:1
        number: '1.3'
        text: Valet services is delivered within limit of responsibility
      - pc_id: TRS5123113:pc:1.4:1
        number: '1.4'
        text: Valet services is recorded
    - element_id: TRS5123113:element:2
      number: 2
      title: Display professional standards
      performance_criteria:
      - pc_id: TRS5123113:pc:2.1:1
        number: '2.1'
        text: Rapport is established and feelings of goodwill are enhanced between the guest within limit of responsibility
      - pc_id: TRS5123113:pc:2.2:1
        number: '2.2'
        text: Knowledge of individual guest’s records is accessed and utilized to provide personalized and quality services
          based on guest instructions and enterprise policy
      - pc_id: TRS5123113:pc:2.3:1
        number: '2.3'
        text: Valet grooming and communication standards are followed, in accordance with enterprise policy
    - element_id: TRS5123113:element:3
      number: 3
      title: Care for guest property 3.1   Luggage is set  in room based on guest  instructions and enterprise policy
      performance_criteria:
      - pc_id: TRS5123113:pc:3.2:1
        number: '3.2'
        text: Guest clothes may be processed based on guest instructions and enterprise policy
      - pc_id: TRS5123113:pc:3.3:1
        number: '3.3'
        text: Shoes are cleaned based on guest instructions
      - pc_id: TRS5123113:pc:3.4:1
        number: '3.4'
        text: Repairs are made or organized based on guest instructions, in accordance with enterprise policy
      - pc_id: TRS5123113:pc:3.5:1
        number: '3.5'
        text: Confidentiality of guest’s property and activities is maintained in accordance with legal and ethical requirements
    range_of_variables:
    - range_id: TRS5123113:range:1
      number: '1'
      variable: Guest records 1.1 Basic contact lists and details, as provided by the establishment 1.2 Basic customer preference
        profiles, as provided by the establishment
      values: []
      qualifier: May include
    - range_id: TRS5123113:range:2
