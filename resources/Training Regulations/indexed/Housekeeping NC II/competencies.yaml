        "source_text": "TRS311204\n\nUNIT DESCRIPTOR\n:\nThis unit of competency deals with the knowledge, skills\nand attitudes in following health, safety and security\npractices. It includes dealing with emergency situations\nand maintaining safe personal presentation standards.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized items are elaborated in the Range of Variables\n1. Follow workplace\nprocedures for health,\nsafety and security\npractices\n1.1 Correct health, safety and security procedures are\nfollowed in line with legislation, regulations and\nenterprise procedures\n1.2 Breaches of health, safety and security procedures are\nidentified and reported in line with enterprise procedure\n1.3 Suspicious behavior or unusual occurrence are reported\nin line with enterprise procedure\n2. Perform child\nprotection duties\nrelevant to the tourism\nindustry\n\n2.1 Issue of sexual exploitation of children is identified\n2.2 National, regional and international actions are\ndescribed to prevent the sexual exploitation of children\n2.3 Actions that can be taken in the workplace are\ndescribed to protect children from sexual exploitation\n3. Observe and monitor\npeople\n3.1 Areas and people who require observation and\nmonitoring is prepared\n3.2 Observation and monitoring activities are implemented\n3.3 Apprehension of offenders are determined\n3.4 Offenders are arrested according to enterprise\nprocedures\n3.5 Administrative responsibilities are fulfilled\n4. Deal with emergency\nsituations\n4.1 Emergency and potential emergency situations are\nrecognized and appropriate action are taken within\nindividual’s scope of responsibility\n4.2 Emergency procedures are followed in line with\nenterprise procedures\n4.3 Assistance is sought from colleagues to resolve or\nrespond to emergency situations\n4.4 Details of emergency situations are reported in line with\nenterprise procedures\n\n5. Maintain safe personal\npresentation standards\n5.1 Safe personal standards are identified and followed in\nline with enterprise requirements\n\n--- PDF PAGE 29 ---\nTESDA-SOP-QSO-01-F08\nTR - HOUSEKEEPING NC II (Amended)\nPromulgated December 2013\n25\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized items are elaborated in the Range of Variables\n6. Maintain a safe and\nsecure workplace\n6.1 Workplace health, safety and security responsibilities are\nidentified\n6.2 Framework to maintain workplace health, safety and\nsecurity are maintained\n6.3 Procedures for identifying and assessing health, safety\nand security hazards and risks are implemented\n6.4 Injuries, illnesses and incidents are investigated\n6.5 Organization's health, safety and security effectiveness\nare evaluated\n\n--- PDF PAGE 30 ---\nTESDA-SOP-QSO-01-F08\nTR - HOUSEKEEPING NC II (Amended)\nPromulgated December 2013\n26\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Health, safety and\nsecurity procedures\nMay include:\n1.1\nUse of personal protective clothing and equipment\n1.2\nSafe posture including sitting, standing, bending\n1.3\nManual handling including lifting, transferring\n1.4\nSafe work techniques including knives and equipment,\nhandling hot surfaces, computers and electronic\nequipment\n1.5\nSafe handling of chemicals, poisons and dangerous\nmaterials\n1.6\nErgonomically sound furniture and work stations\n1.7\nEmergency fire and accident\n1.8\nHazard identification and control\n1.9\nSecurity of documents, cash, equipment, people\n1.10 Key control systems\n2. Breaches of procedure\nMay include:\n2.1\nLoss of keys\n2.2\nStrange or suspicious persons\n2.3\nBroken or malfunctioning equipment\n2.4\nLoss of property, goods or materials\n2.5\nDamaged property or fittings\n2.6\nLack of suitable signage when required\n2.7\nLack of training on health and safety issues\n2.8\nUnsafe work practices\n3. Emergency\nMay include:\n3.1\nPersonal injuries\n3.2\nFire\n3.3\nElectrocution\n3.4\nNatural calamity i.e. earthquake/flood\n3.5\nCriminal acts i.e. robbery\n\n--- PDF PAGE 31 ---\nTESDA-SOP-QSO-01-F08\nTR - HOUSEKEEPING NC II (Amended)\nPromulgated December 2013\n27\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate :\n1.1\nComplied with industry practices and procedures\n1.2\nUsed interactive communication with others\n1.3\nComplied with workplace safety, security and hygiene\npractices\n1.4\nIdentified faults and problems and the necessary\ncorrective action\n1.5\nDemonstrated ability to perform child protection duties\nrelevant to the tourism industry\n1.6\nDemonstrated ability to prepare for observation and\nmonitoring activities relevant to designated situations\n1.7\nPromoted public relation among others\n1.8\nComplied with quality standards\n1.9\nResponded to emergency situations in line with\nenterprise guidelines\n1.10 Complied with proper dress code\n2. Required Knowledge\n2.1\nCommunication\n2.1.1 Interactive communication with others\n2.1.2 Interpersonal skills\n2.1.3 Good working attitude\n2.1.4 Ability to work quietly; with cooperation;\npatience, carefulness, cleanliness and aesthetic\nvalues\n2.1.5 Ability to focus on task at hand\n2.2\nSystems, Processes and Operations\n2.2.1 Workplace health, safety and security\nprocedures\n2.2.2 Emergency procedures\n2.2.3 Personal presentation\n2.3\nSafety Practices\n2.3.1 Proper disposal of garbage\n2.3.2 Practice safety measures\n2.3.3 5S Implementation\n2.4 Child protection duties relevant to tourism industry\n 2.4.1 Rules, regulations, policies and laws\n3. Required Skills\n3.1\nAbility to make decision\n3.2\nTime management\n3.3\nAbility to offer alternative steps\n3.4\nCare in handling and operating equipment\n3.5\nAbility to use observation and monitoring techniques\n\n4. Resource Implications\nThe following resources should be provided\n4.1\nProcedures Manual on safety, security, health and\nemergency\n4.2\nAvailability of tools, equipment, supplies and materials\n\n--- PDF PAGE 32 ---\nTESDA-SOP-QSO-01-F08\nTR - HOUSEKEEPING NC II (Amended)\nPromulgated December 2013\n28\n\n5. Methods of\nAssessment\nCompetency in this unit may or must be assessed through\n5.1\nWritten examination\n5.2\nPractical demonstration\n5.3\nInterview\n6. Context of\nAssessment\n6.1\nAssessment may be done in the workplace or in a\nsimulated workplace setting (assessment centers)\n6.2\nAssessment activities are carried out through TESDA's\naccredited assessment center\n\n--- PDF PAGE 33 ---\nTESDA-SOP-QSO-01-F08\nTR - HOUSEKEEPING NC II (Amended)\nPromulgated December 2013\n29\nUNIT OF COMPETENCY :\nPROVIDE EFFECTIVE CUSTOMER SERVICE\n\nUNIT CODE\n:"
