        "evidence_guide": {
          "source_text": "1. Critical aspects of\nCompetency\n\nAssessment requires evidence that the candidate:\n1.1\nDemonstrated ability to understand the importance of\ncleaning services to the overall quality of service\nprovided by the establishment/workplace\n1.2\nDemonstrated ability to safely and efficiently select and\nuse relevant equipment and cleaning agents in\naccordance with acceptable establishment/workplace\nprocedures\n2. Required Knowledge\n2.1\nCommunication\n2.1.1 Communication skills, oral and written\n2.1.2 Management skills\n2.1.3 Staff supervision and handling\n2.2\nSafety Practices\n2.2.1 Practice hygienic preparation and teamwork to\ncolleagues\n2.2.2 National/City/Municipality Occupational health\nand safety legislation\n2.3\nCleaning operations\n2.4\nCommon cleaning chemicals\n2.5\nTreatment of common hazards\n3. Required Skills\n3.1 Cleaning technique\n3.2 Safe handling of cleaning equipment, chemicals and\nagents/tools\n3.3 Time management skills\n3.4 Communication skills\n3.5 Basic mathematical computation skills\n3.6 Analytical skills\n4. Resource Implications\nThe following resources MUST be provided\n4.1\nWorkplace location\n4.2\nCleaning agents, equipment and tools\n5. Methods of\nAssessment\nCompetency in this unit may or must be assessed through\n5.1\nOral questioning\n5.2\nDirect observation/Practical demonstration\n5.3\nPortfolio\n6. Context of Assessment 6.1\nAssessment may be done in the workplace or in a\nsimulated workplace setting (assessment centers)\n6.2\nAssessment activities are carried out in TESDA’s\naccredited assessment centers\n\n--- PDF PAGE 54 ---\nTESDA-SOP-QSO-01-F08\nTR - HOUSEKEEPING NC II (Amended)\nPromulgated December 2013\n50\nUNIT OF COMPETENCY :\nDEAL WITH/HANDLE INTOXICATED GUESTS\n\nUNIT CODE\n:"
        },
        "source_text": "TRS512309115\n\nUNIT DESCRIPTOR\n:\nThis unit of competency deals with the knowledge and\nskills required in cleaning public areas, facilities and\nequipment. It includes selecting and setting up of\nequipment and materials; cleaning dry and wet areas;\nand, maintaining and storing cleaning equipment and\nmaterials.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Select and set up\nequipment and\nmaterials\n\n1.1\nEquipment are selected according to type of cleaning to\nbe done\n1.2\nAll equipment are checked if clean and in safe working\ncondition prior to use\n1.3\nSuitable dry and wet cleaning agents and chemicals\nare selected and prepared in accordance with\nmanufacturer’s and relevant occupational health and\nsafety requirements\n1.4\nProtective clothing are selected and used where\nnecessary\n2. Apply cleaning\ntechnique\n2.1\nFurniture, fixtures, ceilings and wallings are assessed\nfor cleaning\n2.2\nAppropriate cleaning equipment and chemicals are\nselected in accordance with the type of material used\n2.3\nCleaning technique is applied on furniture and walling\nmaterials in accordance with type of material used\n2.4\nAppropriate procedures is applied in accordance with\nthe technique\n2.5\nEquipment and chemicals are properly cleaned and\nstored in accordance with manufacturer’s specifications\nand requirements\n3. Clean dry and wet\nareas\n3.1\nWet and dry areas are prepared for cleaning and hazards\nare identified and assessed\n3.2\nThe work area is barricaded or warning signs are placed, as\nappropriate, to reduce risk to colleagues and customers\n3.3\nCleaning agents or chemicals are selected and applied on\nspecific areas in accordance with manufacturer’s\nrecommendations, safety procedures and enterprise policies\nand procedures\n3.4\nEquipment are used safely in accordance with\nmanufacturer's recommendations\n3.5\nGarbage and used chemicals are disposed off in accordance\nwith hygiene, safety and environmental legislation\nrequirements\n4. Maintain and store\ncleaning equipment\nand chemicals\n4.1\nEquipment are cleaned after use in accordance with\nenterprise requirements and manufacturer’s\ninstructions\n4.2\nRoutine preventive maintenance is carried out or\narranged in accordance with enterprise procedures\n4.3\nDefects are identified and reported in accordance with\nenterprise procedures\n4.4\nEquipment are stored in the designated area and in a\ncondition ready for re-use.\n4.5\nChemicals are stored and controlled in accordance with\nhealth and safety requirements.\n\n--- PDF PAGE 51 ---\nTESDA-SOP-QSO-01-F08\nTR - HOUSEKEEPING NC II (Amended)\nPromulgated December 2013\n47\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Occupational health,\nsafety and environment\nrequirements\nMay include:\n1.1\nEstablishment policies and procedures related to\ncleaning operations and disposal of used chemicals\n1.2\nLaws on general workplace safety, hazardous\nsubstances, and manual handling and storage\nrequirements\n1.3\nEstablishment security procedures\n2. Protective clothing\nMay include:\n2.1\noveralls\n2.2\njackets\n2.3\naprons\n2.4\ngoggles and masks\n2.5\nwaterproof clothing and footwear\n2.6\nheadwear\n3. Materials\nMay include:\n3.1\nglass\n3.2\nleather\n3.3\nfabrics\n3.4\nbrass/steel\n3.5\nwood\n3.6\ncarpet\n3.7\nhard floors\n4. Dry and wet areas\nMay include:\n4.1\nbathrooms\n4.2\nbedrooms\n4.3\nkitchens\n4.4\nbalconies\n4.5\nprivate lounge areas\n4.6\npublic areas (both internal and external)\n4.7\nfunction rooms\n4.8\nstorage areas\n4.9\nswimming pool\n\n5. Hazards\nMay include:\n5.1\nspillages\n5.2\nbreakages\n5.3\nwet or slippery surfaces\n5.4\nbroken or damaged furniture\n\n--- PDF PAGE 52 ---\nTESDA-SOP-QSO-01-F08\nTR - HOUSEKEEPING NC II (Amended)\nPromulgated December 2013\n48\n\nVARIABLE\nRANGE\n\n5.5\nfumes\n5.6\nblood\n5.7\nneedles and syringes\n5.8\nused condoms\n5.9\nsharp objects including knives and skewers\n5.10 human waste\n5.11 surgical dressings\n5.12 broken glass\n5.13 fat and oil\n5.14 heated utensils and surfaces\n5.15 sharp food scraps including bones and crustacean shells\n\n6. Chemicals\nMay include:\n6.1\ngeneral and spot cleaning agents\n6.2\ncleaning agents for specialized surfaces including\nwindow and glass cleaners\n6.3\ndisinfectants\n6.4\npesticides\n6.5\ndeodorizers\n6.6\nfurniture and floor polishers\n7. Equipment\nMay include:\n7.1 Scrubbers\n7.2 Polishers\n7.3 Vacuum cleaners\n\n8. Manufacturer\ninstructions\nMay include :\n8.1 cleaning and maintenance guidelines\n8.2 dosage and dilution of chemicals\n8.3 safety requirements\n\n--- PDF PAGE 53 ---\nTESDA-SOP-QSO-01-F08\nTR - HOUSEKEEPING NC II (Amended)\nPromulgated December 2013\n49\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\n\nAssessment requires evidence that the candidate:\n1.1\nDemonstrated ability to understand the importance of\ncleaning services to the overall quality of service\nprovided by the establishment/workplace\n1.2\nDemonstrated ability to safely and efficiently select and\nuse relevant equipment and cleaning agents in\naccordance with acceptable establishment/workplace\nprocedures\n2. Required Knowledge\n2.1\nCommunication\n2.1.1 Communication skills, oral and written\n2.1.2 Management skills\n2.1.3 Staff supervision and handling\n2.2\nSafety Practices\n2.2.1 Practice hygienic preparation and teamwork to\ncolleagues\n2.2.2 National/City/Municipality Occupational health\nand safety legislation\n2.3\nCleaning operations\n2.4\nCommon cleaning chemicals\n2.5\nTreatment of common hazards\n3. Required Skills\n3.1 Cleaning technique\n3.2 Safe handling of cleaning equipment, chemicals and\nagents/tools\n3.3 Time management skills\n3.4 Communication skills\n3.5 Basic mathematical computation skills\n3.6 Analytical skills\n4. Resource Implications\nThe following resources MUST be provided\n4.1\nWorkplace location\n4.2\nCleaning agents, equipment and tools\n5. Methods of\nAssessment\nCompetency in this unit may or must be assessed through\n5.1\nOral questioning\n5.2\nDirect observation/Practical demonstration\n5.3\nPortfolio\n6. Context of Assessment 6.1\nAssessment may be done in the workplace or in a\nsimulated workplace setting (assessment centers)\n6.2\nAssessment activities are carried out in TESDA’s\naccredited assessment centers\n\n--- PDF PAGE 54 ---\nTESDA-SOP-QSO-01-F08\nTR - HOUSEKEEPING NC II (Amended)\nPromulgated December 2013\n50\nUNIT OF COMPETENCY :\nDEAL WITH/HANDLE INTOXICATED GUESTS\n\nUNIT CODE\n:"
