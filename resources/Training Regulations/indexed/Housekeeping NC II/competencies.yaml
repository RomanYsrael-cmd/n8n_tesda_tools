        "source_title": "DEAL WITH/HANDLE INTOXICATED GUESTS",
        "source_text": "--- PDF PAGE 54 ---\nTESDA-SOP-QSO-01-F08 \nTR - HOUSEKEEPING NC II (Amended) \nPromulgated December 2013 \n50 \nUNIT OF COMPETENCY : \nDEAL WITH/HANDLE INTOXICATED GUESTS \n \nUNIT CODE \n: \n   TRS5123122 \n \nUNIT DESCRIPTOR \n: \nThis unit of competency deals with the knowledge, skills \nand attitude in handling or dealing with intoxicated \nguests at the workplace. It includes the knowledge and \nskills on how to determine the level of intoxication, \nproper approach, application of appropriate procedure \nand the knowledge on legislation for alcoholic drinks. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized  items are elaborated in the Range of Variables \n1. Determine the level of \nintoxication \n \n1.1 Level of intoxication of guest is assessed in \naccordance with industry procedure. \n1.2 Offered assistance politely to intoxicated guest in line \nwith enterprise procedure.    \n1.3 Urgently referred difficult situation to immediate boss as \nper enterprise regulations. \n1.4 Intoxicated guest lying on the floor is not touched but is \ncarefully watched in line with industry practice. \n1.5 Sought immediate assistance from hotel security \npersonnel for the situations that posing a threat to safety \nand security according to enterprise procedure.\n2. Apply appropriate \nprocedures \n \n2.1 Analyzed the situation carefully  \na. Applied procedures appropriate to the situation and \nin accordance with organizational policy  \nb. Explained politely  the position to the guest  using \nappropriate communication skills  \n2.2 Assisted the guest to leave the premises when \nnecessary in accordance with enterprise procedure.\n3. Comply with legislation \n3.1 Dealt with intoxicated persons in line with industry \npractice \n3.2 Dealt with underage drinkers with caution and care in \ncompliance with legal regulations \n3.3 Complied with legislative requirements as per alcoholic \nregulations\n \nRANGE OF VARIABLES \n \nVARIABLE\nRANGE\n1. Assess intoxication \nlevels  \nMay include: \n1.1 Changes in behavior  \n1.2 Monitoring noise level \n1.3 Monitoring drink orders  \n1.4 Slowing service. \n2. Assistance  \nMay include: \n2.1 Organizing transport for guest wishing to leave  \n2.2 Suggesting staying in a room in the hotel  \n2.3 Assisting guest to leave the premises\n\n--- PDF PAGE 55 ---\nTESDA-SOP-QSO-01-F08 \nTR - HOUSEKEEPING NC II (Amended) \nPromulgated December 2013 \n51 \n \nEVIDENCE GUIDE \n \n1.  Critical aspects of  \nCompetency \nAssessment requires evidence that the candidate/ trainee : \n1.1 Demonstrated full knowledge of the effects of alcohol \nand factors which influence guest’s actions. \n1.2 Demonstrated knowledge of legal requirements for \nalcohol service and consumption  \n1.3 Demonstrated knowledge of the benefits in creating \na responsible licensed drinking environment to self, \ncolleagues and customer/guests  \n1.4 Demonstrated knowledge of ways of assessing \nintoxication of guests. \n2.  Required Skills \n2.1 Dealt diplomatically on the disruptive intoxicated \nguests. \n2.2 Ability to communicate to make the guest understand \nthe position. \n2.3 Ability to demonstrate  respect and concern in \nhandling intoxicated guest\n3.  Required Knowledge  \n3.1 Manifested full understanding of legal requirements \nfor alcohol service and consumption. \n3.2 Demonstrated ability to manage intoxicated persons \nusing appropriate communication, conflict resolution \nand anger management techniques  \n3.3  Exhibited the ability to offer appropriate guests \nassistance. \n3.4 Manifested full knowledge of the effects of alcohol \nand factors which influence effects.  \n3.5 Discussed the knowledge of the benefits in creating \na responsible licensed drinking environment to self, \ncolleagues and guests  \n3.6 Demonstrated knowledge of ways of assessing \nintoxicated guests.\n4.  Resource Implications  \n4.1 Sources of information on the industry \n4.2\nIndustry knowledge about alcohol\n5.  Methods of \nAssessment \nCompetency in this unit may or must be assessed through \n5.1 Oral questions \n5.2 Written questions \n5.3 Work projects \n5.4 Workplace observation of practical skills \n5.5 Practical exercises/Role Play/Demonstration \n5.6 Formal report from supervisor \n6.  Context of  \nAssessment \n6.1 Assessment may be done in the workplace or in a \nsimulated workplace setting (assessment centers) \n6.2 Assessment activities are carried out through \nTESDA's accredited assessment center.\n",
