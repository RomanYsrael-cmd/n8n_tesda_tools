  - unit_code: TRS311205
    title: Provide effective customer service
    descriptor: This unit of competency deals with the knowledge, skills and attitudes in providing effective customer service.
      It includes greeting customer, identifying customer needs, delivering service to customer, handling queries through
      use of common business tools and technology and handling complaints/conflict situation, evaluation and recommendation.
    provenance:
      printed_pages: 29-33
      pdf_pages: 33-37
    elements:
    - element_id: TRS311205:element:1
      number: 1
      title: Greet customer
      performance_criteria:
