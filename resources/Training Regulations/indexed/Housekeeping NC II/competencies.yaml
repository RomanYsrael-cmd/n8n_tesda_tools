 are checked and appropriate \nadditional action is taken. \n3.3 Internal record and billing instructions are processed in \naccordance with enterprise procedures \n3.4 Necessary internal laundry reports are produced \n4. Return laundered item \n4.1 Guest clothes are delivered in accordance with \nenterprise policy \n4.2 In-house items are delivered in accordance with \nenterprise policy\n\n--- PDF PAGE 48 ---\nTESDA-SOP-QSO-01-F08 \nTR - HOUSEKEEPING NC II (Amended) \nPromulgated December 2013 \n44 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.  Cleaning process \nMay include: \n1.1  Dry clean \n1.2  Hand wash \n1.3  Machine wash \n \n2.  Laundry equipment  \n \nMay include: \n2.1 \nWashers \n2.2 \nDryers \n2.3 \nIrons \n2.4 \nSteam pressers \n2.5 \nSorting baskets and shelves \n2.6 \nHangers \n2.7 \nDrying cleaning machine \n2.8 \nLabeler \n3.  Laundering process \nMay include: \n3.1 Sorting \n3.2 Washing \n3.3 Stain treatment \n3.4 Drying \n3.5 Folding \n3.6 Ironing \n3.7 Steam pressing \n3.8 Mending \n3.9 Minor repairs such as buttons and zippers\n\n--- PDF PAGE 49 ---\nTESDA-SOP-QSO-01-F08 \nTR - HOUSEKEEPING NC II (Amended) \nPromulgated December 2013 \n45 \nEVIDENCE GUIDE \n \n1.  Critical aspects of \nCompetency \nAssessment requires evidence that the candidate:  \n1.1 \nDemonstrated ability to correctly identify the process \nrequired for different types of laundry \n1.2 \nDemonstrated ability to operate laundry equipment \nsafely \n1.3 \nDemonstrated ability to complete the full laundering \nprocess \n2.  Required Knowledge  \n2.1 \nTheory  \n2.1.1 Types of fabric and laundry equipment \n2.1.2 Meaning of laundry and dry cleaning labels on  \nclothing \n2.1.3 Key laundry terms  \n2.1.4 Common guest laundry issues \n2.2 \nSafety Practices \n2.2.1 Hygiene, health and safety issues on laundry \noperations  \n2.3 \nLaundry Chemicals/Solutions \n2.4 \nRole of an “on premise” laundry \n3.  Required Skills \n3.1 \nOperating laundry equipment  \n3.2 \nAbility to complete the full laundering process \n3.3 \nEstablishment linen handling procedures  \n3.4 \nUse of specific laundry chemicals  \n3.5 \nCommunication skills \n4.  Resource Implications  \nThe following resources MUST be provided \n4.1 \nVariety of linen, clothing items and fabrics \n4.2 \nIndustry laundry equipment  \n4.3 \nLaundry Chemicals/ Solutions \n 5.  Methods of \nAssessment \nCompetency in this unit may or must be assessed through \n5.1 \nOral questioning  \n5.2 \nPractical demonstration/direct observation \n5.3 \nPortfolio \n6.  Context of Assessment 6.1 \nAssessment may be done in the workplace or in a       \nsimulated workplace setting (assessment centers) \n6.2 \nAssessment activities are carried out in TESDA’s \naccredited assessment center\n",
