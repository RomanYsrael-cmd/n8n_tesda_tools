        "source_title": "PROVIDE HOUSEKEEPING SERVICES TO GUESTS",
        "source_text": "--- PDF PAGE 38 ---\nTESDA-SOP-QSO-01-F08 \nTR - HOUSEKEEPING NC II (Amended) \nPromulgated December 2013 \n34 \nCORE COMPETENCIES \n \nUNIT OF COMPETENCY : \nPROVIDE HOUSEKEEPING SERVICES TO GUESTS \n \nUNIT CODE \n: \nTRS5123111 \n \nUNIT DESCRIPTOR \n: \nThis unit of competency deals with the skills and \nknowledge required to provide a range of general \nhousekeeping services to guests.   \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1. Receive housekeeping \nrequests \n \n1.1 \nGuest/staff housekeeping requests and service \ndelivery are accepted and recorded in accordance to \nenterprise policies and procedure. \n1.2 \nDetails of requests made are confirmed and noted in \naccordance with enterprise procedures \n1.3 \nApologies are made when a request has arisen from a \ndelayed delivery of  service \n1.4 \nRequest not related to housekeeping are referred to \nappropriate department. \n2. Provide/ Service \nhousekeeping requests\n \n2.1 \nIdentified service/item is obtained through liaison with \nother staff in accordance with enterprise procedures \n2.2 \nRequired items are located and delivered to guest room \nin accordance with enterprise procedures \n2.3 \nEquipment is set up in guest room in accordance with \nthe request of the guest \n2.4 \nRequested items are removed from guest rooms in \naccordance with enterprise procedures. \n3. Provide advice to guest\n3.1 \nGuest is advised on services and items available \nthrough housekeeping department \n3.2 \nGuest is advised on use of items delivered to guest \nroom \n3.3 \nThe proper use of delivered item to the guest room is \ndemonstrated to guest \n3.4 \nLiaise with other staff and department to provide \nsupport services \n4. Liaise with other \ndepartments \n4.1 \nEquipment malfunction is reported to appropriate \npersonnel in accordance with enterprise procedures \n4.2 \nManagement is advised on dangerous or suspicious \ncircumstances in accordance with enterprise \nprocedures. \n4.3 \nOther departments are updated on the status of service \nrequests\n\n--- PDF PAGE 39 ---\nTESDA-SOP-QSO-01-F08 \nTR - HOUSEKEEPING NC II (Amended) \nPromulgated December 2013 \n35 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Requests  \nMay include: \n1.1 \nRange of services and products offered by the \nestablishment \n1.2 \nAvailability, hours and location of meals, services, \nequipment \n1.3 \nVarious types of equipment work \n2. Equipment \nMay include: \n2.1 \nelectric kettles  \n2.2 \nTransformers (step up- step down) \n2.3 \ncomputers \n2.4 \nvideo player \n2.5 \nconsole \n2.6 \nhairdryer \n2.7 \nirons and ironing board \n2.8 \nadaptors, wires and cables \n3. Requested items  \nMay include: \n3.1 \nRoll away beds \n3.2 \nadditional pillows and blankets & towels \n3.3 \nadditional room supplies \n3.4 \nfollow-up cleaning \n3.5 \ncleaning up spills \n3.6 \nrepairs and maintenance \n3.7 \nlost property inquiries \n3.8 \nchange of linen \n3.9 \nfirst aid kit \n3.10 baby sitting \n3.11 baby crib\n\n--- PDF PAGE 40 ---\nTESDA-SOP-QSO-01-F08 \nTR - HOUSEKEEPING NC II (Amended) \nPromulgated December 2013 \n36 \nEVIDENCE GUIDE \n \n1. Critical aspects of \nCompetency \n \nAssessment requires evidence that the candidate: \n1.1 \nDemonstrated ability to offer courteous, prompt and \nfriendly service to guest \n1.2 \nDemonstrated knowledge and skills of a range of \nhousekeeping services/materials/solutions and \nequipment  \n2.  Required Knowledge  \n2.1 \nKnowledge on typical housekeeping services and \nprocedures \n2.2 \nKnowledge on materials/solutions and equipment \n \n 3.  Required Skills \n3.1 \nSecurity and safety procedures as they apply to \nhousekeeping services and guests \n3.2 \nDemonstrate responding to multiple and various types \nof guests \n3.3 \nTime management skills  \n4.  Resource Implications \nThe following resources MUST be provided \n4.1 \nFully operational equipment in an accommodation \nenvironment, including guests rooms and various \nhousekeeping equipment and solutions \n5. Methods of \nAssessment \nCompetency in this unit may or must be assessed through \n5.1 \nQuestioning \n5.2 \nPractical demonstration/direct observation \n5.3 \nPortfolio evidence \n5.4 \nInterview \n6. Context of  Assessment 6.1 \nAssessment may be done in the workplace or in a \nsimulated workplace setting (assessment centers) \n6.2 \nAssessment activities are carried out through TESDA’s \naccredited assessment center\n",
