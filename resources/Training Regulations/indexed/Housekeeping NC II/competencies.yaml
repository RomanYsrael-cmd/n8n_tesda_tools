schema: tesda-competency-standards
schema_version: '1.1'
qualification_id: tesda:tr:housekeeping-nc-ii:2013-12-amended
qualification: Housekeeping NC II
representation_type: semantic_normalized
verbatim_transcription: false
source:
  authority: Technical Education and Skills Development Authority (TESDA)
  source_heading: SECTION 2 COMPETENCY STANDARDS
  promulgated: 2013-12
  revision_status: Amended
  printed_pages: 2-51
  pdf_pages: 6-55
groups:
  basic:
  - unit_code: '500311105'
    title: Participate in workplace communication
    descriptor: This unit covers the knowledge, skills and attitudes required to gather, interpret and convey information
      in response to workplace requirements.
    provenance:
      printed_pages: 2-4
      pdf_pages: 6-8
    elements:
    - element_id: 500311105:element:1
      number: 1
      title: Obtain and convey workplace information
      performance_criteria:
      - pc_id: 500311105:pc:1.1:1
        number: '1.1'
        text: Specific and  relevant information is accessed from appropriate sources
      - pc_id: 500311105:pc:1.2:1
        number: '1.2'
        text: Effective questioning , active listening and speaking skills are used to gather and convey information
      - pc_id: 500311105:pc:1.3:1
        number: '1.3'
        text: Appropriate medium is used to transfer information and ideas
      - pc_id: 500311105:pc:1.4:1
        number: '1.4'
        text: Appropriate non- verbal communication is used
      - pc_id: 500311105:pc:1.5:1
        number: '1.5'
        text: Appropriate lines of communication with supervisors and colleagues are identified and followed
      - pc_id: 500311105:pc:1.6:1
        number: '1.6'
        text: Defined workplace procedures for the location and storage of information are used
      - pc_id: 500311105:pc:1.7:1
        number: '1.7'
        text: Personal interaction is carried out clearly and concisely
    - element_id: 500311105:element:2
      number: 2
      title: Speak English at a basic operational level
      performance_criteria:
      - pc_id: 500311105:pc:2.1:1
        number: '2.1'
        text: Simple conversations on familiar topics with work colleagues is participated
      - pc_id: 500311105:pc:2.2:1
        number: '2.2'
        text: Simple verbal instructions or requests are responded to
      - pc_id: 500311105:pc:2.3:1
        number: '2.3'
        text: Simple requests are made
      - pc_id: 500311105:pc:2.4:1
        number: '2.4'
        text: Routine procedures are described
      - pc_id: 500311105:pc:2.5:1
        number: '2.5'
        text: Likes, dislikes and preferences are expressed
      - pc_id: 500311105:pc:2.6:1
        number: '2.6'
        text: Different forms of expression in English is identified
    - element_id: 500311105:element:3
      number: 3
      title: Participate in workplace meetings and discussions
      performance_criteria:
      - pc_id: 500311105:pc:3.1:1
        number: '3.1'
        text: Team meetings are attended on time
      - pc_id: 500311105:pc:3.2:1
        number: '3.2'
        text: Own opinions are clearly expressed and those of others are listened to without interruption
      - pc_id: 500311105:pc:3.3:1
        number: '3.3'
        text: Meeting inputs are consistent with the meeting purpose and established protocols
      - pc_id: 500311105:pc:3.4:1
        number: '3.4'
        text: Workplace interactions are conducted in a courteous manner
      - pc_id: 500311105:pc:3.5:1
        number: '3.5'
        text: Questions about simple routine workplace procedures and maters concerning working conditions of employment are
          asked and responded to
      - pc_id: 500311105:pc:3.6:1
        number: '3.6'
        text: Meetings outcomes are interpreted and implemented
    - element_id: 500311105:element:4
      number: 4
      title: Complete relevant work related documents
      performance_criteria:
      - pc_id: 500311105:pc:4.1:1
        number: '4.1'
        text: Range of forms relating to conditions of employment are completed accurately and legibly
      - pc_id: 500311105:pc:4.2:1
        number: '4.2'
        text: Workplace data is recorded on standard workplace forms and documents
      - pc_id: 500311105:pc:4.3:1
        number: '4.3'
        text: Basic mathematical processes are used for routine calculations
      - pc_id: 500311105:pc:4.4:1
        number: '4.4'
        text: Errors in recording information on forms/ documents are identified and properly acted upon
      - pc_id: 500311105:pc:4.5:1
        number: '4.5'
        text: Reporting requirements to supervisor are completed according to organizational guidelines
    range_of_variables:
    - range_id: 500311105:range:1
      number: '1'
      variable: Appropriate sources 1.1 Team members 1.2 Suppliers 1.3 Trade personnel 1.4 Local government 1.5 Industry bodies
      values: []
    - range_id: 500311105:range:2
      number: '2'
      variable: Medium 2.1 Memorandum 2.2 Circular 2.3 Notice 2.4 Information discussion 2.5 Follow-up or verbal  instructions
        2.6 Face to face communication
      values: []
    - range_id: 500311105:range:3
      number: '3'
      variable: Storage 3.1 Manual filing system 3.2 Computer-based filing system
      values: []
    - range_id: 500311105:range:4
      number: '4'
      variable: Forms 4.1 Personnel forms, telephone message forms, safety reports
      values: []
    - range_id: 500311105:range:5
      number: '5'
      variable: Workplace interactions 5.1 Face to face 5.2 Telephone 5.3 Electronic and two way radio 5.4 Written including
        electronic, memos, instruction and forms, non-verbal including gestures, signals, signs and diagrams
      values: []
    - range_id: 500311105:range:6
      number: '6'
      variable: Protocols 6.1 Observing meeting 6.2 Compliance with meeting decisions 6.3 Obeying meeting instructions
      values: []
    evidence_guide:
      critical_aspects:
        intro: 'Competency Assessment requires evidence that the candidate:'
        items:
        - number: '1.1'
          text: Prepared written communication following standard format of the organization
        - number: '1.2'
          text: Accessed information using communication equipment
        - number: '1.3'
          text: Spoken English at a basic operational level
        - number: '1.4'
          text: Made use of relevant terms as an aid to transfer information effectively
        - number: '1.5'
          text: Conveyed information effectively adopting the formal or informal communication
      underpinning_knowledge:
        intro: Knowledge
        items:
        - number: '2.1'
          text: Effective communication
        - number: '2.2'
          text: Different modes of communication
        - number: '2.3'
          text: Written communication
        - number: '2.4'
          text: Organizational policies
        - number: '2.5'
          text: Communication procedures and systems
        - number: '2.6'
          text: Technology relevant to the enterprise and the individual’s work responsibilities
      underpinning_skills:
        items:
        - number: '3.1'
          text: Follow simple spoken language
        - number: '3.2'
          text: Perform routine workplace duties following simple written notices
        - number: '3.3'
          text: Participate in workplace meetings and discussions
        - number: '3.4'
          text: Complete work related documents
        - number: '3.5'
          text: Estimate, calculate and record routine workplace measures
        - number: '3.6'
          text: Basic mathematical processes of addition, subtraction, division and multiplication
        - number: '3.7'
          text: Ability to relate to people of social range in the workplace
        - number: '3.8'
          text: Gather and provide information in response to workplace requirements
      resource_implications:
        intro: Implications
        items:
        - number: '4.1'
          text: Fax machine
        - number: '4.2'
          text: Telephone
        - number: '4.3'
          text: Writing materials
        - number: '4.4'
          text: Internet
      methods_of_assessment:
        intro: Assessment
        items:
        - number: '5.1'
          text: Direct Observation
        - number: '5.2'
          text: Oral interview and written test
      context_of_assessment:
        intro: Assessment
        items:
        - number: '6.1'
          text: Competency may be assessed individually in the actual workplace or through accredited institution
    evidence_guide_source_labels:
      critical_aspects: 'Critical aspects of Competency Assessment requires evidence that the candidate:'
      underpinning_knowledge: Underpinning Knowledge
      underpinning_skills: Underpinning Skills
      resource_implications: Resource Implications
      methods_of_assessment: Methods of Assessment
      context_of_assessment: Context of Assessment
  - unit_code: '500311106'
    title: Work in team environment
    descriptor: This unit covers the skills, knowledge and attitudes to identify role and responsibility as a member of a
      team.
    provenance:
      printed_pages: 5-7
      pdf_pages: 9-11
    elements:
    - element_id: 500311106:element:1
      number: 1
      title: Describe team role and scope
      performance_criteria:
      - pc_id: 500311106:pc:1.1:1
        number: '1.1'
        text: The role and objective of the team is identified from available sources of information
      - pc_id: 500311106:pc:1.2:1
        number: '1.2'
        text: Team parameters, reporting relationships and responsibilities are identified from team discussions and appropriate
          external sources
    - element_id: 500311106:element:2
      number: 2
      title: Identify own role and responsibility within team
      performance_criteria:
      - pc_id: 500311106:pc:2.1:1
        number: '2.1'
        text: Individual role and responsibilities within the team environment are identified
      - pc_id: 500311106:pc:2.2:1
        number: '2.2'
        text: Roles and responsibility of other team members are identified and recognized
      - pc_id: 500311106:pc:2.3:1
        number: '2.3'
        text: Reporting relationships within team and external to team are identified
    - element_id: 500311106:element:3
      number: 3
      title: Work as a team member
      performance_criteria:
      - pc_id: 500311106:pc:3.1:1
        number: '3.1'
        text: Effective and appropriate forms of communications used and interactions undertaken with team members who contribute
          to known team activities and objectives
      - pc_id: 500311106:pc:3.2:1
        number: '3.2'
        text: Effective and appropriate contributions made to complement team activities and objectives, based on individual
          skills and competencies and workplace context
      - pc_id: 500311106:pc:3.3:1
        number: '3.3'
        text: Observed protocols in reporting using standard operating procedures
      - pc_id: 500311106:pc:3.4:1
        number: '3.4'
        text: Contribute to the development of team work plans based on an understanding of team’s role and objectives and
          individual competencies of the members.
    - element_id: 500311106:element:4
      number: 4
      title: Work effectively with colleagues
      performance_criteria:
      - pc_id: 500311106:pc:4.1:1
        number: '4.1'
        text: Information is communicated clearly and in concise manner using appropriate communication techniques
      - pc_id: 500311106:pc:4.2:1
        number: '4.2'
        text: Relationships are established and maintained effectively with colleagues
      - pc_id: 500311106:pc:4.3:1
        number: '4.3'
        text: Work activities are performed within the team to ensure achievement of team goals
    - element_id: 500311106:element:5
      number: 5
      title: Work in socially diverse environment
      performance_criteria:
      - pc_id: 500311106:pc:5.1:1
        number: '5.1'
        text: Customers and colleagues from diverse backgrounds are communicated with, in all verbal and non-verbal forms
      - pc_id: 500311106:pc:5.2:1
        number: '5.2'
        text: Cross cultural misunderstandings are dealt with, taking account of cultural consideration
    range_of_variables:
    - range_id: 500311106:range:1
      number: '1'
      variable: Role and objective of team 1.1 Work activities in a team environment with enterprise or specific sector 1.2
        Limited discretion, initiative and judgement maybe demonstrated on the job, either individually or in a team environment
      values: []
    - range_id: 500311106:range:2
      number: '2'
      variable: Sources of information 2.1 Standard operating and/or other workplace procedures 2.2 Job procedures 2.3 Machine/equipment
        manufacturer’s specifications and instructions 2.4 Organizational or external personnel 2.5 Client/supplier instructions
        2.6 Quality standards 2.7 OHS and environmental standards
      values: []
    - range_id: 500311106:range:3
      number: '3'
      variable: Workplace context 3.1 Work procedures and practices 3.2 Conditions of work environments 3.3 Legislation and
        industrial agreements 3.4 Standard work practice including the storage, safe handling and disposal of chemicals 3.5
        Safety, environmental, housekeeping and quality guidelines
      values: []
    - range_id: 500311106:range:4
      number: '4'
      variable: Appropriate communication techniques
      values:
      - number: '4.1'
        text: Use of active listening
      - number: '4.2'
        text: Use of both open and closed questions
      - number: '4.3'
        text: Speaking clearly and concisely
      - number: '4.4'
        text: Using appropriate language and tone of voice
      - number: '4.6'
        text: Being attentive
      qualifier: May include
    evidence_guide:
      critical_aspects:
        intro: 'Competency Assessment requires evidence that the candidate:'
        items:
        - number: '1.1'
          text: Operated in a team to complete workplace activity
        - number: '1.2'
          text: Worked effectively with others
        - number: '1.3'
          text: Worked in socially diverse environment
        - number: '1.4'
          text: Conveyed information in written or oral form
        - number: '1.5'
          text: Selected and used appropriate workplace language
        - number: '1.6'
          text: Followed designated work plan for the job
        - number: '1.7'
          text: Reported outcomes
      underpinning_knowledge:
        intro: Knowledge
        items:
        - number: '2.1'
          text: Communication process
        - number: '2.2'
          text: Team structure
        - number: '2.3'
          text: Team roles
        - number: '2.4'
          text: Group planning and decision making
        - number: '2.5'
          text: Specific diversity issues
      underpinning_skills:
        items:
        - number: '3.1'
          text: Communicate appropriately, consistent with the culture of the workplace
      resource_implications:
        intro: 'The following resources MUST be provided:'
        items:
        - number: '4.1'
          text: Access to relevant workplace or appropriately simulated environment where assessment can take place
        - number: '4.2'
          text: Materials relevant to the proposed activity or tasks
      methods_of_assessment:
        intro: 'Assessment Competency may be assessed through:'
        items:
        - number: '5.1'
          text: Observation   of the individual member in relation to the work activities of the group
        - number: '5.2'
          text: Observation of simulation and or role play involving the participation of individual member to the attainment
            of organizational goal
        - number: '5.3'
          text: Case studies and scenarios as a basis for discussion of issues and strategies in teamwork
      context_of_assessment:
        intro: Assessment
        items:
        - number: '6.1'
          text: Competency may be assessed in workplace or in a simulated workplace setting
        - number: '6.2'
          text: Assessment shall be observed while task are being undertaken whether individually or in group
    evidence_guide_source_labels:
      critical_aspects: 'Critical aspects of Competency Assessment requires evidence that the candidate:'
      underpinning_knowledge: Underpinning Knowledge
      underpinning_skills: Underpinning Skills
      resource_implications: 'Resource Implications The following resources MUST be provided:'
      methods_of_assessment: 'Methods of Assessment Competency may be assessed through:'
      context_of_assessment: Context for Assessment
    fidelity_refs:
    - tesda:housekeeping-nc-ii:anomaly:range-numbering-500311106
  - unit_code: '500311107'
    title: Practice career professionalism
    descriptor: This unit covers the knowledge, skills and attitudes in promoting career growth and advancement.
    provenance:
      printed_pages: 8-10
      pdf_pages: 12-14
    elements:
    - element_id: 500311107:element:1
      number: 1
      title: Integrate personal objectives with organizational goals
      performance_criteria:
      - pc_id: 500311107:pc:1.1:1
        number: '1.1'
        text: Personal growth and work plans are pursued towards improving the qualifications set for the profession
      - pc_id: 500311107:pc:1.2:1
        number: '1.2'
        text: Intra- and interpersonal relationships are maintained in the course of managing oneself based on performance
          evaluation
      - pc_id: 500311107:pc:1.3:1
        number: '1.3'
        text: Commitment to the organization and its goal is demonstrated in the performance of duties
    - element_id: 500311107:element:2
      number: 2
      title: Set and meet work priorities
      performance_criteria:
      - pc_id: 500311107:pc:2.1:1
        number: '2.1'
        text: Competing demands are prioritized to achieve personal, team and organizational goals and objectives.
      - pc_id: 500311107:pc:2.2:1
        number: '2.2'
        text: Resources are utilized efficiently and effectively to manage work priorities and commitments
      - pc_id: 500311107:pc:2.3:1
        number: '2.3'
        text: Practices along economic use and maintenance of equipment and facilities are followed  as per established procedures
    - element_id: 500311107:element:3
      number: 3
      title: Maintain professional growth and development
      performance_criteria:
      - pc_id: 500311107:pc:3.1:1
        number: '3.1'
        text: Trainings and career opportunities are identified and availed of  based on job requirements
      - pc_id: 500311107:pc:3.2:1
        number: '3.2'
        text: Recognitions are sought/received and demonstrated as proof of career advancement
      - pc_id: 500311107:pc:3.3:1
        number: '3.3'
        text: Licenses and/or certifications relevant to job and career are obtained and renewed
    range_of_variables:
    - range_id: 500311107:range:1
      number: '1'
      variable: Evaluation 1.1 Performance Appraisal 1.2 Psychological Profile 1.3 Aptitude Tests
      values: []
    - range_id: 500311107:range:2
      number: '2'
      variable: Resources 2.1 Human 2.2 Financial 2.3 Technology
      values:
      - number: 2.3.1
        text: Hardware
      - number: 2.3.2
        text: Software
    - range_id: 500311107:range:3
      number: '3'
      variable: Trainings and career opportunities 3.1 Participation in training programs
      values:
      - number: 3.1.1
        text: Technical
      - number: 3.1.2
        text: Supervisory
      - number: 3.1.3
        text: Managerial
      - number: 3.1.4
        text: Continuing Education 3.2 Serving as Resource Persons in conferences and workshops
    - range_id: 500311107:range:4
      number: '4'
      variable: Recognitions 4.1 Recommendations 4.2 Citations 4.3 Certificate of Appreciations 4.4 Commendations 4.5 Awards
        4.6 Tangible and Intangible Rewards
      values: []
    - range_id: 500311107:range:5
      number: '5'
      variable: Licenses and/or certifications 5.1 National Certificates 5.2 Certificate of Competency 5.3 Support Level Licenses
        5.4 Professional Licenses
      values: []
    evidence_guide:
      critical_aspects:
        intro: 'Competency Assessment requires evidence that the candidate:'
        items:
        - number: '1.1'
          text: Attained job targets within key result areas (KRAs)
        - number: '1.2'
          text: Maintained intra - and interpersonal relationship in the course of managing oneself based on performance evaluation
        - number: '1.3'
          text: Completed trainings and career opportunities which are based on the requirements of the industries
        - number: '1.4'
          text: Acquired and maintained licenses and/or certifications according to the requirement of the qualification
      underpinning_knowledge:
        intro: Knowledge
        items:
        - number: '2.1'
          text: Work values and ethics (Code of Conduct, Code of Ethics, etc.)
        - number: '2.2'
          text: Company policies
        - number: '2.3'
          text: Company operations, procedures and standards
        - number: '2.4'
          text: Fundamental rights at work including gender sensitivity
        - number: '2.5'
          text: Personal hygiene practices
      underpinning_skills:
        items:
        - number: '3.1'
          text: Appropriate practice of personal hygiene
        - number: '3.2'
          text: Intra and Interpersonal skills
        - number: '3.3'
          text: Communication skills
      resource_implications:
        intro: 'The following resources MUST be provided:'
        items:
        - number: '4.1'
          text: Workplace or assessment location
        - number: '4.2'
          text: Case studies/scenarios
      methods_of_assessment:
        intro: 'Assessment Competency may be assessed through:'
        items:
        - number: '5.1'
          text: Portfolio Assessment
        - number: '5.2'
          text: Interview
        - number: '5.3'
          text: Simulation/Role-plays
        - number: '5.4'
          text: Observation
        - number: '5.5'
          text: Third Party Reports
        - number: '5.6'
          text: Exams and Tests
      context_of_assessment:
        items:
        - number: '6.1'
          text: Competency may be assessed in the work place or in a simulated work place setting
    evidence_guide_source_labels:
      critical_aspects: 'Critical aspects of Competency Assessment requires evidence that the candidate:'
      underpinning_knowledge: Underpinning Knowledge
      underpinning_skills: Underpinning Skills
      resource_implications: 'Resource Implications The following resources MUST be provided:'
      methods_of_assessment: 'Methods of Assessment Competency may be assessed through:'
      context_of_assessment: Context of Assessment
  - unit_code: '500311108'
    title: Practice occupational health and safety procedures
    descriptor: This unit covers the outcomes required to comply with regulatory and organizational requirements for occupational
      health and safety.
    provenance:
      printed_pages: 11-13
      pdf_pages: 15-17
    elements:
    - element_id: 500311108:element:1
      number: 1
      title: Identify hazards and risks
      performance_criteria:
      - pc_id: 500311108:pc:1.1:1
        number: '1.1'
        text: Safety regulations and workplace safety and hazard control practices and procedures are clarified and explained
          based on organization procedures
      - pc_id: 500311108:pc:1.2:1
        number: '1.2'
        text: Hazards/risks in the workplace and their corresponding indicators are identified to minimize or eliminate risk
          to co-workers, workplace and environment in accordance with organization procedures
      - pc_id: 500311108:pc:1.3:1
        number: '1.3'
        text: Contingency measures during workplace accidents, fire and other emergencies are recognized and established in
          accordance with organization procedures
    - element_id: 500311108:element:2
      number: 2
      title: Evaluate hazards and risks
      performance_criteria:
      - pc_id: 500311108:pc:2.1:1
        number: '2.1'
        text: Terms of maximum tolerable limits which when exceeded will result in harm or damage are identified based on
          threshold limit values (TLV)
      - pc_id: 500311108:pc:2.2:1
        number: '2.2'
        text: Effects of the hazards are determined
      - pc_id: 500311108:pc:2.3:1
        number: '2.3'
        text: OHS issues and/or concerns and identified safety hazards are reported to designated personnel in accordance
          with workplace requirements and relevant workplace OHS legislation
    - element_id: 500311108:element:3
      number: 3
      title: Control hazards and risks
      performance_criteria:
      - pc_id: 500311108:pc:3.1:1
        number: '3.1'
        text: Occupational Health and Safety (OHS) procedures for controlling hazards/risks in workplace are consistently
          followed
      - pc_id: 500311108:pc:3.2:1
        number: '3.2'
        text: Procedures for dealing with workplace accidents, fire and emergencies are followed in accordance with organization
          OHS policies
      - pc_id: 500311108:pc:3.3:1
        number: '3.3'
        text: Personal protective equipment (PPE) is correctly used in accordance with organization OHS procedures and practices
      - pc_id: 500311108:pc:3.4:1
        number: '3.4'
        text: Appropriate assistance is provided in the event of a workplace emergency in accordance with established organization
          protocol
    - element_id: 500311108:element:4
      number: 4
      title: Maintain OHS awareness
      performance_criteria:
      - pc_id: 500311108:pc:4.1:1
        number: '4.1'
        text: Emergency-related drills and trainings are participated in as per established organization guidelines and procedures
      - pc_id: 500311108:pc:4.2:1
        number: '4.2'
        text: OHS personal records are completed and updated in accordance with workplace requirements
    - element_id: 500311108:element:5
      number: 5
      title: Perform basic first-aid procedures
      performance_criteria:
      - pc_id: 500311108:pc:5.1:1
        number: '5.1'
        text: Situation is assessed in accordance with accepted practice
      - pc_id: 500311108:pc:5.2:1
        number: '5.2'
        text: Basic first-aid techniques is applied in accordance with established first-aid procedures and enterprise policy
      - pc_id: 500311108:pc:5.3:1
        number: '5.3'
        text: Details of the incident is communicated in a timely manner according to enterprise policy
    range_of_variables:
    - range_id: 500311108:range:1
      number: '1'
      variable: Safety regulations 1.1 Clean Air Act 1.2 Building code 1.3 National Electrical and Fire Safety Codes 1.4 Waste
        management statutes and rules 1.5 Philippine Occupational Safety and Health Standards 1.6 DOLE regulations on safety
        legal requirements 1.7 ECC regulations
      values: []
      qualifier: May include
    - range_id: 500311108:range:2
      number: '2'
      variable: Hazards/Risks 2.1 Physical hazards – impact, illumination, pressure, noise, vibration, temperature, radiation
        2.2 Biological hazards- bacteria, viruses, plants, parasites, mites, molds, fungi, insects 2.3 Chemical hazards –
        dusts, fibers, mists, fumes, smoke, gasses, vapors 2.4 Ergonomics
      values:
      - number: 2.4.1
        text: Psychological factors – over exertion/ excessive force, awkward/static positions, fatigue, direct pressure,
