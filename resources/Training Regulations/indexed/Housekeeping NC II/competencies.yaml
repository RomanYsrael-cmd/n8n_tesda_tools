        "source_title": "CLEAN AND PREPARE ROOMS FOR INCOMING GUESTS",
        "source_text": "--- PDF PAGE 41 ---\nTESDA-SOP-QSO-01-F08 \nTR - HOUSEKEEPING NC II (Amended) \nPromulgated December 2013 \n37 \nUNIT OF COMPETENCY : \nCLEAN AND PREPARE ROOMS FOR INCOMING \nGUESTS  \n \nUNIT CODE \n: \nTRS5123112 \n \nUNIT DESCRIPTOR \n: \nThe unit deals with the skills and knowledge required \nfrom housekeeping attendants to clean and prepare \nrooms \nfor \nincoming \nguests \nin \na \ncommercial \naccommodation establishment. \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variable\n1. Set up equipment and \ntrolleys \n \n1.1 Cleaning, supplies and equipment required for servicing \nrooms are correctly selected and prepared for use  \n1.2 Supplies for trolleys are accurately identified and selected or \nordered in sufficient numbers in accordance with enterprise \nprocedures \n1.3 Trolleys are safely loaded with adequate supplies in \naccordance with enterprise procedures \n2.  Access rooms for \nservicing \n2.1 Rooms requiring service are correctly identified based on \ninformation supplied to housekeeping staff \n2.2 Rooms are accessed in accordance with the establishment’s \ncustomer service and security procedures \n3.  Make up beds\n3.1 Beds and mattresses are stripped,  pillows and   linen are \nchecked for stains and damage rooms are checked whether \nguests left any valuables \n3.2 Items with stains are immediately segregated and  forwarded \nto the Laundry Department  for proper processing \n3.3 Bed linens are replaced in accordance with enterprise \nstandards and procedures  \n4.  Clean and clear rooms\n4.1 Rooms are cleaned in correct order and with minimum \ndisruption to guests \n4.2 All furniture, fixtures and fittings are cleaned and checked \nin accordance with enterprise procedures and hygiene/safety \nguidelines \n4.3 Room supplies are checked, replenished or replaced in \naccordance with enterprise standards and procedures \n4.4 Pests are promptly identified and appropriate action is taken in \naccordance with safety and enterprise procedures \n4.5 Rooms are checked for any defects and  are accurately \nreported in accordance with enterprise procedures \n4.6 Damaged items are recorded in accordance with enterprise \nprocedures \n4.7 Any unusual or suspicious person, item or occurrence is \npromptly reported in accordance with enterprise procedures \n4.8 Guest’s belongings left in vacated rooms  are collected and \nstored in accordance with lost and found enterprise \nprocedures  \n5.  Clean and store trolleys \nand equipment \n5.1 Trolleys and equipment are cleaned after use in \naccordance with safety and enterprise procedures \n5.2 All items are correctly stored in accordance with enterprise  \nprocedures \n5.3 Supplies and items are checked and replenished or re-\nordered in accordance with enterprise procedures \n5.4 Additional housekeeping services is provided as requested \nin accordance with enterprise procedures \n5.5 Turn over procedure for next shift is carried out in \naccordance with enterprise procedures\n\n--- PDF PAGE 42 ---\nTESDA-SOP-QSO-01-F08 \nTR - HOUSEKEEPING NC II (Amended) \nPromulgated December 2013 \n38 \nRANGE OF VARIABLES  \n \nVARIABLE \nRANGE \n1.  Cleaning supplies and \nequipment   \n \n \nMay include: \n1.1 \nCleaning agents, disinfectant and chemicals \n1.2 \nVacuum cleaner \n1.3 \nMops \n1.4 \nBrushes \n1.5 \nBuckets \n1.6 \nCaddy \n1.7 \nCarpet sweeper \n1.8 \nCleaning and polishing cloths \n1.9 \nProtective clothing \n1.10 Brooms \n1.11 Dust pans \n1.12 Squeegee \n \n2.  Furniture, fixtures and \nfittings   \nMay include: \n2.1 \nfloor surfaces \n2.2 \nmirrors and glassware \n2.3 \nwardrobes and luggage rack \n2.4 \ndesks and chairs \n2.5 \ncoffee table and sofa \n2.6 \nlight fittings and table lamp \n2.7 \nbedside table \n2.8 \ntelephones \n2.9 \ntelevisions \n2.10 mini fridge \n2.11 shelving \n2.12 air conditioning controls \n2.13 safety deposit box \n \n \n3.  Room supplies   \nMay include: \n3.1 \nstationery and compendium \n3.2 \nbed and bathroom linen \n3.3 \nenterprise promotional materials \n3.4 \nlocal tourist information \n3.5 \nmagazines and newspapers \n3.6 \nmini-bar supplies \n3.7 \nglass ware and cutlery \n3.8 \ntea, coffee, sugar, milk and water \n3.9 \ndiscretionary supplies and gifts such as fruit, beverages, \nchocolates, flowers \n3.10 slippers \n3.11 flashlight \n3.12 laundry bags and list \n3.13 shoe shine kit and basket/sewing kit \n3.14 personal hygiene kit (e.g. toothbrush, toothpaste, cotton \nbuds, shampoo, etc.) \n3.15 emergency exit plan \n3.16 hanger\n\n--- PDF PAGE 43 ---\nTESDA-SOP-QSO-01-F08 \nTR - HOUSEKEEPING NC II (Amended) \nPromulgated December 2013 \n39 \nEVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency  \nAssessment requires evidence that the candidate:  \n1.1 Demonstrated ability to organize and carry out the \ncomplete guest room services \n1.2 Demonstrated ability to provide room service within the \ntimeframe required by a commercial accommodation \nestablishment \n \n2. Required Knowledge  \n2.1 Roles of Room Attendant \n2.2 Types and uses of correct cleaning chemicals, \nequipment and  procedures for cleaning various \nsurfaces and materials \n2.3 Enterprise procedures and standards in relation to \npresentation of guest room \n3. Required Skills \n3.1 Safe work practices relating to use of cleaning \nchemicals and equipment, bending and manual handling \n(OHS compliance) \n3.2 Cleaning and preparation of multiple rooms within \nindustry-realistic timeframes \n4. Resource Implications  \nThe following resources MUST be provided \n4.1 Fully equipped guest rooms \n4.2 Housekeeping storage areas and all housekeeping \nequipment required for room cleaning \n5. Methods of \nAssessment \nCompetency in this unit may or must be assessed through \n5.1 Practical demonstration/direct observation \n5.2 Portfolio and third party report \n6. Context of Assessment 6.1 Assessment may be done in the workplace or in a \nsimulated workplace setting (assessment centers) \n6.2 Assessment activities are carried out in TESDA’s \naccredited assessment centers\n",
