          text: Oral & written communication skills
        - number: '3.2'
          text: Special protocols for dealing with VIP guests
      resource_implications:
        intro: The following resources/situations MUST be provided
        items:
        - number: '4.1'
          text: Workplace location
        - number: '4.2'
