      variable: Services 2.1 Packing and unpacking service 2.2 Shoe cleaning 2.3 Pressing
      values: []
      qualifier: May include
    - range_id: TRS5123113:range:3
      number: '3'
      variable: Repairs 3.1 Servicing of buttons 3.2 Zipper repairs
      values: []
      qualifier: May include
    evidence_guide:
      critical_aspects:
        intro: 'Competency Assessment requires evidence that the candidate:'
        items:
        - number: '1.1'
          text: Demonstrated ability to explain the current role of valet service within the hospitality industry
        - number: '1.2'
          text: Demonstrated ability to care for guest property
        - number: '1.3'
          text: Demonstrated exemplary personal presentation and communication standards
      required_knowledge:
        intro: Trade Theory
        items:
        - number: 2.1.1
          text: Valet service and its current role in the hospitality industry
        - number: 2.1.2
          text: Oral and written communication on building guest rapport
        - number: 2.1.3
          text: Protocols for ensuring optimum privacy and confidentiality for all guests
        - number: '2.2'
          text: Roles of valet
      required_skills:
        intro: Skills
        items:
