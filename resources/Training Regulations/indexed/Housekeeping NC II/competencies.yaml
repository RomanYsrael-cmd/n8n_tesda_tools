        number: '2.1'
        text: Potential hygiene risks are identified in line with enterprise procedures
      - pc_id: TRS311202:pc:2.2:1
        number: '2.2'
        text: Action to minimize  and remove  risks are taken within scope of individual responsibility of enterprise/legal
          requirements
      - pc_id: TRS311202:pc:2.3:1
        number: '2.3'
        text: Hygiene risks beyond the control of individual staff members are reported to the appropriate person for follow
          up
