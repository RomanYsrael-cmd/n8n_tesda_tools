        - number: 2.1.2
          text: Meaning of laundry and dry cleaning labels on clothing
        - number: 2.1.3
          text: Key laundry terms
        - number: 2.1.4
          text: Common guest laundry issues
        - number: '2.2'
          text: Safety Practices
        - number: 2.2.1
          text: Hygiene, health and safety issues on laundry operations
        - number: '2.3'
          text: Laundry Chemicals/Solutions
        - number: '2.4'
          text: Role of an “on premise” laundry
      required_skills:
        items:
