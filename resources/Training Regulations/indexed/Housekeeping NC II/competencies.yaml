  - unit_code: TRS5123115
    title: Clean public areas, facilities and equipment
    descriptor: This unit of competency deals with the knowledge and skills required in cleaning public areas, facilities
      and equipment.  It includes selecting and setting up of equipment and materials; cleaning dry and wet areas; and, maintaining
      and storing cleaning equipment and materials.
    provenance:
      printed_pages: 46-49
      pdf_pages: 50-53
    elements:
    - element_id: TRS5123115:element:1
      number: 1
      title: Select and set up equipment and materials
      performance_criteria:
      - pc_id: TRS5123115:pc:1.1:1
        number: '1.1'
        text: Equipment are selected according to type of cleaning to be done
      - pc_id: TRS5123115:pc:1.2:1
        number: '1.2'
        text: All equipment are checked if clean and in safe working condition prior to use
      - pc_id: TRS5123115:pc:1.3:1
        number: '1.3'
        text: Suitable dry and wet cleaning agents and chemicals are selected and prepared in accordance with manufacturer’s
          and relevant occupational health and safety requirements
      - pc_id: TRS5123115:pc:1.4:1
        number: '1.4'
        text: Protective clothing are selected and used where necessary
    - element_id: TRS5123115:element:2
      number: 2
      title: Apply cleaning technique
      performance_criteria:
      - pc_id: TRS5123115:pc:2.1:1
        number: '2.1'
        text: Furniture, fixtures, ceilings and wallings are assessed for cleaning
      - pc_id: TRS5123115:pc:2.2:1
        number: '2.2'
        text: Appropriate cleaning equipment and chemicals are selected in accordance with the type of material used
      - pc_id: TRS5123115:pc:2.3:1
        number: '2.3'
        text: Cleaning technique is applied on furniture and  walling materials in accordance with type of material used
      - pc_id: TRS5123115:pc:2.4:1
        number: '2.4'
        text: Appropriate procedures is applied in accordance with the technique
      - pc_id: TRS5123115:pc:2.5:1
        number: '2.5'
        text: Equipment and chemicals are properly cleaned and stored in accordance with manufacturer’s specifications and
          requirements
    - element_id: TRS5123115:element:3
      number: 3
      title: Clean dry and wet areas
      performance_criteria:
      - pc_id: TRS5123115:pc:3.1:1
        number: '3.1'
        text: Wet and dry areas are prepared for cleaning and hazards are identified and assessed
      - pc_id: TRS5123115:pc:3.2:1
        number: '3.2'
        text: The work area is barricaded or warning signs are placed, as appropriate, to reduce risk to colleagues and customers
      - pc_id: TRS5123115:pc:3.3:1
        number: '3.3'
        text: Cleaning agents or chemicals are selected and applied on specific areas in accordance with manufacturer’s recommendations,
          safety procedures and enterprise policies and procedures
      - pc_id: TRS5123115:pc:3.4:1
        number: '3.4'
        text: Equipment are used safely in accordance with manufacturer's recommendations
      - pc_id: TRS5123115:pc:3.5:1
        number: '3.5'
        text: Garbage and used chemicals are disposed off in accordance with hygiene, safety and environmental legislation
          requirements
    - element_id: TRS5123115:element:4
      number: 4
      title: Maintain and store cleaning equipment and chemicals
      performance_criteria:
      - pc_id: TRS5123115:pc:4.1:1
        number: '4.1'
        text: Equipment are cleaned after use in accordance with enterprise requirements and manufacturer’s instructions
      - pc_id: TRS5123115:pc:4.2:1
        number: '4.2'
        text: Routine preventive maintenance is carried out or arranged in accordance with enterprise procedures
      - pc_id: TRS5123115:pc:4.3:1
        number: '4.3'
        text: Defects are identified and reported in accordance with enterprise procedures
      - pc_id: TRS5123115:pc:4.4:1
        number: '4.4'
        text: Equipment are stored in the designated area and in a condition ready for re-use.
      - pc_id: TRS5123115:pc:4.5:1
        number: '4.5'
        text: Chemicals are stored and controlled in accordance with health and safety requirements.
    range_of_variables:
    - range_id: TRS5123115:range:1
      number: '1'
      variable: Occupational health, safety and environment requirements 1.1 Establishment policies and procedures related
        to cleaning operations and disposal of used chemicals 1.2 Laws on  general workplace safety, hazardous substances,
        and manual handling and storage requirements 1.3 Establishment security procedures
      values: []
      qualifier: May include
    - range_id: TRS5123115:range:2
      number: '2'
      variable: Protective clothing 2.1 overalls 2.2 jackets 2.3 aprons 2.4 goggles and masks 2.5 waterproof clothing and
        footwear 2.6 headwear
      values: []
      qualifier: May include
    - range_id: TRS5123115:range:3
      number: '3'
      variable: Materials 3.1 glass 3.2 leather 3.3 fabrics 3.4 brass/steel 3.5 wood 3.6 carpet 3.7 hard floors
      values: []
      qualifier: May include
    - range_id: TRS5123115:range:4
      number: '4'
      variable: Dry and wet areas 4.1 bathrooms 4.2 bedrooms 4.3 kitchens 4.4 balconies 4.5 private lounge areas 4.6 public
        areas (both internal and external) 4.7 function rooms 4.8 storage areas 4.9 swimming pool
      values: []
      qualifier: May include
    - range_id: TRS5123115:range:5
      number: '5'
      variable: Hazards 5.1 spillages 5.2 breakages 5.3 wet or slippery surfaces 5.4 broken or damaged furniture 5.5 fumes
