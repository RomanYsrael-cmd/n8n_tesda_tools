  core:
  - unit_code: TRS5123111
    title: Provide housekeeping services to guests
    descriptor: This unit of competency deals with the skills and knowledge required to provide a range of general housekeeping
      services to guests.
    provenance:
      printed_pages: 34-36
      pdf_pages: 38-40
    elements:
    - element_id: TRS5123111:element:1
      number: 1
      title: Receive housekeeping requests
      performance_criteria:
      - pc_id: TRS5123111:pc:1.1:1
        number: '1.1'
        text: Guest/staff housekeeping requests and service delivery are accepted and recorded in accordance to enterprise
          policies and procedure.
      - pc_id: TRS5123111:pc:1.2:1
        number: '1.2'
        text: Details of requests made are confirmed and noted in accordance with enterprise procedures
      - pc_id: TRS5123111:pc:1.3:1
        number: '1.3'
        text: Apologies are made when a request has arisen from a delayed delivery of  service
      - pc_id: TRS5123111:pc:1.4:1
        number: '1.4'
        text: Request not related to housekeeping are referred to appropriate department.
    - element_id: TRS5123111:element:2
      number: 2
      title: Provide/ Service housekeeping requests
      performance_criteria:
      - pc_id: TRS5123111:pc:2.1:1
        number: '2.1'
        text: Identified service/item is obtained through liaison with other staff in accordance with enterprise procedures
      - pc_id: TRS5123111:pc:2.2:1
        number: '2.2'
        text: Required items are located and delivered to guest room in accordance with enterprise procedures
      - pc_id: TRS5123111:pc:2.3:1
        number: '2.3'
        text: Equipment is set up in guest room in accordance with the request of the guest
      - pc_id: TRS5123111:pc:2.4:1
        number: '2.4'
        text: Requested items are removed from guest rooms in accordance with enterprise procedures.
    - element_id: TRS5123111:element:3
      number: 3
      title: Provide advice to guest
      performance_criteria:
      - pc_id: TRS5123111:pc:3.1:1
        number: '3.1'
        text: Guest is advised on services and items available through housekeeping department
      - pc_id: TRS5123111:pc:3.2:1
        number: '3.2'
        text: Guest is advised on use of items delivered to guest room
      - pc_id: TRS5123111:pc:3.3:1
        number: '3.3'
        text: The proper use of delivered item to the guest room is demonstrated to guest
      - pc_id: TRS5123111:pc:3.4:1
        number: '3.4'
        text: Liaise with other staff and department to provide support services
    - element_id: TRS5123111:element:4
      number: 4
      title: Liaise with other departments
      performance_criteria:
      - pc_id: TRS5123111:pc:4.1:1
        number: '4.1'
        text: Equipment malfunction is reported to appropriate personnel in accordance with enterprise procedures
      - pc_id: TRS5123111:pc:4.2:1
        number: '4.2'
        text: Management is advised on dangerous or suspicious circumstances in accordance with enterprise procedures.
      - pc_id: TRS5123111:pc:4.3:1
        number: '4.3'
        text: Other departments are updated on the status of service requests
    range_of_variables:
    - range_id: TRS5123111:range:1
      number: '1'
      variable: Requests 1.1 Range of services and products offered by the establishment 1.2 Availability, hours and location
        of meals, services, equipment 1.3 Various types of equipment work
      values: []
      qualifier: May include
    - range_id: TRS5123111:range:2
      number: '2'
      variable: Equipment 2.1 electric kettles 2.2 Transformers (step up- step down) 2.3 computers 2.4 video player 2.5 console
        2.6 hairdryer 2.7 irons and ironing board 2.8 adaptors, wires and cables
      values: []
      qualifier: May include
    - range_id: TRS5123111:range:3
      number: '3'
      variable: Requested items 3.1 Roll away beds 3.2 additional pillows and blankets & towels 3.3 additional room supplies
        3.4 follow-up cleaning 3.5 cleaning up spills 3.6 repairs and maintenance 3.7 lost property inquiries 3.8 change of
        linen 3.9 first aid kit
      values:
      - number: '3.10'
        text: baby sitting
      - number: '3.11'
        text: baby crib
      qualifier: May include
    evidence_guide:
      critical_aspects:
        intro: 'Competency Assessment requires evidence that the candidate:'
        items:
        - number: '1.1'
          text: Demonstrated ability to offer courteous, prompt and friendly service to guest
        - number: '1.2'
          text: Demonstrated knowledge and skills of a range of housekeeping services/materials/solutions and equipment
      required_knowledge:
        items:
        - number: '2.1'
          text: Knowledge on typical housekeeping services and procedures
        - number: '2.2'
          text: Knowledge on materials/solutions and equipment
      required_skills:
        items:
        - number: '3.1'
          text: Security and safety procedures as they apply to housekeeping services and guests
        - number: '3.2'
          text: Demonstrate responding to multiple and various types of guests
        - number: '3.3'
          text: Time management skills
      resource_implications:
        intro: The following resources MUST be provided
        items:
        - number: '4.1'
          text: Fully operational equipment in an accommodation environment, including guests rooms and various housekeeping
            equipment and solutions
      methods_of_assessment:
        intro: Assessment Competency in this unit may or must be assessed through
        items:
        - number: '5.1'
          text: Questioning
        - number: '5.2'
          text: Practical demonstration/direct observation
        - number: '5.3'
          text: Portfolio evidence
        - number: '5.4'
          text: Interview
      context_of_assessment:
        intro: Assessment may be done in the workplace or in a simulated workplace setting (assessment centers)
        items:
        - number: '6.2'
          text: Assessment activities are carried out through TESDA’s accredited assessment center
    evidence_guide_source_labels:
      critical_aspects: 'Critical aspects of Competency Assessment requires evidence that the candidate:'
      required_knowledge: Required Knowledge
      required_skills: Required Skills
      resource_implications: Resource Implications The following resources MUST be provided
      methods_of_assessment: Methods of Assessment Competency in this unit may or must be assessed through
      context_of_assessment: Context of  Assessment 6.1 Assessment may be done in the workplace or in a simulated workplace
        setting (assessment centers)
  - unit_code: TRS5123112
    title: Clean and prepare rooms for incoming guests
    descriptor: The unit deals with the skills and knowledge required from housekeeping attendants to clean and prepare rooms
      for incoming guests in a commercial accommodation establishment.
    provenance:
      printed_pages: 37-39
      pdf_pages: 41-43
    elements:
    - element_id: TRS5123112:element:1
      number: 1
      title: Set up equipment and trolleys
      performance_criteria:
      - pc_id: TRS5123112:pc:1.1:1
        number: '1.1'
        text: Cleaning, supplies and equipment required for servicing rooms are correctly selected and prepared for use
      - pc_id: TRS5123112:pc:1.2:1
        number: '1.2'
        text: Supplies for trolleys are accurately identified and selected or ordered in sufficient numbers in accordance
          with enterprise procedures
      - pc_id: TRS5123112:pc:1.3:1
        number: '1.3'
        text: Trolleys are safely loaded with adequate supplies in accordance with enterprise procedures
    - element_id: TRS5123112:element:2
      number: 2
      title: Access rooms for servicing
      performance_criteria:
      - pc_id: TRS5123112:pc:2.1:1
        number: '2.1'
        text: Rooms requiring service are correctly identified based on information supplied to housekeeping staff
      - pc_id: TRS5123112:pc:2.2:1
        number: '2.2'
        text: Rooms are accessed in accordance with the establishment’s customer service and security procedures
    - element_id: TRS5123112:element:3
      number: 3
      title: Make up beds
      performance_criteria:
      - pc_id: TRS5123112:pc:3.1:1
        number: '3.1'
        text: Beds and mattresses are stripped,  pillows and   linen are checked for stains and damage rooms are checked whether
          guests left any valuables
      - pc_id: TRS5123112:pc:3.2:1
        number: '3.2'
        text: Items with stains are immediately segregated and  forwarded to the Laundry Department  for proper processing
      - pc_id: TRS5123112:pc:3.3:1
        number: '3.3'
        text: Bed linens are replaced in accordance with enterprise standards and procedures
    - element_id: TRS5123112:element:4
      number: 4
      title: Clean and clear rooms
      performance_criteria:
      - pc_id: TRS5123112:pc:4.1:1
        number: '4.1'
        text: Rooms are cleaned in correct order and with minimum disruption to guests
      - pc_id: TRS5123112:pc:4.2:1
        number: '4.2'
        text: All furniture, fixtures and fittings are cleaned and checked in accordance with enterprise procedures and hygiene/safety
          guidelines
      - pc_id: TRS5123112:pc:4.3:1
        number: '4.3'
        text: Room supplies are checked, replenished or replaced in accordance with enterprise standards and procedures
      - pc_id: TRS5123112:pc:4.4:1
        number: '4.4'
        text: Pests are promptly identified and appropriate action is taken in accordance with safety and enterprise procedures
      - pc_id: TRS5123112:pc:4.5:1
        number: '4.5'
        text: Rooms are checked for any defects and  are accurately reported in accordance with enterprise procedures
      - pc_id: TRS5123112:pc:4.6:1
        number: '4.6'
        text: Damaged items are recorded in accordance with enterprise procedures
      - pc_id: TRS5123112:pc:4.7:1
        number: '4.7'
        text: Any unusual or suspicious person, item or occurrence is promptly reported in accordance with enterprise procedures
      - pc_id: TRS5123112:pc:4.8:1
        number: '4.8'
        text: Guest’s belongings left in vacated rooms  are collected and stored in accordance with lost and found enterprise
          procedures
    - element_id: TRS5123112:element:5
      number: 5
      title: Clean and store trolleys and equipment
      performance_criteria:
      - pc_id: TRS5123112:pc:5.1:1
        number: '5.1'
        text: Trolleys and equipment are cleaned after use in accordance with safety and enterprise procedures
      - pc_id: TRS5123112:pc:5.2:1
        number: '5.2'
        text: All items are correctly stored in accordance with enterprise procedures
      - pc_id: TRS5123112:pc:5.3:1
        number: '5.3'
        text: Supplies and items are checked and replenished or re- ordered in accordance with enterprise procedures
      - pc_id: TRS5123112:pc:5.4:1
        number: '5.4'
        text: Additional housekeeping services is provided as requested in accordance with enterprise procedures
      - pc_id: TRS5123112:pc:5.5:1
        number: '5.5'
        text: Turn over procedure for next shift is carried out in accordance with enterprise procedures
    range_of_variables:
