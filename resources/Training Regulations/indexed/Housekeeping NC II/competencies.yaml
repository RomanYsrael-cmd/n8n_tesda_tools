  - unit_code: TRS311202
    title: Observe workplace hygiene procedures
    descriptor: This unit of competency deals with the knowledge, skills and attitudes in observing workplace hygiene procedures.
      It includes following hygiene procedures and identifying and preventing hygiene risks.
    provenance:
      printed_pages: 18-20
      pdf_pages: 22-24
    elements:
    - element_id: TRS311202:element:1
      number: 1
      title: Follow hygiene procedures
      performance_criteria:
      - pc_id: TRS311202:pc:1.1:1
        number: '1.1'
        text: Workplace hygiene procedures are implemented in line with enterprise and legal requirements
      - pc_id: TRS311202:pc:1.2:1
        number: '1.2'
        text: Handling and storage of items are undertaken in line with enterprise and legal requirements
    - element_id: TRS311202:element:2
      number: 2
      title: Identify and prevent hygiene risks
      performance_criteria:
