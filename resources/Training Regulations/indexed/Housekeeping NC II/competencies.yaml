        number: '1.1'
        text: Customers are greeted according to enterprise procedure
      - pc_id: TRS311205:pc:1.2:1
        number: '1.2'
        text: Verbal and non-verbal communications are appropriate to the given situation
      - pc_id: TRS311205:pc:1.3:1
        number: '1.3'
        text: Non verbal communication are observed when responding to customers
      - pc_id: TRS311205:pc:1.4:1
        number: '1.4'
        text: Sensitivity to cultural and social differences is demonstrated
    - element_id: TRS311205:element:2
      number: 2
      title: Identify needs of customers
      performance_criteria:
      - pc_id: TRS311205:pc:2.1:1
        number: '2.1'
        text: Appropriate interpersonal skills are used to ensure that customer needs are accurately identified
      - pc_id: TRS311205:pc:2.2:1
        number: '2.2'
        text: Customer needs are assessed for urgency so that priority for service delivery can be identified
      - pc_id: TRS311205:pc:2.3:1
        number: '2.3'
        text: Customers are provided with information
      - pc_id: TRS311205:pc:2.4:1
        number: '2.4'
        text: Personal limitation in addressing customer and colleague needs is identified and where appropriate, assistance
          is sought from supervisor
    - element_id: TRS311205:element:3
      number: 3
      title: Deliver service to customer
      performance_criteria:
      - pc_id: TRS311205:pc:3.1:1
        number: '3.1'
        text: Customer needs are promptly attended to in line with enterprise procedure
      - pc_id: TRS311205:pc:3.2:1
        number: '3.2'
        text: Appropriate rapport is maintained with customer to enable high quality service delivery
      - pc_id: TRS311205:pc:3.3:1
        number: '3.3'
        text: Opportunity to enhance the quality of service and products are taken wherever possible ELEMENT
    - element_id: TRS311205:element:4
      number: 4
      title: Handle queries through use of common business tools and technology
      performance_criteria:
      - pc_id: TRS311205:pc:4.1:1
        number: '4.1'
        text: Common business tools and technology are used efficiently to determine customer requirements
      - pc_id: TRS311205:pc:4.2:1
        number: '4.2'
        text: Queries/ information are recorded in line with enterprise procedure
      - pc_id: TRS311205:pc:4.3:1
        number: '4.3'
        text: Queries are acted upon promptly and correctly in line with enterprise procedure
    - element_id: TRS311205:element:5
      number: 5
      title: Handle complaints/ conflict situations, evaluation and recommendations
      performance_criteria:
      - pc_id: TRS311205:pc:5.1:1
        number: '5.1'
        text: Guests are greeted with a smile and eye-to-eye contact
      - pc_id: TRS311205:pc:5.2:1
        number: '5.2'
        text: Responsibility for resolving the complaint is taken within limit of responsibility and according to enterprise
          policy
      - pc_id: TRS311205:pc:5.3:1
        number: '5.3'
        text: Nature and details of complaint are established and agreed with the customer
      - pc_id: TRS311205:pc:5.4:1
        number: '5.4'
        text: Threats to personal safety are identified and managed to personal safety of customers or colleagues and appropriate
          assistance is organized
      - pc_id: TRS311205:pc:5.4:2
        number: '5.4'
        text: Appropriate action is taken to resolve the complaint to the customers satisfaction wherever possible
      - pc_id: TRS311205:pc:5.5:1
        number: '5.5'
        text: Conflict situations are resolved within scope of individual responsibility by applying effective communication
          skills and according to enterprise policy
    range_of_variables:
    - range_id: TRS311205:range:1
      number: '1'
      variable: Customer
      values:
      - number: '1.1'
        text: internal
      - number: '1.2'
        text: external
      qualifier: May include
    - range_id: TRS311205:range:2
      number: '2'
