  - unit_code: TRS5123114
    title: Laundry linen and guest clothes
    descriptor: This unit of competency deals with the skills and knowledge required to work in an “on-premise” laundry section
      in a commercial accommodation establishment applied to guest laundry, and in-house linen and uniforms.
    provenance:
      printed_pages: 43-45
      pdf_pages: 47-49
    elements:
    - element_id: TRS5123114:element:1
      number: 1
      title: Collect laundry for laundering functions
      performance_criteria:
      - pc_id: TRS5123114:pc:1.1:1
        number: '1.1'
        text: The role of an on-premise laundry is identified according to enterprise policy
      - pc_id: TRS5123114:pc:1.2:1
        number: '1.2'
        text: Guest clothes are picked up in accordance with enterprise policy
      - pc_id: TRS5123114:pc:1.3:1
        number: '1.3'
        text: In-house items are picked up in accordance with enterprise policy
    - element_id: TRS5123114:element:2
      number: 2
      title: Perform  laundering functions
      performance_criteria:
      - pc_id: TRS5123114:pc:2.1:1
        number: '2.1'
        text: Items are correctly sorted and counted according to cleaning process required and  urgency of the item
      - pc_id: TRS5123114:pc:2.2:1
        number: '2.2'
        text: Items for laundering  are checked for stains and are treated using the correct process
      - pc_id: TRS5123114:pc:2.3:1
        number: '2.3'
        text: Laundry methods are selected in accordance with textile labeling codes and based on fiber and fabric, dye fastness,
          degree of spoilage and washing instructions
      - pc_id: TRS5123114:pc:2.4:1
        number: '2.4'
        text: Laundry equipment is operated in accordance with manufacturer’s instructions
      - pc_id: TRS5123114:pc:2.5:1
        number: '2.5'
        text: Any damage arising from the laundering process is recorded and appropriate person(s) is/are notified in accordance
          with enterprise procedures
      - pc_id: TRS5123114:pc:2.6:1
        number: '2.6'
        text: Cleaning agents and chemicals are used in accordance with manufacturer’s instructions and specific laundry equipment
      - pc_id: TRS5123114:pc:2.7:1
        number: '2.7'
        text: Items are checked after the laundering process to ensure quality cleaning
      - pc_id: TRS5123114:pc:2.8:1
        number: '2.8'
        text: Pressing and finishing processes are correctly completed in accordance with textile characteristics and client
          requirements
    - element_id: TRS5123114:element:3
      number: 3
      title: Process laundered item
      performance_criteria:
      - pc_id: TRS5123114:pc:3.1:1
        number: '3.1'
        text: Post cleaning laundry activity are performed in accordance with enterprise policy
      - pc_id: TRS5123114:pc:3.2:1
        number: '3.2'
        text: Results of cleaning are checked and appropriate additional action is taken.
      - pc_id: TRS5123114:pc:3.3:1
        number: '3.3'
        text: Internal record and billing instructions are processed in accordance with enterprise procedures
      - pc_id: TRS5123114:pc:3.4:1
        number: '3.4'
        text: Necessary internal laundry reports are produced
    - element_id: TRS5123114:element:4
      number: 4
      title: Return laundered item
      performance_criteria:
      - pc_id: TRS5123114:pc:4.1:1
        number: '4.1'
        text: Guest clothes are delivered in accordance with enterprise policy
      - pc_id: TRS5123114:pc:4.2:1
        number: '4.2'
        text: In-house items are delivered in accordance with enterprise policy
    range_of_variables:
    - range_id: TRS5123114:range:1
      number: '1'
      variable: Cleaning process
      values:
      - number: '1.1'
        text: Dry clean
      - number: '1.2'
        text: Hand wash
      - number: '1.3'
        text: Machine wash
      qualifier: May include
    - range_id: TRS5123114:range:2
      number: '2'
      variable: Laundry equipment 2.1 Washers 2.2 Dryers 2.3 Irons 2.4 Steam pressers 2.5 Sorting baskets and shelves 2.6
        Hangers 2.7 Drying cleaning machine 2.8 Labeler
      values: []
      qualifier: May include
    - range_id: TRS5123114:range:3
      number: '3'
      variable: Laundering process
      values:
      - number: '3.1'
        text: Sorting
      - number: '3.2'
        text: Washing
      - number: '3.3'
        text: Stain treatment
      - number: '3.4'
        text: Drying
      - number: '3.5'
        text: Folding
      - number: '3.6'
        text: Ironing
      - number: '3.7'
        text: Steam pressing
      - number: '3.8'
        text: Mending
      - number: '3.9'
        text: Minor repairs such as buttons and zippers
      qualifier: May include
    evidence_guide:
      critical_aspects:
        intro: 'Competency Assessment requires evidence that the candidate:'
        items:
        - number: '1.1'
          text: Demonstrated ability to correctly identify the process required for different types of laundry
        - number: '1.2'
          text: Demonstrated ability to operate laundry equipment safely
        - number: '1.3'
          text: Demonstrated ability to complete the full laundering process
      required_knowledge:
        items:
