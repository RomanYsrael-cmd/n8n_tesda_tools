ded with information\n2.4\nPersonal limitation in addressing customer and\ncolleague needs is identified and where appropriate,\nassistance is sought from supervisor\n3. Deliver service to\ncustomer\n3.1 Customer needs are promptly attended to in line with\nenterprise procedure\n3.2 Appropriate rapport is maintained with customer to\nenable high quality service delivery\n3.3 Opportunity to enhance the quality of service and\nproducts are taken wherever possible\n\n--- PDF PAGE 34 ---\nTESDA-SOP-QSO-01-F08\nTR - HOUSEKEEPING NC II (Amended)\nPromulgated December 2013\n30\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized items are elaborated in the Range of Variables\n4. Handle queries through\nuse of common\nbusiness tools and\ntechnology\n4.1 Common business tools and technology are used\nefficiently to determine customer requirements\n4.2 Queries/ information are recorded in line with enterprise\nprocedure\n4.3 Queries are acted upon promptly and correctly in line\nwith enterprise procedure\n5. Handle complaints/\nconflict situations,\nevaluation and\nrecommendations\n5.1 Guests are greeted with a smile and eye-to-eye contact\n5.2 Responsibility for resolving the complaint is taken\nwithin limit of responsibility and according to enterprise\npolicy\n5.3 Nature and details of complaint are established and\nagreed with the customer\n5.4 Threats to personal safety are identified and managed\nto personal safety of customers or colleagues and\nappropriate assistance is organized\n5.4 Appropriate action is taken to resolve the complaint to\nthe customers satisfaction wherever possible\n5.5 Conflict situations are resolved within scope of individual\nresponsibility by applying effective communication skills\nand according to enterprise policy\n\n--- PDF PAGE 35 ---\nTESDA-SOP-QSO-01-F08\nTR - HOUSEKEEPING NC II (Amended)\nPromulgated December 2013\n31\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Customer\nMay include:\n1.1 internal\n1.2 external\n2. Non-verbal\ncommunication\nMay include:\n2.1\nbody language\n2.2\ndress and accessories\n2.3\ngestures and mannerisms\n2.4\nvoice tonality and volume\n2.5\nuse of space\n2.6\nculturally specific communication customs and\npractices\n3. Cultural and social\ndifferences\nMay include:\n3.1\nmodes of greeting, farewell and conversation\n3.2\nbody language/ use of body gestures\n3.3\nformality of language\n4. Interpersonal skills\nMay include:\n4.1\ninteractive communication\n4.2\npublic relation\n4.3\ngood working attitude\n4.4\nsincerity\n4.5\npleasant disposition\n4.6\neffective communication skills\n5. Customer and\ncolleagues needs\nMay include:\n5.1\nthose with a disability\n5.2\nthose with special cultural or language needs\n5.3\nunaccompanied children\n5.4\nparents with young children\n5.5\npregnant women\n5.6\nsingle women\n6. Enterprise\nprocedure\nMay include:\n6.1\nmodes of greeting and farewell\n6.2\naddressing the person by name\n6.3\ntime-lapse before a response\n6.4\nstyle manual requirements\n6.5\nstandard letters and format\n7. Business tools and\ntechnology\nMay include:\n7.1\ntelephone\n7.2\nfax machine\n7.3\ncomputer equipment\n7.4\ninternet, email\n\n--- PDF PAGE 36 ---\nTESDA-SOP-QSO-01-F08\nTR - HOUSEKEEPING NC II (Amended)\nPromulgated December 2013\n32\nVARIABLE\nRANGE\n8. Complaint\nMay include:\n8.1\nlevel of service\n8.2\nproduct standards\n8.3\nprocesses\n8.4\ninformation given\n8.5\ncharges and fees\n9. Threats to personal\nsafety\nMay include:\n9.1\nviolent customers\n9.2\ndrug and alcohol affected customers\n9.3\ncustomers fighting amongst themselves\n\n--- PDF PAGE 37 ---\nTESDA-SOP-QSO-01-F08\nTR - HOUSEKEEPING NC II (Amended)\nPromulgated December 2013\n33\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\n\nAssessment requires evidence that the candidate :\n1.1\nComplied with industry practices and procedures\n1.2\nUsed interactive communication with others\n1.3\nComplied with occupational, health and safety practices\n1.4\nPromoted public relation among others\n1.5\nComplied with service manual standards\n1.6\nDemonstrated familiarity with company facilities,\nproducts and services\n1.7\nDemonstrated ability to work effectively with others\n1.8\nApplied company rules and standards\n1.9\nApplied telephone ethics\n1.10 Applied correct procedure in using telephone, fax\nmachine, internet\n1.11 Handled customer complaints within limit of individual\nresponsibility\n2. Required Knowledge\n2.1\nCommunication\n2.1.1 Interactive communication with others\n2.1.2 Interpersonal skills/ social graces with\nsincerity\n2.2\nSafety Practices\n2.2.1 Safe work practices\n2.2.2 Personal hygiene\n2.3\nAttitude\n2.3.1 Attentive, patient and cordial\n2.3.2 Eye-to-eye contact\n2.3.3 Maintain teamwork and cooperation\n2.4\nTheory\n2.4.1 Selling/up selling techniques\n2.4.2 Interview techniques\n2.4.3 Conflict resolution\n2.4.4 Communication process\n2.4.5 Communication barriers\n3. Required Skills\n3.1\nEffective communication skills\n3.2\nNon-verbal communication - body language\n3.3\nGood time management\n3.4\nAbility to work calmly and unobtrusively effectively\n3.5\nAbility to handle telephone inquiries and conversations\n3.6\nCorrect procedure in handling telephone inquiries\n3.7\nProper way of handling complaints\n3.8\nAbility to apply basic principles of conflict resolution and\nrespond to complaints\n4. Resource Implications\nThe following resources should be provided\n4.1\nAvailability of telephone, fax machine, internet,\netc.\n4.2\nAvailability of data on projects and services; tariff and\nrates, promotional activities in place etc.\n4.3\nAvailability of office supplies\n5. Methods of\nAssessment\nCompetency in this unit must be assessed through\n5.1\nWritten examination\n5.2\nPractical demonstration\n6. Context of\nAssessment\n6.1\nAssessment may be done in the workplace or in a\nsimulated workplace setting (assessment centers)\n6.2\nAssessment activities are carried out through TESDA's\naccredited assessment center\n\n--- PDF PAGE 38 ---\nTESDA-SOP-QSO-01-F08\nTR - HOUSEKEEPING NC II (Amended)\nPromulgated December 2013\n34\nCORE COMPETENCIES\n\nUNIT OF COMPETENCY :\nPROVIDE HOUSEKEEPING SERVICES TO GUESTS\n\nUNIT CODE\n:\nTRS5123111\n\nUNIT DESCRIPTOR\n:\nThis unit of competency deals with the skills and\nknowledge required to provide a range of general\nhousekeeping services to guests.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Receive housekeeping\nrequests\n\n1.1\nGuest/staff housekeeping requests and service\ndelivery are accepted and recorded in accordance to\nenterprise policies and procedure.\n1.2\nDetails of requests made are confirmed and noted in\naccordance with enterprise procedures\n1.3\nApologies are made when a request has arisen from a\ndelayed delivery of service\n1.4\nRequest not related to housekeeping are referred to\nappropriate department.\n2. Provide/ Service\nhousekeeping requests\n\n2.1\nIdentified service/item is obtained through liaison with\nother staff in accordance with enterprise procedures\n2.2\nRequired items are located and delivered to guest room\nin accordance with enterprise procedures\n2.3\nEquipment is set up in guest room in accordance with\nthe request of the guest\n2.4\nRequested items are removed from guest rooms in\naccordance with enterprise procedures.\n3. Provide advice to guest\n3.1\nGuest is advised on services and items available\nthrough housekeeping department\n3.2\nGuest is advised on use of items delivered to guest\nroom\n3.3\nThe proper use of delivered item to the guest room is\ndemonstrated to guest\n3.4\nLiaise with other staff and department to provide\nsupport services\n4. Liaise with other\ndepartments\n4.1\nEquipment malfunction is reported to appropriate\npersonnel in accordance with enterprise procedures\n4.2\nManagement is advised on dangerous or suspicious\ncircumstances in accordance with enterprise\nprocedures.\n4.3\nOther departments are updated on the status of service\nrequests\n\n--- PDF PAGE 39 ---\nTESDA-SOP-QSO-01-F08\nTR - HOUSEKEEPING NC II (Amended)\nPromulgated December 2013\n35\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Requests\nMay include:\n1.1\nRange of services and products offered by the\nestablishment\n1.2\nAvailability, hours and location of meals, services,\nequipment\n1.3\nVarious types of equipment work\n2. Equipment\nMay include:\n2.1\nelectric kettles\n2.2\nTransformers (step up- step down)\n2.3\ncomputers\n2.4\nvideo player\n2.5\nconsole\n2.6\nhairdryer\n2.7\nirons and ironing board\n2.8\nadaptors, wires and cables\n3. Requested items\nMay include:\n3.1\nRoll away beds\n3.2\nadditional pillows and blankets & towels\n3.3\nadditional room supplies\n3.4\nfollow-up cleaning\n3.5\ncleaning up spills\n3.6\nrepairs and maintenance\n3.7\nlost property inquiries\n3.8\nchange of linen\n3.9\nfirst aid kit\n3.10 baby sitting\n3.11 baby crib\n\n--- PDF PAGE 40 ---\nTESDA-SOP-QSO-01-F08\nTR - HOUSEKEEPING NC II (Amended)\nPromulgated December 2013\n36\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\n\nAssessment requires evidence that the candidate:\n1.1\nDemonstrated ability to offer courteous, prompt and\nfriendly service to guest\n1.2\nDemonstrated knowledge and skills of a range of\nhousekeeping services/materials/solutions and\nequipment\n2. Required Knowledge\n2.1\nKnowledge on typical housekeeping services and\nprocedures\n2.2\nKnowledge on materials/solutions and equipment\n\n 3. Required Skills\n3.1\nSecurity and safety procedures as they apply to\nhousekeeping services and guests\n3.2\nDemonstrate responding to multiple and various types\nof guests\n3.3\nTime management skills\n4. Resource Implications\nThe following resources MUST be provided\n4.1\nFully operational equipment in an accommodation\nenvironment, including guests rooms and various\nhousekeeping equipment and solutions\n5. Methods of\nAssessment\nCompetency in this unit may or must be assessed through\n5.1\nQuestioning\n5.2\nPractical demonstration/direct observation\n5.3\nPortfolio evidence\n5.4\nInterview\n6. Context of Assessment 6.1\nAssessment may be done in the workplace or in a\nsimulated workplace setting (assessment centers)\n6.2\nAssessment activities are carried out through TESDA’s\naccredited assessment center\n\n--- PDF PAGE 41 ---\nTESDA-SOP-QSO-01-F08\nTR - HOUSEKEEPING NC II (Amended)\nPromulgated December 2013\n37\nUNIT OF COMPETENCY :\nCLEAN AND PREPARE ROOMS FOR INCOMING\nGUESTS\n\nUNIT CODE\n:\nTRS5123112\n\nUNIT DESCRIPTOR\n:\nThe unit deals with the skills and knowledge required\nfrom housekeeping attendants to clean and prepare\nrooms\nfor\nincoming\nguests\nin\na\ncommercial\naccommodation establishment.\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variable\n1. Set up equipment and\ntrolleys\n\n1.1 Cleaning, supplies and equipment required for servicing\nrooms are correctly selected and prepared for use\n1.2 Supplies for trolleys are accurately identified and selected or\nordered in sufficient numbers in accordance with enterprise\nprocedures\n1.3 Trolleys are safely loaded with adequate supplies in\naccordance with enterprise procedures\n2. Access rooms for\nservicing\n2.1 Rooms requiring service are correctly identified based on\ninformation supplied to housekeeping staff\n2.2 Rooms are accessed in accordance with the establishment’s\ncustomer service and security procedures\n3. Make up beds\n3.1 Beds and mattresses are stripped, pillows and linen are\nchecked for stains and damage rooms are checked whether\nguests left any valuables\n3.2 Items with stains are immediately segregated and forwarded\nto the Laundry Department for proper processing\n3.3 Bed linens are replaced in accordance with enterprise\nstandards and procedures\n4. Clean and clear rooms\n4.1 Rooms are cleaned in correct order and with minimum\ndisruption to guests\n4.2 All furniture, fixtures and fittings are cleaned and checked\nin accordance with enterprise procedures and hygiene/safety\nguidelines\n4.3 Room supplies are checked, replenished or replaced in\naccordance with enterprise standards and procedures\n4.4 Pests are promptly identified and appropriate action is taken in\naccordance with safety and enterprise procedures\n4.5 Rooms are checked for any defects and are accurately\nreported in accordance with enterprise procedures\n4.6 Damaged items are recorded in accordance with enterprise\nprocedures\n4.7 Any unusual or suspicious person, item or occurrence is\npromptly reported in accordance with enterprise procedures\n4.8 Guest’s belongings left in vacated rooms are collected and\nstored in accordance with lost and found enterprise\nprocedures\n5. Clean and store trolleys\nand equipment\n5.1 Trolleys and equipment are cleaned after use in\naccordance with safety and enterprise procedures\n5.2 All items are correctly stored in accordance with enterprise\nprocedures\n5.3 Supplies and items are checked and replenished or re-\nordered in accordance with enterprise procedures\n5.4 Additional housekeeping services is provided as requested\nin accordance with enterprise procedures\n5.5 Turn over procedure for next shift is carried out in\naccordance with enterprise procedures\n\n--- PDF PAGE 42 ---\nTESDA-SOP-QSO-01-F08\nTR - HOUSEKEEPING NC II (Amended)\nPromulgated December 2013\n38\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Cleaning supplies and\nequipment\n\nMay include:\n1.1\nCleaning agents, disinfectant and chemicals\n1.2\nVacuum cleaner\n1.3\nMops\n1.4\nBrushes\n1.5\nBuckets\n1.6\nCaddy\n1.7\nCarpet sweeper\n1.8\nCleaning and polishing cloths\n1.9\nProtective clothing\n1.10 Brooms\n1.11 Dust pans\n1.12 Squeegee\n\n2. Furniture, fixtures and\nfittings\nMay include:\n2.1\nfloor surfaces\n2.2\nmirrors and glassware\n2.3\nwardrobes and luggage rack\n2.4\ndesks and chairs\n2.5\ncoffee table and sofa\n2.6\nlight fittings and table lamp\n2.7\nbedside table\n2.8\ntelephones\n2.9\ntelevisions\n2.10 mini fridge\n2.11 shelving\n2.12 air conditioning controls\n2.13 safety deposit box\n\n3. Room supplies\nMay include:\n3.1\nstationery and compendium\n3.2\nbed and bathroom linen\n3.3\nenterprise promotional materials\n3.4\nlocal tourist information\n3.5\nmagazines and newspapers\n3.6\nmini-bar supplies\n3.7\nglass ware and cutlery\n3.8\ntea, coffee, sugar, milk and water\n3.9\ndiscretionary supplies and gifts such as fruit, beverages,\nchocolates, flowers\n3.10 slippers\n3.11 flashlight\n3.12 laundry bags and list\n3.13 shoe shine kit and basket/sewing kit\n3.14 personal hygiene kit (e.g. toothbrush, toothpaste, cotton\nbuds, shampoo, etc.)\n3.15 emergency exit plan\n3.16 hanger\n\n--- PDF PAGE 43 ---\nTESDA-SOP-QSO-01-F08\nTR - HOUSEKEEPING NC II (Amended)\nPromulgated December 2013\n39\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Demonstrated ability to organize and carry out the\ncomplete guest room services\n1.2 Demonstrated ability to provide room service within the\ntimeframe required by a commercial accommodation\nestablishment\n\n2. Required Knowledge\n2.1 Roles of Room Attendant\n2.2 Types and uses of correct cleaning chemicals,\nequipment and procedures for cleaning various\nsurfaces and materials\n2.3 Enterprise procedures and standards in relation to\npresentation of guest room\n3. Required Skills\n3.1 Safe work practices relating to use of cleaning\nchemicals and equipment, bending and manual handling\n(OHS compliance)\n3.2 Cleaning and preparation of multiple rooms within\nindustry-realistic timeframes\n4. Resource Implications\nThe following resources MUST be provided\n4.1 Fully equipped guest rooms\n4.2 Housekeeping storage areas and all housekeeping\nequipment required for room cleaning\n5. Methods of\nAssessment\nCompetency in this unit may or must be assessed through\n5.1 Practical demonstration/direct observation\n5.2 Portfolio and third party report\n6. Context of Assessment 6.1 Assessment may be done in the workplace or in a\nsimulated workplace setting (assessment centers)\n6.2 Assessment activities are carried out in TESDA’s\naccredited assessment centers\n\n--- PDF PAGE 44 ---\nTESDA-SOP-QSO-01-F08\nTR - HOUSEKEEPING NC II (Amended)\nPromulgated December 2013\n40\nUNIT OF COMPETENCY :\nPROVIDE VALET/BUTLER SERVICE\n\nUNIT CODE\n:\nTRS5123113\n\nUNIT DESCRIPTOR\n:\nThis unit of competency deals with the skills and\nknowledge required to provide valet/butler services in a\ncommercial accommodation establishment. This role\nwould generally be undertaken by staff members with\nsound organizational and interpersonal skills within limit\nof responsibility.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Provide valet services\nto guests\n1.1 Role of valet is defined in accordance with enterprise\npolicy\n1.2 Valet services are prepared to be delivered\n1.3 Valet services is delivered within limit of responsibility\n1.4 Valet services is recorded\n2. Display professional\nstandards\n\n2.1 Rapport is established and feelings of goodwill are\nenhanced between the guest within limit of responsibility\n2.2 Knowledge of individual guest’s records is accessed\nand utilized to provide personalized and quality\nservices based on guest instructions and enterprise\npolicy\n2.3 Valet grooming and communication standards are\nfollowed, in accordance with enterprise policy\n\n3. Care for guest property 3.1 Luggage is set in room based on guest instructions and\nenterprise policy\n3.2 Guest clothes may be processed based on guest\ninstructions and enterprise policy\n3.3 Shoes are cleaned based on guest instructions\n3.4 Repairs are made or organized based on guest\ninstructions, in accordance with enterprise policy\n3.5 Confidentiality of guest’s property and activities is\nmaintained in accordance with legal and ethical\nrequirements\n\n--- PDF PAGE 45 ---\nTESDA-SOP-QSO-01-F08\nTR - HOUSEKEEPING NC II (Amended)\nPromulgated December 2013\n41\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Guest records\n\nMay include:\n1.1\nBasic contact lists and details, as provided by the\nestablishment\n1.2\nBasic customer preference profiles, as provided by the\nestablishment\n2. Services\nMay include:\n2.1\nPacking and unpacking service\n2.2\nShoe cleaning\n2.3\nPressing\n\n3. Repairs\nMay include:\n3.1\nServicing of buttons\n3.2\nZipper repairs\n\n--- PDF PAGE 46 ---\nTESDA-SOP-QSO-01-F08\nTR - HOUSEKEEPING NC II (Amended)\nPromulgated December 2013\n42\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nDemonstrated ability to explain the current role of valet\nservice within the hospitality industry\n1.2\nDemonstrated ability to care for guest property\n1.3\nDemonstrated exemplary personal presentation and\ncommunication standards\n2. Required Knowledge 2.1\nTrade Theory\n2.1.1 Valet service and its current role in the\nhospitality industry\n2.1.2 Oral and written communication on building\nguest rapport\n2.1.3 Protocols for ensuring optimum privacy and\nconfidentiality for all guests\n2.2 Roles of valet\n3. Required\nSkills\n3.1\nOral & written communication skills\n3.2\nSpecial protocols for dealing with VIP guests\n4. Resource Implications\nThe following resources/situations MUST be provided\n4.1\nWorkplace location\n4.2\nInteraction with others to demonstrate appropriate\ninterpersonal skills and ability to organize services\n5. Methods of\nAssessment\nCompetency in this unit may or must be assessed through\n5.1\nPractical demonstration/direct observation\n5.2\nThird party report\n5.3\nOral questioning\n\n6. Context of Assessment 6.1\nAssessment may be done in the workplace or in a\nsimulated workplace setting (assessment centers)\n6.2\nAssessment activities are carried out in TESDA’s\naccredited assessment centers\n\n--- PDF PAGE 47 ---\nTESDA-SOP-QSO-01-F08\nTR - HOUSEKEEPING NC II (Amended)\nPromulgated December 2013\n43\nUNIT OF COMPETENCY :\nLAUNDRY LINEN AND GUEST CLOTHES\n\nUNIT CODE\n:\nTRS5123114\n\nUNIT DESCRIPTOR\n:\nThis unit of competency deals with the skills and\nknowledge required to work in an “on-premise” laundry\nsection in a commercial accommodation establishment\napplied to guest laundry, and in-house linen and\nuniforms.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Collect laundry for\nlaundering functions\n1.1 The role of an on-premise laundry is identified according\nto enterprise policy\n1.2 Guest clothes are picked up in accordance with\nenterprise policy\n1.3 In-house items are picked up in accordance with\nenterprise policy\n\n2. Perform laundering\nfunctions\n2.1 Items are correctly sorted and counted according to\ncleaning process required and urgency of the item\n2.2 Items for laundering are checked for stains and are\ntreated using the correct process\n2.3 Laundry methods are selected in accordance with textile\nlabeling codes and based on fiber and fabric, dye\nfastness, degree of spoilage and washing instructions\n2.4 Laundry equipment is operated in accordance with\nmanufacturer’s instructions\n2.5 Any damage arising from the laundering process is\nrecorded and appropriate person(s) is/are notified in\naccordance with enterprise procedures\n2.6 Cleaning agents and chemicals are used in accordance\nwith manufacturer’s instructions and specific laundry\nequipment\n2.7 Items are checked after the laundering process to\nensure quality cleaning\n2.8 Pressing and finishing processes are correctly\ncompleted in accordance with textile characteristics and\nclient requirements\n\n3. Process laundered\nitem\n3.1 Post cleaning laundry activity are performed in\naccordance with enterprise policy\n3.2 Results of cleaning are checked and appropriate\nadditional action is taken.\n3.3 Internal record and billing instructions are processed in\naccordance with enterprise procedures\n3.4 Necessary internal laundry reports are produced\n4. Return laundered item\n4.1 Guest clothes are delivered in accordance with\nenterprise policy\n4.2 In-house items are delivered in accordance with\nenterprise policy\n\n--- PDF PAGE 48 ---\nTESDA-SOP-QSO-01-F08\nTR - HOUSEKEEPING NC II (Amended)\nPromulgated December 2013\n44\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Cleaning process\nMay include:\n1.1 Dry clean\n1.2 Hand wash\n1.3 Machine wash\n\n2. Laundry equipment\n\nMay include:\n2.1\nWashers\n2.2\nDryers\n2.3\nIrons\n2.4\nSteam pressers\n2.5\nSorting baskets and shelves\n2.6\nHangers\n2.7\nDrying cleaning machine\n2.8\nLabeler\n3. Laundering process\nMay include:\n3.1 Sorting\n3.2 Washing\n3.3 Stain treatment\n3.4 Drying\n3.5 Folding\n3.6 Ironing\n3.7 Steam pressing\n3.8 Mending\n3.9 Minor repairs such as buttons and zippers\n\n--- PDF PAGE 49 ---\nTESDA-SOP-QSO-01-F08\nTR - HOUSEKEEPING NC II (Amended)\nPromulgated December 2013\n45\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nDemonstrated ability to correctly identify the process\nrequired for different types of laundry\n1.2\nDemonstrated ability to operate laundry equipment\nsafely\n1.3\nDemonstrated ability to complete the full laundering\nprocess\n2. Required Knowledge\n2.1\nTheory\n2.1.1 Types of fabric and laundry equipment\n2.1.2 Meaning of laundry and dry cleaning labels on\nclothing\n2.1.3 Key laundry terms\n2.1.4 Common guest laundry issues\n2.2\nSafety Practices\n2.2.1 Hygiene, health and safety issues on laundry\noperations\n2.3\nLaundry Chemicals/Solutions\n2.4\nRole of an “on premise” laundry\n3. Required Skills\n3.1\nOperating laundry equipment\n3.2\nAbility to complete the full laundering process\n3.3\nEstablishment linen handling procedures\n3.4\nUse of specific laundry chemicals\n3.5\nCommunication skills\n4. Resource Implications\nThe following resources MUST be provided\n4.1\nVariety of linen, clothing items and fabrics\n4.2\nIndustry laundry equipment\n4.3\nLaundry Chemicals/ Solutions\n 5. Methods of\nAssessment\nCompetency in this unit may or must be assessed through\n5.1\nOral questioning\n5.2\nPractical demonstration/direct observation\n5.3\nPortfolio\n6. Context of Assessment 6.1\nAssessment may be done in the workplace or in a\nsimulated workplace setting (assessment centers)\n6.2\nAssessment activities are carried out in TESDA’s\naccredited assessment center\n\n--- PDF PAGE 50 ---\nTESDA-SOP-QSO-01-F08\nTR - HOUSEKEEPING NC II (Amended)\nPromulgated December 2013\n46\nUNIT OF COMPETENCY :\nCLEAN PUBLIC AREAS, FACILITIES AND\nEQUIPMENT\n\nUNIT CODE\n:\nTRS512309115\n\nUNIT DESCRIPTOR\n:\nThis unit of competency deals with the knowledge and\nskills required in cleaning public areas, facilities and\nequipment. It includes selecting and setting up of\nequipment and materials; cleaning dry and wet areas;\nand, maintaining and storing cleaning equipment and\nmaterials.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Select and set up\nequipment and\nmaterials\n\n1.1\nEquipment are selected according to type of cleaning to\nbe done\n1.2\nAll equipment are checked if clean and in safe working\ncondition prior to use\n1.3\nSuitable dry and wet cleaning agents and chemicals\nare selected and prepared in accordance with\nmanufacturer’s and relevant occupational health and\nsafety requirements\n1.4\nProtective clothing are selected and used where\nnecessary\n2. Apply cleaning\ntechnique\n2.1\nFurniture, fixtures, ceilings and wallings are assessed\nfor cleaning\n2.2\nAppropriate cleaning equipment and chemicals are\nselected in accordance with the type of material used\n2.3\nCleaning technique is applied on furniture and walling\nmaterials in accordance with type of material used\n2.4\nAppropriate procedures is applied in accordance with\nthe technique\n2.5\nEquipment and chemicals are properly cleaned and\nstored in accordance with manufacturer’s specifications\nand requirements\n3. Clean dry and wet\nareas\n3.1\nWet and dry areas are prepared for cleaning and hazards\nare identified and assessed\n3.2\nThe work area is barricaded or warning signs are placed, as\nappropriate, to reduce risk to colleagues and customers\n3.3\nCleaning agents or chemicals are selected and applied on\nspecific areas in accordance with manufacturer’s\nrecommendations, safety procedures and enterprise policies\nand procedures\n3.4\nEquipment are used safely in accordance with\nmanufacturer's recommendations\n3.5\nGarbage and used chemicals are disposed off in accordance\nwith hygiene, safety and environmental legislation\nrequirements\n4. Maintain and store\ncleaning equipment\nand chemicals\n4.1\nEquipment are cleaned after use in accordance with\nenterprise requirements and manufacturer’s\ninstructions\n4.2\nRoutine preventive maintenance is carried out or\narranged in accordance with enterprise procedures\n4.3\nDefects are identified and reported in accordance with\nenterprise procedures\n4.4\nEquipment are stored in the designated area and in a\ncondition ready for re-use.\n4.5\nChemicals are stored and controlled in accordance with\nhealth and safety requirements.\n\n--- PDF PAGE 51 ---\nTESDA-SOP-QSO-01-F08\nTR - HOUSEKEEPING NC II (Amended)\nPromulgated December 2013\n47\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Occupational health,\nsafety and environment\nrequirements\nMay include:\n1.1\nEstablishment policies and procedures related to\ncleaning operations and disposal of used chemicals\n1.2\nLaws on general workplace safety, hazardous\nsubstances, and manual handling and storage\nrequirements\n1.3\nEstablishment security procedures\n2. Protective clothing\nMay include:\n2.1\noveralls\n2.2\njackets\n2.3\naprons\n2.4\ngoggles and masks\n2.5\nwaterproof clothing and footwear\n2.6\nheadwear\n3. Materials\nMay include:\n3.1\nglass\n3.2\nleather\n3.3\nfabrics\n3.4\nbrass/steel\n3.5\nwood\n3.6\ncarpet\n3.7\nhard floors\n4. Dry and wet areas\nMay include:\n4.1\nbathrooms\n4.2\nbedrooms\n4.3\nkitchens\n4.4\nbalconies\n4.5\nprivate lounge areas\n4.6\npublic areas (both internal and external)\n4.7\nfunction rooms\n4.8\nstorage areas\n4.9\nswimming pool\n\n5. Hazards\nMay include:\n5.1\nspillages\n5.2\nbreakages\n5.3\nwet or slippery surfaces\n5.4\nbroken or damaged furniture\n\n--- PDF PAGE 52 ---\nTESDA-SOP-QSO-01-F08\nTR - HOUSEKEEPING NC II (Amended)\nPromulgated December 2013\n48\n\nVARIABLE\nRANGE\n\n5.5\nfumes\n5.6\nblood\n5.7\nneedles and syringes\n5.8\nused condoms\n5.9\nsharp objects including knives and skewers\n5.10 human waste\n5.11 surgical dressings\n5.12 broken glass\n5.13 fat and oil\n5.14 heated utensils and surfaces\n5.15 sharp food scraps including bones and crustacean shells\n\n6. Chemicals\nMay include:\n6.1\ngeneral and spot cleaning agents\n6.2\ncleaning agents for specialized surfaces including\nwindow and glass cleaners\n6.3\ndisinfectants\n6.4\npesticides\n6.5\ndeodorizers\n6.6\nfurniture and floor polishers\n7. Equipment\nMay include:\n7.1 Scrubbers\n7.2 Polishers\n7.3 Vacuum cleaners\n\n8. Manufacturer\ninstructions\nMay include :\n8.1 cleaning and maintenance guidelines\n8.2 dosage and dilution of chemicals\n8.3 safety requirements\n\n--- PDF PAGE 53 ---\nTESDA-SOP-QSO-01-F08\nTR - HOUSEKEEPING NC II (Amended)\nPromulgated December 2013\n49\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\n\nAssessment requires evidence that the candidate:\n1.1\nDemonstrated ability to understand the importance of\ncleaning services to the overall quality of service\nprovided by the establishment/workplace\n1.2\nDemonstrated ability to safely and efficiently select and\nuse relevant equipment and cleaning agents in\naccordance with acceptable establishment/workplace\nprocedures\n2. Required Knowledge\n2.1\nCommunication\n2.1.1 Communication skills, oral and written\n2.1.2 Management skills\n2.1.3 Staff supervision and handling\n2.2\nSafety Practices\n2.2.1 Practice hygienic preparation and teamwork to\ncolleagues\n2.2.2 National/City/Municipality Occupational health\nand safety legislation\n2.3\nCleaning operations\n2.4\nCommon cleaning chemicals\n2.5\nTreatment of common hazards\n3. Required Skills\n3.1 Cleaning technique\n3.2 Safe handling of cleaning equipment, chemicals and\nagents/tools\n3.3 Time management skills\n3.4 Communication skills\n3.5 Basic mathematical computation skills\n3.6 Analytical skills\n4. Resource Implications\nThe following resources MUST be provided\n4.1\nWorkplace location\n4.2\nCleaning agents, equipment and tools\n5. Methods of\nAssessment\nCompetency in this unit may or must be assessed through\n5.1\nOral questioning\n5.2\nDirect observation/Practical demonstration\n5.3\nPortfolio\n6. Context of Assessment 6.1\nAssessment may be done in the workplace or in a\nsimulated workplace setting (assessment centers)\n6.2\nAssessment activities are carried out in TESDA’s\naccredited assessment centers\n\n--- PDF PAGE 54 ---\nTESDA-SOP-QSO-01-F08\nTR - HOUSEKEEPING NC II (Amended)\nPromulgated December 2013\n50\nUNIT OF COMPETENCY :\nDEAL WITH/HANDLE INTOXICATED GUESTS\n\nUNIT CODE\n:\n TRS5123122\n\nUNIT DESCRIPTOR\n:\nThis unit of competency deals with the knowledge, skills\nand attitude in handling or dealing with intoxicated\nguests at the workplace. It includes the knowledge and\nskills on how to determine the level of intoxication,\nproper approach, application of appropriate procedure\nand the knowledge on legislation for alcoholic drinks.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized items are elaborated in the Range of Variables\n1. Determine the level of\nintoxication\n\n1.1 Level of intoxication of guest is assessed in\naccordance with industry procedure.\n1.2 Offered assistance politely to intoxicated guest in line\nwith enterprise procedure.\n1.3 Urgently referred difficult situation to immediate boss as\nper enterprise regulations.\n1.4 Intoxicated guest lying on the floor is not touched but is\ncarefully watched in line with industry practice.\n1.5 Sought immediate assistance from hotel security\npersonnel for the situations that posing a threat to safety\nand security according to enterprise procedure.\n2. Apply appropriate\nprocedures\n\n2.1 Analyzed the situation carefully\na. Applied procedures appropriate to the situation and\nin accordance with organizational policy\nb. Explained politely the position to the guest using\nappropriate communication skills\n2.2 Assisted the guest to leave the premises when\nnecessary in accordance with enterprise procedure.\n3. Comply with legislation\n3.1 Dealt with intoxicated persons in line with industry\npractice\n3.2 Dealt with underage drinkers with caution and care in\ncompliance with legal regulations\n3.3 Complied with legislative requirements as per alcoholic\nregulations\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Assess intoxication\nlevels\nMay include:\n1.1 Changes in behavior\n1.2 Monitoring noise level\n1.3 Monitoring drink orders\n1.4 Slowing service.\n2. Assistance\nMay include:\n2.1 Organizing transport for guest wishing to leave\n2.2 Suggesting staying in a room in the hotel\n2.3 Assisting guest to leave the premises\n\n--- PDF PAGE 55 ---\nTESDA-SOP-QSO-01-F08\nTR - HOUSEKEEPING NC II (Amended)\nPromulgated December 2013\n51\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate/ trainee :\n1.1 Demonstrated full knowledge of the effects of alcohol\nand factors which influence guest’s actions.\n1.2 Demonstrated knowledge of legal requirements for\nalcohol service and consumption\n1.3 Demonstrated knowledge of the benefits in creating\na responsible licensed drinking environment to self,\ncolleagues and customer/guests\n1.4 Demonstrated knowledge of ways of assessing\nintoxication of guests.\n2. Required Skills\n2.1 Dealt diplomatically on the disruptive intoxicated\nguests.\n2.2 Ability to communicate to make the guest understand\nthe position.\n2.3 Ability to demonstrate respect and concern in\nhandling intoxicated guest\n3. Required Knowledge\n3.1 Manifested full understanding of legal requirements\nfor alcohol service and consumption.\n3.2 Demonstrated ability to manage intoxicated persons\nusing appropriate communication, conflict resolution\nand anger management techniques\n3.3 Exhibited the ability to offer appropriate guests\nassistance.\n3.4 Manifested full knowledge of the effects of alcohol\nand factors which influence effects.\n3.5 Discussed the knowledge of the benefits in creating\na responsible licensed drinking environment to self,\ncolleagues and guests\n3.6 Demonstrated knowledge of ways of assessing\nintoxicated guests.\n4. Resource Implications\n4.1 Sources of information on the industry\n4.2\nIndustry knowledge about alcohol\n5. Methods of\nAssessment\nCompetency in this unit may or must be assessed through\n5.1 Oral questions\n5.2 Written questions\n5.3 Work projects\n5.4 Workplace observation of practical skills\n5.5 Practical exercises/Role Play/Demonstration\n5.6 Formal report from supervisor\n6. Context of\nAssessment\n6.1 Assessment may be done in the workplace or in a\nsimulated workplace setting (assessment centers)\n6.2 Assessment activities are carried out through\nTESDA's accredited assessment center.\n\n--- PDF PAGE 56 ---\nTR - HOUSEKEEPING NC II (Amended)\nPromulgated December 2013\n52"
