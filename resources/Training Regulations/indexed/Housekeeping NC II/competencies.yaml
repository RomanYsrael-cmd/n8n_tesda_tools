  - unit_code: TRS5123122
    title: Deal with/Handle intoxicated guests
    descriptor: This unit of competency deals with the knowledge, skills and attitude in handling or dealing with intoxicated
      guests at the workplace. It includes the knowledge and skills on how to determine the level of intoxication, proper
      approach, application of appropriate procedure and the knowledge on legislation for alcoholic drinks.
    provenance:
      printed_pages: 50-51
      pdf_pages: 54-55
    elements:
    - element_id: TRS5123122:element:1
      number: 1
      title: Determine the level of intoxication
      performance_criteria:
      - pc_id: TRS5123122:pc:1.1:1
        number: '1.1'
        text: Level of intoxication of guest is assessed in accordance with industry procedure.
      - pc_id: TRS5123122:pc:1.2:1
        number: '1.2'
        text: Offered assistance politely to intoxicated guest in line with enterprise procedure.
      - pc_id: TRS5123122:pc:1.3:1
        number: '1.3'
        text: Urgently referred difficult situation to immediate boss as per enterprise regulations.
      - pc_id: TRS5123122:pc:1.4:1
        number: '1.4'
        text: Intoxicated guest lying on the floor is not touched but is carefully watched in line with industry practice.
      - pc_id: TRS5123122:pc:1.5:1
        number: '1.5'
        text: Sought immediate assistance from hotel security personnel for the situations that posing a threat to safety
          and security according to enterprise procedure.
    - element_id: TRS5123122:element:2
      number: 2
      title: Apply appropriate procedures
      performance_criteria:
      - pc_id: TRS5123122:pc:2.1:1
        number: '2.1'
        text: Analyzed the situation carefully
        subcriteria:
        - label: a
          text: Applied procedures appropriate to the situation and in accordance with organizational policy
        - label: b
          text: Explained politely  the position to the guest  using appropriate communication skills
      - pc_id: TRS5123122:pc:2.2:1
        number: '2.2'
        text: Assisted the guest to leave the premises when necessary in accordance with enterprise procedure.
    - element_id: TRS5123122:element:3
      number: 3
      title: Comply with legislation
      performance_criteria:
      - pc_id: TRS5123122:pc:3.1:1
        number: '3.1'
        text: Dealt with intoxicated persons in line with industry practice
      - pc_id: TRS5123122:pc:3.2:1
        number: '3.2'
        text: Dealt with underage drinkers with caution and care in compliance with legal regulations
      - pc_id: TRS5123122:pc:3.3:1
        number: '3.3'
        text: Complied with legislative requirements as per alcoholic regulations
    range_of_variables:
    - range_id: TRS5123122:range:1
      number: '1'
      variable: Assess intoxication levels
      values:
      - number: '1.1'
        text: Changes in behavior
      - number: '1.2'
        text: Monitoring noise level
      - number: '1.3'
        text: Monitoring drink orders
      - number: '1.4'
        text: Slowing service.
      qualifier: May include
    - range_id: TRS5123122:range:2
      number: '2'
      variable: Assistance
      values:
      - number: '2.1'
        text: Organizing transport for guest wishing to leave
      - number: '2.2'
        text: Suggesting staying in a room in the hotel
      - number: '2.3'
        text: Assisting guest to leave the premises
      qualifier: May include
    evidence_guide:
      critical_aspects:
        intro: 'Competency Assessment requires evidence that the candidate/ trainee :'
        items:
        - number: '1.1'
          text: Demonstrated full knowledge of the effects of alcohol and factors which influence guest’s actions.
        - number: '1.2'
          text: Demonstrated knowledge of legal requirements for alcohol service and consumption
        - number: '1.3'
          text: Demonstrated knowledge of the benefits in creating a responsible licensed drinking environment to self, colleagues
            and customer/guests
        - number: '1.4'
          text: Demonstrated knowledge of ways of assessing intoxication of guests.
      required_skills:
        items:
        - number: '2.1'
          text: Dealt diplomatically on the disruptive intoxicated guests.
        - number: '2.2'
          text: Ability to communicate to make the guest understand the position.
        - number: '2.3'
          text: Ability to demonstrate  respect and concern in handling intoxicated guest
      required_knowledge:
        items:
        - number: '3.1'
          text: Manifested full understanding of legal requirements for alcohol service and consumption.
        - number: '3.2'
          text: Demonstrated ability to manage intoxicated persons using appropriate communication, conflict resolution and
            anger management techniques
        - number: '3.3'
          text: Exhibited the ability to offer appropriate guests assistance.
        - number: '3.4'
          text: Manifested full knowledge of the effects of alcohol and factors which influence effects.
        - number: '3.5'
          text: Discussed the knowledge of the benefits in creating a responsible licensed drinking environment to self, colleagues
            and guests
        - number: '3.6'
          text: Demonstrated knowledge of ways of assessing intoxicated guests.
      underpinning_knowledge:
        items:
        - number: '4.1'
          text: Sources of information on the industry
        - number: '4.2'
          text: Industry knowledge about alcohol
      methods_of_assessment:
        intro: Assessment Competency in this unit may or must be assessed through
        items:
        - number: '5.1'
          text: Oral questions
        - number: '5.2'
          text: Written questions
        - number: '5.3'
          text: Work projects
        - number: '5.4'
          text: Workplace observation of practical skills
        - number: '5.5'
          text: Practical exercises/Role Play/Demonstration
        - number: '5.6'
          text: Formal report from supervisor
      context_of_assessment:
        intro: Assessment
        items:
        - number: '6.1'
          text: Assessment may be done in the workplace or in a simulated workplace setting (assessment centers)
        - number: '6.2'
          text: Assessment activities are carried out through TESDA's accredited assessment center.
