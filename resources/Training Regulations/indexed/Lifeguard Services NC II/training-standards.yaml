      "source_text": "3.1 CURRICULUM DESIGN\n\nTESDA shall provide training on the development of competency-based curricula to enable\ntraining providers develop their own curricula with the components mentioned below.\n\nDelivery of knowledge requirements for the basic, common and core units of competency\nspecifically in the areas of mathematics, science/technology, communication/language and other\nacademic subjects shall be contextualized. To this end, TVET providers shall develop a Contextual\nLearning Matrix (CLM) to include also green technology, issues on health and drugs and cater to\npersons with disabilities (PWD’s).\n\nCourse Title: LIFEGUARD SERVICES\nNC Level NC II\n\nNominal Training Duration:\n\n 20 hrs\nBasic Competencies\n\n240 hrs\nCommon Competencies\n\n720 hrs\nCore Competencies\nTotal\n980 hrs\n\nCourse Description:\n\nThis course is designed to enhance the knowledge, desirable attitudes and skills of an\naquatic lifesaver or pool lifeguard and in accordance with industry standards. It covers\ncompetencies for prevention of drowning and other aquatic accidents mainly at still waters such as\nswimming pool in public recreation facilities, hotels, resorts and condominiums or homes. Subjects\ntaught likewise develop skills in water safety, lifesaving and rescue at open water environments\nsuch as in rivers, lakes and beaches.\n\nTo obtain this, all units prescribed for this qualification must be achieved.\n\n--- PDF PAGE 106 ---\nTESDA-SOP-QSO-01-F08\nTR – Lifeguard Services NC II (New) Promulgated December 16, 2015\n 102\nBASIC COMPETENCIES\n20 HRS\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment Approach\nNominal\nDuration\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and\nconvey\nworkplace\ninformation\n• Describe Organizational\npolicies\n\n•\nGroup\ndiscussion\n• Oral evaluation\n4 Hours\n\n• Read:\no Effective communication\n•\nLecture\n• Written examination\n\no Written communication\n\no Communication procedures\nand systems\n\n• Identify:\no Different modes of\ncommunication\n\no Medium of communication\no Flow of communication\n\no Available technology\nrelevant to the enterprise\nand the individual’s work\nresponsibilities\n\n• Prepare different Types of\nquestion\n•\nDemonstration\n• Observation\n\n• Gather different sources of\ninformation\n\n• Apply storage system in\nestablishing workplace\ninformation\n\n• Demonstrate Telephone\ncourtesy\n\n1.2 Complete\nrelevant work\nrelated\ndocuments\n• Describe Communication\nprocedures and systems\n•\nGroup\ndiscussion\n• Oral evaluation\n\n• Read:\no Meeting protocols\n•\nLecture\n• Written examination\n\n--- PDF PAGE 107 ---\nTESDA-SOP-QSO-01-F08\nTR – Lifeguard Services NC II (New) Promulgated December 16, 2015\n 103\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment Approach\nNominal\nDuration\n\no Nature of workplace\nmeetings\n•\nLecture\n• Written examination\n\no Workplace interactions\n\no Barriers of communication\n\n• Complete work related\ndocuments\n•\nDemonstration\n• Observation\n\n• Read instructions on work\nrelated forms/documents\n•\nLecture\n• Written examination\n\n• Practice:\n\no Estimate, calculate and\nrecord routine workplace\nmeasures\n•\nDemonstration\n• Observation\n\no Basic mathematical\nprocesses of addition,\nsubtraction, division and\nmultiplication\n\n• Demonstrate office activities in:\no workplace meetings and\ndiscussions scenario\n•\nRole play\n• Oral evaluation\n• Observation\n\n• Perform workplace duties\nscenario following simple written\nnotices\n•\nRole play\n• Oral evaluation\n• Observation\n\n• Follow simple spoken language\n•\nDemonstration\n• Observation\n\n• Identify the different Non-verbal\ncommunication\n•\nLecture\n• Written examination\n\n• Demonstrate ability to relate to\npeople of social range in the\nworkplace\n•\nDemonstration\n• Observation\n\n• Gather and provide information\nin response to workplace\nrequirements\n\n--- PDF PAGE 108 ---\nTESDA-SOP-QSO-01-F08\nTR – Lifeguard Services NC II (New) Promulgated December 16, 2015\n 104\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment Approach\nNominal\nDuration\n\n1.3 Participate in\nworkplace\nmeeting and\ndiscussion\n• Identify:\no types of workplace\ndocuments and forms\n•\nLecture\n• Written examination\n\no kinds of workplace report\n\no Available technology relevant\nto the enterprise and the\nindividual’s work\nresponsibilities\n\n• Read and follow instructions in\napplying basic mathematical\nconcepts\n\n• Follow simple spoken language\n•\nDemonstration\n• Observation\n\n• Demonstrate ability to relate to\npeople of social range in the\nworkplace\n•\nDemonstration\n• Observation\n\n• Gather and provide information\nin response to workplace\nrequirements\n\n2. Work in a team\nenvironment\n2.1 Describe and\nidentify team\nrole and\nresponsibility\nin a team.\n• Describe the team role and\nscope\n•\nGroup\ndiscussion\n• Oral evaluation\n4 Hours\n\n• Read\no Definition of Team\n•\nLecture\n• Written examination\n\no Difference between team and\ngroup\n\no Objectives and goals of team\n\n• Identify different sources of\ninformation\n\n--- PDF PAGE 109 ---\nTESDA-SOP-QSO-01-F08\nTR – Lifeguard Services NC II (New) Promulgated December 16, 2015\n 105\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment Approach\nNominal\nDuration\n\n2.2 Describe work\nas a team\n• Describe team goals and\nobjectives\n•\nGroup\ndiscussion\n• Oral evaluation\n\n• Perform in setting team goals\nand expectations scenario\n•\nRole play\n• Oral evaluation\n• Observation\n\n• Identify\no individual role and\nresponsibility\n•\nLecture\n• Written examination\n\n• Practice Interacting effectively\nwith others\n•\nGroup\ndiscussion\n• Oral evaluation\n\n• Read:\n•\nLecture\n• Written examination\n\no Fundamental rights at work\nincluding gender sensitivity\n\no Understanding in