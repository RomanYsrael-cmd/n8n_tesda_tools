 Aqua code\n\n• Read:\no The Principle of Aquacode\n- G = go together\n- S = stay afloat and wave\n-\nR = reach to rescue\n•\nLecture\n• Written examination\n80 Hours\no Definition of Drowning\no Water Safety\no Safety consideration as a\nLifesaver\n\no Prevention of aquatic\nemergencies\n\n• Practice buddy system, calmly\nwaving while floating in water\nand conduct reach rescue using\na stick or a rope.\n• Demonstration\n• Observation\n\n• Estimate distance to safety and\nfeel depth of water.\n\n• Prepare materials, specification\nand maintenance of swim wear,\neye wear, foot wear and throw\nline or rope\n\n• Read environmental protection\nand concerns\n• Lecture\n• Written Test\n\n• Practice in-house safety\nprocedure on environmental\nprotection, good grooming and\nhygiene, occupational safety\nand health standards\n• Demonstration\n• Observation\n\n--- PDF PAGE 114 ---\nTESDA-SOP-QSO-01-F08\nTR – Lifeguard Services NC II (New) Promulgated December 16, 2015\n 110\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment Approach\nNominal\nDuration\n\n• Prepare red and yellow uniform,\nsun protection devices\nrehydration fluids, and mobile\nphones for emergency services.\n• Demonstration\n• Observation\n\n• Practice 5s in safekeeping wet\npersonal wears and lifesaving\naids\n\n• Practice good grooming and\npersonal hygiene\n\n• Demonstrate ability to\ncomprehend oral and written\ncommunication\n\n• Apply personal values in an\naquatic environment\n\n1.2 Use\nRecognized\nClothing and\nOutdoor\nProtective\nDevices\n\n• Read:\no Getting Ready for Aquatic\nWorks\no Sun Safety\no Red and Yellow Lifeguard\nUniform\n\n• Lecture\n\n• Written examination\n\n• Demonstrate applying skin\nsunscreen and proper wearing\nof lifeguard uniform, swim wear,\neyewear, tents and first aid bag.\n• Demonstration\n• Observation\n\n• Demonstrate ability to\ncomprehend oral and written\ncommunication\n\n• Apply personal values in an\naquatic environment\n\n---