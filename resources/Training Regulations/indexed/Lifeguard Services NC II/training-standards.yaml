ral evaluation\n\n4. Practice\noccupational\nhealth and\nsafety\n4.1 Identify\nhazard and\nrisks\n• Describe OSH procedures,\npractices and regulations\n•\nGroup\ndiscussion\n• Oral evaluation\n6 Hours\n\n•Read\n•\nLecture\n• Written examination\n\no OSH indicators\n\no Organizational contingency\npractices\n\n• Practice hazards/risks\nidentification and control\n\n4.2 Evaluate\nhazard and\nrisks\n• Describe effects of safety\nhazards\n•\nGroup\ndiscussion\n• Oral evaluation\n\n•Read\n•\nLecture\n• Written examination\n\no Threshold Limit Value –TLV\n\n•Practice reporting safety hazards\n•\nRole play\n•Observation\n\n• Demonstrate evaluating hazards\nand risks using communication\nequipment\n•\nDemonstration\n• Observation\n\n4.3 Control\nhazards and\nrisks\n• Describe :\no Organization safety and\nhealth protocol\n•\nGroup\ndiscussion\n• Oral evaluation\n\no Company emergency\nprocedure practices\n\n•Practice personal hygiene\n•\nDemonstration\n•Observation\n\n• Practice drills on responding to\nemergency\n•\nDemonstration\n•\nSimulation\n• Observation\n\n--- PDF PAGE 112 ---\nTESDA-SOP-QSO-01-F08\nTR – Lifeguard Services NC II (New) Promulgated December 16, 2015\n 108\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment Approach\nNominal\nDuration\n\n4.4 Maintain\noccupational\nhealth and\nsafety\nawareness\n• Identify emergency-related drills\ninformation\n•\nLecture\n• Written examination\n\n• Practice occupational safety and\nhealth standards on personal\nrecords in the workplace\n•\nRole play\n• Observation\n\n• Practice emergency related drills\nin the workplace\n•\nDemonstration\n•\nSimulation\n• Observation\n\n--- PDF PAGE 113 ---\nTESDA-SOP-QSO-01-F08\nTR – Lifeguard Services NC II (New) Promulgated December 16, 2015\n 109\n\nCOMMON COMPETENCIES\n240 HRS\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment Approach\nNominal\nDuration\n1. Demonstrate\nKnowledge\nand Skills on\nWater Safet