 Oral evaluation\n\n4. Practice\noccupational\nhealth and\nsafety\n4.1 Identify\nhazard and\nrisks\n• Describe OSH procedures,\npractices and regulations\n•\nGroup\ndiscussion\n• Oral evaluation\n6 Hours\n\n•Read\n•\nLecture\n• Written examination\n\no OSH indicators\n\no Organizational contingency\npractices\n\n• Practice hazards/risks\nidentification and control\n\n4.2 Evaluate\nhazard and\nrisks\n• Describe effects of safety\nhazards\n•\nGroup\ndiscussion\n• Oral evaluation\n\n•Read\n•\nLecture\n• Written examination\n\no Threshold Limit Value –TLV\n\n•Practice reporting safety hazards\n•\nRole play\n•Observation\n\n• Demonstrate evaluating hazards\nand risks using communication\nequipment\n•\nDemonstration\n• Observation\n\n4.3 Control\nhazards and\nrisks\n• Describe :\no Organization safety and\nhealth protocol\n•\nGroup\ndiscussion\n• Oral evaluation\n\no Company emergency\nprocedure practices\n\n•Practice personal hygiene\n•\nDemonstration\n•Observation\n\n• Practice drills on responding to\nemergency\n•\nDemonstration\n•\nSimulation\n• Observation\n\n--- PDF PAGE 112 ---\nTESDA-SOP-QSO-01-F08\nTR – Lifeguard Services NC II (New) Promulgated December 16, 2015\n 108\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment Approach\nNominal\nDuration\n\n4.4 Maintain\noccupational\nhealth and\nsafety\nawareness\n• Identify emergency-related drills\ninformation\n•\nLecture\n• Written examination\n\n• Practice occupational safety and\nhealth standards on personal\nrecords in the workplace\n•\nRole play\n• Observation\n\n• Practice emergency related drills\nin the workplace\n•\nDemonstration\n•\nSimulation\n• Observation\n\n--- PDF PAGE 113 ---\nTESDA-SOP-QSO-01-F08\nTR – Lifeguard Services NC II (New) Promulgated December 16, 2015\n 109\n\nCOMMON COMPETENCIES\n240 HRS\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment Approach\nNominal\nDuration\n1. Demonstrate\nKnowledge\nand Skills on\nWater Safety\n\n1.1 Implement\nthe Aqua code\n\n• Read:\no The Principle of Aquacode\n- G = go together\n- S = stay afloat and wave\n-\nR = reach to rescue\n•\nLecture\n• Written examination\n80 Hours\no Definition of Drowning\no Water Safety\no Safety consideration as a\nLifesaver\n\no Prevention of aquatic\nemergencies\n\n• Practice buddy system, calmly\nwaving while floating in water\nand conduct reach rescue using\na stick or a rope.\n• Demonstration\n• Observation\n\n• Estimate distance to safety and\nfeel depth of water.\n\n• Prepare materials, specification\nand maintenance of swim wear,\neye wear, foot wear and throw\nline or rope\n\n• Read environmental protection\nand concerns\n• Lecture\n• Written Test\n\n• Practice in-house safety\nprocedure on environmental\nprotection, good grooming and\nhygiene, occupational safety\nand health standards\n• Demonstration\n• Observation\n\n--- PDF PAGE 114 ---\nTESDA-SOP-QSO-01-F08\nTR – Lifeguard Services NC II (New) Promulgated December 16, 2015\n 110\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment Approach\nNominal\nDuration\n\n• Prepare red and yellow uniform,\nsun protection devices\nrehydration fluids, and mobile\nphones for emergency services.\n• Demonstration\n• Observation\n\n• Practice 5s in safekeeping wet\npersonal wears and lifesaving\naids\n\n• Practice good grooming and\npersonal hygiene\n\n• Demonstrate ability to\ncomprehend oral and written\ncommunication\n\n• Apply personal values in an\naquatic environment\n\n1.2 Use\nRecognized\nClothing and\nOutdoor\nProtective\nDevices\n\n• Read:\no Getting Ready for Aquatic\nWorks\no Sun Safety\no Red and Yellow Lifeguard\nUniform\n\n• Lecture\n\n• Written examination\n\n• Demonstrate applying skin\nsunscreen and proper wearing\nof lifeguard uniform, swim wear,\neyewear, tents and first aid bag.\n• Demonstration\n• Observation\n\n• Demonstrate ability to\ncomprehend oral and written\ncommunication\n\n• Apply personal values in an\na