  "source_section_text": "SECTION 3 TRAINING ARRANGEMENTS\n\nThese standards are set to provide technical and vocational education and training (TVET)\nproviders with information and other important requirements to consider when designing training\nprograms for LIFEGUARD SERVICES NCII.\n\nThey include information on curriculum design; training delivery; trainee entry requirements;\ntools and equipment; training facilities; and trainer’s qualification.\n\n3.1 CURRICULUM DESIGN\n\nTESDA shall provide training on the development of competency-based curricula to enable\ntraining providers develop their own curricula with the components mentioned below.\n\nDelivery of knowledge requirements for the basic, common and core units of competency\nspecifically in the areas of mathematics, science/technology, communication/language and other\nacademic subjects shall be contextualized. To this end, TVET providers shall develop a Contextual\nLearning Matrix (CLM) to include also green technology, issues on health and drugs and cater to\npersons with disabilities (PWD’s).\n\nCourse Title: LIFEGUARD SERVICES\nNC Level NC II\n\nNominal Training Duration:\n\n 20 hrs\nBasic Competencies\n\n240 hrs\nCommon Competencies\n\n720 hrs\nCore Competencies\nTotal\n980 hrs\n\nCourse Description:\n\nThis course is designed to enhance the knowledge, desirable attitudes and skills of an\naquatic lifesaver or pool lifeguard and in accordance with industry standards. It covers\ncompetencies for prevention of drowning and other aquatic accidents mainly at still waters such as\nswimming pool in public recreation facilities, hotels, resorts and condominiums or homes. Subjects\ntaught likewise develop skills in water safety, lifesaving and rescue at open water environments\nsuch as in rivers, lakes and beaches.\n\nTo obtain this, all units prescribed for this qualification must be achieved.\n\n--- PDF PAGE 106 ---\nTESDA-SOP-QSO-01-F08\nTR – Lifeguard Services NC II (New) Promulgated December 16, 2015\n 102\nBASIC COMPETENCIES\n20 HRS\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment Approach\nNominal\nDuration\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and\nconvey\nworkplace\ninformation\n• Describe Organizational\npolicies\n\n•\nGroup\ndiscussion\n• Oral evaluation\n4 Hours\n\n• Read:\no Effective communication\n•\nLecture\n• Written examination\n\no Written communication\n\no Communication procedures\nand systems\n\n• Identify:\no Different modes of\ncommunication\n\no Medium of communication\no Flow of communication\n\no Available technology\nrelevant to the enterprise\nand the individual’s work\nresponsibilities\n\n• Prepare different Types of\nquestion\n•\nDemonstration\n• Observation\n\n• Gather different sources of\ninformation\n\n• Apply storage system in\nestablishing workplace\ninformation\n\n• Demonstrate Telephone\ncourtesy\n\n1.2 Complete\nrelevant work\nrelated\ndocuments\n• Describe Communication\nprocedures and systems\n•\nGroup\ndiscussion\n• Oral evaluation\n\n• Read:\no Meeting protocols\n•\nLecture\n• Written examination\n\n--- PDF PAGE 107 ---\nTESDA-SOP-QSO-01-F08\nTR – Lifeguard Services NC II (New) Promulgated December 16, 2015\n 103\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment Approach\nNominal\nDuration\n\no Nature of workplace\nmeetings\n•\nLecture\n• Written examination\n\no Workplace interactions\n\no Barriers of communication\n\n• Complete work related\ndocuments\n•\nDemonstration\n• Observation\n\n• Read instructions on work\nrelated forms/documents\n•\nLecture\n• Written examination\n\n• Practice:\n\no Estimate, calculate and\nrecord routine workplace\nmeasures\n•\nDemonstration\n• Observation\n\no Basic mathematical\nprocesses of addition,\nsubtraction, division and\nmultiplication\n\n• Demonstrate office activities in:\no workplace meetings and\ndiscussions scenario\n•\nRole play\n• Oral evaluation\n• Observation\n\n• Perform workplace duties\nscenario following simple written\nnotices\n•\nRole play\n• Oral evaluation\n• Observation\n\n• Follow simple spoken language\n•\nDemonstration\n• Observation\n\n• Identify the different Non-verbal\ncommunication\n•\nLecture\n• Written examination\n\n• Demonstrate ability to relate to\npeople of social range in the\nworkplace\n•\nDemonstration\n• Observation\n\n• Gather and provide information\nin response to workplace\nrequirements\n\n--- PDF PAGE 108 ---\nTESDA-SOP-QSO-01-F08\nTR – Lifeguard Services NC II (New) Promulgated December 16, 2015\n 104\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment Approach\nNominal\nDuration\n\n1.3 Participate in\nworkplace\nmeeting and\ndiscussion\n• Identify:\no types of workplace\ndocuments and forms\n•\nLecture\n• Written examination\n\no kinds of workplace report\n\no Available technology relevant\nto the enterprise and the\nindividual’s work\nresponsibilities\n\n• Read and follow instructions in\napplying basic mathematical\nconcepts\n\n• Follow simple spoken language\n•\nDemonstration\n• Observation\n\n• Demonstrate ability to relate to\npeople of social range in the\nworkplace\n•\nDemonstration\n• Observation\n\n• Gather and provide information\nin response to workplace\nrequirements\n\n2. Work in a team\nenvironment\n2.1 Describe and\nidentify team\nrole and\nresponsibility\nin a team.\n• Describe the team role and\nscope\n•\nGroup\ndiscussion\n• Oral evaluation\n4 Hours\n\n• Read\no Definition of Team\n•\nLecture\n• Written examination\n\no Difference between team and\ngroup\n\no Objectives and goals of team\n\n• Identify different sources of\ninformation\n\n--- PDF PAGE 109 ---\nTESDA-SOP-QSO-01-F08\nTR – Lifeguard Services NC II (New) Promulgated December 16, 2015\n 105\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment Approach\nNominal\nDuration\n\n2.2 Describe work\nas a team\n• Describe team goals and\nobjectives\n•\nGroup\ndiscussion\n• Oral evaluation\n\n• Perform in setting team goals\nand expectations scenario\n•\nRole play\n• Oral evaluation\n• Observation\n\n• Identify\no individual role and\nresponsibility\n•\nLecture\n• Written examination\n\n• Practice Interacting effectively\nwith others\n•\nGroup\ndiscussion\n• Oral evaluation\n\n• Read:\n•\nLecture\n• Written examination\n\no Fundamental rights at work\nincluding gender sensitivity\n\no Understanding individual\ncompetencies relative to\nteamwork\n\no Types of individuals\n\no Role of leaders\n\n3. Practice career\nprofessionalism\n3.1 Integrate\npersonal\nobjectives\nwith\norganizational\ngoals\n• Describe performance\nevaluation\n•\nGroup\ndiscussion\n• Oral evaluation\n6 Hours\n• Read:\n•\nLecture\n• Written examination\n\no Work values and ethics (Code\nof Conduct, Code of Ethics,\netc.)\n\no Understanding personal\nobjectives\n\no Understanding organizational\ngoals\n\n--- PDF PAGE 110 ---\nTESDA-SOP-QSO-01-F08\nTR – Lifeguard Services NC II (New) Promulgated December 16, 2015\n 106\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment Approach\nNominal\nDuration\n\n• Demonstrate Intra and\nInterpersonal skills at work\n•\nDemonstration\n• Observation\n\n• Demonstrate personal\ncommitment in work\n\n3.2 Set and meet\nwork priorities\n• Describe company policies,\noperations, procedures and\nstandards\n•\nGroup\ndiscussion\n• Oral evaluation\n\n• Read:\n•\nLecture\n• Written examination\n\no Time Management\n\no Basic strategic planning\nconcepts\n\no Resource utilization and\nmanagement\n\n•Apply managing goals and time\n•\nDemonstration\n•Observation\n\n• Practice:\no economic use of resources\nand facilities\n•\nDemonstration\n• Observation\n\no time management\n\n3.3 Maintain\nprofessional\ngrowth and\ndevelopment\n• Describe company recognition\nand incentives\n\n•\nGroup\ndiscussion\n• Oral evaluation\n\n• Read:\n•\nLecture\n• Written examination\n\no Career development\nopportunities\n\no Information on relevant\nlicenses and or certifications\n\no personal career development\nneeds\n\n•Identify career opportunities\n\n--- PDF PAGE 111 ---\nTESDA-SOP-QSO-01-F08\nTR – Lifeguard Services NC II (New) Promulgated December 16, 2015\n 107\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment Approach\nNominal\nDuration\n\n• Determine personal career\ndevelopment needs\n•\nGroup\ndiscussion\n• Oral evaluation\n\n4. Practice\noccupational\nhealth and\nsafety\n4.1 Identify\nhazard and\nrisks\n• Describe OSH procedures,\npractices and regulations\n•\nGroup\ndiscussion\n• Oral evaluation\n6 Hours\n\n•Read\n•\nLecture\n• Written examination\n\no OSH indicators\n\no Organizational contingency\npractices\n\n• Practice hazards/risks\nidentification and control\n\n4.2 Evaluate\nhazard and\nrisks\n• Describe effects of safety\nhazards\n•\nGroup\ndiscussion\n• Oral evaluation\n\n•Read\n•\nLecture\n• Written examination\n\no Threshold Limit Value –TLV\n\n•Practice reporting safety hazards\n•\nRole play\n•Observation\n\n• Demonstrate evaluating hazards\nand risks using communication\nequipment\n•\nDemonstration\n• Observation\n\n4.3 Control\nhazards and\nrisks\n• Describe :\no Organization safety and\nhealth protocol\n•\nGroup\ndiscussion\n• Oral evaluation\n\no Company emergency\nprocedure practices\n\n•Practice personal hygiene\n•\nDemonstration\n•Observation\n\n• Practice drills on responding to\nemergency\n•\nDemonstration\n•\nSimulation\n• Observation\n\n--- PDF PAGE 112 ---\nTESDA-SOP-QSO-01-F08\nTR – Lifeguard Services NC II (New) Promulgated December 16, 2015\n 108\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment Approach\nNominal\nDuration\n\n4.4 Maintain\noccupational\nhealth and\nsafety\nawareness\n• Identify emergency-related drills\ninformation\n•\nLecture\n• Written examination\n\n• Practice occupational safety and\nhealth standards on personal\nrecords in the workplace\n•\nRole play\n• Observation\n\n• Practice emergency related drills\nin the workplace\n•\nDemonstration\n•\nSimulation\n• Observation\n\n--- PDF PAGE 113 ---\nTESDA-SOP-QSO-01-F08\nTR – Lifeguard Services NC II (New) Promulgated December 16, 2015\n 109\n\nCOMMON COMPETENCIES\n240 HRS\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment Approach\nNominal\nDuration\n1. Demonstrate\nKnowledge\nand Skills on\nWater Safety\n\n1.1 Implement\nthe Aqua code\n\n• Read:\no The Principle of Aquacode\n- G = go together\n- S = stay afloat and wave\n-\nR = reach to rescue\n•\nLecture\n• Written examination\n80 Hours\no Definition of Drowning\no Water Safety\no Safety consideration as a\nLifesaver\n\no Prevention of aquatic\nemergencies\n\n• Practice buddy system, calmly\nwaving while floating in water\nand conduct reach rescue using\na stick or a rope.\n• Demonstration\n• Observation\n\n• Estimate distance to safety and\nfeel depth of water.\n\n• Prepare materials, specification\nand maintenance of swim wear,\neye wear, foot wear and throw\nline or rope\n\n• Read environmental protection\nand concerns\n• Lecture\n• Written Test\n\n• Practice in-house safety\nprocedure on environmental\nprotection, good grooming and\nhygiene, occupational safety\nand health standards\n• Demonstration\n• Observation\n\n--- PDF PAGE 114 ---\nTESDA-SOP-QSO-01-F08\nTR – Lifeguard Services NC II (New) Promulgated December 16, 2015\n 110\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment Approach\nNominal\nDuration\n\n• Prepare red and yellow uniform,\nsun protection devices\nrehydration fluids, and mobile\nphones for emergency services.\n• Demonstration\n• Observation\n\n• Practice 5s in safekeeping wet\npersonal wears and lifesaving\naids\n\n• Practice good grooming and\npersonal hygiene\n\n• Demonstrate ability to\ncomprehend oral and written\ncommunication\n\n• Apply personal values in an\naquatic environment\n\n1.2 Use\nRecognized\nClothing and\nOutdoor\nProtective\nDevices\n\n• Read:\no Getting Ready for Aquatic\nWorks\no Sun Safety\no Red and Yellow Lifeguard\nUniform\n\n• Lecture\n\n• Written examination\n\n• Demonstrate applying skin\nsunscreen and proper wearing\nof lifeguard uniform, swim wear,\neyewear, tents and first aid bag.\n• Demonstration\n• Observation\n\n• Demonstrate ability to\ncomprehend oral and written\ncommunication\n\n• Apply personal values in an\naquatic environment\n\n--- PDF PAGE 115 ---\nTESDA-SOP-QSO-01-F08\nTR – Lifeguard Services NC II (New) Promulgated December 16, 2015\n 111\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment Approach\nNominal\nDuration\n\n1.3 Interpret\nStandard\nWater Safety\nFlags and\nSigns\n\n• Describe Pool Signage\n\n• Group\nDiscussion\n• Oral evaluation\n\n• Read:\nWater Safety and Beach\nFlags Operation\n• Lecture\n• Written examination\n\no Standard Water Safety\nInformation and permissive,\nregulatory and warning\nsigns\n\no Typeface for text and\ndistance factor for externally\nilluminated safety signs\n\n• Practice proper hoisting and\ntaking down water safety flags\n• Demonstration\n• Observation\n\n• Demonstrate Inspection,\nmaintenance and storage of\nflags, flag-poles and signage\n\n• Demonstrate correct anchoring\nand unfastening of flag-pole\n\n• Demonstrate ability to\ncomprehend oral and written\ncommunication\n\n• Apply personal values in an\naquatic environment\n\n--- PDF PAGE 116 ---\nTESDA-SOP-QSO-01-F08\nTR – Lifeguard Services NC II (New) Promulgated December 16, 2015\n 112\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment Approach\nNominal\nDuration\n\n1.4 Spot Dangers\nof Different\nAquatic\nEnvironments\n\n• Describe safety guidelines for\nrivers, lakes, ponds, beaches,\npools and home or\ncondominium aquatic\nenvironment\n• Group\nDiscussion\n• Oral evaluation\n\n• Read the dangers at different\naquatic environments :\no rivers\n• Lecture\n• Written ex