        "source_text": "SOC541301\nUNIT DESCRIPTOR\n:\nThis unit covers skills and attitude required to survive emergency\nsituations in water.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1. Demonstrate\nsafe water\nentry and exit\n1.1 Water entry\nprocedures is\ndemonstrated in\naccordance with\nInternational Life\nSaving as specified\nin Handbook on\nSwimming and\nLifesaving\n\n1.2 Water exit\nprocedures is\ndemonstrated per\nHandbook on\nSwimming and\nLifesaving\n\n• Trade Theory\no Water Safety\no Safe Water Entries\no Safe Water Exits\n\n• Communication\no Oral and written\ncommunication\no Hand Signaling\no Whistle Signaling\n\n• Mathematics and\nMensuration\no Depths of water\no State of the water\nbottom\no Distance from\nSafety position\n\n• Execute accidental\nfall in entry when\nunexpectedly falling\ninto water in an\nuncontrolled manner\n• Perform a deep water\nand shallow water\nexits\n• Ability to comprehend\noral and written\ncommunication\n• Interpret hand and\nwhistle\ncommunication\n• Detect depth and\nstate of water bottom\n• Determine distance\nfrom safety position\n\n•Safety Practices\n\no Environmental\nprotection and\nconcerns\n• Follow in-house\nsafety procedures on\nenvironmental\nprotection, good\ngrooming and\nhygiene, occupational\nsafety and health.\n\no Good grooming and\npersonal hygiene\n\no Occupational\nSafety and Health\nStandards\n\n• Materials, Tools and\nEquipment: Uses,\nspecifications and\nMaintenance\n\no Parts and functions\nof Personal\nFlotation\nDevices(PFDs)\n• Care and maintain\npersonal flotation\ndevices (PFDs)\n\no Proper cleaning\nand stowing of\nPFDs.\no PFDs storage and\nproper safekeeping\nfor easy pullout /\nuse\n\n--- PDF PAGE 60 ---\nTESDA-SOP-QSO-01-F08\n\nTR – Lifeguard Services NC II (New) Promulgated December 16, 201 56\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n\n• Codes and\nRegulations\n\no Standards PFD\nClassification: Type\n1 to 3.\no ILS Lifesaving\nPosition Statement\non Basic Aquatic\nSurvival Skills\n• Access Standards\nPFD Classification:\nType 1 to 3\n\n• Values\no Self-esteem\no Punctual/\no Time conscious\no Environmental and\npollution conscious\no Flexible/ adaptable\no Honest\no Socially responsible\no Dependable\no Innovative\no Alert\no Systematic and\norganized\no Committed\no Creative\no Patient\no Determined\n• Practice personal\nvalues in an aquatic\nenvironment\n6\nConduct\nfloating and\nwater treading\n\n2.1 Safe water entry is\nperformed in\naccordance with\nstandards on\nSwimming and\nLifesaving\n\n2.2 Water treading is\ndemonstrated in\naccordance with\nInternational\nstandards on\nSwimming and Life\nSaving\n\n2.3 Floating in water is\ndemonstrated in\naccordance with\nInternational\nstandards on\nSwimming and Life\nSaving\n• Trade Theory\no Water Safety\no Sculling\no Propulsion from\nSculling\no Travelling in water\no Treading water\no Body Orientation\n\n• Ability to enter water\nsafely\n• Practice sculling in\nshallow and chest-\ndeep waters\n• Perform survival\nsculling as a method\nto stay afloat at same\nposition in water.\n• Execute sculling for\nforward and\nbackward movement\nin water.\n• Perform head first\nand feet first sculling.\n• Demonstrate\neggbeater kick for\nwater treading\n• Perform front\nand back float to\ndevelop body\norientation.\n\n--- PDF PAGE 61 ---\nTESDA-SOP-QSO-01-F08\n\nTR – Lifeguard Services NC II (New) Promulgated December 16, 201 57\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n\n• Execute horizontal\nand vertical body\nrotation to establish\nbalance and control\nin the water.\n\n• Communication\no Oral and written\ncommunication\no Hand Signaling\no Whistle Signaling\n• Ability to comprehend\noral and written\ncommunication\n• Interpret hand and\nwhistle\ncommunication\n\n• Mathematics and\nMensuration\no Depths of water\no State of the water\nbottom\no Distance from pool\nsafety edge\no Angle Orientation\nEstimates\no Phase /Clock\nReading\n• Detect depth and\nstate of water bottom\n• Determine distance\nfrom safety position\n• Ability to determine\nexact angle of body\n• orientation\n• Ability to use and\nread phase /clock\ntiming.\n\n•Safety Practices\n\no Environmental\nprotection and\nconcerns\n• Follow in-house\nsafety procedures on\nenvironmental\nprotection, good\ngrooming and\nhygiene, occupational\nsafety and health.\n\no Good grooming and\npersonal hygiene\n\no Occupational\nSafety and Health\nStandards\n\n• Materials, Tools and\nEquipment: Uses,\nSpecifications and\nMaintenance\n\no Parts and functions\nof Personal\nFlotation Devices\n(PFDs)\n• Operate, maintain\nand read out at phase\nclock.\n\no Proper cleaning\nand stowing of\nPFDs.\n\n• Codes and\nRegulations\n\no Standards PFD\nClassification: Type\n1 to 3.\no ILS Position\nStatement LPS\n15on Basic Aquatic\nSurvival Skills\n\n• Putting on a PFD on\nland or in water\n• Sharing a PFD as a\nflotation support\n• Getting in and out of\nthe water while\nwearing a PFD.\n\n--- PDF PAGE 62 ---\nTESDA-SOP-QSO-01-F08\n\nTR – Lifeguard Services NC II (New) Promulgated December 16, 201 58\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n\n• Values\no Self-esteem\no Punctual/\no Time conscious\no Environmental and\npollution conscious\no Flexible/ adaptable\no Honest\no Socially responsible\no Dependable\no Innovative\n- Alert\n- Systematic and\norganized\n- Committed\n- Creative\n- Patient\n- Determined\n• Access Standard\nClassification: Type 1\nto 3\n\n• Practice personal\nvalues in an aquatic\nenvironment\n\n3 Demonstrate\nsurvival\nswimming in a\npool\nenvironment\n\n3.1 400 meters swim in\nless than 10 minutes\nwithout fins is\ndemonstrated in\naccordance with\nInternational\nstandards on\nSwimming and Life\nSaving\n• Trade Theory\no Swimming and\nLifesaving strokes\no Underwater\nswimming\no Survival Strategies\nand Techniques\n\n• Capability to swim\neither free style,\nbackstroke,\nbreaststroke,\nsidestroke or survival\nbackstroke\n\n3.2 Safe water exit is\nperformed in\naccordance with\nInternational\nstandards on\nSwimming and\nLifesaving\n\n• Communication\no Oral and written\ncommunication\no Hand Signaling\no Whistle Signaling\n\n• Mathematics and\nMensuration\no Depths of water\no State of the water\nbottom\no Distance from pool\nsafety edge\no Angle Orientation\nEstimates\no Period in 400\nmeters distance\nswim.\n\n• Ability to comprehend\noral and written\ncommunication\n• Interpret hand and\nwhistle\ncommunication\n\n--- PDF PAGE 63 ---\nTESDA-SOP-QSO-01-F08\n\nTR – Lifeguard Services NC II (New) Promulgated December 16, 201 59\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n\n• Safety Practices\no Environmental\nprotection and\nconcerns\no Good grooming and\npersonal hygiene\no Occupational\nSafety and Health\nStandards\n\n• Follow in-house\nsafety procedures on\nenvironmental\nprotection, good\ngrooming and\nhygiene, occupational\nsafety and health.\n\n• Materials, Tools and\nEquipment: Uses,\nSpecifications and\nMaintenance\no Parts and functions\nof Personal\nFlotation Devices\n(PFDs)\no Multimedia\nillustrations for\nsurvival swimming\n• Operate and maintain\nmultimedia\npresentation\nmaterials and\nequipment\n\n• Codes and\nRegulations\no Standards PFD\nClassification: Type\n1 to 3.\no ILS LPS 15 –Basic\nAquatic Survival\nSkills\n\n• Access Standards\nPFD Classification:\ntype 1 to 3\n\n• Values\no Self-esteem\no Punctual/\no Time conscious\no Environmental and\npollution conscious\no Flexible/ adaptable\no Honest\no Socially responsible\no Dependable\no Innovative\no Alert\no Systematic and\norganized\no Committed\no Creative\no Patient\no Determined\n\n• Practice personal\nvalues in an aquatic\nenvironment\n\n--- PDF PAGE 64 ---\nTESDA-SOP-QSO-01-F08\n\nTR – Lifeguard Services NC II (New) Promulgated December 16, 201 60\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n4. Demonstrate\nability to swim\nunderwater\n4.1. Selected surface\ndives are\ndemonstrated per\nSwimming and\nLifesaving\nHandbook\n\n4.2. Submerged objects\nare recovered in\naccordance with\nInternational\nstandards on\nSwimming and Life\nSaving\n\n4.3. Swimming\nunderwater with\nclothes and shoes\non is practiced and\nremoved them while\nimmersed\n\n4.4. Simulated escape\nfrom swimming\nunderwater\nentrapment is\nperformed in\naccordance with\nInternational\nstandards on\nSwimming and Life\nSaving\n\n• Trade Theory\no Underwater\nswimming\ntechniques\no Safety issues\nassociated with\nunderwater\nswimming\no Application of\nvarious Surface\nDives\no Techniques for\nRemoval of\nClothing while\nimmersed.\no Escape Technique\nfor underwater\nentrapment\n\n• Communication\no Oral and written\no communication\no Hand Signaling\no Whistle Signaling\n\n• Mathematics and\nMensuration\no Depths of water\no State of the water\nbottom\no Distance from pool\nsafety edge\no Angle Orientation\nestimates\no Execution period of\nunderwater skills\nexercises.\n\n• Safety Practices\no Environmental\nprotection and\nconcerns\no Good grooming and\npersonal hygiene\no Occupational\nSafety and Health\nStandards\n\n• Materials, Tools and\nEquipment: Uses,\nSpecifications and\nMaintenance\no Blast whistle\n\n• Applied skills in using\nvarious surface dives\nfor different aquatic\nenvironment.\n\n• Ability to perform\nindividual search\nprocedure at shallow\nwater\n\n• Perform water\ntreading and\nunderwater skills\nsimultaneous with the\nremoval of clothing\nand foot wears.\n\n• Ability to remain calm\nand make escape\nplan from\nentrapment.\n\n• Comprehend oral