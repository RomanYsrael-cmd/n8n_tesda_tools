nd \nwritten \ncommunication \n \n Practice in-House \nsafety procedure on \nenvironmental \nprotection, good \ngrooming and \nhygiene, occupational \nsafety and health \n \n Access Handbook for \nLifeguarding on Risk \nManagement.  \n \n Monitor maintenance \nsystem for multimedia \nillustrations on \nEmergency Care \n \n Maintain Incident/first \naid Report \nCompilation \n \n Practice personal \nvalues in classroom \nand in an aquatic \nenvironment\n\n--- PDF PAGE 51 ---\nTESDA-SOP-QSO-01-F08 \n \nTR – Lifeguard Services NC II (New)                   Promulgated December 16, 201                                     47 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are elaborated \nin the Range of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \nCompilation \n Values \no Self-esteem \no Punctual/  \no Time conscious \no Environmental \nand pollution \nconscious \no Flexible/ \nadaptable \no Honest \no Socially \nresponsible \no Dependable \no Innovative \no Alert \no Systematic and \norganized \no Committed \no Creative \no Patient \no Determined\n\n--- PDF PAGE 52 ---\nTESDA-SOP-QSO-01-F08 \n \nTR – Lifeguard Services NC II (New)                   Promulgated December 16, 201                                     48 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Signs and symptoms  \n     for aquatic injury \n \n \n \n \nMay include but are not limited to: \n1.1 \nAsthma                                                                                 \n1.2 \nBites and Stings.                                                                     \n1.3 \nBleeding \n1.4 \nBurns.                                                                                    \n1.5 \nChest Injuries.                                                                        \n1.6 \nChoking.                                                                               \n1.7 \nCold Injury.                                                                             \n1.8 \nDiabetes.                                                                              \n1.9 \nDrowning and Near-drowning.                                             \n1.10 Ear Problem.                                                                       \n1.11 Environmental Exposure.                                                   \n1.12 Facial Injuries.                                                                      \n1.13 Fainting.                                                                              \n1.14 Foreign bodies in the eye, ear and nose.                            \n1.15 Fractures.                                                                           \n1.16 Head Injury.                                                                         \n1.17 Heat illness.                                                                       \n1.18 Hyperthermia.                                                                     \n1.19 Muscle Injuries.                                                                  \n1.20 Poisoning.                                                                        \n1.21 Seizures and Convulsions.                                                  \n1.22 Shock.                                                                              \n1.23 Spinal Injuries.                                                                    \n1.24 Stroke           \n2. First Aid Kits \nMay include : \n2.1 \nMaking First aid Kits available at Home and Cars \n2.2 \nInstall First aid Kits in proper location where employees in a \nwork place can access easily. \n2.3 \nFirst aid Kits must be regularly checked and maintained. \n3. Triage \nMay include: \n3.1 \nSorting and allocating of aid on the basis of need for a likely \nbenefit from medical treatment  \n3.2 \nClassifying casualties according to injury category: \n3.2.1 Trivial Injuries  \n3.2.2 Injuries that require medical treatment but not \nhospitalization \n3.2.3 Urgent Medical Aid and hospitalization \n3.2.4 Clinically dead or likely to die before arrival to hospital \n3.3 \nObservance of the order of treatment and evacuation \n3.3.1 In most situations \n3.3.2 In mass emergencies\n\n--- PDF PAGE 53 ---\nTESDA-SOP-QSO-01-F08 \n \nTR – Lifeguard Services NC II (New)                   Promulgated December 16, 201                                     49 \nVARIABLE \nRANGE \n4. Hygiene \nMay include: \n4.1 \nThe use of the cleanest equipment available. \n4.2 \nWashing of hands with water and soap.. \n4.3 \nWearing of disposable gloves \n4.4 \nUse of pre-packed disposable sterile equipment, dressing \nand bandages. \n4.5 \nCareful disposal of all items contaminated by blood after \ngiving treatment. \n4.6 \nClean or sanitize areas used in emergency treatment \n4.7 \nCareful disposal of gloves used and thoroughly washed \nhands with water and soap.  \n5. Records or Logs \nMay include: \n5.1 \nProtection of the Casualties \n5.2 \nProtection of the First aider \n5.3 \nIndications of Patterns and provide data for evaluation on \ninjury trends.  \n \n \n \nEVIDENCE GUIDE \n \n1. Critical aspects of \ncompetency \nAssessment requires evidence that the candidate:  \n1.1. Practiced the basic procedures of Aquatic Emergency Care \n2. Resource   \nimplications \nThe following resources MUST be provided: \n2.1 \nFacilities, materials, tools and equipment necessary for the \nactivity \n3. Method of \nassessment \nCompetency in this unit may be assessed through: \n3.1 \nThird Party Report \n3.2 \nInterview \n3.3 \nDemonstration with questioning \n4. Context of \nassessment \nCompetency may be assessed in the work place or in a simulated \nwork place setting.\n",
