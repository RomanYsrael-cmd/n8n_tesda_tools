        "evidence_guide": {
          "source_text": "1. Critical aspects of\ncompetency\n\nAssessment requires evidence that the candidate:\n1.1 Applied non-contact rescue technique based on his/her\nswimming ability, condition of victim and rescue condition\n1.2 Ensured self-preservation while attempting rescue\n1.3 Followed order of priority in non-contact rescue techniques to\nlessen risk to self.\n\n2. Resource\nimplications\n\nThe following resources MUST be provided:\n2.1 Recognized Uniform\n2.2 Swimming Pool\n2.3 Alternative aquatic locations where pools are not available.\n\n3. Method of\nassessment\n\nCompetency in this unit may be assessed through:\n3.1 Demonstration with questioning\n3.2 Written Test/Examination\n3.3 Third Party Report\n3.4 Portfolio\n\n4. Context of\nassessment\n\n4.1 Competency may be assessed in the workplace or in a\nsimulated workplace setting.\n4.2 Assessment shall be observed while task are being undertaken\nwhether individually or in group\n\n--- PDF PAGE 78 ---\nTESDA-SOP-QSO-01-F08\n\nTR – Lifeguard Services NC II (New) Promulgated December 16, 201 74\n\nUNIT OF COMPETENCY :\nDEMONSTRATE CONTACT WATER RESCUE\n\nUNIT CODE\n:"
        },
        "source_text": "SOC541302\n\nUNIT DESCRIPTOR\n:\nThis unit covers outcomes required in performing rescue in\nshallow waters without physical contact with the victim.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1.\nInitiate rescue\nof victims\n1.1\nCondition of victim\nis assessed to\ndetermine\nappropriate non-\ncontact rescue\ntechnique to apply\nin accordance with\nInternational\nstandards on\nSwimming and Life\nSaving.\n\n1.2 Victim is approached\nto initiate rescue in\naccordance with ILS\nas specified in\nInternational\nstandards on\nSwimming and Life\nSaving.\n\n1.3 Victim is pacified or\nadvised to relax or\nmove to safe area\nin accordance with\nILS as specified in\nInternational\nstandards on\nSwimming and Life\nSaving.\n• Trade Theory\no Basic Aquatic Rescue\nPrinciples\no Priority order of Non-\nswimming rescue\no Strategies in talk\nrescue\n\n• Communication\no Oral and written\ncommunication\no Hand Signaling\nWhistle Signaling\n\n• Mathematics and\nMensuration\no Distance to Safety\nposition\no Depths of water\nAngles of victim’s\nBody orientation\n\n• Safety Practices\no Environmental\nprotection and\nconcerns\no Good grooming and\npersonal hygiene\nOccupational Safety\nand Health Standards\n\n• Codes and Regulations\no Standards PFD\nClassification: Type 1\nto 3.\n\no ILS Lifesaving\nPosition Statement\nLPS 15 on Basic\nAquatic Survival\nSkills\n\no ILS Lifesaving\nPosition Statement\nLPS 09 on\n• Conduct talk\nrescue when victim\nis conscious,\ncapable of\nresponding to\ninstructions and is\nclose enough to\nsee gestures and\nhear voice of\nlifeguard.\n• Ability to\ncomprehend oral\nand written\ncommunication\n• Interpret hand and\nwhistle\ncommunication\n• Detect depth and\nstate of water\nbottom\n• Determine\ndistance from\nsafety position.\n• Determine exact\nangle to maintain\nbody orientation\n\n• Practice in-house\nsafety procedure\non environmental\nprotection, good\ngrooming and\nhygiene,\noccupational\nsafety and health\n\n• Access Standards\nPFD Classification:\nType 1 to 3\n\n• Access to ILS\nLifesaving\nPosition Statement\nLPS\n\n--- PDF PAGE 69 ---\nTESDA-SOP-QSO-01-F08\n\nTR – Lifeguard Services NC II (New) Promulgated December 16, 201 65\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n\no Recertification for\nBeach and Open\nWater Lifesavers\n\n• Values\no Self-esteem\no Punctual/ Time\no conscious\no Environmental and\npollution conscious\no Flexible/ adaptable\no Honest\no Socially responsible\no Dependable\no Innovative\no Alert\no Systematic and\norganized\no Committed\no Creative\no Patient\no Determined\n\n• 15 on Basic\nAquatic Survival\nSkills\n\n• Access to ILS\nLifesaving Position\nStatement LPS 09\non Recertification\nfor Beach and\nOpen Water\nLifesavers\n\n• Practice personal\nvalues in an\naquatic\nenvironment\n2\nReach out to\nvictim\n2.1 Rescued victim is\nprovided with\nappropriate lifesaving\nimplements in\naccordance with ILS\nas specified in\nInternational\nstandards on\nSwimming and Life\nSaving\n\n2.2 Rescued victim is\npulled to safety by\nproviding appropriate\nlifesaving implement\nin accordance with\nILS as specified in\nInternational\nstandards on\nSwimming and Life\nSaving\n\n2.3 Repeated attempt to\npull rescued victim to\nsafety is ensured for\nlifeguard’s self-\npreservation in\naccordance with ILS\nas specified in\ninternational\nstandards on\nSwimming and Life\n• Trade Theory\no Basic Aquatic Rescue\nPrinciples\no Priority order of Non-\nswimming rescues\no Use of rescue aids\n\n• Communication\no Oral and written\ncommunication\no Hand Signaling\no Whistle Signaling\n\n• Mathematics and\nMensuration\no Distance to Safety\no Depth of water\no State of water bottom\no Distance from victim\n\n• Safety Practices\no Environmental\nprotection and\nconcerns\no Good grooming and\npersonal hy