          "source_text": "REQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1.\nInitiate rescue \nof victims \n1.1\nCondition of victim\nis assessed to \ndetermine \nappropriate non-\ncontact rescue \ntechnique  to apply \nin accordance with \nInternational  \nstandards on \nSwimming and Life \nSaving. \n \n1.2 Victim is approached \nto initiate rescue in \naccordance with  ILS  \nas specified in \nInternational  \nstandards on \nSwimming and Life \nSaving. \n \n1.3 Victim is pacified or \nadvised to relax or \nmove to safe area \nin accordance with  \nILS as specified in \nInternational  \nstandards on \nSwimming and Life \nSaving. \n Trade Theory \no Basic Aquatic Rescue \nPrinciples \no Priority order of Non-\nswimming rescue \no Strategies in talk \nrescue \n \n Communication \no Oral and written   \ncommunication  \no Hand Signaling \nWhistle Signaling \n \n Mathematics and \nMensuration \no Distance to Safety \nposition \no Depths of water \nAngles of victim’s \nBody orientation \n \n Safety Practices \no Environmental  \nprotection and \nconcerns \no Good grooming and \npersonal hygiene \nOccupational Safety \nand Health Standards\n \n Codes and Regulations \no Standards PFD \nClassification: Type 1 \nto 3. \n \no ILS Lifesaving  \nPosition Statement  \nLPS 15 on Basic \nAquatic Survival \nSkills \n \no ILS Lifesaving \nPosition Statement \nLPS 09 on  \n Conduct talk \nrescue when victim \nis conscious, \ncapable of \nresponding to \ninstructions and is \nclose enough to \nsee gestures and \nhear voice of \nlifeguard.  \n Ability to \ncomprehend oral \nand written \ncommunication \n Interpret hand and \nwhistle \ncommunication \n Detect depth and \nstate of water \nbottom \n Determine \ndistance from \nsafety position. \n Determine exact \nangle to maintain \nbody orientation \n \n Practice in-house \nsafety procedure \non environmental \nprotection, good \ngrooming and \nhygiene, \noccupational \nsafety and health \n \n Access  Standards \nPFD Classifi