        "source_text": "SOC541304\nUNIT DESCRIPTOR\n:\nThis unit covers skills and techniques for scanning aquatic\nvenues to include dangers for the users and activities.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED KNOWLEDGE\nREQUIRED SKILLS\n1.\nMonitor\naquatic\nsurroundings\n1.1\nSenses are used to\nsweep happenings\naround an aquatic\nenvironment\n\n1.2\nDanger points are\nattended in an\naquatic venue\n\n1.3\nPotential trouble or\ndistressed\nbehaviors of\nbathers are\ndetected\n\n• Trade Theory\no The Senses and\nwhat they tell us\no Principles of\nscanning\no Different Scanning\nStrategies and\nTechniques\no Scanning\nMethodology\n\n• Communications\no Oral and Written\ncommunication\no Whistle and hand\nsignals\no Public Address (PA)\nSystem\no Alarms\n\n• Mathematics and\nMensuration\no Repeated sweeps\nwithin 5 minutes\nallows focusing on\neach patron at least\nonce.\n\n• Safety Practices\no Environmental\nprotection and\nconcerns\no Good grooming and\npersonal hygiene\no Occupational Safety\nand Health Standards\n\n• Codes and Regulations\no Guidelines for\no Safe Pool Operation\n(GSPO)\no Lifeguarding\nHandbook\n\n• Ability to effectively\nscan aquatic zone\nat the least time.\n\n• Familiarized\ncharacteristic\nsights, sounds,\npatterns and\nrhythms of activity\nconsidered normal\nand unique to an\naquatic venue\nbeing served.\n\n• Identify hazards\nand danger points\nin aquatic venues. .\n\n• Comprehend oral\nand written\ncommunication\n\n• Interpret hand and\nwhistle\ncommunication\n\n• Mensuration\napplied for\nefficiency of\nscanning tasks.\n\n• Follow in-house\nsafety procedures\non environmental\nprotection, good\ngrooming and\nhygiene,\noccupational safety\nand health\n\n• Operate and\nmaintain\nmultimedia\npresentation\nmaterials and\n\n--- PDF PAGE 91 ---\nTESDA-SOP-QSO-01-F08\n\nTR – Lifeguard Services NC II (New) Promulgated December 16, 201 87\nELEMENT\nPERFORMANCE\nCRITERIA\nItalic