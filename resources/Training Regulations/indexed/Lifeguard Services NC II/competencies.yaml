mmunication\namong Lifeguards\nin an emergency\no Lifeguarding\nManual 4th\nEdition on Visual\nand Audible\nLifeguard\nCommunication\n• Communications\no Oral and written\nCommunication\no Hand Signaling\no Whistle Signaling\n• Mathematics and\nMensuration\no Observed distance\nbetween\ntransmitter and\nreceiver\no Large background\nnoise volume at\nthe pool making\nverbal\ncommunication not\naudible and in\neffect making hand\nand whistle signals\nuseful\n• Safety Practices\no Environmental\nprotection and\nconcerns\no Good grooming\nand personal\nhygiene\no Occupational\nSafety and Health\nStandards\n• Codes and\nRegulations\no Lifeguarding\nManual (4th\nEdition or later) on\nVisual and Audible\nLifeguard\nCommunication\n\n• Ability to transmit\nspecified hand and\nwhistle signals for\nLifeguard Inter-\ncommunication\n\n• Concisely received\nand clarified\nmessages\n\n• Actions carried\naccurately as\nsignaled.\n\n• Comprehend oral and\nwritten communication\n\n• Access Handbook for\nLifeguarding on\nEmergency Response,\nVisual and Audible\nSignals\n\n• Clean and maintain\nBlast whistle.\n\n• Practice in-House\nsafety procedure on\nenvironmental\nprotection, good\ngrooming and\nhygiene, occupational\nsafety and health\n\n• Practice personal\nvalues in classroom\nand in an aquatic\nenvironment\n\n--- PDF PAGE 57 ---\nTESDA-SOP-QSO-01-F08\n\nTR – Lifeguard Services NC II (New) Promulgated December 16, 201 53\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n• Materials, Tools\n&Equipment: Uses,\nSpecifications and\nMaintenance\no Recommended\nBlast Whistle for\nLifeguards\n• Values\no Self-esteem\no Punctual/\no Time conscious\no Environmental and\npollution conscious\no Flexible/ adaptable\no Honest\no Socially\nresponsible\no Dependable\no Innovative\no Alert\no Systematic and\norganized\no Committed\no Creative\no Patient\no Determined\n\n--- PDF PAGE 58 ---\nTESDA-SOP-QSO-01-F08\n\