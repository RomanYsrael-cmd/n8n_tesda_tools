o Oral and Written \ncommunication \no Whistle and hand \nsignals \no Public Address (PA) \nSystem \no Alarms \n \n Mathematics and \nMensuration \no Depths of water \no State of the water \nbottom   \no Distance from safety \nedge \no Angle Orientation \nEstimates \no Execution Period of \nlanding exercises \n \n Safety Practices \no Environmental \nprotection and \nconcerns \no Good grooming and \npersonal hygiene \no Occupational Safety \nand Health \nStandards \no Buddy and Check-in \nSystem \no Water Checks \no Safety Stops \n \n Codes and \nRegulations \no Guidelines for Safe \nPool Operation \n(GSPO) \no Swimming and \nLifesaving \nHandbook on \nRescue Techniques \n \n \n \n \n Ability to select \nand adopt \nappropriate \nlanding method \nfor a given \nsituation  \n \n Quick removal of \nvictim from water \nat low risk of \naccident to both \nlifesaver and \nvictim for less \ninterruption in \nperforming \nresuscitation  \n \n Ability to remain \ncalm while doing \nspecific landing \nmethod \n \n Comprehend oral \nand written \ncommunication \n \n Interpret hand \nand whistle \ncommunication \n \n Mensuration \napplied for \nefficiency of \naquatic tasks. \n \n Follow in-house \nsafety procedures \non environmental \nprotection, good \ngrooming and \nhygiene, \noccupational \nsafety and health \n \n Operate and \nmaintain \nmultimedia \npresentation \nmaterials and \nequipment \n \n Access Safe Pool \nOperation\n\n--- PDF PAGE 87 ---\nTESDA-SOP-QSO-01-F08 \n \nTR – Lifeguard Services NC II (New)                   Promulgated December 16, 201                                     83 \nELEMENTS \nPERFORMANCE \nCRITERIA \nItalicized terms are elaborated \nin the Range of Variables\nREQUIRED KNOWLEDGE\nREQUIRED SKILLS \n Materials, Tools & \nEquipment: Uses, \nSpecifications and \nMaintenance \no Blast whistle \no Multimedia \nillustrations for \nunderwater skills \nperformance. \no Spine Boards \no Rescue tubes \n \n Values \no Self-esteem \no Punctual/  \no Time conscious \no Environmental and \npollution conscious \no Flexible/ adaptable \no Honest \no Socially responsible \no Dependable \no Innovative \no Alert \no Systematic and \norganized \no Committed \no Creative \no Patient \no\nDetermined\n(GSPO) and \nHandbook on \nRescue \nTechniques \n \n Practice personal \nvalues in aquatic \nvenues\n\n--- PDF PAGE 88 ---\nTESDA-SOP-QSO-01-F08 \n \nTR – Lifeguard Services NC II (New)                   Promulgated December 16, 201                                     84 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Condition of victim \nInclude but not limited to: \n1.1 \nNon-swimmer \n1.2 \nWeak swimmer \n1.3 \nInjured person \n1.4 \nUnconscious person \n1.5 \nPanicking \n2. Contact rescue with \nconscious victim \nInclude but not limited to: \n2.1 \nWrist tow \n2.2 \nArmpit tow \n2.3 \nClose chin tow \n3. Proper defensive \npositions \nInclude but not limited to: \n3.1 \nDefensive position \n3.2 \nReverse \n3.3 \nBlocking \n3.4 \nEscape technique \n \n4. Contact rescue with \nunconscious victim. \nInclude but not limited to: \n4.1 \nChest tow \n4.2 \nDouble armpit tow \n4.3 \nDouble shoulder tow \n4.4 \nSpinal tow \n5. Surface Dives \nInclude but not limited to: \n5.1 \nHead first surface dives when victim can be seen \nunderwater \n5.2 \nFeet first dive when water is murky \n5.3 \nOne deep breath prior to submerging underwater \n6. Neck immobilization \nInclude but not limited to: \n6.1 \nVice grip (face up casualty) \n6.2 \nVice grip (face down casualty) \n6.3 \nExtended arm rollover \n7. Appropriate \nEquipment \nMay include: \n7.1 \nSnorkeling equipment \n7.2 \nGoggles \n7.3 \nImprovised Underwater Visual Equipment \n7.4 \nPortable free flow  oxygen mobile bottle\n8. Gentle Slope Landing\nInclude but not limited to: \n7.1 \nWalk out \n7.2 \nDrag \n7.3 \nShoulder carry \n7.4 \nPiggyback carry \n9. Steep Slope Landing \nInclude but not limited to: \n8.1 \nSupport position \n8.2 \nStirrup lift \n8.3 \nAssisted lift\n\n--- PDF PAGE 89 ---\nTESDA-SOP-QSO-01-F08 \n \nTR – Lifeguard Services NC II (New)                   Promulgated December 16, 201                                     85 \nEVIDENCE GUIDE \n \n1. Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1 \nApplied contact rescue technique based on his/her \nswimming ability, condition of victim and rescue condition \n1.2 \nEnsured self-preservation while attempting the rescue \n1.3 \nFollowed the order of procedures in contact rescue \ntechniques to lessen risks to self \n2. Resource implications \nThe following resources MUST be provided: \n2.1 \nSwimming pool 25m + pool \n2.2 \nFloating Spine board with straps \n2.3 \nCervical Collar \n3. Method of \nassessment \nCompetency in this unit may be assessed through: \n3.1 \nDemonstration with questioning \n3.2 \nDirect observation \n3.3 \nOral examination \n4. Context of \nassessment \n \n4.1 \nCompetency assessment may occur in workplace or any  \nappropriately simulated environment \n4.2 \nAssessment shall be observed while task are being \nundertaken whether individually or in group\n",
