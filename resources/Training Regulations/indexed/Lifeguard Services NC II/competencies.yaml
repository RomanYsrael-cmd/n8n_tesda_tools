        "source_title": "PERFORM LIFEGUARDING HAND AND WHISTLE SIGNALS",
        "source_text": "--- PDF PAGE 54 ---\nTESDA-SOP-QSO-01-F08 \n \nTR – Lifeguard Services NC II (New)                   Promulgated December 16, 201                                     50 \nUNIT OF COMPETENCY : \nPERFORM LIFEGUARDING HAND AND WHISTLE SIGNALS  \nUNIT CODE \n: \nSOC541206 \nUNIT DESCRIPTOR \n: \nThis unit covers knowledge and inter-communication skills \nrequired for hand signals and whistles. \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range of \nVariables \nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n1. Specify hand and \nwhistle signals  \nfor inter-lifeguard \ncommunication \n \n \n \n \n \n \n1.1  \nWhistle signaling is \ninterpreted in \naccordance with ILS \nas specified in the \nHandbook on \nSwimming and \nLifesaving.         \n \n1.2  \nHand signaling is \ncoded and decoded \nin accordance with \nILS as specified in \nthe Handbook on \nSwimming and \nLifesaving.         \n \n Trade Theory \no Importance of \nHand and Whistle \nSignals In any \naquatic \nenvironment \no ILS Lifesaving \nPosition Statement   \nLPS-12 on \nInternational \nLifeguard Hand \nSignals  \no Wikipedia 2012: \nLifeguard Whistle \nSignals \n Communications \no Oral and written \nCommunication \no Hand Signaling \no Whistle Signaling \n Mathematics and \nMensuration \no Observed distance \nbetween \ntransmitter and \nreceiver \no Large background \nnoise volume at \nthe pool making \nverbal \ncommunication \ndifficult and in \neffect making hand \nand whistle signals \nuseful. \n Safety Practices \no Environmental \nprotection and \nconcerns \no Good grooming \nand personal \nhygiene \no Occupational \nSafety and Health \nStandards \n \n \n Execute hand signals \nfor inter-lifeguard \ncommunication \no Message Received\no Cover my Area \no Assistance \nRequired \no Rotate \no Come Together \no First Aid \no Major Emergency \no Take a Break \no Not Breathing \no Suspected Spinal \n \n Blow standard whistle \nsignals \no One short           \nwhistle blast to \nsignal attention or \nalert other \nlifeguards \no Three long blasts \nto signal a major \nemergency \n \n Comprehend oral and \nwritten communication \n \n Access Handbook for \nLifeguarding on \nEmergency Response, \nVisual and Audible \nSignals. \n  \n Clean and maintain \nLifeguard Blast \nwhistle. \n \n Practice in-House \nsafety procedure on \nEnvironmental \nprotection, good \ngrooming and \nhygiene, occupational \nsafety and health\n\n--- PDF PAGE 55 ---\nTESDA-SOP-QSO-01-F08 \n \nTR – Lifeguard Services NC II (New)                   Promulgated December 16, 201                                     51 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range of \nVariables\nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n Codes and \nRegulations \no ILS Lifesaving \nPosition Statement   \nLPS-12 on \nInternational \nLifeguard Hand \nSignals \no Wikipedia 2012: \nLifeguard Whistle \nSignals \no Lifeguarding \nManual 4th  \nEdition on \nEmergency \nResponse, Visual \nand Audible \nSignals \n Materials, Tools & \nEquipment: Uses, \nSpecifications and \nMaintenance \no Recommended  \nBlast Whistle for \nLifeguard  \n Values \no Self-esteem \no Punctual/  \no Time conscious \no Environmental and \npollution conscious\no Flexible/adaptable \no Honest \no Socially \nresponsible \no Dependable \no Innovative \no Alert \no Systematic and \norganized \no Committed \no Creative \no Patient \no Determined \n \n Practice personal \nvalues in classroom \nand in an aquatic \nenvironment\n\n--- PDF PAGE 56 ---\nTESDA-SOP-QSO-01-F08 \n \nTR – Lifeguard Services NC II (New)                   Promulgated December 16, 201                                     52 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range of \nVariables\nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n2. Demonstrate \nwhistle and \nhand signals \nas transmitter \nand receiver \n2.1 Positioned at short \ndistance and as a \ntransmitter whistle \nand hand signaling \nis  initiated in \naccordance with ILS \nas specified in the \nHandbook on \nSwimming and \nLifesaving.         \n2.2 A specific whistle and \nhand signal \ninstructions is \ndemonstrated to a \nreceiving lifeguard in \naccordance with ILS \nas specified in the \nHandbook on \nSwimming and \nLifesaving.         \n2.3 Instructions are \nacknowledged and \nresponded by \nreceiver  in \naccordance with ILS \nas specified in the \nHandbook on \nSwimming and \nLifesaving.         \n2.4 Actions carried by \nreceiver are observed \nto check correctness \nof message and \naction delivery for a \nsuccessful \ncommunication. \n Trade Theory \no Communication \namong Lifeguards \nin an emergency \no Lifeguarding \nManual 4th  \nEdition on Visual \nand Audible \nLifeguard \nCommunication \n Communications \no Oral and written \nCommunication \no Hand Signaling \no Whistle Signaling \n Mathematics and \nMensuration \no Observed distance \nbetween \ntransmitter and \nreceiver \no Large background \nnoise volume at \nthe pool making \nverbal  \ncommunication not \naudible and in \neffect making hand \nand whistle signals \nuseful \n Safety Practices \no Environmental \nprotection and \nconcerns \no Good grooming \nand personal \nhygiene \no Occupational \nSafety and Health \nStandards \n Codes and \nRegulations \no Lifeguarding \nManual (4th \nEdition or later) on \nVisual and Audible \nLifeguard \nCommunication \n \n \n \n \n \n Ability to transmit \nspecified hand and \nwhistle signals for \nLifeguard Inter-\ncommunication \n \n Concisely received \nand clarified \nmessages \n \n Actions carried \naccurately as \nsignaled. \n \n Comprehend oral and \nwritten communication \n \n Access Handbook for \nLifeguarding on \nEmergency Response, \nVisual and Audible \nSignals  \n \n Clean and maintain \nBlast whistle. \n \n Practice in-House \nsafety procedure on   \nenvironmental \nprotection, good \ngrooming and \nhygiene, occupational \nsafety and health \n \n Practice personal \nvalues in classroom \nand in an aquatic \nenvironment\n\n--- PDF PAGE 57 ---\nTESDA-SOP-QSO-01-F08 \n \nTR – Lifeguard Services NC II (New)                   Promulgated December 16, 201                                     53 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range of \nVariables\nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n Materials, Tools \n&Equipment: Uses, \nSpecifications and \nMaintenance \no Recommended \nBlast Whistle for \nLifeguards \n Values \no Self-esteem \no Punctual/  \no Time conscious \no Environmental and \npollution conscious\no Flexible/ adaptable \no Honest \no Socially \nresponsible \no Dependable \no Innovative \no Alert \no Systematic and \norganized \no Committed \no Creative \no Patient \no Determined\n\n--- PDF PAGE 58 ---\nTESDA-SOP-QSO-01-F08 \n \nTR – Lifeguard Services NC II (New)                   Promulgated December 16, 201                                     54 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Whistle \nNot limited to calling: \n1.1 \nOne short whistle blast to gain attention of guests. \n1.2 \nTwo short whistle blasts to signal attention or alert other \nlifeguards \n1.3 \nThree long blasts to signal a major emergency or all \nlifeguards to report and assist with the rescue. \n1.4 \nOne long blow to signal clearing of pool by swimmers. \n \n2. Hand Signal \nNot limited to signal: \n2.1 \nAssistance Required \n2.2 \nSubmerged Patient Missing \n2.3 \nAll Clear / Okay \n2.4 \nPick up Patient \n2.5 \nProceed Away from Pool / Shore \n2.6 \nProceed Towards Pool / Shore \n2.7 \nProceed Left or Right \n2.8 \nMessage Received \n2.9 \nRotate \n2.10 Come Together \n2.11 First Aid  \n2.12 Major Emergency \n2.13 Take a break \n2.14 Not Breathing \n2.15 Suspected Spinal Injury \n \n \nEVIDENCE GUIDE \n \n1. Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1 \nDemonstrate hand and whistle signals as transmitter and  \nreceiver \n1.2\nAcknowledge messages and act on with accuracy.\n \n2. Resource implications \n \nThe following resources MUST be provided: \nFacilities, materials, tools and equipment necessary for the activity\n \n3. Method of \nassessment \n \nCompetency in this unit may be assessed through: \n3.1 \nThird Party Report \n3.2  Interview \n3.1\nDemonstration with questioning\n \n4. Context of \nassessment \n \n4.1 \nCompetency assessment may occur in workplace or any \nappropriately simulated environment \n4.2 \nAssessment shall be observed while task are being \nundertaken by a transmitter and a receiver.\n",
