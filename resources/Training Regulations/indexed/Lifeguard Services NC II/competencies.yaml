        "source_text": "500311108\nUNIT DESCRIPTOR\n : This unit covers the outcomes required to comply with regulatory\nand organizational requirements for occupational health and\nsafety.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Identify hazards\nand risks\n1.1 Safety regulations\nand workplace\nsafety and hazard\ncontrol practices and\nprocedures are\nclarified and\nexplained based on\norganization\nprocedures\n1.2 Hazards/risks in the\nworkplace and their\ncorresponding\nindicators are\nidentified to\nminimize or\neliminate risk to co-\nworkers, workplace\nand environment in\naccordance with\norganization\nprocedures\n1.3 Contingency\nmeasures during\nworkplace\naccidents, fire and\nother emergencies\nare recognized and\nestablished in\naccordance with\norganization\nprocedures\n• Company\nworkplace safety\nregulations\n• Industry hazard\ncontrol practices\nand procedures\n• Internationally\nrecognized OSH\nprocedures and\npractices and\nregulations\n• PPE types and uses\n• Personal hygiene\npractices\n• Hazards/risks\nidentification and\ncontrol\n• Threshold Limit\nValue -TLV\n• OSH indicators\n• Organization safety\nand health protocol\n• Safety\nconsciousness\n• Health\nconsciousness\n• Clarifying and\nexplaining safety\nregulations and\nworkplace safety\nand hazard control\n• Identifying\nhazards/risks in the\nworkplace and their\ncorresponding\nindicators\n• Recognizing\ncontingency\nmeasures during\nworkplace\naccidents, fire and\nother emergencies\n• Practice of personal\nhygiene\n• Interpersonal skills\n• Communication\nskills\n\n--- PDF PAGE 19 ---\nTESDA-SOP-QSO-01-F08\n\nTR – Lifeguard Services NC II (New) Promulgated December 16, 201 15\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n2. Evaluate\nhazards and\nrisks\n2.1 Terms of maximum\ntolerable limits\nwhich when\nexceeded will result\nin harm or damage\nare identified based\non threshold limit\nvalues (TLV)\n2.2 Effects of the\nhazards are\ndetermined\n2.3 OSH issues and/or\nconcerns and\nidentified safety\nhazards are\nreported to\ndesignated\npersonnel in\naccordance with\nworkplace\nrequirements and\nrelevant workplace\nOSH legislation\n• Methods of\nidentifying terms of\nmaximum tolerable\nlimits\n• Hazard effects\n• Reporting methods\non OSH\nissues/concerns\n• OSH procedures\nand practices and\nregulations\n• PPE types and uses\n• Hazards/risks\nidentification and\ncontrol\n• Threshold Limit\nValue -TLV\n• OSH indicators\n• Organization safety\nand health protocol\n• Safety\nconsciousness\n• Health\nconsciousness\n• Identifying terms of\nmaximum tolerable\nlimits\n• Determining effects\nof hazards and\nrisks\n• Reporting OSH\nissues and/or\nconcerns\n• Identifying safety\nhazards\n• Hazards/risks\nidentification and\ncontrol skills\n• Interpersonal skills\n• Communication\nskills\n3. Control hazards\nand risks\n3.1 Occupational Safety\nand Health (OSH)\nprocedures for\ncontrolling\nhazards/risks in\nworkplace are\nconsistently\nfollowed\n3.2 Procedures for\ndealing with\nworkplace\naccidents, fire and\nemergencies are\nfollowed in\naccordance with\norganization OSH\npolicies\n3.3 Personal\nprotective\nequipment (PPE) is\ncorrectly used in\naccordance with\norganization OSH\nprocedures and\npractices\n\n• Ways of following\nOccupational Safety\nand Health (OSH)\nprocedures for\ncontrolling\nhazards/risks in\nworkplace\n• Ways of following\nprocedures for\ndealing with\nworkplace\naccidents, fire and\nemergencies\n• Types and use of\npersonal protective\nequipment (PPE)\n• OSH procedures\nand practices and\nregulations\n\n• Methods and\ntechniques in\nproviding\nappropriate\nassistance in the\nevent of a\n• Following\noccupational health\nand safety (OSH)\nprocedures for\ncontrolling\nhazards/risks in\nworkplace\n• Following\nprocedures for\ndealing with\nworkplace\naccidents, fire and\nemergencies\n• Using correctly\npersonal protective\nequipment (PPE)\n\n• Providing\nassistance in the\nevent of a\nworkplace\nemergency in\naccordance with\n\n--- PDF PAGE 20 ---\nTESDA-SOP-QSO-01-F08\n\nTR – Lifeguard Services NC II (New) Promulgated December 16, 201 16\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n3.4 Appropriate\nassistance is\nprovided in the\nevent of a\nworkplace\nemergency in\naccordance with\nestablished\norganization\nprotocol\nworkplace\nemergency\n• Hazards/risks\nidentification and\ncontrol\n\nestablished\norganization\nprotocol\n4. Maintain OSH\nawareness\n4.1 Emergency-related\ndrills and trainings\nare participated in\nas per established\norganization\nguidelines and\nprocedures\n4.2 OSH personal\nrecords are\ncompleted and\nupdated in\naccordance with\nworkplace\nrequirements\n• Participation\nprocedures in\nemergency-related\ndrills and trainings\n• Ways of completing\nand updating OSH\npersonal records\n• OSH procedures\nand practices and\nregulations\n• OSH indicators\n• Participating in\nemergency-related\ndrills and trainings\n• Completing and\nupdating OSH\npersonal records\n\n--- PDF PAGE 21 ---\nTESDA-SOP-QSO-01-F08\n\nTR – Lifeguard Services NC II (New) Promulgated December 16, 201 17\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Safety regulations\nMay include but are not limited to:\n1.1 Clean Air Act\n1.2 Building code\n1.3 National Electrical and Fire Safety Codes\n1.4 Waste management statutes and rules\n1.5 Philippine Occupational Safety and Health Standards\n1.6 DOLE regulations on safety legal requirements\n1.7 ECC regulations\n2. Hazards/Risks\nMay include but are not limited to:\n2.1 Physical hazards – impact, illumination, pressure, noise,\nvibration, temperature, radiation\n2.2 Biological hazards - bacteria, viruses, plants, parasites,\nmites, molds, fungi, insects\n2.3 Chemical hazards – dusts, fibers, mists, fumes, smoke,\ngasses, vapors\n2.4 Ergonomics\n2.4.1 Psychological factors – over exertion/ excessive force,\nawkward/static positions, fatigue, direct pressure,\nvarying metabolic cycles\n2.4.2 Physiological factors – monotony, personal\nrelationship, work out cycle\n3. Contingency\nmeasures\nMay include but are not limited to:\n3.1 Evacuation\n3.2 Isolation\n3.3 Decontamination\n3.4 (Calling designed) emergency personnel\n4. PPE\nMay include but are not limited to:\n4.1 Mask\n4.2 Gloves\n4.3 Goggles\n4.4 Hair Net/cap/bonnet\n4.5 Face mask/shield\n4.6 Ear muffs\n4.7 Apron/Gown/coverall/jump suit\n4.8 Anti-static suits\n5. Emergency-related\ndrills and training\n5.1 Fire drill\n5.2 Earthquake drill\n5.3 Basic life support/CPR\n5.4 First aid\n5.5 Spillage control\n5.6 Decontamination of chemical and toxic\n5.7 Disaster preparedness/management\n6. OSH personal records 6.1 Medical/Health records\n6.2 Incident reports\n6.3 Accident reports\n6.4 OSH -related training completed\n\n--- PDF PAGE 22 ---\nTESDA-SOP-QSO-01-F08\n\nTR – Lifeguard Services NC II (New) Promulgated December 16, 201 18\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Explained clearly established workplace safety and hazard\ncontrol practices and procedures\n1.2 Identified hazards/risks in the workplace and its\ncorresponding indicators in accordance with company\nprocedures\n1.3 Recognized contingency measures during workplace\naccidents, fire and other emergencies\n1.4 Identified terms of maximum tolerable limits based on\nthreshold limit value- TLV.\n1.5 Followed Occupational Health and Safety (OSH) procedures\nfor controlling hazards/risks in workplace\n1.6 Used Personal Protective Equipment (PPE) in accordance\nwith company OSH procedures and practices\n1.7 Completed and updated OSH personal records in\naccordance with workplace requirements\n2. Resource\nImplications\nThe following resources MUST be provided:\n2.1 Workplace or assessment location\n2.2 OSH personal records\n2.3 PPE\n2.4 Health records\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1 Portfolio Assessment\n3.2 Interview\n3.3 Case Study/Situation\n4. Context for\nAssessment\nCompetency may be assessed in the work place or in a simulated\nwork place setting\n\n--- PDF PAGE 23 ---\nTESDA-SOP-QSO-01-F08\n\nTR – Lifeguard Services NC II (New) Promulgated December 16, 201 19\n\nCOMMON COMPETENCIES\n\nUNIT OF COMPETENCY :\nDEMONSTRATE KNOWLEDGE AND SKILLS ON WATER\nSAFETY\nUNIT CODE\n:"
