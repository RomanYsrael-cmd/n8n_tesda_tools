        "source_text": "--- PDF PAGE 39 ---\nTESDA-SOP-QSO-01-F08 \n \nTR – Lifeguard Services NC II (New)                   Promulgated December 16, 201                                     35 \nUNIT OF COMPETENCY : \nPERFORM RESUSCITATION (CPR + ILCOR + After Care) \nUNIT CODE \n: \nSOC541204 \nUNIT DESCRIPTOR \n: \nThis unit covers competency in resuscitation administration to \nvictim prior to arrival of appropriately qualified personnel. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are elaborated \nin the Range of Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n1. Recognize the \nfunction of \nhuman \nrespiratory \nsystem  \n1.1 Respiratory system \nis discussed in \naccordance with the \nHandbook on \nSwimming and \nLifesaving. \n \n1.2 Composition of air \nand gas exchange \nprocess in the \nrespiratory system is \ndiscussed in \naccordance with the \nHandbook on \nSwimming and \nLifesaving. \n \n1.3 Pathway of air \nthrough respiratory \nsystem is discussed \nthe in accordance \nwith the Handbook on \nSwimming and \nLifesaving. \n \n1.4 Mechanics of \nbreathing during \ninspiration and \nexpiration is \ndemonstrated in \naccordance with the \nHandbook on \nSwimming and \nLifesaving. \n Trade Theory \no Function of  human  \nrespiratory system \no Importance of \noxygen to the cells \nof the brain, heart \nand lungs. \n Communications \no Oral and written \ncommunication \n Mathematics and \nMensuration \no Design and \nfunctioning of \nRespiratory System  \no Volume of air intake \nthrough the mouth  \n Safety Practices \no Environmental  \nprotection and \nconcerns \no Good grooming and \npersonal hygiene \no Occupational \nSafety and Health \nStandards \no Regular practice to \nmaintain \nresuscitation skill \n Codes and \nRegulations \no All Resuscitation \nGuidelines \nconsistent with \nprotocols by \nResuscitation \nCouncil (ARC). \n Materials, Tools \n&Equipment: Uses, \nSpecifications and \nMaintenance \no Illustration of Air \nComposition during \nInspiration and \nExpiration \no Illustration on \nTrachea and Alveoli \n Discuss how oxygen \nis transported to the \ncells and how carbon \ndioxide is removed \nfrom the cells by \nrespiratory system (in \nconjunction with \ncirculatory system), \n \n Start resuscitation as \nsoon as possible after \nnormal breathing has \nstopped, whatever \nthe cause. \n \n Comprehend oral and \nwritten \ncommunication \n \n Perform clearing and \nmaintaining open \nairway by head tilting \nand chin lifting. \n \n Practice in-house \nsafety procedure on   \nenvironmental \nprotection, good \ngrooming and \nhygiene, occupational \nsafety and health \n \n Access Handbook on \nResuscitation for \nimmediate reference \non human respiratory \nsystem \n \n Monitor maintenance \nsystem for multimedia \nillustrations of human \nrespiratory system \n \n Practice personal \nvalues in classroom \nand in an aquatic \nenvironment\n\n--- PDF PAGE 40 ---\nTESDA-SOP-QSO-01-F08 \n \nTR – Lifeguard Services NC II (New)                   Promulgated December 16, 201                                     36 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are elaborated \nin the Range of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \nfunctions. \no Illustration on  \no exchange of gases \nat alveolus through \nbronchioles. \no Illustration on air \nroute to the lungs  \n Values \no Self-esteem \no Punctual/  \no Time conscious \no Environmental and \npollution conscious \no Flexible/ adaptable \no Honest \no Socially responsible \no Dependable \no Innovative \no Alert \no Systematic and \norganized \no Committed \no Creative \no Patient \no\nDetermined\n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n2. Determine \nthe function \nof human \ncirculatory \nsystem \n \n2.1 Parts of the heart is \ndiscussed in \naccordance with the \nHandbook on \nSwimming and \nLifesaving.         \n2.2 Circulatory system is \ndiscussed in \naccordance with the \nHandbook on \nSwimming and \nLifesaving.         \n2.3 Functions of blood \nvessels and \ncomponents of the \nblood in    line with \nSwimming and  \nLifesaving Manual \non Resuscitation.   \n Trade Theory \no Function of human \ncirculatory system \n Communications \no Oral and written \ncommunication \n Mathematics and    \nMensuration \no Design and \nFunctioning of \nCirculatory System \no Position of the   \nheart with respect \nto the chest and \nsternum. \n Safety Practices \no Environmental  \nprotection and \nconcerns \no Good grooming and \npersonal hygiene \no Occupational \nSafety and Health \nStandards \no Regular practice to \nmaintain \nresuscitation skill \n \n \n Discuss how the body \ncells are enabled to \nbe supplied with \noxygen and glucose \nby circulatory system  \n \n Start resuscitation as \nsoon as possible after \nnormal breathing has \nstopped, whatever \nthe cause. \n \n Comprehend oral and \nwritten \ncommunication \n \n Locate CPR \ncompression point. \n \n Practice in-House \nsafety procedure on   \nenvironmental  \nprotection, good \ngrooming and \nhygiene, occupational \nsafety and health\n\n--- PDF PAGE 41 ---\nTESDA-SOP-QSO-01-F08 \n \nTR – Lifeguard Services NC II (New)                   Promulgated December 16, 201                                     37 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are elaborated \nin the Range of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n Codes and \nRegulations \no All Resuscitation \nGuidelines \nconsistent with \nprotocols by \nResuscitation \nCouncil (RC) \n Materials, Tools &  \nEquipment: Uses,  \nSpecifications and \nMaintenance \no Illustration on \nThoracic Cage \no Illustration of the \nHeart.  \n Values \no Self-esteem \no Punctual/  \no Time conscious \no Environmental and \npollution conscious \no Flexible/ adaptable \no Honest \no Socially responsible \no Dependable \no Innovative \no Alert \no Systematic and \norganized \no Committed \no Creative \no Patient \no Determined \n Access Handbook on \nResuscitation for \nimmediate reference \non human circulatory \nsystem.  \n \n Monitor maintenance \nsystem for multimedia \nillustrations of human \ncirculatory system \n \n Practice personal \nvalues in classroom \nand in an aquatic \nenvironment \n \n \n \n3. Apply \nresuscitation \n3.1 Circumstance /s \nthat led to \nrespiratory failure \nis assessed in \naccordance with the \nHandbook on \nSwimming and \nLifesaving.       \n \n3.2 Resuscitation \nAction Plan             \n(DRSABCD) is \nperformed in \naccordance with the \nHandbook on \nSwimming and \nLifesaving.       \n Trade Theory \no Different \ncircumstances of \nrespiratory failure \no The Signs of Life \no The Chain of \nSurvival \no Resuscitation \nAction Plan  \n(DRSABCD) \no CPR techniques \nincluding \nmodification for \ninfants \n Communications \no Oral and written \ncommunication \n Mathematics and \nMensuration \no Rhythm of 30 \n Ability to detect early \nthe Cause of \nRespiratory Failure \n \n CPR Applied \nResuscitation Action \nPlan (DRSABCD) \n \n Comprehend oral and \nwritten \ncommunication \n \n Practice in-House \nsafety procedure on   \nenvironmental \nprotection, good \ngrooming and \nhygiene, occupational \nsafety and health\n\n--- PDF PAGE 42 ---\nTESDA-SOP-QSO-01-F08 \n \nTR – Lifeguard Services NC II (New)                   Promulgated December 16, 201                                     38 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are elaborated \nin the Range of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \nCompression Is 5 \nsuch cycles will be \ncompleted every 2 \nminutes. \no Two (2) breaths of \nRescue Breathing \no Depth of \ncompression for \ncasualties, \nirrespective of age, \nshould be 1/3 of the \nchest. \n Safety Practices \no Environmental  \nprotection and \nconcerns \no Good grooming and \npersonal hygiene \no Occupational \nSafety and Health \nStandards \no Regular practice to \nmaintain \nresuscitation skill  \n Codes and \nRegulations \no All Resuscitation \nGuidelines \nconsistent with \nprotocols by \nResuscitation \nCouncil (RC) \no Handbook for \nSwimming and \nLifesaving on  \nResuscitation \n Materials, Tools & \nEquipment: Uses, \nSpecifications and \nMaintenance \no Resuscitation  Anne \npractice Manikin \no Resuscitation  \nMask for Mouth- to-\nmask rescue \nbreathing \no Rubber Gloves to \navoid contact with \nblood and other \nbody fluids. \no Guidelines for \ncleaning manikins \no Illustration of \nResuscitation Flow \nChart \n Access Handbook for \nSwimming and \nLifesaving on \nResuscitation.  \n \n Monitor maintenance \nsystem for multimedia \nillustrations on \nResuscitation \n \n Cleaning and \nmaintaining manikins  \n \n Wearing mask/Using \ncorrectly personal \nprotective equipment \n(PPE) \n \n Practice personal \nvalues in classroom \nand in an aquatic \nenvironment\n\n--- PDF PAGE 43 ---\nTESDA-SOP-QSO-01-F08 \n \nTR – Lifeguard Services NC II (New)                   Promulgated December 16, 201                                     39 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are elaborated \nin the Range of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n Values \no Self-esteem \no Punctual/  \no Time conscious \no Environmental and \npollution conscious \no Flexible/ adaptable \no Honest \no Socially responsible \no Dependable \no Innovative \no Alert \no Systematic and \norganized \no Committed \no Creative \no Patient \no Determined \n4. Follow after \ncare procedures \nto drowning \nvictim \n4.1 Victim is maintained \nin  recovery position \nafter determining \nsigns of life in \naccordance with ILS \nas specified in the \nHandbook on \nSwimming and \nLifesaving.         \n \n4.2 General after care \nprocedures is applied \nin accordance with \nILS as specified in the \nHandbook on \nSwimming and \nLifesaving.         \n \n4.3 Transport of victim to \nhospital by \nambulance or any \nother vehicle is \ninitiated and use of \noxygen to victim by \nqualified lifeguards is \nassisted in \naccordance with ILS \nas specified in the \nHandbook on \nSwimming and \nLifesaving.         \n \n \n \n \n \n Trade Theory \no Casualty  \nMonitoring \no General After Care \nGuidelines \no Transportation of \nVictim \no Use of Oxygen \n Communications \no Oral and written \ncommunication \n Mathematics and \nMensuration \no Position angle done \nfor effective \nrecovery position   \n Safety Practices \no Environmental  \nprotection and \nconcerns \no Good grooming and \npersonal hygiene \no Occupational \nSafety and Health \nStandards \no Regular practice        \nto maintain \nresuscitation skills \n Codes and \nRegulations \no Guidelines for \nGeneral After Care \nas per Handbook \non Swimming and \nLifesaving \no Guidelines for  \n Position victim to \nRecovery Position \nwhen signs of life \nappear \n \n Implement After Care \nprocedure as per \nHandbook on \nSwimming and \nLifesaving on \nResuscitation, \nGeneral After Care. \n \n Comprehend oral and \nwritten \ncommunication \n \n Practice in-House \nsafety procedure on   \nenvironmental \nprotection, good \ngrooming and \nhygiene, occupational \nsafety and health \n \n Access Handbook for \nSwimming and \nLifesaving on \nResuscitation.  \n \n Monitor maintenance \nsystem for multimedia \nillustrations on \nResuscitation\n\n--- PDF PAGE 44 ---\nTESDA-SOP-QSO-01-F08 \n \nTR – Lifeguard Services NC II (New)                   Promulgated December 16, 201                                     40 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are elaborated \nin the Range of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \nRecovery Position \nas per Handbook \non Swimming and \nLifesaving. \n Materials, Tools & \nEquipment: Uses, \nSpecifications and \nMaintenance \no Illustration on the \nconduct of recovery \nposition to victim  \n Values \no Self-esteem \no Punctual/  \no Time conscious \no Environmental and \npollution conscious \no Flexible/ adaptable \no Honest \no Socially responsible \no Dependable \no Innovative \no Alert \no Systematic and \norganized \no Committed \no Creative \no Patient \no Determined \n Cleaning and \nmaintaining manikins  \n \n Wearing mask/Using \ncorrectly personal \nprotective equipment \n(PPE) \n \n Practice personal \nvalues in classroom \nand in an aquatic \nenvironment\n\n--- PDF PAGE 45 ---\nTESDA-SOP-QSO-01-F08 \n \nTR – Lifeguard Services NC II (New)                   Promulgated December 16, 201                                     41 \nRANGE OF VARIABLES \n \n \nVARIABLE \nRANGE \n1. Respiratory system \nExplanation may include but are not limited to: \n1.1. Location at thoracic cavity and protection by breastbone, \nspine, and ribs  \n1.2. Parts of respiratory system - pharynx, trachea, lungs, bronchi, \nbronchioles, alveoli, diaphragm \n1.3. Gas exchange process with the Alveoli and Trachea \n1.4. Pathway of air to lungs \n1.5. Mechanics of breathing is discussed                                           \n1.5.1   During breathing in (inspiration).  \n1.5.2 During breathing out (expiration)\n2. Heart \n \n \n \nMay include but not be limited to: \n2.1. The Heart as a strong muscular pump.                         \n2.2. Function of the Heart at Thoracic Cage.                               \n2.3. Pathway of Blood through the Heart    .                                 \n2.4. The Blood and blood vessels    \n3. Blood vessels \nMay include but not limited to: \n3.1 Arteries \n3.2 Veins \n3.3 Capillaries \n4. Blood \nMay include but not limited to: \n4.1 Red Cells \n4.2 White Cells \n4.3 Platelets \n5. Respiratory failures \n \n \n \nMay not limited to: \n5.1 Drowning \n5.2 Sudden cardiac arrest \n5.3 Stroke \n5.4 Electric shock \n5.5 Head injury \n5.6 Drug overdose \n5.7 Epilepsy \n5.8 Choking\n6. Resuscitation Action \nPlan (DRSABCD) \n \n \n \n \n \n \n \n \n \n \n \n \n \nMay include but not limited to: \n6.1 Dangers (D) and hazards to the rescuer, bystanders and the \ncasualty are checked.                                                         \n6.2 Responses (R) and the level of consciousness of the casualty \nare checked using the 'COWS' method  \n6.3 Sent (S) for help by asking bystanders to call emergency 117 \nor 112 for Ambulance.                                     \n6.4 Airway (A)is cleared and maintained. \n6.5 Breathing (B) is checked. Two (2) initial rescue breaths is  \ngiven if victim is not breathing,                                               \n6.6 Circulation (C), if still no signs of life, CPR is commenced by \ngiving Thirty (30) Compressions at center chest between two \n(2) nipples as compression point.. \n6.7 Defibrillation (D), install Defibrillator as soon as available.\n\n--- PDF PAGE 46 ---\nTESDA-SOP-QSO-01-F08 \n \nTR – Lifeguard Services NC II (New)                   Promulgated December 16, 201                                     42 \nVARIABLE \nRANGE \n7. Recovery position \n \n \n \n \n \n \n \n \nMay include but not limited to: \n7.1 Extending the casualty's far arm at right angles to the body \n7.2 Lifting the near leg \n7.3 Rolling the body onto the side while supporting the near hip \nand shoulder. \n7.4 Flexing the top hip and knee to about 90 degree. \n7.5 Placing the top forearm over the bottom elbow. \n7.6 Tilting the head back and supporting the jaw, with the face \nturned slightly towards the ground. \n8. General After Care \nMay include but not limited to: \n8.1 If incident occurs outdoors, the casualty would need \nprotection from the weather. \n8.2 No food or drink should be given to the casualty. \n8.3 Keep casualty warm with blankets or other coverings, if \nnecessary. \n8.4 Recommence Rescue Breathing if signs of life disappear. \n8.5 Provide Oxygen, if available. \n9. Use of oxygen \nMay include but not limited to: \n9.1 Assisting with the preparation of Oxygen Apparatus for use \nby qualified lifeguard. \n9.2 Handling of Oxygen Apparatus near the victim and readyfor \ninstallation by qualified lifeguard. \n \n \nEVIDENCE GUIDE \n \n1. Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \nPracticed the basic procedures of 5S  \n2.  Resource implications \nThe following resources MUST be provided: \nFacilities, materials, tools and equipment necessary for the activity \n3. Method of \nassessment \nCompetency in this unit may be assessed through: \n3.1 Third Party Report \n3.2 Interview \n3.3 Demonstration with questioning \n4. Context of \nassessment \nCompetency may be assessed in the work place or in a simulated \nwork place setting.\n",
