        "evidence_guide": {
          "source_text": "1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nDemonstrated knowledge and fitness skill in swimming 400\nmeters distance in 10 minutes at pool.\n1.2\nDemonstrated entry and exits, floating and treading water.\n2. Resource implications\nThe following resources MUST be provided:\n2.1\nRed and Yellow Uniform\n2.2\nSwimming Pool\n3. Method of\nassessment\nCompetency in this unit may be assessed through:\n3.1\nDirect Observation\n3.2\nOral interview\n3.3\nWritten Evaluation\n3.4\nThird Party Report\n4. Context of\nassessment\n4.1\nCompetency may be assessed individually in the actual\nworkplace or simulation environment of TESDA accredited\ninstitutions.\n4.2\nAssessment shall be observed while task are being\nundertaken whether individually or in group\n\n--- PDF PAGE 68 ---\nTESDA-SOP-QSO-01-F08\n\nTR – Lifeguard Services NC II (New) Promulgated December 16, 201 64\nUNIT OF COMPETENCY :\nDEMONSTRATE NON-CONTACT WATER RESCUE\n\nUNIT CODE\n:"
