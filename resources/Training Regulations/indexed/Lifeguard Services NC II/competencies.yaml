        "source_title": "DEMONSTRATE NON-CONTACT WATER RESCUE",
        "source_text": "--- PDF PAGE 68 ---\nTESDA-SOP-QSO-01-F08 \n \nTR – Lifeguard Services NC II (New)                   Promulgated December 16, 201                                     64 \nUNIT OF COMPETENCY : \nDEMONSTRATE NON-CONTACT WATER RESCUE \n \nUNIT CODE \n:    SOC541302 \n \nUNIT DESCRIPTOR \n: \nThis unit covers outcomes required in performing rescue in \nshallow waters without physical contact with the victim.     \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are elaborated \nin the Range of Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1.\nInitiate rescue \nof victims \n1.1\nCondition of victim\nis assessed to \ndetermine \nappropriate non-\ncontact rescue \ntechnique  to apply \nin accordance with \nInternational  \nstandards on \nSwimming and Life \nSaving. \n \n1.2 Victim is approached \nto initiate rescue in \naccordance with  ILS  \nas specified in \nInternational  \nstandards on \nSwimming and Life \nSaving. \n \n1.3 Victim is pacified or \nadvised to relax or \nmove to safe area \nin accordance with  \nILS as specified in \nInternational  \nstandards on \nSwimming and Life \nSaving. \n Trade Theory \no Basic Aquatic Rescue \nPrinciples \no Priority order of Non-\nswimming rescue \no Strategies in talk \nrescue \n \n Communication \no Oral and written   \ncommunication  \no Hand Signaling \nWhistle Signaling \n \n Mathematics and \nMensuration \no Distance to Safety \nposition \no Depths of water \nAngles of victim’s \nBody orientation \n \n Safety Practices \no Environmental  \nprotection and \nconcerns \no Good grooming and \npersonal hygiene \nOccupational Safety \nand Health Standards\n \n Codes and Regulations \no Standards PFD \nClassification: Type 1 \nto 3. \n \no ILS Lifesaving  \nPosition Statement  \nLPS 15 on Basic \nAquatic Survival \nSkills \n \no ILS Lifesaving \nPosition Statement \nLPS 09 on  \n Conduct talk \nrescue when victim \nis conscious, \ncapable of \nresponding to \ninstructions and is \nclo