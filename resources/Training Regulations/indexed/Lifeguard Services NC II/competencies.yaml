          "source_text": "REQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n1. Assess aquatic \nemergency \nsituation \n \n \n \n \n \n \n \n \n1.1. Signs and \nsymptoms of \naquatic injury are \ndetected in \naccordance with ILS \nas specified in the \nHandbook on \nSwimming and \nLifesaving.         \n \n1.2. Available first aid \nkits is used in \naccordance with ILS \nas specified in the \nHandbook on \nSwimming and \nLifesaving.         \n \n1.3. Triage procedure \non emergency \nhaving multiple \ncasualties is \nimplemented in \naccordance with ILS \nas specified in the \nHandbook on \nSwimming and \nLifesaving.         \n \n Trade Theory \no Aquatic \nemergency \nassessment \napplicable to \nland-based \nemergencies \nsuch as heart      \nattack and vehicle \naccidents \n \n Communications \no Oral and written \ncommunication \n Mathematics and  \nMensuration \no Gather data for  \nevaluation of \ninjury trends \no Order of \ntreatment and \nevacuation at \ntriage \n Safety Practices \no Environmental  \nprotection and \nconcerns \no Good grooming \nand personal \nhygiene \no Occupational \nSafety and Health \nStandards \n Codes and \nRegulations \no Emergency Care \nProcedures \nconsistent with \nLifesaving and \nSwimming \nHandbook on \nEmergency Care. \n \n \n \n \n \n Ability to assess \nemergency situation \nwith sense of urgency\n \n Applied Triage in \nsituation where there \nare two (2) or more \ncasualties in an \nemergency. \n \n Use available first aid \nkit or bag. \n \n Comprehend oral and \nwritten \ncommunication \n \n Practice in-House \nsafety procedure on   \nenvironmental \nprotection, good \ngrooming and \nhygiene, occupational \nsafety and health \n \n Access Handbook for \nSwimming and \nLifesaving on \nEmergency Care.  \n \n Monitor maintenance \nsystem for multimedia \nillustrations on \nEmergency Care \n \n Clean and Maintain \nfirst aid kit or bag, \nfirst aid log and \nemergency hygiene \npacks.  \n \n Practice personal \nvalues in classroom \nand in an aquatic \nenvironment\n\n--- PDF PAGE 48 ---\nTESDA-SOP-QSO-01-F08 \n \nTR – Lifeguard Services NC II (New)                   Promulgated December 16, 201                                     44 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are elaborated \nin the Range of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n Materials, Tools & \nEquipment: Uses, \nSpecifications and \nMaintenance \no First aid kit or bag \no First aid record \nCompilation \no Emergency \nHygiene Pack: \nwash soap, \ndisposable \ngloves, household \nbleach and trash \ndisposal plastic \nbag.  \n  Values \no Self-esteem \no Punctual/  \no Time conscious \no Environmental \nand pollution \nconscious \no Flexible/ \nadaptable \no Honest \no Socially \nresponsible \no Dependable \no Innovative \no Alert \no Systematic and \norganized \no Committed \no Creative \no Patient \no Determined \n \n \n \n \n \n2. Apply first aid \n \n \n \n \n \n \n \n \n \n2.1 Illness is managed \nand hygiene in  \nemergency situation is \nmaintained in \naccordance with ILS \nas specified in the \nHandbook on \nSwimming and \nLifesaving.    \n2.2 Emergency services is \ncalled carrying of \npatient/ lifting of \npatient for transport to \nhospital is assisted in \naccordance with ILS \nas specified in the \nHandbook on \nSwimming and \n Trade Theory \no Basic aid rescue, \ncare and \nmanagement) in \naquatic \nemergencies \n \n Communications \no Oral and written \ncommunication \n Mathematics and  \nMensuration \no Analysis of data \nprovided on injury \no Sorting and   \nallocating aid to \nprovide order at \ntriage situation \n Applied specific first \naid to injury \n \n Hygiene practice in \nemergency situation \n \n Call ambulance   \nemergency service \n \n Assist lifting and  \ncarrying of victim  \nfor transport to \nhospital. \n \n Comprehend  \noral and written \ncommunication\n\n--- PDF PAGE 49 ---\nTESDA-SOP-QSO-01-F08 \n \nTR – Lifeguard Services NC I