        "source_text": "--- PDF PAGE 78 ---\nTESDA-SOP-QSO-01-F08 \n \nTR – Lifeguard Services NC II (New)                   Promulgated December 16, 201                                     74 \n \nUNIT OF COMPETENCY : \nDEMONSTRATE CONTACT WATER RESCUE \n \nUNIT CODE \n:  SOC541303 \n \nUNIT DESCRIPTOR \n: \nThis unit covers skills and techniques to conduct contact rescue \nfor conscious or unconscious casualty in aquatic environments. \n \nELEMENTS \nPERFORMANCE \nCRITERIA \nItalicized terms are elaborated \nin the Range of Variables\nREQUIRED KNOWLEDGE\nREQUIRED SKILLS \n1. Execute contact \nrescue with \nconscious victim \n1.1 Condition of \nvictim is assessed. \n1.2 Victim is \napproached by \nswimming and with \nproper defensive \nposition while \nchecking positions \nconstantly. \n1.3 Victim is asked to \nturn around and \nswim behind calmly. \n1.4 Techniques for \ncontact rescue \nwith conscious \nvictim is \nperformed in \naccordance with    \nILS  as specified in \nInternational  \nstandards on \nSwimming and Life \nSaving \n1.5 Victim is \nencouraged to \nassist by kicking the \nlegs. \n1.6 Victims are assisted \nin their exits using \npool ladder, \ndesignated exit \npoint or supported \nlifting of victim if \ndesignated exit is \nnot available. \n1.7 Appropriate \naftercare is applied \nto ensure stability \non victims condition \n Trade Theory \no Rescue Principles: \nFour Steps in rescue \no Assessment \nprocedures in \ncontact rescue with \nconscious victim. \no Contact Rescue \nTechniques for \nconscious victim \n Communications \no Oral and Written \nCommunication \no Whistle and Hand  \nsignals \no Public Address (PA) \nSystem \no Alarms \n Mathematics and \nMensuration \no Depths of water \no State of the water \nbottom   \no Distance from pool \nsafety edge \no Angle Orientation \nEstimates \no Execution Period of \ncontact rescue  \n Safety Practices \no Environmental \nprotection and \nconcerns \no Good grooming and \npersonal hygiene \no 