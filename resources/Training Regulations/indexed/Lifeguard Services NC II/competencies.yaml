        "source_text": "--- PDF PAGE 23 ---\nTESDA-SOP-QSO-01-F08 \n \nTR – Lifeguard Services NC II (New)                   Promulgated December 16, 201                                     19 \n \nCOMMON COMPETENCIES \n \nUNIT OF COMPETENCY : \nDEMONSTRATE KNOWLEDGE AND SKILLS ON WATER \nSAFETY \nUNIT CODE \n: \nSOC541203 \nUNIT DESCRIPTOR \n: \nThis unit covers knowledge, skills and attitude to be safe in and \naround waters of recreation venues or places of normal abode. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are elaborated \nin the Range of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n1. Implement the \nAquacode \n1.1 “Buddy system” is \npracticed on or near \nwater. \n \n1.2 Aqua code drills for \nstaying afloat and \nwaving if in trouble \nwith water is applied in \naccordance with \nestablished standards. \n \n1.3 Procedure in reaching \nout a stick or throwing \na rope is \ndemonstrated in \naccordance with Aqua \ncode. \n \n Trade Theory \no Understanding \nWater Safety \no Definition of \nDrowning \no Types of drowning \nvictim \no Safety \nconsideration as a \nLifesaver \no Prevention of \naquatic \nemergencies \no Types of grabbing \n- \nSingle grab \n- \nDouble grab \n- \nFront grab \n- \nBack grab \no The Principle of \nAquacode \n- \nG- Go together \n- \nS- Stay afloat \nand wave \n- \nR- Reach to \nrescue  \n \n Communications \no Oral and written  \ncommunication \n \n Mathematics and \nMensuration \no Depth of water \no Distance to Safety \no Length of Stick or \nRope    \n \n Safety Practices \no Environmental \nprotection and \nconcerns \no Good grooming \nand personal \n Communication \nskills \n Ability to stay afloat \nand wave one arm \ncalmly when in \ntrouble in the water.\n Ability to reach out \nwith a stick or a \nrope to rescue a \nconscious victim.  \n Comprehension \nskills \n Ability to practice \nin-house safety \nprocedure on \nenvironmental \nprotection, good \ngrooming and \nhygiene, \noccupational safety \nand health \n Use of appropriate \nclothing for aquatic \nactivity \n Ability to prepare \nsun protection \ndevices and fluids \nfor rehydration \n Ability to prepare \nmobile phone for \nuse in any \nemergency. \n Proper use and \nSafe keep of wet \npersonal wears to \ninclude throw lines \nor ropes.    \n Ability to practice \npersonal values in \nan aquatic \nenvironment\n\n--- PDF PAGE 24 ---\nTESDA-SOP-QSO-01-F08 \n \nTR – Lifeguard Services NC II (New)                   Promulgated December 16, 201                                     20 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are elaborated \nin the Range of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \nhygiene \no Occupational  \nSafety and Health \nStandards \no Use clothing \nAppropriate for         \naquatic activities. \no Use of sun \nProtection devices \no Prepare fluids for \nRehydration \no Readied Mobile \nPhones to Access \nemergency \nservices  \n Codes and \nRegulations \no Aqua code by the \nInternational Life \nSaving  \n \n Materials, Tools & \nEquipment: Uses, \nSpecifications and \nManuals \no Swim wear  \no Eye wear \no Foot wear \no Throw Line/Rope   \n \n Values \no Self-esteem \no Punctual/ Time \nconscious \no Environmental and \npollution conscious\no Flexible/ adaptable \no Honest \no Socially  \nresponsible \no Dependable \no Innovative \no Alert \no Systematic and \norganized \no Committed \no Creative  \no Patient \no Determined \n2. Use  \nidentifiable \nclothing and \noutdoor \nprotective \n2.1 Wearing of red and \nyellow uniform is \ncomplied in \naccordance with ILS \nLifesaving Position \n Trade Theory \no Getting Ready for \nAquatic Works \no Sun Safety \no ILS Medical \n Proper wearing of \nUniform \n Use sun protection \ndevices such as \nstandard hat,\n\n--- PDF PAGE 25 ---\nTESDA-SOP-QSO-01-F08 \n \nTR – Lifeguard Services NC II (New)                   Promulgated December 16, 201                                     21 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are elaborated \nin the Range of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \ndevices \nStatement – LPS 05. \n \n \n2.2 Sun protection \ndevices and topical \nsolutions are utilized \nin accordance with the \nILS Medical Position \nStatement MPS 02. \nPosition Statement \nMPS  02 on Sun \nDangers for \nLifeguards \no ILS Lifesaving \nPosition \nStatement: LPS 05 \non Red and Yellow \nLifeguard Uniform \n \n Communications \no Oral and written \ncommunication \n \n Mathematics and \nMensuration \no Sunscreen \nMinimum \nspecification: \nBroad spectrum, \nwater resistant \nSPF 30+ \nSunscreen for skin \napplication \no Standard \nworkplace uniform \ncolor of Yellow \n(Pantone 136-137) \nand Red (Pantone \n186C) \no Recommended \nsun protection of \nLifeguard  \no Uniform at UPF50 \nor 50+.Lifeguard  \nEyewear at 100% \nUV resistant \nEPF10 polarized \nSunglasses \no Shade Canopy /   \ntent that block out \nUVR to 50% \nminimum \n \n Safety Practices \no Environmental \nprotection and \nconcerns \no Good grooming \nand persona \nhygiene \no Occupational \nSafety and Health \nStandards\nsunglasses, tents \nand first aid bag. \n Comprehension \nskills \n Proper application of \nsunscreen in skins. \n Proper use and Safe \nkeep of wet personal \nwears to include \nuniforms, canopy or \ntents, first aid bag, \nthrow lines or ropes. \n Ability to practice in-\nhouse safety \nprocedure on \nenvironmental \nprotection, good \ngrooming and \nhygiene, \noccupational safety \nand health \n Ability to practice \npersonal values in \nan aquatic \nenvironment\n\n--- PDF PAGE 26 ---\nTESDA-SOP-QSO-01-F08 \n \nTR – Lifeguard Services NC II (New)                   Promulgated December 16, 201                                     22 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are elaborated \nin the Range of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \no Use clothing \nappropriate for         \naquatic activities.  \no Use of sun \nprotection devices \no Prepare fluids for \nrehydration \no Readied mobile \nphones to access \nemergency \nservices \n \n Codes and \nRegulations \no ILS Medical \nPosition Statement \nMPS-02 on Sun \nDangers for \nLifeguards \no ILS Lifesaving \nPosition Statement \nLPS- 05 on Red \nand Yellow \nLifeguard \nUniforms. \n Materials, Tools & \nEquipment: Uses, \nSpecifications and \nMaintenance \no Red and Yellow  \nLifeguard Uniform \no Swim wear  \no Eye wear \no Foot wear \no Canopy / Tent \no Sunscreen \no Fluids \no Mobile Phones \no First Aid Bag for  \naquatic activities   \n Values \no Self-esteem \no Punctual/ Time \nconscious \no Environmental and \npollution conscious\no Flexible/ adaptable \no Honest \no Socially \nresponsible \no Dependable \no Innovative \no Alert \no\nSystematic and\n\n--- PDF PAGE 27 ---\nTESDA-SOP-QSO-01-F08 \n \nTR – Lifeguard Services NC II (New)                   Promulgated December 16, 201                                     23 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are elaborated \nin the Range of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \norganized \no Committed \no Creative \no Patient \no Determined \n3. Interpret \nstandard water \nsafety flags \nand signs \n \n3.1 Hoisting of red over \nyellow flag or other \nwater safety flags is \npracticed in any \naquatic environment \nconsistent with ISO \n20712-1-2008. \n3.2 Water safety signs \nare identified in line \nwith Aquatic and \nRecreational Signage \nStyle. \n Trade Theory \no Application of \nSpecific Water \nSafety and Beach \nFlags  \no Operation of Water \nSafety Flags \no Standard Water  \no Safety Signs  \no Pool Signage \no Regulatory Sign  \no Warning Signs \no Information and  \no Permissive Signs \no Tsunami Warning \nSystem \n \n Communications \no Oral and written \ncommunication \n \n Mathematics and \nMensuration \no Mounting position \nof Flags \no Size of Flag \no Proper hoisting \nand taking down of \nflags  \no Flag-pole  \nAnchorage.   \no Distance Factor for \nexternally \nilluminated safety \nsigns \no Typeface for Text \nof Signage \n \n Safety Practices \no Environmental  \nprotection and \nconcerns \no Good grooming \nand personal \nhygiene \no Occupational \nSafety and Health \nStandards \n \n Proper hoisting of \nRed over Yellow or \nother water safety \nflags \n Correct flag-pole \nanchoring \no Application of \nspecific Water \nSafety Flags \no Red Flag \no Yellow Flag   \no Red/Yellow Flag \no Black/White Flag \no Red/White Flag \no Truncated  \no Orange Cone \n  Applied operation of \nwater safety flags \nand poles \n \n Ability to \ncomprehend oral \nand written \ncommunication \n \n Mounting  position \n \n Size of Flag \n \n Hoisting and taking \ndown of flags \n \n Flag-poles Material \n \n Inspection and \nmaintenance of flags \nand flag-poles \n \n Storage of flags \n \n Comply with Pool \nSignage Depth \nMarkings \no Caution Shallow \nWater Sign \no No Diving Sign \no\nBeware Deep\n\n--- PDF PAGE 28 ---\nTESDA-SOP-QSO-01-F08 \n \nTR – Lifeguard Services NC II (New)                   Promulgated December 16, 201                                     24 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are elaborated \nin the Range of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n Codes and \nRegulations \no ISO 20712-1-2008 \non Water Safety \nSigns and Beach \nSafety Flags \no National Aquatic \nand Recreational \nSignage Style by \nthe Water Safety \nCouncil (AWSC) \no Standards on Pool \nSignage \n Materials, Tools & \nEquipment: Uses, \nSpecifications and \nMaintenance \no Storage of Flags \no Flag-poles \nInspection and \nMaintenance \no Inspection and  \no Maintenance of \nSignage \n Values \no Self-esteem \no Punctual/ Time \nconscious \no Environmental and \npollution conscious\no Flexible / \nadaptable \no Honest \no Socially \nresponsible \no Dependable \no Innovative \no Alert \no Systematic and \norganized \no Committed \no Creative \no Patient \no Determined \n \nWater Sign \no Beware Sudden \nDrop Off Sign \no Slippery when \nWet Sign \no Cleaning in \nProgress Sign \no Poll Closed \no Lane Closed \no Advisory \nSignage \n \n Ability to practice in-\nhouse safety \nprocedure on \nenvironmental \nprotection, good \ngrooming and \nhygiene, \noccupational safety \nand health \n \n Inspection, \nmaintenance and \nstorage of flags, \nflag-poles and \nsignage  \n \n Ability to practice \npersonal values in \nan aquatic \nenvironment \n \n \n4. Spot dangers \nof different \naquatic \nenvironments \n4.1 Dangers brought by \ncurrents, crumbling \nbanks, uneven river \nbeds and submerged \nobstacles in rivers, \ncreeks and waterholes \nare recognized in \naccordance with ILS. \n \n Trade Theory \no Dangers at \ndifferent aquatic \nenvironments \nrivers, lakes, \nponds, beaches, \npools and home or \ncondominium \naquatic \n Detection of the \npresence of \ncrumbling  banks, \nuneven river beds \nand submerged \nobstacles in rivers, \ncreeks and  \nwaterholes.\n\n--- PDF PAGE 29 ---\nTESDA-SOP-QSO-01-F08 \n \nTR – Lifeguard Services NC II (New)                   Promulgated December 16, 201                                     25 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are elaborated \nin the Range of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n \n4.2 Potential dangers in \nlakes, dams and \nlagoons are Identified \nin accordance with \nILS. \n \n4.3 Dangers of water \nbodies in farms, \nponds, and \nswimming pool are \ndetected in \naccordance with ILS. \n \n4.4 Potential dangers in \nhome aquatic \nenvironments are \nchecked in \naccordance with ILS. \nenvironment \no Factors that vary \nwater flow in river, \nlake, beach and \nocean. \no Factors that affect \nstrength of current \nin river, lake, \nbeach and ocean.  \no Stay safe \npractices: rivers, \nlakes, ponds, \nbeaches, pools \nand home or \ncondominium \naquatic \nenvironment.  \n Communications \no Oral and written \nCommunication \n Mathematics and \nMensuration \no Rivers \n- Water Volume \n- Width and \nDepth of river.  \n- Rate of Drop In \nriver bed \n- Heavy rainfall \n- Water release \nfrom dams or \nstorage areas. \n- Tidal changes \n- Crossing river \nWaters  \no Lakes and Dams \n- River entry \npoints \n- Cold Water \n- Waves \no Farm Ponds \n- Depth of water \nat farm dams \n- Cold water and \nstrong current at \nIrrigation \nchannels due to \npumps \n- Water tanks, \ntroughs and fish \nponds not \ndesigned for \nswimming. \n \n \n Ability to identify \nwhirlpool in the \nwater and reverse \ncurrents near the \nriverbank, rocks or \nsemi-submerged \nobstacle. \n \n Ability to recognize \nstrong current (Swift \nWater) at river entry \npoints of lakes, \ndams and lagoons. \n \n Ability to distinguish \npresence of cold \nwater caused by \nhigh altitude, deep \nwater or cold \nmountain stream, \navoiding sudden \nimmersion that can \ncause distress and \nshock.  \n \n Ability to Notice the \nmoderate size \nwaves that often are \nclose together and \ncan be difficult to \nswim past when they \nhave broken.   \n \n Ability to detect \nstrong currents \n(Swift Water) caused \nby irrigation pumps \nand channels in \nponds or farms.  \n \n Ability to distinguish \nin farm ponds as not \nfor swimming area: \nThe farm dams, \nwater tanks, water \ntroughs and buckets.\n \n Ability to differentiate \nplunging wave, \nspilling wave and \nsurging wave in \nbeach and ocean.\n\n--- PDF PAGE 30 ---\nTESDA-SOP-QSO-01-F08 \n \nTR – Lifeguard Services NC II (New)                   Promulgated December 16, 201                                     26 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are elaborated \nin the Range of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \no Beach and Ocean \n- Waves \n- Plunging Wave \n- Spilling Wave \n- Surging Wave \n- Currents \n- Runback \nCurrents \n- Rips \no Public/Home \nCondo) Pools \n- Varied Water \nDepths \n- Unfenced Home \nPools \n- Slippery \nSurfaces \n- Uncovered spa \nbath and \nbuckets filled \nwith liquid. \n- Fish ponds in \ngardens   \n Safety Practices \no Environmental  \nprotection and \nconcerns \no Good grooming \nand  personal \nhygiene \no Occupational \nSafety and Health \nStandards \n Codes and \nRegulations \no Stay Safe \nGuidelines for \ndifferent aquatic \nenvironments  \n Materials, Tools & \nEquipment: Uses, \nSpecifications and \nMaintenance \no Swimming and \nLifesaving \nHandbook  \n Values \no Self-esteem \no Punctual/ Time \nconscious \no Environmental and \npollution conscious\no Flexible/  \nadaptable \n Ability to differentiate \ntidal current, \nrunback current and \nrips at beach and \nocean. \n \n Ability to hoist a red \nflag “No Swim in rip \narea” when a rip \ncurrent is recognize. \n \n Ability to check for \ngood conditions of \nfences, barriers and \ngates of public and \nhome \n(condominium) \npools. \n \n Ability to safe keep \nhazard materials \nand pool equipment \nbefore allowing \nswimmers and \nbathers in pools. \n \n Ability to monitor \nweather Forecasts \nto include low tide \nand high tide \nsituation.   \n \n Ability to avoid swim \nin water crossings \npoint caused by high \ntides and swift water \ndown pour at rivers \nor floods.   \n \n Ability to \ncomprehend oral \nand written \ncommunication \n \n Ability to practice in- \nHouse safety \nprocedure on   \nenvironmental \nprotection, good \ngrooming and \nhygiene, \noccupational safety \nand  health\n\n--- PDF PAGE 31 ---\nTESDA-SOP-QSO-01-F08 \n \nTR – Lifeguard Services NC II (New)                   Promulgated December 16, 201                                     27 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are elaborated \nin the Range of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \no Honest \no Socially \nresponsible \no Dependable \no Innovative \no Alert \no Systematic and \norganized \no Committed \no Creative \no Patience \no\nDetermined\n \n Ability to practice \npersonal values in \nan aquatic \nenvironment \n5. Follow safety \nguidelines of \ndifferent aquatic \nactivities \n5.1 Swimming guidelines \nfor swimming pools \nare implemented in \naccordance with ILS. \n5.2 Guidelines for \nswimming in \nbeaches are \nimplemented in \naccordance with ILS. \n5.3 Guidelines for \nswimming in waves \nare implemented in \naccordance with ILS. \n5.4  Guidelines for \nswimming at a river \nare implemented in \naccordance with ILS. \n5.5  Guidelines for safe \nfishing are \nimplemented in \naccordance with ILS. \n5.6 Guidelines for safe \nwatercraft recreation \nare implemented in \naccordance with ILS. \n5.7 Guidelines for safe \nsurfing are \nimplemented in \naccordance with ILS. \n5.8 Guidelines for safe \nrecreational diving   \nand snorkeling are \nimplemented in \naccordance with ILS. \n5.9 Guidelines for the \nconduct of water \nsafety education and \nprograms in \naccordance with \nWater Safety \nHandbook are \nimplemented. \n \n Trade Theory \no Safety Guidelines \nof Different Aquatic \nActivities \n- Swimming at \nSwimming \nPools \n- Swimming at \nBeaches \n- Swimming in \nWaves \n- Swimming at \nRivers \n- Safe Fishing \n- Safe Watercraft \nRecreation  \n- Safe Surfing \n- Safe \nRecreational  \nDiving and \nSnorkeling \n- Conduct of \nWater Safety \nEducation and \nPrograms \n \n \n Communications \no Oral and written \nCommunication \n \n Mathematics and \nMensuration \no Orientate body at \nan angle to the \ncurrent flow, facing \nupstream as a \ntechnique to \nsurvival swimming \nat river. \no Swim parallel with \nthe waves when \n Implementation  of \nsafety guidelines for    \ndifferent aquatic \nactivities: \no Swimming at \nSwimming Pools \no Swimming at \nBeaches \no Swimming in \nWaves \no 5Swimming at \nRivers \no Safe Fishing \no Safe Watercraft \nRecreation  \no Safe Surfing \no Safe \nRecreational  \nDiving and \nSnorkeling \no Conduct of \nWater Safety \nEducation and \nPrograms  \n Ability to \ncomprehend oral \nand written \ncommunication \no Ability to swim by \norienting body at \nan angle to \ncurrent flow, \nfacing upstream \nfor survival at \nriver. \n \n Ability to swim \nparallel with the \nwaves to escape a \nrip current.\n\n--- PDF PAGE 32 ---\nTESDA-SOP-QSO-01-F08 \n \nTR – Lifeguard Services NC II (New)                   Promulgated December 16, 201                                     28 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are elaborated \nin the Range of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \ncaught in a rip \ncurrent, returning \nto the shore of the \nbeach through the \nbreaking waves. \no Float and wave, if \nunable to escape \nfrom the rip. \no For swimming in \nwaves, strength is \nneeded to break \nthrough a wave \nand gain as much \ndistance before the \nnext wave. \no Appropriate PFDs / \nharness are worn \nduring beach or \nrock fishing. \n \n Safety Practices \no Environmental \nprotection and \nconcerns \no Good grooming \nand personal \nhygiene \n \n Occupational Safety \nand Health Standards \no Choosing  and \nWearing of \nAppropriate PFD \n  \n Codes and \nRegulations \no Standards PFD \nClassification: \nType 1 to 3.  \n \n Materials, Tools & \nEquipment: Uses, \nSpecifications and \nMaintenance \no Parts and  \nfunctions of \nPersonal Flotation \nDevices (PFDs) \no Proper cleaning  \nand stowing of \nPFDs \no PFDs storage and \nproper \nsafekeeping for \n \n Ability to float and \nwave inside a rip \ncurrent  (simulating \ninability to escape a \nrip) person \n \n Get in and out         \nof the water while \nwearing a PFD. \n \n Utilize and maintain \nPFDs  \n \n Practice personal \nvalues in an aquatic \nenvironment\n\n--- PDF PAGE 33 ---\nTESDA-SOP-QSO-01-F08 \n \nTR – Lifeguard Services NC II (New)                   Promulgated December 16, 201                                     29 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are elaborated \nin the Range of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \neasy pullout /    \nuse \n Values \no Self-esteem \no Punctual/ Time \nconscious \no Environmental and \npollution conscious\no Flexible/ adaptable \no Honest \no Socially \nresponsible \no Dependable \no Innovative \no Alert \no Systematic and \norganized \no Committed \no Creative \no Patience \no Determined\n\n--- PDF PAGE 34 ---\nTESDA-SOP-QSO-01-F08 \n \nTR – Lifeguard Services NC II (New)                   Promulgated December 16, 201                                     30 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Aqua Code \nMay refer to but not limited to: \n1.1 \nGSR Aqua code: Go together, Stay afloat and wave and \nReach to rescue. \n1.2 \nP3R concept in lifesaving practice: Prevention, Recognition, \nRescue and Recovery.   \n1.3 \nSTAR Rescue Guide by RNLI: Stop, Think, Act and Review. \n1.4 \nRCS2 Swimming Rescue components by the USLA: \nRecognize and Respond, Contact and Control, and Signal \nand Save.  \n1.5 \nILS Medical Position Statement MPS13 on Aquatic \nDisasters: Prevention, Rescue, Health Management and \nDebriefing.\n2. Uniforms \nMay refer to but not limited to : \n2.1 \nWearing visible, identifiable and international consistent \nworkplace uniform of Yellow (Pantone 136-137) and Red \n(Pantone 186C) are encouraged to Aquatic Safety providers.\n2.2 \nIdeally, upper body clothing (shirts, jacket, etc.) will be \nyellow and lower body clothing (swimsuit, shorts, pants etc.) \nin Red. \n2.3 \nA set of Uniform should comprise of  \n2.3.1 Swimwear \n2.3.2 Shirt (long sleeves are preferred for outdoor work to \nmaximize  \n           sun protection)  \n2.3.3 Pants (long legged pants are preferred for outdoor \nwork to  \n           maximize sun protection) \n2.3.4 Hat (a broad brim is preferred for outdoor work to \nmaximize sun protection). Where peaked caps are \nused, there should be an attachment at the sides and \nrear which provides cover for the ears and neck. \n2.3.5 Polarized sunglasses for outdoor work.  \n2.4 \nClothing should allow protection from extreme temperatures \n(lightweight in predominantly hot environments, heavy \nweight in predominantly cold environments). \n2.5 \nUniform should provide sun protection with recommended \nUPF50 or 50+. \n2.6 \nOrganizations responsible are encouraged to provide \nUniforms. Uniforms are maintained in good condition and \nare worn at all times the lifesaver is on duty. \n2.7 \nUniforms should have words prominently displayed that \nwould lead the user of the aquatic venue to believe the \nperson wearing the uniform is a lifesaver or a lifeguard. The \nwords should be bold, in a contrast color and a minimum of \n65mm in height. \n2.8 \nCool/cold weather areas, lifesavers may need special \nprotective clothing such as thermal coats and wet/thermal \nsuits. Where appropriate these clothing should be red and \nyellow. \n2.9 \nIn certain conditions, colors red and yellow are applied to \nother special protective items such as “Stinger” suits to\n\n--- PDF PAGE 35 ---\nTESDA-SOP-QSO-01-F08 \n \nTR – Lifeguard Services NC II (New)                   Promulgated December 16, 201                                     31 \nVARIABLE \nRANGE \nprotect against dangerous marine creatures, footwear due to \nextreme hot or cold and rough ground conditions, lifejackets \nand helmets\n3. Sun protection  \ndevices \n \nMay include: \n3 1 \nSpectrum, water resistant SPF 30+ Sunscreen  applied \ngenerously on all clean, dry, exposed skin 20 minutes before \ngoing outdoor \n3.2  100% UV resistant EPF 10 polarized Sunglasses with side  \nthat does not obscure peripheral vision  \n3.3 \nShade Canopy / tent that block out UVR to 50% minimum.\n4. Flags       \n \n \nMay include:  \n4.1  Red and Yellow Flag hoisted at lifeguard stand indicating \nPool is supervised by Lifeguard. \n4.2 \nRed Flag hoisted indicating No Swim instruction to guests.\n5. Signs \n \nMay include : \n5.1    Regulatory Symbols \n5.2    Warning Symbols \n5.3    Information Symbols  \n5.4    Permissive Symbols \n5.5    Regulatory, Permissible and Safety symbols \n5.6   HazChem Symbols\n6. Currents \nMay include: \n6.1 \nFactors that causes variable water flow \n    6.1.1 Flooding \n6.1.2  Projecting Headlands \n6.1.3 Islands \n6.1.4  Winding River Course \n6.1.5  Hazards like debris, submerged trees or rocks. \n6.2  Factors that contribute to strength of current \n6.2.1  Volume of water \n6.2.2  Width and Depth of the River \n6.2.3  Rate of drop in the river bed \n6.2.4  Heavy rainfall \n6.2.5  Release of Water from storage areas or dams \n6.2.6  Tidal changes \n7. Submerged obstacles\nMay include: \n7.1  Trees \n7.2 \nBranches \n7.3  Rocks \n7.4 \nDiscarded rubbish\n8. Dangers in lakes, \ndams and lagoons. \nMay include: \n8.1  River entry points \n8.2  Cold water \n8.3 \nWaves\n9. Water bodies in \nfarms or ponds \nMay include: \n9.1  Farm dams \n9.2  Irrigation channels \n9.3  Water Troughs \n9.4  Post Holes \n9.5 \nWater Tanks\n\n--- PDF PAGE 36 ---\nTESDA-SOP-QSO-01-F08 \n \nTR – Lifeguard Services NC II (New)                   Promulgated December 16, 201                                     32 \nVARIABLE \nRANGE \n10. Dangers in beach \nand ocean \n \nMay include: \n10.1  Waves in Open Water \n10.1.1  Plunging wave \n10.1.2  Spilling wave \n10.1.3  Surging wave \n10.2   Currents in Open Water \n10.2.1 Tidal Currents \n10.2.2 Runback Currents \n10.2.3 Rip Currents\n11. Potential dangers in \nswimming pool \n \nMay include: \n11.1 Large crowds with young children, elderly people or \ninexperienced swimmers \n11.2 Slippery surfaces around edges. \n11.3 Varied depths of water in the pool.\n12. Home aquatic       \nEnvironment \nMay include: \n12.1  Unfenced Home Pools \n12.2  Gates and Barriers left open allowing easy access to a pool \n12.3  Uncovered SPA baths \n12.4  Buckets or pails filled with liquids \n12.5  Fish ponds in gardens which may attract unsupervised \nchildren \n12.6  Bath Tubs filled with water or with plug left in \n12.7 Toilets with open or accessible lids\n13. Guidelines for \nswimming at \nswimming pools \nMay include: \n13.1  Reading of Signs \n13.2  Obeying lifeguards \n13.3 Diving only where water is deep \n13.4 Staying in shallow water when not a strong swimmer.\n14. Guidelines for \nswimming at the \nbeach \nMay include: \n14.1 Swim only at patrolled beaches and stay between \nRed/Yellow flags. \n14.2 Identify a reference point on the beach to avoid drifting too \nfar from swimming area. \n14.3 Check with lifeguards if unsure of swimming conditions. \n14.4 Make sure on sound knowledge of waves, rips and currents \nif swimming on surf waters. \n14.5 Leave water immediately when instructed by lifeguards \n14.6 Swimming after dark means that you cannot be seen if in \ndifficulty. \n14.7 Swim parallel to the waves if caught in a rip current. \n14.8 Float and Wave, if unable to escape from the rip.\n15. Guidelines for \nswimming in waves \nMay include: \n15.1 Dive towards the bottom just before the wave arrives. \n15.2 Hold unto the bottom with both hands \n15.3 Bring down the feet and place them on the bottom. \n15.4 Push off the bottom back to the surface on the seaward side \nof the wave. \n15.5 Swim until next wave arrives and then repeat action.\n16. Guidelines for  \nswimming at a river \nMay include: \n16.1 Being careful not to stand on an overhanging bank \n16.2 Checking the presence and strength of current before \nentering the water \n16.3 Spreading the body’s weight by lying flat on the surface, if\n\n--- PDF PAGE 37 ---\nTESDA-SOP-QSO-01-F08 \n \nTR – Lifeguard Services NC II (New)                   Promulgated December 16, 201                                     33 \nVARIABLE \nRANGE \ntrapped in deep mud. \n16.4 Float feet first in a half-sitting position, if caught by a fast-\nflowing river or swift water drains. \n16.5 Angle (45 Degrees) into the current and swim so that you \nare pushed across to the edge, if caught by a current.  \n17. Guidelines for safe \nFishing \nMay include: \n17.1 Guidelines for Beach Fishing \n17.2 Guidelines for Rock Fishing \n17.3 Guidelines for Boat Fishing \n17.4 Guidelines for Fishing on the bank of lake or river.\n18. Guidelines for safe \nwatercraft recreation \nMay include: \n18.1 Guidelines for Safe Boating \n18.2 Guidelines for Power Boats and Jet Skis \n18.3 Guidelines for Canoeing and Kayaking \n18.4 Choosing and Using PFDs\n19. Guidelines for safe \nsurfing \nMay include: \n19.1 Surfing always at patrolled beaches and designated surfing \narea. \n19.2 Obeying lifeguards \n19.3 Never surf after consuming alcohol. \n20. Guidelines for safe  \n      recreational diving  \n      and snorkeling \n \n \nMay include: \n20.1 Plan your dive before entering water, if a qualified diver. \n20.2 Practice all signals and emergency procedures \n20.3 Maintain a thorough logbook of dives \n20.4 Always take and use dive flags to enable others to see \nwhere you are diving. \n20.5 Test your Equipment and wear appropriate clothing and \nprotection for the dive duration. \n20.6 Tell someone where you are going and your estimated time \nof return. \n20.7 Snorkel in shallow, protected waters.\n21. Guidelines for the   \n      conduct of water   \n      safety programs \nMay include: \n21.1 Infant Aquatics \n21.2 Swim and Survive Program \n21.3 Junior Lifeguard Clubs \n21.4 Bronze Rescue\n\n--- PDF PAGE 38 ---\nTESDA-SOP-QSO-01-F08 \n \nTR – Lifeguard Services NC II (New)                   Promulgated December 16, 201                                     34 \nEVIDENCE GUIDE \n \n1. Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1 Demonstrated knowledge on aqua code, use of proper \nuniform and sun protection and the dangers of different \naquatic environments \n1.2 Received and acted on messages and instruction of standard \nwater safety signage. \n1.3 Demonstrated swim competency based on swimming \nguidelines at the pool, beach, river and surf. \n1.4 Demonstrated water safety knowledge for fishing, water craft, \nsurfing, recreational diving and snorkeling. \n2. Resource \nimplications \nThe following resources MUST be provided: \n2.1 Recognized Uniform \n2.2 Swimming Pool \n2.3 Alternative aquatic locations where pools are not available. \n3. Method of \nassessment \nCompetency in this unit may be assessed through: \n3.1 Direct Observation \n3.2 Oral interview  \n3.3 Written Evaluation \n3.4 Third Party Report \n4. Context of \nassessment \nCompetency may be assessed individually in the actual workplace \nor simulation environment in TESDA accredited institutions.\n",
