        "source_text": "--- PDF PAGE 10 ---\nTESDA-SOP-QSO-01-F08 \n \nTR – Lifeguard Services NC II (New)                   Promulgated December 16, 201                                     6 \nUNIT OF COMPETENCY : \nWORK IN TEAM ENVIRONMENT \nUNIT CODE \n: \n500311106 \nUNIT DESCRIPTOR \n: \nThis unit covers the skills, knowledge and attitudes to identify \nrole and responsibility as a member of a team. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are elaborated \nin the Range of Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Describe \nteam role and \nscope \n1.1 The role and \nobjective of the team \nis identified from \navailable sources of \ninformation \n1.2 Team parameters, \nreporting relationships \nand responsibilities \nare identified from \nteam discussions and \nappropriate external \nsources \n Company \nvision/mission \nstatements \n Company policies \nand employee \ncode of conduct  \n Communication \nprocess \n Team structure \n Team roles \n Group planning \nand decision \nmaking \n Communicating \nskills appropriately \nand  consistent \nwith the culture of \nthe workplace \n Adopting skills to \nteam role and \nscope of \nresponsibilities \n2. Identify own \nrole and \nresponsibility \nwithin team \n2.1 Individual role and \nresponsibilities within \nthe team environment \nare identified \n2.2 Roles and \nresponsibility of other \nteam members are \nidentified and \nrecognized \n2.3 Reporting \nrelationships within \nteam and external to \nteam are identified \n Company \nvision/mission \nstatements \n Company policies \nand employee \ncode of conduct  \n Communication \nprocess \n Team structure \n Team roles \n Group planning \nand decision \nmaking \n Methods and \ntechniques of role \nand responsibility \nidentification with a \nteam \n Communicating \nskills appropriately \nand  consistent \nwith the culture of \nthe workplace \n Role and \nresponsibility \nidentification skills \n \n3. Work as a \nteam member  \n3.1 Effective and \nappropriate forms of \ncommunications are \nused and interactions \nundertaken with team \nmembers who \ncontribute to known \nteam activities and \nobjectives \n3.2 Effective and \nappropriate \ncontributions are \nmade to complement \n Approaches of \ninteracting with \nteam members \n Types of \ncommunications \nused in effective \ninteraction with \nteam members \n Methods of \nworking as a team \n Techniques in \nworking as a team \n \n Team working \nskills \n Communicating \nskills appropriately \nand  consistent \nwith the culture of \nthe workplace \n Skills in observing \nprotocols when \nmaking reports \n Using standard \nprocedures when\n\n--- PDF PAGE 11 ---\nTESDA-SOP-QSO-01-F08 \n \nTR – Lifeguard Services NC II (New)                   Promulgated December 16, 201                                     7 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are elaborated \nin the Range of Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \nteam activities and \nobjectives, based on \nindividual skills and \ncompetencies and \nworkplace context \n \n3.3 SOP/Protocols in \nreporting are \nobserved  \n \n3.4 Contribute to the \ndevelopment of team \nwork plans based on \nan understanding of  \nteam’s role and \nobjectives and \nindividual \ncompetencies of the \nmembers\nmaking reports \n Developing \nteamwork plans \nbased on team’s \nrole and objectives\n\n--- PDF PAGE 12 ---\nTESDA-SOP-QSO-01-F08 \n \nTR – Lifeguard Services NC II (New)                   Promulgated December 16, 201                                     8 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Role and objective of \nteam  \n1.1. Work  activities in a team environment with enterprise or \nspecific sector \n1.2. Limited discretion, initiative and judgment maybe \ndemonstrated on the job, either individually or in a team \nenvironment \n \n2. Sources of \ninformation \n2.1. Standard operating and/or other workplace procedures \n2.2. Job procedures \n2.3. Machine/equipment manufacturer’s specifications and \ninstructions \n2.4. Organizational or external personnel \n2.5. Client/supplier instructions \n2.6. Quality standards \n2.7. OSH and environmental standards \n \n3. Workplace context \n3.1. Work procedures and practices \n3.2. Conditions of  work environments \n3.3. Legislation and industrial agreements \n3.4. Standard work practice including the storage, safe handling \nand disposal of chemicals \n3.5. Safety, environmental, housekeeping and quality guidelines\n\n--- PDF PAGE 13 ---\nTESDA-SOP-QSO-01-F08 \n \nTR – Lifeguard Services NC II (New)                   Promulgated December 16, 201                                     9 \nEVIDENCE GUIDE \n \n1. Critical aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1. \nOperated in a team to complete workplace activity \n1.2. \nWorked effectively with others \n1.3. \nConveyed information in written or oral form \n1.4. \nSelected and used appropriate workplace language \n1.5. \nFollowed designated work plan for the job \n1.6. \nReported outcomes  \n \n2. Resource Implications The following resources MUST be provided: \n2.1. \nAccess to relevant workplace or appropriately simulated \nenvironment where assessment can take place \n2.2. \nMaterials relevant to the proposed activity or tasks \n \n3. Methods of \nAssessment \nCompetency in this unit may be assessed through: \n3.1. \nObservation   of the individual member in relation to the \nwork activities of the group \n3.2. \nObservation of simulation and or role play involving the \nparticipation of individual member to the attainment of \norganizational goal \n3.3. \nCase studies and scenarios as a basis for discussion of \nissues and strategies in teamwork \n \n4. Context for \nAssessment \n4.1 \nCompetency may be assessed in workplace or in a \nsimulated workplace setting \n4.2 \nAssessment shall be observed while task are being \nundertaken whether individually or in group\n",
