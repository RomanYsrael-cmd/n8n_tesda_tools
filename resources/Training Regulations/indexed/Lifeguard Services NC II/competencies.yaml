on\n4.5 Vertical or Horizontal Body Rotation\n4.6\nPropulsions from Sculling\n5. Swim\nMay include:\n5.1 Freestyle\n5.2 Breaststroke\n5.3 Backstroke\n5.4 Butterfly\n5.5 Sidestroke\n5.6 Survival backstroke\n5.7 Crawls\n6. Surface Dive\nMay include:\n6.1 Head first surface dive\n6.2 Feet first surface dive\n6.3 Extended feet first surface dive\n6.4 Controlled feet first surface dive\n7. Swimming\nUnderwater\nMay include:\n7.1 Escaping\n7.2 Searching\n7.3 Safety Issues 1\n\n--- PDF PAGE 67 ---\nTESDA-SOP-QSO-01-F08\n\nTR – Lifeguard Services NC II (New) Promulgated December 16, 201 63\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nDemonstrated knowledge and fitness skill in swimming 400\nmeters distance in 10 minutes at pool.\n1.2\nDemonstrated entry and exits, floating and treading water.\n2. Resource implications\nThe following resources MUST be provided:\n2.1\nRed and Yellow Uniform\n2.2\nSwimming Pool\n3. Method of\nassessment\nCompetency in this unit may be assessed through:\n3.1\nDirect Observation\n3.2\nOral interview\n3.3\nWritten Evaluation\n3.4\nThird Party Report\n4. Context of\nassessment\n4.1\nCompetency may be assessed individually in the actual\nworkplace or simulation environment of TESDA accredited\ninstitutions.\n4.2\nAssessment shall be observed while task are being\nundertaken whether individually or in group\n\n--- PDF PAGE 68 ---\nTESDA-SOP-QSO-01-F08\n\nTR – Lifeguard Services NC II (New) Promulgated December 16, 201 64\nUNIT OF COMPETENCY :\nDEMONSTRATE NON-CONTACT WATER RESCUE\n\nUNIT CODE\n:"
