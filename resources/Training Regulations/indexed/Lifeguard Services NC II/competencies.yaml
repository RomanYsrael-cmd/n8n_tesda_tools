LLS\n1. Specify hand and\nwhistle signals\nfor inter-lifeguard\ncommunication\n\n1.1\nWhistle signaling is\ninterpreted in\naccordance with ILS\nas specified in the\nHandbook on\nSwimming and\nLifesaving.\n\n1.2\nHand signaling is\ncoded and decoded\nin accordance with\nILS as specified in\nthe Handbook on\nSwimming and\nLifesaving.\n\n• Trade Theory\no Importance of\nHand and Whistle\nSignals In any\naquatic\nenvironment\no ILS Lifesaving\nPosition Statement\nLPS-12 on\nInternational\nLifeguard Hand\nSignals\no Wikipedia 2012:\nLifeguard Whistle\nSignals\n• Communications\no Oral and written\nCommunication\no Hand Signaling\no Whistle Signaling\n• Mathematics and\nMensuration\no Observed distance\nbetween\ntransmitter and\nreceiver\no Large background\nnoise volume at\nthe pool making\nverbal\ncommunication\ndifficult and in\neffect making hand\nand whistle signals\nuseful.\n• Safety Practices\no Environmental\nprotection and\nconcerns\no Good grooming\nand personal\nhygiene\no Occupational\nSafety and Health\nStandards\n\n• Execute hand signals\nfor inter-lifeguard\ncommunication\no Message Received\no Cover my Area\no Assistance\nRequired\no Rotate\no Come Together\no First Aid\no Major Emergency\no Take a Break\no Not Breathing\no Suspected Spinal\n\n• Blow standard whistle\nsignals\no One short\nwhistle blast to\nsignal attention or\nalert other\nlifeguards\no Three long blasts\nto signal a major\nemergency\n\n• Comprehend oral and\nwritten communication\n\n• Access Handbook for\nLifeguarding on\nEmergency Response,\nVisual and Audible\nSignals.\n\n• Clean and maintain\nLifeguard Blast\nwhistle.\n\n• Practice in-House\nsafety procedure on\nEnvironmental\nprotection, good\ngrooming and\nhygiene, occupational\nsafety and health\n\n--- PDF PAGE 55 ---\nTESDA-SOP-QSO-01-F08\n\nTR – Lifeguard Services NC II (New) Promulgated December 16, 201 51\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED