              {
                "number": "15.2",
                "text": "Hold unto the bottom with both hands"
              },
              {
                "number": "15.3",
                "text": "Bring down the feet and place them on the bottom."
              },
              {
                "number": "15.4",
                "text": "Push off the bottom back to the surface on the seaward side of the wave."
              },
              {
                "number": "15.5",
                "text": "Swim until next wave arrives and then repeat action."
              }
            ]
