          "source_text": "1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1. Practiced the basic procedures of Aquatic Emergency Care\n2. Resource\nimplications\nThe following resources MUST be provided:\n2.1\nFacilities, materials, tools and equipment necessary for the\nactivity\n3. Method of\nassessment\nCompetency in this unit may be assessed through:\n3.1\nThird Party Report\n3.2\nInterview\n3.3\nDemonstration with questioning\n4. Context of\nassessment\nCompetency may be assessed in the work place or in a simulated\nwork place setting.\n\n--- PDF PAGE 54 ---\nTESDA-SOP-QSO-01-F08\n\nTR – Lifeguard Services NC II (New) Promulgated December 16, 201 50\nUNIT OF COMPETENCY :\nPERFORM LIFEGUARDING HAND AND WHISTLE SIGNALS\nUNIT CODE\n:"
