3\nPassive Drowning Behaviors\n4.4\nUnconscious Victim\n\n5. Sensory input\nNot limited to:\n5.1\nHead counting\n5.2\nGrouping\n5.3\nMental filing\n5.4\nProfile matching\n5.5\nTracking\n6. Screening of patrons\nNot limited to\n6.1\nSupervision by parents to children\n6.2\nPromote water safety at the venue\n6.3\nEducate patrons about safety practices\n\n7. Active bathers\nNot limited to:\n7.1\nWater bobbers\n7.2\nCorner jumpers\n7.3\nSide jumpers\n7.4\nGutter grabbers / rope holders\n7.5\nSwimmers under diving boards\n7.6\nDisoriented people\n7.7\nBreath holders\n\n--- PDF PAGE 97 ---\nTESDA-SOP-QSO-01-F08\n\nTR – Lifeguard Services NC II (New) Promulgated December 16, 201 93\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nDemonstrated monitoring of aquatic surroundings, sorting\nand organizing venue patronage\n1.2\nDemonstrated assessments and response of distress\nincidents\n2. Resource implications\nThe following resources MUST be provided:\n2.1\nRed and Yellow Uniform\n2.2\nSwimming Pool\n3. Method of assessment\nCompetency in this unit may be assessed through:\n3.1\nDirect Observation\n3.2\nOral interview\n3.3\nWritten Evaluation\n4.Context of assessment\n4.1\nCompetency may be assessed individually in the actual\nworkplace or simulation environment of TESDA accredited\ninstitutions.\n4.2\nAssessment shall be observed while task are being\nundertaken whether individually or in group\n\n--- PDF PAGE 98 ---\nTESDA-SOP-QSO-01-F08\n\nTR – Lifeguard Services NC II (New) Promulgated December 16, 201 94\nUNIT OF COMPETENCY :\nMONITOR WATER QUALITY FOR SWIMMING\nUNIT CODE\n:\nSOC541305\nUNIT DESCRIPTOR\n:\nThis unit covers knowledge, skill and attitude to conduct water\nquality test for swimming pool, spring, river and marine /\nestuarine waters.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1. Perform\nchlorine level\ntest at pool\n1.1. Appropriate\namount of water\nsample is\nretrieved in test\ntubes using\nchlorine testing\nkit.\n1.2. Clarity and color\nof water sample\nis compared\nversus the\nsealed tubes\nprovided in the\ntest kit\n1.3. Actual chlorine\nlevel is\ndetermined by\nreading the\nmarked number\nin the most\nidentical sealed\ntube of the test\nkit.\n1.4. Rechecking\nchlorine level\nreading is\nrepeated\n1.5. Chlorine test\nresult is recorded\nand notified to\nimmediate\nsuperior\n1.6. Records of\nchlorine level\ntested is\nmaintained\naccording to\ncompany policies\nand procedures\n• Trade Theory\no Operation of Chlorine\nTest Kit\no Parameters of an\nacceptable chlorine\nlevel for bathing\no Procedure for the\nconduct of chlorine\nlevel test in pool.\n\n• Communication\no Oral and written\ncommunication\n\n• Mathematics and\nMensuration\no Volume reading of\nwater sample\no Comparison of water\nsample based on\ngiven color chart\no Reading of test level.\n\n• Safety Practices\no Environmental\nprotection and\nconcerns\no Good grooming and\npersonal hygiene\no Occupational Safety\nand Health Standards\n\n• Materials, Tools and\nEquipment: Uses,\nSpecifications and\nMaintenance\no Parts and functions of\nChlorine Test Kit\no Proper cleaning and\nstowing of Test Kit\n\n• Perform chlorine test\nprocedure at pool\n\n• Determine\nappropriate chlorine\nlevel using the test\nkit.\n\n• Comprehend oral\nand written\ncommunication\n\n• Report writing\n\n• Ability to extract the\nrequired volume of\nwater sample as\nread in test kit.\n\n• Determine the right\nmatching color as in\nthe test kit color\nchart\n\n• Read tested chlorine\nlevel\n\n• Follow in-house\nsafety procedures\non environmental\nprotection, good\ngrooming and\nhygiene,\noccupational safety\nand health.\n\n• Monitor\nmaintenance system\nfor Test Kit, tools\nand materials\n\n• Access PD856\narticle for immediate\n\n--- PDF PAGE 99 ---\nTESDA-SOP-QSO-01-F08\n\nTR – Lifeguard Services NC II (New) Promulgated December 16, 201 95\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n\n• Codes and\nRegulations\no Code on Sanitation of\nthe Philippines\n1998 (PD 856) by\nDOH Environmental\nHealth Service\n\n• Values\no Self-esteem\no Punctual/\no Time conscious\no Environmental and\npollution conscious\no Flexible/ adaptable\no Honest\no Socially responsible\no Dependable\no Innovative\no Alert\no Systematic and\norganized\no Committed\no Creative\no Patient\no\nDetermined\nreference of the\nsanitation cod\n• Practice personal\nvalues in an aquatic\nenvironment\n\n2. Perform acidity/\nalkalinity test at\npools and\nnatural bathing\nplace\n\n2.1 Test tube is filled\nout with appropriate\namount of water\nsample using\nacidity/alkalinity\ntesting kit.\n2.2 Changed of color in\nwater sample after\ndropping\nappropriate amount\nof testing solution is\nobserved and\ncompared versus\nthe sealed tubes in\nthe test kit.\n2.3 Acidity or alkalinity\nlevel is determined\nbased on the\nreading of the color\nin the sealed tube\n\n2.4 Acidity/Alkalinity\ntest result is\nrecorded and\nimmediately notified\nto superior\n\n• Trade Theory\no Operation of Acidity /\nAlkalinity Test Kit\no Parameters of\nAcceptable Acidity /\nAlkalinity level for\nbathing\no Test Procedure for\nthe conduct of Acidity\n/ Alkalinity level tests\nin pool.\n\n• Communication\no Oral and written\ncommunication\no Hand Signaling\no Whistle Signaling\n\n• Mathematics and\nMensuration\no Volume reading of\nwater sample\no Comparison of water\nsample based on\ngiven color chart\no Reading of test level.\n\n• Perform acidity /\nalkalinity test\nprocedure at pool\n• Determine\nappropriate acidity /\nalkalinity level using\nthe test kit.\n• Ability to comprehend\noral and written\ncommunication\n• Interpret hand and\nwhistle\ncommunication\n• Ability to extract the\nrequired volume of\nwater sample as read\nin test kit.\n• Determine the right\nmatching color as in\nthe test kit color chart\n• Read tested chlorine\nlevel\n• Practice in-house\nsafety procedure on\nenvironmental\n\n--- PDF PAGE 100 ---\nTESDA-SOP-QSO-01-F08\n\nTR – Lifeguard Services NC II (New) Promulgated December 16, 201 96\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n2.5 Record of\nacidity/alkalinity\nlevels of water is\nmaintained\naccording to\ncompany policies\nand procedures\n• Safety Practices\no Environmental\nprotection and\nconcerns\no Good grooming and\npersonal hygiene\no Occupational Safety\nand Health Standards\n\n• Materials, Tools and\nEquipment: Uses,\nSpecifications and\nMaintenance\no Parts and functions of\nAcidity/Alkalinity Test\nKit\no Proper cleaning and\nstowing of Test Kit\n\n• Codes and\nRegulations\no Code on Sanitation of\nthe Philippines 1998\n(PD 856) by DOH\nEnvironmental Health\nService\n\n• Values\no Self-esteem\no Punctual/\no Time conscious\no Environmental and\npollution conscious\no Flexible/adaptable\no Honest\no Socially responsible\no Dependable\no Innovative\no Alert\no Systematic and\norganized\no Committed\no Creative\no Patient\no Determined\nprotection, good\ngrooming and\nhygiene, occupational\nsafety and health\n\n• Monitor maintenance\nsystem for Test Kit,\ntools and materials\n\n• Access PD856 article\nfor immediate\nreference of the\nsanitation code\n\n• Practice personal\nvalues in an aquatic\nenvironment\n3. Perform\nturbidity test of\nswimming pool\nwater\n3.1 15 cm (6inches)\nblack disc is\nmounted at the\ndeepest point of the\npool\n3.2 Clear Water is\n observed after\nblack disc is\nalready visible in\n• Trade Theory\no Set-up Procedures in\nMounting the Test\nReference Disc\n• Set-up black disc at\ndeepest underwater\npart of pool.\n• Observe clarity level\nof water visually.\n\n--- PDF PAGE 101 ---\nTESDA-SOP-QSO-01-F08\n\nTR – Lifeguard Services NC II (New) Promulgated December 16, 201 97\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n\nall designated areas\nin the pool deck\n• Communication\no Oral communication\no Hand Signaling\no Whistle Signaling\n• Mathematics and\nMensuration\no Distance estimate\no Visual clarity check\n• Safety Practices\no Environmental\nprotection and\nconcerns\no Good grooming and\npersonal hygiene\no Occupational Safety\nand Health Standards\n• Materials, Tools and\nEquipment: Uses,\nSpecifications and\nMaintenance\no Parts and functions\nof metal black disc\no Proper cleaning and\nstowing of test disc.\n• Codes and\nRegulations\no Code on Sanitation of\nthe Philippines 1998\n(PD 856) by DOH\nEnvironmental Health\nService\n• Values\no Self-esteem\no Punctual/\no Time conscious\no Environmental and\npollution conscious\no Flexible/ adaptable\no Honest\no Socially responsible\no Dependable\no Innovative\no Alert\no Systematic and\norganized\no Committed\no Creative\no Patient\no Determined\n\n• Comprehend oral and\nwritten\ncommunication\n• Interpret hand and\nwhistle\ncommunication\n• Define exact location\nto place the black\ndisc in water\n• Judge visually the\nclarity of water\n• Practice in-house\nsafety procedure on\nenvironmental\nprotection, good\ngrooming and\nhygiene,\noccupational safety\nand health\n• Monitor\nmaintenance\nsystem for metal\nblack disc, tools\nand materials\n• Access PD856\narticle for\nimmediate\nreference of the\nsanitation code\n• Practice personal\nvalues in an aquatic\nenvironment\n\n--- PDF PAGE 102 ---\nTESDA-SOP-QSO-01-F08\n\nTR – Lifeguard Services NC II (New) Promulgated December 16, 201 98\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n4. Retrieve water\nsample for\nsubmission to\nlaboratory\nbacteriological\nquality test\n\n4.1. Water sample is\nretrieved and\nplaced in six 1 Liter\nbottles in\naccordance with the\nIRR of Code on\nsanitation of the\nPhilippines 1998\n(PD 856) for Public\nSwimming and\nBathing Places.\n\n4.2. Water samples\nare submitted to\nan accredited\nlaboratory by\nDOH for\nbacteriological\nand fecal\ncoliform\nanalysis.\n\n4.3. Immediate\nsuperior is notified\nof bacteriological\ntest result.\n\n• Trade Theory\no Extracting and\nHandling of Water\nSample at Pool\no Procedure on Marine\n/ Estuarine Water\nSample Extraction\n\n• Communication\no Oral and written\ncommunication\no Hand Signaling\no Whistle Signaling\n\n• Mathematics and\nMensuration\no Volume of water\nsample\no Sealing of water\nsample for transport\n\n• Safety Practices\no Environmental\nprotection and\nconcerns\no Good grooming and\npersonal hygiene\no Occupational Safety\nand Health Standards\n\n• Materials, Tools and\nEquipment: Uses,\nSpecifications and\nMaintenance\no Parts and functions of\nsampling basins and\ncontainers.\no Proper cleaning and\nstowing of containers.\n\n• Codes and Regulations\no Code on Sanitation of\nthe Philippines 1998\n(PD 856) by DOH\nEnvironmental Health\nService\n\n• Values\no Self-esteem\no Punctual/\no Time conscious\no Environmental and\npollution conscious\n• Perform retrieval of\nwater sample either\nby swimming or just\nbeside a deck or by\nuse of small craft.\n• Ability to comprehend\noral and written\ncommunication\n• Interpret hand and\nwhistle\ncommunication\n• Extract the required\nvolume of water\nsample for laboratory\ntests\n• Keep water free from\nforeign contamination\nas delivered to the\nlaboratory\n• Practice in-house\nsafety procedure of\nenvironmental\nprotection, good\ngrooming and\nhygiene, occupational\nsafety and health\n• Monitor maintenance\nsystem for water\nsample basins, tools\nand materials\n• Access PD856 article\nfor immediate\nreference of the\nsanitation code\n• Practice personal\nvalues in an aquatic\nenvironment\n\n--- PDF PAGE 103 ---\nTESDA-SOP-QSO-01-F08\n\nTR – Lifeguard Services NC II (New) Promulgated December 16, 201 99\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\no Flexible/adaptable\no Honest\no Socially responsible\no Dependable\no Innovative\no Alert\no Systematic and\norganized\no Committed\no Creative\no Patient\no Determined\n\n--- PDF PAGE 104 ---\nTESDA-SOP-QSO-01-F08\n\nTR – Lifeguard Services NC II (New) Promulgated December 16, 201 100\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n\n1. 1.Code on Sanitation\nof the Philippines\n(PD856)\n\nMay include but are not limited to:\n1.1 Guidelines for Safe Pool Operation (GSPO)\n1.2 Coastal Public Safety Guidelines\n\n2. Fecal coliform\nanalysis\n\nMay include but not limited to:\n2.1 Standard procedures set by DENR on natural bodies of water\nused for bathing, swimming or contact recreation activities.\n2.2 Guidelines set by the Code of Sanitation of the Philippines\n(PD856).\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Applied water quality monitoring for pools and marine\nEnvironments\n1.2 Demonstrated knowledge of acceptable parameters on\nchlorine, acidity/alkalinity and turbidity.\n2. Resource implications\nThe following resources MUST be provided:\n2.1 Red and yellow uniform\n2.2 Swimming pool\n2.3 Marine aquatic locations\n3. Method of assessment\nCompetency in this unit may be assessed through:\n3.1 Demonstration with questioning\n3.2 Interview\n4. Context of assessment\n4.1 Competency assessment may occur in workplace or any\nappropriately simulated environment\n4.2 Assessment shall be observed while task are being\nundertaken whether individually or in group\n\n--- PDF PAGE 105 ---\nTR – Lifeguard Services NC II (New) Promulgated December 16, 2015\n 101"
