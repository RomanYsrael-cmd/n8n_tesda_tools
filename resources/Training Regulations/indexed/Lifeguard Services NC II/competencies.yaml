m contact \nrescue with \nunconscious \nvictim \n2.1 Condition of victim \nis assessed \n2.2 Victim is \napproached with \nproper defensive \npositions to reaffirm \nunconsciousness of \nvictim. \n2.3 Techniques for \ncontact rescue \nwith unconscious \nvictim is performed \nin accordance with    \nILS  as specified in \nInternational  \nstandards on \nSwimming and Life \nSaving \n Trade Theory \no Four steps in rescue \no Assessment \nprocedures in \ncontact rescue with \nunconscious victim \no Contact Rescue \nTechniques for \nunconscious victim \n Communications \no Oral and Written \ncommunication \no Whistle and hand \nsignals \no Public Address(PA) \nSystem \no Alarms \n Ability to judge \ncondition of a \nvictim at aquatic \nenvironment \n \n Adopt defensive \nposition in \napproaching \nvictim for rescue  \n \n Endurance \nswimming while \ncarrying victim or \ntowing with \nbuoyant aid\n\n--- PDF PAGE 80 ---\nTESDA-SOP-QSO-01-F08 \n \nTR – Lifeguard Services NC II (New)                   Promulgated December 16, 201                                     76 \nELEMENTS \nPERFORMANCE \nCRITERIA \nItalicized terms are elaborated \nin the Range of Variables\nREQUIRED KNOWLEDGE\nREQUIRED SKILLS \n2.4 Immobilization \ntechnique is used to \nstabilize removal of \nvictim from water \nwith assistance of \nother lifeguards.  \n2.5 CPR is performed \nin suitably hard and \nflat surface \nimmediately after \nthe removal of \nvictim from the \nwater. \n2.6 Victim is placed in a \nrecovery position \nafter signs of life \nare present. \n2.7 Appropriate \naftercare is applied \nto ensure stability \non victims condition \n Mathematics and \nMensuration \no Depths of water \no State of the water \nbottom   \no Distance from  pool \nsafety edge \no Angle Orientation \nEstimates \no Execution Period of \ncontact rescue \n \n Safety Practices \no Environmental \nprotection and \nconcerns \no Good grooming and \npersonal hygiene \no Occupational Safety \nand Health \nStandards \no Buddy and Check-in \nSystem \no Water Checks \no Safety Stops \n \n Codes and \nRegulations \no Guidelines for Safe \nPool Operation \n(GSPO) \no Swimming and \nLifesaving \nHandbook on \nRescue Techniques \n \n Materials, Tools & \nEquipment: Uses, \nSpecifications and \nMaintenance \no Blast whistle \no Multimedia \nillustrations for \nrescue skills \nperformance. \no Personal Flotation \nDevices  \no Rescue Tube \n \n Values \no Self-esteem \no Punctual/ Time \nconscious \no Environmental and \n Perform Expired \nAir Resuscitation \n(EAR) to victim \nwhile in water \n \n Ability to remain \ncalm while doing \ncontact rescue. \n \n Comprehend oral \nand written \ncommunication \n \n Interpret hand \nand whistle \ncommunication \n \n Mensuration \napplied for \nefficiency of \naquatic tasks. \n \n Follow in house \nsafety procedures \non environmental \nprotection, good \ngrooming and \nhygiene, \noccupational  \nsafety and health \n \n Operate and \nmaintain \nmultimedia  \npresentation \nmaterials and \nequipment \n \n Access \nGuidelines for \nSafe Pool \nOperation \n(GSPO) and \nHandbook on \nRescue \nTechniques \n \n Practice personal \nvalues in aquatic \nenvironment\n\n--- PDF PAGE 81 ---\nTESDA-SOP-QSO-01-F08 \n \nTR – Lifeguard Services NC II (New)                   Promulgated December 16, 201                                     77 \nELEMENTS \nPERFORMANCE \nCRITERIA \nItalicized terms are elaborated \nin the Range of Variables\nREQUIRED KNOWLEDGE\nREQUIRED SKILLS \npollution conscious \no Flexible/ adaptable \no Honest \no Socially responsible \no Dependable \no Innovative \no Alert \no Systematic and \norganized \no Committed \no Creative \no Patient \no Determined \n3. Simulate recovery \nof a submerged \nperson \n3.1 Surface dive is \nperformed and \nsubmerged casualty \nis located and \nrecovered  in \naccordance with \nInternational  \nstandards on \nSwimming and Life \nSaving  \n Trade Theory \no Techniques for \nunderwater \n