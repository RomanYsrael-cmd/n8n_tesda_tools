        "source_text": "SOC541203\nUNIT DESCRIPTOR\n:\nThis unit covers knowledge, skills and attitude to be safe in and\naround waters of recreation venues or places of normal abode.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1. Implement the\nAquacode\n1.1 “Buddy system” is\npracticed on or near\nwater.\n\n1.2 Aqua code drills for\nstaying afloat and\nwaving if in trouble\nwith water is applied in\naccordance with\nestablished standards.\n\n1.3 Procedure in reaching\nout a stick or throwing\na rope is\ndemonstrated in\naccordance with Aqua\ncode.\n\n• Trade Theory\no Understanding\nWater Safety\no Definition of\nDrowning\no Types of drowning\nvictim\no Safety\nconsideration as a\nLifesaver\no Prevention of\naquatic\nemergencies\no Types of grabbing\n-\nSingle grab\n-\nDouble grab\n-\nFront grab\n-\nBack grab\no The Principle of\nAquacode\n-\nG- Go together\n-\nS- Stay afloat\nand wave\n-\nR- Reach to\nrescue\n\n• Communications\no Oral and written\ncommunication\n\n• Mathematics and\nMensuration\no Depth of water\no Distance to Safety\no Length of Stick or\nRope\n\n• Safety Practices\no Environmental\nprotection and\nconcerns\no Good grooming\nand personal\n• Communication\nskills\n• Ability to stay afloat\nand wave one arm\ncalmly when in\ntrouble in the water.\n• Ability to reach out\nwith a stick or a\nrope to rescue a\nconscious victim.\n• Comprehension\nskills\n• Ability to practice\nin-house safety\nprocedure on\nenvironmental\nprotection, good\ngrooming and\nhygiene,\noccupational safety\nand health\n• Use of appropriate\nclothing for aquatic\nactivity\n• Ability to prepare\nsun protection\ndevices and fluids\nfor rehydration\n• Ability to prepare\nmobile phone for\nuse in any\nemergency.\n• Proper use and\nSafe keep of wet\npersonal wears to\ninclude throw lines\nor ropes.\n• Ability to practice\npersonal values in\nan aquatic\nenvironment\n\n--- PDF PAGE 24 ---\nTESD