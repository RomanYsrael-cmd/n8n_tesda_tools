le\no Dependable\no Innovative\no Alert\no Systematic and\norganized\no Committed\no Creative\no Patience\no Determined\n\n--- PDF PAGE 34 ---\nTESDA-SOP-QSO-01-F08\n\nTR – Lifeguard Services NC II (New) Promulgated December 16, 201 30\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Aqua Code\nMay refer to but not limited to:\n1.1\nGSR Aqua code: Go together, Stay afloat and wave and\nReach to rescue.\n1.2\nP3R concept in lifesaving practice: Prevention, Recognition,\nRescue and Recovery.\n1.3\nSTAR Rescue Guide by RNLI: Stop, Think, Act and Review.\n1.4\nRCS2 Swimming Rescue components by the USLA:\nRecognize and Respond, Contact and Control, and Signal\nand Save.\n1.5\nILS Medical Position Statement MPS13 on Aquatic\nDisasters: Prevention, Rescue, Health Management and\nDebriefing.\n2. Uniforms\nMay refer to but not limited to :\n2.1\nWearing visible, identifiable and international consistent\nworkplace uniform of Yellow (Pantone 136-137) and Red\n(Pantone 186C) are encouraged to Aquatic Safety providers.\n2.2\nIdeally, upper body clothing (shirts, jacket, etc.) will be\nyellow and lower body clothing (swimsuit, shorts, pants etc.)\nin Red.\n2.3\nA set of Uniform should comprise of\n2.3.1 Swimwear\n2.3.2 Shirt (long sleeves are preferred for outdoor work to\nmaximize\n sun protection)\n2.3.3 Pants (long legged pants are preferred for outdoor\nwork to\n maximize sun protection)\n2.3.4 Hat (a broad brim is preferred for outdoor work to\nmaximize sun protection). Where peaked caps are\nused, there should be an attachment at the sides and\nrear which provides cover for the ears and neck.\n2.3.5 Polarized sunglasses for outdoor work.\n2.4\nClothing should allow protection from extreme temperatures\n(lightweight in predominantly hot environments, heavy\nweight in predominantly cold environments).\n2.5\nUniform should provide sun protection with recommended\nUPF50 or 50+.\n2.6\nOrganizations responsible are encouraged to provide\nUniforms. Uniforms are maintained in good condition and\nare worn at all times the lifesaver is on duty.\n2.7\nUniforms should have words prominently displayed that\nwould lead the user of the aquatic venue to believe the\nperson wearing the uniform is a lifesaver or a lifeguard. The\nwords should be bold, in a contrast color and a minimum of\n65mm in height.\n2.8\nCool/cold weather areas, lifesavers may need special\nprotective clothing such as thermal coats and wet/thermal\nsuits. Where appropriate these clothing should be red and\nyellow.\n2.9\nIn certain conditions, colors red and yellow are applied to\nother special protective items such as “Stinger” suits to\n\n--- PDF PAGE 35 ---\nTESDA-SOP-QSO-01-F08\n\nTR – Lifeguard Services NC II (New) Promulgated December 16, 201 31\nVARIABLE\nRANGE\nprotect against dangerous marine creatures, footwear due to\nextreme hot or cold and rough ground conditions, lifejackets\nand helmets\n3. Sun protection\ndevices\n\nMay include:\n3 1\nSpectrum, water resistant SPF 30+ Sunscreen applied\ngenerously on all clean, dry, exposed skin 20 minutes before\ngoing outdoor\n3.2 100% UV resistant EPF 10 polarized Sunglasses with side\nthat does not obscure peripheral vision\n3.3\nShade Canopy / tent that block out UVR to 50% minimum.\n4. Flags\n\nMay include:\n4.1 Red and Yellow Flag hoisted at lifeguard stand indicating\nPool is supervised by Lifeguard.\n4.2\nRed Flag hoisted indicating No Swim instruction to guests.\n5. Signs\n\nMay include :\n5.1 Regulatory Symbols\n5.2 Warning Symbols\n5.3 Information Symbols\n5.4 Permissive Symbols\n5.5 Regulatory, Permissible and Safety symbols\n5.6 HazChem Symbols\n6. Currents\nMay include:\n6.1\nFactors that causes variable water flow\n 6.1.1 Flooding\n6.1.2 Projecting Headlands\n6.1.3 Islands\n6.1.4 Winding River Course\n6.1.5 Hazards like debris, submerged trees or rocks.\n6.2 Factors that contribute to strength of current\n6.2.1 Volume of water\n6.2.2 Width and Depth of the River\n6.2.3 Rate of drop in the river bed\n6.2.4 Heavy rainfall\n6.2.5 Release of Water from storage areas or dams\n6.2.6 Tidal changes\n7. Submerged obstacles\nMay include:\n7.1 Trees\n7.2\nBranches\n7.3 Rocks\n7.4\nDiscarded rubbish\n8. Dangers in lakes,\ndams and lagoons.\nMay include:\n8.1 River entry points\n8.2 Cold water\n8.3\nWaves\n9. Water bodies in\nfarms or ponds\nMay include:\n9.1 Farm dams\n9.2 Irrigation channels\n9.3 Water Troughs\n9.4 Post Holes\n9.5\nWater Tanks\n\n--- PDF PAGE 36 ---\nTESDA-SOP-QSO-01-F08\n\nTR – Lifeguard Services NC II (New) Promulgated December 16, 201 32\nVARIABLE\nRANGE\n10. Dangers in beach\nand ocean\n\nMay include:\n10.1 Waves in Open Water\n10.1.1 Plunging wave\n10.1.2 Spilling wave\n10.1.3 Surging wave\n10.2 Currents in Open Water\n10.2.1 Tidal Currents\n10.2.2 Runback Currents\n10.2.3 Rip Currents\n11. Potential dangers in\nswimming pool\n\nMay include:\n11.1 Large crowds with young children, elderly people or\ninexperienced swimmers\n11.2 Slippery surfaces around edges.\n11.3 Varied depths of water in the pool.\n12. Home aquatic\nEnvironment\nMay include:\n12.1 Unfenced Home Pools\n12.2 Gates and Barriers left open allowing easy access to a pool\n12.3 Uncovered SPA baths\n12.4 Buckets or pails filled with liquids\n12.5 Fish ponds in gardens which may attract unsupervised\nchildren\n12.6 Bath Tubs filled with water or with plug left in\n12.7 Toilets with open or accessible lids\n13. Guidelines for\nswimming at\nswimming pools\nMay include:\n13.1 Reading of Signs\n13.2 Obeying lifeguards\n13.3 Diving only where water is deep\n13.4 Staying in shallow water when not a strong swimmer.\n14. Guidelines for\nswimming at the\nbeach\nMay include:\n14.1 Swim only at patrolled beaches and stay between\nRed/Yellow flags.\n14.2 Identify a reference point on the beach to avoid drifting too\nfar from swimming area.\n14.3 Check with lifeguards if unsure of swimming conditions.\n14.4 Make sure on sound knowledge of waves, rips and currents\nif swimming on surf waters.\n14.5 Leave water immediately when instructed by lifeguards\n14.6 Swimming after dark means that you cannot be seen if in\ndifficulty.\n14.7 Swim parallel to the waves if caught in a rip current.\n14.8 Float and Wave, if unable to escape from the rip.\n15. Guidelines for\nswimming in waves\nMay include:\n15.1 Dive towards the bottom just before the wave arrives.\n15.2 Hold unto the bottom with both hands\n15.3 Bring down the feet and place them on the bottom.\n15.4 Push off the bottom back to the surface on the seaward side\nof the wave.\n15.5 Swim until next wave arrives and then repeat action.\n16. Guidelines for\nswimming at a river\nMay include:\n16.1 Being careful not to stand on an overhanging bank\n16.2 Checking the presence and strength of current before\nentering the water\n16.3 Spreading the body’s weight by lying flat on the surface, if\n\n--- PDF PAGE 37 ---\nTESDA-SOP-QSO-01-F08\n\nTR – Lifeguard Services NC II (New) Promulgated December 16, 201 33\nVARIABLE\nRANGE\ntrapped in deep mud.\n16.4 Float feet first in a half-sitting position, if caught by a fast-\nflowing river or swift water drains.\n16.5 Angle (45 Degrees) into the current and swim so that you\nare pushed across to the edge, if caught by a current.\n17. Guidelines for safe\nFishing\nMay include:\n17.1 Guidelines for Beach Fishing\n17.2 Guidelines for Rock Fishing\n17.3 Guidelines for Boat Fishing\n17.4 Guidelines for Fishing on the bank of lake or river.\n18. Guidelines for safe\nwatercraft recreation\nMay include:\n18.1 Guidelines for Safe Boating\n18.2 Guidelines for Power Boats and Jet Skis\n18.3 Guidelines for Canoeing and Kayaking\n18.4 Choosing and Using PFDs\n19. Guidelines for safe\nsurfing\nMay include:\n19.1 Surfing always at patrolled beaches and designated surfing\narea.\n19.2 Obeying lifeguards\n19.3 Never surf after consuming alcohol.\n20. Guidelines for safe\n recreational diving\n and snorkeling\n\nMay include:\n20.1 Plan your dive before entering water, if a qualified diver.\n20.2 Practice all signals and emergency procedures\n20.3 Maintain a thorough logbook of dives\n20.4 Always take and use dive flags to enable others to see\nwhere you are diving.\n20.5 Test your Equipment and wear appropriate clothing and\nprotection for the dive duration.\n20.6 Tell someone where you are going and your estimated time\nof return.\n20.7 Snorkel in shallow, protected waters.\n21. Guidelines for the\n conduct of water\n safety programs\nMay include:\n21.1 Infant Aquatics\n21.2 Swim and Survive Program\n21.3 Junior Lifeguard Clubs\n21.4 Bronze Rescue\n\n--- PDF PAGE 38 ---\nTESDA-SOP-QSO-01-F08\n\nTR – Lifeguard Services NC II (New) Promulgated December 16, 201 34\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Demonstrated knowledge on aqua code, use of proper\nuniform and sun protection and the dangers of different\naquatic environments\n1.2 Received and acted on messages and instruction of standard\nwater safety signage.\n1.3 Demonstrated swim competency based on swimming\nguidelines at the pool, beach, river and surf.\n1.4 Demonstrated water safety knowledge for fishing, water craft,\nsurfing, recreational diving and snorkeling.\n2. Resource\nimplications\nThe following resources MUST be provided:\n2.1 Recognized Uniform\n2.2 Swimming Pool\n2.3 Alternative aquatic locations where pools are not available.\n3. Method of\nassessment\nCompetency in this unit may be assessed through:\n3.1 Direct Observation\n3.2 Oral interview\n3.3 Written Evaluation\n3.4 Third Party Report\n4. Context of\nassessment\nCompetency may be assessed individually in the actual workplace\nor simulation environment in TESDA accredited institutions.\n\n--- PDF PAGE 39 ---\nTESDA-SOP-QSO-01-F08\n\nTR – Lifeguard Services NC II (New) Promulgated December 16, 201 35\nUNIT OF COMPETENCY :\nPERFORM RESUSCITATION (CPR + ILCOR + After Care)\nUNIT CODE\n:\nSOC541204\nUNIT DESCRIPTOR\n:\nThis unit covers competency in resuscitation administration to\nvictim prior to arrival of appropriately qualified personnel.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1. Recognize the\nfunction of\nhuman\nrespiratory\nsystem\n1.1 Respiratory system\nis discussed in\naccordance with the\nHandbook on\nSwimming and\nLifesaving.\n\n1.2 Composition of air\nand gas exchange\nprocess in the\nrespiratory system is\ndiscussed in\naccordance with the\nHandbook on\nSwimming and\nLifesaving.\n\n1.3 Pathway of air\nthrough respiratory\nsystem is discussed\nthe in accordance\nwith the Handbook on\nSwimming and\nLifesaving.\n\n1.4 Mechanics of\nbreathing during\ninspiration and\nexpiration is\ndemonstrated in\naccordance with the\nHandbook on\nSwimming and\nLifesaving.\n• Trade Theory\no Function of human\nrespiratory system\no Importance of\noxygen to the cells\nof the brain, heart\nand lungs.\n• Communications\no Oral and written\ncommunication\n• Mathematics and\nMensuration\no Design and\nfunctioning of\nRespiratory System\no Volume of air intake\nthrough the mouth\n• Safety Practices\no Environmental\nprotection and\nconcerns\no Good grooming and\npersonal hygiene\no Occupational\nSafety and Health\nStandards\no Regular practice to\nmaintain\nresuscitation skill\n• Codes and\nRegulations\no All Resuscitation\nGuidelines\nconsistent with\nprotocols by\nResuscitation\nCouncil (ARC).\n• Materials, Tools\n&Equipment: Uses,\nSpecifications and\nMaintenance\no Illustration of Air\nComposition during\nInspiration and\nExpiration\no Illustration on\nTrachea and Alveoli\n• Discuss how oxygen\nis transported to the\ncells and how carbon\ndioxide is removed\nfrom the cells by\nrespiratory system (in\nconjunction with\ncirculatory system),\n\n• Start resuscitation as\nsoon as possible after\nnormal breathing has\nstopped, whatever\nthe cause.\n\n• Comprehend oral and\nwritten\ncommunication\n\n• Perform clearing and\nmaintaining open\nairway by head tilting\nand chin lifting.\n\n• Practice in-house\nsafety procedure on\nenvironmental\nprotection, good\ngrooming and\nhygiene, occupational\nsafety and health\n\n• Access Handbook on\nResuscitation for\nimmediate reference\non human respiratory\nsystem\n\n• Monitor maintenance\nsystem for multimedia\nillustrations of human\nrespiratory system\n\n• Practice personal\nvalues in classroom\nand in an aquatic\nenvironment\n\n--- PDF PAGE 40 ---\nTESDA-SOP-QSO-01-F08\n\nTR – Lifeguard Services NC II (New) Promulgated December 16, 201 36\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\nfunctions.\no Illustration on\no exchange of gases\nat alveolus through\nbronchioles.\no Illustration on air\nroute to the lungs\n• Values\no Self-esteem\no Punctual/\no Time conscious\no Environmental and\npollution conscious\no Flexible/ adaptable\no Honest\no Socially responsible\no Dependable\no Innovative\no Alert\no Systematic and\norganized\no Committed\no Creative\no Patient\no\nDetermined\n\n2. Determine\nthe function\nof human\ncirculatory\nsystem\n\n2.1 Parts of the heart is\ndiscussed in\naccordance with the\nHandbook on\nSwimming and\nLifesaving.\n2.2 Circulatory system is\ndiscussed in\naccordance with the\nHandbook on\nSwimming and\nLifesaving.\n2.3 Functions of blood\nvessels and\ncomponents of the\nblood in line with\nSwimming and\nLifesaving Manual\non Resuscitation.\n• Trade Theory\no Function of human\ncirculatory system\n• Communications\no Oral and written\ncommunication\n• Mathematics and\nMensuration\no Design and\nFunctioning of\nCirculatory System\no Position of the\nheart with respect\nto the chest and\nsternum.\n• Safety Practices\no Environmental\nprotection and\nconcerns\no Good grooming and\npersonal hygiene\no Occupational\nSafety and Health\nStandards\no Regular practice to\nmaintain\nresuscitation skill\n\n• Discuss how the body\ncells are enabled to\nbe supplied with\noxygen and glucose\nby circulatory system\n\n• Start resuscitation as\nsoon as possible after\nnormal breathing has\nstopped, whatever\nthe cause.\n\n• Comprehend oral and\nwritten\ncommunication\n\n• Locate CPR\ncompression point.\n\n• Practice in-House\nsafety procedure on\nenvironmental\nprotection, good\ngrooming and\nhygiene, occupational\nsafety and health\n\n--- PDF PAGE 41 ---\nTESDA-SOP-QSO-01-F08\n\nTR – Lifeguard Services NC II (New) Promulgated December 16, 201 37\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n• Codes and\nRegulations\no All Resuscitation\nGuidelines\nconsistent with\nprotocols by\nResuscitation\nCouncil (RC)\n• Materials, Tools &\nEquipment: Uses,\nSpecifications and\nMaintenance\no Illustration on\nThoracic Cage\no Illustration of the\nHeart.\n• Values\no Self-esteem\no Punctual/\no Time conscious\no Environmental and\npollution conscious\no Flexible/ adaptable\no Honest\no Socially responsible\no Dependable\no Innovative\no Alert\no Systematic and\norganized\no Committed\no Creative\no Patient\no Determined\n• Access Handbook on\nResuscitation for\nimmediate reference\non human circulatory\nsystem.\n\n• Monitor maintenance\nsystem for multimedia\nillustrations of human\ncirculatory system\n\n• Practice personal\nvalues in classroom\nand in an aquatic\nenvironment\n\n3. Apply\nresuscitation\n3.1 Circumstance /s\nthat led to\nrespiratory failure\nis assessed in\naccordance with the\nHandbook on\nSwimming and\nLifesaving.\n\n3.2 Resuscitation\nAction Plan\n(DRSABCD) is\nperformed in\naccordance with the\nHandbook on\nSwimming and\nLifesaving.\n• Trade Theory\no Different\ncircumstances of\nrespiratory failure\no The Signs of Life\no The Chain of\nSurvival\no Resuscitation\nAction Plan\n(DRSABCD)\no CPR techniques\nincluding\nmodification for\ninfants\n• Communications\no Oral and written\ncommunication\n• Mathematics and\nMensuration\no Rhythm of 30\n• Ability to detect early\nthe Cause of\nRespiratory Failure\n\n• CPR Applied\nResuscitation Action\nPlan (DRSABCD)\n\n• Comprehend oral and\nwritten\ncommunication\n\n• Practice in-House\nsafety procedure on\nenvironmental\nprotection, good\ngrooming and\nhygiene, occupational\nsafety and health\n\n--- PDF PAGE 42 ---\nTESDA-SOP-QSO-01-F08\n\nTR – Lifeguard Services NC II (New) Promulgated December 16, 201 38\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\nCompression Is 5\nsuch cycles will be\ncompleted every 2\nminutes.\no Two (2) breaths of\nRescue Breathing\no Depth of\ncompression for\ncasualties,\nirrespective of age,\nshould be 1/3 of the\nchest.\n• Safety Practices\no Environmental\nprotection and\nconcerns\no Good grooming and\npersonal hygiene\no Occupational\nSafety and Health\nStandards\no Regular practice to\nmaintain\nresuscitation skill\n• Codes and\nRegulations\no All Resuscitation\nGuidelines\nconsistent with\nprotocols by\nResuscitation\nCouncil (RC)\no Handbook for\nSwimming and\nLifesaving on\nResuscitation\n• Materials, Tools &\nEquipment: Uses,\nSpecifications and\nMaintenance\no Resuscitation Anne\npractice Manikin\no Resuscitation\nMask for Mouth- to-\nmask rescue\nbreathing\no Rubber Gloves to\navoid contact with\nblood and other\nbody fluids.\no Guidelines for\ncleaning manikins\no Illustration of\nResuscitation Flow\nChart\n• Access Handbook for\nSwimming and\nLifesaving on\nResuscitation.\n\n• Monitor maintenance\nsystem for multimedia\nillustrations on\nResuscitation\n\n• Cleaning and\nmaintaining manikins\n\n• Wearing mask/Using\ncorrectly personal\nprotective equipment\n(PPE)\n\n• Practice personal\nvalues in classroom\nand in an aquatic\nenvironment\n\n--- PDF PAGE 43 ---\nTESDA-SOP-QSO-01-F08\n\nTR – Lifeguard Services NC II (New) Promulgated December 16, 201 39\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n• Values\no Self-esteem\no Punctual/\no Time conscious\no Environmental and\npollution conscious\no Flexible/ adaptable\no Honest\no Socially responsible\no Dependable\no Innovative\no Alert\no Systematic and\norganized\no Committed\no Creative\no Patient\no Determined\n4. Follow after\ncare procedures\nto drowning\nvictim\n4.1 Victim is maintained\nin recovery position\nafter determining\nsigns of life in\naccordance with ILS\nas specified in the\nHandbook on\nSwimming and\nLifesaving.\n\n4.2 General after care\nprocedures is applied\nin accordance with\nILS as specified in the\nHandbook on\nSwimming and\nLifesaving.\n\n4.3 Transport of victim to\nhospital by\nambulance or any\nother vehicle is\ninitiated and use of\noxygen to victim by\nqualified lifeguards is\nassisted in\naccordance with ILS\nas specified in the\nHandbook on\nSwimming and\nLifesaving.\n\n• Trade Theory\no Casualty\nMonitoring\no General After Care\nGuidelines\no Transportation of\nVictim\no Use of Oxygen\n• Communications\no Oral and written\ncommunication\n• Mathematics and\nMensuration\no Position angle done\nfor effective\nrecovery position\n• Safety Practices\no Environmental\nprotection and\nconcerns\no Good grooming and\npersonal hygiene\no Occupational\nSafety and Health\nStandards\no Regular practice\nto maintain\nresuscitation skills\n• Codes and\nRegulations\no Guidelines for\nGeneral After Care\nas per Handbook\non Swimming and\nLifesaving\no Guidelines for\n• Position victim to\nRecovery Position\nwhen signs of life\nappear\n\n• Implement After Care\nprocedure as per\nHandbook on\nSwimming and\nLifesaving on\nResuscitation,\nGeneral After Care.\n\n• Comprehend oral and\nwritten\ncommunication\n\n• Practice in-House\nsafety procedure on\nenvironmental\nprotection, good\ngrooming and\nhygiene, occupational\nsafety and health\n\n• Access Handbook for\nSwimming and\nLifesaving on\nResuscitation.\n\n• Monitor maintenance\nsystem for multimedia\nillustrations on\nResuscitation\n\n--- PDF PAGE 44 ---\nTESDA-SOP-QSO-01-F08\n\nTR – Lifeguard Services NC II (New) Promulgated December 16, 201 40\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\nRecovery Position\nas per Handbook\non Swimming and\nLifesaving.\n• Materials, Tools &\nEquipment: Uses,\nSpecifications and\nMaintenance\no Illustration on the\nconduct of recovery\nposition to victim\n• Values\no Self-esteem\no Punctual/\no Time conscious\no Environmental and\npollution conscious\no Flexible/ adaptable\no Honest\no Socially responsible\no Dependable\no Innovative\no Alert\no Systematic and\norganized\no Committed\no Creative\no Patient\no Determined\n• Cleaning and\nmaintaining manikins\n\n• Wearing mask/Using\ncorrectly personal\nprotective equipment\n(PPE)\n\n• Practice personal\nvalues in classroom\nand in an aquatic\nenvironment\n\n--- PDF PAGE 45 ---\nTESDA-SOP-QSO-01-F08\n\nTR – Lifeguard Services NC II (New) Promulgated December 16, 201 41\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Respiratory system\nExplanation may include but are not limited to:\n1.1. Location at thoracic cavity and protection by breastbone,\nspine, and ribs\n1.2. Parts of respiratory system - pharynx, trachea, lungs, bronchi,\nbronchioles, alveoli, diaphragm\n1.3. Gas exchange process with the Alveoli and Trachea\n1.4. Pathway of air to lungs\n1.5. Mechanics of breathing is discussed\n1.5.1 During breathing in (inspiration).\n1.5.2 During breathing out (expiration)\n2. Heart\n\nMay include but not be limited to:\n2.1. The Heart as a strong muscular pump.\n2.2. Function of the Heart at Thoracic Cage.\n2.3. Pathway of Blood through the Heart .\n2.4. The Blood and blood vessels\n3. Blood vessels\nMay include but not limited to:\n3.1 Arteries\n3.2 Veins\n3.3 Capillaries\n4. Blood\nMay include but not limited to:\n4.1 Red Cells\n4.2 White Cells\n4.3 Platelets\n5. Respiratory failures\n\nMay not limited to:\n5.1 Drowning\n5.2 Sudden cardiac arrest\n5.3 Stroke\n5.4 Electric shock\n5.5 Head injury\n5.6 Drug overdose\n5.7 Epilepsy\n5.8 Choking\n6. Resuscitation Action\nPlan (DRSABCD)\n\nMay include but not limited to:\n6.1 Dangers (D) and hazards to the rescuer, bystanders and the\ncasualty are checked.\n6.2 Responses (R) and the level of consciousness of the casualty\nare checked using the 'COWS' method\n6.3 Sent (S) for help by asking bystanders to call emergency 117\nor 112 for Ambulance.\n6.4 Airway (A)is cleared and maintained.\n6.5 Breathing (B) is checked. Two (2) initial rescue breaths is\ngiven if victim is not breathing,\n6.6 Circulation (C), if still no signs of life, CPR is commenced by\ngiving Thirty (30) Compressions at center chest between two\n(2) nipples as compression point..\n6.7 Defibrillation (D), install Defibrillator as soon as available.\n\n--- PDF PAGE 46 ---\nTESDA-SOP-QSO-01-F08\n\nTR – Lifeguard Services NC II (New) Promulgated December 16, 201 42\nVARIABLE\nRANGE\n7. Recovery position\n\nMay include but not limited to:\n7.1 Extending the casualty's far arm at right angles to the body\n7.2 Lifting the near leg\n7.3 Rolling the body onto the side while supporting the near hip\nand shoulder.\n7.4 Flexing the top hip and knee to about 90 degree.\n7.5 Placing the top forearm over the bottom elbow.\n7.6 Tilting the head back and supporting the jaw, with the face\nturned slightly towards the ground.\n8. General After Care\nMay include but not limited to:\n8.1 If incident occurs outdoors, the casualty would need\nprotection from the weather.\n8.2 No food or drink should be given to the casualty.\n8.3 Keep casualty warm with blankets or other coverings, if\nnecessary.\n8.4 Recommence Rescue Breathing if signs of life disappear.\n8.5 Provide Oxygen, if available.\n9. Use of oxygen\nMay include but not limited to:\n9.1 Assisting with the preparation of Oxygen Apparatus for use\nby qualified lifeguard.\n9.2 Handling of Oxygen Apparatus near the victim and readyfor\ninstallation by qualified lifeguard.\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\nPracticed the basic procedures of 5S\n2. Resource implications\nThe following resources MUST be provided:\nFacilities, materials, tools and equipment necessary for the activity\n3. Method of\nassessment\nCompetency in this unit may be assessed through:\n3.1 Third Party Report\n3.2 Interview\n3.3 Demonstration with questioning\n4. Context of\nassessment\nCompetency may be assessed in the work place or in a simulated\nwork place setting.\n\n--- PDF PAGE 47 ---\nTESDA-SOP-QSO-01-F08\n\nTR – Lifeguard Services NC II (New) Promulgated December 16, 201 43\nUNIT OF COMPETENCY :\nPROVIDE EMERGENCY CARE (FIRST AID)\nUNIT CODE\n:\nSOC541205\nUNIT DESCRIPTOR\n:\nThis unit covers the competency required to provide basic\nlifesaving to victim prior to arrival of appropriately qualified\npersonnel.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1. Assess aquatic\nemergency\nsituation\n\n1.1. Signs and\nsymptoms of\naquatic injury are\ndetected in\naccordance with ILS\nas specified in the\nHandbook on\nSwimming and\nLifesaving.\n\n1.2. Available first aid\nkits is used in\naccordance with ILS\nas specified in the\nHandbook on\nSwimming and\nLifesaving.\n\n1.3. Triage procedure\non emergency\nhaving multiple\ncasualties is\nimplemented in\naccordance with ILS\nas specified in the\nHandbook on\nSwimming and\nLifesaving.\n\n• Trade Theory\no Aquatic\nemergency\nassessment\napplicable to\nland-based\nemergencies\nsuch as heart\nattack and vehicle\naccidents\n\n• Communications\no Oral and written\ncommunication\n• Mathematics and\nMensuration\no Gather data for\nevaluation of\ninjury trends\no Order of\ntreatment and\nevacuation at\ntriage\n• Safety Practices\no Environmental\nprotection and\nconcerns\no Good grooming\nand personal\nhygiene\no Occupational\nSafety and He