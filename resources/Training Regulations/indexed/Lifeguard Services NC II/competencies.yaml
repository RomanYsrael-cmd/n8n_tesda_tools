          "source_text": "REQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n1. Demonstrate \nsafe water \nentry and exit  \n1.1 Water entry \nprocedures is \ndemonstrated in \naccordance with \nInternational Life \nSaving as specified \nin Handbook on \nSwimming and \nLifesaving  \n \n1.2 Water exit \nprocedures is \ndemonstrated per \nHandbook on \nSwimming and \nLifesaving  \n \n Trade Theory \no Water  Safety \no Safe Water Entries \no Safe Water Exits \n \n Communication \no Oral and written \ncommunication  \no Hand Signaling \no Whistle Signaling \n \n Mathematics and \nMensuration \no Depths of water \no State of the water \nbottom   \no Distance from  \nSafety position \n \n Execute accidental \nfall in entry when \nunexpectedly falling \ninto water in an \nuncontrolled manner \n Perform a deep water \nand shallow water \nexits \n Ability to comprehend \noral and written \ncommunication \n Interpret hand and \nwhistle \ncommunication \n Detect depth and \nstate of water bottom \n Determine distance \nfrom safety position \n \n \nSafety Practices \n \n \n \no Environmental  \nprotection and \nconcerns\n Follow in-house \nsafety procedures on \nenvironmental \nprotection, good \ngrooming and \nhygiene, occupational \nsafety and health. \n \n \no Good grooming and \npersonal hygiene \n \n \no Occupational \nSafety and Health \nStandards \n \n \n Materials, Tools and \nEquipment: Uses, \nspecifications and \nMaintenance \n \n \n \no Parts and functions \nof Personal \nFlotation \nDevices(PFDs) \n Care and maintain \npersonal flotation \ndevices (PFDs) \n \n \n \no Proper cleaning \nand stowing of \nPFDs. \no PFDs storage and \nproper  safekeeping \nfor easy pullout / \nuse\n\n--- PDF PAGE 60 ---\nTESDA-SOP-QSO-01-F08 \n \nTR – Lifeguard Services NC II (New)                   Promulgated December 16, 201                                     56 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are elaborated \nin the Range of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n \n \n Codes and \nRegulations\n \n \n \no Standards PFD  \nClassification: Type \n1 to 3. \no ILS Lifesaving  \nPosition Statement  \non Basic Aquatic \nSurvival Skills \n Access Standards \nPFD Classification: \nType 1 to 3 \n \n \n Values \no Self-esteem \no Punctual/  \no Time conscious \no Environmental and \npollution conscious \no Flexible/ adaptable \no Honest \no Socially responsible \no Dependable \no Innovative \no Alert \no Systematic and \norganized \no Committed \no Creative \no Patient \no Determined \n Practice personal \nvalues  in an aquatic \nenvironment \n6 \nConduct \nfloating and \nwater treading  \n \n2.1 Safe water entry is \nperformed in \naccordance with \nstandards on \nSwimming and \nLifesaving \n \n2.2 Water treading is \ndemonstrated in \naccordance with \nInternational  \nstandards on \nSwimming and Life \nSaving \n \n2.3 Floating in water  is \ndemonstrated in \naccordance with  \nInternational  \nstandards on \nSwimming and Life \nSaving \n Trade Theory \no Water  Safety \no Sculling   \no Propulsion from \nSculling  \no Travelling in water \no Treading water \no Body Orientation \n \n \n \n Ability to enter water \nsafely \n Practice sculling in \nshallow and chest-\ndeep waters \n Perform survival \nsculling as a method \nto stay afloat at same \nposition in water. \n Execute sculling for \nforward and \nbackward movement \nin water. \n Perform head first \nand feet first sculling. \n Demonstrate \neggbeater kick for \nwater treading \n Perform front  \nand back float to \ndevelop body \norientation.\n\n--- PDF PAGE 61 ---\nTESDA-SOP-QSO-01-F08 \n \nTR – Lifeguard Services NC II (New)                   Promulgated December 16, 201                                     57 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are elaborated \nin the Range of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n \n \n \n \n Execute horizontal \nand vertical body \nrotation to establish \nbalance and control \nin the water. \n \n \n Communication \no Oral and written  \ncommunication  \no Hand Signaling \no Whistle Signaling  \n Ability to comprehend \noral and written \ncommunication \n Interpret hand and \nwhistle \ncommunication  \n \n \n Mathematics and \nMensuration \no Depths of water \no State of the water \nbottom   \no Distance from  pool \nsafety edge \no Angle Orientation \nEstimates \no Phase /Clock \nReading \n Detect depth and \nstate of water bottom \n Determine distance \nfrom safety position \n Ability to determine \nexact angle of body  \n orientation \n Ability to use and \nread phase /clock \ntiming.\n \n \nSafety Practices \n \n \n \no Environmental  \nprotection and \nconcerns \n Follow in-house \nsafety procedures on \nenvironmental  \nprotection, good \ngrooming and \nhygiene, occupational \nsafety and health. \n \n \no Good grooming and \npersonal hygiene\n \n \no Occupational \nSafety and Health \nStandards\n \n \n Materials, Tools and \nEquipment:  Uses, \nSpecifications   and \nMaintenance \n \n \n \no Parts and functions \nof Personal \nFlotation Devices \n(PFDs) \n Operate, maintain \nand read out at phase \nclock. \n \n \no Proper cleaning \nand stowing of  \nPFDs. \n \n \n Codes and \nRegulations\n \n \n \no Standards PFD \nClassification: Type \n1 to 3. \no ILS Position \nStatement LPS \n15on Basic Aquatic \nSurvival Skills \n \n \n Putting on a PFD on \nland or in water \n Sharing a PFD as a \nflotation support \n Getting in and out of \nthe water while \nwearing a PFD.\n\n--- PDF PAGE 62 ---\nTESDA-SOP-QSO-01-F08 \n \nTR – Lifeguard Services NC II (New)                   Promulgated December 16, 201                                     58 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are elaborated \nin the Range of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n \n \n \n \n Values \no Self-esteem \no Punctual/  \no Time conscious \no Environmental and \npollution conscious \no Flexible/ adaptable \