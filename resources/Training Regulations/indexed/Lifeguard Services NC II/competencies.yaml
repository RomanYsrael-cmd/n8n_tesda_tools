        "source_text": "500311105\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes required to\ngather, interpret and convey information in response to\nworkplace requirements.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Obtain and\nconvey\nworkplace\ninformation\n1.1 Specific and relevant\ninformation is accessed\nfrom appropriate\nsources\n1.2 Effective questioning,\nactive listening and\nspeaking skills are\nused to gather and\nconvey information\n1.3 Appropriate medium is\nused to transfer\ninformation and ideas\n1.4 Appropriate non- verbal\ncommunication is used\n1.5 Appropriate lines of\ncommunication with\nsupervisors and\ncolleagues are\nidentified and followed\n1.6 Defined workplace\nprocedures for the\nlocation and storage of\ninformation are used\n1.7 Personal interaction is\ncarried out clearly and\nconcisely\n• Procedure of\ngathering workplace\ninformation\n• Techniques in\ngathering\ninformation\n• Effective methods of\nconveying\ninformation\n• Written\ncommunication\nmethods\n• Techniques in\nconveying\ncommunication\n• Different modes of\ncommunication\n• Organizational\npolicies\n• Communication\nprocedures and\nsystems\n• Technology relevant\nto the enterprise and\nthe individual’s work\nresponsibilities\n• Gathering of\nworkplace\ninformation skills\n• Sourcing of\ninformation skills\n• Sorting of\ninformation skills\n• Obtaining workplace\ninformation skills\n• Conveying\nworkplace\ninformation skills\n• Gathering and\nproviding information\nin response to\nworkplace\nRequirements\n\n--- PDF PAGE 7 ---\nTESDA-SOP-QSO-01-F08\n\nTR – Lifeguard Services NC II (New) Promulgated December 16, 201 3\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n2. Participate in\nworkplace\nmeetings and\ndiscussions\n2.1 Team meetings are\nattended on time\n2.2 Own opinions are clearly\nexpressed and those of\nothers are listened to\nwithout interruption\n2.3 Meeting inputs are\nconsistent with the\nmeeting purpose and\nestablished protocols\n2.4 Workplace interactions\nare conducted in a\ncourteous manner\n2.5 Questions about simple\nroutine workplace\nprocedures and matters\nconcerning working\nconditions of\nemployment are asked\nand responded to\n2.6 Meetings outcomes are\ninterpreted and\nimplemented\n• Effective\ncommunication\n• Different modes of\ncommunication\n• Written\ncommunication\n• Organizational\npolicies\n• Communication\nprocedures and\nsystems\n• Decorum in\nparticipating\nworkplace meetings\nand discussions\n• Participating skills in\nworkplace meetings\nand discussions\n• Following simple\nspoken language\n• Completing work\nrelated documents\n• Estimating,\ncalculating and\nrecording routine\nworkplace measures\n• Relating to people of\nsocial range in the\nworkplace\n• Gathering and\nproviding information\nin response to\nworkplace\nRequirements\n3. Complete\nrelevant work\nrelated\ndocuments\n3.1 Range of forms relating\nto conditions of\nemployment are\ncompleted accurately\nand legibly\n3.2 Workplace data is\nrecorded on standard\nworkplace forms and\ndocuments\n3.3 Basic mathematical\nprocesses are used for\nroutine calculations\n3.4 Errors in recording\ninformation on forms/\ndocuments are identified\nand properly acted upon\n3.5 Reporting requirements\nto supervisor are\ncompleted according to\norganizational guidelines\n• Methods of\nmaking/completing\nwork related\ndocuments\n• Company standards\nand procedures in\nmaking work related\ndocuments\n• Effective\ncommunication\n• Different modes of\ncommunication\n• Written\ncommunication\n• Organizational\npolicies\n• Communication\nprocedures and\nsystems\n• Technology relevant\nto the enterprise and\nthe individual’s work\nresponsibilities\n• Documenting skills\n• Report writing skills\n• Making/developing\nwork related\ndocuments\n• Perform routine\nworkplace duties\nfollowing simple\nwritten notices\n• Completing work\nrelated documents\n• Estimating,\ncalculating and\nrecording routine\nworkplace measures\n• Ability to relate to\npeople of social\nrange in the\nworkplace\n\n--- PDF PAGE 8 ---\nTESDA-SOP-QSO-01-F08\n\nTR – Lifeguard Services NC II (New) Promulgated December 16, 201 4\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Appropriate sources\n1.1.\nTeam members\n1.2.\nSuppliers\n1.3.\nTrade personnel\n1.4.\nLocal government\n1.5.\nIndustry bodies\n2. Medium\n2.1.\nMemorandum\n2.2.\nCircular\n2.3.\nNotice\n2.4.\nInformation discussion\n2.5.\nFollow-up or verbal instructions\n2.6.\nFace to face communication\n3. Storage\n3.1.\nManual filing system\n3.2.\nComputer-based filing system\n4. Forms\n4.1.\nPersonnel forms, telephone message forms, safety reports\n5. Workplace\ninteractions\n5.1.\nFace to face\n5.2.\nTelephone\n5.3.\nElectronic and two way radio\n5.4.\nWritten including electronic, memos, instruction and forms,\nnon-verbal including gestures, signals, signs and diagrams\n6. Protocols\n6.1.\nObserving meeting\n6.2.\nCompliance with meeting decisions\n6.3.\nObeying meeting instructions\n\n--- PDF PAGE 9 ---\nTESDA-SOP-QSO-01-F08\n\nTR – Lifeguard Services NC II (New) Promulgated December 16, 201 5\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1. Prepared written communication following standard format\nof the organization\n1.2. Accessed information using communication equipment\n1.3. Made use of relevant terms as an aid to transfer information\neffectively\n1.4. Conveyed information effectively adopting the formal or\ninformal communication\n\n2. Resource Implications The following resources MUST be provided:\n2.1. Fax machine\n2.2. Telephone\n2.3. Writing materials\n2.4. Internet\n\n3. Methods of\nAssessment\nCompetency in this unit MUST be assessed through:\n3.1. Direct Observation\n3.2. Oral interview and written test\n\n4. Context for