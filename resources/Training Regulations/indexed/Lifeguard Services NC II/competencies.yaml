ical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nAttained job targets within key result areas (KRAs)\n1.2\nMaintained intra - and interpersonal relationship in the\ncourse of managing oneself based on performance\nevaluation\n1.3\nCompleted trainings and career opportunities which are\nbased on the requirements of the industries\n1.4\nAcquired and maintained licenses and/or certifications\naccording to the requirement of the qualification\n2. Resource Implications\nThe following resources MUST be provided:\n2.1 Workplace or assessment location\n2.2 Case studies/scenarios\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1 Portfolio Assessment\n3.2 Interview\n3.3 Simulation/Role-plays\n3.4 Observation\n3.5 Third Party Reports\n3.6 Exams and Tests\n4. Context for\nAssessment\nCompetency may be assessed in the work place or in a simulated\nwork place setting\n\n--- PDF PAGE 18 ---\nTESDA-SOP-QSO-01-F08\n\nTR – Lifeguard Services NC II (New) Promulgated December 16, 201 14\nUNIT OF COMPETENCY :\nPRACTICE OCCUPATIONAL HEALTH AND SAFETY\nPROCEDURES\nUNIT CODE\n:"
