        "descriptor": "This unit covers the competency required to provide basic\nlifesaving to victim prior to arrival of appropriately qualified\npersonnel.",
        "elements": [
          {
            "number": 1,
            "title": "Assess aquatic",
            "performance_criteria": [
              {
                "number": "1.1",
                "text": "Signs and symptoms of aquatic injury are detected in accordance with ILS as specified in the Handbook on Swimming and Lifesaving."
              },
              {
                "number": "1.2",
                "text": "Available first aid kits is used in accordance with ILS as specified in the Handbook on Swimming and Lifesaving."
              },
              {
                "number": "1.3",
                "text": "Triage procedure on emergency having multiple casualties is implemented in accordance with ILS as specified in the Handbook on Swimming and Lifesaving. • Trade Theory o Aquatic emergency assessment applicable to land-based emergencies such as heart attack and vehicle accidents • Communications o Oral and written communication • Mathematics and Mensuration o Gather data for evaluation of injury trends o Order of treatment and evacuation at triage • Safety Practices o Environmental protection and concerns o Good grooming and personal hygiene o Occupational Safety and Health Standards • Codes and Regulations o Emergency Care Procedures consistent with Lifesaving and Swimming Handbook on Emergency Care. • Ability to assess emergency situation with sense of urgency • Applied Triage in situation where there are two (2) or more casualties in an emergency. • Use available first aid kit or bag. • Comprehend oral and written communication • Practice in-House safety procedure on environmental protection, good grooming and hygiene, occupational safety and health • Access Handbook for Swimming and Lifesaving on Emergency Care. • Monitor maintenance system for multimedia illustrations on Emergency Care • Clean and Maintain first aid kit or bag, first aid log and emergency hygiene packs. • Practice personal values in classroom and in an aquatic environment --- PDF PAGE 48 --- TESDA-SOP-QSO-01-F08 TR – Lifeguard Services NC II (New) Promulgated December 16, 201 44 PERFORMANCE CRITERIA Italicized terms are elaborated in the Range of Variables REQUIRED KNOWLEDGE REQUIRED SKILLS • Materials, Tools & Equipment: Uses, Specifications and Maintenance o First aid kit or bag o First aid record Compilation o Emergency Hygiene Pack: wash soap, disposable gloves, household bleach and trash disposal plastic bag. • Values o Self-esteem o Punctual/ o Time conscious o Environmental and pollution conscious o Flexible/ adaptable o Honest o Socially responsible o Dependable o Innovative o Alert o Systematic and organized o Committed o Creative o Patient o Determined"
              }
            ]
          },
          {
            "number": 2,
            "title": "Apply first aid",
            "performance_criteria": [
              {
                "number": "2.1",
                "text": "Illness is managed and hygiene in emergency situation is maintained in accordance with ILS as specified in the Handbook on Swimming and Lifesaving."
              },
              {
                "number": "2.2",
                "text": "Emergency services is called carrying of patient/ lifting of patient for transport to hospital is assisted in accordance with ILS as specified in the Handbook on Swimming and • Trade Theory o Basic aid rescue, care and management) in aquatic emergencies • Communications o Oral and written communication • Mathematics and Mensuration o Analysis of data provided on injury o Sorting and allocating aid to provide order at triage situation • Applied specific first aid to injury • Hygiene practice in emergency situation • Call ambulance emergency service • Assist lifting and carrying of victim for transport to hospital. • Comprehend oral and written communication --- PDF PAGE 49 --- TESDA-SOP-QSO-01-F08 TR – Lifeguard Services NC II (New) Promulgated December 16, 201 45 PERFORMANCE CRITERIA Italicized terms are elaborated in the Range of Variables REQUIRED KNOWLEDGE REQUIRED SKILLS Lifesaving. • Safety Practices o Environmental protection and concerns o Good grooming and personal hygiene o Occupational Safety and Health Standards • Codes and Regulations o GSPO Section 3- F8 on First Aid Forms o GSPO Section 3 – FA4 on First Aid Kits. o GSPO Section 3- F7 on Personal Protective Equipment and Safety. • Materials, Tools & Equipment: Uses, Specifications and Maintenance o First aid kit or bag o Emergency Hygiene Pack: wash soap, disposable gloves, household bleach and trash disposal plastic bag o First aid record Compilation o Spine Board with head immobilizer o Folding Stretcher with roller • Values o Self-esteem o Punctual/ o Time conscious o Environmental and pollution conscious o Flexible/ adaptable o Honest o Socially • Access Handbook for Swimming and Lifesaving on Emergency Care. • Monitor maintenance system for multimedia illustrations on Emergency Care • Practice in-house safety procedure on environmental protection, good grooming and hygiene, occupational safety and health • Dispose properly hygiene packs used in emergency and clean treatment area • Clean and Maintain First aid kit or bag, first aid log, spine board and folding stretcher. • Practice personal values in classroom and in an aquatic environment --- PDF PAGE 50 --- TESDA-SOP-QSO-01-F08 TR – Lifeguard Services NC II (New) Promulgated December 16, 201 46 PERFORMANCE CRITERIA Italicized terms are elaborated in the Range of Variables REQUIRED KNOWLEDGE REQUIRED SKILLS responsible o Dependable o Innovative o Alert o Systematic and organized o Committed o Creative o Patient o Determined"
