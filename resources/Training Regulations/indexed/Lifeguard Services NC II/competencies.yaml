        "source_text": "SOC541204\nUNIT DESCRIPTOR\n:\nThis unit covers competency in resuscitation administration to\nvictim prior to arrival of appropriately qualified personnel.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1. Recognize the\nfunction of\nhuman\nrespiratory\nsystem\n1.1 Respiratory system\nis discussed in\naccordance with the\nHandbook on\nSwimming and\nLifesaving.\n\n1.2 Composition of air\nand gas exchange\nprocess in the\nrespiratory system is\ndiscussed in\naccordance with the\nHandbook on\nSwimming and\nLifesaving.\n\n1.3 Pathway of air\nthrough respiratory\nsystem is discussed\nthe in accordance\nwith the Handbook on\nSwimming and\nLifesaving.\n\n1.4 Mechanics of\nbreathing during\ninspiration and\nexpiration is\ndemonstrated in\naccordance with the\nHandbook on\nSwimming and\nLifesaving.\n• Trade Theory\no Function of human\nrespiratory system\no Importance of\noxygen to the cells\nof the brain, heart\nand lungs.\n• Communications\no Oral and written\ncommunication\n• Mathematics and\nMensuration\no Design and\nfunctioning of\nRespiratory System\no Volume of air intake\nthrough the mouth\n• Safety Practices\no Environmental\nprotection and\nconcerns\no Good grooming and\npersonal hygiene\no Occupational\nSafety and Health\nStandards\no Regular practice to\nmaintain\nresuscitation skill\n• Codes and\nRegulations\no All Resuscitation\nGuidelines\nconsistent with\nprotocols by\nResuscitation\nCouncil (ARC).\n• Materials, Tools\n&Equipment: Uses,\nSpecifications and\nMaintenance\no Illustration of Air\nComposition during\nInspiration and\nExpiration\no Illustration on\nTrachea and Alveoli\n• Discuss how oxygen\nis transported to the\ncells and how carbon\ndioxide is removed\nfrom the cells by\nrespiratory system (in\nconjunction with\ncirculatory system),\n\n• Start resuscitation as\nsoon as possible after\nnormal breathing has\nstopped, whatever\nthe cause.\