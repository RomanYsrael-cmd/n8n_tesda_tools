              {
                "number": "14.2",
                "text": "Identify a reference point on the beach to avoid drifting too far from swimming area."
              },
              {
                "number": "14.3",
                "text": "Check with lifeguards if unsure of swimming conditions."
              },
              {
                "number": "14.4",
                "text": "Make sure on sound knowledge of waves, rips and currents if swimming on surf waters."
              },
              {
                "number": "14.5",
                "text": "Leave water immediately when instructed by lifeguards"
              },
              {
                "number": "14.6",
                "text": "Swimming after dark means that you cannot be seen if in difficulty."
              },
