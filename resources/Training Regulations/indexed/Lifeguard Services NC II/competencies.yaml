  "source_section_text": "SECTION 2 COMPETENCY STANDARDS\n\nThese guidelines are set to provide the Technical Vocational Education and Training\n(TVET) providers with information on the competencies and similar important requirements to\nconsider when designing training programs for LIFEGUARD SERVICES NC II.\n\nBASIC COMPETENCIES\n\nUNIT OF COMPETENCY :\nPARTICIPATE IN WORKPLACE COMMUNICATION\nUNIT CODE\n:\n500311105\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes required to\ngather, interpret and convey information in response to\nworkplace requirements.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Obtain and\nconvey\nworkplace\ninformation\n1.1 Specific and relevant\ninformation is accessed\nfrom appropriate\nsources\n1.2 Effective questioning,\nactive listening and\nspeaking skills are\nused to gather and\nconvey information\n1.3 Appropriate medium is\nused to transfer\ninformation and ideas\n1.4 Appropriate non- verbal\ncommunication is used\n1.5 Appropriate lines of\ncommunication with\nsupervisors and\ncolleagues are\nidentified and followed\n1.6 Defined workplace\nprocedures for the\nlocation and storage of\ninformation are used\n1.7 Personal interaction is\ncarried out clearly and\nconcisely\n• Procedure of\ngathering workplace\ninformation\n• Techniques in\ngathering\ninformation\n• Effective methods of\nconveying\ninformation\n• Written\ncommunication\nmethods\n• Techniques in\nconveying\ncommunication\n• Different modes of\ncommunication\n• Organizational\npolicies\n• Communication\nprocedures and\nsystems\n• Technology relevant\nto the enterprise and\nthe individual’s work\nresponsibilities\n• Gathering of\nworkplace\ninformation skills\n• Sourcing of\ninformation skills\n• Sorting of\ninformation skills\n• Obtaining workplace\ninformation skills\n• Conveying\nworkplace\ninformation skills\n• Gathering and\nproviding information\nin response to\nworkplace\nRequirements\n\n--- PDF PAGE 7 ---\nTESDA-SOP-QSO-01-F08\n\nTR – Lifeguard Services NC II (New) Promulgated December 16, 201 3\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n2. Participate in\nworkplace\nmeetings and\ndiscussions\n2.1 Team meetings are\nattended on time\n2.2 Own opinions are clearly\nexpressed and those of\nothers are listened to\nwithout interruption\n2.3 Meeting inputs are\nconsistent with the\nmeeting purpose and\nestablished protocols\n2.4 Workplace interactions\nare conducted in a\ncourteous manner\n2.5 Questions about simple\nroutine workplace\nprocedures and matters\nconcerning working\nconditions of\nemployment are asked\nand responded to\n2.6 Meetings outcomes are\ninterpreted and\nimplemented\n• Effective\ncommunication\n• Different modes of\ncommunication\n• Written\ncommunication\n• Organizational\npolicies\n• Communication\nprocedures and\nsystems\n• Decorum in\nparticipating\nworkplace meetings\nand discussions\n• Participating skills in\nworkplace meetings\nand discussions\n• Following simple\nspoken language\n• Completing work\nrelated documents\n• Estimating,\ncalculating and\nrecording routine\nworkplace measures\n• Relating to people of\nsocial range in the\nworkplace\n• Gathering and\nproviding information\nin response to\nworkplace\nRequirements\n3. Complete\nrelevant work\nrelated\ndocuments\n3.1 Range of forms relating\nto conditions of\nemployment are\ncompleted accurately\nand legibly\n3.2 Workplace data is\nrecorded on standard\nworkplace forms and\ndocuments\n3.3 Basic mathematical\nprocesses are used for\nroutine calculations\n3.4 Errors in recording\ninformation on forms/\ndocuments are identified\nand properly acted upon\n3.5 Reporting requirements\nto supervisor are\ncompleted according to\norganizational guidelines\n• Methods of\nmaking/completing\nwork related\ndocuments\n• Company standards\nand procedures in\nma