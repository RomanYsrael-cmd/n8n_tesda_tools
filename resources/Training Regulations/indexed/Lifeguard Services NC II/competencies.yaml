          "source_text": "REQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n1. Perform \nchlorine level \ntest at pool \n1.1. Appropriate \namount of water \nsample is \nretrieved in test \ntubes using \nchlorine testing \nkit. \n1.2. Clarity and color \nof water sample \nis compared \nversus the \nsealed tubes \nprovided in the \ntest kit \n1.3. Actual chlorine \nlevel is \ndetermined by \nreading the \nmarked number \nin the most \nidentical sealed \ntube of the test \nkit. \n1.4. Rechecking \nchlorine level \nreading is \nrepeated \n1.5. Chlorine test \nresult is recorded \nand notified to \nimmediate \nsuperior \n1.6. Records of \nchlorine level \ntested is \nmaintained \naccording to \ncompany policies \nand procedures\n Trade Theory \no Operation of Chlorine \nTest Kit \no Parameters of an \nacceptable chlorine \nlevel for bathing \no Procedure for the \nconduct of chlorine \nlevel test in pool. \n \n Communication \no Oral and written \ncommunication \n \n Mathematics and \nMensuration \no Volume reading of \nwater sample \no Comparison of water \nsample based on \ngiven color chart \no Reading of test level. \n \n Safety Practices \no Environmental  \nprotection and \nconcerns \no Good grooming and \npersonal hygiene \no Occupational Safety \nand Health Standards\n \n Materials, Tools and \nEquipment: Uses,  \nSpecifications and \nMaintenance \no Parts and functions of \nChlorine Test Kit  \no Proper cleaning and \nstowing of  Test Kit \n \n \n \n Perform chlorine test \nprocedure at pool  \n \n Determine \nappropriate chlorine \nlevel using the test \nkit. \n \n Comprehend oral \nand written \ncommunication \n \n Report writing \n \n Ability to extract the \nrequired volume of \nwater sample as \nread in test kit. \n \n Determine the right \nmatching color as in \nthe test kit color \nchart \n \n Read tested chlorine \nlevel \n \n Follow in-house \nsafety procedures \non environmental \nprotection, good \ngrooming and \nhygiene, \noccupational safety \n