          "source_text": "REQUIRED KNOWLEDGE\nREQUIRED SKILLS \n1. Execute contact \nrescue with \nconscious victim \n1.1 Condition of \nvictim is assessed. \n1.2 Victim is \napproached by \nswimming and with \nproper defensive \nposition while \nchecking positions \nconstantly. \n1.3 Victim is asked to \nturn around and \nswim behind calmly. \n1.4 Techniques for \ncontact rescue \nwith conscious \nvictim is \nperformed in \naccordance with    \nILS  as specified in \nInternational  \nstandards on \nSwimming and Life \nSaving \n1.5 Victim is \nencouraged to \nassist by kicking the \nlegs. \n1.6 Victims are assisted \nin their exits using \npool ladder, \ndesignated exit \npoint or supported \nlifting of victim if \ndesignated exit is \nnot available. \n1.7 Appropriate \naftercare is applied \nto ensure stability \non victims condition \n Trade Theory \no Rescue Principles: \nFour Steps in rescue \no Assessment \nprocedures in \ncontact rescue with \nconscious victim. \no Contact Rescue \nTechniques for \nconscious victim \n Communications \no Oral and Written \nCommunication \no Whistle and Hand  \nsignals \no Public Address (PA) \nSystem \no Alarms \n Mathematics and \nMensuration \no Depths of water \no State of the water \nbottom   \no Distance from pool \nsafety edge \no Angle Orientation \nEstimates \no Execution Period of \ncontact rescue  \n Safety Practices \no Environmental \nprotection and \nconcerns \no Good grooming and \npersonal hygiene \no Occupational Safety \nand Health \nStandards \no Buddy and Check-in \nSystem \no Water Checks \no Safety Stops \n Codes and \nRegulations \no Guidelines for Safe \nPool Operation \n Ability to judge \ncondition of a \nvictim at aquatic \nenvironment \n \n Adopt defensive \nposition in \napproaching \nvictim for rescue  \n \n Endurance \nswimming while \ncarrying or towing \na conscious \nvictim with \nbuoyant aid \n \n Encourage victim \nto follow \ninstructions. \n \n Ability to remain \ncalm while doing 