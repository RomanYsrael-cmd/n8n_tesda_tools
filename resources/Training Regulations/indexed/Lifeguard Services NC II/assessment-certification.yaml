    {
      "number": "148",
      "text": "4.2.2 Accredited Assessment Center. Only Assessment Center accredited by TESDA is authorized to conduct competency assessment. Assessment centers undergo a quality assured procedure for accreditation before they are authorized by TESDA to manage the assessment for National Certification. 4.2.3 Accredited Competency Assessor. Only accredited competency assessor is authorized to conduct assessment of competence. Competency assessors undergo a quality assured system of accreditation procedure before they are authorized by TESDA to assess the competencies of candidates for National Certification. 4.2.3.1 Qualification of Competency Assessors For Trainer-Assessor • Holder of National TVET Trainer Certificate Level I (NTTC) on Lifeguard Services NC III with at least 2 years relevant industry experience • Must be computer literate • Must be physically able and mentally fit certified by Public Health Officer For Industry-Assessor • Holder of National Certificate in Lifeguard Services NC III • Holder of Certificate of Competency (COC) in Conduct Competency under the Trainers Methodology Level I (TM I) • Must have at least 4 years relevant industry experience • Must be computer literate • Must be physically able and mentally fit certified by Public Health Officer"
