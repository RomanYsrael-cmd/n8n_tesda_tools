      "number": "4.1",
      "text": "NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS 4.1.1 To attain the National Qualification of LIFEGUARD SERVICES NC II, the candidate must demonstrate competence through a project-type assessment covering in all units listed in Section 1. Successful candidates shall be awarded a National Certificate signed by the TESDA Director General. 4.1.2 Demonstration of competence through project-type assessment covering all the required units of the qualification. 4.1.3 Assessment shall focus on the core units of competency. The basic and common units shall be integrated or assessed concurrently with the core units. 4.1.4 The following are qualified to apply for assessment and certification: 4.1.4.1 Graduates of training programs related to lifeguard services 4.1.4.2 Experienced workers in lifeguard services/industry 4.1.5 Reassessment is allowed only after one month from the date of assessment. Reassessment for a National Certificate shall be done only on the task/s that the candidate did not successfully achieve. 4.1.6 A candidate who fails the assessment for two (2) consecutive times will be required to go through a refresher course before taking another assessment. 4.1.7 Only certified individuals in this Qualification may be nominated by the industry sector for accreditation as competency assessor. 4.1.8 The guidelines on assessment and certification are discussed in detail in the “Procedures Manual on Assessment and Certification” and “Guidelines on the Implementation of the “Philippine TVET Competency Assessment and Certification System (PTCACS)”."
    },
    {
      "number": "4.2",
      "text": "COMPETENCY ASSESSMENT REQUISITE 4.2.1 Self-Assessment Guide. The self-assessment guide (SAG) is accomplished by the candidate prior to actual competency assessment. SAG is a pre-assessment tool to help the candidate and the assessor determine what evidence is available, where gaps exist, including readiness for assessment. This document can: a) Identify the candidate’s skills and knowledge b) Highlight gaps in candidate’s skills and knowledge c) Provide critical guidance to the assessor and candidate on the evidence that need to be presented d) Assist the candidate to identify key areas in which practice is needed or additional information or skills that should be gained prior `"
