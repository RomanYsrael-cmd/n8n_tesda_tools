      "number": "4.2",
      "text": "3.1 Qualification of Competency Assessors For Trainer-Assessor • Holder of National TVET Trainer Certificate Level I (NTTC) on Lifeguard Services NC III with at least 2 years relevant industry experience • Must be computer literate • Must be physically able and mentally fit certified by Public Health Officer For Industry-Assessor • Holder of National Certificate in Lifeguard Services NC III • Holder of Certificate of Competency (COC) in Conduct Competency under the Trainers Methodology Level I (TM I) • Must have at least 4 years relevant industry experience • Must be computer literate • Must be physically able and mentally fit certified by Public Health Officer --- PDF PAGE 153 --- TR – Lifeguard Services NC II (New) Promulgated December 16, 2015 149 Lifeguard Services Sector Demonstrate contact water rescue Perform water- based skills in a pool environment Perform Lifeguarding Scanning Demonstrate non- contact rescue Monitor water quality for swimming Demonstrate water safety Perform resuscitation (CPR + ILCOR + After Care) Provide emergency care (First Aid) Perform lifeguarding hand and whistle signals Participate in workplace communication Practice career professionalism Work in team environment Practice occupational health and safety procedures --- PDF PAGE 154 --- TR – Lifeguard Services NC II (New) Promulgated December 16, 2015 150 Action- Third stage of a rescue; developing a plan and effecting the rescue. Advance Life Support (ALS) - The addition of oxygen and the administering of some drugs as an extension of Basic Life Support (BLS) techniques. AED - Automatic external defibrillator. After care - Fourth stage of a rescue; giving aid until medical teams arrives. Airway - Passage by which air enters and leaves the lungs. ALS - Advance Life Support. Aquacode - Three, easy-to-remember rules of water safety. Armpit tow - A contact tow used for a cooperative weak, tired, or injured casualty. Assessment. - Second stage of rescue; making informed judgments. Assisted Lift - A method used to land an uncooperative casualty from deep water. Awareness - First stage of a rescue; recognizing an emergency accepting responsibility. Back blow - Blow given between the shoulder blades, with the heel of the hand, in the direction of the head. Backstroke - A swimming stroke developed from a back float used in survival, competition and recreation. Basic Life Support (BLS) - The skill which will save life in an emergency. These skills include airway managements, rescue breathing, and cardiac compressions. Since 2006, organizations throughout the world have included understanding of defibrillation as a part of BLS. BLS - Basic Life Support Breaststroke - A swimming stroke used in survival, rescue, competition and recreation. Buoyant - Capable of keeping float. Butterfly - A completive swimming stroke developed from breaststroke. Capsize - To overturn of sink a craft. Cardiac arrest - Cessation of heart beat. Cardiopulmonary Resuscitation (CPR) - Combines rescue breathing and chest compressions. Chest compressions - Compression of the sternum to provide circulation to sustain life Chin lift - The technique of supporting the jaw to prevent the tongue from Blocking the airway. Compact jump - A feet-first entry into deep water from a height of more than one meter. Competency test - Test which requires demonstration of current skill level. CPR - Cardiopulmonary resuscitation. Cross chest tow - A contact tow used to retrieve an unconscious person in rough conditions. Current - Portion of a body of water moving in a certain direction. Defensive position - Position which allows a rescuer to take back away quickly. Danger - Signal word used to indicate an imminently hazardous situation which, if not avoided, will result in death or serious injury. --- PDF PAGE 155 --- TR – Lifeguard Services NC II (New) Promulgated December 16, 2015 151 Deep - Extending far below surface of water and beyond where a person can stand Defibrillation - The use of an electric shock to stop ventricular fibrillation. Defibrillator - An electrical machine which is used to reverse electrical abnormalities in the heart. Double shoulder tow - A contact tow, which permits high head elevation of an unconscious casualty. Drowning - The process of experiencing respiratory impairment from submersion/immersion from liquid. EAR - Expired Air Resuscitation Eddy - Whirlpool in the water created by a current. Eggbeater kick - Powerful trending water technique useful in rescues. Emergency care - The aid given to the injured or suddenly ill by the first person on the scene. Expiration - Breathing out. Extended arm rollover - Method of turning over a face-down person, with a suspected spinal injury, in water shallower than waist depth. First aid - Initial of emergency help given to a casualty. Freestyle - A fast swimming stroke used in competition, survival, rescue and recreation. Hazard - Potential source of harm Head tow - A contact tow using a firm grip on the head used to retrieve an unconscious person. Heat stroke - A severe, life threatening form of heat illness. Heart attack - Damage to heart muscle due to interruption of blood supply. - Heat Escape Lessening Posture. Horizontal - Parallel to the surface of the water. Huddle technique - Small group survival technique using the same principals as the HELP technique. Hydrodynamic lift - The force created by the unequal velocity of fluid flowing past each side of a body which is non-symmetrical to the flow. Hyperthermia - Condition on the body when the core temperature rises above 39 degrees Celsius. Hyperventilation - Excessive oxygenation of the blood resulting a rapid decrease in carbon dioxide. Hypothermia - Occurs when exposure to cold air or cold water causes the body’s core temperature to fall below 35 degrees Celsius. - International Liaison Committee on Resuscitation ILS - International Life Saving Federation Immerse - To place under water. Initiative test - Assessment of a simulated rescue situation. Inspiration - Breathing in. Landing - Any method used to remove a casualty from the water. Lifeguard - Lifesaver, whether voluntary of paid, who has professional responsibility for the safety of others. --- PDF PAGE 156 --- TR – Lifeguard Services NC II (New) Promulgated December 16, 2015 152 Lifesaving - Saving of life through prevention of accident, personal survival and rescue of others. Longitudinal - Along the surface of the water. Near drowning - Survival or a casualty after immersion accident. Oxygen - Gas essential for life and which makes up to 21 per cent of atmospheric air. PFD - Personal flotation device. Piggyback carry - A landing technique where casualty is placed on the rescuer’s back. Propulsion - Any force which drives the body through the water. Pulmonary - Pertaining to or connected to the lungs. Reach rescue - A safe method of rescue where the rescuer reaches with an aid to assist the person in difficulty. Recovery position - Position in which an unconscious casualty is placed to allow observation of breathing and prevent obstruction the airway. Rescue breathing - Blowing air into a casualty’s mouth or nose to maintain life when breathing has stopped. Respiration - The process of using oxygen to obtain energy in cells. Respiratory failure - A person’s breathing becomes inadequate or stops completely. Resuscitation - The preservation or restoration of life by the establishment and/or maintenance of airway, breathing and circulation, and related emergency care. Rip - Fast-flowing body of water moving out to sea. Risk - Combination of the probability of occurrence of harm and the severity of that harm - Royal National Lifeboat Institution of UK Row rescue - A method of rescue where the rescuer uses water craft to get closer to a person in difficulty. Sculling - Movements of the hands, i.e. a curved pattern, through the water to create a propulsive force. Shoulder carry - A landing technique where the casualty is placed over the rescuer’s shoulder. Sidestroke - A swimming stroke used in survival, rescue, competition and recreation. Skill - An ability, usually learned and acquired through training, to perform actions which achieve a desired outcome. Small Craft - Ranged of non- motorized water craft designed for personal use. Snag - An obstacle (e.g. a tree or rock) on the bottom of a waterway forming an impediment or danger to navigation. Snorkel - Tube designed to allow a swimmer to breathe while face down in the water. Spinal cord injury - Damage to the bundle of nerves which extends from the brain to the lower back. Sternum - Flat bone, lying in the front of the chest, to which most of the ribs are attached. Stirrup lift - An assisted lift from deep water when the casualty can cooperate. --- PDF PAGE 157 --- TR – Lifeguard Services NC II (New) Promulgated December 16, 2015 153 Stopper - Suction eddy created in fast-flowing currents on the downstream side of rock formations and artificial structures. Stroke - Damage to the brain due to sudden blockage, or rupture of blood vessel in the brain. Support tow - A contact tow used for a non-breathing unconscious casualty. Survival backstroke - A swimming stroke which is effective for both survival and rescue situations. Swim rescue - An accompanied rescue performed by a competent swimmer. Talk rescue - The safest rescue method, using voice and gestures to assist the Person in difficulty. Throw rescue - A safe method of rescue where the rescuer throws a rope or buoyant aid to assist the person in difficulty. Tidal volume - Volume of gas moved during each respiratory cycle. Tow rescue - A method of rescue. Triage - Where there is more than one casualty, the sorting and allocating of aid on the basis or urgency or need. Turbulence - Current in which the motion of the water at any point is disrupted in magnitude and direction. - United States Lifesaving Association Vertical - Perpendicular (at 90 degrees) to the surface of the water. Vice grip - Method of turning over a face-down person, with a suspected spinal injury, in the water deeper than waist depth. Vice grip tow - A contact tow for an unconscious casualty with a suspected spinal injury. Wade rescue - A method of rescue where the rescuer wades into the water to be able to carry out a reach or throw rescue. Wave - A ridge or swell which forms on the surface of the water. Wrist tow - A contact tow used for a cooperative weak, tired, or injured casualty. --- PDF PAGE 158 --- TR – Lifeguard Services NC II (New) Promulgated December 16, 2015 154 The Technical Education and Skills Development Authority (TESDA) wishes to extend gratitude and appreciation to the many representatives of business, industry, academe and government agencies and labor groups who donated their time and expertise to the development and validation of these Training Regulations. • THE TECHNICAL EXPERT PANEL (TEP) Jose Arne A. Navarra Technical Expert Philippine Life Saving Society Larry Joie S. Alag Technical Expert Philippine Life Saving Society Edcel F. Gaitan Technical Expert Philippine Life Saving Society Visayas Stephen D. Solidarios Technical Expert Philippine Life Saving Society Visayas • THE PARTICIPANTS IN THE NATIONAL VALIDATION OF THIS TRAINING REGULATION: Policarpio M. Calibo PLS Life Saving Center Laguna Charlyn V. Deguit AUP-PLS Life Saving Center Cavite Rommel N. Lumauag PLS Life Saving Center Laguna Jonathan B. Espiritu AUP-PLS Life Saving Center Cavite Geronimo T. Luna Jr. PLS Life Saving Center Laguna Marianne Rezza L. Rodriguez AUP-PLS Life Saving Center Cavite Crispin M. Mariano PLS Life Saving Center Laguna Nimrod S. Salazar AUP-PLS Life Saving Center Cavite Rommel B. Solita Philippines Swimming Inc. Joey Mendoza Lifeguard SOFITEL Philippine Plaza Manila Larsey Guieb Training Manager SOFITEL Philippine Plaza Manila Members of the TESDA Board The MANAGEMENT and STAFF of the TESDA Secretariat TESDA - Qualifications and Standards Office (QSO) --- PDF PAGE 159 --- TR – Lifeguard Services NC II (New) Promulgated December 16, 2015 155 Training Regulation are available in both printed and electronic copies For more information please contact: TECHNICAL EDUCATION AND SKILLS DEVELOPMENT AUTHORITY (TESDA) Telephone Nos.:817-4076 to 82 loc. 163 / 164 Tele Fax No.:818-7728 or visit our website: www.tesda.gov.ph"
