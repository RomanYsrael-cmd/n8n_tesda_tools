      "number": "4.1",
      "text": "1 To attain the National Qualification of LIFEGUARD SERVICES NC II, the candidate must demonstrate competence through a project-type assessment covering in all units listed in Section 1. Successful candidates shall be awarded a National Certificate signed by the TESDA Director General."
    },
