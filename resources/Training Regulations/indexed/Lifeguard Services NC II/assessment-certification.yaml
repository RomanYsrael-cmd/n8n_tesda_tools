  "source_text": "SECTION 4 ASSESSMENT AND CERTIFICATION ARRANGEMENT\n\nCompetency Assessment is the process of collecting evidence and making judgments\nwhether competency has been achieved. The purpose of assessment is to confirm that an individual\ncan perform to the standards expected at the workplace as expressed in relevant competency\nstandards.\n\nThe assessment process is based on evidence or information gathered to prove\nachievement of competencies. The process may be applied to an employable unit(s) of\ncompetency in partial fulfillment of the requirements of the national qualification.\n\n4.1. NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n4.1.1 To attain the National Qualification of LIFEGUARD SERVICES NC II, the\ncandidate must demonstrate competence through a project-type assessment\ncovering in all units listed in Section 1. Successful candidates shall be awarded a\nNational Certificate signed by the TESDA Director General.\n4.1.2 Demonstration of competence through project-type assessment covering all the\nrequired units of the qualification.\n\n4.1.3 Assessment shall focus on the core units of competency. The basic and common\nunits shall be integrated or assessed concurrently with the core units.\n4.1.4 The following are qualified to apply for assessment and certification:\n4.1.4.1 Graduates of training programs related to lifeguard services\n4.1.4.2 Experienced workers in lifeguard services/industry\n4.1.5 Reassessment is allowed only after one month from the date of assessment.\nReassessment for a National Certificate shall be done only on the task/s that the\ncandidate did not successfully achieve.\n4.1.6 A candidate who fails the assessment for two (2) consecutive times will be\nrequired to go through a refresher course before taking another assessment.\n4.1.7 Only certified individuals in this Qualification may be nominated by the industry\nsector for accreditation as competency assessor.\n4.1.8 The guidelines on assessment and certification are discussed in detail in the\n“Procedures Manual on Assessment and Certification” and “Guidelines on the\nImplementation of the “Philippine TVET Competency Assessment and Certification\nSystem (PTCACS)”.\n\n4.2. COMPETENCY ASSESSMENT REQUISITE\n\n4.2.1 Self-Assessment Guide. The self-assessment guide (SAG) is accomplished by the\ncandidate prior to actual competency assessment. SAG is a pre-assessment tool to\nhelp the candidate and the assessor determine what evidence is available, where\ngaps exist, including readiness for assessment.\nThis document can:\na)\nIdentify the candidate’s skills and knowledge\nb)\nHighlight gaps in candidate’s skills and knowledge\nc)\nProvide critical guidance to the assessor and candidate on the evidence that need\nto be presented\nd)\nAssist the candidate to identify key areas in which practice is needed or additional\ninformation or skills that should be gained prior `\n\n--- PDF PAGE 152 ---\nTR – Lifeguard Services NC II (New) Promulgated December 16, 2015\n 148\n4.2.2 Accredited Assessment Center. Only Assessment Center accredited by TESDA is\nauthorized to conduct competency assessment. Assessment centers undergo a\nquality assured procedure for accreditation before they are authorized by TESDA to\nmanage the assessment for National Certification.\n4.2.3 Accredited Competency Assessor. Only accredited competency assessor is\nauthorized to conduct assessment of competence. Competency assessors undergo\na quality assured system of accreditation procedure before they are authorized by\nTESDA to assess the competencies of candidates for National Certification.\n4.2.3.1 Qualification of Competency Assessors\n\nFor Trainer-Assessor\n• Holder of National TVET Trainer Certificate Level I (NTTC) on Lifeguard\nServices NC III with at least 2 years relevant industry experience\n• Must be computer literate\n• Must be physically able and mentally fit certified by Public Health Officer\n\nFor Industry-Assessor\n• Holder of National Certificate in Lifeguard Services NC III\n• Holder of Certificate of Competency (COC) in Conduct Competency\nunder the Trainers Methodology Level I (TM I)\n• Must have at least 4 years relevant industry experience\n• Must be computer literate\n• Must be physically able and mentally fit certified by Public Health Officer\n\n--- PDF PAGE 153 ---\nTR – Lifeguard Services NC II (New) Promulgated December 16, 2015\n 149\nANNEX A\n\nCOMPETENCY MAP\nLifeguard Services Sector\n\nDemonstrate contact\nwater rescue\n\nPerform water- based\nskills in a pool\nenvironment\n\nPerform Lifeguarding\nScanning\n\nDemonstrate non-\ncontact rescue\nCORE\nCOMPETENCIES\n\nMonitor water quality\nfor swimming\n\nDemonstrate water\nsafety\nCOMMON\nCOMPETENCIES\nPerform\nresuscitation\n(CPR + ILCOR +\nAfter Care)\n\nProvide emergency\ncare (First Aid)\nPerform\nlifeguarding hand\nand whistle\nsignals\nBASIC\nCOMPETENCIES\n\nParticipate in\nworkplace\ncommunication\n\nPractice career\nprofessionalism\n\nWork in team\nenvironment\n\nPractice occupational\nhealth and safety\nprocedures\n\n--- PDF PAGE 154 ---\nTR – Lifeguard Services NC II (New) Promulgated December 16, 2015\n 150\nGLOSSARY OF TERMS\n\nAction-\nThird stage of a rescue; developing a plan and effecting the rescue.\nAdvance Life Support\n (ALS)\n- The addition of oxygen and the administering of some drugs as an\nextension of Basic Life Support (BLS) techniques.\nAED\n- Automatic external defibrillator.\nAfter care\n- Fourth stage of a rescue; giving aid until medical teams arrives.\nAirway\n- Passage by which air enters and leaves the lungs.\nALS\n- Advance Life Support.\nAquacode\n- Three, easy-to-remember rules of water safety.\nArmpit tow\n- A contact tow used for a cooperative weak, tired, or injured casualty.\nAssessment.\n- Second stage of rescue; making informed judgments.\nAssisted Lift\n- A method used to land an uncooperative casualty from deep water.\nAwareness\n- First stage of a rescue; recognizing an emergency accepting\nresponsibility.\nBack blow\n- Blow given between the shoulder blades, with the heel of the hand,\nin the direction of the head.\nBackstroke\n- A swimming stroke developed from a back float used in survival,\ncompetition and recreation.\nBasic Life Support (BLS) - The skill which will save life in an emergency. These skills include\nairway managements, rescue breathing, and cardiac compressions.\nSince 2006, organizations throughout the world have included\nunderstanding of defibrillation as a part of BLS.\nBLS\n- Basic Life Support\nBreaststroke\n- A swimming stroke used in survival, rescue, competition and\nrecreation.\nBuoyant\n- Capable of keeping float.\nButterfly\n- A completive swimming stroke developed from breaststroke.\nCapsize\n- To overturn of sink a craft.\nCardiac arrest\n- Cessation of heart beat.\nCardiopulmonary\n Resuscitation (CPR) - Combines rescue breathing and chest compressions.\nChest compressions - Compression of the sternum to provide circulation to sustain life\nChin lift\n- The technique of supporting the jaw to prevent the tongue from\nBlocking the airway.\nCompact jump\n- A feet-first entry into deep water from a height of more than one\nmeter.\nCompetency test\n- Test which requires demonstration of current skill level.\nCPR\n- Cardiopulmonary resuscitation.\nCross chest tow\n- A contact tow used to retrieve an unconscious person in rough\nconditions.\nCurrent\n- Portion of a body of water moving in a certain direction.\nDefensive position\n- Position which allows a rescuer to take back away quickly.\nDanger\n- Signal word used to indicate an imminently hazardous situation\nwhich, if not avoided, will result in death or serious injury.\n\n--- PDF PAGE 155 ---\nTR – Lifeguard Services NC II (New) Promulgated December 16, 2015\n 151\nDeep\n- Extending far below surface of water and beyond where a person\ncan stand\nDefibrillation\n- The use of an electric shock to stop ventricular fibrillation.\nDefibrillator\n- An electrical machine which is used to reverse electrical\nabnormalities in the heart.\nDouble shoulder tow - A contact tow, which permits high head elevation of an unconscious\ncasualty.\nDrowning\n- The\nprocess\nof\nexperiencing\nrespiratory\nimpairment\nfrom\nsubmersion/immersion from liquid.\nEAR\n- Expired Air Resuscitation\nEddy\n- Whirlpool in the water created by a current.\nEggbeater kick\n- Powerful trending water technique useful in rescues.\nEmergency care\n- The aid given to the injured or suddenly ill by the first person on the\nscene.\nExpiration\n- Breathing out.\nExtended arm rollover - Method of turning over a face-down person, with a suspected spinal\ninjury, in water shallower than waist depth.\nFirst aid\n- Initial of emergency help given to a casualty.\nFreestyle\n- A fast swimming stroke used in competition, survival, rescue and\nrecreation.\nHazard\n- Potential source of harm\nHead tow\n- A contact tow using a firm grip on the head used to retrieve an\nunconscious person.\nHeat stroke\n- A severe, life threatening form of heat illness.\nHeart attack\n- Damage to heart muscle due to interruption of blood supply.\nHELP\n- Heat Escape Lessening Posture.\nHorizontal\n- Parallel to the surface of the water.\nHuddle technique\n- Small group survival technique using the same principals as the\nHELP technique.\nHydrodynamic lift\n- The force created by the unequal velocity of fluid flowing past each\nside of a body which is non-symmetrical to the flow.\nHyperthermia\n- Condition on the body when the core temperature rises above 39\ndegrees Celsius.\nHyperventilation\n- Excessive oxygenation of the blood resulting a rapid decrease in\ncarbon dioxide.\nHypothermia\n- Occurs when exposure to cold air or cold water causes the body’s\ncore temperature to fall below 35 degrees Celsius.\nILCOR\n- International Liaison Committee on Resuscitation\nILS\n- International Life Saving Federation\nImmerse\n- To place under water.\nInitiative test\n- Assessment of a simulated rescue situation.\nInspiration\n- Breathing in.\nLanding\n- Any method used to remove a casualty from the water.\nLifeguard\n- Lifesaver, whether voluntary of paid, who has professional\nresponsibility for the safety of others.\n\n--- PDF PAGE 156 ---\nTR – Lifeguard Services NC II (New) Promulgated December 16, 2015\n 152\nLifesaving\n- Saving of life through prevention of accident, personal survival and\nrescue of others.\nLongitudinal\n- Along the surface of the water.\nNear drowning\n- Survival or a casualty after immersion accident.\nOxygen\n- Gas essential for life and which makes up to 21 per cent of\natmospheric air.\nPFD\n- Personal flotation device.\nPiggyback carry\n- A landing technique where casualty is placed on the rescuer’s back.\nPropulsion\n- Any force which drives the body through the water.\nPulmonary\n- Pertaining to or connected to the lungs.\nReach rescue\n- A safe method of rescue where the rescuer reaches with an aid to\nassist the person in difficulty.\nRecovery position\n- Position in which an unconscious casualty is placed to allow\nobservation of breathing and prevent obstruction the airway.\nRescue breathing\n- Blowing air into a casualty’s mouth or nose to maintain life when\nbreathing has stopped.\nRespiration\n- The process of using oxygen to obtain energy in cells.\nRespiratory failure\n- A person’s breathing becomes inadequate or stops completely.\nResuscitation\n- The preservation or restoration of life by the establishment and/or\nmaintenance of airway, breathing and circulation, and related\nemergency care.\nRip\n- Fast-flowing body of water moving out to sea.\nRisk\n- Combination of the probability of occurrence of harm and the\nseverity of that harm\nRNLI\n- Royal National Lifeboat Institution of UK\nRow rescue\n- A method of rescue where the rescuer uses water craft to get closer\nto a person in difficulty.\nSculling\n- Movements of the hands, i.e. a curved pattern, through the water to\ncreate a propulsive force.\nShoulder carry\n- A landing technique where the casualty is placed over the rescuer’s\nshoulder.\nSidestroke\n- A swimming stroke used in survival, rescue, competition and\nrecreation.\nSkill\n- An ability, usually learned and acquired through training, to perform\nactions which achieve a desired outcome.\nSmall Craft\n- Ranged of non- motorized water craft designed for personal use.\nSnag\n- An obstacle (e.g. a tree or rock) on the bottom of a waterway\nforming an impediment or danger to navigation.\nSnorkel\n- Tube designed to allow a swimmer to breathe while face down in the\nwater.\nSpinal cord injury\n- Damage to the bundle of nerves which extends from the brain to the\nlower back.\nSternum\n- Flat bone, lying in the front of the chest, to which most of the ribs are\nattached.\nStirrup lift\n- An assisted lift from deep water when the casualty can cooperate.\n\n--- PDF PAGE 157 ---\nTR – Lifeguard Services NC II (New) Promulgated December 16, 2015\n 153\nStopper\n- Suction eddy created in fast-flowing currents on the downstream\nside of rock formations and artificial structures.\nStroke\n- Damage to the brain due to sudden blockage, or rupture of blood\nvessel in the brain.\nSupport tow\n- A contact tow used for a non-breathing unconscious casualty.\nSurvival backstroke\n- A swimming stroke which is effective for both survival and rescue\nsituations.\nSwim rescue\n- An accompanied rescue performed by a competent swimmer.\nTalk rescue\n- The safest rescue method, using voice and gestures to assist the\nPerson in difficulty.\nThrow rescue\n- A safe method of rescue where the rescuer throws a rope or\nbuoyant aid to assist the person in difficulty.\nTidal volume\n- Volume of gas moved during each respiratory cycle.\nTow rescue\n- A method of rescue.\nTriage\n- Where there is more than one casualty, the sorting and allocating of\naid on the basis or urgency or need.\nTurbulence\n- Current in which the motion of the water at any point is disrupted in\nmagnitude and direction.\nUSLA\n- United States Lifesaving Association\nVertical\n- Perpendicular (at 90 degrees) to the surface of the water.\nVice grip\n- Method of turning over a face-down person, with a suspected spinal\ninjury, in the water deeper than waist depth.\nVice grip tow\n- A contact tow for an unconscious casualty with a suspected spinal\ninjury.\nWade rescue\n- A method of rescue where the rescuer wades into the water to be\nable to carry out a reach or throw rescue.\nWave\n- A ridge or swell which forms on the surface of the water.\nWrist tow\n- A contact tow used for a cooperative weak, tired, or injured casualty.\n\n--- PDF PAGE 158 ---\nTR – Lifeguard Services NC II (New) Promulgated December 16, 2015\n 154\nACKNOWLEDGEMENTS\n\nThe Technical Education and Skills Development Authority (TESDA) wishes to extend\ngratitude and appreciation to the many representatives of business, industry, academe and\ngovernment agencies and labor groups who donated their time and expertise to the development\nand validation of these Training Regulations.\n\n•\nTHE TECHNICAL EXPERT PANEL (TEP)\n\nJose Arne A. Navarra\nTechnical Expert\nPhilippine Life Saving Society\nLarry Joie S. Alag\nTechnical Expert\nPhilippine Life Saving Society\n\nEdcel F. Gaitan\nTechnical Expert\nPhilippine Life Saving Society\nVisayas\n\nStephen D. Solidarios\nTechnical Expert\nPhilippine Life Saving Society\nVisayas\n\n•\nTHE PARTICIPANTS IN THE NATIONAL VALIDATION OF THIS TRAINING REGULATION:\n\nPolicarpio M. Calibo\nPLS Life Saving Center\nLaguna\n\nCharlyn V. Deguit\nAUP-PLS Life Saving Center\nCavite\n\nRommel N. Lumauag\nPLS Life Saving Center\nLaguna\n\nJonathan B. Espiritu\nAUP-PLS Life Saving Center\nCavite\n\nGeronimo T. Luna Jr.\nPLS Life Saving Center\nLaguna\n\nMarianne Rezza L. Rodriguez\nAUP-PLS Life Saving Center\nCavite\n\nCrispin M. Mariano\nPLS Life Saving Center\nLaguna\n\nNimrod S. Salazar\nAUP-PLS Life Saving Center\nCavite\n\nRommel B. Solita\nPhilippines Swimming Inc.\n\nJoey Mendoza\nLifeguard\nSOFI