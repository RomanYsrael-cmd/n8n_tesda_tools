      "text": "NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS 4.1.1 A National Certificate (NC) is issued to a candidate after a successful full qualification assessment covering all the units of competency that comprise the Training Regulations for Food and Beverage Services NC IV as stated in Section 1. 4.1.2 Candidates wanting to be certified will have to be assessed in accordance with the requirements identified in the evidence guide of the relevant unit/s of competency. 4.1.3 Candidates applying for competency assessment and certification for Food and Beverage Services NC IV: 4.1.3.1 Graduates of formal, non-formal and informal institutions including enterprise-based training programs related to food and beverage; 4.1.3.2 Industry workers (employed, self-employed or owners/ proprietors) 4.1.4 Portfolio assessment may be applicable for industry workers with at least five (5) years of experience as headwaiter / captain waiter or its equivalent."
