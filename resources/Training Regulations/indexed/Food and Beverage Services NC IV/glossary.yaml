      "definition": "17. Function sheet- document that outlines the details of an event ; it serves as a guideline for the hotel or restaurant to execute and communicate logistics to all necessary departments. 18. Function style-the nature of event or banquet that requires food and beverage service. 19. Informal feedback- the in-the moment advice outside of the formal performance review. 20. Liaise- establish a working relationship, typically in order to cooperate on a matter of mutual concern. 21. Literacy skill- the skills needed for reading and writing. They include such things as awareness of the sounds of language, awareness of print and the relationship between letters and sounds. Other literacy skills include vocabulary, spelling, and comprehension 22. Marketing- the action or business of promoting and selling products or services, including market research and advertising. 23. Market intelligence- the information relevant to a company's markets, gathered and analyzed specifically for the purpose of accurate and confident decision- making in determining strategy in areas such as market opportunity, market penetration strategy, and market development. 24. Marketing plan- is a comprehensive blueprint which outlines an organization's overall marketing efforts. 25. On-Premise-refers to the venue of the function that is usually inside a hotel. 26. Off-Premise-refers to the venue of the function that is usually in any available area except inside the hotel. 27. POS (Point of Sale)-a computer software that is used in processing food and beverage orders, bills and other necessary reports essential in managing an outlet. 28. Potential revenue- the possible amount of money that a company actually receives during a specific period; possible gross income 29. Proposal - a formal offer to do work/provide products &services for someone or a business 30. Prospects- people who are potential customer, client, etc 31. Request for Tender/Proposal - a document from a person or business asking you to tender for the provision of identified products and services FOOD AND BEVERAGE SERVICES NC IV Revision 01 Promulgated (10/29/2018) 168 32. Risk management standards- the standards in forecasting and evaluating the financial risks together with the identification of procedures to avoid or minimize their impact 33. Roster-list of employees with their assigned job or task schedules. 34. Running sheet- a list of every task that needs to be done for an event: it is set up in the order the tasks will begin. 35. Sales activities- initiatives and actions to increase the revenue of a food service facility. 36. Sales calls- pre-arranged and face-to-face meeting between a salesperson and a customer or prospect for the purpose of generating a sale. 37. Sales meeting- gathering in which a product or service is being discussed, and the benefits are outlined to the potential buyer; not always a presentation format; it can sometimes be an informal conversation, phone call or online affair to promote products and services to prospects. 38. Sales report- record of calls made and products sold during a particular time frame kept by a salesperson or their management. 39. Self-management skill- defined as the personal application of behavior change tactics that produces a desired change in behavior. The term self-control is also used to refer to this type of behavior change program. 40. Service levels- measure the performance of a system; certain goals are defined and the service level gives the percentage to which those goals should be achieved 41. Service points-areas where the actual pick-up of food after production are located 42. Service stations-the areas where the wait staff place the necessary and extra supplies such as table wares for re-setting and sometimes beverages for re- filling. 43. Service style-the manner of serving food from the production area to dining area. 44. Sustainability issues-issues on activities in meeting the present and future business supplies of products or services, including reducing waste, reusing supplies or recycling. 45. Tender - proposal FOOD AND BEVERAGE SERVICES NC IV Revision 01 Promulgated (10/29/2018) 169 46. Training skill- teaching, or developing in oneself or others, any skills and knowledge that relate to specific useful competencies usually to improving one's capability, capacity, productivity and performance. 47. Variable Costs - costs associated with expenditure which varies with levels/volume of production"
