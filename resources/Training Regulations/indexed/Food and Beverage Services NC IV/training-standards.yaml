    "source_text": "3.1\nCURRICULUM DESIGN\n\nTESDA shall provide the training on the development of competency-based\ncurricula to enable training providers develop their own curricula with the components\nmentioned below.\n\nDelivery of knowledge requirements for the basic, common and core units of\ncompetency\nspecifically\nin\nthe\nareas\nof\nmathematics,\nscience/technology,\ncommunication/language and other academic subjects shall be contextualized. To this\nend, TVET providers shall develop a Contextual Learning Matrix (CLM) to accompany their\ncurricula.\n\nCourse Title: FOOD AND BEVERAGE SERVICES\nNC Level: IV\n\nNominal Training Duration: 47 Hours (Basic)\n\n 190 Hours (Common)\n\n 155 Hours (Core)\n\n 392 Hours\n\nCourse Description:\nThis course is designed to enhance the knowledge, skills, and attitudes in\naccordance with industry standards. This covers competencies that a person must\nachieve in performing task such as managing food and beverage service team, overseeing\ndining area operations, implementing food and beverage promotional activities and\norganizing catering functions.\n\nUpon completion of the course, the learners are expected to demonstrate the\nabove-mentioned competencies to be employed. To obtain this, all units prescribed for this\nqualification must be achieved.\n\n--- PDF PAGE 120 ---\nDRAFT\n\nFOOD AND BEVERAGE SERVICES NC IV Revision 01 Promulgated (10/29/2018) 116\n\nBASIC COMPETENCIES\n(47 Hours)\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nMethod\nNominal\nDuration\n1. Utilize\nspecialized\ncommunication\nskills\n\n1.1 Meet common and\nspecific\ncommunication\nneeds of clients\nand colleagues\n\n• Read\n➢\nCommunication process\n➢\nDynamics of groups and\ndifferent styles of group\nleadership\n• Identify different approaches to meet the\nneeds of clients and colleagues\n• Lecture\n• Written\nexamination\n1 Hour\n1.2. Contribute to the\ndevelopment of\ncommunication\nstrategies\n• Apply communication skills to fulfill job\nroles as specified by the organization\n• Apply communication techniques in\ncommunicating with clients and\ncolleagues\n➢\nActive listening\n➢\nFeedback\n➢\nInterpretation\n➢\nRole boundaries setting\n➢\nNegotiation\n➢\nEstablishing empathy\n• Describe strategies for internal and\nexternal dissemination of information\n• Demonstration\n• Group discussion\n• Observation\n• Oral evaluation\n1 Hour\n1.3. Deliver a technical\npresentation\n• Enhance the presentation using\nappropriate media\n• Deliver a clear and sequential\npresentation within given time\n• Demonstration\n• Observation\n1 Hour\n\n--- PDF PAGE 121 ---\nDRAFT\n\nFOOD AND BEVERAGE SERVICES NC IV Revision 01 Promulgated (10/29/2018) 117\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nMethod\nNominal\nDuration\n\n1.2. Represent the\norganization\n\n• Describe criteria for a good presentation\n• Prepare presentation material for internal\nor external forums to promote the\norganization\n• Demonstration\n• Observation\n1 Hour\n1.3. Facilitate group\ndiscussion\n• Gather relevant information\n• Apply values in facilitating differences in\nviews\n• Demonstration\n• Observation\n1 Hour\n1.4. Conduct interview\n• Describe communication strategies\nemployed in interview situations\n• Conduct interview\n• Apply organizations procedure in\nmaintaining records of interviews\n• Use questioning, listening and nonverbal\ncommunication techniques to client\ngroups\n• Group discussion\n• Demonstration\n• Oral evaluation\n• Observation\n1 Hour\n2. Develop and\nlead teams\n2.1 Foster individual\ngrowth\n\n• Discussion on Team Leadership and\nexpectation from team leaders\n• Case study on learning and development\nneeds of team members\n• Discussion on organizational\nrequirements from team members\n• Role play on coaching and mentoring\n• Discussion on preparation of team\nmembers development plan\n• Role Play on providing feedback on\nperformance\n•\nObservation\nLecture/\nDiscussion\n•\nCase Study\n•\nRole Play\n•\nRole Play\n•\nCase Study\n•\nWritten Test\n• Observation\n• Role Play\n• Case Study\n▪ Written Test\n2 Hours\n\n--- PDF PAGE 122 ---\nDRAFT\n\nFOOD AND BEVERAGE SERVICES NC IV Revision 01 Promulgated (10/29/2018) 118\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nMethod\nNominal\nDuration\n2.2 Foster individual\nand team growth\n• Discussion on learning and development\nprogram goal setting\n• Preparation of learning and development\nprogram goals\n• Discussion on learning delivery methods\n• Role play on the different learning\ndelivery methods\n• Discussion on workplace learning\nopportunities\n• Role play on coaching and mentoring\n• Lecture/ Discussion\n• Case Study\n• Role Play\n• Observation\n• Role Play\n• Case Study\n• Written Test\n2 Hours\n\n2.3 Monitor and\nevaluate workplace\nlearning\n•\nDiscussion on the different levels of\nlearning evaluation.\n•\nDiscussion on the different methods\nused to evaluate learning\n•\nDevelop reporting system for\nmonitoring of performance attributed\nto learning programs\n•\nGathering of information to evaluate\nindividual performance attributed to\nlearning programs\n•\nCase study on modification of\nlearning plan based on performance\n• Lecture/ Discussion\n• Case Study\nRole Play\n• Observation\n• Role Play\n• Case Study\n• Written Test\n2 Hours\n\n--- PDF PAGE 123 ---\nDRAFT\n\nFOOD AND BEVERAGE SERVICES NC IV Revision 01 Promulgated (10/29/2018) 119\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nMethod\nNominal\nDuration\n\n2.4 Develop team\ncommitment and\ncooperation\n• Discussion on team commitment and\ncooperation and its impact to attainment\nof goals\n• Play games on team commitment and\ncooperation\n• Discussion on team dynamics and its\nrelation to team performance\n• Play games on team dynamics and\nperformance\n• Development of career plans\n\n• L