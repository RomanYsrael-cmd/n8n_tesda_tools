      "source_text": "TESDA shall provide the training on the development of competency-based\ncurricula to enable training providers develop their own curricula with the components\nmentioned below.\n\nDelivery of knowledge requirements for the basic, common and core units of\ncompetency\nspecifically\nin\nthe\nareas\nof\nmathematics,\nscience/technology,\ncommunication/language and other academic subjects shall be contextualized. To this\nend, TVET providers shall develop a Contextual Learning Matrix (CLM) to accompany their\ncurricula.\n\nCourse Title: FOOD AND BEVERAGE SERVICES\nNC Level: IV\n\nNominal Training Duration: 47 Hours (Basic)\n\n 190 Hours (Common)\n\n 155 Hours (Core)\n\n 392 Hours\n\nCourse Description:\nThis course is designed to enhance the knowledge, skills, and attitudes in\naccordance with industry standards. This covers competencies that a person must\nachieve in performing task such as managing food and beverage service team, overseeing\ndining area operations, implementing food and beverage promotional activities and\norganizing catering functions.\n\nUpon completion of the course, the learners are expected to demonstrate the\nabove-mentioned competencies to be employed. To obtain this, all units prescribed for this\nqualification must be achieved.\n\n--- PDF PAGE 120 ---\nDRAFT\n\nFOOD AND BEVERAGE SERVICES NC IV Revision 01 Promulgated (10/29/2018) 116\n\nBASIC COMPETENCIES\n(47 Hours)\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nMethod\nNominal\nDuration\n1. Utilize\nspecialized\ncommunication\nskills\n\n1.1 Meet common and\nspecific\ncommunication\nneeds of clients\nand colleagues\n\n• Read\n➢\nCommunication process\n➢\nDynamics of groups and\ndifferent styles of group\nleadership\n• Identify different approaches to meet the\nneeds of clients and colleagues\n• Lecture\n• Written\nexamination\n1 Hour\n1.2. Contribute to the\ndevelopment of\ncommunication\nstrategies\n• Apply communication skills to fulfill job\nroles as specified by the organization\n• Apply communication techniques in\ncommunicating with clients and\ncolleagues\n➢\nActive listening\n➢\nFeedback\n➢\nInterpretation\n➢\nRole boundaries setting\n➢\nNegotiation\n➢\nEstablishing empathy\n• Describe strategies for internal and\nexternal dissemination of information\n• Demonstration\n• Group discussion\n• Observation\n• Oral evaluation\n1 Hour\n1.3. Deliver a technical\npresentation\n• Enhance the presentation using\nappropriate media\n• Deliver a clear and sequential\npresentation within given time\n• Demonstration\n• Observation\n1 Hour\n\n--- PDF PAGE 121 ---\nDRAFT\n\nFOOD AND BEVERAGE SERVICES NC IV Revision 01 Promulgated (10/29/2018) 117\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nMethod\nNominal\nDuration\n\n1.2. Represent the\norganization\n\n• Describe criteria for a good presentation\n• Prepare presentation material for internal\nor external forums to promote the\norganization\n• Demonstration\n• Observation\n1 Hour\n1.3. Facilitate group\ndiscussion\n• Gather relevant information\n• Apply values in facilitating differences in\nviews\n• Demonstration\n• Observation\n1 Hour\n1.4. Conduct interview\n• Describe communication strategies\nemployed in interview situations\n• Conduct interview\n• Apply organizations procedure in\nmaintaining records of interviews\n• Use questioning, listening and nonverbal\ncommunication techniques to client\ngroups\n• Group discussion\n• Demonstration\n• Oral evaluation\n• Observation\n1 Hour\n2. Develop and\nlead teams\n2.1 Foster individual\ngrowth\n\n• Discussion on Team Leadership and\nexpectation from team leaders\n• Case study on learning and development\nneeds of team members\n• Discussion on organizational\nrequirements from team members\n• Role play on coaching and mentoring\n• Discussion on preparation of team\nmembers development plan\n• Role Play on providing feedback on\nperformance\n•\nObservation\nLecture/\nDiscussion\n•\nCase Study\n•\nRole Play\n•\nRole Play\n•\nCase Study\n•\nWritten Test\n• Observation\n• Role Play\n• Case Study\n▪ Written Test\n2 Hours\n\n--- PDF PAGE 122 ---\nDRAFT\n\nFOOD AND BEVERAGE SERVICES NC IV Revision 01 Promulgated (10/29/2018) 118\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nMethod\nNominal\nDuration\n2.2 Foster individual\nand team growth\n• Discussion on learning and development\nprogram goal setting\n• Preparation of learning and development\nprogram goals\n• Discussion on learning delivery methods\n• Role play on the different learning\ndelivery methods\n• Discussion on workplace learning\nopportunities\n• Role play on coaching and mentoring\n• Lecture/ Discussion\n• Case Study\n• Role Play\n• Observation\n• Role Play\n• Case Study\n• Written Test\n2 Hours\n\n2.3 Monitor and\nevaluate workplace\nlearning\n•\nDiscussion on the different levels of\nlearning evaluation.\n•\nDiscussion on the different methods\nused to evaluate learning\n•\nDevelop reporting system for\nmonitoring of performance attributed\nto learning programs\n•\nGathering of information to evaluate\nindividual performance attributed to\nlearning programs\n•\nCase study on modification of\nlearning plan based on performance\n• Lecture/ Discussion\n• Case Study\nRole Play\n• Observation\n• Role Play\n• Case Study\n• Written Test\n2 Hours\n\n--- PDF PAGE 123 ---\nDRAFT\n\nFOOD AND BEVERAGE SERVICES NC IV Revision 01 Promulgated (10/29/2018) 119\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nMethod\nNominal\nDuration\n\n2.4 Develop team\ncommitment and\ncooperation\n• Discussion on team commitment and\ncooperation and its impact to attainment\nof goals\n• Play games on team commitment and\ncooperation\n• Discussion on team dynamics and its\nrelation to team performance\n• Play games on team dynamics and\nperformance\n• Development of career plans\n\n• Lecture/ Discussion\n• Case Study\n• Role Play\n• Observation\n• Role Play\n• Case Study\n• Written Test\n1 Hour\n\n2.5 Facilitate\naccomplishment of\nteam goals\n• Perform team building activities towards\nimproving communication among team\nmembers, goal setting and improving\nperformance\n• Case studies involving collaborative\nactivities to improve attainment of group\ngoals\n• Group Activity\n• Case Study\n\n• Role Play\n• Case Study\n• Observation\n1 Hour\n\n--- PDF PAGE 124 ---\nDRAFT\n\nFOOD AND BEVERAGE SERVICES NC IV Revision 01 Promulgated (10/29/2018) 120\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nMethod\nNominal\nDuration\n3. Perform\nhigher-order\nthinking\nprocesses and\napply\ntechniques in\nthe workplace\n3.1 Evaluate\neffectiveness and\nefficiency of the\nworkplace systems,\nprocesses and\nprocedures\n• Examine current systems, standards,\nprocedures and protocols in the\nworkplace\n• Discuss different methods of critical and\nappreciative inquiry and their relevance\nto different situations\n• Form habit of asking questions and\ntaking responsibility for answers\n• Appreciate importance of why questions\nfor individuals, businesses and\ncommunities\n• Use range of analytical techniques\n• Examine different strategies and\ntechniques in communicating results,\napplying critical thinking pathway,\nassessing effectiveness and efficiency\nof systems, processes and procedures\n\n• Group discussion\n• Lecture\n• Demonstration\n• Role playing\n• Case Formulation\n• Life Narrative\nInquiry (Interview)\n• Standardized test\n1 Hour\n\n--- PDF PAGE 125 ---\nDRAFT\n\nFOOD AND BEVERAGE SERVICES NC IV Revision 01 Promulgated (10/29/2018) 121\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nMethod\nNominal\nDuration\n\n3.2 Foster the habit of\ncritical inquiry and\ncuriosity in the\nworkplace\n• Discuss different methods of critical and\nappreciative inquiry and their relevance\nto different situations\n• Form habit of asking questions and\ntaking responsibility for answers\n• Appreciate importance of why questions\nfor individuals, businesses and\ncommunities\n• Use range of analytical techniques,\ngrowth mindset and positive\ncommunication strategies\n• Examine different strategies and\ntechniques in communicating results,\napplying critical thinking pathway,\nassessing effectiveness and efficiency of\nsystems, processes and procedures\n• Discuss insights on workplace\neffectiveness and efficiency\n• Group discussion\n• Lecture\n• Demonstration\n• Role playing\n• Case\nFormulation\n• Life Narrative\nInquiry\n(Interview)\n• Standardized\ntest\n1 Hour\n\n3.3 Develop practical\naction plans for\nimproving\nworkplace\nconditions\n• Use range of analytical techniques,\ngrowth mindset and positive\ncommunication strategies in developing\naction plans for efficiency and\neffectiveness\n• Examine different strategies and\ntechniques in communicating results,\napplying critical thinking pathway,\nassessing effectiveness and efficiency of\nsystems, processes and procedures\n• Discuss concepts creative negotiation\nskills, change management and\nimprovement strategies\n• Group discussion\n• Lecture\n• Demonstration\n• Role playing\n• Case\nFormulation\n• Life Narrative\nInquiry\n(Interview)\n• Standardized\ntest\n• Project-based\nlearning\n2 Hours\n\n--- PDF PAGE 126 ---\nDRAFT\n\nFOOD AND BEVERAGE SERVICES NC IV Revision 01 Promulgated (10/29/2018) 122\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nMethod\nNominal\nDuration\n4. Contribute to\nthe practice of\nsocial justice in\nthe workplace\n\n4.1 Update self on\nlocal, national and\nglobal trends/\nissues in the\nworkplace\n• Explain the local, national and global\nsystems and structures\n• Discuss issues affecting interaction and\nconnectedness of communities at local,\nnational and global levels\n• Explain underlying assumptions and\npower dynamics (politics, understanding\npolitical system, social structures, labor\nlaws, labor relations, human right)\n• Monitor trends and issues relevant to\nhuman rights, gender equality, culture of\npeace, global citizenship, and cultural\ndiversity using different media platforms\n• Analyze trends and issues relevant to\nhuman rights, gender equality, culture of\npeace, global citizenship, and cultural\ndiversity\n• Engage in discourse about the local,\nnational and global issues\n• Interactive Lecture\n• Small Group\nDiscussion\n• Brainstorming\n• Role-playing\n• Demonstration\nor simulation\nwith oral\nquestioning\n• Group\ndiscussions and\ninteractive\nactivities\n• Case studies/\nproblems\ninvolving\nworkplace\ndiversity issues\n• Written\nexamination\n(Essay)\n• Role Playing\n1 Hour\n\n4.2 Relate local and\nglobal trends to\nworkplace context\n• Discuss the different levels of human\nidentity according to Amber Mayer (2015)\n• Explain different communities people\nbelong to and how these are connected\n• Recognize cultural differences and\nrespect for cultural diversity\n• Recognize differences and\ncommonalities among people\n• Demonstrate attitudes of empathy,\nsolidarity and respect for diversity\n• Connect local issues to global trends,\nand vice versa.\n• Interactive Lecture\n• Small Group\nDiscussion\n• Brainstorming\n• Role-playing\n• Demonstration\nor simulation\nwith oral\nquestioning\n• Group\ndiscussions and\ninteractive\nactivities\n• Case studies/\nproblems\ninvolving\nworkplace\ndiversity issues\n1 Hour\n\n--- PDF PAGE 127 ---\nDRAFT\n\nFOOD AND BEVERAGE SERVICES NC IV Revision 01 Promulgated (10/29/2018) 123\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nMethod\nNominal\nDuration\n• Written\nexamination\n(Essay)\n\n4.3 Engage and take\nactions on\nworkplace issues\nand concerns\n• Identify the actions that can be taken\nindividually and collectively\n• Describe ethically responsible behaviour\n• Explain the importance and benefits of\ncivic engagement\n• Employ appropriate actions to address\nworkplace issues involving national and\nglobal trends\n• Show concern and willingness to take\npart in the development efforts to\ndiscuss workplace issues and concerns\n• Apply the attitude of “thinking globally\nand acting locally” in the workplace\n• Interactive Lecture\n• Small Group\nDiscussion\n• Brainstorming\n• Role-playing\n• Demonstration\nor simulation\nwith oral\nquestioning\n• Group\ndiscussions and\ninteractive\nactivities\n• Case studies/\nproblems\ninvolving\nworkplace\ndiversity issues\n• Written\nexamination\n(Essay)\n• Role Playing\n1 Hour\n5. Manage\ninnovative\nwork\ninstructions\n5.1 Review and\nanalyze existing\nworkplace\npractices\n• Show mastery of basic management\nconcepts according to Gallup, nine\ndimensions of innovative practices and\nclimate; and different types of innovation\n• Contextualize innovation to different\nvariables in the organization\n• Review current organizational practices\nwhere innovation is contextualized\n• Interactive Lecture\n• Appreciative\nInquiry\n• Demonstration\n• Group work\n• Psychological\nand behavioral\nInterviews\n• Performance\nEvaluation\n• Life Narrative\nInquiry\n• Review of\nportfolios of\nevidence and\nthird-party\nworkplace\n1 Hour\n\n--- PDF PAGE 128 ---\nDRAFT\n\nFOOD AND BEVERAGE SERVICES NC IV Revision 01 Promulgated (10/29/2018) 124\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nMethod\nNominal\nDuration\nreports of on-\nthe-job\nperformance.\n• Standardized\nassessment of\ncharacter\nstrengths and\nvirtues applied\n\n5.2 Examine\nopportunities for\ncontinuous\nimprovement and\ninnovation of\npractices in the\nworkplace\n\n• Show mastery of the determinants of\ninnovative behaviors and principles of\ninnovation\n• Review current organizational practices\nwhere innovation is contextualized\n• Evaluate innovative practices in the\norganization\n• Assess innovative behaviors for\npromoting innovation and learning in the\nworkplace\n• Interactive Lecture\n• Appreciative\nInquiry\n• Demonstration\n• Group work\n• Psychological\nand behavioral\nInterviews\n• Performance\nEvaluation\n• Life Narrative\nInquiry\n• Review of\nportfolios of\nevidence and\nthird-party\nworkplace\nreports of on-\nthe-job\nperformance.\n• Standardized\nassessment of\ncharacter\nstrengths and\nvirtues applied\n1 Hour\n\n5.3 Implement\ninnovative ways in\nthe conduct of\nusual workplace\n• Show mastery of the determinants of\ninnovative behaviors, principles of\ninnovation; and dimensions of innovation\nclimate and strategies and techniques\n• Interactive Lecture\n• Appreciative\nInquiry\n• Demonstration\n• Psychological\nand behavioral\nInterviews\n• Performance\n1 Hour\n\n--- PDF PAGE 129 ---\nDRAFT\n\nFOOD AND BEVERAGE SERVICES NC IV Revision 01 Promulgated (10/29/2018) 125\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nMethod\nNominal\nDuration\npractices\n\nfor implementing innovation in the\nworkplace\n• Evaluate impact of innovative practices\nin the organization\n• Demonstrate skills in managing changes\nin the workplace\n• Group work\nEvaluation\n• Life Narrative\nInquiry\n• Review of\nportfolios of\nevidence and\nthird-party\nworkplace\nreports of on-\nthe-job\nperformance.\n• Standardized\nassessment of\ncharacter\nstrengths and\nvirtues applied\n6. Manage and\nevaluate\nusage of\ninformation\n\n6.1 Review information\nneeds and sources\n• Lecture and discussion on:\no Kinds of information\no Information evaluation issues\no Information storage requirements\nand methods\n• Analysing record information\n• Identification of information sources\n• Lecture\n• Group Discussion\n• Hands on\n• Demonstration\n• Practical exercises\n• Oral evaluation\n• Written Test\n• Observation\n• Presentation\n2 Hours\n\n6.2 Collect and analyze\ninformation\n• Lecture and discussion on:\no Information collection and collation\no Relevant trends and developments\n• Collection of information\n• Analyzation of information\n• Lecture\n• Group Discussion\n• Hands on\n• Demonstration\n• Practical exercises\n• Oral evaluation\n• Written Test\n• Observation\n• Presentation\n2 Hours\n\n6.3 Use management\ninformation\nsystems\n• Lecture and discussion on:\no Management information systems\no Available technology in information\n• Lecture\n• Group Discussion\n• Hands on\n• Oral evaluation\n• Written Test\n• Observation\n2 Hours\n\n--- PDF PAGE 130 ---\nDRAFT\n\nFOOD AND BEVERAGE SERVICES NC IV Revision 01 Promulgated (10/29/2018) 126\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nMethod\nNominal\nDuration\nmanagement\no Advance strategies for customer\nservice excellence\n• Use of available technology in\ninformation management\n• Demonstration\n• Practical exercises\n• Presentation\n\n6.4 Report and\ndisseminate\nanalyzed\ninformation\n• Lecture and discussion on:\no Reporting procedures of the\norganisation\no Analysis and display techniques\n• Using management information systems\nto store and retrieve data\n• Lecture\n• Group Discussion\n• Hands on\n• Demonstration\n• Practical exercises\n• Oral evaluation\n• Written Test\n• Observation\n• Presentation\n2 Hours\n7. Lead in\nimprovement\nof\nOccupational\nSafety and\nHealth (OSH)\nprograms,\npolicies and\nprocedures\n7.1 Assess\nOccupational\nSafety and Health\n(OSH) practices\nand programs\n• Case Study in evaluating current OSH\nprograms effectiveness\n• Practice auditing the workplace\n•\nLecture\n•\nGroup\nDiscussion\n•\nCase Study\n•\nGroup Project\n\n•\nWritten Exam\n•\nDemonstration\n•\nObservation\n•\nInterviews /\nQuestioning\nPortfolio\n1 Hours\n\n7.2 Recommend OSH\n program\n improvement\n initiatives\n• Writing and Presenting Action Plans to\nimprove OSH compliance in the\nworkplace and/or increase effectiveness\nof OSH Programs\n•\nLecture\n•\nGroup\nDiscussion\n•\nCase Study\n•\nGroup Project\n\n•\nWritten Exam\n•\nDemonstration\n•\nObservation\n•\nInterviews /\nQuestioning\nPortfolio\n4 Hours\n\n7.3 Implement\nrecommended\nimprovements on\nOccupational\nSafety and Health\n(OSH) Programs,\n• Role play in increasing the OSH\nawareness\n• Measuring the impact of the new OHS\nprogram or initiative\n•\nLecture\n•\nGroup\nDiscussion\n•\nCase Study\n•\nGroup Project\n•\nWritten Exam\n•\nDemonstration\n•\nObservation\n•\nInterviews /\n Questioning\n2 Hours\n\n--- PDF PAGE 131 ---\nDRAFT\n\nFOOD AND BEVERAGE SERVICES NC IV Revision 01 Promulgated (10/29/2018) 127\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nMethod\nNominal\nDuration\nProcedures and\nPolicies\n Portfolio\n8. Lead towards\nimprovement\nof\nenvironmental\nwork\nprograms,\npolicies and\nprocedures\n8.1 Assess\nenvironmental work\npractices and\nprograms\n• Discussion of Green structural change\nand retraining needs\n-\nWhat is green structural change and\nwhere is it happening\n-\nWorkforce restructuring and\nadjustment\n-\nEmployment effects of Environment\n-\nSectors most affected by green\nrestructuring\n-\nRetraining and skills upgrading\n-\nEffective and equitable\nrestructuring: Good practices and\nprograms by public and private\nsector actors\n• Perform Impact Assessment\n• Discussions of Gender Implications\n• Lecture\n• Group Discussion\n• Demonstration\n• Case Study\n• Reporting\n\n• Written Exam\n• Demonstration\n• Observation\n• Interviews /\nQuestioning\n• Third Party\nReports\n1 Hour\n\n8.2 Recommend\nenvironmental\nprogram\nimprovement\ninitiatives\n• Practicing Leadership skills: The biggest\nchallenge in transition to a low-carbon\neconomy or environment friendly\nactivities\n• Practicing Basic Business planning\n• Opportunities Management -\nIdentification of low-carbon and\nResource scarcity risks\n• Perform Cost–benefit Analysis\n• Lecture\n• Group Discussion\n• Demonstration\n• Case Study\n• Reporting\n\n• Written Exam\n• Demonstration\n• Observation\n• Interviews /\nQuestioning\n• Third Party\nReports\n1 Hour\n\n8.3 Implement\nrecommended\nimprovements on\nenvironmental\n• Practicing Environmental Awareness\nRaising (Communication/\nImplementation campaigns)\n• Teaching and training personnel -\n• Lecture\n• Group Discussion\n• Demonstration\n• Written Exam\n• Demonstration\n• Observation\n1 Hour\n\n--- PDF PAGE 132 ---\nDRAFT\n\nFOOD AND BEVERAGE SERVICES NC IV Revision 01 Promulgated (10/29/2018) 128\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nMethod\nNominal\nDuration\nprograms, policies\nand procedures\nnecessary skills and methods to impart\nenvironmental knowledge, to create\nawareness and to react flexibly to ever-\nchanging labor market needs.\n• Case Study\n• Reporting\n\n• Interviews /\nQuestioning\n• Third Party\nReports\n9. Sustain\nentrepreneurial\nskills\n9.1 Enhance one’s\nbusiness skills\n• Discussion on entrepreneurial skills\n• Identifying market trends\n• Case studies on new technologies,\nproducts and processes\n• Practice gathering information on new\ntrends\n\n• Lecture/ Discussion\n• Case study\n• Group work\n• Written Report\n• Case problem\n2 Hours\n\n4. Manage\nentrepreneurial\npractices\n\n• Discussion on continuous improvement\n• Presentation of plans for continuous\nimprovement\n• Evaluation of new products and services\n\n• Lecture discussion\n• Group work\n• Written Report\n• Case problem\n1 Hour\n\n9.2 Expand markets\nand clientele\n• Prepare business plan and proposal\n• Lecture discussion\n• Group work\n• Portfolio\n1 Hour\n\n--- PDF PAGE 133 ---\nDRAFT\n\nFOOD AND BEVERAGE SERVICES NC IV Revision 01 Promulgated (10/29/2018) 129\n\nCOMMON COMPETENCIES\n(190 Hours)\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n1. Maintain\nhospitality\nindustry\nknowledge\n1.1 Seek\ninformation on\nthe hospitality\nindustry\n\n•\nIdentify and access sources of\ninformation on the hotel and travel\nindustries, appropriately and correctly\n•\nObtain information on the hotel and\ntravel industries to assist effective work\nperformance within the industries\n•\nAccess and update specific information\non relevant sector(s) of work\n•\nUse knowledge of the hotel and travel\nindustries in the correct context to\nenhance quality of work performance\n•\nObtain information on other industries to\nenhance quality of work performance\n• Discussion\n• Demonstration\n• Lecture\n• Group\ndiscussion\n• Simulation\n\n• Observation\n• Demonstration\n• Written\nExamination\n• Interview\n\n5 Hours\n\n1.2 Source and\napply\ninformation on\nlegal and\nethical issues\nfor the\nhospitality\nindustry\n•\nObtain information on legal issues and\nethical issues to assist effective work\nperformance\n•\nConduct day-to-day hospitality industry\nactivities in accordance with legal\nobligations and ethical industry\npractices\n• Discussion\n• Demonstration\n• Lecture\n• Group\ndiscussion\n• Simulation\n\n• Observation\n• Demonstration\n• Written\nExamination\n• Interview\n\n5 Hours\n\n1.3 Update\nhospitality\nindustry\nknowledge\n•\nIdentify and use a range of opportunities\nto update general knowledge of the\nhotel and travel industries\n•\nMonitor current issues of concern to the\nindustries\n•\nShare updated knowledge with\ncustomers and colleagues as appropriate\n• Discussion\n• Demonstration\n• Lecture\n• Group\ndiscussion\n• Simulation\n\n• Observation\n• Demonstration\n• Written\nExamination\n• Interview\n\n10 Hours\n\n--- PDF PAGE 134 ---\nDRAFT\n\nFOOD AND BEVERAGE SERVICES NC IV Revision 01 Promulgated (10/29/2018) 130\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\nand incorporate this knowledge into day-\nto-day work activities\n\n2. Perform child\nprotection\nduties relevant\nto the tourism\nindustry\n2.1 Identify the\nissue of sexual\nexploitation of\nchildren by\ntourists\n\n•\nDefine the problem of child sexual\nexploitation of children by tourists\n(otherwise known as child-sex tourism)\n•\nDescribe the impact of child sexual\nexploitation on children,\ncommunities and the hotel and\ntravel industries\n•\nIdentify suspicious behaviors that\nmay be exhibited by child sex\ntourists\n• Discussion\n• Demonstration\n• Lecture\n• Group\ndiscussion\n• Simulation\n\n• Observation\n• Demonstration\n• Written\nExamination\n• Interview\n\n5 Hours\n\n2.2 Describe\nnational,\nregional and\ninternational\nactions to\nprevent the\nsexual\nexploitation of\nchildren by\ntourists\n•\nLocate and become familiar with the\nUnited Nations Convention on the\nRights (UNCRC) of the Child and the\nmain UN Articles relating to the rights of\nall children to be safe from sexual\nexploitation\n•\nExamine national, regional and\ninternational initiatives to prevent the\nsexual exploitation of children by\ntourists\n•\nIdentify reporting mechanisms if\nsuspicious behaviors is observed\n• Discussion\n• Demonstration\n• Lecture\n• Group\ndiscussion\n• Simulation\n\n• Observation\n• Demonstration\n• Written\nExamination\n• Interview\n•\n\n5 Hours\n\n2.3 Describe\nactions that\ncan be taken in\nthe workplace\nto protect\nchildren from\nsexual\nexploitation by\n•\nPrepare a list of actions that can be\ntaken by staff working in each labor\ndivision of the hotel and travel industries\nto prevent the sexual exploitation of\nchildren by tourists\n•\nSelect the best action to take by a staff\nfor particular situations in preventing the\nsexual exploitation of children by\n• Discussion\n• Demonstration\n• Lecture\n• Group\ndiscussion\n• Simulation\n\n• Observation\n• Demonstration\n• Written\nExamination\n• Interview\n\n5 Hours\n\n--- PDF PAGE 135 ---\nDRAFT\n\nFOOD AND BEVERAGE SERVICES NC IV Revision 01 Promulgated (10/29/2018) 131\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\ntourists\ntourists\n•\nParticipate in nati