entify potential customers,\ncreate and update profiles\nwith the use of\nestablishment’s database\nsystem\n• Lecture-\nDiscussion\n• Power Point\nPresentation\n\n• Written\nExamination\n• Oral Questioning\n• Third Party report\n• Portfolio\nassessment\n\n7 Hours\n•\nIdentify sales promotional\nactivities for existing and\npotential customers according\nto marketing plan of the\nestablishment.\n\n• Lecture-\nDiscussion\n• Power Point\nPresentation\n\n• Written\nExamination\n• Oral Questioning\n• Third Party report\n• Portfolio\nassessment\n\n--- PDF PAGE 155 ---\nDRAFT\n\nFOOD AND BEVERAGE SERVICES NC IV Revision 01 Promulgated (10/29/2018) 151\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Contents\nPractical Activities\nMethodologies\nAssessment\nMethods\nNominal Duration\n\n•\nIdentify and recommend eco-\nfriendly promotional materials.\n• Lecture-\nDiscussion\n• Power Point\nPresentation\n• Video presentation\n• Written\nExamination\n• Oral Questioning\n• Third Party report\n• Portfolio\nassessment\n\n--- PDF PAGE 156 ---\nDRAFT\n\nFOOD AND BEVERAGE SERVICES NC IV Revision 01 Promulgated (10/29/2018) 152\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Contents\nPractical Activities\nMethodologies\nAssessment\nMethods\nNominal Duration\n\n3.2.Enforce\npromotional\nactivities\n•\nExplain the details of the\nupcoming promotional activity.\n\n• Lecture-\nDiscussion\n• Demonstration\n• Power Point\nPresentation\n\n• Written\nExamination\n• Observation\n• Oral Questioning\n• Third Party report\n• Portfolio\nassessment\n• Simulation\n12 Hours\n• Demonstrate to the staff the\nstrategies to upsell and how\npromotional activities are\nperformed\n\n• Lecture-\nDiscussion\n• Demonstration\n• Power Point\nPresentation\n\n• Written\nExamination\n• Observation\n• Oral Questioning\n• Third Party report\n• Portfolio\nassessment\n• Simulation\n•\nMonitor the promotional\nactivity based on the details\nset by the establishment\n\n• Lecture-\nDiscussion\n• Power Point\nPresentation\n\n• Written\nExamination\n• Oral Questioning\n• Third Party report\n• Portfolio\nassessment\n\n•\nCollect and summarize\nfeedback before submitting to\nhigher management for\nanalysis\n• Lecture-\nDiscussion\n• Power Point\nPresentation\n\n• Written\nExamination\n• Oral Questioning\n• Third Party report\n• Portfolio\nassessment\n\n--- PDF PAGE 157 ---\nDRAFT\n\nFOOD AND BEVERAGE SERVICES NC IV Revision 01 Promulgated (10/29/2018) 153\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Contents\nPractical Activities\nMethodologies\nAssessment\nMethods\nNominal Duration\n\n3.3. Evaluate food\nand beverage\npromotional\nactivities\n•\nReview the results of the\npromotional activity\n• Lecture-\nDiscussion\n• Power Point\nPresentation\n\n• Written\nExamination\n• Oral Questioning\n• Third Party report\n• Portfolio\nassessment\n\n9 Hours\n•\nPrepare promotional activity\nreports/documents according\nto required timeframes and\nenterprise standards\n• Lecture-\nDiscussion\n• Power Point\nPresentation\n\n• Written\nExamination\n• Oral Questioning\n• Third Party report\n• Portfolio\nassessment\n\n•\nEvaluate the effectiveness of\nthe concluded promotional\nactivity for future sales\nplanning\n• Lecture-\nDiscussion\n• Power Point\nPresentation\n\n• Written\nExamination\n• Oral Questioning\n• Third Party report\n• Portfolio\nassessment\n\n4. Organize\ncatering\nfunctions\n4.1 Determine\nproposal\nrequirements\nand conditions\n\n•\nIdentify catering requirements • Lecture-\nDiscussion\n• Power Point\nPresentation\n\n• Written\nExamination\n• Oral Questioning\n• Third Party report\n• Portfolio\nassessment\n\n6 Hours\n\n--- PDF PAGE 158 ---\nDRAFT\n\nFOOD AND BEVERAGE SERVICES NC IV Revision 01 Promulgated (10/29/2018) 154\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Contents\nPractical Activities\nMethodologies\nAssessment\nMethods\nNominal Duration\n•\nLiaise the details of the\ncatering with pertinent\ndepartments\n• Lecture-\nDiscussion\n• Power Point\