ining \neffective \nrelationships and \nconflict \nmanagement \n1.4 Ability to relate to \npeople from a \nrange of social, \ncultural, physical \nand mental \nbackgrounds \n1.5 Planning skills to \norganize required \nresources and \nequipment to meet\n\n--- PDF PAGE 14 ---\nTESDA-SOP-QSO-01-F08 \nFOOD AND BEVERAGE SERVICES NC IV   Revision 01                     Promulgated  (10/29/2018)                         \n10 \n \nlearning needs \n1.6 Reporting skills to \norganize \ninformation; assess \ninformation for \nrelevance and \naccuracy; identify \nand elaborate on \nlearning outcomes \n1.7 Facilitation skills to \nconduct small \ngroup training \nsessions\n\n--- PDF PAGE 15 ---\nTESDA-SOP-QSO-01-F08 \nFOOD AND BEVERAGE SERVICES NC IV   Revision 01                     Promulgated  (10/29/2018)                         \n11 \n \n \n \nELEMENTS \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \n \nREQUIRED \nKNOWLEDGE \n \nREQUIRED \nSKILLS \n2. Foster \nindividual and \nteam growth \n2.1. Learning and \ndevelopment program \ngoals and objectives \nare identified to match \nthe specific \nknowledge and skills \nrequirements of \ncompetency \nstandards \n2.2. Learning delivery \nmethods are \nappropriate to the \nlearning goals, the \nlearning style of \nparticipants and \navailability of \nequipment and \nresources \n2.3. Workplace learning \nopportunities and \ncoaching/ mentoring \nassistance are \nprovided to facilitate \nindividual and team \nachievement of \ncompetencies \n2.4. Resources and \ntimelines required for \nlearning activities are \nidentified and \napproved in \naccordance with \norganizational \nrequirements \n2.1    Advanced \ncoaching and \nmentoring \ntechniques \n2.2   Performance \nevaluation \nconcepts \n2.3   Training and \ndevelopment \ntechniques  \n \n2.1  Instructional \nplanning and \ndelivery skills \n2.2  Monitoring and \nevaluation skills \n2.3  Mentoring and \ncoaching skills\n\n--- PDF PAGE 1