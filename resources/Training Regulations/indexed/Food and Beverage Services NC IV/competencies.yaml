 are provided \n4.2 Team and individual \nperformances to \nensure team members \nare able to achieve \ngoals are monitored \n4.3 Opportunity for \nindividual \ndevelopment is \nidentified \n4.4 Clear supervisory and \nreporting \nresponsibilities in line \nwith organizational \nrequirements are \nmaintained \ncharacteristics of \neffective leadership \n4.3 Principles of \nteamwork, including \ncharacteristics of \neffective teams, \norganization of \nteams, potential team \nproblems and the \nbenefits of effective \nteamwork \n4.4 Role and theories of \nmotivation and its \napplication to \ndifferent workplace \ncontexts \n4.5 Organizational \nstructure and group \ndynamics \n4.6 Legislative issues \nthat impact on team \nmanagement, \nincluding equal \nemployment \nopportunity, diversity, \nanti-discrimination \nand unfair dismissal  \n4.7 Performance \nappraisal systems \nand procedures \n4.8 Principles of time \nmanagement \n4.9 Conflict management \ntechniques \n4.10 \nEnterprise \ntraining requirements \nand processes \n4.4 Providing feedback\n\n--- PDF PAGE 65 ---\nTESDA-SOP-QSO-01-F08 \nFOOD AND BEVERAGE SERVICES NC IV   Revision 01                     Promulgated  (10/29/2018)                         \n61 \n \nRANGE OF VARIABLES  \n \nVARIABLE \nRANGE \n1. Operational plans and \nobjectives  \nMay include: \n1.1 \nSales targets \n1.2 \nPerformance targets for a particular project \n1.3 \nIncreased productivity \n1.4 \nMeeting key performance indicators (KPI) \n1.5 \nShort, medium or long-term goals \n2. Team  \nMay include: \n2.1 \nProject-based \n2.2 \nPermanent teams \n2.3 \nPaid workers \n2.4 \nVolunteers \n2.5 \nWork role team \n2.6 \nPeers \n2.7 \nSubordinates \n3. Work plans  \n \nMay include: \n3.1 \nVerbal work plans \n3.2 \nWritten work plans \n3.3 \nDaily priorities \n3.4 \nWeekly priorities \n3.5 \nRegular duties and/or work tasks \n4. Targets and task \nobjectives  \nMay include: \n4.1 \nSales targets \n4.2 \nPromotional activities \n5. Training and learning \nopportunities  \nMay include: \n5.1 \nCoaching \n5.2 \nMentoring \n5.3 \nStructured on-the-job training \n5.4 \nOpportunistic learning \n5.5 \nModelling \n6. Problems  \n \nMay include: \n6.1 \nConflicts in priorities \n6.2 \nResource constraints \n6.3 \nLack of information \n6.4 \nSupplier delays \n6.5 \nDifferences in opinion \n6.6 \nInterpersonal conflict \n6.7 \nHazardous events \n6.8 \nTime constraints \n6.9 \nShortfalls in expected outcomes \n7. Participative approach  \nMay include: \n7.1 \nClarity of purpose, including vision, mission, goals \n7.2 \nCommunication \n7.3 \nCollaboration\n\n--- PDF PAGE 66 ---\nTESDA-SOP-QSO-01-F08 \nFOOD AND BEVERAGE SERVICES NC IV   Revision 01                     Promulgated  (10/29/2018)                         \n62 \n \nVARIABLE \nRANGE \n7.4 \nBuilding trust \n7.5 \nTeam involvement \n8. Conflict management \nstrategies  \nMay include: \n8.1 \nAssertiveness \n8.2 \nListening \n8.3 \nNon-verbal communication \n8.4 \nLanguage style \n8.5 \nProblem solving \n8.6 \nNegotiation \n8.7 \nMediation \n9. Feedback  \n \nMay include: \n9.1 \nPerformance \n9.2 \nService standards \n9.3 \nSkills and knowledge \n9.4 \nProgress \n10. Opportunity for individual \ndevelopment  \n \nMay include: \n10.1 Internal training/professional development \n10.2 External training/professional development \n10.3 Change in job responsibilities \n10.4 Opportunity for greater autonomy or responsibility \n10.5 Formal promotion \n10.6 Allocating responsibility for plans or objectives\n\n--- PDF PAGE 67 ---\nTESDA-SOP-QSO-01-F08 \nFOOD AND BEVERAGE SERVICES NC IV   Revision 01                     Promulgated  (10/29/2018)                         \n63 \n \nEVIDENCE GUIDE \n \n1. Critical aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 Demonstrated ability to supervise and instruct staff to \nachieve work activities \n1.2 Demonstrated ability to delegate and allocate tasks \n1.3 Demonstrated ability to assess and evaluate staff \ncompetency \n1.4 Demonstrated ability to identify and provide training \nrequirements \n1.5 Demonstrated ability to plan and monitor ongoing training \nneeds \n1.6 Demonstrated ability to plan timesheets and timetables \nto meet deadlines \n1.7 Demonstrated ability to achieve effective time \nmanagement \n1.8 Demonstrated ability to maintain safe workplace and \nenvironmentally responsible practices  \n1.9 Demonstrated ability to solve problems, such as staffing, \nresources \n1.10 Demonstrated ability to communicate information and \ninstructions, provided feedback and prepared reports and \nperformance appraisals. \n2. Resource Implications \nThe following resources should be provided: \n2.1  Training and assessment to include access to a real or \nsimulated workplace that provides the candidate with an \nopportunity to demonstrate application of knowledge of \nleadership, motivation and teamwork principles in a \nspecific travel and hotel industry context; and access to \nworkplace standards, procedures, policies, guidelines, \ntools and current financial data and regulations. \n3. Method of Assessment \nCompetency in this unit may be assessed through: \n3.1 \nCase studies \n3.2 \nObservation of practical candidate performance \n3.3 \nOral and written questions \n3.4 \nPortfolio evidence \n3.5 \nProblem solving \n3.6 \nThird party reports completed by a supervisor \n3.7 \nProject and assignment work \n4. Context of Assessment \n4.1  Competency may be assessed in actual workplace or  at \nthe designated TESDA Accredited Assessment Center.\n",
