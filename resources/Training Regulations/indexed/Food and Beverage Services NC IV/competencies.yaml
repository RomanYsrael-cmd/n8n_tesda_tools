        "source_title": "DEVELOP AND SUPERVISE OPERATIONAL APPROACHES",
        "source_text": "--- PDF PAGE 61 ---\nTESDA-SOP-QSO-01-F08 \nFOOD AND BEVERAGE SERVICES NC IV   Revision 01                     Promulgated  (10/29/2018)                         \n57 \n \nUNIT OF COMPETENCY : \nDEVELOP AND SUPERVISE OPERATIONAL  \n \n \n \nAPPROACHES \n \nUNIT CODE \n \n: \nTRS141210 \n \nUNIT DESCRIPTOR \n: \nThis unit deals with the skills and knowledge required to  \ndevelop and supervise operational approaches in a range of  \nsettings within the hotel industries. \n \n \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Communicate \nwork roles \n  \n1.1 Operational plans \nand objectives to \nteam members are \nidentified, developed \nand communicated \n1.2 Skills of team \nmembers to tasks \nand duties and \ndevelop job \nresponsibilities in line \nwith enterprise \nguidelines are \nmatched \n1.3 Requirements of jobs \nand tasks clearly to \nteam members are \ncommunicated \n1.1 Different leadership \nstyles and the \ncharacteristics of \neffective leadership \n1.2 Principles of \nteamwork, including \ncharacteristics of \neffective teams, \norganization of \nteams, potential \nteam problems and \nthe benefits of \neffective teamwork \n1.3 Role and theories of \nmotivation and its \napplication to \ndifferent workplace \ncontexts \n1.4 Organizational \nstructure and group \ndynamics \n1.5 Legislative issues \nthat impact on team \nmanagement, \nincluding equal \nemployment \nopportunity, \ndiversity, anti-\ndiscrimination and \nunfair dismissal  \n1.6 Performance \nappraisal systems \nand procedures \n1.7 Principles of time \nmanagement \n1.8 Conflict \n1.1 Questioning and \ncommunication skills \n1.2 Research skills \n1.3 Analytical skills \n1.4 Networking skills \n1.5 Developing \noperational plans and \nobjectives\n\n--- PDF PAGE 62 ---\nTESDA-SOP-QSO-01-F08 \nFOOD AND BEVERAGE SERVICES NC IV   Revision 01                     Promulgate