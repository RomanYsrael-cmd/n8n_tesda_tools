        "source_text": "--- PDF PAGE 99 ---\nTESDA-SOP-QSO-01-F08 \nFOOD AND BEVERAGE SERVICES NC IV   Revision 01                     Promulgated  (10/29/2018)                         \n95 \n \nCORE COMPETENCIES \n \nUNIT OF COMPETENCY  :     \nMANAGE FOOD AND BEVERAGE SERVICE TEAM \n                                                    \nUNIT CODE  \n: \nTRS513306 \n \nUNIT DESCRIPTOR             : \nThis unit covers the knowledge and skills in providing direction \nto foodservice staff for the smooth flow of service in the dining \nor restaurant area.   \n \n  \n \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \n \nREQUIRED  \nKNOWLEDGE \n \nREQUIRED  \nSKILLS \n1. Organize service \nstaff \n1.1 \nDuty/shift \nschedules are \nprepared and \napproved in \naccordance with \nstaff requirements. \n1.2 \nRoles and \nresponsibilities are \nidentified.* \n1.3 \nPerformance \nobjectives are \nestablished and \ndiscussed with \nstaff. \n \n \n1.1 Dissemination of \nestablished standard \noperating \nprocedures \n1.2 Management \nFunction: Organizing \n1.3 Job Description \n1.4 Restaurant \noperations \n- Type of Food \nservice operation \n- Work schedule  \n- Workflow plan \n- Specific staff \nduties/tasks \n- Service standards \n1.5 Prescribed duty \nhours of staff \n1.6 Employee relations \n1.7 Number of staff per \nshift \n1.8 Number of working \nhours per staff \n \n \n1.1 Effective \ncommunication skills \n1.2 Designing work     \nschedule and \nworkflow plan \n1.3 Technology Skill \n- Computer \nOperation \n1.4 Management skills\n\n--- PDF PAGE 100 ---\nTESDA-SOP-QSO-01-F08 \nFOOD AND BEVERAGE SERVICES NC IV   Revision 01                     Promulgated  (10/29/2018)                         \n96 \n \n \n \n \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \n \nREQUIRED  \nKNOWLEDGE \n \nREQUIRED  \nSKILLS \n2.    Enforce \ncompany \npolicies in the \nfood service \nestablishments \n2.1 Punctuality and \nattendance of staff is \nchecked. \n2.2 Company policies \nand standards of \nservice are \nimplemented and \nmonitored to ensure \nthe deliverance of \nconsistent quality \nservice and products* \n2.3 Workplace \ndiscipline is properly \nadministered and \ndocumented when \nemployee \nmisconducts are \nreported \n \n2.1 Dissemination of \nestablished standard \noperating \nprocedures \n2.2 Standards of service \nbased on the type of \nfood service \noperation. \n2.3 HACCP standards \n2.4 Risk management \n2.5 Management \nfunctions: leading \nand controlling \n2.6 Employee rights and \nobligations \n2.7 Basic Labor laws \nand regulations \n2.8 Equipment \nrequirements for the \ndissemination of \nestablishment \nstandards and \npolicies. \n2.1 Effective \ncommunication skills \n2.2 Management skills  \n2.3 Computer operation \nskills \n3. Develop staff  \n \n3.1 New hires are \noriented and trained \nin accordance with \nenterprise \nstandards.* \n3.2 Employee \nweaknesses are \nidentified and \nmeasurable goals for \nimprovement are \nplanned \n3.3 Employees’ progress \nare tracked and \nchecked for the \npurpose of \nperformance \nappraisal. \n3.4 Employee feedback \nis conducted regularly \nto motivate and re-\n3.1 Dissemination of \nestablished standard \noperating \nprocedures \n3.2 Functions of \nManagement \n3.3 Working in team \n3.4 Different types of \nAssessment \n3.5 Motivation \n3.6 Employee \nPerformance \nevaluation \n3.7 Employee rights and \nobligations \n3.8 Basic Labor laws \nand regulations \n3.9 Equipment \nrequirements for \ntraining, promoting, \n3.1 Effective \ncommunication skills \n3.2 Computer operation \nskills \n3.3 Performance \nevaluation application \n3.4 Coaching, mentoring \nand motivating skills\n\n--- PDF PAGE 101 ---\nTESDA-SOP-QSO-01-F08 \nFOOD AND BEVERAGE SERVICES NC IV   Revision 01                     Promulgated  (10/29/2018)                         \n97 \n \n \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \n \nREQUIRED  \nKNOWLEDGE \n \nREQUIRED  \nSKILLS \ndirect staff.* \n3.5 Staff performance  \n      assessment targets  \n      are prepared for next  \n      rating period. \nstaff appraisal \nprocess and feed- \nbacking or \nevaluating. \n4. Monitor payroll \ndata \n4.1 Number of hours \nrendered by staff is \nconsolidated for \npayroll \n4.2 Payroll data are \nprovided to payroll \nprocessor for \ncalculation within \ndesignated timelines.  \n \n4.1 Dissemination of \nestablished standard \noperating \nprocedures \n4.2 Employee rights and \nobligations \n4.3 Basic Labor laws \nand regulations \n4.4 Payroll processing \n4.5 Basic accounting \nprinciples \n4.6 Equipment \nrequirements for \npayroll consolidation \n4.1 Effective \ncommunication skills \n4.2 Computer operation \nskills (payroll \nsoftware)\n\n--- PDF PAGE 102 ---\nTESDA-SOP-QSO-01-F08 \nFOOD AND BEVERAGE SERVICES NC IV   Revision 01                     Promulgated  (10/29/2018)                         \n98 \n \nRANGE OF VARIABLES  \n \nVARIABLE \nRANGE \n1. Standards of service \n \n \n \n \n \n \n \nMay include: \n1.1 Type food service styles \n1.2 Customer service and care (Meeting guest needs) \n1.3 Sequence of service \n1.4 Service culture \n1.5 Telephone courtesy \n1.6 Food safety and handling \n1.7 Grooming and  hygiene \n2. Workplace discipline \nMay include: \n2.1 Verbal counseling \n2.2 Written warning \n2.3 Suspension \n2.4 Termination \n3. Employee misconducts \nMay include: \n3.1 Insubordination \n3.2 Absenteeism \n3.3 Perennial tardiness \n3.4 Dishonesty \n3.5 Theft/Pilferage \n4.  Training \nEmployees could be considered trained with: \n4.1 \nCompany standards \n4.2 \nService procedures \n4.3 \nInterpersonal skills \n4.4 \nHandling guest complaint \n4.5 \nTelephone courtesy \n4.6 \nWork ethics \n4.7 \nHygiene and sanitation \n4.8 \nEnergy and water conservation and waste disposal \npolicies \n4.9 \nPolicies on sexual harassments \n \n5. Employee weaknesses \n \n \n \nMay include: \n5.1 Technical skills \n5.2 Communication problems \n5.3 Difficulty in getting along with other people \n5.4 Lack of enthusiasm \n5.5 Unassertiveness \n5.6 Procrastination \n5.7 Mediocrity \n6. Employee feedback \nMay include: \n6.1 Superior’s/Supervisor’s performance assessment \n6.2 Customer satisfaction/Guest complaints \n6.3 Training evaluation \n6.4 Compensation\n\n--- PDF PAGE 103 ---\nTESDA-SOP-QSO-01-F08 \nFOOD AND BEVERAGE SERVICES NC IV   Revision 01                     Promulgated  (10/29/2018)                         \n99 \n \nVARIABLE \nRANGE \n6.5 Recognitions/Commendations \n6.6 Counseling \n7.  Performance assessment \ntargets  \nMay include: \n7.1 Job knowledge \n7.2 Quality of work \n7.3 Attendance and punctuality \n7.4 Work attitude \n7.5 Grooming and proper hygiene \n7.6 Customer relations \n7.7 Teamwork\n\n--- PDF PAGE 104 ---\nTESDA-SOP-QSO-01-F08 \nFOOD AND BEVERAGE SERVICES NC IV   Revision 01                     Promulgated  (10/29/2018)                         \n100 \n \nEVIDENCE GUIDE \n \n1.  Critical aspects of   \ncompetency \nAssessment requires evidence that the candidate: \n1.1 Identified roles and responsibilities of service team \n1.2 Implemented and monitored company policies and \nstandards of service \n1.3 Administered workplace discipline and documented \nemployee infractions \n1.4 Oriented and trained new hires \n1.5 Conducted employee feedback \n1.6 Provided payroll data for calculation within designated \ntimelines \n2. Resource  implications \nThe following resources should be provided: \n2.1 Actual or sample workplace forms e.g. staff weekly \nschedules, staff performance assessment forms, \npayroll processing form and alike \n2.2 Actual or sample HR and employee records e.g. \nEmployee handbook; company policies; memos \n3. Methods of   assessment \nCompetency may be assessed through: \n3.1 Demonstration with Oral questioning  \n3.2 Portfolio \n4. Context for   \n     assessment \n4.1   Competency may be assessed in actual workplace or at \nthe designated TESDA Accredited Assessment Center.\n",
