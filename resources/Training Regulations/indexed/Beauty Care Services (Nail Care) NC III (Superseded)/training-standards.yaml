      "source_text": "SECTION 3 TRAINING STANDARDS\n\nThis set of standards provides Technical and Vocational Education and Training\n(TVET) providers with information and other important requirements to consider\nwhen designing training programs for BEAUTY CARE SERVICES (NAIL CARE) NC\nIII.\n\nThis includes information on curriculum design; training delivery; trainee entry\nrequirements; tools and equipment; training facilities; trainer’s qualification and\ninstitutional assessment.\n\n3.1 CURRICULUM DESIGN\n\nCourse Title: BEAUTY CARE SERVICES (NAIL CARE) NC Level: NC III\n\nSuggested Nominal Training Duration:\n\n 20 Hrs (Basic)\n 18 Hrs (Common)\n160 Hrs (Core)\n 130 Hrs-in-school\n 30 Hrs- SIT\n198 Hrs (Total)\n\nCourse Description:\n\nThis course is designed to enhance the knowledge, skills and attitudes of\nbeauticians in accordance with industry standards. It covers basic, common and\ncore competencies in NC III.\n\nBASIC COMPETENCIES\n(20 Hours)\n\nUnit of\nCompetency\nLearning Outcomes\nTraining\nMethodology\nInstitutional\nAssessment\nApproach\n1. Lead workplace\ncommunication\n1.1\nCommunicate\ninformation about\nworkplace processes.\n1.2\nLead workplace\ndiscussions.\n1.3\nIdentify and\ncommunicate issues\narising in the\nworkplace\n\n• Group\ndiscussion\n• Role Play\n• Brainstorming\n\n• Observation\n• Interviews\n\n--- PDF PAGE 51 ---\nTR Beauty Care Services (Nail Care) NC III\nPromulgated - 47 -\nUnit of\nCompetency\nLearning Outcomes\nTraining\nMethodology\nInstitutional\nAssessment\nApproach\n2. Lead small\nteams\n2.1\nProvide team\nleadership.\n2.2\nAssign responsibilities\namong members\n2.3\nSet performance\nexpectation for team\nmembers\n2.4\nSupervise team\nperformance\n\n• Lecture\n• Demonstration\n• Self-paced\n(modular)\n• Demonstration\n• Case studies\n3. Develop and\npractice\nnegotiation skills\n3.1\nIdentify relevant\ninformation in\nplanning negotiations\n3.2\nParticipate in\nnegotiations\n3.3\nDocument areas for\nagreement\n\n• Direct\nobservation\n• Simulation/\nrole playing\n• Case studies\n• Written test\n• Practical/\nperformance\ntest\n4. Solve workplace\nproblem related\nto work activities\n4.1\nExplain the analytical\ntechniques\n4.2\nIdentify the problem.\n4.3\nDetermine the\npossible cause/s of\nthe problem.\n\n• Direct\nobservation\n• Simulation/role\nplaying\n• Case studies\n• Written test\n• Practical/\nperformance\ntest\n5. Use\nmathematical\nconcepts and\ntechniques\n5.1\nExplain the analytical\ntechniques\n5.2\nIdentify mathematical\ntools and techniques\nto solve problem\n5.3\nApply mathematical\nprocedures/ solution\n5.4\nAnalyze results\n\n• Direct\nobservation\n• Simulation/\nrole playing\n• Case studies\n• Written test\n• Practical/\nperformance\ntest\n6. Use relevant\ntechnologies\n6.1\nIdentify appropriate\ntechnology\n6.2\nApply relevant\ntechnology\n6.3\nMaintain/ enhance\nrelevant technology\n\n• Direct\nobservation\n• Simulation/\nrole playing\n• Case studies\n• Written test\n• Practical/\nperformance\ntest\n\n--- PDF PAGE 52 ---\nTR Beauty Care Services (Nail Care) NC III\nPromulgated - 48 -\nCOMMON COMPETENCIES\n(18 Hours)\n\nUnit of\nCompetency\nLearning Outcomes\nTraining\nMethodology\nInstitutional\nAssessment\nApproach\n1. Maintain an\neffective\nrelationship with\nclients/customers\n\n1.1 Maintain a professional\nimage\n1.2 Meet client/customer\nrequirements\n1.3 Build credibility with\ncustomers/clients\n\n• Group\nDiscussion\n• Interaction\n• Demonstration\n• Observation\n• Interviews/\nQuestioning\n2. Manage own\nperformance\n2.1 Plan own workload\n2.2 Maintain quality of own\nperformance\n2.3 Establish credibility\nwith customers/ clients\n\n• Group\nDiscussion\n• Interaction\n• Demonstration\n• Observation\n• Interviews/\n• Questioning\n3. Apply quality\nstandards\n3.1 Assess clients service\nneeds\n3.2 Assess own work\n3.3 Engage in quality\nimprovement\n\n• Group\nDiscussion\n• Interaction\n• Demonstration\n• Observation\n• Interviews/\nQuestioning\n4. Maintain a safe,\nclean and\nefficient work\nenvironment\n4.1 Comply with health\nregulations\n4.2 Prepare and maintain\nwork area\n4.3 Check and maintain\ntools and equipment\n4.4 Check and maintain\nstocks\n4.5 Provide a relaxed and\ncaring environment\n\n• Group\nDiscussion\n• Interaction\n• Demonstration\n• Observation\n• Interviews/\nQuestioning\n\n--- PDF PAGE 53 ---\nTR Beauty Care Services (Nail Care) NC III\nPromulgated - 49 -\nCORE COMPETENCIES\n(130 hrs- in-school + 30 hrs- SIT)\n\nUnit of\nCompetency\nLearning Outcomes\nTraining\nMethodology\nInstitutional\nAssessment\nApproach\n1. Perform creative\nnail design\n\n1.1 Prepare client\n1.2 Clean and cut nails\n1.3 Apply different\ncreative nail designs\n1.4 Perform post service\nactivities\n\n• Lecture/\nDemonstration\n• Supervised\nIndustry\nTraining\n\n• Written\nExamination\n• Demonstration\n• Observation\n2. Perform artificial\nnail extensions\n2.1 Prepare client\n2.2 Apply nail tip\n2.3 Apply/refill acrylic\n(methacrylate) nails\n2.4 Attach sculptured\nnails\n2.5 Perform post-service\nactivities\n\n• Lecture/\nDemonstration\n• Supervised\nIndustry\nTraining\n\n• Written\nExamination\n• Demonstration\n• Observation\n\n--- PDF PAGE 54 ---\nTR Beauty Care Services (Nail Care) NC III\nPromulgated - 50 -\nTRAINING DELIVERY\n\nThe delivery of training should adhere to the design of the curriculum. Delivery\nshould be guided by the 10 basic principles of competency-based TVET.\n\n• The training is based on curriculum developed from the competency\nstandards;\n• Learning is modular in its structure;\n• Training delivery is individualized and self-paced;\n• Training is based on work that must be performed;\n• Training materials are directly related to the competency standards and the\ncurriculum modules;\n• Assessment is based in the collection of evidence of the performance of\nwork to the industry required standard;\n• Training is based both on and off-the-job components;\n• Allows for recognition of prior learning (RPL) or current competencies;\n• Training allows for multiple entry and exit; and\n• Approved training programs are nationally accredited.\n\nThe competency-based TVET system recognizes various types of delivery\nmodes, both on and off-the-job as long as the learning is driven by the competency\nstandards specified by the industry. The following training modalities may be\nadopted when designing training programs:\n\n• The dualized mode of training delivery is preferred and recommended. Thus\nprograms would contain both in-school and in-industry training or fieldwork\ncomponents. Details can be referred to the Dual Training System (DTS)\nImplementing Rules and Regulations.\n• Modular/self-paced learning is a competency-based training modality\nwherein the trainee is allowed to progress at his own pace. The trainer just\nfacilitates the training delivery.\n• Peer teaching/mentoring is a training modality wherein fast learners are\ngiven the opportunity to assist the slow learners.\n• Supervised industry training or on-the-job training is an approach in training\ndesigned to enhance the knowledge and skills of the trainee through actual\nexperience in the workplace to acquire specific competencies prescribed in\nthe training regulations.\n• Distance learning is a formal education process in which majority of the\ninstruction occurs when the students and instructor are not in the same\nplace. Distance learning may employ correspondence study, audio, video or\ncomputer technologies.\n• Project-based instruction is an authentic instructional model strategy in\nwhich students plan, implement and evaluate projects that have real world\napplications.\n\n--- PDF PAGE 55 ---\nTR Beauty Care Services (Nail Care) NC III\nPromulgated - 51 -\n3.3 TRAINEE ENTRY REQUIREMENTS\n\nTrainees or students wishing to gain entry into these qualifications should\npossess the following requirements:\n\n• MUST be able to communicate effectively both orally and in written form\n• MUST be physically, emotionally, psychologically and mentally fit\n•\nMUST be able to perform basic mathematical computation (Fundamental\nOperations)\n•\nMUST have at least one to two (2) years experience in the industry or\nhave completed Beauty Care (Nail) Services NC II Training or certified\n•\nMUST secure a medical certificate for fitness to handle chemicals\n\n3.4 TOOLS, EQUIPMENT AND MATERIALS\n\nBEAUTY CARE (NAILCARE) SERVICES – NC III\n\nRecommended list of tools, equipment and materials for the training of a\nminimum of 25 trainees for Beauty Care (Nail Care) Services NC III are as follows:\n\nTOOLS\nEQUIPMENT\nMATERIALS\nQTY\n\nQTY\n\nQTY\n\n10 pcs.\nCuticle nipper*\n10 pcs.\nAdjustable Lamp\n1 pc\nAcrylic (Methacrylate)\nmonomer liquid*\n1 pc.\nAcrylic brush marble*\n10 pcs.\nClients chair\n2 pcs.\nAcrylic (Methacrylate)\npolomer\npowder(clear/whit\ne)\n1 med.\nAluminum tray\n10\nunits\nManicure table\n1 pc\nAcrylic form*\n\nBasin (plastic)*\n10 pcs.\nManicurist chair or\nstool\n1 pc\nAcrylic powder\nstrainer*\n1 pc\nBrush cleaner\n\nChamois Buffer*\nPPE\n\n3 btls\nAlcohol\n1 pc\nCurved blade stainless\nsteel scissor*\n1 pair\nGloves*\n1pc\nAnti clog glue cap with\nsafety lock*\n1 pc.\nFlat brush (uv gel )\n1 pc\nSmock gown*\n3 btls.\nAntiseptic solution/\ncream\n5 pcs.\nHard file *\n1 pc\nMask*\n25 pcs.\nApron\n1 pc\nHard brush on glue\n1 pc\nheadband*\n10 pcs.\nArm cushion\n6pcs\nMeasuring spoon\n\nBase coat*\n6pcs\nMeasuring cup\n\n1 pc\nMehaz nail tip cutter\nreplacement*\n\n3 rolls\nCotton, 500 grams\n1 pc\nMulti purpose stainless\nsteel scissor*\n\n3 btls\nCuticle oil\n\nNail brush*\n\n1 jar\nCuticle cream\n\nNail buffer*\n\n1 gal.\nCuticle remover\n\nNail Clippers*\n\n100 pcs\nDisposable\ntowels/Terry cloth\ntowels\n1 pc\nNail tip container with\nnumbered\n\n1 pc\nDippen disk cork*\n\n--- PDF PAGE 56 ---\nTR Beauty Care Services (Nail Care) NC III\nPromulgated - 52 -\nTOOLS\nEQUIPMENT\nMATERIALS\nQTY\n\nQTY\n\nQTY\n\ncompartments*\n1 pc\nNail tip cutter