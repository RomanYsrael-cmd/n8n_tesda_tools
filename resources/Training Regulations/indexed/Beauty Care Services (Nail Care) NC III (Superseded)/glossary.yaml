  "source_text": "Beauty care\n-\nAn overall beauty treatment intended to change or improve a person’s\nappearance\nBody bleach\n-\nProcess used to lightens the color of hair to a light shade of blonde\nBody scrub\n-\nIs a process of removing dead skin cells and exfoliating the top layer of\nthe skin\nCallus\n-\na hardening of the skin through friction\nCuticle\n-\nOverlapping skin surrounding the nail. It protects the matrix from invading\nbacteria and physical damage\nCosmetic\n-\nAre substances used to enhance the appearance or odor of the human\nbody\nCosmetologist\n-\none who is skilled in the art of improving/enhancing a person’s\nappearance\nEyebrow\narching\n-\nIs a process of arching brows to produce a more precise and uniform\nshapes\nEyelashes\nextension\n-\nAre single strands of synthetic eyelashes that are curved to replicate a\nnatural eyelashes\nEyelashes\nperming\n-\nA procedure used to curl semi-permanent eyelashes\nFacial\n-\nCare for the face that usually involves cleansing and massage and the\napplication of cosmetic creams\nFacial make-up\n-\nUsed to enhance the beautiful part of face and hide defects\nFancy manicure -\nthe art of applying nail polish in decorative fashion\nFoundation\n-\na cosmetic usually used as a base for make-up. It can be in a form of\nliquid, cream, gel, solid creams, in sticks and cakes.\nHand massage\n-\nReplenishes moisture and also alleviates pain and helps you to relax. An\neffective way of removing dead cells\nMake up\n-\nIs a sub-set of cosmetic which refers primarily to colored products\nintended to alter the user’s appearance\nManicure\n-\nit came from the latin word “manus” (hand) and “cura” (care) which\nmeans the care of the hands and nails\nMascara\n-\na cosmetic for covering the eyelashes\nMassage\n-\ninvolves the external manipulation of the body by rubbing, pinching,\nkneading and strolling with the use of hands or an instruments\nNail\n-\nImportant structure made of keratin that has 2 purposes – fingernails act\nas protective plate and enhance sensation of fingertips\nNail structure\n-\nCompose of free edge, nail plate, nail walls, lunula, cuticle, hyponychium,\nnail grove, nail bed, matrix and mantle\nPedicure\n-\nthe professional or artful care of the feet and toenails\nPlucking\n-\nMeans the process of removing hair by mechanically pulling the hair from\nowner’s body\nShaving\n-\nIs the removal of hair, by using a razor or any kind of bladed implements,\nto slice it down to the level of the skin\nSpa\n-\nPlaces devoted to overall well-being through a variety of professional\nservices that encourage the renewal of mind, body and spirit\nTattoo\n-\nIs a marking made by inserting indelible ink into the dermis layer of the\nskin to change the pigment for decorative or other reason\nWaxing\n-\nIs the best temporary method of hair removal\n\n--- PDF PAGE 61 ---\nTR Beauty Care Services (Nail Care) NC III\nPromulgated - 57 -",
