  "source_text": "SECTION 4 NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1\nTo attain the National Qualification of BEAUTY CARE SERVICES (NAIL\nCARE) NC III, the candidate MUST demonstrate competence in all the units\nof competency listed in Section 1. Successful candidates shall be awarded a\nNational Certificate signed by the TESDA Director General.\n4.2\nThe qualification of Beauty Care Services (Nail Care) NC III may be attained\nthrough demonstration of competency through project-type assessment\ncovering all the following core units of the qualification:\n\n4.2.1 Perform creative nail design\n4.2.2 Perform artificial nail extensions\n\n4.3\nAssessment shall focus on the core units of competency. The basic and\ncommon units shall be integrated or assessed concurrently with the core\nunits.\n\n4.4\nThe following are qualified to apply for assessment and certification:\n\n4.4.1 Graduates of formal, non-formal and informal including enterprise-\nbased training programs\n4.4.2 Experienced workers (wage employed or self employed)\n\n4.5\nThe guidelines on assessment and certification are discussed in detail in the\n“Procedures Manual on Assessment and Certification” and “Guidelines on the\nImplementation of the Philippine TVET Qualification and Certification System\n(PTQCS)”.\n\n--- PDF PAGE 59 ---\nTR Beauty Care Services (Nail Care) NC III\nPromulgated - 55 -\nPerform\nhair\nbleaching\n\n"
