        "evidence_guide": {
          "source_text": "1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nDemonstrated sufficient knowledge of the factors\ninfluencing negotiation to achieve agreed outcome.\n1.2\nParticipated in negotiation with at least one person to\nachieve an agreed outcome.\n\n2. Underpinning\nknowledge and\nattitudes\n2.1\nCodes of practice and guidelines for the organization\n2.2\nOrganizations policy and procedures for negotiations\n2.3\nDecision making and conflict resolution strategies\nprocedures\n2.4\nProblem solving strategies on how to deal with\nunexpected questions and attitudes during\nnegotiation\n2.5\nFlexibility\n2.6\nEmpathy\n\n3. Underpinning skills\n3.1\nInterpersonal skills to develop rapport with other\nparties\n3.2\nCommunication skills (verbal and listening)\n3.3\nObservation skills\n3.4\nNegotiation skills\n\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nRoom with facilities necessary for the negotiation\nprocess\n4.2\nHuman resources (negotiators)\n\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1\nObservation/demonstration and questioning\n5.2\nPortfolio assessment\n5.3\nOral and written questioning\n5.4\nThird party report\n\n6. Context of\nassessment\n6.1\nCompetency to be assessed in real work environment\nor in a simulated workplace setting.\n\n--- PDF PAGE 14 ---\nTR Beauty Care Services (Nail Care) NC III\nPromulgated - 10 -\nUNIT OF COMPETENCY :\nSOLVE PROBLEMS RELATED TO WORK\nACTIVITIES\n\nUNIT CODE\n:"
        },
        "source_text": "500311111\n\nUNIT DESCRIPTOR\n:\nThis unit covers the skills, knowledge and attitudes\nrequired to collect information in order to negotiate to a\ndesired outcome and participate in the negotiation.\n\nELEMENT\nPERFORMANCE CRITERIA\nBold &Italicized fonts are elaborated in the Range of Variables\n1. Plan negotiations\n1.1\nInformation on preparing for negotiation is identified\nand included in the plan\n1.2\nInformation on creating non verbal environments for\npositive negotiating is identified and included in the\nplan\n1.3\nInformation on active listening is identified and\nincluded in the plan\n1.4\nInformation on different questioning techniques is\nidentified and included in the plan\n1.5\nInformation is checked to ensure it is correct and up-\nto- date\n\n2. Participate in\nnegotiations\n2.1\nCriteria for successful outcome are agreed upon by\nall parties\n2.2\nDesired outcome of all parties are considered.\n2.3\nAppropriate language is used throughout the\nnegotiation\n2.4\nA variety of questioning techniques are used.\n2.5\nThe issues and processes are documented and\nagreed upon by all parties\n2.6\nPossible solutions are discussed and their viability\nassessed\n2.7\nAreas for agreement are confirmed and recorded\n2.8\nFollow-up action is agreed upon by all parties\n\n--- PDF PAGE 12 ---\nTR Beauty Care Services (Nail Care) NC III\nPromulgated - 8 -\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Preparing for\nnegotiation\n1.1\nBackground information on other parties to the\nnegotiation\n1.2\nGood understanding of topic to be negotiated\n1.3\nClear understanding of desired outcome/s\n1.4\nPersonal attributes\n1.4.1 self awareness\n1.4.2 self esteem\n1.4.3 objectivity\n1.4.4 empathy\n1.4.5 respect for others\n1.5\nInterpersonal skills\n1.5.1 listening/reflecting\n1.5.2 non verbal communication\n1.5.3 assertiveness\n1.5.4 behavior labeling\n1.5.5 testing understanding\n1.5.6 seeking information\n1.5.7 self disclosing\n1.6\nAnalytic skills\n1.6.1 observing differences between content and\nprocess\n1.6.2 identifying bargaining information\n1.6.3 applying strategies to manage process\n1.6.4 applying steps in negotiating process\n1.6.5 strategies to manage conflict\n1.6.6 steps in negotiating process\n1.6.7 options within organization and externally for\nresolving conflict\n\n2. Non verbal\nenvironments\n2.1\nFriendly reception\n2.2\nWarm and welcoming room\n2.3\nRefreshments offered\n2.4\nLead in conversation before negotiation begins\n\n3. Active listening\n3.1\nAttentive\n3.2\nDon’t interrupt\n3.3\nGood posture\n3.4\nMaintain eye contact\n3.5\nReflective listening\n\n4. Questioning\ntechniques\n4.1\nDirect\n4.2\nIndirect\n4.3\nOpen-ended\n\n--- PDF PAGE 13 ---\nTR Beauty Care Services (Nail Care) NC III\nPromulgated - 9 -\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nDemonstrated sufficient knowledge of the factors\ninfluencing negotiation to achieve agreed outcome.\n1.2\nParticipated in negotiation with at least one person to\nachieve an agreed outcome.\n\n2. Underpinning\nknowledge and\nattitudes\n2.1\nCodes of practice and guidelines for the organization\n2.2\nOrganizations policy and procedures for negotiations\n2.3\nDecision making and conflict resolution strategies\nprocedures\n2.4\nProblem solving strategies on how to deal with\nunexpected questions and attitudes during\nnegotiation\n2.5\nFlexibility\n2.6\nEmpathy\n\n3. Underpinning skills\n3.1\nInterpersonal skills to develop rapport with other\nparties\n3.2\nCommunication skills (verbal and listening)\n3.3\nObservation skills\n3.4\nNegotiation skills\n\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nRoom with facilities necessary for the negotiation\nprocess\n4.2\nHuman resources (negotiators)\n\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1\nObservation/demonstration and questioning\n5.2\nPortfolio assessment\n5.3\nOral and written questioning\n5.4\nThird party report\n\n6. Context of\nassessment\n6.1\nCompetency to be assessed in real work environment\nor in a simulated workplace setting.\n\n--- PDF PAGE 14 ---\nTR Beauty Care Services (Nail Care) NC III\nPromulgated - 10 -\nUNIT OF COMPETENCY :\nSOLVE PROBLEMS RELATED TO WORK\nACTIVITIES\n\nUNIT CODE\n:"
