s \n \n2.  Underpinning \nknowledge and \nattitudes \n2.1 \nFundamental operation (addition, subtraction, \ndivision, multiplication) \n2.2 \nMeasurement system \n2.3 \nPrecision and accuracy \n2.4 \nBasic measuring tools/devices \n \n3.  Underpinning skills \n3.1 \nApplying mathematical computations \n3.2 \nUsing calculator \n3.3 \nUsing different measuring tools \n \n4.  Resource \nimplications \nThe following resources MUST be provided: \n4.1 \nCalculator \n4.2 \nBasic measuring tools \n4.3 \nCase Problems \n \n5.  Method of \nassessment \nCompetency may be assessed through: \n5.1 \nAuthenticated portfolio \n5.2 \nWritten Test \n5.3 \nInterview/Oral Questioning \n5.4 \nDemonstration with questioning \n \n6.  Context of \nAssessment \n6.1 \nCompetency may be assessed in the work place or in \na simulated work place setting\n",
