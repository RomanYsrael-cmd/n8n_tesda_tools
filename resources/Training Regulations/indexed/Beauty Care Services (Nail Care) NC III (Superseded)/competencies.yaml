        "source_title": "PERFORM CREATIVE NAIL DESIGN",
        "source_text": "--- PDF PAGE 37 ---\nTR Beauty Care Services (Nail Care) NC III \nPromulgated                                   - 33 - \nCORE COMPETENCIES \n \nUNIT OF COMPETENCY : \nPERFORM CREATIVE NAIL DESIGN \n \nUNIT CODE \n: \nHCS515331 \n \nUNIT DESCRIPTOR          : \nThis unit covers the knowledge, skills and attitude in \nexecuting creative design on fingernails and toenails.  \nThis involves preparing the client, cleaning of nails, \nand applying desired and agreed creative design. \nELEMENT \nPERFORMANCE CRITERIA \nBold &Italicized fonts are elaborated in the Range of Variables \n1. Prepare client \n1.1 \nClient is consulted on the type of desired nail service \nactivity and possible health restrictions. \n1.2 \nTreatment area, tools,  equipment, implement and \nmaterials are prepared for identified nail service activity \naccording to OH&S requirements \n1.3 \nNail and skin condition are identified by physical and \nvisual check and specific client requirements to be \nnoted and adopt necessary safety precautions. \n1.4 \nContra-indications \nincluding \ninfections \nand \nnail \ndisorders are identified and referred to professionals \nfor treatment.  \n1.5 \nClient is positioned safely and comfortably, and \nprovided with protective clothing material \n2. Perform cleaning and \ncutting of nails \n2.1 \n Appropriate sanitized tools and equipment, supplies \nand materials are selected and prepared according to \nsalon procedures \n2.2 \nHands and feet are disinfected sanitized, cleaned and \ndried completely \n2.3 \nNails are cleaned in accordance with established or \nacceptable procedures. \n2.4 \nNails are trimmed and filed based on client’s desired \nshape. \n2.5 \nFingers are lightly massaged following prescribed \nmovements \n2.6 \nClient’s safety and comfort is ensured during the \nentire process. \n2.7 \nFirst-aid is applied in case of accidental cuts and \nwounds \n3. Apply different \ncreative nail designs \n3.1 \nNail designs are applied according to client’s choice  \n3.2 \nDesigns are identically applied on all nails \n3.3 \nNail designs/ornaments are applied following \nmanufacturer’s instructions \n3.4 \nResults are checked to be correct and well-balanced, \nsmooth, neat and  if free from excess product on cuticle \nand nail walls \n4 Perform post service \nactivities \n4.1 \nClient is advised on after treatment care service in \naccordance with salon policies and procedures \n4.2 \nTools, equipment, supplies and materials are \ndisinfected and stored according to environment and \nsafety regulations \n4.3 \nWorkstation is sanitized and prepared for the \nsucceeding salon activities \n4.4 \nWastes are disposed according to environmental \nrequirements\n\n--- PDF PAGE 38 ---\nTR Beauty Care Services (Nail Care) NC III \nPromulgated                                   - 34 - \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Types of clients \n1.1 \nLadies \n1.2 \nMen \n \n2. Nail service activity \n2.1 \nManicure \n2.2 \nPedicure \n \n3. Tools, equipment, \nimplements and \nmaterials \nEquipment \n3.1 \nManicuring Table \n3.2 \nAdjustable Lamp \n3.3 \nClients Chair \n3.4 \nManicurist Chair or Stool \n3.5 \nFinger Bowl \n3.6 \nDisinfection Container \n3.7 \nClient’s Arm Cushion \n3.8 \nWipe Container/ Container for Cotton \n3.9 \nSupply Tray \nImplements \n3.10 Wooden/Metal Pusher \n3.11 Abrasive nails and buffers \n3.12 Nipper \n3.13 Tweezers \n3.14 Nail Brush \n3.15 Chamois Buffer \n3.16 Nail Clippers \nMaterials \n3.17 Disposable towels/Terry cloth towels \n3.18 Brushes and applicators \n3.19 Cotton balls, pads, or pledgets \n3.20 Plastic/Metal Spatulas \n3.21 Trash Containers \n \n4. Nail/Skin Condition \n4.1 \nBruised nail \n4.2 \nBitten nail       \n4.3 \nHang Nail  \n \n5. Contra-indications \n4.3 \n Bacterial, viral, or fungal infections \n4.4 \n Warts \n4.5 \nInflamed skin \n4.6 \nVisible non-normal nails \n4.7 \nRashes \n4.8 \nBlisters/corns/calluses \n4.9 \nHeel fissures \n4.10 Bunions \n4.11 Hammer toes \n4.12 Circulatory problems\n\n--- PDF PAGE 39 ---\nTR Beauty Care Services (Nail Care) NC III \nPromulgated                                   - 35 - \n \nVARIABLE \nRANGE \n6. Nail disorders \n6.1 \nWavy Ridges - Corrugation \n6.2 \nDepression - Furrous \n6.3 \nWhite Spots - Leuconychia \n6.4 \nHypertrophy - Onychauxis \n6.5 \nWasting Away - Atrophy \n6.6 \nPterygium \n6.7 \nBitten Nails - Onycophagy \n6.8 \nBrittle Nails – Onychorrhexis \n \n7. Professionals \n7.1 \nMedical practitioner \n7.2 \nComplementary therapist \n \n8. Established or \nacceptable \nprocedures. \nMay include but are not limited to: \n8.1      Remove the old nail polish using nail polish remover \n8.2      Cut nails to the desired length and shape \n8.3 \nFile the nails in one direction to shape \n8.4 \nApply cuticle remover to soften cuticles. \n8.5 \nGently push back the cuticles. \n8.6 \nTrim the cuticle without damaging the nail border. \n8.7 \nApply antiseptic solution to the trimmed cuticle \n8.8 \nDesign nail based on client’s desired/preferred \ncreative nail design \n \n9.  Massage Movement \n9.1 \nSpreading \n9.2 \nPressing \n9.3 \nCircular Movement \n9.4 \nStretching \n9.5 \nPulling \n \n10. Nail designs/ \nornaments \n10.1 Artificial nail extension \n10.2 Fancy Nail Design \n10.3 Airbrush Nail Design \n10.4 Stick on Nail Design \n \n11 \nEnvironment and \nsafety regulations \n11.1 Occupational Health and safety \n11.2 5S Procedures \n11.3 3R Concepts\n\n--- PDF PAGE 40 ---\nTR Beauty Care Services (Nail Care) NC III \nPromulgated                                   - 36 - \nEVIDENCE GUIDE \n \n1. Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1 \nConsulted client on desired creative nail service activity \n1.2 \nSelected necessary tools, equipment, supplies and \nmaterials based on specific nail service activity following \nOH&S requirements \n1.3 \nChecked and assessed nail, skin condition and adopt \nnecessary safety procedures according to client’s \nspecific requirements  \n1.4 \nObserved proper handling of chemicals and protection \n1.5 \nPositioned client comfortably and safely and provided \nappropriate protective clothing materials. \n1.6 \nCleaned and disinfected nails making sure that cuticles \nare pushed gently without damaging nail borders \n1.7 \nCut and trimmed nails according to client requirements \n1.8 \nApplied nail designs/ornaments  following \nmanufacturer’s instructions \n1.9 \nChecked results and applied necessary retouches \naccording to the clients desired outcome \n1.10 Applied appropriate treatment on accidental cuts \n \n2. Underpinning \nknowledge  \n \n2.1 \nDifferent Creative Nail Designs \n2.2 \nKinds of Nail Polish \n2.3 \nCode of Ethics \n2.4 \nTypes of Skin and Nail Condition \n2.5 \nDOH and OH&S Requirements \n2.6 \nMassage Movements \n2.7 \nNail and Skin Condition Analysis (Disease/Disorder) \n2.8 \nSalon Policies / Procedures \n2.9 \nDifferent Nail Cutting Tools  \n2.10 Different Nail Designing Tools \n2.11 First-aid treatment \n2.12 Environment and safety regulations \n• Occupational Health and safety \n• 5S Procedures \n• 3R Concepts\n\n--- PDF PAGE 41 ---\nTR Beauty Care Services (Nail Care) NC III \nPromulgated                                   - 37 - \n \n3.  Underpinning skills \n3.1 \nApplying different nail design \n3.2 \nNegotiation skills \n3.3 \nCommunication skills \n3.4 \nHandling tools and equipment \n3.5 \nApplying nail polish \n3.6 \nCleaning technique \n3.7 \nShaping nail technique \n3.8 \nCutting / Trimming of nails \n3.9 \nPerforming hand massage \n3.10 Observing proper posture \n3.11 Applying correct massage technique \n3.12 Analyzing skin and nail condition \n3.13 Observing code of ethics \n3.14 Compliance on DOH and OH&S requirements \n3.15 Applying first-aid treatment \n \n4. Resource \nimplications \nThe following resources MUST be provided: \n4.1     Model \n4.2     Tools, equipment and supplies/materials relevant to the \nactivity to be performed \n4.3      Work area/facilities \n \n5. Method of \nassessment \nCompetency may be assessed through: \n5.1     Demonstration with Oral Questioning \n5.2     Third Party Report  \n5.3     Portfolio \n \n6. Context of \nassessment \n6.1     Assessment may be conducted in the workplace or in a \nsimulated environment\n",
