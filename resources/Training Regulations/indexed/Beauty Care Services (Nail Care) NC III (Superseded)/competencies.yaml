        "evidence_guide": {
          "source_text": "1. Critical aspects\nof competency\nAssessment requires evidence that the candidate:\n1.1\nConsulted client on desired nail service activity and specific\nrequirements\n1.2\nChecked and analyze client’s skin, nail condition, structure,\nshape and style\n1.3\nRecognized nail disorder and give advice or referral to\nappropriate personnel\n1.4\nSelected and prepared sanitized tools, equipment and\nappropriate supplies and materials\n1.5\nObserved proper handling of chemicals and protection\n1.6\nAttached nail tip in accordance with established or\nacceptable procedures\n1.7\nApplied/refilled acrylic nails in accordance with established\nor acceptable procedures\n1.8\nAttached sculptured nails in accordance with established or\nacceptable procedures\n1.9\nPerformed post-service activities\n1.10 Massaged hand following standard procedures and safety\nrequirements\n1.11 Applied base coat and top seal coat using long strokes and\nsingle direction\n1.12 Applied agreed nail polish color using light sweeping\nstrokes around the cuticle and nail\n1.13 Checked outcome and apply finishing touches according to\nsalon standard\n1.14 Used questioning and listening skills to ensure client’s\nsafety and comfort during the entire process\n\n2. Underpinning\nknowledge\n2.1\nShapes of Nails\n2.2\nDifferent nail extension\n2.3\nDifferent nail design\n2.4\nAnalysis of Nail Condition and Disorder\n2.5\nNail Extension Techniques and Procedures\n2.6\nProduct Specification\n2.7\nHand Massage Movements\n2.8\nCode of Ethics\n2.9\nDOH Rules and Regulations\n2.10 OH& S Rules and Regulations\n2.11 Salon Policies and Procedures\n2.12 Different Kinds of Antiseptic\n2.13 First-aid Treatment\n2.14 Environment and safety regulations\n• Occupational Health and safety\n• 5S Procedures\n• 3R Concepts\n\n--- PDF PAGE 49 ---\nTR Beauty Care Services (Nail Care) NC III\nPromulgated - 45 -\n\n3. Underpinning\nskills\n3.1\nApplication Techniques in Nail Extension\n3.2\nHand Massage Techniques\n3.3\nNegotiations Skills\n3.4\nProper Use of Tools and Equipment\n3.5\nClient Relations\n3.6\nCompliance on DOH and OH&S requirements\n3.7\nApplying first-aid treatment\n3.8\nObserving Code of Ethics\n\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nModel\n4.2\nTools, equipment, supplies/materials relevant to the activity\nto be performed\n4.3\nWork area and facilities\n\n5. Method of\nassessment\nCompetency may be assess through:\n5.1\nDemonstration with oral questioning\n5.2\nThird Party Report\n5.3\nPortfolio\n\n6. Context of\nassessment\n6.1 Assessment may be conducted in the workplace or in a\nsimulated environment\n\n--- PDF PAGE 50 ---\nTR Beauty Care Services (Nail Care) NC III\nPromulgated - 46 -"
        },
        "source_text": "HCS515332\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitude in\napplying artificial nail extensions. This involves the\napplications of nail tip, acrylic nails and sculptured\nnails.\nELEMENT\nPERFORMANCE CRITERIA\nBold &Italicized fonts are elaborated in the Range of Variables\n1. Prepare client\n\n1.1\nClient is consulted and agreement is signed and\nrecorded on desired nail service activity and\nrequirements\n1.2\nClients’ skin and hand nail structure and condition\nare checked and analyzed\n1.3\nClient is provided with protective materials for hygiene\npurposes\n1.4\nNail disorder and diseases is recognized and if\nnecessary, referred to appropriate personnel\n1.5\nContra-indications are identified, explained to client\nand referred to appropriate professional where\nrequired\n1.6\nTools and equipment, supplies and materials are\nselected and prepared according to salon procedures\n1.7 Client’s nails is cleaned according to standard\nprocedures\n\n2. Attach nail tip\n2.1\nType of tips is selected based on client’s nail plate\n2.2\nNail tip is attached in accordance with established or\nacceptable procedures and manufacturer’s instructions\n2.3\nNail tip is checked if securely attached onto the natural\nnail plate\n2.4\nFinished result is evaluated in accordance with client’s\ndesired outcome\n2.5\nNail tip is designed if required by the client\n\n3. Apply/refill acrylic\n(methacrylate) nails\n3.1\nNail dehydrator is applied using appropriate tools in\naccordance with manufacturer’s specification\n3.2\nNail acrylic mixture is prepared in accordance with\nproduct specifications\n3.3\nNail acrylic is applied/refilled in accordance with\nestablished or acceptable procedures and\nmanufacturer’s instructions\n3.4\nFinished result is evaluated in accordance with client’s\ndesired outcome\n3.5\nAcrylic nail is designed if required by the client\n\n--- PDF PAGE 43 ---\nTR Beauty Care Services (Nail Care) NC III\nPromulgated - 39 -\n\nELEMENT\nPERFORMANCE CRITERIA\nBold &Italicized fonts are elaborated in the Range of Variables\n4. Attach sculptured nail 4.1\nSculptured nail size is selected based on client’s nail\nplate\n4.2\nSculptured nail is attached in accordance with\nestablished or acceptable procedures and product\nspecifications\n4.3\nFinished result is evaluated in accordance with client’s\ndesired outcome\n4.4\nSculptured nail is designed if required by the client\n\n5. Perform post-service\nactivities\n5.1\nClients are scheduled to return for manicure and\nmaintenance\n5.2\nClients were given professional recommendations on the\nproducts that can be used for maintenance.\n5.3\nWhere necessary, nail extensions are removed in\naccordance with standard procedures\n5.4\nWorking area were cleaned and discarded used\nmaterials in the trash receptacle according to\nenvironment and safety regulations\n5.5\nImplements and multiuse tools were sanitized and\ndisinfected and waste is disposed according to\nenvironment and safety regulations and workplace\npolicies and procedures\n\n--- PDF PAGE 44 ---\nTR Beauty Care Services (Nail Care) NC III\nPromulgated - 40 -\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Nail structure and\ncondition\n1.1\nBruised nail\n1.2\nBitten nail *copy this to perform manicure ….\n1.3\nHang Nail\n\n2. Nail Disorder\n2.1\nWavy Ridges - Corrugation\n2.2\nDepression - Furrous\n2.3\nWhite Spots - Leuconychia\n2.4\nHypertrophy - Onychauxis\n2.5\nWasting Away - Atrophy\n2.6\nPterygium\n2.7\nBitten Nails - Onycophagy\n2.8\nBrittle Nails – Onychorrhexis\n\n3. Nail Diseases\n3.1\n Onychomycosis/Tinea Unguium-Ringworm of the nail\n3.2\nTinea manus-Ringworm of the hand\n3.3\nTinea Pedis- Ringworm of the foot\n3.4\nPoronychia/Felon-Inflammation of the skin around\nnails\n3.5\nOnychoptosis-Shedding/falling of nails\n3.6\nOnychia-Inflammation of the nail matrix\n3.7\nOnychatrophia- Athrophy of the nail/wasting away of\nnails\n3.8\nOnycholysis-Loosening/separation of nails\n3.9\nBlue nails\n3.10 Eggshell nails\n3.11 Corrugation\n3.12 Kolionychia-spoon nails with concave shape\n3.13 Furrows\n3.14 Onychogryposis- Claw nails\n3.15 Onychocryptosis- Ingrown nails\n\n4. Contra indications\n4.1\nBacterial, viral, or fungal infections\n4.2\nWarts\n4.3\nInflamed skin\n4.4\nVisible non-normal nails\n4.5\nRashes\n4.6\nBlisters/corns/calluses\n4.7\nHeel fissures\n4.8\nBunions\n4.9\nHammer toes\n4.10 Circulatory problems\n\n--- PDF PAGE 45 ---\nTR Beauty Care Services (Nail Care) NC III\nPromulgated - 41 -\n\nVARIABLE\nRANGE\n5. Professionals\n5.1 Medical practitioner\n5.2 Complementary therapist\n\n6. Equipment /Tools\n\nEquipment\n6.1\nManicuring Table\n6.2\nAdjustable Lamp\n6.3\nClients Chair\n6.4\nManicurist Chair or Stool\n6.5\nFinger Bowl\n6.6\nDisinfection Container\n6.7\nClient’s Arm Cushion\n6.8\nWipe Container/ Container for Cotton\n6.9\nSupply Tray\nImplements\n6.10 Wooden/Metal Pusher\n6.11 Abrasive nails and buffers\n6.12 Nipper\n6.13 Tweezers\n6.14 Nail Brush\n6.15 Chamois Buffer\n6.16 Nail Clippers\n6.17 Nail file (coarse, fine)\n6.18 Nail buffer\n6.19 Emery board\n6.20 Point brush\nMaterials\n6.21 Disposable towels/Terry cloth towels\n6.22 Brushes and applicators\n6.23 Plastic/Metal Spatulas\n6.24 Trash Containers\n\n7. Supplies\nNail Tips\n\n7.1\nAbrasive board\n7.2\nBuffer Block\n7.3\nNail tip adhesive\n7.4\nNail tips\n7.5\nCotton balls, pads, or pledgets\n7.6\nNail glue\n7.7\nAlcohol\n7.8\nPaper towel\n7.9\nSweet almond (olive oil)\n\n--- PDF PAGE 46 ---\nTR Beauty Care Services (Nail Care) NC III\nPromulgated - 42 -\n\nVARIABLE\nRANGE\n\nAcrylic (Methacrylate) Nails\n7.10 Acrylic (Methacrylate) monomer liquid\n7.11 Acrylic (Methacrylate) polomer powder\n7.12 Nail dehydrator\n7.13 Nail primer\n7.14 Nail forms\n7.15 Nail tips\n7.16 Nail adhesive\n7.17 Nail adhesive (gel type)\n7.18 Dappen dish\n7.19 Paint brush\n7.20 Nail glue\n7.21 Alcohol\n7.22 Paper towel\n\nSculptured Nail\n7.23 Mixing cup\n7.24 Acrylic nipper\n7.25 Nail lengthener powder\n7.26 Special liquid to dilute powder\n7.27 Brushes for application\n7.28 Solvent\n7.29 Base coat\n7.30 Tip coat sealer\n\n8. Type of tips\n8.1\nFull-well\n8.2\nHalf-well\n8.3\nWell-less\n\n9. Established or\nacceptable\nprocedures\n9.1\nApply nail tip\no Clean and trim nails to the base of fingertip\no Buff nails to remove shine.\no Select the size of nail tip in accordance to the\nsizes of fingertips\no Glue the nail tip to the tip of your natural nails\nthe press it down firmly\no Let the glue dry on each of your finger\no Shape Nail\n9.2\nApply acrylic nail\no Clean nails (manicure/pedicure)\no Buff nails to remove shine.\no Apply nail dehydrator\no Position nail form\no Apply nail primer liquid and form product bead\no Prepare monomer liquid and polymer powder.\n\n--- PDF PAGE 47 ---\nTR Beauty Care Services (Nail Care) NC III\nPromulgated - 43 -\n\nVARIABLE\nRANGE\n\no Dip brush in monomer and form bead, gently\nlay the bead onto the middle of your nail, pat it\ndown with the brush, and gently slide your\nbrush to the tip of your nail\no Lightly swipe your acrylic brush onto a paper\ntowel and dip it back into the liquid, then into\nthe acrylic powder\no Using same technique, do this until your nail is\ncompletely covered in acrylic\no Paint smoothed down acrylics with a coat of\nclear nail polish.\no Once the polish has dried, wash hands to\nremove any acrylic powder\n9.3\nAttach sculptured nail\no Remove nail polish\no Etch only the way the nail grows, from the\ncuticle to free-edge, until there is no shine on\nthe nailplate\no Brush nail plate with plastic manicure brush to\nremove particles from the nail plate\no Apply primer to all the nails and let it dry\no Apply nail forms by selecting the size that fits\nthe shape of the nailbed.\no Apply primer (2nd and 3rd time)\no Apply sculptured nail ball on the tip of the nail,\non the nail body, in the cuticle area and on the\nstress area\no File the sculptured nail\no Buff and apply cuticle oil to nail and cuticles\no Wash hands\no Polish hand by applying a coat\n9.4\nRemove Sculpture nail\no Soak sculptured nail in solvent\no Remove sculptured nail using acrylic nipper\n\n10. Maintenance\nproducts\n10.1 Polish\n10.2 Top coat\n10.3 Hand lotions\n\n--- PDF PAGE 48 ---\nTR Beauty Care Services (Nail Care) NC III\nPromulgated - 44 -\nEVIDENCE GUIDE\n\n1. Critical aspects\nof competency\nAssessment requires evidence that the candidate:\n1.1\nConsulted client on desired nail service activity and specific\nrequirements\n1.2\nChecked and analyze client’s skin, nail condition, structure,\nshape and style\n1.3\nRecognized nail disorder and give advice or referral to\nappropriate personnel\n1.4\nSelected and prepared sanitized tools, equipment and\nappropriate supplies and materials\n1.5\nObserved proper handling of chemicals and protection\n1.6\nAttached nail tip in accordance with established or\nacceptable procedures\n1.7\nApplied/refilled acrylic nails in accordance with established\nor acceptable procedures\n1.8\nAttached sculptured nails in accordance with established or\nacceptable procedures\n1.9\nPerformed post-service activities\n1.10 Massaged hand following standard procedures and safety\nrequirements\n1.11 Applied base coat and top seal coat using long strokes and\nsingle direction\n1.12 Applied agreed nail polish color using light sweeping\nstrokes around the cuticle and nail\n1.13 Checked outcome and apply finishing touches according to\nsalon standard\n1.14 Used questioning and listening skills to ensure client’s\nsafety and comfort during the entire process\n\n2. Underpinning\nknowledge\n2.1\nShapes of Nails\n2.2\nDifferent nail extension\n2.3\nDifferent nail design\n2.4\nAnalysis of Nail Condition and Disorder\n2.5\nNail Extension Techniques and Procedures\n2.6\nProduct Specification\n2.7\nHand Massage Movements\n2.8\nCode of Ethics\n2.9\nDOH Rules and Regulations\n2.10 OH& S Rules and Regulations\n2.11 Salon Policies and Procedures\n2.12 Different Kinds of Antiseptic\n2.13 First-aid Treatment\n2.14 Environment and safety regulations\n• Occupational Health and safety\n• 5S Procedures\n• 3R Concepts\n\n--- PDF PAGE 49 ---\nTR Beauty Care Services (Nail Care) NC III\nPromulgated - 45 -\n\n3. Underpinning\nskills\n3.1\nApplication Techniques in Nail Extension\n3.2\nHand Massage Techniques\n3.3\nNegotiations Skills\n3.4\nProper Use of Tools and Equipment\n3.5\nClient Relations\n3.6\nCompliance on DOH and OH&S requirements\n3.7\nApplying first-aid treatment\n3.8\nObserving Code of Ethics\n\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nModel\n4.2\nTools, equipment, supplies/materials relevant to the activity\nto be performed\n4.3\nWork area and facilities\n\n5. Method of\nassessment\nCompetency may be assess through:\n5.1\nDemonstration with oral questioning\n5.2\nThird Party Report\n5.3\nPortfolio\n\n6. Context of\nassessment\n6.1 Assessment may be conducted in the workplace or in a\nsimulated environment\n\n--- PDF PAGE 50 ---\nTR Beauty Care Services (Nail Care) NC III\nPromulgated - 46 -"
