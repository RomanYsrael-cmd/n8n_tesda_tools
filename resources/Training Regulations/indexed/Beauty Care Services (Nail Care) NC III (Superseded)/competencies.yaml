          "source_text": "1. Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1 \nConsulted client on desired creative nail service activity \n1.2 \nSelected necessary tools, equipment, supplies and \nmaterials based on specific nail service activity following \nOH&S requirements \n1.3 \nChecked and assessed nail, skin condition and adopt \nnecessary safety procedures according to client’s \nspecific requirements  \n1.4 \nObserved proper handling of chemicals and protection \n1.5 \nPositioned client comfortably and safely and provided \nappropriate protective clothing materials. \n1.6 \nCleaned and disinfected nails making sure that cuticles \nare pushed gently without damaging nail borders \n1.7 \nCut and trimmed nails according to client requirements \n1.8 \nApplied nail designs/ornaments  following \nmanufacturer’s instructions \n1.9 \nChecked results and applied necessary retouches \naccording to the clients desired outcome \n1.10 Applied appropriate treatment on accidental cuts \n \n2. Underpinning \nknowledge  \n \n2.1 \nDifferent Creative Nail Designs \n2.2 \nKinds of Nail Polish \n2.3 \nCode of Ethics \n2.4 \nTypes of Skin and Nail Condition \n2.5 \nDOH and OH&S Requirements \n2.6 \nMassage Movements \n2.7 \nNail and Skin Condition Analysis (Disease/Disorder) \n2.8 \nSalon Policies / Procedures \n2.9 \nDifferent Nail Cutting Tools  \n2.10 Different Nail Designing Tools \n2.11 First-aid treatment \n2.12 Environment and safety regulations \n• Occupational Health and safety \n• 5S Procedures \n• 3R Concepts\n\n--- PDF PAGE 41 ---\nTR Beauty Care Services (Nail Care) NC III \nPromulgated                                   - 37 - \n \n3.  Underpinning skills \n3.1 \nApplying different nail design \n3.2 \nNegotiation skills \n3.3 \nCommunication skills \n3.4 \nHandling tools and equipment \n3.5 \nApplying nail polish \n3.6 \nCleaning technique \n3.7 \nShaping nail technique \n3.8 \nCutting / Trimming of nails \n3.9 \nPerforming hand massage \n3.10 Observing proper posture \n3.11 Applying correct massage technique \n3.12 Analyzing skin and nail condition \n3.13 Observing code of ethics \n3.14 Compliance on DOH and OH&S requirements \n3.15 Applying first-aid treatment \n \n4. Resource \nimplications \nThe following resources MUST be provided: \n4.1     Model \n4.2     Tools, equipment and supplies/materials relevant to the \nactivity to be performed \n4.3      Work area/facilities \n \n5. Method of \nassessment \nCompetency may be assessed through: \n5.1     Demonstration with Oral Questioning \n5.2     Third Party Report  \n5.3     Portfolio \n \n6. Context of \nassessment \n6.1     Assessment may be conducted in the workplace or in a \nsimulated environment",
