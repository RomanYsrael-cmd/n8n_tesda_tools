        "source_text": "HCS516201\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes\nrequired in building and maintaining an effective\nrelationship with clients, customers and the public.\n\nELEMENT\nPERFORMANCE CRITERIA\nBold &Italicized fonts are elaborated in the Range of Variables\n1. Maintain a\nprofessional image\n\n1.1\nUniform and personal grooming maintained to\nassignment requirements\n1.2\nPersonal presence maintained according to\nemployer standards\n1.3\nVisible work area kept tidy and uncluttered\n1.4\nEquipment stored according to assignment\nrequirements\n\n2. Meet client/customer\nrequirements\n2.1\nClient requirements identified and understood by\nreferral to the assignment instructions\n2.2\nClient requirements met according to the assignment\ninstructions\n2.3\nChanges to client’s needs and requirements\nmonitored and appropriate action taken\n2.4\nAll communication with the client or customer is clear\nand complies with assignment requirements\n\n3. Build credibility with\ncustomers/clients\n3.1\nClient expectations for reliability, punctuality and\nappearance adhered to\n3.2\nPossible causes of client/customer dissatisfaction\nidentified, dealt with and recorded according to\nemployer policy\n3.3\nClient fully informed of all relevant security matters in\na timely manner and according to agreed reporting\nprocedures\n\n--- PDF PAGE 24 ---\nTR Beauty Care Services (Nail Care) NC III\nPromulgated - 20 -\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Personal Presence\n\nMay include:\n1.1\nStance\n1.2\nPosture\n1.3\nBody Language\n1.4\nDemeanour\n1.5\nGrooming\n\n2. Employer Standards\nMay include:\n2.1\nStanding Orders\n\n3. Client Requirements\nMay include:\n3.1\n Assignment Instructions\n3.2\n Post Orders\n3.3\n Scope to modify instructions/orders in light of\nchanged situations\n\n4. Assignment\nInstructions\nMay be conveyed in:\n4.1\nWriting\n4.2\nVerbally\n4.3\nElectronically\n\n5. Client’s Needs and\nRequirements\nMay be detected by:\n5.1\nReview of the client brief and/or assignment\ninstructions\n5.2\nDiscussion with the client/customer\n\n6. Appropriate Action\nMay include:\n6.1\nImplementing required changes\n6.2\nReferral to appropriate employer personnel\n6.3\nClarification of client needs and instructions\n\n7. Customers\nMay include:\n7.1\nAll members of the public\n\n--- PDF PAGE 25 ---\nTR Beauty Care Services (Nail Care) NC III\nPromulgated - 21 -\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nMaintained a professional image.\n1.2\nInterpreted client/customer requirements from\ninformation contained in the client brief and/or\nassignment instructions.\n1.3\nDealt successfully with a variety of client/customer\ninteractions.\n1.4\nMonitored and acted on changing client or customer\nneeds.\n1.5\nMet client/customer requirements.\n1.6\nBuilt credibility with customers/clients.\n\n2. Underpinning\nknowledge and\nattitudes\n2.1\nUniform and personal grooming requirements of the\nemployer and the client\n2.2\nOccupational Health and safety requirement for the\nassignment\n2.3\nAssignment Instructions\n\n3. Underpinning skills\n3.1\nAttention to detail when completing client/employer\ndocumentation\n3.2\nInterpersonal and communication skills required in\nclient contact assignments\n3.3\nCustomer service skills required to meet\nclient/customer needs\n3.4\nPunctuality\n3.5\nCustomer Service\n3.6\nTelephone Technique\n3.7\nProblem Solving and Negotiation\n3.8\nMaintaining Records\n\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nAssessment Centers/Venues\n4.2\nAccredited Assessors\n4.3\nModes of Assessment\n4.4\nEvaluation Reports\n4.5\nAccess to a relevant venue, equipment and materials\n4.6\nAssignment Instructions\n4.7\nLogbooks\n4.8\nOperational manuals and makers’/customers’\ninstructions (if relevant)\n4.9\nAssessment Instruments, including personal planner\nand assessment record book\n\n--- PDF PAGE 26 ---\nTR Beauty Care Services (Nail Care) NC III\nPromulgated - 22 -\n\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1\nWritten Test/Examination\n5.2\nDemonstration with questioning\n5.3\nObservation with questioning\n\n6. Context of\nassessment\n6.1\nCompany\n6.2\nOn-Site\n6.3\nAssessment activities are carried out through TESDA\naccredited assessment centers/venues by using\nclosely simulated workplace environment.\n6.4\nContinuous assessment in an institutional setting that\nstimulates the conditions of performance describe in\nthe elements, performance criteria and range of\nvariables statement that make up this unit.\n6.5\nContinuous assessment in the workplace, taking into\naccount the range of variables affecting performance.\n6.6\nSelf-assessment on the same terms as those\ndescribed above.\n6.7\nSimulated assessment or critical incident\nassessment, provided that the critical incident\ninvolves assessment against performance criteria and\nan evaluation of underpinning knowledge and skill\nrequired to achieve the required performance criteria.\n\n--- PDF PAGE 27 ---\nTR Beauty Care Services (Nail Care) NC III\nPromulgated - 23 -\nUNIT OF COMPETENCY :\nMANAGE OWN PERFORMANCE\n\nUNIT CODE\n:"
