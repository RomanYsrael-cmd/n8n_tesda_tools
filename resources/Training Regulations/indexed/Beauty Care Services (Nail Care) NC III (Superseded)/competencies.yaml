ck into the liquid, then into\nthe acrylic powder\no Using same technique, do this until your nail is\ncompletely covered in acrylic\no Paint smoothed down acrylics with a coat of\nclear nail polish.\no Once the polish has dried, wash hands to\nremove any acrylic powder\n9.3\nAttach sculptured nail\no Remove nail polish\no Etch only the way the nail grows, from the\ncuticle to free-edge, until there is no shine on\nthe nailplate\no Brush nail plate with plastic manicure brush to\nremove particles from the nail plate\no Apply primer to all the nails and let it dry\no Apply nail forms by selecting the size that fits\nthe shape of the nailbed.\no Apply primer (2nd and 3rd time)\no Apply sculptured nail ball on the tip of the nail,\non the nail body, in the cuticle area and on the\nstress area\no File the sculptured nail\no Buff and apply cuticle oil to nail and cuticles\no Wash hands\no Polish hand by applying a coat\n9.4\nRemove Sculpture nail\no Soak sculptured nail in solvent\no Remove sculptured nail using acrylic nipper\n\n10. Maintenance\nproducts\n10.1 Polish\n10.2 Top coat\n10.3 Hand lotions\n\n--- PDF PAGE 48 ---\nTR Beauty Care Services (Nail Care) NC III\nPromulgated - 44 -\nEVIDENCE GUIDE\n\n1. Critical aspects\nof competency\nAssessment requires evidence that the candidate:\n1.1\nConsulted client on desired nail service activity and specific\nrequirements\n1.2\nChecked and analyze client’s skin, nail condition, structure,\nshape and style\n1.3\nRecognized nail disorder and give advice or referral to\nappropriate personnel\n1.4\nSelected and prepared sanitized tools, equipment and\nappropriate supplies and materials\n1.5\nObserved proper handling of chemicals and protection\n1.6\nAttached nail tip in accordance with established or\nacceptable procedures\n1.7\nApplied/refilled acrylic nails in accordance with established\nor acceptable procedures\n1.8\nAttached sculptured nails in accordance with established or\nacceptable procedures\n1.9\nPerformed post-service activities\n1.10 Massaged hand following standard procedures and safety\nrequirements\n1.11 Applied base coat and top seal coat using long strokes and\nsingle direction\n1.12 Applied agreed nail polish color using light sweeping\nstrokes around the cuticle and nail\n1.13 Checked outcome and apply finishing touches according to\nsalon standard\n1.14 Used questioning and listening skills to ensure client’s\nsafety and comfort during the entire process\n\n2. Underpinning\nknowledge\n2.1\nShapes of Nails\n2.2\nDifferent nail extension\n2.3\nDifferent nail design\n2.4\nAnalysis of Nail Condition and Disorder\n2.5\nNail Extension Techniques and Procedures\n2.6\nProduct Specification\n2.7\nHand Massage Movements\n2.8\nCode of Ethics\n2.9\nDOH Rules and Regulations\n2.10 OH& S Rules and Regulations\n2.11 Salon Policies and Procedures\n2.12 Different Kinds of Antiseptic\n2.13 First-aid Treatment\n2.14 Environment and safety regulations\n• Occupational Health and safety\n• 5S Procedures\n• 3R Concepts\n\n--- PDF PAGE 49 ---\nTR Beauty Care Services (Nail Care) NC III\nPromulgated - 45 -\n\n3. Underpinning\nskills\n3.1\nApplication Techniques in Nail Extension\n3.2\nHand Massage Techniques\n3.3\nNegotiations Skills\n3.4\nProper Use of Tools and Equipment\n3.5\nClient Relations\n3.6\nCompliance on DOH and OH&S requirements\n3.7\nApplying first-aid treatment\n3.8\nObserving Code of Ethics\n\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nModel\n4.2\nTools, equipment, supplies/materials relevant to the activity\nto be performed\n4.3\nWork area and facilities\n\n5. Method of\nassessment\nCompetency may be assess through:\n5.1\nDemonstration with oral questioning\n5.2\nThird Party Report\n5.3\nPortfolio\n\n6. Context of\nassessment\n6.1 Assessment may be conducted in the workplace or in a\nsimulated environment\n\n--- PDF PAGE 50 ---\nTR Beauty Care Services (Nail Care) NC III\nPromulgated - 46 -"
