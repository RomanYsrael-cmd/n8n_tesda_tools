  "source_section_text": "SECTION 2 COMPETENCY STANDARDS\n\nThis section gives the details of the contents of the basic, common and core\nunits of competency required in BEAUTY CARE SERVICES (NAIL CARE) NC III.\n\nBASIC COMPETENCIES\n\nUNIT OF COMPETENCY :\nLEAD WORKPLACE COMMUNICATION\n\nUNIT CODE\n:\n500311109\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes\nrequired to lead in the dissemination and discussion\nof ideas, information and issues in the workplace.\n\nELEMENT\nPERFORMANCE CRITERIA\nBold &Italicized fonts are elaborated in the Range of Variables\n1. Communicate\ninformation about\nworkplace processes\n1.1\nAppropriate communication method is selected\n1.2\nMultiple operations involving several topics areas are\ncommunicated accordingly\n1.3\nQuestions are used to gain extra information\n1.4\nCorrect sources of information are identified\n1.5\nInformation is selected and organized correctly\n1.6\nVerbal and written reporting is undertaken when\nrequired\n1.7\nCommunication skills are maintained in all situations\n2. Lead workplace\ndiscussions\n2.1.\nResponse to workplace issues is sought\n2.2.\nResponse to workplace issues is provided\nimmediately\n2.3.\nConstructive contributions are made to workplace\ndiscussions on such issues as production, quality and\nsafety\n2.4.\nGoals/objectives and action plan undertaken in the\nworkplace are communicated\n3. Identify and\ncommunicate issues\narising in the\nworkplace\n3.1\nIssues and problems are identified as they arise\n3.2\nInformation regarding problems and issues are\norganized coherently to ensure clear and effective\ncommunication\n3.3\nDialogue is initiated with appropriate personnel.\n3.4\nCommunication problems and issues are raised as\nthey arise\n\n--- PDF PAGE 7 ---\nTR Beauty Care Services (Nail Care) NC III\nPromulgated - 3 -\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Methods of\ncommunication\n1.1\nNon-verbal gestures\n1.2\nVerbal\n1.3\nFace to face\n1.4\nTwo-way radio\n1.5\nSpeaking to groups\n1.6\nUsing telephone\n1.7\nWritten\n1.8\nInternet\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nDealt with a range of communication/information at\none time\n1.2\nMade constructive contributions in workplace issues.\n1.3\nSought workplace issues effectively\n1.4\nResponded to workplace issues promptly\n1.5\nPresented information clearly and effectively written\nform\n1.6\nUsed appropriate sources of information\n1.7\nAsked appropriate questions\n1.8\nProvided accurate information\n2. Underpinning\nknowledge and\nattitudes\n2.1\nOrganization requirements for written and electronic\ncommunication methods\n2.2\nEffective verbal communication methods\n3. Underpinning skills\n3.1\nOrganize information\n3.2\nUnderstand and convey intended meaning\n3.3\nParticipate in variety of workplace discussions\n3.4\nComply with organization requirements for the use of\nwritten and electronic communication methods\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nVariety of Information\n4.2\nCommunication tools\n4.3\nSimulated workplace\n5. Method of\nassessment\nCompetency MUST be assessed through:\n5.1\nDirect Observation with questioning\n5.2\nInterview\n6. Context of\nassessment\n6.1\nCompetency may be assessed in the workplace or in\nsimulated workplace environment\n6.2\nAssessment shall be observed while task are being\nundertaken whether individually or in-group\n\n--- PDF PAGE 8 ---\nTR Beauty Care Services (Nail Care) NC III\nPromulgated - 4 -\nUNIT OF COMPETENCY :\nLEAD SMALL TEAMS\n\nUNIT CODE\n:\n500311110\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes to\nlead small teams including setting and maintaining\nteam and individual performance standards.\n\nELEMENT\nPERFORMANCE CRITERIA\nBold &Italicized fonts are elaborated in the Range of Variables\n1. Provide team\nleadership\n1.1\nWork requirements are identified and presented to\nteam members.\n1.2\nReasons for instructions and requirements are\ncommunicated to team members.\n1.3\nTeam members’ queries and concerns are\nrecognized, discussed and dealt with.\n2. Assign\nresponsibilities\n2.1\nDuties, and responsibilities are allocated having\nregard to the skills, knowledge and aptitude required\nto properly undertake the assigned task and\naccording to company policy.\n2.2\nDuties are allocated having regard to individual\npreference, domestic and personal considerations,\nwhenever possible.\n3. Set performance\nexpectations for team\nmembers\n3.1\nPerformance expectations are established based on\nclient needs and according to assignment\nrequirements.\n3.2\nPerformance expectations are based on individual\nteam members duties and area of responsibility.\n3.3\nPerformance expectations are discussed and\ndisseminated to individual team members.\n4. Supervise team\nperformance\n4.1\nMonitoring of performance takes place against\ndefined performance criteria and/or assignment\ninstructions and corrective action taken if required.\n4.2\nTeam members are provided with feedback, positive\nsupport and advice on strategies to overcome any\ndeficiencies.\n4.3\nPerformance issues which cannot be rectified or\naddressed within the team are referenced to\nappropriate personnel according to employer policy.\n4.4\nTeam members are kept informed of any changes in\nthe priority allocated to assignments or tasks which\nmight impact on client/customer needs and\nsatisfaction.\n4.5\nTeam operations are monitored to ensure that\nemployer/client needs and requirements are met.\n4.6\nFollow-up communication is provided on all issues\naffecting the team.\n4.7\nAll relevant documentation is completed in\naccordance with company procedures.\n\n--- PDF PAGE 9 ---\nTR Beauty Care Services (Nail Care) NC III\nPromulgated - 5 -\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Work requirements\n1.1 Client Profile\n1.2 Assignment instructions\n\n2. Team member’s\nconcerns\n2.1 Roster/shift details\n3. Monitor performance\n3.1\nFormal process\n3.2\nInformal process\n\n4. Feedback\n4.1\nFormal process\n4.2\nInformal process\n\n5. Performance issues\n5.1\nWork output\n5.2\nWork quality\n5.3\nTeam participation\n5.4\nCompliance with workplace protocols\n5.5\nSafety\n5.6\nCustomer service\n\n--- PDF PAGE 10 ---\nTR Beauty Care Services (Nail Care) NC III\nPromulgated - 6 -\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nMaintained or improved individuals and/or team\nperformance given a variety of possible scenario\n1.2\nAssessed and monitored team and individual\nperformance against set criteria\n1.3\nRepresented concerns of a team and individual to\nnext level of management or appropriate specialist\nand to negotiate on their behalf\n1.4\nAllocated duties and responsibilities, having regard to\nindividual’s knowledge, skills and aptitude and the\nneeds of the tasks to be performed\n1.5\nSet and communicated performance expectations for\na range of tasks and duties within the team and\nprovided feedback to team members\n\n2. Underpinning\nknowledge and\nattitudes\n2.1\nCompany policies and procedures\n2.2\nRelevant legal requirements\n2.3\nHow performance expectations are set\n2.4\nMethods of Monitoring Performance\n2.5\nClient expectations\n2.6\nTeam member’s duties and responsibilities\n\n3. Underpinning skills\n3.1\nCommunication skills required for leading teams\n3.2\nInformal performance counseling skills\n3.3\nTeam building skills\n3.4\nNegotiating skills\n\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nAccess to relevant workplace or appropriately\nsimulated environment where assessment can take\nplace\n4.2\nMaterials relevant to the proposed activity or task\n\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1\nDirect observations of work activities of the individual\nmember in relation to the work activities of the group\n5.2\nObservation of simulation and/or role play involving\nthe participation of individual member to the\nattainment of organizational goal\n5.3\nCase studies and scenarios as a basis for discussion\nof issues and strategies in teamwork\n\n6. Context of\nassessment\n6.1\nCompetency assessment may occur in workplace or\nany appropriately simulated environment.\n6.2\nAssessment shall be observed while task are being\nundertaken whether individually or in-group.\n\n--- PDF PAGE 11 ---\nTR Beauty Care Services (Nail Care) NC III\nPromulgated - 7 -\nUNIT OF COMPETENCY :\nDEVELOP AND PRACTICE NEGOTIATION SKILLS\n\nUNIT CODE\n:\n500311111\n\nUNIT DESCRIPTOR\n:\nThis unit covers the skills, knowledge and attitudes\nrequired to collect information in order to negotiate to a\ndesired outcome and participate in the negotiation.\n\nELEMENT\nPERFORMANCE CRITERIA\nBold &Italicized fonts are elaborated in the Range of Variables\n1. Plan negotiations\n1.1\nInformation on preparing for negotiation is identified\nand included in the plan\n1.2\nInformation on creating non verbal environments for\npositive negotiating is identified and included in the\nplan\n1.3\nInformation on active listening is identified and\nincluded in the plan\n1.4\nInformation on different questioning techniques is\nidentified and included in the plan\n1.5\nInformation is checked to ensure it is correct and up-\nto- date\n\n2. Participate in\nnegotiations\n2.1\nCriteria for successful outcome are agreed upon by\nall parties\n2.2\nDesired outcome of all parties are considered.\n2.3\nAppropriate language is used throughout the\nnegotiation\n2.4\nA variety of questioning techniques are used.\n2.5\nThe issues and processes are documented and\nagreed upon by all parties\n2.6\nPossible solutions are discussed and their viability\nassessed\n2.7\nAreas for agreement are confirmed and recorded\n2.8\nFollow-up action is agreed upon by all parties\n\n--- PDF PAGE 12 ---\nTR Beauty Care Services (Nail Care) NC III\nPromulgated - 8 -\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Preparing for\nnegotiation\n1.1\nBackground information on other parties to the\nnegotiation\n1.2\nGood understanding of topic to be negotiated\n1.3\nClear understanding of desired outcome/s\n1.4\nPersonal attributes\n1.4.1 self awareness\n1.4.2 self esteem\n1.4.3 objectivity\n1.4.4 empathy\n1.4.5 respect for others\n1.5\nInterpersonal skills\n1.5.1 listening/reflecting\n1.5.2 non verbal communication\n1.5.3 assertiveness\n1.5.4 behavior labeling\n1.5.5 testing understanding\n1.5.6 seeking information\n1.5.7 self disclosing\n1.6\nAnalytic skills\n1.6.1 observing differences between content and\nprocess\n1.6.2 identifying bargaining information\n1.6.3 applying strategies to manage process\n1.6.4 applying steps in negotiating process\n1.6.5 strategies to manage conflict\n1.6.6 steps in negotiating process\n1.6.7 options within organization and externally for\nresolving conflict\n\n2. Non verbal\nenvironments\n2.1\nFriendly reception\n2.2\nWarm and welcoming room\n2.3\nRefreshments offered\n2.4\nLead in conversation before negotiation begins\n\n3. Active listening\n3.1\nAttentive\n3.2\nDon’t interrupt\n3.3\nGood posture\n3.4\nMaintain eye contact\n3.5\nReflective listening\n\n4. Questioning\ntechniques\n4.1\nDirect\n4.2\nIndirect\n4.3\nOpen-ended\n\n--- PDF PAGE 13 ---\nTR Beauty Care Services (Nail Care) NC III\nPromulgated - 9 -\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nDemonstrated sufficient knowledge of the factors\ninfluencing negotiation to achieve agreed outcome.\n1.2\nParticipated in negotiation with at least one person to\nachieve an agreed outcome.\n\n2. Underpinning\nknowledge and\nattitudes\n2.1\nCodes of practice and guidelines for the organization\n2.2\nOrganizations policy and procedures for negotiations\n2.3\nDecision making and conflict resolution strategies\nprocedures\n2.4\nProblem solving strategies on how to deal with\nunexpected questions and attitudes during\nnegotiation\n2.5\nFlexibility\n2.6\nEmpathy\n\n3. Underpinning skills\n3.1\nInterpersonal skills to develop rapport with other\nparties\n3.2\nCommunication skills (verbal and listening)\n3.3\nObservation skills\n3.4\nNegotiation skills\n\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nRoom with facilities necessary for the negotiation\nprocess\n4.2\nHuman resources (negotiators)\n\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1\nObservation/demonstration and questioning\n5.2\nPortfolio assessment\n5.3\nOral and written questioning\n5.4\nThird party report\n\n6. Context of\nassessment\n6.1\nCompetency to be assessed in real work environment\nor in a simulated workplace setting.\n\n--- PDF PAGE 14 ---\nTR Beauty Care Services (Nail Care) NC III\nPromulgated - 10 -\nUNIT OF COMPETENCY :\nSOLVE PROBLEMS RELATED TO WORK\nACTIVITIES\n\nUNIT CODE\n:\n500311112\n\nUNIT DESCRIPTOR\n:\nThis unit of covers the knowledge, skills and attitudes\nrequired to solve problems in the workplace including\nthe application of problem solving techniques and to\ndetermine and resolve the root cause of problems.\n\nELEMENT\nPERFORMANCE CRITERIA\nBold &Italicized fonts are elaborated in the Range of Variables\n1. Identify the problem\n1.1\nVariances are identified from normal operating\nparameters; and product quality.\n1.2\nExtent, cause and nature are of the problem are\ndefined through observation, investigation and\nanalytical techniques.\n1.3\nProblems are clearly stated and specified.\n\n2. Determine\nfundamental causes\nof the problem\n2.1\nPossible causes are identified based on experience\nand the use of problem solving tools / analytical\ntechniques.\n2.2\nPossible cause statements are developed based on\nfindings.\n2.3\nFundamental causes are identified per results of\ninvestigation conducted.\n\n3. Determine corrective\naction\n3.1\nAll possible options are considered for resolution of\nthe problem.\n3.2\nStrengths and weaknesses of possible options are\nconsidered.\n3.3\nCorrective actions are determined to resolve the\nproblem and possible future causes.\n3.4\nAction plans are developed identifying measurable\nobjectives, resource needs and timelines in\naccordance with safety and operating procedures.\n\n4. Provide\nrecommendation/s to\nmanager\n4.1\nReport on recommendations is prepared.\n4.2\nRecommendations are presented to appropriate\npersonnel.\n4.3\nRecommendations are followed-up, if required.\n\n--- PDF PAGE 15 ---\nTR Beauty Care Services (Nail Care) NC III\nPromulgated - 11 -\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Analytical techniques\n1.1\nBrainstorming\n1.2\nIntuitions/Logic\n1.3\nCause and effect diagrams\n1.4\nPareto analysis\n1.5\nSWOT analysis\n1.6\nGant chart, Pert CPM and graphs\n1.7\nScattergrams\n\n2. Problem\n2.1\nNon – routine process and quality problems\n2.2\nEquipment selection, availability and failure\n2.3\nTeamwork and work allocation problem\n2.4\nSafety and emergency situations and incidents\n\n3. Action plans\n\n3.1\nPriority requirements\n3.2\nMeasurable objectives\n3.3\nResource requirements\n3.4\nTimelines\n3.5\nCo-ordination and feedback requirements\n3.6\nSafety requirements\n3.7\nRisk assessment\n3.8\nEnvironmental requirements\n\n--- PDF PAGE 16 ---\nTR Beauty Care Services (Nail Care) NC III\nPromulgated - 12 -\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nIdentified the problem.\n1.2\nDetermined the fundamental causes of the problem.\n1.3\nDetermined the correct / preventive action.\n1.4\nProvided recommendation to manager.\nThese aspects may be best assessed using a range\nof scenarios / case studies / what ifs as a stimulus\nwith a walk through forming part of the response.\nThese assessment activities should include a range\nof problems, including new, unusual and improbable\nsituations that may have happened.\n\n2. Underpinning\nknowledge 