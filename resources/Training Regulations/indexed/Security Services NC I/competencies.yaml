        "source_title": "PERFORM BASIC COMMUNICATION SKILLS",
        "source_text": "--- PDF PAGE 32 ---\nTR Security Services NC I \nPromulgated May 31, 2005 \n-7- \n \nUNIT OF COMPETENCY : \nPERFORM BASIC COMMUNICATION SKILLS \n \nUNIT CODE                      : \nHCS516303 \n \nUNIT DESCRIPTOR         : \nThis unit covers the knowledge, skills and attitudes in performing \nbasic communication skills. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1. Prepare written \nreports \n \n \n1.1 \nSupplies, materials and equipment are prepared in \naccordance with standard operating procedures. \n1.2 \n Reports are prepared in accordance with the recommended \nformat. \n1.3 \n Reports are prepared is in accordance with standard \noperating procedures. \n2.  Transmit reports  \n3.1 \nCommunication equipment is prepared in accordance with \nmanufacturers’ instruction. \n3.1 \nCommunication equipment is used in accordance with unit \nspecification. \n3.1 \nCommunication call signs and language are used in \naccordance with transmitting messages procedures. \n3.1 \nCommunication courtesy are observed/applied in     \naccordance with transmitting messages procedures. \n2.5 \nCommunication equipment are stored in a safe place as per \nstandard operating procedures. \n3.  Demonstrate and \ninterpret hand signals \n3.1 \nHand signals are demonstrated and interpreted in \naccordance with standard operating procedures. \n \n4.  Maintain security \nlogbook \n4.1 \nAccurate and detailed report of facts and events in the guard \npost is properly signed by the guard on duty. \n4.2 \nEvents and facts are recorded in chronological   order. \n4.3 \nSecurity logbook is properly signed by both guards during \nturn-over. \n4.4 \nConfidentiality of information is maintained at all times. \n4.5 \nProper safekeeping of security logbook is maintained in \naccordance with organizational guidelines.\n\n--- PDF PAGE 33 ---\nTR Security Services NC I \nPromulgated May 31, 2005 \n-8- \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.  Report  \n \n1.1 \nIncident /Spot report \n1.2 \nViolations Report \n1.3 \nInformation Report \n1.4 \nSecurity Equipment Report \n1.5 \nExplanation Report \n1.6 \nDaily Activity Report \n2.  Communication  \n      Equipment \n2.1 \nHand Held Radio \n2.2 \nTelephone \n2.3 \nCell phones \n2.4 \nIntercom \n2.5 \nWriting Paraphernalia \n3.  Call Signs and  \n     Languages \n3.1 \nTen (10) Codes \n3.2 \nPhonetics Language \n3.3 \nRadio Language \n4.  Messages \n \n4.1 \nMemorandum \n4.2 \nCirculars, Directives, Orders (Verbal or Written) \n4.3 \nGuidelines and Policies \n5.  Hand Signals \n5.1 \nTraffic Signals \n \n \nEVIDENCE GUIDE   \n \n1.  Critical aspects of \ncompetency      \nAssessment requires evidence that the candidate: \n1.1 \nPrepared written reports \n1.2 \nFollowed written report format \n1.3 \nPrepared supplies, materials and equipment \n1.4 \nTransmitted reports \n1.5 \nPrepared communication equipment \n1.6 \nUsed communication call signs and languages \n1.7 \nFollowed transmitting message procedures \n1.8 \nFollowed communication equipment storage procedures \n1.9 \nDemonstrated and interpreted hand signals \n1.10 Maintained security logbook  \n2.  Underpinning \nknowledge and \nattitudes \n2.1 \nR.A. 5487 as amended \n2.2 \nSources of Information \n2.3 \nKinds of Report \n2.4 \nCustomer Relations \n2.5 \nHuman Relations \n2.6 \nLog/Note Taking \n2.7 \nElements of Good Report  \n2.8 \nQualities of Good Report \n2.9 \nParts of a Report \n2.10 Protocol Usage \n2.11 Value Formation  \n2.12 Leadership Concept \n2.13 Assignment Instruction   \n2.14 Communication Codes \n2.15 Operation of Communication Equipment \n2.16 Control System Operation \n2.17 Client’s Instruction\n\n--- PDF PAGE 34 ---\nTR Security Services NC I \nPromulgated May 31, 2005 \n-9- \n \n2.18 Company’s Physical Lay-Out \n2.19 Building Security Procedures \n2.20 Legal Aspect \n2.21 Gender Awareness and Development \n3.  Underpinning skills \n3.1 \nPreparing written reports \n3.2 \nPreparing supplies, materials and equipment \n3.3 \nTransmitting reports using communication equipment \n3.4 \nPreparing communication equipment \n3.5 \nFollowing communication equipment installation procedures \n3.6 \nUsing communication call signs and languages \n3.7 \nDemonstrating and interpreting hand signals \n3.8 \nMonitoring skills \n3.9 \nSecuring area \n3.10 Observing suspicious movements \n3.11 Communicating clearly with client’s/customers \n3.12 Giving instructions \n3.13 Directing traffic \n3.14 Records Keeping \n4.  Resource \nImplications \nThe following resources MUST be provided: \n4.1 \nAssessment Centers/Venues \n4.2 \nAccredited Assessors \n4.3 \nModes of Assessment \n4.4 \nEvaluation Reports \n4.5 \nAccess to relevant venue, security equipment and materials \n4.6 \nAssignment Instructions \n4.7 \nLogbooks \n4.8 \nOperational manuals and makers’/customers’ instruction (if \nrelevant) \n4.9 \nAssessment instruments, including personal planner and \nassessment record book \n5.  Method of \nassessment \nCompetency may be assessed through: \n5.1  \nDemonstration with questioning \n5.2  \nObservation with questioning \n5.3  \nWritten Test/Examination \n6.  Context of \nassessment \n6.1  \nCompany \n6.2 \nOn-Site \n6.3 \n Assessment activities are carried out through TESDA/PNP \naccredited assessment centers/venues by using closely \nsimulated work place environment\n",
