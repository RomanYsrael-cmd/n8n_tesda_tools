        "source_text": "HCS516305\n\nUNIT DESCRIPTOR :\nThis unit covers the knowledge, skills and attitudes in performing\ndefensive techniques.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Demonstrate\ndisarming\ntechniques\n1.1\nPersonal safety equipment is prepared in accordance with\nstandard operating procedures.\n1.2\nWarm-up exercises are performed in accordance with\nstandard operating procedures.\n1.3\nDisarming techniques are demonstrated in accordance with\nstandard operating procedures.\n1.4\nMartial arts equipment and personal safety equipment are\nstored in accordance with standard operating procedures.\n2. Demonstrate use of\nbaton\n2.1\nPersonal safety equipment is prepared in accordance with\nstandard operating procedures.\n2.2\nWarm-up exercises are performed in accordance with\nstandard operating procedures.\n2.3\nBaton is used in accordance with arnis techniques.\n2.4\nMartial arts equipment and personal safety equipment are\nstored in accordance with standard operating procedures.\n3. Demonstrate use of\nhandcuff\n\n3.1\nPersonal safety equipment is prepared in accordance with\nstandard operating procedures.\n3.2\nWarm-up exercises are performed in accordance with\nstandard operating procedures.\n3.3\nHandcuff is used in accordance with law enforcement\nstandards.\n3.4\nPersonal safety equipment are stored in accordance with\nstandard operating procedures.\n4. Demonstrate the use\nof stun devices\n4.1\nPersonal safety equipment is prepared in accordance with\nstandard operating procedures.\n4.2\nWarm-up exercises are performed in accordance with\nstandard operating procedures.\n4.3\nStun devises are used in accordance with law enforcement\nstandards.\n4.4\nPersonal safety equipment is stored in accordance with\nstandard operating procedures.\n\n--- PDF PAGE 45 ---\nTR Security Services NC I\nPromulgated May 31, 2005\n-20-\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Disarming\nTechniques\n1.1\nBalances and Stances\n1.2\nSafety Positions\n1.3\nPunching, Blocking and Kicking Techniques\n1.4\nHold and Release Techniques\n1.5\nHold and Counter Hold Techniques\n1.6\nHold and Take Down Techniques\n1.7\nArresting Techniques\n1.8\nWeaponry Techniques:\n1.8.1 Knife Defense\n1.8.2 Enemy Grabbing Weapon Techniques\n2. Martial Arts Safety\nEquipment\n\n2.1\nKimono\n2.2\nDummy Knife and Gun\n2.3\nMatting or Its Equivalent\n2.4\nSafety Head Gear\n2.5\nMartial Arts Armour Vest\n2.6\nMartial Arts Gloves\n2.7 Leg and Arm Protector\n3. Handcuff Uses\n3.1\nHandcuffing techniques\n3.2\nSingle Man Handcuffing Techniques\n3.3\nPositioning Techniques\n4. Stun Devices\n\n4.1\nTypes\n4.1.1 Electronic\n4.1.2 Manual\n4.2\nUses\n4.2.1 In accordance with manufacturers instructions\n\n--- PDF PAGE 46 ---\nTR Security Services NC I\nPromulgated May 31, 2005\n-21-\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nDemonstrated disarming techniques\n1.2\nDemonstrated use of baton\n1.3\nDemonstrated use of handcuffs\n1.4\nDemonstrated use of stun devices\n1.5\nPrepared personal safety equipment\n1.6\nPrepared martial arts safety equipment\n1.7\nStored personal safety equipment\n1.8\nStored martial arts safety equipment\n2. Underpinning\nknowledge and\nattitudes\n2.1\nR.A. 5487 as amended\n2.2\nLog/Note Taking\n2.3\nDefense Tactics\n2.4\nFirst Aid\n2.5\nHygiene and Sanitation\n2.6\nPersonal Hygiene\n2.7\nBaton Use, Care and Handling Procedures\n2.8\nHandcuffs Use, Care and Handling Procedures\n2.9\nStun Devices Use, Care and Handling Procedure\n2.10 Martial Arts Equipment, Use, Care and Handling\n2.11 Leadership Concept\n3. Underpinning skills\n3.1\nDefensive Tactics\n3.2\nDefensive Tactics\n3.3\nMonitoring Skills\n3.4\nSecuring area\n3.5\nObserving suspicious movements\n3.6\nDescribing/identifying movements\n3.7\nCommunicating clearly with clients/customers\n3.8\nGiving instructions\n3.9\nRecords Keeping\n4. Resource\nimplications\nThe following resources MUST be provided\n4.1\nAssessment Centers/Venues\n4.2\nAccredited Assessors\n4.3\nModes of Assessment\n4.4\nEvaluation Reports\n4.5\nAccess to relevant venue, security equipment and materials\n4.6\nAssignment Instructions\n4.7\nLogbooks\n4.8\nOperational manuals and makers’/customers’ instruction (if\nrelevant)\n4.9\nAssessment instruments, including personal planner and\nassessment record book\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1\nDemonstration with questioning\n5.2\nObservation with questioning\n5.3\nWritten Test/Examination\n6. Context of\nassessment\n6.1\nCompany\n6.2\nOn-Site\n6.3\nAssessment activities are carried out through TESDA/PNP\naccredited assessment centers/venues by using closely\nsimulated work place environment\n\n--- PDF PAGE 47 ---\nTR Security Services NC I\nPromulgated May 31, 2005\n-22-"
