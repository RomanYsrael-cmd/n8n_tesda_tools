cked in accordance\nwith standard operating procedures (SOPs).\n3.2\nOperational condition of emergency equipment is checked in\naccordance with standard operating procedures (SOPs).\n3.3\nEmergency equipment availability are checked in\naccordance with standard operating procedures (SOPs).\n3.4\nUse of emergency equipment is demonstrated in accordance\nwith manufacturer’s instruction.\n4. Receive and record\nthreats\n4.1\nFunction/role are checked in accordance with standard\noperating procedures (SOPs).\n4.2\nThreat received are recorded and reported in accordance with\nstandard operating procedures (SOPs).\n5. Apply first aid\nprocedures\n5.1\nFirst aid procedures are applied to injuries following safety\nguidelines and procedures.\n5.2\nPersonal belongings of injured victims checked as per\nstandard operating procedures (SOPs).\n5.3\nPersonal identification of victims is checked and verified in\naccordance with standard operating procedures.\n5.4\nAssistance for other people in the area of responsibility (AOR)\nis requested if necessary and in accordance with standard\noperating procedures.\n6. Follow instructions\nduring emergency\n6.1\nEvacuation areas are sealed off and isolated in accordance\nwith standard operating procedures.\n6.2\nDirection and control of escape routes are provided based on\ncompany requirements.\n6.3\nOnlookers/crowds/other persons are controlled and kept at a\nsafe distance from the emergency area and in accordance\nwith standard operating procedures.\n6.4\nEmergency areas are secured and protected in accordance\nwith standard operating procedures.\n6.5\nInjured and sick evacuees are brought to a secured and safe\nplace in accordance with standard operating procedures.\n6.6\nLateral coordination is made in accordance with standard\noperating procedures (SOPs).\n\n--- PDF PAGE 36 ---\nTR Security Services NC I\nPromulgated May 31, 2005\n-11-\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Emergency Plan\n1.1\nTypes of emergencies\n1.2\nPhys