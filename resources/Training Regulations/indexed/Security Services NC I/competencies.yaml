  "source_section_text": "SECTION 2 COMPETENCY STANDARDS\n\nThis section gives the details of the contents of the basic, common and core units of\ncompetency required in SECURITY SERVICES NC I.\n\nBASIC COMPETENCIES\nUNIT OF COMPETENCY :\nRECEIVE AND RESPOND TO WORKPLACE COMMUNICATION\nUNIT CODE\n:\n500311101\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes required to\nreceive, respond and act on verbal and written communication.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Follow routine\nspoken messages\n1.1\nRequired information is gathered by listening attentively and\ncorrectly interpreting or understanding\ninformation/instructions\n1.2\nInstructions/information are properly recorded\n1.3\nInstructions are acted upon immediately in accordance with\ninformation received\n1.4\nClarification is sought from workplace supervisor on all\noccasions when any instruction/information is not clear\n2. Perform workplace\nduties following\nwritten notices\n2.1\nWritten notices and instructions are read and interpreted\ncorrectly in accordance with organizational guidelines\n2.2 Routine written instruction are followed in sequence\n2.3\nFeedback is given to workplace supervisor based on the\ninstructions/information received\n\n--- PDF PAGE 7 ---\nTR Security Services NC I\nPromulgated May 31, 2005\n-3-\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Written notices and\ninstructions\nIt refers to :\n1.1\nHandwritten and printed material\n1.2\nInternal memos\n1.3\nExternal communications\n1.4\nElectronic mail\n1.5\nBriefing notes\n1.6\nGeneral correspondence\n1.7\nMarketing materials\n1.8\nJournal articles\n2. Organizational\nGuidelines\nIt may include:\n2.1\nInformation documentation procedures\n2.2\nCompany policies and procedures\n2.3\nOrganization manuals\n2.4\nService manual\n\n--- PDF PAGE 8 ---\nTR Security Services NC I\nPromulgated May 31, 2005\n-4-\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\n Demonstrated knowledge of organizational procedures for\nhandling verbal and written communications\n1.2\n Received and acted on verbal messages and instructions\n1.3\nDemonstrated competency in recording\ninstructions/information\n2. Underpinning\nknowledge and\nattitudes\n2.1\nKnowledge of organizational policies/guidelines in regard to\nprocessing internal/external information\n2.2\nEthical work practices in handling communications\n2.3\nCommunication process\n3. Underpinning skills\n3.1\nConciseness in receiving and clarifying\nmessages/information/communication\n3.2\nAccuracy in recording messages/information\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nPens\n4.2\nNote pads\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1\nDirect Observation\n5.2\nOral interview\n5.3\nWritten Evaluation\n5.4\nThird Party Report\n6. Context of\nassessment\n6.1\nCompetency may be assessed individually in the actual\nworkplace or simulation environment in TESDA accredited\ninstitutions\n\n--- PDF PAGE 9 ---\nTR Security Services NC I\nPromulgated May 31, 2005\n-5-\n\nUNIT OF COMPETENCY :\nWORK WITH OTHERS\n\nUNIT CODE\n:\n500311102\n\nUNIT DESCRIPTOR\n:\nThis unit covers the skills, knowledge and attitudes required to\ndevelop workplace relationship and contribute in workplace\nactivities.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Develop effective\nworkplace\nrelationship\n1.1\nDuties and responsibilities are done in a positive manner to\npromote cooperation and good relationship\n1.2\nAssistance is sought from workgroup when difficulties arise\nand addressed through discussions\n1.3\nFeedback provided by others in the team is encouraged,\nacknowledged and acted upon\n1.4\nDifferences in personal values and beliefs are respected and\nacknowledged in the development\n2. Contribute to work\ngroup activities\n2.1\nSupport is provided to team members to ensure workgroup\ngoals are met\n2.2\nConstructive contributions to workgroup goals and tasks are\nmade according to organizational requirements\n2.3\nInformation relevant to work is shared with team members to\nensure designated goals are met\n\n--- PDF PAGE 10 ---\nTR Security Services NC I\nPromulgated May 31, 2005\n-6-\n\nRANGE OF VARIABLES\n\n VARIABLE\n RANGE\n1. Duties and\nresponsibilities\n1.1\nJob description and employment arrangements\n1.2\nOrganization’s policy relevant to work role\n1.3\nOrganizational structures\n1.4\nSupervision and accountability requirements including OHS\n1.5\nCode of conduct\n2. Work group\n2.1\nSupervisor or manager\n2.2\nPeers/work colleagues\n2.3\nOther members of the organization\n3. Feedback on\nperformance\n3.1\nFormal/Informal performance appraisal\n3.2\nObtaining feedback from supervisors and colleagues and\nclients\n3.3\nPersonal, reflective behavior strategies\n3.4\nRoutine organizational methods for monitoring service\ndelivery\n4. Providing support to\nteam members\n4.1\nExplaining/clarifying\n4.2\nHelping colleagues\n4.3\nProviding encouragement\n4.4\nProviding feedback to another team member\n4.5\nUndertaking extra tasks if necessary\n5. Organizational\nrequirements\n\n5.1\nGoals, objectives, plans, system and processes\n5.2\nLegal and organization policy/guidelines\n5.3\nOHS policies, procedures and programs\n5.4\nEthical standards\n5.5\nDefined resources parameters\n5.6\nQuality and continuous improvement processes and\nstandards\n\n--- PDF PAGE 11 ---\nTR Security Services NC I\nPromulgated May 31, 2005\n-7-\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\n\nAssessment requires evidence that the candidate:\n1.1\nProvided support to team members to ensure goals are met\n1.2\nActed on feedback from clients and colleagues\n1.3\nAccessed learning opportunities to extend own personal work\ncompetencies to enhance team goals and outcomes\n2. Underpinning\nknowledge and\nattitudes\n2.1\nThe relevant legislation that affects operations, especially with\nregards to safety\n2.2\nReasons why cooperation and good relationships are\nimportant\n2.3\nKnowledge of the organization’s policies, plans and\nprocedures\n2.4\nUnderstanding how to elicit and interpret feedback\n2.5\nKnowledge of workgroup member’s responsibilities and duties\n2.6\nImportance of demonstrating respect and empathy in dealings\nwith colleagues\n2.7\nUnderstanding of how to identify and prioritize personal\ndevelopment opportunities and options\n3. Underpinning skills\n3.1\nAbility to read and understand the organization’s policies and\nwork procedures\n3.2\nWrite simple instructions for particular routine tasks\n3.3\nInterpret information gained from correspondence\n3.4\nCommunication skills to request advice, receive feedback and\nwork with a team\n3.5\nPlanning skills to organized work priorities and arrangement\n3.6\nTechnology skills including the ability to select and use\ntechnology appropriate to a task\n3.7\nAbility to relate to people from a range of social, cultural and\nethnic backgrounds.\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nAccess to relevant workplace or appropriately simulated\nenvironment where assessment can take place\n4.2\nMaterials relevant to the proposed activity or task\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1\nDirect observations of work activities of the individual member\nin relation to the work activities of the group\n5.2\nObservation of simulation and/or role play involving the\nparticipation of individual member to the attainment of\norganizational goal\n5.3\nCase studies and scenarios as a basis for discussion of\nissues and strategies\n6. Context of\nassessment\n6.1\nCompetency assessment may occur in workplace or any\nappropriately simulated environment\n6.2\nAssessment shall be observed while task are being\nundertaken whether individually or in group\n\n--- PDF PAGE 12 ---\nTR Security Services NC I\nPromulgated May 31, 2005\n-8-\n\nUNIT OF COMPETENCY :\nDEMONSTRATE WORK VALUES\n\nUNIT CODE\n:\n500311103\n\nUNIT DESCRIPTOR\n:\nThis\nunit\ncovers\nthe\nknowledge,\nskills,\nand\nattitude\nin\ndemonstrating proper work values.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Define the purpose\nof work\n\n1.1\nOne’s unique sense of purpose for working and the why’s of\nwork are identified, reflected on and clearly defined for one’s\ndevelopment as a person and as a member of society.\n1.2\nPersonal mission is in harmony with company’s values\n2. Apply work\nvalues/ethics\n2.1\nWork values/ethics/concepts are classified and reaffirmed in\naccordance with the transparent company ethical standards,\npolicies and guidelines.\n2.2\nWork practices are undertaken in compliance with industry\nwork ethical standards, organizational policy and guidelines\n2.3\nPersonal behavior and relationships with co-workers and/or\nclients are conducted in accordance with ethical standards,\npolicy and guidelines.\n2.4\nCompany resources are used in accordance with\ntransparent company ethical standard, policies and guidelines.\n3. Deal with ethical\nproblems\n3.1\nCompany ethical standards, organizational policy and\nguidelines on the prevention and reporting of unethical\nconduct are accessed and applied in accordance with\ntransparent company ethical standard, policies and guidelines.\n3.2\nWork incidents/situations are reported and/or resolved in\naccordance with company protocol/guidelines.\n3.3\nResolution and/or referral of ethical problems identified are\nused as learning opportunities.\n4. Maintain integrity of\nconduct in the\nworkplace\n4.1\nPersonal work practices and values are demonstrated\nconsistently with acceptable ethical conduct and company’s\ncore values.\n4.2\nInstructions to co-workers are provided based on ethical,\nlawful and reasonable directives.\n4.3\nCompany values/practices are shared with co-workers using\nappropriate behavior and language.\n\n--- PDF PAGE 13 ---\nTR Security Services NC I\nPromulgated May 31, 2005\n-9-\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Work values/ethics/\nconcepts\nMay include but are not limited to:\n1.1\nCommitment/ Dedication\n1.2\nSense of urgency\n1.3\nSense of purpose\n1.4\nLove for work\n1.5\nHigh motivation\n1.6\nOrderliness\n1.7\nReliability\n1.8\nCompetence\n1.9\nDependability\n1.10 Goal-oriented\n1.11 Sense of responsibility\n1.12 Being knowledgeable\n1.13 Loyalty to work/company\n1.14 Sensitivity to others\n1.15 Compassion/Caring attitude\n1.16 Balancing between family and work\n1.17 Pakikisama\n1.18 Bayanihan spirit/teamwork\n1.19 Sense of nationalism\n2. Work practices\n2.1\nQuality of work\n2.2\nPunctuality\n2.3\nEfficiency\n2.4\nEffectiveness\n2.5\nProductivity\n2.6\nResourcefulness\n2.7\nInnovativeness/Creativity\n2.8\nCost consciousness\n2.9\n5S\n2.10 Attention to details\n3. Incidents/situations\n3.1\nViolent/intense dispute or argument\n3.2\nGambling\n3.3\nUse of prohibited substances\n3.4\nPilferages\n3.5\nDamage to person or property\n3.6\nVandalism\n3.7\nFalsification\n3.8\nBribery\n3.9\nSexual Harassment\n3.10 Blackmail\n4. Company resources\n4.1\nConsumable materials\n4.2\nEquipment/Machineries\n4.3\nHuman\n4.4\nTime\n4.5\nFinancial resources\n5. Instructions\n5.1\nVerbal\n5.2\nWritten\n\n--- PDF PAGE 14 ---\nTR Security Services NC I\nPromulgated May 31, 2005\n-10-\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nDefined one’s unique sense of purpose for working\n1.2\nClarified and affirmed work values/ethics/concepts\nconsistently in the workplace\n1.3\nDemonstrated work practices satisfactorily and consistently in\ncompliance with industry work ethical standards,\norganizational policy and guidelines\n1.4\nDemonstrated personal behavior and relationships with co-\nworkers and/or clients consistent with ethical standards, policy\nand guidelines\n1.5\nUsed company resources in accordance with company ethical\nstandard, policies and guidelines.\n1.6\nFollowed company ethical standards, organizational policy\nand guidelines on the prevention and reporting of unethical\nconduct/behavior\n2. Underpinning\nknowledge and\nattitudes\n2.1\nOccupational health and safety\n2.2\nWork values and ethics\n2.3\nCompany performance and ethical standards\n2.4\nCompany policies and guidelines\n2.5\nFundamental rights at work including gender sensitivity\n2.6\nWork responsibilities/job functions\n2.7\nCorporate social responsibilities\n2.8\nCompany code of conduct/values\n2.9\nBalancing work and family responsibilities\n3. Underpinning skills\n3.1\nInterpersonal skills\n3.2\nCommunication skills\n3.3\nSelf awareness, understanding and acceptance\n3.4\nApplication of good manners and right conduct\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nWorkplace or assessment location\n4.2\nCase studies/Scenarios\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1\nPortfolio Assessment\n5.2\nInterview\n5.3\nThird Party Reports\n6. Context of\nassessment\n6.1\nCompetency may be assessed in the work place or in a\nsimulated work place setting\n\n--- PDF PAGE 15 ---\nTR Security Services NC I\nPromulgated May 31, 2005\n-11-\n\nUNIT OF COMPETENCY :\nPRACTICE HOUSEKEEPING PROCEDURES\n\nUNIT CODE\n:\n500311104\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes required to\napply the basic housekeeping procedures.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Sort and remove\nunnecessary items\n1.1\nReusable, recyclable materials are sorted in accordance with\ncompany/office procedures\n1.2\nUnnecessary items are removed and disposed of in\naccordance with company or office procedures\n2. Arrange items\n2.1\nItems are arranged in accordance with company/office\nhousekeeping procedures\n2.2\nWork area is arranged according to job requirements\n2.3\nActivities are prioritized based on instructions.\n2.4\nItems are provided with clear and visible identification marks\nbased on procedure\n2.5\nSafety equipment and evacuation passages are kept clear\nand accessible based on instructions\n3. Maintain work area,\ntools and equipment\n3.1\nCleanliness and orderliness of work area is maintained in\naccordance with company/office procedures\n3.2\nTools and equipment are cleaned in accordance with\nmanufacturer’s instructions/manual\n3.3\nMinor repairs are performed on tools and equipment in\naccordance with manufacturer’s instruction/manual\n3.4\nDefective tools and equipment are reported to immediate\nsupervisor\n4. Follow standardized\nwork process and\nprocedures\n4.1\nMaterials for common use are maintained in designated area\nbased on procedures\n4.2\nWork is performed according to standard work procedures\n4.3\nAbnormal incidents are reported to immediate supervisor\n5. Perform work\nspontaneously\n5.1\nWork is performed as per instruction\n5.2\nCompany and office decorum are followed and complied with\n5.3\nWork is performed in accordance with occupational health and\nsafety (OHS) requirements\n\n--- PDF PAGE 16 ---\nTR Security Services NC I\nPromulgated May 31, 2005\n-12-\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Unnecessary items\nMay include but are not limited to:\n1.1\n Non-recyclable materials\n1.2\n Unserviceable tools and equipment\n1.3\n Pictures, posters and other materials not related to work\nactivity\n1.4\n Waste materials\n2. Identification marks\n2.1\nLabels\n2.2\nTags\n2.3\nColor coding\n3. Decorum\n3.1\nCompany/ office rules and regulations\n3.2\nCompany/ office uniform\n3.3\nBehavior\n4. Minor repair\nMinor repair include but not limited to:\n4.1\nReplacement of parts\n4.2\nApplication of lubricants\n4.3\nSharpening of tools\n4.4\nTightening of nuts, bolts and screws\n\n EVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nPracticed the basic procedures of 5S\n2. Underpinning\nknowledge and\nattitudes\n2.1\nPrinciples of 5S\n2.2\nWork process and procedures\n2.3\nSafety signs and symbols\n2.4\nGeneral OH&S principles and legislation\n2.5\nEnvironmental requirements relative to work safety\n2.6\nAccident/Hazard reporting procedures\n3. Underpinning skills\n3.1\nBasic communication skills\n3.2\nInterpersonal skills\n3.3\nReading skills required to interpret instructions\n3.4\nReporting/recording accidents and potential hazards\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nFacilities, materials tools and equipment necessary for the\nactivity\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1\nThird party report\n5.2\nInterview\n5.3\nDemonstration with questioning\n6. Context of\nassessment\n6.1\nCompetency may be assessed in the work place or in a\nsimulated work place setting\n\n--- PDF PAGE 17 ---\nTR Security Services NC I\nPromulgated May 31, 2005\n-13-\n\nCOMMON COMPETENCIES\n\nUNIT OF COMPETENCY :\nMAINTAIN AN EFFECTIVE RELATIONSHIP WITH CLIENTS/\nCUSTOMERS\n\nUNIT CODE\n:\nHCS516201\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes required in\nbuilding and maintaining an effective relationship with clients,\ncustomers and the public.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Maintain a\nprofessional image\n\n1.1\nUniform and personal grooming maintained to assignment\nrequirements.\n1.2\nPersonal presence maintained according to employer\nstandards.\n1.3\nVisible work area kept tidy and uncluttered.\n1.4\nEquipment stored according to assignment requirements.\n2. Meet client/customer\nrequirements\n2.1\nClient requirements identified and understood by referral to\nthe assignment instructions.\n2.2\nClient requirements met according to the assignment\ninstructions.\n2.3\nChanges to client’s needs and requirements monitored and\nappropriate action taken.\n2.4\nAll communication with the client or customer is clear and\ncomplies with assignment requirements.\n3. Build credibility with\ncustomers/clients\n3.1\nClient expectations for reliability, punctuality and appearance\nadhered to.\n3.2\nPossible causes of client/customer dissatisfaction identified,\ndealt with and recorded according to employer policy.\n3.3\nClient fully informed of all relevant security matters in a timely\nmanner and according to agreed reporting procedures.\n\n--- PDF PAGE 18 ---\nTR Security Services NC I\nPromulgated May 31, 2005\n-14-\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Personal Presence\n\nMay include:\n1.1\nStance\n1.2\nPosture\n1.3\nBody Language\n1.4\nDemeanour\n1.5 Grooming\n2. Employer Standards\nMay include:\n2.1\nStanding Orders\n3. Client Requirements\nMay include:\n3.1\nAssignment Instructions\n3.2\nPost Orders\n3.3\nScope to modify instructions/orders in light of changed\nsituations\n4. Assignment\nInstructions\nMay be conveyed in:\n4.1\nWriting\n4.2\nVerbally\n4.3\nElectronically\n5. Client’s Needs and\nRequirements\nMay be detected by:\n5.1\nReview of the client brief and/or assignment instructions\n5.2\nDiscussion with the client/customer\n6. Appropriate Action\nMay include:\n6.1\nImplementing required changes\n6.2\nReferral to appropriate employer personnel\n6.3\nClarification of client needs and instructions\n7. Customers\nMay include:\n7.1\nAll members of the public\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nMaintained a professional image.\n1.2\nInterpreted client/customer requirements from information\ncontained in the client brief and/or assignment instructions.\n1.3\nDealt successfully with a variety of client/customer\ninteractions.\n1.4\nMonitored and acted on changing client or customer needs.\n1.5\nMet client/customer requirements.\n1.6\nBuilt credibility with customers/clients.\n2. Underpinning\nknowledge and\nattitudes\n2.1\nUniform and personal grooming requirements of the employer\nand the client\n2.2\nOccupational Health and safety requirement for the\nassignment\n2.3\nLegal requirements and guidelines for the storage of firearms\nand equipment (as appropriate and where required)\n2.4\nAssignment Instructions\n\n--- PDF PAGE 19 ---\nTR Security Services NC I\nPromulgated May 31, 2005\n-15-\n\n3. Underpinning skills\n3.1\nAttention to detail when completing client/employer\ndocumentation\n3.2\nInterpersonal and communication skills required in client\ncontact assignments\n3.3\nCustomer service skills required to meet client/customer\nneeds\n3.4\nPunctuality\n3.5\nCustomer Service\n3.6\nTelephone Technique\n3.7\nProblem Solving and Negotiation\n3.8\nMaintaining Records\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nAssessment Centers/Venues\n4.2\nAccredited Assessors\n4.3\nModes of Assessment\n4.4\nEvaluation Reports\n4.5\nAccess to a relevant venue, equipment and materials\n4.6\nAssignment Instructions\n4.7\nLogbooks\n4.8\nOperational manuals and makers’/customers’ instructions (if\nrelevant)\n4.9\nAssessment Instruments, including personal planner and\nassessment record book\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1\nWritten Test\n5.2\nDemonstration with questioning\n5.3\nObservation with questioning\n6. Context of\nassessment\n6.1\nCompany\n6.2\nOn-Site\n6.3\nAssessment activities are carried out through TESDA\naccredited assessment centers/venues by using closely\nsimulated workplace environment\n6.4\nContinuous assessment in an institutional setting that\nstimulates the conditions of performance describe in the\nelements, performance criteria and range of variables\nstatement that make up this unit\n6.5\nContinuous assessment in the workplace, taking into account\nthe range of variables affecting performance\n6.6\nSelf-assessment on the same terms as those described above\n6.7\nSimulated assessment or critical incident assessment,\nprovided that the critical incident involves assessment against\nperformance criteria and an evaluation of underpinning\nknowledge and skill required to achieve the required\nperformance criteria\n\n--- PDF PAGE 20 ---\nTR Security Services NC I\nPromulgated May 31, 2005\n-16-\n\nUNIT OF COMPETENCY :\nMANAGE OWN PERFORMANCE\n\nUNIT CODE\n:\nHCS516202\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes required in\neffectively managing own workload and quality of work.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Plan for completion of\nown workload\n\n1.1\nTasks accurately identified.\n1.2\nPriority allocated to each task.\n1.3\nTime lines allocated to each task or series of tasks.\n1.4\nTasks deadlines known and complied with whenever possible.\n1.5\nWork schedules are known and completed within agreed time\nframes.\n1.6\nWork plans developed according to assignment requirements\nand employer policy.\n1.7\nUncompleted work or tasks detailed and responsibility for\ncompletion passed to incoming shift or other appropriate\npersons.\n2. Maintain quality of\nown performance\n2.1\nPersonal performance continually monitored against agreed\nperformance standards.\n2.2\nAdvice and guidance sought when necessary to achieve or\nmaintain agreed standards.\n2.3\nGuidance from management applied to achieve or maintain\nagreed standards.\n2.4\nStandard of work clarified and agreed according to employer\npolicy and procedures.\n3. Build credibility with\ncustomers/clients\n3.1\nClient expectations for reliability, punctuality and appearance\nadhered to.\n3.4\nPossible causes of client/customer dissatisfaction identified,\ndealt with and recorded according to employer policy.\n3.5\nClient fully informed of all relevant security matters in a timely\nmanner and according to agreed reporting procedures.\n\n--- PDF PAGE 21 ---\nTR Security Services NC I\nPromulgated May 31, 2005\n-17-\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Tasks\n\n1.1\nMay identified through:\n1.1.1 Assignment instructions\n1.1.2 Verbal Instructions by senior officer\n1.1.3 Policy Documents\n1.1.4 Duty Statements\n1.1.5 Self Assessment\n1.2\nMay be:\n1.2.1 Daily tasks\n1.2.2 Weekly tasks\n1.2.3 Regularly or irregularly occurring tasks\n2. Performance\nStandards\nMay include:\n2.1\nAssignment Instructions\n2.2\nProcedures established in policy documents\n\n--- PDF PAGE 22 ---\nTR Security Services NC I\nPromulgated May 31, 2005\n-18-\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nPlanned for completion of own workload.\n1.2\nAssessed verbal or written work plan through observation and\ndiscussion of site and employer requirements.\n1.3\nDemonstrated capacity to complete task within specified time\nframe.\n1.4\nMaintained quality of own performance.\n2. Underpinning\nknowledge and\nattitudes\n2.1\nSite and assignment requirements\n2.2\nEmployer policy on performance management\n2.3\nIndicators of appropriate performance for each area of\nresponsibility\n2.4\nSteps for improving or maintaining performance\n3. Underpinning skills\n3.1\nCapacity to plan and prioritize security work loads and\nrequirements\n3.2\nTime and task management\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nAssessment Centers/Venues\n4.2\nAccredited Assessors\n4.3\nModes of Assessment\n4.4\nEvaluation Reports\n4.5\nAccess to a relevant venue, equipment and materials\n4.6\nAssignment Instructions\n4.7\nLogbooks\n4.8\nOperational manuals and makers’/customers’ instructions (if\nrelevant)\n4.9\nAssessment Instruments, including personal planner and\nassessment record book\n5. Method of\nAssessment\nCompetency may be assessed through:\n5.1\nWritten Test\n5.2\nDemonstration with questioning\n5.3\nObservation with questioning\n6. Context of\nassessment\n6.1\nCompany\n6.2\nOn-Site\n6.3\n Assessment activities are carried out through TESDA\naccredited assessment centers/venues by using closely\nsimulated workplace environment\n6.4\n Continuous assessment in an institutional setting that\nstimulates the conditions of performance describe in the\nelements, performance criteria and range of variables\nstatement that make up this unit\n6.5\n Continuous assessment in the workplace, taking into account\nthe range of variables affecting performance\n6.6\n Self-assessment on the same terms as those described\nabove\n6.7\n Simulated assessment or critical incident assessment,\nprovided that the critical incident involves assessment against\nperformance criteria and an evaluation of underpinning\nknowledge and skill required to achieve the required\nperformance criteria\n\n--- PDF PAGE 23 ---\nTR Security Services NC I\nPromulgated May 31, 2005\n-19-\n\nUNIT OF COMPETENCY :\nPRACTICE PROFESSIONALISM IN THE SECURITY SERVICE\n\nUNIT CODE :\nHCS516203\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes in establishing\nprofessionalism in the workplace. It includes his outlook towards\nhis job / roles, responsibilities in the company, demonstration of\npositive work ethics and values and maintenance of paraphernalia\nand equipment.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Comprehend and\nappreciate the job /\nroles and\nresponsibilities of a\nworker\n\n1.1 Whole-hearted commitment and involvement are rendered\nwhile on the job.\n1.2 Full responsibility on the job is assumed willingly.\n1.3 Improvement in work methods is formulated and implemented.\n1.4 Loyalty is rendered to respective employer.\n1.5 Undiminished enthusiasm and high energy level are shown on\nthe job.\n1.6 Untarnished integrity is shown at all times.\n1.7 High degree of proficiency in skills and knowledge are\ndemonstrated while performing the tasks.\n1.8 Cultural practices are respected and followed whenever\npossible.\n1.9 Good rapport with co-workers is established at all times.\n2. Maintain professional\nappearance, security\nuniforms,\nparaphernalia and\nequipment\n2.1 Personal appearance is maintained in accordance to company\npolicies and regulations.\n2.2 Security uniforms, paraphernalia and equipment maintained in\naccordance to company policies and regulations.\n2.3 Courtesy is maintained in company premises at all times.\n3. Maintain area of duty\n3.1 Area of duty is kept clean and orderly.\n3.2 Company equipment and property is checked in accordance to\ncompleteness and its condition.\n3.3 Equipment stored according to assignment requirements.\n4. Demonstrate positive\nwork ethics and\nvalues\n4.1 Positive work values are observed at all times.\n4.2 Maladaptive behavior is handled tactfully.\n4.3 Patience and respect for the feelings of others are\ndemonstrated when dealing with employer.\n4.4 Confidentiality is observed when necessary.\n4.5 Compliments, complaints, conflicts and criticism are responded\nappropriately.\n4.6 Proper execution of hand salute as prescribed in Section 6\nRule 13 of the 2003 Revised RRI RA No. 5487.\n4.7 Courtesy greetings are extended in accordance to Ten\nCommandments of Human Relations.\n4.8 Customer/client needs and expectations are satisfied and\nrecorded in accordance to assignment instructions.\n\n--- PDF PAGE 24 ---\nTR Security Services NC I\nPromulgated May 31, 2005\n-20-\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Work Values\n\nMay include but not limited to:\n1.1\nHonesty\n1.2\nIntegrity\n1.3\nLoyalty\n1.4\nCourtesy\n1.5\nDiscipline\n2. Ten Commandments\nof Human Relations\n2.1\nSpeak to people\n2.2\nSmile at people\n2.3\nCall people by name\n2.4\nBe friendly and helpful\n2.5\nBe cordial\n2.6\nBe genuinely interested in people\n2.7\nBe generous with praise\n2.8\nBe considerate with feelings of others\n2.9\nBe thoughtful of the opinions of others\n2.10 Be alert to give service\n3. Customer/client’s\nneeds\n3.1\nInformation\n3.2\nSignage\n3.3\nSecurity\n3.4\nAdvisory\n3.5\nOffices/Personnel\n3.6 Product Lines\n\n--- PDF PAGE 25 ---\nTR Security Services NC I\nPromulgated May 31, 2005\n-21-\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nComprehended and appreciated the job/roles and\nresponsibilities of worker.\n1.2\nMaintained professional appearance, security uniforms,\nparaphernalia and equipment.\n1.3\nMaintained area of duty.\n1.4\nDemonstrated positive work ethics and values.\n1.5\nMaintained courtesy in company premises.\n2. Underpinning\nknowledge and\nattitudes\n2.1\nR.A. 5487 as amended\n2.2\nGun Safety Rules\n2.3\nHandling and Maintenance of Firearms\n2.4\nCustomer Relations\n2.5\nHuman Relations\n2.6\nReport Writing\n2.7\nLog/Note Taking\n2.8\nDefensive Tactics (Armed/Unarmed)\n2.9\nFirst Aid\n2.10 Marksmanship\n2.11 Bomb Awareness\n2.12 Contingency Plan (Typhoon, Earthquake, Fire, Strikes)\n2.13 Basic Life Support\n2.14 Hygiene and Sanitation (Workplace)\n2.15 Personal Hygiene\n2.16 Protocol Usage\n2.17 Relevant legal, licensing and employer requirements for the\nsafe carrying, storage and use of firearms\n2.18 Client Instructions/Regulations\n2.19 Value Formation\n2.20 Proper Wearing of Uniform Social Awareness\n2.22 Criminal Justice System\n2.23 Leadership Concept\n2.24 Firefighting Drills\n2.25 Uniform and personal grooming requirements of the\nemployer\n2.26 Occupational Health and Safety Requirement for the\nassignment\n2.27 Assignment Instructions\n2.28 Communication (Report Writing, Radio Language\n2.29 Legal Aspects\n2.30 Gender Awareness and Development\n\n--- PDF PAGE 26 ---\nTR Security Services NC I\nPromulgated May 31, 2005\n-1-\n\n3. Underpinning skills\n3.1\nComprehending and appreciating the job/roles and\nresponsibilities of a worker.\n3.2\nMaintaining professional appearance, security uniforms,\nparaphernalia and equipment.\n3.3\nMaintaining area of duty.\n3.4\nDemonstrating positive work ethics and values\n3.5\nMaintaining 