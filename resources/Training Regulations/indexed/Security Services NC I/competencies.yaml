r/client needs and expectations are satisfied and \nrecorded in accordance to assignment instructions.\n\n--- PDF PAGE 24 ---\nTR Security Services NC I \nPromulgated May 31, 2005 \n-20- \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.  Work Values    \n      \nMay include but not limited to: \n1.1 \nHonesty \n1.2 \nIntegrity \n1.3 \nLoyalty \n1.4 \nCourtesy \n1.5 \nDiscipline \n2. Ten Commandments \nof Human Relations \n2.1 \nSpeak to people \n2.2 \nSmile at people \n2.3 \nCall people by name \n2.4 \nBe friendly and helpful \n2.5 \nBe cordial \n2.6 \nBe genuinely interested in people \n2.7 \nBe generous with praise \n2.8 \nBe considerate with feelings of others \n2.9 \nBe thoughtful of the opinions of others \n2.10 Be alert to give service \n3. Customer/client’s \nneeds \n3.1 \nInformation \n3.2 \nSignage \n3.3 \nSecurity \n3.4 \nAdvisory \n3.5 \nOffices/Personnel \n3.6   Product Lines\n\n--- PDF PAGE 25 ---\nTR Security Services NC I \nPromulgated May 31, 2005 \n-21-"
