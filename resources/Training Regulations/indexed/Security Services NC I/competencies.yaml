n1.4.11 Trigger Guard\n\n--- PDF PAGE 42 ---\nTR Security Services NC I \nPromulgated May 31, 2005 \n-17- \n \nVARIABLE \nRANGE \n2.  Gun Safety Rules \nand Other Related \nLaws \n  \n2.1 \nGun Safety Rules \n2.1.1   Never use your firearm unless it is to protect your life or \nthe life of someone you have a responsibility to protect \nfrom a deadly attack. \n2.1.2 Always consider that a gun is loaded. Check for \nyourself. Do not rely on others. \n2.1.3 Always inspect your gun and clean it regularly. \n2.1.4 Always put in mind that your authority is to carry your \ngun on duty. It may authorize you to transport your gun \nfrom work to your office and back. You are not \nauthorized to use gun for anything other than your \nsecurity work. \n2.1.5 Do not leave your gun unattended for any person to \npick up. \n2.1.6 Use the proper ammunition which is intended only for \nyour gun. \n2.1.7 Always report to your supervisor or employer any \ndefect in the gun or ammunition you are using. \n2.1.8 Never play or practice quick draw with your gun as this \nonly render the gun defective. \n2.2 \nOther Related Laws \n2.2.1 Offenses involving the use of firearm, parts of firearms, \nammunition and explosives with their respective \npenalties as provided for by law: Amendments are \nbased on RA 9294 (Amending PD No. 1866) \n3.  Firing Positions \n3.1 \nKneeling \n3.2 \nProne \n3.3 \nStanding  \n3.4 \nSquatting \n4.  Firing Procedures \n  \n4.1 \nHandgun \n4.1.1 Loading \n4.1.2 Firing \n4.1.3 Unloading \n4.1.4 Care and Cleaning \n4.2 \nLong Arm (12 Gauge Shotgun) \n4.2.1 Make long arm safe \n4.2.2 Release Safety \n4.2.3 Load Chamber \n4.2.4 Firing \n4.2.5 Remove Loaded Shell from Chamber \n \nRemove Leaded Shell from Magazine \n4.2.6 Care and Cleaning\n\n--- PDF PAGE 43 ---\nTR Security Services NC I \nPromulgated May 31, 2005 \n-18-"
