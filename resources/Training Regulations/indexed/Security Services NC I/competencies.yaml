          "source_text": "1.  Check persons \nentering and leaving \nthe premises \n1.1 \nPersonnel entering the premises identified in accordance \nwith company policies/procedures.  \n1.2 \nVisitors’ data registered in accordance with company \npolicies/procedures. \n1.3 \nPersonnel identification checked in accordance with \ncompany policies/procedures. \n1.4 \nPurpose of visit verified in accordance with company \npolicies/procedures. \n1.5 \nBody frisking conducted in accordance with standard \noperating procedures. \n1.6 \nBags and baggage inspected in accordance with standard \noperating procedures. \n1.7 \nVisitors ID and Pass Slip issued in accordance with standard \noperating procedures. \n1.8 \nVisitor/s directed or escorted to destination in accordance \nwith standard operating procedures. \n1.9 \nPerson/s leaving the premises inspected in accordance with \nstandard operating procedures. \n2.  Check vehicles \nentering and leaving \nthe premises  \n      \n2.1 \nVehicle/s entering the premises identified in accordance \nwith company policies/procedures. \n2.2 \nVehicle/s registered in accordance with company \npolicies/procedures. \n2.3 \nDriver and passengers’ identification checked in \naccordance with company policies/procedures. \n2.4 \nPurpose of visit verified in accordance with company \npolicies/procedures. \n2.5 \nVehicle/s inspected in accordance with standard operating \nprocedures. \n2.6 \nCar pass/es issued in accordance with standard operating \nprocedures. \n2.7 \nVehicle/s directed to destination and parking area in \naccordance with standard operating procedures.\n\n--- PDF PAGE 28 ---\nTR Security Services NC I \nPromulgated May 31, 2005 \n-3- \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n2.8 \nVehicle/s leaving the premises inspected in accordance with \nstandard operating procedures. \n3.  Check properties \nentering \n     and leaving the \npremises \n3.1 \nProperties entering/leaving the premises classified in \naccordance with company policies. \n3.2 \nDocumentation of properties entering and leaving the \npremises checked in accordance with company policies. \n3.3 \nProperties verified and accounted in accordance with \ndocuments and company policies. \n3.4 \nProperty pass checked and verified in accordance with \ncompany policies. \n4. Check parking \narrangement      \n4.1 \nVehicles are checked if parked in accordance with parking \narrangements/assignments. \n4.2 \nCheck if parking signages are followed in accordance with \ncompany policies. \n5. Check barriers \n  \n5.1 \nTypes of barriers determined in accordance with standard \noperating procedures.  \n5.2 \nBarriers are checked if in operational condition and in \naccordance with standard operating procedures. \n5.3 \nVulnerable areas are identified in accordance with standard \noperating procedures.\n\n--- PDF PAGE 29 ---\nTR Security Services NC I \nPromulgated May 31, 2005 \n-4- \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Identification \nDocuments \n \n1.1 \nI.D. Cards \n1.2 \nPasses \n1.3 \nBadges \n1.4 \nGate Pass \n1.5 \nMaterial Pass \n1.6 \nWork Permits \n1.7 \nLoad Manifests \n1.8 \nReceipts \n2.  Visitors \n \n \n2.1 \nSales Representatives \n2.2 \nContractors \n2.3 \nEmergency Services \n2.4 \nUtility Company \n3.  Vehicles \n3.1 \nOrganic \n3.2 \nNon-Organic \n3.3 \nSize \n4.  Passenger’s ID \n4.1 \nName of  Passenger \n4.2 \nName of Employer \n4.3 \nAddress of Employer \n4.4 \nContact Number \n5.  Purpose of Visit \n5.1 \nOfficial \n5.2 \nPersonal \n6.  Parking Area \n6.1 \nOrganic \n6.2 \nNon-Organic \n7.  Properties \n7.1 \nDeliveries \n7.2 \nLuggage \n7.3 \nBaggage \n7.4 \nBags \n7.5 \nParcels \n8.  Documentation \n8.1 \nInvoice \n8.2 \nDelivery Receipts \n8.3 \nPurchase Orders \n8.4 \nGate Pass \n8.5 \nTally-Out \n9.  Types of Barriers \n9.1 \nWorking Systems \n9.2 \nTraffic Barriers \n9.3 \nElectronic Access Doors \n9.4 \nShutters and Gates\n\n--- PDF PAGE 