ordance with occupational health and \nsafety (OHS) requirements\n\n--- PDF PAGE 16 ---\nTR Security Services NC I \nPromulgated May 31, 2005 \n-12- \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.  Unnecessary items \nMay include but are not limited to: \n1.1 \n Non-recyclable materials \n1.2 \n Unserviceable tools and equipment \n1.3 \n Pictures, posters and other materials not  related to work \nactivity \n1.4 \n Waste materials \n2.  Identification marks \n2.1 \nLabels \n2.2 \nTags \n2.3 \nColor coding \n3.  Decorum \n3.1 \nCompany/ office rules and regulations  \n3.2 \nCompany/ office uniform \n3.3 \nBehavior    \n4. Minor repair \nMinor repair include but not limited to: \n4.1 \nReplacement of parts \n4.2 \nApplication of lubricants \n4.3 \nSharpening of tools \n4.4 \nTightening of nuts, bolts and screws \n \n \n \n \n \n \n \n \n \n \n \n \n EVIDENCE GUIDE \n \n1.  Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1 \nPracticed the basic procedures of 5S \n2. Underpinning \nknowledge and \nattitudes \n2.1 \nPrinciples of 5S \n2.2 \nWork process and procedures \n2.3 \nSafety signs and symbols \n2.4 \nGeneral OH&S principles and legislation \n2.5 \nEnvironmental requirements relative to work safety \n2.6 \nAccident/Hazard reporting procedures \n3. Underpinning skills \n3.1 \nBasic communication skills \n3.2 \nInterpersonal skills \n3.3 \nReading skills required to interpret instructions \n3.4 \nReporting/recording accidents and potential hazards \n4. Resource \nimplications \nThe following resources MUST be provided: \n4.1 \nFacilities, materials tools and equipment necessary for the \nactivity \n5. Method of \nassessment \nCompetency may be assessed through: \n5.1 \nThird party report \n5.2 \nInterview \n5.3 \nDemonstration with questioning \n6. Context of \nassessment \n6.1 \nCompetency may be assessed in the work place or in a \nsimulated work place setting\n",
