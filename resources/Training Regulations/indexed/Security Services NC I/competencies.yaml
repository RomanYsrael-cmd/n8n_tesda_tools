        "source_title": "PRACTICE PROFESSIONALISM IN THE SECURITY SERVICE",
        "source_text": "--- PDF PAGE 23 ---\nTR Security Services NC I \nPromulgated May 31, 2005 \n-19- \n \nUNIT OF COMPETENCY : \nPRACTICE PROFESSIONALISM IN THE SECURITY SERVICE \n \nUNIT CODE                      : \nHCS516203                 \n \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge, skills and attitudes in establishing \nprofessionalism in the workplace.  It includes his outlook towards \nhis job / roles, responsibilities in the company, demonstration of \npositive work ethics and values and maintenance of paraphernalia \nand equipment. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1.  Comprehend and \nappreciate the job / \nroles and                  \nresponsibilities of a \nworker \n \n \n \n1.1  Whole-hearted commitment and involvement are rendered \nwhile on the job. \n1.2   Full responsibility on the job is assumed willingly. \n1.3 Improvement in work methods is formulated and implemented. \n1.4 Loyalty is rendered to respective employer. \n1.5 Undiminished enthusiasm and high energy level are shown on \nthe job. \n1.6 Untarnished integrity is shown at all times. \n1.7 High degree of proficiency in skills and knowledge are \ndemonstrated while performing the tasks. \n1.8 Cultural practices are respected and followed whenever \npossible. \n1.9 Good rapport with co-workers is established at all times. \n2.  Maintain professional \nappearance, security \nuniforms, \nparaphernalia and \nequipment \n2.1   Personal appearance is maintained in accordance to company \npolicies and regulations. \n2.2   Security uniforms, paraphernalia and equipment maintained in \naccordance to company policies and regulations. \n2.3   Courtesy is maintained in company premises at all times. \n3.  Maintain area of duty \n3.1  Area of duty is kept clean and orderly. \n3.2  Company equipment and property is checked in accordance to \ncompleteness and its condition. \n3.3  Equipment stored according to assignment requirements. \n4. Demonstrate positive   \nwork ethics and \nvalues \n4.1   Positive work values are observed at all times. \n4.2   Maladaptive behavior is handled tactfully.  \n4.3  Patience and respect for the feelings of others are \ndemonstrated when dealing with employer. \n4.4  Confidentiality is observed when necessary. \n4.5  Compliments, complaints, conflicts and criticism are responded \nappropriately. \n4.6  Proper execution of hand salute as prescribed in Section 6 \nRule 13 of the 2003 Revised RRI RA No. 5487. \n4.7  Courtesy greetings are extended in accordance to Ten \nCommandments of Human Relations. \n4.8  Customer/client needs and expectations are satisfied and \nrecorded in accordance to assignment instructions.\n\n--- PDF PAGE 24 ---\nTR Security Services NC I \nPromulgated May 31, 2005 \n-20- \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.  Work Values    \n      \nMay include but not limited to: \n1.1 \nHonesty \n1.2 \nIntegrity \n1.3 \nLoyalty \n1.4 \nCourtesy \n1.5 \nDiscipline \n2. Ten Commandments \nof Human Relations \n2.1 \nSpeak to people \n2.2 \nSmile at people \n2.3 \nCall people by name \n2.4 \nBe friendly and helpful \n2.5 \nBe cordial \n2.6 \nBe genuinely interested in people \n2.7 \nBe generous with praise \n2.8 \nBe considerate with feelings of others \n2.9 \nBe thoughtful of the opinions of others \n2.10 Be alert to give service \n3. Customer/client’s \nneeds \n3.1 \nInformation \n3.2 \nSignage \n3.3 \nSecurity \n3.4 \nAdvisory \n3.5 \nOffices/Personnel \n3.6   Product Lines\n\n--- PDF PAGE 25 ---\nTR Security Services NC I \nPromulgated May 31, 2005 \n-21- \n \nEVIDENCE GUIDE \n \n1.  Critical aspects of  \ncompetency \nAssessment requires evidence that the candidate: \n1.1 \nComprehended and appreciated the job/roles and \nresponsibilities of worker. \n1.2 \nMaintained professional appearance, security uniforms, \nparaphernalia and equipment. \n1.3 \nMaintained area of duty. \n1.4 \nDemonstrated positive work ethics and values. \n1.5 \nMaintained courtesy in company premises. \n2. Underpinning \nknowledge and \nattitudes \n2.1 \nR.A. 5487 as amended \n2.2 \nGun Safety Rules \n2.3 \nHandling and Maintenance of Firearms \n2.4 \nCustomer Relations \n2.5 \nHuman Relations \n2.6 \nReport Writing \n2.7 \nLog/Note Taking \n2.8 \nDefensive Tactics (Armed/Unarmed) \n2.9 \nFirst  Aid \n2.10 Marksmanship \n2.11 Bomb Awareness \n2.12 Contingency Plan (Typhoon, Earthquake, Fire, Strikes) \n2.13 Basic Life Support \n2.14 Hygiene and Sanitation (Workplace) \n2.15 Personal Hygiene \n2.16 Protocol Usage \n2.17 Relevant legal, licensing and employer requirements for the \nsafe carrying, storage and use of firearms \n2.18 Client Instructions/Regulations \n2.19 Value Formation \n2.20 Proper Wearing of  Uniform Social Awareness \n2.22  Criminal Justice System \n2.23 Leadership Concept \n2.24 Firefighting Drills \n2.25 Uniform and personal grooming requirements of the \nemployer \n2.26 Occupational Health and Safety Requirement for the \nassignment \n2.27 Assignment Instructions \n2.28 Communication (Report Writing, Radio Language \n2.29 Legal Aspects \n2.30 Gender Awareness and Development\n\n--- PDF PAGE 26 ---\nTR Security Services NC I \nPromulgated May 31, 2005 \n-1- \n \n3.  Underpinning skills \n3.1 \nComprehending and appreciating the job/roles and \nresponsibilities of a worker. \n3.2 \nMaintaining professional appearance, security uniforms, \nparaphernalia and equipment. \n3.3 \nMaintaining area of duty. \n3.4 \nDemonstrating positive work ethics and values \n3.5 \nMaintaining courtesy in company premises \n3.6 \nFirearms handling skills \n3.6     Interpersonal communication skills required in client contract \nassignments \n3.7 \nAttending to detail when complying client/employer checklist \n3.8 \nCustomer service skills required to meet client / customer \nneeds \n3.9 \nTelephone Ethics and Practices \n3.10 Reporting Skills (Oral/Written) \n3.11 Maintaining Records \n3.12 Ability to respond to crisis situation \n4.  Resource \nimplications \n \nThe following resources MUST be provided: \n4.1 \nAssessment Centers/Venues \n4.2 \nAccredited  Assessors \n4.3 \nModes of Assessment \n4.4 \nEvaluation Reports \n4.5 \nAccess to relevant venue \n4.6 \nAccess to firing range \n4.7 \nSecurity Procedures and Manuals \n4.8 \nEquipment manufacturers’ operating specifications and \nguidelines \n5.  Method of \nassessment \nCompetency may be assessed through: \n5.1 \nDemonstration with questioning \n5.2 \nObservation with questioning \n5.3 \nWritten Test / Examination \n6.  Context of \nassessment \n6.1 \nSecurity Training Schools \n6.2 \nClient Premises \n6.3 \nOn-Site \n6.4 \nAssessment activities are carried out through TESDA/PNP \naccredited assessment centers/venues by using closely \nsimulated workplace environment. \n6.5 \nAssessment should be conducted in a simulated \nenvironment where work functions are undertaken and \nassessed under specially prepared, conditions, including in \nconfined spaces or public places.\n",
