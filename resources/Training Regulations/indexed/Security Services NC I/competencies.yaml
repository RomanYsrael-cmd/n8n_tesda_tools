        "source_title": "RECEIVE AND RESPOND TO WORKPLACE COMMUNICATION",
        "source_text": "--- PDF PAGE 6 ---\nTR Security Services NC I \nPromulgated May 31, 2005 \n-2- \n \nSECTION 2   COMPETENCY STANDARDS  \n \nThis section gives the details of the contents of the basic, common and core units of \ncompetency required in SECURITY SERVICES NC I.  \n \nBASIC COMPETENCIES \nUNIT OF COMPETENCY : \nRECEIVE AND RESPOND TO WORKPLACE COMMUNICATION \nUNIT CODE \n: \n500311101 \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge, skills and attitudes required to \nreceive, respond and act on verbal and written communication. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1. Follow routine \nspoken messages \n1.1 \nRequired information is gathered by listening attentively and \ncorrectly interpreting or understanding  \ninformation/instructions \n1.2 \nInstructions/information are properly recorded \n1.3 \nInstructions are acted upon immediately  in accordance with \ninformation received  \n1.4 \nClarification is sought from workplace supervisor on all \noccasions when any instruction/information is not clear  \n2. Perform workplace \nduties following \nwritten notices \n2.1 \nWritten notices and instructions are read and   interpreted \ncorrectly in accordance with organizational guidelines \n2.2      Routine written instruction are followed in sequence \n2.3 \nFeedback is given to workplace supervisor based on the \ninstructions/information received\n\n--- PDF PAGE 7 ---\nTR Security Services NC I \nPromulgated May 31, 2005 \n-3- \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Written notices and \ninstructions \nIt refers to : \n1.1 \nHandwritten and printed material \n1.2 \nInternal memos \n1.3 \nExternal communications \n1.4 \nElectronic mail \n1.5 \nBriefing notes \n1.6 \nGeneral correspondence \n1.7 \nMarketing materials \n1.8 \nJournal articles \n2. Organizational \nGuidelines \nIt may include: \n2.1 \nInformation documentation procedures \n2.2 \nCompany  policies and  procedures \n2.3 \nOrganization manuals \n2.4 \nService manual\n\n--- PDF PAGE 8 ---\nTR Security Services NC I \nPromulgated May 31, 2005 \n-4- \n \nEVIDENCE GUIDE \n \n1. Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1 \n Demonstrated knowledge of organizational procedures for \nhandling verbal and written communications \n1.2 \n Received and acted on verbal messages and instructions \n1.3 \nDemonstrated competency in recording \ninstructions/information \n2. Underpinning \nknowledge and \nattitudes \n2.1 \nKnowledge of organizational policies/guidelines in regard to \nprocessing internal/external information \n2.2 \nEthical work practices in handling communications \n2.3 \nCommunication process \n3. Underpinning skills \n3.1 \nConciseness in receiving and clarifying \nmessages/information/communication \n3.2 \nAccuracy in recording messages/information \n4. Resource \nimplications \nThe following resources MUST be provided: \n4.1 \nPens \n4.2 \nNote pads \n5. Method of \nassessment \nCompetency may be assessed through: \n5.1 \nDirect Observation \n5.2 \nOral interview \n5.3 \nWritten Evaluation \n5.4 \nThird Party Report \n6. Context of \nassessment \n6.1 \nCompetency may be assessed individually in the actual \nworkplace or simulation environment in TESDA accredited \ninstitutions\n",
