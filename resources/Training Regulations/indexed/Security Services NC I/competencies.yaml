        "source_title": "RESPOND TO EMERGENCY SITUATIONS",
        "source_text": "--- PDF PAGE 35 ---\nTR Security Services NC I \nPromulgated May 31, 2005 \n-10- \n \nUNIT OF COMPETENCY : RESPOND TO EMERGENCY SITUATIONS \nUNIT CODE                      : HCS516303 \nUNIT DESCRIPTOR         : This unit covers the knowledge, skills and attitudes in responding to \nemergency situations including immediate reaction/response \nprocedures. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1.  Check emergency \npreparedness plan \n1.1 \nFunctions/roles of security guards during emergencies are \nchecked in accordance with the emergency preparedness \nplan. \n1.2 \nStatus of emergency is verified in accordance with standard \noperating procedures (SOPs). \n2.  Check emergency \nalarm system \n2.1  \nAlarm system is located and checked as per unit’s \nspecification. \n2.2  \nAlarm system is monitored in the company premises in \naccordance with standard operating procedures (SOPs). \n2.3  \nObservations are noted in accordance with standard operating \nprocedures (SOPs). \n3.  Check emergency \nequipment \n3.1 \nEmergency equipment is located and checked in accordance \nwith standard operating procedures (SOPs). \n3.2 \nOperational condition of emergency equipment is checked in \naccordance with standard operating procedures (SOPs). \n3.3 \nEmergency equipment availability are checked in \naccordance with standard operating procedures (SOPs). \n3.4 \nUse of emergency equipment is demonstrated in accordance \nwith manufacturer’s instruction. \n4.  Receive and record \nthreats \n4.1 \nFunction/role are checked in accordance with standard \noperating procedures (SOPs). \n4.2 \nThreat received are recorded and reported in accordance with \nstandard operating procedures (SOPs). \n5.  Apply first aid \nprocedures \n5.1 \nFirst aid procedures are applied to injuries following safety \nguidelines and procedures. \n5.2 \nPersonal belongings of injured victims checked as per \nstandard operating procedures (SOPs). \n5.3 \nPersonal identification of victims is checked and verified in \naccordance with standard operating procedures. \n5.4 \nAssistance for other people in the area of responsibility (AOR) \nis requested if necessary and in accordance with standard \noperating procedures. \n6.  Follow instructions \nduring emergency \n6.1 \nEvacuation areas are sealed off and isolated in accordance \nwith standard operating procedures. \n6.2 \nDirection and control of escape routes are provided based on \ncompany requirements. \n6.3 \nOnlookers/crowds/other persons are controlled and kept at a \nsafe distance from the emergency area and in accordance \nwith standard operating procedures. \n6.4 \nEmergency areas are secured and protected in accordance \nwith standard operating procedures. \n6.5 \nInjured and sick evacuees are brought to a secured and safe \nplace in accordance with standard operating procedures. \n6.6 \nLateral coordination is made in accordance with standard \noperating procedures (SOPs).\n\n--- PDF PAGE 36 ---\nTR Security Services NC I \nPromulgated May 31, 2005 \n-11- \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.  Emergency Plan \n1.1 \nTypes of emergencies \n1.2 \nPhysical layout of the company \n1.3 \nObservation, description, identification control \n1.4 \nSecurity and safety inspection \n1.5 \nCommunication flow/protocol \n2.  Emergencies \n \n2.1      Bomb Threat \n2.2       Civil Disturbance \n2.3       Earthquake \n2.4       Fire \n2.5       Hold-Up/Robbery \n2.6       Hostage Situation \n2.7       Riot \n3. Alarm System \n3.1 \nMegaphone \n3.2 \nFire Alarm \n4.  Emergency \nEquipment \n4.1 \nABC Fire Extinguishers \n4.2 \nAxe \n4.3 \nFire Hose \n4.4 \nWater Pail \n4.5 \nRubber Coat  \n4.6 \nProtective Helmet \n4.7 \nRubber Boots \n4.8 \nSearch Light \n4.9 \nFirst aid Kits \n4.10 Stretcher \n4.11 Rope \n4.12 Ladder \n4.13 Communication Equipment \n5.  Threats \n \n5.1 \nNatural \n5.1.1   Typhoons \n5.1.2   Floods \n5.1.3   Volcanic Eruptions \n5.1.4   Earthquakes \n5.1.5   Hurricanes \n5.1.6   Tornados \n5.1.7   Forest Fires \n5.2 \nMan-Made \n5.2.1 Fires \n5.2.2 Transportation Accidents \n5.2.3 Civil Disturbances \n5.2.4 Bomb Threats \n5.2.5 Sabotage \n5.2.6 Hostage Taking\n\n--- PDF PAGE 37 ---\nTR Security Services NC I \nPromulgated May 31, 2005 \n-12- \n \n \nVARIABLE \nRANGE \n6.  Injuries \n6.1 \nBack Injury \n6.2 \nBleeding \n6.3 \nBroken Bones \n6.4 \nBurns \n6.5 \nChoking \n6.6      Dislocation \n6.7 \nFractures \n6.8 \nHeart Attack \n6.9 \nHeart Stops \n6.10 Heat Exhaustion \n6.11 Shock \n6.12 Sprains \n6.13 Strains \n6.14 Snake Bites \n6.15 Unconsciousness \n6.16 Wounds\n\n--- PDF PAGE 38 ---\nTR Security Services NC I \nPromulgated May 31, 2005 \n-13- \n \nEVIDENCE GUIDE \n \n1.  Critical aspects of \ncompetency      \nAssessment requires evidence that the candidate: \n1.1 \nChecked emergency preparedness plan \n1.2 \nChecked emergency alarm system \n1.3 \nChecked emergency equipment \n1.4 \nReceive and recorded threats \n1.5 \nApplied first aid procedures \n1.6 \nFollowed instructions during emergencies \n2.  Underpinning \nknowledge and \nattitudes \n2.1 \nR.A. 5487 as amended \n2.2 \nHandling of Firearms \n2.3 \nHuman Relations \n2.4 \nLog/Note Taking \n2.5 \nFirst Aid \n2.6 \nBomb Awareness \n2.7 \nContingency Plan (Typhoon, Earthquake, Fire, Strikes) \n2.8 \nBasic Life Support \n2.9 \nHygiene and Sanitation \n2.10 Personal Hygiene \n2.11 Protocol Usage \n2.12 Telephone Ethics \n2.13 Proper Wearing of Uniform \n2.14 Criminal Justice System \n2.15 Leadership Concept \n2.16 Firefighting Drills \n2.17 Assignment Instructions \n2.18 Alarm Systems and Locations \n2.19 Communication Codes \n2.20 Operation of Communication Equipment \n2.21 Control System Operation \n2.22 Client’s Instructions \n2.23 Legal Aspect \n3.  Underpinning skills \n3.1 \nParticipating in emergency drills \n3.2 \nEnforcing contingency plan in cases of bank robbery, kidnaps \nfor ransom, drug trafficking and other related crimes \n3.3 \nEnforcing bomb threat preventive measures \n3.4 \nEnforcing contingency civil disturbance plan \n3.5 \nRendering assistance to injured victims \n3.6 \nImplementing evacuation procedures during calamities \n3.7 \nReport Writing Skills \n3.8 \nCommunicating Skills \n3.9 \nMonitoring Skills \n3.10 Securing area \n3.11 Observing suspicious movements \n3.12 Describing/identifying suspicious movements \n3.13 Communicating clearly with clients/customers \n3.14 Following instructions \n3.15 Conducting Search (Baggage, Vehicles, Loads) \n3.16 Directing Traffic \n3.17 Records Keeping\n\n--- PDF PAGE 39 ---\nTR Security Services NC I \nPromulgated May 31, 2005 \n-14- \n \n4.  Resource \nimplications \n \n \n \nThe following resources MUST be provided: \n4.1 \nAssessment Centers/Venues \n4.2 \nAccredited Assessors \n4.3 \nModes of Assessment \n4.4 \nEvaluation Reports \n4.5 \nAccess to relevant venue, security equipment and materials \n4.6 \nAssignment Instructions \n4.7 \nLogbooks \n4.8 \nOperational manuals and makers’/customers’ instruction (if \nrelevant) \n4.9 \nAssessment instruments, including personal planner and \nassessment record book \n5.  Method of \nassessment \nCompetency may be assessed through: \n5.1 \nDemonstration with questioning \n5.2 \nObservation with questioning \n5.3 \nWritten Test/Examination \n6.  Context of \nassessment \n6.1 \nCompany \n6.2 \nOn-Site \n6.3 \nAssessment activities are carried out through TESDA/PNP \naccredited assessment centers/venues by using closely \nsimulated work place environment\n",
