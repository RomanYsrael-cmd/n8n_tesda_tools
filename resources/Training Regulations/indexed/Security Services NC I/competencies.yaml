        "source_text": "HCS516304\n\nUNIT DESCRIPTOR\n: This unit covers the knowledge, skills and attitudes in demonstrating\nmarksmanship.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Check operational\ncondition of the\nfirearm\n1.1\nFirearms nomenclature is identified and distinguished as\nmanufacturer’s specification.\n1.2\nOperational condition of firearm is checked in accordance with\nstandard operating procedures.\n1.3\nFirearm is handled in accordance with firearm safety rule\nand other related firearms laws.\n2. Demonstrate different\nfiring positions\n2.1\nFirearm is handled in accordance with firearm safety rule.\n2.2\nFiring positions are demonstrated in accordance with SOPs.\n3. Demonstrate dry fire\nprocedures\n\n3.1\nFirearm is handled in accordance with firearm safety rule.\n3.2\nSafety instructions are received and complied in accordance\nwith SOPs.\n3.3\nDry fire is demonstrated in accordance with actual firing\nprocedures.\n\n--- PDF PAGE 41 ---\nTR Security Services NC I\nPromulgated May 31, 2005\n-16-\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Firearms\nNomenclature\n1.1\nHandgun Nomenclature (Automatic Pistol)\n1.1.1 Barrel\n1.1.2 Front Sight\n1.1.3 Grip Safety\n1.1.4 Hammer\n1.1.5 Magazine\n1.1.6 Magazine Release\n1.1.7 Muzzle\n1.1.8 Rear Sight\n1.1.9 Safety\n1.1.10 Slide\n1.1.11 Trigger\n1.1.12 Trigger Guard\n1.2\nHandgun Nomenclature (Revolver)\n1.2.1 Barrel\n1.2.2 Breech\n1.2.3 Cylinder\n1.2.4 Cylinder Latch\n1.2.5 Extractor Lock\n1.2.6 Frame\n1.2.7 Front Sight\n1.2.8 Grip\n1.2.9 Hammer\n1.2.10 Muzzle\n1.2.11 Rear Sight\n1.2.12 Trigger\n1.2.13 Trigger Guard\n1.3\nLong Arm Nomenclature (Rifle)\n1.3.1 Barrel\n1.3.2 Bolt\n1.3.3 Butt Plate\n1.3.4 Front Sight\n1.3.5 Magazine\n1.3.6 Magazine Release\n1.3.7 Muzzle\n1.3.8 Rear Sight\n1.3.9 Sling\n1.3.10 Trigger\n1.3.11 Trigger Guard\n1.4\nLong Arm Nomenclature (Shotgun)\n1.4.1 Barrel\n1.4.2 Butt\n1.4.3 Butt Plate\n1.4.4 Front Sight\n1.4.5 Magazine\n1.4.6 Muzzle\n1.4.7 Pump\n1.4.8 Rear Sight\n1.4.9 Safety\n1.4.10 Trigger\n1.4.11 Trigger Guard\n\n--- PDF PAGE 42 ---\nTR Security Services NC I\nPromulgated May 31, 2005\n-17-\n\nVARIABLE\nRANGE\n2. Gun Safety Rules\nand Other Related\nLaws\n\n2.1\nGun Safety Rules\n2.1.1 Never use your firearm unless it is to protect your life or\nthe life of someone you have a responsibility to protect\nfrom a deadly attack.\n2.1.2 Always consider that a gun is loaded. Check for\nyourself. Do not rely on others.\n2.1.3 Always inspect your gun and clean it regularly.\n2.1.4 Always put in mind that your authority is to carry your\ngun on duty. It may authorize you to transport your gun\nfrom work to your office and back. You are not\nauthorized to use gun for anything other than your\nsecurity work.\n2.1.5 Do not leave your gun unattended for any person to\npick up.\n2.1.6 Use the proper ammunition which is intended only for\nyour gun.\n2.1.7 Always report to your supervisor or employer any\ndefect in the gun or ammunition you are using.\n2.1.8 Never play or practice quick draw with your gun as this\nonly render the gun defective.\n2.2\nOther Related Laws\n2.2.1 Offenses involving the use of firearm, parts of firearms,\nammunition and explosives with their respective\npenalties as provided for by law: Amendments are\nbased on RA 9294 (Amending PD No. 1866)\n3. Firing Positions\n3.1\nKneeling\n3.2\nProne\n3.3\nStanding\n3.4\nSquatting\n4. Firing Procedures\n\n4.1\nHandgun\n4.1.1 Loading\n4.1.2 Firing\n4.1.3 Unloading\n4.1.4 Care and Cleaning\n4.2\nLong Arm (12 Gauge Shotgun)\n4.2.1 Make long arm safe\n4.2.2 Release Safety\n4.2.3 Load Chamber\n4.2.4 Firing\n4.2.5 Remove Loaded Shell from Chamber\n\nRemove Leaded Shell from Magazine\n4.2.6 Care and Cleaning\n\n--- PDF PAGE 43 ---\nTR Security Services NC I\nPromulgated May 31, 2005\n-18-\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nChecked operational condition of the firearm.\n1.2\nIdentified and distinguished firearms nomenclature.\n1.3\nHandled firearms in accordance with firearm safety rules and\nother related firearms laws.\n1.4\nDemonstrated different firing positions.\n1.5\nDemonstrated dry fire procedures.\n2. Underpinning\nknowledge and\nattitudes\n2.1\nR.A. 5487 as amended\n2.2\nHandling of Firearms\n2.3\nMaintenance of Firearms\n2.4\nFirst Aid\n2.5\nMarksmanship\n2.6\nHygiene and Sanitation\n2.7\nPersonal Hygiene\n2.8\nUse of Firearms\n2.9\nProtocol Usage\n2.10 Proper Wearing of Uniform\n2.11 Leadership Concept\n2.12 Assignment Instructions\n3. Underpinning skills\n3.1\nHandling Firearms\n3.2\nMarksmanship\n3.3\nDefensive Tactics\n3.4\nGathering security related information\n3.5\nFollowing firearm security rules\n3.6\nDemonstrating different firing positions\n3.7\nFollowing dry fire procedures\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nAssessment Centers/Venues\n4.2\nAccredited Assessors\n4.3\nModes of Assessment\n4.4\nEvaluation Reports\n4.5\nAccess to relevant venue, security equipment and materials\n4.6\nAssignment Instructions\n4.7\nLogbooks\n4.8\nOperational manuals and makers’/customers’ instruction (if\nrelevant)\n4.9\nAssessment instruments, including personal planner and\nassessment record book\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1\nDemonstration with questioning\n5.2\nObservation with questioning\n5.3\nWritten Test/Examination\n6. Context of\nassessment\n6.1\nCompany\n6.2\nOn-Site\n6.3\nAssessment activities are carried out through TESDA/PNP\naccredited assessment centers/venues by using closely\nsimulated work place environment\n\n--- PDF PAGE 44 ---\nTR Security Services NC I\nPromulgated May 31, 2005\n-19-\n\nUNIT OF COMPETENCY :\nPERFORM DEFENSIVE TECHNIQUES\n\nUNIT CODE\n:"
