        "source_text": "--- PDF PAGE 27 ---\nTR Security Services NC I \nPromulgated May 31, 2005 \n-2- \n \nCORE COMPETENCIES \n \nThis section gives the details of the contents of the core units of competency required in \nSECURITY SERVICES NC I. \n \nUNIT OF COMPETENCY : \nPERFORM CONTROL SYSTEM IN THE WORKPLACE \n \nUNIT CODE                      : \nHCS516301                      \n \nUNIT DESCRIPTOR        : \nThis unit covers the knowledge, skills and attitudes in performing \ncontrol system in the workplace including procedures and policies in \nmonitoring. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1.  Check persons \nentering and leaving \nthe premises \n1.1 \nPersonnel entering the premises identified in accordance \nwith company policies/procedures.  \n1.2 \nVisitors’ data registered in accordance with company \npolicies/procedures. \n1.3 \nPersonnel identification checked in accordance with \ncompany policies/procedures. \n1.4 \nPurpose of visit verified in accordance with company \npolicies/procedures. \n1.5 \nBody frisking conducted in accordance with standard \noperating procedures. \n1.6 \nBags and baggage inspected in accordance with standard \noperating procedures. \n1.7 \nVisitors ID and Pass Slip issued in accordance with standard \noperating procedures. \n1.8 \nVisitor/s directed or escorted to destination in accordance \nwith standard operating procedures. \n1.9 \nPerson/s leaving the premises inspected in accordance with \nstandard operating procedures. \n2.  Check vehicles \nentering and leaving \nthe premises  \n      \n2.1 \nVehicle/s entering the premises identified in accordance \nwith company policies/procedures. \n2.2 \nVehicle/s registered in accordance with company \npolicies/procedures. \n2.3 \nDriver and passengers’ identification checked in \naccordance with company policies/procedures. \n2.4 \nPurpose of visit verified in accordance with company \npolicies/procedures. \n2.5 \nVehicle/s inspected in accordance with standard operating \nprocedures. \n2.6 \nCar pass/es issued in accordance with standard operating \nprocedures. \n2.7 \nVehicle/s directed to destination and parking area in \naccordance with standard operating procedures.\n\n--- PDF PAGE 28 ---\nTR Security Services NC I \nPromulgated May 31, 2005 \n-3- \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n2.8 \nVehicle/s leaving the premises inspected in accordance with \nstandard operating procedures. \n3.  Check properties \nentering \n     and leaving the \npremises \n3.1 \nProperties entering/leaving the premises classified in \naccordance with company policies. \n3.2 \nDocumentation of properties entering and leaving the \npremises checked in accordance with company policies. \n3.3 \nProperties verified and accounted in accordance with \ndocuments and company policies. \n3.4 \nProperty pass checked and verified in accordance with \ncompany policies. \n4. Check parking \narrangement      \n4.1 \nVehicles are checked if parked in accordance with parking \narrangements/assignments. \n4.2 \nCheck if parking signages are followed in accordance with \ncompany policies. \n5. Check barriers \n  \n5.1 \nTypes of barriers determined in accordance with standard \noperating procedures.  \n5.2 \nBarriers are checked if in operational condition and in \naccordance with standard operating procedures. \n5.3 \nVulnerable areas are identified in accordance with standard \noperating procedures.\n\n--- PDF PAGE 29 ---\nTR Security Services NC I \nPromulgated May 31, 2005 \n-4- \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Identification \nDocuments \n \n1.1 \nI.D. Cards \n1.2 \nPasses \n1.3 \nBadges \n1.4 \nGate Pass \n1.5 \nMaterial Pass \n1.6 \nWork Permits \n1.7 \nLoad Manifests \n1.8 \nReceipts \n2.  Visitors \n \n \n2.1 \nSales Representatives \n2.2 \nContractors \n2.3 \nEmergency Services \n2.4 \nUtility Company \n3.  Vehicles \n3.1 \nOrganic \n3.2 \nNon-Organic \n3.3 \nSize \n4.  Passenger’s ID \n4.1 \nName of  Passenger \n4.2 \nName of Employer \n4.3 \nAddress of Employer \n4.4 \nContact Number \n5.  Purpose of Visit \n5.1 \nOfficial \n5.2 \nPersonal \n6.  Parking Area \n6.1 \nOrganic \n6.2 \nNon-Organic \n7.  Properties \n7.1 \nDeliveries \n7.2 \nLuggage \n7.3 \nBaggage \n7.4 \nBags \n7.5 \nParcels \n8.  Documentation \n8.1 \nInvoice \n8.2 \nDelivery Receipts \n8.3 \nPurchase Orders \n8.4 \nGate Pass \n8.5 \nTally-Out \n9.  Types of Barriers \n9.1 \nWorking Systems \n9.2 \nTraffic Barriers \n9.3 \nElectronic Access Doors \n9.4 \nShutters and Gates\n\n--- PDF PAGE 30 ---\nTR Security Services NC I \nPromulgated May 31, 2005 \n-5- \n \nEVIDENCE GUIDE \n \n1. Critical aspects of  \n     competency \nAssessment requires evidence that the candidate: \n1.1 \nChecked persons entering and leaving the premises. \n1.2 \nChecked vehicles entering and leaving the premises. \n1.3 \nChecked properties entering and leaving the premises. \n1.4 \nChecked parking arrangement. \n1.5 \nChecked barriers. \n2.  Underpinning \nknowledge and \nattitudes \n2.1 \nRA 5487 as amended \n2.2 \nHandling of Firearms \n2.3 \nMaintenance of Firearms \n2.4 \nCustomer Relations \n2.5 \nHuman Relations \n2.6 \nReport Writing \n2.7 \nLog/Note Taking \n2.8 \nDefensive Tactics (Armed/Unarmed) \n2.9 \nFirst Aid \n2.10 Marksmanship \n2.11 Bomb Awareness \n2.12 Contingency Plan (Typhoon, Earthquake, Fire, Strikes) \n2.13 Basic Life Support \n2.14 Hygiene and Sanitation (Workplace) \n2.15 Personal Hygiene \n2.16 Use of Firearms \n2.17 Protocol Usage \n2.18 Value Formation \n2.19 Telephone Ethics \n2.20 Proper Wearing of Uniform \n2.21 The steps necessary to arrange alarm deactivation \n2.22 Alarm Systems and Locations of Fire Fighting Equipment \n2.23 Communication Codes \n2.24 Operation of Communication Equipment \n2.25 Control System Operation \n2.26 Signal Types and Meanings \n2.27 Instructional User Manual \n2.28 Client’s Instructions \n2.29 Surveillance Techniques \n2.30 Security Equipment Installed \n2.31 Risk Factor Assessment  \n2.32 Site Layout \n2.33 Building Security Procedures \n2.34 Social Awareness \n2.35 Criminal Justice System \n2.36 Leadership Concept \n2.37 Firefighting Drills \n2.38 Radio Communication  \n2.39 Legal Aspect \n2.40 Gender Awareness and Development \n3. Underpinning skills \n3.1 \nChecking persons entering/leaving the premises \n3.2 \nChecking vehicles entering/leaving the premises \n3.3 \nReporting untoward incidents and observations \n3.4 \nControlling entry in restricted area \n3.5 \nMarksmanship \n3.6 \nDefensive Tactics\n\n--- PDF PAGE 31 ---\nTR Security Services NC I \nPromulgated May 31, 2005 \n-6- \n \n3.7 \nReport Writing Skills \n3.8 \nCommunicating Skills \n3.9 \nMonitoring Skills \n3.10 Securing the area \n3.11 Observing and identifying suspicious movements \n3.12 Roving \n3.13 Securing and Inspecting Skills \n3.14 Bomb Threat  Awareness \n4.  Resource \nimplications \nThe following resources MUST be provided: \n4.1 \nAssessment Centers/Venues \n4.2 \nAccredited Assessors \n4.3 \nModes of Assessment \n4.4 \nEvaluation Reports \n4.5 \nAccess to a relevant venue, security equipment and materials \n4.6 \nAssignment Instructions \n4.7 \nLogbooks \n4.8 \nOperational manuals and makers’/customers’ instructions (if \nrelevant) \n4.9 \nAssessment Instruments, including personal planner and \nassessment record book \n5.  Method of \nassessment \nCompetency may be assessed through: \n5.1 \nDemonstration with questioning \n5.2 \nObservation with questioning \n5.3 \nWritten Test/Examination \n6.  Context of \nassessment \n6.1 \nCompany \n6.2 \nOn-Site \n6.3 \nAssessment activities are carried out through TESDA/PNP \naccredited assessment centers/venues by using closely \nsimulated work place environment \n6.4 \nContinuous assessment in an institutional setting that \nstimulates the conditions of performance describe in the \nelements, performance criteria and range of variables \nstatement that make up this unit \n6.5 \nContinuous assessment in the workplace, taking into account \nthe range of variables affecting performance \n6.6 \nSelf-assessment on the same terms as those described above \n6.7 \nSimulated assessment or critical incident assessment, \nprovided that the critical incident involves assessment against \nperformance criteria and an evaluation of underpinning \nknowledge and skill required to achieve the required \nperformance criteria\n",
