ts are prepared is in accordance with standard\noperating procedures.\n2. Transmit reports\n3.1\nCommunication equipment is prepared in accordance with\nmanufacturers’ instruction.\n3.1\nCommunication equipment is used in accordance with unit\nspecification.\n3.1\nCommunication call signs and language are used in\naccordance with transmitting messages procedures.\n3.1\nCommunication courtesy are observed/applied in\naccordance with transmitting messages procedures.\n2.5\nCommunication equipment are stored in a safe place as per\nstandard operating procedures.\n3. Demonstrate and\ninterpret hand signals\n3.1\nHand signals are demonstrated and interpreted in\naccordance with standard operating procedures.\n\n4. Maintain security\nlogbook\n4.1\nAccurate and detailed report of facts and events in the guard\npost is properly signed by the guard on duty.\n4.2\nEvents and facts are recorded in chronological order.\n4.3\nSecurity logbook is properly signed by both guards during\nturn-over.\n4.4\nConfidentiality of information is maintained at all times.\n4.5\nProper safekeeping of security logbook is maintained in\naccordance with organizational guidelines.\n\n--- PDF PAGE 33 ---\nTR Security Services NC I\nPromulgated May 31, 2005\n-8-\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Report\n\n1.1\nIncident /Spot report\n1.2\nViolations Report\n1.3\nInformation Report\n1.4\nSecurity Equipment Report\n1.5\nExplanation Report\n1.6\nDaily Activity Report\n2. Communication\n Equipment\n2.1\nHand Held Radio\n2.2\nTelephone\n2.3\nCell phones\n2.4\nIntercom\n2.5\nWriting Paraphernalia\n3. Call Signs and\n Languages\n3.1\nTen (10) Codes\n3.2\nPhonetics Language\n3.3\nRadio Language\n4. Messages\n\n4.1\nMemorandum\n4.2\nCirculars, Directives, Orders (Verbal or Written)\n4.3\nGuidelines and Policies\n5. Hand Signals\n5.1\nTraffic Signals\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nPrepared written reports\n1.2\nFollowed