es \n3.2 \nPhonetics Language \n3.3 \nRadio Language \n4.  Messages \n \n4.1 \nMemorandum \n4.2 \nCirculars, Directives, Orders (Verbal or Written) \n4.3 \nGuidelines and Policies \n5.  Hand Signals \n5.1 \nTraffic Signals"
