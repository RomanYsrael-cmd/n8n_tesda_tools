recognition of prior learning (RPL) or current competencies;\n• Training allows for multiple entry and exit; and\n• Approved training programs are Nationally Accredited\n\nThe competency-based TVET system recognizes various types of delivery modes, both\non and off-the-job as long as the learning is driven by the competency standards specified by\nthe industry. The following training modalities may be adopted when designing training\nprograms:\n\n• The dualized mode of training delivery is preferred and recommended. Thus programs\nwould contain both in-school and in-industry training or fieldwork components. Details can\nbe referred to the Dual Training System (DTS) Implementing Rules and Regulations.\n• Modular/self-paced learning is a competency-based training modality wherein the trainee\nis allowed to progress at his own pace. The trainer just facilitates the training delivery.\n• Peer teaching/mentoring is a training modality wherein fast learners are given the\nopportunity to assist the slow learners.\n• Supervised industry training or on-the-job training is an approach in training designed to\nenhance the knowledge and skills of the trainee through actual experience in the\nworkplace to acquire specific competencies prescribed in the training regulations.\n• Distance learning is a formal education process in which majority of the instruction occurs\nwhen the students and instructor are not in the same place. Distance learning may\nemploy correspondence study, audio, video or computer technologies.\n• Project-Based Instruction is an authentic instructional model or strategy in which students\nplan, implement and evaluate projects that have real world applicants.\n\n3.3 TRAINEE ENTRY REQUIREMENTS\n\nTrainees or students wishing to enroll in this course qualifications should possess the\nfollowing requirements:\n\n-\nFilipino citizen;\n-\nHigh School Graduate;\n-\nPhysically and mentally fit;\n-\nNot less than eighteen (18) years of age nor more than fifty (50) years of age (for new\napplicants and SGs in non-supervisory position; and\n-\nHas undergone a pre-licensing training course or its equivalent\n\n--- PDF PAGE 51 ---\nTR Security Services NC I\nPromulgated May 31, 2005\n-26-\n\n3.4 TOOLS, EQUIPMENT AND MATERIALS\n\nRecommended list of tools, equipment and materials for the training of a maximum of 25\ntrainees for Security Services NC I are as follows:\n\nTOOLS\nEQUIPMENT\nMATERIALS\nQTY.\nITEM\nQTY.\nITEM\nQTY\nITEM\n1 pc.\nBinocular\n1 set\nPrescribed Basic\nUniform (security\nguard & lady guard) *\n1 ream Bond Paper\n6\nrounds\nAmmunitions - .38 &\n12 g. (For Demo)\n1 pc.\nNight Stick*\n1 pc.\nCalendar\n1 pc.\nBulletin Board\n1 pc.\nWhistle*\n1 pc.\nBlackboard/\nwhiteboard Eraser\n25 pcs. Armed Chairs\n1 pc.\nTimepiece\n(synchronized) *\n25 pcs. Folder\n1 pair\nDirectional Signage\n25 pcs. Writing pen*\n1 pc.\nLogbook\n1 pc.\nEmergency Light\n25\nNotepad and duty\nchecklist (electronic or\nnot) *\n1 pc.\nMeal Box\n1 pc.\nFire Extinguisher\n1 pcs.\nFlashlights*\n1 pc.\nMetal Polish\n6 pcs.\nHelmet/ Protective\nGear\n1 pcs.\nFirst aid kit*\n25 pcs. Pencil\n1 pc.\nHolster\n2 pcs.\nService firearms - .38\ncaliber and 12 g. shot\ngun (as required) *\n2 pcs.\nMarking pen\n1 pc.\nMirror with Stand\n2 pcs.\nHandcuffs*\n1 box\nChalk\n1 pc.\nShield\n1 pc.\nMetal detectors*\n25 pc.\nPocket Notebook\n1 pc.\nStretcher\n1 pc.\nCommunication radio*\n1 pc.\nShoe Brush\n3 pcs.\nOffice Table\n1 set\nStun devices*\n1 can\nShoe polish\n1 pc.\nInstructors Desk\n1 pc.\nArmor vests*\n25 pcs. Tickler\n1 set\nConference Table\n1 unit\nMace\n\n1 set\nComputer Table\n1 unit\nComputer\n1 unit\nWhite Board\n1 pc.\nTelephone\n1 unit\nTypewriter\n2 pcs.\nWhiteboard Marker\n1 pc.\nWall Clock\n1 unit\nElectric fan\n12 pcs. Transparency\nacetate\n1 set\nSearch light\n1 unit\nAir con\n1 pc.\nTarget board/sheet\n10 pcs. Traffic vests/ gloves\n1 unit\nOverhead Projector\n1 pc.\nTarget stand\n1unit\nMegaphone\n1 pc.\nProjector screen\n\n1 pc.\nRostru