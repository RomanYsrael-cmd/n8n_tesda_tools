    "source_text": "3.1 CURRICULUM DESIGN\n\nCourse Title: SECURITY SERVICES\nNC Level: NC I\n\nNominal Training Duration : 28 Hrs. (Basic)\n36 Hrs. (Common)\n\nCourse Description:\n\nThis course is designed to enhance the knowledge, skills and desirable work attitude in\nSecurity Services NC I. It covers the basic, common and core competencies.\n\nBASIC COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Receive and\nrespond to\nworkplace\ncommunication\n\n1.1 Explain routinary speaking &\nmessages in a workplace\n1.2 Follow routinary speaking &\nmessage\n1.3 Perform work duties following\nwritten notices\n• Group\ndiscussion\n• Interaction\n\n• Interviews/\nquestioning\n• Observation\n2. Work with\nothers\n2.1 Develop effective workplace\nrelationship\n2.2 Contribute to work group\nactivities\n• Group\ndiscussion\n• Interaction\n• Interviews/\nquestioning\n• Demonstration\n• Observation\n3. Demonstrate\nwork values\n\n3.1 Define the purpose of work\n3.2 Apply work values/ethics\n3.3 Deal with ethical problems\n3.4 Maintain integrity of conduct in\nthe workplace\n• Group\ndiscussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n4. Practice\nhousekeeping\nprocedures\n4.1 Sort and remove unnecessary\nitems\n4.2 Arrange items\n4.3 Maintain work areas, tools and\nequipment\n4.4 Follow standardize work process\nand procedures\n4.5 Perform work spontaneously\n• Group\ndiscussion\n• Interaction\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n\n--- PDF PAGE 48 ---\nTR Security Services NC I\nPromulgated May 31, 2005\n-23-\n\nCOMMON COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Maintain an\neffective\nrelationship with\nclients/\ncustomers\n1.1 Maintain a professional image\n1.2 Build Credibility to meet\ncustomers/clients requirements\n\n• Group\ndiscussion\n• Lecture\n• Role Playing\n• Simulation\n• Written\nexamination\n• Demonstration\n• Observation\n2. Manage own\nperformance\n2.1 Plan for completion of own\nworkload\n2.2 Maintain quality of own\nperformance\n• Group\ndiscussion\n• Lecture\n• Role Playing\n• Simulation\n• Written\nexamination\n• Demonstration\n• Observation\n3. Practice\nprofessionalism\nin the security\nservice\n3.1 Comprehend and appreciate the\njob / roles and\nresponsibilities of a worker\n3.2 Maintain professional\nappearance, security uniforms,\nparaphernalia and equipment\n3.3 Maintain area of duty\n3.4 Demonstrate positive work\nethics and values\n• Discussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n\n--- PDF PAGE 49 ---\nTR Security Services NC I\nPromulgated May 31, 2005\n-24-\n\nCORE COMPETENCIES\n\nCourse Title: SECURITY SERVICES\nNC Level: NC I\n\nNominal Training Duration: 106 Hrs.\n\nCourse Description:\n\nThis course is designed to enhance the knowledge, skills and attitude of security guards in\naccordance with industry standards. It covers core competencies on performing control system in\nthe workplace, performing basic communication skills, responding to emergency situations,\ndemonstrating marksmanship skills, performing defensive techniques.\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Perform control\nsystem in the\nworkplace\n1.1\nCheck persons entering and\nleaving the premises\n1.2\nCheck vehicle entering and\nleaving the premises\n1.3\nCheck properties entering and\nleaving the premises\n1.4\nCheck barriers\n• Lecture\n• Group\nDiscussion\n• Demonstration\n• Written\nExamination\n• Demonstration\n• Observation\n2. Perform basic\ncommunication\nskills\n2.1\nPrepare written reports\n2.2\nTransmit reports\n2.3\nDemonstrate and interpret\nhand signals\n2.4\nMaintain logbook recordings\n• Lecture\n• Group\nDiscussion\n• Demonstration\n• Written\nExamination\n• Demonstration\n• Observation\n3. Respond to\nemergency\nsituation\n3.1\nFollow emergency\npreparedness plan\n3.2\nCheck emergency equipment\n3.3\nReceive and record threats\n3.4\nApply first aid procedures\n• Lecture\n• Group\nDiscussion\n• Demonstration\n• Written\nExamination\n• Demonstration\n• Observation\n4. Demonstrate\nmarksmanship\n4.1\nCheck operational condition\nof firearms\n4.2\nDemonstrate marksmanship\nskills in different positions\n\n• Lecture\n• Group\nDiscussion\n• Demonstration\n• Written\nExamination\n• Demonstration\nwith oral\nquestioning\n• Observation\nwith oral\nquestioning\n5. Perform\ndefensive\ntechniques\n5.1\nDemonstrate disarming\ntechniques\n5.2\nDemonstrate use of baton\n5.3\nDemonstrate use of handcuff\n5.4\nDemonstrate the use of stun\ndevices\n• Lecture\n• Group\nDiscussion\n• Demonstration\n• Practical\nExercises\n• Written\nExamination\n• Demonstration\n• Observation\n\n--- PDF PAGE 50 ---\nTR Security Services NC I\nPromulgated May 31, 2005\n-25-"
