  "source_section_text": "SECTION 3 TRAINING STANDARDS\n\nThis set of standards provides Technical and Vocational Education and Training (TVET)\nproviders with information and other important requirements to consider when designing training\nprograms for certain Qualifications.\n\nThis includes information on curriculum design; training delivery; trainee entry requirements;\ntools and equipment; training facilities; and trainers qualification.\n\n3.1 CURRICULUM DESIGN\n\nCourse Title: SECURITY SERVICES\nNC Level: NC I\n\nNominal Training Duration : 28 Hrs. (Basic)\n36 Hrs. (Common)\n\nCourse Description:\n\nThis course is designed to enhance the knowledge, skills and desirable work attitude in\nSecurity Services NC I. It covers the basic, common and core competencies.\n\nBASIC COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Receive and\nrespond to\nworkplace\ncommunication\n\n1.1 Explain routinary speaking &\nmessages in a workplace\n1.2 Follow routinary speaking &\nmessage\n1.3 Perform work duties following\nwritten notices\n• Group\ndiscussion\n• Interaction\n\n• Interviews/\nquestioning\n• Observation\n2. Work with\nothers\n2.1 Develop effective workplace\nrelationship\n2.2 Contribute to work group\nactivities\n• Group\ndiscussion\n• Interaction\n• Interviews/\nquestioning\n• Demonstration\n• Observation\n3. Demonstrate\nwork values\n\n3.1 Define the purpose of work\n3.2 Apply work values/ethics\n3.3 Deal with ethical problems\n3.4 Maintain integrity of conduct in\nthe workplace\n• Group\ndiscussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n4. Practice\nhousekeeping\nprocedures\n4.1 Sort and remove unnecessary\nitems\n4.2 Arrange items\n4.3 Maintain work areas, tools and\nequipment\n4.4 Follow standardize work process\nand procedures\n4.5 Perform work spontaneously\n• Group\ndiscussion\n• Interaction\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n\n--- PDF PAGE 48 ---\