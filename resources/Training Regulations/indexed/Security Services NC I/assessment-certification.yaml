  "source_text": "SECTION 4 NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1 To attain the National Qualification of Security Service NC I, the candidate must demonstrate\ncompetence through project-type assessment covering all the units listed in Section 1.\nSuccessful candidates shall be awarded a National Certificate II signed by the TESDA\nDirector General.\n\n4.2 Assessment shall focus on the core units of competency. The tool and common units shall be\nintegrated or assessed concurrently with the core units.\n\n4.3 The following are qualified to apply for assessment and certification:\n\n4.2.1 Graduates of formal, non-formal and informal including enterprise-based training\nprograms\n4.2.2 Experienced Workers (wage employed or self-employed)\n\n4.4 Reassessment is allowed only after one month from the date of assessment. Reassessment\nfor a National Certificate shall be done only on the task/s that the candidate did not\nsuccessfully achieve.\n\n4.5 A candidate who fails the assessment for two (2) consecutive times will be required to go\nthrough a refresher course before taking another assessment.\n\n4.6 Only certified individuals in this Qualification may be nominated by the industry for\naccreditation as competency assessor.\n\n4.7 Only accredited competency assessors are allowed to conduct competency assessment,\nhowever, trainers who are accredited competency assessors are not allowed to assess their\ntrainees.\n\n4.8 Assessment of competence must be undertaken only in the TESDA accredited assessment\ncenter. The performance assessment (demonstration of competence), however, may be done\nin any venue or workplace duly designated by an accredited assessment center.\n\n4.9 The guidelines on assessment and certification are discussed in detail in the Procedures\nManual on Assessment and Certification.\n\n--- PDF PAGE 55 ---\nTR Security Services NC I\nPromulgated May 31, 2005\n-30-\n\n"
}
