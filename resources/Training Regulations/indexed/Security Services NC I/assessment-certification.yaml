  "source_text": "SECTION 4 NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1 To attain the National Qualification of Security Service NC I, the candidate must demonstrate\ncompetence through project-type assessment covering all the units listed in Section 1.\nSuccessful candidates shall be awarded a National Certificate II signed by the TESDA\nDirector General.\n\n4.2 Assessment shall focus on the core units of competency. The tool and common units shall be\nintegrated or assessed concurrently with the core units.\n\n4.3 The following are qualified to apply for assessment and certification:\n\n4.2.1 Graduates of formal, non-formal and informal including enterprise-based training\nprograms\n4.2.2 Experienced Workers (wage employed or self-employed)\n\n4.4 Reassessment is allowed only after one month from the date of assessment. Reassessment\nfor a National Certificate shall be done only on the task/s that the candidate did not\nsuccessfully achieve.\n\n4.5 A candidate who fails the assessment for two (2) consecutive times will be required to go\nthrough a refresher course before taking another assessment.\n\n4.6 Only certified individuals in this Qualification may be nominated by the industry for\naccreditation as competency assessor.\n\n4.7 Only accredited competency assessors are allowed to conduct competency assessment,\nhowever, trainers who are accredited competency assessors are not allowed to assess their\ntrainees.\n\n4.8 Assessment of competence must be undertaken only in the TESDA accredited assessment\ncenter. The performance assessment (demonstration of competence), however, may be done\nin any venue or workplace duly designated by an accredited assessment center.\n\n4.9 The guidelines on assessment and certification are discussed in detail in the Procedures\nManual on Assessment and Certification.\n\n--- PDF PAGE 55 ---\nTR Security Services NC I\nPromulgated May 31, 2005\n-30-\n\nCOMPETENCY MAP\nSECURITY SERVICES NC II\nEstablish\nworkplace\nMonitor activities\nwithin area of\nresponsibility\nand 5S in the\nworkplace\nCOMMON\nCOMPETENCIES\nCORE\nCOMPETENCIES\nCOMPETENCY MAP\nSECURITY SERVICES NC I\nPerform control\nsystem in the\nworkplace\nPerform basic\ncommunication skills\nRespond to emergency\nsituation\nDemonstrate\nmarksmanship\nPerform defensive\ntechniques\nMaintain an effective\nrelationship with\nclients/customers\nManage own\nperformance\nLead workplace\ncommunication\nWork with\nothers\nWork in team\nenvironment\nLead small\nteams\nSolve problems\nrelated to work\nactivities\nReceive and\nrespond to\nworkplace\ncommunication\nParticipate in\nworkplace\ncommunication\nBASIC\nCOMPETENCIES\nApply problem\nsolving\ntechniques to\nworkplace\nPlan and organize\nwork\nPractice career\nprofessionalism\nDemonstrate\nwork values\nPractice\noccupational health\nand safety\nprocedures\nDevelop and\npractice\nnegotiation skills\nUse\nmathematical\nmethod\nUse relevant\ntechnologies\nUtilize\nspecialized\ncommunication\nskills\nDevelop team\nand individual\nCollect, analyze\nand organize\ninformation\nPromote\nenvironmental\nprotection\nPractice basic\nhousekeeping\nprocedures\nand 5S in the\nworkplace\nApply OHS practices\nand 5S in the workplace\nApply quality standards\nPractice\nprofessionalism in the\nsecurity service\n\n--- PDF PAGE 56 ---\nTR Security Services NC I\nPromulgated May 31, 2005\n-31-\n\nDEFINITION OF TERMS\n\n1.\nArea of Responsibility – the place where the guards-on-duty are stationed.\n2.\nBodily Search- is a type of personnel control where the guard-on-duty requires a\nprospective subject to manual search using hands or electronic equipment.\n3.\nCitizens Arrest – taking of person into custody in order for him/her to be bound to answer for\nthe commission of an offense.\n4.\nCompany Premises – refers to a specific place of duty as specified or stated in the Duty\nDetail Order (DDO).\n5.\nDuty Detail Order (DDO) – is a written order/schedule issued by a superior officer usually\nthe private security agency/branch manager or operations officer assigning the performance\nof private security/detective services duties.\n6.\nGuard Detailed – a written report consisting of names of guards mobilized to different post\nassignments in a particular shift.\n7.\n Initial Report – it refers to preliminary phase of investigation report either written or oral and\nin accordance with the company policies.\n8.\nInspection Stick – a non-conductor stick used for inspection of bags and personal luggage.\n9.\nMetal Detector – a security equipment being used by the guards to detect firearms, bladed\nweapons or any metal objects.\n10. Night Stick – an equipment being used by the guard to restrain a person without using the\nfirearm.\n11. Pedestrian Area – refers to a confined area where customers, employees or visitors can\npass for security check.\n12. Physical Barriers – a system placed between the potential intruder and the matter to be\nprotected. These barriers are of different types so that entry may be controlled in the\ncompany.\n13. Roving Inspection – it refers to an exhaustive physical inspection of all operational activities\nin the company either internal or external.\n14. Rules of Evidence – refers to the Rules of Court (Rule 128-131) to be followed by the guard\nfor the preservation of evidence.\n15. Security Service Contract – is a contract of service which include among others the money\nconsideration to be paid by the client to the agency; the number of hours of security services\nper guard per day which the guard himself shall render to the client and the salary each\nindividual security guard shall receive from the agency.\n16. Subject – refers to a person or things which are the object for security reasons.\n17. Territorial Jurisdiction – refers to area of responsibility, strictly covers and defined by the\nsecurity service contract.\n18. Uniform – a set of uniform including its paraphernalia and covered by RA 5487 IRR.\n\n--- PDF PAGE 57 ---\nTR Security Services NC I\nPromulgated May 31, 2005\n-32-\n\nACRONYMS\n\n1.\nADC\n-\nAssistant Detachment Commander\n2.\nAFP\n-\nArmed Forces of the Philippines\n3.\nAOR\n-\nArea Of Responsibility\n4.\nAWOL\n-\nAbsence Without Official Leave\n5.\nAMMOS\n-\nAmmunition\n6.\nBSGC\n-\nBasic Security Guard Course\n7.\nCDC\n-\nCivil Disturbance Control\n8.\nCIR\n-\nCrime Inspection Report\n9.\nCOMD\n-\nCommand\n10. CSO\n-\nChief Security Officer\n11. CSG\n-\nCivil Security Group\n12. DC\n-\nDetachment Commander\n13. DDO\n-\nDuty Detail Order\n14. DTR\n-\nDaily Time Record\n15. FAGSD\n-\nFirearms and Explosives Division\n16. FED\n-\nFire Explosives Division\n17. INFO\n-\nInformation\n18. IR\n-\nInvestigation Report\n19. L/G\n-\nLady Guard\n20. MR\n-\nMemo Receipt\n21. OIC\n-\nOfficer-In-Charge\n22. OPNS\n-\nOperations\n23. PADPAO\n-\nPhilippine Association of Detectives and Protective Agencies Operators\n24. PARSTS\n-\nPhilippine Association of Recognized Security Training Schools Inc.\n25. PDR\n-\nPost Duties and Responsibility\n26. PIC\n-\nPost-In-Charge\n27. PNP\n-\nPhilippine National Police\n28. POI\n-\nProgram Of Instruction\n29. RTC\n-\nRe-Training Course\n30. SAGSD\n-\nSecurity Agencies and Guards Supervision Division\n31. SCA\n-\nSpecific Control Area\n32. SED\n-\nSecurity Executive Director\n33. SD\n-\nSecurity Director\n34. S/G\n-\nSecurity Guard\n35. SIC\n-\nShift In Charge\n36. SOs\n-\nSecurity Officers\n37. SOP\n-\nStandard Operating Procedure\n38. SOTC\n-\nSecurity Officer Training Course\n39. TESDA\n-\nTechnical Education and Skills Development Authority\n40. TL\n-\nTeam Leader\n41. 11 GOs\n-\nEleven General Orders\n42. 5Ws & 1H -\nWhat, Where, When, Who, Why, How\n\n--- PDF PAGE 58 ---\nACKNOWLEDGEMENTS\n\nThe Technical Education and Skills Development Authority (TESDA) wishes to extend thanks\nand appreciation to the many representatives of business, industry, academe and government\nagencies who rendered their time and expertise to the development and validation of these\nTraining Regulations.\n\nTHE TECHNICAL EXPERT PANEL (TEP)\n\nMR. ROGER P. CUARESMA\nSchool Director\nJET-SQUAD\nANRO Bldg., Suite 203\n2/F No. 22, Matalino Street\nDiliman, Quezon City\n\nMR. LIBRADO T. CAYCO SR. CSP\nTraining Director\nTASK Security Academy Inc.\n138 3/F 14th Ave., Near Cor. P.\nTuazon, Brgy. Soccorro\nCubao, Quezon City\n\nP/SUPT. DANILO L. MALIGALIG\nChief, Private Security Training Management Branch\nSAGSD, CSG-PNP\nCamp Crame, Quezon City\n\nP/SR. INSP. CONSOLACION B. RAPADA\n\nTraining Officer\n\nSAGSD, CSG-PNP\n\nCamp Crame, Quezon City\n\nMembers of the TESDA Board\n\nTESDA EXCOM\n\nThe MANAGEMENT and STAFF of the TESDA Secretariat\n\n--- PDF PAGE 59 ---\nList of Published Training Regulations\n\n❑ Animal Production NC II\n❑ Aquaculture NC II\n❑ Automotive Body Painting/Finishing NC II\n❑ Automotive Body Repair NC II\n❑ Automotive Engine Rebuilding NC II\n❑ Automotive Servicing NC II\n❑ Bartending NC II\n❑ Building Wiring Installation NC II\n❑ Carpentry NC II\n❑ Commercial Cooking NC II\n❑ Computer Hardware Servicing NC II\n❑ Deck Seafaring NC II\n❑ Dressmaking NC II\n❑ Driving NC II\n❑ Engine Seafaring NC II\n❑ Food and Beverage Services NC II\n❑ Footwear Making NC II\n❑ Heavy Equipment Operation NC II\n❑ Horticulture NC II\n❑ Household Services NC II\n❑ Housekeeping NC II\n❑ Machining NC II\n❑ Masonry NC II\n❑ Motorcycle and Small Engine Servicing NC II\n❑ Plumbing NC II\n❑ Pyrotechnics NC II\n❑ RAC Servicing NC I\n❑ RAC Servicing NC II\n❑ Security Services NC I\n❑ Security Services NC II\n❑ Tailoring NC II\n❑ Tour Guiding Services NC II\n❑ Transport RAC Servicing NC II\n❑ Travel Services NC II\n❑ Welding NC II\n\nThese materials are available in both printed and electronic copies.\nFor more information please contact:\nTechnical Education and Skills Development Authority (TESDA)\nTelephone Nos.: 893-8303, 893-2139; 817-4076 to 82 loc. 615 to 617\nor visit our website: www.tesda.gov.ph\n\n--- PDF PAGE 60 ---"
