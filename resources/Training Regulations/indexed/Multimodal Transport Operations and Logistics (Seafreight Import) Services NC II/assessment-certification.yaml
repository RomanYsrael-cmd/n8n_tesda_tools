  "source_text": "SECTION 4 ASSESSSMENT AND CERTIFICATION ARRANGEMENT\n\nCompetency Assessment is the process of collecting evidence and making judgments\nwhether competency has been achieved. The purpose of assessment is to confirm that an\nindividual can perform to the standards expected at the workplace as expressed in relevant\ncompetency standards.\nThe assessment process is based on evidence or information gathered to prove\nachievement of competencies. The process may be applied to an employable unit(s) of\ncompetency in partial fulfillment of the requirements of the national qualification.\n\n4.1 NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1.1 A National Certificate (NC) is issued when a candidate has demonstrated\ncompetence in all unit/s of competency of a qualification with a promulgated\nTraining Regulations.\n4.1.2 A Certificate of Competency (COC) is issued by the Authority to individuals who\nWere assessed as competent in a single unit or cluster of related units of\ncompetency.\n\nCOC1 Perform seafreight import documentation services\n Perform industry calculation in freight forwarding and documentation\nservices\n Process transport documents for import cargo\n Prepare request for payment and billings\n Prepare and complete statistical reports\n Process shipping documents\n\nCOC 2 Liaise with relevant stakeholders\n Address bottlenecks and work disruptions\n\n4.1.3 Individuals wanting to be certified will have to be assessed in accordance with the\nrequirements identified in the evidence guide of the relevant unit/s of competency.\n\n4.1.4 Recognition of Prior Learning (RPL). Candidates who have gained competencies\nthrough education, informal training, previous work or life experiences may apply\nfor recognition in a particular qualification through competency assessment.\n\n 4.1.4 The following are qualified to apply for assessment:\n\n4.1.4.1 Graduating students/trainees of NTR programs or graduates of\nformal/non-formal/informal including enterprise-based trainings related to\nmultimodal transport operations and logistics services.\n\n4.1.4.2 Industry workers in the multimodal transport operations and logistics\nservices.\n\n--- PDF PAGE 135 ---\nMTOL SERVICES NC II\n\nPromulgated (12/17/2019)\n\n131\n 4.1.5 The industry shall determine assessment and certification requirements for each\nqualification with promulgated Training Regulations. It includes the following:\na. Entry requirements for candidates\nb. Evidence gathering methods\nc. Qualification requirements of competency assessors\nd. Specific assessment and certification arrangements as identified by industry\n\n4.2 COMPETENCY ASSESSMENT REQUISITE\n4.2.1 Self-Assessment Guide. The self-assessment guide (SAG) is accomplished by\nthe candidate prior to actual competency assessment. SAG is a pre-assessment\ntool to help the candidate and the assessor determine what evidence is available,\nwhere gaps exist, including readiness for assessment.\n\n This document can:\na. Identify the candidate’s skills and knowledge\nb. Highlight gaps in candidate’s skills and knowledge\nc. Provide critical guidance to the assessor and candidate on the evidence that\nneed to be presented\nd. Assist the candidate to identify key areas in which practice is needed or\nadditional information or skills that should be gained prior `\n4.2.2 Accredited Assessment Center. Only Assessment Center accredited by\nTESDA is authorized to conduct competency assessment. Assessment centers\nundergo a quality assured procedure for accreditation before they are authorized\nby TESDA to manage the assessment for National Certification.\n4.2.3 Accredited Competency Assessor. Only accredited competency assessor is\nauthorized to conduct assessment of competence. Competency assessors\nundergo a quality assured system of accreditation procedure before they are\nauthorized by TESDA to assess the competencies of candidates for National\nCertification.\n\n--- PDF PAGE 136 ---\nMTOL SERVICES NC II\n\nPromulgated (12/17/2019)\n\n132\nCOMPETENCY MAP – TRANSPORT AND LOGISTICS SECTOR\nMULTIMODAL TRANSPORT OPERATIONS AND LOGISTICS (SEAFREIGHT IMPORT) SERVICES NCII\n\n BASIC COMPETENCIES\n\nLead workplace\ncommunication\nLead small\nteams\nApply critical\nthinking and\nproblem-\nsolving\ntechniques in\nthe\nworkplace\n\nWork in a\ndiverse\nenvironment\nPropose\nmethods of\napplying\nlearning and\ninnovation in\nthe\norganization\nUse\ninformation\nsystematically\nEvaluate\noccupational\nsafety and\nhealth work\npractices\n\nEvaluate\nenvironment\nal work\npractices\n\nFacilitate\nentrepreneurial\nskills for micro-\nsmall-medium\nenterprises\n(MSMEs)\n\nReceive and\nrespond to\nworkplace\ncommunication\nWork with\nothers\nSolve/addres\ns routine\nproblems\nEnhance self-\nmanagement\nskills\nSupport\nInnovation\nAccess and\nmaintain\ninformation\nFollow\noccupational\nsafety and\nhealth policies\nand\nprocedures\nApply\nenvironment\nal work\nstandards\nAdopt\nentrepreneurial\nmindset in the\nworkplace\nParticipate in\nworkplace\ncommunication\nWork in\nTeam\nEnvironment\nSolve/address\ngeneral\nworkplace\nproblems\nDevelop\ncareer and life\ndecisions\nContribute\nto workplace\ninnovation\nPresent\nrelevant\ninformation\nPractice\noccupational\nsafety and\nhealth policies\nand\nprocedures\nExercise\nefficient and\neffective\nsustainable\npractices in\nthe\nworkplace\nPractice\nentrepreneurial\nskills in the\nworkplace\n\n--- PDF PAGE 137 ---\nMTOL SERVICES NC II\n\nPromulgated (12/17/2019)\n\n133\n COMMON COMPETENCIES\n\nCORE COMPETENCIES\n\nPerform industry\ncalculation in freight\nforwarding and\ndocumentation services\nProcess transport\ndocuments for import\ncargo\nPrepare request\nfor payment and\nbillings\nPrepare and\ncomplete statistical\nreports\nLiaise with\nrelevant\nstakeholders\nAddress bottlenecks\nand work disruptions\n\nApply freight forwarding\ndocumentation services\nand workplace procedures\nPerform workplace\nsecurity and safety\nProvide effective\ncustomer service\nContribute to quality\nsystem\n\nPerform computer\noperations\n\n--- PDF PAGE 138 ---\nMTOL SERVICES NC II\n\nPromulgated (12/17/2019)\n\n134\nGLOSSARY OF TERMS\n\nAural - Relating to the sense of hearing\n\nBest practices - Commercial or professional procedures accepted as being correct or most\n effective\n\nBottlenecks - A process in a chain of processes with limited capacity reducing maximum\n capacity\n\nCargo stripping - Unloading of contents or cargo from a freight container or tanker\n\nCarrier - A person or company responsible for physical custody of goods and for any loss if any\n\nComputer hardware - Physical parts of a computer system such as keyboard, wire connectors,\n monitor screen, mother board, hard Disk drive , among others.\n\nComputer software - Set of instructions that tells a computer what and how to do a particular\n task ie.programs, applications.\n\nComputer storage - A process or physical station on which digital data is saved or stored\n\nContingency plan - A plan designed to take a possible future event into account; a recovery\n plan.\n\nCustomer service - Assistance or advice provided by a company to its customers\n\nData - Facts or statistics collected together for reference or analysis.\n\nDelivery order - A release document from the buyer, agent, or consignee to another party\n\nEffectiveness - Extent to which actual results have impact to fulfill desired outcomes.\n\nEfficiency - Efficiency means whatever is performed should be done in a perfect way\n likewise reducing wastage\n\nEntrepreneurial - Characterized by the taking of financial risks in the hope of profit;\n enterprising.\n\nErgonomic - Relating to or designed for efficiency and comfort in the working\n environment\n\nEthical - Relating to moral principles\n\nFiduciary - Involving trust, especially with regard to the relationship between the\n trustee and beneficiary\nForms - Business forms used by companies on a standard basis between and\n among management, staff, suppliers and customers\n\n--- PDF PAGE 139 ---\nMTOL SERVICES NC II\n\nPromulgated (12/17/2019)\n\n135\nInnovation - Beliefs and attitudes in going about addressing problems in the\n workplace through new ideas or better ways of doing things\n\nInsurance - Means of protection from financial loss\n\nIntegrate - Combine with one another so that they become a whole to achieve its\n objectives\n\nLegislation - Statutory law or ordinance with order as its core objective\n\nLiaison - Cooperation or communication which facilitates a close working\n relationship between people\n\nParameters- A measureable factor forming one of a set that defines a system or\n sets the condition for a Particular operation\n\nPeripheral devices - Examples are auxiliary devices such as keyboard or printer connected\n to a computer\n\nProtocols - Proper procedure of respect\n\nQuality manual - A document that states a company’s intentions for operating processes\n within a quality Management system\n\nQuarantine - Strict isolation for purposes of preventing spread of a disease from\n people, plants, or animals\n\nRegulatory - Serving or intended to regulate or control something.\n\nSafety - Condition of being protected from unlikely danger, risk, or injury\n\nSecurity threat - Something that may or may not happen but has the potential to cause\n serious damage\n\nTimeline - Agreed deadlines or time frame in which to accomplish a certain task\n\nWork disruption - Any event or circumstance which may create damage or loss to a\n business or operation\n\n--- PDF PAGE 140 ---\nMTOL SERVICES NC II\n\nPromulgated (12/17/2019)\n\n136\n\nACRONYMS\n\nNC 11 - TR\n\nBIR\nBureau of Internal Revenue\nBOC\nBureau of Customs\nCD\nCompact Disc\nDOF\nDepartment of Finance\nDTI\nDepartment of Trade and Industry\nECC\nEnvironmental Clearance Certificate\nEDI\nElectronic Data Interchange\nEHS\nEnvironment, Health and Safety\nETD\nExplosive Trace Detection\nFCL\nFull Container Load\nHR\nHuman