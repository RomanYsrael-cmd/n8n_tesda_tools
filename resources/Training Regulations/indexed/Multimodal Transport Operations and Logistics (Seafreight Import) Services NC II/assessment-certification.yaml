tion services and workplace procedures Perform workplace security and safety Provide effective customer service Contribute to quality system Perform computer operations --- PDF PAGE 138 --- Promulgated (12/17/2019) 134 Aural - Relating to the sense of hearing Best practices - Commercial or professional procedures accepted as being correct or most effective Bottlenecks - A process in a chain of processes with limited capacity reducing maximum capacity Cargo stripping - Unloading of contents or cargo from a freight container or tanker Carrier - A person or company responsible for physical custody of goods and for any loss if any Computer hardware - Physical parts of a computer system such as keyboard, wire connectors, monitor screen, mother board, hard Disk drive , among others. Computer software - Set of instructions that tells a computer what and how to do a particular task ie.programs, applications. Computer storage - A process or physical station on which digital data is saved or stored Contingency plan - A plan designed to take a possible future event into account; a recovery plan. Customer service - Assistance or advice provided by a company to its customers Data - Facts or statistics collected together for reference or analysis. Delivery order - A release document from the buyer, agent, or consignee to another party Effectiveness - Extent to which actual results have impact to fulfill desired outcomes. Efficiency - Efficiency means whatever is performed should be done in a perfect way likewise reducing wastage Entrepreneurial - Characterized by the taking of financial risks in the hope of profit; enterprising. Ergonomic - Relating to or designed for efficiency and comfort in the working environment Ethical - Relating to moral principles Fiduciary - Involving trust, especially with regard to the relationship between the trustee and beneficiary Forms - Business forms used by companies on a standard basis between and among management, staff, suppliers and customers --- PDF PAGE 139 --- Promulgated (12/17/2019) 135 Innovation - Beliefs and attitudes in going about addressing problems in the workplace through new ideas or better ways of doing things Insurance - Means of protection from financial loss Integrate - Combine with one another so that they become a whole to achieve its objectives Legislation - Statutory law or ordinance with order as its core objective Liaison - Cooperation or communication which facilitates a close working relationship between people Parameters- A measureable factor forming one of a set that defines a system or sets the condition for a Particular operation Peripheral devices - Examples are auxiliary devices such as keyboard or printer connected to a computer Protocols - Proper procedure of respect Quality manual - A document that states a company’s intentions for operating processes within a quality Management system Quarantine - Strict isolation for purposes of preventing spread of a disease from people, plants, or animals Regulatory - Serving or intended to regulate or control something. Safety - Condition of being protected from unlikely danger, risk, or injury Security threat - Something that may or may not happen but has the potential to cause serious damage Timeline - Agreed deadlines or time frame in which to accomplish a certain task Work disruption - Any event or circumstance which may create damage or loss to a business or operation --- PDF PAGE 140 --- Promulgated (12/17/2019) 136 NC 11 - TR BIR Bureau of Internal Revenue BOC Bureau of Customs CD Compact Disc DOF Department of Finance DTI Department of Trade and Industry ECC Environmental Clearance Certificate EDI Electronic Data Interchange EHS Environment, Health and Safety ETD Explosive Trace Detection FCL Full Container Load HR Human Resources ID Identification International Commercial Terms LCL Less Container Load Material Safety Data Sheet OHS Occupational Health and Safety Occupational Safety & Health PPE Personal Protective Equipm