        "source_title": "PROCESS TRANSPORT DOCUMENTS FOR IMPORT CARGO",
        "source_text": "--- PDF PAGE 68 ---\nTESDA-SOP-QSO-01-F08 \nMTOL SERVICES NC II \n \nPromulgated (12/17/2019) \n \n \n \n64 \nUNIT OF COMPETENCY: \nPROCESS TRANSPORT DOCUMENTS FOR  \nIMPORT CARGO  \nUNIT CODE                  : \nMTO432302 \n \nUNIT DESCRIPTOR     : \nThis unit involves the skills and knowledge \nrequired to identify, collate, and process import \ncargo. Legislative, regulatory or certification \nrequirements maybe applicable to this unit. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variable \nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n1.  Gather \napplicable \ndocumentation \nrequirements \nfor import \ncargo.  \n \n1.1 Documentation \nrequirements \nare identified in \naccordance with \nestablished \nstandard \nprocedures.  \n1.2 Commodity \ntype, size, \ncommercial \nvalue, shipping \nmethod, \nclassification \nare assessed \naccording to \nestablished \nstandards and \nprocedures \n1.3 Import \ndocumentary \nrequirements \nare gathered \nand any missing \ndocument or \ndiscrepancy for \nrectification is \nidentified and \nreported to the \nsuperior in \naccordance with \nworkplace and \nregulatory \nprocedures.  \n1.4 Established \ntimelines and \nprocedures for \ngathering import \n1.1 International \nstandards, criteria \nand certification \nrequirements \n1.2 Customer \ninformation \nincluding: \n1.2.1 Documentation \n1.2.2 Freight charges \n1.2.3 General freight \nforwarding \nrequirements \n1.2.4 Legislative \nrequirements \n1.2.5 Customer \nservice policies \nand procedures \n1.2.6 Verbal or written \nsigned \ncommunications\n, client \nspecifications, \nsupplier and/or \nclient \ninstructions \n1.3 Parameters of \nfreight forwarding \nservices relevant to \ncustomer \nrequirements \nincluding: \n1.3.1 Fiduciary and \nlegal responsibilities \n1.3.2 Freight \nforwarding \nprocedures \n1.1 Apply transport \nand \ndocumentation \nprocedures \n1.2 Recording  \n1.3 Retaining relevant \nrecords \n1.4 Organizational \nskills\n\n--- PDF PAGE 69 ---\nTESDA-SOP-QSO-01-F08 \nMTOL SERVICES NC II \n \nPromulgated (12/17/2019) \n \n \n \n65 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variable \nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \nshipping \ndocuments are \nobserved in \ncompliance with  \nworkplace and \nregulatory \nprocedure  \n \n1.3.3 Insurance \nrequirements \n1.3.4 payment \nrequirements  \n1.3.5 transport modes \n1.3.6 consignment \nmethods \n1.4 Requirements for \nwork including: \n1.4.1 authorities and \npermits \n1.4.2 Freight \nforwarding \nprotocols \n \n \n2. Prepare import  \ndocumentary \nrequirements \n \n \n \n \n2.1 Import shipping \ndocuments \nobtained are \nchecked for \naccuracy and \ncompleteness in \naccordance with \nimport \nrequirements \nand procedures. \n2.2 Arrival details \nare monitored \nand confirmed \nwith the carriers \nin accordance \nwith work \nprocedures  \n2.3 preparation and \nsubmission of \ninward foreign \nmanifest in \naccordance with \ncustoms \nregulations and \nworkplace \nprocedures. \n    \n \n2.1 International \nstandards, criteria \nand certification \nrequirements \n2.2 Customer \ninformation \nincluding: \n2.2.1 Documentation \n2.2.2 Freight charges \n2.2.3 General freight \nforwarding \nrequirements \n2.2.4 Legislative \nrequirements \n2.2.5 Customer \nservice policies \nand procedures \n2.3 Parameters of \nfreight forwarding \nservices relevant to \ncustomer \nrequirements \nincluding: \n2.3.1 Fiduciary and \nlegal \nresponsibilities \n2.3.2 Freight \nforwarding \nprocedures \n2.3.3 Insurance \nrequirements \n3.1 Advising on \nprocedures and \nprotocols for \nforwarding various \ncargo to different \ndestinations \n3.2 Advising on \nrelevant \nregulations and \nrequired \ndocumentation \n3.3 Applying relevant \ncodes of practice \nand legislative \nrequirements \nincluding local and \ninternational \nfreight \n3.4 Communicating \neffectively  \n3.5 Reading and \ninterpreting \nrelevant \ninstructions, \nprocedures, \ninformation and \nsigns \n3.6 Rectifying \nidentified problems \npromptly\n\n--- PDF PAGE 70 ---\nTESDA-SOP-QSO-01-F08 \nMTOL SERVICES NC II \n \nPromulgated (12/17/2019) \n \n \n \n66 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variable \nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n2.3.4 Payment \nrequirements \nand procedures \n2.3.5 Relevant \nlegislative \nrequirements \n2.3.6 Types of \ntransport modes \n2.3.7 Various \nconsignment \nmethods. \n \n \n3 Issue \ndocumentary \nrequirements \nfor import \ndelivery \n \n  \n3.1 Arrival notice is \nissued to the \nconsignee  \n3.2 All import \ndocumentary \nrequirements to \nfacilitate transfer \nand stripping of \nimport cargoes \nare prepared.  \n3.3 Delivery order is \nissued to \nconsignee or its \nauthorized \nrepresentative \nupon fulfillment \nof all \ndocumentary \nand financial \nrequirements  \n3.4 Other \ndocumentary \nrequirements \nand procedures \nto address \ndiscrepancies in \naccordance with \nstandard \nprocedure  \n3.1 International \nstandards, criteria \nand certification \nrequirements \n3.2 Customer \ninformation \nincluding: \n3.2.1 documentation \n3.2.2 freight charges \n3.2.3 general freight \nforwarding \nrequirements \n3.2.4 legislative \nrequirements \n3.2.5 customer \nservice policies \nand procedures \n3.3 Parameters of \nfreight forwarding \nservices relevant to \ncustomer \nrequirements \nincluding: \n3.3.1 fiduciary and \nlegal \nresponsibilities \n3.3.2 freight \nforwarding \nprocedures \n3.3.3 insurance \nrequirements \n3.3.4 payment \nrequirements \nand procedures \n3.1 Advising on \nprocedures and \nprotocols for \nforwarding various \ncargo to different \ndestinations \n3.2 Advising on \nrelevant \nregulations and \nrequired \ndocumentation \n3.3 Applying relevant \ncodes of practice \nand legislative \nrequirements \nincluding local and \ninternational \nfreight \n3.4 Communicating \neffectively \n3.5  Interpreting \nrelevant \ninstructions, \nprocedures, \ninformation and \nsigns \n3.6 Rectifying \nidentified problems \npromptly\n\n--- PDF PAGE 71 ---\nTESDA-SOP-QSO-01-F08 \nMTOL SERVICES NC II \n \nPromulgated (12/17/2019) \n \n \n \n67 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variable \nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n3.3.5 relevant \nlegislative \nrequirements \n3.3.6 types of \ntransport modes \n3.3.7 various \nconsignment \nmethods. \n4. Track and \nupdate status \nof import cargo  \n \n \n \n4.1 Any cargo \nirregularity is \nreported to the \nsuperior for \nappropriate \naction in \naccordance with \nworkplace and \nregulatory \nprocedures. \n4.2 Status of cargo \nrelease is \nmonitored and \nreported to the \nsuperior in \naccordance with \nagreed lead time \nand regulatory \nrequirements.  \n4.3 Any special \ninstructions are \ncoordinated with \nconcerned \nparties in \naccordance with \nclient’s and \nworkplace \nrequirements  \n4.1International \nstandards, criteria \nand certification \nrequirements \n4.2Customer \ninformation \nincluding: \n4.2.1documentation \n4.2.2freight charges \n4.2.3general freight \nforwarding \nrequirements \n4.2.4legislative \nrequirements \n4.2.5customer service \npolicies and \nprocedures \n4.2.6supplier and/or \nclient instructions \n4.3 Parameters of \nfreight forwarding \nservices relevant \nto customer \nrequirements \nincluding: \n4.3.1fiduciary and legal \nresponsibilities \n4.3.2freight forwarding \nprocedures \n4.3.3insurance \nrequirements \n4.3.4payment \nrequirements  \n4.3.5relevant \nlegislative \nrequirements \n \n \n4.1 Advising on \nprocedures and \nprotocols for \nforwarding various \ncargo to different \ndestinations \n4.2 Advising on \nrelevant \nregulations and \nrequired \ndocumentation \n4.3 Applying relevant \ncodes of practice \nand legislative \nrequirements \nincluding local and \ninternational \nfreight \n4.4 Communicating \neffectively with \nothers when \nproviding freight \nforwarding \nservices to \ncustomers \n4.5 Creating \ndocumentation \nrelated to \nproviding freight \nforwarding \nservices to \ncustomers \n4.6 Modelling \nexcellence in \nproviding freight \nforwarding \ninformation and \ncustomer service\n\n--- PDF PAGE 72 ---\nTESDA-SOP-QSO-01-F08 \nMTOL SERVICES NC II \n \nPromulgated (12/17/2019) \n \n \n \n68 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variable \nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n4.4 Relevant codes of \npractice and \nlegislative \nrequirements \nincluding local and \ninternational \nfreight regulations \nincluding: \n4.4.1regulations and \ncodes of practice \nfor international \nand domestic \nfreight transport \n4.4.2 local and \ninternational \nstandards and \ncertification \nrequirements \n4.4.3 Appropriate action \nthat can be taken \nto prevent or solve \nthese problems \n4.4.4 Relevant computer \nand mobile \nsoftware \napplication for \ncargo status, track \nand trace.  \n \n4.7 Modifying activities \ndepending on \noperational \ncontingencies, risk \nsituations and \nenvironments \n4.8 Monitoring work \nactivities in terms \nof planned \nschedule \n4.9 Providing \ninformation to \ncustomers on \nfreight forwarding \noperations \n4.10 Interpreting \nrelevant \ninstructions, \nprocedures, \ninformation and \nsigns \n4.11 Reporting \nand/or rectifying \nidentified problems \npromptly \n4.12 Retaining \nrecords and \ndocumentation \n4.13 Working \ncollaboratively \nwith others \nwhen providing \nfreight \nforwarding \nservices to \ncustomers \n4.14 Working \nsystematically \nwith required \nattention to \ndetail.\n\n--- PDF PAGE 73 ---\nTESDA-SOP-QSO-01-F08 \nMTOL SERVICES NC II \n \nPromulgated (12/17/2019) \n \n \n \n69 \nRANGE OF VARIABLES  \n \nVARIABLE \nRANGE \n1. Commodity Type \nMay include: \n1.1 \nGeneral Cargo \n1.2 \nDangerous Goods \n1.3 \nPerishable \n1.4 \nBulk or Containerized  \n \n2. Size \nMay include: \n2.1 \nOut of Gauge \n2.2 \nHeavy Lift \n2.3 \nLCL \n2.4 \nFCL \n3. Commercial Value \nMay include: \n3.1 \nValuable Cargo \n3.2 \nNon-Valuable Cargo \n \n4. Shipping Method \nMay include: \n4.1 \nUnitized \n4.2 \nLoose \n4.3 \nBreak Bulk  \n4.4 \nBulk \n4.5 \nChartered \n4.6 \nRoll on – Roll off \n4.7 \nOverland  \n4.8 \nRail \n5. Classification \nMay include:  \n5.1 \nTransshipment cargo \n5.2 \nBonded \n5.3 \nConsumption  \n5.4 \nTemporary importation \n5.5 \nconsolidation \n6. Customer \nMay include: \n6.1 \nConsignee  \n6.2 \nNotified Party \n6.3 \nAuthorized Representative or Broker \n7. Regulatory Procedures \nMay include:  \n7.1 \nCustoms Manifesting  \n7.2 \nCommodity Regulating Body \n7.3 \nPort Procedures \n7.4 \nRoad Regulations  \n8. Import Shipping Documents \nMay include:  \n8.1 \nImport Manifest  \n8.2 \nBill of Lading \n8.3 \nMSDS \n8.4 \nDangerous Goods Declaration \n8.5 \nSpecial Delivery Instruction \n8.6 \nLoad Port Survey \n8.7 \nPacking List \n8.8 \nCommercial Invoice\n\n--- PDF PAGE 74 ---\nTESDA-SOP-QSO-01-F08 \nMTOL SERVICES NC II \n \nPromulgated (12/17/2019) \n \n \n \n70 \nVARIABLE \nRANGE \n8.9 \nCertificate of Origin \n8.10 Fumigation Certificate \n8.11 Phytosanitary Certificate \n8.12 Letter of authorization to transfer consolidated \ncontainer to Container freight Station \n8.13 Authorization letter to surveyor to conduct \ninspection during striping of consolidated cargo \nat container freight station  \n9. Inward Foreign Manifest \nMay include: \n9.1 \nInward Rider Manifest \n9.2 \nConsolidators Manifest \n9.3 \nElectronic Manifest \n9.4 \nCarrier’s Inward Foreign Manifest \n9.5 \nTransshipment Manifest \n10. Arrival Details \nMay include: \n10.1 Date and time of actual vessel berthing / arrival \n10.2 Manifest submission details of shipping line \n10.3 Registry Number \n10.4 Port of Discharge \n10.5 Applicable Rate of Exchange \n \n11. Consignee \nMay include: \n11.1 Importer on record \n11.2 Notify party named on bill of lading \n11.3 Authorized representative \n11.4 Co-loader  \n12. Import Documentary \nRequirements \nMay include: \n12.1 Authorization letter to container freight station \n12.2 Authorization letter to surveyor \n12.3 Delivery order \n12.4 Original house bill of lading \n12.5 Bank Guarantee \n12.6 Company Guarantee \n12.7 Container Guarantee \n12.8 Payment of Forwarder’s Charges \n12.9 Authorization Letter from Consignee \n12.10 Company and Valid Government ID \n13. Irregularity \nMay include: \n13.1 Misrouted \n13.2 Short Shipped \n13.3 Damaged \n13.4 Lost \n13.5 Pilfered  \n13.6 Wrongly Shipped \n13.7 Over stayed at port \n13.8 Abandoned\n\n--- PDF PAGE 75 ---\nTESDA-SOP-QSO-01-F08 \nMTOL SERVICES NC II \n \nPromulgated (12/17/2019) \n \n \n \n71 \nEVIDENCE GUIDE \n \n1. Critical Aspects \nof Competency \nAssessment requires evidence that the candidate: \n1.1. Made accurate calculations of freight and other related \ncharges considering currency conversions and other factors \naffecting mathematical representation. \n1.2. Cost estimates were done in timely manner.  \n2. Resource \nImplications \nThe following resources should be provided: \n2.1 Variety of Information \n2.2 Communication tools \n2.3 Simulated workplace \n3. Methods of \nAssessment \nCompetency in this unit must be assessed through: \n3.1 Written Examination \n3.2 Oral Questioning \n4. Context for \nAssessment \n4.1 Competency maybe assessed in actual workplace or at the \ndesignated TESDA accredited Assessment Center.\n",
