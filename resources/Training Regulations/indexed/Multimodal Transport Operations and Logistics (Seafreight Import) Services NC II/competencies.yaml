        "source_text": "--- PDF PAGE 86 ---\nTESDA-SOP-QSO-01-F08 \nMTOL SERVICES NC II \n \nPromulgated (12/17/2019) \n \n \n \n82 \nUNIT OF COMPETENCY       : \nPROCESS SHIPPING DOCUMENTS \n \nUNIT CODE \n         : \nMTO432305 \n \nUNIT DESCRIPTOR               : \nThis unit covers the knowledge, skills and attitudes required \nto ensure the completeness and accuracy of documents for \nprocessing. Licensing, legislative, regulatory or certification \nrequirements may be applicable to this unit. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Familiarize \ndocuments \nsubject for \nexternal \nprocessing \n1.1  Documents for \nexternal processing \nare identified in \naccordance with \nworkplace \nprocedure \n1.2 Documents for \nexternal processing \nincluding  financial \nrequirements are \nprepared in \naccordance with \nworkplace \nprocedure  \n1.3 Documents for \nexternal processing \nare checked for \ncompleteness and \naccuracy in \naccordance with \nworkplace \nprocedure. \n1.4  Status of work \nassignments are \nreported to superior \nwithin established \ntimeline and \nprocedure. \n1.1 Organizational \npolicy and \nprocedures \nrelating to liaison \nwith other \norganizations \n1.2 Role as liaison \npersonnel \n1.3 Knowledge of \ncurrent practices \nand procedures \nfor \ncommunicating in \nthe workplace  \n1.4 Forwarding \nprotocolos and \nprocedures  \n1.5 Awareness of the \napproach to the \nspecific \ngovernment \nagencies to deal \nwith such as \nDOF, BIR, BOC, \nDTI etc. for \nclearance \nprocurement, \nand other private \nagencies   \n1.1 Networking and \ndeveloping \nrelationships \n1.2 Negotiation \nskills  \n1.3 Social skills  \n1.4 Write legibly \n1.5 Communicate \neffectively with \nconcerned \nstakeholders \n1.6 Accomplish \nrequired form \ndetails \ncompletely and \naccurately \n  \n2.Process \ndocuments \n \n \n2.1 Relevant \nstakeholders who \nwill process \ndocuments are \nidentified in \naccordance with \nworkplace \nprocedure. \n2.1  Workplace \nprocedures and \nstandards \n2.2 Workplace \nstructures and \nthe roles and \nresponsibilities of \nFreight forwarder  \n2.1 Communicating \neffectively with \nothers when \ncompleting \nworkplace \norientation  \n2.2 Reading and \ninterpreting\n\n--- PDF PAGE 87 ---\nTESDA-SOP-QSO-01-F08 \nMTOL SERVICES NC II \n \nPromulgated (12/17/2019) \n \n \n \n83 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n2.2 Work plan and \nschedule are \nprepared in \naccordance with \nworkplace standard \noperating \nprocedure. \n2.3 Status of processing \nactivities are \nmonitored and \nreported to the \nsuperior  \n2.4 Processed \ndocuments are \nsubmitted and \nreported to superior \nin accordance with  \nset timeline \n2.3 Freight \nforwarding, \nshipping and \ntrade \nterminologies \n2.4 Use of alternative \nprocess/material\ns in processing \ndocuments to \nminimize waste \ninstructions, \nprocedures, \ninformation and \nsigns relevant \nto work \nactivities \n2.3 Interpreting \nand following \noperational \ninstructions  \n2.4 Identifying and \ncorrectly using \nterminologies, \nprocesses and \nprocedures \n2.5 Selecting and \nusing \nappropriate \nterminologies  \n3. Liquidate \nexpenses \n \n \n3.1 Proof of payments \nare collated in \naccordance with \ncompany procedure \n3.2 Amounts are tallied \nagainst cash \nadvances in \naccordance with \ncompany procedure  \n3.3 Liquidation reports \nare submitted for \napproval by the \nsuperior in \naccordance with \ncompany procedure \n \n3.1 Organizational \npolicy and \nprocedures \nrelating to liaison \nwith other \norganizations \n3.2 Role as liaison \npersonnel. \n3.3 Knowledge of \ncurrent practices \nand procedures \nfor \ncommunicating in \nthe workplace  \n3.4 Follow protocols \nand procedures  \n3.5 Awareness of the \napproach to the \nspecific \ngovernment \nagencies to deal \nwith such as \nDOF, BIR, BOC, \nDTI etc. for \nclearance \nprocurement, \nand other private \nagencies   \n3.1 Networking and \ndeveloping \nrelationships \n3.2 Negotiation \nskills  \n3.3 Social skills.  \n3.4 Write legibly \n3.5 Accomplish \nrequired form \ndetails \ncompletely and \naccurately\n\n--- PDF PAGE 88 ---\nTESDA-SOP-QSO-01-F08 \nMTOL SERVICES NC II \n \nPromulgated (12/17/2019) \n \n \n \n84 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Required Documents \nMay include: \n1.1 Bill of Lading \n1.2 Delivery Order \n1.3 Transport Documents \n1.4 Commercial Documents \n2. Work Assignment \nMay include: \n2.1 Pickup of documents \n2.2 Payment of charges \n2.3 Messengerial functions \n2.4 Representation \n2.5 processing of documents \n3. Financial \nRequirements \nMay include: \n3.1 Transportation Allowance \n3.2 Carrier’s Charges \n3.3 Warehousing Charges \n3.4 Filing Fees \n3.5 Port Charges\n\n--- PDF PAGE 89 ---\nTESDA-SOP-QSO-01-F08 \nMTOL SERVICES NC II \n \nPromulgated (12/17/2019) \n \n \n \n85 \n  EVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency  \nAssessment requires evidence that the candidate: \n1.1 Learned to process documents with external parties such \nas government agencies, the consignee or broker, \nshipping lines, and port authorities. \n1.2 Processed documents and liquidated expenses and/ or \nadvances within established standards and timelines. \n \n2. Resource Implications \nThe following resources should be provided: \n2.1 Fax machine \n2.2 Telephone \n2.3 Writing materials \n2.4 Internet \n2.5 Forms \n2.6 Computer \n3.Methods of \nAssessment \nCompetency in this unit may be assessed through: \n3.1 Written Test \n3.2 Demonstration with questioning \n3.3 Interview \n4.Context of Assessment 4.1 Competency maybe assessed in actual workplace or at \nthe designated TESDA accredited Assessment Center.\n",
