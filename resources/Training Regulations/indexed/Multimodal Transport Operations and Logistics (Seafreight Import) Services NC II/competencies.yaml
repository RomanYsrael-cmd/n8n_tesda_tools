aison \npersonnel. \n2.3 Knowledge of \ncurrent practices \nand procedures for \ncommunicating in \nthe workplace  \n2.4 follow protocols and \nprocedures  \n2.1 Networking and \ndeveloping \nrelationships \n2.2 negotiation \nskills  \n2.3 Social skills.  \n2.4 write legibly \n2.5 Accomplish \nrequired form \ndetails \ncompletely and \naccurately\n\n--- PDF PAGE 91 ---\nTESDA-SOP-QSO-01-F08 \nMTOL SERVICES NC II \n \nPromulgated (12/17/2019) \n \n \n \n87 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n2.5 Awareness of the \napproach to the \nspecific government \nagencies to deal \nwith such as DOF, \nBIR, BOC, DTI etc. \nfor clearance \nprocurement, and \nother private \nagencies   \n3. Maintain good \nrapport with \nrelevant \nstakeholders \n \n \n \n \n3.1 Focal contact \npersons for each \nrelevant \nstakeholders are \nidentified in \naccordance with \nworkplace procedure \n3.2 Work relationship \nwith relevant \nstakeholder is \ninitially established \nthrough face to face \nmeetings \n3.3 regular and open \ncommunication is \nestablished with \nrelevant \nstakeholders with \nworkplace procedure  \n3.1 Organizational \npolicy and \nprocedures relating \nto liaison with other \norganizations \n3.2 Role as liaison \npersonnel. \n3.3 Knowledge of \ncurrent practices \nand procedures for \ncommunicating in \nthe workplace  \n3.4 Freight forwarding \nprotocols and \nprocedures  \n3.5 Awareness of the \napproach to the \nspecific government \nagencies to deal \nwith such as DOF, \nBIR, BOC, DTI etc. \nfor clearance \nprocurement, and \nother private \nagencies   \n \n3.1 Networking and \ndeveloping \nrelationships \n3.2 Negotiation \nskills  \n3.3 Social skills.  \n3.4 Write legibly \n3.5 Accomplish \nrequired form \ndetails \ncompletely and \naccurately\n\n--- PDF PAGE 92 ---\nTESDA-SOP-QSO-01-F08 \nMTOL SERVICES NC II \n \nPromulgated (12/17/2019) \n \n \n \n88 \nRANGE 