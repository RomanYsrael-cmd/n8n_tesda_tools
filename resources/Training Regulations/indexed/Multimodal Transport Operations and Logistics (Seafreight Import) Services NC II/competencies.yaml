        "source_title": "ADDRESS BOTTLENECKS AND WORK DISRUPTIONS",
        "source_text": "--- PDF PAGE 94 ---\nTESDA-SOP-QSO-01-F08 \nMTOL SERVICES NC II \n \nPromulgated (12/17/2019) \n \n \n \n90 \nUNIT OF COMPETENCY       : \nADDRESS BOTTLENECKS AND WORK DISRUPTIONS  \n \n \n \nUNIT CODE \n         : \nMTO432307 \n \nUNIT DESCRIPTOR               : \nThis unit covers the knowledge, skills and attitudes required \nto identify challenges and work disruptions. Identify \nappropriate contingency plan to ensure smooth completion of \nprocesses. \nLegislative, \nregulatory \nor \ncertification \nrequirements may be applicable to this unit. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Familiarize \nwith \nworkplace \nprocedure \nand practices  \n \n  \n1.1 Workplace \nprocedures and \npractices are \nobtained in \naccordance with \ncompany protocols \n1.2 Workplace \nprocedures and \npractices are studied \nin accordance with \ncompany protocols \n1.3 Workplace \nprocedures and \npractices are applied \nin accordance with \ncompany protocols \n1.1 Organizational \npolicy and \nprocedures relating \nto liaison with other \norganizations \n1.2 Role as liaison \npersonnel. \n1.3 Knowledge of \ncurrent practices \nand procedures for \ncommunicating in \nthe workplace  \n1.4 follow protocols and \nprocedures  \n1.5 Awareness of the \napproach to the \nspecific government \nagencies to deal \nwith such as DOF, \nBIR, BOC, DTI etc. \nfor clearance \nprocurement, and \nother private \nagencies   \n1.1 Networking and \ndeveloping \nrelationships \n1.2 Negotiation \nskills  \n1.3 Social skills.  \n1.4 Write legibly \n1.5 Accomplish \nrequired form \ndetails \ncompletely and \naccurately \n \n \n2. Identify \npossible \nchallenges \nand \ndisruptions \n  \n2.1 A list of possible \nchallenges and \ndisruptions are \nprepared in \naccordance with \ncompany protocols  \n2.2 Contingency plan \nis established in \naccordance with \ncompany protocols \n  \n2.1 Organizational \npolicy and \nprocedures relating \nto liaison with other \norganizations \n2.2 Role as liaison \npersonnel. \n2.3 Knowledge of \ncurrent practices \nand procedures for \ncommunicating in \nthe workplace  \n2.1 Networking and \ndeveloping \nrelationships \n2.2 Negotiation \nskills  \n2.3 Social skills.  \n2.4 Write legibly \n2.5 Accomplish \nrequired form \ndetails \ncompletely and \naccurately\n\n--- PDF PAGE 95 ---\nTESDA-SOP-QSO-01-F08 \nMTOL SERVICES NC II \n \nPromulgated (12/17/2019) \n \n \n \n91 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n2.3 Processes are \nupdated and \nimproved according \nto results of \nexperiences in \naccordance with \ncompany protocols  \n2.4 Freight forwarding \nprotocols and \nprocedures  \n2.5 Awareness of the \napproach to the \nspecific government \nagencies to deal \nwith such as DOF, \nBIR, BOC, DTI etc. \nfor clearance \nprocurement, and \nother private \nagencies   \n \n \n3. Implement the \ncontingency \nplan as \nrequired  \n \n3.1 The specific \nchallenges and \ndisruptions are \nidentified in \naccordance with \ncompany protocols \n3.2 Contingency plan is \napplied to address \nthe specific \nchallenges and \ndisruptions in \naccordance with \ncompany protocols  \n3.3 Reports are \nprepared based on \nthe specific \nchallenges, \ndisruptions, and \ncontingency plan in \naccordance with \ncompany protocols \n3.1 Organizational \npolicy and \nprocedures relating \nto liaison with other \norganizations \n3.2 Role as liaison \npersonnel. \n3.3 Knowledge of \ncurrent practices \nand procedures for \ncommunicating in \nthe workplace  \n3.4 Follow protocols and \nprocedures  \n3.5 Awareness of the \napproach to the \nspecific government \nagencies to deal \nwith such as DOF, \nBIR, BOC, DTI etc. \nfor clearance \nprocurement, and \nother private \nagencies   \n \n3.1 Networking and \ndeveloping \nrelationships \n3.2 Negotiation \nskills  \n3.3 Social skills.  \n3.4 Write legibly \n3.5 Accomplish \nrequired form \ndetails \ncompletely and \naccurately\n\n--- PDF PAGE 96 ---\nTESDA-SOP-QSO-01-F08 \nMTOL SERVICES NC II \n \nPromulgated (12/17/2019) \n \n \n \n92 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Workplace Procedures \nMay include: \n1.1 Business Hours \n1.2 Flowchart \n1.3 Business Processes \n1.4 Security Procedures \n1.5 OSH Procedures \n1.5 Company Protocols \n2. Bottlenecks and \nDisruptions \nMay include: \n2.1 Acts of God  \n2.2 Delays \n2.3 Sudden Change of Schedules  \n2.4 Sudden Change of Contact Persons \n2.5 Sudden Change in Processes \n2.6 Port Disruptions \n2.7 Accidents \n2.8 Strikes and Manmade Calamities \n3. Contingency Plan \nMay include: \n3.1 Alternative Course of Action \n3.2 Substitution of Personnel  \n3.3 Rerouting of Deliveries / Shipments \n3.4 Rescheduling \n3.5 Recovery Plans  \n4. Company Protocols \nMay include: \n4.1 Fiduciary  \n4.2 Accountability to Superior \n4.3 Organizational Heirarchy\n\n--- PDF PAGE 97 ---\nTESDA-SOP-QSO-01-F08 \nMTOL SERVICES NC II \n \nPromulgated (12/17/2019) \n \n \n \n93 \nEVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency  \nAssessment requires evidence that the candidate: \n1.1 Learned to anticipate potential bottlenecks or \nchallenges. \n1.2 Prepared and able to implement contingency plans \naccording to company protocols. \n \n2.Resource Implications \nThe following resources should be provided: \n2.1 Fax machine \n2.2 Telephone \n2.3 Writing Materials \n2.4 Internet \n2.5 Forms  \n2.6 Computer \n3.Methods of Assessment \nCompetency may be assessed through: \n3.1 Written Test \n3.2 Case Analysis \n3.3 Demonstration with questioning \n3.4 Interview \n3.5 Observation \n4.Context of Assessment \n4.1 Competency maybe assessed in actual workplace or \nat the designated TESDA accredited Assessment Center.\n",
