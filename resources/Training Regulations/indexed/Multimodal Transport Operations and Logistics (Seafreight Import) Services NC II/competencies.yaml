        "source_text": "--- PDF PAGE 83 ---\nTESDA-SOP-QSO-01-F08 \nMTOL SERVICES NC II \n \nPromulgated (12/17/2019) \n \n \n \n79 \n \nUNIT OF COMPETENCY  : PREPARE AND COMPLETE STATISTICAL REPORTS \n \nUNIT CODE                       : \nMTO432304 \n \nUNIT DESCRIPTOR         : \nThis unit involves the skills and knowledge required to \ncollate data and prepare statistical reports as required \nby internal and external local and international \nstandards. Legislative, regulatory or certification \nrequirements may be applicable to this unit. \n \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms \nare elaborated in \nthe Range of \nVariable \nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n1. Collate data \nfor reports   \n1.1 Data required \nfor reporting \nare identified in \naccordance \nwith \nworkplace \nprocedure and \nrequirements \n1.2 Applicable \nformats for \nreporting are \nidentified in \naccordance \nwith workplace \nprocedure and \nrequirements \n1.3 Data required \nare collated in \naccordance \nwith workplace \nprocedure and \nrequirements. \n \n1.1. \nInternational \nstandards, \ncriteria and \ncertification \nrequirements \n1.2. \nCustomer \nservice policies \nand procedures \n1.3. \nVerbal or written \nsigned \ncommunications, \ncustomer’s \nspecifications, \nsupplier and/or \ninstructions \n1.4. \nParameters of \nfreight \nforwarding \nservices relevant \nto customer \nrequirements \nincluding: \n1.4.1fiduciary and legal \nresponsibilities \n1.4.2 freight \nforwarding \nprocedures \n1.4.3 insurance \nrequirements \n1.4.4 payment \nrequirements \nand procedures \n1.4.5 types of \ntransport modes \n1.1. Advising on \nprocedures and \nprotocols for \nforwarding \nvarious cargo to \ndifferent \ndestinations \n1.2. Advising on \nrelevant \nregulations and \nrequired \ndocumentation \n1.3. Applying relevant \ncodes of practice \nand legislative \nrequirements \nincluding local \nand international \nfreight \n1.4. Communicating \neffectively with \nothers when \nproviding freight \nforwarding \nservices to \ncustomers \n1.5. Creating \ndocumentation \nrelated to \nproviding freight \nforwarding \nservices to \ncustomers\n\n--- PDF PAGE 84 ---\nTESDA-SOP-QSO-01-F08 \nMTOL SERVICES NC II \n \nPromulgated (12/17/2019) \n \n \n \n80 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms \nare elaborated in \nthe Range of \nVariable \nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n1.4.6 various \nconsignment \nmethods \n \n1.6. Interpreting and \nfollowing \noperational \ninstructions and \nprioritising work \n1.7. Modifying \nactivities \ndepending on \noperational \ncontingencies, \nrisk situations and \nenvironments\n\n--- PDF PAGE 85 ---\nTESDA-SOP-QSO-01-F08 \nMTOL SERVICES NC II \n \nPromulgated (12/17/2019) \n \n \n \n81 \nRANGE OF VARIABLES  \n \nVARIABLE \nRANGE \n1. Workplace Procedure \nMay include: \n1.1 Established Security Procedures \n1.2 Standard Operating Procedures  \n1.3 Company Procedures \n1.4 Enterprise Procedures \n1.5 OSH Procedures \n1.6 Organizational Procedures \n2.Applicable Formats \nMay include: \n2.1 Government- mandated templates \n2.2 Company forms \n2.3 Informal and formal reports \n \n \n \n EVIDENCE GUIDE \n \n1. Critical Aspects \nof Competency \n \n \n \n \nAssessment  requires evidence that the candidate: \n1.1 Prepared statistical reports as required by authorities or \nfor internal purposes. \n1.2 Submitted reports to meet deadlines as prescribed. \n2. Resource \nImplications \n \n \n \nThe following resources should be provided: \n2.1 Workplace Location \n2.2 Materials and human resources relevant to the unit of \ncompetency \n2.3 Relevant and appropriate materials and equipment, and \ntools \n3. Methods of \nAssessment \nCompetency in this unit may be assessed through: \n3.1 Written Test \n3.2 Direct Observation  \n3.3 Demonstration with questioning \n4. Context of \nAssessment \n \n \n \n4.1 Competency maybe assessed in actual workplace or at the \ndesignated TESDA accredited Assessment Center.\n",
        "required_knowledge": [
          "1.1 International standards, criteria and certification requirements",
          "1.2 Customer service policies and procedures",
          "1.3 Verbal or written signed communications, customer’s specifications, supplier and/or instructions",
          "1.4 Parameters of freight forwarding services relevant to customer requirements including:",
          "1.4 1fiduciary and legal responsibilities",
          "1.4 2 freight forwarding procedures",
