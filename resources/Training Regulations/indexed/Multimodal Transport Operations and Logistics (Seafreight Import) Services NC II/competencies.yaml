ping \nrelationships \n3.2 Negotiation \nskills  \n3.3 Social skills.  \n3.4 Write legibly \n3.5 Accomplish \nrequired form \ndetails \ncompletely and \naccurately\n\n--- PDF PAGE 42 ---\nTESDA-SOP-QSO-01-F08 \nMTOL SERVICES NC II \n \nPromulgated (12/17/2019) \n \n \n \n38 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Freight Forwarding \nTerminologies \nMay include: \n1.1 Freight collect \n1.2 Freight prepaid \n1.3 Container freight station  \n1.4 Container yard \n1.5 Stripping  \n1.6 stuffing \n1.7 Said to contain \n1.8 Stowage plan \n1.9 Shipper’s stowed, load and count \n1.10 Estimate time of arrival \n1.11 Estimated time of departure \n2. Shipping terms \nMay include:  \n2.1 full liner term \n2.2 free in and out \n2.3 berthing  \n2.4 shipside discharge \n2.5 direct discharge \n2.6 hook to hook  \n3. Incoterms \nMay include:  \n3.1 Ex works \n3.2 Free on board \n3.3 Cost and Freight \n3.4 Cost, insurance, and Freight \n \n4. Protocols and Formats \nMay include: \n4.1 Heirarchial \n4.2 Business ethics \n4.3 Command responsibility \n4.4 Established templates \n4.5 E-mail ethics \n5. Tools and Equipment \nMay include: \n5.1 Computer \n5.2 Weighing scale \n5.3 Typewriter \n5.4 Measuring tools \n6. Required Documents \n \n \nMay include: \n6.1 delivery order \n6.2 bank or company guarantee \n6.3 container guarantee \n6.4  duly endorsed bill of lading \n6.5  Validated manifest \n7. Work Assignments \nMay include: \n7.1 Duties and responsibilities \n7.2 Deadlines \n7.3 Project work \n7.4 Reports\n\n--- PDF PAGE 43 ---\nTESDA-SOP-QSO-01-F08 \nMTOL SERVICES NC II \n \nPromulgated (12/17/2019) \n \n \n \n39 \n EVIDENCE GUIDE \n \n1. Critical Aspects \nof Competency \n \n \n \n \n \n \n \nAssessment requires evidence that the candidate: \n1.1 Described relevant freight information and applied in the \nworkplace in relation to the customer and relevant parties \n1.2 Executed freight forwarding tasks as assigned in the \nworkplace \n1.3 Utilized tools and equipment and knowledge relevant in the \nfreight logistics industry \n2. Resource \nImplications \n \n \n \n \nThe following resources should be provided: \n2.1 Workplace Environment \n2.2 Tools, Materials, Equipment and new technologies relevant \nto the unit of competency \n2.3 Manuals \n3. Methods of \nAssessment \n \nCompetency in this unit may be assessed through: \n3.1 Written Test \n3.2 Direct observation and oral questioning \n3.3 Interview \n4. Context of \nAssessment \n \n \n \n4.1 Competency maybe assessed in actual workplace or at the \ndesignated TESDA accredited Assessment Center.\n",
