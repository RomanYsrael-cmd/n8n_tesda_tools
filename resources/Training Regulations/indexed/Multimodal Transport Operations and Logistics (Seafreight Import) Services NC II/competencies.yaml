        "source_title": "CONTRIBUTE TO WORKPLACE INNOVATION",
        "source_text": "--- PDF PAGE 22 ---\nTESDA-SOP-QSO-01-F08 \nMTOL SERVICES NC II \n \nPromulgated (12/17/2019) \n \n \n \n18 \nUNIT OF COMPETENCY :  CONTRIBUTE TO WORKPLACE INNOVATION  \n \nUNIT CODE                     :    400311214 \n \nUNIT DESCRIPTOR       : \nThis unit covers the knowledge, skills and attitudes required to \nmake a pro-active and positive contribution to workplace \ninnovation. \n \n \n \nELEMENTS \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \n \nREQUIRED \nKNOWLEDGE \n \nREQUIRED \nSKILLS \n1. Identify \nopportunities to do \nthings better  \n1.1 Opportunities for \nimprovement are \nidentified proactively in \nown area of work. \n1.2 Information are \ngathered and \nreviewed which may \nbe relevant to ideas \nand which might assist \nin gaining support for \nidea. \n1.1 Roles of individuals \nin suggesting and \nmaking \nimprovements. \n1.2 Positive impacts \nand challenges in \ninnovation. \n1.3 Types of changes \nand responsibility. \n1.4 Seven habits of \nhighly effective \npeople. \n \n1.1 Identifying \nopportunities to \nimprove and to do \nthings better. \nInvolvement. \n1.2 Identifying the \npositive impacts \nand the challenges \nof change and \ninnovation. \n1.3 Identifying \nexamples of the \ntypes of changes \nthat are within and \noutside own scope \nof responsibility \n2. Discuss and \ndevelop ideas \nwith other \n2.1 People who could \nprovide input to ideas \nfor improvements are \nidentified. \n2.2 Ways of approaching \npeople to begin \nsharing ideas are \nselected. \n2.3 Meeting is set with \nrelevant people. \n2.4 Ideas for follow up are \nreview and selected \nbased on feedback. \n2.5 Critical inquiry \nmethod is used to \ndiscuss and develop \nideas with others. \n2.1 Roles of individuals \nin suggesting and \nmaking \nimprovements. \n2.2 Positive impacts \nand challenges in \ninnovation. \n2.3 Types of changes \nand responsibility. \n2.4 Seven habits of \nhighly effective \npeople. \n \n2.1 Identifying \nopportunities to \nimprove and to do \nthings better. \nInvolvement. \n2.2 Identifying the \npositive impacts \nand the challenges \nof change and \ninnovation. \n2.3 Providing examples \nof the types of \nchanges that are \nwithin and outside \nown scope of \nresponsibility \n2.4 Communicating \nideas for change \nthrough small group \ndiscussions and \nmeetings.\n\n--- PDF PAGE 23 ---\nTESDA-SOP-QSO-01-F08 \nMTOL SERVICES NC II \n \nPromulgated (12/17/2019) \n \n \n \n19 \n \n \nELEMENTS \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \n \nREQUIRED \nKNOWLEDGE \n \nREQUIRED \nSKILLS \n3. Integrate ideas for \nchange in the \nworkplace \n3.1 Critical inquiry method \nis used to integrate \ndifferent ideas for \nchange of key people. \n3.2 Summarizing, \nanalyzing and \ngeneralizing skills are \nused to extract salient \npoints in the pool of \nideas. \n3.3 Reporting skills are \nlikewise used to \ncommunicate results. \n3.4 Current Issues and \nconcerns on the \nsystems, processes \nand procedures, as \nwell as the need for \nsimple innovative \npractices are \nidentified. \n3.1 Roles of individuals \nin suggesting and \nmaking \nimprovements. \n3.2 Positive impacts \nand challenges in \ninnovation. \n3.3 Types of changes \nand responsibility. \n3.4 Seven habits of \nhighly effective \npeople. \n3.5 Basic research \nskills. \n3.1 Identifying \nopportunities to \nimprove and to do \nthings better. \nInvolvement. \n3.2 Identifying the \npositive impacts \nand the challenges \nof change and \ninnovation. \n3.3 Providing examples \nof the types of \nchanges that are \nwithin and outside \nown scope of \nresponsibility. \n3.4 Communicating \nideas for change \nthrough small group \ndiscussions and \nmeetings. \n3.5 Demonstrating \nskills in analysis \nand interpretation of \ndata.\n\n--- PDF PAGE 24 ---\nTESDA-SOP-QSO-01-F08 \nMTOL SERVICES NC II \n \nPromulgated (12/17/2019) \n \n \n \n20 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Opportunities for \nimprovement \nMay include: \n1.1 Systems. \n1.2 Processes. \n1.3 Procedures. \n1.4 Protocols. \n1.5 Codes. \n1.6 Practices. \n2. Information  \nMay include: \n2.1 Workplace communication problems. \n2.2 Performance evaluation results. \n2.3 Team dynamics issues and concerns. \n2.4 Challenges on return of investment \n2.5 New tools, processes and procedures. \n2.6 New people in the organization. \n3. People who could \nprovide input \nMay include: \n3.1 Leaders. \n3.2 Managers. \n3.3 Specialists. \n3.4 Associates. \n3.5 Researchers. \n3.6 Supervisors. \n3.7 Staff. \n3.8 Consultants (external) \n3.9 People outside the organization in the same field or \nsimilar expertise/industry. \n3.10 Clients \n4. Critical inquiry method \nMay include: \n4.1 \nPreparation. \n4.2 \nDiscussion. \n4.3 \nClarification of goals. \n4.4 \nNegotiate towards a Win-Win outcome. \n4.5 \nAgreement. \n4.6 \nImplementation of a course of action. \n4.7 \nEffective verbal communication. See our pages: \nVerbal Communication and Effective Speaking. \n4.8 \nListening. \n4.9 \nReducing misunderstandings is a key part of \neffective negotiation. \n4.10 Rapport Building. \n4.11 Problem Solving. \n4.12 Decision Making. \n4.13 Assertiveness. \n4.14 Dealing with Difficult Situations.\n\n--- PDF PAGE 25 ---\nTESDA-SOP-QSO-01-F08 \nMTOL SERVICES NC II \n \nPromulgated (12/17/2019) \n \n \n \n21 \nVARIABLE \nRANGE \n5. Reporting skills \nMay include: \n5.1 \nData management. \n5.2 \nCoding. \n5.3 \nData analysis and interpretation. \n5.4 \nCoherent writing. \n5.5 \nSpeaking. \n \n \n \n \n \n \n EVIDENCE GUIDE \n \n1.  Critical aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 Identified opportunities to do things better. \n1.2 Discussed and developed ideas with others on \n       how to contribute to workplace innovation. \n1.3 Integrated ideas for change in the workplace. \n1.4 Analyzed and reported rooms for innovation and  \n       learning in the workplace. \n2.  Resource Implications \nThe following resources should be provided: \n2.1 Pens, papers and writing implements. \n2.2 Cartolina. \n2.3 Manila papers. \n3.  Methods of \nAssessment \nCompetency in this unit may be assessed \nthrough: \n3.1 Psychological and behavioral Interviews. \n3.2 Performance Evaluation. \n3.3 Life Narrative Inquiry. \n3.4 Review of portfolios of evidence and third-party \n       workplace reports of on-the-job performance. \n3.5 Sensitivity analysis. \n3.6 Organizational analysis. \n3.7 Standardized assessment of character strengths \n       and virtues applied. \n4.  Context for \nAssessment \n4.1   Competency may be assessed individually in the \nactual workplace or simulation environment in \nTESDA accredited institutions.\n",
