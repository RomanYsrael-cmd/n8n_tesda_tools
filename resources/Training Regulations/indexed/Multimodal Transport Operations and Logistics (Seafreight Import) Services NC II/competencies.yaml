        "source_title": "WORK IN TEAM ENVIRONMENT",
        "source_text": "--- PDF PAGE 11 ---\nTESDA-SOP-QSO-01-F08 \nMTOL SERVICES NC II \n \nPromulgated (12/17/2019) \n \n \n \n7 \nUNIT OF COMPETENCY: \nWORK IN TEAM ENVIRONMENT \n \nUNIT CODE \n:      400311211 \n \nUNIT DESCRIPTOR \n:   This unit covers the skills, knowledge and attitudes to identify \none’s roles and responsibilities as a member of a team. \n \n \n \nELEMENTS \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \n \nREQUIRED \nKNOWLEDGE \n \nREQUIRED \nSKILLS \n1. Describe \n     team role \n     and scope \n1.1 The role and \nobjective of the \nteam is identified \nfrom available \nsources of \ninformation \n1.2 Team parameters, \nreporting \nrelationships and \nresponsibilities are \nidentified from team \ndiscussions and \nappropriate external \nsources  \n1.1 Group structure \n1.2 Group development \n1.3 Sources of \ninformation \n1.1 Communicating \nwith others, \nappropriately \nconsistent with the \nculture of the \nworkplace \n1.2 Developing ways \nin improving work \nstructure and  \nperforming \nrespective roles in \nthe group or \norganization \n2. Identify one’s \nrole and \nresponsibility \nwithin a team \n2.1  Individual roles and \nresponsibilities \nwithin the team \nenvironment are \nidentified \n2.2  Roles and objectives \nof the team is \nidentified from \navailable sources \nof information          \n2.3  Team parameters, \nreporting \nrelationships and \nresponsibilities are \nidentified based on \nteam discussions \nand appropriate \nexternal sources \n2.1 Team roles and \nobjectives  \n2.2 Team structure and \nparameters \n2.3 Team development \n2.4   Sources of \n        information \n \n2.1 Communicating \nwith others, \nappropriately \nconsistent with the \nculture of the \nworkplace \n2.2 Developing ways \nin improving work \nstructure and  \nperforming \nrespective roles in \nthe group or \norganization\n\n--- PDF PAGE 12 ---\nTESDA-SOP-QSO-01-F08 \nMTOL SERVICES NC II \n \nPromulgated (12/17/2019) \n \n \n \n8 \n \n \nELEMENTS \nPERFORMANCE \nCRITERIA \nItalicized terms \nare elaborated in \nthe Range of \nVariables \n \nREQUIRED \nKNOWLEDGE \n \nREQUIRED \nSKILLS \n3.  Work as a    \n     team member \n3.1  Effective and \nappropriate \nforms of \ncommunications \nare used and \ninteractions \nundertaken with \nteam members \nbased on \ncompany \npractices.  \n3.2  Effective and \nappropriate \ncontributions \nmade to \ncomplement \nteam activities \nand objectives, \nbased on \nworkplace \ncontext \n3.3  Protocols in \nreporting are \nobserved based \non standard \ncompany \npractices.  \n3.4  Contribute to the \ndevelopment of \nteam work plans \nbased on an \nunderstanding of  \nteam’s role and \nobjectives \n \n3.1   Communication \nProcess \n3.2   Workplace \ncommunication \nprotocol \n3.3   Team planning \nand decision \nmaking \n3.4   Team thinking \n3.5   Team roles \n3.6 Process of team \ndevelopment \n3.7 Workplace \ncontext \n \n \n \n3.1  Communicating \nappropriately, \nconsistent with the \nculture of the \nworkplace \n3.2  Interacting \neffectively with \nothers \n3.3 Deciding as an \nindividual and as \na group using \ngroup think \nstrategies and \ntechniques \n3.4 Contributing to \nResolution of \nissues and \nconcerns\n\n--- PDF PAGE 13 ---\nTESDA-SOP-QSO-01-F08 \nMTOL SERVICES NC II \n \nPromulgated (12/17/2019) \n \n \n \n9 \nRANGE OF VARIABLES \n \n \nVARIABLE \nRANGE \n1. Role and objective \nof team  \nMay include: \n1.1. \nWork activities in a team environment with \nenterprise or specific sector \n1.2. \nLimited discretion, initiative and judgement \nmaybe demonstrated on the job, either \nindividually or in a team environment \n2. Sources of \ninformation \nMay include: \n2.1. \nStandard operating and/or other workplace \nprocedures \n2.2. \nJob procedures \n2.3. \nMachine/equipment manufacturer’s \nspecifications and instructions \n2.4. \nOrganizational or external personnel \n2.5. \nClient/supplier instructions 