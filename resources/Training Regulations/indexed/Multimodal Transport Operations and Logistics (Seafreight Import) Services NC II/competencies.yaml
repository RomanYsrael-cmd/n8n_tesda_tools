 \nneeded \ncalculations to \ncomplete work \ntasks  using the \nfour basic \nprocesses of \naddition, \nsubtraction, \nmultiplication \nand division \n1.3 Performing \ncalculations \ninvolving \nfractions, \npercentages and \nmixed numbers, \nand using the \nfour basic \nprocesses \n1.4 Communicating \neffectively with \nothers when \ncarrying out \nbasic workplace \ncalculations\n\n--- PDF PAGE 64 ---\nTESDA-SOP-QSO-01-F08 \nMTOL SERVICES NC II \n \nPromulgated (12/17/2019) \n \n \n \n60 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variable \nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n1.5 Numerical \ninformation is self-\nchecked and \ncorrected for \naccuracy \n \n1.5 Checking and \ncorrecting \nnumerical \ninformation for \naccuracy \n1.6 Reading and \ninterpreting \ninstructions, \nprocedures and \ninformation \nrelevant to basic \nworkplace \ncalculations \n1.7 Using \ncalculators, \nnumeric keypads \nand computer \n2. Prepare cost \nestimates \n \n \n \n2.1 Cargo weight and \ndimension are \nidentified in \naccordance with \nstandard operating \nprocedure. \n2.2 Standard tariff for \ndestination \ncharges and/or \nagreed rates are \napplied in \naccordance with \nstandard operating \nprocedure.  \n2.3 Applicable foreign \nexchange rate \nconversion is used \nfor cost estimate In \naccordance with \nindustry practice.  \n2.4 Quantities of \nmaterials and \nresources required \nto complete a work \ntask are estimated \n2.5 Accurate estimates \nfor work completion \nare made \n \n2.1 Knowledge, \nTheory, \nApplication, \nSystems \nOperation \n2.2 Technology \n2.3 Techniques of \nestimating \nquantities of \nmaterials and \nresources \n2.4 Techniques for \nmaking an \naccurate \nestimate of \ncompleting a \nparticular \nwork/activity \n \n2.1 Estimating \nquantities of \nmaterials and \nresources \nrequired to \ncomplete a work \ntask  \n2.2 Making accurate \nestimates for \nwork completion  \n2.3 Communicating \neffectively with \nothers when \ncarrying out \nbasic workplace \ncalculations \n2.4 Completing \ndocumentation   \n2.5 Working  \n2.6 systematically \nwith required \nattention to detail\n\n--- PDF PAGE 65 ---\nTESDA-SOP-QSO-01-F08 \nMTOL SERVICES NC II \n \nPromulgated (12/17/2019) \n \n \n \n61 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variable \nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n3. Interpret \ngraphical \nrepresentations \nof mathematical \ninformation \n \n3.1 Information \nrepresented in \nsymbols, diagrams, \nmarkings, signage \nand pictorial \nrepresentations are \nrecognized.  \n3.2 Applicable format \npresentation is \nestablished in \naccordance with \ncompany \nprocedure.  \n3.3 Comparative \nvariances of \nperformance data \nare established in \naccordance with \ncompany \nprocedure.    \n3.1 Methods of \ninterpreting, \nrecognizing \nand \nrepresenting, \ninformation in \nsymbols, \ndiagrams, \nlogos, pictorial \nrepresentations \nand other \nvisual materials  \n \n3.1 Recognizing, \ninformation \nrepresented in \nsymbols, \ndiagrams, \npictorial \nrepresentations \nand other visual \nmaterials \n3.2 Interpreting \ninformation \nrepresented in \nsymbols, \ndiagrams, \npictorial \nrepresentations \nand other visual \nmaterials\n\n--- PDF PAGE 66 ---\nTESDA-SOP-QSO-01-F08 \nMTOL SERVICES NC II \n \nPromulgated (12/17/2019) \n \n \n \n62 \n RANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Calculations \n \n \nMay include: \n1.1 Money \n1.2 Volume \n1.3 Time \n1.4 Dimensions \n1.5 Length and distance \n1.6 Area  \n1.7 Perimeter \n1.8 Capacity \n2. Workplace Procedures \n \nMay include: \n2.1 Company procedures \n2.2 Organizational procedures \n2.3 Established procedures  \n2.4 Environmental policies and procedures \n2.5 OSH procedures \n2.6 Client procedures and service level agreement \n3. Mathematical Operations  \n \n \nMay include: \n3.1 Multiplication \n3.2 Division \n3.3 Addition \n3.4 Subtraction \n3.5 Fraction \n3.6 Percentages \n3.7 Ratio and proportion \n3.8 Conversion \n4. Destination Charges \nMay include: \n4.1 Documentation Fee \n4.2 Turnover Fees \n4.3 Manifest Fee \n4.4 Terminal Handling Charge \n4.5 Shipping Line’s Charges \n4.6 Currency Adjustment Factor \n5. Comparative Variances \nMay include: \n5.1 Percentage Variance  \n5.2 Line Graph \n5.3 Break Even Points and Threshold\n\n--- PDF PAGE 67 ---\nTESDA-SOP-QSO-01-F08 \nMTOL SERVICES NC II \n \nPromulgated (12/17/2019) \n \n \n \n63 \n EVIDENCE GUIDE \n \n1. Critical Aspects \nof Competency \n \n \n \n \n \n \n \nAssessment  requires evidence that the candidate: \n1.1 Performed calculations involving fractions, percentages and \nmixed numbers using the four basic processes as required \nto complete workplace procedures \n1.2 Made accurate estimates to complete assigned \nwork/activities \n1.3 Recognized, interpreted and acted upon information \nrepresented in symbols, diagrams markings, signage and \npictorial representations in workplace task \n2. Resource \nImplications \n \n \n \nThe following resources should be provided: \n2.1 Workplace location \n2.2 Materials and new technologies relevant to the unit of \ncompetency \n2.3 Technical plans, drawings and specifications relevant to the \nactivities \n3. Methods of \nAssessment \n \nCompetency in this unit may be assessed through: \n3.1 Written Test \n3.2 Oral Questioning \n3.3 Demonstration with questioning \n4. Context of \nAssessment \n \n4.1 Competency maybe assessed in actual workplace or at the \ndesignated TESDA accredited Assessment Center.\n",
