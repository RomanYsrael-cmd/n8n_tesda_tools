alicized terms are \nelaborated in the \nRange of Variable \nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n3.Identify a \nsecurity threat \nor situation \n \n3.1 Security threat or \nsituation is \npromptly identified \nand assessed and \nresponse is \nprioritized in \naccordance with \nthe workplace \nsecurity program \nand procedures \n3.2 Implications of the \nsecurity threat or \nsituation are \nevaluated in \naccordance with \nworkplace security \nprogram and \nprocedures \n \n \n \n3.1 Applicable transport \nsecurity legislation \nincluding relevant \ninternational, \nnational, state and \nterritory acts, \nregulations codes \nand/or guidelines \n3.2 Relevant workplace \nsecurity program and \npolicies and \nprocedures for \nresponding to  \nsecurity threats, \nsituations and \nemergencies \n3.3 Common security \nthreats and incidents \nthat may occur in the \nworkplace and \nrelated roles and \nresponsibilities of \npersonnel when \nreporting them and \nresponding to them \n3.4 Relevant quarantine \nand bond regulations \nand requirements \n3.5  Relevant OS&H and \nenvironmental \nprotection \nprocedures and \nguidelines \n3.6 Signs of forced entry, \ntheft and interference \nin the workplace \n3.7  Common security \nproblems that may \noccur when carrying \nout operations in the \ntransport and \nlogistics industries, \nand action that can \nbe taken to address \nand resolve the \nproblems \n3.1 Identifying and \nsolving and/or \nreporting \nproblems that \narise when \nfollowing security \nprocedures \n3.2 Recognizing \nsigns of pillage, \ntheft and \ninterference with \nstocks and \ngoods \n3.3 Recognizing \nsigns of security \nthreats and \nsituations\n\n--- PDF PAGE 47 ---\nTESDA-SOP-QSO-01-F08 \nMTOL SERVICES NC II \n \nPromulgated (12/17/2019) \n \n \n \n43 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variable \nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n4. Respond to \na security \nthreat or \nsituation \n \n4.1 Response to an \nidentified security \nthreat or situation \nis in accordance \nwith workplace \nsecurity \nprocedures, \nreceived \ninstructions, \nregulatory \nrequirements and \nemergency \nresponse plan  \n4.2 Security threats or \nincidents are \nhandled \nappropriately in \naccordance with \nestablished \nresponse plan and \nwithin limits of \nresponsibility \nusing available \ncommunications \nin the work area \n4.1 Common security \nproblems that may \noccur when carrying \nout operations in the \nworkplace and action \nthat can be taken to \naddress and resolve \nthe problems \n4.2 Relevant \ndocumentation and \nreporting \nrequirements \n \n \n4.1 Completing \nrequired \ndocumentation \nand reports \nrelated to \nsecurity \nprocedures \n4.2 Working \ncollaboratively \nwith others when \nfollowing security \nprocedures \n4.3 Modifying \nactivities \ndepending on \ndiffering \nworkplace \ncontexts risk \nsituations and \nenvironments \n4.4 Applying security \nprograms and \nprocedures in-\nresponse to \nidentified \nsecurity threats  \n4.5 Promptly \nreporting and/or \nrectifying any \nidentified \nproblems that \nmay arise when \nfollowing security \nprocedures in \naccordance with \nregulatory \nrequirements \nand workplace \nprocedures\n\n--- PDF PAGE 48 ---\nTESDA-SOP-QSO-01-F08 \nMTOL SERVICES NC II \n \nPromulgated (12/17/2019) \n \n \n \n44 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Security Measures \n \nMay include: \n1.1 security guards at access points and gates to \nsecured areas  \n1.2 locked doors, gates and fences  \n1.3 use of personal electronic access cards \n1.4 recording of carrier and vehicle registration \ndetails at gates and checkpoints  \n1.5 bag check points  \n1.6 escorts for visitors in restricted areas  \n1.7 access control in and out of restricted security \nareas \n1.8 use of ID cards  \n1.9 video surveillance equipment \n1.10 X-ray screening of baggage, cargo and goods \n1.11 explosives trace detection (ETD) screening of \npassengers, baggage, cargo and goods  \n1.12 screening of passengers using hand-held and \nwalk through magnetometers  \n2. Workplace Security \nProcedures \nMay include: \n2.1 Established security procedures \n2.2 Standard operating procedures  \n2.3 Company procedures \n2.4 Enterprise procedures \n2.5 Organizational procedures  \n3. Communications \n \nMay include: \n3.1   Phone  \n3.2   Radio  \n3.3   Fax \n3.4   Email \n3.5   Electronic data transfer (EDI)  \n3.6   Internet  \n3.7  Oral, aural or signed communications\n\n--- PDF PAGE 49 ---\nTESDA-SOP-QSO-01-F08 \nMTOL SERVICES NC II \n \nPromulgated (12/17/2019) \n \n \n \n45 \n EVIDENCE GUIDE \n \n1. Critical Aspects \nof Competency \n \n \n \n \n \n \n \nAssessment  requires evidence that the candidate: \n1.1 Secured goods and cargo in accordance with workplace \nsecurity procedures and applicable security regulations \n1.2  Checked and maintained seals, tamper proof packaging, \nlocks and other security measures on goods or cargo in \naccordance with workplace security procedures \n1.3 Identified and assessed security threat or situation in \naccordance with the workplace security program and \nprocedures \n1.4 Responded to an identified security threat or situation in \naccordance with workplace security procedures, received \ninstructions, regulatory requirements and emergency \nresponse plan  \n1.5 Handled appropriately any security threats or incidents in \naccordance with established response plan and within limits \nof responsibility  \n \n2. Resource \nImplications \n \n \n \nThe following resources should be provided: \n2.1 Workplace location \n2.2 Materials and new technologies relevant to the unit of \ncompetency \n2.3 Technical plans, drawings and specifications relevant to the \nactivities \n3. Methods of \nAssessment \n \nCompetency in this unit may be assessed through: \n3.1 Written Test \n3.2 Direct Observation  \n3.3 Oral Questioning \n \n4. Context of \nAssessment \n \n \n \n4.1 Competency maybe assessed in actual workplace or at the \ndesignated TESDA accredited Assessment Center.\n",
