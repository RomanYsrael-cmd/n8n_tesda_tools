        "source_text": "--- PDF PAGE 50 ---\nTESDA-SOP-QSO-01-F08 \nMTOL SERVICES NC II \n \nPromulgated (12/17/2019) \n \n \n \n46 \nUNIT OF COMPETENCY       : \nPROVIDE EFFECTIVE CUSTOMER SERVICE \n \nUNIT CODE \n         :      MTO491203 \n \nUNIT DESCRIPTOR               : \nThis unit involves the skills and knowledge required to \nprovide effective customer service skills to relevant \nworkplace operations. It includes dealing with customer \ninquiries and monitoring customer satisfaction. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variable \nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n1. Deal with \ncustomer \ninquiries \n \n \n \n \n \n1.1 Customer inquiries \nare dealt with \ncourteously and \nefficiently both by \nphone and face to \nface  \n1.2 Questions are used \nto clarify the \ncustomer's needs or \nconcerns \n1.3 Assistance from \nother staff is sought \nwhen a customer' s \ninquiry cannot be \nfully answered \n1.4  Knowledge of \nproducts, services \nand/or operations is \nused to answer \ncustomer queries or \nto respond to \ncustomers' needs \n \n1.1 Workplace \nprocedures \nrelevant to work \nactivities \n1.2 Communication \netiquettes \n1.3  Techniques in \ndealing with \nCustomer \ninquiries using \ncomputer and \nphone \napplication. \n1.4  Customer \nservice policies \nand procedures \n1.5 Types of \noperations \ncarried out in the \nworkplace \nconcerned    \n \n \n1.1 Dealing with \ncustomer \ninquiries \ncourteously and \nefficiently both \nby phone and \nface to face  \n1.2 Seeking \nassistance from \nother staff when \na customer' s \ninquiry cannot be \nfully answered \n1.3 Communicating \neffectively with \nothers when \nproviding \ncustomer \nservice, \nincluding the use \nof telephone \ntechniques  \n1.4 \nHandling \ncustomer queries \nand complaints\n\n--- PDF PAGE 51 ---\nTESDA-SOP-QSO-01-F08 \nMTOL SERVICES NC II \n \nPromulgated (12/17/2019) \n \n \n \n47 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variable \nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n2. Monitor \ncustomer \nsatisfaction \n \n2.1 Customer \nrequirements are \ndealt with according \nto workplace \nprocedures \n2.2 Appropriate \nfeedback is provided \nto managers and \ninternal and/or \nexternal customers \n2.3 Customer inquiries \nand associated \naction are recorded \nand reported in \naccordance with \nworkplace \nprocedures \n \n2.1 Sources of \ninformation and \ndocumentation \nneeded to \nassess customer \nsatisfaction \n2.2 Methods of \ndealing with \nCustomer \nrequirements  \n2.3 Methods of \nrecording \ncustomer \ninquiries and \nassociated \naction \n2.4 Appropriate \nmethods of \nproviding \nfeedback to \nmanagers and \ninternal and/or \nexternal \ncustomers \n2.1 Providing \nappropriate \nfeedback to \nmanagers and \ninternal and/or \nexternal \ncustomers \n2.2 Recording and \nreporting \ncustomer \ninquiries and \nassociated \naction  \n2.3 Completing \ndocumentation \nrelated to the \nprovision of \ncustomer service \n2.4 Writing simple \nreports and \nrecording of \ninquiries\n\n--- PDF PAGE 52 ---\nTESDA-SOP-QSO-01-F08 \nMTOL SERVICES NC II \n \nPromulgated (12/17/2019) \n \n \n \n48 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Customer \nMay include: \n1.1 Internal \n1.2 External \n2.Customer \nRequirements \nMay include: \n2.1 Carriers charges \n2.2 Forwarders charges \n2.3 Arrival notice \n2.4 Cargo status \n2.5 Special handling instruction \n3. Workplace \nProcedures \nMay include: \n3.1 Enterprise procedures  \n3.2 Organizational procedures  \n3.3 Established departmental procedures  \n3.4 Work Procedure / Processes Flow  \n3.1 Client procedures and service level agreement \n4. Handling and \nDocumentation \nRequirements \nMay include: \n4.1 shipping instruction \n4.2 MSDS  \n4.3 Special handling \n4.4 Commodity clearance or permit\n\n--- PDF PAGE 53 ---\nTESDA-SOP-QSO-01-F08 \nMTOL SERVICES NC II \n \nPromulgated (12/17/2019) \n \n \n \n49 \n EVIDENCE GUIDE \n \n1. Critical Aspects \nof Competency \n \n \n \n \n \n \n \nAssessment  requires evidence that the candidate: \n1.1 Dealt with customer inquiries courteously and efficiently \nboth by phone, email, social media and face to face  \n1.2 Used knowledge of products, services and/or operations to \nanswer customer queries or to respond to customers' needs \n1.3 Provided appropriate feedback to managers and internal \nand/or external customers \n1.4 Recorded and reported customer inquiries and associated \naction are in accordance with workplace procedures \n2. Resource \nImplications \n \n \n \nThe following resources should be provided: \n2.1 Workplace location \n2.2 Materials and new technologies  relevant to the unit of \ncompetency \n2.3 Technical plans, drawings and specifications relevant to the \nactivities \n3. Methods of \nAssessment \n \nCompetency in this unit may be assessed through: \n3.1 Written Test \n3.2 Direct observation and oral questioning \n3.3 Demonstration with oral questioning \n \n4. Context of \nAssessment \n \n \n \n4.1 Competency maybe assessed in actual workplace or at the \ndesignated TESDA accredited Assessment Center.\n",
