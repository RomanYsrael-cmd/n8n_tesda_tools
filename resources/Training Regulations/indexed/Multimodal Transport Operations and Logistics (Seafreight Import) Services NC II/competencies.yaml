        "source_title": "PARTICIPATE IN WORKPLACE COMMUNICATION",
        "source_text": "--- PDF PAGE 6 ---\nTESDA-SOP-QSO-01-F08 \nMTOL SERVICES NC II \n \nPromulgated (12/17/2019) \n \n \n \n2 \nSECTION 2: COMPETENCY STANDARDS \n \nThis section gives the details of the contents of the units of competency required in \nMULTIMODAL TRANSPORT OPERATION AND LOGISTICS (SEAFREIGHT IMPORT) \nSERVICES NCII.  These units of competency are categorized into basic, common, core and \nelective competencies. \n \nBASIC COMPETENCIES \n \n \nUNIT OF COMPETENCY  :    PARTICIPATE IN WORKPLACE COMMUNICATION \n \nUNIT CODE \n       :    400311210 \n \nUNIT DESCRIPTOR        : This unit covers the knowledge, skills and attitudes   required to \ngather, interpret and convey information in response to workplace \nrequirements. \n \n \nELEMENTS \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \n \nREQUIRED \nKNOWLEDGE \n \nREQUIRED \nSKILLS \n1.  Obtain and \nconvey \nworkplace \ninformation \n1.1  Specific and  \nrelevant information \nis accessed from \nappropriate \nsources  \n1.2  Effective \nquestioning,  active \nlistening and \nspeaking skills are \nused to gather and \nconvey information \n1.3  Appropriate medium \nis used to transfer \ninformation and \nideas \n1.4  Appropriate non- \nverbal \ncommunication is \nused \n1.5  Appropriate lines of \ncommunication with \nsupervisors and \ncolleagues are \nidentified and \nfollowed \n1.6  Defined workplace \n       procedures for the \nlocation and storage \nof information are \nused. \n1.7  Personal interaction \nis carried out clearly \nand concisely. \n1.1 Effective verbal \nand nonverbal \ncommunication \n1.2 Different modes of \ncommunication \n1.3 Medium of \ncommunication in \nthe workplace \n1.4 Organizational \npolicies \n1.5 Communication \nprocedures and \nsystems \n1.6 Lines of \nCommunication \n1.7 Technology \nrelevant to the \nenterprise and the \nindividual’s work \nresponsibilities \n1.8 Workplace \netiquette \n \n \n1.1  Following simple \nspoken language \n1.2  Performing routine \nworkplace duties \nfollowing simple \nwritten notices \n1.3  Participating in \nworkplace meetings \nand discussions \n1.4  Preparing work- \nrelated documents \n1.5  Estimating, \ncalculating and \nrecording routine \nworkplace \nmeasures \n1.6  Relating/ Interacting \nwith people of \nvarious levels in the \nworkplace \n1.7  Gathering and \nproviding basic \ninformation in \nresponse to \nworkplace \nrequirements \n1.8 Basic business \nwriting skills \n1.9  Interpersonal skills \nin the workplace \n2.0 Active-listening skills\n\n--- PDF PAGE 7 ---\nTESDA-SOP-QSO-01-F08 \nMTOL SERVICES NC II \n \nPromulgated (12/17/2019) \n \n \n \n3 \n \n \nELEMENTS \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \n \nREQUIRED \nKNOWLEDGE \n \nREQUIRED \nSKILLS \n2.  Perform \nduties \nfollowing \nworkplace \ninstructions   \n2.1 Written notices and \ninstructions are read \nand   interpreted in \naccordance with \norganizational \nguidelines \n2.2 Routine written \ninstruction are \nfollowed based on \nestablished \nprocedures \n2.3 Feedback is given to \nworkplace \nsupervisor based \ninstructions/ \ninformation received \n2.4 Workplace \ninteractions are \nconducted in a \ncourteous manner \n2.5 Where necessary, \nclarifications about \nroutine workplace \nprocedures and \nmatters concerning \nconditions of \nemployment are \nsought and asked \nfrom appropriate  \nSources. \n2.6  Meetings outcomes  \n       are interpreted and \n       implemented \n \n \n \n \n \n2.1 Effective verbal \nand non-verbal \ncommunication \n2.2 Different modes of \ncommunication  \n2.3 Medium of \ncommunication in \nthe workplace \n2.4 Organizational/ \nWorkplace \npolicies \n2.5 Communication \nprocedures and \nsystems \n2.6 Lines of \ncommunication \n2.7 Technology \nrelevant to the \nenterprise and the \nindividual’s work \nresponsibilities \n2.8 Effective \nquestioning \ntechniques \n(clarifying and \nprobing) \n2.9 Workplace \netiquette \n \n  \n2.1  Following simple \nspoken instructions  \n2.2  Performing routine \nworkplace duties \nfollowing simple \nwritten notices \n2.3  Participating in \nworkplace meetings \nand discussions \n2.4  Completing work- \nrelated documents \n2.5  Estimating, \ncalculating and \nrecording routine \nworkplace \nmeasures \n2.6  Relating/ \nResponding to \npeople of various \nlevels in the \nworkplace \n2.7  Gathering and \nproviding \ninformation in \nresponse to \nworkplace \nrequirements \n2.8 Basic \nquestioning/querying \n2.9 Skills in reading for \ninformation  \n2.10 Skills in locating\n\n--- PDF PAGE 8 ---\nTESDA-SOP-QSO-01-F08 \nMTOL SERVICES NC II \n \nPromulgated (12/17/2019) \n \n \n \n4 \n \n \nELEMENTS \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \n \nREQUIRED \nKNOWLEDGE \n  \nREQUIRED \nSKILLS \n3.   Complete \nrelevant \nwork- \nrelated \ndocuments \n3.1  Range of forms \nrelating to \nconditions of \nemployment are \ncompleted \naccurately and \nlegibly \n3.2  Workplace data \nis recorded on \nstandard \nworkplace forms \nand documents \n3.3  Errors in \nrecording \ninformation on \nforms/ \ndocuments are \nidentified and \nacted upon \n3.4  Reporting \nrequirements to \nsupervisor are \ncompleted \naccording to \norganizational \nguidelines \n3.1 Effective verbal \nand non-verbal \ncommunication \n3.2 Different modes of \ncommunication  \n3.3 Workplace forms \nand documents \n3.4 Organizational/ \nWorkplace policies \n3.5 Communication \nprocedures and \nsystems \n3.6 Technology \nrelevant to the \nenterprise and the \nindividual’s work \nresponsibilities  \n \n \n3.1  Completing work- \nrelated \ndocuments \n3.2  Applying \noperations of \naddition, \nsubtraction, \ndivision and \nmultiplication \n3.3  Gathering and \nproviding \ninformation in \nresponse to \nworkplace \nrequirements \n3.4 Effective record \nkeeping skills\n\n--- PDF PAGE 9 ---\nTESDA-SOP-QSO-01-F08 \nMTOL SERVICES NC II \n \nPromulgated (12/17/2019) \n \n \n \n5 \nRANGE OF VARIABLES \n \nVARIABLES \nRANGE \n1. Appropriate \nsources \nMay include: \n1.1. \nTeam members \n1.2. \nSupervisor/Department Head \n1.3. \nSuppliers \n1.4. \nTrade personnel \n1.5. \nLocal government \n1.6. \nIndustry bodies \n2. Medium \nMay include but not limited to: \n2.1. \nMemorandum \n2.2. \nCircular \n2.3. \nNotice \n2.4. \nInformation dissemination \n2.5. \nFollow-up or verbal instructions \n2.6. \nFace-to-face communication \n2.7. \nElectronic media (disk files, cyberspace) \n3. Storage \nMay include: \n3.1. \nManual filing system \n3.2. \nComputer-based filing system \n4. Workplace \ninteractions \nMay include: \n4.1. \nFace-to-face \n4.2. \nTelephone \n4.3. \nElectronic and two-way radio \n4.4. \nWritten including electronic means, memos, \ninstruction and forms \n4.5. \nNon-verbal including gestures, signals, signs and \ndiagrams \n5. Forms \nMay include but not limited to: \n5.1. \nHR/Personnel forms, telephone message forms, \nsafety reports\n\n--- PDF PAGE 10 ---\nTESDA-SOP-QSO-01-F08 \nMTOL SERVICES NC II \n \nPromulgated (12/17/2019) \n \n \n \n6 \nEVIDENCE GUIDE \n \n1. Critical aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1  Prepared written communication following standard  \nformat of the organization \n1.2  Accessed information using workplace communication \n equipment/systems \n1.3  Made use of relevant terms as an aid to transfer \n information effectively \n1.4  Conveyed information effectively adopting formal or \n informal communication \n2. Resource \nImplications \nThe following resources should be provided: \n2.1 Fax machine \n2.2 Telephone \n2.3 Notebook \n2.4 Writing materials \n2.5 Computer with Internet connection \n3. Methods of \nAssessment \nCompetency in this unit may be assessed through: \n3.1 Demonstration with oral questioning  \n3.2 Interview  \n3.3 Written test \n3.4 Third-party report \n4. Context for \nAssessment \n4.1 