  "source_text": "SECTION 1: MULTIMODAL TRANSPORT OPERATION AND LOGISTICS (SEAFREIGHT\nIMPORT) SERVICES NCII QUALIFICATION\n\nThe MULTIMODAL TRANSPORT OPERATION AND LOGISTICS SERVICES NCII\nQualification consist of competencies that a person must achieve to perform documentation\nservices for multimodal transport operations.\n\nThe Units of Competency comprising this Qualification include the following:\n\nBASIC COMPETENCIES\nUNIT CODE\nUnits of Competency\n400311210\nParticipate in workplace communication\n400311211\n400311212\n400311213\n400311214\n400311215\n400311216\n400311217\n400311218\nWork in a team environment\nSolve/address general workplace problems\nDevelop career and life decisions\nContribute to workplace innovation\nPresent relevant information\nPractice occupational safety and health policies and procedures\nExercise efficient and effective sustainable practices in the workplace\nPractice entrepreneurial skills in the workplace\n\nCOMMON COMPETENCIES\nUNIT CODE\nUnits of Competency\nMTO491201\nApply freight forwarding documentation services and workplace procedures\nMTO491202\nPerform workplace security and safety\nMTO491203\nProvide effective customer service\nMTO491204\nContribute to quality system\nMTO491205\nPerform computer operations\n\nCORE COMPETENCIES\nUNIT CODE\nUnits of Competency\nMTO432301\nPerform industry calculation in freight forwarding and documentation\nservices\nMTO432302\nProcess transport documents for import cargo\nMTO432303\nPrepare request for payment and billings\nMTO432304\nMTO432305\nPrepare and complete statistical reports\nProcess shipping documents\nMTO432306\nLiaise with relevant stakeholders\nMTO432307\nAddress bottlenecks and work disruptions\n\nA person who has achieved this Qualification is competent to be a:\n❑ Documentation Clerk\n❑ Liaison Personnel*\n\n--- PDF PAGE 6 ---\nTESDA-SOP-QSO-01-F08\nMTOL SERVICES NC II\n\nPromulgated (12/17/2019)\n\n2"
