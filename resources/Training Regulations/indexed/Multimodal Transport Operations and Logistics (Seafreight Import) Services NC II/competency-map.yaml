  "source_text": "COMPETENCY MAP – TRANSPORT AND LOGISTICS SECTOR\nMULTIMODAL TRANSPORT OPERATIONS AND LOGISTICS (SEAFREIGHT IMPORT) SERVICES NCII\n\n BASIC COMPETENCIES\n\nLead workplace\ncommunication\nLead small\nteams\nApply critical\nthinking and\nproblem-\nsolving\ntechniques in\nthe\nworkplace\n\nWork in a\ndiverse\nenvironment\nPropose\nmethods of\napplying\nlearning and\ninnovation in\nthe\norganization\nUse\ninformation\nsystematically\nEvaluate\noccupational\nsafety and\nhealth work\npractices\n\nEvaluate\nenvironment\nal work\npractices\n\nFacilitate\nentrepreneurial\nskills for micro-\nsmall-medium\nenterprises\n(MSMEs)\n\nReceive and\nrespond to\nworkplace\ncommunication\nWork with\nothers\nSolve/addres\ns routine\nproblems\nEnhance self-\nmanagement\nskills\nSupport\nInnovation\nAccess and\nmaintain\ninformation\nFollow\noccupational\nsafety and\nhealth policies\nand\nprocedures\nApply\nenvironment\nal work\nstandards\nAdopt\nentrepreneurial\nmindset in the\nworkplace\nParticipate in\nworkplace\ncommunication\nWork in\nTeam\nEnvironment\nSolve/address\ngeneral\nworkplace\nproblems\nDevelop\ncareer and life\ndecisions\nContribute\nto workplace\ninnovation\nPresent\nrelevant\ninformation\nPractice\noccupational\nsafety and\nhealth policies\nand\nprocedures\nExercise\nefficient and\neffective\nsustainable\npractices in\nthe\nworkplace\nPractice\nentrepreneurial\nskills in the\nworkplace\n\n--- PDF PAGE 137 ---\nMTOL SERVICES NC II\n\nPromulgated (12/17/2019)\n\n133\n COMMON COMPETENCIES\n\nCORE COMPETENCIES\n\nPerform industry\ncalculation in freight\nforwarding and\ndocumentation services\nProcess transport\ndocuments for import\ncargo\nPrepare request\nfor payment and\nbillings\nPrepare and\ncomplete statistical\nreports\nLiaise with\nrelevant\nstakeholders\nAddress bottlenecks\nand work disruptions\n\nApply freight forwarding\ndocumentation services\nand workplace procedures\nPerform workplace\nsecurity and safety\nProvide effective\ncustomer service\nContribute to quality\nsystem\n\nPerform computer\noperations\n\n--- PDF PAGE 138 ---\nMTOL SERVICES NC II\n\nPromulgated (12/17/2019)\n\n134\nGLOSSARY OF TERMS\n\nAural - Relating to the sense of hearing\n\nBest practices - Commercial or professional procedures accepted as being correct or most\n effective\n\nBottlenecks - A process in a chain of processes with limited capacity reducing maximum\n capacity\n\nCargo stripping - Unloading of contents or cargo from a freight container or tanker\n\nCarrier - A person or company responsible for physical custody of goods and for any loss if any\n\nComputer hardware - Physical parts of a computer system such as keyboard, wire connectors,\n monitor screen, mother board, hard Disk drive , among others.\n\nComputer software - Set of instructions that tells a computer what and how to do a particular\n task ie.programs, applications.\n\nComputer storage - A process or physical station on which digital data is saved or stored\n\nContingency plan - A plan designed to take a possible future event into account; a recovery\n plan.\n\nCustomer service - Assistance or advice provided by a company to its customers\n\nData - Facts or statistics collected together for reference or analysis.\n\nDelivery order - A release document from the buyer, agent, or consignee to another party\n\nEffectiveness - Extent to which actual results have impact to fulfill desired outcomes.\n\nEfficiency - Efficiency means whatever is performed should be done in a perfect way\n likewise reducing wastage\n\nEntrepreneurial - Characterized by the taking of financial risks in the hope of profit;\n enterprising.\n\nErgonomic - Relating to or designed for efficiency and comfort in the working\n environment\n\nEthical - Relating to moral principles\n\nFiduciary - Involving trust, especially with regard to the relationship between the\n trustee and beneficiary\nForms - Business forms used by companies on a standard basis between and\n among management, staff, suppliers and customers\n\n--- PDF PAGE 139 ---\nMTOL SERVICES NC II\n\nPromulgated (12/17/2019)\n\n135\nInnovation - Beliefs and attitudes in going about addressing problems in the\n workplace through new ideas or better ways of doing things\n\nInsurance - Means of protection from financial loss\n\nIntegrate - Combine with one another so that they become a whole to achieve its\n objectives\n\nLegislation - Statutory law or ordinance with order as its core objective\n\nLiaison - Cooperation or communication which facilitates a close working\n relationship between people\n\nParameters- A measureable factor forming one of a set that defines a system or\n sets the condition for a Particular operation\n\nPeripheral devices - Examples are auxiliary devices such as keyboard or printer connected\n to a computer\n\nProtocols - Proper procedure of respect\n\nQuality manual - A document that states a company’s intentions for operating processes\n within a quality Management system\n\nQuarantine - Strict isolation for purposes of preventing spread of a disease from\n people, plants, or animals\n\nRegulatory - Serving or intended to regulate or control something.\n\nSafety - Condition of being protected from unlikely danger, risk, or injury\n\nSecurity threat - Something that may or may not happen but has the potential to cause\n serious damage\n\nTimeline - Agreed deadlines or time frame in which to accomplish a certain task\n\nWork disruption - Any event or circumstance which may create damage or loss to a\n business or operation\n\n--- PDF PAGE 140 ---\nMTOL SERVICES NC II\n\nPromulgated (12/17/2019)\n\n136\n\nACRONYMS\n\nNC 11 - TR\n\nBIR\nBureau of Internal Revenue\nBOC\nBureau of Customs\nCD\nCompact Disc\nDOF\nDepartment of Finance\nDTI\nDepartment of Trade and Industry\nECC\nEnvironmental Clearance Certificate\nEDI\nElectronic Data Interchange\nEHS\nEnvironment, Health and Safety\nETD\nExplosive Trace Detection\nFCL\nFull Container Load\nHR\nHuman Resources\nID\nIdentification\nINCOTERMS\nInternational Commercial Terms\nLCL\nLess Container Load\nMSDS\nMaterial Safety Data Sheet\nOHS\nOccupational Health and Safety\nOS&H\nOccupational Safety & Health\nPPE\nPersonal Protective Equipment\nSRT\nSelf-Regulation Theory\nSWOT\nStrengths, Weaknesses, Opportunities and Threats\nTESDA\nTechnical Education and Skills Development Authority\nTR\nTraining Regulation\n\n--- PDF PAGE 141 ---\nMTOL SERVICES NC II\n\nPromulgated (12/17/2019)\n\n137\nACKNOWLEDGMENT\n\nThe Technical Education and Skills Development Authority (TESDA)\nwishes to extend thanks and appreciation to the many representatives of\nbusiness, industry, academe and government agencies who provided their time\nand expertise to the development and validation of these Training Regulations.\n\nTECHNICAL EXPERTS PANEL\n\nDORIS P. TORRES\nTechnical Expert\nSTAMM International Inc.\nGen. Lim st. Bangkal, Makati City\nCOSME J. NONAN JR.\nTechnical Expert\nCommercial Freight Services Inc.\nIntramuros, Manila\nMARILYN C. ALBERTO\nTechnical Expert\nKintetsu World Express (Phils.) Inc.\nParañaque City\nGEMMA VIDA R. LIBRANDA\nTechnical Expert\nPhilippine\nMultimodal\nTransport\nand\nLogistics Association, Inc.\nParanaque City\n\nABRAHAM V. ASUNCION\nTechnical Expert\nPhilippine\nMultimodal\nTransport\nand\nLogistics Association, Inc.\nParañaque City\nBENILDA S. HERNANDEZ\nTechnical Expert\nSky Freight Forwarders Inc.\nParañaque City\nJOSEFINA C. YAP\nTechnical Expert\nPhilippine Genesis Freight Unlimited\nIntramuros, Manila\n\n--- PDF PAGE 142 ---\nMTOL SERVICES NC II\n\nPromulgated (12/17/2019)\n\n138\n\n•\nTHE PARTICIPANTS IN THE NATIONAL VALIDATION OF THIS TRAINING REGULATION:\n\nNAME\nCOMPANY NAME\nDESIGNATION\n1. Alvin N. Brugada\nNES Cargo Express Int’l Corp.\nDocumentation Clerk\n2. Melvin Jan Christian\nLobitana\nAllport Freight Consolidator Inc.\nDocumentation Clerk\n3. Aljon B. Docena\nJRS Express Corp.\nLiaison Personnel\n4. Roxette Bagsit\nAsiaworld Transport Phils. Co.\nInc.\nDocum