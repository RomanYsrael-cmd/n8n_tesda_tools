    "source_text": "SECTION 3 TRAINING ARRANGEMENT\n\nThis set of standards provides Technical and Vocational Education and Training (TVET)\nproviders with information and other important requirements to consider when designing training\nprograms for MULTIMODAL TRANSPORT OPERATION AND LOGISTICS SERVICES\n(SEAFREIGHT IMPORT) NCII\n\nThis includes information on curriculum design; training delivery; trainee entry\nrequirements; tools and equipment; training facilities; and trainer’s qualification and institutional\nassessment.\n\n3.1 CURRICULUM DESIGN\n\nTESDA shall provide the training on the development of competency-based curricula to\nenable training providers develop their own curricula with the components mentioned below.\n\nDelivery of knowledge requirements for the basic, common and core units of competency\nspecifically in the areas of mathematics, science/technology, communication/language,\nenvironment and other academic subjects shall be contextualized. To this end, TVET providers\nshall develop a Contextual Learning Matrix (CLM) to include Technology, Science, Math,\nEnglish/Communication and Safety to Environment. Includes also green technology, issues on\nhealth and drugs and cater to person with disabilities (PWD’s)\n\nCourse Title: MULTIMODAL TRANSPORT OPERATION AND NC Level: NCII\n LOGISTICS (SEAFREIGHT IMPORT) SERVICES\n\nNominal Training Duration:\n\nNo. of Hours\nCoverage\n 37 Hrs.\nBasic Competencies\n 48 Hrs.\nCommon Competencies\n 62 Hrs.\nCore Competencies\n 147 Hrs.\n 126 Hrs.\n\nSIL\n 273 Hrs. Total\nCourse Description:\n\nThis course is designed to provide the learner with knowledge, practical skills and\nattitude, applicable in performing industry calculation in freight forwarding and documentation\nservices, processing transport documents for import cargo, preparing request for payment and\nbillings, preparing and completing statistical reports, processing shipping documents, liaising\nwith relevant stakeholders and addressing bottlenecks and work disruptions. This include\nclassroom learning activities and practical work in actual work site or simulation area.\n\n The training institution has the option to introduce other methodologies to deliver the\nprogram or the course and to partner with other individuals/organizations that would be able to\nprovide training resources in the conduct of the course.\n\nUpon completion of the course, the learners are expected to demonstrate the above-\nmentioned competencies to be employed. To obtain this, all units prescribed for this\nqualification must be achieve.\n\n--- PDF PAGE 99 ---\nMTOL SERVICES NC II\n\nPromulgated (12/17/2019)\n\n95\nBASIC COMPETENCIES\n(37 HOURS)\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n1. Participate in\nworkplace\ncommunication\n1.1. Obtain and convey\nworkplace\ninformation\n•\nDescribe Organizational policies\n•\nRead:\no Effective communication\no Written communication\no Communication procedures and\nsystems\n•\nIdentify:\no Different modes of communication\no Medium of communication\no Flow of communication\no Available technology relevant to the\nenterprise and the individual’s work\nresponsibilities\n•\nPrepare different Types of question\n•\nGather different sources of information\n•\nApply storage system in establishing\nworkplace information\n•\nDemonstrate Telephone courtesy\n• Group discussion\n• Lecture\n• Demonstration\n• Oral evaluation\n• Written\nexamination\n• Observation\n2 Hours\n1.2. Perform duties\nfollowing\nworkplace\ninstructions\n•\nRead:\no Written notices and instructions\no Workplace interactions and\nprocedures\n•\nRead instructions on work related\nforms/documents\nPerform workplace duties scenario\nfollowing workplace instructions\n• Group discussion\n• Lecture\n• Demonstration\n• Oral evaluation\n• Written\nexamination\n• Observation\n2 Hours\n\n--- PDF PAGE 100 ---\nMTOL SERVICES NC II\n\nPromulgated (12/17/2019)\n\n96\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n1.3. Complete relevant\nwork related\ndocuments\n•\nDescribe Communication procedures and\nsystems\n•\nRead:\no Meeting protocols\no Nature of workplace meetings\no Workplace interactions\no Barriers of communication\n•\nRead instructions on work related\nforms/documents\n•\nPractice:\no Estimate, calculate and record routine\nworkplace measures\no Basic mathematical processes of\naddition, subtraction, division and\nmultiplication\n•\nDemonstrate office activities in:\no workplace meetings and discussions\nscenario\n•\nPerform workplace duties scenario\nfollowing simple written notices\n•\nFollow simple spoken language\n•\nIdentify the different Non-verbal\ncommunication\n•\nDemonstrate ability to relate to people of\nsocial range in the workplace\n•\nGather and provide information in\nresponse to workplace requirements\n•\nComplete work-related documents\n• Group discussion\n• Lecture\n• Demonstration\n• Role play\n• Oral evaluation\n• Written\nexamination\n• Observation\n2 Hours\n\n2. Work in a team\nenvironment\n2.1 Describe team role\nand scope\n•\nDiscussion on team roles and scope\n•\nParticipate in the discussion:\no\nDefinition of Team\no\nDifference between team and group\no Objectives and goals of team\n• Lecture/ Discussion\n• Group Work\n• Individual Work\n• Role Play\n• Role Play\n• Case Study\n• Written Test\n1 Hour\n\n--- PDF PAGE 101 ---\nMTOL SERVICES NC II\n\nPromulgated (12/17/2019)\n\n97\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n•\nLocate needed information from the\ndifferent sources of information\n\n2.2 Identify one’s role\nand responsibility\nwithin team\n•\nRole play :\no individual role and responsibility\n•\nRole Play\no Understanding Individual differences\n•\nDiscussion on gender sensitivity\n• Role Play\n• Lecture/ Discussion\n• Role Play\n• Written Test\n1 Hour\n\n2.3 Work as a team\nmember\n• Participate in group planning activities\n• Role play : Communication protocols\n• Participate in the discussion of standard\nwork procedures and practices\n• Group work\n• Role Play\n• Lecture/ Discussion\n• Role Play\n• Written Test\n1 Hour\n3. Solve/address\nroutine\nproblems\n3.1 Identify routine\nproblems\n• Review of the current industry\nhardware and software products and\nservices\n• Identify correctly the industry\nmaintenance, service and helpdesk\npractices, processes and procedures\n• Make use of the industry standard\ndiagnostic tools\n• Share best practices in determining\nbasic malfunctions and resolutions to\ngeneral problems in the workplace\n• Analyze routine/procedural problems\n• Group discussion\n• Lecture\n• Demonstration\n• Role playing\n• Case\nFormulation\n• Life Narrative\nInquiry\n(Interview)\n• Standardized\ntest\n1 Hour\n\n3.2 Look for solutions\nto routine problems\n• Review of the current industry hardware\nand software products and services\n• Identify correctly the industry maintenance,\nservice and helpdesk practices, processes\nand procedures\n• Make use of the industry standard\ndiagnostic tools\n• Group discussion\n• Lecture\n• Demonstration\n• Role playing\n• Case\nFormulation\n• Life Narrative\nInquiry\n(Interview)\n• Standardized\ntest\n1 Hour\n\n--- PDF PAGE 102 ---\nMTOL SERVICES NC II\n\nPromulgated (12/17/2019)\n\n98\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n• Share best practices in determining basic\nmalfunctions and resolutions to general\nproblems in the workplace\n• Formulate possible solutions to problems\nand document procedures for reporting\n\n3.3 Look for solutions\nto routine problems\n• Review of the current industry hardware\nand software products and services\n• Identify correctly the industry maintenance,\nservice and helpdesk practices, processes\nand procedures\n• Make use of the industry standard\ndiagnostic tools\n• Share best practices in determining basic\nmalfunctions and resolutions to general\nproblems in the workplace\n• Formulate possible solutions to problems\nand document procedures for reporting\n• Group discussion\n• Lecture\n• Demonstration\n• Role playing\n• Case\nFormulation\n• Life Narrative\nInquiry\n(Interview)\n• Standardized\ntest\n1 Hour\n4. Develop Career\nand Life\nDecisions\n4.1 Manage one’s\nemotion\n• Demonstrate self-management strategies\nthat assist in regulating behavior and\nachieving personal and learning goals\n• Explain enablers and barriers in achieving\npersonal and career goals\n• Identify techniques in handling negative\nemotions and unpleasant situation in the\nworkplace such as frustration, anger,\nworry, anxiety, etc.\n• Manage properly one’s emotions and\nrecognize situations that cannot be\nchanged and accept them and remain\nprofessional\n• Discussion\n• Interactive Lecture\n• Brainstorming\n• Demonstration\n• Role-playing\n• Demonstration or\nsimulation with\noral questioning\n• Case problems\ninvolving\nworkplace\ndiversity issues\n\n1 Hour\n\n--- PDF PAGE 103 ---\nMTOL SERVICES NC II\n\nPromulgated (12/17/2019)\n\n99\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n• Recall instances that demonstrate self-\ndiscipline, working independently and\nshowing initiative to achieve personal and\ncareer goals\n• Share experiences that show confidence,\nand resilience in the face of setbacks and\nfrustrations and other negative emotions\nand unpleasant situations in the workplace\n\n4.2 Develop reflective\npractice\n• Enumerate strategies to improve one’s\nattitude in the workplace\n• Explain Gibbs’ Reflective Cycle/Model\n(Description, Feelings, Evaluation,\nAnalysis, Conclusion, and Action plan)\n• Use basic SWOT analysis as self-\nassessment strategy\n• Develop reflective practice through\nrealization of limitations, likes/ dislikes;\nthrough showing of self-confidence\n• Demonstrate self-acceptance and being\nable to accept challenges\n• Small Group\n Discussion\n• Interactive Lecture\n• Brainstorming\n• Demonstration\n• 5 Role-playing\n• Demonstration or\nsimulation with\noral questioning\n• Case problems\ninvolving\nworkplace\ndiversity issues\n1 Hour\n\n4.3 Boost self-\nconfidence and\ndevelop self-\nregulation\n• Describe the components of self-regulation\nbased on Self-Regulation Theory (SRT)\n• Explain personality development concepts\n• Cite self-help concepts (e. g., 7 Habits by\nStephen Covey, transactional analysis,\npsycho-spiritual concepts)\n• Perform effective communication skills –\nreading, writing, conversing skills\n• Show affective skills – flexibility,\nadaptability, etc.\n• Determine strengths and weaknesses\n• Small Group\nDiscussion\n• Interactive Lecture\n• Brainstorming\n• Demonstration\n• Role-playing\n• Demonstration or\nsimulation with\noral questioning\n• Case problems\ninvolving\nworkplace\ndiversity issues\n1 Hour\n\n--- PDF PAGE 104 ---\nMTOL SERVICES NC II\n\nPromulgated (12/17/2019)\n\n100\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n5. Contribute to\nworkplace\ninnovation\n5.1 Identify\nopportunities to do\nthings better\n• Identify different roles of individuals in\ncontributing to doing things better in the\nworkplace\n• Appreciate positive impacts and challenges\nin innovation\n• Show mastery of the different types of\nchanges and levels of participation in the\nworkplace\n• Discuss 7 habits of highly effective people\n• Interactive Lecture\n• Appreciative Inquiry\n• Demonstration\n• Group work\n• Psychological\nand behavioral\nInterviews\n• Performance\nEvaluation\n• Life Narrative\nInquiry\n• Review of\nportfolios of\nevidence and\nthird-party\nworkplace\nreports of on-the-\njob performance.\n• Standardized\nassessment of\ncharacter\nstrengths and\nvirtues applied\n1 Hour\n\n5.2 Discuss and\ndevelop ideas with\nothers\n\n• Identify different roles of individuals in\ncontributing to doing things better in the\nworkplace\n• Appreciate positive impacts and challenges\nin innovation\n• Show mastery of the different types of\nchanges and levels of participation in the\nworkplace\n• Discuss 7 habits of highly effective people\n• Communicate ideas through small group\ndiscussions and meetings\n• Interactive Lecture\n• Appreciative Inquiry\n• Demonstration\n• Group work\n• Psychological\nand behavioral\nInterviews\n• Performance\nEvaluation\n• Life Narrative\nInquiry\n• Review of\nportfolios of\nevidence and\nthird-party\nworkplace\nreports of on-the-\njob performance.\n\n1 Hour\n\n--- PDF PAGE 105 ---\nMTOL SERVICES NC II\n\nPromulgated (12/17/2019)\n\n101\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n• Standardized\nassessment of\ncharacter\nstrengths and\nvirtues applied\n\n5.3 Integrate ideas for\nchange in the\nworkplace\n\n• Identify different roles of individuals in\ncontributing to doing things better in the\nworkplace\n• Appreciate positive impacts and challenges\nin innovation\n• Show mastery of the different types of\nchanges and levels of participation in the\nworkplace\n• Discuss 7 habits of highly effective people\n• Communicate ideas through small group\ndiscussions and meetings\n• Demonstrate basic skills in data analysis\n• Interactive Lecture\n• Appreciative Inquiry\n• Demonstration\n• Group work\n• Psychological\nand behavioral\nInterviews\n• Performance\nEvaluation\n• Life Narrative\nInquiry\n• Review of\nportfolios of\nevidence and\nthird-party\nworkplace\nreports of on-the-\njob performance.\n• Standardized\nassessment of\ncharacter\nstrengths and\nvirtues applied\n\n1 Hour\n6. Present relevant\ninformation\n6.1 Gather data/\ninformation\n• Lecture and discussion on:\no Organisational protocols\no Confidentiality and accuracy\no Business mathematics and statistics\no Legislation, policy and procedures\nrelating to the conduct of evaluations\n• Reviewing data/ information\n• Group discussion\n• Lecture\n• Demonstration\n• Role Play\n• Oral evaluation\n• Written Test\n• Observation\n• Presentation\n2 Hours\n\n--- PDF PAGE 106 ---\nMTOL SERVICES NC II\n\nPromulgated (12/17/2019)\n\n102\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n6.2 Assess gathered\ndata/ information\n• Lecture and discussion on:\no Data analysis techniques/ procedures\no Organisational values, ethics and\ncodes of conduct\no Trends and anomalies\n• Computing business mathematics and\nstatistics\n• Application of data analysis techniques\n• Group discussion\n• Lecture\n• Demonstration\n• Role Play\n• Practical exercises\n• Oral evaluation\n• Written Test\n• Observation\n• Presentation\n3 Hours\n6.3 Record and\npresent information\n• Lecture and discussion on:\no Reporting requirements to a range of\naudiences\no Recommendations for possible\nimprovements\n• Analysis and comparison of interim and\nfinal reports’ outcomes\n• Reporting of data findings\n• Group discussion\n• Lecture\n• Demonstration\n• Role Play\n• Practical exercises\n\n• Oral evaluation\n• Written Test\n• Observation\n• Presentation\n3 Hours\n7. Practice\nOccupational\nSafety and\nHealth Policies\nand Procedures\n7.1 Identify OSH\ncompliance\nrequirements\n• Discussion regarding:\n- Hierarchy of Controls\n- Hazard Prevention and Controls\n- Work Standards and Procedures\n- Personal Protective Equipment\n• Lecture\n• Group Discussion\n\n• Written Exam\n• Demonstration\n• Observation\n• Interviews /\nQuestioning\n1 Hour\n\n7.2 Prepare OSH\nrequirements for\ncompliance\n• Identification of required safety materials,\ntools and equipment\n• Handling of safety control resources\n\n• Lecture\n• Group Discussion\n\n• Written Exam\n• Demonstration\n• Observation\n• Interviews /\n• Questioning\n1 Hour\n\n--- PDF PAGE 107 ---\nMTOL SERVICES NC II\n\nPromulgated (12/17/2019)\n\n103\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\n7.3 Perform tasks in\naccordance with\nrelevant OSH\npolicies and\nprocedures\n•\nDiscussion of General OSH Standards and\nPrinciples\n• Performing industry related work activities\nin accordance with OSH Standards\n• Lecture\n• Group Discussion\n\n• Written Exam\n• Demonstration\n• Observation\n• Interviews /\n• Questioning\n2 Hours\n8. Exercise\nEfficient and\nEffective\nSustainable\nPractices in the\nWorkplace\n8.1 Identify the\nefficiency and\neffectiveness of\nresource utilization\n- Discussion on the process how\nEnvironmental Policies coherence is\nachieved\n•\nDiscussion on Necessary Skills in\nresponse to changing environmental\npolicies needs\n-\nWaste Skills\n-\nEnergy Skills\n-\nWater Skills\n-\nBuilding Skills\n-\nTransport Skills\n-\nMaterial Skills\n• Lecture\n• Group Discussion\n• Simulation\n• Demonstration\n\n• Written Exam\n• Demonstration\n• Observation\n• Interviews /\n• Questioning\n1 Hour\n\n8.2 Determine causes\nof inefficiency\nand/or\nineffectiveness of\nresource utilization\n• Discussion of Environmental Protection\nand Resource Efficiency Targets\n• Analysis on the Relevant Work Procedure\n• Lecture\n• Group Discussion\n• Demonstration\n\n• Written Exam\n• Demonstration\n• Observation\n• Interviews /\n• Questioning\n1 Hour\n\n8.3 Convey inefficient\nand ineffective\nenvironmental\npractices\n• Identification of (re)training needs and\nusage of environment friendly methods and\ntechnologies\n• Identification of environmental corrective\nactions\n• Practicing Environment Awareness\n• Lecture\n• Group Discussion\n• Role Play\n• Demonstration\n• Written Exam\n• Demonstration\n• Observation\n• Interviews /\n• Questioning\n1 Hour\n\n--- PDF PAGE 108 ---\nMTOL SERVICES NC II\n\nPromulgated (12/17/2019)\n\n104\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n9. Practice\nEntrepreneurial\nSkills in the\nWorkplace\n9.1 Apply\nentrepreneurial\nworkplace best\npractices\n\n• Case studies on Best entrepreneurial\npractices\n• Discussion on Quality procedures and\npractices\n• Case studies on Cost consciousness in\nresource utilization\n• Case Study\n• Lecture/\nDiscussion\n• Case Study\n• Written Test\n• Interview\n1 Hour\n\n9.2 Communicate\nentrepreneurial\nworkplace best\npractices\n• Discussion on communicating\nentrepreneurial workplace best practices\n\n• Lecture/\nDiscussion\n• Written Test\n• Interview\n1 Hour\n\n9.3 Implement cost-\neffective operations\n• Case studies on Preservation, optimization\nand judicious use of workplace resources\n• Case Study\n• Lecture/\nDiscussion\n• Case Study\n• Written Test\n• Interview\n2 Hours\n\n--- PDF PAGE 109 ---\nMTOL SERVICES NC II\n\nPromulgated (12/17/2019)\n\n105\nCOMMON COMPETENCIES\n(48 hours)\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n1. Apply freight\nforwarding\ndocumentation\nservices and\nworkplace\nprocedures\n1.1. Identify major\nareas of the\nworkplace\n• Describe:\no workplace procedures and\nstandards and duty of care\nrequirements including OH&S and\nenvironmental protection\nresponsibilities\n• Group\ndiscussion\n• demonstration\n• Oral evaluation\n4 hours\n\no conditions of service including:\nemployer and employee\nobligations, employment contract,\nOH&S and other regulations\n\no Emergency procedures\n\n• Prepare site or workplace layout\n\n• Demonstration • Observation\n\n• Read and interpret instructions,\nprocedures, information and signs\nrelevant to work activities\n• Self-learning\n• Written Test\n\n• Read workplace structures and the\nroles and responsibilities of team/\ngroup members\n\n• Interpret and follow operational\ninstructions and prioritize work\n• Demonstration • Observation\n\n• Identify and correctly use equipment,\nprocesses and pr