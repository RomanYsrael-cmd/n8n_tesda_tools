egislation, policy and procedures\nrelating to the conduct of evaluations\n• Reviewing data/ information\n• Group discussion\n• Lecture\n• Demonstration\n• Role Play\n• Oral evaluation\n• Written Test\n• Observation\n• Presentation\n2 Hours\n\n--- PDF PAGE 106 ---\nMTOL SERVICES NC II\n\nPromulgated (12/17/2019)\n\n102\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n6.2 Assess gathered\ndata/ information\n• Lecture and discussion on:\no Data analysis techniques/ procedures\no Organisational values, ethics and\ncodes of conduct\no Trends and anomalies\n• Computing business mathematics and\nstatistics\n• Application of data analysis techniques\n• Group discussion\n• Lecture\n• Demonstration\n• Role Play\n• Practical exercises\n• Oral evaluation\n• Written Test\n• Observation\n• Presentation\n3 Hours\n6.3 Record and\npresent information\n• Lecture and discussion on:\no Reporting requirements to a range of\naudiences\no Recommendations for possible\nimprovements\n• Analysis and comparison of interim and\nfinal reports’ outcomes\n• Reporting of data findings\n• Group discussion\n• Lecture\n• Demonstration\n• Role Play\n• Practical exercises\n\n• Oral evaluation\n• Written Test\n• Observation\n• Presentation\n3 Hours\n7. Practice\nOccupational\nSafety and\nHealth Policies\nand Procedures\n7.1 Identify OSH\ncompliance\nrequirements\n• Discussion regarding:\n- Hierarchy of Controls\n- Hazard Prevention and Controls\n- Work Standards and Procedures\n- Personal Protective Equipment\n• Lecture\n• Group Discussion\n\n• Written Exam\n• Demonstration\n• Observation\n• Interviews /\nQuestioning\n1 Hour\n\n7.2 Prepare OSH\nrequirements for\ncompliance\n• Identification of required safety materials,\ntools and equipment\n• Handling of safety control resources\n\n• Lecture\n• Group Discussion\n\n• Written Exam\n• Demonstration\n• Observation\n• Interviews /\n• Questioning\n1 Hour\n\n--- PDF PAGE 107 ---\nMTOL SERVICES NC II\n\nPromulgated (12/17/2019)\n\n103\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\n7.3 Perform tasks in\naccordance with\nrelevant OSH\npolicies and\nprocedures\n•\nDiscussion of General OSH Standards and\nPrinciples\n• Performing industry related work activities\nin accordance with OSH Standards\n• Lecture\n• Group Discussion\n\n• Written Exam\n• Demonstration\n• Observation\n• Interviews /\n• Questioning\n2 Hours\n8. Exercise\nEfficient and\nEffective\nSustainable\nPractices in the\nWorkplace\n8.1 Identify the\nefficiency and\neffectiveness of\nresource utilization\n- Discussion on the process how\nEnvironmental Policies coherence is\nachieved\n•\nDiscussion on Necessary Skills in\nresponse to changing environmental\npolicies needs\n-\nWaste Skills\n-\nEnergy Skills\n-\nWater Skills\n-\nBuilding Skills\n-\nTransport Skills\n-\nMaterial Skills\n• Lecture\n• Group Discussion\n• Simulation\n• Demonstration\n\n• Written Exam\n• Demonstration\n• Observation\n• Interviews /\n• Questioning\n1 Hour\n\n8.2 Determine causes\nof inefficiency\nand/or\nineffectiveness of\nresource utilization\n• Discussion of Environmental Protection\nand Resource Efficiency Targets\n• Analysis on the Relevant Work Procedure\n• Lecture\n• Group Discussion\n• Demonstration\n\n• Written Exam\n• Demonstration\n• Observation\n• Interviews /\n• Questioning\n1 Hour\n\n8.3 Convey inefficient\nand ineffective\nenvironmental\npractices\n• Identification of (re)training needs and\nusage of environment friendly methods and\ntechnologies\n• Identification of environmental corrective\nactions\n• Practicing Environment Awareness\n• Lecture\n• Group Discussion\n• Role Play\n• Demonstration\n• Written Exam\n• Demonstration\n• Observation\n• Interviews /\n• Questioning\n1 Hour\n\n--- PDF PAGE 108 ---\nMTOL SERVICES NC II\n\nPromulgated (12/17/2019)\n\n104\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n9. Practice\nEntrepreneurial\nSkills in the\nWorkplace\n9.1 Apply\nentrepreneurial\nworkplace best\npractices\n\n• Case studies on Best entrepreneurial\npractices\n• Discussion on Quality procedures and\npractices\n• Case studies on Cost consciousness in\nresource utilization\n• Case Study\n• Lecture/\nDiscussion\n• Case Study\n• Written Test\n• Interview\n1 Hour\n\n9.2 Communicate\nentrepreneurial\nworkplace best\npractices\n• Discussion on communicating\nentrepreneurial workplace best practices\n\n• Lecture/\nDiscussion\n• Written Test\n• Interview\n1 Hour\n\n9.3 Implement cost-\neffective operations\n• Case studies on Preservation, optimization\nand judicious use of workplace resources\n• Case Study\n• Lecture/\nDiscussion\n• Case Study\n• Written Test\n• Interview\n2 Hours\n\n--- PDF PAGE 109 ---\nMTOL SERVICES NC II\n\nPromulgated (12/17/2019)\n\n105\nCOMMON COMPETENCIES\n(48 hours)\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n1. Apply freight\nforwarding\ndocumentation\nservices and\nworkplace\nprocedures\n1.1. Identify major\nareas of the\nworkplace\n• Describe:\no workplace procedures and\nstandards and duty of care\nrequirements including OH&S and\nenvironmental protection\nresponsibilities\n• Group\ndiscussion\n• demonstration\n• Oral evaluation\n4 hours\n\no conditions of service including:\nemployer and employee\nobligations, employment contract,\nOH&S and other regulations\n\no Emergency procedures\n\n• Prepare site or workplace layout\n\n• Demonstration • Observation\n\n• Read and interpret instructions,\nprocedures, information and signs\nrelevant to work activities\n• Self-learning\n• Written Test\n\n• Read workplace structures and the\nroles and responsibilities of team/\ngroup members\n\n• Interpret and follow operational\ninstructions and prioritize work\n• Demonstration • Observation\n\n• Identify and correctly use equipment,\nprocesses and procedures\n\n• Select and use required personal\nprotective equipment conforming to\nindustry and OH&S standards\n• Demonstration • Observation\n\n--- PDF PAGE 110 ---\nMTOL SERVICES NC II\n\nPromulgated (12/17/2019)\n\n106\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\n• Prepare personal protective\nequipment and read instructions of\nits use\n\n• Apply precautions and required\naction to minimize, control or\neliminate hazards that may exist\nduring work activities\n\n• Practice in-house safety procedures\non emergency and workplace\nhazards and related hazard\nminimization\n• Role Play\n• Observation\n\n• Demonstrate ability to:\no work collaboratively with others in\ncompleting workplace orientation\nand induction procedures\n• Demonstration • Observation\n\no work systematically with required\nattention to detail without injury to\nself or others, or damage to goods\nor equipment\n\n1.2. Organize and\naccept\nresponsibility\nfor own\nworkload\n\n• Describe\no enterprise work guidelines,\ndirections or instructions\n• Group\ndiscussion\n• Oral evaluation\n2 hours\n\n• Read work planning and method of\ncommunicating work progress to\nothers\n• Self-learning\n• Written Test\n\n• Identify ways of establishing\npriorities and deadlines\n• Lecture\n• Written\nexamination\n\n--- PDF PAGE 111 ---\nMTOL SERVICES NC II\n\nPromulgated (12/17/2019)\n\n107\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\n• Demonstrate ability to\no plan and communicate work\nprogress to others\n• Demonstration\n• Observation\n\no complete work to the expected\nstandard in the workplace and in\naccordance with any guidelines,\ndirections\n\no communicate additional support to\nimprove work to appropriate\npersonnel\n\n1.3. Apply ethical\npractices\n• Describe:\no workplace procedures, regulations\nand legislation\n• Group\ndiscussion\n• Oral evalu