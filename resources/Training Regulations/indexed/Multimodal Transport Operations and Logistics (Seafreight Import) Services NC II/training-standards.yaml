rocedures in:\no cleaning, minor maintenance and\nreplacement of consumables\n\no security of data, including regular\nback-ups and virus checks\n\no basic file maintenance\nprocedures\n\n--- PDF PAGE 126 ---\nMTOL SERVICES NC II\n\nPromulgated (12/17/2019)\n\n122\nCORE COMPETENCIES\n( 62 HOURS)\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n1. Perform\nindustry\ncalculation in\nfreight\nforwarding and\ndocumentation\nservices\n1.1 Carry out\ncalculations\n• Apply techniques of\no estimating quantities of\nmaterials and resources\no accurate estimate of\ncompleting a particular\nwork/activity\n• Lecture\n• Case study\n• Written examination 8 hours\n\n1.2 Prepare cost\nestimates\n• Practice:\no Estimate, calculate and\nrecord routine workplace\nmeasures\no Basic mathematical\nprocesses of addition,\nsubtraction, division and\nmultiplication\n• Demonstrate office activities in:\no workplace meetings and\ndiscussions scenario\n\n• Demonstration\n• Observation\n4 hours\n\n1.3 Interpret\ngraphical\nrepresentation\nof\nmathematical\ninformation\n• Demonstrate ability to\ncommunicate effectively with\nothers when carrying out basic\nworkplace calculations\n\n• Demonstration\n• Oral evaluation\n• Written test\n1 hour\n\n--- PDF PAGE 127 ---\nMTOL SERVICES NC II\n\nPromulgated (12/17/2019)\n\n123\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\n• Demonstrate ability to work\nsystematically with required\nattention to detail\n• Demonstration\n• Observation\n\n2. Process\ntransport\ndocuments for\nimport\n2.1 Gather\napplicable\ndocumentation\nrequirements\nfor import\ncargo\n• Check for packing list,\ncommercial invoice, Master bill of\nlading, House bill of lading\n• Demonstrate ability to check\ncorrectness of shipping\ndocuments\n• Group\ndiscussion\n• Oral evaluation\n12 hours\n\n2.2 Prepare import\ndocumentary\nrequirements\n• Demonstrate ability to file\nelectronic manifest with the\nBureau of Customs in timely\nmanner\n• Complete and verify documents\nare complete and correct\n• Demonstration\n• Written Test\n4 hours\n\n2.4 Track and\nupdate status\nof import cargo\n• Study of emerging technologies\nin communication and tracking of\nshipments such as GPRS, Waze\n\n• Lecture\n• Demonstration\n• Case study\n3 hours\n\n3. Prepare\nrequest for\npayment and\nbillings\n3.1 Prepare\npayments and\nbillings\n• Computation of various charges\nin freight forwarding\n• Application of currency\nconversions, local taxes, and\nrevenue ton where applicable\n• Lecture\n• Case study\n• Written test\n4 hours\n\n3.2 Monitor\npayments and\ncollections\n• Learn basic accounting principles\non billing and collection\n• Understand service agreements\nand contracts\n• Lecture\n• Case study\n4 hours\n\n--- PDF PAGE 128 ---\nMTOL SERVICES NC II\n\nPromulgated (12/17/2019)\n\n124\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\n3.3 Complete and\nrecord\ntransaction\n• Learn reportorial requirements in\nthe workplace\n• Follow filing and retention of\nrecords guidelines\n• Lecture\n• Observation\n2 hours\n4.Prepare and\ncomplete\nstatistical\nreports\n4.1 Collate data for\nreports\n• Demonstrate ability to collect/\nextract data from relevant\nsources both internal and\nexternal\n• Lecture\n• Demonstration\n• Written test\n4 hours\n\n4.2 Prepare\nreports\n• Demonstrate ability to validate\ndata and prepare reports to\nrelated government agencies and\nfor internal purposes\n• Lecture\n• Demonstration\n• Observation\n4 hours\n\n4.3 Submit reports\n• Be able to organize and submit\nnecessary reports to both internal\nand external parties\n• Simulation\n• Sampling\n• Written test\n• Oral questioning\n2 hours\n\n5.1 Maintain\nupdated list of\nrelevant\nstakeholders\n• Demonstrate ability to keep and\nupdate list of key persons of\nrelevant government agencies for\nimport clearances, permits, etc.\n• Keep updated list of other\nrelevant stakeholders such as\nport authorities and shipping\nlines\n• Lecture\n• Written test\n1 hour\n5. Liaise with\nrelevant\nstakeholders\n5.2 Process\ndocuments\n• Demonstrate ability to process\ndocuments with shipping lines,\nport authorities, regulatory\nagencies, and the consignee or\nhis/her authorized representative\n• Lecture\n• Demonstration\n\n• Written test\n• Case study\n\n2 hours\n\n--- PDF PAGE 129 ---\nMTOL SERVICES NC II\n\nPromulgated (12/17/2019)\n\n125\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\n5.3 Maintain good\nrapport with\nrelevant\nstakeholders\n• Demonstrate ability to keep\nhelpful and good rapport with\nrelevant stakeholders in the\nhandling of import sea freight\n• Tour\n• Oral questioning\n1 hour\n6. Address\nbottlenecks\nand work\ndisruptions\n6.1 Familiarize\nwith workplace\nprocedures\nand practices\n• Learn best practices business\nmodels\n• Study the company’s quality and\noperations manual\n• Lecture\n• Tour\n• Written test\n4 hours\n\n6.2 Identify\npossible\nchallenges\nand\ndisruptions\n• Understand and prepare for\npotential work or business\ndisruptions such as calamities,\nfinancial hardships, new\nregulations, etc.\n\n• Lecture\n• Case study\n• Written test\n• Case study\n4 hours\n\n6.3 Implement\ncontingency\nplan as\nrequired\n• Demonstrate ability to prepare for\nany contingency in liaising with\nexternal parties\n• Demonstrate ability to implement\ncontingency or remedial\nmeasures in accordance with\nestablished procedures and\napproval from management\n• Lecture\n• Written test\n• Case study\n8 hours\n\n--- PDF PAGE 130 ---\nMTOL SERVICES NC II\n\nPromulgated (12/17/2019)\n\n126\n3.2\nTRAINING DELIVERY\n\n1. The delivery of training shall adhere to the design of the curriculum. Delivery shall be\nguided by the principles of competency-based TVET.\n\na. Course design is based on competency standards set by the industry or\nrecognized industry sector; (Learning system is driven by competencies\nwritten to industry standards)\n\nb. Training delivery is learner-centered and should accommodate individualized and\nself-paced learning strategies;\n\nc. Training can be done on an actual workplace setting, simulation of a workplace\nand/or through adoption of modern technology.\n\nd. Assessment is based in the collection of evidence of the performance of work to\nthe industry required standards;\n\ne. Assessment of competency takes the trainee’s knowledge and attitude into\naccount but requires evidence of actual performance of the competency as the\nprimary source of evidence.\n\nf. Training program allows for recognition of prior learning (RPL) or current\ncompetencies;\n\ng. Training completion is based on satisfactory completion of all specified\ncompetencies not on the specified nominal duration of learning.\n\n2. The competency-based TVET system recognizes various types of delivery modes,\nboth on-and off-the-job as long as the learning is driven by the competency standards\nspecified by the industry. The following training modalities and their\nvariations/components may be adopted singly or in combination with other modalities\nwhen designing and delivering training programs:\n\n2.1 Institution- Based:\n\n• Dual Training System (DTS)/Dualized Training Program (DTP) which contain\nboth in-school and in-industry training or fieldwork components. Details can\nbe referred to the Implementing Rules and Regulations of the DTS Law and\nthe TESDA Guidelines on the DTP;\n\n• Distance learning is a formal education process in which majority of the\ninstruction occurs when the students and instructor are not in the same place.\nDistance learning may employ correspondence study, audio, video,\ncomputer technologies or other modern technology that can be used to\nfacilitate learning and formal and non-formal training. Specific guidelines on\nthis mode shall be issued by the TESDA Secretariat.\n\n• The classroom-based or in-center instruction uses of learner-centered\nmethods as well as laboratory or field-work components.\n\n--- PDF PAGE 131 ---\nMTOL SERVICES NC II\n\nPromulgated (12/17/2019)\n\n127\n2.2 Enterprise-Based:\n\n• Formal Apprenticeship – Training within employment involving a contract\nbetween an apprentice and an enterprise on an approved apprentice able\noccupation.\n\n• Informal Apprenticeship - is based on a training (and working) agreement\nbetween an apprentice and a master craftsperson wherein the agreement\nmay be written or oral and the master craftsperson commits to training the\napprentice in all the skills relevant to his or her trade over a significant period\nof time, usually between one and four years, while the apprentice commits to\ncontributing productively to the work of the business. Training is integrated\ninto the production process and apprentices learn by working alongside the\nexperienced craftsperson.\n\n• Enterprise-based Training- where training is implemented within the\ncompany in accordance with the requirements of the specific company.\nSpecific guidelines on this mode shall be issued by the TESDA Secretariat.\n\n2.3 Community-Based – Community-Based – short term programs conducted by\nnon-government organizations (NGOs), LGUs, training centers and other TVET\nproviders which are intended to address the specific needs of a community.\nSuch programs can be conducted in informal settings such as barangay hall,\nbasketball courts, etc. These programs can also be mobile training program\n(MTP).\n\n--- PDF PAGE 132 ---\nMTOL SERVICES NC II\n\nPromulgated (12/17/2019)\n\n128\n\n3.3\nTRAINEE ENTRY REQUIREMENTS\n\nTrainees who want to enroll in this qualification must possess the following\nrequirements:\n\n• Must have completed the ten (10) year basic education or an Alternative Learning\nSystem (ALS) Certificate of Completion with Grade 10 equivalent holder\n• Must possess good communication skills\n• Must be computer-literate\n\n3.4\nLIST OF TOOLS, EQUIPMENT AND MATERIALS\n\nList of tools, equipment and materials for the training of a maximum of 25 trainees for\nMultimodal Transport Operation and Logistics Services (Seafreight Import) NCII are as follows:\nQTY.\nEQUIPMENT\nQTY.\nTOOLS/MATERIALS\nQTY.\nREFERENCES\n1 unit Executive Table\n1 unit\nForms and Materials\n1 unit\nBusiness Process\nManual\n\nTables and Chairs\nfor 25 students\n1 unit\nCalculator\n1 unit\nHarmonize Systems\nCode and Trade\nAgreements\n1 unit Clerical Table\n1 unit\nInternet Connection\n1 unit\nDictionary of Shipping\nTerms\n 1 pc. Whiteboard\n1 unit\nTraining Handouts\n1 unit\nEmployees Manuals /\nHandbook\n1 unit USB of PowerPoint\npresentation\n1 unit\nBusiness Cards\n1unit\nEmployee Profiles /\nTerms of Reference\n1 unit LCD Projector\n1 unit\nStationaries /\nBusiness Letterheads\n1unit\nTACT Rules Book\n1 unit Laptop (for lecturer)\n1 unit\nLogbook / Master\nfiles\n1unit\nICC Incoterms\n1 unit Computer for\nadministrative and\nclerical work\n1 unit\nCertificates\n1 unit\nDG Books\n5\nunits\nComputer for\ntechnology resource\ncenter and class\ndemonstration\n1 unit\nForms (Report and\nEvaluation)\n1 unit\nWork Instructions\n1 unit Different media\nChannels\n(telephone, emails,\nviber, skype)\n1 unit\nWorld Map\n1 unit\nBasic Occupational\nSafety and Health\n1 unit Laser pointer\n1 unit\nTable of\nMeasurement /\nConversion Table\n1 unit\nForeign Exchange\nRates\n1 unit Air-conditioning Unit\n1 unit\nQuality Management\nSystems\n1 unit\nQuality Operation\nManuals\n\n--- PDF PAGE 133 ---\nMTOL SERVICES NC II\n\nPromulgated (12/17/2019)\n\n129\n\n3.5 TRAINING FACILITIES\n\nBased on a class intake of 25 students/trainees\n\nSpace Requirement\nSize in Meters\nArea in Sq. Meters\n\nStudent/Trainee Performance\nSpace (S/TPS)\n\n5 x 8 m.\n\n43 sq. m.\n\nTechnology Resource Center (TRC)\n\n2 x 5 m.\n\n10 sq. m.\n\nCirculation Area\n\n(S/TPS+PSR+TRC+\nCR) X 