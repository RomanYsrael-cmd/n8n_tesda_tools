    },
    {
      "source_text": "1.5 Checking and correcting numerical information for accuracy 1.6 Reading and interpreting instructions, procedures and information relevant to basic workplace calculations 1.7 Using calculators, numeric keypads and computer 2. Prepare cost estimates"
    },
    {
      "source_text": "2.1 Cargo weight and dimension are identified in accordance with standard operating procedure. 2.2 Standard tariff for destination charges and/or agreed rates are applied in accordance with standard operating procedure. 2.3 Applicable foreign exchange rate conversion is used for cost estimate In accordance with industry practice. 2.4 Quantities of materials and resources required to complete a work task are estimated 2.5 Accurate estimates for work completion are made"
    },
    {
      "source_text": "2.1 Knowledge, Theory, Application, Systems Operation 2.2 Technology 2.3 Techniques of estimating quantities of materials and resources 2.4 Techniques for making an accurate estimate of completing a particular work/activity"
    },
    {
      "source_text": "2.1 Estimating quantities of materials and resources required to complete a work task 2.2 Making accurate estimates for work completion 2.3 Communicating effectively with others when carrying out basic workplace calculations 2.4 Completing documentation 2.5 Working 2.6 systematically with required attention to detail"
    },
