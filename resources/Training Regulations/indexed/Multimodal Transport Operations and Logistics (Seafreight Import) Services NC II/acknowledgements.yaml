    {
      "source_text": "1. Critical Aspects of Competency"
    },
    {
      "source_text": "Assessment requires evidence that the candidate: 1.1 Described relevant freight information and applied in the workplace in relation to the customer and relevant parties 1.2 Executed freight forwarding tasks as assigned in the workplace 1.3 Utilized tools and equipment and knowledge relevant in the freight logistics industry 2. Resource Implications"
    },
    {
      "source_text": "The following resources should be provided: 2.1 Workplace Environment 2.2 Tools, Materials, Equipment and new technologies relevant to the unit of competency 2.3 Manuals 3. Methods of Assessment"
    },
    {
      "source_text": "Competency in this unit may be assessed through: 3.1 Written Test 3.2 Direct observation and oral questioning 3.3 Interview 4. Context of Assessment"
