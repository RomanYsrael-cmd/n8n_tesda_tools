    {
      "source_text": "ELEMENTS PERFORMANCE CRITERIA Italicized terms are elaborated in the Range of Variables"
    },
    {
      "source_text": "REQUIRED KNOWLEDGE"
    },
    {
      "source_text": "REQUIRED SKILLS 1. Gather data/ information 1.1 Evidence, facts and information are collected 1.2 Evaluation, terms of reference and conditions are reviewed to determine whether data/information falls within project scope"
    },
    {
      "source_text": "1.1 Organisational protocols 1.2 Confidentiality 1.3 Accuracy 1.4 Business mathematics and statistics 1.5 Data analysis techniques/proced ures 1.6 Reporting requirements to a range of audiences 1.7 Legislation, policy and procedures relating to the conduct of evaluations 1.8 Organisational values, ethics and codes of conduct"
    },
    {
      "source_text": "1.1 Describing organisational protocols relating to client liaison 1.2 Protecting confidentiality 1.3 Describing accuracy 1.4 Computing business mathematics and statistics 1.5 Describing data analysis techniques/ procedures 1.6 Reporting requirements to a range of audiences 1.7 Stating legislation, policy and procedures relating to the conduct of evaluations 1.8 Stating organisational values, ethics and codes of conduct"
    },
    {
      "source_text": "-- PDF PAGE 27 --- TESDA-SOP-QSO-01-F08 MTOL SERVICES NC II"
    },
    {
      "source_text": "Promulgated (12/17/2019)"
    },
    {
      "source_text": "23"
    },
    {
      "source_text": "ELEMENTS PERFORMANCE CRITERIA Italicized terms are elaborated in the Range of Variables"
    },
    {
      "source_text": "REQUIRED KNOWLEDGE"
    },
    {
      "source_text": "REQUIRED SKILLS 2. Assess gathered data/ information 2.1 Validity of data/ information is assessed 2.2 Analysis techniques are applied to assess data/ information. 2.3 Trends and anomalies are identified 2.4 Data analysis techniques and procedures are documented 2.5 Recommendation s are made on areas of possible improvement."
    },
    {
      "source_text": "2.1 Business mathematics and statistics 2.2 Data analysis techniques/ procedures 2.3 Reporting requirements to a range of audiences 2.4 Legislation, policy and procedures relating to the conduct of evaluations 2.5 Organisational values, ethics and codes of conduct 2.1 Computing business mathematics and statistics 2.2 Describing data analysis techniques/ procedures 2.3 Reporting requirements to a range of audiences 2.4 Stating legislation, policy and procedures relating to the conduct of evaluations 2.5 Stating organisational values, ethics and codes of conduct"
    },
    {
      "source_text": "3. Record and present information 3.1 Studied data/information are recorded. 3.2 Recommendation s are analysed for action to ensure they are compatible with the project’s scope and terms of reference. 3.3 Interim and final reports are analysed and outcomes are compared to the criteria established at the outset. 3.4 Findings are presented to stakeholders."
    },
    {
      "source_text": "3.1 Data analysis techniques/ procedures 3.2 Reporting requirements to a range of audiences 3.3 Legislation, policy and procedures relating to the conduct of evaluations 3.4 Organisational values, ethics and codes of conduct"
    },
    {
      "source_text": "3.1 Describing data analysis techniques/ procedures 3.2 Reporting requirements to a range of audiences 3.3 Stating legislation, policy and procedures relating to the conduct of evaluations 3.4 Stating organisational values, ethics and codes of conduct practices"
    },
    {
      "source_text": "-- PDF PAGE 28 --- TESDA-SOP-QSO-01-F08 MTOL SERVICES NC II"
    },
    {
      "source_text": "Promulgated (12/17/2019)"
    },
    {
      "source_text": "24 RANGE OF VARIABLES"
    },
    {
      "source_text": "VARIABLE RANGE 1. Data analysis techniques May include: 1.1. Domain analysis 1.2. Content analysis 1.3. Comparison technique"
    },
    {
      "source_text": "EVIDENCE GUIDE"
    },
    {
      "source_text": "1. Critical aspects of Competency Assessment requires evidence that the candidate: 1.1 Determine data / information 1.2 Studied and applied gathered data/information 1.3 Recorded and studied data/information"
    },
    {
      "source_text": "These aspects may be best assessed using a range of scenarios what ifs as a stimulus with a walk- through forming part of the response. These assessment activities should include a range of problems, including new, unusual and improbable situations that may have happened. 2. Resource Implications Specific resources for assessment 2.1. Evidence of competent performance should be obtained by observing an individual in an information management role within the workplace or operational or simulated environment. 3. Methods of Assessment Competency in this unit may be assessed through: 3.1. Written Test 3.2. Interview 3.3. Portfolio"
    },
    {
      "source_text": "The unit will be assessed in a holistic manner as is practical and may be integrated with the assessment of other relevant units of competency. Assessment will occur over a range of situations, which will include disruptions to normal, smooth operation. Simulation may be required to allow for timely assessment of parts of this unit of competency. Simulation should be based on the actual workplace and will include walk through of the relevant competency components. 4. Context for Assessment 4.1. In all workplace, it may be appropriate to assess this unit concurrently with relevant teamwork or operation units."
    },
    {
