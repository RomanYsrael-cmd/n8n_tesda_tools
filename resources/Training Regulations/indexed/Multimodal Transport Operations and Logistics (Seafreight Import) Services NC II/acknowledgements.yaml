    {
      "source_text": "40 UNIT OF COMPETENCY : PERFORM WORKPLACE SECURITY AND SAFETY"
    },
    {
      "source_text": "UNIT CODE : MTO491202"
    },
    {
      "source_text": "UNIT DESCRIPTOR : This unit involves the skills and knowledge required to follow security procedures in the workplace. It includes identifying security threats or situations and responding thereof."
    },
    {
      "source_text": "ELEMENT PERFORMANCE CRITERIA Italicized terms are elaborated in the Range of Variable REQUIRED KNOWLEDGE REQUIRED SKILLS 1. Maintain security of the workplace"
    },
    {
      "source_text": "1.1 Any breach of security requirements are reported promptly to designated personnel in accordance with workplace safety and security procedures 1.2 Potential security concerns are identified and reported to the appropriate authorities in accordance with company policies. 1.3 Security in the workplace is maintained and monitored in accordance with established procedures. 1.1. Applicable transport security legislation including relevant international, national laws, regulations, codes and/or guidelines 1.2. Relevant workplace security program and policies and procedures for responding to security threats, situations and emergencies 1.3. Relevant quarantine and bond regulations and requirements 1.4. Relevant OS&H and environmental protection procedures and guidelines 1.5. Common security threats and incidents that may occur and related roles and responsibilities of personnel when reporting them and responding to them"
    },
    {
      "source_text": "1.1. Communicating effectively with concerned parties when following security procedures 1.2. Reading and interpreting instructions, procedures, applicable regulatory requirements, labels, markings, ID cards and other information relevant to workplace safety and security 1.3. Completing required documentation and reports related to safety and security procedures 1.4. Applying procedures for safety, security checks and precautions as per limits of role and responsibilities"
    },
    {
      "source_text": "-- PDF PAGE 45 --- TESDA-SOP-QSO-01-F08 MTOL SERVICES NC II"
    },
    {
      "source_text": "Promulgated (12/17/2019)"
    },
    {
      "source_text": "41 ELEMENT PERFORMANCE CRITERIA Italicized terms are elaborated in the Range of Variable REQUIRED KNOWLEDGE REQUIRED SKILLS 1. Familiarize with workplace safety and security policies and procedures 2.1 Safety and Security orientation are attended in accordance to workplace procedures 2.2 Safety and Security procedures are applied in accordance with workplace policy 2.3 Safety and Security procedures are maintained in accordance with workplace policy. 2.1 Applicable Department of Labor and Employment safety and health standards. 2.2 Relevant workplace security program and policies and procedures 2.3 Relevant OS&H and environmental protection procedures and guidelines 2.4 Common security threats and incidents that may occur and related roles and responsibilities of personnel when reporting them and responding to them 2.1 Communicating effectively with concerned parties when following security procedures 2.2 Reading and interpreting instructions, procedures, applicable regulatory requirements, labels, markings, ID cards and other information relevant to workplace safety and security 2.3 Completing required documentation and reports related to safety and security procedures 2.4 Applying procedures for safety, security checks and precautions as per limits of role and responsibilities"
    },
    {
      "source_text": "-- PDF PAGE 46 --- TESDA-SOP-QSO-01-F08 MTOL SERVICES NC II"
    },
    {
      "source_text": "Promulgated (12/17/2019)"
    },
    {
      "source_text": "42 ELEMENT PERFORMANCE CRITERIA Italicized terms are elaborated in the Range of Variable REQUIRED KNOWLEDGE REQUIRED SKILLS 3.Identify a security threat or situation"
    },
    {
      "source_text": "3.1 Security threat or situation is promptly identified and assessed and response is prioritized in accordance with the workplace security program and procedures 3.2 Implications of the security threat or situation are evaluated in accordance with workplace security program and procedures"
    },
    {
      "source_text": "3.1 Applicable transport security legislation including relevant international, national, state and territory acts, regulations codes and/or guidelines 3.2 Relevant workplace security program and policies and procedures for responding to security threats, situations and emergencies 3.3 Common security threats and incidents that may occur in the workplace and related roles and responsibilities of personnel when reporting them and responding to them 3.4 Relevant quarantine and bond regulations and requirements 3.5 Relevant OS&H and environmental protection procedures and guidelines 3.6 Signs of forced entry, theft and interference in the workplace 3.7 Common security problems that may occur when carrying out operations in the transport and logistics industries, and action that can be taken to address and resolve the problems 3.1 Identifying and solving and/or reporting problems that arise when following security procedures 3.2 Recognizing signs of pillage, theft and interference with stocks and goods 3.3 Recognizing signs of security threats and situations"
    },
    {
      "source_text": "-- PDF PAGE 47 --- TESDA-SOP-QSO-01-F08 MTOL SERVICES NC II"
    },
    {
      "source_text": "Promulgated (12/17/2019)"
    },
    {
      "source_text": "43 ELEMENT PERFORMANCE CRITERIA Italicized terms are elaborated in the Range of Variable REQUIRED KNOWLEDGE REQUIRED SKILLS 4. Respond to a security threat or situation"
    },
    {
      "source_text": "4.1 Response to an identified security threat or situation is in accordance with workplace security procedures, received instructions, regulatory requirements and emergency response plan 4.2 Security threats or incidents are handled appropriately in accordance with established response plan and within limits of responsibility using available communications in the work area 4.1 Common security problems that may occur when carrying out operations in the workplace and action that can be taken to address and resolve the problems 4.2 Relevant documentation and reporting requirements"
    },
    {
      "source_text": "4.1 Completing required documentation and reports related to security procedures 4.2 Working collaboratively with others when following security procedures 4.3 Modifying activities depending on differing workplace contexts risk situations and environments 4.4 Applying security programs and procedures in- response to identified security threats 4.5 Promptly reporting and/or rectifying any identified problems that may arise when following security procedures in accordance with regulatory requirements and workplace procedures"
    },
    {
      "source_text": "-- PDF PAGE 48 --- TESDA-SOP-QSO-01-F08 MTOL SERVICES NC II"
    },
    {
      "source_text": "Promulgated (12/17/2019)"
    },
    {
      "source_text": "44 RANGE OF VARIABLES"
    },
    {
      "source_text": "VARIABLE RANGE 1. Security Measures"
    },
    {
      "source_text": "May include: 1.1 security guards at access points and gates to secured areas 1.2 locked doors, gates and fences 1.3 use of personal electronic access cards 1.4 recording of carrier and vehicle registration details at gates and checkpoints 1.5 bag check points 1.6 escorts for visitors in restricted areas 1.7 access control in and out of restricted security areas 1.8 use of ID cards 1.9 video surveillance equipment 1.10 X-ray screening of baggage, cargo and goods 1.11 explosives trace detection (ETD) screening of passengers, baggage, cargo and goods 1.12 screening of passengers using hand-held and walk through magnetometers 2. Workplace Security Procedures May include: 2.1 Established security procedures 2.2 Standard operating procedures 2.3 Company procedures 2.4 Enterprise procedures 2.5 Organizational procedures 3. Communications"
    },
    {
      "source_text": "May include: 3.1 Phone 3.2 Radio 3.3 Fax 3.4 Email 3.5 Electronic data transfer (EDI) 3.6 Internet 3.7 Oral, aural or signed communications"
    },
    {
      "source_text": "-- PDF PAGE 49 --- TESDA-SOP-QSO-01-F08 MTOL SERVICES NC II"
    },
    {
      "source_text": "Promulgated (12/17/2019)"
    },
    {
      "source_text": "45 EVIDENCE GUIDE"
    },
    {
      "source_text": "1. Critical Aspects of Competency"
    },
    {
      "source_text": "Assessment requires evidence that the candidate: 1.1 Secured goods and cargo in accordance with workplace security procedures and applicable security regulations 1.2 Checked and maintained seals, tamper proof packaging, locks and other security measures on goods or cargo in accordance with workplace security procedures 1.3 Identified and assessed security threat or situation in accordance with the workplace security program and procedures 1.4 Responded to an identified security threat or situation in accordance with workplace security procedures, received instructions, regulatory requirements and emergency response plan 1.5 Handled appropriately any security threats or incidents in accordance with established response plan and within limits of responsibility"
    },
    {
      "source_text": "2. Resource Implications"
    },
    {
      "source_text": "The following resources should be provided: 2.1 Workplace location 2.2 Materials and new technologies relevant to the unit of competency 2.3 Technical plans, drawings and specifications relevant to the activities 3. Methods of Assessment"
    },
    {
      "source_text": "Competency in this unit may be assessed through: 3.1 Written Test 3.2 Direct Observation 3.3 Oral Questioning"
    },
    {
      "source_text": "4. Context of Assessment"
    },
    {
      "source_text": "4.1 Competency maybe assessed in actual workplace or at the designated TESDA accredited Assessment Center."
    },
    {
      "source_text": "-- PDF PAGE 50 --- TESDA-SOP-QSO-01-F08 MTOL SERVICES NC II"
    },
    {
      "source_text": "Promulgated (12/17/2019)"
    },
    {
      "source_text": "46 UNIT OF COMPETENCY : PROVIDE EFFECTIVE CUSTOMER SERVICE"
    },
    {
      "source_text": "UNIT CODE : MTO491203"
    },
    {
      "source_text": "UNIT DESCRIPTOR : This unit involves the skills and knowledge required to provide effective customer service skills to relevant workplace operations. It includes dealing with customer inquiries and monitoring customer satisfaction."
    },
    {
      "source_text": "ELEMENT PERFORMANCE CRITERIA Italicized terms are elaborated in the Range of Variable REQUIRED KNOWLEDGE REQUIRED SKILLS 1. Deal with customer inquiries"
    },
    {
      "source_text": "1.1 Customer inquiries are dealt with courteously and efficiently both by phone and face to face 1.2 Questions are used to clarify the customer's needs or concerns 1.3 Assistance from other staff is sought when a customer' s inquiry cannot be fully answered 1.4 Knowledge of products, services and/or operations is used to answer customer queries or to respond to customers' needs"
    },
    {
      "source_text": "1.1 Workplace procedures relevant to work activities 1.2 Communication etiquettes 1.3 Techniques in dealing with Customer inquiries using computer and phone application. 1.4 Customer service policies and procedures 1.5 Types of operations carried out in the workplace concerned"
    },
    {
      "source_text": "1.1 Dealing with customer inquiries courteously and efficiently both by phone and face to face 1.2 Seeking assistance from other staff when a customer' s inquiry cannot be fully answered 1.3 Communicating effectively with others when providing customer service, including the use of telephone techniques 1.4 Handling customer queries and complaints"
    },
    {
      "source_text": "-- PDF PAGE 51 --- TESDA-SOP-QSO-01-F08 MTOL SERVICES NC II"
    },
    {
      "source_text": "Promulgated (12/17/2019)"
    },
    {
      "source_text": "47 ELEMENT PERFORMANCE CRITERIA Italicized terms are elaborated in the Range of Variable REQUIRED KNOWLEDGE REQUIRED SKILLS 2. Monitor customer satisfaction"
    },
    {
      "source_text": "2.1 Customer requirements are dealt with according to workplace procedures 2.2 Appropriate feedback is provided to managers and internal and/or external customers 2.3 Customer inquiries and associated action are recorded and reported in accordance with workplace procedures"
    },
    {
      "source_text": "2.1 Sources of information and documentation needed to assess customer satisfaction 2.2 Methods of dealing with Customer requirements 2.3 Methods of recording customer inquiries and associated action 2.4 Appropriate methods of providing feedback to managers and internal and/or external customers 2.1 Providing appropriate feedback to managers and internal and/or external customers 2.2 Recording and reporting customer inquiries and associated action 2.3 Completing documentation related to the provision of customer service 2.4 Writing simple reports and recording of inquiries"
    },
    {
      "source_text": "-- PDF PAGE 52 --- TESDA-SOP-QSO-01-F08 MTOL SERVICES NC II"
    },
    {
      "source_text": "Promulgated (12/17/2019)"
    },
    {
      "source_text": "48 RANGE OF VARIABLES"
    },
    {
      "source_text": "VARIABLE RANGE 1. Customer May include: 1.1 Internal 1.2 External 2.Customer Requirements May include: 2.1 Carriers charges 2.2 Forwarders charges 2.3 Arrival notice 2.4 Cargo status 2.5 Special handling instruction 3. Workplace Procedures May include: 3.1 Enterprise procedures 3.2 Organizational procedures 3.3 Established departmental procedures 3.4 Work Procedure / Processes Flow 3.1 Client procedures and service level agreement 4. Handling and Documentation Requirements May include: 4.1 shipping instruction 4.2 MSDS 4.3 Special handling 4.4 Commodity clearance or permit"
    },
    {
      "source_text": "-- PDF PAGE 53 --- TESDA-SOP-QSO-01-F08 MTOL SERVICES NC II"
    },
    {
      "source_text": "Promulgated (12/17/2019)"
    },
    {
      "source_text": "49 EVIDENCE GUIDE"
    },
    {
      "source_text": "1. Critical Aspects of Competency"
    },
    {
      "source_text": "Assessment requires evidence that the candidate: 1.1 Dealt with customer inquiries courteously and efficiently both by phone, email, social media and face to face 1.2 Used knowledge of products, services and/or operations to answer customer queries or to respond to customers' needs 1.3 Provided appropriate feedback to managers and internal and/or external customers 1.4 Recorded and reported customer inquiries and associated action are in accordance with workplace procedures 2. Resource Implications"
    },
    {
      "source_text": "The following resources should be provided: 2.1 Workplace location 2.2 Materials and new technologies relevant to the unit of competency 2.3 Technical plans, drawings and specifications relevant to the activities 3. Methods of Assessment"
    },
    {
      "source_text": "Competency in this unit may be assessed through: 3.1 Written Test 3.2 Direct observation and oral questioning 3.3 Demonstration with oral questioning"
    },
    {
      "source_text": "4. Context of Assessment"
    },
    {
      "source_text": "4.1 Competency maybe assessed in actual workplace or at the designated TESDA accredited Assessment Center."
    },
    {
      "source_text": "-- PDF PAGE 54 --- TESDA-SOP-QSO-01-F08 MTOL SERVICES NC II"
    },
    {
      "source_text": "Promulgated (12/17/2019)"
    },
    {
      "source_text": "50 UNIT OF COMPETENCY : CONTRIBUTE TO QUALITY SYSTEMS"
    },
    {
      "source_text": "UNIT CODE : MTO491204"
    },
    {
      "source_text": "UNIT DESCRIPTOR : This unit involves the skills and knowledge required to contribute quality procedures within work activities. It includes applying quality concepts to work, planning and evaluating improvements in work processes and implementing improvements confirmed through tests and evaluation."
    },
    {
      "source_text": "ELEMENT PERFORMANCE CRITERIA Italicized terms are elaborated in the Range of Variable REQUIRED KNOWLEDGE REQUIRED SKILLS 1. Apply quality concepts"
    },
    {
      "source_text": "1.1 Responsibility is taken for quality of own work when providing services or products to meet customer needs 1.2 Work is completed in accordance with workplace standards as defined in enterprise policies and procedures 1.3 Basic quality concepts are applied to work activities"
    },
    {
      "source_text": "1.1. Ways of meeting external and internal customer needs in providing quality services or products 1.2. Means of completing work 1.3. Basic quality concepts applied to work activities 1.4. Workplace quality assurance and improvement principles and procedures 1.5. Typical quality- related problems that may arise in work operations and products, and related options for action and solutions 1.1. Providing quality work/services or products to meet external and internal customer needs 1.2. Completing work in accordance with workplace standards as defined in enterprise policies and procedure 1.3. Applying basic quality concepts to work activities 1.4. Reading and interpreting instructions and information relevant to quality procedures and standards 1.5. Completing documentation related to quality procedures and standards 1.6. Working collaboratively with others when applying quality procedures and standards"
    },
    {
      "source_text": "-- PDF PAGE 55 --- TESDA-SOP-QSO-01-F08 MTOL SERVICES NC II"
    },
    {
      "source_text": "Promulgated (12/17/2019)"
    },
    {
