ams for MULTIMODAL TRANSPORT OPERATION AND LOGISTICS SERVICES\n(SEAFREIGHT IMPORT) NCII\n\nThis includes information on curriculum design; training delivery; trainee entry\nrequirements; tools and equipment; training facilities; and trainer’s qualification and institutional\nassessment.\n\n3.1 CURRICULUM DESIGN\n\nTESDA shall provide the training on the development of competency-based curricula to\nenable training providers develop their own curricula with the components mentioned below.\n\nDelivery of knowledge requirements for the basic, common and core units of competency\nspecifically in the areas of mathematics, science/technology, communication/language,\nenvironment and other academic subjects shall be contextualized. To this end, TVET providers\nshall develop a Contextual Learning Matrix (CLM) to include Technology, Science, Math,\nEnglish/Communication and Safety to Environment. Includes also green technology, issues on\nhealth and drugs and cater to person with disabilities (PWD’s)\n\nCourse Title: MULTIMODAL TRANSPORT OPERATION AND NC Level: NCII\n LOGISTICS (SEAFREIGHT IMPORT) SERVICES\n\nNominal Training Duration:\n\nNo. of Hours\nCoverage\n 37 Hrs.\nBasic Competencies\n 48 Hrs.\nCommon Competencies\n 62 Hrs.\nCore Competencies\n 147 Hrs.\n 126 Hrs.\n\nSIL\n 273 Hrs. Total\nCourse Description:\n\nThis course is designed to provide the learner with knowledge, practical skills and\nattitude, applicable in performing industry calculation in freight forwarding and documentation\nservices, processing transport documents for import cargo, preparing request for payment and\nbillings, preparing and completing statistical reports, processing shipping documents, liaising\nwith relevant stakeholders and addressing bottlenecks and work disruptions. This include\nclassroom learning activities and practical work in actual work site or simulation area.\n\n The training institution has the option to introduce other methodologies to deliver the\nprogram or the course and to partner with other individuals/organizations that would be able to\nprovide training resources in the conduct of the course.\n\nUpon completion of the course, the learners are expected to demonstrate the above-\nmentioned competencies to be employed. To obtain this, all units prescribed for this\nqualification must be achieve.\n\n--- PDF PAGE 99 ---\nMTOL SERVICES NC II\n\nPromulgated (12/17/2019)\n\n95\nBASIC COMPETENCIES\n(37 HOURS)\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n1. Participate in\nworkplace\ncommunication\n1.1. Obtain and convey\nworkplace\ninformation\n•\nDescribe Organizational policies\n•\nRead:\no Effective communication\no Written communication\no Communication procedures and\nsystems\n•\nIdentify:\no Different modes of communication\no Medium of communication\no Flow of communication\no Available technology relevant to the\nenterprise and the individual’s work\nresponsibilities\n•\nPrepare different Types of question\n•\nGather different sources of information\n•\nApply storage system in establishing\nworkplace information\n•\nDemonstrate Telephone courtesy\n• Group discussion\n• Lecture\n• Demonstration\n• Oral evaluation\n• Written\nexamination\n• Observation\n2 Hours\n1.2. Perform duties\nfollowing\nworkplace\ninstructions\n•\nRead:\no Written notices and instructions\no Workplace interactions and\nprocedures\n•\nRead instructions on work related\nforms/documents\nPerform workplace duties scenario\nfollowing workplace instructions\n• Group discussion\n• Lecture\n• Demonstration\n• Oral evaluation\n• Written\nexamination\n• Observation\n2 Hours\n\n--- PDF PAGE 100 ---\nMTOL SERVICES NC II\n\nPromulgated (12/17/2019)\n\n96\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n1.3. Complete relevant\nwork related\ndocuments\n•\nDescribe Communication procedures and\nsystems\n•\nRead:\no Meeting protocols\n