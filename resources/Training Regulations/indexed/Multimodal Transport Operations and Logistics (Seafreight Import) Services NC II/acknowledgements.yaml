      "source_text": "36 COMMON COMPETENCIES"
    },
    {
      "source_text": "UNIT OF COMPETENCY : APPLY FREIGHT FORWARDING DOCUMENTATION SERVICES AND WORKPLACE PROCEDURES"
    },
    {
      "source_text": "UNIT CODE : MTO491201"
    },
    {
      "source_text": "UNIT DESCRIPTOR : This unit involves the skills and knowledge required to apply freight forwarding documentation services and workplace procedures."
    },
    {
      "source_text": "ELEMENT PERFORMANCE CRITERIA Italicized terms are elaborated in the Range of Variable REQUIRED KNOWLEDGE REQUIRED SKILLS 1. Gain understanding on the different terminologies used in freight forwarding and shipping"
    },
    {
      "source_text": "1.1 Common freight forwarding terminologies are familiarized in accordance with global practices. 1.2 Shipping terminologies are familiarized in accordance with global practices. 1.3 Incoterms are familiarized in accordance with global trading practices. 1.1. Workplace procedures and standards 1.2. Workplace structures and the roles and responsibilities of Freight forwarder 1.3. Freight forwarding, shipping and trade terminologies"
    },
    {
      "source_text": "1.1. Communicating effectively with others when completing workplace orientation 1.2. Reading and interpreting instructions, procedures, information and signs relevant to work activities 1.3. Interpreting and following operational instructions 1.4. Identifying and correctly using terminologies, processes and procedures 1.5. Selecting and using appropriate terminologies 2. Apply freight forwarding and shipping terminologies in communication with overseas agents, clients and other stakeholders"
    },
    {
      "source_text": "2.1 Necessary protocols and formats are used in accordance with standard operating procedures. 2.1 Workplace procedures and standards 2.2 Workplace structures and the roles and responsibilities of Freight forwarder 2.1 Communicating effectively with others when completing workplace orientation 2.2 Reading and interpreting instructions,"
    },
    {
      "source_text": "-- PDF PAGE 41 --- TESDA-SOP-QSO-01-F08 MTOL SERVICES NC II"
    },
    {
      "source_text": "Promulgated (12/17/2019)"
    },
    {
      "source_text": "37 ELEMENT PERFORMANCE CRITERIA Italicized terms are elaborated in the Range of Variable REQUIRED KNOWLEDGE REQUIRED SKILLS"
    },
    {
      "source_text": "2.2 Proper tools and equipment are identified and used in accordance with workplace procedures 2.3 Responses in communications are made in accordance with agreed timelines"
    },
    {
      "source_text": "2.3 Freight forwarding, shipping and trade terminologies 2.4 Proper use of computer and mobile software application."
    },
    {
      "source_text": "procedures, information and signs relevant to work activities 2.3 Interpreting and following operational instructions 2.4 Identifying and correctly using terminologies, processes and procedures 2.5 Selecting and using appropriate terminologies 3. Receive and prepare work assignment including documents for processing"
    },
    {
      "source_text": "3.1 Required documents for processing are identified in accordance with standard operating procedure 3.2 The itinerary is prepared according to priority of work assignment 3.3 Prepared itinerary is submitted for approval to the immediate superior. 3.1 Organizational policy and procedures relating to liaison and documentation clerk with other organizations 3.2 Role as liaison personnel and documentation clerk. 3.3 Knowledge of current practices and procedures for communicating in the workplace 3.4 Follow protocols and procedures 3.5 Awareness of the approach to the specific government agencies to deal with such as DOF, BIR, BOC, DTI etc. for clearance procurement, and other private agencies"
    },
    {
      "source_text": "3.1 Networking and developing relationships 3.2 Negotiation skills 3.3 Social skills. 3.4 Write legibly 3.5 Accomplish required form details completely and accurately"
    },
    {
