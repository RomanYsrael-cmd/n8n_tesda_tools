strate ability to process\ndocuments with shipping lines,\nport authorities, regulatory\nagencies, and the consignee or\nhis/her authorized representative\n• Lecture\n• Demonstration\n\n• Written test\n• Case study\n\n2 hours\n\n--- PDF PAGE 129 ---\nMTOL SERVICES NC II\n\nPromulgated (12/17/2019)\n\n125\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\n5.3 Maintain good\nrapport with\nrelevant\nstakeholders\n• Demonstrate ability to keep\nhelpful and good rapport with\nrelevant stakeholders in the\nhandling of import sea freight\n• Tour\n• Oral questioning\n1 hour\n6. Address\nbottlenecks\nand work\ndisruptions\n6.1 Familiarize\nwith workplace\nprocedures\nand practices\n• Learn best practices business\nmodels\n• Study the company’s quality and\noperations manual\n• Lecture\n• Tour\n• Written test\n4 hours\n\n6.2 Identify\npossible\nchallenges\nand\ndisruptions\n• Understand and prepare for\npotential work or business\ndisruptions such as calamities,\nfinancial hardships, new\nregulations, etc.\n\n• Lecture\n• Case study\n• Written test\n• Case study\n4 hours\n\n6.3 Implement\ncontingency\nplan as\nrequired\n• Demonstrate ability to prepare for\nany contingency in liaising with\nexternal parties\n• Demonstrate ability to implement\ncontingency or remedial\nmeasures in accordance with\nestablished procedures and\napproval from management\n• Lecture\n• Written test\n• Case study\n8 hours\n\n--- PDF PAGE 130 ---\nMTOL SERVICES NC II\n\nPromulgated (12/17/2019)\n\n126\n3.2\nTRAINING DELIVERY\n\n1. The delivery of training shall adhere to the design of the curriculum. Delivery shall be\nguided by the principles of competency-based TVET.\n\na. Course design is based on competency standards set by the industry or\nrecognized industry sector; (Learning system is driven by competencies\nwritten to industry standards)\n\nb. Training delivery is learner-centered and should accommodate individualized and\nself-paced learning strategies;\n\nc. Training can be done on an actual workplace setting, simulation of a workplace\nand/or through adoption of modern technology.\n\nd. Assessment is based in the collection of evidence of the performance of work to\nthe industry required standards;\n\ne. Assessment of competency takes the trainee’s knowledge and attitude into\naccount but requires evidence of actual performance of the competency as the\nprimary source of evidence.\n\nf. Training program allows for recognition of prior learning (RPL) or current\ncompetencies;\n\ng. Training completion is based on satisfactory completion of all specified\ncompetencies not on the specified nominal duration of learning.\n\n2. The competency-based TVET system recognizes various types of delivery modes,\nboth on-and off-the-job as long as the learning is driven by the competency standards\nspecified by the industry. The following training modalities and their\nvariations/components may be adopted singly or in combination with other modalities\nwhen designing and delivering training programs:\n\n2.1 Institution- Based:\n\n• Dual Training System (DTS)/Dualized Training Program (DTP) which contain\nboth in-school and in-industry training or fieldwork components. Details can\nbe referred to the Implementing Rules and Regulations of the DTS Law and\nthe TESDA Guidelines on the DTP;\n\n• Distance learning is a formal education process in which majority of the\ninstruction occurs when the students and instructor are not in the same place.\nDistance learning may employ correspondence study, audio, video,\ncomputer technologies or other modern technology that can be used to\nfacilitate learning and formal and non-formal training. Specific guidelines on\nthis mode shall be issued by the TESDA Secretariat.\n\n• The classroom-based or in-center instruction uses of learner-centered\nmethods as well as laboratory or field-work components.\n\n--- PDF PAGE 131 ---\nMTOL SERVICES NC II\n\nPromulgated (12/17/2019)\n\n127\n2.2 Enterprise-Based:\n\n• Formal Apprenticeship – Training within employment involving a contract\nbetween an apprentice and an enterprise on an approved apprentice able\noccupation.\n\n• Informal Apprenticeship - is based on a training (and working) agreement\nbetween an apprentice and a master craftsperson wherein the agreement\nmay be written or oral and the master craftsperson commits to training the\napprentice in all the skills relevant to his or her trade over a significant period\nof time, usually between one and four years, while the apprentice commits to\ncontributing productively to the work of the business. Training is integrated\ninto the production process and apprentices learn by working alongside the\nexperienced craftsperson.\n\n• Enterprise-based Training- where training is implemented within the\ncompany in accordance with the requirements of the specific company.\nSpecific guidelines on this mode shall be issued by the TESDA Secretariat.\n\n2.3 Community-Based – Community-Based – short term programs conducted by\nnon-government organizations (NGOs), LGUs, training centers and other TVET\nproviders which are intended to address the specific needs of a community.\nSuch programs can be conducted in informal settings such as barangay hall,\nbasketball courts, etc. These programs can also be mobile training program\n(MTP).\n\n--- PDF PAGE 132 ---\nMTOL SERVICES NC II\n\nPromulgated (12/17/2019)\n\n128\n\n3.3\nTRAINEE ENTRY REQUIREMENTS\n\nTrainees who want to enroll in this qualification must possess the following\nrequirements:\n\n• Must have completed the ten (10) year basic education or an Alternative Learning\nSystem (ALS) Certificate of Completion with Grade 10 equivalent holder\n• Must possess good communication skills\n• Must be computer-literate\n\n3.4\nLIST OF TOOLS, EQUIPMENT AND MATERIALS\n\nList of tools, equipment and materials for the training of a maximum of 25 trainees for\nMultimodal Transport Operation and Logistics Services (Seafreight Import) NCII are as follows:\nQTY.\nEQUIPMENT\nQTY.\nTOOLS/MATERIALS\nQTY.\nREFERENCES\n1 unit Executive Table\n1 unit\nForms and Materials\n1 unit\nBusiness Process\nManual\n\nTables and Chairs\nfor 25 students\n1 unit\nCalculator\n1 unit\nHarmonize Systems\nCode and Trade\nAgreements\n1 unit Clerical Table\n1 unit\nInternet Connection\n1 unit\nDictionary of Shipping\nTerms\n 1 pc. Whiteboard\n1 unit\nTraining Handouts\n1 unit\nEmployees Manuals /\nHandbook\n1 unit USB of PowerPoint\npresentation\n1 unit\nBusiness Cards\n1unit\nEmployee Profiles /\nTerms of Reference\n1 unit LCD Projector\n1 unit\nStationaries /\nBusiness Letterheads\n1unit\nTACT Rules Book\n1 unit Laptop (for lecturer)\n1 unit\nLogbook / Master\nfiles\n1unit\nICC Incoterms\n1 unit Computer for\nadministrative and\nclerical work\n1 unit\nCertificates\n1 unit\nDG Books\n5\nunits\nComputer for\ntechnology resource\ncenter and class\ndemonstration\n1 unit\nForms (Report and\nEvaluation)\n1 unit\nWork Instructions\n1 unit Different media\nChannels\n(telephone, emails,\nviber, skype)\n1 unit\nWorld Map\n1 unit\nBasic Occupational\nSafety and Health\n1 unit Laser pointer\n1 unit\nTable of\nMeasurement /\nConversion Table\n1 unit\nForeign Exchange\nRates\n1 unit Air-conditioning Unit\n1 unit\nQuality Management\nSystems\n1 unit\nQuality Operation\nManuals\n\n--- PDF PAGE 133 ---\nMTOL SERVICES NC II\n\nPromulgated (12/17/2019)\n\n129\n\n3.5 TRAINING FACILITIES\n\nBased on a class intake of 25 students/trainees\n\nSpace Requirement\nSize in Meters\nArea in Sq. Meters\n\nStudent/Trainee Performance\nSpace (S/TPS)\n\n5 x 8 m.\n\n43 sq. m.\n\nTechnology Resource Center (TRC)\n\n2 x 5 m.\n\n10 sq. m.\n\nCirculation Area\n\n(S/TPS+PSR+TRC+\nCR) X 30%\n(40+6+10+10) X\n30%=19.8sq.m.)\n\n23 sq. m.\n\nSeparate Restrooms for Male and\nFemale Trainees/ Students (CR)\n\n2 x 5 m.\n\n10 sq. m.\n\nTotal Workshop\nArea\n\n86 sq. m.\n\n3.6 TRAINER’S QUALIFICATION FOR MULTIMODAL TRANSPORT OPERATION AND\nLOGISTICS SERVICES (SEAFREIGHT IMPORT) NCII\n\n• Must be a holder of NTTC I in Multimodal Transport Operation and Logistics\n(Seafreight Import) Services NCII.\n• Must have at least 2 years job / freight forwarding documentation services experience\n\n3.7 INSTITUTIONAL ASSESSMENT\n\nInstitutional assessment is undertaken by trainees to determine their achievement\nof units of competency. A certificate of achievement is issued for each unit of\ncompetency.\n\n1 unit\nAV Equipment\n1 unit\nShipping lines\nschedule\n1 unit\nEnvironmental Laws\n1 unit\nSound System\n\n1 unit\nLocal Regulations\n(BOC, DENR, LTFRB,\nDTI, etc.)\n\n1 unit\nAgency contracts /\nagreements\n\n1 unit\nTransport Tariff (e.g.\nDestination, Origin)\n\n--- PDF PAGE 134 ---\nMTOL SERVICES NC II\n\nPromulgated (12/17/2019)\n\n130\nSECTION 4 ASSESSSMENT AND CERTIFICATION ARRANGEMENT\n\nCompetency Assessment is the process of collecting evidence and making judgments\nwhether competency has been achieved. The purpose of assessment is to confirm that an\nindividual can perform to the standards expected at the workplace as expressed in relevant\ncompetency standards.\nThe assessment process is based on evidence or information gathered to prove\nachievement of competencies. The process may be applied to an employable unit(s) of\ncompetency in partial fulfillment of the requirements of the national qualification.\n\n4.1 NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1.1 A National Certificate (NC) is issued when a candidate has demonstrated\ncompetence in all unit/s of competency of a qualification with a promulgated\nTraining Regulations.\n4.1.2 A Certificate of Competency (COC) is issued by the Authority to individuals who\nWere assessed as competent in a single unit or cluster of related units of\ncompetency.\n\nCOC1 Perform seafreight import documentation services\n Perform industry calculation in freight forwarding and documentation\nservices\n Process transport documents for import cargo\n Prepare request for payment and billings\n Prepare and complete statistical reports\n Process shipping documents\n\nCOC 2 Liaise with relevant stakeholders\n Address bottlenecks and work disruptions\n\n4.1.3 Individuals wanting to be certified will have to be assessed in accordance with the\nrequirements identified in the evidence guide of the relevant unit/s of competency.\n\n4.1.4 Recognition of Prior Learning (RPL). Candidates who have gained competencies\nthrough education, informal training, previous work or life experiences may apply\nfor recognition in a particular qualification through competency assessment.\n\n 4.1.4 The following are qualified to apply for assessment:\n\n4.1.4.1 Graduating students/trainees of NTR programs or graduates of\nformal/non-formal/informal including enterprise-based trainings related to\nmultimodal transport operations and logistics services.\n\n4.1.4.2 Industry workers in the multimodal transport operations and logistics\nservices.\n\n--- PDF PAGE 135 ---\nMTOL SERVICES NC II\n\nPromulgated (12/17/2019)\n\n131\n 4.1.5 The industry shall determine assessment and certification requirements for each\nqualification with promulgated Training Regulations. It includes the following:\na. Entry requirements for candidates\nb. Evidence gathering methods\nc. Qualification requirements of competency assessors\nd. Specific assessment and certification arrangements as identified by industry\n\n4.2 COMPETENCY ASSESSMENT REQUISITE\n4.2.1 Self-Assessment Guide. The self-assessment guide (SAG) is accomplished by\nthe candidate prior to actual competency assessment. SAG is a pre-assessment\ntool to help the candidate and the assessor determine what evidence is available,\nwhere gaps exist, including readiness for assessment.\n\n This document can:\na. Identify the candidate’s skills and knowledge\nb. Highlight gaps in candidate’s skills and knowledge\nc. Provide critical guidance to the assessor and candidate on the evidence that\nneed to be presented\nd. Assist the candidate to identify key areas in which practice is needed or\nadditional information or skills that should be gained prior `\n4.2.2 Accredited Assessment Center. Only Assessment Center accredited by\nTESDA is authorized to conduct competency assessment. Assessment centers\nundergo a quality assured procedure for accreditation before they are authorized\nby TESDA to manage the assessment for National Certification.\n4.2.3 Accredited Competency Assessor. Only accredited competency assessor is\nauthorized to conduct assessment of competence. Competency assessors\nundergo a quality assured system of accreditation procedure before they are\nauthorized by TESDA to assess the competencies of candidates for National\nCertification.\n\n--- PDF PAGE 136 ---\nMTOL SERVICES NC II\n\nPromulgated (12/17/2019)\n\n132\nCOMPETENCY MAP – TRANSPORT AND LOGISTICS SECTOR\nMULTIMODAL TRANSPORT OPERATIONS AND LOGISTICS (SEAFREIGHT IMPORT) SERVICES NCII\n\n BASIC COMPETENCIES\n\nLead workplace\ncommunication\nLead small\nteams\nApply critical\nthinking and\nproblem-\nsolving\ntechniques in\nthe\nworkplace\n\nWork in a\ndiverse\nenvironment\nPropose\nmethods of\napplying\nlearning and\ninnovation in\nthe\norganization\nUse\ninformation\nsystematically\nEvaluate\noccupational\nsafety and\nhealth work\npractices\n\nEvaluate\nenvironment\nal work\npractices\n\nFacilitate\nentrepreneurial\nskills for micro-\nsmall-medium\nenterprises\n(MSMEs)\n\nReceive and\nrespond to\nworkplace\ncommunication\nWork with\nothers\nSolve/addres\ns routine\nproblems\nEnhance self-\nmanagement\nskills\nSupport\nInnovation\nAccess and\nmaintain\ninformation\nFollow\noccupational\nsafety and\nhealth policies\nand\nprocedures\nApply\nenvironment\nal work\nstandards\nAdopt\nentrepreneurial\nmindset in the\nworkplace\nParticipate in\nworkplace\ncommunication\nWork in\nTeam\nEnvironment\nSolve/address\ngeneral\nworkplace\nproblems\nDevelop\ncareer and life\ndecisions\nContribute\nto workplace\ninnovation\nPresent\nrelevant\ninformation\nPractice\noccupational\nsafety and\nhealth policies\nand\nprocedures\nExercise\nefficient and\neffective\nsustainable\npractices in\nthe\nworkplace\nPractice\nentrepreneurial\nskills in the\nworkplace\n\n--- PDF PAGE 137 ---\nMTOL SERVICES NC II\n\nPromulgated (12/17/2019)\n\n133\n COMMON COMPETENCIES\n\nCORE COMPETENCIES\n\nPerform industry\ncalculation in freight\nforwarding and\ndocumentation services\nProcess transport\ndocuments for import\ncargo\nPrepare request\nfor payment and\nbillings\nPrepare and\ncomplete statistical\nreports\nLiaise with\nrelevant\nstakeholders\nAddress bottlenecks\nand work disruptions\n\nApply freight forwarding\ndocumentation services\nand workplace procedures\nPerform workplace\nsecurity and safety\nProvide effective\ncustomer service\nContribute to quality\nsystem\n\nPerform computer\noperations\n\n--- PDF PAGE 138 ---\nMTOL SERVICES NC II\n\nPromulgated (12/17/2019)\n\n134\nGLOSSARY OF TERMS\n\nAural - Relating to the sense of hearing\n\nBest practices - Commercial or professional procedures accepted as being correct or most\n effective\n\nBottlenecks - A process in a chain of processes with limited capacity reducing maximum\n capacity\n\nCargo stripping - Unloading of contents or cargo from a freight container or tanker\n\nCarrier - A person or company responsible for physical custody of goods and for any loss if any\n\nComputer hardware - Physical parts of a computer system such as keyboard, wire connectors,\n monitor screen, mother board, hard Disk drive , among others.\n\nComputer software - Set of instructions that tells a computer what and how to do a particular\n task ie.programs, applications.\n\nComputer storage - A process or physical station on which digital data is saved or stored\n\nContingency plan - A plan designed to take a possible future event into account; a recovery\n plan.\n\nCustomer service - Assistance or advice provided by a company to its customers\n\nData - Facts or statistics collected together for reference or analysis.\n\nDelivery order - A release document from the buyer, agent, or consignee to another party\n\nEffectiveness - Extent to which actual results have impact to fulfill desired outcomes.\n\nEfficiency - Efficiency means whatever is performed should be done in a perfect way\n likewise reducing wastage\n\nEntrepreneurial - Characterized by the taking of financial risks in the hope of profit;\n enterprising.\n\nErgonomic - Relating to or designed for efficiency and comfort in the working\n environment\n\nEthical - Relating to moral principles\n\nFiduciary - Involving trust, especially with regard to the relationship between the\n trustee and beneficiary\nForms - Business forms used by companies on a standard basis between and\n among management, staff, suppliers and customers\n\n--- PDF PAGE 139 ---\nMTOL SERVICES NC II\n\nPromulgated (12/17/2019)\n\n135\nInnovation - Beliefs and attitudes in going about addressing problems in the\n workplace through new ideas or better ways of doing things\n\nInsurance - Means of protection from financial loss\n\nIntegrate - Combine with one another so that they become a whole to achieve its\n objectives\n\nLegislation - Statutory law or ordinance with order as its core objective\n\nLiaison - Cooperation or communication which facilitates a close working\n relationship between people\n\nParameters- A measureable factor forming one of a set that defines a system or\n sets the condition for a Particular operation\n\nPeripheral devices - Examples are auxiliary devices such as keyboard or printer connected\n to a computer\n\nProtocols - Proper procedure of respect\n\nQuality manual - A document that states a company’s intentions for operating processes\n within a quality Management system\n\nQuarantine - Strict isolation for purposes of preventing spread of a disease from\n people, plants, or animals\n\nRegulatory - Serving or intended to regulate or control something.\n\nSafety - Condition of being protected from unlikely danger, risk, or injury\n\nSecurity threat - Something that may or may not happen but has the potential to cause\n serious damage\n\nTimeline - Agreed deadlines or time frame in which to accomplish a certain task\n\nWork disruption - Any event or circumstance which may create damage or loss to a\n business or operation\n\n--- PDF PAGE 140 ---\nMTOL SERVICES NC II\n\nPromulgated (12/17/2019)\n\n136\n\nACRONYMS\n\nNC 11 - TR\n\nBIR\nBureau of Internal Revenue\nBOC\nBureau of Customs\nCD\nCompact Disc\nDOF\nDepartment of Finance\nDTI\nDepartment of Trade and Industry\nECC\nEnvironmental Clearance Certificate\nEDI\nElectronic Data Interchange\nEHS\nEnvironment, Health and Safety\nETD\nExplosive Trace Detection\nFCL\nFull Container Load\nHR\nHuman Resources\nID\nIdentification\nINCOTERMS\nInternational Commercial Terms\nLCL\nLess Container Load\nMSDS\nMaterial Safety Data Sheet\nOHS\nOccupational Health and Safety\nOS&H\nOccupational Safety & Health\nPPE\nPersonal Protective Equipment\nSRT\nSelf-Regulation Theory\nSWOT\nStrengths, Weaknesses, Opportunities and Threats\nTESDA\nTechnical Education and Skills Development Authority\nTR\nTraining Regulation\n\n--- PDF PAGE 141 ---\nMTOL SERVICES NC II\n\nPromulgated (12/17/2019)\n\n137\nACKNOWLEDGMENT\n\nThe Technical Education and Skills Development Authority (TESDA)\nwishes to extend thanks and appreciation to the many representatives of\nbusiness, industry, academe and government agencies who provided their time\nand expertise to the development and validation of these Training Regulations.\n\nTECHNICAL EXPERTS PANEL\n\nDORIS P. TORRES\nTechnical Expert\nSTAMM International Inc.\nGen. Lim st. Bangkal, Makati City\nCOSME J. NONAN JR.\nTechnical Expert\nCommercial Freight Services Inc.\nIntramuros, Manila\nMARILYN C. ALBERTO\nTechnical Expert\nKintetsu World Express (Phils.) Inc.\nParañaque City\nGEMMA VIDA R. LIBRANDA\nTechnical Expert\nPhilippine\nMultimodal\nTransport\nand\nLogistics 