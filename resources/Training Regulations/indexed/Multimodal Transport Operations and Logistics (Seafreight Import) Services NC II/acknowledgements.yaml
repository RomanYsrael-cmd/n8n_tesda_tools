atical\ninformation.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variable\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1. Carry out\ncalculations\n\n1.1 Volume and weight\nare identified and\ncalculated as\nrequired in\nworkplace tasks\n1.2 Calculations\nneeded to complete\nwork tasks are\nperformed using the\nfour basic\nprocesses of\naddition,\nsubtraction,\nmultiplication and\ndivision or any\nappropriate\n1.3 Calculations\ninvolving fractions,\npercentages and\nmixed numbers,\nand using the four\nbasic processes,\nare performed as\nrequired to\ncomplete\nworkplace\nprocedures\n1.4 The functions of a\ncalculator, numeric\nkeypad or computer\nare used to perform\nmathematical\noperations\n1.1. Basic\nmathematical\noperations\nand\ntechniques\n1.2. Ways of\nrepresenting\nbasic\nmathematical\ninformation\n1.3. Procedures\nfor identifying\nand using\nrelevant\nworkplace\ntechnology\nwhen carrying\nout workplace\ncalculations\n1.4. Typical\nmathematical\nproblems, and\nappropriate\naction and\nsolutions\n1.5. Functions and\nuse of\ncalculator,\nnumeric\nkeypads, and\ncomputer\n\n1.1 Counting of\nitems singly and\nin batches and\nstoring\nnumerically as\nrequired in\nworkplace tasks\n1.2 Performing\nneeded\ncalculations to\ncomplete work\ntasks using the\nfour basic\nprocesses of\naddition,\nsubtraction,\nmultiplication\nand division\n1.3 Performing\ncalculations\ninvolving\nfractions,\npercentages and\nmixed numbers,\nand using the\nfour basic\nprocesses\n1.4 Communicating\neffectively with\nothers when\ncarrying out\nbasic workplace\ncalculations\n\n--- PDF PAGE 64 ---\nTESDA-SOP-QSO-01-F08\nMTOL SERVICES NC II\n\nPromulgated (12/17/2019)\n\n60\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variable\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1.5 Numerical\ninformation is self-\nchecked and\ncorrected for\naccuracy\n\n1.5 Checking and\ncorrecting\nnumerical\ninformation for\naccuracy\n1.6 Reading and\n