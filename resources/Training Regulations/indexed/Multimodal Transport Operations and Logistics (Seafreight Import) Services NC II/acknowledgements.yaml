    {
      "source_text": "5 RANGE OF VARIABLES"
    },
    {
      "source_text": "VARIABLES RANGE 1. Appropriate sources May include: 1.1. Team members 1.2. Supervisor/Department Head 1.3. Suppliers 1.4. Trade personnel 1.5. Local government 1.6. Industry bodies 2. Medium May include but not limited to: 2.1. Memorandum 2.2. Circular 2.3. Notice 2.4. Information dissemination 2.5. Follow-up or verbal instructions 2.6. Face-to-face communication 2.7. Electronic media (disk files, cyberspace) 3. Storage May include: 3.1. Manual filing system 3.2. Computer-based filing system 4. Workplace interactions May include: 4.1. Face-to-face 4.2. Telephone 4.3. Electronic and two-way radio 4.4. Written including electronic means, memos, instruction and forms 4.5. Non-verbal including gestures, signals, signs and diagrams 5. Forms May include but not limited to: 5.1. HR/Personnel forms, telephone message forms, safety reports"
    },
