    {
      "source_text": "1 TRAINING REGULATIONS FOR MULTIMODAL TRANSPORT OPERATION AND LOGISTICS (SEAFREIGHT IMPORT) SERVICES NCII"
    },
    {
      "source_text": "SECTION 1: MULTIMODAL TRANSPORT OPERATION AND LOGISTICS (SEAFREIGHT IMPORT) SERVICES NCII QUALIFICATION"
    },
    {
      "source_text": "The MULTIMODAL TRANSPORT OPERATION AND LOGISTICS SERVICES NCII Qualification consist of competencies that a person must achieve to perform documentation services for multimodal transport operations."
    },
    {
      "source_text": "The Units of Competency comprising this Qualification include the following:"
    },
    {
      "source_text": "BASIC COMPETENCIES UNIT CODE Units of Competency 400311210 Participate in workplace communication 400311211 400311212 400311213 400311214 400311215 400311216 400311217 400311218 Work in a team environment Solve/address general workplace problems Develop career and life decisions Contribute to workplace innovation Present relevant information Practice occupational safety and health policies and procedures Exercise efficient and effective sustainable practices in the workplace Practice entrepreneurial skills in the workplace"
    },
    {
      "source_text": "COMMON COMPETENCIES UNIT CODE Units of Competency MTO491201 Apply freight forwarding documentation services and workplace procedures MTO491202 Perform workplace security and safety MTO491203 Provide effective customer service MTO491204 Contribute to quality system MTO491205 Perform computer operations"
    },
    {
      "source_text": "CORE COMPETENCIES UNIT CODE Units of Competency MTO432301 Perform industry calculation in freight forwarding and documentation services MTO432302 Process transport documents for import cargo MTO432303 Prepare request for payment and billings MTO432304 MTO432305 Prepare and complete statistical reports Process shipping documents MTO432306 Liaise with relevant stakeholders MTO432307 Address bottlenecks and work disruptions"
    },
    {
      "source_text": "A person who has achieved this Qualification is competent to be a: ❑ Documentation Clerk ❑ Liaison Personnel*"
    },
    {
      "source_text": "-- PDF PAGE 6 --- TESDA-SOP-QSO-01-F08 MTOL SERVICES NC II"
    },
    {
      "source_text": "Promulgated (12/17/2019)"
    },
    {
      "source_text": "2 SECTION 2: COMPETENCY STANDARDS"
    },
    {
      "source_text": "This section gives the details of the contents of the units of competency required in MULTIMODAL TRANSPORT OPERATION AND LOGISTICS (SEAFREIGHT IMPORT) SERVICES NCII. These units of competency are categorized into basic, common, core and elective competencies."
    },
    {
      "source_text": "BASIC COMPETENCIES"
    },
    {
      "source_text": "UNIT OF COMPETENCY : PARTICIPATE IN WORKPLACE COMMUNICATION"
    },
    {
      "source_text": "UNIT CODE : 400311210"
    },
    {
      "source_text": "UNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes required to gather, interpret and convey information in response to workplace requirements."
    },
    {
      "source_text": "ELEMENTS PERFORMANCE CRITERIA Italicized terms are elaborated in the Range of Variables"
    },
    {
      "source_text": "REQUIRED KNOWLEDGE"
    },
    {
      "source_text": "REQUIRED SKILLS 1. Obtain and convey workplace information 1.1 Specific and relevant information is accessed from appropriate sources 1.2 Effective questioning, active listening and speaking skills are used to gather and convey information 1.3 Appropriate medium is used to transfer information and ideas 1.4 Appropriate non- verbal communication is used 1.5 Appropriate lines of communication with supervisors and colleagues are identified and followed 1.6 Defined workplace procedures for the location and storage of information are used. 1.7 Personal interaction is carried out clearly and concisely. 1.1 Effective verbal and nonverbal communication 1.2 Different modes of communication 1.3 Medium of communication in the workplace 1.4 Organizational policies 1.5 Communication procedures and systems 1.6 Lines of Communication 1.7 Technology relevant to the enterprise and the individual’s work responsibilities 1.8 Workplace etiquette"
    },
    {
      "source_text": "1.1 Following simple spoken language 1.2 Performing routine workplace duties following simple written notices 1.3 Participating in workplace meetings and discussions 1.4 Preparing work- related documents 1.5 Estimating, calculating and recording routine workplace measures 1.6 Relating/ Interacting with people of various levels in the workplace 1.7 Gathering and providing basic information in response to workplace requirements 1.8 Basic business writing skills 1.9 Interpersonal skills in the workplace 2.0 Active-listening skills"
    },
    {
      "source_text": "-- PDF PAGE 7 --- TESDA-SOP-QSO-01-F08 MTOL SERVICES NC II"
    },
    {
      "source_text": "Promulgated (12/17/2019)"
    },
    {
      "source_text": "3"
    },
    {
      "source_text": "ELEMENTS PERFORMANCE CRITERIA Italicized terms are elaborated in the Range of Variables"
    },
    {
      "source_text": "REQUIRED KNOWLEDGE"
    },
    {
      "source_text": "REQUIRED SKILLS 2. Perform duties following workplace instructions 2.1 Written notices and instructions are read and interpreted in accordance with organizational guidelines 2.2 Routine written instruction are followed based on established procedures 2.3 Feedback is given to workplace supervisor based instructions/ information received 2.4 Workplace interactions are conducted in a courteous manner 2.5 Where necessary, clarifications about routine workplace procedures and matters concerning conditions of employment are sought and asked from appropriate Sources. 2.6 Meetings outcomes are interpreted and implemented"
    },
    {
      "source_text": "2.1 Effective verbal and non-verbal communication 2.2 Different modes of communication 2.3 Medium of communication in the workplace 2.4 Organizational/ Workplace policies 2.5 Communication procedures and systems 2.6 Lines of communication 2.7 Technology relevant to the enterprise and the individual’s work responsibilities 2.8 Effective questioning techniques (clarifying and probing) 2.9 Workplace etiquette"
    },
    {
      "source_text": "2.1 Following simple spoken instructions 2.2 Performing routine workplace duties following simple written notices 2.3 Participating in workplace meetings and discussions 2.4 Completing work- related documents 2.5 Estimating, calculating and recording routine workplace measures 2.6 Relating/ Responding to people of various levels in the workplace 2.7 Gathering and providing information in response to workplace requirements 2.8 Basic questioning/querying 2.9 Skills in reading for information 2.10 Skills in locating"
    },
