    },
    {
      "source_text": "4. Protocols and Formats May include: 4.1 Heirarchial 4.2 Business ethics 4.3 Command responsibility 4.4 Established templates 4.5 E-mail ethics 5. Tools and Equipment May include: 5.1 Computer 5.2 Weighing scale 5.3 Typewriter 5.4 Measuring tools 6. Required Documents"
    },
    {
      "source_text": "May include: 6.1 delivery order 6.2 bank or company guarantee 6.3 container guarantee 6.4 duly endorsed bill of lading 6.5 Validated manifest 7. Work Assignments May include: 7.1 Duties and responsibilities 7.2 Deadlines 7.3 Project work 7.4 Reports"
    },
    {
