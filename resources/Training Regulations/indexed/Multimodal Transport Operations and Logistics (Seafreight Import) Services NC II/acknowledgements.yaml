      "source_text": "59 CORE COMPETENCIES"
    },
    {
      "source_text": "UNIT OF COMPETENCY : PERFORM INDUSTRY CALCULATION IN FREIGHT FORWARDING AND DOCUMENTATION SERVICES"
    },
    {
      "source_text": "UNIT CODE : MTO432301"
    },
    {
      "source_text": "UNIT DESCRIPTOR : This unit involves the skills and knowledge required to carry out basic routine workplace calculations. It specifically includes carrying out required mathematical operations; preparing basic estimates of mass, size and volume; and interpreting basic graphical representations of mathematical information."
    },
    {
      "source_text": "ELEMENT PERFORMANCE CRITERIA Italicized terms are elaborated in the Range of Variable REQUIRED KNOWLEDGE REQUIRED SKILLS 1. Carry out calculations"
    },
    {
      "source_text": "1.1 Volume and weight are identified and calculated as required in workplace tasks 1.2 Calculations needed to complete work tasks are performed using the four basic processes of addition, subtraction, multiplication and division or any appropriate 1.3 Calculations involving fractions, percentages and mixed numbers, and using the four basic processes, are performed as required to complete workplace procedures 1.4 The functions of a calculator, numeric keypad or computer are used to perform mathematical operations 1.1. Basic mathematical operations and techniques 1.2. Ways of representing basic mathematical information 1.3. Procedures for identifying and using relevant workplace technology when carrying out workplace calculations 1.4. Typical mathematical problems, and appropriate action and solutions 1.5. Functions and use of calculator, numeric keypads, and computer"
    },
    {
      "source_text": "1.1 Counting of items singly and in batches and storing numerically as required in workplace tasks 1.2 Performing needed calculations to complete work tasks using the four basic processes of addition, subtraction, multiplication and division 1.3 Performing calculations involving fractions, percentages and mixed numbers, and using the four basic processes 1.4 Communicating effectively with others when carrying out basic workplace calculations"
    },
    {
      "source_text": "-- PDF PAGE 64 --- TESDA-SOP-QSO-01-F08 MTOL SERVICES NC II"
    },
    {
      "source_text": "Promulgated (12/17/2019)"
    },
