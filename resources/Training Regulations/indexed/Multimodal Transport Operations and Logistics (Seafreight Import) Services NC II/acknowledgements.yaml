    {
      "source_text": "94 SECTION 3 TRAINING ARRANGEMENT"
    },
    {
      "source_text": "This set of standards provides Technical and Vocational Education and Training (TVET) providers with information and other important requirements to consider when designing training programs for MULTIMODAL TRANSPORT OPERATION AND LOGISTICS SERVICES (SEAFREIGHT IMPORT) NCII"
    },
    {
      "source_text": "This includes information on curriculum design; training delivery; trainee entry requirements; tools and equipment; training facilities; and trainer’s qualification and institutional assessment."
    },
    {
      "source_text": "3.1 CURRICULUM DESIGN"
    },
    {
      "source_text": "TESDA shall provide the training on the development of competency-based curricula to enable training providers develop their own curricula with the components mentioned below."
    },
    {
      "source_text": "Delivery of knowledge requirements for the basic, common and core units of competency specifically in the areas of mathematics, science/technology, communication/language, environment and other academic subjects shall be contextualized. To this end, TVET providers shall develop a Contextual Learning Matrix (CLM) to include Technology, Science, Math, English/Communication and Safety to Environment. Includes also green technology, issues on health and drugs and cater to person with disabilities (PWD’s)"
    },
    {
      "source_text": "Course Title: MULTIMODAL TRANSPORT OPERATION AND NC Level: NCII LOGISTICS (SEAFREIGHT IMPORT) SERVICES"
    },
    {
      "source_text": "Nominal Training Duration:"
    },
    {
      "source_text": "No. of Hours Coverage 37 Hrs. Basic Competencies 48 Hrs. Common Competencies 62 Hrs. Core Competencies 147 Hrs. 126 Hrs."
    },
    {
      "source_text": "SIL 273 Hrs. Total Course Description:"
    },
    {
      "source_text": "This course is designed to provide the learner with knowledge, practical skills and attitude, applicable in performing industry calculation in freight forwarding and documentation services, processing transport documents for import cargo, preparing request for payment and billings, preparing and completing statistical reports, processing shipping documents, liaising with relevant stakeholders and addressing bottlenecks and work disruptions. This include classroom learning activities and practical work in actual work site or simulation area."
    },
    {
      "source_text": "The training institution has the option to introduce other methodologies to deliver the program or the course and to partner with other individuals/organizations that would be able to provide training resources in the conduct of the course."
    },
    {
      "source_text": "Upon completion of the course, the learners are expected to demonstrate the above- mentioned competencies to be employed. To obtain this, all units prescribed for this qualification must be achieve."
    },
