    {
      "source_text": "7 UNIT OF COMPETENCY: WORK IN TEAM ENVIRONMENT"
    },
    {
      "source_text": "UNIT CODE : 400311211"
    },
    {
      "source_text": "UNIT DESCRIPTOR : This unit covers the skills, knowledge and attitudes to identify one’s roles and responsibilities as a member of a team."
    },
    {
      "source_text": "ELEMENTS PERFORMANCE CRITERIA Italicized terms are elaborated in the Range of Variables"
    },
    {
      "source_text": "REQUIRED KNOWLEDGE"
    },
    {
      "source_text": "REQUIRED SKILLS 1. Describe team role and scope 1.1 The role and objective of the team is identified from available sources of information 1.2 Team parameters, reporting relationships and responsibilities are identified from team discussions and appropriate external sources 1.1 Group structure 1.2 Group development 1.3 Sources of information 1.1 Communicating with others, appropriately consistent with the culture of the workplace 1.2 Developing ways in improving work structure and performing respective roles in the group or organization 2. Identify one’s role and responsibility within a team 2.1 Individual roles and responsibilities within the team environment are identified 2.2 Roles and objectives of the team is identified from available sources of information 2.3 Team parameters, reporting relationships and responsibilities are identified based on team discussions and appropriate external sources 2.1 Team roles and objectives 2.2 Team structure and parameters 2.3 Team development 2.4 Sources of information"
    },
    {
      "source_text": "2.1 Communicating with others, appropriately consistent with the culture of the workplace 2.2 Developing ways in improving work structure and performing respective roles in the group or organization"
    },
    {
      "source_text": "-- PDF PAGE 12 --- TESDA-SOP-QSO-01-F08 MTOL SERVICES NC II"
    },
    {
      "source_text": "Promulgated (12/17/2019)"
    },
    {
      "source_text": "8"
    },
    {
      "source_text": "ELEMENTS PERFORMANCE CRITERIA Italicized terms are elaborated in the Range of Variables"
    },
    {
      "source_text": "REQUIRED KNOWLEDGE"
    },
    {
      "source_text": "REQUIRED SKILLS 3. Work as a team member 3.1 Effective and appropriate forms of communications are used and interactions undertaken with team members based on company practices. 3.2 Effective and appropriate contributions made to complement team activities and objectives, based on workplace context 3.3 Protocols in reporting are observed based on standard company practices. 3.4 Contribute to the development of team work plans based on an understanding of team’s role and objectives"
    },
    {
      "source_text": "3.1 Communication Process 3.2 Workplace communication protocol 3.3 Team planning and decision making 3.4 Team thinking 3.5 Team roles 3.6 Process of team development 3.7 Workplace context"
    },
    {
      "source_text": "3.1 Communicating appropriately, consistent with the culture of the workplace 3.2 Interacting effectively with others 3.3 Deciding as an individual and as a group using group think strategies and techniques 3.4 Contributing to Resolution of issues and concerns"
    },
    {
      "source_text": "-- PDF PAGE 13 --- TESDA-SOP-QSO-01-F08 MTOL SERVICES NC II"
    },
    {
      "source_text": "Promulgated (12/17/2019)"
    },
    {
      "source_text": "9 RANGE OF VARIABLES"
    },
    {
      "source_text": "VARIABLE RANGE 1. Role and objective of team May include: 1.1. Work activities in a team environment with enterprise or specific sector 1.2. Limited discretion, initiative and judgement maybe demonstrated on the job, either individually or in a team environment 2. Sources of information May include: 2.1. Standard operating and/or other workplace procedures 2.2. Job procedures 2.3. Machine/equipment manufacturer’s specifications and instructions 2.4. Organizational or external personnel 2.5. Client/supplier instructions 2.6. Quality standards 2.7. OHS and environmental standards 3. Workplace context May include: 3.1. Work procedures and practices 3.2. Conditions of work environments 3.3. Legislation and industrial agreements 3.4. Standard work practice including the storage, safe handling and disposal of chemicals 3.5. Safety, environmental, housekeeping and quality guidelines"
    },
    {
      "source_text": "-- PDF PAGE 14 --- TESDA-SOP-QSO-01-F08 MTOL SERVICES NC II"
    },
    {
      "source_text": "Promulgated (12/17/2019)"
    },
    {
      "source_text": "10 EVIDENCE GUIDE"
    },
    {
      "source_text": "1. Critical aspects of Competency Assessment requires evidence that the candidate: 1.1. Worked in a team to complete workplace activity 1.2. Worked effectively with others 1.3. Conveyed information in written or oral form 1.4. Selected and used appropriate workplace language 1.5. Followed designated work plan for the job 2. Resource Implications The following resources should be provided: 2.1. Access to relevant workplace or appropriately simulated environment where assessment can take place 2.2. Materials relevant to the proposed activity or tasks 3. Methods of Assessment Competency in this unit may be assessed through: 3.1. Role play involving the participation of individual member to the attainment of organizational goal 3.2 Case studies and scenarios as a basis for discussion of issues and strategies in teamwork 3.3 Socio-drama and socio-metric methods 3.4 Sensitivity techniques 3.5 Written Test 4. Context for Assessment 4.1. Competency may be assessed in workplace or in a simulated workplace setting 4.2. Assessment shall be observed while task are being undertaken whether individually or in group"
    },
    {
      "source_text": "-- PDF PAGE 15 --- TESDA-SOP-QSO-01-F08 MTOL SERVICES NC II"
    },
    {
      "source_text": "Promulgated (12/17/2019)"
    },
    {
      "source_text": "11 UNIT OF COMPETENCY : SOLVE/ADDRESS GENERAL WORKPLACE PROBLEMS"
    },
    {
      "source_text": "UNIT CODE : 400311212"
    },
    {
      "source_text": "UNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes required to apply problem-solving techniques to determine the origin of problems and plan for their resolution. It also includes addressing procedural problems through documentation, and referral."
    },
    {
      "source_text": "ELEMENTS PERFORMANCE CRITERIA Italicized terms are elaborated in the Range of Variables"
    },
    {
      "source_text": "REQUIRED KNOWLEDGE"
    },
    {
      "source_text": "REQUIRED SKILLS 1. Identify routine problems 1.1 Routine problems or procedural problem areas are identified 1.2 Problems to be investigated are defined and determined 1.3 Current conditions of the problem are identified and documented 1.1 Current industry hardware and software products and services 1.2 Industry maintenance, service and helpdesk practices, processes and procedures 1.3 Industry standard diagnostic tools 1.4 Malfunctions and resolutions"
    },
    {
      "source_text": "1.1 Identifying current industry hardware and software products and services 1.2 Identifying current industry maintenance, services and helpdesk practices, processes and procedures. 1.3 Identifying current industry standard diagnostic tools 1.4 Describing common malfunctions and resolutions. 1.5 Determining the root cause of a routine malfunction"
    },
    {
      "source_text": "-- PDF PAGE 16 --- TESDA-SOP-QSO-01-F08 MTOL SERVICES NC II"
    },
    {
      "source_text": "Promulgated (12/17/2019)"
    },
    {
      "source_text": "12"
    },
    {
      "source_text": "ELEMENTS PERFORMANCE CRITERIA Italicized terms are elaborated in the Range of Variables"
    },
    {
      "source_text": "REQUIRED KNOWLEDGE"
    },
    {
      "source_text": "REQUIRED SKILLS 2. Look for solutions to routine problems 2.1 Potential solutions to problem are identified 2.2 Recommendatio ns about possible solutions are developed, documented, ranked and presented to appropriate person for decision 2.1 Current industry hardware and software products and services 2.2 Industry service and helpdesk practices, processes and procedures 2.3 Operating systems 2.4 Industry standard diagnostic tools 2.5 Malfunctions and resolutions. 2.6 Root cause analysis 2.1 Identifying current industry hardware and software products and services 2.2 Identifying services and helpdesk practices, processes and procedures. 2.3 Identifying operating system 2.4 Identifying current industry standard diagnostic tools 2.5 Describing common malfunctions and resolutions. 2.6 Determining the root cause of a routine malfunction 3. Recommend solutions to problems 3.1 Implementation of solutions are planned 3.2 Evaluation of implemented solutions are planned 3.3 Recommended solutions are documented and submit to appropriate person for confirmation 3.1 Standard procedures 3.2 Documentation produce 3.1 Producing documentation that recommends solutions to problems 3.2 Following established procedures"
    },
    {
      "source_text": "-- PDF PAGE 17 --- TESDA-SOP-QSO-01-F08 MTOL SERVICES NC II"
    },
    {
      "source_text": "Promulgated (12/17/2019)"
    },
    {
      "source_text": "13 RANGE OF VARIABLES"
    },
    {
      "source_text": "VARIABLE RANGE 1. Problems/Procedural Problem"
    },
    {
      "source_text": "May include: 1.1 Routine/non – routine processes and quality problems 1.2 Equipment selection, availability and failure 1.3 Teamwork and work allocation problem 1.4 Safety and emergency situations and incidents 1.5 Work-related problems outside of own work area"
    },
    {
      "source_text": "2. Appropriate person May include: 2.1 Supervisor or manager 2.2 Peers/work colleagues 2.3 Other members of the organization 3. Document"
    },
    {
      "source_text": "May include: 3.1 Electronic mail 3.2 Briefing notes 3.3 Written report 3.4 Evaluation report 4. Plan"
    },
    {
      "source_text": "May include: 4.1 Priority requirements 4.2 Co-ordination and feedback requirements 4.3 Safety requirements 4.4 Risk assessment 4.5 Environmental requirements"
    },
    {
      "source_text": "-- PDF PAGE 18 --- TESDA-SOP-QSO-01-F08 MTOL SERVICES NC II"
    },
    {
      "source_text": "Promulgated (12/17/2019)"
    },
    {
      "source_text": "14 EVIDENCE GUIDE"
    },
    {
      "source_text": "1. Critical aspects of Competency Assessment requires evidence that the candidate: 1.1 Determined the root cause of a routine problem 1.2 Identified solutions to procedural problems. 1.3 Produced documentation that recommends solutions to problems. 1.4 Followed established procedures. 1.5 Referred unresolved problems to support persons."
    },
    {
      "source_text": "2. Resource Implications 2.1. Assessment will require access to a workplace over an extended period, or a suitable method of gathering evidence of operating ability over a range of situations. 3. Methods of Assessment Competency in this unit may be assessed through: 3.1 Case Formulation 3.2 Life Narrative Inquiry 3.3 Standardized test The unit will be assessed in a holistic manner as is practical and may be integrated with the assessment of other relevant units of competency. Assessment will occur over a range of situations, which will include disruptions to normal, smooth operation. Simulation may be required to allow for timely assessment of parts of this unit of competency. Simulation should be based on the actual workplace and will include walk through of the relevant competency components. 4. Context for Assessment 4.1 Competency may be assessed individually in the actual workplace or simulation environment in TESDA accredited institutions."
    },
    {
      "source_text": "-- PDF PAGE 19 --- TESDA-SOP-QSO-01-F08 MTOL SERVICES NC II"
    },
    {
      "source_text": "Promulgated (12/17/2019)"
    },
    {
      "source_text": "15 UNIT OF COMPETENCY : DEVELOP CAREER AND LIFE DECISIONS"
    },
    {
      "source_text": "UNIT CODE : 400311213"
    },
    {
      "source_text": "UNIT DESCRIPTOR : This unit covers the knowledge, skills, and attitudes in managing one’s emotions, developing reflective practice, and boosting self- confidence and developing self-regulation."
    },
    {
      "source_text": "ELEMENT PERFORMANCE CRITERIA Italicized terms are elaborated in the Range of Variables REQUIRED KNOWLEDGE REQUIRED SKILLS 1. Manage one’s emotion 1.1 Self-management strategies are identified 1.2 Skills to work independently and to show initiative, to be conscientious, and persevering in the face of setbacks and frustrations are developed 1.3 Techniques for effectively handling negative emotions and unpleasant situation in the workplace are examined"
    },
    {
      "source_text": "1.1 Self-management strategies that assist in regulating behavior and achieving personal and learning goals (e.g. Nine self- management strategies according to Robert Kelley) 1.2 Enablers and barriers in achieving personal and career goals 1.3 Techniques in handling negative emotions and unpleasant situation in the workplace such as frustration, anger, worry, anxiety, etc. 1.1 Managing properly one’s emotions and recognizing situations that cannot be changed and accept them and remain professional 1.2 Developing self- discipline, working independently and showing initiative to achieve personal and career goals 1.3 Showing confidence, and resilience in the face of setbacks and frustrations and other negative emotions and unpleasant situations in the workplace"
    },
    {
      "source_text": "-- PDF PAGE 20 --- TESDA-SOP-QSO-01-F08 MTOL SERVICES NC II"
    },
    {
      "source_text": "Promulgated (12/17/2019)"
    },
    {
      "source_text": "16 ELEMENT PERFORMANCE CRITERIA Italicized terms are elaborated in the Range of Variables REQUIRED KNOWLEDGE REQUIRED SKILLS 2. Develop reflective practice 2.1 Personal strengths and achievements, based on self- assessment strategies and teacher feedback are contemplated 2.2 Progress when seeking and responding to feedback from teachers to assist them in consolidating strengths addressing weaknesses and fulfilling their potential are monitored 2.3 Outcomes of personal and academic challenges by reflecting on previous problem solving and decision making strategies and feedback from peers and teachers are predicted 2.1 Basic SWOT analysis 2.2 Strategies to improve one’s attitude in the workplace 2.3 Gibbs’ Reflective Cycle/Model (Description, Feelings, Evaluation, Analysis, Conclusion, and Action plan) 2.1 Using the basic SWOT analysis as self- assessment strategy 2.2 Developing reflective practice through realization of limitations, likes/ dislikes; through showing of self- confidence 2.3 Demonstrating self-acceptance and being able to accept challenges"
    },
    {
      "source_text": "3. Boost self- confidence and develop self- regulation 3.1 Efforts for continuous self-improvement are demonstrated 3.2 Counter-productive tendencies at work are eliminated 3.3 Positive outlook in life are maintained. 3.1 Four components of self-regulation based on Self- Regulation Theory (SRT) 3.2 Personality development concepts 3.3 Self-help concepts (e. g., 7 Habits by Stephen Covey, transactional analysis, psycho- spiritual concepts) 3.1 Performing effective communication skills – reading, writing, conversing skills 3.2 Showing affective skills – flexibility, adaptability, etc. 3.3 Self-assessment for determining one’s strengths and weaknesses"
    },
    {
      "source_text": "-- PDF PAGE 21 --- TESDA-SOP-QSO-01-F08 MTOL SERVICES NC II"
    },
    {
      "source_text": "Promulgated (12/17/2019)"
    },
    {
      "source_text": "17 RANGE OF VARIABLES"
    },
    {
      "source_text": "VARIABLE RANGE 1. Self-management strategies May include: 1.1 Seeking assistance in the form of job coaching or mentoring 1.2 Continuing dialogue to tackle workplace grievances 1.3 Collective negotiation/bargaining for better working conditions 1.4 Share your goals to improve with a trusted co-worker or supervisor 1.5 Make a negativity log of every instance when you catch yourself complaining to others 1.6 Make lists and schedules for necessary activities 2. Unpleasant situation May include: 2.1 Job burn-out 2.2 Drug dependence 2.3 Sulking"
    },
    {
      "source_text": "EVIDENCE GUIDE"
    },
    {
      "source_text": "1. Critical aspects of Competency Assessment requires evidence that the candidate: 1.1 Express emotions appropriately 1.2 Work independently and show initiative 1.3 Consistently demonstrate self-confidence and self-discipline 2. Resource Implications The following resources should be provided: 2.1. Access to workplace and resource s 2.2. Case studies 3. Methods of Assessment Competency in this unit may be assessed through: 3.1. Demonstration or simulation with oral questioning 3.2. Case problems involving work improvement and sustainability issues 3.3. Third-party report 4. Context for Assessment 4.1. Competency assessment may occur in workplace or any appropriately simulated environment"
    },
    {
      "source_text": "-- PDF PAGE 22 --- TESDA-SOP-QSO-01-F08 MTOL SERVICES NC II"
    },
    {
      "source_text": "Promulgated (12/17/2019)"
    },
    {
      "source_text": "18 UNIT OF COMPETENCY : CONTRIBUTE TO WORKPLACE INNOVATION"
    },
    {
      "source_text": "UNIT CODE : 400311214"
    },
    {
      "source_text": "UNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes required to make a pro-active and positive contribution to workplace innovation."
    },
    {
      "source_text": "ELEMENTS PERFORMANCE CRITERIA Italicized terms are elaborated in the Range of Variables"
    },
    {
      "source_text": "REQUIRED KNOWLEDGE"
    },
    {
      "source_text": "REQUIRED SKILLS 1. Identify opportunities to do things better 1.1 Opportunities for improvement are identified proactively in own area of work. 1.2 Information are gathered and reviewed which may be relevant to ideas and which might assist in gaining support for idea. 1.1 Roles of individuals in suggesting and making improvements. 1.2 Positive impacts and challenges in innovation. 1.3 Types of changes and responsibility. 1.4 Seven habits of highly effective people."
    },
    {
      "source_text": "1.1 Identifying opportunities to improve and to do things better. Involvement. 1.2 Identifying the positive impacts and the challenges of change and innovation. 1.3 Identifying examples of the types of changes that are within and outside own scope of responsibility 2. Discuss and develop ideas with other 2.1 People who could provide input to ideas for improvements are identified. 2.2 Ways of approaching people to begin sharing ideas are selected. 2.3 Meeting is set with relevant people. 2.4 Ideas for follow up are review and selected based on feedback. 2.5 Critical inquiry method is used to discuss and develop ideas with others. 2.1 Roles of individuals in suggesting and making improvements. 2.2 Positive impacts and challenges in innovation. 2.3 Types of changes and responsibility. 2.4 Seven habits of highly effective people."
    },
    {
      "source_text": "2.1 Identifying opportunities to improve and to do things better. Involvement. 2.2 Identifying the positive impacts and the challenges of change and innovation. 2.3 Providing examples of the types of changes that are within and outside own scope of responsibility 2.4 Communicating ideas for change through small group discussions and meetings."
    },
    {
      "source_text": "-- PDF PAGE 23 --- TESDA-SOP-QSO-01-F08 MTOL SERVICES NC II"
    },
    {
      "source_text": "Promulgated (12/17/2019)"
    },
    {
      "source_text": "19"
    },
    {
      "source_text": "ELEMENTS PERFORMANCE CRITERIA Italicized terms are elaborated in the Range of Variables"
    },
    {
      "source_text": "REQUIRED KNOWLEDGE"
    },
    {
      "source_text": "REQUIRED SKILLS 3. Integrate ideas for change in the workplace 3.1 Critical inquiry method is used to integrate different ideas for change of key people. 3.2 Summarizing, analyzing and generalizing skills are used to extract salient points in the pool of ideas. 3.3 Reporting skills are likewise used to communicate results. 3.4 Current Issues and concerns on the systems, processes and procedures, as well as the need for simple innovative practices are identified. 3.1 Roles of individuals in suggesting and making improvements. 3.2 Positive impacts and challenges in innovation. 3.3 Types of changes and responsibility. 3.4 Seven habits of highly effective people. 3.5 Basic research skills. 3.1 Identifying opportunities to improve and to do things better. Involvement. 3.2 Identifying the positive impacts and the challenges of change and innovation. 3.3 Providing examples of the types of changes that are within and outside own scope of responsibility. 3.4 Communicating ideas for change through small group discussions and meetings. 3.5 Demonstrating skills in analysis and interpretation of data."
    },
    {
      "source_text": "-- PDF PAGE 24 --- TESDA-SOP-QSO-01-F08 MTOL SERVICES NC II"
    },
    {
      "source_text": "Promulgated (12/17/2019)"
    },
    {
      "source_text": "20 RANGE OF VARIABLES"
    },
    {
      "source_text": "VARIABLE RANGE 1. Opportunities for improvement May include: 1.1 Systems. 1.2 Processes. 1.3 Procedures. 1.4 Protocols. 1.5 Codes. 1.6 Practices. 2. Information May include: 2.1 Workplace communication problems. 2.2 Performance evaluation results. 2.3 Team dynamics issues and concerns. 2.4 Challenges on return of investment 2.5 New tools, processes and procedures. 2.6 New people in the organization. 3. People who could provide input May include: 3.1 Leaders. 3.2 Managers. 3.3 Specialists. 3.4 Associates. 3.5 Researchers. 3.6 Supervisors. 3.7 Staff. 3.8 Consultants (external) 3.9 People outside the organization in the same field or similar expertise/industry. 3.10 Clients 4. Critical inquiry method May include: 4.1 Preparation. 4.2 Discussion. 4.3 Clarification of goals. 4.4 Negotiate towards a Win-Win outcome. 4.5 Agreement. 4.6 Implementation of a course of action. 4.7 Effective verbal communication. See our pages: Verbal Communication and Effective Speaking. 4.8 Listening. 4.9 Reducing misunderstandings is a key part of effective negotiation. 4.10 Rapport Building. 4.11 Problem Solving. 4.12 Decision Making. 4.13 Assertiveness. 4.14 Dealing with Difficult Situations."
    },
    {
      "source_text": "-- PDF PAGE 25 --- TESDA-SOP-QSO-01-F08 MTOL SERVICES NC II"
    },
    {
      "source_text": "Promulgated (12/17/2019)"
    },
    {
      "source_text": "21 VARIABLE RANGE 5. Reporting skills May include: 5.1 Data management. 5.2 Coding. 5.3 Data analysis and interpretation. 5.4 Coherent writing. 5.5 Speaking."
    },
    {
      "source_text": "EVIDENCE GUIDE"
    },
    {
      "source_text": "1. Critical aspects of Competency Assessment requires evidence that the candidate: 1.1 Identified opportunities to do things better. 1.2 Discussed and developed ideas with others on how to contribute to workplace innovation. 1.3 Integrated ideas for change in the workplace. 1.4 Analyzed and reported rooms for innovation and learning in the workplace. 2. Resource Implications The following resources should be provided: 2.1 Pens, papers and writing implements. 2.2 Cartolina. 2.3 Manila papers. 3. Methods of Assessment Competency in this unit may be assessed through: 3.1 Psychological and behavioral Interviews. 3.2 Performance Evaluation. 3.3 Life Narrative Inquiry. 3.4 Review of portfolios of evidence and third-party workplace reports of on-the-job performance. 3.5 Sensitivity analysis. 3.6 Organizational analysis. 3.7 Standardized assessment of character strengths and virtues applied. 4. Context for Assessment 4.1 Competency may be assessed individually in the actual workplace or simulation environment in TESDA accredited institutions."
    },
    {
      "source_text": "-- PDF PAGE 26 --- TESDA-SOP-QSO-01-F08 MTOL SERVICES NC II"
    },
    {
      "source_text": "Promulgated (12/17/2019)"
    },
    {
      "source_text": "22 UNIT OF COMPETENCY : PRESENT RELEVANT INFORMATION"
    },
    {
      "source_text": "UNIT CODE : 400311215"
    },
    {
      "source_text": "UNIT DESCRIPTOR : This unit of covers the knowledge, skills and attitudes required to present data/information appropriately."
