    {
      "source_text": "6 EVIDENCE GUIDE"
    },
    {
      "source_text": "1. Critical aspects of Competency Assessment requires evidence that the candidate: 1.1 Prepared written communication following standard format of the organization 1.2 Accessed information using workplace communication equipment/systems 1.3 Made use of relevant terms as an aid to transfer information effectively 1.4 Conveyed information effectively adopting formal or informal communication 2. Resource Implications The following resources should be provided: 2.1 Fax machine 2.2 Telephone 2.3 Notebook 2.4 Writing materials 2.5 Computer with Internet connection 3. Methods of Assessment Competency in this unit may be assessed through: 3.1 Demonstration with oral questioning 3.2 Interview 3.3 Written test 3.4 Third-party report 4. Context for Assessment 4.1 Competency may be assessed individually in the actual workplace or through an accredited institution"
    },
