      "source_text": "134 GLOSSARY OF TERMS"
    },
    {
      "source_text": "Aural - Relating to the sense of hearing"
    },
    {
      "source_text": "Best practices - Commercial or professional procedures accepted as being correct or most effective"
    },
    {
      "source_text": "Bottlenecks - A process in a chain of processes with limited capacity reducing maximum capacity"
    },
    {
      "source_text": "Cargo stripping - Unloading of contents or cargo from a freight container or tanker"
    },
    {
      "source_text": "Carrier - A person or company responsible for physical custody of goods and for any loss if any"
    },
    {
      "source_text": "Computer hardware - Physical parts of a computer system such as keyboard, wire connectors, monitor screen, mother board, hard Disk drive , among others."
    },
    {
      "source_text": "Computer software - Set of instructions that tells a computer what and how to do a particular task ie.programs, applications."
    },
    {
      "source_text": "Computer storage - A process or physical station on which digital data is saved or stored"
    },
    {
      "source_text": "Contingency plan - A plan designed to take a possible future event into account; a recovery plan."
    },
    {
      "source_text": "Customer service - Assistance or advice provided by a company to its customers"
    },
    {
      "source_text": "Data - Facts or statistics collected together for reference or analysis."
    },
    {
      "source_text": "Delivery order - A release document from the buyer, agent, or consignee to another party"
    },
    {
      "source_text": "Effectiveness - Extent to which actual results have impact to fulfill desired outcomes."
    },
    {
      "source_text": "Efficiency - Efficiency means whatever is performed should be done in a perfect way likewise reducing wastage"
    },
    {
      "source_text": "Entrepreneurial - Characterized by the taking of financial risks in the hope of profit; enterprising."
    },
    {
      "source_text": "Ergonomic - Relating to or designed for efficiency and comfort in the working environment"
    },
    {
      "source_text": "Ethical - Relating to moral principles"
    },
    {
      "source_text": "Fiduciary - Involving trust, especially with regard to the relationship between the trustee and beneficiary Forms - Business forms used by companies on a standard basis between and among management, staff, suppliers and customers"
    },
    {
      "source_text": "-- PDF PAGE 139 --- MTOL SERVICES NC II"
    },
    {
      "source_text": "Promulgated (12/17/2019)"
    },
    {
      "source_text": "135 Innovation - Beliefs and attitudes in going about addressing problems in the workplace through new ideas or better ways of doing things"
    },
    {
      "source_text": "Insurance - Means of protection from financial loss"
    },
    {
      "source_text": "Integrate - Combine with one another so that they become a whole to achieve its objectives"
    },
    {
      "source_text": "Legislation - Statutory law or ordinance with order as its core objective"
    },
    {
      "source_text": "Liaison - Cooperation or communication which facilitates a close working relationship between people"
    },
    {
      "source_text": "Parameters- A measureable factor forming one of a set that defines a system or sets the condition for a Particular operation"
    },
    {
      "source_text": "Peripheral devices - Examples are auxiliary devices such as keyboard or printer connected to a computer"
    },
    {
      "source_text": "Protocols - Proper procedure of respect"
    },
    {
      "source_text": "Quality manual - A document that states a company’s intentions for operating processes within a quality Management system"
    },
    {
      "source_text": "Quarantine - Strict isolation for purposes of preventing spread of a disease from people, plants, or animals"
    },
    {
      "source_text": "Regulatory - Serving or intended to regulate or control something."
    },
    {
      "source_text": "Safety - Condition of being protected from unlikely danger, risk, or injury"
    },
    {
      "source_text": "Security threat - Something that may or may not happen but has the potential to cause serious damage"
    },
    {
      "source_text": "Timeline - Agreed deadlines or time frame in which to accomplish a certain task"
    },
    {
      "source_text": "Work disruption - Any event or circumstance which may create damage or loss to a business or operation"
    },
