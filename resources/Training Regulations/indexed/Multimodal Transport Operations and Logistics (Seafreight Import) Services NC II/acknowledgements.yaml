    },
    {
      "source_text": "1.1. Means of determining requirements of task 1.2. Method of selecting appropriate hardware and software according to task assigned and required outcome 1.3. Manner of planning task to ensure OSH guidelines and procedures are followed 1.4. Basic ergonomics of keyboard and computer use 1.5. Main types of computers and basic features of different operating systems 1.6. Main parts of a computer 1.7. Storage devices and basic categories of memory 1.8. Relevant types of software"
