    },
    {
      "source_text": "2.1 Improvements to work processes are tested and evaluated 2.2 Evaluation of improvements to work processes are checked for improvement outcomes and compliance with workplace requirements"
    },
    {
      "source_text": "2.1 Methods of testing and evaluating improvements to work processes 2.2 Steps and procedures of checking for improvement outcomes and compliance with workplace requirements 2.3 Typical quality- related problems that may arise in work operations and products, and related options for action and solutions 2.1 Testing Improvements to work processes 2.2 Evaluating improvements to work processes 2.3 Checking for improvement outcomes and compliance with workplace requirements 2.4 Reporting and/or rectifying any identified quality- related problems in accordance with workplace procedure s 3. Implement improvements"
    },
    {
      "source_text": "3.1 Improvement initiatives tested and confirmed as successful are implemented in accordance with enterprise procedures 3.2 Work is completed in accordance with workplace procedure 3.1 Methods of implementing a tested and confirmed Improvement initiative 3.2 Impact of job on enterprise and individual performance 3.3 Ways of completing work in accordance with workplace procedure 3.4 Workplace quality assurance and improvement principles and procedure"
    },
    {
      "source_text": "3.1 Implementing a successful tested and confirmed Improvement initiative in accordance with enterprise procedures 3.2 Completing work in accordance with workplace procedure 3.3 Completing documentation related to quality procedures and standards 3.4 Reporting and/or rectifying any identified quality- related problems in accordance with workplace procedures"
    },
    {
