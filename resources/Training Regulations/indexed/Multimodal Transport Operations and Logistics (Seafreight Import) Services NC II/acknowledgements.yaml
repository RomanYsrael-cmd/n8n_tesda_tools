    },
    {
      "source_text": "REQUIRED SKILLS 3. Complete relevant work- related documents 3.1 Range of forms relating to conditions of employment are completed accurately and legibly 3.2 Workplace data is recorded on standard workplace forms and documents 3.3 Errors in recording information on forms/ documents are identified and acted upon 3.4 Reporting requirements to supervisor are completed according to organizational guidelines 3.1 Effective verbal and non-verbal communication 3.2 Different modes of communication 3.3 Workplace forms and documents 3.4 Organizational/ Workplace policies 3.5 Communication procedures and systems 3.6 Technology relevant to the enterprise and the individual’s work responsibilities"
    },
    {
      "source_text": "3.1 Completing work- related documents 3.2 Applying operations of addition, subtraction, division and multiplication 3.3 Gathering and providing information in response to workplace requirements 3.4 Effective record keeping skills"
    },
    {
