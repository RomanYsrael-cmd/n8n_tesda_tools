      "term": "1. Paver",
      "definition": "Refers to equipment used to lay concrete or asphalt materials 2. Ready mixed concrete and / or asphalt Refers to pre-mixed concrete or asphalt materials designed for laying by concrete or asphalt Paver. 3. Tamper Refers to attachment that provides initial compaction of ready mixed concrete or asphalt materials as they are laid by concrete or asphalt Paver. 4. Screed Refers to the attachment that equally spreads and levels off ready mixed materials. 5. Auger Refers to the attachment that distributes ready mixed concrete from the hopper to the left and right portion of the Paver. 6. Conveyor It is the attachment that carries ready mixed asphalt from feed hopper to the auger. 7. Hopper An attachment that serves as a receptacle of the asphalt or concrete mixed dump into the Paver."
