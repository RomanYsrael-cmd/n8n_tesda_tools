  "source_text": "Definition of Terms\n\nFor the purpose of this Competency Standard, the words\n\n1. Paver\nRefers to equipment used to lay concrete or asphalt\nmaterials\n2. Ready mixed concrete\nand / or asphalt\nRefers to pre-mixed concrete or asphalt materials\ndesigned for laying by concrete or asphalt Paver.\n3. Tamper\nRefers to attachment that provides initial compaction of\nready mixed concrete or asphalt materials as they are laid\nby concrete or asphalt Paver.\n4. Screed\nRefers to the attachment that equally spreads and levels\noff ready mixed materials.\n5. Auger\nRefers to the attachment that distributes ready mixed\nconcrete from the hopper to the left and right portion of\nthe Paver.\n6. Conveyor\nIt is the attachment that carries ready mixed asphalt from\nfeed hopper to the auger.\n7. Hopper\nAn attachment that serves as a receptacle of the asphalt\nor concrete mixed dump into the Paver.\n\n--- PDF PAGE 82 ---\nTR HEAVY EQUIPMENT OPERATION"
