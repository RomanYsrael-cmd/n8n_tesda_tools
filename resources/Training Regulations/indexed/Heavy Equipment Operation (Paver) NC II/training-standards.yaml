alification must be achieved:\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Perform pre- and\npost-operation\nprocedures for\nPaver\n1.1 Describe and\nselect paver based\non job\nrequirements\n1.2 Identify and explain\nthe functions of\ngauges, controls,\ninstruments,\nattachments and\nsafety devices and\nlocks\n1.3 Explain the\nimportance of and\nelaborate on\nequipment\nchecking\nprocedures\n1.4 Perform equipment\nchecking\nprocedures\nLecture\nPractical\nDemonstration\n• Observation\n• Demonstration with\noral questioning\n• Written test\n\n--- PDF PAGE 72 ---\nTR HEAVY EQUIPMENT OPERATION\n\n2. Perform\nproductive\noperation for\nPaver\n2.1 Identify and\n explain safe work\n practices\n2.2 Explain\n procedures in\n loading to and\n unloading paver\n from collapsible\n trailer-bed\n2.3 Perform loading to\n and unloading\n paver from\n collapsible trailer\n bed\n2.4 Identify and\n explain possible\n unexpected\n situations during\n productive\n operation of paver\n2.5 Explain\n procedures in\n paving operation\n2.6 Perform paving\n procedures\nLecture\nPractical\ndemonstration\n• Observation\n• Demonstration with\noral questioning\n• Written test\n3. Perform basic\npreventive\nmaintenance\nservicing for\nPaver\n3.1 Identify and\n explain minor and\n major equipment\n defects\n3.2 Identify and\n explain the use of\n basic hand tools\nand consumables\n3.3 Use basic hand\ntools in servicing\nminor defects and\n OS parts\n3.4 Prepare\n equipment report\n3.5 Prepare good\n housekeeping\nLecture\nPractical\ndemonstration\n• Observation\n• Demonstration with\noral questioning\n• Written test\n\n--- PDF PAGE 73 ---\nTR HEAVY EQUIPMENT OPERATION\n\n3.2\nTRAINING DELIVERY\n\nThe delivery of training should adhere to the design of the curriculum.\nDelivery should be guided by the 10 basic principles of competency-based TVET.\n\n•\nThe training is based on curriculum developed from the\ncompetency standards;\n•\nLearning is modular in its structure;\n•\nTraining delivery is individualized and self-paced;\n•\nTraining is based on work that must be performed;\n•\nTraining materials are directly related to the competency\nstandards and the curriculum modules;\n•\nAssessment is based in the collection of evidence of the\nperformance of work to the industry required standard;\n•\nTraining is based both on and off-the-job components;\n•\nAllows for recognition of prior learning (RPL) or current\ncompetencies;\n•\nTraining allows for multiple entry and exit; and\n•\nApproved training programs are nationally accredited.\n\nThe competency-based TVET system recognizes various types of delivery\nmodes, both on and off-the-job as long as the learning is driven by the\ncompetency standards specified by the industry. The following training modalities\nmay be adopted when designing training programs:\n\n•\nThe dualized mode of training delivery is preferred and\nrecommended. Thus programs would contain both in-school\nand in-industry training or fieldwork components. Details can\nbe referred to the Dual Training System (DTS) Implementing\nRules and Regulations.\n•\nModular/self-paced learning is a competency-based training\nmodality wherein the trainee is allowed to progress at his\nown pace. The trainer facilitates the training delivery\n•\nPeer teaching/mentoring is a training modality wherein fast\nlearners are given the opportunity to assist the slow learners.\n•\nSupervised industry training or on-the-job training is an\napproach in training designed to enhance the knowledge\nand skills of the trainee through actual experience in the\nworkplace to acquire specific competencies prescribed in the\ntraining regulations.\n\n--- PDF PAGE 74 ---\nTR HEAVY EQUIPMENT OPERATION\n\n•\nDistance learning is a formal education process in which\nmajority of the instruction occurs when the students and\ninstructor are not in the same place. Distance learning may\nemploy correspondence study, or audio, video or computer\ntechnologies.\n\n3.3\n TRAINEE ENTRY REQUIREMENTS\n\nThis section specifies the qualifications of trainees and educational\nexperience. Other requirements like health and physical requirements are also\nstated.\n\n•\nCan communicate both oral and written (English or Tagalog)\n\n•\nPhysically and mentally fit\n\n•\nCan perform basic mathematical computation\n\n3.4\nLIST OF TOOLS, EQUIPMENT AND MATERIALS\n\n--- PDF PAGE 75 ---\nTR HEAVY EQUIPMENT OPERATION\n\nRecommended list of tools, equipment and materials for the training of 25\ntrainees for the operation of paver.\n\nTOOLS\nEQUIPMENT\nMATERIALS\nQTY\nQTY\nQTY\n2 sets\n• Standard\nmechanical hand\ntools\n1 unit\n• Paver\n800\nliters\n• Diesel fuel\n2 pcs.\n• Multi meter\n1 unit\n• Dump truck or\ntransit mixer\n15 liters\n• Engine oil\n1 set\n• Hydraulic pressure\n gauge with adapter\n1 unit\n• Asphalt kettle\n20 liters\n• Hydraulic oil\n2 pcs.\n• Grease gun\n1 unit\n• Truck tractor\nwith low bed\ncollapsible\ntrailer\n5 kilos\n• Grease\n25 pcs.\n•\nSafety helmet\n1 unit •\nAir compressor\n25 kilos •Waste rags\n25 pcs.\n• Safety vest\n\n• Ready mixed\nasphalt or\nconcrete*\n25 pcs.\n• Goggles\n\n2\nAerosol\ncan\nPenetrating oil\n25 pairs\n•\nCotton gloves\n\n1 pc.\n•\nFire extinguisher\n\n*Quantity will depend on actual training consumption\n\n--- PDF PAGE 76 ---\nTR HEAVY EQUIPMENT OPERATION\n\n3.5\nTRAINING FACILITIES\n\nThe paver operation workshop must be of concrete\nstructure. Based on class size of 25 students/trainees the space requirements\nfor the teaching/learning and circulation areas are as follows:\n\nSPACE REQUIREMENT\nSIZE IN METERS\nAREA IN\nSQ.\nMETERS\nQTY\nTOTAL\nAREA IN\nSQ.\nMETERS\n•\nLecture area\n8.0 x 6.0 meters\n48M2\n1\n48M2\n•\nLearning resource area\n4.0 x 6.0 meters\n24M2\n1\n24M2\n•\nTool room / Storage area\n3.0 x 3.0 meters\n9M2\n1\n9M2\n• Wash, toilet and locker\nroom\n8.0 x 4.0 meters\n32M2\n1\n32M2\nTOTAL\n-\n-\n113M2\nFacilities / Equipment /\nCirculation*\n-\n\n1,000M2\nTOTAL AREA\n1,113M2\n*Equipment maneuvering area near paver location, paver, dump truck or transit\nmixer, and trailer truck with collapsible low-bed trailer (MOA)\n\n--- PDF PAGE 77 ---\nTR HEAVY EQUIPMENT OPERATION\n\n 3.6\nTRAINERS’ QUALIFICATION\nHEAVY EQUIPMENT OPERATION (PAVER)\n\nTRAINER QUALIFICATION (TQ II)\n• Must be a holder of Heavy Equipment Operation (Paver) NC II\n• Must have undergone training on Training Methodology III (TM III)\nor its equivalent\n• Must be physically and mentally fit\n• Must have at least 5 years job/industry experience*\n• Must be a civil service eligible (for government position only)\n\n* Optional. Only when required by the hiring institution.\n\nReference: TESDA Board Resolution No. 2004 03\n\n--- PDF PAGE 78 ---\nTR HEAVY EQUIPMENT OPERATION"
