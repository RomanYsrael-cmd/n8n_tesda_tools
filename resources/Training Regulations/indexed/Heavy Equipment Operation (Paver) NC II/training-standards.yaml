    "source_text": "3.1 CURRICULUM DESIGN\n\nCourse Title : HEAVY EQUIPMENT OPERATION - PAVER\nNC Level: NC II\n\nBASIC COMPETENCIES\nNominal Training Hours:\n18 Hours (Basic) + 24 Hours (Common)\nCourse Description:\n\nThis course is designed to equip individual with the basic, common\nand core competencies in Construction Sector particularly in Heavy Equipment\nOperation.\n\nTo obtain this, all units prescribed for this qualification must be\nachieved:\n\nBASIC COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and convey\nworkplace information.\n1.2 Complete relevant work\n related documents\n1.3 Participate in workplace\n meeting and discussion\nGroup\ndiscussion\nInteraction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n2. Work in a team\n environment\n2.1 Describe and identify\nteam role and\nresponsibility in a team.\n2.2 Describe work as a team\nmember.\nDiscussion\nInteraction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n\n--- PDF PAGE 69 ---\nTR HEAVY EQUIPMENT OPERATION\n\n3. Practice career\nprofessionalism\n3.1 Integrate personal\nobjectives with\norganizational goals.\n3.2 Set and meet work\npriorities.\n3.3 Maintain professional\ngrowth and development.\nDiscussion\nInteraction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n4. Practice\noccupational\nhealth and safety\n4.1 Evaluate hazard and\nrisks\n4.2 Control hazards and risks\n4.3 Maintain occupational\nhealth and safety\nawareness\nDiscussion\nPlant tour\nSymposium\n• Observation\n• Interview\n\n--- PDF PAGE 70 ---\nTR HEAVY EQUIPMENT OPERATION\n\nCOMMON COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Interpret\ntechnical\ndrawings and\nplans\n\n1.1 Read / Interpret blueprints\n and plans\n1.2 Perform freehand\nsketching\nLecture\nDemonstration\nPractical\nexercises\n\nDemonstration\nand oral\nquestioning\nWritten test\n\n2. Observe\nprocedures,\nspecifications\nand manuals of\ninstructions.\n2.1 Identify and access\n specifications / technical\n manuals\n2.2 Interpret technical\nmanuals\n2.3 Apply information in\ntechnical manual\n2.4 Store technical manual\nLecture\nDemonstration\nPractical\nexercises\nDemonstration\nand oral\nquestioning\nWritten test\n\n3. Perform\n mensurations\n and calculations\n\n3.1 Select measuring\n instruments\n3.2 Carryout measurement and\n calculations\nLecture\nDemonstration\nPractical\nexercises\nDemonstration\nand oral\nquestioning\nWritten test\n4. Maintain tools\nand equipment\n4.1 Check condition of tools\n and equipment\n4.2 Perform preventive\n maintenance\n4.3 Store tools and equipment\nLecture\nDemonstration\nPractical\nexercises\nDemonstration\nand oral\nquestioning\nWritten test\n\n5. Prepare\nconstruction\nmaterials and\ntools\n5.1 Identify Materials\n5.2 Request Materials\n5.3 Receive and inspect\nmaterials\nAudio Visual\nSimulation\nDiscussion\nPractical\nExercise\nDemonstration\nDirect\nobservation\nQuestions or\ninterview\nPortfolio\n(credentials)\nWritten / Oral\nTest\nDemonstration\n\n--- PDF PAGE 71 ---\nTR HEAVY EQUIPMENT OPERATION\n\nCORE COMPETENCIES\n\nCourse Title\n: HEAVY EQUIPMENT OPERATION (PAVER)\nLevel: NC II\n\nNominal Training Hours:\n80 Hours\n\nCourse Description:\n\nThis course is designed to enhance the knowledge, desirable\nattitudes and skills in the use of paver in accordance with industry standards. It\ncovers core competencies such as: perform pre- and post operation procedure,\nperform equipment operation, perform basic preventive maintenance on a given\npaver.\n\nTo obtain this, all units prescribed for this qualification must be achieved:\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Perform pre- and\npost-operation\nprocedures for\nPaver\n1.1 Describe and\nselect paver based\non job\nrequirements\n1.2 Identify and explain\nthe functions of\ngauges, controls,\ninstruments,\nattachments and\nsafety devices and\nlocks\n1.3 Explain the\nimportance of and\nelaborate on\nequipment\nchecking\nprocedures\n1.4 Perform equipment\nchecking\nprocedures\nLecture\nPractical\nDemonstration\n• Observation\n• Demonstration with\noral questioning\n• Written test\n\n--- PDF PAGE 72 ---\nTR HEAVY EQUIPMENT OPERATION\n\n2. Perform\nproductive\noperation for\nPaver\n2.1 Identify and\n explain safe work\n practices\n2.2 Explain\n procedures in\n loading to and\n unloading paver\n from collapsible\n trailer-bed\n2.3 Perform loading to\n and unloading\n paver from\n collapsible trailer\n bed\n2.4 Identify and\n explain possible\n unexpected\n situations during\n productive\n operation of paver\n2.5 Explain\n procedures in\n paving operation\n2.6 Perform paving\n procedures\nLecture\nPractical\ndemonstration\n• Observation\n• Demonstration with\noral questioning\n• Written test\n3. Perform basic\npreventive\nmaintenance\nservicing for\nPaver\n3.1 Identify and\n explain minor and\n major equipment\n defects\n3.2 Identify and\n explain the use of\n basic hand tools\nand consumables\n3.3 Use basic hand\ntools in servicing\nminor defects and\n OS parts\n3.4 Prepare\n equipment report\n3.5 Prepare good\n housekeeping\nLecture\nPractical\ndemonstration\n• Observation\n• Demonstration with\noral questioning\n• Written test\n\n--- PDF PAGE 73 ---\nTR HEAVY EQUIPMENT OPERATION"
  },
