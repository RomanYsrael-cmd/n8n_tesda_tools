  "source_text": "Section 1. The successful candidates shall be awarded a\nNational Certificate signed by the TESDA Director General.\n\n4.2\nThe qualification of HEAVY EQUIPMENT OPERATION (Paver) NC II\nmaybe attained through demonstration of competence in a project-type\nassessment covering the following core units.\n\n4.2.1\nPAVER OPERATION\n\n Perform pre-and post operation for Asphalting and\nConcreting equipment\n Perform productive operation for Paver\n Perform basic preventive maintenance servicing for\nConcreting and Asphalting equipment\n\n4.3\nAssessment shall focus on the core units of competency. The basic and\ncommon units shall be integrated or assessed concurrently with the core\nunits.\n\n4.4\nThe following are qualified to apply for assessment and certification:\n\n4.4.1\nGraduates of formal, non-formal and/or informal training including\nenterprise-based training programs\n\n4.4.2\nExperienced Workers (wage-employed or self-employed)\n\nThe guidelines on assessment and certification are discussed in detail in\nthe \"Procedures Manual on Assessment and Certification\" and \"guidelines on the\nImplementation of the Philippine TVET Qualification and Certification System\n(PTQCS).\"\n\n--- PDF PAGE 79 ---\n\n--- PDF PAGE 80 ---\nTR HEAVY EQUIPMENT OPERATION\n\nCOMPETENCY MAP\nCONSTRUCTION-HEAVY EQUIPMENT OPERATION - SUB- SECTOR\nBA\nSIC\nInspect\nrigging gears\nPerform productive\noperation for\nhydraulic excavator\nPerform productive\noperation for truck-\nmounted crane\nPerform productive\noperation for tower crane\nPerform productive\noperation for forklift\nInstall rigging\ngears\nPerform productive\noperation for\nbackhoe loader\nPerform pre- and post-\noperation procedures for\nlifting equipment\nPerform basic\npreventive maintenance\nservicing for hauling\nPerform productive\noperation for off-highway\ndump truck (articulated)\nPerform productive\noperation for\nbulldozer\nPerform productive\noperation for wheel\nloader\nPerform productive\noperation for motor\ngrader\nPerform pre- and post-\noperation procedures for\nhauling equipment\nPerform productive\noperation for road\nroller\nPerform basic preventive\nmaintenance servicing for\nlifting equipment\nAssist crane\noperator\nPerform pre- and post-\noperation procedures for\nearth moving equipment\nPerform productive\noperation for\ncrawler crane\nPerform basic preventive\nmaintenance servicing for\nearth moving equipment\nPerform productive\noperation for rough-\nterrain crane\nPerform productive\noperation for off-highway\ndump truck (rigid)\nPerform productive\noperation for\nconcrete pump\nPerform productive\noperation for paver\nPerform basic preventive\nmaintenance servicing for\nconcreting and asphalting\nequipment\nPerform productive\noperation for on-highway\ndump truck (rigid)\nPerform pre- and post-\noperation procedures for\nconcreting and asphalting\nequipment\nPerform productive\noperation for transit\nmixer\nCORE\nCOMPETENCIES\nCOMMON\nCOMPETENCIES\nBASIC\nCOMPETENCIES\nReceive and respond\nto workplace\ncommunication\nWork with others\nUse relevant\ntechnologies\nPractice career\nprofessionalism\nUtilize specialized\ncommunication\nskills\nPractice occupational\nhealth and safety\nprocedures\nDevelop teams and\nindividuals\nLead workplace\ncommunication\nDemonstrate work\nvalues\nSolve problems\nrelated to work\nactivities\nDevelop and\npractice negotiation\nskills\nPractice\nhousekeeping\nprocedure (5s)\nUse mathematical\nconcepts and\ntechniques\nWork in a team\nenvironment\nParticipate in\nworkplace\ncommunication\nApply problem-\nsolving techniques\nin the workplace\nPlan and organize\nwork\nCollect, analyze\nand organize\ninformation\nLead small team\nPromote\nenvironmental\nprotection\nPerform\nmensurations and\ncalculations\nObserve procedures,\nspecifications and\nmanual of instructions\nInterpret technical\ndrawings and plans\nMaintain tools and\nequipment\nPrepare construction\nmaterials and tools\n\n--- PDF PAGE 81 ---\nTR HEAVY EQUIPMENT OPERATION\n\nDefinition of Terms\n\nFor the purpose of this Competency Standard, the words\n\n1. Paver\nRefers to equipment used to lay concrete or asphalt\nmaterials\n2. Ready mixed concrete\nand / or asphalt\nRefers to pre-mixed concrete or asphalt materials\ndesigned for laying by concrete or asphalt Paver.\n3. Tamper\nRefers to attachment that provides initial compaction of\nready mixed concrete or asphalt materials as they are laid\nby concrete or asphalt Paver.\n4. Screed\nRefers to the attachment that equally spreads and levels\noff ready mixed materials.\n5. Auger\nRefers to the attachment that distributes ready mixed\nconcrete from the hopper to the left and right portion of\nthe Paver.\n6. Conveyor\nIt is the attachment that carries ready mixed asphalt from\nfeed hopper to the auger.\n7. Hopper\nAn attachment that serves as a receptacle of the asphalt\nor concrete mixed dump into the Paver.\n\n--- PDF PAGE 82 ---\nTR HEAVY EQUIPMENT OPERATION\n\nACKNOWLEDGEMENTS\n\nThe Technical Education and Skills Development Authority (TESDA)\nwishes to extend thanks and appreciation to the many representatives of\nbusiness, industry, academe and government agencies and who contributed their\ntime and expertise to the development and validation of this Training\nRegulations.\n\n•\nTHE TECHNICAL EXPERT PANEL (TEP)\n\nFlorello P. Quianzon\nConsultant, Equipment Concrete Product Division\n(Equipment Management)\nMakati Development Corporation\nAugusto S. Buyao\nTraining Manager\nMaxima Equipment Co. Inc.\n\nTito C. Tadios\nTraining Manager (Heavy Equipment Operation\nand Maintenance)\nMonark Equipment Co. Inc\n\nRudolfo D. Ancheta\nQuality Controller Supervisor (Repair and\nMaintenance of Hydraulic Excavator/Basic\nHydraulic)\nCivil Merchanidising Inc.\nEduardo C. Emas\nTrainor\nConstruction Manpower Development Center\nCornelio D. Padua\nHeavy Equipment Supervisor\nMakati Development Corp.\nAugust Consebido\nSales supervisor\nMonark Equipment Co. Inc.\nElias Rodriguez\nTrainor\nMonark equipment Co. Inc.\nEugenio S. Gutierrez\nOperator\nMakati Development Corp.\nWilbert Inchoco\nTraining Manager\nMonark Equipment co. Inc.\nVincent L. Orais\nOperator\nMakati Development Corp\nManuelito S. Severino\nOperator\nMakati Development Corp.\nEric Perez\nSales Manager\nWirtgen Philippines\nAlfredo M. Abela\nOperator\nMakati Development Corporation\n\nThe Management and Staff of the TESDA Secretariat\n\nQualifications and Standards Office\n\nThe Management and Staff of the ACEL Secretariat\n\n--- PDF PAGE 83 ---\nTR HEAVY EQUIPMENT OPERATION"
