        "source_text": "CON833322\nUNIT DESCRIPTOR:\nThis unit describes the outcomes required in the routine\npreventive maintenance for concreting asphalting equipment.\n\nELEMENT\nPERFORMANCE CRITERIA\nBold and Italicized terms are elaborated in the\nRange of Variables\n1. Perform\nadjustments/\nreplacements\n\n1.1 Minor defects are identified and remedied in accordance with\ncompany/manufacturer’s procedures.\n1.2 Tools are selected based on job requirements.\n1.3 Major defects are identified with checklist and referred to\nappropriate personnel.\n2. Perform basic\npreventive\nmaintenance\nservicing (PMS)\n\n2.1 OS parts/standards are identified and serviced according to\nmanufacturer’s recommendations.\n2.2 Fluids and lubricants are used based on manufacturer’s\nmanual.\n2.3 Basic hand tools and equipment are identified and used in\naccordance with site requirements.\n2.4 Basic preventive maintenance servicing (PMS) is carried\nout in accordance with manufacturer’s and/or site\nconditions/requirements.\n3. Prepare\nequipment reports\n\n3.1 Daily checklist form is properly accomplished in accordance\nwith manufacturer’s/company requirements.\n3.2 Minor/major equipment defects are reported to concerned\npersonnel.\n\n--- PDF PAGE 54 ---\nTR HEAVY EQUIPMENT OPERATION\n\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Minor defects\n\nMay include but not limited to:\n1.1 Clogged air cleaner\n1.2 Loose clamps, bolts and mountings\n1.3 Weak battery\n\nConcrete Pump and Transit Mixer\n1.4 Defective filler caps (radiator, fuel, hydraulic)\n1.5 Presence of water in the fuel separator\n1.6 Incorrect tire inflation / worn-out / flat tires\n1.7 Loose belts\n\nPaver\n1.8 Incorrect track tension\n1.9 Misaligned conveyor belt\n1.10 Stuck-up rollers\n1.11 Busted bulbs\n\n--- PDF PAGE 55 ---\nTR HEAVY EQUIPMENT OPERATION\n\n2. Major defects\n\nMay include but not limited to:\n2.1 Excessive engine oil / fuel / water / fluid\n\nConcrete Pump and Transit Mixer\n2.2 Poor engine performance (low power, hard starting)\n2.3 Poor working hydraulic implement\n\nTransit Mixer and Paver\n2.4 Defective electrical system\n2.4.1 Charging\n2.4.2 Lighting\n2.4.3 Starting\n2.4.4 Monitoring / gauges\n\n2.5 Leakage on\n2.5.1 Air\n2.5.2 Fuel\n2.5.3 Cooling\n2.5.4 Hydraulic system\n2.5.5 Gas\n\nTransit Mixer\n2.6 Weak / defective brakes\n\nPaver\n2.7 Busted hydraulic hose\n2.8 Worn-out track group\n\n3. Appropriate\npersonnel\n\nMay include but not limited to:\n3.1 Operation equipment maintenance supervisor\n3.2 Maintenance Personnel\n\nPaver\n\n3.3 Equipment Foreman\n\n--- PDF PAGE 56 ---\nTR HEAVY EQUIPMENT OPERATION\n\n4. Operator-\nServiceable (OS)\nparts\n\n4.1 Filters\n 4.1.1 Air cleaner\n 4.1.2 Water fuel separator\n4.2 All caps (oil, water, fluid and fuel)\n\nTransit Mixer and Concrete Pump\n4.3 Battery distilled water, clamps and holders\n4.4 Tire inflation\n\nConcrete Pump and Paver\n4.5 Belts\n\nPaver\n4.6 Battery terminal / connection\n4.7 Track tension\n4.8 Grease / lube points\n4.9 Cylinders\n4.10 Electrical and electronic components\n4.10.1 Sensors\n4.10.2 Switches, relays\n4.10.3 Fuses\n\n--- PDF PAGE 57 ---\nTR HEAVY EQUIPMENT OPERATION\n\n5. Fluid and\nLubricants\nMay include but not limited to:\n5.1 Engine oil\n5.2 Hydraulic oil\n5.3 Battery distilled water\n5.4 Coolant\n\nConcrete Pump and Transit Mixer\n5.5 Cleaning solutions\n5.6 Water\n\nTransit Mixer and Paver\n5.7 Multi-purpose grease\n\nConcrete Pump\n5.8 Forming grease\n\nTransit Mixer\n5.9 Washer fluids\n5.10 Brake fluid oil\n5.11 Steering oil\n5.12 Gear oil\n5.13 Automatic Transmission Fluid\n\n--- PDF PAGE 58 ---\nTR HEAVY EQUIPMENT OPERATION\n\n6. Basic hand tools\nand equipment\n6.1 Hand tools\n 6.1.1 Wrenches\n 6.1.2 Mechanical pliers\n 6.1.3 Screw driver (Philips and flat)\n 6.1.4 Hammer\n 6.1.5 Vice grip\n\n Concrete Pump and Transit Mixer\n 6.1.6 Tire gauge (instrument)\n 6.1.7 Steel brush\n 6.1.8 Pry bar\n 6.1.9 Electrical tape\n 6.1.10 Spatula\n\n Concrete Pump\n 6.1.11 Blunt chisel\n\n Transit Mixer\n 6.1.12 Paint brush\n\n Paver\n 6.1.13 Grease gun\n 6.1.14 Multi-scale kit\n\n6.2 Equipment\n 6.2.1 High pressure washer\n 6.2.2 Air compressor\n\n Concrete Pump and Transit Mixer\n 6.2.3 Hydroblast\n 6.2.4 Grease gun\n 6.2.5 Hydraulic jack\n 6.2.6 Lube pump\n 6.2.7 Trouble light\n\n--- PDF PAGE 59 ---\nTR HEAVY EQUIPMENT OPERATION\n\n7. Basic preventive\nmaintenance\nservicing (PMS)\nMay include but not limited to:\n7.1 Check / tighten battery clamps / holders\n7.2 Adjust belt tension\n7.3 Grease lubricating points\n7.4 Clean filters\n\n Concrete Pump, Paver and Transit Mixer\n 7.4.1 Fuel water separator\n\n Concrete Pump and Transit Mixer\n 7.4.2 Air filter\n\n Concrete Pump\n 7.4.3 Vacuum filter\n 7.4.4 High pressure filter\n\n Paver\n 7.4.5 Vacuator valve\n\nConcrete Pump and Transit Mixer\n7.5 Check / replace minor defective parts (external)\n7.6 tire inflation pressure\n7.7 Check BLOWAF\n\nTransit Mixer\n7.8 Clean internal / external walls\n 7.8.1 Drum\n 7.8.2 Chute\n 7.8.3 Chassis\n 7.8.4 Hopper\n\nPaver\n7.9 Adjust track tension\n7.10 Replace defective fluid caps\n7.11 Loose bolts and nuts\n\n--- PDF PAGE 60 ---\nTR HEAVY EQUIPMENT OPERATION\n\n8. Site conditions/\n requirements\n8.1 Instructions\n8.2 Signages\n8.3 Work schedules\n8.4 Work bulletin boards\n\nConcrete Pump and Transit Mixer\n8.5 Vicinity / rerouting chart\n8.6 Environmental / site conditions\n 8.6.1 Dusty\n 8.6.2 Toxic / hazardous fluids\n 8.6.3 Rainy / windy\n 8.6.4 Muddy / slippery ground\n 8.6.5 Site obstruction\n\nPaver\n8.7 Chart\n8.8 Memo\n\n--- PDF PAGE 61 ---\nTR HEAVY EQUIPMENT OPERATION\n\nEVIDENCE GUIDE\n1. Critical aspects of\nevidence to be\nconsidered\n\nAssessment requires evidence that the candidate:\n1.1 Demonstrates ability to identify minor defects using checklist\nand service them following company standard operating\nprocedures\n1.2 Demonstrates ability to identify major defects using check list\nand report them to appropriate personnel\n1.3 Demonstrates ability to identify OS parts/standards from\nmanufacturer’s reference books/manuals\n1.4 Demonstrates knowledge of recommended fluids and\n lubricants\n1.5 Demonstrates ability to use basic hand tools\n and equipment\n1.6 Demonstrates ability to accomplish and submit preventive\nmaintenance checklist report in accordance with company\nprocedures\n1.7 Demonstrates ability to observe safe work practices\n2. Underpinning\n(related)\nknowledge and\nattitude\n\n2.1 Knowledge of equipment minor and major defects\n2.2 Service procedures for minor defects\n2.3 Types and uses of basic hand tools and equipment\n2.4 Knowledge of OS parts\n2.5 Knowledge of fluids and lubricants\n2.6 Familiarity with maintenance procedures / checklist form\n2.7 Types and uses of PPE\n2.8 Understand operation and maintenance manual\n2.9 Positive work values\n3. Underpinning skills\n\n3.1 Identifying minor and major defects\n3.2 Performing servicing procedures for minor defects\n3.3 Using basic hand tools and equipment\n3.4 Identifying and servicing OS parts\n3.5 Using personal protective equipment (PPE)\n3.6 Using fluids and lubricants\n3.7 Using PPE\n3.8 Following operation and maintenance manual\n3.9 Accomplishing preventive maintenance checklist\n\n--- PDF PAGE 62 ---\nTR HEAVY EQUIPMENT OPERATION\n\n4. Resource\nimplications\n\nThings necessary for the conduct of assessment\n4.1 Access to concreting and asphalting equipment and the\ncorresponding manual\n4.2 Basic hand tools and equipment\n4.3 Fluids and lubricants\n4.4 PPE\n4.5 Safety signages/barricades\n5. Method of\nassessment\n\nCompetency in this unit must be assessed through\n5.1 Written and/or oral questioning\n5.2 Observation of practical demonstration\n5.3 Work record and documents\n6. Context for\nassessment\n\n6.1 Competency shall be assessed in a normal or simulated\nworkplace environment and in accordance with safe work\n procedures\n6.2 Competency shall be assessed while work is being\nundertaken independently\n\n--- PDF 