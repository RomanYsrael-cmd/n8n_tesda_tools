 procedures for minor defects\n3.3 Using basic hand tools and equipment\n3.4 Identifying and servicing OS parts\n3.5 Using personal protective equipment (PPE)\n3.6 Using fluids and lubricants\n3.7 Using PPE\n3.8 Following operation and maintenance manual\n3.9 Accomplishing preventive maintenance checklist\n\n--- PDF PAGE 62 ---\nTR HEAVY EQUIPMENT OPERATION\n\n4. Resource\nimplications\n\nThings necessary for the conduct of assessment\n4.1 Access to concreting and asphalting equipment and the\ncorresponding manual\n4.2 Basic hand tools and equipment\n4.3 Fluids and lubricants\n4.4 PPE\n4.5 Safety signages/barricades\n5. Method of\nassessment\n\nCompetency in this unit must be assessed through\n5.1 Written and/or oral questioning\n5.2 Observation of practical demonstration\n5.3 Work record and documents\n6. Context for\nassessment\n\n6.1 Competency shall be assessed in a normal or simulated\nworkplace environment and in accordance with safe work\n procedures\n6.2 Competency shall be assessed while work is being\nundertaken independently\n\n--- PDF PAGE 63 ---\nTR HEAVY EQUIPMENT OPERATION\n\nUNIT TITLE:\nPERFORM PRODUCTIVE OPERATION FOR PAVER\nUNIT CODE:\nCON833325\nUNIT DESCRIPTOR:\nThis unit deals with the knowledge, skills and attitudes in\nperforming productive operation for paver. It includes skills\nrequired to perform loading paver to and unloading it from low-\nbed trailer, travel paver and paving operation.\n\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\n1. Load paver to low-\nbed or collapsible\ntrailer\n\n1.1 Safe work practices are observed.\n1.2 Loading procedures for paver is performed following\nrecommended safety practices.\n1.3 Unexpected situations are responded to in line with\ncompany rules and regulations and in a manner that\nminimizes risk to personnel and equipment.\n\n2. Unload paver from\ntrailer\n2.1 Safe work practices are observed.\n2.2 Unloading procedures for paver is performed\n following recommended safety practices.\n 2.3 Unexpected situations are responded to in line\n with company rules and regulations and in a\n manner that minimizes risk to personnel and\n equipment.\n3. Perform paving\noperation\n3.1 Communication with spotter is established prior\n to laying of ready mixed materials.\n3.2 Paving operation is performed following\n established / recommended practices and job\n specifications / requirements.\n3.3 Unexpected situations are responded to in line\n with company rules and regulations and in a\n manner that minimizes risk to personnel and\n equipment.\n\n--- PDF PAGE 64 ---\nTR HEAVY EQUIPMENT OPERATION\n\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Safe work\npractices\n1.1 Observed 3-point system for embarking on and alighting from\n equipment\n1.2 Safety awareness at all times\n1.3 Wear minimum PPE\n1.4 All controls must be set in neutral position and parking brake\n applied before alighting from paver\n2. Loading\nprocedures\n2.1 Appropriate attachment height is observed prior to loading of\n paver\n2.2 Communication with signalman is established and maintained.\n2.3 Proper positioning of Paver on the ramp is observed.\n2.4 Paver is loaded to trailer bed\n2.5 All safety locks and control levers are secured and set at\n required position.\n2.6 Track and chassis/frame are secured with appropriate stopper\n blocks and binders.\n3. Unloading\nprocedures\n3.1 Binders, safety locks, pins and stopper blocks are fully\n dismantled and removed prior to unloading operation.\n3.2 Controls are checked in line with safety procedure and prior to\n starting/moving the machine.\n3.3 Proper engine warm-up is observed in accordance with the\n manufacturer’s standards.\n3.4 Operator is properly responding to the directions of authorized\n signalman while performing unloading procedure.\n4. Unexpected\nsituations\nMay include but not limited to:\n4.1 Collapse of unstable terrain\n4.2 Collapse of ramps/bridge\n4.3 Uneven surface e.g., manhole\n4.4 Busted hydraulic hose\n4.5 Breakdown of work attachment\n4.5 Engine breakdown\n4.6 Natural calamities e.g., flashfloods, landslide\n4.7 Situations arising from poor peace and order conditions\n\n--- PDF PAGE 65 ---\nTR HEAVY EQUIPMENT OPERATION\n\n5. Ready mixed\nmaterials\n5.1 Asphalt\n5.2 Concrete\n6. Paving operation\n6.1 Ready mixed materials are laid in accordance with job\n specifications/requirements.\n6.2 Required speed is applied during paving operation according to\n standard operating procedures.\n6.3 Control panel gauges and instruments are monitored / adjusted\n and/ or re-adjusted during paving operation.\n6.4 Communication is maintained with spotter during paving\n operation\n7. Specifications/\nrequirements\n7.1 Thickness\n7.2 width\n\n--- PDF PAGE 66 ---\nTR HEAVY EQUIPMENT OPERATION\n\nEVIDENCE GUIDE\n1. Critical aspects\nof competency\nAssessment must confirm evidence that the candidate:\n1.1 Demonstrates ability to perform loading to / unloading operation\nfrom low-bed trailer following safe work procedures.\n1.2 Demonstrates ability to perform paving operation.\n1.3 Demonstrates understanding of functions of the paver and the\n control panels and instruments.\n1.4 Demonstrates knowledge of design mix of asphalt and / or\nConcrete.\n2. Underpinning\nknowledge,\nattitudes\n\n2.1 Familiarity with road construction stages/procedures\n2.2 Paving procedures and techniques\n2.3 Safety procedures and regulations\n2.4 Controls, instruments, gauges and their uses\n2.5 Basic components, systems and functions\n2.6 Comprehension of equipment operation and maintenance\n manual\n2.7 Company rules and regulations relevant to Paver operation\n2.8 Procedures for travelling Paver\n2.9 Familiar with design mix of asphalt and / or concrete\n2.10 Positive work values (time and cost conscious, etc.)\n3. Underpinning\nskills\n3.1 Performing standard operating procedures for equipment\n3.2 Reading and interpreting operation and maintenance manual\n3.3 Performing safety practices and safe operation\n3.4 Interpreting/applying eye and hand coordination\n3.5 Following company rules and regulations relevant to paver\n operation\n4. Resource\nimplications\nThe following resources must be provided:\n4.1 Access to paver and work site/terrain\n4.2 Equipment manuals\n4.3 Ready mixed asphalt and / or concrete\n4.4 Prime mover and collapsible trailer and / or trailer with pre-\n fabricated ramp\n4.5 Dump trucks / Transit mixer\n4.6 Paving crew\n4.7 Barricades and informative/safety signages\n\n--- PDF PAGE 67 ---\nTR HEAVY EQUIPMENT OPERATION\n\n5. Method of\nassessment\nCompetency in this unit must be assessed through:\n5.1 Oral/written questioning\n5.2 Observation of practical demonstration\n5.3 Third Party report\n5.4 Work record and documents\n6. Context for\nassessment\n6.1 Assessment may be conducted in the work site in accordance\nwith safe work practices.\n6.2 Competency shall be assessed while work is being undertaken.\n\n--- PDF PAGE 68 ---\nTR HEAVY EQUIPMENT OPERATION"
