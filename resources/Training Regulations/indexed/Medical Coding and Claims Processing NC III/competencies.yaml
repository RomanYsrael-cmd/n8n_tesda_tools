 contract\nwith the payer\n2.2. Completeness of\nclaims\ndocumentation are\nchecked in\naccordance with\npayer requirements\n2.3. Lacking data based\non the initial\nscreening result are\nrequested from\nmedical provider\n\n2.1. Medical Terminologies\n2.2. Medical Documentation\n2.3. Medical claim process\n2.4. Healthcare Laws and\nEthics\n2.5. Essential of healthcare\ninsurance\n2.6. Medical Coding Systems\n• International\nClassification of\nDiseases\n• Current Procedural\nTerminology\n• Healthcare Common\nProcedure Coding\nSystem\n2.7. Client’s specific\nguidelines/ coding and\nclaims processing\nstandards\n• Analytical skills\n• Reading and\ncomprehension\nskills\n• Researching\nskills\n• Basic\nmathematical\nskills\n• Communication\nskills\n• Computer skills\n\n3. Process\nclaims/billing\n3.1. Encode patient,\nprovider and/or\nbilling information\n3.2. Determine\nreimbursable\nprocedures and/or\nservices based on\nexisting insurance\ncontract or provider\ncontract or any\nexisting\nreimbursement\nguidelines\n3.3. Billing information is\nverified for\ncompleteness of\ndata based on the\nrequired fields.\n3.4. Determine billing\naddress and facility\nbased on insurance\ncontract\n3.1 Medical Terminologies\n3.2 Medical Documentation\n3.3 Medical claim process\n3.4 Healthcare Laws and\nEthics\n3.5 Essential of healthcare\ninsurance\n3.6 Medical Coding Systems\ninclude but not limited to:\n3.6.1 Diagnosis Code\nSet\n3.6.2 Procedure Code\nSet\n3.6.3 Supplies Code set\n3.7 Client’s specific\nguidelines/ coding and\nclaims processing\nstandards\n\n• Analytical skills\n• Reading and\ncomprehension\nskills\n• Researching\nskills\n• Basic\nmathematical\nskills\n• Communication\nskills\n• Computer skills\n\n--- PDF PAGE 38 ---\nTESDA-SOP-QSO-01-F08\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR - MEDICAL CODING AND CLAIMS PROCESSING NC 