        "source_text": "ICT325301\nUNIT DESCRIPTOR\n:\nThis unit covers the skills, knowledge and attitude necessary to\nassign codes for medical diagnoses, procedures, services,\nsupplies, equipment, and other services.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED KNOWLEDGE\nREQUIRED SKILLS\n1. Prepare\nrequirements\nfor medical\ncoding\n1.1. Patient’s medical\nrecords/charts are\nretrieved from client’s\nsystem\n1.2. Coding tools/system\nto be used for medical\ncoding are prepared\nbased on client’s\nspecification/coding\nguidelines\n\n1.1. Medical\nDocumentation\n1.2. Healthcare Laws\nand Ethics\n1.3. Medical Coding\nSystems\n• Diagnosis Code\nSet\n• Procedure Code\nSet\n• Supplies code Set\n1.4. 5S and 3Rs\n1.5. I.T. Process\n• Computer skills\n• Analytical skills\n• Reading and\ncomprehension\nskills\n• Research skills\n• Communication\nskills\n2. Evaluate\nmedical\nreports\n2.1. Medical information\nnecessary for coding\nare analyzed for\ncompleteness based\non client’s\nspecification/coding\nguidelines\n2.2. Medical Report is\nreviewed to determine\nthe appropriate\ndiagnoses, procedures\nequipment & supplies\nbased on client’s\nspecification/coding\nguidelines.\n2.3. When necessary,\nspecific requirements of\ninsurance/ payor are\nconsidered\n2.4. Lacking data based on\nthe initial screening\nresult are requested\nfrom the client\n\n2.1. Medical Terminology\n• Systems of the\nbody (e.g., skeletal,\nrespiratory,\ncardiovascular)\n• Human anatomy\n• Human physiology\n• Fundamental\nnature of a disease\nprocess, signs,\nsymptoms and\nmethods of\ntreatment\n• Common medical\nconditions\n• Medical\ninvestigations and\nprocedures\n• Injuries\n• Common\nabbreviations for\nmedical and\npharmacological\nterms (e.g., BCG,\nHRT)\n• Common\nmedications\n• Commonly used\nmedical equipment\n• Analytical skills\n• Reading and\ncomprehension\nskills\n• Research skills\n• Communication\nskills\n• Computer skills\n\n--- PDF PAGE 33 ---\nTESDA-SOP-QSO-01-F08\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR - MEDICAL CODING AND CLAIMS PROCESSING NC III (Amended) Promulgated June 16, 2015\n Page 31\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED KNOWLEDGE\nREQUIRED SKILLS\nand instruments\n• Laboratory testing\nmethods\n• Diagnostic and\nsurgical procedures\n• Laboratory values\nand significance\n• Medico-legal\nterminology\n2.2. Client’s specific\nguidelines/ coding\nstandards\n2.3. Medical\nDocumentation\n2.4. Healthcare Laws\nand Ethics\n2.5. Essential of\nhealthcare insurance\n2.6. Medical Coding\nSystems\n3. Assign codes\n3.1 Medical terms to be\nreported are searched\nor located in the\nAlphabetic index of the\nappropriate coding\nreference/s\n3.2 Code numbers are\nverified using the\ntabular list of the coding\nmanual\n3.3 Verified medical code\nor codes are assigned\nto the highest level of\ndetails in line with\ncoding standards and\nguidelines\n3.4 Unclear/Questionable\ncases are clarified with\nappropriate resource\nperson/s in line with\nenterprise procedures\n3.5 Coding information/\nrequirements are\nverified for\ncompleteness of data\nbased on the required\nfields prior to\nsubmission\n3.2 Medical\nTerminologies\n3.3 Medical\nDocumentation\n3.4 Healthcare Laws\nand Ethics\n3.5 Essential of\nhealthcare insurance\n• Diagnosis code\nset\n• Procedure code\nset\n• supplies code set\n3.6 Client’s specific\nguidelines/coding\nstandards\n3.7 5S and 3Rs\n• Analytical skills\n• Reading and\ncomprehension\nskills\n• Research skills\n• Communication\nskills\n• Computer skills\n\n--- PDF PAGE 34 ---\nTESDA-SOP-QSO-01-F08\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR - MEDICAL CODING AND CLAIMS PROCESSING NC III (Amended) Promulgated June 16, 2015\n Page 32\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Coding tools\nMay include but not limited to:\n• electronic copy\n•hard copy\n2. Medical coding system\nMedical coding systems include but not limited to:\n• International Classification of Diseases\n• Current Procedural Terminology\n• Healthcare Common Procedure Coding\nSystem\n3. Completeness\nMay include but not limited to:\n• quantitative (completeness of data), and\n•\nqualitative (consistency of data) analysis\n4. Medical information\nMay include but not limited to:\n• Patient\n• Provider\n• Payor\n5. coding references\nMay include but not limited to:\n• Electronic reference\no ICD codes\no CPT codes\no HCPCS\n• Hard copy\no ICD codes\no CPT codes\no\nHCPCS\n6. medical codes\nMay include but not limited to:\n• diagnoses codes\n• codes for procedures and services\no ICD procedure codes\no CPT Procedure codes\n• codes for supplies, equipment and others\nservices\n\n--- PDF PAGE 35 ---\nTESDA-SOP-QSO-01-F08\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR - MEDICAL CODING AND CLAIMS PROCESSING NC III (Amended) Promulgated June 16, 2015\n Page 33\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment may show that the candidate:\n1.1.\nPrepared requirements for medical coding\n1.2.\nEvaluated medical reports\n1.3.\nAssigned codes\n2. Methods of\nassessment\nThe following may be used to objectively assess the\ncandidate:\n2.1.\nDemonstration with Oral Questioning (chart coding)\n2.2.\nWritten test\n2.3.\nPortfolio assessment (international/DOH and DOH-\naccredited training institution) with interview\n3. Resource implication\nThe following resources MUST be provided:\n3.1.\nDiagnosis Coding manuals\n3.2.\nProcedure/services and supplies coding manuals or\ntheir equivalent\n3.3.\nMockup/Sample Medical documentation\n3.4.\n4. Context of Assessment\n4.1.\nAssessment may be conducted in the workplace or\nin a simulated environment.\n\n--- PDF PAGE 36 ---\nTESDA-SOP-QSO-01-F08\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR - MEDICAL CODING AND CLAIMS PROCESSING NC III (Amended) Promulgated June 16, 2015\n Page 34\nUNIT TITLE\n :\nPROCESS MEDICAL CLAIMS/BILLING\nUNIT CODE\n :"
      }
