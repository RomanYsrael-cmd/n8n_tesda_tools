        "evidence_guide": {
          "source_text": "2\n1. Critical aspects\nof Competency\nAssessment requires evidence that the candidate:\n1.1 Studied and selected appropriate technology\nconsistent with work requirements\n1.2 Applied relevant technology\n1.3 Maintained and enhanced operative ability of relevant\ntechnology\n2. Resource\nImplications\nThe following resources MUST be provided:\n2.1 Relevant technology\n2.2 Interview and demonstration questionnaires\n2.3 Assessment packages\n3. Methods of\nAssessment\nCompetency must be assessed through:\n3.1 Interview\n3.2 Actual demonstration\n3.3 Authenticated portfolio (related certificates of\ntraining/seminar)\n4. Context for\nAssessment\n4.1 Competency may be assessed in actual workplace or\nsimulated environment\n\n--- PDF PAGE 24 ---\nTESDA-SOP-QSO-01-F08\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR - MEDICAL CODING AND CLAIMS PROCESSING NC III (Amended) Promulgated June 16, 2015\n Page 22\nCOMMON COMPETENCIES\n\nUNIT TITLE\n:\nAPPLY QUALITY STANDARDS\nUNIT CODE\n:"
        },
        "source_text": "500311114\n\nUNIT DESCRIPTOR : This unit of competency covers the knowledge, skills, and\nattitude\nrequired\nin\nselecting,\nsourcing\nand\napplying\nappropriate and affordable technologies in the workplace.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1. Study/select\nappropriate\ntechnology\n1.1 Usage of different\ntechnologies is\ndetermined based on job\nrequirements\n1.2 Appropriate technology\nis selected as per work\n specification\n1.1 Awareness on\ntechnology and\nits function\n1.2 Communication\ntechniques\n1.3 Health and safety\nprocedure\n1.4 Company policy\nin relation to\nrelevant\ntechnology\n1.5 Machineries/\nequipment and\ntheir application\n1.6 Software\nprograms\n1.1 Identifying\nrelevant\ntechnology on\njob\n\n2. Apply\nrelevant\ntechnology\n\n2.1 Relevant technology is\neffectively used in\ncarrying out function\n2.2 Applicable software and\nhardware are used as\nper task requirement\n2.3 Management concepts\nare observed and\npracticed as per\nestablished industry\npractices\n2.1 Knowledge on\noperating\ninstructions\n2.2 Understanding\nsoftware and\nhardware system\n2.3 Communication\ntechniques\n2.4 Health and safety\nprocedure\n2.5 Company policy\nin relation to\nrelevant\ntechnology\n2.6 Different\nmanagement\nconcepts\n2.7 Technology\nadaptability\n\n2.1 Applying\nrelevant\ntechnology\n2.2 Communicating\nskills\n2.3 Using software\napplications\nskills\n2.4 Conducting risk\nassessment\n\n3. Maintain/\n3.1 Maintenance of\n3.1 Awareness on\n3.1 Performing basic\n\n--- PDF PAGE 21 ---\nTESDA-SOP-QSO-01-F08\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR - MEDICAL CODING AND CLAIMS PROCESSING NC III (Amended) Promulgated June 16, 2015\n Page 19\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\nenhance\nrelevant\ntechnology\ntechnology is applied in\naccordance with the\nindustry standard\noperating procedure,\nmanufacturer’s\noperating guidelines\nand occupational\nhealth and safety\nprocedure to ensure its\noperative ability\n3.2 Updating of technology\nis maintained through\ncontinuing education or\ntraining in accordance\nwith job requirement\n3.3 Technology failure/\ndefect is immediately\nreported to the\nconcern/responsible\nperson or section for\nappropriate action\ntechnology and\nits function\n3.2 Repair and\nmaintenance\nprocedure\n3.3 Health and safety\nprocedure\n3.4 Company policy\nin relation to\nrelevant\ntechnology\n3.6 Upgrading of\ntechnology\n3.7 Organizational\nset-up/work flow\n\ntroubleshooting\nskills\n3.2 Identifying\nfailures or\ndefects\n3.3 Communication\nskills\n3.4 Applying\ncorrective and\npreventive\nmaintenance\n\n--- PDF PAGE 22 ---\nTESDA-SOP-QSO-01-F08\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR - MEDICAL CODING AND CLAIMS PROCESSING NC III (Amended) Promulgated June 16, 2015\n Page 20\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Technology\nMay include but are not limited to:\n1.1 Office technology\n1.2 Industrial technology\n1.3 System technology\n1.4 Information technology\n1.5 Training technology\n2. Management concepts\nMay include but not limited to:\n2.1 Real Time Management\n2.2 KAIZEN or continuous improvement\n2.3 5s\n2.1 Total Quality Management\n2.2 Other management/productivity tools\n3. Industry standard operating\nprocedure\n3.1 Written guidelines relative to the usage of\noffice technology/equipment\n3.2 Verbal advise/instruction from the co-worker\n4. Manufacturer’s operating\nguidelines/ instructions\n4.1 Written instruction/manuals of specific\ntechnology/ equipment\n4.2 General instruction manual\n4.3 Verbal advise from manufacturer relative to\nthe operation of equipment\n5. Occupational health and\nsafety procedure\n5.1 Relevant statutes on OHS\n5.2 Company guidelines in using\n technology/equipment\n6. Appropriate action\n6.1 Implementing preventive maintenance\nschedule\n6.2 Coordinating with manufacturer’s technician\n\n--- PDF PAGE 23 ---\nTESDA-SOP-QSO-01-F08\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR - MEDICAL CODING AND CLAIMS PROCESSING NC III (Amended) Promulgated June 16, 2015\n Page 21\n\nEVIDENCE GUIDE\n\n2\n1. Critical aspects\nof Competency\nAssessment requires evidence that the candidate:\n1.1 Studied and selected appropriate technology\nconsistent with work requirements\n1.2 Applied relevant technology\n1.3 Maintained and enhanced operative ability of relevant\ntechnology\n2. Resource\nImplications\nThe following resources MUST be provided:\n2.1 Relevant technology\n2.2 Interview and demonstration questionnaires\n2.3 Assessment packages\n3. Methods of\nAssessment\nCompetency must be assessed through:\n3.1 Interview\n3.2 Actual demonstration\n3.3 Authenticated portfolio (related certificates of\ntraining/seminar)\n4. Context for\nAssessment\n4.1 Competency may be assessed in actual workplace or\nsimulated environment\n\n--- PDF PAGE 24 ---\nTESDA-SOP-QSO-01-F08\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR - MEDICAL CODING AND CLAIMS PROCESSING NC III (Amended) Promulgated June 16, 2015\n Page 22\nCOMMON COMPETENCIES\n\nUNIT TITLE\n:\nAPPLY QUALITY STANDARDS\nUNIT CODE\n:"
