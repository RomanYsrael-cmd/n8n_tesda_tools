        "source_text": "ICT325303\nUNIT DESCRIPTOR :\nThis unit covers the skills, knowledge and attitude necessary to\nmanage medical claims. It covers managing account\nreceivable, denials/ rejections and underpaid medical claims.\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED KNOWLEDGE\nREQUIRED SKILLS\n1. Manage\naccount\nreceivable\n1.1. Processed and\nsubmitted claims are\ntracked and monitored\nbased on enterprise or\nclient requirements\n1.2. Pending claims are\nfollowed-up from payer\nand/or patient in\naccordance with\nenterprise policy\n1.3. Supporting documents\nare Identified and\nrequested from the\nmedical provider based\non payer requirements\n(when necessary)\n1.4. Posting of payments\nare performed in\naccordance with\nenterprise/client’s policy\n\n1.1. Medical Terminology\n• Systems of the\nbody (e.g., skeletal,\nrespiratory,\ncardiovascular)\n• Human anatomy\n• Human physiology\n• Fundamental\nnature of a disease\nprocess, signs,\nsymptoms and\nmethods of\ntreatment\n• Common medical\nconditions\n• Medical\ninvestigations and\nprocedures\n• Injuries\n• Common\nabbreviations for\nmedical and\npharmacological\nterms (e.g., BCG,\nHRT)\n• Common\nmedications\n• Commonly used\nmedical equipment\nand instruments\n• Laboratory testing\nmethods\n• Diagnostic and\nsurgical procedures\n• Laboratory values\nand significance\n• Medico-legal\nterminology\n1.2. Medical\nDocumentation\n1.3. Medical claim\nprocess\n1.4. Healthcare Laws and\nEthics\n• Analytical skills\n• Reading and\ncomprehension\nskills\n• Researching\nskills\n• Basic\nmathematical\nskills\n• Communication\nskills\n• Computer skills\n\n--- PDF PAGE 40 ---\nTESDA-SOP-QSO-01-F08\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR - MEDICAL CODING AND CLAIMS PROCESSING NC III (Amended) Promulgated June 16, 2015\