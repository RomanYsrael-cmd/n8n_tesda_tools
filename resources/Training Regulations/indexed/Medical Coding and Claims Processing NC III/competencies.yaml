LEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED KNOWLEDGE\nREQUIRED SKILLS\n1. Manage\naccount\nreceivable\n1.1. Processed and\nsubmitted claims are\ntracked and monitored\nbased on enterprise or\nclient requirements\n1.2. Pending claims are\nfollowed-up from payer\nand/or patient in\naccordance with\nenterprise policy\n1.3. Supporting documents\nare Identified and\nrequested from the\nmedical provider based\non payer requirements\n(when necessary)\n1.4. Posting of payments\nare performed in\naccordance with\nenterprise/client’s policy\n\n1.1. Medical Terminology\n• Systems of the\nbody (e.g., skeletal,\nrespiratory,\ncardiovascular)\n• Human anatomy\n• Human physiology\n• Fundamental\nnature of a disease\nprocess, signs,\nsymptoms and\nmethods of\ntreatment\n• Common medical\nconditions\n• Medical\ninvestigations and\nprocedures\n• Injuries\n• Common\nabbreviations for\nmedical and\npharmacological\nterms (e.g., BCG,\nHRT)\n• Common\nmedications\n• Commonly used\nmedical equipment\nand instruments\n• Laboratory testing\nmethods\n• Diagnostic and\nsurgical procedures\n• Laboratory values\nand significance\n• Medico-legal\nterminology\n1.2. Medical\nDocumentation\n1.3. Medical claim\nprocess\n1.4. Healthcare Laws and\nEthics\n• Analytical skills\n• Reading and\ncomprehension\nskills\n• Researching\nskills\n• Basic\nmathematical\nskills\n• Communication\nskills\n• Computer skills\n\n--- PDF PAGE 40 ---\nTESDA-SOP-QSO-01-F08\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR - MEDICAL CODING AND CLAIMS PROCESSING NC III (Amended) Promulgated June 16, 2015\n Page 38\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED KNOWLEDGE\nREQUIRED SKILLS\n1.5. Essential of\nhealthcare insurance\n1.6. Medical Coding\nSystems include but\nnot limited to:\n• Diagnosis code set\n• Procedure code set\n• Supplies Code set\n1.7. Client-specific\nguidelines and\ncoding and claims\nprocessing standards\n1.8. 5S and 3Rs\n2. Manage\ndenied/\nrejected\nclaims\n2.1. Denied/ Rejected\nclaims are reviewed\nbased on the\nexplanation of benefits\nfrom the insurance\ncompany.\n2.2. Reasons for\ndenial/rejections are\nverified with payer’s\nadjusters in line with\nenterprise policy.\n2.3. Necessary adjustments\nare made based on the\nexplanation of benefits\nfrom the insurance\ncompany.\n2.4. Supporting documents\nare Identified and\nrequested from the\nmedical provider based\non the payer\nrequirements.\n2.5. Adjusted claims are re-\nsubmitted in compliance\nwith payer’s\nrequirements\n2.1. Medical\nTerminologies\n2.2. Medical\nDocumentation\n2.3. Medical claim\nprocess\n2.4. Healthcare Laws\nand Ethics\n2.5. Essential of\nhealthcare insurance\n2.6. Medical Coding\nSystems\n• Diagnosis Code set\n• Procedure Code set\n• Supplies Code set\n2.7. Client’s specific\nguidelines / Coding\nand claims\nstandards\n2.8. 5S and 3Rs\n• Analytical skills\n• Reading and\ncomprehension\nskills\n• Researching\nskills\n• Basic\nmathematical\nskills\n• Communication\nskills\n• Computer skills\n\n3. Manage\nunderpaid\nclaims\n3.1 Underpaid claims are\nreviewed based on the\nexplanation of benefits\nfrom the insurance\ncompany.\n3.2 Reasons for\nunderpayment are\nverified with payer’s\nadjusters in line with\nenterprise policy.\n3.1 Medical\nTerminologies\n3.2 Medical\nDocumentation\n3.3 Medical claim\nprocess\n3.4 Healthcare Laws and\nEthics\n3.5 Essential of\nhealthcare insurance\n• Analytical skills\n• Reading and\ncomprehension\nskills\n• Researching\nskills\n• Basic\nmathematical\nskills\n\n--- PDF PAGE 41 ---\nTESDA-SOP-QSO-01-F08\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR - MEDICAL CODING AND CLAIMS PROCESSING NC III (Amended) Promulgated June 16, 2015\n Page 39\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED KNOWLEDGE\nREQUIRED SKILLS\n3.3 Supporting documents\nare prepared based on\npayer requirements.\n3.4 Underpaid claims are re-\nsubmitted together with\nappeal request in line\nwith enterprise/client’s\npolicy.\n\n3.6 Medical Coding\nSystems\n• Diagnosis Code set\n• Procedure Code Set\n• Supplies Code set\n3.7 Client’s specific\nguidelines / Coding\nand Claims\nStandards\n3.8 5S and 3Rs\n• Communication\nskills\n• Computer skills\n\n--- PDF PAGE 42 ---\nTESDA-SOP-QSO-01-F08\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR - MEDICAL CODING AND CLAIMS PROCESSING NC III (Amended) Promulgated June 16, 2015\n Page 40\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Supporting documents\nMay include but not limited to:\n• Patient’s record (diagnostic examination result)\n• Medical provider’s notes\n• Diagnoses code set, procedure code set and supplies\ncode set\n•\nBilling record\n2. Posting of payments\nMay be classified as:\n• fully paid\n• under paid\n• rejected or denied\n3. Rejected claims\nMay be caused by but not limited to:\n• Incomplete/incorrect patient information\n• Illegible/unreadable documents\n• Incorrect medical codes\n•\nIncomplete/incorrect providers information\n4. Reasons for\nunderpayment\nMay include but not limited to:\n• Medically unnecessary procedure, supplies and/or\nequipment\n• Not covered by benefit plan\n• Exceeded coverage plan\n• Unauthorized procedure, supplies and/or equipment\n• Duplicate billing\n•\nBundled medical procedure codes\n\nEVIDENCE GUIDE\n\n1.\nCritical aspects\nof competency\nAssessment must show that the candidate:\n1.1.\nManaged account receivable\n1.2.\nManaged rejection/denials\n1.3.\nManaged underpayment\n2.\nMethods of\nassessment\nThe following may be used to objectively assess the\ncandidate:\n2.1. Demonstration with oral Questioning\n2.2. Written test\n2.3.\nPortfolio with interview\n3.\nResource\nimplication\nThe following resources May be provided:\n5.1\ndiagnosis coding manuals\n5.2\nProcedures/Services and supplies coding Manuals and/or\ntheir equivalent\n5.3\nMockup/Sample Medical documentation\n4.\nContext of\nAssessment\nAssessment may be conducted in the workplace or in a\nsimulated environment.\n\n--- PDF PAGE 43 ---\nTESDA-SOP-QSO-01-F08\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR - MEDICAL CODING AND CLAIMS PROCESSING NC III (Amended) Promulgated June 16, 2015\n Page 41"
