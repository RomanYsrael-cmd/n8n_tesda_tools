        "source_text": "--- PDF PAGE 24 ---\nTESDA-SOP-QSO-01-F08 \n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ \nTR - MEDICAL CODING AND CLAIMS PROCESSING NC III (Amended)      Promulgated June 16, 2015 \n                Page 22  \nCOMMON COMPETENCIES \n \nUNIT TITLE \n: \nAPPLY QUALITY STANDARDS \nUNIT CODE \n: \nELC315202 \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge, skills, (and) attitudes and \nvalues needed to apply quality standards in the workplace.  The \nunit also includes the application of relevant safety procedures \nand regulations, organization procedures and customer \nrequirements \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized Bold terms are elaborated \nin the Range of Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n1. Assess \nquality of \nreceived \nmaterials or \ncomponents \n1.1. Work instructions are \nobtained and work is \ncarried out in accordance \nwith standard operating \nprocedures \n1.2. Received materials or \ncomponent parts are \nchecked against \nworkplace standards and \nspecifications \n1.3. Faulty material or \ncomponents related to \nwork are identified and \nisolated \n1.4. Faults and any identified \ncauses are recorded \nand/or reported to the \nsupervisor concerned in \naccordance with \nworkplace procedures \n1.5. Faulty materials or \ncomponents are replaced \nin accordance with \nworkplace procedures\n1.1 Relevant \nproduction \nprocesses, \nmaterials and \nproducts \n1.2 Characteristics \nof materials, \nsoftware and \nhardware used \nin production \nprocesses \n1.3 Quality checking \nprocedures \n1.4 Quality \nWorkplace \nprocedures  \n1.5 Identification of \nfaulty materials \nrelated to work \n1.1. Reading skills \nrequired to \ninterpret work \ninstruction \n1.2. Critical thinking \n1.3. Interpreting \nwork \ninstructions \n2. Assess own \nwork \n2.1. Documentation relative to \nquality within the company \nis identified and used \n2.2. Completed work is \nchecked against \nworkplace standards \nrelevant to the task \nundertaken \n2.3. Errors  are identified and \nisolated \n2.4. Information on the quality \nand other indicators of \nproduction performance is \nrecorded in accordance \nwith workplace procedures\n2.1 Safety and \nenvironmental \naspects of \nproduction \nprocesses \n2.2 Fault \nidentification and \nreporting  \n2.3 Workplace \nprocedure in \ndocumenting \ncompleted work \n2.4 Workplace \nQuality Indicators\n2.1 Carry out work \nin accordance \nwith OHS \npolicies and \nprocedures\n\n--- PDF PAGE 25 ---\nTESDA-SOP-QSO-01-F08 \n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ \nTR - MEDICAL CODING AND CLAIMS PROCESSING NC III (Amended)      Promulgated June 16, 2015 \n                Page 23  \nELEMENT \nPERFORMANCE CRITERIA \nItalicized Bold terms are elaborated \nin the Range of Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n2.5. Deviations from specified \nquality standards, \ncauses are documented \nand reported in \naccordance with the \nworkplace’ standards \noperating procedures\n3. Engage in \nquality \nimprovement \n3.1. Process improvement \nprocedures are \nparticipated in relation to \nworkplace assignment \n3.2. Work is carried out in \naccordance with process \nimprovement procedures \n3.3. Performance of operation \nor quality of product or \nservice to ensure \ncustomer satisfaction is \nmonitored \n3.1  Quality \nimprovement \nprocesses \n3.2  Company \ncustomers \ndefined \n3.1 Solution \nproviding and \ndecision-making \n3.2  Practice \ncompany \nprocess \nimprovement \nprocedure\n\n--- PDF PAGE 26 ---\nTESDA-SOP-QSO-01-F08 \n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ \nTR - MEDICAL CODING AND CLAIMS PROCESSING NC III (Amended)      Promulgated June 16, 2015 \n                Page 24  \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Materials/components \n1.1.  Materials may include but not limited to: \n1.1.1. wires \n1.1.2. cables, soldering lead \n1.1.3. electrical tape \n1.2. Components may include but not limited to: \n1.2.1. ICs \n1.2.2. Diodes \n2. Faults \nFaults may include but not limited to: \n2.1. Components/materials not according to \nspecification \n2.2. Components/materials contain manufacturing \ndefects \n2.3. Components/materials do not conform with \ngovernment regulation i.e., PEC, environmental \ncode \n2.4. Components/materials have safety defect \n3. Documentation \n3.1. Organization work procedures \n3.2. Manufacturer’s instruction manual \n3.3. Customer requirements \n3.4. Forms \n4. Errors \n4.1. Errors may be related  but not limited to the \nfollowing: \n4.1.1. Deviation from the requirements of the \nClient  \n4.1.2. Deviation from the requirement of the \norganization \n5. Quality standards \n5.1. Quality standards may relate but not limited to \nthe following: \n5.1.1. materials \n5.1.2. component parts \n5.1.3. final product \n5.1.4. production processes \n5.1.5. customer service \n6. Customer \n6.1. Co-worker \n6.2. Supplier \n6.3. Client \n6.4. Organization receiving the product or service\n\n--- PDF PAGE 27 ---\nTESDA-SOP-QSO-01-F08 \n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ \nTR - MEDICAL CODING AND CLAIMS PROCESSING NC III (Amended)      Promulgated June 16, 2015 \n                Page 25  \n \nEVIDENCE GUIDE \n \n1. Critical aspect of \ncompetency \nAssessment requires evidence that the candidate: \n \n1.1. Carried out work in accordance with the \ncompany’s standard operating procedures \n1.2. Performed task according to specifications \n1.3. Reported defects detected in accordance with \nstandard operating procedures \n1.4. Carried out work in accordance with the process \nimprovement procedures \n2. Method of assessment \n2.1. The assessor may select two (2) of the following \nassessment methods to objectively assess the \ncandidate: \n2.1.1. Observation \n2.1.2. Questioning \n2.1.3. Practical demonstration \n3. Resource implication \n \n3.1. Materials and component parts and equipment to \nbe used in a real or simulated electronic \nproduction situation \n4. Context of Assessment \n \n4.1. Assessment may be conducted in the workplace \nor in a simulated work environment.\n",
