m with\ngovernment regulation i.e., PEC, environmental\ncode\n2.4. Components/materials have safety defect\n3. Documentation\n3.1. Organization work procedures\n3.2. Manufacturer’s instruction manual\n3.3. Customer requirements\n3.4. Forms\n4. Errors\n4.1. Errors may be related but not limited to the\nfollowing:\n4.1.1. Deviation from the requirements of the\nClient\n4.1.2. Deviation from the requirement of the\norganization\n5. Quality standards\n5.1. Quality standards may relate but not limited to\nthe following:\n5.1.1. materials\n5.1.2. component parts\n5.1.3. final product\n5.1.4. production processes\n5.1.5. customer service\n6. Customer\n6.1. Co-worker\n6.2. Supplier\n6.3. Client\n6.4. Organization receiving the product or service\n\n--- PDF PAGE 27 ---\nTESDA-SOP-QSO-01-F08\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR - MEDICAL CODING AND CLAIMS PROCESSING NC III (Amended) Promulgated June 16, 2015\n Page 25\n\nEVIDENCE GUIDE\n\n1. Critical aspect of\ncompetency\nAssessment requires evidence that the candidate:\n\n1.1. Carried out work in accordance with the\ncompany’s standard operating procedures\n1.2. Performed task according to specifications\n1.3. Reported defects detected in accordance with\nstandard operating procedures\n1.4. Carried out work in accordance with the process\nimprovement procedures\n2. Method of assessment\n2.1. The assessor may select two (2) of the following\nassessment methods to objectively assess the\ncandidate:\n2.1.1. Observation\n2.1.2. Questioning\n2.1.3. Practical demonstration\n3. Resource implication\n\n3.1. Materials and component parts and equipment to\nbe used in a real or simulated electronic\nproduction situation\n4. Context of Assessment\n\n4.1. Assessment may be conducted in the workplace\nor in a simulated work environment.\n\n--- PDF PAGE 28 ---\nTESDA-SOP-QSO-01-F08\n---------