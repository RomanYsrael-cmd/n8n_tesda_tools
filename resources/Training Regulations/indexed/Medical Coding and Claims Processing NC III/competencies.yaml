        "source_text": "--- PDF PAGE 13 ---\nTESDA-SOP-QSO-01-F08 \n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ \nTR - MEDICAL CODING AND CLAIMS PROCESSING NC III (Amended)      Promulgated June 16, 2015 \n                Page 11  \nUNIT OF COMPETENCY : \nSOLVE PROBLEMS RELATED TO WORK ACTIVITIES  \nUNIT CODE \n:    500311112 \nUNIT DESCRIPTOR \n: \nThis unit of covers the knowledge, skills and attitudes \nrequired to solve problems in the workplace including the \napplication of problem solving techniques and to determine \nand resolve the root cause of problems. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in \nthe  Range of Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Identify the \nproblem \n1.1. Variances are identified \nfrom normal operating \nparameters; and product \nquality \n1.2. Extent, cause and nature \nof the problem are defined \nthrough observation, \ninvestigation and \nanalytical techniques  \n1.3. Problems are clearly \nstated and specified \n \n1.1. Competence includes \na thorough \nknowledge and \nunderstanding of the \nprocess, normal \noperating \nparameters, and \nproduct quality to \nrecognize non-\nstandard situations \n1.2. Competence to \ninclude the ability to \napply and explain, \nsufficient for the \nidentification of \nfundamental cause, \ndetermining the \ncorrective action and \nprovision of \nrecommendations \n1.2.1. Relevant \nequipment and \noperational \nprocesses \n1.2.2. Enterprise \ngoals, targets \nand measures \n1.2.3. Enterprise \nquality, OHS \nand \nenvironmental \nrequirement \n1.2.4. Enterprise \ninformation \nsystems and \ndata collation \n1.2.5. Industry codes \nand standards \n1.3. Normal operating \nparameters and \nproduct quality \n1.4. Identifying and \nclarifying the nature \nof problem \n1.1  Using range \nof formal \nproblem \nsolving \ntechniques \n1.2  Identifying \nand clarifying \nthe nature of \nthe problem \n1.3  Evaluating \nthe \neffectiveness \nof a present \nprocess in \nthe galley \n1.4  Applying \nanalytical \ntechniques\n\n--- PDF PAGE 14 ---\nTESDA-SOP-QSO-01-F08 \n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ \nTR - MEDICAL CODING AND CLAIMS PROCESSING NC III (Amended)      Promulgated June 16, 2015 \n                Page 12  \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in \nthe  Range of Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n2. Determine \nfundamental \ncauses of the \nproblem  \n2.1 Possible causes are \nidentified based on \nexperience and the use of \nproblem solving tools / \nanalytical techniques. \n2.2 Possible cause statements \nare developed based on \nfindings \n2.3 Fundamental causes are \nidentified per results of \ninvestigation conducted \n \n2.1 Relevant equipment \nand operational \nprocesses \n2.2 Enterprise goals, \ntargets and measures\n2.3 Enterprise quality, \nOHS and \nenvironmental \nrequirements \n2.4 Enterprise \ninformation systems \nand data collation \n2.5 Industry codes and \nstandards \n2.1  Analysis of \nroot causes \n3. Determine \ncorrective action \n3.1 All possible options are \nconsidered for resolution of \nthe problem \n3.2 Strengths and weaknesses \nof possible options are \nconsidered \n3.3 Corrective actions are \ndetermined to resolve the \nproblem and possible \nfuture causes \n3.4 Action plans are \ndeveloped identifying \nmeasurable objectives, \nresource needs and \ntimelines in accordance \nwith safety and operating \nprocedures \n \n3.1 Understanding the \nprocedure in \nundertaking \ncorrective action \n3.2 Principles of decision \nmaking strategies \nand techniques \n3.3 Enterprise \ninformation systems \nand data collation \n3.4 Action planning \n3.1 Identifying \nand clarifying \nthe nature of \nthe problem \n3.2 Devising the \nbest solution \n3.3 Evaluating \nthe solution \n3.4 Implementing  \ndeveloped \nplan to rectify \nthe problem  \n3.5 Implementing \ncorrective \nand \npreventive \nactions \nbased on \nroot cause \nanalysis \n4. Provide \nrecommendation/s \nto manager \n4.1 Reports on \nrecommendations are \nprepared according to \nprocedures. \n4.2 Recommendations are \npresented to appropriate \npersonnel. \n4.3 Recommendations are \nfollowed-up, if required \n4.1 How to make a report \nand recommendation \n4.1 Writing report \nand \nrecommenda\ntions\n\n--- PDF PAGE 15 ---\nTESDA-SOP-QSO-01-F08 \n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ \nTR - MEDICAL CODING AND CLAIMS PROCESSING NC III (Amended)      Promulgated June 16, 2015 \n                Page 13  \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Analytical techniques \n1.1. \nBrainstorming \n1.2. \nCause and effect diagrams \n1.3. \nPareto analysis \n1.4. \nSWOT analysis \n1.5. \nGant chart, Pert CPM and graphs \n1.6. \nScattergrams  \n2. Problem \n \n2.1. \nNon – routine process and quality problems \n2.2. \nEquipment selection, availability and failure \n2.3. \nTeamwork and work allocation problem \n2.4. \nSafety and emergency situations and \nincidents \n3. Action plans  \n \n3.1. \nPriority requirements \n3.2. \nMeasurable objectives \n3.3. \nResource requirements \n3.4. \nTimelines \n3.5. \nCo-ordination and feedback requirements \n3.6. \nSafety requirements \n3.7. \nRisk assessment \n3.8. \nEnvironmental requirements\n\n--- PDF PAGE 16 ---\nTESDA-SOP-QSO-01-F08 \n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ \nTR - MEDICAL CODING AND CLAIMS PROCESSING NC III (Amended)      Promulgated June 16, 2015 \n                Page 14  \nEVIDENCE GUIDE \n \n1. Critical aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1. \nIdentified the problem \n1.2. \nDetermined the fundamental causes of the problem \n1.3. \nDetermined the correct / preventive action \n1.4. \nProvided recommendation to manager \nThese aspects may be best assessed using a range of \nscenarios / case studies / what ifs as a stimulus with a \nwalk through forming part of the response. These \nassessment activities should include a range of problems, \nincluding new, unusual and improbable situations that may \nhave happened. \n2. Resource \nImplications \n2.1. \nAssessment will require access to an operating \nplant over an extended period of time, or a suitable \nmethod of gathering evidence of operating ability \nover a range of situations. A bank of scenarios / \ncase studies / what ifs will be required as well as \nbank of questions which will be used to probe the \nreason behind the observable action.  \n3.  Methods of \nAssessment \nCompetency in this unit may be assessed through: \n3.1. Written Examination \n3.2. Oral Questioning \n3.3. Portfolio  \n \n4. Context for \nAssessment \n4.1. \nIn all workplace, it may be appropriate to assess \nthis unit concurrently with relevant teamwork or \noperation units.\n",
