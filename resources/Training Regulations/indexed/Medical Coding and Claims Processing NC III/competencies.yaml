rer’s instruction manual \n3.3. Customer requirements \n3.4. Forms \n4. Errors \n4.1. Errors may be related  but not limited to the \nfollowing: \n4.1.1. Deviation from the requirements of the \nClient  \n4.1.2. Deviation from the requirement of the \norganization \n5. Quality standards \n5.1. Quality standards may relate but not limited to \nthe following: \n5.1.1. materials \n5.1.2. component parts \n5.1.3. final product \n5.1.4. production processes \n5.1.5. customer service \n6. Customer \n6.1. Co-worker \n6.2. Supplier \n6.3. Client \n6.4. Organization receiving the product or service\n\n--- PDF PAGE 27 ---\nTESDA-SOP-QSO-01-F08 \n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ \nTR - MEDICAL CODING AND CLAIMS PROCESSING NC III (Amended)      Promulgated June 16, 2015 \n                Page 25"
