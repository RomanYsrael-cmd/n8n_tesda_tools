---------------------------------------- \nTR - MEDICAL CODING AND CLAIMS PROCESSING NC III (Amended)      Promulgated June 16, 2015 \n                Page 31  \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in \nthe Range of Variables\nREQUIRED KNOWLEDGE \nREQUIRED SKILLS \nand instruments \n Laboratory testing \nmethods \n Diagnostic and \nsurgical procedures \n Laboratory values \nand significance \n Medico-legal \nterminology \n2.2. Client’s specific \nguidelines/ coding \nstandards \n2.3. Medical \nDocumentation \n2.4. Healthcare Laws \nand Ethics \n2.5. Essential of \nhealthcare insurance\n2.6. Medical Coding \nSystems  \n3. Assign codes \n3.1 Medical terms to be \nreported are searched \nor located in the \nAlphabetic index of the \nappropriate coding \nreference/s  \n3.2 Code numbers are \nverified using the \ntabular list of the coding \nmanual \n3.3 Verified medical code \nor codes are assigned \nto the highest level of \ndetails in line with \ncoding standards and \nguidelines  \n3.4 Unclear/Questionable \ncases are clarified with \nappropriate resource \nperson/s in line with \nenterprise procedures \n3.5 Coding information/ \nrequirements are \nverified for \ncompleteness of data \nbased on the required \nfields prior to \nsubmission\n3.2 Medical \nTerminologies  \n3.3 Medical \nDocumentation \n3.4 Healthcare Laws \nand Ethics \n3.5 Essential of \nhealthcare insurance\n Diagnosis code \nset \n Procedure code \nset \n supplies code set \n3.6 Client’s specific \nguidelines/coding \nstandards \n3.7 5S and 3Rs \n Analytical skills \n Reading and \ncomprehension \nskills \n Research skills  \n Communication \nskills \n Computer skills\n\n--- PDF PAGE 34 ---\nTESDA-SOP-QSO-01-F08 \n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ \nTR - MEDICAL CODING AND CLAIMS PROCESSING NC III (Amended)      Promulgated June 16, 2015 \n                Page 32  \nRANGE OF VARIABLES \n \nVARIABLE  \nRANGE \n1. Coding tools \nMay include but not limited to: \n electronic copy \nhard copy\n2. Medical coding system \nMedical coding systems include but not limited to: \n International Classification of Diseases  \n Current Procedural Terminology \n Healthcare Common Procedure Coding \nSystem\n3. Completeness  \nMay include but not limited to: \n quantitative (completeness of data), and  \n\nqualitative (consistency of data) analysis \n4. Medical information \nMay include but not limited to: \n Patient \n Provider \n Payor \n5. coding references \nMay include but not limited to: \n Electronic reference \no ICD codes \no CPT codes \no HCPCS  \n Hard copy  \no ICD codes \no CPT codes \no\nHCPCS \n6. medical codes \nMay include but not limited to: \n diagnoses codes \n codes for procedures and services \no ICD procedure codes \no CPT Procedure codes \n codes for supplies, equipment and others \nservices\n\n--- PDF PAGE 35 ---\nTESDA-SOP-QSO-01-F08 \n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ \nTR - MEDICAL CODING AND CLAIMS PROCESSING NC III (Amended)      Promulgated June 16, 2015 \n                Page 33"
