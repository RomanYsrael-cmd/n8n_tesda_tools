        "source_text": "ELC315202\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills, (and) attitudes and\nvalues needed to apply quality standards in the workplace. The\nunit also includes the application of relevant safety procedures\nand regulations, organization procedures and customer\nrequirements\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized Bold terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1. Assess\nquality of\nreceived\nmaterials or\ncomponents\n1.1. Work instructions are\nobtained and work is\ncarried out in accordance\nwith standard operating\nprocedures\n1.2. Received materials or\ncomponent parts are\nchecked against\nworkplace standards and\nspecifications\n1.3. Faulty material or\ncomponents related to\nwork are identified and\nisolated\n1.4. Faults and any identified\ncauses are recorded\nand/or reported to the\nsupervisor concerned in\naccordance with\nworkplace procedures\n1.5. Faulty materials or\ncomponents are replaced\nin accordance with\nworkplace procedures\n1.1 Relevant\nproduction\nprocesses,\nmaterials and\nproducts\n1.2 Characteristics\nof materials,\nsoftware and\nhardware used\nin production\nprocesses\n1.3 Quality checking\nprocedures\n1.4 Quality\nWorkplace\nprocedures\n1.5 Identification of\nfaulty materials\nrelated to work\n1.1. Reading skills\nrequired to\ninterpret work\ninstruction\n1.2. Critical thinking\n1.3. Interpreting\nwork\ninstructions\n2. Assess own\nwork\n2.1. Documentation relative to\nquality within the company\nis identified and used\n2.2. Completed work is\nchecked against\nworkplace standards\nrelevant to the task\nundertaken\n2.3. Errors are identified and\nisolated\n2.4. Information on the quality\nand other indicators of\nproduction performance is\nrecorded in accordance\nwith workplace procedures\n2.1 Safety and\nenvironmental\naspects of\nproduction\nprocesses\n2.2 Fault\nidentification and\nreporting\n2.3 Workplace\nprocedure in\ndocumenting\ncompleted work\