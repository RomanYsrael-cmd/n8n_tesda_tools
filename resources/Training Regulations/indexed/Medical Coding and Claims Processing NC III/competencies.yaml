  "source_section_text": "SECTION 2:\nCOMPETENCY STANDARDS\n\nThis section gives the details of the contents of the basic, common, and core units\nof competency required for MEDICAL CODING AND CLAIMS PROCESSING NC III.\n\nBASIC COMPETENCIES\n\nUNIT OF COMPETENCY : LEAD WORKPLACE COMMUNICATION\n\nUNIT CODE\n : 500311109\n\n UNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes required\nto lead in the dissemination and discussion of ideas,\ninformation and issues in the workplace.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1. Communicate\ninformation\nabout\nworkplace\nprocesses\n1.1. Appropriate\ncommunication method\nis selected\n1.2. Multiple operations\ninvolving several topics\nareas are communicated\naccordingly\n1.3. Questions are used to gain\nextra information\n1.4. Correct sources of\ninformation are identified\n1.5. Information is selected and\norganized correctly\n1.6. Verbal and written\nreporting is undertaken\nwhen required\n1.7. Communication skills are\nmaintained in all situations\n1.1. Organization\nrequirements for\nwritten and\nelectronic\ncommunication\nmethods\n1.2. Effective verbal\ncommunication\nmethods\n1.3. Methods of\nCommunication\n1.4. Types of\nQuestion\n1.5. Communication\nTools\n1.6. Questioning\nTechniques\n1.1. Organizing\ninformation\n1.2. Understanding and\nconveying intended\nmeaning\n1.3. Participating in\nvariety of workplace\ndiscussions\n1.4. Complying with\norganization\nrequirements for\nthe use of written\nand electronic\ncommunication\nmethods\n1.5. Reporting\noccupational\nhazards during\nsafety meeting\n2. Lead\nworkplace\ndiscussions\n2.1. Response to workplace\nissues are sought\n2.2. Response to workplace\nissues are provided\nimmediately\n2.3. Constructive contributions\nare made to workplace\ndiscussions on such issues\nas production, quality and\nsafety\n2.4. Goals/objectives and\naction plan are undertaken\nin the workplace are\ncommunicated\n2.1 Leading as a\nmanagement\nfunction\n2.2 Barriers of\ncommunication\n2.3 Effective verbal\ncommunication\nmethods\n2.4 Method/technique\ns of discussion\n2.5 How to lead\ndiscussion\n2.6 How to solicit\nresponse\n2.7 Goal setting and\naction planning\n2.1 Communicating\neffectively\n2.2 Consulting the\ncrew on the\nprepared menu for\nthe month\n\n--- PDF PAGE 5 ---\nTESDA-SOP-QSO-01-F08\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR - MEDICAL CODING AND CLAIMS PROCESSING NC III (Amended) Promulgated June 16, 2015\n Page 3\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n3. Identify and\ncommunicate\nissues arising\nin the\nworkplace\n3.1\nIssues and problems are\nidentified as they arise\n3.2\nInformation regarding\nproblems and issues are\norganized coherently to\nensure clear and effective\ncommunication\n3.3\nDialogue is initiated with\nappropriate personnel\n3.4\nCommunication problems\nand issues are raised as\nthey arise\n\n3.1 Types of issues\nand problems in\nthe workplace\n3.2 Written and\nelectronic\ncommunication\nmethods\n3.3 Communication\nbarriers affecting\nworkplace\ndiscussions\n3.1 Identifying cause\nof problems\n3.2 Communicating\nwith the Master of\nthe Ship on the\npossible shortage\nof the food supply\ndue to change of\nship’s port\n3.3 Identifying\nproblems and\nissues\n3.4 Organizing\ninformation on\nproblems and\nissues\n3.5 Relating problems\nand issues of call/\nvoyage\n\n--- PDF PAGE 6 ---\nTESDA-SOP-QSO-01-F08\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR - MEDICAL CODING AND CLAIMS PROCESSING NC III (Amended) Promulgated June 16, 2015\n Page 4\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Methods of\ncommunication\n1.1. Non-verbal gestures\n1.2. Verbal\n1.3. Face to face\n1.4. Two-way radio\n1.5. Speaking to groups\n1.6. Using telephone\n1.7. Written\n1.8. Internet\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1.\nDealt with a range of communication/information at one\ntime\n1.2.\nMade constructive contributions in workplace issues\n1.3.\nSought workplace issues effectively\n1.4.\nResponded to workplace issues promptly\n1.5.\nPresented information clearly and effectively written form\n1.6.\nUsed appropriate sources of information\n1.7.\nAsked appropriate questions\n1.8.\nProvided accurate information\n2. Resource\nImplications\nThe following resources MUST be provided:\n2.1.\nVariety of Information\n2.2.\nCommunication tools\n2.3.\nSimulated workplace\n3. Methods of\nAssessment\nCompetency in this unit must be assessed through\n3.1.\nWritten Examination\n3.2.\nOral Questioning\n3.3.\nPortfolio\n4. Context for\nAssessment\n4.1.\nCompetency may be assessed in the workplace or in\nsimulated workplace environment\n\n--- PDF PAGE 7 ---\nTESDA-SOP-QSO-01-F08\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR - MEDICAL CODING AND CLAIMS PROCESSING NC III (Amended) Promulgated June 16, 2015\n Page 5\nUNIT OF COMPETENCY\n: LEAD SMALL TEAMS\nUNIT CODE\n : 500311110\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes to lead\nsmall teams including setting and maintaining team and\nindividual performance standards.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Provide team\nleadership\n1.1. Work requirements are\nidentified and presented\nto team members\n1.2. Reasons for instructions\nand requirements are\ncommunicated to team\nmembers\n1.3. Team members’ queries\nand concerns are\nrecognized, discussed\nand dealt with\n1.1. Company policies\nand procedures\n1.2 How performance\nexpectations are set\n1.3 Methods of\nMonitoring\nPerformance\n1.4 Client expectations\n1.5 Team member’s\nduties and\nresponsibilities\n1.6 Definition of Team\n1.7 Skills and techniques\nin promoting team\nbuilding\n1.8 Up-to-date\ndissemination of\ninstructions and\nrequirements to\nmembers\n1.9 Art of listening and\ntreating individual\nteam members\nconcern\n1.1. Communication\nskills required\nfor leading\nteams\n1.2. Team building\nskills\n1.3. Negotiating\nskills\n1.4. Evaluation skills\n2. Assign\nresponsibilities\n2.1 Duties, and\nresponsibilities are\nallocated having regard to\nthe skills, knowledge and\naptitude required to\nproperly undertake the\nassigned task and\naccording to company\npolicy\n2.2 Duties are allocated\nhaving regard to individual\npreference, domestic and\npersonal considerations,\nwhenever possible\n2.1 Concept of delegation\n2.2 How to delegate\n2.3 Understanding\nindividual differences\n2.4 Methods of\nmonitoring\nperformance\n2.5 Duties and\nresponsibilities of\neach team member\n2.6 Knowledge in\nidentifying each team\nmember duties and\nresponsibilities\n2.1 Delegating skills\n2.2 Identifying\nindividual skills,\nknowledge and\nattitude as basis\nfor allocating\nresponsibilities\n2.3 Identifying each\nteam member\nduties and\nresponsibilities\n3. Set\nperformance\nexpectations\nfor team\nmembers\n3.1\nPerformance\nexpectations are\nestablished based on\nclient needs and\naccording to assignment\nrequirements\n3.1 Definition of\nperformance\nindicators/ criteria\n3.2 Definition of team\ngoals and\nexpectations\n3.1 Identifying\nperformance\nindicators\n3.2 Evaluating\nperformance\n\n--- PDF PAGE 8 ---\nTESDA-SOP-QSO-01-F08\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR - MEDICAL CODING AND CLAIMS PROCESSING NC III (Amended) Promulgated June 16, 2015\n Page 6\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n3.2\nPerformance\nexpectations are based\non individual team\nmembers duties and area\nof responsibility\n3.3\nPerformance\nexpectations are\ndiscussed and\ndisseminated to\nindividual team members\n3.3 Methods of\nmonitoring\nperformance\n3.4 Client expectations\n3.5 Team members\nduties and\nresponsibilities\n3.6 Defining performance\nexpectations criteria\n3.3 Setting\nindividual\nperformance\ntarget/\nexpectation\nindicators\n4. Supervised\nteam\nperformance\n4.1\nMonitoring of\nperformance takes\nplace against defined\nperformance criteria\nand/or assignment\ninstructions and\ncorrective action taken if\nrequired\n4.2\nTeam members are\nprovided with feedback,\npositive support and\nadvice on strategies to\novercome any\ndeficiencies\n4.3\nPerformance issues\nwhich cannot be rectified\nor addressed within the\nteam are referenced to\nappropriate personnel\naccording to employer\npolicy\n4.4\nTeam members are kept\ninformed of any changes\nin the priority allocated to\nassignments or tasks\nwhich might impact on\nclient/customer needs\nand satisfaction\n4.5\nTeam operations are\nmonitored to ensure that\nemployer/client needs\nand requirements are\nmet\n4.6\nFollow-up communication\nis provided on all issues\naffecting the team\n4.7\nAll relevant\ndocumentation is\ncompleted in accordance\nwith company\nprocedures\n4.1 Understanding\nMonitoring of work\n4.2 How to undertake\ncorrective action\n4.3 Understanding\nfeedback and\nprocedure\n4.4 Feedback reporting\nprocedure\n4.5 Methods of\nmonitoring\nperformance\n4.6 Team member’s\nduties and\nresponsibilities\n4.7 Monitoring team\noperation to ensure\nclient needs and\nsatisfaction\n4.1 Monitoring skills\n4.2 Setting priorities\n4.3 Evaluating\nperformance\n4.4 Informal/ formal\ncounseling skills\n\n--- PDF PAGE 9 ---\nTESDA-SOP-QSO-01-F08\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR - MEDICAL CODING AND CLAIMS PROCESSING NC III (Amended) Promulgated June 16, 2015\n Page 7\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Work requirements\n1.1. Client Profile\n1.2. Assignment instructions\n2. Team member’s concerns\n2.1. Roster/shift details\n3. Monitor performance\n3.1. Formal process\n3.2. Informal process\n4. Feedback\n4.1. Formal process\n4.2. Informal process\n5. Performance issues\n5.1. Work output\n5.2. Work quality\n5.3. Team participation\n5.4. Compliance with workplace protocols\n5.5. Safety\n5.6. Customer service\n\nEVIDENCE GUIDE\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1. Maintained or improved individuals and/or team\nperformance given a variety of possible scenario\n1.2. Assessed and monitored team and individual\nperformance against set criteria\n1.3. Represented concerns of a team and individual to next\nlevel of management or appropriate specialist and to\nnegotiate on their behalf\n1.4. Allocated duties and responsibilities, having regard to\nindividual’s knowledge, skills and aptitude and the needs\nof the tasks to be performed\n1.5. Set and communicated performance expectations for a\nrange of tasks and duties within the team and provided\nfeedback to team members\n2. Resource\nImplications\nThe following resources MUST be provided:\n2.1. Access to relevant workplace or appropriately simulated\nenvironment where assessment can take place\n2.2.\nMaterials relevant to the proposed activity or task\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1. Written Examination\n3.2. Oral Questioning\n3.3.\nPortfolio\n4. Context for\nAssessment\n4.1. Competency assessment may occur in workplace or