  "source_text": "Section 1. Successful candidates shall be awarded a\nNational Certificate signed by the TESDA Director General.\n\n4.1.2 The qualification of Medical Coding and Claims Processing NC III may\nbe attained through:\n\n4.1.2.1 Accumulation of Certificates of Competency (COCs) in the\nfollowing competencies:\n\n4.1.2.1.1 Assign medical codes\n4.1.2.1.2 Perform medical claims/billing work\n•\nProcess medical claims/billing\n•\nManage medical claims\n\nSuccessful candidates shall be awarded a Certificate of\nCompetency (COC) in each of the core units.\n\n4.1.2.2 Demonstration of competence through project-type assessment\ncovering all the units required in the qualification.\n\n4.1.3 Accumulation and submission of all COCs acquired for the relevant units\nof competency comprising a qualification, an individual shall be issued the\ncorresponding National Certificate.\n\n4.1.4 Assessment shall focus on the core units of competency. The basic and\ncommon units shall be integrated or assessed concurrently with the core\nunits.\n\n4.1.5 The following are qualified to apply for assessment and certification:\n\n4.1.5.1 Graduate of formal, non-formal, and informal including enterprise-\nbased training programs and e-learning/online/distance learning\nprograms;\n\n4.1.5.2 Experienced workers (wage employed or self-employed).\n\n--- PDF PAGE 60 ---\nTESDA-SOP-QSO-01-F08\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR - MEDICAL CODING AND CLAIMS PROCESSING NC III (Amended) Promulgated June 16, 2015\n Page 58\n4.1.5.3 Those who are included in the national ICD10 Training Registry of\nDOH/WHO\n\n4.1.5.4 Those with international medical coding training certification\n\n4.1.6 The conduct of assessment and issuance of certificates shall follow the\nprocedures manual and implementing guidelines developed for the\npurpose.\n\n4.2 COMPETENCY ASSESSMENT REQUISITE\n\n4.2.1 Self-Assessment Guide. The self-assessment guide (SAG) is accomplished\nby the candidate prior to actual competency assessment. SAG is a pre-\nassessment tool to help the candidate and the assessor determine what\nevidence is available, where gaps exist, including readiness for\nassessment.\n\n This document can:\n\na. Identify the candidate’s skills and knowledge\nb. Highlight gaps in candidate’s skills and knowledge\nc. Provide critical guidance to the assessor and candidate on the\nevidence that need to be presented\nd. Assist the candidate to identify key areas in which practice is needed or\nadditional information or skills that should be gained prior `\n4.2.2 Accredited Assessment Center. Only Assessment Center accredited by\nTESDA is authorized to conduct competency assessment. Assessment\ncenters undergo a quality assured procedure for accreditation before they\nare authorized by TESDA to manage the assessment for National\nCertification.\n4.2.3 Accredited Competency Assessor. Only accredited competency assessor is\nauthorized to conduct assessment of competence. Competency assessors\nundergo a quality assured system of accreditation procedure before they\nare authorized by TESDA to assess the competencies of candidates for\nNational Certification.\n\n--- PDF PAGE 61 ---\nTESDA-SOP-QSO-01-F08\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR - MEDICAL CODING AND CLAIMS PROCESSING NC III (Amended) Promulgated June 16, 2015\n Page 59\nANNEX A - COMPETENCY MAP\nMedical Coding and Claims Processing NC III\n\nBASIC COMPETENCIES\n\nReceive and Respond\nto Workplace\nCommunication\nWork with Others\nDemonstrate work\nvalues\nPractice basic\nhousekeeping\nprocedures\nParticipate in Workplace\nCommunication\nWork in a Team\nEnvironment\nPractice career\nprofessionalism\nPractice occupational\nhealth and safety\nprocedures\nLead Workplace\nCommunication\nLead Small Team\nDevelop and practice\nnegotiation skills\nSolve Problems\nRelated to Work\nActivities\nUse mathematical\nconcepts and\ntechniques\nUse relevant\ntechnologies\nUtilize Specialist\nCommunication Skills\nDevelop Team and\nIndividuals\nApply Problem Solving\nTechniques in the\nWorkplace\nCollect, analyze and\norganize information\nPlan and Organize Work\nPromote environmental\nprotection\n\nCOMMON COMPETENCIES\n\nUse Hand Tools\nPerform Mensuration\nand Calculation\nPrepare and Interpret\nTechnical Drawing\nApply Quality\nStandards\nPerform Computer\nOperations\n\nCORE COMPETENCIES\n\nCommunicate effectively\nin a customer contact\ncenter\nRender quality\ncustomer service\nUtilize enterprise/\ncompany technology\nConduct contact center\ncampaign\nProvide specialized\nsupport and\nassistance to\ncustomers\nManage the activities of\na contact center work\nteam\nLead a contact center\nwork team\nUse business\ntechnology\nUse medical\ntechnology to carry out\ntask\nProduce text from\naudio transcription\nReview/edit documents\nManage the activities\nof a work team\nLead a team in\ndelivering quality\nservice\nProduce cleaned-up\nand in-between\ndrawings\nCreate 2D models\nand images\nProduce 2D colored\nanimation\nProduce key\ndrawings for\nanimation\nProduce over-all\ndesigns for\nanimation\nProduce background\ndesigns\nComposite and edit\nanimation sequence\nCreate 3D models and\nimages\nProduce storyboard\nfor animation\nCoordinate the\nproduction of\nanimation\n\nAssign medical codes\nProcess medical\nclaims/billings\nManage medical\nclaims\n\n--- PDF PAGE 62 ---\nTESDA-SOP-QSO-01-F08\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR - MEDICAL CODING AND CLAIMS PROCESSING NC III (Amended) Promulgated June 16, 2015\n Page 60\n\nDEFINITION OF TERMS\n\nGENERAL\n\n1) Certification - is the process of verifying and validating the competencies of a\nperson through assessment\n\n2) Certificate of Competency (COC) – is a certification issued to individuals who\npass the assessment for a single unit or cluster of units of competency\n\n3) Common Competencies - are the skills and knowledge needed by all people\nworking in a particular industry\n\n4) Competency - is the possession and application of knowledge, skills and\nattitudes to perform work activities to the standard expected in the workplace\n\n5) Competency Assessment - is the process of collecting evidence and making\njudgments on whether competency has been achieved\n\n6) Competency Standard (CS) - is the industry-determined specification of\ncompetencies required for effective work performance\n\n7) Context of Assessment - refers to the place where assessment is to be\nconducted or carried out\n\n8) Core Competencies - are the specific skills and knowledge needed in a\nparticular area of work - industry sector/occupation/job role\n\n9) Critical aspects of competency - refers to the evidence that is essential for\nsuccessful performance of the unit of competency\n\n10) Elective Competencies - are the additional skills and knowledge required by the\nindividual or enterprise for work\n\n11) Elements - are the building blocks of a unit of competency. They describe in\noutcome terms the functions that a person performs in the workplace.\n\n12) Evidence Guide - is a component of the unit of competency that defines or\nidentifies the evidences required to determine the competence of the individual. It\nprovides information on critical aspects of competency, underpinning knowledge,\nunderpinning skills, resource implications, assessment method and context of\nassessment\n\n13) Level - refers to the category of skills and knowledge required to do a job\n\n14) Method of Assessment - refers to the ways of collecting evidence and when,\nevidence should be collected\n\n--- PDF PAGE 63 ---\nTESDA-SOP-QSO-01-F08\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR - MEDICAL CODING AND CLAIMS PROCESSING NC III (Amended) Promulgated June 16, 2015\n Page 61\n15) National Certificate (NC) – is a certification issued to individuals who achieve all\nthe required units of competency for a national qualification defined under the\nTraining Regulations. NCs are aligned to specific levels within the PTQF\n\n16) Performance Criteria - are evaluative statements that specify what is to be\nassessed and the required level of performance\n\n17) Qualification - is a cluster of units of competencies that meets job roles and is\nsignificant in the workplace. It is also a certification awarded to a person on\nsuccessful completion of a course in recognition of having demonstrated\ncompetencies in an industry sector\n\n18) Range of Variables - describes the circumstances or context in which the work is\nto be performed\n\n19) Recognition of Prior Learning (RPL) – is the acknowledgement of an individual’s\nskills, knowledge and attitudes gained from life and work experiences outside\nregistered training programs\n\n19) Resource Implication - refer to the resources needed for the successful\nperformance of the work activity described in the unit of competency. It includes\nwork environment and conditions, materials, tools and equipment\n\n20) Basic Competencies - are the skills and knowledge that everyone needs for work\n\n21) Training Regulations (TR) – refers to the document promulgated and issued by\nTESDA consisting of competency standards, national qualifications and training\nguidelines for specific sectors/occupations. The TR serves as basis for\nestablishment of qualification and certification under the PTQF. It also serves as\nguide for development of competency-based curricula and instructional materials\nincluding registration of TVET programs offered by TVET providers\n\n22) Underpinning Knowledge - refers to the competency that involves in applying\nknowledge to perform work activities. It includes specific knowledge that is\nessential to the performance of the competency\n\n23) Underpinning Skills - refers to the list of the skills needed to achieve the\nelements and performance criteria in the unit of competency. It includes generic\nand industry specific skills\n\n24) Unit of Competency – is a component of the competency standards stating a\nspecific key function or role in a particular job or occupation; it is the smallest\ncomponent of achievement that can be assessed and certified under the PTQF\n\n--- PDF PAGE 64 ---\nTESDA-SOP-QSO-01-F08\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR - MEDICAL CODING AND CLAIMS PROCESSING NC III (Amended) Promulgated June 16, 2015\n Page 62\nSECTOR SPECIFIC\n\n1. Anatomy – the branch of morphology concerned with the structure of animals\nor plants.\n2. Browser – a software package that provides the user interface for accessing\nInternet, intranet and extranet Web sites.\n3. Claims processing - is the fulfillment by an insurer of its obligation to receive,\ninvestigate and act on a claim filed by an insured. It involves multiple\nadministrative and customer service layers that includes review, investigation,\nadjustment (if necessary), remittance or denial of the claim.\n4. Computer – a device that has the ability to accept data; internally store and\nexecute a program of instructions; perform mathematical, logical, and\nmanipulative operations on data; and report the results.\n5. Computer\nTerminal\n–\nany\ninput/output\ndevice\nconnected\nby\ntelecommunications links to a computer.\n6. Data - objective measurements of the attributes (characteristics) of entities\nsuch as people, places, things, and events.\n7. Documentation – a collection of documents or information.\n8. Edit – to modify the form or format of data\n9. Encryption – to scramble data or convert it, prior to transmission, to a secret\ncode that masks the meaning of he data to unauthorized recipients.\n10. End user – anyone who uses an information system or the information it\nproduces.\n11. Ergonomics - the science and technology emphasizing the safety, comfort,\nand ease of use of human-operated machines. The goal of ergonomics is to\nproduce systems that are user-friendly: safe, comfortable and easy to use.\n12. Information – data placed in a meaningful and useful context for an end user.\n13. Information and Communication Technology (ICT) - refers to technologies\nassociated with the transmission and exchange of data in the form of sound,\ntext, visual images, signals or any combination of those forms through the use\nof digital technology. It encompasses such services as telecommunications,\nposts, multimedia, electronic commerce, broadcasting, and information\ntechnology.\n14. Keyboarding – using the keyboard of a microcomputer or terminal.\n15. Knowledge workers – people whose primary work activities include creating,\nusing, and distributing information.\n16. Local Area Network (LAN) – a communications network that typically\nconnects computers, terminals, and other computerized devices within a limited\nphysical area such as an office, building, manufacturing plant and other work\nsites.\n17. Medical billing - is the process of submitting and following up on claims\nwith health insurance companies in order to receive payment for services\nrendered by a healthcare provider. It is an interaction between a health care\nprovider and the insurance company (payer).The same process is used for\nmost insurance companies, whether they are private companies or government\nsponsored programs.\n18. Medical claims processor - manages and processes insurance claims. When\nhealthcare providers treat patients, they file a medical claim to receive payment\n\n--- PDF PAGE 65 ---\nTESDA-SOP-QSO-01-F08\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR - MEDICAL CODING AND CLAIMS PROCESSING NC III (Amended) Promulgated June 16, 2015\n Page 63\nfrom the patient's insurance company. The medical claims processor then\nreviews and assesses the claim, remitting payment to the doctor if a claim is\ncovered by the patient's insurance policy. Due to the nature of the work, it is\nvital that the processor be knowledgeable about the health insurance industry.\n19. Outsourcing – turning over all or part of an organization’s information systems\noperation to outside contractors, known as systems integrators or facilities\nmanagement companies.\n20. Physiology – the branch of biology concerned with the functions of living\nthings.\n21. Protocol – a set of rules and procedures for the control of communication in a\ncommunications network.\n22. Quality Assurance – methods for ensuring that information systems are free\nfrom errors and fraud and provide information products of high quality.\n23. Software – computer programs and procedures concerned with the operation\nof an information system.\n24. Standards – measures of performance developed to evaluate the progress of\na system toward its objectives\n25. System – an assembly of methods, procedures, or techniques unified by\nregulated interaction to form an organized whole\n26. User- friendly – a characteristic of human-operated equipment and systems\nthat makes\n\n--- PDF PAGE 66 ---\nTESDA-SOP-QSO-01-F08\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR - MEDICAL CODING AND CLAIMS PROCESSING NC III (Amended) Promulgated June 16, 2015\n Page 64\nACKNOWLEDGEMENTS\n\nThe Technical Education and Skills Development Authority (TESDA) wishes to\nextend gratitude and appreciation to the many representatives of business, industry,\nacademe and government agencies and labor groups who donated their time and\nexpertise to the development and validation of these Training Regulations.\n\n THE TECHNICAL EXPERT PANEL (TEP)\n\nJOSEFINA V. LAUCHANGCO (AAMT)\nMYLA ROSE M. REYES (SPI Global)\nMA. CRISTINA G. CORONEL (Pointwest)\nJEANETTE S. CARRILLO\nHealthcare Information Management Outsourcing\nAssociation of the Philippines (HIMOAP)\n\nPETER A. EDU, MD\nLINA LIZA A. ALCANCES, MD\nTeledevelopment Services Inc.\nTHERESA D. TIMBANG\nFLORINDA G. TUVILLO\nDepartment of Health -\nTechnical Working Group on ICD - 10\nJONATHAN MICHAEL ELE, MD\nPhilippine Health Insurance Corp.\nStandards & Monitoring Department\n\n THE PARTICIPANTS IN THE NATIONAL VALIDATION OF THIS TRAINING REGULATION\n\n• Healthcare Information Management Outsourcing Association of the Philippines, Inc.\n(HIMOAP)\n• SPI – Global\n• American Academy of Medical Transcription\n• Teledevelopment Services Inc.\n• Pointwest Technologies\n• Total Transcriptions Solutions\n• Center for Technical Excellence Integrated Schools, Inc.\n\n THE TESDA BOARD - STANDARDS SETTING AND SYSTEMS DEVELOPMENT\nCOMMITTEE\n\n THE MANAGEMENT AND STAFF OF TESDA SECRETARIAT\n\n•\nQualifications and Standards Office (QSO)\n\nName\nCompany/industry\nEmail Address\nLuz Victoria G. Amponin\nTESDA\nlgamponin@tesda.gov.ph\nZoilo C. Galang\nTESDA\nzl_g2002@yahoo.com\nMercedes Javier\nTESDA\nmejavier@tesda.gov.ph\nSamuel E. Calado Jr.\nTESDA\nsecalado@yahoo.com\nFortunata L. Baco\nTESDA\nflbaco@yahoo.com"
