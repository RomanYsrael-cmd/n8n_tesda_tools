rials\nincluding registration of TVET programs offered by TVET providers\n\n22) Underpinning Knowledge - refers to the competency that involves in applying\nknowledge to perform work activities. It includes specific knowledge that is\nessential to the performance of the competency\n\n23) Underpinning Skills - refers to the list of the skills needed to achieve the\nelements and performance criteria in the unit of competency. It includes generic\nand industry specific skills\n\n24) Unit of Competency – is a component of the competency standards stating a\nspecific key function or role in a particular job or occupation; it is the smallest\ncomponent of achievement that can be assessed and certified under the PTQF\n\n--- PDF PAGE 64 ---\nTESDA-SOP-QSO-01-F08\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR - MEDICAL CODING AND CLAIMS PROCESSING NC III (Amended) Promulgated June 16, 2015\n Page 62\nSECTOR SPECIFIC\n\n1. Anatomy – the branch of morphology concerned with the structure of animals\nor plants.\n2. Browser – a software package that provides the user interface for accessing\nInternet, intranet and extranet Web sites.\n3. Claims processing - is the fulfillment by an insurer of its obligation to receive,\ninvestigate and act on a claim filed by an insured. It involves multiple\nadministrative and customer service layers that includes review, investigation,\nadjustment (if necessary), remittance or denial of the claim.\n4. Computer – a device that has the ability to accept data; internally store and\nexecute a program of instructions; perform mathematical, logical, and\nmanipulative operations on data; and report the results.\n5. Computer\nTerminal\n–\nany\ninput/output\ndevice\nconnected\nby\ntelecommunications links to a computer.\n6. Data - objective measurements of the attributes (characteristics) of entities\nsuch as people,