      "definition": "is a component of the competency standards stating a specific key function or role in a particular job or occupation; it is the smallest component of achievement that can be assessed and certified under the PTQF TESDA-SOP-QSO-01-F08 TR - MEDICAL CODING AND CLAIMS PROCESSING NC III (Amended) Promulgated June 16, 2015 Page 62 SECTOR SPECIFIC 1. Anatomy – the branch of morphology concerned with the structure of animals or plants. 2. Browser – a software package that provides the user interface for accessing Internet, intranet and extranet Web sites. 3. Claims processing - is the fulfillment by an insurer of its obligation to receive, investigate and act on a claim filed by an insured. It involves multiple administrative and customer service layers that includes review, investigation, adjustment (if necessary), remittance or denial of the claim. 4. Computer – a device that has the ability to accept data; internally store and execute a program of instructions; perform mathematical, logical, and manipulative operations on data; and report the results. 5. Computer Terminal – any input/output device connected by telecommunications links to a computer. 6. Data - objective measurements of the attributes (characteristics) of entities such as people, places, things, and events. 7. Documentation – a collection of documents or information. 8. Edit – to modify the form or format of data 9. Encryption – to scramble data or convert it, prior to transmission, to a secret code that masks the meaning of he data to unauthorized recipients. 10. End user – anyone who uses an information system or the information it produces. 11. Ergonomics - the science and technology emphasizing the safety, comfort, and ease of use of human-operated machines. The goal of ergonomics is to produce systems that are user-friendly: safe, comfortable and easy to use. 12. Information – data placed in a meaningful and useful context for an end user. 13. Information and Communication Technology (ICT) - refers to technologies associated with the transmission and exchange of data in the form of sound, text, visual images, signals or any combination of those forms through the use of digital technology. It encompasses such services as telecommunications, posts, multimedia, electronic commerce, broadcasting, and information technology. 14. Keyboarding – using the keyboard of a microcomputer or terminal. 15. Knowledge workers – people whose primary work activities include creating, using, and distributing information. 16. Local Area Network (LAN) – a communications network that typically connects computers, terminals, and other computerized devices within a limited physical area such as an office, building, manufacturing plant and other work sites. 17. Medical billing - is the process of submitting and following up on claims with health insurance companies in order to receive payment for services rendered by a healthcare provider. It is an interaction between a health care provider and the insurance company (payer).The same process is used for most insurance companies, whether they are private companies or government sponsored programs. 18. Medical claims processor - manages and processes insurance claims. When healthcare providers treat patients, they file a medical claim to receive payment TESDA-SOP-QSO-01-F08 TR - MEDICAL CODING AND CLAIMS PROCESSING NC III (Amended) Promulgated June 16, 2015 Page 63 from the patient's insurance company. The medical claims processor then reviews and assesses the claim, remitting payment to the doctor if a claim is covered by the patient's insurance policy. Due to the nature of the work, it is vital that the processor be knowledgeable about the health insurance industry. 19. Outsourcing – turning over all or part of an organization’s information systems operation to outside contractors, known as systems integrators or facilities management companies. 20. Physiology – the branch of biology concerned with the functions of living things. 21. Protocol – a set of rules and procedures for the control of communication in a communications network. 22. Quality Assurance – methods for ensuring that information systems are free from errors and fraud and provide information products of high quality. 23. Software – computer programs and procedures concerned with the operation of an information system. 24. Standards – measures of performance developed to evaluate the progress of a system toward its objectives 25. System – an assembly of methods, procedures, or techniques unified by regulated interaction to form an organized whole 26. User- friendly – a characteristic of human-operated equipment and systems that makes TESDA-SOP-QSO-01-F08 TR - MEDICAL CODING AND CLAIMS PROCESSING NC III (Amended) Promulgated June 16, 2015 Page 64"
