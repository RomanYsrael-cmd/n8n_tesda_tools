elivery of training shall adhere to the design of the curriculum. Delivery shall be\nguided by the principles of competency-based TVET.\n\na. Course design is based on competency standards set by the industry or\nrecognized industry sector; (Learning system is driven by competencies\nwritten to industry standards)\n\nb. Training delivery is learner-centered and should accommodate individualized\nand self-paced learning strategies;\n\nc. Training can be done on an actual workplace setting, simulation of a workplace\nand/or through adoption of modern technology.\n\nd. Assessment is based in the collection of evidence of the performance of work to\nthe industry required standards;\n\ne. Assessment of competency takes the trainee’s knowledge and attitude into\naccount but requires evidence of actual performance of the competency as the\nprimary source of evidence.\n\nf. Training program allows for recognition of prior learning (RPL) or current\ncompetencies;\n\ng. Training completion is based on satisfactory performance of all specified\ncompetencies.\n\n2. The competency-based TVET system recognizes various types of delivery modes,\nboth on-and off-the-job as long as the learning is driven by the competency standards\nspecified by the industry. The following training modalities and their\nvariations/components may be adopted singly or in combination with other modalities\nwhen designing and delivering training programs:\n\n2.1.\nInstitution- Based:\n\n• Dual Training System (DTS)/Dualized Training Program (DTP) which contain\nboth in-school and in-industry training or fieldwork components. Details can be\nreferred to the Implementing Rules and Regulations of the DTS Law and the\nTESDA Guidelines on the DTP;\n\n• Distance learning is a formal education process in which majority of the\ninstruction occurs when the students and instructor are not in the same place.\nDistance learning may employ correspondence study, audio, video, computer\ntechnologies or other modern technology that can be used to facilitate learning\nand formal and non-formal training. Specific guidelines on this mode shall be\nissued by the TESDA Secretariat.\n\n--- PDF PAGE 56 ---\nTESDA-SOP-QSO-01-F08\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR - MEDICAL CODING AND CLAIMS PROCESSING NC III (Amended) Promulgated June 16, 2015\n Page 54\n• The traditional classroom-based or in-center instruction may be enhanced\nthrough use of learner-centered methods as well as laboratory or field-work\ncomponents.\n\n2.2 Enterprise-Based:\n\n• Formal Apprenticeship – Training within employment involving a contract\nbetween an apprentice and an enterprise on an approved apprenticeable\noccupation.\n\n• Enterprise-based Training- where training is implemented within the company\nin accordance with the requirements of the specific company. Specific\nguidelines on this mode shall be issued by the TESDA Secretariat.\n\n3.3\nTRAINEE ENTRY REQUIREMENTS\n\nThe trainees who wish to enter the course should possess the following\nrequirements:\n\n• Graduate of 12-years Basic education;\n• Can communicate in English, both oral and written;\n• Have pass the trainability/aptitude test of the institution*\n ___________\nNote: * Optional\n\nThis list does not include specific institutional requirements such as\neducational attainment, appropriate work experience, and others that may be\nrequired of the trainees by the school or training center delivering the TVET\nprogram.\n\n--- PDF PAGE 57 ---\nTESDA-SOP-QSO-01-F08\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR - MEDICAL CODING AND CLAIMS PROCESSING NC III (Amended) Promulgated June 16, 2015\n Page 55\n\n3.4 LIST OF TOOLS, EQUIPMENT AND MATERIALS\n\nRecommended list of equipment and materials for the training in Medical Coding\nand Claims Processing NC III\n\nMATERIALS\nAt least 5 sets Coding Manuals (latest edition or at least 2-years of publication)\n• Coding Resources Diagnosis code set\n• Procedures/Services and Supplies code set\nClaims Processing Manuals / Handouts\n1:1\nTraining/Student manual (optional)\nAt least 2 pcs\nLatest Medical Dictionary\nAt least 2 sets\nComputers with internet (optional)\n\n3.5 TRAINING FACILITIES\n\nThe building must be in compliance with occupational health and safety\nguidelines. The space requirements for the teaching/learning and circulation areas\nare as follows:\n\nTEACHING/LEARNING\nAREAS\nSIZE IN\nMETERS\nAREA IN SQ.\nMETERS\nQTY.\nTOTAL AREA\nIN SQ. METERS\n\nLecture /Laboratory Room*\n8 x 5\n40\n1\n40\nLearning Resource Area /\nRepository of references/\nmanuals, etc. (may be\nlocated inside the lecture /\nlaboratory room)\n 4 X 5\n 20\n1\n20\nWash ,Toilet & Locker Room\n1 x 2\n2\n2\n4\nTotal\n64\nFacilities / Equipment / Circulation**\n19\nTotal Area\n83\n\nNote: Maximum required ratio of trainer to students = 1: 25\n * The above specification for the lecture room space requirement assumes a maximum of 25 students.\nThe area size may vary depending on the number of students at a given class.\n ** Area requirement is equivalent to 30% of the total teaching/learning areas\n\n--- PDF PAGE 58 ---\nTESDA-SOP-QSO-01-F08\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR - MEDICAL CODING AND CLAIMS PROCESSING NC III (Amended) Promulgated June 16, 2015\n Page 56\n\n3.6 TRAINERS QUALIFICATIONS\n\nMEDICAL CODING AND CLAIMS PROCESSING – NC III\nTrainer’s Qualification I (TQ I)\n\n• Must be a holder of National TVET Trainer’s Certificate (NTTC) I\no Must be a holder of Medical Coding and Claims Processing NC III\no Must have completed training and passed the assessment for Trainer’s\nMethodology course\n\n• With at least two (2) years of relevant industry experience as medical coding\nand claims specialist or with international certification in medical coding, billing\nand/or claims\n\n3.7 INSTITUTIONAL ASSESSMENT\n\nInstitutional assessment is undertaken by trainees to determine their\n\nachievement of units of competency. A certificate of achievement is issued for\n\neach unit of competency.\n\nThe result of the institutional assessment may be considered as evidence for\nthe assessment for national certification.\n\n--- PDF PAGE 59 ---\nTESDA-SOP-QSO-01-F08\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR - MEDICAL CODING AND CLAIMS PROCESSING NC III (Amended) Promulgated June 16, 2015\n Page 57"
