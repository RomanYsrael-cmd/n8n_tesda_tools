  "source_section_text": "SECTION 3 TRAINING ARRANGEMENTS\n\nThis set of standards provides Technical and Vocational Education and Training\n(TVET) providers with information and other important requirements to consider when\ndesigning training programs for Medical Coding and Claims Processing NC III.\n\nThis includes information on curriculum design; training delivery; trainee entry\nrequirements; tools and equipment; training facilities; and trainer’s qualification and\ninstitutional assessment.\n\n3.1\nCURRICULUM DESIGN\n\nTESDA shall provide the training on the development of competency-based\ncurricula to enable training providers develop their own curricula with the components\nmentioned below.\n\nDelivery of knowledge requirements for the basic, common and core units of\ncompetency\nspecifically\nin\nthe\nareas\nof\nmathematics,\nscience/technology,\ncommunication/language and other academic subjects shall be contextualized. To this\nend, TVET providers shall develop a Contextual Learning Matrix (CLM) to accompany\ntheir curricula.\n\nCourse Title: MEDICAL CODING AND CLAIMS PROCESSING NC Level: NC III\nNominal Training Hours:\n 32 Hours (Basic)\n+ 18 Hours (Common)\n 160 Hours (Core)\n---------------------------------------\n 210 Hours - TOTAL\n\nCourse Description:\n\nThis course is designed to develop knowledge, desirable attitudes, and skills\nin assigning medical codes to medical conditions and procedures and services from\nmedical reports made by physicians and other health care professional for reporting\nand billing/claims purposes. It covers specialized competencies such as assigning\nmedical codes, processing and managing of medical claims.\n\nTo obtain this, all units prescribed for this qualification must be achieved:\n\n--- PDF PAGE 44 ---\nTESDA-SOP-QSO-01-F08\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR - MEDICAL CODING AND CLAIMS PROCESSING NC III (Amended) Promulgated June 16, 2015\n Page 42\nBASIC COMPETENCIES\n32 hrs\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Content\n(Required Knowledge)\nPractical Activities\n(Required Skills)\nMethodology\nAssessment\nApproach\nNominal\nDuration\n1. Lead\nworkplace\ncommunication\n\n1.1 Communicate\ninformation\nabout\nworkplace\nprocesses.\n.\n\n• Method of communication\n• Communication skills\n• Communication tools\n• Questioning techniques\n\n• Expressing One self\n• Practice on Public speaking\n• Written activities on\nworkplace process\n• Group\ndiscussion\n• Role Play\n• Brainstorming\n• Demonstration\n• Written Test\n• Interview\n• Observation\n2 hours\n\n1.2 Lead\nworkplace\ndiscussions\n• Method/technique of\ndiscussion\n• How to lead discussion\n• How to solicit response\n\n• Written and Electronic\ncommunication activities\n• Debate Exercises\n• Self-paced\nhandout/\nmodule\n• Discussion\n• Role Play\n\n• Written Test\n• Demonstration\n\n2 hours\n\n1.3 Identify and\ncommunicate\nissues arising\nin the\nworkplace\n• Identify problems and\nissues\n• Organizing information on\nproblem and issues\n• Relating problems and\nissues\n• Communication barriers\naffecting workplace\ndiscussions\n\n• Resolving conflict in the\nworkplace\n• Making a report about\nproblem and issues\n• Practice communication\nmodel\n• Brainstorming\n• Self-paced\nhandout/\nmodule\n• Role Play\n• Self-paced\nhandout/\nmodule\n\n• Interviews\n• Written exam\n• Demonstration\n\n2 hours\n\n--- PDF PAGE 45 ---\nTESDA-SOP-QSO-01-F08\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR - MEDICAL CODING AND CLAIMS PROCESSING NC III (Amended) Promulgated June 16, 2015\n Page 43\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Content\n(Required Knowledge)\nPractical Activities\n(Required Skills)\nMethodology\nAssessment\nApproach\nNominal\nDuration\n2. Lead small\nteams\n2.1 Provide team\nleadership.\n• Communication skills\nrequired for leading small\nteam\n• Skills and techniques in\npromoting team building\n• Negotiating skills\n• Up to date dissemination of\ninstruction and\nrequirements to members\n• Art of listening and treating\nindividual team members\nconcern\n• Evaluate the success factors\nin the contribution of the\npersonnel in the\nimplementation of the safety,\nquality and environmental\nobjectives of the company\n• Practice leadership activities\n• Teambuilding activities\n• Write simple negotiation\nstrategy on workplace issues\n• Role play on communication\nmodel and the art of listening\n• Self-paced\nhandout/\nmodule\n• Role Play\n• Case Study\n• Written\n• Oral\nQuestioning\n• Demonstration\n\n2 hours\n2.2 Assign\nresponsibilities\namong\nmembers\n• Duties and responsibilities\nof each team member\n• Skills in identifying\nindividual skills, knowledge\nand attitude as basis for\nallocating responsibilities\n• Knowledge in identifying\neach team member duties\nand responsibilities\n• Planning session regarding\nduties and responsibilities of\neach team member\n• Writeshop of interpersonal\nabilities, attitude and\nknowledge\n• Identification of team\nmembers responsibilities thru\nsimulation\n• Role Play\n• Workshop\n• Demonstration\n• Case studies\n• Interview\n• Demonstration\n\n2 hours\n2.3 Set\nperformance\nexpectation for\nteam\nmembers.\n• Knowledge and skills in\nsetting individual\nperformance\ntarget/expectation\n• Team members duties and\nresponsibilities\n• Employee policies and\nprocedures\n• Defining performance\nexpectations criteria\n• Develop /implement an\nappraisal document for the\nworker\n• Workshop on setting\nindividual performance target\n• Writeshop on team members\nduties and responsibilities\n• Video presentation regarding\nemployees performance role\nand expectation towards\nwork\n• Group\ndiscussion\n• Writeshop\n• Multimedia\np