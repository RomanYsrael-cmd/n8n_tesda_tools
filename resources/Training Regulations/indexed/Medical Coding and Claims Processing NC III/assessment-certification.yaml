      "text": "NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS 4.1.1 To attain the National Qualification of Medical Coding and Claims Processing NC III, the candidate must demonstrate competence in all units listed in Section 1. Successful candidates shall be awarded a National Certificate signed by the TESDA Director General. 4.1.2 The qualification of Medical Coding and Claims Processing NC III may be attained through: 4.1.2.1 Accumulation of Certificates of Competency (COCs) in the following competencies: 4.1.2.1.1 Assign medical codes 4.1.2.1.2 Perform medical claims/billing work • Process medical claims/billing • Manage medical claims Successful candidates shall be awarded a Certificate of Competency (COC) in each of the core units. 4.1.2.2 Demonstration of competence through project-type assessment covering all the units required in the qualification. 4.1.3 Accumulation and submission of all COCs acquired for the relevant units of competency comprising a qualification, an individual shall be issued the corresponding National Certificate. 4.1.4 Assessment shall focus on the core units of competency. The basic and common units shall be integrated or assessed concurrently with the core units. 4.1.5 The following are qualified to apply for assessment and certification: 4.1.5.1 Graduate of formal, non-formal, and informal including enterprise- based training programs and e-learning/online/distance learning programs; 4.1.5.2 Experienced workers (wage employed or self-employed). TESDA-SOP-QSO-01-F08 Page 58 4.1.5.3 Those who are included in the national ICD10 Training Registry of DOH/WHO 4.1.5.4 Those with international medical coding training certification 4.1.6 The conduct of assessment and issuance of certificates shall follow the procedures manual and implementing guidelines developed for the purpose."
