        "evidence_guide": {
          "source_text": "1.  Critical aspects  \n of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 Demonstrated ability to produce a range of specialist bakery \nproducts, both sweet and savory according to establishment \nstandards and procedures \n1.2 Demonstrated ability to produce a quantity of bakery products \naccording to establishment standards and procedures \n1.3 Demonstrated ability to store and package bakery products \naccording to establishment’s standards and procedures \n1.4 Demonstrated application of hygiene and safety principles \naccording to established standards and procedures\n2.  Underpinning \nKnowledge  \n2.1Varieties and characteristics of bakery products \n2.2Historical and cultural, aspects of bakery products \n2.3Underlying principles in making bakery products \n2.4Knowledge commodity on including quality indicators of \ningredients for bakery products, properties of ingredients used, \ninteraction and changes during processing to produce required \ncharacteristics \n2.5Properties and requirements of yeast and control of yeast action \n2.6Culinary and technical terms related to bakery products commonly \nused in the industry \n2.7Expected taste, texture and crumb structure appropriate for \nparticular bakery products. \n2.8Ratio of ingredients required to produce a balanced formula \n2.9The influence of correct portion control, yields, weights and sizes \non the profitability of an establishment\n3.  Underpinning \nSkills \n3.1 Processes of fermentation and dough development \n3.2 Principles and practices of hygiene, particularly on handling \ndough, commodities and products \n3.3 Safe work practices, particularly on using cutting implements, \nappliances, heated surfaces, ovens and mixing/kneading \nequipment and manual handling \n3.4 Function and routine maintenance of equipment used \n3.5 Portion control yield \n3.6 Storage conditions for bakery products and optimizing shelf-life \n3.7 Defining and applying corrective steps to ensure quality control\n4.  Resource \nImplications \nThe following resources MUST be provided: \n4.1 Commercial kitchen environment using industry-current \nequipment for making a variety of specialized bakery products. \n4.2  Use of real ingredients \n4.3 Preparation, decoration and presentation of a range of specialist \nbakery products within typical workplace condition\n5.  Methods of \nAssessment \nCompetency may be  assessed through: \n5.1 Observation of practical demonstration by the candidate on \npreparing, cooking and baking, filling, finishing, decorating and \npresenting specialized bakery products \n5.2 Questions to determine the underpinning knowledge of the \ncandidate related to tasks to be performed \n5.3 Review of portfolios of evidence \n5.4 Third party/workplace reports of on-the-job performance of the \ncandidate\n6.  Context for \nAssessment\n6.1 Assessment may be done in the workplace or in a simulated \nworkplace setting (assessment centers)",
