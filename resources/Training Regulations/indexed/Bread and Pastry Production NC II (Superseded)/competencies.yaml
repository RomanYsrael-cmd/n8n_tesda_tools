ting qualities, appearance and \nfreshness \n6.2 Petits fours are packaged in accordance with established \nstandards and procedures\n\n--- PDF PAGE 44 ---\nTR – BREAD AND PASTRY PRODUCTION NC II  \n Promulgated July 2009 \n42 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.   Fillings \n \n \nMay include: \n1.1 Custards \n1.2 Creams \n1.3Ganache\n2.    Toppings and \ndecorations \n \n \n \nMay includes: \n2.1 Fresh fruits \n2.2 Glazes \n2.3 Fondant icing \n2.4 Chocolate \n3.    Receptacles \n \n \n \n \n \n \n \nMay include: \n3.1 Chocolate \n3.2 Tulip paste \n3.3 Sugar lace \n3.4 Croquant \n3.5 Glass \n3.6 Crystal \n3.7 Ceramic \n3.8Metallic platters and trays\n\n--- PDF PAGE 45 ---\nTR – BREAD AND PASTRY PRODUCTION NC II  \n Promulgated July 2009 \n43"
