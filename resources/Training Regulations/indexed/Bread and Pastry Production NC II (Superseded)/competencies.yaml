        "evidence_guide": {
          "source_text": "1. Critical aspects\n of Competency\nAssessment requires evidence that the candidate:\n1.1 Demonstrated ability to produce a range of specialist pastry\nproducts, both sweet and savory according to establishment\nstandards and procedures\n1.2 Demonstrated ability to produce a quantity of pastry products\naccording to establishment standards and procedures\n1.3 Demonstrated ability to store and package pastry and pastry\nproducts according to establishment’s standards and\nprocedures\n1.4 Demonstrated application of hygiene and safety principles\naccording to established standards and procedures\n\n2. Underpinning\nKnowledge\n2.1Varieties and characteristics of pastry products\n2.2Historical and cultural, aspects of pastry products\n2.3Underlying principles in making pastry products\n2.4Knowledge commodity on including quality indicators of\ningredients for pastry products, properties of ingredients used,\ninteraction and changes during processing to produce required\ncharacteristics\n2.5Properties and requirements of yeast and control of yeast action\n2.6Culinary and technical terms related to pastry products\ncommonly used in the industry\n2.7Expected taste, texture and crumb structure appropriate for\nparticular bakery products.\n2.8Ratio of ingredients required to produce a balanced formula\n2.9The influence of correct portion control, yields, weights and sizes\non the profitability of an establishment\n\n3. Underpinning\nSkills\n3.1 Processes of fermentation and dough development\n3.2 Principles and practices of hygiene, particularly on handling\ndough, commodities and products\n3.3 Safe work practices, particularly on using cutting implements,\nappliances, heated surfaces, ovens and mixing/kneading\nequipment and manual handling\n3.4 Function and routine maintenance of equipment used\n3.5 Portion control yield\n3.6 Storage conditions for bakery products and optimizing shelf-life\n3.7 Defining and applying corrective steps to ensure quality control\n\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1 Commercial kitchen environment using industry-current\nequipment for making a variety of specialized pastry products.\n4.2 Use of real ingredients\n4.3 Preparation, decoration and presentation of a range of\n specialist pastry products within typical workplace condition\n\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1 Observation of practical demonstration by the candidate on\npreparing, cooking and baking, filling, finishing, decorating and\npresenting specialized pastry products\n5.2 Questions to determine the underpinning knowledge of the\ncandidate related to tasks to be performed\n5.3 Review of portfolios of evidence\n5.4 Third party/workplace reports of on-the-job performance of the\ncandidate\n\n6. Context for\nAssessment\n6.1 Assessment may be done in the workplace or in a simulated\nworkplace setting (assessment centers)\n\n--- PDF PAGE 39 ---\nTR – BREAD AND PASTRY PRODUCTION NC II\n Promulgated July 2009\n37\n\nUNIT OF COMPETENCY: PREPARE AND PRESENT GATEAUX, TORTES AND\nCAKES\n\nUNIT CODE :"
        },
        "source_text": "TRS741380\n\nUNIT DESCRIPTOR :\n\nThis unit deals with knowledge and skills required by\nbakers and pastry cooks (patissiers) to prepare and\nproduce a range of high-quality pastry products in\ncommercial food production environments and hospitality\nestablishments.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Prepare pastry products\n\n1.1 Required ingredients are selected, measured and\nweighed according to recipe or production\nrequirements and established standards and\nprocedures\n1.2 A variety of pastry products are prepared according\nto standard mixing procedures/formulation/ recipes\nand desired product characteristics\n1.3 Appropriate equipment are used according to\nrequired pastry products and standard operating\nprocedures\n1.4 Pastry products are baked according to techniques\nand appropriate conditions; and enterprise\nrequirement and standards\n1.5 Required oven temperature are selected to bake\ngoods in accordance with the desired characteristics,\nstandards recipe specifications and enterprise\npractices\n2. Decorate and present\npastry products\n\n2.1 A variety of fillings and coating/icing,\nglazes and decorations for pastry products are\nprepared according to standard recipes,\nenterprise standards and/or customer\npreferences\n2.2 Pastry products are filled and decorated, where\nrequired and appropriate, in accordance with\nstandard recipes and/or enterprise standards\nand customer preferences\n2.5 Pastry products are finished according to\ndesired product characteristics\n2.6 Baked pastry products are presented according\nto established standards and procedures\n3. Store pastry products\n\n3.1 Pastry products are stored according to\n established standards and procedures\n3.2 Packaging are selected appropriate for the\n preservation of product freshness and eating\n characteristics\n\n--- PDF PAGE 36 ---\nTR – BREAD AND PASTRY PRODUCTION NC II\n Promulgated July 2009\n34\nRANGE OF VARIABLES\n\nThis unit applies to the production of pastry products in various hospitality enterprises\nsuch as patisseries, restaurants, hotels, bakery, bakeshop operations and coffee shops. The\nfollowing explanations identify how this unit may be applied in different workplaces and\ncircumstances. Pastries and cakes to be produced and decorated may be of various cultural\norigins and derived from classical or contemporary recipes.\n\nVARIABLE\nRANGE\n1. Ingredients\nMay include but are not limited to:\n1.1 Flours\n1.2 Sugars\n1.3 Eggs\n1.4 Milk\n1.5 Cream\n1.6 Gelatin\n1.7 Fruits\n1.8 Nuts\n1.9 Flavorings and essences\n1.10 Chocolate\n2. Pastry\nproducts\n\nMay include but are not limited to:\n2.1 Pastry Basics\n2.1.1 Pate Brisee and short pastries\n2.1.2 Puff Pastry\n2.1.3 Choux Pastry\n2.1.4 Strudel and Phyllo\n2.1.5 Baked Meringues\n2.2 Tarts and Special Pastries\n2.2.1 Tarts\n2.2.2 Pies\n2.3 Specialty (unique to locality)\n3. Product\ncharacteristics\n\nMay includes but are not limited to:\n3.1 Color\n3.2 Consistency and texture\n3.3 Moisture content\n3.4 Mouth feel and eating properties\n3.5 Appearance\n4. Equipment\n\nMay include but are not limited to:\n4.1 Commercial mixers and attachments\n4.2 Cutting implements\n4.3 Scales\n4.4 Measures\n4.5 Bowls\n4,6 Ovens\n4,7 Moulds, shapes and cutters\n4.8 Baking sheets and containers\n4.9 Various shapes and sizes of pans\n5. Techniques\nand conditions\n\nMay include but are not limited to:\n5.1 Cake Mixing\n5.1.1 Beating\n5.1.2 Whisking\n5.1.3 Folding\n\n--- PDF PAGE 37 ---\nTR – BREAD AND PASTRY PRODUCTION NC II\n Promulgated July 2009\n35\n\n5.1.4 Rolling\n5.1.5 Creaming\n5.1.6 Incorporating fat\n5.2 Different Methods of Mixing\n5.2.1 Sponge\n5.2.2 Genoise\n5.2.3 Swiss Rolls\n5.2.4 Joconde\n5.2.5 Chiffon Cakes\n5.3 Scaling, Panning and Baking\n5.4 Appropriate Oven Temperature\n5.5 Altitude Adjustments\n5.6 Fillings\n 5.6.1 Creams (e.g. fresh, butter, wine, etc.)\n 5.6.2 Chocolates\n 5.6.3 Jams\n 5.6.4 Custards, Ganaches\n 5.6.5 Savory fillings\n 5.6.6 Ready-made and pre-mixed\n6. Enterprise\nrequirements\nand standards\nMay include but are not limited to:\n6.1 Scale to correct weight\n6.2 Color\n6.3 Consistency\n6.4 Texture\n6.5 Moisture\n6.6 Mouth feel\n6.7 Appearance\n6.8 Sale ability\n7. Fillings and\ncoating/icing,\nglazes and\ndecorations\n\nMay include but are not limited to:\n7.1 Jellies and glazes\n7.2 Biscuits\n7.3 Flowers and leaves\n7.4 Herbs\n\n7.5 Flavored and colored sugar\n7.6 Fresh and preserved/crystallized fruits\n7.7 Seeds and nuts\n7.8 Icings, sprinkled icing sugar or chocolate\n powder\n7.9 Butter creams, Ganache, Fondants\n7.10 Tuile\n8. Pastry product\nfinishing\n\nMay include but are not limited to:\n8.1 Coating\n8.2 Glazing\n8.3 Icing\n9. Storage\nconditions\nMay include but are not limited to:\n9.1 Consideration of temperature, light and air exposure\n9.2 Use of appropriate containers\n9.3 Labeling\n9.4 Display cabinets including temperature-\n controlled cabinets to cools or warm\n9.5 Refrigeration, chilling and freezing\n9.6 Length of time in freezer /cool storage\n\n--- PDF PAGE 38 ---\nTR – BREAD AND PASTRY PRODUCTION NC II\n Promulgated July 2009\n36\nEVIDENCE GUIDE\n1. Critical aspects\n of Competency\nAssessment requires evidence that the candidate:\n1.1 Demonstrated ability to produce a range of specialist pastry\nproducts, both sweet and savory according to establishment\nstandards and procedures\n1.2 Demonstrated ability to produce a quantity of pastry products\naccording to establishment standards and procedures\n1.3 Demonstrated ability to store and package pastry and pastry\nproducts according to establishment’s standards and\nprocedures\n1.4 Demonstrated application of hygiene and safety principles\naccording to established standards and procedures\n\n2. Underpinning\nKnowledge\n2.1Varieties and characteristics of pastry products\n2.2Historical and cultural, aspects of pastry products\n2.3Underlying principles in making pastry products\n2.4Knowledge commodity on including quality indicators of\ningredients for pastry products, properties of ingredients used,\ninteraction and changes during processing to produce required\ncharacteristics\n2.5Properties and requirements of yeast and control of yeast action\n2.6Culinary and technical terms related to pastry products\ncommonly used in the industry\n2.7Expected taste, texture and crumb structure appropriate for\nparticular bakery products.\n2.8Ratio of ingredients required to produce a balanced formula\n2.9The influence of correct portion control, yields, weights and sizes\non the profitability of an establishment\n\n3. Underpinning\nSkills\n3.1 Processes of fermentation and dough development\n3.2 Principles and practices of hygiene, particularly on handling\ndough, commodities and products\n3.3 Safe work practices, particularly on using cutting implements,\nappliances, heated surfaces, ovens and mixing/kneading\nequipment and manual handling\n3.4 Function and routine maintenance of equipment used\n3.5 Portion control yield\n3.6 Storage conditions for bakery products and optimizing shelf-life\n3.7 Defining and applying corrective steps to ensure quality control\n\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1 Commercial kitchen environment using industry-current\nequipment for making a variety of specialized pastry products.\n4.2 Use of real ingredients\n4.3 Preparation, decoration and presentation of a range of\n specialist pastry products within typical workplace condition\n\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1 Observation of practical demonstration by the candidate on\npreparing, cooking and baking, filling, finishing, decorating and\npresenting specialized pastry products\n5.2 Questions to determine the underpinning knowledge of the\ncandidate related to tasks to be performed\n5.3 Review of portfolios of evidence\n5.4 Third party/workplace reports of on-the-job performance of the\ncandidate\n\n6. Context for\nAssessment\n6.1 Assessment may be done in the workplace or in a simulated\nworkplace setting (assessment centers)\n\n--- PDF PAGE 39 ---\nTR – BREAD AND PASTRY PRODUCTION NC II\n Promulgated July 2009\n37\n\nUNIT OF COMPETENCY: PREPARE AND PRESENT GATEAUX, TORTES AND\nCAKES\n\nUNIT CODE :"
