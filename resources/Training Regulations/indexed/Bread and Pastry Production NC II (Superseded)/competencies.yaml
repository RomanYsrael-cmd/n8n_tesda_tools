        "evidence_guide": {
          "source_text": "1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Demonstrated ability to prepare and present a diverse range\nof petits fours in accordance with established standards and\nprocedures\n1.2 Demonstrated ability package and store a range of petits four\nin accordance with established standards and procedures\n1.3 Applied food hygiene and safety principles in accordance with\nthe preparation and presentation process\n1.4 Demonstration knowledge on the characteristics of petits four\nand suitable decorations/garnishes in accordance with\nestablished standards and procedures\n2. Underpinning\nKnowledge\n2.1 Varieties and characteristics of classical and contemporary\npetits four including taste, texture, structure, shape and size\nappropriate for petits fours, according to industry and\nenterprise standards\n2.2 Historical and cultural aspects of petits fours\n2.3 Underlying principles in making petits fours\n2.4 Commodity knowledge, including quality indicators of petits\nfours ingredients\n2.5 Culinary terms related to petits fours that are commonly\nused in the industry\n2.6 Storage conditions for petits fours and optimizing shelf life\n2.7 Properties of the ingredients used and their interaction and\nchanges during production\n3. Underpinning Skills\n3.1 Principles and practices of hygiene particularly in relation to\npreparing and decorating finished petits fours its ingredients\nand commodities\n3.2 Safe work practices, particularly in relation to using cutting\nimplements, appliances, heated surfaces, ovens and mixing\nequipment.\n3.3 Portion control and yield\n3.4 Working methods used in production and display of petits\nfours\n3.5 Defining and applying corrective steps to ensure quality\ncontrol\n3.6 Creative, artistic skills in decoration and presentation\n4. Resource\nImplications\n4.1 Commercial kitchen environment using industry-current\nequipment for making petits fours\n4.2 Use of real ingredients\n4.3 Preparation, decoration and presentation of a range of petits\nfours within typical workplace conditions.\n5. Methods of\nAssessment\n5.1 Observation of practical demonstration of the candidate while\npreparing decorating and presenting petits fours\n5.2 Questions about hygiene procedures, commodities,\npresentation and decoration techniques and storage\nrequirements to ensure optimum quality and foods safety\n5.3 Review of portfolios of evidence and third party workplace\nreports of on-the-job performance of the candidate\n6. Context for\nAssessment\n6.1 Assessment may be done in the workplace or in a simulated\nworkplace setting (assessment centers)\n\n--- PDF PAGE 46 ---\nTR – BREAD AND PASTRY PRODUCTION NC II\n Promulgated July 2009\n44\n\nUNIT OF COMPETENCY: PRESENT DESSERTS\n\nUNIT CODE :"
        },
        "source_text": "TRS741344\n\nUNIT DESCRIPTOR :\n\nThis unit applies to the knowledge and skills required by\nbakers and pastry cooks (patissiers) in commercial food\nproduction environments and hospitality establishments. It\ncovers the production, display and service of a wide\nrange of petits fours including petits fours glaces,\nmarzipan-based petits fours and caramelized fruits and\nnuts served as petits fours, to a level of high and\nconsistent quality.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Prepare iced\npetits fours\n\n1.1 Sponges and bases are prepared, cut and assembled\naccording to standard recipes and enterprise requirements\nand practices\n1.2 Fillings are prepared with the required flavors and\nconsistency\n1.3 Fondant icing are brought in accordance with the required\ntemperature and established standards and procedures\n1.4 Decorations are designed and used in accordance with\nestablishment standards and procedures\n2. Prepare fresh\npetits fours\n\n2.1 A selection of small choux paste shapes are baked and\ndecorated in accordance with established standards and\nprocedures\n2.2 Baked sweet paste are prepared and blended in accordance\nwith establishment standards and procedures\n2.3 Fillings are prepared and used the required flavors and correct\nconsistency\n2.4 Garnishes, glazes and finished are used in accordance with\nestablished standards and procedures\n3. Prepare marzipan\npetits fours\n\n3.1 Quality marzipan is flavored and shaped to produce mini-sized\nfruits in accordance with enterprise and client requirements\n3.2 Marzipan fruits are coated to preserve desired eating\ncharacteristics and softened with egg whites, piped into\nshapes and sealed/browned with applied heat, according to\nenterprise practice\n4. Prepare\ncaramelized petits\nfours\n4.1 Fresh fruits/fruit segments are selected and coated with pale\namber-colored caramel or glazed or any coating specified by\nthe enterprise\n4.2 Sandwich dried fruits or nuts are filled with flavored marzipan\nand coated with pale amber-colored caramel according to\nspecifications and enterprise standards\n5. Display petits\nfours\n5.1 Appropriate receptacles are selected and prepared for petits\nfours\n5.2 Petits fours are displayed creatively to enhance customer\nappeal\n6. Store petits fours\n6.1 Petits fours are stored in proper temperatures and conditions\nto maintain maximum eating qualities, appearance and\nfreshness\n6.2 Petits fours are packaged in accordance with established\nstandards and procedures\n\n--- PDF PAGE 44 ---\nTR – BREAD AND PASTRY PRODUCTION NC II\n Promulgated July 2009\n42\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Fillings\n\nMay include:\n1.1 Custards\n1.2 Creams\n1.3Ganache\n2. Toppings and\ndecorations\n\nMay includes:\n2.1 Fresh fruits\n2.2 Glazes\n2.3 Fondant icing\n2.4 Chocolate\n3. Receptacles\n\nMay include:\n3.1 Chocolate\n3.2 Tulip paste\n3.3 Sugar lace\n3.4 Croquant\n3.5 Glass\n3.6 Crystal\n3.7 Ceramic\n3.8Metallic platters and trays\n\n--- PDF PAGE 45 ---\nTR – BREAD AND PASTRY PRODUCTION NC II\n Promulgated July 2009\n43\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Demonstrated ability to prepare and present a diverse range\nof petits fours in accordance with established standards and\nprocedures\n1.2 Demonstrated ability package and store a range of petits four\nin accordance with established standards and procedures\n1.3 Applied food hygiene and safety principles in accordance with\nthe preparation and presentation process\n1.4 Demonstration knowledge on the characteristics of petits four\nand suitable decorations/garnishes in accordance with\nestablished standards and procedures\n2. Underpinning\nKnowledge\n2.1 Varieties and characteristics of classical and contemporary\npetits four including taste, texture, structure, shape and size\nappropriate for petits fours, according to industry and\nenterprise standards\n2.2 Historical and cultural aspects of petits fours\n2.3 Underlying principles in making petits fours\n2.4 Commodity knowledge, including quality indicators of petits\nfours ingredients\n2.5 Culinary terms related to petits fours that are commonly\nused in the industry\n2.6 Storage conditions for petits fours and optimizing shelf life\n2.7 Properties of the ingredients used and their interaction and\nchanges during production\n3. Underpinning Skills\n3.1 Principles and practices of hygiene particularly in relation to\npreparing and decorating finished petits fours its ingredients\nand commodities\n3.2 Safe work practices, particularly in relation to using cutting\nimplements, appliances, heated surfaces, ovens and mixing\nequipment.\n3.3 Portion control and yield\n3.4 Working methods used in production and display of petits\nfours\n3.5 Defining and applying corrective steps to ensure quality\ncontrol\n3.6 Creative, artistic skills in decoration and presentation\n4. Resource\nImplications\n4.1 Commercial kitchen environment using industry-current\nequipment for making petits fours\n4.2 Use of real ingredients\n4.3 Preparation, decoration and presentation of a range of petits\nfours within typical workplace conditions.\n5. Methods of\nAssessment\n5.1 Observation of practical demonstration of the candidate while\npreparing decorating and presenting petits fours\n5.2 Questions about hygiene procedures, commodities,\npresentation and decoration techniques and storage\nrequirements to ensure optimum quality and foods safety\n5.3 Review of portfolios of evidence and third party workplace\nreports of on-the-job performance of the candidate\n6. Context for\nAssessment\n6.1 Assessment may be done in the workplace or in a simulated\nworkplace setting (assessment centers)\n\n--- PDF PAGE 46 ---\nTR – BREAD AND PASTRY PRODUCTION NC II\n Promulgated July 2009\n44\n\nUNIT OF COMPETENCY: PRESENT DESSERTS\n\nUNIT CODE :"
      }
