        "evidence_guide": {
          "source_text": "1. Critical aspect of\ncompetency\nAssessment must show that the candidate:\n\n1.1 Selected and used hardware components correctly and\naccording to the task requirement\n1.2 Identified and explain the functions of both hardware and\nsoftware used, their general features and capabilities\n1.3 Produced accurate and complete data in accordance with\nthe requirements\n1.4 Used appropriate devices and procedures to transfer\nfiles/data accurately\n1.5 Maintained computer system\n2. Underpinning\nKnowledge\n2.1 Basic ergonomics of keyboard and computer use\n2.2 Main types of computers and basic features of different\noperating systems\n2.3 Main parts of a computer\n2.4 Storage devices and basic categories of memory\n2.5 Relevant types of software\n2.6 General security\n2.7 Viruses\n2.8 OH & S principles and responsibilities\n2.9 Calculating computer capacity\n3. Underpinning\nSkills\n3.1 Reading skills required to interpret work instruction\n3.2 Communication skills\n4. Methods of\nAssessment\nThe assessor may select two of the following assessment\nmethods to objectively assess the candidate:\n4.1 Observation\n4.2 Questioning\n4.3 Practical demonstration\n5. Resource\nimplication\n5.1 Computer hardware with peripherals\n5.2 Appropriate software\n6. Context for\nAssessment\n6.1 Assessment may be conducted in the workplace or in a\nsimulated environment\n\n--- PDF PAGE 31 ---\nTR – BREAD AND PASTRY PRODUCTION NC II\n Promulgated July 2009\n29\nCORE COMPETENCIES\n\nUNIT OF COMPETENCY: PREPARE AND PRODUCE BAKERY PRODUCTS\n\nUNIT CODE :"
        },
        "source_text": "TRS311203\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes\nand values needed to perform computer operations\nwhich includes inputting, accessing, producing and\ntransferring data using the appropriate hardware and\nsoftware\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\n1. Plan and prepare for\ntask to be\nundertaken\n1.1 Requirements of task are determined\n1.2 Appropriate hardware and software is selected\naccording to task assigned and required outcome\n1.3 Task is planned to ensure OH & S guidelines and\nprocedures are followed\n2. Input data into\ncomputer\n2.1 Data are entered into the computer using appropriate\nprogram/application in accordance with company\nprocedures\n2.2 Accuracy of information is checked and information is\nsaved in accordance with standard operating\nprocedures\n2.3 Inputted data are stored in storage media according to\nrequirements\n2.4 Work is performed within ergonomic guidelines\n3. Access information\nusing computer\n3.1 Correct program/application is selected based on job\nrequirements\n3.2 Program/application containing the information\nrequired is accessed according to company procedures\n3.3 Desktop icons are correctly selected, opened and\nclosed for navigation purposes\n3.4 Keyboard techniques are carried out in line with OH &\nS requirements for safe use of keyboards\n4. Produce/output data\nusing computer\nsystem\n4.1 Entered data are processed using appropriate software\ncommands\n4.2 Data are printed out as required using computer\nhardware/peripheral devices in accordance with\nstandard operating procedures\n4.3 Files and data are transferred between compatible\nsystems using computer software, hardware/ peripheral\ndevices in accordance with standard operating\nprocedures\n5. Maintain computer\nequipment and\nsystems\n5.1 Systems for cleaning, minor maintenance and\nreplacement of consumables are implemented\n5.2 Procedures for ensuring security of data, including\nregular back-ups and virus checks are implemented in\naccordance with standard operating procedures\n5.3 Basic file maintenance procedures are implemented in\nline with the standard operating procedures\n\n--- PDF PAGE 29 ---\nTR – BREAD AND PASTRY PRODUCTION NC II\n Promulgated July 2009\n27\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Hardware and peripheral\ndevices\n1.1 Personal computers\n1.2 Networked systems\n1.3 Communication equipment\n1.4 Printers\n1.5 Scanners\n1.6 Keyboard\n1.7 Mouse\n2. Software\nSoftware includes the following but not limited to:\n2.1 Word processing packages\n2.2 Data base packages\n2.3 Internet\n2.4 Spreadsheets\n3. OH & S guidelines\n3.1 OHS guidelines\n3.2 Enterprise procedures\n4. Storage media\nStorage media include the following but not limited to:\n4.1 diskettes\n4.2 CDs\n4.3 zip disks\n4.4 hard disk drives, local and remote\n5. Ergonomic guidelines\n5.1 Types of equipment used\n5.2 Appropriate furniture\n5.3 Seating posture\n5.4 Lifting posture\n5.5 Visual display unit screen brightness\n6. Desktop icons\nIcons include the following but not limited to:\n6.1 directories/folders\n6.2 files\n6.3 network devices\n6.4 recycle bin\n7. Maintenance\n7.1 Creating more space in the hard disk\n7.2 Reviewing programs\n7.3 Deleting unwanted files\n7.4 Backing up files\n7.5 Checking hard drive for errors\n7.6 Using up to date anti-virus programs\n7.7 Cleaning dust from internal and external surfaces\n\n--- PDF PAGE 30 ---\nTR – BREAD AND PASTRY PRODUCTION NC II\n Promulgated July 2009\n28\nEVIDENCE GUIDE\n1. Critical aspect of\ncompetency\nAssessment must show that the candidate:\n\n1.1 Selected and used hardware components correctly and\naccording to the task requirement\n1.2 Identified and explain the functions of both hardware and\nsoftware used, their general features and capabilities\n1.3 Produced accurate and complete data in accordance with\nthe requirements\n1.4 Used appropriate devices and procedures to transfer\nfiles/data accurately\n1.5 Maintained computer system\n2. Underpinning\nKnowledge\n2.1 Basic ergonomics of keyboard and computer use\n2.2 Main types of computers and basic features of different\noperating systems\n2.3 Main parts of a computer\n2.4 Storage devices and basic categories of memory\n2.5 Relevant types of software\n2.6 General security\n2.7 Viruses\n2.8 OH & S principles and responsibilities\n2.9 Calculating computer capacity\n3. Underpinning\nSkills\n3.1 Reading skills required to interpret work instruction\n3.2 Communication skills\n4. Methods of\nAssessment\nThe assessor may select two of the following assessment\nmethods to objectively assess the candidate:\n4.1 Observation\n4.2 Questioning\n4.3 Practical demonstration\n5. Resource\nimplication\n5.1 Computer hardware with peripherals\n5.2 Appropriate software\n6. Context for\nAssessment\n6.1 Assessment may be conducted in the workplace or in a\nsimulated environment\n\n--- PDF PAGE 31 ---\nTR – BREAD AND PASTRY PRODUCTION NC II\n Promulgated July 2009\n29\nCORE COMPETENCIES\n\nUNIT OF COMPETENCY: PREPARE AND PRODUCE BAKERY PRODUCTS\n\nUNIT CODE :"
