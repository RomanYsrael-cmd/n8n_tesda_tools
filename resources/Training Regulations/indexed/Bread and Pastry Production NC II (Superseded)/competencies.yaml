g\n1.3 correct food storage\n1.4 appropriate and clean clothing\n1.5 avoidance of cross-contamination\n1.6 safe handling disposal of linen and laundry\n1.7 appropriate handling and disposal of garbage\n1.8 cleaning and sanitizing procedures\n1.9 personal hygiene\n2. Hygiene risk\n2.1 bacterial and other contamination arising from\npoor handling of food\n2.2 inappropriate storage of foods\n2.3 storage at incorrect temperatures\n2.4 foods left uncovered\n2.5 poor personal hygiene practices\n2.6 poor work practices\n2.6.1 cleaning\n2.6.2 housekeeping\n2.6.3 food handling\n2.6.4 vermin\n2.6.5 airborne dust\n2.7 cross-contamination through cleaning\ninappropriate cleaning practices\n2.8 inappropriate handling of potentially infectious\nlinen\n2.9 contaminated wastes such as blood and body\nsecretions\n2.10 disposal of garbage and contaminated or\npotentially contaminated wastes\n3. Minimizing or removing\nrisk\n3.1 auditing staff skills and providing training\n3.2 ensuring policies and procedures are followed\nstrictly\n3.3 audits or incidents with follow up actions\n\n--- PDF PAGE 24 ---\nTR – BREAD AND PASTRY PRODUCTION NC II\n Promulgated July 2009\n22\nEVIDENCE GUIDE\n1. Critical aspects of\nCompetency\nAssessment required evidence that the candidate :\n1.1 Followed hygiene procedures\n1.2 Identified and responded to hygiene risk\n1.3 Practiced personal grooming and hygiene\n2. Underpinning\nKnowledge\n2.1 Typical hygiene and control procedures in the hospitality\nand tourism industries\n2.2 Overview of legislation and regulation in relation to food\nhandling, personal and general hygiene\n2.3 Knowledge on factors which contribute to workplace\nhygiene problems\n2.4 General hazards in handling of food, linen and laundry and\ngarbage, including major causes of contamination and\ncross-infection\n2.5 Sources of and reasons for food poisoning\n3. Underpinning\nSkills\n3.1 Ability to follow correct procedures and instructions\n3.2 Ability to handle operating tools/ equipment\n3.3 Application to hygiene principles\n4. Resource\nImplications\n4.1 Hygiene procedures, actual or simulated workplace,\nproducts used in hotel/restaurant /tourism workplace\n5. Methods of\nAssessment\n5.1 Written examination\n5.2 Practical demonstration\n6. Context for\nAssessment\n6.1 Assessment may be done in the workplace or in a\nsimulated workplace setting (assessment centers)\n6.2 Assessment activities are carried out through TESDA's\naccredited assessment center\n\n--- PDF PAGE 25 ---\nTR – BREAD AND PASTRY PRODUCTION NC II\n Promulgated July 2009\n23\n UNIT OF COMPETENCY : DEVELOP AND UPDATE INDUSTRY\nKNOWLEDGE\n\n UNIT CODE : TRS311201\n\n UNIT DESCRIPTOR : This unit of competency deals with the\nknowledge, skills and attitude required to access,\nincrease and update industry knowledge. It\nincludes seek information on the industry and\nupdate industry knowledge\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized items are elaborated in the\nRange of Variables\n1. Seek information on\nthe industry\n1.1 Sources of information on the industry are\ncorrectly identified and accessed\n1.2 Information to assist effective work\nperformance is obtained in line with job\nrequirements\n1.3 Specific information on sector of work is\naccessed and updated\n1.4 Industry information is correctly applied to day-\nto-day work activities\n2. Update industry\nknowledge\n2.1 Informal and/or formal research is used to\nupdate general knowledge of the industry\n2.2 Updated knowledge is shared with customers\nand colleagues as appropriate and incorporated\ninto day-to-day working activities\n\n--- PDF PAGE 26 ---\nTR – BREAD AND PASTRY PRODUCTION NC II\n Promulgated July 2009\n24\n RANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Information sources\nMay include but are not limited to :\n1.1 media\n1.2 reference books\n1.3 libraries\n1.4 unions\n1.5 industry associations\n1.6 industry journals\n1.7 internet\n1.8 personal observation and experience\n2. Information to assist\neffective work performance\n2.1 different sectors of the industry and\nthe services available in each sector\n2.2 relationship between tourism and\nhospitality\n2.3 relationship between the industry and\nother industries\n2.4 industry working conditions\n2.5 legislation that affects the industry\n2.5.1 liquor\n2.5.2 health and safety\n2.5.3 hygiene\n2.5.4 gaming\n2.5.5 workers compensation\n2.5.6 consumer protection\n2.5.7 duty of care\n2.5.8 building regulations\n2.6 trade unions\n environmental issues and\nrequirements\n2.7 industrial relations issues and major\norganizations\n2.8 career opportunities within the\nindustry\n2.9 work ethic required to work in the\nindustry and industry expectations of\nstaff\n2.10 quality assurance\n\n--- PDF PAGE 27 ---\nTR – BREAD AND PASTRY PRODUCTION NC II\n Promulgated July 2009\n25\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Knew key sources of information on the industry\n1.2 Updated industry knowledge\n1.3 Accessed and used industry information\n\n2. Underpinning\nSkills\n2.1 Time management\n2.2 Ready skills needed to access industry information\n2.3 Basic competency skills needed to access the internet\n3. Underpinning\nKnowledge and\n3.1 Overview of quality assurance in the industry\n3.2 Role of individual staff members\n3.1 Industry information sources\n\n4. Resource\nImplications\n4.1 Sources of information on the industry\n4.2 Industry knowledge\n\n5. Methods of\nAssessment\n5.1 Interview/questions\n5.2 Practical demonstration\n5.3 Portfolio of industry information related to trainee’s work\n\n6. Context for\nAssessment\n6.1 Assessment may be done in the workplace or in a\nsimulated workplace setting (assessment centers)\n6.2 Assessment activities are carried out through TESDA's\naccredited assessment center\n\n--- PDF PAGE 28 ---\nTR – BREAD AND PASTRY PRODUCTION NC II\n Promulgated July 2009\n26\nUNIT OF COMPETENCY: PERFORM COMPUTER OPERATIONS\n\nUNIT CODE : TRS311203\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes\nand values needed to perform computer operations\nwhich includes inputting, accessing, producing and\ntransferring data using the appropriate hardware and\nsoftware\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\n1. Plan and prepare for\ntask to be\nundertaken\n1.1 Requirements of task are determined\n1.2 Appropriate hardware and software is selected\naccording to task assigned and required outcome\n1.3 Task is planned to ensure OH & S guidelines and\nprocedures are followed\n2. Input data into\ncomputer\n2.1 Data are entered into the computer using appropriate\nprogram/application in accordance with company\nprocedures\n2.2 Accuracy of information is checked and information is\nsaved in accordance with standard operating\nprocedures\n2.3 Inputted data are stored in storage media according to\nrequirements\n2.4 Work is performed within ergonomic guidelines\n3. Access information\nusing computer\n3.1 Correct program/application is selected based on job\nrequirements\n3.2 Program/application containing the information\nrequired is accessed according to company procedures\n3.3 Desktop icons are correctly selected, opened and\nclosed for navigation purposes\n3.4 Keyboard techniques are carried out in line with OH &\nS requirements for safe use of keyboards\n4. Produce/output data\nusing computer\nsystem\n4.1 Entered data are processed using appropriate software\ncommands\n4.2 Data are printed out as required using computer\nhardware/peripheral devices in accordance with\nstandard operating procedures\n4.3 Files and data are transferred between compatible\nsystems using computer software, hardware/ peripheral\ndevices in accordance with standard operating\nprocedures\n5. Maintain computer\nequipment and\nsystems\n5.1 Systems for cleaning, minor maintenance and\nreplacement of consumables are implemented\n5.2 Procedures for ensuring security of data, including\nregular back-ups and virus checks are implemented in\naccordance with standard operating procedures\n5.3 Basic file maintenance procedures are implemented in\nline with the standard operating procedures\n\n--- PDF PAGE 29 ---\nTR – BREAD AND PASTRY PRODUCTION NC II\n Promulgated July 2009\n27\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Hardware and peripheral\ndevices\n1.1 Personal computers\n1.2 Networked systems\n1.3 Communication equipment\n1.4 Printers\n1.5 Scanners\n1.6 Keyboard\n1.7 Mouse\n2. Software\nSoftware includes the following but not limited to:\n2.1 Word processing packages\n2.2 Data base packages\n2.3 Internet\n2.4 Spreadsheets\n3. OH & S guidelines\n3.1 OHS guidelines\n3.2 Enterprise procedures\n4. Storage media\nStorage media include the following but not limited to:\n4.1 diskettes\n4.2 CDs\n4.3 zip disks\n4.4 hard disk drives, local and remote\n5. Ergonomic guidelines\n5.1 Types of equipment used\n5.2 Appropriate furniture\n5.3 Seating posture\n5.4 Lifting posture\n5.5 Visual display unit screen brightness\n6. Desktop icons\nIcons include the following but not limited to:\n6.1 directories/folders\n6.2 files\n6.3 network devices\n6.4 recycle bin\n7. Maintenance\n7.1 Creating more space in the hard disk\n7.2 Reviewing programs\n7.3 Deleting unwanted files\n7.4 Backing up files\n7.5 Checking hard drive for errors\n7.6 Using up to date anti-virus programs\n7.7 Cleaning dust from internal and external surfaces\n\n--- PDF PAGE 30 ---\nTR – BREAD AND PASTRY PRODUCTION NC II\n Promulgated July 2009\n28\nEVIDENCE GUIDE\n1. Critical aspect of\ncompetency\nAssessment must show that the candidate:\n\n1.1 Selected and used hardware components correctly and\naccording to the task requirement\n1.2 Identified and explain the functions of both hardware and\nsoftware used, their general features and capabilities\n1.3 Produced accurate and complete data in accordance with\nthe requirements\n1.4 Used appropriate devices and procedures to transfer\nfiles/data accurately\n1.5 Maintained computer system\n2. Underpinning\nKnowledge\n2.1 Basic ergonomics of keyboard and computer use\n2.2 Main types of computers and basic features of different\noperating systems\n2.3 Main parts of a computer\n2.4 Storage devices and basic categories of memory\n2.5 Relevant types of software\n2.6 General security\n2.7 Viruses\n2.8 OH & S principles and responsibilities\n2.9 Calculating computer capacity\n3. Underpinning\nSkills\n3.1 Reading skills required to interpret work instruction\n3.2 Communication skills\n4. Methods of\nAssessment\nThe assessor may select two of the following assessment\nmethods to objectively assess the candidate:\n4.1 Observation\n4.2 Questioning\n4.3 Practical demonstration\n5. Resource\nimplication\n5.1 Computer hardware with peripherals\n5.2 Appropriate software\n6. Context for\nAssessment\n6.1 Assessment may be conducted in the workplace or in a\nsimulated environment\n\n--- PDF PAGE 31 ---\nTR – BREAD AND PASTRY PRODUCTION NC II\n Promulgated July 2009\n29\nCORE COMPETENCIES\n\nUNIT OF COMPETENCY: PREPARE AND PRODUCE BAKERY PRODUCTS\n\nUNIT CODE :\n\nTRS741379\n\nUNIT DESCRIPTOR :\n\nThis unit deals with the knowledge and skills required by\nbakers and pastry cooks (patissiers) to prepare and produce a\nrange of high-quality bakery products in commercial food\nproduction environments and hospitality establishments.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Prepare bakery products\n\n1.1 Required ingredients are selected, measured and\nweighed according to recipe or production\nrequirements and established standards and\nprocedures\n1.2 A variety of bakery products are prepared according\nto standard mixing procedures/formulation/ recipes\nand desired product characteristics\n1.3 Appropriate equipment are used according to\nrequired bakery products and standard operating\nprocedures\n1.4 Bakery products are baked according to techniques\nand appropriate conditions; and enterprise\nrequirement and standards\n1.5 Required oven temperature are selected to bake\ngoods in accordance with the desired characteristics,\nstandards recipe specifications and enterprise\npractices\n2. Decorate and present\nbakery products\n\n2.1 A variety of fillings and coating/icing,\nglazes and decorations for bakery products are\nprepared according to standard recipes,\nenterprise standards and/or customer\npreferences\n2.2 Bakery products are filled and decorated,\nwhere required and appropriate, in accordance\nwith standard recipes and/or enterprise\nstandards and customer preferences\n2.3 Bakery items are finished according to desired\n product characteristics\n2.4 Baked products are presented according to\nestablished standards and procedures\n3. Store bakery products\n\n3.1 Bakery products are stored according to\nestablished standards and procedures\n3.2 Packaging are selected appropriate for the\npreservation of product freshness and eating\ncharacteristics\n\n--- PDF PAGE 32 ---\nTR – BREAD AND PASTRY PRODUCTION NC II\n Promulgated July 2009\n30\nRANGE OF VARIABLES\n\nThis unit applies to the production of bakery products in various hospitality enterprises\nsuch as patisseries, restaurants, hotels, bakery, bakeshop operations and coffee shops. The\nfollowing explanations identify how this unit may be applied in different workplaces and\ncircumstances. Breads to be produced and decorated may be of various cultural origins and\nderived from classical or contemporary recipes.\n\nVARIABLE\nRANGE\n1. Ingredients\nMay include but are not limited to:\n1.1 Flours\n1.2 Sugars\n1.3 Eggs\n1.4 Milk\n1.5 Cream\n1.6 Gelatin\n1.7 Fruits\n1.8 Nuts\n1.9 Flavorings and essences\n1.10 Chocolate\n1.11 Leavening agents (Yeasts, baking powder, etc)\n2. Bakery products\n\nMay include but are not limited to:\n2.1 Yeast- Product types\n2.1.1 Lean-Yeast Dough\n- Crisp-crusted breads\n- Soft-crusted breads\n- Rye breads/whole wheat/multi-grain/\n health breads\n- Sour dough\n- Unleavened breads\n2.1.2 Soft Dough\n- Loaf and buns\n2.1.3 Rich-Yeast Dough\n- Sweet dough\n- Rolled-in dough/Laminated dough\n2.2 Quick Bread\n-\nMuffins\n-\nShortcakes\n2.3 Doughnuts, fritters, pancakes and\n waffles\n2.4 Cookies\n3. Product\ncharacteristics\n\nMay include but are not limited to:\n3.1 Color\n3.2 Consistency and texture\n3.3 Moisture content\n3.4 Mouth feel and eating properties\n3.5 Appearance\n4. Equipment\n\nMay include but are not limited to:\n4.1 Commercial mixers and attachments\n4.2 Cutting implements\n4.3 Scales\n4.4 Measures\n\n--- PDF PAGE 33 ---\nTR – BREAD AND PASTRY PRODUCTION NC II\n Promulgated July 2009\n31\n\n4.5 Bowls\n4,6 Ovens\n4,7 Moulds, shapes and cutters\n4.8 Baking sheets and containers\n4.9 Various shapes and sizes of pans\n5. Techniques and\nconditions\n\nMay include but are not limited to:\n5.1 Bread Baking\n5.1.1 Beating\n5.1.2 Whisking\n5.1.3 Folding\n5.1.4 Rolling\n5.1.5 Laminating\n5.1.6 Creaming\n5.1.7 Kneading\n5.1.8 Incorporating fat\n5.1.9 Make-up\n5.1.10 Proofing\n5.2 Scaling, Panning and Baking\n5.3 Appropriate Oven Temperature\n5.4 Altitude Adjustments\n5.5 Fillings\n6. Enterprise\nrequirements and\nstandards\nMay include but are not limited to:\n6.1 Scale to correct weight\n6.2 Color\n6.3 Consistency\n6.4 Texture\n6.5 Moisture\n6.6 Mouth feel\n6.7 Appearance\n6.8 Sale ability\n7. Fillings and\ncoating/icing,\nglazes and\ndecorations\n\nMay include but are not limited to:\n7.1 Jellies and glazes\n7.2 Flowers and leaves\n7.3 Herbs\n7.4 Flavored and colored sugar\n7.5 Fresh and preserved/crystallized fruits\n7.6 Seeds and nuts\n7.7 Icings, sprinkled icing sugar or chocolate\n powder\n7.8 Butter creams, Ganache, Fondants\n7.9 Savory fillings\n8. Bakery product\nfinishing\n\nMay include but are not limited to:\n8.1 Coating\n8.2 Glazing\n8.3 Icing\n9. Storage conditions\nMay include but are not limited to:\n9.1 Consideration of temperature, light and air exposure\n9.2 Use of appropriate containers\n9.3 Labeling\n9.4 Display cabinets including temperature-\n controlled cabinets to cool or warm\n9.5 Refrigeration, chilling and freezing\n9.6 Length of time in freezer /cool storage\n\n--- PDF PAGE 34 ---\nTR – BREAD AND PASTRY PRODUCTION NC II\n Promulgated July 2009\n32\nEVIDENCE GUIDE\n1. Critical aspects\n of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Demonstrated ability to produce a range of specialist bakery\nproducts, both sweet and savory according to establishment\nstandards and procedures\n1.2 Demonstrated ability to produce a quantity of bakery products\naccording to establishment standards and procedures\n1.3 Demonstrated ability to store and package bakery products\naccording to establishment’s standards and procedures\n1.4 Demonstrated application of hygiene and safety principles\naccording to established standards and procedures\n2. Underpinning\nKnowledge\n2.1Varieties and characteristics of bakery products\n2.2Historical and cultural, aspects of bakery products\n2.3Underlying principles in making bakery products\n2.4Knowledge commodity on including quality indicators of\ningredients for bakery products, properties of ingredients used,\ninteraction and changes during processing to produce required\ncharacteristics\n2.5Properties and requirements of yeast and control of yeast action\n2.6Culinary and technical terms related to bakery products commonly\nused in the industry\n2.7Expected taste, texture and crumb structure appropriate for\nparticular bakery products.\n2.8Ratio of ingredients required to produce a balanced formula\n2.9The influence of correct portion control, yields, weights and sizes\non the profitability of an establishment\n3. Underpinning\nSkills\n3.1 Processes of fermentation and dough development\n3.2 Principles and practices of hygiene, particularly on handling\ndough, commodities and products\n3.3 Safe work practices, particularly on using cutting implements,\nappliances, heated surfaces, ovens and mixing/kneading\nequipment and manual handling\n3.4 Function and routine maintenance of equipment used\n3.5 Portion control yield\n3.6 Storage conditions for bakery products and optimizing shelf-life\n3.7 Defining and applying corrective steps to ensure quality control\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1 Commercial kitchen environment using industry-current\nequipment for making a variety of specialized bakery products.\n4.2 Use of real ingredients\n4.3 Preparation, decoration and presentation of a range of specialist\nbakery products within typical workplace condition\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1 Observation of practical demonstration by the candidate on\npreparing, cooking and baking, filling, finishing, decorating and\npresenting specialized bakery products\n5.2 Questions to determine the underpinning knowledge of the\ncandidate related to tasks to be performed\n5.3 Review of portfolios of evidence\n5.4 Third party/workplace reports of on-the-job performance of the\ncandidate\n6. Context for\nAssessment\n6.1 Assessment may be done in the workplace or in a simulated\nworkplace setting (assessment centers)\n\n--- PDF PAGE 35 ---\nTR – BREAD AND PASTRY PRODUCTION NC II\n Promulgated July 2009\n33\n\nUNIT OF COMPETENCY: PREPARE AND PRODUCE PASTRY PRODUCTS\n\nUNIT CODE :\n\nTRS741380\n\nUNIT DESCRIPTOR :\n\nThis unit deals with knowledge and skills required by\nbakers and pastry cooks (patissiers) to prepare and\nproduce a range of high-quality pastry products in\ncommercial food production environments and hospitality\nestablishments.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Prepare pastry products\n\n1.1 Required ingredients are selected, measured and\nweighed according to recipe or production\nrequirements and established standards and\nprocedures\n1.2 A variety of pastry products are prepared according\nto standard mixing procedures/formulation/ recipes\nand desired product characteristics\n1.3 Appropriate equipment are used according to\nrequired pastry products and standard operating\nprocedures\n1.4 Pastry products are baked according to techniques\nand appropriate conditions; and enterprise\nrequirement and standards\n1.5 Required oven temperature are selected to bake\ngoods in accordance with the desired characteristics,\nstandards recipe specifications and enterprise\npractices\n2. Decorate and present\npastry products\n\n2.1 A variety of fillings and coating/icing,\nglazes and decorations for pastry products are\nprepared according to standard recipes,\nenterprise standards and/or customer\npreferences\n2.2 Pastry products are filled and decorated, where\nrequired and appropriate, in accordance with\nstandard recipes and/or enterprise standards\nand customer preferences\n2.5 Pastry products are finished according to\ndesired product characteristics\n2.6 Baked pastry products are presented according\nto established standards and procedures\n3. Store pastry products\n\n3.1 Pastry products are stored according to\n established standards and procedures\n3.2 Packaging are selected appropriate for the\n preservation of product freshness and eating\n characteristics\n\n--- PDF PAGE 36 ---\nTR – BREAD AND PASTRY PRODUCTION NC II\n Promulgated July 2009\n34\nRANGE OF VARIABLES\n\nThis unit applies to the production of pastry products in various hospitality enterprises\nsuch as patisseries, restaurants, hotels, bakery, bakeshop operations and coffee shops. The\nfollowing explanations identify how this unit may be applied in different workplaces and\ncircumstances. Pastries and cakes to be produced and decorated may be of various cultural\norigins and derived from classical or contemporary recipes.\n\nVARIABLE\nRANGE\n1. Ingredients\nMay include but are not limited to:\n1.1 Flours\n1.2 Sugars\n1.3 Eggs\n1.4 Milk\n1.5 Cream\n1.6 Gelatin\n1.7 Fruits\n1.8 Nuts\n1.9 Flavorings and essences\n1.10 Chocolate\n2. Pastry\nproducts\n\nMay include but are not limited to:\n2.1 Pastry Basics\n2.1.1 Pate Brisee and short pastries\n2.1.2 Puff Pastry\n2.1.3 Choux Pastry\n2.1.4 Strudel and Phyllo\n2.1.5 Baked Meringues\n2.2 Tarts and Special Pastries\n2.2.1 Tarts\n2.2.2 Pies\n2.3 Specialty (unique to locality)\n3. Product\ncharacteristics\n\nMay includes but are not limited to:\n3.1 Color\n3.2 Consistency and texture\n3.3 Moisture content\n3.4 Mouth feel and eating properties\n3.5 Appearance\n4. Equipment\n\nMay include but are not limited to:\n4.1 Commercial mixers and attachments\n4.2 Cutting implements\n4.3 Scales\n4.4 Measures\n4.5 Bowls\n4,6 Ovens\n4,7 Moulds, shapes and cutters\n4.8 Baking sheets and containers\n4.9 Various shapes and sizes of pans\n5. Techniques\nand conditions\n\nMay include but are not limited to:\n5.1 Cake Mixing\n5.1.1 Beating\n5.1.2 Whisking\n5.1.3 Folding\n\n--- PDF PAGE 37 ---\nTR – BREAD AND PASTRY PRODUCTION NC II\n Promulgated July 2009\n35\n\n5.1.4 Rolling\n5.1.5 Creaming\n5.1.6 Incorporating fat\n5.2 Different Methods of Mixing\n5.2.1 Sponge\n5.2.2 Genoise\n5.2.3 Swiss Rolls\n5.2.4 Joconde\n5.2.5 Chiffon Cakes\n5.3 Scaling, Panning and Baking\n5.4 Appropriate Oven Temperature\n5.5 Altitude Adjustments\n5.6 Fillings\n 5.6.1 Creams (e.g. fresh, butter, wine, etc.)\n 5.6.2 Chocolates\n 5.6.3 Jams\n 5.6.4 Custards, Ganaches\n 5.6.5 Savory fillings\n 5.6.6 Ready-made and pre-mixed\n6. Enterprise\nrequirements\nand standards\nMay include but are not limited to:\n6.1 Scale to correct weight\n6.2 Color\n6.3 Consistency\n6.4 Texture\n6.5 Moisture\n6.6 Mouth feel\n6.7 Appearance\n6.8 Sale ability\n7. Fillings and\ncoating/icing,\nglazes and\ndecorations\n\nMay include but are not limited to:\n7.1 Jellies and glazes\n7.2 Biscuits\n7.3 Flowers and leaves\n7.4 Herbs\n\n7.5 Flavored and colored sugar\n7.6 Fresh and preserved/crystallized fruits\n7.7 Seeds and nuts\n7.8 Icings, sprinkled icing sugar or chocolate\n powder\n7.9 Butter creams, Ganache, Fondants\n7.10 Tuile\n8. Pastry product\nfinishing\n\nMay include but are not limited to:\n8.1 Coating\n8.2 Glazing\n8.3 Icing\n9. Storage\nconditions\nMay include but are not limited to:\n9.1 Consideration of temperature, light and air exposure\n9.2 Use of appropriate containers\n9.3 Labeling\n9.4 Display cabinets including temperature-\n controlled cabinets to cools or warm\n9.5 Refrigeration, chilling and freezing\n9.6 Length of time in freezer /cool storage\n\n--- PDF PAGE 38 ---\nTR – BREAD AND PASTRY PRODUCTION NC II\n Promulgated July 2009\n36\nEVIDENCE GUIDE\n1. Critical aspects\n of Competency\nAssessment requires evidence that the candidate:\n1.1 Demonstrated ability to produce a range of specialist pastry\nproducts, both sweet and savory according to establishment\nstandards and procedures\n1.2 Demonstrated ability to produce a quantity of pastry products\naccording to establishment standards and procedures\n1.3 Demonstrated ability to store and package pastry and pastry\nproducts according to establishment’s standards and\nprocedures\n1.4 Demonstrated application of hygiene and safety principles\naccording to established standards and procedures\n\n2. Underpinning\nKnowledge\n2.1Varieties and characteristics of pastry products\n2.2Historical and cultural, aspects of pastry products\n2.3Underlying principles in making pastry products\n2.4Knowledge commodity on including quality indicators of\ningredients for pastry products, properties of ingredients used,\ninteraction and changes during processing to produce required\ncharacteristics\n2.5Properties and requirements of yeast and control of yeast action\n2.6Culinary and technical terms related to pastry products\ncommonly used in the industry\n2.7Expected taste, texture and crumb structure appropriate for\nparticular bakery products.\n2.8Ratio of ingredients required to produce a balanced formula\n2.9The influence of correct portion control, yields, weights and sizes\non the profitability of an establishment\n\n3. Underpinning\nSkills\n3.1 Processes of fermentation and dough development\n3.2 Principles and practices of hygiene, particularly on handling\ndough, commodities and products\n3.3 Safe work practices, particularly on using cutting implements,\nappliances, heated surfaces, ovens and mixing/kneading\nequipment and manual handling\n3.4 Function and routine maintenance of equipment used\n3.5 Portion control yield\n3.6 Storage conditions for bakery products and optimizing shelf-life\n3.7 Defining and applying corrective steps to ensure quality control\n\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1 Commercial kitchen environment using industry-current\nequipment for making a variety of specialized pastry products.\n4.2 Use of real ingredients\n4.3 Preparation, decoration and presentation of a range of\n specialist pastry products within typical workplace condition\n\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1 Observation of practical demonstration by the candidate on\npreparing, cooking and baking, filling, finishing, decorating and\npresenting specialized pastry products\n5.2 Questions to determine the underpinning knowledge of the\ncandidate related to tasks to be performed\n5.3 Review of portfolios of evidence\n5.4 Third party/workplace reports of on-the-job performance of the\ncandidate\n\n6. Context for\nAssessment\n6.1 Assessment may be done in the workplace or in a simulated\nworkplace setting (assessment centers)\n\n--- PDF PAGE 39 ---\nTR – BREAD AND PASTRY PRODUCTION NC II\n Promulgated July 2009\n37\n\nUNIT OF COMPETENCY: PREPARE AND PRESENT GATEAUX, TORTES AND\nCAKES\n\nUNIT CODE : TRS741342\n\nUNIT DESCRIPTOR :\n\nThis unit covers the knowledge and skills required by\nbakers and pastry cooks (patissiers) to produce, fill,\ndecorate and present a range of specialized sponges and\ncakes, where finish, decoration and presentation of a high\norder is required.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n\n1. Prepare\nsponge and\ncakes\n\n1.1 Ingredients are selected, measured and weighed according to\nrecipe requirements, enterprise practices and customer practices\n1.2 Required oven temperature is selected to bake goods in\naccordance with desired characteristics, standard recipe\nspecifications and enterprise practices\n1.3 Sponges and cakes are prepared according to recipe\nspecifications, techniques and conditions and desired product\ncharacteristics\n1.4 Appropriate equipment are used according to required pastry\nand bakery products and standard operating procedures\n1.5 Sponges and cakes are cooled according to established\nstandards and procedures\n\n2. Prepare and\nuse fillings\n\n2.1 Fillings are prepared and selected in accordance with required\nconsistency and appropriate flavors\n2.2 Slice or layer sponges and cakes are filled and assembled\naccording to standard recipe specifications, enterprise practice\nand customer preferences\n2.3 Coatings and sidings are selected according to the product\ncharacteristics and required recipe specifications\n\n3. Decorate\ncakes\n\n3.1 Sponges and cakes are decorated suited to the product and\noccasion and in accordance with standard recipes and enterprise\npractices\n3.2 Suitable icings and decorations are used according to standard\nrecipes and/or enterprise standards and customer preferences\n\n4. Present\ncakes\n4.1 Cakes are presented on accordance with customer’s expectations\nand established standards and procedures\n4.2 Equipment are selected and used in accordance with service\nrequirements\n4.3 Product freshness, appearances and eating qualities are\nmaintained in accordance with the established standards and\nprocedures\n4.4 Cakes are marked or cut portion-controlled to minimize wastage\nand in accordance with enterprise specifications and customer\npreferences\n\n5. Store cakes\n5.1 Cakes are stored in accordance with establishment’s standards\nand procedures\n5.2 Storage methods are identified in accordance with product\nspecifications and established standards and procedures\n\n--- PDF PAGE 40 ---\nTR – BREAD AND PASTRY PRODUCTION NC II\n Promulgated July 2009\n38\nRANGE OF VARIABLES\n\nThis unit applies to hospitality enterprises where specialized cakes are prepared and served, such\nas patisseries, pastry and cake shops, restaurants, hotels.\n\nVARIABLE\nRANGE\n1. Specialist cakes\nand sponges\n\nMay include but are not limited to:\n1.1 Cakes and sponges used as bases such as:\n• Genoise sponge\n• Swiss roll\n• Sponge fingers\n• Pound cakes, etc.\n1.2 Those that are for weddings, birthdays and special\noccasions\n1.3 Those that are for specific cultural feasts and\ncelebrations, both religious and secular\n2. Techniques and\nconditions for\nproducing\nspecialized\ncakes\n\nMay include but are not limited to:\n2.1 Weighing/measuring and sifting dry ingredients\n2.2 Adding fats and liquids to dry ingredients\n2.3 Stirring and aerating to achieve required consistency\nand texture\n2.4 Whisking, folding, piping and spreading\n2.5 Selecting and preparing appropriate baking sheets, cake\nand sponge tins and moulds\n2.6 Using required amount of batter according to the desired\ncharacteristics of finished products\n2.7 Preparing and using appropriate pre-bake finishes and\ndecorations\n2.8 Selecting baking conditions and temperatures\n2.9 Portioning evenly, accurately and neatly\n2.10 Decorating\n3. Product\ncharacteristics\nMay include but are not limited to:\n3.1 Color\n3.2 Consistency and texture\n3.3 Moisture content\n3.4 Mouth feel and eating properties\n3.5 Appearance\n4. Equipment\n\nMay include but are not limited to:\n4.1 Commercial mixers and attachments\n4.2 Whisks\n4.3 Beaters\n4.4 Spatulas, wooden spoons\n4.5 Cutting implements for nuts and fruits\n4.6 Graters\n4.7 Scales, measures\n4.8 Bowl cutters\n4.9 Piping bags and attachments\n4.10 Ovens\n4.11 Cake and sponge tins and moulds\n\n--- PDF PAGE 41 ---\nTR – BREAD AND PASTRY PRODUCTION NC II\n Promulgated July 2009\n39\n5. Fillings\nMay include but are not limited to:\n5.1 Fruit, fresh and crystallized\n5.2 Fruit purees\n5.3 Jams\n5.4 Nuts\n5.5 Creams\n5.6 Mousse\n5.7Custard\n6. Decorations\n\nMay include:\n6.1 Glazes and jellies\n6.2 Icing\n6.3 Chocolates\n6.4 Sprinkled icing sugar\n6.5 Fresh and preserved/crystallized fruits\n6.6 Fruit purees\n6.7 Nuts, whole or crushed\n6.8 Colored/flavored sugar\n6.9 Marzipan coatings\n6.10 Fondants, butter cream, boiled icings\n7. Storage\nconditions and\nmethods\nappropriate for\ncakes\nMay include but are not limited to:\n7.1 Consideration of temperature, light and air exposure\n7.2 Use of airtight containers\n7.3 Display cabinets including temperature-controlled\ncabinets\n7.4 Refrigeration, chilling and freezing\n8. Storage\nconditions\nMay include but are not limited to:\n8.1 Consideration of temperature, light and air exposure\n8.2 Use of appropriate containers\n8.3 Display cabinets including temperature-controlled\ncabinets to cools or warm\n8.4 Refrigeration, chilling and freezing\n\n--- PDF PAGE 42 ---\nTR – BREAD AND PASTRY PRODUCTION NC II\n Promulgated July 2009\n40\nEVIDENCE GUIDE\n1. Critical aspects\n of Competency\nAssessment requires evidence that the candidate:\n1.1 Demonstrated ability to produce a range of specialized\ncakes in accordance with established standards and\nprocedures\n1.2 Demonstrated ability to produce specialized in accordance\nwith workplace conditions and establishment’s standards\nand procedures\n1.3 Applied hygiene and safety principles in accordance with\nestablished standards and procedures\n2. Underpinning\nKnowledge\n2.1 Varieties and characteristics of specialized cakes, both\nclassical and contemporary\n2.2 Historical and cultural aspects of specialized cakes\n2.3 Underlying principles in making specialized cakes\n2.4 Commodity knowledge, including quality indicators of\nspecialist cake ingredients\n2.5 Culinary terms related to specialized cakes commonly used\nin the industry\n2.6 Hygiene and safe handling and storage requirements\nrelated to specialized cake ingredients, commodities and\nproducts\n2.7 Storage conditions for specialized cakes and optimizing\nshelf life\n3. Underpinning\nSkills\n3.1 Principles and practices of hygiene particularly in relation to\npreparing cake batter and decorating finished cake products\n3.2 Safe work practices, particularly in relation to using cutting\nimplements, appliances, heated surfaces, ovens and mixing\nequipment.\n3.3Portion control and yield\n4. Resource\nImplications\n4.1 Commercial kitchen environment using industry-current\nequipment for making specialized cake\n4.2 Use of real ingredients\n4.3 Preparation, decoration and presentation of a range of\nspecialized cakes within typical workplace conditions.\n5. Methods of\nAssessment\n5.1 Observation of practical demonstration by the candidate on\npreparing, decorating and presenting specialist cakes,\nincluding fillings\n5.2 Questions about hygiene procedures, commodities,\nproduction techniques and storage requirements\n5.3 Review of portfolios of evidence and third party workplace\nreports of on-the-job performance of the candidate\n6. Context for\nAssessment\n6.1 Assessment may be done in the workplace or in a simulated\nworkplace setting (assessment centers)\n\n--- PDF PAGE 43 ---\nTR – BREAD AND PASTRY PRODUCTION NC II\n Promulgated July 2009\n41\n\nUNIT OF COMPETENCY: PREPARE AND DISPLAY PETITS FOURS\n\nUNIT CODE :\n\nTRS741344\n\nUNIT DESCRIPTOR :\n\nThis unit applies to the knowledge and skills required by\nbakers and pastry cooks (patissiers) in commercial food\nproduction environments and hospitality establishments. It\ncovers the production, display and service of a wide\nrange of petits fours including petits fours glaces,\nmarzipan-based petits fours and caramelized fruits and\nnuts served as petits fours, to a level of high and\nconsistent quality.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Prepare iced\npetits fours\n\n1.1 Sponges and bases are prepared, cut and assembled\naccording to standard recipes and enterprise requirements\nand practices\n1.2 Fillings are prepared with the required flavors and\nconsistency\n1.3 Fondant icing are brought in accordance with the required\ntemperature and established standards and procedures\n1.4 Decorations are designed and used in accordance with\nestablishment standards and procedures\n2. Prepare fresh\npetits fours\n\n2.1 A selection of small choux paste shapes are baked and\ndecorated in accordance with established standards and\nprocedures\n2.2 Baked sweet paste are prepared and blended in accordance\nwith establishment standards and procedures\n2.3 Fillings are prepared and used the required flavors and correct\nconsistency\n2.4 Garnishes, glazes and finished are used in accordance with\nestablished standards and procedures\n3. Prepare marzipan\npetits fours\n\n3.1 Quality marzipan is flavored and shaped to produce mini-sized\nfruits in accordance with enterprise and client requirements\n3.2 Marzipan fruits are coated to preserve desired eating\ncharacteristics and softened with egg whites, piped into\nshapes and sealed/browned with applied heat, according to\nenterprise practice\n4. Prepare\ncaramelized petits\nfours\n4.1 Fresh fruits/fruit segments are selected and coated with pale\namber-colored caramel or glazed or any coating specified by\nthe enterprise\n4.2 Sandwich dried fruits or nuts are filled with flavored marzipan\nand coated with pale amber-colored caramel according to\nspecifications and enterprise standards\n5. Display petits\nfours\n5.1 Appropriate receptacles are selected and prepared for petits\nfours\n5.2 Petits fours are displayed creatively to enhance customer\nappeal\n6. Store petits fours\n6.1 Petits fours are stored in proper temperatures and conditions\nto maintain maximum eating qualities, appearance and\nfreshness\n6.2 Petits fours are packaged in accordance with established\nstandards and procedures\n\n--- PDF PAGE 44 ---\nTR – BREAD AND PASTRY PRODUCTION NC II\n Promulgated July 2009\n42\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Fillings\n\nMay include:\n1.1 Custards\n1.2 Creams\n1.3Ganache\n2. Toppings and\ndecorations\n\nMay includes:\n2.1 Fresh fruits\n2.2 Glazes\n2.3 Fondant icing\n2.4 Chocolate\n3. Receptacles\n\nMay include:\n3.1 Chocolate\n3.2 Tulip paste\n3.3 Sugar lace\n3.4 Croquant\n3.5 Glass\n3.6 Crystal\n3.7 Ceramic\n3.8Metallic platters and trays\n\n--- PDF PAGE 45 ---\nTR – BREAD AND PASTRY PRODUCTION NC II\n Promulgated July 2009\n43\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Demonstrated ability to prepare and present a diverse range\nof petits fours in accordance with established standards and\nprocedures\n1.2 Demonstrated ability package and store a range of petits four\nin accordance with established standards and procedures\n1.3 Applied food hygiene and safety principles in accordance with\nthe preparation and presentation process\n1.4 Demonstration knowledge on the characteristics of petits four\nand suitable decorations/garnishes in accordance with\nestablished standards and procedures\n2. Underpinning\nKnowledge\n2.1 Varieties and characteristics of classical and contemporary\npetits four including taste, texture, structure, shape and size\nappropriate for petits fours, according to industry and\nenterprise standards\n2.2 Historical and cultural aspects of petits fours\n2.3 Underlying principles in making petits fours\n2.4 Commodity knowledge, including quality indicators of petits\nfours ingredients\n2.5 Culinary terms related to petits fours that are commonly\nused in the industry\n2.6 Storage conditions for petits fours and optimizing shelf life\n2.7 Properties of the ingredients used and their interaction and\nchanges during production\n3. Underpinning Skills\n3.1 Principles and practices of hygiene particularly in relation to\npreparing and decorating finished petits fours its ingredients\nand commodities\n3.2 Safe work practices, particularly in relation to using cutting\nimplements, appliances, heated surfaces, ovens and mixing\nequipment.\n3.3 Portion control and yield\n3.4 Working methods used in production and display of petits\nfours\n3.5 Defining and applying corrective steps to ensure quality\ncontrol\n3.6 Creative, artistic skills in decoration and presentation\n4. Resource\nImplications\n4.1 Commercial kitchen environment using industry-current\nequipment for making petits fours\n4.2 Use of real ingredients\n4.3 Preparation, decoration and presentation of a range of petits\nfours within typical workplace conditions.\n5. Methods of\nAssessment\n5.1 Observation of practical demonstration of the candidate while\npreparing decorating and presenting petits fours\n5.2 Questions about hygiene procedures, commodities,\npresentation and decoration techniques and storage\nrequirements to ensure optimum quality and foods safety\n5.3 Review of portfolios of evidence and third party workplace\nreports of on-the-job performance of the candidate\n6. Context for\nAssessment\n6.1 Assessment may be done in the workplace or in a simulated\nworkplace setting (assessment centers)\n\n--- PDF PAGE 46 ---\nTR – BREAD AND PASTRY PRODUCTION NC II\n Promulgated July 2009\n44\n\nUNIT OF COMPETENCY: PRESENT DESSERTS\n\nUNIT CODE :\n\nTRS741343\n\nUNIT DESCRIPTOR :\n\nThis unit covers the knowledge and skills in presenting\nthe various and specialized techniques of desserts\npresentation required by bakers and pastry cooks\n(patissiers) in commercial food production environments and\nhospitality establishments.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\n1. Present and serve plated\ndesserts\n\n1.1 Desserts are portioned and presented according\nto product items, occasion and enterprise\nstandards and procedures\n1.2 Desserts are plated and decorated in\naccordance with enterprise standards and\nprocedures\n2. Plan, prepare and present\ndessert buffet selection or\nplating\n\n2.1 Dessert buffet services are planned and utilized\naccording to available facilities, equipment and\ncustomer/enterprise requirements\n2.2 Variety of desserts are prepared and arranged in\naccordance with enterprise standards and\nprocedures\n3. Store and package\ndesserts\n\n3.1 Desserts are stored in accordance with the\nrequired temperature and customer’s\nspecifications.\n3.2 Desserts are packaged in accordance with\nestablished standards and procedures\n\n--- PDF PAGE 47 ---\nTR – BREAD AND PASTRY PRODUCTION NC II\n Promulgated July 2009\n45\nRANGE OF VARIABLES\n\nThis unit applies to hospitality enterprises where a variety range of desserts are prepared and\nserved, such as patisseries, pastry and cake shops, restaurants, hotels.\n\nVARIABLE\nRANGE\n1. Desserts\n\nMay include but are not limited to:\n1.1 Puddings, pies, tarts, flans, fritters\n1.2 Custards, creams\n1.3 Fruits, fresh and processed\n1.4 Charlotte, bavarois, mousse, soufflé, sabayon\n1.5 Meringues, crepes, sweet omelettes\n1.6 Sorbet, ice cream, bombe, parfait\n1.7 Muffins, shortcakes\n1.8 Doughnuts, fritters, pancakes and waffles\n1.9 Cakes and sponges such as swiss roll, pound\ncakes, etc.\n1.10 Marzipan\n2. Product characteristics\nMay include but are not limited to:\n2.1 Color\n2.2 Consistency and texture\n2.3 Moisture content\n2.4 Mouth feel and eating properties\n2.5 Appearance\n3. Equipment\n\nMay include but are not limited to:\n3.1 Commercial mixers and attachments\n3.2 Whisks\n3.3 Beaters\n3.4 Spatulas\n3.5 Wooden spoons\n3.6 Cutting implements for nuts and fruits\n3.7 Graters\n3.8 Scales,\n3.9 Measures\n3.10 Bowl cutters\n3.11 Piping bags and attachments\n3.12 Ovens\n3.13 Cake and sponge tins and moulds\n4. Storage conditions and\nmethods\nMay include but are not limited to:\n4.1 Consideration of temperature, light and air\npressure\n4.2 Use of appropriate containers\n4.3 Labeling\n4.4 Display cabinets, including temperature-\ncontrolled cabinets\n4.5 Refrigeration, chilling and freezing\n4.6 Length of time in freezer/cool storage\n\n--- PDF PAGE 48 ---\nTR – BREAD AND PASTRY PRODUCTION NC II\n Promulgated July 2009\n46\nEVIDENCE GUIDE\n1. Critical aspects of\n Competency\nAssessment requires evidence that the candidate:\n1.1 Demonstrated ability to prepare and present a variety of desserts\nin accordance with established standards and procedures\n1.2 Demonstrated ability to store and package a variety of desserts\nin accordance with establishment standards and procedures\n1.3 Applied food hygiene and safety principles in accordance with\nthe preparation/presentation process\n1.4 Demonstration knowledge on the characteristics of desserts and\ndecorations/garnishes and the conditions required for optimum\nquality and presentation.\n2. Underpinning\nKnowledge\n2.1 Varieties and characteristics of specialized cakes, both classical\nand contemporary\n2.2 Historical and cultural aspects of specialized cakes\n2.3 Underlying principles in making specialized cakes\n2.4 Commodity knowledge, including quality indicators of specialized\ncake ingredients\n2.5 Culinary terms related to specialized cakes that are commonly\nused in the industry\n2.6 Storage conditions for specialized cakes and optimizing shelf\nlife\n3. Underpinning\nSkills\n3.1 Principles and practices of hygiene particularly in relation to\npreparing cake batter and decorating finished cake products\n3.2 Safe work practices, particularly in relation to using cutting\nimplements, appliances, heated surfaces, ovens and mixing\nequipment.\n3.3 Hygiene and safe handling and storage requirements related to\nspecialized cake ingredients, commodities and products\n3.4 Portion control and yield\n4. Resource\nImplications\n4.1 Commercial kitchen environment using industry-current\nequipment for making various desserts.\n4.2 Use of real desserts decoration/garnish ingredients\n4.3 Preparation, decoration and presentation of a variety of desserts\nwithin typical workplace conditions.\n5. Methods of\nAssessment\n5.1 Observation of practical demonstration by the candidate on\ndecorating and presenting specialized cakes including plating\nand garnishing\n5.2 Questions about hygiene procedures, commodities, presentation\nand decoration techniques and storage requirements to ensure\noptimum quality and food safety\n5.3 Review of portfolios of evidence and third party workplace\nreports of on-the-job performance of the candidate\n6. Context for\nAssessment\n6.1 Assessment may be done in the workplace or in a\nsimulated workplace setting (assessment centers)\n\n--- PDF PAGE 49 ---\nTR – BREAD AND PASTRY PRODUCTION NC II\n Promulgated July 2009\n47"
