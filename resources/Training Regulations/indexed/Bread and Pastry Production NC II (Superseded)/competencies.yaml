  "source_section_text": "Section 1. Successful candidates shall be awarded a\nNational Certificate signed by the TESDA Director General.\n\n4.2 The qualification of Bread and Pastry Production NC II may be attained\nthrough:\n\n4.2.1 Demonstration of competence through project-type assessment\ncovering all required units of the qualification.\n\n4.2.2 Accumulation of Certificates of Competency (COC) in all the following\ngroups or clusters of core units of the Qualification.\n\n4.2.2.1 Bread Making\n 4.2.2.1.1 Prepare and produce bakery products\n 4.2.2.1.2 Present desserts\n4.2.2.2 Pastry Making\n 4.2.2.2.1 Prepare and produce pastry products\n 4.2.2.2.2 Present desserts\n4.2.2.3 Cake Making\n 4.2.2.3.1 Prepare and present gateaux, tortes and cakes\n 4.2.2.3.2 Present desserts\n4.2.2.4 Petits fours Making\n\n 4.2.2.4.1 Prepare and display petits fours\n 4.2.2.4.2 Present desserts\n\nSuccessful candidates shall be awarded Certificates of Competency\n(COC).\n\nUpon accumulation and submission of all the above COCs acquired for\nthe relevant units of competency comprising this qualification, an\nindividual shall be issued the corresponding National Certificate.\n\n4.3 Assessment shall focus on the core units of competency. The basic\nand common units shall be integrated or assessed concurrently with the\ncore units.\n\n4.4 The following are qualified to apply for assessment and certification:\n\n4.4.1 Graduates of formal, non-formal and informal including enterprise-\nbased training programs\n 4.4.2 Experienced workers (wage employed or self employed)\n\n4.5 The guidelines on assessment and certification are discussed in detail in the\n\"Procedures Manual on Assessment and Certification\" and \"Guidelines on\nthe Implementation of the Philippine TVET Qualification and Certification\nSystem (PTQCS)\".\n\n--- PDF PAGE 59 ---\nTR – BREAD AND PASTRY PRODUCTION NC II\n Promulgated July 2009\n57\n\nBASIC\nCOMPETENCIES\nCOMPETENCY MAP - TOURISM Sector\n(Hotel and Restaurant)\nBREAD AND PASTRY PRODUCTION NC II\nDevelop and\nupdate industry\nknowledge\nPerform\ncomputer\noperations\nProvide effective\ncustomer service\n\nObserve\nworkplace\n hygiene\nprocedures\nPerform\n workplace\nsafety practices\nCORE\nCOMPETENCIES\nCOMMON\nCOMPETENCIES\n\nPrepare\nsandwiches\nANNEX A\n\nOrganize\nand prepare\nfood\n\nPlan and control\nmenu based on\ncatering\n\nSelect, prepare\nand cook meat\n\nPackage prepare\nfoodstuffs\n\nEstablish and\nmaintain quality\ncontrol\n Manage facilities\nassociated with\ncommercial\ncatering\ncontracts\n\nApply\ncook-freeze\n production\nprocess\n\nOrganize\nbulk cooking\noperations\n\nPrepare\nhot and cold\ndesserts\n\nDevelop\n food safety\nprogram\n\nPrepare\nchocolate and\nchocolate\nconfectionery\n\n Receive and\nstore\nkitchen supplies\n\nDevelop menus\nto meet special\ndietary and\ncultural needs\n\nPrepare\npastry, cakes\nand yeast-based\nproducts\n\nPrepare\nvegetables, eggs\nand starch\nproducts\n\nPrepare\ncook and serve\nfood for\nmenus\n\nSelect, prepare\nand serve\nspecialized food\nitem\n\nSelect\ncatering\nsystems\n\nOperate\nfast food\noutlet\n\nPrepare\nand cook\npoultry and game\n\nClean\nand maintain\nkitchen premises\n Plan, prepare\nand display\nbuffet\n Plan\nand prepare food\nfor buffets\n\nPlan\ncatering for an\nevent or function\n\nSelect, prepare\nand serve\nspecialist cuisines\n\nPresent food\n\nApply\ncook chill\noperation\nprocesses\n\nPrepare\nand cook\nseafood\n\nPrepare\nappetizers and\nsalads\n\nPrepare\nportion controlled\nmeat cuts\nImplement\nfood safety\nprocedures\n\nPrepare food\naccording to\ndietary and\ncultural needs\n\nMonitor\ncatering revenue\nand costs\n\nApply\ncatering control\nprinciples\n\nHandle and\nserve cheese\n\nPrepare\nstocks, sauces\nand soups\n\nTransport and store\nfood in a safe\nand hygienic\nmanner\n\nPrepare\npates and\nterrines\nDemonstrate\nwork values\nPractice\nhousekeeping\nprocedures\n(5S)\nParticipate\nin workplace\ncommunication\nWork\n in team\nenvironment\nPractice\ncareer\nprofessionalism\nWork\nwith others\nDevelop and\npractice\nnegotiation\nskills\nUse\nmathematical\nconcepts and\ntechniques\nUse\nrelevant\ntechnologies\nSolve problems\nrelated to work\nactivities\nReceive and\nrespond to\nworkplace\ncommunication\nDevelop\nteams and\nindividuals\nUtilize\nspecialized\ncommunication\nskills\nPractice\noccupational\nhealth and\nsafety procedures\nLead\nworkplace\n communication\nCollect,\nanalyze and\norganize\ninformation\nPlan\nand organize\nwork\nApply\nproblem-\nsolving\ntechniques in\nthe workplace\nLead\nsmall teams\nPromote\nenvironmental\nprotection\nPrepare and\nproduce bakery produ\n\nPrepare and\nproduce pastry\nproducts\n\nPrepare and\ndisplay petits fours\n\nPresent\ndesserts\nPrepare and\npresent gateaux,\ntortes and cakes\n\n--- PDF PAGE 60 ---\nTR – BREAD AND PASTRY PRODUCTION NC II\n Promulgated July 2009\n58\n\nDEFINITION OF TERMS\n\nAlmond paste\nA mixture of finely ground almonds and sugar\nAngel food cake\nA type of cake made of meringue and flour\nBaba\nA type of yeast bread or cake that is soaked in syrup\nBagel\nA ring-shaped lean yeast bread or coffee cake\nBagged\nA cookie make up method on which the dough is shaped\nand deposited with a pastry bag\nBar\nA cookie make up method in which the dough is shaped\ninto flattened cylinders, baked, and sliced crosswise into\nindividual cookies\nBatter\nA semi-liquid mixture made of flour or other starch used for\nthe production of cakes and breads; also used for coating\nproducts to be fried\nBavarian cream\nA light, cold dessert made of gelatin, whipped cream and\ncustard sauce or fruit\nBoiled icing\nItalian meringue used as cake icing\nBavarois\nBeaters\nBombe\nA type of frozen dessert made in a dome-shape\nBread flour\nStrong flour such as patent flour used for breads\nBrioche\nRich yeast dough containing large amounts of eggs and\nbutter; a product made from this dough\nBrown sugar\nRegular granulated sucrose containing various impurities\nthat give distinctive flavor\nButter cream\nAn icing made of butter and/or shortening blended with\nconfectioners’ sugar or sugar syrup, other ingredients may\nalso be added\nCake flour\nA fine, white flour made from soft wheat\nCaramelization\nThe browning of sugar caused by heat\nCharlotte\nA cold dessert made of Bavarian cream or other cream in a\nspecial mould, usually lined with lady fingers or other\nsponge products; a hot dessert made of cooled fruit and\nbaked in a special mould lined with strips of bread\nChemical\nleavener\nA leavener such as baking soda, baking powder, or baking\nammonia, which releases gases produced by chemical\nreactions\nChiffon cake\nA light cake made following the chiffon method – cake\nmixing method involving the folding\nCocoa\nThe dry powder that remains after cocoa solids and cocoa\nbutter\nCocoa butter\nA white or yellowish fat found in natural chocolate\nCommon\nmeringue\nEggwhites and sugar whipped to a foam’, also called\nFrench meringue\nCompote\nCooked fruit served in its cooking liquid, usually a sugar\nsyrup\n\n--- PDF PAGE 61 ---\nTR – BREAD AND PASTRY PRODUCTION NC II\n Promulgated July 2009\n59\n\nConfectioners’\nsugar\nSucrose ground in to fine powder and mixed with a little\ncornstarch to prevent caking\nCreaming method\nA mixing method that begins with the blending of fat and\nsugar; used for cakes, cookies and similar items\nCrepes\nA very thin French pancake, often served rolled with filling\nCroissants\nA flaky, buttery yeast roll shaped like a crescent and made\nfrom a rolled-in dough\nCrystallize\nTo form crystals, as in the case of dissolved sugar\nCustard\nA liquid that is thickened or set by coagulation of egg\nprotein\nDark chocolate\nSweetened chocolate consist of chocolate liquor and sugar\nDredge\nTo sprinkle thoroughly with sugar or another dry powder\nDrop batter\nA batter that is too thick to pour but will drop from a spoon\nin lumps\nFondant\nA type of icing made pf boiled sugar syrup that is agitated\nso that it would crystallize into a mass of extremely small\nwhite crystals\nGanache\nA rich cream made of chocolate and heavy cream\nGateau\nFrench word for cake\nGelatin\nA water soluble protein extracted from animal tissue and is\nused as a jelling agent\nGenoise\nA sponge cake made by whipping whole eggs with sugar\nand folding in flour and sometimes, melted butter\nGlace\nGlazed, coated with icing; frozen\nGlaze\nA shiny coating such as syrup, applied to a food; to make a\nfood shiny or glossy by coating it with a glaze or by\nbrowning it under a broiled or in a hot oven\nGluten\nAn elastic substance formed from proteins present in wheat\nflours which gives structure and strength to baked goods\nGranulated sugar\nSucrose in a fine crystalline form\nGum paste\nA type of sugar paste or pastillage made from vegetable\ngum\nIce cream\nA churn-frozen mixture of milk, cream, sugar, flavorings\nand sometimes eggs\nLeavening\nThe production or incorporation of gases in a baked\nproduct to increase volume and to produce shape and\ntexture\nMargarine\nAn artificial butter product made from various hydrogenated\nfats and flavorings\nMarzipan\nA paste or confection, icing or filling made of meringue and\ngelatin (or other stabilizers)\nMeringues\nA thick, white foam made of whipped egg whites and sugar\nMilk chocolate\nSweetened chocolate containing milk solids\nMoulded\nA cookie make up method in which the dough is shaped\ninto cylinders, cut into equal portions, and shaped as\ndesired\nMousse\nA soft or creamy dessert made light adding whipped\ncream, egg whites or both\nMuffin method\nA mixing method in which the mixed dry ingredients are\ncombined with the mixed liquid ingredients\nParfait\nA type of sundae served in a tall, thin glass; a still frozen\ndessert made of egg yolks syrup and heavy cream\n\n--- PDF PAGE 62 ---\nTR – BREAD AND PASTRY PRODUCTION NC II\n Promulgated July 2009\n60\nPastry cream\nA thick custard sauce containing eggs and starch\nPastry flour\nA weak flour used for pastries and cookies\nPeel\nA flat wooden shovel used to place and remove hearth\nbreads in an oven\nPetit four\nA delicate cake or pastry small enough to be eaten in one\nor two bites\nPour batter\nA batter that is liquid enough to pour\nPuff pastry\nA very light, flaky pastry made from a rolled-in dough and\nleavened by steam\nRetarder-proofer\nAn\nautomated,\ntimer\ncontrolled\ncombination\nof\nretarder/freezer and proofer used for holding and proofing\nyeast product\nSabayon\nA foamy dessert or sauce made of egg yolks whipped with\nwine or liqueur\nSavarin\nA type of yeast bread or cake soaked in syrup\nSheet\nA cookie make up method in which the dough is baked in\nsheets and cut into portions\nSherbet/sorbet\nA frozen dessert made of water, sugar, fruit juice and\nsometimes milk or cream\nSoufflé\nA baked dish containing whipped egg whites, which make\nto dish rise during baking; a still frozen dessert made in a\nsoufflé dish so that it would resemble a baked soufflé\nSponge\nA batter or dough of yeast, flour and water that is allowed\nto ferment and is then mixed with more flour and other\ningredients to make a g=bread dough\nSponge cake\nA type of cake made by whipping eggs and sugar to a\nfoam, then folding in flour\nTart\nA flat, baked item consisting of a pastry and a sweet or\nsavory topping of filling; similar to a pie but usually thinner\nTulipe\nA thin, crisp cookie moulded into a cup shape\nTurntable\nA pedestal with a flat, rotating top used for holding cakes\nwhile they are being decorated\nZabaglione\nAn Italian dessert or sauce made of whipped egg yolk and\nmarsala wine\nZest\nThe colored outer portion of the peel of a citrus fruit\n\n--- PDF PAGE 63 ---\nTR – BREAD AND PASTRY PRODUCTION NC II\n Promulgated July 2009\n61\nACKNOWLEDGEMENTS\n\nThe Technical Education and Skills Development Authority (TESDA)\nwishes to extend thanks and appreciation to the many representatives of\nbusiness, industry, academe and go