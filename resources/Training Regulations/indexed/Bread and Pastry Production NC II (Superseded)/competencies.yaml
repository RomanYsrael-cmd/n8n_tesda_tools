        "source_title": "PRESENT DESSERTS",
        "source_text": "--- PDF PAGE 46 ---\nTR – BREAD AND PASTRY PRODUCTION NC II  \n Promulgated July 2009 \n44 \n \nUNIT OF COMPETENCY: PRESENT DESSERTS \n \nUNIT CODE                     :\n \nTRS741343\n \nUNIT DESCRIPTOR        : \n \n \nThis unit covers the knowledge and skills in presenting  \nthe various and specialized techniques of desserts \npresentation required by bakers and pastry cooks \n(patissiers) in commercial food production environments and \nhospitality establishments.  \n \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the \nRange of Variables\n1.  Present and serve plated \ndesserts \n \n \n \n1.1 Desserts are portioned and presented according \nto product items, occasion and enterprise \nstandards and procedures \n1.2  Desserts are plated and decorated in \naccordance with enterprise standards and \nprocedures\n2.   Plan, prepare and present \ndessert buffet selection or \nplating \n \n2.1 Dessert buffet services are planned and utilized \naccording to available facilities, equipment and \ncustomer/enterprise requirements \n2.2  Variety of desserts are prepared and arranged in \naccordance with enterprise standards and \nprocedures    \n3.  Store and package \ndesserts \n \n \n \n \n3.1 Desserts are stored in accordance with the \nrequired temperature and customer’s \nspecifications. \n3.2 Desserts are packaged in accordance with \nestablished standards and procedures\n\n--- PDF PAGE 47 ---\nTR – BREAD AND PASTRY PRODUCTION NC II  \n Promulgated July 2009 \n45 \nRANGE OF VARIABLES \n \nThis unit applies to hospitality enterprises where a variety range of desserts are prepared and \nserved, such as patisseries, pastry and cake shops, restaurants, hotels. \n \nVARIABLE \nRANGE \n1.   Desserts \n \n \n \n \n \nMay include but are not limited to: \n1.1 Puddings, pies, tarts, flans, fritters \n1.2 Custards, creams \n1.3 Fruits, fresh and processed \n1.4 Charlotte, bavarois, mousse, soufflé, sabayon \n1.5 Meringues, crepes, sweet omelettes \n1.6 Sorbet, ice cream, bombe, parfait \n1.7  Muffins, shortcakes \n1.8  Doughnuts, fritters, pancakes and waffles \n1.9  Cakes and sponges such as swiss roll, pound \ncakes, etc. \n1.10 Marzipan\n2.  Product characteristics \nMay include but are not limited to: \n2.1  Color \n2.2  Consistency and texture \n2.3  Moisture content \n2.4  Mouth feel and eating properties \n2.5  Appearance\n3.  Equipment \n \n \n \n \n \n \n \nMay include but are not limited to: \n3.1  Commercial mixers and attachments \n3.2  Whisks \n3.3  Beaters \n3.4  Spatulas \n3.5  Wooden spoons \n3.6  Cutting implements for nuts and fruits \n3.7  Graters \n3.8  Scales, \n3.9  Measures \n3.10 Bowl cutters \n3.11 Piping bags and attachments \n3.12 Ovens \n3.13 Cake and sponge tins and moulds\n4.   Storage conditions and \nmethods \nMay include but are not limited to: \n4.1  Consideration of temperature, light and air \npressure \n4.2  Use of appropriate containers \n4.3  Labeling \n4.4  Display cabinets, including temperature-\ncontrolled cabinets \n4.5  Refrigeration, chilling and freezing \n4.6  Length of time in freezer/cool storage\n\n--- PDF PAGE 48 ---\nTR – BREAD AND PASTRY PRODUCTION NC II  \n Promulgated July 2009 \n46 \nEVIDENCE GUIDE \n1.  Critical aspects  of\n      Competency \nAssessment requires evidence that the candidate: \n1.1 Demonstrated ability to prepare and present a variety of desserts \nin accordance with established standards and procedures \n1.2 Demonstrated ability to store and package a variety of desserts \nin accordance with establishment standards and procedures \n1.3 Applied food hygiene and safety principles in accordance with \nthe preparation/presentation process \n1.4 Demonstration knowledge on the characteristics of desserts and \ndecorations/garnishes and the conditions required for optimum \nquality and presentation. \n2.  Underpinning \nKnowledge  \n2.1 Varieties and characteristics of specialized cakes, both classical \nand contemporary  \n2.2 Historical and cultural aspects of specialized cakes \n2.3 Underlying principles in making specialized cakes  \n2.4 Commodity knowledge, including quality indicators of specialized \ncake ingredients  \n2.5 Culinary terms related to specialized cakes that are commonly \nused in the industry \n2.6 Storage conditions for specialized cakes and optimizing shelf \nlife\n3.  Underpinning \nSkills \n3.1 Principles and practices of hygiene particularly in relation to \npreparing cake batter and decorating finished cake products  \n3.2 Safe work practices, particularly in relation to using cutting \nimplements, appliances, heated surfaces, ovens and mixing \nequipment. \n3.3 Hygiene and safe handling and storage requirements related to \nspecialized cake ingredients, commodities and products \n3.4 Portion control and yield \n4.  Resource \nImplications \n4.1 Commercial kitchen environment using industry-current \nequipment for making various desserts. \n4.2 Use of real desserts decoration/garnish ingredients \n4.3 Preparation, decoration and presentation of a variety of desserts \nwithin typical workplace conditions. \n5.  Methods of \nAssessment \n5.1 Observation of practical demonstration by the candidate on \ndecorating and presenting specialized cakes including plating \nand garnishing \n5.2 Questions about hygiene procedures, commodities, presentation \nand decoration techniques and storage requirements to ensure \noptimum quality and food safety \n5.3 Review of portfolios of evidence and third party workplace \nreports of on-the-job performance of the candidate \n6.  Context for \nAssessment\n6.1  Assessment may be done in the workplace or in a \nsimulated workplace setting (assessment centers)\n",
