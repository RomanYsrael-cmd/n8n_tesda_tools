        "evidence_guide": {
          "source_text": "1. Critical aspects\n of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Demonstrated ability to produce a range of specialist bakery\nproducts, both sweet and savory according to establishment\nstandards and procedures\n1.2 Demonstrated ability to produce a quantity of bakery products\naccording to establishment standards and procedures\n1.3 Demonstrated ability to store and package bakery products\naccording to establishment’s standards and procedures\n1.4 Demonstrated application of hygiene and safety principles\naccording to established standards and procedures\n2. Underpinning\nKnowledge\n2.1Varieties and characteristics of bakery products\n2.2Historical and cultural, aspects of bakery products\n2.3Underlying principles in making bakery products\n2.4Knowledge commodity on including quality indicators of\ningredients for bakery products, properties of ingredients used,\ninteraction and changes during processing to produce required\ncharacteristics\n2.5Properties and requirements of yeast and control of yeast action\n2.6Culinary and technical terms related to bakery products commonly\nused in the industry\n2.7Expected taste, texture and crumb structure appropriate for\nparticular bakery products.\n2.8Ratio of ingredients required to produce a balanced formula\n2.9The influence of correct portion control, yields, weights and sizes\non the profitability of an establishment\n3. Underpinning\nSkills\n3.1 Processes of fermentation and dough development\n3.2 Principles and practices of hygiene, particularly on handling\ndough, commodities and products\n3.3 Safe work practices, particularly on using cutting implements,\nappliances, heated surfaces, ovens and mixing/kneading\nequipment and manual handling\n3.4 Function and routine maintenance of equipment used\n3.5 Portion control yield\n3.6 Storage conditions for bakery products and optimizing shelf-life\n3.7 Defining and applying corrective steps to ensure quality control\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1 Commercial kitchen environment using industry-current\nequipment for making a variety of specialized bakery products.\n4.2 Use of real ingredients\n4.3 Preparation, decoration and presentation of a range of specialist\nbakery products within typical workplace condition\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1 Observation of practical demonstration by the candidate on\npreparing, cooking and baking, filling, finishing, decorating and\npresenting specialized bakery products\n5.2 Questions to determine the underpinning knowledge of the\ncandidate related to tasks to be performed\n5.3 Review of portfolios of evidence\n5.4 Third party/workplace reports of on-the-job performance of the\ncandidate\n6. Context for\nAssessment\n6.1 Assessment may be done in the workplace or in a simulated\nworkplace setting (assessment centers)\n\n--- PDF PAGE 35 ---\nTR – BREAD AND PASTRY PRODUCTION NC II\n Promulgated July 2009\n33\n\nUNIT OF COMPETENCY: PREPARE AND PRODUCE PASTRY PRODUCTS\n\nUNIT CODE :"
        },
        "source_text": "TRS741379\n\nUNIT DESCRIPTOR :\n\nThis unit deals with the knowledge and skills required by\nbakers and pastry cooks (patissiers) to prepare and produce a\nrange of high-quality bakery products in commercial food\nproduction environments and hospitality establishments.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Prepare bakery products\n\n1.1 Required ingredients are selected, measured and\nweighed according to recipe or production\nrequirements and established standards and\nprocedures\n1.2 A variety of bakery products are prepared according\nto standard mixing procedures/formulation/ recipes\nand desired product characteristics\n1.3 Appropriate equipment are used according to\nrequired bakery products and standard operating\nprocedures\n1.4 Bakery products are baked according to techniques\nand appropriate conditions; and enterprise\nrequirement and standards\n1.5 Required oven temperature are selected to bake\ngoods in accordance with the desired characteristics,\nstandards recipe specifications and enterprise\npractices\n2. Decorate and present\nbakery products\n\n2.1 A variety of fillings and coating/icing,\nglazes and decorations for bakery products are\nprepared according to standard recipes,\nenterprise standards and/or customer\npreferences\n2.2 Bakery products are filled and decorated,\nwhere required and appropriate, in accordance\nwith standard recipes and/or enterprise\nstandards and customer preferences\n2.3 Bakery items are finished according to desired\n product characteristics\n2.4 Baked products are presented according to\nestablished standards and procedures\n3. Store bakery products\n\n3.1 Bakery products are stored according to\nestablished standards and procedures\n3.2 Packaging are selected appropriate for the\npreservation of product freshness and eating\ncharacteristics\n\n--- PDF PAGE 32 ---\nTR – BREAD AND PASTRY PRODUCTION NC II\n Promulgated July 2009\n30\nRANGE OF VARIABLES\n\nThis unit applies to the production of bakery products in various hospitality enterprises\nsuch as patisseries, restaurants, hotels, bakery, bakeshop operations and coffee shops. The\nfollowing explanations identify how this unit may be applied in different workplaces and\ncircumstances. Breads to be produced and decorated may be of various cultural origins and\nderived from classical or contemporary recipes.\n\nVARIABLE\nRANGE\n1. Ingredients\nMay include but are not limited to:\n1.1 Flours\n1.2 Sugars\n1.3 Eggs\n1.4 Milk\n1.5 Cream\n1.6 Gelatin\n1.7 Fruits\n1.8 Nuts\n1.9 Flavorings and essences\n1.10 Chocolate\n1.11 Leavening agents (Yeasts, baking powder, etc)\n2. Bakery products\n\nMay include but are not limited to:\n2.1 Yeast- Product types\n2.1.1 Lean-Yeast Dough\n- Crisp-crusted breads\n- Soft-crusted breads\n- Rye breads/whole wheat/multi-grain/\n health breads\n- Sour dough\n- Unleavened breads\n2.1.2 Soft Dough\n- Loaf and buns\n2.1.3 Rich-Yeast Dough\n- Sweet dough\n- Rolled-in dough/Laminated dough\n2.2 Quick Bread\n-\nMuffins\n-\nShortcakes\n2.3 Doughnuts, fritters, pancakes and\n waffles\n2.4 Cookies\n3. Product\ncharacteristics\n\nMay include but are not limited to:\n3.1 Color\n3.2 Consistency and texture\n3.3 Moisture content\n3.4 Mouth feel and eating properties\n3.5 Appearance\n4. Equipment\n\nMay include but are not limited to:\n4.1 Commercial mixers and attachments\n4.2 Cutting implements\n4.3 Scales\n4.4 Measures\n\n--- PDF PAGE 33 ---\nTR – BREAD AND PASTRY PRODUCTION NC II\n Promulgated July 2009\n31\n\n4.5 Bowls\n4,6 Ovens\n4,7 Moulds, shapes and cutters\n4.8 Baking sheets and containers\n4.9 Various shapes and sizes of pans\n5. Techniques and\nconditions\n\nMay include but are not limited to:\n5.1 Bread Baking\n5.1.1 Beating\n5.1.2 Whisking\n5.1.3 Folding\n5.1.4 Rolling\n5.1.5 Laminating\n5.1.6 Creaming\n5.1.7 Kneading\n5.1.8 Incorporating fat\n5.1.9 Make-up\n5.1.10 Proofing\n5.2 Scaling, Panning and Baking\n5.3 Appropriate Oven Temperature\n5.4 Altitude Adjustments\n5.5 Fillings\n6. Enterprise\nrequirements and\nstandards\nMay include but are not limited to:\n6.1 Scale to correct weight\n6.2 Color\n6.3 Consistency\n6.4 Texture\n6.5 Moisture\n6.6 Mouth feel\n6.7 Appearance\n6.8 Sale ability\n7. Fillings and\ncoating/icing,\nglazes and\ndecorations\n\nMay include but are not limited to:\n7.1 Jellies and glazes\n7.2 Flowers and leaves\n7.3 Herbs\n7.4 Flavored and colored sugar\n7.5 Fresh and preserved/crystallized fruits\n7.6 Seeds and nuts\n7.7 Icings, sprinkled icing sugar or chocolate\n powder\n7.8 Butter creams, Ganache, Fondants\n7.9 Savory fillings\n8. Bakery product\nfinishing\n\nMay include but are not limited to:\n8.1 Coating\n8.2 Glazing\n8.3 Icing\n9. Storage conditions\nMay include but are not limited to:\n9.1 Consideration of temperature, light and air exposure\n9.2 Use of appropriate containers\n9.3 Labeling\n9.4 Display cabinets including temperature-\n controlled cabinets to cool or warm\n9.5 Refrigeration, chilling and freezing\n9.6 Length of time in freezer /cool storage\n\n--- PDF PAGE 34 ---\nTR – BREAD AND PASTRY PRODUCTION NC II\n Promulgated July 2009\n32\nEVIDENCE GUIDE\n1. Critical aspects\n of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Demonstrated ability to produce a range of specialist bakery\nproducts, both sweet and savory according to establishment\nstandards and procedures\n1.2 Demonstrated ability to produce a quantity of bakery products\naccording to establishment standards and procedures\n1.3 Demonstrated ability to store and package bakery products\naccording to establishment’s standards and procedures\n1.4 Demonstrated application of hygiene and safety principles\naccording to established standards and procedures\n2. Underpinning\nKnowledge\n2.1Varieties and characteristics of bakery products\n2.2Historical and cultural, aspects of bakery products\n2.3Underlying principles in making bakery products\n2.4Knowledge commodity on including quality indicators of\ningredients for bakery products, properties of ingredients used,\ninteraction and changes during processing to produce required\ncharacteristics\n2.5Properties and requirements of yeast and control of yeast action\n2.6Culinary and technical terms related to bakery products commonly\nused in the industry\n2.7Expected taste, texture and crumb structure appropriate for\nparticular bakery products.\n2.8Ratio of ingredients required to produce a balanced formula\n2.9The influence of correct portion control, yields, weights and sizes\non the profitability of an establishment\n3. Underpinning\nSkills\n3.1 Processes of fermentation and dough development\n3.2 Principles and practices of hygiene, particularly on handling\ndough, commodities and products\n3.3 Safe work practices, particularly on using cutting implements,\nappliances, heated surfaces, ovens and mixing/kneading\nequipment and manual handling\n3.4 Function and routine maintenance of equipment used\n3.5 Portion control yield\n3.6 Storage conditions for bakery products and optimizing shelf-life\n3.7 Defining and applying corrective steps to ensure quality control\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1 Commercial kitchen environment using industry-current\nequipment for making a variety of specialized bakery products.\n4.2 Use of real ingredients\n4.3 Preparation, decoration and presentation of a range of specialist\nbakery products within typical workplace condition\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1 Observation of practical demonstration by the candidate on\npreparing, cooking and baking, filling, finishing, decorating and\npresenting specialized bakery products\n5.2 Questions to determine the underpinning knowledge of the\ncandidate related to tasks to be performed\n5.3 Review of portfolios of evidence\n5.4 Third party/workplace reports of on-the-job performance of the\ncandidate\n6. Context for\nAssessment\n6.1 Assessment may be done in the workplace or in a simulated\nworkplace setting (assessment centers)\n\n--- PDF PAGE 35 ---\nTR – BREAD AND PASTRY PRODUCTION NC II\n Promulgated July 2009\n33\n\nUNIT OF COMPETENCY: PREPARE AND PRODUCE PASTRY PRODUCTS\n\nUNIT CODE :"
      }
