  "source_section_text": "SECTION 3 TRAINING STANDARDS\n\nThese guidelines are set to provide Technical and Vocational Education\nand Training (TVET) providers with information and other important requirements\nto consider when designing training programs for certain occupations.\n\nThey include information on curriculum design; training delivery; trainee\nentry requirements; tools and equipment; training facilities; and trainer’s\nqualification, among others.\n\n3.1\nCURRICULUM DESIGN\n\nCourse Title: BREAD AND PASTRY PRODUCTION\nNC Level: NC II\n\nNominal Training Duration:\n18 Hours (Basic)\n\n18 Hours (Common)\n 105 Hours (Core)\n\nCourse Description:\n\nThis course is designed to enhance the knowledge, skills and attitude in\nbread and pastry production to prepare and present desserts; prepare and\ndisplay petits four in accordance with industry standards. It covers the basic,\ncommon and core competencies.\n\nTo obtain this, all units prescribed for this qualification must be achieved:\n\nBASIC COMPETENCIES\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and convey\nworkplace\ninformation\n1.2 Complete relevant\nwork related\ndocuments\n1.3 Participate in\nworkplace meeting\nand discussion\nGroup discussion\nInteraction\n\nDemonstration\nObservation\nInterviews/\nquestioning\n2. Work in a team\nenvironment\n2.1 Describe and\nidentify team role\nand responsibility in\na team\n2.2 Describe work as a\nteam member\nDiscussion\nInteraction\n\nDemonstration\nObservation\nInterviews/\nquestioning\n\n--- PDF PAGE 50 ---\nTR – BREAD AND PASTRY PRODUCTION NC II\n Promulgated July 2009\n48\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n3. Practice career\nprofessionalism\n3.1 Integrate personal\nobjectives with\norganizational goals\n3.2 Set and meet work\npriorities\n3.3 Maintain\nprofessional growth\nand development\nDiscussion\nInteraction\n\nDemonstration\nObservation\nInterviews/\nquestioning\n4. Practice occupational\nhealth and safety\n4.1 Evaluate hazard and\nrisks\n4.2 Control hazards and\nrisks\n4.3 Maintain\noccupational health\nand safety\nawareness\n\nDiscussion\nPlant tour\nSymposium\nObservation\nInterview\n\nCOMMON COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Develop and\nupdate industry\nknowledge\n1.1 Identify and access\nkey sources of\ninformation on the\nindustry\n1.2 Access, apply and\nshare industry\ninformation\n1.3 Update continuously\nrelevant industry\nknowledge\nLecture\nGroup Discussion\nIndividual/Group\nAssignment\n\nInterviews/\nQuestioning\nIndividual/Group\nProject or\nReport\n2. Observe\nworkplace\nhygiene\nprocedures\n2.1 Practice personal\ngrooming and\nhygiene\n2.2 Practice safe and\nhygienic handling,\nstorage and\ndisposal of food,\nbeverage and\nmaterials\nLecture\nDemonstration\nRole-play\nDemonstration\nWritten\nExamination\nInterviews/\nQuestioning\n\n--- PDF PAGE 51 ---\nTR – BREAD AND PASTRY PRODUCTION NC II\n Promulgated July 2009\n49\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n3. Perform\ncomputer\noperations\n3.1 Identify and explain the\nfunctions, general\nfeatures and capabilities\nof both hardware and\nsoftware\n3.2 Prepare and use\nappropriate hardware and\nsoftware according to\ntask requirement\n3.3 Use appropriate devices\nand procedures to\ntransfer files/data\n3.4 Produce accurate and\ncomplete data according\nto the requirements\n3.5 Maintain computer\nsystem\nLecture\nGroup\nDiscussion\nTutorial or self-\npace\n\nInterviews/\nQuestioning\nDemonstration\nObservation\n4. Perform\nworkplace\nand safety\npractices\n4.1 Practice workplace\nsafety, security and\nhygiene systems,\nprocesses and\noperations\n4.2 Respond appropriately to\nfaults, problems and\nemergency situations in\nline with enterprise\nguidelines\n4.3 Maintain safe personal\npresentation standards\nLecture\nDemonstration\nRole-play\nSimulation\nDemonstration\nInterviews/\nQuestioning\nWritten\nExamination\n5. Provide\neffective\ncustomer\nservice\n5.1 Apply effective verbal\nand non-verbal\ncommunication skills to\nrespond to customer\nneeds\nLecture\nDemonstration\nRole-play\nSimulation\nDemonstration\nInterviews/\nQuestioning\nObservation\n\n5.2 Provide prompt and\nquality service to\ncustomer\n5.3 Handle queries promptly\nand correctly in line with\nenterprise procedures\n5.4 Handle customer\ncomplaints, evaluation\nand recommendations\n\n--- PDF PAGE 52 ---\nTR – BREAD AND PASTRY PRODUCTION NC II\n Promulgated July 2009\n50\nCORE COMPETENCIES\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Prepare and\nproduce bakery\nproducts\n\n1.1 Prepare bakery\nproducts\n1.2 Decorate and present\nbakery products\n1.3 Store bakery\nproducts\n\nLecture/ Actual\nDemonstration/\nOn- the-job\ntraining ,Video\nPresentation\n\nOral\nquestioning\nand written\n examination\nObservation\nDemonstration\n2. Prepare and\nproduce pastry\nproducts\n2.1 Prepare pastry\nproducts\n2.2 Decorate and present\npastry products\n2.3 Store pastry products\nLecture/ Actual\nDemonstration/\nOn- the-job\ntraining ,Video\nPresentation\n\nOral\nquestioning\nand written\n examination\nObservation\nDemonstration\n3. Prepare and present\ngateaux, tortes and\ncakes\n\n3.1 Prepare sponge and\ncakes\n3.2 Prepare and use\nfillings\n3.3 Decorate cakes\n3.4 Present cakes\n3.5 Store cakes\nLecture/ Actual\nDemonstration/\nOn- the-job\ntraining ,Video\nPresentation\n\nOral\nquestioning\nand written\n examination\nObservation\nDemonstration\n4. Prepare and display\npetits fours\n4.1 Prepare iced petits\nfours\n4.2 Prepare fresh petits\nfours\n4.3 Prepare marzipan\npetits fours\n4.4 Prepare caramelized\npetits fours\n4.5 Display petits fours\n4.6 Store petits fours\nLecture/ Actual\nDemonstration/\nOn- the-job\ntraining ,Video\nPresentation\n\nOral\nquestioning\nand written\n examination\nObservation\nDemonstration\n5. Present desserts\n5.1 Prepare and serve\nplated desserts\n5.2 Plan, prepare and\n present dessert buffet\nselection or plating\n5.3 Store and package\ndesserts\nLecture/ Actual\nDemonstration/\nOn- the-job\ntraining ,Video\nPresentation\n\nOral\nquestioning\nand written\n examination\nObservation\nDemonstration\n\n--- PDF PAGE 53 ---\nTR – BREAD AND PASTRY PRODUCTION NC II\n Promulgated July 2009\n51\n3.2 TRAINING DELIVERY\n\nThe delivery of training should adhere to the design of the\ncurriculum. Delivery shall be guided by the 10 basic principles of\ncompetency-based TVET:\n\n• The training is based on curriculum developed from the\n\ncompetency standards;\n• Learning is modular in its structure;\n• Training delivery is learner-centered and should\n accommodate individualized and self-paced learning\n strategies;\n• Training is based on work that must be performed;\n• Training materials are directly related to the competency\n\nstandards and the curriculum modules;\n• Assessment is based in the collection of evidence of the\n\nperformance of work to the industry required standard;\n• Training is based both on and off-the-job components;\n• Training program allows for recognition of prior learning\n\n(RPL) or current competencies;\n• Training allows for multiple entry and exit; and\n• Training programs are registered with the UTPRAS.\n\nThe competency-based TVET system recognizes various\ntypes of delivery modes, both on and off-the-job as long as the\nlearning is driven by the competency standards specified by the\nindustry. The following training modalities may be adopted when\ndesigning training programs:\n\n• The dualized mode of training delivery is preferred and\nrecommended. Thus programs would contain both in-\nschool and in-industry training or fieldwork components.\nDetails can be referred to the Dual Training System\n(DTS) Implementing Rules and Regulations.\n\n• Modular/self-paced is a competency-based training\nmodality wherein the trainee is allowed to progress at his\nown pace. The trainer facilitates the training delivery.\n\n• Peer teaching/mentoring is a training modality wherein\nfast learners are given the opportunity to assist the slow\nlearners.\n\n• Supervised Industry Training or On-the-Job Training is an\napproach in training designed to enhance the knowledge\nand skills of the trainee through actual experience in the\nworkplace to acquire specific competencies prescribed in\nthe training regulations.\n\n--- PDF PAGE 54 ---\nTR – BREAD AND PASTRY PRODUCTION NC II\n Promulgated July 2009\n52\n• Distance learning is a formal education process in which\nmajority of the instruction occurs when the students and\ninstructor are not in the same place. Distance learning\nmay employ correspondence study, or audio, video or\ncomputer technologies.\n\n• Project-based instruction is an authentic instructional\nmodel or strategy in which students plan, implement and\nevaluate projects that have real world applications.\n\n3.3 TRAINEE ENTRY REQUIREMENTS\n\n Trainees or students who wants to entry into these qualifications\nshould possess the following requirements:\n\n• can communicate in basic English either oral and written;\n• at least high school graduate;\n• physically and mentally fit;\n• with good moral character; and\n• can perform basic mathematical computation\n• With pleasing personality\n\n--- PDF PAGE 55 ---\nTR – BREAD AND PASTRY PRODUCTION NC II\n Promulgated July 2009\n53\n3.4\nLIST OF TOOLS, EQUIPMENT AND MATERIALS\n\nRecommended list of tools, equipment and materials for the training\nof 25 trainees for BREAD AND PASTRY PRODUCTION NC II.\n\nTOOLS\nEQUIPMENT\nMATERIALS\nQTY\n\nQTY\n\nQTY\n\n12\nMeasuring cup, solid\n6\nCommercial Mixers with\ncomplete attachments\n\nCake flour\n12\nMeasuring cup, liquid\n(250 & 500 ml)\n1\nMechanical Dough roller\n\nBread Flour\n25\nMeasuring spoon\n1\nDecker oven\n\nAll-purpose\n3\nCake turn table\n1\nCompressor\n\nSugar\n20\nDecorating tips\n1\nDough cutter\n\nYeast\n6\nRolling pins\n\nButter\n6\nPie pan sizes 6, 8, 10\n\nMargarine\n6\nSheet pans\n\nButter (French bread)\n6\nPie cutter\n\nCooking oil\n6\nRubber scrapper\n\nLard\n6\nPalette knife\n\nAll-purpose cream\n6\nCake stand with tier\n\nWhipping cream\n6\nCake pillars\n\nConfectioner sugar\n6\nSauce pan, s/s\n\nKnox gelatin\n6\nLadles s/s\n\nFlaked almonds\n6\nKnives s/s with plastic\nhandle\n\nChocolate chips\n6\nChopping board, color\ncoded\n\nChocolate, shredded\n6\nScale 2, 10 kgs\n\nCherries with stem\n6\nGrater\n\nCherries\n6\nWooden spoons\n\nFood colors\n6\nBeaters\n\nTropical fruits\n12\nsets\nMixing bowl ( 6 pcs per\nset)\n4\nGas range\n\nWhole wheat, rye, multi\ngrain\n6\nWire whisk\n1\nUpright freezer\n\nCream cheese\n\n--- PDF PAGE 56 ---\nTR – BREAD AND PASTRY PRODUCTION NC II\n Promulgated July 2009\n54\n\nTOOLS\nEQUIPMENT\nMATERIALS\nQTY\n\nQTY\n\nQTY\n\n6\nMuffin pan, small\n1\nRefrigerator\n\nPaper cups\n6\nMuffin pan, medium\n\nTulip paste\n6\nMuffin pan, big\n\nSugar lace\n6\nLoaf pan, small\n\nPineapple juice\n6\nLoaf pan, medium\n\nContreau\n6\nLoaf pan, big\n\n4\nRectangular pan\n1x8x8\n\nTRAINING MATERIALS:\n6\nRound pan 6,8, 10,\n12, 14, 16\n\nWilton decorating\nmagazine, video\n6\nPie pan\n\nGood Housekeeping\nBaking Book\n6\nFlour sifter\n\n6\nStrainer\n\n3\nDouble boiler\n\nPiping bags\n\nCoupler\n\n--- PDF PAGE 57 ---\nTR – BREAD AND PASTRY PRODUCTION NC II\n Promulgated July 2009\n55\n3.5 TRAINING FACILITIES\n\nBREAD AND PASTRY PRODUCTION NC II\n\n The Bread and Pastry Production workshop must be of concrete\nstructure. Based on the class size of 25 students/trainees, the space\nrequirements for the teaching/learning and circulation areas are as\nfollows:\n\nSpace Requirement\n\nSize in Meters\n\nArea in Sq.\nMeters\n\nTotal Area in Sq.\nMeters\nLecture/Demo Area\n8 x 5 m\n40 sq. m.\n40 sq. m.\nStudent/trainee working\nspace\n1 x 1 m\n1 sq. m.\n25 sq. m.\nLaboratory\n8 x 5 sq. m.\n40 sq. m.\n40 sq. m.\nLearning Resource\nCenter\n3 x 5 sq. m.\n15 sq. m.\n15 sq. m.\nFacilities/Equipment/Cir\nculation Area\n\n36 sq. m.\nTotal Workshop Area :\n156 sq. m.\n\n3.6 TRAINER’S QUALIFICATIONS FOR TOURISM SECTOR\n\n BREAD AND PASTRY PRODUCTION NC II\n\n• Must have completed a Trainers Training Methodology Course (TM\n II) or its equivalent\n• Must have at least 2 years industry experience\n• Must be a holder of a Bread and Pastry Production NC level II or\nequivalent\n• Must be of good moral character\n• With pleasing personality\n• Must have attended relevant Bread and Pastry Production\ntrainings and seminars (for patisserie trainers) or equivalent\n• Proficient in bakery/pastry productions (for Bread and Pastry\nProduction trainers)\n\n 3.7 INSTITUTIONAL ASSESSMENT\n\nInstitutional assessment is undertaken by trainees to determine\ntheir achievement of units of competency. A certificate of achievement\nis issued for each unit of competency.\n\n--- PDF PAGE 58 ---\nTR – BREAD AND PASTRY PRODUCTION NC II\n Promulgated July 2009\n56"
