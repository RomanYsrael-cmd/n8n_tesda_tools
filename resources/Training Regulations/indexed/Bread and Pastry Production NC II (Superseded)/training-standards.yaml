    "source_text": "3.1\nCURRICULUM DESIGN\n\nCourse Title: BREAD AND PASTRY PRODUCTION\nNC Level: NC II\n\nNominal Training Duration:\n18 Hours (Basic)\n\n18 Hours (Common)\n 105 Hours (Core)\n\nCourse Description:\n\nThis course is designed to enhance the knowledge, skills and attitude in\nbread and pastry production to prepare and present desserts; prepare and\ndisplay petits four in accordance with industry standards. It covers the basic,\ncommon and core competencies.\n\nTo obtain this, all units prescribed for this qualification must be achieved:\n\nBASIC COMPETENCIES\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and convey\nworkplace\ninformation\n1.2 Complete relevant\nwork related\ndocuments\n1.3 Participate in\nworkplace meeting\nand discussion\nGroup discussion\nInteraction\n\nDemonstration\nObservation\nInterviews/\nquestioning\n2. Work in a team\nenvironment\n2.1 Describe and\nidentify team role\nand responsibility in\na team\n2.2 Describe work as a\nteam member\nDiscussion\nInteraction\n\nDemonstration\nObservation\nInterviews/\nquestioning\n\n--- PDF PAGE 50 ---\nTR – BREAD AND PASTRY PRODUCTION NC II\n Promulgated July 2009\n48\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n3. Practice career\nprofessionalism\n3.1 Integrate personal\nobjectives with\norganizational goals\n3.2 Set and meet work\npriorities\n3.3 Maintain\nprofessional growth\nand development\nDiscussion\nInteraction\n\nDemonstration\nObservation\nInterviews/\nquestioning\n4. Practice occupational\nhealth and safety\n4.1 Evaluate hazard and\nrisks\n4.2 Control hazards and\nrisks\n4.3 Maintain\noccupational health\nand safety\nawareness\n\nDiscussion\nPlant tour\nSymposium\nObservation\nInterview\n\nCOMMON COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Develop and\nupdate industry\nknowledge\n1.1 Identify and access\nkey sources of\ninformation on the\nindustry\n1.2 Access, apply and\nshare industry\ninformation\n1.3 Update continuously\nrelevant industry\nknowledge\nLecture\nGroup Discussion\nIndividual/Group\nAssignment\n\nInterviews/\nQuestioning\nIndividual/Group\nProject or\nReport\n2. Observe\nworkplace\nhygiene\nprocedures\n2.1 Practice personal\ngrooming and\nhygiene\n2.2 Practice safe and\nhygienic handling,\nstorage and\ndisposal of food,\nbeverage and\nmaterials\nLecture\nDemonstration\nRole-play\nDemonstration\nWritten\nExamination\nInterviews/\nQuestioning\n\n--- PDF PAGE 51 ---\nTR – BREAD AND PASTRY PRODUCTION NC II\n Promulgated July 2009\n49\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n3. Perform\ncomputer\noperations\n3.1 Identify and explain the\nfunctions, general\nfeatures and capabilities\nof both hardware and\nsoftware\n3.2 Prepare and use\nappropriate hardware and\nsoftware according to\ntask requirement\n3.3 Use appropriate devices\nand procedures to\ntransfer files/data\n3.4 Produce accurate and\ncomplete data according\nto the requirements\n3.5 Maintain computer\nsystem\nLecture\nGroup\nDiscussion\nTutorial or self-\npace\n\nInterviews/\nQuestioning\nDemonstration\nObservation\n4. Perform\nworkplace\nand safety\npractices\n4.1 Practice workplace\nsafety, security and\nhygiene systems,\nprocesses and\noperations\n4.2 Respond appropriately to\nfaults, problems and\nemergency situations in\nline with enterprise\nguidelines\n4.3 Maintain safe personal\npresentation standards\nLecture\nDemonstration\nRole-play\nSimulation\nDemonstration\nInterviews/\nQuestioning\nWritten\nExamination\n5. Provide\neffective\ncustomer\nservice\n5.1 Apply effective verbal\nand non-verbal\ncommunication skills to\nrespond to customer\nneeds\nLecture\nDemonstration\nRole-play\nSimulation\nDemonstration\nInterviews/\nQuestioning\nObservation\n\n5.2 Provide prompt and\nquality service to\ncustomer\n5.3 Handle queries promptly\nand correctly in line with\nenterprise procedures\n5.4 Handle customer\ncomplaints, evaluation\nand recommendations\n\n--- PDF PAGE 52 ---\nTR – BREAD AND PASTRY PRODUCTION NC II\n Promulgated July 2009\n50\nCORE COMPETENCIES\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Prepare and\nproduce bakery\nproducts\n\n1.1 Prepare bakery\nproducts\n1.2 Decorate and present\nbakery products\n1.3 Store bakery\nproducts\n\nLecture/ Actual\nDemonstration/\nOn- the-job\ntraining ,Video\nPresentation\n\nOral\nquestioning\nand written\n examination\nObservation\nDemonstration\n2. Prepare and\nproduce pastry\nproducts\n2.1 Prepare pastry\nproducts\n2.2 Decorate and present\npastry products\n2.3 Store pastry products\nLecture/ Actual\nDemonstration/\nOn- the-job\ntraining ,Video\nPresentation\n\nOral\nquestioning\nand written\n examination\nObservation\nDemonstration\n3. Prepare and present\ngateaux, tortes and\ncakes\n\n3.1 Prepare sponge and\ncakes\n3.2 Prepare and use\nfillings\n3.3 Decorate cakes\n3.4 Present cakes\n3.5 Store cakes\nLecture/ Actual\nDemonstration/\nOn- the-job\ntraining ,Video\nPresentation\n\nOral\nquestioning\nand written\n examination\nObservation\nDemonstration\n4. Prepare and display\npetits fours\n4.1 Prepare iced petits\nfours\n4.2 Prepare fresh petits\nfours\n4.3 Prepare marzipan\npetits fours\n4.4 Prepare caramelized\npetits fours\n4.5 Display petits fours\n4.6 Store petits fours\nLecture/ Actual\nDemonstration/\nOn- the-job\ntraining ,Video\nPresentation\n\nOral\nquestioning\nand written\n examination\nObservation\nDemonstration\n5. Present desserts\n5.1 Prepare and serve\nplated desserts\n5.2 Plan, prepare and\n present dessert buffet\nselection or plating\n5.3 Store and package\ndesserts\nLecture/ Actual\nDemonstration/\nOn- the-job\ntraining ,Video\nPresentation\n\nOral\nquestioning\nand written\n examination\nObservation\nDemonstration\n\n--- PDF PAGE 53 ---\nTR – BREAD AND PASTRY PRODUCTION NC II\n Promulgated July 2009\n51"
