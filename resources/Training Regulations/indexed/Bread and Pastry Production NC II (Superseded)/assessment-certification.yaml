      "number": "4.1",
      "text": "To attain the National Qualification of BREAD AND PASTRY PRODUCTION NC II, the candidate must demonstrate competence in all the units of competency listed in Section 1. Successful candidates shall be awarded a National Certificate signed by the TESDA Director General."
    },
    {
      "number": "4.2",
      "text": "The qualification of Bread and Pastry Production NC II may be attained through: 4.2.1 Demonstration of competence through project-type assessment covering all required units of the qualification. 4.2.2 Accumulation of Certificates of Competency (COC) in all the following groups or clusters of core units of the Qualification. 4.2.2.1 Bread Making 4.2.2.1.1 Prepare and produce bakery products 4.2.2.1.2 Present desserts 4.2.2.2 Pastry Making 4.2.2.2.1 Prepare and produce pastry products 4.2.2.2.2 Present desserts 4.2.2.3 Cake Making 4.2.2.3.1 Prepare and present gateaux, tortes and cakes 4.2.2.3.2 Present desserts 4.2.2.4 Petits fours Making 4.2.2.4.1 Prepare and display petits fours 4.2.2.4.2 Present desserts Successful candidates shall be awarded Certificates of Competency (COC). Upon accumulation and submission of all the above COCs acquired for the relevant units of competency comprising this qualification, an individual shall be issued the corresponding National Certificate."
    },
    {
      "number": "4.3",
      "text": "Assessment shall focus on the core units of competency. The basic and common units shall be integrated or assessed concurrently with the core units."
    },
    {
      "number": "4.4",
      "text": "The following are qualified to apply for assessment and certification: 4.4.1 Graduates of formal, non-formal and informal including enterprise- based training programs 4.4.2 Experienced workers (wage employed or self employed)"
