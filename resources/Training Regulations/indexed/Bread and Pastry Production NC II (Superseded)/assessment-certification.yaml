 a still frozen\ndessert made of egg yolks syrup and heavy cream\n\n--- PDF PAGE 62 ---\nTR – BREAD AND PASTRY PRODUCTION NC II\n Promulgated July 2009\n60\nPastry cream\nA thick custard sauce containing eggs and starch\nPastry flour\nA weak flour used for pastries and cookies\nPeel\nA flat wooden shovel used to place and remove hearth\nbreads in an oven\nPetit four\nA delicate cake or pastry small enough to be eaten in one\nor two bites\nPour batter\nA batter that is liquid enough to pour\nPuff pastry\nA very light, flaky pastry made from a rolled-in dough and\nleavened by steam\nRetarder-proofer\nAn\nautomated,\ntimer\ncontrolled\ncombination\nof\nretarder/freezer and proofer used for holding and proofing\nyeast product\nSabayon\nA foamy dessert or sauce made of egg yolks whipped with\nwine or liqueur\nSavarin\nA type of yeast bread or cake soaked in syrup\nSheet\nA cookie make up method in which the dough is baked in\nsheets and cut into portions\nSherbet/sorbet\nA frozen dessert made of water, sugar, fruit juice and\nsometimes milk or cream\nSoufflé\nA baked dish containing whipped egg whites, which make\nto dish rise during baking; a still frozen dessert made in a\nsoufflé dish so that it would resemble a baked soufflé\nSponge\nA batter or dough of yeast, flour and water that is allowed\nto ferment and is then mixed with more flour and other\ningredients to make a g=bread dough\nSponge cake\nA type of cake made by whipping eggs and sugar to a\nfoam, then folding in flour\nTart\nA flat, baked item consisting of a pastry and a sweet or\nsavory topping of filling; similar to a pie but usually thinner\nTulipe\nA thin, crisp cookie moulded into a cup shape\nTurntable\nA pedestal with a flat, rotating top used for holding cakes\nwhile they are being decorated\nZabaglione\nAn Italian dessert or sauce made of whipped egg yolk and\nmarsala wine\nZest\nThe colored outer portion of the peel of a citrus fruit\n\n--- PDF PAGE 63 ---\nTR – BREAD AND PASTRY PRODUCTION NC II\n