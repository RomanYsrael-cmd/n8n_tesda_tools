  "source_text": "SECTION 4 NATIONAL ASSESSMENT AND CERTIFICATION\nARRANGEMENTS\n\n4.1 To attain the National Qualification of BREAD AND PASTRY PRODUCTION\nNC II, the candidate must demonstrate competence in all the units of\ncompetency listed in Section 1. Successful candidates shall be awarded a\nNational Certificate signed by the TESDA Director General.\n\n4.2 The qualification of Bread and Pastry Production NC II may be attained\nthrough:\n\n4.2.1 Demonstration of competence through project-type assessment\ncovering all required units of the qualification.\n\n4.2.2 Accumulation of Certificates of Competency (COC) in all the following\ngroups or clusters of core units of the Qualification.\n\n4.2.2.1 Bread Making\n 4.2.2.1.1 Prepare and produce bakery products\n 4.2.2.1.2 Present desserts\n4.2.2.2 Pastry Making\n 4.2.2.2.1 Prepare and produce pastry products\n 4.2.2.2.2 Present desserts\n4.2.2.3 Cake Making\n 4.2.2.3.1 Prepare and present gateaux, tortes and cakes\n 4.2.2.3.2 Present desserts\n4.2.2.4 Petits fours Making\n\n 4.2.2.4.1 Prepare and display petits fours\n 4.2.2.4.2 Present desserts\n\nSuccessful candidates shall be awarded Certificates of Competency\n(COC).\n\nUpon accumulation and submission of all the above COCs acquired for\nthe relevant units of competency comprising this qualification, an\nindividual shall be issued the corresponding National Certificate.\n\n4.3 Assessment shall focus on the core units of competency. The basic\nand common units shall be integrated or assessed concurrently with the\ncore units.\n\n4.4 The following are qualified to apply for assessment and certification:\n\n4.4.1 Graduates of formal, non-formal and informal including enterprise-\nbased training programs\n 4.4.2 Experienced workers (wage employed or self employed)\n\n4.5 The guidelines on assessment and certification are discussed in detail in the\n\"Procedures Manual on Assessment and Certification\" and \"Guidelines on\nthe Implementation of the Philippine TVET Qualification and Certification\nSystem (PTQCS)\".\n\n--- PDF PAGE 59 ---\nTR – BREAD AND PASTRY PRODUCTION NC II\n Promulgated July 2009\n57\n\nBASIC\nCOMPETENCIES\n"
}
