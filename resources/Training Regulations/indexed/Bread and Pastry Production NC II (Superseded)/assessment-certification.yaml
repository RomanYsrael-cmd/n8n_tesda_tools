  "source_text": "SECTION 4 NATIONAL ASSESSMENT AND CERTIFICATION\nARRANGEMENTS\n\n4.1 To attain the National Qualification of BREAD AND PASTRY PRODUCTION\nNC II, the candidate must demonstrate competence in all the units of\ncompetency listed in Section 1. Successful candidates shall be awarded a\nNational Certificate signed by the TESDA Director General.\n\n4.2 The qualification of Bread and Pastry Production NC II may be attained\nthrough:\n\n4.2.1 Demonstration of competence through project-type assessment\ncovering all required units of the qualification.\n\n4.2.2 Accumulation of Certificates of Competency (COC) in all the following\ngroups or clusters of core units of the Qualification.\n\n4.2.2.1 Bread Making\n 4.2.2.1.1 Prepare and produce bakery products\n 4.2.2.1.2 Present desserts\n4.2.2.2 Pastry Making\n 4.2.2.2.1 Prepare and produce pastry products\n 4.2.2.2.2 Present desserts\n4.2.2.3 Cake Making\n 4.2.2.3.1 Prepare and present gateaux, tortes and cakes\n 4.2.2.3.2 Present desserts\n4.2.2.4 Petits fours Making\n\n 4.2.2.4.1 Prepare and display petits fours\n 4.2.2.4.2 Present desserts\n\nSuccessful candidates shall be awarded Certificates of Competency\n(COC).\n\nUpon accumulation and submission of all the above COCs acquired for\nthe relevant units of competency comprising this qualification, an\nindividual shall be issued the corresponding National Certificate.\n\n4.3 Assessment shall focus on the core units of competency. The basic\nand common units shall be integrated or assessed concurrently with the\ncore units.\n\n4.4 The following are qualified to apply for assessment and certification:\n\n4.4.1 Graduates of formal, non-formal and informal including enterprise-\nbased training programs\n 4.4.2 Experienced workers (wage employed or self employed)\n\n4.5 The guidelines on assessment and certification are discussed in detail in the\n\"Procedures Manual on Assessment and Certification\" and \"Guidelines on\nthe Implementation of the Philippine TVET Qualification and Certification\nSystem (PTQCS)\".\n\n--- PDF PAGE 59 ---\nTR – BREAD AND PASTRY PRODUCTION NC II\n Promulgated July 2009\n57\n\nBASIC\nCOMPETENCIES\nCOMPETENCY MAP - TOURISM Sector\n(Hotel and Restaurant)\nBREAD AND PASTRY PRODUCTION NC II\nDevelop and\nupdate industry\nknowledge\nPerform\ncomputer\noperations\nProvide effective\ncustomer service\n\nObserve\nworkplace\n hygiene\nprocedures\nPerform\n workplace\nsafety practices\nCORE\nCOMPETENCIES\nCOMMON\nCOMPETENCIES\n\nPrepare\nsandwiches\nANNEX A\n\nOrganize\nand prepare\nfood\n\nPlan and control\nmenu based on\ncatering\n\nSelect, prepare\nand cook meat\n\nPackage prepare\nfoodstuffs\n\nEstablish and\nmaintain quality\ncontrol\n Manage facilities\nassociated with\ncommercial\ncatering\ncontracts\n\nApply\ncook-freeze\n production\nprocess\n\nOrganize\nbulk cooking\noperations\n\nPrepare\nhot and cold\ndesserts\n\nDevelop\n food safety\nprogram\n\nPrepare\nchocolate and\nchocolate\nconfectionery\n\n Receive and\nstore\nkitchen supplies\n\nDevelop menus\nto meet special\ndietary and\ncultural needs\n\nPrepare\npastry, cakes\nand yeast-based\nproducts\n\nPrepare\nvegetables, eggs\nand starch\nproducts\n\nPrepare\ncook and serve\nfood for\nmenus\n\nSelect, prepare\nand serve\nspecialized food\nitem\n\nSelect\ncatering\nsystems\n\nOperate\nfast food\noutlet\n\nPrepare\nand cook\npoultry and game\n\nClean\nand maintain\nkitchen premises\n Plan, prepare\nand display\nbuffet\n Plan\nand prepare food\nfor buffets\n\nPlan\ncatering for an\nevent or function\n\nSelect, prepare\nand serve\nspecialist cuisines\n\nPresent food\n\nApply\ncook chill\noperation\nprocesses\n\nPrepare\nand cook\nseafood\n\nPrepare\nappetizers and\nsalads\n\nPrepare\nportion controlled\nmeat cuts\nImplement\nfood safety\nprocedures\n\nPrepare food\naccording to\ndietary and\ncultural needs\n\nMonitor\ncatering revenue\nand costs\n\nApply\ncatering control\nprinciples\n\nHandle and\nserve cheese\n\nPrepare\nstocks, sauces\nand soups\n\nTransport and store\nfood in a safe\nand hygienic\nmanner\n\nPrepare\npates and\nterrines\nDemonstrate\nwork values\nPractice\nhousekeeping\nprocedures\n(5S)\nParticipate\nin workplace\ncommunication\nWork\n in team\nenvironment\nPractice\ncareer\nprofessionalism\nWork\nwith others\nDevelop and\npractice\nnegotiation\nskills\nUse\nmathematical\nconcepts and\ntechniques\nUse\nrelevant\ntechnologies\nSolve problems\nrelated to work\nactivities\nReceive and\nrespond to\nworkplace\ncommunication\nDevelop\nteams and\nindividuals\nUtilize\nspecialized\ncommunication\nskills\nPractice\noccupational\nhealth and\nsafety procedures\nLead\nworkplace\n communication\nCollect,\nanalyze and\norganize\ninformation\nPlan\nand organize\nwork\nApply\nproblem-\nsolving\ntechniques in\nthe workplace\nLead\nsmall teams\nPromote\nenvironmental\nprotection\nPrepare and\nproduce bakery produ\n\nPrepare and\nproduce pastry\nproducts\n\nPrepare and\ndisplay petits fours\n\nPresent\ndesserts\nPrepare and\npresent gateaux,\ntortes and cakes\n\n--- PDF PAGE 60 ---\nTR – BREAD AND PASTRY PRODUCTION NC II\n Promulgated July 2009\n58\n\nDEFINITION OF TERMS\n\nAlmond paste\nA mixture of finely ground almonds and sugar\nAngel food cake\nA type of cake made of meringue and flour\nBaba\nA type of yeast bread or cake that is soaked in syrup\nBagel\nA ring-shaped lean yeast bread or coffee cake\nBagged\nA cookie make up method on which the dough is shaped\nand deposited with a pastry bag\nBar\nA cookie make up method in which the dough is shaped\ninto flattened cylinders, baked, and sliced crosswise into\nindividual cookies\nBatter\nA semi-liquid mixture made of flour or other starch used for\nthe production of cakes and breads; also used for coating\nproducts to be fried\nBavarian cream\nA light, cold dessert made of gelatin, whipped cream and\ncustard sauce or fruit\nBoiled icing\nItalian meringue used as cake icing\nBavarois\nBeaters\nBombe\nA type of frozen dessert made in a dome-shape\nBread 