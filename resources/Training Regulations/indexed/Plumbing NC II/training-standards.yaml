 self-paced learning strategies;\n\nc. Training can be done on an actual workplace setting, simulation of a\nworkplace and/or through adoption of modern technology.\n\nd. Assessment is based in the collection of evidence of the performance of\nwork to the industry required standards;\n\ne. Assessment of competency takes the trainee’s knowledge and attitude into\naccount but requires evidence of actual performance of the competency as\nthe primary source of evidence.\n\nf. Training program allows for recognition of prior learning (RPL) or current\ncompetencies;\n\ng. Training completion is based on satisfactory performance of all specified\ncompetencies.\n\n2. The competency-based TVET system recognizes various types of delivery\nmodes, both on-and off-the-job as long as learning is guided by the competency\nstandards specified by the industry. The following training modalities and its\nvariations/components may be adopted singly or in combination with other\nmodalities when designing and delivering training programs:\n\n2.1 Institution- Based:\n\n•\nDual Training System (DTS)/Dualized Training Program (DTP) which\ncontain both in-school and in-industry training or fieldwork\ncomponents. Details can be referred to the Implementing Rules and\nRegulations of the DTS Law and the TESDA Guidelines on the DTP;\n\n•\nDistance learning is a formal education process in which majority of\nthe instruction occurs when the students and instructor are not in the\nsame place. Distance learning may employ correspondence study,\naudio, video, computer technologies or other modern technology\nthat can be used to facilitate learning and formal and non-formal\n\n--- PDF PAGE 76 ---\nTR PLUMBING NC II (Amended) Promulgated October 2014\nPage 74\n\ntraining. Specific guidelines on this mode shall be issued by the\nTESDA Secretariat.\n•\nThe traditional classroom-based or in-center instruction may be\nenhanced through use of learner-centered methods as well as\nlaboratory or field-work components.\n\n 2.2 Enterprise-Based:\n\n• Formal Apprenticeship – Training within employment involving a\ncontract between an apprentice and an enterprise on an approved\napprenticeable occupation.\n\n• Informal Apprenticeship - is based on a training (and working)\nagreement between an apprentice and a master craftsperson wherein\nthe agreement may be written or oral and the master craftsperson\ncommits to training the apprentice in all the skills relevant to his or her\ntrade over a significant period of time, usually between one and four\nyears, while the apprentice commits to contributing productively to the\nwork of the business. Training is integrated into the production\nprocess and apprentices learn by working alongside the experienced\ncraftsperson.\n\n• Enterprise-based Training- where training is implemented within the\ncompany in accordance with the requirements of the specific\ncompany. Specific guidelines on this mode shall be issued by the\nTESDA Secretariat.\n\n2.3 Community-Based – Community-Based – short term programs conducted\nby non-government organizations (NGOs), LGUs, training centers and\nother TVET providers which are intended to address the specific needs of\na community. Such programs can be conducted in informal settings such\nas barangay hall, basketball courts, etc. These programs can also be\nmobile training program (MTP).\n\n--- PDF PAGE 77 ---\nTR PLUMBING NC II (Amended) Promulgated October 2014\nPage 75\n\n3.3 TRAINEE ENTRY REQUIREMENTS\n\nThis section specifies the qualifications of trainees including their education/experience\n\n•\nAt least Senior High School (Grade 11 & 12) level or graduate;\n•\nHolder of Plumbing NC I or relevant industry experience (plumbing works)\nfor a minimum of 2 years* in all of the following:\n\nPrepare Plumbing Layout\n\nMake Piping Joints and Connections\n\nPerform Minor Construction Works\n\nInstall and Assemble Single Plumbing Unit\nNote: * Certified by the employer or a Registered Master Plumber\n•\nAble to communicate orally and in writing\n•\nCan perform basic mathematical computations\n\nThis list does not include specific institutional requirements such as written entrance exam, and other that\nmay be required of the trainees by the school or training center delivering TVET program.\n\n--- PDF PAGE 78 ---\nTR PLUMBING NC II (Amended) Promulgated October 2014\nPage 76\n\n3.4 LIST OF TOOLS, EQUIPMENT AND MATERIALS PLUMBING NC II\n\nRecommended list of tools, equipment and materials for the training of 25 trainees for\nPlumbing NC II.\n\nTOOLS\nQty\nDescription\nQty\nDescription\nQty\nDescription\n6 pcs.\nPipe wrench\n (2 pcs each sizes\n10”, 12” ,14”)\n4\nunits\nPipe Vise 1” – 4” (2\nYoke vise and 2 chain\nvise)\n5 pcs\nMechanical Plier\n5 pcs.\nPressure gauges\n(3” dia. X ¼” dia.\n0-300 psi)\n5 pcs.\nPipe Cutter ½” – 2”\n6 pcs\nAdjustable wrench\n(3each 10” & 12”)\n25 pcs.\nSteel Tape (5m)\n25\npcs.\nBallpeen Hammer\n5 pcs.\nFlat Screw Driver 10”\n25 pcs\nHacksaw with Blade\n25\npcs\nPointed Cold Chisel\n(various length 10” -12”)\n5 pcs.\nPhilip Screw Driver\n10”\n5 pcs.\nSpirit level bar 24”\nlength\n5 pcs.\nElectrical Plier\n25\npcs\nCold Chisel (var.\nlengths 8”-12” dia.\n5/8”)\n5 units\nPipe Reamer\n5 pcs\nPlumb Bob (Std. size)\nEQUIPMENT\nQty\nDescription\nQty\nDescription\nQty\nDescription\n1 unit\nThreading Machine\ncomplete with the\nfollowing 220 V\n2 units Die head\n2 sets dies (1/2” &\n¾” – 1” – 2”)\n1 pc pipe reamer\n1 pc pipe cutter\n1 set\nCutting outfit set (Harris\nor Morris) with oxygen /\nacetylene cylinder with\ngas content (refillable)\n1 unit\nWelding machine 300\namperes with\ngrounding and\nextension cable,\nelectrode holder and\nwelding mask.\n2 units\nFusion Machine\n(20mm – 32mm)\n2\nunits\nElectric Grinder (4”)\n1 unit\nElectric Test Pump\n2 units\nElectric Drill (drill bit\n¼” – 5/8”)\n1 unit\nPush Drill ¼” – 5/8” size\n5\nunits\nBlow Torch\n2 units\nManual Test Pump\n5\ncylind\ners\nPortable Soldering Kit\n1 unit\nCut-off 