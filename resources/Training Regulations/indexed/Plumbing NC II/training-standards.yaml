uments\n• Ability to relate to\npeople of social range\nin the workplace\n• Gather and provide\ninformation in response\nto workplace\nrequirements\n• Group\ndiscussion\n• Role Play\n• Demonstration\n• Oral Interview\n• Written test\n• Demonstration\n2 hours\n\n1 hour\n\n1.2 Complete\nrelevant work\nrelated\ndocuments\n\n• Communication\nprocedures and\nsystems\n• Meeting protocols\n• Nature of workplace\nmeetings\n• Barriers of\ncommunication\n• Workplace interactions\n• Follow simple spoken\nlanguage\n• Perform routine\nworkplace duties\nfollowing simple written\nnotices\n• Participate in\nworkplace meetings\nand discussions\n• Role Play\n• Demonstration\n• Observation\n• Oral Interview\n• Written test\n\n--- PDF PAGE 61 ---\nTR PLUMBING NC II (Amended) Promulgated October 2014\nPage 59\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Contents\nPractical Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n• Non verbal\ncommunication\n• Complete work related\ndocuments\n• Estimate, calculate and\nrecord routine\nworkplace measures\n• Basic mathematical\nprocesses of addition,\nsubtraction, division\nand multiplication\n• Ability to relate to\npeople of social range\nin the workplace\n• Gather and provide\ninformation in response\nto workplace\nrequirements\n\n1 hour\n\n1.3 Participate in\nworkplace\nmeeting and\ndiscussion\n• Technology relevant to\nthe enterprise and the\nindividual’s work\nresponsibilities\n• Types of workplace\ndocuments and forms\n• Basic mathematical\nconcepts\n• Kinds of workplace\nreport\n• Follow simple spoken\nlanguage\n• Ability to relate to\npeople of social range\nin the workplace\n• Gather and provide\ninformation in response\nto workplace\nrequirements\n• Interaction\n• Demonstration\n• Observation\n• Oral Interview\n• Written test\n2. Work in a team\nenvironment\n2.1 Describe and\nidentify team\nrole and\nresponsibility in\na team.\n• Definition of Team\n• Difference between\nteam and group\n• Different sources of\