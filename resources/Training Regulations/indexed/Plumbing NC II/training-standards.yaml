    "source_text": "3.1\nCURRICULUM DESIGN\n\nTESDA shall provide the training on the development of competency-based\ncurricula to training providers. This will equip them with needed knowledge and\nskills in developing their own curricula based on the components mentioned below.\n\nDelivery of knowledge requirements for the basic, common and core units of\ncompetency specifically in the areas of mathematics, science/technology,\ncommunication/language and other academic subjects shall be contextualized. To\nthis end, TVET providers shall develop a Contextual Learning Matrix (CLM) to\naccompany their curricula.\n\nCourse Title: PLUMBING\n\nNC Level: NC II\n\nNominal Training Duration: 18 Hours (Basic)\n\n24 Hours (Common)\n 160 Hours (Core)\n\n 202 Hours\nCourse Description:\n\nThis course is designed to equip individual with operational skills in\nPlumbing, such as prepare plumbing layout, make piping joints and connections,\nperform minor construction works and install and assemble single plumbing unit.\n\nTo obtain complete the course, all units prescribed for this qualification must\nbe achieved:\n\n--- PDF PAGE 60 ---\nTR PLUMBING NC II (Amended) PROMULGATED\nPage 58\n\nBASIC COMPETENCIES\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Contents\nPractical Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and\nconvey\nworkplace\ninformation\n\n• Effective\ncommunication\n• Different modes of\ncommunication\n• Written communication\n• Organizational policies\n• Communication\nprocedures and\nsystems\n• Technology relevant to\nthe enterprise and the\nindividual’s work\nresponsibilities\n• Sources of information\n• Types of question\n• Medium of\ncommunication\n• Flow of communication\n• Storage system\n• Telephone courtesy\n• Follow simple spoken\nlanguage\n• Perform routine\nworkplace duties\nfollowing simple written\nnotices\n• Participate in\nworkplace meetings\nand discussions\n• Complete work related\ndocuments\n• Ability to relate to\npeople of social range\nin the workplace\n• Gather and provide\ninformation in response\nto workplace\nrequirements\n• Group\ndiscussion\n• Role Play\n• Demonstration\n• Oral Interview\n• Written test\n• Demonstration\n2 hours\n\n1 hour\n\n1.2 Complete\nrelevant work\nrelated\ndocuments\n\n• Communication\nprocedures and\nsystems\n• Meeting protocols\n• Nature of workplace\nmeetings\n• Barriers of\ncommunication\n• Workplace interactions\n• Follow simple spoken\nlanguage\n• Perform routine\nworkplace duties\nfollowing simple written\nnotices\n• Participate in\nworkplace meetings\nand discussions\n• Role Play\n• Demonstration\n• Observation\n• Oral Interview\n• Written test\n\n--- PDF PAGE 61 ---\nTR PLUMBING NC II (Amended) Promulgated October 2014\nPage 59\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Contents\nPractical Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n• Non verbal\ncommunication\n• Complete work related\ndocuments\n• Estimate, calculate and\nrecord routine\nworkplace measures\n• Basic mathematical\nprocesses of addition,\nsubtraction, division\nand multiplication\n• Ability to relate to\npeople of social range\nin the workplace\n• Gather and provide\ninformation in response\nto workplace\nrequirements\n\n1 hour\n\n1.3 Participate in\nworkplace\nmeeting and\ndiscussion\n• Technology relevant to\nthe enterprise and the\nindividual’s work\nresponsibilities\n• Types of workplace\ndocuments and forms\n• Basic mathematical\nconcepts\n• Kinds of workplace\nreport\n• Follow simple spoken\nlanguage\n• Ability to relate to\npeople of social range\nin the workplace\n• Gather and provide\ninformation in response\nto workplace\nrequirements\n• Interaction\n• Demonstration\n• Observation\n• Oral Interview\n• Written test\n2. Work in a team\nenvironment\n2.1 Describe and\nidentify team\nrole and\nresponsibility in\na team.\n• Definition of Team\n• Difference between\nteam and group\n• Different sources of\ninformation\n•Objectives and goals of\n• Describing the team\nrole and scope\n• Discussion\n\n• Demonstration\n• Observation\n\n2 hours\n\n--- PDF PAGE 62 ---\nTR PLUMBING NC II (Amended) Promulgated October 2014\nPage 60\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Contents\nPractical Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\nteam\n\n2 hours\n\n2.2 Describe work\nas a team\nmember\n• Team goals and\nobjectives\n• Fundamental rights at\nwork including gender\nsensitivity\n• Understanding\nindividual\ncompetencies relative\nto teamwork\n• Types of individuals\n• Role of leaders\n• Identifying individual\nrole and responsibility\n• Identifying external\nrelationship\n• Interacting effectively\nwith others\n• Setting team goals and\nexpectations\n• Interaction\n\n• Interviews/\nquestioning\n• Demonstration\n3. Practice career\nprofessionalis\nm\n3.1 Integrate\npersonal\nobjectives with\norganizational\ngoals\n• Work values and ethics\n(Code of Conduct,\nCode of Ethics, etc.)\n• Understanding\npersonal objectives\n• Understanding\norganizational goals\n• Difference between\nintra and interpersonal\nrelationship\n• Performance\nevaluation\n• Demonstrate Intra and\nInterpersonal skills at\nwork\n• Demonstrate personal\ncommitment in work\n• Discussion\n\n• Demonstration\n2 hours\n\n2 hours\n\n3.2 Set and meet\nwork priorities\n• Company policies\n• Company operations,\nprocedures and\nstandards\n• Managing goals and\ntime\n• Practice economic use\nof resources and\nfacilities\n• Interaction\n• Role Play\n• Observation\n• Demonstration\n\n--- PDF PAGE 63 ---\nTR PLUMBING NC II (Amended) Promulgated October 2014\nPage 61\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Contents\nPractical Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n• Time management\n• Basic strategic\nplanning concepts\n• Resource utilization\nand management\n• Setting work priorities\n• Practice time\nmanagement\n\n2 hours\n\n3.3 Maintain\nprofessional\ngrowth and\ndevelopment\n• Career development\nopportunities\n• Company recognition\nand incentives\n• Information on relevant\nlicenses and or\ncertifications\n• Determining personal\ncareer development\nneeds\n• Identifying career\nopportunities\n• Interaction\n• Role Play\n• Interviews/\nquestioning\n4. Practice\noccupational\nhealth and\nsafety\n4.1 Identify hazard\nand risks\n• OSH procedures,\npractices and\nregulations\n• Hazards/risks\nidentification and\ncontrol\n• OSH indicators\n• Organizational\ncontingency practices\n• Hazards/risks\nidentification and\ncontrol skills\n• Discussion\n• Plant tour\n• Symposium\n• Observation\n• Interview\n1 hour\n\n1 hour\n\n1 hour\n\n4.2 Evaluate\nhazard and\nrisks\n• Threshold Limit Value –\nTLV\n• Effects of safety\nhazards\n• Communication skills\n• Reporting safety\nhazards\n• Discussion\n• Plant tour\n• Observation\n• Interview\n4.3 Control\nhazards and\nrisks\n• Personal hygiene\npractices\n• Organization safety\nand health protocol\n• Company emergency\nprocedure practices\n• Respond to emergency\n• Discussion\n• Demonstration\n• Portfolio\nassessment\n• Interview\n\n--- PDF PAGE 64 ---\nTR PLUMBING NC II (Amended) Promulgated October 2014\nPage 62\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Contents\nPractical Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n4.4 Maintain\noccupational\nhealth and\nsafety\nawareness\n• Workplace OSH\npersonal records\n• Information on\nemergency-related\ndrills\n• Practice emergency-\nrelated drill skills in the\nworkplace\n• Discussion\n• Role-play\n• Simulation\n• Portfolio\nassessment\n• Interview\n\n1 hour\n\n--- PDF PAGE 65 ---\nTR PLUMBING NC II (Amended) Promulgated October 2014\nPage 63\n\nCOMMON COMPETENCIES\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Contents\nPractical Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n1. Prepare\nconstruction\nmaterials and\ntools\n1.1 Identify\nmaterials\n\n• Different work\nspecifications\n• Types, uses and\ndescription of plumbing\nmaterials and\naccessories\n• Types, uses and\ndescription of plumbing\ntools\n• List of materials as per\ncompany standards\n• Identifying tools\naccording to the job\nrequirements\n• Identifying materials\nand accessories\naccording to the job\nrequirements\n• Lecture\n• Demonstration\n• Group\ndiscussion\n• PowerPoint\npresentation\n• Direct\nobservation\n• Questions or\ninterview\n• Written test\n• Portfolio\n(credentials)\n1 hour\n\n1 hour\n\n2 hours\n\n1.2 Requisition\nmaterials\n• Work requirements\n• Types and uses of\nplumbing materials and\ntools\n• Material take-off\n• Requisition procedures\n• Preparing material\ntake-off\n• Requesting materials\nand tools\n• Accomplishing\nmaterials requisition\nform\n• Discussion\n• Simulation\n\n• Direct\nobservation\n• Questions or\ninterview\n1.3 Receive and\ninspect\nmaterials\n• Policy on receiving\nmaterial deliveries\n• Material and tools\nquality and defects\n• Material handling\n• Checking and\ninspecting\nreceived/delivered\nmaterials and tools\n• Storing/ stacking of tool\nand materials\n• Practical\nExercise\n• Demonstration\n• Written / Oral\nTest\n• Demonstratio\nn\n2. Observe\nprocedures,\nSpecifications\nand Manuals\nof Instructions\n2.1\nIdentify and\naccess\nspecification/\nmanuals\n• Types of manuals used\nin plumbing\n• Identification of\nsymbols used in the\nmanuals\n• Identifying manuals\nand specifications\n• Accessing information\nand data\n• Lecture\n• Demonstration\n• Oral\nquestioning\n• Written test or\nexamination\n2 hours\n\n--- PDF PAGE 66 ---\nTR PLUMBING NC II (Amended) Promulgated October 2014\nPage 64\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Contents\nPractical Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n2.2 Interpret\nmanuals\n• Types of manuals used\nin plumbing\n• Types of symbols used\nin manuals\n• System of\nmeasurements\n• Unit conversion\n• Interpreting symbols\nand specifications\n• Accessing information\nand data\n• Applying conversion of\nunits of measurements\n• Actual\ndemonstration\n• Group\ndiscussion\n• Direct\nobservation\n• Written test or\nexamination\n\n2 hours\n\n2 hours\n\n2 hours\n\n2.3 Apply\ninformation in\nmanual\n\n• Types of manuals used\nin plumbing\n• Types and application\nof symbols in manuals\n• Unit conversion\n• Applying information\nfrom manuals\n• Demonstration\n• Group\ndiscussion\n• Demonstratio\nn (able to\nimpart\nknowledge\nand skills)\n• Practical and\noral exam\n2.4 Store Manual\n• Types of manuals used\nin plumbing\n• Manual storing and\nmaintaining procedures\n• Storing and maintaining\nmanuals\n• Demonstration\nGroup\ndiscussion\n• Demonstratio\nn\n• Practical and\noral exam\n3. Perform\nmensurations\nand calculation\n3.1 Select\nmeasuring\ninstruments\n\n• Types of measuring\ntools and its uses\n• Selecting measuring\ninstruments\n• Lecture-\ndemonstration\n• Group\ndiscussion\n• Direct\nobservation\n• Oral\nquestioning\n2 hours\n\n2 hours\n\n3.2 Carry out\nmeasurements\nand calculations\n\n• Measurements\n- Linear measurement\n- Geometrical\nmeasurement\n• Trade Mathematics\n- Unit conversion\n- Ratio and proportion\n- Area\n• Interpreting formulas\nfor volume, areas,\nperimeters of plane and\ngeometric figures\n• Handling of measuring\ninstruments\n\n• Group\ndiscussion\n• Practical Lab\n• Demonstration\n• Written test or\nexamination\n• Third party\nreport\n• Demonstratio\nn (able to\nimpart\nknowledge\nand skills)\n\n--- PDF PAGE 67 ---\nTR PLUMBING NC II (Amended) Promulgated October 2014\nPage 65\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Contents\nPractical Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n4. Maintain Tools\nand Equipment\n4.1 Check condition\nof tools and\nequipment\n\n• Safety practices\n- use of PPE\n- handling of tools and\nequipment\n- good housekeeping\n• Materials, tools and\nequipment\n- types and uses of\nlubricants\n- ty