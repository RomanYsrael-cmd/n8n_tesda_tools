        "evidence_guide": {
          "source_text": "1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Explained clearly established workplace safety and hazard control\npractices and procedures\n1.2 Identified hazards/risks in the workplace and its corresponding\nindicators in accordance with company procedures\n1.3 Recognized contingency measures during workplace accidents, fire\nand other emergencies\n1.4 Identified terms of maximum tolerable limits based on threshold limit\nvalue- TLV.\n1.5 Followed Occupational Safety and Health (OSH) procedures for\ncontrolling hazards/risks in workplace\n1.6 Used Personal Protective Equipment (PPE) in accordance with\ncompany OSH procedures and practices\n1.7 Completed and updated OSH personal records in accordance with\nworkplace requirements\n2. Resource\nImplications\nThe following resources should be provided:\n2.1 Workplace or assessment location\n2.2 OSH personal records\n2.3 PPE\n2.4 Health records\n3. Methods of\nAssessment\nCompetency may be assessed through:\n3.1 Portfolio Assessment\n3.2 Interview\n3.3 Case Study/Situation\n4. Context for\nAssessment\n4.1 Competency may be assessed in the work place or in a simulated\nwork place setting\n\n--- PDF PAGE 23 ---\nTESDA-SOP-QSO-01-F08\nTR PLUMBING NC II (Amended) Promulgated October 2014\nPage 21\n\nCOMMON COMPETENCIES\n\nUNIT OF COMPETENCY:\nPREPARE CONSTRUCTION MATERIALS AND TOOLS\n\nUNIT CODE :"
        },
        "source_text": "500311108\nUNIT DESCRIPTOR : This unit covers the outcomes required to comply with regulatory\nand organizational requirements for occupational health and\nsafety.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Identify hazards\nand risks\n1.1 Safety regulations and\nworkplace safety and\nhazard control practices\nand procedures are\nclarified and explained\nbased on organization\nprocedures\n1.2 Hazards/risks in the\nworkplace and their\ncorresponding\nindicators are identified\nto minimize or eliminate\nrisk/exposure to co-\nworkers, workplace and\nenvironment in\naccordance with\norganization’s\nprocedures\n1.3 Contingency\nmeasures during\nworkplace accidents,\nfire and other\nemergencies are\nrecognized and\nestablished in\naccordance with\norganization procedures\n1.1 Occupational\nSafety and\nHealth (OSH)\nprocedures and\npractices and\nregulations\n1.2 Personal\nhygiene\npractices\n1.3 Hazards/risks\nidentification and\ncontrol\n1.4 Organization\nsafety and\nhealth protocol\n1.5 Safety\nconsciousness\n1.6 Health\nconsciousness\n1.1 Practicing\nsafety and\nhealth\nprocedures and\npersonal\nhygiene\n1.2 Identifying\nhazards/risks\nand control\n1.3 Interpersonal\nskills\n1.4 Communication\nskills\n\n--- PDF PAGE 18 ---\nTESDA-SOP-QSO-01-F08\nTR PLUMBING NC II (Amended) Promulgated October 2014\nPage 16\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n2 Evaluate hazards\nand risks\n2.1 Terms of maximum\ntolerable limits which\nwhen exceeded will\nresult in harm or\ndamage are identified\nbased on threshold\nlimit values (TLV)\n2.2 Effects of the hazards\nare determined\n2.3 OSH issues and/or\nconcerns and identified\nsafety hazards are\nreported to designated\npersonnel in\naccordance with\nworkplace\nrequirements and\nrelevant workplace\nOSH legislation\n2.1 OSH\nprocedures and\npractices and\nregulations\n2.2 Personal\nhygiene\npractices\n2.3 Hazards/risks\nidentification\nand control\n2.4 Threshold Limit\nValue -TLV\n2.5 OSH indicators\n2.6 Organization\nsafety and\nhealth protocol\n2.7 Safety\nconsciousness\n2.8 Health\nconsciousness\n2.1 Practicing\npersonal\nhygiene\n2.2 Identifying\nhazards/risks\nand control\n2.3 Interpersonal\nskills\n2.4 Communication\nskills\n3 Control hazards\nand risks\n3.1 Occupational Safety\nand Health (OSH)\nprocedures for\ncontrolling\nhazards/risks in\nworkplace are\nconsistently followed\n3.2 Procedures for dealing\nwith workplace\naccidents, fire and\nemergencies are\nfollowed in accordance\nwith organization OSH\npolicies\n3.3 Personal protective\nequipment (PPE) is\ncorrectly used in\naccordance with\norganization OSH\nprocedures and\npractices\n3.1 OSH procedures\nand practices\nand regulations\n3.2 PPE types and\nuses\n3.3 Personal\nhygiene\npractices\n3.4 Hazards/risks\nidentification and\ncontrol\n3.5 OSH indicators\n3.6 Organization\nsafety and health\nprotocol\n3.7 Safety\nconsciousness\n3.8 Health\nconsciousness\n3.1 Practicing\npersonal\nhygiene\n3.2 Identifying\nhazards/risks\nand control\n3.3 Interpersonal\nskills\n3.4 Communication\nskills\n\n--- PDF PAGE 19 ---\nTESDA-SOP-QSO-01-F08\nTR PLUMBING NC II (Amended) Promulgated October 2014\nPage 17\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n\n3.4 Appropriate assistance\nis provided in the event\nof a workplace\nemergency in\naccordance with\nestablished\norganization protocol\n\n4 Maintain OSH\nawareness\n4.1 Emergency-related\ndrills and trainings\nare participated in as\nper established\norganization guidelines\nand procedures\n4.2 OSH personal\nrecords are completed\nand updated in\naccordance with\nworkplace\nrequirements\n\n4.1 OSH\nprocedures and\npractices and\nregulations\n4.2 PPE types and\nuses\n4.3 Personal\nhygiene\npractices\n4.4 OSH indicators\n4.5 Organization\nsafety and\nhealth protocol\n4.6 Safety\nconsciousness\n4.7 Health\nconsciousness\n4.1 Practicing\npersonal\nhygiene\n4.2 Interpersonal\nskills\n4.3 Communication\nskills\n\n--- PDF PAGE 20 ---\nTESDA-SOP-QSO-01-F08\nTR PLUMBING NC II (Amended) Promulgated October 2014\nPage 18\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Safety and Health\nRegulations\nMay include but are not limited to:\n1.1 Clean Air Act\n1.2 National Building Code\n1.3 Philippine Electrical Code\n1.4 Fire Code of the Philippines\n1.5 Waste management statutes and rules\n1.6 Philippine Occupational Safety and Health Standards\n1.7 DOLE OSH related issuances\n1.8 ECC regulations\n\n2. Hazards/Risks\nMay include but are not limited to:\n2.1 Physical hazards – impact, illumination, pressure, noise,\nvibration temperature, radiation\n2.2 Biological hazards - bacteria, viruses, plants, parasites, mites,\nmolds, fungi, insects\n2.3 Chemical hazards – dusts, fibers, mists, fumes, smoke, gasses,\nvapors\n2.4 Ergonomics\n•\nPhysiological factors - over exertion/ excessive force,\nawkward/static positions, fatigue, direct pressure, varying\nmetabolic cycles\n•\nPsychological factors - monotony, personal relationship, work\nout cycle\n\n--- PDF PAGE 21 ---\nTESDA-SOP-QSO-01-F08\nTR PLUMBING NC II (Amended) Promulgated October 2014\nPage 19\n\nVARIABLE\nRANGE\n3. Contingency\nmeasures\nMay include but are not limited to:\n3.1 Evacuation/ Rescue\n3.2 Isolation\n3.3 Decontamination\n3.4 (Calling designed) emergency personnel\n4. PPE\nMay include but are not limited to:\n4.1 Mask\n4.2 Gloves\n4.3 Goggles\n4.4 Hair Net/cap/bonnet\n4.5 Face mask/shield\n4.6 Ear muffs\n4.7 Apron/Gown/coverall/jump suit\n4.8 Anti-static suits\n4.9 Safety Helmet\n4.10 Safety Shoes\n4.11 Body Harness and lifeline\n5. Emergency-related\ndrills and training\n5.1 Fire drill\n5.2 Earthquake drill\n5.3 Basic life support/CPR\n5.4 First aid\n5.5 Spillage control\n5.6 Decontamination of chemical and toxic\n5.7 Disaster preparedness/management\n6. OSH personal\nrecords\n6.1 Medical/Health records\n6.2 Incident reports\n6.3 Accident reports\n6.4 OSH-related training completed\n\n--- PDF PAGE 22 ---\nTESDA-SOP-QSO-01-F08\nTR PLUMBING NC II (Amended) Promulgated October 2014\nPage 20\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Explained clearly established workplace safety and hazard control\npractices and procedures\n1.2 Identified hazards/risks in the workplace and its corresponding\nindicators in accordance with company procedures\n1.3 Recognized contingency measures during workplace accidents, fire\nand other emergencies\n1.4 Identified terms of maximum tolerable limits based on threshold limit\nvalue- TLV.\n1.5 Followed Occupational Safety and Health (OSH) procedures for\ncontrolling hazards/risks in workplace\n1.6 Used Personal Protective Equipment (PPE) in accordance with\ncompany OSH procedures and practices\n1.7 Completed and updated OSH personal records in accordance with\nworkplace requirements\n2. Resource\nImplications\nThe following resources should be provided:\n2.1 Workplace or assessment location\n2.2 OSH personal records\n2.3 PPE\n2.4 Health records\n3. Methods of\nAssessment\nCompetency may be assessed through:\n3.1 Portfolio Assessment\n3.2 Interview\n3.3 Case Study/Situation\n4. Context for\nAssessment\n4.1 Competency may be assessed in the work place or in a simulated\nwork place setting\n\n--- PDF PAGE 23 ---\nTESDA-SOP-QSO-01-F08\nTR PLUMBING NC II (Amended) Promulgated October 2014\nPage 21\n\nCOMMON COMPETENCIES\n\nUNIT OF COMPETENCY:\nPREPARE CONSTRUCTION MATERIALS AND TOOLS\n\nUNIT CODE :"
