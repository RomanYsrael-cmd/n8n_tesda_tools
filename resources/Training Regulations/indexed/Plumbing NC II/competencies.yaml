  "source_section_text": "SECTION 1 PLUMBING NC II QUALIFICATION\n\nThe PLUMBING NC II Qualification consists of competencies that a person must\nachieve in installing multiple units of plumbing system with multi-point hot- and cold-water\nlines for medium-rise buildings. It also includes plumbing repair and maintenance work.\n\nThis Qualification is packaged from the competency map of Construction – Civil\nWorks sub-sector as shown in Annex A.\n\nThe Units of Competency comprising this Qualification include the following:\n\nCODE NO.\nBASIC COMPETENCIES\n\nUnits of Competency\n500311105\nParticipate in workplace communication\n500311106\nWork in a team environment\n500311107\nPractice career professionalism\n500311108\nPractice occupational health and safety procedures\n\nCODE NO.\nCOMMON COMPETENCIES\n\nUnits of Competency\nCON931201\nPrepare construction materials and tools\nCON311201\nObserve procedures, specifications and manuals of instruction\nCON311203\nPerform mensurations and calculations\nCON311204\nMaintain tools and equipment\n\nCODE NO.\nCORE COMPETENCIES\n\nUnits of Competency\nCON712348\nPrepare estimation of materials for multiple plumbing units\nCON712349\nPerform multiple plumbing units installation and assemblies\nCON712350\nConduct pipe leak testing\nCON712351\nPerform plumbing repair and maintenance work\n\nA person who has achieved this Qualification is competent to be:\n\n Plumber II\n\n--- PDF PAGE 4 ---\nTESDA-SOP-QSO-01-F08\n\nTR PLUMBING NC II (Amended) Promulgated October 2014\nPage 2"
