        "evidence_guide": {
          "source_text": "1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Listed materials and tools according to quantity and job requirements\n1.2 Requested materials and tools according to the list prepared and as per\ncompany SOP\n1.3 Inspected issued materials and tools as per quantity and job specifications\n1.4 Tools provided with appropriate safety devices\n2. Resource\nImplications\nThe following resources should be provided:\n2.1 Workplace location\n2.2 Materials relevant to the unit of competency\n2.3 Technical plans, drawings and specifications relevant to the activities\n3. Methods of\nAssessment\nCompetency in this unit must be assessed through:\n3.1 Direct observation and oral questioning\n4. Context for\nAssessment\n4.1 Competency may be assessed in the workplace or in a simulated workplace\n4.2 Competency assessment must be undertaken in accordance with the\nendorsed TESDA assessment guidelines\n\n--- PDF PAGE 27 ---\nTESDA-SOP-QSO-01-F08\nTR PLUMBING NC II (Amended) Promulgated October 2014\nPage 25\n\nUNIT OF COMPETENCY:\nOBSERVE PROCEDURES, SPECIFICATIONS AND MANUALS\nOF INSTRUCTIONS\n\nUNIT CODE :"
        },
        "source_text": "CON931201\n\nUNIT DESCRIPTOR :\n\nThis unit covers the knowledge, skills and attitudes on identifying,\nrequesting and receiving construction (plumbing) materials and\ntools in various workplace settings.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variable\n\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1.\nIdentify\nmaterials\n\n1.1 Materials are\nidentified as per job\nrequirements\n1.2 Quantity and\ndescription of\nmaterials conform\nwith the job\nrequirements\n1.3 Tools and accessories\nare identified\naccording to job\nrequirements\n\n1.1 Different work\nspecifications\n1.2 Types and uses of\nplumbing materials\nand accessories\n1.3 Types and uses of\nplumbing tools\n\n1.1 Identifying tools\naccording to the job\nrequirements\n1.2 Identifying materials\nand accessories\naccording to the job\nrequirements\n\n2.\nPrepare\nrequisition\nof\nmaterials\n\n2.1 Materials and tools\nneeded are\nrequested according\nto the identified\nrequirements\n2.2 Request is done as\nper company\nstandard operating\nprocedures (SOP)\n2.3 Substitute materials\nand tools are\nprovided without\nsacrificing cost and\nquality of work\n2.1 Work requirements\n2.2 Types and uses of\nplumbing materials\nand tools\n2.3 Material take-off\n2.4 Requisition\nprocedures\n\n2.1 Preparing material\ntake-off\n2.2 Requesting\nmaterials and tools\n\n--- PDF PAGE 24 ---\nTESDA-SOP-QSO-01-F08\nTR PLUMBING NC II (Amended) Promulgated October 2014\nPage 22\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variable\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n3.\nReceive and\ninspect\nmaterials\n3.1 Materials and tools\nissued are inspected\nas per quantity and\nspecification\n3.2 Tools, accessories\nand materials are\nchecked\n3.3 Materials and tools are\nset aside to\nappropriate location\n3.1 Policy on receiving\nmaterial deliveries\n3.2 Material and tools\nquality and defects\n3.3 Material handling\n3.1 Checking and\ninspecting materials\nand tools\n3.2 Storing/ stacking of\ntool and materials\n\n--- PDF PAGE 25 ---\nTESDA-SOP-QSO-01-F08\nTR PLUMBING NC II (Amended) Promulgated October 2014\nPage 23\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Materials and Tools\n\nMay include:\n1.1 Electrical supplies\n1.2 Structural\n1.3 Plumbing\n1.4 Welding/pipefitting\n1.5 Carpentry\n1.6 Masonry\n2. Description of Materials and\nTools\n\nMay include:\n2.1 Brand name\n2.2 Size\n2.3 Capacity\n2.4 Kind of application\n3. Company standard procedures\nMay include:\n3.1 Job order\n3.2 Requisition slip\n3.3 Borrower slip\n\n--- PDF PAGE 26 ---\nTESDA-SOP-QSO-01-F08\nTR PLUMBING NC II (Amended) Promulgated October 2014\nPage 24\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Listed materials and tools according to quantity and job requirements\n1.2 Requested materials and tools according to the list prepared and as per\ncompany SOP\n1.3 Inspected issued materials and tools as per quantity and job specifications\n1.4 Tools provided with appropriate safety devices\n2. Resource\nImplications\nThe following resources should be provided:\n2.1 Workplace location\n2.2 Materials relevant to the unit of competency\n2.3 Technical plans, drawings and specifications relevant to the activities\n3. Methods of\nAssessment\nCompetency in this unit must be assessed through:\n3.1 Direct observation and oral questioning\n4. Context for\nAssessment\n4.1 Competency may be assessed in the workplace or in a simulated workplace\n4.2 Competency assessment must be undertaken in accordance with the\nendorsed TESDA assessment guidelines\n\n--- PDF PAGE 27 ---\nTESDA-SOP-QSO-01-F08\nTR PLUMBING NC II (Amended) Promulgated October 2014\nPage 25\n\nUNIT OF COMPETENCY:\nOBSERVE PROCEDURES, SPECIFICATIONS AND MANUALS\nOF INSTRUCTIONS\n\nUNIT CODE :"
