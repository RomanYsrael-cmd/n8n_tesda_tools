conversion\n3.1 Applying information\nfrom manuals\n\n4\nStore manuals\n4.1 Manual or\nspecification is stored\nappropriately to\nprevent damage,\nready access and\nupdating of\ninformation when\nrequired in\naccordance with\ncompany\nrequirements\n4.1 Types of manuals\nused in plumbing\n4.2 Manual storing and\nmaintaining\nprocedures\n4.1 Storing and\nmaintaining\nmanuals\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Procedures, Specifications and\nManuals of Instructions\n\nMay include:\n1.1 Manufacturer's Specification Manual\n1.2 Repair Manual\n1.3 Maintenance Procedure Manual\n1.4 Periodic Maintenance Manual\n\n--- PDF PAGE 29 ---\nTESDA-SOP-QSO-01-F08\nTR PLUMBING NC II (Amended) Promulgated October 2014\nPage 27\n\nEVIDENCE GUIDE\n\n1. Critical aspects\nof Competency\nAssessment requires that the candidate:\n1.1 Identified and accessed specification/manuals as per job requirements\n1.2 Interpreted manuals in accordance with industry practices\n1.3 Applied information in manuals according to the given task\n1.4 Stored manuals in accordance with company requirements\n2. Resource\nimplications\nThe following resources should be provided:\n2.1 All manuals/catalogues relative to construction sector\n3. Methods of\nassessment\nCompetency should be assessed through:\n3.1 Direct observation\n3.2 Questions/interview\n\nAssessment of underpinning knowledge and practical skills may be combined\n4. Context of\nassessment\n4.1 Competency assessment must be undertaken in accordance with the\nendorsed TESDA assessment guidelines\n4.2 Assessment may be conducted in the workplace or a simulated environment\n\n--- PDF PAGE 30 ---\nTESDA-SOP-QSO-01-F08\nTR PLUMBING NC II (Amended) Promulgated October 2014\nPage 28\n\nUNIT OF COMPETENCY:\nPERFORM MENSURATIONS AND CALCULATIONS\n\nUNIT CODE :"
