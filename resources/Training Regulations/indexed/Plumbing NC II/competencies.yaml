        "evidence_guide": {
          "source_text": "1. Critical aspects of\ncompetency\nCompetency assessment requires evidence that the candidate:\n1.1 Selected and prepared materials, tools, equipment and consumables in\naccordance with job requirements\n1.2 Identified, disconnected and repaired defective pipes, fittings and\nplumbing fixtures in accordance with standard specification or as required\n1.3 Cleared clogged pipes and drains in line with SOPs\n1.4 Demonstrated compliance with safety and environment regulations are\napplicable to work site operations\n1.5 Identified faults and problems that occur and made necessary action to\nrectify\n1.6 Communicated interactively with others where applicable to ensure safe\nand effective work operations\n2. Resource\nImplications\nThe following resources should be provided:\n2.1 Workplace location\n2.2 Tools and equipment appropriate to plumbing repair and maintenance\nwork\n2.3 Materials relevant to the proposed activity\n2.4 Drawings and specifications relevant to the task\n3. Methods of\nAssessment\nCompetency should be assessed through:\n3.1 Direct observation on application of tasks\n3.2 Questions related to underpinning knowledge\n4. Context for\nAssessment\n4.1 Competency may be assessed in the workplace or in a simulated\nworkplace setting\n\n--- PDF PAGE 59 ---\nTR PLUMBING NC II (Amended) Promulgated October 2014\nPage 57"
