        "source_text": "--- PDF PAGE 44 ---\nTESDA-SOP-QSO-01-F08 \nTR PLUMBING  NC II  (Amended)     Promulgated    October 2014 \nPage 42 \n \nUNIT OF COMPETENCY       : \nPERFORM MULTIPLE PLUMBING UNITS \nINSTALLATION AND ASSEMBLIES                         \nUNIT CODE                            : \nCON712349\nUNIT DESCRIPTOR               : \nThis unit covers the knowledge, skills and attitudes in \ninstalling/assembling multiple units of plumbing in all\ntypes of building occupancy.  \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n1. Prepare \nmaterials for \ndrainage, \nsanitary, vent \nand waterline \nlayout work \n1.1 Work instructions/ \nplans are read and \ninterpreted in \naccordance with the \njob requirements \n1.2 Materials, tools and \nequipment are \nselected and prepared \naccording to job \nrequirements \n1.3 Appropriate PPE are \nselected according to \njob requirements\n1.1 Blue print reading \n1.2 Materials \nspecification \n1.3 5S \n1.4 Use of plumbing \nmaterials, tools and \nequipment \n1.5 Environmental-\nconservation \nprocedures, e.g. 3R \n(reduce, reuse, \nrecycle) \n1.1 Interpreting plan \n and details \n1.2 Selecting and \npreparing \nappropriate \nmaterials, tools and \nequipment \n2. Install pipes and \nfittings for \ndrainage, \nsanitary, vent \nand waterline \nlayout \n2.1 Pipes and fittings are \ninstalled as indicated \nin the approved \nworking plan \n2.2 Pipe supports and \nbraces are installed in \naccordance with the \napproved working plan\n2.3 Correct use of \nmaterials, tools and \nequipment is observed \nin accordance with \nmanufacturer's \ninstruction manual. \n2.4 Appropriate PPE is \nused in accordance \nwith the job \nrequirements \n2.1 Mensuration \n2.2 Blue print reading \n2.3 Materials \nspecification \n2.4 5S \n2.5 Use of plumbing \nmaterials, tools and \nequipment \n2.6 Environmental-\nconservation \nprocedures, e.g. 3R \n(reduce, reuse, \nrecycle) \n2.7 DOLE Department \nOrder No. 13 s. 1998 \nGuidelines \nGoverning \nOccupational Safety \nand Health in the \nConstruction \nIndustry\n2.1 Interpreting plans \nand details \n2.2 Handling of \nmaterials, tools and \nequipment  \n2.3 Communication \n(written and verbal) \n2.4 Applying methods \nand techniques in \nvarious type of pipe \nconnections \n2.5 Cutting and \nthreading pipes \n2.6 Applying markings \n2.7 Applying \nmeasurement and \nmathematical \ncomputation\n\n--- PDF PAGE 45 ---\nTESDA-SOP-QSO-01-F08 \nTR PLUMBING  NC II  (Amended)     Promulgated    October 2014 \nPage 43 \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n3. Install cold \nwater system \nand multi-point \nwater heater for \nhot-water \nsupply lines \n \n \n3.1 Specifications of \nmaterials for hot and \ncold water piping used \naccording to  job \nrequirements  \n3.2 Hot and cold water \nsupply is installed \naccording to the \napproved plan. \n3.3 Water supply pipe \nassembled and \ninstalled is leak-free. \n3.4 Proper use of tools \nand equipment is \nobserved in \naccordance with \nmanufacturer's \ninstruction manual. \n \n3.1 Mensuration \n3.2 Blue print reading \n3.3 Materials  \nspecification \n3.4 5S \n3.5 Use of plumbing \nmaterials,  tools \nand equipment \n3.6 Environmental-\nconservation \nprocedures, e.g. 3R \n(reduce, reuse, \nrecycle) \n3.7 DOLE Department  \nOrder No.13 s. \n1998 Guidelines \nGoverning \nOccupational \nSafety and Health \nin the Construction  \nIndustry \n3.1 Interpreting plans \nand details \n3.2 Handling of \nmaterials, tools and \nequipment  \n3.3 Communication \n(written and Verbal) \n3.4 Applying methods \nand techniques in \nvarious type of pipe \nconnections \n3.5 Cutting and \nthreading pipes \n3.6 Applying markings \n3.7 Applying \nmeasurement and \nmathematical \ncomputation \n4. Install building \ndrains, sewer \nand ventilation  \n \n4.1 Building drains/sewer \nand ventilation are \ninstalled in \naccordance to the \napproved plan. \n4.2 Materials, tools and \nequipment are \nselected  \nand prepared \naccording to job \nrequirements \n4.3 Appropriate PPE are \nselected and used \naccording to job \nrequirements \n \n4.1 Mensuration \n4.2 Blue print reading \n4.3 5S \n4.4 Use of plumbing \nmaterials, tools and \nequipment \n4.5 Environmental-\nconservation \nprocedures, e.g. 3R \n(reduce, reuse, \nrecycle) \n4.6 DOLE Department  \nOrder No.13 s. 1998 \nGuidelines \nGoverning \nOccupational Safety \nand Health in the \nConstruction   \nIndustry \n4.1 Interpreting plans \nand details \n4.2 4Handling of \nmaterials, tools and \nequipment \n4.3 Communication  \n(written and verbal) \n4.4 Applying methods \nand techniques in \nvarious type of pipe \nconnections \n4.5 Applying markings\n\n--- PDF PAGE 46 ---\nTESDA-SOP-QSO-01-F08 \nTR PLUMBING  NC II  (Amended)     Promulgated    October 2014 \nPage 44 \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n5. Mount and lay \nout plumbing \nfixtures and \naccessories  \n5.1 Specifications of \nplumbing fixtures are \nused in accordance \nwith the job \nrequirements. \n5.2 Plumbing fixtures and \naccessories are \ninstalled according to \nspecified roughing-in \nmeasurements and/or \nmanufacturer's \ninstruction manual. \n5.3 Plumbing fixtures \nand accessories are \nrigidly secured with \nstrict  adherence to \nperpendicularity and \nlevelness \n5.4 Usage of tools and \nequipment is observed \nin accordance with \nmanufacturer's \nspecifications \n5.5 Appropriate PPE are \nused in accordance \nwith the job \nrequirements \n5.6 Work site is cleaned  \nand kept in safe state \nand in accordance with \nOccupational \nSafety \nand Health Standards \n(OSHS) \n5.1 Mensuration \n5.2 Blue print reading \n5.3 Materials  \nspecification \n5.4 5S \n5.5 Use of plumbing \nmaterials, tools and \nequipment \n5.6 Environmental-\nconservation \nprocedures, e.g. 3R \n(reduce, reuse, \nrecycle) \n5.7 DOLE Department   \nOrder No. 13 s. \n1998 Guidelines \nGoverning \nOccupational Safety \nand Health  in the \nConstruction  \nIndustry \n4.3 Interpreting plans  \nand details \n4.4 Handling of \nmaterials, tools and \nequipment  \n4.5 Communication \n(written and verbal)  \n4.6  Applying methods \nand techniques in \nvarious type of \nplumbing fixtures\n\n--- PDF PAGE 47 ---\nTESDA-SOP-QSO-01-F08 \nTR PLUMBING  NC II  (Amended)     Promulgated    October 2014 \nPage 45 \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Tools and equipment \nMay include: \n1.1 Steel Tape  \n1.2 Ball-peen Hammer \n1.3 Hacksaw with Blade \n1.4 Blow Torch  \n1.5 Pointed Steel Chisel  \n1.6 Caulked Steel Chisel \n1.7 Kettle \n1.8 Manual Pipe Threader (1/4”-2”) \n1.9 Pipe Wrench (10”, 12” &  14”, 18”, 24”) \n1.10 Pipe Vise (Chain or Yoke) \n1.11 Bar or Hose level \n1.12 Plumb bob \n1.13 Pipe Cutter \n1.14 Pipe Reamer \n1.15 Threading Machine \n1.16 Welding Machine \n1.17 Test Pump (Manual or Power Driven) \n1.18 Electric Drill \n1.19 Cutting outfit set with oxygen/acetylene tank \n1.20 Electric Grinder \n1.21 Fusion Machine \n1.22 Grooving machine \n1.23 Pliers \n1.24 Wrenches (open, box, combination, ajustable, \nsocket, allen) \n2. Personal Protective Equipment (PPE)  \nMay include: \n2.1 Safety Shoes \n2.2 Hard Hat \n2.3 Gloves \n2.4 Goggles \n2.5 Ear Muffs \n2.6 Welding Mask / Face Shield \n2.7 Uniform and I.D. \n2.8 Apron/ Welding Gloves \n2.9 Emergency medical kit \n2.10 Full body harness/ safety belt \n2.11 Dust mask\n\n--- PDF PAGE 48 ---\nTESDA-SOP-QSO-01-F08 \nTR PLUMBING  NC II  (Amended)     Promulgated    October 2014 \nPage 46 \n \nVARIABLE \nRANGE \n3. Pipes and Fittings \nMay include: \n3.1 PVC Pipes and Fittings (DWV) \n3.2 PPR Pipes and fittings \n3.3 G.I. Pipes and Fittings \n3.4 C. I Pipes and Fittings \n3.5 PVC Blue Pressure Pipes and Fittings \n3.6 Copper Pipes and fittings \n3.7 HDPE Pipes and fittings \n4. Plumbing Fixtures and Accessories \n \nMay include: \n4.1 Water closet (flush tank/valve) Angle valve and \nSupply pipe \n4.2 Lavatory with faucet, P-Trap, Angle Valve and \nsupply pipe \n4.3 Bath Tub including waste and overflow assembly \n4.4 Shower head and valve assembly  \n4.5 Flushometer Valve \n4.6 Electric Flushing devices (sensor) \n4.7 Grease Trap \n4.8 Instantaneous water heater \n4.9 Bidet \n4.10  Kitchen sink with faucet, P-Trap, Angle valve and \nsupply pipe \n4.11 Slop sink \n4.12 Grab bar \n4.13 Urinal \n4.14 Toilet paper holder \n4.15 Soap holder \n4.16 Towel rack \n4.17 Floor drain strainer \n4.18 Faucet \n4.19 Cleanout cover\n\n--- PDF PAGE 49 ---\nTESDA-SOP-QSO-01-F08 \nTR PLUMBING  NC II  (Amended)     Promulgated    October 2014 \nPage 47 \n \nEVIDENCE GUIDE \n \n1. Critical aspects \nof competency  \nCompetency assessment requires evidence that the candidate: \n1.1  Read and interpreted work instructions/plans in accordance with job \nrequirements \n1.2 Materials, tools and equipment selected and prepared according to job \nrequirements \n1.3 Installed pipes and fittings in accordance with the approved working plan and \nmaterials specifications \n1.4 Installed hot- and cold-water supply according to the approved working plan \nand materials specifications \n1.5 Installed building drains/sewer in accordance with approved working plan \nand materials specifications and followed standard slope requirements \n1.6 Installed plumbing fixtures according to specified rough-in measurements \nand/or manufacturer's specifications and required standard in the RNPCP \n1.7 Demonstrated compliance with safety regulations applicable to work site \noperations \n1.8 Identified faults and problems that occur and made necessary action to \nrectify \n1.9 Communicated interactively with others where applicable to ensure safe and \neffective work operations \n1.10 Completed performing complex/multi-storey plumbing      \ninstallation/assemblies within specifications \n \n2. Resource \nImplications \nThe following resources should be provided: \n2.1 Workplace location \n2.2 Tools and equipment appropriate to construction processes \n2.3 Materials relevant to the proposed activity \n2.4 Drawings and specifications relevant to the task \n3 \nMethods of \nAssessment \nCompetency should be assessed through: \n3.1 Direct observation of application to tasks  \n3.2 Questions related to required knowledge \n4 \nContext for \nAssessment \n3.1 Competency may be assessed in the workplace or in a simulated workplace \nsetting\n",
