        "source_text": "--- PDF PAGE 9 ---\nTESDA-SOP-QSO-01-F08 \nTR PLUMBING  NC II  (Amended)     Promulgated    October 2014 \nPage 7 \n \nUNIT OF COMPETENCY  \n: \nWORK IN TEAM ENVIRONMENT \n \nUNIT CODE \n \n \n: \n500311106 \n \nUNIT DESCRIPTOR                      : \nThis unit covers the skills, knowledge and attitudes to identify \nrole and responsibility as a member of a team. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range of \nVariables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. \nDescribe team \nrole and scope \n1.1 The role and objective \nof the team is identified \nfrom available sources \nof information \n1.2 Team parameters, \nreporting relationships \nand responsibilities are \nidentified from team \ndiscussions and \nappropriate external \nsources  \n1.1 Communication \nprocess \n1.2 Team structure \n1.3 Team roles \n1.4 Group planning \nand decision \nmaking \n1.1 Communicate \nappropriately, \nconsistent with \nthe culture of the \nworkplace \n2. Identify own role \nand responsibility \nwithin team \n2.1 Individual role and \nresponsibilities within \nthe team environment \nare identified \n2.2 Roles and responsibility \nof other team members \nare identified and \nrecognized \n2.3 Reporting relationships \nwithin team and external \nto team are identified \n2.1 Communication \nprocess \n2.2 Team structure \n2.3 Team roles \n2.4 Group planning \nand decision \nmaking   \n2.1 Communicate \nappropriately, \nconsistent with \nthe culture of the \nworkplace\n\n--- PDF PAGE 10 ---\nTESDA-SOP-QSO-01-F08 \nTR PLUMBING  NC II  (Amended)     Promulgated    October 2014 \nPage 8 \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range of \nVariables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n3. Work as a team \nmember  \n3.1 Effective and appropriate \nforms of communications \nused and interactions \nundertaken with team \nmembers who contribute \nto known team activities \nand objectives \n3.2 Effective and appropriate \ncontributions made to \ncomplement team \nactivities and objectives, \nbased on individual skills \nand competencies and \nworkplace context \n3.3 Observed protocols in \nreporting using standard \noperating procedures \n3.4 Contribute to the \ndevelopment of team \nwork plans based on an \nunderstanding of  team’s \nrole and objectives and \nindividual competencies \nof the members \n3.1 Communication \nprocess \n3.2 Team structure \n3.3 Team roles \n3.4 Group planning \nand decision \nmaking \n3.1 Communicate \nappropriately, \nconsistent with \nthe culture of the \nworkplace \n3.2 Interacting \neffectively with \nothers\n\n--- PDF PAGE 11 ---\nTESDA-SOP-QSO-01-F08 \nTR PLUMBING  NC II  (Amended)     Promulgated    October 2014 \nPage 9 \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Role and \nobjective of \nteam  \n1.1. \nWork  activities in a team environment with enterprise or specific \nsector \n1.2. \nLimited discretion, initiative and judgment maybe demonstrated on \nthe job, either individually or in a team environment \n \n2. Sources of \ninformation \n2.1. \nStandard operating and/or other workplace procedures \n2.2. \nJob procedures \n2.3. \nMachine/equipment manufacturer’s specifications and instructions \n2.4. \nOrganizational or external personnel \n2.5. \nClient/supplier instructions \n2.6. \nQuality standards \n2.7. \nOSH and environmental standards \n \n3. Workplace \ncontext \n3.1. \nWork procedures and practices \n3.2. \nConditions of  work environments \n3.3. \nLegislation and industrial agreements \n3.4. \nStandard work practice including the storage, safe handling and \ndisposal of chemicals \n3.5. \nSafety, environmental, housekeeping and quality guidelines\n\n--- PDF PAGE 12 ---\nTESDA-SOP-QSO-01-F08 \nTR PLUMBING  NC II  (Amended)     Promulgated    October 2014 \nPage 10 \n \nEVIDENCE GUIDE \n \n1. Critical aspects \nof Competency \nAssessment requires evidence that the candidate: \n1.1. \nOperated in a team to complete workplace activity \n1.2. \nWorked effectively with others \n1.3. \nConveyed information in written or oral form \n1.4. \nSelected and used appropriate workplace language \n1.5. \nFollowed designated work plan for the job \n1.6. \nReported outcomes  \n \n2. Resource \nImplications \nThe following resources should be provided: \n2.1. \nAccess \nto \nrelevant \nworkplace \nor \nappropriately \nsimulated \nenvironment where assessment can take place \n2.2. \nMaterials relevant to the proposed activity or tasks \n \n3. Methods of \nAssessment \nCompetency in this unit may be assessed through: \n3.1. \nObservation   of the individual member in relation to the work \nactivities of the group \n3.2. \nObservation of simulation and or role play involving the participation \nof individual member to the attainment of organizational goal \n3.3. \nCase studies and scenarios as a basis for discussion of    issues \nand strategies in teamwork \n \n4. Context for \nAssessment \n4.1. \nCompetency may be assessed in workplace or in a simulated \nworkplace setting \n4.2. \nAssessment shall be observed while task are being undertaken \nwhether individually or in group\n",
