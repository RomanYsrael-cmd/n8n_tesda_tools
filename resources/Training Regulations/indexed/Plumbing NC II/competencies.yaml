        "source_text": "--- PDF PAGE 13 ---\nTESDA-SOP-QSO-01-F08 \nTR PLUMBING  NC II  (Amended)     Promulgated    October 2014 \nPage 11 \n \nUNIT OF COMPETENCY   :    PRACTICE CAREER PROFESSIONALISM \n \nUNIT CODE                        :    500311107 \n \nUNIT DESCRIPTOR           :   This unit covers the knowledge, skills and attitudes in promoting career \ngrowth and advancement. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range of \nVariables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Integrate personal \nobjectives with \norganizational \ngoals \n1.1 Personal growth and \nwork plans are pursued \ntowards improving the \nqualifications set for the \nprofession \n1.2 Intra- and interpersonal \nrelationships are \nmaintained in the course \nof managing oneself \nbased on performance \nevaluation \n1.3 Commitment to the \norganization and it’s goal \nis demonstrated in the \nperformance of duties  \n1.1 Work values and \nethics (Code of \nConduct, Code of \nEthics, etc.) \n1.2 Company policies\n1.3 Company \noperations, \nprocedures and \nstandards  \n1.4 Fundamental \nrights at work \nincluding gender \nsensitivity \n1.5 Personal hygiene \npractices \n1.1 Appropriate \npractice of \npersonal hygiene\n1.2 Intra and \nInterpersonal \nskills \n1.3 Communication \nskills \n2. Set and meet work \npriorities \n2.1 Competing demands are \nprioritized to achieve \npersonal, team and \norganizational goals and \nobjectives. \n2.2 Resources are utilized \nefficiently and effectively \nto manage work \npriorities and \ncommitments \n2.3 Practices along \neconomic use and \nmaintenance of \nequipment and facilities \nare followed  as per \nestablished procedures \n2.1 Work values and \nethics (Code of \nConduct, Code of \nEthics, etc.) \n2.2 Company policies\n2.3 Company \noperations, \nprocedures and \nstandards  \n2.4 Fundamental \nrights at work \nincluding gender \nsensitivity \n2.5 Personal hygiene \npractices \n2.6 Time \nmanagement\n2.1 Appropriate \npractice of \npersonal hygiene\n2.2 Intra and \nInterpersonal \nskills \n2.3 Communication \nskills \n2.4 Managing goals \nand time\n\n--- PDF PAGE 14 ---\nTESDA-SOP-QSO-01-F08 \nTR PLUMBING  NC II  (Amended)     Promulgated    October 2014 \nPage 12 \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range of \nVariables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n3. \nMaintain \nprofessional \ngrowth and \ndevelopment \n3.1 Trainings and career \nopportunities are \nidentified and availed of  \nbased on job \nrequirements \n3.2 Recognitions are  \nsought/received and \ndemonstrated as proof of \ncareer advancement \n3.3 Licenses and/or \ncertifications relevant \nto job and career are \nobtained and renewed  \n \n3.1 Work values and \nethics (Code of \nConduct, Code of \nEthics, etc.) \n3.2 Company policies\n3.3 Company \noperations, \nprocedures and \nstandards  \n3.4 Fundamental \nrights at work \nincluding gender \nsensitivity \n3.5 Personal hygiene \npractices\n3.1 Appropriate \npractice of \npersonal \nhygiene \n3.2 Intra and \nInterpersonal \nskills \n3.3 Communication \nskills\n\n--- PDF PAGE 15 ---\nTESDA-SOP-QSO-01-F08 \nTR PLUMBING  NC II  (Amended)     Promulgated    October 2014 \nPage 13 \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Evaluation \n1.1 Performance Appraisal \n1.2 Psychological Profile \n1.3 Aptitude Tests \n2. Resources \n2.1 Human \n2.2 Financial \n2.3 Technology \n2.3.1 Hardware \n2.3.2 Software \n3. Trainings and career \nopportunities \n3.1 Participation in training programs \n3.1.1 Technical \n3.1.2 Supervisory \n3.1.3 Managerial \n3.1.4 Continuing Education \n3.2 Serving as Resource Persons in conferences and workshops \n4. Recognitions \n4.1 Recommendations \n4.2 Citations \n4.3 Certificate of Appreciations \n4.4 Commendations \n4.5 Awards \n4.6 Tangible and Intangible Rewards \n5. Licenses and/or \ncertifications \n5.1 National Certificates \n5.2 Certificate of Competency \n5.3 Support Level Licenses \n5.4 Professional Licenses\n\n--- PDF PAGE 16 ---\nTESDA-SOP-QSO-01-F08 \nTR PLUMBING  NC II  (Amended)     Promulgated    October 2014 \nPage 14 \n \nEVIDENCE GUIDE \n       \n1. Critical \naspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 Attained job targets within key result areas (KRAs) \n1.2 Maintained intra - and interpersonal relationship in the course of \nmanaging oneself based on performance evaluation \n1.3 Completed trainings and career opportunities which are based on the \nrequirements of the industries \n1.4 Acquired and maintained licenses and/or certifications according to the \nrequirement of the qualification \n2. Resource \nImplications \nThe following resources should be provided: \n2.1 Workplace or assessment location \n2.2 Case studies/scenarios \n3. Methods of \nAssessment \nCompetency in this unit may be assessed through: \n3.1 Portfolio Assessment \n3.2 Interview \n3.3 Simulation/Role-plays \n3.4 Observation \n3.5 Third Party Reports \n3.6 Exams and Tests \n4. Context for \nAssessment \n4.1 Competency may be assessed in the work place or in a simulated work \nplace setting\n",
