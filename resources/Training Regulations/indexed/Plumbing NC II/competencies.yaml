        "evidence_guide": {
          "source_text": "1. Critical aspects of\ncompetency\nCompetency assessment requires evidence that the candidate:\n1.1 Read and interpreted work instructions in accordance with the job\nrequirements\n1.2 Selected and prepared materials, tools and equipment in accordance\nwith job requirements\n1.3 Performed pipe leak testing procedures/method in accordance with the\njob requirements\n1.4 Applied organizational quality procedures and process within the context\nof conducting pipe leak testing procedures\n1.5 Demonstrated compliance with safety regulations applicable to work site\noperations\n1.6 Identified faults and problems that occur and take necessary action to\nrectify\n1.7 Communicated interactively with others where applicable to ensure safe\nand effective work operations\n2. Resource\nImplications\nThe following resources should be provided:\n2.1 Workplace location\n2.2 Tools and equipment appropriate to construction processes\n2.3 Materials relevant to the proposed activity\n2.4 Drawings and specifications relevant to the task\n3. Methods of\nAssessment\nCompetency should be assessed through:\n3.1 Direct observation on application of tasks\n3.2 Questions related to underpinning knowledge\n4. Context for\nAssessment\n4.1 Competency may be assessed in the workplace or in a simulated\nworkplace setting\n\n--- PDF PAGE 54 ---\nTESDA-SOP-QSO-01-F08\nTR PLUMBING NC II (Amended) Promulgated October 2014\nPage 52\n\nUNIT OF COMPETENCY : PERFORM PLUMBING REPAIR AND MAINTENANCE\nWORK\nUNIT CODE :"
        },
        "source_text": "CON712350\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes in conducting\npipe leak testing.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1. Prepare for\nconducting pipe\nleak testing\n1.1 Work instructions are\nread and interpreted in\naccordance with the\njob requirements\n1.2 Materials, tools and\nequipment are\nselected and prepared\nin accordance with job\nrequirements\n1.3 All openings in the\npipe system are tightly\nclosed except the\nhighest opening\n1.4 Appropriate PPE are\nselected in\naccordance with job\nrequirements\n\n1.1 Mensuration\n1.2 Blue print reading\n1.3 Materials\nspecification\n1.4 5S\n1.5 Use of plumbing\nmaterials, tools and\nequipment\n1.6 Environmental-\nconservation\nprocedures, e.g. 3R\n(reduce, reuse,\nrecycle)\n1.7 DOLE Department\nOrder No. 13 s.\n1998 Guidelines\nGoverning\nOccupational\nSafety and Health\nin the Construction\nIndustry\n1.1 Interpreting plan and\ndetails\n1.2 Handling of\nmaterials, tools and\nequipment\n1.3 Communication\n(written and verbal)\n1.4 Applying methods\nand techniques in\npipe leak testing\n\n--- PDF PAGE 51 ---\nTESDA-SOP-QSO-01-F08\nTR PLUMBING NC II (Amended) Promulgated October 2014\nPage 49\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n2. Perform pipe\nleak\n testing\n2.1 All openings in the\npipe system are tightly\nclosed except the\nhighest opening prior\nto leak testing\n2.2 Leak testing is applied\nafter completion of\nroughing-ins and\ncomplete installation\nof pipe supports.\n2.3 Testing apparatus is\nset to specified\npressure rating\naccording to testing\nstandards.\n2.4 Gravity or flood testing\nare applied to sanitary,\nwaste, vent and storm\ndrainage piping.\n2.5 Pressure testing are\napplied to hot and cold\nwater piping.\n2.6 Correct usage of tools\nand equipment\nisobserved in\naccordance with\nmanufacturer's\nspecifications\n2.7 Appropriate PPE are\nused in accordance\nwith job requirements\n2.8 Work site is cleaned\nand kept in safe state\nand in accordance\nwith OSHS\n2.1 Blue print reading\n2.2 5S\n2.3 Use of plumbing\nmaterials, tools and\nequipment\n2.4 Environmental-\nconservation\nprocedures, e.g. 3R\n(reduce, reuse,\nrecycle)\n2.5 DOLE Department\nOrder No. 13 s.\n1998 Guidelines\nGoverning\nOccupational\nSafety and Health\nin the Construction\nIndustry\n\n2.1 Interpreting plan and\ndetails\n2.2 Handling of\nmaterials, tools and\nequipment\n2.3 Communication\n(written and verbal)\n2.4 Applying methods\nand techniques in\npipe leak testing\n\n--- PDF PAGE 52 ---\nTESDA-SOP-QSO-01-F08\nTR PLUMBING NC II (Amended) Promulgated October 2014\nPage 50\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Materials\nMay Include:\n1.1 Drum / Pail\n1.2 Water\n1.3 Plugs\n1.4 Pipe system drawing\n1.5 Rags\n1.6 Water Hose\n1.7 Teflon tape\n2. Tools and equipment\nMay include:\n2.1 Pipe wrench\n2.2 Pipe threader\n2.3 Pipe cutter\n2.4 Manual / Electric test pump\n2.5 Blow torch\n2.6 Steel tape\n2.7 Adjustable Wrench\n2.8 Ballpeen hammer\n2.9 Cold chisel\n2.10 Hacksaw with blade\n2.11 Set of Allen wrench\n2.12 Screw Driver (Philips and Flat)\n2.13 Mechanical Plier\n2.14 Vise Grip\n2.15 Ladder / scaffolding\n2.16 Flashlight / trouble light\n2.17 Pressure Gauge\n3. Personal protective equipment\n(PPE)\nMust Include:\n3.1 Gloves\n3.2 Hard hat\n3.3 Safety Shoes\n3.4 Safety harness/ belt\n4. Leak testing\nMay Include:\n4.1 Water test\n4.2 Testing by section\n4.3 Air/smoke test\n4.4 Gravity / flow test\n\n--- PDF PAGE 53 ---\nTESDA-SOP-QSO-01-F08\nTR PLUMBING NC II (Amended) Promulgated October 2014\nPage 51\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nCompetency assessment requires evidence that the candidate:\n1.1 Read and interpreted work instructions in accordance with the job\nrequirements\n1.2 Selected and prepared materials, tools and equipment in accordance\nwith job requirements\n1.3 Performed pipe leak testing procedures/method in accordance with the\njob requirements\n1.4 Applied organizational quality procedures and process within the context\nof conducting pipe leak testing procedures\n1.5 Demonstrated compliance with safety regulations applicable to work site\noperations\n1.6 Identified faults and problems that occur and take necessary action to\nrectify\n1.7 Communicated interactively with others where applicable to ensure safe\nand effective work operations\n2. Resource\nImplications\nThe following resources should be provided:\n2.1 Workplace location\n2.2 Tools and equipment appropriate to construction processes\n2.3 Materials relevant to the proposed activity\n2.4 Drawings and specifications relevant to the task\n3. Methods of\nAssessment\nCompetency should be assessed through:\n3.1 Direct observation on application of tasks\n3.2 Questions related to underpinning knowledge\n4. Context for\nAssessment\n4.1 Competency may be assessed in the workplace or in a simulated\nworkplace setting\n\n--- PDF PAGE 54 ---\nTESDA-SOP-QSO-01-F08\nTR PLUMBING NC II (Amended) Promulgated October 2014\nPage 52\n\nUNIT OF COMPETENCY : PERFORM PLUMBING REPAIR AND MAINTENANCE\nWORK\nUNIT CODE :"
