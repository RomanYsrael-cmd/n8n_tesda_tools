        "source_text": "CON712351\nUNIT DESCRIPTOR :\nThis unit covers the knowledge, skills and attitudes in\nrepairing and maintaining plumbing works.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1. Repair\ndefective\npipes, fittings\nand plumbing\nfixtures\n1.1 Defective pipes,\nfittings and plumbing\nfixtures are identified,\ndisconnected and\nreplaced with the same\nmodel and in line with\nits original working\ncondition\n1.2 Replacements are\nchecked and re-tested\nto ensure they are free\nfrom defects and in\naccordance with\nstandard specification\nor as required\n1.3 Joints are tightly\nsecured and leak free\nin accordance with the\njob requirements\n1.4 Damaged areas are\nrestored or repaired in\nline with its original\nworking condition\n1.5 Correct usage of tools ,\nequipment and\nconsumables are\nobserved in accordance\nwith job requirements\n1.6 Appropriate PPE are\nused in accordance\nwith job requirements\n1.1 Mensuration\n1.2 Blueprint reading\n1.3 Materials\nspecification\n1.4 5S\n1.5 Use of materials,\nconsumables,\ntools and\nequipment\n1.6 Plumbing fixtures\n1.7 Environmental-\nconservation\nprocedures e.g. 3R\n(reduce, reuse,\nrecycle)\n1.8 DOLE Department\nOrder No. 13 s.\n1998 Guidelines\nGoverning\nOccupational\nSafety and Health\nin the Construction\nIndustry.\n\n1.1 Interpreting plans\nand details\n1.2 Replacing\nbroken/defective\npipes\n1.3 Clearing clogged\npipes and drainage\n1.4 Handling of\nmaterials, tools and\nequipment\n1.5 Communication\n(written and verbal)\n1.6 Applying methods\nand techniques in\nrepairing defective\npipes, fittings and\nplumbing fixtures\n\n--- PDF PAGE 55 ---\nTESDA-SOP-QSO-01-F08\nTR PLUMBING NC II (Amended) Promulgated October 2014\nPage 53\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are elaborated\nin the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n2. Clear clogged\npipes and\ndrains\n\n2.1 Clogged pipes and\ndrains are precisely\nidentified in reference\nwith the as- built plan.\n2.2 Clogged pipes and\ndrains are cleared\nusing appropriate\ntools, equipment and\nmethodology\n2.3 Pipes and drain are\ncleared and provided\nwith screen in line\nwith original working\ncondition\n2.4 Appropriate PPE are\nused in accordance\nwith the job\nrequirements\n\n2.1 Mensuration\n2.2 Blueprint reading\n2.3 5S\n2.4 Use of tools and\nequipment\n2.5 Environmental-\nconservation\nprocedures e.g. 3R\n(reduce, reuse,\nrecycle)\n2.6 DOLE Department\nOrder No. 13 s.\n1998 (Guidelines\nGoverning\nOccupational\nSafety and Health\nin the Construction\nIndustry)\n2.1 Interpreting plan and\ndetails\n2.2 Handling of tools\nand equipment\n2.3 Clearing clogged\npipes and drains\n\n--- PDF PAGE 56 ---\nTESDA-SOP-QSO-01-F08\nTR PLUMBING NC II (Amended) Promulgated October 2014\nPage 54\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Pipes and fittings\n\nMay include:\n1.1 PVC/PE Pipe and fittings\n1.2 PPR pipes and fittings\n1.3 G.I. pipes and fittings\n1.4 C.I. pipes and fittings\n1.5 B.I. pipes and fittings\n1.6 Tank fittings for water closet\n1.7 Flush tank fittings for water closet\n1.8 Sewer and drainage line\n1.9 Water supply and distribution line\n1.10 Riser and downfeed\n1.11 Copper pipes and fittings\n2. Plumbing fixtures\n\nMay include:\n2.1 Lavatory with faucet, p-trap, angle valve and supply pipe\n2.2 Bathtub with waste and overflow assembly\n2.3 Shower valve\n2.4 Flushometer valve\n2.5 Shower heads\n2.6 Electronic flushing devices (urinal, closet, faucet)\n2.7 Water closet ( flush tank/valve) , angle valve and supply\npipe\n2.8 Kitchen Sink\n2.9 Bidet\n2.10 Urinal\n2.11 Grease Trap\n2.12 Floor Drain Strainer\n2.13 Clean-out cover\n2.14 Water hammer arrester\n\n--- PDF PAGE 57 ---\nTESDA-SOP-QSO-01-F08\nTR PLUMBING NC II (Amended) Promulgated October 2014\nPage 55\n\nVARIABLE\nRANGE\n3. Tools, equipment, and\nconsumables\n\nMay include:\n3.1 Pipe wrench\n3.2 Pipe threader\n3.3 Pipe cutter\n3.4 Manual / Electric test pump\n3.5 Hand drain cleaner\n3.6 Blow torch\n3.7 Steel tape\n3.8 Adjustable Wrench\n3.9 Ballpeen hammer\n3.10\nCold chisel\n3.11\nHacksaw with blade\n3.12\nBasin wrench\n3.13\nStrap wrench\n3.14\nSet of Allen wrench\n3.15\nScrew Driver (Philips and Flat)\n3.16\nMechanical Plier\n3.17\nVise Grip\n3.18\nTeflon Tapes\n3.19\nRags\n3.20\nSolvent Cement\n4. Personal protective equipment\n(PPE)\n\nMay include:\n4.1 Gloves\n4.2 Hard hat\n4.3 Safety Shoes\n4.4 Ear muff\n4.5 Goggles\n4.6 Face Shield\n4.7 Safety Harness / belt\n4.8 Dust mask\n\n--- PDF PAGE 58 ---\nTESDA-SOP-QSO-01-F08\nTR PLUMBING NC II (Amended) Promulgated October 2014\nPage 56\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nCompetency assessment requires evidence that the candidate:\n1.1 Selected and prepared materials, tools, equipment and consumables in\naccordance with job requirements\n1.2 Identified, disconnected and repaired defective pipes, fittings and\nplumbing fixtures in accordance with standard specification or as required\n1.3 Cleared clogged pipes and drains in line with SOPs\n1.4 Demonstrated compliance with safety and environment regulations are\napplicable to work site operations\n1.5 Identified faults and problems that occur and made necessary action to\nrectify\n1.6 Communicated interactively with others where applicable to ensure safe\nand effective work operations\n2. Resource\nImplications\nThe following resources should be provided:\n2.1 Workplace location\n2.2 Tools and equipment appropriate to plumbing repair and maintenance\nwork\n2.3 Materials relevant to the proposed activity\n2.4 Drawings and specifications relevant to the task\n3. Methods of\nAssessment\nCompetency should be assessed through:\n3.1 Direct observation on application of tasks\n3.2 Questions related to underpinning knowledge\n4. Context for\nAssessment\n4.1 Competency may be assessed in the workplace or in a simulated\nworkplace setting\n\n--- PDF PAGE 59 ---\nTR PLUMBING NC II (Amended) Promulgated October 2014\nPage 57"
