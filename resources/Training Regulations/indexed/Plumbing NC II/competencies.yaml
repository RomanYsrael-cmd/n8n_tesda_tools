        "source_text": "CON311204\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes on checking\ncondition, performing preventive maintenance and storing of\nplumbing tools and equipment.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1\nCheck condition\nof tools and\nequipment\n\n1.1 Materials, tools and\nequipment are\nidentified according to\nclassification and job\nrequirements\n1.2 Non-functional tools\nand equipment are\nsegregated and\nlabeled according to\nclassification\n1.3 Safety of tools and\nequipment are\nobserved in\naccordance with\nmanufacturer's\ninstructions\n1.4 Condition of PPE are\nchecked in\naccordance with\nmanufacturer's\ninstructions\n\n1.1 SAFETY\nPRACTICES\n1.1.1 Use of PPE\n1.1.2 Handling of\ntools and\nequipment\n1.1.3 Good\nhousekeeping\n1.2 MATERIALS,\nTOOLS AND\nEQUIPMENT\n1.2.1 Types and\nuses of\nlubricants\n1.2.2 Types and\nuses of cleaning\nmaterials\n1.2.3 Types and\nuses of plumbing\ntools\n1.2.4 Types and\nuses of plumbing\nequipment\n1.3 Operational\nconditions of\nplumbing tools and\nequipment\n1.4 Plumbing tools and\nequipment defects\n1.1 Maintaining tools\nand equipment\n1.2 Handling of tools\nand equipment\n1.3 Identifying tools and\nequipment defects\n\n--- PDF PAGE 36 ---\nTESDA-SOP-QSO-01-F08\nTR PLUMBING NC II (Amended) Promulgated October 2014\nPage 34\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n2\nPerform basic\npreventive\nmaintenance\n2.1 Appropriate lubricants\nare identified according\nto types of equipment\n2.2 Tools and equipment\nare lubricated\naccording to\npreventive\nmaintenance schedule\nor manufacturer's\nspecifications\n2.3 Measuring instruments\nare checked and\ncalibrated in\naccordance with\nmanufacturer’s\ninstructions\n2.4 Tools are cleaned and\nlubricated according to\nstandard procedures\n2.5 Defective instruments,\nequipment and\naccessories are\ninspected and\nreplaced according to\nmanufacturer’s\nspecifications\n2.6 Tools are inspected,\nrepaired and replaced\nafter use\n2.7 Work place is cleaned\nand kept in safe state\nin line with\nOccupational Safety\nand Health Standards\n(OSHS)\n2.1 SAFETY\nPRACTICES\n2.1.1 Use of PPE\n2.1.2 Handling of\ntools and\nequipment\n2.1.3 Good\nhousekeeping\n2.2 MATERIALS,\nTOOLS AND\nEQUIPMENT\n2.2.1 Types and\nuses of\nlubricants\n2.2.2 Types and\nuses of\ncleaning\nmaterials\n2.3 PREVENTIVE\nMAINTENANCE\n2.3.1 Methods and\ntechniques\n2.3.2 Procedures\n\n2.1 Handling of tools and\nequipment\n2.2 Performing\npreventive\nmaintenance\n\n--- PDF PAGE 37 ---\nTESDA-SOP-QSO-01-F08\nTR PLUMBING NC II (Amended) Promulgated October 2014\nPage 35\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n3\nStore tools and\nequipment\n\n3.1 Inventory of tools,\ninstruments and\nequipment are\nconducted and\nrecorded as per\ncompany practices\n3.2 Tools and equipment\nare stored safely in\nappropriate locations\nin accordance with\nmanufacturer's\nspecifications or\ncompany procedures\n3.1 SAFETY\nPRACTICES\n3.1.1 Use of PPE\n3.1.2 Handling of\ntools and\nequipment\n3.1.3 Storing\nprocedures\nand\ntechniques\n3.1.4 Storage\nconditions/\nlocations\n3.1 Storing tools and\nequipment\n3.2 Handling of tools and\nequipment\n\n--- PDF PAGE 38 ---\nTESDA-SOP-QSO-01-F08\nTR PLUMBING NC II (Amended) Promulgated October 2014\nPage 36\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Materials\nMay include:\n1.1 Lubricants\n1.2 Cleaning materials\n1.3 Rust remover\n1.4 Rugs\n1.5 Spare parts\n2. Tools and equipment\n\nMay include:\n2.1 Tools\nCutting tools - hacksaw, crosscut saw, rip saw\nBoring tools - auger, brace, grinlet, hand drill\nHolding tools - vise grip, C-clamp, bench vise\nThreading tools - die and stock, taps\n\n2.2 Measuring instruments/equipment\n3. PPE\nMay include:\n3.1 Goggles\n3.2 Gloves\n3.3 Safety shoes\n3.4 Aprons/Coveralls\n4. Forms\nMay include:\n4.1 Maintenance schedule forms\n4.2 Requisition slip\n4.3 Inventory Form\n4.4 Inspection Form\n4.5 Procedures\n\n--- PDF PAGE 39 ---\nTESDA-SOP-QSO-01-F08\nTR PLUMBING NC II (Amended) Promulgated October 2014\nPage 37\n\nEVIDENCE GUIDE\n\n1. Critical aspects\nof Competency\nAssessment requires that the candidate:\n1.1 Selected and used appropriate processes, tools and equipment to carry out\ntask\n1.2 Identified functional and non-functional tools and equipment\n1.3 Checked, lubricated and calibrated tools, equipment and instruments\naccording to manufacturer’s specifications\n1.4 Replaced defective tools, equipment and their accessories\n1.5 Observed and applied safe handling of tools and equipment and safety work\npractices\n1.6 Prepared and submitted inventory report, where applicable\n1.7 Maintained workplace in accordance with OSHS\n1.8 Stored tools and equipment safely in appropriate locations and in\naccordance with company practices\n2. Resource\nimplications\nThe following resources should be provided:\n2.1 Workplace\n2.2 Maintenance schedule\n2.3 Maintenance materials, tools and equipment relevant to the proposed\nactivity/task\n3. Methods of\nassessment\nCompetency should be assessed through:\n3.1 Direct observation\n3.2 Written test/questioning relevant to Underpinning knowledge\n4. Context of\nassessment\n4.1 Competency assessment may occur in workplace or any appropriate\nsimulated environment\n4.2 Competency assessment must be undertaken in accordance with the\nendorsed TESDA assessment guidelines\n\n--- PDF PAGE 40 ---\nTESDA-SOP-QSO-01-F08\nTR PLUMBING NC II (Amended) Promulgated October 2014\nPage 38\n\nCORE COMPETENCIES\n\nUNIT OF COMPETENCY : PREPARE ESTIMATION OF MATERIALS FOR\n\n MULTIPLE PLUMBING UNITS\n\nUNIT CODE\n\n:"
