  "source_section_text": "SECTION 2 COMPETENCY STANDARDS\n\nThe PLUMBING NC II Qualification consists of competencies that a person must\nachieve to enable him/her to prepare estimation of materials for single plumbing unit,\nperform complex plumbing installation and assemblies, conduct pipe leak testing and\nperform plumbing repair and maintenance works.\n\nBASIC COMPETENCIES\n\nUNIT OF COMPETENCY : PARTICIPATE IN WORKPLACE COMMUNICATION\n\nUNIT CODE\n\n :500311105\n\nUNIT DESCRIPTOR\n:This unit covers the knowledge, skills and attitudes required to\ngather, interpret and convey information in response to workplace\nrequirements.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1 Obtain and\nconvey\nworkplace\ninformation\n1.1 Specific and relevant\ninformation is accessed\nfrom appropriate\nsources\n1.2 Effective questioning,\nactive listening and\nspeaking skills are used\nto gather and convey\ninformation\n1.3 Appropriate medium is\nused to transfer\ninformation and ideas\n1.4 Appropriate non- verbal\ncommunication is used\n1.5 Appropriate lines of\ncommunication with\nsupervisors and\ncolleagues are identified\nand followed\n1.6 Defined workplace\nprocedures for the\nlocation and storage of\ninformation are used\n1.7 Personal interaction is\ncarried out clearly and\nconcisely\n1.1 Effective\ncommunication\n1.2 Different modes\nof\ncommunication\n1.3 Written\ncommunication\n1.4 Organizational\npolicies\n1.4 Communication\nprocedures and\nsystems\n1.5 Technology\nrelevant to the\nenterprise and\nthe individual’s\nwork\nresponsibilities\n1.1 Following simple\nspoken language\n1.2 Performing routine\nworkplace duties\nfollowing simple\nwritten notices\n1.3 Participating in\nworkplace\nmeetings and\ndiscussions\n1.4 Completing work\nrelated documents\n1.5 Estimating,\ncalculating and\nrecording routine\nworkplace\nmeasures\n1.6 Relating to people\nof social range in\nthe workplace\n1.7 Gathering and\nproviding\ninformation in\nresponse to\nworkplace\nrequirements\n\n--- PDF PAGE 5 ---\nTESDA-SOP-QSO-01-F08\nTR PLUMBING NC II (Amended) Promulgated October 2014\nPage 3\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n2 Participate in\nworkplace\nmeetings and\ndiscussions\n2.1 Team meetings are\nattended on time\n2.2 Own opinions are\nclearly expressed and\nthose of others are\nlistened to without\ninterruption\n2.3 Meeting inputs are\nconsistent with the\nmeeting purpose and\nestablished protocols\n2.4 Workplace\ninteractions are\nconducted in a\ncourteous manner\n2.5 Questions about\nsimple routine\nworkplace procedures\nand matters\nconcerning working\nconditions of\nemployment are asked\nand responded to\n2.6 Meetings outcomes are\ninterpreted and\nimplemented\n2.1 Effective\ncommunication\n2.2 Different modes\nof\ncommunication\n2.3 Written\ncommunication\n2.4 Organizational\npolicies\n2.5 Communication\nprocedures and\nsystems\n2.6 Technology\nrelevant to the\nenterprise and\nthe individual’s\nwork\nresponsibilities\n2.1 Following simple\nspoken language\n2.2 Performing routine\nworkplace duties\nfollowing simple\nwritten notices\n2.3 Participating in\nworkplace meetings\nand discussions\n2.4 Completing work\nrelated documents\n2.5 Estimating,\ncalculating and\nrecording routine\nworkplace\nmeasures\n2.6 Relating to people\nof social range in\nthe workplace\n2.7 Gathering and\nproviding\ninformation in\nresponse to\nworkplace\nrequirements\n3 Complete\nrelevant work\nrelated\ndocuments\n3.1 Range of forms\nrelating to conditions of\nemployment are\ncompleted accurately\nand legibly\n3.2 Workplace data is\nrecorded on standard\nworkplace forms and\ndocuments\n3.1 Effective\ncommunication\n3.2 Different modes\nof\ncommunication\n3.3 Written\ncommunication\n\n3.1 Completing work\nrelated documents\n3.2 Applying basic\nmathematical\nprocesses of\naddition,\nsubtraction, division\nand multiplication\n\n--- PDF PAGE 6 ---\nTESDA-SOP-QSO-01-F08\nTR PLUMBING NC II (Amended) Promulgated October 2014\nPage 4\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n\n3.3 Basic mathematical\nprocesses are used for\nroutine calculations\n3.4 Errors in recording\ninformation on forms/\ndocuments are\nidentified and properly\nacted upon\n3.5 Reporting requirements\nto supervisor are\ncompleted according to\norganizational\nguidelines\n3.4 Organizational\npolicies\n3.5 Communication\nprocedures and\nsystems\n3.6 Technology\nrelevant to the\nenterprise and\nthe individual’s\nwork\nresponsibilities\n3.3 Gathering and\nproviding\ninformation in\nresponse to\nworkplace\nrequirements\n\n--- PDF PAGE 7 ---\nTESDA-SOP-QSO-01-F08\nTR PLUMBING NC II (Amended) Promulgated October 2014\nPage 5\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Appropriate sources\n1.1.\nTeam members\n1.2.\nSuppliers\n1.3.\nTrade personnel\n1.4.\nLocal government\n1.5.\nIndustry bodies\n\n2. Medium\n2.1.\nMemorandum\n2.2.\nCircular\n2.3.\nNotice\n2.4.\nInformation discussion\n2.5.\nFollow-up or verbal instructions\n2.6.\nFace to face communication\n\n3. Storage\n3.1.\nManual filing system\n3.2.\nComputer-based filing system\n\n4. Forms\n4.1.\nPersonnel forms, telephone message forms, safety reports\n\n5. Workplace\ninteractions\n5.1.\nFace to face\n5.2.\nTelephone\n5.3.\nElectronic and two way radio\n5.4.\nWritten including electronic, memos, instruction and forms,\nnon-verbal including gestures, signals, signs and diagrams\n\n6. Protocols\n6.1.\nObserving meeting\n6.2.\nCompliance with meeting decisions\n6.3.\nObeying meeting instructions\n\n--- PDF PAGE 8 ---\nTESDA-SOP-QSO-01-F08\nTR PLUMBING NC II (Amended) Promulgated October 2014\nPage 6\n\nEVIDENCE GUIDE\n\n1. Critical aspects\nof Competency\nAssessment requires evidence that the candidate:\n1.1. Prepared written communication following standard format of the\norganization\n1.2. Accessed information using communication equipment\n1.3. Made use of relevant terms as an aid to transfer information\neffectively\n1.4. Conveyed information effectively adopting the formal or informal\ncommunication\n\n2. Resource\nImplications\nThe following resources should be provided:\n2.1. Fax machine\n2.2. Telephone\n2.3. Writing materials\n2.4. Internet\n\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1. Direct Observation\n3.2. Oral interview and written test\n\n4. Context for\nAssessment\n4.1. Competency may be assessed individually in the actual workplace or\nthrough accredited institution\n\n--- PDF PAGE 9 ---\nTESDA-SOP-QSO-01-F08\nTR PLUMBING NC II (Amended) Promulgated October 2014\nPage 7\n\nUNIT OF COMPETENCY\n:\nWORK IN TEAM ENVIRONMENT\n\nUNIT CODE\n\n:\n500311106\n\nUNIT DESCRIPTOR :\nThis unit covers the skills, knowledge and attitudes to identify\nrole and responsibility as a member of a team.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1.\nDescribe team\nrole and scope\n1.1 The role and objective\nof the team is identified\nfrom available sources\nof information\n1.2 Team parameters,\nreporting relationships\nand responsibilities are\nidentified from team\ndiscussions and\nappropriate external\nsources\n1.1 Communication\nprocess\n1.2 Team structure\n1.3 Team roles\n1.4 Group planning\nand decision\nmaking\n1.1 Communicate\nappropriately,\nconsistent with\nthe culture of the\nworkplace\n2. Identify own role\nand responsibility\nwithin team\n2.1 Individual role and\nresponsibilities within\nthe team environment\nare identified\n2.2 Roles and responsibility\nof other team members\nare identified and\nrecognized\n2.3 Reporting relationships\nwithin team and external\nto team are identified\n2.1 Communication\nprocess\n2.2 Team structure\n2.3 Team roles\n2.4 Group planning\nand decision\nmaking\n2.1 Communicate\nappropriately,\nconsistent with\nthe culture of the\nworkplace\n\n--- PDF PAGE 10 ---\nTESDA-SOP-QSO-01-F08\nTR PLUMBING NC II (Amended) Promulgated October 2014\nPage 8\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n3. Work as a team\nmember\n3.1 Effective and appropriate\nforms of communications\nused and interactions\nundertaken with team\nmembers who contribute\nto known team activities\nand objectives\n3.2 Effective and appropriate\ncontributions made to\ncomplement team\nactivities and objectives,\nbased on individual skills\nand competencies and\nworkplace context\n3.3 Observed protocols in\nreporting using standard\noperating procedures\n3.4 Contribute to the\ndevelopment of team\nwork plans based on an\nunderstanding of team’s\nrole and objectives and\nindividual competencies\nof the members\n3.1 Communication\nprocess\n3.2 Team structure\n3.3 Team roles\n3.4 Group planning\nand decision\nmaking\n3.1 Communicate\nappropriately,\nconsistent with\nthe culture of the\nworkplace\n3.2 Interacting\neffectively with\nothers\n\n--- PDF PAGE 11 ---\nTESDA-SOP-QSO-01-F08\nTR PLUMBING NC II (Amended) Promulgated October 2014\nPage 9\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Role and\nobjective of\nteam\n1.1.\nWork activities in a team environment with enterprise or specific\nsector\n1.2.\nLimited discretion, initiative and judgment maybe demonstrated on\nthe job, either individually or in a team environment\n\n2. Sources of\ninformation\n2.1.\nStandard operating and/or other workplace procedures\n2.2.\nJob procedures\n2.3.\nMachine/equipment manufacturer’s specifications and instructions\n2.4.\nOrganizational or external personnel\n2.5.\nClient/supplier instructions\n2.6.\nQuality standards\n2.7.\nOSH and environmental standards\n\n3. Workplace\ncontext\n3.1.\nWork procedures and practices\n3.2.\nConditions of work environments\n3.3.\nLegislation and industrial agreements\n3.4.\nStandard work practice including the storage, safe handling and\ndisposal of chemicals\n3.5.\nSafety, environmental, housekeeping and quality guidelines\n\n--- PDF PAGE 12 ---\nTESDA-SOP-QSO-01-F08\nTR PLUMBING NC II (Amended) Promulgated October 2014\nPage 10\n\nEVIDENCE GUIDE\n\n1. Critical aspects\nof Competency\nAssessment requires evidence that the candidate:\n1.1.\nOperated in a team to complete workplace activity\n1.2.\nWorked effectively with others\n1.3.\nConveyed information in written or oral form\n1.4.\nSelected and used appropriate workplace language\n1.5.\nFollowed designated work plan for the job\n1.6.\nReported outcomes\n\n2. Resource\nImplications\nThe following resources should be provided:\n2.1.\nAccess\nto\nrelevant\nworkplace\nor\nappropriately\nsimulated\nenvironment where assessment can take place\n2.2.\nMaterials relevant to the proposed activity or tasks\n\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1.\nObservation of the individual member in relation to the work\nactivities of the group\n3.2.\nObservation of simulation and or role play involving the participation\nof individual member to the attainment of organizational goal\n3.3.\nCase studies and scenarios as a basis for discussion of issues\nand strategies in teamwork\n\n4. Context for\nAssessment\n4.1.\nCompetency may be assessed in workplace or in a simulated\nworkplace setting\n4.2.\nAssessment shall be observed while task are being undertaken\nwhether individually or in group\n\n--- PDF PAGE 13 ---\nTESDA-SOP-QSO-01-F08\nTR PLUMBING NC II (Amended) Promulgated October 2014\nPage 11\n\nUNIT OF COMPETENCY : PRACTICE CAREER PROFESSIONALISM\n\nUNIT CODE : 500311107\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes in promoting career\ngrowth and advancement.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1.