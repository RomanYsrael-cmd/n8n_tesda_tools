port is \nprepared and documented \nas per service/repair center’s \nguidelines and procedures  \n \n5.1. Knowledge on mobile \nphone unit and \nhandheld gadget parts \nassembly and \ndisassembly \n5.2. Knowledge in mobile \nphone unit and \nhandheld gadget \noperation \n5.3. Normal working \ncondition of mobile \nphone unit and \nhandheld gadget \n5.4. System and \nProcesses \no Parts/components \nassembly/ \ndisassembly \n5.5. E-waste management  \n(DENR AO 2013-22) \n5.1. Reading skills \n5.2. Communicatio\nn skills \n5.3. Interpretation \nof diagrams \n5.4. Assembly and \ndisassembly \nskills \n5.5. Skills in mobile \nphone unit and \nhandheld \ngadget \noperation\n\n--- PDF PAGE 77 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- \nTR – Mobile Phones & Handheld Gadgets Servicing NC III   (ELCMPS321)      Promulgated February 9, 2021        73  \n \n \n       \n \n \n \n \n \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Personal protective \nequipment  \nMay include but not limited to: \n1.1. Working clothes/Apron \n1.2. Face/Dust Mask \n1.3. Goggles \n1.4. Anti-static mat \n1.5. Anti-static gloves  \n1.6. anti-static wrist strap \n2. OHS practices  \nMay include but not limited to: \n2.1. Use of proper tools and equipment \n2.2. Observe workplace environment and safety \n2.3. Adherence to safety requirements in handling the unit \n2.4. Use of protective device/shields \n2.5. Proper ESD practices  \n3. Accessories \nMay include: \n3.1. Casing \n3.2. SIM card \n3.3. SD card \n3.4. Battery  \n4. Pre-testing \nprocedures \nMay include: \n4.1. Visual inspection of the unit with the power off \n4.2. Interview of customer, re: history of unit \n4.3. Operate the unit according to manual to confirm defects \n5. System defect/ \nFault symptoms \nMay include but not limited to: \n5.1. No power \n Water damaged unit \n Dropped unit \n Memory-full unit \n Software incompatibility  \n Defective battery \n Defective battery terminal \n Defective ON/OFF switch \n5.2. No Signal  \n No transmission/ \nreception \n Intermittent signal \n Shorted/grounded unit \n Corrupted IMEI \n Defective antenna \n5.3. Not charging \n Defective charging port  \n Overcharged battery \n Defective Charging IC \n Defective battery \n Defective battery terminal \n Corrupted software  \n \n \n5.4. Defective User \ninterface \n Buzzer \n Vibrator \n Keypad \n Ear piece  \n Microphone \n LCD problem \n Camera problem \n Charging port problem \n Touch screen/digitizer \n Antenna  \n5.5. Defective modules \n Wi-Fi / Bluetooth \n Radio / TV / Audio  \n Camera\n\n--- PDF PAGE 78 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- \nTR – Mobile Phones & Handheld Gadgets Servicing NC III   (ELCMPS321)      Promulgated February 9, 2021        74  \n \n \n       \n \n \n \n \n \n \n \nVARIABLE \nRANGE \n6. Basic \ntroubleshooting \ntechniques \nMay include but not limited to: \n6.1. Sensing methods (visual, hearing, smell, touch) \n6.2. Component substitution/swapping method \n6.3. Isolation method \n6.4. Diagnostic software method \n6.5. Diagnosing components using test instruments \n7. Input/output (I/O) \ncomponents \nMay include but not limited to: \n7.1. Speaker/Loud speaker \n7.2. Wireless / USB keyboard  \n7.3. Microphone/Mouth piece \n7.4. LCD  \n7.5. Camera \n7.6. Charging port \n7.7. Touch screen/digitizer \n7.8. Power switch/button \n7.9. SIM/Memory card socket \n8. Responsible \nperson \nMay include but not limited to: \n8.1. Immediate supervisor \n8.2. Service supervisor/manager \n \n9. Environmental \nRequirements \nMay include but not limited to: \n9.1. Proper disposal of chemicals and components shall be \nbased on existing requirements of the law and chemical \nwaste management  \n9.2. Non-biodegradable parts or materials shall be packed \nand labeled properly for disposal. \n9.3. Electronic waste are properly packed and labeled for \ndisposal in accordance with environmental requirements. \n10. Compatible \nfirmware version \n May include: \n10.1. stockROM/Flash file \n10.2. official latest update \n10.3. custom firmware version\n\n--- PDF PAGE 79 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- \nTR – Mobile Phones & Handheld Gadgets Servicing NC III   (ELCMPS321)      Promulgated February 9, 2021        75  \n \n \n       \n \n \n \n \n \n \n \nEVIDENCE GUIDE \n \n1. Critical aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1. Disassemble unit/gadget  \n1.1.1. Used personal protective equipment (PPE) in \naccordance with Occupational Health and Safety \npractices \n1.1.2. Performed disassembly procedures in accordance \nwith OH&S policies and work instructions \n1.1.3. Properly organized parts and accessories in \naccordance with its functionality and purpose \n1.2. Troubleshoot unit/gadget hardware related problem \n1.2.1. Followed electro-static discharge (ESD) procedure \nin accordance with current industry standards \n1.2.2. Observed systematic pre-testing procedure in \naccordance with user’s manual \n1.2.3. Identified system defects/ fault symptoms in \naccordance with basic troubleshooting techniques \n1.2.4. Checked and isolated chips and components using \nspecified testing procedures \n1.2.5. Checked input/output (I/O) components using \nspecified testing procedures  \n1.3. Repaired unit/ gadget hardware related problem \n1.3.1. Replaced/Swapped defective parts/ components \nwith original/ compatible parts according to \ndiagnostic results \n1.3.2. Soldered/Mounted repaired or replaced parts/ \ncomponents in accordance with the current industry \nstandards \n1.3.3. Performed repair activity within the required \ntimeframe \n1.3.4. Checked repaired or replaced parts/components for \nproper mounting and tested for its functionality \n1.3.5. Observed care and extreme precaution in handling \nthe unit/gadget as per procedures \n1.4. Repaired unit/ gadget  software related problem \n1.4.1. Identified unit/gadget firmware is prepared based on \nphone and mobile device settings’ hardware \nspecifications \n1.4.2. Ensured battery life percentage to be 50% higher \nprior to installation of unit/gadget firmware and other \nrelated software \n1.4.3. Informed client for possible loss of user data during \nsoftware \n1.4.4. Performed formatting of user data based on \nunit/gadget factory default settings \n1.4.5. Installed compatible firmware version based on \nunit/gadget model/brand and standard procedures \n1.5. Reassemble unit/ gadget  \n1.5.1. Performed reassembly procedure in accordance \nwith OH&S policies and in conformity with user’s\n\n--- PDF PAGE 80 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- \nTR – Mobile Phones & Handheld Gadgets Servicing NC III   (ELCMPS321)      Promulgated February 9, 2021        76  \n \n \n       \n \n \n \n \n \n \nmanual \n1.5.2. Checked and verified internal components if in \nplaced based on standard procedures \n1.5.3. Cleaned repaired unit/gadget in in accordance with \nstandard procedures \n \n2. Resource \nImplications \nThe following resources should be provided: \n2.1. Work area with sufficient lighting and ventilation system  \n2.2. ESD free working area/bench  \n2.3. Tools and equipment   \n2.4. Appropriate mobile/cellular phone units  \n2.5. Desktop/ laptop units and appropriate mobile \napplication/add-ons software \n2.6. Work Instructions Assessment rating sheet \n2.7. Applicable forms for specific tasks \n \n3. Methods of \nAssessment \nCompetency may be assessed through: \n3.1. Demonstration with oral questioning  \n3.2. Written test \n3.3. Portfolio with interview \n \n4. Context for \nAssessment \n4.1. Competency may be assessed in actual workplace or at \nthe designated TESDA Accredited Assessment Center.\n",
