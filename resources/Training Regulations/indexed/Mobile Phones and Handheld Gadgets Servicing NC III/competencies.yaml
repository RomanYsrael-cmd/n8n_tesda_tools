          "source_text": "1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nAdjusted language and behavior as required by\ninteractions with diversity\n1.2\nIdentified and respected individual differences in\ncolleagues, clients and customers\n1.3\nApplied relevant regulations, standards and\ncodes of practice\n2. Resource Implications\nThe following resources should be provided:\n2.1 Access to workplace and resources\n2.2 Manuals and policies on Workplace Diversity\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1\nDemonstration or simulation with oral\nquestioning\n3.2\nGroup discussions and interactive activities\n3.3\nCase studies/problems involving workplace\ndiversity issues\n3.4\nThird-party report\n3.5\nWritten examination\n3.6\nRole Plays\n4. Context for\nAssessment\nCompetency assessment may occur in workplace or\nany appropriately simulated environment\n\n--- PDF PAGE 21 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Mobile Phones & Handheld Gadgets Servicing NC III (ELCMPS321) Promulgated February 9, 2021 17\n\nUNIT OF COMPETENCY: PROPOSE METHODS OF APPLYING LEARNING AND\nINNOVATION IN THE ORGANIZATION\n\nUNIT CODE :"
        },
        "source_text": "400311322\nUNIT DESCRIPTOR\n:\nThis unit covers the outcomes required to work effectively in a\nworkplace characterized by diversity in terms of religions,\nbeliefs, races, ethnicities and other differences.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1. Develop an\nindividual’s\ncultural\nawareness\nand sensitivity\n1.1. Individual differences\nwith clients, customers\nand fellow workers are\nrecognized and\nrespected in accordance\nwith enterprise policies\nand core values.\n1.2. Differences are\nresponded to in a\nsensitive and considerate\nmanner\n1.3. Diversity is\naccommodated using\nappropriate verbal and\nnon-verbal\ncommunication.\n1.1. Understanding\ncultural diversity in\nthe workplace\n1.2. Norms of behavior for\ninteracting and\ndialogue with specific\ngroups\n(e. g., Muslims and\nother non-Christians,\nnon-Catholics,\ntribes/ethnic groups,\nforeigners)\n1.3. Different methods of\nverbal and non-verbal\ncommunication in a\nmulticultural setting\n1.1. Applying cross-\ncultural\ncommunication\nskills (i.e. different\nbusiness\ncustoms, beliefs,\ncommunication\nstrategies)\n1.2. Showing affective\nskills –\nestablishing\nrapport and\nempathy,\nunderstanding,\netc.\n1.3. Demonstrating\nopenness and\nflexibility in\ncommunication\n1.4. Recognizing\ndiverse groups in\nthe workplace\nand community\nas defined by\ndivergent culture,\nreligion, traditions\nand practices\n2. Work\neffectively in\nan\nenvironment\nthat\nacknowledges\nand values\ncultural\ndiversity\n2.1 Knowledge, skills and\nexperiences of others\nare recognized and\ndocumented in relation to\nteam objectives.\n2.2 Fellow workers are\nencouraged to utilize and\nshare their specific\nqualities, skills or\nbackgrounds with other\nteam members and\nclients to enhance work\noutcomes.\n2.3 Relations with customers\nand clients are\nmaintained to show that\ndiversity is valued by the\nbusiness.\n2.1 Value of diversity in\nthe economy and\nsociety in terms of\nWorkforce\ndevelopment\n2.2 Importance of\ninclusiveness in a\ndiverse environment\n2.3 Shared vision and\nunderstanding of\nand commitment to\nteam, departmental,\nand organizational\ngoals and objectives\n2.4 Strategies for\ncustomer service\nexcellence\n2.1 Demonstrating\ncross-cultural\ncommunication\nskills and active\nlistening\n2.2 Recognizing\ndiverse groups in\nthe workplace and\ncommunity as\ndefined by\ndivergent culture,\nreligion, traditions\nand practices\n2.3 Demonstrating\ncollaboration skills\n2.4 Exhibiting\ncustomer service\nexcellence\n\n--- PDF PAGE 19 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Mobile Phones & Handheld Gadgets Servicing NC III (ELCMPS321) Promulgated February 9, 2021 15\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n3. Identify\ncommon\nissues in a\nmulticultural\nand diverse\nenvironment\n3.1 Diversity-related\nconflicts within the\nworkplace are effectively\naddressed and resolved.\n3.2 Discriminatory behaviors\ntowards\ncustomers/stakeholders\nare minimized and\naddressed accordingly.\n3.3 Change management\npolicies are in place\nwithin the organization.\n3.1 Value, and leverage\nof cultural diversity\n3.2 Inclusivity and\nconflict resolution\n3.3 Workplace\nharassment\n3.4 Change management\nand ways to\novercome resistance\nto change\n3.5 Advanced strategies\nfor customer service\nexcellence\n3.1 Addressing\ndiversity-related\nconflicts in the\nworkplace\n3.2 Eliminating\ndiscriminatory\nbehavior towards\ncustomers and\nco-workers\n3.3 Utilizing change\nmanagement\npolicies in the\nworkplace\n\n--- PDF PAGE 20 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Mobile Phones & Handheld Gadgets Servicing NC III (ELCMPS321) Promulgated February 9, 2021 16\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1.\nDiversity\nThis refers to diversity in both the workplace and the\ncommunity and may include divergence in :\n1.1\nReligion\n1.2\nEthnicity, race or nationality\n1.3\nCulture\n1.4\nGender, age or personality\n1.5\nEducational background\n2. Diversity-related conflicts\nMay include conflicts that result from:\n2.1\nDiscriminatory behaviors\n2.2\nDifferences of cultural practices\n2.3\nDifferences of belief and value systems\n2.4\nGender-based violence\n2.5\nWorkplace bullying\n2.6\nCorporate jealousy\n2.7\nLanguage barriers\n2.8\nIndividuals being differently-abled persons\n2.9\nAgeism (negative attitude and behavior towards\nold people)\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nAdjusted language and behavior as required by\ninteractions with diversity\n1.2\nIdentified and respected individual differences in\ncolleagues, clients and customers\n1.3\nApplied relevant regulations, standards and\ncodes of practice\n2. Resource Implications\nThe following resources should be provided:\n2.1 Access to workplace and resources\n2.2 Manuals and policies on Workplace Diversity\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1\nDemonstration or simulation with oral\nquestioning\n3.2\nGroup discussions and interactive activities\n3.3\nCase studies/problems involving workplace\ndiversity issues\n3.4\nThird-party report\n3.5\nWritten examination\n3.6\nRole Plays\n4. Context for\nAssessment\nCompetency assessment may occur in workplace or\nany appropriately simulated environment\n\n--- PDF PAGE 21 ---\n--------------------------------------------------------------------------------------------------------------------------------------------------------------------------