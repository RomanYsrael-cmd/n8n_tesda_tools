laced based on standard procedures\n1.5.3. Cleaned repaired unit/gadget in in accordance with\nstandard procedures\n\n2. Resource\nImplications\nThe following resources should be provided:\n2.1. Work area with sufficient lighting and ventilation system\n2.2. ESD free working area/bench\n2.3. Tools and equipment\n2.4. Appropriate mobile/cellular phone units\n2.5. Desktop/ laptop units and appropriate mobile\napplication/add-ons software\n2.6. Work Instructions Assessment rating sheet\n2.7. Applicable forms for specific tasks\n\n3. Methods of\nAssessment\nCompetency may be assessed through:\n3.1. Demonstration with oral questioning\n3.2. Written test\n3.3. Portfolio with interview\n\n4. Context for\nAssessment\n4.1. Competency may be assessed in actual workplace or at\nthe designated TESDA Accredited Assessment Center.\n\n--- PDF PAGE 81 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Mobile Phones & Handheld Gadgets Servicing NC III (ELCMPS321) Promulgated February 9, 2021 77\n\nUNIT TITLE\n: PERFORM FUNCTIONALITY TESTING AND DOCUMENTATION\nUNIT CODE\n:"
