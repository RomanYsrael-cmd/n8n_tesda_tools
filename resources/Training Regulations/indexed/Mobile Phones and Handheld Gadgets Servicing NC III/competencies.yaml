        "evidence_guide": {
          "source_text": "1. Critical aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1. Assessed customer’s concern \n1.1.1. Determined pre-history trouble of the unit/gadget \naccording to the customer’s concern \n1.1.2. Advised/Informed customers regarding the status \nand serviceability of the unit \n1.2. Checked the condition of the unit/ gadget  \n1.2.1. Determined task requirements according to job \nspecifications \n1.2.2. Performed visual checking based on established \nprocedures \n1.3. Determined the hardware status of the unit/gadget  \n1.3.1. Used personal protective equipment (PPE) in \naccordance with Occupational Health and Safety \npractices \n1.3.2. Checked actual troubled/ damaged part using \ndiagnostic tools to identify the problem \n1.4. Determined the software status of the unit/gadget  \n1.4.1. Installed specific driver, if necessary, based on \nunit/gadget model and brand \n1.4.2. Verified unit/gadget status based on the appropriate \nsoftware tools “READ” information results/logs \n1.4.3. Performed firmware backup to identify the \nappropriate firmware versions as per standard \nprocedure \n1.4.4. Checked actual troubled/damaged part using 3rd  \nparty software diagnostic tools to identify the \nproblem \n2. Resource \nImplications \nThe following resources should be provided: \n2.1. Work area with sufficient lighting and ventilation system  \n2.2. Tools, equipment and test instruments  \n2.3. ESD free working area/bench  \n2.4. Appropriate handheld gadgets \n2.5. Service manuals/schematics  \n2.6. Desktop units / laptop and appropriate application software \n2.7. Complete handheld gadgets spare parts and accessories \n3. Methods of \nAssessment \nCompetency may be assessed through: \n3.1. Demonstration with oral questioning \n3.2. Written test \n3.3. Portfolio with interview \n \n4. Context for \nAssessment \n4.1. Competency may be assessed in actual workplace or at \nthe designated TESDA Accredited Assessment Center.",
