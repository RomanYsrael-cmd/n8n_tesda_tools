        "evidence_guide": {
          "source_text": "1. Critical aspects of\nCompetency\n\nAssessment requires evidence that the\ncandidate:\n1.1. Identify OSH work practices issues relevant to\nwork requirements\n1.2. Identify gaps in work practices related to\nrelevant OSH work standards\n1.3. Agree upon OSH Indicators based on gathered\ninformation to measure effectiveness of\nworkplace OSH policies and procedures\n1.4. Receive OSH work instructions in accordance\nwith workplace policies and procedures\n1.5. Compare Observed OSH practices with against\napproved OSH work instructions\n1.6. Assess findings regarding effectiveness based\non OSH work standards\n2. Resource Implications\nThe following resources should be provided:\n2.1 Facilities, materials, tools and equipment\nnecessary for the activity\n3. Methods of Assessment Competency in this unit may be assessed\nthrough:\n3.1 Observation/Demonstration with oral\nquestioning\n3.2 Third party report\n3.3 Written exam\n\n4. Context for Assessment\n4.1 Competency may be assessed in the work\nplace or in a simulated work place setting\n\n--- PDF PAGE 32 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Mobile Phones & Handheld Gadgets Servicing NC III (ELCMPS321) Promulgated February 9, 2021 28\n\nUNIT OF COMPETENCY\n: EVALUATE ENVIRONMENTAL WORK PRACTICES\nUNIT CODE\n:"
        },
        "source_text": "400311325\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes required to\ninterpret Occupational Safety and Health practices, set OSH\nwork targets, and evaluate effectiveness of Occupational\nSafety and Health work instructions\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Interpret\nOccupational\nSafety and\nHealth\npractices\n1.1 OSH work practices\nissues are identified\nrelevant to work\nrequirements\n1.2 OSH work standards and\nprocedures are determined\nbased on applicability to\nnature of work\n1.3 Gaps in work practices are\nidentified related to relevant\nOSH work standards\n\n1.1. OSH work practices\nissues\n1.2. OSH work standards\n1.3. General OSH\nprinciples and\nlegislations\n1.4. Company/ workplace\npolicies/ guidelines\n1.5. Standards and safety\nrequirements of work\nprocess and\nprocedures\n1.1. Communication\nskills\n1.2. Interpersonal\nskills\n1.3. Critical thinking\nskills\n1.4. Observation\nskills\n2. Set OSH work\ntargets\n2.1 Relevant work information\nare gathered necessary to\ndetermine OSH work\ntargets\n2.2 OSH Indicators based on\ngathered information are\nagreed upon to measure\neffectiveness of workplace\nOSH policies and\nprocedures\n2.3 Agreed OSH indicators are\nendorsed for approval from\nappropriate personnel\n2.4 OSH work instructions\nare received in accordance\nwith workplace policies and\nprocedures*\n2.1. OSH work targets\n2.2. OSH Indicators\n2.3. OSH work\ninstructions\n2.4. Safety and health\nrequirements of tasks\n2.5. Workplace guidelines\non providing feedback\non OSH and security\nconcerns\n2.6. OSH regulations\nHazard control\nprocedures\n2.7. OSH trainings\nrelevant to work\n2.1. Communication\nskills\n2.2. Collaborating\nskills\n2.3. Critical thinking\nskills\n2.4. Observation\nskills\n3. Evaluate\neffectiveness\nof\nOccupational\nSafety and\nHealth work\ninstructions\n3.1 OSH Practices are\nobserved based on\nworkplace standards\n3.2 Observed OSH practices\nare measured against\napproved OSH metrics\n3.3 Findings regarding\neffectiveness are assessed\nand gaps identified are\nimplemented based on\nOSH work standards\n3.1. OSH Practices\n3.2. OSH metrics\n3.3. OSH Evaluation\nTechniques\n3.4. OSH work standards\n3.1. Critical thinking\nskills\n3.2. Evaluating skills\n\n--- PDF PAGE 30 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Mobile Phones & Handheld Gadgets Servicing NC III (ELCMPS321) Promulgated February 9, 2021 26\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. OSH Work\nPractices Issues\nMay include:\n1.1\nWorkers’ experience/observance on presence of work\nhazards\n1.2\nUnsafe/unhealthy administrative arrangements\n(prolonged work hours, no break-time, constant overtime,\nscheduling of tasks)\n1.3\nReasons for compliance/non-compliance to use of PPEs\nor other OSH procedures/policies/ guidelines\n2. OSH Indicators\nMay include:\n2.1\nIncreased of incidents of accidents, injuries\n2.2\nIncreased occurrence of sickness or health\ncomplaints/symptoms\n2.3\nCommon complaints of workers’ related to OSH\n2.4\nHigh absenteeism for work-related reasons\n3. OSH Work\nInstructions\nMay include:\n3.1\nPreventive and control measures, and targets\n3.2\nEliminate the hazard (i.e., get rid of the dangerous\nmachine\n3.3\nIsolate the hazard (i.e. keep the machine in a closed room\nand operate it remotely; barricade an unsafe area off)\n3.4\nSubstitute the hazard with a safer alternative (i.e., replace\nthe machine with a safer one)\n3.5\nUse administrative controls to reduce the risk (i.e. give\ntrainings on how to use equipment safely; OSH-related\ntopics, issue warning signages, rotation/shifting work\nschedule)\n3.6\nUse engineering controls to reduce the risk (i.e. use safety\nguards to machine)\n3.7\nUse personal protective equipment\n3.8\nSafety, Health and Work Environment Evaluation\n3.9\nPeriodic and/or special medical examinations of workers\n4. OSH metrics\nMay include:\n4.1\nStatistics on incidence of accidence and injuries\n4.2\nMorbidity (Type and Number of Sickness)\n4.3\nMortality (Cause and Number of Deaths)\n4.4\nAccident Rate\n\n--- PDF PAGE 31 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Mobile Phones & Handheld Gadgets Servicing NC III (ELCMPS321) Promulgated February 9, 2021 27\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\n\nAssessment requires evidence that the\ncandidate:\n1.1. Identify OSH work practices issues relevant to\nwork requirements\n1.2. Identify gaps in work practices related to\nrelevant OSH work standards\n1.3. Agree upon OSH Indicators based on gathered\ninformation to measure effectiveness of\nworkplace OSH policies and procedures\n1.4. Receive OSH work instructions in accordance\nwith workplace policies and procedures\n1.5. Compare Observed OSH practices with against\napproved OSH work instructions\n1.6. Assess findings regarding effectiveness based\non OSH work standards\n2. Resource Implications\nThe following resources should be provided:\n2.1 Facilities, materials, tools and equipment\nnecessary for the activity\n3. Methods of Assessment Competency in this unit may be assessed\nthrough:\n3.1 Observation/Demonstration with oral\nquestioning\n3.2 Third party report\n3.3 Written exam\n\n4. Context for Assessment\n4.1 Competency may be assessed in the work\nplace or in a simulated work place setting\n\n--- PDF PAGE 32 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Mobile Phones & Handheld Gadgets Servicing NC III (ELCMPS321) Promulgated February 9, 2021 28\n\nUNIT OF COMPETENCY\n: EVALUATE ENVIRONMENTAL WORK PRACTICES\nUNIT CODE\n:"
