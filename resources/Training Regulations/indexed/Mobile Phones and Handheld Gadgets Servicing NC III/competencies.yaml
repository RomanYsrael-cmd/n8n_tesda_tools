        "evidence_guide": {
          "source_text": "1. Critical aspects\nof competency\nAssessment requires evidence that the candidate :\n1.1. Demonstrated basic entrepreneurial skills\n1.2. Demonstrated ability to conceptualize and plan a\nmicro/small enterprise\n1.3. Demonstrated ability to manage/operate a micro/small-\nscale business\n2. Resource\nImplications\nThe following resources should be provided:\n\n2.1. Simulated or actual workplace\n2.2. Tools, materials and supplies needed to demonstrate the\nrequired tasks\n2.3. References and manuals\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through :\n3.1. Written examination\n3.2. Demonstration/observation with oral questioning\n3.3. Portfolio assessment with interview\n3.4. Case problems\n4. Context of\nAssessment\n4.1. Competency may be assessed in workplace or in a\nsimulated workplace setting\n4.2. Assessment shall be observed while tasks are being\nundertaken whether individually or in-group\n\n--- PDF PAGE 37 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Mobile Phones & Handheld Gadgets Servicing NC III (ELCMPS321) Promulgated February 9, 2021 33\n\nCOMMON COMPETENCIES\n\nUNIT TITLE\n: USE HAND TOOLS\nUNIT CODE\n:"
        },
        "source_text": "400311327\n UNIT DESCRIPTOR\n:\nThis unit covers the outcomes required to build, operate and\ngrow a micro/small-scale enterprise.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Develop and\nmaintain\nmicro-small-\nmedium\nenterprise\n(MSMEs)\nskills in the\norganization\n1.1 Appropriate business\nstrategies are determined and\nset for the enterprise based on\ncurrent and emerging business\nenvironment.\n1.2 Business operations are\nmonitored and controlled\nfollowing established\nprocedures.\n1.3 Quality assurance measures are\nimplemented consistently.\n1.4 Good relations are maintained\nwith staff/workers.\n1.5 Policies and procedures on\noccupational safety and health\nand environmental concerns are\nconstantly observed.\n1.1 Business\nmodels and\nstrategies\n1.2 Types and\ncategories of\nbusinesses\n1.3 Business\noperation\n1.4 Basic\nBookkeeping\n1.5 Business\ninternal controls\n1.6 Basic quality\ncontrol and\nassurance\nconcepts\n1.7 Government\nand regulatory\nprocesses\n1.1 Basic\nbookkeeping/\naccounting\nskills\n1.2 Communication\nskills\n1.3 Building\nrelations with\ncustomer and\nemployees\n1.4 Building\ncompetitive\nadvantage of\nthe enterprise\n2. Establish and\nMaintain\nclient-\nbase/market\n2.1 Good customer relations are\nmaintained\n2.2 New customers and markets are\nidentified, explored and reached\nout to.\n2.3 Promotions/Incentives are\noffered to loyal customers\n2.4 Additional products and services\nare evaluated and tried where\nfeasible.\n2.5 Promotional/advertising\ninitiatives are carried out\nwhere necessary and feasible.\n2.1 Public relations\nconcepts\n2.2 Basic product\npromotion\nstrategies\n2.3 Basic market\nand feasibility\nstudies\n2.4 Basic business\nethics\n2.1 Building\ncustomer\nrelations\n2.2 Individual\nmarketing skills\n2.3 Using basic\nadvertising\n(posters/\ntarpaulins,\nflyers, social\nmedia, etc.)\n3. Apply\nbudgeting\nand financial\nmanagement\nskills\n3.1 Enterprise is built up and\nsustained through judicious\ncontrol of cash flows.\n3.2 Profitability of enterprise is\nensured though appropriate\ninternal controls.\n3.3 Unnecessary or lower-priority\nexpenses and purchases are\navoided.\n3.1 Cash flow\nmanagement\n3.1 Basic financial\nmanagement\n3.2 Basic financial\naccounting\n3.3 Business\ninternal controls\n\n3.1 Setting business\npriorities and\nstrategies\n3.2 Interpreting\nbasic financial\nstatements\n3.3 Preparing\nbusiness plans\n\n--- PDF PAGE 36 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Mobile Phones & Handheld Gadgets Servicing NC III (ELCMPS321) Promulgated February 9, 2021 32\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Business\nstrategies\nMay include:\n1.1. Developing/Maintaining niche market\n1.2. Use of organic/healthy ingredients\n1.3. Environment-friendly and sustainable practices\n1.4. Offering both affordable and high-quality products and\nservices\n1.5. Promotion and marketing strategies (e. g., on-line\nmarketing)\n2. Business\noperations\nMay include:\n2.1 Purchasing\n2.2 Accounting/Administrative work\n2.3 Production/Operations/Sales\n3. Internal controls\nMay include:\n3.1 Accounting systems\n3.2 Financial statements/reports\n3.3 Cash management\n4. Promotional/\nAdvertising\ninitiatives\nMay include:\n4.1\nUse of tarpaulins, brochures, and/or flyers\n4.2\n Sales, discounts and easy payment terms\n4.3\nUse of social media/Internet\n4.4\n“Service with a smile”\n4.5\nExtra attention to regular customers\n\nEVIDENCE GUIDE\n\n1. Critical aspects\nof competency\nAssessment requires evidence that the candidate :\n1.1. Demonstrated basic entrepreneurial skills\n1.2. Demonstrated ability to conceptualize and plan a\nmicro/small enterprise\n1.3. Demonstrated ability to manage/operate a micro/small-\nscale business\n2. Resource\nImplications\nThe following resources should be provided:\n\n2.1. Simulated or actual workplace\n2.2. Tools, materials and supplies needed to demonstrate the\nrequired tasks\n2.3. References and manuals\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through :\n3.1. Written examination\n3.2. Demonstration/observation with oral questioning\n3.3. Portfolio assessment with interview\n3.4. Case problems\n4. Context of\nAssessment\n4.1. Competency may be assessed in workplace or in a\nsimulated workplace setting\n4.2. Assessment shall be observed while tasks are being\nundertaken whether individually or in-group\n\n--- PDF PAGE 37 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Mobile Phones & Handheld Gadgets Servicing NC III (ELCMPS321) Promulgated February 9, 2021 33\n\nCOMMON COMPETENCIES\n\nUNIT TITLE\n: USE HAND TOOLS\nUNIT CODE\n:"
