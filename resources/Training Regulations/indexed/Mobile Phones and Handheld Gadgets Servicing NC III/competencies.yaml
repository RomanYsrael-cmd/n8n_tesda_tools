ion\n1.4. Recognizing\ndiverse groups in\nthe workplace\nand community\nas defined by\ndivergent culture,\nreligion, traditions\nand practices\n2. Work\neffectively in\nan\nenvironment\nthat\nacknowledges\nand values\ncultural\ndiversity\n2.1 Knowledge, skills and\nexperiences of others\nare recognized and\ndocumented in relation to\nteam objectives.\n2.2 Fellow workers are\nencouraged to utilize and\nshare their specific\nqualities, skills or\nbackgrounds with other\nteam members and\nclients to enhance work\noutcomes.\n2.3 Relations with customers\nand clients are\nmaintained to show that\ndiversity is valued by the\nbusiness.\n2.1 Value of diversity in\nthe economy and\nsociety in terms of\nWorkforce\ndevelopment\n2.2 Importance of\ninclusiveness in a\ndiverse environment\n2.3 Shared vision and\nunderstanding of\nand commitment to\nteam, departmental,\nand organizational\ngoals and objectives\n2.4 Strategies for\ncustomer service\nexcellence\n2.1 Demonstrating\ncross-cultural\ncommunication\nskills and active\nlistening\n2.2 Recognizing\ndiverse groups in\nthe workplace and\ncommunity as\ndefined by\ndivergent culture,\nreligion, traditions\nand practices\n2.3 Demonstrating\ncollaboration skills\n2.4 Exhibiting\ncustomer service\nexcellence\n\n--- PDF PAGE 19 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Mobile Phones & Handheld Gadgets Servicing NC III (ELCMPS321) Promulgated February 9, 2021 15\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n3. Identify\ncommon\nissues in a\nmulticultural\nand diverse\nenvironment\n3.1 Diversity-related\nconflicts within the\nworkplace are effectively\naddressed and resolved.\n3.2 Discriminatory behaviors\ntowards\ncustomers/stakeholders\nare minimized and\naddressed accordingly.\n3.3 Change managemen