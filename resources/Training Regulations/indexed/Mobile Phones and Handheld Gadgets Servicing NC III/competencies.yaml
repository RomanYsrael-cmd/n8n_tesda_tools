        "evidence_guide": {
          "source_text": "1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1. Organize workplace, equipment/ instrument, tools and\nmaterials for servicing\n1.1.1. Set/Prepared workplace in line with the\nservice/repair center requirements\n1.1.2. Used necessary equipment/ instrument, and tools for\nservicing of mobile phone/hand held gadget units are\nprepared in line with job requirements\n1.1.3. Prepared materials and consumables are prepared\nin line with job requirements\n1.1.4. Planned task to ensure OH& S guidelines and\nprocedures are followed\n1.1.5. Checked internet service requirements for stability\nand readiness\n1.2. Set-up ESD and other safety procedures\n1.2.1. Followed electro-static discharge (ESD) procedure in\naccordance with current industry standards\n1.2.2. Prepared personal protective equipment in\naccordance with Occupational Health and Safety\npractices\n1.3. Review customers related information\n1.3.1. Checked job order forms for customers concern and\nother related issues\n\n2. Resource\nImplications\nThe following resources should be provided:\n2.1. Work area with sufficient lighting and ventilation system\n2.2. Tools, equipment and test instruments\n2.3. ESD free working area/bench\n2.4. Mobile/cellular phone units and handheld gadgets\n2.5. Service manuals/schematics\n2.6. Desktop units / laptop and appropriate application software\n2.7. Complete mobile/cellular phone spare parts and\naccessories\n\n3. Methods of\nAssessment\nCompetency may be assessed through:\n3.1. Demonstration with oral questioning\n3.2. Written test\n3.3. Portfolio with interview\n\n4. Context for\nAssessment\n4.1. Competency may be assessed in actual workplace or at\nthe designated TESDA Accredited Assessment Center.\n\n--- PDF PAGE 69 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Mobile Phones & Handheld Gadgets Servicing NC III (ELCMPS321) Promulgated February 9, 2021 65\n\nUNIT TITLE : DIAGNOSE AND IDENTIFY HARDWARE AND SOFTWARE\nRELATED PROBLEMS\n\nUNIT CODE\n:"
        },
        "source_text": "ELC742301\n\nUNIT DESCRIPTOR :\nThis unit covers the knowledge, skills and attitudes needed in\npreparing workplace for servicing of mobile phone units and\nhandheld gadgets. This includes competencies in organizing\nworkplace,\nequipment/instrument,\ntools\nand\nmaterials\nfor\nservicing, setting-up electro-static discharge (ESD) and other\nsafety procedures, and reviewing customers related information.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED KNOWLEDGE\nREQUIRED SKILLS\n1. Organize\nworkplace,\nequipment/\ninstrument,\ntools and\nmaterials for\nservicing\n1.1. Workplace is set/\nprepared in line with the\nservice/repair center\nrequirements *\n1.2. Necessary equipment/\ninstrument, and tools\nused for servicing of\nmobile phone unit/\nhandheld gadget are\nprepared in line with job\nrequirements *\n1.3. Materials and\nconsumables are\nprepared in line with job\nrequirements *\n1.4. Hard/Soft copies of\nservice manuals and\nservice information\nrequired are obtained\nprior to servicing activity.\n1.5. Task is planned to\nensure OH& S guidelines\nand procedures are\nfollowed*\n1.6. Internet service\nrequirements are\nchecked for stability and\nreadiness *\n1.7. Laws, ordinances and\nregulations related to\nmobile devices servicing\nare familiarized in line\nwith service/repair\ncenter’s administrative\nand business guidelines\nand procedures.\n1.1. Service center rules and\nrequirements\no Service Flowchart\no Service Forms\no Repair/Service Fees\no Type of services to be\nrendered\n1.2. Knowledge in Internet\nbrowsing, downloading\nand chatting/ online\nforums\n1.3. Knowledge in technical\naspects of mobile phone/\nhandheld gadget servicing\n1.4. Safety\no Work Safety\nrequirements and\neconomy of materials\nwith durability\no Knowledge in 5S\napplication and\nobservation of required\nprocedure\n1.5. Materials, tools &\ninstruments for mobile\nphone unit and handheld\ngadget servicing\no Identification of hand\ntools\no Proper care and use of\ntools\no Identification of test and\nmeasuring instruments\n1.6. Laws and regulations\no RA 9292, Sec.5\no NTC memorandum\n1.1. Reading skills\nrequired to\ninterpret work\ninstructions\n1.2. Communication\nskills\n1.3. Computer\noperation skills\n1.4. Internet\nbrowsing and\nforum chatting\n1.5. Identifying tools,\ninstruments and\nmaterials for\nservicing\n\n--- PDF PAGE 65 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Mobile Phones & Handheld Gadgets Servicing NC III (ELCMPS321) Promulgated February 9, 2021 61\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED KNOWLEDGE\nREQUIRED SKILLS\nCirculars (# 07-08-2004)\n- Certification\n- Permits\n- TESDA Certification\no Local Ordinance\n- Business permit\no DTI Regulations\n- Warranty period\n- Certification\no E-waste management\n(DENR AO 2013-22)\n2. Set-up ESD\nand other\nsafety\nprocedures\n\n2.1. Electro-static discharge\n(ESD) procedure is\nfollowed in accordance\nwith current industry\nstandards. *\n2.2. Personal protective\nequipment is prepared\nin accordance with\nOccupational Health\nand Safety practices *\n2.3. Faulty material or\ncomponents related to\nwork are identified and\nisolated\n2.4. Unsafe or faulty tools\nare identified and\nmarked for repair\naccording to safety\nprocedure\n\n2.1. Electro-static discharge\nset-up\n2.2. Usage of Anti- Static\npackage\n2.3. Usage of personal\nprotective equipment\n2.4. Knowledge of\noccupational health and\nsafety practices\n2.5. Proper identification of\nfaulty tools, components\nor materials\n2.6. Safety\no Work Safety\nrequirements and\neconomy of materials\nwith durability\no Knowledge in 5S\napplication and\nobservation of required\nprocedure\n2.1. Reading skills\nrequired to\ninterpret work\ninstructions\n2.2. Communication\nskills\n2.3. Computer\noperation skills\n2.4. Internet\nbrowsing and\nforum chatting\n2.5. Identifying tools,\ninstruments and\nmaterials for\nservicing\n2.6. Following safety\nrequirements\n3. Review\ncustomers\nrelated\ninformation\n3.1. Work instructions are\nobtained and work\npreparation is carried\nout in accordance with\njob requirements\n3.2. Job order forms are\nchecked for customers\nconcern and other\nrelated issues *\n3.3. Customer related\ninquiries are resolved in\naccordance with job\nrequirement\n3.4. Relevant sources of\ninformation are identified\nin accordance with\nworkplace/ client\nrequirements\n3.1. Rules of effective\nbusiness communication\nin customer service\n3.2. How to deal with\ncustomer satisfaction\n3.3. Methods of\ncommunication\n3.4. Relevant sources of\ninformation\n\n3.1. Reading skills\nrequired to\ninterpret work\ninstructions\n3.2. Communication\nskills\n3.3. Computer\noperation skills\n3.4. Internet\nbrowsing and\nforum chatting\n3.5. Identifying tools,\ninstruments and\nmaterials for\nservicing\n\n--- PDF PAGE 66 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Mobile Phones & Handheld Gadgets Servicing NC III (ELCMPS321) Promulgated February 9, 2021 62\n\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Tools and\ninstruments\nMay include but not limited to:\nTools:\n1.1. Soldering iron\n1.2. Desoldering tools\n1.3. Tweezer\n1.4. Precision screwdrivers (assorted)\n1.5. Set of torx/star bit\n1.6. Multi-testers (analog/digital)\n1.7. Pliers (assorted)\n1.8. Blade cutter\nEquipment/Instruments:\n1.9. Rework station (Hot air) with soldering tool\n1.10. Oscilloscope\n1.11. Power Supply - variable\n1.12. LCD refurbishing tools\n1.13. ESD-free work bench with mirror\n1.14. High-grade magnifying glass with lamp\n1.15. Microscope\n1.16. Desktop computer/ laptop\n1.17. GSM Flasher tools\n1.18. Thermal camera\n1.19. Smoke absorber/fume extractor\n1.20. Ultrasonic cleaner\n1.21. CNC for mobile phone\n\n2. Materials and\nconsumables\nMay include but not limited to:\n2.1.\nSoldering lead\n2.2.\nCleaning agent\n2.3.\nCleaning brush\n2.4.\nMagnetic wires\n2.5.\nFlux\n2.6.\nBoard for rework\n2.7.\nSRT (plastic opener)\n2.8.\nReballing plate\n2.9.\nSuction cap\n2.10. USB cable\n2.11. Card reader\n2.12. UV lights/curing mask paste\n2.13. Desoldering wick\n2.14. Anti-static mat\n2.15. Adhesive paste\n2.16. Handheld gadgets OS software\n\n3. Service manuals\nMay include but not limited to:\n3.1. Service manual/schematic diagram/parts list\n3.2. Operating instructions/User’s/Owner’s manual\n3.3. Repair handbooks for mobile/cellular phones\n\n--- PDF PAGE 67 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Mobile Phones & Handheld Gadgets Servicing NC III (ELCMPS321) Promulgated February 9, 2021 63\n\nVARIABLE\nRANGE\n4. Service Information\nMay include but not limited to:\n4.1. Job Report Sheets\n4.2. Job Order forms\n4.3. Bill of materials\n4.4. Customer index\n4.5. Service flowchart\n4.6. Stock and inventory record\n4.7. Requisition slips (for acquisition of parts)\n4.8. Supplier Index\n5. Personal protective\nequipment\nMay include but not limited to:\n5.1. Working clothes/Apron\n5.2. Face/Dust Mask\n5.3. Goggles\n5.4. Anti-static mat\n5.5. Anti-static gloves\n5.6. anti-static wrist strap\n6. OHS practices\nMay include but not limited to:\n6.1. Use of proper tools and equipment\n6.2. Observe workplace environment and safety\n6.3. Adherence to safety requirements in handling the unit\n6.4. Use of protective device/shields\n6.5. Proper ESD practices\n\n--- PDF PAGE 68 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Mobile Phones & Handheld Gadgets Servicing NC III (ELCMPS321) Promulgated February 9, 2021 64\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1. Organize workplace, equipment/ instrument, tools and\nmaterials for servicing\n1.1.1. Set/Prepared workplace in line with the\nservice/repair center requirements\n1.1.2. Used necessary equipment/ instrument, and tools for\nservicing of mobile phone/hand held gadget units are\nprepared in line with job requirements\n1.1.3. Prepared materials and consumables are prepared\nin line with job requirements\n1.1.4. Planned task to ensure OH& S guidelines and\nprocedures are followed\n1.1.5. Checked internet service requirements for stability\nand readiness\n1.2. Set-up ESD and other safety procedures\n1.2.1. Followed electro-static discharge (ESD) procedure in\naccordance with current industry standards\n1.2.2. Prepared personal protective equipment in\naccordance with Occupational Health and Safety\npractices\n1.3. Review customers related information\n1.3.1. Checked job order forms for customers concern and\nother related issues\n\n2. Resource\nImplications\nThe following resources should be provided:\n2.1. Work area with sufficient lighting and ventilation system\n2.2. Tools, equipment and test instruments\n2.3. ESD free working area/bench\n2.4. Mobile/cellular phone units and handheld gadgets\n2.5. Service manuals/schematics\n2.6. Desktop units / laptop and appropriate application software\n2.7. Complete mobile/cellular phone spare parts and\naccessories\n\n3. Methods of\nAssessment\nCompetency may be assessed through:\n3.1. Demonstration with oral questioning\n3.2. Written test\n3.3. Portfolio with interview\n\n4. Context for\nAssessment\n4.1. Competency may be assessed in actual workplace or at\nthe designated TESDA Accredited Assessment Center.\n\n--- PDF PAGE 69 ---\n---------------------------------------------