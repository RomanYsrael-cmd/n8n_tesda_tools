        "source_text": "--- PDF PAGE 39 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- \nTR – Mobile Phones & Handheld Gadgets Servicing NC III       (ELCMPS321)       Promulgated February 9, 2021      35  \n \nUNIT TITLE  \n     : \nPERFORM MENSURATION AND CALCULATION \nUNIT CODE \n:    ELC311201  \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge, skills and attitudes and values \nneeded identify, care, handle and use measuring instruments \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized Bold terms are elaborated \nin the Range of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Select \nmeasuring \ninstruments \n1.1. Object or component to be \nmeasured is identified, \nclassified and interpreted to \nthe appropriate regular \ngeometric shape \n1.2. Measuring tools are selected \nin line with job requirements \n1.3. Correct specifications are \nobtained from relevant \nsource \n1.4. Appropriate measuring \ninstrument is selected to \nachieve required outcome \n1.5. Alternative measuring tools \nare used without sacrificing \ncost and quality of work \n1.1. Category of \nmeasuring \ninstruments \n1.2. Types and uses of \nmeasuring \ninstruments \n1.3. Shapes and \nDimensions \n1.4. Formulas for volume, \nareas, perimeters of \nplane and geometric \nfigures \n1.1. Identifying \nand selecting \nmeasuring \ninstruments \n1.2. Visualizing \nobjects and \nshapes \n2. Carry out \nmeasurements \nand calculation \n2.1. Accurate measurements \nand calculations  are \nobtained for job \n2.2. Calculation needed to \ncomplete work tasks are \nperformed using the four \nbasic process of addition (+), \nsubtraction (-), multiplication \n(x), and division (/) \n2.3. Calculation involving \nfractions, percentages and \nmixed numbers are used to \ncomplete workplace tasks. \n2.4. Numerical computation is \nself-checked and corrected \nfor accuracy \n2.5. Instruments are read to the \nlimit of accuracy of the tool. \n2.6. Systems of measurement \nidentified and converted \naccording to job \nrequirements/ISO \n2.7. Work pieces are measured \naccording to job \nrequirements \n2.1. Calculation & \nmeasurement \n2.2. Four fundamental \noperation \n2.3. Linear measurement \n2.4. Dimensions \n2.5. Unit conversion \n2.6. Ratio and proportion \n \n2.1. Performing \ncalculation by \naddition, \nsubtraction, \nmultiplication \nand division;  \n2.2. Interpreting \nformulas for \nvolume, \nareas, \nperimeters of \nplane and \ngeometric \nfigures \n2.3. Handling of \nmeasuring \ninstruments \n3. Maintain \nmeasuring \ninstruments \n3.1. Measuring instruments are \nnot dropped to avoid \ndamage \n3.2. Measuring instruments are \ncleaned before and after \nusing. \n3.1. Types of measuring \ninstruments and their \nuses \n3.2. Safe handling \nprocedures in using \nmeasuring \n3.1. Handling and \nmaintaining  \nmeasuring \ninstruments\n\n--- PDF PAGE 40 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- \nTR – Mobile Phones & Handheld Gadgets Servicing NC III       (ELCMPS321)       Promulgated February 9, 2021      36  \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized Bold terms are elaborated \nin the Range of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n3.3. Proper storage of \ninstruments undertaken \naccording to manufacturer’s \nspecifications and standard \noperating procedures. \ninstruments \n3.3. Four fundamental \noperation of \nmathematics \n3.4. Formula for volume, \narea, perimeter and \nother geometric \nfigures\n\n--- PDF PAGE 41 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- \nTR – Mobile Phones & Handheld Gadgets Servicing NC III       (ELCMPS321)       Promulgated February 9, 2021      37  \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Geometric Shape \n \n \n \n \n \n Including but I not limited to: \n1.1 Round \n1.2 Square \n1.3 Rectangular \n1.4 Triangle \n1.5 Sphere \n1.6 Conical \n \n2.  Measuring \ninstruments \nIncluding but not limited to: \n2.1 Micrometer (In-out, \ndepth) \n2.2 Vernier caliper (out, \ninside) \n2.3 Dial gauge with mag, \nstd. \n2.4 Straight edge \n2.5 Thickness gauge \n2.6 Torque gauge \n2.7 Small hole gauge \n2.8 Telescopic gauge \n \n \n2.9 Try-square \n2.10 Protractor \n2.11 Combination gauge \n2.12 Steel rule \n2.13 Voltmeter \n2.14 Ammeter \n2.15 Mega-ohmmeter \n2.16 KWH meter \n2.17 Gauges \n2.18 Thermometers \n \n3.  Measurements and \ncalculations \n \n3.1 Linear \n3.2 Volume \n3.3 Area \n3.4 Wattage \n3.5 Voltage \n3.6 Resistance \n3.7 Amperage \n3.8 Frequency \n3.9 Impedance \n3.10 Conductance \n3.11 Capacitance \n3.12 Displacement \n3.13 Inside diameter \n3.14 Circumference \n3.15 Length \n3.16 Thickness \n3.17 Outside diameter \n3.18 Taper \n3.19 Out of roundness \n3.20 Oil clearance \n3.21 End play/thrust \nclearance\n\n--- PDF PAGE 42 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- \nTR – Mobile Phones & Handheld Gadgets Servicing NC III       (ELCMPS321)       Promulgated February 9, 2021      38  \n \n \n \nEVIDENCE GUIDE \n \n1. Critical aspect of \ncompetency \nAssessment must show that the candidate: \n1.1. selected proper measuring instruments \naccording to tasks \n1.2. carried out measurement and calculations \n1.3. maintained and stores instruments  \n \n2. Resource implication \nThe following resources should be provided: \n2.1. Place of assessment \n2.2. Measuring instruments   \n2.3. Straight edge \n2.4. Torque gauge \n2.5. Try square \n2.6. Protractor \n2.7. Combination gauge \n2.8. Steel rule \n \n3. Method of assessment \nCompetency should be assessed through: \n3.1 Actual demonstration \n3.2 Direct observation \n3.3 Written test/questioning related to required \nknowledge \n \n4. Context of Assessment \nAssessment may be conducted in the workplace or in a \nsimulated environment\n",
