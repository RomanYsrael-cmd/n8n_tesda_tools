        "evidence_guide": {
          "source_text": "1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1. Check the functionality of the unit/ gadget\n1.1.1. Verified full functionality of the repaired\nunit/gadget in conformity with the customer’s\nconcern\n1.1.2. Verified unit’s/gadget’s functionality based on\ndefault settings\n1.1.3. Tested accessories in accordance with\nmanufacturer’s specification\n1.2. Turn over repaired unit/gadget for customer’s approval\n1.2.1. Endorsed unit/gadget to customer in accordance\nwith service center procedures and guidelines\n1.3. Document/ Record service information Document/\nRecord service information\n1.3.1. Complied with service completion procedures\nand documentations with in accordance with\nservice center guidelines\n\n2. Resource Implications The following resources should be provided:\n2.1. Work area with sufficient lighting and ventilation system\n2.2. ESD free working area/bench\n2.3. Tools and equipment\n2.4. Appropriate handheld gadgets\n2.5. Desktop/ laptop units and appropriate mobile\napplication/add-ons software\n2.6. Work Instructions Assessment rating sheet\n2.7. Applicable forms for specific tasks\n\n3. Methods of\nAssessment\nCompetency may be assessed through:\n3.1. Demonstration with oral questioning\n3.2. Written test\n3.3. Portfolio with interview\n\n4. Context for\nAssessment\n4.1. Competency may be assessed in actual workplace or\nat the designated TESDA Accredited Assessment\nCenter.\n\n--- PDF PAGE 86 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Mobile Phones & Handheld Gadgets Servicing NC III (ELCMPS321) Promulgated February 9, 2021 82"
        },
        "source_text": "ELC742304\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes needed in\nperforming functionality testing and documentation. This includes\nchecking the functionality of the mobile phone unit and handheld\ngadget, turning over repaired unit/gadget for customer’s approval\nand documenting/recording service information.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized Bold items are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1. Check the\nfunctionality\nof the unit/\ngadget\n1.1. Full functionality of the\nrepaired unit/gadget is\nverified in conformity with the\ncustomer’s concern *\n1.2. Unit’s/Gadget’s functionality is\nverified based on default\nsettings *\n1.3. Accessories are tested in\naccordance with\nmanufacturer’s specification*\n1.4. Completeness and accuracy\nof documents are checked in\naccordance to service\nrequirements and\nspecifications\n1.1. Mobile phone units\nand handheld\ngadgets’ default\nsettings\n1.2. Security and\naccount features\n1.3. Knowledge in\nInternet/ network\nsettings\no configuration of\nmobile phones and\nhandheld gadgets\n1.4. Knowledge in mobile\nphones and\nhandheld gadgets\noperations\n1.5. Types of\naccessories for\nmobile phones and\nhandheld gadgets\n1.1. Communication\nskills\n1.2. Computer skills\n1.3. Internet browsing\nand forum\nchatting\n1.4. Skills in mobile\nphone operation\n1.5. Mobile internet/\nnetwork\nconfiguration\nskills\n1.6. Product handling\n2. Turn over\nrepaired\nunit/gadget\nfor\ncustomer’s\napproval\n\n2.1. Proper etiquette in handling\ncustomer is observed in\naccordance with workplace\nprocedures\n2.2. Unit/Gadget is endorsed to\ncustomer in accordance with\nservice/repair center\nprocedures and guidelines*\n2.3. Orientation and technical\nassistance is provided to\ncustomer based on\nservice/repair center\nprocedures and guidelines\n2.4. Performance of operation or\nquality of service to ensure\ncustomer satisfaction is\nmonitored.\n2.1. Quality\nimprovement\nprocesses\n2.2. Proper etiquette in\nhandling customer\n2.3. Knowledge in\nmobile phones and\nhandheld gadgets\noperations\n2.4. Service/Repair\ncenter procedures\nand guidelines\n2.1. Communication\nskills\n2.2. Computer skills\n2.3. Internet browsing\nand forum\nchatting\n2.4. Skills in mobile\nphone operation\n2.5. Mobile internet/\nnetwork\nconfiguration\nskills\n3. Document/\nRecord\nservice\ninformation\n3.1. Information on the quality\nand other indicators of service\nperformance is recorded in\naccordance with workplace\nprocedures.\n3.2. Service completion\n3.1. Service\ninformation\n3.2. Fault identification\nand reporting\n3.3. Workplace\nprocedure in\n3.1. Communicatio\nn skills\n3.2. Computer skills\n3.3. Internet\nbrowsing and\nforum chatting\n\n--- PDF PAGE 82 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Mobile Phones & Handheld Gadgets Servicing NC III (ELCMPS321) Promulgated February 9, 2021 78\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized Bold items are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\nprocedures and\ndocumentations are\ncomplied with in accordance\nwith service center\nguidelines.*\n3.3. Deviations from specified\nquality standards causes\nare documented and reported\nin accordance with the\nworkplace’ standards\noperating procedures\ndocumenting\ncompleted work\n3.4. Workplace Quality\nIndicators\n3.4. Skills in mobile\nphone\noperation\n3.5. Mobile internet/\nnetwork\nconfiguration\nskills\n3.6. Documentation\nskills\n\n--- PDF PAGE 83 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Mobile Phones & Handheld Gadgets Servicing NC III (ELCMPS321) Promulgated February 9, 2021 79\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Functionality\nFunctionality checks may include:\n1.1. touch screen/digitizer\n1.2. camera\n1.3. audio\n1.3.1. microphone\n1.3.2. Earpiece\n1.3.3. Speaker/buzzer\n1.4. Wireless device\n1.4.1. Bluetooth\n1.4.2. Wi-Fi\n1.5. Signal\n1.5.1. Outgoing/incoming call and text\n1.5.2. Mobile data\n1.6. Charging and headset port\n1.7. Buttons\n1.8. sensors\n2. Unit/ Gadget\nMay include:\n2.1. Mobile phone units\n2.1.1. Cellular phone\n2.1.2. Smart phone\n2.1.3. Phone-tablet\n2.2. Handheld gadgets\n2.2.1. Tablet\n2.2.2. iPad\n2.2.3. Notepad\n2.2.4. Portable media player\n2.2.5. e-Watch\n2.2.6. other similar gadgets\n3. Accessories\nMay include:\n3.1. Headset/Earphone\n3.2. Memory card\n3.3. SIM card\n3.4. Charger\n3.5. Pen/stylus\n4. Customer\nMay include:\n4.1. Co-worker\n4.2. Supplier\n4.3. Client\n4.4. Organization receiving the product or service\n5. Service Information\nMay include:\n5.1. Job Report Sheets\n5.2. Job Order forms\n5.3. Bill of materials\n5.4. Customer index\n5.5. Service flowchart\n5.6. Stock and inventory record\n5.7. Requisition slips (for acquisition of parts/components)\n\n--- PDF PAGE 84 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Mobile Phones & Handheld Gadgets Servicing NC III (ELCMPS321) Promulgated February 9, 2021 80\n\nVARIABLE\nRANGE\n6. Documentation\nMay include:\n6.1. Organization work procedures\n6.2. Manufacturer’s instruction manual\n6.3. Customer requirements\n6.4. Forms\n7. Quality standards\nQuality standards may relate but not limited to the following:\n7.1. Materials\n7.2. Component parts\n7.3. Service processes\n\n--- PDF PAGE 85 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Mobile Phones & Handheld Gadgets Servicing NC III (ELCMPS321) Promulgated February 9, 2021 81\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1. Check the functionality of the unit/ gadget\n1.1.1. Verified full functionality of the repaired\nunit/gadget in conformity with the customer’s\nconcern\n1.1.2. Verified unit’s/gadget’s functionality based on\ndefault settings\n1.1.3. Tested accessories in accordance with\nmanufacturer’s specification\n1.2. Turn over repaired unit/gadget for customer’s approval\n1.2.1. Endorsed unit/gadget to customer in accordance\nwith service center procedures and guidelines\n1.3. Document/ Record service information Document/\nRecord service information\n1.3.1. Complied with service completion procedures\nand documentations with in accordance with\nservice center guidelines\n\n2. Resource Implications The following resources should be provided:\n2.1. Work area with sufficient lighting and ventilation system\n2.2. ESD free working area/bench\n2.3. Tools and equipment\n2.4. Appropriate handheld gadgets\n2.5. Desktop/ laptop units and appropriate mobile\napplication/add-ons software\n2.6. Work Instructions Assessment rating sheet\n2.7. Applicable forms for specific tasks\n\n3. Methods of\nAssessment\nCompetency may be assessed through:\n3.1. Demonstration with oral questioning\n3.2. Written test\n3.3. Portfolio with interview\n\n4. Context for\nAssessment\n4.1. Competency may be assessed in actual workplace or\nat the designated TESDA Accredited Assessment\nCenter.\n\n--- PDF PAGE 86 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Mobile Phones & Handheld Gadgets Servicing NC III (ELCMPS321) Promulgated February 9, 2021 82"
