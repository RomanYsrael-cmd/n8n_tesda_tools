          "source_text": "REQUIRED KNOWLEDGE \nREQUIRED SKILLS \n1. Disassemble \nunit/gadget \n \n1.1. Personal protective \nequipment is used in \naccordance with \nOccupational Health and \nSafety practices. * \n1.2. Necessary tools and \ninstruments used for \ndisassembly of unit/gadget  \nare prepared in line with job \nrequirements  \n1.3. Accessories are detached \nto the unit/gadget as per \nuser’s guide \n1.4. Disassembly procedures are \nperformed in accordance \nwith OH&S policies and work \ninstructions * \n1.5. Parts and accessories are \nproperly organized in \naccordance with its \nfunctionality and purpose * \n \n1.1. Disassembly \nprocedures as per \nuser’s guide \n1.2. Safety  \no Work Safety \nrequirements and \neconomy of materials \nwith durability \n1.3. Tools and instruments \nused for disassembly \n1.4. Parts and functions of \nmobile phone and \nhandheld gadget parts \nand accessories \n1.5. Mobile phone and \nhandheld gadget parts \nfunctionality \n1.1. Reading skills \n1.2. Communication \nskills \n1.3. Computer skills \n1.4. Skills in \nassembly/ \ndisassembly of \nmobile \nphone/handheld \ngadgets \n1.5. Identifying parts \nand accessories \n1.6. Internet \nbrowsing and \nforum chatting \n \n2. Troubleshoot \nunit/gadget \nhardware \nrelated \nproblem \n \n \n \n2.1. Personal protective \nequipment is used in \naccordance with \nOccupational Health and \nSafety practices. * \n2.2. Electro-static discharge \n(ESD) procedure is followed \nin accordance with current \nindustry standards. * \n2.3. Systematic pre-testing \nprocedure is observed in \naccordance with user’s \nmanual. * \n2.4. System defects/ Fault \nsymptoms are identified in \naccordance with basic \ntroubleshooting \ntechniques. * \n2.1. Knowledge in \nsystematic pre-testing \nprocedures as per \nuser’s manual \n2.2. Knowledge in new/ \nupcoming trends in \nmobile phone units \nand handheld gadgets \n2.3. Types of systems \ndefects/fault \nsymptoms of a \nmobile/cellular phone \nunits and handheld \ngadgets (see ROV) \n2.4. Basic troubleshooting \ntechniques for \nmobile/cellular phones \nand handheld gadgets \n2.1. Reading skills \n2.2. Communication \nskills \n2.3. Computer skills \n2.4. Background in \nbasic \nelectronics skills \nand theory \n2.5. Internet \nbrowsing and \nforum chatting \n2.6. Troubleshooting \ntechniques \n2.7. Interpretation of \nschematic \ndiagrams\n\n--- PDF PAGE 74 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- \nTR – Mobile Phones & Handheld Gadgets Servicing NC III   (ELCMPS321)      Promulgated February 9, 2021        70  \n \n \n       \n \n \n \n \n \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized Bold items are elaborated \nin the Range of Variables \nREQUIRED KNOWLEDGE \nREQUIRED SKILLS \n2.5. Chips and components are \nchecked and isolated using \nspecified testing procedures* \n2.6. Input/output (I/O) \ncomponents are checked \nusing specified testing \nprocedures * \n2.7. Whenever applicable, \nidentified defects and faults \nare explained to the \nresponsible person in \naccordance with service \ncenter guidelines \n2.8. Results of diagnosis and \ntesting are documented and \ncompleted within the \nspecified time.  \n2.9. Customers are advised/ \ninformed regarding the status \nand serviceability of the unit. \n(see ROV) \n2.5. Drawing and \nSchematic Diagram  \no Reading and \ninterpreting electronic \nschematic diagram \nand symbols \n2.6. Safety  \no Work Safety \nrequirements and \neconomy of materials \nwith durability \n2.7. System and \nProcesses \no Computer operation \no Electronic \ncomponents and \ncircuits \no Analysis of troubles \nand isolation \ntechniques \no Types of I/O \ncomponents \n3. Repair unit/ \ngadget \nhardware \nrelated \nproblem \n3.1. Personal protective \nequipment is used in \naccordance with \nOccupational Health and \nSafety practices. * \n3.2. Electro-static discharge \n(ESD) procedure is followed \nin accordance with current \nindustry standards.* \n3.3. Defective parts/ components \nare replaced/ swapped with \noriginal/ compatible parts \naccording to diagnostic \nresults. * \n3.4. Repaired or replaced \nparts/components are \nsoldered/mounted in \naccordance with the current \nindustry standards.* \n3.5. Repair activity is performed \nwithin the required \ntimeframe.* \n3.6. Repaired or replaced \nparts/components are \nchecked for proper mounting \nand tested for its \nfunctionality. * \n3.7. Care and extreme precaution \nin handling the unit/gadget is \n3.1. Usage of personal \nprotective equipment \n3.2. Knowledge of \noccupational health \nand safety practices \n3.3. Knowledge in using \nmulti-tester/VOM and \nother testing \ninstruments \n3.4. Knowledge in \nenvironmental safety \no E-Waste disposal \no Toxic fumes \nmanagement \n3.5. Usage of Anti- Static \npackage \n3.6. Soldering techniques \nand rework station \n(hot air) operation \n3.7. Parts/Components \nmounting procedures \n3.8. Functionality testing \n3.9. Drawing and \nSchematic Diagram  \no Reading and \ninterpreting electronic \nschematic diagram \nand symbols \n3.10. Knowledge in 5S \n3.1. Reading skills \n3.2. Communication \nskills \n3.3. Computer skills \n3.4. Internet \nbrowsing and \nforum chatting \n3.5. Troubleshooting \ntechniques \n3.6. Soldering and \ndesoldering \nskills \n3.7. Parts \nidentification \nand function \n3.8. Interpretation of \ndiagrams\n\n--- PDF PAGE 75 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- \nTR – Mobile Phones & Handheld Gadgets Servicing NC III   (ELCMPS321)      Promulgated February 9, 2021        71  \n \n \n       \n \n \n \n \n \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized Bold items are elaborated \nin the Range of Variables \nREQUIRED KNOWLEDGE \nREQUIRED SKILLS \nobserved as per \nprocedures.* \napplication and \nobservation of \nrequired procedure \n3.11. Materials, tools & \nequipment – their \nfunctions and uses  \no Proper care and use \nof tools \no Proper usage of test \nand measuring \ninstruments \n3.12. System and \nProcesses \no Computer operation \no Electronic \ncomponents and \ncircuits \no Analysis of troubles \nand isolation \ntechniques \no Soldering/ \nDesoldering \ntechniques \no Parts/components \nreplacement \no Reprogramming/ \nFlashing \nmobile/cellular phone \nunit \n4. Repair unit/ \ngadget  \nsoftware \nrelated \nproblem \n \n4.1. Identified unit/gadget \nfirmware is prepared based \non phone and mobile device \nsettings’ hardware \nspecifications * \n4.2. Battery life percentage is \nensured to be 50% higher \nprior to installation of \nunit/gadget firmware and \nother related software * \n4.3. Client is informed for \npossible loss of user data \nduring software * \n4.4. Formatting of user data is \nperformed based on \nunit/gadget factory default \nsettings * \n4.5. Compatible firmware \nversion is installed based on \nunit/gadget model/brand and \nstandard procedures * \n4.6. If necessary, unit/gadget \nbackup and default settings \n4.1. Knowledge in materials \nand tools for the \ndifferent mobile phones \nand handheld gadgets \n4.2. Knowledge in \ncompatibility of drivers \nfor mobile phone and \nhandheld gadgets \n4.3. Knowledge in \ncompatibility of \nfirmware version for \nmobile phones and \nhandheld gadgets  \n4.4. User data formatting  \nprocedure \n4.5. Knowledge in mobile \ndevice and handheld \ngadgets settings’ \nhardware specifications \n4.6. Firmware versions \n4.7. Firmware installation \nprocedure \n4.1. Reading skills \n4.2. Computer skills \n4.3. Internet \nbrowsing and \nforum chatting \n4.4. Skills in mobile \ndevice/phone \nand handheld \ngadgets \noperation \n4.5. Software/ \nfirmware \ninstallation skills\n\n--- PDF PAGE 76 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- \nTR – Mobile Phones & Handheld Gadgets Servicing NC III   (ELCMPS321)      Promulgated February 9, 2021        72  \n \n \n       \n \n \n \n \n \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized Bold items are elaborated \nin the Range of Variables \nREQUIRED KNOWLEDGE \nREQUIRED SKILLS \nare restored based on \nstandard procedures \n5. Reassemble \nunit/ gadget \n5.1. Reassembly procedure is \nperformed in accordance \nwith OH&S policies and in \nconformity with user’s \nmanual * \n5.2. Internal components are \nchecked and verified if in \nplaced based on standard \nprocedures * \n5.3. Accessories are installed to \nthe unit/gadget as per user’s \nguide * \n5.4. Repaired unit/gadget is \ncleaned in in accordance \nwith standard procedures \n5.5. Waste materials are \ndisposed of in accordance \nwith environmental \nrequirements. \n5.6. Service completion report is \nprepared and documented \nas per service/repair center’s \nguidelines and procedures  \n \n5.1. Knowledge on mobile \nphone unit and \nhandheld gadget parts \nassembly and \ndisassembly \n5.2. Knowledge in mobile \nphone unit and \nhandheld gadget \noperation \n5.3. Normal working \ncondition of mobile \nphone unit and \nhandheld gadget \n5.4. System and \nProcesses \no Parts/components \nassembly/ \ndisassembly \n5.5. E-waste management  \n(DENR AO 2013-22) \n5.1. Reading skills \n5.2. Communicatio\nn skills \n5.3. Interpretation \nof diagrams \n5.4. Assembly and \ndisassembly \nskills \n5.5. Skills in mobile \nphone unit and \nhandheld \ngadget \noperation\n\n--- PDF PAGE 77 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- \nTR – Mobile Phones & Handheld Gadgets Servicing NC III   (ELCMPS321)      Promulgated February 9, 2021        73  \n \n \n       \n \n \n \n \n \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Personal protective \nequipment  \nMay include but not limited to: \n1.1. Working clothes/Apron \n1.2. Face/Dust Mask \n1.3. Goggles \n1.4. Anti-static mat \n1.5. Anti-static gloves  \n1.6. anti-static wrist strap \n2. OHS practices  \nMay include but not limited to: \n2.1. Use of proper tools and equipment \n2.2. Observe workplace environment and safety \n2.3. Adherence to safety requirements in handling the unit \n2.4. Use of protective device/shields \n2.5. Proper ESD practices  \n3. Accessories \nMay include: \n3.1. Casing \n3.2. SIM card \n3.3. SD card \n3.4. Battery  \n4. Pre-testing \nprocedures \nMay include: \n4.1. Visual inspection of the unit with the power off \n4.2. Interview of customer, re: history of unit \n4.3. Operate the unit according to manual to confirm defects \n5. System defect/ \nFault symptoms \nMay include but not limited to: \n5.1. No power \n Water damaged unit \n Dropped unit \n Memory-full unit \n Software incompatibility  \n Defective battery \n Defective battery terminal \n Defective ON/OFF switch \n5.2. No Signal  \n No transmission/ \nreception \n Intermittent signal \n Shorted/grounded unit \n Corrupted IMEI \n Defective antenna \n5.3. Not charging \n Defective charging port  \n Overcharged battery \n Defective Charging IC \n Defective battery \n Defective battery terminal \n Corrupted software  \n \n \n5.4. Defective User \ninterface \n Buzzer \n Vibrator \n Keypad \n Ear piece  \n Microphone \n LCD problem \n Camera problem \n Charging port problem \n Touch screen/digitizer \n Antenna  \n5.5. Defective modules \n Wi-Fi / Bluetooth \n Radio / TV / Audio  \n Camera\n\n--- PDF PAGE 78 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- \nTR – Mobile Phones & Handheld Gadgets Servicing NC III   (ELCMPS321)      Promulgated February 9, 2021        74  \n \n \n       \n \n \n \n \n \n \n \nVARIABLE \nRANGE \n6. Basic \ntroubleshooting \ntechniques \nMay include but not limited to: \n6.1. Sensing methods (visual, hearing, smell, touch) \n6.2. Component substitution/swapping method \n6.3. Isolation method \n6.4. Diagnostic software method \n6.5. Diagnosing components using test instruments \n7. Input/output (I/O) \ncomponents \nMay include but not limited to: \n7.1. Speaker/Loud speaker \n7.2. Wireless / USB keyboard  \n7.3. Microphone/Mouth piece \n7.4. LCD  \n7.5. Camera \n7.6. Charging port \n7.7. Touch screen/digitizer \n7.8. Power switch/button \n7.9. SIM/Memory card socket \n8. Responsible \nperson \nMay include but not limited to: \n8.1. Immediate supervisor \n8.2. Service supervisor/manager \n \n9. Environmental \nRequirements \nMay include but not limited to: \n9.1. Proper disposal of chemicals and components shall be \nbased on existing requirements of the law and chemical \nwaste management  \n9.2. Non-biodegradable parts or materials shall be packed \nand labeled properly for disposal. \n9.3. Electronic waste are properly packed and labeled for \ndisposal in accordance with environmental requirements. \n10. Compatible \nfirmware version \n May include: \n10.1. stockROM/Flash file \n10.2. official latest update \n10.3. custom firmware version\n\n--- PDF PAGE 79 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- \nTR – Mobile Phones & Handheld Gadgets Servicing NC III   (ELCMPS321)      Promulgated February 9, 2021        75"
