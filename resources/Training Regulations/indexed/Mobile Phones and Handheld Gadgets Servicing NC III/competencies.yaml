  "source_section_text": "SECTION 2:\nCOMPETENCY STANDARDS\n\nThis section gives the details of the contents of the basic, common, and core units of\ncompetency required for Mobile Phones and Handheld Gadgets Servicing NC III.\n\nBASIC COMPETENCIES\n\nUNIT OF COMPETENCY : LEAD WORKPLACE COMMUNICATION\n\nUNIT CODE\n : 400311319\n\n UNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes required to\nlead in the dissemination and discussion of ideas, information\nand issues in the workplace.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1. Communicate\ninformation\nabout\nworkplace\nprocesses\n1.1 Relevant\ncommunication method\nis selected based on\nworkplace procedures\n1.2 Multiple operations\ninvolving several\ntopics/areas are\ncommunicated following\nenterprise requirements\n1.3 Questioning is applied to\ngain extra information\n1.4 Relevant sources of\ninformation are identified\nin accordance with\nworkplace/ client\nrequirements\n1.5 Information is selected\nand organized following\nenterprise procedures\n1.6 Verbal and written\nreporting is undertaken\nwhen required\n1.7 Communication and\nnegotiation skills are\napplied and maintained in\nall relevant situations\n1.1. Organization\nrequirements for\nwritten and\nelectronic\ncommunication\nmethods\n1.2. Effective verbal\ncommunication\nmethods\n1.3. Business writing\n1.4. Workplace\netiquette\n1.1. Organizing\ninformation\n1.2. Conveying\nintended meaning\n1.3. Participating in a\nvariety of\nworkplace\ndiscussions\n1.4. Complying with\norganization\nrequirements for\nthe use of written\nand electronic\ncommunication\nmethods\n1.5. Effective business\nwriting\n1.6. Effective clarifying\nand probing skills\n1.7. Effective\nquestioning\ntechniques\n(clarifying and\nprobing)\n2. Lead\nworkplace\ndiscussions\n2.1 Response to workplace\nissues are sought following\nenterprise procedures\n2.2 Response to workplace\nissues are provided\nimmediately\n2.3 Constructive contributions\nare made to workplace\ndiscussions on such\nissues as production,\nquality and safety\n2.1 Organization\nrequirements for\nwritten and\nelectronic\ncommunication\nmethods\n2.2 Effective verbal\ncommunication\nmethods\n2.3 Workplace\netiquette\n2.1 Organizing\ninformation\n2.2 Conveying\nintended meaning\n2.3 Participating in\nvariety of\nworkplace\ndiscussions\n2.4 Complying with\norganization\nrequirements for\n\n--- PDF PAGE 8 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Mobile Phones & Handheld Gadgets Servicing NC III (ELCMPS321) Promulgated February 9, 2021 4\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n2.4 Goals/objectives and\naction plans undertaken\nin the workplace are\ncommunicated promptly\nthe use of written\nand electronic\ncommunication\nmethods\n2.5 Effective clarifying\nand probing skills\n3. Identify and\ncommunicate\nissues arising\nin the\nworkplace\n3.1 Issues and problems are\nidentified as they arise\n3.2 Information regarding\nproblems and issues are\norganized coherently to\nensure clear and effective\ncommunication\n3.3 Dialogue is initiated with\nappropriate personnel\n3.4 Communication problems\nand issues are raised as\nthey arise\n3.5 Identify barriers in\ncommunication to be\naddressed appropriately\n\n3.1 Organization\nrequirements for\nwritten and\nelectronic\ncommunication\nmethods\n3.2 Effective verbal\ncommunication\nmethods\n3.3 Workplace\netiquette\n3.4 Communication\nproblems and\nissues\n3.5 Barriers in\ncommunication\n\n3.1 Organizing\ninformation\n3.2 Conveying\nintended meaning\n3.3 Participating in a\nvariety of workplace\ndiscussions\n3.4 Complying with\norganization\nrequirements for\nthe use of written\nand electronic\ncommunication\nmethods\n3.5 Effective clarifying\nand probing skills\n3.6 Identifying issues\n3.7 Negotiation and\ncommunication\nskills\n\n--- PDF PAGE 9 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Mobile Phones & Handheld Gadgets Servicing NC III (ELCMPS321) Promulgated February 9, 2021 5\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Methods of\ncommunication\nMay include:\n1.1.\nNon-verbal gestures\n1.2.\nVerbal\n1.3.\nFace-to-face\n1.4.\nTwo-way radio\n1.5.\nSpeaking to groups\n1.6.\nUsing telephone\n1.7.\nWritten\n1.8.\nInternet\n2. Workplace discussions\nMay include:\n2.1.\nCoordination meetings\n2.2.\nToolbox discussion\n2.3.\nPeer-to-peer discussion\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1.\nDealt with a range of communication/information at one\ntime\n1.2.\nDemonstrated leadership skills in workplace\ncommunication\n1.3.\nMade constructive contributions in workplace issues\n1.4.\nSought workplace issues effectively\n1.5.\nResponded to workplace issues promptly\n1.6.\nPresented information clearly and effectively written form\n1.7.\nUsed appropriate sources of information\n1.8.\nAsked appropriate questions\n1.9.\nProvided accurate information\n2. Resource\nImplications\nThe following resources should be provided:\n2.1.\nVariety of Information\n2.2.\nCommunication tools\n2.3.\nSimulated workplace\n\n3. Methods of\nAssessment\nCompetency in this unit must be assessed through\n3.1.\nCase problem\n3.2.\nThird-party report\n3.3.\nPortfolio\n3.4.\nInterview\n3.5.\nDemonstration/Role-playing\n4. Context for\nAssessment\n4.1.\nCompetency may be assessed in the workplace or in\nsimulated workplace environment\n\n--- PDF PAGE 10 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Mobile Phones & Handheld Gadgets Servicing NC III (ELCMPS321) Promulgated February 9, 2021 6\n\nUNIT OF COMPETENCY\n: LEAD SMALL TEAMS\nUNIT CODE\n\n: 400311320\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes to lead\nsmall teams including setting, maintaining and monitoring\nteam and individual performance standards.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1. Provide team\nleadership\n1.1. Work requirements are\nidentified and presented\nto team members based\non company policies and\nprocedures\n1.2. Reasons for instructions\nand requirements are\ncommunicated to team\nmembers based on\ncompany policies and\nprocedures\n1.3. Team members’\nqueries and concerns\nare recognized,\ndiscussed and dealt with\nbased on company\npractices\n1.1 Facilitation of\nTeam work\n1.2 Company policies\nand procedures\nrelating to work\nperformance\n1.3 Performance\nstandards and\nexpectations\n1.4 Monitoring\nindividual’s and\nteam’s\nperformance vis a\nvis client’s and\ngroup’s\nexpectations\n1.1 Communication\nskills required\nfor leading\nteams\n1.2 Group facilitation\nskills\n1.3 Negotiating skills\n1.4 Setting\nperformance\nexpectation\n2. Assign\nresponsibilities\n2.1. Responsibilities are\nallocated having regard to\nthe skills, knowledge and\naptitude required to\nundertake the assigned\ntask based on company\npolicies.\n2.2. Duties are allocated\nhaving regard to\nindividual preference,\ndomestic and personal\nconsiderations, whenever\npossible\n2.1 Work plan and\nprocedures\n2.2 Work\nrequirements and\ntargets\n2.2 Individual and\ngroup\nexpectations and\nassignments\n2.3 Ways to improve\ngroup leadership\nand membership\n2.1 Communication\nskills\n2.2 Management\nskills\n2.3 Negotiating skills\n2.4 Evaluation skills\n2.5 Identifying team\nmember’s\nstrengths and\nrooms for\nimprovement\n3. Set\nperformance\nexpectations for\nteam members\n3.1 Performance\nexpectations are\nestablished based on\nclient needs\n3.2 Performance\nexpectations are based\non individual team\nmembers knowledge,\nskills and aptitude\n3.3 Performance\nexpectations are\ndiscussed and\ndisseminated to\nindividual team members\n\n3.1 One’s roles and\nresponsibilities in\nthe team\n3.2 Feedback giving\nand receiving\n3.3 Performance\nexpectation\n3.1 Communication\nskills\n3.2 Accurate\nempathy\n3.3 Congruence\n3.4 Unconditional\npositive regard\n3.5 Handling of\nFeedback\n\n--- PDF PAGE 11 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Mobile Phones & Handheld Gadgets Servicing NC III (ELCMPS321) Promulgated February 9, 2021 7\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n4. Supervised\nteam\nperformance\n4.1 Performance is\nmonitored based on\ndefined performance\ncriteria and/or\nassignment instructions\n4.2 Team members are\nprovided with feedback,\npositive support and\nadvice on strategies to\novercome any\ndeficiencies based on\ncompany practices\n4.3 Performance issues\nwhich cannot be rectified\nor addressed within the\nteam are referenced to\nappropriate personnel\naccording to employer\npolicy\n4.4 Team members are kept\ninformed of any changes\nin the priority allocated to\nassignments or tasks\nwhich might impact on\nclient/customer needs\nand satisfaction\n4.5 Team operations are\nmonitored to ensure that\nemployer/client needs\nand requirements are\nmet\n4.6 Follow-up communication\nis provided on all issues\naffecting the team\n4.7 All relevant\ndocumentation is\ncompleted in accordance\nwith company\nprocedures\n4.1 Performance\nCoaching\n4.2 Performance\nmanagement\n4.3 Performance\nIssues\n4.1 Communication\nskills required\nfor leading\ntea