/customer needs \nand satisfaction \n4.5 Team operations are \nmonitored to ensure that \nemployer/client needs \nand requirements are \nmet \n4.6 Follow-up communication \nis provided on all issues \naffecting the team \n4.7 All relevant \ndocumentation is \ncompleted in accordance \nwith company \nprocedures \n4.1  Performance \nCoaching  \n4.2  Performance \nmanagement \n4.3  Performance \nIssues \n4.1  Communication \nskills required \nfor leading \nteams \n4.2  Coaching skill\n\n--- PDF PAGE 12 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- \nTR – Mobile Phones & Handheld Gadgets Servicing NC III       (ELCMPS321)       Promulgated February 9, 2021      8  \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Work requirements \nMay include: \n1.1. Client Profile \n1.2. Assignment instructions \n2. Team member’s concerns \nMay include: \n2.1. Roster/shift details \n3. Monitor performance \nMay include: \n3.1. Formal process \n3.2. Informal process \n4. Feedback \nMay include: \n4.1. Formal process \n4.2. Informal process \n5. Performance issues \nMay include: \n5.1. Work output \n5.2. Work quality \n5.3. Team participation \n5.4. Compliance with workplace protocols \n5.5. Safety \n5.6. Customer service \n \nEVIDENCE GUIDE \n1. Critical aspects of \nCompetency  \nAssessment requires evidence that the candidate: \n1.1. Maintained or improved individuals and/or team \nperformance given a variety of possible scenario \n1.2. Assessed and monitored team and individual performance \nagainst set criteria \n1.3. Represented concerns of a team and individual to next level \nof management or appropriate specialist and to negotiate on \ntheir behalf \n1.4. Allocated duties and responsibilities, having regard to   \nindividual’s knowledge, skills and aptitude and the needs of \nthe tasks to be performed \n1.5. Set and communicated performance expectations for a \nrange of tasks and duties within the team and provided \nfeedback to team members \n2. Resource \nImplications \nThe following resources should be provided: \n2.1. Access to relevant workplace or appropriately simulated \nenvironment where assessment can take place \n2.2. Materials relevant to the proposed activity or task \n3. Methods of \nAssessment \nCompetency in this unit may be assessed through: \n3.1. Written Examination \n3.2. Oral Questioning  \n3.3. Portfolio \n4. Context for \nAssessment \n4.1. Competency may be assessed in actual workplace or at the \ndesignated TESDA Accredited Assessment Center\n",
