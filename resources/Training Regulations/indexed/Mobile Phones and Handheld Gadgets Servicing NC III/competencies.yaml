        "source_title": "PREPARE AND INTERPRET TECHNICAL DRAWING",
        "source_text": "--- PDF PAGE 43 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- \nTR – Mobile Phones & Handheld Gadgets Servicing NC III       (ELCMPS321)       Promulgated February 9, 2021      39  \n \nUNIT TITLE \n: \nPREPARE AND INTERPRET TECHNICAL DRAWING \nUNIT CODE \n:    ELC311202  \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge, skills and attitudes and values \nneeded to prepare/interpret diagrams, engineering abbreviation \nand drawings, symbols, dimension. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized  terms are elaborated \nin the Range of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n1. Identify different \nkinds of \ntechnical \ndrawings  \n1.1. Correct technical \ndrawing is selected \naccording to job \nrequirements. \n1.2. Technical drawings are \nsegregated in \naccordance with the \ntypes and kinds of \ndrawings \n1.1. Types of technical \ndrawings \n1.2. Applications for \ntechnical drawing  \n1.3. Methods of \ntechnical drawings \n1.4. Symbols \n1.5. Mark up/Notation \nof Drawings \n1.1. Reading skills \nrequired to \ninterpret work \ninstruction \n1.2. Interpreting \nelectrical/ \nelectronic signs \nand symbols   \n2. Interpret \ntechnical \ndrawing \n2.1. Components, \nassemblies or objects \nare recognized as \nrequired. \n2.2. Dimensions of the key \nfeatures of the objects \ndepicted in the drawing \nare correctly identified. \n2.3. Symbols used in the \ndrawing are identified \nand interpreted \ncorrectly. \n2.4. Drawing is checked and \nvalidated against job \nrequirements or \nequipment in \naccordance with \nstandard operating \nprocedures. \n \n2.1. Trade Mathematics \no Linear \nmeasurement \no Dimension \no Unit conversion \n2.2. Blueprint Reading \nand Plan \nSpecification \no Architectural, \nelectrical, \nelectronics, \nmechanical plan, \nsymbols and \nabbreviations \no Drawing standard \nsymbols \n2.3. Trade Theory \no Basic technical \ndrawing \no Types technical \nplans \no Various types of \ndrawings \no Notes and \nspecifications \n2.1. Interpreting \ndrawing/ \northographic \ndrawing \n2.2. Interpreting \ntechnical plans \n2.3. Matching \nspecification \ndetails with \nexisting resources \n2.4. Safety handling of \ndrawing \ninstruments \n \n3. Prepare/make \nchanges to \nelectrical/ \nelectronic \nschematics and \ndrawings \n3.1. Electrical/electronic \nschematic is drawn and \ncorrectly identified. \n3.2. Correct drawing is \nidentified, equipment are \nselected and used in \naccordance with job \nrequirements. \n3.1. Drawing \nconventions \n3.2. Dimensioning \nConventions \n3.3. Mathematics \no Four fundamental \noperations \no Percentage \no Fraction \no Algebra \no Geometry \n3.1. Reading skills \nrequired to \ninterpret work \ninstruction \n3.2. Communication \nskills \n3.3. Preparing/ \nMaking electrical/ \nelectronic signs \nand symbols   \n3.4. Computing \nformulas\n\n--- PDF PAGE 44 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- \nTR – Mobile Phones & Handheld Gadgets Servicing NC III       (ELCMPS321)       Promulgated February 9, 2021      40  \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized  terms are elaborated \nin the Range of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n4. Store technical \ndrawings and \nequipment/ \ninstruments \n4.1. Care and maintenance \nof drawings are \nundertaken according to \ncompany procedures. \n4.2. Technical drawings are \nrecorded and inventory \nis prepared in \naccordance with \ncompany procedures. \n4.3. Proper storage of \ninstruments is \nundertaken according to \ncompany procedures.  \n \n4.1. Effective ways to \ncatalogue and \nstore technical \ndrawings \n4.2. Manual methods of \nhandling, storing a\nnd maintaining \npaper drawings \n4.3. Storing drawing in \ndigital forms \no Scanner \no CAD \n \n4.1. Handling and \nstoring of \ndrawings \n4.2. Scanning and \nstoring drawings \nin digital form \n4.3. Matching \nspecification \ndetails with \nexisting resources \n4.4. Handling of \ndrawing \ninstruments\n\n--- PDF PAGE 45 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- \nTR – Mobile Phones & Handheld Gadgets Servicing NC III       (ELCMPS321)       Promulgated February 9, 2021      41  \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Technical drawings \nTechnical drawings include the following but not limited to: \n1.1. Schematic diagrams \n1.2. Charts \n1.3. Block diagrams \n1.4. Lay-out plans \n1.5. Location plans \n1.6. Process and instrumentation diagrams \n1.7. Loop diagrams \n1.8. System Control Diagrams \n \n2. Dimensions   \nDimensions may include but not limited to: \n2.1. Length \n2.2. Width \n2.3. Height \n2.4. Diameter \n2.5. Angles \n \n3. Symbols \nMay include but not limited to: \n3.1. NEC- National Electric Code \n3.2. IEC - International Electrotechnical Commission \n3.3. ASME - American Society of Mechanical Engineers \n3.4. IEEE - Institute of Electrical and Electronics Engineers \n3.5. ISA - Instrumentation System and Automation Society \n \n4. Instruments/ \nEquipment \nMay include but not limited to: \n4.1. Components/dividers \n4.2. Drawing boards \n4.3. Rulers \n4.4. T-square \n4.5. Calculator\n\n--- PDF PAGE 46 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- \nTR – Mobile Phones & Handheld Gadgets Servicing NC III       (ELCMPS321)       Promulgated February 9, 2021      42  \n \n \n \nEVIDENCE GUIDE \n \n1. Critical aspect of \ncompetencies \nAssessment requires evidence that the candidate: \n \n1.1. selected correct technical drawing in line with \njob requirements \n1.2. correctly identified the objects represented in \nthe drawing \n1.3. identified and interpreted symbols used in the \ndrawing correctly \n1.4. prepared/produced electrical/electronic \ndrawings including all relevant specifications \n1.5. stored diagrams/equipment \n \n2. Method of assessment \nCompetency in this unit must be assessed through: \n \n2.1. Practical tasks involving interpretation of a \nrange of technical drawings \n2.2. Oral questioning \n \n3. Resource implication \nThe following resources should be provided: \n3.1. Drawings \n3.2. Diagrams \n3.3. Charts \n3.4. Plans \n \n4. Context of Assessment \n4.1. Assessment may be conducted in the \nworkplace or in a simulated work environment\n",
