ace\netiquette\n2.1 Organizing\ninformation\n2.2 Conveying\nintended meaning\n2.3 Participating in\nvariety of\nworkplace\ndiscussions\n2.4 Complying with\norganization\nrequirements for\n\n--- PDF PAGE 8 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Mobile Phones & Handheld Gadgets Servicing NC III (ELCMPS321) Promulgated February 9, 2021 4\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n2.4 Goals/objectives and\naction plans undertaken\nin the workplace are\ncommunicated promptly\nthe use of written\nand electronic\ncommunication\nmethods\n2.5 Effective clarifying\nand probing skills\n3. Identify and\ncommunicate\nissues arising\nin the\nworkplace\n3.1 Issues and problems are\nidentified as they arise\n3.2 Information regarding\nproblems and issues are\norganized coherently to\nensure clear and effective\ncommunication\n3.3 Dialogue is initiated with\nappropriate personnel\n3.4 Communication problems\nand issues are raised as\nthey arise\n3.5 Identify barriers in\ncommunication to be\naddressed appropriately\n\n3.1 Organization\nrequirements for\nwritten and\nelectronic\ncommunication\nmethods\n3.2 Effective verbal\ncommunication\nmethods\n3.3 Workplace\netiquette\n3.4 Communication\nproblems and\nissues\n3.5 Barriers in\ncommunication\n\n3.1 Organizing\ninformation\n3.2 Conveying\nintended meaning\n3.3 Participating in a\nvariety of workplace\ndiscussions\n3.4 Complying with\norganization\nrequirements for\nthe use of written\nand electronic\ncommunication\nmethods\n3.5 Effective clarifying\nand probing skills\n3.6 Identifying issues\n3.7 Negotiation and\ncommunication\nskills\n\n--- PDF PAGE 9 ---\n-------------------------------------------------------------------------------------------------------------------------------------------