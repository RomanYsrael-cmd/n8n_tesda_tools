        "source_text": "--- PDF PAGE 59 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- \nTR – Mobile Phones & Handheld Gadgets Servicing NC III       (ELCMPS321)       Promulgated February 9, 2021      55  \n \nUNIT OF COMPETENCY:   TEST ELECTRONIC COMPONENTS   \n \nUNIT CODE                     :   ELC724205  \n \nDESCRIPTON                 :   This unit covers the knowledge, skills and attitudes required to \ntest electronic components. It includes competencies in \ndetermining the criteria for testing electronics components, \nplanning an approach for component testing, testing the \ncomponents and evaluating the testing process. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in \nthe Range of Variables \nREQUIRED KNOWLEDGE \nREQUIRED \nSKILLS \n1. Determine \ncriteria for \ntesting \nelectronics \ncomponents \n1.1 Work instructions are \nobtained and clarified \nbased on job order forms \nor client requirements \n1.2 Responsible person is \nconsulted for effective and \nproper work coordination \n1.3 Data sheets/Application \nnotes are obtained and \ninterpreted based on \nmanufacturer’s \nspecifications \n1.4 Testing criteria are \ndefined to ensure that \ncomponents meet technical \nand quality requirements \n1.5 Document and \ncommunicate testing \ncriteria to relevant \npersonnel \n1.1 Mensuration/ \nMathematics \no Conversion of Units \no Applied Mathematics \n1.2 Safety  \no Work Safety \nrequirements and \neconomy of materials \nwith durability \n1.3 Systems and Processes \no Principles of electrical / \nelectronic circuits \no Identifying sources of \nelectricity \no Identifying conductors \nand insulators \no Supplying different \nvoltage using variable \npower supply \no Measuring resistance \nusing VOM \no Testing resistors \no Measuring current and \nvoltage using VOM \n1.4 Testing Criteria \no Controls \no Effectiveness \no Efficiency \no Bug detection \no Functionality, including \nflow \no Interoperability \no Performance \no Reliability \no Operating parameters \n1.1 Work efficiently \n& \nsystematically \n1.2 Communication \nskills  \n1.3 Use and \nmaintenance of \ntools and \nequipment \n1.4 Skills in testing \nelectronic \ncomponents \n1.5 Work safety \npractices and \ntime \nmanagement \n1.6 Problem \nsolving skills \n1.7 Reading skills \n2. Plan an \napproach \nfor \ncomponent \ntesting \n2.1 Various testing methods \nare Identified based on \ntypes of electronic \ncomponents \n2.2 Characteristics and \nappropriateness of testing \nmethods to be used during \ndevelopment and on \n2.1 Safety  \no Work Safety \nrequirements and \neconomy of materials \nwith durability \no Knowledge in 5S \napplication and \nobservation of required \n2.1 Skills in testing \nelectronic \ncomponents \n2.2 Work safety \npractices and \ntime \nmanagement \n2.3 Planning skills\n\n--- PDF PAGE 60 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- \nTR – Mobile Phones & Handheld Gadgets Servicing NC III       (ELCMPS321)       Promulgated February 9, 2021      56  \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in \nthe Range of Variables \nREQUIRED KNOWLEDGE \nREQUIRED \nSKILLS \ncompletion is determined \n2.3 Testing methods are \nconsidered/selected in \nrelation to appropriate \ntesting strategy \n2.4 Plan for testing \ncomponents is developed \nat specified points during \ndevelopment and on \ncompletion \n2.5 Required test & \nmeasuring instruments \nand tools are prepared \nand checked in accordance \nwith established \nprocedures \n2.6 Records system is \nestablished to document \ntesting results, including \nproblems and faults \ntimeframe \n2.2 Materials, tools and \nequipment uses and \nspecifications \no Proper care and use of \ntools \n2.3 Types of electronic \ncomponents \no Passive components \no Active components \no Dynamic components \no Hybrid components \n2.4 Testing methods \no Automated \no Debugging \no Inspection \no Platform testing \no Prototyping \n2.5 Systems and Processes \no Describing resistance \nand identify resistors \no Describing alternating \ncurrent circuits \no Describing capacitance \nand identifying \ncapacitors \no Describing inductance \nand identifying inductors \no Describing the \ncharacteristic of \ntransformers  \no Describing and \nidentifying \nsemiconductor diode \no Describing and \nidentifying bipolar \ntransistor \no Describing and \nanalyzing digital gate \n2.4 Problem \nsolving skills \n2.5 Reading skills \n2.6 Checking test \n& measuring \ninstruments \nand tools \n2.7 Documentation \nskills \n3. Test \ncomponents  \n3.1 Testing methods are \napplied to ensure that \nproducts meet creative, \nproduction and technical \nrequirements \n3.2 Problems and faults \ndetected by testing are \nrecorded and remedial \nsteps taken in records \nsystem is documented \n3.3 Problems and faults \ndetected during testing are \nresolved in accordance \nwith agreed project or \n3.1 Safety  \no Work Safety \nrequirements and \neconomy of materials \nwith durability \n3.2 Materials, tools and \nequipment uses and \nspecifications \no Proper care and use of \ntools \n3.3 Systems and Processes \no Principles of electrical/ \nelectronic circuits \no Supplying different \n3.1 Skills in testing \nelectronic \ncomponents \n3.2 Troubleshootin\ng skills \n3.3 Problem \nsolving skills \n3.4 Documentation \nskills \n3.5 Work efficiently \n& \nsystematically \n3.6 Product \nanalysis and\n\n--- PDF PAGE 61 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- \nTR – Mobile Phones & Handheld Gadgets Servicing NC III       (ELCMPS321)       Promulgated February 9, 2021      57  \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in \nthe Range of Variables \nREQUIRED KNOWLEDGE \nREQUIRED \nSKILLS \nindustry practice \n3.4 Evaluate final products \nagainst the previously \ndetermined criteria \n3.5 Testing process is \ndocumented and \nsummarized evaluation \nreport is submitted to \nrelevant personnel \nvoltage using variable \npower supply \no Measuring resistance \nusing VOM \no Testing resistors \no Measuring current and \nvoltage using VOM \no Observing waveform \nusing oscilloscope \no Generating waveform in \nvarious frequency using \nfunction generator \no Measuring frequency \nusing oscilloscope \no Measuring capacitance \nusing VOM \no Testing capacitors \no Testing inductors \no Testing semiconductor \ndiode \no Testing bipolar transistor \no Testing logic gates \nevaluation skills \n3.7 Communication \nskills  \n3.8 Reading skills \n4. Evaluate the \ntesting \nprocess \n4.1 \nTesting methods that \nwere successful and \nthose that led to \ndifficulties are identified \nbased on industry \nstandards \n4.2 \nTesting process and \nrecords system are \nevaluated based on \nstandard procedures \n4.3 \nTest results/findings are \ndocumented for \nsubsequent components \ntesting.  \n4.1 Evaluation of testing \nprocess and records \nsystem \n4.2 Systems and Processes \no Analyzing simple circuit \nusing ohms and power \nlaw \no Analyzing series/parallel \ncircuits using ohms and \npower law \no Analyzing series/parallel \ncapacitances \no Analyzing series parallel \ninductors \no Analyzing rectifier \ncircuits \no Analyzing amplifier \ncircuit \no Analyzing multi-vibrator \ncircuit \no Analyzing logic networks \no Analyzing sequence \ncircuits \n4.1 Work efficiently \n& \nsystematically \n4.2 Skills in testing \nelectronic \ncomponents \n4.3 Product \nanalysis and \nevaluation \nskills \n4.4 Documentation \nskills \n4.5 Communication \nskills  \n4.6 Reading skills\n\n--- PDF PAGE 62 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- \nTR – Mobile Phones & Handheld Gadgets Servicing NC III       (ELCMPS321)       Promulgated February 9, 2021      58  \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Responsible person \nRelevant personnel may include: \n1.1. Immediate supervisor \n1.2. Manager \n2. Testing criteria  \nTesting criteria may include: \n2.1. controls \n2.2. effectiveness \n2.3. efficiency \n2.4. bug detection \n2.5. functionality, including flow \n2.6. interoperability \n2.7. performance \n2.8. reliability \n2.9. operating parameters \n3. Testing methods  \nTesting methods may include: \n3.1. automated \n3.2. debugging \n3.3. inspection \n3.4. platform testing \n3.5. prototyping \n4. Types of electronic \ncomponents \n4.1. Passive components \n4.2. Active components \n4.3. Dynamic components \n4.4. Hybrid components \n5. Testing strategy  \nTesting strategy may be determined by: \n5.1. Passive testing \n5.2. Dynamic testing \n5.3. In-circuit testing \n6. Test and measuring \ninstruments \nTest and measuring instruments may include: \n6.1. Variable DC power supply \n6.2. Digital VOM \n6.3. analog VOM \n6.4. dual trace triggered oscilloscope \n6.5. function generator \n \n7. Tools  \nTools may include: \n7.1. set of pliers \n7.2.  set of screw drivers \n7.3. set of wrenches \n7.4.  Hand drills, \n7.5.  Hack saw \n7.6.  set of files \n7.7.  tin snip \n7.8. Hammer\n\n--- PDF PAGE 63 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- \nTR – Mobile Phones & Handheld Gadgets Servicing NC III       (ELCMPS321)       Promulgated February 9, 2021      59  \n \nVARIABLE \nRANGE \n8. Records system \nRecords system may include: \n8.1. metadata that includes: \n8.1.1. description of fault \n8.1.2. identification of code \n8.1.3. user responses \n8.1.4. written or verbal comments \n8.1.5. quantitative data \n8.1.6. remedial action taken \n8.1.7. retest result \n8.1.8. date \n8.1.9. tester's details \n8.2. questionnaire \n8.3. survey \n \n \nEVIDENCE GUIDE \n \n1 \nCritical aspects of \ncompetency \n \nAssessment requires evidence that the candidate: \n1.1 \nDetermined criteria for testing electronics components \n1.2 \nPlanned an approach for component testing \n1.3 \nTested components \n1.4 \nEvaluated the testing process \n \n2 \nMethod of \nassessment \n \nCompetency may be assessed through two or more of the \nfollowing methods: \n2.1 \nDirect observation of application to tasks and \nquestions related to required knowledge \n2.2 \nDemonstration with oral questioning \n2.3 \nThird party report \n2.4 \nWritten test \n2.5 \nPortfolio \n3 \nResource \nimplications \n \nThe following resources should be provided: \n3.1 \nTools and equipment (see range of variables) \n3.2 \nWorking area/bench \n3.3 \nElectronic components \n3.4 \nTesting instruments and equipment \n3.5 \nAssessment rating sheet \n3.6 \nReporting forms \n4 \nContext of \nassessment \n \n4.1 \nAssessment maybe conducted in the workplace or in a \nsimulated workplace setting\n",
