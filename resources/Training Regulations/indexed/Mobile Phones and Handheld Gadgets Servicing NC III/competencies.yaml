        "evidence_guide": {
          "source_text": "1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1. Disassemble unit/gadget\n1.1.1. Used personal protective equipment (PPE) in\naccordance with Occupational Health and Safety\npractices\n1.1.2. Performed disassembly procedures in accordance\nwith OH&S policies and work instructions\n1.1.3. Properly organized parts and accessories in\naccordance with its functionality and purpose\n1.2. Troubleshoot unit/gadget hardware related problem\n1.2.1. Followed electro-static discharge (ESD) procedure\nin accordance with current industry standards\n1.2.2. Observed systematic pre-testing procedure in\naccordance with user’s manual\n1.2.3. Identified system defects/ fault symptoms in\naccordance with basic troubleshooting techniques\n1.2.4. Checked and isolated chips and components using\nspecified testing procedures\n1.2.5. Checked input/output (I/O) components using\nspecified testing procedures\n1.3. Repaired unit/ gadget hardware related problem\n1.3.1. Replaced/Swapped defective parts/ components\nwith original/ compatible parts according to\ndiagnostic results\n1.3.2. Soldered/Mounted repaired or replaced parts/\ncomponents in accordance with the current industry\nstandards\n1.3.3. Performed repair activity within the required\ntimeframe\n1.3.4. Checked repaired or replaced parts/components for\nproper mounting and tested for its functionality\n1.3.5. Observed care and extreme precaution in handling\nthe unit/gadget as per procedures\n1.4. Repaired unit/ gadget software related problem\n1.4.1. Identified unit/gadget firmware is prepared based on\nphone and mobile device settings’ hardware\nspecifications\n1.4.2. Ensured battery life percentage to be 50% higher\nprior to installation of unit/gadget firmware and other\nrelated software\n1.4.3. Informed client for possible loss of user data during\nsoftware\n1.4.4. Performed formatting of user data based on\nunit/gadget factory default settings\n1.4.5. Installed compatible firmware version based on\nunit/gadget model/brand and standard procedures\n1.5. Reassemble unit/ gadget\n1.5.1. Performed reassembly procedure in accordance\nwith OH&S policies and in conformity with user’s\n\n--- PDF PAGE 80 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Mobile Phones & Handheld Gadgets Servicing NC III (ELCMPS321) Promulgated February 9, 2021 76\n\nmanual\n1.5.2. Checked and verified internal components if in\nplaced based on standard procedures\n1.5.3. Cleaned repaired unit/gadget in in accordance with\nstandard procedures\n\n2. Resource\nImplications\nThe following resources should be provided:\n2.1. Work area with sufficient lighting and ventilation system\n2.2. ESD free working area/bench\n2.3. Tools and equipment\n2.4. Appropriate mobile/cellular phone units\n2.5. Desktop/ laptop units and appropriate mobile\napplication/add-ons software\n2.6. Work Instructions Assessment rating sheet\n2.7. Applicable forms for specific tasks\n\n3. Methods of\nAssessment\nCompetency may be assessed through:\n3.1. Demonstration with oral questioning\n3.2. Written test\n3.3. Portfolio with interview\n\n4. Context for\nAssessment\n4.1. Competency may be assessed in actual workplace or at\nthe designated TESDA Accredited Assessment Center.\n\n--- PDF PAGE 81 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Mobile Phones & Handheld Gadgets Servicing NC III (ELCMPS321) Promulgated February 9, 2021 77\n\nUNIT TITLE\n: PERFORM FUNCTIONALITY TESTING AND DOCUMENTATION\nUNIT CODE\n:"
        },
        "source_text": "ELC742303\n\nUNIT DESCRIPTOR :\nThis unit covers the knowledge, skills and attitudes needed in\ntroubleshooting and repairing hardware and software related\nproblems for mobile phone units and handheld gadgets. This\nincludes disassembling the unit/gadget, troubleshooting and\nrepairing the unit/gadget hardware and also performing related\nmobile unit/handheld gadget software repair.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized Bold items are elaborated\nin the Range of Variables\nREQUIRED KNOWLEDGE\nREQUIRED SKILLS\n1. Disassemble\nunit/gadget\n\n1.1. Personal protective\nequipment is used in\naccordance with\nOccupational Health and\nSafety practices. *\n1.2. Necessary tools and\ninstruments used for\ndisassembly of unit/gadget\nare prepared in line with job\nrequirements\n1.3. Accessories are detached\nto the unit/gadget as per\nuser’s guide\n1.4. Disassembly procedures are\nperformed in accordance\nwith OH&S policies and work\ninstructions *\n1.5. Parts and accessories are\nproperly organized in\naccordance with its\nfunctionality and purpose *\n\n1.1. Disassembly\nprocedures as per\nuser’s guide\n1.2. Safety\no Work Safety\nrequirements and\neconomy of materials\nwith durability\n1.3. Tools and instruments\nused for disassembly\n1.4. Parts and functions of\nmobile phone and\nhandheld gadget parts\nand accessories\n1.5. Mobile phone and\nhandheld gadget parts\nfunctionality\n1.1. Reading skills\n1.2. Communication\nskills\n1.3. Computer skills\n1.4. Skills in\nassembly/\ndisassembly of\nmobile\nphone/handheld\ngadgets\n1.5. Identifying parts\nand accessories\n1.6. Internet\nbrowsing and\nforum chatting\n\n2. Troubleshoot\nunit/gadget\nhardware\nrelated\nproblem\n\n2.1. Personal protective\nequipment is used in\naccordance with\nOccupational Health and\nSafety practices. *\n2.2. Electro-static discharge\n(ESD) procedure is followed\nin accordance with current\nindustry standards. *\n2.3. Systematic pre-testing\nprocedure is observed in\naccordance with user’s\nmanual. *\n2.4. System defects/ Fault\nsymptoms are identified in\naccordance with basic\ntroubleshooting\ntechniques. *\n2.1. Knowledge in\nsystematic pre-testing\nprocedures as per\nuser’s manual\n2.2. Knowledge in new/\nupcoming trends in\nmobile phone units\nand handheld gadgets\n2.3. Types of systems\ndefects/fault\nsymptoms of a\nmobile/cellular phone\nunits and handheld\ngadgets (see ROV)\n2.4. Basic troubleshooting\ntechniques for\nmobile/cellular phones\nand handheld gadgets\n2.1. Reading skills\n2.2. Communication\nskills\n2.3. Computer skills\n2.4. Background in\nbasic\nelectronics skills\nand theory\n2.5. Internet\nbrowsing and\nforum chatting\n2.6. Troubleshooting\ntechniques\n2.7. Interpretation of\nschematic\ndiagrams\n\n--- PDF PAGE 74 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Mobile Phones & Handheld Gadgets Servicing NC III (ELCMPS321) Promulgated February 9, 2021 70\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized Bold items are elaborated\nin the Range of Variables\nREQUIRED KNOWLEDGE\nREQUIRED SKILLS\n2.5. Chips and components are\nchecked and isolated using\nspecified testing procedures*\n2.6. Input/output (I/O)\ncomponents are checked\nusing specified testing\nprocedures *\n2.7. Whenever applicable,\nidentified defects and faults\nare explained to the\nresponsible person in\naccordance with service\ncenter guidelines\n2.8. Results of diagnosis and\ntesting are documented and\ncompleted within the\nspecified time.\n2.9. Customers are advised/\ninformed regarding the status\nand serviceability of the unit.\n(see ROV)\n2.5. Drawing and\nSchematic Diagram\no Reading and\ninterpreting electronic\nschematic diagram\nand symbols\n2.6. Safety\no Work Safety\nrequirements and\neconomy of materials\nwith durability\n2.7. System and\nProcesses\no Computer operation\no Electronic\ncomponents and\ncircuits\no Analysis of troubles\nand isolation\ntechniques\no Types of I/O\ncomponents\n3. Repair unit/\ngadget\nhardware\nrelated\nproblem\n3.1. Personal protective\nequipment is used in\naccordance with\nOccupational Health and\nSafety practices. *\n3.2. Electro-static discharge\n(ESD) procedure is followed\nin accordance with current\nindustry standards.*\n3.3. Defective parts/ components\nare replaced/ swapped with\noriginal/ compatible parts\naccording to diagnostic\nresults. *\n3.4. Repaired or replaced\nparts/components are\nsoldered/mounted in\naccordance with the current\nindustry standards.*\n3.5. Repair activity is performed\nwithin the required\ntimeframe.*\n3.6. Repaired or replaced\nparts/components are\nchecked for proper mounting\nand tested for its\nfunctionality. *\n3.7. Care and extreme precaution\nin handling the unit/gadget is\n3.1. Usage of personal\nprotective equipment\n3.2. Knowledge of\noccupational health\nand safety practices\n3.3. Knowledge in using\nmulti-tester/VOM and\nother testing\ninstruments\n3.4. Knowledge in\nenvironmental safety\no E-Waste disposal\no Toxic fumes\nmanagement\n3.5. Usage of Anti- Static\npackage\n3.6. Soldering techniques\nand rework station\n(hot air) operation\n3.7. Parts/Components\nmounting procedures\n3.8. Functionality testing\n3.9. Drawing and\nSchematic Diagram\no Reading and\ninterpreting electronic\nschematic diagram\nand symbols\n3.10. Knowledge in 5S\n3.1. Reading skills\n3.2. Communication\nskills\n3.3. Computer skills\n3.4. Internet\nbrowsing and\nforum chatting\n3.5. Troubleshooting\ntechniques\n3.6. Soldering and\ndesoldering\nskills\n3.7. Parts\nidentification\nand function\n3.8. Interpretation of\ndiagrams\n\n--- PDF PAGE 75 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Mobile Phones & Handheld Gadgets Servicing NC III (ELCMPS321) Promulgate