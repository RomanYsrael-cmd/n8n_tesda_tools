        "source_text": "--- PDF PAGE 69 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- \nTR – Mobile Phones & Handheld Gadgets Servicing NC III   (ELCMPS321)      Promulgated February 9, 2021        65  \n \n \n       \n \n \n \n \n \n \nUNIT TITLE                 :   DIAGNOSE AND IDENTIFY HARDWARE AND SOFTWARE \nRELATED PROBLEMS \n \nUNIT CODE             \n:   ELC742302 \n \nUNIT DESCRIPTOR   : This unit covers the knowledge, skills and attitudes needed in \ndiagnosing and identifying hardware and software related problems \nfor both mobile phone units and handheld gadgets. This includes \nassessing customer’s concerns, checking the condition of the \nunit/gadget and determining the hardware and software status of \nthe unit/gadget. \n \nThis covers mobile phones (i.e., cellular phone, smartphone & \nphone-tablet) and handheld gadgets (i.e., tablet, iPad, notepad, \nportable media player, e-Watch and other similar gadgets). \n \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized Bold items are elaborated \nin the Range of Variables \nREQUIRED KNOWLEDGE \nREQUIRED SKILLS \n1. Assess  \ncustomer’s \nconcern \n1.1. Pre-history trouble of the \nunit/gadget is determined \naccording to the customer’s \nconcern * \n1.2. Customers are advised/ \ninformed regarding the status \nand serviceability of the \nunit/gadget * \n1.3. Customer’s approval is \nsought prior to servicing  \n1.1. How to deal with \ncustomer satisfaction \n1.2. Knowledge in \nsystematic pre-testing \nprocedures as per \nuser’s manual \n1.3. Rules of effective \nbusiness communication \nin customer service \n \n1.1. Reading skills \n1.2. Communication \nskills \n1.3. Computer skills \n1.4. Interpersonal \nskills \n1.5. Internet \nbrowsing and \nforum chatting \n \n2. Check the \ncondition of \nthe unit/ \ngadget \n2.1. Task requirements are \ndetermined according to job \nspecifications * \n2.2. Visual checking is performed \nbased on established \nprocedures * \n2.3. Defects and faults are listed \nand documented in \naccordance with service \ncenter guidelines \n2.1. Knowledge in \nsystematic pre-testing \nprocedures as per \nuser’s manual \n2.2. Usage of diagnostic \ntools \n2.3. System and Processes \no Computer operation \no Electronic components \nand circuits \no Analysis of troubles \nand isolation \ntechniques \n2.4. Visual checking \nprocedure \n2.5. Types of defects and \nfaults in mobile phones \nand handheld gadgets \n2.1. Reading skills \n2.2. Communication \nskills \n2.3. Computer skills \n2.4. Interpersonal \nskills \n2.5. Internet \nbrowsing and \nforum chatting \n2.6. Diagnosing \ntechniques \n \n3. Determine \nthe \nhardware \nstatus of the \nunit/gadget \n3.1. Personal protective \nequipment is used in \naccordance with \nOccupational Health and \nSafety practices. * \n3.2. Actual troubled/ damaged \n3.1. Knowledge in \nsystematic pre-testing \nprocedures as per \nuser’s manual \n3.2. How to deal with \ncustomer satisfaction \n3.1. Reading skills \n3.2. Communication \nskills \n3.3. Computer skills \n3.4. Interpersonal\n\n--- PDF PAGE 70 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- \nTR – Mobile Phones & Handheld Gadgets Servicing NC III   (ELCMPS321)      Promulgated February 9, 2021        66  \n \n \n       \n \n \n \n \n \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized Bold items are elaborated \nin the Range of Variables \nREQUIRED KNOWLEDGE \nREQUIRED SKILLS \npart is checked using \ndiagnostic tools to identify \nthe problem * \n3.3. Results of diagnosis and \ntesting are documented and \ncompleted within the \nspecified time. \n \n3.3. Drawing and Schematic \nDiagram  \no Reading and \ninterpreting electronic \nschematic diagram \nand symbols \n3.4. Safety  \no Work Safety \nrequirements and \neconomy of materials \nwith durability \n3.5. System and Processes \no Computer operation \no Electronic components \nand circuits \no Analysis of troubles \nand isolation \ntechniques \n3.6. Rules of effective \nbusiness communication \nin customer service \nskills \n3.5. Internet \nbrowsing and \nforum chatting \n3.6. Diagnosing \ntechniques \n3.7. Interpretation of \ndiagrams \n \n4. Determine \nthe software \nstatus of the \nunit/gadget \n4.1. Specific driver are installed, \nif necessary, based on \nunit/gadget model and \nbrand * \n4.2. Chipset is identified on \nunit/gadget model and \nbrand.  \n4.3. Unit/Gadget status is \nverified based on the \nappropriate software tools \n“READ” information \nresults/logs * \n4.4. Firmware backup is \nperformed to identify the \nappropriate firmware \nversions as per standard \nprocedure * \n4.5. Actual troubled/damaged \npart is checked using 3rd  \nparty software diagnostic \ntools to identify the \nproblem* \n4.6. Results of software \ndiagnosis and testing are \ndocumented and completed \nwithin the specified time. \n4.1. Knowledge in ‘boot \nmode’ of different mobile \nphones \n4.2. Knowledge in \ncompatibility of drivers \nfor mobile phone units \nand handheld gadgets \n4.3. Knowledge in \ncompatibility of firmware \nfor mobile phone and \nhandheld gadgets \n4.4. Knowledge in \ninterpreting data logs \n4.5. Knowledge in mobile \ndevice and handheld \ngadgets settings’ \nhardware specifications \n4.6. Firmware backup \nprocedures \n4.7. Mobile phone and \nhandheld gadget logic \nboard/circuit   \n4.8. identification \no Chipsets \n4.1. Reading skills \n4.2. Computer skills \n4.3. Internet \nbrowsing and \nforum chatting \n4.4. Skills in mobile \ndevice/phone \nand handheld \ngadgets \noperation \n4.5. Interpreting \ndata logs \n4.6. diagnostic skills \n4.7. documentation \nskills\n\n--- PDF PAGE 71 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- \nTR – Mobile Phones & Handheld Gadgets Servicing NC III   (ELCMPS321)      Promulgated February 9, 2021        67  \n \n \n       \n \n \n \n \n \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. unit/ gadget \nMay include: \n1.1. Mobile phone units \n1.1.1. Cellular phone \n1.1.2. Smart phone \n1.1.3. Phone-tablet \n1.2. Handheld gadgets \n1.2.1. Tablet \n1.2.2. iPad \n1.2.3. Notepad \n1.2.4. Portable media player \n1.2.5. e-Watch \n1.2.6. other similar gadgets \n2. Personal \nprotective \nequipment  \nMay include but not limited to: \n2.1. Working clothes/Apron \n2.2. Face/Dust Mask \n2.3. Goggles \n2.4. Anti-static mat \n2.5. Anti-static gloves \n2.6. Anti-static wrist strap \n3. OHS practices  \nMay include but not limited to: \n3.1. Use of proper tools and equipment \n3.2. Observe workplace environment and safety \n3.3. Adherence to safety requirements in handling the handheld \ngadgets \n3.4. Use of protective device/shields \n3.5. Proper ESD practices \n4. Chipset \nMay include but not limited to: \n4.1. Qualcomm \n4.2. MTK \n4.3. Spreadtrum\n\n--- PDF PAGE 72 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- \nTR – Mobile Phones & Handheld Gadgets Servicing NC III   (ELCMPS321)      Promulgated February 9, 2021        68  \n \n \n       \n \n \n \n \n \n \nEVIDENCE GUIDE \n \n1. Critical aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1. Assessed customer’s concern \n1.1.1. Determined pre-history trouble of the unit/gadget \naccording to the customer’s concern \n1.1.2. Advised/Informed customers regarding the status \nand serviceability of the unit \n1.2. Checked the condition of the unit/ gadget  \n1.2.1. Determined task requirements according to job \nspecifications \n1.2.2. Performed visual checking based on established \nprocedures \n1.3. Determined the hardware status of the unit/gadget  \n1.3.1. Used personal protective equipment (PPE) in \naccordance with Occupational Health and Safety \npractices \n1.3.2. Checked actual troubled/ damaged part using \ndiagnostic tools to identify the problem \n1.4. Determined the software status of the unit/gadget  \n1.4.1. Installed specific driver, if necessary, based on \nunit/gadget model and brand \n1.4.2. Verified unit/gadget status based on the appropriate \nsoftware tools “READ” information results/logs \n1.4.3. Performed firmware backup to identify the \nappropriate firmware versions as per standard \nprocedure \n1.4.4. Checked actual troubled/damaged part using 3rd  \nparty software diagnostic tools to identify the \nproblem \n2. Resource \nImplications \nThe following resources should be provided: \n2.1. Work area with sufficient lighting and ventilation system  \n2.2. Tools, equipment and test instruments  \n2.3. ESD free working area/bench  \n2.4. Appropriate handheld gadgets \n2.5. Service manuals/schematics  \n2.6. Desktop units / laptop and appropriate application software \n2.7. Complete handheld gadgets spare parts and accessories \n3. Methods of \nAssessment \nCompetency may be assessed through: \n3.1. Demonstration with oral questioning \n3.2. Written test \n3.3. Portfolio with interview \n \n4. Context for \nAssessment \n4.1. Competency may be assessed in actual workplace or at \nthe designated TESDA Accredited Assessment Center.\n",
