        "source_text": "--- PDF PAGE 37 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- \nTR – Mobile Phones & Handheld Gadgets Servicing NC III       (ELCMPS321)       Promulgated February 9, 2021      33  \n \nCOMMON COMPETENCIES \n \nUNIT TITLE \n:  USE HAND TOOLS     \nUNIT CODE \n: \nELC724201 \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge, skills and attitudes on the safe \nuse, handling and maintenance of tools. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized Bold terms are elaborated \nin the Range of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Plan and \nprepare for \ntasks to be \nundertaken \n1.1. Tasks to be undertaken are \nproperly identified \n1.2. Appropriate hand tools are \nidentified and selected \naccording to the task \nrequirements \n1.1. Planning and preparing \ntask/ activity \n1.2. Electronics hand tools \nand their uses \n1.3. Function, operation and \ncommon faults in \nelectronics hand tools \n1.1. Preparing \nrequired tasks \n1.2. Communication \nskills \n1.3. Using hand \ntools properly \n2. Prepare \nhand tools \n2.1. Appropriate hand tools are \nchecked for proper operation \nand safety \n2.2. Unsafe or faulty tools are \nidentified and marked for \nrepair according to standard \ncompany procedure \n2.1. Checking and  safety \nrequirements in handling \ntools   \n2.2. Standard procedures in \nchecking, identification \nand marking of safe or \nunsafe/ faulty tools \n2.1. Identifying and \nchecking  hand \ntools \n2.2. Marking of safe \nor unsafe/ faulty \nhand tools \n3. Use \nappropriate \nhand tools \nand test \nequipment \n3.1. Tools are used according to  \ntasks undertaken \n3.2. All safety procedures in \nusing tools are observed at \nall times and appropriate \npersonal protective \nequipment (PPE) are used \n3.3. Malfunctions, unplanned or \nunusual events are reported \nto the supervisor \n3.1. Safety requirements in \nusing electronics hand \ntools and test equipment   \n3.2. Electronics hand tools \nfor adjusting, \ndismantling, assembling, \nfinishing, and cutting. \n3.3. Processes, Operations, \nSystems \no Proper usage and \ncare of hand tools \no Types and uses of \ntest equipment \n3.4. Common faults in the \nuse of hand tool \n3.1. Reading skills \nrequired to  \ninterpret work \ninstruction and \nnumerical skills \n3.2. Using PPE \nproperly \n3.3. Problem solving \nin emergency \nsituation \n4. Maintain \nhand tools  \n4.1. Tools are handled without \ndamage according to \nprocedures. \n4.2. Routine maintenance of \ntools is undertaken according \nto standard operational \nprocedures, principles and \ntechniques \n4.3. Tools are stored safely in \nappropriate locations in \naccordance with \nmanufacturer’s specifications \nor standard operating \nprocedures \n4.1. Safety requirements in \nmaintenance of hand \ntools   \n4.2. Processes, Operations, \nSystems \no Maintenance of tools \no Storage of hand tools \n \n4.1. Checking and \ncleaning  hand \ntools \n4.2. Storing hand \ntools properly\n\n--- PDF PAGE 38 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- \nTR – Mobile Phones & Handheld Gadgets Servicing NC III       (ELCMPS321)       Promulgated February 9, 2021      34  \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Hand tools \n1.1. Hand tools for adjusting, dismantling, assembling, \nfinishing, cutting. Tool set includes the following but \nnot limited to: screw drivers, pliers, punches, \nwrenches, files \n2. Personal Protective \nEquipment (PPE) \n2.1. Gloves \n2.2. Protective eyewear \n2.3. Apron/overall \n3. Maintenance \n3.1. Cleaning \n3.2. Lubricating \n3.3. Tightening \n3.4. Simple tool repairs \n3.5. Hand sharpening \n3.6. Adjustment using correct procedures \n \n \n \nEVIDENCE GUIDE \n \n1. Critical aspect of \ncompetency \nAssessment requires evidence that the candidate: \n \n1.1. Demonstrated safe working practices at all  times \n1.2. Communicated information about processes, \nevents or tasks being undertaken to ensure a \nsafe and efficient working environment \n1.3. Planned  tasks in all situations and reviewed task \nrequirements as appropriate \n1.4. Performed  all tasks to specification \n1.5. Maintained and stored tools in appropriate \nlocation \n2. Method of assessment \nCompetency in this unit must be assessed through: \n2.1. Observation \n2.2. Oral questioning \n3. Resource Implication \n3.1. Tools may include the following but not limited to:  \n3.1.1. screw drivers  \n3.1.2. pliers \n3.1.3. punches  \n3.1.4. wrenches, files  \n \n4. Context of Assessment \n \n \n4.1. Assessment may be conducted in the workplace \nor in a simulated   environment\n",
