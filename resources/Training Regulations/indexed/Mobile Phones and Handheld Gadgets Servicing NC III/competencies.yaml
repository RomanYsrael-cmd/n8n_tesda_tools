        "source_title": "PROPOSE METHODS OF APPLYING LEARNING AND INNOVATION IN THE ORGANIZATION",
        "source_text": "--- PDF PAGE 21 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- \nTR – Mobile Phones & Handheld Gadgets Servicing NC III       (ELCMPS321)       Promulgated February 9, 2021      17  \n \nUNIT OF COMPETENCY:    PROPOSE METHODS OF APPLYING LEARNING AND \nINNOVATION IN THE ORGANIZATION \n \nUNIT CODE                     :    400311323 \n \nUNIT DESCRIPTOR        :    This unit covers the knowledge, skills and attitudes required to \nassess general obstacles in the application of learning and \ninnovation in the organization and to propose practical methods \nof such in addressing organizational challenges. \n \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated \nin the Range of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n1. Assess work \nprocedures, \nprocesses \nand systems \nin terms of \ninnovative \npractices \n1.1. Reasons for innovation \nare incorporated to work \nprocedures. \n1.2. Models of innovation \nare researched. \n1.3. Gaps or barriers to \ninnovation in one’s work \narea are analyzed. \n1.4. Staff who can support \nand foster innovation in \nthe work procedure are \nidentified. \n1.1 Seven habits of \nhighly effective \npeople. \n1.2 Character strengths \nthat foster \ninnovation and \nlearning \n(Christopher \nPeterson and Martin \nSeligman, 2004) \n1.3 Five minds of the \nfuture concepts \n(Gardner, 2007). \n1.4 Adaptation concepts \nin neuroscience \n(Merzenich, 2013). \n1.5 Transtheoretical \nmodel of behavior \nchange (Prochaska, \nDiClemente, & \nNorcross, 1992). \n1.1 Demonstrating \ncollaboration and \nnetworking skills. \n1.2 Applying basic \nresearch and \nevaluation skills \n1.3 Generating \ninsights on how to \nimprove \norganizational \nprocedures, \nprocesses and \nsystems through \ninnovation. \n2. Generate \npractical \naction plans \nfor improving \nwork \nprocedures, \nprocesses \n2.1 Ideas for innovative work \nprocedure to foster \ninnovation using \nindividual and group \ntechniques are \nconceptualized \n2.2 Range of ideas with \nother team members and \ncolleagues are evaluated \nand discussed \n2.3 Work procedures and \nprocesses subject to \nchange are selected \nbased on workplace \nrequirements (feasible \nand innovative). \n2.4 Practical action plans are \nproposed to facilitate \nsimple changes in the \nwork procedures, \nprocesses and systems. \n2.5 Critical inquiry is \napplied and used to \n2.1 Seven habits of \nhighly effective \npeople. \n2.2 Character strengths \nthat foster \ninnovation and \nlearning \n(Christopher \nPeterson and Martin \nSeligman, 2004) \n2.3 Five minds of the \nfuture concepts \n(Gardner, 2007). \n2.4 Adaptation concepts \nin neuroscience \n(Merzenich, 2013). \n2.5 Transtheoretical \nmodel of behavior \nchange (Prochaska, \nDiClemente, & \nNorcross, 1992). \n2.1 Assessing \nreadiness for \nchange on simple \nwork procedures, \nprocesses and \nsystems. \n2.2 Generating \ninsights on how to \nimprove \norganizational \nprocedures, \nprocesses and \nsystems through \ninnovation. \n2.3 Facilitating action \nplans on how to \napply innovative \nprocedures in the \norganization.\n\n--- PDF PAGE 22 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- \nTR – Mobile Phones & Handheld Gadgets Servicing NC III       (ELCMPS321)       Promulgated February 9, 2021      18  \n \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated \nin the Range of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \nfacilitate discourse on \nadjustments in the \nsimple work procedures, \nprocesses and systems. \n3. Evaluate the \neffectiveness \nof the \nproposed \naction plans \n3.1 Work structure is \nanalyzed to identify the \nimpact of the new work \nprocedures  \n3.2 Co-workers/key \npersonnel is consulted \nto know who will be \ninvolved with or affected \nby the work procedure \n3.3 Work instruction \noperational plan of the \nnew work procedure is \ndeveloped and \nevaluated. \n3.4 Feedback and \nsuggestion are \nrecorded. \n3.5 Operational plan is \nupdated. \n3.6 Results and impact on \nthe developed work \ninstructions are \nreviewed \n3.7 Results of the new work \nprocedure are \nevaluated \n3.8 Adjustments are \nrecommended based on \nresults gathered \n3.1 \nFive minds of the \nfuture concepts \n(Gardner, 2007). \n3.2 \nAdaptation \nconcepts in \nneuroscience \n(Merzenich, 2013). \n3.3 \nTranstheoretical \nmodel of behavior \nchange \n(Prochaska, \nDiClemente, & \nNorcross, 1992). \n3.1 Generating \ninsights on how \nto improve \norganizational \nprocedures, \nprocesses and \nsystems through \ninnovation. \n3.2 Facilitating \naction plans on \nhow to apply \ninnovative \nprocedures in \nthe organization. \n3.3 Communicating \nresults of the \nevaluation of the \nproposed and \nimplemented \nchanges in the \nworkplace \nprocedures and \nsystems. \n3.4 Developing \naction plans for \ncontinuous \nimprovement on \nthe basic \nsystems, \nprocesses and \nprocedures in \nthe organization.\n\n--- PDF PAGE 23 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- \nTR – Mobile Phones & Handheld Gadgets Servicing NC III       (ELCMPS321)       Promulgated February 9, 2021      19  \n \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Reasons \nMay include: \n1.1. Strengths and weaknesses of the current \nsystems, processes and procedures. \n1.2. Opportunities and threats of the current \nsystems, processes and procedures. \n2. Models of innovation \nMay include: \n2.1. Seven habits of highly effective people. \n2.2. Five minds of the future concepts (Gardner, \n2007). \n2.3. Neuroplasticity and adaptation strategies. \n3. Workplace \nrequirements \nMay include: \n3.1. Feasible \n3.2. Innovative  \n4. Gaps or barriers \nMay include: \n4.1. Machine \n4.2. Manpower \n4.3. Methods \n4.4. Money \n5. Critical Inquiry \nMay include: \n5.1. Preparation. \n5.2. Discussion. \n5.3. Clarification of goals. \n5.4. Negotiate towards a Win-Win outcome. \n5.5. Agreement. \n5.6. Implementation of a course of action. \n5.7. Effective verbal communication. See our pages: \nVerbal Communication and Effective Speaking. \n5.8. Listening. \n5.9. Reducing misunderstandings is a key part of \neffective negotiation. \n5.10. Rapport Building. \n5.11. Problem Solving. \n5.12. Decision Making. \n5.13. Assertiveness. \n5.14. Dealing with Difficult Situations.\n\n--- PDF PAGE 24 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- \nTR – Mobile Phones & Handheld Gadgets Servicing NC III       (ELCMPS321)       Promulgated February 9, 2021      20  \n \n \n \nEVIDENCE GUIDE \n \n1.   Critical aspects of \nCompetency \nAssessment requires evidence that the \ncandidate: \n1.1 \nEstablished the reasons why innovative \nsystems are required \n1.2 \nEstablished the goals of a new innovative \nsystem \n1.3 \nAnalyzed current organizational systems \nto identify gaps and barriers to innovation. \n1.4 \nAssessed work procedures, processes \nand systems in terms of innovative \npractices. \n1.5 \nGenerated practical action plans for \nimproving work procedures, and \nprocesses. \n1.6 \nReviewed the trial innovative work system \nand adjusted reflect evaluation feedback, \nknowledge management systems and \nfuture planning. \n1.7 \nEvaluated the effectiveness of the \nproposed action plans. \n2.   Resource Implications \nThe following resources should be provided: \n2.1 \nPens, papers and writing implements. \n2.2 \nCartolina. \n2.3 \nManila papers. \n3.   Methods of \nAssessment \nCompetency in this unit may be assessed \nthrough: \n3.1     Psychological and behavioral Interviews. \n3.2 \nPerformance Evaluation. \n3.3 \nLife Narrative Inquiry. \n3.4 \nReview of portfolios of evidence and third-\nparty workplace reports of on-the-job \nperformance. \n3.5 \nSensitivity analysis. \n3.6 \nOrganizational analysis. \n3.7 \nStandardized assessment of character \nstrengths and virtues applied. \n4.   Context for \nAssessment \n4.1    Competency may be assessed individually \nin the actual workplace or simulation \nenvironment in TESDA accredited \ninstitutions.\n",
