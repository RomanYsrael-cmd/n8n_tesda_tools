    },
    {
      "term": "Router",
      "definition": "is a device that forwards data packets along networks. A router is connected to at least two networks, commonly two LANs or WANs or a LAN and its ISP's network. Routers are located at gateways, the places where two or more networks connect. TR – Mobile Phones & Handheld Gadgets Servicing NC III (ELCMPS321) Promulgated February 9, 2021 126"
    },
    {
      "term": "Sensor: A transducer whose input is a physical phenomenon and whose output is a",
