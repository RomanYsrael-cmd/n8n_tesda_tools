    {
      "term": "Tablet",
      "definition": "is a mobile computer with a touchscreen display, circuitry, and battery in a single device. Tablets come equipped with sensors, including cameras, a microphone, and an accelerometer, and the touchscreen display uses the recognition of finger or stylus gestures replacing the usage of the mouse and keyboard. They usually feature on-screen, pop-up virtual keyboards for typing. Tablets may include physical buttons for basic features such as speaker volume and power, and ports for network communications and battery charging. Tablets are typically larger than smartphones or personal digital assistants at 7 inches (18 cm) or larger, measured diagonally."
    },
    {
      "term": "Touch screen",
      "definition": "is a display that also serves as an input device. Some touchscreens require a proprietary pen for input, though most modern touchscreens detect human touch. Since touchscreen devices accept input directly through the screen, they do not require external input devices, such as mice and keyboards. This makes touchscreens ideal for computer kiosks, as well as portable devices, such as tablets and smartphones."
    },
    {
      "term": "USB flash drive, also known under a variety of other names",
