      "term": "SIM card, also known as a subscriber identity module",
      "definition": "is a smart card that stores data for GSM mobile/cellular telephone subscribers. Such data includes user identity, location and phone number, network authorization data, personal security keys, contact lists and stored text messages. Security features include authentication and encryption to protect data and prevent eavesdropping."
    },
    {
      "term": "Software: The entire set of programs, procedures, and related documentation",
      "definition": "associated with a computer."
    },
    {
      "term": "Soft reset",
      "definition": "is a restart of a device, such as a smartphone, tablet, laptop or personal computer (PC). The action closes applications and clears any data in RAM (random access memory). Unsaved data in current use may be lost but data stored on the hard drive, applications and settings are not affected."
    },
    {
      "term": "Software stack",
      "definition": "it's made up of the operating system (the platform on which everything runs), the middleware (the programming that allows applications to talk to a network and to one another), and the applications (the actual programs that the phones will run). In short, the Android software stack is all the software that will make an Android phone an Android phone."
    },
