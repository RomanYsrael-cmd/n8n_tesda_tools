    {
      "term": "Android is a mobile operating system (OS) based on the Linux kernel and currently",
      "definition": "developed by Google. With a user interface based on direct manipulation, Android is designed primarily for touchscreen handheld gadgets such as smartphones and tablet computers, with specialized user interfaces for televisions (Android TV), cars (Android Auto), and wrist watches (Android Wear). The OS uses touch inputs that loosely correspond to real-world actions, like swiping, tapping, pinching, and reverse pinching to manipulate on-screen objects, and a virtual keyboard."
    },
    {
      "term": "Apple device",
      "definition": "typically refers to an iPhone, iPad or iPod rather than a Mac laptop; however, depending on context, the laptop might be included. Since \"device\" refers to hardware in general, Apple devices may encompass everything in the Apple line, including Mac desktop computers."
    },
    {
      "term": "Bluetooth",
      "definition": "is a wireless technology standard for exchanging data over short distances (using short-wavelength UHF radio waves in the ISM band from 2.4 to 2.485 GHz) from fixed and handheld gadgets, and building personal area networks (PANs). It can connect several devices, overcoming problems of synchronization."
    },
    {
      "term": "Broadband",
      "definition": "is a high-speed, high-capacity transmission medium that can carry signals from multiple independent network carriers. It is a high-capacity transmission technique using a wide range of frequencies, which enables a large number of messages to be communicated simultaneously."
    },
    {
      "term": "Card reader",
      "definition": "is a data input device that reads data from a card-shaped storage medium."
    },
    {
      "term": "Cellular phone",
      "definition": "see mobile phone definitions."
    },
    {
      "term": "Chat room",
      "definition": "a site on the internet where a number of users can communicate in real time (typically one dedicated to a particular topic)."
    },
    {
      "term": "Customer service",
      "definition": "is the provision of service to customers before, during and after a purchase. It is the process of ensuring customer satisfaction with a product or service. Often, customer service takes place while performing a transaction for the customer, such as making a sale or returning an item or replacing / repairing a product or device. Customer service can take the form of an in-person interaction, a phone call, self-service systems, or by other means."
    },
    {
      "term": "Digitizer",
      "definition": "device for converting analogue signals into digital signals."
    },
    {
      "term": "ESD",
      "definition": "Electrostatic discharge (ESD) - is the sudden flow of electricity between two electrically charged objects caused by contact, an electrical short or dielectric breakdown. A buildup of static electricity can be caused by turbocharging or by electrostatic induction. The ESD occurs when differently-charged objects are brought close together or when the dielectric between them breaks down, often creating a visible spark. TR – Mobile Phones & Handheld Gadgets Servicing NC III (ELCMPS321) Promulgated February 9, 2021 123"
    },
    {
      "term": "Flashers",
      "definition": "are a combination of software, hardware and drivers. There are many varieties of flasher boxes covering a wide variety of mobile phones. Therefore, choosing the correct box for a type of mobile phone device or phone model or mobile phone manufacturer can be a daunting task."
    },
    {
      "term": "Flasher box or flasher tool",
      "definition": "is a programming hardware and/or software that can be used to program (flash) the device memory, e.g., EEPROM or flash memory. These tools mainly originate from the manufacturer or service centers for debugging, repair, or upgrade services. They can overwrite the non-volatile memory and some, depending on the manufacturer or device, can also read the memory to make a copy, originally intended as a backup. The memory can be protected from reading, e.g., by software command or destruction of fuses in the read circuit."
    },
    {
      "term": "GSM box / dongle",
      "definition": "is a tool designed to repair software related problem of mobile phones and handheld gadgets. These devices can only be used in interface with personal computer/laptop."
    },
    {
      "term": "Flashing",
      "definition": "means reinstalling the operating system (OS) of the cell phone. In this process, we erase the entire OS and install a new OS. This will repair any problem that was there before due to the OS being corrupt."
    },
    {
      "term": "Functionality",
      "definition": "the quality or state of being functional; especially: the set of functions or capabilities associated with computer software or hardware or an electronic or mobile device."
    },
    {
      "term": "Gadget",
      "definition": "an often small mechanical or electronic device with a practical use but often thought of as a novelty."
    },
    {
      "term": "Handheld device",
      "definition": "is any portable device that can be carried and held in one's palm. A handheld can be any computing or electronic device that is compact and portable enough to be held and used in one or both hands. Typically, handheld gadgets are not as powerful as a computer, but modern handhelds increasingly include powerful dual-core processors, RAM, SD storage capacity, an operating system, and native and add-on applications. They are often powered by a dry cell lithium or similar battery. Moreover, these types of devices increasingly use a touch screen interface. Personal digital assistants (PDA), tablet PCs and portable media players are all considered handheld gadgets."
    },
    {
      "term": "Hard reset",
      "definition": "also known as a factory reset or master reset, is the restoration of a device to the state it was in when it left the factory. All settings, applications and data added by the user are removed. The term is often heard in reference to smartphones and tablets but laptop and desktop computers, as well as most other electronic devices, can usually be restored to factory conditions."
    },
    {
      "term": "Hot air gun or hot air station",
      "definition": "is used to heat devices and melt solder, and specialized tools are used to pick up and position often tiny components."
    },
    {
      "term": "IMEI",
      "definition": "International Mobile Equipment Identity (IMEI) is a unique 15 digit international serial number used to identify a mobile phone handset to a mobile phone network. This number can used to identify illegal mobile phone handsets. Each time a mobile phone is switched on or a call is made on it, the network provider checks the IMEI TR – Mobile Phones & Handheld Gadgets Servicing NC III (ELCMPS321) Promulgated February 9, 2021 124 number of the handset, then it cross references it with a blacklist register. If it is on the blacklist then the network will either refuse to send a signal to the phone or will supply a signal but will not allow any outgoing or incoming calls."
    },
    {
      "term": "Internet",
      "definition": "an electronic communications network that connects computer networks and organizational computer facilities around the world the Internet is a public, cooperative and self-sustaining facility accessible to hundreds of millions of people worldwide."
    },
    {
      "term": "Internet browser",
      "definition": "is the program that you use to access the internet and view web pages on your computer. Some common internet browser examples include - Microsoft Internet Explorer; Mozilla Firefox; AOL Explorer; Apple Safari and Opera."
    },
    {
      "term": "Internet browsing",
      "definition": "exploration of the World Wide Web by following one interesting link to another, usually with a definite objective but without a planned search strategy. In comparison 'surfing' is exploration without a definite objective or search strategy, and 'searching' are exploration definite in both objective and strategy."
    },
    {
      "term": "iOS",
      "definition": "(formerly iPhone OS) is a mobile operating system created and developed by Apple Inc. exclusively for its hardware. It is the operating system that presently powers many of the company's mobile devices, including the iPhone, and iPod Touch; it also powered the iPad prior to the introduction of iPadOS in 2019."
    },
    {
      "term": "LTE (Long Term Evolution)",
      "definition": "is a wireless broadband technology designed to support roaming Internet access via cell phones and handheld gadgets."
    },
    {
      "term": "Memory card reader",
      "definition": "is a device for accessing the data on a memory card such as a CompactFlash (CF), Secure Digital (SD) or Multi-Media Card (MMC)."
    },
    {
      "term": "Memory card (sometimes called a flash memory card or a storage card)",
      "definition": "is a small storage medium used to store data such as text, pictures, audio, and video, for use on small, portable or remote computing devices."
    },
    {
      "term": "Mobile application",
      "definition": "also called mobile apps, it is a term used to describe Internet applications that run on smartphones and other mobile devices. Mobile applications usually help users by connecting them to Internet services more commonly accessed on desktop or notebook computers, or help them by making it easier to use the Internet on their portable devices. A mobile app may be a mobile site bookmarking utility, a mobile-based instant messaging client, Gmail for mobile, and many other applications."
    },
    {
      "term": "Mobile broadband",
      "definition": "is a wireless technology that allows you to connect a mobile device such as your smartphone or tablet to a broadband internet connection wirelessly through a mobile phone network."
    },
    {
      "term": "Mobile operating system (OS)",
      "definition": "is software that allows smartphones, tablet PCs and other devices to run applications and programs. A mobile OS typically starts up when a device powers on, presenting a screen with icons or tiles that present information and provide application access. Mobile operating systems also manage mobile/cellular and wireless network connectivity, as well as phone access. TR – Mobile Phones & Handheld Gadgets Servicing NC III (ELCMPS321) Promulgated February 9, 2021 125"
    },
    {
      "term": "Mobile phone",
      "definition": "is an electronic telecommunication device, often referred to as cellular phone or cellphone or. These communication devices connect to a wireless communications network through radio waves or satellite transmissions. Most mobile phones provide voice communications, Short Message Service (SMS), Multimedia Message Service (MMS), and newer phones may also provide Internet services such as Web browsing, instant messaging capabilities and e-mail."
    },
    {
      "term": "Modem",
      "definition": "(modulator-demodulator) is a device that modulates signals to encode digital information and demodulates signals to decode the transmitted information. The goal is to produce a signal that can be transmitted easily and decoded to reproduce the original digital data."
    },
    {
      "term": "Open-source",
      "definition": "means that you can get the source code of the software for free (source code is the code of the program written in a certain programing language)."
    },
    {
      "term": "Online Forum",
      "definition": "An Internet forum, or message board, is an online discussion site where people can hold conversations in the form of posted messages"
    },
    {
      "term": "Service center",
      "definition": "an authorized commercial establishment or a store where you can buy the products, parts for the products that are sold there, and can have the products repaired or replaced."
    },
    {
      "term": "Service manual",
      "definition": "is a handbook published by a product manufacturer or a specialized servicing company that contains instructions and specifications for the maintenance and repair of specific product. They also include wiring diagrams and troubleshooting guides. Most service manuals deal with only one make, model, or year, and nearly all are intended for professionals, technicians or the very experienced amateur."
    },
    {
      "term": "Smartphone",
      "definition": "is handheld device/gadget that integrates mobile phone capabilities with the more common features of a handheld computer or PDA. Smartphones allow users to store information, e-mail, and install programs, along with using a mobile phone in one device. A smartphone's features are usually more oriented towards mobile phone options than the PDA-like features. There is no industry standard for what defines a smartphone, so any mobile device that has more than basic cellphone capabilities can actually be filed under the smartphone category of devices/gadgets."
    },
    {
      "term": "SRT",
