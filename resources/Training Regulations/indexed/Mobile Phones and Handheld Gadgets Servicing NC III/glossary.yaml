    {
      "term": "Underpinning Skills",
      "definition": "refers to the list of the skills needed to achieve the elements and performance criteria in the unit of competency. It includes generic and industry specific skills"
    },
    {
      "term": "Unit of Competency",
      "definition": "is a component of the competency standards stating a specific key function or role in a particular job or occupation; it is the smallest component of achievement that can be assessed and certified under the PTQF TR – Mobile Phones & Handheld Gadgets Servicing NC III (ELCMPS321) Promulgated February 9, 2021 122 SECTOR SPECIFIC"
