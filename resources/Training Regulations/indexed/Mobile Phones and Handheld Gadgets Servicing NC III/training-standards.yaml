  "source_section_text": "SECTION 3 TRAINING ARRANGEMENTS\n\nThis set of standards provides Technical and Vocational Education and Training\n(TVET) providers with information and other important requirements to consider when\ndesigning training programs for Mobile Phones and Handheld Gadgets Servicing NC III.\n\n3.1\nCURRICULUM DESIGN\n\nTESDA shall provide the training on the development of competency-based\ncurricula to enable training providers develop their own curricula with the\ncomponents mentioned below.\n\nDelivery of knowledge requirements for the basic, common and core units of\ncompetency specifically in the areas of mathematics, science/technology,\ncommunication/language and other academic subjects shall be contextualized. To\nthis end, TVET providers shall develop a Contextual Learning Matrix (CLM) to\naccompany their curricula.\n\nCourse Title: Mobile Phones & Handheld Gadgets Servicing NC Level: NC III\n\nNominal Training Duration:\n\n 40 hours – Basic Competencies\n\n 52 hours – Common Competencies\n\n 280 hours – Core Competencies\n\n------------------\n\n 372 hours – Total (in-school / in-center)\n\n 300 hours – Supervised Industry Learning (SIL)\n\n------------------\n\n 672 hours\n\nCourse Description:\n\nThis course is designed to provide the learner with knowledge, practical\nskills and attitude, applicable in performing work activities involve in preparing\nworkplace for servicing mobile phone unit and handheld gadget, diagnosing and\nidentifying hardware and software related problems, troubleshooting and repairing\nmobile phone and handheld gadget and performing functionality testing and\ndocumentation. This includes classroom learning activities and practical work in\nactual work site or simulation area.\n\nUpon completion of the course, the learners are expected to demonstrate\nthe above-mentioned competencies to be employed. To obtain this, all units\nprescribed for this qualification must be achieved:\n\n--- PDF PAGE 87 ---\n-----------