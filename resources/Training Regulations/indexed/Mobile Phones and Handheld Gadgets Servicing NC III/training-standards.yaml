es and Handheld Gadgets Servicing NC III\n\n•\nMust be a holder of National TVET Trainer’s Certificate (NTTC) I in Mobile\nPhones and Handheld Device Servicing NC III\n\n•\nMust have at least three (3) years relevant industry experience in mobile devices\nservicing within the last six (6) years.\n\n--- PDF PAGE 119 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Mobile Phones & Handheld Gadgets Servicing NC III (ELCMPS321) Promulgated February 9, 2021 115\n\n3.7 INSTITUTIONAL ASSESSMENT\n\nInstitutional assessment is undertaken by trainees to determine their\nachievement of units of competency. A certificate of achievement is issued for each\nunit of competency. It is recommended that a comprehensive written examination\ncovering the basic, common and core competencies be administered at the end of\nthe training.\n\n--- PDF PAGE 120 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Mobile Phones & Handheld Gadgets Servicing NC III (ELCMPS321) Promulgated February 9, 2021 116"
