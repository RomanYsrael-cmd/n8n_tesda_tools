  "source_section_text": "SECTION 3 TRAINING ARRANGEMENTS\n\nThis set of standards provides Technical and Vocational Education and Training\n(TVET) providers with information and other important requirements to consider when\ndesigning training programs for Mobile Phones and Handheld Gadgets Servicing NC III.\n\n3.1\nCURRICULUM DESIGN\n\nTESDA shall provide the training on the development of competency-based\ncurricula to enable training providers develop their own curricula with the\ncomponents mentioned below.\n\nDelivery of knowledge requirements for the basic, common and core units of\ncompetency specifically in the areas of mathematics, science/technology,\ncommunication/language and other academic subjects shall be contextualized. To\nthis end, TVET providers shall develop a Contextual Learning Matrix (CLM) to\naccompany their curricula.\n\nCourse Title: Mobile Phones & Handheld Gadgets Servicing NC Level: NC III\n\nNominal Training Duration:\n\n 40 hours – Basic Competencies\n\n 52 hours – Common Competencies\n\n 280 hours – Core Competencies\n\n------------------\n\n 372 hours – Total (in-school / in-center)\n\n 300 hours – Supervised Industry Learning (SIL)\n\n------------------\n\n 672 hours\n\nCourse Description:\n\nThis course is designed to provide the learner with knowledge, practical\nskills and attitude, applicable in performing work activities involve in preparing\nworkplace for servicing mobile phone unit and handheld gadget, diagnosing and\nidentifying hardware and software related problems, troubleshooting and repairing\nmobile phone and handheld gadget and performing functionality testing and\ndocumentation. This includes classroom learning activities and practical work in\nactual work site or simulation area.\n\nUpon completion of the course, the learners are expected to demonstrate\nthe above-mentioned competencies to be employed. To obtain this, all units\nprescribed for this qualification must be achieved:\n\n--- PDF PAGE 87 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Mobile Phones & Handheld Gadgets Servicing NC III (ELCMPS321) Promulgated February 9, 2021 83\n\nBASIC COMPETENCIES\n(40 hrs)\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n1. Lead\nworkplace\ncommunication\n1.1. Communicate\ninformation\nabout\nworkplace\nprocesses\n• Read\no Effective verbal communication methods\no Sources of information\n• Practice organizing information\n• Identify organization requirements for written\nand electronic communication methods\n• Follow organization requirements for the\nuse of written and electronic communication\nmethods\n• Perform exercises on understanding and\nconveying intended meaning scenario\n• Lecture\n• Demonstration\n• Practical exercises\n• Role Play\n• Written Test\n• Observation\n2 Hours\n1.2. Lead workplace\ndiscussions\n• Describe:\no Organizational policy on production,\nquality and safety\no Goals/ objectives and action plan setting\n• Read\no Effective verbal communication methods\n• Prepare/set action plans based on\norganizational goals and objectives\n• Group discussion\n• Lecture\n• Demonstration\n• Oral evaluation\n• Written Test\n• Observation\n2 Hours\n1.3. Identify and\ncommunicate\nissues arising in\nthe workplace\n• Describe:\no Organizational policy in dealing with\nissues and problems\n• Read\no Effective verbal communication methods\n• Group discussion\n• Lecture\n• Oral evaluation\n• Written Test\n2 Hours\n2. Lead small\nteams\n2.1. Provide team\nleadership\n• Discussion of Company policies and\nprocedures\n• Read web pages on situational leadership\n• Role play on situational leadership\n• Group work\n• Role Play\n• Lecture/\nDiscussion\n• Individual Work\n• Role Play\n• Written Test\n1 Hour\n\n--- PDF PAGE 88 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Mobile Phones & Handheld Gadgets Servicing NC III (ELCMPS321) Promulgated February 9, 2021 84\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n2.2. Assign\nresponsibilities\n• Read web pages on performance\nmanagement\n• Case study on allocating roles and\nresponsibilities based on competencies of\ncurrent staff\n• Individual Work\n• Case Study\n• Role Play\n• Written Test\n1 Hour\n2.3. Set\nperformance\nexpectations for\nteam members\n• Role play to communicate performance\nexpectations with staff\n• Discussion on performance issues\n• Lecture/\nDiscussion\n• Role Play\n• Role Play\n• Written Test\n\n1 Hour\n2.4. Supervise team\nperformance\n• Discussion on performance monitoring\n• Role play on providing feedback on\nperformance\n• Role play on performance coaching\n• Discussion on keeping the team informed of\nteam performance\n• Case study on Team performance\nmonitoring and feedback\n• Lecture/\nDiscussion\n• Role Play\n• Case Study\n• Role Play\n• Written Test\n1 Hour\n3. Apply critical\nthinking and\nproblem-\nsolving\ntechniques in\nthe workplace\n3.1. Examine\nspecific\nworkplace\nstrategies\n• Show thorough knowledge and\nunderstanding of the process, normal\noperating parameters, and product quality to\nrecognize non-standard situations\n• Show mastery of the current industry\nhardware and software products and\nservices\n• Discuss process of identification of\nfundamental causes of specific workplace\nchallenges\n• Show mastery of knowledge and\nunderstanding of the process, normal\noperating parameters, and product quality to\nrecognize non-standard situations\n- Relevant equipment and operational\nprocesses\n- Enterprise goals, targets and measures\n• Group discussion\n• Lecture\n• Demonstration\n• Role playing\n• Case Formulation\n• Life Narrative Inquiry\n(Interview)\n• Standardized test\n1 Hour\n\n--- PDF PAGE 89 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Mobile Phones & Handheld Gadgets Servicing NC III (ELCMPS321) Promulgated February 9, 2021 85\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n- Enterprise quality OHS and\nenvironmental requirement\n- Enterprise information systems and data\ncollation\n- Industry codes and standards\n\n3.2. Analyze the\ncauses of\nspecific\nworkplace\nchallenges\n• Show thorough knowledge and\nunderstanding of the process, normal\noperating parameters, and product quality to\nrecognize non-standard situations\n• Show mastery of the current industry\nhardware and software products and\nservices\n• Discuss process of identification of\nfundamental causes of specific workplace\nchallenges\n• Show mastery of knowledge and\nunderstanding of the process, normal\noperating parameters, and product quality to\nrecognize non-standard situations\n- Relevant equipment and operational\nprocesses\n- Enterprise goals, targets and measures\n- Enterprise quality OHS and\nenvironmental requirement\n- Enterprise information systems and data\ncollation\n- Industry codes and standards\n• Identify extent and causes of specific\nchallenges in the workplace\n• Use of range of analytical problem-solving\ntechniques\n• Formulate clear-cut findings on the nature of\neach identified workplace challenges\n• Group discussion\n• Lecture\n• Demonstration\n• Role playing\n• Case Formulation\n• Life Narrative Inquiry\n(Interview)\n• Standardized test\n1 Hour\n\n--- PDF PAGE 90 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Mobile Phones & Handheld Gadgets Servicing NC III (ELCMPS321) Promulgated February 9, 2021 86\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n3.3. Formulate\nresolutions to\nspecific\nworkplace\nchallenges\n• Show thorough knowledge and\nunderstanding of the process, normal\noperating parameters, and product quality to\nrecognize non-standard situations\n• Show mastery of the current industry\nhardware and software products and\nservices\n• Discuss process of identification of\nfundamental causes of specific workplace\nchallenges\n• Show mastery of knowledge and\nunderstanding of the process, normal\noperating parameters, and product quality to\nrecognize non-standard situations\n- Relevant equipment and operational\nprocesses\n- Enterprise goals, targets and measures\n- Enterprise quality OHS and\nenvironmental requirement\n- Enterprise information systems and data\ncollation\n- Industry codes and standards\n• Identify extent and causes of specific\nchallenges in the workplace\n• Use of range of analytical problem-solving\ntechniques\n• Formulate clear-cut findings on the nature of\neach identified workplace challenges\n• Discus strategies on devising,\ncommunicating, implementing and\nevaluating strategies and techniques in\naddressing specific workplace challenges\n\n• Group discussion\n• Lecture\n• Demonstration\n• Role playing\n• Case Formulation\n• Life Narrative Inquiry\n(Interview)\n• Standardized test\n1 Hour\n\n--- PDF PAGE 91 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Mobile Phones & Handheld Gadgets Servicing NC III (ELCMPS321) Promulgated February 9, 2021 87\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n3.4. Implement\naction plans\nand\ncommunicate\nresults\n• Identify extent and causes of specific\nchallenges in the workplace\n• Use of range of analytical problem-solving\ntechniques\n• Formulate clear-cut findings on the nature of\neach identified workplace challenges\n• Discus strategies on devising,\ncommunicating, implementing and\nevaluating strategies and techniques in\naddressing specific workplace challenges\n• Group discussion\n• Lecture\n• Demonstration\n• Role playing\n• Case Formulation\n• Life Narrative Inquiry\n(Interview)\n• Standardized test\n1 Hour\n4. Work in a\nDiverse\nEnvironment\n4.1. Develop an\nindividual’s\ncultural\nawareness and\nsensitivity\n• Show understanding of cultural diversity in\nthe workplace\n• Recognize norms of behavior for interacting\nand dialogue with specific groups (e. g.,\nMuslims and other non-Christians, non-\nCatholics, tribes/ethnic groups, foreigners)\n• Demonstrate different methods of verbal and\nnon-verbal communication in a multicultural\nsetting\n• Apply cross-cultural communication skills\n(i.e. different business customs, beliefs,\ncommunication strategies)\n• Show affective skills – establishing rapport\nand empathy, understanding, etc.\n• Demonstrate openness and flexibility in\ncommunication\n• Recognize diverse groups in the workplace\nand community as defined by divergent\nculture, religion, traditions and practices\n• Small Group\nDiscussion\n• Interactive Lecture\n• Brainstorming\n• Demonstration\n• Role-playing\n• Demonstration or\nsimulation with oral\nquestioning\n• Group discussions\nand interactive\nactivities\n• Case studies/\nproblems involving\nworkplace diversity\nissues\n• Written examination\n• Role Playing\n1 Hour\n4.2. Work effectively\nin an\nenvironment\nthat\nacknowledges\n• Explain the value of diversity in the economy\nand society in terms of Workforce\ndevelopment\n• Discuss the importance of inclusiveness in a\ndiverse environment\n• Small Group\nDiscussion\n• Interactive Lecture\n• Brainstorming\n• Demonstration\n• Demonstration or\nsimulation with oral\nquestioning\n• Group discussions\nand interactive\n1 Hour\n\n--- PDF PAGE 92 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Mobile Phones & Handheld Gadgets Servicing NC III (ELCMPS321) Promulgated February 9, 2021 88\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\nand values\ncultural diversity\n• Discuss the importance of shared vision and\nunderstanding of and commitment to team,\ndepartmental, and organizational goals and\nobjectives\n• Identify and exhibit strategies for customer\nservice excellence\n• Demonstrate cross-cultural communication\nskills and active listening\n• Recognize diverse groups in the workplace\nand community as defined by divergent\nculture, religion, traditions and practices\n• Demonstrate collaboration skills\n• Role-playing\nactivities\n• Case studies/\nproblems involving\nworkplace diversity\nissues\n• Written examination\n• Role Playing\n4.3. Identify\ncommon issues\nin a multicultural\nand diverse\nenvironment\n• Explain the value, and leverage of cultural\ndiversity\n• Discuss the inclusivity and conflict resolution\n• Describe the workplace harassment\n• Explain the change management and cite\nways to overcome resistance to change\n• Demonstrate advanced strategies for\ncustomer service excellence\n• Address diversity-related conflicts in the\nworkplace\n• Eliminate discriminatory behavior towards\ncustomers and co-workers\n• Utilize change management policies in the\nworkplace\n• Small Group\nDiscussion\n• Interactive Lecture\n• Brainstorming\n• Demonstration\n• Role-playing\n• Demonstration or\nsimulation with oral\nquestioning\n• Group discussions\nand interactive\nactivities\n• Case studies/\nproblems involving\nworkplace diversity\nissues\n• Written examination\n• Role Playing\n1 Hour\n5. Propose\nmethods of\