lized\n• Written exam\n• Practical exam\n• Demonstration\n• Oral questioning\n• Written report\n8 hours\n\n--- PDF PAGE 114 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Mobile Phones & Handheld Gadgets Servicing NC III (ELCMPS321) Promulgated February 9, 2021 110\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodologies\nAssessment\nApproach\nNominal\nDuration\n• Record service information on the quality and other\nindicators of service performance\nLearning\n• Hands on/\nPractical\nexercises\n\n• Supervise Industry Learning\n\n50 hours\n\n--- PDF PAGE 115 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Mobile Phones & Handheld Gadgets Servicing NC III (ELCMPS321) Promulgated February 9, 2021 111\n\n3.2\nTRAINING DELIVERY\n\n1. The delivery of training shall adhere to the design of the curriculum. Delivery shall\nbe guided by the principles of competency-based TVET.\n\na. Course design is based on competency standards set by the industry or\nrecognized industry sector; (Learning system is driven by competencies written\nto industry standards)\nb. Training delivery is learner-centered and should accommodate individualized\nand self-paced learning strategies;\nc. Training can be done on an actual workplace setting, simulation of a workplace\nand/or through adoption of modern technology.\nd. Assessment is based in the collection of evidence of the performance of work\nto the industry required standards;\ne. Assessment of competency takes the trainee’s knowledge and attitude into\naccount but requires evidence of actual performance of the competency as the\nprimary source of evidence.\nf. Training program allows for recognition of prior learning (RPL) or current\ncompetencies;\ng. Training completion is based on satisfactory performance of all specified\ncompetencies.\n\n2. The competency-based TVET system recognizes various types of delivery modes,\nboth on-and off-the-job as long as the learning is driven by the competency\nstandards specified by the industry. The following training modalities and their\nvariations/components may be adopted singly or in combination with other\nmodalities when designing and delivering training programs:\n\n2.1. Institution- Based:\n\n• Dual Training System (DTS)/Dualized Training Program (DTP) which\ncontain both in-school and in-industry training or fieldwork components.\nDetails can be referred to the Implementing Rules and Regulations of the\nDTS Law and the TESDA Guidelines on the DTP;\n\n• Distance learning is a formal education process in which majority of the\ninstruction occurs when the students and instructor are not in the same\nplace. Distance learning may employ correspondence study, audio, video,\ncomputer technologies or other modern technology that can be used to\nfacilitate learning and formal and non-formal training. Specific guidelines\non this mode shall be issued by the TESDA Secretariat.\n\n•\nSupervised Industry Learning (SIL) or on-the-job training (OJT) is an\napproach in training designed to enhance the knowledge and skills of the\ntrainee through actual experience in the workplace to acquire specific\ncompetencies as prescribed in the training regulations. It is imperative that\nthe deployment of trainees in the workplace is adhered to training\nprograms agreed by the institution and enterprise and status and progress\nof trainees are closely monitored by the training institutions to prevent\nopportunity for work exploitation.\n\n--- PDF PAGE 116 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Mobile Phones & Handheld Gadgets Servicing NC III (ELCMPS321) Promulgated February 9, 2021 112\n\n• The classroom-based or in-center instruction uses learner-centered\nmethods as well as laboratory or field-work components.\n\n2.2. Enterprise-Based:\n\n• Formal Apprenticeship is training within employment involving a contract\nbetween an apprentice and an enterprise on an approved apprenticeable\noccupation.\n\n• Informal Apprenticeship is based on a training (and working) agreement\nbetween an apprentice and a master craftsperson wherein the agreement\nmay be written or oral and the master craftsperson commits to training the\napprentice in all the skills relevant to his or her trade over a significant\nperiod of time, usually between one and four years, while the apprentice\ncommits to contributing productively to the work of the business. Training\nis integrated into the production process and apprentices learn by working\nalongside the experienced craftsperson.\n\n• Enterprise-based Training where training is implemented within the\ncompany in accordance with the requirements of the specific company.\nSpecific guidelines on this mode shall be issued by the TESDA\nSecretariat.\n\n2.3. Community-Based\n\n• Community-Based is short term programs conducted by non-government\norganizations (NGOs), LGUs, training centers and other TVET providers\nwhich are intended to address the specific needs of a community. Such\nprograms can be conducted in informal settings such as barangay hall,\nbasketball courts, etc. These programs can also be mobile training\nprogram (MTP).\n\n3.3\nTRAINEE ENTRY REQUIREMENTS\n\nThe trainees or students who wish to enroll in this program must possess the\nfollowing requirements:\n\n• Have completed at least 10 yrs. basic education or an alternative learning\nsystems (ALS) certificate of completion with grade 10 equivalent holder\n• Communicate effectively both oral and written form\n• Can perform basic mathematical computations\n\nThis list does not include specific institutional requirements such as written\nentrance exam, and other that may be required of the trainees by the school or\ntraining center delivering TVET program.\n\n--- PDF PAGE 117 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Mobile Phones & Handheld Gadgets Servicing NC III (ELCMPS321) Promulgated February 9, 2021 113\n\n3.4 LIST OF TOOLS, EQUIPMENT AND MATERIALS\n\nRecommended list of tools, equipment and materials for the training of 20\ntrainees for Mobile Phones and Handheld Gadgets Servicing NC III.\n\nUp-to-date tools, materials, and equipment of equivalent functions can be used\nas alternatives. This also applies in consideration of community practices and their\navailability in the local market.\n\nTOOLS\nQty.\nUnit\nDescription/Specification\n20\npcs\nSoldering iron, 40W / 60W\n20\npcs\nSoldering stand\n10\npcs\nDesoldering tools\n20\npcs\nTweezer\n10\npcs\nOpening tool (SRT type)\n20\nsets\nBlade cutter/scissor\n10\nsets\nPrecision screwdrivers, assorted\n10\nsets\nSet of torx/star bit\n20\npcs\nMulti-testers (analog/digital)\n20\nsets\nPliers, assorted\n2\npcs\nFlat file\n20\npcs\nPCB holder\n20\npcs\nAnti-static mat, small\n4\npcs\nHeating pad\n5\npcs\nUSB cable\n5\nsets\nCharger, for mobile phone/handheld gadget, assorted\n1\nsubscription\nInternet connection, at least 25 Mbps\n\n GSM box/dongle\n1\nset\nZ3X box\n1\nset\nCM2 dongle\n1\nset\nMRT dongle\n1\nset\nSchematic applications (dongle)\nAs required\nset\nAppropriate GSM box/software tools for mobile phone and\nhandheld gadgets model and brand\n\nEQUIPMENT\nQty.\nUnit\nDescription/Specification\n4\nunits\nDesktop computer/ laptop with appropriate operating system (32-/\n64-bits), at least i3, 8 GB RAM, 120 GB SSD\n4\nunits\nMobile phone, assorted model with parts (for demo)\n4\nunits\nTablet/iPad, assorted model with parts (for demo)\n4\nunits\nPower Supply-variables\n1\nunit\nOscilloscope (optional)\n4\nunits\nRework station (Hot air) with soldering tool\n4\nunits\nHigh-grade magnifying glass with lamp\n1\nunit\nTrinocular microscope\n10\npcs\nFlashlight\n1\nunit\nModem/router\n1\nunit\nLCD projector\n\nPPEs\n20\npcs\nFace/Dust Mask\n20\npairs\nAnti-static gloves\n20\npcs\nGoggles/eye protector\n\n--- PDF PAGE 118 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Mobile Phones & Handheld Gadgets Servicing NC III (ELCMPS321) Promulgated February 9, 2021 114\n\nMATERIALS\nQty.\nUnit\nDescription/Specification\n20\npcs\nAssorted mobile phone logic board with parts\n20\npcs\nAssorted handheld gadgets logic board with parts\n20\npcs\nPower switch, assorted\n20\npcs\nCharging pin, assorted\n20\npcs\nMouthpiece/Buzzer/Earpiece, assorted\n20\npcs\nPlastic container, small (for screw)\n4\nsets\nMemory card reader\n4\nroll\nmagnetic wires/jumper wire\n4\nsets\nUSB cable, assorted\n4\nroll\nSoldering lead\n4\npcs\nSoldering wick\n4\ncans\nSoldering paste\n4\ncans\nFlux\n4\ntubes\nAdhesive paste\n4\nbottles\nAnti-adhesive liquid\n1\nroll\nKapton tape\n4\nbottles\nCleaning agent\n20\npcs\nCleaning brush\n1\nunit\nWhite board\n10\npcs\nWhite board marker (assorted color)\n\n3.5 TRAINING FACILITIES\n\nBased on class size of 25 students/trainees the space requirements for the\nteaching/learning and circulation areas are as follows:\n\nTEACHING/LEARNING AREAS\nSIZE IN\nMETERS\nAREA IN SQ.\nMETERS\nQTY\nTOTAL AREA IN\nSQ. METERS\nLecture/Laboratory Area\n5 x 8\n40\n1\n40\nLearning Resource Area\n4 x 5\n20\n1\n20\nTool Room / Storage Area\n2 x 2\n4\n1\n4\nWash ,Toilet & Locker Room\n1 x 2\n2\n2\n4\n Total\n68\nFacilities /Equipment/Circulation**\n\n20\n Total Area\n\n88\n\n** Area requirement is equivalent to 30% of the total teaching/learning areas\n\n3.6 TRAINERS QUALIFICATIONS\n\nMobile Phones and Handheld Gadgets Servicing NC III\n\n•\nMust be a holder of National TVET Trainer’s Certificate (NTTC) I in Mobile\nPhones and Handheld Device Servicing NC III\n\n•\nMust have at least three (3) years relevant industry experience in mobile devices\nservicing within the last six (6) years.\n\n--- PDF PAGE 119 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Mobile Phones & Handheld Gadgets Servicing NC III (ELCMPS321) Promulgated February 9, 2021 115\n\n3.7 INSTITUTIONAL ASSESSMENT\n\nInstitutional assessment is undertaken by trainees to determine their\nachievement of units of competency. A certificate of achievement is issued for each\nunit of competency. It is recommended that a comprehensive written examination\ncovering the basic, common and core competencies be administered at the end of\nthe training.\n\n--- PDF PAGE 120 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Mobile Phones & Handheld Gadgets Servicing NC III (ELCMPS321) Promulgated February 9, 2021 116"
