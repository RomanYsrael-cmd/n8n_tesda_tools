cedure\no mobile device and handheld gadgets settings’\nhardware specifications\no Firmware versions\no Firmware installation procedure\n• identify firmware version of the mobile phone unit\nhandheld gadgets\n• check battery life percentage of the mobile phone\nunits and handheld gadgets\n• perform formatting of user data\n• install compatible firmware version based on mobile\nphone units’ and handheld gadgets’ model/brand\n• restore backup and default settings\n• Lecture/\nDiscussion\n• Demonstration\n• Viewing\nmultimedia\n• Individualized\nLearning\n• Hands on/\nPractical\nexercises\n\n• Written exam\n• Practical exam\n• Demonstration\n• Oral questioning\n• Written report\n32 hours\n3.5. Reassemble\nunit/ gadget\n• Lecture and discussion on:\no mobile phone unit and handheld gadget parts\nassembly and disassembly\no Normal working condition of mobile phone unit\nand handheld gadget\n• Perform reassembly of mobile phone units and\nhandheld gadgets\n• Install accessories to the units/gadgets\n• Clean repaired units/ gadgets\n• Document service completion and procedures\n• Disposed waste materials properly\n• Lecture/\nDiscussion\n• Demonstration\n• Viewing\nmultimedia\n• Individualized\nLearning\n• Hands on/\nPractical\nexercises\n• Written exam\n• Practical exam\n• Demonstration\n• Oral questioning\n• Written report\n8 hours\n\n• Supervise Industry Learning\n\n100 hours\n\n--- PDF PAGE 113 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Mobile Phones & Handheld Gadgets Servicing NC III (ELCMPS321) Promulgated February 9, 2021 109\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodologies\nAssessment\nApproach\nNominal\nDuration\n4. Perform\nFunctionality\nTesting and\nDocumentation\n\n32 hours\n\n4.1. Check the\nfunctionality of\nthe mobile\nphone unit/\nhandheld\ngadgets\n• Lecture and discussion on:\