  "source_text": "Section 1. Successful candidates shall be awarded a National\nCertificate III signed by the TESDA Director General.\n\n4.1.2. The qualification of Mobile Phones and Handheld Gadgets Servicing NC III\nmay be attained through demonstration of competence through project-type\nassessment covering all the units of competency required in the qualification.\n\n4.1.3. Assessment shall focus on the core units of competency. The basic and common\nunits shall be integrated or assessed concurrently with the core units.\n\n4.1.4. Any of the following are qualified to apply for assessment and certification:\n\n Graduates of WTR-registered program, NTR-registered programs or\nformal/non-formal/informal including enterprise-based trainings related to\nmobile devices and handheld gadgets servicing courses and/or programs.\n\n Experienced workers (wage employed or self-employed) who gained\ncompetencies in mobile devices and handheld gadgets servicing for at least\none (1) year within the last five (5) years\n\n4.1.5. Recognition of Prior Learning (RPL). Candidates who have gained\ncompetencies through informal training, previous work or life experiences may\napply for recognition in a particular qualification through a recognition/\nassessment process.\n\n4.1.6. Individuals who already possess Certificate of Competency (COC) in Maintain\nand Repair Cellular Phones are required to take the assessment for this TR on\nor before the expiration of their COCs.\n\n4.1.7. The guidelines on assessment and certification are discussed in detail in the\n“Procedures Manual on Assessment and Certification” and “Guidelines on the\nImplementation of the Philippine TVET Competency Assessment and\nCertification System (PTCACS)”.\n\n--- PDF PAGE 121 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Mobile Phones & Handheld Gadgets Servicing NC III (ELCMPS321) Promulgated February 9, 2021 117\n\n4.2. COMPETENCY ASSESSMENT REQUISITE\n\n4.2.1 Self-Assessment Guide. The self-assessment guide (SAG) is accomplished by\nthe candidate prior to actual competency assessment. SAG is a pre-\nassessment tool to help the candidate and the assessor determine what\nevidence is available, where gaps exist, including readiness for assessment.\nThis document can:\na. Identify the candidate’s skills and knowledge\nb. Highlight gaps in candidate’s skills and knowledge\nc. Provide critical guidance to the assessor and candidate on the evidence\nthat need to be presented\nd. Assist the candidate to identify key areas in which practice is needed or\nadditional information or skills that should be gained prior`\n\n4.2.2 Accredited Assessment Center. Only Assessment Center accredited by\nTESDA is authorized to manage the assessment activities of candidates for\nnational certification.\n4.2.3 Accredited Competency Assessor. Only competency assessor accredited by\nTESDA is authorized to assess the competencies of candidates for national\ncertification.\n\n--- PDF PAGE 122 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Mobile Phones & Handheld Gadgets Servicing NC III (ELCMPS321) Promulgated February 9, 2021 118\n\n1)\nANNEX A - COMPETENCY MAP (Electronics Sector)\n\nMobile Phones and Handheld Gadgets Servicing NC III\n\nBASIC COMPETENCIES\n\nReceive and respond to\nworkplace\ncommunication\nParticipate in workplace\ncommunication\nLead workplace\ncommunication\nUtilize specialized\ncommunication skill\nManage and sustain\neffective communication\nstrategies\nWork with others\nWork in team\nenvironment\nLead small teams\nDevelop and lead teams\nManage and sustain high\nperforming teams\nSolve/address routine\nproblems\nSolve/address general\nworkplace problems\nApply critical thinking\nand problem solving\ntechniques in the\nworkplace\nPerform higher order\nthinking processes and\napply techniques in the\nworkplace\nEvaluate higher order\nthinking skills and adjust\nproblem solving\ntechniques\nEnhance self-\nmanagement skills\nDevelop career and life\ndecisions\nWork in a diverse\nenvironment\nContribute to the\npractice of social justice\nin the workplace\nAdvocate strategic thinking\nfor global citizenship\nSupport Innovation\nContribute to workplace\ninnovation\nPropose methods of\napplying learning and\ninnovation in the\norganization\nManage innovative work\ninstructions\nIncorporate innovation into\nwork procedures\nAccess and maintain\ninformation\nPresent relevant\ninformation\nUse information\nsystematically\nManage and evaluate\nusage of information\nDevelop systems in\nmanaging, and maintaining\ninformation\nFollow occupational\nsafety and health\npolicies and procedures\nPractice occupational\nsafety and health\npolicies and procedures\nEvaluate occupational\nsafety and health work\npractices\nLead in improvement of\nOccupational Safety and\nHealth Program,\nPolicies and Procedures\nManage implementation of\noccupational safety and\nhealth programs in the\nworkplace\nApply environmental\nwork standards\nExercise efficient and\neffective sustainable\npractices in the\nworkplace\nEvaluate\nenvironmental work\npractices\nLead towards\nimprovement of\nenvironmental work\nprograms, policies and\nprocedures\nManage implementation of\nenvironmental programs in\nthe workplace\nAdopt entrepreneurial\nmindset in the\nworkplace\nPractice entrepreneurial\nskills in the workplace\nFacilitate\nentrepreneurial skills\nfor micro-small-\nmedium enterprises\n(MSMEs)\nSustain entrepreneurial\nskills\nDevelop and sustain a\nhigh-performing enterprise\n\nCOMMON COMPETENCIES\n\nUse Hand Tools\nPerform Mensuration\nand Calculation\nPrepare and Interpret\nTechnical Drawing\nApply Quality\nStandards\nPerform Computer\nOperations\nTerminate and\nConnect Electrical\nWiring and Electronic\nCircuits\nTest Electronic\nComponents\n\n--- PDF PAGE 123 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Mobile Phones & Handheld Gadgets Servicing NC III (ELCMPS321) Promulgated February 9, 2021 119\n\nCORE COMPETENCIES\n\nInstall Instrumentation and\nControl Devices\nCalibrate\nInstrumentation and\nControl Devices\nConfigure\nInstrumentation and\nControl Devices\nLoop Check\nInstrumentation and\nControl Devices\nMaintain and Repair\nInstrumentation &\nControl Devices\nStart-up Instrumentation\nand Control Systems\nDiagnose and\nTroubleshoot\nInstrumentation and\nControl Systems\nInstall Mechatronics\nDevices\nConfigure & Test\nMechatronics Devices\nMaintain and Repair\nMechatronics Devices\nDevelop Mechatronics\nControl Circuits & Software\nApplication Programs\nCommission\nMechatronics Systems\nDiagnose and\nTroubleshoot\nMechatronics\nSystems\nService and Repair\nAudio Systems and\nProducts\nService and Repair\nVideo Systems and\nProducts\nService and Repair\nBusiness Machines\nAssemble and\nDisassemble\nConsumer Electronic\nProducts\nMaintain and Repair\nElectronically\nControlled Domestic\nAppliances\nMaintain and Repair\nAudio-Video Products\nand Systems\nMaintain and Repair\nCellular Phones\nCommission Consumer\nElectronic Products and\nSystems\nDevelop Servicing\nSystems for Consumer\nElectronic Products\nTrain service\ntechnician\nManage Servicing\nSystems for Consumer\nElectronics Products\nand Systems\nTrain service technician\nsupervisors\nSetup Backend Operation\nWorkplace for Electronics\nProduction Line\nPerform Backend\nOperation for\nElectronics Production\nLine\nSetup Backend\nOperation Workplace\nfor Semiconductor\nProduction Line\nPerform Backend\nOperation for\nSemiconductor\nProduction Line\nCheck quality\ncompliance of backend\noperation for\nSemiconductors\nproduction line\nCheck quality compliance\nof backend operation for\nelectronics production line\nSetup Front-of-Line\n(FOL) Operation\nWorkplace for\nElectronics Production\nLine\nSetup Front-of-Line\n(FOL) Operation\nWorkplace for\nSemiconductor\nProduction Line\nPerform Front-of-Line\n(FOL) Operation for\nSemiconductor\nProduction Line\nCheck quality\ncompliance of Front-of-\nLine (FOL) operation for\nSemiconductors\nproduction line\nPerform Front-of-Line\n(FOL) Operation for\nElectronics Production Line\nCheck quality\ncompliance of Front-of-\nLine (FOL) operation\nfor electronics\nproduction line\nSetup Backend\nOperation Workplace\nfor HDD Production\nLine\nPerform Backend\nOperation for Hard Disk\nDrives (HDD)\nProduction Line\nCheck quality\ncompliance of backend\noperation for HDD\nproduction line\nPerform Machine\nSetup/Conversion\nPerform Machine\nTroubleshooting and\nRepair\nSetup Front-of-Line\n(FOL) Operation\nWorkplace for HDD\nProduction Line\nPerform Front-of-Line\n(FOL) Operation for\nHDD Production Line\nCheck quality\ncompliance of Front-of-\nLine (FOL) operation for\nHDD production line\nMonitor Machine\nPerformance\nPerform Machine\nPreventive\nMaintenance and\nCalibration\nInstall Instrumentation\nand Automation\nDevices\nConfigure & Test\nInstrumentation and\nAutomation System\n\nCalibrate Instrumentation\nand Automation Devices\nMaintain, Troubleshoot\nand Repair\nInstrumentation and\nAutomation Devices\nLoop Check\nInstrumentation and\nAutomation Devices\nCommission and Start-\nup Instrumentation &\nAutomation Loops and\nSystems\n\nPrepare workplace for\nservicing mobile phone\nunit and handheld gadget\nDiagnose and identity\nhardware and\nsoftware related\nproblems\nTroubleshoot and\nrepair mobile phone\nunit and handheld\ngadget\nPerform functionality\ntesting and\ndocumentation\n\n--- PDF PAGE 124 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Mobile Phones & Handheld Gadgets Servicing NC III (ELCMPS321) Promulgated February 9, 2021 120\n\nGLOSSARY OF TERMS\n\nGENERAL\n\n1) Certification - is the process of verifying and validating the competencies of a\nperson through assessment\n\n2) Certificate of Competency (COC) – is a certification issued to individuals who pass\nthe assessment for a single unit or cluster of units of competency\n\n3) Common Competencies - are the skills and knowledge needed by all people\nworking in a particular industry\n\n4) Competency - is the possession and application of knowledge, skills and attitudes\nto perform work activities to the standard expected in the workplace\n\n5) Competency Assessment - is the process of collecting evidence and making\njudgments on whether competency has been achieved\n\n6) Competency Standard (CS) - is the industry-determined specification of\ncompetencies required for effective work performance\n\n7) Context of Assessment - refers to the place where assessment is to be conducted\nor carried out\n\n8) Core Competencies - are the specific skills and knowledge needed in a particular\narea of work - industry sector/occupation/job role\n\n9) Critical aspects of competency - refers to the evidence that is essential for\nsuccessful performance of the unit of competency\n\n10) Elective Competencies - are the additional skills and knowledge required by the\nindividual or enterprise for work\n\n11) Elements - are the building blocks of a unit of competency. They describe in\noutcome terms the functions that a person performs in the workplace.\n\n12) Evidence Guide - is a component of the unit of competency that defines or identifies\nthe evidences required to determine the competence of the individual. It provides\ninformation on critical aspects of competency, underpinning knowledge, underpinning\nskills, resource implications, assessment method and context of assessment\n\n13) Level - refers to the category of skills and knowledge required to do a job\n\n14) Method of Assessment - refers to the ways of collecting evidence and when,\nevidence should be collected\n\n15) National Certificate (NC) – is a certification issued to individuals who achieve all the\nrequired units of competency for a national qualification defined under the Training\nRegulations. NCs are aligned to specific levels within the PTQF\n\n--- PDF PAGE 125 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Mobile Phones & Handheld Gadgets Servicing NC III (ELCMPS321) Promulgated February 9, 2021 121\n\n16) Performance Criteria - are evaluative statements that specify what is to be\nassessed and the required level of performance\n\n17) Qualification - is a cluster of units of competencies that meets job roles and is\nsignificant in the workplace. It is also a certification awarded to a person on\nsuccessful completion of a course in recognition of having demonstrated\ncompetencies in an industry sector\n\n18) Range of Variables - describes the circumstances or context in which the work is to\nbe performed\n\n19) Recognition of Prior Learning (RPL) – is the acknowledgement of an individual’s\nskills, knowledge and attitudes gained from life and work experiences outside\nregistered training programs\n\n20) Resource Implication - refer to the resources needed for the successful\nperformance of the work activity described in the unit of competency. It includes work\nenvironment and conditions, materials, tools and equipment\n\n21) Basic Competencies - are the skills and knowledge that everyone needs for work\n\n22) Training Regulations (TR) – refers to the document promulgated and issued by\nTESDA consisting of competency standards, national qualifications and training\nguidelines for specific sectors/occupations. The TR serves as basis for\nestablishment of qualification and certification under the PTQF. It also serves as\nguide for development of competency-based curricula and instructional materials\nincluding registration of TVET programs offered by TVET providers\n\n23) Underpinning Knowledge - refers to the competency that involves in applying\nknowledge to perform work activities. It includes specific knowledge that is essential\nto the performance of the competency\n\n24) Underpinning Skills - refers to the list of the skills needed to achieve the elements\nand performance criteria in the unit of competency. It includes generic and industry\nspecific skills\n\n25) Unit of Competency – is a component of the competency standards stating a\nspecific key function or role in a particular job or occupation; it is the smallest\ncomponent of achievement that can be assessed and certified under the PTQF\n\n--- PDF PAGE 126 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Mobile Phones & Handheld Gadgets Servicing NC III (ELCMPS321) Promulgated February 9, 2021 122\n\nSECTOR SPECIFIC\n\n1) Android is a mobile operating system (OS) based on the Linux kernel and currently\ndeveloped by Google. With a user interface based on direct manipulation, Android is\ndesigned primarily for touchscreen handheld gadgets such as smartphones and tablet\ncomputers, with specialized user interfaces for televisions (Android TV), cars (Android\nAuto), and wrist watches (Android Wear). The OS uses touch inputs that loosely\ncorrespond to real-world actions, like swiping, tapping, pinching, and reverse pinching\nto manipulate on-screen objects, and a virtual keyboard.\n\n2) Apple device - typically refers to an iPhone, iPad or iPod rather than a Mac laptop;\nhowever, depending on context, the laptop might be included. Since \"device\" refers to\nhardware in general, Apple devices may encompass everything in the Apple line,\nincluding Mac desktop computers.\n\n3) Bluetooth - is a wireless technology standard for exchanging data over short\ndistances (using short-wavelength UHF radio waves in the ISM band from 2.4 to\n2.485 GHz) from fixed and handheld gadgets, and building personal area\nnetworks (PANs). It can connect several devices, overcoming problems of\nsynchronization.\n\n4) Broadband – is a high-speed, high-capacity transmission medium that can carry\nsignals from multiple independent network carriers. It is a high-capacity transmission\ntechnique using a wide range of frequencies, which enables a large number of\nmessages to be communicated simultaneously.\n\n5) Card reader - is a data input device that reads data from a card-shaped storage\nmedium.\n\n6) Cellular phone – see mobile phone definitions.\n\n7) Chat room - a site on the internet where a number of users can communicate in real\ntime (typically one dedicated to a particular topic).\n\n8) Customer service – is the provision of service to customers before, during and after\na purchase. It is the process of ensuring customer satisfaction with a product or\nservice. Often, customer service takes place while performing a transaction for the\ncustomer, such as making a sale or returning an item or replacing / repairing a\nproduct or device. Customer service can take the form of an in-person interaction, a\nphone call, self-service systems, or by other means.\n\n9) Digitizer - device for converting analogue signals into digital signals.\n\n10) ESD - Electrostatic discharge (ESD) - is the sudden flow of electricity between two\nelectrically charged objects caused by contact, an electrical short or dielectric\nbreakdown. A buildup of static electricity can be caused by turbocharging or\nby electrostatic induction. The ESD occurs when differently-charged objects are\nbrought close together or when the dielectric between them breaks down, often\ncreating a visible spark.\n\n--- PDF PAGE 127 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Mobile Phones & Handheld Gadgets Servicing NC III (ELCMPS321) Promulgated February 9, 2021 123\n\n11) Flashers - are a combination of software, hardware and drivers. There are many\nvarieties of flasher boxes covering a wide variety of mobile phones. Therefore,\nchoosing the correct box for a type of mobile phone device or phone model or mobile\nphone manufacturer can be a daunting task.\n\n12) Flasher box or flasher tool - is a programming hardware and/or software that can be\nused to program (flash) the device memory, e.g., EEPROM or flash memory. These\ntools mainly originate from the manufacturer or service centers for debugging, repair,\nor upgrade services. They can overwrite the non-volatile memory and some,\ndepending on the manufacturer or device, can also read the memory to make a copy,\noriginally intended as a backup. The memory can be protected from reading, e.g., by\nsoftware command or destruction of fuses in the read circuit.\n\n13) GSM box / dongle - is a tool designed to repair software related problem of mobile\nphones and handheld gadgets. These devices can only be used in interface with\npersonal computer/laptop.\n\n14) Flashing - means reinstalling the operating system (OS) of the cell phone. In this\nprocess, we erase the entire OS and install a new OS. This will repair any problem\nthat was there before due to the OS being corrupt.\n\n15) Functionality - the quality or state of being functional; especially: the set\nof functions or capabilities associated with computer software or hardware or an\nelectronic or mobile device.\n\n16) Gadget - an often small mechanical or electronic device with a practical use but often\nthought of as a novelty.\n\n17) Handheld device - is any portable device that can be carried and held in one's palm.\nA handheld can be any computing or electronic device that is compact and portable\nenough to be held and used in one or both hands. Typically, handheld gadgets are\nnot as powerful as a computer, but modern handhelds increasingly include powerful\ndual-core processors, RAM, SD storage capacity, an operating system, and native\nand add-on applications. They are often powered by a dry cell lithium or similar\nbattery. Moreover, these types of devices increasingly use a touch screen interface.\nPersonal digital assistants (PDA), tablet PCs and portable media players are all\nconsidered handheld gadgets.\n\n18) Hard reset - also known as a factory reset or master reset, is the restoration of a\ndevice to the state it was in when it left the factory. All settings, applications and data\nadded by the user are removed. The term is often heard in reference to smartphones\nand tablets but laptop and desktop computers, as well as most other electronic\ndevices, can usually be restored to factory conditions.\n\n19) Hot air gun or hot air station - is used to heat devices and melt solder, and\nspecialized tools are used to pick up and position often tiny components.\n\n20) IMEI - International Mobile Equipment Identity (IMEI) is a unique 15 digit international\nserial number used to identify a mobile phone handset to a mobile phone network.\nThis number can used to identify illegal mobile phone handsets. Each time a mobile\nphone is switched on or a call is made on it, the network provider checks the IMEI\n\n--- PDF PAGE 128 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Mobile Phones & Handheld Gadgets Servicing NC III (ELCMPS321) Promulgated February 9, 2021 124\n\nnumber of the handset, then it cross references it with a blacklist register. If it is on\nthe blacklist then the network will either refuse to send a signal to the phone or will\nsupply a signal but will not allow any outgoing or incoming calls.\n\n21) Internet - an electronic communications network that connects computer networks\nand organizational computer facilities around the world the Internet is a public,\ncooperative and self-sustaining facility accessible to hundreds of millions of people\nworldwide.\n\n22) Internet browser - is the program that you use to access the internet and view web\npages on your computer. Some common internet browser examples include -\nMicrosoft Internet Explorer; Mozilla Firefox; AOL Explorer; Apple Safari and Opera.\n\n23) Internet browsing - exploration of the World Wide Web by following one interesting\nlink to another, usually with a definite objective but without a planned search strategy.\nIn comparison 'surfing' is exploration without a definite objective or search strategy,\nand 'searching' are exploration definite in both objective and strategy.\n\n24) iOS - (formerly iPhone OS) is a mobile operating system created and developed by\nApple Inc. exclusively for its hardware. It is the operating system that presently\npowers many of the company's mobile devices, including the iPhone, and iPod\nTouch; it also powered the iPad prior to the introduction of iPadOS in 2019.\n\n25) LTE (Long Term Evolution) - is a wireless broadband technology designed to support\nroaming Internet access via cell phones and handheld gadgets.\n\n26) Memory card reader - is a device for accessing the data on a memory card such as\na CompactFlash (CF), Secure Digital (SD) or Multi-Media Card (MMC).\n\n27) Memory card (sometimes called a flash memory card or a storage card) - is a small\nstorage medium used to store data such as text, pictures, audio, and video, for use\non small, portable or remote computing devices.\n\n28) Mobile application - also called mobile apps, it is a term used to describe Internet\napplications that run on smartphones and other mobile devices. Mobile applications\nusually help users by connecting them to Internet services more commonly accessed\non desktop or notebook computers, or help them by making it easier to use the\nInternet on their portable devices. A mobile app may be a mobile site bookmarking\nutility, a mobile-based instant messaging client, Gmail for mobile, and many other\napplications.\n\n29) Mobile broadband - is a wireless technology that allows you to connect a mobile\ndevice such as your smartphone or tablet to a broadband internet connection\nwirelessly through a mobile phone network.\n\n30) Mobile operating system (OS) - is software that allows smartphones, tablet\nPCs and other devices to run applications and programs. A mobile OS typically starts\nup when a device powers on, presenting a screen with icons or tiles that present\ninformation and provide application access. Mobile operating systems also manage\nmobile/cellular and wireless network connectivity, as well as phone access.\n\n--- PDF PAGE 129 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Mobile Phones & Handheld Gadgets Servicing NC III (ELCMPS321) Promulgated February 9, 2021 125\n\n31) Mobile phone - is an electronic telecommunication device, often referred to as\ncellular phone or cellphone or. These communication devices connect to a wireless\ncommunications network through radio waves or satellite transmissions. Most mobile\nphones provide voice communications, Short Message Service (SMS), Multimedia\nMessage Service (MMS), and newer phones may also provide Internet services such\nas Web browsing, instant messaging capabilities and e-mail.\n\n32) Modem - (modulator-demodulator) is a device that modulates signals to encode\ndigital information and demodulates signals to decode the transmitted information.\nThe goal is to produce a signal that can be transmitted easily and decoded to\nreproduce the original digital data.\n\n33) Open-source - means that you can get the source code of the software for free\n(source code is the code of the program written in a certain programing language).\n\n34) Online Forum – An Internet forum, or message board, is an online discussion site\nwhere people can hold conversations in the form of posted messages\n\n35) Service center – an authorized commercial establishment or a store where you can\nbuy the products, parts for the products that are sold there, and can have the\nproducts repaired or replaced.\n\n36) Service manual – is a handbook published by a product manufacturer or a\nspecialized servicing company that contains instructions and specifications for the\nmaintenance and repair of specific product. They also include wiring diagrams and\ntroubleshooting guides. Most service manuals deal with only one make, model, or\nyear, and nearly all are intended for professionals, technicians or the very\nexperienced amateur.\n\n37) Smartphone - is handheld device/gadget that integrates mobile phone capabilities\nwith the more common features of a handheld computer or PDA. Smartphones allow\nusers to store information, e-mail, and install programs, along with using a mobile\nphone in one device. A smartphone's features are usually more oriented towards\nmobile phone options than the PDA-like features. There is no industry standard for\nwhat defines a smartphone, so any mobile device that has more than basic cellphone\ncapabilities can actually be filed under the smartphone category of devices/gadgets.\n\n38) SRT - special reopening tool.\n\n39) Reprogramming – is the process of changing the programming of a system or\ndevice.\n\n40) Rework station (hot air) – Rework (or re-work) is the term for the refinishing\noperation or repair of an electronic printed circuit board(PCB) assembly, usually\ninvolving desoldering and re-soldering of surface-mounted electronic components\n(SMD).\n\n41) Router - is a device that forwards data packets along networks. A router is connected\nto at least two networks, commonly two LANs or WANs or a LAN and its ISP's\nnetwork. Routers are located at gateways, the places where two or more networks\nconnect.\n\n--- PDF PAGE 130 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Mobile Phones & Handheld Gadgets Servicing NC III (ELCMPS321) Promulgated February 9, 2021 126\n\n42) Sensor: A transducer whose input is a physical phenomenon and whose output is a\nquantitative measure of the phenomenon.\n\n43) SIM card, also known as a subscriber identity module - is a smart card that stores\ndata for GSM mobile/cellular telephone subscribers. Such data includes user identity,\nlocation and phone number, network authorization data, personal security keys,\ncontact lists and stored text messages. Security features include authentication and\nencryption to protect data and prevent eavesdropping.\n\n44) Software: The entire set of programs, procedures, and related documentation\nassociated with a computer.\n\n45) Soft reset - is a restart of a device, such as a smartphone, tablet, laptop or personal\ncomputer (PC). The action closes applications and clears any data in RAM (random\naccess memory). Unsaved data in current use may be lost but data stored on the\nhard drive, applications and settings are not affected.\n\n46) Software stack - it's made up of the operating system (the platform on which\neverything runs), the middleware (the programming that allows applications to talk to\na network and to one another), and the applications (the actual programs that the\nphones will run). In short, the Android software stack is all the software that will make\nan Android phone an Android phone.\n\n47) Soldering flux - flux applied to surfaces that are to be joined by soldering; flux cleans\nthe surfaces and results in a better bond.\n\n48) stockROM – official firmware of the unit.\n\n49) Tablet - is a mobile computer with a touchscreen display, circuitry, and battery in a\nsingle device. Tablets come equipped with sensors, including cameras, a\nmicrophone, and an accelerometer, and the touchscreen display uses the recognition\nof finger or stylus gestures replacing the usage of the mouse and keyboard. They\nusually feature on-screen, pop-up virtual keyboards for typing. Tablets may include\nphysical buttons for basic features such as speaker volume and power, and ports for\nnetwork communications and battery charging. Tablets are typically larger than\nsmartphones or personal digital assistants at 7 inches (18 cm) or larger, measured\ndiagonally.\n\n50) Touch screen – is a display that also serves as an input device. Some touchscreens\nrequire a proprietary pen for input, though most modern touchscreens detect human\ntouch. Since touchscreen devices accept input directly through the screen, they do\nnot require external input devices, such as mice and keyboards. This makes\ntouchscreens ideal for computer kiosks, as well as portable devices, such as tablets\nand smartphones.\n\n51) USB flash drive, also known under a variety of other names - is a data storage\ndevice that includes flash memory with an integrated Universal Serial Bus (USB)\ninterface. USB flash drives are typically removable and rewritable, and physically\nmuch smaller than an optical disc.\n\n--- PDF PAGE 131 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Mobile Phones & Handheld Gadgets Servicing NC III (ELCMPS321) Promulgated February 9, 2021 127\n\n52) Wi-Fi - Wireless Fidelity (WiFi) - is a wireless networking technology that allows\ncomputers and other devices or handheld devices/gadgets to communicate over a\nwireless signal. It describes network components that are based on one of the 802.11\nstandards developed by the IEEE and adopted by the Wi-Fi Alliance.\n\n53) Win mobile (Windows Mobile) - is a family of mobile operating systems developed by\nMicrosoft for smartphones and Pocket PCs.\n\n54) Z3X - tool for Samsung phones and GSM solutions.\n\n--- PDF PAGE 132 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Mobile Phones & Handheld Gadgets Servicing NC III (ELCMPS321) Promulgated February 9, 2021 128\n\nACKNOWLEDGEMENTS\n\nThe Technical Education and Skills Development Authority (TESDA) wishes to extend\ngratitude and appreciation to the many representatives of business, industry, academe and\ngovernment agencies and labor groups who donated their time and expertise to the\ndevelopment and validation of these Training Regulations.\n\n THE TECHNICAL EXPERT COMMITTEE (FY 2019-2020)\n\nMANNY S. ATOY\nMsatel Cellphone Shop\nmannyatoy@gmail.com\n\nCHRISTOPHER NARTATES\nAntGSM Forum\nIntoynartates@gmail.com\n\nRONALDO B. RACELIS\nUnited Institute for Business\nand Technology Assessment Inc.\nronaldbracelis@gmail.com\n\nSAMUEL C. MARIANO\nLightwell electrical & security systems co.\nManaging partner.\nlightwellsystemsco@gmail.com\n\nDONDON M. ORNOS\nTabuk Electronics\ndonornos@gmail.com\n\nMANUEL MATEO\nTheo Cellphone Repair Shop\nuplinktheo@gmail.com\n\nDATU M. SUMONSANG\nDatu Cellcom Services\ndatucellshop@yahoo.com\n\nRODOLFO ESPINO JR.\nMeow Meow Cellphone and Computer Shop\nrodolfoespino14@gmail.com\n\nVICENTE V. DIAO\nTesda Assessor/Trainer\nmarketingdirector04@gmail.com\n\nASRAFH RAMOS DIDA-AGUN\nPrinceTech Apple Repair\ntim13_ash@yahoo.com\n\nCHEDRICK J. ORTIZ\niOs Tech Philippines\nchedkey1988@gmail.com\n\nEMMANUEL D ZULUETA\nIphone PH Team\nemilzulueta1829@gmail.com\n\nCARLO M. PERALTA\nInnovative-technologies SG | Ph\nCp032684@gmail.com\n\n--- PDF PAGE 133 ---\n-------------------------------------------------------------------------------------------------------------