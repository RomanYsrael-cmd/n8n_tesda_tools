  "source_text": "SECTION 4. ASSESSMENT AND CERTIFICATION ARRANGEMENT\n\nCompetency Assessment is the process of collecting evidence and making judgments\nwhether competency has been achieved. The purpose of assessment is to confirm that an\nindividual can perform to the standards expected at the workplace as expressed in relevant\ncompetency standards.\n\nThe assessment process is based on evidence or information gathered to prove\nachievement of competencies. The process may be applied to an employable unit(s) of\ncompetency in partial fulfillment of the requirements of the national qualification.\n4.1. NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1.1. To attain the National Qualification of Mobile Phones and Handheld Gadgets\nServicing NC III, the candidate must demonstrate competence in all the units\nlisted in Section 1. Successful candidates shall be awarded a National\nCertificate III signed by the TESDA Director General.\n\n4.1.2. The qualification of Mobile Phones and Handheld Gadgets Servicing NC III\nmay be attained through demonstration of competence through project-type\nassessment covering all the units of competency required in the qualification.\n\n4.1.3. Assessment shall focus on the core units of competency. The basic and common\nunits shall be integrated or assessed concurrently with the core units.\n\n4.1.4. Any of the following are qualified to apply for assessment and certification:\n\n Graduates of WTR-registered program, NTR-registered programs or\nformal/non-formal/informal including enterprise-based trainings related to\nmobile devices and handheld gadgets servicing courses and/or programs.\n\n Experienced workers (wage employed or self-employed) who gained\ncompetencies in mobile devices and handheld gadgets servicing for at least\none (1) year within the last five (5) years\n\n4.1.5. Recognition of Prior Learning (RPL). Candidates who have gained\ncompetencies through informal training, previous work or life experiences may\napply for recognition in a particular qualification through a recognition/\nassessment process.\n\n4.1.6. Individuals who already possess Certificate of Competency (COC) in Maintain\nand Repair Cellular Phones are required to take the assessment for this TR on\nor before the expiration of their COCs.\n\n4.1.7. The guidelines on assessment and certification are discussed in detail in the\n“Procedures Manual on Assessment and Certification” and “Guidelines on the\nImplementation of the Philippine TVET Competency Assessment and\nCertification System (PTCACS)”.\n\n--- PDF PAGE 121 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Mobile Phones & Handheld Gadgets Servicing NC III (ELCMPS321) Promulgated February 9, 2021 117\n\n4.2. COMPETENCY ASSESSMENT REQUISITE\n\n4.2.1 Self-Assessment Guide. The self-assessment guide (SAG) is accomplished by\nthe candidate prior to actual competency assessment. SAG is a pre-\nassessment tool to help the candidate and the assessor determine what\nevidence is available, where gaps exist, including readiness for assessment.\nThis document can:\na. Identify the candidate’s skills and knowledge\nb. Highlight gaps in candidate’s skills and knowledge\nc. Provide critical guidance to the assessor and candidate on the evidence\nthat need to be presented\nd. Assist the candidate to identify key areas in which practice is needed or\nadditional information or skills that should be gained prior`\n\n4.2.2 Accredited Assessment Center. Only Assessment Center accredited by\nTESDA is authorized to manage the assessment activities of candidates for\nnational certification.\n4.2.3 Accredited Competency Assessor. Only competency assessor accredited by\nTESDA is authorized to assess the competencies of candidates for national\ncertification.\n\n--- PDF PAGE 122 ---\n-------------------------------------------------