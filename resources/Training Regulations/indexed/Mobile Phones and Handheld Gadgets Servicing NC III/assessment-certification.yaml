  "arrangements": [
    {
      "number": "4.1",
      "text": "NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS"
    },
    {
      "number": "4.1",
      "text": "1. To attain the National Qualification of Mobile Phones and Handheld Gadgets Servicing NC III, the candidate must demonstrate competence in all the units listed in Section 1. Successful candidates shall be awarded a National Certificate III signed by the TESDA Director General."
    },
    {
      "number": "4.1",
      "text": "2. The qualification of Mobile Phones and Handheld Gadgets Servicing NC III may be attained through demonstration of competence through project-type assessment covering all the units of competency required in the qualification."
    },
    {
      "number": "4.1",
      "text": "3. Assessment shall focus on the core units of competency. The basic and common units shall be integrated or assessed concurrently with the core units."
    },
    {
      "number": "4.1",
      "text": "4. Any of the following are qualified to apply for assessment and certification:  Graduates of WTR-registered program, NTR-registered programs or formal/non-formal/informal including enterprise-based trainings related to mobile devices and handheld gadgets servicing courses and/or programs.  Experienced workers (wage employed or self-employed) who gained competencies in mobile devices and handheld gadgets servicing for at least one (1) year within the last five (5) years"
    },
    {
      "number": "4.1",
      "text": "5. Recognition of Prior Learning (RPL). Candidates who have gained competencies through informal training, previous work or life experiences may apply for recognition in a particular qualification through a recognition/ assessment process."
    },
    {
      "number": "4.1",
      "text": "6. Individuals who already possess Certificate of Competency (COC) in Maintain and Repair Cellular Phones are required to take the assessment for this TR on or before the expiration of their COCs."
    },
    {
      "number": "4.1",
      "text": "7. The guidelines on assessment and certification are discussed in detail in the “Procedures Manual on Assessment and Certification” and “Guidelines on the Implementation of the Philippine TVET Competency Assessment and Certification System (PTCACS)”. --- PDF PAGE 121 --- ------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- TR – Mobile Phones & Handheld Gadgets Servicing NC III (ELCMPS321) Promulgated February 9, 2021 117"
    },
    {
      "number": "4.2",
      "text": "COMPETENCY ASSESSMENT REQUISITE"
    },
    {
      "number": "4.2",
      "text": "1 Self-Assessment Guide. The self-assessment guide (SAG) is accomplished by the candidate prior to actual competency assessment. SAG is a pre- assessment tool to help the candidate and the assessor determine what evidence is available, where gaps exist, including readiness for assessment. This document can: a. Identify the candidate’s skills and knowledge b. Highlight gaps in candidate’s skills and knowledge c. Provide critical guidance to the assessor and candidate on the evidence that need to be presented d. Assist the candidate to identify key areas in which practice is needed or additional information or skills that should be gained prior`"
    },
    {
      "number": "4.2",
      "text": "2 Accredited Assessment Center. Only Assessment Center accredited by TESDA is authorized to manage the assessment activities of candidates for national certification."
    },
    {
      "number": "4.2",
      "text": "3 Accredited Competency Assessor. Only competency assessor accredited by TESDA is authorized to assess the competencies of candidates for national certification. --- PDF PAGE 122 --- ------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- TR – Mobile Phones & Handheld Gadgets Servicing NC III (ELCMPS321) Promulgated February 9, 2021 118 1) ANNEX A - COMPETENCY MAP (Electronics Sector) Mobile Phones and Handheld Gadgets Servicing NC III Receive and respond to workplace communication Participate in workplace communication Lead workplace communication Utilize specialized communication skill Manage and sustain effective communication strategies Work with others Work in team environment Lead small teams Develop and lead teams Manage and sustain high performing teams Solve/address routine problems Solve/address general workplace problems Apply critical thinking and problem solving techniques in the workplace Perform higher order thinking processes and apply techniques in the workplace Evaluate higher order thinking skills and adjust problem solving techniques Enhance self- management skills Develop career and life decisions Work in a diverse environment Contribute to the practice of social justice in the workplace Advocate strategic thinking for global citizenship Support Innovation Contribute to workplace innovation Propose methods of applying learning and innovation in the organization Manage innovative work instructions Incorporate innovation into work procedures Access and maintain information Present relevant information Use information systematically Manage and evaluate usage of information Develop systems in managing, and maintaining information Follow occupational safety and health policies and procedures Practice occupational safety and health policies and procedures Evaluate occupational safety and health work practices Lead in improvement of Occupational Safety and Health Program, Policies and Procedures Manage implementation of occupational safety and health programs in the workplace Apply environmental work standards Exercise efficient and effective sustainable practices in the workplace Evaluate environmental work practices Lead towards improvement of environmental work programs, policies and procedures Manage implementation of environmental programs in the workplace Adopt entrepreneurial mindset in the workplace Practice entrepreneurial skills in the workplace Facilitate entrepreneurial skills for micro-small- medium enterprises (MSMEs) Sustain entrepreneurial skills Develop and sustain a high-performing enterprise Use Hand Tools Perform Mensuration and Calculation Prepare and Interpret Technical Drawing Apply Quality Standards Perform Computer Operations Terminate and Connect Electrical Wiring and Electronic Circuits Test Electronic Components --- PDF PAGE 123 --- ------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- TR – Mobile Phones & Handheld Gadgets Servicing NC III (ELCMPS321) Promulgated February 9, 2021 119 Install Instrumentation and Control Devices Calibrate Instrumentation and Control Devices Configure Instrumentation and Control Devices Loop Check Instrumentation and Control Devices Maintain and Repair Instrumentation & Control Devices Start-up Instrumentation and Control Systems Diagnose and Troubleshoot Instrumentation and Control Systems Install Mechatronics Devices Configure & Test Mechatronics Devices Maintain and Repair Mechatronics Devices Develop Mechatronics Control Circuits & Software Application Programs Commission Mechatronics Systems Diagnose and Troubleshoot Mechatronics Systems Service and Repair Audio Systems and Products Service and Repair Video Systems and Products Service and Repair Business Machines Assemble and Disassemble Consumer Electronic Products Maintain and Repair Electronically Controlled Domestic Appliances Maintain and Repair Audio-Video Products and Systems Maintain and Repair Cellular Phones Commission Consumer Electronic Products and Systems Develop Servicing Systems for Consumer Electronic Products Train service technician Manage Servicing Systems for Consumer Electronics Products and Systems Train service technician supervisors Setup Backend Operation Workplace for Electronics Production Line Perform Backend Operation for Electronics Production Line Setup Backend Operation Workplace for Semiconductor Production Line Perform Backend Operation for Semiconductor Production Line Check quality compliance of backend operation for Semiconductors production line Check quality compliance of backend operation for electronics production line Setup Front-of-Line (FOL) Operation Workplace for Electronics Production Line Setup Front-of-Line (FOL) Operation Workplace for Semiconductor Production Line Perform Front-of-Line (FOL) Operation for Semiconductor Production Line Check quality compliance of Front-of- Line (FOL) operation for Semiconductors production line Perform Front-of-Line (FOL) Operation for Electronics Production Line Check quality compliance of Front-of- Line (FOL) operation for electronics production line Setup Backend Operation Workplace for HDD Production Line Perform Backend Operation for Hard Disk Drives (HDD) Production Line Check quality compliance of backend operation for HDD production line Perform Machine Setup/Conversion Perform Machine Troubleshooting and Repair Setup Front-of-Line (FOL) Operation Workplace for HDD Production Line Perform Front-of-Line (FOL) Operation for HDD Production Line Check quality compliance of Front-of- Line (FOL) operation for HDD production line Monitor Machine Performance Perform Machine Preventive Maintenance and Calibration Install Instrumentation and Automation Devices Configure & Test Instrumentation and Automation System Calibrate Instrumentation and Automation Devices Maintain, Troubleshoot and Repair Instrumentation and Automation Devices Loop Check Instrumentation and Automation Devices Commission and Start- up Instrumentation & Automation Loops and Systems Prepare workplace for servicing mobile phone unit and handheld gadget Diagnose and identity hardware and software related problems Troubleshoot and repair mobile phone unit and handheld gadget Perform functionality testing and documentation --- PDF PAGE 124 --- ------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- TR – Mobile Phones & Handheld Gadgets Servicing NC III (ELCMPS321) Promulgated February 9, 2021 120"
    },
    {
      "number": "1",
      "text": "Certification - is the process of verifying and validating the competencies of a person through assessment"
    },
    {
      "number": "2",
      "text": "Certificate of Competency (COC) – is a certification issued to individuals who pass the assessment for a single unit or cluster of units of competency"
    },
    {
      "number": "3",
      "text": "Common Competencies - are the skills and knowledge needed by all people working in a particular industry"
    },
    {
      "number": "4",
      "text": "Competency - is the possession and application of knowledge, skills and attitudes to perform work activities to the standard expected in the workplace"
    },
    {
      "number": "5",
      "text": "Competency Assessment - is the process of collecting evidence and making judgments on whether competency has been achieved"
    },
    {
      "number": "6",
      "text": "Competency Standard (CS) - is the industry-determined specification of competencies required for effective work performance"
    },
    {
      "number": "7",
      "text": "Context of Assessment - refers to the place where assessment is to be conducted or carried out"
    },
    {
      "number": "8",
      "text": "Core Competencies - are the specific skills and knowledge needed in a particular area of work - industry sector/occupation/job role"
    },
    {
      "number": "9",
      "text": "Critical aspects of competency - refers to the evidence that is essential for successful performance of the unit of competency"
    },
    {
      "number": "10",
      "text": "Elective Competencies - are the additional skills and knowledge required by the individual or enterprise for work"
    },
    {
      "number": "11",
      "text": "Elements - are the building blocks of a unit of competency. They describe in outcome terms the functions that a person performs in the workplace."
    },
    {
      "number": "12",
      "text": "Evidence Guide - is a component of the unit of competency that defines or identifies the evidences required to determine the competence of the individual. It provides information on critical aspects of competency, underpinning knowledge, underpinning skills, resource implications, assessment method and context of assessment"
    },
    {
      "number": "13",
      "text": "Level - refers to the category of skills and knowledge required to do a job"
    },
    {
      "number": "14",
      "text": "Method of Assessment - refers to the ways of collecting evidence and when, evidence should be collected"
    },
    {
      "number": "15",
      "text": "National Certificate (NC) – is a certification issued to individuals who achieve all the required units of competency for a national qualification defined under the Training Regulations. NCs are aligned to specific levels within the PTQF --- PDF PAGE 125 --- ------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- TR – Mobile Phones & Handheld Gadgets Servicing NC III (ELCMPS321) Promulgated February 9, 2021 121"
    },
    {
      "number": "16",
      "text": "Performance Criteria - are evaluative statements that specify what is to be assessed and the required level of performance"
    },
    {
      "number": "17",
      "text": "Qualification - is a cluster of units of competencies that meets job roles and is significant in the workplace. It is also a certification awarded to a person on successful completion of a course in recognition of having demonstrated competencies in an industry sector"
    },
    {
      "number": "18",
      "text": "Range of Variables - describes the circumstances or context in which the work is to be performed"
    },
    {
      "number": "19",
      "text": "Recognition of Prior Learning (RPL) – is the acknowledgement of an individual’s skills, knowledge and attitudes gained from life and work experiences outside registered training programs"
    },
    {
      "number": "20",
      "text": "Resource Implication - refer to the resources needed for the successful performance of the work activity described in the unit of competency. It includes work environment and conditions, materials, tools and equipment"
    },
    {
      "number": "21",
      "text": "Basic Competencies - are the skills and knowledge that everyone needs for work"
    },
    {
      "number": "22",
      "text": "Training Regulations (TR) – refers to the document promulgated and issued by TESDA consisting of competency standards, national qualifications and training guidelines for specific sectors/occupations. The TR serves as basis for establishment of qualification and certification under the PTQF. It also serves as guide for development of competency-based curricula and instructional materials including registration of TVET programs offered by TVET providers"
    },
    {
      "number": "23",
      "text": "Underpinning Knowledge - refers to the competency that involves in applying knowledge to perform work activities. It includes specific knowledge that is essential to the performance of the competency"
    },
    {
      "number": "24",
      "text": "Underpinning Skills - refers to the list of the skills needed to achieve the elements and performance criteria in the unit of competency. It includes generic and industry specific skills"
    },
    {
      "number": "25",
      "text": "Unit of Competency – is a component of the competency standards stating a specific key function or role in a particular job or occupation; it is the smallest component of achievement that can be assessed and certified under the PTQF --- PDF PAGE 126 --- ------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- TR – Mobile Phones & Handheld Gadgets Servicing NC III (ELCMPS321) Promulgated February 9, 2021 122"
    },
    {
      "number": "1",
      "text": "Android is a mobile operating system (OS) based on the Linux kernel and currently developed by Google. With a user interface based on direct manipulation, Android is designed primarily for touchscreen handheld gadgets such as smartphones and tablet computers, with specialized user interfaces for televisions (Android TV), cars (Android Auto), and wrist watches (Android Wear). The OS uses touch inputs that loosely correspond to real-world actions, like swiping, tapping, pinching, and reverse pinching to manipulate on-screen objects, and a virtual keyboard."
    },
    {
      "number": "2",
      "text": "Apple device - typically refers to an iPhone, iPad or iPod rather than a Mac laptop; however, depending on context, the laptop might be included. Since \"device\" refers to hardware in general, Apple devices may encompass everything in the Apple line, including Mac desktop computers."
    },
    {
      "number": "3",
      "text": "Bluetooth - is a wireless technology standard for exchanging data over short distances (using short-wavelength UHF radio waves in the ISM band from 2.4 to"
    },
    {
      "number": "2",
      "text": "485 GHz) from fixed and handheld gadgets, and building personal area networks (PANs). It can connect several devices, overcoming problems of synchronization."
    },
    {
      "number": "4",
      "text": "Broadband – is a high-speed, high-capacity transmission medium that can carry signals from multiple independent network carriers. It is a high-capacity transmission technique using a wide range of frequencies, which enables a large number of messages to be communicated simultaneously."
    },
    {
      "number": "5",
      "text": "Card reader - is a data input device that reads data from a card-shaped storage medium."
    },
    {
      "number": "6",
      "text": "Cellular phone – see mobile phone definitions."
    },
    {
      "number": "7",
      "text": "Chat room - a site on the internet where a number of users can communicate in real time (typically one dedicated to a particular topic)."
    },
    {
      "number": "8",
      "text": "Customer service – is the provision of service to customers before, during and after a purchase. It is the process of ensuring customer satisfaction with a product or service. Often, customer service takes place while performing a transaction for the customer, such as making a sale or returning an item or replacing / repairing a product or device. Customer service can take the form of an in-person interaction, a phone call, self-service systems, or by other means."
    },
    {
      "number": "9",
      "text": "Digitizer - device for converting analogue signals into digital signals."
    },
    {
      "number": "10",
      "text": "ESD - Electrostatic discharge (ESD) - is the sudden flow of electricity between two electrically charged objects caused by contact, an electrical short or dielectric breakdown. A buildup of static electricity can be caused by turbocharging or by electrostatic induction. The ESD occurs when differently-charged objects are brought close together or when the dielectric between them breaks down, often creating a visible spark. --- PDF PAGE 127 --- ------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- TR – Mobile Phones & Handheld Gadgets Servicing NC III (ELCMPS321) Promulgated February 9, 2021 123"
    },
    {
      "number": "11",
      "text": "Flashers - are a combination of software, hardware and drivers. There are many varieties of flasher boxes covering a wide variety of mobile phones. Therefore, choosing the correct box for a type of mobile phone device or phone model or mobile phone manufacturer can be a daunting task."
    },
    {
      "number": "12",
      "text": "Flasher box or flasher tool - is a programming hardware and/or software that can be used to program (flash) the device memory, e.g., EEPROM or flash memory. These tools mainly originate from the manufacturer or service centers for debugging, repair, or upgrade services. They can overwrite the non-volatile memory and some, depending on the manufacturer or device, can also read the memory to make a copy, originally intended as a backup. The memory can be protected from reading, e.g., by software command or destruction of fuses in the read circuit."
    },
    {
      "number": "13",
      "text": "GSM box / dongle - is a tool designed to repair software related problem of mobile phones and handheld gadgets. These devices can only be used in interface with personal computer/laptop."
    },
    {
      "number": "14",
      "text": "Flashing - means reinstalling the operating system (OS) of the cell phone. In this process, we erase the entire OS and install a new OS. This will repair any problem that was there before due to the OS being corrupt."
    },
    {
      "number": "15",
      "text": "Functionality - the quality or state of being functional; especially: the set of functions or capabilities associated with computer software or hardware or an electronic or mobile device."
    },
    {
      "number": "16",
      "text": "Gadget - an often small mechanical or electronic device with a practical use but often thought of as a novelty."
    },
    {
      "number": "17",
      "text": "Handheld device - is any portable device that can be carried and held in one's palm. A handheld can be any computing or electronic device that is compact and portable enough to be held and used in one or both hands. Typically, handheld gadgets are not as powerful as a computer, but modern handhelds increasingly include powerful dual-core processors, RAM, SD storage capacity, an operating system, and native and add-on applications. They are often powered by a dry cell lithium or similar battery. Moreover, these types of devices increasingly use a touch screen interface. Personal digital assistants (PDA), tablet PCs and portable media players are all considered handheld gadgets."
    },
    {
      "number": "18",
      "text": "Hard reset - also known as a factory reset or master reset, is the restoration of a device to the state it was in when it left the factory. All settings, applications and data added by the user are removed. The term is often heard in reference to smartphones and tablets but laptop and desktop computers, as well as most other electronic devices, can usually be restored to factory conditions."
    },
    {
      "number": "19",
      "text": "Hot air gun or hot air station - is used to heat devices and melt solder, and specialized tools are used to pick up and position often tiny components."
    },
    {
      "number": "20",
      "text": "IMEI - International Mobile Equipment Identity (IMEI) is a unique 15 digit international serial number used to identify a mobile phone handset to a mobile phone network. This number can used to identify illegal mobile phone handsets. Each time a mobile phone is switched on or a call is made on it, the network provider checks the IMEI --- PDF PAGE 128 --- ------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- TR – Mobile Phones & Handheld Gadgets Servicing NC III (ELCMPS321) Promulgated February 9, 2021 124 number of the handset, then it cross references it with a blacklist register. If it is on the blacklist then the network will either refuse to send a signal to the phone or will supply a signal but will not allow any outgoing or incoming calls."
    },
    {
      "number": "21",
      "text": "Internet - an electronic communications network that connects computer networks and organizational computer facilities around the world the Internet is a public, cooperative and self-sustaining facility accessible to hundreds of millions of people worldwide."
    },
    {
      "number": "22",
      "text": "Internet browser - is the program that you use to access the internet and view web pages on your computer. Some common internet browser examples include - Microsoft Internet Explorer; Mozilla Firefox; AOL Explorer; Apple Safari and Opera."
    },
    {
      "number": "23",
      "text": "Internet browsing - exploration of the World Wide Web by following one interesting link to another, usually with a definite objective but without a planned search strategy. In comparison 'surfing' is exploration without a definite objective or search strategy, and 'searching' are exploration definite in both objective and strategy."
    },
    {
      "number": "24",
      "text": "iOS - (formerly iPhone OS) is a mobile operating system created and developed by Apple Inc. exclusively for its hardware. It is the operating system that presently powers many of the company's mobile devices, including the iPhone, and iPod Touch; it also powered the iPad prior to the introduction of iPadOS in 2019."
    },
    {
      "number": "25",
      "text": "LTE (Long Term Evolution) - is a wireless broadband technology designed to support roaming Internet access via cell phones and handheld gadgets."
    },
    {
      "number": "26",
      "text": "Memory card reader - is a device for accessing the data on a memory card such as a CompactFlash (CF), Secure Digital (SD) or Multi-Media Card (MMC)."
    },
    {
      "number": "27",
      "text": "Memory card (sometimes called a flash memory card or a storage card) - is a small storage medium used to store data such as text, pictures, audio, and video, for use on small, portable or remote computing devices."
    },
    {
      "number": "28",
      "text": "Mobile application - also called mobile apps, it is a term used to describe Internet applications that run on smartphones and other mobile devices. Mobile applications usually help users by connecting them to Internet services more commonly accessed on desktop or notebook computers, or help them by making it easier to use the Internet on their portable devices. A mobile app may be a mobile site bookmarking utility, a mobile-based instant messaging client, Gmail for mobile, and many other applications."
    },
    {
      "number": "29",
      "text": "Mobile broadband - is a wireless technology that allows you to connect a mobile device such as your smartphone or tablet to a broadband internet connection wirelessly through a mobile phone network."
    },
    {
      "number": "30",
      "text": "Mobile operating system (OS) - is software that allows smartphones, tablet PCs and other devices to run applications and programs. A mobile OS typically starts up when a device powers on, presenting a screen with icons or tiles that present information and provide application access. Mobile operating systems also manage mobile/cellular and wireless network connectivity, as well as phone access. --- PDF PAGE 129 --- ------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- TR – Mobile Phones & Handheld Gadgets Servicing NC III (ELCMPS321) Promulgated February 9, 2021 125"
    },
    {
      "number": "31",
      "text": "Mobile phone - is an electronic telecommunication device, often referred to as cellular phone or cellphone or. These communication devices connect to a wireless communications network through radio waves or satellite transmissions. Most mobile phones provide voice communications, Short Message Service (SMS), Multimedia Message Service (MMS), and newer phones may also provide Internet services such as Web browsing, instant messaging capabilities and e-mail."
    },
    {
      "number": "32",
      "text": "Modem - (modulator-demodulator) is a device that modulates signals to encode digital information and demodulates signals to decode the transmitted information. The goal is to produce a signal that can be transmitted easily and decoded to reproduce the original digital data."
    },
    {
      "number": "33",
      "text": "Open-source - means that you can get the source code of the software for free (source code is the code of the program written in a certain programing language)."
    },
    {
      "number": "34",
      "text": "Online Forum – An Internet forum, or message board, is an online discussion site where people can hold conversations in the form of posted messages"
    },
    {
      "number": "35",
      "text": "Service center – an authorized commercial establishment or a store where you can buy the products, parts for the products that are sold there, and can have the products repaired or replaced."
    },
    {
      "number": "36",
      "text": "Service manual – is a handbook published by a product manufacturer or a specialized servicing company that contains instructions and specifications for the maintenance and repair of specific product. They also include wiring diagrams and troubleshooting guides. Most service manuals deal with only one make, model, or year, and nearly all are intended for professionals, technicians or the very experienced amateur."
    },
    {
      "number": "37",
      "text": "Smartphone - is handheld device/gadget that integrates mobile phone capabilities with the more common features of a handheld computer or PDA. Smartphones allow users to store information, e-mail, and install programs, along with using a mobile phone in one device. A smartphone's features are usually more oriented towards mobile phone options than the PDA-like features. There is no industry standard for what defines a smartphone, so any mobile device that has more than basic cellphone capabilities can actually be filed under the smartphone category of devices/gadgets."
    },
    {
      "number": "38",
      "text": "SRT - special reopening tool."
    },
    {
      "number": "39",
      "text": "Reprogramming – is the process of changing the programming of a system or device."
    },
    {
      "number": "40",
      "text": "Rework station (hot air) – Rework (or re-work) is the term for the refinishing operation or repair of an electronic printed circuit board(PCB) assembly, usually involving desoldering and re-soldering of surface-mounted electronic components (SMD)."
    },
    {
      "number": "41",
      "text": "Router - is a device that forwards data packets along networks. A router is connected to at least two networks, commonly two LANs or WANs or a LAN and its ISP's network. Routers are located at gateways, the places where two or more networks connect. --- PDF PAGE 130 --- ------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- TR – Mobile Phones & Handheld Gadgets Servicing NC III (ELCMPS321) Promulgated February 9, 2021 126"
    },
    {
      "number": "42",
      "text": "Sensor: A transducer whose input is a physical phenomenon and whose output is a quantitative measure of the phenomenon."
    },
    {
      "number": "43",
      "text": "SIM card, also known as a subscriber identity module - is a smart card that stores data for GSM mobile/cellular telephone subscribers. Such data includes user identity, location and phone number, network authorization data, personal security keys, contact lists and stored text messages. Security features include authentication and encryption to protect data and prevent eavesdropping."
    },
    {
      "number": "44",
      "text": "Software: The entire set of programs, procedures, and related documentation associated with a computer."
    },
    {
      "number": "45",
      "text": "Soft reset - is a restart of a device, such as a smartphone, tablet, laptop or personal computer (PC). The action closes applications and clears any data in RAM (random access memory). Unsaved data in current use may be lost but data stored on the hard drive, applications and settings are not affected."
    },
    {
      "number": "46",
      "text": "Software stack - it's made up of the operating system (the platform on which everything runs), the middleware (the programming that allows applications to talk to a network and to one another), and the applications (the actual programs that the phones will run). In short, the Android software stack is all the software that will make an Android phone an Android phone."
    },
    {
      "number": "47",
      "text": "Soldering flux - flux applied to surfaces that are to be joined by soldering; flux cleans the surfaces and results in a better bond."
    },
    {
      "number": "48",
      "text": "stockROM – official firmware of the unit."
    },
    {
      "number": "49",
      "text": "Tablet - is a mobile computer with a touchscreen display, circuitry, and battery in a single device. Tablets come equipped with sensors, including cameras, a microphone, and an accelerometer, and the touchscreen display uses the recognition of finger or stylus gestures replacing the usage of the mouse and keyboard. They usually feature on-screen, pop-up virtual keyboards for typing. Tablets may include physical buttons for basic features such as speaker volume and power, and ports for network communications and battery charging. Tablets are typically larger than smartphones or personal digital assistants at 7 inches (18 cm) or larger, measured diagonally."
    },
    {
      "number": "50",
      "text": "Touch screen – is a display that also serves as an input device. Some touchscreens require a proprietary pen for input, though most modern touchscreens detect human touch. Since touchscreen devices accept input directly through the screen, they do not require external input devices, such as mice and keyboards. This makes touchscreens ideal for computer kiosks, as well as portable devices, such as tablets and smartphones."
    },
    {
      "number": "51",
      "text": "USB flash drive, also known under a variety of other names - is a data storage device that includes flash memory with an integrated Universal Serial Bus (USB) interface. USB flash drives are typically removable and rewritable, and physically much smaller than an optical disc. --- PDF PAGE 131 --- ------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- TR – Mobile Phones & Handheld Gadgets Servicing NC III (ELCMPS321) Promulgated February 9, 2021 127"
    },
    {
      "number": "52",
      "text": "Wi-Fi - Wireless Fidelity (WiFi) - is a wireless networking technology that allows computers and other devices or handheld devices/gadgets to communicate over a wireless signal. It describes network components that are based on one of the 802.11 standards developed by the IEEE and adopted by the Wi-Fi Alliance."
    },
    {
      "number": "53",
      "text": "Win mobile (Windows Mobile) - is a family of mobile operating systems developed by Microsoft for smartphones and Pocket PCs."
    },
