    {
      "number": "4.1",
      "text": "NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS 4.1.1. To attain the National Qualification of Mobile Phones and Handheld Gadgets Servicing NC III, the candidate must demonstrate competence in all the units listed in Section 1. Successful candidates shall be awarded a National Certificate III signed by the TESDA Director General. 4.1.2. The qualification of Mobile Phones and Handheld Gadgets Servicing NC III may be attained through demonstration of competence through project-type assessment covering all the units of competency required in the qualification. 4.1.3. Assessment shall focus on the core units of competency. The basic and common units shall be integrated or assessed concurrently with the core units. 4.1.4. Any of the following are qualified to apply for assessment and certification:  Graduates of WTR-registered program, NTR-registered programs or formal/non-formal/informal including enterprise-based trainings related to mobile devices and handheld gadgets servicing courses and/or programs.  Experienced workers (wage employed or self-employed) who gained competencies in mobile devices and handheld gadgets servicing for at least one (1) year within the last five (5) years 4.1.5. Recognition of Prior Learning (RPL). Candidates who have gained competencies through informal training, previous work or life experiences may apply for recognition in a particular qualification through a recognition/ assessment process. 4.1.6. Individuals who already possess Certificate of Competency (COC) in Maintain and Repair Cellular Phones are required to take the assessment for this TR on or before the expiration of their COCs. 4.1.7. The guidelines on assessment and certification are discussed in detail in the “Procedures Manual on Assessment and Certification” and “Guidelines on the Implementation of the Philippine TVET Competency Assessment and Certification System (PTCACS)”."
    },
    {
      "number": "4.2",
      "text": "COMPETENCY ASSESSMENT REQUISITE 4.2.1 Self-Assessment Guide. The self-assessment guide (SAG) is accomplished by the candidate prior to actual competency assessment. SAG is a pre- assessment tool to help the candidate and the assessor determine what evidence is available, where gaps exist, including readiness for assessment. This document can: a. Identify the candidate’s skills and knowledge b. Highlight gaps in candidate’s skills and knowledge c. Provide critical guidance to the assessor and candidate on the evidence that need to be presented d. Assist the candidate to identify key areas in which practice is needed or additional information or skills that should be gained prior` 4.2.2 Accredited Assessment Center. Only Assessment Center accredited by TESDA is authorized to manage the assessment activities of candidates for national certification. 4.2.3 Accredited Competency Assessor. Only competency assessor accredited by TESDA is authorized to assess the competencies of candidates for national certification."
    }
