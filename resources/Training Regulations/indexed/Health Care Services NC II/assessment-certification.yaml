  "source_text": "SECTION 4 NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1\nTo attain the National Qualification of Health Care Services, the candidate must\ndemonstrate competence through project-type assessment covering all units listed in\nSection 1. Successful candidates shall be awarded a National Certificate, NC II\nsigned by the TESDA Director General.\n\n4.2\nAssessment shall focus on the core units of competency. The basic and common\nunits shall be integrated or assessed concurrently with the core units.\n\n4.3\nThe following are qualified to apply for assessment and certification:\n\n4.3.1\nGraduates of formal, non-formal and informal including enterprise-based\ntraining programs.\n\n4.3.2\nExperienced Workers (wage employed or self-employed)\n\n4.4\nReassessment in a unit of competency is allowed only after one month from the date\nof assessment. Reassessment for a National Certificate shall be done only on the\ntask/s that the candidate did not successfully achieve.\n\n4.5\nA candidate who fails the assessment for two (2) consecutive times will be required to\ngo through a refresher course before taking another assessment.\n\n4.6\nThe guidelines on assessment and certification are discussed in detail in the\nProcedures Manual on Assessment and Certification.\n\n--- PDF PAGE 62 ---\nTR Health Care Services NC II\n-58-\nCOMMON\nCOMPETENCIES\nCORE\nCOMPETENCIES\n"
