  "source_text": "SECTION 4 NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1\nTo attain the National Qualification of Health Care Services, the candidate must\ndemonstrate competence through project-type assessment covering all units listed in\nSection 1. Successful candidates shall be awarded a National Certificate, NC II\nsigned by the TESDA Director General.\n\n4.2\nAssessment shall focus on the core units of competency. The basic and common\nunits shall be integrated or assessed concurrently with the core units.\n\n4.3\nThe following are qualified to apply for assessment and certification:\n\n4.3.1\nGraduates of formal, non-formal and informal including enterprise-based\ntraining programs.\n\n4.3.2\nExperienced Workers (wage employed or self-employed)\n\n4.4\nReassessment in a unit of competency is allowed only after one month from the date\nof assessment. Reassessment for a National Certificate shall be done only on the\ntask/s that the candidate did not successfully achieve.\n\n4.5\nA candidate who fails the assessment for two (2) consecutive times will be required to\ngo through a refresher course before taking another assessment.\n\n4.6\nThe guidelines on assessment and certification are discussed in detail in the\nProcedures Manual on Assessment and Certification.\n\n--- PDF PAGE 62 ---\nTR Health Care Services NC II\n-58-\nCOMMON\nCOMPETENCIES\nCORE\nCOMPETENCIES\nCOMPETENCY MAP\nINSTITUTIONAL HEALTH CARE (HEALTH CARE ASSISTANT) NC II\nPrepare and maintain\nbeds\nCollects and\nmaintain linen stocks\nat end-user location\nAssist with patients\nmobility\nAssist in\ntransporting\npatients\nImplement and\nmonitor infection\ncontrol policies and\nprocedures\nRespond effectively to\ndifficult/ challenging\nbehavior\nApply basic first aid\nMaintain high standard\nof patient services\nAssist with bio-\npsychosocial support\ncare of patients\nHandle waste in a\nhealth care\nenvironment\nBASIC\nCOMPETENCIES\nPractice career\nprofessionalism\nPractice occupational\nhealth and safety\nprocedures\nParticipate in\nworkplace\ncommunication\nWork in team\nenvironment\nCOMMON\nCOMPETENCIES\nCORE\nCOMPETENCIES\nCOMPETENCY MAP\nINSTITUTIONAL HEALTH CARE (HEALTH CARE ASSISTANT) NC II\nPrepare and maintain\nbeds\nCollects and\nmaintain linen stocks\nat end-user location\nAssist with patients\nmobility\nAssist in\ntransporting\npatients\nImplement and\nmonitor infection\ncontrol policies and\nprocedures\nRespond effectively to\ndifficult/ challenging\nbehavior\nApply basic first aid\nMaintain high standard\nof patient services\nAssist with bio-\npsychosocial support\ncare of patients\nHandle waste in a\nhealth care\nenvironment\nBASIC\nCOMPETENCIES\nPractice career\nprofessionalism\nPractice occupational\nhealth and safety\nprocedures\nParticipate in\nworkplace\ncommunication\nWork in team\nenvironment\n\n--- PDF PAGE 63 ---\nTR Health Care Services NC II\n-59-\nDEFINITION OF TERMS\n\nSPECIFIC TERMS:\n\n1)\nBody Mechanics – refers to using the body in an efficient and careful way\n2)\nHazardous Waste – refers to the items contaminated with blood, body fluids, or body\nsubstances that maybe harmful to others\n3)\nOSH – refers to Occupational Safety and Health\n4)\nCommodes – refers to movable stand containing a washbowl\n5)\nChair Lifts – refers to power-driven chair assembly used to transport people\n6)\nDietitians – refers to specialist in dietetic\n7)\nImmunization – refers to process of increasing the state of immunity\n8)\nFirst Aid Kit – refers to emergency tools used to administer treatment to injured or sick\nperson\n9)\nBalkan frames – refers to a device used for orthostatic correction\n10) Linen – refers to materials used in draping\n11) Ambu bag – refers to (Bag – Valve – mask), a device used to ventilate patients who are\nunable to breath\n12) Walking frames – refers to orthostatic device used to support body weight\n13) Sling – refers to a material or a cloth used to support the upper extremity\n14) Splints – refers to a material or a piece of cloth used to immobilize a limb in the case of\nfracture, disease of deformity\n15) Trolley – refers to a rolling device used to transport materials\n16) PPE – refers to personal protective equipment\n17) Wheel chair – refers to a device used to transport patient from one place to another in a\nsitting position\n18) Stretchers – refers to a device used in transferring patients in lying position\n19) Pressure Bandage – refers to a piece of material used to cover a wound and immobilize a\npart of the body or restrict the movement\n20) Thermal blanket – refers to a material used to decrease the body temperature or keep the\npatient warm\n21) Stressors – refers to an agent or factor that produces stress\n22) Choking – refers to a person having difficulty in breathing\n23) Aspiration – refers to removal of liquids or gases by means of suction\n24) Suffocation – refers to suppression of ones breathing with out access of oxygen\n25) Depression –refers to mental condition of gloom or sadness\n26) Suicide – refers to the act of intentionally killing oneself\n27) Assault – refers to violent physical or verbal attack\n\n--- PDF PAGE 64 ---\nACKNOWLEDGMENT\n\nThe Technical Education and Skills Development Authority (TESDA) wishes to extend thanks\nand appreciation to the many representatives of business, industry, academe and government\nagencies, non-government organizations including professional associations who donated their\ntime and expertise to the development and validation of this Training Regulations.\n\nEXECUTIVE COMMITTEE, Health Care Industry Training Council, Inc.\n\n• Dr. Juan Ma. Pablo R. Nañagas, MPH, MNSA\nChairperson\n• Dr. Kenneth Vincent Ronquillo, MPHM\nDeputy Chair\n• Pilar L. Singson Malabunga, RN, MAN\nSecretary\n• Dr. Irineo Bernardo, III\nTreasurer\n• Professor Quintin G. Tan\nBoard Member\n\nCommittee Chairs, Health Care Industry Training Council\n\n• Dr. Rodel Nodora, EMBA\n\nPlanning Research, Marketing and Advocacy Commi