  "source_text": "DEFINITION OF TERMS\n\nSPECIFIC TERMS:\n\n1)\nBody Mechanics – refers to using the body in an efficient and careful way\n2)\nHazardous Waste – refers to the items contaminated with blood, body fluids, or body\nsubstances that maybe harmful to others\n3)\nOSH – refers to Occupational Safety and Health\n4)\nCommodes – refers to movable stand containing a washbowl\n5)\nChair Lifts – refers to power-driven chair assembly used to transport people\n6)\nDietitians – refers to specialist in dietetic\n7)\nImmunization – refers to process of increasing the state of immunity\n8)\nFirst Aid Kit – refers to emergency tools used to administer treatment to injured or sick\nperson\n9)\nBalkan frames – refers to a device used for orthostatic correction\n10) Linen – refers to materials used in draping\n11) Ambu bag – refers to (Bag – Valve – mask), a device used to ventilate patients who are\nunable to breath\n12) Walking frames – refers to orthostatic device used to support body weight\n13) Sling – refers to a material or a cloth used to support the upper extremity\n14) Splints – refers to a material or a piece of cloth used to immobilize a limb in the case of\nfracture, disease of deformity\n15) Trolley – refers to a rolling device used to transport materials\n16) PPE – refers to personal protective equipment\n17) Wheel chair – refers to a device used to transport patient from one place to another in a\nsitting position\n18) Stretchers – refers to a device used in transferring patients in lying position\n19) Pressure Bandage – refers to a piece of material used to cover a wound and immobilize a\npart of the body or restrict the movement\n20) Thermal blanket – refers to a material used to decrease the body temperature or keep the\npatient warm\n21) Stressors – refers to an agent or factor that produces stress\n22) Choking – refers to a person having difficulty in breathing\n23) Aspiration – refers to removal of liquids or gases by means of suction\n24) Suffocation 