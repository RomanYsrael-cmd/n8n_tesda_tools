gitimate sources when\nappropriate.\n\n--- PDF PAGE 24 ---\nTR Health Care Services NC II\n-20-\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Planned responses\n1.1\nOwn ability and experience\n1.2\nEstablished institutional procedures\n1.3\nKnowledge of individual persons and underlying causes\n2. Difficult or\nchallenging\nbehaviors\n2.1\nAggression/Assaultive behavior\n2.2\nConfusion or other cognitive impairment\n2.3\nNoisiness\n2.4\nManipulative\n2.5\nWandering\n2.6\nSelf-destructive\n2.7\nIntoxication\n2.8\nWithdrawn/depressed\n2.9\nNegativistic\n2.10 Intrusive behavior\n2.11 Verbal offensiveness\n3. Strategies for dealing\nwith challenging\nbehaviors\n3.1\nDiversional activities\n3.2\nReferring to appropriate personnel e.g. supervisor, security\nofficer\n3.3\nFollowing established emergency response procedures\n4. Selection of\nstrategies for dealing\nwith challenging\nbehaviors\n4.1\nThe nature of the incident\n4.2\nPotential effect on different parties, patient, staff and others\n4.3\nEstablished procedures and guidelines\n5. Institutional policies\nand procedures\n5.1\nIncident reporting and documentation\n5.2\nOperational guidelines for handling incidents and/or cases\ninvolving difficult and challenging behavior\n5.3\nDebriefing of staff involved in the incident\n\n--- PDF PAGE 25 ---\nTR Health Care Services NC II\n-21-\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nIdentified specific manifestations of difficult or challenging\nbehavior and strategies are planned, selected and applied as\nrequired\n1.2\nMaintained personal safety and the safety of others\n1.3\nReported incidents, reviewed and responded quickly and\neffectively to contingencies\n1.4\nDebriefing mechanisms are used\n2. Underpinning\nknowledge\n2.1\nOSH and issues relating to difficult and challenging behavior\n2.2\nPatient issues which need to be referred to an appropriate\nhealth professional\n2.3\nAbility to interpret and follow the instructions and guidance of\nhealth professionals involved with the care of patient/client\n3. Underpinning skills\n3.1\nEffectively using techniques for monitoring own service area\nincluding client satisfaction\n3.2\nSpeaking in a firm, diplomatic and culturally appropriate\nmanner\n3.3\nRemaining calm and positive in adversity\n3.4\nThinking and responding quickly and strategically\n3.5\nRemaining alert to potential incidents of difficult or challenging\nbehavior\n3.6\nMonitoring and/or maintaining security equipment\n3.7\nWorking with others and display empathy with patient and\nrelatives\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nAccess to relevant workplace or appropriately simulated\nenvironment where assessment can take place\n4.2\nRelevant institutional policy, guidelines, procedures and\nprotocols\n4.3\nEmergency response procedures and employee support\narrangements\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1\nObservation with questioning\n5.2\nDemonstration with questioning\n6. Context of\nassessment\n6.1\nAssessment may be done in the workplace or in a simulated\nworkplace setting.\n\n--- PDF PAGE 26 ---\nTR Health Care Services NC II\n-22-\nUNIT OF COMPETENCY :\nAPPLY BASIC FIRST AID\nUNIT CODE\n:\nHCS323203\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes required to\nprovide an initial response where First Aid is required. In this unit it\nis assumed that the First Aider is working under supervision and / or\naccording to established workplace First Aid procedures and\npolicies\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Assess the situation\n1.1\nPhysical hazards to self and casualty’s health and safety are\nidentified\n1.2\nImmediate risks to self and casualty’s occupational health\nand safety (OSH )are minimized by controlling the hazard in\naccordance with OSH requirements\n1.3\nCasualty’s vital signs and physical condition are assessed in\naccordance with workplace procedures\n2. Apply basic first aid\ntechniques\n2.1\nFirst Aid management is provided in accordance with\nestablished First Aid procedures\n2.2\nCasualty is reassured in a caring and calm manner and made\ncomfortable using available resources\n2.3\nFirst Aid assistance is sought from others in a timely manner\nand as appropriate\n2.4\nCasualty’s condition is monitored and responded to in\naccordance with effective First Aid principles and workplace\nprocedures\n2.5\nDetails of casualty’s physical condition, changes in conditions,\nmanagement and response are accurately recorded in line\nwith organizational procedures\n2.6\nCasualty management is finalized according to his/her needs\nand First Aid principles\n3. Communicate details\nof the incident\n3.1\nAppropriate medical assistance is requested using relevant\ncommunication media and equipment\n3.2\nDetails of casualty’s condition and management activities are\naccurately conveyed to emergency services/relieving\npersonnel\n3.3\nReports to supervisors are prepared in a timely manner,\npresenting all relevant facts according to established company\nprocedures\n\n--- PDF PAGE 27 ---\nTR Health Care Services NC II\n-23-\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1 First Aid\nManagement\nThis may include but not limited to :\n1.1\nWorkplace policies and procedures\n1.2\nIndustry/site specific regulations, codes\n1.3\nOSH\n1.4\nState and territory workplace health and safety requirements\n1.5\nAllergies the casualty may have\n2 Physical Hazards\nPhysical hazards may include :\n2.1\nWorkplace hazards\n2.2\nEnvironmental hazards\n2.3\nProximity of other people\n2.4\nHazards associated with casualty management processes\n3 Risks\nRisks may include:\n3.1\nWorksite equipment, machinery and substances\n3.2\nEnvironmental risks\n3.3\nBodily fluids\n3.4\nRisk of further injury to the casualty\n3.5\nRisk associated with the proximity of the others and\nbystanders\n4 Casualty’s Condition\nCasualty’s condition may include but not limited to the ff:\n4.1\nAbdominal injuries\n4.2\nAllergic reactions\n4.3\nBleeding\n4.4\nBurns-thermal, chemical, friction, electrical\n4.5\nCardiac conditions\n4.6\nChemical contamination\n4.7\nCod injuries\n4.8\nCrush injuries\n4.9\nDislocations\n4.10 Drowning\n4.11 Eye injuries\n4.12 Fractures\n4.13 Head injuries\n4.14 Epilepsy\n4.15 Minor skin injuries\n4.16 Neck and spinal injuries\n4.17 Needle stick injuries\n4.18 Poisoning and toxic substances\n4.19 Shock\n4.20\nSmoke inhalation\n5. Equipment and\nResources\nEquipment and other resources may include:\n5.1\nDefibrillation units\n5.2\nPressure bandages\n5.3\nThermometers\n5.4\nFirst Aid kit\n5.5\nEyewash\n5.6\nThermal blankets\n5.7\nPocket face masks\n5.8\nRubber gloves\n5.9\nDressing\n5.10 Space device\n5.11\nCervical collars\n\n--- PDF PAGE 28 ---\nTR Health Care Services NC II\n-24-\nVARIABLE\nRANGE\n6. Communication\nsystem\n6.1\nMobile phone\n6.2\nSatellite phones\n6.3\nHF/VHF radio\n6.4\nFlags\n6.5\nFlares\n6.6\nTwo - way radio\n6.7\nEmail\n6.8\nElectronic equipment\n7. Vital signs\n7.1\nBreathing\n7.2\nCirculation\n7.3\nConsciousness\n8. First Aid Principles\n8.1\nChecking the site for danger to self, casualty’ and others and\nminimizing the danger\n8.2\nChecking and maintaining the casualty’s airways, breathing\nand circulation\n\n--- PDF PAGE 29 ---\nTR Health Care Services NC II\n-25-\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n\n1.1\nComplied with institutional requirements, OSH laws infections\ncontrol and manual handling procedures and relevant health\nregulations\n1.2\nIdentified physical hazards of the casualty and minimized\nimmediate risks\n1.3\nAssessed and monitored the physical condition of the casualty\n1.4\nResponded to emergency using basic life support measures.\n1.5\nProvided initial response where First Aid is required\n1.6\nDealt with complex casualties or incident\n1.7\nPrepared reports to concerned personnel in a timely manner\n2. Underpinning\nknowledge\n2.1\nBasic anatomy and physiology\n2.2\nCompany standard operating procedures (sops)\n2.3\nDealing with confidentiality\n2.4\nKnowledge of the First Aiders’ skills limitations\n2.5\nOSH legislation and regulations\n2.6\nHow to gain access to and interpret material safety data\nsheets\n3. Underpinning skills\n3.1\nResuscitation Skills\n3.2\nSafe manual handling of casualty\n3.3\nConsideration of the welfare of the casualty\n3.4\nReport preparation\n3.5\nCommunication skills\n3.6\nInterpreting and Using listed documents\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nAccess to relevant work station\n4.2\nRelevant institutional policies, guidelines procedure and\nprotocol\n4.3\nEquipment and materials relevant to the proposed activities\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1\nDemonstration with questioning\n5.2\nInterview\n5.3\nThird Party report\n5.4\nPortfolio\n6. Context of\nassessment\n6.1\nAssessment may be done in a workplace or simulated work\narea setting.\n\n--- PDF PAGE 30 ---\nTR Health Care Services NC II\n-26-\nUNIT OF COMPETENCY :\nMAINTAIN HIGH STANDARDS OF PATIENT SERVICES\nUNIT CODE\n:\nHCS323204\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes required in the\nmaintenance of high standards of patient services.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Communicate\nappropriately with\npatients\n1.1\nEffective communication strategies and techniques are\nidentified and used to achieve best patient service outcomes\n1.2\nComplaints are responded to in accordance with\norganizational policy to ensure best service to patients\n1.3\nComplaints are dealt with in accordance with established\nprocedures\n1.4\nInterpreter services are accessed as required\n1.5\nAction is taken to resolve conflicts either directly, where a\npositive outcome can be immediately achieved, or by referral\nto the appropriate personnel\n1.6\nParticipation in work team is constructive and collaborative\nand demonstrates an understanding of own role\n2. Establish and\nmaintain good\ninterpersonal\nrelationship with\npatients\n2.1\nRapport is established to ensure the service is appropriate to\nand in the best interests of patients\n2.2\nEffective listening skills are used to ensure a high level of\neffective communication and quality of service\n2.3\nPatient concerns and needs are correctly identified and\nresponded to responsibly and accordingly established\nprocedures and guidelines\n2.4\nEffectiveness of interpersonal interaction is consistently\nmonitored and evaluated to ensure best patient service\noutcomes\n3. Act in a respectful\nmanner at all times\n3.1\nRespect for differences is positively, actively and\nconsistently demonstrated in all work\n3.2\nConfidentiality and privacy of patients is maintained\n3.3\nCourtesy is demonstrated in all interactions with patients, their\nvisitors, careers and family\n3.4\nAssistance with the care of patients with challenging\nbehaviors is provided in accordance with established\nprocedures\n3.5\nTechniques are used to manage and minimize aggression\n4. Evaluate own work to\nmaintain a high\nstandard of patient\nservice\n4.1\nAdvice and assistance is received or sought from appropriate\nsources on own performance\n4.2\nOwn work is adjusted, incorporating recommendations that\naddress performance issues, to maintain the agreed standard\nof patient support\n\n--- PDF PAGE 31 ---\nTR Health Care Services NC II\n-27-\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Patients\nThis may include but not limited to:\n1.1\nPatients\n1.2\nProspective patients to the service or services\n1.3\nPatients may be in contact with the institution through\nappropriate health care personnel and professionals or other\nadvocates or agencies\n2. Others with whom\ninteraction is required\nin regard to patient\nservices\n2.1\nOther staff and team members\n2.2\nService units or departments\n2.3\nFamily members, carers and friends of patients\n2.4\nProfessional representatives or agents of patients such as:\n Medical specialists\n Nurses\n Social workers\n Dietitians\n Therapists\n Allied health professionals\n Volunteers\n Teachers and/or spiritual\n Community\n2.5\nGeneral public\n3. Communication\n\n3.1\nEnglish/Tagalog/vernacular\n3.2\nSign language\n3.3\nThrough an interpreter\n3.4\nCommunity language as required by the service / organization\n4. Modes of\ncommunication:\n4.1\nContinuing interaction with patients and clients\n4.2\nVerbal conversations either in person or via telephone\n4.3\nWritten notes by post or electronic media\n4.4\nWorker, family member friend or professional interpreter who\nhas relevant languages\n5. Respect for\ndifference\n5.1\nPhysical\n5.2\nCognitive/mental or intellectual issues that may impact on\ncommunication\n5.3\nCultural and ethnic\n5.4\nReligious/spiritual\n5.5\nSocial\n5.6\nAge\n5.7\nLanguage literacy and numeracy abilities\n5.8\nSexuality and sexual preference\n\n--- PDF PAGE 32 ---\nTR Health Care Services NC II\n-28-\nVARIABLE\nRANGE\n6. Confidentiality and\nprivacy of patients\n6.1\nFees\n6.2\nHealth fund entitlements\n6.3\nWelfare entitlements\n6.4\nPayment Method and records\n6.5\nPublic environments\n6.6\nLegal and ethical requirements\n6.7\nWriting details ie medical and consent forms\n6.8\nConversations on the telephone\n6.9\nSecure location for written records\n6.10 Offering a private location for discussions\n6.11 Information disclosed to an appropriate person consistent with\none’s level of responsibility\n7. Performance\nmonitoring\n7.1\nSelf-monitoring\n7.2\nSupervisor assessment\n7.3\nPatient feedback\n\n--- PDF PAGE 33 ---\nTR Health Care Services NC II\n-29-\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nCommunicated appropriately with patients\n1.2\nHandled complaints and resolved conflict, or referred matters\nto supervisors when required\n1.3\nComplied with relevant policies, protocols, guidelines and\nprocedures of the organization\n1.4\nEstablished and maintained good interpersonal relationship\nwith patients\n1.5\nDemonstrated courtesy in all interactions with patients, their\nvisitors, and family\n2. Underpinning\nknowledge\n2.1\nRoles and responsibilities of self and other workers within the\norganization\n2.2\nWhen client/patient issues need to be referred to an\nappropriate health professional\n2.3\nOrganizational policies and procedures for privacy and\nconfidentiality of information provided by patients and others\n2.4\nKnowledge of cultures relevant to the particular service\n2.5\nInstitutional policy on patient rights and responsibilities\n3. Underpinning skills\n3.1\nEstablishing and maintaining relationships, taking into account\nindividual differences\n3.2\nUsing effective listening techniques\n3.3\nUsing appropriate verbal and non verbal communication styles\n3.4\nInterpreting and following the instructions and guidance of\nhealth professionals involved with the care of patient/clients\n3.5\nOral and written communication\n3.6\nProblem solving skills required include the ability to use\navailable resources and prioritise workload\n3.7\nDealing with conflict\n3.8\nWorking with others and display empathy with patient and\nrelatives\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nAccess to relevant workplace or appropriately simulated\nenvironment where assessment can take place\n4.2\nRelevant government and organizational policy, guidelines,\nprocedures and protocols\n4.3\nAny relevant legislation in relation to service delivery\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1\nDemonstration with questioning\n5.2\nInterview\n5.3\nThird party report\n6. Context of\nassessment\n6.1\nAssessment may be done in a simulated workplace setting\n\n--- PDF PAGE 34 ---\nTR Health Care Services NC II\n-30-\nCORE COMPETENCIES\n\nUNIT OF COMPETENCY :\nPREPARE AND MAINTAIN BEDS\nUNIT CODE\n:\nHCS323314\nUNIT DESCRIPTOR\n: This unit of competency covers the knowledge, skills and attitudes\nrequired in preparing and making beds and performing after-care\nactivities.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Prepare area for bed\nmaking\n1.1\nPersonal protective equipment is used, according to\ninstitutional policy\n1.2\nBed height is adjusted as necessary\n1.3\nBed surroundings are cleared of medical and other equipment\nbefore bed is stripped, where necessary\n1.4\nPatient privacy, comfort and safety is provided at all times\n1.5\nBed linen is checked for displaced personal items, aids and\nequipment and such aids/equipment are placed in appropriate\narea/container\n2. Make bed\n2.1\nBed linen is stripped, where necessary\n2.2\nClinical waste and soiled linen are removed and placed in\nappropriate container\n2.3\nBed is cleaned according to established procedures, where\nnecessary\n2.4\nClean bed linen is placed on bed in accordance with institution\nprocedures\n2.5\nExisting bed linen is remade, as needed\n2.6\nPatient is asked whether he/she is comfortable, or if he/she\nhas any preferred bed needs\n2.7\nReusable clean bed linen is handled in accordance with\ninstitution procedures\n2.8\nMattresses and pillows are cleaned and disinfected, in\naccordance with established procedures\n2.9\nBed height is adjusted for occupancy and brakes are applied\naccording to bed type\n3. Perform after-care\nactivities\n3.1\nBeds and equipment/ aids are kept accessible and bed is left\nready for occupancy\n3.2\nDamaged and/or faulty beds, equipment mattresses, pillows\nand linen are reported to appropriate personnel and\ndocumented accordingly.\n3.3\nSoiled linen and clinical wastes are discarded according to\nestablished protocol\n3.4\nCleaning implements are cleaned and returned to designated\nstorage areas or disposed of appropriately.\n\n--- PDF PAGE 35 ---\nTR Health Care Services NC II\n-31-\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Personal Protective\nEquipment (PPE)\nPPE include but not limited to:\n1.1\nGloves\n1.2\nMask\n1.3\nCap\n1.4\nGown\n2. Beds\n2.1\nElectro-mechanical bed\n2.2\nMaternity delivery bed\n2.3\nHospital bed\n2.4\nFolding bed\n2.5\nRenal chair\n2.6\nBalkan frame\n2.7\nTrolley\n2.8\nPediatric bed\n2.9\nIsolettes\n3. Equipment\n3.1\nPressure care devices e.g. floatation mattress, egg carton\nmattress, foam mattress\n3.2\nBedside table\n3.3\nOver bed table\n3.4\nBed end note holder\n3.5\nChair lifts\n3.6\nWalking frames / sticks\n3.7\nCommodes\n3.8\nSling\n3.9\nStraps\n3.10 Splints\n3.11 Monkey grips\n3.12 Foot stool\n3.13 Personal aids such as eye glasses, hearing aids, glass eyes,\nfalse teeth, breast prosthesis, false limbs\n4. Bed Linen\n4.1\nSheets\n4.2\nBlankets\n4.3\nPillow cases\n4.4\nUnder-blankets\n4.5\nMattress protectors\n4.6\nPersonal bed linen\n\n--- PDF PAGE 36 ---\nTR Health Care Services NC II\n-32-\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nPrepared area for bed making\n1.2\nMade bed\n1.3\nPerformed after care\n1.4\nUsed appropriate PPE\n1.5\nHandled soiled linen safely\n1.6\nPerformed bed cleaning procedures\n1.7\nFollowed instructions according to institutional policies and\nguidelines\n2. Underpinning\nknowledge\n2.1\nTypes of bed\n2.2\nTypes of linen\n2.3\nOSH policies and procedures\n2.4\nHygiene policies and procedures\n2.5\nInfection control policies and procedures\n3. Underpinning skills\n3.1\nCleaning different types of beds\n3.2\nSafe manual handling techniques\n3.3\nCorrect disposing clinical waste\n3.4\nCorrect bed making procedures in hospital corners\n3.5\nOral and written communication skills\n3.6\nProblem solving skills required include the ability to use\navailable resources and priorities workload\n3.7\nWorking with others and display empathy and courtesy with\npatient and their relatives\n4. Resource\nimplications\nThe following resources MUST be provided;\n4.1\nAccess to relevant workstation\n4.2\nRelevant institutional policies, guidelines, procedures and\nprotocol\n4.3\nEquipment and materials relevant to the proposed activities\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1\nDemonstration with questioning\n5.2\nInterview\n5.3\nThird party report\n6. Context of\nassessment\n6.1\nCompetency may be assessed in the workplace or in a\nsimulated work setting.\n\n--- PDF PAGE 37 ---\nTR Health Care Services NC II\n-33-\nUNIT OF COMPETENCY :\nCOLLECT AND MAINTAIN LINEN STOCKS AT END-USER\nLOCATIONS\nUNIT CODE\n:\nHCS323315\nUNIT DESCRIPTOR\n:\nThis unit of competency covers the knowledge, skills and attitudes\nrequired to collect soiled linen from end-user locations, deliver\nsoiled linen to a designated holding area, distribute clean linen and\nmaintain linen stock levels at end-user locations.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Collect soiled linen\n1.1\nSoiled linen is collected as scheduled from end user\nlocations\n1.2\nSoiled linen bag is replaced in accordance with institution\npolicies and procedures\n1.3\nSoiled linen is transported to designated holding area using\nappropriate equipment and safe handling techniques\n1.4\nCollection of soiled linen is carried out in a manner that\nminimizes the risk of cross contamination and complies with\nOHS policy and procedures\n1.5\nHazards are identified and reported to supervisor\n1.6\nAppropriate procedures for dealing with accidents, including\nsharp injuries are followed correctly\n2. Distribute clean linen\n2.1\nClean linen is transported as scheduled to end- user locations\nusing appropriate equipment and safe handling techniques\n2.2\n Linen is replaced to ensure adequate supply for users\n2.3\nLinen stock is rotated and old stock returned for reprocessing\n3. Maintain linen stock\nlevels\n3.1\nOptimum stock levels are maintained to ensure linen\navailability\n3.2\nLinen is requisitioned to par level quantity\n3.3\nLinen is stored in linen storage facilities and maintained\naccording to institution requirements\n3.4\n Linen stock records are maintained according to institution\nrequirements\n3.5\nLinen inventory is done according to institution policies and\nprocedures\n\n--- PDF PAGE 38 ---\nTR Health Care Services NC II\n-34-\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. End-User Locations\n1.1\nHospital\n1.2\nAged care facility\n1.3\nResidential accommodate\n1.4\nOperating room\n1.5\nOut-Patient Services\n1.6\nCentral Supply Room\n1.7\nHealth Clinics\n1.8\nCommunity health facilities\n2. Institutional policies &\nprocedures\n2.1\nLinen stock delivery, inventory management and stock\nrotation\n2.2\nCollection locations and procedures\n2.3\nStandard work practice for safe handling of soiled linen\n2.4\nUse of protective clothing\n2.5\nNotification of hazards and accidents\n2.6\nData recording (manual or electronic)\n2.7\nSecurity and safe storage of clean and soiled linen\n3. Equipment\n3.1\nLinen trolleys of various sizes\n3.2\nLinen bags\n3.3\nBaskets\n3.4\nBins\n4. Hazards\n4.1\nExposure to heat\n4.2\nSharp objects\n4.3\nPotentially infectious materials\n4.4\nExposure to harmful chemicals\n5. Maintenance of\noptimum linen stock\nlevels\n5.1\nReview of inventory levels for each linen item\n5.2\nAssessment of user requirements based on past and\nexpected utilization of linen\n6. Linen Stock Records 6.1\nPatients\n6.2\nRequisition of forms\n6.3\nStock cards\n6.4\nInventory forms\n6.5\nPhilippine standards, infection control and quality standards\n7. Linen storage\nfacilities\n7.1\nShelves\n7.2\nRacks\n7.3\nTrolleys\n7.4\nCabinets\n7.5\nLinen bags\n\n--- PDF PAGE 39 ---\nTR Health Care Services NC II\n-35-\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nComplied with institutional requirements, OSH laws, infection\ncontrol and manual handling procedures and relevant health\nregulations\n1.2\nCollected soiled linen\n1.3\nDistributed clean linen\n1.4\nMaintained stock levels of linen accurately and in a timely and\nsafe manner\n1.5\nCompleted work systematically with attention to details,\nwithout injury to patient and self, damage to goods, equipment\nor risk to personnel.\n1.6\nCommunicated effectively with user-locations in relation to\nlinen utilization, inventory and stock levels.\n2. Underpinning\nknowledge\n2.1\nTypes of linen and individual uses\n2.2\nRelevant OSH regulations, laws and infection control practice,\ninstitutional policies and procedures\n2.3\nSafety and environmental aspects related to workplace\noperation and manual handling, including workplace hazards\n2.4\nDelivery and collection schedules\n2.5\nQuality standards\n2.6\nInventory procedures and documentation\n3. Underpinning skills\n3.1\nHandling linen products appropriately\n3.2\nAssessing and maintaining linen requirements\n3.3\nSelecting and using appropriate equipment\n3.4\nMeeting patient and institution specifications/ requirements\n3.5\nCommunicating effectively within the workplace\n3.6\nApplying defined procedures i.e. OSH and infection control\n3.7\nRecognizing and adapting to cultural differences in the\nworkplace, including modes of behavior and interactions\namong staff and others\n3.8\nBasic arithmetic skills\n3.9\nOral and written communication skills\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nRelevant policies and procedures manuals\n4.2\nInstitution mission statement, strategic and business plan\n4.3\nOther documents relevant to the work context such as:\n-\norganizational charts\n-\nfloor plans\n-\ninstructions for the use of equipment and materials\nrelevant to the proposed activities\n-\nspecific instructions for staff\n-\nworkstation\n5. Method of\nassessment\nCompetency may be assessed through at least two of the following\nMethod:\n5.1\nObservation of performance\n5.2\nInterview\n5.3\nThird party report\n5.4\nPortfolio\n5.5\nDemonstration with questioning\n6. Context of\nassessment\n6.1\n Competency assessment may be done in the workplace or in\na simulated workplace setting.\n\n--- PDF PAGE 40 ---\nTR Health Care Services NC II\n-36-\nUNIT OF COMPETENCY :\nASSIST IN PATIENT MOBILITY\nUNIT CODE\n:\nHCS323316\nUNIT DESCRIPTOR\n:\nThis unit of competency covers the knowledge, skills and attitudes\nrequired to assist incapacitated patients in basic physical\nmovements.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Prepare to assist with\npatient mobility\n1.1\nRequirements for assisting with patient mobility are confirmed\nwith concerned health personnel and care plan\n1.2\nEquipment are selected according to prescribed plan of care\n1.3\nEnvironment is prepared according to established guidelines\n1.4\nProcedure is explained to patient as required using\nappropriate communication techniques\n2. Assist with patient\nmobility\n2.1\nPatient mobility is carried out using safe handling Method\nand equipment as required\n2.2\nAppropriate action is taken to ensure patient comfort and\nsafety throughout positioning or transfer\n2.3\nCommunication with patients during movement is undertaken\naccording to established procedures\n3. Complete patient\nmobility assistance\n3.1\nPatient is moved to prescribed position and concerned health\npersonnel are informed accordingly\n3.2\nEquipment is cleaned in accordance with established\nprocedures\n3.3\nEquipment’s working condition is reported immediately in\naccordance with established procedures\n\n--- PDF PAGE 41 ---\nTR Health Care Services NC II\n-37-\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Equipment\nEquipment may include but not limited to :\n1.1\nWheel chair\n1.2\nChairlifts\n1.3\nCrutches\n1.4\nCommodes\n1.5\nSlings\n1.6\nSplints\n1.7\nStretcher\n1.8\nCot\n1.9\nBed with side rails\n1.10\nHoist with mechanical lifter\n2. Environment\n2.1\nHospital room\n2.2\nHealth care facility\n2.3\nHome\n2.4\nAmbulance\n3. Communication\ntechniques\n3.1\n Oral\n3.2\nWritten\n3.3\nSign language\n4. Safe handling\nMethod\n4.1\nAssisting patient to walk\n4.2\nAssisting patient to change position\n4.3\nPlacing patient to wheelchair\n4.4\nAssisting patient to crutches or other walking aids\n4.5\nTransporting patient by wheelchair or stretcher\n4.6\nAssisting the patient to use a hoist or mechanical lifter for\ntransfer\n\n--- PDF PAGE 42 ---\nTR Health Care Services NC II\n-38-\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nPerformed safe handling Method in assisting with patient\nmobility\n1.2\nEnsured patient privacy at all times\n1.3\nImplemented comfort and safety measures according to\nestablished procedures\n1.4\nUtilized appropriate communication techniques in instructing\npatients\n1.5\nCleaned equipment in accordance with established\nprocedures\n1.6\nReported condition of equipment according to established\nprocedures\n1.7\nObserved strict infection control guidelines\n2. Underpinning\nknowledge\n2.1\nPatient confidentiality and privacy requirements\n2.2\nCleaning policy and procedures for lifting and transferring\nequipment\n2.3\nPatient condition as it relates to patient mobility\n2.4\nOSH procedures\n2.5\nInfection control guidelines\n2.6\nAppropriate communication techniques\n2.7\nEquipment use and specifications\n3. Underpinning skills\n3.1\nUsing appropriate equipment for patient mobility\n3.2\nCommunicating effectively with patients and concerned health\ncare personnel\n3.3\nSafe handling skills\n3.4\nOral and written communication skills\n3.5\nDealing with conflicts\n3.6\nWorking with others and display empathy with patient and\nrelatives\n4. Resource\nimplications\nThe following resources MUST be provided during assessment\nexcept in cases where portfolio or third-party report will be used:\n4.1\nWorkplace health and safety manual\n4.2\nInfection control manual\n4.3\nStandard Operating Procedures manual\n4.4\nEquipment manufacturer’s instructions\n4.5\nEquipment as described in the range of variables\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1\nDemonstration with questioning\n5.2\nPortfolio\n5.3\nThird party report\n6. Context of\nassessment\n6.1\n Competency assessment may be done in a simulated\nworkplace setting.\n\n--- PDF PAGE 43 ---\nTR Health Care Services NC II\n-39-\nUNIT OF COMPETENCY :\nASSIST IN TRANSPORTING PATIENTS\nUNIT CODE\n:\nHCS323317\nUNIT DESCRIPTOR\n:\nThis unit of competency covers the knowledge, skills and attitudes\nrequired to safely and efficiently assist in transporting patients from\none location to another.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Prepare patient for\ntransport\n1.1\nTransportation requirements are confirmed with appropriate\nhealth care personnel\n1.2\nTransport procedures are explained to patient as required\n1.3\nPreparations are made for the safe and efficient transport of\nthe patient as per instructions\n1.4\nEquipment for transportation is readied according to\nrequirements and checked to ensure that it is clean, complete\nand functional\n2. Assist in patient\ntransport\n2.1\nPatient is transported to designated location in accordance\nwith established procedures\n2.2\nEquipment is adjusted to ensure patient comfort and safety\nwith minimal risk to self\n2.3\nPatient is brought to designated location and reported to\nappropriate health care personnel\n3. Perform post-\ntransport procedures\n3.1\nEquipment is cleaned in accordance with established\nprocedures\n3.2\nEquipment is returned according to standard operating\nprocedures\n3.3\nWorking condition of equipment is reported immediately in\naccordance with established procedures.\n\n--- PDF PAGE 44 ---\nTR Health Care Services NC II\n-40-\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Transportation\nrequirements\nThese may include but not limited to:\n1.1\nMode of transport\n1.2\nDestination\n1.3\nInformation specific to the patient\n1.4\nAccompanying health professionals e.g. nurse or medical\nofficer\n1.5\nPatient clothing requirements\n1.6\nDocumentation requirements\n2. Transportation\nequipment\n2.1\nTransportation equipment:\n• Wheelchair\n• Stretcher\n• Bed\n• Ambulance\n2.2\nOther equipment\n• Oxygen trolley\n• IV Stand\n• oxygen gauge\n• Oxygen tank\n• Ambu bag\n3.6\nCommunication equipment\n• Cellular phone\n•\n2 way radios\n3. Relevant personnel\n3.1\nMedical officers\n3.2\nNursing staff\n3.3\nOther health personnel\n\n--- PDF PAGE 45 ---\nTR Health Care Services NC II\n-41-\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nConfirmed the transportation requirements with appropriate\nhealth care personnel\n1.2\nExplained the transport procedures to the patient\n1.3\nChecked and reported the condition of the equipment for\ntransportation\n1.4\nAdjusted equipment to ensure the patient’s comfort and safety\nwith minimal risk to self\n1.5\nInterpreted and followed instructions and guidance of health\nprofessionals with the care of patients\n1.6\nTransported and delivered patient to correct destination\n2. Underpinning\nknowledge\n2.1\nPatient handling procedures\n2.2\nProcedures for securing a patient\n2.3\nInfection control procedures\n2.4\nPatient confidentiality and privacy requirements\n2.5\nWhen patient issues need to be referred to an appropriate\nhealth professional\n3. Underpinning skills\n3.1\nApplying safe working practices, including manual handling\ntechniques\n3.2\nInterpreting and following the instructions and guidance of\nhealth professionals regarding care of the patients\n3.3\nReading and writing skills\n3.4\nOral communications skills\n3.5\nWorking with others and display empathy with patient and\nrelatives\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nAccess to equipment used for transporting patients\n4.2\nRelevant policies and procedures manuals\n4.3\nOrganizational charts\n4.4\nInstructions for the use of equipment\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1\nObservation\n5.2\nDemonstration with questioning\n5.3\nPortfolio\n6. Context of\nassessment\n6.1\nAssessment may be done in the workplace or in a simulated\nworkplace setting\n\n--- PDF PAGE 46 ---\nTR Health Care Services NC II\n-42-\nUNIT OF COMPETENCY :\nASSIST IN BIO-PSYCHOSOCIAL SUPPORT CARE OF\nPATIENTS\nUNIT CODE\n:\nHCS323318\nUNIT DESCRIPTOR\n:\nThis unit of competency covers the basic knowledge, skills and\nattitudes which apply to the provision of bio-psychosocial support\ncare of patients in various healthcare situations.\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Establish and\nmaintain rapport with\nthe patient\n1.1\nInitial contact is made with patient care and its appropriate\ntime according to the care plan and / or established\nprocedures\n1.2\nCourtesy is demonstrated in all communication with patients\nand staff in the workplace\n1.3\nInterpersonal exchanges are initiated with patient as\nappropriate\n1.4\nCommunication is developed and maintained for effective\nrelationship with patients\n1.5\nTrust and confidence of patient is consistently generated in all\nof the relevant work activities that are undertaken\n1.6\nConfidentiality and privacy of patient is consistently\nmaintained\n1.7\nPatient’s rights and roles in decision- making is respected\n2. Obtain information\nregarding the bio-\npsychosocial needs\nof the patient\n2.1\nPatient information is obtained from the family/significant\nothers and concerned health personnel\n2.2\nPatient bio-psychosocial care needs are determined and\nrecognized\n2.3\nScope, nature and frequency of patient support needs and\nconfirmed with patient and appropriate health personnel as\nrequired\n2.4\nPatient information is reported as appropriate and conforms\nwith ethico-moral, legal, professional and institutional\nrequirements\n3 Provide assistance to\nmeet patient needs\nas directed\n3.1\nComfort and safety measures are provided according to the\ncare plan and direction of the health professional\n3.2\nAssistance and support is provided with minimum physical\nand emotional discomfort to patients and with minimum risk to\nself\n3.3\nAssistance is provided in emergency situations according to\nprescribed protocol\n\n--- PDF PAGE 47 ---\nTR Health Care Services NC II\n-43-\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Patients\nPatients include:\nIndividuals with impairment such as :\n-\nVision impairment\n-\nHearing impairment\n-\nPhysical disability or frailty\n-\nMental or intellectual disability\n-\nCognitive impairment\n1.1\nFrail aged\n1.2\nYoung disabled\n1.3\nElderly discharge\n1.4\nMedical condition or illness\n1.5\nOther family members\n1.6\nA range of cultures and language backgrounds\n2. Communication\nCommunication may include:\n2.1\nOral\n2.2\nWritten\n2.3\nSign language\n2.4\nVernacular/Filipino/English\n3. Communication\nMay be by:\n3.1\nTelephone\n3.2\nCell phone\n3.3\nFace to Face\n3.4\nElectronic media\n3.5\nFax message\n3.6\nLetters, notes\n4. Confidentiality and\nPrivacy\n4.1\nWritten details(medical and consent forms)\n4.2\nConversation\n4.3\nInformation disclosed to appropriate person consistent with\none’s level of accountability\n4.4\nLegal and ethical requirements\n5. Patient information\n5.1\nDemographic details\n5.2\nLifestyle practice\n5.3\nPatient care plan\n5.4\nHistory (medical and mental)\n6. Concerned health\npersonnel\n6.1\nNurses\n6.2\nDoctors\n6.3\nSocial workers\n6.4\nNutritionists\n6.5\nTherapists\n6.6\nother members of the health team\n7. Bio-psychosocial\ncare needs\nBio-psychosocial care needs may include but not limited to:\n7.1\nNutrition\n7.2\nResponsive to changes: physical, psychological, financial\n7.3\nBio-psychosocial support system\n7.4\nActivities of daily living\n7.5\nAdjustment to illness and disability\n8. Emergency\nsituations\n8.1\nFalls/slipping\n8.2\nChoking/aspiration/suffocation\n8.3\nEquipment related accidents\n8.4\nBurns\n\n--- PDF PAGE 48 ---\nTR Health Care Services NC II\n-44-\nVARIABLE\nRANGE\n8.5\nDepression/suicide\n8.6\nAcute Confusion\n8.7\nPoisoning\n8.8\nFire\n8.9\nAssault\n8.10\nOther life threatening situations\n9. Comfort and Safety\nMeasures\nComfort and safety measures may include but not limited to:\n9.1\nCreating a therapeutic environment\n9.2\nPracticing body mechanics\n9.3\nMeasuring and assessing cardinal signs\n9.4\nPersonal hygiene and grooming\n9.5\nCleansing/tepid sponge bath\n9.6\nBed shampoo\n9.7\nChild/adult complete bed bath\n9.8\nPerineal Care\n9.9\nHot and cold applications\n9.10 Ensuring intake and output\n9.11\nPositioning and removing\n10. Physical, social,\nemotional, spiritual\nand culture\n10.1 Fees\n10.2 Health fund entitlements\n10.3 Welfare entitlements\n10.4 Payment Method and records\n10.5 Public environment\n10.6 Legal and ethical requirements\n10.7 Writing details i.e. medical and consent forms\n10.8 Conversations on the telephone\n10.9 Secure location for written records\n10.10 Offering a private location for discussions\n10.11 Information disclosed to an appropriate person consistent with\none’s level of responsibility\n\n--- PDF PAGE 49 ---\nTR Health Care Services NC II\n-45-\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nEstablished rapport with the patient\n1.2\nMaintained confidentiality and privacy\n1.3\nComplied with established policies and procedures\n1.4\nCommunicated effectively with patients and significant others\nand concerned health personnel\n1.5\nResponded effectively to patients lifestyle and psychosocial\ncare needs\n1.6\nProvided care with minimum risk to patient, self and other\nhealth personnel\n2. Underpinning\nknowledge\n2.1\nBasic knowledge on common diseases/ ailments of target\ngroups i.e. diabetes, Parkinson’s strokes etc\n2.2\nBasic life support\n2.3\nInfection control guidelines\n2.4\nExisting health services / facilities\n2.5\nRights and responsibilities of patient and health personnel\n2.6\nLiteracy and numeracy relative to delivery of patient care\n2.7\nLiving skills (activities of daily living)\n2.8\nOccupational Safety and Health\n2.9\nHACC (home and community care) guidelines\n2.10 Basic knowledge on how to handle difficult and challenging\nbehavior\n2.11 Institutional policies and procedures\n2.12 Basic knowledge on impact of lifestyle change\n2.13\nImpact of own values and beliefs on others\n3. Underpinning skills\n3.1\nOral and written communication skills\n3.2\nExercising patience and tolerance\n3.3\nUsing time management strategies to set priorities\n3.4\nFollowing institution policies and procedures relating to work\nperformance\n3.5\nBasic problem solving skills required include the ability to use\navailable resources and priority workload\n3.6\nDealing with conflict\n3.7\nWorking with others and display empathy with patient and\nsignificant others\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nDocumented patient health information\n4.2\nRelevant policies and procedures manuals\n4.3\nPatient care-related forms\n4.4\nWorkstation\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1\nThird party report\n5.2\nObservation of work performance at workstation\n5.3\nPortfolio\n5.4\nInterview\n6. Context of\nassessment\n6.1\nAssessment may be done in a workplace or in a simulated\nworkplace setting.\n\n--- PDF PAGE 50 ---\nTR Health Care Services NC II\n-46-\nUNIT OF COMPETENCY :\nHANDLE WASTE IN A HEALTH CARE ENVIRONMENT\nUNIT CODE\n:\nHCS323319\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes to handle and\ndispose of waste in a safe manner within the health care\nenvironment.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Determine job\nrequirements\n\n1.1\nWork sheets are reviewed to determine waste handling\nrequirements\n1.2\nAppropriate equipment required for waste handling tasks is\nselected and obtained to maximize work effectiveness and\nefficiency\n1.3\nHealth care sites are organized and set up to ensure safe,\neffective and efficient handling of waste in accordance with\nworkplace requirements and relevant legislation\n1.4\nPotential risks and hazards to work are identified and\nmanaged in accordance with workplace requirements, OSH,\ninfection control and other relevant legislation\n1.5\nReporting identified risks are followed in accordance with\nworkplace procedures\n1.6\nEmergency and personal protective equipment are selected\nand fitted in accordance with job requirements, manufactures’\nspecifications, workplace requirements and relevant\nlegislation\n2. Identify and\nsegregate waste\n2.1\nHazardous, dangerous and non-conforming waste is clearly\nidentified and handled in accordance with workplace policies\nand procedures as well as relevant legislation\n2.2\nAll waste are accurately identified, labeled and segregated\naccording to waste types in accordance with workplace\npolicies and procedures and relevant legislation\n2.3\nAll sorted waste are carefully placed into correct waste\ncategory containers to prevent litter in work areas and avoid\ncross-contamination\n2.4\nWaste containers are frequently monitored to ensure\nadequate available containers and to secure containment of\nwaste\n2.5\nFull waste containers are emptied or replaced promptly to\nminimize disruption to the workplace in accordance with\npolicies and procedures and job requirements\n2.6\nSegregated waste is clearly labeled in accordance with job\nrequirements, workplace policies and procedures and relevant\nlegislation\n3. Transport and store\nwaste\n3.1\nAppropriate transport equipment is selected for waste\ntransport activities to maximize work effectiveness and\nefficiency and in accordance with workplace policies and\nprocedures and relevant legislation\n\n--- PDF PAGE 51 ---\nTR Health Care Services NC II\n-47-\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n3.2\nAll transport equipment are color-coded and labeled in\naccordance with workplace policies and procedures and\nrelevant legislation\n3.3\nTransport loads are secured and not overloaded according to\nworkplace requirements and relevant legislation\n3.4\nWaste collection rounds are performed as often as required to\nminimize waste overflow hazards.\n3.5\nStorage areas are enclosed and secured in accordance with\nworkplace requirement and relevant legislation\n3.6\nWaste types are stored in accordance with relevant\nlegislation and workplace requirements\n4. Conduct quality\ncontrol activities\n4.1\nWaste is inspected and checked to ensure that it is placed in\nthe correct waste receptacle\n4.2\nStorage areas are inspected and checked to ensure that they\nare secured in accordance with workplace requirements and\nrelevant legislation\n4.3\nAll details of quality control activities are documented\naccurately and promptly in accordance with workplace\nrequirements and relevant legislation\n5. Clean up work areas\n5.1\nWaste storage sites and all equipment are cleaned to ensure\nsafe and effective future operation in accordance with\ncompany requirements\n5.2\nWaste from cleaning activities is disposed of in accordance\nwith workplace requirements, council requirements and\nrelevant legislation\n\n--- PDF PAGE 52 ---\nTR Health Care Services NC II\n-48-\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Health Care sites\n1.1\nHospitals\n1.2\n Nursing homes\n1.3\nClinics\n1.4\nCommunity settings\n1.5\nHome settings\n2. Waste categories\n2.1\nClinical waste\n2.2\nBody fluids, blood, suctioned fluids, excretions\n2.3\nSharps\n2.4\nCytotoxic waste\n2.5\nPharmaceutical waste\n2.6\nChemical waste\n2.7\nRadioactive waste\n2.8\nOrganic products\n2.9\nLiquid waste\n2.10\nGeneral waste\n3. Equipment\nEquipment include but not limited to:\n3.1\nBarriers and warning signs\n3.2\nSpill kits\n3.3\nMobile garbage bins and trolleys\n3.4\nAppropriate waste containers\n4. Potential risks and\nhazards\n4.1\nRisks and hazards that could lead to injury or illness of\nemployees, contractors, visitors or the public\n4.2\n Damage to plant\n4.3\n Vehicles or property\n4.4\nHarm the environment\n4.5\nManual handling\n4.6\nContamination\n4.7\nCompaction equipment\n4.8\nGases and fumes\n4.9\nHazardous waste i.e. sharps\n5. Emergency and\npersonal protective\nequipment\nMay include but not limited to:\n5.1\nGloves\n5.2\nOveralls and protective clothing\n5.3\nEye protection\n5.4\nAppropriate footwear\n5.5\nFire extinguisher\n5.6\nFirst aid Kit\n5.7\nSpill Kit\n5.8\nEmergency Procedures Guide\n5.9\nMaterial Safety Data Sheet information\n5.10 Breathing apparatus\n5.11 Face shield or mask\n5.12\nHearing protection\n6. Waste characteristics\nWaste characteristics may include but not limited to:\n6.1\nWaste streams\n6.2\nWaste types\n6.3\nWaste generation\n6.4\nDisposal Method\n6.5\nRecycling\n6.6\nReuse\n6.7\nContamination\n\n--- PDF PAGE 53 ---\nTR Health Care Services NC II\n-49-\nVARIABLE\nRANGE\n7. Cleaning Method\n7.1\nShoveling\n7.2\nSweeping out\n7.3\nVacuuming\n7.4\nUse of decontamination products\n7.5\nWater hosing\n7.6\nCleaning products/fluids\n8. Workplace\nprocedures\nWorkplace procedures may include but not limited to:\n8.1\nCleaning procedures\n8.2\nQuality activities\n8.3\nTeam meetings\n8.4\nIncident notification\n8.5\nWork performance requirements\n8.6\nInfection control practices\n\n--- PDF PAGE 54 ---\nTR Health Care Services NC II\n-50-\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nInterpreted job requirements\n1.2\nOrganized work areas and waste containers\n1.3\nSelected appropriate emergency and personal protective\nequipment\n1.4\nIdentified potential risks, hazards to waste handling and waste\nnon- conformances\n2. Underpinning\nknowledge\n2.1\nWaste types, streams and characteristics\n2.2\nSite waste management processes\n2.3\nWorkplace waste management plans\n2.4\n Waste contaminants\n2.5\n Waste non-conformance procedures\n2.6\nPotential risks and hazards to waste sorting and containment\n2.7\nSorting and transporting techniques\n2.8\nContainment Method\n2.9\nEmergency response procedures\n2.10\nWorkplace requirements\n2.11\nOccupational health and safety requirements\n2.12\nDuty of care in provision of waste handling activities\n2.13\nRelevant industry standards\n2.14\nRelevant legislation\n2.15\nRelevant environmental regulations\n2.16\nInfection control guidelines\n3. Underpinning skills\n3.1\nCommunication skills\n3.2\nIdentifying waste streams/types/characteristics\n3.3\nReading and interpreting work requirements\n3.4\nOrganizing equipment availability\n3.5\nOperating Equipment\n3.6\nMaterials handling skills\n3.7\nIdentifying waste types\n3.8\nIdentifying and handling waste non-conformances\n3.9\nPackaging and containment of waste\n3.10\nMethodical organization of work\n3.11\nSafe and efficient work practices\n3.12\nUsing emergency and personal protective equipment\n4. Resource implications\n\nThe following resources MUST be provided:\n4.1\nWaste collection requirements\n4.2\nWaste management plans\n4.3\nRange of wastes for identification and handling\n4.4\nWorkplace policies and procedures\n4.5\nOHS requirements\n4.6\nPersonal protective equipment\n4.7\nEquipment for waste handling\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1\nDemonstration with questioning\n5.2\nInterview\n5.3\nPortfolio\n6. Context of\nassessment\nThis unit is most appropriately assessed in the workplace or in\nsimulated workplace environment\n\n--- PDF PAGE 55 ---\nTR Health Care Services NC II\n-51-"
