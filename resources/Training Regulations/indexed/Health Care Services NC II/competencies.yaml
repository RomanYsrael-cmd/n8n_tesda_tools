s \n2.4 \nCytotoxic waste \n2.5 \nPharmaceutical waste \n2.6 \nChemical waste \n2.7 \nRadioactive waste \n2.8 \nOrganic products \n2.9 \nLiquid waste \n2.10\nGeneral waste\n3. Equipment \nEquipment include but not limited to: \n3.1 \nBarriers and warning signs \n3.2 \nSpill kits \n3.3 \nMobile garbage bins and trolleys \n3.4\nAppropriate waste containers\n4. Potential risks and \nhazards \n4.1 \nRisks and hazards that could lead to injury or illness of \nemployees, contractors, visitors or the public \n4.2 \n Damage to plant \n4.3 \n Vehicles or property \n4.4 \nHarm the environment \n4.5 \nManual handling \n4.6 \nContamination \n4.7 \nCompaction equipment \n4.8 \nGases and fumes \n4.9\nHazardous waste i.e. sharps\n5. Emergency and \npersonal protective \nequipment \nMay include but not limited to: \n5.1 \nGloves \n5.2 \nOveralls and protective clothing \n5.3 \nEye protection \n5.4 \nAppropriate footwear \n5.5 \nFire extinguisher \n5.6 \nFirst aid Kit \n5.7 \nSpill Kit \n5.8 \nEmergency Procedures Guide \n5.9 \nMaterial Safety Data Sheet information \n5.10 Breathing apparatus \n5.11 Face shield or mask \n5.12\nHearing protection\n6. Waste characteristics \nWaste characteristics may include but not limited to: \n6.1  \nWaste streams \n6.2 \nWaste types \n6.3 \nWaste generation \n6.4 \nDisposal Method \n6.5 \nRecycling \n6.6 \nReuse \n6.7\nContamination\n\n--- PDF PAGE 53 ---\nTR Health Care Services NC II \n-49- \nVARIABLE \nRANGE \n7. Cleaning Method \n7.1 \nShoveling \n7.2 \nSweeping out \n7.3 \nVacuuming \n7.4 \nUse of decontamination products \n7.5 \nWater hosing \n7.6\nCleaning products/fluids\n8. Workplace \nprocedures  \nWorkplace procedures may include but not limited to: \n8.1 \nCleaning procedures \n8.2 \nQuality activities \n8.3 \nTeam meetings \n8.4 \nIncident notification \n8.5 \nWork performance requirements \n8.6\nInfection control practices\n\n--- PDF PAGE 54 ---\nTR Health Care Services NC II \n-50-"
