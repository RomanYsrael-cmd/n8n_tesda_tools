        "source_text": "--- PDF PAGE 46 ---\nTR Health Care Services NC II \n-42- \nUNIT OF COMPETENCY : \nASSIST IN BIO-PSYCHOSOCIAL SUPPORT CARE OF \nPATIENTS \nUNIT CODE \n: \nHCS323318 \nUNIT DESCRIPTOR \n: \nThis unit of competency covers the basic knowledge, skills and \nattitudes which apply to the provision of bio-psychosocial support \ncare of patients in various healthcare situations. \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1. Establish and \nmaintain rapport with \nthe patient \n1.1 \nInitial contact is made with patient care and its appropriate \ntime according to the care plan and / or established \nprocedures \n1.2 \nCourtesy is demonstrated in all communication with patients \nand staff in the workplace \n1.3 \nInterpersonal exchanges are initiated with patient as \nappropriate \n1.4 \nCommunication is developed and maintained for effective \nrelationship with patients \n1.5 \nTrust and confidence of patient is consistently generated in all \nof the relevant work activities that are undertaken \n1.6 \nConfidentiality and privacy of patient is consistently \nmaintained \n1.7\nPatient’s rights and roles in decision- making is respected\n2. Obtain information \nregarding the bio-\npsychosocial needs \nof the patient \n2.1 \nPatient information is obtained from the family/significant \nothers and concerned health personnel \n2.2 \nPatient bio-psychosocial care needs are determined and \nrecognized \n2.3 \nScope, nature and frequency of patient support needs and \nconfirmed with patient and appropriate health personnel as \nrequired \n2.4 \nPatient information is reported  as appropriate and conforms \nwith ethico-moral, legal, professional and institutional \nrequirements \n3 Provide assistance to \nmeet patient needs \nas directed \n3.1 \nComfort and safety measures are provided according to the \ncare plan and direction of the health professional \n3.2 \nAssistance and support is provided with minimum physical \nand emotional discomfort to patients and with minimum risk to \nself \n3.3 \nAssistance is provided in emergency situations according to \nprescribed protocol\n\n--- PDF PAGE 47 ---\nTR Health Care Services NC II \n-43- \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Patients \nPatients include: \nIndividuals with impairment such as : \n- \nVision impairment \n- \nHearing impairment \n- \nPhysical disability or frailty \n- \nMental or intellectual disability \n- \nCognitive impairment \n1.1 \nFrail aged \n1.2 \nYoung disabled \n1.3 \nElderly discharge \n1.4 \nMedical condition or illness \n1.5 \nOther family members \n1.6\nA range of cultures and language backgrounds\n2. Communication  \nCommunication may include: \n2.1 \nOral \n2.2 \nWritten \n2.3 \nSign language \n2.4\nVernacular/Filipino/English\n3. Communication \nMay be by: \n3.1 \nTelephone \n3.2 \nCell phone \n3.3 \nFace to Face \n3.4 \nElectronic media \n3.5 \nFax message \n3.6\nLetters, notes\n4. Confidentiality and \nPrivacy  \n4.1 \nWritten details(medical and consent forms) \n4.2 \nConversation \n4.3 \nInformation disclosed to appropriate person consistent with \none’s level of accountability \n4.4\nLegal and ethical requirements\n5. Patient information  \n5.1 \nDemographic details \n5.2 \nLifestyle practice \n5.3 \nPatient care plan \n5.4\nHistory (medical and mental)\n6. Concerned health \npersonnel  \n6.1 \nNurses \n6.2 \nDoctors \n6.3 \nSocial workers \n6.4 \nNutritionists \n6.5 \nTherapists \n6.6\nother members of the health team\n7. Bio-psychosocial \ncare needs  \nBio-psychosocial care needs may include but not limited to: \n7.1 \nNutrition \n7.2 \nResponsive to changes: physical, psychological, financial \n7.3 \nBio-psychosocial support system \n7.4 \nActivities of daily living \n7.5\nAdjustment to illness and disability\n8. Emergency \nsituations \n8.1 \nFalls/slipping \n8.2 \nChoking/aspiration/suffocation \n8.3 \nEquipment related accidents \n8.4\nBurns\n\n--- PDF PAGE 48 ---\nTR Health Care Services NC II \n-44- \nVARIABLE \nRANGE \n8.5 \nDepression/suicide \n8.6 \nAcute Confusion \n8.7 \nPoisoning \n8.8 \nFire \n8.9 \nAssault \n8.10\nOther life threatening situations\n9. Comfort and Safety \nMeasures \nComfort and safety measures may  include but not limited to: \n9.1 \nCreating a therapeutic environment \n9.2 \nPracticing body mechanics  \n9.3 \nMeasuring and assessing cardinal signs \n9.4 \nPersonal hygiene and grooming \n9.5 \nCleansing/tepid sponge bath \n9.6 \nBed shampoo \n9.7 \nChild/adult complete bed bath \n9.8 \nPerineal Care \n9.9 \nHot and cold applications \n9.10 Ensuring intake and output \n9.11\nPositioning and removing\n10. Physical, social, \nemotional, spiritual \nand culture \n10.1 Fees \n10.2 Health fund entitlements \n10.3 Welfare entitlements \n10.4 Payment Method and records \n10.5 Public environment \n10.6 Legal and ethical requirements \n10.7 Writing details i.e. medical and consent forms \n10.8 Conversations on the telephone \n10.9 Secure location for written records \n10.10 Offering a private location for discussions \n10.11 Information disclosed to an appropriate person consistent with \none’s level of responsibility\n\n--- PDF PAGE 49 ---\nTR Health Care Services NC II \n-45- \nEVIDENCE GUIDE \n \n1. Critical aspects of \ncompetency  \nAssessment requires evidence that the candidate: \n1.1 \nEstablished rapport with the patient \n1.2 \nMaintained confidentiality and privacy \n1.3 \nComplied with established policies and procedures \n1.4 \nCommunicated effectively with patients and significant others \nand concerned health personnel \n1.5 \nResponded effectively to patients lifestyle and psychosocial \ncare needs \n1.6 \nProvided care with minimum risk to patient, self and other \nhealth personnel\n2. Underpinning \nknowledge  \n2.1 \nBasic knowledge on common diseases/ ailments of target \ngroups i.e. diabetes, Parkinson’s strokes etc \n2.2 \nBasic life support \n2.3 \nInfection control guidelines \n2.4 \nExisting health services / facilities \n2.5 \nRights and responsibilities of patient and health personnel \n2.6 \nLiteracy and numeracy relative to delivery of patient care \n2.7 \nLiving skills (activities of daily living) \n2.8 \nOccupational Safety and Health \n2.9 \nHACC (home and community care) guidelines \n2.10 Basic knowledge on how to handle difficult and challenging \nbehavior \n2.11 Institutional policies and procedures \n2.12 Basic knowledge on impact of lifestyle change \n2.13\nImpact of own values and beliefs on others\n3. Underpinning skills \n3.1 \nOral and written communication skills \n3.2 \nExercising patience and tolerance \n3.3 \nUsing time management strategies to set priorities \n3.4 \nFollowing institution policies and procedures relating to work \nperformance \n3.5 \nBasic problem solving skills required include the ability to use \navailable resources and priority workload \n3.6 \nDealing with conflict \n3.7 \nWorking with others and display empathy with patient and \nsignificant others\n4. Resource \nimplications \nThe following resources MUST be provided: \n4.1 \nDocumented patient health information \n4.2 \nRelevant policies and procedures manuals \n4.3 \nPatient care-related forms \n4.4\nWorkstation\n5. Method of \nassessment \nCompetency may be assessed through: \n5.1 \nThird party report \n5.2 \nObservation of work performance at workstation \n5.3 \nPortfolio  \n5.4\nInterview\n6. Context of \nassessment\n6.1 \nAssessment may be done in a workplace or in a simulated \nworkplace setting.\n",
