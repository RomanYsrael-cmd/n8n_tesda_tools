        "source_text": "--- PDF PAGE 50 ---\nTR Health Care Services NC II \n-46- \nUNIT OF COMPETENCY : \nHANDLE WASTE IN A HEALTH CARE ENVIRONMENT \nUNIT CODE \n: \nHCS323319 \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge, skills and attitudes to handle and \ndispose of waste in a safe manner within the health care \nenvironment.   \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1. Determine job \nrequirements \n \n1.1 \nWork sheets are reviewed to determine waste handling \nrequirements \n1.2 \nAppropriate equipment required for waste handling tasks is \nselected and obtained to maximize work effectiveness and \nefficiency \n1.3 \nHealth care sites are organized and set up to ensure safe, \neffective and efficient handling of waste in accordance with \nworkplace requirements and relevant legislation \n1.4 \nPotential risks and hazards to work are identified and \nmanaged in accordance with workplace requirements, OSH, \ninfection control and other relevant legislation \n1.5 \nReporting identified risks are followed in accordance with \nworkplace procedures \n1.6 \nEmergency and personal protective equipment are selected \nand fitted in accordance with job requirements, manufactures’ \nspecifications, workplace requirements and relevant \nlegislation\n2. Identify and \nsegregate waste \n2.1 \nHazardous, dangerous and non-conforming waste is clearly \nidentified and handled in accordance with workplace policies \nand procedures as well as relevant legislation \n2.2 \nAll waste are accurately identified, labeled and segregated \naccording to waste types in accordance with workplace \npolicies and procedures and relevant legislation \n2.3 \nAll sorted waste are carefully placed into correct waste \ncategory containers to prevent litter in work areas and avoid \ncross-contamination \n2.4 \nWaste containers are frequently monitored to ensure \nadequate available containers and to secure containment of \nwaste \n2.5 \nFull waste containers are emptied or replaced promptly to \nminimize disruption to the workplace in accordance with \npolicies and procedures and job requirements \n2.6 \nSegregated waste is clearly labeled in accordance with job \nrequirements, workplace policies and procedures and relevant \nlegislation\n3. Transport and store \nwaste  \n3.1 \nAppropriate transport equipment is selected for waste \ntransport activities to maximize work effectiveness and \nefficiency and in accordance with workplace policies and \nprocedures and relevant legislation\n\n--- PDF PAGE 51 ---\nTR Health Care Services NC II \n-47- \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n3.2 \nAll transport equipment are color-coded and labeled in \naccordance with workplace policies and procedures and \nrelevant legislation \n3.3 \nTransport loads are secured and not overloaded according to \nworkplace requirements and relevant legislation \n3.4 \nWaste collection rounds are performed as often as required to \nminimize waste overflow hazards. \n3.5 \nStorage areas are enclosed and secured in accordance with \nworkplace requirement and relevant legislation \n3.6 \nWaste types are stored in accordance with relevant \nlegislation and workplace requirements\n4. Conduct quality \ncontrol activities \n4.1 \nWaste is inspected and checked to ensure that it is placed in \nthe correct waste receptacle \n4.2 \nStorage areas are inspected and checked to ensure that they \nare secured in accordance with workplace requirements and \nrelevant legislation \n4.3 \nAll details of quality control activities are documented \naccurately and promptly in accordance with workplace \nrequirements and relevant legislation\n5. Clean up work areas \n5.1 \nWaste storage sites and all equipment are cleaned to ensure \nsafe and effective future operation in accordance with \ncompany requirements \n5.2 \nWaste from cleaning activities is disposed of in accordance \nwith workplace requirements, council requirements and \nrelevant legislation\n\n--- PDF PAGE 52 ---\nTR Health Care Services NC II \n-48- \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Health Care sites \n1.1 \nHospitals \n1.2 \n Nursing homes \n1.3 \nClinics  \n1.4 \nCommunity settings \n1.5\nHome settings\n2. Waste categories \n2.1 \nClinical waste \n2.2 \nBody fluids, blood, suctioned fluids, excretions \n2.3 \nSharps \n2.4 \nCytotoxic waste \n2.5 \nPharmaceutical waste \n2.6 \nChemical waste \n2.7 \nRadioactive waste \n2.8 \nOrganic products \n2.9 \nLiquid waste \n2.10\nGeneral waste\n3. Equipment \nEquipment include but not limited to: \n3.1 \nBarriers and warning signs \n3.2 \nSpill kits \n3.3 \nMobile garbage bins and trolleys \n3.4\nAppropriate waste containers\n4. Potential risks and \nhazards \n4.1 \nRisks and hazards that could lead to injury or illness of \nemployees, contractors, visitors or the public \n4.2 \n Damage to plant \n4.3 \n Vehicles or property \n4.4 \nHarm the environment \n4.5 \nManual handling \n4.6 \nContamination \n4.7 \nCompaction equipment \n4.8 \nGases and fumes \n4.9\nHazardous waste i.e. sharps\n5. Emergency and \npersonal protective \nequipment \nMay include but not limited to: \n5.1 \nGloves \n5.2 \nOveralls and protective clothing \n5.3 \nEye protection \n5.4 \nAppropriate footwear \n5.5 \nFire extinguisher \n5.6 \nFirst aid Kit \n5.7 \nSpill Kit \n5.8 \nEmergency Procedures Guide \n5.9 \nMaterial Safety Data Sheet information \n5.10 Breathing apparatus \n5.11 Face shield or mask \n5.12\nHearing protection\n6. Waste characteristics \nWaste characteristics may include but not limited to: \n6.1  \nWaste streams \n6.2 \nWaste types \n6.3 \nWaste generation \n6.4 \nDisposal Method \n6.5 \nRecycling \n6.6 \nReuse \n6.7\nContamination\n\n--- PDF PAGE 53 ---\nTR Health Care Services NC II \n-49- \nVARIABLE \nRANGE \n7. Cleaning Method \n7.1 \nShoveling \n7.2 \nSweeping out \n7.3 \nVacuuming \n7.4 \nUse of decontamination products \n7.5 \nWater hosing \n7.6\nCleaning products/fluids\n8. Workplace \nprocedures  \nWorkplace procedures may include but not limited to: \n8.1 \nCleaning procedures \n8.2 \nQuality activities \n8.3 \nTeam meetings \n8.4 \nIncident notification \n8.5 \nWork performance requirements \n8.6\nInfection control practices\n\n--- PDF PAGE 54 ---\nTR Health Care Services NC II \n-50- \nEVIDENCE GUIDE \n \n1. Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1 \nInterpreted job requirements \n1.2 \nOrganized work areas and waste containers \n1.3 \nSelected appropriate emergency and personal protective \nequipment  \n1.4 \nIdentified potential risks, hazards to waste handling and waste \nnon- conformances\n2. Underpinning \nknowledge \n2.1 \nWaste types, streams and characteristics \n2.2 \nSite waste management processes \n2.3 \nWorkplace waste management plans \n2.4 \n Waste contaminants \n2.5 \n Waste non-conformance procedures \n2.6 \nPotential risks and hazards to waste sorting and containment \n2.7 \nSorting and transporting techniques \n2.8 \nContainment Method \n2.9 \nEmergency response procedures \n2.10 \nWorkplace requirements \n2.11 \nOccupational health and safety requirements \n2.12 \nDuty of care in provision of waste handling activities \n2.13 \nRelevant industry standards \n2.14 \nRelevant legislation \n2.15 \nRelevant environmental regulations \n2.16\nInfection control guidelines\n3. Underpinning skills \n3.1 \nCommunication skills \n3.2 \nIdentifying waste streams/types/characteristics \n3.3 \nReading and interpreting work requirements \n3.4 \nOrganizing equipment availability \n3.5 \nOperating Equipment  \n3.6 \nMaterials handling skills \n3.7 \nIdentifying waste types \n3.8 \nIdentifying and handling waste non-conformances \n3.9 \nPackaging and containment of waste \n3.10 \nMethodical organization of work \n3.11 \nSafe and efficient work practices \n3.12\nUsing emergency and personal protective  equipment\n4. Resource implications \n \nThe following resources MUST be provided: \n4.1 \nWaste collection requirements \n4.2 \nWaste management plans \n4.3 \nRange of wastes for identification and handling \n4.4 \nWorkplace policies and procedures \n4.5 \nOHS requirements \n4.6 \nPersonal protective equipment \n4.7\nEquipment for waste handling\n5. Method of \nassessment \nCompetency may be assessed through: \n5.1 \nDemonstration with questioning \n5.2 \nInterview \n5.3\nPortfolio\n6. Context of \nassessment\nThis unit is most appropriately assessed in the workplace or in \nsimulated workplace environment\n",
