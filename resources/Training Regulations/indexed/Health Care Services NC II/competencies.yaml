        "evidence_guide": {
          "source_text": "1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nPerformed safe handling Method in assisting with patient\nmobility\n1.2\nEnsured patient privacy at all times\n1.3\nImplemented comfort and safety measures according to\nestablished procedures\n1.4\nUtilized appropriate communication techniques in instructing\npatients\n1.5\nCleaned equipment in accordance with established\nprocedures\n1.6\nReported condition of equipment according to established\nprocedures\n1.7\nObserved strict infection control guidelines\n2. Underpinning\nknowledge\n2.1\nPatient confidentiality and privacy requirements\n2.2\nCleaning policy and procedures for lifting and transferring\nequipment\n2.3\nPatient condition as it relates to patient mobility\n2.4\nOSH procedures\n2.5\nInfection control guidelines\n2.6\nAppropriate communication techniques\n2.7\nEquipment use and specifications\n3. Underpinning skills\n3.1\nUsing appropriate equipment for patient mobility\n3.2\nCommunicating effectively with patients and concerned health\ncare personnel\n3.3\nSafe handling skills\n3.4\nOral and written communication skills\n3.5\nDealing with conflicts\n3.6\nWorking with others and display empathy with patient and\nrelatives\n4. Resource\nimplications\nThe following resources MUST be provided during assessment\nexcept in cases where portfolio or third-party report will be used:\n4.1\nWorkplace health and safety manual\n4.2\nInfection control manual\n4.3\nStandard Operating Procedures manual\n4.4\nEquipment manufacturer’s instructions\n4.5\nEquipment as described in the range of variables\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1\nDemonstration with questioning\n5.2\nPortfolio\n5.3\nThird party report\n6. Context of\nassessment\n6.1\n Competency assessment may be done in a simulated\nworkplace setting.\n\n--- PDF PAGE 43 ---\nTR Health Care Services NC II\n-39-\nUNIT OF COMPETENCY :\nASSIST IN TRANSPORTING PATIENTS\nUNIT CODE\n:"
