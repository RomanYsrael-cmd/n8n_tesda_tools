ons for the use of equipment and materials \nrelevant to the proposed activities \n- \nspecific instructions for staff \n-\nworkstation\n5. Method of \nassessment \nCompetency may be assessed through at least two of the following \nMethod: \n5.1 \nObservation of performance  \n5.2 \nInterview \n5.3 \nThird party report \n5.4 \nPortfolio \n5.5\nDemonstration with questioning\n6. Context of \nassessment\n6.1 \n Competency assessment may be done in the workplace or in \na simulated workplace setting.",
