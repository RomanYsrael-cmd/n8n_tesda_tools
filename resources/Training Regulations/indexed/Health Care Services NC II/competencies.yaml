        "source_title": "IMPLEMENT AND MONITOR INFECTION CONTROL POLICIES AND PROCEDURES",
        "source_text": "--- PDF PAGE 18 ---\nTR Health Care Services NC II \n-14- \nCOMMON COMPETENCIES \n \nUNIT OF COMPETENCY : \nIMPLEMENT AND MONITOR INFECTION CONTROL POLICIES \nAND PROCEDURES \nUNIT CODE \n: \nHCS323201 \nUNIT DESCRIPTOR \n: \nThis unit is concerned with infection control responsibilities of \nemployees with supervisory accountability to implement and \nmonitor infection control policy and procedures in a specific work \nunit or team within an organization. This unit does not apply to a \nrole with organization-wide responsibilities for infection control \npolicy and procedure development, implementation or monitoring. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1. Provide information \nto the work group \nabout the \norganization's \ninfection control \npolicies and \nprocedures. \n1.1 \nRelevant information about the organization's infection control \npolicy and procedures, and applicable industry codes of \npractice are accurately and clearly explained to the work \ngroup \n1.2 \nInformation about identified hazards and the outcomes of \ninfection risk assessments is regularly provided to the work \ngroup \n1.3 \nOpportunity is provided for the work group to seek further \ninformation on workplace infection control issues and \npractices\n2. Integrate the \norganization's \ninfection control \npolicy and procedure \ninto work practices \n2.1 \nInfection control policy and procedures are implemented by \nsupervisor and members of the work group. \n2.2 \nLiaison is maintained with person responsible for organization-\nwide infection control. \n2.3 \nThe Supervisor's coaching support ensures that \nindividuals/teams are able to implement infection control \npractices \n2.4 \nWork procedures are adopted to reflect appropriate infection \ncontrol practice \n2.5 \nIssues raised through consultation are dealt with and resolved \npromptly or referred to the appropriate personnel for resolution\n2.6 \nWorkplace procedures for dealing with infection control risks \nand hazardous events are implemented whenever necessary \n2.7 \nEmployees are encouraged to report infection risks and to \nimprove infection control procedures\n3. Monitor infection \ncontrol performance \nand implement \nimprovements in \npractices \n3.1 \nInfection control hazardous events are investigated promptly \nto identify their cause in accordance with organization policy \nand procedures \n3.2 \nWork procedures to control infection risks are monitored to \nensure compliance \n3.3 \nWork procedures are regularly reviewed and adjusted to \nensure improvements in infection control practice\n\n--- PDF PAGE 19 ---\nTR Health Care Services NC II \n-15- \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n3.4 \nSupervisor provides feedback to team and individuals on \ncompliance issues, changes in work procedures and infection \ncontrol outcomes \n3.5 \nTraining in work procedures is provided as  required to ensure \nmaintenance of infection control standards \n3.6 \nInadequacies in work procedures and infection control \nmeasures are identified, corrected or reported to designated \npersonnel \n3.7 \nRecords of infection control risks and incidents are accurately \nmaintained as required \n3.8 \nAggregate infection control information reports are used to \nidentify hazards, to monitor and improve risk control Method \nand to indicate training needs\n\n--- PDF PAGE 20 ---\nTR Health Care Services NC II \n-16- \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Infection Control \nPolicies and \nProcedures  \nThis may include but not limited to: \n1.1 \nCleaning procedures and schedules \n1.2 \nCleaning agents \n1.3 \nCleaning equipment \n1.4 \nHandling, storage and disposal of all types of waste \n1.5 \nFood handling and food safety \n1.6 \nHygiene procedures \n1.7 \nInfection control risk management \n1.8 \nInfection control incident and hazard reporting \n1.9 \nSterilizing \n1.10 Linen production and handling \n1.11 Maintenance procedures \n1.12 Storage requirements \n1.13 Personal protective clothing \n1.14 Work flows \n1.15 Management of blood and body fluid spills \n1.16 Single use of disposable \n1.17 Aseptic techniques \n1.18 Skin preparation procedures \n1.19 Immunization \n1.20 Needle stick injuries \n1.21 Personal contact with infectious patients \n1.22 Standard and additional precautions \n1.23 Confidentiality \n1.24 Employee training \n1.25\nContractors\n2. Industry Codes of \nPractice \n2.1 \nNational Health and Medical Research Council Guidelines for \ninfection control \n2.2 \nLocal & National Government Guidelines and Standards \n2.3\nManufacturer's recommendations and operating manuals\n3. Identified hazards \nand the outcomes of \ninfection risk \nassessments  \n3.1 \nSharps \n3.2 \nGlass \n3.3 \nWaste \n3.4 \nHuman waste and human tissues \n3.5 \nPersonal contact with infectious patients \n3.6 \nAnimals, insects and vermin \n3.7 \nStock, including food, which has passed \"used-by\" dates. \n3.8 \nIncorrect concentration of disinfectants and chemicals \n3.9 \nCleaning procedures \n3.10 Linen handling procedures \n3.11 Work flows \n3.12 Use of personal protective clothing \n3.13 Food safety \n3.14\nPersonal hygiene\n4. Infection Control \nMonitoring \nProcedures  \n4.1 \nObservations \n4.2 \nInterviews \n4.3 \nSurveys and inspections \n4.4 \nQuality assurance activities \n4.5 \nReview of outcomes \n4.6\nData analysis\n\n--- PDF PAGE 21 ---\nTR Health Care Services NC II \n-17- \nVARIABLE \nRANGE \n5. Designated \npersonnel  \n5.1 \nManager \n5.2 \nInfection Control Coordinator \n5.3 \nQuality Improvement Coordinator \n5.4 \nInfection Control Committee \n5.5\nOccupational Health and Safety Committee\n6. Aggregate infection \ncontrol information  \n6.1 \nRecords of needle stick injuries \n6.2 \nHospital-acquired infection rates \n6.3 \nDOH healthcare standards clinical indicators \n6.4 \nHACCP records \n6.5\nHazard reports\n\n--- PDF PAGE 22 ---\nTR Health Care Services NC II \n-18- \nEVIDENCE GUIDE \n \n1. Critical aspects of \ncompetency \nAssessment requires evidence that the candidate  \n1.1 \nCommunicated with team and individuals on organizational \npolicy and procedures for infection control \n1.2 \nApplied infection control policies and procedures which impact \non work processes of the specific work unit \n1.3 \nApplied procedures for adopting appropriate infection \npractices within work unit \n1.4 \nProvided appropriate supervision of work group \n2. Underpinning  \nknowledge  \n2.1 \nWorking knowledge, consistent with the elements of \ncompetence, of the organization's applicable infection control \npolicy and procedures and relevant industry codes of practice \n2.2 \nThe hierarchy risk control measures from most to least \npreferred, that is, elimination, engineering controls, \nadministrative control, and lastly, personal protective \nequipment \n2.3 \nKnowledge of infection risks and control measures in specific \nwork unit and related work processes \n2.4 \nThe significance of patient confidentiality in relation to \ninfection control \n2.5 \nThe significance of other management systems and \nprocedures for infection control \n2.6 \nLiteracy levels and communication skills of work group \nmembers and consequent suitable communication techniques \n2.7 \nOrganizational procedures for monitoring, training \n2.8\nBasic understanding of communicable disease transmission\n3. Underpinning skills  \n3.1 \nEffective communicating and interpersonal skills including: \n language competence \n literacy and reading competence \n3.2 \nNegotiating Skills \n3.3 \nWork planning and management \n3.4 \nManaging change of work processes \n3.5 \nMonitoring compliance with policy and procedures \n3.6\nMaintaining and interpreting infection control records\n4. Resource \nimplications \nThe following resources MUST be provided: \n4.1 \nWorkplace infection control and health and safety policies and \nprocedures \n4.2 \nWaste management procedures \n4.3 \nFood safety procedures \n4.4 \nOther organizational policies and procedures  \n4.5\nDuties statements and/or job descriptions\n5. Method of \nassessment \nCompetency may be assessed through: \n5.1 \nObservation  \n5.2 \nInterview \n5.3 \nPortfolio \n5.4\nDemonstration with questioning\n6. Context of \nassessment \n6.1 \nAssessment may be done in the workplace or in a simulated \nworkplace setting.\n",
