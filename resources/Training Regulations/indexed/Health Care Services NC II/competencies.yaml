        "source_title": "COLLECT AND MAINTAIN LINEN STOCKS AT END-USER LOCATIONS",
        "source_text": "--- PDF PAGE 37 ---\nTR Health Care Services NC II \n-33- \nUNIT OF COMPETENCY : \nCOLLECT AND MAINTAIN LINEN STOCKS  AT  END-USER  \nLOCATIONS \nUNIT CODE \n: \nHCS323315 \nUNIT DESCRIPTOR \n: \nThis unit of competency covers the knowledge, skills and  attitudes \nrequired to collect soiled linen from end-user locations, deliver \nsoiled linen to a designated holding area, distribute clean linen and \nmaintain linen stock levels at end-user locations. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1. Collect soiled linen \n1.1 \nSoiled linen is collected as scheduled from end user \nlocations \n1.2 \nSoiled linen bag is replaced in accordance with institution \npolicies and procedures \n1.3 \nSoiled linen is transported to designated holding area using \nappropriate equipment and safe handling techniques \n1.4 \nCollection of soiled linen is carried out in a  manner that \nminimizes the risk of cross contamination and complies with \nOHS policy and procedures \n1.5 \nHazards are identified and reported to supervisor \n1.6 \nAppropriate procedures for dealing with accidents, including \nsharp injuries are followed correctly\n2. Distribute clean linen \n2.1 \nClean linen is transported as scheduled to end- user locations \nusing appropriate equipment and  safe handling techniques \n2.2 \n Linen is replaced to ensure adequate supply for users \n2.3\nLinen stock is rotated and old stock returned for reprocessing\n3.  Maintain linen stock \nlevels \n3.1 \nOptimum stock levels are maintained to  ensure linen \navailability \n3.2 \nLinen is requisitioned to  par level quantity  \n3.3 \nLinen is stored  in linen storage facilities  and   maintained \naccording to institution requirements \n3.4 \n Linen stock records are maintained according to institution \nrequirements   \n3.5 \nLinen inventory is done according to institution policies and  \nprocedures\n\n--- PDF PAGE 38 ---\nTR Health Care Services NC II \n-34- \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. End-User Locations  \n1.1 \nHospital \n1.2 \nAged care facility \n1.3 \nResidential accommodate \n1.4 \nOperating room \n1.5 \nOut-Patient Services \n1.6 \nCentral Supply Room \n1.7 \nHealth Clinics \n1.8\nCommunity health facilities\n2. Institutional policies & \nprocedures \n2.1 \nLinen stock delivery, inventory management and stock \nrotation \n2.2 \nCollection locations and procedures \n2.3 \nStandard work practice for safe handling of soiled linen \n2.4 \nUse of protective clothing \n2.5 \nNotification of hazards and accidents \n2.6 \nData recording (manual or electronic) \n2.7\nSecurity and safe storage of clean and soiled linen\n3. Equipment \n3.1 \nLinen trolleys of various sizes \n3.2 \nLinen bags \n3.3 \nBaskets \n3.4\nBins\n4. Hazards \n4.1 \nExposure to heat \n4.2 \nSharp objects \n4.3 \nPotentially infectious materials \n4.4\nExposure to harmful chemicals\n5. Maintenance of \noptimum linen stock \nlevels\n5.1 \nReview of inventory levels for each linen item \n5.2 \nAssessment of user requirements based on past and \nexpected utilization of linen\n6. Linen Stock Records  6.1 \nPatients \n6.2 \nRequisition of forms \n6.3 \nStock cards \n6.4 \nInventory forms \n6.5\nPhilippine standards, infection control and quality standards\n7. Linen storage \nfacilities \n7.1 \nShelves \n7.2 \nRacks \n7.3 \nTrolleys \n7.4 \nCabinets \n7.5\nLinen bags\n\n--- PDF PAGE 39 ---\nTR Health Care Services NC II \n-35- \nEVIDENCE GUIDE \n \n1. Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1 \nComplied with institutional requirements, OSH laws, infection \ncontrol and manual handling procedures and relevant health \nregulations \n1.2 \nCollected soiled linen \n1.3 \nDistributed clean linen \n1.4 \nMaintained stock levels of linen accurately and in a timely and \nsafe manner \n1.5 \nCompleted work systematically with attention to details, \nwithout injury to patient and self, damage to goods, equipment \nor risk to personnel. \n1.6 \nCommunicated effectively with user-locations in relation to \nlinen utilization, inventory and stock levels.\n2. Underpinning \nknowledge  \n2.1 \nTypes of linen and individual uses \n2.2 \nRelevant OSH regulations, laws and infection control practice, \ninstitutional policies and procedures \n2.3 \nSafety and environmental aspects related to workplace \noperation and manual handling, including workplace hazards \n2.4 \nDelivery and collection schedules \n2.5 \nQuality standards \n2.6\nInventory procedures and documentation\n3. Underpinning skills \n3.1 \nHandling linen products appropriately \n3.2 \nAssessing and maintaining linen requirements \n3.3 \nSelecting and using appropriate equipment \n3.4 \nMeeting patient and institution specifications/ requirements \n3.5 \nCommunicating effectively within the workplace \n3.6 \nApplying defined procedures i.e. OSH and infection control \n3.7 \nRecognizing and adapting to cultural differences in the \nworkplace, including modes of behavior and interactions \namong staff and others \n3.8 \nBasic arithmetic skills  \n3.9\nOral and written communication skills \n4. Resource \nimplications \nThe following resources MUST be provided: \n4.1 \nRelevant policies and procedures manuals \n4.2 \nInstitution mission statement, strategic and business plan \n4.3 \nOther documents relevant to the work context such as: \n- \norganizational charts \n- \nfloor plans \n- \ninstructions for the use of equipment and materials \nrelevant to the proposed activities \n- \nspecific instructions for staff \n-\nworkstation\n5. Method of \nassessment \nCompetency may be assessed through at least two of the following \nMethod: \n5.1 \nObservation of performance  \n5.2 \nInterview \n5.3 \nThird party report \n5.4 \nPortfolio \n5.5\nDemonstration with questioning\n6. Context of \nassessment\n6.1 \n Competency assessment may be done in the workplace or in \na simulated workplace setting.\n",
