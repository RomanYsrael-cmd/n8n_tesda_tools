        "source_title": "ASSIST IN TRANSPORTING PATIENTS",
        "source_text": "--- PDF PAGE 43 ---\nTR Health Care Services NC II \n-39- \nUNIT OF COMPETENCY : \nASSIST IN TRANSPORTING PATIENTS \nUNIT CODE \n: \nHCS323317 \nUNIT DESCRIPTOR \n: \nThis unit of competency covers the knowledge, skills and attitudes \nrequired to safely and efficiently assist in transporting patients from \none location to another. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables\n1. Prepare patient for \ntransport \n1.1 \nTransportation requirements are confirmed with appropriate \nhealth care personnel  \n1.2 \nTransport procedures are explained to patient as required \n1.3 \nPreparations are made for the safe and efficient transport of \nthe patient as per instructions \n1.4 \nEquipment for transportation is readied according to \nrequirements and checked to ensure that it is clean, complete \nand functional\n2. Assist in patient \ntransport \n2.1 \nPatient is transported to designated location in accordance \nwith established procedures  \n2.2 \nEquipment is adjusted to ensure patient comfort and safety \nwith minimal risk to self \n2.3 \nPatient is brought to designated location and reported to \nappropriate health care personnel \n3. Perform post-\ntransport procedures \n3.1 \nEquipment is cleaned in accordance with established \nprocedures \n3.2 \nEquipment is returned according to standard operating \nprocedures \n3.3 \nWorking condition of equipment is reported immediately in \naccordance with established procedures.\n\n--- PDF PAGE 44 ---\nTR Health Care Services NC II \n-40- \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Transportation \nrequirements  \nThese may include but not limited to: \n1.1 \nMode of transport \n1.2 \nDestination \n1.3 \nInformation specific to the patient \n1.4 \nAccompanying health professionals e.g. nurse or medical \nofficer \n1.5 \nPatient clothing requirements \n1.6\nDocumentation requirements\n2. Transportation \nequipment  \n2.1 \nTransportation equipment: \n Wheelchair \n Stretcher \n Bed \n Ambulance \n2.2 \nOther equipment \n Oxygen trolley \n IV Stand \n oxygen gauge \n Oxygen tank \n Ambu bag \n3.6 \nCommunication equipment \n Cellular phone \n\n2 way radios\n3. Relevant personnel  \n3.1 \nMedical officers \n3.2 \nNursing staff \n3.3\nOther health personnel\n\n--- PDF PAGE 45 ---\nTR Health Care Services NC II \n-41- \nEVIDENCE GUIDE \n \n1. Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1 \nConfirmed the transportation requirements with appropriate \nhealth care personnel  \n1.2 \nExplained the transport procedures to the patient \n1.3 \nChecked and reported the condition of the equipment for \ntransportation  \n1.4 \nAdjusted equipment to ensure the patient’s comfort and safety \nwith minimal risk to self \n1.5 \nInterpreted and followed instructions and guidance of health \nprofessionals with the care of patients \n1.6\nTransported and delivered patient to correct destination\n2. Underpinning \nknowledge  \n2.1 \nPatient handling procedures \n2.2 \nProcedures for securing a patient \n2.3 \nInfection control procedures \n2.4 \nPatient confidentiality and privacy requirements \n2.5 \nWhen patient issues need to be referred to an appropriate \nhealth professional\n3. Underpinning skills \n3.1 \nApplying safe working practices, including manual handling \ntechniques \n3.2 \nInterpreting and following the instructions and guidance of \nhealth professionals regarding care of the patients \n3.3 \nReading and writing skills \n3.4 \nOral communications skills \n3.5 \nWorking with others and display empathy with patient and \nrelatives\n4. Resource \nimplications \nThe following resources MUST be provided: \n4.1 \nAccess to equipment used for transporting patients \n4.2 \nRelevant policies and procedures manuals \n4.3 \nOrganizational charts \n4.4\nInstructions for the use of equipment\n5. Method of \nassessment \nCompetency may be assessed through: \n5.1 \nObservation \n5.2 \nDemonstration with questioning \n5.3\nPortfolio\n6. Context of \nassessment\n6.1 \nAssessment may be done in the workplace or in a simulated \nworkplace setting\n",
