  "source_section_text": "SECTION 1 HEALTH CARE SERVICES NC II QUALIFICATION\n\nThe HEALTH CARE SERVICES NC II Qualification consists of competencies that a person\nmust achieve to prepare and maintain beds, collect and maintain linen stocks at end-user\nlocations, assist with patient mobility, assist in transporting patients, assist with bio-psychosocial\nsupport care of patients and handle waste in a health care environment.\n\nThe Units of Competency comprising this Qualification include the following:\n\nUNIT CODE\nBASIC COMPETENCIES\n500311105\nParticipate in workplace communication\n500311106\nWork in a team environment\n500311107\nPractice career professionalism\n500311108\nPractice occupational health and safety procedures\n\nUNIT CODE\nCOMMON COMPETENCIES\nHCS323201\nImplement and monitor infection control policies and procedures\nHCS323202\nRespond effectively to difficult/challenging behavior\nHCS323203\nApply basic first aid\nHCS323204\nMaintain high standard of patient services\n\nUNIT CODE\nCORE COMPETENCIES\nHCS323314\nPrepare and maintain beds\nHCS323315\nCollect and maintain linen stocks at end-users location\nHCS323316\nAssist in patient mobility\nHCS323317\nAssist in transporting patients\nHCS323318\nAssist in bio-psychosocial support care of patients\nHCS323319\nHandle waste in a health care environment\n\nA person who has achieved this Qualification is competent to be:\n\n Nursing Attendant\n Nursing Aide\n Hospital Assistant\n Health Aide\n\n--- PDF PAGE 6 ---\nTR Health Care Services NC II\n-2-"
}
