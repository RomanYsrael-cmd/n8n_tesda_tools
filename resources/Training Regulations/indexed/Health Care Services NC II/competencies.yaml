        "evidence_guide": {
          "source_text": "1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nPrepared area for bed making\n1.2\nMade bed\n1.3\nPerformed after care\n1.4\nUsed appropriate PPE\n1.5\nHandled soiled linen safely\n1.6\nPerformed bed cleaning procedures\n1.7\nFollowed instructions according to institutional policies and\nguidelines\n2. Underpinning\nknowledge\n2.1\nTypes of bed\n2.2\nTypes of linen\n2.3\nOSH policies and procedures\n2.4\nHygiene policies and procedures\n2.5\nInfection control policies and procedures\n3. Underpinning skills\n3.1\nCleaning different types of beds\n3.2\nSafe manual handling techniques\n3.3\nCorrect disposing clinical waste\n3.4\nCorrect bed making procedures in hospital corners\n3.5\nOral and written communication skills\n3.6\nProblem solving skills required include the ability to use\navailable resources and priorities workload\n3.7\nWorking with others and display empathy and courtesy with\npatient and their relatives\n4. Resource\nimplications\nThe following resources MUST be provided;\n4.1\nAccess to relevant workstation\n4.2\nRelevant institutional policies, guidelines, procedures and\nprotocol\n4.3\nEquipment and materials relevant to the proposed activities\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1\nDemonstration with questioning\n5.2\nInterview\n5.3\nThird party report\n6. Context of\nassessment\n6.1\nCompetency may be assessed in the workplace or in a\nsimulated work setting.\n\n--- PDF PAGE 37 ---\nTR Health Care Services NC II\n-33-\nUNIT OF COMPETENCY :\nCOLLECT AND MAINTAIN LINEN STOCKS AT END-USER\nLOCATIONS\nUNIT CODE\n:"
        },
        "source_text": "HCS323314\nUNIT DESCRIPTOR\n: This unit of competency covers the knowledge, skills and attitudes\nrequired in preparing and making beds and performing after-care\nactivities.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Prepare area for bed\nmaking\n1.1\nPersonal protective equipment is used, according to\ninstitutional policy\n1.2\nBed height is adjusted as necessary\n1.3\nBed surroundings are cleared of medical and other equipment\nbefore bed is stripped, where necessary\n1.4\nPatient privacy, comfort and safety is provided at all times\n1.5\nBed linen is checked for displaced personal items, aids and\nequipment and such aids/equipment are placed in appropriate\narea/container\n2. Make bed\n2.1\nBed linen is stripped, where necessary\n2.2\nClinical waste and soiled linen are removed and placed in\nappropriate container\n2.3\nBed is cleaned according to established procedures, where\nnecessary\n2.4\nClean bed linen is placed on bed in accordance with institution\nprocedures\n2.5\nExisting bed linen is remade, as needed\n2.6\nPatient is asked whether he/she is comfortable, or if he/she\nhas any preferred bed needs\n2.7\nReusable clean bed linen is handled in accordance with\ninstitution procedures\n2.8\nMattresses and pillows are cleaned and disinfected, in\naccordance with established procedures\n2.9\nBed height is adjusted for occupancy and brakes are applied\naccording to bed type\n3. Perform after-care\nactivities\n3.1\nBeds and equipment/ aids are kept accessible and bed is left\nready for occupancy\n3.2\nDamaged and/or faulty beds, equipment mattresses, pillows\nand linen are reported to appropriate personnel and\ndocumented accordingly.\n3.3\nSoiled linen and clinical wastes are discarded according to\nestablished protocol\n3.4\nCleaning implements are cleaned and returned to designated\nstorage areas or disposed of appropriately.\n\n--- PDF PAGE 35 ---\nTR Health Care Services NC II\n-31-\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Personal Protective\nEquipment (PPE)\nPPE include but not limited to:\n1.1\nGloves\n1.2\nMask\n1.3\nCap\n1.4\nGown\n2. Beds\n2.1\nElectro-mechanical bed\n2.2\nMaternity delivery bed\n2.3\nHospital bed\n2.4\nFolding bed\n2.5\nRenal chair\n2.6\nBalkan frame\n2.7\nTrolley\n2.8\nPediatric bed\n2.9\nIsolettes\n3. Equipment\n3.1\nPressure care devices e.g. floatation mattress, egg carton\nmattress, foam mattress\n3.2\nBedside table\n3.3\nOver bed table\n3.4\nBed end note holder\n3.5\nChair lifts\n3.6\nWalking frames / sticks\n3.7\nCommodes\n3.8\nSling\n3.9\nStraps\n3.10 Splints\n3.11 Monkey grips\n3.12 Foot stool\n3.13 Personal aids such as eye glasses, hearing aids, glass eyes,\nfalse teeth, breast prosthesis, false limbs\n4. Bed Linen\n4.1\nSheets\n4.2\nBlankets\n4.3\nPillow cases\n4.4\nUnder-blankets\n4.5\nMattress protectors\n4.6\nPersonal bed linen\n\n--- PDF PAGE 36 ---\nTR Health Care Services NC II\n-32-\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nPrepared area for bed making\n1.2\nMade bed\n1.3\nPerformed after care\n1.4\nUsed appropriate PPE\n1.5\nHandled soiled linen safely\n1.6\nPerformed bed cleaning procedures\n1.7\nFollowed instructions according to institutional policies and\nguidelines\n2. Underpinning\nknowledge\n2.1\nTypes of bed\n2.2\nTypes of linen\n2.3\nOSH policies and procedures\n2.4\nHygiene policies and procedures\n2.5\nInfection control policies and procedures\n3. Underpinning skills\n3.1\nCleaning different types of beds\n3.2\nSafe manual handling techniques\n3.3\nCorrect disposing clinical waste\n3.4\nCorrect bed making procedures in hospital corners\n3.5\nOral and written communication skills\n3.6\nProblem solving skills required include the ability to use\navailable resources and priorities workload\n3.7\nWorking with others and display empathy and courtesy with\npatient and their relatives\n4. Resource\nimplications\nThe following resources MUST be provided;\n4.1\nAccess to relevant workstation\n4.2\nRelevant institutional policies, guidelines, procedures and\nprotocol\n4.3\nEquipment and materials relevant to the proposed activities\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1\nDemonstration with questioning\n5.2\nInterview\n5.3\nThird party report\n6. Context of\nassessment\n6.1\nCompetency may be assessed in the workplace or in a\nsimulated work setting.\n\n--- PDF PAGE 37 ---\nTR Health Care Services NC II\n-33-\nUNIT OF COMPETENCY :\nCOLLECT AND MAINTAIN LINEN STOCKS AT END-USER\nLOCATIONS\nUNIT CODE\n:"
