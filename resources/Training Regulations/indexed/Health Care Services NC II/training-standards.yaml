    "source_text": "3.1 CURRICULUM DESIGN\n\nCourse Title: HEALTH CARE SERVICES\nNC Level: NC II\n\nNominal Training Duration: 996 Hours\n\nCourse Description:\n\nThis course is designed to enhance the knowledge, skills and attitudes of Health Care\nServices NC II in accordance with industry standards. It covers the basic common and core\ncompetencies in preparing and maintaining beds, collecting and maintaining linen stocks at end-\nuser locations, assisting with patient mobility, transport and bio-psychosocial support care of\npatients and handling waste in a health care environment.\n\nBASIC COMPETENCIES\n(18 Hours)\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Participate in\nworkplace\ncommunication\n1.1\nObtain and convey\nworkplace information\n1.2\nComplete relevant work\nrelated documents\n1.3\nParticipate in workplace\nmeeting and discussion\n• Group\ndiscussion\n• Interaction\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n2. Work in a team\nenvironment\n2.1\nDescribe and identify team\nrole and responsibility in a\nteam\n2.2\nDescribe work as a team\nmember\n• Discussion\n• Interaction\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n3. Practice career\nprofessionalism\n3.1\nIntegrate personal objectives\nwith organizational goals\n3.2\nSet and meet work priorities\n3.3\nMaintain professional growth\nand development\n• Discussion\n• Interaction\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n4. Practice\noccupational\nhealth and\nsafety\n4.1\nEvaluate hazard and risks\n4.2\nControl hazards and risks\n4.3\nMaintain occupational health\nand safety awareness\n• Discussion\n• Plant tour\n• Symposium\n• Observation\n• Interview\n\n--- PDF PAGE 56 ---\nTR Health Care Services NC II\n-52-\nCOMMON COMPETENCIES\n(18 Hours)\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Implement and\nmonitor\ninfection control\npolicies and\nprocedures\n1.1\nProvide information to the\nwork group about the\norganization's infection\ncontrol policies and\nprocedures\n1.2\nIntegrate the organization's\ninfection control policy and\nprocedure into work\npractices\n1.3\nMonitor infection control\nperformance and implement\nimprovements in practices\n• Lecturette\n• Brainstorming\n• Observation\nand Oral\nQuestioning\n• Grid Question\n• Practical\nExercise\n2. Respond\neffectively to\ndifficult/challen\nging behavior\n2.1\nPlan and respond to\nemergencies\n2.2\nReport and review incidents\n• Lecturette\n• Brainstorming\n• Observation\nand Oral\nQuestioning\n• Grid Question\n• Practical\nExercise\n3. Apply basic first\naid\n3.1\nAssess the situation\n3.2\nApply basic first aid\ntechniques\n3.3\nCommunicate details of the\nincident\n• Lecturette\n• Brainstorming\n• Observation\nand Oral\nQuestioning\n• Grid Question\n• Practical\nExercise\n4. Maintain high\nstandard of\npatient services\n4.1\nCommunicate appropriately\nwith patients\n4.2\nEstablish and maintain good\ninterpersonal relationship\nwith patients\n4.3\nAct in a respectful manner at\nall times\n4.4\nEvaluate own work to\nmaintain a high standard of\npatient service\n• Lecturette\n• Brainstorming\n• Observation\nand Oral\nQuestioning\n• Grid Question\n• Practical\nExercise\n\n--- PDF PAGE 57 ---\nTR Health Care Services NC II\n-53-\nCORE COMPETENCIES\n(960 Hours)\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Prepare and\nmaintain beds\n1.1\nPrepare the area for bed\nmaking\n1.2\nPerform bed making\naccording to established\ninstitution procedures\n1.3\nPerform after care activities\nof materials and equipment\nused\n•Lecturette\n• Brainstorming\n•Observation\nand Oral\nQuestioning\n• Grid Question\n• Practical\nExercise\n2. Collect and\nmaintain linen\nstocks at end-\nuser location\n2.1\nExplain the workplace\nprocedure in collecting soiled\nlinen\n2.2\nMaintain linen stock levels\n2.3\nCollect soiled linen\n2.4\nDistribute clean linen\n•Lecturette\n• Role Playing\n•Interview\n• Observation\n3. Assist with\npatient mobility\n3.1\nExplain the workplace\nprocedures in assisting\npatient with mobility\n3.2\nPrepare to assist with patient\nmobility\n3.3\nAssist with patient mobility\n3.4\nComplete patient mobility\nassistance\n•Simulation\n• One-on-One\nTeaching\n• On-the-Job\nPractice\n• Video Tapes\nLecture\n•Interview\n• Demonstration\n• Return\nDemonstration\n4. Assist in\ntransporting\npatient\n4.1\nExplain the workplace\nprocedures in assisting\npatient transport\n4.2\nPrepare patient for transport\n4.3\nAssist in patient transport\n4.4\nPerform post-transport care\n•Lecture\n• Simulation\n• Role Playing\n•Demonstration\n• Third Party\nReport\n• Return\nDemonstration\n5. Assist with bio-\npsychosocial\ncare of patient\n5.1\nExplain the concept of bio-\npsycho-social support\n5.2\nAssist the patient in\nverbalizing his perceived\nproblems related to bio-\npsycho-social concerns\n5.3\nPerform bio-psycho-social\nmeasures and procedures\nimplemented in the institution\n5.4\nEducate the patient on\nalternatives on healthy bio-\npsycho-social well-being.\n•Active\nListening\n• Lecture\n• Simulation\n• Role Playing\n•Interview\n• Demonstration\n• Return\nDemonstration\n• Third Party\nReport\n6. Handle waste\nin a health care\nenvironment\n6.1\nExplain the concepts and\nprinciples of waste\nmanagement and safe\nhandling\n6.2\nDetermine job requirements\n6.3\nIdentify and segregate waste\n6.4\nTransport and store waste\n6.5\nConduct quality control\nactivities on clean up work\nareas\n•Lecture\n• Brainstorming\n• Demonstration\n• Experiential\nLearning\n• Simulation\n• One-to-One\nTeaching\n• On-the-Job\nPractice\n•Demonstration\n• Interview\n• Return\nDemonstration\n• Third Party\nReport\n\n--- PDF PAGE 58 ---\nTR Health Care Services NC II\n-54-"
