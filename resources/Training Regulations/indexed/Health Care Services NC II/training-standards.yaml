    "source_text": "SECTION 3 TRAINING STANDARDS\n\nThis set of standards provides the Technical and Vocational Education and Training (TVET)\nproviders with information and other important requirements to consider when designing training\nprograms for HEALTH CARE SERVICES NC II.\n\nThis includes information on curriculum design; training delivery; trainee entry requirements;\ntools and equipment; training facilities, trainer’s qualification and institutional assessment.\n\n3.1 CURRICULUM DESIGN\n\nCourse Title: HEALTH CARE SERVICES\nNC Level: NC II\n\nNominal Training Duration: 996 Hours\n\nCourse Description:\n\nThis course is designed to enhance the knowledge, skills and attitudes of Health Care\nServices NC II in accordance with industry standards. It covers the basic common and core\ncompetencies in preparing and maintaining beds, collecting and maintaining linen stocks at end-\nuser locations, assisting with patient mobility, transport and bio-psychosocial support care of\npatients and handling waste in a health care environment.\n\nBASIC COMPETENCIES\n(18 Hours)\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Participate in\nworkplace\ncommunication\n1.1\nObtain and convey\nworkplace information\n1.2\nComplete relevant work\nrelated documents\n1.3\nParticipate in workplace\nmeeting and discussion\n• Group\ndiscussion\n• Interaction\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n2. Work in a team\nenvironment\n2.1\nDescribe and identify team\nrole and responsibility in a\nteam\n2.2\nDescribe work as a team\nmember\n• Discussion\n• Interaction\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n3. Practice career\nprofessionalism\n3.1\nIntegrate personal objectives\nwith organizational goals\n3.2\nSet and meet work priorities\n3.3\nMaintain professional growth\nand development\n• Discussion\n• Interaction\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n4. Practice\noccupational\nhealth and\nsafety\n4.1\nEvaluate hazard and risks\n4.2\nControl hazards and risks\n4.3\nMaintain occupational health\nand safety awareness\n• Discussion\n• Plant tour\n• Symposium\n• Observation\n• Interview\n\n--- PDF PAGE 56 ---\nTR Health Care Services NC II\n-52-\nCOMMON COMPETENCIES\n(18 Hours)\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Implement and\nmonitor\ninfection control\npolicies and\nprocedures\n1.1\nProvide information to the\nwork group about the\norganization's infection\ncontrol policies and\nprocedures\n1.2\nIntegrate the organization's\ninfection control policy and\nprocedure into work\npractices\n1.3\nMonitor infection control\nperformance and implement\nimprovements in practices\n• Lecturette\n• Brainstorming\n• Observation\nand Oral\nQuestioning\n• Grid Question\n• Practical\nExercise\n2. Respond\neffectively to\ndifficult/challen\nging behavior\n2.1\nPlan and respond to\nemergencies\n2.2\nReport and review incidents\n• Lecturette\n• Brainstorming\n• Observation\nand Oral\nQuestioning\n• Grid Question\n• Practical\nExercise\n3. Apply basic first\naid\n3.1\nAssess the situation\n3.2\nApply basic first aid\ntechniques\n3.3\nCommunicate details of the\nincident\n• Lecturette\n• Brainstorming\n• Observation\nand Oral\nQuestioning\n• Grid Question\n• Practical\nExercise\n4. Maintain high\nstandard of\npatient services\n4.1\nCommunicate appropriately\nwith patients\n4.2\nEstablish and maintain good\ninterpersonal relationship\nwith patients\n4.3\nAct in a respectful manner at\nall times\n4.4\nEvaluate own work to\nmaintain a high standard of\npatient service\n• Lecturette\n• Brainstorming\n• Observation\nand Oral\nQuestioning\n• Grid Question\n• Practical\nExercise\n\n--- PDF PAGE 57 ---\nTR Health Care Services NC II\n-53-\nCORE COMPETENCIES\n(960 Hours)\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Prepare and\nmaintain beds\n1.1\nPrepare the area for bed\nmaking\n1.2\nPerform bed making\naccording to established\ninstitution procedures\n1.3\nPerform after care activities\nof materials and equipment\nused\n•Lecturette\n• Brainstorming\n•Observation\nand Oral\nQuestioning\n• Grid Question\n• Practical\nExercise\n2. Collect and\nmaintain linen\nstocks at end-\nuser location\n2.1\nExplain the workplace\nprocedure in collecting soiled\nlinen\n2.2\nMaintain linen stock levels\n2.3\nCollect soiled linen\n2.4\nDistribute clean linen\n•Lecturette\n• Role Playing\n•Interview\n• Observation\n3. Assist with\npatient mobility\n3.1\nExplain the workplace\nprocedures in assisting\npatient with mobility\n3.2\nPrepare to assist with patient\nmobility\n3.3\nAssist with patient mobility\n3.4\nComplete patient mobility\nassistance\n•Simulation\n• One-on-One\nTeaching\n• On-the-Job\nPractice\n• Video Tapes\nLecture\n•Interview\n• Demonstration\n• Return\nDemonstration\n4. Assist in\ntransporting\npatient\n4.1\nExplain the workplace\nprocedures in assisting\npatient transport\n4.2\nPrepare patient for transport\n4.3\nAssist in patient transport\n4.4\nPerform post-transport care\n•Lecture\n• Simulation\n• Role Playing\n•Demonstration\n• Third Party\nReport\n• Return\nDemonstration\n5. Assist with bio-\npsychosocial\ncare of patient\n5.1\nExplain the concept of bio-\npsycho-social support\n5.2\nAssist the patient in\nverbalizing his perceived\nproblems related to bio-\npsycho-social concerns\n5.3\nPerform bio-psycho-social\nmeasures and procedures\nimplemented in the institution\n5.4\nEducate the patient on\nalternatives on healthy bio-\npsycho-social well-being.\n•Active\nListening\n• Lecture\n• Simulation\n• Role Playing\n•Interview\n• Demonstration\n• Return\nDemonstration\n• Third Party\nReport\n6. Handle waste\nin a health care\nenvironment\n6.1\nExplain the concepts and\nprinciples of waste\nmanagement and safe\nhandling\n6.2\nDetermine job requirements\n6.3\nIdentify and segregate waste\n6.4\nTransport and store waste\n6.5\nConduct quality control\nactivities on clean up work\nareas\n•Lecture\n• Brainstorming\n• Demonstration\n• Experiential\nLearning\n• Simulation\n• One-to-One\nTeaching\n• On-the-Job\nPractice\n•Demonstration\n• Interview\n• Return\nDemonstration\n• Third Party\nReport\n\n--- PDF PAGE 58 ---\nTR Health Care Services NC II\n-54-\n3.2 TRAINING DELIVERY\n\nThe delivery of training should adhere to the design of the curriculum. Delivery should be\nguided by the 10 basic principles of competency-based TVET.\n\n The training is based on curriculum developed from the competency standards;\n Learning is modular in its structure;\n Training delivery is individualized and self-paced;\n Training is based on work that must be performed;\n Training materials are directly related to the competency standards and the curriculum\nmodules;\n Assessment is based in the collection of evidence of the performance of work to the\nindustry required standard;\n Training is based both on and off-the-job components;\n Allows for recognition of prior learning (RPL) or current competencies;\n Training allows for multiple entry and exit; and\n Approved training programs are nationally accredited.\nThe competency – based TVET system recognizes various types of delivery modes, both\non and off-the-job as long as the learning is driven by the competency standards specified by\nthe industry.\n\nThe following training modalities may be adopted when designing training programs:\n\n The dualized mode of training delivery is preferred and recommended. Thus programs\nwould contain both in-school and in – industry training or fieldwork components. Details\ncan be referred to the Dual Training System (DTS) Implementing Rules and Regulations.\n\n Modular/self-paced learning is a competency-based training modality wherein the trainee\nis allowed to progress at his own pace. The trainer facilitates the training delivery\n\n Peer teaching/mentoring is a training modality wherein fast learners are given the\nopportunity to assist the slow learners\n\n Supervised industry training or on-the-job training is an approach in training designed to\nenhance the knowledge an skills of the trainee through actual experience in the workplace\nto acquire specific competencies prescribed in the training regulations.\n\n Distance learning is a formal education process in which majority of the instruction occurs\nwhen the students and instructor are not in the same place. Distance learning may\nemploy correspondence study, or audio, video or computer technologies.\n\n Project-Based Instruction is an authentic instructional model or strategy in which students\nplan, implement and evaluate projects that have real world applicants.\n\n--- PDF PAGE 59 ---\nTR Health Care Services NC II\n-55-\n3.3 TRAINEE ENTRY REQUIREMENTS:\n\nTrainees or students wishing to enroll in this course qualification should possess the\nfollowing requirements:\n\n 16 years old and above\n Must pass the trainability / aptitude test\n Can communicate effectively both orally and in written form\n Physically, emotionally and mentally fit\n Can perform basic mathematical computation\n\nThis list does not include specific institutional requirements such as educational\nattainment, appropriate work experience, and others that may be required of the trainees by\nthe school or training center delivering this TVET program.\n\n3.4 TOOLS, EQUIPMENT AND MATERIALS\nHEALTH CARE SERVICES NC II\n\nRecommended list of tools, equipment and materials for the training of a maximum of 25\ntrainees\n\nTOOLS\nEQUIPMENT\nMATERIALS\nQty.\nDescription\nQty.\nDescription\nQty.\nDescription\n3 pcs\nDressing tray\n(complete with\naccessories) and\nalcohol and betadine\n3 units\nHospital bed\n12 pcs\nLinen (different\nsizes)\n3 pcs\nBedside table\n6 pcs\nPillow and Pillow\ncase\n3 pcs\nSputum cap\n3 pcs\nOver bed\n3 pcs\nRubber sheet\n12 pcs\nThermometer\n3 pcs\nFoot stool\n3 pcs\nThermal blanket\n12 pcs\nMask\n3 pcs\nIV stand\n3 pcs\nKelly pad\n3 pcs\nGoggles\n1 unit\nWheelchair\n3 rings\nRubber ring\n12 pcs\nCap\n1 unit\nStrecher\n6 pcs\nPatients gown\n12 pcs\nStrap\n1 unit\nOxygen tank and\naccessories\n6 pcs\nDraw sheet\n3 pcs\nSplints\n3 sets\nBP apparatus\n6 pcs\nTowel, hand towel\n3 pcs\nSlings\n3 pcs\nCommode\n1 set\nWaste bins (win,\ndry, infectious,\nsharp)\n3 pcs\nBandages\n1 set\nNebulizer\n3 pcs\nBed pan\n3 pcs\nCrutches\n1 unit\nLinen trolley\n3 pcs\nBasin\n2 sets\nFeeding utensils\n1 unit\nLine hamper\n3 pcs\nSoap dish\n1 unit\nShelves\n3 pcs\nUrinals\n1 pc\nPert light\n1 pc\nAmbu man\n1 pc\nAmbu Baby\n3 pcs\nPlaster\n\n--- PDF PAGE 60 ---\nTR Health Care Services NC II\n-56-\n3.5 TRAINING FACILITIES\nHEALTH CARE SERVICES NC II\n\nThe Health Care Services Learning Facility must be of concrete structure. Based on class\nsize of 25 students / trainees, the space requirements for the teaching / learning and\ncurriculum areas are as follows:\n\nTEACHING / LEARNING AREAS\nSIZE IN\nMETERS\nAREA IN SQ.\nMETERS\nQTY.\nTOTAL AREA IN\nSQ. METERS\nLaboratory Area\n4 X 5\n20\n1\n20\nTool Room and S/M storage Area\n3 X 5\n15\n1\n15\nLearning Resources Area*\n5 X 7\n35\n1\n35\nWash Area/Comfort Room (male &\nfemale)*\n2.5 X 4\n10\n1\n10\nAdmin and Staff Room\n5 X 5\n25\n1\n25\nCirculation Area**\n1\n30\nTotal\n135\nTotal Workshop Area\n135\n\n3.6 TRAINER’S QUALIFICATION (TQ II)\n\n Must be a licensed health-service related practitioner\n Must have undergone training on Training Methodology II (TM II)\n Must be physically, emotionally and mentally fit\n Must possess good moral character\n With at least 2 years experience in the health service industry\n\n3.7 INSTITUTIONAL ASSESSMENT\n\nInstitutional assessment is undertaken by trainees to determine their achievement of\nunits of competency. A certificate of achievement is issued for each unit of competency.\n\n--- PDF PAGE 61 ---\nTR Health Care Services NC II\n-57-"
