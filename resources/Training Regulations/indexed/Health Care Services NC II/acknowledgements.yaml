      "source_text": "59- DEFINITION OF TERMS"
    },
    {
      "source_text": "SPECIFIC TERMS:"
    },
    {
      "source_text": "1) Body Mechanics – refers to using the body in an efficient and careful way 2) Hazardous Waste – refers to the items contaminated with blood, body fluids, or body substances that maybe harmful to others 3) OSH – refers to Occupational Safety and Health 4) Commodes – refers to movable stand containing a washbowl 5) Chair Lifts – refers to power-driven chair assembly used to transport people 6) Dietitians – refers to specialist in dietetic 7) Immunization – refers to process of increasing the state of immunity 8) First Aid Kit – refers to emergency tools used to administer treatment to injured or sick person 9) Balkan frames – refers to a device used for orthostatic correction 10) Linen – refers to materials used in draping 11) Ambu bag – refers to (Bag – Valve – mask), a device used to ventilate patients who are unable to breath 12) Walking frames – refers to orthostatic device used to support body weight 13) Sling – refers to a material or a cloth used to support the upper extremity 14) Splints – refers to a material or a piece of cloth used to immobilize a limb in the case of fracture, disease of deformity 15) Trolley – refers to a rolling device used to transport materials 16) PPE – refers to personal protective equipment 17) Wheel chair – refers to a device used to transport patient from one place to another in a sitting position 18) Stretchers – refers to a device used in transferring patients in lying position 19) Pressure Bandage – refers to a piece of material used to cover a wound and immobilize a part of the body or restrict the movement 20) Thermal blanket – refers to a material used to decrease the body temperature or keep the patient warm 21) Stressors – refers to an agent or factor that produces stress 22) Choking – refers to a person having difficulty in breathing 23) Aspiration – refers to removal of liquids or gases by means of suction 24) Suffocation – refers to suppression of ones breathing with out access of oxygen 25) Depression –refers to mental condition of gloom or sadness 26) Suicide – refers to the act of intentionally killing oneself 27) Assault – refers to violent physical or verbal attack"
    },
