      "source_text": "VARIABLE RANGE 1. Infection Control Policies and Procedures This may include but not limited to: 1.1 Cleaning procedures and schedules 1.2 Cleaning agents 1.3 Cleaning equipment 1.4 Handling, storage and disposal of all types of waste 1.5 Food handling and food safety 1.6 Hygiene procedures 1.7 Infection control risk management 1.8 Infection control incident and hazard reporting 1.9 Sterilizing 1.10 Linen production and handling 1.11 Maintenance procedures 1.12 Storage requirements 1.13 Personal protective clothing 1.14 Work flows 1.15 Management of blood and body fluid spills 1.16 Single use of disposable 1.17 Aseptic techniques 1.18 Skin preparation procedures 1.19 Immunization 1.20 Needle stick injuries 1.21 Personal contact with infectious patients 1.22 Standard and additional precautions 1.23 Confidentiality 1.24 Employee training 1.25 Contractors 2. Industry Codes of Practice 2.1 National Health and Medical Research Council Guidelines for infection control 2.2 Local & National Government Guidelines and Standards 2.3 Manufacturer's recommendations and operating manuals 3. Identified hazards and the outcomes of infection risk assessments 3.1 Sharps 3.2 Glass 3.3 Waste 3.4 Human waste and human tissues 3.5 Personal contact with infectious patients 3.6 Animals, insects and vermin 3.7 Stock, including food, which has passed \"used-by\" dates. 3.8 Incorrect concentration of disinfectants and chemicals 3.9 Cleaning procedures 3.10 Linen handling procedures 3.11 Work flows 3.12 Use of personal protective clothing 3.13 Food safety 3.14 Personal hygiene 4. Infection Control Monitoring Procedures 4.1 Observations 4.2 Interviews 4.3 Surveys and inspections 4.4 Quality assurance activities 4.5 Review of outcomes 4.6 Data analysis"
