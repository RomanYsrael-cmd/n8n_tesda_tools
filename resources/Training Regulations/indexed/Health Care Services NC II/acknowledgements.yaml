    {
      "source_text": "19- UNIT OF COMPETENCY : RESPOND EFFECTIVELY TO DIFFICULT/ CHALLENGING BEHAVIOR UNIT CODE : HCS323202 UNIT DESCRIPTOR : This unit of competency covers the knowledge, skills and attitudes to effectively respond to difficult or challenging behavior of patient."
