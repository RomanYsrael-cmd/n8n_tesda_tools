      "source_text": "57- SECTION 4 NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS"
    },
    {
      "source_text": "4.1 To attain the National Qualification of Health Care Services, the candidate must demonstrate competence through project-type assessment covering all units listed in Section 1. Successful candidates shall be awarded a National Certificate, NC II signed by the TESDA Director General."
    },
    {
      "source_text": "4.2 Assessment shall focus on the core units of competency. The basic and common units shall be integrated or assessed concurrently with the core units."
    },
    {
      "source_text": "4.3 The following are qualified to apply for assessment and certification:"
    },
    {
      "source_text": "4.3.1 Graduates of formal, non-formal and informal including enterprise-based training programs."
    },
    {
      "source_text": "4.3.2 Experienced Workers (wage employed or self-employed)"
    },
    {
      "source_text": "4.4 Reassessment in a unit of competency is allowed only after one month from the date of assessment. Reassessment for a National Certificate shall be done only on the task/s that the candidate did not successfully achieve."
    },
    {
      "source_text": "4.5 A candidate who fails the assessment for two (2) consecutive times will be required to go through a refresher course before taking another assessment."
    },
    {
      "source_text": "4.6 The guidelines on assessment and certification are discussed in detail in the Procedures Manual on Assessment and Certification."
