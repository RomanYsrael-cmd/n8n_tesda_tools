      "source_text": "SECTION 1 HEALTH CARE SERVICES NC II QUALIFICATION"
    },
    {
      "source_text": "The HEALTH CARE SERVICES NC II Qualification consists of competencies that a person must achieve to prepare and maintain beds, collect and maintain linen stocks at end-user locations, assist with patient mobility, assist in transporting patients, assist with bio-psychosocial support care of patients and handle waste in a health care environment."
    },
    {
      "source_text": "The Units of Competency comprising this Qualification include the following:"
    },
    {
      "source_text": "UNIT CODE BASIC COMPETENCIES 500311105 Participate in workplace communication 500311106 Work in a team environment 500311107 Practice career professionalism 500311108 Practice occupational health and safety procedures"
    },
    {
      "source_text": "UNIT CODE COMMON COMPETENCIES HCS323201 Implement and monitor infection control policies and procedures HCS323202 Respond effectively to difficult/challenging behavior HCS323203 Apply basic first aid HCS323204 Maintain high standard of patient services"
    },
    {
      "source_text": "UNIT CODE CORE COMPETENCIES HCS323314 Prepare and maintain beds HCS323315 Collect and maintain linen stocks at end-users location HCS323316 Assist in patient mobility HCS323317 Assist in transporting patients HCS323318 Assist in bio-psychosocial support care of patients HCS323319 Handle waste in a health care environment"
    },
    {
      "source_text": "A person who has achieved this Qualification is competent to be:"
    },
