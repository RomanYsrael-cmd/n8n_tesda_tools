      "source_text": "5- UNIT OF COMPETENCY : WORK IN TEAM ENVIRONMENT UNIT CODE : 500311106 UNIT DESCRIPTOR : This unit covers the skills, knowledge and attitudes to identify role and responsibility as a member of a team."
    },
