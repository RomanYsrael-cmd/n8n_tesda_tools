    },
    {
      "source_text": "UNIT OF COMPETENCY : IMPLEMENT AND MONITOR INFECTION CONTROL POLICIES AND PROCEDURES UNIT CODE : HCS323201 UNIT DESCRIPTOR : This unit is concerned with infection control responsibilities of employees with supervisory accountability to implement and monitor infection control policy and procedures in a specific work unit or team within an organization. This unit does not apply to a role with organization-wide responsibilities for infection control policy and procedure development, implementation or monitoring."
    },
    {
      "source_text": "ELEMENT PERFORMANCE CRITERIA Italicized terms are elaborated in the Range of Variables 1. Provide information to the work group about the organization's infection control policies and procedures. 1.1 Relevant information about the organization's infection control policy and procedures, and applicable industry codes of practice are accurately and clearly explained to the work group 1.2 Information about identified hazards and the outcomes of infection risk assessments is regularly provided to the work group 1.3 Opportunity is provided for the work group to seek further information on workplace infection control issues and practices 2. Integrate the organization's infection control policy and procedure into work practices 2.1 Infection control policy and procedures are implemented by supervisor and members of the work group. 2.2 Liaison is maintained with person responsible for organization- wide infection control. 2.3 The Supervisor's coaching support ensures that individuals/teams are able to implement infection control practices 2.4 Work procedures are adopted to reflect appropriate infection control practice 2.5 Issues raised through consultation are dealt with and resolved promptly or referred to the appropriate personnel for resolution 2.6 Workplace procedures for dealing with infection control risks and hazardous events are implemented whenever necessary 2.7 Employees are encouraged to report infection risks and to improve infection control procedures 3. Monitor infection control performance and implement improvements in practices 3.1 Infection control hazardous events are investigated promptly to identify their cause in accordance with organization policy and procedures 3.2 Work procedures to control infection risks are monitored to ensure compliance 3.3 Work procedures are regularly reviewed and adjusted to ensure improvements in infection control practice"
    },
    {
      "source_text": "-- PDF PAGE 19 --- TR Health Care Services NC II"
    },
    {
      "source_text": "15- ELEMENT PERFORMANCE CRITERIA Italicized terms are elaborated in the Range of Variables 3.4 Supervisor provides feedback to team and individuals on compliance issues, changes in work procedures and infection control outcomes 3.5 Training in work procedures is provided as required to ensure maintenance of infection control standards 3.6 Inadequacies in work procedures and infection control measures are identified, corrected or reported to designated personnel 3.7 Records of infection control risks and incidents are accurately maintained as required 3.8 Aggregate infection control information reports are used to identify hazards, to monitor and improve risk control Method and to indicate training needs"
    },
