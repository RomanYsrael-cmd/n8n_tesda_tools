      "term": "TR Landscape Installation and Maintenance NC II 87",
      "definition": "10. Complete fertilizers - are so called because they contain nitrogen, phosphorus and potassium, the Big 3 in fertilizer ingredients. A fertilizer listed as \"10-10-10,\" for instance, would be a complete fertilizer. But a fertilizer listed as \"10-0-10\" would not be a complete fertilizer, the middle zero indicating the absence of phosphorus in the fertilizer. 11. Cotyledon leaves - are the leaves of the embryo of a seed plant, which, upon germination, either remain in the seed or emerge, enlarge, and become green. Cotyledon leaves are also called \"false leaves\" or \"seed leaves,\" in contradistinction to the first \"true leaves\" which develop later. 12. Cover crops - are plants that are primarily planted not to be harvested for food but for soil erosion control, weed control and improving soil quality while the garden is otherwise dormant. A cover crop is usually ploughed or tilled under before the next food crop is planted, in which cases the \"cover crop\" is used as a soil amendment and is synonymous with \"green manure crop.\" In its capacity to control weeds it is designated a \"living mulch.\" From the landscape designer’s perspective, the choice between various cover crops could be influenced by aesthetics, since the cover crop is, after all, taking the place of garden plants in between growing seasons. 13. Dethatching - is the mechanical removal from a lawn of the layer of dead turfgrass tissue known as \"thatch.\" Raking deeply when you rake leaves in the fall is an easy step you can take towards dethatching. 14. Dry wall - is a wall of stones that is not held together by mortar. Dry-wall construction requires greater precision in the way stones are stacked than does mortared-wall construction, since proper placement alone keeps the wall intact. 15. Edging - is a line of demarcation that creates visual interest in a landscape by separating one segment from another. 16. Evergreen - means having foliage that persists and retains its color throughout the year, rather than changing color according to the seasons. The term, \"evergreen\" is something of a misnomer, as the color in question needn't be green. 17. Finials - are the small, ornamental, terminal features at the top of a gable, fence post, lamp, lamppost, stone wall, etc. Finials are optional, being non-structural elements: their job is aesthetic, giving a \"finished\" touch to a hardscape feature 18. Forcing - is the process of causing a plant to flower before its natural season. For instance, many people eager for Old Man Winter's exit force forsythia flowers in February or March. Forcing pussy willows is another common pastime in late winter. 19. Gazebo - is a small roofed outbuilding erected for outdoor dining and entertaining. This hardscape feature is often octagonal, with open, screened, or latticework sides. The plural form of the term, gazebo is given either as \"gazebos\" or \"gazeboes.\" TR Landscape Installation and Maintenance NC II 88 20. Grafting - is the uniting of a shoot or bud (the scion) with a plant (the rootstock) that is already established, either by insertion or by placing them in close contact. One danger of grafting is girdling. Grafting is a common procedure in the development of fruit tree stock. 21. Hardening off plants - is the process, undertaken in spring in the temperate zone, of preparing plants started indoors for the change in environmental conditions they will encounter when permanently moved outdoors. Without allowing plants to harden off, they will be negatively impacted by the sudden shock of exposure to daytime's sunrays and nighttime's coolness. The process of hardening off plants involves a transitional period in which plants are left outside during daylight hours only and in an area where they can be shaded and protected from wind. Having a cold frame facilitates hardening off, but it is not essential that you have a cold frame. Watering is reduced as well during the hardening off period. Gradually, the plant is allowed exposure to an increasing amount of sunlight and allowed to stay out later and later. 22. Herbaceous plants- are plants with non-woody stems. Their above-ground growth usually dies back in winter in the temperate zone, even in cases where the herbaceous plants in question are perennials. All \"annual\" plants are \"herbaceous,\" but not all herbaceous plants are annuals. An \"annual\" is a plant that dies altogether at the end of the growing season, both above the ground and below it. \"Perennials,\" by contrast, survive the winter, even if their above-ground growth dies back. 23. Hybrid plants - are plants produced by impregnating the pistil of one species with the pollen of another. 24. Integrated pest management, or IPM - is the management of pest problems that involves use of the full spectrum of control measures in a coordinated, integrated and foresighted manner. A cornerstone of IPM is the idea that taking preventive steps to preclude a pest problem is preferable to waiting for pests to arrive and then having to eradicate them. 25. Landscape architecture - is the profession that practices the art of arranging or modifying the features of a landscape, an urban area, etc., for aesthetic or practical purposes. Landscape architecture must be distinguished from landscape design. The American Society of Landscape Architects asserts that someone who makes a career of \"landscape architecture,\" properly speaking, possesses a higher level of skill, usually reinforced by a degree, than is possessed by a \"landscape designer.\" Degrees and professional status notwithstanding, it is still accurate to say that members of the landscape architecture profession do practice landscape design. 26. Landscaping - can be used grammatically either as a noun or as the present participle of a verb. In the latter case, \"landscaping\" either can take an object (transitive) or go without one (intransitive). For example, I can say either \"I am landscaping to increase the value of my property\" (intransitive) or \"I am landscaping my property to increase its value (transitive). Either way, the noun, \"landscaping\" derives from the participial use and designates the process or result of such an action. TR Landscape Installation and Maintenance NC II 89 27. Mulch - is a covering placed around plants (or covering the ground in lieu of plants), to prevent the growth of weeds. If placed around plants, a mulch provides additional benefits, including the diminution of erosion and water loss, and the regulation of soil temperature. In addition, upon decomposition (for organic mulches), mulches serve as soil amendments. Mulch selection is usually based on appearance, as well as on all the practical considerations mentioned above. 28. Naturalized plants - are plants established as a part of the flora of a locale other than their place of origin. When a plant naturalizes in an area, this can be either a \"good\" or a \"bad\" thing, depending on your opinion of the particular naturalized plant. 29. Soil pH - is the measure of the acidity or alkalinity of a soil, numerically equal to 7 for soils with a neutral pH, increasing with rising alkalinity and falling with increasing acidity. The soil pH scale commonly in use ranges from 0 to 14. Soil pH is not fixed; you can take measures to alter soil pH. If soil pH needs to be lowered (i.e., the soil isn't acidic enough), apply sulfur or commercial fertilizers containing ammonium-N. If soil pH needs to be raised (i.e., the soil isn't alkaline enough), apply lime 30. Shrubs - are low woody plants, usually with multiple shoots or stems from the base (height of 15 feet or less). A planting of shrubs is called \"shrubbery.\" 31. Softscape - comprises the animate, horticultural elements of landscape design, i.e., plants. Softscape elements are complemented by hardscape design elements, such as stone walls, tile pations and brick walkways. 32. Tendrils - are twisting, threadlike structures by which true climbers, such as grape vines or cucumber vines, grasp an object for support. Vines with tendrils will climb on their own, without being trained. In some cases, however, you will still want to tie vines to arbors, pergolas, latticework or other structures even if they do have tendrils, in order to cause the plant to climb precisely where you wish it to grow. 33. Lawn thatch - is the layer of dead turfgrass tissue between the green vegetation and the soil surface that must be removed (a process known as \"dethatching\") to maintain lawn health. Lawn thatch is derived from stems, leaves, stolons, rhizomes and roots. 34. Xeriscape landscaping - is landscaping designed specifically for areas that are susceptible to drought, or for properties where water conservation is practiced. Derived from the Greek xeros meaning \"dry,\" the term, xeriscape means literally \"dry landscape.\" TR Landscape Installation and Maintenance NC II 90"
    }
