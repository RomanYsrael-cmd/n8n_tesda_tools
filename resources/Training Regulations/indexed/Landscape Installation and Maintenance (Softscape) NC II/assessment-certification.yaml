  "source_text": "SECTION 4\nNATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1\nTo attain the National Qualification of Landscape Installation and Maintenance\n(Soft Scape) NC II, the candidate must demonstrate competence in all units listed\nin Section 1. Successful candidates shall be awarded a National Certificate\nsigned by the TESDA Director General.\n\n4.2\nThe qualification of Landscape Installation and Maintenance (Soft Scape) NC\nII may be attained through demonstration of competence using project-based\nassessment covering all the required units of qualification.\n4.2.1. Accumulation of Certificates of Competency (COCs) in the following\nareas:\n4.2.1.1\nInstallation / Construction\n Provide site clearing and grubbing activities\n Perform rough grading operations\n Perform site preparation activities\n Install plants at designated locations as designed\n Install plant support\n4.2.1.2\nMaintenance\n Trim and prune landscape plant\n Perform weeding and cultivation\n Apply fertilizer (Nutrition)\n Water plants\n Control and prevent plant pests and diseases\n Provide plant support\n Perform lawn grass maintenance\n Perform re-planting activities\n Collect, dispose and utilize organic waste\n\nSuccessful candidates shall be awarded Certificates of Competency\n(COCs) bearing the signature of the Regional Director and Chair of the\nrecognized local industry body.\n\n4.3.\nAccumulation and submission of all COCs acquired for the relevant units of\ncompetency comprising a qualification, an individual shall be issued the\ncorresponding National Certificate.\n\n4.4.\nAssessment shall focus on the core units of competency. The basic and common\nunits shall be integrated or assessed concurrently with the core units.\n\n4.5. The following are qualified to apply for assessment and certification:\n\n 4.5.1 Graduates of formal, non – formal and informal including enterprise – based\ntraining programs\n4.5.2 Experienced workers (wage employed or self – employed)\n\n4.6\nThe guidelines on assessment and certification are discussed in detail in the\nProcedures Manual on Assessment and Certification and Guidelines on the\nImplementation of the Philippine TVET Qualification and Certification System\n(PTQCS).\n\n--- PDF PAGE 91 ---\nTR Landscape Installation and Maintenance NC II 85\n\nCOMMON\nCOMPETENCIES\nApply Safely\nMeasures\nUse Farm Tools\nand Equipment\nPerform\nEstimation and\nBasic Calculation\nApply mulch\nmaterials\nPerform rough\ngrading\noperations\nInstall plant\nsupport\nPerform site\npreparation\nactivities\nPrepare a garden\ndesign\nPrepare specialized\ninterpretive content\nSupervise landscape\nproject works\nSupevise landscape\nplanting works\nSupport landscape\nwork\nSet out landscape\nworks\nSupport turf\nestablishment\nCORE COMPETENCIES\nSupermarket of Competencies\nAGRI-FISHERY (Landscaping) Sector\nProvide site\nclearing and\ngrubbing\nactivities\nControl and prevent\npest plant pest and\ndiseases\nTrim and prune\nlandscape plant\nApply\nfertilizer\n(Nutrition)\nPerform weeding\nand cultivation\nWater plants\nProvide general\nground care\nManage landscape\nprojects\nPrepare detailed\ndesigned of\nlandscaping\nPrepare a\nLandscape project\ndesign\nPerform lawn grass\nmaintenance\nProvide plant\nsupport\nCollect, dispose\nand utilize\norganic waste\nPerform re-planting\nactivities\nLANDSCAPING NC II\n\nenvironment\nBASIC\nCOMPETENCIES\nDemonstrate\nwork values\nPractice\nhousekeeping\nprocedures\n(5S)\nParticipate\nin workplace\ncommunication\nWork\n in team\nenvironment\nPractice\ncareer\nprofessionalism\nWork\nwith others\nDevelop and\npractice\nnegotiation\nskills\nUse\nmathematical\nconcepts and\ntechniques\nUse\nrelevant\ntechnologies\nSolve problems\nrelated to work\nactivities\nReceive and\nrespond to\nworkplace\ncommunication\nDevelop\nteams and\nindividuals\nUtilize\nspecialized\ncommunication\nskills\nPractice\noccupational\nhealth and\nsafety\nprocedures\nLead\nworkplace\n communicat