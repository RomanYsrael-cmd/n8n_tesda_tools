      "text": "6 The guidelines on assessment and certification are discussed in detail in the Procedures Manual on Assessment and Certification and Guidelines on the Implementation of the Philippine TVET Qualification and Certification System (PTQCS). --- PDF PAGE 91 --- TR Landscape Installation and Maintenance NC II 85 Apply Safely Measures Use Farm Tools and Equipment Perform Estimation and Basic Calculation Apply mulch materials Perform rough grading operations Install plant support Perform site preparation activities Prepare a garden design Prepare specialized interpretive content Supervise landscape project works Supevise landscape planting works Support landscape work Set out landscape works Support turf establishment Supermarket of Competencies AGRI-FISHERY (Landscaping) Sector Provide site clearing and grubbing activities Control and prevent pest plant pest and diseases Trim and prune landscape plant Apply fertilizer (Nutrition) Perform weeding and cultivation Water plants Provide general ground care Manage landscape projects Prepare detailed designed of landscaping Prepare a Landscape project design Perform lawn grass maintenance Provide plant support Collect, dispose and utilize organic waste Perform re-planting activities environment Demonstrate work values Practice housekeeping procedures (5S) Participate in workplace communication Work in team environment Practice career professionalism Work with others Develop and practice negotiation skills Use mathematical concepts and techniques Use relevant technologies Solve problems related to work activities Receive and respond to workplace communication Develop teams and individuals Utilize specialized communication skills Practice occupational health and safety procedures Lead workplace communication Collect, analyze and organize information Plan and organize work Apply problem- solving techniques in the workplace Lead small teams Promote environmental protection Develop and implement a grounds maintenance prog. Install plants at designated locations as Transplant small trees Assist in landscape construction work Implement a landscape maintenance program Implement a paving project Establish and maintain railway Landscape garden Design landscape structures and features Guide bushwalks in unmodified landscapes Construct stone structures and feautures Construct an outdoor recreation area access audit --- PDF PAGE 92 --- TR Landscape Installation and Maintenance NC II 86"
