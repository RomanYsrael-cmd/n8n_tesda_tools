      "source_text": "SECTION 3 TRAINING STANDARDS\n\nThese standards are set to provide technical and vocational education and training (TVET)\nproviders with information and other important requirements to consider when designing\ntraining programs for LANDSCAPE INSTALLATION AND MAINTENANCE (SOFTSCAPE)\nNCII.\n\n3.1 CURRICULUM DESIGN\n\nCourse Title: LANDSCAPE INSTALLATION AND MAINTENANCE NC Level NC II\n (SOFTSCAPE)\n\nNominal Training Duration: 212 Hours\n\nCourse Description:\n\nThis course is designed to enhance the knowledge, skills and attitudes of an individual in\nthe field of landscaping in accordance with industry standards. It covers core competencies\nsuch as: perform site clearing and grubbing activities, perform rough grading operations,\nperform site preparation activities, install plants at designated locations as designed, install\nplant support, Trim and prune landscape plants, perform weeding and cultivation, apply\nfertilizer(nutrition), water plants, control and prevent plant pest and diseases, provide plant\nsupport, perform lawn-grass maintenance, perform re-planting activities and collect, dispose\nand utilize organic wastes.\n\nBASIC COMPETENCIES\n(18 Hours)\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and convey\nworkplace information\n1.2 Complete relevant work\nrelated documents\n1.3 Participate in workplace\nmeeting and discussion\n• Group\ndiscussion\n• Interaction\n\n• Written test\n• Practical/\nperformance\ntest\n• Interview\n2. Work in a team\nenvironment\n2.1 Describe and identify team\nrole and responsibility in a\nteam.\n2.2 Describe work as a team\nmember.\n• Group\ndiscussion\n• Interaction\n\n• Observation\n• Simulation\n• Role playing\n3. Practice career\nprofessionalism\n3.1 Integrate personal\nobjectives with\norganizational goals\n3.2 Set and meet work problems\n3.3 Maintain professional growth\nand development\n• Group\ndiscussion\n• Interaction\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n4. Practice\noccupational\nhealth and\nsafety\n4.1 Evaluate hazards and risks\n4.2 Control hazards and risks\n4.3 Maintain occupational\nhealth and safety\nawareness\n• Group\nDiscussion\n• Plant tour\n• Symposium\n• Observation\n• Interviews\n\n--- PDF PAGE 82 ---\nTR Landscape Installation and Maintenance NC II 78\n\nCOMMON COMPETENCIES\n(14 Hours)\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Apply safety\nmeasures in\nfarm\noperations\n1.1. Determine areas of\nconcern for safety\nmeasures\n1.2. Apply appropriate\nsafety measures\n1.3. Safe keep/maintain/\ndispose tools,\nmaterials and outfit.\n• Self-\npaced/modular\n• Lecture/Discussion\n• Interaction\n• Practical\nDemonstration\n• Visit/tour\n• Oral/Written\nInterviews\n• Direct\nObservation\n• Practical\nDemonstration\n2. Use farm\ntools and\nequipment\n2.1. Prepare and use farm\ntools\n2.2. Prepare and operate\nfarm equipment\n2.3. Perform preventive\nmaintenance\nprocedures/practices\n• Self-\npaced/modular\n• Lecture/Discussion\n• Interaction\n• Practical\nDemonstration\n• Visit/tour\n\n• Oral/Written\nInterviews\n• Direct\nObservation\n• Practical\nDemonstration\n3. Perform\nestimation\nand basic\ncalculation\n\n3.1. Perform estimation\n3.2. Perform basic\nworkplace calculation\n3.3. Apply corrective\nmeasures as\nnecessary\n• Self-\npaced/modular\n• Lecture/Discussion\n• Interaction\n• Practical Exercise\n• Oral/Written\nexamination\n• Practical exercise\n\n--- PDF PAGE 83 ---\nTR Landscape Installation and Maintenance NC II 79\n\nCORE COMPETENCIES\n( 180 Hours)\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Provide site\nclearing and\ngrubbing\nactivities\n1.1. Clear site\n1.2. Dispose waste\n1.3. Perform post-clearing site\nand grubbing activity\n• Discussion\n• Demonstration\n• Practical\napplication\n• Field trip\n• Demonstration\nof practical\nskills\n• Written\nexamination\n• Interview\n2. Perform rough\ngrading\noperations\n2.1. Rough grade site\n2.2. Provide surface drainage\nand shape or form the land\n2.3. Perform post-rough grading\noperations\n• Discussion\n• Demonstration\n• Practical\napplication\n• Field trip\n• Demonstration\nof practical\nskills\n• Written\nexamination\n•Interview\n3. Perform land\npreparation\n3.1. Cultivate land\n3.2. Remove construction debris\nand other materials\n3.3. Add amended soil / soil mix\nto cultivated land\n3.4. Find grade and compact\ncultivated land\n3.5. Perform post-land\npreparation activities\n• Discussion\n• Demonstration\n• Practical\napplication\n• Field trip\n\n• Demonstration\nof practical\nskills\n• Written\nexamination\n• Interview\n4. Install plants at\ndesignated\nlocations as\ndesigned\n4.1. Inspect plants\n4.2. Lay-out or stake out plants\n4.3. Excavate hole /\n4.4. Install plants\n4.5. Apply fertilizers\n4.6. Water plants\n4.7. Apply / install mulch\n4.8. Perform post landscape\ninstallation activities\n• Discussion\n• Demonstration\n• Practical\napplication\n• Demonstration\nof practical\nskills\n• Written\nexamination\n• Interview\n5. Install plant\nsupport\n5.1. Install stake or staking\n5.2. Install plant guy or guying\n5.3. Install plant props / bracing\nor proping bracing\n• Discussion\n• Demonstration\n• Practical\napplication\n• Demonstration\nof practical\nskills\n• Written\nexamination\n•Interview\n6. Trim and prune\nlandscape plant\n6.1. Identify trimming and\npruning requirements\n6.2. Prepare for trimming and\npruning operations\n6.3. Perform trimming and\npruning\n6.4. Perform post-trimming and\npruning activity\nDiscussion\n• Demonstration\n• Practical\napplication\n\n• Demonstration\nof practical\nskills\n• Written\nexamination\n• Interview\n\n--- PDF PAGE 84 ---\nTR Landscape Installation and Maintenance NC II 80\n\n7. Perform weeding\nand cultivation\n7.1. Identify requirements for\nweeding and cultivation\nactivity\n7.2. Prepare for weeding and\ncultivation operations\n7.3. Conduct weeding and\nremoval of volunteer\nspecies\n7.4. Identify compacted soil\n7.5. Cultivate compacted soil\n7.6. Perform post-weeding and\nsoil cultivation activity\n• Discussion\n• Demonstration\n• Practical\napplication\n\n• Demonstration\nof practical\nskills\n• Written\nexamination\n• Interview\n8. Apply fertilizer\n8.1. Identify fertilizer application\nrequirements\n8.2. Prepare for fertilizer\napplication activity\n8.3. Perform fertilizer application\nactivity\n8.4. Perform post-fertilizer\napplication activities\n• Discussion\n• Demonstration\n• Practical\napplication\n• Demonstration\nof practical\nskills\n• Written\nexamination\n• Interview\n9. Water plants\n9.1. Identify requirements of\nwatering / irrigating\nlandscape plants\n9.2. Prepare for watering /\nirrigation activity\n9.3. Conduct watering / irrigation\nof plants\n9.4. Perform post-watering /\nirrigation activities\n• Discussion\n• Demonstration\n• Practical\napplication\n• Demonstration\nof practical\nskills\n• Written\nexamination\n• Interview\n10. Control and\nprevent plant\npest and\ndiseases\n10.1. Identify requirements of\npreventing and controlling\nplant pests and diseases\n10.2. Prepare for application of\npest and disease\nprevention and control\nmeasures\n10.3. Apply pest and disease\nprevention and control\nmeasures\n10.4. Perform post-pest and\ndisease prevention and\ncontrol measures\n• Discussion\n• Demonstration\n• Practical\napplication\n• Demonstration\nof practical\nskills\n• Written\nexamination\n• Interview\n11. Provide plant\nsupport\n11.1. Identify requirements for\ninstalling plant support\n11.2. Prepare for installation of\nplant support\n11.3. Install plant support\n11.4. Maintain plant support\n11.5. Perform post-plant support\nactivities\n• Discussion\n• Demonstration\n• Practical\napplication\n• Demonstration\nof practical\nskills\n• Written\nexamination\n• Interview\n\n--- PDF PAGE 85 ---\nTR Landscape Installation and Maintenance NC II 81\n\n12. Perform\nlawn grass\nmaintenance\n12.1. Mow lawn grass\n12.2. Irrigate lawn\n12.3. Fertilize lawn\n12.4. Control pests\n12.5. Control weeds\n• Discussion\n• Demonstration\n• Practical\napplication\n• Field trip\n• Demonstration\nof practical\nskills\n• Written\nexamination\n•Interview\n13. Perform re-\nplanting activities\n13.1. Identify requirements for\nremoval and re-planting of\nlandscape plants\n13.2. Prepare for removal and\nreplacement of landscape\nplants\n13.3. Conduct removal and\ndisposal of landscape\nplants\n13.4. Prepare land / soil for re-\nplanting\n13.5. Select right species and\nsize of landscape plants\nfor replacement\n13.6. Conduct re-planting\nactivity\n13.7. Perform post-removal and\nre-planting activities\n• Discussion\n• Demonstration\n• Practical\napplication\n•\n• Demonstration\nof practical\nskills\n• Written\nexamination\n• Interview\n14. Collect, dispose\nand utilize\norganic waste\n14.1. Identify requirements for\ncollection, disposal and\nutilization of organic waste\n14.2. Prepare for collection,\nsegregation, disposal and\nutilization of organic waste\n14.3. Gather and dispose\norganic waste\n14.4. Segregate and process\ncollected organic waste\n14.5. Make use of organic\nwaste\n14.6. Perform post-disposal and\nutilization of organic waste\n• Discussion\n• Demonstration\n• Practical\napplication\n• Field trip\n• Demonstration\nof practical\nskills\n• Written\nexamination\n• Interview\n\n--- PDF PAGE 86 ---\nTR Landscape Installation and Maintenance NC II 82\n3.2 TRAINING DELIVERY\n\nThe delivery of training should adhere to the design of the curriculum. Delivery should\nbe guided by the 10 basic principles of competency-based TVET.\n\n• The training is based on curriculum developed from the competency standards;\n• Learning is modular in its structure;\n• Training delivery is individualized and self-paced;\n• Training is based on work that must be performed;\n• Training materials are directly related to the competency standards and the\ncurriculum modules;\n• Assessment is based in the collection of evidence of the performance of work to\nthe industry required standard;\n• Training is based both on and off-the-job components;\n• Allows for recognition of prior learning (RPL) or current competencies;\n• Training allows for multiple entry and exit; and\n• Approved training programs are nationally accredited.\n\nThe competency-based TVET system recognizes various types of delivery modes,\nboth on and off-the-job as long as the learning is driven by the competency standards\nspecified by the industry. The following training modalities may be adopted when\ndesigning training programs:\n\n• The dualized mode of training delivery is preferred and recommended. Thus\nprograms would contain both in-school and in-industry training or fieldwork\ncomponents. Details can be referred to the Practical application System (DTS)\nImplementing Rules and Regulations.\n• Modular/self-paced learning is a competency-based training modality wherein the\ntrainee is allowed to progress at his own pace. The trainer facilitates the training\ndelivery\n• Peer teaching/mentoring is a training modality wherein fast learners are given the\nopportunity to assist the slow learners.\n• Supervised industry training or on-the-job training is an approach in training\ndesigned to enhance the knowledge and skills of the trainee through actual\nexperience in the workplace to acquire specific competencies prescribed in the\ntraining regulations.\n• Distance learning is a formal education process in which majority of the instruction\noccurs when the students and instructor are not in the same place. Distance\nlearning may employ correspondence study, or audio, video or computer\ntechnologies.\n\n--- PDF PAGE 87 ---\nTR Landscape Installation and Maintenance NC II 83\n3.3 TRAINEE ENTRY REQUIREMENTS\n\nTrainees or students should possess the following requirements:\n\n• can communicate both orally and in writing in English;\n• between ages 18 - 40 yrs\n• physically and mentally fit;\n• with good moral character; and\n• can perform basic mathematical computation.\n\nThis list does not include specific institutional requirements such as educational\nattainment, appropriate work experience, and others that may be required of the trainees\nby the school or training center delivering the TVET program.\n\n3.4 LIST OF TOOLS, EQUIPMENT AND MATERIALS\n\nLANDSCAPE INSTALLATION AND MAINTENANCE (SOFTSCAPE) – NC II\n\nRecommended list of tools, equipment and materials for the training of 25 trainees for\nLandscape Installation and Maintenance – NC II\n\nTOOLS\nEQUIPMENT\nMATERIALS\nQTY\n\nQTY\n\nQTY\n\n25 pcs\nPruning shear or\nsecateur\n2 pcs\nChain saw\n1 bag for\neach\ntype\nFertilizers\n5 pcs\nLoping shear\n25 pcs\n\nPruning saw\n2 pcs\nTelescopic shaft or\npower high branch\npruner\n1\nsample\nfor each\nPesticides\n5 pcs\nBow saw\n25 pcs\nGloves\n5 pcs\nTree or pole\npruner\n2 pcs\nPower hedge\ntrimmer\n25 pcs\nEar masks/\nMuff/plug\n25 pcs\nHedge trimmer\n1 pc\nOne-man soil auger\n25 pcs\n\nGoggles\n13 pcs\nSpade\n1 pc\nTwo-man soil auger\n\n5 pcs @\n10\nmeters\nlong\n\nGarden hose\nwith complete\naccessories\n13 pcs\nShovel\n5 pcs\nHole digger\n1 unit\nDump truck\n(Own or rent)\n13 pcs\nReflectorized\nvest\n5 pcs\n\nWheel barrow\n1 unit\nBoom or power\nsprayer\n(Own or rent)\n.25 pcs\nOverall /working\nclothes\n\n--- PDF PAGE 88 ---\nTR Landscape Installation and Maintenance NC II 84\n\n5 pcs\nsprayer\n1 unit\nCrane or boom\ntruck\n(Own or rent)\n25 pcs\nGas mask\n\n25 pcs\nMallet\n25 pcs\nHammer\n13\npcs\nGrass cutter\n25 pcs\nRaincoat\n25 pcs\nStone rake\n25 pcs\nLeaf rake\n2 pcs\n4.5 HP lawn mover\n25 pcs\nBoots\n5 pcs\nGun tacker\n13 pcs\nRake\n1 unit\nChipper / Shredder\n5 pcs\nSafety shoes\n5 pcs\nRoller\n1 unit\nMechanical\ncompactor\n5 pcs\nSafety belt\n25 pcs\nHand trowel\n5 pcs\nClimbing ropes\n5 pcs\n\nSoil drencher\n(accessory to the\ngarden hose)\n1 unit\nBlower\n25 pcs\nHard hat\n 25 pcs\nFork\n\n1 bag\n(25 kg)\nSoil mix\n2 units\n\nSand /Soil Sieve\n(standard size)\n\nSample,\n5 each.\nStakes (wooden-\nsquare/ round;\nsteel, bamboo;\nplastic\n25 pcs\nMeter tape (5 m)\n\n13 units Tree support\nunits (G hose,\nwood stake, GI\nwire, GI nails,\nburlap pads, etc\n5 pcs\n Meter tape\n(50 m)\n\n13 units Guy materials\n(GI wire, GI or\nwooden pegs, G\nhose, etc.)\n5 pcs\nLadder /\nAdjustable\nladder (24 ft)\n\n1 bag\neach\n Mulch\n(decorative\nstone, crushed\nbricks, bark\nchips, etc)\n13 pcs\n Mattock pick\n\n25 pcs\nSafety apron\n\n--- PDF PAGE 89 ---\nTR Landscape Installation and Maintenance NC II 85\n3.5 TRAINING FACILITIES\nLANDSCAPE INSTALLATION AND MAINTENANCE (SOFTSCAPE) – NC II\n\nThe workshop must be made of reinforced concrete or steel structure. The size must\nbe suited on the requirements of the competencies. The facility should accommodate a\nminimum of 25 students/trainees.\n\nSPACE REQUIREMENT\nSIZE IN METERS\nAREA IN SQ.\nMETERS\nTOTAL AREA IN\nSQ. METERS\nWorkshop Component Areas\n• Laboratory/Workshop\nArea\n-\n-\n100.00\n•\nLecture Room\n5.00 x 5.00\n25.00\n25.00\n• Tool, Supply & Storage\nRoom\n3.00 X 3.00\n9.00\n9.00\n• Learning Resource\nCenter\n2.00 x 5.00\n10.00\n10.00\n•\nWash Room and Toilet\n2.00 X 5.00\n10.00\n10.00\nTotal (Workshop Component)\n154.00\n•\nCirculation Area (30% of Workshop Component Space)\n40.00\nGrand Total (Building Space)\n194.00\nNote: The entries in the size in meters column are recommendations only. The grand total\n(building space) is the minimum space requirement for registration.\n\n3.6 TRAINERS’ QUALIFICATION\nAGRICULTURE AND FISHERY SECTOR\n\nLANDSCAPE INSTALLATION AND MAINTENANCE (SOFTSCAPE) – NC II\nTRAINER QUALIFICATION (TQ II)\n• Must be a holder of Landscape Installation and Maintenance (Soft Scape) NC II or\nequivalent qualification\n• Must have undergone training on Training Methodology II (TM II) or equivalent in\ntraining/experience\n• Must be computer literate\n• Must be ph