tion \n      5.1.1 Species/individual (genetically superior) selection \n      5.1.2 Pest and disease free \n      5.1.3 Cultural management \n      5.1.4 Sanitation \n5.2  Control  \n5.3  Manual/mechanical \n5.4  Chemical (systemic, broad spectrum, contact)  \n5.5  Biological- (insects, microorganisms) \n5.6  Bio-pesticides\n\n--- PDF PAGE 63 ---\nTR Landscape Installation and Maintenance NC II                                                                             59 \n \n \nVARIABLE \nRANGE \n6.  Tools, supplies and \nequipment    \n \n \n \n6.1  Backpack sprayer \n6.2  Boom sprayer \n6.3  Soil drencher \n6.4  Pruning shears,  \n6.5  Pruning saws \n7.   Protective/safety \ngadgets  \n \n \n7.1 Overalls, gloves \n7.2  Gas mask \n7.3  Goggles \n7.4  Reflectorized vest ( depends on location of work) \n8.   Maintenance of clean \nand safe area \nTasks may include: \n8.1  Keeping public access paths and roads clear of debris, \nwaste, tools and equipment \n8.2  Disabling tools and equipment after use \n8.3  Using signage and barriers where necessary \n8.4 Removing debris and waste from the work area\n\n--- PDF PAGE 64 ---\nTR Landscape Installation and Maintenance NC II                                                                             60 \n \nEVIDENCE GUIDE  \n \n1.   Critical Aspects \nof Competency \nAssessment requires evidence that the candidate: \n1.1 Determined requirements for the prevention and control of pests \nand diseases \n1.2  Prepared for the application of pest and disease prevention    \n       and control \n1.3  Applied pest and disease prevention and control measures \n1.4  Conducted post-pest and disease prevention and control  \n       operations \n1.5  Performed tasks using appropriate tools, equipment and  \nsafety/protective devices \n2. Underpinning \nKnowledge and \nAttitude \n \n2.1 Types of landscape plants, their conditions and stage of growth  \n2.2  General classification of pests and diseases, life cycle and mode \nof attack \n2.3  Procedures and techniques in prevention and control of pests \nand diseases \n2.4  Functions, uses and maintenance of tools and equipment \n2.5  Values: \n      2.5.1 Diligence  \n      2.5.2 Time consciousness \n      2.5.3 Cost consciousness \n      2.5.4  Hygiene consciousness \n      2.5.5  Persistence \n     2.5.6 Systematic and organized\n3. Underpinning     \n      Skills \n3.1 Use of appropriate tools and equipment and prescribed \nprotective/safety devices in the prevention and control of pests \nand diseases \n3.2  Communication skills in receiving instructions and in rendering \nsimple written and even oral reports\n4. Resource \nImplications \nThe following resources MUST be provided: \n4.1  Landscape area/landscape plants \n4.2  Tools, equipment, supplies and materials and protective/safety \ndevices \n4.3  Instructions or guidelines \n5. Method of \nAssessment \nCompetency may be assessed through: \n5.1  Direct Observation with Oral Questioning \n5.2  Interview \n5.3  Portfolio \n6. Context of \nAssessment \n6.1  Competency may be assessed individually in the actual \nworkplace or simulation environment in TESDA accredited \ninstitutions.\n",
