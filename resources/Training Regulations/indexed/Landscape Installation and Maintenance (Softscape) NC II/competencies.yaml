        "evidence_guide": {
          "source_text": "1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Identified fertilizer application requirements\n1.2 Prepared for fertilizer application activity\n1.3 Performed fertilizer application activities\n1.4 Performed post fertilizer application activities\n2. Underpinning\nKnowledge and\nAttitude\n\n2.1 Types of landscape plants, their characteristics and growth\nhabit\n2.2 Procedures and techniques in diagnosis/recognition of\nnutrient deficiency\n2.3 Types, characteristics and methods of application of\nfertilizers\n2.4 Frequency and dosage of fertilizers\n2.5 Effects of fertilizer on plant growth and development\n2.6 Functions, uses and maintenance of tools and equipment\nincluding relevant supplies and materials for the job\n2.7 Hygiene practices and plant health principles relevant to\nfertilizer application activity\n2.8 Values:\n 2.8.1 Diligence\n 2.8.2 Time consciousness\n 2.8.3 Cost consciousness\n 2.8.4 Hygiene consciousness\n 2.8.5 Persistence\n 2.8.6 Systematic and organized\n3. Underpinning Skills\n3.1 Using of appropriate tools and equipment and prescribed\nprotective/safety devices in the application of fertilizers\n3.2 Understanding work procedures\n3.3 Participating in teams and contributing to team objectives\n3.4 Communication skills in receiving instructions and in\nrendering simple written and even oral reports\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1 Fertilizers materials including other relevant supplies\n4.2 Tools and equipment\n4.3 Landscape area/landscape plants\n5. Method of\nAssessment\nCompetency may be assessed through:\n5.1 Direct Observation with Oral Questioning\n5.2 Interview\n5.3 Portfolio\n6. Context of\nAssessment\n6.1 Competency may be assessed individually in the actual\nworkplace or simulation environment in TESDA accredited\ninstitutions.\n\n--- PDF PAGE 57 ---\nTR Landscape Installation and Maintenance NC II 53\nUNIIT OF COMPETENCY: WATER PLANTS\nUNIT CODE\n :"
        },
        "source_text": "AGR611378\nUNIT DESCRIPTOR\n : This unit covers the knowledge, skills and attitudes required to\nrecognize types of fertilizers and apply the right amount of such\nfertilizers at the right time to landscape plants.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Identify fertilizer\napplication\nrequirements\n1.1 Soil and plant samples (leaves) are collected for analysis in\naccordance with standard operating procedures (SOPs)\n1.2 Landscape plants in need of nutrition are identified based\non the results of soil and plant analyses\n2. Prepare for fertilizer\napplication activity\n2.1 Different types of fertilizers are selected based on\nnutritional guidelines and standards\n2.2 Method of fertilizer application are determined\naccording to LMS\n2.3 Fertilizer application tools and equipment are selected and\nprepared according to application method selected\n2.4 Soil and plants are prepared for application of fertilizer in\naccordance with the instructions or available standards\n2.5 Prescribed safety and personal protective equipment\n(PPE) is selected.\n3. Perform fertilizer\napplication activities\n3.1 Frequency and dosage of fertilizer application is determined\nbased on landscape plant requirements or nutritional\nguidelines/standards\n3.2 Fertilizer is applied in accordance with recommended\napplication method\n3.3 Fertilizer is applied in accordance with to OHS\nrequirements and Fertilizer and Pesticide Authority (FPA)\nguidelines\n3.4 Task is performed using the prescribed tools and equipment\nand appropriate protective/safety devices\n4. Perform post-\nfertilizer application\nactivities\n4.1 Tools and equipment are cleaned, maintained and stored\naccording to LMS\n4.2 Maintenance of clean and safe area is undertaken\nthroughout and on completion of work\n4.3 Work outputs are recorded or reported to concerned\npersons or authority according to industry practices\n\n--- PDF PAGE 54 ---\nTR Landscape Installation and Maintenance NC II 50\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Soil sample\n1.1 Depth of soil sampling applicable to landscape plant\n1.2 Amount of soil sample\n1.3 Method soil analysis\n 1.3.1 soil test kit\n 1.3.2 soil analysis laboratory\n2. Landscape plants\n2.1 Shrubs and hedges\n2.2 Vines\n2.3 Palms\n2.4 Bamboos\n2.5 Trees\n3. Results of soil and\nplant analyses\n3.1 Soils\n 3.1.1 Slightly, moderately to highly acidic\n 3.1.2 Slightly, moderately to highly saline/alkaline\n 3.1.3 Adequate, medium, low OM\n 3.1.4 Adequate, medium, low N or P or K\n3.2 Plants\n 3.2.1 Visual symptoms: Chlorotic, etc\n 3.2.2 Tissue analysis: Deficient, moderately deficient, highly\ndeficient in N, P or K\n4. Types of fertilizers\n\nTypes of fertilizers vary. These may include the following\n4.1 Organic:\n 4.1.1 Compost, humus, vermi-compost and some\n commercially-brands\n 4.1.2 Bio-fertilizers: Bio-N, Bio-tab, Mycovam, Mycogroe,\n Rhizo-N, etc…\n4.2 Inorganic\n4.2.1 Easily dissolved fertilizer: Ammonium sulfate,\nAmmonium phosphate, Ammonium, Sulfate,\nPhosphate, Potassium, Urea, Complete\n4.2.2 Slow-release fertilizers: Multi-cote, Osmocote,\n Nutricote, Fertifile, etc.\n 4.2.3 Liquid fertilizer\n5. Methods of\napplication\n\n5.1 Liquid Fertilizer\n 5.1.1 Foliar spraying\n 5.1.2 Soil drenching\n 5.1.3 Fertigation (incorporated in irrigation water)\n 5.1.4 Root feeding\n 5.1.5 Trunk injection\n5.2 Powder/granules\n 5.2.1Top dressing or broadcasting\n 5.2.2 Drilling\n\n--- PDF PAGE 55 ---\nTR Landscape Installation and Maintenance NC II 51\n\nVARIABLE\nRANGE\n6. Protective/safety\ndevices\n6.1 Overalls\n6.2 Rubberized gloves\n6.3 Goggles\n6.4 Reflectorized vest (depends on location of work)\n6.5 Hard hat\n6.6 Field shoes\n7. Maintenance of clean\nand safe area\nTasks may include:\n7.1 Keeping public access paths and roads clear of debris,\nwaste, tools and equipment\n7.2 Disabling tools and equipment after use\n7.3 Using signage and barriers where necessary\n7.4 Removing debris and waste from the work area\n\n--- PDF PAGE 56 ---\nTR Landscape Installation and Maintenance NC II 52\n\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Identified fertilizer application requirements\n1.2 Prepared for fertilizer application activity\n1.3 Performed fertilizer application activities\n1.4 Performed post fertilizer application activities\n2. Underpinning\nKnowledge and\nAttitude\n\n2.1 Types of landscape plants, their characteristics and growth\nhabit\n2.2 Procedures and techniques in diagnosis/recognition of\nnutrient deficiency\n2.3 Types, characteristics and methods of application of\nfertilizers\n2.4 Frequency and dosage of fertilizers\n2.5 Effects of fertilizer on plant growth and development\n2.6 Functions, uses and maintenance of tools and equipment\nincluding relevant supplies and materials for the job\n2.7 Hygiene practices and plant health principles relevant to\nfertilizer application activity\n2.8 Values:\n 2.8.1 Diligence\n 2.8.2 Time consciousness\n 2.8.3 Cost consciousness\n 2.8.4 Hygiene consciousness\n 2.8.5 Persistence\n 2.8.6 Systematic and organized\n3. Underpinning Skills\n3.1 Using of appropriate tools and equipment and prescribed\nprotective/safety devices in the application of fertilizers\n3.2 Understanding work procedures\n3.3 Participating in teams and contributing to team objectives\n3.4 Communication skills in receiving instructions and in\nrendering simple written and even oral reports\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1 Fertilizers materials including other relevant supplies\n4.2 Tools and equipment\n4.3 Landscape area/landscape plants\n5. Method of\nAssessment\nCompetency may be assessed through:\n5.1 Direct Observation with Oral Questioning\n5.2 Interview\n5.3 Portfolio\n6. Context of\nAssessment\n6.1 Competency may be assessed individually in the actual\nworkplace or simulation environment in TESDA accredited\ninstitutions.\n\n--- PDF PAGE 57 ---\nTR Landscape Installation and Maintenance NC II 53\nUNIIT OF COMPETENCY: WATER PLANTS\nUNIT CODE\n :"
