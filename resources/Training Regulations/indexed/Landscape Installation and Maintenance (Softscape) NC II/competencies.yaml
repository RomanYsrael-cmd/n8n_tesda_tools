        "evidence_guide": {
          "source_text": "1. Critical Aspects\nof Competency\nAssessment requires evidence that the candidate:\n1.1. Identified and used tools and equipment in maintaining lawn\ngrass\n1.2. Controlled pests, diseases and weeds through chemical use or\nmanually\n1.3. Performed irrigation and fertilization of lawn grass\n1.4 Exhibited safety practices and procedures in mowing, irrigating\nlawn grass, applying fertilizers and controlling pests, diseases\nand weeds.\n2. Underpinning\nKnowledge and\nAttitude\n\n2.1. Functions, uses and basic maintenance of tools and equipment\n2.2. Different types of pests, diseases and weeds\n2.3. Types of Insecticides, Fungicides and Herbicides\n2.4. Mixing appropriate amount of chemical-pesticides\n2.5. Values ( Diligence, Time and Cost-consciousness, Hygiene,\nSystematic and Organized)\n3. Underpinning\n Skills\n3.1. Applying prescribed amount of pesticides\n3.2. Use of appropriate tools and equipment and PPE\n3.3. Communication skills in receiving instruction and rendering\nsimple oral reporting\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1. Lawn\n4.2. PPE\n4.3. Mowing, Irrigation tools and equipment\n4.4. Pest / Weed Control (Supplies, Tools and Equipment)\n5. Method of\nAssessment\nCompetency may be assessed through:\n5.1 Direct observation with oral questioning\n5.2. Portfolio\n5.3 Interview\n6. Context of\nAssessment\n6.1 Competency may be assessed individually in the actual\n workplace or simulation environment in TESDA\n accredited institutions.\n\n--- PDF PAGE 71 ---\nTR Landscape Installation and Maintenance NC II 67\nUNIIT OF COMPETENCY: PERFORM RE-PLANTING ACTIVITIES\nUNIT CODE\n :"
        },
        "source_text": "AGR611382\nUNIT DESCRIPTOR\n : This unit covers the knowledge, skills and attitudes required to\n maintain lawn grasses in residential and institutional landscape\nareas.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n\n1. Mow lawn grass\n\n1.1. Supplies, Materials, Tools and equipment are prepared for\nuse in mowing lawn grass\n1.2. Lawn grass is mowed in accordance with specifications\nor instructions\n1.3. Tasks are performed using the prescribed tools and\nequipment and or based on established practice\n1.4. Personal Protective Equipment and Safety procedures\nare observed during mowing of lawn grass\n\n2. Irrigate lawn\n\n2.1. Supplies, Tools and equipment are prepared for use in\nirrigating lawn\n2.2. Personal Protective Equipment and Safety procedures\nare observed in irrigating lawn\n2.3. Lawn is irrigated based on established procedures\n2.4. Modifications on established procedures are carried on in\nthe event of malfunctions, climatic changes and accidents\n\n3. fertilize lawn\n\n3.1. Supplies, Materials, Tools and equipment are prepared\nfor use in fertilizing lawn\n3.2. Personal Protective Equipment and Safety procedures\n are observed in fertilizing lawn\n3.2. Fertilizers are applied based on manufacturer’s\ninstructions and established procedures\n\n4. Control pests\n\n4.1. Supplies, Materials, Tools and equipment are prepared\nfor use in controlling pests\n4.2. Personal Protective Equipment and Safety procedures\nare observed in controlling pests\n4.3. Pests are controlled using appropriate materials and\nconditions\n\n5. Control weeds\n\n5.1. Supplies, Materials, Tools and equipment are prepared\nfor use in controlling weeds\n5.2. Personal Protective Equipment and Safety procedures\nare observed in controlling weeds\n5.3. Weeds are controlled using appropriate materials and\nprocedures\n\n--- PDF PAGE 69 ---\nTR Landscape Installation and Maintenance NC II 65\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n\n1. Lawn grass\n\n1.1.\nPaspalum conjugatum /Paspalum vaginatum (Carabao\ngrass)\n1.2.\nCynodon dactylon/C. transvalensis (Bermuda grass)\n1.3.\nZoysia matrella (Manila grass)\n1.4.\nZoysia japonica (Blue grass)\n\n2. Personal Protective\nEquipment\n\n2.1. Rubber/ Leather Gloves\n2.2. Goggle\n2.3. Rubber/Safety boots\n2.4. Safety Apron\n2.5. Hard hat\n2.6. Cover all\n2.7. Ear plug/muffs\n2.8. Chemical Mask\n\n3. Established procedures\nin Irrigating lawn\n\n3.1. Manual\n3.2. Automated (Computer or Manual Operated)\n\n4. Fertilizers\n\n4.1. Granular\n4.2. Liquid\n4.3. Slow release (tablets or granules)\n4.4. Organic\n\n5. Pests\n\n5.1. Insect pests\n5.2. Pathogenic / fungal pests\n5.3. Nematodes\n\n6. Weed control\nprocedures\n\n6.1. Manual\n6.2. Chemical\n\n--- PDF PAGE 70 ---\nTR Landscape Installation and Maintenance NC II 66\nEVIDENCE GUIDE\n\n1. Critical Aspects\nof Competency\nAssessment requires evidence that the candidate:\n1.1. Identified and used tools and equipment in maintaining lawn\ngrass\n1.2. Controlled pests, diseases and weeds through chemical use or\nmanually\n1.3. Performed irrigation and fertilization of lawn grass\n1.4 Exhibited safety practices and procedures in mowing, irrigating\nlawn grass, applying fertilizers and controlling pests, diseases\nand weeds.\n2. Underpinning\nKnowledge and\nAttitude\n\n2.1. Functions, uses and basic maintenance of tools and equipment\n2.2. Different types of pests, diseases and weeds\n2.3. Types of Insecticides, Fungicides and Herbicides\n2.4. Mixing appropriate amount of chemical-pesticides\n2.5. Values ( Diligence, Time and Cost-consciousness, Hygiene,\nSystematic and Organized)\n3. Underpinning\n Skills\n3.1. Applying prescribed amount of pesticides\n3.2. Use of appropriate tools and equipment and PPE\n3.3. Communication skills in receiving instruction and rendering\nsimple oral reporting\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1. Lawn\n4.2. PPE\n4.3. Mowing, Irrigation tools and equipment\n4.4. Pest / Weed Control (Supplies, Tools and Equipment)\n5. Method of\nAssessment\nCompetency may be assessed through:\n5.1 Direct observation with oral questioning\n5.2. Portfolio\n5.3 Interview\n6. Context of\nAssessment\n6.1 Competency may be assessed individually in the actual\n workplace or simulation environment in TESDA\n accredited institutions.\n\n--- PDF PAGE 71 ---\nTR Landscape Installation and Maintenance NC II 67\nUNIIT OF COMPETENCY: PERFORM RE-PLANTING ACTIVITIES\nUNIT CODE\n :"
