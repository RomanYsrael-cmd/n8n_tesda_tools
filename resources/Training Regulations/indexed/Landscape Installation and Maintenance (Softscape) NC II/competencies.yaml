        "source_title": "Control and prevent plant pest and diseases",
        "source_text": "--- PDF PAGE 61 ---\nTR Landscape Installation and Maintenance NC II                                                                             57 \nUNIIT OF COMPETENCY:  CONTROL AND PREVENT PLANT PEST AND DISEASES \nUNIT CODE \n :   AGR611380 \nUNIT DESCRIPTOR        :   This unit covers the knowledge, skills and attitudes required to \ndetermine types of pests and diseases and their prevention and \ncontrol measures     \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1.   Determine \nrequirements of \npreventing and \ncontrolling plant pests \nand diseases \n1.1 Infested and diseased landscape plants are determined \nbased on plant conditions, symptoms and signs and \nother manifestation of infestation and infection \n1.2  Pests and diseases are identified and classified using \ngeneral classification guidelines  \n1.3  Life cycle or various life stages of pests from eggs, \nlarvae, pupa and adult and their mode of attack  or \ninfestation are known \n1.4  Life cycle or various life stages and signs and symptoms \nof  plant diseases and their mode of attack are known \n1.5  Access to the site is determined in consultation with \n       concerned persons or authority \n1.6  Occupational Health and Safety (OHS) hazards are \nidentified, risks assessed and reported to concerned \npersons or authority\n2.   Prepare for application \nof pests and disease \nprevention and control \nmeasures \n \n2.1 Method of prevention and control is determined based \non types of pests and diseases, their mode of attack and \nextent of infestation and infection \n2.2 Tools, equipment, supplies and materials relevant to the \nmethod of prevention and control are prepared \n2.3 Prescribed safety and personal protective equipment \n(PPE) is selected in accordance with work requirements\n3.   Apply pest and \ndisease prevention \nand control measures \n3.1 Manual and biological method of prevention and control of \