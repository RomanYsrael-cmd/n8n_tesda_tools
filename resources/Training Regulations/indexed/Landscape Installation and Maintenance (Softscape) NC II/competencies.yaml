        "source_title": "INSTALL PLANTS AT DESIGNATED LOCATIONS AS DESIGNED",
        "source_text": "--- PDF PAGE 37 ---\nTR Landscape Installation and Maintenance NC II                                                                             33 \nUNIT OF COMPETENCY:     INSTALL PLANTS AT DESIGNATED LOCATIONS AS  \n                                                DESIGNED \nUNIT CODE \n :      AGR611374 \nUNIT DESCRIPTOR \n : \nThis unit covers the knowledge, skills and attitudes  required \nto perform installing plants at designated locations as shown \nin the planting plan or as specified. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1.   Inspect plants \n1.1  Only specified species, variety, quality, size, etc. shall \nbe delivered in accordance with the planting plan and \nplant list \n1.2  Delivered plants are inspected in accordance with the \nplant list or planting plan \n1.3  Rejected plants delivered shall be removed from the \nsite immediately after inspection \n2.   Lay-out or stake out \nplant \n \n2.1 Exact location of the plants is marked on the ground in \naccordance with the planting plan, specifications and/or \ninstructions \n2.2  Appropriate plants is distributed and marked on the \nground as indicated in the planting plan or in \naccordance with instructions \n3. Excavate hole/pit \n(Excluding lawn \ngrass/turf, aquatic \nplants, orchids, etc.)  \n3.1  Excavate/dig hole/pit  at designated mark in \naccordance with specifications or instructions \n3.2  Tasks are performed using prescribed tools, equipment \nand appropriate personal protective equipment \n(PPE) \n4. Install plants (Excluding \nlarge trees with 15cm or \nmore trunk height, lawn \ngrass/turf, aquatic \nplants, orchids, etc.) \n4.1  Plants are removed from container  according to \nprescribed instructions and techniques \n4.2  Extra long primary roots are cut and not wound around \nthe root ball \n4.3  Pre-planting watering of excavated holes is performed \n(thoroughly saturated) according to accepted standard \ntechniques and procedures  \n4.4  Plant is installed in accordance with landscape \nspecifications and standards, detailed drawings and \ninstructions \n4.5  Plants are set so that the soil level of plant in container \nshall be the same as the finish grade of the hole \n4.6  Plants are handled to avoid breakage of root ball, \ntrunk/stem, branches and scraping of bark \n4.7  Plants are set plumb and held in position until sufficient \nsoil has been firmly placed around and under the root \nball \n4.8  Lightly tamp the soil around the base of the plant to \neliminate air pockets and to hold the plant firmly and \nplumb to the soil\n\n--- PDF PAGE 38 ---\nTR Landscape Installation and Maintenance NC II                                                                             34 \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n5.  Apply fertilizer \n5.1  Fertilizers are selected in conformity with the \nmanufacturer’s guaranteed analysis, labels or as \nspecified \n5.2  Fertilizers and/or rooting hormones are applied to newly \ninstalled plants in accordance with the standard \nlandscaping specifications or instructions \n5.3  Fertilizers are applied to large trees and palms, when \nthe planting hole/pit is half-filled with amended soil in \naccordance with the instructions \n5.4  Tasks are performed using prescribed tools, equipment \nand appropriate personal protective equipment (PPE)\n6.  Water plants \n6.1  Watering basin / bern is made around each plant and in \naccordance with instructions or specifications \n6.2  Watering is performed after planting to thoroughly wet \nthe root ball and surrounding ground in accordance with \nstandard watering techniques \n6.3  Tasks are performed using prescribed tools, equipment \nand appropriate personal protective equipment (PPE)\n7.  Apply / Install mulch \n7.1  Materials for mulching is selected and prepared in \naccordance with the standard landscape specifications, \ninstructions or detailed drawing \n7.2. Area / ground  where mulch will be applied is prepared \nin accordance with the specifications, instructions or \ndetailed drawing \n7.3. Mulch is applied in accordance with the specifications, \ninstructions or detailed drawing \n7.4. Tasks are performed using prescribed materials and \ntools and equipment \n7.5. Tasks are performed  using appropriate safety \nprotective safety protective devices \n7.6. Area is restored and cleaned as per standard operating  \nprocedures\n8.  Perform post-landscape \ninstallation activities \n8.1  Tools and equipment are cleaned, maintained and \nstored according to  established standard practices \n8.2  Maintenance of clean and safe area is undertaken \nthroughout and on completion of work \n8.3  Work output is reported to concerned person or \nauthority according to industry practices\n\n--- PDF PAGE 39 ---\nTR Landscape Installation and Maintenance NC II                                                                             35 \nRANGE OF VARIABLES \nVARIABLE \nRANGE \n 1.  Plants   \n \nCommonly classified plants in landscaping may include but are \nnot limited to: \n1.1 Lawn grass and turf (excluding specialized golf course \ngrass) \n1.2 Groundcover and vines \n1.3 Shrubs, herbs, small palms, annuals, etc. \n1.4 Trees, large palms, large bamboo, etc. \n1.5 Aquatic plants, orchids, ferns, etc. \n1.6  Succulents  \n2.  Inspected  \nPlant inspected may include but are not limited to: \n2.1  Species \n2.2  Variety \n2.3  Number \n2.4  Size    \n2.5 Plant condition\n3.   Mark \n \n \n3.1  Spray paint (red or orange color preferred) \n3.2  Bamboo/wood sticks/stakes \n3.3  Lime dust \n3.4  Specified plants directly as marker \n4.   Personal Protective \nEquipment (PPE) \nMay include but are not limited to: \n4.1 Gloves \n4.2 Gas mask \n4.3 Hard hat  \n4.4 Safety belts/harness \n4.5 Safety shoes \n4.6 Safety apron \n4.7 Rain boots \n4.8 Reflectorized vest\n5.  Fertilizers \n5.1 Fertilizers forms \n5.1.1 Soluble crystals \n5.1.2 Dray granules \n5.1.3 Organic fish meal \n5.1.4 Controlled (slow) – release pellets \n5.2 Fertilizers types \n5.2.1 Organic \n5.2.2 Chemical \n6.  Watering \n6.1 By hand (manually) using rubber/plastic hose attached to a \nhose bibb or faucet or quick coupling valve as spice of \nwater from the main supply \n6.2 By irrigation system operated manually or automatically by \ncontroller \n6.3 Water tank truck as source of water supply provided with \ndispenser connected to a hose directly or water is collected \nin containers (sprinkler, pail, etc.) to water the plants\n7.  Mulch \n7.1.  Shreaded bark / branch \n7.2.  Straw or equal \n7.3 Gravel /stone / brick chips \n7.4.  Coconut husk chips \n7.5.  Plastic sheet or Jute mesh\n\n--- PDF PAGE 40 ---\nTR Landscape Installation and Maintenance NC II                                                                             36 \n \n \nEVIDENCE GUIDE  \n \n1.  Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1  Inspected plants \n1.2  Laid-out or stake-out plants \n1.3 Excavated hole/pit at designated marks \n1.4 Installed plants  \n1.5 Applied fertilizers \n1.6 Watered plants \n1.7 Performed tasks using prescribed tools, equipment and \npersonal protective equipment (PPE) \n1.8 Cleaned, maintained and stored tools and equipment \n1.9 Cleaned and maintained work area \n1.10 Observed OHS practices \n2.  Underpinning \nKnowledge and \nAttitude \n \n2.1 Basic Plan Reading \n2.2 Functions of tools, materials and equipment \n2.3 Familiarity with plants (i.e. name, parts, handling and care) \n2.4 Basic arithmetic \n2.5 Basic communication skills \n2.6 Basic first-aid treatment  \n2.7 Types, characteristics and methods of application of \nfertilizers \n2.8 Frequency and dosage of fertilizers \n2.9 Hygiene practices and plant health principles  \n2.10 Procedures and techniques in watering/irrigation \n2.10 Values \n       2.10.1  Diligence  \n       2.10.2 Time consciousness \n3.  Underpinning Skills \n3.1  Using tools and equipment \n3.2  Applying planting techniques \n3.3  Using the right species, size and quality of plants \n3.4  Communication skills (verbal or written) in receiving \ninstructions   \n4.  Resource \nImplications \nThe following resources MUST be provided: \n4.1  Workplace area \n4.2  Supplies, materials, tools and equipment needed to \nperform the tasks \n4.3  Instructions (Oral or Written) \n5.  Method of \nAssessment \nCompetency may be assessed through: \n5.1   Direct Observation with Oral Questioning \n5.2   Interview \n5.3   Portfolio \n6.  Context of \nAssessment \n6.1  Competency may be assessed individually in the actual \nworkplace or simulation environment in TESDA accredited \ninstitutions\n",
