        "evidence_guide": {
          "source_text": "1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Determined requirements for the collection, disposal,\nsegregation, processing and utilization of plant-derived\norganic wastes\n1.2 Prepared for collection, disposal, segregation, processing and\nutilization of plant-derived organic wastes\n1.3 Gathered and disposed plant derived organic wastes that are\nnot intended for processing and utilization\n1.4 Converted large organic waste materials into chips\n1.5 Chipped organic wastes are mixed with small-sized\n organic wastes materials and used them to produce\n compost\n1.6 Conducted post operations activities\n2. Underpinning\nKnowledge and\nAttitude\n\n2.1 Procedures and techniques in collection and disposal,\nsegregation, processing and utilization of organic wastes\n2.2 Functions, uses and maintenance of tools and equipment\n2.3 Values\n 2.3.1 Diligence\n 2.3.2 Time consciousness\n 2.3.3 Cost consciousness\n 2.3.4 Hygiene consciousness\n 2.3.5 Persistence\n 2.3.6 Systematic and organized\n3. Underpinning\n Skills\n3.1 Use of appropriate tools and equipment and prescribed\nprotective/safety devices in the collection and disposal,\nsegregation, processing and utilization of organic wastes\n3.2 Communication skills in receiving instructions and in rendering\nsimple written and even oral reports\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1 Plants and landscaped areas\n4.2 Trimming, pruning and other relevant maintenance program\n4.2 Tools and equipment\n4.3 Protective Safety Gadgets\n5. Method of\nAssessment\nCompetency may be assessed through:\n5.1 Direct Observation with Oral Questioning\n5.2 Interview\n5.3 Portfolio\n6. Context of\nAssessment\n6.1 Competency may be assessed individually in the actual\nworkplace or simulation environment in TESDA accredited\ninstitutions.\n\n--- PDF PAGE 81 ---\nTR Landscape Installation and Maintenance NC II 77"
        },
        "source_text": "AGR611384\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes required to\ncollect, dispose and utilize organic wastes such as grass\nclippings, leaf litter, weeded undesirable plants, trimming and\npruning debris and other plant-derived organic wastes.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Determine the\nrequirements for\ncollection, disposal\nand utilization of\norganic waste\n1.1 Types of plant-derived organic wastes are determined in\naccordance with the trimming and pruning program\n1.2 Locations where the collected organic wastes will be\ndisposed and/or will be segregated and processed for\nfuture utilization are identified in accordance with the\ntrimming and pruning program\n2. Prepare for\ncollection,\nsegregation,\ndisposal and\nutilization of organic\nwastes\n2.1 Tools, supplies and equipment needed are made ready\nand available for use according to the types of the organic\nwastes and whether these wastes are to be disposed as\nthey are or to be processed and utilized\n2.2 Appropriate safety protective devices are made ready\n and available for use\n3. Gather and dispose\norganic wastes\n3.1 Plant derived organic wastes are collected and disposed in\naccordance with instructions and/or with LMS\n3.2 Collection and disposal are done using prescribed tools and\nequipment\n3.3. Task is conducted using appropriate safety protective\ngadgets\n4. Segregate and\nprocess collected\norganic wastes\n\n4.1 Organic wastes that are to be utilized for specific\npurposes are collected, segregated and processed, if\nnecessary in designated area as per instructions or in\naccordance with LMS\n4.2 Collection, segregation and processing (e.g., conversion of\nwoody organic wastes into chips) are done using prescribed\ntools, supplies and equipment\n4.3 Task is performed using appropriate safety protective\ndevices\n\n--- PDF PAGE 78 ---\nTR Landscape Installation and Maintenance NC II 74\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n5. Make use of organic\nwastes\n5.1 Organic wastes (like palm leaves, twigs and branches of\nshrubs and trees) that are chipped into small materials are\neither mixed with grass clippings or other small organic\nwastes (leaf litter) for composting. Other wood chips are\nused as mulch.\n5.2 Task is performed in accordance with environmental\nstandards and using appropriate protective safety devices\n6. Perform post –\ndisposal and\nutilization of organic\nwaste\n6.1 Tools and equipment are cleaned, maintained and stored as\nper instruction of in accordance with LMS\n6.2 Maintenance of clean and safe area is undertaken\nthroughout and on completion of work\n6.3 Work outputs are recorded or reported to concerned\npersons or authority according to industry practices\n\n--- PDF PAGE 79 ---\nTR Landscape Installation and Maintenance NC II 75\n\n RANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Types of plant-\nderived organic\nwastes\n1.1 Grass clippings/mowed grass\n1.2 Weeded-out plants\n1.2 Hedge and shrub trimmings\n1.3 Pruned palm fronds and leaf sheaths\n1.4 Leaf litter\n1.5 Pruned dying, dead, diseased/infested and live branches\n1.6 Removed/cut dead plants\n2. Locations\nSpecific sites in the following green spaces\n2.1 Club house/ house premises\n2.2 Street corridors\n2.3 Gardens\n2.4 Parks\n2.5 Golf course area (Hole Number, Fairways)\n2.6 Memorial parks\n3. Tools and equipment\n\n2.1 Leaf rake\n2.2 Fork\n2.3 Trash bags\n2.4 Wheel barrow\n2.5 Multi-cab or pick-up\n2.6 Elf and/or mini-dump truck\n2.6 Chipper\n2.7 Shovel\n2.8 Spade\n2.9 Shieve\n3. Protective/safety\ngadgets\n\n3.1 Hat/hard hat\n3.2 Overalls including gloves\n3.3 Shoes/safety shoes\n3.4 Goggles\n3.5 Reflectorized vest (if in risky areas like street/road corridors)\n4. Purpose of utilization\nUse of processed organic wastes may include but not limited to:\n4.1 Compost\n4.2 Mulch materials\n5. Organic wastes\nMay include but are not limited to:\n5.1 Palm leaves\n5.2 Twigs\n5.3 Branches of shrubs and trees\n6. Maintenance of clean\nand safe area\nTasks may include:\n6.1 Keeping public access paths and roads clear of debris,\nwaste, tools and equipment\n6.2 Disabling tools and equipment after use\n6.3 Using signage and barriers where necessary\n6.4Removing debris and waste from the work area\n\n--- PDF PAGE 80 ---\nTR Landscape Installation and Maintenance NC II 76\n\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Determined requirements for the collection, disposal,\nsegregation, processing and utilization of plant-derived\norganic wastes\n1.2 Prepared for collection, disposal, segregation, processing and\nutilization of plant-derived organic wastes\n1.3 Gathered and disposed plant derived organic wastes that are\nnot intended for processing and utilization\n1.4 Converted large organic waste materials into chips\n1.5 Chipped organic wastes are mixed with small-sized\n organic wastes materials and used them to produce\n compost\n1.6 Conducted post operations activities\n2. Underpinning\nKnowledge and\nAttitude\n\n2.1 Procedures and techniques in collection and disposal,\nsegregation, processing and utilization of organic wastes\n2.2 Functions, uses and maintenance of tools and equipment\n2.3 Values\n 2.3.1 Diligence\n 2.3.2 Time consciousness\n 2.3.3 Cost consciousness\n 2.3.4 Hygiene consciousness\n 2.3.5 Persistence\n 2.3.6 Systematic and organized\n3. Underpinning\n Skills\n3.1 Use of appropriate tools and equipment and prescribed\nprotective/safety devices in the collection and disposal,\nsegregation, processing and utilization of organic wastes\n3.2 Communication skills in receiving instructions and in rendering\nsimple written and even oral reports\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1 Plants and landscaped areas\n4.2 Trimming, pruning and other relevant maintenance program\n4.2 Tools and equipment\n4.3 Protective Safety Gadgets\n5. Method of\nAssessment\nCompetency may be assessed through:\n5.1 Direct Observation with Oral Questioning\n5.2 Interview\n5.3 Portfolio\n6. Context of\nAssessment\n6.1 Competency may be assessed individually in the actual\nworkplace or simulation environment in TESDA accredited\ninstitutions.\n\n--- PDF PAGE 81 ---\nTR Landscape Installation and Maintenance NC II 77"
