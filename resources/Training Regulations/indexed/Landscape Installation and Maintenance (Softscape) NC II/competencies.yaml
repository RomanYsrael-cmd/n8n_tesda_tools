        "evidence_guide": {
          "source_text": "1. Critical Aspects\nof Competency\nAssessment requires evidence that the candidate:\n1.1 Determined requirements of watering/irrigating plants\n1.2 Recognized importance of water to plants and the consequent\neffects of less or over-watering\n1.3 Distinguished plants needing watering and plants in excess of\nwatering or suffering from waterlogged conditions\n1.4 Prepared for watering/irrigation activity as per\n instructions\n1.5 Conducted watering/irrigation using the prescribed tools,\nsupplies and equipment and in accordance with standard\npractice\n1.6 Performed post-watering/irrigation activity\n2. Underpinning\nKnowledge and\nAttitude\n\n2.1 Procedures and techniques in watering/irrigation\n2.2 Functions, uses and maintenance of tools and\n equipment for efficient watering/irrigation\n2.3 Values:\n 2.3.1 Diligence\n 2.3.2 Time consciousness\n 2.3.3 Cost consciousness\n 2.3.4 Hygiene consciousness\n 2.3.5 Persistence\n 2.3.6 Systematic and organized\n3. Underpinning\n Skills\n3.1 Use of appropriate tools and equipment and prescribed\nprotective/safety devices in watering/irrigation\n3.2 Communication skills in receiving instructions and rendering\neven verbal reports about the completed task\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1 Landscape area/landscape plants\n4.2 Tools and equipment\n4.3 Protective/safety gadgets\n5. Method of\nAssessment\nCompetency may be assessed through:\n5.1 Direct Observation with Oral Questioning\n5.2 Interview\n5.3 Portfolio\n6. Context of\nAssessment\n6.1 Competency may be assessed individually in the actual\nworkplace or simulation environment in TESDA accredited\ninstitutions.\n\n--- PDF PAGE 61 ---\nTR Landscape Installation and Maintenance NC II 57\nUNIIT OF COMPETENCY: CONTROL AND PREVENT PLANT PEST AND DISEASES\nUNIT CODE\n :"
        },
        "source_text": "AGR611379\nUNIT DESCRIPTOR\n : This unit covers the knowledge, skills and attitudes required to\nmaintain the health and vigor of the landscape plants through\nproper watering/irrigation.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Determine\nrequirements of\nwatering/irrigating\nlandscape plants\n\n1.1 Importance of water to growth and development of\nlandscape plants and the effects of water stress (less or\nexcess water) to plants are recognized as per established\npractice\n1.2 Landscape plants suffering from less or excessive\nwatering are determined using some visually observable\nplant and soil conditions and/or guidelines\n2. Prepare for\nwatering/irrigation\nactivity\n2.1 Amount and frequency of watering/irrigation of plants\nare determined in accordance with LMS or as per\ninstructions\n2.2 Tools, supplies and equipment needed are prepared\nbased on the method of watering and/or irrigation to be\nused\n2.3 Prescribed protective/safety devices are made ready\nand available for use\n3.\nConduct\nwatering/irrigation of\nplant\n3.1 Watering or irrigating of plants is done in accordance\nwith the basic principles or standard practice or as per\ninstructions\n3.2 Watering/irrigation is performed using the irrigation tools\nand equipment appropriate to the methods selected\n3.3 Task is performed using the prescribed protective/\nsafety gadgets\n4.\nPerform post-\nwatering/irrigation\nactivities\n4.1 Tools and equipment are cleaned, maintained and stored\nas per instruction of in accordance with LMS\n4.2 Maintenance of clean and safe area is undertaken\nthroughout and upon completion of work\n4.3 Work outputs are recorded or reported to concerned\npersons or authority according to industry practices\n\n--- PDF PAGE 58 ---\nTR Landscape Installation and Maintenance NC II 54\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Importance of water to\nplants\nRoles of water includes but not limited to the following:\n1.1 Maintains of vital physiological processes in plants\n1.2 Primary raw material for photosynthesis or food\nmanufacture\n1.3 Maintains of turgidity of the cells\n1.4 Helps in the translocation of nutrients, food and other\nassimilates\n1.5 Maintains the health conditions of the plant\n2. Plant conditions\nVisually observable conditions of plants suffering from water\nstress\n2.1 Wilting and die back\n2.2 Change in color and appearance of the leaves\n2.3 Premature falling of leaves/defoliation\n3. Soil conditions\nVisually observable conditions of soil suffering from water\nstress\n3.1 When dry\n 3.1.1 Too dusty\n 3.1.2 Cracks on soil\n3.2 When waterlogged or over-watered\n 3.2.1 Too wet\n 3.2.2 Muddy\n4. Amount and frequency\nof watering\nDetermining when and how much to irrigate may include:\n4.1 Observation of the conditions of the plant\n4.2 Observation of the conditions of the soil\n4.3 Use of moisture meter\n5. Methods of\nwatering/irrigation\n\nThe methods of watering depends on the kind of landscape\nplants/landscape areas and available facilities:\n5.1 Overhead irrigation: overhead sprinkler, pop-up etc.\n5.2 Drip irrigation\n5.3 Furrow irrigation\n5.4 Basin irrigation\n6. Tools and equipment\n\nDepending on the method, the following may be needed:\n6.1 Water hose with and without sprinklers\n6.2 Water truck\n6.3 Irrigation system installed\n6.4 Plumbing tools\n\n--- PDF PAGE 59 ---\nTR Landscape Installation and Maintenance NC II 55\n\nVARIABLE\nRANGE\n7. Protective/safety\ndevices\n\n7.1 Overalls\n7.2 Gloves\n7.3 Hat/hard hat\n7.4 Rain boots\n7.5 Reflectorized vest (depends on the location of work)\n8. Maintenance of clean\nand safe area\nTasks may include:\n8.1 Keeping public access paths and roads clear of debris,\nwaste, tools and equipment\n8.2 Disabling tools and equipment after use\n8.3 Using signage and barriers where necessary\n8.4 Removing debris and waste from the work area\n\n--- PDF PAGE 60 ---\nTR Landscape Installation and Maintenance NC II 56\n\nEVIDENCE GUIDE\n\n1. Critical Aspects\nof Competency\nAssessment requires evidence that the candidate:\n1.1 Determined requirements of watering/irrigating plants\n1.2 Recognized importance of water to plants and the consequent\neffects of less or over-watering\n1.3 Distinguished plants needing watering and plants in excess of\nwatering or suffering from waterlogged conditions\n1.4 Prepared for watering/irrigation activity as per\n instructions\n1.5 Conducted watering/irrigation using the prescribed tools,\nsupplies and equipment and in accordance with standard\npractice\n1.6 Performed post-watering/irrigation activity\n2. Underpinning\nKnowledge and\nAttitude\n\n2.1 Procedures and techniques in watering/irrigation\n2.2 Functions, uses and maintenance of tools and\n equipment for efficient watering/irrigation\n2.3 Values:\n 2.3.1 Diligence\n 2.3.2 Time consciousness\n 2.3.3 Cost consciousness\n 2.3.4 Hygiene consciousness\n 2.3.5 Persistence\n 2.3.6 Systematic and organized\n3. Underpinning\n Skills\n3.1 Use of appropriate tools and equipment and prescribed\nprotective/safety devices in watering/irrigation\n3.2 Communication skills in receiving instructions and rendering\neven verbal reports about the completed task\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1 Landscape area/landscape plants\n4.2 Tools and equipment\n4.3 Protective/safety gadgets\n5. Method of\nAssessment\nCompetency may be assessed through:\n5.1 Direct Observation with Oral Questioning\n5.2 Interview\n5.3 Portfolio\n6. Context of\nAssessment\n6.1 Competency may be assessed individually in the actual\nworkplace or simulation environment in TESDA accredited\ninstitutions.\n\n--- PDF PAGE 61 ---\nTR Landscape Installation and Maintenance NC II 57\nUNIIT OF COMPETENCY: CONTROL AND PREVENT PLANT PEST AND DISEASES\nUNIT CODE\n :"
      },
