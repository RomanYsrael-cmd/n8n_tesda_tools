          "source_text": "1.    Determine   \nrequirements for \nremoval and re-\nplanting of landscape \nplants \n1.1  Landscape plants that need to be removed/replaced are \nrecognized in accordance with the instructions or with LMS \n1.2 Landscape plants needing removal and replacement are \nmarked and counted based on the size, plant conditions \nand purpose are done using appropriate measuring tools \nand equipment  \n2.   Prepare for removal \nand replacement of \nlandscape plants \n2.1 List of landscape plants needing removal and replacement \nis secured and made ready for the job \n2.2 Tools, supplies and equipment needed are made ready \nand available for use according to the types and sizes of \nlandscape plants \n2.3  Appropriate safety protective devices are made ready \nand available for use\n3.   Conduct removal and \ndisposal of landscape \nplants \n \n3.1 Subject landscape plants are removed and disposed from \nsite in accordance with LMS or based on instructions \n3.2 Removal and disposal are done using appropriate tools \nand equipment. \n3.3 Tasks are performed using prescribed protective/safety \ndevices \n4.   Prepare land/soil for \nre-planting  \n4.1 Land/soil is prepared for replanting following the landscape \ninstallation/maintenance standard or based on instructions \n4.2 Preparation of land/soil is done using appropriate tools and \nequipment. \n4.3 Task is performed using prescribed protective/safety \ndevices\n5.   Select right species \nand size of landscape \nplants for replacement  \n5.1  Right species, size and quality of landscape plants to be \nused for re-planting are selected based on instructions or \nin accordance with LMS \n5.2 Species and size of the landscape plants removed from \nsite are considered but other species and sizes are given \nequal consideration depending on the purpose of re-\nplanting or as per instructions\n\n--- PDF PAGE 72 ---\nTR Landscape Installation and Maintenance NC II                                                                             68 \n \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n6.   Conduct re-planting \nactivity  \n6.1  Re-planting activity is done in accordance with LMS or \nas per instructions  \n6.2  Appropriate tools, supplies and equipment and prescribed \nprotective/safety devices are used in the conduct of the \nactivity \n7. Perform post-removal \nand re-planting \nactivities \n7.1 Tools and equipment are cleaned, maintained and stored \nas per instruction of in accordance with LMS \n7.2  Maintenance of clean and safe area is undertaken \nthroughout  and on completion of work \n7.3  Work outputs are recorded and reported to concerned \npersons or authority according to industry practices\n\n--- PDF PAGE 73 ---\nTR Landscape Installation and Maintenance NC II                                                                             69 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Landscape plants   \n \nMay include but are not limited to: \n1.1  Hedges \n1.2  Shrubs \n1.3  Vines \n1.4  Trees \n1.5  Palms \n1.6   Bamboos   \n2.  Landscape plant \nconditions needing \nremoval and \nreplacement \nPlant conditions may be manifested as:  \n2.1  Unhealthy \n2.2  Dying \n2.3  Diseased  \n2.4  Dead \n2.5  Overgrown \n2.6  Aesthetically ugly/eyesore \n2.7  Misplaced  \n2.8  Structurally un-sound \n3.  Size of landscape   \nplants  \nSize of landscape plants to be removed and to be used for \nreplacement may be expressed in terms of but are not limited \nto:  \n3.1  Height \n3.2  Diameter \n3.3  Root ball     \n4.  Quality of the   \nlandscape plants  \nAside from size, quality of landscape plants to be used for re-\nplanting may include but are not limited to: \n4.1 Healthy and vigorous i.e. free from pests and diseases \n4.2  Balanced root/shoot ratio \n4.3  Absence of forking branches in the case of trees \n4.4  Absence of wounds on the branches and stems \n5.  Purpose of removal \nand replacement \nPurpose of removal and replacement may include but not \nlimited to:  \n5.1  Aesthetic considerations \n5.2  Safety and responsibility concerns \n5.3  Environmental and cultural considerations  \n5.4  Economic (maintenance, removal and replacement costs)\n\n--- PDF PAGE 74 ---\nTR Landscape Installation and Maintenance NC II                                                                             70 \n \n \n \nVARIABLE \nRANGE \n6.   Tools and equipment \nincluding supplies \n \n \n \n \n \n6.1 Measurement instruments like diameter tape and meter \ntape \n6.2  Spade \n6.3  Shovel \n6.4  Flat bar \n6.5  Mallet \n6.6  Hammer \n6.7  Supplies: Soil mix, fertilizer, stakes, tree ties, nails\n7.    Protective/safety \ndevices \n \n \n \n \n7.1  Hat/hard hat \n7.2  Overalls \n7.3  Goggles \n7.4  Safety shoes \n7.5  Safety belt/Harness \n7.6  Reflectorized vest (depends on location of work) \n8.    Re-planting activity \n8.1   Basal fertilizer application,  \n8.2   Support and/or protective staking \n8.3 Mulching \n9.   Maintenance of clean \nand safe area \nTasks may include: \n9.1 Keeping public access paths and roads clear of  debris, \nwaste, tools and equipment \n9.2   Disabling tools and equipment after use \n9.3   Using signage and barriers where necessary \n9.4 Removing debris and waste from the work area\n\n--- PDF PAGE 75 ---\nTR Landscape Installation and Maintenance NC II                                                                             71"
