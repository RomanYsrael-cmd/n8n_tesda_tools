        "evidence_guide": {
          "source_text": "1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Determined areas of concern for safety measures\n1.2 Applied appropriate safety measures according to industry\nrequirements\n1.3 Prepared tools, materials and outfit needed\n1.4 Performed proper disposal of used materials\n1.5 Safe kept/cleaned tools, materials and outfit in designated\nfacilities\n2. Underpinning\nKnowledge and\nAttitudes\n\n2.1 Safety Practices\n2.1.1 Implementation of regulatory controls and policies relative\nto treatment of area and application of chemicals\n2.1.2 Proper disposal of waste materials\n2.2\nCodes and Regulations\n2.2.1 Compliance to health program of DOH and DENR\n2.2.2 Hazard identification\n2.2.3 Emergency procedures\n2.3 Tools & Equipment: Uses and Specification\n2.3.1 Masks, gloves, boots, overall coats for health protection\n2.4 Maintenance\n2.4.1\nRegular check-up and repair of tools, materials and outfit\nbefore and after use\n3. Underpinning\nSkills\n3.1 Ability to recognize effective tools, materials and outfit\n3.2 Ready skills required to read labels, manuals and other basic\nsafety information\n4. Method of\nAssessment\n\nCompetency in this unit must be assessed through:\n4.1 Practical demonstration\n4.2 Third Party Report\n5. Resource\nImplications\n5.1 Farm location\n5.2 Tools, equipment and outfits appropriate in applying safety\nmeasures\n6. Context of\nAssessment\n6.1\nAssessment may occur in the workplace or in a simulated\nworkplace or as part of a team under limited supervision\n\n--- PDF PAGE 22 ---\nTR Landscape Installation and Maintenance NC II 18\n\nUNIT OF COMPETENCY :\nUSE FARM AND NURSERY TOOLS AND EQUIPMENT\n\nUNIT CODE :"
        },
        "source_text": "AGR321201\n\nUNIT DESCRIPTOR:\nThis unit covers the knowledge, skills and attitudes required to\nperform safety measures effectively and efficiently. It includes\nidentifying areas, equipment, tools, materials, time and place in\nperforming safety measures.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Determine areas of\nconcern for safety\nmeasures\n1.1\nWork tasks are identified in line with farm operations\n1.2\nPlace for safety measures are determined in line with\nfarm operations\n1.3\nTime for safety measures are determined in line with\nfarm operations\n1.4\nAppropriate equipment, tools, materials and outfits\nare prepared in line with job requirements\n2. Apply appropriate safety\nmeasures\n2.1\nEquipment, tools and materials are used according to\nspecifications and procedures\n2.2\nOutfits are worn according to farm requirements\n2.3\nEffectivity/shelf life/expiration of materials are strictly\nobserved\n2.4\nEmergency procedures are known and followed to\nensure a safework requirement\n2.5\nHazards in the workplace are identified and reported in\nline with farm guidelines\n3.\nSafekeep/dispose tools,\nmaterials and outfit\n3.1\nUsed tools and outfit are cleaned after use and stored in\ndesignated areas\n3.2\nUnused materials are properly labeled and stored\naccording to manufacturers recommendation and farm\nrequirements\n3.3\nWaste materials are disposed according to\nmanufacturers, government and farm requirements\n\n--- PDF PAGE 19 ---\nTR Landscape Installation and Maintenance NC II 15\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1.\nWork tasks\nWork task may be selected from any of the following sectors:\n1.1\nAquaculture\n1.2\nAnimal Production\n1.3\nCrop Production\n1.4\nPost-harvest\n1.5\nHandling and delivery\n1.6\nAgri-marketing\n1.7\nFarm Equipment\n2.\nPlace\n2.1\nAnimal pens, cages, barns\n2.2\nFish ponds, cages\n2.3\nStock room/storage areas/warehouse\n2.4\nField/farm/orchard\n2.5\nGreenhouses\n3.\nTime\n3.1\nVaccination and medication period\n3.2\nseeding, sodding, planting, transplanting, tree-root\ncutting\n3.3\nIrrigation\n3.4\nFertilizer and pesticides application\n3.5\nFeed mixing and feeding\n3.6\nHarvesting and hauling\n3.7\nCleaning, sanitizing and disinfecting\n3.8\nDressing, butchering and castration\n4.\nEmergency procedures\n4.1 Location of first aid kit\n4.2 Evacuation\n4.3 Agencies contact.\n4.4\nFarm emergency procedures\n\n--- PDF PAGE 20 ---\nTR Landscape Installation and Maintenance NC II 16\n\n5.\nEquipment /Tools,\nmaterials and outfits\n5.1\nEquipment / Tools\n5.1.1 Wrenches\n5.1.2 Screw driver\n5.1.3 Pliers\n5.1.4 Shovels\n5.1.5 Picks\n5.1.6 Pruning shears\n5.1.7 Bolos\n5.1.8 Buggies\n5.1.9 Wheelbarrows\n5.1.10 Chainsaws\n5.1.11 Tree Spader\n5.1.12 Forklift\n5.1.13 Crane\n5.1.14 Payloader\n5.1.15 Flatbed Truck\n5.1.16 Tree Root cutters\n\n5.2 Materials\n5.2.1 Bottles\n5.2.2 Plastic\n5.2.3 Bags\n5.2.4 Syringe\n5.2.5 Ropes\n5.2.6 Rubber hoses and nozzles\n\n5.3\nOutfit\n5.3.1 Masks\n5.3.2 Safety harness\n5.3.3 Gloves\n5.3.4 Boots\n5.3.5 Overall coats\n5.3.6 Hard hat / helmet\n5.3.7\nEye goggles\n6.\nWaste materials\n6.1 Animal manure\n6.2 Waste water\n6.3 Syringes\n6.4 Unused farm chemicals e.g. pesticides, chemicals,\nfertilizers\n6.5 Expired reagents\n6.6 Dead animals\n6.7 Dead plants\n6.8 Fallen trees\n6.9 Yard litter\n6.10 Landscape debris\n7.\nHazards\n7.1 Chemical\n7.2 Electrical\n7.3 Falls\n7.4 Floods\n7.5 Gas Explosions\n7.6\nFire\n\n--- PDF PAGE 21 ---\nTR Landscape Installation and Maintenance NC II 17\n\nEVIDENCE GUIDE\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Determined areas of concern for safety measures\n1.2 Applied appropriate safety measures according to industry\nrequirements\n1.3 Prepared tools, materials and outfit needed\n1.4 Performed proper disposal of used materials\n1.5 Safe kept/cleaned tools, materials and outfit in designated\nfacilities\n2. Underpinning\nKnowledge and\nAttitudes\n\n2.1 Safety Practices\n2.1.1 Implementation of regulatory controls and policies relative\nto treatment of area and application of chemicals\n2.1.2 Proper disposal of waste materials\n2.2\nCodes and Regulations\n2.2.1 Compliance to health program of DOH and DENR\n2.2.2 Hazard identification\n2.2.3 Emergency procedures\n2.3 Tools & Equipment: Uses and Specification\n2.3.1 Masks, gloves, boots, overall coats for health protection\n2.4 Maintenance\n2.4.1\nRegular check-up and repair of tools, materials and outfit\nbefore and after use\n3. Underpinning\nSkills\n3.1 Ability to recognize effective tools, materials and outfit\n3.2 Ready skills required to read labels, manuals and other basic\nsafety information\n4. Method of\nAssessment\n\nCompetency in this unit must be assessed through:\n4.1 Practical demonstration\n4.2 Third Party Report\n5. Resource\nImplications\n5.1 Farm location\n5.2 Tools, equipment and outfits appropriate in applying safety\nmeasures\n6. Context of\nAssessment\n6.1\nAssessment may occur in the workplace or in a simulated\nworkplace or as part of a team under limited supervision\n\n--- PDF PAGE 22 ---\nTR Landscape Installation and Maintenance NC II 18\n\nUNIT OF COMPETENCY :\nUSE FARM AND NURSERY TOOLS AND EQUIPMENT\n\nUNIT CODE :"
