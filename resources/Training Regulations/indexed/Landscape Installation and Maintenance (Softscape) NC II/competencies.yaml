          "source_text": "1. Critical Aspects\nof Competency\nAssessment requires evidence that the candidate:\n1.1 Identified and used materials and tools in installing plant\nsupport\n1.2 Installed stakes, guys, props and braces efficiently and\naesthetically acceptable\n1.4 Exhibited safety practices and procedures in installing plant\nsupport\n2. Underpinning\nKnowledge and\nAttitude\n\n2.1 Functions, uses and basic maintenance of tools\n2.2 Different types of plant supports\n2.3 Basic knowledge on arithmetic\n2.4 Values ( Diligence, Time and Cost-consciousness, Hygiene,\nSystematic and Organized)\n3. Underpinning\n Skills\n3.1 Basic carpentry works / plumbing\n3.2 Use of appropriate tools and PPE\n3.3 Communication skills\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1 Garden with newly installed large trees and palms\n4.2 Carpentry tools\n4.3 Materials (G.I. Wires, Cables, Ropes, Stakes, Pegs / Pins, etc.)\n5. Method of\nAssessment\nCompetency may be assessed through:\n5.1 Direct observation with oral questioning\n5.2. Portfolio\n5.3 Interview\n6. Context of\nAssessment\n6.1 Competency may be assessed individually in the actual\n workplace or simulation environment in TESDA\n accredited institutions.\n\n--- PDF PAGE 44 ---\nTR Landscape Installation and Maintenance NC II 40\nUNIT OF COMPETENCY: TRIM AND PRUNE LANDSCAPE PLANTS\nUNIT CODE\n :"
        },
        "source_text": "AGR611375\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes\nrequired to install plant support immediately after planting.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Install stakes or staking\n\n1.1 Materials for staking are selected and prepared in\naccordance with the standard landscape specifications,\ninstructions or detailed drawing\n1.2 Stakes are installed in accordance with the specifications,\ninstructions or detailed drawings\n1.3 Paints are applied to all wooden and other visible parts in\naccordance with the specifications, instructions or detailed\ndrawing\n1.4 Tasks in installing stakes are performed using appropriate\nsafety protective devices and prescribed materials, tools\nand equipment.\n1.5 Area is cleaned and restored as per industry standard\noperating procedures\n\n2. Install plant guys or\nguying\n2.1 Materials for guying are selected and prepared in\naccordance with the standard landscape specifications,\ninstructions or detailed drawing\n2.2. Plant guys are installed in accordance with the\nspecifications, instructions or detailed drawing\n2.3. Warning signs are installed in areas where guys are\nplaced in accordance with specifications, instructions or\ndetailed drawing\n2.4. Tasks in installing plant guys are performed using\nappropriate safety protective devices and prescribed\nmaterials, tools and equipment.\n2.5. Area is cleaned and restored as per industry standard\noperating procedures asks are performed using\n3. Install plant props /\nbraces or proping\nbracing\n3.1 Materials for plant props / braces are selected and\nprepared in accordance with the standard landscape\nspecifications, instructions or detailed drawing\n3.2. Plant props / braces are installed in accordance with the\nspecifications, instructions or detailed drawings\n3.3. Paints are applied to all wooden and other visible parts in\naccordance with the specifications, instructions or\ndetailed drawing\n3.4. Tasks in installing plant props or braces are performed\nusing appropriate safety protective devices and\nprescribed materials, tools and equipment.\n3.5. Area is cleaned and restored as per industry standard\noperating procedures\n\n--- PDF PAGE 42 ---\nTR Landscape Installation and Maintenance NC II 38\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Materials for staking\nMay include but not limited to:\n1.1 Wooden tree stakes\n1.2 Bamboo stakes\n1.3 Stake ponder\n1.4 Garden hose\n1.5 Coated wire, plant tie or used nylon stocking\n2. Materials for guying\nMay include but not limited to :\n2.1 Guying anchor / duck-billed soil anchor\n2.2 Reinforcing rod\n2.3 Wires / ropes / metal cables\n2.4 Garden hose\n3. Materials for plant\nprops / braces\n\nMay include but not limited to:\n3.1 Metal plant props\n3.2 Wood / floor board\n3.3 Screws\n3.4 Metal braces / Grid plant brace\n\n--- PDF PAGE 43 ---\nTR Landscape Installation and Maintenance NC II 39\nEVIDENCE GUIDE\n\n1. Critical Aspects\nof Competency\nAssessment requires evidence that the candidate:\n1.1 Identified and used materials and tools in installing plant\nsupport\n1.2 Installed stakes, guys, props and braces efficiently and\naesthetically acceptable\n1.4 Exhibited safety practices and procedures in installing plant\nsupport\n2. Underpinning\nKnowledge and\nAttitude\n\n2.1 Functions, uses and basic maintenance of tools\n2.2 Different types of plant supports\n2.3 Basic knowledge on arithmetic\n2.4 Values ( Diligence, Time and Cost-consciousness, Hygiene,\nSystematic and Organized)\n3. Underpinning\n Skills\n3.1 Basic carpentry works / plumbing\n3.2 Use of appropriate tools and PPE\n3.3 Communication skills\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1 Garden with newly installed large trees and palms\n4.2 Carpentry tools\n4.3 Materials (G.I. Wires, Cables, Ropes, Stakes, Pegs / Pins, etc.)\n5. Method of\nAssessment\nCompetency may be assessed through:\n5.1 Direct observation with oral questioning\n5.2. Portfolio\n5.3 Interview\n6. Context of\nAssessment\n6.1 Competency may be assessed individually in the actual\n workplace or simulation environment in TESDA\n accredited institutions.\n\n--- PDF PAGE 44 ---\nTR Landscape Installation and Maintenance NC II 40\nUNIT OF COMPETENCY: TRIM AND PRUNE LANDSCAPE PLANTS\nUNIT CODE\n :"
