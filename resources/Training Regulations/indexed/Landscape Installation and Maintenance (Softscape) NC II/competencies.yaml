          "source_text": "1.   Identify trimming and \npruning requirements \n \n1.1  Landscape plants and their parts that are in  need   of \ntrimming and pruning are distinguished according to landscape \nmaintenance standards (LMS) \n1.2  Purpose and method of pruning are determined according to \nLMS \n1.3  Utility services are located using site plans and in consultation \nwith concerned persons or authority \n1.4  Access to the site is determined in consultation with concerned \npersons or authority \n1.5  Occupational Health and Safety (OHS) hazards are identified, \nrisks assessed and reported to concerned persons or authority \n2.   Prepare for trimming \nand pruning operations \n2.1 Tools, supplies and equipment are prepared in accordance \nwith the work requirements \n2.2  Pre-operational and safety checks are carried out on tools and \nequipment according to manufacturer’s specifications and \nindustry work practices \n2.3  Prescribed safety and personal protective equipment (PPE) \nis selected, used and maintained  \n3.   Perform trimming and \npruning  \n3.1  Safety and warning devices are installed around the site \nduring and between work periods \n3.2  Landscape plants are trimmed and pruned in accordance with \nwork program and LMS \n3.3 Trimming and pruning of landscape plants are done using \nprescribed tools and equipment \n3.4  Sterilizing agent/compound are applied on pruning wounds in \naccordance with LMS \n3.4 Tasks are conducted using appropriate PPE  \n4.    Perform post-trimming \nand pruning activities \n4.1 Trimming and pruning wastes are collected and disposed \nfrom the site in accordance with environmental standards and \nLMS \n4.2  Recommended manual handling techniques are used when \nlifting or moving heavy loads \n4.3  Tools and equipment are cleaned, maintained and stored \naccording to LMS \n4.4  Maintenance of clean and safe area is undertaken throughout  \nand on completion of work \n4.5  Work outputs are recorded or reported to concerned persons or \nauthority according to industry practices\n\n--- PDF PAGE 45 ---\nTR Landscape Installation and Maintenance NC II                                                                             41 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.  Landscape plants \n1.1  Shrubs and hedges \n1.2  Vines \n1.3  Palms \n1.4  Bamboos \n1.5  Trees \n2.  Purpose \nMay include: \n2.1  Create and maintain form and shape of landscape  plant \n2.2  Promote health \n2.3  Direct or control growth \n2.4  Encourage flowering and fruiting \n2.5  Remove/minimize risk/hazard \n3.  Utility services \n \n3.5 Aboveground utilities \n3.1.1 Electrical and communication lines \n3.1.2 Cable/TV lines \n3.6 Underground utilities \n3.2.1 Irrigation and domestic water distribution lines  \n3.2.2 Electrical and communication lines \n3.2.3 Cable/TV lines \n3.2.4 Drainages and sewerages \n4.  Concerned persons \nor authority \n4.1  Supervisor \n4.2  Property management officer  \n4.3  Home owner \n4.4  Inspector \n5.  Hazards \n \n \n \n \n \n \n \nMay include but are not limited to: \n5.1 Disturbance or interruption of services \n5.2 Solar radiation \n5.3 Pollutants (e.g. gaseous, suspended particulate matters) \n5.4 Noise \n5.5 Manual handling of moving powered equipment or parts, \nsharp tools and materials \n5.6 Uneven landforms/surfaces \n5.7 Flying and falling objects\n6.  Risks \nMay include but are not limited to: \n6.1 Risk to co-workers, equipment, other people and animals \nexternal to the workplace (e.g. members of the public, stray \npets and wildlife) \n6.2 Risk to natural environment\n\n--- PDF PAGE 46 ---\nTR Landscape Installation and Maintenance NC II                                                                             42 \n \n \nVARIABLE \nRANGE \n7.  Tools, supplies and \nequipment \nMay include but are not limited to: \n7.1 Hedge trimmers (HT): Power and manual \n7.2 Shears:  Pruning, loping \n7.3 Saws:  Pruning saws, chain saws, bow saws \n7.4 Pole/Tree pruner \n7.5 Telescopic shaft/high branch pruning chain saws \n7.6 Ladder/adjustable ladder \n7.7 Basket type boom/cherry picker \n7.8 Sterilizing agent/pruning compound\n8.  Safety and PPE \n8.1  Early warning devices \n8.2  Overall \n8.3  Gloves \n8.4  Goggles \n8.5  Ear muff/plugs \n8.6  Gas mask \n8.7  Safety belt/harness \n8.8  Climbing ropes/gadgets \n8.9  Hard hat \n8.10 Shoes/safety shoes \n8.11 Reflectorized vest (depends on location of work)\n9.  Early warning \ndevices \nMay include but are not limited to: \n9.1 Traffic cones \n9.2 Warning tapes \n9.3 Warning signage\n10.  Sterilizing agent/ \ncompound \n10.1  Coal tar \n10.2  Bituminous pruning compound \n10.3  Latex Paint with fungicide \n10.4  Fungicide \n11.  Trimming and \npruning wastes \n \n11.1 Tops or shoots \n11.2 Branches \n11.3 Twigs \n11.4 Leaves \n11.5 Flowers and fruits\n12.  Maintenance of \nclean and safe area \nTasks may include: \n12.1 Keeping public access paths and roads clear of debris, \nwaste, tools and equipment \n12.2 Disabling tools and equipment after use \n12.3 Using signage and barriers where necessary \n12.4 Removing debris and waste from the work area\n\n--- PDF PAGE 47 ---\nTR Landscape Installation and Maintenance NC II                                                                             43"
