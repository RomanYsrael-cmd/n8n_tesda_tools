        "evidence_guide": {
          "source_text": "1. Critical Aspects\nof Competency\nAssessment requires evidence that the candidate:\n1.1 Determined requirements for the prevention and control of pests\nand diseases\n1.2 Prepared for the application of pest and disease prevention\n and control\n1.3 Applied pest and disease prevention and control measures\n1.4 Conducted post-pest and disease prevention and control\n operations\n1.5 Performed tasks using appropriate tools, equipment and\nsafety/protective devices\n2. Underpinning\nKnowledge and\nAttitude\n\n2.1 Types of landscape plants, their conditions and stage of growth\n2.2 General classification of pests and diseases, life cycle and mode\nof attack\n2.3 Procedures and techniques in prevention and control of pests\nand diseases\n2.4 Functions, uses and maintenance of tools and equipment\n2.5 Values:\n 2.5.1 Diligence\n 2.5.2 Time consciousness\n 2.5.3 Cost consciousness\n 2.5.4 Hygiene consciousness\n 2.5.5 Persistence\n 2.5.6 Systematic and organized\n3. Underpinning\n Skills\n3.1 Use of appropriate tools and equipment and prescribed\nprotective/safety devices in the prevention and control of pests\nand diseases\n3.2 Communication skills in receiving instructions and in rendering\nsimple written and even oral reports\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1 Landscape area/landscape plants\n4.2 Tools, equipment, supplies and materials and protective/safety\ndevices\n4.3 Instructions or guidelines\n5. Method of\nAssessment\nCompetency may be assessed through:\n5.1 Direct Observation with Oral Questioning\n5.2 Interview\n5.3 Portfolio\n6. Context of\nAssessment\n6.1 Competency may be assessed individually in the actual\nworkplace or simulation environment in TESDA accredited\ninstitutions.\n\n--- PDF PAGE 65 ---\nTR Landscape Installation and Maintenance NC II 61\nUNIIT OF COMPETENCY: PROVIDE PLANT SUPPORT\nUNIT CODE\n :"
        },
        "source_text": "AGR611380\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes required to\ndetermine types of pests and diseases and their prevention and\ncontrol measures\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Determine\nrequirements of\npreventing and\ncontrolling plant pests\nand diseases\n1.1 Infested and diseased landscape plants are determined\nbased on plant conditions, symptoms and signs and\nother manifestation of infestation and infection\n1.2 Pests and diseases are identified and classified using\ngeneral classification guidelines\n1.3 Life cycle or various life stages of pests from eggs,\nlarvae, pupa and adult and their mode of attack or\ninfestation are known\n1.4 Life cycle or various life stages and signs and symptoms\nof plant diseases and their mode of attack are known\n1.5 Access to the site is determined in consultation with\n concerned persons or authority\n1.6 Occupational Health and Safety (OHS) hazards are\nidentified, risks assessed and reported to concerned\npersons or authority\n2. Prepare for application\nof pests and disease\nprevention and control\nmeasures\n\n2.1 Method of prevention and control is determined based\non types of pests and diseases, their mode of attack and\nextent of infestation and infection\n2.2 Tools, equipment, supplies and materials relevant to the\nmethod of prevention and control are prepared\n2.3 Prescribed safety and personal protective equipment\n(PPE) is selected in accordance with work requirements\n3. Apply pest and\ndisease prevention\nand control measures\n3.1 Manual and biological method of prevention and control of\npest and disease are applied whenever applicable\n3.2 In case of using chemical and bio-pesticides, the\nfrequency and dosage of application is determined based\non types of pests and diseases and extent of attack and in\naccordance with LMS or manufacturer’s recommendation\n3.3 Pest and disease prevention and control measures are\napplied in accordance with to OHS requirements and\nFertilizer and Pesticide Authority (FPA) guidelines\n3.4 Task is performed using prescribed tools, supplies and\nappropriate protective/safety devices\n4. Perform post-\nprevention and control\nmeasures\n4.1 Tools and equipment are cleaned, maintained and\nstored according to LMS\n4.2 Maintenance of clean and safe area is undertaken\nthroughout and on completion of work\n4.3 Work outputs are recorded and reported to concerned\npersons or authority according to industry practices\n\n--- PDF PAGE 62 ---\nTR Landscape Installation and Maintenance NC II 58\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Landscape plants\n\n1.1 Shrubs and hedges\n1.2 Vines\n1.3 Palms\n1.4 Bamboos\n1.5 Trees\n2. Plant conditions\n2.1 Age/Stage of growth\n2.2 Healthy and vigorous\n2.3 Diseased/infected:\n2.4 Infested\n3. Symptoms, signs and\nother manifestations\ndiseases\nMay include but are not limited to:\n3.1 Diseases\n3.1 Leaf spots\n3.2 Anthracnose\n3.3 Fruiting bodies\n3.4 Presence of hyphae\n3.5 Pests\n 3.5.1 Gall on leaves, stems, branches\n 3.5.2 Skeletonized, browsed/chewed leaves\n 3.5.3 Withering, die back etc\n4. Pests and diseases\n4.1 Pests\n4.1.1 Insect pests: Chewing, Sucking, Girdling/\n Boring, etc.\n 4.1.2 Termites\n 4.1.3 Nematodes\n4.2 Diseases\n 4.2.1 Parasitic fungus\n 4.2.2 Bacteria\n 4.2.3 Viruses\n 5. Methods of prevention\nand control\n\n5.1 Prevention\n 5.1.1 Species/individual (genetically superior) selection\n 5.1.2 Pest and disease free\n 5.1.3 Cultural management\n 5.1.4 Sanitation\n5.2 Control\n5.3 Manual/mechanical\n5.4 Chemical (systemic, broad spectrum, contact)\n5.5 Biological- (insects, microorganisms)\n5.6 Bio-pesticides\n\n--- PDF PAGE 63 ---\nTR Landscape Installation and Maintenance NC II 59\n\nVARIABLE\nRANGE\n6. Tools, supplies and\nequipment\n\n6.1 Backpack sprayer\n6.2 Boom sprayer\n6.3 Soil drencher\n6.4 Pruning shears,\n6.5 Pruning saws\n7. Protective/safety\ngadgets\n\n7.1 Overalls, gloves\n7.2 Gas mask\n7.3 Goggles\n7.4 Reflectorized vest ( depends on location of work)\n8. Maintenance of clean\nand safe area\nTasks may include:\n8.1 Keeping public access paths and roads clear of debris,\nwaste, tools and equipment\n8.2 Disabling tools and equipment after use\n8.3 Using signage and barriers where necessary\n8.4 Removing debris and waste from the work area\n\n--- PDF PAGE 64 ---\nTR Landscape Installation and Maintenance NC II 60\n\nEVIDENCE GUIDE\n\n1. Critical Aspects\nof Competency\nAssessment requires evidence that the candidate:\n1.1 Determined requirements for the prevention and control of pests\nand diseases\n1.2 Prepared for the application of pest and disease prevention\n and control\n1.3 Applied pest and disease prevention and control measures\n1.4 Conducted post-pest and disease prevention and control\n operations\n1.5 Performed tasks using appropriate tools, equipment and\nsafety/protective devices\n2. Underpinning\nKnowledge and\nAttitude\n\n2.1 Types of landscape plants, their conditions and stage of growth\n2.2 General classification of pests and diseases, life cycle and mode\nof attack\n2.3 Procedures and techniques in prevention and control of pests\nand diseases\n2.4 Functions, uses and maintenance of tools and equipment\n2.5 Values:\n 2.5.1 Diligence\n 2.5.2 Time consciousness\n 2.5.3 Cost consciousness\n 2.5.4 Hygiene consciousness\n 2.5.5 Persistence\n 2.5.6 Systematic and organized\n3. Underpinning\n Skills\n3.1 Use of appropriate tools and equipment and prescribed\nprotective/safety devices in the prevention and control of pests\nand diseases\n3.2 Communication skills in receiving instructions and in rendering\nsimple written and even oral reports\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1 Landscape area/landscape plants\n4.2 Tools, equipment, supplies and materials and protective/safety\ndevices\n4.3 Instructions or guidelines\n5. Method of\nAssessment\nCompetency may be assessed through:\n5.1 Direct Observation with Oral Questioning\n5.2 Interview\n5.3 Portfolio\n6. Context of\nAssessment\n6.1 Competency may be assessed individually in the actual\nworkplace or simulation environment in TESDA accredited\ninstitutions.\n\n--- PDF PAGE 65 ---\nTR Landscape Installation and Maintenance NC II 61\nUNIIT OF COMPETENCY: PROVIDE PLANT SUPPORT\nUNIT CODE\n :"
