        "source_text": "AGR321202\n\nUNIT DESCRIPTOR :\nThis unit covers the knowledge, skills and attitudes required\nto use farm and nursery tools and equipment. It includes\nselection, operation and preventive maintenance of farm and\nnursery tools and equipment.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1.\nSelect and use farm tools\n\n1.1\nIdentified appropriate farm tools according to\nrequirement/use\n1.2\nFarm tools are checked for faults and defective tools\nreported in accordance with farm procedures\n1.3\nAppropriate tools and equipment are safely used\naccording to job requirements and manufacturers\nconditions\n2.\nSelect and operate farm\nequipment\n2.1\nIdentify appropriate farm and nursery equipment\n2.2\nInstructional manual of the farm tools and equipment are\ncarefully read prior to operation\n2.3\nPre-operation check-up is conducted in line with\nmanufacturers manual\n2.4\nFaults in farm equipment are identified and reported in\nline with farm procedures\n2.5\nFarm equipment used according to its function\n2.6\nFollowed safety procedures\n3.\nPerform preventive\nmaintenance\n3.1\nTools and equipment are cleaned immediately after use\nin line with farm procedures\n3.2\nRoutine check-up and maintenance are performed\n3.3\nTools and equipment are stored in designated areas in\nline with farm procedures\n\n--- PDF PAGE 23 ---\nTR Landscape Installation and Maintenance NC II 19\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Farm and nursery\nequipment\n\n1.1.\nEngine\n1.2.\nPumps\n1.3.\nGenerators\n1.4.\nSprayers\n1.5.\nTree Spader\n1.6.\nForklift\n1.7.\nCrane\n1.8.\nPayloader\n1.9.\nFlatbed Truck\n1.10. Tree Root cutters\n1.11. Irrigation System\n2. Farm and nursery tools\n2.1\nSickle\n2.2\nCutters\n2.3\nWeighing scales\n2.4\nHand tools\n2.5\nMeasuring tools\n2.6\nGarden tools\n2.7\nShovels\n2.8\nPicks\n2.9\nPruning shears\n2.10\nWheelbarrows\n2.11\nBuggies\n2.12\nRubber hoses and nozzles\n2.13\nChainsaws\n2.14\nBolos\n3. Pre-operation check-up\n3.1\nTires\n3.2\nBrake fluid\n3.3\nFuel\n3.4\nWater\n3.5\nOil\n3.6\nLubricants\n3.7\nBattery\n\n--- PDF PAGE 24 ---\nTR Landscape Installation and Maintenance NC II 20\n\nEVIDENCE GUIDE\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Correctly identified appropriate farm and nursery tools and\nequipment\n1.2 Operated farm and nursery equipment according to manual\nspecification\n1.3\nPerformed preventive maintenance\n2. Underpinning\nKnowledge and\nAttitudes\n\n2.1 Safety Practices\n2.1.1 Ideal good work habits to demonstrate to workers easy\nand safety standards during operation of farm equipment\n2.2\nCodes and Regulations\n2.2.1 Environmental Compliance Certificate (ECG)\n2.2.2 Effective work supervision in the operations of farm\nequipment\n2.3 Tools & Equipment: Uses and Specification\n2.3.1 Knowledge in calibrating and use of equipment\n2.3.2 Safety keeping of equipments every after use\n2.4 Maintenance\n2.4.1 Regular upkeep of equipments\n2.4.2 Preventive maintenance skills\n2.5 Values\n2.5.1 Positive outlook towards work\n2.5.2\nPossesses pre-emptive/anticipatory skills\n3.\nUnderpinning\nSkills\n3.1\nAbility to recognized defective farm equipment\n3.2\nPerform proper management practices of safety measures\n4.\nMethod of\nAssessment\n\nCompetency in this unit must be assessed through:\n4.1\nDirect observation\n4.2\nPractical demonstration\n4.3\nThird Party Report\n5.\nResource\nImplications\n5.1\nService/operational manual of farm tools and equipment\n5.2\nTools and equipment\n5.3\nFarm and nursery implements\n6.\nContext of\nAssessment\n6.1\nAssessment may occur in the workplace or in a simulated\nworkplace or as part of a team under limited supervision\n\n--- PDF PAGE 25 ---\nTR Landscape Installation and Maintenance NC II 21\nUNIT OF COMPETENCY :\nPERFORM ESTIMATION AND BASIC CALCULATION\n\nUNIT CODE :"
