d areas \n4.2 Supplies and materials needed for replanting like soil mixture, \nfertilizer, support materials, mulches, etc \n4.3 Tools and equipment essential in removal and replacement of \nlandscape plant \n4.4  Protective/safety devices\n\n--- PDF PAGE 76 ---\nTR Landscape Installation and Maintenance NC II                                                                             72 \n \n \n \n5. Method of \nAssessment \nCompetency may be assessed through: \n5.1  Direct Observation with Oral Questioning \n5.2  Interview \n5.3 Portfolio   \n6.   Context of \nAssessment \n6.1  Competency may be assessed individually in the actual \nworkplace or simulation environment in TESDA accredited \ninstitutions.\n",
