a is undertaken\nthroughout and on completion of work\n3.3 Work output is reported to concerned person or\nauthority according to industry practices\n\n--- PDF PAGE 29 ---\nTR Landscape Installation and Maintenance NC II 25\n RANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Unwanted\nvegetation and\ndebris\nMay include but are not limited to:\n1.1 Grasses\n1.2 Shrubs trees and tree stumps\n1.3 Stones\n1.4 Construction debris\n 2. Safety protective\ndevices\n\nMay include but are not limited to:\n2.1 Ear mask\n2.2 Goggles\n2.3 Gloves\n2.4 Hard hat\n2.5 Safety belts/harness\n2.6 Safety shoes\n2.7 Rain Boots\n2.8 Safety apron\n2.9 Reflectorized vest\n\n--- PDF PAGE 30 ---\nTR Landscape Installation and Maintenance NC II 26\n EVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Cleared site of unwanted materials and debris\n1.2 Disposed wastes\n1.3 Used appropriate tools, equipment and PPE\n1.4 Cleaned, maintained and stored tools and equipment\n1.5 Maintained and cleaned work are\n1.6 Observed OHS practices\n2. Underpinning\nKnowledge\n\n2.1 Functions and uses of tools, equipment and PPE\n2.2 Procedures and techniques in site clearing\n2.3 Basic Plan Reading\n2.4 Knowledge on debris recyclable materials\n3. Underpinning skills\n3.1 Using of tools, equipment and PPE\n3.2 Communication skills\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1 Tools, equipment and PPE\n4.2 Site identified for the activity\n4.3 Designed Plan / Instructions (Oral or Written)\n5. Method of\nAssessment\nCompetency may be assessed through:\n5.1 Direct Observation with Oral Questioning\n5.3 Interview\n5.4 Portfolio\n6. Context of\nAssessment\n6.1 Competency may be assessed individually in the actual\nworkplace or simulation environment in TESDA accredited\ninstitutions.\n\n--- PDF PAGE 31 ---\nTR Landscape Installation and Maintenance NC II 27\n\nUNIIT OF COMPETENCY: PERFORM ROUGH GRADING OPERATIONS\nUNIT CODE\n:\n AGR611372\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes required to\nperform rough grading operations for drainage and erosion\ncontrol.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Rough grade site\n1.1 Rough site grading is performed to achieve desired\nelevations or slopes by cut or fill in accordance with the\ndesigned grading plans, specifications or instructions.\n1.2 Site is graded roughly using prescribed tools and\nequipment in accordance with standards of rough\ngrading practice.\n1.3 Task is performed using appropriate personal\nprotective equipment (PPE)\n2. Provide surface\ndrainage and shape or\nform the land\n\n2.1 Site is graded to drain surface water and to shape the\nland in accordance with the designed grading plans\nand instructions\n2.2 Tasks is performed using prescribed tools, equipment\nand personal protective equipment (PPE)\n3. Perform post-rough\ngrading operations\n3.1 Newly graded site is protected against human, animal\nand mechanical disturbance, and other potential\nhazards like inclement weather\n3.2 Site grading tools and equipment are cleaned,\nmaintained and stored according to established\nstandard practices\n3.3 Maintenance of clean and safe area is undertaken\nthroughout and upon completion of work\n3.4 Work output is reported to concerned person or\nauthority according to industry practices\n\n--- PDF PAGE 32 ---\nTR Landscape Installation and Maintenance NC II 28\n RANGE OF VARIABLES\n\nVARIABLE\nRANGE\n 1. Personal Protective\nEquipment (PPE)\n\nMay include but are not limited to:\n1.1. Goggles\n1.2. Gloves\n1.3. Safety belts, shoes, etc.\n1.4. Reflectorized vest\n2 Site Grading tools\n2.1 Picks\n2.2 Shovels\n2.3 Leveling tools\n2.4 Compass\n2.5 Distance Measuring tools, nylon wires, stakes\n2.6 Wheelbarrows, buggies, rubber hoses, etc\n2.7\nGround labeling tools\n\n--- PDF PAGE 33 ---\nTR Landscape Installation and Maintenance NC II 29\n\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Rough graded site to designed elevations or slopes\n1.2 Provided surface drainage and shape or formed the land\n1.3 Performed tasks using prescribed tool, equipment and\nappropriate personal protective equipment (PPE)\n1.4 Cleaned, maintained and stored tools and equipment\n1.5 Cleaned and maintained work area\n1.6 Observed OHS practices\n2. Underpinning\nKnowledge and\nAttitude\n\n2.1 Functions and uses of tools\n2.2 Basic arithmetic\n2.3 Concept of time\n2.4 First-aid treatment for minor injuries\n\n3. Underpinning Skills\n3.1 Using hand tools\n3.2 Basic communication skills\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1 Actual area for the activity\n4.2 Tools and materials related to tasks to be performed\n4.3 Designed Plan / Instructions (Oral or written)\n\n5. Method of\nAssessment\nCompetency may be assessed through:\n5.1 Direct Observation with Oral Questioning\n5.2 Interview\n5.3 Portfolio\n6. Context of\nAssessment\n6.1\nCompetency may be assessed individually in the actual\nworkplace or simulation environment in TESDA accredited\ninstitutions.\n\n--- PDF PAGE 34 ---\nTR Landscape Installation and Maintenance NC II 30\nUNIT OF COMPETENCY: PERFORM SITE PREPARATION ACTIVITIES\nUNIT CODE\n: AGR611373\nUNIT DESCRIPTOR\n: This unit covers the knowledge, skills and attitudes\n required to perform site preparation activities for landscape\n construction.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Cultivate land\n1.1 Cultivate/till/dig land is performed in accordance with\nthe designed plans, specifications or instructions.\n1.2 Land is cultivated using prescribed tools and\nequipment\n1.3 Tasks are performed using appropriate personal\nprotective equipment (PPE)\n2. Remove construction\ndebris and other\nmaterials\n\n2.1 Construction debris and other materials are gathered\nand removed from site in accordance with the designed\nplans, specifications or instructions.\n2.2 Gathered construction debris are disposed at\ndesignated area\n2.3 Tasks are performed using prescribed tools, equipment\nand safety protective devices\n3. Add amended soil/soil\nmix to cultivated land\n\n3.1 Add/incorporate amended soil/soil mix to cultivated\nland in accordance with ANSI as well as standard\ngeneral nursery specifications or instructions\n3.2 Tasks are performed using prescribed tools and\nequipment and appropriate safety protective devices\n4. Fine grade and compact\ncultivated land\n4.1 Cultivated land is fine graded and compacted in\naccordance with the design specifications as well as\nstandard general grading and compaction\nspecifications or instructions.\n4.2 Pre-planting watering is performed as instructed\n4.3 Tasks are performed using prescribed tools, equipment\nand appropriate safety protective devices\n5. Perform post-land\npreparation activities\n5.1 Tools and equipment are cleaned, maintained and\nstored according to established standard practices\n5.2 Maintenance of clean and safe area is undertaken\nthroughout and on completion of work\n5.3 Work output is reported to concerned person or\nauthority according to industry practices\n\n--- PDF PAGE 35 ---\nTR Landscape Installation and Maintenance NC II 31\n\n RANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Personal Protective\nEquipment\nMay include but are not limited to:\n1.1 Goggles\n1.2 Gloves\n1.3 Hard hat\n1.4 Safety shoes\n1.5 Reflectorized vest\n 2. Construction debris\n\nMay include but are not limited to:\n2.1 Cement, metals, gravel, etc.\n2.2 Stones/rocks, hard fan, adobe, etc.\n2.3 Tree stumps\n2.4 Broken bottles, glass, etc.\n2.5 Garbage\n3. Compacted\n\nSoil is compacted by means of:\n3.1 Water compaction (Pre-planting watering)\n3.2 Roller (Manual or machine operated)\n3.3 Tamper or mechanical compactor\n\n--- PDF PAGE 36 ---\nTR Landscape Installation and Maintenance NC II 32\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Cultivated land\n1.2 Removed construction debris and materials\n1.3 Added amended soil/mixed soil to cultivate land\n1.4 Fine graded and compacted cultivated land\n1.5 Performed tasks using prescribed tools, equipment and\nappropriate personal protective equipment (PPE)\n1.6 Cleaned, maintained and stored tools and equipment\n1.7 Cleaned and maintained work area\n1.6 Observed OHS practices\n2. Underpinning\nKnowledge and\nAttitude\n\n2.1 Functions and uses of tools and equipment\n2.2 Familiarity with materials used\n2.3 Basic arithmetic\n2.4 Concept of time\n2.5 First-aid treatment for minor injuries\n3. Underpinning Skills\n3.1 Using of handtools and measuring instruments\n3.2 Performing land leveling\n3.3 Basic communication skills\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1 Actual area for the activity\n4.2 Tools, materials and equipment related to tasks to be\nperformed\n4.3 Instructions (Oral or written)\n5. Method of\nAssessment\nCompetency may be assessed through:\n5.1 Direct Observation with Oral Questioning\n5.2 Interview\n5.3 Portfolio\n6. Context of\nAssessment\n6.1.\nCompetency may be assessed individually in the actual\nworkplace or simulation environment in TESDA accredited\ninstitutions.\n\n--- PDF PAGE 37 ---\nTR Landscape Installation and Maintenance NC II 33\nUNIT OF COMPETENCY: INSTALL PLANTS AT DESIGNATED LOCATIONS AS\n DESIGNED\nUNIT CODE\n : AGR611374\nUNIT DESCRIPTOR\n :\nThis unit covers the knowledge, skills and attitudes required\nto perform installing plants at designated locations as shown\nin the planting plan or as specified.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Inspect plants\n1.1 Only specified species, variety, quality, size, etc. shall\nbe delivered in accordance with the planting plan and\nplant list\n1.2 Delivered plants are inspected in accordance with the\nplant list or planting plan\n1.3 Rejected plants delivered shall be removed from the\nsite immediately after inspection\n2. Lay-out or stake out\nplant\n\n2.1 Exact location of the plants is marked on the ground in\naccordance with the planting plan, specifications and/or\ninstructions\n2.2 Appropriate plants is distributed and marked on the\nground as indicated in the planting plan or in\naccordance with instructions\n3. Excavate hole/pit\n(Excluding lawn\ngrass/turf, aquatic\nplants, orchids, etc.)\n3.1 Excavate/dig hole/pit at designated mark in\naccordance with specifications or instructions\n3.2 Tasks are performed using prescribed tools, equipment\nand appropriate personal protective equipment\n(PPE)\n4. Install plants (Excluding\nlarge trees with 15cm or\nmore trunk height, lawn\ngrass/turf, aquatic\nplants, orchids, etc.)\n4.1 Plants are removed from container according to\nprescribed instructions and techniques\n4.2 Extra long primary roots are cut and not wound around\nthe root ball\n4.3 Pre-planting watering of excavated holes is performed\n(thoroughly saturated) according to accepted standard\ntechniques and procedures\n4.4 Plant is installed in accordance with landscape\nspecifications and standards, detailed drawings and\ninstructions\n4.5 Plants are set so that the soil level of plant in container\nshall be the same as the finish grade of the hole\n4.6 Plants are handled to avoid breakage of root ball,\ntrunk/stem, branches and scraping of bark\n4.7 Plants are set plumb and held in position until sufficient\nsoil has been firmly placed around and under the root\nball\n4.8 Lightly tamp the soil around the base of the plant to\neliminate air pockets and to hold the plant firmly and\nplumb to the soil\n\n--- PDF PAGE 38 ---\nTR Landscape Installation and Maintenance NC II 34\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n5. Apply fertilizer\n5.1 Fertilizers are selected in conformity with the\nmanufacturer’s guaranteed analysis, labels or as\nspecified\n5.2 Fertilizers and/or rooting hormones are applied to newly\ninstalled plants in accordance with the standard\nlandscaping specifications or instructions\n5.3 Fertilizers are applied to large trees and palms, when\nthe planting hole/pit is half-filled with amended soil in\naccordance with the instructions\n5.4 Tasks are performed using prescribed tools, equipment\nand appropriate personal protective equipment (PPE)\n6. Water plants\n6.1 Watering basin / bern is made around each plant and in\naccordance with instructions or specifications\n6.2 Watering is performed after planting to thoroughly wet\nthe root ball and surrounding ground in accordance with\nstandard watering techniques\n6.3 Tasks are performed using prescribed tools, equipment\nand appropriate personal protective equipment (PPE)\n7. Apply / Install mulch\n7.1 Materials for mulching is selected and prepared in\naccordance with the standard landscape specifications,\ninstructions or detailed drawing\n7.2. Area / ground where mulch will be applied is prepared\nin accordance with the specifications, instructions or\ndetailed drawing\n7.3. Mulch is applied in accordance with the specifications,\ninstructions or detailed drawing\n7.4. Tasks are performed using prescribed materials and\ntools and equipment\n7.5. Tasks are performed using appropriate safety\nprotective safety protective devices\n7.6. Area is restored and cleaned as per standard operating\nprocedures\n8. Perform post-landscape\ninstallation activities\n8.1 Tools and equipment are cleaned, maintained and\nstored according to established standard practices\n8.2 Maintenance of clean and safe area is undertaken\nthroughout and on completion of work\n8.3 Work output is reported to concerned person or\nauthority according to industry practices\n\n--- PDF PAGE 39 ---\nTR Landscape Installation and Maintenance NC II 35\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n 1. Plants\n\nCommonly classified plants in landscaping may include but are\nnot limited to:\n1.1 Lawn grass and turf (excluding specialized golf course\ngrass)\n1.2 Groundcover and vines\n1.3 Shrubs, herbs, small palms, annuals, etc.\n1.4 Trees, large palms, large bamboo, etc.\n1.5 Aquatic plants, orchids, ferns, etc.\n1.6 Succulents\n2. Inspected\nPlant inspected may include but are not limited to:\n2.1 Species\n2.2 Variety\n2.3 Number\n2.4 Size\n2.5 Plant condition\n3. Mark\n\n3.1 Spray paint (red or orange color preferred)\n3.2 Bamboo/wood sticks/stakes\n3.3 Lime dust\n3.4 Specified plants directly as marker\n4. Personal Protective\nEquipment (PPE)\nMay include but are not limited to:\n4.1 Gloves\n4.2 Gas mask\n4.3 Hard hat\n4.4 Safety belts/harness\n4.5 Safety shoes\n4.6 Safety apron\n4.7 Rain boots\n4.8 Reflectorized vest\n5. Fertilizers\n5.1 Fertilizers forms\n5.1.1 Soluble crystals\n5.1.2 Dray granules\n5.1.3 Organic fish meal\n5.1.4 Controlled (slow) – release pellets\n5.2 Fertilizers types\n5.2.1 Organic\n5.2.2 Chemical\n6. Watering\n6.1 By hand (manually) using rubber/plastic hose attached to a\nhose bibb or faucet or quick coupling valve as spice of\nwater from the main supply\n6.2 By irrigation system operated manually or automatically by\ncontroller\n6.3 Water tank truck as source of water supply provided with\ndispenser connected to a hose directly or water is collected\nin containers (sprinkler, pail, etc.) to water the plants\n7. Mulch\n7.1. Shreaded bark / branch\n7.2. Straw or equal\n7.3 Gravel /stone / brick chips\n7.4. Coconut husk chips\n7.5. Plastic sheet or Jute mesh\n\n--- PDF PAGE 40 ---\nTR Landscape Installation and Maintenance NC II 36\n\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Inspected plants\n1.2 Laid-out or stake-out plants\n1.3 Excavated hole/pit at designated marks\n1.4 Installed plants\n1.5 Applied fertilizers\n1.6 Watered plants\n1.7 Performed tasks using prescribed tools, equipment and\npersonal protective equipment (PPE)\n1.8 Cleaned, maintained and stored tools and equipment\n1.9 Cleaned and maintained work area\n1.10 Observed OHS practices\n2. Underpinning\nKnowledge and\nAttitude\n\n2.1 Basic Plan Reading\n2.2 Functions of tools, materials and equipment\n2.3 Familiarity with plants (i.e. name, parts, handling and care)\n2.4 Basic arithmetic\n2.5 Basic communication skills\n2.6 Basic first-aid treatment\n2.7 Types, characteristics and methods of application of\nfertilizers\n2.8 Frequency and dosage of fertilizers\n2.9 Hygiene practices and plant health principles\n2.10 Procedures and techniques in watering/irrigation\n2.10 Values\n 2.10.1 Diligence\n 2.10.2 Time consciousness\n3. Underpinning Skills\n3.1 Using tools and equipment\n3.2 Applying planting techniques\n3.3 Using the right species, size and quality of plants\n3.4 Communication skills (verbal or written) in receiving\ninstructions\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1 Workplace area\n4.2 Supplies, materials, tools and equipment needed to\nperform the tasks\n4.3 Instructions (Oral or Written)\n5. Method of\nAssessment\nCompetency may be assessed through:\n5.1 Direct Observation with Oral Questioning\n5.2 Interview\n5.3 Portfolio\n6. Context of\nAssessment\n6.1 Competency may be assessed individually in the actual\nworkplace or simulation environment in TESDA accredited\ninstitutions\n\n--- PDF PAGE 41 ---\nTR Landscape Installation and Maintenance NC II 37\nUNIT OF COMPETENCY: INSTALL PLANT SUPPORT\nUNIT CODE\n : AGR611375\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes\nrequired to install plant support immediately after planting.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Install stakes or staking\n\n1.1 Materials for staking are selected and prepared in\naccordance with the standard landscape specifications,\ninstructions or detailed drawing\n1.2 Stakes are installed in accordance with the specifications,\ninstructions or detailed drawings\n1.3 Paints are applied to all wooden and other visible parts in\naccordance with the specifications, instructions or detailed\ndrawing\n1.4 Tasks in installing stakes are performed using appropriate\nsafety protective devices and prescribed materials, tools\nand equipment.\n1.5 Area is cleaned and restored as per industry standard\noperating procedures\n\n2. Install plant guys or\nguying\n2.1 Materials for guying are selected and prepared in\naccordance with the standard landscape specifications,\ninstructions or detailed drawing\n2.2. Plant guys are installed in accordance with the\nspecifications, instructions or detailed drawing\n2.3. Warning signs are installed in areas where guys are\nplaced in accordance with specifications, instructions or\ndetailed drawing\n2.4. Tasks in installing plant guys are performed using\nappropriate safety protective devices and prescribed\nmaterials, tools and equipment.\n2.5. Area is cleaned and restored as per industry standard\noperating procedures asks are performed using\n3. Install plant props /\nbraces or proping\nbracing\n3.1 Materials for plant props / braces are selected and\nprepared in accordance with the standard landscape\nspecifications, instructions or detailed drawing\n3.2. Plant props / braces are installed in accordance with the\nspecifications, instructions or detailed drawings\n3.3. Paints are applied to all wooden and other visible parts in\naccordance with the specifications, instructions or\ndetailed drawing\n3.4. Tasks in installing plant props or braces are performed\nusing appropriate safety protective devices and\nprescribed materials, tools and equipment.\n3.5. Area is cleaned and restored as per industry standard\noperating procedures\n\n--- PDF PAGE 42 ---\nTR Landscape Installation and Maintenance NC II 38\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Materials for staking\nMay include but not limited to:\n1.1 Wooden tree stakes\n1.2 Bamboo stakes\n1.3 Stake ponder\n1.4 Garden hose\n1.5 Coated wire, plant tie or used nylon stocking\n2. Materials for guying\nMay include but not limited to :\n2.1 Guying anchor / duck-billed soil anchor\n2.2 Reinforcing rod\n2.3 Wires / ropes / metal cables\n2.4 Garden hose\n3. Materials for plant\nprops / braces\n\nMay include but not limited to:\n3.1 Metal plant props\n3.2 Wood / floor board\n3.3 Screws\n3.4 Metal braces / Grid plant brace\n\n--- PDF PAGE 43 ---\nTR Landscape Installation and Maintenance NC II 39\nEVIDENCE GUIDE\n\n1. Critical Aspects\nof Competency\nAssessment requires evidence that the candidate:\n1.1 Identified and used materials and tools in installing plant\nsupport\n1.2 Installed stakes, guys, props and braces efficiently and\naesthetically acceptable\n1.4 Exhibited safety practices and procedures in installing plant\nsupport\n2. Underpinning\nKnowledge and\nAttitude\n\n2.1 Functions, uses and basic maintenance of tools\n2.2 Different types of plant supports\n2.3 Basic knowledge on arithmetic\n2.4 Values ( Diligence, Time and Cost-consciousness, Hygiene,\nSystematic and Organized)\n3. Underpinning\n Skills\n3.1 Basic carpentry works / plumbing\n3.2 Use of appropriate tools and PPE\n3.3 Communication skills\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1 Garden with newly installed large trees and palms\n4.2 Carpentry tools\n4.3 Materials (G.I. Wires, Cables, Ropes, Stakes, Pegs / Pins, etc.)\n5. Method of\nAssessment\nCompetency may be assessed through:\n5.1 Direct observation with oral questioning\n5.2. Portfolio\n5.3 Interview\n6. Context of\nAssessment\n6.1 Competency may be assessed individually in the actual\n workplace or simulation environment in TESDA\n accredited institutions.\n\n--- PDF PAGE 44 ---\nTR Landscape Installation and Maintenance NC II 40\nUNIT OF COMPETENCY: TRIM AND PRUNE LANDSCAPE PLANTS\nUNIT CODE\n : AGR611376\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes\nrequired to trim and prune landscape plant based on the\npurposes of such landscape maintenance activity.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Identify trimming and\npruning requirements\n\n1.1 Landscape plants and their parts that are in need of\ntrimming and pruning are distinguished according to landscape\nmaintenance standards (LMS)\n1.2 Purpose and method of pruning are determined according to\nLMS\n1.3 Utility services are located using site plans and in consultation\nwith concerned persons or authority\n1.4 Access to the site is determined in consultation with concerned\npersons or authority\n1.5 Occupational Health and Safety (OHS) hazards are identified,\nrisks assessed and reported to concerned persons or authority\n2. Prepare for trimming\nand pruning operations\n2.1 Tools, supplies and equipment are prepared in accordance\nwith the work requirements\n2.2 Pre-operational and safety checks are carried out on tools and\nequipment according to manufacturer’s specifications and\nindustry work practices\n2.3 Prescribed safety and personal protective equipment (PPE)\nis selected, used and maintained\n3. Perform trimming and\npruning\n3.1 Safety and warning devices are installed around the site\nduring and between work periods\n3.2 Landscape plants are trimmed and pruned in accordance with\nwork program and LMS\n3.3 Trimming and pruning of landscape plants are done using\nprescribed tools and equipment\n3.4 Sterilizing agent/compound are applied on pruning wounds in\naccordance with LMS\n3.4 Tasks are conducted using appropriate PPE\n4. Perform post-trimming\nand pruning activities\n4.1 Trimming and pruning wastes are collected and disposed\nfrom the site in accordance with environmental standards and\nLMS\n4.2 Recommended manual handling techniques are used when\nlifting or moving heavy loads\n4.3 Tools and equipment are cleaned, maintained and stored\naccording to LMS\n4.4 Maintenance of clean and safe area is undertaken throughout\nand on completion of work\n4.5 Work outputs are recorded or reported to concerned persons or\nauthority according to industry practices\n\n--- PDF PAGE 45 ---\nTR Landscape Installation and Maintenance NC II 41\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Landscape plants\n1.1 Shrubs and hedges\n1.2 Vines\n1.3 Palms\n1.4 Bamboos\n1.5 Trees\n2. Purpose\nMay include:\n2.1 Create and maintain form and shape of landscape plant\n2.2 Promote health\n2.3 Direct or control growth\n2.4 Encourage flowering and fruiting\n2.5 Remove/minimize risk/hazard\n3. Utility services\n\n3.5 Aboveground utilities\n3.1.1 Electrical and communication lines\n3.1.2 Cable/TV lines\n3.6 Underground utilities\n3.2.1 Irrigation and domestic water distribution lines\n3.2.2 Electrical and communication lines\n3.2.3 Cable/TV lines\n3.2.4 Drainages and sewerages\n4. Concerned persons\nor authority\n4.1 Supervisor\n4.2 Property management officer\n4.3 Home owner\n4.4 Inspector\n5. Hazards\n\nMay include but are not limited to:\n5.1 Disturbance or interruption of services\n5.2 Solar radiation\n5.3 Pollutants (e.g. gaseous, suspended particulate matters)\n5.4 Noise\n5.5 Manual handling of moving powered equipment or parts,\nsharp tools and materials\n5.6 Uneven landforms/surfaces\n5.7 Flying and falling objects\n6. Risks\nMay include but are not limited to:\n6.1 Risk to co-workers, equipment, other people and animals\nexternal to the workplace (e.g. members of the public, stray\npets and wildlife)\n6.2 Risk to natural environment\n\n--- PDF PAGE 46 ---\nTR Landscape Installation and Maintenance NC II 42\n\nVARIABLE\nRANGE\n7. Tools, supplies and\nequipment\nMay include but are not limited to:\n7.1 Hedge trimmers (HT): Power and manual\n7.2 Shears: Pruning, loping\n7.3 Saws: Pruning saws, chain saws, bow saws\n7.4 Pole/Tree pruner\n7.5 Telescopic shaft/high branch pruning chain saws\n7.6 Ladder/adjustable ladder\n7.7 Basket type boom/cherry picker\n7.8 Sterilizing agent/pruning compound\n8. Safety and PPE\n8.1 Early warning devices\n8.2 Overall\n8.3 Gloves\n8.4 Goggles\n8.5 Ear muff/plugs\n8.6 Gas mask\n8.7 Safety belt/harness\n8.8 Climbing ropes/gadgets\n8.9 Hard hat\n8.10 Shoes/safety shoes\n8.11 Reflectorized vest (depends on location of work)\n9. Early warning\ndevices\nMay include but are not limited to:\n9.1 Traffic cones\n9.2 Warning tapes\n9.3 Warning signage\n10. Sterilizing agent/\ncompound\n10.1 Coal tar\n10.2 Bituminous pruning compound\n10.3 Latex Paint with fungicide\n10.4 Fungicide\n11. Trimming and\npruning wastes\n\n11.1 Tops or shoots\n11.2 Branches\n11.3 Twigs\n11.4 Leaves\n11.5 Flowers and fruits\n12. Maintenance of\nclean and safe area\nTasks may include:\n12.1 Keeping public access paths and roads clear of debris,\nwaste, tools and equipment\n12.2 Disabling tools and equipment after use\n12.3 Using signage and barriers where necessary\n12.4 Removing debris and waste from the work area\n\n--- PDF PAGE 47 ---\nTR Landscape Installation and Maintenance NC II 43\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Identified trimming and pruning requirements\n1.2 Prepared supplies, materials, tools, equipment and PPE\n1.3 Trimmed and pruned landscape plants\n1.4 Applied sterilizing agent/compound\n1.5 Performed post-trimming and pruning operations\n1.6 Observed OHS practices\n2. Underpinning\nKnowledge and\nAttitude\n\n2.1 Types of landscape plants, their characteristics and growth\nhabit\n2.2 Techniques, principles and procedures of trimming and\npruning applicable to plant types and plant factors,\nenvironmental and cultural considerations and objectives of\nthe tasks\n2.3 Effects of trimming and pruning operations\n on plant growth and development\n2.4 Functions and uses of tools and equipment\n2.5 Hygiene practices and plant health principles relevant to\ntrimming and pruning\n2.6 Hazards/risks and responsibilities associated with working in\na publicly accessible situation\n2.7 Values:\n 2.7.1 Diligence\n 2.7.2 Time consciousness\n 2.7.3 Cost consciousness\n 2.7.4 Hygiene consciousness\n 2.7.5 Persistence\n 2.7.6 Systematic and organized\n3. Underpinning Skills\n3.1 Using of appropriate tools and equipment and prescribed\nsafety/protective devices\n3.2 Understanding work procedures\n3.3 Participating in teams and contributing to team objectives\n3.4 Communication skills in receiving instructions and rendering\neven simple oral and written reports\n3.5 Maintaining tools and equipment\n3.6 Minimizing environmental disturbances\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1 Landscape plants and/or landscaped area\n4.2 Tools, equipment and supplies relevant to the activity\n4.3 Protective/safety gadgets\n5. Method of\nAssessment\nCompetency may be assessed through:\n5.1 Direct Observation with Oral Questioning\n5.2 Interview\n5.3 Portfolio\n6. Context of\nAssessment\n6.1 Competency may be assessed individually in the actual\nworkplace or simulation environment in TESDA accredited\ninstitutions.\n\n--- PDF PAGE 48 ---\nTR Landscape Installation and Maintenance NC II 44\nUNIT OF COMPETENCY: PERFORM WEEDING AND CULTIVATION\nUNIT CODE\n : AGR611377\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes required to\nconduct weeding operations and soil cultivation activities. This\nis purposely to minimize competition and to improve soil\naeration and water absorption/retention, respectively for better\ngrowth and development of the landscape plants.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Determine\nrequirements for\nweeding and\ncultivation activity\n1.1 Weed species and “volunteer” plants (“’invaders”) that are\nout-of-place and considered undesirable in the landscape\nare identified based on specific landscape maintenance\nguidelines or as per instructions.\n1.2 Landscape areas needing weeding and cultivation are\nidentified based on instructions or in accordance with LMS\n2. Prepare for weeding\nand cultivation\noperation\n\n2.1 List of weeds and “volunteer plants” and the map of specific\nlandscape areas are prepared and secured\n2.2 Method and purpose of weeding are determined based\non the type of weed species and out-of-place “volunteer”\nspecies\n2.3 Tools, supplies and equipment needed are made ready\nand available for use according to the types of weeds and\n“volunteer” species that needs removal\n2.4 Appropriate safety protective devices are prepared for\nuse\n3. Conduct weeding and\nremoval of “volunteer”\nspecies\n\n3.1 Weeds and out-of-place “volunteer” plant species in the\nlandscape are removed and disposed in accordance with\nlandscape maintenance standard or as per instructions.\n3.2 Weeds and out-of-place “volunteer” plant species are\nremoved using prescribed tools and equipment\n3.3 Tasks are done using appropriate safety/protective devices\n4. Determine compacted\nsoil\n4.1 Compacted soil or soil that is having problem with aeration,\nwater infiltration and conditions for root development is\ndetermined as per established practice\n4.2 Effects of compacted soil on root development and\nanchorage are recognized\n4.3 Method and purpose of soil cultivation are determined\nbased on the conditions of the soil\n\n--- PDF PAGE 49 ---\nTR Landscape Installation and Maintenance NC II 45\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n5. Cultivate compacted\n soil\n5.1 Compacted soil is cultivated simultaneous with weeding\noperations in accordance with landscape maintenance\nstandards or as per instructions\n5.2 Soil cultivation is done using appropriate tools and\nequipment\n5.3 Task is performed using prescribed safety/protective\ndevices\n6. Perform post- weeding\nand soil cultivation\nactivities\n6.1 Tools and equipment are cleaned, maintained and stored as\nper instruction of in accordance with LMS\n6.2 Maintenance of clean and safe area is undertaken\nthroughout and on completion of work\n6.3 Work outputs are recorded or reported to concerned\npersons or authority according to industry practices\n\n--- PDF PAGE 50 ---\nTR Landscape Installation and Maintenance NC II 46\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Weed species and\nvolunteer plants\n(invaders)\n1.1 Weeds\n1.1.1 Grass\n1.1.2 Sedges\n1.1.3 Shrubs\n1.1.4 Vines\n1.2 Out-of-place “volunteer” plant species are those that grow\nnaturally in the site and are competing with desirable\nplants, making the site ugly and/or are eye-sore in the\nlandscape. Volunteer species can be landscape plants\nbut is not included in the landscape design\n2. Landscape areas\nMay include but are not limited to:\n2.1 Lawn\n2.2 Flower beds\n2.3 Hedges and shrubs landscape area\n2.4. Tree lawn or tree planting verges\n3. Methods of weed control\n\n3.1 Manual weeding\n3.2 Mechanical weeding\n3.3 Chemical weeding\n4. Purpose of weeding\n4.1 Release the desirable landscape plants from competition\nof weeds and out-of-place “volunteer” species\n4.2 Improve the health conditions of the landscape plants\n4.3 Lessen susceptibility of the landscape plants from pest\nand disease attack\n5. Methods of soil\ncultivation\n5.1 Manual\n5.2 Mechanical\n6. Purpose of soil\ncultivation\n6.1 Improve soil structure, porosity, aeration and water\ninfiltration\n6.2 Improve conditions for root system development and root\nanchorage\n6.3 Improve water and nutrient absorption\n6.4 Enhance soil macro and micro-organisms activity\n7. Supplies, tools and\nequipment for weeding\noperations\n\n7.1 Small bolo “dulos”\n7.2 Scythe (“Karit”)\n7.3 Small round/flat bar\n7.4 Spade\n7.5 Trowel\n7.6 Chemicals (Types: Selective herbicide; Wide spectrum)\n\n--- PDF PAGE 51 ---\nTR Landscape Installation and Maintenance NC II 47\n\nVARIABLE\nRANGE\n8. Tools and equipment for\nsoil cultivator\n8.1 Small bolo (“dulos”)\n8.2 Small round/flat bar\n8.3 Spade\n8.4 Soil cultivating machine\n9. Protective/safety\ndevices used in\nweeding and cultivation\n9.1 Goggles\n9.2 Overalls, gloves\n9.3 Reflectorized vest (depends on location of work)\n10. Maintenance of clean\nand safe area\nTasks may include:\n10.1 Keeping public access paths and roads clear of\n debris, waste, tools and equipment\n10.2 Disabling tools and equipment after use\n10.3 Using signage and barriers where necessary\n10.4 Removing debris and waste from the work area\n\n--- PDF PAGE 52 ---\nTR Landscape Installation and Maintenance NC II 48\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Determined requirements for weeding and cultivation activity\n1.2 Prepared for weeding and cultivation operation\n1.3 Conducted weeding and removal of “volunteer” plant species\n1.4 Determined compacted soil\n1.5 Cultivated compacted soil\n1.6 Conducted post weeding and soil cultivation operations\n1.7 Used/operated tools and equipment properly\n1.8 Used prescribed protective/safety gadgets\n2. Underpinning\nKnowledge and\nAttitude\n\n2.1 Recognition of the effects of weeds and undesirable\n“volunteer” species (invaders) on landscape plants\n2.2 Knowledge in distinguishing weeds and undesirable\n“volunteer” species\n2.3 Use of weed control and soil cultivation method\n2.4. Functions, uses and maintenance of tools and equipment\n2.5 Values:\n 2.5.1 Diligence\n 2.5.2 Time consciousness\n 2.5.3 Cost consciousness\n 2.5.4 Hygiene consciousness\n 2.5.5 Persistence\n 2.5.6 Systematic and organized\n3. Underpinning\n Skills\n3.1 Use of appropriate tools and equipment and prescribed\nprotective/safety devices in weeding and soil cultivation\n3.2 Communication skills in receiving instructions and rendering\neven verbal reports about the completed task\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1 Landscape area\n4.2 Necessary tools and equipment\n4.3 Relevant supplies and materials\n5. Method of\nAssessment\nCompetency may be assessed through:\n5.1 Direct Observation with Oral Questioning\n5.2 Interview\n5.3 Portfolio\n6. Context of\nAssessment\n6.1 Competency may be assessed individually in the actual\nworkplace or simulation environment in TESDA accredited\ninstitutions.\n\n--- PDF PAGE 53 ---\nTR Landscape Installation and Maintenance NC II 49\nUNIIT OF COMPETENCY: APPLY FERTILIZER (NUTRITION)\nUNIT CODE\n : AGR611378\nUNIT DESCRIPTOR\n : This unit covers the knowledge, skills and attitudes required to\nrecognize types of fertilizers and apply the right amount of such\nfertilizers at the right time to landscape plants.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Identify fertilizer\napplication\nrequirements\n1.1 Soil and plant samples (leaves) are collected for analysis in\naccordance with standard operating procedures (SOPs)\n1.2 Landscape plants in need of nutrition are identified based\non the results of soil and plant analyses\n2. Prepare for fertilizer\napplication activity\n2.1 Different types of fertilizers are selected based on\nnutritional guidelines and standards\n2.2 Method of fertilizer application are determined\naccording to LMS\n2.3 Fertilizer application tools and equipment are selected and\nprepared according to application method selected\n2.4 Soil and plants are prepared for application of fertilizer in\naccordance with the instructions or available standards\n2.5 Prescribed safety and personal protective equipment\n(PPE) is selected.\n3. Perform fertilizer\napplication activities\n3.1 Frequency and dosage of fertilizer application is determined\nbased on landscape plant requirements or nutritional\nguidelines/standards\n3.2 Fertilizer is applied in accordance with recommended\napplication method\n3.3 Fertilizer is applied in accordance with to OHS\nrequirements and Fertilizer and Pesticide Authority (FPA)\nguidelines\n3.4 Task is performed using the prescribed tools and equipment\nand appropriate protective/safety devices\n4. Perform post-\nfertilizer application\nactivities\n4.1 Tools and equipment are cleaned, maintained and stored\naccording to LMS\n4.2 Maintenance of clean and safe area is undertaken\nthroughout and on completion of work\n4.3 Work outputs are recorded or reported to concerned\npersons or authority according to industry practices\n\n--- PDF PAGE 54 ---\nTR Landscape Installation and Maintenance NC II 50\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Soil sample\n1.1 Depth of soil sampling applicable to landscape plant\n1.2 Amount of soil sample\n1.3 Method soil analysis\n 1.3.1 soil test kit\n 1.3.2 soil analysis laboratory\n2. Landscape plants\n2.1 Shrubs and hedges\n2.2 Vines\n2.3 Palms\n2.4 Bamboos\n2.5 Trees\n3. Results of soil and\nplant analyses\n3.1 Soils\n 3.1.1 Slightly, moderately to highly acidic\n 3.1.2 Slightly, moderately to highly saline/alkaline\n 3.1.3 Adequate, medium, low OM\n 3.1.4 Adequate, medium, low N or P or K\n3.2 Plants\n 3.2.1 Visual symptoms: Chlorotic, etc\n 3.2.2 Tissue analysis: Deficient, moderately deficient, highly\ndeficient in N, P or K\n4. Types of fertilizers\n\nTypes of fertilizers vary. These may include the following\n4.1 Organic:\n 4.1.1 Compost, humus, vermi-compost and some\n commercially-brands\n 4.1.2 Bio-fertilizers: Bio-N, Bio-tab, Mycovam, Mycogroe,\n Rhizo-N, etc…\n4.2 Inorganic\n4.2.1 Easily dissolved fertilizer: Ammonium sulfate,\nAmmonium phosphate, Ammonium, Sulfate,\nPhosphate, Potassium, Urea, Complete\n4.2.2 Slow-release fertilizers: Multi-cote, Osmocote,\n Nutricote, Fertifile, etc.\n 4.2.3 Liquid fertilizer\n5. Methods of\napplication\n\n5.1 Liquid Fertilizer\n 5.1.1 Foliar spraying\n 5.1.2 Soil drenching\n 5.1.3 Fertigation (incorporated in irrigation water)\n 5.1.4 Root feeding\n 5.1.5 Trunk injection\n5.2 Powder/granules\n 5.2.1Top dressing or broadcasting\n 5.2.2 Drilling\n\n--- PDF PAGE 55 ---\nTR Landscape Installation and Maintenance NC II 51\n\nVARIABLE\nRANGE\n6. Protective/safety\ndevices\n6.1 Overalls\n6.2 Rubberized gloves\n6.3 Goggles\n6.4 Reflectorized vest (depends on location of work)\n6.5 Hard hat\n6.6 Field shoes\n7. Maintenance of clean\nand safe area\nTasks may include:\n7.1 Keeping public access paths and roads clear of debris,\nwaste, tools and equipment\n7.2 Disabling tools and equipment after use\n7.3 Using signage and barriers where necessary\n7.4 Removing debris and waste from the work area\n\n--- PDF PAGE 56 ---\nTR Landscape Installation and Maintenance NC II 52\n\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Identified fertilizer application requirements\n1.2 Prepared for fertilizer application activity\n1.3 Performed fertilizer application activities\n1.4 Performed post fertilizer application activities\n2. Underpinning\nKnowledge and\nAttitude\n\n2.1 Types of landscape plants, their characteristics and growth\nhabit\n2.2 Procedures and techniques in diagnosis/recognition of\nnutrient deficiency\n2.3 Types, characteristics and methods of application of\nfertilizers\n2.4 Frequency and dosage of fertilizers\n2.5 Effects of fertilizer on plant growth and development\n2.6 Functions, uses and maintenance of tools and equipment\nincluding relevant supplies and materials for the job\n2.7 Hygiene practices and plant health principles relevant to\nfertilizer application activity\n2.8 Values:\n 2.8.1 Diligence\n 2.8.2 Time consciousness\n 2.8.3 Cost consciousness\n 2.8.4 Hygiene consciousness\n 2.8.5 Persistence\n 2.8.6 Systematic and organized\n3. Underpinning Skills\n3.1 Using of appropriate tools and equipment and prescribed\nprotective/safety devices in the application of fertilizers\n3.2 Understanding work procedures\n3.3 Participating in teams and contributing to team objectives\n3.4 Communication skills in receiving instructions and in\nrendering simple written and even oral reports\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1 Fertilizers materials including other relevant supplies\n4.2 Tools and equipment\n4.3 Landscape area/landscape plants\n5. Method of\nAssessment\nCompetency may be assessed through:\n5.1 Direct Observation with Oral Questioning\n5.2 Interview\n5.3 Portfolio\n6. Context of\nAssessment\n6.1 Competency may be assessed individually in the actual\nworkplace or simulation environment in TESDA accredited\ninstitutions.\n\n--- PDF PAGE 57 ---\nTR Landscape Installation and Maintenance NC II 53\nUNIIT OF COMPETENCY: WATER PLANTS\nUNIT CODE\n : AGR611379\nUNIT DESCRIPTOR\n : This unit covers the knowledge, skills and attitudes required to\nmaintain the health and vigor of the landscape plants through\nproper watering/irrigation.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Determine\nrequirements of\nwatering/irrigating\nlandscape plants\n\n1.1 Importance of water to growth and development of\nlandscape plants and the effects of water stress (less or\nexcess water) to plants are recognized as per established\npractice\n1.2 Landscape plants suffering from less or excessive\nwatering are determined using some visually observable\nplant and soil conditions and/or guidelines\n2. Prepare for\nwatering/irrigation\nactivity\n2.1 Amount and frequency of watering/irrigation of plants\nare determined in accordance with LMS or as per\ninstructions\n2.2 Tools, supplies and equipment needed are prepared\nbased on the method of watering and/or irrigation to be\nused\n2.3 Prescribed protective/safety devices are made ready\nand available for use\n3.\nConduct\nwatering/irrigation of\nplant\n3.1 Watering or irrigating of plants is done in accordance\nwith the basic principles or standard practice or as per\ninstructions\n3.2 Watering/irrigation is performed using the irrigation tools\nand equipment appropriate to the methods selected\n3.3 Task is performed using the prescribed protective/\nsafety gadgets\n4.\nPerform post-\nwatering/irrigation\nactivities\n4.1 Tools and equipment are cleaned, maintained and stored\nas per instruction of in accordance with LMS\n4.2 Maintenance of clean and safe area is undertaken\nthroughout and upon completion of work\n4.3 Work outputs are recorded or reported to concerned\npersons or authority according to industry practices\n\n--- PDF PAGE 58 ---\nTR Landscape Installation and Maintenance NC II 54\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Importance of water to\nplants\nRoles of water includes but not limited to the following:\n1.1 Maintains of vital physiological processes in plants\n1.2 Primary raw material for photosynthesis or food\nmanufacture\n1.3 Maintains of turgidity of the cells\n1.4 Helps in the translocation of nutrients, food and other\nassimilates\n1.5 Maintains the health conditions of the plant\n2. Plant conditions\nVisually observable conditions of plants suffering from water\nstress\n2.1 Wilting and die back\n2.2 Change in color and appearance of the leaves\n2.3 Premature falling of leaves/defoliation\n3. Soil conditions\nVisually observable conditions of soil suffering from water\nstress\n3.1 When dry\n 3.1.1 Too dusty\n 3.1.2 Cracks on soil\n3.2 When waterlogged or over-watered\n 3.2.1 Too wet\n 3.2.2 Muddy\n4. Amount and frequency\nof watering\nDetermining when and how much to irrigate may include:\n4.1 Observation of the conditions of the plant\n4.2 Observation of the conditions of the soil\n4.3 Use of moisture meter\n5. Methods of\nwatering/irrigation\n\nThe methods of watering depends on the kind of landscape\nplants/landscape areas and available facilities:\n5.1 Overhead irrigation: overhead sprinkler, pop-up etc.\n5.2 Drip irrigation\n5.3 Furrow irrigation\n5.4 Basin irrigation\n6. Tools and equipment\n\nDepending on the method, the following may be needed:\n6.1 Water hose with and without sprinklers\n6.2 Water truck\n6.3 Irrigation system installed\n6.4 Plumbing tools\n\n--- PDF PAGE 59 ---\nTR Landscape Installation and Maintenance NC II 55\n\nVARIABLE\nRANGE\n7. Protective/safety\ndevices\n\n7.1 Overalls\n7.2 Gloves\n7.3 Hat/hard hat\n7.4 Rain boots\n7.5 Reflectorized vest (depends on the location of work)\n8. Maintenance of clean\nand safe area\nTasks may include:\n8.1 Keeping public access paths and roads clear of debris,\nwaste, tools and equipment\n8.2 Disabling tools and equipment after use\n8.3 Using signage and barriers where necessary\n8.4 Removing debris and waste from the work area\n\n--- PDF PAGE 60 ---\nTR Landscape Installation and Maintenance NC II 56\n\nEVIDENCE GUIDE\n\n1. Critical Aspects\nof Competency\nAssessment requires evidence that the candidate:\n1.1 Determined requirements of watering/irrigating plants\n1.2 Recognized importance of water to plants and the consequent\neffects of less or over-watering\n1.3 Distinguished plants needing watering and plants in excess of\nwatering or suffering from waterlogged conditions\n1.4 Prepared for watering/irrigation activity as per\n instructions\n1.5 Conducted watering/irrigation using the prescribed tools,\nsupplies and equipment and in accordance with standard\npractice\n1.6 Performed post-watering/irrigation activity\n2. Underpinning\nKnowledge and\nAttitude\n\n2.1 Procedures and techniques in watering/irrigation\n2.2 Functions, uses and maintenance of tools and\n equipment for efficient watering/irrigation\n2.3 Values:\n 2.3.1 Diligence\n 2.3.2 Time consciousness\n 2.3.3 Cost consciousness\n 2.3.4 Hygiene consciousness\n 2.3.5 Persistence\n 2.3.6 Systematic and organized\n3. Underpinning\n Skills\n3.1 Use of appropriate tools and equipment and prescribed\nprotective/safety devices in watering/irrigation\n3.2 Communication skills in receiving instructions and rendering\neven verbal reports about the completed task\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1 Landscape area/landscape plants\n4.2 Tools and equipment\n4.3 Protective/safety gadgets\n5. Method of\nAssessment\nCompetency may be assessed through:\n5.1 Direct Observation with Oral Questioning\n5.2 Interview\n5.3 Portfolio\n6. Context of\nAssessment\n6.1 Competency may be assessed individually in the actual\nworkplace or simulation environment in TESDA accredited\ninstitutions.\n\n--- PDF PAGE 61 ---\nTR Landscape Installation and Maintenance NC II 57\nUNIIT OF COMPETENCY: CONTROL AND PREVENT PLANT PEST AND DISEASES\nUNIT CODE\n : AGR611380\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes required to\ndetermine types of pests and diseases and their prevention and\ncontrol measures\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Determine\nrequirements of\npreventing and\ncontrolling plant pests\nand diseases\n1.1 Infested and diseased landscape plants are determined\nbased on plant conditions, symptoms and signs and\nother manifestation of infestation and infection\n1.2 Pests and diseases are identified and classified using\ngeneral classification guidelines\n1.3 Life cycle or various life stages of pests from eggs,\nlarvae, pupa and adult and their mode of attack or\ninfestation are known\n1.4 Life cycle or various life stages and signs and symptoms\nof plant diseases and their mode of attack are known\n1.5 Access to the site is determined in consultation with\n concerned persons or authority\n1.6 Occupational Health and Safety (OHS) hazards are\nidentified, risks assessed and reported to concerned\npersons or authority\n2. Prepare for application\nof pests and disease\nprevention and control\nmeasures\n\n2.1 Method of prevention and control is determined based\non types of pests and diseases, their mode of attack and\nextent of infestation and infection\n2.2 Tools, equipment, supplies and materials relevant to the\nmethod of prevention and control are prepared\n2.3 Prescribed safety and personal protective equipment\n(PPE) is selected in accordance with work requirements\n3. Apply pest and\ndisease prevention\nand control measures\n3.1 Manual and biological method of prevention and control of\npest and disease are applied whenever applicable\n3.2 In case of using chemical and bio-pesticides, the\nfrequency and dosage of application is determined based\non types of pests and diseases and extent of attack and in\naccordance with LMS or manufacturer’s recommendation\n3.3 Pest and disease prevention and control measures are\napplied in accordance with to OHS requirements and\nFertilizer and Pesticide Authority (FPA) guidelines\n3.4 Task is performed using prescribed tools, supplies and\nappropriate protective/safety devices\n4. Perform post-\nprevention and control\nmeasures\n4.1 Tools and equipment are cleaned, maintained and\nstored according to LMS\n4.2 Maintenance of clean and safe area is undertaken\nthroughout and on completion of work\n4.3 Work outputs are recorded and reported to concerned\npersons or authority according to industry practices\n\n--- PDF PAGE 62 ---\nTR Landscape Installation and Maintenance NC II 58\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Landscape plants\n\n1.1 Shrubs and hedges\n1.2 Vines\n1.3 Palms\n1.4 Bamboos\n1.5 Trees\n2. Plant conditions\n2.1 Age/Stage of growth\n2.2 Healthy and vigorous\n2.3 Diseased/infected:\n2.4 Infested\n3. Symptoms, signs and\nother manifestations\ndiseases\nMay include but are not limited to:\n3.1 Diseases\n3.1 Leaf spots\n3.2 Anthracnose\n3.3 Fruiting bodies\n3.4 Presence of hyphae\n3.5 Pests\n 3.5.1 Gall on leaves, stems, branches\n 3.5.2 Skeletonized, browsed/chewed leaves\n 3.5.3 Withering, die back etc\n4. Pests and diseases\n4.1 Pests\n4.1.1 Insect pests: Chewing, Sucking, Girdling/\n Boring, etc.\n 4.1.2 Termites\n 4.1.3 Nematodes\n4.2 Diseases\n 4.2.1 Parasitic fungus\n 4.2.2 Bacteria\n 4.2.3 Viruses\n 5. Methods of prevention\nand control\n\n5.1 Prevention\n 5.1.1 Species/individual (genetically superior) selection\n 5.1.2 Pest and disease free\n 5.1.3 Cultural management\n 5.1.4 Sanitation\n5.2 Control\n5.3 Manual/mechanical\n5.4 Chemical (systemic, broad spectrum, contact)\n5.5 Biological- (insects, microorganisms)\n5.6 Bio-pesticides\n\n--- PDF PAGE 63 ---\nTR Landscape Installation and Maintenance NC II 59\n\nVARIABLE\nRANGE\n6. Tools, supplies and\nequipment\n\n6.1 Backpack sprayer\n6.2 Boom sprayer\n6.3 Soil drencher\n6.4 Pruning shears,\n6.5 Pruning saws\n7. Protective/safety\ngadgets\n\n7.1 Overalls, gloves\n7.2 Gas mask\n7.3 Goggles\n7.4 Reflectorized vest ( depends on location of work)\n8. Maintenance of clean\nand safe area\nTasks may include:\n8.1 Keeping public access paths and roads clear of debris,\nwaste, tools and equipment\n8.2 Disabling tools and equipment after use\n8.3 Using signage and barriers where necessary\n8.4 Removing debris and waste from the work area\n\n--- PDF PAGE 64 ---\nTR Landscape Installation and Maintenance NC II 60\n\nEVIDENCE GUIDE\n\n1. Critical Aspects\nof Competency\nAssessment requires evidence that the candidate:\n1.1 Determined requirements for the prevention and control of pests\nand diseases\n1.2 Prepared for the application of pest and disease prevention\n and control\n1.3 Applied pest and disease prevention and control measures\n1.4 Conducted post-pest and disease prevention and control\n operations\n1.5 Performed tasks using appropriate tools, equipment and\nsafety/protective devices\n2. Underpinning\nKnowledge and\nAttitude\n\n2.1 Types of landscape plants, their conditions and stage of growth\n2.2 General classification of pests and diseases, life cycle and mode\nof attack\n2.3 Procedures and techniques in prevention and control of pests\nand diseases\n2.4 Functions, uses and maintenance of tools and equipment\n2.5 Values:\n 2.5.1 Diligence\n 2.5.2 Time consciousness\n 2.5.3 Cost consciousness\n 2.5.4 Hygiene consciousness\n 2.5.5 Persistence\n 2.5.6 Systematic and organized\n3. Underpinning\n Skills\n3.1 Use of appropriate tools and equipment and prescribed\nprotective/safety devices in the prevention and control of pests\nand diseases\n3.2 Communication skills in receiving instructions and in rendering\nsimple written and even oral reports\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1 Landscape area/landscape plants\n4.2 Tools, equipment, supplies and materials and protective/safety\ndevices\n4.3 Instructions or guidelines\n5. Method of\nAssessment\nCompetency may be assessed through:\n5.1 Direct Observation with Oral Questioning\n5.2 Interview\n5.3 Portfolio\n6. Context of\nAssessment\n6.1 Competency may be assessed individually in the actual\nworkplace or simulation environment in TESDA accredited\ninstitutions.\n\n--- PDF PAGE 65 ---\nTR Landscape Installation and Maintenance NC II 61\nUNIIT OF COMPETENCY: PROVIDE PLANT SUPPORT\nUNIT CODE\n : AGR611381\nUNIT DESCRIPTOR\n : This unit covers the knowledge, skills and attitudes required to\nprovide support to plants including the selection, preparation\n(including preservation treatments), installation and\nmaintenance of support materials.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Identify requirements\nfor installing plant\nsupport\n1.1 Landscape plants in need of plant support are marked\nand counted as per instructions or in accordance with LMS\n1.2 Purpose and method of providing plant support are\ndetermined in accordance with LMS or as per instruction\n2. Prepare for\ninstallation of plant\nsupport\n2.1 Support materials are selected and prepared relevant to\nthe purpose and method of proving plant support or in\naccordance with LMS or as per instructions.\n2.2 Plant support materials are applied with preservatives at\ndesired dosage and length of treatment to prolong\nserviceability as per instructions\n2.3 Tools, supplies and equipment needed are prepared\naccording to the purpose and method of providing plant\nsupport\n2.4 Appropriate safety protective devices needed to carry out\nthe task are also made ready and available for use\n3. Install plant support\n\n3.1 Support materials are installed in accordance with purpose\nand method of proving plant support or in accordance with\nLMS or as per instructions.\n3.2 Plant support installation is undertaken using prescribed\ntools and equipment\n4. Maintain plant\nsupport\n4.1 Plant support is inspected and maintained for a period\ndepending on the conditions of the plant or in accordance\nwith LMS or as per instruction\n4.2 Unserviceable plant support is replaced if necessary or as\ninstructed\n4.3 Plant support is removed/dismantled once it is no longer\nneeded or has served its intended purpose or as instructed\n4.4 Tasks are performed using prescribed tools and equipment\nand appropriate safety protective devices\n5. Perform post-plant\nsupport activities\n5.1 Plant support materials that dismantled and can still be re-\nused are kept in proper storage as per instruction\n5.2 Tools and equipment are cleaned, maintained and stored\nas per instruction of in accordance with LMS\n5.3 Maintenance of clean and safe area is undertaken\nthroughout and on completion of work\n5.4 Work outputs are recorded or reported to concerned\npersons or authority according to industry practices\n\n--- PDF PAGE 66 ---\nTR Landscape Installation and Maintenance NC II 62\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Landscape plants\n1.1 Shrubs and hedges\n1.2 Vines\n1.3 Palms\n1.4 Bamboos\n1.5 Trees\n2. Purpose and methods\nof plant support\n\nDepending on types, sizes and conditions of plants, the\nfollowing methods of providing plant support may be adopted:\n2.1 Support staking: single, double, triple staking\n2.2 Propping\n2.3 Protective staking or tree guard\n2.4 Guying\n3. Plant support\n materials\nAvailable plant support materials and accessories as specified:\n3.1 Wooden (lumber) stakes\n3.2 Round wood stakes\n3.3 Bamboo poles\n3.4 Steel\n3.5 Plastic\n3.6 Guy materials ( GI wire, GI stranded wire, used\n garden hose, cloth, piece of old inner tube)\n3.7 Pegs (wooden, steel, plastic)\n3.8 Tree ties (rubber pad, belt made of Hessian band,\n thick cloth, used rubber interior tire, staple wire )\n3.9 Nails\n4. Protective safety\ndevices\n\n4.1 Hat/Hard hat\n4.2 Early warning device\n4.3 Goggles\n4.4 Overalls\n4.5 Gloves\n4.6 Safety shoes\n4.7 Reflectorized vest\n5. Maintenance of clean\nand safe area\nTasks may include:\n5.1 Keeping public access paths and roads clear of\n debris, waste, tools and equipment\n5.2 Disabling tools and equipment after use\n5.3 Using signage and barriers where necessary\n5.4 Removing debris and waste from the work area\n\n--- PDF PAGE 67 ---\nTR Landscape Installation and Maintenance NC II 63\n\nEVIDENCE GUIDE\n\n1. Critical Aspects\nof Competency\nAssessment requires evidence that the candidate:\n1.1 Identified requirements for installation of plant support\n1.2 Prepared for installation of plant support\n1.3 Installed plant support\n1.4 Inspected, maintained, replaced and removed/dismantled\n plant support\n1.5 Conducted post operation activities\n1.6 Performed tasks using appropriate tools, equipment and\nprotective devices\n2. Underpinning\nKnowledge and\nAttitude\n\n2.1 Selection and preparation of appropriate plant support\n2.1 Procedures and techniques in providing plant support\n2.2 Functions, uses and maintenance of tools and equipment\n2.3 Values:\n 2.3.1 Diligence\n 2.3.2 Time consciousness\n 2.3.3 Cost consciousness\n 2.3.4 Hygiene consciousness\n2.3.5 Persistence\n2.3.6 Systematic and organized\n3. Underpinning\n Skills\n3.1 Use of appropriate plant support materials, tools and equipment\n3.2 Communication skills in receiving instructions and in rendering\nsimple written and even oral reports\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1 Plant support materials\n4.2 Plants (vines, shrubs, bamboos, palms, trees, bamboos) and\n/or landscaped area\n4.3 Tools and equipment\n4.4 Protective/safety gadgets\n5. Method of\nAssessment\nCompetency may be assessed through:\n5.1 Direct Observation with Oral Questioning\n5.2 Interview\n5.3 Portfolio\n6. Context of\nAssessment\n6.1 Competency may be assessed individually in the actual\n workplace or simulation environment in TESDA\n accredited institutions.\n\n--- PDF PAGE 68 ---\nTR Landscape Installation and Maintenance NC II 64\n\nUNIIT OF COMPETENCY: PERFORM LAWN GRASS MAINTENANCE\nUNIT CODE\n : AGR611382\nUNIT DESCRIPTOR\n : This unit covers the knowledge, skills and attitudes required to\n maintain lawn grasses in residential and institutional landscape\nareas.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n\n1. Mow lawn grass\n\n1.1. Supplies, Materials, Tools and equipment are prepared for\nuse in mowing lawn grass\n1.2. Lawn grass is mowed in accordance with specifications\nor instructions\n1.3. Tasks are performed using the prescribed tools and\nequipment and or based on established practice\n1.4. Personal Protective Equipment and Safety procedures\nare observed during mowing of lawn grass\n\n2. Irrigate lawn\n\n2.1. Supplies, Tools and equipment are prepared for use in\nirrigating lawn\n2.2. Personal Protective Equipment and Safety procedures\nare observed in irrigating lawn\n2.3. Lawn is irrigated based on established procedures\n2.4. Modifications on established procedures are carried on in\nthe event of malfunctions, climatic changes and accidents\n\n3. fertilize lawn\n\n3.1. Supplies, Materials, Tools and equipment are prepared\nfor use in fertilizing lawn\n3.2. Personal Protective Equipment and Safety procedures\n are observed in fertilizing lawn\n3.2. Fertilizers are applied based on manufacturer’s\ninstructions and established procedures\n\n4. Control pests\n\n4.1. Supplies, Materials, Tools and equipment are prepared\nfor use in controlling pests\n4.2. Personal Protective Equipment and Safety procedures\nare observed in controlling pests\n4.3. Pests are controlled using appropriate materials and\nconditions\n\n5. Control weeds\n\n5.1. Supplies, Materials, Tools and equipment are prepared\nfor use in controlling weeds\n5.2. Personal Protective Equipment and Safety procedures\nare observed in controlling weeds\n5.3. Weeds are controlled using appropriate materials and\nprocedures\n\n--- PDF PAGE 69 ---\nTR Landscape Installation and Maintenance NC II 65\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n\n1. Lawn grass\n\n1.1.\nPaspalum conjugatum /Paspalum vaginatum (Carabao\ngrass)\n1.2.\nCynodon dactylon/C. transvalensis (Bermuda grass)\n1.3.\nZoysia matrella (Manila grass)\n1.4.\nZoysia japonica (Blue grass)\n\n2. Personal Protective\nEquipment\n\n2.1. Rubber/ Leather Gloves\n2.2. Goggle\n2.3. Rubber/Safety boots\n2.4. Safety Apron\n2.5. Hard hat\n2.6. Cover all\n2.7. Ear plug/muffs\n2.8. Chemical Mask\n\n3. Established procedures\nin Irrigating lawn\n\n3.1. Manual\n3.2. Automated (Computer or Manual Operated)\n\n4. Fertilizers\n\n4.1. Granular\n4.2. Liquid\n4.3. Slow release (tablets or granules)\n4.4. Organic\n\n5. Pests\n\n5.1. Insect pests\n5.2. Pathogenic / fungal pests\n5.3. Nematodes\n\n6. Weed control\nprocedures\n\n6.1. Manual\n6.2. Chemical\n\n--- PDF PAGE 70 ---\nTR Landscape Installation and Maintenance NC II 66\nEVIDENCE GUIDE\n\n1. Critical Aspects\nof Competency\nAssessment requires evidence that the candidate:\n1.1. Identified and used tools and equipment in maintaining lawn\ngrass\n1.2. Controlled pests, diseases and weeds through chemical use or\nmanually\n1.3. Performed irrigation and fertilization of lawn grass\n1.4 Exhibited safety practices and procedures in mowing, irrigating\nlawn grass, applying fertilizers and controlling pests, diseases\nand weeds.\n2. Underpinning\nKnowledge and\nAttitude\n\n2.1. Functions, uses and basic maintenance of tools and equipment\n2.2. Different types of pests, diseases and weeds\n2.3. Types of Insecticides, Fungicides and Herbicides\n2.4. Mixing appropriate amount of chemical-pesticides\n2.5. Values ( Diligence, Time and Cost-consciousness, Hygiene,\nSystematic and Organized)\n3. Underpinning\n Skills\n3.1. Applying prescribed amount of pesticides\n3.2. Use of appropriate tools and equipment and PPE\n3.3. Communication skills in receiving instruction and rendering\nsimple oral reporting\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1. Lawn\n4.2. PPE\n4.3. Mowing, Irrigation tools and equipment\n4.4. Pest / Weed Control (Supplies, Tools and Equipment)\n5. Method of\nAssessment\nCompetency may be assessed through:\n5.1 Direct observation with oral questioning\n5.2. Portfolio\n5.3 Interview\n6. Context of\nAssessment\n6.1 Competency may be assessed individually in the actual\n workplace or simulation environment in TESDA\n accredited institutions.\n\n--- PDF PAGE 71 ---\nTR Landscape Installation and Maintenance NC II 67\nUNIIT OF COMPETENCY: PERFORM RE-PLANTING ACTIVITIES\nUNIT CODE\n : AGR611383\nUNIT DESCRIPTOR\n : This unit covers the knowledge, skills and attitudes required to\nremove landscape plants that are dying, dead, diseased,\nunsightly and to replace them with new ones either same or\nnew species.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Determine\nrequirements for\nremoval and re-\nplanting of landscape\nplants\n1.1 Landscape plants that need to be removed/replaced are\nrecognized in accordance with the instructions or with LMS\n1.2 Landscape plants needing removal and replacement are\nmarked and counted based on the size, plant conditions\nand purpose are done using appropriate measuring tools\nand equipment\n2. Prepare for removal\nand replacement of\nlandscape plants\n2.1 List of landscape plants needing removal and replacement\nis secured and made ready for the job\n2.2 Tools, supplies and equipment needed are made ready\nand available for use according to the types and sizes of\nlandscape plants\n2.3 Appropriate safety protective devices are made ready\nand available for use\n3. Conduct removal and\ndisposal of landscape\nplants\n\n3.1 Subject landscape plants are removed and disposed from\nsite in accordance with LMS or based on instructions\n3.2 Removal and disposal are done using appropriate tools\nand equipment.\n3.3 Tasks are performed using prescribed protective/safety\ndevices\n4. Prepare land/soil for\nre-planting\n4.1 Land/soil is prepared for replanting following the landscape\ninstallation/maintenance standard or based on instructions\n4.2 Preparation of land/soil is done using appropriate tools and\nequipment.\n4.3 Task is performed using prescribed protective/safety\ndevices\n5. Select right species\nand size of landscape\nplants for replacement\n5.1 Right species, size and quality of landscape plants to be\nused for re-planting are selected based on instructions or\nin accordance with LMS\n5.2 Species and size of the landscape plants removed from\nsite are considered but other species and sizes are given\nequal consideration depending on the purpose of re-\nplanting or as per instructions\n\n--- PDF PAGE 72 ---\nTR Landscape Installation and Maintenance NC II 68\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n6. Conduct re-planting\nactivity\n6.1 Re-planting activity is done in accordance with LMS or\nas per instructions\n6.2 Appropriate tools, supplies and equipment and prescribed\nprotective/safety devices are used in the conduct of the\nactivity\n7. Perform post-removal\nand re-planting\nactivities\n7.1 Tools and equipment are cleaned, maintained and stored\nas per instruction of in accordance with LMS\n7.2 Maintenance of clean and safe area is undertaken\nthroughout and on completion of work\n7.3 Work outputs are recorded and reported to concerned\npersons or authority according to industry practices\n\n--- PDF PAGE 73 ---\nTR Landscape Installation and Maintenance NC II 69\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Landscape plants\n\nMay include but are not limited to:\n1.1 Hedges\n1.2 Shrubs\n1.3 Vines\n1.4 Trees\n1.5 Palms\n1.6 Bamboos\n2. Landscape plant\nconditions needing\nremoval and\nreplacement\nPlant conditions may be manifested as:\n2.1 Unhealthy\n2.2 Dying\n2.3 Diseased\n2.4 Dead\n2.5 Overgrown\n2.6 Aesthetically ugly/eyesore\n2.7 Misplaced\n2.8 Structurally un-sound\n3. Size of landscape\nplants\nSize of landscape plants to be removed and to be used for\nreplacement may be expressed in terms of but are not limited\nto:\n3.1 Height\n3.2 Diameter\n3.3 Root ball\n4. Quality of the\nlandscape plants\nAside from size, quality of landscape plants to be used for re-\nplanting may include but are not limited to:\n4.1 Healthy and vigorous i.e. free from pests and diseases\n4.2 Balanced root/shoot ratio\n4.3 Absence of forking branches in the case of trees\n4.4 Absence of wounds on the branches and stems\n5. Purpose of removal\nand replacement\nPurpose of removal and replacement may include but not\nlimited to:\n5.1 Aesthetic considerations\n5.2 Safety and responsibility concerns\n5.3 Environmental and cultural considerations\n5.4 Economic (maintenance, removal and replacement costs)\n\n--- PDF PAGE 74 ---\nTR Landscape Installation and Maintenance NC II 70\n\nVARIABLE\nRANGE\n6. Tools and equipment\nincluding supplies\n\n6.1 Measurement instruments like diameter tape and meter\ntape\n6.2 Spade\n6.3 Shovel\n6.4 Flat bar\n6.5 Mallet\n6.6 Hammer\n6.7 Supplies: Soil mix, fertilizer, stakes, tree ties, nails\n7. Protective/safety\ndevices\n\n7.1 Hat/hard hat\n7.2 Overalls\n7.3 Goggles\n7.4 Safety shoes\n7.5 Safety belt/Harness\n7.6 Reflectorized vest (depends on location of work)\n8. Re-planting activity\n8.1 Basal fertilizer application,\n8.2 Support and/or protective staking\n8.3 Mulching\n9. Maintenance of clean\nand safe area\nTasks may include:\n9.1 Keeping public access paths and roads clear of debris,\nwaste, tools and equipment\n9.2 Disabling tools and equipment after use\n9.3 Using signage and barriers where necessary\n9.4 Removing debris and waste from the work area\n\n--- PDF PAGE 75 ---\nTR Landscape Installation and Maintenance NC II 71\n\nEVIDENCE GUIDE\n\n1. Critical Aspects\nof Competency\nAssessment requires evidence that the candidate:\n1.1 Determined requirements for the removal and replacement of\nlandscape plants\n1.2 Prepared for removal and replacement of landscape plants of\nplants\n1.3 Performed removal and disposal of the subject landscape\nplants\n1.4 Prepared land/soil of the spot for replanting\n1.5 Selected right species and size of the landscape plant for\nreplanting\n1.6 Completed re-planting operations which includes basal\n fertilizer application, support staking, mulching and\n watering (if necessary)\n1.7 Performed post removal and re-planting activity\n1.8 Tasks are done using appropriate tools, equipment and\nprotective/safety devices\n2. Underpinning\nKnowledge and\nAttitude\n\n2.1 Procedures and techniques in the:\n 2.1.1 identification of landscape plants to be removed\n 2.1.2 removal and disposal of subject landscape plants\n 2.1.3 preparation of land/soil\n 2.1.4 selection and use of the right species, size and\n quality of the landscape plant\n 2.1.5 replanting including other activities related to plant\ninstallation in the landscape\n 2.1.6. plant propagation\n2.2 Functions and uses of tools and equipment\n2.3 Values:\n 2.3.1 Diligence\n 2.3.2 Time consciousness\n 2.3.3 Cost consciousness\n 2.3.4 Hygiene consciousness\n 2.3.5 Persistence\n 2.3.6.Systematic and organized\n3. Underpinning\n Skills\n3.1 Use of appropriate tools and equipment and prescribed\nprotective/safety devices in the removal and replacement of\nlandscape plant.\n3.2 Communication skills in receiving instructions and rendering\neven verbal reports about the completed task\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1 Landscape plants and landscaped areas\n4.2 Supplies and materials needed for replanting like soil mixture,\nfertilizer, support materials, mulches, etc\n4.3 Tools and equipment essential in removal and replacement of\nlandscape plant\n4.4 Protective/safety devices\n\n--- PDF PAGE 76 ---\nTR Landscape Installation and Maintenance NC II 72\n\n5. Method of\nAssessment\nCompetency may be assessed through:\n5.1 Direct Observation with Oral Questioning\n5.2 Interview\n5.3 Portfolio\n6. Context of\nAssessment\n6.1 Competency may be assessed individually in the actual\nworkplace or simulation environment in TESDA accredited\ninstitutions.\n\n--- PDF PAGE 77 ---\nTR Landscape Installation and Maintenance NC II 73\nUNIIT OF COMPETENCY: COLLECT, DISPOSE AND UTILIZE ORGANIC WASTE\nUNIT CODE\n: AGR611384\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes required to\ncollect, dispose and utilize organic wastes such as grass\nclippings, leaf litter, weeded undesirable plants, trimming and\npruning debris and other plant-derived organic wastes.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Determine the\nrequirements for\ncollection, disposal\nand utilization of\norganic waste\n1.1 Types of plant-derived organic wastes are determined in\naccordance with the trimming and pruning program\n1.2 Locations where the collected organic wastes will be\ndisposed and/or will be segregated and processed for\nfuture utilization are identified in accordance with the\ntrimming and pruning program\n2. Prepare for\ncollection,\nsegregation,\ndisposal and\nutilization of organic\nwastes\n2.1 Tools, supplies and equipment needed are made ready\nand available for use according to the types of the organic\nwastes and whether these wastes are to be disposed as\nthey are or to be processed and utilized\n2.2 Appropriate safety protective devices are made ready\n and available for use\n3. Gather and dispose\norganic wastes\n3.1 Plant derived organic wastes are collected and disposed in\naccordance with instructions and/or with LMS\n3.2 Collection and disposal are done using prescribed tools and\nequipment\n3.3. Task is conducted using appropriate safety protective\ngadgets\n4. Segregate and\nprocess collected\norganic wastes\n\n4.1 Organic wastes that are to be utilized for specific\npurposes are collected, segregated and processed, if\nnecessary in designated area as per instructions or in\naccordance with LMS\n4.2 Collection, segregation and processing (e.g., conversion of\nwoody organic wastes into chips) are done using prescribed\ntools, supplies and equipment\n4.3 Task is performed using appropriate safety protective\ndevices\n\n--- PDF PAGE 78 ---\nTR Landscape Installation and Maintenance NC II 74\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n5. Make use of organic\nwastes\n5.1 Organic wastes (like palm leaves, twigs and branches of\nshrubs and trees) that are chipped into small materials are\neither mixed with grass clippings or other small organic\nwastes (leaf litter) for composting. Other wood chips are\nused as mulch.\n5.2 Task is performed in accordance with environmental\nstandards and using appropriate protective safety devices\n6. Perform post –\ndisposal and\nutilization of organic\nwaste\n6.1 Tools and equipment are cleaned, maintained and stored as\nper instruction of in accordance with LMS\n6.2 Maintenance of clean and safe area is undertaken\nthroughout and on completion of work\n6.3 Work outputs are recorded or reported to concerned\npersons or authority according to industry practices\n\n--- PDF PAGE 79 ---\nTR Landscape Installation and Maintenance NC II 75\n\n RANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Types of plant-\nderived organic\nwastes\n1.1 Grass clippings/mowed grass\n1.2 Weeded-out plants\n1.2 Hedge and shrub trimmings\n1.3 Pruned palm fronds and leaf sheaths\n1.4 Leaf litter\n1.5 Pruned dying, dead, diseased/infested and live branches\n1.6 Removed/cut dead plants\n2. Locations\nSpecific sites in the following green spaces\n2.1 Club house/ house premises\n2.2 Street corridors\n2.3 Gardens\n2.4 Parks\n2.5 Golf course area (Hole Number, Fairways)\n2.6 Memorial parks\n3. Tools and equipment\n\n2.1 Leaf rake\n2.2 Fork\n2.3 Trash bags\n2.4 Wheel barrow\n2.5 Multi-cab or pick-up\n2.6 Elf and/or mini-dump truck\n2.6 Chipper\n2.7 Shovel\n2.8 Spade\n2.9 Shieve\n3. Protective/safety\ngadgets\n\n3.1 Hat/hard hat\n3.2 Overalls including gloves\n3.3 Shoes/safety shoes\n3.4 Goggles\n3.5 Reflectorized vest (if in risky areas like street/road corridors)\n4. Purpose of utilization\nUse of processed organic wastes may include but not limited to:\n4.1 Compost\n4.2 Mulch materials\n5. Organic wastes\nMay include but are not limited to:\n5.1 Palm leaves\n5.2 Twigs\n5.3 Branches of shrubs and trees\n6. Maintenance of clean\nand safe area\nTasks may include:\n6.1 Keeping public access paths and roads clear of debris,\nwaste, tools and equipment\n6.2 Disabling tools and equipment after use\n6.3 Using signage and barriers where necessary\n6.4Removing debris and waste from the work area\n\n--- PDF PAGE 80 ---\nTR Landscape Installation and Maintenance NC II 76\n\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Determined requirements for the collection, disposal,\nsegregation, processing and utilization of plant-derived\norganic wastes\n1.2 Prepared for collection, disposal, segregation, processing and\nutilization of plant-derived organic wastes\n1.3 Gathered and disposed plant derived organic wastes that are\nnot intended for processing and utilization\n1.4 Converted large organic waste materials into chips\n1.5 Chipped organic wastes are mixed with small-sized\n organic wastes materials and used them to produce\n compost\n1.6 Conducted post operations activities\n2. Underpinning\nKnowledge and\nAttitude\n\n2.1 Procedures and techniques in collection and disposal,\nsegregation, processing and utilization of organic wastes\n2.2 Functions, uses and maintenance of tools and equipment\n2.3 Values\n 2.3.1 Diligence\n 2.3.2 Time consciousness\n 2.3.3 Cost consciousness\n 2.3.4 Hygiene consciousness\n 2.3.5 Persistence\n 2.3.6 Systematic and organized\n3. Underpinning\n Skills\n3.1 Use of appropriate tools and equipment and prescribed\nprotective/safety devices in the collection and disposal,\nsegregation, processing and utilization of organic wastes\n3.2 Communication skills in receiving instructions and in rendering\nsimple written and even oral reports\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1 Plants and landscaped areas\n4.2 Trimming, pruning and other relevant maintenance program\n4.2 Tools and equipment\n4.3 Protective Safety Gadgets\n5. Method of\nAssessment\nCompetency may be assessed through:\n5.1 Direct Observation with Oral Questioning\n5.2 Interview\n5.3 Portfolio\n6. Context of\nAssessment\n6.1 Competency may be assessed individually in the actual\nworkplace or simulation environment in TESDA accredited\ninstitutions.\n\n--- PDF PAGE 81 ---\nTR Landscape Installation and Maintenance NC II 77"
