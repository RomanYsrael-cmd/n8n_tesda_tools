          "source_text": "1.   Identify requirements \nfor installing plant \nsupport \n1.1  Landscape plants in need of plant support are marked \nand counted as per instructions or in accordance with LMS \n1.2 Purpose and method of providing plant support are \ndetermined in accordance with LMS or as per instruction\n2.   Prepare  for \ninstallation of plant \nsupport  \n2.1 Support materials are selected and prepared relevant to \nthe purpose and method of proving plant support or in \naccordance with LMS or as per instructions. \n2.2 Plant support materials are applied with preservatives at \ndesired dosage and length of treatment to prolong \nserviceability as per instructions   \n2.3 Tools, supplies  and equipment needed are prepared  \naccording to the purpose and method of providing plant \nsupport  \n2.4 Appropriate safety protective devices needed to carry out \nthe task are also made ready and available for use\n3.   Install plant support  \n \n3.1 Support materials are installed in accordance with purpose \nand method of proving plant support or in accordance with \nLMS or as per instructions. \n3.2  Plant support installation is undertaken using prescribed \ntools and equipment \n4.   Maintain plant \nsupport  \n4.1 Plant support is inspected and maintained for a period \ndepending on the conditions of the plant or in accordance \nwith LMS  or as per instruction \n4.2 Unserviceable plant support is replaced if necessary or as \ninstructed \n4.3 Plant support is removed/dismantled once it is no longer \nneeded or has served its intended purpose or as instructed \n4.4 Tasks are performed using prescribed tools and equipment \nand appropriate safety protective devices\n5.   Perform post-plant \nsupport activities \n5.1 Plant support materials that dismantled and can still be re-\nused are kept in proper storage as per instruction \n5.2 Tools and equipment are cleaned, maintained and stored \nas per instruction of in accordance with LMS \n5.3  Maintenance of clean and safe area is undertaken \nthroughout  and on completion of work \n5.4   Work outputs are recorded or reported to concerned \npersons or authority according to industry practices\n\n--- PDF PAGE 66 ---\nTR Landscape Installation and Maintenance NC II                                                                             62 \n \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.   Landscape plants  \n1.1  Shrubs and hedges \n1.2  Vines \n1.3  Palms \n1.4  Bamboos \n1.5  Trees \n2. Purpose and methods \nof plant support \n \nDepending on types, sizes and conditions of plants, the \nfollowing methods of providing plant support may be adopted: \n2.1 Support  staking: single, double, triple staking \n2.2 Propping \n2.3 Protective staking or tree guard \n2.4 Guying\n3. Plant support   \n      materials  \nAvailable plant support materials and accessories as specified: \n3.1  Wooden  (lumber) stakes \n3.2  Round wood stakes \n3.3  Bamboo poles \n3.4  Steel  \n3.5  Plastic  \n3.6 Guy materials ( GI wire, GI stranded wire, used  \n       garden hose, cloth, piece of old inner tube)  \n3.7  Pegs (wooden, steel, plastic) \n3.8 Tree ties (rubber pad, belt made of Hessian band,  \n       thick cloth, used rubber interior tire, staple wire )  \n3.9 Nails\n4.   Protective safety \ndevices \n \n \n \n \n \n4.1  Hat/Hard hat \n4.2  Early warning device \n4.3  Goggles \n4.4  Overalls \n4.5  Gloves \n4.6  Safety shoes \n4.7  Reflectorized vest  \n5.   Maintenance of clean \nand safe area \nTasks may include: \n5.1  Keeping public access paths and roads clear of   \n      debris, waste, tools and equipment \n5.2  Disabling tools and equipment after use \n5.3  Using signage and barriers where necessary \n5.4 Removing debris and waste from the work area\n\n--- PDF PAGE 67 ---\nTR Landscape Installation and Maintenance NC II                                                                             63"
