ousness \n       2.8.4  Hygiene consciousness \n       2.8.5   Persistence \n       2.8.6  Systematic and organized \n3. Underpinning Skills \n3.1  Using of appropriate tools and equipment and prescribed \nprotective/safety devices in the application of fertilizers \n3.2  Understanding work procedures \n3.3  Participating in teams and contributing to team objectives \n3.4  Communication skills in receiving instructions and in \nrendering simple written and even oral reports \n4. Resource \nImplications \nThe following resources MUST be provided: \n4.1  Fertilizers materials including other relevant supplies \n4.2  Tools and equipment  \n4.3  Landscape area/landscape plants \n5. Method of \nAssessment \nCompetency may be assessed through: \n5.1  Direct Observation with Oral Questioning \n5.2  Interview \n5.3 Portfolio \n6. Context of \nAssessment \n6.1 Competency may be assessed individually in the actual  \nworkplace or simulation environment in TESDA accredited \ninstitutions.\n",
