        "source_title": "PERFORM SITE PREPARATION ACTIVITIES",
        "source_text": "--- PDF PAGE 34 ---\nTR Landscape Installation and Maintenance NC II                                                                             30 \nUNIT OF COMPETENCY:    PERFORM  SITE PREPARATION ACTIVITIES \nUNIT CODE \n:   AGR611373 \nUNIT DESCRIPTOR \n:   This  unit   covers  the  knowledge,   skills   and   attitudes     \n                                             required to perform site preparation activities for landscape  \n                                             construction.  \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1.   Cultivate land  \n1.1  Cultivate/till/dig land is performed in accordance with \nthe designed plans, specifications or instructions. \n1.2  Land is cultivated using prescribed tools and \nequipment \n1.3  Tasks are performed using appropriate personal \nprotective equipment (PPE) \n2.   Remove construction \ndebris and other \nmaterials \n \n2.1  Construction debris and other materials are gathered \nand removed from site in accordance with the designed \nplans, specifications or instructions. \n2.2  Gathered construction debris are disposed at \ndesignated area \n2.3 Tasks are performed using prescribed tools, equipment  \nand safety protective devices  \n3.   Add amended soil/soil \nmix to cultivated land \n \n3.1 Add/incorporate amended soil/soil mix to cultivated \nland in accordance with ANSI as well as standard \ngeneral nursery specifications or instructions \n3.2 Tasks are performed using prescribed tools and \nequipment and appropriate safety protective devices \n4.  Fine grade and  compact \ncultivated land  \n4.1  Cultivated land is fine graded and compacted in \naccordance with the design specifications as well as \nstandard general grading and compaction \nspecifications or instructions. \n4.2   Pre-planting watering is performed as instructed \n4.3  Tasks are performed using prescribed tools, equipment \nand appropriate safety protective devices\n5.  Perform post-land \npreparation activities \n5.1  Tools and equipment are cleaned, maintained and \nstored according to  established standard practices \n5.2  Maintenance of clean and safe area is undertaken \nthroughout and on completion of work \n5.3  Work output is reported to concerned person or \nauthority according to industry practices\n\n--- PDF PAGE 35 ---\nTR Landscape Installation and Maintenance NC II                                                                             31 \n \n \n RANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.  Personal Protective   \nEquipment \nMay include but are not limited to: \n1.1 Goggles \n1.2 Gloves \n1.3 Hard hat \n1.4 Safety shoes \n1.5 Reflectorized vest   \n 2.  Construction debris \n \nMay include but are not limited to: \n2.1 Cement, metals, gravel, etc. \n2.2 Stones/rocks, hard fan, adobe, etc.   \n2.3 Tree stumps \n2.4 Broken bottles, glass, etc. \n2.5 Garbage \n3.   Compacted \n \n \nSoil is compacted by means of: \n3.1 Water compaction (Pre-planting watering) \n3.2 Roller (Manual or machine operated) \n3.3 Tamper or mechanical compactor\n\n--- PDF PAGE 36 ---\nTR Landscape Installation and Maintenance NC II                                                                             32 \nEVIDENCE GUIDE  \n \n1.  Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 Cultivated land \n1.2 Removed construction debris and materials \n1.3 Added amended soil/mixed soil to cultivate land \n1.4 Fine graded and compacted cultivated land \n1.5 Performed tasks using prescribed tools, equipment and \nappropriate personal protective equipment (PPE) \n1.6 Cleaned, maintained and stored tools and equipment \n1.7 Cleaned and maintained work area \n1.6  Observed OHS practices\n2.  Underpinning \nKnowledge and \nAttitude \n \n2.1   Functions and uses of tools and equipment \n2.2   Familiarity with materials used \n2.3   Basic arithmetic \n2.4   Concept of time  \n2.5   First-aid treatment for minor injuries \n3.  Underpinning Skills \n3.1  Using of handtools and measuring instruments \n3.2  Performing land leveling \n3.3  Basic communication skills \n4.  Resource \nImplications \nThe following resources MUST be provided: \n4.1  Actual area for the activity \n4.2  Tools, materials and equipment related to tasks to be \nperformed \n4.3  Instructions (Oral or written) \n5.  Method of \nAssessment \nCompetency may be assessed through: \n5.1    Direct Observation with Oral Questioning \n5.2    Interview \n5.3    Portfolio \n6.  Context of \nAssessment \n6.1. \nCompetency may be assessed individually in the actual \nworkplace or simulation environment in TESDA accredited \ninstitutions.\n",
