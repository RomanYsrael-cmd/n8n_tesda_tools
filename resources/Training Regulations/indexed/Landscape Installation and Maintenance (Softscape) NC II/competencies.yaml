 is replaced if necessary or as \ninstructed \n4.3 Plant support is removed/dismantled once it is no longer \nneeded or has served its intended purpose or as instructed \n4.4 Tasks are performed using prescribed tools and equipment \nand appropriate safety protective devices\n5.   Perform post-plant \nsupport activities \n5.1 Plant support materials that dismantled and can still be re-\nused are kept in proper storage as per instruction \n5.2 Tools and equipment are cleaned, maintained and stored \nas per instruction of in accordance with LMS \n5.3  Maintenance of clean and safe area is undertaken \nthroughout  and on completion of work \n5.4   Work outputs are recorded or reported to concerned \npersons or authority according to industry practices\n\n--- PDF PAGE 66 ---\nTR Landscape Installation and Maintenance NC II                                                                             62 \n \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.   Landscape plants  \n1.1  Shrubs and hedges \n1.2  Vines \n1.3  Palms \n1.4  Bamboos \n1.5  Trees \n2. Purpose and methods \nof plant support \n \nDepending on types, sizes and conditions of plants, the \nfollowing methods of providing plant support may be adopted: \n2.1 Support  staking: single, double, triple staking \n2.2 Propping \n2.3 Protective staking or tree guard \n2.4 Guying\n3. Plant support   \n      materials  \nAvailable plant support materials and accessories as specified: \n3.1  Wooden  (lumber) stakes \n3.2  Round wood stakes \n3.3  Bamboo poles \n3.4  Steel  \n3.5  Plastic  \n3.6 Guy materials ( GI wire, GI stranded wire, used  \n       garden hose, cloth, piece of old inner tube)  \n3.7  Pegs (wooden, steel, plastic) \n3.8 Tree ties (rubber pad, belt made of Hessian band,  \n       thick cloth, used rubber interior tire, staple wire )  \n3.9 Nails\n4.   Protective safety \ndevices \n \n \n \n \n \n4.1  Hat/Hard hat \n4.2  Early warning device \n4.3  Goggles \n4.4  Overalls \n4.5  Gloves \n4.6  Safety shoes \n4.7  Reflectorized vest  \n5.   Maintenance of clean \nand safe area \nTasks may include: \n5.1  Keeping public access paths and roads clear of   \n      debris, waste, tools and equipment \n5.2  Disabling tools and equipment after use \n5.3  Using signage and barriers where necessary \n5.4 Removing debris and waste from the work area\n\n--- PDF PAGE 67 ---\nTR Landscape Installation and Maintenance NC II                                                                             63 \n \n \nEVIDENCE GUIDE  \n \n1.   Critical Aspects \nof Competency \nAssessment requires evidence that the candidate: \n1.1  Identified requirements for installation of plant support  \n1.2  Prepared for installation of  plant support  \n1.3  Installed plant support  \n1.4  Inspected, maintained, replaced and removed/dismantled   \n       plant support  \n1.5 Conducted post operation activities \n1.6 Performed tasks using appropriate tools, equipment and \nprotective devices \n2. Underpinning \nKnowledge and \nAttitude \n \n2.1  Selection and preparation of appropriate plant support \n2.1  Procedures and techniques in providing plant support \n2.2  Functions, uses and maintenance of tools and equipment \n2.3  Values: \n       2.3.1 Diligence  \n       2.3.2 Time consciousness \n       2.3.3  Cost consciousness \n       2.3.4  Hygiene consciousness \n2.3.5 Persistence \n2.3.6 Systematic and organized \n3. Underpinning  \n      Skills \n3.1  Use of appropriate plant support materials, tools and equipment\n3.2  Communication skills in receiving instructions and in rendering \nsimple written and even oral reports\n4. Resource \nImplications \nThe following resources MUST be provided: \n4.1  Plant support materials  \n4.2  Plants (vines, shrubs, bamboos, palms, trees, bamboos)  and \n/or landscaped area \n4.3 Tools and equipment \n4.4  Protective/safety gadgets\n5. Method of \nAssessment \nCompetency may be assessed through: \n5.1  Direct Observation with Oral Questioning \n5.2  Inter