          "source_text": "1.   Install stakes or staking \n \n1.1 Materials for staking are selected and prepared in \naccordance with the standard landscape specifications, \ninstructions or detailed drawing \n1.2 Stakes are installed in accordance with the specifications, \ninstructions or detailed drawings \n1.3 Paints are applied to all wooden and other visible parts in \naccordance with the specifications, instructions or detailed \ndrawing \n1.4 Tasks in installing stakes are performed using appropriate \nsafety protective devices and prescribed materials, tools \nand equipment. \n1.5 Area is cleaned and restored as per  industry standard \noperating procedures \n \n2.   Install plant guys or \nguying \n2.1 Materials for guying are selected and prepared in \naccordance with the standard landscape specifications, \ninstructions or detailed drawing  \n2.2. Plant guys are installed  in accordance with the \nspecifications, instructions or detailed drawing   \n2.3. Warning signs are installed in areas where guys are \nplaced in accordance with specifications, instructions or \ndetailed drawing \n2.4. Tasks in installing plant guys are performed using \nappropriate safety protective devices and prescribed \nmaterials, tools and equipment. \n2.5. Area is cleaned and restored as per  industry standard \noperating procedures asks are performed using\n3.  Install plant props / \nbraces or proping \nbracing  \n3.1   Materials for plant props / braces  are selected and \nprepared in accordance with the standard landscape \nspecifications, instructions or detailed drawing \n3.2. Plant props / braces are installed in accordance with the \nspecifications, instructions or detailed drawings \n3.3. Paints are applied to all wooden and other visible parts in \naccordance with the specifications, instructions or \ndetailed drawing \n3.4. Tasks in installing plant props or braces  are performed \nusing appropriate safety protective devices and \nprescribed materials, tools and equipment. \n3.5. Area is cleaned and restored as per  industry standard \noperating procedures\n\n--- PDF PAGE 42 ---\nTR Landscape Installation and Maintenance NC II                                                                             38 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.  Materials for staking \nMay include but not limited to: \n1.1  Wooden tree stakes \n1.2  Bamboo stakes \n1.3  Stake ponder \n1.4  Garden hose \n1.5  Coated wire, plant tie or used nylon stocking\n2.  Materials for guying \nMay include but not limited to : \n2.1  Guying anchor / duck-billed soil anchor \n2.2  Reinforcing rod \n2.3  Wires / ropes / metal cables \n2.4  Garden hose \n3.  Materials for plant \nprops / braces \n \nMay include but not limited to: \n3.1 Metal plant props \n3.2 Wood / floor board \n3.3 Screws \n3.4 Metal braces / Grid plant brace\n\n--- PDF PAGE 43 ---\nTR Landscape Installation and Maintenance NC II                                                                             39"
