          "source_text": "1.    Determine  \nrequirements for  \nweeding and \ncultivation activity \n1.1 Weed species and “volunteer” plants (“’invaders”) that are \nout-of-place and considered undesirable in the landscape \nare identified based on specific landscape maintenance \nguidelines or as per instructions. \n1.2  Landscape areas needing weeding and cultivation are \nidentified based on instructions or in accordance with LMS\n2.    Prepare for  weeding \nand cultivation \noperation  \n \n2.1  List of weeds and “volunteer plants” and the map of specific \nlandscape areas are prepared and secured \n2.2  Method and purpose of weeding are determined based \non the type of weed species and out-of-place “volunteer” \nspecies \n2.3 Tools, supplies and equipment needed are made ready \nand available for use according to the types of weeds and \n“volunteer” species that needs removal \n2.4  Appropriate safety protective devices are prepared for \nuse\n3.    Conduct weeding and \nremoval of  “volunteer” \nspecies      \n \n3.1  Weeds and out-of-place “volunteer” plant species in the \nlandscape are removed and disposed in accordance with \nlandscape maintenance standard or as per instructions. \n3.2  Weeds and out-of-place “volunteer” plant species are \nremoved using prescribed tools and equipment \n3.3 Tasks are done using appropriate safety/protective devices\n4.  Determine  compacted \nsoil  \n4.1 Compacted soil or soil that is having problem with aeration, \nwater infiltration and conditions for root development is   \ndetermined as per established practice \n4.2  Effects of compacted soil on root development and \nanchorage are recognized \n4.3  Method and purpose of soil cultivation are determined \nbased on the conditions of the soil\n\n--- PDF PAGE 49 ---\nTR Landscape Installation and Maintenance NC II                                                                             45 \n \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n5. Cultivate compacted   \n      soil  \n5.1 Compacted soil is cultivated simultaneous with weeding \noperations in accordance with landscape maintenance \nstandards or as per instructions \n5.2   Soil cultivation is done using appropriate tools and  \nequipment \n5.3  Task is performed using prescribed safety/protective  \ndevices\n6.   Perform post- weeding \nand soil cultivation \nactivities \n6.1 Tools and equipment are cleaned, maintained and stored as \nper instruction of in accordance with LMS \n6.2  Maintenance of clean and safe area is undertaken \nthroughout  and on completion of work \n6.3  Work outputs are recorded or reported to concerned \npersons or authority according to industry practices\n\n--- PDF PAGE 50 ---\nTR Landscape Installation and Maintenance NC II                                                                             46 \n \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.   Weed species and \nvolunteer plants \n(invaders)  \n1.1 Weeds \n1.1.1 Grass \n1.1.2 Sedges \n1.1.3 Shrubs  \n1.1.4 Vines \n1.2 Out-of-place “volunteer” plant species are those that grow \nnaturally in the site and are competing with desirable \nplants, making the site ugly and/or are eye-sore in the \nlandscape. Volunteer species can be landscape plants \nbut is not included in the landscape design\n2.   Landscape areas \nMay include but are not limited to:  \n2.1  Lawn  \n2.2  Flower beds \n2.3  Hedges and shrubs landscape area \n2.4. Tree lawn or tree planting verges \n3.   Methods of weed control\n \n3.1  Manual weeding \n3.2  Mechanical weeding \n3.3  Chemical weeding  \n4.   Purpose of weeding  \n4.1  Release the desirable landscape plants from competition \nof weeds and out-of-place “volunteer” species \n4.2  Improve the health conditions of the landscape plants  \n4.3  Lessen susceptibility of the landscape plants from pest \nand disease attack\n5.   Methods of soil \ncultivation \n5.1  Manual  \n5.2  Mechanical \n6.   Purpose of soil \ncultivation \n6.1  Improve soil structure, porosity, aeration and water \ninfiltration \n6.2  Improve conditions for root system development and root \nanchorage \n6.3  Improve water and nutrient absorption \n6.4  Enhance soil macro and micro-organisms activity\n7.   Supplies, tools and \nequipment for weeding \noperations \n \n \n \n7.1 Small bolo “dulos” \n7.2  Scythe (“Karit”) \n7.3  Small round/flat bar \n7.4  Spade \n7.5  Trowel \n7.6  Chemicals (Types: Selective herbicide; Wide spectrum)\n\n--- PDF PAGE 51 ---\nTR Landscape Installation and Maintenance NC II                                                                             47 \n \nVARIABLE \nRANGE \n8.  Tools and equipment for \nsoil cultivator \n8.1  Small bolo (“dulos”) \n8.2  Small round/flat bar \n8.3  Spade \n8.4  Soil cultivating machine\n9.   Protective/safety \ndevices used in \nweeding and cultivation\n9.1  Goggles \n9.2  Overalls, gloves \n9.3  Reflectorized vest (depends on location of work)\n10.  Maintenance of clean \nand safe area \nTasks may include: \n10.1 Keeping public access paths and roads clear of   \n         debris, waste, tools and equipment \n10.2 Disabling tools and equipment after use \n10.3 Using signage and barriers where necessary \n10.4 Removing debris and waste from the work area\n\n--- PDF PAGE 52 ---\nTR Landscape Installation and Maintenance NC II                                                                             48"
