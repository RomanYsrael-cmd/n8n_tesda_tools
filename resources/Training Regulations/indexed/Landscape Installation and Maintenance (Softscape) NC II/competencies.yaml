        "source_title": "Perform rough grading operations",
        "source_text": "--- PDF PAGE 31 ---\nTR Landscape Installation and Maintenance NC II                                                                             27 \n \n \nUNIIT OF COMPETENCY:     PERFORM ROUGH GRADING OPERATIONS  \nUNIT CODE \n: \n AGR611372 \nUNIT DESCRIPTOR       :      This unit covers the knowledge, skills and attitudes required to \nperform rough grading operations for drainage and erosion \ncontrol.   \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1.   Rough grade site \n1.1  Rough site grading is performed to achieve desired \nelevations or slopes by cut or fill in accordance with the \ndesigned grading plans, specifications or instructions. \n1.2  Site is graded roughly using prescribed tools and \nequipment in accordance with standards of rough \ngrading practice. \n1.3  Task is performed using appropriate personal \nprotective equipment (PPE) \n2.   Provide surface \ndrainage and shape or \nform the land \n \n2.1 Site is graded to drain surface water and to shape the \nland in accordance with the designed grading plans \nand instructions \n2.2 Tasks is performed using prescribed tools, equipment \nand personal protective equipment (PPE) \n3.  Perform post-rough \ngrading operations \n3.1  Newly graded site is protected against human, animal \nand mechanical disturbance, and other potential \nhazards like inclement weather   \n3.2  Site grading tools and equipment are cleaned, \nmaintained and stored according to  established \nstandard practices \n3.3  Maintenance of clean and safe area is undertaken \nthroughout and upon completion of work \n3.4  Work output is reported to concerned person or \nauthority according to industry practices\n\n--- PDF PAGE 32 ---\nTR Landscape Installation and Maintenance NC II                                                                             28 \n RANGE OF VARIABLES \n \nVARIABLE \nRANGE \n 1.   Personal Protective \nEquipment (PPE) \n \nMay include but are not limited to: \n1.1.  Goggles \n1.2. Gloves \n1.3. Safety belts, shoes, etc. \n1.4. Reflectorized vest\n2 Site Grading tools \n2.1 Picks \n2.2 Shovels \n2.3 Leveling tools \n2.4 Compass \n2.5 Distance Measuring tools, nylon wires, stakes \n2.6 Wheelbarrows, buggies, rubber hoses, etc \n2.7\nGround labeling tools\n\n--- PDF PAGE 33 ---\nTR Landscape Installation and Maintenance NC II                                                                             29 \n \nEVIDENCE GUIDE  \n \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1  Rough graded site to designed elevations or slopes \n1.2  Provided surface drainage and shape or formed the land \n1.3  Performed tasks using prescribed tool, equipment and \nappropriate personal protective equipment (PPE) \n1.4  Cleaned, maintained and stored tools and equipment \n1.5  Cleaned and maintained work area \n1.6  Observed OHS practices \n2. Underpinning \nKnowledge and \nAttitude \n \n2.1  Functions and uses of tools   \n2.2  Basic arithmetic \n2.3  Concept of time \n2.4  First-aid treatment for minor injuries \n \n3. Underpinning Skills \n3.1  Using hand tools   \n3.2  Basic communication skills \n4. Resource \nImplications \nThe following resources MUST be provided: \n4.1  Actual area for the activity \n4.2  Tools and materials  related to tasks to be performed \n4.3  Designed Plan / Instructions (Oral or written) \n \n5. Method of \nAssessment \nCompetency may be assessed through: \n5.1    Direct Observation with Oral Questioning \n5.2    Interview \n5.3    Portfolio \n6. Context of \nAssessment \n6.1 \nCompetency may be assessed individually in the actual \nworkplace or simulation environment in TESDA accredited \ninstitutions.\n",
