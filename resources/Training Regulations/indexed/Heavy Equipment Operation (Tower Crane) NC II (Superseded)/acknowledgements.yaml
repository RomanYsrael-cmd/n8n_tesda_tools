    },
    {
      "source_text": "5. Workplace interactions 5.1. Face to face 5.2. Telephone 5.3. Electronic and two way radio 5.4. Written including electronic, memos, instruction and forms, non-verbal including gestures, signals, signs and diagrams 6. Protocols 6.1. Observing meeting 6.2. Compliance with meeting decisions 6.3. Obeying meeting instructions"
