    {
      "source_text": "SECTION 1 HEAVY-EQUIPMENT OPERATION - TOWER CRANE"
    },
    {
      "source_text": "The HEAVY-EQUIPMENT OPERATION (TOWER CRANE) NC II qualification consists of competencies that workers must achieve to enable them to perform tasks such as lifting and transferring of heavy loads in construction sites or other locations with the use of tower crane."
    },
    {
      "source_text": "This qualification is packaged from the competency map of Construction - Heavy Equipment sub-sector as shown in Annex A."
    },
    {
      "source_text": "The units of competency comprising this qualification include the following:"
    },
    {
      "source_text": "CODE NO. BASIC COMPETENCIES"
    },
    {
      "source_text": "Units of Competency 500311105 Participate in workplace communication 500311106 Work in a team environment 500311107 Practice career professionalism 500311108 Practice occupational health and safety procedures"
    },
    {
      "source_text": "CODE NO. COMMON COMPETENCIES"
    },
    {
      "source_text": "Units of Competency CON931201 Prepare construction materials and tools CON311201 Observe procedures, specifications and manuals of instruction CON311202 Interpret technical drawings and plans CON311203 Perform mensurations and calculations CON311204 Maintain tools and equipment"
    },
    {
      "source_text": "CODE NO. CORE COMPETENCIES CON833309 Perform pre- and post-operation procedures for lifting equipment CON833314 Perform productive operation for tower crane"
    },
    {
      "source_text": "A person who has achieved this Qualification is competent to be a –"
    },
    {
      "source_text": " Tower-crane operator"
    },
    {
      "source_text": "-- PDF PAGE 5 --- TR HEAVY-EQUIPMENT OPERATION (Tower Crane) Promulgated December 2004/July 2007 4 / 69"
