  "source_text": "ACKNOWLEDGEMENTS\n\n--- PDF PAGE 4 ---\nTR HEAVY-EQUIPMENT OPERATION (Tower Crane) Promulgated December 2004/July 2007\n3 / 69\n\nTRAINING REGULATIONS FOR\n\nHEAVY-EQUIPMENT OPERATION (TOWER CRANE) NC II\n\nSECTION 1 HEAVY-EQUIPMENT OPERATION - TOWER CRANE\n\nThe HEAVY-EQUIPMENT OPERATION (TOWER CRANE) NC II\nqualification consists of competencies that workers must achieve to enable them\nto perform tasks such as lifting and transferring of heavy loads in construction\nsites or other locations with the use of tower crane.\n\nThis qualification is packaged from the competency map of Construction -\nHeavy Equipment sub-sector as shown in Annex A.\n\nThe units of competency comprising this qualification include the following:\n\nCODE NO.\nBASIC COMPETENCIES\n\nUnits of Competency\n500311105\nParticipate in workplace communication\n500311106\nWork in a team environment\n500311107\nPractice career professionalism\n500311108\nPractice occupational health and safety procedures\n\nCODE NO.\nCOMMON COMPETENCIES\n\nUnits of Competency\nCON931201\nPrepare construction materials and tools\nCON311201\nObserve procedures, specifications and manuals of instruction\nCON311202\nInterpret technical drawings and plans\nCON311203\nPerform mensurations and calculations\nCON311204\nMaintain tools and equipment\n\nCODE NO.\nCORE COMPETENCIES\nCON833309\nPerform pre- and post-operation procedures for lifting\nequipment\nCON833314\nPerform productive operation for tower crane\n\nA person who has achieved this Qualification is competent to be a –\n\n Tower-crane operator\n\n--- PDF PAGE 5 ---\nTR HEAVY-EQUIPMENT OPERATION (Tower Crane) Promulgated December 2004/July 2007\n4 / 69\n\nSECTION 2 COMPETENCY STANDARDS\n\nThis section gives the details and contents of the units of competency\nrequired in HEAVY-EQUIPMENT OPERATION (TOWER CRANE) NC II. These\nunits of competency are categorized into basic, common and core competencies.\n\nBASIC COMPETENCIES\n\nUNIT OF COMPETENCY:\nPARTICIPATE IN WORKPLACE COMMUNICATION\nUNIT CODE :\n500311105\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes required to\ngather, interpret and convey information in response to\nworkplace requirements.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Obtain and convey\nworkplace\ninformation\n1.1 Specific and relevant information is accessed from\nappropriate sources\n1.2 Effective questioning , active listening and speaking skills are\nused to gather and convey information\n1.3 Appropriate medium is used to transfer information and ideas\n1.4 Appropriate non- verbal communication is used\n1.5 Appropriate lines of communication with supervisors and\ncolleagues are identified and followed\n1.6 Defined workplace procedures for the location and storage of\ninformation are used\n1.7 Personal interaction is carried out clearly and concisely\n2. Participate in\nworkplace\nmeetings and\ndiscussions\n2.1 Team meetings are attended on time\n2.2 Own opinions are clearly expressed and those of others are\nlistened to without interruption\n2.3 Meeting inputs are consistent with the meeting purpose and\nestablished protocols\n2.4 Workplace interactions are conducted in a courteous\nmanner\n2.5 Questions about simple routine workplace procedures and\nmaters concerning working conditions of employment are\nasked and responded to\n2.6 Meetings outcomes are interpreted and implemented\n\n--- PDF PAGE 6 ---\nTR HEAVY-EQUIPMENT OPERATION (Tower Crane) Promulgated December 2004/July 2007\n5 / 69\n\n3. Complete relevant\nwork related\ndocuments\n3.1 Range of forms relating to conditions of employment are\ncompleted accurately and legibly\n3.2 Workplace data is recorded on standard workplace forms and\ndocuments\n3.3 Basic mathematical processes are used for routine\ncalculations\n3.4 Errors in recording information on forms/ documents are\nidentified and properly acted upon\n3.5 Reporting requirements to supervisor are completed\naccording to organizational guidelines\n\n--- PDF PAGE 7 ---\nTR HEAVY-EQUIPMENT OPERATION (Tower Crane) Promulgated December 2004/July 2007\n6 / 69\n\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Appropriate sources\n1.1. Team members\n1.2. Suppliers\n1.3. Trade personnel\n1.4. Local government\n1.5. Industry bodies\n2. Medium\n2.1. Memorandum\n2.2. Circular\n2.3. Notice\n2.4. Information discussion\n2.5. Follow-up or verbal instructions\n2.6. Face to face communication\n3. Storage\n3.1. Manual filing system\n3.2. Computer-based filing system\n4. Forms\n4.1. Personnel forms, telephone message forms, safety\nreports\n\n5. Workplace interactions\n5.1. Face to face\n5.2. Telephone\n5.3. Electronic and two way radio\n5.4. Written including electronic, memos, instruction and\nforms, non-verbal including gestures, signals, signs\nand diagrams\n6. Protocols\n6.1. Observing meeting\n6.2. Compliance with meeting decisions\n6.3. Obeying meeting instructions\n\n--- PDF PAGE 8 ---\nTR HEAVY-EQUIPMENT OPERATION (Tower Crane) Promulgated December 2004/July 2007\n7 / 69\n\nEVIDENCE GUIDE\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1. Prepared written communication following standard\nformat of the organization\n1.2. Accessed information using communication equipment\n1.3. Made use of relevant terms as an aid to transfer\ninformation effectively\n1.4. Conveyed information effectively adopting the formal\nor informal communication\n2. Underpinning\nKnowledge and Attitudes\n\n2.1. Effective communication\n2.2. Different modes of communication\n2.3. Written communication\n2.4. Organizational policies\n2.5. Communication procedures and systems\n2.6. Technology relevant to the enterprise and the\nindividual’s work responsibilities\n3. Underpinning Skills\n3.1. Follow simple spoken language\n3.2. Perform routine workplace duties following simple\nwritten notices\n3.3. Participate in workplace meetings and discussions\n3.4. Complete work related documents\n3.5. Estimate, calculate and record routine workplace\nmeasures\n3.6. Basic mathematical processes of addition, subtraction,\ndivision and multiplication\n3.7. Ability to relate to people of social range in the\nworkplace\n3.8. Gather and provide information in response to\nworkplace Requirements\n4. Resource Implications\n4.1. Fax machine\n4.2. Telephone\n4.3. Writing materials\n4.4. Internet\n5. Methods of Assessment\n5.1. Direct Observation\n5.2. Oral interview and written test\n6. Context of Assessment\n6.1. Competency may be assessed individually in the\nactual workplace or through accredited institution\n\n--- PDF PAGE 9 ---\nTR HEAVY-EQUIPMENT OPERATION (Tower Crane) Promulgated December 2004/July 2007\n8 / 69\n\nUNIT OF COMPETENCY:\nWORK IN TEAM ENVIRONMENT\nUNIT CODE :\n500311106\nUNIT DESCRIPTOR : This unit covers the skills, knowledge and attitudes to\nidentify role and responsibility as a member of a team.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Describe team role and\nscope\n1.1. The role and objective of the team is identified from\navailable sources of information\n1.2. Team parameters, reporting relationships and\nresponsibilities are identified from team discussions\nand appropriate external sources\n2. Identify own role and\nresponsibility within\nteam\n2.1. Individual role and responsibilities within the team\nenvironment are identified\n2.2. Roles and responsibility of other team members are\nidentified and recognized\n2.3. Reporting relationships within team and external to\nteam are identified\n3. Work as a team\nmember\n3.1. Effective and appropriate forms of communications\nused and interactions undertaken with team members\nwho contribute to known team activities and objectives\n3.2. Effective and appropriate contributions made to\ncomplement team activities and objectives, based on\nindividual skills and competencies and workplace\ncontext\n3.3. Observed protocols in reporting using standard\noperating procedures\n3.4. Contribute to the development of team work plans\nbased on an understanding of team’s role and\nobjectives and individual competencies of the\nmembers.\n\n--- PDF PAGE 10 ---\nTR HEAVY-EQUIPMENT OPERATION (Tower Crane) Promulgated December 2004/July 2007\n9 / 69\n\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Role and objective of\nteam\n1.1. Work activities in a team environment with enterprise\nor specific sector\n1.2. Limited discretion, initiative and judgement maybe\ndemonstrated on the job, either individually or in a\nteam environment\n2. Sources of information\n2.1. Standard operating and/or other workplace\nprocedures\n2.2. Job procedures\n2.3. Machine/equipment manufacturer’s specifications and\ninstructions\n2.4. Organizational or external personnel\n2.5. Client/supplier instructions\n2.6. Quality standards\n2.7. OHS and environmental standards\n3. Workplace context\n3.1. Work procedures and practices\n3.2. Conditions of work environments\n3.3. Legislation and industrial agreements\n3.4. Standard work practice including the storage, safe\nhandling and disposal of chemicals\n3.5. Safety, environmental, housekeeping and quality\nguidelines\n\n--- PDF PAGE 11 ---\nTR HEAVY-EQUIPMENT OPERATION (Tower Crane) Promulgated December 2004/July 2007\n10 / 69\n\nEVIDENCE GUIDE\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1. Operated in a team to complete workplace activity\n1.2. Worked effectively with others\n1.3. Conveyed information in written or oral form\n1.4. Selected and used appropriate workplace language\n1.5. Followed designated work plan for the job\n1.6. Reported outcomes\n2. Underpinning\nKnowledge and Attitude\n2.1. Communication process\n2.2. Team structure\n2.3. Team roles\n2.4. Group planning and decision making\n3. Underpinning Skills\n3.1. Communicate appropriately, consistent with the culture\nof the workplace\n\n4. Resource Implications\nThe following resources MUST be provided:\n4.1. Access to relevant workplace or appropriately\nsimulated environment where assessment can take\nplace\n4.2. Materials relevant to the proposed activity or tasks\n5. Methods of Assessment\nCompetency may be assessed through:\n5.1. Observation of the individual member in relation to\nthe work activities of the group\n5.2. Observation of simulation and or role play involving the\nparticipation of individual member to the attainment of\norganizational goal\n5.3. Case studies and scenarios as a basis for discussion\nof issues and strategies in teamwork\n6. Context for Assessment\n6.1. Competency may be assessed in workplace or in a\nsimulated workplace setting\n6.2. Assessment shall be observed while task are being\nundertaken whether individually or in group\n\n--- PDF PAGE 12 ---\nTR HEAVY-EQUIPMENT OPERATION (Tower Crane) Promulgated December 2004/July 2007\n11 / 69\n\nUNIT OF COMPETENCY:\nPRACTICE CAREER PROFESSIONALISM\nUNIT CODE :\n500311107\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes in\npromoting career growth and advancement.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\n1. Integrate personal\nobjectives with\norganizational goals\n1.1 Personal growth and work plans are pursued towards\n improving the qualifications set for the profession\n1.2 Intra- and interpersonal relationships is are maintained in\n the course of managing oneself based on performance\n evaluation\n1.3 Commitment to the organization and its goal is\n demonstrated in the performance of duties\n2. Set and meet work\npriorities\n2.1 Competing demands are prioritized to achieve personal,\n team and organizational goals and objectives.\n2.2 Resources are utilized efficiently and effectively to\n manage work priorities and commitments\n2.3 Practices along economic use and maintenance of\n equipment and facilities are followed as per established\n procedures\n3. Maintain professional\ngrowth and development\n3.1 Trainings and career opportunities are identified and\navailed of based on job requirements\n3.2 Recognitions are sought/received and demonstrated\nas proof of career advancement\n3.3 Licenses and/or certifications relevant to job and\ncareer are obtained and renewed\n\n--- PDF PAGE 13 ---\nTR HEAVY-EQUIPMENT OPERATION (Tower Crane) Promulgated December 2004/July 2007\n12 / 69\n\n RANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Evaluation\n1.1 Performance Appraisal\n1.2 Psychological Profile\n1.3 Aptitude Tests\n2. Resources\n2.1 Human\n2.2 Financial\n2.3 Technology\n2.3.1 Hardware\n2.3.2 Software\n3. Trainings and career\nopportunities\n3.1 Participation in training programs\n 3.1.1 Technical\n 3.1.2 Supervisory\n 3.1.3 Managerial\n 3.1.4 Continuing Education\n3.2 Serving as Resource Persons in conferences and\nworkshops\n4. Recognitions\n4.1 Recommendations\n4.2 Citations\n4.3 Certificate of Appreciation\n4.4 Commendations\n4.5 Awards\n4.6 Tangible and Intangible Rewards\n5. Licenses and/or\ncertifications\n5.1 National Certificates\n5.2 Certificate of Competency\n5.3 Support Level Licenses\n5.4 Professional Licenses\n\n EVIDENCE GUIDE\n\n--- PDF PAGE 14 ---\nTR HEAVY-EQUIPMENT OPERATION (Tower Crane) Promulgated December 2004/July 2007\n13 / 69\n\n 1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Attained job targets within key result areas (KRAs)\n1.2 Maintained intra - and interpersonal relationship in the\ncourse of managing oneself based on performance\nevaluation\n1.3 Completed trainings and career opportunities which are\nbased on the requirements of the industries\n1.4 Acquired and maintained licenses and/or certifications\naccording to the requirement of the qualification\n2. Underpinning\nKnowledge\n2.1 Work values and ethics (Code of Conduct, Code of\nEthics, etc.)\n2.2 Company policies\n2.3 Company operations, procedures and standards\n2.4 Fundamental rights at work including gender sensitivity\n2.4 Personal hygiene practices\n3. Underpinning Skills\n3.1 Appropriate practice of personal hygiene\n3.2 Intra and Interpersonal skills\n3.3 Communication skills\n4. Resource Implications\nThe following resources MUST be provided:\n4.1 Workplace or assessment location\n4.2 Case studies/scenarios\n5. Methods of Assessment Competency may be assessed through:\n5.1 Portfolio Assessment\n5.2 Interview\n5.3 Simulation/Role-plays\n5.4 Observation\n5.5 Third Party Reports\n5.6 Exams and Tests\n6. Context of Assessment\n6.1 Competency may be assessed in the work place or in a\nsimulated work place setting\n\nUNIT OF COMPETENCY :\nPRACTICE OCCUPATIONAL HEALTH AND SAFETY\n\n--- PDF PAGE 15 ---\nTR HEAVY-EQUIPMENT OPERATION (Tower Crane) Promulgated December 2004/July 2007\n14 / 69\n\nPROCEDURES\nUNIT CODE : 500311108\nUNIT DESCRIPTOR :\nThis unit covers the outcomes required to comply with\nregulatory\nand\norganizational\nrequirements\nfor\noccupational health and safety.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\n1. Identify hazards and risks\n1.1 Safety regulations and workplace safety and\nhazard control practices and procedures are\nclarified and explained based on organization\nprocedures\n1.2 Hazards/risks in the workplace and their\ncorresponding indicators are identified to minimize\nor eliminate risk to co-workers, workplace and\nenvironment in accordance with organization\nprocedures\n1.3 Contingency measures during workplace\naccidents, fire and other emergencies are\nrecognized and established in accordance with\norganization procedures\n2. Evaluate hazards and risks\n2.1 Terms of maximum tolerable limits which when\nexceeded will result in harm or damage are\nidentified based on threshold limit values (TLV)\n2.2 Effects of the hazards are determined\n2.3 OHS issues and/or concerns and identified safety\nhazards are reported to designated personnel in\naccordance with workplace requirements and\nrelevant workplace OHS legislation\n3. Control hazards and risks\n3.1 Occupational Health and Safety (OHS) procedures\nfor controlling hazards/risks in workplace are\nconsistently followed\n3.2 Procedures for dealing with workplace accidents,\nfire and emergencies are followed in accordance\nwith organization OHS policies\n3.3 Personal protective equipment (PPE) is correctly\nused in accordance with organization OHS\nprocedures and practices\n3.4 Appropriate assistance is provided in the event of a\nworkplace emergency in accordance with\nestablished organization protocol\n\n--- PDF PAGE 16 ---\nTR HEAVY-EQUIPMENT OPERATION (Tower Crane) Promulgated December 2004/July 2007\n15 / 69\n\n4. Maintain OHS awareness\n4.1 Emergency-related drills and trainings are\nparticipated in as per established organization\nguidelines and procedures\n4.2 OHS personal records are completed and updated\nin accordance with workplace requirements\n\n--- PDF PAGE 17 ---\nTR HEAVY-EQUIPMENT OPERATION (Tower Crane) Promulgated December 2004/July 2007\n16 / 69\n\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Safety regulations\nMay include but are not limited to:\n1.1 Clean Air Act\n1.2 Building code\n1.3 National Electrical and Fire Safety Codes\n1.4 Waste management statutes and rules\n1.5 Philippine Occupational Safety and Health Standards\n1.6 DOLE regulations on safety legal requirements\n1.7 ECC regulations\n2. Hazards/Risks\nMay include but are not limited to:\n2.1 Physical hazards – impact, illumination, pressure, noise,\n vibration, temperature, radiation\n2.2 Biological hazards- bacteria, viruses, plants, parasites,\n mites, molds, fungi, insects\n2.3 Chemical hazards – dusts, fibers, mists, fumes, smoke,\n gasses, vapors\n2.4 Ergonomics\n2.4.1 Psychological factors – over exertion/ excessive\nforce, awkward/static positions, fatigue, direct\npressure, varying metabolic cycles\n2.4.2 Physiological factors – monotony, personal\nrelationship, work out cycle\n3. Contingency measures\nMay include but are not limited to:\n3.1 Evacuation\n3.2 Isolation\n3.3 Decontamination\n3.4 (Calling designed) emergency personnel\n4. PPE\nMay include but are not limited to:\n4.1 Mask\n4.2 Gloves\n4.3 Goggles\n4.4 Hair Net/cap/bonnet\n4.5 Face mask/shield\n4.6 Ear muffs\n4.7 Apron/Gown/coverall/jump suit\n4.8 Anti-static suits\n\n--- PDF PAGE 18 ---\nTR HEAVY-EQUIPMENT OPERATION (Tower Crane) Promulgated December 2004/July 2007\n17 / 69\n\n5. Emergency-related drills\nand training\n5.1 Fire drill\n5.2 Earthquake drill\n5.3 Basic life support/CPR\n5.4 First aid\n5.5 Spillage control\n5.6 Decontamination of chemical and toxic\n5.7 Disaster preparedness/management\n6. OHS personal records\n6.1 Medical/Health records\n6.2 Incident reports\n6.3 Accident reports\n6.4 OHS-related training completed\n\n--- PDF PAGE 19 ---\nTR HEAVY-EQUIPMENT OPERATION (Tower Crane) Promulgated December 2004/July 2007\n18 / 69\n\n EVIDENCE GUIDE\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Explained clearly established workplace safety and\nhazard control practices and procedures\n1.2 Identified hazards/risks in the workplace and its\ncorresponding indicators in accordance with company\nprocedures\n1.3 Recognized contingency measures during workplace\naccidents, fire and other emergencies\n1.4 Identified terms of maximum tolerable limits based on\nthreshold limit value- TLV.\n1.5 Followed Occupational Health and Safety (OHS)\nprocedures for controlling hazards/risks in workplace\n1.6 Used Personal Protective Equipment (PPE) in\naccordance with company OHS procedures and\npractices\n1.7 Completed and updated OHS personal records in\naccordance with workplace requirements\n2. Underpinning\nKnowledge and\n Attitude\n2.1 OHS procedures and practices and regulations\n2.2 PPE types and uses\n2.3 Personal hygiene practices\n2.4 Hazards/risks identification and control\n2.5 Threshold Limit Value -TLV\n2.6 OHS indicators\n2.7 Organization safety and health protocol\n2.8 Safety consciousness\n2.9 Health consciousness\n3. Underpinning\n Skills\n3.1 Practice of personal hygiene\n3.2 Hazards/risks identification and control skills\n3.3 Interpersonal skills\n3.4 Communication skills\n4. Resource Implications\nThe following resources must be provided:\n4.1 Workplace or assessment location\n4.2 OHS personal records\n4.3 PPE\n4.4 Health records\n\n--- PDF PAGE 20 ---\nTR HEAVY-EQUIPMENT OPERATION (Tower Crane) Promulgated December 2004/July 2007\n19 / 69\n\n5. Methods of Assessment\nCompetency may be assessed through:\n5.1 Portfolio Assessment\n5.2 Interview\n5.3 Case Study/Situation\n6. Context for Assessment\n6.1 Competency may be assessed in the work place or in a\nsimulated work place setting\n\n--- PDF PAGE 21 ---\nTR HEAVY-EQUIPMENT OPERATION (Tower Crane) Promulgated December 2004/July 2007\n20 / 69\n\nCOMMON COMPETENCIES\n\nUNIT OF COMPETENCY:\nPREPARE CONSTRUCTION MATERIALS AND TOOLS\nUNIT CODE :\nCON931201\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes on\nidentifying, requesting and receiving construction materials\nand tools based on the required performance standards.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variable\n1. Identify materials\n\n1.1 Materials are listed as per job requirements\n1.2 Quantity and description of materials conform\nwith the job requirements\n1.3 Tools and accessories are identified according to\njob requirements\n2. Requisition materials\n\n2.1 Materials and tools needed are requested\n according to the list prepared\n2.2 Request is done as per company standard\n operating procedures (SOP)\n2.2 Substitute materials and tools are provided without\n sacrificing cost and quality of work\n3. Receive and inspect\n materials\n3.1 Materials and tools issued are inspected as per\nquantity and specification\n3.2 Tools, accessories and materials are checked for\ndamages according to enterprise procedures\n3.3 Materials and tools are set aside to appropriate\nlocation nearest to the workplace\n\n--- PDF PAGE 22 ---\nTR HEAVY-EQUIPMENT OPERATION (Tower Crane) Promulgated December 2004/July 2007\n21 / 69\n\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Materials and Tools\n\n1.1 Electrical supplies\n1.2 Structural\n1.3 Plumbing\n1.4 Welding/pipefitting\n1.5 Carpentry\n1.6 Masonry\n2. Description of Materials and\nTools\n\n2.1 Brand name\n2.2 Size\n2.3 Capacity\n2.4 Kind of application\n3. Company standard\nprocedures\n3.1 Job order\n3.2 Requisition slip\n3.3 Borrower slip\n\n--- PDF PAGE 23 ---\nTR HEAVY-EQUIPMENT OPERATION (Tower Crane) Promulgated December 2004/July 2007\n22 / 69\n\nEVIDENCE GUIDE\n1. Critical aspects\nof competency\n\nAssessment requires evidence that the candidate:\n1.1 Listed materials and tools according to quantity and job\nrequirements\n1.2 Requested materials and tools according to the list prepared\nand as per company SOP\n1.3 Inspected issued materials and tools as per quantity and job\nspecifications\n1.4 Tools provided with appropriate safety devices\n2. Underpinning\nknowledge\n\n2.1 Types and uses of construction materials and tools\n2.2 Different forms\n2.3 Requisition procedures\n3. Underpinning\nskills\n\n3.1 Preparing materials and tools\n3.2 Proper handling of tools and equipment\n3.3 Following instructions\n4. Resource\nimplications\n\nThe following resources should be provided:\n4.1 Workplace location\n4.2 Materials relevant to the unit of competency\n4.3 Technical plans, drawings and specifications relevant to the\nactivities\n5. Methods of\nassessment\nCompetency in this unit must be assessed through:\n5.1 Direct observation and oral questioning\n6. Context of\nassessment\n\n6.1 Competency may be assessed in the workplace or in a\nsimulated workplace\n6.2 Competency assessment must be undertaken in accordance\nwith the endorsed TESDA assessment guidelines\n\n--- PDF PAGE 24 ---\nTR HEAVY-EQUIPMENT OPERATION (Tower Crane) Promulgated December 2004/July 2007\n23 / 69\n\nUNIT O