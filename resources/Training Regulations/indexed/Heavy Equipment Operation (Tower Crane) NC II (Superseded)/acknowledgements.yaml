g equipment checklist and\n with engine stopped/not running.\n1.4 Demonstrates ability to perform walk-around check while\n engine is running\n1.5 Demonstrates ability to observe risk-control/safe procedures\n1.6 Demonstrates ability to perform post-operation checking\n procedures\n1.7 Demonstrates ability to accomplish and submit daily\n equipment time report (DETR)\n2. Underpinning\n(related)\nknowledge\n\n2.1 Types and uses of personal protective equipment (PPE)\n2.2 Controls, instruments, indicators and their usage\n2.3 Start-up and shutdown procedures\n2.4 Use of manufacturer’s operation manuals\n2.5 Familiarity with job site and work conditions\n2.6 Familiarity with pre- and post-operation checklist\n3. Underpinning\nskills\n\n3.1 Performing pre- and post-operation procedures of\n equipment using standard or special attachments\n3.2 Using personal protective equipment\n3.3 Maintaining equipment records\n3.4 Communicating with work site personnel and clients\n3.5 Complying with the manufacturer’s operation and\n maintenance manual\n3.6 Accomplishing pre- and post-operation checklist\n4. Resource\nimplications\n\nThings necessary for the conduct of assessment\n4.1 Appropriate work area for lifting equipment operation\n4.2 Access to lifting equipment and manuals.\n5. Method of\nassessment\n\nCompetency must be assessed through\n5.1 Written/oral questioning\n5.2 Direct observation / practical demonstration\n5.3 Work record and documents\n6. Context for\nassessment\n6.1 Assessment may be conducted on-the-job or in a simulated\n venue.\n\n--- PDF PAGE 49 ---\nTR HEAVY-EQUIPMENT OPERATION (Tower Crane) Promulgated December 2004/July 2007\n48 / 69\n\nUNIT OF COMPETENCY:\nPERFORM PRODUCTIVE OPERATION FOR\nTOWER CRANE\nUNIT CODE:\nCON833314\nUNIT DESCRIPTOR:\nThis unit covers the knowledge, skills and attitudes\nin\nperforming\nequipment\nstandard\noperating\nprocedures for a Tower Crane.\n\nELEMENT\nPERFORMANCE CRITERIA\nBold and Italicized terms are elaborated in the\nRange of Variables\n1. Position the crane\n\n1.1 Work area is surveyed for safe accessibility or\n potential hazards in accordance with safe\n operating procedures.\n1.2 Jib is secured in place during positioning\n (applied to rail mounted type).\n1.3 Aid of a signalman is required.\n1.4 Unexpected situations are responded in line\nwith company rules and regulations in a\nmanner that minimizes risk to personnel and\nequipment.\n2. Read and interpret load\nchart\n\n2.1 Gross weight is determined according to load\ninformation.\n2.2 Lifting capacity is determined according to\nworking radius and boom length.\n2.3 Rigging gears specifications are determined\naccording to lifting plan.\n2.4 Weight of any attachment such as hook blocks,\nlifting/rigging gears, etc. is considered as part\nof the load.\n2.5 Lifting capacity in the load chart is followed\naccording to manufacturer’s specifications and\nequipment conditions (Safe Working Load).\n2.6 Doubt about the lifting capacity of the crane\nbased on load chart reading is referred to\nimmediate supervisor.\n\n--- PDF PAGE 50 ---\nTR HEAVY-EQUIPMENT OPERATION (Tower Crane) Promulgated December 2004/July 2007\n49 / 69\n\nELEMENT\nPERFORMANCE CRITERIA\n3. Perform lifting and\ntransferring of load\n\n3.1 Communication signal with Rigger is\nestablished and maintained during lifting and\ntransferring of loads based on job\nrequirements.\n3.2 Speed and allowable working radius during\nhoisting, slewing or trolleying operation are\ncontrolled based on standard operating\nprocedures.\n3.3 Safe work procedures and practices are\nobserved during lifting and transferring\noperation\n3.4 Unexpected situations are responded to in line\nwith company safety rules and regulations.\n\n--- PDF PAGE 51 ---\nTR HEAVY-EQUIPMENT OPERATION (Tower Crane) Promulgated December 2004/July 2007\n50 / 69\n\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Potential\nhazards\n\nMay include but are not limited to:\n1.1 Other equipment\n1.2 Building/structure\n1.3 Overhead “live” electrical wires\n1.4 Foggy/windy or stormy weather\n2. Signalman\n2.1 Spotter\n2.2 Rigger\n3. Unexpected\nsituations\nMay include but are not limited to:\n3.1 Oil leakages\n3.2 Fraying of wire rope\n3.3 Lost of power supply\n3.4 Failure of hoist brake\n3.5 Malfunction of control levers/electrical components\n3.6 Structural failure of the jib\n3.7 Derail of track (for rail mounted type)\n3.8 Ground failure\n3.9 Hitting high tension wire\n3.10 Force majeure e.g., earthquake, fire, tornado\n3.11 Sudden sickness/unstable health condition of operator\n4. Load\ninformation\n4.1 Bill of ladings\n4.2 Packing and shipping list\n4.3 Manufacturer’s load specifications\n5. Rigging gears\nspecifications\n5.1 Types and classifications\n5.2 Weight\n5.3 Proper hitching or application\n5.4 Capacity\n6. Equipment\ncondition\nEquipment lifting condition may include but are not limited to:\n6.1 Obsolescence (expected life span)\n6.2 Equipment history\n6.3 Machine performance\n6.4 Wear and tear\n6.5 Structural reliability\n\n--- PDF PAGE 52 ---\nTR HEAVY-EQUIPMENT OPERATION (Tower Crane) Promulgated December 2004/July 2007\n51 / 69\n\nVARIABLE\nRANGE\n7. Communication\nsignal\n7.1 Two-way radio\n7.2 Hand signal (ISO standard)\n7.3 Radio headset\n7.4 Cellular phones\n8. Safe work\nprocedures and\npractices\n8.1 Ensure that lifting/rigging gears are placed, checked and\n secured before raising the load in accordance with job\n requirements.\n8.2 Load striking the ground, machine or any other object is\n prevented.\n8.3 Jib and hoist line are prevented from striking any\n obstruction.\n8.4 Shock/Dynamic loading is avoided.\n8.5 Load handling is observed.\n9. Lifting and\ntransferring\noperation\n9.1 Release emergency brake\n9.2 Release slewing lock\n9.3 Hoist the load\n9.4 Trolley the load\n9.5 Slew the load\n9.6 Raise and lower the jib (for luffing crane)\n\n--- PDF PAGE 53 ---\nTR HEAVY-EQUIPMENT OPERATION (Tower Crane) Promulgated December 2004/July 2007\n52 / 69\n\nEVIDENCE GUIDE\n1. Critical aspects\nof evidence to\nbe considered\n\nAssessment requires evidence that the candidate:\n1.1 Demonstrates ability to operate Tower Crane in accordance\nwith manufacturer’s operation and maintenance manual.\n1.2 Demonstrates ability to carry-out safe work procedures and\npractices\n1.3 Demonstrates ability to interpret Load Chart, Lifting/Rigging\nplan\n1.4 Demonstrates ability to communicate with Rigger during\nlifting operation\n1.5 Demonstrates ability to follow correct procedures in lifting\nand transferring loads.\n2. Underpinning\n(related)\nknowledge and\nattitude\n\n2.1 Safe operating procedures and practices.\n2.2 Load charts\n2.3 Lifting/rigging plans/site plan and layout\n2.4 Company/In-house policies and procedures\n2.5 Rigging gears and signals (ISO standards) and its\napplications\n2.6 Basic calculations and mensuration\n2.7 Positive work values (time and cost conscious, etc.)\n3. Underpinning\nskills\n\n3.1 Accomplishing crane inspection checklist and daily\nequipment time record/report (DETR)\n3.2 Reporting crane component malfunctions\n3.3 Performing actual/proper crane operation\n3.4 Performing safety procedures and practices\n3.5 Reading and interpreting load chart\n3.6 Following correct rigging signals (ISO standard)\n3.7 Calculation and mensuration skills\n4. Resource\nimplications\n\nThings necessary for the conduct of assessment\n4.1 Access to Tower Crane and job site/terrain\n4.2 Rigging gears and test loads\n4.3 Signalman\n4.4 Barricades and informative signages\n\n--- PDF PAGE 54 ---\nTR HEAVY-EQUIPMENT OPERATION (Tower Crane) Promulgated December 2004/July 2007\n53 / 69\n\n5. Method of\nassessment\n\nCompetency in this unit must be assessed through\n5.1 Written/Oral questioning\n5.2 Direct observation/ demonstration\n5.3 Work record and documents\n5.4 Third-party report\n6. Context for\nassessment\n6.1 Assessment maybe conducted in the work site or in a\nsimulated venue.\n\n--- PDF PAGE 55 ---\nTR HEAVY-EQUIPMENT OPERATION (Tower Crane) Promulgated December 2004/July 2007\n54 / 69\n\nSECTION 3 TRAINING STANDARDS\n\nThese guidelines are set to provide the Technical and Vocational\nEducation and Training (TVET) providers with information and other important\nrequirements to consider when designing training programs for HEAVY\nEQUIPMENT OPERATION NC II.\n\n 3.1 CURRICULUM DESIGN\n\nCourse Title : HEAVY- EQUIPMENT OPERATION (TOWER CRANE)\nNC Level:\nII\n\nBASIC COMPETENCIES\nNominal Training Hours:\n18 Hours (Basic) + 18 Hours (Common)\nCourse Description:\n\nThis course is designed to equip individuals with the basic, common and\ncore competencies in Construction Sector particularly in Heavy-Equipment\nOperation (Tower Crane).\n\nTo obtain this, all units prescribed for this qualification must be achieved:\n\nBASIC COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and convey\nworkplace information.\n1.2 Complete relevant work\n related documents\n1.3 Participate in\nworkplace meeting and\ndiscussion.\nGroup\ndiscussion\nInteraction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n2. Work in a team\n environment\n2.1 Describe and identify\nteam role and\nresponsibility in a team.\n2.2 Describe work as a team\nmember.\nDiscussion\nInteraction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n\n--- PDF PAGE 56 ---\nTR HEAVY-EQUIPMENT OPERATION (Tower Crane) Promulgated December 2004/July 2007\n55 / 69\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n3. Practice career\nprofessionalism\n3.1 Integrate personal\nobjectives with\norganizational goals.\n3.2 Set and meet work\npriorities.\n3.3 Maintain professional\ngrowth and development.\nDiscussion\nInteraction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n4. Practice\noccupational\nhealth and safety\n4.1 Evaluate hazard and\nrisks\n4.2 Control hazards and risks\n4.3 Maintain occupational\nhealth and safety\nawareness\nDiscussion\nPlant tour\nSymposium\n• Observation\n• Interview\n\n--- PDF PAGE 57 ---\nTR HEAVY-EQUIPMENT OPERATION (Tower Crane) Promulgated December 2004/July 2007\n56 / 69\n\nCOMMON COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Prepare\nconstruction\nmaterials and\ntools\n1.8 Identify Materials\n1.9 Requisition\nMaterials\n1.10 Receive and\ninspect materials\nAudio Visual\nsimulation\nDiscussion\nPractical\nexercise\nDemonstration\n• Direct observation\n• Questions or\ninterview\n• Portfolio\n(credentials)\n• Written / Oral Test\n•\nDemonstration\n2. Observe\nprocedures,\nSpecifications\nand Manuals of\nInstructions\n2.1 Identify and access\nspecification/\nmanuals\nAudio Visual\nSimulation\nDiscussion\nPractical Lab\nDemonstration\n• Direct observation\n• Oral questioning\n• Written test or\nexamination\n• Third party report\n• Demonstration\n(able to impart\nknowledge and\nskills)\n3. Interpret\nTechnical\nDrawing\n3.1 Analyze sign,\nsymbols and data\n3.2 Interpret technical\ndrawing and plans\n3.3 Apply freehand\nsketching\nAudio Visual\nSimulation\nDiscussion\nPractical Lab\nDemonstration\n• Direct observation\n• Oral questioning\n• Written test or\nexamination\n• Third party report\n• Demonstration\n(able to impart\nknowledge and\nskills)\n4. Perform\nmensurations\nand calculation\n4.1 Select measuring\ninstruments\n4.2 Carry out\nmeasurements\nand calculations\nAudio Visual\nSimulation\nDiscussion\nPractical Lab\nDemonstration\n• Direct observation\n• Oral questioning\n• Written test or\nexamination\n• Third party report\n• Demonstration\n(able to impart\nknowledge and\nskills)\n\n--- PDF PAGE 58 ---\nTR HEAVY-EQUIPMENT OPERATION (Tower Crane) Promulgated December 2004/July 2007\n57 / 69\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n5. Maintain tools\nand\nequipment\n5.1 Check condition of\ntools and\nequipment\n5.2 Perform basic\npreventive\nmaintenance\n5.3 Sharpen edge and\ntooth cutting tools\n5.4 Store tools and\nequipment\nAudio Visual\nSimulation\nDiscussion\nPractical Lab\nDemonstration\n• Direct observation\nof application of\ntasks\n• Oral questioning\n• Written test or\nexamination\n• Third party report\n• Demonstration\n\n--- PDF PAGE 59 ---\nTR HEAVY-EQUIPMENT OPERATION (Tower Crane) Promulgated December 2004/July 2007\n58 / 69\n\nCORE COMPETENCIES\n\nCourse Title\n: HEAVY EQUIPMENT OPERATION Level:\n\n TOWER CRANE\n\nNominal Training Hours:\n120 Hours\n\nCourse Description:\n\nThis course is designed to enhance the knowledge, desirable attitudes\nand skills in the use of tower crane in accordance with industry standards. It\ncovers core competencies such as: perform pre- and post operation procedure,\nand perform productive operation on a given tower crane.\n\nTo obtain this, all units prescribed for this qualification must be achieved:\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Perform pre- and\npost operation\nprocedures on\nTower Crane\n1.1 Identify tower crane\ntypes / components\nparts\n1.2 Perform visual check of\nequipment\n1.3 Check BLOWAF of\nTower Crane\n1.3.1 Battery\n1.3.2 Light\n1.3.3 Oil\n1.3.4 Water\n1.3.5 Air\n1.3.6 Fuel\n1.4 Check tower crane\nsystems operation\n1.5 Check safety devices\n& accessories\n1.6 Perform post-\noperations check\nLecture\nPractical /\ndemonstration\n\n• Observation /\nDemonstration\nand interview\n• Written test\n\n2. Perform productive\noperation for\nTower\n Crane\n2.1 Perform loading\n and unloading\n tower crane to\n trailer (low bed)\n2.2 Perform tower - crane\n application\nLecture\nPractical\ndemonstration\n\n• Observation /\nDemonstration\nand interview\n• Written test\n\n--- PDF PAGE 60 ---\nTR HEAVY-EQUIPMENT OPERATION (Tower Crane) Promulgated December 2004/July 2007\n59 / 69\n\n3.2\nTRAINING DELIVERY\n\nThe delivery of training should adhere to the design of the curriculum.\nDelivery should be guided by the 10 basic principles of competency-based TVET.\n\n• The training is based on curriculum developed from the\ncompetency standards;\n• Learning is modular in its structure;\n• Training delivery is individualized and self-paced;\n• Training is based on work that must be performed;\n• Training materials are directly related to the competency\nstandards and the curriculum modules;\n• Assessment is based in the collection of evidence of the\nperformance of work to the industry required standard;\n• Training is based both on and off-the-job components;\n• Allows for recognition of prior learning (RPL) or current\ncompetencies;\n• Training allows for multiple entry and exit; and\n• Approved training programs are nationally accredited.\n\nThe competency-based TVET system recognizes various types of delivery\nmodes, both on and off-the-job as long as the learning is driven by the\ncompetency standards specified by the industry. The following training modalities\nmay be adopted when designing training programs:\n\n• The dualized mode of training delivery is preferred and\nrecommended. Thus programs would contain both in-school\nand in-industry training or fieldwork components. Details can be\nreferred to the Dual Training System (DTS) Implementing Rules\nand Regulations.\n• Modular/self-paced learning is a competency-based training\nmodality wherein the trainee is allowed to progress at his own\npace. The trainer facilitates the training delivery\n• Peer teaching/mentoring is a training modality wherein fast\nlearners are given the opportunity to assist the slow learners.\n• Supervised industry training or on-the-job training is an\napproach in training designed to enhance the knowledge and\nskills of the trainee through actual experience in the workplace\nto acquire specific competencies prescribed in the training\nregulations.\n• Distance learning is a formal education process in which\nmajority of the instruction occurs when the students and\n\n--- PDF PAGE 61 ---\nTR HEAVY-EQUIPMENT OPERATION (Tower Crane) Promulgated December 2004/July 2007\n60 / 69\n\ninstructor are not in the same place. Distance learning may\nemploy correspondence study, or audio, video or computer\ntechnologies.\n\n3.3\n TRAINEE ENTRY REQUIREMENTS\n\nThis section specifies the qualifications of trainees and educational\nexperience. Other requirements like health and physical requirements may also\nbe stated. Passing written entrance examinations may also be indicated if\nnecessary.\n\n• Can communicate both orally and in writing\n\n• Physically and mentally fit\n\n• With good moral character\n\n• Can perform basic mathematical computations.\n\n3.4\nLIST OF TOOLS, EQUIPMENT AND MATERIALS\n\n--- PDF PAGE 62 ---\nTR HEAVY-EQUIPMENT OPERATION (Tower Crane) Promulgated December 2004/July 2007\n61 / 69\n\nRecommended list of tools, equipment and materials for the training of 25\ntrainees for the operation of tower crane.\n\nTOOLS\nEQUIPMENT\nMATERIALS\nQTY\nQTY\nQTY\n1 set\n• Wrenches (box and\nopen-end 8-24 mm-\nmetric & 7/16 –1” -\nEnglish )\n1 unit\n• Tower crane(MOA\n/ rental)\n5 kls\n• Multi-\n purpose\n grease\n1 set\n• Hammer ballpeen\n(3-4 lbs)\n\n1 pair\n• Working\n clothes\n1 set\n• Pliers( mechanical\n10 “)\n\n10\npairs\n• Safety shoes\n1 pc\n\n• Adjustable\n wrench (18 “)\n\n1 pc\n• Grease gun\n\n10\npairs\n• Gloves\n1 set\n• Screw driver ( 10 “\nflat & Philips)\n\n10\npcs\n• Goggles\n\n10\npcs\n• Dust Mask\n\n10\npcs\n• Hard hat\n .\n\n2\nunits\n• Test weights\n- 3 tons\n - 5 tons\n\n1 pc\n• Tower crane\nminiture\n\n1 pc\n• Operator’s\nmanual with\nload chart\n\n--- PDF PAGE 63 ---\nTR HEAVY-EQUIPMENT OPERATION (Tower Crane) Promulgated December 2004/July 2007\n62 / 69\n\n3.5\nTRAINING FACILITIES\n\nThe tower crane operation workshop must be of concrete structure.\nBased on class size of 25 students/trainees the space requirements for the\nteaching/learning and circulation areas are as follows:\n\nSPACE REQUIREMENT\nSIZE IN METERS\nAREA IN SQ.\nMETERS\nTOTAL AREA\nIN SQ.\nMETERS\n• Student/Trainee’s Working\nSpace\n 2.0 x 2.0 meters\n4 sq.m per\nstudent\n100.0 sq.m.\n•\nLecture Room\n8.00 x 6.00\n48.00\n48.0\n•\nLearning Resource Center\n4.00 x 6.00\n24.00\n24.0\n•\n\n172\n• Facilities/Equipment/\nCirculation Area\n-\n-\n52\nTOTAL WORK AREA\n-\n224\nWorking field\n0.25 hectare (MOA/Rental)\n\n--- PDF PAGE 64 ---\nTR HEAVY-EQUIPMENT OPERATION (Tower Crane) Promulgated December 2004/July 2007\n63 / 69\n\n 3.6 TRAINERS’ QUALIFICATION\n\nHEAVY EQUIPMENT OPERATION (LIFTING)\n\nTRAINER QUALIFICATION (TQ II)\n•\nMust be a holder of Heavy-Equipment Operation (Tower Crane)\nNC-II or equivalent qualification\n•\nMust have undergone training on Training Methodology II (TM II)\nor equivalent in training/experience\n•\nMust be computer-literate\n•\nMust be physically and mentally fit\n•\nMust have had at least 5 years job/industry experience*\n•\nMust be a civil-service eligible or holder of appropriate license\nissued by the Professional Regulatory Commission (for\ngovernment positions)\n\n* Optional. Only when required by the hiring institution.\n\nReference: TESDA Board Resolution No. 2004-03\n\n--- PDF PAGE 65 ---\nTR HEAVY-EQUIPMENT OPERATION (Tower Crane) Promulgated December 2004/July 2007\n64 / 69\n\nSECTION 4\nNATIONAL ASSESSMENT AND CERTIFICATION\nARRANGEMENTS\n\n4.1\nTo attain the National Qualification of HEAVY-EQUIPMENT OPERATION\n(Tower Crane) NC II, the candidate must demonstrate competence in all\nthe units of competency in Section 1. Successful candidates shall be\nawarded National Certificates signed by the TESDA Director General.\n\n4.2\nThe qualification of HEAVY EQUIPMENT OPERATION (Bulldozer) NC II\nmay be attained through demonstration of competence in a project-type\nassessment covering the following core units.\n\n4.2.1\nTower-crane operation\n Perform pre-and post operation for lifting equipment\n Perform productive operation for tower crane\n\n4.3\nAssessment shall focus on the core units of competency. The basic and\ncommon units shall be integrated or assessed concurrently with the core\nunits.\n\n4.4\nThe following are qualified to apply for assessment and certification:\n\n4.4.1\nGraduates of formal, non-formal and/or informal training including\nenterprise-based training programs\n\n4.4.2\nExperienced Workers (wage-employed or self-employed)\n\n4.5 The guidelines on assessment and certification are discussed in detail in the\nProcedures Manual on Assessment and Certification and Guidelines on the\nImplementation of the Philippine TVET Qualification and Certification\nSystem (PTQCS).\n\n--- PDF PAGE 66 ---\nTR HEAVY-EQUIPMENT OPERATION (Tower Crane) NC II Promulgated July 2007\n65 / 69\n\nCOMPETENCY MAP\nCONSTRUCTION-HEAVY EQUIPMENT OPERATION SUB- SECTOR\nBA\nSIC\nInspect\nrigging\ngears\nPerform productive\noperation for\nhydraulic excavator\nPerform productive\noperation for truck-\nmounted crane\nPerform productive\noperation for tower crane\nPerform productive\noperation for forklift\nInstall\nrigging\ngears\nPerform productive\noperation for\nbackhoe loader\nPerform pre- and post-\noperation procedures for\nlifting equipment\nPerform basic\npreventive maintenance\nservicing for hauling\nPerform productive\noperation for off-\nhigh way dump\ntruck (articulated)\nPerform productive\noperation for\nbulldozer\nPerform productive\noperation for wheel\nloader\nPerform productive\noperation for motor\ngrader\nPerform pre- and post-\noperation procedures for\nhauling equipment\nPerform productive\noperation for road\nroller\nPerform basic preventive\nmaintenance servicing for\nlifting equipment\nAssist\ncrane\noperator\nPerform pre- and post-\noperation procedures for\nearth moving equipment\nPerform productive\noperation for\ncrawler crane\nPerform basic preventive\nmaintenance servicing for\nearth moving equipment\nPerform productive\noperation for rough-\nterrain crane\nPerform productive\noperation for off-highway\ndump truck (rigid)\nPerform productive\noperation for\nconcrete pump\nPerform productive\noperation for paver\nPerform basic preventive\nmaintenance servicing for\nconcreting and asphalting\nequipment\nPerform productive\noperation for on-\nhighway dump truck\n(rigid)\nPerform pre- and post-\noperation procedures for\nconcreting and asphalting\nequipment\nPerform productive\noperation for transit\nmixer\nCORE\nCOMPETENCIES\nPrepare\nconstruction\nmaterials and\ntools\nInterpret technical\ndrawings and plans\nObserve procedures,\nspecifications and\nmanual of instructions\nMaintain tools and\nequipment\nPerform\nmensuration and\ncalculations\nCOMMON\nCOMPETENCIES\nBASIC\nCOMPETENCIES\nReceive and respond\nto workplace\ncommunication\nWork with others\nUse relevant\ntechnologies\nPractice career\nprofessionalism\nUtilize specialized\ncommunication\nskills\nPractice occupational\nhealth and safety\nprocedures\nDevelop teams and\nindividuals\nLead workplace\ncommunication\nDemonstrate work\nvalues\nSolve problems\nrelated to work\nactivities\nDevelop and\npractice negotiation\nskills\nPractice\nhousekeeping\nprocedure (5s)\nUse mathematical\nconcepts and\ntechniques\nWork in a team\nenvironment\nParticipate in\nworkplace\ncommunication\nApply problem-\nsolving techniques\nin the workplace\nPlan and organize\nwork\nCollect, analyze\nand organize\ninformation\nLead small team\nPromote\nenvironmental\nprotection\n\n--- PDF PAGE 67 ---\nTR HEAVY-EQUIPMENT OPERATION (Tower Crane) NC II Promulgated July 2007\n66 / 69\n\nDefinition of Terms\n\nFor the purpose of this Competency Standard, the words\n\n1. Attachment\nRefers to anything like hook block and other accessories/special\nattachments used instead of the conventional lift block to perform\ndifferent types of lifting jobs.\n2. Derricking\nRefers to raising and lowering of jib for luffing type of Tower\ncrane.\n3. Hoist\nRefers to the mechanism that is used for raising and lowering the\nload.\n4. Jib\nRefers to the boom of the Tower crane. It is a long horizontal\nworking arm of the crane that carries the load.\n5. Safe Working\nLoad (SWL)\nRefers to the maximum allowable load that the crane can lift\nsafely.\n6. Slewing\nRefers to the transferring of load by swinging the jib from left to\nright.\n7. Slewing unit\nAttached on top of the mast that allows the crane to rotate.\n8. Tower Crane\nRefers to the type of crane that is used for high rise buildings/\nstructures or construction sites which are of fixed base mounted,\nrail mounted, self erecting/climbing type, free standing type and\nluffing type, used for lifting construction materials.\n9. Trolleying\nRefers to the movement of the load in and out from the crane\ncenter.\n10. Weathervaning\ndevice\nRefers to a safety device to free the jib movement during adverse\nweather conditions.\n\n--- PDF PAGE 68 ---\nTR HEAVY-EQUIPMENT OPERATION (Tower Crane) NC II Promulgated July 2007\n67 / 69\n\nACKNOWLEDGMENTS\n\nThe Technical Education and Skills Development Authority (TESDA)\nwishes to extend thanks and appreciation to the many representatives of\nbusiness, industry, academe and government agencies who contributed their\ntime and expertise to the development and validation of these Training\nRegulations.\n\n•\nTHE TECHNICAL EXPERT PANEL (TEP)\n\nFlorello P. Quianzon\nConsultant, Equipment Concrete Product Division\n(Equipment Management)\nMakati Development Corporation\nAyala-Alabang, Muntinlupa City\nRenato P. Faigao\nEquipment Manager (Operations and\nMaintenance Management)\nMANCON-CBDC Joint Venture\nPasong Tamo, Extension,\nMakati City\nSamuel M. Puquiz\nHead, Mechanical and Technical (Construction\nEquipment Repair and Maintenance)\nDM Consunji Inc.\nPasong Tamo Extension, Makati City\nArturo M. Abrera\nHead, Mechanical Works Training Division\n(Civil Works, Heavy Equipment Operation)\nDepartment of Trade and Industry -\nConstruction Manpower Development\nFoundation\nPasong Tamo, Makati City\nLuciano E. Policarpio\nSafety Engineer (Const