      "source_text": "EVIDENCE GUIDE 1. Critical aspects of evidence to be considered"
    },
    {
      "source_text": "Assessment requires evidence that the candidate: 1.1 Demonstrates ability to operate Tower Crane in accordance with manufacturer’s operation and maintenance manual. 1.2 Demonstrates ability to carry-out safe work procedures and practices 1.3 Demonstrates ability to interpret Load Chart, Lifting/Rigging plan 1.4 Demonstrates ability to communicate with Rigger during lifting operation 1.5 Demonstrates ability to follow correct procedures in lifting and transferring loads. 2. Underpinning (related) knowledge and attitude"
    },
    {
      "source_text": "2.1 Safe operating procedures and practices. 2.2 Load charts 2.3 Lifting/rigging plans/site plan and layout 2.4 Company/In-house policies and procedures 2.5 Rigging gears and signals (ISO standards) and its applications 2.6 Basic calculations and mensuration 2.7 Positive work values (time and cost conscious, etc.) 3. Underpinning skills"
    },
    {
      "source_text": "3.1 Accomplishing crane inspection checklist and daily equipment time record/report (DETR) 3.2 Reporting crane component malfunctions 3.3 Performing actual/proper crane operation 3.4 Performing safety procedures and practices 3.5 Reading and interpreting load chart 3.6 Following correct rigging signals (ISO standard) 3.7 Calculation and mensuration skills 4. Resource implications"
    },
    {
