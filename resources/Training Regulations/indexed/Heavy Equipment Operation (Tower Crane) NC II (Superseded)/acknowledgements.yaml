    },
    {
      "source_text": "4.1 To attain the National Qualification of HEAVY-EQUIPMENT OPERATION (Tower Crane) NC II, the candidate must demonstrate competence in all the units of competency in Section 1. Successful candidates shall be awarded National Certificates signed by the TESDA Director General."
    },
    {
      "source_text": "4.2 The qualification of HEAVY EQUIPMENT OPERATION (Bulldozer) NC II may be attained through demonstration of competence in a project-type assessment covering the following core units."
    },
    {
      "source_text": "4.2.1 Tower-crane operation  Perform pre-and post operation for lifting equipment  Perform productive operation for tower crane"
    },
    {
      "source_text": "4.3 Assessment shall focus on the core units of competency. The basic and common units shall be integrated or assessed concurrently with the core units."
    },
    {
      "source_text": "4.4 The following are qualified to apply for assessment and certification:"
    },
    {
      "source_text": "4.4.1 Graduates of formal, non-formal and/or informal training including enterprise-based training programs"
    },
    {
      "source_text": "4.4.2 Experienced Workers (wage-employed or self-employed)"
    },
    {
      "source_text": "4.5 The guidelines on assessment and certification are discussed in detail in the Procedures Manual on Assessment and Certification and Guidelines on the Implementation of the Philippine TVET Qualification and Certification System (PTQCS)."
