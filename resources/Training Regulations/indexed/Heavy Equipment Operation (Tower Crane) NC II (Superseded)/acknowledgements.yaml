    {
      "source_text": "EVIDENCE GUIDE 1. Critical Aspects of Competency Assessment requires evidence that the candidate: 1.1. Prepared written communication following standard format of the organization 1.2. Accessed information using communication equipment 1.3. Made use of relevant terms as an aid to transfer information effectively 1.4. Conveyed information effectively adopting the formal or informal communication 2. Underpinning Knowledge and Attitudes"
    },
    {
