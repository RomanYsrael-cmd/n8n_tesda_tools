  "source_text": "Section 1. Successful candidates shall be\nawarded National Certificates signed by the TESDA Director General.\n\n4.2\nThe qualification of HEAVY EQUIPMENT OPERATION (Bulldozer) NC II\nmay be attained through demonstration of competence in a project-type\nassessment covering the following core units.\n\n4.2.1\nTower-crane operation\n Perform pre-and post operation for lifting equipment\n Perform productive operation for tower crane\n\n4.3\nAssessment shall focus on the core units of competency. The basic and\ncommon units shall be integrated or assessed concurrently with the core\nunits.\n\n4.4\nThe following are qualified to apply for assessment and certification:\n\n4.4.1\nGraduates of formal, non-formal and/or informal training including\nenterprise-based training programs\n\n4.4.2\nExperienced Workers (wage-employed or self-employed)\n\n4.5 The guidelines on assessment and certification are discussed in detail in the\nProcedures Manual on Assessment and Certification and Guidelines on the\nImplementation of the Philippine TVET Qualification and Certification\nSystem (PTQCS).\n\n--- PDF PAGE 66 ---\nTR HEAVY-EQUIPMENT OPERATION (Tower Crane) NC II Promulgated July 2007\n65 / 69\n\nCOMPETENCY MAP\nCONSTRUCTION-HEAVY EQUIPMENT OPERATION SUB- SECTOR\nBA\nSIC\nInspect\nrigging\ngears\nPerform productive\noperation for\nhydraulic excavator\nPerform productive\noperation for truck-\nmounted crane\nPerform productive\noperation for tower crane\nPerform productive\noperation for forklift\nInstall\nrigging\ngears\nPerform productive\noperation for\nbackhoe loader\nPerform pre- and post-\noperation procedures for\nlifting equipment\nPerform basic\npreventive maintenance\nservicing for hauling\nPerform productive\noperation for off-\nhigh way dump\ntruck (articulated)\nPerform productive\noperation for\nbulldozer\nPerform productive\noperation for wheel\nloader\nPerform productive\noperation for motor\ngrader\nPerform pre- and post-\noperation procedures for\nhauling equipment\nPerform productive\noperation for road\nroller\nPerform basic preventive\nmaintenance servicing for\nlifting equipment\nAssist\ncrane\noperator\nPerform pre- and post-\noperation procedures for\nearth moving equipment\nPerform productive\noperation for\ncrawler crane\nPerform basic preventive\nmaintenance servicing for\nearth moving equipment\nPerform productive\noperation for rough-\nterrain crane\nPerform productive\noperation for off-highway\ndump truck (rigid)\nPerform productive\noperation for\nconcrete pump\nPerform productive\noperation for paver\nPerform basic preventive\nmaintenance servicing for\nconcreting and asphalting\nequipment\nPerform productive\noperation for on-\nhighway dump truck\n(rigid)\nPerform pre- and post-\noperation procedures for\nconcreting and asphalting\nequipment\nPerform productive\noperation for transit\nmixer\nCORE\nCOMPETENCIES\nPrepare\nconstruction\nmaterials and\ntools\nInterpret technical\ndrawings and plans\nObserve procedures,\nspecifications and\nmanual of instructions\nMaintain tools and\nequipment\nPerform\nmensuration and\ncalculations\nCOMMON\nCOMPETENCIES\nBASIC\nCOMPETENCIES\nReceive and respond\nto workplace\ncommunication\nWork with others\nUse relevant\ntechnologies\nPractice career\nprofessionalism\nUtilize specialized\ncommunication\nskills\nPractice occupational\nhealth and safety\nprocedures\nDevelop teams and\nindividuals\nLead workplace\ncommunication\nDemonstrate work\nvalues\nSolve problems\nrelated to work\nactivities\nDevelop and\npractice negotiation\nskills\nPractice\nhousekeeping\nprocedure (5s)\nUse mathematical\nconcepts and\ntechniques\nWork in a team\nenvironment\nParticipate in\nworkplace\ncommunication\nApply problem-\nsolving techniques\nin the workplace\nPlan and organize\nwork\nCollect, analyze\nand organize\ninformation\nLead small team\nPromote\nenvironmental\nprotection\n\n--- PDF PAGE 67 ---\nTR HEAVY-EQUIPMENT OPERATION (Tower Crane) NC II Promulgated July 2007\n66 / 69\n\nDefinition of Terms\n\nFor the purpose of this Competency Standard, the words\n\n1. Attachment\nRefers to anything like hook block and other accessories/special\nattachments used instead of the conventional lift block to perform\ndifferent types of lifting jobs.\n2. Derricking\nRefers to raising and lowering of jib for luffing type of Tower\ncrane.\n3. Hoist\nRefers to the mechanism that is used for raising and lowering the\nload.\n4. Jib\nRefers to the boom of the Tower crane. It is a long horizontal\nworking arm of the crane that carries the load.\n5. Safe Working\nLoad (SWL)\nRefers to the maximum allowable load that the crane can lift\nsafely.\n6. Slewing\nRefers to the transferring of load by swinging the jib from left to\nright.\n7. Slewing unit\nAttached on top of the mast that allows the crane to rotate.\n8. Tower Crane\nRefers to the type of crane that is used for high rise buildings/\nstructures or construction sites which are of fixed base mounted,\nrail mounted, self erecting/climbing type, free standing type and\nluffing type, used for lifting construction materials.\n9. Trolleying\nRefers to the movement of the load in and out from the crane\ncenter.\n10. Weathervaning\ndevice\nRefers to a safety device to free the jib movement during adverse\nweather conditions.\n\n--- PDF PAGE 68 ---\nTR HEAVY-EQUIPMENT OPERATION (Tower Crane) NC II Promulgated July 2007\n67 / 69\n\nACKNOWLEDGMENTS\n\nThe Technical Education and Skills Development Authority (TESDA)\nwishes to extend thanks and appreciation to the many representatives of\nbusiness, industry, academe and government agencies who contributed their\ntime and expertise to the development and validation of these Training\nRegulations.\n\n•\nTHE TECHNICAL EXPERT PANEL (TEP)\n\nFlorello P. Quianzon\nConsultant, Equipment Concrete Product Division\n(Equipment Management)\nMakati Development Corporation\nAyala-Alabang, Muntinlupa City\nRenato P. Faigao\nEquipment Manager (Operations and\nMaintenance 