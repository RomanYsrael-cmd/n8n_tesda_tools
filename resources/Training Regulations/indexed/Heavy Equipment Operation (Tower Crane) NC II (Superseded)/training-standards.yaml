 59 ---\nTR HEAVY-EQUIPMENT OPERATION (Tower Crane) Promulgated December 2004/July 2007\n58 / 69\n\nCORE COMPETENCIES\n\nCourse Title\n: HEAVY EQUIPMENT OPERATION Level:\n\n TOWER CRANE\n\nNominal Training Hours:\n120 Hours\n\nCourse Description:\n\nThis course is designed to enhance the knowledge, desirable attitudes\nand skills in the use of tower crane in accordance with industry standards. It\ncovers core competencies such as: perform pre- and post operation procedure,\nand perform productive operation on a given tower crane.\n\nTo obtain this, all units prescribed for this qualification must be achieved:\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Perform pre- and\npost operation\nprocedures on\nTower Crane\n1.1 Identify tower crane\ntypes / components\nparts\n1.2 Perform visual check of\nequipment\n1.3 Check BLOWAF of\nTower Crane\n1.3.1 Battery\n1.3.2 Light\n1.3.3 Oil\n1.3.4 Water\n1.3.5 Air\n1.3.6 Fuel\n1.4 Check tower crane\nsystems operation\n1.5 Check safety devices\n& accessories\n1.6 Perform post-\noperations check\nLecture\nPractical /\ndemonstration\n\n• Observation /\nDemonstration\nand interview\n• Written test\n\n2. Perform productive\noperation for\nTower\n Crane\n2.1 Perform loading\n and unloading\n tower crane to\n trailer (low bed)\n2.2 Perform tower - crane\n application\nLecture\nPractical\ndemonstration\n\n• Observation /\nDemonstration\nand interview\n• Written test\n\n--- PDF PAGE 60 ---\nTR HEAVY-EQUIPMENT OPERATION (Tower Crane) Promulgated December 2004/July 2007\n59 / 69"
