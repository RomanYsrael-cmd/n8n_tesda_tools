ss\nDiscussion\nPlant tour\nSymposium\n• Observation\n• Interview\n\n--- PDF PAGE 57 ---\nTR HEAVY-EQUIPMENT OPERATION (Tower Crane) Promulgated December 2004/July 2007\n56 / 69\n\nCOMMON COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Prepare\nconstruction\nmaterials and\ntools\n1.8 Identify Materials\n1.9 Requisition\nMaterials\n1.10 Receive and\ninspect materials\nAudio Visual\nsimulation\nDiscussion\nPractical\nexercise\nDemonstration\n• Direct observation\n• Questions or\ninterview\n• Portfolio\n(credentials)\n• Written / Oral Test\n•\nDemonstration\n2. Observe\nprocedures,\nSpecifications\nand Manuals of\nInstructions\n2.1 Identify and access\nspecification/\nmanuals\nAudio Visual\nSimulation\nDiscussion\nPractical Lab\nDemonstration\n• Direct observation\n• Oral questioning\n• Written test or\nexamination\n• Third party report\n• Demonstration\n(able to impart\nknowledge and\nskills)\n3. Interpret\nTechnical\nDrawing\n3.1 Analyze sign,\nsymbols and data\n3.2 Interpret technical\ndrawing and plans\n3.3 Apply freehand\nsketching\nAudio Visual\nSimulation\nDiscussion\nPractical Lab\nDemonstration\n• Direct observation\n• Oral questioning\n• Written test or\nexamination\n• Third party report\n• Demonstration\n(able to impart\nknowledge and\nskills)\n4. Perform\nmensurations\nand calculation\n4.1 Select measuring\ninstruments\n4.2 Carry out\nmeasurements\nand calculations\nAudio Visual\nSimulation\nDiscussion\nPractical Lab\nDemonstration\n• Direct observation\n• Oral questioning\n• Written test or\nexamination\n• Third party report\n• Demonstration\n(able to impart\nknowledge and\nskills)\n\n--- PDF PAGE 58 ---\nTR HEAVY-EQUIPMENT OPERATION (Tower Crane) Promulgated December 2004/July 2007\n57 / 69\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n5. Maintain tools\nand\nequipment\n5.1 Check condition of\ntools and\nequipment\n5.2 Perform basic\npreventive\nmaintenance\n5.3 Sharpen edge and\ntooth cutting tools\n5.4 Store tools and\nequipment\nAudio Visual\nSimulation\nDiscussion\nPractical Lab\nDemonstration\n• Direct observation\nof application of\ntasks\n• Oral questioning\n• Written test or\nexamination\n• Third party report\n• Demonstration\n\n--- PDF PAGE 59 ---\nTR HEAVY-EQUIPMENT OPERATION (Tower Crane) Promulgated December 2004/July 2007\n58 / 69\n\nCORE COMPETENCIES\n\nCourse Title\n: HEAVY EQUIPMENT OPERATION Level:\n\n TOWER CRANE\n\nNominal Training Hours:\n120 Hours\n\nCourse Description:\n\nThis course is designed to enhance the knowledge, desirable attitudes\nand skills in the use of tower crane in accordance with industry standards. It\ncovers core competencies such as: perform pre- and post operation procedure,\nand perform productive operation on a given tower crane.\n\nTo obtain this, all units prescribed for this qualification must be achieved:\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Perform pre- and\npost operation\nprocedures on\nTower Crane\n1.1 Identify tower crane\ntypes / components\nparts\n1.2 Perform visual check of\nequipment\n1.3 Check BLOWAF of\nTower Crane\n1.3.1 Battery\n1.3.2 Light\n1.3.3 Oil\n1.3.4 Water\n1.3.5 Air\n1.3.6 Fuel\n1.4 Check tower crane\nsystems operation\n1.5 Check safety devices\n& accessories\n1.6 Perform post-\noperations check\nLecture\nPractical /\ndemonstration\n\n• Observation /\nDemonstration\nand interview\n• Written test\n\n2. Perform productive\noperation for\nTower\n Crane\n2.1 Perform loading\n and unloading\n tower crane to\n trailer (low bed)\n2.2 Perform tower - crane\n application\nLecture\nPractical\ndemonstration\n\n• Observation /\nDemonstration\nand interview\n• Written test\n\n--- PDF PAGE 60 ---\nTR HEAVY-EQUIPMENT OPERATION (Tower Crane) Promulgated December 2004/July 2007\n59 / 69\n\n3.2\nTRAINING DELIVERY\n\nThe delivery of training should adhere to the design of the curriculum.\nDelivery should be guided by the 10 basic principles of competency-based TVET.\n\n• The training is based on curriculum developed from the\ncompetency standards;\n• Learning is modular in its structure;\n• Training delivery is individualized and self-paced;\n• Training is based on work that must be performed;\n• Training materials are directly related to the competency\nstandards and the curriculum modules;\n• Assessment is based in the collection of evidence of the\nperformance of work to the industry required standard;\n• Training is based both on and off-the-job components;\n• Allows for recognition of prior learning (RPL) or current\ncompetencies;\n• Training allows for multiple entry and exit; and\n• Approved training programs are nationally accredited.\n\nThe competency-based TVET system recognizes various types of delivery\nmodes, both on and off-the-job as long as the learning is driven by the\ncompetency standards specified by the industry. The following training modalities\nmay be adopted when designing training programs:\n\n• The dualized mode of training delivery is preferred and\nrecommended. Thus programs would contain both in-school\nand in-industry training or fieldwork components. Details can be\nreferred to the Dual Training System (DTS) Implementing Rules\nand Regulations.\n• Modular/self-paced learning is a competency-based training\nmodality wherein the trainee is allowed to progress at his own\npace. The trainer facilitates the training delivery\n• Peer teaching/mentoring is a training modality wherein fast\nlearners are given the opportunity to assist the slow learners.\n• Supervised industry training or on-the-job training is an\napproach in training designed to enhance the knowledge and\nskills of the trainee through actual experience in the workplace\nto acquire specific competencies prescribed in the training\nregulations.\n• Distance learning is a formal education process in which\nmajority of the instruction occurs when the students and\n\n--- PDF PAGE 61 ---\nTR HEAVY-EQUIPMENT OPERATION (Tower Crane) Promulgated December 2004/July 2007\n60 / 69\n\ninstructor are not in the same place. Distance learning may\nemploy correspondence study, or audio, video or computer\ntechnologies.\n\n3.3\n TRAINEE ENTRY REQUIREMENTS\n\nThis section specifies the qualifications of trainees and educational\nexperience. Other requirements like health and physical requirements may also\nbe stated. Passing written entrance examinations may also be indicated if\nnecessary.\n\n• Can communicate both orally and in writing\n\n• Physically and mentally fit\n\n• With good moral character\n\n• Can perform basic mathematical computations.\n\n3.4\nLIST OF TOOLS, EQUIPMENT AND MATERIALS\n\n--- PDF PAGE 62 ---\nTR HEAVY-EQUIPMENT OPERATION (Tower Crane) Promulgated December 2004/July 2007\n61 / 69\n\nRecommended list of tools, equipment and materials for the training of 25\ntrainees for the operation of tower crane.\n\nTOOLS\nEQUIPMENT\nMATERIALS\nQTY\nQTY\nQTY\n1 set\n• Wrenches (box and\nopen-end 8-24 mm-\nmetric & 7/16 –1” -\nEnglish )\n1 unit\n• Tower crane(MOA\n/ rental)\n5 kls\n• Multi-\n purpose\n grease\n1 set\n• Hammer ballpeen\n(3-4 lbs)\n\n1 pair\n• Working\n clothes\n1 set\n• Pliers( mechanical\n10 “)\n\n10\npairs\n• Safety shoes\n1 pc\n\n• Adjustable\n wrench (18 “)\n\n1 pc\n• Grease gun\n\n10\npairs\n• Gloves\n1 set\n• Screw driver ( 10 “\nflat & Philips)\n\n10\npcs\n• Goggles\n\n10\npcs\n• Dust Mask\n\n10\npcs\n• Hard hat\n .\n\n2\nunits\n• Test weights\n- 3 tons\n - 5 tons\n\n1 pc\n• Tower crane\nminiture\n\n1 pc\n• Operator’s\nmanual with\nload chart\n\n--- PDF PAGE 63 ---\nTR HEAVY-EQUIPMENT OPERATION (Tower Crane) Promulgated December 2004/July 2007\n62 / 69\n\n3.5\nTRAINING FACILITIES\n\nThe tower crane operation workshop must be of concrete structure.\nBased on class size of 25 students/trainees the space requirements for the\nteaching/learning and circulation areas are as follows:\n\nSPACE REQUIREMENT\nSIZE IN METERS\nAREA IN SQ.\nMETERS\nTOTAL AREA\nIN SQ.\nMETERS\n• Student/Trainee’s Working\nSpace\n 2.0 x 2.0 meters\n4 sq.m per\nstudent\n100.0 sq.m.\n•\nLecture Room\n8.00 x 6.00\n48.00\n48.0\n•\nLearning Resource Center\n4.00 x 6.00\n24.00\n24.0\n•\n\n172\n• Facilities/Equipment/\nCirculation Area\n-\n-\n52\nTOTAL WORK AREA\n-\n224\nWorking field\n0.25 hectare (MOA/Rental)\n\n--- PDF PAGE 64 ---\nTR HEAVY-EQUIPMENT OPERATION (Tower Crane) Promulgated December 2004/July 2007\n63 / 69\n\n 3.6 TRAINERS’ QUALIFICATION\n\nHEAVY EQUIPMENT OPERATION (LIFTING)\n\nTRAINER QUALIFICATION (TQ II)\n•\nMust be a holder of Heavy-Equipment Operation (Tower Crane)\nNC-II or equivalent qualification\n•\nMust have undergone training on Training Methodology II (TM II)\nor equivalent in training/experience\n•\nMust be computer-literate\n•\nMust be physically and mentally fit\n•\nMust have had at least 5 years job/industry experience*\n•\nMust be a civil-service eligible or holder of appropriate license\nissued by the Professional Regulatory Commission (for\ngovernment positions)\n\n* Optional. Only when required by the hiring institution.\n\nReference: TESDA Board Resolution No. 2004-03\n\n--- PDF PAGE 65 ---\nTR HEAVY-EQUIPMENT OPERATION (Tower Crane) Promulgated December 2004/July 2007\n64 / 69"
