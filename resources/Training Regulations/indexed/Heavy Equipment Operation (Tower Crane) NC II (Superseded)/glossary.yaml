      "term": "For the purpose of this Competency Standard, the words",
      "definition": "1. Attachment Refers to anything like hook block and other accessories/special attachments used instead of the conventional lift block to perform different types of lifting jobs. 2. Derricking Refers to raising and lowering of jib for luffing type of Tower crane. 3. Hoist Refers to the mechanism that is used for raising and lowering the load. 4. Jib Refers to the boom of the Tower crane. It is a long horizontal working arm of the crane that carries the load. 5. Safe Working"
    },
    {
      "term": "Load (SWL)",
      "definition": "Refers to the maximum allowable load that the crane can lift safely. 6. Slewing Refers to the transferring of load by swinging the jib from left to right. 7. Slewing unit Attached on top of the mast that allows the crane to rotate. 8. Tower Crane Refers to the type of crane that is used for high rise buildings/ structures or construction sites which are of fixed base mounted, rail mounted, self erecting/climbing type, free standing type and luffing type, used for lifting construction materials. 9. Trolleying Refers to the movement of the load in and out from the crane center. 10. Weathervaning device Refers to a safety device to free the jib movement during adverse weather conditions. TR HEAVY-EQUIPMENT OPERATION (Tower Crane) NC II Promulgated July 2007 67 / 69"
