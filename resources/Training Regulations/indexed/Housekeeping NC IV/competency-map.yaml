  "source_text": "SECTION 1 HOUSEKEEPING NC IV QUALIFICATION\n\nThe Housekeeping NC IV Qualification consists of competencies that a person must achieve\nto manage a team of housekeeping and laundry service staff for guests in hotels, motorist inn,\nrestaurants, clubs, canteens, resorts, luxury liner and other establishments offering\nhousekeeping services within the company’s established standards. Specifically, it includes\ncompetencies on planning and scheduling routine maintenance, repairs of physical assets;\nplanning and managing housekeeping services for guests; managing lost and found\nprocedures; managing inventory, storage and issuance of linen and uniform; and managing\nlaundry/valet service.\n\nThis Qualification is packaged from the competency map of the Tourism Sector (Hotel\nand Restaurant) as shown in Annex A.\n\nThe Units of Competency comprising this Qualification include the following:\n\n .\nCODE NO.\nBASIC COMPETENCIES\n500311401\nUtilize specialized communication skills\n500311402\nDevelop and lead teams\n500311403\nPerform higher-order thinking processes and apply techniques in\nthe\n\nworkplace\n500311404\nContribute to the practice of social justice in the workplace\n500311405\nManage innovative work instructions\n500311406\nManage and evaluate usage of information\n500311407\nLead in improvement of Occupational Safety and Health (OSH)\nprograms, policies and procedures\n 500311408\nLead towards improvement of environment work programs, policies\nand procedures\n 500311409\nSustain entrepreneurial skills\n\nCODE NO.\nCOMMON COMPETENCIES\nTRS141208\n Maintain hospitality industry knowledge\n TRS141209 Perform child protection duties relevant to the tourism industry\nTRS141210 Develop and supervise operational approaches\nTRS141211\n Manage quality customer service\nTRS141212 Manage finances within a budget\nTRS141213 Plan and implement a series of training events\n TRS141214 Use the assessment system for training outcomes\n\n--- PDF PAGE 6 ---\nDRAFT\n\nHousekeeping NC IV Revision 01 Promulgated (10/15/2019) 2\n\nCODE NO.\nCORE COMPETENCIES\n\n TRS515305 Plan and schedule routine maintenance, repairs of physical assets\n TRS515306\nPlan and manage housekeeping services for guests\n TRS515307\nManage lost and found procedures\n TRS515308 Manage inventory, storage and issuance of linen and uniforms\n\n TRS515309 Manage Laundry/Valet Service\n\nA person who has achieved this Qualification is competent to be a/an:\n\n❑ Housekeeping Assistant Manager\n❑ Housekeeping Manager\n❑ Head Housekeeper\n❑ Assistant Housekeeper Administrator\n❑ Assistant Executive Housekeeper\n❑ Laundry Manager\n\n--- PDF PAGE 7 ---\nDRAFT\n\nHousekeeping NC IV Revision 01 Promulgated (10/15/2019) 3"
