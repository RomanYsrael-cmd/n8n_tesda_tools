  "source_text": "COMPETENCY MAP - TOURISM Sector\n(Hotel and Restaurant)\n HOUSEKEEPING NC IV\nBASIC COMPETENCIES\n\n--- PDF PAGE 149 ---\nHousekeeping NC IV Revision 01 Promulgated (10/15/2019) 145\n\nUtilize\nspecialize\nspecialized\ncommunication\nskill\nDevelop\nand lead\nteams\nPerform\nhigher order\nthinking\nprocesses\nand apply\ntechniques in\nthe workplace\nContribute\nto the\npractice of\nsocial\njustice in\nthe\nworkplace\nManage\ninnovative work\ninstructions\nManage\nevaluate\nusage of\ninformation\nLead in\nimprovement\nof\nOccupational\nSafety and\nHealth\nProgram,\nPolicies and\nProcedures\nLead\ntowards\nimprovement\nof\nenvironment\nal work\nprograms,\npolicies and\nprocedures\nSustain\nentrepreneurial\nskills\nManage and\nsustain\neffective\ncommunication\nstrategies\nManage and\nsustain high\nperforming\nteams\nEvaluate\nhigher order\nthinking skills\nand adjust\nproblem\nsolving\ntechniques\nAdvocate\nstrategic\nthinking for\nglobal\ncitizenship\nIncorporate\ninnovation into\nwork procedures\nDevelop\nsystems in\nmanaging,\nand\nmaintaining\ninformation\nManage\nImplementatio\nn of OSH\nprograms in\nthe workplace\nManage\nimplementatio\nn of\nenvironmental\nprogram in\nthe workplace\nDevelop and\nsustain a high-\nperforming\nenterprise\nBASIC COMPETENCIES\n\n--- PDF PAGE 150 ---\nHousekeeping NC IV Revision 01 Promulgated (10/15/2019) 146\n\nReceive and\nresolve\ncustomer\ncomplaints\nWork\ncooperatively in\na general\nadministration\nenvironment\nMaintain quality\ncustomer/ guest\nservice\nRoster staff\nControl and\nOrder stock*\nPrepare and\ndeliver\ntraining\nsessions\nPlan,\nconduct and\nevaluate\nstaff\nperformance\nassessment\n\nMaintain\nhospitality\nindustry\nknowledge\nPerform child\nprotection duties\nrelevant to the\ntourism industry\nDevelop and\nsupervise\noperational\napproaches\nManage\nquality\ncustomer\nservice\nManage\nfinances\nwithin a\nbudget\nPlan and\nimplement a\nseries of\ntraining\nevents\nUse the\nassessment\nsystem for\ntraining\noutcome\n\nDevelop and\nupdate tourism\nindustry\nknowledge\nDevelop\nprotective\nenvironments\nfor children in\ntourism\ndestinations\nEstablish and\nmaintain a\nbusiness\nrelationship\nGather and\npresent\nproduct\ninformation\nMaintain\nquality\ncustomer/gue\nst service\nManage and\nresolve\nconflict\nsituations\nManage\nfinancial\nperformance\nwithin a\nbudget\nMonitor and\nevaluate the\neffectiveness\nof training\noutcome\nEvaluate the\neffectiveness\nof\nassessment\nsystem\nCOMMON COMPETENCIES\n\n--- PDF PAGE 151 ---\nHousekeeping NC IV Revision 01 Promulgated (10/15/2019) 147\n\nProvide housekeeping\nservices to guests\nClean and prepare rooms\nfor incoming guests\nProvide\nvalet/butler\nservice\nLaundry linen and guest\nclothes\nClean\npublic\nareas,\nfacilities and equipment\nDeal with/Handle\nintoxicated guests\nSupervise room cleaning\nand maintenance\nrequirement\nSupervise housekeeping\nservices to guests\nImplement lost and found\nprocedures\nSupervise laundry of linen,\nuniform and guest clothes\nPlan and schedule\nroutine maintenance,\nrepairs of physical\nassets\nPlan and manage\nhousekeeping services for\nguests\nManage lost and found\nprocedures\nManage inventory, storage\nand issuance of linen and\nuniforms\nManage laundry/valet\nService\n\nCORE COMPETENCIES\n\n--- PDF PAGE 152 ---\nHousekeeping NC IV Revision 01 Promulgated (10/15/2019) 148\n\nGLOSSARY OF TERMS\n\n1. BOSH\n\nBasic Occupational Safety and Health\n2. CCTV\n\nClosed Circuit Television\n3. Chemical\n\nA product, normally in liquid form, used to clean a surface/for\nlaundry\n4. Clean\n5. Computer Literate\n\n6. Computer\nRoom/Laboratory\n\nFree from dirt, dust and any foreign matters\nIs defined as the knowledge and ability to utilize computers\nand related technology efficiently, with a range of skills\ncovering levels from elementary use to computer\nprogramming and advanced problem solving.\nThis area has an array of computer units where trainees are\nprovided to learn and gain appropriate IT competencies as\nmay be prescribe in the competency standard and\ncurriculum. Computer units are in a LAN environment holed\nto an ISP for internet access.\n7. Condemning linen\n8. Contextual\nLearning\nRemoval of worn out or damaged linen from circulation\nthis facility ensures that the underpinning knowledge, the\nscience, mathematics and communication principles as\napplied to the technology are provided to the trainee.\n9. Deodorizer\nA product used to absorb odour and any unpleasant smell\n10. Disinfectant\n\n11. Distance Learning\nArea\nAny chemical agent used to destroy the growth of harmful\norganisms\nThis is to enable the learning provision outside and away\nfrom the training institution in term of print and non-print\nmedia.\n12. Dry Cleaning\nThe process of cleaning of delicate garments, fabrics, etc.,\nwith the use of chemicals rather than water\n13. Duvet\nA set of quilt usually down-filled used for bed making\n14. Emergency\nManagement Plan\nA document detailing the response of the venue/staff\nmembers when a variety of emergency situations arise\n15. External regulations Referring to policies and guidelines issued by related\ngovernment agencies\n16. ETA\n\nEstimated time of arrival\n17. ETD\n\nEstimated time of departure\n18. Extraction\nequipment\nThe equipment used for the removal of moisture from linens\nby way of high speed rotations\n19. Fittings\nAnything attached to a ceiling wall or floor to house a room\nequipment\n20. Folding Machine or\nAutomatic Folder\nThe machine which folds linen in a pre-determined way\n21. Formula\n\nThe combination of water, temperature and chemicals to\nsuccessfully launder different categories of linen\n22. Furnishings\n\nMovable items of furniture in a guest room, such as chairs\nand tables\n23. HACCP\nHazard Analysis Critical Control Point\n24. Kitchenette\nA small kitchen or part of another room equipped with\nkitchen tools\n\n--- PDF PAGE 153 ---\nHousekeeping NC IV Revision 01 Promulgated (10/15/2019) 149\n\n25. KPIs\nKey Performance Indicators\n26. KRAs\nKey Result Areas\n27. Laundry\n\n28. Learning Resource\nCenter\n\nArticles of clothing, linens, etc., that have been or are to be\nwashed\n\nThis area is providing the trainee with the knowledge\nrequirements in the various modules responding to the\ncompetencies. The area has an array of learning materials in\nprint or soft-copies from a multimedia environment.\n29. Linens\n\nRefers to all items that includes bed linen, food service linen\nand such other hotel clothing materials for laundry\n30. Lint\nLoose fibres from the laundered linen that are to be removed\nthrough processing\n31. Malfunction\n\nFailure to function properly\n32. Outsource laundry\n\nPatronize external laundry contractor for the laundry of hotel\nlinens\n33. OSH\n\nOSH refers to ‘Occupational Safety and Health. It relates to\nworkplace health and safety policies, procedures and\npractices\n34. Par stock\n\nThe amount of linen required for the days operation\n35. Polish\n\nUsed to enhance the smoothness and the glossy\nappearance of furniture and fixtures with a cloth and an\nappropriate chemical\n36. PPE\n\n37. Practical work area\n\nPersonal protective equipment (includes the uniform and the\nsafety materials)\n\nThis area is where the trainee acquires the skills and\nknowledge components of the competencies prescribed by\nthe standard.\n38. SOP\n\nStandard Operating Procedure\n\n39. Suite room\n\nHotel accommodation with two rooms: receiving and\nbedroom\n40. Housekeeping\ntrolley\nA transport equipment used to move housekeeping supplies\nand linens from room to room\n41. Turndown service\n\nIs the evening service to prepare the room for guest sleep\nthat includes tidying the room, dimming the light and fixing\nthe bed linen\n42. Twin room\n\nTwo beds in a room\n43. UHF\nUltra-high frequency\n\n--- PDF PAGE 154 ---\nHousekeeping NC IV Revision 01 Promulgated (10/15/2019) 150\n\nTRAINING REGULATIONS (TR)\nDOCUMENT REVISION HISTORY\n\nQualification Title :\nQualification Code :\nHousekeeping NC IV\nTRSHSK419\n\nRevision\nNo.\nDocument\nTypes*\nQualification Title\nTESDA Board\nResolution\nNo./\nDate\nDeployment\n(TESDA\nCircular/\nImplementing\nGuidelines)\n00\nDocument Created\n\nHousekeeping\nNC IV\n2007-41 /\n11/22/2007\nN/A\n01\nDocument Amended\n\nHousekeeping\nNC IV\n2019-57/\n1015/2019\n\nLegend: *Description Types\n- Document Created\n- Document Amended\n\n--- PDF PAGE 155 ---\nHousekeeping NC IV Revision 01 Promulgated (10/15/2019) 151\n\nACKNOWLEDGMENTS\n\nThe Technical Education and Skills Development Authority (TESDA) wishes\nto extend thanks and appreciation to the many representatives of business, industry,\nacademe and government agencies who donated their time and expertise to the\ndevelopment and validation of these Training Regulations.\n\nTECHNICAL EXPERTS/TESDA EXPERTS PANEL\n\nGLORIA BAKEN WONG-SIY\nLILIBETH ARAGON\nIndustry Expert-Consultant/\nFounding President/Auditor\nAssociation of Administrators in\nHospitality Hotel and Restaurant\nManagement Educational Institutions\n(AAHRMEI)/TIBFI\nASEAN Master Trainer\nDean CITHM/VP Internal\nLyceum of the Philippines University\nIntramuros, Manila/AAHRMEI\nASEAN Master Trainer\n\nJAEWE PIANSAY\nNational Assessor/Trainer\nUNO Caregiver and Domestic Mngt.\nTraining, Inc.\nAAHRMEI\n\nANABELLE O. MORENO\nBoard of Trustees\nTourism Industry Board Foundation, Inc.\n(TIBFI)\nASEAN Master Trainer\nMA. CHRISTINA G. AQUINO\nExecutive Director/Chair\nLyceum of the Philippines University\nIntramuros, Manila/TIBFI\nASEAN Master Assessor\n\nHESSEL A. LARCIA\nNational Union Workers in Hotel\nand Allied Industries\n(NUWHRAIN-Restaurant Sentro)\nTIBFI\n\nDANIEL L. EDRALIN\nNational Union Workers in Hotel\nand Allied Industries\n(NUWHRAIN-Restaurant Sentro)\nTIBFI\n\nNITA JEAN C. FERNANDEZ\nEmperor Int’l. Training & Assessment\nCenter, Inc.\nAAHRMEI\n\nJOSEFINA DAGURO\nExecutive Housekeeper\nAstoria Plaza Hotel\n\nMA. AFRECITA D. NIEVA\nDirector of Sales and Marketing\nAIM Conference Center-Manila UP\nDiliman\nCollege of Home Economics Faculty\n\n--- PDF PAGE 156 ---\nHousekeeping NC IV Revision 01 Promulgated (10/15/2019) 152\n\nThe Participants in the Validation of these Training Regulations\n\nAdeline Susan C. Carag\nThe Manila Hotel\n\nEmmimarie Judie Laurel\nThe Peninsula Manila\n\nMarianne C. Tirona\nHPMS Inc.\n\nTourism Industry Board Foundation, Inc. (TIBFI)\n\nThe MEMBERS of the TESDA Board and Secretariat\n\nThe MANAGEMENT and STAFF of the TESDA Secretariat\n• Qualifications and Standards Office (QSO)\n• TR Development Team/Facilitators\n- Ma. Isabel G. Gamurot\n- Evangeline A. Cosep\n- Howard Mark N. Plete",
