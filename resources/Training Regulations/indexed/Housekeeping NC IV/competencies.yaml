          "source_text": "REQUIRED \nKNOWLEDGE \n \nREQUIRED \nSKILLS \n1. Evaluate \neffectiveness \nand efficiency \nof the \nworkplace \nsystems, \nprocesses and \nprocedures. \n1.1 Effectiveness and \nefficiency of \nworkplace standards \nand procedures are \nexamined. \n1.2. Usage of inquiry and \ndialogue to \ncommunicate \nevaluation measures \nand results are \nimplemented. \n1.3   Evaluation reports are \nprepared and \ncommunicated to team \nmembers. \n \n1.1 Systems, \nstandards, \nprocedures and \nprotocols in the \nworkplace. \n1.2 Different methods \nof critical and \nappreciative \ninquiry and their \nrelevance to \ndifferent \nsituations \n1.3 Techniques to \nassist in forming \nthe habit of \nasking questions \nand taking \nresponsibility for \nanswers. \n1.4 Why questions \nare important and \nthe benefits of \nasking good \nquestions for \nindividuals, \nbusinesses and \ncommunities (the \nimportance of \ncritical thinking). \n1.1 Using range of \nanalytical \ntechniques (e.g., \nplanning, attention, \nsimultaneous and \nsuccessive \nprocessing of \ninformation). \n1.2 Communicating to \nactively listen and \nto ask questions of \nothers in a \nconstructive way. \n1.3 Using critical \nthinking pathway to \nformulate and ask \nrelevant questions \nand come up with \nappropriate \nanswers. \n1.4 Performing \nassimilation and \naccommodation \nskills to interpret \nand distil key \ninformation of \nrelevance to a \ngiven situation. \n1.5 Assessing and \nmeasuring the \nextent of \neffectiveness and \nefficiency of the \nsystems, processes \nand procedures in \nthe workplace.\n\n--- PDF PAGE 20 ---\nDRAFT \n \nHousekeeping NC IV   Revision 01             Promulgated  (10/15/2019)                                                                         16 \n \n \n \nELEMENTS \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \n \nREQUIRED \nKNOWLEDGE \n \nREQUIRED \nSKILLS \n2. Foster the \nhabit of critical \ninquiry and \ncuriosity in the \nworkplace. \n2.1 Issues and situations \nare reflected on and \nwondered about. \n2.2 Issues and problems \nin the workplace \nparticularly in the \npolicies, procedures \nand protocols are \ndiscussed and \nevaluated between \nand among teams. \n2.3 Evaluation of \nefficiency and \neffectiveness of \nworkplace policies, \nprocedures and \nprotocols are \ndocumented, \ncommunicated and \nagreed upon between \nand among teams. \n2.4 Growth mindset and \npositive relationship \nand communication is \napplied in the context \nof curiosity and \ncritical inquiry in the \nworkplace. \n2.1 Different methods \nof critical and \nappreciative \ninquiry and their \nrelevance to \ndifferent \nsituations. \n2.2 Techniques to \nassist in forming \nthe habit of \nasking questions \nand taking \nresponsibility for \nanswers. \n2.3 Why questions \nare important and \nthe benefits of \nasking good \nquestions for \nindividuals, \nbusinesses and \ncommunities (the \nimportance of \ncritical thinking). \n2.4 Growth mindset \nand positive \ncommunication \nand relationship \nstrategies and \ntechniques. \n2.1 Using range of \nanalytical \ntechniques (e.g., \nplanning, attention, \nsimultaneous and \nsuccessive \nprocessing of \ninformation). \n2.2 Communicating to \nactively listen and to \nask questions of \nothers in a \nconstructive way. \n2.3 Using critical \nthinking pathway to \nformulate and ask \nrelevant questions \nand come up with \nappropriate \nanswers. \n2.4 Performing \nassimilation and \naccommodation \nskills to interpret and \ndistil key information \nof relevance to a \ngiven situation. \n2.5 Assessing and \nmeasuring the \nextent of \neffectiveness and \nefficiency of the \nsystems, processes \nand procedures in \nthe workplace. \n2.6 Communicating \ninsights on \nworkplace \neffectiveness and \nefficiency.\n\n--- PDF PAGE 21 ---\nDRAFT \n \nHousekeeping NC IV   Revision 01             Promulgated  (10/15/2019)                            