ted in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\nguidelines that apply\nto the hotel and travel\nindustries, including\nthe main objectives,\nrequirements and\nimpact on individual\nstaff\n2. Source and\napply\ninformation on\nlegal and ethical\nissues for the\nhospitality\nindustry\n\n2.1 Information on legal\nissues and ethical\nissues to assist\neffective work\nperformance are\nobtained\n2.2 Information on legal\nethical issues are\nreviewed and\nselected\n2.3 Day-to-day hospitality\nindustry activities are\nconducted in\naccordance with legal\nobligations and\nethical industry\npractices\n\n2.1 Basic research\n2.2 Sources of Industry\ninformation\n2.3 Different sectors of the\nhospitality industry\nand their inter-\nrelationships,\nincluding a general\nknowledge of the role\nand function of the\nfollowing: food and\nbeverage, front office,\nfood production/\nkitchen operations,\nhousekeeping, travel\nagencies and tour\noperations\n2.4 Quality assurance,\nquality activities and\ncontinuous\nimprovement in the\nhotel and travel\nindustries and the role\nof individual staff\nmembers within the\ntotal quality process\n2.5 Role of trade unions\nand employer groups\nin the industry\n2.6 Environmental\nresponsibilities of the\nindustry, including\nwaste minimization\nand recycling\n2.7 Legislation,\nregulations and\nguidelines that apply\nto the hotel and travel\nindustries, including\nthe main objectives,\nrequirements and\nimpact on individual\nstaff\n2.1 Questioning and\ncommunication\nskills\n2.2 Analytical skills\n2.3 Networking skills\n2.4 Ability to\nresearch\nindustry\ninformation\nsources\n2.5 Obtaining\ninformation on\nlegal and ethical\nissues\n\n--- PDF PAGE 50 ---\nDRAFT\n\nHousekeeping NC IV Revision 01 Promulgated (10/15/2019) 46\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n3. Update\nhospitality\nindustry\nknowledge\n\n3.1 A range of\nopportun