rmation system are\nsubmitted to designated\npersons/ groups.\n\n3.1. Analysis and\ndisplay techniques\n3.2. Information\ncollection, collation\n3.3. Information\nevaluation issues\n3.4. Information\nstorage\nrequirements and\nmethods\n3.5. Reporting\nprocedures of the\norganisation\n3.1. Analysing record\ninformation\n3.2. Collecting and\ncollating information\n3.3. Communicating\neffectively\n3.4. Disseminating\ninformation\n3.5. Presenting\ninformation\n3.6. Using management\ninformation systems\nto store and retrieve\ndata\n\n--- PDF PAGE 33 ---\nDRAFT\n\nHousekeeping NC IV Revision 01 Promulgated (10/15/2019) 29\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n4. Report and\ndisseminate\nanalyzed\ninformation\n\n4.1. The results of\ninformation gathering,\nanalysis and synthesis\nare reported within\nspecified time frames\nand to the standard\ndefined by the\norganisation.\n4.2. The results of\ninformation gathering,\nanalysis and synthesis\nare reported so they\ncan be inputs to policy\ndevelopment and\norganisation decision\nmaking.\n4.3. Information which is\ngathered is\ndisseminated to\nappropriate personnel\nwithin the specified\ntimeframe\n4.1. Analysis and\ndisplay techniques\n4.2. Information\ncollection, collation\n4.3. Information\nevaluation issues\n4.4. Information\nstorage\nrequirements and\nmethods\n4.5. Reporting\nprocedures of the\norganisation\n\n4.1. Analysing record\ninformation\n4.2. Collecting and\ncollating information\n4.3. Communicating\neffectively\n4.4. Disseminating\ninformation\n4.5. Presenting\ninformation\n4.6. Using management\ninformation systems\nto store and retrieve\ndata\n\n--- PDF PAGE 34 ---\nDRAFT\n\nHousekeeping NC IV Revision 01 Promulgated (10/15/2019) 30\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Information\nMay include:\n1.1 Routine and complex reports and submissions\n1.2 Briefing notes\n1.3 Ministerial\n1.4 Proposals\n1.5 