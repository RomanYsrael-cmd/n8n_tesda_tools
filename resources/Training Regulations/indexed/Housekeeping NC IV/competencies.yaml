        "source_text": "--- PDF PAGE 13 ---\nDRAFT \n \nHousekeeping NC IV   Revision 01             Promulgated  (10/15/2019)                                                                         9 \n \n \nUNIT OF COMPETENCY: \nDEVELOP AND LEAD TEAMS   \n \nUNIT CODE \n: \n500311402 \n \n \nUNIT DESCRIPTOR \n: \nThis unit covers the skills, knowledge and attitudes required to \ndetermine individual and team development needs and facilitate \nthe development of the workgroup. \n \n \n \nELEMENTS \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range of \nVariables \n \nREQUIRED \nKNOWLEDGE \n \nREQUIRED \nSKILLS \n1. Foster \nIndividual \ngrowth \n1.1  Learning and \ndevelopment needs \nof team members are \nsystematically \nidentified in line with \norganizational \nrequirements \n1.2  Development plan to \nmeet individual needs \nis collaboratively \ndeveloped and \nimplemented \n1.3  Individuals are \nencouraged to self -\nevaluate performance \nand identify areas for \nimprovement \n1.4  Feedback on \nperformance of team \nmembers is collected \nfrom relevant sources \nand compared with \nestablished team \nlearning process \n1.1 Effective \nworkplace \ncommunication, \ncoaching and \nmentoring \nprinciples \n1.2 Feedback \nprinciples and \nprocedures \n1.3 Working  \ninterdependently: \nstrategies and \ntechniques \n1.4 Leadership \nConcepts: \n• Types of \nDecisions \nTeams Make \n• Team \nResponsibilities \n• Problems That \nAffect Teams \n• Building Strong \nTeam \nCommunication \n• Expressing \nYourself on a \nTeam \n• Team Problem \nSolving \n \n1.1 Ability to read and \nunderstand a \nvariety of texts, \nprepare general \ninformation and \ndocuments \naccording to target \naudience; spell with \naccuracy; use \ngrammar and \npunctuation \neffective \nrelationships and \nconflict \nmanagement \n1.2 Coaching and \nmentoring skills to \nprovide support to \ncolleagues \n1.3 Communication \nskills including \nreceiving feedback \nand reporting, \nmaintaining \neffective \nrelationships and \nconflict \nmanagement \n1.4 Ability to relate to \npeople from a \nrange of social, \ncultural, physical \nand mental \nbackgrounds \n1.5 Planning skills to \norganize required \nresources and \nequipment to meet \nlearning needs\n\n--- PDF PAGE 14 ---\nDRAFT \n \nHousekeeping NC IV   Revision 01             Promulgated  (10/15/2019)                                                                         10 \n \n \n \nELEMENTS \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range of \nVariables \n \nREQUIRED \nKNOWLEDGE \n \nREQUIRED \nSKILLS \n \n \n \n1.6 Reporting skills to  \norganize \ninformation; assess \ninformation for \nrelevance and \naccuracy; identify \nand elaborate on \nlearning outcomes \n1.7 Facilitation skills to \nconduct small \ngroup training \nsessions \n2. Foster \nindividual and \nteam growth \n2.1. Learning and \ndevelopment program \ngoals and objectives \nare identified to match \nthe specific \nknowledge and skills \nrequirements of \ncompetency \nstandards \n2.2. Learning delivery \nmethods are \nappropriate to the \nlearning goals, the \nlearning style of \nparticipants and \navailability of \nequipment and \nresources \n2.3. Workplace learning \nopportunities and \ncoaching/ mentoring \nassistance are \nprovided to facilitate \nindividual and team \nachievement of \ncompetencies \n2.4. Resources and \ntimelines required for \nlearning activities are \nidentified and \napproved in \naccordance with \norganizational \nrequirements \n2.1    Advanced \ncoaching and \nmentoring \ntechniques \n2.2   Performance \nevaluation \nconcepts \n2.3   Training and \ndevelopment \ntechniques  \n \n2.1  Instructional \nplanning and \ndelivery skills \n2.2  Monitoring and \nevaluation skills \n2.3  Mentoring and \ncoaching skills\n\n--- PDF PAGE 15 ---\nDRAFT \n \nHousekeeping NC IV   Revision 01             Promulgated  (10/15/2019)                                               