        "source_text": "--- PDF PAGE 109 ---\nDRAFT \n \nHousekeeping NC IV   Revision 01             Promulgated  (10/15/2019)                                                                         105 \n \nUNIT OF COMPETENCY : \nMANAGE LAUNDRY AND VALET SERVICE \n \n \n \n \n \nUNIT CODE \n: \nTRS515309 \n \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge, skills and attitudes required \nto manage laundry and valet services in an accommodation \nestablishment.  This role would generally be undertaken by \nexperienced staff members with sound organizational and \ninterpersonal skills \n \n \n \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range of \nVariables \n \nREQUIRED  \nKNOWLEDGE \n \nREQUIRED  \nSKILLS \n1. Establish \nrequirements for \nproviding \nlaundry and \nvalet service \n1.1 Laundry and valet \nrequirements are \nidentified and \ndeveloped in \naccordance with the \nestablishments’ \npolicies and \nprocedures \n1.2 Evaluation for laundry \nand valet requests is \ndeveloped  \n1.3 Policy for laundry \npersonnel is prepared \naccordingly \n1.1 Standards \noperational \npolicies and \nprocedures \n1.2 General \nknowledge about \nBOSH \n1.3 Updates on \nsystems and \nprocesses \n1.4 Policies on Green \nPractices \n1.1 Documentation \nskills \n1.2 Customer service \nskills \n1.3 BOSH application \n2.  Monitor staff \nresponse to \nguest queries \nfor laundry and \nvalet services \n \n2.1 Queries on policies and \nprocedures are \nmonitored in \naccordance with \norganizational \nstandards.  \n2.2 Documentation in \nrelation to the inquiry on \nlaundry and valet \nservices are evaluated. \n2.1 Standards \noperational \npolicies and \nprocedures \n2.2 General \nknowledge about \nBOSH \n2.3 Updates on \nsystems and \nprocesses \n2.4 Policies on Green \nPractices  \n \n2.1 Communication \nskills including \nreceiving \nfeedback and \nreporting, \nmaintaining \neffective \nrelationships  \n2.2 Documentation \nskills \n2.3 Customer service \nskills \n2.4 BOSH application\n\n--- PDF PAGE 110 ---\nDRAFT \n \nHousekeeping NC IV   Revision 01             Promulgated  (10/15/2019)                                                                         106 \n \n \n \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range of \nVariables \n \nREQUIRED  \nKNOWLEDGE \n \nREQUIRED  \nSKILLS \n3.  Evaluate the \nimplementation \nof the \nprovisions for \nlaundry and \nvalet services  \n3.1 Procedures for \nreceiving request for \nlaundry and valet \nservices are assessed \n3.2 Procedures for delivery \nof laundry services to  \nguests are monitored \n3.3 Actions undertaken by \nlaundry and valet \npersonnel are \nevaluated \n3.1 Standards operational \npolicies and \nprocedures \n3.2General knowledge \nabout BOSH \n3.3 Updates on systems \nand processed \n3.4 Policies on Green \nPractices  \n3.1 Planning skills \n3.2 Analytical skill \n3.3 Decision making \nskills\n\n--- PDF PAGE 111 ---\nDRAFT \n \nHousekeeping NC IV   Revision 01             Promulgated  (10/15/2019)                                                                         107 \n \nRANGE OF VARIABLES  \n \n \nVARIABLE \n \n \nRANGE \n \n1.  Establishments’ policies and \nprocedures \nMay include: \n1.1 Schedule for collecting and delivering linen \n1.2 Process for delivering linens in guest rooms \n1.3 Handling lost and damaged items \n1.4 Receiving guest complaints \n2.Laundry and valet services \nMay include: \n1.1 Guest clothes laundry \n1.2 Ironing/pressing guest clothes \n1.3 Sewing of buttons and hem \n1.4 Shoe shine \n1.5 Car washing\n\n--- PDF PAGE 112 ---\nDRAFT \n \nHousekeeping NC IV   Revision 01             Promulgated  (10/15/2019)                                                                         108 \n \nEVIDENCE GUIDE \n, \n1.  Critical aspects of \nCompetency \nAssessment requires evidences that the candidate: \n1.1 Demonstrated ability to apply plan and manage laundry and  \nvalet service. \n2.  Resource \nImplications \nThe following resources must be provided: \n2.1 Training and assessment to include access to a real or \nsimulated workplace; and access to workplace standards, \nprocedures, policies, guidelines, tools and equipment. \n \n3.  Method of \nAssessment \nCompetency may be assessed through: \n1.1 Case studies \n1.2 Demonstration and oral questioning \n1.3 Review of portfolios of evidence of on-the-job performance \nby the candidate  \n \n4.  Context of \nAssessment \n4.1 Competency may be assessed in actual workplace or at \nthe designated TESDA Accredited Assessment Center\n",
