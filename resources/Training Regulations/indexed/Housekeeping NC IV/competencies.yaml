        "source_title": "MANAGE QUALITY CUSTOMER SERVICE",
        "source_text": "--- PDF PAGE 66 ---\nDRAFT \n \nHousekeeping NC IV   Revision 01             Promulgated  (10/15/2019)                                                                         62 \n \n      UNIT OF COMPETENCY : \nMANAGE QUALITY CUSTOMER SERVICE \n \nUNIT CODE \n: \nTRS141211 \n \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge, skills and attitudes required to \nmanage customer service quality in the workplace within a \ntourism or hospitality context.  It focuses on the need to \ndevelop active approaches to service quality issues with some \nstrategic focus. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \n Range of Variables \n \nREQUIRED \nKNOWLEDGE \n \nREQUIRED \nSKILLS \n1. Develop \napproaches to \nenhance \ncustomer \nservice quality \n1.1 Information on \ncustomer needs, \nexpectations and \nsatisfaction levels is \nobtained using both \ninformal and formal \nresearch. \n1.2 Opportunities are \nprovided for both \ncustomers and \ncolleagues to provide \nfeedback on products \nand services. \n1.3 Changes in internal \nand external \nenvironments are \nreviewed and findings \nare integrated into \nplanning for quality \nservice. \n1.4 Opportunities are \nprovided for colleagues \nto participate in the \ncustomer service \nplanning process. \n1.5 Standards and plans \nare developed to \naddress key quality \nservice issues. \n1.1 Communication \ntechniques \n1.2 Informal and formal \nresearch \n1.3 Customer service \nrelations \n1.4 Actions that can be \nimplemented by \nstaff working in the \nhotel and travel \nindustries \n1.5 Quality customer \nservice \n1.6 Feedback \nmechanism \n \n1.1 Questioning and \ncommunication \nskills \n1.2 Research skills \n1.3 Analytical skills \n1.4 Ability to research \nindustry \ninformation \nsources \n1.5 Identifying \nrelevant \ninformation \n1.6 Compilation and \nclassification of \ninformation and \ndata \n1.7 Networking skills \n \n2. Manage the \ndelivery of \nquality service \n2.1 Customer service \nstandards and \nexpectations are \nclearly communicated \nto colleagues. \n2.2 Access to information \non service standards \nand delivery is \nprovided to colleagues \n \n2.1 Communication \ntechniques \n2.2 Customer service \nstandards \n2.3 Actions that can be \nimplemented by \nstaff working in the \nhotel and travel \nindustries \n. \n2.1 Questioning and \ncommunication \nskills \n2.2 Research skills \n2.3 Analytical skills \n2.4 Ability to research \nindustry \ninformation \nsources\n\n--- PDF PAGE 67 ---\nDRAFT \n \nHousekeeping NC IV   Revision 01             Promulgated  (10/15/2019)                                                                         63 \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \n Range of Variables \n \nREQUIRED \nKNOWLEDGE \n \nREQUIRED \nSKILLS \n2.3 Coaching is used to \nassist colleagues to \ndeal with customer \nservice issues and to \ntake responsibility for \nservice outcomes. \n2.4  Customer service in \nthe workplace is \nmonitored to ensure \nstandards are met in \naccordance with \nenterprise policies and \nprocedures. \n \n2.5 Identifying \nrelevant \ninformation \n2.6 Compilation and \nclassification of \ninformation and \ndata \n2.7 Networking skills \n2.8 Monitoring \ncustomer service \n \n3.  Monitor and \nadjust customer \nservice \n3.1 Feedback is sought \nfrom customers on an \nongoing basis and this \nis used to improve \nperformance where \napplicable. \n3.2  Customer service \nproblems are identified \nand adjustments to \nstandards, systems \nand procedures are \nmade to ensure \ncontinued service \nquality. \n3.3  New approaches are \ncommunicated to all \nthose involved in \nservice delivery within \nappropriate \ntimeframes. \n2.1 Communication \ntechniques \n2.2 Customer service \nstandards \n2.3 Actions that can be \nimplemented by \nstaff working in the \nhotel and travel \nindustries \n2.4 Quality customer \nservice \n2.5 Feedback \nmechanism \n2.6 Quality service \nprinciples and \nprocesses \n \n \n2.1 Questioning and \ncommunication \nskills \n2.2 Research skills \n2.3 Analytical skills \n2.4 Identifying \nrelevant \ninformation \n2.5 Networking skills \n2.6 Identifying \ncustomer service \nproblems\n\n--- PDF PAGE 68 ---\nDRAFT \n \nHousekeeping NC IV   Revision 01             Promulgated  (10/15/2019)                                                                         64 \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Informal and formal \nresearch  \nMay include: \n1.1 Talking to customers \n1.2 Qualitative or quantitative research \n1.3 Seeking feedback from service delivery colleagues \n1.4 Analysis of competitive environment \n1.5 Analysis of industry and market trends \n2. Changes in internal and \nexternal environments \nMay include: \n2.1 Management changes \n2.2 Organizational restructuring \n2.3 Introduction of new equipment \n2.4 Recruitment practices \n2.5 Technological changes affecting service delivery \n2.6 Changes in the competitive environment \n2.7 Economic climate \n2.8 Trends in customer preferences \n2.9 Advent of E-business \n3. Customer service \nstandards \nMay include: \n3.1 Response times \n3.2 Service guarantees \n3.3 Pricing guarantees \n3.4 Product quality \n3.5 Document presentation standards \n3.6 Personal presentation standards \n3.7 Complaint management \n4. Customer service issues \nMay include: \n4.1 Response times \n4.2 Service guarantees \n4.3 Pricing guarantees \n4.4 Product quality \n4.5 Document presentation standards \n4.6 Personal presentation standards \n4.7 Complaint management\n\n--- PDF PAGE 69 ---\nDRAFT \n \nHousekeeping NC IV   Revision 01             Promulgated  (10/15/2019)                                                                         65 \n \nEVIDENCE GUIDE \n \n1. Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1 Demonstrated ability to develop proactive \napproaches to the delivery and monitoring of quality \ncustomer service within a specific tourism/hospitality \ncontext \n2.1 Demonstrated knowledge of quality service \nprinciples and processes \n2. Resource implications \nThe following resources should be provided: \n2.1 Project or work activities conducted over a period of \ntime to allow the candidate to establish, monitor and \nevaluate service delivery in a tourism or hospitality \ncontext \n2.2 Involvement of a team for which the candidate is \nleader \n3. Methods of assessment \nCompetency in this unit may be assessed through: \n3.1 Evaluation of projects managed by the candidate in \nconjunction with industry to enhance service delivery \nin a given operation \n3.2 Evaluation of projects managed by the candidate to \ncreate, market and deliver a tourism or hospitality \nservice \n3.3 Case studies to assess specific service delivery \nissues in different workplace contexts \n3.4 Oral or written questions to assess knowledge of \nquality assurance concepts and principles \n3.5 Review of portfolios of evidence and third party \nworkplace reports of on-the-job performance by the \ncandidate \n4. Context of assessment \n4.1  Competency may be assessed in actual workplace or  \nat the designated TESDA Accredited Assessment \nCenter.\n",
