        "source_text": "--- PDF PAGE 85 ---\nDRAFT \n \nHousekeeping NC IV   Revision 01             Promulgated  (10/15/2019)                                                                         81 \n \nUNIT OF COMPETENCY \n:    USE THE ASSESSMENT SYSTEM FOR TRAINING  \n                                                  OUTCOMES \n \nUNIT CODE \n        :    TRS141214 \n \nUNIT DESCRIPTOR            :    This unit covers the knowledge, skills and  behavior required to \nmanage an assessment system for employees within a work \ncontext \n \n \nELEMENT \n PERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the  \nRange of Variables \n \nREQUIRED \nKNOWLEDGE \n \nREQUIRED \nSKILLS \n1.  Communicate \nthe \nassessment \nsystem \n1.1 The purpose of the \nassessment system \nis defined \n1.2 Assessment system \nfeatures and \nprocedures to \nrelevant \nstakeholders is \ndocumented and \ncirculated \n1.3 Procedures for \nkeeping relevant \nstakeholders \ninformed about key \nfeatures of the \nassessment system are \nestablished \n1.1 Communication \ntechniques \n1.2 Assessment system \nfeatures and procedures \n1.3 Enterprise policies and \nprocedures \n1.4 Impact of assessment \nsystem for training \noutcomes \n1.1 Questioning and \ncommunication \nskills \n1.2 Research skills \n1.3 Analytical skills \n1.4 Ability to research \nindustry \ninformation \nsources \n1.5 Networking skills \n1.6 Defining the \npurpose of \nassessment \nsystem \n \n2. Provide \nsupport for \nenterprise \nassessors \n2.1 Assessors meet \nrequired competency \nstandards is verified \n2.2 Required training for \nassessors is \nidentified \n2.3 Moderation of \nassessments is \nprovided.  \n2.4 Feedback to \nassessors on their \nperformance is \nprovided  \n2.5 Networking amongst \nassessors is facilitated  \n2.1 Communication \ntechniques \n2.2 Assessment system \nfeatures and procedures \n2.3 Enterprise policies and \nprocedures \n2.4 Moderation of \nassessment \n2.5 Requirements for \nassessors \n2.6 Feedback mechanism \n \n2.1 Questioning and \ncommunication \nskills \n2.2 Research skills \n2.3 Analytical skills \n2.4 Ability to research \nindustry \ninformation \nsources \n2.5 Networking skills \n2.6 Providing support \nfor enterprise \nassessors \n \n3. Manage the \nassessment \nrecord keeping \nsystem \n \n3.1 The internal records \nrequired to support \nthe assessment \nsystem is identified \nand developed  \n \n3.1 Communication \ntechniques \n3.2 Assessment system \nfeatures and procedures \n3.3 Enterprise policies and \nprocedures \n3.1 Questioning and \ncommunication \nskills \n3.2 Research skills \n3.3 Analytical skills \n3.4 Ability to research\n\n--- PDF PAGE 86 ---\nDRAFT \n \nHousekeeping NC IV   Revision 01             Promulgated  (10/15/2019)                                                                         82 \n \nELEMENT \n PERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the  \nRange of Variables \n \nREQUIRED \nKNOWLEDGE \n \nREQUIRED \nSKILLS \n3.2 The requirements for \ncompleting the \nassessment records \nare described  \n3.3 The assessment \nrecords are filed.  \n3.4 The assessment \nrecord keeping system \nis reviewed and \nupdated.  \n3.4 Standards for \norganizational \nrecordkeeping and audit \nrequirements \n3.5 Requirements for \ncompleting the \nassessment records \n \nindustry \ninformation \nsources \n3.5 Networking skills \n3.6 Updating the \nassessment \nrecord keeping \nsystem \n \n4. Maintain \nquality \nassurance \nprocedures \n4.1 Quality assurance \nprocedures for the \nassessment system \nare defined \n4.2 Internal audits of the \nassessment system \nare undertaken \n4.3 The results of quality \nassurance audits to \nimprove the \nassessment system \nare used \n4.4  The applicability of \nthe existing quality \nassurance procedures \nto the dynamic nature \nof the assessment \nsystem is reviewed  \n4.1 Communication \ntechniques \n4.2 Assessment system \nfeatures and \nprocedures \n4.