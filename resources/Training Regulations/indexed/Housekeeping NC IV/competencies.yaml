          "source_text": "REQUIRED \nKNOWLEDGE \n \nREQUIRED \nSKILLS \n1.  Communicate \nthe \nassessment \nsystem \n1.1 The purpose of the \nassessment system \nis defined \n1.2 Assessment system \nfeatures and \nprocedures to \nrelevant \nstakeholders is \ndocumented and \ncirculated \n1.3 Procedures for \nkeeping relevant \nstakeholders \ninformed about key \nfeatures of the \nassessment system are \nestablished \n1.1 Communication \ntechniques \n1.2 Assessment system \nfeatures and procedures \n1.3 Enterprise policies and \nprocedures \n1.4 Impact of assessment \nsystem for training \noutcomes \n1.1 Questioning and \ncommunication \nskills \n1.2 Research skills \n1.3 Analytical skills \n1.4 Ability to research \nindustry \ninformation \nsources \n1.5 Networking skills \n1.6 Defining the \npurpose of \nassessment \nsystem \n \n2. Provide \nsupport for \nenterprise \nassessors \n2.1 Assessors meet \nrequired competency \nstandards is verified \n2.2 Required training for \nassessors is \nidentified \n2.3 Moderation of \nassessments is \nprovided.  \n2.4 Feedback to \nassessors on their \nperformance is \nprovided  \n2.5 Networking amongst \nassessors is facilitated  \n2.1 Communication \ntechniques \n2.2 Assessment system \nfeatures and procedures \n2.3 Enterprise policies and \nprocedures \n2.4 Moderation of \nassessment \n2.5 Requirements for \nassessors \n2.6 Feedback mechanism \n \n2.1 Questioning and \ncommunication \nskills \n2.2 Research skills \n2.3 Analytical skills \n2.4 Ability to research \nindustry \ninformation \nsources \n2.5 Networking skills \n2.6 Providing support \nfor enterprise \nassessors \n \n3. Manage the \nassessment \nrecord keeping \nsystem \n \n3.1 The internal records \nrequired to support \nthe assessment \nsystem is identified \nand developed  \n \n3.1 Communication \ntechniques \n3.2 Assessment system \nfeatures and procedures \n3.3 Enterprise policies and \nprocedures \n3.1 Questioning and \ncommunication \nskills \n3.2 Research sk