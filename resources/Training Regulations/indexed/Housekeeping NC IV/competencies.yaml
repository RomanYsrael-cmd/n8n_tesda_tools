        "evidence_guide": {
          "source_text": "1. Critical aspects of\nCompetency\nAssessment requires evidences that the candidate:\n1.1 Demonstrated ability to establish lost and found policies\nand procedures.\n1.2 Demonstrated the ability to handle claimed and unclaimed\nlost and found items\n\n2. Resource\nImplications\nThe following resources must be provided:\n2.1 Project or work activities that allow the candidate to\ndevelop policies and procedures for lost and found items.\n\n3. Method of\nAssessment\nCompetency may be assessed through:\n3.1 Demonstration with oral questioning.\n3.2 Review of portfolios of evidence of on-the-job\nperformance by the candidate.\n3.3 Case study\n\n4. Context of\nAssessment\n4.1 Competency may be assessed in actual workplace or at\nthe designated TESDA Accredited Assessment Center\n\n--- PDF PAGE 106 ---\nDRAFT\n\nHousekeeping NC IV Revision 01 Promulgated (10/15/2019) 102\n\nUNIT OF COMPETENCY :\nMANAGE INVENTORY, STORAGE AND ISSUANCE OF\nLINEN AND UNIFORM\n\nUNIT CODE\n:"
        },
        "source_text": "TRS515307\n\nUNIT DESCRIPTOR\n:\nThis unit deals with knowledge, skills and attitudes required\nfor establishing policies and procedures for lost and found\nitems, monitoring of handling of claimed and unclaimed items\nin accordance with established standards.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n1. Establish lost\nand found\npolicies and\nprocedures\n1.1 In-house lost and\nfound policies and\nprocedures are\ndeveloped according\nto establishment’s\nstandards\n1.2 Legal requirements\nthat apply to lost and\nfound items are\nidentified.\n1.3 Lost and found\nregister is established.\n1.1 Standards operational\npolicies and\nprocedures\n1.2 General knowledge\nabout OHS\n1.3 Updates on systems\nand processes\n1.4 Policies on Green\nPractices\n\n1.1 Communication\nskills including\nreceiving\nfeedback and\nreporting,\nmaintaining\neffective\nrelationships and\nconflict\nmanagement\n1.2 Planning skills\n\n2. Monitor lost and\nfound items\n2.1 Lost and found items\nare periodically\nchecked as to safe\nkeeping\n2.2 List of lost and found\nitems are\ndisseminated to\nauthorized\npersonnel\n2.3 Stored items are\nchecked according to\ntype/category\n\n2.1. Standards\noperational policies\nand procedures for\nlost and found\n2.2. Legal regulations for\nunsafe and illegal\nitems\n2.3. BOSH\n2.4. Inventory of Lost and\nFound Items\n2.5. Policies on Green\nPractices\n\n2.1 Applying\nestablishment’s\npolicies and\nprocedures in\n2.2 Ability to\ndistinguish\nitems between\nvaluable and\nnon-valuable\n2.3 Applying legal\nregulations for\nunsafe and\nillegal items\n2.4 Applying BOSH\n3. Monitor claim for\nlost item\n\n3.1 Claimant’s inquiry\neither by phone,\npersonal or in writing\nare assessed\n3.2 Claimants Ownership\nof property is verified\nin accordance to\nworkplace standards\n3.3 Approval for the return\nof lost and found items\nare accomplished in\naccordance with\nworkplace standards\n3.1 Standards operational\npolicies and\nprocedures for lost\nand found\n3.2 Legal regulations for\nunsafe and illegal\nitems\n3.3 BOSH\n3.4 Inventory of Lost and\nFound Items\n3.5 Policies on Green\nPractices\n3.1 Applying\nestablishment’s\npolicies and\nprocedures in\n3.2 Ability to\ndistinguish items\nbetween\nvaluable and\nnon-valuable\n3.3 Applying legal\nregulations for\nunsafe and\nillegal items\n\n--- PDF PAGE 103 ---\nDRAFT\n\nHousekeeping NC IV Revision 01 Promulgated (10/15/2019) 99\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n\n3.4 Lost and found\nregistry is verified\n\n3.4 Applying BOSH\n3.5 Communication\nskills\n4. Monitor\nunclaimed items\n4.1 Policies and\nprocedures for\nunclaimed items are\ncomplied with\naccording to\nworkplace standards\n4.2 Legal obligations for\nunclaimed, unsafe and\nillegal items are\ncomplied with.\n4.3 Unclaimed items from\nstorage facility are\ndocumented and\nremoved for releasing\naccording to\nestablishment\nstandards\n\n4.1 Standards operational\npolicies and\nprocedures for lost\nand found\n4.2 Legal regulations for\nunsafe and illegal\nitems\n4.3 BOSH\n4.4 Inventory of Lost and\nFound Items\n4.5 Policies on Green\npractices\n\n4.1 Ability to\ndistinguish items\nbetween\nvaluable and\nnon-valuable\n4.2 Applying legal\nregulations for\nunsafe and\nillegal items\n4.3 Applying BOSH\n\n--- PDF PAGE 104 ---\nDRAFT\n\nHousekeeping NC IV Revision 01 Promulgated (10/15/2019) 100\n\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Lost and found policies and\nprocedures\nMay include:\n1.1 Handling Procedure\n1.2 Recording Procedure\n1.3 Storage Procedure\n1.4 Disposal Procedures\n2. Authorized personnel\nMay include:\n2.1 Housekeeping Supervisor\n2.2 Duty Manager (Front Office)\n2.3 Security\n2.4 Government entities (PDEA, PNP)\n3. Ownership of property\nMay include :\n3.1 Valid Identification Card\n3.2 Accomplished Lost and Found Form\n3.3 Notarized Authorization Letter/Certificate\n3.4 Guest folio\n4. Policies and procedures\nMay include:\n4.1 Storage holding period\n4.2 Follow up procedures\n4.3 Policy on finder’s right to claim\n\n--- PDF PAGE 105 ---\nDRAFT\n\nHousekeeping NC IV Revision 01 Promulgated (10/15/2019) 101\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidences that the candidate:\n1.1 Demonstrated ability to establish lost and found policies\nand procedures.\n1.2 Demonstrated the ability to handle claimed and unclaimed\nlost and found items\n\n2. Resource\nImplications\nThe following resources must be provided:\n2.1 Project or work activities that allow the candidate to\ndevelop policies and procedures for lost and found items.\n\n3. Method of\nAssessment\nCompetency may be assessed through:\n3.1 Demonstration with oral questioning.\n3.2 Review of portfolios of evidence of on-the-job\nperformance by the candidate.\n3.3 Case study\n\n4. Context of\nAssessment\n4.1 Competency may be assessed in actual workplace or at\nthe designated TESDA Accredited Assessment Center\n\n--- PDF PAGE 106 ---\nDRAFT\n\nHousekeeping NC IV Revision 01 Promulgated (10/15/2019) 102\n\nUNIT OF COMPETENCY :\nMANAGE INVENTORY, STORAGE AND ISSUANCE OF\nLINEN AND UNIFORM\n\nUNIT CODE\n:"
