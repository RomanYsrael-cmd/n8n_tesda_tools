        "evidence_guide": {
          "source_text": "1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Demonstrated knowledge of basic budget principles and\nstructures\n1.2 Knows budgeting terminology relevant to a specific\nindustry context\n1.3 Demonstrated the ability to monitor income and\nexpenditure in accordance with the budget, and to identify\nways of improving budget performance\n1.4 Demonstrated understanding of the main types of budget\nthat apply in the specific enterprise or industry context\n2. Resource implications\nThe following resources should be provided:\n2.1 Project or work activities that include the management of\nand reporting on a budget for a specific project or\noperational area over a period of time so that the\nmonitoring and implementation aspects of the unit can be\nassessed\n2.2 Use of figures and data that reflect the financial operating\nconditions of industry\n2.3 The requirement to evaluate options for improved budget\nperformance\n3. Methods of assessment\nCompetency in this unit may be assessed through:\n3.1 Evaluation of financial reports detailing financial\nperformance of projects or activities conducted by the\ncandidate\n3.2 Evaluation of reports produced by the candidate detailing\nthe processes undertaken to manage finances within a\nbudget\n3.3 Case studies and problem solving to assess application of\nthe principles of budget management to different\nsituations\n3.4 Review of portfolios of evidence and third party workplace\nreports of on-the-job performance by the candidate\n4. Context of assessment\n4.1 Competency may be assessed in actual workplace or at\nthe designated TESDA Accredited Assessment Center.\n\n--- PDF PAGE 74 ---\nDRAFT\n\nHousekeeping NC IV Revision 01 Promulgated (10/15/2019) 70\n\nUNIT OF COMPETENCY\n: PLAN AND IMPLEMENT A SERIES OF TRAINING EVENTS\n\nUNIT CODE\n :"
        },
        "source_text": "TRS141212\n\nUNIT DESCRIPTOR :\nThis unit covers the knowledge, skills and attitudes required to\ntake responsibility for budget management where others may\nhave developed the budget.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\n Range of Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n1. Allocate budget\nresources\n1.1 Funds are allocated\naccording to agreed\npriorities.\n1.2 Changes in income\nand expenditure\npriorities are\ndiscussed with\ncolleagues prior to\nimplementation\n1.3 All relevant\npersonnel are\nconsulted and\ninformed in relation to\nresource decisions\n1.4 Awareness of the\nimportance of budget\ncontrol is promoted\n1.5 Detailed records of\nresource allocation\nare maintained in\naccordance with\nenterprise control\nsystems\n1.1 Basic budget\nprinciples\n1.2 Budget formulation\n1.3 Financial information\nsystem\n1.4 Managing finances\nwithin a budget\n1.5 Importance of budget\ncontrol\n1.6 Enterprise control\nsystems\n1.7 Standards for\norganizational\nrecordkeeping and\naudit requirements\n1.8 Recordkeeping\n\n1.1 Analytical skills\n1.2 Networking skills\n1.3 Allocating funds\n1.4 Maintaining records\n\n2 Monitor\nfinancial\nactivities\nagainst budget\n2.1 Actual income and\nexpenditures are\nchecked against\nbudget and at\nregular intervals\n2.2 Financial\ncommitments are\nincluded in all\ndocumentation to\nensure accurate\nmonitoring\n\n2.1 Basic budget\nprinciples\n2.2 Budget formulation\n2.3 Financial information\nsystem\n2.4 Income and\nexpenditures\n2.5 Managing finances\nwithin a budget\n2.6 Importance of budget\ncontrol\n2.7 Enterprise control\nsystems\n2.1 Analytical skills\n2.2 Networking skills\n2.3 Monitoring\nexpenditures\n2.4 Calculating profit/loss\nand cash flow\n\n--- PDF PAGE 71 ---\nDRAFT\n\nHousekeeping NC IV Revision 01 Promulgated (10/15/2019) 67\n\nELEMENT\nPERFORMANCE\nCRITERIA\nBold and italicized\nterms are elaborated in\nthe\n Range of Variables\n\nREQUIRED\