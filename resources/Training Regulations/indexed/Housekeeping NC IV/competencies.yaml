              {
                "number": "1.1",
                "text": "Specific communication needs of clients and colleagues are DRAFT identified and met"
              },
              {
                "number": "1.2",
                "text": "Different approaches are used to meet communication needs of clients and colleagues"
              },
              {
                "number": "1.3",
                "text": "Conflict is addressed promptly in a manner which does not compromise the organization 01 Promulgated (10/15/2019)"
