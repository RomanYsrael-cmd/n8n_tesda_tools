bout \nthe local, national \nand global issues\n\n--- PDF PAGE 26 ---\nDRAFT \n \nHousekeeping NC IV   Revision 01             Promulgated  (10/15/2019)                                                                         22 \n \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n2. Relate local \nand global \ntrends to \nworkplace \ncontext \n2.1 Local events are \nreflected on for \nimplications in one’s \nown situation and in the \nexternal global \nenvironment. \n2.2 Sense of belonging to a \ncommon humanity, \nsharing values and \nresponsibilities are \ndeveloped. \n2.3 Attitudes of empathy, \nsolidarity and respect \nfor differences and \ndiversity are \nstrengthened. \n2.1 Different levels of \nhuman identity \naccording to \nAmber Mayer \n(2015) \n2.2 Different \ncommunities \npeople belong to \nand how these \nare connected \n2.3 Difference and \nrespect for \ncultural diversity \n2.1 Recognizing \ndifferences and \ncommonalities \namong people \n2.2 Strengthening \nattitudes of \nempathy, solidarity \nand respect for \ndiversity \n2.3 Connecting local \nissues to global \ntrends, and vice \nversa. \n3. Engage and \ntake actions \non workplace \nissues and \nconcerns \n3.1 Effective and \nresponsible actions at \nlocal, national and \nglobal levels are \nidentified. \n3.2 Motivation and \nwillingness to take \nnecessary actions are \ndeveloped. \n3.3  Attitude of “thinking \nglobally and acting \nlocally” is practiced. \n3.1 Actions that can \nbe taken \nindividually and \ncollectively \n3.2  Ethically \nresponsible \nbehaviour \n3.3 Importance and \nbenefits of civic \nengagement \n3.4  Strategies and \ntechniques of \n“thinking globally \nand acting \nlocally \n3.1 Employing \nappropriate actions \nto address \nworkplace issues \ninvolving national \nand global trends \n3.2 Showing concern \nand willingness to \ntake part in the \ndevelopment \nefforts to discuss \nworkplace issues \nand concerns \n3.3 Applying the \nattitude of “thinking \nglobally and acting \nlocally” in the \nworkplace\n\n--- PDF PAGE 27 ---\nDRAFT \n \nHousekeeping NC IV   Revision 01             Promulgated  (10/15/2019)                                                                         23 \n \nRANGE OF VARIABLES \n \n \n \n \n           EVIDENCE GUIDE \n \n \n \n \n \n \n \n \nVARIABLE \nRANGE \n1. Media \nMay include but not limited to: \n1.1 \nPrint media \n1.2 \nBroadcast media \n1.3 \nInternet and social media  \n2. Scanning/Monitoring \nMay include but not limited to: \n2.1 \nSourcing from key informants \n2.2 \nConversation with clients \n2.3 \nMan-on-the-street conversation \n2.4 \nScanning print and broadcast media \n3. Local, national and global issues \n \nMay include but not limited to: \n3.1 \nPoverty \n3.2 \nUnemployment \n3.3 \nGlobal warming \n3.4 \nSafety, security, and well-being \n1. Critical aspects \nof Competency  \nAssessment requires evidence that the candidate: \n1.1 Demonstrated ability and attitude to keep oneself updated of \nrelevant issues/trends  \n1.2 Demonstrated ability to think and act based on one’s \nprinciples and values \n1.3 Demonstrated a holistic/global outlook on internal and \nexternal events in the workplace  \n2. Resource \nImplications \nThe following resources should be provided: \n2.1 Access to workplace and resources \n2.2 Case studies \n3. Methods of \nAssessment \nCompetency in this unit may be assessed through: \n3.1 \nDemonstration or simulation with oral questioning \n3.2 \nCase problems involving global and local issues \n3.3 \nThird-party report \n4. Context for \nAssessment \n4.1 \nCompetency assessment may occur in workplace or any \nappropriately simulated environment\n",
