          "source_text": "REQUIRED \nKNOWLEDGE \n \nREQUIRED \nSKILLS \n1.  Plan a series \nof training \nevents \n1.1 Training needs are \nidentified and verified \n1.2 Training needs are \nidentified and \nprioritized.  \n1.3 Resources available to \nsupport training events \nto address identified \ntraining need are \ndetermined \n1.4 Training events that \nwill address identified \nworkplace training \nneed are identified.  \n1.5 Availability of learners \nto attend and \nparticipate in \nidentified training \nevents are determined.  \n1.6 Stakeholders in \nplanning activities \nare involved.  \n1.7 A schedule for \nimplementing \nidentified training \nevents is developed.  \n1.8 An operational plan to \nsupport the \nimplementation of \nidentified training \nevents is developed.  \n1.9 The implementation \nplan for training events \nwith stakeholders is \nshared.  \n \n1.1 Communication \ntechniques \n1.2 Enterprise policies \nand procedures \n1.3 Training needs \n1.4 Events planning  \n \n \n1.1 Questioning and \ncommunication \nskills \n1.2 Research skills \n1.3 Analytical skills \n1.4 Ability to research \nindustry \ninformation \nsources \n1.5 Networking skills \n1.6 Planning a training \nevent\n\n--- PDF PAGE 75 ---\nDRAFT \n \nHousekeeping NC IV   Revision 01             Promulgated  (10/15/2019)                                                                         71 \n \nELEMENT \n PERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the  \nRange of Variables \n \nREQUIRED \nKNOWLEDGE \n \nREQUIRED \nSKILLS \n1.10 Identified learners to \nengage with \nestablished training \nevents are encouraged  \n2 Implement a \nseries of \ntraining \nevents \n2.1 Identified support for \nlearners to attend \nidentified training \nevents is provided   \n2.2 Resources for \nsupervisors to \nmaintain required \nservice levels during \nidentified training events \nare provided \n2.3 Learners of attendance \nrequirements as \nrequired by the \norganization are