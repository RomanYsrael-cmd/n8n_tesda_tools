cal (Lighting, Electronics)\n1.5 Furniture and Fixture (tissue holder, TV rack\nand shower fitting)\n\n2. Relevant personnel\nMay include:\n2.1 Outside Contractor e.g. installer\n2.2 Supervisor\n2.3 Manager\n2.4 Housekeeping/Engineering personnel\n\n--- PDF PAGE 96 ---\nDRAFT\n\nHousekeeping NC IV Revision 01 Promulgated (10/15/2019) 92\n\n3. Tools and equipment\nMay include:\n3.1 Computer hardware\n3.2 Computer Software\n3.3 Test equipment\n3.4 Hand tools\n3.5 Power tools\n3.6 Fixing tools\n3.7 Anti – skid Strips\n3.8 Internet Router\n3.9 File\n3.10 Drill\n3.11 Lockpick/Electronic Lock Decoder\n3.12 Pick gun\n3.13 Soldering iron\n3.14 Welder\n3.15 Crimp tools\n3.16 Ladder\n3.17 Hoist\n3.18 Batteries\n3.19 Personal protective equipment\n3.20 Communication equipment\n4. Work schedules\nMay include:\n4.1 Daily timeframe\n4.2 Weekly timeframe\n4.3 Monthly timeframe\n4.4 Annual timeframe\n5. Work contingencies\nMay include:\n5.1 Industrial disputes\n5.2 Building delays\n5.3 Public holidays\n5.4 Shut-down periods\n5.5 Natural occurrences e.g. Typhoon,\n5.6 Earthquake\n6. Details of schedule of job\nresource requirements\nMay include:\n6.1 Ingress and egress points\n6.2 Time of access\n6.3 Access codes\n6.4 Metal Keys and Electronic Key Cards\n6.5 Passes e.g Gate Pass\n6.6 Security clearance\n6.7 Union requirements\n6.8 OHS requirements\n6.9 Building codes and regulations\n6.10 Environmental requirements\n6.11 Noise control\n\n--- PDF PAGE 97 ---\nDRAFT\n\nHousekeeping NC IV Revision 01 Promulgated (10/15/2019) 93\n\n7. Work order\nMay include but is not limited to:\n7.1 Work schedule\n7.2 Completion dates\n7.3 Job requirements and tasks\n7.4 Specific client requirements\n7.5 Access to site and specific site requirements\n7.6 Resource requirements\n7.7 OHS requirements and compliance with\nrelevant legislation\n7.8 Company requirements\n7.9 Budget allocations\n8. Details of schedule and job\nresource requirements\nMay include:\n8.1 Ingress and egress points\n8.2 Time of access\n8.3 Access codes\n8.4 Metal Keys and Electronic Key Cards\n8.5 Passes e.g Gate Pass\n8.6 Security clearance\n8.7 Union requirements\n8.8 OHS requirements\n8.9 Building codes and regulations\n8.10 Environmental requirements\n8.11 Noise control\n\n--- PDF PAGE 98 ---\nDRAFT\n\nHousekeeping NC IV Revision 01 Promulgated (10/15/2019) 94\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidences that the candidate:\n1.1 Clearly identified job requirements.\n1.2 Efficiently organized and allocated labor, tools and\nequipment and equipment/fixture required for work.\n1.3 Prepared realistic work schedules, which include\nconsideration of contingencies.\n1.4 Prepared work order.\n2. Resource\nimplications\nThe following resources MUST be provided:\n2.1 Maintenance/repairs/modifications requirements\ninformation for review\n2.2 List of available resources\n2.3 Company pro forma maintenance schedules\n3. Methods of\nassessment\nCompetency may be assessed through:\n3.1 Demonstration with oral questioning\n3.2 Review of portfolio of evidence of on-the-job performance\nby the candidate.\n4. Context for\n assessment\n4.1 Competency may be assessed in actual workplace or at the\ndesignated TESDA Accredited Assessment Center\n\n--- PDF PAGE 99 ---\nDRAFT\n\nHousekeeping NC IV Revision 01 Promulgated (10/15/2019) 95\n\nUNIT OF COMPETENCY : PLAN AND MANAGE HOUSEKEEPING SERVICES\n\n FOR GUESTS\n\n UNIT CODE\n:\nTRS515306\n\nUNIT DESCRIPTOR :\nThis unit deals with knowledge, skills and attitudes required to\nplan and manage to deliver housekeeping services in an\naccommodation facility.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n1. Establish\nrequirements\nneeded in\nproviding\nhousekeeping\nservices to\nguests\n\n1.1 Housekeeping service\nrequirements in accordance\nwith the establishments’\npolicies and procedure are\nidentified.\n1.2 Housekeeping requests\nand service items available\naccording to establishments’\nrequirements are recorded.\n1.3 Required housekeeping\npersonnel to service the\nguest rooms are identified.\n1.1 Standards operational\npolicies and\nprocedures\n1.2 General knowledge\nabout OHS\n1.3 Characteristics of\nenterprise\n1.4 Updates on systems\nand processes\n1.1 Planning skills\n1.2 Communication\nskills including\nreceiving feedback\nand reporting,\nmaintaining\neffective\nrelationships and\nconflict\nmanagement\n1.3 Analytical skills\n1.4 Decision making\nskills\n1.5 Recording and\nmonitoring\n2. Manage\nhousekeeping\nservices\nprovided to\nguests\n2.1 Recorded\nHousekeeping\nrequests are\nmonitored.\n2.2 Provision/delivery of\nidentified services for\nguests is ensured.\n2.3 Services are\ncoordinated/liaised with\nother staff.\n2.1 Standards operational\npolicies and\nprocedures\n2.2 General knowledge\nabout BOSH\n2.3 Updates on systems\nand processes\n2.4 Policies on Green\nPractices\n\n2. 1Communication\nskills including\nreceiving feedback\nand reporting,\nmaintaining\neffective\nrelationships and\nconflict\nmanagement\n2.2 Problem solving\nskills\n2.3 Decision making\nskills\n\n--- PDF PAGE 100 ---\nDRAFT\n\nHousekeeping NC IV Revision 01 Promulgated (10/15/2019) 96\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n3. Implement\nprovisions of\nhousekeeping\nservices\n3.1 Service delivery\nstandards are planned\nand enhanced\n3.2 Housekeeping services\nto guests are liaised\nwith other departments\n3.3 Housekeeping services\nfor guests are\nmonitored and\nevaluated.\n3.1 Standards operational\npolicies and\nprocedures\n3.2 General knowledge\nabout OHS\n3.3 Updates on systems\nand processes\n3.4 Policies on Green\nPractices\n\n2.1 Planning skills\n3.2 Communication\nskills including\nreceiving feedback\nand reporting,\nmaintaining\neffective\nrelationships and\nconflict\nmanagement\n3.3 Coordination skills\n3.4 Teamwork\n3.5 Decision making\nskills\n\n--- PDF PAGE 101 ---\nDRAFT\n\nHousekeeping NC IV Revision 01 Promulgated (10/15/2019) 97\n\n RANGE OF VARIABLES\n\nVARIABLE\n\nRANGE\n\n1.Housekeeping services\nMay include:\n1.1 Normal room and remedial services such as\n– general cleaning\n1.2 Removing unwanted or defective items from\nrooms\n1.3 Provision of extra equipment for additional\nguests\n1.4 Replenishment of items\n1.5 Giving information regarding in-house\nservices and products, local services,\nattractions, transport, shops and\nentertainment\n2.Housekeeping requests\nMay include:\n2.1 Provision of extra equipment/ amenities\n2.2 Room food service\n2.3 Make up room\n2.4 Laundry service\n2.5 Change of room\n2.6 Technical assistance\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidences that the candidate:\n1.1 Demonstrated ability to plan and manage provision of\nhousekeeping services to guests.\n2. Resource\nImplications\nThe following resources must be provided:\n2.1 Project or work activities conducted over a period of time\nand which allow the candidate to establish and monitor\nhousekeeping services to guests\n2.2 Involvement and interaction with the housekeeping team\n3. Method of\nAssessment\nCompetency may be assessed through:\n3.1 Demonstration with oral questions\n3.2 Portfolio\n4. Context of\nAssessment\n4.1 Competency may be assessed in actual workplace or at\nthe designated TESDA Accredited Assessment Center\n\n--- PDF PAGE 102 ---\nDRAFT\n\nHousekeeping NC IV Revision 01 Promulgated (10/15/2019) 98\n\nUNIT OF COMPETENCY :\nMANAGE LOST AND FOUND PROCEDURES\n\nUNIT CODE\n:\nTRS515307\n\nUNIT DESCRIPTOR\n:\nThis unit deals with knowledge, skills and attitudes required\nfor establishing policies and procedures for lost and found\nitems, monitoring of handling of claimed and unclaimed items\nin accordance with established standards.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n1. Establish lost\nand found\npolicies and\nprocedures\n1.1 In-house lost and\nfound policies and\nprocedures are\ndeveloped according\nto establishment’s\nstandards\n1.2 Legal requirements\nthat apply to lost and\nfound items are\nidentified.\n1.3 Lost and found\nregister is established.\n1.1 Standards operational\npolicies and\nprocedures\n1.2 General knowledge\nabout OHS\n1.3 Updates on systems\nand processes\n1.4 Policies on Green\nPractices\n\n1.1 Communication\nskills including\nreceiving\nfeedback and\nreporting,\nmaintaining\neffective\nrelationships and\nconflict\nmanagement\n1.2 Planning skills\n\n2. Monitor lost and\nfound items\n2.1 Lost and found items\nare periodically\nchecked as to safe\nkeeping\n2.2 List of lost and found\nitems are\ndisseminated to\nauthorized\npersonnel\n2.3 Stored items are\nchecked according to\ntype/category\n\n2.1. Standards\noperational policies\nand procedures for\nlost and found\n2.2. Legal regulations for\nunsafe and illegal\nitems\n2.3. BOSH\n2.4. Inventory of Lost and\nFound Items\n2.5. Policies on Green\nPractices\n\n2.1 Applying\nestablishment’s\npolicies and\nprocedures in\n2.2 Ability to\ndistinguish\nitems between\nvaluable and\nnon-valuable\n2.3 Applying legal\nregulations for\nunsafe and\nillegal items\n2.4 Applying BOSH\n3. Monitor claim for\nlost item\n\n3.1 Claimant’s inquiry\neither by phone,\npersonal or in writing\nare assessed\n3.2 Claimants Ownership\nof property is verified\nin accordance to\nworkplace standards\n3.3 Approval for the return\nof lost and found items\nare accomplished in\naccordance with\nworkplace standards\n3.1 Standards operational\npolicies and\nprocedures for lost\nand found\n3.2 Legal regulations for\nunsafe and illegal\nitems\n3.3 BOSH\n3.4 Inventory of Lost and\nFound Items\n3.5 Policies on Green\nPractices\n3.1 Applying\nestablishment’s\npolicies and\nprocedures in\n3.2 Ability to\ndistinguish items\nbetween\nvaluable and\nnon-valuable\n3.3 Applying legal\nregulations for\nunsafe and\nillegal items\n\n--- PDF PAGE 103 ---\nDRAFT\n\nHousekeeping NC IV Revision 01 Promulgated (10/15/2019) 99\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n\n3.4 Lost and found\nregistry is verified\n\n3.4 Applying BOSH\n3.5 Communication\nskills\n4. Monitor\nunclaimed items\n4.1 Policies and\nprocedures for\nunclaimed items are\ncomplied with\naccording to\nworkplace standards\n4.2 Legal obligations for\nunclaimed, unsafe and\nillegal items are\ncomplied with.\n4.3 Unclaimed items from\nstorage facility are\ndocumented and\nremoved for releasing\naccording to\nestablishment\nstandards\n\n4.1 Standards operational\npolicies and\nprocedures for lost\nand found\n4.2 Legal regulations for\nunsafe and illegal\nitems\n4.3 BOSH\n4.4 Inventory of Lost and\nFound Items\n4.5 Policies on Green\npractices\n\n4.1 Ability to\ndistinguish items\nbetween\nvaluable and\nnon-valuable\n4.2 Applying legal\nregulations for\nunsafe and\nillegal items\n4.3 Applying BOSH\n\n--- PDF PAGE 104 ---\nDRAFT\n\nHousekeeping NC IV Revision 01 Promulgated (10/15/2019) 100\n\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Lost and found policies and\nprocedures\nMay include:\n1.1 Handling Procedure\n1.2 Recording Procedure\n1.3 Storage Procedure\n1.4 Disposal Procedures\n2. Authorized personnel\nMay include:\n2.1 Housekeeping Supervisor\n2.2 Duty Manager (Front Office)\n2.3 Security\n2.4 Government entities (PDEA, PNP)\n3. Ownership of property\nMay include :\n3.1 Valid Identification Card\n3.2 Accomplished Lost and Found Form\n3.3 Notarized Authorization Letter/Certificate\n3.4 Guest folio\n4. Policies and procedures\nMay include:\n4.1 Storage holding period\n4.2 Follow up procedures\n4.3 Policy on finder’s right to claim\n\n--- PDF PAGE 105 ---\nDRAFT\n\nHousekeeping NC IV Revision 01 Promulgated (10/15/2019) 101\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidences that the candidate:\n1.1 Demonstrated ability to establish lost and found policies\nand procedures.\n1.2 Demonstrated the ability to handle claimed and unclaimed\nlost and found items\n\n2. Resource\nImplications\nThe following resources must be provided:\n2.1 Project or work activities that allow the candidate to\ndevelop policies and procedures for lost and found items.\n\n3. Method of\nAssessment\nCompetency may be assessed through:\n3.1 Demonstration with oral questioning.\n3.2 Review of portfolios of evidence of on-the-job\nperformance by the candidate.\n3.3 Case study\n\n4. Context of\nAssessment\n4.1 Competency may be assessed in actual workplace or at\nthe designated TESDA Accredited Assessment Center\n\n--- PDF PAGE 106 ---\nDRAFT\n\nHousekeeping NC IV Revision 01 Promulgated (10/15/2019) 102\n\nUNIT OF COMPETENCY :\nMANAGE INVENTORY, STORAGE AND ISSUANCE OF\nLINEN AND UNIFORM\n\nUNIT CODE\n:\nTRS515308\n\nUNIT DESCRIPTOR :\nThis unit covers the knowledge, skills and attitudes required to\nestablish stock inventory control, storage and issuance of\nlinen and uniforms. It focuses on the skills required by\nmanagers to establish systematic procedures in linen and\nuniform handling.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n1. Establish an\neffective system\nof storing linen\nand uniforms\n1.1 System in storing of\nlinen and uniform in the\nworkplace is developed\n1.2 Linen and uniform\nstorage is monitored.\n1.3 Space in storage is\nmonitored for optimized\nuse and maintenance\n1.1.\nStandards\n operational policies\nand procedures\n1.2.\nGeneral\nknowledge about\nBOSH\n\n1.1 Applying BOSH\n1.2 Reporting and\nmonitoring skills\n\n2. Establish\ninventory,\nstorage and\nissuance of linen\nand uniform\ncontrol system\n2.1 Stock control systems\nare developed and\nimplemented\n2.2 Systems are\nmonitored in the\nworkplace and\nadjustments are made\naccording to feedback\nand operational\nexperience\n2.3 Training of staff to\nminimize stock\nwastage is initiated.\n2.1 Standards operational\npolicies and\nprocedures\n2.2 General knowledge\nabout OHS\n2.3 Updates on systems\nand processes\n2.4 Policies on Green\nPractices\n2.5 Gender and\nDevelopment\n\n2.1Communication\nskills including\nreceiving feedback\nand reporting,\nmaintaining\neffective\nrelationships and\nconflict\nmanagement\n2.2 Documentation\nskills\n2.3 Training and\nmentoring skills\n2.4 Reporting and\nmonitoring skills\n2.5 Financial control\nmeasures\n3. Develop a\nsystem for\nissuance of linen\nand uniforms\n3.1 System for issuance\nprocedures for linens\nand uniforms are\ndeveloped\n3.2 Monitoring instrument\nfor usage of forms for\nissuance of linens and\nuniforms are prepared\n\n3.1 Standards operational\npolicies and\nprocedures\n3.2 General knowledge\nabout BOSH\n3.3 Updates on systems\nand processes\ninvolving laundry\noperation\n3.1 Conceptualization\nand planning skills\n3.2 Documentation\nskills\n3.3 Analytical and\ncritical skill\n3.4 Reporting and\nmonitoring skills\n\n--- PDF PAGE 107 ---\nDRAFT\n\nHousekeeping NC IV Revision 01 Promulgated (10/15/2019) 103\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n4. Evaluate\ndelivery of linen\nand uniform\nstocks\n\n4.1 Internal systems for\nidentifying delivered\nlinen and uniform for\nlaundry are monitored\n4.2 Delivered linen and\nuniform for laundry are\nverified against\nrelevant documentation\n4.3 Variations between the\ndelivered items against\ndocumentation are\ninvestigated and\nfollowed-up\n4.4 Requisitions for new\nstocks are evaluated\n4.1 Standards operational\npolicies and\nprocedures\n4.2 Computerized stock\ncontrol system\n4.3 Policies on Green\nPractices\n\n4.1 Stock rotation\nskills\n4.2 Analytical skills\n4.3 Calculating cost\nprices\n\n--- PDF PAGE 108 ---\nDRAFT\n\nHousekeeping NC IV Revision 01 Promulgated (10/15/2019) 104\n\nRANGE OF VARIABLES\n\nVARIABLE\n\nRANGE\n\n1. Systems\nMay include:\n1.1 Systems for receiving, storing and delivery\n1.2 Requisitioning\n1.3 Controlling issue quantities\n1.4 Issuing to authorized persons\n1.5 Procedures for stock transfer to other\n departments.\n1.6 Inventory procedures\n\n2. Forms\nMay include:\n1.1 Inventory\n1.2 Monitoring\n1.3 Staff roster\n1.4 Evaluation\n1.5 Waste management\n\n EVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidences that the candidate:\n1.1 Demonstrated ability to develop procedures for handling\ninventory\n1.2 Demonstrated ability to institute storage and issuing of linen\nprocedures\n\n2. Resource\nImplications\nThe following resources must be provided:\n2.1 Training and assessment to include access to a real or\nsimulated workplace; and access to workplace standards,\nprocedures, policies, guidelines, tools and equipment.\n\n3. Method of\nAssessment\nCompetency may be assessed through:\n3.1 Case studies\n3.2 Demonstration and oral questioning\n3.3 Review of portfolios of evidence of on-the-job performance\nby the candidate\n4. Context of\nAssessment\n4.1 Competency may be assessed in actual workplace or at\nthe designated TESDA Accredited Assessment Center\n\n--- PDF PAGE 109 ---\nDRAFT\n\nHousekeeping NC IV Revision 01 Promulgated (10/15/2019) 105\n\nUNIT OF COMPETENCY :\nMANAGE LAUNDRY AND VALET SERVICE\n\nUNIT CODE\n:\nTRS515309\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes required\nto manage laundry and valet services in an accommodation\nestablishment. This role would generally be undertaken by\nexperienced staff members with sound organizational and\ninterpersonal skills\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n1. Establish\nrequirements for\nproviding\nlaundry and\nvalet service\n1.1