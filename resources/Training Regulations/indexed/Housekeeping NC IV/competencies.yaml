        "source_text": "TRS515305\n\nUNIT DESCRIPTOR :\nThis unit covers the knowledge, skills, and attitudes required\nto plan and schedule maintenance, repairs and modifications\nto fixtures, furniture and equipment and other physical assets\nthat may be found in guest rooms and public areas of\naccommodation establishments\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n1. Determine job\nrequirements\n1.1 Replacement or repair\nof tools and\nequipment/fixtures is\nassessed or confirmed\nin accordance with\nnature of fault, type,\nand economic\nfeasibility.\n1.2 Existing warranties and\nservice agreements are\nchecked to establish\nmaintenance\nrequirement\n1.3 Estimates and\nquotations for cost\ndetailing work to be\ncarried out are\nprovided\n1.4 Approval for work is\nreceived in writing from\nappropriate personnel.\n1.5 Details to specific site\nrequirements are\norganized and\nconfirmed with\nrelevant personnel.\n1.6 Labor, tools and\nequipment required for\nthe job are identified\nand checked.\n\n1.1 Standards operational\npolicies and\nprocedures\n1.2 Characteristics of\nenterprise\n1.3 Understanding of\nsystems and functions\n1.4 Basic Occupational\nSafety and Health\n(BOSH)\n1.5 Labor code\n1.6 Policies on Green\nPractices\n\n1.1 Communication,\nincluding liaison,\nreport writing,\nconsultation,\ninterpersonal,\nlistening,\nquestioning,\ngaining feedback,\ngiving information\n1.2 Reading and\ninterpreting plans\nand specifications\n1.3 Planning skills\n1.4 Decision making\nskills\n1.5 Analytical skills\n1.6 Problem solving\nskills\n\n2. Allocate and\norder resource\nrequirements\n2.1 Relevant skills,\nqualifications and\nlicenses of labor force\nare checked to ensure\n2.1 Standards\noperational\npolicies and\nprocedures\n2.1 Project planning\n2.2 Allocating work\n2.3 Methodical\norganization of\n\n--- PDF PAGE 94 ---\nDRAFT\n\nHousekeeping NC IV Revision 01 Promulgated (10/15/2019) 90\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\njob requirements are\nfulfilled.\n2.2 Labor force is\nscheduled to be\navailable when\nrequired for work.\n2.3 Details of job required\nconcerning the\ndepartment are\norganized and\ncommunicated\n\n2.2 Understanding\nsystems and\nfunctions\n2.3 Basic\nOccupational\nSafety and Health\n(BOSH)\n2.4 Policies on Green\nPractices\n\nwork\n2.4 Financial\nmanagement and\nbudgeting skills\n2.5 Analytical skills\n2.6 Decision Making\nskills\n2.7 Communication\nskills including\nreceiving feedback\nand reporting,\nmaintaining\neffective\nrelationships and\nconflict\nmanagement\n2.8 Problem solving\nskills\n3. Schedule work\n3.1 Work schedules are\nprepared to maximize\nproductivity and meet\ncompany\nrequirements.\n3.2 Weather disruptions\nand other work\ncontingencies are\nidentified, assessed\nand considered in\nwork schedule.\n3.3 Urgent work\nrequirements are\nscheduled and\nprioritized\n3.1 Standards\noperational\npolicies and\nprocedures\n3.2 General\nknowledge about\nOHS\n3.3 Understanding\nsystems and\nfunctions\n3.4 Policies on Green\nPractices\n\n3.1 Time management\n3.2 Planning skills\n3.3 Decision making\nskills\n3.4 Analytical skills\n3.5 Coordination skills\n\n4. Document work\norder\n4.1 Details of schedule\nof job and resource\nrequirements are\nclearly stated in work\norder.\n4.2 Work order related to\npersonnel in\naccordance with\ncompany\nrequirements is\nevaluated.\n4.1 Standard\noperational\npolicies and\nprocedures\n4.2 General\nknowledge about\nOHS\n4.3 Principles of\nProgram\nEvaluation\n4.4 Methods of\nProgram\nEvaluation\n4.5 Understanding\nsystems and\nfunctions\n4.1 Analytical skills in\nterms of evaluating\nprograms\n4.2 Communication\nskills including\nreceiving feedback\nand reporting,\nmaintaining\neffective\nrelationships and\nconflict\nmanagement\n4.3 Time management\n4.4 Coordination skills\n\n--- PDF PAGE 95 ---\nDRAFT\n\nHousekeeping NC IV Revision 01 Promulgated (10/15/2019) 91\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n4.6 Policies on Green\nPractices\n\nRANGE OF VARIABLES\n\nVARIABLE\n\nRANGE\n\n1. Equipment/fixture\n May include:\n1.1 Telephones\n1.2 Control panels\n1.3 Locks and locking systems\n1.4 Electrical (Lighting, Electronics)\n1.5 Furniture and Fixture (tissue holder, TV rack\nand shower fitting)\n\n2. Relevant personnel\nMay include:\n2.1 Outside Contractor e.g. installer\n2.2 Supervisor\n2.3 Manager\n2.4 Housekeeping/Engineering personnel\n\n--- PDF PAGE 96 ---\nDRAFT\n\nHousekeeping NC IV Revision 01 Promulgated (10/15/2019) 92\n\n3. Tools and equipment\nMay include:\n3.1 Computer hardware\n3.2 Computer Software\n3.3 Test equipment\n3.4 Hand tools\n3.5 Power tools\n3.6 Fixing tools\n3.7 Anti – skid Strips\n3.8 Internet Router\n3.9 File\n3.10 Drill\n3.11 Lockpick/Electronic Lock Decoder\n3.12 Pick gun\n3.13 Soldering iron\n3.14 Welder\n3.15 Crimp tools\n3.16 Ladder\n3.17 Hoist\n3.18 Batteries\n3.19 Personal protective equipment\n3.20 Communication equipment\n4. Work schedules\nMay include:\n4.1 Daily timeframe\n4.2 Weekly timeframe\n4.3 Monthly timeframe\n4.4 Annual timeframe\n5. Work contingencies\nMay include:\n5.1 Industrial disputes\n5.2 Building delays\n5.3 Public holidays\n5.4 Shut-down periods\n5.5 Natural occurrences e.g. Typhoon,\n5.6 Earthquake\n6. Details of schedule of job\nresource requirements\nMay include:\n6.1 Ingress and egress points\n6.2 Time of access\n6.3 Access codes\n6.4 Metal Keys and Electronic Key Cards\n6.5 Passes e.g Gate Pass\n6.6 Security clearance\n6.7 Union requirements\n6.8 OHS requirements\n6.9 Building codes and regulations\n6.10 Environmental requirements\n6.11 Noise control\n\n--- PDF PAGE 97 ---\nDRAFT\n\nHousekeeping NC IV Revision 01 Promulgated (10/15/2019) 93\n\n7. Work order\nMay include but is not limited to:\n7.1 Work schedule\n7.2 Completion dates\n7.3 Job requirements and tasks\n7.4 Specific client requirements\n7.5 Access to site and specific site requirements\n7.6 Resource requirements\n7.7 OHS requirements and compliance with\nrelevant legislation\n7.8 Company requirements\n7.9 Budget allocations\n8. Details of schedule and job\nresource requirements\nMay include:\n8.1 Ingress and egress points\n8.2 Time of access\n8.3 Access codes\n8.4 Metal Keys and Electronic Key Cards\n8.5 Passes e.g Gate Pass\n8.6 Security clearance\n8.7 Union requirements\n8.8 OHS requirements\n8.9 Building codes and regulations\n8.10 Environmental requirements\n8.11 Noise control\n\n--- PDF PAGE 98 ---\nDRAFT\n\nHousekeeping NC IV Revision 01 Promulgated (10/15/2019) 94\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidences that the candidate:\n1.1 Clearly identified job requirements.\n1.2 Efficiently organized and allocated labor, tools and\nequipment and equipment/fixture required for work.\n1.3 Prepared realistic work schedules, which include\nconsideration of contingencies.\n1.4 Prepared work order.\n2. Resource\nimplications\nThe following resources MUST be provided:\n2.1 Maintenance/repairs/modifications requirements\ninformation for review\n2.2 List of available resources\n2.3 Company pro forma maintenance schedules\n3. Methods of\nassessment\nCompetency may be assessed through:\n3.1 Demonstration with oral questioning\n3.2 Review of portfolio of evidence of on-the-job performance\nby the candidate.\n4. Context for\n assessment\n4.1 Competency may be assessed in actual workplace or at the\ndesignated TESDA Accredited Assessment Center\n\n--- PDF PAGE 99 ---\nDRAFT\n\nHousekeeping NC IV Revision 01 Promulgated (10/15/2019) 95\n\nUNIT OF COMPETENCY : PLAN AND MANAGE HOUSEKEEPING SERVICES\n\n FOR GUESTS\n\n UNIT CODE\n:"
