f communities at local,\nnational and global levels\n• Explain underlying assumptions and\npower dynamics (politics, understanding\npolitical system, social structures, labor\nlaws, labor relations, human right)\n• Monitor trends and issues relevant to\nhuman rights, gender equality, culture of\npeace, global citizenship, and cultural\ndiversity using different media platforms\n• Analyze trends and issues relevant to\nhuman rights, gender equality, culture of\npeace, global citizenship, and cultural\ndiversity\n• Engage in discourse about the local,\nnational and global issues\n• Interactive Lecture\n• Small Group\nDiscussion\n• Brainstorming\n• Role-playing\n• Demonstration or\nsimulation with oral\nquestioning\n• Group discussions\nand interactive\nactivities\n• Case studies/\nproblems involving\nworkplace diversity\nissues\n• Written\nexamination\n(Essay)\n• Role Playing\n1 Hour\n\n4.2 Relate local and\nglobal trends to\nworkplace context\n• Discuss the different levels of human\nidentity according to Amber Mayer (2015)\n• Explain different communities people\nbelong to and how these are connected\n• Recognize cultural differences and\nrespect for cultural diversity\n• Recognize differences and\ncommonalities among people\n• Demonstrate attitudes of empathy,\nsolidarity and respect for diversity\n• Connect local issues to global trends,\nand vice versa.\n• Interactive Lecture\n• Small Group\nDiscussion\n• Brainstorming\n• Role-playing\n• Demonstration or\nsimulation with oral\nquestioning\n• Group discussions\nand interactive\nactivities\n• Case studies/\nproblems involving\nworkplace diversity\nissues\n• Written\nexamination\n(Essay)\n1 Hour\n\n--- PDF PAGE 120 ---\nHousekeeping NC IV Revision 01 Promulgated (10/15/2019) 116\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nMethod\nNominal\nDuration\n\n4.3 Engage and take\nactions on\nworkplace issues\nand concerns\n• Identify the actions that can be taken\nindividually and