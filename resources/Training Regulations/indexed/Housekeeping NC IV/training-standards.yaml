    "source_text": "SECTION 3 TRAINING ARRANGEMENTS\n\nThese standards are set to provide technical and vocational education and training\n(TVET) providers with information and other important requirements to consider when\ndesigning training programs for HOUSEKEEPING NC IV.\n\nThey include information on curriculum design; training delivery; trainee entry\nrequirements; tools and equipment; training facilities; and trainer’s qualification.\n\n3.1\nCURRICULUM DESIGN\n\nTESDA shall provide the training on the development of competency-based\ncurricula to enable training providers develop their own curricula with the components\nmentioned below.\n\nDelivery of knowledge requirements for the basic, common and core units of\ncompetency\nspecifically\nin\nthe\nareas\nof\nmathematics,\nscience/technology,\ncommunication/language and other academic subjects shall be contextualized. To this\nend, TVET providers shall develop a Contextual Learning Matrix (CLM) to accompany\ntheir curricula.\n\nCourse Title: HOUSEKEEPING NC Level: IV\n\nNominal Training Duration: 47 Hours (Basic)\n\n 190 Hours (Common)\n\n 120 Hours (Core)\n\n 357 Hours\n\nCourse Description:\nThis course is designed to enhance the knowledge, skills, and attitudes in\naccordance with industry standards. This covers competencies that a person must\nachieve in planning and scheduling routine maintenance and repairs of physical assets,\nmanaging housekeeping services for guests, lost and found, inventory, storage and\nissuance of linen and uniforms, supplies and equipment, and laundry and valet\nservices.\n\nUpon completion of the course, the learners are expected to demonstrate the\nabove-mentioned competencies to be employed. To obtain this, all units prescribed for\nthis qualification must be achieved.\n\n--- PDF PAGE 114 ---\nHousekeeping NC IV Revision 01 Promulgated (10/15/2019) 110\n\nBASIC COMPETENCIES\n(47 Hours)\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nMethod\nNominal\nDuration\n1. Utilize\nspecialized\ncommunication\nskills\n\n1.1 Meet common and\nspecific\ncommunication\nneeds of clients\nand colleagues\n\n•\nRead\n➢ Communication process\n➢ Dynamics of groups and different\nstyles of group leadership\n•\nIdentify different approaches to meet\nthe needs of clients and colleagues\n• Lecture\n• Written examination\n1 Hour\n1.2. Contribute to the\ndevelopment of\ncommunication\nstrategies\n•\nApply communication skills to fulfill\njob roles as specified by the\norganization\n•\nApply communication techniques in\ncommunicating with clients and\ncolleagues\n➢ Active listening\n➢ Feedback\n➢ Interpretation\n➢ Role boundaries setting\n➢ Negotiation\n➢ Establishing empathy\n•\nDescribe strategies for internal and\nexternal dissemination of information\n• Demonstration\n• Group discussion\n• Observation\n• Oral evaluation\n1 Hour\n1.3. Deliver a technical\npresentation\n• Enhance the presentation using\nappropriate media\n• Deliver a clear and sequential\npresentation within given time\n• Demonstration\n• Observation\n1 Hour\n\n1.4. Represent the\norganization\n\n•\nDescribe criteria for a good\npresentation\n•\nPrepare presentation material for\ninternal or external forums to promote\nthe organization\n• Demonstration\n• Observation\n1 Hour\n\n--- PDF PAGE 115 ---\nHousekeeping NC IV Revision 01 Promulgated (10/15/2019) 111\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nMethod\nNominal\nDuration\n1.5. Facilitate group\ndiscussion\n• Gather relevant information\n• Apply values in facilitating differences in\nviews\n• Demonstration\n• Observation\n1 Hour\n1.6. Conduct interview\n• Describe communication strategies\nemployed in interview situations\n• Conduct interview\n• Apply organizations procedure in\nmaintaining records of interviews\n• Use questioning, listening and nonverbal\ncommunication techniques to client\ngroups\n• Group discussion\n• Demonstration\n• Oral evaluation\n• Observation\n1 Hour\n2. Develop and\nlead teams\n2.1 Foster individual\ngrowth\n\n• Discussion on Team Leadership and\nexpectation from team leaders\n• Case study on learning and development\nneeds of team members\n• Discussion on organizational\nrequirements from team members\n• Role play on coaching and mentoring\n• Discussion on preparation of team\nmembers development plan\n• Role Play on providing feedback on\nperformance\n• Observation\nLecture/\nDiscussion\n• Case Study\n• Role Play\n• Role Play\n• Case Study\n• Written Test\n• Observation\n• Role Play\n• Case Study\n• Written Test\n2 Hours\n2.2 Foster individual\nand team growth\n• Discussion on learning and development\nprogram goal setting\n• Preparation of learning and development\nprogram goals\n• Discussion on learning delivery methods\n• Role play on the different learning\ndelivery methods\n• Discussion on workplace learning\nopportunities\n• Role play on coaching and mentoring\n• Lecture/\nDiscussion\n• Case Study\n• Role Play\n• Observation\n• Role Play\n• Case Study\n• Written Test\n2 Hours\n\n--- PDF PAGE 116 ---\nHousekeeping NC IV Revision 01 Promulgated (10/15/2019) 112\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nMethod\nNominal\nDuration\n\n2.3 Monitor and\nevaluate workplace\nlearning\n•\nDiscussion on the different levels of\nlearning evaluation.\n•\nDiscussion on the different methods\nused to evaluate learning\n•\nDevelop reporting system for\nmonitoring of performance attributed\nto learning programs\n•\nGathering of information to evaluate\nindividual performance attributed to\nlearning programs\n•\nCase study on modification of\nlearning plan based on performance\n• Lecture/ Discussion\n• Case Study\nRole Play\n• Observation\n• Role Play\n• Case Study\n• Written Test\n2 Hours\n\n2.4 Develop team\ncommitment and\ncooperation\n•\nDiscussion on team commitment and\ncooperation and its impact to\nattainment of goals\n•\nPlay games on team commitment\nand cooperation\n•\nDiscussion on team dynamics and its\nrelation to team performance\n•\nPlay games on team dynamics and\nperformance\n•\nDevelopment of career plans\n\n• Lecture/ Discussion\n• Case Study\n• Role Play\n• Observation\n• Role Play\n• Case Study\n• Written Test\n1 Hour\n\n2.5 Facilitate\naccomplishment of\nteam goals\n• Perform team building activities towards\nimproving communication among team\nmembers, goal setting and improving\nperformance\n• Case studies involving collaborative\nactivities to improve attainment of group\ngoals\n• Group Activity\n• Case Study\n\n• Role Play\n• Case Study\n• Observation\n1 Hour\n\n--- PDF PAGE 117 ---\nHousekeeping NC IV Revision 01 Promulgated (10/15/2019) 113\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nMethod\nNominal\nDuration\n3. Perform\nhigher-order\nthinking\nprocesses and\napply\ntechniques in\nthe workplace\n3.1 Evaluate\neffectiveness and\nefficiency of the\nworkplace systems,\nprocesses and\nprocedures\n• Examine current systems, standards,\nprocedures and protocols in the\nworkplace\n• Discuss different methods of critical and\nappreciative inquiry and their relevance\nto different situations\n• Form habit of asking questions and\ntaking responsibility for answers\n• Appreciate importance of why questions\nfor individuals, businesses and\ncommunities\n• Use range of analytical techniques\n• Examine different strategies and\ntechniques in communicating results,\napplying critical thinking pathway,\nassessing effectiveness and efficiency\nof systems, processes and procedures\n\n• Group discussion\n• Lecture\n• Demonstration\n• Role playing\n• Case Formulation\n• Life Narrative Inquiry\n(Interview)\n• Standardized test\n1 Hour\n\n--- PDF PAGE 118 ---\nHousekeeping NC IV Revision 01 Promulgated (10/15/2019) 114\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nMethod\nNominal\nDuration\n\n3.2 Foster the habit of\ncritical inquiry and\ncuriosity in the\nworkplace\n• Discuss different methods of critical and\nappreciative inquiry and their relevance\nto different situations\n• Form habit of asking questions and\ntaking responsibility for answers\n• Appreciate importance of why questions\nfor individuals, businesses and\ncommunities\n• Use range of analytical techniques,\ngrowth mindset and positive\ncommunication strategies\n• Examine different strategies and\ntechniques in communicating results,\napplying critical thinking pathway,\nassessing effectiveness and efficiency of\nsystems, processes and procedures\n• Discuss insights on workplace\neffectiveness and efficiency\n• Group discussion\n• Lecture\n• Demonstration\n• Role playing\n• Case Formulation\n• Life Narrative\nInquiry (Interview)\n• Standardized test\n1 Hour\n\n3.3 Develop practical\naction plans for\nimproving\nworkplace\nconditions\n• Use range of analytical techniques,\ngrowth mindset and positive\ncommunication strategies in developing\naction plans for efficiency and\neffectiveness\n• Examine different strategies and\ntechniques in communicating results,\napplying critical thinking pathway,\nassessing effectiveness and efficiency of\nsystems, processes and procedures\n• Discuss concepts creative negotiation\nskills, change management and\nimprovement strategies\n• Group discussion\n• Lecture\n• Demonstration\n• Role playing\n• Case Formulation\n• Life Narrative\nInquiry (Interview)\n• Standardized test\n• Project-based\nlearning\n2 Hours\n\n--- PDF PAGE 119 ---\nHousekeeping NC IV Revision 01 Promulgated (10/15/2019) 115\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nMethod\nNominal\nDuration\n4. Contribute to\nthe practice of\nsocial justice in\nthe workplace\n\n4.1 Update self on\nlocal, national and\nglobal trends/\nissues in the\nworkplace\n• Explain the local, national and global\nsystems and structures\n• Discuss issues affecting interaction and\nconnectedness of communities at local,\nnational and global levels\n• Explain underlying assumptions and\npower dynamics (politics, understanding\npolitical system, social structures, labor\nlaws, labor relations, human right)\n• Monitor trends and issues relevant to\nhuman rights, gender equality, culture of\npeace, global citizenship, and cultural\ndiversity using different media platforms\n• Analyze trends and issues relevant to\nhuman rights, gender equality, culture of\npeace, global citizenship, and cultural\ndiversity\n• Engage in discourse about the local,\nnational and global issues\n• Interactive Lecture\n• Small Group\nDiscussion\n• Brainstorming\n• Role-playing\n• Demonstration or\nsimulation with oral\nquestioning\n• Group discussions\nand interactive\nactivities\n• Case studies/\nproblems involving\nworkplace diversity\nissues\n• Written\nexamination\n(Essay)\n• Role Playing\n1 Hour\n\n4.2 Relate local and\nglobal trends to\nworkplace context\n• Discuss the different levels of human\nidentity according to Amber Mayer (2015)\n• Explain different communities people\nbelong to and how these are connected\n• Recognize cultural differences and\nrespect for cultural diversity\n• Recognize differences and\ncommonalities among people\n• Demonstrate attitudes of empathy,\nsolidarity and respect for diversity\n• Connect local issues to global trends,\nand vice versa.\n• Interactive Lecture\n• Small Group\nDiscussion\n• Brainstorming\n• Role-playing\n• Demonstration or\nsimulation with oral\nquestioning\n• Group discussions\nand interactive\nactivities\n• Case studies/\nproblems involving\nworkplace diversity\nissues\n• Written\nexamination\n(Essay)\n1 Hour\n\n--- PDF PAGE 120 ---\nHousekeeping NC IV Revision 01 Promulgated (10/15/2019) 116\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nMethod\nNominal\nDuration\n\n4.3 Engage and take\nactions on\nworkplace issues\nand concerns\n• Identify the actions that can be taken\nindividually and collectively\n• Describe ethically responsible behaviour\n• Explain the importance and benefits of\ncivic engagement\n• Employ appropriate actions to address\nworkplace issues involving national and\nglobal trends\n• Show concern and willingness to take\npart in the development efforts to\ndiscuss workplace issues and concerns\n• Apply the attitude of “thinking globally\nand acting locally” in the workplace\n• Interactive Lecture\n• Small Group\nDiscussion\n• Brainstorming\n• Role-playing\n• Demonstration or\nsimulation with oral\nquestioning\n• Group discussions\nand interactive\nactivities\n• Case studies/\nproblems involving\nworkplace diversity\nissues\n• Written\nexamination\n(Essay)\n• Role Playing\n1 Hour\n5. Manage\ninnovative\nwork\ninstructions\n5.1 Review and\nanalyze existing\nworkplace\npractices\n• Show mastery of basic management\nconcepts according to Gallup, nine\ndimensions of innovative practices and\nclimate; and different types of innovation\n• Contextualize innovation to different\nvariables in the organization\n• Review current organizational practices\nwhere innovation is contextualized\n• Interactive Lecture\n• Appreciative\nInquiry\n• Demonstration\n• Group work\n• Psychological and\nbehavioral\nInterviews\n• Performance\nEvaluation\n• Life Narrative\nInquiry\n• Review of portfolios\nof evidence and\nthird-party\nworkplace reports\nof on-the-job\nperformance.\n• Standardized\nassessment of\ncharacter strengths\nand virtues applied\n1 Hour\n\n5.2 Examine\nopportunities for\n• Show mastery of the determinants of\ninnovative behaviors and principles of\n• Interactive Lecture\n• Appreciative\n• Psychological and\nbehavioral\n1 Hour\n\n--- PDF PAGE 121 ---\nHousekeeping NC IV Revision 01 Promulgated (10/15/2019) 117\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nMethod\nNominal\nDuration\ncontinuous\nimprovement and\ninnovation of\npractices in the\nworkplace\n\ninnovation\n• Review current organizational practices\nwhere innovation is contextualized\n• Evaluate innovative practices in the\norganization\n• Assess innovative behaviors for\npromoting innovation and learning in the\nworkplace\nInquiry\n• Demonstration\n• Group work\nInterviews\n• Performance\nEvaluation\n• Life Narrative\nInquiry\n• Review of portfolios\nof evidence and\nthird-party\nworkplace reports\nof on-the-job\nperformance.\n• Standardized\nassessment of\ncharacter strengths\nand virtues applied\n\n5.3 Implement\ninnovative ways in\nthe conduct of\nusual workplace\npractices\n\n• Show mastery of the determinants of\ninnovative behaviors, principles of\ninnovation; and dimensions of innovation\nclimate and strategies and techniques\nfor implementing innovation in the\nworkplace\n• Evaluate impact of innovative practices\nin the organization\n• Demonstrate skills in managing changes\nin the workplace\n• Interactive Lecture\n• Appreciative\nInquiry\n• Demonstration\n• Group work\n• Psychological and\nbehavioral\nInterviews\n• Performance\nEvaluation\n• Life Narrative\nInquiry\n• Review of portfolios\nof evidence and\nthird-party\nworkplace reports\nof on-the-job\nperformance.\n• Standardized\nassessment of\ncharacter strengths\nand virtues applied\n1 Hour\n\n--- PDF PAGE 122 ---\nHousekeeping NC IV Revision 01 Promulgated (10/15/2019) 118\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nMethod\nNominal\nDuration\n6. Manage and\nevaluate\nusage of\ninformation\n\n6.1 Review information\nneeds and sources\n• Lecture and discussion on:\no Kinds of information\no Information evaluation issues\no Information storage requirements\nand methods\n• Analyzing record information\n• Identification of information sources\n• Lecture\n• Group Discussion\n• Hands on\n• Demonstration\n• Practical exercises\n• Oral evaluation\n• Written Test\n• Observation\n• Presentation\n2 Hours\n\n6.2 Collect and analyze\ninformation\n• Lecture and discussion on:\no Information collection and collation\no Relevant trends and developments\n• Collection of information\n• Analyzation of information\n• Lecture\n• Group Discussion\n• Hands on\n• Demonstration\n• Practical exercises\n• Oral evaluation\n• Written Test\n• Observation\n• Presentation\n2 Hours\n\n6.3 Use management\ninformation\nsystems\n• Lecture and discussion on:\no Management information systems\no Available technology in information\nmanagement\no Advance strategies for customer\nservice excellence\n• Use of available technology in\ninformation management\n• Lecture\n• Group Discussion\n• Hands on\n• Demonstration\n• Practical exercises\n• Oral evaluation\n• Written Test\n• Observation\n• Presentation\n2 Hours\n\n6.4 Report and\ndisseminate\nanalyzed\ninformation\n• Lecture and discussion on:\no Reporting procedures of the\norganisation\no Analysis and display techniques\n• Using management information systems\nto store and retrieve data\n• Lecture\n• Group Discussion\n• Hands on\n• Demonstration\n• Practical exercises\n• Oral evaluation\n• Written Test\n• Observation\n• Presentation\n2 Hours\n\n--- PDF PAGE 123 ---\nHousekeeping NC IV Revision 01 Promulgated (10/15/2019) 119\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nMethod\nNominal\nDuration\n7. Lead in\nimprovement\nof\nOccupational\nSafety and\nHealth (OSH)\nprograms,\npolicies and\nprocedures\n7.1 Assess\nOccupational\nSafety and Health\n(OSH) practices\nand programs\n• Case Study in evaluating current OSH\nprograms effectiveness\n• Practice auditing the workplace\n•\nLecture\n•\nGroup\nDiscussion\n•\nCase Study\n•\nGroup Project\n\n•\nWritten Exam\n•\nDemonstration\n•\nObservation\n•\nInterviews /\nQuestioning\nPortfolio\n1 Hours\n\n7.2 Recommend OSH\n program\n improvement\n initiatives\n• Writing and Presenting Action Plans to\nimprove OSH compliance in the\nworkplace and/or increase effectiveness\nof OSH Programs\n•\nLecture\n•\nGroup\nDiscussion\n•\nCase Study\n•\nGroup Project\n\n•\nWritten Exam\n•\nDemonstration\n•\nObservation\n•\nInterviews /\nQuestioning\nPortfolio\n4 Hours\n\n7.3 Implement\nrecommended\nimprovements on\nOccupational\nSafety and Health\n(OSH) Programs,\nProcedures and\nPolicies\n• Role play in increasing the OSH\nawareness\n• Measuring the impact of the new OHS\nprogram or initiative\n•\nLecture\n•\nGroup\nDiscussion\n•\nCase Study\n•\nGroup Project\n•\nWritten Exam\n•\nDemonstration\n•\nObservation\n•\nInterviews /\n Questioning\n Portfolio\n2 Hours\n8. Lead towards\nimprovement\nof\nenvironmental\nwork\nprograms,\npolicies and\nprocedures\n8.1 Assess\nenvironmental work\npractices and\nprograms\n• Discussion of Green structural change\nand retraining needs\n-\nWhat is green structural change and\nwhere is it happening\n-\nWorkforce restructuring and\nadjustment\n-\nEmployment effects of Environment\n-\nSectors most affected by green\nrestructuring\n• Lecture\n• Group Discussion\n• Demonstration\n• Case Study\n• Reporting\n\n• Written Exam\n• Demonstration\n• Observation\n• Interviews /\nQuestioning\n• Third Party\nReports\n1 Hour\n\n--- PDF PAGE 124 ---\nHousekeeping NC IV Revision 01 Promulgated (10/15/2019) 120\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nMethod\nNominal\nDuration\n-\nRetraining and skills upgrading\n-\nEffective and equitable\nrestructuring: Good practices and\nprograms by public and private\nsector actors\n• Perform Impact Assessment\n• Discussions of Gender Implications\n\n8.2 Recommend\nenvironmental\nprogram\nimprovement\ninitiatives\n• Practicing Leadership skills: The biggest\nchallenge in transition to a low-carbon\neconomy or environment friendly\nactivities\n• Practicing Basic Business planning\n• Opportunities Management -\nIdentification of low-carbon and\nResource scarcity risks\n• Perform Cost–benefit Analysis\n• Lecture\n• Group Discussion\n• Demonstration\n• Case Study\n• Reporting\n\n• Written Exam\n• Demonstration\n• Observation\n• Interviews /\nQuestioning\n• Third Party\nReports\n1 Hour\n\n8.3 Implement\nrecommended\nimprovements on\nenvironmental\nprograms, policies\nand procedures\n• Practicing Environmental Awareness\nRaising (Communication/\nImplementation campaigns)\n• Teaching and training personnel -\nnecessary skills and methods to impart\nenvironmental knowledge, to create\nawareness and to react flexibly to ever-\nchanging labor market needs.\n• Lecture\n• Group Discussion\n• Demonstration\n• Case Study\n• Reporting\n\n• Written Exam\n• Demonstration\n• Observation\n• Interviews /\nQuestioning\n• Third Party\nReports\n1 Hour\n9. Sustain\nentrepreneurial\nskills\n9.1 Enhance one’s\nbusiness skills\n• Discussion on entrepreneurial skills\n• Identifying market trends\n• Case studies on new technologies,\nproducts and processes\n• Practice gathering information on new\ntrends\n• Lecture/ Discussion\n• Case study\n• Group work\n• Written Report\n• Case problem\n2 Hours\n\n--- PDF PAGE 125 ---\nHousekeeping NC IV Revision 01 Promulgated (10/15/2019) 121\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nMethod\nNominal\nDuration\n\n4. Manage\nentrepreneurial\npractices\n\n• Discussion on continuous improvement\n• Presentation of plans for continuous\nimprovement\n• Evaluation of new products and services\n\n• Lecture discussion\n• Group work\n• Written Report\n• Case problem\n1 Hour\n\n9.2 Expand markets\nand clientele\n• Prepare business plan and proposal\n• Lecture discussion\n• Group work\n• Portfolio\n1 Hour\n\n--- PDF PAGE 126 ---\nHousekeeping NC IV Revision 01 Promulgated (10/15/2019) 122\n\nCOMMON COMPETENCIES\n(190 Hours)\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n1. Maintain\nhospitality\nindustry\nknowledge\n1.1 Seek information\non the hospitality\nindustry\n\n•\nIdentify and access sources of information\non the hotel and travel industries,\nappropriately and correctly\n•\nObtain information on the hotel and travel\nindustries to assist effective work\nperformance within the industries\n•\nAccess and update specific information on\nrelevant sector(s) of work\n•\nUse knowledge of the hotel and travel\nindustries in the correct context to enhance\nquality of work performance\n•\nObtain information on other industries to\nenhance quality of work performance\n• Discussion\n• Demonstration\n• Lecture\n• Group\ndiscussion\n• Simulation\n\n• Observation\n• Demonstration\n• Written\nExamination\n• Interview\n\n5\nhours\n\n1.2 Source and apply\ninformation on\nlegal and ethical\nissues for the\nhospitality\nindustry\n•\nObtain information on legal issues and\nethical issues to assist effective work\nperformance\n•\nConduct day-to-day hospitality industry\nactivities in accordance with legal obligations\nand ethical industry practices\n• Discussion\n• Demonstration\n• Lecture\n• Group\ndiscussion\n• Simulation\n\n• Observation\n• Demonstration\n• Written\nExamination\n• Interview\n\n5\nhours\n\n1.3 Update\nhospitality\nindustry\nknowledge\n•\nIdentify and use a range of opportunities to\nupdate general knowledge of the hotel and\ntravel industries\n•\nMonitor current issues of concern to the\nindustries\n•\nShare updated knowledge with customers and\ncolleagues as appropriate and incorporate this\nknowledge into day-to-day work activities\n• Discussion\n• Demonstration\n• Lecture\n• Group\ndiscussion\n• Simulation\n\n• Observation\n• Demonstration\n• Written\nExamination\n• Interview\n\n10 hours\n\n--- PDF PAGE 127 ---\nHousekeeping NC IV Revision 01 Promulgated (10/15/2019) 123\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n2. Perform child\nprotection duties\nrelevant to the\ntourism industry\n2.1 Identify the issue\nof sexual\nexploitation of\nchildren by\ntourists\n\n•\nDefine the problem of child sexual\nexploitation of children by tourists (otherwise\nknown as child-sex tourism)\n•\nDescribe the impact of child sexual\nexploitation on children, communities and the\nhotel and travel industries\n•\nIdentify suspicious behaviors that may be\nexhibited by child sex tourists\n• Discussion\n• Demonstration\n• Lecture\n• Group\ndiscussion\n• Simulation\n\n• Observation\n• Demonstration\n• Written\nExamination\n• Interview\n\n5\nhours\n\n2.2 Describe\nnational, regional\nand international\nactions to prevent\nthe sexual\nexploitation of\nchildren by\ntourists\n•\nLocate and become familiar with the United\nNations Convention on the Rights (UNCRC)\nof the Child and the main UN Articles relating\nto the rights of all children to be safe from\nsexual exploitation\n•\nExamine national, regional and international\ninitiatives to prevent the sexual exploitation\nof children by tourists\n•\nIdentify reporting mechanisms if suspicious\nbehaviors is observed\n• Discussion\n• Demonstration\n• Lecture\n• Group\ndiscussion\n• Simulation\n\n• Observation\n• Demonstration\n• Written\nExamination\n• Interview\n\n5\nhours\n\n2.3 Describe actions\nthat can be taken\nin the workplace\nto protect\nchildren from\nsexual\nexploitation by\ntourists\n•\nPrepare a list of actions that can be taken by\nstaff working in each labor division of the\nhotel and travel industries to prevent the\nsexual exploitation of children by tourists\n•\nSelect the best action to take by a staff for\nparticular situations in preventing the sexual\nexploitation of children by tourists\n•\nParticipate in national and regional\ncampaigns to promote greater public\nawareness and action to prevent child sexual\nexploitation in tourism destinations\n• Discussion\n• Demonstration\n• Lecture\n• Group\ndiscussion\n• Simulation\n\n• Observation\n• Demonstration\n• Written\nExamination\n• Interview\n\n5\nhours\n3. Develop and\nsupervise\noperational\napproaches\n3.1 Communicate\nwork roles\n•\nIdentify, develop and communicate\noperational plans and objectives to team\nmembers\n•\nMatch skills of team members to tasks and\n• Discussion\n• Demonstration\n• Lecture\n• Group\n• Observation\n• Demonstration\n• Written\nExamination\n10 hours\n\n--- PDF PAGE 128 ---\nHousekeeping NC IV Revision 01 Promulgated (10/15/2019) 124\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n\nduties and develop job responsibilities in line\nwith enterprise guidelines\n•\nCommunicate requirements of jobs and\ntasks clearly to team members\ndiscussion\n• Simulation\n\n• Interview\n\n3.2 Coordinate\nactivities\n•\nDevelop work plans that establish\nappropriate targets and task objectives\n•\nPrioritize work activities to ensure completion\nof tasks in accordance with work\nrequirements\n•\nIdentify and incorporate training and learning\nopportunities into work activities\n•\nMaintain clear supervisory and reporting\nresponsibilities in line with organizational\nrequirements\n\n• Discussion\n• Demonstration\n• Lecture\n• Group\ndiscussion\n• Simulation\n\n• Observation\n• Demonstration\n• Written\nExamination\n• Interview\n\n10 hours\n\n3.3 Maintain effective\nworking relations\n•\nRecognize and address problems with team\nmembers\n•\nSeek assistance of team members when\ndifficulties arise to achieve allocated tasks.\n•\nCommunicate requirements of work activities\nusing a participative approach\n•\nManage disagreements and conflicts\nconstructively using appropriate conflict\nmanagement strategies\n• Discussion\n• Demonstration\n• Lecture\n• Group\ndiscussion\n• Simulation\n\n• Observation\n• Demonstration\n• Written\nExamination\n• Interview\n\n10 hours\n\n3.4 Provide feedback •\nProvide clear, constructive feedback to\nindividuals to support achievement of\noutcomes\n•\nMonitor team and individual performances to\nensure team members are able to achieve\ngoals\n•\nIdentify opportunity for individual\ndevelopment\n•\nMaintain clear supervisory and reporting\n• Discussion\n• Demonstration\n• Lecture\n• Group\n