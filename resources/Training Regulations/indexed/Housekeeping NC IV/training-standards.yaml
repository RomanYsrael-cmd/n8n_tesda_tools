\nDiscussion\n• Presentation\n\n5.3 Implement provisions of\nlaundry/ valet services\n•\nReview procedures for delivery\nservices of guests\n•\nMonitor actions undertaken by\nlaundry valet personnel\n• Individual\nlearning\n• Group\nDiscussion\n• Presentation\n• Written Examination\n• Oral Questioning\n4\n\n--- PDF PAGE 141 ---\nHousekeeping NC IV Revision 01 Promulgated (10/15/2019) 137\n\n3.2\nTRAINING DELIVERY\n\n1. The delivery of training shall adhere to the design of the curriculum. Delivery\nshall be guided by the principles of competency-based TVET.\n\na. Course design is based on competency standards set by the industry or\nrecognized\nindustry\nsector;\n(Learning\nsystem\nis\ndriven\nby\ncompetencies written to industry standards)\n\nb. Training\ndelivery\nis\nlearner-centered\nand\nshould\naccommodate\nindividualized and self-paced learning strategies;\n\nc. Training can be done on an actual workplace setting, simulation of a\nworkplace and/or through adoption of modern technology.\n\nd. Assessment is based in the collection of evidence of the performance of\nwork to the industry required standards;\n\ne. Assessment of competency takes the trainee’s knowledge and attitude into\naccount but requires evidence of actual performance of the competency as\nthe primary source of evidence.\n\nf. Training program allows for recognition of prior learning (RPL) or current\ncompetencies;\n\ng. Training completion is based on satisfactory completion of all specified\ncompetencies not on the specified nominal duration of learning.\n\n2. The competency-based TVET system recognizes various types of delivery\nmodes, both on-and off-the-job as long as the learning is driven by the\ncompetency standards specified by the industry. The following training\nmodalities and their variations/components may be adopted singly or in\ncombination with other modalities when designing and delivering training\nprograms:\n\n2.1 Institution- Based:\n\n• Dual Training System (DTS)/Dualized Training Program (DTP) which\ncontain both in-school and in-industry training or fieldwork\ncomponents. Details can be referred to the Implementing Rules and\nRegulations of the DTS Law and the TESDA Guidelines on the DTP;\n\n--- PDF PAGE 142 ---\nHousekeeping NC IV Revision 01 Promulgated (10/15/2019) 138\n\n• Distance learning is a formal education process in which majority of\nthe instruction occurs when the students and instructor are not in the\nsame place. Distance learning may employ correspondence study,\naudio, video, computer technologies or other modern technology that\ncan be used to facilitate learning and formal and non-formal training.\nSpecific guidelines on this mode shall be issued by the TESDA\nSecretariat.\n\n• The traditional classroom-based or in-center instruction may be\nenhanced through use of learner-centered methods as well as\nlaboratory or field-work components.\n\n2.2 Enterprise-Based:\n\n• Formal Apprenticeship – Training within employment involving a\ncontract between an apprentice and an enterprise on an approved\napprenticeable occupation.\n\n• Informal Apprenticeship - is based on a training (and working)\nagreement between an apprentice and a master craftsperson wherein\nthe agreement may be written or oral and the master craftsperson\ncommits to training the apprentice in all the skills relevant to his or her\ntrade over a significant period of time, usually between one and four\nyears, while the apprentice commits to contributing productively to the\nwork of the business. Training is integrated into the production\nprocess and apprentices learn by working alongside the experienced\ncraftsperson.\n\n• Enterprise-based Training- where training is implemented within the\ncompany in accordance with the requirements of the specific\ncompany. Specific guidelines on this mode shall be issued by the\nTESDA Secretariat.\n\n2.3 Community-Based\n\n• Community-Based – short term programs conducted by non-\ngovernment organizations (NGOs), LGUs, training centers and other\nTVET providers which are intended to address the specific needs of a\ncommunity. Such programs can be conducted in informal settings\nsuch as barangay hall, basketball courts, etc. These programs can\nalso be mobile training program (MTP).\n\n--- PDF PAGE 143 ---\nHousekeeping NC IV Revision 01 Promulgated (10/15/2019) 139\n\n3.3\nTRAINEE ENTRY REQUIREMENTS\n\nTrainees or students who wish to enter this training should possess the\nfollowing requirements:\n\n•\nMust have completed Senior High School or an Alternative Learning System\n(ALS) Certificate of Completion\n•\nCan communicate in intermediate English in both oral and written form\n•\nMust be computer literate\n•\nCan perform mathematical computation\n•\nMust be competent in Housekeeping NC III qualification gained through\ntraining or experience or certification\n\n--- PDF PAGE 144 ---\nHousekeeping NC IV Revision 01 Promulgated (10/15/2019) 140\n\n3.4\n\nLIST OF TOOLS AND EQUIPMENT AND MATERIALS\n Recommended list of tools, equipment and materials for the training of a minimum of 25\ntrainees for HOUSEKEEPING NC IV are as follows:\nSUPPLIES\nEQUIPMENT\nREFERENCE MATERIALS\nQTY\n\nQTY\n\nQTY\n\n2\nrims A4 paper\n25\nunit\ns\nComputer with\ninternet connection\n25\nInventory forms for tools,\nequipment and supplies\n2\nrims\nLegal Bond\npaper\n1\nunit\nLCD projector\n1\nHACCP\n2set\ns\nprinter ink\n2\nunit\nPrinter\n1\nBOSH\n\n1\nInternal policies on green\npractices\n\n50\nGuest feedback form\n\n25\nStaff roster worksheet\n\n25\nMonitoring sheet for\nwaste management and\ndisposal\n\n25\nEvaluation forms for\nHousekeeping staff\n\n1\nGAD Manual/handbook\n\n25\nLost and found inventory\nforms\n\n25\nReturn/Release Lost and\nFound forms\n\n25\nUnclaimed Lost and\nfound inventory forms\n\n25\nMaintenance Checklist for\nLost and Found Facilities\n\n25\nLaundry Service forms\n\n25\nLaundry Service\ninventory forms\n\n25\nMonitoring Sheet for\nLaundry service\n\n25\nPrice list of laundry items\n\n25\nMaintenance Checklist for\nLaundry Facilities\nNOTE: Implementation of the training program can be facilitated through a Memorandum of Agreement between the\ntraining provider and industry partner/s regarding the use of facilities. This is in response to the high cost of\nfacilities and equipment. Airconditioned vehicles can be hired on a per trip basis subject to requirement.\n\n--- PDF PAGE 145 ---\nHousekeeping NC IV Revision 01 Promulgated (10/15/2019) 141\n\n3.5\nTRAINING FACILITIES\n\nBased on a class intake of 25 students/trainees.\n\nSpace Requirement\n\nSize in Meters\n\nArea in Sq.\nMeters\n\nTotal Area in Sq.\nMeters\nPractical Work Area per\nTrainee\n1 x 1 m\n1 sq. m.\n25 sq. m\nContextual Learning\nArea\n5 x 5 m\n25 sq. m.\n25 sq. m\nDistance Learning\n/Computer Center\n6.8 x 5 m\n34 sq. m.\n34 sq. m.\nLearning Resource\nArea\n2 x 5 m\n10 sq. m.\n10 sq. m\nStorage Area\n2 x 5 m\n10 sq. m.\n10 sq. m.\nTotal workshop area:\n104 sq. m.\n\n3.6\nTRAINER’S QUALIFICATIONS\n\n• Holder of National TVET Trainer Certificate (NTTC) Level I in Housekeeping\nNC IV\n• Must have at least two (2) years industry experience as Assistant Executive\nHousekeeper/Manager\n\n3.7 INSTITUTIONAL ASSESSMENT\n\nInstitutional assessment is undertaken by trainees to determine their\nachievement of units of competency. A certificate of achievement is issued for\neach unit of competency.\n\n--- PDF PAGE 146 ---\nHousekeeping NC IV Revision 01 Promulgated (10/15/2019) 142"
