  "source_section_text": "SECTION 3 TRAINING ARRANGEMENTS\n\nThese standards are set to provide technical and vocational education and training\n(TVET) providers with information and other important requirements to consider when\ndesigning training programs for HOUSEKEEPING NC IV.\n\nThey include information on curriculum design; training delivery; trainee entry\nrequirements; tools and equipment; training facilities; and trainer’s qualification.\n\n3.1\nCURRICULUM DESIGN\n\nTESDA shall provide the training on the development of competency-based\ncurricula to enable training providers develop their own curricula with the components\nmentioned below.\n\nDelivery of knowledge requirements for the basic, common and core units of\ncompetency\nspecifically\nin\nthe\nareas\nof\nmathematics,\nscience/technology,\ncommunication/language and other academic subjects shall be contextualized. To this\nend, TVET providers shall develop a Contextual Learning Matrix (CLM) to accompany\ntheir curricula.\n\nCourse Title: HOUSEKEEPING NC Level: IV\n\nNominal Training Duration: 47 Hours (Basic)\n\n 190 Hours (Common)\n\n 120 Hours (Core)\n\n 357 Hours\n\nCourse Description:\nThis course is designed to enhance the knowledge, skills, and attitudes in\naccordance with industry standards. This covers competencies that a person must\nachieve in planning and scheduling routine maintenance and repairs of physical assets,\nmanaging housekeeping services for guests, lost and found, inventory, storage and\nissuance of linen and uniforms, supplies and equipment, and laundry and valet\nservices.\n\nUpon completion of the course, the learners are expected to demonstrate the\nabove-mentioned competencies to be employed. To obtain this, all units prescribed for\nthis qualification must be achieved.\n\n--- PDF PAGE 114 ---\nHousekeeping NC IV Revision 01 Promulgated (10/15/2019) 110\n\nBASIC COMPETENCIES\n(47 Hours)\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nMethod\nNominal\nDuration\n1. Utilize\nspecialized\ncommunication\nskills\n\n1.1 Meet common and\nspecific\ncommunication\nneeds of clients\nand colleagues\n\n•\nRead\n➢ Communication process\n➢ Dynamics of groups and different\nstyles of group leadership\n•\nIdentify different approaches to meet\nthe needs of clients and colleagues\n• Lecture\n• Written examination\n1 Hour\n1.2. Contribute to the\ndevelopment of\ncommunication\nstrategies\n•\nApply communication skills to fulfill\njob roles as specified by the\norganization\n•\nApply communication techniques in\ncommunicating with clients and\ncolleagues\n➢ Active listening\n➢ Feedback\n➢ Interpretation\n➢ Role boundaries setting\n➢ Negotiation\n➢ Establishing empathy\n•\nDescribe strategies for internal and\nexternal dissemination of information\n• Demonstration\n• Group discussion\n• Observation\n• Oral evaluation\n1 Hour\n1.3. Deliver a technical\npresentation\n• Enhance the presentation using\nappropriate media\n• Deliver a clear and sequential\npresentation within given time\n• Demonstration\n• Observation\n1 Hour\n\n1.4. Represent the\norganization\n\n•\nDescribe criteria for a good\npresentation\n•\nPrepare presentation material for\ninternal or external forums to promote\nthe organization\n• Demonstration\n• Observation\n1 Hour\n\n--- PDF PAGE 115 ---\nHousekeeping NC IV Revision 01 Promulgated (10/15/2019) 111\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nMethod\nNominal\nDuration\n1.5. Facilitate group\ndiscussion\n• Gather relevant information\n• Apply values in facilitating differences in\nviews\n• Demonstration\n• Observation\n1 Hour\n1.6. Conduct interview\n• Describe communication strategies\nemployed in interview situations\n• Conduct interview\n• Apply organizations procedure in\nmaintaining records of interviews\n• Use questioning, listening and nonverbal\ncommunication techniques to client\ngroups\n• Group discussion\n• Demonstration\n• Oral evaluation\n• Observation\n1 Hour\n2. Develop and\nlead teams\n2.1 Foster individual\ngrowth\n\n• Discussion on Team Leadership and\nexpectation from team leaders\n• Case study on learning and development\nneeds of team members\n• Discussion on organizational\nrequirements from team members\n• Role play on coaching and mentoring\n• Discussion on preparation of team\nmembers development plan\n• Role Play on providing feedback on\nperformance\n• Observation\nLecture/\nDiscussion\n• Case Study\n• Role Play\n• Role Play\n• Case Study\n• Written Test\n• Observation\n• Role Play\n• Case Study\n• Written Test\n2 Hours\n2.2 Foster individual\nand team growth\n• Discussion on learning and development\nprogram goal setting\n• Preparation of learning and development\nprogram goals\n• Discussion on learning delivery methods\n• Role play on the different learning\ndelivery methods\n• Discussion on workplace learning\nopportunities\n• Role play on coaching and mentoring\n• Lecture/\nDiscussion\n• Case Study\n• Role Play\n• Observation\n• Role Play\n• Case Study\n• Written Test\n2 Hours\n\n--- PDF PAGE 116 ---\nHousekeeping NC IV Revision 01 Promulgated (10/15/2019) 112\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nMethod\nNominal\nDuration\n\n2.3 Monitor and\nevaluate workplace\nlearning\n•\nDiscussion on the different levels of\nlearning evaluation.\n•\nDiscussion on the different methods\nused to evaluate learning\n•\nDevelop reporting system for\nmonitoring of performance attributed\nto learning programs\n•\nGathering of information to evaluate\nindividual performance attributed to\nlearning programs\n•\nCase study on modification of\nlearning plan based on performance\n• Lecture/ Discussion\n• Case Study\nRole Play\n• Observation\n• Role Play\n• Case Study\n• Written Test\n2 Hours\n\n2.4 Develop team\ncommitment and\ncooperation\n•\nDiscussion on team commitment and\ncooperation and its impact to\nattainment of goals\n•\nPlay games on team commitment\nand cooperation\n•\nDiscussion on team dynamics and its\nrelation to team performance\n•\nPlay games on team dynamics and\nperformance\n•\nDevelopment of career plans\n\n• Lecture/ Discussion\n• Case Study\n• Role Play\n• Observation\n• Role Play\n• Case Study\n• Written Test\n1 Hour\n\n2.5 Facilitate\naccomplishment of\nteam goals\n• Perform team building activities towards\nimproving communication among team\nmembers, goal setting and improving\nperformance\n• Case studies involving collaborative\nactivities to improve attainment of group\ngoals\n• Group Activity\n• Case Study\n\n• Role Play\n• Case Study\n• Observation\n1 Hour\n\n--- PDF PAGE 117 ---\nHousekeeping NC IV Revision 01 Promulgated (10/15/2019) 113\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nMethod\nNominal\nDuration\n3. Perform\nhigher-order\nthinking\nprocesses and\napply\ntechniques in\nthe workplace\n3.1 Evaluate\neffectiveness and\nefficiency of the\nworkplace systems,\nprocesses and\nprocedures\n• Examine current systems, standards,\nprocedures and protocols in the\nworkplace\n• Discuss different methods of critical and\nappreciative inquiry and their relevance\nto different situations\n• Form habit of asking questions and\ntaking responsibility for answers\n• Appreciate importance of why questions\nfor individuals, businesses and\ncommunities\n• Use range of analytical techniques\n• Examine different strategies and\ntechniques in communicating results,\napplying critical thinking pathway,\nassessing effectiveness and efficiency\nof systems, processes and procedures\n\n• Group discussion\n• Lecture\n• Demonstration\n• Role playing\n• Case Formulation\n• Life Narrative Inquiry\n(Interview)\n• Standardized test\n1 Hour\n\n--- PDF PAGE 118 ---\nHousekeeping NC IV Revision 01 Promulgated (10/15/2019) 114\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nMethod\nNominal\nDuration\n\n3.2 Foster the habit of\