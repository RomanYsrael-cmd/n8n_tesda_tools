al practices\nwhere innovation is contextualized\n• Evaluate innovative practices in the\norganization\n• Assess innovative behaviors for\npromoting innovation and learning in the\nworkplace\nInquiry\n• Demonstration\n• Group work\nInterviews\n• Performance\nEvaluation\n• Life Narrative\nInquiry\n• Review of portfolios\nof evidence and\nthird-party\nworkplace reports\nof on-the-job\nperformance.\n• Standardized\nassessment of\ncharacter strengths\nand virtues applied\n\n5.3 Implement\ninnovative ways in\nthe conduct of\nusual workplace\npractices\n\n• Show mastery of the determinants of\ninnovative behaviors, principles of\ninnovation; and dimensions of innovation\nclimate and strategies and techniques\nfor implementing innovation in the\nworkplace\n• Evaluate impact of innovative practices\nin the organization\n• Demonstrate skills in managing changes\nin the workplace\n• Interactive Lecture\n• Appreciative\nInquiry\n• Demonstration\n• Group work\n• Psychological and\nbehavioral\nInterviews\n• Performance\nEvaluation\n• Life Narrative\nInquiry\n• Review of portfolios\nof evidence and\nthird-party\nworkplace reports\nof on-the-job\nperformance.\n• Standardized\nassessment of\ncharacter strengths\nand virtues applied\n1 Hour\n\n--- PDF PAGE 122 ---\nHousekeeping NC IV Revision 01 Promulgated (10/15/2019) 118\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nMethod\nNominal\nDuration\n6. Manage and\nevaluate\nusage of\ninformation\n\n6.1 Review information\nneeds and sources\n• Lecture and discussion on:\no Kinds of information\no Information evaluation issues\no Information storage requirements\nand methods\n• Analyzing record information\n• Identification of information sources\n• Lecture\n• Group Discussion\n• Hands on\n• Demonstration\n• Practical exercises\n• Oral evaluation\n• Written Test\n• Observation\n• Presentation\n2 Hours\n\n6.2 Collect and analyze\ninformation\n• Lecture and discussion on:\no Information collection 