s /\nQuestioning\n• Third Party\nReports\n1 Hour\n\n8.3 Implement\nrecommended\nimprovements on\nenvironmental\nprograms, policies\nand procedures\n• Practicing Environmental Awareness\nRaising (Communication/\nImplementation campaigns)\n• Teaching and training personnel -\nnecessary skills and methods to impart\nenvironmental knowledge, to create\nawareness and to react flexibly to ever-\nchanging labor market needs.\n• Lecture\n• Group Discussion\n• Demonstration\n• Case Study\n• Reporting\n\n• Written Exam\n• Demonstration\n• Observation\n• Interviews /\nQuestioning\n• Third Party\nReports\n1 Hour\n9. Sustain\nentrepreneurial\nskills\n9.1 Enhance one’s\nbusiness skills\n• Discussion on entrepreneurial skills\n• Identifying market trends\n• Case studies on new technologies,\nproducts and processes\n• Practice gathering information on new\ntrends\n• Lecture/ Discussion\n• Case study\n• Group work\n• Written Report\n• Case problem\n2 Hours\n\n--- PDF PAGE 125 ---\nHousekeeping NC IV Revision 01 Promulgated (10/15/2019) 121\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nMethod\nNominal\nDuration\n\n4. Manage\nentrepreneurial\npractices\n\n• Discussion on continuous improvement\n• Presentation of plans for continuous\nimprovement\n• Evaluation of new products and services\n\n• Lecture discussion\n• Group work\n• Written Report\n• Case problem\n1 Hour\n\n9.2 Expand markets\nand clientele\n• Prepare business plan and proposal\n• Lecture discussion\n• Group work\n• Portfolio\n1 Hour\n\n--- PDF PAGE 126 ---\nHousekeeping NC IV Revision 01 Promulgated (10/15/2019) 122\n\nCOMMON COMPETENCIES\n(190 Hours)\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n1. Maintain\nhospitality\nindustry\nknowledge\n1.1 Seek information\non the hospitality\nindustry\n\n•\nIdentify and access sources of information\non the hotel and travel industries,\nappropriately and correctly\n•\nObtain information on the hotel and travel\nindustries to assist effective work\nperformance within the industries\n•\nAccess and update specific information on\nrelevant sector(s) of work\n•\nUse knowledge of the hotel and travel\nindustries in the correct context to enhance\nquality of work performance\n•\nObtain information on other industries to\nenhance quality of work performance\n• Discussion\n• Demonstration\n• Lecture\n• Group\ndiscussion\n• Simulation\n\n• Observation\n• Demonstration\n• Written\nExamination\n• Interview\n\n5\nhours\n\n1.2 Source and apply\ninformation on\nlegal and ethical\nissues for the\nhospitality\nindustry\n•\nObtain information on legal issues and\nethical issues to assist effective work\nperformance\n•\nConduct day-to-day hospitality industry\nactivities in accordance with legal obligations\nand ethical industry practices\n• Discussion\n• Demonstration\n• Lecture\n• Group\ndiscussion\n• Simulation\n\n• Observation\n• Demonstration\n• Written\nExamination\n• Interview\n\n5\nhours\n\n1.3 Update\nhospitality\nindustry\nknowledge\n•\nIdentify and use a range of opportunities to\nupdate general knowledge of the hotel and\ntravel industries\n•\nMonitor current issues of concern to the\nindustries\n•\nShare updated knowledge with customers and\ncolleagues as appropriate and incorporate this\nknowledge into day-to-day work activities\n• Discussion\n• Demonstration\n• Lecture\n• Group\ndiscussion\n• Simulation\n\n• Observation\n• Demonstration\n• Written\nExamination\n• Interview\n\n10 hours\n\n--- PDF PAGE 127 ---\nHousekeeping NC IV Revision 01 Promulgated (10/15/2019) 123\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n2. Perform child\nprotection duties\nrelevant to the\ntourism industry\n2.1 Identify the issue\nof sexual\nexploitation of\nchildren by\ntourists\n\n•\nDefine the problem of child sexual\nexploitation of children by tourists (otherwise\nknown as child