rdance with company\nrequirements\n• Individual\nlearning\n• Group\nDiscussion\n• Presentation\n• Written Examination\n• Oral Questioning\n4 Hours\n2. Plan and\nmanage\nhousekeeping\nservices for\nguests\n2.1 Establish requirements\nneeded in providing\nhousekeeping services to\nguests\n•\nHousekeeping requirements are\nidentified in accordance to\nenterprise policies and procedure.\n•\nRecord housekeeping requests\naccording to enterprise requirements\n•\nIdentify needed housekeeping\npersonnel to service housekeeping\ndepartment\n• Individual\nlearning\n• Group\nDiscussion\n• Presentation\n• Written Examination\n• Oral Questioning\n6 Hours\n\n2.2 Manage housekeeping\nservices provided to\nguests\n•\nManage housekeeping requests\nfrom guests\n•\nRecord housekeeping services\nprovided to guests according to\nenterprise requirements\n•\nEnsure timely provision/delivery of\nidentified services for guests\n•\nLiaise with other staff to obtain\nand/or deliver housekeeping\nservices\n• Individual\nlearning\n• Group\nDiscussion\n• Presentation\n• Written Examination\n• Oral Questioning\n14 Hours\n\n--- PDF PAGE 138 ---\nHousekeeping NC IV Revision 01 Promulgated (10/15/2019) 134\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodologies\nAssessment Methods\nNominal\nDuration\n\n2.3 Implement provisions of\nhousekeeping services\n•\nParticipate in planning to enhance\nservice delivery standards\n•\nLiaise with other departments in\ncarrying out housekeeping services\nto guests\n•\nMonitor and document\nhousekeeping services provided for\nguests\n• Individual\nlearning\n• Group\nDiscussion\n• Presentation\n• Written Examination\n• Oral Questioning\n4 Hours\n3. Manage lost\nand found\nprocedures\n3.1 Establish lost and found\npolicies and procedures\n•\nDevelop an in-house lost and\nfound policies and procedures\n•\nIdentify the legal requirements that\napply to lost and found items\n•\nCommunicate the location and\nfunction of the lost and found facility\nto guests and staff\n•\nEstablish lost and found register\n• Individual\nlearning\n• Group\nDiscussion\n• Presentation\n• Written Examination\n• Oral Questioning\n12 Hours\n\n3.2 Monitor lost and found\nitems\n• Monitor lost and found items\n• Monitor the maintenance of lost and\nfound items\n• Recognize application of legal\nrequirements for lost and found items\n• Individual\nlearning\n• Group\nDiscussion\n• Presentation\n• Written Examination\n• Oral Questioning\n4Hours\n\n3.3 Monitor claim for lost\nitem\n• Identity of lost property claimed is\nassessed\n• Determine the authenticity of\nownership of property claimed\n• Evaluate the compliance with\nestablishment policies as to BOSH,\ngreen practices and legal obligations\n• Individual\nlearning\n• Group\nDiscussion\n• Presentation\n• Written Examination\n• Oral Questioning\n4 Hours\n\n3.4 Monitor unclaimed\nitems\n• Check the inventory of unclaimed\nitems according to policies and\nstandards\n• Document the removal or releasing of\nunclaimed lost and found items\n• Individual\nlearning\n• Group\nDiscussion\n• Presentation\n• Written Examination\n• Oral Questioning\n4 Hours\n\n--- PDF PAGE 139 ---\nHousekeeping NC IV Revision 01 Promulgated (10/15/2019) 135\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodologies\nAssessment Methods\nNominal\nDuration\n4. Manage\ninventory,\nstorage and\nissuance of\nlinen and\nuniform\n4.1 Evaluate delivery of linen\nand uniform stocks\n\n•\nMonitor and verify incoming linen\nand uniform stock\n•\nMonitor area to receive linen and\nuniform stock\n•\nManage excess stock within the\ndepartment\n•\nRequest new stock to replace\ndamaged linen/uniforms\n• Individual\nlearning\n• Group\nDiscussion\n• Presentation\n• Written Examination\n• Oral Questioning\n4 Hours\n\n4.2 Establish inventory,\nstorage and issuance of\nlinen and uniform control\nsystem\n•\nDevelop stock control systems\n•\nMonitor systems in the workplace\n•\nMinimize stock wastage\n• Individual\nl