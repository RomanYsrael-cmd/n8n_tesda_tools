    "source_text": "3.1 CURRICULUM DESIGN\n\nCourse Title: ORGANIC AGRICULTURE PRODUCTION Level: NC II\n\nNominal Training Duration:\n18 hrs -\nBasic Competencies\n 64 hrs-\nCommon Competencies\n96 hrs-\nCore Competencies\n54 hrs.\nElective Competencies\n232 hrs-\nTotal training duration\n\nCourse Description:\n\nThis course is designed to enhance the knowledge, desirable skills and attitudes of\nOrganic Agriculture Production NCll in accordance with industry standards. It covers\ncore competencies such as: raise organic chicken, produce organic vegetable,\nproduced organic fertilizer and produce organic concoctions and extracts. It also has\ntwo (2) elective competencies: raise organic hogs and raise organic small ruminants.\n\nBASIC COMPETENCIES\n(18 hours)\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Participate in\nworkplace\ncommunication\n1.1\nObtain and convey\nworkplace information.\n1.2 Complete relevant work\nrelated documents.\n1.3 Participate in workplace\nmeeting and discussion.\n\n•Group\ndiscussion\n• Interaction\n\n•Demonstration\n• Observation\n• Interviews/ques\ntioning\n2. Work in a team\nenvironment\n2.1\nDescribe and identify team\nrole and responsibility in a\nteam.\n2.2 Describe work as a team\nmember.\n\n•Discussion\n• Interaction\n\n•Demonstration\n• Observation\n• Interviews/\nquestioning\n3. Practice career\nprofessionalism\n3.1\nIntegrate personal\nobjectives with\norganizational goals.\n3.2 Set and meet work priorities.\n3.3 Maintain professional growth\nand development.\n\n•Discussion\n• Interaction\n\n•Demonstration\n• Observation\n• Interviews/\nquestioning\n4. Practice\noccupational\nhealth and safety\n4.1\nEvaluate hazard and risks\n4.2 Identify hazards and risks\n4.3 Control hazards and risks\n4.4 Maintain occupational health\nand safety awareness\n\n•Discussion\n• Plant tour\n• Symposium\n•Observation\n• Interview\n\n--- PDF PAGE 63 ---\nTR – Organic Agriculture Production NC II\n\n61\nCOMMON COMPETENCIES\n(64 hours)\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Apply safety\nmeasures in\nfarm operations\n1.1 Determine areas of concern\nfor safety measures\n1.2 Apply appropriate safety\nmeasures\n1.3 Safekeep/maintain/ dispose\ntools, materials and outfit.\n• Self-paced/\nmodular\n• Lecture/\nDiscussion\n• Interaction\n• Practical\nDemonstration\n• Visit/tour\n\n• Oral/Written\nInterviews\n• Direct\nObservation\n• Practical\nDemonstration\n2. Use farm tools\nand equipment\n2.1 Prepare and use farm tools\n2.2 Prepare and operate farm\nequipment\n2.3 Perform preventive\nmaintenance\nprocedures/practices\n• Self-paced/\nmodular\n• Lecture/\nDiscussion\n• Interaction\n• Practical\nDemonstration\n• Visit/tour\n\n• Oral/Written\nInterviews\n• Direct\nObservation\n• Practical\nDemonstration\n3. Perform\nestimation and\nbasic calculation\n3.1 Perform estimation\n3.2 Perform basic workplace\ncalculation\n• Self-paced/\nmodular\n• Lecture/\nDiscussion\n• Interaction\n• Practical\nExercise\n\n• Oral/Written\nexamination\n• Practical\nexercise\n4. Perform records\nkeeping\nCarry out inventory activities\n\nMaintain production record\n\nPrepare financial records\n• Self-paced/\nmodular\n• Lecture/\ndiscussion\n• Interaction\n• Practical\nexercise\n• Computation\n• Oral/written\nexamination\n• Practical\nexercise\n• Practical\ndemonstration\n\n5. Develop and\nUpdate Industry\nKnowledge\nSeek information on the industry\n\nUpdate continuously relevant\nindustry knowledge\n\n• Self paced/\nmodular\n• Demonstration\n• Small group\ndiscussion\n• Distance\neducation\n\n• Written/oral\nexamination\n• Practical\ndemonstration\n\n--- PDF PAGE 64 ---\nTR – Organic Agriculture Production NC II\n\n62\nCORE COMPETENCIES\n( 96 hours)\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1.Raise Organic\nChicken\n\n1.1\nSelect healthy stocks\n1.2\nDetermine suitable\nchicken house\nrequirements\n\n1.3 Install cage (housing)\nequipment\n\n1.4\nFeed chicken (Provide\nfeed and implement\nfeeding practices)\n\n1.5\nManage health and\ngrowth of chicken\n\n1.6\nHarvest chicken\n• Lecture\n• Hands-on\n• Demonstration\n• Video\nPresentation\n• Lecture\n• Lakbay Aral\n• Workshop\n\n• Written\nexamination\n• Demonstration\nof practical\nskills\n• Direct\nobservation\n• Interview/\nQuestioning\n\n2.Produce Organic\nVegetable\n\n2.1\nEstablish nursery\n\n2.2\nPlant seedlings\n\n2.3\nPerform Plant Care\nActivities (and\nManagement)\n\n2.4 Perform Harvest and Post\nHarvest Activities\n• Demonstration\n• Discussion\n• Oral\nquestioning\n• Video\npresentation\n• Field\ndemonstration\n• Film viewing\n\n• Direct\nobservation\nwith oral\nquestioning\n• Demonstration\n• Written exam\n• Interview\n\n3.Produce Organic\nFertilizer\n3.1\nPrepare composting area\n\n3.2\nPrepare raw materials\n\n3.3\nCarry out composting\nprocess\n\n3.4\nHarvest compost\n• Observation\n• Demonstration\n• Lecture-\nDiscussion\n• Film viewing\n• Video\npresentation\n• Field work/\nfarm visit\n\n• Direct\nobservation\nwith oral\nquestioning\n• Demonstration\nWritten exam\n4. Produce various\nconcoctions\n\n4.1\nPrepare for the production\nof various concoctions\n\n4.2\nProcess concoctions\n\n4.3 Package concoctions\n• Participatory\nLecture-\nDiscussion\n• Lecture\n• Demonstration\n• Direct\nobservation\n\n• Written exam\n• Direct\nobservation and\noral questions\n• Interview\n\n--- PDF PAGE 65 ---\nTR – Organic Agriculture Production NC II\n\n63\nELECTIVE COMPETENCIES\n( 54 hours)\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Raise Organic\nHogs\n\n1.1\nChoose/Select healthy\ndomestic hogs\n\n1.2\nDetermine suitable hog\nhouse requirements\n1.3\nFeed hogs\n1.4\nManage health and\ngrowth of hogs\n1.5\nFinish hogs\n• Lecture\n• Demonstration\n• Field\ndemonstration\n• Workshop\n• Video\npresentation\n• Field work\n• Practical\ndemonstration\n\n• Direct\nobservation\n• Oral\nquestioning\n• Written\nexamination\n• Interview\n\n2. Raise Organic\nSmall\nRuminants\n(Goat)\n\n2.1\nChoose/Select healthy\nbreeders\n\n2.2\nDetermine suitable small\nruminant cage (housing)\nrequirements\n\n2.3\nInstall cage (housing)\nrequirements\n\n2.4 Feed small ruminants\n\n2.5. Manage health, growth\nand breeding of small\nruminants\n\n2.6 Harvest (Finish)\nruminants\n• Actual\nDemonstration\n• Lecture\ndiscussion\n• Video\npresentation\n•\nField\npracticum\n\n• Direct\nobservation\nand questions\n• Written\nexaminations\n• Demonstration\nInterview\n\n--- PDF PAGE 66 ---\nTR – Organic Agriculture Production NC II\n\n64\nTRAINING DELIVERY\n\nThe delivery of training should adhere to the design of the curriculum. Delivery\nshould be guided by the 10 basic principles of competency-based TVET.\n\n•\nThe training is based on curriculum developed from the competency\nstandards;\n•\nLearning is modular in its structure;\n•\nTraining delivery is individualized and self-paced;\n•\nTraining is based on work that must be performed;\n•\nTraining materials are directly related to the competency standards and the\ncurriculum modules;\n•\nAssessment is based in the collection of evidence of the performance of\nwork to the industry required standard;\n•\nTraining is based both on and off-the-job components;\n•\nAllows for recognition of prior learning (RPL) or current competencies;\n•\nTraining allows for multiple entry and exit; and\n•\nApproved training programs are nationally accredited.\n\nThe competency-based TVET system recognizes various types of delivery\nmodes, both on and off-the-job as long as the learning is driven by the competency\nstandards specified by the industry. The following training modalities may be adopted\nwhen designing training programs:\n\n•\nThe dualized mode of training delivery is preferred and recommended.\nThus programs would contain both in-school and in-industry training or\nfieldwork components. Details can be referred to the Dual Training System\n(DTS) Implementing Rules and Regulations.\n•\nModular/self-paced learning is a competency-based training modality\nwherein the trainee is allowed to progress at his own pace. The trainer\nfacilitates the training delivery\n•\nPeer teaching/mentoring is a training modality wherein fast learners are\ngiven the opportunity to assist the slow learners.\n•\nSupervised industry training or on-the-job training is an approach in training\ndesigned to enhance the knowledge and skills of the trainee through actual\nexperience in the workplace to acquire specific competencies prescribed in\nthe training regulations.\n•\nDistance learning is a formal education process in which majority of the\ninstruction occurs when the students and instructor are not in the same\nplace. Distance learning may employ correspondence study, or audio,\nvideo or computer technologies.\n•\nProject-Based Instruction is an authentic instructional model or strategy in\nwhich students plan, implement and evaluate projects that have real world\napplications.\n\n--- PDF PAGE 67 ---\nTR – Organic Agriculture Production NC II\n\n65"
  },
