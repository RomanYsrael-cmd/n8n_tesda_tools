      "text": "9. The guidelines on assessment and certification are discussed in detail in the Procedures Manual on Assessment and Certification and Guidelines on the Implementation of the Philippine TVET Qualification and Certification System (PTQCS). --- PDF PAGE 76 --- TR – Organic Agriculture Production NC II 74 Supermarket of Competencies AGRI-FISHERY Sector Supermarket of Competencies AGRI-FISHERY Sector Raise organic chicken Produce organic vegetable Produce organic fertilizer Produce organic concoctions and extracts Apply Safely Measures in farm operations Use Farm Tools and Equipment Perform Estimation and Basic Calculation Work in a team environment Participate in workplace communication Practice career professionalism Practice occupational health and safety procedures Develop and update industry knowledge Perform record Raise organic hogs Raise organic small ruminants --- PDF PAGE 77 --- TR – Organic Agriculture Production NC II 75 Ad libitum feeding refers to the \"free-feeding\" weight of an animal, as opposed, for example, to the weight after a restricted diet or pair feeding. Agricultural inputs are all substances or materials used in the production or handling of organic agricultural products. Agricultural products are any agricultural commodity or product, whether raw or processed, including any commodity or product derived from the livestock for human or livestock consumption. Basal fertilizers are fertilizer which is apply near the base of the stems. Bedding materials are materials used to provide a bed for animals. Beneficial microorganisms are also known as harmless microorganisms. These are the microorganisms which are involved in the production of oxygen, biomass control and 'cleaning' the Earth of remnants of dead organisms. Biodynamics is a farming that combines organic methods, including crop rotation and composting with special plant, animal, and mineral preparations and the rhythmic influences of the sun, moon, planets, and stars. Bio-security measures is a set of preventive measures designed to reduce the risk of transmission of infectious diseases, quarantined pests, invasive alien species, living modified organisms. Boar is an uncastrated male swine usually kept for breeding. Breeder stock is a female livestock whose offspring may be incorporated for organic operation at the time of their birth. Breeds specific group of domestic animals or plants with a homogeneous appearance, behavior, and other characteristics that distinguish it from other animals or plants of the same species, and arrived at through selective breeding. Breeding is a selection of plants or animals to reproduce and/or further develop desired characteristics in succeeding generations. Broiler is any commercial meat type chicken usually raised up to six weeks of age. Brooder is an area used for raising young fowl that provides sufficient light and protection. --- PDF PAGE 78 --- TR – Organic Agriculture Production NC II 76 Brooding is a management practice where chicks are given extra heat and proper care and management. Brucellosis is also called as Bang's disease, Crimean fever, Gibraltar fever, Malta fever, Maltese fever, Mediterranean fever, rock fever, or undulant fever; it is a highly contagious zoonosis caused by ingestion of unsterilized milk or meat from infected animals or close contact with their secretions. Buck is the adult male of some animals, such as the deer, goat, antelope, or rabbit. It is an intact (still has testicals) male goat. Buffer zone is a clearly defined identifiable boundary are bordering any organic production site that is established to limit application or contact with prohibited substances. Cage Housing is a type or system of poultry housing where layers could be kept alone, by two or in big groups in cage. Colostrum is the first milk from a female animal after giving birth. Composting is the breaking down organic waste into humus that is reused as a beneficial nutrient can be done in several ways: vermicomposting, which is most beneficial for composting food waste; aerobic composting (with air); and anaerobic composting (without air). Compost is composed of organic matter that is recycled back into the earth. Organic matter may include lawn clippings, vegetable scraps from the kitchen, and untreated papers. These materials are combined and become a nutrient-rich mixture that enriches the soil. Concoctions is a combination of various ingredients, usually herbs, spices, condiments, powdery substances or minerals, mixed up together, minced, dissolved or macerated into a liquid so as they can be ingested or drunk. The term \"concoction\" is sometimes loosely used metaphorically in order to describe a cocktail or a motley assemblage of things, persons or ideas. Contamination is the pollution of organic product or land , in contact with any material that would render the product impure. Conventional agriculture is farming systems dependent on the input of artificial fertilizers and/or pesticides, or failing to conform to the Basic Standards in any other way. Conversion is the process of changing an agricultural system from conventional to organic. This covers of what is sometimes --- PDF PAGE 79 --- TR – Organic Agriculture Production NC II 77 known as transition. Crop rotation is the practice of alternating the species or families of annual and/or biennial crops grown on a specific field in a planned pattern or sequence so as to break weeds, pest and disease cycles and to improve soil fertility and organic matter content. Crossbreed is a group of animals produced by mating two or more different breeds or strains of animals. Cover cropping is a crop that provides temporary protection for delicate seedlings and/or provides a canopy for seasonal soil protection and improvement between normal crop-production periods. Except in orchards where permanent vegetative cover is maintained, cover crops are usually grown for one year or less. When plowed under and incorporated into the soil, cover crops are also referred to as green manure crops. Culling is the removal of undesirable or inferior animals in the herd based on important economic traits and overall performance. Depreciation cost is a term used to account for the loss of value in an item over time. Deworming (sometimes known as worming or drenching) is the giving of an anthelmintic drug (a wormer, dewormer, or drench) to an animal to rid it of intestinal parasites, such as roundworm and tapeworm. Disinfect is to reduce by physical or chemical means, the number of microorganism in the environment, to a level that does not compromise food safety or suitability. Doe is the adult female of some animals, such as the deer, goat, antelope, or rabbit use for breeding purposes. Dung is the organic material that is used to fertilize land, usually consisting of the faeces and urine of domestic livestock, with or without litter such as straw, hay, or bedding. Dry sow is a sow whose litter has been weaned but which has not yet been bred or is not pregnant. Estrus is a period of time when the female will accept male. Also known as heat period. Ewe is the adult female sheep. Enzymes are biological molecules that catalyze (i.e., increase the rates of) chemical reactions. In enzymatic reactions, the molecules at the beginning of the process, called substrates, are --- PDF PAGE 80 --- TR – Organic Agriculture Production NC II 78 converted into different molecules, called products. Feed materials is the straight feeding stuffs intended for feeding as such to animals and also feed ingredients intended for use in the manufacture of compound feeds. Fermentation in food processing typically is the conversion of carbohydrates to alcohols and carbon dioxide or organic acids using yeasts, bacteria, or a combination thereof, under anaerobic conditions. In simple terms, it is the chemical conversion of sugars into ethanol. Food additives is the enrichment, supplement or any other optional components added to a product, which affects it’s keeping quality, consistency, color, smell, taste or other organoleptic properties. Food grade quality refers to the minimum standard for substances to qualify as fit for human consumption or permitted to come in contact with food. Farrowing is the act of giving birth in pigs or swine. Feeds is any non-injurious edible material having nutrient value to animals. May be harvest or pasture forage, range, grain or other processed feed for livestock or game animals. Fertilizer is any organic or inorganic material of natural or synthetic origin (other than liming materials) that is added to a soil to supply one or more plant nutrients essential to the growth of plants. Forage is a vegetative material in a fresh, dried, or ensiled state (pasture, hay or silage) that is fed to livestock. Free range is of, relating to, or produced by animals, especially poultry, that have access to outside spaces and are permitted to graze or forage and range freely for food rather than being confined in an enclosure or feedlot as with free-range chickens. Sometimes, referred to as free-roaming. Conditions for the animals are also typically less crowded. Gait is a manner of walking or moving of foot. Germination test is a test that determines the maximum germination potential, or viability of the seed. Gestation Period refers to the period of carrying the young in the womb. Gilt is a young female hog that has not given birth yet. --- PDF PAGE 81 --- TR – Organic Agriculture Production NC II 79 Green manure is a crop that is incorporated into the soil for the purpose of soil improvement. Growth rate is a measure of the increase in size, mass or number of crops over a period of time. Habitat is the area over which a plant or animal species naturally exist, the area where a species occurs. e.g. seashore, riverbank, woodland, grassland, etc. Harrowing is breaking up and smoothing out the surface of the soil. Harvest is the process of gathering mature crops from the fields. Herbal medicine is actually products which is derived from a plant or plant part which are used for its scent, flavor or therapeutic properties. Also, herbal medicine products are dietary supplements that people take to improve their health. Inbreeding is the mating of closely related animals in a herd. Inter cropping is the growing two or more crops as a mixture in the same field at the same time. Intercropping can be one way of adding diversity to a crop system. Incubation refers to the development of the birds from the fertilized eggs to fully formed chicks. Ingredient is any substance, including a food additive, used in the manufacture or preparation of a food or present in the final product, although in a modified form. Irrigation is the artificial application of water to the land or soil. It is used to assist in the growing of agricultural crops, maintenance of landscapes, and revegetation of disturbed soils in dry areas and during periods of inadequate rainfall. Kidding/lambing is the act of a pregnant doe giving birth. Fish Amino Acid (FAA) is a liquid made from fish waste. FAA is of great value to both plants and microorganisms in their growth, because it contains an abundant amount of nutrients and various types of amino acids. Labeling is any written, printed or graphic presentation that is present on the label of a product accompanies the product or displayed near the product. Land preparation is a farm activity typically involves plowing, harrowing, and leveling the field to make it suitable for crop establishment. --- PDF PAGE 82 --- TR – Organic Agriculture Production NC II 80 Lactating describes the secretion of milk from the mammary glands and the period of time that a mother lactates to feed her young. Leptospirosis is a rare and severe bacterial infection that occurs when people are exposed to certain environment. Livestock refers to domestic animals kept for use on a farm and raised for sale and profit. Litter is the offsprings at one birth of a multiparous or animal like swine. Litter Size refers to the aggregate number of piglets per farrowing. Natural Calcium Phosphate Micro Nutrients (CALPHOS) buffered calcium phosphate solution for foliar application used to improve the quality, shelf life and storability of horticultural crops. Nutrients are food elements or substance found in the feeds such as protein, carbohydrates, fats and others. Microbe is a minute, often disease-causing organism. Mulching A protective covering, usually of organic matter such as leaves, straw, or peat, placed around plants to prevent the evaporation of moisture, the freezing of roots, and the growth of weeds. Organic in this text the word refers to the particular farming and processing systems described in these standards and not in the classical Chemical sense (the latter shall be clearly marked with a † for ease of identification). The term Organic is nearly synonymous in other languages to “biological” or “ecological.” Organic farming is more than agricultural production without the use of synthetic chemicals or genetically modified organisms, growth regulators, and livestock feed additives. Organic farming emphasizes on a holistic farm management approach, where rotations and animals play an integral role to the system. Organic farmer any farmer who uses organic farming methods. Organic feed animal feed produced organically. It should be produced on farm, but it may also be imported. The recommended objective to produce feed on farm remains a challenge in organic livestock and aquaculture production. Organic waste is anything that comes from plants or animals that is biodegradable. --- PDF PAGE 83 --- TR – Organic Agriculture Production NC II 81 Organic agriculture as an ecological production management system that promotes and enhances biodiversity, biological cycles, and soil biological activity. It is based on minimal use of off-farm inputs and on management practices that restore, maintain, or enhance ecological harmony. Organoleptic refers to any sensory properties of a food or other products, including taste, colour, odour and texture. Pasture land use for livestock grazing that is managed to provide feed value and maintain or improve soil, water and vegetative resources. Permaculture (permanent+agriculture) is the conscious design and maintenance of agriculturally productive ecosystems which have the diversity, stability,and resilience of natural ecosystems. It is a land use and community building movement which strives for the harmonious integration of human dwellings, microclimate, annual and perennial plants, animals, soils, and water into stable, productive communities. The focus is not on these elements themselves, but rather on the relationships created among them by the way we place them in the landscape. Integrated Pest management is a broad based approach that integrates a range of practices for economic control of pests. Predators organism which hunts and eats other organisms. These include both carnivores, which eat animals, and herbivores, which eat plants. Plowing in farming for initial cultivation of soil in preparation for sowing seed or planting. Post-harvesting is the stage of crop production immediately following harvest, including cooling, cleaning, sorting and packing. The instant a crop is removed from the ground, or separated from its parent plant, it begins to deteriorate. Post-harvest treatment largely determines final quality, whether a crop is sold for fresh consumption, or used as an ingredient in a processed food product. Potting media is a medium in which to grow plants, herbs and vegetables in a pot or other durable container. Poultry a collective term for birds used either for breeding, egg production, meat production and recreation. Production means the operations undertaken to supply agricultural --- PDF PAGE 84 --- TR – Organic Agriculture Production NC II 82 products in the state in which they occur on the farm, including initial packaging and labelling of the product. Production cost combined costs of raw material and labor incurred in producing goods. Purebreeding is the mating of the unrelated individuals in the same breed. Putrification process is also known as decomposition, which is the breakdown or decay of organic materials. Ram is an intact (still has testicals) male sheep, used for breeding. Rapid composting method is composting method which apply new, different procedures and materials to speed up the process. Ration the total amount of feeds taken in by an animal during a 24 hour period. Raw materials all ingredients other than additives. Rooster a matured male poultry used for breeding. Rotavator a type of machine with rotating blades that break up soil. Ruminants refers to animals with complex digestive system e.g. cattle, carabao, goats and sheep. Seedbed or seedling bed is the local soil environment in which seeds are planted. Often it comprises not only the soil but also a specially prepared cold frame, hotbed or raised bed used to grow the seedlings in a controlled environment into larger young plants before transplanting them into a garden or field. A seedling bed is used to increase the number of seeds that germinate. Seedlings is a young plant sporophyte developing out of a plant embryo from a seed. Seedling development starts with germination of the seed. A typical young seedling consists of three main parts: the radicle (embryonic root), the hypocotyl (embryonic shoot), and the cotyledons (seed leaves). Selection refers to the process of choosing males and females with desirable characteristics either for breeding or replacement stocks. Simple stomach/non- ruminant animals animals that possess simple digestive system e.g. poultry, horse and pigs. Sow a mature female hog that had given birth. --- PDF PAGE 85 --- TR – Organic Agriculture Production NC II 83 Stag a male swine castrated after sexual maturity. Standards are norms ,sets of guidelines, requirements and principles that are used as in organic agriculture and processing. The term “standards” as used here refers to Philippine National Standards relevant to local agroecosystems production. Surface irrigation system is defined as the group of application techniques where water is applied and distributed over the soil surface by gravity. It is by far the most common form of irrigation throughout the world and has been practiced in many areas virtually unchanged for thousands of years. Swine a collective term for hogs. Tail wagging is a behavior that may function as both attractivity and proceptivity. It is one of the signs of estrus exhibited by females; high rates of tail wagging would arouse males, increasing sexual performance. Waterer equipment used in providing water to animals. Weaning refers to a young animal of either sex which has been separated from the mother at the end of the lactation period. Weeding to clear or remove weeds. Vermicomposting the process of using earthworms to breakdown kitchen and garden waste, to create a faster than normal composting; to be précised the product is called vermicompost (or worm compost). Vibriosis in cattle is an infectious bacterial (Campylobacter fetus) disease of the genital tract causing infertility and occasional abortions. It is a venereal disease spread by infected bulls when they mate susceptible cows and heifers. It is considered to be the most important cause of infertility in cattle. --- PDF PAGE 86 --- TR – Organic Agriculture Production NC II 84 The Technical Education and Skills Development Authority (TESDA) wishes to extend gratitude and appreciation to the many representatives of business, industry, academe and government agencies who donated their time and expertise to the development and validation of these Training Regulations. THE TECHNICAL EXPERT PANEL (TEP) MR. REY R. PEDROSO Member National Organic Agriculture Board MR. EDWIN MARTHINE O. LOPEZ Member National Organic Agriculture Board COL. ALEJANDRO T. E