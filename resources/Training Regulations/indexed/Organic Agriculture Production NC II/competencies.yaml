irements\n2.2\nCompost is monitored based PNS indicators of\nfully decomposed fertilizer\n2.3\nQuality of harvest is checked based on PNS\nindicators of fully decomposed fertilizer\n2.4\nProcessing of compost fertilizer are carried- out\nbased on production requirement.\n2.5\nRecord keeping is performed according to\nenterprise procedure.\n\n--- PDF PAGE 44 ---\nTR – Organic Agriculture Production NC II\n\n42\nRANGE OF VARIABLES\n\nVARIABLE\nSCOPE\n1. Prepare raw\nmaterials\n1.1\nShred/cut materials\n1.2\nWeighing\n2. Composting\nmethods\n2.1. Rapid composting methods\n2.2. Double dug composting\n2.3. Six month composting\n2.4. Substrate composting\n3. Process compost\nfertilizer\n3.1\nCollection\n3.2\nAir drying\n3.3\nSieving\n3.4\nBagging\n3.5\nLabeling\n3.6\nStoring\n\n--- PDF PAGE 45 ---\nTR – Organic Agriculture Production NC II\n\n43\nEVIDENCE GUIDE\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nPrepared composting area\n1.2\nCarried out preparation of raw materials\n1.3\nCarried out composting process\n1.4\nHarvested organic fertilizer\n2. Required\nKnowledge and\nAttitudes\n\n2.1. Knowledge, Theory, Practices and Systems Operations\n2.1.1.\nCharacteristics of composting site\n2.1.2.\nGood drainage systems\n2.1.3.\nAvailability and accessibility of site\n2.1.4.\nArea with minimum contamination\n2.1.5.\nTypes of soil\n2.1.6.\nArea with minimal sunlight\n2.1.7.\nLeveling of the site\n2.1.8.\nDetermine volume of production\n2.1.9.\nDesign layout based on composting method\n2.1.10. Types of raw materials\n2.1.11. Preparing bed\n2.1.12. Composting methods\n2.1.13. Harvesting and storing of organic fertilizer\n2.1.14. Record keeping\n2.1.15. Practice 3Rs and 5S\n2.1.16. Parts and functions of specific tools and farm\nimplements use in manufacturing organic fertilizer\n2.1.17. Program of work activities are implemented as\nscheduled\n2.2. Communication\n2.2.1.\nPrepare and submit required reports\n2.2.2.\nRecord keeping a