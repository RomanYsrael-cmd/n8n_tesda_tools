ursery \n \nHarvesting equipment \n \nIrrigation system (sprinkler, mist/ drip irrigation) \n \nMower (grass cutter) \n \nOver head projector (OHP) \n \nPortable chain saw \n \nPost-Harvest treatment equipment \n \nPower sprayer  \n \nRotavator \n \nService vehicle \n \nSorting equipment \n \nSpike tooth harrow \n \nStorage room \n \nSurface irrigation system \n5.1.2 Tools and instruments such as: \n \nBolos \n \nBroomstick \n \nCalculator \n \nContainer \n \nCutting tools \n \nDigging tools \n \nDrying meter \n \nFruit crate \n \nHarvesting tools  \n \nHat \n \nKnapsack sprayer  \n \nKnife \n \nLight hoe \n \nMoisture meter \n \nPetri-dish \n \npH meter \n \nPick mattock \n \nPicking knife \n \nPlow \n \nPlumbing tools \n \nPost-Harvest treatment tools  \n \nProtective gadgets \n \nPruning shears \n \n5.1.3 Supplies and Materials such as: \n \nAgri bags, plastic \n \nBamboo stick \n \nBasket \n \nBond paper \n \nCatching nets \n \nClips  \n \nCoconut dust\n\n--- PDF PAGE 42 ---\nTR – Organic Agriculture Production NC II \n \n40\n \nCompost \n \nFertilizers \n \nFirst aide supplies/ medicine  \n \nFlower inducer  \n \nFungicides \n \nGloves \n \nGrowing media (garden soil, sewed sand, compost, soil, \nmanure and sawdust/rice) \n \nKilling bottles \n \nMarking pens \n \nMasks \n \nMulching material \n \nHair nets \n \nPackaging materials, assorted \n \nPail \n5.2. All workers involved in different activities must be fully \noriented and cautioned on the different specific work \nactivities of the farm \n5.3. Technical supervisors should have skills and ability in \nthe successful implementation of work program activities\n6. Context of Assessment\n6.1. Assessment may occur in an appropriately simulated \nenvironment through TESDA accredited assessment \ncenters",
