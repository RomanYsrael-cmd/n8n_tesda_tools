      "source_text": "TRAINING REGULATIONS FOR MANUAL METAL ARC WELDING (MMAW) NC II"
    },
    {
      "source_text": "SECTION 1 MANUAL METAL ARC WELDING (MMAW) NC II QUALIFICATION"
    },
    {
      "source_text": "The Manual Metal Arc Welding (MMAW) NC II Qualification consists of competencies that a person must achieve to weld carbon steel plates and pipe components as specified drawings, welding procedure specification or oral instructions using MMAW process. MMAW is also known as Shielded Metal Arc Welding (SMAW)."
    },
    {
      "source_text": "This Qualification conforms with the latest edition of ISO 9606-1: Qualification testing of welders — Fusion welding — Part 1: Steels, AWS D 1.1 Structural Welding Code- Steel; ASME IX (Boiler and Pressure Vessel Code) Welding, Brazing, and Fusing Qualifications; and Asian Welding Federation- Common Welders Certification Scheme (AWF-CWCS)."
    },
    {
      "source_text": "This Qualification is packaged from the competency map of the Metals and Engineering Sector as shown in Annex A."
    },
    {
      "source_text": "The units of competency comprising this qualification include the following:"
    },
    {
      "source_text": "CODE NO. BASIC COMPETENCIES"
    },
    {
      "source_text": "400311210 Participate in workplace communication 400311211 Work in a team environment 400311212 Solve/address general workplace problems 400311213 400311214 400311215 400311216 400311217 400311218"
    },
    {
      "source_text": "Develop career and life decisions Contribute to workplace innovation Present relevant information Practice occupational safety and health policies and procedures Exercise efficient and effective sustainable practices in the workplace Practice entrepreneurial skills in the workplace"
    },
    {
      "source_text": "CODE NO. COMMON COMPETENCIES MEE721202 Interpret Drawings and Sketches MEE721210 Perform Basic Workshop Measurements & Computations MEE721211 Contribute to Quality System MEE721205 Use Hand Tools MEE721212 Prepare Materials and Consumables Interpret Drawings and Sketches Perform Basic Workshop Measurements & Computations Contribute to Quality Management System Use Hand Tools Prepare Materials and Consumables"
    },
    {
      "source_text": "CODE NO. MEE721321 MEE721322 MEE721324"
    },
