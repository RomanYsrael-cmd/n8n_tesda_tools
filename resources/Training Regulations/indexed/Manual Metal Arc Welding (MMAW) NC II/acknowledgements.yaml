    },
    {
      "source_text": "bend test A destructive testing method that calls for a test specimen taken from a test coupon to be bent to a specified bend radius. This test is used to evaluate the soundness and ductility of the welded joint"
    },
    {
      "source_text": "break test A destructive testing method in which a fillet weld test is loaded so that the weld root is in tension until it breaks. Once broken, soundness of the welded joint is evaluated by examining the fractured surface for incomplete fusion, porosity, and other internal discontinuities. This test is primarily used for welders qualification."
    },
    {
      "source_text": "discontinuity An interruption of the typical structure of a material, such as lack of homogeneity in its mechanical, metallurgical or physical characteristics. A discontinuity is not necessarily a defect."
    },
    {
      "source_text": "destructive is undertaken in order to understand a specimen’s performance testing (DT) or material behavior. These procedures are carried out to the test specimen’s failure. DT methods are commonly used for materials characterization, fabrication validation, failure investigation, and can form a key part of engineering critical assessments."
    },
    {
      "source_text": "fillet weld A weld of approximately triangular cross section joining two surfaces approximately at right angles to each other in a lap joint, T-joint, or corner joint."
    },
    {
      "source_text": "jig (aka: Fixture) A device designed to hold and maintain parts in proper relation to each other. Jig and fixture have essentially the same meaning. They both function to facilitate assembly of parts and to hold a work piece assembly in proper alignment and position during handling and welding."
    },
