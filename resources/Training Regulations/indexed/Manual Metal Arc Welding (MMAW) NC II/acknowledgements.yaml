1 Promulgated (9/14/2021) 95\n\nSECTION 4 ASSESSSMENT AND CERTIFICATION ARRANGEMENT\n\nCompetency Assessment is the process of collecting evidence and making\njudgments whether competency has been achieved. The purpose of assessment\nis to confirm that an individual can perform to the standards expected at the\nworkplace as expressed in relevant competency standards.\nThe assessment process is based on evidence or information gathered to\nprove achievement of competencies. The process may be applied to an\nemployable unit(s) of competency in partial fulfillment of the requirements of the\nnational qualification.\n\n4.1 NATIONAL ASSESSMENTAND CERTIFICATION ARRANGEMENTS\n\n4.1.1 A National Certificate (NC) is issued when a candidate has\ndemonstrated competence on all unit/s of competency in a\nqualification with a promulgated Training Regulations.\n\n4.1.2 Individuals wanting to be certified will have to be assessed in\naccordance with the requirements identified in the evidence guide of\nthe relevant unit/s of competency.\n\n4.1.3 The\nindustry\nshall\ndetermine\nassessment\nand\ncertification\nrequirements for each qualification with promulgated Training\nRegulations: It includes the following:\n\na. Entry requirements for candidates\nb. Evidence gathering methods\nc. Qualification requirements of competency assessors\nd. Specific assessment and certification arrangements as identified by\nindustry\n\n4.1.4 Recognition of Prior Learning (RPL). Candidates who have gained\ncompetencies through informal training, previous work and/or life\nexperiences may apply for recognition in a particular qualification\nthrough competency assessment:\n\n4.1.5 For all Shielded Metal Arc Welding NC II holder, the individual/holder\nwill have to undergo assessment in the amended TR for Manual\nMetal Arc Welding (MMAW) NC II.\n\n--- PDF PAGE 100 ---\nManual Metal Arc Welding (MMAW) NC II – MEEMAW221 Promulgated (9/14/2021) 96\n\n4.2 COMPETENCY ASSESSMENT REQUISITE\n4.2.1 Self-Assessment Guide. The self-assessment guide (SAG) is\naccomplished by the candidate prior to actual competency\nassessment. SAG is a pre-assessment tool to help the candidate\nand the assessor determine what evidence is available, where gaps\nexist, including readiness for assessment.\n\nThis document can:\na.\nIdentify the candidate’s skills and knowledge\nb.\nHighlight gaps in candidate’s skills and knowledge\nc.\nProvide critical guidance to the assessor and candidate on the\nevidence that need to be presented\nd.\nAssist the candidate to identify key areas in which practice is\nneeded or additional information or skills that should be gained\nprior `\n4.2.2 Accredited\nAssessment\nCenter.\nOnly Assessment\nCenter\naccredited by TESDA is authorized to conduct competency\nassessment. Assessment centers undergo a quality assured\nprocedure for accreditation before they are authorized by TESDA to\nmanage the assessment for National Certification.\n4.2.3 Accredited Competency Assessor. Only accredited competency\nassessor is authorized to conduct assessment of competence.\nCompetency assessors undergo a quality assured system of\naccreditation procedure before they are authorized by TESDA to\nassess the competencies of candidates for National Certification.\n\n--- PDF PAGE 101 ---\nManual Metal Arc Welding (MMAW) NC I – MEEMAW221 Promulgated (9/14/2021)\n97\n\nANNEX A\n\nReceive and\nrespond to\nworkplace\ncommunication\nWork with\nothers\nSolve/address\nroutine\nproblems\nEnhance\nself-\nmanagement\nskills\nSupport\nInnovation\nAccess and\nmaintain\ninformation\nFollow\noccupational\nsafety and\nhealth\npolicies and\nprocedures\nApply\nenvironmental\nwork\nstandards\nAdopt\nentrepreneurial\nmindset in the\nworkplace\nParticipate in\nworkplace\ncommunication\nWork in\nTeam\nEnvironment\nSolve/address\ngeneral\nworkplace\nproblems\nDevelop\ncareer and\nlife decisions\nContribute to\nworkplace\ninnovation\nPresent\nrelevant\ninformation\nPractice\noccupational\nsafety and\nhealth policies\nand\nprocedures\nExercise\nefficient and\neffective\nsustainable\npractices in the\nworkplace\nPractice\nentrepreneurial\nskills in the\nworkplace\nLead workplace\ncommunication\nLead small\nteams\nApply critical\nthinking and\nproblem-\nsolving\ntechniques in\nthe workplace\n\nWork in a\ndiverse\nenvironment\nPropose\nmethods of\napplying\nlearning and\ninnovation in\nthe\norganization\nUse\ninformation\nsystematically\nEvaluate\noccupational\nsafety and\nhealth work\npractices\n\nEvaluate\nenvironmental\nwork practices\n\nFacilitate\nentrepreneurial\nskills for micro-\nsmall-medium\nenterprises\n(MSMEs)\n\nCOMPETENCY MAP –\nMETALS AND ENGINEERING SECTOR\n MANUAL METAL ARC WELDING (MMAW) NC I\n\nBASIC COMPETENCIES\n\n--- PDF PAGE 102 ---\nManual Metal Arc Welding (MMAW) NC I – MEEMAW221 Promulgated (9/14/2021)\n98\n\nUtilize\nspecialize\nspecialized\ncommunication\nskill\nDevelop\nand lead\nteams\nPerform higher\norder thinking\nprocesses and\napply\ntechniques in\nthe workplace\nContribute\nto the\npractice of\nsocial\njustice in the\nworkplace\nManage\ninnovative\nwork\ninstructions\nManage and\nevaluate\nusage of\ninformation\nLead in\nimprovement of\nOccupational\nSafety and Health\nProgram, Policies\nand Procedures\nLead towards\nimprovement of\nenvironmental\nwork programs,\npolicies and\nprocedures\nSustain\nentrepreneurial\nskills\nManage and\nsustain\neffective\ncommunication\nstrategies\nManage\nand sustain\nhigh\nperforming\nteams\nEvaluate higher\norder thinking\nskills and adjust\nproblem solving\ntechniques\nAdvocate\nstrategic\nthinking for\nglobal\ncitizenship\nIncorporate\ninnovation\ninto work\nprocedures\nDevelop\nsystems in\nmanaging,\nand\nmaintaining\ninformation\nManage\nimplementation of\nOSH programs in\nthe workplace\nManage\nimplementation\nof\nenvironmental\nprogram in the\nworkplace\nDevelop and\nsustain a high-\nperforming\nenterprise\nInterpret\ndrawings\nand sketches\n\nPerform basic\nworkshop\nmeasurements &\ncomputations\n\nContributes to\nquality\nmanagement\nsystem\n\nUse hand\ntools\n\nPrepare\nmaterials and\nconsumables\n\nCOMMON COMPETENCIES\n\nBASIC COMPETENCIES\n\n--- PDF PAGE 103 ---\nManual Metal Arc Welding (MMAW) NC I – MEEMAW221 Promulgated (9/14/2021)\n99\n\nWeld carbon\nsteel plates\nusing MMAW\n\nWeld carbon\nsteel plates\nusing GMAW\n\nWeld carbon\nsteel pipes\nusing GMAW\n\nWeld carbon\nsteel plates\nusing GTAW\n\nWeld carbon\n steel pipes\nusing GTAW\n\nWeld carbon\nsteel plates\nusing FCAW\n\nWeld carbon\nsteel pipes\n using FCAW\n\nPrepare/ fit up\nwelding joints\n\nWeld alloy\nsteel plates\nusing GMAW\n\nWeld alloy\nsteel pipes\nusing GMAW\n\nWeld alloy steel\nplates using\nGTAW\n\nWeld alloy steel\npipes using\nGTAW\n\nWeld alloy\nsteel plates\nusing FCAW\n\nWeld alloy\nsteel pipes\n using FCAW\n\nSet up welding\nequipment\n\nWeld carbon\nsteel plates and\npipes\nusing MMAW\n\nWeld alloy steel\nplates using\nMMAW\n\nWeld alloy steel\npipes using\nMMAW\n\nPerform gas\nwelding in\ncarbon steel\nplates and tubes\n\nPerform gas\nwelding in alloy\nsteel plates\nand tubes\n\nWeld plates\nusing SAW\n\nCORE COMPETENCIES\n\n--- PDF PAGE 104 ---\nManual Metal Arc Welding (MMAW) NC I – MEEMAW221 Promulgated (9/14/2021) 100\n\nGLOSSARY OF TERMS\n\n base metal\n (aka: parent metal) the metal that is to be worked, cut or welded\n\nbead\n\n a weld deposit resulting from a single welding pass\n\nbend test\nA destructive testing method that calls for a test specimen taken from\na test coupon to be bent to a specified bend radius. This test is used\nto evaluate the soundness and ductility of the welded joint\n\nbreak test\nA destructive testing method in which a fillet weld test is loaded so\nthat the weld root is in tension until it breaks. Once broken, soundness\nof the welded joint is evaluated by examining the fractured surface for\nincomplete fusion, porosity, and other internal discontinuities. This test\nis primarily used for welders qualification.\n\n discontinuity\n An interruption of the typical structure of a material, such as lack\nof homogeneity in its mechanical, metallurgical or physical\ncharacteristics. A discontinuity is not necessarily a defect.\n\ndestructive\nis undertaken in order to understand a specimen’s performance\ntesting (DT)\nor material behavior. These procedures are carried out to the test\nspecimen’s failure. DT methods are commonly used for materials\ncharacterization, fabrication validation, failure investigation, and can\nform a key part of engineering critical assessments.\n\nfillet weld\n A weld of approximately triangular cross section joining two\n surfaces approximately at right angles to each other in a lap joint,\n T-joint, or corner joint.\n\njig\n(aka: Fixture) A device designed to hold and maintain parts in proper\nrelation to each other. Jig and fixture have essentially the same\nmeaning. They both function to facilitate assembly of parts and to hold\na work piece assembly in proper alignment and position during\nhandling and welding.\n\njoint\n The junction of members or the edges of the base metal that are\n\n to be joined or have been joined by welding\n\nliquid\n A non-destructive testing method in which a penetrating agent is\npenetrant used to detect weld defects and other possible flaws in\ntesting (PT)\n non-magnetic and non-porous material\n\n--- PDF PAGE 105 ---\nManual Metal Arc Welding (MMAW) NC II – MEEMAW221 Promulgated (9/14/2021)\n\n101\nMMAW\n (A.k.a SMAW) An arc welding process with an arc between a\n\n covered electrode and the weld pool. The process is used with\n\n shielding from the decomposition of the electrode covering,\n\n without the application of pressure, and with filler metal from the\n\n electrode.\n\nnon-destructive is a testing and analysis technique used by the industry to\ntesting (NDT) evaluate the properties of a material, component, structure or\n system for characteristic differences or welding defects and\n\n discontinuities without causing damage to the original part.\n\nOccupational\n refers to a set of rules issued by DOLE which mandates\nSafety the adoption and use of appropriate practices, means,\nand Health\n methods, reasonably standards operations or processes, and\n(OSH) working conditions necessary to ensure safe and healthful\n employment.\n\nquiver\n (Aka:portable oven, hotbox) . A temperature controlled electrode\n container used during welding in order to maintain the required\n holding temperature after baking. This ensures electrode\n drynessbefore use and prevents moisture absorption in the flux\n covering due to humidity conditions\n\n shearing\n are multipurpose devices used in the cutting of alloys and other\n\nmachine\n sheet metal. Some shearing machines use a scissor-like,\n\n angular shear action to cut metal into sheets or strips. Other,\n\n larger machines use a straight shear action with the blade\n\n fixed at an angle as opposed to the angular movement.\n\nvisual\n when an object is inspected by the eye directly.\ninspection\n\nweld defects\n A discontinuity or discontinuities accumulated effect that render\n\n a welded part or product unable to meet minimum applicable\n acceptance standard or specification.\n\nwelding\n A joining process that causes materials to fuse and merge by\n heating them to the welding temperature, with or without the\n application of pressure or by the application of pressure alone,\n and with or without using filler metal.\n\n welding A component of the welding circuit through which current is run\n\nelectrode and that ends at the arc, in a molten conductive slag, or in the\n\n base metal. The flux covered consumable filler in MMAW/SMAW\n\n welding torch a gas mixing and burning tool for the welding of metals\n\nweldment\n an assembly or structure whose component parts are joined\n by welding\n\n--- PDF PAGE 106 ---\nManual Metal Arc Welding (MMAW) NC II – MEEMAW221 Promulgated (9/14/2021)\n\n102\nWelding\n A document providing the required welding variables for a\nProcedure\n specific application to assure repeatability by properly trained\nSpecification\n welders and welding operators.\n (WPS)\n\n--- PDF PAGE 107 ---\nManual Metal Arc Welding (MMAW) NC II – MEEMAW221 Promulgated (9/14/2021)\n\n103\nREFERENCES:\n\n1.\nTraining Regulations for Shielded Metal Arc Welding (SMAW) NC II\n2.\nAsian Welding Federation (AWF) - Common Welder Certification\nScheme (CWCS); aligned to ISO 9606-1 Standard\n3.\nISO 9606-1: Qualification testing of welders — Fusion welding — Part 1:\nSteels\n4.\nAWS D 1.1 Structural Welding Code- Steel\n5.\nASME IX (Boiler and Pressure Vessel Code) Welding, Brazing, and\nFusing Qualifications\n\n--- PDF PAGE 108 ---\nManual Metal Arc Welding (MMAW) NC II – MEEMAW221 Promulgated (9/14/2021)\n\n104\nACKNOWLEDGMENTS\n\nThe Technical Education and Skills Development Authority (TESDA) wishes to\nextend thanks and appreciation to the many representatives of business, industry, academe\nand government agencies who donated their time and expertise to the development and\nvalidation of this Training Regulations.\n\nTHE TECHNICAL AND INDUSTRY EXPERT REVIEW PANEL\n\nGERALD S. GALLARDO\nPresident\nCIFRA Industrial Services Corporation\nNo. 4229 Gen. Mojica\nMakati City\nREYNALDO L. DELA CRUZ, JR.\nChief Industrial Training Section\nMetals Industry & Research Development\nCenter\nGeneral Santos Avenue\nBicutan Taguig City\n\nSESINANDI C. ABULENCIA\nVice President- Operations\nWelders Testing Laboratories\n24th Floor Trident Tower,\n312 Sen. Gil J. Puyat Avenue\nMakati City\nEDRALIN C. ICABALES\nBoard of Trustees\nPhilippine Welding Society\nDOST-MIRDC Compound, Gen. Santos Ave.,\nTaguig City\n\nFERNANDO M. OPEDA\nExecutive Director\nPhilippine Welding Society\nDOST-MIRDC Compound, Gen. Santos Ave.,\nTaguig City\nDOMINADOR C. ELEAZAR, JR.\nSupervising Officer\nPhilippine Welding Society\nDOST-MIRDC Compound, Gen. Santos Ave.,\nTaguig City\n\n--- PDF PAGE 109 ---\nManual Metal Arc Welding (MMAW) NC II – MEEMAW22