ture-\nDiscussion\n• Demonstration\n• Practical\n application\n\n• Observation\n• Demonstration\nand oral\nquestioning\n• Written test\n\n• 2 Hours\n\n5.5 Prepare welding consumables\n•\nDetermine proper\nPPE in\naccordance with\nsafety standards\n•\nKnow and Identify\nwelding safety\nhazards\n•\nKnow how to\nselect and prepare\nproper welding\nconsumables.\n• Lecture-\nDiscussion\n• Demonstration\n• Practical\n application\n\n• Observation\n• Demonstration\nand oral\nquestioning\n• Written test\n\n• 2 Hours\n\n--- PDF PAGE 88 ---\nManual Metal Arc Welding (MMAW) NC II – MEEMAW221 Promulgated (9/14/2021) 84\n\nCORE COMPETENCIES\n(181 HOURS)\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n1. Set-up Welding\nEquipment\n1.1 Set up welding machine\n\n• Explain and demonstrate\nhow to set-up welding\nequipment.\n• Explain and demonstrate\nhow to set-up welding\naccessories.\n• Explain and demonstrate\nhow to set-up welding\npositioners, jigs and\nfixtures.\n• Lecture\nDiscussion\n• Demonstration\n• Practical\n application\n\n• Observation\nand oral\nquestioning\n• Demonstration\nand oral\nquestioning\n• Written test\n• 2 Hours\n\n1.2 Set up welding accessories\n\n• Explain and demonstrate\nhow to set-up welding\nequipment.\n• Explain and demonstrate\nhow to set-up welding\naccessories.\n• Explain and demonstrate\nhow to set-up welding\npositioners, jigs and\nfixtures.\n• Lecture\nDiscussion\n• Demonstration\n• Practical\n application\n\n• Observation\nand oral\nquestioning\n• Demonstration\nand oral\nquestioning\n• Written test\n• 1 Hour\n\n1.3 Set up welding positioners,\njigs and fixtures\n\n• Explain and demonstrate\nhow to set-up welding\nequipment.\n• Explain and demonstrate\nhow to set-up welding\naccessories.\n• Explain and demonstrate\nhow to set-up welding\npositioners, jigs and fixtures.\n• Lecture\nDiscussion\n• Demonstration\n• Practical\n application\n\n• Observation\nand oral\nquestioning\n• Demonstration\nand oral\nquestioning\n• Written test\n• 1 Hour\n\n--- PDF PAGE 89 ---\nManual Metal Arc Welding (MMAW) NC II – MEEMAW221 Promulgated (9/14/2021) 85\n2. Prepare / Fit up\nWelding Joints\n2.1 Set-up root opening and\n alignment\n\n• Explain and demonstrate\nhow to set-up root opening\nand alignment.\n• Obtain tack welds.\n• Explain and obtain correct\nfitted welding joints\n• Lecture-\nDiscussion\n• Demonstration\n• Practical\n application\n\n• Observation\nand oral\nquestioning\n• Demonstration\nand oral\nquestioning\n• Written test\n• 4Hours\n\n2.2 Perform tack welding\n\n• Explain and demonstrate\nhow to set-up root opening\nand alignment.\n• Obtain tack welds.\n• Explain and obtain correct\nfitted welding joints\n• Lecture-\nDiscussion\n• Demonstration\n• Practical\n application\n\n• Observation\nand oral\nquestioning\n• Demonstration\nand oral\nquestioning\n• Written test\n• 8 Hours\n\n2.3 Set-up fitted welding joints\n\n• Explain and demonstrate\nhow to set-up root opening\nand alignment.\n• Obtain tack welds.\n• Explain and obtain correct\nfitted welding joints\n• Lecture-\nDiscussion\n• Demonstration\n• Practical\n application\n\n• Observation\nand oral\nquestioning\n• Demonstration\nand oral\nquestioning\n• Written test\n• 4 Hours\n3. Weld Carbon\nSteel Plates and\nPipes Using\nMMAW\n3.1 Perform root passes in\ndifferent positions-\n PF(3G), PE(4G)-Plate,\n PA(1G), PC(2G),PH(5G),H-\nLO45(6G) -Pipe\n\n• Explain and obtain root\npasses in different positions\nin accordance to welding\ncodes and standards.\n\n• Lecture-\nDiscussion\n• Demonstration\n• Practical\n application\n\n• Observation\nand oral\nquestioning/\nInterview\n• Demonstration\nand oral\nquestioning/\nInterview\n• Written test\n• Nondestructiv\ne Testing\n(NDT) of test\ncoupon\n\n• 48 Hours\n\n3.2 Perform subsequent fill\npasses in different\npositions-\n• Explain and obtain\nsubsequent fill passes in\ndifferent positions in\n• Lecture-\nDiscussion\n• Demonstration\n• Observation\nand oral\nquestioning/\n• 57 Hours\n\n--- PDF PAGE 90 ---\nManual Metal Arc Welding (MMAW) NC II – MEEMAW221 Promulgated (9/14/2021) 86\n PF(3G), PE(4G)-Plate,\n PA(1G), PC(2G),PH(5G),\nH-LO45(6G) -Pipe\n\naccordance to welding\ncodes and standards.\n\n• Practical\n application\n\nInterview\n• Demonstration\nand oral\nquestioning/\nInterview\n• Written test\n• Nondestructiv\ne Testing\n(NDT) of test\ncoupon\n\n3.3 Perform capping in different\npositions- PF(3G), PE(4G)-\nPlate, PA(1G),\nC(2G),PH(5G), H-LO45(6G)\n-Pipe\n\n• Explain and obtain\ncapping in different\npositions in accordance to\nwelding codes and\nstandards.\n\n• Lecture-\nDiscussion\n• Demonstration\n• Practical\n application\n\n• Observation\nand oral\nquestioning/\nInterview\n• Demonstration\nand oral\nquestioning/\nInterview\n• Written test\n• Nondestructiv\ne Testing\n(NDT) of test\ncoupon\n\n• 48 Hours\n\n3.4 Perform final visual\nInspection in all test coupon\nin different positions\n• Explain and obtain final\nvisual Inspection in different\npositions in accordance to\nwelding codes and\nstandards.\n\n• Lecture-\nDiscussion\n• Demonstration\n• Practical\n application\n\n• Observation\nand oral\nquestioning/\nInterview\n• Demonstration\nand oral\nquestioning/\nInterview\n• Written test\n• Nondestructiv\ne Testing\n(NDT) of test\ncoupon\n\n• 8 Hours\n\n--- PDF PAGE 91 ---\nManual Metal Arc Welding (MMAW) NC I – MEEMAW221 Promulgated (9/14/2021) 87",
