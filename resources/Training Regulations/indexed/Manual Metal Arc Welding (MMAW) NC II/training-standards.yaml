  "source_section_text": "SECTION 3 TRAINING ARRANGEMENTS\n\nThese standards are set to provide technical and vocational education and training (TVET)\nproviders with information and other important requirements to consider when designing\ntraining programs for MANUAL METAL ARC WELDING (MMAW) NC II.\n\n3.1\nCURRICULUM DESIGN\n\nTESDA shall provide the training on the development of competency-based\ncurricula to enable training providers develop their own curricula with the components\nmentioned below.\n\nDelivery of knowledge requirements for the basic, common and core units of\ncompetency\nspecifically\nin\nthe\nareas\nof\nmathematics,\nscience/technology,\ncommunication/language and other academic subjects shall be contextualized. To this\nend, TVET providers shall develop a Contextual Learning Matrix (CLM) to accompany\ntheir curricula.\n\n Course Title: MANUAL METAL ARC WELDING (MMAW) NC Level NC II\n\nNominal Training Duration:\n37 Hours (Basic Competencies)\n40 Hours (Common Competencies)\n 181 Hours (Core Competencies)\n\n 258 Hours\n 80 Supervised Industry Learning (SIL)\n 338 TOTAL HOURS\n\nCourse Description:\n\nThis course is designed to provide the learner with knowledge, practical skills and\nattitude, applicable in performing work activities involved in applying safety practices,\ninterpreting drawings and sketches, performing basic workshop measurements and computing\nindustry calculations, contributing to Quality System, using hand tools, preparing weld\nmaterials and consumables, setting up welding equipment, preparing/fit up welding joints fit up\nweld materials, repairing welds and welding carbon steel plates and pipes using MMAW. This\nincludes classroom learning activities and practical work in actual work site or simulation area.\n\nUpon completion of the course, the learners are expected to demonstrate the above-\nmentioned competencies to be employed. To obtain this, all units prescribed for this\nqualification must be achieved.\n\n--- PDF PAGE 71 ---\nManual Metal Arc Welding (MMAW) NC II – MEEMAW221 Promulgated (9/14/2021) 67\nBASIC COMPETENCIES\n(37 HOURS)\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n1. Participate in\nworkplace\ncommunication\n1.1. Obtain and convey\nworkplace\ninformation\n•\nDescribe Organizational\npolicies\n•\nRead:\no Effective\ncommunication\no Written communication\no Communication\nprocedures and\nsystems\n•\nIdentify:\no Different modes of\ncommunication\no Medium of\ncommunication\no Flow of communication\no Available technology\nrelevant to the\nenterprise and the\nindividual’s work\nresponsibilities\n•\nPrepare different Types of\nquestion\n•\nGather different sources\nof information\n•\nApply storage system in\nestablishing workplace\ninformation\n•\nDemonstrate Telephone\ncourtesy.\n• Group\ndiscussion\n• Lecture\n• Demonstration\n• Oral evaluation\n• Written\nexamination\n• Observation\n2 hours\n\n--- PDF PAGE 72 ---\nManual Metal Arc Welding (MMAW) NC II – MEEMAW221 Promulgated (9/14/2021) 68\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n1.2. Perform duties\nfollowing workplace\ninstructions\n•\nRead:\no Written notices and\ninstructions\no Workplace interactions\nand procedures\n•\nRead instructions on work\nrelated forms/documents\n•\nPerform workplace duties\nscenario following\nworkplace instructions\n\n• Group\ndiscussion\n• Lecture\n• Demonstration\n• Oral evaluation\n• Written\nexamination\n• Observation\n2 hours\n1.3. Complete relevant\nwork related\ndocuments\n•\nDescribe Communication\nprocedures and systems\n•\nRead:\no Meeting protocols\no Nature of workplace\nmeetings\no Workplace interactions\no Barriers of\ncommunication\n•\nRead instructions on work\nrelated forms/documents\n•\nPractice:\no Estimate, calculate and\nrecord routine\nworkplace measures\no Basic mathematical\nprocesses of addition,\nsubtraction, d