\n• Observation\n• Demonstration\nand oral\nquestioning\n• Written test\n\n• 8 Hours\n\n5.4 Clean surfaces and edges\n\n•\nDetermine proper\nPPE in\naccordance with\nsafety standards\n•\nKnow and Identify\nwelding safety\nhazards\n•\nKnow how to\nclean materials\naccording to\nspecifications.\n\n• Lecture-\nDiscussion\n• Demonstration\n• Practical\n application\n\n• Observation\n• Demonstration\nand oral\nquestioning\n• Written test\n\n• 2 Hours\n\n5.5 Prepare welding consumables\n•\nDetermine proper\nPPE in\naccordance with\nsafety standards\n•\nKnow and Identify\nwelding safety\nhazards\n•\nKnow how to\nselect and prepare\nproper welding\nconsumables.\n• Lecture-\nDiscussion\n• Demonstration\n• Practical\n application\n\n• Observation\n• Demonstration\nand oral\nquestioning\n• Written test\n\n• 2 Hours\n\n--- PDF PAGE 88 ---\nManual Metal Arc Welding (MMAW) NC II – MEEMAW221 Promulgated (9/14/2021) 84\n\nCORE COMPETENCIES\n(181 HOURS)\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n1. Set-up Welding\nEquipment\n1.1 Set up welding machine\n\n• Explain and demonstrate\nhow to set-up welding\nequipment.\n• Explain and demonstrate\nhow to set-up welding\naccessories.\n• Explain and demonstrate\nhow to set-up welding\npositioners, jigs and\nfixtures.\n• Lecture\nDiscussion\n• Demonstration\n• Practical\n application\n\n• Observation\nand oral\nquestioning\n• Demonstration\nand oral\nquestioning\n• Written test\n• 2 Hours\n\n1.2 Set up welding accessories\n\n• Explain and demonstrate\nhow to set-up welding\nequipment.\n• Explain and demonstrate\nhow to set-up welding\naccessories.\n• Explain and demonstrate\nhow to set-up welding\npositioners, jigs and\nfixtures.\n• Lecture\nDiscussion\n• Demonstration\n• Practical\n application\n\n• Observation\nand oral\nquestioning\n• Demonstration\nand oral\nquestioning\n• Written test\n• 1 Hour\n\n1.3 Set up welding positioners,\njigs and fixtures\n\n• Explain and demonstrate\nhow to set-up welding\nequipment.\n• Explain and demonstrate\nhow to set-up welding\naccessories.\n• Explain and demonstrate\nhow to set-up welding\npositioners, jigs and fixtures.\n• Lecture\nDiscussion\n• Demonstration\n• Practical\n application\n\n• Observation\nand oral\nquestioning\n• Demonstration\nand oral\nquestioning\n• Written test\n• 1 Hour\n\n--- PDF PAGE 89 ---\nManual Metal Arc Welding (MMAW) NC II – MEEMAW221 Promulgated (9/14/2021) 85\n2. Prepare / Fit up\nWelding Joints\n2.1 Set-up root opening and\n alignment\n\n• Explain and demonstrate\nhow to set-up root opening\nand alignment.\n• Obtain tack welds.\n• Explain and obtain correct\nfitted welding joints\n• Lecture-\nDiscussion\n• Demonstration\n• Practical\n application\n\n• Observation\nand oral\nquestioning\n• Demonstration\nand oral\nquestioning\n• Written test\n• 4Hours\n\n2.2 Perform tack welding\n\n• Explain and demonstrate\nhow to set-up root opening\nand alignment.\n• Obtain tack welds.\n• Explain and obtain correct\nfitted welding joints\n• Lecture-\nDiscussion\n• Demonstration\n• Practical\n application\n\n• Observation\nand oral\nquestioning\n• Demonstration\nand oral\nquestioning\n• Written test\n• 8 Hours\n\n2.3 Set-up fitted welding joints\n\n• Explain and demonstrate\nhow to set-up root opening\nand alignment.\n• Obtain tack welds.\n• Explain and obtain correct\nfitted welding joints\n• Lecture-\nDiscussion\n• Demonstration\n• Practical\n application\n\n• Observation\nand oral\nquestioning\n• Demonstration\nand oral\nquestioning\n• Written test\n• 4 Hours\n3. Weld Carbon\nSteel Plates and\nPipes Using\nMMAW\n3.1 Perform root passes in\ndifferent positions-\n PF(3G), PE(4G)-Plate,\n PA(1G), PC(2G),PH(5G),H-\nLO45(6G) -Pipe\n\n• Explain and obtain root\npasses in different positions\nin accordance to welding\ncodes and standards.\n\n• Lecture-\nDiscussion\n• Demonstration\n• Practical\n application\n\n• Observation\nand oral\nquestioning/\nInterview\n• Demonstration\nand oral\nquestioning/\nInterview\n• Written test\n• Nondestructiv\ne Testing\n(NDT) of test\ncoupon\n\n• 48 Hours\n\n3.2 Perform subsequent fill\npasses in different\npositions-\n• Explain and obtain\nsubsequent fill passes in\ndifferent positions in\n• Lecture-\nDiscussion\n• Demonstration\n• Observation\nand oral\nquestioning/\n• 57 Hours\n\n--- PDF PAGE 90 ---\nManual Metal Arc Welding (MMAW) NC II – MEEMAW221 Promulgated (9/14/2021) 86\n PF(3G), PE(4G)-Plate,\n PA(1G), PC(2G),PH(5G),\nH-LO45(6G) -Pipe\n\naccordance to welding\ncodes and standards.\n\n• Practical\n application\n\nInterview\n• Demonstration\nand oral\nquestioning/\nInterview\n• Written test\n• Nondestructiv\ne Testing\n(NDT) of test\ncoupon\n\n3.3 Perform capping in different\npositions- PF(3G), PE(4G)-\nPlate, PA(1G),\nC(2G),PH(5G), H-LO45(6G)\n-Pipe\n\n• Explain and obtain\ncapping in different\npositions in accordance to\nwelding codes and\nstandards.\n\n• Lecture-\nDiscussion\n• Demonstration\n• Practical\n application\n\n• Observation\nand oral\nquestioning/\nInterview\n• Demonstration\nand oral\nquestioning/\nInterview\n• Written test\n• Nondestructiv\ne Testing\n(NDT) of test\ncoupon\n\n• 48 Hours\n\n3.4 Perform final visual\nInspection in all test coupon\nin different positions\n• Explain and obtain final\nvisual Inspection in different\npositions in accordance to\nwelding codes and\nstandards.\n\n• Lecture-\nDiscussion\n• Demonstration\n• Practical\n application\n\n• Observation\nand oral\nquestioning/\nInterview\n• Demonstration\nand oral\nquestioning/\nInterview\n• Written test\n• Nondestructiv\ne Testing\n(NDT) of test\ncoupon\n\n• 8 Hours\n\n--- PDF PAGE 91 ---\nManual Metal Arc Welding (MMAW) NC I – MEEMAW221 Promulgated (9/14/2021) 87\n\n3.2\nTRAINING DELIVERY\n\n1. The delivery of training shall adhere to the design of the curriculum.\nDelivery shall be guided by the principles of competency-based TVET.\n\na. Course design is based on competency standards set by the industry\nor recognized industry sector; (Learning system is driven by\ncompetencies written to industry standards)\n\nb. Training delivery is learner-centered and should accommodate\nindividualized and self-paced learning strategies;\n\nc. Training can be done on an actual workplace setting, simulation of a\nworkplace and/or through adoption of modern technology.\n\nd. Assessment is based in the collection of evidence of the performance\nof work to the industry required standards;\n\ne. Assessment of competency takes the trainee’s knowledge and\nattitude into account but requires evidence of actual performance of\nthe competency as the primary source of evidence.\n\nf. Training program allows for recognition of prior learning (RPL) or\ncurrent competencies;\n\ng. Training completion is based on satisfactory completion of all\nspecified competencies not on the specified nominal duration of\nlearning.\n\n2. The competency-based TVET system recognizes various types of\ndelivery modes, both on-and off-the-job as long as the learning is driven\nby the competency standards specified by the industry. The following\ntraining modalities and their variations/components may be adopted\nsingly or in combination with other modalities when designing and\ndelivering training programs:\n\n2.1 Institution- Based:\n\n• Dual Training System (DTS)/Dualized Training Program (DTP)\nwhich contain both in-school and in-industry training or fieldwork\ncomponents. Details can be referred to the Implementing Rules\nand Regulations of the DTS Law and the TESDA Guidelines on\nthe DTP;\n\n--- PDF PAGE 92 ---\nManual Metal Arc Welding (MMAW) NC II – MEEMAW221 Promulgated (9/14/2021) 88\n• Distance learning is a formal education process in which\nmajority of the instruction occurs when the students and\ninstructor are not in the same place. Distance learning may\nemploy\ncorrespondence\nstudy,\naudio,\nvideo,\ncomputer\ntechnologies or other modern technology that can be used to\nfacilitate learning and formal and non-formal training. Specific\nguidelines on this mode shall be issued by the TESDA\nSecretariat.\n\n• Supervised Industry Learning (SIL) or on-the-job training (OJT)\nis an approach in training designed to enhance the knowledge\nand skills of the trainee through actual experience in the\nworkplace to acquire specific competencies as prescribed in the\ntraining regulations. It is imperative that the deployment of\ntrainees in the workplace is adhered to training programs\nagreed by the institution and enterprise and status and progress\nof trainees are closely monitored by the training institutions to\nprevent opportunity for work exploitation.\n\n• The classroom-based or in-center instruction uses of learner-\ncentered methods as well as laboratory or field-work\ncomponents.\n\n2.2 Enterprise-Based:\n\n• Formal Apprenticeship - Training within employment involving a\ncontract between an apprentice and an enterprise on an\napproved apprenticeable occupation.\n\n• Informal Apprenticeship - is based on a training (and working)\nagreement between an apprentice and a master craftsperson\nwherein the agreement may be written or oral and the master\ncraftsperson commits to training the apprentice in all the skills\nrelevant to his or her trade over a significant period of time,\nusually between one and four years, while the apprentice\ncommits to contributing productively to the work of the business.\nTraining is integrated into the production process and\napprentices learn by working alongside the experienced\ncraftsperson.\n\n• Enterprise-based Training- where training is implemented within\nthe company in accordance with the requirements of the specific\ncompany. Specific guidelines on this mode shall be issued by\nthe TESDA Secretariat.\n\n2.3 Community-Based\n\n--- PDF PAGE 93 ---\nManual Metal Arc Welding (MMAW) NC II – MEEMAW221 Promulgated (9/14/2021) 89\n\n• Community-Based – short term programs conducted by non-\ngovernment organizations (NGOs), LGUs, training centers and\nother TVET providers which are intended to address the specific\nneeds of a community. Such programs can be conducted in\ninformal settings such as barangay hall, basketball courts, etc.\nThese programs can also be mobile training program (MTP).\n\n3. Republic Act. No. 11551, “An Act Integrating Labor Education in the\nTertiary Education Curriculum” seeks to integrate labor education in the\nTechnical Vocational Education and Training (TVET) curriculum. As\nprovided in Section 3.b., “Labor education refers to the teaching of basic\nknowledge on labor rights and other skills relating to negotiation,\nfostering smooth interpersonal relations in the workplace, and\nmechanisms for redress of grievances and other concerns.”\n\n The Implementing Rules and Regulations for RA 11551 is still being\ndrafted by the TWG as of the date when this proposed TR is being\npresented to the TESDA Board for approval and promulgation. In the\nmeantime, that TESDA is finalizing the labor education framework that\nwill serve as a basis in developing the labor education curriculum for\nTVET, the process of integration shall be done by integrating labor\neducation concepts in the Competency Based Curriculum (CBC) that will\nbe developed by the TVIs that intends to register the TVET program.\nThe labor education concepts to be integrated in the CBC shall be\nderived from the definition of labor education provided in Republic Act.\nNo. 11551.\n\n3.3 TRAINEE ENTRY REQUIREMENTS\n\nTrainees or students wishing to enroll in this program must possess the\nfollowing requirements:\n\n• Completed training in Manual Metal Arc Welding (MMAW) NC I /\n Shielded Metal Arc Welding NC I (SMAW NC I) or a holder of MMAW NC I /\n SMAW NC I\n• Must possess good communication skills\n• Physically fit (including differently-abled person)\n• Can perform basic mathematical computation\n\n--- PDF PAGE 94 ---\nManual Metal Arc Welding (MMAW) NC II – MEEMAW221 Promulgated (9/14/2021) 90\n\n3.4 TOOLS, MATERIALS AND EQUIPMENT\n\n Recommended list of tools, materials and equipment for the training of 20\ntrainees for Manual Metal Arc Welding NC II.\n\nUp-to-date tools, materials, and equipment of equivalent functions can be\nused as alternatives. This also applies in consideration of community practices and\ntheir availability in the local market.\n\n A. (Full Qualification)\n\nTOOLS\nQTY\nDescription\n20 pcs.\nChipping Hammer\n60 pcs.\nSteel brush\n20 prs.\nPliers/tongs\n20 pcs.\nFiles-bastard cut\n20 pcs.\nWelding Mask\n20 pcs\nWelding apron/jacket\n40 prs.\nWelding gloves(long)\n20 prs.\nSafety goggles, wide vision, clear\n5 prs.\nOxy-acetylene\nGoggles\n20 pcs.\nTri-square 300 mm. Long\n20 pcs.\nSteel rule300mm. long\n20 pcs.\nFiles-half round\n20 pcs.\nWelding gauges\n60 pcs\nRespirator (as per NIOSH)\n20 prs\nSafety Shoes (High-cut)\n10 pcs\nAdjustable wrench 12 inch\n\n--- PDF PAGE 95 ---\nManual Metal Arc Welding (MMAW) NC II – MEEMAW221 Promulgated (9/14/2021) 91\n10 pcs\nC- Clamps (8inch)\n1 unit\nClamp Ammeter (Optional)\n\nMATERIALS\nQTY\nDescription\n10 kgs.\nElectrodes 3.2mm (ISO / E6011)\n30 kgs.\nElectrodes 3.2mm (ISO / E7018)\n2 pcs\nSoftstone / Chalk Marker\n3 pcs\nDark glass #10\n25 pcs\nClear glass\n30 pcs.\nCutting disc 3/32” X 5/8” X 4”\n5 pcs\n\nGrinding disc 1/4” X 5/8” X 4”\n18 pcs.\nCarbon steel plate 10mm x 150mm x 200mm\n32 pcs.\nCarbon steel pipe,\n150ø mm. x 125mm (sch. 40 )\n\n--- PDF PAGE 96 ---\nManual Metal Arc Welding (MMAW) NC II – MEEMAW221 Promulgated (9/14/2021) 92\n\nEQUIPMENT\nQTY\nDescription\n10 units\nMMAW/SMAW machine AC/DC 250-300amps and\naccessories\n10pcs.\nWelding table with welding positioners\n1 unit\nElectrode oven (Big)\n\n10 units\nPortable disc grinder\n1 set\nVentilation System\n2 units\nWork bench w/ bench vice on 4 corners\n2 sets\nOxy-fuel cutting outfit with trolley\n2 units\nPedestal /bench grinding machine\n2 units\nIndustrial fan\n5 units\nPortable Oven (quiver type)\n4 Units\nFire Extinguishers\n3 units\nWaste Bins\n1 Unit\nScrap Bin\n10 sets\nBroom and dustpans\n2 sets\nLiquid Penetrant Test (PT) kit\n5 unit\nVernier Caliper\n\n5 unit\nSpirit Level\n1 unit\nPlate and pipe beveling cutting equipment\n(Mechanical or Automatic)\n\n--- PDF PAGE 97 ---\nManual Metal Arc Welding (MMAW) NC II – MEEMAW221 Promulgated (9/14/2021) 93\n\n3.5 TRAINING FACILITIES\n\nThe welding workshop must be of concrete structure. Based on class size of\n20 students/trainees the space requirements for the teaching/learning and\ncirculation areas are as follows:\n\nSPACE REQUIREMENT\nSIZE IN\nMETERS\nAREA IN SQ.\nMETERS\nQTY.\nTOTAL AREA IN\nSQ. METERS\nContextual Learning\nArea\n(Lecture Room)\n3 x 4\n12\n1\n12\nDistance Learning\n(Laboratory/Workshop/\nActivity area)\n\n56\n\n56\n-\nWelding Booth*\n2 X 1.5 = 3\n3 x 10 booths\n30\n10\n30\n-\nGrinding Booth*\n2 X 1.5\n\n3\n2\n6\n-\nMaterials/Preparat\nion Area*\n2 X 2.5\n\n5\n2\n10\n-\nBench work Area*\n2 X 2.5\n\n5\n2\n10\nStorage Area (Tool room\n& S/M storage area)\n4 X 5\n\n20\n1\n20\nLearning Resource\nArea*\n5 X 7\n\n35\n\n1\n35\nWash Area /Comfort\nRoom (male & female)\n2.5 X 4\n10\n1\n10\nCirculation Area**\n\n(27.3)\n\nTotal Workshop Area\n\n (160.3~160)\n\nNOTE: Access to and use of equipment /facilities can be provided through cooperative\narrangements or MOA with other partner companies\n\n--- PDF PAGE 98 ---\nManual Metal Arc Welding (MMAW) NC II – MEEMAW221 Promulgated (9/14/2021) 94\n\n 3.6 TRAINER’S QUALIFICATIONS FOR MANUAL METAL ARC WELDING (MMAW) NC II\n\n•\nHolder of National TVET Trainer Certificate Level I (NTTC Level I) in\n Manual Metal Arc Welding (MMAW) NC II or higher\n•\nMust be physically fit (including differently-abled person)\n•\nMust have at least 2 years welding job/industry/ teaching experience\n\n3.7 INSTITUTIONAL ASSESSMENT\n\nInstitutional Assessment is gathering of evidences to determine the\nachievements of the requirements of the qualification to enable the trainer make\njudgement whether the trainee 