        "source_text": "MEE721210\n\nUNIT DESCRIPTOR\n\n: This unit covers the competencies required to perform\nproper measurement and simple calculations using the four\nfundamental operations.\n\n ELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Select and use\nmeasuring tools\n1.1 Measuring tools\nare selected\naccording to the\nrequirement.\n1.2 Measuring tools\nare used according\nto the requirement\n1.3 Measuring\ntechnique used is\ncorrect and\nappropriate to the\ndevice used.\n1.1 Types, purposes\nand accuracy of\nmeasuring\ninstruments\n1.2 Capability of\nmeasuring\ninstruments\n1.3 Part dimensions\nand tolerances\n1.4 Techniques for\nmeasuring\ndimensions\n1.1 Selecting\nmeasuring tools\n1.2 Obtaining\naccurate\nmeasurements\n1.3 Determining\nmeasuring\ntechnique\n\n2. Clean and store\nmeasuring tools\n2.1 Cleaning of\ndevices\nundertaken\naccording to\nstandard operating\nprocedures.\n2.2 Care of devices\nundertaken\naccording to\nmanufacturer’s\nspecifications.\n2.3 Storage of devices\nundertaken\naccording to\nstandard operating\nprocedures.\n2.1 Types, purposes\nand accuracy of\nmeasuring\ninstruments\n2.2 Capability of\nmeasuring\ninstruments\n2.3 Part dimensions\nand tolerances\n2.4 Techniques for\nmeasuring\ndimensions\n2.5 Care and storage\nprocedure of\nmeasuring tools\n\n2.1 Determining\nproper care and\nstorage of\nmeasuring tools.\n3.\nPerform four\nfundamental\noperations.\n3.1 Simple calculations\nare performed using\nfour fundamental\noperations.\n3.2 Correct formula are\napplied to isolate\nthe variable\nrequired.\n3.3 Simple transposition\nof variables in the\nformulae is carried\nout.\n3.4 Unknown variables\nare solved correctly.\n3.1 Linear\nmeasurement\n3.2 Geometrical\nmeasurement\n3.3 Ratio and\nproportion\n3.4 Area\n\n3.1 Performing\nCalculation\n\n--- PDF PAGE 47 ---\nManual Metal Arc Welding (MMAW) NC II – MEEMAW221 Promulgated (9/14/2021) 43\n4.\nPerform conversion\nof units\n4.1 Familiarity to\nEnglish system of\nmeasurement is\nrequired\n4.2 Understanding to\nthe metric system is\nnecessary.\n4.3 Units are converted\nto the required\nfigure using the\ngiven formulae\n4.1 English Systems\nof Measurement\n4.2 Metric System of\nMeasurement\n4.3 Conversion of\nunits from English\nto metric and/or\nvice versa\n4.1 Performing\nCalculation\n\n--- PDF PAGE 48 ---\nManual Metal Arc Welding (MMAW) NC II – MEEMAW221 Promulgated (9/14/2021) 44\n\n RANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Measuring tools\nMay include:\n1.1 Try square\n1.2 Steel rule\n1.3 Welding gauges\n2. Four fundamental\n operations\nMay include:\n2.1 Addition\n2.2 Subtraction\n2.3 Multiplication\n2.4 Division\n3 Units\nMay include:\n3.1 English System\n3.2 Metric System\n\n EVIDENCE GUIDE\n\n1.\nCritical aspects\nof competency\nAssessment requires evidence that the candidate:\n1.1 Selected and used measuring tools.\n1.2 Cleaned and stored using measuring tools\n1.3 Used four fundamental operations\n1.4 Performed conversion of units\n2.\nResource\nimplications\nThe following resources must be provided\n2.1 Tools and facilities appropriate to processes or activity\n2.2 Materials relevant to the proposed activity\n\n3.\nMethod of\nassessment\nCompetency must be assessed through:\n3.1 Written or oral short answer questions\n3.2 Practical exercises\n\n4.\nContext for\nassessment\n4.1 Competency may be assessed in the workplace or in\nsimulated workplace environment or at the designated TESDA\nAccredited Assessment Center.\n\n--- PDF PAGE 49 ---\nManual Metal Arc Welding (MMAW) NC II – MEEMAW221 Promulgated (9/14/2021) 45\nUNIT OF COMPETENCY : CONTRIBUTE TO QUALITY MANAGEMENT SYSTEM\n (QMS)\n\nUNIT CODE\n\n:"
      }
