        "source_text": "400311218\n\nUNIT DESCRIPTOR\n: This unit covers the outcomes required to apply\nentrepreneurial workplace best practices and\nimplement cost-effective operations.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Apply\n entrepreneurial\n workplace best\n practices\n\n1.1 Good practices\nrelating to\nworkplace\noperations are\nobserved and\nselected following\nworkplace policy.\n1.2 Quality procedures\nand practices are\ncomplied with\naccording to\nworkplace\nrequirements.\n1.3 Cost-conscious\nhabits in resource\nutilization are\napplied based on\nindustry standards.\n\n1.1 Workplace best\npractices, policies\nand criteria\n1.2 Resource utilization\n1.3 Ways in fostering\nentrepreneurial\nattitudes:\n•\nPatience\n•\nHonesty\n•\nQuality-\nconsciousness\n•\nSafety-\nconsciousness\n•\nResourcefulness\n\n1.1 Communication skills\n1.2 Complying with quality\nprocedures\n\n--- PDF PAGE 41 ---\nManual Metal Arc Welding (MMAW) NC II – MEEMAW221 Promulgated (9/14/2021) 37\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n2. Communicate\nentrepreneurial\nworkplace best\npractices\n\n2.1 Observed Good\npractices relating to\nworkplace\noperations are\ncommunicated to\nappropriate\nperson.\n2.2 Observed quality\nprocedures and\npractices are\ncommunicated to\nappropriate person.\n2.3 Cost-conscious\nhabits in resource\nutilization are\ncommunicated\nbased on industry\nstandards.\n\n2.1 Workplace best\npractices, policies\nand criteria\n2.2 Resource utilization\n2.3 Ways in fostering\n Entrepreneurial\n attitudes:\n•\nPatience\n•\nHonesty\n•\nQuality-\nconsciousness\n•\nSafety-\nconsciousness\n•\nResourcefulness\n\n2.1 Communication skills\n2.2 Complying with quality\nprocedures\n2.3 Following workplace\n communication protocol\n\n--- PDF PAGE 42 ---\nManual Metal Arc Welding (MMAW) NC II – MEEMAW221 Promulgated (9/14/2021) 38\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n3. Implement cost-\neffective\noperations\n3.1 Preservation and\noptimization of\nworkplace\nresources is\nimplemented in\naccordance with\nenterprise policy.\n3.2 Judicious use of\nworkplace tools,\nequipment and\nmaterials are\nobserved according\nto manual and work\nrequirements.\n3.3 Constructive\ncontributions to\noffice operations\nare made\naccording to\nenterprise\nrequirements.\n3.4 Ability to work\nwithin one’s allotted\ntime and finances\nis sustained.\n\n3.1 Optimization of\nworkplace resources\n3.2 5S procedures and\n concepts\n3.3 Criteria for cost\n effectiveness\n3.4 Workplace\n productivity\n3.5 Impact of\nentrepreneurial\nmindset to workplace\nproductivity\n3.6 Ways in fostering\nentrepreneurial\nattitudes:\n•\nQuality-\nconsciousness\n•\nSafety-\nconsciousness\n3.1 Implementing\npreservation and\noptimizing workplace\nresources\n3.2 Observing judicious use\nof workplace tools,\nequipment and materials\n3.3 Making constructive\ncontributions to office\noperations\n3.4 Sustaining ability to work\nwithin allotted time and\nfinances\n\n--- PDF PAGE 43 ---\nManual Metal Arc Welding (MMAW) NC II – MEEMAW221 Promulgated (9/14/2021) 39\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1.Good practices\nMay include:\n1.1 Economy in use of resources\n1.2 Documentation of quality practices\n\n2.Resources utilization\nMay include:\n2.1 Consumption/ use of consumables\n2.2 Use/Maintenance of assigned equipment and furniture\n2.3 Optimum use of allotted /available time\n\nEVIDENCE GUIDE\n\n1. Critical aspects\nof competency\nAssessment requires evidence that the candidate:\n1.1 Demonstrated ability to identify and sustain cost-effective\nactivities in the workplace\n1.2 Demonstrated ability to practice entrepreneurial knowledge,\nskills and attitudes in the workplace.\n\n2. Resource\nImplications\nThe following resources should be provided:\n2.1 Simulated or actual workplace\n2.2 Tools, materials and supplies needed to demonstrate the\nrequired tasks\n2.3 References and manuals\n2.3.1 Enterprise procedures manuals\n2.3.2 Company quality policy\n\n3. Methods of\nAssessment\nCompetency in this unit should be assessed through:\n3.1 Interview\n3.2 Third-party report\n\n4.Context of\nAssessment\n4.1 Competency may be assessed in workplace or in a simulated\nworkplace setting\n4.2 Assessment shall be observed while tasks are being undertaken\nwhether individually or in-group\n\n--- PDF PAGE 44 ---\nManual Metal Arc Welding (MMAW) NC II – MEEMAW221 Promulgated (9/14/2021) 40\n COMMON COMPETENCIES\n\nUNIT OF COMPETENCY : INTERPRET DRAWINGS AND SKETCHES\n\nUNIT CODE\n\n:"
