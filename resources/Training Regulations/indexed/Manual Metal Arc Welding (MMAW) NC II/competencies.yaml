        "source_text": "MEE721212\n\nDESCRIPTOR\n: This unit covers the skills, knowledge and attitudes in\n preparing welding materials.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Identify and use\nof Personal\nProtective\nEquipment (PPE)\n1.1 Personal protective\nequipment (PPE) is\nused in accordance\nwith Rule 1080 of\nOccupational Safety\nand Health Standards\n1.2 Proper Care and\nMaintenance of PPEs\nare performed in\naccordance with\nOSHS\n1.3 Storage and Disposal\nof PPE are followed\naccording to OSHS\n1.1 OSH rule 1080\nwork standard\n1.2 Company/\nworkplace policies/\nguidelines\n1.3 Standards and\nsafety\nrequirements of\nwork process and\nprocedures\n\n1.1 Applying\nsafety\nprocedures\n1.2\nCommunication\nskill\n1.3 Observation\nskills\n2. Set up cutting\nequipment and\nmaterials\n2.1\nCutting equipment\nshould be\noperational\nand conformed\nto acceptable\n standards\n2.2 Setting-up of\nequipment and\nmaterials are\nperformed according\nto standard operating\nprocedure\n2.3 Task performed in\naccordance with\ncompany or industry\nrequirements and\nsafety practices.\n2.1 ANSI Z49.1 or\nequivalent safety\nstandards\n2.2 Work instructions\n(written and\nverbal).\n2.3 Noise Pollution\n2.4 Air pollution\n\n2.1 Identifying\nMaterial\nrequirement\ns\n2.2 Conducting\nequipment\nand\nmaterial\nset-ups\n2.3Applying\nsafety\nprocedures\n\n3.Cut and prepare\nedge of materials\n3.1 Materials are cut to\nspecified dimension/\nspecifications.\n3.2 Edges are prepared in\naccordance to\nspecified shapes and\nconfigurations.\n3.3 Task performed in\naccordance with\ncompany or industry\n3.1 ANSI Z49.1 or\nequivalent safety\nstandards\n3.2Work instructions\n(written and\nverbal).\n3.3Noise Pollution\n3.4 Air pollution\n3.5 5S and Proper\nHousekeeping\n3.1 Obtaining\naccurate\nmeasureme\nnt\n3.2 Applying\nsafety\nprocedures\n3.3\nCommunication\nskill\n\n--- PDF PAGE 55 ---\nManual Metal Arc Welding (MMAW) NC II – MEEMAW221 Promulgated (9/14/2021) 51\nrequirements and\nsafety procedure.\n3.6 Waste\nSegregation/ 3R\n3.7AWF-CWCS/ ISO\n9606-1 / AWS\nD1.1 / ASME IX.\n3.4 Observation\nskills\n4.Clean surfaces\nand edges\n4.1 Cleaning methods of\nthe surfaces are\nrequired as per\nspecifications.\n4.2 Surfaces and edges\nare properly cleaned\nand free from\ncontaminants.\n4.3 Task performed in\naccordance with\ncompany or industry\nrequirements and\nsafety practices.\n4.1 Cutting Methods\n4.2 OSH Standards\n4.3 Work instructions\n(written and verbal).\n4.4Types / purposes\nand accuracy of\nedge preparation\n4.5 5S and Proper\nHousekeeping\n4.6 Waste\nSegregation/ 3R\n4.7 AWF-CWCS/ ISO\n9606-1 / AWS\nD1.1 / ASME IX.\n4.1Determining\nproper care\nand\ncleanliness\nof the\nmaterial.\n4.2 Applying\nsafety\nprocedures\n4.3\nCommunication\nskill\n4.4 Observation\nskills\n5.Prepare welding\nconsumables\n5.1Consumables are\nprepared in\naccordance with\nrequired specifications\n5.2 Recommended\nmanufacturer’s\ninstructions are\nobserve\n5.3Task performed in\naccordance with\ncompany or industry\nrequirements and\nsafety practices.\n5.1 Selection of\nproper welding\nconsumables\n5.2 Work instructions\n(written and\nverbal).\n5.3 OSH rule 1080-\nPersonal\nProtective\nequipment and\ndevice.\n5.4 OSH rule no.\n1150-Materials\nHandling Storage.\n5.5 RA 6969-Toxic\nsubstances and\nhazardous and\nnuclear wastes\ncontrol act of\n1990.\n5.6 Material Safety\nData Sheet\n(MSDS)/ Safety\nData Sheet (SDS)\n5.7 5S and Proper\nHousekeeping\n5.8 Waste\nSegregation/ 3R\n5.9 AWF-CWCS/ ISO\n9606-1 / AWS\nD1.1 / ASME IX.\n5.1 Selecting of\nappropriate\nwelding\nconsumable\ns\n5.2 Applying\nsafety\nprocedures\n5.3\nCommunication\nskill\n5.4 Observation\nskills\n\n--- PDF PAGE 56 ---\nManual Metal Arc Welding (MMAW) NC II – MEEMAW221 Promulgated (9/14/2021) 52\nRANGE OF VARIABLE\n\nVARIABLE\nRANGE\n1. Cutting Equipment\nMay include:\n1.1 Oxy-fuel gas cutting equipment (manual and /or\n automatic)\n1.2 Plasma cutting equipment\n1.3 Shearing machine\n1.5 Cut-off Wheel\n2. Materials\n\nMay include:\n2.1 Mild steel / Carbon Steel Plates\n2.2 Run on/run off tabs\n3. Safety practices:\nMay be include:\n3.1 Wearing of required PPE\n3.2 Handling and storage of materials and equipment\n3.3 Safety Data Sheet (SDS)\n3.4 Safety standards and procedures\n3.5 Checking electrical equipment and devices\n3.6 House keeping\n4. Cleaning Methods\nSurfaces and edges may be cleaned by\n4.1 Grinding\n4.2 Filing\n4.3 Steel Brushing\n5 Consumables\nMay include:\n5.1 Cutting gases\n5.2 Welding Electrodes\n5.3 Grinding/cutting discs\n\n--- PDF PAGE 57 ---\nManual Metal Arc Welding (MMAW) NC II – MEEMAW221 Promulgated (9/14/2021) 53\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\n competency\nAssessment requires evidence that the candidate:\n1.1 Perform edge preparation in accordance with\n WPS and safety procedures\n1.2 Use edge preparation equipment and tools in\n accordance with the requirements or\n manufacturer’s instructions\n\n2.Resource implications\nThe following resources must be provided:\n2.1 Relevant documentation such as WPS and\n working drawing\n2.2 Materials and consumables\n2.3 Cutting equipment and accessories\n2.4 Cleaning tools and equipment\n2.2 Measuring tools\n2.3 PPE\n2.4 Firefighting equipment\n\n3. Method of assessment\nCompetency may be assessed through:\n3.1 Observation/evaluation\n3.2 Oral questioning\n3.3 Practical exercises\n\n4 Context of assessment\n4.1 Competency to be assessed while a task is being\nundertaken in the workplace or in a simulated\nworkplace setting or at the designated TESDA\nAccredited Assessment Center.\n\n--- PDF PAGE 58 ---\nManual Metal Arc Welding (MMAW) NC II – MEEMAW221 Promulgated (9/14/2021) 54\nCORE COMPETENCIES\n\nUNIT TITLE\n:\nSET UP WELDING EQUIPMENT\n\nUNIT CODE\n:"
