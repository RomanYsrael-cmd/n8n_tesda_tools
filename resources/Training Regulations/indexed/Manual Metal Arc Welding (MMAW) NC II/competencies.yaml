        },
        "source_text": "400311211\n\n UNIT DESCRIPTOR:\n This unit covers the skills, knowledge and attitudes to\n\nidentify one’s roles and responsibilities as a member of a\nteam.\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n1. Describe team\n role and scope\n1.1 The role and\nobjective of the\nteam is identified\nfrom available\nsources of\ninformation\n1.2 Team parameters,\nreporting\nrelationships and\nresponsibilities are\nidentified from team\ndiscussions and\nappropriate\nexternal sources\n\n1.1 Group structure\n1.2 Group\ndevelopment\n1.3 Sources of\ninformation\n1.1 Communicating\nwith others,\nappropriately\nconsistent with the\nculture of the\nworkplace\n1.2 Developing ways\nin improving work\nstructure and\nperforming\nrespective roles in\nthe group or\norganization\n2. Identify one’s\nrole and\nresponsibility\nwithin a team\n2.1 Individual roles\nand responsibilities\nwithin the team\nenvironment are\nidentified.\n2.2 Roles and\nobjectives of the\nteam is identified\nfrom available\nsources of\ninformation.\n2.3 Team parameters,\nreporting\nrelationships and\nresponsibilities\nare identified\nbased on team\ndiscussions and\nappropriate\nexternal sources.\n\n2.1 Team roles and\n objectives\n2.2 Team structure\n and parameters\n2.3 Team\n development\n2.4 Sources of\n information\n\n2.1 Communicating\nwith others,\nappropriately\nconsistent with the\nculture of the\nworkplace\n2.2 Developing ways\nin improving work\nstructure and\nperforming\nrespective roles in\nthe group or\norganization\n\n--- PDF PAGE 13 ---\nManual Metal Arc Welding (MMAW) NC II – MEEMAW221 Promulgated (9/14/2021) 9\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms\nare elaborated in\nthe Range of\nVariables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n1. Work as a\nteam member\n3.1 Effective and\nappropriate\nforms of\ncommunications\nare used and\ninteractions\nundertaken with\nteam members\nbased on\ncompany\npractices.\n3.2 Effective and\nappropriate\ncontributions\nmade to\ncomplement\nteam activities\nand objectives,\nbased on\nworkplace\ncontext.\n3.3 Protocols in\nreporting are\nobserved based\non standard\ncompany\npractices.\n3.4 Contribute to the\ndevelopment of\nteam work plans\nbased on an\nunderstanding of\nteam’s role and\nobjectives\n\n3.1 Communication\nProcess\n3.2 Workplace\ncommunication\nprotocol\n3.3 Team planning and\n decision making\n3.4 Team thinking\n3.5 Team roles\n3.6 Process of team\ndevelopment\n3.7 Workplace context\n\n3.1 Communicating\nappropriately,\nconsistent with\nthe culture of the\nworkplace\n3.2 Interacting\neffectively with\nothers\n3.3 Deciding as an\nindividual and as\na group using\ngroup think\nstrategies and\ntechniques\n3.4 Contributing to\nResolution of\nissues and\nconcerns\n\n--- PDF PAGE 14 ---\nManual Metal Arc Welding (MMAW) NC II – MEEMAW221 Promulgated (9/14/2021) 10\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Role and objective\nof team\nMay include:\n1.1.\nWork activities in a team environment with\nenterprise or specific sector\n1.2.\nLimited discretion, initiative and judgement\nmaybe demonstrated on the job, either\nindividually or in a team environment\n2. Sources of\ninformation\nMay include:\n2.1.\nStandard operating and/or other workplace\nprocedures\n2.2.\nJob procedures\n2.3.\nMachine/equipment manufacturer’s\nspecifications and instructions\n2.4.\nOrganizational or external personnel\n2.5.\nClient/supplier instructions\n2.6.\nQuality standards\n2.7.\nOHS and environmental standards\n3. Workplace context\nMay include:\n3.1.\nWork procedures and practices\n3.2.\nConditions of work environments\n3.3.\nLegislation and industrial agreements\n3.4.\nStandard work practice including the storage,\nsafe handling and disposal of chemicals\n3.5.\nSafety, environmental, housekeeping and\nquality guidelines\n\n--- PDF PAGE 15 ---\nManual Metal Arc Welding (MMAW) NC II – MEEMAW221 Promulgated (9/14/2021) 11\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1. Worked in a team to complete workplace activity\n1.2. Worked effectively with others\n1.3. Conveyed information in written or oral form\n1.4. Selected and used appropriate workplace language\n1.5. Followed designated work plan for the job\n2. Resource\nImplications\nThe following resources should be provided:\n2.1. Access to relevant workplace or appropriately\nsimulated environment where assessment can take\nplace\n2.2. Materials relevant to the proposed activity or tasks\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1. Role play involving the participation of individual\nmember to the attainment of organizational goal\n3.3. Case studies and scenarios as a basis for discussion\nof issues and strategies in teamwork\n3.4 Socio-drama and socio-metric methods\n3.5 Sensitivity techniques\n3.6 Written Test\n4. Context for\nAssessment\n4.1. Competency may be assessed in workplace or in a\nsimulated workplace setting\n4.2. Assessment shall be observed while task are being\nundertaken whether individually or in group\n\n--- PDF PAGE 16 ---\nManual Metal Arc Welding (MMAW) NC II – MEEMAW221 Promulgated (9/14/2021) 12\nUNIT OF COMPETENCY :\nSOLVE/ADDRESS GENERAL WORKPLACE PROBLEMS\n\nUNIT CODE\n:"
