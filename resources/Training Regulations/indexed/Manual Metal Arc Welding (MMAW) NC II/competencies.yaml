        "source_text": "--- PDF PAGE 24 ---\nManual Metal Arc Welding (MMAW) NC II – MEEMAW221               Promulgated  (9/14/2021)                       20  \nUNIT OF COMPETENCY :  \nCONTRIBUTE TO WORKPLACE INNOVATION  \n \n  UNIT CODE \n              :  \n400311214 \n \nUNIT DESCRIPTOR         : \nThis unit covers the knowledge, skills and attitudes \n \n \n \nrequired to make a pro-active and positive  \n \n \n \n \ncontribution to workplace innovation. \n \n \n \nELEMENTS \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \n \nREQUIRED \nKNOWLEDGE \n \nREQUIRED \nSKILLS \n1. Identify \nopportunities to \ndo things better \n1.1 Opportunities for \nimprovement are \nidentified proactively \nin own area of work. \n1.2 Information are \ngathered and \nreviewed which may \nbe relevant to ideas \nand which might \nassist in gaining \nsupport for idea. \n1.1 Roles of \nindividuals in \nsuggesting and \nmaking \nimprovements. \n1.2 Positive impacts \nand challenges in \ninnovation. \n1.3 Types of changes \nand responsibility. \n1.4 Seven habits of \nhighly effective \npeople. \n \n1.1 Identifying \nopportunities to \nimprove and to do \nthings better. \nInvolvement. \n1.2 Identifying the \npositive impacts \nand the challenges \nof change and \ninnovation. \n1.3 Identifying \nexamples of the \ntypes of changes \nthat are within and \noutside own scope \nof responsibility \n \n2. Discuss and \ndevelop ideas \nwith others \n2.1 People who could \nprovide input to \nideas for \nimprovements are \nidentified. \n2.2 Ways of \napproaching people \nto begin sharing \nideas are selected. \n2.3 Meeting is set with \nrelevant people. \n2.4 Ideas for follow up \nare review and \nselected based on \nfeedback. \n2.5 Critical inquiry \nmethod is used to \ndiscuss and develop \nideas with others. \n2.1 Roles of \nindividuals in \nsuggesting and \nmaking \nimprovements. \n2.2 Positive impacts \nand challenges in \ninnovation. \n2.3 Types of changes \nand responsibility. \n2.4 Seven habits of \nhighly effective \npeople. \n \n2.1 Identifying \nopportunities to \nimprove and to do \nthings better. \nInvolvement. \n2.2 Identifying the \npositive impacts \nand the challenges \nof change and \ninnovation. \n2.3 Providing \nexamples of the \ntypes of changes \nthat are within and \noutside own scope \nof responsibility \n2.4 Communicating \nideas for change \nthrough small \ngroup discussions \nand meetings.\n\n--- PDF PAGE 25 ---\nManual Metal Arc Welding (MMAW) NC II – MEEMAW221               Promulgated  (9/14/2021)                       21  \n \n \nELEMENTS \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \n \nREQUIRED \nKNOWLEDGE \n \nREQUIRED \nSKILLS \n2. Integrate \nideas for \nchange in \nthe \nworkplace \n3.1 Critical inquiry \nmethod is used to \nintegrate different \nideas for change \nof key people. \n3.2 Summarizing, \nanalyzing and \ngeneralizing skills \nare used to extract \nsalient points in \nthe pool of ideas. \n3.3 Reporting skills \nare likewise used \nto communicate \nresults. \n3.4 Current Issues \nand concerns on \nthe systems, \nprocesses and \nprocedures, as \nwell as the need \nfor simple \ninnovative \npractices are \nidentified. \n \n3.1 Roles of individuals \nin suggesting and \nmaking \nimprovements. \n3.2 Positive impacts \nand challenges in \ninnovation. \n3.3 Types of changes \nand responsibility. \n3.4 Seven habits of \nhighly effective \npeople. \n3.5 Basic research \nskills. \n3.1 Identifying \nopportunities to \nimprove and to do \nthings better. \nInvolvement. \n3.2 Identifying the \npositive impacts \nand the challenges \nof change and \ninnovation. \n3.3 Providing examples \nof the types of \nchanges that are \nwithin and outside \nown scope of \nresponsibility. \n3.4 Communicating \nideas for change \nthrough small \ngroup discussions \nand meetings. \n3.5 Demonstrating \nskills in analysis \nand interpretation \nof data.\n\n--- PDF PAGE 26 ---\nManual Metal Arc Welding (MMAW) NC II – MEEMAW221               Promulgated  (9/14/2021)                       22  \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Innovative practices  \nMay include: \n1.1 \nSelf-directed support \n1.2 \nCommunity based services \n1.3 \nWorking within a collaborative arrangement \n1.4 \nMaking scope of work more efficient \n \n2.  Innovation \nMay include: \n2.1 \nNew ideas \n2.2 \nOriginal ideas \n2.3 \nDifferent ideas \n2.4 \nMethods or tools\n\n--- PDF PAGE 27 ---\nManual Metal Arc Welding (MMAW) NC II – MEEMAW221               Promulgated  (9/14/2021)                       23  \nEVIDENCE GUIDE \n \n1. Critical aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 \nIdentified need for innovation in the area of work  \n1.2 \nRecognized innovative and creative ideas \n1.3 \nPursed agreement for flexible and innovative ways of \nworking \n1.4 \nSupported individuals and people to access flexible and \ninnovative ways of working \n2. Resource \nImplications \nSpecific resources for assessment \n2.1. Evidence of competent performance should be obtained by \nobserving an individual in an information management role \nwithin \nthe \nworkplace \nor \noperational \nor \nsimulated \nenvironment. \n \n3. Methods of \nAssessment \nCompetency in this unit may be assessed through: \n3.1.  Written Test \n3.2.  Interview \nThe unit will be assessed in a holistic manner as is practical \nand may be integrated with the assessment of other \nrelevant units of competency. Assessment will occur over a \nrange of situations, which will include disruptions to normal, \nsmooth operation. Simulation may be required to allow for \ntimely assessment of parts of this unit of competency. \nSimulation should be based on the actual workplace and \nwill include walk through of the relevant competency \ncomponents.  \n \n4. Context for \nAssessment \n4.1  Competency may be assessed individually in the actual \nworkplace or simulation environment in TESDA accredited \ninstitutions\n",
