 of Fusion\n2.12 Under Fill\n2.13 Overlap\n2.14 Misalignment\n2.15 Distortion\n\n--- PDF PAGE 69 ---\nManual Metal Arc Welding (MMAW) NC II – MEEMAW221 Promulgated (9/14/2021) 65\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the\ncandidate:\n1.1 Welded carbon steel pipes in H-LO45(6G)\npositions to acceptable standard following\nthe approved WPS.\n1.2 Observed safety measures applicable to\nworksite operation\n1.3 Communicated effectively with others to\nensure effective work\n1.4 Observed and complied with the productivity\nrequirements\n1.5 Complied with attitudinal work requirements\n2. Resource implications\nThe following resources must be provided:\n2.1 Well ventilated work area/shop with\nappropriate welding machines, accessories,\noven, tools, positioners, jigs and fixtures\n2.2 Supplies and materials\n2.3 PPE,\n2.4 Relevant documentation such as WPS and\n working drawing\n2.5 Fire Extinguishers\n3. Method of assessment\nCompetency must be assessed through:\n3.1 Observation and interview\n3.2 Demonstration and interview\n3.3 Written test\n3.4 Portfolio\n3.5 Nondestructive (NDT) and/or Destructive\n testing(DT) of test coupon\n4. Context of assessment\nCompetency to be assessed while a task is\nbeing undertaken in the workplace or in a\nsimulated workplace setting or at the\ndesignated TESDA Accredited Assessment\nCenter.\n\n--- PDF PAGE 70 ---\nManual Metal Arc Welding (MMAW) NC II – MEEMAW221 Promulgated (9/14/2021) 66"
