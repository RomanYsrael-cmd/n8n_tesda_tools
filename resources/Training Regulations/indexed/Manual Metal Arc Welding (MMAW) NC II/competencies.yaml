        "source_text": "--- PDF PAGE 7 ---\nManual Metal Arc Welding (MMAW) NC II – MEEMAW221               Promulgated  (9/14/2021)                       3  \nSECTION 2 COMPETENCY STANDARDS \n \nThis section gives the details of the contents of the basic, common and core units of \ncompetency required in MANUAL METAL ARC WELDING (MMAW) NC II. \n \n \nBASIC COMPETENCIES \n \nUNIT OF COMPETENCY:    PARTICIPATE IN WORKPLACE COMMUNICATION \n \nUNIT CODE:                           400311210 \n \nUNIT DESCRIPTOR:           This unit covers the knowledge, skills and attitudes   required to \ngather, interpret and convey information in response to \nworkplace requirements. \n \n \n \nELEMENTS \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \n \nREQUIRED \nKNOWLEDGE \n \nREQUIRED \nSKILLS \n1.   Obtain and \nconvey \nworkplace \ninformation \n1.1 Specific and relevant \ninformation is \naccessed from \nappropriate sources  \n1.2 Effective questioning, \nactive listening and \nspeaking skills are \nused to gather and \nconvey information \n1.3 Appropriate medium \nis used to transfer \ninformation and ideas \n1.4 Appropriate non- \nverbal communication \nis used \n1.5 Appropriate lines of \ncommunication with \nsupervisors and \ncolleagues are \nidentified and \nfollowed \n \n1.1 Effective verbal and \nnonverbal \ncommunication \n1.2 Different modes of \ncommunication  \n1.3 Medium of \ncommunication in \nthe workplace \n1.4 Organizational \npolicies \n1.5 Communication \nprocedures and \nsystems \n1.6 Lines of \nCommunication \n1.7 Technology relevant \nto the enterprise and \nthe individual’s work \nresponsibilities  \n1.8 Workplace etiquette \n \n \n1.1 Following simple \n      spoken language \n1.2 Performing routine \nworkplace duties \nfollowing simple \nwritten notices \n1.3 Participating in \nworkplace \nmeetings and \ndiscussions \n1.4 Preparing work-\nrelated \ndocuments \n1.5 Estimating, \ncalculating and \nrecording routine \nworkplace \nmeasures \n1.6 Relating/ \nInteracting with \npeople of various \nlevels in the \nworkplace \n1.7 Gathering and \nproviding basic \ninformation in \nresponse to \nworkplace \nrequirements \n1.8 Basic business \n      writing skills\n\n--- PDF PAGE 8 ---\nManual Metal Arc Welding (MMAW) NC II – MEEMAW221               Promulgated  (9/14/2021)                       4  \n \n \n \n1.6 Defined workplace \n       procedures for the \nlocation and \nstorage of \ninformation are \nused. \n1.7 Personal interaction \nis carried out clearly \nand concisely \n. \n \n19 Interpersonal skills \n     in the workplace \n2.0 Active-listening  \n      skills \n2.  Perform duties \nfollowing \nworkplace \ninstructions   \n2.1 Written notices and \ninstructions are read \nand   interpreted in \naccordance with \norganizational \nguidelines \n2.2 Routine written \ninstruction are \nfollowed based on \nestablished \nprocedures \n2.3 Feedback is given to \nworkplace supervisor \nbased instructions/ \ninformation received \n2.4 Workplace \ninteractions are \nconducted in a \ncourteous manner \n2.5 Where necessary, \nclarifications about \nroutine workplace \nprocedures and \nmatters concerning \nconditions of \nemployment are \nsought and asked \nfrom appropriate  \n     sources  \n2.6 Meetings outcomes \nare interpreted and \nimplemented \n2.1 Effective verbal and \nnon-verbal \ncommunication \n2.2 Different modes of \ncommunication  \n2.3 Medium of \ncommunication in \nthe workplace \n2.4 Organizational/ \nWorkplace policies \n2.5 Communication \nprocedures and \nsystems \n2.6 Lines of \ncommunication \n2.7 Technology \nrelevant to the \nenterprise and the \nindividual’s work \nresponsibilities \n2.8 Effective \nquestioning \ntechniques \n(clarifying and \nprobing) \n2.9 Workplace etiquette \n \n  \n2.1 Following simple \n      spoken instructions  \n2.2 Performing routine \nworkplace duties \nfollowing simple \nwritten notices \n2.3 Participating in \nworkplace \nmeetings and \ndiscussions \n2.4 Completing work-\nrelated documents \n2.5 Estimating, \ncalculating and \nrecording routine \nworkplace \nmeasures \n2.6 Relating/ \nResponding to \npeople of various \nlevels in the \nworkplace \n2.7 Gathering and \nproviding \ninformation in \nresponse to \nworkplace \nrequirements \n2.8 Basic \nquestioning/querying \n2.9 Skills in reading for \ninformation  \n2.10 Skills in locating\n\n--- PDF PAGE 9 ---\nManual Metal Arc Welding (MMAW) NC II – MEEMAW221               Promulgated  (9/14/2021)                       5  \n \n \nELEMENTS \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \n \nREQUIRED \nKNOWLEDGE \n  \nREQUIRED \nSKILLS \n3. Complete \nrelevant \nwork- related \ndocuments \n3.1 Range of forms \nrelating to \nconditions of \nemployment are \ncompleted \naccurately and \nlegibly. \n3.2 Workplace data is \nrecorded on \nstandard \nworkplace forms \nand documents. \n3.3 Errors in recording \ninformation on \nforms/ documents \nare identified and \nacted upon. \n3.4 Reporting \nrequirements to \nsupervisor are \ncompleted \naccording to \norganizational \nguidelines. \n \n3.1 Effective verbal \nand non-verbal \ncommunication \n3.2 Different modes of \ncommunication  \n3.3 Workplace forms \nand documents \n3.4 Organizational/ \nWorkplace \npolicies \n3.5 Communication \nprocedures and \nsystems \n3.6 Technology \nrelevant to the \nenterprise and the \nindividual’s work \nresponsibilities.  \n \n \n3.1 Completing work-\nrelated documents \n3.2 Applying operations \nof addition, \nsubtraction, division \nand multiplication \n3.3 Gathering and \nproviding \ninformation in \nresponse to \nworkplace \nrequirements \n3.4 Effective record \n       keeping skills\n\n--- PDF PAGE 10 ---\nManual Metal Arc Welding (MMAW) NC II – MEEMAW221               Promulgated  (9/14/2021)                       6  \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Appropriate \nsources \nMay include: \n1.1. \nTeam member