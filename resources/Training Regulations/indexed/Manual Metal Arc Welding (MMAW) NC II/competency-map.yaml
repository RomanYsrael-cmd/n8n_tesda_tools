  "source_text": "SECTION 1 MANUAL METAL ARC WELDING (MMAW) NC II\n QUALIFICATION\n\nThe Manual Metal Arc Welding (MMAW) NC II Qualification consists of competencies\nthat a person must achieve to weld carbon steel plates and pipe components as specified\ndrawings, welding procedure specification or oral instructions using MMAW process. MMAW is\nalso known as Shielded Metal Arc Welding (SMAW).\n\n This Qualification conforms with the latest edition of ISO 9606-1: Qualification testing\nof welders — Fusion welding — Part 1: Steels, AWS D 1.1 Structural Welding Code- Steel;\nASME IX (Boiler and Pressure Vessel Code) Welding, Brazing, and Fusing Qualifications; and\nAsian Welding Federation- Common Welders Certification Scheme (AWF-CWCS).\n\nThis Qualification is packaged from the competency map of the Metals and Engineering\nSector as shown in Annex A.\n\nThe units of competency comprising this qualification include the following:\n\nCODE NO.\nBASIC COMPETENCIES\n\n400311210\nParticipate in workplace communication\n400311211\nWork in a team environment\n400311212\nSolve/address general workplace problems\n400311213\n400311214\n400311215\n400311216\n400311217\n400311218\n\nDevelop career and life decisions\nContribute to workplace innovation\nPresent relevant information\nPractice occupational safety and health policies and procedures\nExercise efficient and effective sustainable practices in the workplace\nPractice entrepreneurial skills in the workplace\n\nCODE NO.\nCOMMON COMPETENCIES\nMEE721202\nInterpret Drawings and Sketches\nMEE721210\nPerform Basic Workshop Measurements & Computations\nMEE721211\nContribute to Quality System\nMEE721205\nUse Hand Tools\nMEE721212\nPrepare Materials and Consumables\nInterpret Drawings and Sketches\nPerform Basic Workshop Measurements & Computations\nContribute to Quality Management System\nUse Hand Tools\nPrepare Materials and Consumables\n\nCODE NO.\nMEE721321\nMEE721322\nMEE721324\n\nCORE COMPETENCIES\nSet up Welding Equipment\nPrepare / Fit up Welding Joints\nWeld Carbon Steel Plates and Pipes using MMAW\n\n--- PDF PAGE 6 ---\nManual Metal Arc Welding (MMAW) NC II – MEEMAW221 Promulgated (9/14/2021) 2\n\nA person who has achieved this Qualification is competent to be a –\n\n-\nCarbon Steel Plate/ Pipe Welder (MMAW)\n\n--- PDF PAGE 7 ---\nManual Metal Arc Welding (MMAW) NC II – MEEMAW221 Promulgated (9/14/2021) 3"
