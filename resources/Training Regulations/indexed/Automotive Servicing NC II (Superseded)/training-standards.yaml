ning\n•\nSelf-paced\n(modular)\n•\nDistance\nlearning\n•\nWritten test\n•\nOral\nquestioning\n•\nDirect\nobservation\n•\nProject method\n•\nInterview\n11.Maintain quality\nsystems\n11.1\nConduct final quality check\non completed work/ orders\n11.2\nReport on the quality of\n processes and work\n outcomes\n11.3\nImplement improvements\n to work processes\n•\nLecture/\nDemonstration\n•\nDual training\n•\nSelf-paced\n(modular)\n•\nDistance\nlearning\n•\nWritten test\n•\nOral\nquestioning\n•\nDirect\nobservation\n•\nProject method\n•\nInterview\n12.Provide work\nskill instructions\n12.1\nOrganize instruction and\n demonstration\n12.2\nConduct instruction and\n demonstration\n12.3\nCheck training\nperformance\n12.4\nReview personal training\n performance and finalize\n documentation\n•\nLecture/\nDemonstration\n•\nDual training\n•\nSelf-paced\n(modular)\n•\nDistance\nlearning\n•\nWritten test\n•\nOral\nquestioning\n•\nDirect\nobservation\n•\nProject method\n•\nInterview\n13.Identify and\nselect original\nautomotive parts\nand products\n13.1\nIdentify the part/ product\n and its end use\n13.2\nIdentify details of the part/\n product\n13.3\npart/ product is supplied or\n ordered for customer\n\n•\nLecture/\nDemonstration\n•\nDual training\n•\nSelf-paced\n(modular)\n•\nDistance\nlearning\n•\nWritten test\n•\nOral\nquestioning\n•\nDirect\nobservation\n•\nProject method\n•\nInterview\n\n--- PDF PAGE 98 ---\nAutomotive Servicing NC II (Amended) Promulgated December 2013 96\nCORE COMPETENCIES\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1.\nService\nAutomotive\nBattery\n1.1 Identify and explain the\n operation and safe handling\n of different types of battery\n1.2 Demonstrate the testing of an\nautomobile battery\n1.3 Demonstrate the correct\nprocedure for removing and\nreplacing batteries\n1.4 Demonstrate the correct\nprocedure for servicing and\ncharging batteries\n1.5 Demonstrate the procedure of\n jump starting a battery\n•Demonstration\n• Discussion\n• Dual training\n• Distance\nlearning\n\n•Demonstration\nof practical skills\n• Direct\nobservation\n• Interview\n2. Service\nIgnition\nSystem\n2.1 Identify and explain the function\nof ignition system components\n2.2 Check ignition coil, ballast\nresistor and high-tension cable\nresistance.\n2.2 Check distributor assembly\n•Demonstration\n• Discussion\n• Dual training\n• Distance\nlearning\n•Interview\n• Written\n• Practical\n• Direct\nObservation\n3. Test and\nRepair Wiring/\nLighting\nSystem\n3.1 Explain principle of auto\nelectricity\n3.2 Identify components of auto\nlighting system and explain its\nfunction\n3.3 Install wiring/lighting system\n3.4Test electrical system, identify\nfaults and determine preferred\nrepair action\n3.5 Carry out necessary repairs in\nthe electrical system\n•Demonstration\n• Discussion\n• Dual training\n• Distance\nlearning\n\n•Interview\n• Written\n• Practical\n• Direct\nObservation\n4. Service\nStarting\n System.\n\n4.1 Test starting system\ncomponents and identify faults.\n4.2 Disassemble starter\n4.3 Repair/replace starter\ncomponent/parts\n4.4 Test starting system component\nand identify faults\n4.5 Assemble starter\n•Demonstration\n• Discussion\n• Dual training\n• Distance\nlearning\n\n•Demonstration\nof practical skills\n• Direct\nobservation\n•\nInterview\n5. Service\n Charging\n System.\n\n5.1 Test charging system\ncomponents and identify faults.\n5.2 Disassemble alternator\n5.3 Repair/replace alternator\ncomponent/parts\n5.4 Test charging system\ncomponent and identify faults\n5.5 Assemble alternator\n•Demonstration\n• Discussion\n• Dual training\n• Distance\nlearning\n\n•Demonstration\nof practical skills\n• Direct\nobservation\n• Interview\n6. Service\nEngine\nMechanical\nSystem\n6.1Explain coolant circulation within\ncooling system.\n6.2 Check thermostat condition\n6.3 Perform leakage test on cooling\nsystem\n6.4 Repair/Replace water pump\n6.5 Apply coolant additives\n6.6 Explain oil cycle within the\nengine\n6.7 Identify types, Classifications\nand Applications of engine oil\n6.8 Overhaul oil pump, replace oil\nfitter and change oil\n•Demonstration\n• Discussion\n• Dual training\n• Distance\nlearning\n\n•Written\nexamination\n• Demonstration\nof practical skills\n• Direct\nobservation\n• Interview\n\n--- PDF PAGE 99 ---\nAutomotive Servicing NC II (Amended) Promulgated December 2013 97\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n6.9 Explain Fuel Octane Rating\n6.10 Identify Fuel pump\ntypes/classification\n6.11Perform carburetor adjustment\n6.12 Overhaul carburetor\n6.13 Overhaul turbo charger\n6.14 Check turbo charger operation\n6.15 Overhaul fuel diesel injector\n6.16 Calibrate/Install injector\n•\n7. Service\nClutch System\n\n7.1 Diagnosing clutch failure/\nproblem\n7.2 Pulling out and mounting clutch\ncomponent parts\n7.3 Dismantling/Installing clutch\nmechanism\n7.4 Overhauling hydraulic clutch\nmechanism\n7.5 Performing clutch parts failure\nanalysis\n7.6 Setting/Adjusting clutch\nsystem components\n7.7 Bleeding clutch hydraulic system\n•Demonstration\n• Discussion\n• Dual training\n• Distance\nlearning\n•Demonstration\nof practical skills\n• Direct\nobservation\n• Interview\n8. Service\nDifferential\nand Front\nAxle\n8.1 Inspect drive shaft and joint\nproperly & safety\n8.2 Dismount & mount differential\nassembly properly & safety\n8.3 Dismantle & assemble\ndifferential parts properly &\nsafety\n8.4 Diagnose differential parts\nfailure accurately\n8.5 Set/Adjust differential\ncomponents precisely\n8.6 Overhaul rear/front wheel hub\nproperly & safety\n8.7 Analyze king pin condition\naccurately\n8.8 Inspect/replace I beam\nproperly & safety\n•Demonstration\n• Discussion\n• Dual training\n• Distance\nlearning\n•Demonstration\nof practical skills\n• Direct\nobservation\n• Interview\n\n9. Service\n Steering\n System\n\n9.1 Service steering system.\n9.2 Diagnose power steering\nsystem failure.\n9.3 Adjust/align tie-rod end to\nwheel.\n9.4 Dismantle/Install steering\ncomponent.\n9.5 Conduct wheel alignment.\n•Demonstration\n• Discussion\n• Dual training\n• Distance\nlearning\n•Demonstration\n• Direct\nObservation\n10.Service\nBrake\n System\n10.1 Identify the types of hydraulic\nbrake (hydraulic ABS) and its\ncorresponding component and\nfunction.\n10.2 Explain the operating principle\nof ABS equipped brake.\n10.3 Interpret schematic diagrams\nand circuitry.\n10.4Performed brake system\npreventive maintenance.\n10.5Diagnose brake system failure.\n10.6Performed ABS component\ntesting.\n10.7Pull-out and disassemble\nhydraulic brake component.\n•Demonstration\n• Discussion\n• Dual training\n• Distance\nlearning\n•Written\nexamination\n• Demonstration\nof practical skills\n• Direct\nobservation\n• Interview\n•\n\n--- PDF PAGE 100 ---\nAutomotive Servicing NC II (Amended) Promulgated December 2013 98\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n10.8 Check, assemble and mount\nhydraulic brake component.\n10.9 Use appropriate tools and\ninstrument.\n11. Service\nSuspension\nSystem\n11.1 Identify the types of suspension\nsystem, component and its\noperating principle\n(conventional and air\nsuspension).\n11.2 Diagnose Suspension system\nfailure.\n11.3 Disassemble and assemble\nsuspension system\n(conventional type).\n11.4 Inspect and replace suspension\nsystem component\n(conventional type).\n11.5 Service air suspension system.\n•Demonstration\n• Discussion\n• Dual training\n• Distance\nlearning\n•Written\nexamination\n• Demonstration\nof practical skills\n• Direct\nobservation\n• Interview\n\n12. Perform\nUnder Chassis\nPreventive\nMaintenance\n12.1 Check clutch and brake fluid\nand lines\n12.2 Inspect/change power\ntransmission/different gear oil\n12.3 Inspect/replace power steering\nfluid\n12.4 Check/refill automatic\ntransmission fluid\n12.5 Inspect/bleed air tank\n12.6 Check tire and tire pressure\n12.7 Check under chassis body\nbolts and nuts\n•Demonstration\n• Discussion\n• Dual training\n• Distance\nlearning\n•Interview\n• Practical\n• Direct\nObservation\n\n13. Overhaul\nManual\nTransmission\n\n13.1 Identify types of transmission\nand components.\n13.2 Testing transmission.\n13.3 Pull-out and dismount manual\ntransmission and associate\ncomponent.\n13.4 Disassemble manual\ntransmission.\n13.5 Inspect and check manual\ntransmission component.\n13.6 Assemble manual transmission\ncomponent.\n13.7Install, mount manual\ntransmission and associated\n13.8Test manual transmission\nperformance.\n•Demonstration\n• Discussion\n• Dual training\n• Distance\nlearning\n•Written\nexamination\n• Demonstration\nof practical skills\n• Direct\nobservation\n• Interview\n\n--- PDF PAGE 101 ---\nAutomotive Servicing NC II (Amended) Promulgated December 2013 99"
