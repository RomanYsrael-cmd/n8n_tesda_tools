  "source_section_text": "SECTION 3. TRAINING STANDARDS\n\nThese standards are set to provide technical and vocational education and\ntraining (TVET) providers with information and other important requirements to\nconsider when designing training programs for Automotive Servicing NC II.\n\n3.1 CURRICULUM DESIGN\n\nCourse Title: AUTOMOTIVE SERVICING\n\nNC Level NC II\n\nNominal Training Duration:\n18 Hours (Basic Competencies)\n\n40 Hours (Common Competencies)\n618 Hours (Core Competencies)\n\n676 Hours\n\nCourse Description:\n\nThis course is designed to enhance the knowledge, skills and attitudes of an\nindividual in the field of automotive servicing in accordance with industry\nstandards. It covers specialized competencies such as service automotive\nbattery, service ignition system, Test and Repair Wiring/ Lighting System,\nPerform Under Chassis Preventive Maintenance, Perform Shop Maintenance,\nrepair charging and starting system, service engine mechanical system, service\nand repair clutch system, service and repair differential and front axle, Service\nsteering system, Overhaul Manual Transmission, Service Brake System, Repair\nSuspension System Repair Suspension System. It covers the basic, common\nand core competencies.\n\nThis course is also designed to enhance the basic and common knowledge,\nskills and attitudes of an individual in the field of automotive servicing.\n\nTo obtain this, all units prescribed for this qualification must be achieved.\n\nBASIC COMPETENCIES\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and convey\n workplace information.\n1.2 Complete relevant work related\ndocuments.\n1.3 Participate in workplace\n meeting and discussion.\n• Group\ndiscussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n2. Work in a team\nenvironment\n2.1 Describe and identify team role\nand responsibility in a team.\n2.2 Describe work as a team\n member.\n• Discussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n3. Practice career\nprofessionalis\nm\n3.1 Integrate personal objectives with\norganizational goals.\n3.2 Set and meet work priorities.\n3.3 Maintain professional growth and\ndevelopment.\n• Discussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n4. Practice\noccupational\nhealth and\nsafety\n4.1Evaluate hazard and risks\n4.2 Control hazards and risks\n4.3 Maintain occupational health and\nsafety awareness\n• Discussion\n• Plant tour\n• Symposium\n• Observation\n• Interview\n\n--- PDF PAGE 96 ---\nAutomotive Servicing NC II (Amended) Promulgated December 2013 94\nCOMMON COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1.\nApply\nAppropriate\nSealant/\nAdhesive\n1.1. Identify appropriate sealant/\nadhesive\n1.2. Prepare surface for sealant/\nadhesive application\n1.3. Store unused and dispose\nused sealant/adhesive\n•\nLecture/\nDemonstration\n•\nDual training\n•\nSelf paced\n(modular)\n•\nDistance\nLearning\n\n•\nWritten test\n•\nOral\nquestioning\n•\nDirect\nobservation\n•\nProject method\n•\nInterview\n2.\nMove and\nPosition\nVehicle\n2.1. Prepare vehicle for driving\n2.2. Move and position vehicle\n2.3. Check the vehicle\n•\nLecture/\nDemonstration\n•\nDual training\n•\nSelf paced\n(modular)\n•\nDistance\nLearning\n\n•\nWritten test\n•\nOral\nquestioning\n•\nDirect\nobservation\n•\nProject method\n•\nInterview\n3. Perform\nMensuration\nand\nCalculation\n3.1. Select measuring instrument\nand carry out measurement\nand calculations.\n3.2. Maintain measuring\ninstruments\n•\nLecture/\nDemonstration\n•\nDual training\n•\nSelf paced\n(modular)\n•\nDistance\nLearning\n\n•\nWritten test\n•\nOral\nquestioning\n•\nDirect\nobservation\n•\nProject method\n•\nInterview\n4. Read, Interpret\nand Apply\nSpecifications\nand Manual\n4.1. Identify/accessed manuals\nand interpret data and\nspecification\n4.2 Apply information accessed\nin manual\n4.3 Store manual\n•\nLecture/\nDemonstration\n•\nDual training\n•\nSelf paced\n(modular)\n•\nDistance\nLearning\n\n•\nWritten test\n•\nOral\nquestioning\n•\nDirect\nobservation\n•\nProject method\n•\nInterview\n5.\nUse and Apply\nLubricant/\nCoolant\n5.1. Identify type of\nlubricant/coolant\n5.2 Use and apply lubricant\n\n•\nLecture/\nDemonstration\n•\nDual training\n•\nSelf paced\n(modular)\n•\nDistance\nLearning\n\n•\nWritten test\n•\nOral\nquestioning\n•\nDirect\nobservation\n•\nProject method\n•\nInterview\n6.\nPerform Shop\nMaintenance\n\n6.1 Inspect/clean tools and work\narea\n6.2 Store/arrange tools and shop\nequipment\n6.3 Dispose wastes/used\nlubricants\n6.4 Report damaged\ntools/equipment\n\n•\nLecture/\nDemonstration\n•\nDual training\n•\nSelf paced\n(modular)\n•\nDistance\nLearning\n\n•\nWritten test\n•\nOral\nquestioning\n•\nDirect\nobservation\n•\nProject method\n•\nInterview\n\n--- PDF PAGE 97 ---\nAutomotive Servicing NC II (Amended) Promulgated December 2013 95\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n7.Prepare job\nestimates\n7.1 Identify nature/scope of work\n7.2 Prepare and present estimates\n•\nLecture/\nDemonstration\n•\nDual training\n•\nSelf-paced\n(modular)\n•\nDistance\nlearning\n•\nWritten test\n•\nOral\nquestioning\n•\nDirect\nobservation\n•\nProject method\n•\nInterview\n8. Interpret/Draw\ntechnical\ndrawing\n8.1 Interpret technical drawing\n8.2 Select correct technical\ndrawing\n8.3 Apply freehand sketching\n•\nLecture/\nDemonstration\n•\nDual training\n•\nSelf-paced\n(modular)\n•\nDistance\nlearning\n•\nWritten test\n•\nOral\nquestioning\n•\nDirect\nobservation\n•\nProject method\n•\nInterview\n9.Practice health,\nsafety and\nenvironment\nprocedures\n9.1 Apply basic safety procedures\n9.2 Apply emergency procedures\n•\nLecture/\nDemonstration\n•\nDual training\n•\nSelf-paced\n(modular)\n•\nDistance\nlearning\n•\nWritten test\n•\nOral\nquestioning\n•\nDirect\nobservation\n•\nProject method\n•\nInterview\n10.Inspect\ntechnical quality\nof work\n10.1\nGather information to carry\n out inspection\n10.2\nInspect and apply quality\n standards to work\n10.3\nAchieve quality work\n outcomes\n•\nLecture/\nDemonstration\n•\nDual training\n•\nSelf-paced\n(modular)\n•\nDistance\nlearning\n•\nWritten test\n•\nOral\nquestioning\n•\nDirect\nobservation\n•\nProject method\n•\nInterview\n11.Maintain quality\nsystems\n11.1\nConduct final quality check\non completed work/ orders\n11.2\nReport on the quality of\n processes and work\n outcomes\n11.3\nImplement improvements\n to work processes\n•\nLecture/\nDemonstration\n•\nDual training\n•\nSelf-paced\n(modular)\n•\nDistance\nlearning\n•\nWritten test\n•\nOral\nquestioning\n•\nDirect\nobservation\n•\nProject method\n•\nInterview\n12.Provide work\nskill instructions\n12.1\nOrganize instruction and\n demonstration\n12.2\nConduct instruction and\n demonstration\n12.3\nCheck training\nperformance\n12.4\nReview personal training\n performance and finalize\n documentation\n•\nLecture/\nDemonstration\n•\nDual training\n•\nSelf-paced\n(modular)\n•\nDistance\nlearning\n•\nWritten test\n•\nOral\nquestioning\n•\nDirect\nobservation\n•\nProject method\n•\nInterview\n13.Identify and\nselect original\nautomotive parts\nand products\n13.1\nIdentify the part/ product\n and its end use\n13.2\nIdentify details of the part/\n product\n13.3\npart/ product is supplied or\n ordered for customer\n\n•\nLecture/\nDemonstration\n•\nDual training\n•\nSelf-paced\n(modular)\n•\nDistance\nlearning\n•\nWritten test\n•\nOral\nquestioning\n•\nDirect\nobservation\n•\nProject method\n•\nInterview\n\n--- PDF PAGE 98 ---\nAutomotive Servicing NC II (Amended) Promulgated December 2013 96\nCORE COMPETENCIES\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1.\nService\nAutomotive\nBattery\n1.1 Identify and explain the\n operation and safe handling\n of different types of battery\n1.2 Demonstrate the testing of an\nautomobile battery\n1.3 Demonstrate the correct\nprocedure for removing and\nreplacing batteries\n1.4 Demonstrate the correct\nprocedure for servicing and\ncharging batteries\n1.5 Demonstrate the procedure of\n jump starting a battery\n•Demonstration\n• Discussion\n• Dual training\n• Distance\nlearning\n\n•Demonstration\nof practical skills\n• Direct\nobservation\n• Interview\n2. Service\nIgnition\nSystem\n2.1 Identify and explain the function\nof ignition system components\n2.2 Check ignition coil, ballast\nresistor and high-tension cable\nresistance.\n2.2 Check distributor assembly\n•Demonstration\n• Discussion\n• Dual training\n• Distance\nlearning\n•Interview\n• Written\n• Practical\n• Direct\nObservation\n3. Test and\nRepair Wiring/\nLighting\nSystem\n3.1 Explain principle of auto\nelectricity\n3.2 Identify components of auto\nlighting system and explain its\nfunction\n3.3 Install wiring/lighting system\n3.4Test electrical system, identify\nfaults and determine preferred\nrepair action\n3.5 Carry out necessary repairs in\nthe electrical system\n•Demonstration\n• Discussion\n• Dual training\n• Distance\nlearning\n\n•Interview\n• Written\n• Practical\n• Direct\nObservation\n4. Service\nStarting\n System.\n\n4.1 Test starting system\ncomponents and identify faults.\n4.2 Disassemble starter\n4.3 Repair/replace starter\ncomponent/parts\n4.4 Test starting system component\nand identify faults\n4.5 Assemble starter\n•Demonstration\n• Discussion\n• Dual training\n• Distance\nlearning\n\n•Demonstration\nof practical skills\n• Direct\nobservation\n•\nInterview\n5. Service\n Charging\n System.\n\n5.1 Test charging system\ncomponents and identify faults.\n5.2 Disassemble alternator\n5.3 Repair/replace alternator\ncomponent/parts\n5.4 Test charging system\ncomponent and identify faults\n5.5 Assemble alternator\n•Demonstration\n• Discussion\n• Dual training\n• Distance\nlearning\n\n•Demonstration\nof practical skills\n• Direct\nobservation\n• Interview\n6. Service\nEngine\nMechanical\nSystem\n6.1Explain coolant circulation within\ncooling system.\n6.2 Check thermostat condition\n6.3 Perform leakage test on cooling\nsystem\n6.4 Repair/Replace water pump\n6.5 Apply coolant additives\n6.6 Explain oil cycle within the\nengine\n6.7 Identify types, Classifications\nand Applications of engine oil\n6.8 Overhaul oil pump, replace oil\nfitter and change oil\n•Demonstration\n• Discussion\n• Dual training\n• Distance\nlearning\n\n•Written\nexamination\n• Demonstration\nof practical skills\n• Direct\nobservation\n• Interview\n\n--- PDF PAGE 99 ---\nAutomotive Servicing NC II (Amended) Promulgated December 2013 97\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n6.9 Explain Fuel Octane Rating\n6.10 Identify Fuel pump\ntypes/classification\n6.11Perform carburetor adjustment\n6.12 Overhaul carburetor\n6.13 Overhaul turbo charger\n6.14 Check turbo charger operation\n6.15 Overhaul fuel diesel injector\n6.16 Calibrate/Install injector\n•\n7. Service\nClutch System\n\n7.1 Diagnosing clutch failure/\nproblem\n7.2 Pulling out and mounting clutch\ncomponent parts\n7.3 Dismantling/Installing clutch\nmechanism\n7.4 Overhauling hydraulic clutch\nmechanism\n7.5 Performing clutch parts failure\nanalysis\n7.6 Setting/Adjusting clutch\nsystem components\n7.7 Bleeding clutch hydraulic system\n•Demonstration\n• Discussion\n• Dual training\n• Distance\nlearning\n•Demonstration\nof practical skills\n• Direct\nobservation\n• Interview\n8. Service\nDifferential\nand Front\nAxle\n8.1 Inspect drive shaft and joint\nproperly & safety\n8.2 Dismount & mount differential\nassembly properly & safety\n8.3 Dismantle & assemble\ndifferential parts properly &\nsafety\n8.4 Diagnose differential parts\nfailure accurately\n8.5 Set/Adjust differential\ncomponents precisely\n8.6 Overhaul rear/front wheel hub\nproperly & safety\n8.7 Analyze king pin condition\naccurately\n8.8 Inspect/replace I beam\nproperly & safety\n•Demonstration\n• Discussion\n• Dual training\n• Distance\nlearning\n•Demonstration\nof practical skills\n• Direct\nobservation\n• Interview\n\n9. Service\n Steering\n System\n\n9.1 Service steering system.\n9.2 Diagnose power steering\nsystem failure.\n9.3 Adjust/align tie-rod end to\nwheel.\n9.4 Dismantle/Install steering\ncomponent.\n9.5 Conduct wheel alignment.\n•Demonstration\n• Discussion\n• Dual training\n• Distance\nlearning\n•Demonstration\n• Direct\nObservation\n10.Service\nBrake\n System\n10.1 Identify the types of hydraulic\nbrake (hydraulic ABS) and its\ncorresponding component and\nfunction.\n10.2 Explain the operating principle\nof ABS equipped brake.\n10.3 Interpret schematic diagrams\nand circuitry.\n10.4Performed brake system\npreventive maintenance.\n10.5Diagnose brake system failure.\n10.6Performed ABS component\ntesting.\n10.7Pull-out and disassemble\nhydraulic brake component.\n•Demonstration\n• Discussion\n• Dual training\n• Distance\nlearning\n•Written\nexamination\n• Demonstration\nof practical skills\n• Direct\nobservation\n• Interview\n•\n\n--- PDF PAGE 100 ---\nAutomotive Servicing NC II (Amended) Promulgated December 2013 98\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n10.8 Check, assemble and mount\nhydraulic brake component.\n10.9 Use appropriate tools and\ninstrument.\n11. Service\nSuspension\nSystem\n11.1 Identify the types of suspension\nsystem, component and its\noperating principle\n(conventional and air\nsuspension).\n11.2 Diagnose Suspension system\nfailure.\n11.3 Disassemble and assemble\nsuspension system\n(conventional type).\n11.4 Inspect and replace suspension\nsystem component\n(conventional type).\n11.5 Service air suspension system.\n•Demonstration\n• Discussion\n• Dual training\n• Distance\nlearning\n•Written\nexamination\n• Demonstration\nof practical skills\n• Direct\nobservation\n• Interview\n\n12. Perform\nUnder Chassis\nPreventive\nMaintenance\n12.1 Check clutch and brake fluid\nand lines\n12.2 Inspect/change power\ntransmission/different gear oil\n12.3 Inspect/replace power steering\nfluid\n12.4 Check/refill automatic\ntransmission fluid\n12.5 Inspect/bleed air tank\n12.6 Check tire and tire pressure\n12.7 Check under chassis body\nbolts and nuts\n•Demonstration\n• Discussion\n• Dual training\n• Distance\nlearning\n•Interview\n• Practical\n• Direct\nObservation\n\n13. Overhaul\nManual\nTransmission\n\n13.1 Identify types of transmission\nand components.\n13.2 Testing transmission.\n13.3 Pull-out and dismount manual\ntransmission and associate\ncomponent.\n13.4 Disassemble manual\ntransmission.\n13.5 Inspect and check manual\ntransmission component.\n13.6 Assemble manual transmission\ncomponent.\n13.7Install, mount manual\ntransmission and associated\n13.8Test manual transmission\nperformance.\n•Demonstration\n• Discussion\n• Dual training\n• Distance\nlearning\n•Written\nexamination\n• Demonstration\nof practical skills\n• Direct\nobservation\n• Interview\n\n--- PDF PAGE 101 ---\nAutomotive Servicing NC II (Amended) Promulgated December 2013 99\n3.2 TRAINING DELIVERY\n\nThe delivery of training should adhere to the design of the curriculum.\nDelivery should be guided by the 10 basic principles of competency-based\nTVET.\n\n•\nThe training is based on curriculum developed from the competency\nstandards;\n•\nLearning is modular in its structure;\n•\nTraining delivery is individualized and self-paced;\n•\nTraining is based on work that must be performed;\n•\nTraining materials are directly related to the competency standards\nand the curriculum modules;\n•\nAssessment is based in the collection of evidence of the performance\nof work to the industry required standard;\n•\nTraining is based both on and off-the-job components;\n•\nAllows for recognition of prior learning (RPL) or current competencies;\n•\nTraining allows for multiple entry and exit; and\n•\nApproved training programs are nationally accredited.\n\nThe competency-based TVET system recognizes various types of\ndelivery modes, both on and off-the-job as long as the learning is driven by\nthe competency standards specified by the industry. The following training\nmodalities may be adopted when designing training programs:\n\n• The dualized mode of training delivery is preferred and recommended.\nThus programs would contain both in-school and in-industry training or\nfieldwork components. Details can be referred to the Dual Training\nSystem (DTS) Implementing Rules and Regulations.\n• Modular/self-paced learning is a competency-based training modality\nwherein the trainee is allowed to progress at his own pace. The trainer\nfacilitates the training delivery\n• Peer teaching/mentoring is a training modality wherein fast learners are\ngiven the opportunity to assist the slow learners.\n• Supervised industry training or on-the-job training is an approach in\ntraining designed to enhance the knowledge and skills of the trainee\nthrough actual experience in the workplace to acquire specific\ncompetencies prescribed in the training regulations.\n• Distance learning is a formal education process in which majority of the\ninstruction occurs when the students and instructor are not in the same\nplace. Distance learning may employ correspondence study, or audio,\nvideo or computer technologies.\n\n--- PDF PAGE 102 ---\nAutomotive Servicing NC II (Amended) Promulgated December 2013 100\n3.3 TRAINEE ENTRY REQUIREMENTS\n\nTrainees or students should possess the following requirements:\n\n• can communicate both oral and written;\n• can perform basic mathematical computation.\n\nThis list does not include specific institutional requirements such as\neducational attainment, appropriate work experience, and others that may\nbe required of the trainees by the school or training center delivering the\nTVET program.\n\n3.4 TOOLS, EQUIPMENT AND MATERIALS\nAUTOMOTIVE SERVICING – NC II\n\nRecommended list of tools, equipment and materials for the training of 20\ntrainees for Automotive Servicing – NC II\nTOOLS\nEQUIPMENT\nMATERIALS\nQTY\nQTY\nQTY\n4 sets\n•\nBox wrench\n2\nunits\n•\nMotor Vehicle\n50 ltrs.\n•\nEngine oil\n4 sets\n•\nSocket wrench\n2\nunits\n•\nEngine\n10 ltrs.\n•\nGrease\n4 sets\n•\nPliers\n2\nunits\n•\nHydraulic\njack/lift\n10 ltrs.\n•\nSealant\n/adhesive\n4 sets\n•\nScrew driver\n4\nunits\n•\nGrowler tester\n50 ltrs.\n•\nHydraulic\noils/gear oil\n4 sets\n•\nWire stripper\n4\nunits\n•\nIgnition timing\nlight\n50 ltrs.\n•\nAutomatic\ntransmission\nfluid\n4 sets\n•\nMechanic’s\nhammer\n4\nunits\n•\nTachometer\n10 pcs. •\nWheel\nwedges\n20 pcs.\n•\nApron\n4\nunits\n•\nDifferential and\nfront axle\n10 pcs. •\nTest lamp\n20 pcs.\n•\nGoggle\n4\nunits\n•\nMultimeter\n\n20 pcs.\n•\nGlove\n\n4 sets\n•\nTorque wrench\n\n4 sets\n•\nFeeler gauge\n\n4 sets\n•\nBattery tester\n\n4 sets\n•\nHydrometer\n\n4 sets\n•\nDial gauge\n\n4 sets\n•\nBore gauge\n\n4 sets\n•\nMicrometer\ncaliper\n\n--- PDF PAGE 103 ---\nAutomotive Servicing NC II (Amended) Promulgated December 2013 101\n3.5 TRAINING FACILITIES\nAUTOMOTIVE SERVICING – NC II\n\nThe automotive workshop must be made of reinforced concrete or steel\nstructure. The size must be suited on the requirements of the competencies.\nThe class size of 25 students/trainees is reserved for the lecture room and the\npractical demonstration area for carrying out servicing of minor automotive\nparts. Most of the learning activities such as on-vehicle servicing are performed\nin the workshop.\nSPACE\nREQUIREMENT\nSIZE IN\nMETERS\nAREA IN SQ.\nMETERS\nTOTAL AREA IN\nSQ. METERS\n• Building\n(permanent)\n12.00 x 32.00\n-\n384.00\n• Student/Trainee\nWorking Space\n2.50 x 2.50 per\nstudent/trainee\n6.25 per\nstudent\n156.25\n• Contextual\nLearning\nLaboratory\n4.00 x 5.00\n20.00\n20.00\n•\nLecture Room\n4.00 x 7.00\n28.00\n28.00\n• Learning Resource\nCenter\n4.00 x 5.00\n20.00\n20.00\n• Facilities/Equipment\n/Circulation Area\n-\n-\n159.75\n\n3.6 TRAINERS’ QUALIFICATION\n\nAUTOMOTIVE/LAND TRANSPORT SECTOR\nAUTOMOTIVE SERVICING – NC II\n\n• Holder of National TVET Trainers Certificate (NTTC) Level 1 -\nAutomotive Servicing NC II\n• Must be computer literate\n• *Must have at least 2 years job/industry experience\n\n3.7 INSTITUTIONAL ASSESSMENT\n\nInstitutional assessment is undertaken by trainees to determine their\nachievement of units of competency. A certificate of achievement is issued\nfor each unit of competency.\n\n--- PDF PAGE 104 ---\nAutomotive Servicing NC II (Amended) Promulgated December 2013 102"
