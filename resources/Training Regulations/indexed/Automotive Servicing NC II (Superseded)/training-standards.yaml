    "source_text": "3.1 CURRICULUM DESIGN\n\nCourse Title: AUTOMOTIVE SERVICING\n\nNC Level NC II\n\nNominal Training Duration:\n18 Hours (Basic Competencies)\n\n40 Hours (Common Competencies)\n618 Hours (Core Competencies)\n\n676 Hours\n\nCourse Description:\n\nThis course is designed to enhance the knowledge, skills and attitudes of an\nindividual in the field of automotive servicing in accordance with industry\nstandards. It covers specialized competencies such as service automotive\nbattery, service ignition system, Test and Repair Wiring/ Lighting System,\nPerform Under Chassis Preventive Maintenance, Perform Shop Maintenance,\nrepair charging and starting system, service engine mechanical system, service\nand repair clutch system, service and repair differential and front axle, Service\nsteering system, Overhaul Manual Transmission, Service Brake System, Repair\nSuspension System Repair Suspension System. It covers the basic, common\nand core competencies.\n\nThis course is also designed to enhance the basic and common knowledge,\nskills and attitudes of an individual in the field of automotive servicing.\n\nTo obtain this, all units prescribed for this qualification must be achieved.\n\nBASIC COMPETENCIES\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and convey\n workplace information.\n1.2 Complete relevant work related\ndocuments.\n1.3 Participate in workplace\n meeting and discussion.\n• Group\ndiscussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n2. Work in a team\nenvironment\n2.1 Describe and identify team role\nand responsibility in a team.\n2.2 Describe work as a team\n member.\n• Discussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n3. Practice career\nprofessionalis\nm\n3.1 Integrate personal objectives with\norganizational goals.\n3.2 Set and meet work priorities.\n3.3 Maintain professional growth and\ndevelopment.\n• Discussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n4. Practice\noccupational\nhealth and\nsafety\n4.1Evaluate hazard and risks\n4.2 Control hazards and risks\n4.3 Maintain occupational health and\nsafety awareness\n• Discussion\n• Plant tour\n• Symposium\n• Observation\n• Interview\n\n--- PDF PAGE 96 ---\nAutomotive Servicing NC II (Amended) Promulgated December 2013 94\nCOMMON COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1.\nApply\nAppropriate\nSealant/\nAdhesive\n1.1. Identify appropriate sealant/\nadhesive\n1.2. Prepare surface for sealant/\nadhesive application\n1.3. Store unused and dispose\nused sealant/adhesive\n•\nLecture/\nDemonstration\n•\nDual training\n•\nSelf paced\n(modular)\n•\nDistance\nLearning\n\n•\nWritten test\n•\nOral\nquestioning\n•\nDirect\nobservation\n•\nProject method\n•\nInterview\n2.\nMove and\nPosition\nVehicle\n2.1. Prepare vehicle for driving\n2.2. Move and position vehicle\n2.3. Check the vehicle\n•\nLecture/\nDemonstration\n•\nDual training\n•\nSelf paced\n(modular)\n•\nDistance\nLearning\n\n•\nWritten test\n•\nOral\nquestioning\n•\nDirect\nobservation\n•\nProject method\n•\nInterview\n3. Perform\nMensuration\nand\nCalculation\n3.1. Select measuring instrument\nand carry out measurement\nand calculations.\n3.2. Maintain measuring\ninstruments\n•\nLecture/\nDemonstration\n•\nDual training\n•\nSelf paced\n(modular)\n•\nDistance\nLearning\n\n•\nWritten test\n•\nOral\nquestioning\n•\nDirect\nobservation\n•\nProject method\n•\nInterview\n4. Read, Interpret\nand Apply\nSpecifications\nand Manual\n4.1. Identify/accessed manuals\nand interpret data and\nspecification\n4.2 Apply information accessed\nin manual\n4.3 Store manual\n•\nLecture/\nDemonstration\n•\nDual training\n•\nSelf paced\n(modular)\n•\nDistance\nLearning\n\n•\nWritten test\n•\nOral\nquestioning\n•\nDirect\nobservation\n•\nProject method\n•\nInterview\n5.\nUse and Apply\