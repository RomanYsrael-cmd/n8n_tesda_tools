      "source_text": "SECTION 3. TRAINING STANDARDS\n\nThese standards are set to provide technical and vocational education and\ntraining (TVET) providers with information and other important requirements to\nconsider when designing training programs for Automotive Servicing NC II.\n\n3.1 CURRICULUM DESIGN\n\nCourse Title: AUTOMOTIVE SERVICING\n\nNC Level NC II\n\nNominal Training Duration:\n18 Hours (Basic Competencies)\n\n40 Hours (Common Competencies)\n618 Hours (Core Competencies)\n\n676 Hours\n\nCourse Description:\n\nThis course is designed to enhance the knowledge, skills and attitudes of an\nindividual in the field of automotive servicing in accordance with industry\nstandards. It covers specialized competencies such as service automotive\nbattery, service ignition system, Test and Repair Wiring/ Lighting System,\nPerform Under Chassis Preventive Maintenance, Perform Shop Maintenance,\nrepair charging and starting system, service engine mechanical system, service\nand repair clutch system, service and repair differential and front axle, Service\nsteering system, Overhaul Manual Transmission, Service Brake System, Repair\nSuspension System Repair Suspension System. It covers the basic, common\nand core competencies.\n\nThis course is also designed to enhance the basic and common knowledge,\nskills and attitudes of an individual in the field of automotive servicing.\n\nTo obtain this, all units prescribed for this qualification must be achieved.\n\nBASIC COMPETENCIES\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and convey\n workplace information.\n1.2 Complete relevant work related\ndocuments.\n1.3 Participate in workplace\n meeting and discussion.\n• Group\ndiscussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n2. Work in a team\nenvironment\n2.1 Describe and identify team role\nand responsibility in a team.\n2.2 Describe work as a team\n 