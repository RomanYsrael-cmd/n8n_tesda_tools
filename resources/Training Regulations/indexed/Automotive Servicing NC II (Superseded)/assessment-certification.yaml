  "source_text": "SECTION 4 NATIONAL ASSESSMENT AND CERTIFICATION\nARRANGEMENTS\n\n4.1\nTo attain the National Qualification of Automotive Servicing NC II, the\ncandidate must demonstrate competence through project-type assessment\ncovering all the units listed in Section 1. Successful candidates shall be\nawarded a National Certificate signed by the TESDA Director General.\n\n4.2\nIndividual aspiring to be awarded the qualification of Automotive Servicing NC\nII must acquire Certificates of Competency in all the following core units of the\nQualification. Candidates may apply for assessment in any accredited\nassessment center.\n\n4.2.1 Service Engine Component\n\n Service Engine Mechanical Components\n\n4.2.2 Service Automotive Electrical Components\n\nService Automotive Battery\n\nService Ignition System\n\nTest and Repair Wiring/Lighting System\n\nService Starting System\n\nService Charging System\n\n4.2.3 Service Underchassis Components\n\nPerform Underchassis Preventive Maintenance\n\nService Steering System\n\nService Brake System\n\nService Suspension System\n\n4.2.4 Service Powertrain Components\n\nService Clutch System\n\nService Differential and Front Axle\n\nOverhaul Manual Transmission\n\nSuccessful candidates shall be awarded Certificates of Competency (COC).\n\n4.3 Accumulation and submission of all COCs acquired for the relevant units of\ncompetency comprising a qualification, an individual shall be issued the\ncorresponding National Certificate.\n\n4.4 Assessment shall focus on the core units of competency. The basic and\ncommon units shall be integrated or assessed concurrently with the core units.\n\n4.5 The following are qualified to apply for assessment and certification:\n\n4.5.1 Graduates of formal, non-formal and informal including enterprise-based\ntraining programs.\n\n4.5.2 Experienced workers (wage employed or self employed)\n\n4.6 The guidelines on assessment and certification are discussed in detail in the\n\"Procedures Manual on Assessment and Certification\" and \" Guidelines on\nthe Implementation of the Philippine TVET Qualification and Certification\nSystem (PTOQCS)\".\n\n--- PDF PAGE 105 ---\nAutomotive Servicing NC II (Amended) Promulgated December 2013 103\n\n--- PDF PAGE 106 ---\nAutomotive Servicing NC II (Amended) Promulgated December 2013 104\n"
}
