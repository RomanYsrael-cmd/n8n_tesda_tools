        "source_title": "SERVICE CLUTCH SYSTEM",
        "source_text": "--- PDF PAGE 74 ---\nAutomotive Servicing NC II  (Amended)                  Promulgated December 2013                     72 \nUNIT OF COMPETENCY: SERVICE CLUTCH SYSTEM  \n \nUNIT CODE: ALT723310 \n \nUNIT DESCRIPTOR: This unit deals with servicing clutch system. It also  \ninclude repairing and replacing the damaged \nparts/components of the system. \n \n \nELEMENT \n \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n(Note: All standard of performance for Service Clutch System is in \naccordance with company standard operating procedure and \nmanufacturer’s specification Manuals using specified tools and \nequipment.)\n1. Diagnose clutch \nfailure/problem \n1.1 Clutch should engage/disengage engine and   \n      transmission smoothly \n2. Pull-out and \nmount clutch  \nComponent \nparts \n2.1 Clutch is dismounted \n \n2.2 Damaged parts is replaced  \n \n2.3 Clutch is mounted\n3. Overhaul \nhydraulic clutch \nmechanism \n \n \n3.1 Worn out Rubber cups and “O” rings replaced as  \n      per prescribed procedure \n \n3.2 Scored Master cylinder is replaced \n \n3.3 Valve checked for damage \n \n3.4 Hydraulic clutch mechanism is replaced \n \n3.5 Master cylinder, slave, booster tested \n4. Perform clutch \nparts failure \nanalysis\n4.1 Clutch failure identified accurately and corresponding  \n      repair recommended \n5. Set/Adjust \nclutch system \ncomponents \n5.1 Clutch pedal free play is set  \n \n5.2 Special service tools is used  \n6. Bleed clutch \nhydraulic \nsystem \n6.1 Checking of fluid leakage and level are checked \n \n6.2 Clutch hydraulic system bled.\n\n--- PDF PAGE 75 ---\nAutomotive Servicing NC II  (Amended)                  Promulgated December 2013                     73 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Clutch System  \nMay include: \n1.1 Pressure plate assembly  \n1.2 Clutch Disk Assembly \n1.3 Mechanical Clutch Linkage \n1.4 Hydraulic Clutch Linkage \n2. Manuals \nMay include: \n2.1 Manufacturer specification manual \n2.2 Maintenance Procedure Manual \n2.3 Periodic Maintenance Data \n2.4 Service and Repair Manual Parts Checklist\n3. Company \nstandard \noperating \nprocedure \nMay include: \n3.1 Job Order \n3.2 Requisition slip \n3.3 Wearing of personal protective equipment such as \n\nGloves, Apron, Safety shoes, Skull guard\n4. Tools and \nequipment  \nMay include: \n4.1 Hydraulic lifter/Mechanical lifter \n4.2 Support stand \n4.3 Transmission  jack \n4.4 Basic Handtools set \n4.5 Clutch centering guide \n4.6 Snap ring pliers (in/out)\n5. Clutch failure / \nProblems \nMay include: \n5.1 pedal goes to floorboard when depressed \n5.2 slips when engaged \n5.3 spine or drags while engaged \n5.4 chatters or grabs while being engaged \n5.5 related vibration \n5.6 area noises \n5.7 pedal pulsation\n\n--- PDF PAGE 76 ---\nAutomotive Servicing NC II  (Amended)                  Promulgated December 2013                     74 \nEVIDENCE GUIDE \n \n1. Critical aspects \nof competency \nAssessment requires evidence that the candidate: \n1.1 Serviced Clutch system \n1.2 Repaired/Replaced clutch system components or parts \n2. Required \nknowledge  \n2.1 Clutch system types, components, function and operation \n2.2 Clutch system adjustment \n2.3 Handling of special tools for dismantling clutch system  \n       components \n2.4 Hydraulic clutch mechanism function and operation \n2.5 Precaution in handling hydraulic fluids and special tools \n2.6 Positive Work Values (Patience, Honesty, Perseverance, \nAttention to Details) \n2.7Quality procedures, e.g., 5S \n2.8 Environmental-conservation procedures,  \n      e.g., 3R (reduce, reuse, recycle) \n3. Required skills \n3.1 Access, interpret and apply technical information \n3.2 Use of relevant tools and equipment \n3.3 Remove and replace clutch mechanism \n3.4 Overhauling hydraulic clutch mechanism \n3.5 Testing master cylinder, clutch  slave and booster \n3.6 Setting adjusting clutch components \n3.7 Apply personal safety procedures \n3.8 Maintain customer records\n4. Resource \nimplications \nThe following resources should be provided: \n4.1 Workplace: Real or simulated work area \n4.2 Appropriate tools and equipment  \n4.3 Materials relevant to the proposed activity and tasks \n4.4 Manufacturer’s repair manual\n5. Method of \nassessment \nCompetency in this unit may be assessed through:  \n5.1 Direct observation with Questioning  \n5.2 Interview \n6. Context for \nassessment \n6.1 Competency must be assessed on the job or  \n      simulated environment. \n6.2 The assessment of practical skills must take place after a  \n      period of supervised practice and repetitive experience.\n",
