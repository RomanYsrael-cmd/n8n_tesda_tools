  "source_section_text": "Section 1. Successful candidates shall be\nawarded a National Certificate signed by the TESDA Director General.\n\n4.2\nIndividual aspiring to be awarded the qualification of Automotive Servicing NC\nII must acquire Certificates of Competency in all the following core units of the\nQualification. Candidates may apply for assessment in any accredited\nassessment center.\n\n4.2.1 Service Engine Component\n\n Service Engine Mechanical Components\n\n4.2.2 Service Automotive Electrical Components\n\nService Automotive Battery\n\nService Ignition System\n\nTest and Repair Wiring/Lighting System\n\nService Starting System\n\nService Charging System\n\n4.2.3 Service Underchassis Components\n\nPerform Underchassis Preventive Maintenance\n\nService Steering System\n\nService Brake System\n\nService Suspension System\n\n4.2.4 Service Powertrain Components\n\nService Clutch System\n\nService Differential and Front Axle\n\nOverhaul Manual Transmission\n\nSuccessful candidates shall be awarded Certificates of Competency (COC).\n\n4.3 Accumulation and submission of all COCs acquired for the relevant units of\ncompetency comprising a qualification, an individual shall be issued the\ncorresponding National Certificate.\n\n4.4 Assessment shall focus on the core units of competency. The basic and\ncommon units shall be integrated or assessed concurrently with the core units.\n\n4.5 The following are qualified to apply for assessment and certification:\n\n4.5.1 Graduates of formal, non-formal and informal including enterprise-based\ntraining programs.\n\n4.5.2 Experienced workers (wage employed or self employed)\n\n4.6 The guidelines on assessment and certification are discussed in detail in the\n\"Procedures Manual on Assessment and Certification\" and \" Guidelines on\nthe Implementation of the Philippine TVET Qualification and Certification\nSystem (PTOQCS)\".\n\n--- PDF PAGE 105 ---\nAutomotive Servicing NC II (Amended) Promulgated December 2013 103\n\n--- PDF PAGE 106 ---\nAutomotive Servicing NC II (Amended) Promulgated December 2013 104\nDEFINITION OF TERMS\n\n1. Light Duty Vehicles\nThese are motor vehicles whose gross vehicle weight is\nequal or less than 3,500 kgs. Powered by a gas or diesel\nengine.\n\n2. Automotive Service\nTechnician\nRefers to an all around auto serviceman that can perform\nboth mechanical and electrical as well as auto electronics\nmaintenance checking and inspection of motor vehicle.\nAssesses\nvehicle\nproblems,\nperform\nall\nnecessary\ndiagnostic test or installation of accessories and competently\nrepairs or replaces faulty parts.\n\n3. Adhesives\nSubstance used to hold gasket in place during assembly. It\nalso maintains a tight seal by filling in small irregularities on\na surface and prevents gasket from shifting due to vibration.\n\n4. Anti-Lock Braking\nSystem\n\nSystem that automatically controls wheel slip or prevents\nsustained wheel locking on braking\n5. Automatic\nTransmission\nA transmission in which gear or ratio changes are self-\nactivated, eliminating the necessity of hand shifting gears\n\n6. Backlash\nThe amount of clearance or play between two meshed gears\n\n7. Catalytic Converter\n\nEmission The control device fitted in the exhaust system of\nan internal combustion engine. The converter reduces the\ntoxicity of products of combustion by catalytic re-\ncombination\n\n8. Charcoal Canister\nTrap containing charcoal granules to store fuel evaporating\nfrom a fuel system and prevent its loss to atmosphere,\nparticularly from a carburetor and fuel tank.\n9. Electronics\nElectrical assemblies, circuit and system that use electronic\ndevices such as transistors and diodes.\n\n10. Emissions\nAny air contaminant, pollutant, gas stream from a known\nsource which is introduced into the atmosphere.\n\n11. Final Drive\nThe end of the drive train before power is transmitted\nto the wheels.\n12. Fuel Injection\nAn electronic system that increases the performance ad fuel\neconomy because it monitors engine conditions and\nprovides the correct air/fuel mixture based on the engine’s\ndemand. It injects fuel directly into the cylinder head\nenabling more precise control over the quantity used.\n13. Governor\n\nA speed sensing device that employs centrifugal force and\nspring tension to govern engine speed.\n14. Hotchkiss Drive\nThe type of rear suspension in which leaf springs absorbs\nthe rear axle housing torque.\n15. Intake Manifold\n\nTubing attached to the engine through which the air/fuel\nmixture reaches the cylinder.\n\n--- PDF PAGE 107 ---\nAutomotive Servicing NC II (Amended) Promulgated December 2013 105\n16. Ignition System\nElectrical system devised to produce timed sparks from\nengine spark plug. Consisting of a battery, induction coil,\ncapacitor, distributor, spark plugs and relevant switches and\nwiring.\n17. Master Cylinder\nThe liquid-filled cylinder in the hydraulic brake system or\nclutch, where hydraulic pressure is developed when\ndepresses a foot pedal.\n18. Periodic\nMaintenance\nService\nThe regular servicing prescribed by manufacturer to\nmaintain the vehicle’s top performance.\n\n19. Positive Crank\nVentilation\nEmission control system that prevents crank case gases\nfrom entering the atmosphere, usually by drawing the gases\nfrom the crank case and feeding them into the engine’s\ninduction system.\n20. Power Steering\nSteering that has been designed to make the wheel move\nmore easily than in a manual steering system. Hydraulic\nassists the process utilizing hydraulic fluid. The fluid\nincreases pressure in the power steering pump and aids in\nthe movement of the steering mechanism. This fluid, called\npower steering fluid, is what is replaced at regular intervals\nto keep steering soft and comfortable.\n21. Super Charged\nEngine\nAn engine that is similar to a turbo-charged engine which\nuses a series of belts or chains from the crankshaft to turn\nthe turbines that forces the air/fuel mixture into the cylinder\nheads under pressure creating a bigger explosion which\ngenerates more power. A turbocharger uses the exhaust\ngases to turn the turbines to create the same effect.\n22. Transaxle\nType of construction in which the transmission and\ndifferential are combined in one unit.\n23. Thermostat\nA device for automatic regulation of temperature\n24. Turbo Charged\nEngine\nA performance-increasing turbine positioned in the exhaust\nsystem. Expanding exhaust gases spin an impeller (very\nsmall fan-type blades) at speeds up to 25 thousand rpm,\ndriving a similar compressing impeller. Compressed air from\nthe driven impeller is forced into the induction system, which\nsqueezes more air/fuel mixture into the combustion\nchambers. With the greater charge of air and fuel, a more\npowerful combustion burn results, thus more power. The big\nadvantage of the turbo over directly driven superchargers is\nthe increased efficiency, although there is a slight lag before\nthe turbine spins up and increases the power output.\nOriginally turbo were developed to enable aircraft to fly at\nhigh altitudes, then they found use in diesel trucks and train\nengines to increase their torque.\n25. U-joint\n\nA four-joint cross-connected to two U-shaped yokes that\nserve as a flexible coupling between shafts.\n\n--- PDF PAGE 108 ---\nAutomotive Servicing NC II (Amended) Promulgated December 2013 106\nACKNOWLEDGEMENTS\n\nThe Technical Education and Skills Development Authority (TESDA) wishes to\nextend thanks and appreciation to the many representatives of business, industry,\nacademe and government agencies who rendered their time and expertise to the\ndevelopment and validation of this Training Regulation.\n\nTHE TECHNICAL ADVISORY PANEL (TAP)\nMR. ALLEN RAYMUND A. RUFO\nTAP Chairman – Automotive Sector\nTOYOTA Motors Philippines, Corp.\nParañaque city\nAutomotive Industry Board Foundation\n(AIBFI)\nSuite 1206, 12 th flr. Jollibee Center\nSan Miguel Avenue, Pasig city\nMS. MA. CLARISSA V. FUNESTO\nTAP Alternate Chairperson – Automotive Sector\nHONDA Phils. Inc.\nParañaque city\nAutomotive Industry Board Foundation\n(AIBFI)\nSuite 1206, 12 th flr. Jollibee Center\nSan Miguel Avenue, Pasig city\nMR. SIXTO D. CAYPUNO\nTAP Member – Academe\nSamson Technical College\nCubao, Quezon City\nMR. ANGEL DIMALANTA\nTAP Member – Labor\nTOYOTA Motors Phils., Parañaque city\nTHE TECHNICAL AND INDUSTRY EXPERT PANEL\nAUTOMOTIVE SERVICNG\nEFREN D. BISMONTE\nERNESTO L. ALMAZORA\nELMER B. DEL ROSARIO\nBENIGNO AQUINO JR.\nTOYOTA Motors Phils. Corp.\nSta. Rosa Laguna\nRONNIE A. TRANCE\nCITIMOTORS\nPasong Tamo, Makati\nUNDRICO D. CORPUZ JR.\nMonark Foundation Tech.\nInstitute\nLibis, Quezon city\nALVIN F. ABIAS\nDon Bosco Technical Institute\nMakati city\nANTONIO D. AGALOOS\nJOSE B. TORRES\nSamson Technical College\nQuezon city\nThe PARTICIPANTS in the National Validation of this Training Regulation\nTESDA III\nTESDA VI\nTESDA VIII\nTESDA 10\nTESDA XII\nThe Members of the TESDA Board\nThe TESDA Executive Committee\nThe MANAGEMENT and STAFF of the TESDA Secretariat\nSSCO\nNITVET\nOFTVET\n\n--- PDF PAGE 109 ---\nAutomotive Servicing NC II (Amended) Promulgated December 2013 107\nFOR THE REVISION STAGE\n\n• THE TECHNICAL EXPERT COMMITTEE\n\nANTONIO A. GIMENEZ\nExecutive Director\nPhilippine Automotive Federation, Inc.\n\nRODOLFO NUNEZ\nConsultant, Bataan Automotive Manufacturing Corporation\n(Formerly with Ford and Nissan)\n\nCELSO LIBRANDO\nMaintenance Manager, Victory Liner\n(Former Service Manager, Toyota)\n\nMARIO GUEVARRA\nTechnical Services Manager, Nissan\n\nThe PARTICIPANTS in the Validation of these Training\nRegulations\n\nLEONARDO GARI\nTechnical Service Manager\nNissan Motor Phils.\nALFREDO MAGPAYO\nManager\nHonda Phils.\nBONIFACIO FAJUTNAO\nOwner\nPoctoy Motor Repair Shop\nDENNIS MATA\nFleet Maintenance Supvr.\nMarycheck Trading\n\n• THE TESDA BOARD - STANDARDS SETTING AND SYSTEMS DEVELOPMENT\nCOMMITTEE\n\n• THE MANAGEMENT AND STAFF OF THE TESDA SECRETARIAT\n\n•\nQu