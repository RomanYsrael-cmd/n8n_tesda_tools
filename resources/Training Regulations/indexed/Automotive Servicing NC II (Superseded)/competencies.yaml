        "evidence_guide": {
          "source_text": "1. Critical aspects of\n competency\nAssessment requires evidence that the candidate:\n1.1 Serviced Suspension System\n1.2 Diagnosed suspension system failure\n1.3 Conducted suspension system balance adjustment\n2. Required\nknowledge\n2.1 Operating principles of suspension system\n2.2 Service procedures\n2.3 Air suspension balance adjustment procedures\n2.4 Equipment and tools safe handling\n2.5 Vehicle safety requirements\n2.6 Relevant manufacturer/enterprise policies\n2.7 Personal safety procedures\n2.8 Positive Work Values (Patience, Honesty, Perseverance,\nAttention to Details)\n2.9 Quality procedures, e.g., 5S\n2.10 Environmental-conservation procedures,\n e.g., 3R (reduce, reuse, recycle)\n3. Required skills\n3.1 Accessing, interpreting and applying technical information\n3.2 Using relevant tools and equipment\n3.3 Cleaning suspension parts\n3.4 Applying personal safety procedures\n3.5 Maintaining orderliness and cleanliness\n3.6 Maintaining customer records\n4. Resource\n implications\nThe following resources should be provided:\n4.1 Workplace: Real or simulated work area\n4.2 Appropriate Tools & equipment\n4.3 Materials relevant to the activity\n4.4 Manufacturer’s repair manual\n5. Method of\n assessment\nCompetency in this unit may be assessed through:\n5.1 Written/Oral examination\n5.2 Demonstration with Questioning\n6. Context for\n assessment\n6.1 Competency must be assessed on the job\n or simulated environment.\n6.2 The assessment of practical skills must take place\n after a period of supervised practice and repetitive\n experience.\n\n--- PDF PAGE 89 ---\nAutomotive Servicing NC II (Amended) Promulgated December 2013 87\nUNIT OF COMPETENCY: PERFORM UNDERCHASSIS PREVENTIVE\nMAINTENANCE\n\nUNIT CODE:"
        },
        "source_text": "502723315\n\nUNIT DESCRIPTOR: This unit deals with repairing the suspension system.\n\nELEMENT\n\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n(All standard of performance for Service Suspension System is in\naccordance with company standard operating procedure and\nmanufacturer’s specification Manuals using specified tools and equipment)\n1. Diagnose\nsuspension\nsystem failure\n1.1 Suspension system failure are identified and\n repair works recommended\n\n2. Dismount/mount\nsuspension\ncomponents\nparts\n2.1 Suspension components are dismounted/mounted\n\n2.2 Dismounted parts are tagged/marked\n\n2.3 Parts are dismounted without causing damage to vehicle\n components\n3. Disassemble/\nAssemble\nsuspension parts\n\n3.1 Suspension parts are disassembled/assembled\n\n3.2 Suspension parts are disassembled/assembled without\ncausing damage to other vehicle components/system\n\n3.3 Disassembled parts are rinsed with cleaning solution\n4. Inspect/replace\nsuspension\ncomponent parts\n\n4.1 Suspension system components are checked for cracks,\nloose nuts, bolt or bushing, and leak\n\n4.2 Damaged suspension parts are identified\n\n4.3 Damaged parts are replaced\n\n--- PDF PAGE 87 ---\nAutomotive Servicing NC II (Amended) Promulgated December 2013 85\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Suspension\nsystem failure\nMay include:\n1.1 Suspension system problem indicated by:\n• Noise during stop and starts or over bumps\n• Poor directional stability or automobile does not go in a\nstraight line unless the driver fights the steering wheel\n• The vehicle may steer very hard or have too much\nmovement or play in the steering\n• Front wheel may shimmy when the vehicle is driven at\nhighway speed, or it may pull or tend to turn by itself.\n\n1.2 Common suspension components that lead to system\n failure:\n• Steering knuckle and spindle\n• Ball joint\n• Stabilizer bar\n• Coil spring\n• Torsion bar\n• Shock absorbers\n• Suspension bushings\n 2. Manuals\nMay include:\n2.1 Manufacturer’s specification manual\n2.2 Service and repair manual\n2.3 Parts checklist\n3. Company\nstandard\noperating\nprocedure\nMay include:\n3.1 Job order\n3.2 Requisition slip\n3.3 Wearing of Personal Protective Equipment such as:\n• Hand cleaner, hand gloves, safety shoes, skull guard,\nApron\n4. Tools and\nequipment\nMay include:\n4.1 Hydraulic lifter/Mechanical lifter\n4.2 Support stand\n4.3 Grease dispenser\n4.4 Coil spring compressor\n4.5 Socket wrench\n4.6 Basic Handtools\n4.7 Hydraulic press\n4.8 Torque wrench\n4.9 Air compressor\n4.10 Hard rubber\nmallet\n4.11 Ballpeen\nhammer\n\n--- PDF PAGE 88 ---\nAutomotive Servicing NC II (Amended) Promulgated December 2013 86\nEVIDENCE GUIDE\n\n1. Critical aspects of\n competency\nAssessment requires evidence that the candidate:\n1.1 Serviced Suspension System\n1.2 Diagnosed suspension system failure\n1.3 Conducted suspension system balance adjustment\n2. Required\nknowledge\n2.1 Operating principles of suspension system\n2.2 Service procedures\n2.3 Air suspension balance adjustment procedures\n2.4 Equipment and tools safe handling\n2.5 Vehicle safety requirements\n2.6 Relevant manufacturer/enterprise policies\n2.7 Personal safety procedures\n2.8 Positive Work Values (Patience, Honesty, Perseverance,\nAttention to Details)\n2.9 Quality procedures, e.g., 5S\n2.10 Environmental-conservation procedures,\n e.g., 3R (reduce, reuse, recycle)\n3. Required skills\n3.1 Accessing, interpreting and applying technical information\n3.2 Using relevant tools and equipment\n3.3 Cleaning suspension parts\n3.4 Applying personal safety procedures\n3.5 Maintaining orderliness and cleanliness\n3.6 Maintaining customer records\n4. Resource\n implications\nThe following resources should be provided:\n4.1 Workplace: Real or simulated work area\n4.2 Appropriate Tools & equipment\n4.3 Materials relevant to the activity\n4.4 Manufacturer’s repair manual\n5. Method of\n assessment\nCompetency in this unit may be assessed through:\n5.1 Written/Oral examination\n5.2 Demonstration with Questioning\n6. Context for\n assessment\n6.1 Competency must be assessed on the job\n or simulated environment.\n6.2 The assessment of practical skills must take place\n after a period of supervised practice and repetitive\n experience.\n\n--- PDF PAGE 89 ---\nAutomotive Servicing NC II (Amended) Promulgated December 2013 87\nUNIT OF COMPETENCY: PERFORM UNDERCHASSIS PREVENTIVE\nMAINTENANCE\n\nUNIT CODE:"
