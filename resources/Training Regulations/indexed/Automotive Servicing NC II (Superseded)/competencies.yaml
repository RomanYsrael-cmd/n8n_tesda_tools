        "evidence_guide": {
          "source_text": "1. Critical aspects\nof competency\nAssessment requires evidence that the candidate:\n1.1 Serviced engine mechanical systems\n2. Required\nknowledge\n2.1 Water pump overhauling procedure\n2.2 Principle and operation of cooling system\n2.3 Procedure in coolant leak test\n2.4 Principle and operation of lubricating system\n2.5 Procedure in checking oil pressure\n2.6 Procedure in adjusting idle mixture\n2.7 Procedure in overhauling carburetor\n2.8 Fuel quality and characteristics\n2.9 Unit measurement\n2.10 Procedure in injector testing\n2.11 Procedure in overhauling injector\n2.14 Fuel system basic principle and operation\n2.15 Oil quality and type\n2.16 Exhaust gas theory and production\n2.17 Procedure in measuring CO concentration\n2.18 Emission component inspection procedure\n2.19 Positive Work Values (Patience, Honesty,Perseverance,\nAttention to Details)\n2.20 Quality procedures, e.g., 5S\n2.21 Environmental-conservation procedures,\n e.g., 3R (reduce, reuse, recycle)\n\n3. Required skills\n3.1 Use and interpretation of Repair Manual\n3.2 Usage of CO meter and gas analyzer\n3.3 Operating motor driven cooling fan\n3.4 Diagnosing trouble\n3.5 Usage of injector nozzle hand tester\n3.6 Overhauling injector\n3.7 Usage of Measuring tools\n4. Resource\nimplications\nThe following resources should be provided:\n4.1 Workplace: Real or simulated work area\n4.2 Appropriate Tools & equipment\n4.3 Materials relevant to the activity\n5. Method of\nassessment\nCompetency in this unit may be assessed through:\n5.1 Direct observation with Questioning\n5.2 Interview\n6. Context for\nassessment\n6.1 Competency must be assessed on the job or\n simulated environment.\n6.2 The assessment of practical skills must take place after a\n period of supervised practice and repetitive experience.\n\n--- PDF PAGE 74 ---\nAutomotive Servicing NC II (Amended) Promulgated December 2013 72\nUNIT OF COMPETENCY: SERVICE CLUTCH SYSTEM\n\nUNIT CODE:"
        },
        "source_text": "ALT723309\n\nUNIT DESCRIPTOR: This unit identifies the competence required in:\n servicing cooling, lubricating, fuel systems, diesel fuel\n injector.\n\nELEMENT\n\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1.Service cooling\n system\n\n1.1 Servicing of engine mechanical system such as\ncooling system is performed as per manufacturer’s\nmanual using specified tools and equipment\n\n1.2 Safety is observed as per company standard\noperating procedures\n2. Service lubricating\n system\n2.1 Oil pressure is checked as per manual instruction\n\n2.2 Oil level and condition is checked as per manual\n instruction\n\n2.3 Oil flashing is performed as per manual instruction\n3. Service fuel system\n\nFor CARBURETOR TYPE:\n3.1 Carburetor is serviced/repaired according to\n manufacturer’s repair manual\n\n3.2 Fuel pump is inspected according to service repair\n manual\n\n3.3 Exhaust Gas analyzer is set-up in accordance with\n manufacturer’s manual\n\n3.4 Exhaust gas emission inspected and necessary\n adjustment is performed in accordance with standard\n operating procedures\n4. Service diesel fuel\ninjector\n\n4.1 Injection nozzle is inspected and repaired as per\nservice repair manual\n\n4.2 Fuel system cleaning is performed in accordance with\nstandard operating procedures\n\n--- PDF PAGE 72 ---\nAutomotive Servicing NC II (Amended) Promulgated December 2013 70\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Engine\nMechanical\nSystem\nMay include:\n1.1 Cooling system\n1.2 Lubricating system\n1.3 Fuel system\n1.4 Diesel Fuel injector\n1.5 Emission control system\n2. Manual\nMay include:\n2.1 Maintenance Procedure Manual\n2.2 Periodic Maintenance Data\n2.3 Service Manual\n2.4 Parts Checklist\n3. Company\nStandard\nOperating\nProcedure\nMay include:\n3.1 Job Order\n3.2 Requisition slip\n3.3 Wearing of Personal Protective Equipment such as\n• Apron\n• Gloves\n• Gas mask\n• Goggles\n4. Tools and\nequipment\nMay include:\n4.1 Common hand tools\n4.2 Injection nozzle\n4.3 hand tester\n4.4 C.O. meter\n4.5 Gas analyzer\n\n--- PDF PAGE 73 ---\nAutomotive Servicing NC II (Amended) Promulgated December 2013 71\nEVIDENCE GUIDE\n\n1. Critical aspects\nof competency\nAssessment requires evidence that the candidate:\n1.1 Serviced engine mechanical systems\n2. Required\nknowledge\n2.1 Water pump overhauling procedure\n2.2 Principle and operation of cooling system\n2.3 Procedure in coolant leak test\n2.4 Principle and operation of lubricating system\n2.5 Procedure in checking oil pressure\n2.6 Procedure in adjusting idle mixture\n2.7 Procedure in overhauling carburetor\n2.8 Fuel quality and characteristics\n2.9 Unit measurement\n2.10 Procedure in injector testing\n2.11 Procedure in overhauling injector\n2.14 Fuel system basic principle and operation\n2.15 Oil quality and type\n2.16 Exhaust gas theory and production\n2.17 Procedure in measuring CO concentration\n2.18 Emission component inspection procedure\n2.19 Positive Work Values (Patience, Honesty,Perseverance,\nAttention to Details)\n2.20 Quality procedures, e.g., 5S\n2.21 Environmental-conservation procedures,\n e.g., 3R (reduce, reuse, recycle)\n\n3. Required skills\n3.1 Use and interpretation of Repair Manual\n3.2 Usage of CO meter and gas analyzer\n3.3 Operating motor driven cooling fan\n3.4 Diagnosing trouble\n3.5 Usage of injector nozzle hand tester\n3.6 Overhauling injector\n3.7 Usage of Measuring tools\n4. Resource\nimplications\nThe following resources should be provided:\n4.1 Workplace: Real or simulated work area\n4.2 Appropriate Tools & equipment\n4.3 Materials relevant to the activity\n5. Method of\nassessment\nCompetency in this unit may be assessed through:\n5.1 Direct observation with Questioning\n5.2 Interview\n6. Context for\nassessment\n6.1 Competency must be assessed on the job or\n simulated environment.\n6.2 The assessment of practical skills must take place after a\n period of supervised practice and repetitive experience.\n\n--- PDF PAGE 74 ---\nAutomotive Servicing NC II (Amended) Promulgated December 2013 72\nUNIT OF COMPETENCY: SERVICE CLUTCH SYSTEM\n\nUNIT CODE:"
