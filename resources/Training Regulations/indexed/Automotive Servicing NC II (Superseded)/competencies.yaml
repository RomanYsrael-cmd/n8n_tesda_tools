        "evidence_guide": {
          "source_text": "1. Critical aspects\nof competency\nAssessment requires evidence that the candidate:\n1.1Serviced differential and Front Axle\n1.2 Set and adjusted differential components\n1.3 Overhauled rear and front wheel hub\n2. Required\nknowledge\n2.1 Removal, replacement and repair procedures\n2.2 Construction and operation of differential and front axle\n2.3 Measuring and testing procedures\n2.4 Relevant technical information\n2.5 Equipment safety requirements\n2.6 Vehicle/plant safety requirements\n2.7 Relevant manufacturer/enterprise policies\n2.8 Manual handling techniques\n2.9 Personal safety procedures\n2.10 Positive Work Values (Patience, Honesty, Perseverance,\nAttention to Details)\n2.11 Quality procedures, e.g., 5S\n2.12 Environmental-conservation procedures,\n e.g., 3R (reduce, reuse, recycle)\n3. Required skills\n3.1 Accessing, interpreting and applying technical information\n3.2 Using relevant tools and equipment\n3.3 Identifying faults in differential and front axle\n3.4 Repairing, removing and replacing differential mounting,\nking pin, I-beam\n3.5 Testing and adjusting differential & front axle, rear wheel\nhub\n3.6 Applying manual handling methods\n3.7 Applying personal safety procedures\n3.8 Maintaining customer records\n4. Resource\nimplications\nThe following resources should be provided:\n4.1 Workplace: Real or simulated work area\n4.2 Appropriate Tools & equipment\n4.3 Materials relevant to the activity\n5. Method of\nassessment\nCompetency in this unit may be assessed through:\n5.1 Direct observation while the tasks are being performed\n5.2 Questions/Interview related to the underpinning\n knowledge/skills\n5.3 Assessment of Underpinning Knowledge and attitude and\n practical skills may be combined.\n6. Context for\nassessment\n6.1 Competency must be assessed on the job or\n simulated environment.\n6.2 The assessment of practical skills must take place after a\n period of supervised practice and repetitive experience.\n\n--- PDF PAGE 80 ---\nAutomotive Servicing NC II (Amended) Promulgated December 2013 78\nUNIT OF COMPETENCY: SERVICE MANUAL STEERING SYSTEM\n\nUNIT CODE:"
