r Specification Manual \n3.2 Maintenance Procedure Manual \n3.3 Periodic Maintenance Data \n3.4 Service Manual \n3.5 Parts Checklist\n4. Tools and     \nEquipment \nMay include: \n4.1 Hand tools,  \n4.2 Power tools, air tools, special tools for \nremoval/adjustment \n4.3 Testing equipment including;  \n Multimeter  \n Test lamps \n5. Tests \nMay include: \n5.1 Open circuit test \n5.2 Short circuit test\n\n--- PDF PAGE 64 ---\nAutomotive Servicing NC II  (Amended)                  Promulgated December 2013                     62 \nEVIDENCE GUIDE \n \n1. Critical aspects \nof competency \nAssessment requires evidence that the candidate: \n1.1 Tested electrical system \n1.2 Repaired electrical system \n2. Required \nknowledge  \n2.1 Procedures in installing electrical devices \n2.2 Operation of electrical system and components relevant \nto application \n2.3 Electrical principles and their application to wiring/lighting \n2.4 Procedures for repairing  electrical systems \n2.5 Testing and fault finding procedures \n2.6 Personal safety requirements \n2.7 Positive Work Values ( Perseverance, Honesty, Attention \nto Details, Patience) \n2.8 Quality procedures, e.g., 5S \n2.9 Environmental-conservation procedures,  \n      e.g., 3R (reduce, reuse, recycle) \n3. Required skills \n3.1 Identifying wire gauge or sizes \n3.2 Wiring procedure \n3.3 Operating electrical system \n3.4 Testing and faultfinding \n3.5 Reading and Interpretation of diagrams and circuit\n4. Resource \nimplications \nThe following resources should be provided: \n4.1 Workplace: Real or simulated work area \n4.2 Appropriate Tools & equipment \n4.3 Materials relevant to the activity  \n4.4 Wiring diagram\n5. Method of \nassessment \nCompetency in this unit may be assessed through: \n5.1 direct observation of application of task  \n5.2 Written/Oral questioning \n6. Context for \nassessment \n6.1Competency must be assessed on the job or   \n      simulated environment. \n6.2 The assessment of practical skill