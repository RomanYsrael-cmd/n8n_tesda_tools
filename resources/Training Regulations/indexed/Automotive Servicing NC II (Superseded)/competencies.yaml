cing NC II (Amended) Promulgated December 2013 62\nEVIDENCE GUIDE\n\n1. Critical aspects\nof competency\nAssessment requires evidence that the candidate:\n1.1 Tested electrical system\n1.2 Repaired electrical system\n2. Required\nknowledge\n2.1 Procedures in installing electrical devices\n2.2 Operation of electrical system and components relevant\nto application\n2.3 Electrical principles and their application to wiring/lighting\n2.4 Procedures for repairing electrical systems\n2.5 Testing and fault finding procedures\n2.6 Personal safety requirements\n2.7 Positive Work Values ( Perseverance, Honesty, Attention\nto Details, Patience)\n2.8 Quality procedures, e.g., 5S\n2.9 Environmental-conservation procedures,\n e.g., 3R (reduce, reuse, recycle)\n3. Required skills\n3.1 Identifying wire gauge or sizes\n3.2 Wiring procedure\n3.3 Operating electrical system\n3.4 Testing and faultfinding\n3.5 Reading and Interpretation of diagrams and circuit\n4. Resource\nimplications\nThe following resources should be provided:\n4.1 Workplace: Real or simulated work area\n4.2 Appropriate Tools & equipment\n4.3 Materials relevant to the activity\n4.4 Wiring diagram\n5. Method of\nassessment\nCompetency in this unit may be assessed through:\n5.1 direct observation of application of task\n5.2 Written/Oral questioning\n6. Context for\nassessment\n6.1Competency must be assessed on the job or\n simulated environment.\n6.2 The assessment of practical skills must take place after a\n period of supervised practice and repetitive experience.\n\n--- PDF PAGE 65 ---\nAutomotive Servicing NC II (Amended) Promulgated December 2013 63\nUNIT OF COMPETENCY: SERVICE STARTING SYSTEM\n\nUNIT CODE: ALT723307\n\nUNIT DESCRIPTOR:\nThis unit identifies the competence required to:\nTest and repair starting systems.\n\nELEMENT\n\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n(Note: All standard of performance for Service Starting Systems is in\naccordance with company standard operating procedure and\nmanufacturer’s specification Manuals using specified tools and\nequipment)\n1. Test system/\ncomponents and\nidentify faults\n\n1.1. Work is completed without causing damage to any\nworkplace property or vehicle.\n\n1.2 Information is accessed and interpreted from\nappropriate manufacturer specifications.\n\n1.3 Tests are carried out to determine faults using\nappropriate tools and techniques.\n\n1.4 Faults are identified and preferred repair action\ndetermined.\n2. Repair starting\nsystems associated\ncomponents\n2.1 Starting systems are repaired without causing damage\n to any workplace property or vehicle.\n\n2.2 Information is accessed and interpreted from\n appropriate manufacturer specifications.\n\n2.3 Repairs, component replacement and adjustments are\ncarried out using appropriate tools, techniques and\nmaterials.\n\n--- PDF PAGE 66 ---\nAutomotive Servicing NC II (Amended) Promulgated December 2013 64\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Starting systems\nMay include:\n1.1 Dynastart, inertia, pre-engaged, axial, coaxial, fixed and\nremote solenoid, direct drive, gear reduction, protection\nlockout, inhibitor switch, series-parallel switching, battery\nisolation switch, single/multiple battery system\n\n1.2 Solar systems may include: single and ganged panels,\ninternal and external regulation, battery sensed and non-\nbattery sensed 12V and 24V operation, solid state\ncontrolled\n\n1.3 Direct current motors\n2. Manuals\nMay include:\n2.1 Maintenance Procedure Manual\n2.2 Periodic Maintenance Data\n2.3 Service Manual\n2.4 Parts Checklist\n3. Company\nstandard operating\nprocedure\nMay include:\n3.1 Job Order\n3.2 Requisition slip\n3.3 Wearing of Personal Protective Equipment such as\n• Goggles\n• Hand gloves\n• Apron\n• Safety shoes\n4. Tools and\nequipment\nMay include:\n4.1 Hand tools\n4.2 Testing equipment including:\n•\nMultimeters, voltmeters, ammeters\n4.3 Power tools, air tools, electrical loading equipment, test\n benches, soldering equipment, induction , test light (12V\nand 24V)\n\n5. Tests\nMay include:\n5.1 Open circuit test\n5.2 Short circuit test\n\n--- PDF PAGE 67 ---\nAutomotive Servicing NC II (Amended) Promulgated December 2013 65\nEVIDENCE GUIDE\n\n1. Critical aspects\nof competency\nAssessment requires evidence that the candidate\n1.1 Serviced and charged batteries\n1.2 Tested/jump started the battery/vehicles\n1.3 Repaired the starting system\n2. Required\nknowledge\n2.1 Starting system components\n2.2 Electrical principles\n2.3Repair procedures\n2.4 Electrical measuring and testing procedures\n2.5 Vehicle safety requirements\n2.6 Positive Work Values (Patience, Honesty, Perseverance,\n Attention to details)\n2.7 Quality procedures, e.g., 5S\n2.8 Environmental-conservation procedures,\n e.g., 3R (reduce, reuse, recycle)\n3. Required skills\n3.1 Handling batteries and tools\n3.2 Operating testing equipment\n3.3 Repairing Starting system\n3.4 Using Mathematical Ideas and Techniques\n3.5 Solving Problems\n4. Resource\nimplications\nThe following resources shouldt be provided:\n4.1 Workplace: Real or simulated work area\n4.2 Appropriate Tools & equipment\n4.3 Materials relevant to the activity\n4.4 Wiring diagram\n4.5 Manufacturer’s repair manual\n5. Method of\nassessment\nCompetency in this unit may be assessed through:\n5.1 Direct observation while the tasks are being performed\n5.2 Questions/Interview related to the underpinning\n knowledge/skills\n5.3 Assessment of underpinning and practical skills may be\n combined.\n6. Context for\nassessment\n6.1 Competency must be assessed on the job or\n simulated environment.\n6.2 The assessment of practical skills must take place after\na period of supervised practice and repetitive\nexperience.\n\n--- PDF PAGE 68 ---\nAutomotive Servicing NC II (Amended) Promulgated December 2013 66\nUNIT OF COMPETENCY: SERVICE CHARGING SYSTEMS\n\nUNIT CODE: ALT723308\n\nUNIT DESCRIPTOR:\nThis unit identifies the competence required to:\nTe