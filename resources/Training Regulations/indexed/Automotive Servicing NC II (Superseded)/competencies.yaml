  "source_section_text": "SECTION 2 COMPETENCY STANDARDS\n\nThis section gives the details of the contents of the basic, common and core\nunits of competency required in AUTOMOTIVE SERVICING NC II.\n\nBASIC COMPETENCIES\n\nUNIT OF COMPETENCY : PARTICIPATE IN WORKPLACE COMMUNICATION\nUNIT CODE\n : 500311105\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes\nrequired to gather, interpret and convey information in\nresponse to workplace requirements.\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Obtain and\nconvey\nworkplace\ninformation\n1.1\nSpecific and relevant information is accessed from\nappropriate sources\n1.2\nEffective questioning , active listening and speaking skills\nare used to gather and convey information\n1.3\nAppropriate medium is used to transfer information and\nideas\n1.4\nAppropriate non- verbal communication is used\n1.5\nAppropriate lines of communication with supervisors and\ncolleagues are identified and followed\n1.6\nDefined workplace procedures for the location and\nstorage of information are used\n1.7\nPersonal interaction is carried out clearly and concisely\n2. Participate in\nworkplace\nmeetings and\ndiscussions\n2.1\nTeam meetings are attended on time\n2.2\nOwn opinions are clearly expressed and those of others\nare listened to without interruption\n2.3\nMeeting inputs are consistent with the meeting purpose\nand established protocols\n2.4\nWorkplace interactions are conducted in a courteous\nmanner\n2.5\nQuestions about simple routine workplace procedures\nand maters concerning working conditions of employment\nare asked and responded to\n2.6\nMeetings outcomes are interpreted and implemented\n3. Complete\nrelevant work\nrelated\ndocuments\n3.1\nRange of forms relating to conditions of employment are\ncompleted accurately and legibly\n3.2\nWorkplace data is recorded on standard workplace forms\nand documents\n3.3\nBasic mathematical processes are used for routine\ncalculations\n3.4\nErrors in recording information on forms/ documents are\nidentified and properly acted upon\n3.5\nReporting requirements to supervisor are completed\naccording to organizational guidelines\n\n--- PDF PAGE 5 ---\nAutomotive Servicing NC II (Amended) Promulgated December 2013 3\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Appropriate sources\n1.1.\nTeam members\n1.2.\nSuppliers\n1.3.\nTrade personnel\n1.4.\nLocal government\n1.5.\nIndustry bodies\n2. Medium\n2.1.\nMemorandum\n2.2.\nCircular\n2.3.\nNotice\n2.4.\nInformation discussion\n2.5.\nFollow-up or verbal instructions\n2.6.\nFace to face communication\n3. Storage\n3.1.\nManual filing system\n3.2.\nComputer-based filing system\n4. Forms\n4.1.\nPersonnel forms, telephone message forms,\nsafety reports\n5. Workplace interactions\n5.1.\nFace to face\n5.2.\nTelephone\n5.3.\nElectronic and two way radio\n5.4.\nWritten including electronic, memos, instruction\nand forms, non-verbal including gestures,\nsignals, signs and diagrams\n6. Protocols\n6.1.\nObserving meeting\n6.2.\nCompliance with meeting decisions\n6.3.\nObeying meeting instructions\n\n--- PDF PAGE 6 ---\nAutomotive Servicing NC II (Amended) Promulgated December 2013 4\nEVIDENCE GUIDE\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1. Prepared written communication following standard\nformat of the organization\n1.2. Accessed information using communication\nequipment\n1.3. Made use of relevant terms as an aid to transfer\ninformation effectively\n1.4. Conveyed information effectively adopting the\nformal or informal communication\n2. Underpinning\nKnowledge and\nattitude\n\n2.1. Effective communication\n2.2. Different modes of communication\n2.3. Written communication\n2.4. Organizational policies\n2.5. Communication procedures and systems\n2.6. Technology relevant to the enterprise and the\nindividual’s work responsibilities\n3. Underpinning Skills\n3.1. Follow simple spoken language\n3.2. Perform routine workplace duties following simple\nwritten notices\n3.3. Participate in workplace meetings and discussions\n3.4. Complete work related documents\n3.5. Estimate, calculate and record routine workplace\nmeasures\n3.6. Basic mathematical processes of addition,\nsubtraction, division and multiplication\n3.7. Ability to relate to people of social range in the\nworkplace\n3.8. Gather and provide information in response to\nworkplace Requirements\n4. Resource\nImplications\n4.1. Fax machine\n4.2. Telephone\n4.3. Writing materials\n4.4. Internet\n5. Methods of\nAssessment\n5.1. Direct Observation\n5.2. Oral interview and written test\n6. Context for\nAssessment\n6.1. Competency may be assessed individually in the\nactual workplace or through accredited institution\n\n--- PDF PAGE 7 ---\nAutomotive Servicing NC II (Amended) Promulgated December 2013 5\nUNIT OF COMPETENCY: WORK IN TEAM ENVIRONMENT\nUNIT CODE\n : 500311106\nUNIT DESCRIPTOR :\nThis unit covers the skills, knowledge and attitudes to\nidentify role and responsibility as a member of a team.\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Describe team role\nand scope\n1.1. The role and objective of the team is identified from\navailable sources of information\n1.2. Team parameters, reporting relationships and\nresponsibilities are identified from team discussions\nand appropriate external sources\n2. Identify own role\nand responsibility\nwithin team\n2.1. Individual role and responsibilities within the team\nenvironment are identified\n2.2. Roles and responsibility of other team members are\nidentified and recognized\n2.3. Reporting relationships within team and external to\nteam are identified\n3. Work as a team\nmember\n3.1. Effective and appropriate forms of communications\nused and interactions undertaken with team members\nwho contribute to known team activities and\nobjectives\n3.2. Effective and appropriate contributions made to\ncomplement team activities and objectives, based on\nindividual skills and competencies and workplace\ncontext\n3.3. Observed protocols in reporting using standard\noperating procedures\n3.4. Contribute to the development of team work plans\nbased on an understanding of team’s role and\nobjectives and individual competencies of the\nmembers.\n\n--- PDF PAGE 8 ---\nAutomotive Servicing NC II (Amended) Promulgated December 2013 6\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Role and objective\nof team\n1.1.\nWork activities in a team environment with\nenterprise or specific sector\n1.2.\nLimited discretion, initiative and judgement maybe\ndemonstrated on the job, either individually or in a\nteam environment\n\n2. Sources of\ninformation\n2.1.\nStandard operating and/or other workplace\nprocedures\n2.2.\nJob procedures\n2.3.\nMachine/equipment manufacturer’s specifications\nand instructions\n2.4.\nOrganizational or external personnel\n2.5.\nClient/supplier instructions\n2.6.\nQuality standards\n2.7.\nOHS and environmental standards\n3. Workplace context\n3.1.\nWork procedures and practices\n3.2.\nConditions of work environments\n3.3.\nLegislation and industrial agreements\n3.4.\nStandard work practice including the storage, safe\nhandling and disposal of chemicals\n3.5.\nSafety, environmental, housekeeping and quality\nguidelines\n\n--- PDF PAGE 9 ---\nAutomotive Servicing NC II (Amended) Promulgated December 2013 7\nEVIDENCE GUIDE\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1.\nOperated in a team to complete workplace activity\n1.2.\nWorked effectively with others\n1.3.\nConveyed information in written or oral form\n1.4.\nSelected and used appropriate workplace language\n1.5.\nFollowed designated work plan for the job\n1.6.\nReported outcomes\n2. Underpinning\nKnowledge and\nattitude\n2.1.\nCommunication process\n2.2.\nTeam structure\n2.3.\nTeam roles\n2.4.\nGroup planning and decision making\n3. Underpinning Skills\n3.1.\nCommunicate appropriately, consistent with the\nculture of the workplace\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1.\nAccess to relevant workplace or appropriately\nsimulated environment where assessment can take\nplace\n 4.2. Materials relevant to the proposed activity or tasks\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1.\nObservation of the individual member in relation to\nthe work activities of the group\n5.2.\nObservation of simulation and or role play involving\nthe participation of individual member to the\nattainment of organizational goal\n5.3. Case studies and scenarios as a basis for discussion\nof issues and strategies in teamwork\n6. Context for\nAssessment\n6.1.\nCompetency may be assessed in workplace or in a\nsimulated workplace setting\n6.2.\nAssessment shall be observed while task are being\nundertaken whether individually or in group\n\n--- PDF PAGE 10 ---\nAutomotive Servicing NC II (Amended) Promulgated December 2013 8\nUNIT OF COMPETENCY: PRACTICE CAREER PROFESSIONALISM\n\nUNIT CODE : 500311107\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes in\npromoting career growth and advancement.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Integrate personal\nobjectives with\norganizational goals\n1.1 Personal growth and work plans are pursued towards\nimproving the qualifications set for the profession\n1.2 Intra- and interpersonal relationships is are maintained\nin the course of managing oneself based on\nperformance evaluation\n1.3 Commitment to the organization and its goal is\ndemonstrated in the performance of duties\n2. Set and meet work\npriorities\n2.1 Competing demands are prioritized to achieve personal,\nteam and organizational goals and objectives.\n2.2 Resources are utilized efficiently and effectively to\nmanage work priorities and commitments\n2.3 Practices along economic use and maintenance of\nequipment and facilities are followed as per\nestablished procedures\n3. Maintain professional\ngrowth and\ndevelopment\n3.1 Trainings and career opportunities are identified and\navailed of based on job requirements\n3.2 Recognitions are sought/received and demonstrated\nas proof of career advancement\n3.3 Licenses and/or certifications relevant to job and\ncareer are obtained and renewed\n\n--- PDF PAGE 11 ---\nAutomotive Servicing NC II (Amended) Promulgated December 2013 9\n RANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Evaluation\n1.1 Performance Appraisal\n1.2 Psychological Profile\n1.3 Aptitude Tests\n2. Resources\n2.1 Human\n2.2 Financial\n2.3 Technology\n2.3.1 Hardware\n2.3.2 Software\n3. Trainings and career\nopportunities\n3.1 Participation in training programs\n 3.1.1 Technical\n 3.1.2 Supervisory\n 3.1.3 Managerial\n 3.1.4 Continuing Education\n3.2 Serving as Resource Persons in conferences and\nworkshops\n4. Recognitions\n4.1 Recommendations\n4.2 Citations\n4.3 Certificate of Appreciations\n4.4 Commendations\n4.5 Awards\n4.6 Tangible and Intangible Rewards\n5. Licenses and/or\ncertifications\n5.1 National Certificates\n5.2 Certificate of Competency\n5.3 Support Level Licenses\n5.4 Professional Licenses\n\n--- PDF PAGE 12 ---\nAutomotive Servicing NC II (Amended) Promulgated December 2013 10\nEVIDENCE GUIDE\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Attained job targets within key result areas (KRAs)\n1.2 Maintained intra - and interpersonal relationship in the\ncourse of managing oneself based on performance\nevaluation\n1.3 Completed trainings and career opportunities which are\nbased on the requirements of the industries\n1.4 Acquired and maintained licenses and/or certifications\naccording to the requirement of the qualification\n2. Underpinning\nKnowledge and\nattitude\n2.1 Work values and ethics (Code of Conduct, Code of\nEthics, etc.)\n2.2 Company policies\n2.3 Company operations, procedures and standards\n2.4 Fundamental rights at work including gender sensitivity\n2.5 Personal hygiene practices\n3. Underpinning Skills\n3.1 Appropriate practice of personal hygiene\n3.2 Intra and Interpersonal skills\n3.3 Communication skills\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1 Workplace or assessment location\n4.2 Case studies/scenarios\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1 Portfolio Assessment\n5.2 Interview\n5.3 Simulation/Role-plays\n5.4 Observation\n5.5 Third Party Reports\n5.6 Exams and Tests\n6. Context for\nAssessment\n6.1 Competency may be assessed in the work place or in a\nsimulated work place setting\n\n--- PDF PAGE 13 ---\nAutomotive Servicing NC II (Amended) Promulgated December 2013 11\n\nUNIT OF COMPETENCY : PRACTICE OCCUPATIONAL HEALTH AND SAFETY\nPROCEDURES\nUNIT CODE : 500311108\nUNIT DESCRIPTOR :\nThis unit covers the outcomes required to comply with\nregulatory\nand\norganizational\nrequirements\nfor\noccupational health and safety.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Identify hazards and\nrisks\n1.1 Safety regulations and workplace safety and hazard\ncontrol practices and procedures are clarified and\nexplained based on organization procedures\n1.2 Hazards/risks in the workplace and their\ncorresponding indicators are identified to minimize or\neliminate risk to co-workers, workplace and\nenvironment in accordance with organization\nprocedures\n1.3 Contingency measures during workplace accidents,\nfire and other emergencies are recognized and\nestablished in accordance with organization\nprocedures\n2. Evaluate hazards and\nrisks\n2.1Terms of maximum tolerable limits which when\nexceeded will result in harm or damage are identified\nbased on threshold limit values (TLV)\n2.2 Effects of the hazards are determined\n2.3 OHS issues and/or concerns and identified safety\nhazards are reported to designated personnel in\naccordance with workplace requirements and relevant\nworkplace OHS legislation\n3. Control hazards and\nrisks\n3.1Occupational Health and Safety (OHS) procedures for\ncontrolling hazards/risks in workplace are consistently\nfollowed\n3.2 Procedures for dealing with workplace accidents, fire\nand emergencies are followed in accordance with\norganization OHS policies\n3.3 Personal protective equipment (PPE) is correctly\nused in accordance with organization OHS procedures\nand practices\n3.4 Appropriate assistance is provided in the event of a\nworkplace emergency in accordance with established\norganization protocol\n4. Maintain OHS\nawareness\n4.1 Emergency-related drills and trainings are\nparticipated in as per established organization\nguidelines and procedures\n4.2 OHS personal records are completed and updated\nin accordance with workplace requirements\n\n--- PDF PAGE 14 ---\nAutomotive Servicing NC II (Amended) Promulgated December 2013 12\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Safety regulations\nMay include but are not limited to:\n1.1 Clean Air Act\n1.2 Building code\n1.3 National Electrical and Fire Safety Codes\n1.4 Waste management statutes and rules\n1.5 Philippine Occupational Safety and Health Standards\n1.6 DOLE regulations on safety legal requirements\n1.7 ECC regulations\n2. Hazards/Risks\nMay include but are not limited to:\n2.1 Physical hazards – impact, illumination, pressure, noise,\n vibration, temperature, radiation\n2.2 Biological hazards- bacteria, viruses, plants, parasites,\n mites, molds, fungi, insects\n2.3 Chemical hazards – dusts, fibers, mists, fumes, smoke,\n gasses, vapors\n2.4 Ergonomics\n• Psychological factors – over exertion/ excessive\nforce, awkward/static positions, fatigue, direct\npressure, varying metabolic cycles\n• Physiological factors – monotony, personal\nrelationship, work out cycle\n3. Contingency\nmeasures\nMay include but are not limited to:\n3.1 Evacuation\n3.2 Isolation\n3.3 Decontamination\n3.4 (Calling designed) emergency personnel\n4. PPE\nMay include but are not limited to:\n4.1 Mask\n4.2 Gloves\n4.3 Goggles\n4.4 Hair Net/cap/bonnet\n4.5 Face mask/shield\n4.6 Ear muffs\n4.7 Apron/Gown/coverall/jump suit\n4.8 Anti-static suits\n5. Emergency-related\ndrills and training\n5.1 Fire drill\n5.2 Earthquake drill\n5.3 Basic life support/CPR\n5.4 First aid\n5.5 Spillage control\n5.6 Decontamination of chemical and toxic\n5.7 Disaster preparedness/management\n6. OHS personal\nrecords\n6.1 Medical/Health records\n6.2 Incident reports\n6.3 Accident reports\n6.4 OHS-related training completed\n\n--- PDF PAGE 15 ---\nAutomotive Servicing NC II (Amended) Promulgated December 2013 13\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Explained clearly established workplace safety and\nhazard control practices and procedures\n1.2 Identified hazards/risks in the workplace and its\ncorresponding indicators in accordance with company\nprocedures\n1.3 Recognized contingency measures during workplace\naccidents, fire and other emergencies\n1.4 Identified terms of maximum tolerable limits based on\nthreshold limit value- TLV.\n1.5 Followed Occupational Health and Safety (OHS)\nprocedures for controlling hazards/risks in workplace\n1.6 Used Personal Protective Equipment (PPE) in\naccordance with company OHS procedures and\npractices\n1.7 Completed and updated OHS personal records in\naccordance with workplace requirements\n2. Underpinning\nknowledge and\nattitude\n\n2.1 OHS procedures and practices and regulations\n2.2 PPE types and uses\n2.3 Personal hygiene practices\n2.4 Hazards/risks identification and control\n2.5 Threshold Limit Value –TLV\n2.6 OHS indicators\n2.7 Organization safety and health protocol\n2.8 Safety consciousness\n2.9 Health consciousness\n3. Underpinning\n Skills\n3.1 Practice of personal hygiene\n3.2 Hazards/risks identification and control skills\n3.3 Interpersonal skills\n3.4 Communication skills\n4. Resource\n Implications\nThe following resources must be provided:\n4.1 Workplace or assessment location\n4.2 OHS personal records\n4.3 PPE\n4.4 Health records\n5. Methods of\n Assessment\nCompetency must be assessed through:\n5.1 Portfolio Assessment\n5.2 Interview\n5.3 Case Study/Situation\n6. Context for\nAssessment\n6.1 Competency may be assessed in the work place or in a\nsimulated work place setting\n\n--- PDF PAGE 16 ---\nAutomotive Servicing NC II (Amended) Promulgated December 2013 14\nCOMMON COMPETENCIES\n\nUNIT OF COMPETENCY: APPLY APPROPRIATE SEALANT/ADHESIVE\n\nUNIT CODE: ALT723201\n\nUNIT DESCRIPTOR: This competency unit covers the knowledge, skills and attitude\nrequired in the selection and application of sealant/adhesives.\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Identify appropriate\nSealant/adhesive\n\n1.1Sealant/adhesive are selected in line with job\nrequirements and manufacturer’s specification\n1.1 Sealant/adhesive checking is performed to ensure that\nthe product is fit for use.\n2. Prepare surface for\nSealant/adhesive\n2.1 Surface materials are identified as per construction\n2.2 Surface is cleaned and free of moisture, dust and other\n foreign matters to ensure maximum adhesion or seal.\n3. Apply\nsealant/adhesive\n evenly\n3.1 Sealant/adhesive is applied evenly on the surface in line\n with manufacturer’s specification\n3.2 Excess sealant/adhesive is removed by sanding or\n scrapping\n3.3Tools and equipment used to apply sealant/adhesive\nare appropriate to job requirements\n3.4 Safety are observed and PPE are worn in accordance\nwith industry SOP\n3.5 Hazards associated with the use of sealant and\nadhesives are identified.\n4. Store/Dispose of\nsealant/adhesive\n4.1 Sealant/adhesive are stored as per prescribed\nprocedure\n4.2 Waste are disposed as per workshop standard\noperating procedures\n\n--- PDF PAGE 17 ---\nAutomotive Servicing NC II (Amended) Promulgated December 2013 15\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Sealant/Adhesive\nMay include:\n1.1Form in Place Gasket (FIPG)\n1.2 Ribbon Sealer\n1.3Hametite\n1.4Silicon Body sealer\n1.5 Prestite for Auto and Auto Aircon\n2. Tools and equipment\nMay include:\n2.1 Putty knife\n2.2 Scraper\n2.3 Compressor\n2.4 Steel brush\n2.5 Paint brush\n2.6 Rubber hammer\n2.7 Hand tools\n\nPersonal protective equipment include:\n2.8 Gloves\n2.9 Apron\n2.10 Safety shoes\n2.11Goggles\n2.12Gas mask\n\n3. Safety\n\nMay include:\n3.1 Ventilation\n3.2 Handling of Flammable/Irritating substances\n3.3 Use of Personal Protective Equipment\n\n4. Hazards\n\n May include:\n4.1 Fumes\n4.2 Skin irritation\n4.3 Burns\n\n5.Adhesive/Sealant\n checking\n\nMay include:\n5.1 Expiry date\n5.2 Free of contamination\n5.1 Cap/Covers\n5.2 Tightly closed\n5.3 Concentration\n\n--- PDF PAGE 18 ---\nAutomotive Servicing NC II (Amended) Promulgated December 2013 16\nEVIDENCE GUIDE\n\n1. Critical aspect of\ncompetency\n\nAssessment requires evidence that the candidate:\n1.1 Identified appropriate sealant/adhesives\n1.2 Prepared surface for sealant/adhesive\n1.3 Applied sealant/adhesive\n1.4 Stored unused or dispose of used sealant/adhesive\n2. Required\nknowledge\n2.1 OH & S regulations\n2.2 Safe handling of sealant/adhesive\n2.3 Industry code of practice\n2.2 Procedures in sealant/adhesive application\n2.3 Procedures in interpreting manuals\n3. Required skills\n3.1 Handling sealant/adhesive\n3.2 Applying sealant/adhesive\n3.3.Sanding the surface\n3.4 Use of tools, equipment\n3.5 Mixing of body filler and epoxy base and hardener\n4. Resource\n implication\nThe following resources should be provided:\n4.1 Materials relevant to the activity\n4.2 Appropriate tools and equipment\n4.3 Real or simulated workplace\n5. Method of\n assessment\n\nCompetency in this unit may be assessed through:\n5.1 Observation with questioning\n5.2 Interview related to:\n• Safe and correct use of tools and equipment\n• Application of adhesive/sealant\n6. Context of\nassessment\n\n6.1 Competency elements must be assessed in a safe\n working environment\n6.2 Assessment may be done in a workplace or\nsimulated environment\n\n--- PDF PAGE 19 ---\nAutomotive Servicing NC II (Amended) Promulgated December 2013 17\nUNIT OF COMPETENCY: MOVE AND POSITION VEHICLE\n\nUNIT CODE: ALT723202\n\nUNIT DESCRIPTOR: This unit covers the knowledge, skills and attitude needed to\nmove and position vehicle in a workshop.\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n\n1. Prepare vehicle for\n driving\n\n1.2 Correct check-up procedures performed based on\n vehicle manufacturer’s standard\n\n2. Move and position\n vehicle\n\n2.1 Select vehicle to be moved or re-position.\n2.2 Drive the vehicle to appropriate location\n2.3 Park vehicle following parking safety techniques\nand procedure\n\n3. Check the vehicle\n\n3.1 Vehicle position is checked as per requirement\n3.2 Vehicle is checked for external damages\n\nRANGE OF VARIABLE\n\nVARIABLE\nRANGE\n\n1. Check up procedure\nMay include:\n1.1 Oil level\n1.2 Brake fluid\n1.3 Clutch fluid\n1.4 Coolant level\n1.5 Battery (electrolyte)\n1.6 Tire pressure\n1.7 Position of driving gear\n1.8 Lighting and warning devices\n\n2. Vehicles\nMay include:\n2.1 Vehicles with automatic transmission\n2.2 Vehicles with manual transmission\n\n3.Parking safety\n techniques\nMay include:\n3.1 Engaging of Park brake\n3.2 Vehicle parking position\n3.3 Front wheel position\n\n--- PDF PAGE 20 ---\nAutomotive Servicing NC II (Amended) Promulgated December 2013 18\nEVIDENCE GUIDE\n\n1.Critical aspects of\n competency\n\nAssessment requires evidence that the candidate:\n1.1 Prepared vehicle for driving.\n1.2 Moved and positioned vehicle\n1.3 Checked the vehicle.\n\n2. Required\nKnowledge\n\n2.1 Driver’s Code of conduct\n2.2 Workshop signs and symbols\n2.3 Driving skills\n2.4Vehicle accessories for safe driving and parking\n\n3. Required skills\n\n3.1 Ability to handle/maneuver vehicle the easiest way\n3.2 Immediate response to accident\n3.3 Preparing vehicle for driving\n3.4 Parking Downhill, Uphill, Parallel\n3.5 Shifting Gears\n3.6 Maneuvering\n\n4. Resource\n implication\nThe following resources should be provided:\n4.1 Driving range/area\n4.2 Appropriate vehicle for driving\n4.3 Vehicle accessories\n\n5. Method of\n assessment\nCompetency in this unit may be assessed through:\n5.1 Observation with questioning\n5.2 Written or oral examination\n\n6. Context of\n assessment\n\n6.1 Assessment must be undertaken in accordance with the\n endorsed TESDA assessment guidelines\n6.2 Assessment of practical skills must be done in a\nworkplace or simulated environment.\n\n--- PDF PAGE 21 ---\nAutomotive Servicing NC II (Amended) Promulgated December 2013 19\nUNIT OF COMPETENCY: PERFORM MENSURATION AND CALCULATION\nUNIT CODE: ALT311202\n\nUNIT DESCRIPTOR:\nThis unit covers the knowledge, skills and attitudes in\nidentifying, caring, handling and sing of measuring\ninstrument.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n\n1. Select measuring\n\n instruments\n\n1.1 Object or component to be measured is identified\n1.2 Correct specifications are obtained from relevant source\n1.3 Appropriate measuring instrument is selected according to\njob requirements\n\n2. Carry out\n measurements\n and calculation\n\n2.1 Measuring tools are selected in line with job requirements\n2.2 Accurate measurements are obtained in accordance with\nthe job requirements\n2.3 Calculation needed to complete work tasks are performed\n using the four fundamental operations of addition (+),\nsubtraction (-),multiplication (x) and division (/).\n2.4 Calculations involving fractions, percentages and mixed\n numbers are used to complete workplace tasks.\n2.5 Numerical computation is self-checked and corrected for\n accuracy\n2.6 Instruments are read to the limit of accuracy of the tool.\n\n3. Maintain\nmeasuring\ninstruments\n\n3.1 Measuring instruments are kept free from corrosion\n3.2 Measuring instruments are not dropped to avoid damage\n3.3 Measuring instruments are cleaned before and after using.\n\n--- PDF PAGE 22 ---\nAutomotive Servicing NC II (Amended) Promulgated December 2013 20\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Measuring\ninstruments\nMay include:\n\n1.1 Multitester\n1.2 Micrometer (In-out, depth)\n1.3 Vernier caliper (Out,\ninside)\n1.4 Dial Gauge with Mag. Std.\n1.5 Plastigauge\n1.6 Straight Edge\n1.7 Thickness gauge\n\n1.8 Torque Gauge\n1.9 Small Hole gauge\n1.10 Telescopic Gauge\n1.11 Try square\n1.12 Protractor\n1.13 Combination gauge\n1.14 Steel rule\n2. Calculation\n\nMay include:\n2.1 Volume\n2.2 Area\n2.3 Displacement\n2.4 Inside diameter\n2.5 Circumference\n2.6 Length\n2.7 Thickness\n2.8 Outside diameter\n2.9 Taper\n2. 10 Out of roundness\n2.11Oil clearance\n2.12 End play/thrust clearance\n\n--- PDF PAGE 23 ---\nAutomotive Servicing NC II (Amended) Promulgated December 2013 21\nEVIDENCE GUIDE\n\n1. Critical aspects\nof competency\n\nAssessment requires evidence that the candidate:\n1.1 Selected measuring instruments\n1.2 Carried out measurements and calculations.\n1.3 Maintained measuring instruments\n\n2. Required\nKnowledge\n\n2.1 Types of Measuring instruments and their uses\n2.2 Safe handling procedures in using measuring instruments\n2.3 Four fundamental operation of mathematics\n2.4 Formula for Volume, Area, Perimeter and other geometric\nfigures\n\n3. Required\n skills\n\n3.1 Caring and Handling measuring instruments\n3.2 Calibrating and using measuring instruments\n3.3 Performing calculation by Addition, Subtraction,\n Multiplication and Division\n3.4 Visualizing objects and shapes\n3.5 Interpreting formula for volume, area, perimeter and other\ngeometric figures\n\n4. Resource\n implication\nThe following resources should be provided:\n4.1 Workplace location\n4.2 Measuring instrument appropriate to servicing processes\n4.3 Instructional materials relevant to the propose activity\n\n5. Method of\n assessment\n\nCompetency in this unit may be assessed through:\n5.1 Observation with questioning\n5.2 Written or oral examination\n5.3 Interview\n5.4 Demonstration with questioning\n\n6. Context of\n assessment\n\n6.1 Competency elements must be assessed in a safe\nworking environment\n6.2 Assessment may be conducted in a workplace or\nsimulated environment\n\n--- PDF PAGE 24 ---\nAutomotive Servicing NC II (Amended) Promulgated December 2013 22\nUNIT TITLE: READ, INTERPRET AND APPLY SPECIFICATION AND MANUALS.\n\nUNIT CODE: ALT723203\n\nUNIT DESCRIPTOR: This unit deals with identifying, interpreting and applying\nservice specification manuals, maintenance procedure\nmanuals and periodic maintenance manual.\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n\n1. Identify and\naccess\n manual/\n specification\n\n1.1 Appropriate manuals are identified and accessed as per\njob requirements.\n1.2 Version and date of manual are checked to ensure\ncorrect specification and procedure are identified.\n\n2. Interpret manuals\n\n2.1 Relevant sections, chapters of manuals/specifications\nare located in relation to the work to be conducted\n2.2 Information and procedure in the manual are interpreted\nin accordance with industry practices\n\n3. Apply information\nin manual\n\n3.1 Manual is interpreted according to job requirements\n3.2 Work steps are correctly identified in accordance with\nmanufacturer specification\n3.3 Manual data are applied according to the given task\n3.4 All correct sequencing and adjustments are interpreted in\naccordance with information contained on the manual or\nspecifications\n\n4. Store manuals\n\n4.1 Manual or specification are stored appropriately to\n ensure prevention of damage, ready access and\n updating of information when required in accordance\n with company requirements\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n\n1. Manuals\n\n May include:\n1.1 Manufacturer’s specification manual\n1.2 Repair manual\n1.3 Maintenance Procedure Manual\n1.4 Periodic Maintenance Manual\n\n--- PDF PAGE 25 ---\nAutomotive Servicing NC II (Amended) Promulgated December 2013 23\nEVIDENCE GUIDE\n\n1.Critical aspects of\ncompetency\n\nAssessment requires evidence that the candidate:\n1.1 Identified and accessed manual/specification\n1.2 Interpreted manuals\n1.3 Applied information in manuals\n1.4 Stored manuals\n\n2. Required\nKnowledge\n\n2.1 Types of manuals used in automotive industry\n2.2 Identification of symbols used in the manuals\n3.1 Identification of units of measurements\n3.2 Unit conversion\n\n3. Required skills\n\n3.1 Reading and comprehension skills required to identify\nand interpret automotive manuals and specifications\n3.2 Accessing information and data\n\n4. Resource\nimplication\n\nThe following resources should be provided:\n4.1 All manuals/catalogues relative to Automotive\n4.2 Job order, requisitions\n4.3 Actual vehicle or simulator\n\n5. Method of\nassessment\nCompetency in this unit may be assessed through:\n5.1 Observation with questioning\n5.2 Interview\n\n6. Context of\nassessment\n\n6.1 Assessment must be undertaken in accordance with\n the endorsed TESDA assessment guidelines\n6.2 Assessment may be conducted in the workplace or a\n simulated environment.\n\n--- PDF PAGE 26 ---\nAutomotive Servicing NC II (Amended) Promulgated December 2013 24\nUNIT OF COMPETENCY: USE AND APPLY LUBRICANTS/COOLANTS\n\nUNIT CODE: ALT723204\n\nUNIT DESCRIPTOR: This unit covers the knowledge, skills and attitudes required in\nselecting and applying different types of lubricants.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n\n1. Identify types of\nlubricants/\ncoolants\n\n1.1 Correct information on lubrication schedule is\naccessed and interpreted from appropriate\nmanufacturers specifications manuals\n1.2 Type and quantity of lubricants/coolants are identified\nas per job requirements\n\n2. Use and apply\n lubricants/coolant\n\n2.1 Correct procedure for change of lubricant is identified\nfollowing manufacturer’s specification or manual\n2.2 Correct tools and equipment are selected and used in\nline with job requirements\n2.3 Existing lubricants are removed and replaced with\nspecified types and quantity of new materials in line with\nmanufacturer’s specification\n2.4 Safe procedure and use of PPE are observed when\nremoving or replacing lubricant\n2.5 Used lubricants are disposed in accordance with\nenvironmental guidelines\n2. 6 Work is checked in line with company SOP.\n\n3. Perform\nhousekeeping\nactivities\n\n3.1 Tools, equipment and materials are properly stored as\nper company SOP\n3.2 Workplace is free from waste materials\n\n--- PDF PAGE 27 ---\nAutomotive Servicing NC II (Amended) Promulgated December 2013 25\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n\n1. Manuals\nMay include:\n1.1 Manufacturer’s specification manual\n1.2 Periodic Maintenance manual\n1.3 Service Manual\n2.Lubricants/ Coolant\n\nMay include:\n2.1 Engine oil:\n•\nDiesel engine oil\n•\nGasoline engine oil\n2.2 Automatic Transmission Fluid\n•\nDestro II\n•\nT4\n2.3 Gear oil lubricants:\n•\nOil #90\n•\nOil #140\n•\nOil #30\n•\nOil #40\n2.4 Grease\n• Special (velocity joint)\n Molybdenum disolfate)\n• Ordinary\n• Multi-purpose oil\n• Contact point lubricant\n (grease)\n2.5 Brake/Clutch System\n•\nBrake fluid\n•\nDOT3\n\n2.6 Power Steering Fluid\n•\nHydraulic Fluid\n\n2.7 Radiator Coolant\n•\nLong last coolant\n\n2.8 A/C Compressor Oil\n•\nPag oil\n3. Lubricant\n Schedule\nMay include:\n3.1 Kilometers traveled used\n3.2 No. of Hours used\n3.3 Monthly\n4. Tool and\n equipment\nMay include:\n4.1 Hand tools\n4.2 Oiler\n4.3 Oil Dispenser\n4.4 Grease gun\n5. Personal\nProtective\nEquipment (PPE)\n\nMay include:\n5.1 Apron\n5.2 Gloves\n5.3 Goggles\n5.4 Safety shoes\n\n--- PDF PAGE 28 ---\nAutomotive Servicing NC II (Amended) Promulgated December 2013 26\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\n\nAssessment requires evidence that the candidate:\n1.1 Identified types of lubricants and lubrication schedule.\n1.2 Used and applied lubricants.\n1.3 Performed housekeeping\n\n2. Required\nKnowledge\n2.1 Types/Classification of Lubricants\n2.2 Identifying lubrication schedule\n2.3 Cause and Effects of Gear Oil Dilution\n2.4 Purpose of Lubrication (Problem and effects)\n2.5 Hazard associated with lubrication\n\n3. Required skills\n3.1 Handling of oils (Gear, oil, engine oil)\n3.2 Familiarization/Classification of Lubricants\n3.3 Lubrication Procedure\n\n4. Resource\nimplication\n\nThe following resources should be provided:\n4.1 Workplace: Real or simulated work area\n4.2 Appropriate tools and equipment\n4.3 Materials relevant to activity\n\n5. Method of\nassessment\n\nCompetency in this unit may be assessed through\n5.1 Demonstration with questioning\n5.2 Written/Oral examination\n\n6. Context of\nassessment\n\n6.1 Competency elements must be assessed in a safe\n working environment\n6.2 Assessment must be undertaken in accordance with the\n endorsed industry assessment guidelines\n6.2 Assessment of Underpinning Knowledge and attitude and\nskills may be assessed on or off- the- job\n\n--- PDF PAGE 29 ---\nAutomotive Servicing NC II (Amended) Promulgated December 2013 27\nUNIT OF COMPETENCY: PERFORM SHOP MAINTENANCE\n\nUNIT CODE: ALT723307\n\nUNIT DESCRIPTOR: This unit deals with inspecting and cleaning of work area\nincluding tools, equipment and facilities. Storage of tools and\nequipment and disposal of used materials are also incorporated\nin this competency\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Inspect/clean tools\nand work area\n.\n1.1 Cleaning solvent used as per workshop/tools\n cleaning requirement\n\n1.2 Work area is checked and cleaned\n\n1.3 Wet surface/spot in work area is wiped and dried\n\n2. Store/arrange tools\nand shop equipment\n\n2.1 Tools/equipment are checked and stored in their\n respective shelves/location\n\n2.2 Corresponding labels are posted and visible\n\n2.3 Tools are safely secured and logged in the records\n\n3. Dispose wastes/used\nlubricants\n\n3.1 Containers for used lubricants are visibly labeled\n\n3.2 Wastes/used lubricants are disposed as per\n workshop SOP\n\n4. Report damaged\ntools/equipment\n\n4.1 Complete inventory of tools/equipment is maintained\n\n4.2 Damaged tools/equipment/facilities are identified and\n repair recommendation is given\n\n4.3 Reports prepared have no error/discrepancy\n\n--- PDF PAGE 30 ---\nAutomotive Servicing NC II (Amended) Promulgated December 2013 28\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Work Area\nMay include:\n1.1 Workshop areas for servicing/repairing light and/or heavy\nvehicle and/or plant transmissions and/or outdoor power\nequipment\n1.2 Open workshop/garage and enclosed, ventilated office\narea\n1.3 Other variables may include workshop with:\n• Mess hall\n• Wash room\n• Comfort room\n2. Cleaning\n requirement\nMay include:\n2.1 Cleaning solvent\n2.2 Inventory of supplies, tools, equipment, facilities\n2.3 List of mechanics/technicians\n2.4 Rags\n2.5 Broom\n2.6 Map\n2.7 Pail\n2.8 Used oil container\n2.9 Oiler\n2.10 Dust/waste bin\n3. Manuals\nMay include:\n3.1 Vehicle/plant manufacturer specifications\n3.2 Company operating procedures\n3.3 Industry/Workplace Codes of Practice\n3.4 Product manufacturer specifications\n3.5 Customer requirements\n3.6 Industry Occupational Health &Safety\n4. Company\nstandard\noperating\nprocedure\nMay include:\n4.1 Gloves\n4.2 Apron\n4.3 Goggles\n4.4 Safety shoes\n\n--- PDF PAGE 31 ---\nAutomotive Servicing NC II (Amended) Promulgated December 2013 29\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1Cleaned workshop tools/facilities\n1.2Maintained equipment, tools and facilities\n1.3Disposed wastes and used lubricants/fluid as per required\n procedure\n2. Required\nKnowledge\n2.1 5S or TQM\n2.2 Service procedures\n2.3 Relevant technical information\n2.4 Safe handling of Equipment and tools\n2.5 Vehicle safety requirements\n2.6 Workshop policies\n2.7 Personal safety procedures\n2.8 Fire Extinguishers and prevention\n2.9 Storage/Disposal of Hazardous/flammable materials\n2.10 Positive Work Values (Perseverance, Honesty, Patience,\n Attention to Details)\n3. Required skills\n3.1 Handling/Storing of tools/equipment/supplies and material\n3.2 Cleaning grease/lubricants\n3.3 Disposing of wastes and fluid\n3.4 Preparing inventory of s/m and tools and equipment\n3.5 Monitoring of s/m and tools/equipment\n4. Resource\nimplications\nThe following resources should be provided:\n4.1 Workplace: Real or simulated work area\n4.2 Appropriate Tools & equipment\n4.3 Materials relevant to the activity\n5. Method of\nassessment\nCompetency in this unit may be assessed through:\n5.1 Written/Oral Questioning\n5.2 Demonstration\n6. Context of\nassessment\n6.1 Competency must be assessed on the job or\n simulated environment.\n6.2 The assessment of practical skills must take place after a\n period of supervised practice and repetitive experience.\n\n--- PDF PAGE 32 ---\nAutomotive Servicing NC II (Amended) Promulgated December 2013 30\nUNIT OF COMPETENCY: PREPARE JOB ESTIMATE/COSTING\n\nCODE: ALT311204\n\nUNIT DESCRIPTOR: This competency unit covers the knowledge, skills and\n attitude in estimating/costing automotive repair.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n\n1. Identify\nnature/scope of\nwork\n\n1.1 Effective communication skills are applied to determine the\nnature and scope of work to be undertaken\n1.2 Extent of service to be rendered is determined and\ndocumented in line with standard operating procedures\n(SOP)\n\n2. Prepare and\npresent estimate\n\n2.1 Type and quantity of supplies, materials and labor required\nto perform work are identified in line with job requirements\n2.2 Cost of supplies, materials are obtained from suppliers\n2.3 Total cost of required services is calculated in line with\nSOP\n2.4 Estimate is presented to customer in line with SOP.\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n\n1. Communication\nMay include:\n1.1 Listening to customer\n1.2 Speaking with suppliers, customers and co-\nworkers\n1.3 Questioning\n\n2. Suppliers\nMay include:\n2.2 Distributors\n2.3 Managers\n2.4 Proprietors\n\n3. Cost\nMay include:\n3.1 Materials\n3.2 Labor\n3.3Overhead\n\n--- PDF PAGE 33 ---\nAutomotive Servicing NC II (Amended) Promulgated December 2013 31\nEVIDENCE GUIDE\n\n1. Critical aspects\nof competency\n Assessment requires evidence that the candidate\n1.1 Identified nature/scope of work\n1.2 Prepared and presented estimate\n\n2. Required\nKnowledge\n\n2.1 Consumer mathematics\n2.2 Replaceable/Fabricated Materials or Spare parts in\n a vehicle\n2.3 Automotive Repair Procedures and Techniques\n2.4 Job estimates\n2.5 Honesty, Perseverance, Patience, Attention to Details\n\n3. Required\nskills\n\n3.1 Computing using the Four Mathematical Operations\n3.2 Estimating repair works and activities\n4. Resource\n implications\nThe following resources should be provided:\n4.1 Appropriate tools such as calculator, paper, pen, and\nother measuring instruments relevant to activity\n5. Method of\n assessment\nCompetency in this unit may be assessed through:\n5.1 Observation with questioning\n5.2 Presentation of Finished drawing\n\n6. Context of\nassessment\n\n6.1 Competency must be assessed in a room or any\n simulated places\n6.2 Assessment must be given according to industry standard\n\n--- PDF PAGE 34 ---\nAutomotive Servicing NC II (Amended) Promulgated December 2013 32\nUNIT OF COMPETENCY: INTERPRET/DRAW TECHNICAL DRAWING\n\nCODE: ALT311205\n\nUNIT DESCRIPTOR:\nThis unit identifies the competencies required to\ndraw/interpret basic trade drawing\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Interpret technical\n drawing\n1.1 Components, assemblies or objects are recognized as\nrequired\n1.2 Dimensions are identified as appropriate to the field of\nemployment\n1.3 Instructions are identified and followed as required\n1.4 Material and other consumable requirements are\nidentified as required\n1.5 Symbols are recognized as appropriate in drawing\n2. Select correct\ntechnical drawing\n\n2.1 Drawing is checked and validated against job\nrequirements or equipment\n2.2 Drawing version is checked and validated according to the\nManual\n3. Apply freehand\nsketching\n3.1 Correct freehand sketching is produced using the\nnecessary tools and materials\n\n--- PDF PAGE 35 ---\nAutomotive Servicing NC II (Amended) Promulgated December 2013 33\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Drawing\nMay include:\n1.1 Drawing symbols\n1.2 Alphabet of lines\n1.3 Orthographic views\n1.3.1\nFront view\n1.3.2\nRight side view/left side view\n1.3.3\nTop view\n1.3.4\nPictorial\n1.4 Schematic diagram\n2. Manual\nMay include:\n2.1 technical drawing manual\n2.2 manufacturers schematic diagram\n3. Consumables\nMay include:\n3.1 drawing plate\n3.2 pencil and eraser\n3.3 scotch tape\n4. Tools and\n materials\nMay include:\n4.1 compass\n4.2 divider\n4.3 rulers\n4.4 triangles\n4.5 drawing tables\n4.6 computer\n\n--- PDF PAGE 36 ---\nAutomotive Servicing NC II (Amended) Promulgated December 2013 34\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Interpreted technical drawing\n1.2 Selected correct technical drawing\n1.3 Applied freehand sketching\n2. Required\nKnowledge\n2.1 Drawing standard symbols\n2.2 Safe handling of tools and consumables\n2.3 Identification of types of drawing\n2.4 Patience, Perseverance, Attention to Details\n3. Required skills\n3.1 Draw/interpret orthographic drawing\n3.2 Handling of drawing instruments\n4. Resource\n implications\nThe following resources should be provided:\n4.1 Drawing room\n4.2 Appropriate tools\n4.3 Materials relevant to activity\n5. Method of\n assessment\nCompetency in this unit may be assessed through:\n5.1 Observation with questioning\n5.2 Written/Oral examination\n5.3 Presentation of Finished drawing\n6. Context of\nassessment\n6.1 Must be assessed in a drawing room or in any\nsimulated places\n6.2 Assessment must be given according to industry\n standard\n\n--- PDF PAGE 37 ---\nAutomotive Servicing NC II (Amended) Promulgated December 2013 35\n\nUNIT OF MPETENCY: PRACTICE HEALTH, SAFETY AND ENVIRONMENT\nPROCEDURES\nUNIT CODE : ALT723206\nUNIT DESCRIPTOR : This unit of competency incorporates the work safe regional\nguidelines and encompasses competencies necessary to\napply basic safety and emergency procedures to maintain a\nsafe workplace for staff, customers and others.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Apply basic safety\nprocedures\n1.1.\nPolicies and procedures to achieve a safe working\nenvironment are followed and maintained in line with\noccupational health and safety (OHS) procedures\nand according to worksite policy\n1.2.\nAll unsafe situations are recognized and reported\naccording to worksite policy\n1.3.\nAll breakdowns in relation to machinery and\nequipment are reported to supervisor or nominated\npersons\n1.4.\nFire and safety hazards are identified and\nprecautions are taken or reported according to\nworksite policy and procedures\n1.5.\nDangerous goods and substances are identified,\nhandled and stored according to worksite policy and\nprocedures and OHS requirements\n1.6.\nWorksite policy regarding manual handling practice is\nfollowed\n1.7.\nParticipation in consultative arrangements\nestablished by company for OHS is exercised\n2. Apply emergency\nprocedures\n2.1.\nWorksite policies and emergency procedures\nregarding illness or accidents are identified and\napplied\n2.2.\nSafety alarms are identified\n2.3.\nQualified persons are contacted in the event of\naccident or sickness of customers or staff and\naccident details are documented according to\nworksite accident/ injury procedures\n2.4.\n Worksite evacuation procedures are identified and\napplied\n\n--- PDF PAGE 38 ---\nAutomotive Servicing NC II (Amended) Promulgated December 2013 36\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Policies and\nprocedures\nMay include:\n1.1.\nHazard policies and procedures\n1.2.\nEmergency, fire and accident procedures\n1.3.\nPersonal safety procedures\n1.4.\nProcedures for the use of personal protective clothing\nand equipment\n1.5.\nUse of motor vehicles\n1.6.\nResolution procedures\n1.7.\nJob procedures\n1.8.\nWork instructions\n2. OHS procedures\nMay include:\n2.1.\nSafe manual handling and lifting customers, staff,\nequipment/tooling, premises and stock\n3. Hazards\nMay include:\n3.1.\nSharp cutting tooling and instruments\n3.2.\nElectricity and water\n3.3.\nToxic substances\n3.4.\nDamaged packing material or containers\n3.5.\nBroken or damaged equipment\n3.6.\nFlammable materials and fire hazards\n3.7.\nLifting practices\n3.8.\nSpillages, waste and debris especially on floors,\nladders, trolleys and glue guns/burns\n\n4. Emergency\nprocedures\nMay include:\n4.1.\nSickness\n4.2.\nAccident\n4.3.\nFire or store evacuation involving staff or customers\n\n--- PDF PAGE 39 ---\nAutomotive Servicing NC II (Amended) Promulgated December 2013 37\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\n\nAssessment requires evidence that the candidate has:\n1.1 Communicated effectively with others involved in or\naffected by the work\n1.2 Identified and assessed hazardous situations and\nrectified, or reported to the relevant persons\n1.3 Operated fire-fighting equipment\n1.4 Handled safely and stored dangerous and/or hazardous\ngoods and substances\n1.5 Applied safe manual handling practices\n1.6 Operated safely and effectively equipment and utilized\nmaterials over the full range of functions\n1.7Followed worksite evacuation procedures.\n2. Required knowledge\nGeneral knowledge of:\n2.1\nThe implications of OHS on efficiency, morale and\ncustomer relations\n2.2\nCommon automotive terminology\n2.3\nOHS regulations/requirements, equipment, material\nand personal safety requirements\n2.4\nSafe manual handling theories and practices\n2.5\nThe selection and application of fire-fighting\nequipment\n2.6\nDangerous goods and hazardous chemicals handling\nprocesses\n2.7\nWorksite reporting procedures\n3. Required Skills\n3.1.\nCollect, organize and understand information related\nto recognizing and reporting situations\n3.2.\nCommunicate ideas and information to reporting\nprocedures (verbal and written)\n3.3.\nPlan and organize activities which implement and\nfollow standard procedures\n3.4.\nWork with others and in a team by assisting and\ncooperating with team members\n3.5.\nUse mathematical ideas and techniques to document\nand report numbers for emergency procedures\n3.6.\nEstablish diagnostic processes which recommend\nimprovements for OHS issues\n3.7.\nUse workplace technology related to the use of\ntechnology to assist with safe work practices\n4. Resource\nImplications\n\nThe following resources should be provided:\n4.1.\nA workplace or simulated workplace\n4.2.\nSituations requiring safe working practices\n4.3.\nWorksite or equivalent instructions on safe working\npractice\n4.4.\nHazardous chemicals and/or dangerous goods\ninformation\n4.5.\nMaterials, tooling and equipment\n4.6.\nFirefighting appliances and fire test facilities\n5. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n5.1 Portfolio Assessment\n5.2 Interview\n5.3 Case Study/Situation\n6. Context for\nAssessment\n6.1 Competency may be assessed in the work place or in a\nsimulated work place setting\n\n--- PDF PAGE 40 ---\nAutomotive Servicing NC II (Amended) Promulgated December 2013 38\nUNIT OF COMPETENCY: INSPECT TECHNICAL QUALITY OF WORK\nUNIT CODE : ALT311207\nUNIT DESCRIPTOR : . This unit covers the competence to inspect work done\nby\n other staff, apply quality standards to work, and protect\n customer property and interests.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\n1. Gather information to\n carry out inspection\n1.1 OH&S requirements, including company\nregulatory requirements and personal protection\nneeds are observed throughout the work\n1.2 Pertinent information are sourced\n1.3 Different methods are analyzed and those most\nappropriate to the circumstances are selected\nand prepared\n1.4 Technical and/or calibration requirements for\ninspection are sourced and needed equipment is\nidentified and prepared\n2. Inspect and apply quality\nstandards to work\n2.1 Work is identified and confirmed for inspection in\n accordance with company quality procedures\n2.2 Quality Inspections are conducted throughout\nthe course of the work to ensure quality\nstandards are maintained\n2.3 Quality standards are applied during work\ncompletion to ensure the treatment of customer\nproperty meets industry and / or company\nstandards\n2.4 Activities are coordinated throughout the\nworkplace in accordance with company\nprocedures\n2.5 Documents of work quality are maintained\naccording to company requirements\n3. Achieve quality work\n outcomes\n\n3.1 Damage to customer property is avoided\nthrough ensuring staff adherence to quality\nprocedures and use of protective materials at all\nstages of the repair or service\n3.2 Communication pertaining to quality\nimprovements and recommendations are to be\ndone in accordance with company requirements\n\n--- PDF PAGE 41 ---\nAutomotive Servicing NC II (Amended) Promulgated December 2013 39\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. OH&S Requirements\nMay include:\n 1.1 Safety equipment\n1.2 Personal protective equipment and clothing\n1.3 First aid equipment\n1.4 Hazard and risk control\n1.5 Elimination of hazardous materials and\nsubstances manual handling, including shifting,\nlifting and carrying\n1.6 Emergency procedures\n1.4 Road rules and safe driving policy\n2. Information\nMay include:\n 2.1 Manufacturer / component supplier\nspecifications\n2.2 Company operating procedures\n2.3 Supplier directories\n2.4 Parts catalogues\n2.5 Customer orders\n2.6 Service manual\n2.7 Material safety data sheets\n3. Quality Procedures\nMay include:\n3.1 Worksite quality system documentation\n3.2 Work instructions\n3.3 Safe work procedures\n3.4 Product specifications\n3.5 Equipment maintenance schedules\n3.6 Technical procedures\n3.7 Adopted or specifically prepared standards\n4. Quality Inspections\nMay include:\n4.1 Periodic inspection during the job or\nobservation at completion of the job to ensure\nall ordered parts have been fitted, components\nused meet manufacturer / component supplier\nspecifications, invoicing complies with service /\nrepair / parts order and contains sufficient\ndetails of labor and / or components used\n4.2 Reported and diagnosed problems have been\nconfirmed as rectified thru test procedures and\npresentation of the vehicle or equipment after\nservice / repair meets manufacturer and\n Company standards\n5. Communication\nMay include:\n5.1 Verbal\n5.2 Written\n5.3 Telephone or Electronic means\n\n--- PDF PAGE 42 ---\nAutomotive Servicing NC II (Amended) Promulgated December 2013 40\nEVIDENCE GUIDE\n1. Critical aspects of\n competency\nAssessment requires evidence that the candidate:\n1.1 Observed safety procedures and requirements\n1.2 Communicated effectively with others involved in or\n affected by the work\n1.3 Applied OH&S policies and procedures\n1.4 Identified quality procedures\n1.5 Inspected work undertaken by others\n1.5 Applied quality standards to work\n2. Required\nknowledge\nA working knowledge of:\n2.1 Quality systems in a workplace\n2.2 Common automotive terminology\n2.3 Vehicle safety requirements\n2.4 Work planning processes\n2.5 OH&S regulations/requirements, equipment, material\n and personal safety requirements\n2.6 Company quality systems and procedures\n2.7 Worksite environmental control measures\n2.8 Worksite reporting procedures\n3. Required skills\n3.1 Communicating ideas and information\n3.2 Collecting, analyzing and organizing information\n3.3 Planning and organizing activities\n3.4 Working with others and in a team\n3.5 Using mathematical ideas and techniques\n3.6 Solving problems\n3.7 Using technology\n4. Resource\nimplications\nThe following resources should be provided:\n4.1 A workplace or simulated workplace\n4.2 Situations requiring inspections of technical quality\n 4.3 Computer hardware and software, access to\nelectronic communication\n5. Method of\nassessment\nCompetency in this unit may be assessed through:\n5.1 Direct Observation\n5.2 Oral interview\n5.3 Written Evaluation\n5.4 Third Party Report\n6. Context of\nassessment\n6.1 Competency may be assessed individually in the\nactual workplace or simulation environment in TESDA\naccredited institutions\n\n--- PDF PAGE 43 ---\nAutomotive Servicing NC II (Amended) Promulgated December 2013 41\nUNIT OF COMPETENCY: MAINTAIN QUALITY SYSTEMS\nUNIT CODE : ALT311208\nUNIT DESCRIPTOR : This unit of competency covers the competence to\nconduct the final quality check on completed work or\norders, report on the quality of processes and work\noutcomes, and implement improvements to work\nprocesses.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\n1. Conduct final quality\ncheck on completed\nwork / orders\n\n1.1. Completed work / orders are checked for\ncompliance with supplier, company or customer\nspecifications\n1.2. Level of inspection conducted is appropriate to\nthe size and importance of the job\n1.3. Documentation is authorized in accordance with\ncompany requirements\n1.4. Feedback is provided to staff on the quality of\ntheir work with equal emphasis on strengths and\nweaknesses and opportunities for development\n2. Report on the quality of\nprocesses and work\noutcomes\n\n2.1. Documents are kept according to company\nquality procedures on outcomes of quality\nchecks\n2.2. Quality problems are identified according to\ncompany performance indicators\n2.3. Information relating to the quality of processes\nand work outcomes is provided to appropriate\npersons on a regular basis\n3. Implement\nimprovements to work\nprocesses\n\n3.1. Staff input is encouraged to generate possible\nsolutions to quality problems\n3.2. Options for solving quality problems are\ngenerated and the costs and benefits of each\noption are evaluated\n3.3. Recommended solutions to quality problems are\ndiscussed with management\n3.4. Improvements to work processes are\nimplemented according to company policies and\nprocedures\n\n--- PDF PAGE 44 ---\nAutomotive Servicing NC II (Amended) Promulgated December 2013 42\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Quality procedures\nMay include:\n1.1 Company quality system documentation\n1.2 Work instructions\n1.3 Safe work procedures\n1.4 Product specifications\n1.5 Equipment maintenance schedules\n1.6 Technical procedures and adopted or\nspecifically prepared standards\n2. Performance indicators\n\nMay include:\n• account for issues of time, quantity, quality and\ncost factors and may include establishing time\ntargets for own work, identifying reasonable\ncriteria for evaluating own work outcomes,\nidentifying measures to avoid wastage,\nidentifying reasonable criteria to judge internal\nand/or external customer satisfaction\n3. Quality problems\n\nMay include:\n3.1 Misdiagnosed faults\n3.2 Jobs requiring rework\n3.3 Jobs which do not meet customer\nrequirements\n3.4 Repairs which do not fix the problem within the\nallocated timeframe\n4. Communication\n\nMay include:\n4.1 Verbal\n4.2 Written\n4.3 Telephone or other means\n5. Information/documents\n\nMay include:\n5.1 Vehicle manufacturer practices\n5.2 Company operating procedures\n5.3 Supplier directories\n5.4 Parts catalogues\n5.5 Customer orders and industry/workplace\ncodes of practice\n5.6 Material safety data sheets (MSDS)\n\n--- PDF PAGE 45 ---\nAutomotive Servicing NC II (Amended) Promulgated December 2013 43\nEVIDENCE GUIDE\n1. Critical aspects\nof competency\nAssessment requires evidence that the candidate:\n1.1 Communicated effectively with others involved in or\naffected by the work\n1.2 Identified quality system procedures and needs\n1.3 Identified performance indicators\n1.4 Conducted final quality checks on completed work\norders\n1.5 Reported on the quality of processes and work\noutcomes\n1.6 Monitored and adjusted performance indicators to\nmeet changing circumstances\n1.7 Processed and implemented recommendations for\nchange\n2. Required\nknowledge\nKnowledge of:\n• quality systems and application techniques in a work\nenvironment\n• typical loss and damage control systems\n• work planning and organization processes\n• occupational health and safety (OHS)\nregulations/requirements, equipment, material and\npersonal safety requirements at the worksite\n• enterprise quality systems and procedures\n• worksite information management systems\n3. Required skills\n3.1 Research and interpretive skills to locate, interpret and\napply quality audit policies and procedures\n3.2 Investigative and analytical skills required for\nidentification and analysis of quality breaches,\nincidents or risks, and identification of quality related\ntraining needs\n3.3 English literacy and communication skills in relation to\ndealing with customers and team members on\nworksite quality audit issues\n3.4 Questioning and active listening skills\n3.5 Written communication skills sufficient to prepare\nreports, document investigations and maintain\nworksite quality documents\n3.6 Plan and organize activities for leadership skills\nrequired in organizing, implementing and promoting\nworksite quality systems and measures\n3.7 Work with others and in a team by seeking advice and\nassistance from team members\n3.8 Use mathematical ideas and techniques to document\nquantities and company sampling procedures\n3.9 Establish diagnostic processes which analyze\nproblems and recommend solutions\n3.10 Use the workplace technology related to document\nand analyze quality problems\n\n--- PDF PAGE 46 ---\nAutomotive Servicing NC II (Amended) Promulgated December 2013 44\n4. Resource\nimplications\nThe following resources should be provided:\n4.1 A workplace or simulated workplace\n4.2 Situations requiring worksite quality systems\nmaintenance\n4.3 Worksite quality policies and procedures\n4.4 Worksite quality documents system\n4.5 Materials, tooling and equipment\n5. Method of\nassessment\nCompetency in this unit may be assessed through:\n5.1 Direct Observation\n5.2 Oral interview\n5.3 Written Evaluation\n5.4 Third Party Report\n6. Context of\nassessment\n6.1 Competency may be assessed individually in the\nactual workplace or simulation environment in TESDA\naccredited institutions\n\n--- PDF PAGE 47 ---\nAutomotive Servicing NC II (Amended) Promulgated December 2013 45\nUNIT OF COMPETENCY: PROVIDE WORK SKILL INSTRUCTIONS\nUNIT CODE : ALT311209\nUNIT DESCRIPTOR : This unit describes the performance outcomes, skills\nand knowledge required to conduct individual and group\ninstruction and demonstrate work skills, using existing\nlearning resources in a safe and comfortable learning\nenvironment. The unit also covers the skills and\nknowledge required to determine the success of both\nthe training provided and one's own personal training\nperformance. It emphasizes the training as being driven\nby the work process and context.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Organize instruction\nand demonstration\n\n1.1 Gather information about learner characteristics\nand learning needs\n1.2 Confirm a safe learning environment\n1.3 Gather and check instruction and demonstration\nobjectives and seek assistance if required\n1.4 Access and review relevant learning resources\nand learning materials for suitability and\nrelevance, and seek assistance to interpret the\ncontextual application\n1.5 Organize access to necessary equipment or\nphysical resources required for instruction and\ndemonstration\n1.6. Notify learners of details regarding the\nimplementation of the learning program and/or\ndelivery plan\n2. Conduct instruction\nand demonstration\n\n2.1 Use interpersonal skills with learners to establish a\nsafe and comfortable learning environment\n2.2 Follow the learning program and/or delivery plan to\ncover all learning objectives\n2.3 Brief learners on any OHS procedures and\nrequirements prior to and during training\n2.4 Use delivery techniques to structure, pace and\nenhance learning\n2.5 Apply coaching techniques to assist learning\n2.6 Use communication skills to provide information,\ninstruct learners and demonstrate relevant work\nskills\n2.7 Provide opportunities for practice during instruction\nand through work activities\n2.8 Provide and discuss feedback on learner\nperformance to support learning\n3. Check training\nperformance\n\n3.1 Use measures to ensure learners are acquiring\nand can use new technical and generic skills and\nknowledge\n3.2 Monitor learner progress and outcomes in\nconsultation with learner\n3.3 Review relationship between the trainer/coach and\nthe learner and adjust to suit learner needs\n4. Review personal\ntraining performance\nand finalize\ndocumentation\n4.1 Reflect upon personal performance in providing\ninstruction and demonstration, and document\nstrategies for improvement\n4.2 Maintain, store and secure learner records\naccording to organizational and legal requirements\n\n--- PDF PAGE 48 ---\nAutomotive Servicing NC II (Amended) Promulgated December 2013 46\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Learner Characteristics\nMay include:\n1.1 Language, literacy and numeracy levels\n1.2 Learning styles\n1.3 Past learning and work experiences\n1.4 Specific needs\n1.5 Workplace culture\n2. Safe Learning\nEnvironment\nMay include:\n2.1 Exit requirements\n2.2 Personal protective equipment\n2.3 Safe access\n2.4 Safe use of equipment\n3. Instruction and\ndemonstration\nobjectives\nMay include:\n3.1 Competencies to be achieved\n3.2 Generic and technical skills, which may be\n provided by the organization, developed by a\ncolleague and individual or group objectives\n3.3 Learning outcomes.\n4. Learning resources\nMay include:\n4.1 Learner and user guides\n4.2 Trainer and Facilitator guides\n4.3 Example training programs\n4.4 Specific case studies\n4.5 Professional development materials\n4.6 Assessment materials\n4.7 A variety of formats produced locally or acquired\nfrom other sources\n5. Learning materials\nMay include:\n5.1 Handouts for learners\n5.2 Materials sourced from the workplace, like\nworkplace documentation, operating procedures,\nand specifications\n6. Details\n\nMay include:\n6.1 Location and time\n6.2 Outcomes of instruction or demonstration\n6.3 Reason for instruction or demonstration\n6.4 Who will be attending instruction session\n\n--- PDF PAGE 49 ---\nAutomotive Servicing NC II (Amended) Promulgated December 2013 47\n7. OHS procedures\n\nMay include:\n7.1 Emergency procedures\n7.2 Hazards and their means of control\n7.3 Incident reporting\n7.4 Use of personal protective equipment\n7.5 Safe work practices\n7.6 Safety briefings\n7.7 Site-specific safety rules\n8. Delivery techniques\n\nMay include:\n8.1 Coaching\n8.2 Demonstration\n8.3 Explanation\n8.4 Group or pair work providing opportunities to\npractice skills and solve problems\n8.5 Questions and answers\n9. Coaching\n\nMay include:\n9.1 Learning arrangements requiring immediate\ninteraction and feedback\n9.2 On-the-job instruction and 'buddy' systems\n9.3 Relationships targeting enhanced performance\n9.4 Short-term learning arrangements\n9.5 Working on a one-to-one basis.\n10. Measures\n\nMay include:\n10.1 Informal review or discussion\n10.2 Learner survey\n10.3 On-the-job observation\n10.4 Review of peer coaching arrangements.\n\n--- PDF PAGE 50 ---\nAutomotive Servicing NC II (Amended) Promulgated December 2013 48\nEVIDENCE GUIDE\n1. Critical aspects of\ncompetency\n1.1 Carried out a minimum of three training sessions,\ninvolving demonstrating and instructing particular work\nskills for different groups; with each session\naddressing:\n 1.1.1 Different learning objectives\n 1.1.2 A range of techniques and effective\ncommunication skills appropriate to the audience\n2. Required\nknowledge\n2.1 Learner characteristics and needs\n2.2 Content and requirements of the relevant learning\nprogram and/or delivery plan\n2.3 Sources and availability of relevant learning resources\nand learning materials\n2.4 Content of learning resources and learning materials\n2.5 Training techniques that enhance learning and when\nto use them\n2.6 Introductory knowledge of learning principles and\nlearning styles\n2.7 Key OHS issues in the learning environment,\nincluding:\n• roles and responsibilities of key personnel\n• responsibilities of learners\n• relevant policies and procedures, including hazard\nidentification, risk assessment, reporting\nrequirements, safe use of equipment and\nemergency procedures\n• risk controls for the specific learning environment\n3. Required skills\n3.1 Non-verbal communication techniques, such as:\n• asking relevant and appropriate questions\n• providing explanations\n• demonstrating\n• using listening skills\n• providing information clearly\n3.2 Safety skills to implement OHS requirements, by\nacting and responding safely in order to:\n• identify hazards\n• conduct prestart-up checks if required\n• observe and interpret learner behaviour that may\nput people at risk\n3.3 Time-management, skills to:\n• ensure all learning objectives are covered\n• pace learning\n3.4 Reflection skills in order to:\n• identify areas for improvement\n• maintain personal skill development\n3.5 Literacy skills to:\n• complete and maintain documentation\n• read and follow learning programs and plans\n• read and analyze learner information\n\n--- PDF PAGE 51 ---\nAutomotive Servicing NC II (Amended) Promulgated December 2013 49\n3.6 Technology skills to operate audio-visual and\ntechnical equipment\n3.7 Interpersonal skills to:\n• engage, motivate and connect with learners\n• provide constructive feedback\n• maintain appropriate relationships\n• establish trust\n• use appropriate body language\n• maintain humor\n• demonstrate tolerance\n• manage a group\n• recognize and be sensitive to individual difference\nand diversity\n3.8 Observation skills to:\n• monitor learner acquisition of new skills, knowledge\nand competency requirements\n• assess learner communication and skills in\ninteracting with others\n• identify learner concerns\n• recognize learner readiness to take on new skills\nand tasks\n4. Resource\nimplications\nThe following resources should be provide:\nEvidence must be gathered in the workplace wherever\npossible. Where no workplace is available, a simulated\nworkplace must be provided\n5. Method of\nassessment\nCompetency in this unit may be assessed through:\n5.1 Direct Observation\n5.2 Oral interview\n5.3 Written Evaluation\n5.4 Third Party Report\n\n6. Context of\nassessment\n6.1 Competency may be assessed individually in the\nactual workplace or simulation environment in TESDA\naccredited institutions\n\n--- PDF PAGE 52 ---\nAutomotive Servicing NC II (Amended) Promulgated December 2013 50\nUNIT OF COMPETENCY: IDENTIFY AND SELECT ORIGINAL AUTOMOTIVE\nPARTS AND PRODUCTS\nUNIT CODE : ALT723210\nUNIT DESCRIPTOR : This unit of competency covers the competence\nrequired to identify original automotive parts and\nproducts based on evidence from customers and/or\nother sources which may include catalogue numbers or\nsamples of parts/products or their purpose.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\n1. Identify the part/product\nand its end use\n1.1 Available part/product information is gathered,\ndocumented and confirmed with customer\n1.2 Information gathering techniques is\nestablished for proper identification of\npart/product\n1.3 End user or host for the part/product, i.e.\nvehicle/unit assembly or vehicle/unit assembly\noptions, is established from an analysis of\navailable information\n2. Identify details of the\npart/product\n2.1 The parts/product cataloguing system is\nidentified and accessed\n2.2 Part/product is matched accurately with\ncataloguing information by accessing and using\nthe catalogue system\n2.3 Details of identity of the part/product are\ndocumented and processed\n3. Part/product is supplied\nor ordered for customer\n\n3.1 Customer accepts process used\n3.2 Part/product is supplied or ordered if not\navailable\n3.3 Customer records are updated\n\n--- PDF PAGE 53 ---\nAutomotive Servicing NC II (Amended) Promulgated December 2013 51\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Part/product information\nMay include:\n1.1 Manufacturer/component supplier\nspecifications and technical documentation\n1.2 Company procedures and documentation\n1.3 Company or industry specifications, diagrams,\nsketches\n1.4 Verbal descriptions and physical and visual\nevidence\n2. Information gathering\ntechniques\n\nMay include:\n2.1 Common vehicle/unit model\n2.2 Date of manufacture\n2.3 Purpose and appearance of product and other\ntracking information\n3. Parts/products\ncataloguing systems\n\nMay include:\n3.1 Hard-copy (book-fast, loose-leaf)\n3.2 Stand-alone computer or networked/online\ncomputer-supported services\n\n--- PDF PAGE 54 ---\nAutomotive Servicing NC II (Amended) Promulgated December 2013 52\nEVIDENCE GUIDE\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Elicited sufficient information from the customer and/or\nother sources to enable a confirmed identification of\nvehicle or unit the part/product intended\n1.2 Accessed the parts/products catalogue systems\nassociated with required vehicle/unit\n1.3 Used both manual and computer-based\nparts/products catalogues and equivalent\ndocumentation to trace and identify common specific\nbrand parts/products\n1.4 Communicated effectively with others involved in or\naffected by the work.\n2. Required\nknowledge\nCompetency includes sufficient knowledge to:\n2.1 Structural of computer workstations\n2.2 Common automotive terminology\n2.3 Main automotive systems and assemblies and their\nfunctions\n2.4 Parts/product catalogue systems, both brand-specific\nand general options\n2.5 Legal issues associated with the supply and use of\nnon-conforming parts/components/accessories\n2.6 Company quality system\n2.7 Work organization and planning processes\n3. Required skills\nRequired skills include the ability to:\n3.1 Apply research and interpretive skills sufficient to\nlocate, interpret and apply manufacturer/component\nsupplier procedures, workplace policies and\nprocedures\n3.2 Apply analytical skills required for identification and\nanalysis of technical information\n3.3 Apply plain English literacy and communication skills\nin relation to dealing with customer and team members\n3.4 Apply questioning and active listening skills\n3.5 Apply oral communication skills sufficient to convey\ninformation and concepts to customers\n3.6 Apply planning and organizing skills to own work\nactivities, including making good use of time and\nresources, sorting out priorities and monitoring own\nperformance\n3.7 Use mathematical ideas and techniques to correctly\ncalculate material requirements, estimate and\ncalculate costs and establish quality checks\n3.8 Use workplace technology related to customer\nservices, including use of measuring equipment,\ncomputerized technology, use of communication\ndevices and reporting/ documenting of results\n\n--- PDF PAGE 55 ---\nAutomotive Servicing NC II (Amended) Promulgated December 2013 53\n\n4 Resource\nimplications\nThe following resources should be provided:\n4.1 Workplace location or simulated workplace\n4.2 Information and material identifying and selecting\nautomotive parts and products\n4.3 Equipment identifying and selecting automotive parts\nand products\n4.4 Activities covering task requirements\n4.5 Specifications and work instructions.\n5 Method of\nassessment\nCompetency in this unit may be assessed through:\n5.2\nDirect Observation\n5.3\nOral interview\n5.4\nWritten Evaluation\n5.5\nThird Party Report\n\n6 Context of\nassessment\n6.1 Competency may be assessed individually in the\nactual workplace or simulation environment in TESDA\naccredited institutions\n\n--- PDF PAGE 56 ---\nAutomotive Servicing NC II (Amended) Promulgated December 2013 54\nCORE COMPETENCIES\n\nUNIT OF COMPETENCY :\nSERVICE AUTOMOTIVE BATTERY\n\nUNIT CODE: ALT723303\n\nUNIT DESCRIPTOR: This unit identifies the competence required to: service,\nremove, replace, test and charge automotive batteries. The\ncompetency is applicable to batteries fitted to\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n(Note: All standard of performance for Service Automotive Battery\nis in accordance with company standard operating procedure\nand manufacturer’s specification Manuals using specified tools,\nequipment and consumables.)\n1. Test automotive\n battery\n1.1 Battery is tested without causing damage to any\nworkplace property or vehicle.\n1.2 Correct information is accessed and interpreted\nbased on manufacturer specifications.\n1.3 Appropriate test equipment is selected.\n1.4Tests are performed and results analyzed\n1.5 Findings is reported to direct supervisor\n2. Remove and replace\n batteries.\n\n2.1 Battery is removed and replaced without\n causing damage to any workplace property or\n vehicle.\n2.2 Appropriate tools and equipment are selected\n and used.\n2.3 Action is taken to prevent loss of vehicles\n electronic memory if applicable.\n3. Service and charge\n batteries.\n\n3.1 Battery is charged using the appropriate battery\n charger.\n3.2 Electrolyte levels are checked and topped up\n3.3 Battery and its terminals are cleaned.\n3.4 Multiple connectors are repaired and replaced to\n restore integrity of the involved circuit\n3.5 Leads are connected/disconnected in sequence\n as per polarity\n4. Jump-start vehicle.\n\n4.1 Vehicle is jump started without causing damage to\n any workplace property or vehicle.\n4.2 Jumper leads are selected and used ensuring spike\n protection is employed when necessary.\n4.3 Leads are connected/disconnected in correct\n according to sequence and polarity.\n\n--- PDF PAGE 57 ---\nAutomotive Servicing NC II (Amended) Promulgated December 2013 55\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Battery\nMay include:\n1.1 Maintenance Free type\n1.2 Dry cell Type\n1.3 Or by size\n2. Manual\nMay include:\n2.1 Manufacturer Specification Manual\n2.2 Maintenance Procedure Manual\n2.3 Periodic Maintenance Data\n2.4 Service Manual\n2.5 Parts Checklist\n3. Company\nStandard\nOperating\nProcedure\nMay include:\n3.1 Job Order\n3.2 Requisition slip\n3.3 Wearing of Personal Protective Equipment such as\n• Goggles\n• Hand gloves\n• Apron\n•\nSafety shoes\n4. Consumables\nMay include:\n4.1 Distilled Water\n4.2 Battery solution/electrolyte\n5. Tools and\nequipment\nMay include:\n5.1 Hand tools and Special tools for removal/adjustment\n5.2 Load tester, hydrometer, multimeter or voltmeter, battery\n charger, cell tester\n6. Test\nMay include:\n6.1 Load tests\n6.2 Specific gravity tests\n6.3 Cell voltage test\n\n--- PDF PAGE 58 ---\nAutomotive Servicing NC II (Amended) Promulgated December 2013 56\nEVIDENCE GUIDE\n\n1. Critical\naspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Removed/replaced battery\n1.2 Serviced and charged batteries\n1.3 Conducted battery tests\n2. Required\nknowledge\n2.1 OH&S legislation\n2.2 Safe handling of battery electrolyte and acids\n2.3 Industry codes of practice\n2.4 Statutory legislation in relation to disposal of batteries and\n acids\n2.5 Testing procedures of both, load and specific gravity\n2.6 Identification of battery types\n2.7 Servicing procedures\n2.8 Jump starting procedures\n2.9 Battery charging procedures\n2.10 Positive Work Values (Perseverance, Honesty, Attention\n to Details)\n2.11 Quality procedures, e.g., 5S\n2.12 Environmental-conservation procedures,\n e.g., 3R (reduce, reuse, recycle)\n3. Required skills\n3.1 Handling battery\n3.2 Handling of battery electrolyte\n3.3 Use of multitester, Hydrometer, voltmeter, load tester, volt-\n ammeter, cell tester\n3.4 Use of tools for removing battery\n3.5 Preventing loss of vehicle electronic memory\n4. Resource\nimplications\nThe following resources should be provided:\n4.1 Battery to be tested can be separated or to be taken from\n vehicle\n4.2 Appropriate tools and equipment\n4.3 Materials relevant to the activity\n4.4 Manufacturer’s manual and related reference materials\n5. Method of\nassessment\nCompetency in this unit may be assessed through\n5.1 Direct observation while the tasks are being performed\n5.2 Questions/Interview\n6. Context for\nassessment\n6.1 Competency must be assessed on the job or\n simulated environment.\n6.2 The assessment of practical skills must take place after a\n period of supervised practice and repetitive experience.\n\n--- PDF PAGE 59 ---\nAutomotive Servicing NC II (Amended) Promulgated December 2013 57\nUNIT OF COMPETENCY: SERVICE IGNITION SYSTEM\n\nUNIT CODE: ALT723304\n\nUNIT DESCRIPTOR:\nThis competency unit includes checking and conducting\ntest to ignition components. It also includes repairing the\nignition system and components.\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n(Note: All standard of performance for Service Ignition System is in\naccordance with company standard operating procedure and\nmanufacturer’s specification Manuals using specified tools and\nequipment)\n1. Check Ignition\nSystem\n1.1 Spark plug, contact points, rotor, distributor cap,\nignition switch are cleaned\n\n2. Perform spark test\n\n2.1 Engine is started as per standard operating\n procedures.\n\n2.2 Spark test is conducted\n3. Check ignition coil\nresistance\n3.1 Coil terminal of ignition coil is disconnected\n\n3.2 Ignition coil resistance is checked\n\n4. Check ballast\n resistor\n4.1Ballast resistor is checked\n5. Adjust contact point\nclearance\n (if any)\n5.1 Position contact point fully opened\n\n5.2 Contact point is adjusted\n6. Perform ignition\nwiring\n installation\n6.1 Parts condition is checked\n\n6.2 Wiring installation is performed\n7. Perform ignition\n timing\n7.1 Ignition timing is adjusted\n8.Repair non-electronic\n ignition system\n and/or\n components\n8.1 Ignition system/components are repaired without\n causing damage to any other vehicle parts\n\n--- PDF PAGE 60 ---\nAutomotive Servicing NC II (Amended) Promulgated December 2013 58\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Ignition System\n\nMay include:\n1.1 Spark plug\n1.2 Contact Point\n1.3 Rotor\n1.4 Distributor Cap\n1.5 Ignition switch\n1.6 Conventional ignition system.\n1.7 Magneto system (not including system associated with\n electronics engine management)\nOther variables may include:\n1.8 Single and dual points, single and multiple distributors,\n ballast and non-ballast primary circuits, suppressed\n and non-suppressed high tension leads\n1.9 Advanced mechanism (both mechanical and vacuum\n operated)\n1.10 CDI and magnetic pulse\n2. Company\n Standard\n Operating\n Procedure\n\nMay include:\n2.1Job Order\n2.2 Requisition slip\n2.3 Wearing of Personal Protective Equipment such as\n•\nSafety goggles\n•\nSafety gloves\n•\nSafety shoes\n•\nApron\n3. Manual\nMay include:\n3.1 Manufacturer Specification Manual\n3.2 Maintenance Procedure Manual\n3.3 Periodic Maintenance Data\n3.4 Service Manual\n3.5 Parts Checklist\n4. Tools and\nequipment\n\nMay include:\n41.Handtools and Power tools, air tools,\n4.2Testing equipment including:\n• Multimeter\n• Ohmmeter\n• Voltmeter\n• Tachometer\n•\ntiming light\n• spark plug cleaner/tester\n• tunescopes\n• engine analyzer\n• distributor test bench\n4.3 Distributor assembly, ignition coil and condenser\n4.4 Actual vehicle equipped with conventional ignition\n System\n4.5 Fender cover\n\n--- PDF PAGE 61 ---\nAutomotive Servicing NC II (Amended) Promulgated December 2013 59\nEVIDENCE GUIDE\n\n1. Critical\naspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Checked and Serviced Ignition System\n1.2 Tested ignition system/components\n1.3 Repaired ignition system/components\n\n2. Required\nknowledge\n2.1 Ignition system construction and operation appropriate to\nApplication\n2.2 Measuring and testing procedures\n2.3 Vehicles, equipment and personal safety requirements\n2.4 Ignition scope pattern\n2.5 Positive Work Values (Perseverance , Honesty, Attention\n to Details, Patience)\n2.6 Quality procedures, e.g., 5S\n2.7 Environmental-conservation procedures,\n e.g., 3R (reduce, reuse, recycle)\n\n3. Required\nskills\n3.1 Using tools when testing and repairing ignition system\n3.2 Using ignition system test instrument and equipment\n3.3 Observing proper procedures\n\n4. Resource\n implications\nThe following resources should be provided:\n4.1 Work place location\n4.2 Tools and equipment appropriate to servicing processes\n4.3 Materials relevant to the proposed activity\n4.4 Drawings and specifications relevant to the task\n\n5. Method of\n assessment\nCompetency in this unit may be assessed through:\n5.1 Direct observation\n5.2 Written/Oral questions\n\n6. Context for\n assessment\n\n6.1 Competency must be assessed on the job or\n simulated environment.\n6.2 The assessment of practical skills must take place after a\n period of supervised practice and repetitive experience.\n\n--- PDF PAGE 62 ---\nAutomotive Servicing NC II (Amended) Promulgated December 2013 60\nUNIT OF COMPTENCY: TEST AND REPAIR WIRING/LIGHTING SYSTEMS\n\nUNIT CODE: ALT723305\n\nUNIT DESCRIPTOR:\nThis unit identifies the competence required to:\n\n