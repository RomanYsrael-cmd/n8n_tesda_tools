        "source_text": "ALT311205\n\nUNIT DESCRIPTOR:\nThis unit identifies the competencies required to\ndraw/interpret basic trade drawing\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Interpret technical\n drawing\n1.1 Components, assemblies or objects are recognized as\nrequired\n1.2 Dimensions are identified as appropriate to the field of\nemployment\n1.3 Instructions are identified and followed as required\n1.4 Material and other consumable requirements are\nidentified as required\n1.5 Symbols are recognized as appropriate in drawing\n2. Select correct\ntechnical drawing\n\n2.1 Drawing is checked and validated against job\nrequirements or equipment\n2.2 Drawing version is checked and validated according to the\nManual\n3. Apply freehand\nsketching\n3.1 Correct freehand sketching is produced using the\nnecessary tools and materials\n\n--- PDF PAGE 35 ---\nAutomotive Servicing NC II (Amended) Promulgated December 2013 33\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Drawing\nMay include:\n1.1 Drawing symbols\n1.2 Alphabet of lines\n1.3 Orthographic views\n1.3.1\nFront view\n1.3.2\nRight side view/left side view\n1.3.3\nTop view\n1.3.4\nPictorial\n1.4 Schematic diagram\n2. Manual\nMay include:\n2.1 technical drawing manual\n2.2 manufacturers schematic diagram\n3. Consumables\nMay include:\n3.1 drawing plate\n3.2 pencil and eraser\n3.3 scotch tape\n4. Tools and\n materials\nMay include:\n4.1 compass\n4.2 divider\n4.3 rulers\n4.4 triangles\n4.5 drawing tables\n4.6 computer\n\n--- PDF PAGE 36 ---\nAutomotive Servicing NC II (Amended) Promulgated December 2013 34\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Interpreted technical drawing\n1.2 Selected correct technical drawing\n1.3 Applied freehand sketching\n2. Required\nKnowledge\n2.1 Drawing standard symbols\n2.2 Safe handling of tools and consumables\n2.3 Identification of types of drawing\n2.4 Patience, Perseverance, Attention to Details\n3. Required skills\n3.1 Draw/interpret orthographic drawing\n3.2 Handling of drawing instruments\n4. Resource\n implications\nThe following resources should be provided:\n4.1 Drawing room\n4.2 Appropriate tools\n4.3 Materials relevant to activity\n5. Method of\n assessment\nCompetency in this unit may be assessed through:\n5.1 Observation with questioning\n5.2 Written/Oral examination\n5.3 Presentation of Finished drawing\n6. Context of\nassessment\n6.1 Must be assessed in a drawing room or in any\nsimulated places\n6.2 Assessment must be given according to industry\n standard\n\n--- PDF PAGE 37 ---\nAutomotive Servicing NC II (Amended) Promulgated December 2013 35\n\nUNIT OF MPETENCY: PRACTICE HEALTH, SAFETY AND ENVIRONMENT\nPROCEDURES\nUNIT CODE :"
