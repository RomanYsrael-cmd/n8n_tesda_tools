          "source_text": "(Note: All standard of performance for Service Automotive Battery \nis in accordance with company standard operating procedure \nand manufacturer’s specification Manuals using specified tools, \nequipment and consumables.)\n1. Test automotive   \n      battery \n1.1 Battery is tested without causing damage to any \nworkplace property or vehicle. \n1.2 Correct information is accessed and interpreted \nbased on manufacturer specifications. \n1.3 Appropriate test equipment is selected. \n1.4Tests are performed and results analyzed  \n1.5 Findings is reported to direct supervisor  \n2. Remove and replace \n     batteries. \n \n2.1 Battery is removed and replaced without      \n      causing damage to any workplace property or   \n      vehicle. \n2.2 Appropriate tools and equipment are selected    \n      and used. \n2.3 Action is taken to prevent loss of vehicles  \n      electronic memory if applicable.\n3. Service and charge  \n      batteries. \n \n3.1 Battery is charged using the appropriate battery   \n      charger. \n3.2 Electrolyte levels are checked and topped up  \n3.3 Battery and its terminals are cleaned. \n3.4 Multiple connectors are repaired and replaced to    \n      restore integrity of the involved circuit  \n3.5 Leads are connected/disconnected in sequence  \n     as per polarity \n4. Jump-start vehicle. \n \n \n4.1 Vehicle is jump started without causing damage to  \n       any workplace property or vehicle. \n4.2 Jumper leads are selected and used ensuring spike \n       protection is employed when necessary. \n4.3 Leads are connected/disconnected in correct    \n     according to sequence and polarity.\n\n--- PDF PAGE 57 ---\nAutomotive Servicing NC II  (Amended)                  Promulgated December 2013                     55 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Battery \nMay include: \n1.1  Maintenance Free type \n1.2  Dry cell Type \n1.3  Or by  size\n2. Manual \nMay include: \n2.1 Manufacturer Specification Manual \n2.2 Maintenance Procedure Manual \n2.3 Periodic Maintenance Data \n2.4 Service Manual \n2.5 Parts Checklist\n3. Company \nStandard \nOperating \nProcedure \nMay include: \n3.1 Job Order \n3.2 Requisition slip \n3.3 Wearing of Personal Protective Equipment such as \n Goggles \n Hand gloves \n Apron \n\nSafety shoes\n4. Consumables      \nMay include: \n4.1 Distilled Water \n4.2 Battery solution/electrolyte\n5. Tools and \nequipment  \nMay include: \n5.1 Hand tools and Special tools for removal/adjustment \n5.2 Load tester, hydrometer, multimeter or voltmeter, battery  \n     charger, cell tester\n6. Test \nMay include: \n6.1 Load tests \n6.2 Specific gravity tests \n6.3 Cell voltage test\n\n--- PDF PAGE 58 ---\nAutomotive Servicing NC II  (Amended)                  Promulgated December 2013                     56"
