        "source_title": "SERVICE DIFFERENTIAL AND FRONT/REAR AXLE",
        "source_text": "--- PDF PAGE 77 ---\nAutomotive Servicing NC II  (Amended)                  Promulgated December 2013                     75 \nUNIT OF COMPETENCY : SERVICE DIFFERENTIAL AND  \n   \n \n FRONT/REAR AXLE  \n \nUNIT CODE: ALT723311 \n \nUNIT DESCRIPTOR: This unit deals with servicing differential and front axle.  \nIt also includes overhauling rear wheel hub, analyzing king pin \ncondition and troubleshooting I-beam defective condition. \n \nELEMENT \n \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n(All standard of performance for Service Differential and Front Axle is in \naccordance with company standard operating procedure and \nmanufacturer’s specification Manuals using specified tools and \nequipment.)\n1. Inspect drive shaft \nand joint \n \n1.1 Drive shaft and joint inspected thoroughly for worn- \n      out cross joint, defective slip joint, unbalanced  \n      propeller  shaft \n2. Dismount differential \nassembly \n2.1 Differential body is pulled out/dismounted \n2.2 Penetrating oil applied on hold down clamp \n3. Overhaul differential \n3.1 Differential parts is dismantled  \n3.2 Parts analyzed and defects identified \n3.3 Corresponding repair works recommended \n3.4 Differential adjusted as per manual instruction \n3.5 Special service tools is used \n3.6 Parts cleaned with solvent and dried  \n3.7 Damaged parts is replaced  \n3.8 Differential assembled and adjusted  \n4. Mounting differential \nassembly \n4.1 Differential assembly is mounted  \n4.2 Tools for mounting is used \n5. Overhaul  \n      rear/front wheel     \n      hub \n5.1 Defective wheel hub identified and corresponding      \n      repair works recommended \n5.2 Wheel bearing is replaced  \n5.3 Wheel bearing pre-load is set/adjusted  \n \n6. Analyze king pin \ncondition \n6.1 King pin parts failure identified and corrective action   \n      recommended \n6.2 Damaged king pin parts is replaced  \n6.3 Replacement parts is selected and used  \n7. Inspect/replace I-\nbeam \n \n7.1  I beam failure identified and corresponding repair  \n         works recommended \n7.2  Misalignment of I-beam identified and corrected\n\n--- PDF PAGE 78 ---\nAutomotive Servicing NC II  (Amended)                  Promulgated December 2013                     76 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Drive shaft and \nJoint components \n May include: \n \n1.1 Propeller Shaft \n \nTorque tube \n \nHotchkiss \n1.2 Slip Joint                                            \n \nExternal splines                                         \n \nInternal splines                                           \n \nYoke \n1.3 Universal Joint Constant Velocity Ball & Truniun\n2. Differential \nAdjustment  \nMay include: \n2.1 Pinion depth \n2.2 Pinion bearing pre-load \n2.3 Backlash \n3. Company \nstandard \noperating \nprocedure \nMay include: \n3.1 Job Order \n3.2 Requisition slip \n3.3 personal protective equipment such as: \n \nApron, Goggles, Gloves, Safety shoes, Skull Guard\n4. Manual \nMay include: \n4.1 Manufacturer specification manual \n4.2 Maintenance procedure manual \n4.3 Periodic maintenance data \n4.4 Service and Repair Manual \n4.5 Parts checklist\n5. Tools and \nequipment \nMay include: \n5.1 Hydraulic lifter/mechanical lifter \n5.2 Support stand \n5.3 Socket wrench \n5.4 Dial gauge with stand \n5.5 Basic handtools \n5.6 Hub wrench \n5.7 Spreading tool \n5.8 Axle puller \n5.9 Spider nit wrench \n5.10Ballpeen hammer \n5.11 Bearing greasing machine \n5.12 Hydraulic press\n\n--- PDF PAGE 79 ---\nAutomotive Servicing NC II  (Amended)                  Promulgated December 2013                     77 \nEVIDENCE GUIDE \n \n1. Critical aspects \nof competency \nAssessment requires evidence that the candidate: \n1.1Serviced differential and Front Axle \n1.2 Set and adjusted differential components \n1.3 Overhauled rear and front wheel hub\n2. Required  \nknowledge  \n2.1 Removal, replacement and repair procedures \n2.2 Construction and operation of differential  and front axle  \n2.3 Measuring and testing procedures \n2.4 Relevant technical information \n2.5 Equipment safety requirements \n2.6 Vehicle/plant safety requirements \n2.7 Relevant manufacturer/enterprise policies \n2.8 Manual handling techniques \n2.9 Personal safety procedures \n2.10 Positive Work Values (Patience, Honesty, Perseverance, \nAttention to Details) \n2.11 Quality procedures, e.g., 5S \n2.12 Environmental-conservation procedures,  \n        e.g., 3R (reduce, reuse, recycle) \n3. Required skills \n3.1 Accessing, interpreting and applying technical information \n3.2 Using relevant tools and equipment \n3.3 Identifying faults in differential and front axle \n3.4 Repairing, removing and replacing differential mounting, \nking pin, I-beam \n3.5 Testing and adjusting differential & front axle, rear wheel \nhub \n3.6 Applying manual handling methods \n3.7 Applying personal safety procedures \n3.8 Maintaining customer records\n4. Resource \nimplications \nThe following resources should be provided: \n4.1 Workplace: Real or simulated work area \n4.2 Appropriate Tools & equipment \n4.3 Materials relevant to the activity \n5. Method of \nassessment \nCompetency in this unit may be assessed through:  \n5.1 Direct observation while the tasks are being performed  \n5.2 Questions/Interview related to the underpinning  \n       knowledge/skills \n5.3 Assessment of Underpinning Knowledge and attitude and  \n     practical skills may be combined.\n6. Context for \nassessment \n6.1 Competency must be assessed on the job or  \n      simulated environment. \n6.2 The assessment of practical skills must take place after a  \n      period of supervised practice and repetitive experience.\n",
