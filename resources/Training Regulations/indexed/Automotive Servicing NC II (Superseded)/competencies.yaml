        "source_title": "SERVICE MANUAL STEERING SYSTEM",
        "source_text": "--- PDF PAGE 80 ---\nAutomotive Servicing NC II  (Amended)                  Promulgated December 2013                     78 \nUNIT OF COMPETENCY: SERVICE MANUAL STEERING SYSTEM  \n \nUNIT CODE: ALT723312 \n \nUNIT DESCRIPTOR: This unit deals with servicing steering system. It also includes  \nconduct of wheel alignment and overhauling front wheel hub.  \n \nELEMENT \n \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n(Note: All standard of performance for Service Manual \nSteering System is in accordance with company Standard \nOperating procedure and manufacturer’s Specification Manual \nusing specified tools and Equipment)\n \n1. Analyze front end \ngeometry failure \n \n \n1.1 Visual inspection on tire wear/steering system is  \n        performed \n1.2 Wheel alignment equipment is set-up  \n1.3 Camber, caster and toe-angle are inspected and \nnecessary adjustments are made as \n \n2. Service steering system \n \n \n2.1 Steering component is pulled-out  \n2.2 Steering defects such as deformation, cracks, tube  \n      leaks and loose parts is checked identified \n2.3 Steering component is dismantled/installed  \n2.4 Damaged parts is replaced  \n \n3. Perform wheel balancing\n \n3.1 Wheel weight location and size is identified  \n3.2 Wheel balancing machine is set-up \n \n4.Conduct wheel alignment \n \n4.1 Steering and suspension component  \n      accurately checked prior alignment \n \n4.2 Wheel alignment equipment positioned/installed  \n \n4.3 Equipment reading interpreted and  \n      required adjustment is done  \n \n4.4 Wheel alignment is adjusted\n\n--- PDF PAGE 81 ---\nAutomotive Servicing NC II  (Amended)                  Promulgated December 2013                     79 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Steering system \nMay include: \n1.1 Recirculating ball  \nGear \n1.2 Worn and Taper  \nPin \n1.3 Rack and  \nPinion \n2. Manual \nMay include: \n2.1 Manufacturer’s specification manual \n2.2 Maintenance procedure manual \n2.3 Periodic maintenance data \n2.4 Service and repair manual \n2.5 Parts checklist\n3. Company \nstandard \noperating \nprocedure \nMay include: \n3.1 Job order \n3.2 Requisition slip \nprotective equipment such as: \nGloves, Apron, Goggles, Safety shoes\n4. Front end \nGeometry \nMay include: \n4.1 Camber-positive/negative \n4.2 Caster-positive/negative \n4.3 Steering Axis inclination \n4.4 Toe-in \n4.5 Turning Radius \n4.6 Wheel alignment procedures\n5. Tire wear \nMay include: \n5.1 Shoulder wear-incorrect camber \n inside shoulder-too much negative \n outside shoulder – too much positive \n5.2 Both shoulder wear-Under inflation \n5.3 Cornering wear – Driver’s habit \n5.4 Center tire wear – Over inflation \n5.5 Feather wear – Toe problem \n6. Tools and \nEquipment \nMay include: \n6.1 Hydraulic lifter/mechanical lifter \n6.2 Support Stand \n6.3 Socket wrench \n6.4 Torque wrench \n6.5 Basic hand tools \n6.6 Caster gauge \n6.7 Camber \n6.8 Toe-in, toe-out aligning bar \n6.9 Puller \n6.10 Wheel balancer \n6.11 Wheel alignment equipment or equivalent\n\n--- PDF PAGE 82 ---\nAutomotive Servicing NC II  (Amended)                  Promulgated December 2013                     80 \nEVIDENCE GUIDE \n \n1. Critical aspects \nof  competency \nAssessment requires evidence that the candidate: \n1.1 Serviced Steering System  \n1.2 Conducted wheel alignment \n1.3 Performed wheel balancing\n2. Required \nknowledge  \n2.1 Operating principles of steering system \n2.2 Service procedures \n2.3 Wheel alignment types/classification and description \n2.4 Relevant technical information \n2.5 Equipment and tools safe handling \n2.6 Vehicle safety requirements \n2.7 Relevant manufacturer/enterprise policies \n2.8 Personal safety procedures \n2.9 Positive Work Values ( Patience, Honesty, Perseverance, \nAttention to Details) \n2.10 Quality procedures, e.g., 5S \n2.11 Environmental-conservation procedures,  \n        e.g., 3R (reduce, reuse, recycle) \n3. Required skills \n3.1 Access, interpret and apply technical information \n3.2 Use relevant tools and equipment \n3.3 Test and adjust front end geometry \n3.4 Pull-out install steering system component \n3.5 Check  steering system deformities and its causes \n3.6 Apply personal safety procedures \n3.7 Maintain customer records\n4. Resource \nimplications \nThe following resources should be provided: \n4.1 Workplace: Real or simulated work area \n4.2 Appropriate Tools & equipment \n4.3 Materials relevant to the activity \n5. Method of \nassessment \nCompetency in this unit may be assessed through: \n5.1 Written/Oral examination \n5.2 Demonstration with Questioning\n6. Context for \nassessment \n6.1 Competency must be assessed on the job  \n       or simulated environment. \n6.2 The assessment of practical skills must take place  \n       after a period of supervised practice and repetitive  \n      experience.\n",
