        "evidence_guide": {
          "source_text": "1. Critical aspects\nof competency\nAssessment requires evidence that the candidate:\n1.1 Diagnose manual transmission failure\n1.2 Overhauled manual transmission\n1.3 Restored manual transmission to its normal running\ncondition\n2. Required\nknowledge\n2.1 Overhauling procedures\n2.2 Transmission lubricants/fluids and their application\n2.3 Operating principles of manual and belt drive\ntransmissions\n2.4 Relevant technical information\n2.5 Equipment safety requirements\n2.6 Vehicle/plant safety requirements\n2.7 Relevant manufacturer/enterprise policies\n2.8 Personal safety procedures\n2.9 Positive work Values (Patience, Honesty, Perseverance\nAttention to details)\n2.10 Quality procedures, e.g., 5S\n2.11 Environmental-conservation procedures,\n e.g., 3R (reduce, reuse, recycle)\n3. Required skills\n3.1 Accessing, interpreting and applying technical information\n3.2 Using relevant tools and equipment\n3.3 Overhauling manual and/or belt drive transmissions\n3.4 Checking transmission for normal operation\n3.5 Driving\n3.6 Applying personal safety procedures\n3.7Maintaining customer records\n4. Resource\nimplications\nThe following resources should be provided:\n4.1 Workplace\n4.2 Appropriate tools and equipment\n4.3 Materials relevant tot he proposed activity and tasks\n4.4Manufacturer’s repair manual\n5. Method of\nassessment\nCompetency in this unit may be assessed through:\n5.1 Observation with Questioning\n5.2 Written/Oral examination\n6. Context for\nassessment\n6.1 Competency must be assessed on the job\n or simulated environment.\n6.2 The assessment of practical skills must take place\n after a period of supervised practice and repetitive\n experience.\n\n--- PDF PAGE 95 ---\nAutomotive Servicing NC II (Amended) Promulgated December 2013 93"
        },
        "source_text": "ALT723313\n\nUNIT DESCRIPTOR: This unit deals with diagnosing, overhauling manual\ntransmission. It also includes testing the transmission.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n(All standard of performance for Overhaul Manual Transmission is in\naccordance with company standard operating procedure and\nmanufacturer’s specification Manuals using specified tools and\nequipment)\n1. Diagnose\nmanual\ntransmission\nfailure\n1.1 Manual transmission failure is tested such as humming\nnoise, shifting condition, moving parts condition, gear oil\ncontamination, leaky gear oil.\n2. Pull-out\nmanual\ntransmission\n\n2.1Transmission gear oil drained\n2.2 Transmission is placed/positioned to transmission jack\n2.3 Bolt/nuts are loosened of as per torque, sequence, and\npattern\n3. Disassemble\nmanual\ntransmission\n3.1 Disassembled parts tagged and marked\n3.2 Parts rinsed with appropriate solution\n3.3 Manual transmission installed using reference marks\n3.4Damaged parts is replaced\n4. Inspect\nmanual\ntransmission\nparts\n\n4.1 Worn-out and cracked parts and gear back lash and end\nplay inspected/measured and accurately identified\n4.2 Defects identified and recommendation given\n4.3 Transmission parts tested using testing instruments\n4.4Transmission parts is inspected without causing damage\n5. Assemble\nmanual\ntransmission\n5.1 Component parts are cleaned, lubricated and coated with\nnew gear oil\n5.2 Manual transmission assemble using tools\n5.3 Manual transmission assembled as per standard operating\nprocedures\n6. Test manual\ntransmission\n\n6.1 Transmission gear oil checked after installation\n6.2 Manual transmission assembly is mounted\n6.3 Transmission linkages/attachments are installed\n6.4Transmission test is conducted.\n7. Road test\nTransmission\n7.1 Transmission performance is evaluated (visual/aural) with\nemphasis on performance of every shifting, pattern, noise\n and operation\n\n--- PDF PAGE 93 ---\nAutomotive Servicing NC II (Amended) Promulgated December 2013 91\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Manual\nTransmission\nMay include:\n1.1 Three (3) speed manual transmission\n1.2 Four (4) speed manual transmission\n1.3 Five (5) speed and overdrive manual transmission\n1.4 Transaxle manual transmission (combination of manual\ntransmission and differential)\n2. Manual\nTransmission\nFailure\n\nMay include:\n2.1 The transmission or transaxle shifts hard\n2.2 The gear clash when shifting\n2.3 The transmission/transaxle is noisy\n2.4 The transmission/transaxle jumps out of gear\n2.5 The transmission/transaxle is locked in one gear and\n cannot be shifted out of that gear\n3. Manuals\nMay include:\n3.1 Manufacturer’s specification manual\n3.2 Maintenance procedure manual\n3.3 Periodic Maintenance Data\n3.4 Service and Repair manual\n3.5 Parts checklist\n4. Company\nStandard\nOperating\nProcedure\nMay include:\n4.1 Job Order\n4.2 Requisition slip\n4.3 Wearing of personal protective equipment and clothing\n such as hand cleaner, hand gloves, safety shoes, skull\n guard, apron\n5. Tools and\nequipment\nMay include:\n5.1 Hydraulic lifter/Mechanical lifter\n5.2 Support stand\n5.3 Transmission jack\n5.4 Snap ring expander (in/out)\n5.5 Bearing puller\n5.6 Long drift or punch\n5.7 Basic hand tools set\n5.8 Bench vise\n\n--- PDF PAGE 94 ---\nAutomotive Servicing NC II (Amended) Promulgated December 2013 92\nEVIDENCE GUIDE\n\n1. Critical aspects\nof competency\nAssessment requires evidence that the candidate:\n1.1 Diagnose manual transmission failure\n1.2 Overhauled manual transmission\n1.3 Restored manual transmission to its normal running\ncondition\n2. Required\nknowledge\n2.1 Overhauling procedures\n2.2 Transmission lubricants/fluids and their application\n2.3 Operating principles of manual and belt drive\ntransmissions\n2.4 Relevant technical information\n2.5 Equipment safety requirements\n2.6 Vehicle/plant safety requirements\n2.7 Relevant manufacturer/enterprise policies\n2.8 Personal safety procedures\n2.9 Positive work Values (Patience, Honesty, Perseverance\nAttention to details)\n2.10 Quality procedures, e.g., 5S\n2.11 Environmental-conservation procedures,\n e.g., 3R (reduce, reuse, recycle)\n3. Required skills\n3.1 Accessing, interpreting and applying technical information\n3.2 Using relevant tools and equipment\n3.3 Overhauling manual and/or belt drive transmissions\n3.4 Checking transmission for normal operation\n3.5 Driving\n3.6 Applying personal safety procedures\n3.7Maintaining customer records\n4. Resource\nimplications\nThe following resources should be provided:\n4.1 Workplace\n4.2 Appropriate tools and equipment\n4.3 Materials relevant tot he proposed activity and tasks\n4.4Manufacturer’s repair manual\n5. Method of\nassessment\nCompetency in this unit may be assessed through:\n5.1 Observation with Questioning\n5.2 Written/Oral examination\n6. Context for\nassessment\n6.1 Competency must be assessed on the job\n or simulated environment.\n6.2 The assessment of practical skills must take place\n after a period of supervised practice and repetitive\n experience.\n\n--- PDF PAGE 95 ---\nAutomotive Servicing NC II (Amended) Promulgated December 2013 93"
      }
