ective Equipment such as\n• Goggles\n• Hand gloves\n•\nApron\n•\nSafety shoes\n4. Tools and\nequipment\nMay include:\n4.1 Hand tools\n4.2 Testing equipment including:\n•\nMultimeters, voltmeters, ammeters\n4.3 Power tools, air tools, electrical loading equipment, test\n benches, soldering equipment, induction , test light (12V\nand 240V)\n\n5. Tests\nMay include:\n5.1 Open circuit test\n5.2 Short circuit test\n\n--- PDF PAGE 70 ---\nAutomotive Servicing NC II (Amended) Promulgated December 2013 68\nEVIDENCE GUIDE\n\n1. Critical aspects\nof competency\nAssessment requires evidence that the candidate\n1.1 Serviced and charged batteries\n1.2 Tested started the battery/vehicles\n1.3 Repaired the charging system\n2. Required\nknowledge\n2.1 Electrical principles\n2.2 Charging system components and functions\n2.3 Repair procedures\n2.4 Electrical measuring and testing procedures\n2.5 Vehicle safety requirements\n2.6 Positive Work Values (Patience, Honesty, Perseverance\nAttention to details)\n2.7 Quality procedures, e.g., 5S\n2.8 Environmental-conservation procedures,\n e.g., 3R (reduce, reuse, recycle)\n3.Required skills\n3.1 Handling batteries and tools\n3.2 Operating testing equipment\n3.3 Repairing Charging system\n3.4 Using Mathematical Ideas and Techniques\n3.5 Solving Problems\n4.Resource\nimplications\nThe following resources should be provided:\n4.1 Workplace: Real or simulated work area\n4.2 Appropriate Tools & equipment\nMaterials relevant to the activity\n5.Method of\nassessment\nCompetency in this unit may be assessed through:\n5.1 Direct observation\n5.2 Questions/Interview\n6.Context for\nassessment\n6.1 Competency must be assessed on the job or\n simulated environment.\n6.2 The assessment of practical skills must take place after\na period of supervised practice and repetitive experience.\n\n--- PDF PAGE 71 ---\nAutomotive Servicing NC II (Amended) Promulgated December 2013 69\nUNIT OF COMPETENCY: SERVICE ENGINE MECHANICAL SYSTEM\n\nUNIT CODE: ALT723309\n\nUNIT DESCRIPTOR: This unit identifies the competence required in:\n servicing cooling, lubricating, fuel systems, diesel fuel\n injector.\n\nELEMENT\n\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1.Service cooling\n system\n\n1.1 Servicing of engine mechanical system such as\ncooling system is performed as per manufacturer’s\nmanual using specified tools and equipment\n\n1.2 Safety is observed as per company standard\noperating procedures\n2. Service lubricating\n system\n2.1 Oil pressure is checked as per manual instruction\n\n2.2 Oil level and condition is checked as per manual\n instruction\n\n2.3 Oil flashing is performed as per manual instruction\n3. Service fuel system\n\nFor CARBURETOR TYPE:\n3.1 Carburetor is serviced/repaired according to\n manufacturer’s repair manual\n\n3.2 Fuel pump is inspected according to service repair\n manual\n\n3.3 Exhaust Gas analyzer is set-up in accordance with\n manufacturer’s manual\n\n3.4 Exhaust gas emission inspected and necessary\n adjustment is performed in accordance with standard\n operating procedures\n4. Service diesel fuel\ninjector\n\n4.1 Injection nozzle is inspected and repaired as per\nservice repair manual\n\n4.2 Fuel system cleaning is performed in accordance with\nstandard operating procedures\n\n--- PDF PAGE 72 ---\nAutomotive Servicing NC II (Amended) Promulgated December 2013 70\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Engine\nMechanical\nSystem\nMay include:\n1.1 Cooling system\n1.2 Lubricating system\n1.3 Fuel system\n1.4 Diesel Fuel injector\n1.5 Emission control system\n2. Manual\nMay include:\n2.1 Maintenance Procedure Manual\n2.2 Periodic Maintenance Data\n2.3 Service Manual\n2.4 Parts Checklist\n3. Company\nStandard\nOperating\nProcedure\nMay include:\n3.1 Job Order\n3.2 Requisition slip\n3.3 Wearing of Personal Protective Equipment such as\n• Apron\n• Gloves\n• Gas mask\n• Goggles\n4. Tools and\nequipment\nMay include:\n4.1 Common hand tools\n4.2 Injection nozzle\n4.3 hand tester\n4.4 C.O. meter\n4.5 Gas analyzer\n\n--- PDF PAGE 73 ---\nAutomotive Servicing NC II (Amended) Promulgated December 2013 71\nEVIDENCE GUIDE\n\n1. Critical aspects\nof competency\nAssessment requires evidence that the candidate:\n1.1 Serviced engine mechanical systems\n2. Required\nknowledge\n2.1 Water pump overhauling procedure\n2.2 Principle and operation of cooling system\n2.3 Procedure in coolant leak test\n2.4 Principle and operation of lubricating system\n2.5 Procedure in checking oil pressure\n2.6 Procedure in adjusting idle mixture\n2.7 Procedure in overhauling carburetor\n2.8 Fuel quality and characteristics\n2.9 Unit measurement\n2.10 Procedure in injector testing\n2.11 Procedure in overhauling injector\n2.14 Fuel system basic principle and operation\n2.15 Oil quality and type\n2.16 Exhaust gas theory and production\n2.17 Procedure in measuring CO concentration\n2.18 Emission component inspection procedure\n2.19 Positive Work Values (Patience, Honesty,Perseverance,\nAttention to Details)\n2.20 Quality procedures, e.g., 5S\n2.21 Environmental-conservation procedures,\n e.g., 3R (reduce, reuse, recycle)\n\n3. Required skills\n3.1 Use and interpretation of Repair Manual\n3.2 Usage of CO meter and gas analyzer\n3.3 Operating motor driven cooling fan\n3.4 Diagnosing trouble\n3.5 Usage of injector nozzle hand tester\n3.6 Overhauling injector\n3.7 Usage of Measuring tools\n4. Resource\nimplications\nThe following resources should be provided:\n4.1 Workplace: Real or simulated work area\n4.2 Appropriate Tools & equipment\n4.3 Materials relevant to the activity\n5. Method of\nassessment\nCompetency in this unit may be assessed through:\n5.1 Direct observation with Questioning\n5.2 Interview\n6. Context for\nassessment\n6.1 Competency must be assessed on the job or\n simulated environment.\n6.2 The assessment of practical skills must take place after a\n period of supervised practice and repetitive experience.\n\n--- PDF PAGE 74 ---\nAutomotive Servicing NC II (Amended) Promulgated December 2013 72\nUNIT OF COMPETENCY: SERVICE CLUTCH SYSTEM\n\nUNIT CODE: ALT723310\n\nUNIT DESCRIPTOR: This unit deals with servicing clutch system. It also\ninclude repairing and replacing the damaged\nparts/components of the system.\n\nELEMENT\n\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n(Note: All standard of performance for Service Clutch System is in\naccordance with company standard operating procedure and\nmanufacturer’s specification Manuals using specified tools and\nequipment.)\n1. Diagnose clutch\nfailure/problem\n1.1 Clutch should engage/disengage engine and\n transmission smoothly\n2. Pull-out and\nmount clutch\nComponent\nparts\n2.1 Clutch is dismounted\n\n2.2 Damaged parts is replaced\n\n2.3 Clutch is mounted\n3. Overhaul\nhydraulic clutch\nmechanism\n\n3.1 Worn out Rubber cups and “O” rings replaced as\n per prescribed procedure\n\n3.2 Scored Master cylinder is replaced\n\n3.3 Valve checked for damage\n\n3.4 Hydraulic clutch mechanism is replaced\n\n3.5 Master cylinder, slave, booster tested\n4. Perform clutch\nparts failure\nanalysis\n4.1 Clutch failure identified accurately and corresponding\n repair recommended\n5. Set/Adjust\nclutch system\ncomponents\n5.1 Clutch pedal free play is set\n\n5.2 Special service tools is used\n6. Bleed clutch\nhydraulic\nsystem\n6.1 Checking of fluid leakage and level are checked\n\n6.2 Clutch hydraulic system bled.\n\n--- PDF PAGE 75 ---\nAutomotive Servicing NC II (Amended) Promulgated December 2013 73\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Clutch System\nMay include:\n1.1 Pressure plate assembly\n1.2 Clutch Disk Assembly\n1.3 Mechanical Clutch Linkage\n1.4 Hydraulic Clutch Linkage\n2. Manuals\nMay include:\n2.1 Manufacturer specification manual\n2.2 Maintenance Procedure Manual\n2.3 Periodic Maintenance Data\n2.4 Service and Repair Manual Parts Checklist\n3. Company\nstandard\noperating\nprocedure\nMay include:\n3.1 Job Order\n3.2 Requisition slip\n3.3 Wearing of personal protective equipment such as\n•\nGloves, Apron, Safety shoes, Skull guard\n4. Tools and\nequipment\nMay include:\n4.1 Hydraulic lifter/Mechanical lifter\n4.2 Support stand\n4.3 Transmission jack\n4.4 Basic Handtools set\n4.5 Clutch centering guide\n4.6 Snap ring pliers (in/out)\n5. Clutch failure /\nProblems\nMay include:\n5.1 pedal goes to floorboard when depressed\n5.2 slips when engaged\n5.3 spine or drags while engaged\n5.4 chatters or grabs while being engaged\n5.5 related vibration\n5.6 area noises\n5.7 pedal pulsation\n\n--- PDF PAGE 76 ---\nAutomotive Servicing NC II (Amended) Promulgated December 2013 74\nEVIDENCE GUIDE\n\n1. Critical aspects\nof competency\nAssessment requires evidence that the candidate:\n1.1 Serviced Clutch system\n1.2 Repaired/Replaced clutch system components or parts\n2. Required\nknowledge\n2.1 Clutch system types, components, function and operation\n2.2 Clutch system adjustment\n2.3 Handling of special tools for dismantling clutch system\n components\n2.4 Hydraulic clutch mechanism function and operation\n2.5 Precaution in handling hydraulic fluids and special tools\n2.6 Positive Work Values (Patience, Honesty, Perseverance,\nAttention to Details)\n2.7Quality procedures, e.g., 5S\n2.8 Environmental-conservation procedures,\n e.g., 3R (reduce, reuse, recycle)\n3. Required skills\n3.1 Access, interpret and apply technical information\n3.2 Use of relevant tools and equipment\n3.3 Remove and replace clutch mechanism\n3.4 Overhauling hydraulic clutch mechanism\n3.5 Testing master cylinder, clutch slave and booster\n3.6 Setting adjusting clutch components\n3.7 Apply personal safety procedures\n3.8 Maintain customer records\n4. Resource\nimplications\nThe following resources should be provided:\n4.1 Workplace: Real or simulated work area\n4.2 Appropriate tools and equipment\n4.3 Materials relevant to the proposed activity and tasks\n4.4 Manufacturer’s repair manual\n5. Method of\nassessment\nCompetency in this unit may be assessed through:\n5.1 Direct observation with Questioning\n5.2 Interview\n6. Context for\nassessment\n6.1 Competency must be assessed on the job or\n simulated environment.\n6.2 The assessment of practical skills must take place after a\n period of supervised practice and repetitive experience.\n\n--- PDF PAGE 77 ---\nAutomotive Servicing NC II (Amended) Promulgated December 2013 75\nUNIT OF COMPETENCY : SERVICE DIFFERENTIAL AND\n\n FRONT/REAR AXLE\n\nUNIT CODE: ALT723311\n\nUNIT DESCRIPTOR: This unit deals with servicing differential and front axle.\nIt also includes overhauling rear wheel hub, analyzing king pin\ncondition and troubleshooting I-beam defective condition.\n\nELEMENT\n\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n(All standard of performance for Service Differential and Front Axle is in\naccordance with company standard operating procedure and\nmanufacturer’s specification Manuals using specified tools and\nequipment.)\n1. Inspect drive shaft\nand joint\n\n1.1 Drive shaft and joint inspected thoroughly for worn-\n out cross joint, defective slip joint, unbalanced\n propeller shaft\n2. Dismount differential\nassembly\n2.1 Differential body is pulled out/dismounted\n2.2 Penetrating oil applied on hold down clamp\n3. Overhaul differential\n3.1 Differential parts is dismantled\n3.2 Parts analyzed and defects identified\n3.3 Corresponding repair works recommended\n3.4 Differential adjusted as per manual instruction\n3.5 Special service tools is used\n3.6 Parts cleaned with solvent and dried\n3.7 Damaged parts is replaced\n3.8 Differential assembled and adjusted\n4. Mounting differential\nassembly\n4.1 Differential assembly is mounted\n4.2 Tools for mounting is used\n5. Overhaul\n rear/front wheel\n hub\n5.1 Defective wheel hub identified and corresponding\n repair works recommended\n5.2 Wheel bearing is replaced\n5.3 Wheel bearing pre-load is set/adjusted\n\n6. Analyze king pin\ncondition\n6.1 King pin parts failure identified and corrective action\n recommended\n6.2 Damaged king pin parts is replaced\n6.3 Replacement parts is selected and used\n7. Inspect/replace I-\nbeam\n\n7.1 I beam failure identified and corresponding repair\n works recommended\n7.2 Misalignment of I-beam identified and corrected\n\n--- PDF PAGE 78 ---\nAutomotive Servicing NC II (Amended) Promulgated December 2013 76\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Drive shaft and\nJoint components\n May include:\n\n1.1 Propeller Shaft\n•\nTorque tube\n•\nHotchkiss\n1.2 Slip Joint\n•\nExternal splines\n•\nInternal splines\n•\nYoke\n1.3 Universal Joint Constant Velocity Ball & Truniun\n2. Differential\nAdjustment\nMay include:\n2.1 Pinion depth\n2.2 Pinion bearing pre-load\n2.3 Backlash\n3. Company\nstandard\noperating\nprocedure\nMay include:\n3.1 Job Order\n3.2 Requisition slip\n3.3 personal protective equipment such as:\n•\nApron, Goggles, Gloves, Safety shoes, Skull Guard\n4. Manual\nMay include:\n4.1 Manufacturer specification manual\n4.2 Maintenance procedure manual\n4.3 Periodic maintenance data\n4.4 Service and Repair Manual\n4.5 Parts checklist\n5. Tools and\nequipment\nMay include:\n5.1 Hydraulic lifter/mechanical lifter\n5.2 Support stand\n5.3 Socket wrench\n5.4 Dial gauge with stand\n5.5 Basic handtools\n5.6 Hub wrench\n5.7 Spreading tool\n5.8 Axle puller\n5.9 Spider nit wrench\n5.10Ballpeen hammer\n5.11 Bearing greasing machine\n5.12 Hydraulic press\n\n--- PDF PAGE 79 ---\nAutomotive Servicing NC II (Amended) Promulgated December 2013 77\nEVIDENCE GUIDE\n\n1. Critical aspects\nof competency\nAssessment requires evidence that the candidate:\n1.1Serviced differential and Front Axle\n1.2 Set and adjusted differential components\n1.3 Overhauled rear and front wheel hub\n2. Required\nknowledge\n2.1 Removal, replacement and repair procedures\n2.2 Construction and operation of differential and front axle\n2.3 Measuring and testing procedures\n2.4 Relevant technical information\n2.5 Equipment safety requirements\n2.6 Vehicle/plant safety requirements\n2.7 Relevant manufacturer/enterprise policies\n2.8 Manual handling techniques\n2.9 Personal safety procedures\n2.10 Positive Work Values (Patience, Honesty, Perseverance,\nAttention to Details)\n2.11 Quality procedures, e.g., 5S\n2.12 Environmental-conservation procedures,\n e.g., 3R (reduce, reuse, recycle)\n3. Required skills\n3.1 Accessing, interpreting and applying technical information\n3.2 Using relevant tools and equipment\n3.3 Identifying faults in differential and front axle\n3.4 Repairing, removing and replacing differential mounting,\nking pin, I-beam\n3.5 Testing and adjusting differential & front axle, rear wheel\nhub\n3.6 Applying manual handling methods\n3.7 Applying personal safety procedures\n3.8 Maintaining customer records\n4. Resource\nimplications\nThe following resources should be provided:\n4.1 Workplace: Real or simulated work area\n4.2 Appropriate Tools & equipment\n4.3 Materials relevant to the activity\n5. Method of\nassessment\nCompetency in this unit may be assessed through:\n5.1 Direct observation while the tasks are being performed\n5.2 Questions/Interview related to the underpinning\n knowledge/skills\n5.3 Assessment of Underpinning Knowledge and attitude and\n practical skills may be combined.\n6. Context for\nassessment\n6.1 Competency must be assessed on the job or\n simulated environment.\n6.2 The assessment of practical skills must take place after a\n period of supervised practice and repetitive experience.\n\n--- PDF PAGE 80 ---\nAutomotive Servicing NC II (Amended) Promulgated December 2013 78\nUNIT OF COMPETENCY: SERVICE MANUAL STEERING SYSTEM\n\nUNIT CODE: ALT723312\n\nUNIT DESCRIPTOR: This unit deals with servicing steering system. It also includes\nconduct of wheel alignment and overhauling front wheel hub.\n\nELEMENT\n\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n(Note: All standard of performance for Service Manual\nSteering System is in accordance with company Standard\nOperating procedure and manufacturer’s Specification Manual\nusing specified tools and Equipment)\n\n1. Analyze front end\ngeometry failure\n\n1.1 Visual inspection on tire wear/steering system is\n performed\n1.2 Wheel alignment equipment is set-up\n1.3 Camber, caster and toe-angle are inspected and\nnecessary adjustments are made as\n\n2. Service steering system\n\n2.1 Steering component is pulled-out\n2.2 Steering defects such as deformation, cracks, tube\n leaks and loose parts is checked identified\n2.3 Steering component is dismantled/installed\n2.4 Damaged parts is replaced\n\n3. Perform wheel balancing\n\n3.1 Wheel weight location and size is identified\n3.2 Wheel balancing machine is set-up\n\n4.Conduct wheel alignment\n\n4.1 Steering and suspension component\n accurately checked prior alignment\n\n4.2 Wheel alignment equipment positioned/installed\n\n4.3 Equipment reading interpreted and\n required adjustment is done\n\n4.4 Wheel alignment is adjusted\n\n--- PDF PAGE 81 ---\nAutomotive Servicing NC II (Amended) Promulgated December 2013 79\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Steering system\nMay include:\n1.1 Recirculating ball\nGear\n1.2 Worn and Taper\nPin\n1.3 Rack and\nPinion\n2. Manual\nMay include:\n2.1 Manufacturer’s specification manual\n2.2 Maintenance procedure manual\n2.3 Periodic maintenance data\n2.4 Service and repair manual\n2.5 Parts checklist\n3. Company\nstandard\noperating\nprocedure\nMay include:\n3.1 Job order\n3.2 Requisition slip\nprotective equipment such as:\n•Gloves, Apron, Goggles, Safety shoes\n4. Front end\nGeometry\nMay include:\n4.1 Camber-positive/negative\n4.2 Caster-positive/negative\n4.3 Steering Axis inclination\n4.4 Toe-in\n4.5 Turning Radius\n4.6 Wheel alignment procedures\n5. Tire wear\nMay include:\n5.1 Shoulder wear-incorrect camber\n• inside shoulder-too much negative\n• outside shoulder – too much positive\n5.2 Both shoulder wear-Under inflation\n5.3 Cornering wear – Driver’s habit\n5.4 Center tire wear – Over inflation\n5.5 Feather wear – Toe problem\n6. Tools and\nEquipment\nMay include:\n6.1 Hydraulic lifter/mechanical lifter\n6.2 Support Stand\n6.3 Socket wrench\n6.4 Torque wrench\n6.5 Basic hand tools\n6.6 Caster gauge\n6.7 Camber\n6.8 Toe-in, toe-out aligning bar\n6.9 Puller\n6.10 Wheel balancer\n6.11 Wheel alignment equipment or equivalent\n\n--- PDF PAGE 82 ---\nAutomotive Servicing NC II (Amended) Promulgated December 2013 80\nEVIDENCE GUIDE\n\n1. Critical aspects\nof competency\nAssessment requires evidence that the candidate:\n1.1 Serviced Steering System\n1.2 Conducted wheel alignment\n1.3 Performed wheel balancing\n2. Required\nknowledge\n2.1 Operating principles of steering system\n2.2 Service procedures\n2.3 Wheel alignment types/classification and description\n2.4 Relevant technical information\n2.5 Equipment and tools safe handling\n2.6 Vehicle safety requirements\n2.7 Relevant manufacturer/enterprise policies\n2.8 Personal safety procedures\n2.9 Positive Work Values ( Patience, Honesty, Perseverance,\nAttention to Details)\n2.10 Quality procedures, e.g., 5S\n2.11 Environmental-conservation procedures,\n e.g., 3R (reduce, reuse, recycle)\n3. Required skills\n3.1 Access, interpret and apply technical information\n3.2 Use relevant tools and equipment\n3.3 Test and adjust front end geometry\n3.4 Pull-out install steering system component\n3.5 Check steering system deformities and its causes\n3.6 Apply personal safety procedures\n3.7 Maintain customer records\n4. Resource\nimplications\nThe following resources should be provided:\n4.1 Workplace: Real or simulated work area\n4.2 Appropriate Tools & equipment\n4.3 Materials relevant to the activity\n5. Method of\nassessment\nCompetency in this unit may be assessed through:\n5.1 Written/Oral examination\n5.2 Demonstration with Questioning\n6. Context for\nassessment\n6.1 Competency must be assessed on the job\n or simulated environment.\n6.2 The assessment of practical skills must take place\n after a period of supervised practice and repetitive\n experience.\n\n--- PDF PAGE 83 ---\nAutomotive Servicing NC II (Amended) Promulgated December 2013 81\nUNIT OF COMPETENCY: SERVICE BRAKE SYSTEM\n\nUNIT CODE: ALT723314\n\nUNIT DESCRIPTOR: This unit deals with servicing brake system. It also includes\ndiagnosing, adjusting and repairing brake mechanism.\n\nELEMENT\n\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n(Note: All standard of performance for Service Brake System is in\naccordance with company standard operating procedure and\nmanufacturer’s specification Manuals using specified tools and\nequipment)\n1. Pull-out/mount\nbrake system\ncomponents\n1.1 Brake system components are pulled out/mounted.\n\n1.2 Brake system assembly accurately tagged/marked\n2. Disassemble/ass\nemble brake\nsystem\ncomponents\n\n2.1 Component parts tagged/marked\n\n2.2 Parts rinsed with cleaning solution\n\n2.3 Damaged parts identified and replaced\n\n2.4Assembled brake system component is tested\n3 . Conduct road\n test\n3.1 Pre-starting check-up performed prior vehicle operation\n\n3.2 Vehicle driven at specified speed to detect\n brake trouble\n\n3.3 Findings are recorded and recommendation is\n given\n\n--- PDF PAGE 84 ---\nAutomotive Servicing NC II (Amended) Promulgated December 2013 82\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Brake\nsystem\nMay include:\n1.1 Drum brake system\n1.2 Antiskid or Antilock brake system (ABS)\n1.3 Disc Brake System\n1.4 Power Brake system type (Brake Booster)\n1.5 Master cylinder\n1.6 Air Brake\n2 Manual\nMay include:\n2.1 Manufacturer’s specification manual\n2.2 Maintenance procedure manual\n2.3 Periodic Maintenance Data\n2.4 Service and Repair manual\n2.5 Parts checklist\n3 Company\nstandard\noperating\nprocedures\nMay include:\n3.1 Job Order\n3.2 Requisition slip\n3.3 Wearing of personal protective equipment and clothing such as\n•\nHand cleaner\n•\nHand gloves\n•\nSafety shoes\n•\nSkull guard\n•\nApron\n4 Tools and\nequipment\nMay include:\n4.1 Hydraulic lifter/mechanical lifter\n4.2 Support stand\n4.3 Socket wrench\n4.4 Dial gauge with stand\n4.5 Basic Handtools set\n4.6 Snap ring plier (in/out)\n4.7 Brake adjusting tool\n4.8 Ballpeen hammer\n4.9 Bleeding tool\n\n--- PDF PAGE 85 ---\nAutomotive Servicing NC II (Amended) Promulgated December 2013 83\nEVIDENCE GUIDE\n\n1. Critical aspects\nof competency\nAssessment requires evidence that the candidate:\n1.1 Diagnosed brake system faults\n1.2 Pulled-out/mount brake system components\n1.3 Disassembled/assembled brake system components\n2. Required\nknowledge\n2.1 Operating principles of brake system\n2.2 Brake system types and components\n2.3 Service procedures\n2.3 Hydraulic brake system/fluid\n2.4 Relevant technical information\n2.5 Equipment and tools safe handling\n2.6 Vehicle safety requirements\n2.7 Relevant manufacturer/enterprise policies\n2.8 Personal safety procedures\n2.9 Positive Work Values (Patience, Honesty, Perseverance,\nAttention to Details)\n2.10 Quality procedures, e.g., 5S\n2.11 Environmental-conservation procedures,\n e.g., 3R (reduce, reuse, recycle)\n3. Required skills\n3.1 Accessing, interpreting and applying technical\ninformation\n3.2 Using relevant tools and equipment\n3.3 Adjusting/setting emergency/parking brakes\n3.4 Adjusting brake pedal height/free-play\n3.5 Changing hydraulic fluid with no spillage\n3.6 Applying personal safety procedures\n3.7 Maintaining orderliness and cleanliness\n3.8 Maintaining customer records\n4. Resource\nimplications\nThe following resources should be provided:\n4.1 Workplace: Real or simulated work area\n4.2 Appropriate Tools & equipment\n4.3Materials relevant to the activity\n5. Method of\nassessment\nCompetency in this unit may be assessed through:\n5.1 Written/Oral examination\n5.2 Observation with Questioning\n6. Context for\nassessment\n6.1 Competency must be assessed on the job\n or simulated environment.\n6.2 The assessment of practical skills must take place\n after a period of supervised practice and repetitive\n experience.\n\n--- PDF PAGE 86 ---\nAutomotive Servicing NC II (Amended) Promulgated December 2013 84\nUNIT OF COMPETENCY: SERVICE SUSPENSION SYSTEM\n\nUNIT CODE: 502723315\n\nUNIT DESCRIPTOR: This unit deals with repairing the suspension system.\n\nELEMENT\n\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n(All standard of performance for Service Suspension System is in\naccordance with company standard operating procedure and\nmanufacturer’s specification Manuals using specified tools and equipment)\n1. Diagnose\nsuspension\nsystem failure\n1.1 Suspension system failure are identified and\n repair works recommended\n\n2. Dismount/mount\nsuspension\ncomponents\nparts\n2.1 Suspension components are dismounted/mounted\n\n2.2 Dismounted parts are tagged/marked\n\n2.3 Parts are dismounted without causing damage to vehicle\n components\n3. Disassemble/\nAssemble\nsuspension parts\n\n3.1 Suspension parts are disassembled/assembled\n\n3.2 Suspension parts are disassembled/assembled without\ncausing damage to other vehicle components/system\n\n3.3 Disassembled parts are rinsed with cleaning solution\n4. Inspect/replace\nsuspension\ncomponent parts\n\n4.1 Suspension system components are checked for cracks,\nloose nuts, bolt or bushing, and leak\n\n4.2 Damaged suspension parts are identified\n\n4.3 Damaged parts are replaced\n\n--- PDF PAGE 87 ---\nAutomotive Servicing NC II (Amended) Promulgated December 2013 85\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Suspension\nsystem failure\nMay include:\n1.1 Suspension system problem indicated by:\n• Noise during stop and starts or over bumps\n• Poor directional stability or automobile does not go in a\nstraight line unless the driver fights the steering wheel\n• The vehicle may steer very hard or have too much\nmovement or play in the steering\n• Front wheel may shimmy when the vehicle is driven at\nhighway speed, or it may pull or tend to turn by itself.\n\n1.2 Common suspension components that lead to system\n failure:\n• Steering knuckle and spindle\n• Ball joint\n• Stabilizer bar\n• Coil spring\n• Torsion bar\n• Shock absorbers\n• Suspension bushings\n 2. Manuals\nMay include:\n2.1 Manufacturer’s specification manual\n2.2 Service and repair manual\n2.3 Parts checklist\n3. Company\nstandard\noperating\nprocedure\nMay include:\n3.1 Job order\n3.2 Requisition slip\n3.3 Wearing of Personal Protective Equipment such as:\n• Hand cleaner, hand gloves, safety shoes, skull guard,\nApron\n4. Tools and\nequipment\nMay include:\n4.1 Hydraulic lifter/Mechanical lifter\n4.2 Support stand\n4.3 Grease dispenser\n4.4 Coil spring compressor\n4.5 Socket wrench\n4.6 Basic Handtools\n4.7 Hydraulic press\n4.8 Torque wrench\n4.9 Air compressor\n4.10 Hard rubber\nmallet\n4.11 Ballpeen\nhammer\n\n--- PDF PAGE 88 ---\nAutomotive Servicing NC II (Amended) Promulgated December 2013 86\nEVIDENCE GUIDE\n\n1. Critical aspects of\n competency\nAssessment requires evidence that the candidate:\n1.1 Serviced Suspension System\n1.2 Diagnosed suspension system failure\n1.3 Conducted suspension system balance adjustment\n2. Required\nknowledge\n2.1 Operating principles of suspension system\n2.2 Service procedures\n2.3 Air suspension balance adjustment procedures\n2.4 Equipment and tools safe handling\n2.5 Vehicle safety requirements\n2.6 Relevant manufacturer/enterprise policies\n2.7 Personal safety procedures\n2.8 Positive Work Values (Patience, Honesty, Perseverance,\nAttention to Details)\n2.9 Quality procedures, e.g., 5S\n2.10 Environmental-conservation procedures,\n e.g., 3R (reduce, reuse, recycle)\n3. Required skills\n3.1 Accessing, interpreting and applying technical information\n3.2 Using relevant tools and equipment\n3.3 Cleaning suspension parts\n3.4 Applying personal safety procedures\n3.5 Maintaining orderliness and cleanliness\n3.6 Maintaining customer records\n4. Resource\n implications\nThe following resources should be provided:\n4.1 Workplace: Real or simulated work area\n4.2 Appropriate Tools & equipment\n4.3 Materials relevant to the activity\n4.4 Manufacturer’s repair manual\n5. Method of\n assessment\nCompetency in this unit may be assessed through:\n5.1 Written/Oral examination\n5.2 Demonstration with Questioning\n6. Context for\n assessment\n6.1 Competency must be assessed on the job\n or simulated environment.\n6.2 The assessment of practical skills must take place\n after a period of supervised practice and repetitive\n experience.\n\n--- PDF PAGE 89 ---\nAutomotive Servicing NC II (Amended) Promulgated December 2013 87\nUNIT OF COMPETENCY: PERFORM UNDERCHASSIS PREVENTIVE\nMAINTENANCE\n\nUNIT CODE: ALT723306\n\nUNIT DESCRIPTOR: This unit deals with the checking, replacing of fluids and minor\n repair of underchassis components including tires.\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n(Note: All standards of performance for Perform Underchassis\nComponents Preventive Maintenance is in accordance with company\nstandard operating procedure and manufacturer’s specification\nManuals using specified tools and equipment.)\n1. Check clutch fluid\n and lines\n\n1.1 Clutch fluid level is checked and maintained between\n minimum and maximum\n1.2 Clutch lines are checked for twist and bends\n1.3 Clutch cover must be fitted in the cap\n1.4 Clutch fluid used\n2. Inspect brake\nsystem\n2.1 Brake fluid level is checked and maintained between the\nminimum and maximum, and clear, undiluted fluid is used\n2.2 Brake lines or hoses are checked and freed of twist and\nbends\n2.3 Brake pedal free play specified\n2.4 Brakes operation is checked and tested\n2.5 Hydraulic fluid used/changed without spillage and at the\nlevel specified\n2.6 Brake pedal/height/pre-play checked and adjusted\n2.7 Bleed hydraulic brake\n2.8 Emergency brake functions is checked\n2.9 Points for adjustment of emergency brake is identified\n3. Inspect/change\n transmission/\n differential\n gear oil\n3.1Gear oil inspected\n3.2 The vehicle is positioned\n3.3 Transmission gear selected and used is clear and not\ndiluted with other substances\n3.4 Grade/classification and level of gear oil used must be in\naccordance with manufacturer’s specification\n4. Inspect/Replace\n power\n steering fluid\n4.1 Power steering linkages and connections inspected\n4.2 Vehicle is parked and engine running is ran at idle speed\n4.3 Fluid is inspected/replaced\n5. Check/Re-fill\n automatic\n transmission fluid\n5.1 ATF checked and replenished to required level\n6. Inspect/Bleed air\n tank\n6.1 Air tank inspected and bled\n7. Check tires and\n tire\n pressures\n7.1 Tires is inspected for damage or deformities and free\n of solid object\n7.2 Tire pressure is checked and maintained\n7.3 Tire rotation is performed.\n8. Check under-\n chassis body bolts\n and nuts\n8.1 Bolts/nuts including tire studs bolts/nuts are checked\n8.2 Body bolts/nut torque is checked and maintained\n8.3 Checking procedure according to manufacturer’s\nspecifications.\n8.4 Tightness of the bolts is determined by the sound\nproduced by tapping lightly bolts/nuts with pointed\nhammer.\n\n--- PDF PAGE 90 ---\nAutomotive Servicing NC II (Amended) Promulgated December 2013 88\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Underchassis\nComponents\nMay include:\n1.1 Clutch-Master cylinder, fluid lines, secondary (slave)\nCylinder\n1.2 Brakes-Master cylinder, wheel cylinders, Fluid lines\n1.2 Manual transmission – Front/rear oil seal, drain plug, filler\nHole\n1.4 Differential – Oil seal, drain plug/Filler hole\n1.5 Power Steering – Pump, Linkages/Fluid lines/Connections,\nRack, Pinion Oil seal, Steering box oil seal\n1.6 Automatic Transmission – Oil seals, Filler hole/drain plug,\nlinkages/oil lines\n1.7 Air Tank-Drain plug, air lines/hoses, pressure gauge\n1.8 Wheels and Tires – Tire valves, thread and traction, Tire\npressures\n1.9 Body bolts/Studs/Nuts-Wheels and tire studs/nuts, chassis,\nbody mounting bolt, studs, nuts\n2. Manuals\nMay include:\n2.1 Manufacturer’s specifications manual\n2.2 Preventive Maintenance procedure manual\n2.3 Service Manual\n2.4 Parts checklist\n3. Company\nstandard\nOperating\nProcedure\nMay include:\n3.1 Job Order\n3.2 Requisition slip\n3.3 Wearing of Personal Protective Equipment such as:\n• Hand cleaner, hand gloves, safety shoes, skull guard,\nApron\n4. Tools and\nequipment\nMay include:\n4.1 Hydraulic/mechanical lifter\n4.2 Support stand\n4.3 Gear oil dispenser\n4.4 Socket wrench\n4.5 Basic hand tools\n4.6 Ball peen hammer\n5. Tire\nMay include:\n5.1 Tube\n5.2 Tubeless\n\n--- PDF PAGE 91 ---\nAutomotive Servicing NC II (Amended) Promulgated December 2013 89\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Checked/Inspected clutch/brake fluid and lines\n1.1 Inspected/changed transmission/ differential gear oil\n1.2 Inspected/Replaced power steering fluid\n1.3 Checked/Re-filled automatic transmission fluid\n1.4 Inspected/Bled air tank\n1.5 Checked tires and tire pressures\n1.6 Checked under-chassis body bolts and nuts\n2.Required\nknowledge\n2.1 Types/Classification of lubricants\n2.2 Clutch Parts, Function and Operation\n2.3 Brake component parts, function and operation\n2.4 Brake lines/piping construction & types\n2.5 Types/Classification of Gear oil\n2.6 Transmission/Differential gear Component parts,\nfunction and operation\n2.7 Cause and Effect of Gear Oil Dilution\n2.8 Classification of Power Steering Fluid\n2.9 Power Steering component parts, function and operation\n2.10 Positive Work Values (Patience, Honesty,\nPerseverance, Attention to details)\n2.11 Quality procedures, e.g., 5S\n2.12 Environmental-conservation procedures,\n e.g., 3R (reduce, reuse, recycle)\n3. Required skills\n3.1 Handling of fluids and oil (clutch, brake, gear, auto\n transmission, etc)\n3.2 Interpreting and Usage of Preventive Maintenance\nManuals\n3.3 Familiarization with Underchassis Components\n4. Resource\nimplications\nThe following resources should be provided:\n4.1 Workplace: Real or simulated work area\n4.2 Appropriate Tools & equipment\n4.3 Materials relevant to the activity\n4.4 Manufacturer’s repair manual\n5. Method of\nassessment\nCompetency in this unit may be assessed through:\n5.1 Actual observation or practical test while the task is\n being performed\n5.2 Written exam based on the topic under the underpinning\nknowledge\n5.3 Assessment of Underpinning Knowledge and attitude\nand practical skills\n may be combined.\n6. Context for\nassessment\n6.1 Competency must be assessed on the job or\n simulated environment.\n\n--- PDF PAGE 92 ---\nAutomotive Servicing NC II (Amended) Promulgated December 2013 90\nUNIT OF COMPETENCY: OVERHAUL MANUALTRANSMISSION\n\nUNIT CODE: ALT723313\n\nUNIT DESCRIPTOR: This unit deals with diagnosing, overhauling manual\ntransmission. It also includes testing the transmission.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n(All standard of performance for Overhaul Manual Transmission is in\naccordance with company standard operating procedure and\nmanufacturer’s specification Manuals using specified tools and\nequipment)\n1. Diagnose\nmanual\ntransmission\nfailure\n1.1 Manual transmission failure is tested such as humming\nnoise, shifting condition, moving parts condition, gear oil\ncontamination, leaky gear oil.\n2. Pull-out\nmanual\ntransmission\n\n2.1Transmission gear oil drained\n2.2 Transmission is placed/positioned to transmission jack\n2.3 Bolt/nuts are loosened of as per torque, sequence, and\npattern\n3. Disassemble\nmanual\ntransmission\n3.1 Disassembled parts tagged and marked\n3.2 Parts rinsed with appropriate solution\n3.3 Manual transmission installed using reference marks\n3.4Damaged parts is replaced\n4. Inspect\nmanual\ntransmission\nparts\n\n4.1 Worn-out and cracked parts and gear back lash and end\nplay inspected/measured and accurately identified\n4.2 Defects identified and recommendation given\n4.3 Transmission parts tested using testing instruments\n4.4Transmission parts is inspected without causing damage\n5. Assemble\nmanual\ntransmission\n5.1 Component parts are cleaned, lubricated and coated with\nnew gear oil\n5.2 Manual transmission assemble using tools\n5.3 Manual transmission assembled as per standard operating\nprocedures\n6. Test manual\ntransmission\n\n6.1 Transmission gear oil checked after installation\n6.2 Manual transmission assembly is mounted\n6.3 Transmission linkages/attachments are installed\n6.4Transmission test is conducted.\n7. Road test\nTransmission\n7.1 Transmission performance is evaluated (visual/aural) with\nemphasis on performance of every shifting, pattern, noise\n and operation\n\n--- PDF PAGE 93 ---\nAutomotive Servicing NC II (Amended) Promulgated December 2013 91\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Manual\nTransmission\nMay include:\n1.1 Three (3) speed manual transmission\n1.2 Four (4) speed manual transmission\n1.3 Five (5) speed and overdrive manual transmission\n1.4 Transaxle manual transmission (combination of manual\ntransmission and differential)\n2. Manual\nTransmission\nFailure\n\nMay include:\n2.1 The transmission or transaxle shifts hard\n2.2 The gear clash when shifting\n2.3 The transmission/transaxle is noisy\n2.4 The transmission/transaxle jumps out of gear\n2.5 The transmission/transaxle is locked in one gear and\n cannot be shifted out of that gear\n3. Manuals\nMay include:\n3.1 Manufacturer’s specification manual\n3.2 Maintenance procedure manual\n3.3 Periodic Maintenance Data\n3.4 Service and Repair manual\n3.5 Parts checklist\n4. Company\nStandard\nOperating\nProcedure\nMay include:\n4.1 Job Order\n4.2 Requisition slip\n4.3 Wearing of personal protective equipment and clothing\n such as hand cleaner, hand gloves, safety shoes, skull\n guard, apron\n5. Tools and\nequipment\nMay include:\n5.1 Hydraulic lifter/Mechanical lifter\n5.2 Support stand\n5.3 Transmission jack\n5.4 Snap ring expander (in/out)\n5.5 Bearing puller\n5.6 Long drift or punch\n5.7 Basic hand tools set\n5.8 Bench vise\n\n--- PDF PAGE 94 ---\nAutomotive Servicing NC II (Amended) Promulgated December 2013 92\nEVIDENCE GUIDE\n\n1. Critical aspects\nof competency\nAssessment requires evidence that the candidate:\n1.1 Diagnose manual transmission failure\n1.2 Overhauled manual transmission\n1.3 Restored manual transmission to its normal running\ncondition\n2. Required\nknowledge\n2.1 Overhauling procedures\n2.2 Transmission lubricants/fluids and their application\n2.3 Operating principles of manual and belt drive\ntransmissions\n2.4 Relevant technical information\n2.5 Equipment safety requirements\n2.6 Vehicle/plant safety requirements\n2.7 Relevant manufacturer/enterprise policies\n2.8 Personal safety procedures\n2.9 Positive work Values (Patience, Honesty, Perseverance\nAttention to details)\n2.10 Quality procedures, e.g., 5S\n2.11 Environmental-conservation procedures,\n e.g., 3R (reduce, reuse, recycle)\n3. Required skills\n3.1 Accessing, interpreting and applying technical information\n3.2 Using relevant tools and equipment\n3.3 Overhauling manual and/or belt drive transmissions\n3.4 Checking transmission for normal operation\n3.5 Driving\n3.6 Applying personal safety procedures\n3.7Maintaining customer records\n4. Resource\nimplications\nThe following resources should be provided:\n4.1 Workplace\n4.2 Appropriate tools and equipment\n4.3 Materials relevant tot he proposed activity and tasks\n4.4Manufacturer’s repair manual\n5. Method of\nassessment\nCompetency in this unit may be assessed through:\n5.1 Observation with Questioning\n5.2 Written/Oral examination\n6. Context for\nassessment\n6.1 Competency must be assessed on the job\n or simulated environment.\n6.2 The assessment of practical skills must take place\n after a period of supervised practice and repetitive\n experience.\n\n