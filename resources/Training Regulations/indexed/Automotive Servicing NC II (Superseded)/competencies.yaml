        "source_text": "--- PDF PAGE 68 ---\nAutomotive Servicing NC II  (Amended)                  Promulgated December 2013                     66 \nUNIT OF COMPETENCY: SERVICE CHARGING SYSTEMS  \n \nUNIT CODE: ALT723308 \n \nUNIT DESCRIPTOR: \nThis unit identifies the competence required to: \nTest and repair charging systems. \n \nELEMENT \n \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n(Note: All standard of performance for Service Charging Systems is \nin accordance with company standard operating procedure and \nmanufacturer’s specification Manuals using specified tools and \nequipment)\n1. Test system/ \ncomponents and \nidentify faults \n \n \n1.1. Work is completed without causing damage to any \nworkplace property or vehicle. \n \n1.2 Information is accessed and interpreted from \nappropriate manufacturer specifications. \n \n1.3 Tests are carried out to determine faults using \nappropriate tools and techniques. \n \n1.4 Faults are identified and preferred repair action \ndetermined.\n2. Repair charging  \nsystem associated \ncomponents \n2.1 Charging  systems are repaired without causing  \n       damage to any workplace property or vehicle. \n \n2.2 Information is accessed and interpreted from    \n      appropriate manufacturer specifications. \n \n2.3 Repairs, component replacement and adjustments are \ncarried out using appropriate tools, techniques and \nmaterials.\n\n--- PDF PAGE 69 ---\nAutomotive Servicing NC II  (Amended)                  Promulgated December 2013                     67 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.Charging systems\nMay include: \n1.1 alternator, generator,(IC-type) internal/external \nregulation, battery sensed and non-battery sensed \nregulation, 6V,12V and 24V operation, dynastart, solid \nstate and mechanical regulation, belt and/or direct drive, \nsingle/multiple belt drive, adjustable tensioning devices \n \n1.2  Solar systems may include: single and ganged panels, \ninternal and external regulation, battery sensed and \nnon-battery sensed 12V and 24V operation, solid state \ncontrolled \n \n1.3 Direct current motors\n2. Manuals \nMay include: \n2.1 Maintenance Procedure Manual \n2.2 Periodic Maintenance Data \n2.3 Service Manual \n2.4 Parts Checklist\n3. Company \nstandard \noperating \nprocedure \nMay include: \n3.1 Job Order \n3.2 Requisition slip \n3.3 Wearing of Personal Protective Equipment such as \n Goggles \n Hand gloves \n \nApron \n \nSafety shoes\n4. Tools and \nequipment  \nMay include: \n4.1 Hand tools \n4.2 Testing equipment including: \n \nMultimeters, voltmeters, ammeters \n4.3 Power tools, air tools, electrical loading equipment, test  \n      benches, soldering equipment, induction , test light (12V \nand 240V) \n    \n5. Tests \nMay include: \n5.1 Open circuit test \n5.2  Short circuit test\n\n--- PDF PAGE 70 ---\nAutomotive Servicing NC II  (Amended)                  Promulgated December 2013                     68 \nEVIDENCE GUIDE \n \n1. Critical aspects \nof competency \nAssessment requires evidence that the candidate \n1.1 Serviced and charged batteries \n1.2 Tested started the battery/vehicles \n1.3 Repaired the charging system\n2. Required \nknowledge  \n2.1 Electrical principles \n2.2 Charging system components and functions  \n2.3 Repair procedures \n2.4 Electrical measuring and testing procedures \n2.5 Vehicle safety requirements \n2.6 Positive Work Values (Patience, Honesty, Perseverance \nAttention to details) \n2.7 Quality procedures, e.g., 5S \n2.8 Environmental-conservation procedures,  \n      e.g., 3R (reduce, reuse, recycle) \n3.Required skills \n3.1 Handling batteries and  tools \n3.2 Operating testing equipment \n3.3 Repairing Charging system \n3.4 Using Mathematical Ideas and Techniques \n3.5 Solving Problems\n4.Resource \nimplications \nThe following resources should be provided: \n4.1 Workplace: Real or simulated work area \n4.2 Appropriate Tools & equipment \nMaterials relevant to the activity \n5.Method of \nassessment \nCompetency in this unit may be assessed through: \n5.1 Direct observation  \n5.2 Questions/Interview \n6.Context for \nassessment \n6.1 Competency must be assessed on the job or  \n      simulated environment. \n6.2 The assessment of practical skills must take place after \na period of supervised practice and repetitive experience.\n",
