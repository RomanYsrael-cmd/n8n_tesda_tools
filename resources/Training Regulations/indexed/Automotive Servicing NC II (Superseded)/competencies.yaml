        "source_text": "--- PDF PAGE 83 ---\nAutomotive Servicing NC II  (Amended)                  Promulgated December 2013                     81 \nUNIT OF COMPETENCY: SERVICE BRAKE SYSTEM  \n \nUNIT CODE: ALT723314 \n \nUNIT DESCRIPTOR: This unit deals with servicing brake system. It also includes \ndiagnosing, adjusting and repairing brake mechanism.  \n \n \nELEMENT \n \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n(Note: All standard of performance for Service Brake System is in \naccordance with company standard operating procedure and \nmanufacturer’s specification Manuals using specified tools and \nequipment)\n1. Pull-out/mount \nbrake system \ncomponents \n1.1 Brake system components are pulled out/mounted. \n \n1.2 Brake system assembly accurately tagged/marked \n2. Disassemble/ass\nemble brake \nsystem \ncomponents \n \n2.1 Component parts tagged/marked \n \n2.2 Parts rinsed with cleaning solution  \n \n2.3 Damaged parts identified and replaced \n \n2.4Assembled brake system component is tested \n3 . Conduct road  \n     test \n3.1 Pre-starting check-up performed prior vehicle operation \n \n3.2 Vehicle driven at specified speed to detect    \n      brake trouble \n \n3.3 Findings are recorded and recommendation is  \n      given\n\n--- PDF PAGE 84 ---\nAutomotive Servicing NC II  (Amended)                  Promulgated December 2013                     82 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Brake \nsystem  \nMay include: \n1.1 Drum brake system  \n1.2 Antiskid or Antilock  brake system (ABS) \n1.3 Disc Brake System  \n1.4 Power Brake system type (Brake Booster) \n1.5 Master cylinder  \n1.6 Air Brake \n2 Manual \nMay include: \n2.1 Manufacturer’s specification manual \n2.2 Maintenance procedure manual \n2.3 Periodic Maintenance Data \n2.4 Service and Repair manual \n2.5 Parts checklist\n3 Company \nstandard \noperating \nprocedures \nMay include: \n3.1 Job Order \n3.2 Requisition slip \n3.3 Wearing of personal protective equipment and clothing such as \n \nHand cleaner \n \nHand gloves \n \nSafety shoes \n \nSkull guard \n \nApron\n4 Tools and \nequipment \nMay include: \n4.1 Hydraulic lifter/mechanical lifter \n4.2 Support stand \n4.3 Socket wrench \n4.4 Dial gauge with stand \n4.5 Basic Handtools set \n4.6 Snap ring plier (in/out) \n4.7 Brake adjusting tool \n4.8 Ballpeen hammer \n4.9  Bleeding tool\n\n--- PDF PAGE 85 ---\nAutomotive Servicing NC II  (Amended)                  Promulgated December 2013                     83 \nEVIDENCE GUIDE \n \n1. Critical aspects \nof competency \nAssessment requires evidence that the candidate: \n1.1 Diagnosed brake system faults \n1.2 Pulled-out/mount brake system components  \n1.3 Disassembled/assembled brake system components \n2. Required \nknowledge  \n2.1 Operating principles of brake system \n2.2  Brake system types and components \n2.3 Service procedures \n2.3 Hydraulic brake system/fluid \n2.4 Relevant technical information \n2.5 Equipment and tools safe handling \n2.6 Vehicle safety requirements \n2.7 Relevant manufacturer/enterprise policies \n2.8 Personal safety procedures \n2.9 Positive Work Values (Patience, Honesty, Perseverance, \nAttention to Details) \n2.10 Quality procedures, e.g., 5S \n2.11 Environmental-conservation procedures,  \n        e.g., 3R (reduce, reuse, recycle) \n3. Required skills \n3.1 Accessing, interpreting and applying technical \ninformation \n3.2 Using relevant tools and equipment \n3.3 Adjusting/setting emergency/parking brakes  \n3.4 Adjusting brake pedal height/free-play \n3.5 Changing hydraulic fluid with no spillage \n3.6 Applying personal safety procedures \n3.7 Maintaining orderliness and cleanliness \n3.8 Maintaining customer records\n4. Resource \nimplications \nThe following resources should be provided: \n4.1 Workplace: Real or simulated work area \n4.2 Appropriate Tools & equipment \n4.3Materials relevant to the activity \n5. Method of \nassessment \nCompetency in this unit may be assessed through: \n5.1 Written/Oral  examination \n5.2 Observation with Questioning\n6. Context for \nassessment \n6.1 Competency must be assessed on the job  \n       or simulated environment. \n6.2 The assessment of practical skills must take place  \n       after a period of supervised practice and repetitive    \n      experience.\n",
