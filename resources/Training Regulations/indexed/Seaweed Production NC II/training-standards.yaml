 workplace setting, simulation of a\nworkplace and/or through adoption of modern technology.\n\nd. Assessment is based in the collection of evidence of the performance of work\nto the industry required standards;\n\ne. Assessment of competency takes the trainee’s knowledge and attitude into\naccount but requires evidence of actual performance of the competency as\nthe primary source of evidence.\n\nf. Training program allows for recognition of prior learning (RPL) or current\ncompetencies;\n\ng. Training completion is based on satisfactory completion of all specified\ncompetencies not on the specified nominal duration of learning.\n\n2.\nThe competency-based TVET system recognizes various types of delivery\nmodes, both on-and off-the-job as long as the learning is driven by the\ncompetency standards specified by the industry. The following training\nmodalities and their variations/components may be adopted singly or in\ncombination with other modalities when designing and delivering training\nprograms\n\n2.1 School/Institution- Based:\n\n• Dual Training System (DTS) / Dualized Training Program (DTP) which contain\nboth in-school and in-industry training or fieldwork components.\n\n• Supervised Industry Training (SLIT) or on-the-job training (OJT) is an\napproach in training designed to enhance the knowledge and skills of the\ntrainee through actual experience in the workplace to acquire specific\ncompetencies as prescribed in the training regulations. It is imperative that the\ndeployment of trainees in the workplace is adhered to training programs\nagreed by the institution and enterprise and status and progress of trainees\nare closely monitored by the training institutions to prevent opportunity for work\nexploitation.\n\n• Project-based instruction is an authentic instructional model or strategy in\nwhich students plan, implement and evaluate projects that have real world\napplications.\n\n--- PDF PAGE 107 ---\nTR – Seaweed Production NC II (New) Promulgated December 16, 2015\nPage 103\n\n2.2 Enterprise-Based:\n\n• Formal Apprenticeship – Training within employment involving a contract between\nan apprentice and an enterprise on an approved apprenticeable occupation.\n\n• Informal Apprenticeship - is based on a training (and working) agreement between\nan apprentice and a master craftsperson wherein the agreement may be written or\noral and the master craftsperson commits to training the apprentice in all the skills\nrelevant to his or her trade over a significant period of time, usually between one\nand four years, while the apprentice commits to contributing productively to the work\nof the business. Training is integrated into the production process and apprentices\nlearn by working alongside the experienced craftsperson.\n\n• Enterprise-based Training- where training is implemented within the company in\naccordance with the requirements of the specific company. Specific guidelines on\nthis mode shall be issued by the TESDA Secretariat.\n\n2.3 Community-Based – refers to a short program conducted or coordinated by\nNGOs, LGUs, training centers and other TVET providers which are intended to\naddress the specific needs of a community. Such programs are usually conducted\nin informal settings such as barangay hall, basketball courts and other available\nvenues in a community.\n\n3.3\nTRAINEE ENTRY REQUIREMENTS\n\nTrainees or students wishing to enroll in this course should possess the\nfollowing requirements:\n\n• Able to read and write\n• Able to communicate, both orally and in writing\n• Able to perform simple computations\n*Have basic swimming skills\n\nNote: * Options of training institutions\n\n3.4\nTOOLS AND EQUIPMENT\n\nSEAWEED PRODUCTION NC II\n\nList of tools, equipment and materials for the training of a maximum of 25\ntrainees for SEAWEED PRODUCTION NC II are as follows:\n\nA. School equipment, tools and materials\n\n1 unit Digital light projection\n1 unit System unit (computer)\n1 White board\n1 set White board