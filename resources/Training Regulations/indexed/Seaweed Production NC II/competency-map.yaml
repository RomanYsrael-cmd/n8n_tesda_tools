  "source_text": "COMPETENCY MAP FOR AGRICULTURE, FORESTRY AND FISHERY SECTOR\nSEAWEED PRODUCTION NC II\n\n--- PDF PAGE 119 ---\nTR – Seaweed Production NC II (New) Promulgated December 16, 2015\nPage 115\nRaise large\nRuminants\nService\nTractor’s\nElectrical\nSystem\nService\nTractor’s\nSteering\nSystem\nPerform Fish or\nShrimp Grow\nOut Operations\nPromote\nProducts &\nServices\nRaise swine\nOperate and\nMaintain Rice\nMill Equipment\nAssist in\nAquaculture\nOperations\nService, Repair\n& Maintain\nSmall Gasoline\nEngines\nService\nTractor’s\nElectrical\nSystem\nProduce Fuel\nByproducts\nPrepare and\nMaintain\nAquaculture\nFacilities\nMarket Agri\nProducts\nManage Farm\nAssist in\nHorticulture\nOperations\nGrow-out\nSeaweed\nOperate catfish\nHatchery\nProduce\nCompost\nProduce\nHandpaper\nProduce raw\ndried seaweed\nMarket\nseaweed\n\n--- PDF PAGE 120 ---\nTR – Seaweed Production NC II (New) Promulgated December 16, 2015\nPage 116\nGLOSSARY OF TERMS\n\nAGAR\na gelatinous substance derived from a polysaccharide that\naccumulates in the cell walls of agarophyte red algae. Used as\nan ingredient in desserts throughout Asia and also as a solid\nsubstrate to contain culture medium for microbiological work\n\nAQUACULTURE\nregulation and cultivation of water plants and animals for human\nuse or consumption\nBIENNIAL\nhaving a period of 2 years, or a lasting or living for 2 years\nBIFURCATE\nhaving two branches or peaks; forked\nBRACKISH\nsomewhat salty, as the water of some marshes near the sea\nCALCAREOUS\nof, like, or containing calcium carbonate, calcium, or lime\nDESSICATION\nbecoming completely dried out\nEURYHALINE\nspecies which can tolerate a wide range of salinity\nFILAMENTOUS\nslender and threadlike\nGALACTANS\na class of polysaccharides which includes agar and carrageenan\nINFRALITTORAL\nthe region of shallow water closest to the shore; in marine\nenvironments, usually excluding the intertidal zone; seaweeds\nhere might only be exposed at the lowest tides\nINFLORESCENCE\na group or cluster of flowers arranged on a stem that is composed\nof a main branch or a complicated arrangement of branches\nOFF-BOTTOM\nFARMING\nstake-and-line method, usually used for Spinosum and done on\ntidal flats.\nPREDATION\nfeeding on other animals\nSALINITY\nlevel of salt in water\nTHALLUS\nthe nonvascular plant body of a thallophyte, showing no clear\ndistinction of holdfast, stipe, or blade\n\n--- PDF PAGE 121 ---\nTR – Seaweed Production NC II (New) Promulgated December 16, 2015\nPage 117",
