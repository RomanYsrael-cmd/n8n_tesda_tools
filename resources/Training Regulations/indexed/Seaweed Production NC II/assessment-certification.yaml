ia and also as a solid\nsubstrate to contain culture medium for microbiological work\n\nAQUACULTURE\nregulation and cultivation of water plants and animals for human\nuse or consumption\nBIENNIAL\nhaving a period of 2 years, or a lasting or living for 2 years\nBIFURCATE\nhaving two branches or peaks; forked\nBRACKISH\nsomewhat salty, as the water of some marshes near the sea\nCALCAREOUS\nof, like, or containing calcium carbonate, calcium, or lime\nDESSICATION\nbecoming completely dried out\nEURYHALINE\nspecies which can tolerate a wide range of salinity\nFILAMENTOUS\nslender and threadlike\nGALACTANS\na class of polysaccharides which includes agar and carrageenan\nINFRALITTORAL\nthe region of shallow water closest to the shore; in marine\nenvironments, usually excluding the intertidal zone; seaweeds\nhere might only be exposed at the lowest tides\nINFLORESCENCE\na group or cluster of flowers arranged on a stem that is composed\nof a main branch or a complicated arrangement of branches\nOFF-BOTTOM\nFARMING\nstake-and-line method, usually used for Spinosum and done on\ntidal flats.\nPREDATION\nfeeding on other animals\nSALINITY\nlevel of salt in water\nTHALLUS\nthe nonvascular plant body of a thallophyte, showing no clear\ndistinction of holdfast, stipe, or blade\n\n--- PDF PAGE 121 ---\nTR – Seaweed Production NC II (New) Promulgated December 16, 2015\nPage 117\nACKNOWLEDGEMENTS\n\nThe Technical Education and Skills Development Authority (TESDA) wishes to\nextend gratitude and appreciation to the many representatives of business, industry,\nacademe and government agencies and labor groups who donated their time and\nexpertise to the development and validation of these Training Regulations.\n\nThis undertaking was also made possible through the collaborative effort\nbetween TESDA and DA-BFAR which is supported by the Department of Agriculture-\nBureau of Fisheries and Aquatic Resources.\n\nTHE TECHNICAL EXPERT PANEL (TEP)\n\nMR. ALFREDO A. PEDROSO, III\nTechnical Expe