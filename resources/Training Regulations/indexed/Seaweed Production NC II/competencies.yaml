          "source_text": "1. Critical aspects of competency\nAssessment requires evidence that the candidate:\n1.1\nCarried-out appropriate drying techniques\n1.2\nPerformed proper selection of packing materials\n1.3\nObserved good practices of sorting and packing\n1.4\nCarried-out the proper way of piling/ stacking\n1.5\nSelected appropriate area for storage\n1.6\nPracticed PNS for dried seaweeds\n2. Resource Implications\nThe following resources should be provided:\n2.1\nStorage room\n2.2\nTool room\n2.3\nSolar dryer (elevated flat form, green house)\n2.4\nWriting device\n2.5\nFarm supplies\n2.6\nLogbooks\n2.7\nPNS manual\n2.8\nPacking materials (Polypropylene sacks)\n2.9\nWeighing scale\n2.10 Moisture Analyzer\n3. Methods of Assessment\nCompetency in this unit may be assessed through:\n3.1\nDirect Observation\n3.2\nDemonstration\n3.3\nOral questioning\n3.4\nWritten test\n4. Context of Assessment\n4.1. Competency maybe assessed in actual workplace or at the\ndesignated TESDA Accredited Assessment Center.\n\n--- PDF PAGE 57 ---\nTR – Seaweed Production NC II (New) Promulgated December 16, 2015\nPage 53\nUNIT OF COMPETENCY\n:\nMARKET SEAWEED\n\nUNIT CODE\n:"
