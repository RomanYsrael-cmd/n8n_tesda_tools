        "source_text": "AFF321203\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes required\n\n to perform basic workplace calculations.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1. Perform\nestimation\n1.1 Job requirements are\nidentified from written\nor oral\ncommunications\n1.2 Quantities of\nmaterials and\nresources required to\ncomplete a work task\nare estimated\n1.3 The time needed to\ncomplete a work\nactivity is estimated\n1.4 Accurate estimate for\nwork completion are\nmade\n1.5 Estimate of materials\nand resources are\nreported to\nappropriate person\n1.1 Job\nrequirements/\nlabor needs\n1.2 Calculation of\nquantities of\nmaterials and\nresources\nrequired\n1.3 Calculation of\ntime for job\ncompletion\n1.4 Preparation of\nestimate report\n1.5 Basic\nmathematical\noperations\n1.6 Percentage and\nratios\n1.7 Unit Conversion\n1.1 Identifying job\nrequirements/\n1.2 Estimating\nquantities of\nmaterials and\nresources\nrequired\n1.3 Estimating time\nfor job\ncompletion\n1.4 Performing basic\ncalculation\n1.5 Compute\npercentage\n1.6 Convert English\nto metric\nsystems of\nmeasurement\n1.7 Preparing\nestimate report\n2. Perform basic\nworkplace\ncalculation\n2.1 System and units of\nmeasurement to be\nfollowed are\nascertained\n2.2 Calculation needed to\ncomplete work tasks\nare performed using\nthe four basic\nmathematical\noperation\n2.3 Calculate whole\nfraction, percentage\nand mixed when are\nused to complete the\ninstructions\n2.4 Number computed is\nchecked following\nwork requirements\n2.1 Four basic\nmathematical\noperation\n2.2 System and units\nof measurement\n2.3 Fraction,\npercentage and\nratio\n2.4 Material takeoff\n2.5 Materials costing\n2.1 Compute bill of\nmaterials\n2.2 Compute project\ncost\n\n--- PDF PAGE 31 ---\nTR – Seaweed Production NC II (New) Promulgated December 16, 2015\nPage 27\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Four basic mathematical\noperation\nMay include:\n1.1\nAddition\n1.2\nSubtraction\n1.3\nMultiplication\n1.4\nDivision\n2. System of measurement\nMay include:\n2.1\nEnglish\n2.2\nMetric\n3. Units of measurement\nMay include:\n3.1\nArea\n3.2\nVolume\n3.3\nWeight\n3.4\nLength\n\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nPerformed estimation\n1.2\nPerformed basic workplace calculation\n1.3\nApplied corrective measures as maybe necessary\n2. Method of Assessment\nCompetency in this unit must be assessed through:\n1.4\nPractical demonstration\n1.5\nWritten examination\n3. Resource Implications\n1.6\nRelevant tools and equipment for basic calculation\n1.7\nRecommended data\n4. Context of Assessment\n4.1. Competency maybe assessed in actual workplace\nor at the designated TESDA Accredited\nAssessment Center.\n\n--- PDF PAGE 32 ---\nTR – Seaweed Production NC II (New) Promulgated December 16, 2015\nPage 28\nCORE COMPETENCY\n\nUNIT OF COMPETENCY\n:\nOPERATE SEAWEED NURSERY\n\nUNIT CODE\n:"
