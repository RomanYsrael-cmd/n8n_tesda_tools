\ntools and \nequipment \n2.10 Basic \nmathematical \ncomputation \n2.11 Knowledge on \nRepublic Act \n(R.A) 8550 \n(fisheries code) \nand local \nfisheries \nordinances \n2.12 OSHS \n2.13 Good \nAquaculture \nPractice \nStandards \n(GAqP) \nValues: \n Safety and \nhealth \nconsciousness \n Resourcefulness \n Diligence \n Time \nconsciousness \n Cost-\nconsciousness \n Quality-\nconsciousness \n Quality and \nconsciousness \n Personal \nintegrity in doing \nroutine \nmanagement \npractices \n Perseverance in \nexecuting routine \nworks \n2.6 Communication \nskills \n2.7 Observation \nskills \n2.8 Computation \nskills\n\n--- PDF PAGE 35 ---\nTR – Seaweed Production NC II (New)                  Promulgated December 16, 2015 \nPage 31 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n Ability to work \nwith others \nharmoniously \n Honesty \n3. Plant \npropagules  \n3.1  Propagules are cut \naccording to the \nrequired weight \n3.2  Seaweed propagules \nare tied in planting \nlines based on \nculture method \n3.3  Planting lines are  \ninstalled to nursery \nstructures following \nGAqP \n3.4  Required floaters are \ninstalled following \nGAqP \n3.1 Propagules \nrequired weight: \n 100 grams \n 200 grams \n3.2 Cutting \ntechniques \n3.3 Tying techniques \n3.4 Installation of \nplanting lines \n3.5 Weight \nestimation \n3.6 Boat operation \n3.7 Navigation \n3.8 Kinds of floaters \n3.9 Floaters \ninstallation \n3.10 Use of weighing \nscale \n3.11 GAqP \n3.1 Estimating \nweight \n3.2 Cutting \npropagules  \n3.3 Tying propagules \n3.4 Installing \nplanting lines \nand floaters \n3.5 Navigation skills \n3.6 Swimming skills \n3.7 Diving skills \n3.8 Practicing GAqP \n4. Maintain \nseaweed \nnursery \n4.1  Weekly growth rate is \ncomputed and \nrecorded using Daily \nGrowth Rate (DGR) \nformula \n4.2  Water quality \nmonitoring is done \nusing the appropriate \nmeasuring \