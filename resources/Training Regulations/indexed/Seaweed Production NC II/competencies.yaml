 are \nprepared in \naccordance with \nindustry standards \n5.3  Propagules are \npruned following \nprescribed cutting \ntechniques \n5.4  Boat is operated \nbased on industry \npractices \n5.1 Harvesting \ncriteria data \n5.2 Pruning \ntechniques \n5.3 Cutting \ntechniques \n5.4 Preparation of \nharvesting tools, \nmaterials and \nequipment \n5.5 Boat operation \n5.1 Monitoring \nharvesting \ncriteria data \n5.2 Recording \nharvesting \ncriteria data \n5.3 Preparing tools, \nmaterials and \nequipment \n5.4 Pruning skills \n5.5 Boat operation \nand navigation \nskills \n5.6 Swimming skills \n5.7 Diving skills \n6. Carry-out \npost-nursery \nactivities \n6.1  Propagules are \npacked according to \nestablished farm \npractices \n6.2  Propagules are \ndispersed according \nto seaweed farmer’s \npurpose \n6.1 Packing \ntechniques for \npropagules \n6.2 Dispersal of \npropagules \n6.3 Segregation of \nmatured \nseaweed \n6.1 Packing \npropagules \n6.2 Dispersing \npropagules \n6.3 Segregating \nmatured \nseaweeds\n\n--- PDF PAGE 37 ---\nTR – Seaweed Production NC II (New)                  Promulgated December 16, 2015 \nPage 33 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n6.3  Matured seaweed \ncuttings are \nsegregated for drying \n6.4  Handling of \npropagules during \ntransportation is \nperformed based on \nindustry practices \n6.5  Propagules \nproduction data are \nrecorded based on \nindustry requirements \n6.7  Tools, materials and \nequipment are \ncleaned and stored in \naccordance with \nHACCP and OSHS \n6.8  Waste management \nis practiced in \naccordance with \nenvironmental \nregulations\n6.4 Handling and \ntransport of \nseaweed \npropagules \n6.5 Propagules \nproduction data \n6.6 Waste \nmanagement \n6.7 Record keeping \n6.8 Codes and \nregulations \nrelating to \nseaweeds \n6.9 Solid waste \nmanagement \n6.4 Handling and \ntransporting \nseaweed \npropagules \n6.5 Recording \npropagules \nproduction data \n6.6 Cleaning and \nstoring tools, \nmaterials and \nequipment \n6.7 Disposing \nwastes\n\n--- PDF PAGE 38 ---\nTR – Seaweed Production NC II (New)                  Promulgated December 16, 2015 \nPage 34 \n \nRANGE OF VARIABLES \n \n \nVARIABLE \nRANGE \n1. Necessary documents \nNecessary documents include: \n1.1 \nFisherfolk registration \n1.2 \nBoat registration \n1.3 \nLetter of application \n1.4 \nSite sketch plan \n1.5 \nHealth certificate of transboundary movement of live \nseaweeds for aquaculture purposes \n1.6\nLGU applicable permits/licenses\n2. Capital \nCapital may include: \n2.1 \nStart-up \n2.2 \nExpansion \n3. Seaweed species \nSeaweed species may include: \n3.1 \nKappaphycus spp. \n3.2 \nEucheuma spp. \n3.3\nGracilaria spp. \n4. Healthy seaweed propagules \nHealthy seaweed propagules include: \n4.1 \nClean \n4.2 \nShiny \n4.3 \nYoung \n4.4\nPlenty of thalli \n5. Floaters \nFloater may include: \n5.1 \nHigh-density polyethylene (HDPE) plastic floats \n5.2\nEmpty pet bottles\n6. Water quality \nWater quality includes: \n6.1 \nSalinity \n6.2 \npH \n6.3 \nTemperature \n6.4 \nFood Nutrients \n6.5 \nPresence of Phosphorous \n6.6 \nNitrite and Nitrates \n6.7 \nTurbidity \n7. Measuring instruments \nMeasuring instruments may include: \n7.1 \nDissolved Oxygen (DO) Meter \n7.2 \nThermometer \n7.3 \npH meter \n7.4 \nSecchi disc \n7.5\nAmmonia, nitrite and nitrate test kits \n8. Foreign materials \nForeign materials may include: \n8.1 \nDrift wood \n8.2 \nSticks \n8.3 \nUnwanted vegetation \n8.4 \nGarbage \n8.5 \nMud \n8.6 \nPlastics \n8.7\nBarnacles\n9. Pests and diseases \nPests and diseases may include: \n9.1 \nDiseases \n9.1.1 Fungal infection \n9.1.2\nBacterial infection\n\n--- PDF PAGE 39 ---\nTR – Seaweed Production NC II (New)                  Promulgated December 16, 2015 \nPage 35 \nVARIABLE \nRANGE \n9.1.3 Environmental diseases \n9.1.4 Ice-ice \n9.2 \nGrazer \n9.2.1 Sea turtle \n9.2.2 Sea urchin \n9.2.3 Star fish \n9.2.4 Siganids \n9.3 \nBarnacles \n9.4 \nOysters \n9.5\nBrittle star \n10. Harvesting criteria data \nHarvesting criteria data may include: \n10.1 Seaweed maturity \n10.1.1 \nPlanting date \n10.1.2 \nEstimated period of harvest \n10.2 Seaweed quality \n10.2.1 \nFully-grown \n10.2.2 \nPresence of branchlets \n10.2.3 \nSevere presence of disease(s) \n10.3 Anticipated abnormal weather and tidal conditions \n11. Tools, materials and \nequipment \nTools, materials and equipment may include: \n11.1 Equipment \n11.1.1 \nWater quality checker  \n11.1.2 \nDepth gauge  \n11.1.3 \nGlobal Positioning System (GPS) \n11.1.4 \n500k capacity hanging weighing scale \n11.1.5 \n15pax capacity motorized boat \n11.1.6 \n3pax capacity non-motorized wooden \nboat with katig \n11.1.7 \nTwo-way radio \n11.1.8 \nTransistor radio \n11.1.9 \nPPEs \n \nGloves \n \nGoggles \n \nFace mask \n \nSnorkel \n \nBoots \n \nPaddle \n \nFlippers \n \nHat \n \nLife vest \n11.2 Tools \n11.2.1 \nFloaters \n11.2.2 \nKnives/Scissors \n11.2.3 \nAnchor \n11.2.4 \nStainless steel table knife \n11.2.5 \n4” scissor \n11.2.6 \nRechargeable flashlight \n11.2.7 \nBattery flashlight \n11.3 Materials \n11.3.1 \nSeedling \n11.3.2 \nBond Paper \n11.3.3\nPencil\n\n--- PDF PAGE 40 ---\nTR – Seaweed Production NC II (New)                  Promulgated December 16, 2015 \nPage 36 \nVARIABLE \nRANGE \n11.3.4 \nEraser \n11.3.5 \nRuler \n11.3.6 \n100pp record book \n11.3.7 \nClean sacks \n11.3.8 \n50k capacity native bags \n11.3.9 \nNative baskets \n11.3.10 \n1000m soft ties  \n11.3.11 \n#10 (5mm) utility ropes \n11.3.12 \n20L capacity pails \n11.3.13 \nordinary dippers \n11.3.14 \n5x5m canvass/cover \n11.3.15\nBamboo \n12. Handling of propagules \nHandling of propagules may include: \n12.1 Stocking \n12.2 Piling \n12.3 Covering of sargasum/leaves \n12.4 Sprinkling \n12.5\nLoading and unloading\n13. Propagules production data \nPropagules production data may include: \n13.1 Location \n13.2 Date harvested \n13.3 Weight \n13.4\nSpecies\n\n--- PDF PAGE 41 ---\nTR – Seaweed Production NC II (New)                  Promulgated December 16, 2015 \nPage 37 \n \nEVIDENCE GUIDE \n \n \n1.  Critical aspects of competency\nAssessment requires evidence that the candidate: \n1.1 \nConducted pre-nursery activities \n1.2 \nSourced out propagules  \n1.3 \nPlanted propagules  \n1.4 \nMaintained seaweed nursery \n1.5 \nHarvested propagules \n1.6\nCarried out post-nursery activities \n2.  Resource Implications \nThe following resources should be provided: \n2.1. \nMotorized/non-motorized banca \n2.2. \nFloating farm house \n2.3. \nFarm tools (basket, knives, scissors, waterproof \nflashlight, ropes, soft ties, nets, ballpeen hammer \n“maso”, goggles) \n2.4. \nWriting device \n2.5. \nLogbooks \n2.6. \nTools/instruments \n2.7.\nReferences (field guides, manuals)\n3.  Methods of Assessment \nCompetency in this unit may be assessed through: \n3.1. \nDirect Observation \n3.2. \nDemonstration \n3.3. \nOral questioning \n3.4. \nWritten test \n3.5. \nThird-party report \n4.  Context of Assessment \n4.1. Competency maybe assessed in actual workplace or at \nthe designated TESDA Accredited Assessment \nCenter.\n",
