        "source_text": "AFF622308\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes\nin monitoring prevailing seaweed price, applying\nmarketing strategies and trading seaweed.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Monitor\nprevailing\nseaweed price\n1.1 Major producing and\ntrading areas of\nseaweeds are\ndetermined\n1.2 Seaweed information\nis sourced through\ncoordination with other\nfarmers and\ncooperatives/\nassociations\n1.3 Seaweed price is\nmonitored through the\nassistance of BFAR\nand seaweeds\nindustry\n1.1 Major producing\nand trading\nareas of\nseaweeds\n1.2 Seaweed\nindustry\nstakeholders\n1.3 Seaweed\ninformation\n1.4 Supply and\ndemand of\nseaweed local\nand international\n1.5 Source of\ninformation and\nsharing of price\nbulletin (txt, call,\ntv, e-mail,\ninternet, social\nmedia)\n1.6 Monitoring\nmethods of price\n1.7 Logistical\nhandling\nmanagement\n1.8 Interpersonal\ncommunication\n1.9 Recording\nprocedures of\nprices\n1.10 Communication\ndevices\n1.11 Weighing\ndevices\n\nValues:\n• Resourceful\n• Persevering\n• Honest\n• Organized\n• Systematic\n1.1 Determining\nmajor producing\nand trading\nareas of\nseaweeds\n1.2 Sourcing of\nseaweed\ninformation\n1.3 Monitoring\nseaweed price\nCoordinating\nskills\n1.4 Monitoring skills\n1.5 Communication\nskills\n\n--- PDF PAGE 58 ---\nTR – Seaweed Production NC II (New) Promulgated December 16, 2015\nPage 54\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n2. Apply\nmarketing\nstrategies\n2.1 Reputable buyers are\ndetermined\n2.2 Collected information\nis use in strategizing to\noptimize sales and\nprofit\n2.3 Selling points for\nseaweed are\npresented to prospect\nbuyers\n2.4 Desired sales terms\nand conditions are\nestablished\n2.5 Alliance with other\nsellers and\ncooperatives/\nassociations is\n