        "source_title": "PARTICIPATE IN WORKPLACE COMMUNICATION",
        "source_text": "--- PDF PAGE 6 ---\nTR – Seaweed Production NC II (New)                  Promulgated December 16, 2015 \nPage 2 \nSECTION 2 COMPETENCY STANDARDS \n \n \nThis section gives the details of the contents of the basic, common and core units \nof competency required in SEAWEED PRODUCTION NC II. \n \n \nBASIC COMPETENCIES \n \nUNIT OF COMPETENCY : \nPARTICIPATE IN WORKPLACE COMMUNICATION \n \nUNIT CODE \n: \n500311105 \n \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge, skills and attitudes \n \n \n required to gather, interpret and convey information \n \n \n in response to workplace requirements. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Obtain and \nconvey \nworkplace \ninformation \n1.1  Specific and  relevant \ninformation is \naccessed from \nappropriate sources \n1.2  Effective questioning,  \nactive listening and \nspeaking skills are \nused to gather and \nconvey information \n1.3  Appropriate medium \nis used to transfer \ninformation and ideas \n1.4  Appropriate non- \nverbal \ncommunication is \nused \n1.5  Appropriate lines of \ncommunication with \nsupervisors and \ncolleagues are \nidentified and \nfollowed \n1.6  Defined workplace \nprocedures for the \nlocation and storage \nof information are \nused \n1.7  Personal interaction \nis carried out clearly \nand concisely \n1.1 Effective \ncommunication \n1.2 Different modes \nof \ncommunication  \n1.3 Written \ncommunication \n1.4 Organizational \npolicies \n1.5 Communication \nprocedures and \nsystems \n1.6 Technology \nrelevant to the \nenterprise and \nthe individual’s \nwork \nresponsibilities  \n1.1 Follow simple \nspoken language \n1.2 Perform routine \nworkplace duties \nfollowing simple \nwritten notices \n1.3 Participate in \nworkplace \nmeetings and \ndiscussions \n1.4 Complete work \nrelated \ndocuments \n1.5 Estimate, \ncalculate and \nrecord routine \nworkplace \nmeasures \n1.6 Ability to relate to \npeople of social \nrange in the \nworkplace \n1.7 Gather and \nprovide \ninformation in \nresponse to \nworkplace \nrequirements\n\n--- PDF PAGE 7 ---\nTR – Seaweed Production NC II (New)                  Promulgated December 16, 2015 \nPage 3 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n2. Participate in \nworkplace \nmeetings and \ndiscussions \n2.1  Team meetings are \nattended on time \n2.2  Own opinions are \nclearly expressed and \nthose of others are \nlistened to without \ninterruption \n2.3  Meeting inputs are \nconsistent with the \nmeeting purpose and \nestablished protocols\n2.4  Workplace \ninteractions are \nconducted in a \ncourteous manner  \n2.5  Questions about \nsimple routine \nworkplace procedures \nand matters \nconcerning working \nconditions of \nemployment are asked \nand responded to \n2.6  Meetings outcomes \nare interpreted and \nimplemented \n2.1 Effective \ncommunication \n2.2 Different modes \nof \ncommunication  \n2.3 Written \ncommunication \n2.4 Organizational \npolicies \n2.5 Communication \nprocedures and \nsystems \n2.6 Technology \nrelevant to the \nenterprise and \nthe individual’s \nwork \nresponsibilities  \n2.1 Follow simple \nspoken language \n2.2 Perform routine \nworkplace duties \nfollowing simple \nwritten notices \n2.3 Participate in \nworkplace \nmeetings and \ndiscussions \n2.4 Complete work \nrelated \ndocuments \n2.5 Estimate, \ncalculate and \nrecord routine \nworkplace \nmeasures \n2.6 Ability to relate to \npeople of social \nrange in the \nworkplace \n2.7 Gather and \nprovide \ninformation in \nresponse to \nworkplace \nrequirements \n3. Complete \nrelevant work \nrelated \ndocuments \n3.1  Range of forms \nrelating to conditions \nof employment are \ncompleted accurately \nand legibly \n3.2  Workplace data is \nrecorded on standard \nworkplace forms and \ndocuments \n3.3  Basic mathematical \nprocesses are used for \nroutine calculations \n3.4  Errors in recording \ninformation on \nforms/ documents \nare identified and \nproperly acted upon \n3.5  Reporting \nrequirements to \nsupervisor are \ncompleted according \nto organizational \nguidelines\n3.1 Effective \ncommunication \n3.2 Different modes \nof \ncommunication  \n3.3 Written \ncommunication \n3.4 Organizational \npolicies \n3.5 Communication \nprocedures and \nsystems \n3.6 Technology \nrelevant to the \nenterprise and \nthe individual’s \nwork \nresponsibilities \n3.1 Complete work \nrelated \ndocuments \n3.2 Basic \nmathematical \nprocesses of \naddition, \nsubtraction, \ndivision and \nmultiplication \n3.3 Gather and \nprovide \ninformation in \nresponse to \nworkplace \nrequirements\n\n--- PDF PAGE 8 ---\nTR – Seaweed Production NC II (New)                  Promulgated December 16, 2015 \nPage 4 \nRANGE OF VARIABLES \n \n \nVARIABLE \nRANGE \n1. Appropriate sources \nMay include: \n1.1 \nTeam members \n1.2 \nSuppliers \n1.3 \nTrade personnel \n1.4 \nLocal government \n1.5\nIndustry bodies \n2. Medium \nMay include: \n2.1 \nMemorandum \n2.2 \nCircular \n2.3 \nNotice \n2.4 \nInformation discussion \n2.5 \nFollow-up or verbal instructions \n2.6\nFace to face communication \n3. Storage \nMay include: \n3.1 \nManual filing system \n3.2\nComputer-based filing system \n4. Forms \nMay include: \n4.1 \nPersonnel forms \n4.2 \nTelephone message forms \n4.3\nSafety reports \n5. Workplace interactions \nMay include: \n5.1 \nFace to face \n5.2 \nTelephone \n5.3 \nElectronic and two-way radio \n5.4 \nWritten including electronic, memos, instruction and forms, \nnon-verbal including gestures, signals, signs and diagrams \n6. Protocols \nMay include: \n6.1 \nObserving meeting \n6.2 \nCompliance with meeting decisions \n6.3\nObeying meeting instructions\n\n--- PDF PAGE 9 ---\nTR – Seaweed Production NC II (New)                  Promulgated December 16, 2015 \nPage 5 \nEVIDENCE GUIDE \n \n \n1.  Critical aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 \nPrepared written communication following standard \nformat of the organization \n1.2 \nAccessed information using communication equipment \n1.3 \nMade use of relevant terms as an aid to transfer \ninformation effectively \n1.4 \nConveyed information effectively adopting the formal or \ninformal communication\n2.  Resource Implications \nThe following resources should be provided: \n2.1 \nFax machine \n2.2 \nTelephone \n2.3 \nWriting materials \n2.4\nInternet \n3.  Methods of Assessment\nCompetency in this unit may be assessed through: \n3.1 \nDirect Observation \n3.2\nOral interview and written test \n4.  Context for Assessment \nCompetency may be assessed individually in the actual \nworkplace or through accredited institution\n",
