n3.1 Communicate \nappropriately, \nconsistent with \nthe culture of the \nworkplace \n3.2 Interacting \neffectively with \nothers\n\n--- PDF PAGE 11 ---\nTR – Seaweed Production NC II (New)                  Promulgated December 16, 2015 \nPage 7 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \ncompetencies and \nworkplace context \n3.3  Observed protocols in \nreporting using \nstandard operating \nprocedures \n3.4  Contribute to the \ndevelopment of team \nwork plans based on \nan understanding of  \nteam’s role and \nobjectives and \nindividual \ncompetencies of the \nmembers\n\n--- PDF PAGE 12 ---\nTR – Seaweed Production NC II (New)                  Promulgated December 16, 2015 \nPage 8 \nRANGE OF VARIABLES \n \n \nVARIABLE \nRANGE \n1. Role and objective of team  \nMay include: \n1.1 \nWork activities in a team environment with enterprise \nor specific sector \n1.2 \nLimited discretion, initiative and judgment maybe \ndemonstrated on the job, either individually or in a \nteam environment \n2. Sources of information \nMay include: \n2.1 \nStandard operating and/or other workplace \nprocedures \n2.2 \nJob procedures \n2.3 \nMachine/equipment manufacturer’s specifications \nand instructions \n2.4 \nOrganizational or external personnel \n2.5 \nClient/supplier instructions \n2.6 \nQuality standards \n2.7\nOHS and environmental standards\n3. Workplace context \nMay include: \n3.1 \nWork procedures and practices \n3.2 \nConditions of work environments \n3.3 \nLegislation and industrial agreements \n3.4 \nStandard work practice including the storage, safe \nhandling and disposal of chemicals \n3.5 \nSafety, environmental, housekeeping and quality \nguidelines\n\n--- PDF PAGE 13 ---\nTR – Seaweed Production NC II (New)                  Promulgated December 16, 2015 \nPage 9 \nEVIDENCE GUIDE \n \n \n1.  Critical aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 \nOperated in a team to complete workplace activity \n1.2 \nWorked effectively with others \n1.3 \nConveyed information in written or oral form \n1.4 \nSelected and used appropriate workplace language \n1.5 \nFollowed designated work plan for the job \n1.6\nReported outcomes  \n2.  Resource Implications \nThe following resources should be provided: \n2.1 \nAccess to relevant workplace or appropriately \nsimulated environment where assessment can take \nplace \n2.2\nMaterials relevant to the proposed activity or tasks\n3.  Methods of Assessment \nCompetency in this unit may be assessed through: \n3.1 \nObservation of the individual member in relation to \nthe work activities of the group \n3.2 \nObservation of simulation and or role play involving \nthe participation of individual member to the \nattainment of organizational goal \n3.3 \nCase studies and scenarios as a basis for discussion \nof issues and strategies in teamwork\n4.  Context for Assessment \n4.1 \nCompetency may be assessed in workplace or in a \nsimulated workplace setting \n4.2 \nAssessment shall be observed while task are being \nundertaken whether individually or in group\n",
