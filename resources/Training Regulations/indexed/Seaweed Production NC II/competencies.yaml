erent delivery\nmodes\n3.4 Knowledge on\nshipping terms\nand transport\nrequirements\n3.5 Negotiation\nprocedures\n3.6 Compliance to\nlocal ordinances\nand regulations\n3.1 Preparing\nseaweeds\n3.2 Negotiating with\nbuyers\n3.3 Performing\nsimple book\nkeeping\n3.4 Negotiation skills\n(selling skills)\n3.5 Simple book\nkeeping skills\n3.6 Interpersonal\nskills\n3.7 Mathematical\nskills\n\n--- PDF PAGE 59 ---\nTR – Seaweed Production NC II (New) Promulgated December 16, 2015\nPage 55\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n3.7 Seaweed\nProduct\nStandards.\n3.8 Preparation and\nkeeping records\n3.9 Computing for\nseaweeds/\nharvest, sales\nproceeds, cash\nflow, inputs and\noutput)\n\nValues\n• Harmonious\nrelationship with\nbuyers\n• Honest\n• Organized\n• Systematic\n• Courteous\n• Patient\n• Persevering\n\n--- PDF PAGE 60 ---\nTR – Seaweed Production NC II (New) Promulgated December 16, 2015\nPage 56\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Seaweed information\nSeaweed information includes:\n1.1\nLocal demand and supply\n1.2\nInternational demand and supply\n1.3\nLocation of producing and trading areas\n1.4\nPrevailing price of seaweeds\n2. Seaweeds industry\nSeaweeds industry includes:\n2.1\nFarmers\n2.2\nProcessors\n2.3\nTraders\n2.4\nExporters\n3. Buyers\nBuyers include:\n3.1\nSeaweed traders\n3.2\nFarmer traders\n3.3\nAgent/Middle-man\n3.4\nConsolidators\n3.5\nProcessors\n3.6\nExporters\n4. Selling points\nSelling points includes:\n4.1\nVolume of harvest\n4.2\nPremium quality of seaweed\n4.3\nEconomic impact to the community\n4.4\nEnvironmental benefits\n\nEVIDENCE GUIDE\n\n1. Critical aspects of competency\nAssessment requires evidence that the candidate:\n1.1\nMonitored prevailing seaweed price\n1.2\nApplied marketing strategies\n1.3\nSold seaweeds\n2. Resource Implications\nThe following resources should be provided:\n2.1\nLedger\n2.2\nCell phone\n2.3\nCalculator\