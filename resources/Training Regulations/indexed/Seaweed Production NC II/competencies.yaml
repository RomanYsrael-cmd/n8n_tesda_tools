ters\nFloater may include:\n5.1\nHigh-density polyethylene (HDPE) plastic floats\n5.2\nEmpty pet bottles\n6. Water quality\nWater quality includes:\n6.1\nSalinity\n6.2\npH\n6.3\nTemperature\n6.4\nFood Nutrients\n6.5\nPresence of Phosphorous\n6.6\nNitrite and Nitrates\n6.7\nTurbidity\n7. Measuring instruments\nMeasuring instruments may include:\n7.1\nDissolved Oxygen (DO) Meter\n7.2\nThermometer\n7.3\npH meter\n7.4\nSecchi disc\n7.5\nAmmonia, nitrite and nitrate test kits\n8. Foreign materials\nForeign materials may include:\n8.1\nDrift wood\n8.2\nSticks\n8.3\nUnwanted vegetation\n8.4\nGarbage\n8.5\nMud\n8.6\nPlastics\n8.7\nBarnacles\n9. Pests and diseases\nPests and diseases may include:\n9.1\nDiseases\n9.1.1 Fungal infection\n9.1.2\nBacterial infection\n\n--- PDF PAGE 39 ---\nTR – Seaweed Production NC II (New) Promulgated December 16, 2015\nPage 35\nVARIABLE\nRANGE\n9.1.3 Environmental diseases\n9.1.4 Ice-ice\n9.2\nGrazer\n9.2.1 Sea turtle\n9.2.2 Sea urchin\n9.2.3 Star fish\n9.2.4 Siganids\n9.3\nBarnacles\n9.4\nOysters\n9.5\nBrittle star\n10. Harvesting criteria data\nHarvesting criteria data may include:\n10.1 Seaweed maturity\n10.1.1\nPlanting date\n10.1.2\nEstimated period of harvest\n10.2 Seaweed quality\n10.2.1\nFully-grown\n10.2.2\nPresence of branchlets\n10.2.3\nSevere presence of disease(s)\n10.3 Anticipated abnormal weather and tidal conditions\n11. Tools, materials and\nequipment\nTools, materials and equipment may include:\n11.1 Equipment\n11.1.1\nWater quality checker\n11.1.2\nDepth gauge\n11.1.3\nGlobal Positioning System (GPS)\n11.1.4\n500k capacity hanging weighing scale\n11.1.5\n15pax capacity motorized boat\n11.1.6\n3pax capacity non-motorized wooden\nboat with katig\n11.1.7\nTwo-way radio\n11.1.8\nTransistor radio\n11.1.9\nPPEs\n•\nGloves\n•\nGoggles\n•\nFace mask\n•\nSnorkel\n•\nBoots\n•\nPaddle\n•\nFlippers\n•\nHat\n•\nLife vest\n11.2 Tools\n11.2.1\nFloaters\n11.2.2\nKnives/Scissors\n11.2.3\nAnchor\n11.2.4\nStainless steel table knife\n11.2.5\n