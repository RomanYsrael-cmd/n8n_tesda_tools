ing\nfaults/defects of\nfarm equipment\n2.5 Reporting on\ndefective farm\nequipment\n2.6 Operating farm\nequipment\n2.7 Following safety\nprocedures\n\n--- PDF PAGE 28 ---\nTR – Seaweed Production NC II (New) Promulgated December 16, 2015\nPage 24\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\nenvironmental\nprotection\n\n2.10 Safety and\nkeeping of\nequipment every\nafter use\n2.11 Safety measures\n3. Perform\npreventive\nmaintenance\n3.1 Tools and equipment\nare cleaned\nimmediately after use\nin line with farm\nprocedures\n3.2 Routine check-up and\nmaintenance are\nperformed\n3.3 Tools and equipment\nare stored in\ndesignated areas in\nline with farm\nprocedures\n3.1 Cleaning\nprocedures of\ntools and\nequipment\n3.2 Maintenance\nprocedures of\nfarm equipment\n3.3 Storage of tools\nand equipment\n3.4 Designated\nstorage areas\n3.1 Cleaning tools\nand equipment\n3.2 Performing\nroutinary check-\nup of tools and\nequipment\n3.3 Maintaining farm\nequipment\n3.4 Storing tools and\nequipment\n\n--- PDF PAGE 29 ---\nTR – Seaweed Production NC II (New) Promulgated December 16, 2015\nPage 25\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Farm equipment\nMay include:\n1.1\nEngine\n1.2\nPumps\n1.3\nGenerators\n1.4\nSprayers\n2. Farm tools\nMay include:\n2.1\nSickle\n2.2\nCutters\n2.3\nWeighing scales\n2.4\nHand tools\n2.5\nMeasuring tools\n2.6\nGarden tools\n3. Pre-operation check-up\nMay include:\n3.1\nTires\n3.2\nBrake fluid\n3.3\nFuel\n3.4\nWater\n3.5\nOil\n3.6\nLubricants\n3.7\nBattery\n\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nCorrectly identified appropriate farm tools and equipment\n1.2\nOperated farm equipment according to manual\nspecification\n1.3\nPerformed preventive maintenance\n2. Method of Assessment\nCompetency in this unit must be assessed through:\n2.1\nDirect observation\n2.2\nPractical demonstration\n2.3\n