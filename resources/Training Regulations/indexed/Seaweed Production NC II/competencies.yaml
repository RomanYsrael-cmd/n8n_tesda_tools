        "evidence_guide": {
          "source_text": "1. Critical aspects of competency\nAssessment requires evidence that the candidate:\n1.1\nConducted pre-nursery activities\n1.2\nSourced out propagules\n1.3\nPlanted propagules\n1.4\nMaintained seaweed nursery\n1.5\nHarvested propagules\n1.6\nCarried out post-nursery activities\n2. Resource Implications\nThe following resources should be provided:\n2.1.\nMotorized/non-motorized banca\n2.2.\nFloating farm house\n2.3.\nFarm tools (basket, knives, scissors, waterproof\nflashlight, ropes, soft ties, nets, ballpeen hammer\n“maso”, goggles)\n2.4.\nWriting device\n2.5.\nLogbooks\n2.6.\nTools/instruments\n2.7.\nReferences (field guides, manuals)\n3. Methods of Assessment\nCompetency in this unit may be assessed through:\n3.1.\nDirect Observation\n3.2.\nDemonstration\n3.3.\nOral questioning\n3.4.\nWritten test\n3.5.\nThird-party report\n4. Context of Assessment\n4.1. Competency maybe assessed in actual workplace or at\nthe designated TESDA Accredited Assessment\nCenter.\n\n--- PDF PAGE 42 ---\nTR – Seaweed Production NC II (New) Promulgated December 16, 2015\nPage 38\n\nUNIT OF COMPETENCY\n:\nGROW-OUT SEAWEED\nUNIT CODE\n:"
        },
        "source_text": "AFF622305\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitude to\noperate seaweed nursery. It includes conducting pre-\nnursery activities, sourcing out propagules, planting\npropagules, maintaining seaweed nursery, harvesting\npropagules and carrying-out post-nursery activities.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Conduct pre-\nnursery\nactivities\n1.1 Feasible nursery site\nis selected based on\nindustry standards\n1.2 Test planting is\nconducted based on\nBureau of Fisheries\nand Aquatic\nResources-Fisheries\nOffice Order (BFAR\nFOO)\n1.3 Necessary\ndocuments are\nsecured for nursery\noperation following\nindustry requirements\n1.4 Capital and other\nresources are\naccessed based on\nnursery requirements\n1.5 Simple project\nproposal is prepared\nfor assistance\n1.6 Nursery structure is\ninstalled according to\nplan and design.\n1.1 Site selection\ncriteria:\n• Bureau of\nFisheries and\nAquatic\nResources-\nFisheries\nOffice Order\n(BFAR-FOO)\n• Fisheries\nAdministrative\nOrder (FAO)\n• SEAFDEC\n• University of\nthe Philippines-\nMarine\nScience\nInstitute (UP-\nMSI)\n• Seaweed\nIndustry\nAssociation of\nthe Philippines\n(SIAP)\nendorsed\nliterature\n• HACCP\n• Presence of\nhealthy wild\nseaweeds and\nother aquatic\nplants\n1.2 Test planting\n1.3 Guidelines for\ntest-plot\n1.4 Necessary\ndocuments\n1.1 Selecting\nfeasible nursery\nsite\n1.2 Conducting test\nplanting\n1.3 Securing\nnecessary\ndocuments\n1.4 Accessing\ncapital and other\nresources\n1.5 Preparing simple\nproject proposal\n1.6 Installing nursery\nstructure\n\n--- PDF PAGE 33 ---\nTR – Seaweed Production NC II (New) Promulgated December 16, 2015\nPage 29\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1.5 Capital and other\nresources\n1.6 Components of\nsimple project\nproposal\n1.7 Different tools,\nmaterials and\nequipment for\nnursery\ninstallation\n1.8 Nursery\ninstallation\n1.9 Nursery\nexpansion\n1.10 Occupational\nHealth and\nSafety Standards\n1.11 Good\nAquaculture\nPractices\n(GAqP)\n1.12 FAO\n1.13 FOO\n1.14 Personal\nProtective\nEquipment\n(PPEs)\nValues:\n• Patience\n• Perseverance\n• Commitment\n• Cost\nconsciousness\n• Honesty\n• Teamwork\n• Time\nmanagement\n2. Source out\npropagules\n2.1 Seaweed species is\nidentified according\nto seasonality\n2.2 Seaweed propagules\nare acclimatized for\ntemperature and\nsalinity requirements\n2.3 Healthy seaweed\npropagules are\nacquired based on\ncross examination\n2.4 Seaweed propagules\nare acquired\n2.1 Seaweed\nspecies\n2.2 Basic seaweed\ntaxonomy\n2.3 Acclimatization\nmethod\n2.4 Temperature and\nsalinity\nrequirements\n2.5 Characteristics\nof healthy\nseaweeds\npropagules\n2.1 Identifying\nseaweed species\n2.2 Acclimatizing\nseaweed\npropagules\n2.3 Handling and\ntransporting of\npropagules\n2.4 Acquiring\nseaweed\npropagules\n2.5 Conducting\ncross\nexamination\n\n--- PDF PAGE 34 ---\nTR – Seaweed Production NC II (New) Promulgated December 16, 2015\nPage 30\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\naccording to planting\nscheduled\n2.5 Quantity of delivered\nseedlings are\nchecked following\nindustry procedures\n2.6 Cross\nexamination\nprocedures\n2.7 Physical\nappearance of\ngood quality\nseedlings\n2.8 Planting\nschedule\n2.9 Proper use of\ntools and\nequipment\n2.10 Basic\nmathematical\ncomputation\n2.11 Knowledge on\nRepublic Act\n(R.A) 8550\n(fisheries code)\nand local\nfisheries\nordinances\n2.12 OSHS\n2.13 Good\nAquaculture\nPractice\nStandards\n(GAqP)\nValues:\n• Safety and\nhealth\nconsciousness\n• Resourcefulness\n• Diligence\n• Time\nconsciousness\n• Cost-\nconsciousness\n• Quality-\nconsciousness\n• Quality and\nconsciousness\n• Personal\nintegrity in doing\nroutine\nmanagement\npractices\n• Perseverance in\nexecuting routine\nworks\n2.6 Communication\nskills\n2.7 Observation\nskills\n2.8 Computation\nskills\n\n--- PDF PAGE 35 ---\nTR – Seaweed Production NC II (New) Promulgated December 16, 2015\nPage 31\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n• Ability to work\nwith others\nharmoniously\n• Honesty\n3. Plant\npropagules\n3.1 Propagules are cut\naccording to the\nrequired weight\n3.2 Seaweed propagules\nare tied in planting\nlines based on\nculture method\n3.3 Planting lines are\ninstalled to nursery\nstructures following\nGAqP\n3.4 Required floaters are\ninstalled following\nGAqP\n3.1 Propagules\nrequired weight:\n• 100 grams\n• 200 grams\n3.2 Cutting\ntechniques\n3.3 Tying techniques\n3.4 Installation of\nplanting lines\n3.5 Weight\nestimation\n3.6 Boat operation\n3.7 Navigation\n3.8 Kinds of floaters\n3.9 Floaters\ninstallation\n3.10 Use of weighing\nscale\n3.11 GAqP\n3.1 Estimating\nweight\n3.2 Cutting\npropagules\n3.3 Tying propagules\n3.4 Installing\nplanting lines\nand floaters\n3.5 Navigation skills\n3.6 Swimming skills\n3.7 Diving skills\n3.8 Practicing GAqP\n4. Maintain\nseaweed\nnursery\n4.1 Weekly growth rate is\ncomputed and\nrecorded using Daily\nGrowth Rate (DGR)\nformula\n4.2 Water quality\nmonitoring is done\nusing the appropriate\nmeasuring\ninstrument\n4.3 Foreign materials\nare removed and\ndisposed following\nGAqP and marine\npollution act\n4.4 Nursery structures\nand set-up are\nmaintained according\nto industry practices\n4.5 Pests and diseases\nare monitored\nthrough ocular and\ncross examination\n4.6 Prevention and\ncontrol measures\nare identified and\nimplemented\n4.1 DGR formula and\ncomputation\n4.2 Foreign materials\n4.3 Water quality\nmonitoring\n• Using\nmeasuring\ninstruments\n4.4 Seaweed nursery\npatrolling\n4.5 Monitoring\ntechniques\n4.6 Waste\nmanagement\n• Removal and\ndisposal\n• Cleaning\ntechniques\n4.7 