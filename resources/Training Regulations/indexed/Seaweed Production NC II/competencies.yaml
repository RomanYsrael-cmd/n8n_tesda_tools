 Cleaning \ntechniques \n4.7 Nursery structure \nand set-up \n Knot tying \ntechniques \n Adjusting \ntechniques and \nprocedures \n Replacement of \ndetached \npropagules\n4.1 Computing DGR \n4.2 Monitoring water \nquality \n4.3 Cleaning \nseaweed \npropagules \n4.4 Disposing waste \nand foreign \nmaterials \n4.5 Maintaining \nnursery \nstructures and \nset-up \n4.6 Monitoring and \npreventing pests \nand diseases \n4.7 Patrolling \nseaweed nursery \n4.8 Recording skills \n4.9 Visual analysis \nskills\n\n--- PDF PAGE 36 ---\nTR – Seaweed Production NC II (New)                  Promulgated December 16, 2015 \nPage 32 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n4.7  Seaweed nursery is \npatrolled following \nindustry procedures \n Repair nursery \nstructure \n Submerging of \nnursery \nstructure \n4.8 \nDifferent \ndiseases of \nseaweeds \n4.9 \nDisease \nsurveillance, \nmonitoring and \nreporting \n4.10 Signs and \nsymptoms of \ndiseases \n4.11 Different \nprevention and \ncontrol \nmeasures \nagainst pests \nand diseases \n4.12 Different \ngrazers \n4.13 Marine Pollution \nAct \n4.14 GAqP \n4.15 5S \n4.16 PPEs \n5. Harvest \npropagules \n5.1  Harvesting criteria \ndata are recorded \nand monitored based \non industry practices \n5.2  Tools, materials and \nequipment are \nprepared in \naccordance with \nindustry standards \n5.3  Propagules are \npruned following \nprescribed cutting \ntechniques \n5.4  Boat is operated \nbased on industry \npractices \n5.1 Harvesting \ncriteria data \n5.2 Pruning \ntechniques \n5.3 Cutting \ntechniques \n5.4 Preparation of \nharvesting tools, \nmaterials and \nequipment \n5.5 Boat operation \n5.1 Monitoring \nharvesting \ncriteria data \n5.2 Recording \nharvesting \ncriteria data \n5.3 Preparing tools, \nmaterials and \nequipment \n5.4 Pruning skills \n5.5 Boat operation \nand navigation \nskills \n5.6 Swimming skills \n5.7 Diving skills \n6. Carry-out \npost-nursery \nactivities \n6.1  Propagules are \npacked according to \nestablished farm \npractices \n6.2  Propagules are \ndispersed according \nto seaweed farmer’s \npurpose \n6.1 Packing \ntechniques for \npropagules \n6.2 Dispersal of \npropagules \n6.3 Segregation of \nmatured \nseaweed \n6.1 Packing \npropagules \n6.2 Dispersing \npropagules \n6.3 Segregating \nmatured \nseaweeds\n\n--- PDF PAGE 37 ---\nTR – Seaweed Production NC II (New)                  Promulgated December 16, 2015 \nPage 33 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n6.3  Matured seaweed \ncuttings are \nsegregated for drying \n6.4  Handling of \npropagules during \ntransportation is \nperformed based on \nindustry practices \n6.5  Propagules \nproduction data are \nrecorded based on \nindustry requirements \n6.7  Tools, materials and \nequipment are \ncleaned and stored in \naccordance with \nHACCP and OSHS \n6.8  Waste management \nis practiced in \naccordance with \nenvironmental \nregulations\n6.4 Handling and \ntransport of \nseaweed \npropagules \n6.5 Propagules \nproduction data \n6.6 Waste \nmanagement \n6.7 Record keeping \n6.8 Codes and \nregulations \nrelating to \nseaweeds \n6.9 Solid waste \nmanagement \n6.4 Handling and \ntransporting \nseaweed \npropagules \n6.5 Recording \npropagules \nproduction data \n6.6 Cleaning and \nstoring tools, \nmaterials and \nequipment \n6.7 Disposing \nwastes\n\n--- PDF PAGE 38 ---\nTR – Seaweed Production NC II (New)                  Promulgated December 16, 2015 \nPage 34 \n \nRANGE OF VARIABLES \n \n \nVARIABLE \nRANGE \n1. Necessary documents \nNecessary documents include: \n1.1 \nFisherfolk registration \n1.2 \nBoat registration \n1.3 \nLetter of application \n1.4 \nSite sketch plan \n1.5 \nHealth certificate of transboundary movement of live \nseaweeds for aquaculture purposes \n1.6\nLGU applicable permits/licenses