 \n6.5 Operating boat\n6.6 Inter-personal \ncommunicatio\nn skills \n6.7 Workplace \nsafety skills \n6.8 Simple repair \n& \nTroubleshootin\ng skills\n\n--- PDF PAGE 46 ---\nTR – Seaweed Production NC II (New)                  Promulgated December 16, 2015 \nPage 42 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n6.13 Coordinating skills \n6.14 Interpersonal \ncommunication \nskills \n6.15 First Aid \n6.16 5S \n6.17 SSOP \n6.18 GAqP \n6.19 BFAR regulations \n6.20 Sanitation Standard \nOperating \nProcedure (SSOP)  \n6.21 HACCP \n6.22 Different harvesting \ntools, materials and \nequipment \n6.23 Handling, \npreventive \nmaintenance and \ntroubleshooting of \ntools and \nequipment against: \n6.24 Possible defects \nand failure \n6.25 Enough fuel \n6.26 Free from foreign \nmaterials (e.g. \nanimal wastes, \nhuman wastes, \ngreases and oils, \nearth matter, other \nmetallic, glass and \nplastic materials) \nValues: \n \nResourcefulness \n \nEfficiency \n \nSafety \nconsciousness \n \nTime management \n \nTeamwork \n \nEnvironment \nconsciousness \n \nHonesty \n \nOrganized \n\nCleanliness\n7. Complete \nseaweed \ngrow-out \noperation  \n7.1  Management of \nharvested seaweed \ncrops is performed in \naccordance with \nGAqP and waste \n7.1 Seaweed farmer’s \nbeneficiary form \n(planting and \nproduction \nmonitoring)\n7.1 Managing \nharvested \nseaweed \n7.2 Disposing \nwastes\n\n--- PDF PAGE 47 ---\nTR – Seaweed Production NC II (New)                  Promulgated December 16, 2015 \nPage 43 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \nmanagement \nstandards \n7.2  Wastes are disposed \naccording to \nenvironmental \nprocedures \n7.3  Seaweed production \ndata are recorded \nbased on industry \npractice \n7.4  Harvested seaweeds \nare labeled based on \nindustry practices \n7.5  Handling of seaweed \ncrops during transport\nis performed based on \nindustry practices \n7.6  Tools, materials and \nequipment are \ncleaned and stored in \naccordance to \nHACCP and OSHS \n7.2 Management of \nharvested seaweed \ncrop \n7.3 Proper waste \ndisposal \n7.4 Handling of \nseaweed crops \n7.5 Seaweed \nproduction data \n7.6 Labeling of \nseaweed crops \n7.7 Computation of \ngrowth rate \n7.8 Computation of \nvolume of harvest & \nprofit \n7.9 OSHS \n7.10 Good \nhousekeeping \n7.11 4Rs (reduce, reuse, \nrecycle and \nrecover) \n7.12 HACCP \n7.13 BFAR regulations \n7.14 Waste \nmanagement \nstandards \n7.15 Cleaning and \nstoring tools, \nmaterials and \nequipment \nValues: \n \nResourcefulness \n \nEfficiency \n \nSafety \nconsciousness \n \nTime management \n \nTeamwork \n \nEnvironment \nconsciousness \n \nHonest \n \nRisk taker \n \nAssertive \n \nPersistent \n \nOpportunity seeker \n7.3 Recording \nseaweed \nproduction \ndata \n7.4 Labeling \nhandled \nseaweed \n7.5 Transporting \nand handling \nof harvested \nseaweeds \n7.6 Cleaning and \nstoring of \ntools, \nmaterials, and \nequipment\n\n--- PDF PAGE 48 ---\nTR – Seaweed Production NC II (New)                  Promulgated December 16, 2015 \nPage 44 \nRANGE OF VARIABLES \n \n \nVARIABLE \nRANGE \n1. Necessary documents \nNecessary documents include: \n1.1 \nFisherfolk registration \n1.2 \nBoat registration \n1.3 \nLetter of application \n1.4 \nSite sketch plan \n1.5 \nHealth certificate of transboundary movement of \nlive seaweeds for aquaculture purposes \n1.6\nLGU applicable permits/licenses \n2. Capital \nCapital may include: \n2.1 \nStart-up \n2.2\nExpansion \n3. Farm tools, materials and \nequipment \nFarm tools, materials and equipment include: \n3.1. Tools \n3.1.1 \nBall hammer \n3.1.2 \nFloaters \n3.1.3 \nStainless steel table knife \n3.1.4 \n4” scissor \n3.1.5 \nRechargeable flashlight  \n3.1.6 \nBattery flashlight \n3.1.7 \nTransistor radio \n3.1.8 \nSeed bin \n3.1.9 \nAnchors \n3.1.10 Sinkers \n3.2. Materials  \n3.2.1 \nClean sacks \n3.2.2 \n50 k capacity native bags \n3.2.3 \nNative baskets \n3.2.4 \n1000m soft ties 1roll \n3.2.5 \n#10 (5mm) utility ropes \n3.2.6 \n20L cap. pails \n3.2.7 \nordinary dippers \n3.2.8 \n100pp record book \n3.2.9 \n5x5m canvass/cover  \n3.2.10 Straw \n3.2.11 Sticks \n3.2.12 Bamboo \n3.2.13 Ropes  \n3.2.14 Sampling plastic bags with and without \nholes \n3.2.15 Cheese cloth or “Katsa” \n3.2.16 Labelling pen \n3.2.17 PPEs \n \nGloves \n \nGoggles \n \nFace mask \n \nSnorkel \n \nBoots \n \nPaddle \n \nFlippers\n\n--- PDF PAGE 49 ---\nTR – Seaweed Production NC II (New)                  Promulgated December 16, 2015 \nPage 45 \n \nHat \n \nLife vest \n3.3. Equipment \n3.3.1 \n500 K capacity hanging weighing scale \n3.3.2 \n15pax cap. motorized boat \n3.3.3 \n3pax cap. non-motorized boat with \nkatig \n3.3.4 \nTwo-way radio \n4. Culture methods \nCulture methods include: \n4.1 \nShallow \n4.1.1 \nFixed/Line method \n4.1.2 \nFloating raft method \n4.1.3 \nBottom stake method \n4.1.4 \nStationary method \n4.1.5 \nFloating Cage method \n4.1.6 \nBamboo raft method \n4.1.7 \nPlot method \n4.2 \nDeep sea \n4.2.1 \nFloating raft method \n4.2.2\nBamboo raft method \n5. Measurement activities \nMeasurement activities includes:  \n5.1 \nMeasuring total area of grow-out farm \n5.2 \nMeasuring length of ropes, bamboos and lines \n5.3 \nMeasuring distance between monolines and \npropagules \n5.4\nMeasuring biomass\n6. Grazers \nGrazers include: \n6.1 \nSea turtle \n6.2 \nSea urchin \n6.3 \nStar fish \n6.4 \nSiganids \n6.5 \nBarnacles \n6.6 \nOysters \n6.7 \nBrittle star \n7. Controlling of grazers \nControlling of grazers includes: \n7.1 \nUse of nets \n7.2 \nBuffer plants \n7.3\nHand picking \n8. Seaweed species \nSeaweed species include: \n8.1 \nKappaphycus spp.  \n8.2 \nEucheuma spp. \n8.3\nGracilaria spp.\n\n--- PDF PAGE 50 ---\nTR – Seaweed Production NC II (New)                  Promulgated December 16, 2015 \nPage 46 \n9. Healthy seaweeds \nHealthy seaweeds include the following: \n9.1 \nClean \n9.2 \nShiny \n9.3 \nYoung \n9.4 \nPlenty of thalli \n10. Water quality \nWater quality includes: \n10.1 \nSalinity \n10.2 \npH \n10.3 \nTemperature \n10.4 \nFood Nutrients \n10.5 \nPresence of Phosphorous \n10.6 \nNitrite and Nitrates \n10.7\nTurbidity   \n11. Measuring instruments \nMeasuring instruments includes: \n11.1 \nDissolved Oxygen (DO) Meter \n11.2 \nThermometer \n11.3 \nPH meter \n11.4 \nSecchi Disc \n11.5 \nAmmonia, nitrite and Nitrate test Kits \nRefractometer \n12. Foreign materials \nForeign materials may include:  \n12.1 \nAnimal wastes and human wastes  \n12.2 \nDomestic waste  \n12.3 \nSoft ties \n12.4 \nGreases and oils \n12.5 \nEarth matters \nOther metallic, plastic and glass materials\n13. Signs and symptoms of \ndisease infection \nSigns and symptoms of disease infection include: \n13.1 \nCottony growth \n13.2 \nLesions such as mechanical damage cause by \nboats, grazers, human, etc. \n13.3 \nWhitist \n13.4 \nPale \n13.5 \nFragmentation \n13.6 \nDiscoloration \n13.7 \nMud envelop thallus \n13.8 \nEnlarged thallus  \n13.9 \nPit or holes on thallus  \n13.10 Presence of epiphytes, algal parasites and fouling \n13.11 Dark color thallus \n14. Prevention and control \nmeasures \nPrevention and control measures may include: \n14.1 Removal of infected seaweed \n14.2 Total harvest for drying \n14.3 Crop rotation \n14.4 Water depth zoning  \n14.5 Sanitize nets, equipment and tools (sun drying,  \napplication of 10% chlorine, washing freshwater, \nsoap, isopropyl alcohol)   \n14.6 Test plant \n14.7 Daily farm visit (manual removal of pest and \ngrazers) \n14.8 Disinfect seed stocks to eliminate detrimental     \norganism (application of red pepper, vinegar, \ngarlic)\n\n--- PDF PAGE 51 ---\nTR – Seaweed Production NC II (New)                  Promulgated December 16, 2015 \nPage 47 \n14.9 Avoid throwing of trash and farm structures to the \nwater \n14.10 Proper selection of healthy seaweeds for planting \n14.11 Maintain two (2) or more farming areas \n14.12 Ice-ice control - Proper spacing among propagules, \ntransfer of healthy seaweed in another area, \nposition farm structures parallel to current, removal \nof infected thallus \n14.13 Epiphyte and ice-ice control - Pruning of infected \nthalli, transfer of culture area  \n14.14 Grazing control – fencing \n15. Harvesting criteria \nHarvesting criteria includes: \n15.1 \nSeaweed maturity \no planting date \no estimated period of harvest \n15.2 \nSeaweed quality \no fully-grown \no presence of branchlets \no severe presence of disease(s) \nAnticipated abnormal weather and tidal conditions\n16. Harvesting techniques \nHarvesting techniques may include: \n16.1 \nUntying of cultivation ropes \n16.2 \nPulling of cultivation ropes \nCutting of soft ties \n17. Farming/Culturing methods \nFarming/Culturing methods include: \n17.1 \nFloating long lines \n17.2 \nFixed-bottom \nRaft \n18. Management of harvested \nseaweed crops \nManagement of harvested seaweed crops include: \n18.1 Washing of seaweed with seawater \n18.2 Removal of ties, debris, macro-epiphytes, and \nforeign materials\n19. Seaweed production data \nSeaweed production data includes: \n19.1 \nLocation \n19.2 \nDate harvested \n19.3 \nWeight \n19.4\nSpecies\n20. Handling of seaweed crops \nHandling of seaweed crops may include: \n20.1 \nStocking \n20.2 \nCovering of sargasum/ banana leaves \n20.3 \nSprinkling \n20.4 \nLoading and unloading \n21. Labelling of seaweed crops \nLabelling of seaweed crops includes: \n21.1 Date of harvest \n21.2 Weight\n\n--- PDF PAGE 52 ---\nTR – Seaweed Production NC II (New)                  Promulgated December 16, 2015 \nPage 48"
