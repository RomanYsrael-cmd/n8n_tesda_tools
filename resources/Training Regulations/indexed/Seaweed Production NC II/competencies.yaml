ality\nWater quality includes:\n10.1\nSalinity\n10.2\npH\n10.3\nTemperature\n10.4\nFood Nutrients\n10.5\nPresence of Phosphorous\n10.6\nNitrite and Nitrates\n10.7\nTurbidity\n11. Measuring instruments\nMeasuring instruments includes:\n11.1\nDissolved Oxygen (DO) Meter\n11.2\nThermometer\n11.3\nPH meter\n11.4\nSecchi Disc\n11.5\nAmmonia, nitrite and Nitrate test Kits\nRefractometer\n12. Foreign materials\nForeign materials may include:\n12.1\nAnimal wastes and human wastes\n12.2\nDomestic waste\n12.3\nSoft ties\n12.4\nGreases and oils\n12.5\nEarth matters\nOther metallic, plastic and glass materials\n13. Signs and symptoms of\ndisease infection\nSigns and symptoms of disease infection include:\n13.1\nCottony growth\n13.2\nLesions such as mechanical damage cause by\nboats, grazers, human, etc.\n13.3\nWhitist\n13.4\nPale\n13.5\nFragmentation\n13.6\nDiscoloration\n13.7\nMud envelop thallus\n13.8\nEnlarged thallus\n13.9\nPit or holes on thallus\n13.10 Presence of epiphytes, algal parasites and fouling\n13.11 Dark color thallus\n14. Prevention and control\nmeasures\nPrevention and control measures may include:\n14.1 Removal of infected seaweed\n14.2 Total harvest for drying\n14.3 Crop rotation\n14.4 Water depth zoning\n14.5 Sanitize nets, equipment and tools (sun drying,\napplication of 10% chlorine, washing freshwater,\nsoap, isopropyl alcohol)\n14.6 Test plant\n14.7 Daily farm visit (manual removal of pest and\ngrazers)\n14.8 Disinfect seed stocks to eliminate detrimental\norganism (application of red pepper, vinegar,\ngarlic)\n\n--- PDF PAGE 51 ---\nTR – Seaweed Production NC II (New) Promulgated December 16, 2015\nPage 47\n14.9 Avoid throwing of trash and farm structures to the\nwater\n14.10 Proper selection of healthy seaweeds for planting\n14.11 Maintain two (2) or more farming areas\n14.12 Ice-ice control - Proper spacing among propagules,\ntransfer of healthy seaweed in another area,\nposition farm structures parallel to current, removal\nof infected thallus\n14.13 Epiphyte and ice-ice control - Pruning of infected\nthalli, transfer of culture area\n14.14 Grazing control – fencing\n15. Harvesting criteria\nHarvesting criteria includes:\n15.1\nSeaweed maturity\no planting date\no estimated period of harvest\n15.2\nSeaweed quality\no fully-grown\no presence of branchlets\no severe presence of disease(s)\nAnticipated abnormal weather and tidal conditions\n16. Harvesting techniques\nHarvesting techniques may include:\n16.1\nUntying of cultivation ropes\n16.2\nPulling of cultivation ropes\nCutting of soft ties\n17. Farming/Culturing methods\nFarming/Culturing methods include:\n17.1\nFloating long lines\n17.2\nFixed-bottom\nRaft\n18. Management of harvested\nseaweed crops\nManagement of harvested seaweed crops include:\n18.1 Washing of seaweed with seawater\n18.2 Removal of ties, debris, macro-epiphytes, and\nforeign materials\n19. Seaweed production data\nSeaweed production data includes:\n19.1\nLocation\n19.2\nDate harvested\n19.3\nWeight\n19.4\nSpecies\n20. Handling of seaweed crops\nHandling of seaweed crops may include:\n20.1\nStocking\n20.2\nCovering of sargasum/ banana leaves\n20.3\nSprinkling\n20.4\nLoading and unloading\n21. Labelling of seaweed crops\nLabelling of seaweed crops includes:\n21.1 Date of harvest\n21.2 Weight\n\n--- PDF PAGE 52 ---\nTR – Seaweed Production NC II (New) Promulgated December 16, 2015\nPage 48\nEVIDENCE GUIDE\n\n1. Critical aspects of competency\nAssessment requires evidence that the candidate:\n1.1\nConducted pre-cropping activities\n1.2\nPrepared grow out farm\n1.3\nStocked healthy seaweed cuttings\n1.4\nPlanted seaweed propagules\n1.5\nMaintained seaweed farm\n1.6\nConducted cross examination and applied disease\nprevention and control measures\n1.7\nConducted disease surveillance, monitoring and\nreporting\n1.8\nApplied health management practices in seaweed\nfarms\n1.9\nApplied good seaweed farming practices\n1.10\nHarvested mature seaweeds\n2. Resource Implications\nThe following resources should be provided:\n2.1\nActual/ simulated seaweed farm\n2.2\nAll supplies, materials and equipment needed\nduring design, construction and operations of\nseaweeds farms should be readily available at the\nfarm site such as:\no Knives, bolo\no Ball hammer\no Floaters\no Straw\no Sticks\no Goggles/snorkel, flippers\no Paddle\no Bamboo\no Ropes\no Screens\no Anchors/Sand bags\no Sinkers\no Banca/boat\no Booties\no Life vest\no First Aid\n2.3\nMeasuring instruments : meter tape,\n2.4\nPPE\n3. Methods of Assessment\nCompetency in this unit may be assessed through:\n3.1\nDirect/Actual observation and questioning\n3.2\nDemonstration\n3.3\nWritten exam\n3.4\nOral questioning\n4. Context of Assessment\n4.1.\nCompetency maybe assessed in actual workplace\nor at the designated TESDA Accredited\nAssessment Center.\n\n--- PDF PAGE 53 ---\nTR – Seaweed Production NC II (New) Promulgated December 16, 2015\nPage 49\nUNIT OF COMPETENCY\n:\nPRODUCE RAW DRIED SEAWEED\n\nUNIT CODE\n:\nAFF622307\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes\nrequired to dry the newly harvested seaweeds, pack\nand store dried seaweeds.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Dry the newly\nharvested\nseaweeds\n1.1 Tools, materials,\nequipment and\nfacilities are prepared\nand cleaned following\nworkplace procedures\n1.2 Appropriate drying\ntechniques are\nselected based on\nproduction\nrequirements\n1.3 Harvested seaweeds\nare cleaned and dried\naccording to\nPhilippine National\nStandards (PNS) on\ndried raw seaweeds\n1.4 Seaweeds samples\nare collected for\nmoisture content\nanalysis\n1.5 Housekeeping is\npracticed following 5S\nof Good housekeeping\n1.1 Proper use of\ntools and\nequipment\n1.2 Drying\ntechniques and\nprocedures\n1.3 Moisture content\nof seaweeds\n1.4 Seaweed\nsampling\n1.5 PNS-BAFPS 85-\n2010\n1.6 3R’s\n1.7 5S\n1.8 OSHS\n\nValues:\n•\nSafety and health\nconsciousness\n•\nResourcefulness\n•\nDiligence\n•\nTime\nconsciousness\n•\nCost-\nconsciousness\n•\nPersonal integrity\nin doing routine\nmanagement\npractices\n•\nPerseverance in\nexecuting routine\nworks\n•\nAbility to work with\nothers\nharmoniously\n•\nEnvironmental\nconsciousness\n1.1 Preparing tools,\nmaterials,\nequipment, and\nfacilities\n1.2 Selecting drying\ntechniques\n1.3 Demonstrating\ndrying\ntechniques\n1.4 Analyzing\nmoisture content\n1.5 Cleaning and\ndrying of\nseaweeds\n1.6 Sampling\nseaweeds\n1.7 Handling tools\n1.8 Practicing PNS,\n5S, OSHS and\nHACCP\n2. Pack the dried\nseaweeds\n2.1 Tools, materials and\nequipment are\nprepared for packing\npurposes\n2.1 Proper selection\nof packing\nmaterials\n2.2 Good practices\nof sorting and\n2.1 Selecting\nappropriate\npacking\nmaterials\n\n--- PDF PAGE 54 ---\nTR – Seaweed Production NC II (New) Promulgated December 16, 2015\nPage 50\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n2.2 Dried seaweeds are\ncleaned to remove\nforeign materials\ncomplying with PNS\n2.3 Dried seaweeds are\npacked following PNS\n2.4 Packed seaweeds are\nweighed according to\nindustry practice\n2.5 Packed dried\nseaweeds are labeled\nfor traceability\npacking\nprocedures\n2.3 Proper use and\ncalibration of\nweighing scale\n2.4 Labeling for\ntraceability\n2.5 Computation of\ntotal weight\n2.2 Sorting of dried\nseaweeds\n2.3 Tying and\npacking skills\n2.4 Labeling skills\n2.5 Recording skills\n2.6 Mathematical\nskills\n2.7 Using weighing\nscale\n3. Store the\ndried\nseaweeds\n3.1 Area for storage of\ndried seaweeds is\nselected following\nindustry requirement\n3.2 Dried seaweeds are\nproperly stacked/ piled\nby species\n3.3 Stacked dried\nseaweeds are\nmonitored following\nindustry standard\noperating procedures\n3.4 Storage area is\nmaintained according\nto industry standard\noperating procedures\n3.1 Proper selection\nof storage area\n3.2 Systems of\nstacking/piling\n3.3 Proper use of\nrecord book\n3.4 Maintenance of\nstorage area\n3.5 Monitoring\nprocedures\n3.1 Selecting\nappropriate\nstorage area\n3.2 Demonstrating\nproper way of\npiling/stacking\n3.3 Monitoring\nstacked dried\nseaweeds\n3.4 Labeling skills\n3.5 Recording skills\n3.6 Maintaining\nstorage area\n\n--- PDF PAGE 55 ---\nTR – Seaweed Production NC II (New) Promulgated December 16, 2015\nPage 51\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Tools, materials, equipment\nand facilities\nTools, materials, equipment and facilities include:\n1.1\nTools:\no Knife\no Scissor\n1.2\nMaterials:\no Bamboo\no Net\no Wood\no Rattan baskets\no Sacks\no Canvass\n1.3\nEquipment:\no MC Analyzer\n1.4\nFacilities\no Solar dryer (green house)\no Elevated wooden flat form\n2. Drying techniques\nDrying techniques include:\n2.1\nHanging method\n2.2\nElevated flat form\n3. Philippine National Standards\n(PNS)\nPhilippine National Standards (PNS) include:\n3.1\nMoisture content\n3.2\nClean anhydrous seaweeds\n3.3\nImpurities\n3.4\nSand and salt\n3.5\nColor\n3.6\nSampling\n4. Tools, materials and\nequipment for packing\nTools, materials and equipment include:\n4.1\nTools:\no Needle\n4.2\nMaterials\no Ropes\no straws\no sacks (Polypropylene sacks)\n4.3\nEquipment:\no weighing scale\n\n--- PDF PAGE 56 ---\nTR – Seaweed Production NC II (New) Promulgated December 16, 2015\nPage 52\n5. Foreign materials\nForeign materials include:\n5.1\nPlastic\n5.2\nSand\n5.3\nStones\n5.4\n“Junk weeds”\n5.5\nShells\n5.6\nCorals\n5.7\nSoft ties\n6. Label\nLabel includes:\n6.1\nSpecies\n6.2\nSource (area)\no *Date of harvest\n7. Area\nAppropriate area includes:\n7.1\nClean\n7.2\nDry\n7.3\nWell-ventilated\n\nEVIDENCE GUIDE\n\n1. Critical aspects of competency\nAssessment requires evidence that the candidate:\n1.1\nCarried-out appropriate drying techniques\n1.2\nPerformed proper selection of packing materials\n1.3\nObserved good practices of sorting and packing\n1.4\nCarried-out the proper way of piling/ stacking\n1.5\nSelected appropriate area for storage\n1.6\nPracticed PNS for dried seaweeds\n2. Resource Implications\nThe following resources should be provided:\n2.1\nStorage room\n2.2\nTool room\n2.3\nSolar dryer (elevated flat form, green house)\n2.4\nWriting device\n2.5\nFarm supplies\n2.6\nLogbooks\n2.7\nPNS manual\n2.8\nPacking materials (Polypropylene sacks)\n2.9\nWeighing scale\n2.10 Moisture Analyzer\n3. Methods of Assessment\nCompetency in this unit may be assessed through:\n3.1\nDirect Observation\n3.2\nDemonstration\n3.3\nOral questioning\n3.4\nWritten test\n4. Context of Assessment\n4.1. Competency maybe assessed in actual workplace or at the\ndesignated TESDA Accredited Assessment Center.\n\n--- PDF PAGE 57 ---\nTR – Seaweed Production NC II (New) Promulgated December 16, 2015\nPage 53\nUNIT OF COMPETENCY\n:\nMARKET SEAWEED\n\nUNIT CODE\n:\nAFF622308\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes\nin monitoring prevailing seaweed price, applying\nmarketing strategies and trading seaweed.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Monitor\nprevailing\nseaweed price\n1.1 Major producing and\ntrading areas of\nseaweeds are\ndetermined\n1.2 Seaweed information\nis sourced through\ncoordination with other\nfarmers and\ncooperatives/\nassociations\n1.3 Seaweed price is\nmonitored through the\nassistance of BFAR\nand seaweeds\nindustry\n1.1 Major producing\nand trading\nareas of\nseaweeds\n1.2 Seaweed\nindustry\nstakeholders\n1.3 Seaweed\ninformation\n1.4 Supply and\ndemand of\nseaweed local\nand international\n1.5 Source of\ninformation and\nsharing of price\nbulletin (txt, call,\ntv, e-mail,\ninternet, social\nmedia)\n1.6 Monitoring\nmethods of price\n1.7 Logistical\nhandling\nmanagement\n1.8 Interpersonal\ncommunication\n1.9 Recording\nprocedures of\nprices\n1.10 Communication\ndevices\n1.11 Weighing\ndevices\n\nValues:\n•