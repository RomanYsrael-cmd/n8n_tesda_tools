        "evidence_guide": {
          "source_text": "1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nExplained clearly established workplace safety\nand hazard control practices and procedures\n1.2\nIdentified hazards/risks in the workplace and its\ncorresponding indicators in accordance with\ncompany procedures\n1.3\nRecognized contingency measures during\nworkplace accidents, fire and other emergencies\n1.4\nIdentified terms of maximum tolerable limits\nbased on threshold limit value- TLV.\n1.5\nFollowed Occupational Health and Safety (OHS)\nprocedures for controlling hazards/risks in\nworkplace\n1.6\nUsed Personal Protective Equipment (PPE) in\naccordance with company OHS procedures and\npractices\n1.7\nCompleted and updated OHS personal records\nin accordance with workplace requirements\n2. Resource Implications\nThe following resources should be provided:\n2.1\nWorkplace or assessment location\n2.2\nOHS personal records\n2.3\nPPE\n2.4\nHealth records\n3. Methods of Assessment\nCompetency may be assessed through:\n3.1\nPortfolio Assessment\n3.2\nInterview\n3.3\nCase Study/Situation\n4. Context for Assessment\nCompetency may be assessed in the work place or in\na simulated work place setting\n\n--- PDF PAGE 23 ---\nTR – Seaweed Production NC II (New) Promulgated December 16, 2015\nPage 19\nCOMMON COMPETENCIES\n\nUNIT OF COMPETENCY\n:\nAPPLY SAFETY MEASURES IN FARM OPERATION\n\nUNIT CODE\n:"
