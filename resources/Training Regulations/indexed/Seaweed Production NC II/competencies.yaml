        "evidence_guide": {
          "source_text": "1.  Critical aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 \nPrepared written communication following standard \nformat of the organization \n1.2 \nAccessed information using communication equipment \n1.3 \nMade use of relevant terms as an aid to transfer \ninformation effectively \n1.4 \nConveyed information effectively adopting the formal or \ninformal communication\n2.  Resource Implications \nThe following resources should be provided: \n2.1 \nFax machine \n2.2 \nTelephone \n2.3 \nWriting materials \n2.4\nInternet \n3.  Methods of Assessment\nCompetency in this unit may be assessed through: \n3.1 \nDirect Observation \n3.2\nOral interview and written test \n4.  Context for Assessment \nCompetency may be assessed individually in the actual \nworkplace or through accredited institution",
