        "evidence_guide": {
          "source_text": "1. Critical aspects of competency\nAssessment requires evidence that the candidate:\n1.1\nConducted pre-cropping activities\n1.2\nPrepared grow out farm\n1.3\nStocked healthy seaweed cuttings\n1.4\nPlanted seaweed propagules\n1.5\nMaintained seaweed farm\n1.6\nConducted cross examination and applied disease\nprevention and control measures\n1.7\nConducted disease surveillance, monitoring and\nreporting\n1.8\nApplied health management practices in seaweed\nfarms\n1.9\nApplied good seaweed farming practices\n1.10\nHarvested mature seaweeds\n2. Resource Implications\nThe following resources should be provided:\n2.1\nActual/ simulated seaweed farm\n2.2\nAll supplies, materials and equipment needed\nduring design, construction and operations of\nseaweeds farms should be readily available at the\nfarm site such as:\no Knives, bolo\no Ball hammer\no Floaters\no Straw\no Sticks\no Goggles/snorkel, flippers\no Paddle\no Bamboo\no Ropes\no Screens\no Anchors/Sand bags\no Sinkers\no Banca/boat\no Booties\no Life vest\no First Aid\n2.3\nMeasuring instruments : meter tape,\n2.4\nPPE\n3. Methods of Assessment\nCompetency in this unit may be assessed through:\n3.1\nDirect/Actual observation and questioning\n3.2\nDemonstration\n3.3\nWritten exam\n3.4\nOral questioning\n4. Context of Assessment\n4.1.\nCompetency maybe assessed in actual workplace\nor at the designated TESDA Accredited\nAssessment Center.\n\n--- PDF PAGE 53 ---\nTR – Seaweed Production NC II (New) Promulgated December 16, 2015\nPage 49\nUNIT OF COMPETENCY\n:\nPRODUCE RAW DRIED SEAWEED\n\nUNIT CODE\n:"
        },
        "source_text": "AFF622306\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitude\nrequired to conduct pre-cropping activities, prepare\ngrow out farm, plant seaweed propagules, maintain\nseaweed\nfarm,\ncarry\nout\nseaweed\nhealth\nmanagement and harvest mature seaweed.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Conduct pre-\ncropping\nactivities\n1.1 Feasible grow-out site\nis selected based on\nindustry standards\n1.2 Test planting is\nconducted based on\nBFAR FOO\n1.3 Necessary\ndocuments are\nsecured for seaweed\nfarming following\nindustry requirements\n1.4 Capital and other\nresources are\naccessed based on\nfarming requirements\n1.5 Simple project\nproposal is prepared\nfor assistance\n1.1 Site selection\ncriteria:\n•\nBFAR-FOO\n•\nFAO\n•\nSEAFDEC\n•\nUniversity of the\nPhilippine-\nMarine Science\nInstitute (UP-\nMSI)\n•\nSIAP endorsed\nliterature\n•\nHACCP\n•\nPresence of\nhealthy wild\nseaweeds and\nother aquatic\nplants\n1.2 Different tools,\nmaterials and\nequipment for site\nselection\n1.3 Guidelines for test-\nplot\n1.4 Capital and other\nresources\n1.5 Maintenance of\nlinkages/\npartnerships\n1.6 Drawing techniques\n1.7 Parts of project\nproposal\n1.8 Occupational\nHealth and Safety\nStandards\n1.9 Good Aquaculture\nPractices (GAqP)\n1.10 Republic Act 8550\n\n1.1 Demonstratin\ng proper\nhandling of\ntools and\nequipment\n1.2 Selecting\ngrow-out site\n1.3 Conducting\ntest-planting\n1.4 Securing\nnecessary\ndocuments\n1.5 Accessing\ncapital and\nother\nresources\n1.6 Preparing\nsimple project\nproposal\nCoordinating\nskills\n1.7 Drawing skills\n1.8 Mathematical\nskills\n\n--- PDF PAGE 43 ---\nTR – Seaweed Production NC II (New) Promulgated December 16, 2015\nPage 39\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n\nValues:\n• Patience\n• Perseverance\n• Commitment\n• Cost consciousness\n• Honesty\n• Teamwork\n• Time management\n2. Prepare grow\nout farm\n2.1 Boat and engine are\ninspected and tested\nfor functionality\n2.2 Defective boat is\nreported to immediate\nauthority following\nstandard workplace\nprocedures\n2.3 Farm tools materials\nand equipment are\nprepared according to\nwork requirements.\n2.4 Farm structure is\ninstalled and set-up in\naccordance to culture\nmethod selected\n2.5 Measurement\nactivities are done\naccording to farm plan\n2.6 Grazer are controlled\nfollowing established\nfarm practices\n2.1 Basic inspection\nprocedures for boat\nand engine:\n• Gas\n• Leaks\n2.2 Different Types of\nfarm tools,\nmaterials and\nequipment\n2.3 Installation of farm\nstructure\n2.4 Different culture\nmethods\n2.5 Measurement\nactivities\n2.6 Different seaweed\ngrazers\n2.7 Control measures\nfor grazers\n2.1 Inspecting\nand testing\nboat and\nengine\n2.2 Reporting\ndefective boat\n2.3 Preparing\ntools,\nmaterials and\nequipment\n2.4 Installing farm\nstructure\n2.5 Performing\nmeasurement\nactivities\n2.6 Eliminating\nand\ncontrolling\ngrazers\n2.7 Small engine\nrepair skills\n2.8 Using hand\ntools\n2.9 Diving\n2.10 Swimming\n2.11 Calibrating\nskill\n2.12 Reading and\ninterpreting\nmanual\n2.13 Safe keeping\nof equipment\nevery after use\n(housekeeping\nskill)\n2.14 Reading and\ninterpreting,\ndesign lay-out\nand systems\nof grow-out\nareas\n\n--- PDF PAGE 44 ---\nTR – Seaweed Production NC II (New) Promulgated December 16, 2015\nPage 40\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n2.15 Mathematical\nSkills\n3. Plant\nseaweed\npropagules\n3.1 Seaweed species to\nbe planted is identified\naccording to\nseasonality\n3.2 Seaweed propagules\nare acclimatized for\ntemperature and\nsalinity requirements\n3.3 Healthy seaweeds\nare acquired based on\ncross examination\n3.4 Seaweed propagules\nare acquired\naccording to planting\ns