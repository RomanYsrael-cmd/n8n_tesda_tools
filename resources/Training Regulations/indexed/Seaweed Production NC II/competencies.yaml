ing System (GPS) \n11.1.4 \n500k capacity hanging weighing scale \n11.1.5 \n15pax capacity motorized boat \n11.1.6 \n3pax capacity non-motorized wooden \nboat with katig \n11.1.7 \nTwo-way radio \n11.1.8 \nTransistor radio \n11.1.9 \nPPEs \n \nGloves \n \nGoggles \n \nFace mask \n \nSnorkel \n \nBoots \n \nPaddle \n \nFlippers \n \nHat \n \nLife vest \n11.2 Tools \n11.2.1 \nFloaters \n11.2.2 \nKnives/Scissors \n11.2.3 \nAnchor \n11.2.4 \nStainless steel table knife \n11.2.5 \n4” scissor \n11.2.6 \nRechargeable flashlight \n11.2.7 \nBattery flashlight \n11.3 Materials \n11.3.1 \nSeedling \n11.3.2 \nBond Paper \n11.3.3\nPencil\n\n--- PDF PAGE 40 ---\nTR – Seaweed Production NC II (New)                  Promulgated December 16, 2015 \nPage 36 \nVARIABLE \nRANGE \n11.3.4 \nEraser \n11.3.5 \nRuler \n11.3.6 \n100pp record book \n11.3.7 \nClean sacks \n11.3.8 \n50k capacity native bags \n11.3.9 \nNative baskets \n11.3.10 \n1000m soft ties  \n11.3.11 \n#10 (5mm) utility ropes \n11.3.12 \n20L capacity pails \n11.3.13 \nordinary dippers \n11.3.14 \n5x5m canvass/cover \n11.3.15\nBamboo \n12. Handling of propagules \nHandling of propagules may include: \n12.1 Stocking \n12.2 Piling \n12.3 Covering of sargasum/leaves \n12.4 Sprinkling \n12.5\nLoading and unloading\n13. Propagules production data \nPropagules production data may include: \n13.1 Location \n13.2 Date harvested \n13.3 Weight \n13.4\nSpecies\n\n--- PDF PAGE 41 ---\nTR – Seaweed Production NC II (New)                  Promulgated December 16, 2015 \nPage 37"
