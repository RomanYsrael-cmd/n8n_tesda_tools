1 Appropriate \npractice of \npersonal \nhygiene \n2.2 Intra and \nInterpersonal \nskills \n2.3 Communicati\non skills \n2.4 Managing \ngoals and \ntime\n\n--- PDF PAGE 15 ---\nTR – Seaweed Production NC II (New)                  Promulgated December 16, 2015 \nPage 11 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n3. Maintain \nprofessional \ngrowth and \ndevelopment \n3.1  Trainings and career \nopportunities are \nidentified and availed of \nbased on job \nrequirements \n3.2  Recognitions are \nsought/received and \ndemonstrated as proof \nof career advancement \n3.3  Licenses and/or \ncertifications relevant \nto job and career are \nobtained and renewed \n3.1 Work values and \nethics (Code of \nConduct, Code of \nEthics, etc.) \n3.2 Company  \npolicies \n3.3 Company \noperations, \nprocedures and \nstandards  \n3.4 Fundamental \nrights at work \nincluding gender \nsensitivity \n3.5 Personal hygiene \npractices \n3.1 Appropriate \npractice of \npersonal \nhygiene \n3.2 Intra and \nInterpersonal \nskills \n3.3 Communicati\non skills\n\n--- PDF PAGE 16 ---\nTR – Seaweed Production NC II (New)                  Promulgated December 16, 2015 \nPage 12 \nRANGE OF VARIABLES \n \n \nVARIABLE \nRANGE \n1. Evaluation \nMay include: \n1.1 \nPerformance Appraisal \n1.2 \nPsychological Profile \n1.3\nAptitude Tests \n2. Resources \nMay include: \n2.1 \nHuman \n2.2 \nFinancial \n2.3 \nTechnology \n2.3.1 \nHardware \n2.3.2\nSoftware \n3. Trainings and career \nopportunities \nMay include: \n3.1 \nParticipation in training programs \n3.1.1 \nTechnical \n3.1.2 \nSupervisory \n3.1.3 \nManagerial \n3.1.4 \nContinuing Education \n3.2 \nServing as Resource Persons in conferences and \nworkshops \n4. Recognitions \n4.1 \nRecommendations \n4.2 \nCitations \n4.3 \nCertificate of Appreciations \n4.4 \nCommendations \n4.5 \nAwards \n4.6\nTangible and Intangible Rewards \n5. Licenses and/or certifications \n5.1 \nNational Certificates \n5.2 \nCertificate of Competency \n5.3 \nSupport Level Licenses \n5.4\nProfessional Licenses\n\n--- PDF PAGE 17 ---\nTR – Seaweed Production NC II (New)                  Promulgated December 16, 2015 \nPage 13 \nEVIDENCE GUIDE \n \n \n1.  Critical aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 \nAttained job targets within key result areas (KRAs) \n1.2 \nMaintained intra - and interpersonal relationship in \nthe course of managing oneself based on \nperformance evaluation \n1.3 \nCompleted trainings and career opportunities which \nare based on the requirements of the industries \n1.4 \nAcquired and maintained licenses and/or \ncertifications according to the requirement of the \nqualification\n2.  Resource Implications \nThe following resources should be provided: \n2.1 \nWorkplace or assessment location \n2.2\nCase studies/scenarios\n3.  Methods of Assessment \nCompetency in this unit may be assessed through: \n3.1 \nPortfolio Assessment \n3.2 \nInterview \n3.3 \nSimulation/Role-plays \n3.4 \nObservation \n3.5 \nThird Party Reports \n3.6\nExams and Tests \n4.  Context for Assessment \nCompetency may be assessed in the work place or in a \nsimulated work place setting\n",
