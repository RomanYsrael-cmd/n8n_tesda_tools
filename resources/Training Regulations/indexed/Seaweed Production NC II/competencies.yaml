        "source_text": "--- PDF PAGE 32 ---\nTR – Seaweed Production NC II (New)                  Promulgated December 16, 2015 \nPage 28 \nCORE COMPETENCY \n \nUNIT OF COMPETENCY\n:\nOPERATE SEAWEED NURSERY\n \nUNIT CODE\n:\nAFF622305\nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge, skills and attitude to \noperate seaweed nursery. It includes conducting pre-\nnursery activities, sourcing out propagules, planting \npropagules, maintaining seaweed nursery, harvesting\npropagules and carrying-out post-nursery activities.\n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Conduct pre-\nnursery \nactivities \n1.1  Feasible nursery site \nis selected based on \nindustry standards \n1.2  Test planting is \nconducted based on  \nBureau of Fisheries \nand Aquatic \nResources-Fisheries \nOffice Order (BFAR \nFOO) \n1.3  Necessary \ndocuments are \nsecured for nursery \noperation following \nindustry requirements \n1.4  Capital and other \nresources are \naccessed based on \nnursery requirements \n1.5  Simple project \nproposal is prepared \nfor assistance \n1.6  Nursery structure is \ninstalled according to \nplan and design.  \n1.1 Site selection \ncriteria: \n Bureau of \nFisheries and \nAquatic \nResources-\nFisheries \nOffice Order \n(BFAR-FOO) \n Fisheries \nAdministrative \nOrder (FAO) \n SEAFDEC \n University of \nthe Philippines-\nMarine \nScience \nInstitute (UP-\nMSI) \n Seaweed \nIndustry \nAssociation of \nthe Philippines \n(SIAP) \nendorsed \nliterature \n HACCP \n Presence of \nhealthy wild \nseaweeds and \nother aquatic \nplants \n1.2 Test planting \n1.3 Guidelines for \ntest-plot \n1.4 Necessary \ndocuments\n1.1 Selecting \nfeasible nursery \nsite \n1.2 Conducting test \nplanting \n1.3 Securing \nnecessary \ndocuments \n1.4 Accessing \ncapital and other \nresources \n1.5 Preparing simple \nproject proposal \n1.6 Installing nursery \nstructure\n\n---