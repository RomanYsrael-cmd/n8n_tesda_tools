t\n• Performing preventive maintenance\n\n• Simulation\n• Group discussion\n• Practical Lab\n• Demonstration\n\n• Written\nexamination\n• Third party\nreport\n• Demonstration\nwith oral\nquestioning\n2 Hours\n\n5.3 Store tools and\nequipment\n• Storing tools and equipment\n• Handling of tools and equipment\n• Demonstration\n• Group discussion\n• Practical Lab\n• Practical exam\n• Written\nexamination\n• Demonstration\nwith oral\nquestioning\n\n1 Hour\n\n--- PDF PAGE 90 ---\nHEAVY EQUIPMENT OPERATION (Rigid On-Highway Dump Truck) NC II Revision 01 Promulgated (11/07/2019)\n85\nCORE COMPETENCIES\n\n (120 HOURS)\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n1. Perform pre- and\npost-operation\n procedures for\n rigid on-highway\ndump truck\n1.1 Perform visual\n check of rigid\non-highway\ndump truck\n• Select and use of PPE\n• Identify and explain on-highway dump\ntruck [rigid] capacity\n• Identify and explain operator\nserviceable parts\n• Perform inspection while engine is\nstopped/not running\n• Lecture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nwith oral\nquestioning\n16 Hours\n1.2 Perform\n “B L O W A F”\n check\n\n• Explain procedures in performing\nBLOWAF check\n• Perform BLOWAF check\n\n• Lecture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nwith oral\nquestioning\n1.3 Perform\noperation\n check\n\n• Explain start-up and warming\nprocedures\n• Explain procedures in conducting\nfunction check while the engine is\nrunning\n• Perform operation of rigid on-highway\ndump truck components and safety\ndevices\n• Lecture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nwith oral\nquestioning\n\n--- PDF PAGE 91 ---\nHEAVY EQUIPMENT OPERATION (Rigid On-Highway Dump Truck) NC II Revision 01 Promulgated (11/07/2019)\n86\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodologies\n• Assessment\nMethods\nNominal\nDuration\n\n1.4 Perform post-\n operation\n procedure\n•\nExplain inspection procedures while\nengine is cooling down\n•\nExplain how to set controls, parking\nand shut down procedures\n•\nPerform parking and shut-down\noperation\n\n• Lecture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nwith oral\nquestioning\n\n2. Perform basic\npreventive\nmaintenance\nservicing for rigid\non-highway dump\ntruck\n\n2.1 Perform\n adjustment or\n replacement for\n noted defects\n\n• Explain procedures in performing\nadjustments or replacements for noted\ndefects\n• Explain usage of basic hand tools and\nportable powered tools\n• Perform adjustments or replacements\nfor minor defects\n• Lecture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nwith oral\nquestioning\n24 Hours\n2.2 Perform basic\n preventive\n maintenance\n servicing (PMS)\n\n•\nExplain procedures in basic preventive\nmaintenance servicing\n•\nEnumerate Operator’s Serviceable\nparts\n•\nExecute Basic preventive maintenance\nservicing (PMS)\n\n• Lecture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nwith oral\nquestioning\n2.3 Prepare\n equipment\n reports\n\n•\nExplain procedures in accomplishing\nequipment reports\n•\nAccomplish equipment reports\n• Lecture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nwith oral\nquestioning\n\n--- PDF PAGE 92 ---\nHEAVY EQUIPMENT OPERATION (Rigid On-Highway Dump Truck) NC II Revision 01 Promulgated (11/07/2019)\n87\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodologies\n• Assessment\nMethods\nNominal\nDuration\n3. Perform\n productive\noperation for\nrigid on-highway\ndump truck\n\n3.1 Prepare for loading\noperation\n•\nUnderstand safe work\npractices\n•\nExplain and interpret ways of\ncommunication during\nloading operation\n•\nIdentify and explain worksite\nconditions and safe\noperating techniques\n•\nExplain loading procedures\n\n• Lecture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nwith oral\nquestioning\n80 Hours\n3.2 Perform hauling\noperation\n•\nExplain and interpret ways of\ncommunication during\nhauling operation\n•\nIdentify and explain worksite\nconditions and safe\noperating techniques\n•\nExplain hauling procedures\n\n• Lecture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nwith oral\nquestioning\n3.3 Perform dumping\noperation\n\n•\nExplain and interpret ways of\ncommunication during\ndumping operation\n•\nIdentify and explain worksite\nconditions and safe\noperating techniques\n•\nExplain dumping procedures\n\n• Lecture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nwith oral\nquestioning\n\n--- PDF PAGE 93 ---\nHEAVY EQUIPMENT OPERATION (Rigid On-Highway Dump Truck) NC II Revision 01 Promulgated (11/07/2019)\n88\n\n3.2\nTRAINING DELIVERY\n\n1. The delivery of training shall adhere to the design of the curriculum. Delivery shall\nbe guided by the principles of competency-based TVET.\n\na. Course design is based on competency standards set by the industry or\nrecognized industry sector; (Learning system is driven by competencies written\nto industry standards)\n\nb. Training delivery is learner-centered and should accommodate individualized\nand self-paced learning strategies;\n\nc. Training can be done on an actual workplace setting, simulation of a workplace\nand/or through adoption of modern technology.\n\nd. Assessment is based in the collection of evidence of the performance of work to\nthe industry required standards;\n\ne. Assessment of competency takes the trainee’s knowledge and attitude into\naccount but requires evidence of actual performance of the competency as the\nprimary source of evidence.\n\nf. Training program allows for recognition of prior learning (RPL) or current\ncompetencies;\n\ng. Training completion is based on satisfactory performance of all specified\ncompetencies.\n\n2. The competency-based TVET system recognizes various types of delivery modes,\nboth on-and off-the-job as long as the learning is driven by the competency\nstandards specified by the industry. The following training modalities and their\nvariations/components may be adopted singly or in combination with other\nmodalities when designing and delivering training programs:\n\n2.1 Institution-Based:\n\n• Dual Training System (DTS)/Dualized Training Program (DTP) which\ncontain both in-school and in-industry training or fieldwork components.\nDetails can be referred to the Implementing Rules and Regulations of the\nDTS Law and the TESDA Guidelines on the DTP;\n\n• Distance learning is a formal education process in which majority of the\ninstruction occurs when the students and instructor are not in the same\nplace. Distance learning may employ correspondence study, audio,\nvideo, computer technologies or other modern technology that can be\nused to facilitate learning and formal and non-formal training. Specific\nguidelines on this mode shall be issued by the TESDA Secretariat.\n\n•\nThe classroom-based or in-center instruction uses of learner-centered\nmethods as well as laboratory or field-work components.\n\n--- PDF PAGE 94 ---\nHEAVY EQUIPMENT OPERATION (Rigid On-Highway Dump Truck) NC II Revision 01 Promulgated (11/07/2019)\n89\n\n2.1 Enterprise-Based:\n\n• Formal Apprenticeship – Training within employment involving a contract\nbetween an apprentice and an enterprise on an approved apprenticeable\noccupation.\n\n• Informal Apprenticeship - is based on a training (and working) agreement\nbetween an apprentice and a master craftsperson wherein the agreement\nmay be written or oral and the master craftsperson commits to training the\napprentice in all the skills relevant to his or her trade over a significant\nperiod of time, usually between one and four years, while the apprentice\ncommits to contributing productively to the work of the business. Training is\nintegrated into the production process and apprentices learn by working\nalongside the experienced craftsperson.\n\n• Enterprise-based Training- where training is implemented within the\ncompany in accordance with the requirements of the specific company.\nSpecific guidelines on this mode shall be issued by the TESDA Secretariat.\n\n2.2 Community-Based – Community-Based – short term programs\nconducted by non-government organizations (NGOs), LGUs, training\ncenters and other TVET providers which are intended to address the\nspecific needs of a community. Such programs can be conducted in\ninformal settings such as barangay hall, basketball courts, etc. These\nprograms can also be mobile training program (MTP).\n\n3.3 TRAINEE ENTRY REQUIREMENTS\n\n Trainees or students wishing to enroll in this course should possess the following\nrequirements:\n\n• At least Junior High School Level Completer or an Alternative Learning System\n(ALS) Certificate of Completion with grade 10 equivalent holder)\n• Must possess good communication skills\n• Can perform basic mathematical computation\n• Driver’s License (Restriction 2 or 3)\n• Physically fit\n\n--- PDF PAGE 95 ---\nHEAVY EQUIPMENT OPERATION (Rigid On-Highway Dump Truck) NC II Revision 01 Promulgated (11/07/2019)\n90\n3.4 LIST OF TOOLS, EQUIPMENT AND MATERIALS\n\nList of tools, equipment and materials for the training of a maximum of 25 trainees for\nHEAVY EQUIPMENT OPERATION Rigid On-Highway Dump Truck NC II are as\nfollows:\n\nTOOLS\nEQUIPMENT\nMATERIALS\nQTY\n\nQTY\n\nQTY\n\n1 set\nWrenches (box and\nopen-end 8-24 mm-\nmetric & 7/16 –1” -\nEnglish )\n1 unit\nRigid On-Highway\nDump Truck certified\nby Third Party\naccredited by DOLE-\nOSHC\n(MOA / rental)\nWith camera/ monitor for\nreverse mode (optional)\n5 kgs. Multi- purpose grease\n5 pcs.\nHammer ballpeen\n(3 - 4 lbs.)\n2 units Two-way radio\n20\nliters\nEngine oil ( SAE 15w40)\n5 pcs.\nPliers\n(mechanical 10 “)\n1 unit\nVacuum cleaner\n(heavy duty), 220 volts\n20\nliters\nHydrauli