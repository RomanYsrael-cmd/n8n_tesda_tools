d accessories\naccording to the job requirements\n• Lecture-\ndemonstration\n• Group discussion\n• PowerPoint\npresentation\n• Demonstration\nwith oral\nquestioning\n• Written\nexamination\n• Portfolio\n(credentials)\n1 Hour\n\n1.2 Requisition\n materials\n• Preparing material take-off\n• Requesting materials and tools\n• Simulation\n• Discussion\n• Demonstration\nwith oral\nquestioning\n1 Hour\n\n1.3 Receive and\ninspect\nmaterials\n• Checking and inspecting materials and\ntools\n• Storing/ stacking of tool and materials\n• Practical\nExercise\n• Demonstration\n• Written / Oral\nTest\n• Demonstration\nwith oral\nquestioning\n2 Hours\n\n2. Observe\nprocedures,\nspecifications and\nmanuals of\ninstructions\n2.1 Identify and\naccess\nspecification/\nmanuals\n• Identifying manuals and specifications\n• Accessing information and data\n• Lecture-\ndemonstration\n• Demonstration\nwith oral\nquestioning\n• Written\nexamination\n2 Hours\n\n2.2 Interpret\nmanuals\n• Interpreting symbols and specifications\n• Accessing information and data\n• Applying conversion of units of\nmeasurements\n• Actual\ndemonstration\n• Group discussion\n• Demonstration\nwith oral\nquestioning\n• Written\nexamination\n\n2 Hours\n\n--- PDF PAGE 88 ---\nHEAVY EQUIPMENT OPERATION (Rigid On-Highway Dump Truck) NC II Revision 01 Promulgated (11/07/2019)\n83\n\nUnit of Competency\nLearning\nOutcomes\nLearning Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n\n2.3 Apply\ninformation in\nmanual\n• Applying information from manuals\n• Demonstration\n• Group discussion\n• Demonstration\nwith oral\nquestioning\n2 Hours\n\n2.4 Store Manual\n• Storing and maintaining manuals\n• Demonstration\n• Group discussion\n• Demonstration\nwith oral\nquestioning\n• Practical and\noral exam\n2 Hours\n\n3. Interpret technical\ndrawings and plans\n3.1 Analyze signs,\nsymbols and\ndata\n• Identifying signs, symbols and data\n• Classifying signs, symbols and data\n\n• Discussion\n• Demonstration\n• Demonstration\nwith oral\nquestioning\n• Written\nexamination\n2 Hours\n\n3.2 Interpret\ndrawings and\nplans\n• Identifying tools, supplies, materials\nand equipment\n• Recognizing components, assemblies\nor objects\n• Identifying dimensions\n• Discussion\n• Demonstration\n• Demonstration\nwith oral\nquestioning\n• Written\nexamination\n2 Hours\n\n4.Perform mensurations\nand calculations\n4.1 Select\nmeasuring\ninstruments\n\n• Selecting measuring instruments\n• Lecture-\ndemonstration\n• Group discussion\n• Demonstration\nwith oral\nquestioning\n\n2 Hours\n\n4.2 Carry out\nmeasurements\nand calculations\n\n• Interpreting formulas for volume,\nareas, perimeters of plane and\ngeometric figures\n• Handling of measuring instruments\n\n• Group discussion\n• Practical Lab\n• Demonstration\n• Written\nexamination\n• Third party report\n• Demonstration\nwith oral\nquestioning\n2 Hours\n\n--- PDF PAGE 89 ---\nHEAVY EQUIPMENT OPERATION (Rigid On-Highway Dump Truck) NC II Revision 01 Promulgated (11/07/2019)\n84\n\nUnit of Competency\nLearning Outcomes\nLearning Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n5. Maintain tools and\nequipment\n5.1 Check condition\nof tools and\nequipment\n\n• Maintaining tools and equipment\n• Handling of tools and equipment\n• Identifying tools and equipment defects\n• Lecture-\ndemonstration\n• Group discussion\n• Demonstration\nwith oral\nquestioning\n\n1 Hour\n\n5.2 Perform basic\npreventive\nmaintenance\n• Handling of tools and equipment\n• Performing preventive maintenance\n\n• Simulation\n• Group discussion\n• Practical Lab\n• Demonstration\n\n• Written\nexamination\n• Third party\nreport\n• Demonstration\nwith oral\nquestioning\n2 Hours\n\n5.3 Store tools and\nequipment\n• Storing tools and equipment\n• Handling of tools and equipment\n• Demonstration\n• Group discussion\n• Practical Lab\n• Practical exam\n• Written\nexamination\n• Demonstration\nwith oral\nquestioning\n\n1 Hour\n\n--- PDF PAGE 90 ---\nHEAVY EQUIPMENT OPERATION (Rigid On-Highway Dump Truck) NC II Revision 01 Promulgated (11/07/2019)\n85\nCORE COMPETENCIES\n\n (120 HOURS)\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n1. Perform pre- and\npost-operation\n procedures for\n rigid on-highway\ndump truck\n1.1 Perform visual\n check of rigid\non-highway\ndump truck\n• Select and use of PPE\n• Identify and explain on-highway dump\ntruck [rigid] capacity\n• Identify and explain operator\nserviceable parts\n• Perform inspection while engine is\nstopped/not running\n• Lecture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nwith oral\nquestioning\n16 Hours\n1.2 Perform\n “B L O W A F”\n check\n\n• Explain procedures in performing\nBLOWAF check\n• Perform BLOWAF check\n\n• Lecture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nwith oral\nquestioning\n1.3 Perform\noperation\n check\n\n• Explain start-up and warming\nprocedures\n• Explain procedures in conducting\nfunction check while the engine is\nrunning\n• Perform operation of rigid on-highway\ndump truck components and safety\ndevices\n• Lecture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nwith oral\nquestioning\n\n--- PDF PAGE 91 ---\nHEAVY EQUIPMENT OPERATION (Rigid On-Highway Dump Truck) NC II Revision 01 Promulgated (11/07/2019)\n86\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodologies\n• Assessment\nMethods\nNominal\nDuration\n\n1.4 Perform post-\n operation\n procedure\n•\nExplain inspection procedures while\nengine is cooling down\n•\nExplain how to set controls, parking\nand shut down procedures\n•\nPerform parking and shut-down\noperation\n\n• Lecture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nwith oral\nquestioning\n\n2. Perform basic\npreventive\nmaintenance\nservicing for rigid\non-highway dump\ntruck\n\n2.1 Perform\n adjustment or\n replacement for\n noted defects\n\n• Explain procedures in performing\nadjustments or replacements for noted\ndefects\n• Explain usage of basic hand tools and\nportable powered tools\n• Perform adjustments or replacements\nfor minor defects\n• Lecture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nwith oral\nquestioning\n24 Hours\n2.2 Perform basic\n preventive\n maintenance\n servicing (PMS)\n\n•\nExplain procedures in basic preventive\nmaintenance servicing\n•\nEnumerate Operator’s Serviceable\nparts\n•\nExecute Basic preventive maintenance\nservicing (PMS)\n\n• Lecture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nwith oral\nquestioning\n2.3 Prepare\n equipment\n reports\n\n•\nExplain procedures in accomplishing\nequipment reports\n•\nAccomplish equipment reports\n• Lecture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nwith oral\nquestioning\n\n--- PDF PAGE 92 ---\nHEAVY EQUIPMENT OPERATION (Rigid On-Highway Dump Truck) NC II Revision 01 Promulgated (11/07/2019)\n87\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodologies\n• Assessment\nMethods\nNominal\nDuration\n3. Perform\n productive\noperation for\nrigid on-highway\ndump truck\n\n3.1 Prepare for loading\noperation\n•\nUnderstand safe work\npractices\n•\nExplain and interpret ways of\ncommunication during\nloading operation\n•\nIdentify and explain worksite\nconditions and safe\noperating techniques\n•\nExplain loading procedures\n\n• Lecture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nwith oral\nquestioning\n80 Hours\n3.2 Perform hauling\noperation\n•\nExplain and interpret ways of\ncommunication during\nhauling operation\n•\nIdentify and explain worksite\nconditions and safe\noperating techniques\n•\nExplain hauling procedures\n\n• Lecture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nwith oral\nquestioning\n3.3 Perform dumping\noperation\n\n•\nExplain and interpret ways of