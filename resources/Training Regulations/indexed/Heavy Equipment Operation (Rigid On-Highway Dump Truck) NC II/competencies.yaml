        "source_text": "400311211\n\nUNIT DESCRIPTOR\n : This unit covers the skills, knowledge and attitudes to\n\n identify one’s roles and responsibilities as a member of\n\n a team.\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n1. Describe team\nrole and scope\n1.1 The role and\nobjective of the\nteam is identified\nfrom available\nsources of\ninformation\n1.2 Team parameters,\nreporting\nrelationships and\nresponsibilities are\nidentified from\nteam discussions\nand appropriate\nexternal sources\n1.1 Group structure\n1.2 Group development\n1.3 Sources of\ninformation\n1.1 Communicating\nwith others,\nappropriately\nconsistent with\nthe culture of the\nworkplace\n1.2 Developing ways\nin improving work\nstructure and\nperforming\nrespective roles\nin the group or\norganization\n2. Identify one’s role\nand responsibility\nwithin a team\n2.1 Individual roles\nand responsibilities\nwithin the team\nenvironment are\nidentified\n2.2 Roles and\nobjectives of the\nteam is identified\nfrom available\nsources of\ninformation\n2.3 Team parameters,\nreporting\nrelationships and\nresponsibilities are\nidentified based on\nteam discussions\nand appropriate\nexternal sources\n2.1 Team roles and\nobjectives\n2.2 Team structure\nand parameters\n2.3 Team\ndevelopment\n2.4 Sources of\ninformation\n\n2.1 Communicating\nwith others,\nappropriately\nconsistent with\nthe culture of the\nworkplace\n2.2 Developing ways\nin improving work\nstructure and\nperforming\nrespective roles\nin the group or\norganization\n\n--- PDF PAGE 13 ---\nHEAVY EQUIPMENT OPERATION (Rigid On-Highway Dump Truck) NC II Revision 01 Promulgated (11/07/2019)\n8\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n3. Work as a\nteam member\n3.1 Effective and\nappropriate forms\nof communications\nare used and\ninteractions\nundertaken with\nteam members\nbased on\ncompany\npractices.\n3.2 Effective and\nappropriate\ncontributions\nmade to\ncomplement team\nactivities and\nobjectives, based\non workplace\ncontext\n3.3 Protocols in\nreporting are\nobserved based\non standard\ncompany\npractices.\n3.4 Contribute to the\ndevelopment of\nteam work plans\nbased on an\nunderstanding of\nteam’s role and\nobjectives\n\n3.1 Communication\nProcess\n3.2 Workplace\ncommunication\nprotocol\n3.3 Team planning\nand\n decision making\n3.4 Team thinking\n3.5 Team roles\n3.6 Process of team\ndevelopment\n3.7 Workplace\ncontext\n\n3.1 Communicating\nappropriately,\nconsistent with the\nculture of the\nworkplace\n3.2 Interacting\neffectively with\nothers\n3.3 Deciding as an\nindividual and as\na group using\ngroup think\nstrategies and\ntechniques\n3.4 Contributing to\nResolution of\nissues and\nconcerns\n\n--- PDF PAGE 14 ---\nHEAVY EQUIPMENT OPERATION (Rigid On-Highway Dump Truck) NC II Revision 01 Promulgated (11/07/2019)\n9\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Role and objective\nof team\nMay include:\n1.1.\nWork activities in a team environment with\nenterprise or specific sector\n1.2.\nLimited discretion, initiative and judgement\nmaybe demonstrated on the job, either\nindividually or in a team environment\n2. Sources of\ninformation\nMay include:\n2.1.\nStandard operating and/or other workplace\nprocedures\n2.2.\nJob procedures\n2.3.\nMachine/equipment manufacturer’s\nspecifications and instructions\n2.4.\nOrganizational or external personnel\n2.5.\nClient/supplier instructions\n2.6.\nQuality standards\n2.7.\nOHS and environmental standards\n3. Workplace context\nMay include:\n3.1.\nWork procedures and practices\n3.2.\nConditions of work environments\n3.3.\nLegislation and industrial agreements\n3.4.\nStandard work practice including the storage,\nsafe handling and disposal of chemicals\n3.5.\nSafety, environmental, housekeeping and\nquality guidelines\n\n--- PDF PAGE 15 ---\nHEAVY EQUIPMENT OPERATION (R