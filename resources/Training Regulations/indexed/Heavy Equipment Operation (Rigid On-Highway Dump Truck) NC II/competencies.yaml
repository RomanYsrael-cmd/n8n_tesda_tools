        "source_text": "CON834223\n\nUNIT DESCRIPTOR\n\n:\nThis unit involves the knowledge, skills and attitudes\nrequired in cleaning, greasing, adjusting and replacing\noperator-serviceable (OS) parts of rigid on-highway\ndump truck.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nBold and Italicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1. Perform adjustment\nor replacement for\nnoted defects\n\n1.1 Minor defects are\nidentified and\nrepaired/replaced in\naccordance with\nmanufacturer’s\nprocedures.\n1.2 Basic hand tools\nand portable powered\ntools are selected\nbased on job\nrequirements.\n1.3 Major defects are\nidentified using\nchecklist and referred to\nauthorized personnel\nfor action.\n1.4 Personal Protective\nEquipment (PPE) is\nused in accordance\nwith Rule 1080 of\nOccupational Safety\nand Health Standards\n1.5 Required output is\ncompleted based on\naccomplished checklist\n\n1.1 DOLE Department\nOrder No. 13 s.\n1998 Guidelines\nGoverning\nOccupational\nSafety and Health\nin the Construction\nIndustry\n1.2 Waste disposal\nprocedures\n1.3 Volume/ capacity\n1.4 Clearance and\ndistances\n1.5 Types of fluids and\nlubricants\n1.6 Procedures in\nperforming\nadjustments or\nreplacements for\nnoted defects.\n1.7 Types and uses of\nbasic hand tools\nand portable\npowered tools\n1.8 Structure and\nfunction of On-\nHighway Dump\nTruck [rigid]\ncomponents\n1.9 Factors affecting\nproductivity\n1.10 Productivity work\nmeasurements\n1.11 Ways of\nimproving\nproductivity\n1.1 Application of\ndifferent basic\nhand tools and\nportable powered\ntools\n1.2 Applying waste\ndisposal\nprocedures\n1.3 Identifying defects\n1.4 Performing\nadjustments or\nreplacements for\nminor defects\n1.5 Accomplishing\nDETR and\nequipment\nchecklist\n1.6 Using PPE\n1.7 Handling,\nsegregation and\ndisposal of\nhazardous waste\n\n--- PDF PAGE 65 ---\nHEAVY EQUIPMENT OPERATION (Rigid On-Highway Dump Truck) NC II Revision 01 Promulgated (11/07/2019)\n60\n\nELEMENT\nPERFORMANCE\nCRITERIA\nBold and Italicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n2. Perform basic\npreventive\nmaintenance\nservicing (PMS)\n\n2.1 Operator’s\nServiceable parts are\nidentified and serviced\naccording to\nmanufacturer’s\nrecommendations.\n2.2 Standard parameters\nare checked according\nto manufacturer’s\nrecommendations.\n2.3 Fluids and lubricants\nare used based on\nmanufacturer’s manual.\n2.4 Basic hand tools,\nportable powered tools\nand consumable\nmaterials are identified\nand used in\naccordance with job\nrequirements.\n2.5 Basic preventive\nmaintenance\nservicing (PMS) is\ncarried out in\naccordance with\nmanufacturer’s and\nsite regulations\n2.6 Site conditions are\nconsidered during PMS\n2.7 PPE is used in\naccordance with Rule\n1080 of Occupational\nSafety and Health\nStandards\n2.8 Required output is\ncompleted based on\naccomplished checklist\n\n2.1 Understanding\nOperator’s\nMaintenance\nManual (OMM)\n2.2 DOLE Department\nOrder No. 13 s.\n1998 Guidelines\nGoverning\nOccupational\nSafety and Health\nin the Construction\nIndustry\n2.3 Site and weather\nconditions\n2.4 Waste disposal\nprocedures\n2.5 Volume/ capacity\n2.6 Clearance and\ndistances\n2.7 Types of fluids and\nlubricants\n2.8 Procedures in\nbasic preventive\nmaintenance\nservicing\n2.9 Types and uses of\nbasic hand tools\nand portable\npowered tools\n2.10 Factors affecting\nproductivity\n2.11 Productivity work\nmeasurements\n2.12 Ways of\nimproving\nproductivity\n2.1 Performing basic\npreventive\nmaintenance\nservicing (PMS)\n2.2 Application of\nbasic hand tools\nand portable\npowered tools\n2.3 Application of\nfluids and\nlubricants\n2.4 Handling,\nsegregation and\ndisposal of\nhazardous waste\n2.5 Using PPE\n2.6 Accomplishing\nDETR and\nequipment\nchecklist\n2.7 Applying\nproductive\nmethods and\ntechniques\n\n--- PDF PAGE 66 ---\nHEAVY EQUIPMENT OPERATION (Rigid On-Highway Dump Truck) NC II Revision 01 Promulgated (11/07/2019)\n61\n\nELEMENT\nPERFORMANCE\nCRITERIA\nBold and Italicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n3. Prepare equipment\nreports\n\n3.1 Equipment checklist is\naccomplished in\naccordance with\nmanufacturer’s/\ncompany requirements.\n3.2 Equipment defects are\nreported to authorized\npersonnel.\n3.3 Document control\nprocedures is observed\nbased on company\nrequirements\n3.4 PPE is used in\naccordance with Rule\n1080 of Occupational\nSafety and Health\nStandards\n\n3.1 Completion of\nchecklist and\ndefects reports\n3.2 Document control\nprocedures\n3.3 DOLE\nDepartment\nOrder No. 13 s.\n1998 Guidelines\nGoverning\nOccupational\nSafety and Health\nin the\nConstruction\nIndustry\n\n3.1 Accomplishing\nequipment checklist\n(DETR)\n3.2 Using PPE\n\n--- PDF PAGE 67 ---\nHEAVY EQUIPMENT OPERATION (Rigid On-Highway Dump Truck) NC II Revision 01 Promulgated (11/07/2019)\n62\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Minor defects\n\nMay include:\n1.1 Weak battery\n1.2 Tire inflation/Tire air pressure\n1.3 Belt tension\n1.4 Clogged air cleaner\n1.5 Defective radiator cap\n2. Basic hand tools\nand portable\npowered tools\nMay include:\n2.1 Hand tools\n 2.1.1 Wrenches\n 2.1.2 Pliers\n 2.1.3 Brush (steel, paint)\n 2.1.4 Grease gun\n 2.1.5 Hammer (ball-peen, rubber, test)\n 2.1.6 Vice grip\n 2.1.7 Meter tape\n 2.1.8 Screw driver (Philips and flat tip)\n 2.1.9 Tire gauge (instrument)\n2.2 Portable Powered Tools\n2.1.1 High pressure washer\n2.3 Air compressor\n3. Major defects\n\nMay include:\n3.1 Weak brakes\n3.2 Hard starting engine\n3.3 Excessive engine oil consumption\n3.4 Leakage on\n 3.4.1 Air\n 3.4.2 Fuel\n 3.4.3 Cooling\n 3.4.4 Fluid\n3.5 Damaged/broken pulley\n3.6 Engine low power\n3.7 Smoke belching\n3.8 Defective electrical components\n 3.8.1 Charging\n 3.8.2 Lighting\n 3.8.3 Starting\n 3.8.4 Monitoring/gauges\n4 Authorized\npersonnel\n\nMay include:\n4.1 Equipment supervisor\n4.2 Equipment Dispatcher/Foreman\n4.3 Equipment Maintenance personnel\n\n--- PDF PAGE 68 ---\nHEAVY EQUIPMENT OPERATION (Rigid On-Highway Dump Truck) NC II Revision 01 Promulgated (11/07/2019)\n63\nVARIABLE\nRANGE\n5 Operator\nserviceable (OS)\nparts\n\nMay include:\n5.1 Battery clamps, Battery distilled water\n5.2 Belts\n5.3 Filters\n5.3.1 Air cleaner\n5.3.2 Water fuel separator/drain valve\n5.3.3 Hydraulic filter\n5.3.4 Fuel filter\n5.4 All fluid caps\n5.5 All grease points and fittings\n5.6 Tire inflation\n6. Standard\nparameters\nMay include:\n6.1 Oil pressure\n6.2 Air pressure\n6.3 Water temperatures\n6.4 Belt tension\n6.5 Tire pressure\n\n7. Fluids and\nlubricants\nMay include:\n7.1 Engine oil\n7.2 Hydraulic oil\n7.3 Brake fluid\n7.4 Grease\n7.5 Coolant\n7.6 Battery solutions/Battery electrolyte/distilled water\n7.7 Transmission/Torque converter oil\n7.8 Fuel\n7.9 Differential oil\n7.10 Power steering oil\n8. Basic preventive\nmaintenance\nservicing\nMay include:\n8.1 Check battery clamps\n8.2 Check fan belt conditions (cracked or worn-out)\n8.3 Cleaning the unit\n8.4 Clean/Replace filters\n 8.4.1 Air cleaner\n 8.4.2 Water separator\n 8.4.3 Hydraulic filter\n 8.4.4 Fuel filter\n8.5 Replace defective fluid caps\n8.6 Grease all fittings on lube points\n8.7 Tire inflation/Tire Air Pressure\n9. Site regulations\nMay include:\n9.1 Instructions\n9.2 Signages\n9.3 Work schedules\n9.4 Work bulletin boards\n9.5 Charts\n9.6 Memos\n9.7 Site Map\n9.8 Emergency response plan\n9.9 Permits\n\n--- PDF PAGE 69 ---\nHEAVY EQUIPMENT OPERATION (Rigid On-Highway Dump Truck) NC II Revision 01 Promulgated (11/07/2019)\n64\nVARIABLE\nRANGE\n10. Site conditions\nMay include:\n10.1 Dusty\n10.2 Windy\n10.3 Sunny\n10.4 Rainy\n10.5 Crowded\n10.3 Terrain (muddy and slippery)\n\n--- PDF PAGE 70 ---\nHEAVY EQUIPMENT OPERATION (Rigid On-Highway Dump Truck) NC II Revision 01 Promulgated (11/07/2019)\n65\nEVIDENCE GUIDE\n\n1. Critical aspects\nof competency\n\nAssessment requires evidence that the candidate:\n1.1 Performed adjustment or replacement for noted minor defects\n1.2 Perform basic preventive maintenance servicing (PMS)\n1.3 Prepare equipment reports\n1.4 Observed safety measures applicable to worksite operation\n1.5 Communicated effectively with others to ensure effective work\noperation\n2. Resource\nimplications\n\nThe following resources should be provided:\n2.1 Access to On-Highway Dump Truck [rigid] and manuals\n2.2 Basic hand tools and portable powered tools\n2.3 Fluids and lubricants\n2.4 PPE\n2.5 Safety signage’s/barricades\n3. Method of\nassessment\n\nCompetency in this unit may be assessed through:\n3.1 Written examination\n3.2 Direct observation/Demonstration with oral questioning\n4. Context for\nassessment\n4.1 Competency may be assessed in actual workplace or at the\ndesignated TESDA Accredited Assessment Center\n\n--- PDF PAGE 71 ---\nHEAVY EQUIPMENT OPERATION (Rigid On-Highway Dump Truck) NC II Revision 01 Promulgated (11/07/2019)\n66\n UNIT OF COMPETENCY :\nPERFORM PRODUCTIVE OPERATION FOR RIGID\nON-HIGHWAY DUMP TRUCK\n\nUNIT CODE\n\n:"
