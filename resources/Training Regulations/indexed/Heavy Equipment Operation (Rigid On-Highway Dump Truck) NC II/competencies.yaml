2 Geometrical\nmeasurement\n2.2 Trade\nMathematics\n2.2.1 Unit\nconversion\n2.2.2 Ratio and\nproportion\n2.3 Area\n\n2.1 Interpreting\nformulas for\nvolume, areas,\nperimeters of\nplane and\ngeometric figures\n2.2 Handling of\nmeasuring\ninstruments\n\n--- PDF PAGE 50 ---\nHEAVY EQUIPMENT OPERATION (Rigid On-Highway Dump Truck) NC II Revision 01 Promulgated (11/07/2019)\n45\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Geometric shape\n\n May include:\n1.1 Round\n1.2 Square\n1.3 Rectangular\n1.4 Triangle\n1.5 Sphere\n1.6 Conical\n2. Measuring\n instruments\nMay include:\n2.1 Micrometer (In-out, depth)\n2.2 Vernier caliper (out, inside)\n2.3 Thickness gauge\n2.4 Torque gauge\n2.5 Small hole gauge\n2.6 Try-square\n2.7 Protractor\n2.8 Steel ruler\n2.9 Voltmeter\n2.10 Ammeter\n2.11 Gauges\n2.12 Thermometers\n3. Measurements\nand calculations\nMay include:\n3.1 Linear\n3.2 Volume\n3.3 Area\n3.4 Wattage\n3.5 Voltage\n3.6 Amperage\n3.7 Inside diameter\n3.8 Length\n3.9 Thickness\n3.10 Outside diameter\n3.11 Density\n\n--- PDF PAGE 51 ---\nHEAVY EQUIPMENT OPERATION (Rigid On-Highway Dump Truck) NC II Revision 01 Promulgated (11/07/2019)\n46\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires that the candidate:\n1.1 Selected and prepared appropriate measuring instruments in\naccordance with job requirements\n1.2 Performed measurements and calculations according to job\nrequirements/ ISO\n2. Resource\nimplications\nThe following resources should be provided:\n2.1 Workplace location\n2.2 Problems to solve\n2.3 Measuring instrument appropriate to carry out tasks\n2.4 Instructional materials relevant to the propose activity\n3. Methods of\nassessment\nCompetency in this unit may be assessed through:\n3.1 Direct observation/Demonstration with Oral Questioning\n4. Context of\nassessment\n 4.1 Competency may be assessed in actual workplace or at the\ndesignated TESDA Accredited Assessment Center\n\n--- PDF PAGE 52 ---\nHEAVY EQUIPMENT OPERATION (Rigid On-Highway Dump Truck) NC II Revision 01 Promulgated (11/07/2019)\n47\n\nUNIT OF COMPETENCY\n:\n MAINTAIN TOOLS AND EQUIPMENT\n\nUNIT CODE\n\n:"
