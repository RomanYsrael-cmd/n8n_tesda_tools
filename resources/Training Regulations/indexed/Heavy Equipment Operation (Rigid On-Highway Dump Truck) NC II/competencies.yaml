        "evidence_guide": {
          "source_text": "1. Critical aspects\nof competency\n\nAssessment requires evidence that the candidate:\n1.1 Performed visual check of on-highway dump truck (rigid)\n1.2 Performed “BLOWAF” check\n1.3 Performed operation check\n1.4 Performed post operation procedures\n1.5 Observed safety measures applicable to worksite operation\n1.6 Communicated effectively with others to ensure effective work\noperation\n2. Resource\nimplications\n\nThe following resources should be provided:\n2.1 Work area for on-highway dump truck (rigid) operation\n2.2 Access to on-highway dump truck (rigid) and manuals\n2.3 Basic hand tools and portable powered tools\n2.4 PPE\n2.5 Safety signage/barricades\n3. Method of\nassessment\n\nCompetency in this unit may be assessed through:\n3.1 Written examination\n3.2 Direct observation/Demonstration with oral questioning\n4. Context for\nassessment\n4.1 Competency may be assessed in actual workplace or at the\ndesignated TESDA Accredited Assessment Center\n\n--- PDF PAGE 64 ---\nHEAVY EQUIPMENT OPERATION (Rigid On-Highway Dump Truck) NC II Revision 01 Promulgated (11/07/2019)\n59\nUNIT OF COMPETENCY\n:\nPERFORM BASIC PREVENTIVE MAINTENANCE\nSERVICING FOR RIGID ON-HIGHWAY DUMP\nTRUCK\n\nUNIT CODE\n\n:"
        },
        "source_text": "CON834222\n\nUNIT DESCRIPTOR\n\n: This unit covers the knowledge, skills and attitudes\n\n in performing visual and operation check before and\n after productive operation of rigid on-highway dump\n truck.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are elaborated\nin the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1. Perform visual check\nof rigid on-highway\ndump truck\n\n1.1\nCapacity of rigid on-\nhighway dump truck\nis selected based on\njob requirements\n1.2\nOperator-\nserviceable (OS)\nparts are checked in\naccordance with\nequipment checklist\nand manufacturer’s\nprocedures\n1.3\nInspection is\nperformed with\nequipment checklist\nand with engine\nstopped/not running\n1.4\nPersonal Protective\nEquipment (PPE) is\nused in accordance\nwith Rule 1080\nOccupational Safety\nand Health Standards\n1.5\nRequired output is\ncompleted based on\naccomplished\nchecklist\n1.1 DOLE\nDepartment Order\nNo. 13 s. 1998\nGuidelines\nGoverning\nOccupational\nSafety and Health\nin the\nConstruction\nIndustry\n1.2 Procedures in\nconducting visual\ncheck\n1.3 Determining\ndump box\ncapacity of rigid\non-highway dump\ntruck\n1.4 Functions of parts\nand components\nof rigid on-\nhighway dump\ntruck\n1.5 Factors affecting\nproductivity\n1.6 Productivity work\nmeasurements\n1.7 Ways of\nimproving\nproductivity\n\n1.1 Following visual\nand inspection\nprocedures\n1.2 Determining dump\nbox capacity\n1.3 Identifying parts\nand functions\n1.4 Accomplishing\nequipment\nchecklist\n1.5 Using PPE\n1.6 Applying\nproductive\nmethods and\ntechniques\n\n--- PDF PAGE 57 ---\nHEAVY EQUIPMENT OPERATION (Rigid On-Highway Dump Truck) NC II Revision 01 Promulgated (11/07/2019)\n52\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are elaborated\nin the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n2. Perform\n “B L O W A F”\n check\n\n2.1 “BLOWAF” check is\nperformed using\nchecklist with engine\nstopped/not running.\n2.2 Fluid levels are\nmaintained in\naccordance with\nequipment\nmaintenance manual.\n2.3 Abnormal conditions\nnoted in checklist and\nreported to authorized\nperson.\n2.4 PPE is used in\naccordance with Rule\n1080 of Occupational\nSafety and Health\nStandards\n2.5 Required output is\ncompleted based on\naccomplished checklist\n2.1 Procedures in\nperforming\n“BLOWAF” check\n2.2 DOLE Department\nOrder No. 13 s.\n1998 Guidelines\nGoverning\nOccupational\nSafety and Health\nin the Construction\nIndustry\n2.3 Waste disposal\nprocedures\n2.4 Fluid’s level and\ncontamination\n2.5 Factors affecting\nproductivity\n2.6 Productivity work\nmeasurements\n2.7 Ways of improving\nproductivity\n\n2.1 Accomplishing\nequipment\nchecklist\n2.2 Applying waste\ndisposal\nprocedures\n2.3 Following\n“BLOWAF”\nchecking\nprocedures\n2.4 Determining fluid\nlevel and\ncontamination\n2.5 Using PPE\n2.6 Applying\nproductive\nmethods and\ntechniques\n\n--- PDF PAGE 58 ---\nHEAVY EQUIPMENT OPERATION (Rigid On-Highway Dump Truck) NC II Revision 01 Promulgated (11/07/2019)\n53\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are elaborated\nin the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n3. Perform operation\ncheck\n\n3.1 Starting/running\ncheck is performed\nwith checklist and in\naccordance with\nmanufacturer’s\nrecommendations\n3.2 Mechanical\ncomponents are\nchecked for normal\nfunctioning based on\nmanufacturer's\nspecifications\n3.3 Safety devices are\nchecked for proper\nfunctions in accordance\nwith safe operating\nprocedures\n3.4 PPE is used in\naccordance with Rule\n1080 of Occupational\nSafety and Health\nStandards\n3.5 Required output is\ncompleted based on\naccomplished checklist\n3.1 Start-up and\nwarming\nprocedures\n3.2 Procedures in\ninspection while the\nengine is running\n3.3 DOLE Department\nOrder No. 13 s.\n1998 Guidelines\nGoverning\nOccupational\nSafety and Health\nin the Construction\nIndustry\n3.4 Warning signs and\nsymbols\n3.5 Functions of all\ncomponents and\nsafety devices\n3.6 Factors affecting\nproductivity\n3.7 Productivity work\nmeasurements\n3.8 Ways of improving\nproductivity\n\n3.1 Accomplishing\nequipment\nchecklist\n3.2 Following\ninspection\nprocedures while\nthe engine is\nrunning\n3.3 Testing of rigid\non-highway dump\ntruck\n3.4 Using PPE\n3.5 Applying\nproductive\nmethods and\ntechniques\n\n4. Perform post-\noperation\nprocedures\n4.1 Rigid on-highway dump\ntruck is parked and\nturned off after\nproductive operation in\naccordance to\nmanufacturer’s manual\n4.2 Controls are set into\nneutral position and\nparking brakes are\nengaged in accordance\nto manufacturer’s\nmanual\n4.3 Safety locks and brakes\nare all engaged in\naccordance\nmanufacturer’s manual\n4.4 Inspection is re-\nconducted while doing\nengine cool down\n\n4.1 Company rules\nand regulations\n4.2 Parking and shut-\ndown procedures\n4.3 DOLE Department\nOrder No. 13 s.\n1998 Guidelines\nGoverning\nOccupational\nSafety and Health\nin the Construction\nIndustry\n4.4 Factors affecting\nproductivity\n4.5 Productivity work\nmeasurements\n4.6 Ways of improving\nproductivity\n\n4.1 Accomplishing\nDETR and\nequipment\nchecklist\n4.2 Following rules\nand regulations in\nparking and\nshutting rigid on-\nhighway dump\ntruck Performing\npost-operation\nprocedures\n4.3 Using PPE\n4.4 Applying\nproductive\nmethods and\ntechniques\n\n--- PDF PAGE 59 ---\nHEAVY EQUIPMENT OPERATION (Rigid On-Highway Dump Truck) NC II Revision 01 Promulgated (11/07/2019)\n54\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are elaborated\nin the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n4.5 Daily equipment time\nrecord/report (DETR) is\naccomplished/ submitted\naccording to company\nrules and regulations\n4.6 PPE is used in\naccordance with Rule\n1080 of Occupational\nSafety and Health\nStandards\n4.7 Required output is\ncompleted based on\naccomplished checklist\n\n--- PDF PAGE 60 ---\nHEAVY EQUIPMENT OPERATION (Rigid On-Highway Dump Truck) NC II Revision 01 Promulgated (11/07/2019)\n55\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Capacity of rigid\non-highway\ndump truck\nMay include:\n1.1 2 to 5 cubic meters\n1.2 6 to 10 cubic meters\n1.3 11 to 15 cubic meters\n1.4 16 to 20 cubic meters\n1.5 21 to 25 cubic meters\n\n2. Operator\nserviceable parts\n(OS)\n\nMay include:\n2.4 Air cleaner\n2.5 Battery terminals/connection/clamp/case\n2.6 Fan belt\n2.7 Grease/lube points\n2.8 Fuel water separator/radiator\n2.9 Tire inflation\n2.10 Fuel tank\n2.11 Hydraulic and brake master cylinder\n2.12 Engine oil fan\n2.13 Lights\n2.14 Steering/suspension\n3. Inspection\n\nMay include:\n3.1 Engine off\n3.1.1 Leaks\n3.1.2 Worn out/damaged parts\n3.1.3 Fluid levels\n 3.1.4 Loose parts and accessories (nuts/bolts/belts)\n 3.1.5 Missing parts and accessories\n\n 3.2 Engine on\n3.2.1 Gauges and controls\n3.2.2 Safety devices\n3.2.3 Oil and air leaks\n3.2.4 Levers and controls\n 3.2.4.1 Steering wheels\n 3.2.4.2 Pedals\n 3.2.4.3 Hand brake\n 3.2.4.4 Power Take-off (PTO)\n 3.2.5 Electrical lighting system\n 3.2.6 Horn\n 3.3 Early warning devices\n 3.4 Spare tire\n\n--- PDF PAGE 61 ---\nHEAVY EQUIPMENT OPERATION (Rigid On-Highway Dump Truck) NC II Revision 01 Promulgated (11/07/2019)\n56\nVARIABLE\nRANGE\n4. Personal\nProtective\nEquipment\n(PPE)\nMay include:\n4.1 Hard hat\n4.2 Goggles\n4.3 Gloves\n4.4 Safety shoes\n4.5 Safety vest\n5. B L O W A F\ncheck\n\nMay include:\n5.1 Battery (starting and charging system)\n5.2 Light (lighting system)\n5.3 Oil (lubricating system)\n5.4 Water (cooling system)\n5.5 Air (intake and exhaust system)\n5.6 Fuel (fuel system)\n6. Fluid\nMay include:\n6.1 Engine oil\n6.2 Hydraulic oil\n6.3 Radiator coolant/radiator\n6.4 Battery electrolyte/distilled water\n6.5 Brake/clutch fluid\n6.6 Transmission/Gear oil\n6.7 Steering oil\n6.8 Fuel\n6.9 Torque converter oil\n6.10 Automatic transmission fluid\n7. Authorized\nperson\nMay include:\n7.1 Equipment Supervisor\n7.2 Equipment Dispatcher/Foreman\n7.3 Equipment Maintenance personnel\n\n--- PDF PAGE 62 ---\nHEAVY EQUIPMENT OPERATION (Rigid On-Highway Dump Truck) NC II Revision 01 Promulgated (11/07/2019)\n57\nVARIABLE\nRANGE\n8. Starting/running\ncheck/operation\ncheck\n\nMay include:\n8.1 Controls\n8.1.1 PTO\n8.1.2 Brakes\n8.1.3 Travel\n8.1.4 Steering\n8.2 Gauges\n 8.2.1 Hour meter\n 8.2.2 Battery charging\n 8.2.3 Pressure (oil and air)\n 8.2.4 Temperature (oil and water)\n 8.2.5 RPM (Tachometer)\n 8.2.6 Fuel indicator\n 8.2.7 Speedometer\n8.3 Leaks in\n 8.3.1 Fuel\n 8.3.2 Water\n 8.3.3 Oil\n 8.3.4 Air\n8.4 Electrical/switches\n 8.4.1 Lights\n 8.4.2 Horns\n 8.4.3 Wiper\n\n9. Mechanical\ncomponents\nMay include:\n9.1\nBrakes\n9.2\nSteering\n9.3\nPower Take-off (PTO)\n9.4\nTires\n9.5\nDump box\n9.6\nDump box cylinder\n9.7\nChassis\n9.8\nTransmission\n9.9\nClutch\n9.10 Differential\n\n10. Safety devices\nMay include:\n10.1 Back horn/warning horn\n10.2 Signal/stop light\n10.3 Blinkers\n10.4 Seat belt\n10.5 Parking brake\n10.6 Dump body sensor\n\n--- PDF PAGE 63 ---\nHEAVY EQUIPMENT OPERATION (Rigid On-Highway Dump Truck) NC II Revision 01 Promulgated (11/07/2019)\n58\nEVIDENCE GUIDE\n\n1. Critical aspects\nof competency\n\nAssessment requires evidence that the candidate:\n1.1 Performed visual check of on-highway dump truck (rigid)\n1.2 Performed “BLOWAF” check\n1.3 Performed operation check\n1.4 Performed post operation procedures\n1.5 Observed safety measures applicable to worksite operation\n1.6 Communicated effectively with others to ensure effective work\noperation\n2. Resource\nimplications\n\nThe following resources should be provided:\n2.1 Work area for on-highway dump truck (rigid) operation\n2.2 Access to on-highway dump truck (rigid) and manuals\n2.3 Basic hand tools and portable powered tools\n2.4 PPE\n2.5 Safety signage/barricades\n3. Method of\nassessment\n\nCompetency in this unit may be assessed through:\n3.1 Written examination\n3.2 Direct observation/Demonstration with oral questioning\n4. Context for\nassessment\n4.1 Competency may be assessed in actual workplace or at the\ndesignated TESDA Accredited Assessment Center\n\n--- PDF PAGE 64 ---\nHEAVY EQUIPMENT OPERATION (Rigid On-Highway Dump Truck) NC II Revision 01 Promulgated (11/07/2019)\n59\nUNIT OF COMPETENCY\n:\nPERFORM BASIC PREVENTIVE MAINTENANCE\nSERVICING FOR RIGID ON-HIGHWAY DUMP\nTRUCK\n\nUNIT CODE\n\n:"
