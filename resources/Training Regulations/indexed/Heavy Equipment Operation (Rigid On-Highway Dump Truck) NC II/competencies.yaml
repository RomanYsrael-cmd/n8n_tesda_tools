ter.\n1.1 Opportunities for\nimprovement are\nidentified\nproactively in own\narea of work.\n1.2 Information are\ngathered and\nreviewed which\nmay be relevant to\nideas and which\nmight assist in\ngaining support for\nidea.\n1.1 Roles of individuals\nin suggesting and\nmaking\nimprovements.\n1.2 Positive impacts\nand challenges in\ninnovation.\n1.3 Types of changes\nand responsibility.\n1.4 Seven habits of\nhighly effective\npeople.\n\n1.1 Identifying\nopportunities to\nimprove and to do\nthings better.\nInvolvement.\n1.2 Identifying the\npositive impacts\nand the challenges\nof change and\ninnovation.\n1.3 Identifying\nexamples of the\ntypes of changes\nthat are within and\noutside own scope\nof responsibility\n2. Discuss and\ndevelop ideas\nwith others\n2.1 People who could\nprovide input to\nideas for\nimprovements are\nidentified.\n2.2 Ways of\napproaching\npeople to begin\nsharing ideas are\nselected.\n2.3 Meeting is set with\nrelevant people.\n2.4 Ideas for follow up\nare review and\nselected based on\nfeedback.\n2.5 Critical inquiry\nmethod is used to\ndiscuss and\ndevelop ideas with\nothers.\n2.1 Roles of individuals\nin suggesting and\nmaking\nimprovements.\n2.2 Positive impacts\nand challenges in\ninnovation.\n2.3 Types of changes\nand responsibility.\n2.4 Seven habits of\nhighly effective\npeople.\n\n2.1 Identifying\nopportunities to\nimprove and to do\nthings better.\nInvolvement.\n2.2 Identifying the\npositive impacts\nand the challenges\nof change and\ninnovation.\n2.3 Providing examples\nof the types of\nchanges that are\nwithin and outside\nown scope of\nresponsibility\n2.4 Communicating\nideas for change\nthrough small\ngroup discussions\nand meetings.\n\n--- PDF PAGE 24 ---\nHEAVY EQUIPMENT OPERATION (Rigid On-Highway Dump Truck) NC II Revision 01 Promulgated (11/07/2019)\n19\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n3. Integrate\nideas for\nchange in