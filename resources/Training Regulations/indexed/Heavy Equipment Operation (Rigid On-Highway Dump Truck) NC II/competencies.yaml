        "evidence_guide": {
          "source_text": "1. Critical aspects of\ncompetency to be\nconsidered\nAssessment must confirm evidence that the candidate:\n1.1 Prepared for loading operation\n1.2 Performed hauling operation\n1.3 Performed dumping operation\n1.4 Observed safety measures applicable to worksite operation\n1.5 Communicated effectively with others to ensure effective work\noperation\n2. Resource\nimplications\nThings necessary for the conduct of assessment\n2.1. Access to dump truck and job site/terrain\n2.2. Operation and maintenance manual\n2.3. Available loads\n2.4. PPE\n2.5. Spotter\n2.6 Safety signage’s/barricades\n\n3. Method of\nassessment\nCompetency in this unit may be assessed through:\n3.1 Written examination\n3.2 Direct observation/Demonstration with oral questioning\n4. Context for\nassessment\n4.1 Competency may be assessed in actual workplace or at the\ndesignated TESDA Accredited Assessment Center\n\n--- PDF PAGE 77 ---\nHEAVY EQUIPMENT OPERATION (Rigid On-Highway Dump Truck) NC II Revision 01 Promulgated (11/07/2019)\n72"
        },
        "source_text": "CON834224\n\nUNIT DESCRIPTOR :\nThis unit deals with the knowledge, skills and attitude\nrequired for preparing for loading operation, performing\nhauling and dumping operation for rigid on-highway\ndump truck.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nBold and Italicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1. Prepare for loading\noperation\n\n1.1 Safe work practices\nare observed in\n accordance with\ncompany rules and\nregulations\n1.2 Communication is\nestablished with the\nstation during operation.\n1.3 Positioning of rigid on-\nhighway dump truck is\nobserved at the loading\narea\n1.4 Required control\nlevers are applied\naccording to\n operations manual.\n1.5 Engine is set at low idle\nspeed while waiting /\nloading operation\n1.6 Unexpected situations\nare responded in line\n with company rules\n and regulations\n1.7 PPE is used in\naccordance with Rule\n1080 of Occupational\nSafety and Health\nStandards\n\n1.1 DOLE\nDepartment\nOrder No. 13 s.\n1998 Guidelines\nGoverning\nOccupational\nSafety and Health\nin the\nConstruction\nIndustry\n1.2 Traffic rules and\nregulations\n1.3 Site and weather\nconditions\n1.4 Road worthiness\n1.5 Clearance and\ndistances\n1.6 Speed limit\n1.7 Procedures in\noperating,\ntravelling of rigid\non-highway dump\ntruck\n1.8 Factors affecting\nproductivity\n1.9 Productivity work\nmeasurements\n1.10\nWays of\nimproving\nproductivity\n1.1 Following safe\nwork practices\n1.2 Positioning/\nmaneuvering\nhighway dump\ntruck\n1.3 Using PPE\n\n--- PDF PAGE 72 ---\nHEAVY EQUIPMENT OPERATION (Rigid On-Highway Dump Truck) NC II Revision 01 Promulgated (11/07/2019)\n67\n\nELEMENT\nPERFORMANCE\nCRITERIA\nBold and Italicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n2. Perform hauling\noperation\n2.1 Communication is\nmaintained with the\nstation during operation\n2.2 Worksite conditions\nand safe operating\ntechniques are\nidentified according to\nsafe operating practices\n2.3 Traffic rules and\nregulations are\nobserved\n2.4 Retarder /exhaust brake\nis applied with allowable\nspeed prior to downhill\noperation\n2.5 Engine RPM and\nrequired travel speed is\nobserved according to\nwork site condition\n2.6 Brake is applied based\non the situation\n2.7 Power take-off switch is\ndisengaged during\noperations\n2.8 Differential and inter\naxle lock are engaged\nand disengaged\naccording to terrain\nconditions\n2.9 PPE is used in\naccordance with Rule\n1080 of Occupational\nSafety and Health\nStandards\n\n2.1 DOLE\nDepartment\nOrder No. 13 s.\n1998 Guidelines\nGoverning\nOccupational\nSafety and Health\nin the\nConstruction\nIndustry\n2.2 Hand signals\n2.3 Traffic rules and\nregulations\n2.4 Site and weather\nconditions\n2.5 Clearance and\ndistances\n2.6 Hauling operation\nprocedures\n2.7 Factors affecting\nproductivity\n2.8 Productivity work\nmeasurements\n2.9 Ways of\nimproving\nproductivity\n2.1 Perform hauling\noperation\nprocedures of rigid\non-highway dump\ntruck\n2.2 Interpreting and\nfollowing hand\nsignals, traffic\nrules and\nregulation\n2.3 Using PPE\n\n--- PDF PAGE 73 ---\nHEAVY EQUIPMENT OPERATION (Rigid On-Highway Dump Truck) NC II Revision 01 Promulgated (11/07/2019)\n68\n\nELEMENT\nPERFORMANCE\nCRITERIA\nBold and Italicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n3. Perform dumping\noperation\n\n3.1. Communication is\nmaintained with the\nstation during\noperation.\n3.2. Illumination of dumpsite\nis checked in line\n with site conditions\n3.3. Assistance from spotter\nis obtained when\nrequired\n3.4. Dumping operation is\nperformed following\nestablished /\nrecommended\nprocedures\n3.5. PPE is used in\naccordance with\nwith Rule 1080 of\nOccupational Safety\nand Health Standards\n\n3.1\nDOLE\nDepartment\nOrder No. 13 s.\n1998\nGuidelines\nGoverning\nOccupational\nSafety and\nHealth in the\nConstruction\nIndustry\n3.2\nHand signals or\nradio\n3.3\nConversion of\nunits\n3.4\nProcedures in\ndumping\noperation\n3.5\nFactors\naffecting\nproductivity\n3.6\nProductivity\nwork\nmeasurements\n3.7\nWays of\nimproving\nproductivity\n\n3.1 Interpreting hand\nsignal or radio\ncommunication\n3.2 Perform dumping\noperation\nprocedures\n3.3 Using PPE\n\n--- PDF PAGE 74 ---\nHEAVY EQUIPMENT OPERATION (Rigid On-Highway Dump Truck) NC II Revision 01 Promulgated (11/07/2019)\n69\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Safe work\npractices\nMay include:\n1.1 Observed safety awareness\n1.2 Observed firm and flat ground for the loading and dumping area\n1.3 Wear PPE\n1.4 Checked illumination of work site\n1.5 Observed 3-point contact in embarking on and alighting from\n equipment\n1.6 All controls must be in neutral position and parking brake\n applied before alighting from equipment\n1.7 Observed housekeeping\n\n2. Communication\nMay include:\n2.1 Hand signal\n2.2 Radio / mobile phone and GPS\n2.3 Horn / Light signal\n\n3. Control levers\nMay include:\n3.1 Parking brake\n3.2 Retarder / Exhaust brake\n3.3 Transmission gear shift\n3.4 Steering\n3.5 Differential lock\n3.6 Power take-off\n\n4. Unexpected\nsituations\nMay include:\n4.1 Sudden engine breakdown\n4.2 Busted hydraulic hose and oil leakages\n4.3 Sudden loss of brake\n4.4 Loss control of steering\n4.5 Sudden ground failure\n4.6 Force majeure e.g., earthquake, fire, tornado\n4.7 Operator fatigue or sickness/condition\n4.8 Accidents/incidents\n\n5. Worksite\nconditions\nMay include:\n5.1 Muddy\n5.2 Sandy\n5.3 Slippery\n5.4 Uneven / unstable terrain\n\n--- PDF PAGE 75 ---\nHEAVY EQUIPMENT OPERATION (Rigid On-Highway Dump Truck) NC II Revision 01 Promulgated (11/07/2019)\n70\n\nVARIABLE\nRANGE\n6. Safe operating\ntechniques\nMay include:\n6.1 Dump box is maintained in float position during traveling\n6.2 Differential lock is engaged/disengaged during full stop\n6.3 Running dumping is applied at lower gear operation\n6.4 Reverse operation is not allowed during dumping operation\n\n7. Engine RPM\nMay include:\n7.1 700 – 1,200 RPM\n7.2 1,200 – 2,200 RPM\n8. Brake\nMay include:\n8.1 Service\n8.2 Secondary / Emergency\n8.3 Exhaust brake/Engine brake\n8.4 Parking brake\n\n9. Established /\nrecommended\nprocedures\nMay include:\n9.1 Dump truck is positioned in the dumping area in accordance with\nsite condition.\n9.2 Transmission is set at neutral position and parking brake is\n engaged.\n9.3 Horn is sounded prior to dump box raising / lowering position.\n9.4 Dump box is raised / lowered in smooth and controlled engine\n RPM.\n9.5 Unexpected situations are responded in line with company rules\n and regulations.\n\n--- PDF PAGE 76 ---\nHEAVY EQUIPMENT OPERATION (Rigid On-Highway Dump Truck) NC II Revision 01 Promulgated (11/07/2019)\n71\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency to be\nconsidered\nAssessment must confirm evidence that the candidate:\n1.1 Prepared for loading operation\n1.2 Performed hauling operation\n1.3 Performed dumping operation\n1.4 Observed safety measures applicable to worksite operation\n1.5 Communicated effectively with others to ensure effective work\noperation\n2. Resource\nimplications\nThings necessary for the conduct of assessment\n2.1. Access to dump truck and job site/terrain\n2.2. Operation and maintenance manual\n2.3. Available loads\n2.4. PPE\n2.5. Spotter\n2.6 Safety signage’s/barricades\n\n3. Method of\nassessment\nCompetency in this unit may be assessed through:\n3.1 Written examination\n3.2 Direct observation/Demonstration with oral questioning\n4. Context for\nassessment\n4.1 Competency may be assessed in actual workplace or at the\ndesignated TESDA Accredited Assessment Center\n\n--- PDF PAGE 77 ---\nHEAVY EQUIPMENT OPERATION (Rigid On-Highway Dump Truck) NC II Revision 01 Promulgated (11/07/2019)\n72"
