      "definition": "1. Rigid on-highway dump truck 2. Rigid Refers to rigid frame type of dump truck used for loading/ hauling/ transporting construction materials such as aggregates, sand, soil, etc. Refers to inability of the frame of the on-highway dump truck to bend 3. Dump body sensor Refers to the audible and visual alarm that signals that operator that dump box is in the raised position. 4. Operator- serviceable (OS)"
