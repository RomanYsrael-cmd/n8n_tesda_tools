      "text": "NATIONAL ASSESSMENTAND CERTIFICATION ARRANGEMENTS 4.1.1 A National Certificate (NC) is issued when a candidate has demonstrated competence on all units of competency in a qualification with a promulgated Training Regulations. 4.1.2 Individuals wanting to be certified will have to be assessed in accordance with the requirements identified in the relevant unit/s of competency. 4.1.3 Assessment shall cover all the competencies of the qualification with the basic and common units integrated or assessed concurrently with the core units of competency. 4.1.4 The following are qualified to apply for assessment and certification: • Graduates of formal, non-formal and informal institutions and enterprise- based training programs • Experienced Workers (wage employed or self-employed) 4.1.5 For the renewal of valid or expired National Certificate (NC) in Heavy Equipment Operation (On-Highway Dump Truck) (Rigid) NC II, the individual/holder will have to undergo assessment in the amended TR for Heavy Equipment Operation (Rigid On- Highway Dump Truck) NC II. 4.1.6 The industry shall determine assessment and certification requirements for each qualification with promulgated Training Regulations: It includes the following: a. Entry requirements for candidates b. Evidence gathering methods c. Qualification requirements of competency assessors d. Specific assessment and certification arrangements as identified by industry HEAVY EQUIPMENT OPERATION (Rigid On-Highway Dump Truck) NC II Revision 01 Promulgated (11/07/2019)"
