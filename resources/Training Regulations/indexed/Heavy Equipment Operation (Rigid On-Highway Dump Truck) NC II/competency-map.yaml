  "source_text": "SECTION 1 HEAVY EQUIPMENT OPERATION (RIGID ON-HIGHWAY DUMP TRUCK)\n NC II\n\nThe HEO (Rigid On-Highway Dump Truck) NC II qualification consists of competencies\nthat workers must achieve to enable them to perform tasks such as inspection, basic preventive\nmaintenance, loading, hauling and dumping of earth materials in the construction, mining sites\nor other locations.\n\nThis qualification is packaged from the competency map of Construction - Heavy\nEquipment sub-sector as shown in Annex A.\n\nThe units of competency comprising this qualification include the following:\n\nCODE NO.\n\nBASIC COMPETENCIES\n400311210\nParticipate in workplace communication\n400311211\n400311212\n400311213\n400311214\n400311215\n400311216\n400311217\n\n400311218\nWork in a team environment\nSolve/address general workplace problems\nDevelop career and life decisions\nContribute to workplace innovation\nPresent relevant information\nPractice occupational safety and health policies and proced\nExercise efficient and effective sustainable practices in\nthe workplace\nPractice entrepreneurial skills in the workplace\n\nCODE NO.\nCOMMON COMPETENCIES\nCON931201\nPrepare construction materials and tools\nCON311201\nObserve procedures, specifications and manuals of instruction\nCON311202\nInterpret drawings and plans\nCON311203\nCON311204\nPerform mensurations and calculations\nMaintain tools and equipment\n\nCODE NO.\n\nCORE COMPETENCIES\nCON834222\nPerform pre and post-operation procedures for rigid on-\nhighway dump truck\nCON834223\n\nPerform basic preventive maintenance servicing for rigid on-\nhighway dump truck\nCON834224\nPerform productive operation for rigid on-highway dump truck\n\nA person who has achieved this Qualification is competent to be a –\n❑ Rigid on-highway dump truck operator\n\n--- PDF PAGE 7 ---\nHEAVY EQUIPMENT OPERATION (Rigid On-Highway Dump Truck) NC II Revision 01 Promulgated (11/07/2019)\n2"
