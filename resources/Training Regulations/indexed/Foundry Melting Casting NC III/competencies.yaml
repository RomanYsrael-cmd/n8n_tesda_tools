        "source_title": "MELT METALS USING CORELESS INDUCTION FURNACE",
        "source_text": "--- PDF PAGE 40 ---\n________________________________________________________________________________________________________________ \nTR FOUNDRY MELTING/ CASTING NC III                                                                                                                Promulgated   \n           \n38\nUNIT OF COMPETENCY : \nMELT METALS USING CORELESS INDUCTION  \nFURNACE \n \nUNIT CODE  \n \n:  \nALT812316 \n \nUNIT DESCRIPTOR \n: \nThis unit covers implementation of Quality Assurance and  \nControl in Induction Furnace Melting, which would include \nlow frequency, medium frequency and high frequency \nfurnaces, melting a wide range of metals and the \noperational maintenance of the furnace crucible.  \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables\n \n1. Identify job \nrequirements. \n \n \n1.1 Melting and casting requirements identified as per \nmanufacturers/ suppliers catalogue, drawings, customer \nrequirements and instruction sheet \n1.2 Metal composition and casting properties is determined in \naccordance with standard operating procedures. \n1.3 Charge materials / ferro-alloys requirement are determined \nbased cast metal requirements. \n1.4 Melting / pouring temperature range are determined based \ncast metal requirements. \n \n2. Establish melting \nprocedure  \n \n \n2.1 Melting procedure is written down as per standard operating \nprocedure. \n2.2 Raw materials, ferro-alloys and additives are specified as per \nprocedures \n2.3 Incoming materials are inspected as per standard operating \nprocedure. \n \n3. Perform material \ninspection. \n \n \n3.1 Material inspection is performed in accordance with the \nchecklist provided \n3.2 Retention is recorded (furnace log-book or record file per \nmaterial) as per company procedure. \n \n4. Control melting \nprocess. \n \n \n4.1   Furnace is prepared and started up as per standard \noperating procedures. \n4.2 Furnace is charged as per standard operating procedures. \n4.3   Chemical composition is analyzed either by emission \nspectrometric method or thermal analysis and corrective \nmeasures are undertaken to attain required composition. \n4.4 Required alloying element and deoxidant is added to the melt \nas per standard operating procedures \n4.5 Inoculation is performed to improve metal properties in \naccordance with recommended inoculation procedures and\n\n--- PDF PAGE 41 ---\n________________________________________________________________________________________________________________ \nTR FOUNDRY MELTING/ CASTING NC III                                                                                                                Promulgated   \n           \n39\ntechniques. \n4.6 Melt change-over procedure is undertaken in accordance with \nstandard operating procedures \n4.7 Molten metal is performed applying the recommended \npouring technique. \n4.8 Production data is recorded in accordance with company \nrequirements \n \n5. Maintain furnace \ncrucible \n \n \n5.1 Crucible lining is inspected and findings are noted, in \nlogbook in accordance with company requirements \n5.2 Corrective measures are undertaken to restore the crucible \nlining to working condition \n5.3 Task is accomplished in accordance with OH & S \nrequirements\n\n--- PDF PAGE 42 ---\n________________________________________________________________________________________________________________ \nTR FOUNDRY MELTING/ CASTING NC III                                                                                                                Promulgated   \n           \n40\n \nRANGE OF VARIABLE \n \nVARIABLE \nRANGE \n \n1. Charge materials. \n \n1.1 steel scrap \n1.2 pig iron \n1.3 return scrap \n1.4 purchased scrap \n1.5 ferro-alloys \n1.6 additives  \n \n2. Cast metal  \n \n2.1 gray cast iron and its alloy \n2.2 low, medium and high carbon steel and their alloys \n2.3 stainless steel \n \n3. Procedure \n \n \nProcedure should specify- \n3.1 What procedures are to be followed? \n3.2 What are the raw materials, ferro-alloys, additives \n3.3 What is to be measured? \n3.4 How is it measured?  \n3.5 Instrument/tools? \n3.6 What is to be recorded? \n \n4. Checklist \n \n4.1 Characteristics of melting material (e.g. size). \n4.2 Contaminants as per chemical analysis. \n4.3 Checking frequency (once per shipment / 0.5kilo per ton). \n4.4 Quality checked (sample size). \n4.5 Checking method (visual, spectro, weigh scale). \n4.6 Personnel responsible (operation/process inspector). \n \n5. Production data \n \n5.1 Furnace charge weight  \n5.2 Energy consumption, total cold charge material, amount of \nheel, tapping quantities, number of ladles. \n5.3 Type of casting poured, number of molds poured. \n \n6. Findings  \n \nFindings in inspection of crucible lining include but not limited to: \n6.1 Lining wear data and wear pattern. \n6.2 Thickness of the lining. \n6.3 Number of heats made or through–put of the lining. \n6.4 Lining condition.\n\n--- PDF PAGE 43 ---\n________________________________________________________________________________________________________________ \nTR FOUNDRY MELTING/ CASTING NC III                                                                                                                Promulgated   \n           \n41\nEVIDENCE GUIDE \n \n \n1. Critical aspect of   \n     Competency \n \nAssessment requires evidence that the candidate  \n1.1 Identified job requirements. \n1.2 Established melting procedure. \n1.3 Performed material inspection. \n1.4 Controlled the melting process. \n1.5 Maintained furnace crucible \n \n2. Underpinning \nKnowledge and \nattitudes \n \n2.1 Foundry melting production process (from material selection to \nfettling and trimming). \n2.2 Procedure of quality assurance and control system including \ninspection and testing. \n2.3 Crucible conditions, faults and repair limits. \n2.4 Metallic charge materials, ferro-alloys, additives, ladle \nadditions. \n2.5 Weighing procedure and scale types. \n2.6 Thermocouple condition monitoring and adjustment \nmechanism. \n2.7 Interpretation of carbon equivalent (thermal analysis) and \nwedge chill test result. \n2.8 Coagulant agents, application and removal procedures. \n2.9 Applicable industry standard, JIS, ASTM, SAE, DIN, BS, AS \netc. \n2.10 Metallic charge materials and its characteristics. \n2.11 Metal composition and its effects on the mechanical physical \nproperties of the metal. \n2.12 Pouring temperature and its effect on the casting integrity. \n2.13 Proper pouring techniques. \n2.14 Effect of charge material on the mechanical / physical \nproperties of the metal. \n2.15 Effect of inoculation, ductile treatment, fade time or molten \nmetal. \n2.16 Use and application of personal protective equipments. \n2.17 Safe work practice and procedures. \n2.18 Hazard and control measure associated with operating \nmelting furnace. \n  \n3. Underpinning skills\n \n \n3.1 Reading and interpreting information on written job instructions, \nspecifications, standard operating procedures relevant test data \nsheets and other standard workplace forms. May include \ndrawings for furnace operation. \n3.2 Following oral instructions.  \n3.3 Deciding on charge materials. \n3.4 Weighing charge materials. \n3.5 Feeding materials into furnace. \n3.6Measuring metal temperature and correcting as necessary.\n\n--- PDF PAGE 44 ---\n________________________________________________________________________________________________________________ \nTR FOUNDRY MELTING/ CASTING NC III                                                                                                                Promulgated   \n           \n42\n3.7 Sampling for chemical, carbon equivalent and wedge tests. \n3.8 Tapping the metal. \n3.9 Implement relevant check / test required procedures of Quality \nHandbook. \n3.10 Coordination skill with process inspector, pourer, furnace \noperator. \n3.11 Can accomplish chemical analysis using emission \nspectrometer, thermal analysis. \n3.12 Review, comprehend entries on melting section log-book. \n3.13 Good analysis technique of the limits of foundry melting \nprocess, analysis of melt and metal composition. \n \n4. Resource \nimplications \n \n \n \nThe following resources MUST be provided:  \n4.1 Manuals/catalogues relative to Melting/Casting \n4.2 Job order, requisitions slip for materials \n4.3 Materials, tools and equipment relevant to the activity  \n4.4 Incoming material receiving effort. \n4.5 Quality handbook procedure for melting.  \n \n5. Method of \nassessment \n    \n     \n \nCompetency MUST be assessed through: \n5.1 Observation with questioning \n5.2 Portfolio \n5.3 Third Party Report \n \n6. Context of \nassessment  \n \n \n \n6.1 Assessment must be undertaken in accordance with the \nendorsed TESDA assessment guidelines \n6.2 Assessment may be conducted in the workplace or a simulated \nenvironment.\n",
