        "descriptor": "This unit covers melting of automotive truck, tractor, and\nallied industries gray iron casting using cupola as a basic\nmelter in conjunction with a holding furnace or induction\nfurnace as refiner. This unit applies to melting of automotive\ngrades gray iron castings used in the production of\nautomobile, trucks, tractors and allied industries as covered\nby ASTM-A159.",
        "elements": [
          {
            "number": 1,
            "title": "Identify casting",
            "performance_criteria": [
              {
                "number": "1.1",
                "text": "Mechanical and physical properties of gray cast iron casting are determined from product drawing, industrial standards, instruction sheet and technical bulletins or specific standards such as ASTM-A159, ASTM-247 and E-10."
              },
              {
                "number": "1.2",
                "text": "Base metal is selected based on ASTM-159 specifications"
              },
              {
                "number": "1.3",
                "text": "Specific location of hardness and micro-structure tests identified based on customer requirements."
              },
              {
                "number": "1.4",
                "text": "Other relevant requirement is determined according to customer requirements i.e. heat-treatment, metal processing."
              }
            ]
          },
          {
            "number": 2,
            "title": "Select melting",
            "performance_criteria": [
              {
                "number": "2.1",
                "text": "High-grade raw materials are selected must be, consistent with automotive grade casting."
              },
              {
                "number": "2.2",
                "text": "Charge analysis is undertaken and converted to appropriate furnace charge."
              },
              {
                "number": "2.3",
                "text": "Requisitions are completed as required according to standard operating procedures."
              },
              {
                "number": "2.4",
                "text": "Furnace charge is weighed according to standard operating procedures."
              }
            ]
          },
          {
            "number": 3,
            "title": "Melt base iron",
            "performance_criteria": [
              {
                "number": "3.1",
                "text": "Cupola furnace is prepared as per standard operating procedures."
              },
              {
                "number": "3.2",
                "text": "Cupola furnace is charged as per standard operating procedures."
              },
              {
                "number": "3.3",
                "text": "Cupola melt is monitored including testing of chemical composition and melt temperature as per standard operating procedures."
              },
              {
                "number": "3.4",
                "text": "Adapt corrective measures are undertaken to attain required chemical composition."
              },
              {
                "number": "3.5",
                "text": "Wedge chill testing is conducted and rectification measures are undertaken to attain desired results."
              },
              {
                "number": "3.6",
                "text": "Molten metal is transferred to cupola fore-hearth as per standard operating procedures. --- PDF PAGE 46 --- ________________________________________________________________________________________________________________ TR FOUNDRY MELTING/ CASTING NC III Promulgated 44"
              }
            ]
          },
          {
            "number": 4,
            "title": "Perform duplexing",
            "performance_criteria": [
              {
                "number": "4.1",
                "text": "Molten metal is transferred to an induction furnace duplexing furnace in accordance with standard operating procedures and OH & S requirements."
              },
              {
                "number": "4.2",
                "text": "Metal is desulfurized (0.02% MAX) if making nodular (Ductile) cast iron, before transferring to the induction furnace as per standard operating procedures."
              },
              {
                "number": "4.3",
                "text": "Required alloying element is added to the melt as per standard operating procedures."
              },
              {
                "number": "4.4",
                "text": "Chemical composition analysis is undertaken and adjusted, if required, as per standard operating procedures."
              },
              {
                "number": "4.5",
                "text": "Metal temperature is raised to tapping value and wedge chill test undertaken as per standard operating procedures."
              },
              {
                "number": "4.6",
                "text": "Molten metal is transferred to pouring ladle for inoculation and pouring as per standard operating procedures."
              }
            ]
          },
          {
            "number": 5,
            "title": "Perform inoculation",
            "performance_criteria": [
              {
                "number": "5.1",
                "text": "Appropriate inoculants is selected compatible with type of casting, its size and section thickness."
              },
              {
                "number": "5.2",
                "text": "Inoculation is performed to improve metal properties in accordance with recommended inoculation procedures and techniques."
              },
              {
                "number": "5.3",
                "text": "Wedge chill value is taken before and after inoculation as per standard operating procedures."
              },
              {
                "number": "5.4",
                "text": "“Dead melt” time and pouring time is control as per standard operating procedures."
              }
            ]
          },
          {
            "number": 6,
            "title": "Conduct gray iron",
            "performance_criteria": [
              {
                "number": "6.1",
                "text": "Agreement is secured from the customer regarding what to test, where to test which will correspond with ASTM standards or JIS standards, as the case maybe."
