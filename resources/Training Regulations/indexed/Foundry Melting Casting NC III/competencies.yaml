          "source_text": "1. Identify job \nrequirement \n \n1.1 Casting alloy requirements identified as per manufacturers \n/ suppliers catalogue, drawings, instruction sheets. \n1.2 Required specifications are cross checked with \ncorresponding international specification  \n1.3 Casting method is determined by available die or mold \n(gravity or low-pressure die casting). \n1.4 Metal treatment is determined based on available product \nbulletin. \n1.5 Appropriate melting furnace selected as per required metal \ntreatment and type of crucible (stationary / dip-out or tilting).\n \n2. Establish melting \nand melt treatment \nprocess. \n \n2.1 Metal charges are fed as per standard operating procedures. \n2.2 Appropriate fluxing technique is performed based on \ncomposition of metal charges (virgin ingot and recycled \nscrap). \n2.3 Furnace is started up as per standard operating procedures. \n2.4 Appropriate degassing technique is applied as per standard \noperating procedures. \n2.5 Melt refining agent of the alloy is added as per standard \noperating procedures. \n2.6 Structured modification of the alloy is applied as per \nstandard operating procedures. \n2.7 Speed of melting is monitored to avoid oxidation. \n2.8 Pouring temperature is determined corresponding to the \nalloy and casting section thickness. \n2.9 Filtration method and location is decided on corresponding o \nthe alloy \n2.10 Metal is tapped from crucible with minimum turbulence to \navoid oxide formations. \n2.11 Pouring is accomplished in accordance with OH & S \nrequirements\n\n--- PDF PAGE 36 ---\n________________________________________________________________________________________________________________ \nTR FOUNDRY MELTING/ CASTING NC III                                                                                                                Promulgated   \n           \n34\n \n \n3. Identify casting \nquality requirement. \n \n3.1 Casting quality requirements is identified based on job \nrequirements \n3.2 Content of contaminants which will affect integrity of the \ncasting is identified in accordance with procedures. \n3.3 Structural modification is applied in accordance with \nprocedures,   \n3.4 Availability of chemical analysis results is coordinated  with \nother section such as process control  \n3.5 Written procedures to be followed during castings is \nestablished as per quality Handbook.\n \n4. Identify casting \ndefects cause by \nunsound melting \ntechnique. \n \n4.1  Nature of casting defects, its causes and the appropriate \nremedial actions is identified in accordance with standard \noperating procedures. \n4.2 Cause / effect analysis of the defect and other tools of quality \ncontrol is presented in coordination with the process \nengineer.  \n4.3 Defective castings which showed up in machining and \npainting section are coordinated with the respective sections \nin accordance with company procedures \n4.4 Action plan to resolve the persistent casting defect is \nformulated and implemented (vital few / trivial many) in \naccordance with company procedures. \n4.5 Personnel involved in melting are re-oriented on correct \nmelting and treatment of aluminum-silicon alloy. \n4.6 Result of quality inspection is analyzed and measures are \nrecommended to quality\n \n5. Recycle scraps / \nturnings. \n \n5.1 Re-melting is accomplished in accordance with company \nstandard operating procedures  \n5.2 Dross is completely removed from the melt before pouring \ninto pig ingot molds. \n5.3 Ingot type is labeled as per standard operating procedures  \n5.4 Melt contamination is avoided by coating all tools which \ncomes into contact with the melt. \n5.5 Production reports are entered in pro-form with some \ncomment / recommendation for future production reference.\n\n--- PDF PAGE 37 ---\n________________________________________________________________________________________________________________ \nTR FOUNDRY MELTING/ CASTING NC III                                                                                                                Promulgated   \n           \n35\n RANGE OF VARIABLE \n \nVARIABLE \nRANGE \n \n1. Casting alloy \nrequirement. \n1.1 Aluminum Silicon Alloy (AlSi) 12 \n1.2 AlSi 12 Magnesium (Mg) \n1.3 AlSi 10 \n1.4 AlSi 9 Mg \n1.5 AlSi 7 Mg \n1.6 AlSi 5 Mg.\n2. International \nspecification \n2.1 Society of Automotive Engineer (SAE) \n2.2 Japanese Industrial Standard (JIS) \n2.3 American Society Testing Materials (ASTM) \n2.4 German Standard (DIN) \n2.5 British Standard (BS) \n2.6 Australian Standard (AS) \n2.7 American Aluminum (AA)\n \n3. Metal treatment. \n3.1 Structural modifications. \n3.2 Refining agent-metallic sodium, permanently refined with \nstrontium. \n3.3 Titanium diboride. \n3.4 Flux \n3.5 Degasser \n3.6 Solution heat treatment / aging as necessary.\n \n4. Contaminants \n \n4.1 Iron content – max 0.15%. \n4.2 Manganese content – max 0.02% \n4.3 Copper content – less than 0.01% \n \n5. Casting defects \n \n \n5.1 Shrinkage. \n5.2 Blow-holes. \n5.3 Metal inclusions \n5.4 Oxide inclusions \n \n6. Production \nSafety tested castings produced include \n6.1 car wheels \n6.2 motor bike wheels \n6.3 brake pedals, etc…\n\n--- PDF PAGE 38 ---\n________________________________________________________________________________________________________________ \nTR FOUNDRY MELTING/ CASTING NC III                                                                                                                Promulgated   \n           \n36"
        },
        "evidence_guide": {
          "source_text": "1. Critical aspect \nof   \n      competency \nAssessment requires evidence that the candidate  \n1.1 Identified job requirements. \n1.2 Established melting and melt treatment process. \n1.3 Identified casting quality requirement. \n1.4 Identified casting defects cause by un-sound melting technique. \n1.5 Recycled of scraps / turnings. \n1.6 Prepared reports\n \n2. Underpinning \nknowledge and \nattitudes \n2.1 Aluminum-silicon alloy specification \n2.2 Melting control of aluminum silicon alloy procedures \n2.3 Melt treatment of aluminum-silicon alloy procedures \n2.4 Casting chemical composition limits and subversive      \n       Elements (contaminants) \n2.5 Effects of chemical composition on integrity of the casting \n(strengths, ductility, surface finish) \n2.6 Charging sequence of metallic charges and melt  treatment \n2.7 Pouring temperature range limits. \n2.8 Nature of casting defects attributable to melting and melt \ntreatment of aluminum-silicon alloy. \n2.9 Countermeasures to eliminate / minimize casting defects. \n2.10 Safety test applied to casting. \n2.11 Operation of emission spectrometer analyzer \n2.12 Safe work practice and procedures. \n2.13 Use and application of personal protective equipments. \n2.14 Operational hazards and control measures associated with \nmelting aluminum-silicon alloys. \n2.15 Applicable industry standards for aluminum-silicon alloy such \nas: AA, JIS, SAE, ASTM, DIN, BS and other published \nstandard by aluminum ingots supplier.\n  \n3. Underpinning  \n    skills \n \n3.1 Reading and interpreting information on written job instructions, \nspecifications, standard operating procedures relevant test data \nsheets and other standard workplace forms. May include \ndrawings for furnace operation. \n3.2 Following oral instructions.  \n3.3 Decide on raw materials. \n3.4 Weighing charge materials. \n3.5 Feeding materials into furnace. \n3.6 Measuring metal temperature and adjusting if necessary. \n3.7 Sampling for chemical analysis and for gas content analysis. \n3.8 Applying de-slagging, degassing, refining and modifying melting \ntechniques.\n\n--- PDF PAGE 39 ---\n________________________________________________________________________________________________________________ \nTR FOUNDRY MELTING/ CASTING NC III                                                                                                                Promulgated   \n           \n37\n \n \n4. Resource \n    implications \n \n \nThe following resources MUST be provided:  \n4.1  All manuals/catalogues relative to Melting/Casting of \nAluminum-silicon alloys. \n4.2 Job order, requisitions slip for materials \n4.3  Materials, tools and equipment relevant to the activity  \n4.4 Crucible furnace   \n4.5 Spectrometer\n \n5. Method of \nassessment \n  \nCompetency MUST be assessed through: \n5.1 Observation with questioning \n5.2 Portfolio  \n5.3 Third party report\n \n6. Context of \nassessment  \n6.1 Assessment must be undertaken in accordance with  \n      the endorsed TESDA assessment guidelines \n6.2 Assessment may be conducted in the workplace or a  \n      simulated environment",
