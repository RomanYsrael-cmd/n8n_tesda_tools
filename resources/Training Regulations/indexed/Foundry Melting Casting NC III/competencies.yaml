              {
                "number": "6.2",
                "text": "Visual inspection is conducted using “color check” or dye penetrants."
              },
              {
                "number": "6.3",
                "text": "Dimensional inspection is performed as per standard operating procedures."
              },
              {
                "number": "6.4",
                "text": "File test is performed to determine chills on casting edges."
