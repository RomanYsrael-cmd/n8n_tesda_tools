          "source_text": "1. Identify casting \nrequirement \n \n1.1 Mechanical and physical properties of gray cast iron \ncasting are determined from product drawing, industrial \nstandards, instruction sheet and technical bulletins or specific \nstandards such as ASTM-A159, ASTM-247 and E-10. \n1.2 Base metal is selected based on ASTM-159 specifications \n1.3 Specific location of hardness and micro-structure tests \nidentified based on customer requirements. \n1.4 Other relevant requirement is determined according to \ncustomer requirements i.e. heat-treatment, metal processing.\n \n2. Select melting \nmaterials. \n \n2.1 High-grade raw materials are selected must be, consistent \nwith automotive grade casting. \n2.2 Charge analysis is undertaken and converted to appropriate \nfurnace charge. \n2.3 Requisitions are completed as required according to \nstandard operating procedures. \n2.4 Furnace charge is weighed according to standard operating \nprocedures.\n \n3. Melt base iron  \n \n3.1 Cupola furnace is prepared as per standard operating \nprocedures. \n3.2 Cupola furnace is charged as per standard operating \nprocedures. \n3.3 Cupola melt is monitored including testing of chemical \ncomposition and melt temperature as per standard \noperating procedures. \n3.4 Adapt corrective measures are undertaken to attain required \nchemical composition. \n3.5 Wedge chill testing is conducted and rectification measures \nare undertaken to attain desired results. \n3.6 Molten metal is transferred to cupola fore-hearth as per \nstandard operating procedures.\n\n--- PDF PAGE 46 ---\n________________________________________________________________________________________________________________ \nTR FOUNDRY MELTING/ CASTING NC III                                                                                                                Promulgated   \n           \n44\n \n \n4. Perform duplexing \nand control \nactivities. \n \n4.1 Molten metal is transferred to an induction furnace \nduplexing furnace in accordance with standard operating \nprocedures and OH & S requirements. \n4.2  Metal is desulfurized (0.02% MAX) if making nodular \n(Ductile) cast iron, before transferring to the induction furnace \nas per standard operating procedures. \n4.3 Required alloying element is added to the melt as per \nstandard operating procedures. \n4.4 Chemical composition analysis is undertaken and adjusted, if \nrequired, as per standard operating procedures. \n4.5 Metal temperature is raised to tapping value and wedge chill \ntest undertaken as per standard operating procedures. \n4.6 Molten metal is transferred to pouring ladle for inoculation and \npouring as per standard operating procedures.\n \n5. Perform inoculation \nprocedures  \n \n5.1 Appropriate inoculants is selected compatible with type of \ncasting, its size and section thickness. \n5.2 Inoculation is performed to improve metal properties in \naccordance with recommended inoculation procedures and \ntechniques. \n5.3 Wedge chill value is taken before and after inoculation as per \nstandard operating procedures. \n5.4 “Dead melt” time and pouring time is control as per standard \noperating procedures.\n \n6. Conduct gray iron \ncasting testing and \ninspection. \n \n6.1 Agreement is secured from the customer regarding what to \ntest, where to test which will correspond with ASTM \nstandards or JIS standards, as the case maybe. \n6.2 Visual inspection is conducted using “color check” or dye \npenetrants. \n6.3 Dimensional inspection is performed as per standard \noperating procedures. \n6.4 File test is performed to determine chills on casting edges. \n6.5 Other standard method of inspection is implemented assume \ncasting integrity. \n6.6 Repair agreement is secured from the customer as to location \nof defect and its extent. \n6.7 Scrap diagnosis is spearheaded and coordinated with \nmachine shop and process engineering personnel.\n\n--- PDF PAGE 47 ---\n________________________________________________________________________________________________________________ \nTR FOUNDRY MELTING/ CASTING NC III                                                                                                                Promulgated   \n           \n45\nRANGE OF VARIABLE \n \nVARIABLE \nRANGE \n \n1. Mechanical and \nphysical \nproperties \n1.1  Brinnel Hardness \n1.2 Tensile strength \n1.3  Graphite distribution \n1.4  Form \n1.5  Size and  \n1.6 Matrix.\n2. Other relevant \nrequirements\n2.1 Heat treatment \n2.2Metal processing\n \n3. Raw materials \n \n3.1 Pig iron \n3.2 Steel scrap \n3.3 Return scrap \n3.4 Carburizer \n3.5 Siliconizing \n3.6 Limestone \n3.7Inoculants\n4. Automotive grade \ncasting \n4.1 Chemistry \n4.2 Size \n4.3 Purity\n \n5. Chemical \ncomposition \n5.1 Carbon \n5.2  Silicon  \n5.3  Manganese \n5.4  Sulphur \n5.5Phosphorous.\n \n6. Induction furnace \n    duplexing \n6.1 Good temperature control (holding / tapping). \n6.2 Addition of alloying element is very simple. \n6.3 Good control for chemical composition and analysis. \n6.4Flexibility is good.\n \n7. Inoculants \n \n7.1. Graphitizer. \n7.2. Stabilizer \n7.3. Special inoculants \n7.4.Size / fineness compatible with volume of treated metal\n\n--- PDF PAGE 48 ---\n________________________________________________________________________________________________________________ \nTR FOUNDRY MELTING/ CASTING NC III                                                                                                                Promulgated   \n           \n46"
        },
        "evidence_guide": {
          "source_text": "1. Critical aspect of   \n    competency \nAssessment requires evidence that the candidate  \n1.1 Identified casting requirements. \n1.2 Selected melting materials. \n1.3 Melted base iron. \n1.4 Performed duplexing and control activities. \n1.5 Performed Inoculation procedures. \n1.6 Conducted gray iron casting testing and inspection.\n \n2. Underpinning \nknowledge and \nattitudes \n2.1 Foundry melting production process (from material selection to \nfettling and trimming). \n2.2 Procedure of quality assurance and control system including \ninspection and testing. \n2.3 Crucible conditions, faults and repair limits. \n2.4 Metallic charge materials, ferro-alloys, additives, ladle additions. \n2.5 Weighing procedure and scale types. \n2.6 Thermocouple condition monitoring and adjustment mechanism. \n2.7 Interpretation of carbon equivalent (thermal analysis) and wedge \nchill test result. \n2.8 Coagulant agents, application and removal procedures. \n2.9 Applicable industry standard, JIS, ASTM, SAE, DIN, BS, AS etc. \n2.10Metallic charge materials and its characteristics. \n2.11 Metal composition and its effects on the mechanical physical \nproperties of the metal. \n2.12 Pouring temperature and its effect on the casting integrity. \n2.13 Proper pouring techniques. \n2.14 Effect of charge material on the mechanical / physical \nproperties of the metal. \n2.15 Effect of inoculation, ductile treatment, fade time or molten  \n         metal. \n2.16 Use and application of personal protective equipments. \n2.17 Safe work practice and procedures. \n2.18 Hazard and control measure associated with operating melting \nfurnace.\n\n--- PDF PAGE 49 ---\n________________________________________________________________________________________________________________ \nTR FOUNDRY MELTING/ CASTING NC III                                                                                                                Promulgated   \n           \n47\n \n \n  \n3. Underpinning  \n    skills \n \n3.1 Reading and interpreting information on written job instructions, \nspecifications, standard operating procedures relevant test data \nsheets and other standard workplace forms and drawings for \nfurnace operation. \n3.2 Following oral instructions \n3.3 Deciding on charge materials \n3.4 Weighing charge materials \n3.5 Feeding materials into furnace \n3.6 Measuring metal temperature and correcting as necessary \n3.7 Sampling for chemical, carbon equivalent and wedge tests \n3.8 Tapping the metal. \n3.9 Implement relevant check / test required procedures of Quality \nHandbook. \n3.10 Coordination skill with process inspector, pourer, furnace operator\n3.11 Can accomplish chemical analysis using emission \nspectrometer, thermal analysis. \n3.12 Review, comprehend entries on melting section log-book. \n3.13 Good analysis technique of the limits of foundry melting process, \nanalysis of melt and metal composition.\n \n4. Resource \nimplications \n \n \nThe following resources MUST be provided:  \n4.1 All manuals/catalogues relative to Melting/Casting \n4.2  Job order, requisitions slip for materials \n4.3  Materials, tools and equipment relevant to the activity  \n4.4 Incoming material receiving effort. \n4.5Quality handbook procedure for melting. \n \n5. Method of \nassessment \n  \nCompetency MUST be assessed through: \n5.1 Observation with questioning \n5.2 Portfolio \n5.3Third party report\n \n6. Context of \nassessment  \n6.1 Assessment must be undertaken in accordance with  \n      the endorsed TESDA assessment guidelines \n6.2 Assessment may be conducted in the workplace or a  \n      simulated environment",
