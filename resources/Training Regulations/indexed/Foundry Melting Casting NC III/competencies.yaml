        "evidence_guide": {
          "source_text": "1. Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1 \nIdentified the problem \n1.2 \nDetermined the fundamental causes of the problem \n1.3 \nDetermined the correct / preventive action \n1.4 \nProvided recommendation to manager \nThese aspects may be best assessed using a range of scenarios \n/ case studies / what ifs as a stimulus with a walk through forming \npart of the response. These assessment activities should include \na range of problems, including new, unusual and improbable \nsituations that may have happened. \n2. Underpinning \nknowledge  \n2.1 \nCompetence includes a thorough knowledge and \nunderstanding of the process, normal operating \nparameters, and product quality to recognize non-standard \nsituations \n2.2 \nCompetence to include the ability to apply and explain, \nsufficient for the identification of fundamental cause, \ndetermining the corrective action and provision of \nrecommendations \n2.2.1 \nRelevant equipment and operational processes \n2.2.2 \nEnterprise goals, targets and measures \n2.2.3 \nEnterprise quality, OHS and environmental \nrequirement \n2.2.4 \nPrinciples of decision making strategies and \ntechniques \n2.2.5 \nEnterprise information systems and data collation \n2.2.6 \nIndustry codes and standards \n3. Underpinning \nskills \n3.1 \nUsing range of formal problem solving techniques \n3.2 \nIdentifying and clarifying the nature of the problem \n3.3 \nDevising the best solution \n3.4 \nEvaluating the solution \n3.5 \nImplementation of a developed plan to rectify the problem\n\n--- PDF PAGE 16 ---\n________________________________________________________________________________________________________________ \nTR FOUNDRY MELTING/ CASTING NC III                                                                                                                Promulgated   \n           \n14\n \n4. Resource \nimplications \n4.1 \nAssessment will require access to an operating plant over \nan extended period of time, or a suitable method of \ngathering evidence of operating ability over a range of \nsituations. A bank of scenarios / case studies / what ifs will \nbe required as well as bank of questions which will be \nused to probe the reason behind the observable action.  \n5. Method of \nassessment \nCompetency may be assessed through: \n5.1 Case studies on solving problems in the workplace \n5.2  Observation \nThe unit will be assessed in a holistic manner as is practical and \nmay be integrated with the assessment of other relevant units of \ncompetency. Assessment will occur over a range of situations, \nwhich will include disruptions to normal, smooth operation. \nSimulation may be required to allow for timely assessment of \nparts of this unit of competency. Simulation should be based on \nthe actual workplace and will include walk through of the relevant \ncompetency components.  \n6. Context of \nassessment \n6.1 \nIn all workplace, it may be appropriate to assess this unit \nconcurrently with relevant teamwork or operation units.",
