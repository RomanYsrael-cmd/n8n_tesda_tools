plications\nThe following resources MUST be provided:\n4.1 Relevant technology\n4.2 Interview and demonstration questionnaires\n4.3 Assessment packages\n5. Method of\nassessment\nCompetency must be assessed through:\n5.1 Interview\n5.2 Actual demonstration\n5.3 Authenticated portfolio (related certificates of training/seminar)\n6. Context of\nassessment\n6.1 Competency may be assessed in actual workplace or\nsimulated environment\n\n--- PDF PAGE 23 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY MELTING/ CASTING NC III Promulgated\n\n21\nCOMMON COMPETENCIES\n\nAUTOMOTIVE MANUFACTURING\n\nUNIT TITLE: READ, INTERPRET AND APPLY ENGINEERING DRAWINGS.\n\nUNIT CODE: ALT742201\n\nUNIT DESCRIPTOR: This unit deals with identifying, interpreting and applying specification\nfrom Engineering blue prints or drawings that provides the\nmeasurements of the product and pattern that is to be produced.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n\n1. Identify and\naccess\nengineering\ndrawings/\nspecification\n\n1.1 Appropriate Engineering drawings are identified and accessed\nas per job requirements.\n1.2 Version and date of drawing is checked to ensure correct\nspecification and procedure are identified.\n\n2. Interpret drawings\n\n2.1 Relevant dimensions and sections of the drawings/\nspecifications are located in relation to the work to be conducted\n2.2 Information in the manual are interpreted in accordance to\nindustry practices\n\n3 Apply information\nin the drawings &\nspecifications\n\n3.1 Engineering drawing is interpreted according to job requirements\n3.2 Work steps are correctly identified in accordance with the\nspecifications in the drawings.\n3.3 Dimensional data and shape are applied according to the given\ntask\n\n4. Store drawings\n\n4.1 The drawings and specification are stored properly to\n ensure prevention of damage, ready access and\n updating of information when required in accordance\n with company requirements\n\n--- PDF PAGE 24 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY MELTING/ CASTING NC III Promulgated\n\n22\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Engineering drawings\nKinds of drawings:\n1.1 Casting drawing\n1.2 Machining drawing\n1.3 Project plan\n1.4 Technical drawing\n2. Data\nData includes but not limited to\n2.1 Material specifications\n2.2 Process specifications\n2.3 Special instructions\n2.4 Machining locating points\n2.5 Clamping points\n2.6 Amount of draft\n2.7 Surface finish\n\n--- PDF PAGE 25 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY MELTING/ CASTING NC III Promulgated\n\n23\nEVIDENCE GUIDE\n\n1.Critical aspects of\ncompetency\n\nAssessment requires evidence that the candidate:\n1.1 Identified and accessed drawings/specification\n1.2 Interpreted drawings\n1.3 Applied information in drawings\n1.4 Stored drawings\n\n2. Underpinning\nknowledge and\nattitudes\n\n2.1 Types of drawings used in automotive manufacturing industry\n2.2 Identification of symbols used in the drawings\n2.3 Identification of units of measurements\n2.4 Unit conversion\n2.5 Attention to details, Perseverance, Honesty\n\n3. Underpinning\nskills\n\n3.1 Reading and comprehension skills required to identify and\ninterpret engineering drawings and specifications\n3.2 Accessing information and data\n\n4. Resource\nimplications\n\nThe following resources MUST be provided:\n4.1 All drawings/engineering specifications relative to automotive\nmanufacturing\n4.2 Job order, requisitions\n4.3 Product sample\n\n5 Method of\nassessment\nCompetency MUST be assessed through:\n5.1 Observation with questioning\n5.2 Interview\n\n6 Context of\nassessment\n\n6.1 Assessment must be undertaken in accordance with\n the endorsed TESDA assessment guidelines\n6.2 Assessment may be conducted in the workplace or a\n simulated environment.\n\n--- PDF PAGE 26 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY MELTING/ CASTING NC III Promulgated\n\n24\n\nUNIT OF COMPETENCY: PERFORM MENSURATION AND CALCULATION\n\nUNIT CODE: ALT311202\n\nUNIT DESCRIPTOR:\nThis unit includes identifying, caring for, handling, using and\nmaintaining measuring instruments.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n\n1. Select measuring\n\n instruments\n\n1.1 Object or component to be measured is identified\n1.2 Correct specifications are obtained from relevant source\n1.3 Appropriate measuring instrument is selected according to\njob requirements\n\n2. Carry out\n measurements\n and calculation\n\n2.1 Measuring tools are selected in line with job requirements\n2.2 Accurate measurements are obtained to job\n2.3 Calculation needed to complete work tasks are performed\nusing the four basic process of addition (+), subtraction (-),\nmultiplication (x) and division (/).\n2.4 Calculations involving fractions, percentages and mixed\n numbers are used to complete workplace tasks.\n2.5 Numerical computation is self-checked and corrected for\n accuracy\n2.6 Instruments are read to the limit of accuracy of the tool.\n\n3. Maintain\nmeasuring\ninstruments\n\n3.1 Measuring instruments are kept free from corrosion\n3.2 Measuring instruments are not dropped to avoid damage\n3.3 Measuring instruments are cleaned before and after using.\n\n--- PDF PAGE 27 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY MELTING/ CASTING NC III Promulgated\n\n25\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Measuring\ninstruments\nMeasuring instruments includes:\n1.1 Multitester\n1.2 Micrometer (In-out, depth)\n1.3 Vernier caliper (Out,\ninside)\n1.4 Dial Gauge with Mag. Std.\n1.5 Straight Edge\n1.6 Thickness gauge\n1.7 Try square\n1.8 Protractor\n1.9 Height gauge\n1.10 Steel rule\n1.11 Shrink rule\n\n2. Calculation\n\nKinds of part mensuration include:\n2.1 Volume\n2.2 Area\n2.3 Displacement\n2.4 Inside diameter\n2.5 Circumference\n2.6 Length\n2.7 Thickness\n2.8 Outside diameter\n2.9 Taper\n2. 10 Out of roundness\n2.11 Shrinkage allowance\n\n--- PDF PAGE 28 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY MELTING/ CASTING NC III Promulgated\n\n26\nEVIDENCE GUIDE\n\n1. Critical aspects\nof competency\nAssessment requires evidence that the candidate:\n1.1 Selected measuring instruments\n1.2 Carried-out measurements and calculations.\n1.3 Maintained measuring instruments\n\n2. Underpinning\nknowledge and\nattitudes\n2.1 Types of Measuring instruments and its uses\n2.2 Safe handling procedures in using measuring instruments\n2.3 Four fundamental operation of mathematics\n2.4 Formula for Volume, Area, Perimeter and other geometric\nfigures\n\n3. Underpinning\nSkills\n3.1 Caring and Handling measuring instruments\n3.2 Calibrating and using measuring instruments\n3.3 Performing calculation by Addition, Subtraction, Multiplication\nand Division\n3.4 Visualizing objects and shapes\n3.5 Interpreting formula for volume, area, perimeter and other\ngeometric figures\n\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1 Workplace location\n4.2 Measuring instrument appropriate to servicing processes\n4.3 Instructional materials relevant to the propose activity\n\n5. Method of\n assessment\n\nCompetency MUST be assessed through:\n5.1 Observation with questioning\n5.2 Written or oral examination\n5.3 Interview\n5.4 Demonstration with questioning\n\n6. Context of\n assessment\n\n6.1 Competency elements must be assessed in a safe\n working environment\n6.1 Assessment may be conducted in a workplace or\n simulated environment\n\n--- PDF PAGE 29 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY MELTING/ CASTING NC III Promulgated\n\n27\n\nUNIT TITLE: READ, INTERPRET AND APPLY SPECIFICATION AND MANUALS.\n\nUNIT CODE: ALT723203\n\nUNIT DESCRIPTOR: This unit deals with identifying, interpreting and applying service\nspecification manuals, maintenance procedure manuals and periodic\nmaintenance manual.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n\n1. Identify and\naccess\n manual/\n specification\n\n1.1 Appropriate manuals are identified and accessed as per job\nrequirements.\n1.2 Version and date of manual is checked to ensure correct\nspecification and procedure are identified.\n\n2. Interpret manuals\n\n2.1 Relevant sections, chapters of manuals/specifications are\nlocated in relations to the work to be conducted\n2.2 Information and procedure in the manual are interpreted in\naccordance to industry practices\n\n3 Apply information\nin manual\n\n3.1 Manual is interpreted according to job requirements\n3.2 Work steps are correctly identified in accordance with\nmanufacturer specification\n3.3 Manual data is applied according to the given task\n3.4 All correct sequencing and adjustments are interpreted in\naccordance with information contained on the manual or\nspecifications\n\n4. Store manuals\n\n4.1 Manual or specification are stored appropriately to\n ensure prevention of damage, ready access and\n updating of information when required in accordance\n with company requirements\n\n--- PDF PAGE 30 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY MELTING/ CASTING NC III Promulgated\n\n28\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n\n1. Manuals\n\n Kinds of manuals:\n1.1 Manufacturer’s specification manual\n1.2 Repair manual\n1.3 Maintenance Procedure Manual\n1.4 Periodic Maintenance Manual\n\n--- PDF PAGE 31 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY MELTING/ CASTING NC III Promulgated\n\n29\n\nEVIDENCE GUIDE\n\n1.Critical aspects of\ncompetency\n\nAssessment requires evidence that the candidate:\n1.1 Identified and accessed manual/specification\n1.2 Interpreted manuals\n1.3 Applied information in manuals\n1.4 Stored manuals\n\n2. Underpinning\nknowledge\n\n2.1 Types of manuals used in automotive industry\n2.2 Identification of symbols used in the manuals\n2.3 Identification of units of measurements\n2.4 Unit conversion\n\n3. Underpinning\nskills\n\n3.1.Reading and comprehension skills required to identify and\ninterpret automotive manuals and specifications\n3.1. Accessing information and data\n\n4 Resource\nImplications\n\nThe following resources MUST be provided:\n4.1 All manuals/catalogues relative to Automotive\n4.2 Job order, requisitions\n4.3 Actual vehicle or simulator\n\n5 Method of\nassessment\nCompetency MUST be assessed through:\n5.1 Observation with questioning\n5.2 Interview\n\n6 Context of\nassessment\n\n6.1 Assessment must be undertaken in accordance with\n the endorsed TESDA assessment guidelines\n6.2 Assessment may be conducted in the workplace or a\n simulated environment.\n\n--- PDF PAGE 32 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY MELTING/ CASTING NC III Promulgated\n\n30\n\nUNIT OF COMPETENCY : PERFORM SHOP MAINTENANCE\n\nUNIT CODE\n:\nALT723205\n\nUNIT DESCRIPTOR\n:\nThis unit deals with inspecting and cleaning of work area\nincluding tools, equipment and facilities. Storage and checking\nof tools/ equipment and disposal of used supplies/materials are\nalso incorporated in this competency.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Inspect/clean tools\nand work area\n1.1\nCleaning solvent used as per workshop/tools cleaning\nrequirement\n1.2\nWork area is checked and cleaned\n1.3\nWet surface/spot in work area is wiped and dried\n2. Store/arrange tools\nand shop equipment\n\n2.1 Tools/equipment are checked and stored in their\nrespective shelves/location\n2.2\nCorresponding labels are posted and visible\n2.3\nTools are safely secured and logged in the records\n3. Dispose wastes/used\nlubricants\n3.1\nContainers for used lubricants are visibly labeled\n3.2\nWastes/used lubricants are disposed as per workshop\nSOP\n4. Report damaged\ntools/equipment\n\n4.1\nComplete inventory of tools/equipment is maintained\n4.2\nDamaged tools/equipment/facilities are identified and\nrepair recommendation is given\n4.3\nReports prepared has no error/discrepancy\n\n--- PDF PAGE 33 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY MELTING/ CASTING NC III Promulgated\n\n31\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Work area\nWork areas include:\n1.1\nWorkshop areas for servicing/repairing light and/or heavy\nvehicle and/or plant transmissions and/or outdoor power\nequipment\n1.2\nOpen workshop/garage and enclosed, ventilated office area\n1.3\nOther variables may include workshop with:\n• Mess hall\n• Wash room\n•\nComfort room\n2. Cleaning\nrequirement\n2.1\nCleaning solvent\n2.2\nInventory of supplies, tools, equipment, facilities\n2.3\nList of mechanics/technicians\n2.4\nRags\n2.5\nBroom\n2.6\nMop\n2.7\nPail\n2.8\nUsed oil container\n2.9\nOiler\n2.10 Dust/waste bin\n3. Manuals\n3.1 Vehicle/plant manufacturer specifications\n3.2 Company operating procedures\n3.3 Industry/Workplace Codes of Practice\n3.4 Product manufacturer specifications\n3.5 Customer requirements\n3.6\nIndustry Occupational Health and Safety\n4. Company standard\noperating procedure\nWearing of Personal protective equipment include:\n4.1 Gloves\n4.2 Apron\n4.3 Goggles\n4.4\nSafety shoes\n\n--- PDF PAGE 34 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY MELTING/ CASTING NC III Promulgated\n\n32\nEVIDENCE GUIDE\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nCleaned workshop tools/facilities\n1.2\nMaintained equipment, tools and facilities\n1.3\nDisposed wastes and used lubricants/fluid as per required\nprocedure\n2. Underpinning\nknowledge and\nattitudes\n2.1 5 S or TQM\n2.2 Service procedures\n2.3 Relevant technical information\n2.4 Safe handling of equipment and tools\n2.5 Vehicle safety requirements\n2.6 Workshop policies\n2.7 Personal safety procedures\n2.8 Fire extinguishers and prevention\n2.9 Storage/disposal of hazardous/flammable materials\n2.10 Positive Work Values (Perseverance, Honesty, Patience,\nAttention to Details)\n3. Underpinning skills\n3.1 Handling/Storing of tools/equipment/supplies and material\n3.2 Cleaning grease/lubricants\n3.3 Disposing of wastes and fluid\n3.4 Preparing inventory of s/m and tools and equipment\n3.5\nMonitoring of s/m and tools/equipment\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Workplace: Real or simulated work area\n4.2 Appropriate Tools & equipment\n4.3\nMaterials relevant to the activity\n5. Method of\nassessment\nCompetency MUST be assessed through:\n5.1 Written/Oral Questioning\n5.2\nDemonstration\n6. Context of\nassessment\n6.1\nCompetency must be assessed on the job or in a simulated\nenvironment.\n6.2\nThe assessment of practical skills must take place after a\nperiod of supervised practice and repetitive experience.\n\n--- PDF PAGE 35 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY MELTING/ CASTING NC III Promulgated\n\n33\nCORE COMPETENCIES\n\nUNIT OF COMPETENCY :\nMELT ALUMINUM-SILICON ALLOYS FOR SAFETY\nTESTED CASTINGS\n\nUNIT CODE\n\n:\nALT812315\n\nUNIT DESCRIPTOR\n:\nThis unit covers melting of appropriate aluminum silicon\nalloys for safety tested casting melted in a gas or oil fired\nfurnace, using gravity die casting or low-pressure die\ncasting method except aviation parts.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n\n1. Identify job\nrequirement\n\n1.1 Casting alloy requirements identified as per manufacturers\n/ suppliers catalogue, drawings, instruction sheets.\n1.2 Required specifications are cross checked with\ncorresponding international specification\n1.3 Casting method is determined by available die or mold\n(gravity or low-pressure die casting).\n1.4 Metal treatment is determined based on available product\nbulletin.\n1.5 Appropriate melting furnace selected as per required metal\ntreatment and type of crucible (stationary / dip-out or tilting).\n\n2. Establish melting\nand melt treatment\nprocess.\n\n2.1 Metal charges are fed as per standard operating procedures.\n2.2 Appropriate fluxing technique is performed based on\ncomposition of metal charges (virgin ingot and recycled\nscrap).\n2.3 Furnace is started up as per standard operating procedures.\n2.4 Appropriate degassing technique is applied as per standard\noperating procedures.\n2.5 Melt refining agent of the alloy is added as per standard\noperating procedures.\n2.6 Structured modification of the alloy is applied as per\nstandard operating procedures.\n2.7 Speed of melting is monitored to avoid oxidation.\n2.8 Pouring temperature is determined corresponding to the\nalloy and casting section thickness.\n2.9 Filtration method and location is decided on corresponding o\nthe alloy\n2.10 Metal is tapped from crucible with minimum turbulence to\navoid oxide formations.\n2.11 Pouring is accomplished in accordance with OH & S\nrequirements\n\n--- PDF PAGE 36 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY MELTING/ CASTING NC III Promulgated\n\n34\n\n3. Identify casting\nquality requirement.\n\n3.1 Casting quality requirements is identified based on job\nrequirements\n3.2 Content of contaminants which will affect integrity of the\ncasting is identified in accordance with procedures.\n3.3 Structural modification is applied in accordance with\nprocedures,\n3.4 Availability of chemical analysis results is coordinated with\nother section such as process control\n3.5 Written procedures to be followed during castings is\nestablished as per quality Handbook.\n\n4. Identify casting\ndefects cause by\nunsound melting\ntechnique.\n\n4.1 Nature of casting defects, its causes and the appropriate\nremedial actions is identified in accordance with standard\noperating procedures.\n4.2 Cause / effect analysis of the defect and other tools of quality\ncontrol is presented in coordination with the process\nengineer.\n4.3 Defective castings which showed up in machining and\npainting section are coordinated with the respective sections\nin accordance with company procedures\n4.4 Action plan to resolve the persistent casting defect is\nformulated and implemented (vital few / trivial many) in\naccordance with company procedures.\n4.5 Personnel involved in melting are re-oriented on correct\nmelting and treatment of aluminum-silicon alloy.\n4.6 Result of quality inspection is analyzed and measures are\nrecommended to quality\n\n5. Recycle scraps /\nturnings.\n\n5.1 Re-melting is accomplished in accordance with company\nstandard operating procedures\n5.2 Dross is completely removed from the melt before pouring\ninto pig ingot molds.\n5.3 Ingot type is labeled as per standard operating procedures\n5.4 Melt contamination is avoided by coating all tools which\ncomes into contact with the melt.\n5.5 Production reports are entered in pro-form with some\ncomment / recommendation for future production reference.\n\n--- PDF PAGE 37 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY MELTING/ CASTING NC III Promulgated\n\n35\n RANGE OF VARIABLE\n\nVARIABLE\nRANGE\n\n1. Casting alloy\nrequirement.\n1.1 Aluminum Silicon Alloy (AlSi) 12\n1.2 AlSi 12 Magnesium (Mg)\n1.3 AlSi 10\n1.4 AlSi 9 Mg\n1.5 AlSi 7 Mg\n1.6 AlSi 5 Mg.\n2. International\nspecification\n2.1 Society of Automotive Engineer (SAE)\n2.2 Japanese Industrial Standard (JIS)\n2.3 American Society Testing Materials (ASTM)\n2.4 German Standard (DIN)\n2.5 British Standard (BS)\n2.6 Australian Standard (AS)\n2.7 American Aluminum (AA)\n\n3. Metal treatment.\n3.1 Structural modifications.\n3.2 Refining agent-metallic sodium, permanently refined with\nstrontium.\n3.3 Titanium diboride.\n3.4 Flux\n3.5 Degasser\n3.6 Solution heat treatment / aging as necessary.\n\n4. Contaminants\n\n4.1 Iron content – max 0.15%.\n4.2 Manganese content – max 0.02%\n4.3 Copper content – less than 0.01%\n\n5. Casting defects\n\n5.1 Shrinkage.\n5.2 Blow-holes.\n5.3 Metal inclusions\n5.4 Oxide inclusions\n\n6. Production\nSafety tested castings produced include\n6.1 car wheels\n6.2 motor bike wheels\n6.3 brake pedals, etc…\n\n--- PDF PAGE 38 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY MELTING/ CASTING NC III Promulgated\n\n36\nEVIDENCE GUIDE\n\n1. Critical aspect\nof\n competency\nAssessment requires evidence that the candidate\n1.1 Identified job requirements.\n1.2 Established melting and melt treatment process.\n1.3 Identified casting quality requirement.\n1.4 Identified casting defects cause by un-sound melting technique.\n1.5 Recycled of scraps / turnings.\n1.6 Prepared reports\n\n2. Underpinning\nknowledge and\nattitudes\n2.1 Aluminum-silicon alloy specification\n2.2 Melting control of aluminum silicon alloy procedures\n2.3 Melt treatment of aluminum-silicon alloy procedures\n2.4 Casting chemical composition limits and subversive\n Elements (contaminants)\n2.5 Effects of chemical composition on integrity of the casting\n(strengths, ductility, surface finish)\n2.6 Charging sequence of metallic charges and melt treatment\n2.7 Pouring temperature range limits.\n2.8 Nature of casting defects attributable to melting and melt\ntreatment of aluminum-silicon alloy.\n2.9 Countermeasures to eliminate / minimize casting defects.\n2.10 Safety test applied to casting.\n2.11 Operation of emission spectrometer analyzer\n2.12 Safe work practice and procedures.\n2.13 Use and application of personal protective equipments.\n2.14 Operational hazards and control measures associated with\nmelting aluminum-silicon alloys.\n2.15 Applicable industry standards for aluminum-silicon alloy such\nas: AA, JIS, SAE, ASTM, DIN, BS and other published\nstandard by aluminum ingots supplier.\n\n3. Underpinning\n skills\n\n3.1 Reading and interpreting information on written job instructions,\nspecifications, standard operating procedures relevant test data\nsheets and other standard workplace forms. May include\ndrawings for furnace operation.\n3.2 Following oral instructions.\n3.3 Decide on raw materials.\n3.4 Weighing charge materials.\n3.5 Feeding materials into furnace.\n3.6 Measuring metal temperature and adjusting if necessary.\n3.7 Sampling for chemical analysis and for gas content analysis.\n3.8 Applying de-slagging, degassing, refining and modifying melting\ntechniques.\n\n--- PDF PAGE 39 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY MELTING/ CASTING NC III Promulgated\n\n37\n\n4. Resource\n implications\n\nThe following resources MUST be provided:\n4.1 All manuals/catalogues relative to Melting/Casting of\nAluminum-silicon alloys.\n4.2 Job order, requisitions slip for materials\n4.3 Materials, tools and equipment relevant to the activity\n4.4 Crucible furnace\n4.5 Spectrometer\n\n5. Method of\nassessment\n\nCompetency MUST be assessed through:\n5.1 Observation with questioning\n5.2 Portfolio\n5.3 Third party report\n\n6. Context of\nassessment\n6.1 Assessment must be undertaken in accordance with\n the endorsed TESDA assessment guidelines\n6.2 Assessment may be conducted in the workplace or a\n simulated environment\n\n--- PDF PAGE 40 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY MELTING/ CASTING NC III Promulgated\n\n38\nUNIT OF COMPETENCY :\nMELT METALS USING CORELESS INDUCTION\nFURNACE\n\nUNIT CODE\n\n:\nALT812316\n\nUNIT DESCRIPTOR\n:\nThis unit covers implementation of Quality Assurance and\nControl in Induction Furnace Melting, which would include\nlow frequency, medium frequency and high frequency\nfurnaces, melting a wide range of metals and the\noperational maintenance of the furnace crucible.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n\n1. Identify job\nrequirements.\n\n1.1 Melting and casting requirements identified as per\nmanufacturers/ suppliers catalogue, drawings, customer\nrequirements and instruction sheet\n1.2 Metal composition and casting properties is determined in\naccordance with standard operating procedures.\n1.3 Charge materials / ferro-alloys requirement are determined\nbased cast metal requirements.\n1.4 Melting / pouring temperature range are determined based\ncast metal requirements.\n\n2. Establish melting\nprocedure\n\n2.1 Melting procedure is written down as per standard operating\nprocedure.\n2.2 Raw materials, ferro-alloys and additives are specified as per\nprocedures\n2.3 Incoming materials are inspected as per standard operating\nprocedure.\n\n3. Perform material\ninspection.\n\n3.1 Material inspection is performed in accordance with the\nchecklist provided\n3.2 Retention is recorded (furnace log-book or record file per\nmaterial) as per company procedure.\n\n4. Control melting\nprocess.\n\n4.1 Furnace is prepared and started up as per standard\noperating procedures.\n4.2 Furnace is charged as per standard operating procedures.\n4.3 Chemical composition is analyzed either by emission\nspectrometric method or thermal analysis and corrective\nmeasures are undertaken to attain required composition.\n4.4 Required alloying element and deoxidant is added to the melt\nas per standard operating procedures\n4.5 Inoculation is performed to improve metal properties in\naccordance with recommended inoculation procedures and\n\n--- PDF PAGE 41 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY MELTING/ CASTING NC III Promulgated\n\n39\ntechniques.\n4.6 Melt change-over procedure is undertaken in accordance with\nstandard operating procedures\n4.7 Molten metal is performed applying the recommended\npouring technique.\n4.8 Production data is recorded in accordance with company\nrequirements\n\n5. Maintain furnace\ncrucible\n\n5.1 Crucible lining is inspected and findings are noted, in\nlogbook in accordance with company requirements\n5.2 Corrective measures are undertaken to restore the crucible\nlining to working condition\n5.3 Task is accomplished in accordance with OH & S\nrequirements\n\n--- PDF PAGE 42 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY MELTING/ CASTING NC III Promulgated\n\n40\n\nRANGE OF VARIABLE\n\nVARIABLE\nRANGE\n\n1. Charge materials.\n\n1.1 steel scrap\n1.2 pig iron\n1.3 return scrap\n1.4 purchased scrap\n1.5 ferro-alloys\n1.6 additives\n\n2. Cast metal\n\n2.1 gray cast iron and its alloy\n2.2 low, medium and high carbon steel and their alloys\n2.3 stainless steel\n\n3. Procedure\n\nProcedure should specify-\n3.1 What procedures are to be followed?\n3.2 What are the raw materials, ferro-alloys, additives\n3.3 What is to be measured?\n3.4 How is it measured?\n3.5 Instrument/tools?\n3.6 What is to be recorded?\n\n4. Checklist\n\n4.1 Characteristics of melting material (e.g. size).\n4.2 Contaminants as per chemical analysis.\n4.3 Checking frequency (once per shipment / 0.5kilo per ton).\n4.4 Quality checked (sample size).\n4.5 Checking method (visual, spectro, weigh scale).\n4.6 Personnel responsible (operation/process inspector).\n\n5. Production data\n\n5.1 Furnace charge weight\n5.2 Energy consumption, total cold charge material, amount of\nheel, tapping quantities, number of ladles.\n5.3 Type of casting poured, number of molds poured.\n\n6. Findings\n\nFindings in inspection of crucible lining include but not limited to:\n6.1 Lining wear data and wear pattern.\n6.2 Thickness of the lining.\n6.3 Number of heats made or through–put of the lining.\n6.4 Lining condition.\n\n--- PDF PAGE 43 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY MELTING/ CASTING NC III Promulgated\n\n41\nEVIDENCE GUIDE\n\n1. Critical aspect of\n Competency\n\nAssessment requires evidence that the candidate\n1.1 Identified job requirements.\n1.2 Established melting procedure.\n1.3 Performed material inspection.\n1.4 Controlled the melting process.\n1.5 Maintained furnace crucible\n\n2. Underpinning\nKnowledge and\nattitudes\n\n2.1 Foundry melting production process (from material selection to\nfettling and trimming).\n2.2 Procedure of quality assurance and control system including\ninspection and testing.\n2.3 Crucible conditions, faults and repair limits.\n2.4 Metallic charge materials, ferro-alloys, additives, ladle\nadditions.\n2.5 Weighing procedure and scale types.\n2.6 Thermocouple condition monitoring and adjustment\nmechanism.\n2.7 Interpretation of carbon equivalent (thermal analysis) and\nwedge chill test result.\n2.8 Coagulant agents, application and removal procedures.\n2.9 Applicable industry standard, JIS, ASTM, SAE, DIN, BS, AS\netc.\n2.10 Metallic charge materials and its characteristics.\n2.11 Metal composition and its effects on the mechanical physical\nproperties of the metal.\n2.12 Pouring temperature and its effect on the casting integrity.\n2.13 Proper pouring techniques.\n2.14 Effect of charge material on the mechanical / physical\nproperties of the metal.\n2.15 Effect of inoculation, ductile treatment, fade time or molten\nmetal.\n2.16 Use and application of personal protective equipments.\n2.17 Safe work practice and procedures.\n2.18 Hazard and control measure associated with operating\nmelting furnace.\n\n3. Underpinning skills\n\n3.1 Reading and interpreting information on written job instructions,\nspecifications, standard operating procedures relevant test data\nsheets and other standard workplace forms. May include\ndrawings for furnace operation.\n3.2 Following oral instructions.\n3.3 Deciding on charge materials.\n3.4 Weighing charge materials.\n3.5 Feeding materials into furnace.\n3.6Measuring metal temperature and correcting as necessary.\n\n--- PDF PAGE 44 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY MELTING/ CASTING NC III Promulgated\n\n42\n3.7 Sampling for chemical, carbon equivalent and wedge tests.\n3.8 Tapping the metal.\n3.9 Implement relevant check / test required procedures of Quality\nHandbook.\n3.10 Coordination skill with process inspector, pourer, furnace\noperator.\n3.11 Can accomplish chemical analysis using emission\nspectrometer, thermal analysis.\n3.12 Review, comprehend entries on melting section log-book.\n3.13 Good analysis technique of the limits of foundry melting\nprocess, analysis of melt and metal composition.\n\n4. Resource\nimplications\n\nThe following resources MUST be provided:\n4.1 Manuals/catalogues relative to Melting/Casting\n4.2 Job order, requisitions slip for materials\n4.3 Materials, tools and equipment relevant to the activity\n4.4 Incoming material receiving effort.\n4.5 Quality handbook procedure for melting.\n\n5. Method of\nassessment\n\nCompetency MUST be assessed through:\n5.1 Observation with questioning\n5.2 Portfolio\n5.3 Third Party Report\n\n6. Context of\nassessment\n\n6.1 Assessment must be undertaken in accordance with the\nendorsed TESDA assessment guidelines\n6.2 Assessment may be conducted in the workplace or a simulated\nenvironment.\n\n--- PDF PAGE 45 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY MELTING/ CASTING NC III Promulgated\n\n43\n\nUNIT OF COMPETENCY :\nMELT AUTOMOTIVE GRAY IRON CASTINGS IN\nCUPOLA\n\nUNIT CODE\n\n:\nALT812317\n\nUNIT DESCRIPTOR\n:\nThis unit covers melting of automotive truck, tractor, and\nallied industries gray iron casting using cupola as a basic\nmelter in conjunction with a holding furnace or induction\nfurnace as refiner. This unit applies to melting of automotive\ngrades gray iron castings used in the production of\nautomobile, trucks, tractors and allied industries as covered\nby ASTM-A159.\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n\n1. Identify casting\nrequirement\n\n1.1 Mechanical and physical properties of gray cast iron\ncasting are determined from product drawing, industrial\nstandards, instruction sheet and technical bulletins or specific\nstandards such as ASTM-A159, ASTM-247 and E-10.\n1.2 Base metal is selected based on ASTM-159 specifications\n1.3 Specific location of hardness and micro-structure tests\nidentified based on customer requirements.\n1.4 Other relevant requirement is determined according to\ncustomer requirements i.e. heat-treatment, metal processing.\n\n2. Select melting\nmaterials.\n\n2.1 High-grade raw materials are selected must be, consistent\nwith automotive grade casting.\n2.2 Charge analysis is undertaken and converted to appropriate\nfurnace charge.\n2.3 Requisitions are completed as required according to\nstandard operating procedures.\n2.4 Furnace charge is weighed according to standard operating\nprocedures.\n\n3. Melt base iron\n\n3.1 Cupola furnace is prepared as per standard operating\nprocedures.\n3.2 Cupola furnace is charged as per standard operating\nprocedures.\n3.3 Cupola melt is monitored including testing of chemical\ncomposition and melt temperature as per standard\noperating procedures.\n3.4 Adapt corrective measures are undertaken to attain required\nchemical composition.\n3.5 Wedge chill testing is conducted and rectification measures\nare undertaken to attain desired results.\n3.6 Molten metal is transferred to cupola fore-hearth as per\nstandard operating procedures.\n\n--- PDF PAGE 46 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY MELTING/ CASTING NC III Promulgated\n\n44\n\n4. Perform duplexing\nand control\nactivities.\n\n4.1 Molten metal is transferred to an induction furnace\nduplexing furnace in accordance with standard operating\nprocedures and OH & S requirements.\n4.2 Metal is desulfurized (0.02% MAX) if making nodular\n(Ductile) cast iron, before transferring to the induction furnace\nas per standard operating procedures.\n4.3 Required alloying element is added to the melt as per\nstandard operating procedures.\n4.4 Chemical composition analysis is undertaken and adjusted, if\nrequired, as per standard operating procedures.\n4.5 Metal temperature is raised to tapping value and wedge chill\ntest undertaken as per standard operating procedures.\n4.6 Molten metal is transferred to pouring ladle for inoculation and\npouring as per standard operating procedures.\n\n5. Perform inoculation\nprocedures\n\n5.1 Appropriate inoculants is selected compatible with type of\ncasting, its size and section thickness.\n5.2 Inoculation is performed to improve metal properties in\naccordance with recommended inoculation procedures and\ntechniques.\n5.3 Wedge chill value is taken before and after inoculation as per\nstandard operating procedures.\n5.4 “Dead melt” time and pouring time is control as per standard\noperating procedures.\n\n6. Conduct gray iron\ncasting testing and\ninspection.\n\n6.1 Agreement is secured from the customer regarding what to\ntest, where to test which will correspond with ASTM\nstandards or JIS standards, as the case maybe.\n6.2 Visual inspection is conducted using “color check” or dye\npenetrants.\n6.3 Dimensional inspection is performed as per standard\noperating procedures.\n6.4 File test is performed to determine chills on casting edges.\n6.5 Other standard method of inspection is implemented assume\ncasting integrity.\n6.6 Repair agreement is secured from the customer as to location\nof defect and its extent.\n6.7 Scrap diagnosis is spearheaded and coordinated with\nmachine shop and process engineering personnel.\n\n--- PDF PAGE 47 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY MELTING/ CASTING NC III Promulgated\n\n45\nRANGE OF VARIABLE\n\nVARIABLE\nRANGE\n\n1. Mechanical and\nphysical\nproperties\n1.1 Brinnel Hardness\n1.2 Tensile strength\n1.3 Graphite distribution\n1.4 Form\n1.5 Size and\n1.6 Matrix.\n2. Other relevant\nrequirements\n2.1 Heat treatment\n2.2Metal processing\n\n3. Raw materials\n\n3.1 Pig iron\n3.2 Steel scrap\n3.3 Return scrap\n3.4 Carburizer\n3.5 Siliconizing\n3.6 Limestone\n3.7Inoculants\n4. Automotive grade\ncasting\n4.1 Chemistry\n4.2 Size\n4.3 Purity\n\n5. Chemical\ncomposition\n5.1 Carbon\n5.2 Silicon\n5.3 Manganese\n5.4 Sulphur\n5.5Phosphorous.\n\n6. Induction furnace\n duplexing\n6.1 Good temperature control (holding / tapping).\n6.2 Addition of alloying element is very simple.\n6.3 Good control for chemical composition and analysis.\n6.4Flexibility is good.\n\n7. Inoculants\n\n7.1. Graphitizer.\n7.2. Stabilizer\n7.3. Special inoculants\n7.4.Size / fineness compatible with volume of treated metal\n\n--- PDF PAGE 48 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY MELTING/ CASTING NC III Promulgated\n\n46\n\nEVIDENCE GUIDE\n\n1. Critical aspect of\n competency\nAssessment requires evidence that the candidate\n1.1 Identified casting requirements.\n1.2 Selected melting materials.\n1.3 Melted base iron.\n1.4 Performed duplexing and control activities.\n1.5 Performed Inoculation procedures.\n1.6 Conducted gray iron casting testing and inspection.\n\n2. Underpinning\nknowledge and\nattitudes\n2.1 Foundry melting production process (from material selection to\nfettling and trimming).\n2.2 Procedure of quality assurance and control system including\ninspection and testing.\n2.3 Crucible conditions, faults and repair limits.\n2.4 Metallic charge materials, ferro-alloys, additives, ladle additions.\n2.5 Weighing procedure and scale types.\n2.6 Thermocouple condition monitoring and adjustment mechanism.\n2.7 Interpretation of carbon equivalent (thermal analysis) and wedge\nchill test result.\n2.8 Coagulant agents, application and removal procedures.\n2.9 Applicable industry standard, JIS, ASTM, SAE, DIN, BS, AS etc.\n2.10Metallic charge materials and its characteristics.\n2.11 Metal composition and its effects on the mechanical physical\nproperties of the metal.\n2.12 Pouring temperature and its effect on the casting integrity.\n2.13 Proper pouring techniques.\n2.14 Effect of charge material on the mechanical / physical\nproperties of the metal.\n2.15 Effect of inoculation, ductile treatment, fade time or molten\n metal.\n2.16 Use and application of personal protective equipments.\n2.17 Safe work practice and procedures.\n2.18 Hazard and control measure associated with operating melting\nfurnace.\n\n--- PDF PAGE 49 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY MELTING/ CASTING NC III Promulgated\n\n47\n\n3. Underpinning\n skills\n\n3.1 Reading and interpreting information on written job instructions,\nspecifications, standard operating procedures relevant test data\nsheets and other standard workplace forms and drawings for\nfurnace operation.\n3.2 Following oral instructions\n3.3 Deciding on charge materials\n3.4 Weighing charge materials\n3.5 Feeding materials into furnace\n3.6 Measuring metal temperature and correcting as necessary\n3.7 Sampling for chemical, carbon equivalent and wedge tests\n3.8 Tapping the metal.\n3.9 Implement relevant check / test required procedures of Quality\nHandbook.\n3.10 Coordination skill with process inspector, pourer, furnace operator\n3.11 Can accomplish chemical analysis using emission\nspectrometer, thermal analysis.\n3.12 Review, comprehend entries on melting section log-book.\n3.13 Good analysis technique of the limits of foundry melting process,\nanalysis of melt and metal composition.\n\n4. Resource\nimplications\n\nThe following resources MUST be provided:\n4.1 All manuals/catalogues relative to Melting/Casting\n4.2 Job order, requisitions slip for materials\n4.3 Materials, tools and equipment relevant to the activity\n4.4 Incoming material receiving effort.\n4.5Quality handbook procedure for melting.\n\n5. Method of\nassessment\n\nCompetency MUST be assessed through:\n5.1 Observation with questioning\n5.2 Portfolio\n5.3Third party report\n\n6. Context of\nassessment\n6.1 Assessment must be undertaken in accordance with\n the endorsed TESDA assessment guidelines\n6.2 Assessment may be conducted in the workplace or a\n simulated environment\n\n--- PDF PAGE 50 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY MELTING/ CASTING NC III Promulgated\n\n48"
}
