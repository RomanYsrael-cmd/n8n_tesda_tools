    "source_text": "3.1 CURRICULUM DESIGN\n\nCourse Title: Foundry-Melting/Casting\n NC Level: NC III\n\nNominal Training Duration:\n20Hours (Basic Competencies)\n\n20 Hours (Common Competencies)\n68 Hours (Core Competencies)\nCourse Description:\n\nThis course is designed to equip individual the competencies that a person must achieve\nto be able to melt aluminum-silicon alloys for safety tested castings; melt Metals using\ncoreless induction furnace and melt automotive gray iron castings in cupola.\n\nBasic competencies such as: Lead workplace communication; Lead small teams;\nDevelop and practice negotiation skills; Solve problems related to work activities; Use\nmathematical concepts and techniques and Use relevant technologies are included.\nIt also includes common competencies such as: Read, Interpret and Apply Engineering\nDrawings; Perform Mensuration and Calculation Read; Interpret and Apply Specifications and\nManuals and; Perform Shop Maintenance.\n\nTo obtain this, all units prescribed for this qualification must be achieved.\n\nBASIC COMPETENCIES\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Lead workplace\ncommunication\n1.1 Communicate information\nabout workplace processes.\n1.2 Lead workplace discussions.\n1.3 Identify and communicate\nissues arising in the\nworkplace\n• Group\ndiscussion\n• Role Play\n• Brainstorming\n\n• Observation\n• Interviews\n2. Lead small\nteams\n2.1 Provide team leadership.\n2.2 Assign responsibilities among\nmembers.\n2.3 Set performance expectation\nfor team members.\n\n1.3 Supervise team performance\n• Lecture\n• Demonstration\n• Self-paced\n(modular)\n• Demonstration\n• Case studies\n3. Develop and\npractice\nnegotiation skills\n1.1 Identify relevant information in\nplanning negotiations\n1.2 Participate in negotiations\n1.3 Document areas for\nagreement\n• Direct\nobservation\n• Simulation/rol\ne playing\n•\nCase studies\n• Written test\n• Practical/\nperformance test\n\n--- PDF PAGE 51 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY MELTING/ CASTING NC III Promulgated\n\n49\n4. Solve workplace\nproblem related\nto work activities\n4.1 Explain the analytical\ntechniques.\n4.2 Identify the problem.\n4.3 Determine the possible\ncause/s of the problem.\n• Direct\nobservation\n• Simulation/role\nplaying\n•\nCase studies\n• Written test\n• Practical/\nperformance test\n5. Use\nmathematical\nconcepts and\ntechniques\n5.1 Identify mathematical tools and\ntechniques to solve problem\n5.2 Apply mathematical\nprocedures/solution\n5.3 Analyze results\n• Direct\nobservation\n• Simulation/\nrole playing\n•\nCase studies\n• Written test\n• Practical/\nperformance test\n6. Use relevant\ntechnologies\n6.1 Identify appropriate\ntechnology\n6.2 Apply relevant technology\n6.3 Maintain/enhance relevant\ntechnology\n• Direct\nobservation\n• Simulation/rol\ne playing\n•\nCase studies\n• Written test\n• Practical/\nperformance test\n\nCOMMON COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1 Read, Interpret\nand Apply\nEngineering\nDrawings\n1.1 Identify and access\nengineering drawings/\nspecification\n1.2 Interpret drawings\n1.3 Apply information in the\ndrawings & specifications\n1.4 Store drawings\n• Lecture/\nDemonstration\n• Dual training\n\n• Direct\nobservation\n• Interview\n2. Perform\nMensuration\nand Calculation\n2.1 Select measuring instrument\nand\n2.2 Carry out measurement and\ncalculations.\n2.3 Maintain measuring\ninstruments\n• Lecture/\nDemonstration\n• Simulation\n• Exercises\n\n• Written test\n• Oral questioning\n• Direct\nobservation\n\n3. Read, Interpret\nand Apply\nSpecifications\nand Manual\n4.. Identify/accessed manuals\nand interpret data and\nspecification\n4.2 Apply information accessed\nin manual\n4.3 Store manual\n• Lecture/\nDemonstration\n• Dual training\n• Distance\nLearning\n• Written test\n• Direct\nobservation\n• Project method\n• Interview\n5. Perform Shop\nMaintenance\n\n5.1 Inspect/clean tools and work\narea\n5.2 Store/arrange tools and shop\nequipment\n5.3 Dispose wastes/used\nlubricants\n5.4 Report damaged\ntools/equipment\n• Lecture/\nDemonstration\n• Dual training\n• Self paced\n(modular)\n• Simulation\n• Written test\n• Direct\nobservation\n• Demonstration\n• Interview\n\n--- PDF PAGE 52 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY MELTING/ CASTING NC III Promulgated\n\n50\nCORE COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Melt\nAluminum-\nSilicon Alloys\nfor Safety\nTested\nCasting\n1.1 Identify job requirement\n1.2 Establish melting and melt\ntreatment process\n1.3 Identify casting quality\nrequirement\n1.4 Identify casting defects cause by\nunsound melting technique\n1.5 Recycle scraps/turnings\n• Lecture/\nDemonstration\n• Dual training\n\n• Observation\nwith\nQuestioning\n• Demonstration\nof practical\nskills\n• Interview\n•\nPortfolio\n2. Melt Metals\nUsing\nCoreless\nInduction\nFurnace\n2.1 Identify job requirements\n2.2 Establish melting procedures\n2.3 Perform material inspection\n2.4 Control melting process\n2.5 Maintain furnace crucible\n• Lecture/\nDemonstration\n• Dual training\n\n• Observation\nwith\nQuestioning\n• Demonstration\nof practical\nskills\n• Interview\n•\nPortfolio\n3. Melt\nAutomotive\nGray Iron\nCasting in\nCupola\n3.1 Identify casting requirements\n3.2 Select melting materials\n3.3 Melt base iron\n3.4 Perform duplexing and control\nactivities\n3.5 Perform inoculation procedures\n3.6 Conduct gray iron casting\ntesting and inspection\n• Lecture/\nDemonstration\n• Dual training\n\n• Observation\nwith\nQuestioning\n• Demonstration\nof practical\nskills\n• Interview\n•\nPortfolio\n\n--- PDF PAGE 53 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY MELTING/ CASTING NC III Promulgated\n\n51"
