  "source_text": "SECTION 4 NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1 To attain the National Qualification of FOUNDRY MELTING/CASTING NC III, the\ncandidate must demonstrate competence in all the units listed in Section 1.\nSuccessful candidates shall be awarded a National Certificate signed by the TESDA\nDirector General.\n\n4.2 Individual aspiring to be awarded the qualification of FOUNDRY MELTING/CASTING\nNC III must demonstrate competency in all the following core units of the Qualification\nthrough a single project-type assessment. Candidates may apply for assessment in\nany accredited assessment center.\n\n4.2.1 Melt Foundry Alloys\n Melt Aluminum-Silicon Alloys for Safety Tested Castings\n Melt Metals Using Coreless Induction Furnace\n Melt Automotive Gray Iron Castings in Cupola\n\n4.3 Assessment shall focus on the core units of competency. The basic and common\nunits shall be integrated or assessed concurrently with the core units.\n\n4.4 The following are qualified to apply for assessment and certification:\n\n4.4.1 Holder of Foundry Melting/Casting NC II or equivalent qualification; or\n\n4.4.2 Graduates of formal, non-formal and informal including\nenterprise-based training programs.\n\n4.4.3 Experienced workers (wage employed or self-employed)\n\n4.5 The guidelines on assessment and certification are discussed in detail in the\nProcedures Manual on Assessment and Certification and Guidelines on the\nImplementation of the Philippine TVET Qualification and Certification System\n(PTQCS).\n\n--- PDF PAGE 58 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY MELTING/ CASTING NC III Promulgated\n 56\n\nFOUNDRY- MELTING/CASTING NC III\n\n"
}
