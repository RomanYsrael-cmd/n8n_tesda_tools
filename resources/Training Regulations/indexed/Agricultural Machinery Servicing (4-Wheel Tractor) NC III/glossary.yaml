  "source_text": "4-WHEEL TRACTOR\nRefers to describe a farm vehicle that provides the power\nand traction to mechanize agricultural tasks, especially for\ntilling operations\n\nACCESSORIES\nRefers to additional items or parts to complete a certain\nunit and does not have of any importance in the system\n\nELECTROLYTIC TYPE Refers to a type of battery which can be charged by\nreversing internal reactions inside the system\n\nEQUIPMENT\nRefers to tools or any tangible resources to be used to\nperform the study of four-wheel tractor servicing\ne.g. four-wheel tractor and air compressor\n\nHYDRAULIC SYSTEM\nRefers to a system where fluids (oil, in this case) are\ninvolved\n\nMAINTENANCE FREE\nTYPE\nRefers to a type of battery that does not need for\nmaintaining the water/acid level inside the system\n\nSERVICE\nRefers to diagnosing, repairing and replacement\nSPECIAL TOOLS\nRefer to tools to repair or troubleshoot four-wheel tractor\nunit/s which are not available in the market, and should\nbe fabricated to fit to a particular system of a four-wheel\ntractor\n\n--- PDF PAGE 177 ---\nAgricultural Machinery Servicing (4 – Wheel Tractor) NC III Revision 00 Promulgated 01/11/2019 173\n\n\n\n\n\n\n\nTRAINING REGULATIONS (TRs)\nDOCUMENT REVISION HISTORY\n\n\n\n\nQualification Title: Agricultural Machinery Servicing NCIII\nQualification\nCode:\nAFFAMS318\n\n\n\n\n\nRevision\nNo.\nDocument\nDescription Types*\nReplaces\nVersion\n(TESDA Board\nResolution\nNo./ Date)\nNew Version\n(TESDA Board\nResolution\nNo./ Date)\nDeployme\nnt Circular\n00\nDocument Created\nAgricultural Machinery\nServicing NC III\nNot Applicable\nTB No.2019-02\nJanuary 11, 2019\n\nNot\nApplicable\n Legend: *Description Types\n- Document Created\n- Document Amended\n\n--- PDF PAGE 178 ---\nAgricultural Machinery Servicing (4 – Wheel Tractor) NC III Revision 00 Promulgated 01/11/2019 174",
