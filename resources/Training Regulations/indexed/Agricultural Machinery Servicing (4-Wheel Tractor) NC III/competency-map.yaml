  "source_text": "Section 1\nAGRICULTURAL MACHINERY SERVICING (4-WHEEL TRACTOR) NC III\nQUALIFICATION\n\nThe AGRICULTURAL MACHINERY SERVICING (4-WHEEL TRACTOR) NC III\nQualification consists of competencies that a person must achieve to diagnose and repair\nelectrical systems, engine system, axle system, hydraulic system and transmission system\nof 4 – wheel drive tractor. It includes competencies on practicing safety measures and\nwaste management. This may be performed by a team of technical personnel or with one\nor more assistants working with the lead technical personnel.\n\nThis Qualification is packaged from the competency map of the Agri-Fishery Sector as\nshown in Annex A.\n\nThe units of competency comprising this qualification includes the following:\n\nCode\nBASIC COMPETENCIES\n400311319\nLead workplace communication\n400311320\nLead small teams\n400311321\n\nApply critical thinking and problem-solving techniques in the\nworkplace\n400311322\nWork in a diverse environment\n400311323\n\nPropose methods of applying learning and innovation in the\norganization\n400311324\nUse information systematically\n400311325\nEvaluate occupational safety and health work practices\n400311326\nEvaluate environmental work practices\n400311327\nFacilitate entrepreneurial skills for micro-small-medium\nenterprises (MSMEs)\n\n\nCode\nCOMMON COMPETENCIES\nAFF321201\nApply safety measures in farm operations\nAFF321202\nUse farm servicing tools and equipment\nAFF321203\nPerform estimation and calculations\nAFF321205\nProcess farm wastes\nSOC 413206\nMaintain service records\nAFF 723201\nConduct Diagnosis\nAFF 723202\nPerform Shop Maintenance\n\n\nCode\nCORE COMPETENCIES\nAFF 723303\nDiagnose and Repair Electrical Systems of 4-Wheel Tractor\nAFF 723304\nDiagnose and Repair Engine System of 4-Wheel Tractor\nAFF 723305\nDiagnose and Repair Axle System of 4-Wheel Tractor\nAFF 723306\nDiagnose and Repair Hydraulic System of 4-Wheel Tractor\nAFF 723307\nDiagnose and Repair Transmission System of 4-Wheel Tractor\n\nA person who has achieved this Qualification is competent to be:\n• 4-Wheel Tractor Mechanic\n• Senior Mechanic\n• 4-Wheel Tractor Servicing Personnel\n\n--- PDF PAGE 6 ---\nAgricultural Machinery Servicing (4 – Wheel Tractor) NC III Revision 00 Promulgated 01/11/2019 2"
