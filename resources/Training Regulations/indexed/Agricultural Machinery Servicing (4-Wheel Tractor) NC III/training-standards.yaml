eedback\n\n• Lecture/\nDiscussion\n• Role Play\n• Case Study\n• Role Play\n• Written Test\n\n1 hour\n3. Apply critical\nthinking and\nproblem-\nsolving\ntechniques in\nthe workplace\n3.1 Examine specific\nworkplace\nstrategies\n\n\n\n\n• Show thorough knowledge and\nunderstanding of the process,\nnormal operating parameters, and\nproduct quality to recognize non-\nstandard situations\n• Show mastery of the current\nindustry hardware and software\nproducts and services\n• Discuss process of identification of\nfundamental causes of specific\nworkplace challenges\n• Show mastery of knowledge and\nunderstanding of the process,\nnormal operating parameters, and\nproduct quality to recognize non-\nstandard situations\n- Relevant equipment and\noperational processes\n- Enterprise goals, targets and\nmeasures\n- Enterprise quality OHS and\nenvironmental requirement\n- Enterprise information systems\nand data collation\n- Industry codes and standards\n• Group\ndiscussion\n• Lecture\n• Demonstration\n• Role playing\n• Case Formulation\n• Life Narrative\nInquiry (Interview)\n• Standardized test\n1 hour\n\n--- PDF PAGE 111 ---\nAgricultural Machinery Servicing (4 – Wheel Tractor) NC III Revision 00 Promulgated 01/11/2019 107\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\n3.1 Analyze the\ncauses of\nspecific\nworkplace\nchallenges\n\n• Show thorough knowledge and\nunderstanding of the process,\nnormal operating parameters, and\nproduct quality to recognize non-\nstandard situations\n• Show mastery of the current\nindustry hardware and software\nproducts and services\n• Discuss process of identification of\nfundamental causes of specific\nworkplace challenges\n• Show mastery of knowledge and\nunderstanding of the process,\nnormal operating parameters, and\nproduct quality to recognize non-\nstandard situations\n- Relevant equipment and\noperational processes\n- Enterprise goals, targets and\nmeasures\n- Enterprise quality OHS and\nenvironmental requirement\n- Enterprise information systems\nand data collation\n- Industry codes and standards\n• Identify extent and causes of\nspecific challenges in the workplace\n• Use of range of analytical problem-\nsolving techniques\n• Formulate clear-cut findings on the\nnature of each identified workplace\nchallenges\n• Group\ndiscussion\n• Lecture\n• Demonstration\n• Role playing\n• Case Formulation\n• Life Narrative\nInquiry (Interview)\n• Standardized test\n1 hour\n\n--- PDF PAGE 112 ---\nAgricultural Machinery Servicing (4 – Wheel Tractor) NC III Revision 00 Promulgated 01/11/2019 108\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\n\n\n\n\n\n3.2 Formulate\nresolutions to\nspecific\nworkplace\nchallenges\n\n• Show thorough knowledge and\nunderstanding of the process,\nnormal operating parameters, and\nproduct quality to recognize non-\nstandard situations\n• Show mastery of the current\nindustry hardware and software\nproducts and services\n• Discuss process of identification of\nfundamental causes of specific\nworkplace challenges\n• Show mastery of knowledge and\nunderstanding of the process,\nnormal operating parameters, and\nproduct quality to recognize non-\nstandard situations\n- Relevant equipment and\noperational processes\n- Enterprise goals, targets and\nmeasures\n- Enterprise quality OHS and\nenvironmental requirement\n- Enterprise information systems\nand data collation\n- Industry codes and standards\n• Identify extent and causes of\nspecific challenges in the workplace\n• Use of range of analytical problem-\nsolving techniques\n• Formulate clear-cut findings on the\nnature of each identified workplace\nchallenges\n• Group\ndiscussion\n• Lecture\n• Demonstration\n• Role playing\n• Case Formulation\n• Life Narrative\nInquiry (Interview)\n• Standardized test\n\n\n\n1 hour\n\n--- PDF PAGE 113 ---\nAgricultural Machinery Servicing (4 – Wheel Tract