) \n• Demonstrate different methods of \nverbal and non-verbal \ncommunication in a multicultural \nsetting \n• Apply cross-cultural communication \nskills (i.e. different business \ncustoms, beliefs, communication \n• Small Group \nDiscussion \n• Interactive \nLecture \n• Brainstorming \n• Demonstration \n• Role-playing \n• Demonstration or \nsimulation with oral \nquestioning \n• Group discussions \nand interactive \nactivities \n• Case studies/ \nproblems involving \nworkplace diversity \nissues \n• Written \nexamination \n• Role Playing \n1 hour\n\n--- PDF PAGE 114 ---\nAgricultural Machinery Servicing (4 – Wheel Tractor) NC III Revision 00 Promulgated 01/11/2019 110 \n \nUnit of \nCompetency \nLearning \nOutcomes \nLearning Activities \nMethodology \nAssessment \nApproach \nNominal \nDuration \nstrategies) \n• Show affective skills – establishing \nrapport and empathy, \nunderstanding, etc. \n• Demonstrate openness and \nflexibility in communication \n• Recognize diverse groups in the \nworkplace and community as \ndefined by divergent culture, \nreligion, traditions and practices \n \n \n4.2 Work effectively in \nan environment \nthat \nacknowledges \nand values \ncultural diversity \n• Explain the value of diversity in the \neconomy and society in terms of \nWorkforce development \n• Discuss the importance of \ninclusiveness in a diverse \nenvironment \n• Discuss the importance of shared \nvision and understanding of and \ncommitment to team, departmental, \nand organizational goals and \nobjectives \n• Identify and exhibit strategies for \ncustomer service excellence \n• Demonstrate cross-cultural \ncommunication skills and active \nlistening \n• Recognize diverse groups in the \nworkplace and community as \ndefined by divergent culture, \nreligion, traditions and practices \n• Demonstrate collaboration skills \n• Small Group \nDiscussion \n• Interactive \nLecture \n• Brainstorming \n• Demonstration \n• Role-playing \n• Demonstration or \nsimulation with ora