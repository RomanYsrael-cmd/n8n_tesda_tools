  "source_section_text": "SECTION 3. TRAINING ARRANGEMENTS \n \nThese guidelines are set to provide the Technical and Vocational Education and \nTraining (TVET) providers with information and other important requirements to consider \nwhen designing training programs for AGRICULTURAL MACHINERY SERVICING (4-\nWHEEL TRACTOR) NC III. \n \n3.1 CURRICULUM DESIGN \n \nCourse Title: AGRICULTURAL MACHINERY SERVICING (4-WHEEL TRACTOR) \nNC Level: NC III \n \nNominal Training Duration: \n 40 hrs – Basic Competencies \n \n \n \n \n 151 hrs – Common Competencies \n \n \n 480 hrs – Core Competencies \n \n \n 671 hrs \n \n \n 176 hrs - SIT \n \n 847 hrs – Total \n \n \nCourse Description: \n \nThis course is designed to provide the learner with knowledge, practical skills and \nattitude, applicable in performing work activities involve in diagnosing and repairing \nelectrical system, engine system, axle system, hydraulic system and transmission system \nof 4 – wheel tractor. This include classroom learning activities and practical work in actual \nwork site or simulation area. \n \nUpon completion of the course, the learners are expected to demonstrate the \nabove-mentioned competencies to be employed. To obtain this, all units prescribed for \nthis qualification must be achieve\n\n--- PDF PAGE 108 ---\nAgricultural Machinery Servicing (4 – Wheel Tractor) NC III Revision 00 Promulgated 01/11/2019 104 \n \n \nBASIC COMPETENCIES \n40 hours \n \nUnit of \nCompetency \nLearning \nOutcomes \nLearning Activities \nMethodology \nAssessment \nApproach \nNominal \nDuration \n1. Lead workplace \ncommunication \n1.1 Communicate \ninformation about \nworkplace \nprocesses \n• Read \n• Lecture \n• Written Test \n2 Hours \no Effective verbal communication \nmethods \n \no Sources of information \n \n• Practice organizing information \n• Demonstration \n• Observation \n \n• Identify organization requirements \nfor written and electronic \ncommunication methods \n• Lecture \n• Written Test \n \n• Follow organization requirements \nfor the use of written and electronic \ncommunication methods \n• Demonstration \n• Practical \nexercises \n• Observation \n \n• Perform exercises on understanding \nand conveying intended meaning \nscenario \n• Demonstration \n• Role Play \n• Observation \n \n \n1.2 Lead workplace \ndiscussions \n• Describe: \no Organizational policy on \nproduction, quality and safety \n• Group \ndiscussion \n• Oral evaluation \n2 Hours \n \no Goals/ objectives and action plan \nsetting \n \n \n• Read \n• Lecture \n• Written Test \n \n \no Effective verbal communication \nmethods \n \n \n \n \n• Prepare/set action plans based on \norganizational goals and objectives \n• Demonstration \n• Observation\n\n--- PDF PAGE 109 ---\nAgricultural Machinery Servicing (4 – Wheel Tractor) NC III Revision 00 Promulgated 01/11/2019 105 \n \nUnit of \nCompetency \nLearning \nOutcomes \nLearning Activities \nMethodology \nAssessment \nApproach \nNominal \nDuration \n \n1.3 Identify and \ncommunicate \nissues arising in \nthe workplace \n• Describe: \no Organizational policy in dealing \nwith issues and problems \n• Group \ndiscussion \n• Oral evaluation \n2 Hours \n \n• Read \n• Lecture \n• Written Test \n \n \no Effective verbal communication \nmethods \n \n2. Lead small \nteams \n2.1 Provide team \nleadership \n \n• Discussion of Company policies \nand procedures \n• Read web pages on situational \nleadership \n• Role play on situational leadership \n• Group work \n• Role Play \n• Lecture/ \nDiscussion \n• Individual \nWork \n \n• Role Play \n• Written Test \n \n1 hour \n \n2.2 Assign \nresponsibilities \n• Read web pages on performance \nmanagement \n• Case study on allocating roles and \nresponsibilities based on \ncompetencies of current staff \n \n• Individual Work \n• Case Study \n• Role Play \n• Written Test \n \n1 hour \n \n2.3 Set performance \nexpectations for \nteam members \n• Role play to communicate \nperformance expectations with staff \n• Discussion on performance issues \n \n• Lecture/ \nDiscussion \n• Role Play \n• Role Play \n• Written Test \n \n1 hour\n\n--- PDF PAGE 110 ---\nAgricultural Machinery Servicing (4 – Wheel Tractor) NC III Revision 00 Promulgated 01/11/2019 106 \n \n \n2.4 Supervise team \nperformance \n• Discussion on performance \nmonitoring \n• Role play on providing feedback on \nperformance \n• Role play on performance coaching \n• Discussion on keeping the team \ninformed of team performance \n• Case study on Team performance \nmonitoring and feedback \n \n• Lecture/ \nDiscussion \n• Role Play \n• Case Study \n• Role Play \n• Written Test \n \n1 hour \n3. Apply critical \nthinking and \nproblem-\nsolving \ntechniques in \nthe workplace \n3.1 Examine specific \nworkplace \nstrategies \n \n \n \n \n• Show thorough knowledge and \nunderstanding of the process, \nnormal operating parameters, and \nproduct quality to recognize non-\nstandard situations \n• Show mastery of the current \nindustry hardware and software \nproducts and services \n• Discuss process of identification of \nfundamental causes of specific \nworkplace challenges \n• Show mastery of knowledge and \nunderstanding of the process, \nnormal operating parameters, and \nproduct quality to recognize non-\nstandard situations \n- Relevant equipment and \noperational processes \n- Enterprise goals, targets and \nmeasures \n- Enterprise quality OHS and \nenvironmental requirement \n- Enterprise information systems \nand data collation \n- Industry codes and standards \n• Group \ndiscussion \n• Lecture \n• Demonstration \n• Role playing \n• Case Formulation \n• Life Narrative \nInquiry (Interview) \n• Standardized test \n1 hour\n\n--- PDF PAGE 111 ---\nAgricultural Machinery Servicing (4 – Wheel Tractor) NC III Revision 00 Promulgated 01/11/2019 107 \n \nUnit of \nCompetency \nLearning \nOutcomes \nLearning Activities \nMethodology \nAssessment \nApproach \nNominal \nDuration \n \n3.1 Analyze the \ncauses of \nspecific \nworkplace \nchallenges \n \n• Show thorough knowledge and \nunderstanding of the process, \nnormal operating parameters, and \nproduct quality to recognize non-\nstandard situations \n• Show mastery of the current \nindustry hardware and software \nproducts and services \n• Discuss process of identification of \nfundamental causes of specific \nworkplace challenges \n• Show mastery of knowledge and \nunderstanding of the process, \nnormal operating parameters, and \nproduct quality to recognize non-\nstandard situations \n- Relevant equipment and \noperational processes \n- Enterprise goals, targets and \nmeasures \n- Enterprise quality OHS and \nenvironmental requirement \n- Enterprise information systems \nand data collation \n- Industry codes and standards \n• Identify extent and causes of \nspecific challenges in the workplace \n• Use of range of analytical problem-\nsolving techniques \n• Formulate clear-cut findings on the \nnature of each identified workplace \nchallenges \n• Group \ndiscussion \n• Lecture \n• Demonstration \n• Role playing \n• Case Formulation \n• Life Narrative \nInquiry (Interview) \n• Standardized test \n1 hour\n\n--- PDF PAGE 112 ---\nAgricultural Machinery Servicing (4 – Wheel Tractor) NC III Revision 00 Promulgated 01/11/2019 108 \n \nUnit of \nCompetency \nLearning \nOutcomes \nLearning Activities \nMethodology \nAssessment \nApproach \nNominal \nDuration \n \n \n \n \n \n \n3.2 Formulate \nresolutions to \nspecific \nworkplace \nchallenges \n \n• Show thorough knowledge and \nunderstanding of the process, \nnormal operating parameters, and \nproduct quality to recognize non-\nstandard situations \n• Show mastery of the current \nindustry hardware and software \nproducts and services \n• Discuss process of identification of \nfundamental causes of specific \nworkplace challenges \n• Show mastery of knowledge and \nunderstanding of the process, \nnormal operating parameters, and \nproduct quality to recognize non-\nstandard situations \n- Re