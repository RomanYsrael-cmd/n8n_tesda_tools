Eliminate discriminatory behavior\ntowards customers and co-workers\n• Utilize change management policies\nin the workplace\n\n• Small Group\nDiscussion\n• Interactive\nLecture\n• Brainstorming\n• Demonstration\n• Role-playing\n• Demonstration or\nsimulation with oral\nquestioning\n• Group discussions\nand interactive\nactivities\n• Case studies/\nproblems involving\nworkplace diversity\nissues\n• Written\nexamination\n• Role Playing\n5. Propose\nmethods of\napplying\nlearning and\ninnovation in\nthe\norganization\n5.1 Assess work\nprocedures,\nprocesses and\nsystems in\nterms of\ninnovative\npractices\n\n• Show mastery of the following\npractical concepts (e.g., 7 habits of\nhighly effective people, character\nstrengths that foster learning and\ninnovation, five minds of the future,\nadaptation concepts and\ntranstheoretical model of behavior\nchange)\n• Demonstrate collaboration and\nnetworking skills\n• Show basic skills in research\n• Generate practical insights on how\nto improve organizational\nprocedures, processes and systems\n• Interactive\nLecture\n• Appreciative\nInquiry\n• Demonstration\n• Group work\n• Psychological and\nbehavioral\nInterviews\n• Performance\nEvaluation\n• Life Narrative\nInquiry\n• Review of\nportfolios of\nevidence and third-\nparty workplace\nreports of on-the-\njob performance.\n• Standardized\n\n--- PDF PAGE 116 ---\nAgricultural Machinery Servicing (4 – Wheel Tractor) NC III Revision 00 Promulgated 01/11/2019 112\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\nassessment of\ncharacter\nstrengths and\nvirtues applied\n\n5.2 Generate\npractical action\nplans for\nimproving work\nprocedures,\nprocesses\n• Show mastery of the following\npractical concepts (e.g., 7 habits of\nhighly effective people, character\nstrengths that foster learning and\ninnovation, five minds of the future,\nadaptation concepts and\ntranstheoretical model of behavior\nchange)\n• Demonstrate collaboration and\nnetworking skills\n• Show basic skills in research\n• Generate practical insights on how\nto improve organizational\nprocedures, processes and systems\n• Set up action plans on how to apply\ninnovative procedures in the\norganization\n• Set up action plans on how to apply\ninnovative procedures in the\norganization\n• Generate practical insights on how\nto improve organizational\nprocedures, processes and systems\n• Interactive\nLecture\n• Appreciative\nInquiry\n• Demonstration\n• Group work\n• Psychological and\nbehavioral\nInterviews\n• Performance\nEvaluation\n• Life Narrative\nInquiry\n• Review of\nportfolios of\nevidence and third-\nparty workplace\nreports of on-the-\njob performance.\n• Standardized\nassessment of\ncharacter\nstrengths and\nvirtues applied\n1 hours\n\n5.3 Evaluate the\neffectiveness\nof the\nproposed\naction plans\n• Show mastery of the following\npractical concepts (e.g., 7 habits of\nhighly effective people, character\nstrengths that foster learning and\ninnovation, five minds of the future,\n• Interactive\nLecture\n• Appreciative\nInquiry\n• Demonstration\n• Psychological and\nbehavioral\nInterviews\n• Performance\nEvaluation\n1 hour\n\n--- PDF PAGE 117 ---\nAgricultural Machinery Servicing (4 – Wheel Tractor) NC III Revision 00 Promulgated 01/11/2019 113\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\nadaptation concepts and\ntranstheoretical model of behavior\nchange)\n• Demonstrate collaboration and\nnetworking skills\n• Show basic skills in research\n• Generate practical insights on\ncontinuous improvement\n• Group work\n• Life Narrative\nInquiry\n• Review of\nportfolios of\nevidence and third-\nparty workplace\nreports of on-the-\njob performance.\n• Standardized\nassessment of\ncharacter\nstrengths and\nvirtues applied\n6. Use\ninformation\nsystematic\nally\n\n6.1 Use technical\ninformation\n• Lecture and discussion on:\n- Application in collating\ninformation\n- Procedures for inputting,\nmaintaining and archiving\ninformation\n- Guidance to people who need to\nfind and use information\n• Organizing information into a\nsuitable form for reference and use\n• Classify stored information for\nidentification and retrieval\n• Operate the technical information\nsystem by using agreed procedures\n• Lecture\n• Group\nDiscussion\n• Hands on\n• Demonstration\n• Oral evaluation\n• Written Test\n• Observation\n• Presentation\n4 Hours\n\n--- PDF PAGE 118 ---\nAgricultural Machinery Servicing (4 – Wheel Tractor) NC III Revision 00 Promulgated 01/11/2019 114\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\n6.2 Apply information\ntechnology (IT)\n• Lecture and discussion on:\n- Attributes and limitations of\navailable software tool\n- Procedures and work instructions\nfor the use of IT\n- Operational requirements for IT\nsystems\n- Sources and flow paths of data\n- Security systems and measures\nthat can be used\n- Methods of entering and\nprocessing information\n• Use procedures and work\ninstructions for the use of IT\n• Extract data and format reports\n• Use WWW applications\n• Lecture\n• Group\nDiscussion\n• Self-paced\nhandout/\nmodule\n• Hands on\n• Demonstration\n• Oral evaluation\n• Written Test\n• Observation\n• Presentation\n2 Hours\n\n6.3 Edit, format and\ncheck information\n• Lecture and discussion on:\n- Basic file-handling techniques\n- Techniques in checking\ndocuments\n- Techniques in editing and\nformatting\n- Proof reading techniques\n• Use different techniques in checking\ndocuments\n• Edit and format information applying\ndifferent techniques\n• Proof read information applying\ndifferent techniques\n• Lecture\n• Group\nDiscussion\n• Self-paced\nhandout/\nmodule\n• Hands on\n• Demonstration\n• Oral evaluation\n• Written Test\n• Observation\n• Presentation\n2 Hours\n7. Evaluate\nOccupation\nal Safety\n7.1 Interpret\nOccupational