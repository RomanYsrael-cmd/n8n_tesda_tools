      "source_text": "3.2 TRAINING DELIVERY\n\n1. The delivery of training shall adhere to the design of the curriculum. Delivery\n shall be guided by the principles of competency-based TVET.\n\n\na. Course design is based on competency standards set by the industry or\nrecognized\nindustry\nsector;\n(Learning\nsystem\nis\ndriven\nby\ncompetencies written to industry standards)\n\nb. Training delivery is learner-centered and should accommodate\nindividualized and self-paced learning strategies;\n\nc. Training can be done on an actual workplace setting, simulation of a\nworkplace and/or through adoption of modern technology.\n\nd. Assessment is based in the collection of evidence of the performance of\nwork to the industry required standards;\n\ne. Assessment of competency takes the trainee’s knowledge and attitude\ninto account but requires evidence of actual performance of the\ncompetency as the primary source of evidence.\n\nf. Training program allows for recognition of prior learning (RPL) or current\ncompetencies;\n\ng. Training completion is based on satisfactory performance of all specified\ncompetencies.\n\n\n2. The competency-based TVET system recognizes various types of delivery\nmodes, both on-and off-the-job as long as the learning is driven by the\ncompetency standards specified by the industry. The following training\nmodalities and their variations/components may be adopted singly or in\ncombination with other modalities when designing and delivering training\nprograms:\n\nInstitution- Based:\n\n• Dual Training System (DTS)/Dualized Training Program (DTP) which\ncontain both in-school and in-industry training or fieldwork components.\nDetails can be referred to the Implementing Rules and Regulations of the\nDTS Law and the TESDA Guidelines on the DTP;\n\n• Distance learning is a formal education process in which majority of the\ninstruction occurs when the students and instructor are not in the same\nplace. Distance learning may employ correspondence study, audio, video,\ncomputer technologies or other modern technologies that can be used to\n\n--- PDF PAGE 164 ---\nAgricultural Machinery Servicing (4 – Wheel Tractor) NC III Revision 00 Promulgated 01/11/2019 160\n\nfacilitate learning and formal and non-formal training. Specific guidelines\non this mode shall be issued by the TESDA Secretariat.\n\n• Distance learning may employ correspondence study, audio, video,\ncomputer technologies that can be used to facilitate learning and formal\nand non-formal training. Specific guidelines on this mode shall be issued\nby the TESDA Secretariat.\n\n• The classroom- based or in – center instruction uses of learner –centered\nmethods as well as laboratory or field- work components.\n\n\nEnterprise-Based:\n\n•\nFormal Apprenticeship – Training within employment involving a contract\nbetween an apprentice and an enterprise on an approved apprenticeable\noccupation.\n\n•\n Informal Apprenticeship - is based on a training (and working) agreement\nbetween an apprentice and a master craftsperson wherein the agreement\nmay be written or oral and the master craftsperson commits to training the\napprentice in all the skills relevant to his or her trade over a significant\nperiod of time, usually between one and four years, while the apprentice\ncommits to contributing productively to the work of the business. Training\nis integrated into the production process and apprentices learn by working\nalongside the experienced craftsperson.\n\n•\nEnterprise-based Training - where training is implemented within the\ncompany in accordance with the requirements of the specific company.\nSpecific guidelines on this mode shall be issued by the TESDA\nSecretariat.\n\n Community-Based\n\n• Short term programs conducted by non- government organizations\nNGOs, LGUs, training centers and other TVET providers which are\nintended to address the specific needs of a community. Such programs\ncan be conducted in informal settings such as barangay hall, basketball\ncourts, etc. These programs can also be mobile training program (MTP)\n\n--- PDF PAGE 165 ---\nAgricultural Machinery Servicing (4 – Wheel Tractor) NC III Revision 00 Promulgated 01/11/2019 161"
