llowing: \n \n• Must be a licensed B.S. Agricultural Engineer \n• Must be a holder of National TVET Trainer Certificate on Agricultural \nMachinery Servicing (4-WheelTractor) NCIII \n• Must have at least two (2) years job/industry experience within the last \nfive (5) years \n \n3.7. \nINSTITUTIONAL ASSESSMENT \n \nInstitutional assessment is undertaken by trainees to determine their \nachievement of units of competency . A certificate of achievement is issued for \neach unit of competency.\n\n--- PDF PAGE 173 ---\nAgricultural Machinery Servicing (4 – Wheel Tractor) NC III Revision 00 Promulgated 01/11/2019 169"
