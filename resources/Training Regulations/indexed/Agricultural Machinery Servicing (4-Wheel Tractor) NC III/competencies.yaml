        "evidence_guide": {
          "source_text": "1. Critical Aspects of Competency \nAssessment requires evidence that the candidate: \n1.1 Service clutch system \n1.1.1 Reviewed handling requirement of oil and \nlubricant based on SDS and GHS \n1.1.2 Adjusted clutch clearances \n1.1.3 Carried out Removal and replacement of \ndefective clutch parts \n1.1.4 Applied safety practices following OSHS \nRule 1090, Rule 1080 and Rule 1150 \n1.2 Service drive train system \n1.2.1 Reviewed handling requirement of oil and \nlubricant based on SDS and GHS \n1.2.2 Checked tightening torques of the drive \n train system bolts \n1.2.3 Checked gear spacing clearance \n1.2.4 Inspected gear shafting and bearings \n1.2.5 Adjusted shift forks and levers \n1.2.6 Removed and replaced damaged parts \n1.2.7 Applied safety practices following OSHS \nRule 1090, Rule 1080 and Rule 1150 \n1.3 Complete work processes \n1.3.1 Made final inspection \n1.3.2 Turned-over tractor to immediate superior \n1.3.3 Restored work area following 5S of good \n housekeeping. \n1.3.4 Practiced waste management following \nenvironmental laws \n1.3.5 Checked and stored tools and equipment \n2. Resource Implications \nThe following resources should be provided: \n2.1 Actual or simulated workplace \n2.2 Tools materials and equipment needed to perform \nthe required tasks \n2.3 References and manuals \n2.4 PPE \n2.5 First Aid Kit PPE \n3. Method of Assessment \n \nCompetency in this unit may be assessed through: \n3.1 Demonstration/Observation with Oral Questioning \n3.2 Portfolio with Interview \n3.3 Written Test \n3.4 Third-party report \n4. Context of Assessment \n4.1 Competency maybe assessed in actual workplace \nor at the designated TESDA accredited Assessment \nCenter.\n\n--- PDF PAGE 107 ---\nAgricultural Machinery Servicing (4 – Wheel Tractor) NC III Revision 00 Promulgated 01/11/2019 103"
        },
