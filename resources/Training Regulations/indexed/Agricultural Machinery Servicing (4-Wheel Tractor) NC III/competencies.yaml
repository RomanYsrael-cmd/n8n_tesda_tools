        "source_text": "AFF723202 \n \nUNIT DESCRIPTOR \n: This unit covers knowledge, skills and attitude to \nmaintain work area, tools and equipment, store tools \nand shop equipment, dispose waste and used liquid, \nand prepare proper inventory. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range of \nVariables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Maintain \nwork area, \ntools and \nequipment \n1.1 Cleanliness and \norderliness of work \narea is maintained in \naccordance with \ncompany/office \nprocedures. \n1.2 Tools and equipment \nare cleaned in \naccordance with \nmanufacturer’s \ninstruction manual. \n1.3 Work area is \narranged according \nto job requirements. \n1.4 Tools, supplies and \nequipment are \nchecked. \n1.5 Wet surfaces in work \narea is wiped and \ndried \n1.1 Workshop \nprocedures. \n1.2 Proper use \nand \nmaintenance \nof tools and \nequipment \n1.3 Personal \nSafety \nprocedures \n1.4 Handling of \nHazardous \nmaterials \n1.5 Different \ncleaning \nagents and \nlubricants. \n1.6 Occupational \nHealth and \nsafety \n1.7 Attitudes: \n• Perseverance \n• Honesty \n• Patience \nAttention to \ndetail \n1.1 Handling \ncleaning agent \nand grease / \nlubricants \n1.2 Maintaining tools \nand equipment. \n1.3 Inspecting tools \nand equipment \n2. Store tools \nand shop \nequipment \n2.1 Tools and \nequipment are \nstored in their \nrespective \nshelves/location. \n2.2 Tools and \nequipment are \narranged in \naccordance with \ncompany/office \nprocedures. \n2.3 Corresponding \n2.1 Labeling \nprocedures \n2.2 Storing \nProcedures \n2.3 Personal \nSafety \nprocedures \n2.4 Handling of \nHazardous \nmaterials \n2.5 Occupation\nal Health \n2.1 Handling and \nstorage of tools / \nequipment / \nsupplies and \nmaterials. \n2.2 Labeling tools, \nequipment and \nwork area\n\n--- PDF PAGE 68 ---\nAgricultural Machinery Servicing (4 – Wheel Tractor) NC III Revision 00 Promulgated 01/11/2019 64 \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range of \nVariables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \nvisible labels are \nposted in work \narea. \n2.4 Tools and \nequipment are \nlabeled based on \nprocedure. \nand safety \n2.6 Attitudes \nPerseveran\nce \nHonesty \nPatience \nAttention to \ndetail \n3. Dispose \nwastes/us\ned liquids \n3.1 Containers for \nused liquids are \nvisibly labeled. \n3.2 Wastes/used \nliquids are \ndisposed as per \nworkshop \nStandard \nOperating \nProcedure (SOP) \n3.3 Waste are \nsegregated \naccording to 3R’s \n3.4 Safety measures \nare practiced \nfollowing OSHS \n3.1 3R and \nenvironment\nal rules and \nregulations \n3.2 Different \ntypes of \nwastes \n3.3 Handling of \nHazardous \nmaterials \n3.4 OSHS \n3.5 Attitudes: \nPerseveran\nce Honesty \nPatience \nAttention to \ndetail \n \n3.1 Disposing of \nwastes and \nfluids \n3.2 Practicing \nOSHS and \n3R’s \n \n \n4. Prepare \ninventory \nreports \n4.1 Tools are safely \nsecured and \nlogged in the \nrecords \n4.2 Complete \ninventory of \ntools/equipment is \nmaintained. \n4.3 Damaged and \ndefective tools, \nequipment and \nare segregated. \n4.4 Repair \nrecommendations \nare submitted to \nimmediate \nsupervisor. \n4.5 Inventory reports \nare prepared. \n4.1 Inventory \nprocedures \n4.2 Different \ndamages and \ndefects of tools \nand equipment \n4.3 Report \npreparation \n4.4 Procedures in \naccomplishing \nwork \n \n4.1 Processing of \ndamage and \naccident reports \n4.2 Monitor \ninventory of \ntools and \nequipment \n4.3 Preparing report \n4.4 Accomplishing \nforms \n4.5 Communication\ns skills \n4.6 Mathematical \nskills\n\n--- PDF PAGE 69 ---\nAgricultural Machinery Servicing (4 – Wheel Tractor) NC III Revision 00 Promulgated 01/11/2019 65 \n \n \nRANGE OF VARIABLES \n \n1. Manufacturer instruction \nmanual \n \nManufacturer instruction manual may include: \n1.1 Tools/equipment manufacturer specifications \n1.2 Company operating procedure. \n1.3 Product manufacturer specifications \n2. Work Area \n \nWork area includes: \n2.1 Area used for servicing or repairing equipment. \n2.2 Workshop \n2.3 On-site / on-field where service / repair is done. \n3. Tools \n \nTools may include: \n3.1 Wrenches \n3.2 Hammer \n3.3 Pliers \n3.4 Pullers \n4. Supplies \n \nSupplies may include: \n4.1 Fuel/Oil \n4.2 Cleaning Fluids \n4.3 Adhesive Fluids \n5. Equipment \n \n Equipment may include: \n5.1 Compressors \n5.2 Drills \n5.3 Hydraulic Press \n5.4 Lifter \n6. Liquids \n \nLiquids may include: \n6.1 Oil \n6.2 Fuel \n6.3 Solvents \n6.4 Water Solutions \n7. Damaged and defective \ntools and equipment \n \nDamaged and defective tools and equipment may \ninclude: \n7.1 Worn out \n7.2 Bent \n7.3 Rusted \n7.4 Chipped \n7.5 Misaligned \n7.6 Broken\n\n--- PDF PAGE 70 ---\nAgricultural Machinery Servicing (4 – Wheel Tractor) NC III Revision 00 Promulgated 01/11/2019 66 \n \n \n \n \n \nEVIDENCE GUIDE \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 Cleaned the work area \n1.2 Maintained tools, equipment and facilities \n1.3 Disposed of waste materials as prescribed. \n2. Resource Implications \nThe following resources should be provided: \n2.1 Work Area \n2.2 Tools and Equipment \n2.3 Materials needed for the job \n3. Method of Assessment \n \nCompetency in this unit may be assessed through: \n3.1 \nDemonstration of practical skills \n3.2 \nWritten examination \n3.3 \nInterview \n3.4 \nPortfolio \n3.5 \nThird-party report \n4. Context of Assessment \n4.1 Assessment of skills must take place after a period of \nsupervised practice and repetitive experience.\n\n--- PDF PAGE 71 ---\nAgricultural Machinery Servicing (4 – Wheel Tractor) NC III Revision 00 Promulgated 01/11/2019 67 \n \n \nCORE COMPETENCIES \n \nUnit of Competency : DIAGNOSE AND REPAIR ELECTRICAL SYSTEMS OF 4- \nWHEEL TRACTOR \n \nUnit Code :"
