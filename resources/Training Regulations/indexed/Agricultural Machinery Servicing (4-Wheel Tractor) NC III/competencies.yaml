io (citations/awards from GOs and NGOs, certificate \nof training – local and abroad) \n 3.4 Simulations and role-plays \n4. Context for Assessment \n4.1 Competency may be assessed in actual workplace or \n at the designated TESDA center.\n\n--- PDF PAGE 42 ---\nAgricultural Machinery Servicing (4 – Wheel Tractor) NC III Revision 00 Promulgated 01/11/2019 38 \n \n \nUNIT OF COMPETENCY : \nFACILITATE ENTREPRENEURIAL SKILLS FOR \nMICRO-SMALL-MEDIUM ENTERPRISES (MSMEs) \n \n UNIT CODE \n: \n400311327 \n \nUNIT DESCRIPTOR \n: \nThis unit covers the outcomes required to build, operate \nand grow a micro/small-scale enterprise. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range of \nVariables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Develop and \nmaintain \nmicro-small-\nmedium \nenterprise \n(MSMEs) \nskills in the \norganization \n1.1 Appropriate business \nstrategies are \ndetermined and set for \nthe enterprise based on \ncurrent and emerging \nbusiness environment. \n1.2 Business operations \nare monitored and \ncontrolled following \nestablished procedures. \n1.3 Quality assurance \nmeasures are \nimplemented \nconsistently. \n1.4 Good relations are \nmaintained with \nstaff/workers. \n1.5 Policies and procedures \non occupational safety \nand health and \nenvironmental concerns \nare constantly observed. \n1.1 Business \nmodels and \nstrategies \n1.2 Types and \ncategories of \nbusinesses \n1.3 Business \noperation \n1.4 Basic \nBookkeeping \n1.5 Business \ninternal controls \n1.6 Basic quality \ncontrol and \nassurance \nconcepts \n1.7 Government \nand regulatory \nprocesses \n \n1.1 Basic \nbookkeeping/ \naccounting \nskills \n1.2 Communication \nskills \n1.3 Building \nrelations with \ncustomer and \nemployees \n1.4 Building \ncompetitive \nadvantage of \nthe enterprise \n2. Establish and \nMaintain \nclient-\nbase/market \n2.1 Good customer relations \nare maintained \n2.2 New customers and \nmarkets are identified, \nexplored and reached \nout to. \n2.3 Promotions/Incentives \nare offered to loyal \ncustomers \n2.4 Additional products and \nservices are evaluated \nand tried where feasible. \n2.5 Promotional/advertisin\ng initiatives are carried \nout where necessary \nand feasible. \n2.1 Public relations \nconcepts \n2.2 Basic product \npromotion \nstrategies \n2.3 Basic market \nand feasibility \nstudies \n2.4 Basic business \nethics \n2.1 Building \ncustomer \nrelations \n2.2 Individual \nmarketing skills \n2.3 Using basic \nadvertising \n(posters/ \ntarpaulins, \nflyers, social \nmedia, etc.) \n3. Apply \nbudgeting \nand financial \n3.1 Enterprise is built up \nand sustained through \njudicious control of cash \n3.1 Cash flow \nmanagement \n3.1 Setting business \npriorities and \nstrategies\n\n--- PDF PAGE 43 ---\nAgricultural Machinery Servicing (4 – Wheel Tractor) NC III Revision 00 Promulgated 01/11/2019 39 \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range of \nVariables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \nmanagement \nskills \nflows. \n3.2 Profitability of enterprise \nis ensured though \nappropriate internal \ncontrols. \n3.3 Unnecessary or lower-\npriority expenses and \npurchases are avoided. \n3.1 Basic financial \nmanagement \n3.2 Basic financial \naccounting \n3.3 Business \ninternal controls \n \n3.2 Interpreting \nbasic financial \nstatements \n3.3 Preparing \nbusiness plans \n \n \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Business strategies \nMay include: \n1.1. Developing/Maintaining niche market \n1.2. Use of organic/healthy ingredients \n1.3. Environment-friendly and sustainable practices \n1.4. Offering both affordable and high-quality products \nand services \n1.5. Promotion and marketing strategies (e. g., on-line \nmarketing) \n2. Business operations \nMay include: \n2.1 Purchasing \n2.2 Accounting/Administrative work \n2.3 Production/Operations/Sales \n3. Internal controls \nMay include: \n3.1 Accounting systems \n3.2 Financial statements/reports \n3.3 Cash management \n4. Promotional/Advertising \ninitiatives \nMay include: \n4.1 \nUse of tarpaulins, brochures, and/or flyers \n4.2 \n Sales, discounts and easy payment terms \n4.3 \nUse of social media/Internet \n4.4 \n“Service with a smile” \n4.5 \nExtra attention to regular customers\n\n--- PDF PAGE 44 ---\nAgricultural Machinery Servicing (4 – Wheel Tractor) NC III Revision 00 Promulgated 01/11/2019 40 \n \n \n \nEVIDENCE GUIDE \n \n1. Critical aspects of \ncompetency \nAssessment requires evidence that the candidate : \n1.1 Demonstrated basic entrepreneurial skills \n1.2 Demonstrated ability to conceptualize and plan a \nmicro/small enterprise \n 1.3 Demonstrated ability to manage/operate a micro/small-\nscale business \n2. Resource \nImplications \nThe following resources should be provided: \n \n2.1 Simulated or actual workplace \n2.2 Tools, materials and supplies needed to demonstrate the \nrequired tasks \n2.3 References and manuals \n3. Methods of \nAssessment \nCompetency in this unit may be assessed through : \n3.1 Written examination \n3.2 Demonstration/observation with oral questioning \n3.3 Portfolio assessment with interview \n3.4 Case problems \n4. Context of \nAssessment \n4.1 Competency may be assessed in workplace or in a \nsimulated workplace setting \n4.2 Assessment shall be observed while tasks are being \nundertaken whether individually or in-group\n\n--- PDF PAGE 45 ---\nAgricultural Machinery Servicing (4 – Wheel Tractor) NC III Revision 00 Promulgated 01/11/2019 41 \n \nCOMMON COMPETENCIES \n \nUNIT OF COMPETENCY \n: \nAPPLY SAFETY MEASURES IN FARM OPERATIONS \n \nUNIT CODE \n: \nAFF321201 \n \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge, skills and attitudes required \nto perform safety measures effectively and efficiently. It \nincludes identifying areas, tools, materials, time and place \nin performing safety measures. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Determine \nareas of \nconcern for \nsafety \nmeasures \n1.1 Work tasks are \nidentified in line with \nfarm operations \n1.2 Place for safety \nmeasures are \ndetermined in line \nwith farm operations \n1.3 Time for safety \nmeasures are \ndetermined in line \nwith farm operations \n1.4 Appropriate tools, \nmaterials and \noutfits are prepared \nin line with job \nrequirements \n1.1 Different work \ntasks in farm \noperations \n1.2 Place and time \nfor \nimplementation \nof safety \nmeasures \n1.3 Different hazards \nin the workplace \n1.4 Types of tools, \nmaterials and \noutfits \n1.5 Preparation of \ntools, materials \nand outfits \n1.1 Identifying work \ntasks in farm \noperations \n1.2 Determining place \nand time for \nimplementation of \nsafety measures \n1.3 Reading labels, \nmanuals and \nother basic safety \ninformation \n1.4 Identifying \neffective/functiona\nl tools, materials \nand outfit \n1.5 Preparing tools, \nmaterials and \noutfits \n1.6 Discarding \ndefective tools, \nand materials \n2. Apply \nappropriate \nsafety \nmeasures \n2.1 Tools and materials \nare used according to \nspecifications and \nprocedures \n2.2 Outfits are worn \naccording to farm \nrequirements \n2.3 Effectivity/shelf \nlife/expiration of \nmaterials are strictly \nobserved \n2.4 Emergency \nprocedures are \nknown and followed \nto ensure a safe work \nrequirement \n2.5 Hazards in the \nworkplace are \n2.1 Uses and \nfunctions of tools \n2.2 Outfits and how \nto wear it. \n2.3 Expiration/shelf \nlife of materials \n2.4 Proper disposal \nof expired \nmaterials \n2.5 Environmental \nrules and \nregulations \n2.6 Emergency \nprocedures \n2.7 Hazards \nidentification and \nreporting \n2.8 Communication \n2.1 Using tools and \nmaterials in the \nworkplace \n2.2 Wearing of \noutfits \n2.3 Observing \nexpiration/ shelf \nlife of materials \n2.4 Disposing of \nexpired materials \n2.5 Followi