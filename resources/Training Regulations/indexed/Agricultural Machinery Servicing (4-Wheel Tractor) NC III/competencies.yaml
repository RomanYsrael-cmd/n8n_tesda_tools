ic Distributor \n1.2.1 Reviewed handling requirement of oil \nand lubricant based on SDS and GHS \n1.2.2 Conducted pressure tests \n1.2.3 Checked and replaced seals \n1.2.4 Adjusted hydraulic flow rate \n1.2.5 Applied safety practices following \nOSHS Rule 1090, Rule 1080 and Rule \n1150 \n1.3 Service Hydraulic Lift Arms \n1.3.1 Reviewed handling requirement of oil \nand lubricant based on SDS and GHS \n1.3.2 Checked and replaced bearings and \nsprings \n1.3.3 Adjusted hydraulic lift arms \n1.3.4 Repaired mechanical control levers \n1.3.5 Applied safety practices following \nOSHS Rule 1090, Rule 1080 and Rule \n1150 \n1.4 Service Hydraulic pressure lines blocks and \nreservoir \n1.4.1 Reviewed handling requirement of oil \nand lubricant based on SDS and GHS \n1.4.2 Checked and replaced hydraulic \npressure lines, blocks and reservoir \n1.4.3 Conducted pressure test \n1.4.4 Performed replenishing and \nreplacement of Hydraulic oil \n1.4.5 Applied safety practices following \nOSHS Rule 1090, Rule 1080 and Rule \n1150 \n1.5 Complete work processes \n1.1.1 Made final inspection \n1.1.2 Turned-over tractor to client \n1.1.3 Practiced waste management \n1.1.4 Checked and stored tools and \nequipment \n2. Resource Implications \nThe following resources should be provided: \n2.1 Actual or simulated workplace \n2.2 Tools materials and equipment needed to perform \nthe required tasks \n2.3 References and manuals \n2.4 PPE\n\n--- PDF PAGE 100 ---\nAgricultural Machinery Servicing (4 – Wheel Tractor) NC III Revision 00 Promulgated 01/11/2019 96 \n \n2.5 First Aid Kit PPE \n3. Method of Assessment \n \nCompetency in this unit may be assessed through: \n3.1 Demonstration/Observation with Oral Questioning \n3.2 Portfolio with Interview \n3.3 Written Test \n3.4 Third-party report \n4. Context of Assessment \n4.1 Competency maybe assessed in actual workplace \nor at the designated TESDA accredited Assessment \nCenter.\n\n--- PDF PAGE 101 ---\nAgricultural Machinery Servicing (4 – Wh