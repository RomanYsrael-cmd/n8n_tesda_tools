          "source_text": "1. \nCritical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 \nDetermined areas of concern for safety measures \n1.2 \nApplied appropriate safety measures according to industry \nrequirements \n1.3 \nPrepared tools, materials and outfit needed \n1.4 \nPerformed proper disposal of used materials \n1.5 \nCleaned and stored tools, materials and outfit in designated \nfacilities \n2. \nResource \nImplications \nThe following resources should be provided: \n2.1 \nFarm location \n2.2 \nTools, equipment and outfits appropriate in applying safety \nmeasures \n3. \nMethod of \nAssessment \nCompetency in this unit must be assessed through: \n3.1 \nPractical demonstration \n3.2 \nThird Party Report \n4. \nContext of \nAssessment \n4.1. Competency maybe assessed in actual workplace or at the \ndesignated TESDA Accredited Assessment Center.\n\n--- PDF PAGE 49 ---\nAgricultural Machinery Servicing (4 – Wheel Tractor) NC III Revision 00 Promulgated 01/11/2019 45 \n \nUNIT OF COMPETENCY : USE AND MAINTAIN FARM SERVICING TOOLS \n AND EQUIPMENT \n \nUNIT CODE \n :"
