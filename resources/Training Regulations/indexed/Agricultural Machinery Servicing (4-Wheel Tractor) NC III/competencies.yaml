h \nfarm procedures \n3.2 Routine check-up and \nmaintenance of \ntesting equipment \nand accessories are \nperformed according \nto \nmanufacturer’specifica\ntion. \n3.3 Servicing tools, \ntesting equipment \nand accessories are \ninventoried based on \nwork requirements \n3.4 Servicing tools are \nstored in designated \nareas in line with \nmanufacturer’s \nspecifications. \n3.1 Cleaning procedures \n3.2 Farm procedures \n3.3 Check -up and \nmaintenance \nprocedures \n3.4 Inventory \nprocedures \n3.5 Storage procedures \n3.6 Waste Management \n3.7 5S of Good \nHousekeeping \n3.8 OSHS \n \n3.1 Cleaning \nservicing tools \n3.2 Performing \nroutine check -\nup and \nmaintenance \n3.3 Conducting \ninventory of \nservicing tools, \ntesting \nequipment and \naccessories \n3.4 Storing \nservicing tools \n3.5 Applying safety \npractices\n\n--- PDF PAGE 51 ---\nAgricultural Machinery Servicing (4 – Wheel Tractor) NC III Revision 00 Promulgated 01/11/2019 47 \n \n \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. \nTesting equipment and \naccessories \n \nTesting equipment and accessories includes: \n1.1 Load tester \n1.2 Engine analyzer \n1.3 Stability analyzer \n1.4 Wheel balancer \n1.5 Hydraulic lift \n1.6 Compressors \n1.7 Power sprayer \n1.8 Frame engine hoist \n2. \nServicing tools \nServicing tools includes: \n2.1 Wrenches set \n2.2 Screw drivers set \n2.3 Hammers \n2.4 Pliers \n2.5 Testers \n2.6 Special tools \n2.7 Chisels \n2.8 Gauges \n2.9 Hydraulic jack \n2.10 Sockets and drivers \n2.11 Pullers \n3. \nPre-operation check-up \nPre-operation check-up may include: \n3.1 Tires assembly (pressure & bolt tightness) \n3.2 Level of brake fluid \n3.3 Level of Fuel \n3.4 Level of Water \n3.5 Level of Lubricants \n3.6 Battery\n\n--- PDF PAGE 52 ---\nAgricultural Machinery Servicing (4 – Wheel Tractor) NC III Revision 00 Promulgated 01/11/2019 48 \n \n \n \nEVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 Selected and used servicing tools \n1.2 Selected and operated testing equipment and accessories \n1.3 Performed preventive maintenance \n2. Resource \nImplications \nThe following resources should be provided: \n2.1 Actual or simulated workplace \n2.2 Tools materials and equipment needed to perform the required \ntasks \n2.3 References and manuals \n2.4 PPE \n2.5 First Aid Kit PPE \n3. Method of \nAssessment \n \nCompetency in this unit may be assessed through: \n3.1 Demonstration/Observation with Oral Questioning \n3.2 Portfolio with Interview \n3.3 Written Test \n3.4 Written Report \n4. \nContext of \nAssessment \n4.1 Competency maybe assessed in actual workplace or at the \ndesignated TESDA accredited Assessment Center.\n\n--- PDF PAGE 53 ---\nAgricultural Machinery Servicing (4 – Wheel Tractor) NC III Revision 00 Promulgated 01/11/2019 49 \n \n \n \n \n \nUNIT OF COMPETENCY : \nPERFORM ESTIMATION AND BASIC \n \n \nCALCULATION \n \nUNIT CODE \n: \n \nAFF321203 \n \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge, skills and attitudes \nrequired to perform basic workplace calculations. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are \nelaborated in the Range of \nVariables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Perform \nestimation \n1.1 Job requirements are \nidentified from written or \noral communications \n1.2 Quantities of materials \nand resources required \nto complete a work task \nare estimated \n1.3 The time needed to \ncomplete a work activity \nis estimated \n1.4 Accurate estimate for \nwork completion are \nmade \n1.5 Estimate of materials and \nresources are reported to \nappropriate person \n1.1 Job \nrequirements/ \nlabor needs \n1.2 Calculation of \nquantities of \nmaterials and \nresources \nrequired \n1.3 Calculation of \ntime for job \ncompletion \n1.4 Preparation of \nestimate report \n1.5 Basic \nmathematical \noperations \n1.6 Percentage and \nratios \n1.7 Unit Conversion \n1.1 Identifying job \nrequirements/ \nlabor \n1.