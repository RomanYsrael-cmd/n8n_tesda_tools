        "source_text": "400311325 \n \nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes required \nto interpret Occupational Safety and Health practices, set \nOSH \nwork \ntargets, \nand \nevaluate \neffectiveness \nof \nOccupational Safety and Health work instructions. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Interpret \nOccupational \nSafety and \nHealth practices \n \n1.1 OSH work \npractices issues \nare identified \nrelevant to work \nrequirements \n1.2 OSH work \nstandards and \nprocedures are \ndetermined based \non applicability to \nnature of work \n1.3 Gaps in work \npractices are \nidentified related to \nrelevant OSH work \nstandards \n \n1.1. OSH work \npractices issues \n1.2. OSH work \nstandards \n1.3. General OSH \nprinciples and \nlegislations \n1.4. Company/ \nworkplace \npolicies/ \nguidelines \n1.5. Standards and \nsafety \nrequirements of \nwork process \nand procedures \n1.1. Communication \nskills \n1.2. Interpersonal \nskills \n1.3. Critical thinking \nskills \n1.4. Observation \nskills \n2. Set OSH work \ntargets \n \n2.1 Relevant work \ninformation are \ngathered \nnecessary to \ndetermine OSH \nwork targets \n2.2 OSH Indicators \nbased on gathered \ninformation are \nagreed upon to \nmeasure \neffectiveness of \nworkplace OSH \npolicies and \nprocedures \n2.3 Agreed OSH \nindicators are \nendorsed for \napproval from \nappropriate \n2.1. OSH work \ntargets \n2.2. OSH Indicators \n2.3. OSH work \ninstructions \n2.4. Safety and \nhealth \nrequirements of \ntasks \n2.5. Workplace \nguidelines on \nproviding \nfeedback on \nOSH and \nsecurity \nconcerns \n2.6. OSH \nregulations \nHazard control \nprocedures \n2.1. Communication \nskills \n2.2. Collaborating \nskills \n2.3. Critical thinking \nskills \n2.4. Observation \nskills\n\n--- PDF PAGE 35 ---\nAgricultural Machinery Servicing (4 – Wheel Tractor) NC III Revision 00 Promulgated 01/11/2019 31 \n \npersonnel \n2.4 OSH work \ninstructions are \nreceived in \naccordance with \nworkplace policies \nand procedures* \n2.7. OSH trainings \nrelevant to work \n3. Evaluate \neffectiveness of \nOccupational \nSafety and \nHealth work \ninstructions \n \n \n \n3.1 OSH Practices \nare observed \nbased on \nworkplace \nstandards \n3.2 Observed OSH \npractices are \nmeasured \nagainst approved \nOSH metrics \n3.3 Findings \nregarding \neffectiveness are \nassessed and \ngaps identified \nare implemented \nbased on OSH \nwork standards \n \n \n3.1. OSH Practices \n3.2. OSH metrics \n3.3. OSH Evaluation \nTechniques \n3.4. OSH work \nstandards \n3.1. Critical thinking \nskills \n3.2. Evaluating skills\n\n--- PDF PAGE 36 ---\nAgricultural Machinery Servicing (4 – Wheel Tractor) NC III Revision 00 Promulgated 01/11/2019 32 \n \nRANGE OF VARIABLES \nVARIABLE \nRANGE \n1. \nOSH Work Practices \nIssues \nMay include: \n1.1 \nWorkers’ experience/observance on presence of work \nhazards \n1.2 \nUnsafe/unhealthy administrative arrangements \n(prolonged work hours, no break-time, constant \novertime, scheduling of tasks) \n1.3 \nReasons for compliance/non-compliance to use of \nPPEs or other OSH procedures/policies/ guidelines \n2. \nOSH Indicators \nMay include: \n2.1 \nIncreased of incidents of accidents, injuries \n2.2 \nIncreased occurrence of sickness or health \ncomplaints/symptoms \n2.3 \nCommon complaints of workers’ related to OSH \n2.4 \nHigh absenteeism for work-related reasons \n3. OSH Work Instructions \nMay include: \n3.1 Preventive and control measures, and targets \n3.2 Eliminate the hazard (i.e., get rid of the dangerous \nmachine \n3.3 Isolate the hazard (i.e. keep the machine in a closed \nroom and operate it remotely; barricade an unsafe area \noff) \n3.4 Substitute the hazard with a safer alternative (i.e., \nreplace the machine with a safer one) \n3.5 Use administrative controls to reduce the risk (i.e. give \ntrainings on how to use equipment safely; OSH-related \ntopics, issue warning signages, rotation/shifting work \nschedule) \n3.6 Use engineering controls to reduce the risk (i.e. use \nsafety guards to machine) \n3.7 Use personal protective equipment \n3.8 Safety, Health and Work Environment Evaluation \n3.9 Periodic and/or special medical examinations of workers \n4. \nOSH metrics \nMay include: \n4.1 Statistics on incidence of accidence and injuries \n4.2 Morbidity (Type and Number of Sickness) \n4.3 Mortality (Cause and Number of Deaths) \n4.4 Accident Rate\n\n--- PDF PAGE 37 ---\nAgricultural Machinery Servicing (4 – Wheel Tractor) NC III Revision 00 Promulgated 01/11/2019 33 \n \nEVIDENCE GUIDE \n \n1. Critical aspects of \nCompetency \n \nAssessment requires evidence that the candidate: \n1.1. Identify OSH work practices issues relevant to work \nrequirements \n1.2. Identify gaps in work practices related to relevant OSH \nwork standards \n1.3. Agree upon OSH Indicators based on gathered \ninformation to measure effectiveness of workplace OSH \npolicies and procedures \n1.4. Receive OSH work instructions in accordance with \nworkplace policies and procedures \n1.5. Compare Observed OSH practices with against \napproved OSH work instructions \n1.6. Assess findings regarding effectiveness based on OSH \nwork standards \n2. Resource Implications \nThe following resources should be provided: \n2.1 Facilities, materials, tools and equipment necessary for \nthe activity \n3. Methods of Assessment \nCompetency in this unit may be assessed through: \n3.1 Observation/Demonstration with oral questioning \n3.2 Third party report \n3.3 Written exam \n \n4. Context for Assessment \n4.1 Competency may be assessed in the work place or in a \nsimulated work place setting\n\n--- PDF PAGE 38 ---\nAgricultural Machinery Servicing (4 – Wheel Tractor) NC III Revision 00 Promulgated 01/11/2019 34 \n \n \nUNIT OF COMPETENCY \n: EVALUATE ENVIRONMENTAL WORK PRACTICES \n \nUNIT CODE \n:"
