          "source_text": "1. Critical aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1. Maintained or improved individuals and/or team \nperformance given a variety of possible scenario \n1.2. Assessed and monitored team and individual performance \nagainst set criteria \n1.3. Represented concerns of a team and individual to next \nlevel of management or appropriate specialist and to \nnegotiate on their behalf \n1.4. Allocated duties and responsibilities, having regard to \nindividual’s knowledge, skills and aptitude and the needs \nof the tasks to be performed \n1.5. Set and communicated performance expectations for a \nrange of tasks and duties within the team and provided \nfeedback to team members \n2. Resource Implications \nThe following resources should be provided: \n2.1. Access to relevant workplace or appropriately simulated \nenvironment where assessment can take place \n2.2. Materials relevant to the proposed activity or task \n3. Methods of \nAssessment \nCompetency in this unit may be assessed through: \n3.1. Written Examination \n3.2. Oral Questioning \n3.3. Portfolio \n4. Context for \nAssessment \n4.1 Competency may be assessed in actual workplace or at the \ndesignated TESDA Accredited Assessment Center.\n\n--- PDF PAGE 15 ---\nAgricultural Machinery Servicing (4 – Wheel Tractor) NC III Revision 00 Promulgated 01/11/2019 11 \n \n \nUNIT OF COMPETENCY: APPLY CRITICAL THINKING AND PROBLEM- \n SOLVING TECHNIQUES IN THE WORKPLACE \n \nUNIT CODE :"
        },
        "source_text": "400311320 \n \nUNIT DESCRIPTOR : \nThis unit covers the skills, knowledge and attitudes to lead \nsmall teams including setting, maintaining and monitoring \nteam and individual performance standards. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Provide team \nleadership \n1.1 Work \nrequirements are \nidentified and \npresented to team \nmembers based on \ncompany policies \nand procedures \n1.2 Reasons for \ninstructions and \nrequirements are \ncommunicated to \nteam members \nbased on company \npolicies and \nprocedures \n1.3 Team members’ \nand leaders’ \nconcerns are \nrecognized, \ndiscussed and \ndealt with based on \ncompany practices \n1.1 Facilitation of \nTeam work \n1.2 Company \npolicies and \nprocedures \nrelating to work \nperformance \n1.3 Performance \nstandards and \nexpectations \n1.4 Monitoring \nindividual’s and \nteam’s \nperformance vis \na vis client’s and \ngroup’s \nexpectations \n1.1 Communication \nskills required for \nleading teams \n1.2 Group facilitation \nskills \n1.3 Negotiating skills \n1.4 Setting \nperformance \nexpectation \n2. Assign \nresponsibilities \n2.1. Responsibilities \nare allocated \nhaving regard to \nthe skills, \nknowledge and \naptitude required \nto undertake the \nassigned task \nbased on \ncompany policies. \n2.2. Duties are \nallocated having \nregard to \nindividual \npreference, \ndomestic and \npersonal \nconsiderations, \nwhenever \n2.1 Work plan and \nprocedures \n2.2 Work \nrequirements and \ntargets \n2.2 Individual and \ngroup \nexpectations and \nassignments \n \n2.3 Ways to improve \ngroup leadership \nand membership \n2.1 Communication \nskills \n2.2 Management skills \n2.3 Negotiating skills \n2.4 Evaluation skills \n2.5 Identifying team \nmember’s \nstrengths and \nrooms for \nimprovement\n\n--- PDF PAGE 11 ---\nAgricultural Machinery Servicing (4 – Wheel Tractor) NC II