        "source_text": "400311324 \n \nUNIT DESCRIPTOR \n: This unit covers the knowledge, skills and attitudes \nrequired to use technical information systems, apply \ninformation technology (IT) systems and edit, format & \ncheck information. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Use technical \ninformation \n1.1. Information are \ncollated and \norganized into a \nsuitable form for \nreference and use \n1.2. Stored \ninformation are \nclassified so that \nit can be quickly \nidentified and \nretrieved when \nneeded \n1.3. Guidance are \nadvised and \noffered to people \nwho need to find \nand use \ninformation \n \n \n \n \n \n1.1. Application in \ncollating \ninformation \n1.2. Procedures for \ninputting, \nmaintaining and \narchiving \ninformation \n1.3. Guidance to \npeople who need \nto find and use \ninformation \n1.4. Organize \ninformation \n1.5. classify stored \ninformation for \nidentification and \nretrieval \n1.6. Operate the \ntechnical \ninformation system \nby using agreed \nprocedures \n1.1. Collating \ninformation \n1.2. Operating \nappropriate and \nvalid procedures \nfor inputting, \nmaintaining and \narchiving \ninformation \n1.3. Advising and \noffering guidance \nto people who \nneed to find and \nuse information \n1.4. Organizing \ninformation into a \nsuitable form for \nreference and use \n1.5. Classifying stored \ninformation for \nidentification and \nretrieval \n1.6. Operating the \ntechnical \ninformation \nsystem by using \nagreed \nprocedures\n\n--- PDF PAGE 31 ---\nAgricultural Machinery Servicing (4 – Wheel Tractor) NC III Revision 00 Promulgated 01/11/2019 27 \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n2. Apply \ninformation \ntechnology \n(IT) \n2.1. Technical \ninformation \nsystem is operated \nusing agreed \nprocedures \n2.2. Appropriate and \nvalid procedures \nare operated for \ninputting, \nmaintaining and \narchiving \ninformation \n2.3. Software required \nare utilized to \nexecute the project \nactivities \n2.4. Information and \ndata obtained are \nhandled, edited, \nformatted and \nchecked from a \nrange of internal \nand external \nsources \n2.5. Information are \nextracted, entered, \nand processed to \nproduce the \noutputs required \nby customers \n2.6. Own skills and \nunderstanding are \nshared to help \nothers \n2.7. Specified security \nmeasures are \nimplemented to \nprotect the \nconfidentiality and \nintegrity of project \ndata held in IT \nsystems \n \n2.1. Attributes and \nlimitations of \navailable software \ntools \n2.2. Procedures and \nwork instructions for \nthe use of IT \n2.3. Operational \nrequirements for IT \nsystems \n2.4. Sources and flow \npaths of data \n2.5. Security systems \nand measures that \ncan be used \n2.6. Extract data and \nformat reports \n2.7. Methods of entering \nand processing \ninformation \n2.8. WWW enabled \napplications \n2.1. Identifying \nattributes and \nlimitations of \navailable software \ntools \n2.2. Using procedures \nand work \ninstructions for the \nuse of IT \n2.3. Describing \noperational \nrequirements for IT \nsystems \n2.4. Identifying sources \nand flow paths of \ndata \n2.5. Determining \nsecurity systems \nand measures that \ncan be used \n2.6. Extracting data and \nformat reports \n2.7. Describing \nmethods of \nentering and \nprocessing \ninformation \n2.8. Using WWW \napplications\n\n--- PDF PAGE 32 ---\nAgricultural Machinery Servicing (4 – Wheel Tractor) NC III Revision 00 Promulgated 01/11/2019 28 \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n3. Edit, format \nand check \ninformation \n3.1 Basic editing \ntechniques are \nused \n3.2 Accuracy of \ndocuments are \nchecked \n3.3 Editing and \nformattin