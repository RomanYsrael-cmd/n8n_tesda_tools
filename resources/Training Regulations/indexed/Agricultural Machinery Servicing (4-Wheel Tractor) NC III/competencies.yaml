edure \n3.3 Work area is \nrestored \nfollowing 5S of \ngood \nhousekeeping. \n3.4 Waste \nmanagement is \npracticed \naccording to \nenvironmental \nlaws. \n3.5 Tools and \nequipment are \nchecked and \nstored \naccording to \nworkplace \nprocedures \n3.6 Workplace \ndocuments are \naccomplished \naccording to \nworkplace \nprocedures \n3.7 Tests are \ncarried out on \npart or system \nto ensure \nnormal \nfunctioning after \nrepair/ service. \nand Storage \n3.2 Occupational Health \nand Safety procedures \nfor handling agricultural \nequipment \n3.3 Wearing of PPEs as \nrequired by Rule 1080 \nof OSHS \n3.4 5S of Good \nHousekeeping \n3.5 Waste management \n- \n3Rs \n3.6 Final inspection \nprocedure \n3.7 Vehicle turn-over \nprocedure \n3.8 Accomplishment of \nworkplace documents \n3.9 RA 9003-Ecological \nSolid Waste \nManagement Act of \n2000 \n3.10 RA 6969-Toxic \nSubstances and \nHazardous and \nNuclear Wastes \nControl Act of 1990 \n \n \n \nstoring tools and \nequipment \n3.6 Accomplishing \nworkplace \ndocumentations \n3.7 Carrying out test \non part or \nsystem\n\n--- PDF PAGE 105 ---\nAgricultural Machinery Servicing (4 – Wheel Tractor) NC III Revision 00 Promulgated 01/11/2019 101 \n \nRANGE OF VARIABLES \n \n1. Clutch parts \n \nClutch parts includes: \n1.1 Clutch pedal \n1.2 Pressure plate \n1.3 Clutch disc \n1.4 Flywheel \n1.5 Release bearing \n1.6 Diaphragm spring \n1.7 Fingers \n2. Drive train system \n \nSystem includes: \n2.1 Main gear shift system \n2.2 Range shift system \n2.3 Shuttle shift system \n2.4 Power take off (PTO) shift system \n2.5 Four-wheel drive system \n2.6 Shift forks and levers \n3. Inspection of gears \nInspection of gears includes: \n3.1 Abnormal wear and tear \n3.2 Cracks \n3.3 Damage of gears \n4. Environmental Laws \nEnvironmental Laws may include: \n4.1 RA 9003-Ecological Solid Waste \nManagement Act of 2000 \n4.2 RA 6969-Toxic Substances and \nHazardous and Nuclear Wastes Control \nAct of 1990\n\n--- PDF PAGE 106 ---\nAgricultural Machinery Servicing (4 – Wheel Tractor) NC III Revision 00 Promulgated 01/11/2019 102 \n \n \n \n \n \n \nEVIDENCE GUIDE \n \n1. Critical Aspects of Competency \nAssessment requires evidence that the candidate: \n1.1 Service clutch system \n1.1.1 Reviewed handling requirement of oil and \nlubricant based on SDS and GHS \n1.1.2 Adjusted clutch clearances \n1.1.3 Carried out Removal and replacement of \ndefective clutch parts \n1.1.4 Applied safety practices following OSHS \nRule 1090, Rule 1080 and Rule 1150 \n1.2 Service drive train system \n1.2.1 Reviewed handling requirement of oil and \nlubricant based on SDS and GHS \n1.2.2 Checked tightening torques of the drive \n train system bolts \n1.2.3 Checked gear spacing clearance \n1.2.4 Inspected gear shafting and bearings \n1.2.5 Adjusted shift forks and levers \n1.2.6 Removed and replaced damaged parts \n1.2.7 Applied safety practices following OSHS \nRule 1090, Rule 1080 and Rule 1150 \n1.3 Complete work processes \n1.3.1 Made final inspection \n1.3.2 Turned-over tractor to immediate superior \n1.3.3 Restored work area following 5S of good \n housekeeping. \n1.3.4 Practiced waste management following \nenvironmental laws \n1.3.5 Checked and stored tools and equipment \n2. Resource Implications \nThe following resources should be provided: \n2.1 Actual or simulated workplace \n2.2 Tools materials and equipment needed to perform \nthe required tasks \n2.3 References and manuals \n2.4 PPE \n2.5 First Aid Kit PPE \n3. Method of Assessment \n \nCompetency in this unit may be assessed through: \n3.1 Demonstration/Observation with Oral Questioning \n3.2 Portfolio with Interview \n3.3 Written Test \n3.4 Third-party report \n4. Context of Assessment \n4.1 Competency maybe assessed in actual workplace \nor at the designated TESDA accredited Assessment \nCenter.\n\n--- PDF PAGE 107 ---\nAgricultural Machinery Servicing (4 – Wheel Tractor) NC III Revision 00 Promulgated 01/11/2019 103"
