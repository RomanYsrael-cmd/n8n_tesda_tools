        "source_text": "AFF321201 \n \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge, skills and attitudes required \nto perform safety measures effectively and efficiently. It \nincludes identifying areas, tools, materials, time and place \nin performing safety measures. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Determine \nareas of \nconcern for \nsafety \nmeasures \n1.1 Work tasks are \nidentified in line with \nfarm operations \n1.2 Place for safety \nmeasures are \ndetermined in line \nwith farm operations \n1.3 Time for safety \nmeasures are \ndetermined in line \nwith farm operations \n1.4 Appropriate tools, \nmaterials and \noutfits are prepared \nin line with job \nrequirements \n1.1 Different work \ntasks in farm \noperations \n1.2 Place and time \nfor \nimplementation \nof safety \nmeasures \n1.3 Different hazards \nin the workplace \n1.4 Types of tools, \nmaterials and \noutfits \n1.5 Preparation of \ntools, materials \nand outfits \n1.1 Identifying work \ntasks in farm \noperations \n1.2 Determining place \nand time for \nimplementation of \nsafety measures \n1.3 Reading labels, \nmanuals and \nother basic safety \ninformation \n1.4 Identifying \neffective/functiona\nl tools, materials \nand outfit \n1.5 Preparing tools, \nmaterials and \noutfits \n1.6 Discarding \ndefective tools, \nand materials \n2. Apply \nappropriate \nsafety \nmeasures \n2.1 Tools and materials \nare used according to \nspecifications and \nprocedures \n2.2 Outfits are worn \naccording to farm \nrequirements \n2.3 Effectivity/shelf \nlife/expiration of \nmaterials are strictly \nobserved \n2.4 Emergency \nprocedures are \nknown and followed \nto ensure a safe work \nrequirement \n2.5 Hazards in the \nworkplace are \n2.1 Uses and \nfunctions of tools \n2.2 Outfits and how \nto wear it. \n2.3 Expiration/shelf \nlife of materials \n2.4 Proper disposal \nof expired \nmaterials \n2.5 Environmental \nrules and \nregulations \n2.6 Emergency \nprocedures \n2.7 Hazards \nidentification and \nreporting \n2.8 Communication \n2.1 Using tools and \nmaterials in the \nworkplace \n2.2 Wearing of \noutfits \n2.3 Observing \nexpiration/ shelf \nlife of materials \n2.4 Disposing of \nexpired materials \n2.5 Following \nemergency \nprocedures \n2.6 Identifying and \nreporting of \nhazards in \nworkplace area.\n\n--- PDF PAGE 46 ---\nAgricultural Machinery Servicing (4 – Wheel Tractor) NC III Revision 00 Promulgated 01/11/2019 42 \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \nidentified and \nreported in line with \nfarm guidelines \nskills \n2.9 OSHS \n3. Safe keep \n/dispose \ntools, \nmaterials and \noutfit \n3.1 Used tools and outfit \nare cleaned after use \nand stored in \ndesignated areas \n3.2 Unused materials are \nproperly labeled and \nstored according to \nmanufacturers \nrecommendation and \nfarm requirements \n3.3 Waste materials are \ndisposed according to \nmanufacturers, \ngovernment and farm \nrequirements \n3.1 Procedures of \ncleaning used \ntools and outfits \n3.2 Label and \nstorage unused \nmaterials \n3.3 Disposal of \nwastes materials \n3.4 Manufacturers \nrecommendation \non keeping \nmaterials \n3.5 Environmental \nrules and \nregulations \n3.1 Cleaning used \ntools and outfit \n3.2 Labelling and \nstoring unused \nmaterials \n3.3 Disposing waste \nmaterials\n\n--- PDF PAGE 47 ---\nAgricultural Machinery Servicing (4 – Wheel Tractor) NC III Revision 00 Promulgated 01/11/2019 43 \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Work tasks \nWork task may be selected from any of the \nsubsectors: \n1.1 \nCrop Production \n1.2 \nPost-harvest \n1.3 \nAgri-marketing \n1.4 \nFarm Equipment \n2. Place \nMay include: \n2.1 \nStock room/storage areas/warehouse \n2.2 \nField/farm/orchard \n3. Time \nMay include: \n3.1 \nFertilizer and pesticides application \n3.2 \nFeed mixing and feeding \n3.3 \nHarvesting and hauling \n4. Tools, materials and outfits May include: \n4.1 \nTools \n4.1.1 \nWrenches \n4.1.2 \nScrew driver \n4.1.3 \nPliers \n4.2 \nOutfit \n4.2.1 \nMasks \n4.2.2 \nGloves \n4.2.3 \nBoots \n4.2.4 \nOverall coats \n4.2.5 \nHat \n4.2.6 \nEye goggles \n5. Emergency procedures \nMay include: \n5.1 \nLocation of first aid kit \n5.2 \nEvacuation \n5.3 \nAgencies contract \n5.4 \nFarm emergency procedures \n6. Hazards \nMay include: \n6.1 \nChemical \n6.2 \nElectrical \n6.3 \nFalls\n\n--- PDF PAGE 48 ---\nAgricultural Machinery Servicing (4 – Wheel Tractor) NC III Revision 00 Promulgated 01/11/2019 44 \n \nEVIDENCE GUIDE \n1. \nCritical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 \nDetermined areas of concern for safety measures \n1.2 \nApplied appropriate safety measures according to industry \nrequirements \n1.3 \nPrepared tools, materials and outfit needed \n1.4 \nPerformed proper disposal of used materials \n1.5 \nCleaned and stored tools, materials and outfit in designated \nfacilities \n2. \nResource \nImplications \nThe following resources should be provided: \n2.1 \nFarm location \n2.2 \nTools, equipment and outfits appropriate in applying safety \nmeasures \n3. \nMethod of \nAssessment \nCompetency in this unit must be assessed through: \n3.1 \nPractical demonstration \n3.2 \nThird Party Report \n4. \nContext of \nAssessment \n4.1. Competency maybe assessed in actual workplace or at the \ndesignated TESDA Accredited Assessment Center.\n\n--- PDF PAGE 49 ---\nAgricultural Machinery Servicing (4 – Wheel Tractor) NC III Revision 00 Promulgated 01/11/2019 45 \n \nUNIT OF COMPETENCY : USE AND MAINTAIN FARM SERVICING TOOLS \n AND EQUIPMENT \n \nUNIT CODE \n :"
