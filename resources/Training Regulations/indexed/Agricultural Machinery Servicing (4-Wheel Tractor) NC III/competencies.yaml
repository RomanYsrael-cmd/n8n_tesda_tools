        "evidence_guide": {
          "source_text": "1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 Collected farm waste \n1.2 Identified and segregated farm waste \n1.3 Processed farm waste \n1.4 Performed housekeeping \n2. Resource \nImplications \nThe following resources should be provided: \n2.11 Actual or simulated workplace \n2.12 Tools materials and equipment needed to perform the required \ntasks \n2.13 References and manuals \n2.14 PPE \n2.15 First Aid Kit PPE \n3. Method of \nAssessment \n \nCompetency in this unit may be assessed through: \n3.9 Demonstration/Observation with Oral Questioning \n3.10 Portfolio with Interview \n3.11 Written Test \n3.12 Written Report \n4. Context of \nAssessment \n4.1 Competency maybe assessed in actual workplace or at the \ndesignated TESDA accredited Assessment Center.\n\n--- PDF PAGE 60 ---\nAgricultural Machinery Servicing (4 – Wheel Tractor) NC III Revision 00 Promulgated 01/11/2019 56 \n \n \nUNIT OF COMPETENCY \n: MAINTAIN SERVICE RECORD \n \nUNIT CODE \n \n :"
        },
        "source_text": "AFF321205 \n \n \n \nUNIT DESCRIPTOR \n: This unit covers the knowledge, skills and attitudes \nrequired to process farm wastes. It comprises functions \nsuch as collecting farm wastes, conducting waste \nidentification and segregation, treating and processing \nfarm wastes and performing housekeeping duties \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Collect wastes \n1.1 Tools, materials \nand PPEs are \nprepared for \ncollection of farm \nwastes. \n1.2 Wastes are \ncollected following \nOSHS and waste \ncollection \nrequirements and \nplan. \n1.3 Appropriate \npersonal \nprotective \nequipment (PPE) \nare worn as \nprescribed by \nOccupational \nSafety and Health \nStandards \n(OSHS). \n1.1 Tool, materials and \nequipment \n1.2 PPEs \n1.3 OSHS \n1.4 Waste collection \nrequirements and \nplan \n \n1.1 Preparing tools, \nmaterials and \nPPEs \n1.2 Collecting wastes \n1.3 Wearing of PPEs \n1.4 Applying safety \npractices\n\n--- PDF PAGE 56 ---\nAgricultural Machinery Servicing (4 – Wheel Tractor) NC III Revision 00 Promulgated 01/11/2019 52 \n \n2 Identify and \nsegregate \nwastes \n \n2.1 Wastes are \nidentified by \ncategories \naccording to \nindustry \nstandards and \nenvironmental \nlegislation. \n2.2 Wastes are \nsegregated \naccording to \norganizational \nrequirements and \nrelevant \nlegislation. \n2.3 Sorted waste is \nplaced into \nlabelled container \nto avoid littering \nand prevent \ncross-\ncontamination. \n2.4 Information on \nwaste is obtained \nby asking \nauthority to \nensure correct \nidentification. \n2.1 Categories of \nwastes \n2.2 Wastes \nsegregation \nprocedures \n2.3 Environmental \nlegislations \n \n2.1 Identifying wastes \n2.2 Segregating \nwastes \n2.3 Sorting wastes \n2.4 Obtaining \ninformation on \nwastes \n3 Handle farm \nwastes \n3.1 Dangerous and \nhazardous wastes \nare handled \naccording to \norganizational \nrequirements and \nrelevant legislation \nfollowing OSHS \nprocedures. \n3.2 Handling of farm \nwastes is done \nfollowing \nenvironmental \nlegislation and \ncodes. \n3.3 Principles of 3Rs \n(reduce, reuse and \nrecycle) are applied \naccordingly. \n3.4 Wastes are \ndisposed of \naccording to \nenvironmental \nlegislation and \ncodes. \n3.1 Dangerous and \nhazardous wastes \n3.2 OSHS \n3.3 Organizational \nrequirements \n3.4 Handling of farm \nwastes \n3.5 Environmental \nlegislations and \ncodes \n3.6 Principles of 3Rs \n3.7 Procedures of \nwaste disposal \n \n3.1 Handling \ndangerous and \nhazardous \nwastes \n3.2 Applying safety \npractices \n3.3 Handling of \nfarm wastes \n3.4 Applying \nprinciples of \n3Rs \n3.5 Disposing of \nwastes\n\n--- PDF PAGE 57 ---\nAgricultural Machinery Servicing (4 – Wheel Tractor) NC III Revision 00 Promulgated 01/11/2019 53 \n \n4. Perform \nhousekeeping \n4.1 Appropriate \nwarning signs and \nlabels are \ndisplayed in \nconspicuous places \naround the \nworkplace. \n4.2 Work area is \ncleaned according \nto 5S principles. \n4.3 Tools are checked, \ncleaned and \nstowed according \nto established \nindustry \nprocedures and \nfollowing user’s \nmanual. \n4.4 Materials are \nstored following \nindustry standard \nprocedures and \nmanufacturer’s \nspecifications. \n4.5 PPE is checked for \ndamage prior to \nensuring that clean \nand undamaged \nequipment is \nstored. \n4.6 Storage facility is \nchecked to ensure \nno contamination in \nthe area according \nto organizational \nrequirements and \nlegislation and \ncodes. \n4.7 Record keeping is \ndone according to \nindustry \nrequirements. \n4.1 Warning signs \nand labels \n4.2 5S of Good \nHousekeeping \n4.3 Procedures of \ncleaning, \nchecking and \nstoring of \nmaterials \n4.4 PPEs \n4.5 Organizational \nrequirements \nand legislation \nand codes. \n4.6 Record keeping \nprocedures \n \n1.1 Displaying \nwarning signs \nand labels \n1.2 Cleaning work \narea \n1.3 Checking, \ncleaning and \nstowing tools \n1.4 Storing materials \n1.5 Checking storage \nfacility \n1.6 Conducting \nrecord keeping\n\n--- PDF PAGE 58 ---\nAgricultural Machinery Servicing (4 – Wheel Tractor) NC III Revision 00 Promulgated 01/11/2019 54 \n \nRANGE OF VARIABLES \n \nVARIABLE \nSCOPE \n1. Tools,materials, PPEs \nTools and materials include: \n1.1. Tools \n• \nWheel borrow \n• \nBroomstick \n• \nSprayer or pressurized pump \n1.2. Materials \n• \nSacks \n• \nContainers \n• \nDisinfectants \n• \nDetergents \n• \nFirst-aid kit \n• \nChemical spill kit \n1.3. Personal Protective Equipment \n• \nGoggles \n• \nDisposal gloves \n• \nFace mask \n• \nRubber boots \n• \nOverall \n2. Wastes \nMay include: \n2.1. \nOil \n2.2. \nBatteries \n2.3. \nConsumable parts \n- \nFilters \n- \nSeals \n2.4. \nContainers \n2.5. \nDefective parts \n3. Dangerous and \nhazardous wastes \n3.1 \nUsed oil \n3.2 \nBattery solution \n3.3 \nCoolants \n3.4 \nBattery \n3.5 \nPesticides \n4. Categories \n4.1 \nRe-usable \n4.2 \nRecyclable \n4.3 \nSolid \n4.4 \nLiquid \n5. Handling of wastes \n5.1 Reduce \n5.2 Re-use \n5.3 Recycle \n6. Record \n6.1. \nRecord of wastes generated and disposed \n6.2. \nRecord of incidence of accidents \n6.3. \nRecord of chemical spillage \n6.4. \nInventory of tools and materials\n\n--- PDF PAGE 59 ---\nAgricultural Machinery Servicing (4 – Wheel Tractor) NC III Revision 00 Promulgated 01/11/2019 55 \n \nEVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 Collected farm waste \n1.2 Identified and segregated farm waste \n1.3 Processed farm waste \n1.4 Performed housekeeping \n2. Resource \nImplications \nThe following resources should be provided: \n2.11 Actual or simulated workplace \n2.12 Tools materials and equipment needed to perform the required \ntasks \n2.13 References and manuals \n2.14 PPE \n2.15 First Aid Kit PPE \n3. Method of \nAssessment \n \nCompetency in this unit may be assessed through: \n3.9 Demonstration/Observation with Oral Questioning \n3.10 Portfolio with Interview \n3.11 Written Test \n3.12 Written Report \n4. Context of \nAssessment \n4.1 Competency maybe assessed in actual workplace or at the \ndesignated TESDA accredited Assessment Center.\n\n--- PDF PAGE 60 ---\nAgricultural Machinery Servicing (4 – Wheel Tractor) NC III Revision 00 Promulgated 01/11/2019 56 \n \n \nUNIT OF COMPETENCY \n: MAINTAIN SERVICE RECORD \n \nUNIT CODE \n \n :"
