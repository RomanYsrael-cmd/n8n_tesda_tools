        "source_text": "AFF723303 \n \nUnit descriptor \n : This unit covers knowledge, skills and attitude to service \n battery, check and replace alternator, service electrical \n circuits, service starting system components and conduct \n electrical system test for 4-wheel tractor. \n \n \n \nELEMENT \n \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange Statement \nREQUIRED \nKNOWLEDGE AND \nATTITUDE \n \n \nREQUIRED SKILL \n1. Service \nbattery \n \n \n1.1 Servicing \nrequirement are \nreviewed based on \nSafety Data Sheet \n(SDS)and Globally \nHarmonized \nStandard (GHS) \n1.2 Servicing \nactivities for \nbatteries are \nimplemented \nbased on \nmanufacturer’s \nspecification. \n1.3 Battery is tested \nbased on \nmanufacturer’s \nspecification. \n1.4 Safety measures \nare practiced in \nproper handling of \nbattery based on \nOSHS Rule 1080, \nRule 1090 and \nRule 1150 \n1.5 Waste \nmanagement in \nbattery disposal is \npracticed according \nto environmental \nregulations. \n1.6 Waste \nmanagement is \npracticed according \nto environmental \nlaws. \n1.7 Waste \n1.1 Uses of Safety Data \nSheet (SDS) and \nGlobally Harmonized \nStandard (GHS) \n1.2 Electrical Systems \nprinciples and \noperations \n1.3 Servicing activities \n1.4 Handling of battery \nand battery fluids \n1.5 Occupational Health \nand Safety \nprocedures for \nhandling automotive \nbattery \n1.6 Wearing of PPE as \nrequired by Rule1080 \nof OSHS \n1.7 OSHS \n- Rule 1090 – \nHazardous Material \n- Rule 1150 – \nMaterials Handling \nand Storage \n1.8 Testing of battery \n1.9 Uses of tools for \nbattery testing and \nreplacement \n1.10 Use of tools for \nremoval and \nreplacement of \nbattery. \n1.11 Battery disposal \n1.12 Environmental rules \nand regulations on \nbattery disposal \n1.13 RA 6969-Toxic \n1.1 Reviewing service \nrequirement based \non SDS and GHS \n1.2 Implementing \nservicing activities \n1.3 Testing battery \n1.4 Handling battery \n1.5 Handling battery \n