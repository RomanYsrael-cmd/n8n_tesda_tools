 levers \n7.4 Dead battery \n7.5 Undercharged battery \n8. Environmental Laws \nMay include: \n8.1 RA 9003-Ecological Solid Waste \nManagement Act of 2000 \n8.2 RA 6969-Toxic Substances and Hazardous \nand Nuclear Wastes Control Act of 1990\n\n--- PDF PAGE 76 ---\nAgricultural Machinery Servicing (4 – Wheel Tractor) NC III Revision 00 Promulgated 01/11/2019 72 \n \n \n \n \n \nEVIDENCE GUIDE \n \nCritical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 \nServiced battery \n1.1.1 Implemented servicing activities for batteries \n1.1.2 Applied safety measures following OSHS Rule 1150 \n1.1.3 Managed waste in battery dispossal, in accordance \nto environmental laws and Toxic Substances and \nHazardouz and Nuclear Wastes Control Act of 1990 \n1.2 \nCheck and replace alternator \n1.2.1 Applied safety measures following ASAE s. 318.15 \nand OSHS Rule1150 \n1.2.2 carried-out replacement of alternator \n1.3 \nService electrical circuit \n1.3.1 Tested electrical lines \n1.3.2 Supervised repair of short circuits \n1.3.3 Guided removal and replacement of consumable \nelectrical parts \n1.3.4 Inspected electrical safety indicators \n1.4 \nServiced starting system components \n1.4.1 Identified problems on starting components \n1.4.2 Carried-out/ supervised replace and repair of \nstarting system component \n1.4.3 Practiced safety measures in handling agricultural \nequipment following ASAE s. 318.15 and OSHS Rule \n1150 \n1.5 \nCompleted work processes \n1.5.1 Carried out tests \n1.5.2 Turned-over tractor to client \n1.5.3 Checked and stored tools and equipment \n1.5.4 Practiced waste management \nResource Implications \nThe following resources should be provided: \n2.1 Actual or simulated workplace \n2.2 Tools materials and equipment needed to perform the \n required tasks \n 2.3 References and manuals \n 2.4 PPE \n 2.5 First Aid Kit PPE \nMethod of Assessment \n \nCompetency in this unit may be assessed through: \n3.1 Demonstration/Observation with Oral Questioning \n3.2 Portfolio with Interview \n3.3 Written Test \n3.4 Written Report \nContext of Assessment \n4.1 Competency maybe assessed in actual workplace or at the \ndesignated TESDA accredited Assessment Center.\n\n--- PDF PAGE 77 ---\nAgricultural Machinery Servicing (4 – Wheel Tractor) NC III Revision 00 Promulgated 01/11/2019 73 \n \nUNIT OF COMPETENCY \n: \nDIAGNOSE AND REPAIR ENGINE SYSTEM OF \n4-WHEEL TRACTOR \n \nUNIT OF CODE \n \n \n: \nAFF723304 \n \nUNIT DESCRIPTOR \n \n: \nThis unit covers knowledge, skills and attitude to \nservice engine’s fuel system, service cooling \nsystem, service body and power train system for \n4-wheel tractor which includes service engine’s \nlubrication system and testing. \n \n \nELEMENT \n \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange Statement \n \nREQUIRED \nKNOWLEDGE AND \nATTITUDE \n \nREQUIRED SKILL \n \n1. Service engine \nfuel system \n1.1 Handling \nrequirement of fuel \nare reviewed based \non Safety Data Sheet \n(SDS) and Globally \nHarmonized \nStandard (GHS). \n1.2 Engine fuel system \nis tested based on \nmanufacturer’s \nspecification. \n1.3 Removal and \nreplacement of the \nInjection pump unit is \nsupervised based on \nmanufacturers \nspecification. \n1.4 Fuel system is \ncleaned following \nindustry \nspecification. \n1.5 Removal and \nreplacement of fuel \nfilters and strainers \nare directed following \nmanufacturer’s \nmanual and Toxic \nSubstances and \nHazardous and \nNuclear Wastes \nControl Act of 1990 \n1.6 Safety practices are \napplied following \nOSHS Rule 1080, \nRule 1090, Rule \n1150 and RA 6969 \n1.1 Uses of Safety Data \nSheet (SDS) and \nGlobally Harmonized \nStandard (GHS) \n1.2 Fuel system \ntroubleshooting \n1.3 Use of tools and \nspecial tools \n1.4 Clearance \nmeasurements \n1.5 Proper adjustments \nof clearances based \non manufacturer’s \nspecification \n1.6 Proper assembling \nand disassembling of \nfuel system \ncomponents \n1.7 Types an