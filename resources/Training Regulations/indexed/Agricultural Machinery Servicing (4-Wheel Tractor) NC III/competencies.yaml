        "evidence_guide": {
          "source_text": "1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 Service engine fuel system \n1.1.1 Reviewed handling requirement of fuel based on SDS and \nGHS \n1.1.2 Supervised removal and replacement of the Injection pump \nunit \n1.1.3 Directed removal and replacement of fuel filters and strainers \n1.1.4 Applied safety practices following OSHS Rule 1090, Rule \n1150 and RA 6969 \n1.2 Service cooling system \n1.2.1 Reviewed handling requirement of coolant based on SDS and \nGHS \n1.2.2 Repaired Radiator \n1.2.3 Supervised replacement of air filter \n1.2.4 Managed oil replenishment and replacement \n1.2.5 Overseen replenishment and replacement of coolant \n1.2.6 Applied safety practices following OSHS Rule 1090 \n1.3 Service body and power train system of engines \n1.3.1 Reviewed handling requirement of coolant based on SDS and \n GHS \n1.3.2 Removed and replaced Piston and piston ring \n1.3.4 Adjusted valves \n1.3.4 Set Timing gears according to manufacturer’s specification. \n1.3.5 Adjusted drive train \n1.3.6 Applied safety practices \n1.4 Service engine Lubrication System \n1.4.1 Reviewed handling requirement of oil and lubricant based on \nSDS and GHS \n1.4.2 Checked oil levels \n1.4.4 Replaced oil filters \n1.4.4 Inspected and repaired oil pump \n1.4.5 Applied safety practices following OSHS Rule 1090 and Rule \n1150 \n1.5 Complete work processes \n1.5.1 Carried out Tests on part or system \n1.5.2 Turned-over Tractor to client \n1.5.3 Restored Work area following 5S of good housekeeping. \n1.5.4 Practiced waste management \n2 \nResource \nImplications \nThe following resources should be provided: \n2.1 Actual or simulated workplace \n2.2 Tools materials and equipment needed to perform the required tasks \n2.3 References and manuals \n2.4 PPE \n2.5 First Aid Kit PPE \n3 \nMethod of \nAssessment \n \nCompetency in this unit may be assessed through: \n3.1 Demonstration/Observation with Oral Questioning \n3.2 Portfolio with Interview \n3.3 Written Test \n3.4 Third-party report \n4 \nContext of \nAssessment \n5.1 Competency maybe assessed in actual workplace or at the \ndesignated TESDA accredited Assessment Center.\n\n--- PDF PAGE 84 ---\nAgricultural Machinery Servicing (4 – Wheel Tractor) NC III Revision 00 Promulgated 01/11/2019 80 \n \nUNIT OF COMPETENCY \n: DIAGNOSE AND REPAIR AXLE SYSTEM OF 4- \nWHEEL TRACTOR \n \nUNIT CODE \n \n \n:"
