          "source_text": "Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 \nServiced battery \n1.1.1 Implemented servicing activities for batteries \n1.1.2 Applied safety measures following OSHS Rule 1150 \n1.1.3 Managed waste in battery dispossal, in accordance \nto environmental laws and Toxic Substances and \nHazardouz and Nuclear Wastes Control Act of 1990 \n1.2 \nCheck and replace alternator \n1.2.1 Applied safety measures following ASAE s. 318.15 \nand OSHS Rule1150 \n1.2.2 carried-out replacement of alternator \n1.3 \nService electrical circuit \n1.3.1 Tested electrical lines \n1.3.2 Supervised repair of short circuits \n1.3.3 Guided removal and replacement of consumable \nelectrical parts \n1.3.4 Inspected electrical safety indicators \n1.4 \nServiced starting system components \n1.4.1 Identified problems on starting components \n1.4.2 Carried-out/ supervised replace and repair of \nstarting system component \n1.4.3 Practiced safety measures in handling agricultural \nequipment following ASAE s. 318.15 and OSHS Rule \n1150 \n1.5 \nCompleted work processes \n1.5.1 Carried out tests \n1.5.2 Turned-over tractor to client \n1.5.3 Checked and stored tools and equipment \n1.5.4 Practiced waste management \nResource Implications \nThe following resources should be provided: \n2.1 Actual or simulated workplace \n2.2 Tools materials and equipment needed to perform the \n required tasks \n 2.3 References and manuals \n 2.4 PPE \n 2.5 First Aid Kit PPE \nMethod of Assessment \n \nCompetency in this unit may be assessed through: \n3.1 Demonstration/Observation with Oral Questioning \n3.2 Portfolio with Interview \n3.3 Written Test \n3.4 Written Report \nContext of Assessment \n4.1 Competency maybe assessed in actual workplace or at the \ndesignated TESDA accredited Assessment Center.\n\n--- PDF PAGE 77 ---\nAgricultural Machinery Servicing (4 – Wheel Tractor) NC III Revision 00 Promulgated 01/11/2019 73 \n \nUNIT OF COMPETENCY \