gated 01/11/2019 58 \n \nRANGE OF VARIABLES \n \nVARIABLE \nSCOPE \n1. Inventory inputs \n \nInventory inputs may include: \n1.1 Tools \n1.2 Machinery \n1.3 Equipment \n2. Servicing activities \nServicing activities may include: \n2.1 Maintenance \n2.2 Check-up \n2.3 Repair \n3. Service report \nService report may include: \n3.1 Client information \n3.2 Machinery details (e.g. serial number, model) \n3.3 Machinery damages \n3.4 Causes of damage \n3.5 Servicing details \n4. Servicing cost \nServicing cost may include: \n4.1 Labor \n4.2 Input Parts \n4.3 Rentals \n4.4 Miscellaneous\n\n--- PDF PAGE 63 ---\nAgricultural Machinery Servicing (4 – Wheel Tractor) NC III Revision 00 Promulgated 01/11/2019 59 \n \nEVIDENCE GUIDE \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1. Determined inventory inputs according enterprise requirements \n1.2. Determined defective tools and equipments according to \noperation manuals. \n1.3. Inspected facilities according to standard codes and laws. \n1.4. Prepared production plan and report according to enterprise \nrequirements and reporting procedures. \n2. Resource \nImplications \nThe following resources should be provided: \n2.16 Actual or simulated workplace \n2.17 Tools materials and equipment needed to perform the \nrequired tasks \n2.18 References and manuals \n2.19 PPE \n2.20 First Aid Kit PPE \n3. Method of \nAssessment \n \nCompetency in this unit may be assessed through: \n3.13 Demonstration/Observation with Oral Questioning \n3.14 Portfolio with Interview \n3.15 Written Test \n3.16 Written Report \n4. Context of \nAssessment \n4.1 Competency maybe assessed in actual workplace or at the \ndesignated TESDA accredited Assessment Center.\n\n--- PDF PAGE 64 ---\nAgricultural Machinery Servicing (4 – Wheel Tractor) NC III Revision 00 Promulgated 01/11/2019 60 \n \n \nUnit of Competency \n: CONDUCT DIAGNOSIS \n \nUnit Code \n \n \n:"
