          "source_text": "1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 Selected and used servicing tools \n1.2 Selected and operated testing equipment and accessories \n1.3 Performed preventive maintenance \n2. Resource \nImplications \nThe following resources should be provided: \n2.1 Actual or simulated workplace \n2.2 Tools materials and equipment needed to perform the required \ntasks \n2.3 References and manuals \n2.4 PPE \n2.5 First Aid Kit PPE \n3. Method of \nAssessment \n \nCompetency in this unit may be assessed through: \n3.1 Demonstration/Observation with Oral Questioning \n3.2 Portfolio with Interview \n3.3 Written Test \n3.4 Written Report \n4. \nContext of \nAssessment \n4.1 Competency maybe assessed in actual workplace or at the \ndesignated TESDA accredited Assessment Center.\n\n--- PDF PAGE 53 ---\nAgricultural Machinery Servicing (4 – Wheel Tractor) NC III Revision 00 Promulgated 01/11/2019 49 \n \n \n \n \n \nUNIT OF COMPETENCY : \nPERFORM ESTIMATION AND BASIC \n \n \nCALCULATION \n \nUNIT CODE \n:"
        },
        "source_text": "AFF321202 \n \nUNIT DESCRIPTOR \n: This unit covers the knowledge, skills and attitudes \n required to use and maintain servicing tools. It includes \n selection, operation and preventive maintenance of \n farm tools and equipment. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range of \nVariables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Select and \nuse \nservicing \ntools \n \n1.1 \nIdentified \nappropriate \nservicing tools \naccording to \nrequirement/use \n1.2 \nServicing tools are \nchecked for faults \nand defective tools \nreported in \naccordance with \nfarm procedures \n1.3 \nAppropriate \nservicing tools are \nsafely used \naccording to job \nrequirements and \nmanufacturers \nconditions \n1.1 Servicing tools and \ntheir uses \n1.2 Defects of servicing \ntools \n1.3 Reporting \nprocedures \n1.4 Appropriate usage of \nservicing tools \n1.5 Handling of servicing \ntools \n1.6 OSHS \n1.1 Identifying \nappropriate \nservicing tools \n1.2 Checking \nservicing tools \n1.3 Using \nappropriately \nservicing tools \n1.4 Apply safety \npractices \n2. Select and \noperate \ntesting \nequipment \nand \naccessories \n2.1 \nIdentify appropriate \ntesting equipment \nand accessories \n2.2 \nInstructional manual \nof the servicing tools \nand equipment are \ncarefully read prior \nto operation \n2.3 \nPre-operation \ncheck-up is \nconducted in line \nwith manufacturers \nmanual \n2.4 \nFaults in testing \nequipment and \naccessories are \nidentified and \nreported in line with \nfarm procedures \n2.5 \nTesting equipment \nand accessories \nused according to \nits function \n2.1 Testing equipment \nand accessories \n2.2 Instructional Manual \n2.3 Pre-operation check \n-up procedures \n2.4 Different faults of \ntesting equipment \nand accessories \n2.5 Reporting \nprocedures \n2.6 Appropriate usage \nof test equipment \nand accessories \n2.7 Handling of test \nequipment and \naccessories \n2.8 OSHS \n2.1 Identifying \nappropriate \ntesting \nequipment \n2.2 Reading \ninstructional \nmanual \n2.3 Conducting pre-\noperation check \n-up \n2.4 Identifying faults \nin testing \nequipment and \naccessories \n2.5 Using testing \nequipment and \naccessories \n2.6 Applying safety \npractices\n\n--- PDF PAGE 50 ---\nAgricultural Machinery Servicing (4 – Wheel Tractor) NC III Revision 00 Promulgated 01/11/2019 46 \n \n2.6 \nFollowed safety \nprocedures \n3. Perform \npreventive \nmaintenance \n3.1 Servicing tools are \ncleaned immediately \nafter use in line with \nfarm procedures \n3.2 Routine check-up and \nmaintenance of \ntesting equipment \nand accessories are \nperformed according \nto \nmanufacturer’specifica\ntion. \n3.3 Servicing tools, \ntesting equipment \nand accessories are \ninventoried based on \nwork requirements \n3.4 Servicing tools are \nstored in designated \nareas in line with \nmanufacturer’s \nspecifications. \n3.1 Cleaning procedures \n3.2 Farm procedures \n3.3 Check -up and \nmaintenance \nprocedures \n3.4 Inventory \nprocedures \n3.5 Storage procedures \n3.6 Waste Management \n3.7 5S of Good \nHousekeeping \n3.8 OSHS \n \n3.1 Cleaning \nservicing tools \n3.2 Performing \nroutine check -\nup and \nmaintenance \n3.3 Conducting \ninventory of \nservicing tools, \ntesting \nequipment and \naccessories \n3.4 Storing \nservicing tools \n3.5 Applying safety \npractices\n\n--- PDF PAGE 51 ---\nAgricultural Machinery Servicing (4 – Wheel Tractor) NC III Revision 00 Promulgated 01/11/2019 47 \n \n \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. \nTesting equipment and \naccessories \n \nTesting equipment and accessories includes: \n1.1 Load tester \n1.2 Engine analyzer \n1.3 Stability analyzer \n1.4 Wheel balancer \n1.5 Hydraulic lift \n1.6 Compressors \n1.7 Power sprayer \n1.8 Frame engine hoist \n2. \nServicing tools \nServicing tools includes: \n2.1 Wrenches set \n2.2 Screw drivers set \n2.3 Hammers \n2.4 Pliers \n2.5 Testers \n2.6 Special tools \n2.7 Chisels \n2.8 Gauges \n2.9 Hydraulic jack \n2.10 Sockets and drivers \n2.11 Pullers \n3. \nPre-operation check-up \nPre-operation check-up may include: \n3.1 Tires assembly (pressure & bolt tightness) \n3.2 Level of brake fluid \n3.3 Level of Fuel \n3.4 Level of Water \n3.5 Level of Lubricants \n3.6 Battery\n\n--- PDF PAGE 52 ---\nAgricultural Machinery Servicing (4 – Wheel Tractor) NC III Revision 00 Promulgated 01/11/2019 48 \n \n \n \nEVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 Selected and used servicing tools \n1.2 Selected and operated testing equipment and accessories \n1.3 Performed preventive maintenance \n2. Resource \nImplications \nThe following resources should be provided: \n2.1 Actual or simulated workplace \n2.2 Tools materials and equipment needed to perform the required \ntasks \n2.3 References and manuals \n2.4 PPE \n2.5 First Aid Kit PPE \n3. Method of \nAssessment \n \nCompetency in this unit may be assessed through: \n3.1 Demonstration/Observation with Oral Questioning \n3.2 Portfolio with Interview \n3.3 Written Test \n3.4 Written Report \n4. \nContext of \nAssessment \n4.1 Competency maybe assessed in actual workplace or at the \ndesignated TESDA accredited Assessment Center.\n\n--- PDF PAGE 53 ---\nAgricultural Machinery Servicing (4 – Wheel Tractor) NC III Revision 00 Promulgated 01/11/2019 49 \n \n \n \n \n \nUNIT OF COMPETENCY : \nPERFORM ESTIMATION AND BASIC \n \n \nCALCULATION \n \nUNIT CODE \n:"
