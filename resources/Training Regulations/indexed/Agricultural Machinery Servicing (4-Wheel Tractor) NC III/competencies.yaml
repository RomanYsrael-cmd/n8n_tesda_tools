        "source_text": "AFF723304 \n \nUNIT DESCRIPTOR \n \n: \nThis unit covers knowledge, skills and attitude to \nservice engine’s fuel system, service cooling \nsystem, service body and power train system for \n4-wheel tractor which includes service engine’s \nlubrication system and testing. \n \n \nELEMENT \n \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange Statement \n \nREQUIRED \nKNOWLEDGE AND \nATTITUDE \n \nREQUIRED SKILL \n \n1. Service engine \nfuel system \n1.1 Handling \nrequirement of fuel \nare reviewed based \non Safety Data Sheet \n(SDS) and Globally \nHarmonized \nStandard (GHS). \n1.2 Engine fuel system \nis tested based on \nmanufacturer’s \nspecification. \n1.3 Removal and \nreplacement of the \nInjection pump unit is \nsupervised based on \nmanufacturers \nspecification. \n1.4 Fuel system is \ncleaned following \nindustry \nspecification. \n1.5 Removal and \nreplacement of fuel \nfilters and strainers \nare directed following \nmanufacturer’s \nmanual and Toxic \nSubstances and \nHazardous and \nNuclear Wastes \nControl Act of 1990 \n1.6 Safety practices are \napplied following \nOSHS Rule 1080, \nRule 1090, Rule \n1150 and RA 6969 \n1.1 Uses of Safety Data \nSheet (SDS) and \nGlobally Harmonized \nStandard (GHS) \n1.2 Fuel system \ntroubleshooting \n1.3 Use of tools and \nspecial tools \n1.4 Clearance \nmeasurements \n1.5 Proper adjustments \nof clearances based \non manufacturer’s \nspecification \n1.6 Proper assembling \nand disassembling of \nfuel system \ncomponents \n1.7 Types and principles \nof combustion \nsystems \n1.8 Calibration test \nprocedures. \n1.9 Precaution in \nhandling of fuels and \ntools Rule1080 of \nOSHS \n1.10 OSHS \n- Rule 1090 – \nHazardous \nMaterial \n- Rule 1150 – \nMaterials \nHandling and \nStorage \n- Rule 1080 – \nPersonal \nProtective \nEquipment and \n1.1 Reviewing handling \nrequirement for fuel \nbased on SDS and \nGHS \n1.2 Testing of engine fuel \nsystem \n1.3 Supervising removal \nand replacement of \nthe Injection pump unit \n1.4 Cleaning Fuel system \n1.5 Directing removal and \nreplacement of fuel \nfilters and strainers \n1.6 Applying SDS Section \n4 - First aid, Section 6 \n– Accidental release \nmeasures and Section \n7 – handling and \nstorage \n1.7 Applying safety \npractices following \nOSHS\n\n--- PDF PAGE 78 ---\nAgricultural Machinery Servicing (4 – Wheel Tractor) NC III Revision 00 Promulgated 01/11/2019 74 \n \n \nELEMENT \n \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange Statement \n \nREQUIRED \nKNOWLEDGE AND \nATTITUDE \n \nREQUIRED SKILL \n \nDevices \n1.1 \nRA 6969-Toxic \nSubstances and \nHazardous and \nNuclear Wastes \nControl Act of 1990 \n(waste oil) \n2. Service cooling \nsystem \n2.1 Servicing \nrequirement of \ncoolant are reviewed \nbased on Safety \nData Sheet (SDS) \nand Globally \nHarmonized \nStandard (GHS) \n2.2 Cooling system is \ntested based on \nmanufacturers \nspecification. \n2.3 Radiator is repaired \nfollowing service \nrepair manual and \nenvironmental laws. \n2.4 Replacement of air \nfilter is supervised as \nper service repair \nmanual. \n2.5 Adjustment and \nreplacement of \nradiator fan and belt \nis carried-out \nfollowing service \nrepair manual. \n2.6 Oil replenishment \nand replacement are \nmanaged based on \nmanufacturer’s \nmanual and Toxic \nSubstances and \nHazardous and \nNuclear Wastes \nControl Act of 1990. \n2.7 Replenishment and \nreplacement of \ncoolant is overseen \naccording to \nmanufacturer’s \nmanual \n2.8 Safety measures are \npracticed according \nto OSHS Rule 1080, \n2.1 Uses of Safety Data \nSheet (SDS) and \nGlobally Harmonized \nStandard (GHS) \n2.2 Handling of basic and \nspecial tools based \non service manual \n2.3 Handling of \nhazardous liquids \nbased on OSHS Rule \n1090 \n2.4 Proper assembling \nand disassembling of \ncooling system \ncomponents \n2.5 Replacement and \nreplenishment of \ncoolant and oil \n2.6 Principles and \noperation of radiator \n2.7 Principles and \noperations of water \npump \n2.8 Radiator fluids \n2.9 Precaution in \nhandling coolant and \nspecial tools \n2.10 \nWearing of PPEs \nas required by \nRule1080 of OSHS \n2.11 \nOSHS \n- \nRule 1090 – \nHazardous \nMaterial \n- \nRule 1150 – \nMaterials \nHandling and \nStorage \n- \nRule 1080 – \nPersonal \nProtective \nEquipment \nand Devices \n2.12 \nRA 6969-Toxic \n2.1 Reviewing service \nrequirement of \ncoolant based on \nSDS and GHS \n2.2 Testing cooling \nsystem \n2.3 Repairing radiator \n2.4 Supervising \nreplacement of air \nfilter \n2.5 Carrying-out \nadjustment and \nreplacement of \nradiator fan and belt \n2.6 Managing oil \nreplenishment and \nreplacement \n2.7 Overseeing \nreplenishment and \nreplacement of \ncoolant \n2.8 Applying SDS Section \n4 - First aid, Section 6 \n– Accidental release \nmeasures and \nSection 7 – handling \nand storage \n2.9 Applying safety \npractices following \nOSHS\n\n--- PDF PAGE 79 ---\nAgricultural Machinery Servicing (4 – Wheel Tractor) NC III Revision 00 Promulgated 01/11/2019 75 \n \n \nELEMENT \n \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange Statement \n \nREQUIRED \nKNOWLEDGE AND \nATTITUDE \n \nREQUIRED SKILL \n \nRule 1090 and Rule \n1150 \nSubstances and \nHazardous and \nNuclear Wastes \nControl Act of 1990 \n2.13 \nRA 9003-\nEcological Solid \nWaste Management \nAct of 2000 \n3. Service body \nand power \ntrain system \nof engines \n \n \n3.1 Handling \nrequirement of oil \nand lubricant are \nreviewed based on \nSafety Data Sheet \n(SDS) and Globally \nHarmonized \nStandard (GHS) \n3.2 Body and power \ntrain system of \nengines is tested \nbased on \nmanufacturer’s \nspecification. \n3.3 Piston and piston \nring are removed \nand replaced \nfollowing service \nrepair manual and \nToxic Substances \nand Hazardous and \nNuclear Wastes \nControl Act of 1990. \n3.4 Valves are adjusted \nas per \nmanufacturers \nspecification \n3.5 Timing gears are set \naccording to \nmanufacturer’s \nspecification. \n3.6 Drive train is \nadjusted according \nto manufacturer’s \nspecification. \n3.7 Supervision duties is \nperformed following \nworkplace \nrequirement \n3.8 Safety practices are \napplied following \nOSHS Rule 1080, \n3.1 Uses of Safety Data \nSheet (SDS) and \nGlobally Harmonized \nStandard (GHS) \n3.2 Body and power train \nsystem \ntroubleshooting \n3.3 Clearance \nmeasurements \n3.4 Use of special tools \n3.5 Tightening torque for \nengines based on \nmanufacturer’s \nspecifications \n3.6 Basic Components of \nengine’s body and \npower train system \n3.7 Principles of \noperation and \nmaintenance of \nengines \n3.8 RA 8749-Clean Air \nAct of 1999 \n3.9 RA 6969-Toxic \nSubstances and \nHazardous and \nNuclear Wastes \nControl Act of 1990 \n3.10 \nWearing of PPEs \nas required by \nRule1080 of OSHS \n3.11 \nOSHS \n- \nRule 1090 – \nHazardous \nMaterial \n- \nRule 1150 – \nMaterials \nHandling and \nStorage \n- \nRule 1080 – \nPersonal \nProtective \nEquipment \n3.1 Reviewing handling \nrequirement for oil \nand lubricant based \non SDS and GHS \n3.2 Testing body and \npower train system of \nengines \n3.3 Removing and \nreplacing piston and \npiston ring \n3.4 Adjusting valves \n3.5 Setting timing gears \n3.6 Adjusting drive train \n3.7 Performing \nsupervision duties \n3.8 Applying SDS Section \n4 - First aid, Section 6 \n– Accidental release \nmeasures and \nSection 7 – handling \nand storage \n3.9 Applying safety \npractices following \nOSHS\n\n--- PDF PAGE 80 ---\nAgricultural Machinery Servicing (4 – Wheel Tractor) NC III Revision 00 Promulgated 01/11/2019 76 \n \n \nELEMENT \n \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange Statement \n \nREQUIRED \nKNOWLEDGE AND \nATTITUDE \n \nREQUIRED SKILL \n \nRule 1150 and 1090 \nand Devices \n4. Service \nengine \nlubrication \nsystem \n4.1 Handling \nrequirement of oil \nand lubricant are \nreviewed based on \nSafety Data Sheet \n(SDS) and Globally \nHarmonized \nStandard (GHS) \n4.2 Oil levels are \nchecked based on \nmanufacturers \nspecification \n4.3 Oil filters are \nreplaced following \nservice repair \nmanual and Toxic \nSubstances and \nHazardous and \nNuclear Wastes \nControl Act of 1990 \n4.4 Oil pump is \ninspected and \nrepaired as per \nservice repair \nmanual and Toxic \nSubstances and \nHazardous and \nNuclear Wastes \nControl Act of 1990. \n4.5 Supervision duties is \nperformed following \n4.6 Safety practices are \napplied following \nOSHS Rule 1080, \nRule 1090 and Rule \n1150 \n4.1 Uses of Safety Data \nSheet (SDS) and \nGlobally Harmonized \nStandard (GHS) \n4.2 Handling of \nlubricants \n4.3 Identification of \nlubricants \n4.4 Types and \nClassification of \nlubricants \n4.5 Lubricating system \ntheories and \nprinciples. \n4.6 Precaution in \nhandling lubricants \nand special tools \n4.7 Wearing of PPEs as \nrequired by \nRule1080 of OSHS \n4.8 OSHS \n- Rule 1090 – \nHazardous \nMaterial \n- Rule 1150 – \nMaterials \nHandling and \nStorage \n- Rule 1080 – \nPersonal \nProtective \nEquipment and \nDevices \n4.9 RA 6969-Toxic \nSubstances and \nHazardous and \nNuclear Wastes \nControl Act of 1990 \n4.1 Reviewing handling \nrequirement for oil \nand lubricant based \non SDS and GHS \n4.2 Checking oil levels \n4.3 Replacing oil filters \n4.4 Inspecting and \nrepairing oil pump \n4.5 Performing \nsupervision duties \n4.6 Applying SDS Section \n4 - First aid, Section 6 \n– Accidental release \nmeasures and \nSection 7 – handling \nand storage \n4.7 Applying safety \npractices following \nOSHS \n5. Complete \nwork \nprocesses \n \n. \n5.1 Tests are carried out \non part or system to \nensure normal \nfunctioning after \nservice* \n5.2 Final inspection is \nmade based on \nworkplace \nprocedure* \n5.3 Tractor is turned-\nover to client for \nacceptance following \n5.2 OSHS \n- Rule 1150 \n- Rule 1090 \n5.2 Final inspection \nprocedure \n5.3 Vehicle turn-over \nprocedure \n5.4 Accomplishment of \nworkplace \ndocuments \n5.5 Occupational Health \nand Safety \n5.1 Conducting final tests \nand inspections \n5.2 Performing tractor \nturn-over \n5.3 Restoring work area \n5.4 Managing wastes \n5.5 Checking and storing \ntools and equipment \n5.6 Accomplishing \nworkplace documents\n\n--- PDF PAGE 81 ---\nAgricultural Machinery Servicing (4 – Wheel Tractor) NC III Revision 00 Promulgated 01/11/2019 77 \n \n \nELEMENT \n \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange Statement \n \nREQUIRED \nKNOWLEDGE AND \nATTITUDE \n \nREQUIRED SKILL \n \nworkplace procedure \n5.4 Work area is restored \nfollowing 5S of good \nhousekeeping. \n5.5 Waste management \nis practiced \naccording to \nenvironmental \nlaws. \n5.6 Tools and equipment \nare checked and \nstored according to \nworkplace \nprocedures \n5.7 Workplace \ndocuments are \naccomplished \naccording to \nworkplace \nprocedures \nprocedures of \nhandling agricultural \nequipment \n5.6 Wearing of PPEs as \nrequired by \nRule1080 of OSHS \n5.7 5S of Good \nHousekeeping \n5.8 Environmental-\nconservation \nprocedures \n- \n3R \n5.9 RA 9003-Ecological \nSolid Waste \nManagement Act of \n2000 \n5.10 RA 6969-Toxic \nSubstances and \nHazardous and \nNuclear Wastes \nControl Act of 1990\n\n--- PDF PAGE 82 ---\nAgricultural Machinery Servicing (4 – Wheel Tractor) NC III Revision 00 Promulgated 01/11/2019 78 \n \nRANGE OF VARIABLES \n \n1. Fuel System \n \nFuel system includes: \n1.1 Fuel injection Pump \n1.2 Fuel Filters \n1.3 Fuel Line \n1.4 Fuel Tank \n1.5 Strainers \n1.6 Fuel feed pump (mechanical/electric) \n1.7 Injection nozzle \n1.8 Shut off valve \n2. Cooling System \n \nCooling system includes: \n2.1 Radiator \n2.2 Radiator fan and belt \n2.3 Water Pump \n2.4 Thermostat \n2.5 Air Filter \n2.6 Cooling Fan \n2.7 Radiator cap \n2.8 Water jacket \n2.9 Cooling reservoir \n2.10 \nRadiator hose \n3. Body and Power Train system of \nEngines \n \nBody and Power Train system of Engines \nincludes: \n3.1 Cylinder head \n3.2 Cylinder block \n3.3 Crankshaft \n3.4 Piston and Piston ring \n3.5 Connecting rod \n3.6 Camshaft \n3.7 Rocker arm assembly \n3.8 Intake and exhaust valves \n3.9 Timing gear \n3.10 \nFlywheel \n4. Drive Train \n \nIncludes: \n4.1 Gears \n4.2 Main Drive Shaft \n5. Environmental Laws \nMay include: \n5.1 RA 6969-Toxic Substances and Hazardous \nand Nuclear Wastes Control Act of 1990 \n5.2 RA 9003-Ecological Solid Waste \nManagement Act of 2000\n\n--- PDF PAGE 83 ---\nAgricultural Machinery Servicing (4 – Wheel Tractor) NC III Revision 00 Promulgated 01/11/2019 79 \n \nEVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 Service engine fuel system \n1.1.1 Reviewed handling requirement of fuel based on SDS and \nGHS \n1.1.2 Supervised removal and replacement of the Injection pump \nunit \n1.1.3 Directed removal and replacement of fuel filters and strainers \n1.1.4 Applied safety practices following OSHS Rule 1090, Rule \n1150 and RA 6969 \n1.2 Service cooling system \n1.2.1 Reviewed handling requirement of coolant based on SDS and \nGHS \n1.2.2 Repaired Radiator \n1.2.3 Supervised replacement of air filter \n1.2.4 Managed oil replenishment and replacement \n1.2.5 Overseen replenishment and replacement of coolant \n1.2.6 Applied safety practices following OSHS Rule 1090 \n1.3 Service body and power train system of engines \n1.3.1 Reviewed handling requirement of coolant based on SDS and \n GHS \n1.3.2 Removed and replaced Piston and piston ring \n1.3.4 Adjusted valves \n1.3.4 Set Timing gears according to manufacturer’s specification. \n1.3.5 Adjusted drive train \n1.3.6 Applied safety practices \n1.4 Service engine Lubrication System \n1.4.1 Reviewed handling requirement of oil and lubricant based on \nSDS and GHS \n1.4.2 Checked oil levels \n1.4.4 Replaced oil filters \n1.4.4 Inspected and repaired oil pump \n1.4.5 Applied safety practices following OSHS Rule 1090 and Rule \n1150 \n1.5 Complete work processes \n1.5.1 Carried out Tests on part or system \n1.5.2 Turned-over Tractor to client \n1.5.3 Restored Work area following 5S of good housekeeping. \n1.5.4 Practiced waste management \n2 \nResource \nImplications \nThe following resources should be provided: \n2.1 Actual or simulated workplace \n2.2 Tools materials and equipment needed to perform the required tasks \n2.3 References and manuals \n2.4 PPE \n2.5 First Aid Kit PPE \n3 \nMethod of \nAssessment \n \nCompetency in this unit may be assessed through: \n3.1 Demonstration/Observation with Oral Questioning \n3.2 Portfolio with Interview \n3.3 Written Test \n3.4 Third-party report \n4 \nContext of \nAssessment \n5.1 Competency maybe assessed in actual workplace or at the \ndesignated TESDA accredited Assessment Center.\n\n--- PDF PAGE 84 ---\nAgricultural Machinery Servicing (4 – Wheel Tractor) NC III Revision 00 Promulgated 01/11/2019 80 \n \nUNIT OF COMPETENCY \n: DIAGNOSE AND REPAIR AXLE SYSTEM OF 4- \nWHEEL TRACTOR \n \nUNIT CODE \n \n \n:"
