n \n7 – handling and \nstorage \n \n \n \n3. Service \nElectrical \nCircuit \n3.1 Electrical lines are \ntested based on \nindustry \nspecification \n3.2 Repair of short \ncircuits is \nsupervised \naccording to \nindustry \nspecification. \n3.3 Removal and \nreplacement of \nconsumable \nelectrical parts is \nguided based on \nmanufacturer’s \nspecifications. \n3.4 Electrical safety \n3.1 Types of electrical \nconnection. \n3.2 Schematic and wiring \ndiagrams \n3.3 Principles on electrical \ncircuits \n3.4 Testing of wiring \ncoherence procedure \n3.5 Electrical Systems \nprinciples and \noperations \n3.6 Causes of Short \ncircuits \n3.7 Repair procedures of \nshort circuits \n3.8 Occupational Health \nand Safety procedures \nfor handling 12V DC \n3.1 Handling electrical \ncurrent \n3.2 Wearing PPE. \n3.3 Use multi-tester, \nvoltmeter, volt \nammeter. \n3.4 Using tools for \nremoval and \nreplacement of \nelectrical parts. \n3.5 Interpreting \nschematic and wiring \ndiagram \n3.6 Wearing of PPE \n3.7 Use of multi-tester, \nvoltmeter, volt \nammeter \n3.8 Interpreting\n\n--- PDF PAGE 73 ---\nAgricultural Machinery Servicing (4 – Wheel Tractor) NC III Revision 00 Promulgated 01/11/2019 69 \n \nindicators are \ninspected following \nthe operations \nmanual. \n \nelectrical system. \n3.9 Wearing of PPEs as \nrequired by Rule1080 \nof OSHS \n3.10 \nRA 9003-Ecological \nSolid Waste \nManagement Act of \n2000 \nschematic and wiring \ndiagram \n3.9 Soldering of metal \nand electrical \ncomponents. \n3.10 Reading of \nindicators \n4. Service \nstarting \nsystem \ncomponents \n \n \n \n4.1 Starting system \ncomponents are \nchecked and \ninspected based \non manufacturer’s \nspecification \n4.2 Problems on \nstarting \ncomponents are \nidentified based \non service manual \nand toxic \nSubstances and \nHazardous and \nNuclear Wastes \nControl Act of \n1990. \n4.3 Replace and \nrepair of starting \nsystem \ncomponent are \ncarried-out/ \nsupervised based \non manufacturer’s \