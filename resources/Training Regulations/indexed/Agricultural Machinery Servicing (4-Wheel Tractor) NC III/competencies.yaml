        },
        "source_text": "400311319 \n \nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes required \nto lead in the effective dissemination and discussion of ideas, \ninformation, and issues in the workplace. This includes \npreparation of written communication materials. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are \nelaborated in the Range of \nVariables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Communicate \ninformation \nabout \nworkplace \nprocesses \n1.1 Relevant \ncommunication \nmethod is selected \nbased on workplace \nprocedures \n1.2 Multiple operations \ninvolving several \ntopics/areas are \ncommunicated following \nenterprise requirements \n1.3 Questioning is applied \nto gain extra information \n1.4 Relevant sources of \ninformation are \nidentified in accordance \nwith workplace/ client \nrequirements \n1.5 Information is selected \nand organized following \nenterprise procedures \n1.6 Verbal and written \nreporting is undertaken \nwhen required \n1.7 Communication and \nnegotiation skills are \napplied and maintained \nin all relevant situations \n1.1. Organization \nrequirements \nfor written and \nelectronic \ncommunication \nmethods \n1.2. Effective verbal \ncommunication \nmethods \n1.3. Business \nwriting \n1.4. Workplace \netiquette \n1.1 Organizing \ninformation \n1.2 Conveying intended \nmeaning \n1.3 Participating in a \nvariety of workplace \ndiscussions \n1.4 Complying with \norganization \nrequirements for the \nuse of written and \nelectronic \ncommunication \nmethods \n1.5 Effective business \nwriting \n1.6 Effective clarifying \nand probing skills \n1.7 Effective \nquestioning \ntechniques \n(clarifying and \nprobing) \n2. Lead workplace \ndiscussions \n2.1 Response to workplace \nissues are sought \nfollowing enterprise \nprocedures \n2.2 Response to workplace \n2.1 Organization \nrequirements for \nwritten and \nelectronic \ncommunication \n2.1 Organizing \ninformation \n2.2 Conveying \nintend