ry Servicing (4 – Wheel Tractor) NC III Revision 00 Promulgated 01/11/2019 86 \n \nRANGE OF VARIABLES \n \n1. Axle system \n \nAxle system may include: \n1.1 Front axle bracket \n1.2 Front axle support \n1.3 Front axle differential \n1.4 Bevel gear case \n1.5 Wheel hub \n1.6 Rear axle bracket \n1.7 Rear axle support \n1.8 Rear axle differential \n1.9 Oil seal \n1.10 \nCross joints \n2. Brake system components \nBrake system components may include: \n2.1 Brake housing \n2.2.1. Brake discs \n2.2.2. Brake plate \n3. Inspection of brake system \nInspection of brake system may include: \n3.1 brake fluid testing \n3.2 component wear analysis \n3.3 inspection of brake clearance \n4. Steering system \ncomponents \nSteering system components may include: \n4.1 Steering wheel \n4.2 Steering cylinder \n4.3 Steering lines \n4.4 Steering reservoir \n4.5 Oil sealer \n4.6 Relief valve \n4.7 Steering oil pump \n5. Checking of steering \nsystem components \n \nChecking of steering system components may include: \n5.1 Pressure of oil \n5.2 Leakages checking on steering lines \n5.3 Checking steering wheel play \n5.4 Oil viscosity \n5.5 Component wear analysis \n6. Transfer case system \nTransfer case system may include: \n6.1 Drive system \n6.2 Oil seal \n6.3 Bearing \n6.4 Pins \n7. Environmental Laws \nMay include: \n7.1 RA 9003-Ecological Solid Waste Management \nAct of 2000 \n7.2 RA 6969-Toxic Substances and Hazardous \nand Nuclear Wastes Control Act of 1990\n\n--- PDF PAGE 91 ---\nAgricultural Machinery Servicing (4 – Wheel Tractor) NC III Revision 00 Promulgated 01/11/2019 87 \n \nEVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 Serviced front and rear axles \n1.1.1 Reviewed handling requirement of oil and \nlubricant based on SDS and GHS \n1.1.2 Serviced axle system \n1.1.3 Checked Gear and hydraulic oil \n1.1.4 Conducted replenishment and replacement \n of Gear and hydraulic oil \n 1.1.5 Applied safety practices following OSHS \n Rule 1090, Rule 1080 and Rule 1150 \n1.2 Service brake system \n1.2.1 Reviewed handling requirement of oil and lubricant \nbased on SDS and GHS \n1.2.2 Inspected brake system components \n1.2.3 Adjusted and replaced brake system \n components \n1.2.4 Applied safety practices following OSHS \n Rule 1090, Rule 1080 and Rule 1150 \n1.3 Service steering system \n1.3.1 Reviewed handling requirement of oil and \nlubricant based on SDS and GHS \n1.3.2 Replaced and adjusted Steering system \n components \n 1.3.3 Conducted oil replenishment and \n replacement \n 1.3.4 Applied safety practices following OSHS \n Rule 1090, Rule 1080 and Rule 1150 \n1.4 Service differential system \n1.4.1 Reviewed handling requirement of oil and \nlubricant based on SDS and GHS \n1.4.2 Replaced Pinion ring gear assembly \n1.4.3 Applied and maintained Greasing \n1.4.4 Applied safety practices following OSHS \n Rule 1090, Rule 1080 and Rule 1150 \n1.5 Complete work processes \n1.5.1 Made Final inspection \n1.5.2 Turned-over tractor to client \n1.5.3 Restored Work area following 5S of good \nhousekeeping. \n1.5.4 Practiced waste management \n1.5.5 Checked and stored Tools and equipment \n2 \nResource Implications \nThe following resources should be provided: \n2.1 Actual or simulated workplace \n2.2 Tools materials and equipment needed to perform the \nrequired tasks \n2.3 References and manuals \n2.4 PPE \n2.5 First Aid Kit PPE \n3 \nMethod of Assessment \n \nCompetency in this unit may be assessed through: \n3.1 Demonstration/Observation with Oral Questioning \n3.2 Portfolio with Interview \n3.3 Written Test \n3.4 Third-party report \n4 \nContext of Assessment \n4.1 Competency maybe assessed in actual workplace or at \nthe designated TESDA accredited Assessment Center.\n\n--- PDF PAGE 92 ---\nAgricultural Machinery Servicing (4 – Wheel Tractor) NC III Revision 00 Promulgated 01/11/2019 88 \n \nUNIT OF COMPETENCY : \nDIAGNOSE AND REPAIR HYDRAULIC SYSTEM OF \n4-WHEEL TRACTOR \n \nU