      "text": "COMPETENCY ASSESSMENT REQUISITE 4.2.1 Self-Assessment Guide. The self-assessment guide (SAG) is accomplished by the candidate prior to actual competency assessment. SAG is a pre-assessment tool to help the candidate and the assessor determine what evidence is available, where gaps exist, including readiness for assessment. This document can: a) Identify the candidate’s skills and knowledge b) Highlight gaps in candidate’s skills and knowledge c) Provide critical guidance to the assessor and candidate on the evidence that need to be presented d) Assist the candidate to identify key areas in which practice is needed or additional information or skills that should be gained prior 4.2.2 Accredited Assessment Center. Only Assessment Center accredited by TESDA is authorized to conduct competency assessment. Assessment centers undergo a quality assured procedure for accreditation before they are authorized by TESDA to manage the assessment for National Certification. 4.2.3 Accredited Competency Assessor. Only accredited competency assessor is authorized to conduct assessment of competence. Competency assessors undergo a quality assured system of accreditation procedure before they are authorized by TESDA to assess the competencies of candidates for National Certification. Agricultural Machinery Servicing (4 – Wheel Tractor) NC III Revision 00 Promulgated 01/11/2019 171 Supermarket of Competencies AGRI-FISHERY Sector Supermarket of Competencies AGRI-FISHERY Sector CORE COMPETENCIES COMMON COMPETENCIES BASIC COMPETENCIES Lead workplace communication Lead small teams Apply critical thinking and problem-solving techniques in the workplace Work in a diverse environment Use information systematically Evaluate occupational safety and health work practices Evaluate environmental work practices Facilitate entrepreneurial skills for micro-small- medium enterprises (MSMEs) Propose methods of applying learning and innovation in the organization Perform estimation and calculations Apply safety measures in farm operations Use farm servicing tools and equipment Process farm wastes Perform Shop Maintenance Maintain service records Conduct Diagnosis Diagnose and Repair Hydraulic System of 4-Wheel Tractor Diagnose and Repair Axle System of 4- Wheel Tractor Diagnose and Repair Electrical Systems of 4-Wheel Tractor Diagnose and Repair Engine System of 4- Wheel Tractor Diagnose and Repair Transmission System of 4-Wheel Tractor Agricultural Machinery Servicing (4 – Wheel Tractor) NC III Revision 00 Promulgated 01/11/2019 172"
