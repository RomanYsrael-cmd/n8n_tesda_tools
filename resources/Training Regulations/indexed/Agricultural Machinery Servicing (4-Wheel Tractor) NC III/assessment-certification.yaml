  "source_text": "SECTION 4 \nASSESSMENT AND CERTIFICATION ARRANGEMENT \n \nCompetency Assessment is the process of collecting evidence and making \njudgments whether competency has been achieved. The purpose of assessment is \nto confirm that an individual can perform to the standards expected at the \nworkplace as expressed in relevant competency standards. \n \nThe assessment process is based on evidence or information gathered to \nprove achievement of competencies. The process may be applied to a full \nqualification or employable unit(s) of competency in partial fulfillment of the \nrequirements of the national qualification. \n \n \n4.1. \nNATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS \n \n4.1.1 A National Certificate (NC) is issued when a candidate has \ndemonstrated competence on all units of competency in a qualification \nwith a promulgated Training Regulations. \n \n4.1.2 A Certificate of Competency (CoC) is issued by the Authority to \nindividuals who were assessed as competent in a single unit or cluster \nof related units of competency. \n \nCOC 1: Diagnose and Repair Electrical Systems of 4-Wheel Tractor \n \nCOC 2: Diagnose and Repair Engine System of 4-Wheel Tractor \n \nCOC 3: Diagnose and repair axle, hydraulic and transmission \n systems of 4-wheel tractor \n- Diagnose and Repair Axle System of 4-Wheel Tractor \n- Diagnose and Repair Hydraulic System of 4-Wheel Tractor \n- Diagnose and Repair Transmission System of 4-Wheel Tractor \n \n \n4.1.3 Upon accumulation of the COCs acquired, an individual shall be issued \nthe corresponding National Certificate for the Qualification. \n \n4.1.4 Individuals wanting to be certified will have to be assessed in \naccordance with the requirements identified in the relevant unit/s of \ncompetency. \n \n4.1.5 The industry shall determine assessment and certification requirements \nfor each qualification with promulgated Training Regulations. It includes \nthe following: \n \na. Entry requirements for candidates \nb. Evidence gathering methods \nc. Qualification requirements of competency assessors \nd. Specific assessment and certification arrangements as identified by \nindustry\n\n--- PDF PAGE 174 ---\nAgricultural Machinery Servicing (4 – Wheel Tractor) NC III Revision 00 Promulgated 01/11/2019 170 \n \n4.9.6 Recognition of Prior Learning (RPL). Candidates who have gained \ncompetencies through informal training, previous work or life experiences \nmay apply for recognition in a particular qualification through a \nrecognition/ assessment process. \n \n4.2. \n COMPETENCY ASSESSMENT REQUISITE \n \n4.2.1 \nSelf-Assessment Guide. The self-assessment guide (SAG) is \naccomplished by the candidate prior to actual competency \nassessment. SAG is a pre-assessment tool to help the candidate and \nthe assessor determine what evidence is available, where gaps exist, \nincluding readiness for assessment. \n \nThis document can: \n \na) Identify the candidate’s skills and knowledge \nb) Highlight gaps in candidate’s skills and knowledge \nc) Provide critical guidance to the assessor and candidate on the \nevidence that need to be presented \nd) Assist the candidate to identify key areas in which practice is \nneeded or additional information or skills that should be gained prior \n \n4.2.2 Accredited Assessment Center. Only Assessment Center accredited \nby TESDA is authorized to conduct competency assessment. \nAssessment centers undergo a quality assured procedure for \naccreditation before they are authorized by TESDA to manage the \nassessment for National Certification. \n \n4.2.3 Accredited Competency Assessor. Only accredited competency \nassessor is authorized to conduct assessment of competence. \nCompetency assessors undergo a quality assured system of \naccreditation procedure before they are authorized by TESDA to \nassess the competencies of candidates for National Certification.\n\n--- PDF PAGE 175 ---\nAgricultural Machinery Servicing (4 – Wheel Tractor) NC III Revision 00 Promulgated 01/11/2019 171 \n \n \n \nSupermarket of Competencies\nAGRI-FISHERY Sector\nSupermarket of Competencies \nAGRI-FISHERY Sector \n \n \n \n \nCORE \nCOMPETENCIES \n \nCOMMON \nCOMPETENCIES \n \n \nBASIC \nCOMPETENCIES \n \n \nLead workplace \ncommunication \nLead small teams \nApply critical thinking \nand problem-solving \ntechniques in the \nworkplace \nWork in a diverse \nenvironment \nUse information \nsystematically \nEvaluate occupational \nsafety and health work \npractices \nEvaluate \nenvironmental work \npractices \nFacilitate entrepreneurial \nskills for micro-small-\nmedium enterprises \n(MSMEs) \nPropose methods of \napplying learning and \ninnovation in the \norganization \nPerform estimation \nand calculations \nApply safety \nmeasures in farm \noperations \nUse farm servicing \ntools and \nequipment \nProcess farm \nwastes \nPerform Shop \nMaintenance \nMaintain service \nrecords \nConduct Diagnosis \nDiagnose and Repair \nHydraulic System of \n4-Wheel Tractor \nDiagnose and Repair \nAxle System of 4-\nWheel Tractor \n \nDiagnose and Repair \nElectrical Systems of \n4-Wheel Tractor \nDiagnose and Repair \nEngine System of 4-\nWheel Tractor \n \nDiagnose and Repair \nTransmission System \nof 4-Wheel Tractor\n\n--- PDF PAGE 176 ---\nAgricultural Machinery Servicing (4 – Wheel Tractor) NC III Revision 00 Promulgated 01/11/2019 172 \n \n \n \nGLOSSARY OF TERMS \n \n4-WHEEL TRACTOR \nRefers to describe a farm vehicle that provides the power \nand traction to mechanize agricultural tasks, especially for \ntilling operations \n \nACCESSORIES \nRefers to additional items or parts to complete a certain \nunit and does not have of any importance in the system \n \nELECTROLYTIC TYPE Refers to a type of battery which can be charged by \nreversing internal reactions inside the system \n \nEQUIPMENT \nRefers to tools or any tangible resources to be used to \nperform the study of four-wheel tractor servicing \ne.g. four-wheel tractor and air compressor \n \nHYDRAULIC SYSTEM \nRefers to a system where fluids (oil, in this case) are \ninvolved \n \nMAINTENANCE FREE \nTYPE \nRefers to a type of battery that does not need for \nmaintaining the water/acid level inside the system \n \nSERVICE \nRefers to diagnosing, repairing and replacement \nSPECIAL TOOLS \nRefer to tools to repair or troubleshoot four-wheel tractor \nunit/s which are not available in the market, and should \nbe fabricated to fit to a particular system of a four-wheel \ntractor\n\n--- PDF PAGE 177 ---\nAgricultural Machinery Servicing (4 – Wheel Tractor) NC III Revision 00 Promulgated 01/11/2019 173 \n \n \n \n \n \n \n \nTRAINING REGULATIONS (TRs) \nDOCUMENT REVISION HISTORY \n \n \n \n \nQualification Title: Agricultural Machinery Servicing NCIII \nQualification \nCode: \nAFFAMS318 \n \n \n \n \n \nRevision \nNo. \nDocument \nDescription Types* \nReplaces \nVersion \n(TESDA Board \nResolution \nNo./ Date) \nNew Version \n(TESDA Board \nResolution \nNo./ Date) \nDeployme\nnt Circular \n00 \nDocument Created \nAgricultural Machinery \nServicing NC III \nNot Applicable \nTB No.2019-02 \nJanuary 11, 2019 \n \nNot \nApplicable \n Legend: *Description Types \n- Document Created \n- Document Amended\n\n--- PDF PAGE 178 ---\nAgricultural Machinery Servicing (4 – Wheel Tractor) NC III Revision 00 Promulgated 01/11/2019 174 \n \n \nACKNOWLEDGEMENTS \n \nThe Technical Education and Skills Development Authority (TESDA) would \nlike to recognize the commitment of industry stakeholders who shared their time and \nexpertise for the development of this Training Regulations. This TR is also dedicated \nin memory of Engr. George Q. Canapi, a member of technical experts panel. \n \nTHE TECHNICAL EXPERT PANEL (TEP) \n \nENGR. GEORGE Q. CANAPI (+) \nTechnical Expert \nAgricultural Machinery Manufacturers and \nDistributors Association (AMMDA), Inc. \nMakati City, Metro Manila \n \nENGR. JOEL R. PANAGSAGAN \nTechnical Expert \nSuper Trade Enterprises \nQuezon City \nENGR. ACE TWAIN DUPLA \nTechnical Expert \nSuper Trade Enterprises \nQuezon City \n \nENGR. AREODEAR RICO \nTechnical Expert \nPhilippine Society of Agricultural Engineers \nMetro Manila \n(+) Deceased \n \n \nTHE PARTICIPANTS OF NATIONAL VALIDATION \n \nMR. ESTRELITO DIOSO \nJ-Jep Trading and Services \nCalaca, Batangas \n \n MR. ISIDRO MONTIZOR \nJ-Jep Trading and Services \nCalaca, Batangas \nMR. FRANCISCO ETE \nSupertrade Bulacan Warehouse, \nBulacan \n \nMR. AMTEO MONTERDE \nSupertrade Bulacan Warehouse, \nBulacan \n \nMR. ROLANDO ETE \nSupertrade Bulacan Warehouse, \nBulacan \n \nMR. JOHN ROBERT PEREZ \nJ-Jep Trading and Services \nCalaca, Batangas \nMR. ARJAY JULIANO \nJ-Jep Trading and Services \nCalaca, Batangas \nMR.EDGARDO TEODORO \nSupertrade Bulacan Warehouse, \nBulacan \n \nMR.RANDY MENESES \nJ-Jep Trading and Services \nCalaca, Batangas\n\n--- PDF PAGE 179 ---\nAgricultural Machinery Servicing (4 – Wheel Tractor) NC III Revision 00 Promulgated 01/11/2019 175 \n \n \nThe Members of the TESDA Board and Secretariat \n \nThe MANAGEMENT and STAFF of the TESDA Secretariat \n \n• Qualifications and Standards Office (QSO) \n \nTESDA – QSO Technical Facilitators \n \nCompetency Standards Development Division \n \nMS. BERNADETTE N. SERVAZ- AUDIJE \nMS. CHERRY L. TORALDE \nMS. MELCHRIS A. ATIS \n \nCompetency Programs and Standards Development Division \n \nMS. MERCEDES E. JAVIER \nMS. FORTUNATA L. BACO"
