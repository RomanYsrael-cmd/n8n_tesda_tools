      "text": "6 The guidelines on assessment and certification are discussed in detail in the Procedures Manual on Assessment and Certification and Guidelines on the Implementation of the Philippine TVET Qualification and Certification System (PTQCS). --- PDF PAGE 46 --- TR – RUBBER PROCESSING NC II 44 Supermarket of Competencies AGRI-FISHERY Sector Receive latex and lumps Produce blanketed rubber sheet Perform rubber drying operation Apply Safely Measures in farm operations Use Farm Tools and Equipment Perform Estimation and Basic Calculation Work in team environment Participate in workplace communication Practice career professionalism Practice occupational health and safety procedures --- PDF PAGE 47 --- TR – RUBBER PROCESSING NC II 45 For the purpose of this standard, the word • Blanketing (rubber)- process of flattening the rubber slabs through miller machine. • Drying is a mass transfer process consisting of the removal of water or another solvent by evaporation from a solid, semi-solid or liquid. This process is often used as a final production step before selling or packaging products. • Latex- as found in nature is a milky fluid found in 10% of all flowering plants (angiosperms). It is a complex emulsion consisting of proteins, alkaloids, starches, sugars, oils, tannins, resins, and gums that coagulates on exposure to air. It is usually exuded after tissue injury. In most plants, latex is white, but some have yellow, orange, or scarlet latex. • Milling- process of breaking a solid material into smaller pieces • Standard – the set of criteria and specifications of quality determining the grades, described as product characteristics such as maturity, color, cleanliness, shape, free from decay and blemishes and uniformity of size. • Shredding- cutting off into smaller pieces --- PDF PAGE 48 --- TR – RUBBER PROCESSING NC II 46 The Technical Education and Skills Development Authority (TESDA) wishes to extend gratitude and appreciation to the many representative