  "source_text": "SECTION 4\nNATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1\nTo attain the National Qualification of Rubber Processing NC II, the candidate\nmust demonstrate competence in all units listed in Section 1. Successful\ncandidates shall be awarded a National Certificate signed by the TESDA\nDirector General.\n4.2\nThe qualification of Rubber Processing NC II may be attained through:\n4.2.1\nAccumulation of Certificates of Competency (COCs) in the following\nareas:\n4.2.1.1\nReceive latex and lump\n4.2.1.2\nProduce dried rubber\n• Produce blanketed rubber sheet\n• Perform rubber drying operation\n\nSuccessful candidates shall be awarded Certificates of Competency (COCs)\nbearing the signature of the Regional Director and Chair of the recognized local\nindustry body.\n\n4.2.2\nDemonstration of competence through project-type assessment covering\nall required units of qualification\n\n4.3\nAssessment shall focus on the core units of competency. The tool and common\nunits shall be integrated or assessed concurrently with the core units.\n\n4.4\nCandidates can be assessed on individual units of competency and be issued\nCertificates of Competency if found competent. Certificates of Competency shall\nbear the signature of the Regional Director and Chair of the recognized local\nindustry body.\n\n4.5\nThe following are qualified to apply for assessment and certification:\n4.5.1\nGraduates of formal, non – formal and informal including enterprise –\nbased training programs\n4.5.2\nExperienced workers (wage employed or self – employed)\n\n4.6\nThe guidelines on assessment and certification are discussed in detail in the\nProcedures Manual on Assessment and Certification and Guidelines on the\nImplementation of the Philippine TVET Qualification and Certification System\n(PTQCS).\n\n--- PDF PAGE 46 ---\nTR – RUBBER PROCESSING NC II\n\n44\n\nSupermarket of Competencies\nAGRI-FISHERY Sector\n\nReceive latex\nand lumps\nProduce\nblanketed rubber\nsheet\nPerform rubber\ndrying operation\nCORE\nCOMPETENCIES\n\nCOMMON\nCOMPETENCIES\nApply Safely\nMeasures in\nfarm\noperations\nUse Farm Tools\nand Equipment\nPerform\nEstimation and\nBasic Calculation\nWork in team\nenvironment\nParticipate in\nworkplace\ncommunication\nBASIC\nCOMPETENCIES\nPractice career\nprofessionalism\n\nPractice occupational\nhealth and safety\nprocedures\n\n--- PDF PAGE 47 ---\nTR – RUBBER PROCESSING NC II\n\n45\n"
