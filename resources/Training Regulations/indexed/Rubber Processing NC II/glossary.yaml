  "source_text": "For the purpose of this standard, the word\n\n•\nBlanketing (rubber)- process of flattening the rubber slabs through miller\nmachine.\n\n•\nDrying is a mass transfer process consisting of the removal of water or\nanother solvent by evaporation from a solid, semi-solid or liquid. This\nprocess is often used as a final production step before selling or packaging\nproducts.\n\n•\nLatex- as found in nature is a milky fluid found in 10% of all flowering plants\n(angiosperms). It is a complex emulsion consisting of proteins, alkaloids,\nstarches, sugars, oils, tannins, resins, and gums that coagulates on\nexposure to air. It is usually exuded after tissue injury. In most plants, latex\nis white, but some have yellow, orange, or scarlet latex.\n•\nMilling- process of breaking a solid material into smaller pieces\n\n•\nStandard – the set of criteria and specifications of quality determining the\ngrades, described as product characteristics such as maturity, color,\ncleanliness, shape, free from decay and blemishes and uniformity of size.\n\n•\nShredding- cutting off into smaller pieces\n\n--- PDF PAGE 48 ---\nTR – RUBBER PROCESSING NC II\n\n46",
