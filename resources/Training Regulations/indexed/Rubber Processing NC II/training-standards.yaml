    "source_text": "SECTION 3 TRAINING STANDARDS\n\nThese guidelines are set to provide the Technical and Vocational Education and\nTraining (TVET) providers with information and other important requirements to\nconsider when designing training programs for RUBBER PROCESSING NC ll.\n\n3.1\nCURRICULUM DESIGN\n\nCourse Title: RUBBER PROCESSING Level: NC II\n\nNominal Training Duration:\n18 hrs -\nBasic Competencies\n14 hrs -\nCommon Competencies\n90 hrs -\nCore Competencies\n40 hrs -\nOJT\n162 hrs -\nTotal training duration\n\nCourse Description:\n\nThis course is designed to enhance the knowledge, desirable skills and attitudes of\nRubber Processing NC II in accordance with industry standards. It covers core\ncompetencies such as: receive latex and lumps, produce blanketed rubber sheet and\nperform rubber drying operation.\n\nBASIC COMPETENCIES\n(18 hrs)\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and convey\nworkplace information.\n1.2 Complete relevant work\nrelated documents.\n1.3 Participate in workplace\nmeeting and discussion.\n•\nGroup\ndiscussion\n•\nInteraction\n\n•\nDemonstration\n•\nObservation\n•\nInterviews/\nquestioning\n2. Work in a team\nenvironment\n2.1 Describe and identify\nteam role and\nresponsibility in a team.\n2.2 Describe work as a team\nmember.\n•\nDiscussion\n•\nInteraction\n\n•\nDemonstration\n•\nObservation\n•\nInterviews/\nquestioning\n3. Practice career\nprofessionalism\n3.1 Integrate personal\nobjectives with\norganizational goals.\n3.2 Set and meet work\npriorities.\n3.3 Maintain professional\ngrowth and development.\n•\nDiscussion\n•\nInteraction\n\n•\nDemonstration\n•\nObservation\n•\nInterviews/\nquestioning\n\n--- PDF PAGE 38 ---\nTR – RUBBER PROCESSING NC II\n\n36\n4. Practice\noccupational\nhealth and safety\n4.1 Identify hazards and risks\n4.2. Evaluate hazard and risks\n4.3. Control hazards and risks\n4.4. Maintain occupational\nhealth and safety\nawareness\n• Discussion\n• Plant tour\n• Symposium\n•\nObservation\n•\nInterview\n\nCOMMON COMPETENCIES\n(14 hrs.)\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Apply safety\nmeasures in\nfarm operations\n1.1. Determine areas of\nconcern for safety\nmeasures\n1.2. Apply appropriate safety\nmeasures\n1.3. Safekeep/maintain/\ndispose tools, materials\nand outfit.\n• Self-paced/\nmodular\n• Lecture/\nDiscussion\n• Interaction\n• Practical\nDemonstration\n• Visit/tour\n• Oral/Written\nInterviews\n• Direct\nObservation\n• Practical\nDemonstration\n2. Use farm tools\nand equipment\n2.1. Select and use farm\ntools\n2.2. Select and operate farm\nequipment\n2.3. Perform preventive\nmaintenance\nprocedures/practices\n\n• Self-paced/\nmodular\n• Lecture/Discu\nssion\n• Interaction\n• Practical\nDemonstration\n• Visit/tour\n• Oral/Written\nInterviews\n• Direct\nObservation\n• Practical\nDemonstration\n3. Perform\nestimation\nand\nbasic calculation\n\n3.1. Perform estimation\n3.2. Perform basic\nworkplace calculation\n3.3. Apply corrective\nmeasures as necessary\n\n• Self-paced/\nmodular\n• Lecture/\nDiscussion\n• Interaction\n• Practical\nExercise\n• Oral/Written\nexamination\n• Practical\nexercise\n\n--- PDF PAGE 39 ---\nTR – RUBBER PROCESSING NC II\n\n37\nCORE COMPETENCIES\n(130 hrs)\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Receive latex\nand lumps\n\n1.1. Receive latex\n1.2. Receive lumps\n• Discussion\n• Lecture\n• Demonstration\n• Simulation\n\n• Demonstration and\nquestioning\n• Direct observation\nwith questioning\n• Written examination\n\n2. Produce\nblanketed\nrubber sheet\n\n2.1. Prepare for\nmachine operation\n2.2. Perform milling\noperation\n• Discussion\n• Lecture\n• Demonstration\n• Simulation\n• Hands on\n\n• Demonstration and\nquestioning of\nrelated underpinning\nknowledge\n• Written Examination\n• Practical\nPerformance\n\n3. Perform\nrubber drying\noperation\n\n3.1. Dry rubber\n3.2. Pack rubber\n• Discussion\n• Lecture\n• Demonstration\n• Simulation\n• Hands on\n\n• Demonstration and\nquestioning of\nrelated underpinning\nknowledge\n• Written examination\n• Practical\nperformance\n\n--- PDF PAGE 40 ---\nTR – RUBBER PROCESSING NC II\n\n38\n3.2\nTRAINING DELIVERY\n\nThe delivery of training should adhere to the design of the curriculum. Delivery\nshould be guided by the 10 basic principles of competency-based TVET.\n\n•\nThe training is based on curriculum developed from the competency\nstandards;\n•\nLearning is modular in its structure;\n•\nTraining delivery is individualized and self-paced;\n•\nTraining is based on work that must be performed;\n•\nTraining materials are directly related to the competency standards and the\ncurriculum modules;\n•\nAssessment is based in the collection of evidence of the performance of\nwork to the industry required standard;\n•\nTraining is based both on and off-the-job components;\n•\nAllows for recognition of prior learning (RPL) or current competencies;\n•\nTraining allows for multiple entry and exit; and\n•\nApproved training programs are nationally accredited.\n\nThe competency-based TVET system recognizes various types of delivery\nmodes, both on and off-the-job as long as the learning is driven by the competency\nstandards specified by the industry. The following training modalities may be adopted\nwhen designing training programs:\n\n•\nThe dualized mode of training delivery is preferred and recommended. Thus\nprograms would contain both in-school and in-industry training or fieldwork\ncomponents. Details can be referred to the Dual Training System (DTS)\nImplementing Rules and Regulations.\n•\nModular/self-paced learning is a competency-based training modality\nwherein the trainee is allowed to progress at his own pace. The trainer\nfacilitates the training delivery\n•\nPeer teaching/mentoring is a training modality wherein fast learners are\ngiven the opportunity to assist the slow learners.\n•\nSupervised industry training or on-the-job training is an approach in training\ndesigned to enhance the knowledge and skills of the trainee through actual\nexperience in the workplace to acquire specific competencies prescribed in\nthe training regulations.\n•\nDistance learning is a formal education process in which majority of the\ninstruction occurs when the students and instructor are not in the same\nplace. Distance learning may employ correspondence study, or audio, video\nor computer technologies.\n•\nProject-Based Instruction is an authentic instructional model or strategy in\nwhich students plan, implement and evaluate projects that have real world\napplications.\n\n--- PDF PAGE 41 ---\nTR – RUBBER PROCESSING NC II\n\n39\n3.1 TRAINEE ENTRY REQUIREMENTS\n\nTrainees or students wishing to enroll in this course should possess the following\nrequirements.\n\n•\nAble to read and write\n•\nWith good moral character;\n•\nAbility to communicate, both oral and written\n•\nPhysically fit and mentally healthy as certified by a Public Health Officer\n•\nAge 18 and above\n\n3.4 LIST OF TOOLS, EQUIPMENT AND MATERIALS\n\nRUBBER PROCESSING – NC II\n\nRecommended list of tools, equipment and materials for the training of 25 trainees\nfor Rubber Processing NC II\n\nQTY\nTools:\nQTY\nEquipment\n5\nAdjustable wrench\n2\nWeighing scale\n2\nPipe wrench (24in)\n2\nCalculator\n2\nVise grip\n1\nSlab cutter machine\n10\nLong nose pliers\n1\nPre-breaker machine\n10\nFlat nose Pliers\n1\nDrying machine\n1 set\nScrew driver (Flat)\n1\nPressing machine\n1 set\nScrew driver (Philip)\n1\nShredder\n1\nGrease applicator/ Grease gun\n5\nRoller machine\n10\nPull-push (steel-tape) rule\n1\nPortable electric drill\n10\nSteel hook\n1\nPortable electric disc grinder\n2\nOiler/Oiler can\n1\nCoagulating tank (1 ton)\n4\nLatex container/drum\n25 sets\nPPE,s\n• rubber boots\n• safety goggles/glass\n• mask or respirator or face\nshield\n• gloves\n• laboratory coat\n•\ncover all\n1\nShovel\n1\nCutter\n1\nWheel barrow\nQTY\nTraining Materials\n2\nBolo\n5 copies\nBrochures\n2\nSharpening stone\n2 copies\nVisual aids\n5\nSteel brush\n5 copies\nReference manuals\n\n--- PDF PAGE 42 ---\nTR – RUBBER PROCESSING NC II\n\n40\n5\nGrinding disc\n5 copies\nProcedural manuals\n5\nCut-off grinding disc\n2 copies\n Instructional supplies and\nmaterials (DVD, VCD, PPT,\nPrints, etc.)\n\nLatext water content measuring\ndevice(i.e. Metrolax)\n2 copies\nReference materials/books\nQTY\nMaterials\n100 kl\nLumps and cup lumps\n1 gal\nFormic acid\n1 bundle\nPlastic bags\n1 bag\nSodium metabisulfite\n1 gal\nOil\n1 gal\nMulti-purpose grease\n1 gal\nHydraulic oil\n1 gal\nGear oil\n1 gal\nCoagulants\n1 gal\nLubricants\nLabel\n1 pc\nRecord book\n5 k\nRags\n1 lot\nCleaning materials\n1 lot\nSand paper (assorted)\n10\nFastening tape (teflon)\n\nBased on the above list of materials, the following are the exposure controls and the\nPPE to be used*:\n\nSodium Metabulsulfite\n\nEngineering controls (Training facilties)-use process enclosures and local exhaust\nventilation\nPersonal Protection (PPE)- safety glasses, laboratory coat, gloves and approved-type\ndust respirators (preferably N95 mask).\n\nFormic Acid\n\nEngineering Controls- used local exhaust and/or general exhaust ventilation system.\nPersonal Protection-chemical safety, goggles, rubber or neoprene gloves, impervious\nboots, apron or coveralls, full face shield and supplied air full face respirator (if\nengineering controls are not are feasible)\n\n--- PDF PAGE 43 ---\nTR – RUBBER PROCESSING NC II\n\n41\nEmergency Equipment – maintain emergency eye wash fountain or emergency, shower\nnear work area where acid is used.\n\nLumps\n\nEngineering Controls – used local exhaust or general exhaust ventilation to control\nprocess emission/dispersion.\nPersonal Protection –appropriate rubber gloves, safety glass, apron, cover all and\napproved-type respirator (preferably N95 mask)\n\nAll Purpose Grease\n\nEngineering Controls- provide sufficient mechanical (general or local exhaust)\nventilation\nPersonal Protection – chemical resistant gloves, chemical splash goggles and rubber\ngloves (for repeated/prolonged skin contact)\nRespiratory Protection – usually not required.\n\nHydraulic Oil/Gear Oil\n\nEngineering Controls – use in a well-ventilated area.\nEye/Face Protection- no special eye protection is normally required. Where splashing is\npossible, wear safety glasses with side shield.\nSkin Protection – no special protective clothing is normally required. Where splashing is\npossible, select protective clothing depending on operations (suggested protective\ngloves- nitrile, rubber, Viton, Silver shield/4H/PVA)\nRespiratory Protection – no respiratory protection is normally required. If operations\ngenerate oil mists, wear approved-type air purifying respirator (cartridge-type particulate\nrespirator)\n\nAll other dust-generating process\n\nEngineering Controls- use local exhaust ventilation of contaminant dispersion is\nconstant and the generation is high, otherwise provide general exhaust ventilation in\nthe process area.\nPersonal Protection –efficient and approved-type respirators (usually N95 mask)\n\n* as recommended by the OSHC, DOLE\n\n3.5 TRAINING FACILITIES\n\nRUBBER PROCESSING NC II\n\nBased on a class size of 25 students/trainees\n\nSPACE REQUIREMENT\nSIZE IN\nMETERS\nTOTAL AREA IN SQ.\nMETERS\nA. Building (permanent)**\n144.30\n•\nLecture Room/Workshop\n\n80.00\n•\nLearning Resource Center\n3.00 x 5.00\n15.00\n• Facilities/Equipment/\nCirculation Area (30% of\nteaching accommodation)\n\n33.3\n\n--- PDF PAGE 44 ---\nTR – RUBBER PROCESSING NC II\n\n42\n•\nStore Room\n4.00 x 4.00\n16.00\nB. Experimental Processing\nPlant/ Access to\nExperimental Processing\nPlant **\n\n100.00\n\n**Note the relevant above-listed recommendations of the OSHC, DOLE with regard to engineering\ncontrols, personal protection and emergency equipment.\n\n3.6 TRAINER’S QUALIFICATIONS FOR AGRI-FISHERY SECTOR\n\nTrainers who will deliver the training on RUBBER PROCESSING NC II should be\nholders of National TVET Trainer Certificate Level I (NTTC I). The following are the\nrequirements for NTTC I:\n\n• Must be a holder of Rubber Processing NC II or its equivalent\n• Must be a holder of Trainers Methodology Certificate Level I (TMC I)\n• Must be physically and mentally fit\n• *Must have at least 2 years job/industry experience\n\n*\nOptional. Only when required by the hiring institution.\n\nReference: TESDA Board Resolution No. 2010-05\n\nTESDA Circular No. 135, 2011\n\n3.7\nINSTITUTIONAL ASSESSMENT\n\nInstitutional Assessment is undertaken by trainees to determine their\nachievement of units of competency. A certificate of achievement is issued for\neach unit of competency.\n\n--- PDF PAGE 45 ---\nTR – RUBBER PROCESSING NC II\n\n43"
