  "source_section_text": "Section 1. Successful\ncandidates shall be awarded a National Certificate signed by the TESDA\nDirector General.\n4.2\nThe qualification of Rubber Processing NC II may be attained through:\n4.2.1\nAccumulation of Certificates of Competency (COCs) in the following\nareas:\n4.2.1.1\nReceive latex and lump\n4.2.1.2\nProduce dried rubber\n• Produce blanketed rubber sheet\n• Perform rubber drying operation\n\nSuccessful candidates shall be awarded Certificates of Competency (COCs)\nbearing the signature of the Regional Director and Chair of the recognized local\nindustry body.\n\n4.2.2\nDemonstration of competence through project-type assessment covering\nall required units of qualification\n\n4.3\nAssessment shall focus on the core units of competency. The tool and common\nunits shall be integrated or assessed concurrently with the core units.\n\n4.4\nCandidates can be assessed on individual units of competency and be issued\nCertificates of Competency if found competent. Certificates of Competency shall\nbear the signature of the Regional Director and Chair of the recognized local\nindustry body.\n\n4.5\nThe following are qualified to apply for assessment and certification:\n4.5.1\nGraduates of formal, non – formal and informal including enterprise –\nbased training programs\n4.5.2\nExperienced workers (wage employed or self – employed)\n\n4.6\nThe guidelines on assessment and certification are discussed in detail in the\nProcedures Manual on Assessment and Certification and Guidelines on the\nImplementation of the Philippine TVET Qualification and Certification System\n(PTQCS).\n\n--- PDF PAGE 46 ---\nTR – RUBBER PROCESSING NC II\n\n44\n\nSupermarket of Competencies\nAGRI-FISHERY Sector\n\nReceive latex\nand lumps\nProduce\nblanketed rubber\nsheet\nPerform rubber\ndrying operation\nCORE\nCOMPETENCIES\n\nCOMMON\nCOMPETENCIES\nApply Safely\nMeasures in\nfarm\noperations\nUse Farm Tools\nand Equipment\nPerform\nEstimation and\nBasic Calculation\nWork in team\nenvironment\nParticipate in\nworkplace\ncommunication\nBASIC\nCOMPETENCIES\nPractice career\nprofessionalism\n\nPractice occupational\nhealth and safety\nprocedures\n\n--- PDF PAGE 47 ---\nTR – RUBBER PROCESSING NC II\n\n45\nDEFINITION OF TERMS\n\nFor the purpose of this standard, the word\n\n•\nBlanketing (rubber)- process of flattening the rubber slabs through miller\nmachine.\n\n•\nDrying is a mass transfer process consisting of the removal of water or\nanother solvent by evaporation from a solid, semi-solid or liquid. This\nprocess is often used as a final production step before selling or packaging\nproducts.\n\n•\nLatex- as found in nature is a milky fluid found in 10% of all flowering plants\n(angiosperms). It is a complex emulsion consisting of proteins, alkaloids,\nstarches, sugars, oils, tannins, resins, and gums that coagulates on\nexposure to air. It is usually exuded after tissue injury. In most plants, latex\nis white, but some have yellow, orange, or scarlet latex.\n•\nMilling- process of breaking a solid material into smaller pieces\n\n•\nStandard – the set of criteria and specifications of quality determining the\ngrades, described as product characteristics such as maturity, color,\ncleanliness, shape, free from decay and blemishes and uniformity of size.\n\n•\nShredding- cutting off into smaller pieces\n\n--- PDF PAGE 48 ---\nTR – RUBBER PROCESSING NC II\n\n46\nACKNOWLEDGEMENTS\n\nThe Technical Education and Skills Development Authority (TESDA) wishes to extend\ngratitude and appreciation to the many representatives of business, industry, academe and\ngovernment agencies who donated their time and expertise to the development and validation\nof these Training Regulations.\n\nTHE TECHNICAL EXPERT PANEL (TEP)\n\nDANIEL E. REVANTAD\nManager\nPhilippine Pioneer Rubber Product\nCorporation\nLa Paz, Naga, Zamboanga Sibugay\n\nNALLY S. BANGOY\nAgriculturist II\nOffice of the Provincial Agriculturist\nKidapawan City, North Cotabato\nEDUARDO B. PEREZ\nProcessing Maintenance\nUnited Worker Agrarian Reform Beneficiaries\nMulti Purpose Coop (UWARBMPC)\nMenzi, Isabela City, Basilan Province\n\nROGELIO F. ALEJANDRO\nForeman - Processing\nUnited Worker Agrarian Reform Beneficiaries\nMulti Purpose Coop (UWARBMPC)\nMenzi, Isabela City, Basilan Province\n\nREYNALDO V. NITURA\nExecutive Assistant\nTESDA- XII\nKoronadal City, North Cotabato\n\nMARIANO N. NABLE\nGoodyear Agrarian Reform Beneficiaries Multi\nPurpose Cooperative (GARBEMCO)\nGoodyear, Kabasalan,\nZamboanga, Sibugay\n\nEDGARDO V. TIMO\nGeneral Manager - Second Liner\nGoodyear Agrarian Reform Beneficiaries Multi\nPurpose Cooperative (GARBEMCO)\nGoodyear, Kabasalan,\nZamboanga, Sibugay\n\nSIMPLICIO L. PANTALIANO\nVice Chairman\nGoodyear Agrarian Reform Beneficiaries Multi\nPurpose Cooperative (GARBEMCO)\nGoodyear, Kabasalan\nZamboanga, Sibugay\nESTRELLA R. MELITANTE\nDepartment Head\nAgriculture Western Mindanao State\nUniversity\nSiay, Zamboanga, Sibugay\n\nJONATHAN B. VESAGAS\nResearch Assistant\nMedina College Don Andres\nIpil, Zamboanga, Sibugay\n\nDEBORAH M. BALINGCOS\nDirector Research and Extension\nMedina College Don Andres,\nIpil, Zamboanga, Sibugay\n\nZOSIMO A. AREVALO\nCommunity Development Officer II\nOffice of the Provincial Agrculturist\nCapitol Complex, Ipil Heights, Ipil,\nZamboanga, Sibugay\n\nRENATO L. MANGINSAY\nOIC Provincial Agriculturist\nProvincial Government Office\nProvincial Capitol, Ipil Heights\nIpil Zamboanga, Sibugay\n\nJASSIM N. ABDURASAD\nTrade and Industry Specialist\nDepartment of Trade and Industry\nIpil, Zamboanga, Sibugay\n\nCRISPULO S. LAMATAN JR.\nProvincial Cooperative Officer/Chairman of\nTWG-GRAJTREE Provincial\nLocal Government Unit\n Ipil, Zamboanga, Sibugay\n\nDIOMEDES ARNOCO\nAcademic Head\nJH Cerilles Canuto MS Enerio College of Arts\n& Trades Biswagan, Lakewood\nZamboanga, Sibugay\n\n--- PDF PAGE 49 ---\nTR – RUBBER PROCESSING NC II\n\n47\n\nHERNANI D. PRECIADO\nSupervisor\nTire King Rubber Production, Inc