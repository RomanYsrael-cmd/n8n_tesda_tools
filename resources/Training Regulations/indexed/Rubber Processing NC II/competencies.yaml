        "source_text": "AGR612207\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge and skills required to\ndry and pack rubber.\n\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Dry rubber\n1.1\nBlanketed sheets are shred and cut according to the\ncompany standard\n1.2\nShredded rubber (granulated rubber) is dried in\naccordance with the temperature requirements of raw\nmaterials\n\n2. Pack rubber\n2.1\nCrumbed rubber is weighted in accordance with\nenterprise procedures.\n2.2\nPressing machine operated in accordance with\nenterprise procedures\n2.3\nWrapping and labeling of bales is performed in\naccordance with enterprise standard.\n2.4\nProduction report is prepared in accordance with\nenterprise policy\n\n--- PDF PAGE 34 ---\nTR – RUBBER PROCESSING NC II\n\n32\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Temperature\nrequirements of raw\nmaterials\n\nMay vary according to:\n1.1\nType of raw material\n1.2\nQuality of raw materials\n1.3\nAge of raw materials\n1.4\nISO standard\n\n--- PDF PAGE 35 ---\nTR – RUBBER PROCESSING NC II\n\n33\n\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency:\nAssessment requires evidence that the candidate:\n1.1 Performed drying operation of rubber\n1.2 Packed rubber\n2. Required Knowledge\nand Attitudes\n\n2.1 Knowledge, Theory, Practices and Systems Operations\n2.1.1\nShredding and cutting techniques for blanketed\nsheets\n2.1.2\nISO standards for drying shredded rubber\n2.1.3\nPressing techniques crumb rubber\n2.1.4\nPacking techniques for rubber\n2.1.5\nPractice of 3Rs and 5S\n2.1.6\nProgram of work activities are implemented as\nscheduled\n2.2 Communication\n2.2.1\nPrepare and submit required reports on all\nactivities\n2.3 Mathematics and Mensuration\n2.3.1\nBasic mathematical operations\n2.4 Safety Practices\n2.4.1\nProper application of chemicals such as\ncoagulants\n2.4.2\nProper use of tools, implements and equipment.\n2.4.3\nWear appropriate personal protective equipment\n(PPE)\n2.5 Codes and Regulations\n2.5.1\nComply with DA, DENR, FPA Laws, Rules and\nRegulations\n2.6 Materials, Tools & Equipment: Uses, Specifications and\nMaintenance\n2.6.1\nTools and Equipment\n2.6.1.1 Can understand and follow instructional\nmanuals\n2.6.1.2 Safe keeping of equipments every after\nuse\n2.6.2\nMaterials\n2.6.2.1 Where to source good quality supplies,\nmaterials and equipment needed in the\noperation of the farm\n2.6.3\nMaintenance\n2.6.3.1 Regular upkeep of equipments and\nfacilities\n2.6.3.2 Preventive maintenance skills\n2.7 Values\n2.7.1\nHonest\n2.7.2\nCommitted\n2.7.3\nSelf-disciplined\n2.7.4\nPositive attitudes towards tasks assignment\n2.7.5\nWork well with others\n2.7.6\nIndustries (hardworking)\n\n--- PDF PAGE 36 ---\nTR – RUBBER PROCESSING NC II\n\n34\n\n3. Required Skills\n3.1\nOperating the machine\n3.2\nHandling weighing scale and recording\n3.3\nHandling pressing machines\n3.4\nPacking and labeling\n4. Method of\nAssessment\nCompetency in this unit must be assessed through:\n4.1\nDemonstration with questions\n4.2\nInterview\n4.3\nDirect Observation\n5. Resource Implications\n5.1\nAll supplies, materials and farm implements needed\nduring drying operations should be readily available at\nthe site\n5.1.1 Shredder\n5.1.2 Cutter\n5.1.3 Weighing scale\n5.1.4 PPE\n5.1.5 Plastic wrapper\n5.1.6 Label\n5.2\nAll workers involved in different activities must be fully\noriented and cautioned on the different specific work\nactivities of the farm\n5.3\nTechnical supervisors should have skills and ability in\nthe successful implementation of work program\nactivities.\n6. Context of\nAssessment\n6.1\nAssessment may occur in an appropriately simulated\nenvironment through TESDA accredited assessment\ncenters.\n\n--- PDF PAGE 37 ---\nTR – RUBBER PROCESSING NC II\n\n35"
