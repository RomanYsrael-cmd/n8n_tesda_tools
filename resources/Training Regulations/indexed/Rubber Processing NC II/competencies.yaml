        "source_text": "AGR612205\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge and skills required to\nreceive latex and receive lumps.\n\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Receive Latex\n\n1.1\nLatex volume is determined and recorded according to\nindustry procedure.\n1.2\nLatex quality is tested and recorded in accordance\nwith company specifications.\n1.3\nRequired water-latex ratio is determined in accordance\nwith dilution standard\n1.4\nCoagulating operation is performed in accordance with\nenterprise procedure.\n\n2. Receive lumps\n2.1\nLumps are weighed in accordance to enterprise\nprocedures.\n2.2\nRecords are maintained in accordance with enterprises\nprocedures.\n\n--- PDF PAGE 26 ---\nTR – RUBBER PROCESSING NC II\n\n24\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Latex quality\nThis include the following but is not limited to:\n1.1\nPTR 5\n1.2\nPTR 20\n2. Dilution standard\n\nThis may include:\n2.1\nRibbed Smoke Sheet(RSS)\n2.2\nPale Crepe Rubber(PCR)\n2.3\nCrumb Rubber\n\n--- PDF PAGE 27 ---\nTR – RUBBER PROCESSING NC II\n\n25\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency:\nAssessment requires evidence that the candidate:\n1.1\nReceived latex\n1.2\nReceived lumps/cuplumps\n2. Required Knowledge\nand Attitudes\n2.1\nKnowledge, Theory, Practices and Systems Operations\n2.1.1 Characteristics of good and poor quality latex\n2.1.2 Application of coagulants\n2.1.3 Identification of water contents and contaminants\n2.1.4 Handling latex and lumps techniques and safety\nprocedures\n2.1.5 Personal hygiene practices\n2.1.6 Company standards, policies and procedures\n2.1.7 Practice of 3Rs and 5S\n2.1.8 Program of work activities are implemented as\nscheduled\n2.2\nCommunication\n2.2.1 Prepare and submit required reports\n2.2.2 Maintaining accurate records\n2.3\nMathematics and Mensuration\n2.3.1 Basic mathematical operations\n2.3.2 Production recording\n2.3.3 Percentages and rations\n2.4\nSafety Practices\n2.4.1 Proper application of chemicals such as\ncoagulants\n2.4.2 Proper use of tools, implements and equipment.\n2.4.3 Wear appropriate PPE\n• rubber gloves\n• safety glass\n• apron\n• cover all\n• approved-type respirator\n2.4.4 Safety procedures in handling and storage of\nchemicals\n2.4.5 Disposal of chemicals and containers\n2.5\nCodes and Regulations\n2.5.1 Comply with DA, DENR, FPA Laws, Rules and\nRegulations\n2.6\nMaterials, Tools & Equipment: Uses, Specifications and\nMaintenance\n2.6.1 Tools and Equipment\n2.6.1.1 Can understand and follow instructional\nmanuals\n2.6.1.2 Safe keeping of equipments every after\nuse\n2.6.2 Materials\n2.6.2.1 Where to source good quality supplies,\nmaterials and equipment needed in the\noperation of the farm\n2.6.3 Maintenance\n\n--- PDF PAGE 28 ---\nTR – RUBBER PROCESSING NC II\n\n26\n2.6.3.1 Regular upkeep of equipments and\nfacilities\n2.6.3.2 Preventive maintenance skills\n\n2.7\nValues\n2.7.1 Honesty\n2.7.2 Work ethics/values\n2.7.3 Work harmoniously with others\n2.7.4 Positive attitudes towards tasks assignment’\n2.7.5 Safety consciousness\n2.7.6 Cost consciousness\n3. Required Skills\n3.1\nReceiving latex and lumps/cup-lumps\n3.2\nMonitoring and recording data and writing reports\n3.3\nManaging and controlling spillage\n3.4\nBasic mathematical computation skills\n3.5\nUsing appropriate testing/measuring instruments\n4. Method of\nAssessment\nCompetency in this unit must be assessed through:\n4.1\nDemonstration with questioning\n4.2\nDirect observation\n4.3\nWritten\n4.4\nPortfolio\n5. Resource Implications\n5.1\nAll supplies, materials and equipment needed during\nthe operations should be readily available at site. These\ninclude:\n5.1.1 Latex and lumps/cuplumps\n5.1.2 Record books and calculator\n5.1.3 Weighing scales\n5.1.4 Coagulants\n5.1.5 Latext water content measuring device(i.e.\nMetrolax)\n5.1.6 PPE (Rubber boots, safety goggles/glass, mask-\npreferably N95, rubber glove-industrial type and\ncover all)\n5.1.7 Latex and lumps containers\n5.2\nAll workers involved in different activities must be fully\noriented and cautioned on the different specific work\nactivities of the farm\n5.3\nTechnical supervisors should have skills and ability in\nthe successful implementation of work program\nactivities\n\n6. Context of Assessment\n6.1\nAssessment may occur in an appropriately simulated\nenvironment through TESDA accredited assessment\ncenters\n\n--- PDF PAGE 29 ---\nTR – RUBBER PROCESSING NC II\n\n27\nUNIT OF COMPETENCY\n:\nPRODUCE BLANKETED RUBBER SHEETS\n\nUNIT CODE\n:"
