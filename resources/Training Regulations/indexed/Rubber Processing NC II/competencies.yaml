        "source_text": "--- PDF PAGE 16 ---\nTR – RUBBER PROCESSING NC II \n \n14 \nCOMMON COMPETENCIES \n \nUNIT TITLE \n: \nAPPLY SAFETY MEASURES IN FARM OPERATIONS \n \nUNIT CODE \n: \nAGR321201 \n \nUNIT DESCRIPTOR : \nThis unit covers the knowledge, skills and attitudes required \nto perform safety measures effectively and efficiently. It \nincludes identifying areas, tools, materials, time and place in \nperforming safety measures. \n \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables\n1. Determine areas of \nconcern for safety \nmeasures  \n1.1 \nWork tasks are identified in line with farm \noperations \n1.2 \nPlace for safety measures are determined in line \nwith farm operations \n1.3 \nTime for safety measures are determined in line \nwith farm operations \n1.4 \nAppropriate tools, materials and outfits are \nprepared in line with job requirements \n \n2. Apply appropriate safety \nmeasures \n2.1 Tools and materials are used according to \nspecifications and procedures \n2.2 Outfits are worn according to farm requirements \n2.3 Effectivity/shelf life/expiration of materials are \nstrictly observed \n2.4 Emergency procedures are known and followed \nto ensure a safework requirement \n2.5 Hazards in the workplace are identified and \nreported in line with farm guidelines \n \n3. Safekeep/dispose tools, \nmaterials and outfit \n3.1 Used tools and outfit are cleaned after use and \nstored in designated areas \n3.2 Unused materials are properly labeled and stored \naccording to manufacturers recommendation and \nfarm requirements \n3.3 Waste materials are disposed according to \nmanufacturers, government and farm \nrequirements\n\n--- PDF PAGE 17 ---\nTR – RUBBER PROCESSING NC II \n \n15 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Work tasks \nMay be selected from any of the following sectors: \n1.1 \nAquaculture \n1.2 \nAnimal Production \n1.3 \nCrop Production \n1.4 \nPost-harvest \n1.5 \nAgri-marketing \n1.6\nFarm Equipment\n2. Place \n2.1 \nAnimal pens, cages, barns \n2.2 \nFish ponds, cages \n2.3 \nStock room/storage areas/warehouse \n2.4\nField/farm/orchard\n3. Time \n3.1 \nVaccination and medication period \n3.2 \nFertilizer and pesticides application \n3.3 \nFeed mixing and feeding \n3.4 \nHarvesting and hauling \n3.5 \nCleaning, sanitizing and disinfecting \n3.6\nDressing, butchering and castration\n4. Tools, materials and \noutfits \n4.1 \nTools \n4.1.1 Wrenches \n4.1.2 Screw driver \n4.1.3 Pliers \n4.2 \nMaterials \n4.2.1 Bottles \n4.2.2 Plastic \n4.2.3 Bags \n4.2.4 Syringe \n4.3 \nOutfit \n4.3.1 Masks \n4.3.2 Gloves \n4.3.3 Boots \n4.3.4 Overall coats \n4.3.5 Hat \n4.3.6 Eye goggles\n5. Emergency procedures \n5.1 \nLocation of first aid kit \n5.2 \nEvacuation \n5.3 \nAgencies contract \n5.4\nFarm emergency procedures\n6. Waste materials \n6.1 \nAnimal manure \n6.2 \nWaste water \n6.3 \nSyringes \n6.4 \nUnused farm chemicals e.g. pesticides,  \nchemicals, fertilizers \n6.5 \nExpired reagents \n6.6\nDead animals\n7. Hazards \n7.1 \nChemical \n7.2 \nElectrical \n7.3\nFalls\n\n--- PDF PAGE 18 ---\nTR – RUBBER PROCESSING NC II \n \n16 \nEVIDENCE GUIDE \n \n1. Critical Aspects of  \nCompetency \nAssessment requires evidence that the candidate: \n1.1 \nDetermined areas of concern for safety measures \n1.2 \nApplied appropriate safety measures according to \nindustry requirements \n1.3 \nPrepared tools, materials and outfit needed \n1.4 \nPerformed proper disposal of used materials \n1.5 \nSafekeep/cleaned tools, materials and outfit in \ndesignated facilities  \n2. Required \nKnowledge and \nAttitudes \n \n2.1 \nSafety Practices  \n2.1.1 Implementation of regulatory controls and policies \nrelative to treatment of area and application of \nchemicals \n2.1.2 Proper disposal of waste materials \n2.2 \nCodes and Regulations \n2.2.1 Compliance to health program of DOH and DENR \n2.2.2 Hazard identification \n2.2.3 Emergency procedures \n2.3 \nTools & Equipment: Uses and Specification \n2.3.1 Masks, gloves, boots, overall coats for health \nprotection \n2.4 \nMaintenance \n2.4.1 Regular check-up and repair of tools, materials \nand outfit before and after use \n3. Required Skills \n3.1 \nAbility to recognize effective tools, materials and outfit \n3.2 \nReady skills required to read labels, manuals and other \nbasic safety information \n \n4. Method of \nAssessment \n \nCompetency in this unit must be assessed through: \n4.1 \nPractical demonstration  \n4.2 \nThird Party Report \n5. Resource \nImplications \n5.1 \nFarm location \n5.2 \nTools, equipment and outfits appropriate in applying \nsafety measures \n \n6. Context of \nAssessment \nAssessment may occur in the workplace or in a simulated \nworkplace or as part of a team under limited supervision\n",
