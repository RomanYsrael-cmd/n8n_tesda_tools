  "source_section_text": "SECTION 2 COMPETENCY STANDARDS\n\nBASIC COMPETENCIES\n\nUNIT OF COMPETENCY :\nPARTICIPATE IN WORKPLACE COMMUNICATION\nUNIT CODE\n:\n500311105\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes\nrequired to gather, interpret and convey information in\nresponse to workplace requirements.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Obtain and convey\nworkplace\ninformation\n1.1 Specific and relevant information is accessed from\nappropriate sources\n1.2 Effective questioning , active listening and speaking\nskills are used to gather and convey information\n1.3 Appropriate medium is used to transfer information\nand ideas\n1.4 Appropriate non- verbal communication is used\n1.5 Appropriate lines of communication with supervisors\nand colleagues are identified and followed\n1.6 Defined workplace procedures for the location and\nstorage of information are used\n1.7 Personal interaction is carried out clearly and\nconcisely\n2. Participate in\nworkplace meetings\nand discussions\n2.1 Team meetings are attended on time\n2.2 Own opinions are clearly expressed and those of\nothers are listened to without interruption\n2.3 Meeting inputs are consistent with the meeting\npurpose and established protocols\n2.4 Workplace interactions are conducted in a courteous\nmanner\n2.5 Questions about simple routine workplace procedures\nand maters concerning working conditions of\nemployment are asked and responded to\n2.6 Meetings outcomes are interpreted and implemented\n3. Complete relevant\nwork related\ndocuments\n3.1 Range of forms relating to conditions of employment\nare completed accurately and legibly\n3.2 Workplace data is recorded on standard workplace\nforms and documents\n3.3 Basic mathematical processes are used for routine\ncalculations\n3.4 Errors in recording information on forms/ documents\nare identified and properly acted upon\n3.5 Reporting requirements to supervisor are completed\naccording to organizational guidelines\n\n--- PDF PAGE 5 ---\nTR – RUBBER PROCESSING NC II\n\n3\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Appropriate sources\n1.1\nTeam members\n1.2\nSuppliers\n1.3\nTrade personnel\n1.4\nLocal government\n1.5\nIndustry bodies\n\n2. Medium\n2.1\nMemorandum\n2.2\nCircular\n2.3\nNotice\n2.4\nInformation discussion\n2.5\nFollow-up or verbal instructions\n2.6\nFace to face communication\n\n3. Storage\n3.1\nManual filing system\n3.2\nComputer-based filing system\n\n4. Forms\n4.1\nPersonnel forms, telephone message forms,\nsafety reports\n\n5. Workplace interactions\n5.1\nFace to face\n5.2\nTelephone\n5.3\nElectronic and two way radio\n5.4\nWritten including electronic, memos, instruction\nand forms, non-verbal including gestures,\nsignals, signs and diagrams\n\n6. Protocols\n6.1\nObserving meeting\n6.2\nCompliance with meeting decisions\n6.3\nObeying meeting instructions\n\n--- PDF PAGE 6 ---\nTR – RUBBER PROCESSING NC II\n\n4\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nPrepared written communication following standard\nformat of the organization\n1.2\nAccessed information using communication\nequipment\n1.3\nMade use of relevant terms as an aid to transfer\ninformation effectively\n1.4\nConveyed information effectively adopting the formal\nor informal communication\n2. Required Knowledge\nand Attitudes\n2.1\nEffective communication\n2.2\nDifferent modes of communication\n2.3\nWritten communication\n2.4\nOrganizational policies\n2.5\nCommunication procedures and systems\n2.6\nTechnology relevant to the enterprise and the\nindividual’s work responsibilities\n3. Required Skills\n3.1\nFollow simple spoken language\n3.2\nPerform routine workplace duties following simple\nwritten notices\n3.3\nParticipate in workplace meetings and discussions\n3.4\nComplete work related documents\n3.5\nEstimate, calculate and record routine workplace\nmeasures\n3.6\nBasic mathematical processes of addition,\nsubtraction, division and multiplication\n3.7\nAbility to relate to people of social range in the\nworkplace\n3.8\nGather and provide information in response to\nworkplace Requirements\n4. Resource\nImplications\n4.1\nFax machine\n4.2\nTelephone\n4.3\nWriting materials\n4.4\nInternet\n5. Methods of\nAssessment\n5.1\nDirect Observation\n5.2\nOral interview and written test\n6. Context of\nAssessment\n6.1\nCompetency may be assessed individually in the\nactual workplace or through accredited institution\n\n--- PDF PAGE 7 ---\nTR – RUBBER PROCESSING NC II\n\n5\nUNIT OF COMPETENCY :\nWORK IN TEAM ENVIRONMENT\nUNIT CODE\n:\n500311106\nUNIT DESCRIPTOR\n:\nThis unit covers the skills, knowledge and attitudes to\nidentify role and responsibility as a member of a team.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Describe team role\nand scope\n1.1\nThe role and objective of the team is identified from\navailable sources of information\n1.2\nTeam parameters, reporting relationships and\nresponsibilities are identified from team discussions\nand appropriate external sources\n2. Identify own role and\nresponsibility within\nteam\n2.1\nIndividual role and responsibilities within the team\nenvironment are identified\n2.2\nRoles and responsibility of other team members are\nidentified and recognized\n2.3\nReporting relationships within team and external to\nteam are identified\n3. Work as a team\nmember\n3.1\nEffective and appropriate forms of communications\nused and interactions undertaken with team members\nwho contribute to known team activities and\nobjectives\n3.2\nEffective and appropriate contributions made to\ncomplement team activities and objectives, based on\nindividual skills and competencies and workplace\ncontext\n3.3\nObserved protocols in reporting using standard\noperating procedures\n3.4\nContribute to the development of team work plans\nbased on an understanding of team’s role and\nobjectives and individual competencies of the\nmembers.\n\n--- PDF PAGE 8 ---\nTR – RUBBER PROCESSING NC II\n\n6\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Role and objective\nof team\n1.1\nWork activities in a team environment with enterprise\nor specific sector\n1.2\nLimited discretion, initiative and judgement maybe\ndemonstrated on the job, either individually or in a\nteam environment\n\n2. Sources of\ninformation\n2.1\nStandard operating and/or other workplace\nprocedures\n2.2\nJob procedures\n2.3\nMachine/equipment manufacturer’s specifications\nand instructions\n2.4\nOrganizational or external personnel\n2.5\nClient/supplier instructions\n2.6\nQuality standards\n2.7\nOHS and environmental standards\n\n3. Workplace context\n3.1\nWork procedures and practices\n3.2\nConditions of work environments\n3.3\nLegislation and industrial agreements\n3.4\nStandard work practice including the storage, safe\nhandling and disposal of chemicals\n3.5\nSafety, environmental, housekeeping and quality\nguidelines\n\n--- PDF PAGE 9 ---\nTR – RUBBER PROCESSING NC II\n\n7\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nOperated in a team to complete workplace activity\n1.2\nWorked effectively with others\n1.3\nConveyed information in written or oral form\n1.4\nSelected and used appropriate workplace language\n1.5\nFollowed designated work plan for the job\n1.6\nReported outcomes\n\n2. Required\nKnowledge and\nAttitude\n2.1\nCommunication process\n2.2\nTeam structure\n2.3\nTeam roles\n2.4\nGroup planning and decision making\n\n3. Required Skills\n3.1\nCommunicate appropriately, consistent with the\nculture of the workplace\n\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1\nAccess to relevant workplace or appropriately\nsimulated environment where assessment can take\nplace\n4.2\nMaterials relevant to the proposed activity or tasks\n\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1\nObservation of the individual member in relation to\nthe work activities of the group\n5.2\nObservation of simulation and or role play involving\nthe participation of individual member to the\nattainment of organizational goal\n5.3\nCase studies and scenarios as a basis for\ndiscussion of issues and strategies in teamwork\n\n6. Context for\nAssessment\n6.1\nCompetency may be assessed in workplace or in a\nsimulated workplace setting\n6.2\nAssessment shall be observed while task are being\nundertaken whether individually or in group\n\n--- PDF PAGE 10 ---\nTR – RUBBER PROCESSING NC II\n\n8\nUNIT OF COMPETENCY :\nPRACTICE CAREER PROFESSIONALISM\n\nUNIT CODE\n:\n500311107\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes in\npromoting career growth and advancement.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Integrate personal\nobjectives with\norganizational goals\n1.1 Personal growth and work plans are pursued towards\nimproving the qualifications set for the profession\n1.2 Intra- and interpersonal relationships is are maintained\nin the course of managing oneself based on\nperformance evaluation\n1.3 Commitment to the organization and its goal is\ndemonstrated in the performance of duties\n\n2. Set and meet work\npriorities\n2.1 Competing demands are prioritized to achieve\npersonal, team and organizational goals and\nobjectives.\n2.2 Resources are utilized efficiently and effectively to\nmanage work priorities and commitments\n2.3 Practices along economic use and maintenance of\nequipment and facilities are followed as per\nestablished procedures\n\n3. Maintain\nprofessional growth\nand development\n3.1 Trainings and career opportunities are identified and\navailed of based on job requirements\n3.2 Recognitions are sought/received and demonstrated\nas proof of career advancement\n3.3 Licenses and/or certifications relevant to job and\ncareer are obtained and renewed\n\n--- PDF PAGE 11 ---\nTR – RUBBER PROCESSING NC II\n\n9\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Evaluation\n1.1\nPerformance Appraisal\n1.2\nPsychological Profile\n1.3\nAptitude Tests\n\n2. Resources\n2.1\nHuman\n2.2\nFinancial\n2.3\nTechnology\n2.3.1\nHardware\n2.3.2\nSoftware\n\n3. Trainings and career\nopportunities\n3.1\nParticipation in training programs\n3.1.1\nTechnical\n3.1.2\nSupervisory\n3.1.3\nManagerial\n3.1.4\nContinuing Education\n3.2\nServing as Resource Persons in conferences and\nworkshops\n\n4. Recognitions\n4.1\nRecommendations\n4.2\nCitations\n4.3\nCertificate of Appreciations\n4.4\nCommendations\n4.5\nAwards\n4.6\nTangible and Intangible Rewards\n\n5. Licenses and/or\ncertifications\n5.1\nNational Certificates\n5.2\nCertificate of Competency\n5.3\nSupport Level Licenses\n5.4\nProfessional Licenses\n\n--- PDF PAGE 12 ---\nTR – RUBBER PROCESSING NC II\n\n10\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Attained job targets within key result areas (KRAs)\n1.2 Maintained intra - and interpersonal relationship in the\ncourse of managing oneself based on performance\nevaluation\n1.3 Completed trainings and career opportunities which are\nbased on the requirements of the industries\n1.4 Acquired and maintained licenses and/or certifications\naccording to the requirement of the qualification\n\n2. Required\nKnowledge and\nAttitudes\n2.1 Work values and ethics (Code of Conduct, Code of\nEthics, etc.)\n2.2 Company policies\n2.3 Company operations, procedures and standards\n2.4 Fundamental rights at work including gender sensitivity\n2.5 Personal hygiene practices\n\n3. Required Skills\n3.1 Appropriate practice of personal hygiene\n3.2 Intra and Interpersonal skills\n3.3 Communication skills\n\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1 Workplace or assessment location\n4.2 Case studies/scenarios\n\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1 Portfolio Assessment\n5.2 Interview\n5.3 Simulation/Role-plays\n5.4 Observation\n5.5 Third Party Reports\n5.6 Exams and Tests\n\n6. Context of\nAssessment\n6.1 Competency may be assessed in the work place or in a\nsimulated work place setting\n\n--- PDF PAGE 13 ---\nTR – RUBBER PROCESSING NC II\n\n11\nUNIT OF COMPETENCY :\nPRACTICE OCCUPATIONAL HEALTH AND SAFETY\nPROCEDURES\n\nUNIT CODE\n:\n500311108\n\nUNIT DESCRIPTOR\n:\nThis unit covers the outcomes required to comply with\nregulatory\nand\norganizational\nrequirements\nfor\noccupational health and safety.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Identify hazards and\nrisks\n1.1\nSafety regulations and workplace safety and\nhazard control practices and procedures are\nclarified and explained based on organization\nprocedures\n1.2\nHazards/risks in the workplace and their\ncorresponding indicators are identified to minimize\nor eliminate risk to co-workers, workplace and\nenvironment in accordance with organization\nprocedures\n1.3\nContingency measures during workplace\naccidents, fire and other emergencies are\nrecognized and established in accordance with\norganization procedures\n2. Evaluate hazards and\nrisks\n2.1\nTerms of maximum tolerable limits which when\nexceeded will result in harm or damage are\nidentified based on threshold limit values (TLV)\n2.2\nEffects of the hazards are determined\n2.3\nOHS issues and/or concerns and identified safety\nhazards are reported to designated personnel in\naccordance with workplace requirements and\nrelevant workplace OHS legislation\n3. Control hazards and\nrisks\n3.1\nOccupational Health and Safety (OHS) procedures\nfor controlling hazards/risks in workplace are\nconsistently followed\n3.2\nProcedures for dealing with workplace accidents,\nfire and emergencies are followed in accordance\nwith organization OHS policies\n3.3\nPersonal protective equipment (PPE) is correctly\nused in accordance with organization OHS\nprocedures and practices\n3.4\nAppropriate assistance is provided in the event of a\nworkplace emergency in accordance with\nestablished organization protocol\n4. Maintain OHS\nawareness\n4.1\nEmergency-related drills and trainings are\nparticipated in as per established organization\nguidelines and procedures\n4.2\nOHS personal records are completed and updated\nin accordance with workplace requirements\n\n--- PDF PAGE 14 ---\nTR – RUBBER PROCESSING NC II\n\n12\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Safety regulations\nMay include but are not limited to:\n1.1\nClean Air Act\n1.2\nBuilding code\n1.3\nNational Electrical and Fire Safety Codes\n1.4\nWaste management statutes and rules\n1.5\nPhilippine Occupational Safety and Health Standards\n1.6\nDOLE regulations on safety legal requirements\n1.7\nECC regulations\n2. Hazards/Risks\nMay include but are not limited to:\n2.1\nPhysical hazards – impact, illumination, pressure,\nnoise, vibration, temperature, radiation\n2.2\nBiological hazards- bacteria, viruses, plants,\nparasites, mites, molds, fungi, insects\n2.3\nChemical hazards – dusts, fibers, mists, fumes,\nsmoke, gasses, vapors\n2.4\nErgonomics\n2.4.1 Psychological factors – over exertion/\nexcessive force, awkward/static positions,\nfatigue, direct pressure, varying metabolic\ncycles\n2.4.2 Physiological factors – monotony, personal\nrelationship, work out cycle\n3. Contingency\nmeasures\nMay include but are not limited to:\n3.1\nEvacuation\n3.2\nIsolation\n3.3\nDecontamination\n3.4\n(Calling designed) emergency personnel\n4. PPE\nMay include but are not limited to:\n4.1\nMask\n4.2\nGloves\n4.3\nGoggles\n4.4\nHair Net/cap/bonnet\n4.5\nFace mask/shield\n4.6\nEar muffs\n4.7\nApron/Gown/coverall/jump suit\n4.8\nAnti-static suits\n5. Emergency-related\ndrills and training\n5.1\nFire drill\n5.2\nEarthquake drill\n5.3\nBasic life support/CPR\n5.4\nFirst aid\n5.5\nSpillage control\n5.6\nDecontamination of chemical and toxic\n5.7\nDisaster preparedness/management\n6. OHS personal\nrecords\n6.1\nMedical/Health records\n6.2\nIncident reports\n6.3\nAccident reports\n6.4\nOHS-related training completed\n\n--- PDF PAGE 15 ---\nTR – RUBBER PROCESSING NC II\n\n13\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Explained clearly established workplace safety and\nhazard control practices and procedures\n1.2 Identified hazards/risks in the workplace and its\ncorresponding indicators in accordance with company\nprocedures\n1.3 Recognized contingency measures during workplace\naccidents, fire and other emergencies\n1.4 Identified terms of maximum tolerable limits based on\nthreshold limit value- TLV.\n1.5 Followed Occupational Health and Safety (OHS)\nprocedures for controlling hazards/risks in workplace\n1.6 Used Personal Protective Equipment (PPE) in\naccordance with company OHS procedures and\npractices\n1.7 Completed and updated OHS personal records in\naccordance with workplace requirements\n2. Required Knowledge\nand Attitude\n2.1 OHS procedures and practices and regulations\n2.2 PPE types and uses\n2.3 Personal hygiene practices\n2.4 Hazards/risks identification and control\n2.5 Threshold Limit Value -TLV\n2.6 OHS indicators\n2.7 Organization safety and health protocol\n2.8 Safety consciousness\n2.9 Health consciousness\n3. Required Skills\n3.1 Practice of personal hygiene\n3.2 Hazards/risks identification and control skills\n3.3 Interpersonal skills\n3.4 Communication skills\n4. Resource\nImplications\nThe following resources must be provided:\n4.1 Workplace or assessment location\n4.2 OHS personal records\n4.3 PPE\n4.4 Health records\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1 Portfolio Assessment\n5.2 Interview\n5.3 Case Study/Situation\n6. Context for\nAssessment\n6.1 Competency may be assessed in the work place or in a\nsimulated work place setting\n\n--- PDF PAGE 16 ---\nTR – RUBBER PROCESSING NC II\n\n14\nCOMMON COMPETENCIES\n\nUNIT TITLE\n:\nAPPLY SAFETY MEASURES IN FARM OPERATIONS\n\nUNIT CODE\n:\nAGR321201\n\nUNIT DESCRIPTOR :\nThis unit covers the knowledge, skills and attitudes required\nto perform safety measures effectively and efficiently. It\nincludes identifying areas, tools, materials, time and place in\nperforming safety measures.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Determine areas of\nconcern for safety\nmeasures\n1.1\nWork tasks are identified in line with farm\noperations\n1.2\nPlace for safety measures are determined in line\nwith farm operations\n1.3\nTime for safety measures are determined in line\nwith farm operations\n1.4\nAppropriate tools, materials and outfits are\nprepared in line with job requirements\n\n2. Apply appropriate safety\nmeasures\n2.1 Tools and materials are used according to\nspecifications and procedures\n2.2 Outfits are worn according to farm requirements\n2.3 Effectivity/shelf life/expiration of materials are\nstrictly observed\n2.4 Emergency procedures are known and followed\nto ensure a safework requirement\n2.5 Hazards in the workplace are identified and\nreported in line with farm guidelines\n\n3. Safekeep/dispose tools,\nmaterials and outfit\n3.1 Used tools and outfit are cleaned after use and\nstored in designated areas\n3.2 Unused materials are properly labeled and stored\naccording to manufacturers recommendation and\nfarm requirements\n3.3 Waste materials are disposed according to\nmanufacturers, government and farm\nrequirements\n\n--- PDF PAGE 17 ---\nTR – RUBBER PROCESSING NC II\n\n15\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Work tasks\nMay be selected from any of the following sectors:\n1.1\nAquaculture\n1.2\nAnimal Production\n1.3\nCrop Production\n1.4\nPost-harvest\n1.5\nAgri-marketing\n1.6\nFarm Equipment\n2. Place\n2.1\nAnimal pens, cages, barns\n2.2\nFish ponds, cages\n2.3\nStock room/storage areas/warehouse\n2.4\nField/farm/orchard\n3. Time\n3.1\nVaccination and medication period\n3.2\nFertilizer and pesticides application\n3.3\nFeed mixing and feeding\n3.4\nHarvesting and hauling\n3.5\nCleaning, sanitizing and disinfecting\n3.6\nDressing, butchering and castration\n4. Tools, materials and\noutfits\n4.1\nTools\n4.1.1 Wrenches\n4.1.2 Screw driver\n4.1.3 Pliers\n4.2\nMaterials\n4.2.1 Bottles\n4.2.2 Plastic\n4.2.3 Bags\n4.2.4 Syringe\n4.3\nOutfit\n4.3.1 Masks\n4.3.2 Gloves\n4.3.3 Boots\n4.3.4 Overall coats\n4.3.5 Hat\n4.3.6 Eye goggles\n5. Emergency procedures\n5.1\nLocation of first aid kit\n5.2\nEvacuation\n5.3\nAgencies contract\n5.4\nFarm emergency procedures\n6. Waste materials\n6.1\nAnimal manure\n6.2\nWaste water\n6.3\nSyringes\n6.4\nUnused farm chemicals e.g. pesticides,\nchemicals, fertilizers\n6.5\nExpired reagents\n6.6\nDead animals\n7. Hazards\n7.1\nChemical\n7.2\nElectrical\n7.3\nFalls\n\n--- PDF PAGE 18 ---\nTR – RUBBER PROCESSING NC II\n\n16\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nDetermined areas of concern for safety measures\n1.2\nApplied appropriate safety measures according to\nindustry requirements\n1.3\nPrepared tools, materials and outfit needed\n1.4\nPerformed proper disposal of used materials\n1.5\nSafekeep/cleaned tools, materials and outfit in\ndesignated facilities\n2. Required\nKnowledge and\nAttitudes\n\n2.1\nSafety Practices\n2.1.1 Implementation of regulatory controls and policies\nrelative to treatment of area and application of\nchemicals\n2.1.2 Proper disposal of waste materials\n2.2\nCodes and Regulations\n2.2.1 Compliance to health program of DOH and DENR\n2.2.2 Hazard identification\n2.2.3 Emergency procedures\n2.3\nTools & Equipment: Uses and Specification\n2.3.1 Masks, gloves, boots, overall coats for health\nprotection\n2.4\nMaintenance\n2.4.1 Regular check-up and repair of tools, materials\nand outfit before and after use\n3. Required Skills\n3.1\nAbility to recognize effective tools, materials and outfit\n3.2\nReady skills required to read labels, manuals and other\nbasic safety information\n\n4. Method of\nAssessment\n\nCompetency in this unit must be assessed through:\n4.1\nPractical demonstration\n4.2\nThird Party Report\n5. Resource\nImplications\n5.1\nFarm location\n5.2\nTools, equipment and outfits appropriate in applying\nsafety measures\n\n6. Context of\nAssessment\nAssessment may occur in the workplace or in a simulated\nworkplace or as part of a team under limited supervision\n\n--- PDF PAGE 19 ---\nTR – RUBBER PROCESSING NC II\n\n17\nUNIT TITLE\n:\nUSE FARM TOOLS AND EQUIPMENT\n\nUNIT CODE\n:\nAGR321202\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes\nrequired to use farm tools and equipment. It includes\nselection, operation and preventive maintenance of farm\ntools and equipment.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Select and use farm\ntools\n\n1.1\nIdentified appropriate farm tools according to\nrequirement/use\n1.2\nFarm tools are checked for faults and defective tools\nreported in accordance with farm procedures\n1.3\nAppropriate tools and equipment are safely used\naccording to job requirements and manufacturers\nconditions\n2. Select and operate\nfarm equipment\n2.1\nIdentify appropriate farm equipment\n2.2\nInstructional manual of the farm tools and equipment\nare carefully read prior to operation\n2.3\nPre-operation check-up is conducted in line with\nmanufacturers manual\n2.4\nFaults in farm equipment are identified and reported in\nline with farm procedures\n2.5\nFarm equipment used according to its function\n2.6\nFollowed safety procedures\n3. Perform preventive\nmaintenance\n3.1\nTools and equipment are cleaned immediately after\nuse in line with farm procedures\n3.2\nRoutine check-up and maintenance are performed\n3.3\nTools and equipment are stored in designated areas in\nline with farm procedures\n\n--- PDF PAGE 20 ---\nTR – RUBBER PROCESSING NC II\n\n18\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Farm equipment\n\n1.1\nEngine\n1.2\nPumps\n1.3\nGenerators\n1.4\nSprayers\n\n2. Farm tools\n2.1\nSickle\n2.2\nCutters\n2.3\nWeighing scales\n2.4\nHand tools\n2.5\nMeasuring tools\n2.6\nGarden tools\n3. Pre-operation check-up\n3.1\nTires\n3.2\nBrake fluid\n3.3\nFuel\n3.4\nWater\n3.5\nOil\n3.6\nLubricants\n3.7\nBattery\n\n--- PDF PAGE 21 ---\nTR – RUBBER PROCESSING NC II\n\n19\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nCorrectly identified appropriate farm tools and equipment\n1.2\nOperated farm equipments according to manual\nspecification\n1.3\nPerformed preventive maintenance\n2. Required\nKnowledge and\nAttitudes\n\n2.1\nSafety Practices\n2.1.1\nIdeal good work habits to demonstrate to\nworkers easy and safety standards during\noperation of farm equipment\n2.2\nCodes and Regulations\n2.2.1\nEnvironmental Compliance Certificate (ECG)\n2.2.2\nEffective work supervision in the operations of\nfarm equipment\n2.3\nTools & Equipment: Uses and Specification\n2.3.1\nKnowledge in calibrating and use of equipment\n2.3.2\nSafety keeping of equipments every after use\n2.4\nMaintenance\n2.1.2\nRegular upkeep of equipments\n2.1.3\nPreventive maintenance skills\n2.5\nValues\n2.6\nPositive outlook towards work\n2.7\nPossesses pre-emptive/anticipatory skills\n3. Required Skills\n3.1\nAbility to recognized defective farm equipment\n3.2\nPerform proper management practices of safety\nmeasures\n4. Method of\nAssessment\n\nCompetency in this unit must be assessed through:\n4.1\nDirect observation\n4.2\nPractical demonstration\n4.3\nThird Party Report\n5. Resource\nImplications\n5.1\nService/operational manual of farm tools and equipment\n5.1.1\nTools and equipment\n5.1.2\nFarm implements\n\n6. Context of\nAssessment\n6.1\nAssessment may occur in the workplace or in a\nsimulated workplace or as part of a team under limited\nsupervision\n\n--- PDF PAGE 22 ---\nTR – RUBBER PROCESSING NC II\n\n20\nUNIT TITLE\n:\nPERFORM ESTIMATION AND BASIC CALCULATION\n\nUNIT CODE\n:\nAGR321203\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes\nrequired to perform basic workplace calculations.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Perform estimation\n1.1\nJob requirements are identified from written or oral\ncommunications\n1.2\nQuantities of materials and resources required to\ncomplete a work task are estimated\n1.3\nThe time needed to complete a work activity is\nestimated\n1.4\nAccurate estimate for work completion are made\n1.5\nEstimate of materials and resources are reported to\nappropriate person\n2. Perform basic\nworkplace calculation\n2.1\nCalculations to be made are identified according to\njob requirements\n2.2\nCorrect method of calculation identified\n2.3\nSystem and units of measurement to be followed\nare ascertained\n2.4\nCalculation needed to complete work tasks are\nperformed using the four basic process of addition,\ndivision, multiplication and subtraction\n2.5\nCalculate whole fraction, percentage and mixed\nwhen are used to complete the instructions\n2.6\nNumber computed in self checked and completed for\nalignment\n\n--- PDF PAGE 23 ---\nTR – RUBBER PROCESSING NC II\n\n21\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Calculations\n\n1.1\nQuantity of feeds\n1.2\nAmount of fertilizer\n1.3\nAmount of medicines\n2. Method of calculation\n\n2.1\nAddition\n2.2\nSubtraction\n2.3\nMultiplication\n2.4\nDivision\n2.5\nRatio and proportion\n3. System of measurement\n3.1\nEnglish\n3.2\nMetric\n4. Units of measurement\n4.1\nArea\n4.2\nVolume\n4.3\nWeight\n\n--- PDF PAGE 24 ---\nTR – RUBBER PROCESSING NC II\n\n22\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nPerformed estimation\n1.2\nPerformed basic workplace calculation\n1.3\nApplied corrective measures as maybe necessary\n2. Required\nKnowledge and\nAttitudes\n\n2.1\nMathematics\n2.1.1 Basic mathematical operations\n2.1.2 Percentage and ratios\n2.1.3 Unit Conversion\n2.1.4 Basic accounting principles and procedures\n2.1.5 Production cost\n2.1.6 Sales\n2.1.7 Accounts receivables/payables\n2.2\nSystems, Processes and Operations\n2.2.1 Knowledge in different management practices and\noperational procedures\n2.3\nValues\n2.3.1 Safety consciousness\n2.3.2 Time consciousness and management\n2.3.3 Cost consciousness\n2.3.4 Precision\n3. Required Skills\n3.1\nAbility to perform basic calculation\n3.2\nCommunicate effectively\n4. Method of\nAssessment\n\nCompetency in this unit must be assessed through:\n4.1\nPractical demonstration\n4.2\nWritten examination\n5. Resource\nImplications\n5.1\nRelevant tools and equipment for basic calculation\n5.2\nRecommended data\n6. Context of\nAssessment\n6.1\nAssessment may occur in the workplace or in a\nsimulated workplace or as part of a team under limited\nsupervision\n\n--- PDF PAGE 25 ---\nTR – RUBBER PROCESSING NC II\n\n23\nCORE COMPETENCIES\n\nThis section gives the details of the contents of the core units of competency\nrequired in Rubber Processing NC II\n\nUNIT OF COMPETENCY\n:\nRECEIVE LATEX AND LUMPS\n\nUNIT CODE\n:\nAGR612205\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge and skills required to\nreceive latex and receive lumps.\n\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Receive Latex\n\n1.1\nLatex volume is determined and recorded according to\nindustry procedure.\n1.2\nLatex quality is tested and recorded in accordance\nwith company specifications.\n1.3\nRequired water-latex ratio is determined in accordance\nwith dilution standard\n1.4\nCoagulating operation is performed in accordance with\nenterprise procedure.\n\n2. Receive lumps\n2.1\nLumps are weighed in accordance to enterprise\nprocedures.\n2.2\nRecords are maintained in accordance with enterprises\nprocedures.\n\n--- PDF PAGE 26 ---\nTR – RUBBER PROCESSING NC II\n\n24\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Latex quality\nThis include the following but is not limited to:\n1.1\nPTR 5\n1.2\nPTR 20\n2. Dilution standard\n\nThis may include:\n2.1\nRibbed Smoke Sheet(RSS)\n2.2\nPale Crepe Rubber(PCR)\n2.3\nCrumb Rubber\n\n--- PDF PAGE 27 ---\nTR – RUBBER PROCESSING NC II\n\n25\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency:\nAssessment requires evidence that the candidate:\n1.1\nReceived latex\n1.2\nReceived lumps/cuplumps\n2. Required Knowledge\nand Attitudes\n2.1\nKnowledge, Theory, Practices and Systems Operations\n2.1.1 Characteristics of good and poor quality latex\n2.1.2 Application of coagulants\n2.1.3 Identification of water contents and contaminants\n2.1.4 Handling latex and lumps techniques and safety\nprocedures\n2.1.5 Personal hygiene practices\n2.1.6 Company standards, policies and procedures\n2.1.7 Practice of 3Rs and 5S\n2.1.8 Program of work activities are implemented as\nscheduled\n2.2\nCommunication\n2.2.1 Prepare and submit required reports\n2.2.2 Maintaining accurate records\n2.3\nMathematics and Mensuration\n2.3.1 Basic mathematical operations\n2.3.2 Production recording\n2.3.3 Percentages and rations\n2.4\nSafety Practices\n2.4.1 Proper application of chemicals such as\ncoagulants\n2.4.2 Proper use of tools, implements and equipment.\n2.4.3 Wear appropriate PPE\n• rubber gloves\n• safety glass\n• apron\n• cover all\n• approved-type respirator\n2.4.4 Safety procedures in handling and storage of\nchemicals\n2.4.5 Disposal of chemicals and containers\n2.5\nCodes and Regulations\n2.5.1 Comply with DA, DENR, FPA Laws, Rules and\nRegulations\n2.6\nMaterials, Tools & Equipment: Uses, Specifications and\nMaintenance\n2.6.1 Tools and Equipment\n2.6.1.1 Can understand and follow instructional\nmanuals\n2.6.1.2 Safe keeping of equipments every after\nuse\n2.6.2 Materials\n2.6.2.1 Where to source good quality supplies,\nmaterials and equipment needed in the\noperation of the farm\n2.6.3 Maintenance\n\n--- PDF PAGE 28 ---\nTR – RUBBER PROCESSING NC II\n\n26\n2.6.3.1 Regular upkeep of equipments and\nfacilities\n2.6.3.2 Preventive maintenance skills\n\n2.7\nValues\n2.7.1 Honesty\n2.7.2 Work ethics/values\n2.7.3 Work harmoniously with others\n2.7.4 Positive attitudes towards tasks assignment’\n2.7.5 Safety consciousness\n2.7.6 Cost consciousness\n3. Required Skills\n3.1\nReceiving latex and lumps/cup-lumps\n3.2\nMonitoring and recording data and writing reports\n3.3\nManaging and controlling spillage\n3.4\nBasic mathematical computation skills\n3.5\nUsing appropriate testing/measuring instruments\n4. Method of\nAssessment\nCompetency in this unit must be assessed through:\n4.1\nDemonstration with questioning\n4.2\nDirect observation\n4.3\nWritten\n4.4\nPortfolio\n5. Resource Implications\n5.1\nAll supplies, materials and equipment needed during\nthe operations should be readily available at site. These\ninclude:\n5.1.1 Latex and lumps/cuplumps\n5.1.2 Record books and calculator\n5.1.3 Weighing scales\n5.1.4 Coagulants\n5.1.5 Latext water content measuring device(i.e.\nMetrolax)\n5.1.6 PPE (Rubber boots, safety goggles/glass, mask-\npreferably N95, rubber glove-industrial type and\ncover all)\n5.1.7 Latex and lumps containers\n5.2\nAll workers involved in different activities must be fully\noriented and cautioned on the different specific work\nactivities of the farm\n5.3\nTechnical supervisors should have skills and ability in\nthe successful implementation of work program\nactivities\n\n6. Context of Assessment\n6.1\nAssessment may occur in an appropriately simulated\nenvironment through TESDA accredited assessment\ncenters\n\n--- PDF PAGE 29 ---\nTR – RUBBER PROCESSING NC II\n\n27\nUNIT OF COMPETENCY\n:\nPRODUCE BLANKETED RUBBER SHEETS\n\nUNIT CODE\n:\nAGR612206\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitude\nrequired to prepare roller machine for operation and\nproduce blanketed rubber sheets.\n\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated i