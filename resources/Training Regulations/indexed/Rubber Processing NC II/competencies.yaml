        "source_text": "--- PDF PAGE 13 ---\nTR – RUBBER PROCESSING NC II \n \n11 \nUNIT OF COMPETENCY : \nPRACTICE OCCUPATIONAL HEALTH AND SAFETY   \nPROCEDURES  \n \nUNIT CODE \n: \n500311108 \n \nUNIT DESCRIPTOR \n: \nThis unit covers the outcomes required to comply with \nregulatory \nand \norganizational \nrequirements \nfor \noccupational health and safety. \n \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables\n1. Identify hazards and \nrisks \n1.1 \nSafety regulations and workplace safety and \nhazard control practices and procedures are \nclarified and explained based on organization \nprocedures \n1.2 \nHazards/risks in the workplace and their \ncorresponding indicators are identified to minimize \nor eliminate risk to co-workers, workplace and \nenvironment in accordance with organization \nprocedures \n1.3 \nContingency measures during workplace \naccidents, fire and other emergencies are \nrecognized and established in accordance with \norganization procedures\n2. Evaluate hazards and \nrisks \n2.1 \nTerms of maximum tolerable limits which when \nexceeded will result in harm or damage are \nidentified based on threshold limit values (TLV) \n2.2 \nEffects of the hazards are determined \n2.3 \nOHS issues and/or concerns and identified safety \nhazards are reported to designated personnel in \naccordance with workplace requirements and \nrelevant workplace OHS legislation\n3. Control hazards and \nrisks  \n3.1 \nOccupational Health and Safety (OHS) procedures \nfor controlling hazards/risks in workplace are \nconsistently followed \n3.2 \nProcedures for dealing with workplace accidents, \nfire and emergencies are followed in accordance \nwith organization OHS policies \n3.3 \nPersonal protective equipment (PPE) is correctly \nused in accordance with organization OHS \nprocedures and practices  \n3.4 \nAppropriate assistance is provided in the event of a \nworkplace emergency in accordance with \nestablished organization protocol\n4. Maintain OHS \nawareness \n4.1 \nEmergency-related drills and trainings are \nparticipated in as per established organization \nguidelines and procedures \n4.2 \nOHS personal records are completed and updated \nin accordance with workplace requirements\n\n--- PDF PAGE 14 ---\nTR – RUBBER PROCESSING NC II \n \n12 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Safety regulations\nMay include but are not limited to:\n1.1 \nClean Air Act \n1.2 \nBuilding code \n1.3 \nNational Electrical and Fire Safety Codes \n1.4 \nWaste management statutes and rules \n1.5 \nPhilippine Occupational Safety and Health Standards \n1.6 \nDOLE regulations on safety legal requirements \n1.7 \nECC regulations \n2. Hazards/Risks\nMay include but are not limited to:\n2.1 \nPhysical hazards – impact, illumination, pressure, \nnoise, vibration, temperature, radiation  \n2.2 \nBiological hazards- bacteria, viruses, plants, \nparasites, mites, molds, fungi, insects \n2.3 \nChemical hazards – dusts, fibers, mists, fumes, \nsmoke, gasses, vapors \n2.4 \nErgonomics \n2.4.1 Psychological factors – over exertion/ \nexcessive force, awkward/static positions, \nfatigue, direct pressure, varying metabolic \ncycles \n2.4.2 Physiological factors – monotony, personal \nrelationship, work out cycle \n3. Contingency \nmeasures \nMay include but are not limited to:\n3.1 \nEvacuation \n3.2 \nIsolation \n3.3 \nDecontamination \n3.4 \n(Calling designed) emergency personnel \n4. PPE\nMay include but are not limited to:\n4.1 \nMask \n4.2 \nGloves \n4.3 \nGoggles \n4.4 \nHair Net/cap/bonnet \n4.5 \nFace mask/shield \n4.6 \nEar muffs \n4.7 \nApron/Gown/coverall/jump suit \n4.8 \nAnti-static suits \n5. Emergency-related \ndrills and training \n5.1\nFire drill\n5.2 \nEarthquake drill  \n5.3 \nBasic life support/CPR \n5.4 \nFirst aid \n5.5 \nSpillage control  \n5.6 \nDecontamination of chemical and toxic \n5.7 \nDisaster preparedness/management \n6. OHS personal \nrecords \n6.1\nMedical/Health records\n6.2 \nIncident reports \n6.3 \nAccident reports \n6.4 \nOHS-related training completed\n\n--- PDF PAGE 15 ---\nTR – RUBBER PROCESSING NC II \n \n13 \nEVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 Explained clearly established workplace safety and \nhazard control practices and procedures \n1.2 Identified hazards/risks in the workplace and its \ncorresponding indicators in accordance with  company  \nprocedures \n1.3 Recognized contingency measures during workplace \naccidents, fire and other emergencies \n1.4 Identified terms of maximum tolerable limits based on \nthreshold limit value- TLV. \n1.5 Followed Occupational Health and Safety (OHS) \nprocedures for controlling hazards/risks in workplace \n1.6 Used Personal Protective Equipment (PPE) in \naccordance with company OHS procedures and \npractices  \n1.7 Completed and updated OHS personal records in \naccordance with workplace requirements   \n2. Required Knowledge \nand Attitude \n2.1 OHS procedures and practices and regulations \n2.2 PPE types and uses \n2.3 Personal hygiene practices \n2.4 Hazards/risks identification and control \n2.5 Threshold Limit Value -TLV \n2.6 OHS indicators  \n2.7 Organization safety and health protocol \n2.8 Safety consciousness \n2.9 Health consciousness \n3. Required Skills \n3.1 Practice of personal hygiene  \n3.2 Hazards/risks identification and control skills \n3.3 Interpersonal skills \n3.4 Communication skills \n4. Resource   \nImplications \nThe following resources must be provided: \n4.1 Workplace or assessment location \n4.2 OHS personal records \n4.3 PPE \n4.4 Health records \n5. Methods of \nAssessment \nCompetency may be assessed through: \n5.1 Portfolio Assessment  \n5.2 Interview \n5.3 Case Study/Situation \n6. Context for \nAssessment \n6.1 Competency may be assessed in the work place or in a \nsimulated work place setting\n",
        "required_knowledge": null,
        "required_skills": null
      }
