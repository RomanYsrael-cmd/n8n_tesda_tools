        "source_text": "AGR612206\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitude\nrequired to prepare roller machine for operation and\nproduce blanketed rubber sheets.\n\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Prepare machine for\noperation\n\n1.1\nMachine is maintained in accordance with standard\nprocedures.\n1.2\nRoller distance is checked and adjusted in accordance\nwith the manual.\n2. Perform milling\noperation\n\n2.1\nOperate slab cutter machine in accordance with\nenterprise and occupational health and safety\nprocedures\n2.2\nOperate pre-breaker machine in accordance with\nenterprise procedure and occupational health and\nsafety procedures\n2.3\nMilling operation is performed in accordance with\nenterprise procedures and occupational health and\nsafety procedures\n2.4\nBreakdown in operation are reported in line with\nenterprise policy\n2.5\nProduction operation report is prepared in line with\nenterprise policy.\n\n--- PDF PAGE 30 ---\nTR – RUBBER PROCESSING NC II\n\n28\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Machine\nmaintenance\n\nMay include but not limited to:\n1.1\nSlab cutter machine\n1.1.1\nLubricate\n1.1.2\nCleaning\n1.1.3\nTightening of mechanical parts\n1.2\nPre-breaker machine\n1.2.1\nLubricate\n1.2.2\nCleaning\n1.2.3\nTightening of mechanical parts\n1.3\nMilling machine\n1.3.1\nLubricate\n1.3.2\nCleaning\n1.3.3\nTightening of mechanical parts\n\n--- PDF PAGE 31 ---\nTR – RUBBER PROCESSING NC II\n\n29\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency:\n\nAssessment requires evidence that the candidate:\n1.1\nPrepared machine for operation\n1.2\nPerformed milling operation\n\n2. Required Knowledge\nand Attitudes\n\n2.1\nKnowledge, Theory, Practices and Systems Operations\n2.1.1 Lubrication, cleaning, checking and adjusting\nrubber rollers\n2.1.2 Basic functions of the machine\n2.1.3 Quality/ characteristics of rubber to be blanketed\n2.1.4 Practice of 3Rs and 5S\n2.1.5 Program of work activities are implemented as\nscheduled\n2.2\nCommunication\n2.2.1 Prepare and submit required reports\n2.3\nSafety Practices\n2.3.1 Proper application use of tools and roller\nmachine\n2.3.2 Wear appropriate personal protective equipment\n(PPE)\n2.4\nCodes and Regulations\n2.4.1 Comply with DA, DENR, FPA Laws, Rules and\nRegulations\n2.5\nMaterials, Tools & Equipment: Uses, Specifications and\nMaintenance\n2.5.1 Tools and Equipment\n2.5.1.1 Can understand and follow instructional\nmanuals\n2.5.1.2 Safe keeping of equipments every after\nuse\n2.5.2 Materials\n2.5.2.1 Where to source good quality supplies,\nmaterials and equipment needed in the\noperation of the farm\n2.5.3 Maintenance\n2.5.3.1 Regular upkeep of tools and roller\nmachines\n2.5.3.2 Preventive maintenance skills\n2.6\nValues\n2.6.1 Honesty\n2.6.2 Committed to work\n2.6.3 Positive attitudes towards tasks assignment’\n2.6.4 Good human relationships\n2.6.5 Work well with others\n\n--- PDF PAGE 32 ---\nTR – RUBBER PROCESSING NC II\n\n30\n\n3. Required Skills\n3.1\nEstimating the appropriate amount of lubricant\n3.2\nUsing of tools in maintaining and repairing machine.\n3.3\nOperating the machine\n3.4\nFeeding the rubber into the roller\n3.5\nBlending the rubber\n3.6\nDetermining thickness of the blanket sheets\n3.7\nQuantifying the number of passes.\n\n4. Method of\nAssessment\nCompetency in this unit must be assessed through:\n4.1\nDemonstration with questioning\n4.2\nObservation with questioning\n\n5. Resource Implications\n5.1\nAll supplies, materials and equipment needed during\nprocessing operations should be readily available at the\nsite\n5.1.1 Slab-cutter\n5.1.2 Pre-breaker machine\n5.1.3 Roller machine\n5.1.4 Milling machine\n5.1.5 Tools used in maintenance of the machine\n5.1.6 PPE\n5.1.7 Lubricants\n5.1.8 Raw materials\n5.1.9 Water supplies\n5.2\nAll workers involved in different activities must be fully\noriented and cautioned on the different specific work\nactivities of the farm\n5.3\nTechnical supervisors should have skills and ability in\nthe successful implementation of work program\nactivities.\n\n6. Context of\nAssessment\n6.1\nAssessment may occur in an appropriately simulated\nenvironment through TESDA accredited assessment\ncenters\n\n--- PDF PAGE 33 ---\nTR – RUBBER PROCESSING NC II\n\n31\nUNIT OF COMPETENCY :\nPERFORM DRYING OPERATION\n\nUNIT CODE\n:"
