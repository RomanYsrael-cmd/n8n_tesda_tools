emonstration\n• Group discussion\n• PowerPoint\npresentation\n• Demonstration\nwith oral\nquestioning\n• Written\nexamination\n• Portfolio\n(credentials)\n\n1 Hour\n\n1.2 Requisition\n materials\n• Preparing material take-off\n• Requesting materials and tools\n• Simulation\n• Discussion\n• Demonstration\nwith oral\nquestioning\n1 Hour\n\n1.3 Receive and\ninspect materials\n• Checking and inspecting\nmaterials and tools\n• Storing/ stacking of tool and\nmaterials\n• Practical\nExercise\n• Demonstration\n• Written / Oral\nTest\n• Demonstration\nwith oral\nquestioning\n2 Hours\n\n2. Observe\nprocedures,\nspecifications and\nmanuals of\ninstructions\n2.1 Identify and\naccess\nspecification/\nmanuals\n• Identifying manuals and\nspecifications\n• Accessing information and data\n• Lecture-\ndemonstration\n• Demonstration\nwith oral\nquestioning\n• Written\nexamination\n2 Hours\n\n2.2 Interpret\nmanuals\n• Interpreting symbols and\nspecifications\n• Accessing information and data\n• Applying conversion of units of\nmeasurements\n• Actual\ndemonstration\n• Group discussion\n• Demonstration\nwith oral\nquestioning\n• Written\nexamination\n\n2 Hours\n\n--- PDF PAGE 76 ---\nMASONRY NC II Revision 01 Promulgated (10/29/2018) 72\n\nUnit of Competency\nLearning\nOutcomes\nLearning Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n\n2.3 Apply\ninformation in\nmanual\n• Applying information from manuals • Demonstration\n• Group discussion\n• Demonstration\nwith oral\nquestioning\n2 Hours\n\n2.4 Store Manual\n• Storing and maintaining manuals\n• Demonstration\n• Group discussion\n• Demonstration\nwith oral\nquestioning\n• Practical and\noral exam\n2 Hours\n\n3. Perform\nmensurations and\ncalculations\n3.1 Select\nmeasuring\ninstruments\n\n• Selecting measuring instruments\n• Lecture-\ndemonstration\n• Group discussion\n• Demonstration\nwith oral\nquestioning\n\n2 Hours\n\n3.2 Carry out\nmeasurements\nand\ncalculations\n\n• Interpreting formulas for volume,\nareas, pe