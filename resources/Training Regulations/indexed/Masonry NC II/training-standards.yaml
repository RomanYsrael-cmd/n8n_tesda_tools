ool and\nmaterials\n• Practical\nExercise\n• Demonstration\n• Written / Oral\nTest\n• Demonstration\nwith oral\nquestioning\n2 Hours\n\n2. Observe\nprocedures,\nspecifications and\nmanuals of\ninstructions\n2.1 Identify and\naccess\nspecification/\nmanuals\n• Identifying manuals and\nspecifications\n• Accessing information and data\n• Lecture-\ndemonstration\n• Demonstration\nwith oral\nquestioning\n• Written\nexamination\n2 Hours\n\n2.2 Interpret\nmanuals\n• Interpreting symbols and\nspecifications\n• Accessing information and data\n• Applying conversion of units of\nmeasurements\n• Actual\ndemonstration\n• Group discussion\n• Demonstration\nwith oral\nquestioning\n• Written\nexamination\n\n2 Hours\n\n--- PDF PAGE 76 ---\nMASONRY NC II Revision 01 Promulgated (10/29/2018) 72\n\nUnit of Competency\nLearning\nOutcomes\nLearning Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n\n2.3 Apply\ninformation in\nmanual\n• Applying information from manuals • Demonstration\n• Group discussion\n• Demonstration\nwith oral\nquestioning\n2 Hours\n\n2.4 Store Manual\n• Storing and maintaining manuals\n• Demonstration\n• Group discussion\n• Demonstration\nwith oral\nquestioning\n• Practical and\noral exam\n2 Hours\n\n3. Perform\nmensurations and\ncalculations\n3.1 Select\nmeasuring\ninstruments\n\n• Selecting measuring instruments\n• Lecture-\ndemonstration\n• Group discussion\n• Demonstration\nwith oral\nquestioning\n\n2 Hours\n\n3.2 Carry out\nmeasurements\nand\ncalculations\n\n• Interpreting formulas for volume,\nareas, perimeters of plane and\ngeometric figures\n• Handling of measuring instruments\n\n• Group discussion\n• Practical Lab\n• Demonstration\n• Written\nexamination\n• Third party report\n• Demonstration\nwith oral\nquestioning\n2 Hours\n\n--- PDF PAGE 77 ---\nMASONRY NC II Revision 01 Promulgated (10/29/2018) 73\n\nUnit of Competency\nLearning Outcomes\nLearning Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n4. Maintain tools and\nequipment\n4.1 Check condition\nof tools and\nequipment\n\n• Maintaining tools and equipment\n• Handling of tools and equipment\n• Identifying tools and equipment\ndefects\n• Lecture-\ndemonstration\n• Group discussion\n• Demonstration\nwith oral\nquestioning\n\n3 Hours\n\n4.2 Perform basic\npreventive\nmaintenance\n• Handling of tools and equipment\n• Performing preventive\nmaintenance\n\n• Simulation\n• Group discussion\n• Practical Lab\n• Demonstration\n\n• Written\nexamination\n• Third party\nreport\n• Demonstration\nwith oral\nquestioning\n3 Hours\n\n4.3 Store tools and\nequipment\n• Storing tools and equipment\n• Handling of tools and equipment\n• Demonstration\n• Group discussion\n• Practical Lab\n• Practical exam\n• Written\nexamination\n• Demonstration\nwith oral\nquestioning\n\n2 Hours\n\n--- PDF PAGE 78 ---\nMASONRY NC II Revision 01 Promulgated (10/29/2018) 74\n\nCORE COMPETENCIES\n (120 HOURS)\n\nUnit of Competency\nLearning Outcomes\nLearning Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n1. Lay concrete hollow\nblock for structure\n1.1 Establish vertical and\nhorizontal guides\n\n•\nInterpret drawings and\nspecifications\n•\nIdentify hazards at work\n•\nExplain procedures in\ninstalling and marking\nhorizontal/vertical guide\n•\nMeasuring work productivity\n•\nUtilizing most productive\npractice\n•\nPracticing 3R and 5S\n\n• Lecture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nwith oral\nquestioning\n\n16 Hours\n\n1.2 Perform laying of\nconcrete hollow block\n•\nIdentify and explain methods\nof laying blocks\n•\nEnumerate block laying\nprocedures\n•\nCheck vertical and horizontal\nalignments\n•\nMeasuring work productivity\n•\nUtilizing most productive\npractice\n•\nPracticing 3R and 5S\n\n• Lecture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nwith oral\nquestioning\n32 Hours\n\n--- PDF PAGE 79 ---\nMASONRY NC II Revision 01 Promulgated (10/29/2018) 75\n\nUnit of Competency\nLearning Outcomes\nLearning Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n\n1.3 Perform jointing process\n•\nIdentify different type of joints\nand applicable tools\n•\nExplain jointing procedures\n•\nMeasuring work productivity\n•\nUtilizing most productive\npractice\n•\nPracticing 3R and 5S\n\n• Lecture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nwith oral\nquestioning\n12 Hours\n\n--- PDF PAGE 80 ---\nMASONRY NC II Revision 01 Promulgated (10/29/2018) 76\n\nUnit of Competency\nLearning Outcomes\nLearning Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n2. Plaster wall surface\n2.1 Prepare wall surfaces\nfor plastering\n\n•\nInterpret drawings and\nspecifications\n•\nIdentify different types of\nplastering guide\n•\nExplain procedures in\npreparing wall surfaces for\nplastering\n•\nMeasuring work productivity\n•\nUtilizing most productive\npractice\n•\nPracticing 3R and 5S\n• Lecture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nwith oral\nquestioning\n\n16 Hours\n\n2.2 Perform plastering work\n\n•\nIdentify types of cement wall\nsurface finishes\n•\nExplain procedures in\nplastering\n•\n Measuring work\nproductivity\n•\nUtilizing most productive\npractice\n•\nPracticing 3R and 5S\n• Lecture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nwith oral\nquestioning\n\n36 Hours\n\n2.3 Perform curing\n•\nIdentify curing methods\n•\nExplain procedures in\ncuring\n•\nMeasuring work productivity\n•\nUtilizing most productive\npractice\n•\nPracticing 3R and 5S\n• Lecture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nwith oral\nquestioning\n\n8 Hours\n\n--- PDF PAGE 81 ---\nMASONRY NC II Revision 01 Promulgated (10/29/2018) 77",
