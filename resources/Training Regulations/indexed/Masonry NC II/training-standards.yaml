evant Work Procedure\n• Lecture\n• Group Discussion\n• Demonstration\n\n• Written Exam\n• Demonstration\n• Observation\n• Interviews /\n• Questioning\n1 Hour\n\n--- PDF PAGE 74 ---\nMASONRY NC II Revision 01 Promulgated (10/29/2018) 70\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\n8.3 Convey inefficient\nand ineffective\nenvironmental\npractices\n• Identification of (re)training needs and\nusage of environment friendly methods and\ntechnologies\n• Identification of environmental corrective\nactions\n• Practicing Environment Awareness\n• Lecture\n• Group Discussion\n• Role Play\n• Demonstration\n\n• Written Exam\n• Demonstration\n• Observation\n• Interviews /\n• Questioning\n1 Hour\n9. Practice\nEntrepreneurial\nSkills in the\nWorkplace\n9.1 Apply\nentrepreneurial\nworkplace best\npractices\n\n• Case studies on Best entrepreneurial\npractices\n• Discussion on Quality procedures and\npractices\n• Case studies on Cost consciousness in\nresource utilization\n• Case Study\n• Lecture/Discussion\n• Case Study\n• Written Test\n• Interview\n1 Hour\n\n9.2 Communicate\nentrepreneurial\nworkplace best\npractices\n• Discussion on communicating\nentrepreneurial workplace best practices\n\n• Lecture/Discussion\n• Written Test\n• Interview\n1 Hour\n\n9.3 Implement cost-\neffective operations\n• Case studies on Preservation, optimization\nand judicious use of workplace resources\n• Case Study\n• Lecture/Discussion\n• Case Study\n• Written Test\n• Interview\n2 Hours\n\n--- PDF PAGE 75 ---\nMASONRY NC II Revision 01 Promulgated (10/29/2018) 71\n\nCOMMON COMPETENCIES\n(24 HOURS)\n\nUnit of Competency\nLearning\nOutcomes\nLearning Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n1. Prepare\nconstruction\nmaterials and tools\n\n1. 1 Identify\nmaterials\n\n• Identifying tools according to the\njob requirements\n• Identifying materials and\naccessories according to the job\nrequirements\n• Lecture-\