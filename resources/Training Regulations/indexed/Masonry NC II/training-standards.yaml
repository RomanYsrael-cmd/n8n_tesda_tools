rformance.\n• Standardized\nassessment of\ncharacter\nstrengths and\nvirtues applied\n\n1 Hour\n\n--- PDF PAGE 72 ---\nMASONRY NC II Revision 01 Promulgated (10/29/2018) 68\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n6. Present relevant\ninformation\n6.1 Gather data/\ninformation\n• Lecture and discussion on:\no Organisational protocols\no Confidentiality and accuracy\no Business mathematics and statistics\no Legislation, policy and procedures\nrelating to the conduct of evaluations\n• Reviewing data/ information\n• Group discussion\n• Lecture\n• Demonstration\n• Role Play\n• Oral evaluation\n• Written Test\n• Observation\n• Presentation\n2 Hours\n6.2 Assess gathered\ndata/ information\n• Lecture and discussion on:\no Data analysis techniques/ procedures\no Organisational values, ethics and\ncodes of conduct\no Trends and anomalies\n• Computing business mathematics and\nstatistics\n• Application of data analysis techniques\n• Group discussion\n• Lecture\n• Demonstration\n• Role Play\n• Practical exercises\n• Oral evaluation\n• Written Test\n• Observation\n• Presentation\n3 Hours\n6.3 Record and\npresent information\n• Lecture and discussion on:\no Reporting requirements to a range of\naudiences\no Recommendations for possible\nimprovements\n• Analysis and comparison of interim and\nfinal reports’ outcomes\n• Reporting of data findings\n• Group discussion\n• Lecture\n• Demonstration\n• Role Play\n• Practical exercises\n\n• Oral evaluation\n• Written Test\n• Observation\n• Presentation\n3 Hours\n7. Practice\nOccupational\nSafety And\nHealth Policies\nAnd Procedures\n7.1 Identify OSH\ncompliance\nrequirements\n• Discussion regarding:\n- Hierarchy of Controls\n- Hazard Prevention and Controls\n- Work Standards and Procedures\n- Personal Protective Equipment\n•\nLecture\n•\nGroup\nDiscussion\n\n•\nWritten Exam\n•\nDemonstration\n•\nObservation\n•\nInterviews /\nQuestioning\n1 Hour\n\n--- PDF PAGE 73 ---\nMASONRY NC II Revision 01 Promulgated (10/29/2018) 69\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\n7.2 Prepare OSH\nrequirements for\ncompliance\n• Identification of required safety materials,\ntools and equipment\n• Handling of safety control resources\n\n• Lecture\n• Group Discussion\n\n• Written Exam\n• Demonstration\n• Observation\n• Interviews /\n• Questioning\n1 Hour\n\n7.3 Perform tasks in\naccordance with\nrelevant OSH\npolicies and\nprocedures\n•\nDiscussion of General OSH Standards and\nPrinciples\n• Performing industry related work activities\nin accordance with OSH Standards\n• Lecture\n• Group Discussion\n•\n• Written Exam\n• Demonstration\n• Observation\n• Interviews /\n• Questioning\n2 Hours\n8. Exercise\nEfficient and\nEffective\nSustainable\nPractices in the\nWorkplace\n8.1 Identify the\nefficiency and\neffectiveness of\nresource utilization\n- Discussion on the process how\nEnvironmental Policies coherence is\nachieved\n•\nDiscussion on Necessary Skills in\nresponse to changing environmental\npolicies needs\n-\nWaste Skills\n-\nEnergy Skills\n-\nWater Skills\n-\nBuilding Skills\n-\nTransport Skills\n-\nMaterial Skills\n• Lecture\n• Group Discussion\n• Simulation\n• Demonstration\n\n• Written Exam\n• Demonstration\n• Observation\n• Interviews /\n• Questioning\n1 Hour\n\n8.2 Determine causes\nof inefficiency of\nresource utilization\n• Discussion of Environmental Protection\nand Resource Efficiency Targets\n• Analysis on the Relevant Work Procedure\n• Lecture\n• Group Discussion\n• Demonstration\n\n• Written Exam\n• Demonstration\n• Observation\n• Interviews /\n• Questioning\n1 Hour\n\n--- PDF PAGE 74 ---\nMASONRY NC II Revision 01 Promulgated (10/29/2018) 70\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\n8.3 Convey inefficient\nand ineffective\nenvironmental\npractices\n• Identification of (re)tra