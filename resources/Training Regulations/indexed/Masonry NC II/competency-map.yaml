  "source_text": "SECTION 1 MASONRY NC II QUALIFICATION\n\nThe MASONRY NC II qualification consists of competencies that a person must\nachieve that will enable to lay concrete hollow block for structure and plaster wall surfaces.\n\nThis Qualification is packaged from the competency map of Construction – Civil Works\nsub-sector as shown in Annex A.\n\nThe units of competency comprising this qualification include the following:\n\nCODE NO.\nBASIC COMPETENCIES\n400311210\nParticipate in workplace communication\n400311211\n400311212\n400311213\n400311214\n400311215\n400311216\n400311217\n\n400311218\nWork in a team environment\nSolve/address general workplace problems\nDevelop career and life decisions\nContribute to workplace innovation\nPresent relevant information\nPractice occupational safety and health policies and procedures\nExercise efficient and effective sustainable practices in the\nworkplace\nPractice entrepreneurial skills in the workplace\n\nCODE NO.\nCOMMON COMPETENCIES\nCON931201\nPrepare construction materials and tools\nCON311201\nObserve procedures, specifications and manuals of\ninstruction\nCON311203\nPerform mensurations and calculations\nCON311204\nMaintain tools and equipment\n\nCODE NO.\nCORE COMPETENCIES\nCON711318\nCON711319\nLay concrete hollow block for structure\nPlaster wall surface\n\nA person who has achieved this Qualification is competent to be a –\n\n Rough Mason\n\n--- PDF PAGE 6 ---\nMASONRY NC II Revision 01 Promulgated (10/29/2018)\n2"
