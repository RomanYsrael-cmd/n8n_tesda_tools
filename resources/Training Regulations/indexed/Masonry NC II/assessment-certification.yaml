nPrepare masonry\nmaterials\n\nPerform masonry tools and\nequipment\n\nPerform basic masonry\nworks\n\nLay concrete hollow\nblock for structure\nPlaster wall surface\nPerform basic tile\nsetting\nPerform straight-to-finish\nfloor concreting\nRectify non-conforming\nconcrete and masonry\nsurfaces\nLay tiles on plain and\ncurved surfaces for walls,\nfloors and other\napplication\nRepair of tiles on plain\nand curved surfaces\nLayout reference lines\n\nFabricate, install and\nremove wooden formworks\n\nInstall wooden door jamb,\nwindow frame and panels\n\nInstall ceiling and wall\nframes and panels\n\nFabricate and install\nwooden stairs\n\nInstall wooden floor\nsupports and panels\n\nFabricate and install\nroofing system\n\nFabricate and install\nwooden cabinet\n\nInstall decorative\nmoldings\n\nInstall ceiling frames\nand panels or\nacoustical ceiling\n\nInstall eaves or soffits\nframes and panels and\nvents assembly\nInstall partition wall and/or\ncladding frames and\nboards\n\nInstall laminate floors\n\nInstall parquet floors\n\nErect and dismantle\nsupport type scaffold\n\nHandle, segregate and\nstack scaffolding\ncomponents\nPrepare pipefitting\nmaterials, tools and\nequipment for spool pipe\nconnection\nInstall above ground piping\nsystem\n\nInstall overhead piping\nsystem\nInstall underground\npiping system\nLay tiles on plain and\ncurved surfaces for\nwalls, floors and other\napplication\nRepair of tiles on plain and\ncurved surfaces\n\nCORE COMPETENCIES\n\n--- PDF PAGE 94 ---\nMASONRY NC II Revision 01 Promulgated (10/29/2018) 90\n\nGLOSSARY OF TERMS\n\n1. DOWEL\nA headless, cylindrical pin which, is sunk into corresponding\nholes\n\n2. LINTEL\nRefers to the horizontal member over an opening such as door\nor window, usually carrying the load\n\n3. MORTAR\nRefers to a mixture of cement, sand and water used for laying\nbricks or masonry units\n\n4. REBAR\nRefers to the reinforcing bars that are embedded in building\ncomponents such as concrete, masonry walls, columns, beams\nand other structural parts\n\n5. SCAFFOLD\nRefers to a temporary or movable platform supported on the\nground or suspended, used for working at considerable heights\nabove the ground.\n\n6. FORMWORKS\n\n7. CURING\n\n8. 5S\n\n9. 3R\n\nReduce\n\n Reuse\n\nRecycling\n\nA set of wood or steel forms in place to hold wet concrete until it\nhardens\n\nIs defined as providing adequate moisture, temperature, and\ntime to allow the concrete to achieve the desired properties for\nits intended use.\n\nThe five in a 5S workplace organizational and housekeeping\nmethodology refers to five steps – sort, set in order, shine,\nstandardize and sustain.\n\nThe principle of reducing waste, reusing and recycling resources\nand products\n\nThe waste management concept of reducing what is produced\nand what is consumed\n\nThe waste management concept of reusing items, or re-\npurposing them for a use different than what they are intended\nfor\n\nThe waste management concept of transforming again into a\nraw material that can be shaped into a new item\n\n--- PDF PAGE 95 ---\nMASONRY NC II Revision 01 Promulgated (10/29/2018) 91\n\nTRAINING REGULATIONS\n(TR)\nDOCUMENT REVISION\nHISTORY\n\nQualification Title:\nMasonry NC II\nQualification Code:\nCONMAS218\n\nRevisio\nn\nNo.\nDocument\nDescription Types*\nReplaces Version\n(TESDA Board\nResolution No./\nDate)\nNew Version\n(TESDA Board\nResolution No./\nDate)\nDeployment\n(TESDA\nCircular/\nImplementing\nGuidelines)\n00\nDocument Created\nMasonry NC II\n2005-03 / 03/18/05\nN/A\nN/A\n01\nDocument Amended\nMasonry NC II\n2005-03 / 03/18/05\n2018-31 / 10/29/18\n\n Legend: *Description Types\n- Document Created\n- Document Amended\n\n--- PDF PAGE 96 ---\nMASONRY NC II Revision 01 Promulgated (10/29/2018) 92\n\nACKNOWLEDGMENTS\n\nThe Technical Education and Skills Development Authority (TESDA) wishes to\nextend thanks and appreciation to the many representatives of business, industry, academe\nand government agencies who donated th