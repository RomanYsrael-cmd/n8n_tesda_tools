  "source_text": "SECTION 4 NATIONAL ASSESSMENT AND CERTIFICATION\n ARRANGEMENTS\n\n4.1\nTo attain the National Qualification of COMMERCIAL COOKING NC\nIII, the candidate must demonstrate competence in all the units of\ncompetency listed in Section l. Successful candidates shall be\nawarded a National Certificate signed by the TESDA Director General.\n\n4.2\nIndividuals aspiring to be awarded the qualification of COMMERCIAL\nCOOKING NC III must acquire Certificates of Competency in all the\nfollowing groups/cluster of core units of the Qualification. Candidates\nmay apply for assessment in any accredited assessment center.\n\n4.2.1 Plan and prepare foods\n\n4.2.1.1 Plan and prepare food for ala carte and buffets\n4.2.1.2 Prepare pates and terrines\n4.2.1.3 Plan, prepare and display a buffet\n4.2.1.4 Select, prepare and serve specialized food items\n4.2.1.5 Select, prepare and serve specialty cuisines\n4.2.1.6 Establish and maintain quality control\n\n4.2.2 Plan and prepare quantity of foods\n\n4.2.2.1 Organize bulk cooking operations\n4.2.2.2 Plan, prepare and display a buffet\n4.2.2.3 Establish and maintain quality control\n4.2.2.4 Apply cook-chill-freeze production processes\n\n4.2.3 Plan and cost catering services\n\n4.2.3.1 Plan and control menu-based catering\n4.2.3.2 Monitor catering revenue and costs\n\n Successful candidates shall be awarded Certificates of Competency\n(COC).\n\n4.3\nAfter accumulation and submission of all COCs acquired for the\nrelevant units of competency comprising a qualification, an individual\nshall be issued the corresponding National Certificate.\n\n4.4\nAssessment shall focus on the core units of competency. The basic\nand common units shall be integrated or assessed concurrently with\nthe core units.\n\n--- PDF PAGE 107 ---\n________________________________________________________________________________________________________________________________ 105\nTR – Commercial Cooking NCIII Promulgated April 2007\n\n4.5\nThe following are qualified to apply for assessment and certification:\n\n4.5.1 Graduates of formal, non-formal and informal including\n enterprise-based training programs.\n\n4.5.2 Experienced Workers (wage employed or self-employed)\n\n4.6\nThe guidelines on assessment and certification are discussed in detail\nin the \"Procedures Manual on Assessment and Certification\" and\n\"Guidelines on the Implementation of the Philippine TVET Qualification\nand Certification System (PTQCS)\".\n\n--- PDF PAGE 108 ---\n________________________________________________________________________________________________________________________________ 106\nTR – Commercial Cooking NCIII Promulgated April 2007\n\nCOMPETENCY MAP - TOURISM Sector\n(Hotels and Restaurants)\n COMMERCIAL COOKING NC III\nANNEX A\n\nCollect,\nanalyze and\norganize\ninformation\nPlan and\norganize work\nPromote\nenvironmental\nprotection\nUtilize\nspecialized\ncommunication\nskills\nDevelop teams\nand individuals\nApply problem-\nsolving\ntechniques in\nthe workplace\nUse\nmathematical\nconcepts and\ntechniques\nUse relevant\ntechnologies\nLead small\nteams\nDevelop and\npractice\nnegotiation\nskills\nSolve\nproblems\nrelated to work\nactivities\nPractice career\nprofessionalism\nPractice\noccupational\nhealth and safety\npractices\nLead\nworkplace\ncommunication\nParticipate in\nworkplace\ncommunication\nWork in team\nenvironment\nRoster staff\nControl and\norder stock\nPerform\ncomputer\noperations\nPerform\nworkplace and\nsafety practices\nProvide\neffective\ncustomer\nservice\nDevelop and\nupdate\nindustry\nknowledge\nObserve\nworkplace\nhygiene\nprocedures\n\nPrepare, cook\nand serve food\nfor menus\nPrepare\nappetizers and\nsalads\nPrepare\nsandwiches\nSelect, prepare\nand cook meat\nReceive and\nstore kitchen\nsupplies\nPrepare\nstocks, sauces\nand soups\nClean and\nmaintain\nkitchen\npremises\nOrganize and\nprepare food\nPrepare\nvegetables,\nfruits, eggs\nand starch\nproducts\n\nPresent food\nPackage\nprepared\nfoodstuffs\nPlan and\nprepare food\nfor ala carte\nand buffets\nPrepare and\ncook seafood\nPrepare hot and\ncold desserts\nPrepare\npastry, cakes,\nand yeast-\nbased\nproducts\nPrepare and\ncook poultry\nand game\nPrepare and\nportion\ncontrolled\nmeat cuts\nPlan and\ncontrol menu-\nbased catering\n\nMonitor\ncatering\nrevenue and\ncosts\nEstablish and\nmaintain\nquality control\nApply cook-\nchill-freeze\nproduction\nprocesses\nPlan, prepare\nand display ala\ncarte and buffet\nSelect, prepare\nand serve\nspecialized food\nitems\nSelect,\nprepare and\nserve specialty\ncuisines\nOrganize bulk\ncooking\noperations\nPrepare pates\nand terrines\nPrepare foods\naccording to\ndietary and\ncultural needs\n\nPlan the\ncatering for an\nevent or\nfunction\nDesign menus\nto meet market\nneeds\nDevelop a food\nsafety program\nDevelop menus\nto meet special\ndietary and\ncultural needs\nSelect catering\nsystems\nManage facilities\nassociated with\ncommercial\ncatering\ncontracts\nTransport and\nstore food in a\nsafe and hygienic\nmanner\nApply catering\ncontrol\nprinciples\nBASIC\nCOMPETENCIES\nCOMMON\nCOMPETENCIES\nCORE\nCOMPETENCIES\nEstablish and\nconduct\nbusiness\nrelationships\nTrain small\ngroups\nConduct\nassessment\nManage\nworkplace\ndiversity\nManage\nfinances within\na budget\nManage\nquality\ncustomer\nservice\n\n--- PDF PAGE 109 ---\n________________________________________________________________________________________________________________________________ 107\nTR – Commercial Cooking NCIII Promulgated April 2007\n\nDEFINITION OF TERMS\n\n1. Barbecue – A cooking method involving grilling food over a wood or charcoal\nfire. Usually some sort of rub, marinade, or sauce is brushed on the item before\nor during cooking.\n2. Blanch – to cook an item briefly in boiling water or hot fat before finishing or\nstoring it.\n3. Boil – a cooking method in which items are immersed in liquid at or above the\nboiling point (212ºF/100ºC).\n4. Braise – a cooking method in which the main item, usually meat, is seared in fat,\nthen simmered in stock to another liquid in a covered vessel.\n5. Broil – a cooking method in which items are cooked by a radiant heat source\nplaced above the food, usually in a broiler or salamander.\n6. Butcher - a chef or purveyor who is responsible for butchering meats, poultry\nand occasionally fish.\n7. Chafing dish – a metal dish with a heating unit (flame or electric) used to keep\nfoods warm and to cook foods at tableside or during buffet service.\n8. Chop – to cut into pieces of roughly the same size. Also, a small cut of meat\nincluding part of the rib\n9. Combination method – a cooking method that involves the application of both\nmoist and dry heat to the main item (for example, braising or stewing)\n10. Cure – to preserve a food by salting, smoking and or drying\n11. Deep fry – a cooking method in which foods are cooked by immersion in hot fat;\ndeep-fried foods are often coated with bread crumbs or batter before being\ncooked\n12. Dice – to cut ingredients into small cubes (1/4 inches for small, 1/3 for medium,\n¾ inch for large)\n13. Fillet – a boneless cut of meat, fish or poultry\n14. Garnish – an edible decoration of accompaniment to a dish\n15. Gratine – browned in an oven or under a salamander. Gratine can also refer to\na forcemeat in which some portion of the dominant meat is sautéed and cooled\nbefore grinding.\n16. Grill – a cooking technique in which foods are cooked by a radiant heat source\nplaced below the food. Also, the piece of equipment on which grilling is done.\n17. Instant reading thermometer – a thermometer used to measure the internal\ntemperature of foods. The stem is inserted into the food, producing an instant\ntemperature read out.\n\n--- PDF PAGE 110 ---\n________________________________________________________________________________________________________________________________ 108\nTR – Commercial Cooking NCIII Promulgated April 2007\n\n18. Marinade – an apparel used in cooking to flavor and moisten foods, may be\nliquid or dry. Liquid marinades are usually based on acidic ingredients, such as\nwine or vinegar, dry marinades are usually salt-based.\n19. Microwave – a method of meat transfer in which electro-magnetic waves\ngenerated by a device called a magnetron penetrate food and cause the water\nmolecules in it to oscillate.\n20. Mince – to chop into very small pieces\n21. Mise-en-place – “Put in place”. The preparation and assembly of ingredients,\npans, utensils and plates or serving pieces needed for a particular dish or service\nperiod\n22. Panbroil – a cooking method similar to dry sautéing that simulates broiling by\ncooking an item in a hot pan with little or no fat.\n23. Panfry – a cooking method in which items are cooked in deep fat in a skillet over\nmedium heat; this generally involves more fat than sautéing or stir-frying but less\nthan deep-frying.\n24. Pasta – noodles made from a dough of flour (often semolina), water and/or eggs.\nThis dough is kneaded, rolled and cut or extruded, then cooked by boiling\n25. Poach – a method in which items are cooked gently in simmering liquid\n26. Pressure steamer – a machine that steams food by heating water under\npressure in a sealed compartment, allowing the team to reach higher-than-boiling\ntemperature (212ºF/100ºC). The food is placed in a sealer chamber that cannot\nbe opened until the pressure has released and the steam properly vented from\nthe chamber.\n27. Roast – a dry heat cooking method in which items are cooked in an oven or on a\nspit over a fire\n28. Sauté – a cooking method in which items are cooked quickly in a small amount\nof fat in a pan on the range top.\n29. Simmer – to main the temperature of a liquid just below boiling. Also, a cooking\nmethod in which items are cooked in a simmering liquid.\n30. Smoking – any of several methods for preserving and flavor foods by exposing\nthem to smoke. Methods include cold-smoking (in which smoked items are not\nfully cooked), hot-smoking (in which the items are cooked), and smoke-roasting.\n31. Steaming – a cooking method in which items are cooked in a vapor by boiling\nwater or other liquids.\n32. Stew – a cooking method nearly identical to braising but generally involving\nsmaller pieces of meat and hence a shorter cooking time. Stewed items also\nmay be blanched, rather than seared, to give the finished product a pale color.\nAlso a dish prepared by using the stewing method.\n33. Stir fry – a cooking method similar to sautéing in which items are cooked over\nhigh heat, using little fat. Usually this is done in a wok and the food is kept\nmoving constantly.\n\n--- PDF PAGE 111 ---\n________________________________________________________________________________________________________________________________ 109\nTR – Commercial Cooking NCIII Promulgated April 2007\n\nACKNOWLEDGMENTS\n\nThe Technical Education and Skills Development Authority (TESDA)\nwishes to extend thanks and appreciation to the many representatives of business,\nindustry, academe and government agencies who donated their time and expertise\nto the development and validation of these Training Regulations.\n\n TOURISM INDUSTRY BOARD FOUNDATION, INC. (TIBFI) - EXECUTIVE\n COMMITTEE\n\nMR. DANIEL L. EDRALIN\nChairman\n\nSEC. AUGUSTO BOBOY SYJUCO\nTrustee\nDirector General, TESDA\n\nMR. HUMPHREY O’LEARY\nDeputy Chairman\n\nATTY. MA. VICTORIA V. JASMIN\nTrustee\n\nMR. PAUL LIM SO\nTreasurer\n\nDR. IGNACIO S. PABLO\nExecutive Director\n\nDR. CORAZON R. RODRIGUEZ\nSecretary\n\nINDUSTRY WORKING GROUP (IWG)\n\nMR. HUMPHREY O’LEARY\nMS. ANABELLE MORENO\nCo-Chairs\nIndustry Working Committee\n\nMR. BIENVENIDO CLARAVALL\nAssessment and Certification\nSub-Committee\n\nMS. SYLVIA SANGCO\nChair, Planning Sub-Committee\n\nAdvocacy Sub-Committee\n\nMS. YAEL FERNANDEZ\nMS. SUSAN EDILO\nStandards Development Sub-Committee\n\nVIC ALCUAZ\nPlacement Sub-Committee\n\nMR. SANTOS BUENVENIDA\nENGR. EVELYN PANTIG\nProfessional and Programs Development Sub-\nCommittee\n\n--- PDF PAGE 112 ---\n________________________________________________________________________________________________________________________________ 110\nTR – Commercial Cooking NCIII Promulgated April 2007\n\nIWG - STANDARDS AND ASSESSMENT COMMITTEE\n\nCOMMERCIAL COOKING\n\nMS. MA. CHRISTINA AQUINO\nLyceum of the Phils. University, Manila\nMR. DAVID PELAEZ\nCenter for Culinary Arts, Manila\nQuezon City\nCHEF ENRICO MAGTANONG\nCenter for Culinary Arts, Manila\nQuezon City\nCHEF OJIE RELOJ\nCenter for Culinary Arts, Manila\nQuezon City\nCHEF MICHAEL YAP\nCenter for Culinary Arts, Manila\nQuezon City\nCHEF MICK BONDOC\nCravings Restaurant\nQuezon City\n\nThe TESDA Board Members and Secretariat\n\nThe Management and Staff of the TESDA Secretariat\n\n• QSO"
