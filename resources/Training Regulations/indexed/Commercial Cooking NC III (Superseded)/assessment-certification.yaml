      "number": "4.2",
      "text": "Individuals aspiring to be awarded the qualification of COMMERCIAL COOKING NC III must acquire Certificates of Competency in all the following groups/cluster of core units of the Qualification. Candidates may apply for assessment in any accredited assessment center. 4.2.1 Plan and prepare foods 4.2.1.1 Plan and prepare food for ala carte and buffets 4.2.1.2 Prepare pates and terrines 4.2.1.3 Plan, prepare and display a buffet 4.2.1.4 Select, prepare and serve specialized food items 4.2.1.5 Select, prepare and serve specialty cuisines 4.2.1.6 Establish and maintain quality control 4.2.2 Plan and prepare quantity of foods 4.2.2.1 Organize bulk cooking operations 4.2.2.2 Plan, prepare and display a buffet 4.2.2.3 Establish and maintain quality control 4.2.2.4 Apply cook-chill-freeze production processes 4.2.3 Plan and cost catering services 4.2.3.1 Plan and control menu-based catering 4.2.3.2 Monitor catering revenue and costs Successful candidates shall be awarded Certificates of Competency (COC)."
    },
    {
      "number": "4.3",
      "text": "After accumulation and submission of all COCs acquired for the relevant units of competency comprising a qualification, an individual shall be issued the corresponding National Certificate."
    },
    {
      "number": "4.4",
      "text": "Assessment shall focus on the core units of competency. The basic and common units shall be integrated or assessed concurrently with the core units."
