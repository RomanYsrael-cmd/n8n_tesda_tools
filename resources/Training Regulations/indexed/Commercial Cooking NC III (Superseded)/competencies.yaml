        "evidence_guide": {
          "source_text": "1. Critical aspects of\nCompetency\nAssessment requires evidences that the candidate:\n1.1 Explained and described in detail the different products\ncommodities suitable for pates and terrines.\n1.2 Demonstrated expertise in preparing pates and terrines\nto meet enterprise standards.\n1.3 Demonstrated skills in presenting pates and terrines\nprofessionally.\n1.4 Demonstrated ability in developing new recipes for pates\nand terrines.\n1.5 Applied safe and hygienic practices in handling and\nstoring of pates and terrines.\n2. Underpinning\nKnowledge\n2.1 Ingredients suitable for making pates and terrines and\ntheir characteristics.\n2.2 Outcomes of the various binding agents and processes\nused in the preparation of pates and terrines.\n2.3 Culinary terms related to pates and terrines commonly\nused in the industry.\n2.4 Principles of nutrition, in particular, the food values of\npates and terrines and the effects of cooking on the\nnutritional value of food.\n3. Underpinning skills\n3.1 Presentation of skills for pates and terrines including\npastry decoration, glazing, layering of ingredients,\nprecision cutting and arranging.\n3.2 Safe work practices, in particular in relation to using\nchopping and mincing equipment.\n3.3 Hygiene requirements particularly relating to possible\nbacterial spoilage in the preparation, storage and service\nof pate and terrine products.\n3.4 Logical and time efficient workflow.\n4. Resource\n\nImplications\nThe following resources MUST be provided:\n4.1 Demonstration of skills in making multiple types of pates\nand terrines within a fully equipped operational\ncommercial kitchen (including industry-current\nequipment)\n4.2 Use of a range of real ingredients suitable for making\npates and terrines.\n4.3 Preparation of pates and terrines within commercially\nrealistic time constraints.\n\n--- PDF PAGE 64 ---\n________________________________________________________________________________________________________________________________ 62\n\nTR – Commercial Cooking NCIII Promulgated April 2007\n\n5. Method of\n Assessment\nCompetency may be assessed through:\n5.1 Direct observation of the candidate using techniques to\nprepare pates and terrines.\n5.2 Sampling of pates and terrines, cookery techniques,\nequipment and food hygiene.\n5.3 Review of portfolios of evidence and third party\nworkplace reports of on-the-job performance by the\ncandidate.\n5. Context for\n Assessment\n6.1 Assessment may be done in the workplace or in\n simulated workplace setting (assessment centers)\n6.2 Assessment activities are carried out through TESDA’s\n accredited assessment center\n\n--- PDF PAGE 65 ---\n________________________________________________________________________________________________________________________________ 63\n\nTR – Commercial Cooking NCIII Promulgated April 2007\n\nUNIT OF COMPETENCY: PLAN, PREPARE AND DISPLAY BUFFET\n\nUNIT CODE\n :"
