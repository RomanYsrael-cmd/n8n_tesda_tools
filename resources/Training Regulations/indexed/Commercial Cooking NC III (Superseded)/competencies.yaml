        "evidence_guide": {
          "source_text": "1. Critical aspects of\n\n Competency\nAssessment requires evidences that the candidate:\n1.1\nDemonstrated ability in selecting appropriate cooking\nmethods to specialized food products.\n1.2\nDemonstrated ability to plan specialized menu and\nmenu items.\n1.3\nDemonstrated skills in preparing and presenting\nspecialized food items.\n2. Underpinning\nKnowledge\n2.1\nMenu Planning\n2.2\nSpecialized food items\n2.3\nPurchasing\n2.4\nPreparing, cooking and storing specialized food items.\n2.5\nCulinary terms used to describe specialized items and\nequipment.\n2.6\nHistory and significance of specialized food items.\n3. Underpinning skills\n3.1\nAdvanced and/or specialized preparation and cooking\ntechniques.\n3.2\nPurchasing and storage of specialist food items.\n4. Resource\n Implications\nThe following resources MUST be provided:\n4.1\nDemonstration of skills within a suitably equipped food\npreparation area (i.e. environment suited to the item in\nquestion).\n4.2\nUse of a variety of specialized food items.\n4.3\nPreparation of specialized menu items within typical\nworkplace time constraints.\n5. Method of\n Assessment\nCompetency may be assessed through:\n5.1\nDirect observation of the candidate preparing\nspecialized food items.\n5.2\nCase studies to assess ability to suggest and prepare\nspecialized food in response to particular needs.\n5.3\nSampling of food items prepared by the candidate.\n5.4\nWritten or oral questions to test knowledge of\nspecialized food items.\n5.5\nReview of portfolios of evidence and third party\nworkplace report of on-the-job performance by the\ncandidate.\n6. Context for\n Assessment\n6.1 Assessment may be done in the workplace or in a\nsimulated workplace setting (assessment centers)\n6.2 Assessment activities are carried out through TESDA’s\naccredited assessment center\n\n--- PDF PAGE 75 ---\n________________________________________________________________________________________________________________________________ 73\n\nTR – Commercial Cooking NCIII Promulgated April 2007\n\nUNIT OF COMPETENCY:\nSELECT, PREPARE AND SERVE SPECIALTY\n\nCUISINES\n\nUNIT CODE\n :"
        },
        "source_text": "TRS512350\n\nUNIT DESCRIPTOR :\nThis unit deals with the skills and knowledge required to\nplan, prepare and present food items at an advanced\nand specialized level, using a variety of non-standard\nfood items and the related specialized techniques. It\ncovers the preparation and service of specialty cuisines\nas part of a general menu as well those offered by\nenterprises which specialize in particular menu items.\n\nELEMENT\n\nPERFORMANCE CRITERIA\nBold and italicized terms are elaborated in the Range of\nVariables\n1. Select specialized food items\n1.1 Suitable suppliers of specialized food items\nare sourced as required.\n1.2 Suppliers are selected taking into consideration\nthe quality and price of products and enterprise\nrequirements.\n1.3 Appropriate purchasing and storage\nprocedures are practiced to minimize wastage.\n2. Plan menus and/or\npromotional strategies\n2.1 Specialized menus and menu items are\nplanned to meet enterprise and customer\nrequirements and appropriate balance or\nintegration with other items is achieved.\n2,2 Menus or promotional strategies are\ndeveloped to incorporate or focus on\nspecialized food items.\n2.2 Menu items are priced to achieve satisfactory\nprofit levels and satisfy enterprise\nrequirements.\n2.3 Seasonal availability is taken into account\nwhen developing menus and promotional\nstrategies.\n2.4 New menu items or dishes are created using\nspecialized foods and taking into consideration\nthe characteristics of varieties of food items,\neating characteristics and taste.\n\n--- PDF PAGE 71 ---\n________________________________________________________________________________________________________________________________ 69\n\nTR – Commercial Cooking NCIII Promulgated April 2007\n\nELEMENT\n\nPERFORMANCE CRITERIA\nBold and italicized terms are elaborated in the Range of\nVariables\n3. Prepare and present (dishes\nusing) specialized food items\n3.1 Specialized food items are prepared ensuring\nappropriate\nflavor\ncombinations,\naesthetic\ncharacteristics and taste.\n3.2 Dishes are cooked in a variety of styles as\nrequired by the menu, enterprise, customer\npreferences.\n3.3 Food items are appropriately presented to\nmaximize appeal.\n3.4 Foods are preserved where appropriate, using\nsuitable techniques.\n4. Implement hygienic and safe\npractices\n4.1 Potential hygiene and safety problems are\nidentified\nand\nappropriate\npreventative\nmeasures are taken to eliminate risk in the\npreparation of specialized food items.\n4.2 Specialized food items are stored hygienically\nand correctly.\n\n--- PDF PAGE 72 ---\n________________________________________________________________________________________________________________________________ 70\n\nTR – Commercial Cooking NCIII Promulgated April 2007\n\nRANGE OF VARIABLES\n\nThis unit applies to all hospitality and catering enterprises where food is prepared\nand served such as restaurants, hotels, clubs, cafeterias and other catering\noperations. The following explanations identify how this may be applied in different\nworkplaces, sectors and circumstances.\n\nVARIABLE\n\nRANGE\n\n1. Specialized food items\nMay include but not limited to:\n1.1 Meats, poultry, and game other than lamb,\nbeef, pork and chicken.\n1.2 Offal and specialist meat products\n1.3 Unusual fish, shellfish and other foods from\nsea or fresh water.\n1.4 Aromatics, flavorings, spices and herbs.\n1.5 Seeds and nuts\n1.6 Fungi\n1.7 Preserves, condiments and accompaniments\n1.8 Commodities from ethnic cuisines and cultural\ntradition such as Mexican, Asian, Middle East\n1.9 Fruits, vegetables, flowers and salad items\n1.10 Aquatic plants such as seaweeds\n1.11 Specialist cheeses and dairy products\n1.12 Bush foods and native Philippine ingredients\n1.13 Specialist cakes, pastries, bread, desserts,\npreserves and sweets\n2. Promotional Strategies\nMay include but not limited to:\n 2.1 Menus\n2.2 “specials” lists\n2.3 blackboards\n2.4 fliers and pamphlets\n2.2 media releases\n3. Specialized preparation and\n cooking\nMay include but not limited to:\n3.1 Marinating, coating\n3.2 Tenderizing\n3.3 Hanging of meat, poultry and game\n3.4 Preserving: Drying, salting, pickling, smoking\n (hot and cold)\n3.5 Techniques such as cooking on salt, using\n special ovens and cooking utensils\n3.6 Earth oven cooking\n\n--- PDF PAGE 73 ---\n________________________________________________________________________________________________________________________________ 71\n\nTR – Commercial Cooking NCIII Promulgated April 2007\n\nVARIABLE\n\nRANGE\n\n4. Preventative measures\nMay include but not limited to:\n4.1 Identifying and discarding poisonous or non-\nedible parts of food items.\n4.2 Safe handling of food items with potential for\ninjury, such as spines and thorns\n4.3 Using particular cooking techniques to maximize\nquality and appeal\n4.4 Safe and hygienic operation of food preparation\nequipment.\n\n--- PDF PAGE 74 ---\n________________________________________________________________________________________________________________________________ 72\n\nTR – Commercial Cooking NCIII Promulgated April 2007\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\n\n Competency\nAssessment requires evidences that the candidate:\n1.1\nDemonstrated ability in selecting appropriate cooking\nmethods to specialized food products.\n1.2\nDemonstrated ability to plan specialized menu and\nmenu items.\n1.3\nDemonstrated skills in preparing and presenting\nspecialized food items.\n2. Underpinning\nKnowledge\n2.1\nMenu Planning\n2.2\nSpecialized food items\n2.3\nPurchasing\n2.4\nPreparing, cooking and storing specialized food items.\n2.5\nCulinary terms used to describe specialized items and\nequipment.\n2.6\nHistory and significance of specialized food items.\n3. Underpinning skills\n3.1\nAdvanced and/or specialized preparation and cooking\ntechniques.\n3.2\nPurchasing and storage of specialist food items.\n4. Resource\n Implications\nThe following resources MUST be provided:\n4.1\nDemonstration of skills within a suitably equipped food\npreparation area (i.e. environment suited to the item in\nquestion).\n4.2\nUse of a variety of specialized food items.\n4.3\nPreparation of specialized menu items within typical\nworkplace time constraints.\n5. Method of\n Assessment\nCompetency may be assessed through:\n5.1\nDirect observation of the candidate preparing\nspecialized food items.\n5.2\nCase studies to assess ability to suggest and prepare\nspecialized food in response to particular needs.\n5.3\nSampling of food items prepared by the candidate.\n5.4\nWritten or oral questions to test knowledge of\nspecialized food items.\n5.5\nReview of portfolios of evidence and third party\nworkplace report of on-the-job performance by the\ncandidate.\n6. Context for\n Assessment\n6.1 Assessment may be done in the workplace or in a\nsimulated workplace setting (assessment centers)\n6.2 Assessment activities are carried out through TESDA’s\naccredited assessment center\n\n--- PDF PAGE 75 ---\n________________________________________________________________________________________________________________________________ 73\n\nTR – Commercial Cooking NCIII Promulgated April 2007\n\nUNIT OF COMPETENCY:\nSELECT, PREPARE AND SERVE SPECIALTY\n\nCUISINES\n\nUNIT CODE\n :"
