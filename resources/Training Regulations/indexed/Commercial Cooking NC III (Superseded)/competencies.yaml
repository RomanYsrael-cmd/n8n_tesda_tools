        "evidence_guide": {
          "source_text": "1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Demonstrated knowledge and understanding of the\nfactors and issues which impact upon staff rostering\n1.2 Demonstrated familiarity with typical formats and the\nkey information to be included\n1.3 Demonstrated the ability to prepare staff rosters which\nmeet wage budgets and which provide a level of\nstaffing sufficient to ensure the delivery of high quality\ncustomer service.\n2. Underpinning\nknowledge\n2.1 The role of rosters and their importance in controlling\nstaff costs\n2.2 Factors to be considered when developing rosters\n2.3 Formats for the presentation of staff rosters and details\nto be included\n2.4 Knowledge on area of operation for which roster is\nbeing developed.\n3. Underpinning Skills\n3.1 Organize information\n3.2 Prepare staff rosters\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1 Project or work activities which allow the candidate to\nprepare rosters for a workplace and to evaluate their\ncost efficiency and operational effectiveness against\nnominated standards\n4.2 Preparation of more than one roster to meet the\nstaffing requirements of more than one operational\nsituation\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1.\nEvaluation of the staffing costs and service levels at\nan event for which the candidate has prepared\nrosters\n5.2.\nOral or written questions to assess knowledge of\nspecific factors which affect the design of rosters\n5.3.\nReview of portfolios of evidence and third party\nworkplace reports of on-the-job performance by the\ncandidate\n6. Context for\nAssessment\n6.1.\nCompetency may be assessed in the workplace or\nin simulated workplace environment\n6.2.\nAssessment shall be observed while tasks are\nbeing undertaken whether individually or in a group\n\n--- PDF PAGE 30 ---\n________________________________________________________________________________________________________________________________ 28\n\nTR – Commercial Cooking NCIII Promulgated April 2007\n\nUNIT OF COMPETENCY\n: CONTROL AND ORDER STOCK\n\nUNIT CODE\n :"
        },
        "source_text": "TRS5311206\n\n UNIT DESCRIPTOR : This unit covers the knowledge, skills, behavior and\nmotivations required to develop staff rosters. This role\nmay be carried out by operational supervisors and\nmanagers.\n\nELEMENT\nPERFORMANCE CRITERIA\nBold and italicized terms are elaborated in the\nRange of Variables\n1 Develop and implement\nstaff rosters\n1.1 Rosters are developed in accordance with\ncompany agreements and wage budgets.\n1.2 Operational efficiency and customer service levels\nare maximized while wage costs are minimized in\nroster development.\n1.3 Duties are combined where appropriate to ensure\neffective use of staff.\n1.4 The available skills base is utilized appropriately to\nroster the most effective mix of staff and to meet\ndifferent operational requirements.\n1.5 Rosters are presented in required formats to\nensure clarity of information in accordance with\ncompany standards.\n1.6 Rosters are communicated to appropriate\ncolleagues within designated timelines.\n2. Maintain staff records\n2.1 Time sheets and other documentation are\ncompleted accurately and within designated\ntimelines.\n2.2 Staff records are updated accurately and\nmaintained or stored in accordance with\nestablishment procedures.\n\n--- PDF PAGE 28 ---\n________________________________________________________________________________________________________________________________ 26\n\nTR – Commercial Cooking NCIII Promulgated April 2007\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Rosters\nMay be for but are not limited to:\n1.1 An individual department\n1.2 A whole establishment\n1.3 A specific project\n2. Company agreements\nMay be but are not limited to:\n2.1 Number of hours worked in a given shift\n2.2 Overall number of hours allocated to different\nstaff members\n2.3 Breaks between shifts\n2.4 Nature of duties allocated\n2.5 Use of permanent or casual staff\n\n--- PDF PAGE 29 ---\n________________________________________________________________________________________________________________________________ 27\n\nTR – Commercial Cooking NCIII Promulgated April 2007\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Demonstrated knowledge and understanding of the\nfactors and issues which impact upon staff rostering\n1.2 Demonstrated familiarity with typical formats and the\nkey information to be included\n1.3 Demonstrated the ability to prepare staff rosters which\nmeet wage budgets and which provide a level of\nstaffing sufficient to ensure the delivery of high quality\ncustomer service.\n2. Underpinning\nknowledge\n2.1 The role of rosters and their importance in controlling\nstaff costs\n2.2 Factors to be considered when developing rosters\n2.3 Formats for the presentation of staff rosters and details\nto be included\n2.4 Knowledge on area of operation for which roster is\nbeing developed.\n3. Underpinning Skills\n3.1 Organize information\n3.2 Prepare staff rosters\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1 Project or work activities which allow the candidate to\nprepare rosters for a workplace and to evaluate their\ncost efficiency and operational effectiveness against\nnominated standards\n4.2 Preparation of more than one roster to meet the\nstaffing requirements of more than one operational\nsituation\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1.\nEvaluation of the staffing costs and service levels at\nan event for which the candidate has prepared\nrosters\n5.2.\nOral or written questions to assess knowledge of\nspecific factors which affect the design of rosters\n5.3.\nReview of portfolios of evidence and third party\nworkplace reports of on-the-job performance by the\ncandidate\n6. Context for\nAssessment\n6.1.\nCompetency may be assessed in the workplace or\nin simulated workplace environment\n6.2.\nAssessment shall be observed while tasks are\nbeing undertaken whether individually or in a group\n\n--- PDF PAGE 30 ---\n________________________________________________________________________________________________________________________________ 28\n\nTR – Commercial Cooking NCIII Promulgated April 2007\n\nUNIT OF COMPETENCY\n: CONTROL AND ORDER STOCK\n\nUNIT CODE\n :"
