        },
        "source_text": "TRS512347\n\nUNIT DESCRIPTOR : This unit deals with the organizational process required to\norganize bulk-cooking operations. It covers those\noperations where food is provided to large numbers of\npeople and where food production systems are utilized\nrather than food being prepared in a la carte situation.\n\nELEMENT\n\nPERFORMANCE CRITERIA\nBold and italicized terms are elaborated in the Range of\nVariables\n1. Plan kitchen operations for\nbulk cooking\n1.1 Quantities are determined and accurately\ncalculated according to recipes and\nspecifications.\n1.2 Food items are ordered in correct quantities for\nrequirements.\n1.1 A mise en place list, which is clear, complete\nand appropriate to the situation, is prepared for\nfood equipment.\n1.4 A work schedule and workflow plan is designed\nfor the relevant section of kitchen to maximize\nteamwork and efficiency.\n2. Organize production of bulk\ncooking menus\n2.1 Operation and service of orders are organized\nfor the relevant section of the kitchen to enable\nsmooth workflow and to minimize delays.\n2.2 The sequence of dishes is controlled to enable\nsmooth workflow and minimize delays.\n2.3 Quality control is exercised in all stages of\npreparation with focus on design, eye appeal\nand portion size.\n2.4 Appropriate receiving, storing and cleaning\nprocedures are established and correctly\nfollowed.\n3. Select systems for bulk\ncooking\n3.1 Appropriate food production systems are\nselected for bulk cooking according to relevant\nfactors.\n3.2 Appropriate equipment is identified to assist\nproduction and cooking operations.\n\n--- PDF PAGE 56 ---\n________________________________________________________________________________________________________________________________ 54\n\nTR – Commercial Cooking NCIII Promulgated April 2007\n\nELEMENT\n\nPERFORMANCE CRITERIA\nBold and italicized terms are elaborated in the Range of\nVariables\n4. Use preparation and cooking\ntechniques appropriate to the\nbulk cooking system\n4.1 Menu items, which are compatible with the type\nof system chosen, are selected.\n4.2 Specialty recipes are prepared and served\ntaking into account the type of food service\nsystem.\n4.3 Food is prepared using methods which take into\naccount the effects of different methods of\npreparation on nutrition quality and structure.\n4.4 Systems and equipment are safely and\nhygienically used.\n\n--- PDF PAGE 57 ---\n________________________________________________________________________________________________________________________________ 55\n\nTR – Commercial Cooking NCIII Promulgated April 2007\n\n RANGE OF VARIABLES\n\nThis unit applies to all hospitality and catering enterprises where food is prepared\nand served such as restaurants, hotels, clubs, cafeterias and other catering\noperations. The following explanations identify how this may be applied in different\nworkplaces, sectors and circumstances.\n\nThe selection of food production systems refers to the selection of systems already\ninstalled in an enterprise.\n\nVARIABLE\n\nRANGE\n1. Food production system\nMay include but not limited to:\n1.1 Fresh cook\n1.2 Cook-chill to five day shelf life\n1.3 Cook-chill - extended life\n1.4 Cook-freeze\n2. Factors affecting selection of food\n production systems\nMay include but not limited to:\n2.1 Type of food to be prepared\n2.2 Quantity of food\n2.3 Timeframe\n2.4 Customer requirements\n2.5 Menu type\n2.6 Enterprise practices\n3. Appropriate equipment to assist\n cooking operations\nMay include but not limited to:\n3.1 Receiving\n3.2 Storage\n3.3 Preparation\n3.4 Cooking\n3.5 Post cooking storing\n3.6 Re-thermalization where applicable\n3.7 Serving\n4. Specialty recipes\nMay include but not limited to:\n4.1 recipes that are uniquely prepared by the\nestablishment\n4.2 food that is popular in the establishment\n\n--- PDF PAGE 58 ---\n________________________________________________________________________________________________________________________________ 56\n\nTR – Commercial Cooking NCIII Promulgated April 2007\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidences that the candidate:\n1.1 Demonstrated ability to produce bulk food and maintain\nquality outcomes.\n1.2 Demonstrated ability to prepare mise en place according to\nestablished standard procedures.\n1.3 Applied safe work practices in relation to manual handling\nuse of equipment and heated surfaces.\n1.4 Demonstrated skills in designing work schedules and\nworkflow plan to maximize teamwork and efficiency.\n1.5 Demonstrated ability to accurately calculate and determine\nquantities for bulk cooking.\n2. Underpinning\n Knowledge\n2.1 Theory\n2.1.1\nPrinciples of Nutrition\n2.1.2\nFood Safety\n2.1.3\nQuantity Food Production\n2.1.4\nFood Production Systems\n2.1.5\nPrinciples and practices of hygiene\n related to food production systems\n2.2 Equipment requirements for particular food\n production systems.\n2.3 Culinary terms commonly used in the\n industry related to food production systems.\n2.4 Relevant legislation concerning occupational health and\nfood safety.\n3. Underpinning Skills 3.1 Organizational skills and teamwork.\n3.2 Skills in safe work practices, in particular in relation to\nbending and lifting, using equipment, contact with steam\nand heated surfaces.\n3.3 Logical and time efficient workflow.\n3.4 Purchasing, receiving, storing, holding and issuing\nprocedures in relation to bulk cooking.\n3.5 Costing, yield testing, portion control in relation to bulk\ncooking.\n4. Resource\n\nImplications\nThe following resources MUST be provided:\n4.1 A fully-equipped operational commercial kitchen (including\nindustry-current equipment) including full coordination of\nmore than one bulk cooking operation.\n4.2 Use of real ingredients.\n\n--- PDF PAGE 59 ---\n________________________________________________________________________________________________________________________________ 57\n\nTR – Commercial Cooking NCIII Promulgated April 2007\n\n5. Method of\nAssessment\nCompetency may be assessed through:\n5.1 Evaluation of reports prepared by the candidate detailing\nthe processes used for an actual bulk cooking operation\nincluding key factors for success and lessons to be learned\nfor future operations.\n\n5.2 Direct observation of the candidate using bulk cooking\nequipment.\n5.3 Sampling of dishes prepared as part of a bulk cooking\noperation.\n5.4 Oral or written questions to assess knowledge of\ncommodities, techniques and features of bulk cooking\noperations to maintain quality, storage, food hygiene.\n5.5 Case studies to assess ability to create procedures and\nsystems to different bulk cooking situations.\n5.6 Review of portfolios of evidence and third party workplace\nreports of on-the-job performance by the candidate.\n6. Context for\nAssessment\n6.1 Assessment may be done in the workplace or in a\nsimulated workplace setting (assessment centers)\n6.2 Assessment activities are carried out through TESDA’s\naccredited assessment center\n\n--- PDF PAGE 60 ---\n________________________________________________________________________________________________________________________________ 58\n\nTR – Commercial Cooking NCIII Promulgated April 2007\n\nUNIT OF COMPETENCY: PREPARE PATES AND TERRINES\n\nUNIT CODE\n :"
