        "evidence_guide": {
          "source_text": "1. Critical aspects of\n Competency\nAssessment requires evidence that the candidate:\n1.1 Demonstrated sufficient knowledge of the factors\ninfluencing negotiation to achieve agreed outcome\n1.2 Participated in negotiation with at least one person to\nachieve an agreed outcome\n2. Underpinning\nknowledge and\nAttitude\n2.1 Codes of practice and guidelines for the organization\n2.2 Organizations policy and procedures for negotiations\n2.3 Decision making and conflict resolution strategies\nprocedures\n2.4 Problem solving strategies on how to deal with\nunexpected questions and attitudes during negotiation\n2.5 Flexibility\n2.6 Empathy\n3. Underpinning\nskills\n3.1 Interpersonal skills to develop rapport with other parties\n3.2 Communication skills (verbal and listening)\n3.3 Observation skills\n3.1 Negotiation skills\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Room with facilities necessary for the negotiation\nprocess\n4.2 Human resources (negotiators)\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1 Observation/demonstration and questioning\n5.2 Portfolio assessment\n5.3 Oral and written questioning\n5.4 Third party report\n6. Context of\nassessment\n6.1 Competency to be assessed in real work environment or\nin a simulated workplace setting.\n\n--- PDF PAGE 17 ---\n________________________________________________________________________________________________________________________________ 15\n\nTR – Commercial Cooking NCIII Promulgated April 2007\n\nUNIT OF COMPETENCY :\nSOLVE PROBLEMS RELATED TO WORK\nACTIVITIES\nUNIT CODE\n:"
        },
        "source_text": "500311111\n\nUNIT DESCRIPTOR : This unit covers the skills, knowledge and attitudes\nrequired to collect information in order to negotiate to a\ndesired outcome and participate in the negotiation.\n\nELEMENT\nPERFORMANCE CRITERIA\nBold and italicized terms are elaborated in the\nRange of Variables\n1. Plan negotiations\n1.1 Information on preparing for negotiation is\nidentified and included in the plan\n1.2 Information on active listening is identified and\nincluded in the plan\n1.3 Information on different questioning techniques is\nidentified and included in the plan\n1.4 Information is checked to ensure it is correct and up-\nto- date\n2. Participate in\nnegotiations\n2.1 Criteria for successful outcome are agreed upon by all\nparties\n2.2 Desired outcome of all parties are considered\n2.3 Appropriate language is used throughout the\nnegotiation\n2.4 A variety of questioning techniques are used\n2.5 The issues and processes are documented and\nagreed upon by all parties\n2.6 Possible solutions are discussed and their viability\nassessed\n2.7 Areas for agreement are confirmed and recorded\n2.8 Follow-up action is agreed upon by all parties\n\n--- PDF PAGE 14 ---\n________________________________________________________________________________________________________________________________ 12\n\nTR – Commercial Cooking NCIII Promulgated April 2007\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Preparing for\nnegotiation\nMay include but not limited to:\n1.1 Background information on other parties to the\nnegotiation\n1.2 Good understanding of topic to be negotiated\n1.3 Clear understanding of desired outcome/s\n1.4 Personal attributes\n1.4.1 self awareness\n1.4.2 self esteem\n1.4.3 objectivity\n1.4.4 empathy\n1.4.5 respect for others\n1.5 Interpersonal skills\n1.5.1 listening/reflecting\n1.5.2 non verbal communication\n1.5.3 assertiveness\n1.5.4 behavior labeling\n1.5.5 testing understanding\n1.5.6 seeking information\n1.5.7 self disclosing\n1.6 Analytic skills\n1.6.1 observing differences between content\nand process\n1.6.2 identifying bargaining information\n1.6.3 applying strategies to manage process\n1.6.4 applying steps in negotiating process\n1.6.5 strategies to manage conflict\n1.6.6 steps in negotiating process\n1.6.7 options within organization and\nexternally for resolving conflict\n2. Non verbal\nenvironments\nMay include but not limited to:\n2.1 Friendly reception\n2.2 Warm and welcoming room\n2.3 Refreshments offered\n2.4 Lead in conversation before negotiation begins\n\n--- PDF PAGE 15 ---\n________________________________________________________________________________________________________________________________ 13\n\nTR – Commercial Cooking NCIII Promulgated April 2007\n\nVARIABLE\nRANGE\n3. Active listening\nMay include but not limited to:\n3.1 Attentive\n3.2 Don’t interrupt\n3.3 Good posture\n3.4 Maintain eye contact\n3.5 Reflective listening\n4. Questioning\ntechniques\nMay include but not limited to:\n4.1 Direct\n4.2 Indirect\n4.3 Open-ended\n\n--- PDF PAGE 16 ---\n________________________________________________________________________________________________________________________________ 14\n\nTR – Commercial Cooking NCIII Promulgated April 2007\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\n Competency\nAssessment requires evidence that the candidate:\n1.1 Demonstrated sufficient knowledge of the factors\ninfluencing negotiation to achieve agreed outcome\n1.2 Participated in negotiation with at least one person to\nachieve an agreed outcome\n2. Underpinning\nknowledge and\nAttitude\n2.1 Codes of practice and guidelines for the organization\n2.2 Organizations policy and procedures for negotiations\n2.3 Decision making and conflict resolution strategies\nprocedures\n2.4 Problem solving strategies on how to deal with\nunexpected questions and attitudes during negotiation\n2.5 Flexibility\n2.6 Empathy\n3. Underpinning\nskills\n3.1 Interpersonal skills to develop rapport with other parties\n3.2 Communication skills (verbal and listening)\n3.3 Observation skills\n3.1 Negotiation skills\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Room with facilities necessary for the negotiation\nprocess\n4.2 Human resources (negotiators)\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1 Observation/demonstration and questioning\n5.2 Portfolio assessment\n5.3 Oral and written questioning\n5.4 Third party report\n6. Context of\nassessment\n6.1 Competency to be assessed in real work environment or\nin a simulated workplace setting.\n\n--- PDF PAGE 17 ---\n________________________________________________________________________________________________________________________________ 15\n\nTR – Commercial Cooking NCIII Promulgated April 2007\n\nUNIT OF COMPETENCY :\nSOLVE PROBLEMS RELATED TO WORK\nACTIVITIES\nUNIT CODE\n:"
