        "source_text": "TRS512348\n\nUNIT DESCRIPTOR : This unit deals with the specialist skills and knowledge,\nskills, behavior and motivations required to prepare\npates and terrines.\n\nELEMENT\n\nPERFORMANCE CRITERIA\nBold and italicized terms are elaborated in the Range of\nVariables\n1. Prepare pates and terrines\n1.1 A range of pates and terrines are prepared\naccording to standard recipes.\n1.2 Appropriate ingredients are selected for\nproduction of pates and terrines.\n1.3 Lining of moulds for pates and terrines are\nprepared using suitable ingredients.\n1.4 A range of binding agents and processes are\nused in the preparation of basic forcemeat.\n1.6 A range of pastries suitable for pate en croute\nare prepared and correctly handled to ensure\nhigh quality and attractive presentation.\n1.7 Specialized equipment and machinery for\nmaking pates and terrines are correctly and\nsafely operated according to manufacturer’s\ninstructions.\n2. Present pates and terrines\n2.1 Pates and terrines are attractively presented for\nvarious uses including, but not limited to\nappetizers, entrees or buffets.\n2.1 Pates and terrines are appropriately decorated\ngiving consideration to contemporary tastes,\ncolor presentation and eye appeal.\n3. Develop new recipes\n3.1 Recipes for pates and terrines are developed\nusing a range of suitable products giving\nconsideration to tastes and presentation.\n3.2 New recipes for pates and terrines are tested for\ntaste, yield and customer acceptance.\n\n--- PDF PAGE 61 ---\n________________________________________________________________________________________________________________________________ 59\n\nTR – Commercial Cooking NCIII Promulgated April 2007\n\nRANGE OF VARIABLES\n\nThis unit applies to all hospitality and catering enterprises where food is prepared\nand served such as restaurants, hotels, clubs, cafeterias and other catering\noperations. The following explanations identify how this may be applied in different\nworkplaces, sectors and circumstances\n\nPates and terrines refer to any edible food that has been ground or pureed to a paste\nand set and/or baked in a container or mould. They can be made from a range of\ningredients including meats, poultry, game, seafood, fruits and vegetables. Terrines\nare generally of a coarser consistency than pates and are baked in a pot (a terrine)\nafter which they are named. Pates en croute are pates or terrines that have been\nbaked in a pastry casing.\n\nA variety of pates and terrines must be made. They can either be classical or\nmodern, and varying in ethnic and cultural origins. A variety of new recipes for pates\nand terrines must also be produced.\n\nVARIABLE\n\nRANGE\n1. Pates and terrines\n\nMay include but not limited to spreadable pastes\nmade from\n1.1\nmeat\n1.2\nvegetables\n1.3\nfish\n1.4 fruits\n2. Appropriate ingredients for\nmaking pates, pâtés en croute\nand terrines\nMay include but not limited to:\n2.1 Dairy foods\n2.2 Vegetables\n2.3 Offal, livers\n2.4 Poultry\n2.5 Game\n2.6 Veal, ham and port\n2.7 Fish and shellfish\n2.8 Filipino native game,\n2.9\nFruits and fruit products\n3. Appropriate ingredients for lining\nmoulds\nMay include but not limited to:\n3.1 Pork fat\n3.2 Pork caul\n3.3 Vegetables\n3.4 Pastry\n3.5\nSkins\n\n--- PDF PAGE 62 ---\n________________________________________________________________________________________________________________________________ 60\n\nTR – Commercial Cooking NCIII Promulgated April 2007\n\n4. Basic forcemeat\nMay include but not limited to:\n4.1 stuffing\n4.2 mixtures of raw or cooked ingredients, choppe\nor minced or ground, used to stuff eggs, fish,\npoultry, game, meat vegetables or pasta.\n4.3 three main types of forcemeat are\n• those made with meat, game or poultry\n• those made with fish,\n•\nthose made with vegetables.\n5. Equipment for making pates and\nterrines\nMay include but not limited to:\n5.1 Bowl cutters or food processors\n5.2 Food mills and blenders\n5.3 Mincers\n\n--- PDF PAGE 63 ---\n________________________________________________________________________________________________________________________________ 61\n\nTR – Commercial Cooking NCIII Promulgated April 2007\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidences that the candidate:\n1.1 Explained and described in detail the different products\ncommodities suitable for pates and terrines.\n1.2 Demonstrated expertise in preparing pates and terrines\nto meet enterprise standards.\n1.3 Demonstrated skills in presenting pates and terrines\nprofessionally.\n1.4 Demonstrated ability in developing new recipes for pates\nand terrines.\n1.5 Applied safe and hygienic practices in handling and\nstoring of pates and terrines.\n2. Underpinning\nKnowledge\n2.1 Ingredients suitable for making pates and terrines and\ntheir characteristics.\n2.2 Outcomes of the various binding agents and processes\nused in the preparation of pates and terrines.\n2.3 Culinary terms related to pates and terrines commonly\nused in the industry.\n2.4 Principles of nutrition, in particular, the food values of\npates and terrines and the effects of cooking on the\nnutritional value of food.\n3. Underpinning skills\n3.1 Presentation of skills for pates and terrines including\npastry decoration, glazing, layering of ingredients,\nprecision cutting and arranging.\n3.2 Safe work practices, in particular in relation to using\nchopping and mincing equipment.\n3.3 Hygiene requirements particularly relating to possible\nbacterial spoilage in the preparation, storage and service\nof pate and terrine products.\n3.4 Logical and time efficient workflow.\n4. Resource\n\nImplications\nThe following resources MUST be provided:\n4.1 Demonstration of skills in making multiple types of pates\nand terrines within a fully equipped operational\ncommercial kitchen (including industry-current\nequipment)\n4.2 Use of a range of real ingredients suitable for making\npates and terrines.\n4.3 Preparation of pates and terrines within commercially\nrealistic time constraints.\n\n--- PDF PAGE 64 ---\n________________________________________________________________________________________________________________________________ 62\n\nTR – Commercial Cooking NCIII Promulgated April 2007\n\n5. Method of\n Assessment\nCompetency may be assessed through:\n5.1 Direct observation of the candidate using techniques to\nprepare pates and terrines.\n5.2 Sampling of pates and terrines, cookery techniques,\nequipment and food hygiene.\n5.3 Review of portfolios of evidence and third party\nworkplace reports of on-the-job performance by the\ncandidate.\n5. Context for\n Assessment\n6.1 Assessment may be done in the workplace or in\n simulated workplace setting (assessment centers)\n6.2 Assessment activities are carried out through TESDA’s\n accredited assessment center\n\n--- PDF PAGE 65 ---\n________________________________________________________________________________________________________________________________ 63\n\nTR – Commercial Cooking NCIII Promulgated April 2007\n\nUNIT OF COMPETENCY: PLAN, PREPARE AND DISPLAY BUFFET\n\nUNIT CODE\n :"
