        "evidence_guide": {
          "source_text": "1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Demonstrated the ability to conduct successfully\nbusiness negotiations\n1.2 Demonstrated the ability to build and maintain\nrelationships o achieve successful business outcomes\n1.3 Demonstrated the knowledge and understanding of the\ncurrent environment and major industry issues in which\ntourism and/or hospitality businesses operate.\n 2. Underpinning\nKnowledge\n2.1 Business environment including major industry issues in\nwhich the tourism and hospitality industry operates.\n2.2 Legal issues that affect negotiations and contracts\n2.3 General knowledge about contracts.\n3. Underpinning\nSkills\n3.1 Negotiation and communication techniques appropriate\nto negotiations.\n3.2 Interpersonal skills\n3.3 Mathematical skills i.e. calculating profit margins for the\ncontract\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1. Project or work activities conducted over a period of time\nso that all aspects of the unit can be assessed.\n4.2. Relationship-building and negotiation activities with a\nrange of individuals with whom the candidate has an\nactual or potential business relationship.\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1. Evaluation of negotiation and business relationships or\nagreements conducted or made by the candidate\n5.2. Evaluation of reports prepared by the candidate detailing\nhow the negotiation aspects of a project were managed.\n5.3. Case studies to assess application of knowledge to\nbusiness situations.\n6. Context for\nAssessment\n6.1. Competency assessment may occur in workplace or any\nappropriately simulated environment\n6.2. Assessment shall be observed on multiple occasions\ninvolving a combination of direct, indirect and\nsupplementary forms of evidence.\n\n--- PDF PAGE 44 ---\n________________________________________________________________________________________________________________________________ 42\n\nTR – Commercial Cooking NCIII Promulgated April 2007\n\nCORE COMPETENCIES\n\nUNIT OF COMPETENCY:\nPLAN AND PREPARE FOOD FOR ALA CARTE &\nBUFFETS\n\nUNIT CODE\n :"
        },
        "source_text": "TRS311209\n\nUNIT DESCRIPTOR : This unit deals with the skills and knowledge required\nto manage business relationships with customers or\nsuppliers within a tourism or hospitality context. It\nfocuses on the relationship building and negotiation\nskills.\n\nELEMENT\nPERFORMANCE CRITERIA\nBold and italicized terms are elaborated in the\nRange of Variables\n1. Establish and conduct\nbusiness relationships\n1.1 Relationships are established within the\nappropriate cultural context in a manner that\npromotes goodwill and trust between the\nenterprise, its customers and suppliers.\n1.2 Trust and respect are built in business\nrelationships through use of effective\ncommunication skills and techniques\n1.3 Opportunities to maintain regular contact with\ncustomers and suppliers are identified and taken\nup.\n2. Conduct negotiations\n2.1 Negotiations are conducted in a business-like\nand professional manner within the relevant\ncultural context.\n2.2 Negotiations are conducted in the context of the\ncurrent enterprise marketing focus.\n2.3 Benefits for all parties in the negotiation are\nmaximized through use of established techniques\nand in the context of establishing long term\nrelationships.\n2.4 Feedback and input from colleagues are\nincorporated into the negotiation.\n2.5 The results of negotiations are communicated to\nappropriate colleagues and stakeholders within\nthe appropriate timeframes.\n\n--- PDF PAGE 41 ---\n________________________________________________________________________________________________________________________________ 39\n\nTR – Commercial Cooking NCIII Promulgated April 2007\n\n3. Make formal business\nagreements\n3.1 Agreements are confirmed in writing using formal\ncontracts and in accordance to enterprise\nrequirements.\n3.2 Appropriate approvals for all aspects of formal\nagreements are checked and obtained in\naccordance with enterprise procedures.\n3.3 The need for specialist advice in the development\nof contracts is identified and sought where\nappropriate.\n4.Foster and maintain\nbusiness relationships\n4.1 Information needed to maintain sound business\nrelationships are pro-actively sought, reviewed and\nacted upon.\n4.2 Agreements are honored within the scope of\nindividual responsibility.\n4.3 Adjustments to agreements are made in\nconsultation with the customer/supplier and\ninformation are shared with appropriate colleagues.\n4.4 Relationships are nurtured through regular contact.\n\n--- PDF PAGE 42 ---\n________________________________________________________________________________________________________________________________ 40\n\nTR – Commercial Cooking NCIII Promulgated April 2007\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Business relationships\nMay include but not limited to:\n1.1 Customers\n1.2 Suppliers\n1.3 Government agencies\n1.4 Concessionaires\n2. Opportunities\nMay include but not limited to:\n2.1 Informal social occasions\n2.2 Industry functions\n2.3 Association membership\n2.4 Co-operative promotions\n2.5 Program of regular telephone contact\n3. Negotiations\nMay include but not limited to:\n3.1 Corporate accounts\n3.2 Service contacts\n3.3 Agency agreements\n3.4 Venue contracts\n3.5 Rate negotiations\n3.6 Marketing agreements\n3.7 Preferred product agreements\n4. Techniques\n4.1. May include but not limited to:\n4.2. Identification of goals, limits\n4.3. Clarification of needs of all parties\n4.4. Identifying points of agreement and points of\ndifference\n4.5. Preparatory research of facts\n4.6. Active listening and questioning\n4.7. Non-verbal communication techniques\n4.8. Appropriate language\n4.9. Bargaining\n4.10. Developing options\n4.11. Confirming agreements\n4.12. Appropriate cultural behavior\n\n--- PDF PAGE 43 ---\n________________________________________________________________________________________________________________________________ 41\n\nTR – Commercial Cooking NCIII Promulgated April 2007\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Demonstrated the ability to conduct successfully\nbusiness negotiations\n1.2 Demonstrated the ability to build and maintain\nrelationships o achieve successful business outcomes\n1.3 Demonstrated the knowledge and understanding of the\ncurrent environment and major industry issues in which\ntourism and/or hospitality businesses operate.\n 2. Underpinning\nKnowledge\n2.1 Business environment including major industry issues in\nwhich the tourism and hospitality industry operates.\n2.2 Legal issues that affect negotiations and contracts\n2.3 General knowledge about contracts.\n3. Underpinning\nSkills\n3.1 Negotiation and communication techniques appropriate\nto negotiations.\n3.2 Interpersonal skills\n3.3 Mathematical skills i.e. calculating profit margins for the\ncontract\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1. Project or work activities conducted over a period of time\nso that all aspects of the unit can be assessed.\n4.2. Relationship-building and negotiation activities with a\nrange of individuals with whom the candidate has an\nactual or potential business relationship.\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1. Evaluation of negotiation and business relationships or\nagreements conducted or made by the candidate\n5.2. Evaluation of reports prepared by the candidate detailing\nhow the negotiation aspects of a project were managed.\n5.3. Case studies to assess application of knowledge to\nbusiness situations.\n6. Context for\nAssessment\n6.1. Competency assessment may occur in workplace or any\nappropriately simulated environment\n6.2. Assessment shall be observed on multiple occasions\ninvolving a combination of direct, indirect and\nsupplementary forms of evidence.\n\n--- PDF PAGE 44 ---\n________________________________________________________________________________________________________________________________ 42\n\nTR – Commercial Cooking NCIII Promulgated April 2007\n\nCORE COMPETENCIES\n\nUNIT OF COMPETENCY:\nPLAN AND PREPARE FOOD FOR ALA CARTE &\nBUFFETS\n\nUNIT CODE\n :"
