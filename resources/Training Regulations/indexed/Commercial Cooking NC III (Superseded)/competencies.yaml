        "source_text": "TRS512353\n\nUNIT DESCRIPTOR : This unit deals with the knowledge and skills required to\nensure that high standards of food quality are\nestablished and maintained in a commercial kitchen\nenvironment. These tasks are generally undertaken by\na qualified cook or chef who also has some supervisory\nresponsibilities.\n\nELEMENT\n\nPERFORMANCE CRITERIA\nBold and italicized terms are elaborated in the Range of\nVariables\n1. Establish and implement\nprocedures for quality\ncontrol\n1.1 Appropriate procedures are applied to ensure\nthe quality of menu items with regard to:\n Raw materials\n Cooking processes\n Portion control\n Presentation\n1.2 Products and services are ensured consistent\nwith enterprise requirements.\n1.3 Food items are ensured to match menu\ndescriptions.\n2. Monitor and solve quality\n related problems\n2.1 Procedures are applied to monitor quality\nincluding:\n Observation\n Formal audits and reviews\n Tasting\n Seeking feedback\n2.2 Problems related to quality control of food are\nidentified and solved according to established\nstandard operating procedures.\n.\n\n--- PDF PAGE 85 ---\n________________________________________________________________________________________________________________________________ 83\n\nTR – Commercial Cooking NCIII Promulgated April 2007\n\nRANGE OF VARIABLES\n\nThis unit applies to all hospitality and catering enterprises where food is prepared\nand served such as restaurants, hotels, clubs, cafeterias and other catering\noperations. The following explanations identify how this may be applied in different\nworkplaces, sectors and circumstances.\n\nQuality procedures may be manual or computer-based.\n\nQuality data may be collected over different time-frames, according to enterprise\nrequirements and practice.\n\nVARIABLE\n\nRANGE\n1. Quality procedures\nMay include but not limited to:\n1.1 Formal audits against enterprise quality\nstandards and requirements.\n1.2 Feedback from colleagues and customers\n1.3 Reviews of costs and revenues\n2. Types of quality procedures\nMay include but not limited to:\n2.1 Manual\n2.2\nComputer-based\n3. Quality data\n3.1 Enterprise requirements\n3.2 practice\n\n--- PDF PAGE 86 ---\n________________________________________________________________________________________________________________________________ 84\n\nTR – Commercial Cooking NCIII Promulgated April 2007\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidences that the candidate:\n1.1\nDemonstrated ability to establish, implement and\nmaintain quality control systems in a commercial kitchen.\n1.2\nDemonstrated knowledge of quality systems and options\nsuitable for a commercial cookery or catering enterprise.\n2. Underpinning\nKnowledge\n2.1\nThe role of quality control in the kitchen and its link to\noverall business performance and profitability.\n2.2\nFeatures and benefits of different quality control\nmechanisms used in commercial kitchens.\n2.3\nKey areas for monitoring quality.\n3. Underpinning skills 3.1 Quality control systems\n3.1.1\nISO 9001\n3.1.2"
