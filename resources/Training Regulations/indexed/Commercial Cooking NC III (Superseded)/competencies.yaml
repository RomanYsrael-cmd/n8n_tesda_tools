        "source_text": "TRS512346\n\nUNIT DESCRIPTOR : This unit deals with the basic planning, preparing and\ncontrolling of menu-based catering within established\nenterprise systems.\n\nELEMENT\n\nPERFORMANCE CRITERIA\nBold and italicized terms are elaborated in the\nRange of Variables\n1. Plan and prepare menus\n1.1 Enterprise and/or customer requirements are\nidentified for menus.\n1.2 Menu items are determined according to the\ndifferent menu planning considerations.\n1.3 Costs of menu items are established and\ncompliance is ensured with enterprise costing\nconstraints.\n1.4 Menus are prepared as required by the\nenterprise, type of cuisine or particular situation\n1.5 Menus are organized and written using:\n Terminology appropriate to the market and\nstyle of menu.\nItem descriptions which promote menu items.\n2. Control menu-based catering\n2.1 Appropriate catering control systems are\nselected and used according to enterprise\nrequirements.\n2.2 Production schedules are planned giving\nconsideration to menu constraints, available\nequipment, expertise of labor and available time.\n2.3 Labor costs are controlled considering the\nroster, scheduling, award conditions and rates.\n2.4 Product utilization and quality is optimized\nthrough the application of portion control and\neffective yield testing.\n2.5 Stock control measures are applied by following\ncorrect receiving and storing procedures\n2.6 Security procedures in food production and\nstorage areas are applied to minimize risks of\ntheft, damage or loss.\n\n--- PDF PAGE 50 ---\n________________________________________________________________________________________________________________________________ 48\n\nTR – Commercial Cooking NCIII Promulgated April 2007\n\nELEMENT\n\nPERFORMANCE CRITERIA\nBold and italicized terms are elaborated in the\nRange of Variables\n3. Practice portion control\n3.1\n Correct portioning activities are identified\nthrough\n• Weight\n• Volume\n• Count\n3.2\nCorrect tools portioning are calculated and\nused.\n\n--- PDF PAGE 51 ---\n________________________________________________________________________________________________________________________________ 49\n\nTR – Commercial Cooking NCIII Promulgated April 2007\n\nRANGE OF VARIABLES\n\nThis unit applies to all hospitality and catering enterprises where food is prepared\nand served such as restaurants, hotels, clubs, cafeterias and other catering\noperations.\n\nVARIABLE\n\nRANGE\n1. Types of menus\nMay include but not limited to:\n1.1 Menus may be classified according to how\nfood items are offered and priced:\n• Table d’hote (Selective or Non-Selective)\n• A la carte\n1.2 Menus may be classified according to how\n often they are changed\n• Cyclical\n• Fixed menu\n• Day’s menu\n1.3 Menus may be based on meal types\n• Breakfast\n• Lunch\n• Dinner\n• Snack\n1.4 Menus may be utilized for\n• Function\n• Buffet\n• Ala carte\n1.5 Types of menus\n• Classical\n• Modern\n• Ethnic\n2. Menu planning concerns\nMay include but not limited to:\n2.1 Balance in the variety of cooking method,\n colors, tastes and food textures\n2.2 Nutritional values\n2.3 Seasonal availability\n2.4 pricing versus cost\n2.5 popularity index\n2.6 Results of sales analysis and customer\n feedback.\n\n--- PDF PAGE 52 ---\n________________________________________________________________________________________________________________________________ 50\n\nTR – Commercial Cooking NCIII Promulgated April 2007\n\n3. Catering control systems\nMay include but not limited to:\n3.1 Production planning sheets\n3.2 Sales analysis forms\n3.3 Daily kitchen reports\n3.4 Wastage sheets\n4. Costing restraints\nMay include but not limited to:\n4.1 Enterprise policy on menu pricing and gross\nmargins. Budgets\n4.2 Labor requirements\n\n--- PDF PAGE 53 ---\n________________________________________________________________________________________________________________________________ 51\n\nTR – Commercial Cooking NCIII Promulgated April 2007\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\n Competency\nAssessment requires evidences that the candidate:\n1.1 Demonstrated proficiency in costing and pricing menus.\n1.2 Demonstrated ability to plan multiple menus to meet\ndiffering customer and operational needs.\n1.3 Demonstrated expertise in planning menus given the\nconstraints on the resources available.\n1.4 Demonstrated ability to control costs.\n1.5 Demonstrated adeptness in analyzing and applying current\nindustry data and prices\n 2. Underpinning\nKnowledge\n2.1 Menu Planning procedures\n2.2 Different types and styles of menus\n2.3 Historical development of menus, modern trends in menus\n2.4 Quantity Food Production and Cost Control\n2.5 Principles of nutrition\n Dietary Guidelines for Australians\n Planning nutritionally-balanced menus\n The effects of cooking on the nutritional value of food\n2.6 Culinary terms related to menus commonly used in the\nindustry.\n 2.7 Recipe/Menu Costing\n 3. Underpinning Skills 3.1 Various ways of sequencing food items, including classical\nand contemporary.\n3.2 Organizational skills and teamwork.\n3.3 Logical and time efficient workflow.\n3.4 Inventory and stock control systems.\n3.5 Purchasing, receiving, storing, holding and issuing\nprocedures.\n3.6 Costing, yield testing and portion control.\n4. Resource\n Implications\nThe following resources MUST be provided:\n4.1 Fully equipped kitchen\n4.1 Ingredients appropriate for production\n4.2 Recipe costs worksheets\n4.3 Work schedules\n4.4 Banquet event forms inventory\n5. Method of\nAssessment\nCompetency may be assessed through:\n5.1 Review of samples of menus, production schedules,\nsecurity plans and checklists prepared by the candidate.\n5.2 Oral or written questions to assess knowledge of menu\nitems, menu types and characteristics, portion control and\ncost control.\n5.3 Review of portfolios of evidence and third party workplace\nreports of on-the-job performance by the candidate.\n\n--- PDF PAGE 54 ---\n________________________________________________________________________________________________________________________________ 52\n\nTR – Commercial Cooking NCIII Promulgated April 2007\n\n6. Context for\nAssessment\n6.1 Assessment may be done in the workplace or in a\nsimulated workplace setting (assessment centers)\n6.2 Assessment activities are carried out through TESDA’s\naccredited assessment center\n\n--- PDF PAGE 55 ---\n________________________________________________________________________________________________________________________________ 53\n\nTR – Commercial Cooking NCIII Promulgated April 2007\n\nUNIT OF COMPETENCY: ORGANIZE BULK COOKING OPERATIONS\n\nUNIT CODE\n :"
