          "source_text": "1. Critical aspects of\nCompetency\nAssessment requires evidences that the candidate:\n1.1\nDemonstrated ability to establish, implement and\nmaintain quality control systems in a commercial kitchen.\n1.2\nDemonstrated knowledge of quality systems and options\nsuitable for a commercial cookery or catering enterprise.\n2. Underpinning\nKnowledge\n2.1\nThe role of quality control in the kitchen and its link to\noverall business performance and profitability.\n2.2\nFeatures and benefits of different quality control\nmechanisms used in commercial kitchens.\n2.3\nKey areas for monitoring quality.\n3. Underpinning skills 3.1 Quality control systems\n3.1.1\nISO 9001\n3.1.2"
