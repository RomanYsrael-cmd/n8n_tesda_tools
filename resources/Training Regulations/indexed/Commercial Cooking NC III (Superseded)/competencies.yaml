        "evidence_guide": {
          "source_text": "1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1. Demonstrated the ability to identify specific training\nneeds and required competency outcomes.\n1.2. Demonstrated the ability to outline the training approach\nand steps to be followed.\n1.3. Demonstrated the ability to identify training participant(s)\nand delivery method(s) to be used\n1.4. Demonstrated the ability to organize and conduct the\ntraining.\n 2. Underpinning\nKnowledge\n2.1. Identification of evidence of competency\n2.2. Competency in the units being taught\n2.3.Training delivery methods\n3. Underpinning\nSkills\n3.1. Planning and documenting training approaches\n3.2. Training delivery methods\n3.3. Training strategies and techniques which facilitate\nlearning process\n3.4. Correct use of equipment and presentation skills\nappropriate for the training\n3.5. Communication skills (written and oral)\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1. Project or work activities that allow the candidate to\ndemonstrate planning, conducting and review of training\non a one-to-one or small group basis.\n4.2. Access to records, logbooks, reports and other sources\nof information about the operation and/or the personnel.\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1 Direct observation of performance in the conduct of the\ntraining\n5.2 Evaluation of the training plans and documents prepared\nby the candidate\n5.3 Oral or written questions to assess knowledge in training\nneeds analysis\n6. Context for\nAssessment\n6.1 Competency assessment may occur in workplace or any\nappropriately simulated environment\n6.2 Assessment shall be observed on multiple occasions\ninvolving a combination of direct, indirect and\nsupplementary forms of evidence.\n\n--- PDF PAGE 40 ---\n________________________________________________________________________________________________________________________________ 38\n\nTR – Commercial Cooking NCIII Promulgated April 2007\n\nUNIT OF COMPETENCY\n: ESTABLISH AND CONDUCT BUSINESS\nRELATIONSHIPS\n\nUNIT CODE\n :"
        },
        "source_text": "TRS311208\n\nUNIT DESCRIPTOR : This unit covers the requirements for planning,\ndelivering and reviewing training provided for the\npurposes of developing competency on a one-to-one\nor small group basis.\n\nELEMENT\nPERFORMANCE CRITERIA\nBold and italicized terms are elaborated in the\nRange of Variables\n1. Prepare for trainings\n1.1 Specific training needs are identified and\n confirmed through consultation with appropriate\n personnel.\n1.2 Training objectives are matched to identify\ncompetency development needs.\n1.3 Training\napproaches\nare\nplanned\nand\ndocumented.\n2. Deliver training\n1.1 Training is conducted in a safe and accessible\nenvironment.\n1.2 Training delivery methods appropriate to the\nparticipant(s) needs, trainer availability, location\nand resources are selected.\n1.3 Strategies and techniques which facilitate the\nlearning process are employed.\n1.4 Training objectives, sequence of activities and\nassessment processes are discussed with training\nparticipant(s).\n1.5 Systematic approach to training is undertaken to\nmeet specific needs of training participant(s).\n3. Provide opportunities for\npractice\n1.1 Practice opportunities are provided to ensure that\nthe participants achieve the components of\ncompetency.\n1.2 Variety of methods for encouraging learning is\nimplemented to meet the individual needs of\nparticipants.\n\n--- PDF PAGE 36 ---\n________________________________________________________________________________________________________________________________ 34\n\nTR – Commercial Cooking NCIII Promulgated April 2007\n\n4. Review training\n1.1 Participants are encouraged to self evaluate\nperformance and areas for improvement are\nidentified.\n1.2 Participants”\nreadiness\nfor\nassessment\nis\nmonitored and assistance is provided with the\ncollection\nof\nevidence\nfor\nsatisfactory\nperformance.\n1.3 Training is evaluated against objectives in the\ncontext of self-assessment, participant feedback,\nsupervisor comments and measurements.\n1.4 Training details are recorded according to\nenterprise and legislative requirements.\n1.5 Results of evaluation are utilized to guide further\ntraining.\n\n--- PDF PAGE 37 ---\n________________________________________________________________________________________________________________________________ 35\n\nTR – Commercial Cooking NCIII Promulgated April 2007\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Training needs\nRelevant information to identify training needs\nmay include but not limited to:\n1.1 Industry/enterprise or other performance\ncompetency standards\n1.2 Industry/workplace training practices\n1.3 Job descriptions\n1.4 Results of training needs analysis\n1.5 Business plans of the organization which\nidentify skill development requirements\n1.6 Standard operating and/or other workplace\nprocedures\n\n2. Appropriate personnel\nMay include but not limited to:\n1.1 Team leaders/supervisors/technical experts\n1.2 Managers/employers\n1.3 Training and assessment coordinators\n1.4 Training participants\n1.5 Representative from government regulatory\nbodies\n1.6 Union/employee representatives\n3. Training delivery methods\nMay include but not limited to:\n1.1 Presentations\n1.2 Demonstrations\n1.3 Explanations\n1.4 Problem solving\n1.5 Mentoring\n1.6 Experiential learning\n1.7 Group work\n1.8 Job rotation\n4.Strategies and techniques\nMay include but not limited to:\n4.1 Active listening\n4.2 Targeted questioning\n4.3 Points of clarification\n4.4 Group discussions\n\n--- PDF PAGE 38 ---\n________________________________________________________________________________________________________________________________ 36\n\nTR – Commercial Cooking NCIII Promulgated April 2007\n\n5.Components of competency\nMay include but not limited to:\n5.1 Task skill\n5.2 Task management skills\n5.3 Contingency management skills\n5.4 Job/role environment skills\n5.5 Transfer and application of skills and\nknowledge of new contents\n6. Needs of participants\nCharacteristics of training participants may include\nbut not limited to:\n1.1. Cultural, language, and educational\nbackground\n1.2. Gender\n1.3. Physical ability\n1.4. Level of confidence, nervousness or anxiety\n1.5. Age\n1.6. Previous experience with the topic\n1.7. Experience in training and assessment\n\n--- PDF PAGE 39 ---\n________________________________________________________________________________________________________________________________ 37\n\nTR – Commercial Cooking NCIII Promulgated April 2007\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1. Demonstrated the ability to identify specific training\nneeds and required competency outcomes.\n1.2. Demonstrated the ability to outline the training approach\nand steps to be followed.\n1.3. Demonstrated the ability to identify training participant(s)\nand delivery method(s) to be used\n1.4. Demonstrated the ability to organize and conduct the\ntraining.\n 2. Underpinning\nKnowledge\n2.1. Identification of evidence of competency\n2.2. Competency in the units being taught\n2.3.Training delivery methods\n3. Underpinning\nSkills\n3.1. Planning and documenting training approaches\n3.2. Training delivery methods\n3.3. Training strategies and techniques which facilitate\nlearning process\n3.4. Correct use of equipment and presentation skills\nappropriate for the training\n3.5. Communication skills (written and oral)\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1. Project or work activities that allow the candidate to\ndemonstrate planning, conducting and review of training\non a one-to-one or small group basis.\n4.2. Access to records, logbooks, reports and other sources\nof information about the operation and/or the personnel.\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1 Direct observation of performance in the conduct of the\ntraining\n5.2 Evaluation of the training plans and documents prepared\nby the candidate\n5.3 Oral or written questions to assess knowledge in training\nneeds analysis\n6. Context for\nAssessment\n6.1 Competency assessment may occur in workplace or any\nappropriately simulated environment\n6.2 Assessment shall be observed on multiple occasions\ninvolving a combination of direct, indirect and\nsupplementary forms of evidence.\n\n--- PDF PAGE 40 ---\n________________________________________________________________________________________________________________________________ 38\n\nTR – Commercial Cooking NCIII Promulgated April 2007\n\nUNIT OF COMPETENCY\n: ESTABLISH AND CONDUCT BUSINESS\nRELATIONSHIPS\n\nUNIT CODE\n :"
