  "source_section_text": "SECTION 2 COMPETENCY STANDARDS\n\nThis section details the contents of the basic, common and core units of\ncompetency required in Commercial Cooking NC III.\n\nBASIC COMPETENCIES\n\nUNIT OF COMPETENCY : LEAD WORKPLACE COMMUNICATION\nUNIT CODE\n : 500311109\n UNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes\nrequired to lead in the dissemination and discussion of\nideas, information and issues in the workplace.\nELEMENT\nPERFORMANCE CRITERIA\nBold and italicized terms are elaborated in the\nRange of Variables\n1. Communicate\ninformation about\nworkplace processes\n1.1 Appropriate communication method is\nselected\n1.2 Multiple operations involving several topics\nareas are communicated accordingly\n1.3 Questions are used to gain extra information\n1.4 Correct sources of information are identified\n1.5 Information is selected and organized correctly\n1.6 Verbal and written reporting is undertaken when\nrequired\n1.7 Communication skills are maintained in all\nsituations\n2. Lead workplace\ndiscussions\n2.1 Response to workplace issues are sought\n2.2 Response to workplace issues are provided\nimmediately\n2.3 Constructive contributions are made to\nworkplace discussions on such issues as\nproduction, quality and safety\n2.4 Goals/objectives and action plan undertaken in\nthe workplace are communicated\n3. Identify and\ncommunicate issues\narising in the workplace\n3.1 Issues and problems are identified as they arise\n3.2 Information regarding problems and issues are\norganized coherently to ensure clear and\neffective communication\n3.3 Dialogue is initiated with appropriate personnel\n3.4 Communication problems and issues are raised\nas they arise\n\n--- PDF PAGE 6 ---\n________________________________________________________________________________________________________________________________ 4\n\nTR – Commercial Cooking NCIII Promulgated April 2007\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Methods of\ncommunication\nMay include but not limited to:\n1.1. Non-verbal gestures\n1.2. Verbal\n1.3. Face to face\n1.4. Two-way radio\n1.5. Speaking to groups\n1.6. Using telephone\n1.7. Written\n1.8. Internet\n\n--- PDF PAGE 7 ---\n________________________________________________________________________________________________________________________________ 5\n\nTR – Commercial Cooking NCIII Promulgated April 2007\n\nEVIDENCE GUIDE\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1.\nDealt with a range of communication/information at\none time\n1.2.\nMade constructive contributions in workplace issues\n1.3.\nSought workplace issues effectively\n1.4.\nResponded to workplace issues promptly\n1.5.\nPresented information clearly and effectively written\nform\n1.6.\nUsed appropriate sources of information\n1.7.\nAsked appropriate questions\n1.8.\nProvided accurate information\n2. Underpinning\nknowledge\n2.1.\nOrganization requirements for written and electronic\ncommunication methods\n2.2.\nEffective verbal communication methods\n3. Underpinning\nskills\n3.1.\nOrganize information\n3.2.\nUnderstand and convey intended meaning\n3.3.\nParticipate in variety of workplace discussions\n3.4.\nComply with organization requirements for the use\nof written and electronic communication methods\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1.\nVariety of Information\n4.2.\nCommunication tools\n4.3.\nSimulated workplace\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1.\nCompetency in this unit must be assessed through\n5.2.\nDirect Observation\n5.3.\nInterview\n6. Context of\nassessment\n6.1.\nCompetency may be assessed in the workplace or\nin simulated workplace environment\n\n--- PDF PAGE 8 ---\n________________________________________________________________________________________________________________________________ 6\n\nTR – Commercial Cooking NCIII Promulgated April 2007\n\nUNIT OF COMPETENCY\n: LEAD SMALL TEAMS\n\nUNIT CODE\n : 500311110\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes\nrequired to lead small teams including setting and\nmaintaining\nteam\nand\nindividual\nperformance\nstandards.\n\nELEMENT\nPERFORMANCE CRITERIA\nBold and italicized terms are elaborated in the\nRange of Variables\n1. Provide team\nleadership\n1.1.\nWork requirements are identified and\npresented to team members\n1.2.\nReasons for instructions and requirements are\ncommunicated to team members\n1.3.\nTeam members’ queries and concerns are\nrecognized, discussed and dealt with\n2. Assign responsibilities\n2.1.\nDuties, and responsibilities are allocated\nhaving regard to the skills, knowledge and\naptitude required to properly undertake the\nassigned task and according to company\npolicy\n2.2.\nDuties are allocated having regard to individual\npreference, domestic and personal\nconsiderations, whenever possible\n3. Set performance\nexpectations for team\nmembers\n3.1.\nPerformance expectations are established\nbased on client needs and according to\nassignment requirements\n3.2.\nPerformance expectations are based on\nindividual team members duties and area of\nresponsibility\n3.3.\nPerformance expectations are discussed and\ndisseminated to individual team members\n\n--- PDF PAGE 9 ---\n________________________________________________________________________________________________________________________________ 7\n\nTR – Commercial Cooking NCIII Promulgated April 2007\n\nELEMENT\nPERFORMANCE CRITERIA\nBold and italicized terms are elaborated in the\nRange of Variables\n4. Supervise team\nperformance\n4.1.\nMonitoring of performance takes place\nagainst defined performance criteria and/or\nassignment instructions and corrective action\ntaken if required\n4.2.\nTeam members are provided with feedback,\npositive support and advice on strategies to\novercome any deficiencies\n4.3.\nPerformance issues which cannot be rectified\nor addressed within the team are referenced to\nappropriate personnel according to employer\npolicy\n4.4.\nTeam members are kept informed of any\nchanges in the priority allocated to assignments\nor tasks which might impact on client/customer\nneeds and satisfaction\n\n4.5.\nTeam operations are monitored to ensure that\nemployer/client needs and requirements are\nmet\n4.6.\nFollow-up communication is provided on all\nissues affecting the team\n4.7.\nAll relevant documentation is completed in\naccordance with company procedures\n\n--- PDF PAGE 10 ---\n________________________________________________________________________________________________________________________________ 8\n\nTR – Commercial Cooking NCIII Promulgated April 2007\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Work requirements\nMay include but not limited to:\n1.1. Client Profile\n1.2. Assignment instructions\n2. Team member’s concerns\nMay include but not limited to:\n2.1. Roster/shift details\n3. Monitor performance\nMay include but not limited to:\n3.1. Formal process\n3.2. Informal process\n4. Feedback\nMay include but not limited to:\n4.1. Formal process\n4.2. Informal process\n5. Performance issues\nMay include but not limited to:\n5.1. Work output\n5.2. Work quality\n5.3. Team participation\n5.4. Compliance with workplace protocols\n5.5. Safety\n5.6. Customer service\n\n--- PDF PAGE 11 ---\n________________________________________________________________________________________________________________________________ 9\n\nTR – Commercial Cooking NCIII Promulgated April 2007\n\nEVIDENCE GUIDE\n1. Critical aspects\nof competency\nAssessment requires evidence that the candidate:\n1.1. Maintained or improved individuals and/or team\nperformance given a variety of possible scenario\n1.2. Assessed and monitored team and individual\nperformance against set criteria\n1.3. Represented concerns of a team and individual to\nnext level of management or appropriate specialist\nand to negotiate on their behalf\n1.4. Allocated duties and responsibilities, having regard to\nindividual’s knowledge, skills and aptitude and the\nneeds of the tasks to be performed\n1.5. Set and communicated performance expectations for\na range of tasks and duties within the team and\nprovided feedback to team members\n2. Underpinning\nknowledge\n2.1. Company policies and procedures\n2.2. Relevant legal requirements\n2.3. How performance expectations are set\n2.4. Methods of Monitoring Performance\n2.5. Client expectations\n2.6.\nTeam member’s duties and responsibilities\n3. Underpinning\nskills\n3.1. Communication skills required for leading teams\n3.2. Informal performance counseling skills\n3.3. Team building skills\n3.4.\nNegotiating skills\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1. Access to relevant workplace or appropriately\nsimulated environment where assessment can take\nplace\n4.2.\nMaterials relevant to the proposed activity or task\n\n--- PDF PAGE 12 ---\n________________________________________________________________________________________________________________________________ 10\n\nTR – Commercial Cooking NCIII Promulgated April 2007\n\n5. Methods of\nassessment\nCompetency may be assessed through:\n5.1. Direct observations of work activities of the individual\nmember in relation to the work activities of the group\n5.2. Observation of simulation and/or role play involving\nthe participation of individual member to the\nattainment of organizational goal\n5.3. Case studies and scenarios as a basis for discussion\nof issues and strategies in teamwork\n6. Context of\nassessment\n6.1. Competency assessment may occur in workplace or\nany appropriately simulated environment\n6.2. Assessment shall be observed while task are being\nundertaken whether individually or in-group\n\n--- PDF PAGE 13 ---\n________________________________________________________________________________________________________________________________ 11\n\nTR – Commercial Cooking NCIII Promulgated April 2007\n\nUNIT OF COMPETENCY: DEVELOP AND PRACTICE NEGOTIATION SKILLS\n\nUNIT CODE : 500311111\n\nUNIT DESCRIPTOR : This unit covers the skills, knowledge and attitudes\nrequired to collect information in order to negotiate to a\ndesired outcome and participate in the negotiation.\n\nELEMENT\nPERFORMANCE CRITERIA\nBold and italicized terms are elaborated in the\nRange of Variables\n1. Plan negotiations\n1.1 Information on preparing for negotiation is\nidentified and included in the plan\n1.2 Information on active listening is identified and\nincluded in the plan\n1.3 Information on different questioning techniques is\nidentified and included in the plan\n1.4 Information is checked to ensure it is correct and up-\nto- date\n2. Participate in\nnegotiations\n2.1 Criteria for successful outcome are agreed upon by all\nparties\n2.2 Desired outcome of all parties are considered\n2.3 Appropriate language is used throughout the\nnegotiation\n2.4 A variety of questioning techniques are used\n2.5 The issues and processes are documented and\nagreed upon by all parties\n2.6 Possible solutions are discussed and their viability\nassessed\n2.7 Areas for agreement are confirmed and recorded\n2.8 Follow-up action is agreed upon by all parties\n\n--- PDF PAGE 14 ---\n________________________________________________________________________________________________________________________________ 12\n\nTR – Commercial Cooking NCIII Promulgated April 2007\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Preparing for\nnegotiation\nMay include but not limited to:\n1.1 Background information on other parties to the\nnegotiation\n1.2 Good understanding of topic to be negotiated\n1.3 Clear understanding of desired outcome/s\n1.4 Personal attributes\n1.4.1 self awareness\n1.4.2 self esteem\n1.4.3 objectivity\n1.4.4 empathy\n1.4.5 respect for others\n1.5 Interpersonal skills\n1.5.1 listening/reflecting\n1.5.2 non verbal communication\n1.5.3 assertiveness\n1.5.4 behavior labeling\n1.5.5 testing understanding\n1.5.6 seeking information\n1.5.7 self disclosing\n1.6 Analytic skills\n1.6.1 observing differences between content\nand process\n1.6.2 identifying bargaining information\n1.6.3 applying strategies to manage process\n1.6.4 applying steps in negotiating process\n1.6.5 strategies to manage conflict\n1.6.6 steps in negotiating process\n1.6.7 options within organization and\nexternally for resolving conflict\n2. Non verbal\nenvironments\nMay include but not limited to:\n2.1 Friendly reception\n2.2 Warm and welcoming room\n2.3 Refreshments offered\n2.4 Lead in conversation before negotiation begins\n\n--- PDF PAGE 15 ---\n________________________________________________________________________________________________________________________________ 13\n\nTR – Commercial Cooking NCIII Promulgated April 2007\n\nVARIABLE\nRANGE\n3. Active listening\nMay include but not limited to:\n3.1 Attentive\n3.2 Don’t interrupt\n3.3 Good posture\n3.4 Maintain eye contact\n3.5 Reflective listening\n4. Questioning\ntechniques\nMay include but not limited to:\n4.1 Direct\n4.2 Indirect\n4.3 Open-ended\n\n--- PDF PAGE 16 ---\n________________________________________________________________________________________________________________________________ 14\n\nTR – Commercial Cooking NCIII Promulgated April 2007\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\n Competency\nAssessment requires evidence that the candidate:\n1.1 Demonstrated sufficient knowledge of the factors\ninfluencing negotiation to achieve agreed outcome\n1.2 Participated in negotiation with at least one person to\nachieve an agreed outcome\n2. Underpinning\nknowledge and\nAttitude\n2.1 Codes of practice and guidelines for the organization\n2.2 Organizations policy and procedures for negotiations\n2.3 Decision making and conflict resolution strategies\nprocedures\n2.4 Problem solving strategies on how to deal with\nunexpected questions and attitudes during negotiation\n2.5 Flexibility\n2.6 Empathy\n3. Underpinning\nskills\n3.1 Interpersonal skills to develop rapport with other parties\n3.2 Communication skills (verbal and listening)\n3.3 Observation skills\n3.1 Negotiation skills\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Room with facilities necessary for the negotiation\nprocess\n4.2 Human resources (negotiators)\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1 Observation/demonstration and questioning\n5.2 Portfolio assessment\n5.3 Oral and written questioning\n5.4 Third party report\n6. Context of\nassessment\n6.1 Competency to be assessed in real work environment or\nin a simulated workplace setting.\n\n--- PDF PAGE 17 ---\n________________________________________________________________________________________________________________________________ 15\n\nTR – Commercial Cooking NCIII Promulgated April 2007\n\nUNIT OF COMPETENCY :\nSOLVE PROBLEMS RELATED TO WORK\nACTIVITIES\nUNIT CODE\n: 500311112\nUNIT DESCRIPTOR\n:\nThis unit of competencies covers the knowledge, skills\nand attitudes required to solve problems in the\nworkplace including the application of problem solving\ntechniques and to determine and resolve the root\ncause of problems.\n\nELEMENT\nPERFORMANCE CRITERIA\nBold and italicized terms are elaborated in the\nRange of Variables\n1.\nIdentify the problem\n1.1.\nVariances are identified from normal operating\nparameters; and product quality\n1.2.\nExtent, cause and nature are of the problem\nare defined through observation, investigation\nand analytical techniques\n1.3.\nProblems are clearly stated and specified\n2.\nDetermine\nfundamental causes\nof the problem\n2.1.\nPossible causes are identified based on\nexperience and the use of problem solving\ntools / analytical techniques.\n2.2.\nPossible cause statements are developed\nbased on findings\n2.3.\nFundamental causes are identified per results\nof investigation conducted\n3.\nDetermine corrective\naction\n3.1.\nAll possible options are considered for\nresolution of the problem\n3.2.\nStrengths and weaknesses of possible options\nare considered\n3.3.\nCorrective actions are determined to resolve\nthe problem and possible future causes\n3.4.\nAction plans are developed identifying\nmeasurable objectives, resource needs and\ntimelines in accordance with safety and\noperating procedures\n4.\nProvide\nrecommendation/s to\nmanager\n4.1.\nReport on recommendations are prepared\n4.2.\nRecommendations are presented to\nappropriate personnel.\n4.3.\nRecommendations are followed-up, if required\n\n--- PDF PAGE 18 ---\n________________________________________________________________________________________________________________________________ 16\n\nTR – Commercial Cooking NCIII Promulgated April 2007\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Analytical techniques\nMay include but not limited to:\n1.1.\nBrainstorming\n1.2.\nIntuitions/Logic\n1.3.\nCause and effect diagrams\n1.4.\nPareto analysis\n1.5.\nSWOT analysis\n1.6.\nGantt chart, Pert CPM and graphs\n1.7.\nScatter grams\n2. Problem\n\nMay include but not limited to:\n2.1.\nNon – routine process and quality problems\n2.2.\nEquipment selection, availability and failure\n2.3.\nTeamwork and work allocation problem\n2.4.\nSafety and emergency situations and\nincidents\n3. Action plans\n\nMay include but not limited to:\n3.1.\nPriority requirements\n3.2.\nMeasurable objectives\n3.3.\nResource requirements\n3.4.\nTimelines\n3.5.\nCo-ordination and feedback requirements\n3.6.\nSafety requirements\n3.7.\nRisk assessment\n3.8.\nEnvironmental requirements\n\n--- PDF PAGE 19 ---\n________________________________________________________________________________________________________________________________ 17\n\nTR – Commercial Cooking NCIII Promulgated April 2007\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1.\nIdentified the problem\n1.2.\nDetermined the fundamental causes of the problem\n1.3.\nDetermined the correct / preventive action\n1.4.\nProvided recommendation to manager\nThese aspects may be best assessed using a range of\nscenarios / case studies / what ifs as a stimulus with a\nwalk through forming part of the response. These\nassessment activities should include a range of problems,\nincluding new, unusual and improbable situations that may\nhave happened.\n2. Underpinning\nknowledge\n2.1.\nCompetence includes a thorough knowledge and\nunderstanding of the process, normal operating\nparameters, and product quality to recognize non-\nstandard situations\n2.2.\nCompetence to include the ability to apply and\nexplain, sufficient for the identification of\nfundamental cause, determining the corrective\naction and provision of recommendations\n2.2.1.\nRelevant equipment and operational\nprocesses\n2.2.2.\nEnterprise goals, targets and measures\n2.2.3.\nEnterprise quality, OHS and environmental\nrequirement\n2.2.4.\nPrinciples of decision making strategies\nand techniques\n2.2.5.\nEnterprise information systems and data\ncollation\n2.2.6.\nIndustry codes and standards\n\n--- PDF PAGE 20 ---\n________________________________________________________________________________________________________________________________ 18\n\nTR – Commercial Cooking NCIII Promulgated April 2007\n\n3. Underpinning\nskills\n3.1.\nUsing range of formal problem solving techniques\n3.2.\nIdentifying and clarifying the nature of the problem\n3.3.\nDevising the best solution\n3.4.\nEvaluating the solution\n3.5.\nImplementation of a developed plan to rectify the\nproblem\n4. Resource\nimplications\n4.1.\nAssessment will require access to an operating\nplant over an extended period of time, or a suitable\nmethod of gathering evidence of operating ability\nover a range of situations. A bank of scenarios /\ncase studies / what ifs will be required as well as\nbank of questions which will be used to probe the\nreason behind the observable action.\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1. Case studies on solving problems in the workplace\n5.2. Observation\nThe unit will be assessed in a holistic manner as is\npractical and may be integrated with the assessment of\nother relevant units of competency. Assessment will occur\nover a range of situations, which will include disruptions to\nnormal, smooth operation. Simulation may be required to\nallow for timely assessment of parts of this unit of\ncompetency. Simulation should be based on the actual\nworkplace and will include walk through of the relevant\ncompetency components.\n6. Context of\nassessment\n6.1.\nIn all workplace, it may be appropriate to assess\nthis unit concurrently with relevant teamwork or\noperation units.\n\n--- PDF PAGE 21 ---\n________________________________________________________________________________________________________________________________ 19\n\nTR – Commercial Cooking NCIII Promulgated April 2007\n\nUNIT OF COMPETENCY: USE MATHEMATICAL CONCEPTS AND\n TECHNIQUES\n\nUNIT CODE : 500311113\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes\nrequired in the application of mathematical concepts\nand techniques.\n\nELEMENT\nPERFORMANCE CRITERIA\nBold and italicized terms are elaborated in the\nRange of Variables\n1. Identify mathematical\ntools and techniques to\nsolve problem\n1.1 Problem areas are identified based on given\ncondition\n1.2 Mathematical techniques are selected based\non the given problem\n\n2. Apply mathematical\nprocedure/solution\n2.1 Mathematical techniques are applied based on\nthe problem identified\n2.2 Mathematical computations are performed to the\nlevel of accuracy required for the problem\n2.3 Results of mathematical computation is\ndetermined and verified based on job\nrequirements\n3. Analyze results\n3.1 Result of application is reviewed based on\nexpected and required specifications and\noutcome\n3.2 Appropriate action is applied in case of error\n\n--- PDF PAGE 22 ---\n________________________________________________________________________________________________________________________________ 20\n\nTR – Commercial Cooking NCIII Promulgated April 2007\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Mathematical techniques\nMay include but are not limited to:\n1.1 Four fundamental operations\n1.2 Measurements\n1.3 Use/Conversion of units of measurements\n1.4 Use of standard formulas\n2. Appropriate action\nMay include but not limited to:\n2.1 Review in the use of mathematical\ntechniques (e.g. recalculation, re-modeling)\n2.2 Report error to immediate superior for proper\naction\n\n--- PDF PAGE 23 ---\n________________________________________________________________________________________________________________________________ 21\n\nTR – Commercial Cooking NCIII Promulgated April 2007\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Identified, applied and reviewed the use of\nmathematical concepts and techniques to workplace\nproblems\n2. Underpinning\nknowledge\n2.1 Fundamental operation (addition, subtraction, division,\nmultiplication)\n2.2 Measurement system\n2.3 Precision and accuracy\n2.4 Basic measuring tools/devices\n3. Underpinning\nskills\n3.1 Applying mathematical computations\n3.2 Using calculator\n3.3 Using different measuring tools\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Calculator\n4.2 Basic measuring tools\n4.3 Case Problems\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1 Authenticated portfolio\n5.2 Written Test\n5.3 Interview/Oral Questioning\n5.4 Demonstration\n6. Context of\nassessment\n6.1 Competency may be assessed in the work place or in a\nsimulated work place setting\n\n--- PDF PAGE 24 ---\n________________________________________________________________________________________________________________________________ 22\n\nTR – Commercial Cooking NCIII Promulgated April 2007\n\nUNIT OF COMPETENCY: USE RELEVANT TECHNOLOGIES\n\nUNIT CODE : 500311114\n\nUNIT DESCRIPTOR : This unit of competency covers the knowledge, skills,\nand attitude required in selecting, sourcing and applying\nappropriate\nand\naffordable\ntechnologies\nin\nthe\nworkplace.\n\nELEMENT\nPERFORMANCE CRITERIA\nBold and italicized terms are elaborated in the\nRange of Variables\n\n1. Study/select appropriate\ntechnology\n\n1.1 Usage of different technologies is determined\nbased on job requirements\n1.2 Appropriate technology is selected as per work\n specification\n\n2. Apply relevant technology\n\n2.1 Relevant technology is effectively used in carrying\n out function\n2.2 Applicable software and hardware are used as per\n task requirement\n2.3 Management concepts are observed and\npracticed as per established industry practices\n\n3. Maintain/enhance of\nrelevant technology\n\n3.1 Maintenance of technology is applied in\naccordance with the industry standard operating\nprocedure, manufacturer’s operating\nguidelines and occupational health and safety\nprocedure to ensure its operative ability\n3.2 Updating of technology is maintained through\ncontinuing education or training in accordance with\njob requirement\n3.3 Technology failure/ defect is immediately reported\nto the concern/responsible person or section for\nappropriate action\n\n--- PDF PAGE 25 ---\n________________________________________________________________________________________________________________________________ 23\n\nTR – Commercial Cooking NCIII Promulgated April 2007\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Technology\nMay include but are not limited to:\n1.1 Office technology\n1.2 Industrial technology\n1.3 System technology\n1.4 Information technology\n1.5 Training technology\n2. Management concepts\nMay include but not limited to:\n2.1 Real Time Management\n2.2 KAIZEN or continuous improvement\n2.3 5s\n2.4 Total Quality Management\n2.5 Other management/productivity tools\n3. Industry standard operating\nprocedure\nMay include but are not limited to:\n3.1 Written guidelines relative to the usage of\noffice technology/equipment\n3.2 Verbal advise/instruction from the co-worker\n4. Manufacturer’s operating\nguidelines/ instructions\nMay include but are not limited to:\n4.1 Written instruction/manuals of specific\ntechnology/ equipment\n4.2 General instruction manual\n4.3 Verbal advise from manufacturer relative to\nthe operation of equipment\n5. Occupational health and\nsafety procedure\nMay include but are not limited to:\n5.1 Relevant statutes on OHS\n5.2 Company guidelines in using\n technology/equipment\n6. Appropriate action\nMay include but are not limited to:\n6.1 Implementing preventive maintenance\nschedule\n6.2 Coordinating with manufacturer’s technician\n\n--- PDF PAGE 26 ---\n________________________________________________________________________________________________________________________________ 24\n\nTR – Commercial Cooking NCIII Promulgated April 2007\n\n EVIDENCE GUIDE\n\n2 1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Studied and selected appropriate technology\nconsistent with work requirements\n1.2 Applied relevant technology\n1.3 Maintained and enhanced operative ability of relevant\ntechnology\n2. Underpinning\nknowledge\n2.1 Awareness on technology and its function\n2.2 Repair and maintenance procedure\n2.3 Operating instructions\n2.4 Applicable software\n2.5 Communication techniques\n2.6 Health and safety procedure\n2.7 Company policy in relation to relevant technology\n2.8 Different management concepts\n2.9 Technology adaptability\n3. Underpinning skills\n3.1 Relevant technology application/implementation\n3.2 Basic communication skills\n3.3 Software applications skills\n3.4 Basic troubleshooting skills\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Relevant technology\n4.2 Interview and demonstration questionnaires\n4.3 Assessment packages\n5. Method of\nassessment\nCompetency must be assessed through:\n5.1 Interview\n5.2 Actual demonstration\n5.3 Authenticated portfolio (related certificates of\ntraining/seminar)\n6. Context of\nassessment\n6.1 Competency may be assessed in actual workplace or\nsimulated environment\n\n--- PDF PAGE 27 ---\n________________________________________________________________________________________________________________________________ 25\n\nTR – Commercial Cooking NCIII Promulgated April 2007\n\nCOMMON COMPETENCIES\n\nUNIT OF COMPETENCY : ROSTER STAFF\n\nUNIT CODE\n : TRS5311206\n\n UNIT DESCRIPTOR : This unit covers the knowledge, skills, behavior and\nmotivations required to develop staff rosters. This role\nmay be carried out by operational supervisors and\nmanagers.\n\nELEMENT\nPERFORMANCE CRITERIA\nBold and italicized terms are elaborated in the\nRange of Variables\n1 Develop and implement\nstaff rosters\n1.1 Rosters are developed in accordance with\ncompany agreements and wage budgets.\n1.2 Operational efficiency and customer service levels\nare maximized while wage costs are minimized in\nroster development.\n1.3 Duties are combined where appropriate to ensure\neffective use of staff.\n1.4 The available skills base is utilized appropriately to\nroster the most effective mix of staff and to meet\ndifferent operational requirements.\n1.5 Rosters are presented in required formats to\nensure clarity of information in accordance with\ncompany standards.\n1.6 Rosters are communicated to appropriate\ncolleagues within designated timelines.\n2. Maintain staff records\n2.1 Time sheets and other documentation are\ncompleted accurately and within designated\ntimelines.\n2.2 Staff records are updated accurately and\nmaintained or stored in accordance with\nestablishment procedures.\n\n--- PDF PAGE 28 ---\n________________________________________________________________________________________________________________________________ 26\n\nTR – Commercial Cooking NCIII Promulgated April 2007\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Rosters\nMay be for but are not limited to:\n1.1 An individual department\n1.2 A whole establishment\n1.3 A specific project\n2. Company agreements\nMay be but are not limited to:\n2.1 Number of hours worked in a given shift\n2.2 Overall number of hours allocated to different\nstaff members\n2.3 Breaks between shifts\n2.4 Nature of duties allocated\n2.5 Use of permanent or casual staff\n\n--- PDF PAGE 29 ---\n________________________________________________________________________________________________________________________________ 27\n\nTR – Commercial Cooking NCIII Promulgated April 2007\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Demonstrated knowledge and understanding of the\nfactors and issues which impact upon staff rostering\n1.2 Demonstrated familiarity with typical formats and the\nkey information to be included\n1.3 Demonstrated the ability to prepare staff rosters which\nmeet wage budgets and which provide a level of\nstaffing sufficient to ensure the delivery of high quality\ncustomer service.\n2. Underpinning\nknowledge\n2.1 The role of rosters and their importance in controlling\nstaff costs\n2.2 Factors to be considered when developing rosters\n2.3 Formats for the presentation of staff rosters and details\nto be included\n2.4 Knowledge on area of operation for which roster is\nbeing developed.\n3. Underpinning Skills\n3.1 Organize information\n3.2 Prepare staff rosters\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1 Project or work activities which allow the candidate to\nprepare rosters for a workplace and to evaluate their\ncost efficiency and operational effectiveness against\nnominated standards\n4.2 Preparation of more than one roster to meet the\nstaffing requirements of more than one operational\nsituation\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1.\nEvaluation of the staffing costs and service levels at\nan event for which the candidate has prepared\nrosters\n5.2.\nOral or written questions to assess knowledge of\nspecific factors which affect the design of rosters\n5.3.\nReview of portfolios of evidence and third party\nworkplace reports of on-the-job performance by the\ncandidate\n6. Context for\nAssessment\n6.1.\nCompetency may be assessed in the workplace or\nin simulated workplace environment\n6.2.\nAssessment shall be observed while tasks are\nbeing undertaken whether individually or in a group\n\n--- PDF PAGE 30 ---\n________________________________________________________________________________________________________________________________ 28\n\nTR – Commercial Cooking NCIII Promulgated April 2007\n\nUNIT OF COMPETENCY\n: CONTROL AND ORDER STOCK\n\nUNIT CODE\n : TRS311207\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills, behavior and\nmotivations required to control and order stock in a\nrange of hospitality establishments. This role is\ngenerally carried out by supervisors and team\nleaders.\n\nELEMENT\nPERFORMANCE CRITERIA\nBold and italicized terms are elaborated in the\nRange of Variables\n1. Maintain stock levels\nand records\n1.1 Stock levels are monitored and maintained\naccording to company requirements.\n1.2 Stock security is monitored and systems are\nadjusted as required.\n1.3 Stock reorder cycles are monitored and adjusted\nas required.\n1.4 Colleagues are informed of their individual\nresponsibilities in regard to the reordering of stock.\n1.5 Records of stock storage and movement are\nmaintained in accordance with company\nprocedures.\n1.6 Stock performance is monitored and fast/slow-\nselling items are identified and reported in\naccordance with company procedures.\n2. Process stock orders\n2.1 Orders for stock are processed accurately and in\naccordance with company procedures.\n2.2 Stock levels are maintained and recorded\nensuring information is complete, correct and\ncurrent.\n2.3 Incoming stock is checked against purchase and\nsupply agreements and all necessary details are\nrecorded.\n3. Minimize stock losses\n3.1 Stock losses are identified and recorded\naccording to company procedures.\n3.2 Losses are reported in accordance with company\nprocedures.\n3.3 Avoidable losses are identified and reasons\nbehind these losses are established.\n3.4 Solutions to loss situations are recommended and\nrelated procedures are implemented to prevent\nfuture avoidable losses.\n\n--- PDF PAGE 31 ---\n________________________________________________________________________________________________________________________________ 29\n\nTR – Commercial Cooking NCIII Promulgated April 2007\n\n4. Follow-up orders\n4.1 The delivery process is monitored to ensure\nagreed deadlines are met.\n4.2 Continuity of supply is ensured by liaising with\ncolleagues and suppliers.\n4.3 Routine supply problems are followed up or\nreferred to the appropriate person in accordance\nwith company policy.\n4.4 Stock is distributed to agreed locations.\n5. Organize and\nadminister stocks\n5.1 Stocks are organized at appropriate intervals\naccording to company policy and procedures.\n5.2 Stocktaking responsibilities are allocated to staff.\n5.3 Accurate stock reports are produced within\ndesignated timelines.\n\n--- PDF PAGE 32 ---\n________________________________________________________________________________________________________________________________ 30\n\nTR – Commercial Cooking NCIII Promulgated April 2007\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Stock\nMay include but is not limited to:\n1.1 Food\n1.2 Beverages\n1.3 Equipment such as maintenance and cleaning\nequipment, office equipment\n1.4 Linen\n1.5 Stationery\n1.6 Brochures and promotional materials\n1.7 Cleaning supplies and chemicals\n1.8 Vouchers and tickets\n1.9 Souvenir products\n2. Stock losses\nMay be due to the following:\n2.1 Lack of rotation leading to product\ndeterioration\n2.2 Inappropriate storage conditions\n2.3 Access by pests or vermin\n2.4 Theft\n2.5 Overstocking\n\n--- PDF PAGE 33 ---\n________________________________________________________________________________________________________________________________ 31\n\nTR – Commercial Cooking NCIII Promulgated April 2007\n\nEVIDENCE GUIDE\n\n1. Critical aspects\nof Competency\nAssessment requires evidence that the candidate:\n1.1 Demonstrated the ability to maintain continuous stock\nsupply within a specific hospitality industry environment\n1.2 Demonstrated the ability to meet accuracy and speed\nrequirements for completion and maintenance of stock\nrecords\n2 Underpinning\nKnowledge\n2.1 Stock level maintenance techniques as appropriate to\nthe industry sector\n2.2 Typical stocktaking procedures as appropriate to the\nindustry sector\n2.3 Stock recording systems\n2.4 Stock security systems\n2.5 Types of stock control documentation and systems\nthat may be applied in the hospitality industry\n2.6 Reasons for stock loss and damage\n3. Underpinning\nSkills\n3.1\nCollect, organize and analyze information\n3.2\nPlan and organize activities\n3.3\nApplication of underpinning knowledge\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1\nProject or work activities that allow the candidate to\ndemonstrate stock control and monitoring over a\nperiod of time\n4.2\nUse of real stock items\n4.3\nUse of industry-current stock control technology or\ndocumentation\n4.4\nInvolvement of internal/external suppliers\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1\nReview of activities undertaken by the candidate to\nmonitor stock for a given period of time for a specific\noutlet\n5.2\nWritten or oral questions to test knowledge of\nreasons for procedures\n5.3\nReview of workplace reports and records related to\nstock control, prepared by the candidate\n5.4\nReview of portfolios of evidence and third party\nworkplace reports of on-the-job performance by the\ncandidate\n\n--- PDF PAGE 34 ---\n________________________________________________________________________________________________________________________________ 32\n\nTR – Commercial Cooking NCIII Promulgated April 2007\n\n6. Context for\nAssessment\n6.1\nCompetency assessment may occur in workplace or\nany appropriately simulated environment\n6.2\nAssessment shall be observed while tasks are being\nundertaken whether individually or in a group\n\n--- PDF PAGE 35 ---\n________________________________________________________________________________________________________________________________ 33\n\nTR – Commercial Cooking NCIII Promulgated April 2007\n\nUNIT OF COMPETENCY\n: TRAIN SMALL GROUPS\n\nUNIT CODE\n : TRS311208\n\nUNIT DESCRIPTOR : This unit covers the requirements for planning,\ndelivering and reviewing training provided for the\npurposes of developing competency on a one-to-one\nor small group basis.\n\nELEMENT\nPERFORMANCE CRITERIA\nBold and italicized terms are elaborated in the\nRange of Variables\n1. Prepare for trainings\n1.1 Specific training needs are identified and\n confirmed through consultation with appropriate\n personnel.\n1.2 Training objectives are matched to identify\ncompetency development needs.\n1.3 Training\napproaches\nare\nplanned\nand\ndocumented.\n2. Deliver training\n1.1 Training is conducted in a safe and accessible\nenvironment.\n1.2 Training delivery methods appropriate to the\nparticipant(s) needs, trainer availability, location\nand resources are selected.\n1.3 Strategies and techniques which facilitate the\nlearning process are employed.\n1.4 Training objectives, sequence of activities and\nassessment processes are discussed with training\nparticipant(s).\n1.5 Systematic approach to training is undertaken to\nmeet specific needs of training participant(s).\n3. Provide opportunities for\npractice\n1.1 Practice opportunities are provided to ensure that\nthe participants achieve the components of\ncompetency.\n1.2 Variety of methods for encouraging learning is\nimplemented to meet the individual needs of\nparticipants.\n\n--- PDF PAGE 36 ---\n________________________________________________________________________________________________________________________________ 34\n\nTR – Commercial Cooking NCIII Promulgated April 2007\n\n4. Review training\n1.1 Participants are encouraged to self evaluate\nperformance and areas for improvement are\nidentified.\n1.2 Participants”\nreadiness\nfor\nassessment\nis\nmonitored and assistance is provided with the\ncollection\nof\nevidence\nfor\nsatisfactory\nperformance.\n1.3 Training is evaluated against objectives in the\ncontext of self-assessment, participant feedback,\nsupervisor comments and measurements.\n1.4 Training details are recorded according to\nenterprise and legislative requirements.\n1.5 Results of evaluation are utilized to guide further\ntraining.\n\n--- PDF PAGE 37 ---\n________________________________________________________________________________________________________________________________ 35\n\nTR – Commercial Cooking NCIII Promulgated April 2007\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Training needs\nRelevant information to identify training needs\nmay include but not limited to:\n1.1 Industry/enterprise or other performance\ncompetency standards\n1.2 Industry/workplace training practices\n1.3 Job descriptions\n1.4 Results of training needs analysis\n1.5 Business plans of the organization which\nidentify skill development requirements\n1.6 Standard operating and/or other workplace\nprocedures\n\n2. Appropriate personnel\nMay include but not limited to:\n1.1 Team leaders/supervisors/technical experts\n1.2 Managers/employers\n1.3 Training and assessment coordinators\n1.4 Training participants\n1.5 Representative from government regulatory\nbodies\n1.6 Union/employee representatives\n3. Training delivery methods\nMay include but not limited to:\n1.1 Presentations\n1.2 Demonstrations\n1.3 Explanations\n1.4 Problem solving\n1.5 Mentoring\n1.6 Experiential learning\n1.7 Group work\n1.8 Job rotation\n4.Strategies and techniques\nMay include but not limited to:\n4.1 Active listening\n4.2 Targeted questioning\n4.3 Points of clarification\n4.4 Group discussions\n\n--- PDF PAGE 38 ---\n________________________________________________________________________________________________________________________________ 36\n\nTR – Commercial Cooking NCIII Promulgated April 2007\n\n5.Components of competency\nMay include but not limited to:\n5.1 Task skill\n5.2 Task management skills\n5.3 Contingency management skills\n5.4 Job/role environment skills\n5.5 Transfer and application of skills and\nknowledge of new contents\n6. Needs of participants\nCharacteristics of training participants may include\nbut not limited to:\n1.1. Cultural, language, and educational\nbackground\n1.2. Gender\n1.3. Physical ability\n1.4. Level of confidence, nervousness or anxiety\n1.5. Age\n1.6. Previous experience with the topic\n1.7. Experience in training and assessment\n\n--- PDF PAGE 39 ---\n________________________________________________________________________________________________________________________________ 37\n\nTR – Commercial Cooking NCIII Promulgated April 2007\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1. Demonstrated the ability to identify specific training\nneeds and required competency outcomes.\n1.2. Demonstrated the ability to outline the training approach\nand steps to be followed.\n1.3. Demonstrated the ability to identify training participant(s)\nand delivery method(s) to be used\n1.4. Demonstrated the ability to organize and conduct the\ntraining.\n 2. Underpinning\nKnowledge\n2.1. Identification of evidence of competency\n2.2. Competency in the units being taught\n2.3.Training delivery methods\n3. Underpinning\nSkills\n3.1. Planning and documenting training approaches\n3.2. Training delivery methods\n3.3. Training strategies and techniques which facilitate\nlearning process\n3.4. Correct use of equipment and presentation skills\nappropriate for the training\n3.5. Communication skills (written and oral)\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1. Project or work activities that allow the candidate to\ndemonstrate planning, conducting and review of training\non a one-to-one or small group basis.\n4.2. Access to records, logbooks, reports and other sources\nof information about the operation and/or the personnel.\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1 Direct observation of performance in the conduct of the\ntraining\n5.2 Evaluation of the training plans and documents prepared\nby the candidate\n5.3 Oral or written questions to assess knowledge in training\nneeds analysis\n6. Context for\nAssessment\n6.1 Competency assessment may occur in workplace or any\nappropriately simulated environment\n6.2 Assessment shall be observed on multiple occasions\ninvolving a combination of direct, indirect and\nsupplementary forms of evidence.\n\n--- PDF PAGE 40 ---\n________________________________________________________________________________________________________________________________ 38\n\nTR – Commercial Cooking NCIII Promulgated April 2007\n\nUNIT OF COMPETENCY\n: ESTABLISH AND CONDUCT BUSINESS\nRELATIONSHIPS\n\nUNIT CODE\n : TRS311209\n\nUNIT DESCRIPTOR : This unit deals with the skills and knowledge required\nto manage business relationships with customers or\nsuppliers within a tourism or hospitality context. It\nfocuses on the relationship building and negotiation\nskills.\n\nELEMENT\nPERFORMANCE CRITERIA\nBold and italicized terms are elaborated in the\nRange of Variables\n1. Establish and conduct\nbusiness relationships\n1.1 Relationships are established within the\nappropriate cultural context in a manner that\npromotes goodwill and trust between the\nenterprise, its customers and suppliers.\n1.2 Trust and respect are built in business\nrelationships through use of effective\ncommunication skills and techniques\n1.3 Opportunities to maintain regular contact with\ncustomers and suppliers are identified and taken\nup.\n2. Conduct negotiations\n2.1 Negotiations are conducted in a business-like\nand professional manner within the relevant\ncultural context.\n2.2 Negotiations are conducted in the context of the\ncurrent enterprise marketing focus.\n2.3 Benefits for all parties in the negotiation are\nmaximized through use of established techniques\nand in the context of establishing long term\nrelationships.\n2.4 Feedback and input from colleagues are\nincorporated into the negotiation.\n2.5 The results of negotiations are communicated to\nappropriate colleagues and stakeholders within\nthe appropriate timeframes.\n\n--- PDF PAGE 41 ---\n________________________________________________________________________________________________________________________________ 39\n\nTR – Commercial Cooking NCIII Promulgated April 2007\n\n3. Make formal business\nagreements\n3.1 Agreements are confirmed in writing using formal\ncontracts and in accordance to enterprise\nrequirements.\n3.2 Appropriate approvals for all aspects of formal\nagreements are checked and obtained in\naccordance with enterprise procedures.\n3.3 The need for specialist advice in the development\nof contracts is identified and sought where\nappropriate.\n4.Foster and maintain\nbusiness relationships\n4.1 Information needed to maintain sound business\nrelationships are pro-actively sought, reviewed and\nacted upon.\n4.2 Agreements are honored within the scope of\nindividual responsibility.\n4.3 Adjustments to agreements are made in\nconsultation with the customer/supplier and\ninformation are shared with appropriate colleagues.\n4.4 Relationships are nurtured through regular contact.\n\n--- PDF PAGE 42 ---\n________________________________________________________________________________________________________________________________ 40\n\nTR – Commercial Cooking NCIII Promulgated April 2007\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Business relationships\nMay include but not limited to:\n1.1 Customers\n1.2 Suppliers\n1.3 Government agencies\n1.4 Concessionaires\n2. Opportunities\nMay include but not limited to:\n2.1 Informal social occasions\n2.2 Industry functions\n2.3 Association membership\n2.4 Co-operative promotions\n2.5 Program of regular telephone contact\n3. Negotiations\nMay include but not limited to:\n3.1 Corporate accounts\n3.2 Service contacts\n3.3 Agency agreements\n3.4 Venue contracts\n3.5 Rate negotiations\n3.6 Marketing agreements\n3.7 Preferred product agreements\n4. Techniques\n4.1. May include but not limited to:\n4.2. Identification of goals, limits\n4.3. Clarification of needs of all parties\n4.4. Identifying points of agreement and points of\ndifference\n4.5. Preparatory research of facts\n4.6. Active listening and questioning\n4.7. Non-verbal communication techniques\n4.8. Appropriate language\n4.9. Bargaining\n4.10. Developing options\n4.11. Confirming agreements\n4.12. Appropriate cultural behavior\n\n--- PDF PAGE 43 ---\n________________________________________________________________________________________________________________________________ 41\n\nTR – Commercial Cooking NCIII Promulgated April 2007\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Demonstrated the ability to conduct successfully\nbusiness negotiations\n1.2 Demonstrated the ability to build and maintain\nrelationships o achieve successful business outcomes\n1.3 Demonstrated the knowledge and understanding of the\ncurrent environment and major industry issues in which\ntourism and/or hospitality businesses operate.\n 2. Underpinning\nKnowledge\n2.1 Business environment including major industry issues in\nwhich the tourism and hospitality industry operates.\n2.2 Legal issues that affect negotiations and contracts\n2.3 General knowledge about contracts.\n3. Underpinning\nSkills\n3.1 Negotiation and communication techniques appropriate\nto negotiations.\n3.2 Interpersonal skills\n3.3 Mathematical skills i.e. calculating profit margins for the\ncontract\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1. Project or work activities conducted over a period of time\nso that all aspects of the unit can be assessed.\n4.2. Relationship-building and negotiation activities with a\nrange of individuals with whom the candidate has an\nactual or potential business relationship.\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1. Evaluation of negotiation and business relationships or\nagreements conducted or made by the candidate\n5.2. Evaluation of reports prepared by the candidate detailing\nhow the negotiation aspects of a project were managed.\n5.3. Case studies to assess application of knowledge to\nbusiness situations.\n6. Context for\nAssessment\n6.1. Competency assessment may occur in workplace or any\nappropriately simulated environment\n6.2. Assessment shall be observed on multiple occasions\ninvolving a combination of direct, indirect and\nsupplementary forms of evidence.\n\n--- PDF PAGE 44 ---\n________________________________________________________________________________________________________________________________ 42\n\nTR – Commercial Cooking NCIII Promulgated April 2007\n\nCORE COMPETENCIES\n\nUNIT OF COMPETENCY:\nPLAN AND PREPARE FOOD FOR ALA CARTE &\nBUFFETS\n\nUNIT CODE\n : TRS512345\n\nUNIT DESCRIPTOR : This unit deals with the knowledge, skills, behavior and\nmotivations required to plan and prepare foods for ala\ncarte and buffet situations.\n\nELEMENT\nPERFORMANCE CRITERIA\nBold and italicized terms are elaborated in the\nRange of Variables\n1. Plan ala carte and buffet items\n1.1 The ala carte and buffet is planned\naccording to enterprise and/or customer\n requirements.\n1.2 Appropriate food items are selected\naccording to season, budget, occasion\nand customer requirements.\n1.3 Food cost is calculated in accordance with\nbudget and reporting requirements\n1.4 Layout and display of the buffet are\nplanned, in accordance with the type of\nfood, occasion and desired theme.\n1.5 Buffet centerpieces & decoration are\ndesigned organized and produced\naccording to enterprise procedures.\n\n--- PDF PAGE 45 ---\n________________________________________________________________________________________________________________________________ 43\n\nTR – Commercial Cooking NCIII Promulgated April 2007\n\nELEMENT\nPERFORMANCE CRITERIA\nBold and italicized terms are elaborated in the\nRange of Variables\n2. Prepare, produce and present\nfoods for ala carte and buffets\n2.1 Appropriate methods of cookery are\nused to prepare meats, poultry, seafood\nand other foods for ala carte and buffets.\n2.2 Buffet items are glazed with aspic or\ngelatin preparations according to\nacceptable enterprise standards\n2.3 Sauces and garnishes suitable for ala\ncarte and buffet food items are produced.\n2.4 Meats are carved and served according\nto enterprise standards.\n2.5 Hot and cold foods are served and\npresented according to health and\nhygiene regulations.\n 2.6 Portion control is applied to minimize\nwastage and maximize profit.\n2.7 Food items are attractively and tastefully\narranged and presented to maximize\nappeal.\n2.8 Desserts suitable for ala carte and buffet\npresentation are prepared and produced\nusing standard and/or enterprise recipes\n3. Store ala carte and buffet items\n3.1 Store ala carte and buffet items\nhygienically and correctly before and\nafter the service time, at a safe\ntemperature.\n3.2 Proper portioning for storage must be\nundertaken, together with dates to\nfacilitate “first in, first out” procedures.\n\n--- PDF PAGE 46 ---\n________________________________________________________________________________________________________________________________ 44\n\nTR – Commercial Cooking NCIII Promulgated April 2007\n\nRANGE OF VARIABLES\n\nThis unit applies to all hospitality and catering enterprises where food is prepared\nand served such as restaurants, hotels, clubs, cafeterias and other catering\noperations.\n\nAla carte and buffets may be associated with functions, special occasions and\ncelebrations, breakfast, lunch or dinner service.\n\nFood items for ala carte and buffets may be derived from classical or contemporary\nrecipes and from varying ethnic origins.\n\nVARIABLE\n\nRANGE\n\n1. Ala carte food\nMay include but not limited to:\n1.1 Selection of hot and cold dishes\n1.2 Appetizers, entrees, salads, desserts\n1.3 Meats, poultry, fish, small goods, salads and\ncheeses\n2. Buffet food\nMay include but not limited to:\n2.1 Selection of hot and cold dishes\n2.2 Glazed foods, galantines, forcemeats\n2.3 Meats, poultry, fish, small goods, salads,\ncheeses\n2.4 Dessert and pastry (hot and cold) items\n3. Centerpieces & decorations\n May Include but not limited to:\n3.1 Floral arrangements\n3.2 Fruits & vegetable display\n3.3 Special theme items\n3.4 Candles\n3.5 Special Occasion cakes\n3.6 Glassware & service ware\n3.7 Ice, fruits or vegetable, chocolate salt or\n margarine carvings\n\n--- PDF PAGE 47 ---\n________________________________________________________________________________________________________________________________ 45\n\nTR – Commercial Cooking NCIII Promulgated April 2007\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\n Competency\nAssessment requires evidences that the candidate:\n1.1 Demonstrated the ability to plan all the details and\nresources for the buffet including food items, costing,\nlayout and display.\n1.2 Demonstrated expertise in preparing buffet dishes within\ntypical workplace time constraints.\n1.3 Demonstrated complete understanding of the different\nnature and handling requirements for buffet food items.\n1.4 Demonstrated ability to apply safe and hygienic\npractices in the preparation and service of buffets.\n2. Underpinning\n Knowledge\n2.1 Suitable types of foods and dishes for buffets to meet\nenterprise, customer, nutritional and cultural\nrequirements.\n2.2 Characteristics of food items suitable for buffets and\nappropriate service conditions and temperatures to\nmaintain optimum quality.\n2.3 Nutrition, in particular, the effects of cooking on the\nnutritional value of food, and ensuring a nutritional\nbalance in buffet menus.\n2.4 Culinary and technical terms commonly used in the\nindustry associated with buffets.\n2.5 Food danger zone\n2.6 Legislation of food safety related to service of food for\nbuffets.\n3. Underpinning\n Skills\n3.1 A range of cookery skills for varieties of food items.\n3.2 Principles and practices of hygiene, particularly related\nto issued surrounding buffet service.\n3.3 Logical and time efficient workflow.\n3.4 Presentation techniques for food item that make-up a\nbuffet.\n3.5 Waste minimization techniques and environmental\nconsiderations in specific relation to buffets.\n4. Resource\n Implications\nThe following resources MUST be provided:\n4.1 Fully equipped operational commercial kitchen including\nindustry-current tools, utensils and equipment\n4.2\nIngredients\n\n--- PDF PAGE 48 ---\n________________________________________________________________________________________________________________________________ 46\n\nTR – Commercial Cooking NCIII Promulgated April 2007\n\n5. Method of\n Assessment\nCompetency may be assessed through:\n5.1 Direct observation of the candidate preparing food for\nbuffets.\n5.2 Sampling of buffet items prepared by the candidate.\n5.3 Written or oral questions to test knowledge about\nsuitable items for buffets, food safety issues.\n5.4 Review of portfolios of evidence and third party\nworkplace reports of on-the-job performance by the\ncandidate.\n6. Context for\n Assessment\n6.1 Assessment may be done in the workplace or in a\nsimulated workplace setting (assessment centers)\n6.2 Assessment activities are carried out through TESDA’s\naccredited assessment center\n\n--- PDF PAGE 49 ---\n________________________________________________________________________________________________________________________________ 47\n\nTR – Commercial Cooking NCIII Promulgated April 2007\n\nUNIT OF COMPETENCY: PLAN AND CONTROL MENU-BASED CATERING\n\nUNIT CODE\n : TRS512346\n\nUNIT DESCRIPTOR : This unit deals with the basic planning, preparing and\ncontrolling of menu-based catering within established\nenterprise systems.\n\nELEMENT\n\nPERFORMANCE CRITERIA\nBold and italicized terms are elaborated in the\nRange of Variables\n1. Plan and prepare menus\n1.1 Enterprise and/or customer requirements are\nidentified for menus.\n1.2 Menu items are determined according to the\ndifferent menu planning considerations.\n1.3 Costs of menu items are established and\ncompliance is ensured with enterprise costing\nconstraints.\n1.4 Menus are prepared as required by the\nenterprise, type of cuisine or particular situation\n1.5 Menus are organized and written using:\n Terminology appropriate to the market and\nstyle of menu.\nItem descriptions which promote menu items.\n2. Control menu-based catering\n2.1 Appropriate catering control systems are\nselected and used according to enterprise\nrequirements.\n2.2 Production schedules are planned giving\nconsideration to menu constraints, available\nequipment, expertise of labor and available time.\n2.3 Labor costs are controlled considering the\nroster, scheduling, award conditions and rates.\n2.4 Product utilization and quality is optimized\nthrough the application of portion control and\neffective yield testing.\n2.5 Stock control measures are applied by following\ncorrect receiving and storing procedures\n2.6 Security procedures in food production and\nstorage areas are applied to minimize risks of\ntheft, damage or loss.\n\n--- PDF PAGE 50 ---\n________________________________________________________________________________________________________________________________ 48\n\nTR – Commercial Cooking NCIII Promulgated April 2007\n\nELEMENT\n\nPERFORMANCE CRITERIA\nBold and italicized terms are elaborated in the\nRange of Variables\n3. Practice portion control\n3.1\n Correct portioning activities are identified\nthrough\n• Weight\n• Volume\n• Count\n3.2\nCorrect tools portioning are calculated and\nused.\n\n--- PDF PAGE 51 ---\n________________________________________________________________________________________________________________________________ 49\n\nTR – Commercial Cooking NCIII Promulgated April 2007\n\nRANGE OF VARIABLES\n\nThis unit applies to all hospitality and catering enterprises where food is prepared\nand served such as restaurants, hotels, clubs, cafeterias and other catering\noperations.\n\nVARIABLE\n\nRANGE\n1. Types of menus\nMay include but not limited to:\n1.1 Menus may be classified according to how\nfood items are offered and priced:\n• Table d’hote (Selective or Non-Selective)\n• A la carte\n1.2 Menus may be classified according to how\n often they are changed\n• Cyclical\n• Fixed menu\n• Day’s menu\n1.3 Menus may be based on meal types\n• Breakfast\n• Lunch\n• Dinner\n• Snack\n1.4 Menus may be utilized for\n• Function\n• Buffet\n• Ala carte\n1.5 Types of menus\n• Classical\n• Modern\n• Ethnic\n2. Menu planning concerns\nMay include but not limited to:\n2.1 Balance in the variety of cooking method,\n colors, tastes and food textures\n2.2 Nutritional values\n2.3 Seasonal availability\n2.4 pricing versus cost\n2.5 popularity index\n2.6 Results of sales analysis and customer\n feedback.\n\n--- PDF PAGE 52 ---\n________________________________________________________________________________________________________________________________ 50\n\nTR – Commercial Cooking NCIII Promulgated April 2007\n\n3. Catering control systems\nMay include but not limited to:\n3.1 Production planning sheets\n3.2 Sales analysis forms\n3.3 Daily kitchen reports\n3.4 Wastage sheets\n4. Costing restraints\nMay include but not limited to:\n4.1 Enterprise policy on menu pricing and gross\nmargins. Budgets\n4.2 Labor requirements\n\n--- PDF PAGE 53 ---\n________________________________________________________________________________________________________________________________ 51\n\nTR – Commercial Cooking NCIII Promulgated April 2007\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\n Competency\nAssessment requires evidences that the candidate:\n1.1 Demonstrated proficiency in costing and pricing menus.\n1.2 Demonstrated ability to plan multiple menus to meet\ndiffering customer and operational needs.\n1.3 Demonstrated expertise in planning menus given the\nconstraints on the resources available.\n1.4 Demonstrated ability to control costs.\n1.5 Demonstrated adeptness in analyzing and applying current\nindustry data and prices\n 2. Underpinning\nKnowledge\n2.1 Menu Planning procedures\n2.2 Different types and styles of menus\n2.3 Historical development of menus, modern trends in menus\n2.4 Quantity Food Production and Cost Control\n2.5 Principles of nutrition\n Dietary Guidelines for Australians\n Planning nutritionally-balanced menus\n The effects of cooking on the nutritional value of food\n2.6 Culinary terms related to menus commonly used in the\nindustry.\n 2.7 Recipe/Menu Costing\n 3. Underpinning Skills 3.1 Various ways of sequencing food items, including classical\nand contemporary.\n3.2 Organizational skills and teamwork.\n3.3 Logical and time efficient workflow.\n3.4 Inventory and stock control systems.\n3.5 Purchasing, receiving, storing, holding and issuing\nprocedures.\n3.6 Costing, yield testing and portion control.\n4. Resource\n Implications\nThe following resources MUST be provided:\n4.1 Fully equipped kitchen\n4.1 Ingredients appropriate for production\n4.2 Recipe costs worksheets\n4.3 Work schedules\n4.4 Banquet event forms inventory\n5. Method of\nAssessment\nCompetency may be assessed through:\n5.1 Review of samples of menus, production schedules,\nsecurity plans and checklists prepared by the candidate.\n5.2 Oral or written questions to assess knowledge of menu\nitems, menu types and characteristics, portion control and\ncost control.\n5.3 Review of portfolios of evidence and third party workplace\nreports of on-the-job performance by the candidate.\n\n--- PDF PAGE 54 ---\n________________________________________________________________________________________________________________________________ 52\n\nTR – Commercial Cooking NCIII Promulgated April 2007\n\n6. Context for\nAssessment\n6.1 Assessment may be done in the workplace or in a\nsimulated workplace setting (assessment centers)\n6.2 Assessment activities are carried out through TESDA’s\naccredited assessment center\n\n--- PDF PAGE 55 ---\n________________________________________________________________________________________________________________________________ 53\n\nTR – Commercial Cooking NCIII Promulgated April 2007\n\nUNIT OF COMPETENCY: ORGANIZE BULK COOKING OPERATIONS\n\nUNIT CODE\n : TRS512347\n\nUNIT DESCRIPTOR : This unit deals with the organizational process required to\norganize bulk-cooking operations. It covers those\noperations where food is provided to large numbers of\npeople and where food production systems are utilized\nrather than food being prepared in a la carte situation.\n\nELEMENT\n\nPERFORMANCE CRITERIA\nBold and italicized terms are elaborated in the Range of\nVariables\n1. Plan kitchen operations for\nbulk cooking\n1.1 Quantities are determined and accurately\ncalculated according to recipes and\nspecifications.\n1.2 Food items are ordered in correct quantities for\nrequirements.\n1.1 A mise en place list, which is clear, complete\nand appropriate to the situation, is prepared for\nfood equipment.\n1.4 A work schedule and workflow plan is designed\nfor the relevant section of kitchen to maximize\nteamwork and efficiency.\n2. Organize production of bulk\ncooking menus\n2.1 Operation and service of orders are organized\nfor the relevant section of the kitchen to enable\nsmooth workflow and to minimize delays.\n2.2 The sequence of dishes is controlled to enable\nsmooth workflow and minimize delays.\n2.3 Quality control is exercised in all stages of\npreparation with focus on design, eye appeal\nand portion size.\n2.4 Appropriate receiving, storing and cleaning\nprocedures are established and correctly\nfollowed.\n3. Select systems for bulk\ncooking\n3.1 Appropriate food production systems are\nselected for bulk cooking according to relevant\nfactors.\n3.2 Appropriate equipment is identified to assist\nproduction and cooking operations.\n\n--- PDF PAGE 56 ---\n________________________________________________________________________________________________________________________________ 54\n\nTR – Commercial Cooking NCIII Promulgated April 2007\n\nELEMENT\n\nPERFORMANCE CRITERIA\nBold and italicized terms are elaborated in the Range of\nVariables\n4. Use preparation and cooking\ntechniques appropriate to the\nbulk cooking system\n4.1 Menu items, which are compatible with the type\nof system chosen, are selected.\n4.2 Specialty recipes are prepared and served\ntaking into account the type of food service\nsystem.\n4.3 Food is prepared using methods which take into\naccount the effects of different methods of\npreparation on nutrition quality and structure.\n4.4 Systems and equipment are safely and\nhygienically used.\n\n--- PDF PAGE 57 ---\n________________________________________________________________________________________________________________________________ 55\n\nTR – Commercial Cooking NCIII Promulgated April 2007\n\n RANGE OF VARIABLES\n\nThis unit applies to all hospitality and catering enterprises where food is prepared\nand served such as restaurants, hotels, clubs, cafeterias and other catering\noperations. The following explanations identify how this may be applied in different\nworkplaces, sectors and circumstances.\n\nThe selection of food production systems refers to the selection of systems already\ninstalled in an enterprise.\n\nVARIABLE\n\nRANGE\n1. Food production system\nMay include but not limited to:\n1.1 Fresh cook\n1.2 Cook-chill to five day shelf life\n1.3 Cook-chill - extended life\n1.4 Cook-freeze\n2. Factors affecting selection of food\n production systems\nMay include but not limited to:\n2.1 Type of food to be prepared\n2.2 Quantity of food\n2.3 Timeframe\n2.4 Customer requirements\n2.5 Menu type\n2.6 Enterprise practices\n3. Appropriate equipment to assist\n cooking operations\nMay include but not limited to:\n3.1 Receiving\n3.2 Storage\n3.3 Preparation\n3.4 Cooking\n3.5 Post cooking storing\n3.6 Re-thermalization where applicable\n3.7 Serving\n4. Specialty recipes\nMay include but not limited to:\n4.1 recipes that are uniquely prepared by the\nestablishment\n4.2 food that is popular in the establishment\n\n--- PDF PAGE 58 ---\n________________________________________________________________________________________________________________________________ 56\n\nTR – Commercial Cooking NCIII Promulgated April 2007\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidences that the candidate:\n1.1 Demonstrated ability to produce bulk food and maintain\nquality outcomes.\n1.2 Demonstrated ability to prepare mise en place according to\nestablished standard procedures.\n1.3 Applied safe work practices in relation to manual handling\nuse of equipment and heated surfaces.\n1.4 Demonstrated skills in designing work schedules and\nworkflow plan to maximize teamwork and efficiency.\n1.5 Demonstrated ability to accurately calculate and determine\nquantities for bulk cooking.\n2. Underpinning\n Knowledge\n2.1 Theory\n2.1.1\nPrinciples of Nutrition\n2.1.2\nFood Safety\n2.1.3\nQuantity Food Production\n2.1.4\nFood Production Systems\n2.1.5\nPrinciples and practices of hygiene\n related to food production systems\n2.2 Equipment requirements for particular food\n production systems.\n2.3 Culinary terms commonly used in the\n industry related to food production systems.\n2.4 Relevant legislation concerning occupational health and\nfood safety.\n3. Underpinning Skills 3.1 Organizational skills and teamwork.\n3.2 Skills in safe work practices, in particular in relation to\nbending and lifting, using equipment, contact with steam\nand heated surfaces.\n3.3 Logical and time efficient workflow.\n3.4 Purchasing, receiving, storing, holding and issuing\nprocedures in relation to bulk cooking.\n3.5 Costing, yield testing, portion control in relation to bulk\ncooking.\n4. Resource\n\nImplications\nThe following resources MUST be provided:\n4.1 A fully-equipped operational commercial kitchen (including\nindustry-current equipment) including full coordination of\nmore than one bulk cooking operation.\n4.2 Use of real ingredients.\n\n--- PDF PAGE 59 ---\n________________________________________________________________________________________________________________________________ 57\n\nTR – Commercial Cooking NCIII Promulgated April 2007\n\n5. Method of\nAssessment\nCompetency may be assessed through:\n5.1 Evaluation of reports prepared by the candidate detailing\nthe processes used for an actual bulk cooking operation\nincluding key factors for success and lessons to be learned\nfor future operations.\n\n5.2 Direct observation of the candidate using bulk cooking\nequipment.\n5.3 Sampling of dishes prepared as part of a bulk cooking\noperation.\n5.4 Oral or written questions to assess knowledge of\ncommodities, techniques and features of bulk cooking\noperations to maintain quality, storage, food hygiene.\n5.5 Case studies to assess ability to create procedures and\nsystems to different bulk cooking situations.\n5.6 Review of portfolios of evidence and third party workplace\nreports of on-the-job performance by the candidate.\n6. Context for\nAssessment\n6.1 Assessment may be done in the workplace or in a\nsimulated workplace setting (assessment centers)\n6.2 Assessment activities are carried out through TESDA’s\naccredited assessment center\n\n--- PDF PAGE 60 ---\n________________________________________________________________________________________________________________________________ 58\n\nTR – Commercial Cooking NCIII Promulgated April 2007\n\nUNIT OF COMPETENCY: PREPARE PATES AND TERRINES\n\nUNIT CODE\n : TRS512348\n\nUNIT DESCRIPTOR : This unit deals with the specialist skills and knowledge,\nskills, behavior and motivations required to prepare\npates and terrines.\n\nELEMENT\n\nPERFORMANCE CRITERIA\nBold and italicized terms are elaborated in the Range of\nVariables\n1. Prepare pates and terrines\n1.1 A range of pates and terrines are prepared\naccording to standard recipes.\n1.2 Appropriate ingredients are selected for\nproduction of pates and terrines.\n1.3 Lining of moulds for pates and terrines are\nprepared using suitable ingredients.\n1.4 A range of binding agents and processes are\nused in the preparation of basic forcemeat.\n1.6 A range of pastries suitable for pate en croute\nare prepared and correctly handled to ensure\nhigh quality and attractive presentation.\n1.7 Specialized equipment and machinery for\nmaking pates and terrines are correctly and\nsafely operated according to manufacturer’s\ninstructions.\n2. Present pates and terrines\n2.1 Pates and terrines are attractively presented for\nvarious uses including, but not limited to\nappetizers, entrees or buffets.\n2.1 Pates and terrines are appropriately decorated\ngiving consideration to contemporary tastes,\ncolor presentation and eye appeal.\n3. Develop new recipes\n3.1 Recipes for pates and terrines are developed\nusing a range of suitable products giving\nconsideration to tastes and presentation.\n3.2 New recipes for pates and terrines are tested for\ntaste, yield and customer acceptance.\n\n--- PDF PAGE 61 ---\n________________________________________________________________________________________________________________________________ 59\n\nTR – Commercial Cooking NCIII Promulgated April 2007\n\nRANGE OF VARIABLES\n\nThis unit applies to all hospitality and catering enterprises where food is prepared\nand served such as restaurants, hotels, clubs, cafeterias and other catering\noperations. The following explanations identify how this may be applied in different\nworkplaces, sectors and circumstances\n\nPates and terrines refer to any edible food that has been ground or pureed to a paste\nand set and/or baked in a container or mould. They can be made from a range of\ningredients including meats, poultry, game, seafood, fruits and vegetables. Terrines\nare generally of a coarser consistency than pates and are baked in a pot (a terrine)\nafter which they are named. Pates en croute are pates or terrines that have been\nbaked in a pastry casing.\n\nA variety of pates and terrines must be made. They can either be classical or\nmodern, and varying in ethnic and cultural origins. A variety of new recipes for pates\nand terrines must also be produced.\n\nVARIABLE\n\nRANGE\n1. Pates and terrines\n\nMay include but not limited to spreadable pastes\nmade from\n1.1\nmeat\n1.2\nvegetables\n1.3\nfish\n1.4 fruits\n2. Appropriate ingredients for\nmaking pates, pâtés en croute\nand terrines\nMay include but not limited to:\n2.1 Dairy foods\n2.2 Vegetables\n2.3 Offal, livers\n2.4 Poultry\n2.5 Game\n2.6 Veal, ham and port\n2.7 Fish and shellfish\n2.8 Filipino native game,\n2.9\nFruits and fruit products\n3. Appropriate ingredients for lining\nmoulds\nMay include but not limited to:\n3.1 Pork fat\n3.2 Pork caul\n3.3 Vegetables\n3.4 Pastry\n3.5\nSkins\n\n--- PDF PAGE 62 ---\n________________________________________________________________________________________________________________________________ 60\n\nTR – Commercial Cooking NCIII Promulgated April 2007\n\n4. Basic forcemeat\nMay include but not limited to:\n4.1 stuffing\n4.2 mixtures of raw or cooked ingredients, choppe\nor minced or ground, used to stuff eggs, fish,\npoultry, game, meat vegetables or pasta.\n4.3 three main types of forcemeat are\n• those made with meat, game or poultry\n• those made with fish,\n•\nthose made with vegetables.\n5. Equipment for making pates and\nterrines\nMay include but not limited to:\n5.1 Bowl cutters or food processors\n5.2 Food mills and blenders\n5.3 Mincers\n\n--- PDF PAGE 63 ---\n________________________________________________________________________________________________________________________________ 61\n\nTR – Commercial Cooking NCIII Promulgated April 2007\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidences that the candidate:\n1.1 Explained and described in detail the different products\ncommodities suitable for pates and terrines.\n1.2 Demonstrated expertise in preparing pates and terrines\nto meet enterprise standards.\n1.3 Demonstrated skills in presenting pates and terrines\nprofessionally.\n1.4 Demonstrated ability in developing new recipes for pates\nand terrines.\n1.5 Applied safe and hygienic practices in handling and\nstoring of pates and terrines.\n2. Underpinning\nKnowledge\n2.1 Ingredients suitable for making pates and terrines and\ntheir characteristics.\n2.2 Outcomes of the various binding agents and processes\nused in the preparation of pates and terrines.\n2.3 Culinary terms related to pates and terrines commonly\nused in the industry.\n2.4 Principles of nutrition, in particular, the food values of\npates and terrines and the effects of cooking on the\nnutritional value of food.\n3. Underpinning skills\n3.1 Presentation of skills for pates and terrines including\npastry decoration, glazing, layering of ingredients,\nprecision cutting and arranging.\n3.2 Safe work practices, in particular in relation to using\nchopping and mincing equipment.\n3.3 Hygiene requirements particularly relating to possible\nbacterial spoilage in the preparation, storage and service\nof pate and terrine products.\n3.4 Logical and time efficient workflow.\n4. Resource\n\nImplications\nThe following resources MUST be provided:\n4.1 Demonstration of skills in making multiple types of pates\nand terrines within a fully equipped operational\ncommercial kitchen (including industry-current\nequipment)\n4.2 Use of a range of real ingredients suitable for making\npates and terrines.\n4.3 Preparation of pates and terrines within commercially\nrealistic time constraints.\n\n--- PDF PAGE 64 ---\n________________________________________________________________________________________________________________________________ 62\n\nTR – Commercial Cooking NCIII Promulgated April 2007\n\n5. Method of\n Assessment\nCompetency may be assessed through:\n5.1 Direct observation of the candidate using techniques to\nprepare pates and terrines.\n5.2 Sampling of pates and terrines, cookery techniques,\nequipment and food hygiene.\n5.3 Review of portfolios of evidence and third party\nworkplace reports of on-the-job performance by the\ncandidate.\n5. Context for\n Assessment\n6.1 Assessment may be done in the workplace or in\n simulated workplace setting (assessment centers)\n6.2 Assessment activities are carried out through TESDA’s\n accredited assessment center\n\n--- PDF PAGE 65 ---\n________________________________________________________________________________________________________________________________ 63\n\nTR – Commercial Cooking NCIII Promulgated April 2007\n\nUNIT OF COMPETENCY: PLAN, PREPARE AND DISPLAY BUFFET\n\nUNIT CODE\n : TRS512349\n\nUNIT DESCRIPTOR : This unit deals with the advanced skills and knowledge\nrequired to design, plan, prepare and display a buffet\ncreatively.\n\nELEMENT\n\nPERFORMANCE CRITERIA\nBold and italicized terms are elaborated in the Range of\nVariables\n1. Plan and design a buffet\n1.1 Total concept, food items and displays are\ndesigned as required, in consultation with\ncustomers and other relevant personnel.\n1.2 Buffets are planned according to the required\ntheme or occasion, in consultation with\ncustomers and other relevant personnel.\n1.3 An appropriate range and quantity of food items\nare selected and organized giving consideration\nto quality and price according to the enterprise or\ncustomer requirements.\n2. Prepare for the buffet\n2.1 Appropriate service equipment, service ware and\nlinen are selected to display food and\ndecorations.\n2.2 Tables and service points are planned and\narranged so they are suitable for buffet display\nand service according to establishment\nrequirements, occasion and efficient safe\ncustomer/staff accessibility.\n2.3 Food presentation is prepared or organized with\nartistic flair and according to establishment\nstandards or customer requirements.\n2.4 Appropriate and attractive decorations and\ncenterpieces are selected and prepared or\norganized as required.\n2.5 All preparations and arrangements for buffet are\ncoordinated to all concerned individuals.\n3. Display food items.\n3.1 Food items are displayed with a sense of artistry\nto create customer appeal.\n3.2 Garnishes and accompaniments are used to\nenhance taste and appeal.\n3.3 Buffet service is supervised to ensure that food\nitems are replenished and that the total display\nremains neat and attractive.\n\n--- PDF PAGE 66 ---\n________________________________________________________________________________________________________________________________ 64\n\nTR – Commercial Cooking NCIII Promulgated April 2007\n\nELEMENT\n\nPERFORMANCE CRITERIA\nBold and italicized terms are elaborated in the Range of\nVariables\n4. Present buffet in a safe and\nhygienic manner\n4.1 Potential health problems through cross-\ncontamination and food spoilage are identified\nand appropriate preventive measures are taken\nto eliminate these risks.\n4.2 Food on display is kept at temperature levels as\nprescribed by legislation.\n\n--- PDF PAGE 67 ---\n________________________________________________________________________________________________________________________________ 65\n\nTR – Commercial Cooking NCIII Promulgated April 2007\n\nRANGE OF VARIABLES\n\nThis unit applies to all hospitality and catering enterprises where food is prepared\nand served such as restaurants, hotels, clubs, cafeterias and other catering\noperations. The following explanations identify how this may be applied in different\nworkplaces, sectors and circumstances.\n\nBuffets may be associated with various occasions and situations. They may be\nindoors or outdoors.\n\nVARIABLE\n\nRANGE\n1. Various occasions\nMay include but not limited to:\n1.1 Functions\n1.2 Parties\n1.3 Special celebrations\n1.4 Breakfast\n1.5 Lunch\n1.6 Dinner\n2. Customer requirements\nMay include but not limited to:\n2.1 Selection of appropriate food and food items\n2.2 Table arrangements\n2.3 Service equipment\n2.4 Linen\n2.5 Decorations\n2.6 Candles and lighting\n2.7 Centerpieces\n3. Decorations and centerpieces\nMay include but not limited to:\n3.1\nFruits\n3.2\nVegetables\n3.3\nFlowers and plants\n3.4\nSalt\n3.5\nIce\n3.6\nBread\n3.7\nChocolate\n3.8\nSugar\n3.9\nDecorated cakes and display cakes\n3.10\nMargarine\n4. Concerned individuals\nMay include but not limited to:\n4.1\nCustomers/Client or Organizer\n4.2\nSupervisors and managers\n4.3\nDisplay artists and decoration wholesalers\n4.4\nInterior designers and decorators\n4.5\nOther cooks and chefs\n4.6\nService staff\n\n--- PDF PAGE 68 ---\n________________________________________________________________________________________________________________________________ 66\n\nTR – Commercial Cooking NCIII Promulgated April 2007\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\n\n Competency\nAssessment requires evidences that the candidate:\n1.1 Demonstrated skills to plan and design the total concept\nof a buffet.\n1.2 Demonstrated the ability to organize and plan buffet\narrangements including efficient workflow, service and\nphysical layout.\n1.3 Demonstrated ability to coordinate details of the buffet\narrangements to all concerned parties.\n1.4 Demonstrated skillfulness in food presentation and\ngarnishing.\n1.5 Observed and applied safe and hygienic practices in\nfood preparation, service and storage of food.\n2. Underpinning\nKnowledge\n2.1 The design processes for buffets including:\n Balance of dish types\n Nutritional considerations\n Color and style\n Appropriateness of food items for buffets\n Operational constraints.\n Costing issue\n2.2 Legislation on food safety related to service of food for\nbuffet.\n3. Underpinning\n Skills\n3.1 Artistic skills and creativity relating to design and\npresentation of buffets.\n3.2 Techniques for the attractive presentation and display of\nfood, centerpieces and decorations.\n3.3 Principles and practices of hygiene, particularly related to\nissues surrounding buffet service.\n3.4 Logical and time efficient workflow.\n3.5 Waste minimization techniques and environmental\nconsiderations.\n4. Resource\n Implications\nThe following resources MUST be provided:\n4.1 Fully equipped kitchen\n4.2 Ingredients in the preparation of the pates, terrines and\nforced meats\n4.3 Utensils and kitchen tools to prepare the products\n4.4 Project or work activities that allow the candidate to plan\nand coordinate the actual operation of a buffet.\n5. Method of\n Assessment\nCompetency may be assessed through:\n5.1 Evaluation of a buffet (content and presentation) planned\nand coordinated by the candidate.\n5.2 Oral or written questions to assess knowledge of buffet\ndesign issues and options.\n5.3 Review of portfolios of evidence and third party workplace\nreports of on-the-job performance by the candidate.\n\n--- PDF PAGE 69 ---\n________________________________________________________________________________________________________________________________ 67\n\nTR – Commercial Cooking NCIII Promulgated April 2007\n\n6. Context for\n Assessment\n6.1 Assessment may be done in the workplace or in\n simulated workplace setting (assessment centers)\n6.2 Assessment activities are carried out through TESDA’s\n accredited assessment center\n\n--- PDF PAGE 70 ---\n________________________________________________________________________________________________________________________________ 68\n\nTR – Commercial Cooking NCIII Promulgated April 2007\n\nUNIT OF COMPETENCY:\nSELECT, PREPARE AND SERVE SPECIALIZED\nFOOD ITEMS\n\nUNIT CODE\n : TRS512350\n\nUNIT DESCRIPTOR :\nThis unit deals with the skills and knowledge required to\nplan, prepare and present food items at an advanced\nand specialized level, using a variety of non-standard\nfood items and the related specialized techniques. It\ncovers the preparation and service of specialty cuisines\nas part of a general menu as well those offered by\nenterprises which specialize in particular menu items.\n\nELEMENT\n\nPERFORMANCE CRITERIA\nBold and italicized terms are elaborated in the Range of\nVariables\n1. Select specialized food items\n1.1 Suitable suppliers of specialized food items\nare sourced as required.\n1.2 Suppliers are selected taking into consideration\nthe quality and price of products and enterprise\nrequirements.\n1.3 Appropriate purchasing and storage\nprocedures are practiced to minimize wastage.\n2. Plan menus and/or\npromotional strategies\n2.1 Specialized menus and menu items are\nplanned to meet enterprise and customer\nrequirements and appropriate balance or\nintegration with other items is achieved.\n2,2 Menus or promotional strategies are\ndeveloped to incorporate or focus on\nspecialized food items.\n2.2 Menu items are priced to achieve satisfactory\nprofit levels and satisfy enterprise\nrequirements.\n2.3 Seasonal availability is taken into account\nwhen developing menus and promotional\nstrategies.\n2.4 New menu items or dishes are created using\nspecialized foods and taking into consideration\nthe characteristics of varieties of food items,\neating characteristics and taste.\n\n--- PDF PAGE 71 ---\n________________________________________________________________________________________________________________________________ 69\n\nTR – Commercial Cooking NCIII Promulgated April 2007\n\nELEMENT\n\nPERFORMANCE CRITERIA\nBold and italicized terms are elaborated in the Range of\nVariables\n3. Prepare and present (dishes\nusing) specialized food items\n3.1 Specialized food items are prepared ensuring\nappropriate\nflavor\ncombinations,\naesthetic\ncharacteristics and taste.\n3.2 Dishes are cooked in a variety of styles as\nrequired by the menu, enterprise, customer\npreferences.\n3.3 Food items are appropriately presented to\nmaximize appeal.\n3.4 Foods are preserved where appropriate, using\nsuitable techniques.\n4. Implement hygienic and safe\npractices\n4.1 Potential hygiene and safety problems are\nidentified\nand\nappropriate\npreventative\nmeasures are taken to eliminate risk in the\npreparation of specialized food items.\n4.2 Specialized food items are stored hygienically\nand correctly.\n\n--- PDF PAGE 72 ---\n________________________________________________________________________________________________________________________________ 70\n\nTR – Commercial Cooking NCIII Promulgated April 2007\n\nRANGE OF VARIABLES\n\nThis unit applies to all hospitality and catering enterprises where food is prepared\nand served such as restaurants, hotels, clubs, cafeterias and other catering\noperations. The following explanations identify how this may be applied in different\nworkplaces, sectors and circumstances.\n\nVARIABLE\n\nRANGE\n\n1. Specialized food items\nMay include but not limited to:\n1.1 Meats, poultry, and game other than lamb,\nbeef, pork and chicken.\n1.2 Offal and specialist meat products\n1.3 Unusual fish, shellfish and other foods from\nsea or fresh water.\n1.4 Aromatics, flavorings, spices and herbs.\n1.5 Seeds and nuts\n1.6 Fungi\n1.7 Preserves, condiments and accompaniments\n1.8 Commodities from ethnic cuisines and cultural\ntradition such as Mexican, Asian, Middle East\n1.9 Fruits, vegetables, flowers and salad items\n1.10 Aquatic plants such as seaweeds\n1.11 Specialist cheeses and dairy products\n1.12 Bush foods and native Philippine ingredients\n1.13 Specialist cakes, pastries, bread, desserts,\npreserves and sweets\n2. Promotional Strategies\nMay include but not limited to:\n 2.1 Menus\n2.2 “specials” lists\n2.3 blackboards\n2.4 fliers and pamphlets\n2.2 media releases\n3. Specialized preparation and\n cooking\nMay include but not limited to:\n3.1 Marinating, coating\n3.2 Tenderizing\n3.3 Hanging of meat, poultry and game\n3.4 Preserving: Drying, salting, pickling, smoking\n (hot and cold)\n3.5 Techniques such as cooking on salt, using\n special ovens and cooking utensils\n3.6 Earth oven cooking\n\n--- PDF PAGE 73 ---\n________________________________________________________________________________________________________________________________ 71\n\nTR – Commercial Cooking NCIII Promulgated April 2007\n\nVARIABLE\n\nRANGE\n\n4. Preventative measures\nMay include but not limited to:\n4.1 Identifying and discarding poisonous or non-\nedible parts of food items.\n4.2 Safe handling of food items with potential for\ninjury, such as spines and thorns\n4.3 Using particular cooking techniques to maximize\nquality and appeal\n4.4 Safe and hygienic operation of food preparation\nequipment.\n\n--- PDF PAGE 74 ---\n________________________________________________________________________________________________________________________________ 72\n\nTR – Commercial Cooking NCIII Promulgated April 2007\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\n\n Competency\nAssessment requires evidences that the candidate:\n1.1\nDemonstrated ability in selecting appropriate cooking\nmethods to specialized food products.\n1.2\nDemonstrated ability to plan specialized menu and\nmenu items.\n1.3\nDemonstrated skills in preparing and presenting\nspecialized food items.\n2. Underpinning\nKnowledge\n2.1\nMenu Planning\n2.2\nSpecialized food items\n2.3\nPurchasing\n2.4\nPreparing, cooking and storing specialized food items.\n2.5\nCulinary terms used to describe specialized items and\nequipment.\n2.6\nHistory and significance of specialized food items.\n3. Underpinning skills\n3.1\nAdvanced and/or specialized preparation and cooking\ntechniques.\n3.2\nPurchasing and storage of specialist food items.\n4. Resource\n Implications\nThe following resources MUST be provided:\n4.1\nDemonstration of skills within a suitably equipped food\npreparation area (i.e. environment suited to the item in\nquestion).\n4.2\nUse of a variety of specialized food items.\n4.3\nPreparation of specialized menu items within typical\nworkplace time constraints.\n5. Method of\n Assessment\nCompetency may be assessed through:\n5.1\nDirect observation of the candidate preparing\nspecialized food items.\n5.2\nCase studies to assess ability to suggest and prepare\nspecialized food in response to particular needs.\n5.3\nSampling of food items prepared by the candidate.\n5.4\nWritten or oral questions to test knowledge of\nspecialized food items.\n5.5\nReview of portfolios of evidence and third party\nworkplace report of on-the-job performance by the\ncandidate.\n6. Context for\n Assessment\n6.1 Assessment may be done in the workplace or in a\nsimulated workplace setting (assessment centers)\n6.2 Assessment activities are carried out through TESDA’s\naccredited assessment center\n\n--- PDF PAGE 75 ---\n________________________________________________________________________________________________________________________________ 73\n\nTR – Commercial Cooking NCIII Promulgated April 2007\n\nUNIT OF COMPETENCY:\nSELECT, PREPARE AND SERVE SPECIALTY\n\nCUISINES\n\nUNIT CODE\n : TRS512351\n\nUNIT DESCRIPTOR :\nThis unit deals with the skills and knowledge required in\nthe preparation and service of a range of specialized\nitems offered by enterprises which specialize in\nparticular cuisine style.\n\nELEMENT\n\nPERFORMANCE CRITERIA\nBold and italicized terms are elaborated in the Range of\nVariables\n1. Plan specialized cuisine\n1.1 Authentic menus and menu items are planned\nfor a specialized cuisine to meet enterprise\nand customer requirements.\n1.2\nSeasonality\nand\ngeneral\navailability\nof\ningredients are taken into account when\ndeveloping menus and choosing menu items.\n1.4 Menu items are priced to achieved satisfactory\nprofit\nlevels\nand\nsatisfy\nenterprise\nrequirements.\n1.5 Menus\nand\npromotional\nmaterials\nare\ndeveloped to focus on menu items within a\nspecialized cuisine.\n1.6 Décor and setting are planned according to\nspecialized cuisine, cultural considerations and\nenterprise focus.\n1.7\nPrice menu items to achieve satisfactory profit\nlevels and satisfy enterprise requirements.\n1.8\nDevelop menus or promotional materials to\nfocus on menu items within a specialized\ncuisine.\n1.9\nPlan décor and setting according to\nspecialized cuisine, cultural considerations\nand enterprise focus.\n2. Select and purchase food for\nmenu items.\n2.1 Select menu items which are appropriate to\nthe cuisine styles, taking into consideration\nquality, price, seasonal availability and\nenterprise requirements.\n2.2 Source suitable suppliers of standard and\nspecialized food items required.\n2.3 Select suppliers according to quality, price and\nenterprise requirements.\n2.4\nMinimize wastage through appropriate\n\n--- PDF PAGE 76 ---\n________________________________________________________________________________________________________________________________ 74\n\nTR – Commercial Cooking NCIII Promulgated April 2007\n\nELEMENT\n\nPERFORMANCE CRITERIA\nBold and italicized terms are elaborated in the Range of\nVariables\npurchase and storage, taking into account any\nspecial requirements.\n3. Select and use equipment\nand techniques for\npreparation, cooking and\nservice\n3.1 Identify and use specialized utensils, and\ncooking equipment to produce authentic menu\nitems.\n3.2 Use appropriate presentation methods and\nutensils, according to the style and\nrequirements of the cuisine.\n3.3 Set and decorate tables according to cuisine\nand enterprise requirements.\n4. Prepare, cook and serve a\nrange of menu items\n4.1 Prepare and cook a range of authentic menu\nitems, typical of a specialized cuisine, using\npreparation, cookery and service techniques in\nkeeping with the cuisine styles.\n4.2 Observe steps, cultural requirements and\nmajor issues in the preparation, cooking and\nservice or specialized cuisines.\n4.3 Prepare appropriate accompaniments and\ngarnishes required for specific menu items.\n4.4 Serve menu items in correct sequence, using\nappropriate accompaniments and garnishes.\n5. Implement safe and hygienic\npractices\n5.1 Identify potential hygiene and safety problems\nand take appropriate preventative measures to\neliminate risks in producing specialized\ncuisines.\n5.2 Store foods correctly according to health\nregulations.\n\n--- PDF PAGE 77 ---\n________________________________________________________________________________________________________________________________ 75\n\nTR – Commercial Cooking NCIII Promulgated April 2007\n\n RANGE OF VARIABLES\n\nThis unit applies to all hospitality and catering enterprises where food is prepared\nand served such as restaurants, hotels, clubs, cafeterias and other catering\noperations. The following explanations identify how this may be applied in different\nworkplaces, sectors and circumstances.\n\nDepending on the enterprise or the context, a range of authentic menu items must\nbe produced within a cuisine style, covering various categories of food such as\nsnacks, appetizers, main courses, palate fresheners, desserts and drinks.\n\nVARIABLE\n\nRANGE\n\n1. Specialized cuisine\nMay include but not limited to:\n1.1 Specialty or ethnic\n1.2 Classical\n1.3 Contemporary\n1.4 National or regional\n1.5 Vegetarian cuisines\n2. Décor and setting\nMay include but not limited to:\n2.1 Furnishings and fittings\n2.2 Color schemes\n2.3 Lighting\n2.4 Decorations\n2.5 Live or music\n2.6 Display of artworks\n3. Specialized utensils\nMay include but not limited to:\n3.1 Utensils for preparation, cooking,\npresentation, service and eating.\n3.2 Ovens such as tandoors, wood-fired, earth\n3.3 Smoking equipment\n3.4 Finger bowls\n3.5\nNapkins\n4. Preparation methods\nMay include but not limited to:\n4.1 Marinades and marinating\n4.2 Combinations of spices and other\ningredients, providing authentic flavorings,\ncolors and textures.\n4.3 Hanging and dressing of meat, poultry and\ngame\n4.4 Preserving eg. Drying, salting, pickling,\nsmoking\n4.5 Techniques such as cooking in salt, leaves,\npaper and bark.\n\n--- PDF PAGE 78 ---\n________________________________________________________________________________________________________________________________ 76\n\nTR – Commercial Cooking NCIII Promulgated April 2007\n\nVARIABLE\n\nRANGE\n\n6. Cultural requirements and major\n issues\nMay include but not limited to:\n6.1 Prohibitions, sanctions and requirements\nrelated to food items including food types,\ncombinations, origins, handling, preparation\ncooking and serving.\n6.2 Consideration of required rituals related to\nslaughter and preparation.\n6.3 Cultural considerations such as\ncombinations of foods, serving sequence,\nchoices.\n6.4 Required temperatures for different food\nitems.\n6.5 Table height, orientation and seating.\n6.6 Table decorations and setting\n6.7 Special feast, national and other celebratory\ndays.\n7. Appropriate accompaniments\nMay include but not limited to:\n7.1 Sauces and dressings\n7.2 Condiments\n7.3 Breads\n7.4 Drinks\n7.5\nStaples such as rice, couscous, noodles\n\n--- PDF PAGE 79 ---\n________________________________________________________________________________________________________________________________ 77\n\nTR – Commercial Cooking NCIII Promulgated April 2007\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\n\n Competency\nAssessment requires evidences that the candidate:\n1.1 Demonstrated ability to prepare and present a variety of\nmenu items within a specialized cuisine.\n1.2 Detailed understanding of the cultural dimensions of a\nspecialized cuisine.\n2. Underpinning\nKnowledge\n2.1 Cultural and historical background to the relevant\ncuisines including traditional settings, festivals,\ningredients, regional variations, religious and cultural\ncustoms, traditions and sanctions.\n2.2 The effects of methods of preparation and cooking on\nthe flavor and appearance of menu items in a\nspecialized cuisine.\n2.3 Culinary terms used to describe specialized menu items\nand equipment.\n3. Underpinning Skills\n3.1 Advanced preparation and cooking techniques used in\nspecialized cuisine.\n3.2 Principles and practices of hygiene.\n3.3\nSafe work practices.\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1 Use of a wide range of suitable ingredients for making a\nvariety of menu items within a specialized cuisine.\n4.2 Demonstration of skills within a fully equipped\noperational commercial kitchen (including industry-\ncurrent and any specialized equipment) and on more\nthan one occasion.\n4.3 Industry-realistic ratios of kitchen staff to customers.\n4.4 Preparation of menu items for customers within typical\nworkplace time constraints.\n5. Method of\nAssessment\nCompetency may be assessed through:\n5.1 Direct observation of the candidate preparing and\ncooking food items for a specialized cuisine.\n5.2 Sampling of food items prepared by the candidate.\n5.3 Case studies to plan and prepare items from a\nspecialized cuisine to meet particular needs.\n5.4 Written or oral questions to test knowledge of menu\nitems in a specialized cuisine.\n5.5 Review of portfolios of evidence and third party\nworkplace reports of on-the-job performance by the\ncandidate.\n\n--- PDF PAGE 80 ---\n________________________________________________________________________________________________________________________________ 78\n\nTR – Commercial Cooking NCIII Promulgated April 2007\n\n6. Context for\nAssessment\n6.1 Assessment may be done in the workplace or in a\nsimulated workplace setting (assessment centers)\n6.2 Assessment activities are carried out through TESDA’s\naccredited assessment center\n\n--- PDF PAGE 81 ---\n________________________________________________________________________________________________________________________________ 79\n\nTR – Commercial Cooking NCIII Promulgated April 2007\n\nUNIT OF COMPETENCY: MONITOR CATERING REVENUE AND COSTS\n\nUNIT CODE\n : TRS512352\n\nUNIT DESCRIPTOR : This unit deals with the skills and knowledge required to\nestablish and monitor the costs involved in operating a\nfood service operation.\n\nELEMENT\n\nPERFORMANCE CRITERIA\nBold and italicized terms are elaborated in the Range of\nVariables\n1. Establish and maintain\npurchasing and ordering\nsystem\n1.1 Appropriate basic systems for purchasing and\nordering are established and implemented to\nmaximize quality and minimize costs and\nwastage.\n1.2 Systems for storing food items are established\nand maintained to avoid deterioration,\nwastage, theft and spoilage.\n1.3 Stock records are systematically and regularly\nupdated following established standard\noperational procedures.\n2. Establish and maintain a\nfinancial control system\n2.1 Departmental and operational income\nstatements are prepared as per established\nstandard operational procedures.\n2.2 Budget forecasts are determined within\ndefined fiscal periods and any variations are\nadequately explained.\n2.3 Financial records updated and effectively\nutilized.\n3. Maintain a production control\nsystem\n3.1 Food control and production schedules are\ndeveloped and maintained to maximize\nefficiency and minimize waste.\n3.2 Work flows and staff rostering is designed to\nminimize unit labor cost.\n3.3 Daily sales are accurately monitored to make\ntimely adjustments to menus to reflect\ncustomer preferences.\n4. Select and utilize technology\n4.1 Appropriate computer systems and\nbusiness machines are selected and utilized\nfor ease and efficiency.\n4.2 Appropriately software is selected according\nto the needs of the establishment.\n\n--- PDF PAGE 82 ---\n________________________________________________________________________________________________________________________________ 80\n\nTR – Commercial Cooking NCIII Promulgated April 2007\n\n RANGE OF VARIABLES\n\nThis unit applies to all hospitality and catering enterprises where food is prepared\nand served such as restaurants, hotels, clubs, cafeterias and other catering\noperations. The following explanations identify how this may be applied in different\nworkplaces, sectors and circumstances.\n\nControl systems may be computerized or manual and may cover stock control, on-\nline purchasing, income and expenditure and summary reports of usage.\n\nVARIABLE\n\nRANGE\n1. Appropriate computer systems\n\n and business machines\nMay include but not limited to::\n1.1\nPoint of sale systems such as cash registers.\n1.2\nIntegrated computer-based systems\n1.3\nCalculators\n1.4\nFax machines\n2. Appropriate software\nMay include but not limited to::\n2.1\nSpreadsheets\n2.2\nAccounting\n2.3\nDatabase\n2.4\nFinancial planning and tracking\n2.5\nStock control\n2.6\nRostering\n2.7\nScheduling and production\n\n--- PDF PAGE 83 ---\n________________________________________________________________________________________________________________________________ 81\n\nTR – Commercial Cooking NCIII Promulgated April 2007\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidences that the candidate:\n1.1 Demonstrated ability to develop and maintain an\nefficient cost control and monitoring system within a\ncommercial cookery environment.\n1.2 Demonstrated knowledge of financial systems relevant\nto kitchen operations.\n1.3 Demonstrated ability to set up a food production\nsystem linked to cost and revenue control systems and\ntargets.\n2. Underpinning\n Knowledge\n2.1 The role of the kitchen as a profit center within an\noverall business.\n2.2 Inventory and stock control systems used in\ncommercial kitchens.\n3. Underpinning Skills\n3.1 Typical record keeping and accounting systems used\nin commercial kitchens, their features and benefits.\n3.2 Purchasing, receiving, storing, holding and issuing\nprocedures.\n3.3 Costing, yield testing, portion control\n3.4\nOrganizational skills and teamwork.\n4. Resource\n\nImplications\nThe following resources MUST be provided:\n4.1 Project or work activities conducted over a period of\ntime that allows the candidate to establish and\nmaintain systems for a nominated commercial cookery\nor catering workplace.\n5. Method of\n\nAssessment\nCompetency may be assessed through:\n5.1 Review of food production, cost and revenue control\nsystems established and monitored by the candidate.\n5.2 Oral or written questions about typical systems and\ntheir benefits.\n5.3 Written and oral questions to test knowledge of food,\ncost and revenue control systems and options.\n5.4 Review of portfolios of evidence and third party\nworkplace reports of on-the-job performance by the\ncandidate.\n5.5 Case studies to assess ability to establish systems for\ndifferent workplace needs.\n6. Context for\n Assessment\n 6.1 Assessment may be done in the workplace or in a\nsimulated workplace setting (assessment centers)\n 6.2 Assessment activities are carried out through\nTESDA’s accredited assessment center\n\n--- PDF PAGE 84 ---\n________________________________________________________________________________________________________________________________ 82\n\nTR – Commercial Cooking NCIII Promulgated April 2007\n\nUNIT OF COMPETENCY: ESTABLISH AND MAINTAIN QUALITY CONTROL\n\nUNIT CODE\n : TRS512353\n\nUNIT DESCRIPTOR : This unit deals with the knowledge and skills required to\nensure that high standards of food quality are\nestablished and maintained in a commercial kitchen\nenvironment. These tasks are generally undertaken by\na qualified cook or chef who also has some supervisory\nresponsibilities.\n\nELEMENT\n\nPERFORMANCE CRITERIA\nBold and italicized terms are elaborated in the Range of\nVariables\n1. Establish and implement\nprocedures for quality\ncontrol\n1.1 Appropriate procedures are applied to ensure\nthe quality of menu items with regard to:\n Raw materials\n Cooking processes\n Portion control\n Presentation\n1.2 Products and services are ensured consistent\nwith enterprise requirements.\n1.3 Food items are ensured to match menu\ndescriptions.\n2. Monitor and solve quality\n related problems\n2.1 Procedures are applied to monitor quality\nincluding:\n Observation\n Formal audits and reviews\n Tasting\n Seeking feedback\n2.2 Problems related to quality control of food are\nidentified and solved according to established\nstandard operating procedures.\n.\n\n--- PDF PAGE 85 ---\n________________________________________________________________________________________________________________________________ 83\n\nTR – Commercial Cooking NCIII Promulgated April 2007\n\nRANGE OF VARIABLES\n\nThis unit applies to all hospitality and catering enterprises where food is prepared\nand served such as restaurants, hotels, clubs, cafeterias and other catering\noperations. The following explanations identify how this may be applied in different\nworkplaces, sectors and circumstances.\n\nQuality procedures may be manual or computer-based.\n\nQuality data may be collected over different time-frames, according to enterprise\nrequirements and practice.\n\nVARIABLE\n\nRANGE\n1. Quality procedures\nMay include but not limited to:\n1.1 Formal audits against enterprise quality\nstandards and requirements.\n1.2 Feedback from colleagues and customers\n1.3 Reviews of costs and revenues\n2. Types of quality procedures\nMay include but not limited to:\n2.1 Manual\n2.2\nComputer-based\n3. Quality data\n3.1 Enterprise requirements\n3.2 practice\n\n--- PDF PAGE 86 ---\n________________________________________________________________________________________________________________________________ 84\n\nTR – Commercial Cooking NCIII Promulgated April 2007\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidences that the candidate:\n1.1\nDemonstrated ability to establish, implement and\nmaintain quality control systems in a commercial kitchen.\n1.2\nDemonstrated knowledge of quality systems and options\nsuitable for a commercial cookery or catering enterprise.\n2. Underpinning\nKnowledge\n2.1\nThe role of quality control in the kitchen and its link to\noverall business performance and profitability.\n2.2\nFeatures and benefits of different quality control\nmechanisms used in commercial kitchens.\n2.3\nKey areas for monitoring quality.\n3. Underpinning skills 3.1 Quality control systems\n3.1.1\nISO 9001\n3.1.2\nISO 14001\n3.1.3\nHACCP\n3.1.4\n5S\n4. Resource\n\nImplications\nThe following resources MUST be provided:\n4.1\nAccess to a commercial cookery or catering work\nenvironment.\n4.2\nProject or work activities that are conducted over a period\nof time and which allow the candidate to establish and\nimplement quality control systems within a real work\nenvironment.\n5. Method of\n Assessment\nCompetency may be assessed through:\n5.1\nReview of documentation related to quality systems,\nincluding policies and procedures, audit summaries and\nreports prepared by the candidate.\n5.2\nEvaluation of food quality in a work environment where\nthe candidate is responsible for quality control.\n5.3\nWritten or oral questions about chosen systems and\nreasoning.\n5.4\nReview of portfolios of evidence and third party\nworkplace reports of on-the-job performance by the\ncandidate.\n6. Context for\nAssessment\n6.1 Assessment may be done in the workplace or in a\nsimulated workplace setting (assessment centers)\n6.2 Assessment activities are carried out through TESDA’s\naccredited assessment center\n\n--- PDF PAGE 87 ---\n________________________________________________________________________________________________________________________________ 85\n\nTR – Commercial Cooking NCIII Promulgated April 2007\n\nUNIT OF COMPETENCY:\nAPPLY COOK-CHILL-FREEZE PRODUCTION\nPROCESSES\n\nUNIT CODE\n: TRS512354\n\nUNIT DESCRIPTOR : This unit applies to the planned process of food\npreparation, cooking, chilling, freezing, storage, thawing\nand re-thermalization of food by to ensure\nmicrobiological safety and palatability.\n\nELEMENT\n\nPERFORMANCE CRITERIA\nBold and italicized terms are elaborated in the Range of\nVariables\n1. Ensure goods received\nconform to the appropriate\nfood hygiene and health\nstandards\n1.1 Delivered goods are checked to ensure correct\nquantities, acceptable use-by dates and\ntemperature.\n1.2 Temperature check results are recorded\naccording to enterprise procedures.\n1.3 Stock is moved quickly to freezer storage,\nensuring that freezer doors are not left open\nfor extended periods of time.\n1.4 Freezer temperatures are checked and\nrecorded daily, according to enterprise\nprocedures.\n1.5 Breaches of established enterprise standards\nand procedures concerning receipt of goods,\ntemperature checks, and stock quality are\nreported following required enterprise\nprocedures.\n1.6 Stock is rotated on a “first in-first out” basis to\nensure consumption by use-by dates and\navoid wastage.\n2. Prepare and cook food to\nmeet industry safety\nstandards\n2.1 Raw food and ingredients are checked for\npotential deterioration prior to preparation.\n2.2 Food is cooked to specified internal\ntemperatures.\n2.3 Microbiological and chemical changes are kept\nwithin safe tolerances.\n2.4 Quality of food is maintained at the optimum\nlevel in terms of taste and appearance.\n2.5 Food is portioned and packaged following\nrequired procedures and using correct\ncontainers for freezing where necessary.\n\n--- PDF PAGE 88 ---\n________________________________________________________________________________________________________________________________ 86\n\nTR – Commercial Cooking NCIII Promulgated April 2007\n\nELEMENT\n\nPERFORMANCE CRITERIA\nBold and italicized terms are elaborated in the Range of\nVariables\n3. Chill cooked food\n3.1\nTime and temperature standards are met for\nblast and water-bath chilling.\n3.2\nFood quality is maintained throughout the\nchilling process.\n4. Freeze cooked food\n4.1 Food is frozen in accordance with appropriate\nfood safety standards.\n4.2 Food is frozen in batches, in accordance with\nenterprise procedures, allowing each freezing\ncycle to be completed.\n5. Store cooked food under\nrefrigeration\n5.1 Time and temperature standards are met for\nstorage.\n5.2 Spoilage is minimized.\n5.3 Appropriate containers are selected for\nstorage.\n5.4 Correct and clear labeling is ensured.\n5.5 Place food items in appropriate storage once\nthe cook-chill or freezing cycle is complete.\n5.6 Correct storage temperatures are maintained.\n5.7 Storage temperatures are monitored and\nrecorded accurately.\n6. Distribute cook-chill/frozen\nproducts\n6.1 Where necessary, food from production kitchen\nto outlets is transported by refrigerated or\ninsulated containers.\n6.2 Safe handling of food is maintained throughout\nthe distribution cycle.\n6.3 Temperature levels are checked and recorded\nat dispatch and receiving.\n7. Prepare frozen food for\nreheating\n7.1 Required food item is removed from the freezer\nand appropriate methods for thawing are\nused in accordance with enterprise procedures\nand food safety requirements.\n7.2 Trays are spaced to permit air circulation.\n7.3 Product is thawed to 0-4oC within 24 hours.\n7.4 Food is safely transported to the point of\nproduction and service, maintaining correct\ntemperatures.\n\n--- PDF PAGE 89 ---\n________________________________________________________________________________________________________________________________ 87\n\nTR – Commercial Cooking NCIII Promulgated April 2007\n\nELEMENT\n\nPERFORMANCE CRITERIA\nBold and italicized terms are elaborated in the Range of\nVariables\n8. Re-thermalize (reheat) food\nproducts\n8.1 Oven is pre-heated to required temperature in\naccordance with enterprise procedures and\nfood safety standards.\n8.2 Food product is appropriately prepared for\nreheating.\n8.3 Re-heating containers are spaced to allow air\nflow.\n8.4 Rethermalization or re-heating procedures\nare followed in accordance with manufacturer’s\nrecommendations, oven type, loading\nprocedures and other established procedures\nof the enterprise.\n8.5 Product temperature is checked and recorded\nin accordance with enterprise procedures.\n8.6 Thermometers are cleaned between\ntemperature checks of each food item.\n8.7 Fully frozen food is reheated where required in\nemergencies, in accordance with enterprise\nprocedures and food safety standards.\n9. Maintain and serve re-heated\nfood\n9.1 Re-heated food is safely transferred to heated\nbain-marie.\n9.2 Food temperature is maintained at 70oC.\n9.3 Warm holdings are minimized.\n9.4 Portion control and serving procedures of the\nenterprise are followed.\n9.5 Food items are served or delivered at\ntemperatures which comply with food safety\nstandards, enterprise policy and client\npreferences.\n\n--- PDF PAGE 90 ---\n________________________________________________________________________________________________________________________________ 88\n\nTR – Commercial Cooking NCIII Promulgated April 2007\n\n RANGE OF VARIABLES\n\nThis unit applies to all hospitality and catering operations where food and related\nservices are provided such as hotels and restaurants, cafeterias, kiosks, canteens,\ncafes, educational institutions, health establishments, defense forces, corrective\nservices, residential catering, in-flight and other transport catering, events catering\nand private catering\n\nThis unit applies to the food production by cook-chill-freeze methods either in an\nenterprise workplace or in a centralized production kitchen.\n\nHazard Analysis and Critical Control Points (HACCP) is a food safety program which\nis commonly used in the food and hospitality industry to ensure food and production\nmethods are safe and hygienic and comply with food regulations and legislation.\nThe system identifies particular high-risk points which need to be covered by clear\npolicies, procedures and quality checks. It is a requirement in most LGU’s that all\nenterprises where food is either produced or served, have in place a food safety\nplan, which is usually based on HACCP but may also may be based on another\nsystem.\n\nVARIABLE\n\nSCOPE\n1. Food\nMay include but not limited to:\n1.1 Bulk foods\n1.2 Plated meals\n1.3 Sous-vide products\n1.4 Meals-on-wheels\n1.5 Take-away meals\n2. Appropriate methods for\nthawing\nMay include but not limited to:\n2.1 Use of chillers\n2.2 Use of cool rooms\n2.3 Use of refrigerators\n3. Re-thermalization\nMay include but not limited to:\n3.1 Low heat convection\n3.2 Infra-red radiation\n3.3 Microwave\n3.4 Water bath\n3.5 Kettle\n3.6 Combination convection ovens\n4. Re-heating procedures\nMay include but not limited to:\n4.1 Low heat convection\n4.2 Infra-red radiation\n4.3 Microwave\n4.4 Water bath\n4.5 Kettle\n4.6 Combination convection ovens\n\n--- PDF PAGE 91 ---\n________________________________________________________________________________________________________________________________ 89\n\nTR – Commercial Cooking NCIII Promulgated April 2007\n\nEVIDENCE GUIDE\n1. Critical aspects of\nCompetency\nAssessment requires evidences that the candidate:\n1.1 Demonstrated observance of Hazard Analysis and\nCritical Control Points (HACCP) or other food safety\nprogram requirements during the entire cook-chill-freeze\ncycle.\n1.2 Demonstrated ability to operate cook-chill-freeze system\nand equipment.\n1.3 Demonstrated ability to produce, package, store,\nrethermalize and serve food items prepared.\n1.4 Demonstrated knowledge of occupational health and\nsafety and food hygiene regulations.\n2. Underpinning\nKnowledge\n2.1 Temperature specifications for the maintenance of food\nsafety and quality in the cook-chill-freeze process.\n2.2 Freezing and storage requirements in specific relation to\ncook-chill-freeze.\n2.3 Health and safety, food safety and hygiene\nrequirements of particular relevance to cook-chill-freeze.\n2.4\nHACCP principles.\n3. Underpinning\n Skills\n3.1 Principles and methods of cookery, including\npreparation and cooking techniques for all major food\ngroups.\n3.2 Conducting temperature checks and recording data.\n3.3 Features of cook-chill-freeze systems and procedures\nfor using cook-chill-freeze equipment.\n4. Resource\n Implications\nThe following resources MUST be provided:\n4.1 Demonstration of skills using suitable cook-chill-freeze\nequipment and real food items.\n4.2 Production of a multiple cook-chill-freeze food items to\nmeet differing needs.\n4.3 Preparation of cook-chill-freeze food items within typical\nwork time constraints.\n5. Method of\nAssessment\nCompetency may be assessed through:\n5.1 Direct observation of the candidate using cook-chill-\nfreeze equipment.\n5.2 Sampling of cook-chill-freeze items prepared by the\ncandidate.\n5.3 Written or oral questions to test knowledge of suitable\nitems for cook-chill-freeze systems, hygiene issues\nrelated to cook-chill-freeze systems and specifications\nand procedures for cook-chill-freeze.\n5.4 Review of portfolios of evidence and third party\nworkplace reports of on-the-job performance by the\ncandidate.\n\n--- PDF PAGE 92 ---\n________________________________________________________________________________________________________________________________ 90\n\nTR – Commercial Cooking NCIII Promulgated April 2007\n\n6. Context for\nAssessment\n6.1 Assessment may be done in the workplace or in a\nsimulated workplace setting (assessment centers)\n6.2 Assessment activities are carried out through TESDA’s\naccredited assessment center\n\n--- PDF PAGE 93 ---\n________________________________________________________________________________________________________________________________ 91\n\nTR – Commercial Cooking NCIII Promulgated April 2007"
