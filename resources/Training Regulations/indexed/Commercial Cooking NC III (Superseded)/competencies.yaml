        "source_text": "TRS512349\n\nUNIT DESCRIPTOR : This unit deals with the advanced skills and knowledge\nrequired to design, plan, prepare and display a buffet\ncreatively.\n\nELEMENT\n\nPERFORMANCE CRITERIA\nBold and italicized terms are elaborated in the Range of\nVariables\n1. Plan and design a buffet\n1.1 Total concept, food items and displays are\ndesigned as required, in consultation with\ncustomers and other relevant personnel.\n1.2 Buffets are planned according to the required\ntheme or occasion, in consultation with\ncustomers and other relevant personnel.\n1.3 An appropriate range and quantity of food items\nare selected and organized giving consideration\nto quality and price according to the enterprise or\ncustomer requirements.\n2. Prepare for the buffet\n2.1 Appropriate service equipment, service ware and\nlinen are selected to display food and\ndecorations.\n2.2 Tables and service points are planned and\narranged so they are suitable for buffet display\nand service according to establishment\nrequirements, occasion and efficient safe\ncustomer/staff accessibility.\n2.3 Food presentation is prepared or organized with\nartistic flair and according to establishment\nstandards or customer requirements.\n2.4 Appropriate and attractive decorations and\ncenterpieces are selected and prepared or\norganized as required.\n2.5 All preparations and arrangements for buffet are\ncoordinated to all concerned individuals.\n3. Display food items.\n3.1 Food items are displayed with a sense of artistry\nto create customer appeal.\n3.2 Garnishes and accompaniments are used to\nenhance taste and appeal.\n3.3 Buffet service is supervised to ensure that food\nitems are replenished and that the total display\nremains neat and attractive.\n\n--- PDF PAGE 66 ---\n________________________________________________________________________________________________________________________________ 64\n\nTR – Commercial Cooking NCIII Promulgated April 2007\n\nELEMENT\n\nPERFORMANCE CRITERIA\nBold and italicized terms are elaborated in the Range of\nVariables\n4. Present buffet in a safe and\nhygienic manner\n4.1 Potential health problems through cross-\ncontamination and food spoilage are identified\nand appropriate preventive measures are taken\nto eliminate these risks.\n4.2 Food on display is kept at temperature levels as\nprescribed by legislation.\n\n--- PDF PAGE 67 ---\n________________________________________________________________________________________________________________________________ 65\n\nTR – Commercial Cooking NCIII Promulgated April 2007\n\nRANGE OF VARIABLES\n\nThis unit applies to all hospitality and catering enterprises where food is prepared\nand served such as restaurants, hotels, clubs, cafeterias and other catering\noperations. The following explanations identify how this may be applied in different\nworkplaces, sectors and circumstances.\n\nBuffets may be associated with various occasions and situations. They may be\nindoors or outdoors.\n\nVARIABLE\n\nRANGE\n1. Various occasions\nMay include but not limited to:\n1.1 Functions\n1.2 Parties\n1.3 Special celebrations\n1.4 Breakfast\n1.5 Lunch\n1.6 Dinner\n2. Customer requirements\nMay include but not limited to:\n2.1 Selection of appropriate food and food items\n2.2 Table arrangements\n2.3 Service equipment\n2.4 Linen\n2.5 Decorations\n2.6 Candles and lighting\n2.7 Centerpieces\n3. Decorations and centerpieces\nMay include but not limited to:\n3.1\nFruits\n3.2\nVegetables\n3.3\nFlowers and plants\n3.4\nSalt\n3.5\nIce\n3.6\nBread\n3.7\nChocolate\n3.8\nSugar\n3.9\nDecorated cakes and display cakes\n3.10\nMargarine\n4. Concerned individuals\nMay include but not limited to:\n4.1\nCustomers/Client or Organizer\n4.2\nSupervisors and managers\n4.3\nDisplay artists and decoration wholesalers\n4.4\nInterior designers and decorators\n4.5\nOther cooks and chefs\n4.6\nService staff\n\n--- PDF PAGE 68 ---\n________________________________________________________________________________________________________________________________ 66\n\nTR – Commercial Cooking NCIII Promulgated April 2007\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\n\n Competency\nAssessment requires evidences that the candidate:\n1.1 Demonstrated skills to plan and design the total concept\nof a buffet.\n1.2 Demonstrated the ability to organize and plan buffet\narrangements including efficient workflow, service and\nphysical layout.\n1.3 Demonstrated ability to coordinate details of the buffet\narrangements to all concerned parties.\n1.4 Demonstrated skillfulness in food presentation and\ngarnishing.\n1.5 Observed and applied safe and hygienic practices in\nfood preparation, service and storage of food.\n2. Underpinning\nKnowledge\n2.1 The design processes for buffets including:\n Balance of dish types\n Nutritional considerations\n Color and style\n Appropriateness of food items for buffets\n Operational constraints.\n Costing issue\n2.2 Legislation on food safety related to service of food for\nbuffet.\n3. Underpinning\n Skills\n3.1 Artistic skills and creativity relating to design and\npresentation of buffets.\n3.2 Techniques for the attractive presentation and display of\nfood, centerpieces and decorations.\n3.3 Principles and practices of hygiene, particularly related to\nissues surrounding buffet service.\n3.4 Logical and time efficient workflow.\n3.5 Waste minimization techniques and environmental\nconsiderations.\n4. Resource\n Implications\nThe following resources MUST be provided:\n4.1 Fully equipped kitchen\n4.2 Ingredients in the preparation of the pates, terrines and\nforced meats\n4.3 Utensils and kitchen tools to prepare the products\n4.4 Project or work activities that allow the candidate to plan\nand coordinate the actual operation of a buffet.\n5. Method of\n Assessment\nCompetency may be assessed through:\n5.1 Evaluation of a buffet (content and presentation) planned\nand coordinated by the candidate.\n5.2 Oral or written questions to assess knowledge of buffet\ndesign issues and options.\n5.3 Review of portfolios of evidence and third party workplace\nreports of on-the-job performance by the candidate.\n\n--- PDF PAGE 69 ---\n________________________________________________________________________________________________________________________________ 67\n\nTR – Commercial Cooking NCIII Promulgated April 2007\n\n6. Context for\n Assessment\n6.1 Assessment may be done in the workplace or in\n simulated workplace setting (assessment centers)\n6.2 Assessment activities are carried out through TESDA’s\n accredited assessment center\n\n--- PDF PAGE 70 ---\n________________________________________________________________________________________________________________________________ 68\n\nTR – Commercial Cooking NCIII Promulgated April 2007\n\nUNIT OF COMPETENCY:\nSELECT, PREPARE AND SERVE SPECIALIZED\nFOOD ITEMS\n\nUNIT CODE\n :"
