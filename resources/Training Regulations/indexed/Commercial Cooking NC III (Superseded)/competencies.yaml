        "source_text": "TRS512352\n\nUNIT DESCRIPTOR : This unit deals with the skills and knowledge required to\nestablish and monitor the costs involved in operating a\nfood service operation.\n\nELEMENT\n\nPERFORMANCE CRITERIA\nBold and italicized terms are elaborated in the Range of\nVariables\n1. Establish and maintain\npurchasing and ordering\nsystem\n1.1 Appropriate basic systems for purchasing and\nordering are established and implemented to\nmaximize quality and minimize costs and\nwastage.\n1.2 Systems for storing food items are established\nand maintained to avoid deterioration,\nwastage, theft and spoilage.\n1.3 Stock records are systematically and regularly\nupdated following established standard\noperational procedures.\n2. Establish and maintain a\nfinancial control system\n2.1 Departmental and operational income\nstatements are prepared as per established\nstandard operational procedures.\n2.2 Budget forecasts are determined within\ndefined fiscal periods and any variations are\nadequately explained.\n2.3 Financial records updated and effectively\nutilized.\n3. Maintain a production control\nsystem\n3.1 Food control and production schedules are\ndeveloped and maintained to maximize\nefficiency and minimize waste.\n3.2 Work flows and staff rostering is designed to\nminimize unit labor cost.\n3.3 Daily sales are accurately monitored to make\ntimely adjustments to menus to reflect\ncustomer preferences.\n4. Select and utilize technology\n4.1 Appropriate computer systems and\nbusiness machines are selected and utilized\nfor ease and efficiency.\n4.2 Appropriately software is selected according\nto the needs of the establishment.\n\n--- PDF PAGE 82 ---\n________________________________________________________________________________________________________________________________ 80\n\nTR – Commercial Cooking NCIII Promulgated April 2007\n\n RANGE OF VARIABLES\n\nThis unit applies to all hospitality and catering enterprises where food is prepared\nand served such as restaurants, hotels, clubs, cafeterias and other catering\noperations. The following explanations identify how this may be applied in different\nworkplaces, sectors and circumstances.\n\nControl systems may be computerized or manual and may cover stock control, on-\nline purchasing, income and expenditure and summary reports of usage.\n\nVARIABLE\n\nRANGE\n1. Appropriate computer systems\n\n and business machines\nMay include but not limited to::\n1.1\nPoint of sale systems such as cash registers.\n1.2\nIntegrated computer-based systems\n1.3\nCalculators\n1.4\nFax machines\n2. Appropriate software\nMay include but not limited to::\n2.1\nSpreadsheets\n2.2\nAccounting\n2.3\nDatabase\n2.4\nFinancial planning and tracking\n2.5\nStock control\n2.6\nRostering\n2.7\nScheduling and production\n\n--- PDF PAGE 83 ---\n________________________________________________________________________________________________________________________________ 81\n\nTR – Commercial Cooking NCIII Promulgated April 2007\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidences that the candidate:\n1.1 Demonstrated ability to develop and maintain an\nefficient cost control and monitoring system within a\ncommercial cookery environment.\n1.2 Demonstrated knowledge of financial systems relevant\nto kitchen operations.\n1.3 Demonstrated ability to set up a food production\nsystem linked to cost and revenue control systems and\ntargets.\n2. Underpinning\n Knowledge\n2.1 The role of the kitchen as a profit center within an\noverall business.\n2.2 Inventory and stock control systems used in\ncommercial kitchens.\n3. Underpinning Skills\n3.1 Typical record keeping and accounting systems used\nin commercial kitchens, their features and benefits.\n3.2 Purchasing, receiving, storing, holding and issuing\nprocedures.\n3.3 Costing, yield testing, portion control\n3.4\nOrganizational skills and teamwork.\n4. Resource\n\nImplications\nThe following resources MUST be provided:\n4.1 Project or work activities conducted over a period of\ntime that allows the candidate to establish and\nmaintain systems for a nominated commercial cookery\nor catering workplace.\n5. Method of\n\nAssessment\nCompetency may be assessed through:\n5.1 Review of food production, cost and revenue control\nsystems established and monitored by the candidate.\n5.2 Oral or written questions about typical systems and\ntheir benefits.\n5.3 Written and oral questions to test knowledge of food,\ncost and revenue control systems and options.\n5.4 Review of portfolios of evidence and third party\nworkplace reports of on-the-job performance by the\ncandidate.\n5.5 Case studies to assess ability to establish systems for\ndifferent workplace needs.\n6. Context for\n Assessment\n 6.1 Assessment may be done in the workplace or in a\nsimulated workplace setting (assessment centers)\n 6.2 Assessment activities are carried out through\nTESDA’s accredited assessment center\n\n--- PDF PAGE 84 ---\n________________________________________________________________________________________________________________________________ 82\n\nTR – Commercial Cooking NCIII Promulgated April 2007\n\nUNIT OF COMPETENCY: ESTABLISH AND MAINTAIN QUALITY CONTROL\n\nUNIT CODE\n :"
