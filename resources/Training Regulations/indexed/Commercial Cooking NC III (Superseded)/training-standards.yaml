  "source_section_text": "SECTION 3 TRAINING STANDARDS\n\nThese guidelines are set to provide the Technical and Vocational Education\nand Training (TVET) providers with information and other important requirements to\nconsider when designing training programs for COMMERCIAL COOKING NC III.\n\nThe guidelines include information on curriculum design, training delivery,\ntrainee entry requirements, tools and equipment, training facilities, and trainer’s\nqualifications among others.\n\n3.1 CURRICULUM DESIGN\n\nCourse Title: COMMERCIAL COOKING\n\nNC Level: III\n\nNominal Training Duration:\n20 Hrs. (Basic)\n\n24 Hrs. (Common)\n\n 200 Hrs. (Core)\nCourse Description:\n\nThis course is designed to enhance the knowledge, skills and attitude in\ncooking in accordance with industry standards. It covers the basic, common and\ncore competencies needed in supervising a small team of cooks, to include planning\nand preparing foods such as specialized food items, specialty cuisines and quantity\nfoods. It also includes competencies on leading workplace communication and small\nteams, controlling and ordering stock, and establishing business relationships.\n\n3.1 CURRICULUM DESIGN\n\nBASIC COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Lead\nworkplace\ncommunication\n1.1 Communicate information\nabout workplace processes.\n1.2 Lead workplace\ndiscussions.\n1.3 Identify and communicate\nissues arising in the\nworkplace\n• Group\ndiscussion\n• Role Play\n• Brainstorming\n\n• Observation\n• Interviews\n2. Lead small\nteams\n2.1\nProvide team leadership.\n2.2\nAssign responsibilities\namong members.\n2.3\nSet performance expectation\nfor team members.\n\n2.4\nSupervise team performance\n• Lecture\n• Demonstration\n• Self-paced\n(modular)\n• Demonstration\n• Case studies\n\n--- PDF PAGE 94 ---\n________________________________________________________________________________________________________________________________ 92\n\nTR – Commercial Cooking NCIII Promulgated April 2007\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n3. Develop and\npractice\nnegotiation\nskills\n3.1\nIdentify relevant information\nin planning negotiations\n3.2 Participate in negotiations\n3.3 Document areas for\nagreement\n• Direct\nobservation\n• Simulation/role\nplaying\n•Case studies\n• Written test\n• Practical/\nperformance\ntest\n4. Solve\nworkplace\nproblem\nrelated to\nwork activities\n4.1 Explain the analytical\ntechniques.\n4.2 Identify the problem.\n4.3 Determine the possible\ncause/s of the problem.\n• Direct\nobservation\n• Simulation/role\nplaying\n• Case studies\n• Written test\n• Practical/\nperformance\ntest\n5. Use\nmathematical\nconcepts and\ntechniques\n5.1 Identify mathematical tools\nand techniques to solve\nproblem\n5.2 Apply mathematical\nprocedures/solution\n5.3\nAnalyze results\n• Direct\nobservation\n• Simulation/role\nplaying\n• Case studies\n• Written test\n• Practical/\nperformance\ntest\n6. Use relevant\ntechnologies\n6.1\nIdentify appropriate\ntechnology\n6.2\nApply relevant technology\n6.3\nMaintain/enhance relevant\ntechnology\n• Direct\nobservation\n• Simulation/role\nplaying\n•Case studies\n• Written test\n• Practical/\nperformance\ntest\n\n--- PDF PAGE 95 ---\n________________________________________________________________________________________________________________________________ 93\n\nTR – Commercial Cooking NCIII Promulgated April 2007\n\nCOMMON COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Roster staff\n1.1 Develop and implement\nstaff rosters\n1.2 Maintain staff records\n• Discussion\n• Case study\n• Observation\n• Interview\n• Written test\n2. Control and\norder stock\n2.1 Maintain stock levels and\nrecords\n2.2 Process stock orders\n2.3 Minimize stock losses\n2.4 Follow-up orders\n2.5 Organize and administer\nstocks\n• Discussion\n• Lecture\n• Simulation\n• Written test\n• Review of\ndocuments\n3. Train small\ngroups\n3.1 Prepare for training\n3.2 Deliver training\n3.3 Provide opportunities for\npractices\n3.4 Review training\n• Lecture/\n• Discussion\n• Demonstration\n• Hands-on\n Video Viewing\n• Written Test\n• Oral\nQuestioning\n• Review of\ndocuments\n• Direct\nobservation\n4. Establish and\nconduct\nbusiness\nrelationships\n4.1 Establish and conduct\nbusiness relationships\n4.2 Conduct negotiations\n4.3 Make formal business\nagreements\n4.4 Foster and maintain business\nrelationships\n• Lecture/\n• Discussion\n• Demonstration\n• Hands-on\n• Video Viewing\n• Written Test\n• Oral\nQuestioning\n• Review of\ndocuments\n• Direct\nobservation\n• Case studies\n\n--- PDF PAGE 96 ---\n________________________________________________________________________________________________________________________________ 94\n\nTR – Commercial Cooking NCIII Promulgated April 2007\n\nCORE COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Plan and\nprepare food\nfor ala carte\nand buffets\n1.1 Plan ala carte and buffet\nitems\n1.2 Prepare, produce and\npresent foods for ala carte\nand buffets\n1.3 Store ala carte and buffet\nitems\n\n• Lecture/\n• Discussion\n• Demonstration\n• Hands-on\n• Video Viewing\n• Written Test\n• Practical Test\n(i.e Mise-en-\nplace, Work\nTechniques,\nHygiene and\nSanitation,\nSensory\nEvaluation,\nPlating and\nPresentation,\nPortion Size)\n• Observation in\nLaboratory\n• Oral\nQuestioning\n2. Plan and\ncontrol menu-\nbased\ncatering\n2.1 Plan and prepare menus\n2.2 Control menu-based catering\n2.3 Practice portion control\n• Lecture/\n• Discussion\n• Demonstration\n• Hands-on\n• Video Viewing\n• Written Test\n• Practical Test\n(i.e Mise-en-\nplace, Work\nTechniques,\nHygiene and\nSanitation,\nSensory\nEvaluation,\nPlating and\nPresentation,\nPortion Size)\n• Observation in\nLaboratory\n• Oral\n Questioning\n\n--- PDF PAGE 97 ---\n________________________________________________________________________________________________________________________________ 95\n\nTR – Commercial Cooking NCIII Promulgated April 2007\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n3. Organize bulk\ncooking\noperations\n3.1 Plan kitchen operations for\nbulk cooking\n3.2 Organize production of bulk\ncooking menus\n3.3 Select systems for bulk\ncooking\n3.4 Use preparation and cooking\ntechniques appropriate to the\nbulk cooking system\n\n• Lecture/\n• Discussion\n• Demonstration\n• Hands-on\n• Video Viewing\n• Written Test\n• Practical Test\n(i.e Mise-en-\nplace, Work\nTechniques,\nHygiene and\nSanitation,\nSensory\nEvaluation,\nPlating and\nPresentation,\nPortion Size)\n• Observation in\nLaboratory\n• Oral\nQuestioning\n4. Prepare pates\nand terrines\n4.1 Prepare pates and terrines\n4.2 Present pates and terrines\n4.3 Develop new recipes\n\n• Lecture/\n• Discussion\n• Demonstration\n• Hands-on\n• Video Viewing\n• Written Test\n• Practical Test\n(i.e Mise-en-\nplace, Work\nTechniques,\nHygiene and\nSanitation,\nSensory\nEvaluation,\nPlating and\nPresentation,\nPortion Size)\n• Observation in\nLaboratory\n• Oral\nQuestioning\n\n--- PDF PAGE 98 ---\n________________________________________________________________________________________________________________________________ 96\n\nTR – Commercial Cooking NCIII Promulgated April 2007\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n5. Plan, prepare\nand display a\nla carte and\nbuffet\n5.1 Plan and design a buffet\n5.2 Prepare for the buffet\n5.3 Display food items\n5.4 Present buffet in a safe\nand hygienic manner\n\n• Lecture/\n• Discussion\n• Demonstration\n• Hands-on\n• Video Viewing\n• Written Test\n• Practical Test (i.e\nMise-en-place, Work\nTechniques,\nHygiene and\nSanitation, Sensory\nEvaluation, Plating\nand Presentation,\nPortion Size)\n• Observation in\nLaboratory\n•Oral Questioning\n6. Select,\nprepare and\nserve\nspecialized\nfood items\n6.1 Select specialized food\nitems\n6.2 Plan menus and/or\npromotional strategies\n6.3 Prepare and present\n(dishes using)\nspecialized food items\n6.4 Implement hygienic and\nsafe practices\n• Lecture/\n• Discussion\n• Demonstration\n• Hands-on\n• Video Viewing\n• Written Test\n• Practical Test (i.e\nMise-en-place, Work\nTechniques,\nHygiene and\nSanitation, Sensory\nEvaluation, Plating\nand Presentation,\nPortion Size)\n• Observation in\nLaboratory\n•Oral Questioning\n7. Select,\nprepare and\nserve\nspecialty\ncuisines\n7.1 Plan specialized cuisine\n7.2 Select and purchase\nfood for menu items\n7.3 Select and use\nequipment and\ntechniques for\npreparation, cooking\nand service\n7.4 Prepare, cook and serve\na range of menu items\n7.5 Implement safe and\nhygienic practices\n• Lecture/\n• Discussion\n• Demonstration\n• Hands-on\n• Video Viewing\n• Written Test\n• Practical Test (i.e\nMise-en-place, Work\nTechniques,\nHygiene and\nSanitation, Sensory\nEvaluation, Plating\nand Presentation,\nPortion Size)\n• Observation in\nLaboratory\n•Oral Questioning\n\n--- PDF PAGE 99 ---\n________________________________________________________________________________________________________________________________ 97\n\nTR – Commercial Cooking NCIII Promulgated April 2007\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n8. Monitor\ncatering\nrevenue and\ncosts\n8.1 Establish and maintain\npurchasing and ordering\nsystem\n8.2 Establish and maintain\nfinancial control system\n8.3 Maintain production control\nsystem\n8.4 Select and utilize technology\n\n• Lecture/\n• Discussion\n• Demonstration\n• Hands-on\n• Video Viewing\n• Written Test\n• Practical Test\n• Observation in\nLaboratory\n• Oral\nQuestioning\n9. Establish and\nmaintain\nquality control\n9.1 Establish and implement\nprocedures for quality control\n9.2 Monitor and solve quality\n related problems\n• Lecture/\n Discussion\n• Demonstration\n• Hands-on\n• Video Viewing\n• Written Test\n• Practical Test\n(i.e Mise-en-\nplace, Work\nTechniques,\nHygiene and\nSanitation,\nSensory\nEvaluation,\nPlating and\nPresentation,\nPortion Size)\n• Observation\nin Laboratory\n• Oral\nQuestioning\n10. Apply cook-\nchill-freeze\nproduction\nprocesses\n10.1 Ensure goods received\nconform to the appropriate\nfood hygiene and health\nstandards\n10.2 Prepare and cook food to\nmeet industry safety\nstandards\n10.3 Chill cooked food\n10.4 Freeze cooked food\n10.5 Store cooked food under\nrefrigeration\n10.6 Distribute cook-chill/frozen\nproducts\n10.7 Prepare frozen food for\nreheating\n10.8 Re-thermalize (reheat) food\nproducts\n10.9 Maintain and serve reheated\nfood\n• Lecture/\n• Discussion\n• Demonstration\n• Hands-on\n• Video Viewing\n• Written Test\n• Practical Test\n(i.e Mise-en-\nplace, Work\nTechniques,\nHygiene and\nSanitation,\nSensory\nEvaluation,\nPlating and\nPresentation,\nPortion Size)\n• Observation in\nLaboratory\n• Oral\nQuestioning\n\n--- PDF PAGE 100 ---\n________________________________________________________________________________________________________________________________ 98\n\nTR – Commercial Cooking NCIII Promulgated April 2007\n\n3.2\nTRAINING DELIVERY\n\nThe delivery of training should follow the design of the curriculum.\nDelivery should be guided by the 10 basic principles of competency-based\nTVET.\n\n•\nThe training is based on curriculum developed from the\ncompetency standards;\n•\nLearning is modular in its structure;\n•\nTraining delivery is individualized and self-paced;\n•\nTraining is based on work that must be performed;\n•\nTraining materials are directly related to the competency standards\nand the curriculum modules;\n•\nAssessment is based on the collection of evidence of the\nperformance of work to the industry required standard;\n•\nTraining is based both on and off-the-job components;\n•\nAllows for recognition of prior learning (RPL) or current\ncompetencies;\n•\nTraining allows for multiple entry and exit; and\n•\nApproved training programs are Nationally Accredited\n\nThe competency-based TVET system recognizes various types of\ndelivery modes, both on and off-the-job as long as the learning is driven by\nthe competency standards specified by the industry. The following training\nmodalities may be adopted when designing training programs:\n\n• The dualized mode of training delivery is preferred and\nrecommended, thus, programs would contain both in-school and in-\nindustry training or fieldwork components. Details can be referred to\nthe Dual Training System (DTS) Implementing Rules and\nRegulations\n• Modular/self-paced learning is a competency-based training\nmodality where the trainee is allowed to progress at his own pace.\nThe trainer only facilitates the training delivery\n• Peer teaching/mentoring is a training modality wherein fast learners\nare given the opportunity to assist the slow learners\n• Supervised industry training or on-the-job training is a training\napproach designed to enhance the knowledge and skills of the\ntrainee through actual experience in the workplace to acquire\nspecific competencies prescribed in the training regulations\n• Distance learning is a formal education process in which majority of\nthe instruction occurs when the students and instructor are not in\nthe same place. Distance learning may employ correspondence\nstudy, audio, video or computer technologies\n\n--- PDF PAGE 101 ---\n________________________________________________________________________________________________________________________________ 99\n\nTR – Commercial Cooking NCIII Promulgated April 2007\n\n3.3 TRAINEE ENTRY REQUIREMENTS\n\nTrainees or students who wish to enter this training should possess the\nfollowing requirements:\n\n• can communicate in basic English in both oral and written\nform\n• physically and mentally fit\n• with good moral character\n• can perform basic mathematical computation\n• must be competent in the entire Commercial Cooking\n NCII qualification either through training, experience or\ncertification\n\nThis list does not include specific institutional requirements such\neducational attainment, appropriate work experience, and others that may be\nrequired of the trainees by the school or training center delivering the TVET\nprogram.\n\n3.4 LIST OF TOOLS, EQUIPMENT AND MATERIALS\n\nRecommended list of tools, equipment and materials for the training of\n25 trainees for COMMERCIAL COOKING NC III are as follows:\n\nQTY\nTOOLS\nQTY\nEQUIPMENT\nQTY\nCOOKING UTENSILS\nBasic cutting knives\n1 unit\nReach-in freezer\n5 pcs.\nSauce pan w/ handle,\n16 cm. diameter x 8\ncm. height\n5 pcs.\nParing knife\n1 unit\nReach-in refrigerator\n5 pcs.\nSauce pan w/ handle,\n20 cm. diameter x 8\ncm. height\n3 pcs.\nBread knife\n5 units\n4 burner gas range w/\noven\n5 pcs.\nSauteing pan - small\n5 pcs.\nFilleting knife\n1 unit\nStock pan burner\n3 pcs.\nSauteing pan - medium\n5 pcs.\nCarving knife\n1 unit\nDeep fat fryer\n(small/single)\n3 pcs.\nSauteing pan - large\n3 pcs.\nChef’s knife 6”\n1 unit\nMicrowave oven\n2 pcs.\nSauteing pan - heavy\nduty\n\n4 pcs.\nBraising pan - small\n3 pcs.\nChef’s knife 8”\n1 unit\nCombination of broiler\nand griddle - small\n2 pcs.\nBraising pan - medium\n5 pcs.\nBoning knife\n5 unit\nExhaust hood\n2 pcs.\nBraising pan - large\n3 pcs.\nOysters knife\n1 unit\nDish washing machine\n(optional)\n4 pcs,\nStock pots - small\n3 pcs.\nCleaver\n1 unit\nBlender machine\n2 pcs.\nStock pots - medium\n5 pcs.\nButcher knife\n1 unit\nPressure cooker\n1 pc.\nStock pot - large\n\n--- PDF PAGE 102 ---\n________________________________________________________________________________________________________________________________ 100\nTR – Commercial Cooking NCIII Promulgated April 2007\n\nTOOLS\nEQUIPMENT\nCOOKING UTENSILS\nQTY\nQTY\nQTY\n1 unit Meat slicer - small\n5 pcs.\nFrying pan - small\nHand tools\n1 unit Meat grinder\n2 pcs.\nFrying pan - medium\n1 pc.\nApple corer\n1 unit Meat chopper\nmachine (optional)\n1 pc.\nFrying pan - large\n3 pcs.\nWire whisk -\nsmall\n1 unit Salamander, griller\n1 pc.\nColander - small\n3 pcs.\nWire whisk -\nmedium\n\n1 pc.\nColander - medium\n3 pcs.\nWire whisk –\nheavy duty\n\n5 pcs.\nCutting board\n5 pcs.\nCan opener\nKitchen Furniture/\nAccessories\n1 pc.\nFish poacher-\nmedium\n3 pcs.\nKitchen\nscissors\n5 units\nPreparation table\nwith sink (approx. 45”\nx 28”)\n2 pcs.\nCasserole - small\n3 pcs.\nSoup Ladle 3\noz.\n1 unit\nBain Marie - table\n2 pcs.\nCasserole - medium\n3 pcs.\nSoup Ladle 6\noz.\n1 unit\nWorking table\n(fabricated)\n2 pcs.\nWok - small\n3 pcs.\nSoup Ladle 8\noz.\n5 unit\nCondiment cabinet\n2 pcs.\nWok - medium\n3 pcs.\nSoup Ladle\n12 oz.\n1 unit\nWashing sink\n1 pc.\nDouble boiler -\nmedium\n5 pcs.\nKitchen spoon\n1 unit\nSoak sink\n4 pcs.\nPaellara\n5 pcs.\nKitchen spoon\nslotted\n2 unit\nUtility shelving\n2 pcs.\nGlass rack\n3 pcs.\nKitchen fork\n5 unit\nStainless steel rack\n(5 shelves)\n1 pc.\nSoup cup rack\n3 pcs.\nCarving fork\n1 unit\nSteel rack\n2 pcs.\nPlate rack\n3 pcs.\nPocket/pin\nthermometer\n1 unit\nUtility cart\n\n5 pcs.\nPeelers\nTRAINING EQUIPMENT\n10 pcs. Baking tray - small\n5 pcs.\nTenderizer,\nmedium\n1 unit\nOver head projector\n10 pcs. Utility tray - stainless\n5 pcs.\nSkimmer, fine\n1 unit\nFlip chart\n2 pcs.\nRoasting tray\n3 pcs.\nWire Skimmer,\nsmall\n1 unit\nWhite board\nTRAINING MATERIALS\n\nCLEANING MATERIALS\n25 pcs. Marker\n\n4 pcs.\nFloor mops\n25 pcs. Pencil\n\n1 pc.\nMop Squeezer\n2 rms\nBond paper\n\n--- PDF PAGE 103 ---\n________________________________________________________________________________________________________________________________ 101\nTR – Commercial Cooking NCIII Promulgated April 2007\n\nTOOLS\nCLEANING MATERIALS\nMATERIALS\nQTY\nQTY\nQTY\n5 pcs.\nSkimmers\nspider\n4 pcs.\nBroom (tambo)\nMeat\n3 pcs.\nStrainer, small,\nfine\n2 pcs.\nDust pan\n\nBeef\n3 pcs.\nSiever\n5 pcs.\nGarbage bin (4\ngals.)\n\nPork\n2 pcs.\nStrainer,\nmedium, fine\n2 pcs.\nLiquid soap\ndispenser\n\nLamb\nTongs\n2 pcs.\nPaper towel\ndispenser\nPoultry\n5 pcs.\n8 inches\n\nEQUIPMENT\n\n3 pcs.\n12 inches\nSAFETY\n\nChicken\nTOOLS\n1 set\nFirst Aid Kit\n\nDuck\n5 pcs.\nTurner, 3” x 6”\n1 pc.\nFire Extinguisher\n\nTurkey\n5 pcs.\nSpatula\n\nPigeon, etc.\n5 pcs.\nWooden\nspoon\n\n5 pcs.\nParisienne\nspoon\n\nSeafood\n5 pcs.\nZester\n\nFish\n5 pcs.\nPiping bag\n\nShellfish\n5 sets\nPastry tubes\n\nCrustacean\n3 pcs.\nStrainer\nChinois - small\n\nPerishables\n3 pcs.\nStrainer\nChinois -\nmedium\n\nVegetable\n3 pcs.\nFunnel - small\n\nFruits\n2 pcs.\nFunnel -\nmedium\n\nDairy products\n5 sets\nMeasuring\nspoon\n\nProcessed foods\n5 sets Measuring cup\n\nDry Goods (Groceries)\n5 sets\nMeasuring urn\n\nSauces\n\nSpices\n\nSeasoning\n\nCanned fruits\n\nCanned vegetables\n\n--- PDF PAGE 104 ---\n________________________________________________________________________________________________________________________________ 102\nTR – Commercial Cooking NCIII Promulgated April 2007\n\nTOOLS\nEQUIPMENT\nMATERIALS\nQTY\nQTY\nQTY\nMiscellaneous\n\nDry Goods (Groceries)\n1 pc.\nIce cream\nscoop\n\nNoodles\n10 pcs.\nCheese cloth\nPasta\n12 pcs.\nServing spoon\nRice\n1 pc.\nFood mill\nFlour\n3 pcs.\nWeighing\nscale – 5 kgs.\n\nSugar\n5 pcs.\nWeighing\nscale – 1000\ngrams\n\nBeans\n\nTRAINING MATERIALS/\nRESOURCES\n\nManuals\nBooks\nVideo (CD)\n\nNOTE: Implementation of the training program can be made possible through a MOA between the\nTraining school and Industry for the use of the facilities. This is in response to the school\nlimitation on the high cost of equipment.\n\n--- PDF PAGE 105 ---\n________________________________________________________________________________________________________________________________ 103\nTR – Commercial Cooking NCIII Promulgated April 2007\n\n3.5\nTRAINING FACILITIES\n\nBased on a class intake of 25 students/trainees.\n\nSpace Requirement\n\nSize in Meters\n\nArea in Sq.\nMeters\n\nTotal Area in Sq.\nMeters\nStudent/Trainee\nWorking Space\n1 x 1 m.\n1 sq. m.\n25 sq. m\nLecture/Demo Room\n8 x 5 m.\n40 sq. m.\n40 sq. m.\nLaboratory\n8 x 5 m.\n40 sq. m.\n40 sq. m.\nLearning Resource\nCenter\n3 x 5 m.\n15 sq. m.\n15 sq. m.\nFacilities/Equipment/\nCirculation Area\n\n36 sq. m.\nTotal workshop area:\n156 sq. m.\n\n3.6\nTRAINER’S QUALIFICATIONS FOR TOURISM (HOTELS AND\nRESTAURANTS) SECTOR\n\n COMMERCIAL COOKING – NC III\n\n TRAINER QUALIFICATION I (TQ III)\n\n• Must have completed a Trainer’s Training Methodology Course\n (TM III) or its equivalent\n• Must be physically and mentally fit\n• Must have at least 3-5 years job/industry experience\n• Must be a holder of Commercial Cooking NC Level III Certificate or\nequivalent\n• Must be of good moral character\n• With pleasing personality\n• Must have attended relevant training and seminars\n\n3.7\nINSTITUTIONAL ASSESSMENT\n\nInstitutional assessment is undertaken by trainees to determine their\nachievement of units of competency. A certificate of achievement is issued\nfor each unit of competency.\n\n--- PDF PAGE 106 ---\n________________________________________________________________________________________________________________________________ 104\nTR – Commercial Cooking NCIII Promulgated April 2007"
