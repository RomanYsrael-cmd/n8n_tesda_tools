      "source_text": "Course Title: COMMERCIAL COOKING\n\nNC Level: III\n\nNominal Training Duration:\n20 Hrs. (Basic)\n\n24 Hrs. (Common)\n\n 200 Hrs. (Core)\nCourse Description:\n\nThis course is designed to enhance the knowledge, skills and attitude in\ncooking in accordance with industry standards. It covers the basic, common and\ncore competencies needed in supervising a small team of cooks, to include planning\nand preparing foods such as specialized food items, specialty cuisines and quantity\nfoods. It also includes competencies on leading workplace communication and small\nteams, controlling and ordering stock, and establishing business relationships.\n\n3.1 CURRICULUM DESIGN\n\nBASIC COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Lead\nworkplace\ncommunication\n1.1 Communicate information\nabout workplace processes.\n1.2 Lead workplace\ndiscussions.\n1.3 Identify and communicate\nissues arising in the\nworkplace\n• Group\ndiscussion\n• Role Play\n• Brainstorming\n\n• Observation\n• Interviews\n2. Lead small\nteams\n2.1\nProvide team leadership.\n2.2\nAssign responsibilities\namong members.\n2.3\nSet performance expectation\nfor team members.\n\n2.4\nSupervise team performance\n• Lecture\n• Demonstration\n• Self-paced\n(modular)\n• Demonstration\n• Case studies\n\n--- PDF PAGE 94 ---\n________________________________________________________________________________________________________________________________ 92\n\nTR – Commercial Cooking NCIII Promulgated April 2007\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n3. Develop and\npractice\nnegotiation\nskills\n3.1\nIdentify relevant information\nin planning negotiations\n3.2 Participate in negotiations\n3.3 Document areas for\nagreement\n• Direct\nobservation\n• Simulation/role\nplaying\n•Case studies\n• Written test\n• Practical/\nperformance\ntest\n4. Solve\nworkplace\nproblem\nrelated to\nwork activities\n4.1 Explain the analytical\ntechniques.\n4.2 Identify the problem.\n4.3 Determine the possible\ncause/s of the problem.\n• Direct\nobservation\n• Simulation/role\nplaying\n• Case studies\n• Written test\n• Practical/\nperformance\ntest\n5. Use\nmathematical\nconcepts and\ntechniques\n5.1 Identify mathematical tools\nand techniques to solve\nproblem\n5.2 Apply mathematical\nprocedures/solution\n5.3\nAnalyze results\n• Direct\nobservation\n• Simulation/role\nplaying\n• Case studies\n• Written test\n• Practical/\nperformance\ntest\n6. Use relevant\ntechnologies\n6.1\nIdentify appropriate\ntechnology\n6.2\nApply relevant technology\n6.3\nMaintain/enhance relevant\ntechnology\n• Direct\nobservation\n• Simulation/role\nplaying\n•Case studies\n• Written test\n• Practical/\nperformance\ntest\n\n--- PDF PAGE 95 ---\n________________________________________________________________________________________________________________________________ 93\n\nTR – Commercial Cooking NCIII Promulgated April 2007\n\nCOMMON COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Roster staff\n1.1 Develop and implement\nstaff rosters\n1.2 Maintain staff records\n• Discussion\n• Case study\n• Observation\n• Interview\n• Written test\n2. Control and\norder stock\n2.1 Maintain stock levels and\nrecords\n2.2 Process stock orders\n2.3 Minimize stock losses\n2.4 Follow-up orders\n2.5 Organize and administer\nstocks\n• Discussion\n• Lecture\n• Simulation\n• Written test\n• Review of\ndocuments\n3. Train small\ngroups\n3.1 Prepare for training\n3.2 Deliver training\n3.3 Provide opportunities for\npractices\n3.4 Review training\n• Lecture/\n• Discussion\n• Demonstration\n• Hands-on\n Video Viewing\n• Written Test\n• Oral\nQuestioning\n• Review of\ndocuments\n• Direct\nobservation\n4. Establish and\nconduct\nbusiness\nrelationships\n4.1 Establish and conduct\nbusiness relationships\n4.2 Conduct negotiations\n4.3 Make formal business\nagreements\n4.4 Foster and maintain business\nrelationships\n• Lecture/\n• Discussion\n• Demonstration\n• Hands-on\n• Video Viewing\n• Written Test\n• Oral\nQuestioning\n• Review of\ndocuments\n• Direct\nobservation\n• Case studies\n\n--- PDF PAGE 96 ---\n________________________________________________________________________________________________________________________________ 94\n\nTR – Commercial Cooking NCIII Promulgated April 2007\n\nCORE COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Plan and\nprepare food\nfor ala carte\nand buffets\n1.1 Plan ala carte and buffet\nitems\n1.2 Prepare, produce and\npresent foods for ala carte\nand buffets\n1.3 Store ala carte and buffet\nitems\n\n• Lecture/\n• Discussion\n• Demonstration\n• Hands-on\n• Video Viewing\n• Written Test\n• Practical Test\n(i.e Mise-en-\nplace, Work\nTechniques,\nHygiene and\nSanitation,\nSensory\nEvaluation,\nPlating and\nPresentation,\nPortion Size)\n• Observation in\nLaboratory\n• Oral\nQuestioning\n2. Plan and\ncontrol menu-\nbased\ncatering\n2.1 Plan and prepare menus\n2.2 Control menu-based catering\n2.3 Practice portion control\n• Lecture/\n• Discussion\n• Demonstration\n• Hands-on\n• Video Viewing\n• Written Test\n• Practical Test\n(i.e Mise-en-\nplace, Work\nTechniques,\nHygiene and\nSanitation,\nSensory\nEvaluation,\nPlating and\nPresentation,\nPortion Size)\n• Observation in\nLaboratory\n• Oral\n Questioning\n\n--- PDF PAGE 97 ---\n________________________________________________________________________________________________________________________________ 95\n\nTR – Commercial Cooking NCIII Promulgated April 2007\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n3. Organize bulk\ncooking\noperations\n3.1 Plan kitchen operations for\nbulk cooking\n3.2 Organize production of bulk\ncooking menus\n3.3 Select systems for bulk\ncooking\n3.4 Use preparation and cooking\ntechniques appropriate to the\nbulk cooking system\n\n• Lecture/\n• Discussion\n• Demonstration\n• Hands-on\n• Video Viewing\n• Written Test\n• Practical Test\n(i.e Mise-en-\nplace, Work\nTechniques,\nHygiene and\nSanitation,\nSensory\nEvaluation,\nPlating and\nPresentation,\nPortion Size)\n• Observation in\nLaboratory\n• Oral\nQuestioning\n4. Prepare pates\nand terrines\n4.1 Prepare pates and terrines\n4.2 Present pates and terrines\n4.3 Develop new recipes\n\n• Lecture/\n• Discussion\n• Demonstration\n• Hands-on\n• Video Viewing\n• Written Test\n• Practical Test\n(i.e Mise-en-\nplace, Work\nTechniques,\nHygiene and\nSanitation,\nSensory\nEvaluation,\nPlating and\nPresentation,\nPortion Size)\n• Observation in\nLaboratory\n• Oral\nQuestioning\n\n--- PDF PAGE 98 ---\n________________________________________________________________________________________________________________________________ 96\n\nTR – Commercial Cooking NCIII Promulgated April 2007\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n5. Plan, prepare\nand display a\nla carte and\nbuffet\n5.1 Plan and design a buffet\n5.2 Prepare for the buffet\n5.3 Display food items\n5.4 Present buffet in a safe\nand hygienic manner\n\n• Lecture/\n• Discussion\n• Demonstration\n• Hands-on\n• Video Viewing\n• Written Test\n• Practical Test (i.e\nMise-en-place, Work\nTechniques,\nHygiene and\nSanitation, Sensory\nEvaluation, Plating\nand Presentation,\nPortion Size)\n• Observation in\nLaboratory\n•Oral Questioning\n6. Select,\nprepare and\nserve\nspecialized\nfood items\n6.1 Select specialized food\nitems\n6.2 Plan menus and/or\npromotional strategies\n6.3 Prepare and present\n(dishes using)\nspecialized food items\n6.4 Implement hygienic and\nsafe practices\n• Lecture/\n• Discussion\n• Demonstration\n• Hands-on\n• Video Viewing\n• Written Test\n• Practical Test (i.e\nMise-en-place, Work\nTechniques,\nHygiene and\nSanitation, Sensory\nEvaluation, Plating\nand Presentation,\nPortion Size)\n• Observation in\nLaboratory\n•Oral Questioning\n7. Select,\nprepare and\nserve\nspecialty\ncuisines\n7.1 Plan specialized cuisine\n7.2 Select and purchase\nfood for menu items\n7.3 Select and use\nequipment and\ntechniques for\npreparation, cooking\nand service\n7.4 Prepare, cook and serve\na range of menu items\n7.5 Implement safe and\nhygienic practices\n• Lecture/\n• Discussion\n• Demonstration\n• Hands-on\n• Video Viewing\n• Written Test\n• Practical Test (i.e\nMise-en-place, Work\nTechniques,\nHygiene and\nSanitation, Sensory\nEvaluation, Plating\nand Presentation,\nPortion Size)\n• Observation in\nLaboratory\n•Oral Questioning\n\n--- PDF PAGE 99 ---\n________________________________________________________________________________________________________________________________ 97\n\nTR – Commercial Cooking NCIII Promulgated April 2007\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n8. Monitor\ncatering\nrevenue and\ncosts\n8.1 Establish and maintain\npurchasing and ordering\nsystem\n8.2 Establish and maintain\nfinancial control system\n8.3 Maintain production control\nsystem\n8.4 Select and utilize technology\n\n• Lecture/\n• Discussion\n• Demonstration\n• Hands-on\n• Video Viewing\n• Written Test\n• Practical Test\n• Observation in\nLaboratory\n• Oral\nQuestioning\n9. Establish and\nmaintain\nquality control\n9.1 Establish and implement\nprocedures for quality control\n9.2 Monitor and solve quality\n related problems\n• Lecture/\n Discussion\n• Demonstration\n• Hands-on\n• Video Viewing\n• Written Test\n• Practical Test\n(i.e Mise-en-\nplace, Work\nTechniques,\nHygiene and\nSanitation,\nSensory\nEvaluation,\nPlating and\nPresentation,\nPortion Size)\n• Observation\nin Laboratory\n• Oral\nQuestioning\n10. Apply cook-\nchill-freeze\nproduction\nprocesses\n10.1 Ensure goods received\nconform to the appropriate\nfood hygiene and health\nstandards\n10.2 Prepare and cook food to\nmeet industry safety\nstandards\n10.3 Chill cooked food\n10.4 Freeze cooked food\n10.5 Store cooked food under\nrefrigeration\n10.6 Distribute cook-chill/frozen\nproducts\n10.7 Prepare frozen food for\nreheating\n10.8 Re-thermalize (reheat) food\nproducts\n10.9 Maintain and serve reheated\nfood\n• Lecture/\n• Discussion\n• Demonstration\n• Hands-on\n• Video Viewing\n• Written Test\n• Practical Test\n(i.e Mise-en-\nplace, Work\nTechniques,\nHygiene and\nSanitation,\nSensory\nEvaluation,\nPlating and\nPresentation,\nPortion Size)\n• Observation in\nLaboratory\n• Oral\nQuestioning\n\n--- PDF PAGE 100 ---\n________________________________________________________________________________________________________________________________ 98\n\nTR – Commercial Cooking NCIII Promulgated April 2007",
