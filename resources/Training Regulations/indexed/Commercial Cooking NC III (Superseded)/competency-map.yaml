  "source_text": "SECTION 1 COMMERCIAL COOKING NC III QUALIFICATION\n\nThe COMMERCIAL COOKING NC III Qualification consists of competencies\nthat a person must achieve to plan, prepare and present various hot and cold\nproducts, including specialized food items, specialty cuisines and quantity foods and\nsupervise a small team of cooks for guests in hotels, motels, restaurants, clubs,\ncanteens, resorts, luxury liners and cruise ships within the company’s acceptable\nstandards.\n\nThis Qualification is packaged from the competency map of the Tourism\nSector (Hotels and Restaurants) as shown in Annex A\n\nThe Units of Competency comprising this Qualification include the following:\n\nCODE NO.\nBASIC COMPETENCIES\n\n500311109\nLead workplace communication\n500311110\n\nLead small teams\n500311111\n\nDevelop and practice negotiation skills\n500311112\n\nSolve problems related to work activities\n500311113\n\nUse mathematical concepts and techniques\n500311114\n\nUse relevant technologies\n\nCODE NO.\nCOMMON COMPETENCIES\n\nTRS311206\nRoster staff\nTRS311207\nControl and order stock\nTRS311208\nTrain small groups\nTRS311209\nEstablish and conduct business relationships\n\nCODE NO.\nCORE COMPETENCIES\n\nTRS512345\n\nPlan and prepare food for ala carte and buffets\nTRS512346\n\nPlan and control menu-based catering\nTRS512347\n\nOrganize bulk cooking operations\nTRS512348\n\nPrepare pates and terrines\nTRS512349\n\nPlan, prepare and display a buffet\nTRS512350\n\nSelect, prepare and serve specialized food items\nTRS512351\n\nSelect, prepare and serve specialty cuisines\nTRS512352\n\nMonitor catering revenue and costs\nTRS512353\n\nEstablish and maintain quality control\nTRS512354\n\nApply cook-chill-freeze production processes\n\n--- PDF PAGE 4 ---\n________________________________________________________________________________________________________________________________ 2\n\nTR – Commercial Cooking NCIII Promulgated April 2007\n\nA person who has achieved this Qualification is competent to be a:\n\n Chef de Partie\n Head Chef\n\n--- PDF PAGE 5 ---\n________________________________________________________________________________________________________________________________ 3\n\nTR – Commercial Cooking NCIII Promulgated April 2007"
}
