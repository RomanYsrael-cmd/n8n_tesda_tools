        "source_text": "091605\n59\n3.3 TRAINEE ENTRY REQUIREMENTS\n\nTrainees or students wishing to gain entry into this course should possess the\nfollowing requirements:\n\n•\ncompleted training in FCAW NC II or a holder of FCAW NC II\n•\ncan communicate either oral and written\n•\nphysically and mentally fit\n•\ncan perform basic mathematical computation\n\n3.4 LIST OF TOOLS, EQUIPMENT AND MATERIALS\n\nRecommended list of tools and materials per trainee for FLUX CORED ARC\nWELDING - NC III\n\nTOOLS\n(for 25 trainees)\nEQUIPMENT\n(for 25 trainees)\nMATERIAL\n(per trainee)\nQty.\nDescription\nQty.\nDescription\nQty.\nDescription\n25 pcs.\nChipping\nHammer\n12 units\nFCAW Welding\nmachine, FCAW\ngun and\naccessories\n1.5 reel\nFlux cored wire,\nE308T-1 or\nE309T-1 or\nequivalent\n75 pcs.\nSteel brush\n12 pcs.\nWelding\npositioners\n24 pcs.\n\nMild steel plate\n3.2mm X 50mm\nX 150mm\n12 pcs.\nPlier/tongs\n12 units\nPortable disc\ngrinder\n24 pcs\nMild steel plate\n10mm X 100mm\nX 150mm\n20 pcs. Files-bastard\ncut\n1 unit\nExhaust fan\n30 pcs.\n\nCarbon steel\npipe, schedule\n40 ,150mm dia.\nX 150mm\n25 pcs.\nWelding Mask\n2 units\nWork bench w/\nbench vice on 4\ncorners\n4pcs.\nAlloy steel plate\n10mm x100mm x\n150mm\n(Optional)\n25 sets\nLeather\napron/jacket\n2 sets\nOxy-\nacetylene/Oxy-\nLPG cutting outfit\n2 pcs.\nAlloy steel pipes\nsch. 40 dia.\n150mm x 150mm\n(Optional)\n50 sets Leather gloves,\nlong\n1 unit\nPedestal /bench\ngrinding machine\n38 pcs\nCutting disc\n3/32” x 5/8\" x 4”\ndia.\n5 pcs.\nSafety goggles,\nwide vision,\nclear\n1 unit\nIndustrial fan\n\n--- PDF PAGE 62 ---\nfcaw nc iii"
