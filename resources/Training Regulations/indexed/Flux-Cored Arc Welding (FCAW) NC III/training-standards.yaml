        "source_text": "091605\n60\n5 pcs.\nOxy-acetylene\ngoggles\n\n19 pcs.\nGrinding disc\n1/4” x 5/8\" x 4”\ndia.\n12 pcs.\nTry square 300\nmm. long\n\n5 cyl.\nShielding gas\n(75% argon 25%\nCO2)\n12 pcs.\nSteel square\n300 mm. long\n\n1 cyl.\noxygen\n12 pcs. Files-half round\n1 cyl.\nLPG / Acetylene\n5 pcs.\nFillet gauge\n3 pcs.\nDark glass\n1 pc.\nWire Cutter\n46 pcs.\nLens clear glass\n1 pc.\nHand Hacksaw\n1 tube\nMetal chalk\n\n3.5 TRAINING FACILITIES\nFLUX CORED ARC WELDING - NC III\n\nThe welding workshop must be of concrete structure. Based on class size of 25\nstudents/trainees the space requirements for the teaching/learning and circulation areas\nare as follows:\n\nTEACHING/LEARNING\nAREAS\nSIZE IN\nMETERS\nAREA IN\nSQ.\nMETERS\nQTY\nTOTAL AREA\nIN SQ.\nMETERS\nWelding Booth\n2 X 1.5\n3\n5\n15\nGrinding Booth*\n2 X 1.5\n3\n2\n6\nMaterials/Preparation\nArea*\n2 X 2\n4\n\n4\nBench work Area*\n1.5 X 2.5\n4\n2\n8\nTool Room & S/M\nStorage Area*\n4 X 5\n20\n\n20\nLearning Resource\nArea*\n5 X 9\n45\n\n45\nWash Area /Comfort\nRoom (male & female) *\n2.5 X 4\n10\n\n10\nTotal\n\n108\nCirculation Area**\n\n32\nTotal Workshop Area\n\n140\n\n--- PDF PAGE 63 ---\nfcaw nc iii\n 091605\n61\n* This area can also be used by other welding courses.\n** Area requirement is equivalent to 30% of the total teaching/learning areas\n\n3.6 TRAINERS QUALIFICATIONS FOR FCAW WELDER\n\nFLUX CORED ARC WELDING - NC III\n\nTRAINER QUALIFICATION (TQ III)\n\n•\nMust be a holder of FCAW NC III\n•\nMust have completed training in SMAW NC III and NC IV\n•\nMust have undergone training on Training Methodology III (TM III)\n•\nMust be physically and mentally fit\n•\n*Must have at least 2 years job/industry experience\n•\nMust be a civil service eligible (for government position or appropriate\nprofessional license issued by the Professional Regulatory Commission)\n\n* Optional. Only when required by the hiring institution\n\nReference: TESDA Board Resolution No. 2004 03\n\n3.7 INSTITUTIONAL ASSESSMENT\n\nInstitutional Assessment is to be undertaken by trainees to determine the\nachievement of units of competency. A certificate of achievement is issued for\neach unit of competency.\n\n--- PDF PAGE 64 ---\nfcaw nc iii\n 091605\n62"
