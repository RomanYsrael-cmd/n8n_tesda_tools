riculum. Delivery\nshould be guided by the 10 basic principles of competency-based TVET.\n\n• The training is based on curriculum developed from the competency standards;\n• Learning is modular in its structure;\n• Training delivery is individualized and self-paced;\n• Training is based on work that must be performed;\n• Training materials are directly related to the competency standards and the\ncurriculum modules;\n• Assessment is based in the collection of evidence of the performance of work to\nthe industry required standard;\n• Training is based both on and off-the-job components;\n• Allows for recognition of prior learning (RPL) or current competencies;\n• Training allows for multiple entry and exit; and\n• Approved training programs are Nationally Accredited\n\nThe competency-based TVET system recognizes various types of delivery\nmodes, both on and off-the-job as long as the learning is driven by the competency\nstandards specified by the industry. The following training modalities may be\nadopted when designing training programs:\n• The dualized mode of training delivery is preferred and recommended. Thus\nprograms would contain both in-school and in-industry training or fieldwork\ncomponents. Details can be referred to the Dual Training System (DTS)\nImplementing Rules and Regulations.\n• Modular/self-paced learning is a competency-based training modality wherein\nthe trainee is allowed to progress at his own pace. The trainer just facilitates the\ntraining delivery.\n• Peer teaching/mentoring is a training modality wherein fast learners are given\nthe opportunity to assist the slow learners.\n• Supervised industry training or on-the-job training is an approach in training\ndesigned to enhance the knowledge and skills of the trainee through actual\nexperience in the workplace to acquire specific competencies prescribed in the\ntraining regulations.\n• Distance learning is a formal education process in which majority of the\ninstruction occurs when the students and instructor are not in the same place.\nDistance learning may employ correspondence study, audio, video or computer\ntechnologies.\n\n--- PDF PAGE 61 ---\nfcaw nc iii\n 091605\n59\n3.3 TRAINEE ENTRY REQUIREMENTS\n\nTrainees or students wishing to gain entry into this course should possess the\nfollowing requirements:\n\n•\ncompleted training in FCAW NC II or a holder of FCAW NC II\n•\ncan communicate either oral and written\n•\nphysically and mentally fit\n•\ncan perform basic mathematical computation\n\n3.4 LIST OF TOOLS, EQUIPMENT AND MATERIALS\n\nRecommended list of tools and materials per trainee for FLUX CORED ARC\nWELDING - NC III\n\nTOOLS\n(for 25 trainees)\nEQUIPMENT\n(for 25 trainees)\nMATERIAL\n(per trainee)\nQty.\nDescription\nQty.\nDescription\nQty.\nDescription\n25 pcs.\nChipping\nHammer\n12 units\nFCAW Welding\nmachine, FCAW\ngun and\naccessories\n1.5 reel\nFlux cored wire,\nE308T-1 or\nE309T-1 or\nequivalent\n75 pcs.\nSteel brush\n12 pcs.\nWelding\npositioners\n24 pcs.\n\nMild steel plate\n3.2mm X 50mm\nX 150mm\n12 pcs.\nPlier/tongs\n12 units\nPortable disc\ngrinder\n24 pcs\nMild steel plate\n10mm X 100mm\nX 150mm\n20 pcs. Files-bastard\ncut\n1 unit\nExhaust fan\n30 pcs.\n\nCarbon steel\npipe, schedule\n40 ,150mm dia.\nX 150mm\n25 pcs.\nWelding Mask\n2 units\nWork bench w/\nbench vice on 4\ncorners\n4pcs.\nAlloy steel plate\n10mm x100mm x\n150mm\n(Optional)\n25 sets\nLeather\napron/jacket\n2 sets\nOxy-\nacetylene/Oxy-\nLPG cutting outfit\n2 pcs.\nAlloy steel pipes\nsch. 40 dia.\n150mm x 150mm\n(Optional)\n50 sets Leather gloves,\nlong\n1 unit\nPedestal /bench\ngrinding machine\n38 pcs\nCutting disc\n3/32” x 5/8\" x 4”\ndia.\n5 pcs.\nSafety goggles,\nwide vision,\nclear\n1 unit\nIndustrial fan\n\n--- PDF PAGE 62 ---\nfcaw nc iii\n 091605\n60\n5 pcs.\nOxy-acetylene\ngoggles\n\n19 pcs.\nGrinding disc\n1/4” x 5/8\" x 4”\ndia.\n12 pcs.\nTry square 300\nmm. long\n\n5 cyl.\nShielding gas\n(75% argon 25%\nCO2)\n12 pcs.\nSteel square\n300 mm. long\n\n1 cyl.\noxygen\n12 pcs. Files-half round\n1 cyl.\nLPG / Acetylene\n5 pcs.\nFillet gauge\n3 pcs.\nDark glass\n1 pc.\nWire Cutter\n46 pcs.\nLens clear glass\n1 pc.\nHand Hacksaw\n1 tube\nMetal chalk\n\n3.5 TRAINING FACILITIES\nFLUX CORED ARC WELDING - NC III\n\nThe welding workshop must be of concrete structure. Based on class size of 25\nstudents/trainees the space requirements for the teaching/learning and circulation areas\nare as follows:\n\nTEACHING/LEARNING\nAREAS\nSIZE IN\nMETERS\nAREA IN\nSQ.\nMETERS\nQTY\nTOTAL AREA\nIN SQ.\nMETERS\nWelding Booth\n2 X 1.5\n3\n5\n15\nGrinding Booth*\n2 X 1.5\n3\n2\n6\nMaterials/Preparation\nArea*\n2 X 2\n4\n\n4\nBench work Area*\n1.5 X 2.5\n4\n2\n8\nTool Room & S/M\nStorage Area*\n4 X 5\n20\n\n20\nLearning Resource\nArea*\n5 X 9\n45\n\n45\nWash Area /Comfort\nRoom (male & female) *\n2.5 X 4\n10\n\n10\nTotal\n\n108\nCirculation Area**\n\n32\nTotal Workshop Area\n\n140\n\n--- PDF PAGE 63 ---\nfcaw nc iii\n 091605\n61\n* This area can also be used by other welding courses.\n** Area requirement is equivalent to 30% of the total teaching/learning areas\n\n3.6 TRAINERS QUALIFICATIONS FOR FCAW WELDER\n\nFLUX CORED ARC WELDING - NC III\n\nTRAINER QUALIFICATION (TQ III)\n\n•\nMust be a holder of FCAW NC III\n•\nMust have completed training in SMAW NC III and NC IV\n•\nMust have undergone training on Training Methodology III (TM III)\n•\nMust be physically and mentally fit\n•\n*Must have at least 2 years job/industry experience\n•\nMust be a civil service eligible (for government position or appropriate\nprofessional license issued by the Professional Regulatory Commission)\n\n* Optional. Only when required by the hiring institution\n\nReference: TESDA Board Resolution No. 2004 03\n\n3.7 INSTITUTIONAL ASSESSMENT\n\nInstitutional Assessment is to be undertaken by trainees to determine the\nachievement of units of competency. A certificate of achievement is issued for\neach unit of competency.\n\n--- PDF PAGE 64 ---\nfcaw nc iii\n 091605\n62"
