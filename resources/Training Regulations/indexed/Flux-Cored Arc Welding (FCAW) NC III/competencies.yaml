  "source_section_text": "SECTION 2 COMPETENCY STANDARDS\n\nThis section gives the details of the contents of the core units of competency\nrequired in FLUX-CORED WELDING (FCAW) NC III.\n\nBASIC COMPETENCIES\n\nUNIT OF COMPETENCY : LEAD WORKPLACE COMMUNICATION\n\nUNIT CODE\n : 500311109\n\n UNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes\n\n required to lead in the dissemination and discussion of\n ideas, information and issues in the workplace.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Communicate\ninformation about\nworkplace\nprocesses\n1.1.\nAppropriate communication method is selected\n1.2.\nMultiple operations involving several topics areas are\n communicated accordingly\n1.3.\nQuestions are used to gain extra information\n1.4.\nCorrect sources of information are identified\n1.5.\nInformation is selected and organized correctly\n1.6.\nVerbal and written reporting is undertaken when\n required\n1.7.\nCommunication skills are maintained in all situations\n2. Lead workplace\ndiscussions\n2.1.\nResponses to workplace issues are sought\n2.2.\nResponses to workplace issues are provided\nimmediately\n2.3.\nConstructive contributions are made to workplace\ndiscussions based on production, quality and safety\n2.4.\nGoals/objectives and action plan undertaken in the\nworkplace are communicated based on procedures\n3. Identify and\ncommunicate issues\narising in the\nworkplace\n3.1.\nIssues and problems are identified per procedure\n3.2.\nInformation regarding problems and issues are\norganized coherently to ensure clear and effective\ncommunication\n3.3.\nDialogue is initiated with appropriate personnel\n3.4.\nCommunication problems and issues are raised as\nper procedure\n\n--- PDF PAGE 5 ---\nfcaw nc iii\n 091605\n3\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Methods of\ncommunication\n1.1.\nNon-verbal gestures\n1.2.\nVerbal\n1.3.\nFace to face\n1.4.\nTwo-way radio\n1.5.\nSpeaking to groups\n1.6.\nUsing telephone\n1.7.\nWritten\n1.8.\nInternet\n\n--- PDF PAGE 6 ---\nfcaw nc iii\n 091605\n4\nEVIDENCE GUIDE\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1.\nDealt with a range of communication/information at\none time\n1.2.\nMade constructive contributions in workplace issues\n1.3.\nSought workplace issues effectively\n1.4.\nResponded to workplace issues promptly\n1.5.\nPresented information clearly and effectively written\nform\n1.6.\nUsed appropriate sources of information\n1.7.\nAsked appropriate questions\n1.8.\nProvided accurate information\n2. Underpinning\nknowledge and\nattitudes\n2.1.\nOrganization requirements for written and electronic\ncommunication methods\n2.2.\nEffective verbal communication methods\n3. Underpinning skills\n3.1.\nOrganize information\n3.2.\nUnderstand and convey intended meaning\n3.3.\nParticipate in variety of workplace discussions\n3.4.\nComply with organization requirements for the use\nof written and electronic communication methods\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1.\nVariety of Information\n4.2.\nCommunication tools\n4.3.\nSimulated workplace\n5. Methods of\nassessment\nCompetency may be assessed through:\n5.1.\nCompetency in this unit must be assessed through\n5.2.\nDirect Observation\n5.3.\nInterview\n6. Context for\nassessment\n6.1.\nAssessment may be conducted in the workplace or\nin a simulated work environment.\n\n--- PDF PAGE 7 ---\nfcaw nc iii\n 091605\n5\nUNIT OF COMPETENCY\n: LEAD SMALL TEAMS\n\nUNIT CODE\n\n: 500311110\n\nUNIT DESCRIPTOR\n: This unit covers the knowledge, skills and attitudes to\n\n lead small teams including setting and maintaining team\n\n and individual performance standards.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Provide team\nleadership\n1.1.\nWork requirements are identified and presented to team\nmembers\n1.2.\nReasons for instructions and requirements are\ncommunicated to team members\n1.3.\nTeam members’ queries and concerns are recognized,\ndiscussed and dealt with\n2. Assign\nresponsibilities\n2.1.\nDuties, and responsibilities are allocated having regard\nto the skills, knowledge and aptitude required to properly\nundertake the assigned task and according to company\npolicy\n2.2.\nDuties are allocated having regard to individual\npreference, domestic and personal considerations,\nwhenever possible\n3. Set performance\nexpectations for\nteam members\n3.1.\nPerformance expectations are established based on\nclient needs and according to assignment requirements\n3.2.\nPerformance expectations are based on individual team\nmembers duties and area of responsibility\n3.3.\nPerformance expectations are discussed and\ndisseminated to individual team members\n4. Supervised team\nperformance\n4.1.\nMonitoring of performance is performed (takes place\nagainst) based on defined performance criteria and/or\nassignment instructions and corrective action taken if\nrequired\n4.2.\nTeam members are provided with feedback, positive\nsupport and advice on strategies to overcome any\ndeficiencies\n4.3.\nPerformance issues which cannot be rectified or\naddressed within the team are referred (referenced) to\nappropriate personnel according to employer policy\n4.4.\nTeam members are kept informed of any changes in the\npriority allocated to assignments or tasks based on (which\nmight impact) on client/customer needs and satisfaction\n4.5.\nTeam operations are monitored to ensure that\nemployer/client needs and requirements are met\n4.6.\nFollow-up communication is provided on all issues\naffecting the team based on procedure\n4.7.\nAll relevant documentation is completed in accordance\nwith company procedures\n\n--- PDF PAGE 8 ---\nfcaw nc iii\n 091605\n6\n\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Work requirements\n1.1. Client Profile\n1.2. Assignment instructions\n2. Team member’s\nconcerns\n2.1. Roster/shift details\n3. Monitor\nperformance\n3.1. Formal process\n3.2. Informal process\n4. Feedback\n4.1. Formal process\n4.2. Informal process\n5. Performance issues\n5.1. Work output\n5.2. Work quality\n5.3. Team participation\n5.4. Compliance with workplace protocols\n5.5. Safety\n5.6. Customer service\n\n--- PDF PAGE 9 ---\nfcaw nc iii\n 091605\n7\n\nEVIDENCE GUIDE\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1. Maintained or improved individuals and/or team\nperformance given a variety of possible scenario\n1.2. Assessed and monitored team and individual\nperformance against set criteria\n1.3. Represented concerns of a team and individual to\nnext level of management or appropriate specialist\nand to negotiate on their behalf\n1.4. Allocated duties and responsibilities, having regard to\nindividual’s knowledge, skills and aptitude and the\nneeds of the tasks to be performed\n1.5. Set and communicated performance expectations for\na range of tasks and duties within the team and\nprovided feedback to team members\n2. Underpinning\nknowledge\n2.1. Company policies and procedures\n2.2. Relevant legal requirements\n2.3. How performance expectations are set\n2.4. Methods of Monitoring Performance\n2.5. Client expectations\n2.6.\nTeam member’s duties and responsibilities\n3. Underpinning skills\n3.1. Communication skills required for leading teams\n3.2. Informal performance counseling skills\n3.3. Team building skills\n3.4.\nNegotiating skills\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1. Access to relevant workplace or appropriately\nsimulated environment where assessment can take\nplace\n4.2.\nMaterials relevant to the proposed activity or task\n5. Methods of\nassessment\nCompetency may be assessed through:\n5.1. Direct observations of work activities of the individual\nmember in relation to the work activities of the group\n5.2. Observation of simulation and/or role play involving\nthe participation of individual member to the\nattainment of organizational goal\n5.3. Case studies and scenarios as a basis for discussion\nof issues and strategies in teamwork\n6. Context for\nassessment\n6.1. Competency assessment may occur in workplace or\nany appropriately simulated environment\n6.2. Assessment shall be observed while task are being\nundertaken whether individually or in-group\n\n--- PDF PAGE 10 ---\nfcaw nc iii\n 091605\n8\n\nUNIT OF COMPETENCY : DEVELOP AND PRACTICE NEGOTIATION SKILLS\n\nUNIT CODE : 500311111\n\nUNIT DESCRIPTOR : This unit covers the skills, knowledge and attitudes required\nto collect information in order to negotiate to a desired\noutcome and participate in the negotiation.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Plan negotiations\n1.1\n\n1.2\n\n1.3\n\n1.4\n\n1.5\nInformation on preparing for negotiation is identified\nand included in the plan\nInformation on creating non verbal environments for\npositive negotiating is identified and included in the\nplan\nInformation on active listening is identified and\nincluded in the plan\nInformation on different questioning techniques is\nidentified and included in the plan\nInformation is checked to ensure it is correct and up-\nto- date\n2. Participate in\n negotiations\n2.1\n\n2.2\n\n2.3\n\n2.4\n\n2.5\n\n2.6\n\n2.7\n2.8\nCriteria for successful outcome are agreed upon by all\nparties per procedure\nDesired outcome of all parties are considered per\nprocedure\nAppropriate language is used throughout the\nnegotiation\nA variety of questioning techniques are used based on\nstandard\nThe issues and processes are documented and\nagreed upon by all parties per procedure\nPossible solutions are discussed and their viability\nassessed based on agreements\nAreas for agreement are confirmed and recorded\nFollow-up action is agreed upon by all parties\n\n--- PDF PAGE 11 ---\nfcaw nc iii\n 091605\n9\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Preparing for\nnegotiation\n1.1\n\n1.2\n1.3\n1.4\n\n1.5\n\n1.6\nBackground information on other parties to the\nnegotiation\nGood understanding of topic to be negotiated\nClear understanding of desired outcome/s\nPersonal attributes\n1.4.1 self awareness\n1.4.2 self esteem\n1.4.3 objectivity\n1.4.4 empathy\n1.4.5 respect for others\nInterpersonal skills\n1.5.1 listening/reflecting\n1.5.2 non verbal communication\n1.5.3 assertiveness\n1.5.4 behavior labeling\n1.5.5 testing understanding\n1.5.6 seeking information\n1.5.7 self disclosing\nAnalytic skills\n1.6.1 observing differences between content and\nprocess\n1.6.2 identifying bargaining information\n1.6.3 applying strategies to manage process\n1.6.4 applying steps in negotiating process\n1.6.5 strategies to manage conflict\n1.6.6 steps in negotiating process\n1.6.7 options within organization and externally for\nresolving conflict\n2. Non verbal\nenvironments\n2.1\n2.2\n2.3\n2.4\nFriendly reception\nWarm and welcoming room\nRefreshments offered\nLead in conversation before negotiation begins\n3. Active listening\n3.1\n3.2\n3.3\n3.4\n3.5\nAttentive\nDon’t interrupt\nGood posture\nMaintain eye contact\nReflective listening\n4. Questioning\ntechniques\n4.1\n4.2\n4.3\nDirect\nIndirect\nOpen-ended\n\n--- PDF PAGE 12 ---\nfcaw nc iii\n 091605\n10\nEVIDENCE GUIDE\n1. Critical aspects of\n competency\nAssessment requires evidence that the candidate:\n1.1 Demonstrated sufficient knowledge of the factors\ninfluencing negotiation to achieve agreed outcome\n1.2 Participated in negotiation with at least one person to\nachieve an agreed outcome\n2. Underpinning\n knowledge and\n attitude\n2.1 Codes of practice and guidelines for the organization\n2.2 Organizations policy and procedures for negotiations\n2.3 Decision making and conflict resolution strategies\nprocedures\n2.4 Problem solving strategies on how to deal with\nunexpected questions and attitudes during negotiation\n2.5 Flexibility\n2.6 Empathy\n3. Underpinning skills\n3.1 Interpersonal skills to develop rapport with other parties\n3.2 Communication skills (verbal and listening)\n3.3 Observation skills\n3.4 Negotiation skills\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Room with facilities necessary for the negotiation\n process\n4.2 Human resources (negotiators)\n5. Methods of\nassessment\nCompetency may be assessed through:\n5.1 Observation/demonstration and questioning\n5.2 Portfolio assessment\n5.3 Oral and written questioning\n5.4 Third party report\n6. Context for\nassessment\n6.1 Assessment may be conducted in the workplace or in a\nsimulated work environment..\n\n--- PDF PAGE 13 ---\nfcaw nc iii\n 091605\n11\nUNIT OF COMPETENCY :\nSOLVE PROBLEMS RELATED TO WORK ACTIVITIES\nUNIT CODE\n: 500311112\nUNIT DESCRIPTOR\n:\nThis unit of competency covers the knowledge, skills and\nattitudes required to solve problems in the workplace\nincluding the application of problem solving techniques\nand to determine and resolve the root cause of\nproblems.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Identify the problem\n1.1.\nVariances are identified from normal operating\nparameters and product quality\n1.2.\nExtent, cause and nature of the problem are defined\nbased on observation, investigation and analytical\ntechniques\n1.3.\nProblems are clearly stated and specified\n2. Determine\nfundamental\ncauses of the\nproblem\n2.1.\nPossible causes of the problem are identified based\non experience and the use of problem solving tools /\nanalytical techniques.\n2.2.\nPossible cause statements are developed based on\nfindings\n2.3.\nFundamental causes are identified per results of\ninvestigation conducted\n3. Determine\ncorrective action\n3.1.\nAll possible options are considered for resolution of\nthe problem per procedure\n3.2.\nStrengths and weaknesses of possible options are\nconsidered\n3.3.\nCorrective actions are determined to resolve the\nproblem and possible future causes\n3.4.\nAction plans are developed identifying measurable\nobjectives, resource needs and timelines in\naccordance with safety and operating procedures\n4. Provide\nrecommendation/s\nto manager\n4.1.\nReport on recommendations are prepared per\nprocedure\n4.2.\nRecommendations are presented to appropriate\npersonnel.\n4.3.\nRecommendations are followed-up, if required\n\n--- PDF PAGE 14 ---\nfcaw nc iii\n 091605\n12\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Analytical\ntechniques\n1.1.\nBrainstorming\n1.2.\nIntuitions/Logic\n1.3.\nCause and effect diagrams\n1.4.\nPareto analysis\n1.5.\nSWOT analysis\n1.6.\nGant chart, Pert CPM and graphs\n1.7.\nScatter grams\n2. Problem\n\n2.1.\nNon – routine process and quality problems\n2.2.\nEquipment selection, availability and failure\n2.3.\nTeamwork and work allocation problem\n2.4.\nSafety and emergency situations and incidents\n3. Action plans\n\n3.1.\nPriority requirements\n3.2.\nMeasurable objectives\n3.3.\nResource requirements\n3.4.\nTimelines\n3.5.\nCo-ordination and feedback requirements\n3.6.\nSafety requirements\n3.7.\nRisk assessment\n3.8.\nEnvironmental requirements\n\n--- PDF PAGE 15 ---\nfcaw nc iii\n 091605\n13\nEVIDENCE GUIDE\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1.\nIdentified the problem\n1.2.\nDetermined the fundamental causes of the problem\n1.3.\nDetermined the correct / preventive action\n1.4.\nProvided recommendation to manager\nThese aspects may be best assessed using a range of\nscenarios / case studies / what ifs as a stimulus with a walk\nthrough forming part of the response. These assessment\nactivities should include a range of problems, including\nnew, unusual and improbable situations that may have\nhappened.\n2. Underpinning\nknowledge\n2.1.\nCompetence includes a thorough knowledge and\nunderstanding of the process, normal operating\nparameters, and product quality to recognize non-\nstandard situations\n2.2.\nCompetence to include the ability to apply and\nexplain, sufficient information for the identification of\nfundamental cause, determining the corrective action\nand provision of recommendations\n2.2.1. Relevant equipment and operational\nprocesses\n2.2.2. Enterprise goals, targets and measures\n2.2.3. Enterprise quality, OHS and environmental\nrequirement\n2.2.4. Principles of decision making strategies and\ntechniques\n2.2.5. Enterprise information systems and data\ncollation\n2.2.6. Industry codes and standards\n3. Underpinning skills\n3.1.\nUsing range of formal problem solving techniques\n3.2.\nIdentifying and clarifying the nature of the problem\n3.3.\nDevising the best solution\n3.4.\nEvaluating the solution\n3.5.\nImplementation of a developed plan to rectify the\nproblem\n\n--- PDF PAGE 16 ---\nfcaw nc iii\n 091605\n14\n4. Resource\nimplications\n4.1.\nAssessment will require access to an operating plant\nover an extended period of time, or a suitable\nmethod of gathering evidence of operating ability\nover a range of situations. A bank of scenarios / case\nstudies / what ifs will be required as well as bank of\nquestions which will be used to probe the reason\nbehind the observable action.\n5. Methods of\nassessment\nCompetency may be assessed through:\n5.1.\nCase studies on solving problems in the workplace\n5.2.\n Observation\nThe unit will be assessed in a holistic manner and is\npractical and may be integrated with the assessment of\nother relevant units of competency. Assessment will occur\nover a range of situations, which will include disruptions to\nnormal, smooth operation. Simulation may be required to\nallow for timely assessment of parts of this unit of\ncompetency. Simulation should be based on the actual\nworkplace and will include walk through of the relevant\ncompetency components.\n6. Context for\nassessment\n6.1.\nAssessment may be conducted in the workplace or\nin a simulated work environment. In the workplace, it\nmay be appropriate to assess this unit concurrently\nwith relevant teamwork or operation units.\n\n--- PDF PAGE 17 ---\nfcaw nc iii\n 091605\n15\n\nUNIT OF COMPETENCY :\nUSE MATHEMATICAL CONCEPTS AND\n\nTECHNIQUES\n\nUNIT CODE :\n3500311113\n\nUNIT DESCRIPTOR :\nThis unit covers the knowledge, skills and attitudes\n\n required in the application of mathematical\n\n concepts and techniques.\n\nELEMENT\nPerformance Criteria\nItalicized terms are elaborated in the Range of Variables\n1. Identify\nmathematical tools\nand techniques to\nsolve problem\n1.1 Problem areas are identified based on given condition\n1.2 Mathematical techniques are selected based on the\ngiven problem\n2. Apply mathematical\nprocedure/solution\n2.1 Mathematical techniques are applied based on the\nproblem identified\n2.2 Mathematical computations are performed to the level\nof accuracy required for the problem\n2.3 Results of mathematical computation is determined and\nverified based on job requirements\n3. Analyze results\n3.1 Result of application is reviewed based on expected\nand required specifications and outcome\n3.2 Appropriate action is applied in case of error\n\n--- PDF PAGE 18 ---\nfcaw nc iii\n 091605\n16\n\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Mathematical\ntechniques\nMay include but are not limited to:\n1.1 Four fundamental operations\n1.2 Measurements\n1.3 Use/Conversion of units of measurements\n1.4 Use of standard formulas\n2. Appropriate action\n2.1 Review in the use of mathematical techniques (e.g.\n recalculation, re-modeling)\n2.2 Report error to immediate superior for proper action\n\n--- PDF PAGE 19 ---\nfcaw nc iii\n 091605\n17\nEVIDENCE GUIDE\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Identified, applied and reviewed the use of\nmathematical concepts and techniques to workplace\nproblems\n2. Underpinning\nknowledge\n2.1 Fundamental operation (addition, subtraction, division,\nmultiplication)\n2.2 Measurement system\n2.3 Precision and accuracy\n2.4 Basic measuring tools/devices\n3. Underpinning skills\n3.1 Applying mathematical computations\n3.2 Using calculator\n3.3 Using different measuring tools\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Calculator\n4.2 Basic measuring tools\n4.3 Case Problems\n5. Methods of\nassessment\nCompetency may be assessed through:\n5.1 Authenticated portfolio\n5.2 Written Test\n5.3 Interview/Oral Questioning\n5.4 Demonstration\n6. Context for\nassessment\n6.1 Assessment may be conducted in the workplace or in a\nsimulated work environment.\n\n--- PDF PAGE 20 ---\nfcaw nc iii\n 091605\n18\nUNIT OF COMPETENCY :\n USE RELEVANT TECHNOLOGIES\n\nUNIT CODE :\n 500311114\n\nUNIT DESCRIPTOR :\n This unit of competency covers the knowledge,\n\n skills, and attitude required in selecting, sourcing\n\n and applying appropriate and affordable\n\n technologies in the workplace.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n\n1. Study/select\nappropriate\ntechnology\n\n1.1 Usage of different technologies is determined based on\njob requirements\n1.2 Appropriate technology is selected as per work\n specification\n\n2. Apply relevant\ntechnology\n\n2.1 Relevant technology is effectively used in carrying\n out function\n2.2 Applicable softwares and hardwares are used as per\n task requirement\n2.3 Management concepts are observed and practiced as\n per established industry practices\n\n3. Maintain/enhance of\nrelevant technology\n\n3.1 Maintenance of technology is applied in accordance with\nthe industry standard operating procedure,\nmanufacturer’s operating guidelines and\noccupational health and safety procedure to ensure\nits operative ability\n3.2 Updating of technology is maintained through continuing\neducation or training in accordance with job requirement\n3.3 Technology failure/ defect is immediately reported to the\n concern/responsible person or section for appropriate\n action\n\n--- PDF PAGE 21 ---\nfcaw nc iii\n 091605\n19\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Technology\nMay include but are not limited to:\n1.1 Office technology\n1.2 Industrial technology\n1.3 System technology\n1.4 Information technology\n1.5 Training technology\n2. Management\nconcepts\nMay include but not limited to:\n2.1 Real Time Management\n2.2 KAIZEN or continuous improvement\n2.3 5s\n3.4 Total Quality Management\n3.5 Other management/productivity tools\n3. Industry standard\noperating procedure\n3.1 Written guidelines relative to the usage of office\ntechnology/equipment\n3.2 Verbal advise/instruction from the co-worker\n4. Manufacturer’s\noperating guidelines/\ninstructions\n4.1 Written instruction/manuals of specific technology/\n equipment\n4.2 General instruction manual\n4.3 Verbal advise from manufacturer relative to the\noperation of equipment\n5. Occupational health\nand safety\nprocedure\n5.1 Relevant statutes on OHS\n5.2 Company guidelines in using\n technology/equipment\n6. Appropriate action\n6.1 Implementing preventive maintenance schedule\n6.2 Coordinating with manufacturer’s technician\n\n--- PDF PAGE 22 ---\nfcaw nc iii\n 091605\n20\nEVIDENCE GUIDE\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Studied and selected appropriate technology\nconsistent with work requirements\n1.2 Applied relevant technology\n1.3 Maintained and enhanced operative ability of relevant\ntechnology\n2. Underpinning\nknowledge and\nattitudes\n2.1 Awareness on technology and its function\n2.2 Repair and maintenance procedure\n2.3 Operating instructions\n2.4 Applicable software\n2.5 Communication techniques\n2.6 Health and safety procedure\n2.7 Company policy in relation to relevant technology\n2.8 Different management concepts\n2.9 Technology adaptability\n3. Underpinning skills\n3.1 Relevant technology application/implementation\n3.2 Basic communication skills\n3.3 Software applications skills\n3.4 Basic troubleshooting skills\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Relevant technology\n4.2 Interview and demonstration questionnaires\n4.3 Assessment packages\n5. Methods of\nassessment\nCompetency must be assessed through:\n5.1 Interview\n5.2 Actual demonstration\n5.3 Authenticated portfolio (related certificates of\ntraining/seminar)\n6. Context of\nassessment\n6.1 Competency may be assessed in actual workplace or\nsimulated environment\n\n--- PDF PAGE 23 ---\nfcaw nc iii\n 091605\n21\nCOMMON COMPETENCIES\n\nUNIT OF COMPETENCY : APPLY SAFETY PRACTICES\n\nUNIT CODE\n\n: MEE721201\n\nUNIT DESCRIPTOR\n\n: This unit covers the competencies required to apply\n safety practices in the workplace.\n\n ELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1.\nIdentify hazardous area\n1.1\n\n1.2\nHazards are identified correctly in accordance\nwith OHS principles.\nSafety signs and symbols are identified and\nadhered to.\n2.\nUse protective clothing\nand devices\n2.1\n\nAppropriate protective clothing and devices\ncorrectly selected and used in accordance with\nOHS requirements or industry/company policy\n3.\nPerform safe handling of\ntools, equipment and\nmaterials\n3.1\n\n3.2\nSafety procedures for pre-use check and\noperation of tools and equipment followed in\naccordance with industry/ company policies.\nTools, equipment and materials handled safely in\naccordance with OHS requirements and industry/\ncompany policies.\n4.\nPerform first aid\n4.1\nFirst aid treatment of injuries are carried out\naccording to recommended procedures\n5.\nUse fire extinguisher\n5.1\nFire extinguisher selected and operated correctly\naccording to the type of fire.\n\n--- PDF PAGE 24 ---\nfcaw nc iii\n 091605\n22\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Hazards\n1.1 Cluttered tools and materials\n1.2 Slippery floors (caused by oil, grease or any liquid)\n1.3 Exposed electrical wires\n1.4 Sharp edges\n1.5 Machine without guards or with exposed moving parts\n2. Protective clothing and\n devices\n Protective clothing and devices may include but is not\n limited to:\n2.1 safety glasses/goggles\n2.2 safety shoes\n2.3 overalls\n2.4 cap\n2.5 gloves\n3. Injuries\nInjuries may include:\n3.1 burns/scalds\n3.2 fractures\n3.3 cuts and abrasions\n3.4 poisoning\n3.5 foreign bodies in the eye\n3.6 concussion\n3.7 shock\n4. Type of fires\nFires involving or caused by:\n4.1 common combustibles (wood, cloth, paper, rubber\nand plastic)\n4.2 flammable liquids (gasoline, oil, solvents, paints, etc.)\n4.3 energized electrical equipment (wiring, fuse boxes,\ncircuit breakers, appliances, etc.\n4.4 combustible metals (magnesium, sodium, etc.)\n\n--- PDF PAGE 25 ---\nfcaw nc iii\n 091605\n23\nEVIDENCE GUIDE\n1.\nCritical aspects\nof competency\nAssessment requires evidence that the candidate:\n1.1 identified hazardous area\n1.2 used protective clothing and devices\n1.3 handled tools, equipment and materials properly\n1.4 performed first aid\n1.5 used fire extinguisher\n2.\nUnderpinning\nknowledge and\nattitude\n2.1 Shop safety signs, symbols and alarms\n2.2 Safety precautionary measures\n2.3 Housekeeping\n2.4 Machine tools\n2.5 First aid\n2.6 Engineering materials\n2.7 Fire extinguishers\n3.\nUnderpinning\nskills\n3.1 Operating machine tools\n3.2 Handling tools and materials\n3.3 Communicating with superiors and co-workers\n3.4 Interpreting instructions\n4.\nResource\nimplications\nThe following resources must be provided\n4.1 Tools, equipment and facilities appropriate to processes or\nactivity\n4.2 Materials relevant to the proposed activity\n5.\nMethod of\nassessment\nCompetency must be assessed through:\n5.1 Demonstration\n5.2 Written or oral short answer questions\n5.3 Practical exercises\n6.\nContext for\nassessment\n• Competency may be assessed in the workplace or in\n simulated workplace environment.\n\n--- PDF PAGE 26 ---\nfcaw nc iii\n 091605\n24\nUNIT OF COMPETENCY : INTERPRET DRAWINGS AND SKETCHES\n\nUNIT CODE\n\n: MEE721202\n\nUNIT DESCRIPTOR\n : This unit covers the competencies required to read and\n interpret drawings and sketches.\n\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1.\nIdentify standard\nalphabet of lines\n1.1\n1.2\nAlphabet of lines are identified\nUses of the alphabet of lines are explained\n2.\nIdentify orthographic/\nisometric views\n2.1\n2.2\nOrthographic and isometric drawing are identified\nOrthographic and isometric views are explained\n3.\nInterpret standard\ndrawing symbols,\ndimensional tolerances\nand notations\n3.1\n\n3.2\n\nDrawing symbols are interpreted according to\ndrawing standards\nDimensional tolerances, notations are interpreted\naccording to specifications\n\n--- PDF PAGE 27 ---\nfcaw nc iii\n 091605\n25\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Drawing\nDrawing technique include\n1.1 Perspective\n1.2 Exploded view\n1.3 Hidden view technique\n\nProjections\n1.4 First angle projections\n1.5 Third angle projections\n2. Tolerance\n2.1 General tolerance\n2.2 Angular tolerance\n2.3 Geometric tolerance\n\n--- PDF PAGE 28 ---\nfcaw nc iii\n 091605\n26\nEVIDENCE GUIDE\n1.\nCritical aspects\nof competency\nAssessment requires evidence that the candidate interpreted\ntechnical drawings and sketches.\n2.\nUnderpinning\nknowledge\n2.1 Alphabet of lines\n2.2 Projections\n2.3 Drawing symbols\n2.4 Dimensioning techniques\n2.5 Tolerances\n3.\nUnderpinning\nskills\n3.1 Communication skills (reading and comprehension)\n3.2 Computation skills\n\n4.\nResource\nimplications\nThe following resources must be provided\n4.1 Working drawing or plans or sketches\n4.2 Measuring tools\n4.3 Drawings, sketches or blueprint\n4.4 Specimen parts/components\n5.\nMethod of\nassessment\nCompetency must be assessed through:\n5.1 direct observation\n5.2 written or oral short answer questions\n5.3 demonstration\n5.4 project/work sample\n5.5 portfolio\n6.\nContext for\nassessment\n• Competency may be assessed in the workplace or in\n simulated workplace environment.\n\n--- PDF PAGE 29 ---\nfcaw nc iii\n 091605\n27\nUNIT OF COMPETENCY : PERFORM INDUSTRY CALCULATIONS\n\nUNIT CODE\n\n: MEE721203\n\nUNIT DESCRIPTOR\n\n: This unit covers the competencies required to perform\n basic calculations using the four fundamental\n operation.\n\n ELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1.\nPerform four\nfundamental operations.\n1.1\n\nSimple calculations involving whole numbers,\nmixed numbers, fraction and decimal are\nperformed using four fundamental operations.\n2.\nPerform conversion of\nunits\n2.1\n\n2.2\n\nUnits are converted to the required figure using\nthe given formulae\nEnglish measurements are converted to metric\nmeasurements according to procedure.\n3.\nPerform calculations on\nalgebraic expressions\n3.1\n\n3.2\n\n3.3\n\n3.4\nSimple calculations are performed on algebraic\nexpressions using four fundamental operations.\nSimple transposition of formulae are carried out to\nisolate the variable required, involving the four\nfundamental operations.\nWhere appropriate, formulae are constructed to\nenable problems to be solved.\nEquations involving on unknown solved correctly.\n4.\nCompute percentage\nand ratio\n4.1\nPercentages are computed using appropriate\nformula.\nRatio and proportion are computed using\nappropriate formula.\n\n--- PDF PAGE 30 ---\nfcaw nc iii\n 091605\n28\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Four fundamental\n operations\n1.1 Addition\n1.2 Subtraction\n1.3 Multiplication\n1.4 Division\n2. Units\n2.1 Fractions\n2.2 Mixed numbers\n2.3 decimal\n\n--- PDF PAGE 31 ---\nfcaw nc iii\n 091605\n29\nEVIDENCE GUIDE\n1.\nCritical aspects\nof competency\nAssessment requires evidence that the candidate performed\ncalculations:\n1.1 using four fundamental operations\n1.2 involving fractions and mixed numbers\n1.3 involving fractions and decimals\n1.4 on algebraic expressions\n1.5 involving ratio and proportion\n2.\nUnderpinning\nknowledge and\nattitude\n\n2.1 English and metric system of measurements\n2.2 Four fundamental operations\n2.3 Method of transposing formulae\n2.4 Equation formulation\n3.\nUnderpinning\nskills\n3.1 Performing calculations using pen and paper or with the use\nof calculator\n4.\nResource\nimplications\nThe following resources must be provided\n4.1 Tools and facilities appropriate to processes or activity\n4.2 Materials relevant to the proposed activity\n5.\nMethod of\nassessment\nCompetency must be assessed through:\n5.1 written or oral short answer questions\n5.2 practical exercises\n6.\nContext for\nassessment\nCompetency may be assessed in the workplace or in simulated\nworkplace environment.\n\n--- PDF PAGE 32 ---\nfcaw nc iii\n 091605\n30\nUNIT OF COMPETENCY : CONTRIBUTE TO QUALITY SYSTEM\n\nUNIT CODE\n\n: MEE721204\n\nUNIT DESCRIPTOR\n\n: This unit involves competence required to inspect work\n against specification and standards and apply quality\n standards to work.\n\n ELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1.\nInspect work done\n1.1\n\n1.2\n\n1.3\nAppropriate inspections are conducted to ensure\ncompany quality systems and procedures are\nmaintained/ followed.\nJob specifications/work order and quality\nstandards are identified.\nFaults/Defects are identified and rectified\naccording to company procedures.\n2.\nApply quality standards\nto work\n2.1\n\n2.2\n\n2.3\n\n2.4\nInspections are conducted throughout the\nmanufacturing processes to ensure quality\nstandards are maintained.\nAppropriate quality standards are applied\nthroughout the production/fabrication process.\nAll activities are coordinated throughout the\nworkplace to ensure efficient quality work\noutcomes.\nRecords of work quality are maintained according\nto the company requirements.\n3\nProtect company\nproperty and customer\ninterests\n3.1\n\n3.2\nPossible damage to company property is\navoided by adherence to company quality\nprocedures.\nQuality of work is reviewed to ensure customer\nrequirements and company standards are met.\n\n--- PDF PAGE 33 ---\nfcaw nc iii\n 091605\n31\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Quality system and\n procedures\nQuality system and procedures may be contained in:\n1.1 work instructions\n1.2 safe work procedures\n1.3 product specifications\n1.4 equipment maintenance schedules\n1.5 technical procedures adopted or specifically\nprepared standards\n1.6 company/industry rules\n\n2. Company property\nCompany properties includes :\n2.1 production and/or fabrication equipment\n2.2 hand and power tools\n2.3 OH&S paraphernalia\n2.4 facilities\n\n--- PDF PAGE 34 ---\nfcaw nc iii\n 091605\n32\nEVIDENCE GUIDE\n1.\nCritical aspects\nof competency\nAssessment requires evidence that the candidate:\n1.1 inspected work done against specification\n1.2 applied quality standards to work\n1.3 protected company property and customer interests\n2.\nUnderpinning\nknowledge and\nattitude\n2.1 Communication/feedback methods-written and verbal\n2.2 Company systems, processes and work quality\n requirements\n2.3 Work inspection techniques\n2.4 Quality assurance principles\n2.5 Safety precautionary measures\n2.6 Handling materials, tools and equipment\n3.\nUnderpinning\nskills\n3.1 Problem solving skills\n3.2 Communicating with superiors and co-workers\n3.3 Interpreting job specification and work order\n4.\nResource\nimplications\nThe following resources must be provided\n4.1 Tools, equipment and facilities appropriate to processes or\n activity\n4.2 Materials relevant to the proposed activity\n5.\nMethod of\nassessment\nCompetency must be assessed through:\n5.1 Demonstration\n5.2 Written or oral short answer questions\n5.3 Practical exercises\n6.\nContext for\nassessment\nCompetency may be assessed in the workplace or in simulated\nworkplace environment.\n\n--- PDF PAGE 35 ---\nfcaw nc iii\n 091605\n33\nUNIT OF COMPETENCY : USE HAND TOOLS\n\nUNIT CODE\n\n: MEE721205\n\nUNIT DESCRIPTOR\n\n: This unit covers the competencies required to use hand\n tools.\n\n ELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1.\nSelect hand tools\n1.1\n\n1.2\n\nHand tools selected are appropriate to the\nrequirements of the task.\nUnsafe or defective tools are identified and\nmarked for repair according to procedure.\n2.\nUse hand tools\n2.1\n\n2.2\n\nHand tools are used to produce the desired\noutcomes to job specifications.\nTask performed in accordance with company or\nindustry safety procedure.\n3.\nMaintain hand tools\n3.1\n\n3.2\n\nRoutine maintenance of hand tools is\nundertaken according to standard operating\nprocedures, principles and techniques.\nHand tools are stored in designated location in\naccordance with manufacturer’s\ninstruction/standard operating procedure.\n\n--- PDF PAGE 36 ---\nfcaw nc iii\n 091605\n34\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Hand tools\nHand tools includes but not limited to:\n1.1 Hacksaws\n1.2 Hammers (ball peen, chipping)\n1.3 Punches\n1.4 Screwdrivers\n1.5 Wrenches\n1.6 Scrapers\n1.7 Chisels\n1.8 Gouges\n1.9 Files\n1.10 Clamps\n2. Task\nTasks may include:\n2.1 Adjusting\n2.2 Dismantling\n2.3 Assembling\n2.4 Finishing of item or components\n3. Routine maintenance\nRoutine maintenance may include:\n3.1 Cleaning\n3.2 Lubricating\n3.3 Tightening\n3.4 Simple tool repair\n3.5 Hand sharpening\n\n--- PDF PAGE 37 ---\nfcaw nc iii\n 091605\n35\nEVIDENCE GUIDE\n1.\nCritical aspects\nof competency\nAssessment requires evidence that the candidate:\n1.1 Selected and used hand tools appropriate to the job\n1.2 Performed routine maintenance and storage of hand tools\n2.\nUnderpinning\nknowledge and\nattitude\n2.1 Types and uses of hand tools\n2.2 Hand tool defects\n2.3 Procedure, principles and techniques in maintenance of\n hand tools\n\n3.\nUnderpinning\nskills\n3.1 Handling tools and materials\n3.2 Communicating with superiors and co-workers\n3.3 Interpreting instructions\n4.\nResource\nimplications\nThe following resources must be provided\n4.1 Tools, equipment and facilities appropriate to the process\n or activity\n4.2 Materials relevant to the proposed activity\n5.\nMethod of\nassessment\nCompetency must be assessed through:\n5.1 Demonstration\n5.2 Written or oral short answer questions\n5.3 Practical exercises\n6.\nContext for\nassessment\nCompetency may be assessed in the workplace or in simulated\nworkplace environment.\n\n--- PDF PAGE 38 ---\nfcaw nc iii\n 091605\n36\nUNIT TITLE\n: PREPARE WELD MATERIALS\n\nUNIT CODE\n: MEE721206\n\nDESCRIPTOR\n: This unit covers the skills, knowledge and attitudes in\n preparing welding materials.\n\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the range of Variables\n1. Set up cutting\nequipment\n1.1 Cutting equipment should be operational and should\n conform to acceptable OH&S standards\n1.2 Set up cutting equipment is appropriate for operation\n intended\n2. Cut and prepare edge\nof materials\n2.1 Materials are cut based on specified\n dimension/specifications.\n2.2 Task is performed in accordance with company or\nindustry requirements and safety procedure.\n\n3. Clean surfaces and\nedges\n3.1 Surfaces are cleaned to required specifications.\n3.2 Task is performed in accordance with company or\nindustry requirements and safety procedure\n4. Prepare welding\nconsumables\n4.1 Consumables are prepared in accordance with\n required specifications\n4.2 Welding consumables are prepared in accordance with\nmanufacturer’s instructions\n5. Prepare welding\nsafety and protective\nequipment\n5.1 PPE should conform to acceptable OH&S\n requirement and standards\n\n--- PDF PAGE 39 ---\nfcaw nc iii\n 091605\n37\n\nRANGE OF VARIABLE\nVARIABLE\nRANGE\n1. Materials and\nconsumables\n\n1.1 Mild steel\n1.2 Carbon steel\n1.3 Alloy steel (level III & IV)\n1.4 Cutting gases\n1.5 Gouging electrodes\n1.6 Grinding/cutting discs\n1.7 Run on/run off, backing plates/ring\n1.8 Cutting accessories\n2. Cut\nCut material using\n2.1 Oxy-acetylene gas cutting equipment (manual and /or\n automatic)\n2.2 Plasma cutting equipment\n2.3 Shearing machine\n2.4 Disc cutter\n3. Specification\nSpecifications based on\n3.1 Welding codes\n3.2 Reference Industry standards\n3.3 Client specification\n4. Cleaned\nSurfaces and edges are cleaned by\n4.1 Grinding or sanding\n4.2 Filing\n4.3 Chemical washing (Degreaser)\n5. Safety procedures\n5.1 Wearing of required PPE\n5.2 Securing oxy-acetylene tanks before, during and after\nuse\n5.3 Checking oxy-acetylene hose for gas leaks\n5.4 Switch off equipment after use\n5.5 Checking electrical equipment and devices\n\n--- PDF PAGE 40 ---\nfcaw nc iii\n 091605\n38\nEVIDENCE GUIDE\n1. Critical aspects of\n competency\nAssessment requires evidence that the candidate:\n1.1 Perform edge preparation in accordance with\n WPS and safety procedures\n1.2 Use edge preparation equipment and tools in\n accordance with the requirements or\n manufacturer’s instructions\n2. Underpinning knowledge\n2.1 Interpretation of plans and drawings\n2.2 Selection of appropriate method of edge\n preparation\n2.3 Selection of appropriate cutting equipment,\n accessories and supplies\n2.4 Operation of cutting equipment such as\n mechanical, gas and plasma\n2.5 Operation of grinding equipment\n2.6 Safety procedures for cutting and grinding\n3. Underpinning skills\n3.1 Measuring and communication skills\n3.2 Set up of cutting equipment such as mechanical,\n gas and plasma\n3.3 Cutting techniques\n3.4 Grinding techniques\n3.5 Observance of safety procedures\n4. Resource implications\nThe following resources must be provided:\n4.1 Relevant documentation such as WPS and\n working drawing\n4.2 Supplies and materials\n4.3 Cutting equipment and facilities\n4.4 Grinding equipment and facilities\n4.5 Measuring tools\n4.6 PPE\n4.7 Stand-by fire fighting equipment\n5. Method of assessment\nCompetency must be assessed through:\n5.1 Observation/evaluation\n5.2 Oral questioning\n5.3 Inspection of prepared edges\n6. Context of assessment\nCompetency to be assessed while a task is being\nundertaken in the workplace or in a simulated\nworkplace setting.\n\n--- PDF PAGE 41 ---\nfcaw nc iii\n 091605\n39\nUNIT TITLE\n:\nSET UP WELDING EQUIPMENT\n\nUNIT CODE\n:\nMEE721207\n\nDESCRIPTOR\n:\nThis unit covers the skills, knowledge and attitudes in\npreparing equipment for welding.\n\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1.1 Set up welding\nmachine\n\n1.1 Requirements for welding is determined from job\nrequirements, welding procedures and specifications\nand/or technical drawings.\n1.2 Welding machine is set up in accordance with job\nrequirements, welding procedures and specifications,\ntechnical drawings and manufacturer’s instructions.\n1.3 Welding machine should be connected to an\n independent power supply and wired up or set to the\npolarity indicated in the welding procedures\n/specifications or as recommended by the\nmanufacturer.\n1.4 Current, voltage, and wire feed settings is fine-tuned or\nadjusted consistent with job requirements to produce\nacceptable weld.\n1.5 Task is completed without causing damage to the tools,\nequipment and materials and injury to self and others.\n2. Set up welding\naccessories\n2.1 Welding machine accessories and consumables are\nidentified from job requirements, welding procedures\nand specifications.\n2.2 Welding machine accessories and consumables are set\nup in accordance with job requirements, welding\nprocedures and specifications and/or manufacturer’s\ninstructions.\n2.3 Spools firmly locked to holder, rollers adjusted to\n correct tension.\n2.4 Purging hoses, dams, flow meter, regulators, torches\n and guns are properly installed where needed.\n2.5 Gas tanks properly secured where needed.\n\n3. Set up welding\npositioners, jigs and\nfixtures\n3.1 Braces, stiffeners, rails and other jigs are provided and\nin conformity with job requirements.\n3.2 Work items/materials are protected from strong winds,\ndrafts and rainfall\n4. Set up pre-heating\ntools/equipment as\nrequired\n4.1 Pre-heating equipment appropriate to the job\nrequirement and specifications\n4.2 Equipment operated in conformance with the\nmanufacturer’s instructions.\n\n--- PDF PAGE 42 ---\nfcaw nc iii\n 091605\n40\nRANGE OF VARIABLE\nVARIABLE\nRANGE\n1. Welding machine\n\nTypes, kind and uses of FCAW welding machines\n1.1 Alternating current (AC)\n1.2 Direct current (DC)\n1.3 Constant current\n1.4 Constant voltage\n2. Polarity\nApplication and uses\n2.1 Direct current – electrode positive (reverse polarity)\n2.2 Direct current – electrode negative (straight polarity)\n2.3 Alternating current\n3. Accessories\n3.1 welding guns\n3.2 regulators and flow meters\n3.3 gas hoses and adaptors\n3.4 gas cylinders and gas heaters\n3.5 filters, gas nozzle and insulators\n3.6 contact tips\n3.7 wire feeders and wire cutter\n3.8 cable liners and gas diffusers\n4. Gases\n4.1 Pure inert gas (argon, etc.)\n4.2 Mixed gases\n4.3 Pure CO2\n\n--- PDF PAGE 43 ---\nfcaw nc iii\n 091605\n41\nEVIDENCE GUIDE\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate\n1.1 Set up and install welding machine,\n accessories,\nwelding positioners, jigs and fixtures and pre-\n heating equipment within allotted time and in\n accordance with OH&S rules and accessible\n and convenient location.\n1.2 Applied housekeeping and 5S practices\n2. Underpinning knowledge\n2.1 Types and uses of welding equipment and\naccessories\n2.2 Power requirement and capacity of welding\n machine and its accessories\n2.3 Operating capacity of welding machine and\n accessories\n2.4 Basic electricity\n2.5 Shop safety, housekeeping and 5S procedures\n3. Underpinning skills\n3.1 Setting and operating welding machine and\n accessories\n3.2 Communication skills\n3.3 Recognizing operational abnormalities and\n faults in welding machine and accessories\n3.4 Fine tuning of welding machine and accessories\n for optimum operation\n3.5 Minor repairs/maintenance of welding machine\n and accessories\n3.6 Use of PPE\n4. Resource implications\nThe following resources must be provided:\n4.1 Appropriately ventilated work area/shop with\nwelding facilities, machines and accessories\n4.2 PPE\n5. Method of assessment\nCompetency must be assessed through:\n5.1 Observation/evaluation\n5.2 Oral questioning\n6. Context of assessment\nCompetency to be assessed while a task is being\nundertaken in the workplace or in a simulated\nworkplace setting.\n\n--- PDF PAGE 44 ---\nfcaw nc iii\n 091605\n42\nUNIT TITLE\n: FIT UP WELD MATERIALS\n\nUNIT CODE\n: MEE721208\n\nDESCRIPTOR\n: This unit covers the skills, knowledge and attitudes in fitting\n up welding materials.\n\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Perform tack welding\n\n1.1 Tack welding performed in accordance with the\nrequirements of WPS and client’s specifications.\n1.2 Tack weld is performed visually and dimensionally\nacceptable.\n1.3 Backing plate, stiffener, running plate installed as\nrequired.\n1.4 Joints are free from rust, paints, grease and other\n foreign materials prior to fit up or tacking.\n2. Check gap and\n alignment\n2.1 Root gap is performed in accordance with the\nrequirements of WPS.\n2.2 Alignment within the range of acceptability of code and\nstandard.\n2.3 Fitted materials visually free from stresses\n3. Set up welding\n positioner\n3.1 Weld specimen positioned and secured according to the\nrequirements.\n\n--- PDF PAGE 45 ---\nfcaw nc iii\n 091605\n43\nRANGE OF VARIABLE\nVARIABLE\nRANGE\n1. Tack welding\n\nKinds of tacking\n1.1 Bridge tacking\n1.2 Permanent tacking\n1.3 Temporary tacking\n2. Visually and\n dimensionally\n acceptable\n2.1 Acceptable tack welds\n2.2 Fully fused to the base metal\n2.3 Free from defects and discontinuities\n2.4 Evenly distributed\n3. Root gap\n3.1 WPS requirements\n3.2 Client requirements\n4. Backing materials\n4.1 Stiffeners\n4.2 Backing plate\n4.3 Strong back\n5. Alignment\n5.1 Codes and specifications\n5.2 Client requirements\n\n--- PDF PAGE 46 ---\nfcaw nc iii\n 091605\n44\nEVIDENCE GUIDE\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate\n1.1 performed tack welding\n1.2 checked gap and alignment\n1.3 set up welding positioners\n2. Underpinning knowledge\n2.1 Fit up tolerances\n2.2 Mensuration\n2.3 WPS\n2.4 Welding materials and consumables\n2.5 Drawing and plan interpretation\n2.6 Welding codes (symbols)\n2.7 Identification of weld defects\n2.8 Fit up\n3. Underpinning skills\n3.1 Applying weld techniques\n3.2 Handling welding materials and consumables\n3.3 Rectifying weld defects\n3.4 Measuring skills\n3.5 Communication skills\n3.6 Pre-heating technique\n3.7 Observance of safety procedures\n4. Resource implications\nThe following resources must be provided:\n4.1 Drawing and plans\n4.2 Appropriately ventilated work area/shop with\nwelding facilities, machines and accessories\n4.3 PPE\n5. Method of assessment\nCompetency must be assessed through:\n5.1 Observation/evaluation\n5.2 Oral questioning\n6. Context of assessment\nCompetency to be assessed while a task is being\nundertaken in the workplace or in a simulated\nworkplace setting.\n\n--- PDF PAGE 47 ---\nfcaw nc iii\n 091605\n45\nUNIT TITLE\n: REPAIR WELDS\n\nUNIT CODE\n: MEE721209\n\nDESCRIPTOR\n: This unit covers the skills, knowledge and attitudes in\n repairing welds.\n\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Mark/locate weld\ndefects\n1.1 Identified weld defects marked/located according to\n recommended practice\n1.2 Weld defects are located and marked according to\n procedures\n3. Prepare tools and\n equipment\n2.1 Tools and equipment are prepared based on job\nrequirements and provision of wind barriers.\n2.2 Task is performed in accordance with company or\nindustry requirements and safety procedure\n\n3. Remove defects\n3.1 Weld defects are removed/excavated in accordance\nwith approved industry procedures or client\nrequirements.\n3.2 Removal of non-defective welds is minimized and\n cleaned.\n3.3 Visual and dye-penetrant test is performed to verify the\nextent of removal of defects, where applicable\n3.4 Welding inspector is informed to verify the extent of\ndefect removal.\n3.5 Task is performed in accordance with company or\n industry requirement and safety procedure\n\n4. Perform re-welding\n4.1 Re-welding is performed in accordance with approved\n repair procedure.\n4.2 Task is performed in accordance with company or\n industry requirement and safety procedure\n4.3 Re-welding is performed with no new weld defects or\n damages occurred\n4.4 Weld visually checked after re-welding for acceptability\n\n--- PDF PAGE 48 ---\nfcaw nc iii\n 091605\n46\nRANGE OF VARIABLE\nVARIABLE\nRANGE\n1. Weld defects\n1.1 Porosity\n1.2 Root undercut\n1.3 and solid material inclusion\n1.4 Concavity/convexity\n1.5 Degree of reinforcement\n1.6 Burn Through\n1.7 Crater cracks\n1.8 Cracks\n1.9 Lack of Fusion (tie-in)\n1.10 Pinholes/Blowholes\n1.11 Under Fill\n1.12 Excess/incomplete penetration\n1.13 Slag/tungsten inclusion\n1.14 Overlap\n1.15 Misalignment\n1.16 Distortion\n2. Tools and equipment\n2.1 Welding machine and accessories\n2.2 Gouging outfit and accessories\n2.3 Portable grinder\n2.4 Chipping hammer\n2.5 Files\n2.6 Extension cord and lightings\n2.7 Barriers\n2.8 Dye-penetrant kit\n2.9 Portable oven\n3. Removed/excavated\nDefects removed by\n3.1 Grinding\n3.2 Arc/air Gouging\n3.3 Cutting (mechanical, gas)\n3.4 Plasma gouging\n\n--- PDF PAGE 49 ---\nfcaw nc iii\n 091605\n47\nEVIDENCE GUIDE\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate\nrepaired weld defects within the approved weld\nrepair procedures\n2. Underpinning knowledge\n2.1 Interpretation of weld repair procedures and\n WPS\n2.2 Causes and identification of weld defects\n2.3 Materials and consumables\n2.4 Welding Equipment and Tools\n2.5 Welding Codes (symbols)\n2.6 Repair techniques\n2.7 Selection and use of PPE\n3. Underpinning skills\n3.1 Operating weld defect removal tools and\n equipment\n3.2 Applying correct weld techniques\n3.3 Measuring skills\n3.4 Communication skills\n3.5 Rectifying weld defects\n3.6 Handling welding tools and equipment\n3.7 Handling materials and consumables\n3.8 Identifying weld defects\n4. Resource implications\nThe following resources must be provided:\n4.1 Weld defect removal and repair facilities and\n equipment\n4.2 Supplies and materials\n4.3 PPE\n4.4 Relevant documentation such as WPS and\n approved repair procedure\n5. Method of assessment\nCompetency must be assessed through:\n5.1 Observation and interview\n5.2 Performance record\n6. Context of assessment\nCompetency to be assessed while a task is being\nundertaken in the workplace or in a simulated\nworkplace setting.\n\n--- PDF PAGE 50 ---\nfcaw nc iii\n 091605\n48\nCORE COMPETENCIES\n\nUNIT OF COMPETENCY :\nWeld alloy steel plates using FCAW\n\nUNIT CODE\n\n:\nMEE721115\n\nDESCRIPTOR\n\n:\nThis unit covers the skills, knowledge and attitudes\n required in welding alloy steel plates in 1F-4F and\n 1G-3G positions using FCAW process.\n\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Perform root pass\n(backing material)\n1.1 Root pass performed in accordance with WPS and/or\n client specifications.\n1.2 Weld visually checked for defects and repaired, as\n required\n1.3 Weld visually acceptable in accordance with applicable\ncodes and standards\n2. Clean root pass\n2.1 Root pass cleaned is free from defects and\n discontinuities\n2.2 Task performed in accordance with approved WPS\n3. Weld subsequent/\nfilling passes\n\n3.1 Subsequent/ filling passes performed in accordance with\n approved WPS\n3.2 Weld visually checked for defects and repaired, as\n required\n3.3 Weld visually acceptable in accordance with applicable\ncodes and standards\n4. Perform capping\n4.1 Capping performed in accordance with WPS and/or\n client specifications\n4.2 Weld visually checked for defects and repaired, as\n required\n4.3 Weld visually acceptable in accordance with applicable\ncodes and standards\n\n--- PDF PAGE 51 ---\nfcaw nc iii\n 091605\n49\n\nRANGE OF VARIABLE\nVARIABLE\nRANGE\n1. WPS\nWPS Requirements\n1.1 Welding positions\n1.1.1 1F-4F\n1.1.2 1G-3G\n1.2 Material thickness\n 1.2.1 1.6mm and above\n1.3 Type of material\n 1.3.1 Alloy-steel plates\n1.4 Consumables\n4.4.1\nFlux cored electrode (self-shielded and gas\n shielded)\n4.4.2\nShielding gas (argon and other available\n inert gas)\n1.5 Travel speed\n1.6 Current setting (polarity, amperage, voltage)\n1.7 Shielding gas flow rate\n 1.8 Joint preparation\n\n2. Defects\n2.1 Porosity\n2.2 Undercut\n2.3 Arc Strike\n2.4 Elongated inclusion\n2.5 Filler and solid material inclusion\n2.6 Concavity/convexity\n2.7 Degree of reinforcement\n2.8 Burn Through\n2.9 Crater cracks\n2.10 Cracks\n2.11 Lack of Fusion\n2.12 Pinholes/Blowholes\n2.13 Under Fill\n2.14 Overlap\n2.15 Misalignment\n2.16 Distortion\n\n--- PDF PAGE 52 ---\nfcaw nc iii\n 091605\n50\nEVIDENCE GUIDE\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate\nwelded alloy steel plates using FCAW in and 2G\nand 3G positions to acceptable standards following\nthe approved WPS.\n2. Underpinning knowledge\n2.1 Drawing/Plan/WPS interpretation\n2.2 Materials and consumables\n2.2.1 Flux cored electrode\n2.2.2 Shielding gases\n2.3 Welding Equipment and Tools\n2.4 Basic Mathematics (MDAS)\n2.5 Welding Codes and symbols\n2.6 Identification of weld defects\n3. Underpinning skills\n3.1 Measuring skills\n3.2 Communication skills\n3.3 Rectifying weld defects\n3.4 Applying welding techniques for FCAW\n3.5 Handling welding tools and equipment\n3.6 Handling materials and consumables and\n checking purity of inert gas\n3.7 Philippine OH&S Rules and/or client’s safety\n procedure\n4. Resource implications\nThe following resources must be provided:\n4.1 FCAW facilities and equipment\n4.2 Supplies and materials\n4.3 PPE\n4.4 Fumes extractor if applicable\n4.5 Relevant documentation such as WPS and\n working drawing\n4.6 Stand-by firefighting equipment\n5. Method of assessment\nCompetency must be assessed through:\n5.1 Demonstration/ observation and oral\n questioning\n5.2 Portfolio (awards, records, certificates,\n endorsements, etc.)\n6. Context of assessment\nCompetency to be assessed while a task is being\nundertaken in the workplace or in a simulated\nworkplace setting.\n\n--- PDF PAGE 53 ---\nfcaw nc iii\n 091605\n51\nUNIT OF COMPETENCY :\nWeld alloy-steel pipes using FCAW\n\nUNIT CODE\n\n:\nMEE7721119\n\nDESCRIPTOR\n\n:\nThis unit covers the skills, knowledge and attitudes in\n welding alloy-steel pipes using FCAW process.\n\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Perform root pass\n(backing material)\n1.1 Root pass performed in accordance with WPS and/or\n client specifications.\n1.2 Weld visually checked for defects and repaired, as\n required\n1.3 Weld visually acceptable in accordance with applicable\ncodes and standards\n\n2. Clean root pass\n2.1 Root pass cleaned is free from defects and\n discontinuities\n2.2 Task performed in accordance with approved WPS\n3. Weld subsequent/\nfilling passes\n\n3.1 Subsequent/ filling passes performed in accordance with\n approved WPS\n3.2 Weld visually checked for defects and repaired, as\n required\n3.3 Weld visually acceptable in accordance with applicable\ncodes and standards\n4. Perform capping\n4.1 Capping performed in accordance with WPS and/or\n client specifications\n4.2 Weld visually checked for defects and repaired, as\n required\n4.3 Weld visually acceptable in accordance with applicable\ncodes and standards\n\n--- PDF PAGE 54 ---\nfcaw nc iii\n 091605\n52\nRANGE OF VARIABLE\nVARIABLE\nRANGE\n1. WPS\nWPS Requirements\n1.1 Welding positions\n1.1.1 2G and 5G and/or 6G\n1.2 Wall thickness\n1.2.1 1.6mm and above\n1.3 Type of material\n1.3.1 Alloy-steel pipes\n1.3.2 Diameter 25.4mm (1 inch) and above\n1.4 Type and size of flux cored electrode (self-shielded\n and gas shielded)\n1.5 Travel speed\n1.6 Current setting (polarity, amperage, voltage)\n1.7 Backing materials (weld metal, backing ring or\n ceramics)\n1.8 Welding accessories\n1.8.1\nTransformer Rectifier Type\n1.8.2\nWire feeder\n1.9 Joint preparation\n2. Defects\n2.1 Porosity\n2.2 Undercut\n2.3 Arc Strike\n2.4 Spatters\n2.5 Wire, slag and solid material inclusion\n2.6 Concavity/convexity\n2.7 Degree of reinforcement\n2.8 Burn Through\n2.9 Crater cracks\n2.10 Cracks\n2.11 Lack of Fusion (tie-in)\n2.12 Pinholes/Blowholes\n2.13 Under Fill\n2.14 Overlap\n2.15 Misalignment\n2.16 Distortion\n\n--- PDF PAGE 55 ---\nfcaw nc iii\n 091605\n53\nEVIDENCE GUIDE\n1 Critical aspects of\ncompetency\nAssessment requires evidence that the candidate\nwelded alloy-steel pipes using FCAW process in 2G\nand 5G and/or 6G positions to acceptable standards\nfollowing the approved WPS.\n\n2 Underpinning knowledge\n2.1 Drawing/Plan/WPS interpretation\n2.2 Materials and consumables\n2.2.1 Flux cored electrode\n2.2.2 Shielding gases\n2.3 Welding Equipment, Tools\n2.3.1 FCAW equipment\n2.3.2 FCAW welding accessories\n2.4 Basic Mathematics (MDAS)\n2.5 Welding Codes and symbols\n2.6 Identification of weld defects and FCAW\n equipment malfunctions\n3 Underpinning skills\n3.1 Measuring skills\n3.2 Communication skills\n3.3 Rectifying weld defects\n3.4 Applying welding techniques for FCAW\n3.5 Handling welding tools and equipment\n3.6 Handling materials and consumables and\n checking purity of shielding gas\n3.7 Ability to perform root pass with GTAW or\n SMAW process\n4 Resource implications\nThe following resources must be provided:\n4.1 Well ventilated work area/shop with FCAW\nfacilities and equipment\n4.2 Supplies and materials\n4.3 Fumes extractor, if applicable\n4.4 PPE\n4.5 Relevant documentation such as WPS and\n working drawing\n4.6 Stand-by fire fighting equipment\n5 Method of assessment\nCompetency must be assessed through:\n5.1 Observation and interview\n5.2 Demonstration and interview\n5.3 Written test\n5.4 Portfolio (work records, certificates, awards,\nendorsements, etc…)\n6 Context of assessment\nCompetency to be assessed while a task is being\nundertaken in the workplace or in a simulated\nworkplace setting.\n\n--- PDF PAGE 56 ---\nfcaw nc iii\n 091605\n54"
