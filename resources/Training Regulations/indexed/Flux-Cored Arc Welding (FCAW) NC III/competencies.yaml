        "source_text": "MEE721205\n\nUNIT DESCRIPTOR\n\n: This unit covers the competencies required to use hand\n tools.\n\n ELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1.\nSelect hand tools\n1.1\n\n1.2\n\nHand tools selected are appropriate to the\nrequirements of the task.\nUnsafe or defective tools are identified and\nmarked for repair according to procedure.\n2.\nUse hand tools\n2.1\n\n2.2\n\nHand tools are used to produce the desired\noutcomes to job specifications.\nTask performed in accordance with company or\nindustry safety procedure.\n3.\nMaintain hand tools\n3.1\n\n3.2\n\nRoutine maintenance of hand tools is\nundertaken according to standard operating\nprocedures, principles and techniques.\nHand tools are stored in designated location in\naccordance with manufacturer’s\ninstruction/standard operating procedure.\n\n--- PDF PAGE 36 ---\nfcaw nc iii\n 091605\n34\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Hand tools\nHand tools includes but not limited to:\n1.1 Hacksaws\n1.2 Hammers (ball peen, chipping)\n1.3 Punches\n1.4 Screwdrivers\n1.5 Wrenches\n1.6 Scrapers\n1.7 Chisels\n1.8 Gouges\n1.9 Files\n1.10 Clamps\n2. Task\nTasks may include:\n2.1 Adjusting\n2.2 Dismantling\n2.3 Assembling\n2.4 Finishing of item or components\n3. Routine maintenance\nRoutine maintenance may include:\n3.1 Cleaning\n3.2 Lubricating\n3.3 Tightening\n3.4 Simple tool repair\n3.5 Hand sharpening\n\n--- PDF PAGE 37 ---\nfcaw nc iii\n 091605\n35\nEVIDENCE GUIDE\n1.\nCritical aspects\nof competency\nAssessment requires evidence that the candidate:\n1.1 Selected and used hand tools appropriate to the job\n1.2 Performed routine maintenance and storage of hand tools\n2.\nUnderpinning\nknowledge and\nattitude\n2.1 Types and uses of hand tools\n2.2 Hand tool defects\n2.3 Procedure, principles and techniques in maintenance of\n hand tools\n\n3.\nUnderpinning\nskills\n3.1 Handling tools and materials\n3.2 Communicating with superiors and co-workers\n3.3 Interpreting instructions\n4.\nResource\nimplications\nThe following resources must be provided\n4.1 Tools, equipment and facilities appropriate to the process\n or activity\n4.2 Materials relevant to the proposed activity\n5.\nMethod of\nassessment\nCompetency must be assessed through:\n5.1 Demonstration\n5.2 Written or oral short answer questions\n5.3 Practical exercises\n6.\nContext for\nassessment\nCompetency may be assessed in the workplace or in simulated\nworkplace environment.\n\n--- PDF PAGE 38 ---\nfcaw nc iii\n 091605\n36\nUNIT TITLE\n: PREPARE WELD MATERIALS\n\nUNIT CODE\n:"
