        "evidence_guide": {
          "source_text": "1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Identified, applied and reviewed the use of\nmathematical concepts and techniques to workplace\nproblems\n2. Underpinning\nknowledge\n2.1 Fundamental operation (addition, subtraction, division,\nmultiplication)\n2.2 Measurement system\n2.3 Precision and accuracy\n2.4 Basic measuring tools/devices\n3. Underpinning skills\n3.1 Applying mathematical computations\n3.2 Using calculator\n3.3 Using different measuring tools\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Calculator\n4.2 Basic measuring tools\n4.3 Case Problems\n5. Methods of\nassessment\nCompetency may be assessed through:\n5.1 Authenticated portfolio\n5.2 Written Test\n5.3 Interview/Oral Questioning\n5.4 Demonstration\n6. Context for\nassessment\n6.1 Assessment may be conducted in the workplace or in a\nsimulated work environment.\n\n--- PDF PAGE 20 ---\nfcaw nc iii\n 091605\n18\nUNIT OF COMPETENCY :\n USE RELEVANT TECHNOLOGIES\n\nUNIT CODE :"
        },
        "source_text": "091605\n14\n4. Resource\nimplications\n4.1.\nAssessment will require access to an operating plant\nover an extended period of time, or a suitable\nmethod of gathering evidence of operating ability\nover a range of situations. A bank of scenarios / case\nstudies / what ifs will be required as well as bank of\nquestions which will be used to probe the reason\nbehind the observable action.\n5. Methods of\nassessment\nCompetency may be assessed through:\n5.1.\nCase studies on solving problems in the workplace\n5.2.\n Observation\nThe unit will be assessed in a holistic manner and is\npractical and may be integrated with the assessment of\nother relevant units of competency. Assessment will occur\nover a range of situations, which will include disruptions to\nnormal, smooth operation. Simulation may be required to\nallow for timely assessment of parts of this unit of\ncompetency. Simulation should be based on the actual\nworkplace and will include walk through of the relevant\ncompetency components.\n6. Context for\nassessment\n6.1.\nAssessment may be conducted in the workplace or\nin a simulated work environment. In the workplace, it\nmay be appropriate to assess this unit concurrently\nwith relevant teamwork or operation units.\n\n--- PDF PAGE 17 ---\nfcaw nc iii\n 091605\n15\n\nUNIT OF COMPETENCY :\nUSE MATHEMATICAL CONCEPTS AND\n\nTECHNIQUES\n\nUNIT CODE :\n3500311113\n\nUNIT DESCRIPTOR :\nThis unit covers the knowledge, skills and attitudes\n\n required in the application of mathematical\n\n concepts and techniques.\n\nELEMENT\nPerformance Criteria\nItalicized terms are elaborated in the Range of Variables\n1. Identify\nmathematical tools\nand techniques to\nsolve problem\n1.1 Problem areas are identified based on given condition\n1.2 Mathematical techniques are selected based on the\ngiven problem\n2. Apply mathematical\nprocedure/solution\n2.1 Mathematical techniques are applied based on the\nproblem identified\n2.2 Mathematical computations are performed to the level\nof accuracy required for the problem\n2.3 Results of mathematical computation is determined and\nverified based on job requirements\n3. Analyze results\n3.1 Result of application is reviewed based on expected\nand required specifications and outcome\n3.2 Appropriate action is applied in case of error\n\n--- PDF PAGE 18 ---\nfcaw nc iii\n 091605\n16\n\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Mathematical\ntechniques\nMay include but are not limited to:\n1.1 Four fundamental operations\n1.2 Measurements\n1.3 Use/Conversion of units of measurements\n1.4 Use of standard formulas\n2. Appropriate action\n2.1 Review in the use of mathematical techniques (e.g.\n recalculation, re-modeling)\n2.2 Report error to immediate superior for proper action\n\n--- PDF PAGE 19 ---\nfcaw nc iii\n 091605\n17\nEVIDENCE GUIDE\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Identified, applied and reviewed the use of\nmathematical concepts and techniques to workplace\nproblems\n2. Underpinning\nknowledge\n2.1 Fundamental operation (addition, subtraction, division,\nmultiplication)\n2.2 Measurement system\n2.3 Precision and accuracy\n2.4 Basic measuring tools/devices\n3. Underpinning skills\n3.1 Applying mathematical computations\n3.2 Using calculator\n3.3 Using different measuring tools\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Calculator\n4.2 Basic measuring tools\n4.3 Case Problems\n5. Methods of\nassessment\nCompetency may be assessed through:\n5.1 Authenticated portfolio\n5.2 Written Test\n5.3 Interview/Oral Questioning\n5.4 Demonstration\n6. Context for\nassessment\n6.1 Assessment may be conducted in the workplace or in a\nsimulated work environment.\n\n--- PDF PAGE 20 ---\nfcaw nc iii\n 091605\n18\nUNIT OF COMPETENCY :\n USE RELEVANT TECHNOLOGIES\n\nUNIT CODE :"
