        "evidence_guide": {
          "source_text": "1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Studied and selected appropriate technology\nconsistent with work requirements\n1.2 Applied relevant technology\n1.3 Maintained and enhanced operative ability of relevant\ntechnology\n2. Underpinning\nknowledge and\nattitudes\n2.1 Awareness on technology and its function\n2.2 Repair and maintenance procedure\n2.3 Operating instructions\n2.4 Applicable software\n2.5 Communication techniques\n2.6 Health and safety procedure\n2.7 Company policy in relation to relevant technology\n2.8 Different management concepts\n2.9 Technology adaptability\n3. Underpinning skills\n3.1 Relevant technology application/implementation\n3.2 Basic communication skills\n3.3 Software applications skills\n3.4 Basic troubleshooting skills\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Relevant technology\n4.2 Interview and demonstration questionnaires\n4.3 Assessment packages\n5. Methods of\nassessment\nCompetency must be assessed through:\n5.1 Interview\n5.2 Actual demonstration\n5.3 Authenticated portfolio (related certificates of\ntraining/seminar)\n6. Context of\nassessment\n6.1 Competency may be assessed in actual workplace or\nsimulated environment\n\n--- PDF PAGE 23 ---\nfcaw nc iii\n 091605\n21\nCOMMON COMPETENCIES\n\nUNIT OF COMPETENCY : APPLY SAFETY PRACTICES\n\nUNIT CODE\n\n:"
        },
        "source_text": "500311114\n\nUNIT DESCRIPTOR :\n This unit of competency covers the knowledge,\n\n skills, and attitude required in selecting, sourcing\n\n and applying appropriate and affordable\n\n technologies in the workplace.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n\n1. Study/select\nappropriate\ntechnology\n\n1.1 Usage of different technologies is determined based on\njob requirements\n1.2 Appropriate technology is selected as per work\n specification\n\n2. Apply relevant\ntechnology\n\n2.1 Relevant technology is effectively used in carrying\n out function\n2.2 Applicable softwares and hardwares are used as per\n task requirement\n2.3 Management concepts are observed and practiced as\n per established industry practices\n\n3. Maintain/enhance of\nrelevant technology\n\n3.1 Maintenance of technology is applied in accordance with\nthe industry standard operating procedure,\nmanufacturer’s operating guidelines and\noccupational health and safety procedure to ensure\nits operative ability\n3.2 Updating of technology is maintained through continuing\neducation or training in accordance with job requirement\n3.3 Technology failure/ defect is immediately reported to the\n concern/responsible person or section for appropriate\n action\n\n--- PDF PAGE 21 ---\nfcaw nc iii\n 091605\n19\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Technology\nMay include but are not limited to:\n1.1 Office technology\n1.2 Industrial technology\n1.3 System technology\n1.4 Information technology\n1.5 Training technology\n2. Management\nconcepts\nMay include but not limited to:\n2.1 Real Time Management\n2.2 KAIZEN or continuous improvement\n2.3 5s\n3.4 Total Quality Management\n3.5 Other management/productivity tools\n3. Industry standard\noperating procedure\n3.1 Written guidelines relative to the usage of office\ntechnology/equipment\n3.2 Verbal advise/instruction from the co-worker\n4. Manufacturer’s\noperating guidelines/\ninstructions\n4.1 Written instruction/manuals of specific technology/\n equipment\n4.2 General instruction manual\n4.3 Verbal advise from manufacturer relative to the\noperation of equipment\n5. Occupational health\nand safety\nprocedure\n5.1 Relevant statutes on OHS\n5.2 Company guidelines in using\n technology/equipment\n6. Appropriate action\n6.1 Implementing preventive maintenance schedule\n6.2 Coordinating with manufacturer’s technician\n\n--- PDF PAGE 22 ---\nfcaw nc iii\n 091605\n20\nEVIDENCE GUIDE\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Studied and selected appropriate technology\nconsistent with work requirements\n1.2 Applied relevant technology\n1.3 Maintained and enhanced operative ability of relevant\ntechnology\n2. Underpinning\nknowledge and\nattitudes\n2.1 Awareness on technology and its function\n2.2 Repair and maintenance procedure\n2.3 Operating instructions\n2.4 Applicable software\n2.5 Communication techniques\n2.6 Health and safety procedure\n2.7 Company policy in relation to relevant technology\n2.8 Different management concepts\n2.9 Technology adaptability\n3. Underpinning skills\n3.1 Relevant technology application/implementation\n3.2 Basic communication skills\n3.3 Software applications skills\n3.4 Basic troubleshooting skills\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Relevant technology\n4.2 Interview and demonstration questionnaires\n4.3 Assessment packages\n5. Methods of\nassessment\nCompetency must be assessed through:\n5.1 Interview\n5.2 Actual demonstration\n5.3 Authenticated portfolio (related certificates of\ntraining/seminar)\n6. Context of\nassessment\n6.1 Competency may be assessed in actual workplace or\nsimulated environment\n\n--- PDF PAGE 23 ---\nfcaw nc iii\n 091605\n21\nCOMMON COMPETENCIES\n\nUNIT OF COMPETENCY : APPLY SAFETY PRACTICES\n\nUNIT CODE\n\n:"
