        "source_text": "MEE7721119\n\nDESCRIPTOR\n\n:\nThis unit covers the skills, knowledge and attitudes in\n welding alloy-steel pipes using FCAW process.\n\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Perform root pass\n(backing material)\n1.1 Root pass performed in accordance with WPS and/or\n client specifications.\n1.2 Weld visually checked for defects and repaired, as\n required\n1.3 Weld visually acceptable in accordance with applicable\ncodes and standards\n\n2. Clean root pass\n2.1 Root pass cleaned is free from defects and\n discontinuities\n2.2 Task performed in accordance with approved WPS\n3. Weld subsequent/\nfilling passes\n\n3.1 Subsequent/ filling passes performed in accordance with\n approved WPS\n3.2 Weld visually checked for defects and repaired, as\n required\n3.3 Weld visually acceptable in accordance with applicable\ncodes and standards\n4. Perform capping\n4.1 Capping performed in accordance with WPS and/or\n client specifications\n4.2 Weld visually checked for defects and repaired, as\n required\n4.3 Weld visually acceptable in accordance with applicable\ncodes and standards\n\n--- PDF PAGE 54 ---\nfcaw nc iii\n 091605\n52\nRANGE OF VARIABLE\nVARIABLE\nRANGE\n1. WPS\nWPS Requirements\n1.1 Welding positions\n1.1.1 2G and 5G and/or 6G\n1.2 Wall thickness\n1.2.1 1.6mm and above\n1.3 Type of material\n1.3.1 Alloy-steel pipes\n1.3.2 Diameter 25.4mm (1 inch) and above\n1.4 Type and size of flux cored electrode (self-shielded\n and gas shielded)\n1.5 Travel speed\n1.6 Current setting (polarity, amperage, voltage)\n1.7 Backing materials (weld metal, backing ring or\n ceramics)\n1.8 Welding accessories\n1.8.1\nTransformer Rectifier Type\n1.8.2\nWire feeder\n1.9 Joint preparation\n2. Defects\n2.1 Porosity\n2.2 Undercut\n2.3 Arc Strike\n2.4 Spatters\n2.5 Wire, slag and solid material inclusion\n2.6 Concavity/convexity\n2.7 Degree of reinforcement\n2.8 Burn Through\n2.9 Crater cracks\n2.10 Cracks\n2.11 Lack of Fusion (tie-in)\n2.12 Pinholes/Blowholes\n2.13 Under Fill\n2.14 Overlap\n2.15 Misalignment\n2.16 Distortion\n\n--- PDF PAGE 55 ---\nfcaw nc iii\n 091605\n53\nEVIDENCE GUIDE\n1 Critical aspects of\ncompetency\nAssessment requires evidence that the candidate\nwelded alloy-steel pipes using FCAW process in 2G\nand 5G and/or 6G positions to acceptable standards\nfollowing the approved WPS.\n\n2 Underpinning knowledge\n2.1 Drawing/Plan/WPS interpretation\n2.2 Materials and consumables\n2.2.1 Flux cored electrode\n2.2.2 Shielding gases\n2.3 Welding Equipment, Tools\n2.3.1 FCAW equipment\n2.3.2 FCAW welding accessories\n2.4 Basic Mathematics (MDAS)\n2.5 Welding Codes and symbols\n2.6 Identification of weld defects and FCAW\n equipment malfunctions\n3 Underpinning skills\n3.1 Measuring skills\n3.2 Communication skills\n3.3 Rectifying weld defects\n3.4 Applying welding techniques for FCAW\n3.5 Handling welding tools and equipment\n3.6 Handling materials and consumables and\n checking purity of shielding gas\n3.7 Ability to perform root pass with GTAW or\n SMAW process\n4 Resource implications\nThe following resources must be provided:\n4.1 Well ventilated work area/shop with FCAW\nfacilities and equipment\n4.2 Supplies and materials\n4.3 Fumes extractor, if applicable\n4.4 PPE\n4.5 Relevant documentation such as WPS and\n working drawing\n4.6 Stand-by fire fighting equipment\n5 Method of assessment\nCompetency must be assessed through:\n5.1 Observation and interview\n5.2 Demonstration and interview\n5.3 Written test\n5.4 Portfolio (work records, certificates, awards,\nendorsements, etc…)\n6 Context of assessment\nCompetency to be assessed while a task is being\nundertaken in the workplace or in a simulated\nworkplace setting.\n\n--- PDF PAGE 56 ---\nfcaw nc iii\n 091605\n54"
      }
