      "definition": "human dynamic affords a critical look at current authoritarian and centralized social structures. Peer-to-peer is also a political and social program for those who believe that in many cases, peer-to-peer modes are a preferable option. 29. THERAPEUTIC COMMUNICATION – an interaction between a health care professional and a patient that aims to enhance the patient’s comfort, safety, trust, or health and well-being. 30. THERAPEUTIC DIET - a therapeutic diet is a meal plan that controls the intake of certain foods or nutrients. It is part of the treatment of a medical condition and are normally prescribed by a physician and planned by a dietician. 31. TOILETING - is the act of assisting a dependent patient with his/her elimination needs. 32. VITAL SIGNS – determination of temperature, pulse rate, rate of breathing and level of blood pressure. 33. WOUND CARE - refers to specific types of treatment for pressure sores, skin ulcers and other wounds that break the skin."
