      "term": "Caring helps individuals meet these needs to be healthy, active and independent",
      "definition": "Caring helps individuals with everyday living and supports an individual’s life quality factors. Carers have an enormous influence over the outcome of the care that they give. Their actions can have positive or negative effects. 5. CLIENT - a person who engages the professional advice or services of another. 6. CLINICAL WASTE - Clinical waste is the term used to describe waste produced from healthcare and similar activities that may pose a risk of infection, for example, swabs, bandages, dressings etc. or may prove hazardous, for example medicines. 7. COGNITIVE DEVELOPMENT - is a field of study in neuroscience and psychology focusing on a child's development in terms of information processing, conceptual resources, perceptual skill, language learning, and other aspects of the developed adult brain and cognitive psychology. 8. COLD THERAPY - As a general rule, cold therapy is used for sudden, acute injuries such as ankle sprains, muscle years, bruising and inflammation. 9. DISPENSING - is the provision of drugs or medicines as set out properly on a lawful prescription. 10. EMERGENCY - is a situation that poses an immediate risk to health, life, property, or environment.[1] Most emergencies require urgent intervention to prevent a worsening of the situation, although in some situations, mitigation may not be possible and agencies may only be able to offer palliative care for the aftermath. 11. FIRST AID - emergency care or treatment given to an ill or injured person before regular medical aid can be obtained 12. GRADE SCHOOLER - a child in elementary school. (6yrs-12 yrs. old) 13. GROWTH AND DEVELOPMENT – growth as the physical change that a certain individual undergoes. While development is more on the psychological change that occurs in an individual throughout their lifespan. 14. HOT THERAPY - heat therapy is primarily used for taking the edge off of several different kinds of body pain. Those dull, persistent pains that you get with stiffness and cramping, for example. 15. INFECTION CONTROL - is the discipline concerned with preventing healthcare- associated infections; a practical rather than academic sub-discipline of epidemiology. Infection control addresses factors related to the spread of infections within the healthcare setting, whether among patients, from patients to staff, from staff to patients, or among staff. This includes preventive measures such as hand washing, cleaning, disinfecting, sterilizing, and vaccinating. Other aspects include surveillance, monitoring, and investigating any suspected outbreak of infection, and its management. 16. MEDICATION - a substance used for medical treatment, especially a medicine or drug. 17. MENU - a list of the dishes that may be ordered (as in a restaurant) or that are to be served (as at a banquet) 18. MOBILITY - the ability to move or be moved freely and easily. 19. NUTRITIONAL REQUIREMENTS – a set of requirements for the dietary nutrient intakes of healthy people, used for planning and assessing diets. It includes the Recommended Dietary Allowance (RDA), the Adequate Intake (AI), the Tolerable Upper Limit (TUL), and the Estimated Average Intake (EAI) 20. ORAL CARE – is the practice of keeping the mouth clean and healthy by brushing and flossing to prevent tooth decay and gum disease. 21. PERSONAL HYGIENE - refers to maintaining cleanliness of one's body and clothing to preserve overall health and well-being. It includes a number of different activities related to the following general areas of self-care: washing or bathing, including cleansing oneself after using the toilet; taking proper care of the mouth; grooming and dressing; and keeping clothing clean. Bathing, dressing and undressing, and using the toilet are considered activities of daily living (ADLs), while doing one's laundry is considered an instrumental activity of daily living or IADL 22. PERSONAL PROTECTIVE EQUIPMENT (PPE) - is protective clothing, helmets, goggles, or other garments or equipment designed to protect the wearer's body from injury or infection. 23. PHYSICAL GROWTH - refers to changes in size or mass; so it is correct to say that a child grows in stature (height) or body weight. Even though most people usually think of growth at the level of the whole child, the cells and internal structures that make up the child also grow, primarily by increasing in number or size. Consequently, auxologists (those who study child growth) may be interested in the growth of bones to help understand fractures and osteoporosis; the growth of the heart walls to help understand hypertension (high blood pressure) and heart disease; or the growth of adipose tissue (body fat) to help understand obesity. 24. PHYSIOLOGICAL NEEDS - is a concept that was derived to explain and cultivate the foundation for motivation. This concept is the main physical requirement for human survival. This means that Physiological needs are universal human needs. Physiological needs are considered in internal motivation according to Maslow's hierarchy of needs. This theory states that humans are compelled to fulfill these physiological needs first in order to pursue intrinsic satisfaction on a higher level.[3] If these needs are not achieved, it leads to an increase in displeasure within an individual. In return, when individuals feel this increase in displeasure, the motivation to decrease these discrepancies increases.[3] Physiological needs can be defined as both traits and a state.[3] Physiological needs as traits allude to long-term, unchanging demands that are required of basic human life. Physiological needs as a state allude to the unpleasant decrease in pleasure and the increase for an incentive to fulfill a necessity.[3] In order to pursue intrinsic motivation higher up Maslow's hierarchy, Physiological needs must be met first. This means that if a human is struggling to meet their physiological needs, then they are unlikely to intrinsically pursue safety, belongingness, esteem, and self-actualization. 25. PRESCRIPTION - an instruction written by a medical practitioner that authorizes a patient to be provided a medicine or treatment. 26. SENSUAL BEHAVIOR – a behavior relating to or consisting in the gratification of the senses or the indulgence of appetite 27. SKIN CARE - maintaining clean, comfortable and healthy skin through thorough cleansing with soap and water, and moisturizing with emollients. Basic skin care also includes treating skin conditions appropriately with medicines and lotions, and avoiding sun exposure. Age is a factor in skin care. Special consideration should be given to infants, senior adults and the infirm. 28. SOCIAL PEERS - are interactions with a peer-to-peer dynamic. These peers can be humans or computers. Peer-to-peer (P2P) is a term that originated from the popular concept of the P2P distributed computer application architecture which partitions tasks or workloads between peers.[1][better source needed] This application structure was popularized by file sharing systems like Napster, the first of its kind in the late 1990s. The concept has inspired new structures and philosophies in many areas of human interaction."
