          "source_text": "REQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Communicate \nappropriately \nwith patients / \nclients  \n1.1 Effective \ncommunication \nstrategies and \ntechniques are \nidentified and used to \nachieve best client \nservice outcomes \n1.2 Complaints are \nresponded to in \naccordance with \norganizational policy \nto ensure best service \nto clients \n1.3 Complaints are dealt \nwith in accordance \nwith established \nprocedures \n1.4 Interpreter services \nare accessed as \nrequired \n1.5 Action is taken to \nresolve conflicts either \ndirectly, where a \npositive outcome can \nbe immediately \nachieved, or by \nreferral to the \nappropriate personnel \n1.6 Participation in work \nteam is constructive \nand collaborative and \ndemonstrates an \nunderstanding of own \nrole \n1.1 Reporting, \ndocumentation and \nuse of non-verbal and \nverbal communication \n1.2 Management of \nconflict \n1.3 Knowledge on \ncultural differences of \nclient including rules \nand policies as \nnecessary  \n1.4 Roles and \nresponsibilities of self \nand other workers \nwithin the \norganization \n1.5 Knowledge on client \nissues that need to \nbe referred to an \nappropriate health \nprofessional \n1.6 Organizational / \ninstitutional policies \nand procedures for \nprivacy and \nconfidentiality of \ninformation provided \nby clients and others \n1.7 Institutional policy on \npatient / client rights \nand responsibilities \n1.8 Knowledge on the \nuse mathematical \noperations such as \naddition, subtraction, \ndivision, multiplication \n1.9 Concepts on modes \nof communication \n1.10 Knowledge on the \nuse of equipment \n1.11 Knowledge on \noperating of \nequipment needed \n1.1 Calculating the \ncost for additional \npersonnel \nequipment (ex. \nInterpreter, \ngadgets) \n1.2 Identifying the \nmode on \ncommunication \nappropriate for \nthe situation \n1.3 Applying modes \nof communication  \n1.4 Operating \nequipment of \ncommunication \nneeded \n1.5 Establishing and \nmaintaining \nrelationships, \ntaking into \naccount individual \ndifferences \n1.6 Following the \ninstructions and \nguidance of \nhealth \nprofessionals \ninvolved with the \ncare of client \n1.7 Respecting client \nrights \n1.8 Using effective \nlistening \ntechniques \n1.9 Using appropriate \nverbal and non-\nverbal \ncommunication \nstyles \n1.10 Using oral and \nwritten \ncommunication\n\n--- PDF PAGE 59 ---\nTR - Caregiving (Grade schooler to Adolescent) NC II Revision 00         Promulgated (06/09/2020)                   55 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the  \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \nfor communication \n(computer, cell \nphone, and other \nforms of media) \n \n1.11 Applying \nproblem solving \nskills that \nincludes using \navailable \nresources while \nprioritizing \nworkload \n1.12 Dealing with \nconflict \n1.13 Working with \nothers and \ndisplaying \nempathy with \nclient and \nrelatives \n1.14 Demonstrating \nintra and \ninterpersonal \nskills \n1.15 Reporting and \ndocumentation \nwith accuracy \n2. Establish and \nmaintain good \ninterpersonal \nrelationship \nwith clients  \n2.1 Rapport is established \nto ensure the service \nis appropriate to and \nin the best interests of \nclients \n2.2 Effective listening \nskills are used to \nensure a high level of \neffective \ncommunication and \nquality of service  \n2.3 Client concerns and \nneeds are correctly \nidentified and \nresponded to \nresponsibly and \naccordingly \nestablished \nprocedures and \nguidelines \n2.4 Effectiveness of \ninterpersonal \ninteraction is \nconsistently \nmonitored and \nevaluated to ensure \nbest client service \noutcomes \n2.1 Reporting, \ndocumentation and \nuse of non-verbal \nand verbal \ncommunication \n2.2 Management of \nconflict \n2.3 Knowledge on \ncultural differences \nof client including \nrules and policies as \nnecessary  \n2.4 Organizational / \ninstitutional poli