er \nidentity / orientation \nare recognized based \non the developmental \nneeds \n2.2 Feeling of \nindependencies are \n2.1 Oral and written \ncommunication \n2.2 Principles of \ntherapeutic \ncommunication \n2.3 Principle of \ninterpersonal skills \n2.1 Applying \ntherapeutic \ncommunication, \nmotivational skills \nand interpersonal \nskills\n\n--- PDF PAGE 91 ---\nTR - Caregiving (Grade schooler to Adolescent) NC II Revision 00         Promulgated (06/09/2020)                   87 \nrecognized based on \nestablished research \n2.3 Sexual behavior is \nexpressed according to \npsychosocial \ndevelopmental needs \n2.4 Appropriate \nworkplace \nenvironment \n2.5 Conduciveness of \narea \n2.6 Sexual or gender \nidentity / orientation \n2.7 Principle of \nautonomy \n2.8 Identity \ndevelopment in \nadolescent \n2.9 Sexual role and \nresponsibility \n2.10 Sexual behavior \n2.11 Sex, gender \nidentity crisis  \n2.2 Promoting self- \ncare and self- \ncontrol \n2.3 Handling \nbehavioral \nchallenges \n \n3. Facilitate \nbehavioral \nchallenges  \n3.1 Body changes \nsensitivity are identified \nbased on the growth \nand development \n3.2 Separation anxiety is \nrecognized based on \nestablished policies \nand procedures \n3.3 Depression and anxiety \nare explained \naccording to \nestablished standards \nand policies. \n3.1 Oral and written \ncommunication \n3.2 Principles of \ntherapeutic \ncommunication \n3.3 Principle of \ninterpersonal skills \n3.4 Appropriate \nworkplace \nenvironment \n3.5 Conduciveness of \narea \n3.6 Principle of growth \nand development \n3.7 Behavioral \nchallenges in body \nchanges \n3.8 Safety precaution \n3.9 Separation anxiety \n3.10 Depression and \nanxiety \n3.1 Applying \ntherapeutic \ncommunication, \nmotivational skills \nand interpersonal \nskills \n3.2 Promoting self-\ncare and self-\ncontrol \n3.3 Handling \nbehavioral \nchallenges\n\n--- PDF PAGE 92 ---\nTR - Caregiving (Grade schooler to Adolescent) NC II Revision 00         Promulgated (06/09/2020)                   88 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Social Peers \nMay include: \n1.1. Same-aged individuals who share similar \ninterests and a part of the same social class \n1.2. Sports teams of which adolescence are a part of: \n1.2.1. Basketball \n1.2.2. Soccer \n1.2.3. Football \n1.2.4. Volleyball \n1.2.5. etc. \n1.3. School organizations and clubs \n1.3.1. Student body organization \n1.3.2. Chess club \n1.3.3. Science Club \n1.3.4. Guild \n1.3.5. Band or orchestra \n1.3.6. etc. \n2. Mature Relationship \nMay include: \n2.1. Adolescence and peer relationship  \n2.2. Adolescence and family relationship \n2.2.1. Parents \n2.2.2. Siblings \n2.2.3. Relatives or significant others \n2.3. Adolescence and romantic relationship \n2.4. Adolescence and with other adults \n3. Sexual or Gender Identity \n/Orientation \nMay include: \n3.1. Agender \n3.2. Bigender \n3.3. Cisgender \n3.4. Gender expression \n3.5. Gender fluid \n3.6. Genderqueer \n3.7. Gender variant \n3.8. Intersex \n3.9. Mx. \n3.10. Third gender \n3.11. Transgender \n3.12. Two-spirit \n3.13. Ze / Hir \n4. Sexual Behavior \nMay include: \n4.1. Solitary activity  \n4.2. Sociosexual activity \n4.2.1. Heterosexual activity \n4.2.2. Homosexual activity\n\n--- PDF PAGE 93 ---\nTR - Caregiving (Grade schooler to Adolescent) NC II Revision 00         Promulgated (06/09/2020)                   89 \nEVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1. Used appropriate therapeutic communication \nskills and interpersonal skills in handling \nbehavioral challenges among adolescence  \n1.3. Demonstrated ability to prepare activities that will \nfacilitate self control, self role and self \nresponsibility of the adolescence \n2. Resource Implication \nThe following resources should be provided: \n2.1. Appropriate workplace environment \n2.2. Facilities, equipment and materials relevant to \nthe unit of competency \n3. Method of Assessment \nCompetency in this unit must be assessed through: \n3.1. Oral questioning \n3.2. Interview \n4. Context of Assessment \n4.1. Competency may be assessed in the workplace \nor in a simulated work setting. \n4.2. Assessment shall be observed while task are \nbeing undertaken whether individually or in a \ngroup\n",
