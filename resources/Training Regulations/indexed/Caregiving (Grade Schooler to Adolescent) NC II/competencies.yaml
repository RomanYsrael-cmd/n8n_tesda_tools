ta/ \ninformation is assessed \n2.2 Analysis techniques are \napplied to assess data/ \ninformation \n2.3 Trends and anomalies \nare identified \n2.4 Data analysis \ntechniques and \nprocedures are \ndocumented \n2.5 Recommendations are \nmade on areas of \npossible improvement \n \n \n2.1 Business \nmathematics and \nstatistics \n2.2 Data analysis \ntechniques/ \nprocedures \n2.3 Reporting \nrequirements to a \nrange of audiences \n2.4 Legislation, policy \nand procedures \nrelating to the \nconduct of \nevaluations \n2.5 Organisational \nvalues, ethics and \ncodes of conduct \n2.1 Computing \nbusiness \nmathematics and \nstatistics \n2.2 Describing data \nanalysis \ntechniques/ \nprocedures \n2.3 Reporting \nrequirements to a \nrange of audiences \n2.4 Stating legislation, \npolicy and \nprocedures relating \nto the conduct of \nevaluations \n2.5 Stating \norganisational \nvalues, ethics and \ncodes of conduct \n3. Record and \npresent \ninformation  \n3.1 Studied \ndata/information are \nrecorded \n3.2 Recommendations are \nanalysed for action to \nensure they are \ncompatible with the \nproject’s scope and \nterms of reference \n3.3 Interim and final reports \nare analysed and \noutcomes are \ncompared to the criteria \nestablished at the \noutset \n3.4 Findings are presented \nto stakeholders \n \n3.1 Data analysis \ntechniques/ \nprocedures \n3.2 Reporting \nrequirements to a \nrange of audiences \n3.3 Legislation, policy \nand procedures \nrelating to the \nconduct of \nevaluations \n3.4 Organisational \nvalues, ethics and \ncodes of conduct \n \n3.1 Describing data \nanalysis \ntechniques/ \nprocedures \n3.2 Reporting \nrequirements to a \nrange of audiences \n3.3 Stating legislation, \npolicy and \nprocedures relating \nto the conduct of \nevaluations \n3.4 Stating \norganisational \nvalues, ethics and \ncodes of conduct \npractices\n\n--- PDF PAGE 28 ---\nTR - Caregiving (Grade schooler to Adolescent) NC II Revision 00         Promulgated (06/09/2020)     