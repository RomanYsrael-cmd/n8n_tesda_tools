        "source_title": "MAINTAIN HIGH STANDARDS OF CLIENT SERVICES",
        "source_text": "--- PDF PAGE 58 ---\nTR - Caregiving (Grade schooler to Adolescent) NC II Revision 00         Promulgated (06/09/2020)                   54 \nUNIT OF COMPETENCY \n: MAINTAIN HIGH STANDARDS OF CLIENT SERVICES \n \n \n \nUNIT CODE \n: HHC532204 \n \n \n \nUNIT DESCRIPTOR \n: This unit covers the knowledge, skills and attitudes required \nin the maintenance of high standards of patient / client \nservices. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the  \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Communicate \nappropriately \nwith patients / \nclients  \n1.1 Effective \ncommunication \nstrategies and \ntechniques are \nidentified and used to \nachieve best client \nservice outcomes \n1.2 Complaints are \nresponded to in \naccordance with \norganizational policy \nto ensure best service \nto clients \n1.3 Complaints are dealt \nwith in accordance \nwith established \nprocedures \n1.4 Interpreter services \nare accessed as \nrequired \n1.5 Action is taken to \nresolve conflicts either \ndirectly, where a \npositive outcome can \nbe immediately \nachieved, or by \nreferral to the \nappropriate personnel \n1.6 Participation in work \nteam is constructive \nand collaborative and \ndemonstrates an \nunderstanding of own \nrole \n1.1 Reporting, \ndocumentation and \nuse of non-verbal and \nverbal communication \n1.2 Management of \nconflict \n1.3 Knowledge on \ncultural differences of \nclient including rules \nand policies as \nnecessary  \n1.4 Roles and \nresponsibilities of self \nand other workers \nwithin the \norganization \n1.5 Knowledge on client \nissues that need to \nbe referred to an \nappropriate health \nprofessional \n1.6 Organizational / \ninstitutional policies \nand procedures for \nprivacy and \nconfidentiality of \ninformation provided \nby clients and others \n1.7 Institutional policy on \npatient / client rights \nand responsibilities \n1.8 Knowledge on the \nuse mathematical \noperations such as \naddition, subtraction, \ndivision, multiplication \n1.9 Concepts on modes \nof communication \n1.10 Knowledge on the \nuse of equipment \n1.11 Knowledge on \noperating of \nequipment needed \n1.1 Calculating the \ncost for additional \npersonnel \nequipment (ex. \nInterpreter, \ngadgets) \n1.2 Identifying the \nmode on \ncommunication \nappropriate for \nthe situation \n1.3 Applying modes \nof communication  \n1.4 Operating \nequipment of \ncommunication \nneeded \n1.5 Establishing and \nmaintaining \nrelationships, \ntaking into \naccount individual \ndifferences \n1.6 Following the \ninstructions and \nguidance of \nhealth \nprofessionals \ninvolved with the \ncare of client \n1.7 Respecting client \nrights \n1.8 Using effective \nlistening \ntechniques \n1.9 Using appropriate \nverbal and non-\nverbal \ncommunication \nstyles \n1.10 Using oral and \nwritten \ncommunication\n\n--- PDF PAGE 59 ---\nTR - Caregiving (Grade schooler to Adolescent) NC II Revision 00         Promulgated (06/09/2020)                   55 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the  \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \nfor communication \n(computer, cell \nphone, and other \nforms of media) \n \n1.11 Applying \nproblem solving \nskills that \nincludes using \navailable \nresources while \nprioritizing \nworkload \n1.12 Dealing with \nconflict \n1.13 Working with \nothers and \ndisplaying \nempathy with \nclient and \nrelatives \n1.14 Demonstrating \nintra and \ninterpersonal \nskills \n1.15 Reporting and \ndocumentation \nwith accuracy \n2. Establish and \nmaintain good \ninterpersonal \nrelationship \nwith clients  \n2.1 Rapport is established \nto ensure the service \nis appropriate to and \nin the best interests of \nclients \n2.2 Effective listening \nskills are used to \nensure a high level of \neffective \ncommunication and \nquality of service  \n2.3 Client concerns and \nneeds are correctly \nidentified and \nresponded to \nresponsibly and \naccordingly \nestablished \nprocedures and \nguidelines \n2.4 Effectiveness of \ninterpersonal \ninteraction is \nconsistently \nmonitored and \nevaluated to ensure \nbest client service \noutcomes \n2.1 Reporting, \ndocumentation and \nuse of non-verbal \nand verbal \ncommunication \n2.2 Management of \nconflict \n2.3 Knowledge on \ncultural differences \nof client including \nrules and policies as \nnecessary  \n2.4 Organizational / \ninstitutional policies \nand procedures for \nprivacy and \nconfidentiality of \ninformation provided \nby clients and others \n2.5 Institutional policy on \nclient rights and \nresponsibilities \n2.6 Concepts on modes \nof communication \n2.7 Knowledge on the \nuse of equipment \n2.8  Knowledge on \noperating of \nequipment needed \n2.1 Identifying the \nmode on \ncommunication \nappropriate for \nthe situation \n2.2 Applying modes \nof communication  \n2.3 Operating \nequipment of \ncommunication \nneeded \n2.4 Establishing and \nmaintaining \nrelationships, \ntaking into \naccount individual \ndifferences \n2.5 Following the \ninstructions and \nguidance of \nhealth \nprofessionals \ninvolved with the \ncare of client \n2.6 Respecting for \nclient rights \n2.7 Using effective \nlistening \ntechniques\n\n--- PDF PAGE 60 ---\nTR - Caregiving (Grade schooler to Adolescent) NC II Revision 00         Promulgated (06/09/2020)                   56 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the  \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \nfor communication \n(computer, cell \nphone, and other \nforms of media) \n \n \n2.8 Using appropriate \nverbal and non-\nverbal \ncommunication \nstyles \n2.9 Using oral and \nwritten \ncommunication \n2.10 Working with \nothers and \ndisplaying \nempathy with \nclient and \nrelatives \n2.11 Applying conflict \nmanagement \nskills \n2.12 Demonstrating \nintra and \ninterpersonal \nskills \n2.13 Reporting and \ndocumentation \nwith accuracy \n3. Act in a \nrespectful \nmanner at all \ntimes \n3.1 Respect for \ndifferences is \npositively, actively \nand consistently \ndemonstrated in all \nwork  \n3.2 Confidentiality and \nprivacy of client is \nmaintained \n3.3 Courtesy is \ndemonstrated in all \ninteractions with \nclients, their visitors, \ncareers and family \n3.4 Assistance with the \ncare of clients with \nchallenging behaviors \nis provided in \naccordance with \nestablished \nprocedures \n3.5 Techniques are used \nto manage and \nminimize aggression \n3.1 Reporting, \ndocumentation and \nuse of non-verbal and \nverbal \ncommunication \n3.2 Management of \nconflict \n3.3 knowledge on cultural \ndifferences of client \nincluding rules and \npolicies as necessary  \n3.4 Organizational / \ninstitutional policies \nand procedures for \nprivacy and \nconfidentiality of \ninformation provided \nby clients and others \n3.5 Institutional policy on \nclient rights and \nresponsibilities \n3.6 Concepts on modes \nof communication \n3.7 Knowledge on the \nuse of equipment \n3.8 knowledge on \noperating of \nequipment needed \n3.1 Identifying the \nmode on \ncommunication \nappropriate for \nthe situation \n3.2 Applying modes of \ncommunication  \n3.3 Operating \nequipment of \ncommunication \nneeded \n3.4 Establishing and \nmaintaining \nrelationships, \ntaking into \naccount individual \ndifferences \n3.5 Following the \ninstructions and \nguidance of \nhealth \nprofessionals \ninvolved with the \ncare of client \n3.6 Respecting for \nclient rights\n\n--- PDF PAGE 61 ---\nTR - Caregiving (Grade schooler to Adolescent) NC II Revision 00         Promulgated (06/09/2020)                   57 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the  \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \nfor communication \n(computer, cell \nphone, and other \nforms of media) \n \n3.7 Using effective \nlistening \ntechniques \n3.8 Using appropriate \nverbal and non-\nverbal \ncommunication \nstyles \n3.9 Using oral and \nwritten \ncommunication \n3.10 Working with \nothers and \ndisplaying \nempathy with \nclient and \nrelatives \n3.11 Applying conflict \nmanagement \nskills \n3.12 Demonstrating \nintra and \ninterpersonal \nskills \n3.13 Reporting and \ndocumentation \nwith accuracy \n4. Evaluate own \nwork to \nmaintain a \nhigh standard \nof client \nservice \n4.1 Advice and \nassistance are \nreceived or sought \nfrom appropriate \nsources on own \nperformance \n4.2 Own work is adjusted, \nincorporating \nrecommendations that \naddress performance \nissues, to maintain \nthe agreed standard \nof client support \n4.1 Reporting, \ndocumentation and \nuse of non-verbal \nand verbal \ncommunication \n4.2 Concepts on modes \nof communication \n4.3 Knowledge on \nevaluation and \nanalysis of work \nperformance \n \n4.1 Identifying the \nmode on \ncommunication \nappropriate for \nthe situation \n4.2 Applying modes \nof communication  \n4.3 Identifying \nstandards for \nwork procedures \n4.4 Implementing \nstandards for \nwork procedures \n4.5 Maintaining \nstandards for \nwork procedures \n4.6 Demonstrating \nintra and \ninterpersonal \nskills \n4.7 Reporting and \ndocumentation\n\n--- PDF PAGE 62 ---\nTR - Caregiving (Grade schooler to Adolescent) NC II Revision 00         Promulgated (06/09/2020)                   58 \n  RANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Communication  \n \nMay include: \n1.1. \nEnglish/Tagalog/vernacular \n1.2. \nSign language \n1.3. \nThrough an interpreter \n1.4. \nCommunity language as required by the service / \norganization \n2.  Clients  \nMay include: \n2.1. \nClients  \n2.2. \nProspective clients to the service or services \n2.3. \nClients may be in contact with the institution through \nappropriate health care personnel and professionals or \nother advocates or agencies \n3. Respect for difference  May include: \n3.1 \nPhysical \n3.2 \nCognitive/mental or intellectual issues that may impact \non communication \n3.3 \nCultural and ethnic \n3.4 \nReligious/spiritual \n3.5 \nSocial \n3.6 \nAge \n3.7 \nLanguage literacy and numeracy abilities  \n3.8 \nSexuality and sexual preference \n4. Confidentiality and \nprivacy of clients  \nMay include: \n4.1 \nFees \n4.2 \nHealth fund entitlements \n4.3 \nWelfare entitlements \n4.4 \nPayment Method and records \n4.5 \nPublic environments \n4.6 \nLegal and ethical requirements \n4.7 \nWriting details ie. medical and consent forms \n4.8 \nConversations on the telephone \n4.9 \nSecure location for written records \n4.10 \nOffering a private location for discussions \n4.11 \nInformation disclosed to an appropriate person \nconsistent with one’s level of responsibility  \n5. Others with whom \ninteraction is required \nin regard to client \nservices \nMay include: \n5.1 Other staff and team members \n5.2 Service units or departments \n5.3 Family members, careers and friends of clients  \n5.4 Professional representatives or agents of clients such as: \n5.4.1 Medical specialists \n5.4.2 Nurses \n5.4.3 Social workers \n5.4.4 Dietitians \n5.4.5 Therapists \n5.4.6 Allied health professionals \n5.4.7 Volunteers\n\n--- PDF PAGE 63 ---\nTR - Caregiving (Grade schooler to Adolescent) NC II Revision 00         Promulgated (06/09/2020)                   59 \nVARIABLE \nRANGE \n5.4.8 Teachers and/or spiritual \n5.4.9 Community  \n5.5 General public \n6. Modes of \ncommunication: \nMay include: \n6.1 Continuing interaction with clients \n6.2 Verbal conversations either in person or via telephone \n6.3 Written notes by post or electronic media \n6.4 Worker, family member friend or professional interpreter \nwho has relevant languages \n7.  Performance \nmonitoring \nMay include: \n7.1  Self- assessment and monitoring \n7.2  Supervisor assessment \n7.3  Client  feedback \n7.4  Co-workers’ feedback / peer evaluation \n \n \n \n  EVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency  \nAssessment requires evidence that the candidate: \n1.1. Communicated appropriately with clients \n1.2. Handled complaints and resolved conflict, or referred \nmatters to supervisors when required \n1.3. Complied with relevant policies, protocols, guidelines \nand procedures of the organization \n1.4. Established and maintained good interpersonal \nrelationship with clients \n1.5. Demonstrated courtesy in all interactions with clients, \ntheir visitors, and family \n2. Resource Implications The following resources should be provided: \n2.1. Access to relevant workplace or appropriately \nsimulated environment where assessment can take \nplace \n2.2. Relevant government and organizational policy, \nguidelines, procedures and protocols \n2.3. Any relevant legislation in relation to service delivery \n3. Methods of \nAssessment \nCompetency in this unit may be assessed through: \n3.1. Demonstration with questioning \n3.2. Interview \n3.3. Third party report \n4. Context of \nAssessment \n4.1. Competency maybe assessed in actual workplace or at \nthe designated TESDA Accredited Assessment Center.\n",
