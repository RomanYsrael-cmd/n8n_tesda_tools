        "source_text": "--- PDF PAGE 6 ---\nTR - Caregiving (Grade schooler to Adolescent) NC II Revision 00         Promulgated (06/09/2020)                   2 \nSECTION 2 \nCOMPETENCY STANDARDS \n \n \nThis section gives the details of the contents of the units of competency required in \nCAREGIVING (GRADE SCHOOLER TO ADOLESCENT) NC II. \n \n \nBASIC COMPETENCIES \n \n \nUNIT OF COMPETENCY : PARTICIPATE IN WORKPLACE COMMUNICATION \n \n \n \nUNIT CODE \n: 400311210 \n \n \n \nUNIT DESCRIPTOR \n: This unit covers the knowledge, skills and attitudes  \nrequired to gather, interpret and convey information in \nresponse to workplace requirements. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the  \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1.   Obtain and \nconvey \nworkplace \ninformation \n1.1 Specific and relevant \ninformation is accessed \nfrom appropriate \nsources  \n1.2 Effective questioning, \nactive listening and \nspeaking skills are \nused to gather and \nconvey information \n1.3 Appropriate medium is \nused to transfer \ninformation and ideas \n1.4 Appropriate non- verbal \ncommunication is used \n1.5 Appropriate lines of \ncommunication with \nsupervisors and \ncolleagues are \nidentified and followed \n1.6 Defined workplace \nprocedures for the \nlocation and storage of \ninformation are used \n1.7 Personal interaction is \ncarried out clearly and \nconcisely \n \n \n \n1.1 Effective verbal and \nnonverbal \ncommunication \n1.2 Different modes of \ncommunication  \n1.3 Medium of \ncommunication in \nthe workplace \n1.4 Organizational \npolicies \n1.5 Communication \nprocedures and \nsystems \n1.6 Lines of \nCommunication \n1.7 Technology relevant \nto the enterprise and \nthe individual’s work \nresponsibilities  \n1.8 Workplace etiquette \n \n \n1.1 Following simple \nspoken language \n1.2 Performing routine \nworkplace duties \nfollowing simple \nwritten notices \n1.3 Participating in \nworkplace \n