      "source_text": "TESDA shall provide the training on the development of competency-based\ncurricula to enable training providers develop their own curricula with the components\nmentioned below.\n\nDelivery of knowledge requirements for the basic, common and core units of\ncompetency specifically in the areas of mathematics, science/technology,\ncommunication/language and other academic subjects shall be contextualized. To\nthis end, TVET providers shall develop a Contextual Learning Matrix (CLM) to\naccompany the curricula.\n\nCourse Title:\nCAREGIVING (Grade schooler\nto Adolescent)\nNC Level: NC II\n\nNominal Training Duration:\n\n37 hours\nBasic Competencies\n\n112 hours\nCommon Competencies\n\n240 hours\nCore Competencies\n\n389 hours\n\n160 hours\nSupervised Industry Learning (SIL)\n\n549 hours TOTAL\n\nCourse Description:\n\nThis course is designed to provide the learner with knowledge, skills and\nattitude, applicable in performing work activities involve in providing care and support,\nfostering physical needs, cognitive development to grade schooler (6 years old to 12\nyears old), and fostering physical growth and development, and promoting\ndevelopmental tasks for adolescent (13 years old to 19 years old). This include\nclassroom learning activities and simulation area.\n\nUpon completion of the program, the learners are expected to demonstrate\nthe above-mentioned competencies to be employed. To obtain this, all units\nprescribed for this qualification must be achieved.\n\n--- PDF PAGE 100 ---\nTR - Caregiving (Grade schooler to Adolescent) NC II Revision 00 Promulgated (06/09/2020) 96\nBASIC COMPETENCIES\n(37 HOURS)\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n1. Participate in\nworkplace\ncommunication\n1.1. Obtain and\nconvey\nworkplace\ninformation\n•\nDescribe organizational policies\n•\nRead:\no Effective communication\no Written communication\no Communication procedures and systems\n•\nIdentify:\no Different modes of communication\no Medium of communication\no Flow of communication\no Available technology relevant to the\nenterprise and the individual’s work\nresponsibilities\n•\nPrepare different types of question\n•\nGather different sources of information\n•\nApply storage system in establishing\nworkplace information\n•\nDemonstrate Telephone courtesy\n• Group discussion\n• Lecture\n• Demonstration\n• Oral evaluation\n• Written\nexamination\n• Observation\n2 hours\n1.2. Perform duties\nfollowing\nworkplace\ninstructions\n•\nRead:\no Written notices and instructions\no Workplace interactions and procedures\n•\nRead instructions on work related\nforms/documents\n•\nPerform workplace duties scenario following\nworkplace instructions\n• Group discussion\n• Lecture\n• Demonstration\n• Oral evaluation\n• Written\nexamination\n• Observation\n2 hours\n1.3. Complete\nrelevant work-\nrelated\ndocuments\n•\nDescribe communication procedures and\nsystems\n•\nRead:\no Meeting protocols\no Nature of workplace meetings\no Workplace interactions\n• Group discussion\n• Lecture\n• Demonstration\n• Role play\n• Oral evaluation\n• Written\nexamination\n• Observation\n2 hours\n\n--- PDF PAGE 101 ---\nTR - Caregiving (Grade schooler to Adolescent) NC II Revision 00 Promulgated (06/09/2020) 97\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\no Barriers of communication\n•\nRead instructions on work related\nforms/documents\n•\nPractice:\no Estimate, calculate and record routine\nworkplace measures\no Basic mathematical processes of\naddition, subtraction, division and\nmultiplication\n•\nDemonstrate office activities in:\no workplace meetings and discussions\nscenario\n•\nPerform workplace duties scenario following\nsimple written notices\n•\nFollow simple spoken language\n•\nIdentify the different Non-verbal\ncommunication\n•\nDemonstrate ability to relate to people of\nsocial range in the workplace\n•\nGather and provide information in response\nto workplace requirements\n•\nComplete work-related documents\n2. Work in a team\nenvironment\n2.1 Describe team\nrole and scope\n•\nDiscussion on team roles and scope\n•\nParticipate in the discussion:\no\nDefinition of Team\no\nDifference between team and group\no Objectives and goals of team\n•\nLocate needed information from the different\nsources of information\n• Lecture/\nDiscussion\n• Group Work\n• Individual Work\n• Role Play\n• Role Play\n• Case Study\n• Written Test\n1 hour\n2.2 Identify one’s\nrole and\nresponsibility\nwithin team\n•\nRole play:\no individual role and responsibility\n•\nRole Play\no Understanding Individual differences\n• Role Play\n• Lecture/\nDiscussion\n• Role Play\n• Written Test\n1 hour\n\n--- PDF PAGE 102 ---\nTR - Caregiving (Grade schooler to Adolescent) NC II Revision 00 Promulgated (06/09/2020) 98\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n•\nDiscussion on gender sensitivity\n2.3 Work as a team\nmember\n• Participate in group planning activities\n• Role play : Communication protocols\n• Participate in the discussion of standard work\nprocedures and practices\n• Group work\n• Role Play\n• Lecture/\nDiscussion\n• Role Play\n• Written Test\n1 hour\n3. Solve/address\nroutine problems\n3.1 Identify routine\nproblems\n• Review of the current industry hardware and\nsoftware products and services\n• Identify correctly the industry maintenance,\nservice and helpdesk practices, processes and\nprocedures\n• Make use of the industry standard diagnostic\ntools\n• Share best practices in determining basic\nmalfunctions and resolutions to general\nproblems in the workplace\n• Analyze routine/procedural problems\n• Group discussion\n• Lecture\n• Demonstration\n• Role playing\n• Case Formulation\n• Life Narrative\nInquiry (Interview)\n• Standardized test\n1 hour\n3.2 Look for\nsolutions to\nroutine problems\n• Review of the current industry hardware and\nsoftware products and services\n• Identify correctly the industry maintenance,\nservice and helpdesk practices, processes and\nprocedures\n• Make use of the industry standard diagnostic\ntools\n• Share best practices in determining basic\nmalfunctions and resolutions to general\nproblems in the workplace\n• Formulate possible solutions to problems and\ndocument procedures for reporting\n• Group discussion\n• Lecture\n• Demonstration\n• Role playing\n• Case Formulation\n• Life Narrative\nInquiry (Interview)\n• Standardized test\n1 hour\n3.3 Look for\nsolutions to\nroutine problems\n• Review of the current industry hardware and\nsoftware products and services\n• Identify correctly the industry maintenance,\nservice and helpdesk practices, processes and\nprocedures\n• Group discussion\n• Lecture\n• Demonstration\n• Role playing\n• Case Formulation\n• Life Narrative\nInquiry (Interview)\n• Standardized test\n1 hour\n\n--- PDF PAGE 103 ---\nTR - Caregiving (Grade schooler to Adolescent) NC II Revision 00 Promulgated (06/09/2020) 99\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n• Make use of the industry standard diagnostic\ntools\n• Share best practices in determining basic\nmalfunctions and resolutions to general\nproblems in the workplace\n• Formulate possible solutions to problems and\ndocument procedures for reporting\n4. Develop Career\nand Life\nDecisions\n4.1 Manage one’s\nemotion\n• Demonstrate self-management strategies that\nassist in regulating behavior and achieving\npersonal and learning goals\n• Explain enablers and barriers in achieving\npersonal and career goals\n• Identify techniques in handling negative\nemotions and unpleasant situation in the\nworkplace such as frustration, anger, worry,\nanxiety, etc.\n• Manage properly one’s emotions and\nrecognize situations that cannot be changed\nand accept them and remain professional\n• Recall instances that demonstrate self-\ndiscipline, working independently and showing\ninitiative to achieve personal and career goals\n• Share experiences that show confidence, and\nresilience in the face of setbacks and\nfrustrations and other negative emotions and\nunpleasant situations in the workplace\n• Discussion\n• Interactive\nLecture\n• Brainstorming\n• Demonstration\n• Role-playing\n• Demonstration or\nsimulation with\noral questioning\n• Case problems\ninvolving\nworkplace diversity\nissues\n\n1 hour\n4.2 Develop\nreflective\npractice\n• Enumerate strategies to improve one’s attitude\nin the workplace\n• Explain Gibbs’ Reflective Cycle/Model\n(Description, Feelings, Evaluation, Analysis,\nConclusion, and Action plan)\n• Use basic SWOT analysis as self-assessment\nstrategy\n• Small Group\nDiscussion\n• Interactive\nLecture\n• Brainstorming\n• Demonstration\n• 5 Role-playing\n• Demonstration or\nsimulation with\noral questioning\n• Case problems\ninvolving\nworkplace diversity\nissues\n\n1 hour\n\n--- PDF PAGE 104 ---\nTR - Caregiving (Grade schooler to Adolescent) NC II Revision 00 Promulgated (06/09/2020) 100\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n• Develop reflective practice through realization\nof limitations, likes/ dislikes; through showing\nof self-confidence\n• Demonstrate self-acceptance and being able\nto accept challenges\n4.3 Boost self-\nconfidence and\ndevelop self-\nregulation\n• Describe the components of self-regulation\nbased on Self-Regulation Theory (SRT)\n• Explain personality development concepts\n• Cite self-help concepts (e. g., 7 Habits by\nStephen Covey, transactional analysis,\npsycho-spiritual concepts)\n• Perform effective communication skills –\nreading, writing, conversing skills\n• Show affective skills – flexibility, adaptability,\netc.\n• Determine strengths and weaknesses\n• Small Group\nDiscussion\n• Interactive\nLecture\n• Brainstorming\n• Demonstration\n• Role-playing\n• Demonstration or\nsimulation with\noral questioning\n• Case problems\ninvolving\nworkplace diversity\nissues\n\n1 hour\n5. Contribute to\nworkplace\ninnovation\n5.1 Identify\nopportunities to\ndo things better\n• Identify different roles of individuals in\ncontributing to doing things better in the\nworkplace\n• Explain the concepts of positive impacts and\nchallenges in innovation\n• Show mastery of the different types of\nchanges and levels of participation in the\nworkplace\n• Discuss 7 habits of highly effective people\n• Interactive\nLecture\n• Appreciative\nInquiry\n• Demonstration\n• Group work\n• Psychological and\nbehavioral\nInterviews\n• Performance\nEvaluation\n• Life Narrative\nInquiry\n• Review of\nportfolios of\nevidence and\nthird-party\nworkplace reports\nof on-the-job\nperformance\n• Standardized\nassessment of\ncharacter\n1 hour\n\n--- PDF PAGE 105 ---\nTR - Caregiving (Grade schooler to Adolescent) NC II Revision 00 Promulgated (06/09/2020) 101\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\nstrengths and\nvirtues applied\n5.2 Discuss and\ndevelop ideas\nwith others\n\n• Identify different roles of individuals in\ncontributing to doing things better in the\nworkplace\n• Explain the concepts of positive impacts and\nchallenges in innovation\n• Show mastery of the different types of\nchanges and levels of participation in the\nworkplace\n• Discuss 7 habits of highly effective people\n• Communicate ideas through small group\ndiscussions and meetings\n• Interactive\nLecture\n• Appreciative\nInquiry\n• Demonstration\n• Group work\n• Psychological and\nbehavioral\nInterviews\n• Performance\nEvaluation\n• Life Narrative\nInquiry\n• Review of\nportfolios of\nevidence and\nthird-party\nworkplace reports\nof on-the-job\nperformance.\n• Standardized\nassessment of\ncharacter\nstrengths and\nvirtues applied\n1 hour\n5.3 Integrate ideas\nfor change in the\nworkplace\n\n• Identify different roles of individuals in\ncontributing to doing things better in the\nworkplace\n• Explain the concepts of positive impacts and\nchallenges in innovation\n• Show mastery of the different types of\nchanges and levels of participation in the\nworkplace\n• Discuss 7 habits of highly effective people\n• Communicate ideas through small group\ndiscussions and meetings\n• Demonstrate basic skills in data analysis\n• Interactive\nLecture\n• Appreciative\nInquiry\n• Demonstration\n• Group work\n• Psychological and\nbehavioral\nInterviews\n• Performance\nEvaluation\n• Life Narrative\nInquiry\n• Review of\nportfolios of\nevidence and\nthird-party\nworkplace reports\n1 hour\n\n--- PDF PAGE 106 ---\nTR - Caregiving (Grade schooler to Adolescent) NC II Revision 00 Promulgated (06/09/2020) 102\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\nof on-the-job\nperformance.\n• Standardized\nassessment of\ncharacter\nstrengths and\nvirtues applied\n6. Present relevant\ninformation\n6.1 Gather data/\ninformation\n• Lecture and discussion on:\n- Organisational protocols\n- Confidentiality and accuracy\n- Business mathematics and statistics\n- Legislation, policy and procedures\nrelating to the conduct of evaluations\n• Reviewing data/ information\n• Group discussion\n• Lecture\n• Demonstration\n• Role Play\n• Oral evaluation\n• Written Test\n• Observation\n• Presentation\n2 hours\n6.2 Assess gathered\ndata/ information\n• Lecture and discussion on:\n- Data analysis techniques/ procedures\n- Organisational values, ethics and codes\nof conduct\n- Trends and anomalies\n• Computing business mathematics and\nstatistics\n• Application of data analysis techniques\n• Group discussion\n• Lecture\n• Demonstration\n• Role Play\n• Practical exercises\n• Oral evaluation\n• Written Test\n• Observation\n• Presentation\n3 hours\n6.3 Record and\npresent\ninformation\n• Lecture and discussion on:\n- Reporting requirements to a range of\naudiences\n- Recommendations for possible\nimprovements\n• Analysis and comparison of interim and final\nreports’ outcomes\n• Reporting of data findings\n• Group discussion\n• Lecture\n• Demonstration\n• Role Play\n• Practical exercises\n\n• Oral evaluation\n• Written Test\n• Observation\n• Presentation\n3 hours\n7.1 Identify OSH\ncompliance\nrequirements\n• Discussion regarding:\n- Hierarchy of Controls\n- Hazard Prevention and Controls\n•\nLecture\n•\nGroup\nDiscussion\n• Written Exam\n• Demonstration\n• Observation\n1 hour\n\n--- PDF PAGE 107 ---\nTR - Caregiving (Grade schooler to Adolescent) NC II Revision 00 Promulgated (06/09/2020) 103\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n7. Practice\nOccupational\nSafety and\nHealth Policies\nand Procedures\n- Work Standards and Procedures\n- Personal Protective Equipment\n\n• Interviews /\nQuestioning\n7.2 Prepare OSH\nrequirements for\ncompliance\n• Identification of required safety materials, tools\nand equipment\n• Handling of safety control resources\n\n• Lecture\n• Group Discussion\n\n• Written Exam\n• Demonstration\n• Observation\n• Interviews /\nQuestioning\n1 hour\n7.3 Perform tasks in\naccordance with\nrelevant OSH\npolicies and\nprocedures\n•\nDiscussion of General OSH Standards and\nPrinciples\n• Performing industry related work activities in\naccordance with OSH Standards\n• Lecture\n• Group Discussion\n\n• Written Exam\n• Demonstration\n• Observation\n• Interviews /\n• Questioning\n2 hours\n8. Exercise\nEfficient and\nEffective\nSustainable\nPractices in the\nWorkplace\n8.1 Identify the\nefficiency and\neffectiveness of\nresource\nutilization\n• Identify the processes on environmental\npolicies\n• Relate the necessary skills in response to\nchanging environmental policies needs\n-\nWaste Management Skills\n-\nConservation of Energy in workplace\n• Lecture\n• Group Discussion\n• Simulation\n• Demonstration\n\n• Written Exam\n• Demonstration\n• Observation\n• Interviews /\n• Questioning\n1 hour\n8.2 Determine\ncauses of\ninefficiency\nand/or\nineffectiveness\nof resource\nutilization\n• Discussion of environmental protection and\nresource efficiency targets\n• Analysis on the relevant work procedure\n• Lecture\n• Group Discussion\n• Demonstration\n\n• Written Exam\n• Demonstration\n• Observation\n• Interviews /\n• Questioning\n1 hour\n8.3 Convey\ninefficient and\nineffective\nenvironmental\npractices\n• Identification of (re)training needs and usage\nof environment friendly methods and\ntechnologies\n• Identification of environmental corrective\nactions\n• Practicing environment awareness\n• Lecture\n• Group Discussion\n• Role Play\n• Demonstration\n\n• Written Exam\n• Demonstration\n• Observation\n• Interviews /\n• Questioning\n1 hour\n9.1 Apply\nentrepreneurial\n• Case studies on best entrepreneurial practices\n• Case Study\n• Lecture/\n• Case Study\n• Written Test\n1 hour\n\n--- PDF PAGE 108 ---\nTR - Caregiving (Grade schooler to Adolescent) NC II Revision 00 Promulgated (06/09/2020) 104\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n9. Practice\nEntrepreneurial\nSkills in the\nWorkplace\nworkplace best\npractices\n\n• Discussion on quality procedures and\npractices\n• Case studies on cost consciousness in\nresource utilization\nDiscussion\n• Interview\n9.2 Communicate\nentrepreneurial\nworkplace best\npractices\n• Discussion on communicating entrepreneurial\nworkplace best practices\n\n• Lecture/\nDiscussion\n• Written Test\n• Interview\n1 hour\n9.3 Communicate\nentrepreneurial\nworkplace best\npractices\n• Discussion on communicating entrepreneurial\nworkplace best practices\n\n• Lecture/\nDiscussion\n• Written Test\n• Interview\n1 hour\n\n--- PDF PAGE 109 ---\nTR - Caregiving (Grade schooler to Adolescent) NC II Revision 00 Promulgated (06/09/2020) 105\n\nCOMMON COMPETENCIES\n(112 HOURS)\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n1 Implement\nand monitor\ninfection\ncontrol\npolicies and\nprocedures\n(32 hours)\n1.1 Provide\ninformation to\nthe work group\nabout the\norganization's\ninfection control\npolicies and\nprocedures.\n•\nLecture and discussion on:\n-\nUse of personal protective equipment (PPE)\n-\nTransmission of infectious diseases\n-\nConcepts and modes of communication\n-\nCommunication equipment (computer,\ntelephone, cell phone etc.)\n-\nOSH, infection control, environmental and\ninstitutional, rules, guidelines, policies and\nprocedures\n-\nRespecting for patient / client rights\n-\nLiteracy levels and communication skills of\nwork group members and consequent\nsuitable communication techniques\n•\nDemonstrate proper use of personal\nprotective equipment (PPE)\n•\nDemonstrate proper hand washing (WHO\nStandard)\n•\nApply Body Substance Isolation (BSI) by\nusing PPE (Personal Protective Equipment)\n•\nDemonstrate use of disinfectant\n•\nApply social distancing\n•\nDemonstrate operating equipment for\ncommunication\n•\nApply effective communicating and\ninterpersonal skills including:\n• Lecture (online /\nface to face)\n• Discussion (online\n/ face to face)\n• Self-Learning\n• Video Presentation\n(offline / face to\nface)\n• Demonstration\n• Role play\n\n• Written test (online\n/ face to face)\n• Interview\n• Portfolio\nassessment\n• Observation\n• Demonstration\nwith questioning\n12 hours\n\n--- PDF PAGE 110 ---\nTR - Caregiving (Grade schooler to Adolescent) NC II Revision 00 Promulgated (06/09/2020) 106\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n-\nlanguage competence\n-\nliteracy and reading competence\n-\nnegotiating Skills\n-\nintra and Interpersonal skills\n1.2 Integrate the\norganization's\ninfection control\npolicy and\nprocedure into\nwork practices\n•\nLecture and discussion on:\n-\nUse of verbal and non-verbal therapeutic\ncommunication\n-\nRA 11058 – OSH Law\n-\nRA 9008 – Ecological Solid Waste\nManagement Act\n-\nRA 856 – Sanitation Code of the Phil.\n-\nHazards and infectious risk\n-\nSafe work procedures\n-\nUse of computer for documentation and\nreporting\n•\nDemonstrate appropriate wearing, removal\nand disposal of PPE (Personal Protective\nEquipment)\n•\nEncourage employees to report hazards and\nrisks in the work place\n•\nRecognize suggestions of employees to\nimprove infection control practices\n• Lecture (online /\nface to face)\n• Discussion (online\n/ face to face)\n• Self-Learning\n• Video Presentation\n(offline / face to\nface)\n• Demonstration\n• Role play\n\n• Written test (online\n/ face to face)\n• Interview\n• Portfolio\nassessment\n• Observation\n• Demonstration\nwith questioning\n12 hours\n\n1.3 Monitor infection\ncontrol\nperformance and\nimplement\nimprovements in\npractices\n•\nLecture and discussion on:\n-\nKey performance indicators of infection\ncontrol and prevention\n-\nMonitoring, surveillance and investigation of\ninfection risks and hazardous events\n-\nAggregate infection control information\nreports\n• Lecture (online /\nface to face)\n• Discussion (online\n/ face to face)\n• Self-Learning\n• Video Presentation\n(offline / face to\nface)\n• Written test\n(online / face to\nface)\n• Interview\n• Portfolio\nassessment\n8 hours\n\n--- PDF PAGE 111 ---\nTR - Caregiving (Grade schooler to Adolescent) NC II Revision 00 Promulgated (06/09/2020) 107\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n•\nDemonstrate identification, correction and\nreporting inadequacies in work procedures\nand infection control measures\n• Demonstration\n• Demonstration\nwith oral\nquestioning\n2. Respond\neffectively to\ndifficult/\nchallenging\nbehavior\n(24 hours)\n2.1 Plan responses\n•\nLecture and discussion on:\n-\nConcepts and modes of communication\n-\nEnvironmental and institutional, rules,\nguidelines, policies and procedures\n-\nIssues relating to difficult and challenging\nbehavior\n-\nPatient / client issues which need to be\nreferred to an appropriate health\nprofessional\n-\nPolicies and rules of health professionals\ninvolved with the care of patient / client\n-\nLiteracy levels and communication skills of\nwork group members and consequent\nsuitable communication techniques\n-\nModes of verbal, non-verbal, and written\ncommunication\n•\nApply thinking and responding quickly and\nstrategically\n•\nRemain alert to potential incidents of difficult\nor challenging behavior\n•\nDemonstrate working with others and display\nempathy with patient / client and relatives\n•\nApply intra and interpersonal skills\n•\nDemonstrate reporting and documentation\nwith accuracy\n• Lecture (online /\nface to face)\n• Discussion (online\n/ face to face)\n• Self-Learning\n• Video Presentation\n(offline / face to\nface)\n• Demonstration\n• Written test\n(online / face to\nface)\n• Interview\n• Portfolio\nassessment\n• Demonstration\nwith oral\nquestioning\n12 hours\n2.2 Apply response\n•\nLecture and discussion on:\n• Lecture (online /\nface to face)\n• Written test (online\n/ face to face)\n8 hours\n\n--- PDF PAGE 112 ---\nTR - Caregiving (Grade schooler to Adolescent) NC II Revision 00 Promulgated (06/09/2020) 108\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n-\nSuitable communication techniques to\nachieve the desired outcomes in responding\nto difficult or challenging behavior\n•\nApply thinking and responding quickly and\nstrategically\n•\nRemain alert to potential incidents of difficult\nor challenging behavior\n•\nDemonstrate working with others and display\nempathy with patient / client and relatives\n•\nApply intra and interpersonal skills\nDemonstrate reporting and documentation\nwith accuracy\n• Discussion (online\n/ face to face)\n• Self-Learning\n• Video Pre