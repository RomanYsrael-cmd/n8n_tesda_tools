      "number": "4.1",
      "text": "NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS 4.1.1 To attain the national qualification of CAREGIVING (GRADE SCHOOLER TO ADOLESCENT) NC II, the candidate must demonstrate competence in all units listed in Section 1. Successful candidates shall be awarded a National Certificate signed by the TESDA Director General. 4.1.2 A Certificate of Competency (COC) is issued by the Authority to individuals who were assessed as competent in cluster of related units of competency, namely: COC1 Provide care and support to grade schooler (6 to 12 years old) • Provide assistance and care to personal needs of grade schooler • Foster physiological needs and cognitive development of grade schooler • Foster physical growth and development of grade schooler • Respond to emergency for grade schooler COC 2 Provide care and support to adolescent (13 to 19 years old) • Foster physical growth and development of adolescent • Provide development tasks for adolescent • Respond to emergency for adolescent Upon accumulation and submission of all the COCs acquired, an individual shall be issued the corresponding National Certificate for the Qualification. 4.1.3 Assessment shall cover all competencies with basic and common integrated or assessed concurrently with the core units of competency. 4.1.4 Any of the following are qualified to undergo assessment and certification: 4.1.4.1 Graduates of WTR-registered program, NTR-registered programs or formal/non-formal/informal including enterprise-based trainings related to Caregiving (Grade schooler to Adolescent) NC II. 4.1.4.2 Experienced workers (wage employed or self-employed) who gained competencies in providing caregiving services for at least two (2) years within the last five (5) years. 4.1.5 Recognition of Prior Learning (RPL). Candidates who have gained competencies through education, informal training, previous work or life experiences with at least two (2) years of caregiving experience within the last five (5) years may apply for recognition in this Qualification through Portfolio Assessment. Requirements and implementation procedure of Portfolio Assessment must be consistent with TESDA Circular No. 47, series of 2018 on “Implementing Guidelines on the Implementation of Portfolio Assessment Leading to Recognition of Prior Learning (RPL) within the TESDA Assessment and Certification System”. 4.1.6 Holders of National Certificate (NC) or Certificates of Competency (COC) in Caregiving Services NC II are required to undergo re-assessment under the amended Training Regulations (TRs), upon expiration of their Certificates. 4.1.7 The guidelines on assessment and certification are discussed in detail in the “Procedures Manual on Assessment and Certification” and “Guidelines on the Implementation of the “Philippine TVET Competency Assessment and Certification System (PTCACS)”."
