      "source_text": "TESDA shall provide the training on the development of competency-\nbased curricula to enable training providers develop their own curricula with the \ncomponents mentioned below. \n \nDelivery of knowledge requirements for the basic, common and core units \nof competency specifically in the areas of mathematics, science/technology, \ncommunication/language and other academic subjects shall be contextualized. \nTo this end, TVET providers shall develop a Contextual Learning Matrix (CLM) to \ninclude Technology, Science, Math, English/Communication, and Safety to \nEnvironment. Includes also green technology, issues on health and drugs and \ncater to person with disabilities (PWD’s). \n \nCourse Title: AGRICULTURAL MACHINERY OPERATION NC Level II \n \nNominal Training Duration: \n \n 20 hrs\nBasic Competencies\n72 hrs\nCommon Competencies\n192 hrs\nCore Competencies\n Total\n284 hrs \n \nCourse Description: \n \nThis course is designed to provide the students/learner with knowledge, \ndesirable attitudes and skills required to perform the following competencies in \naccordance with industry standards: operate agricultural small production machinery \nand equipment, operate agricultural large production machinery and equipment, \noperate agricultural post-production machinery and equipment \n \n To obtain this, all units prescribed for this qualification must be achieved.\n\n--- PDF PAGE 52 ---\nTR –Agricultural Machinery Operation NC II Promulgated March 2016 48 \nBASIC COMPETENCIES \n20 HRS \n \nUnit of \nCompetency\nLearning \nOutcomes\nLearning Activities \nMethodology \nAssessment \nApproach\nNominal Duration \n1. Participate in \nworkplace \ncommunication\n1.1 Obtain and \nconvey \nworkplace \ninformation\n• Describe Organizational \npolicies \n \n• Group \ndiscussion \n• Oral \nevaluation \n4 Hours \n \n \n• Read: \no Effective \ncommunication\n• Lecture \n• Written \nexamination \n \no Written communication\n \n \no Communication \nproced