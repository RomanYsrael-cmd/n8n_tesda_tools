  "source_text": "COMPETENCY MAP FOR AGRICULTURE, FORESTRY AND FISHERY SECTOR \nAGRICULTURAL MACHINERY OPERATION NCII \n \nANNEX A \n \n \nParticipate in \nworkplace \ncommunication\nWork in \nteam \nenvironment \nPractice career \nprofessionalism\nPractice \noccupational \nhealth and \nsafety \nprocedures\n \n \n \n \n \n \n \n \n \n \n \nApply \nSafety \nMeasures in \nFarm \nOperations\nUse Farm \nTools and \nEquipment \nPerform \nEstimation \nand Basic \nCalculation \n \n \n \n \n \n \n \n \n \n \n \n \n \nOperate \nagricultural \nsmall \nproduction \nmachinery \nand \nequipment\nOperate \nagricultural \nlarge \nproduction \nmachinery \nand \nequipment\nOperate \nagricultural \npost-\nproduction \nmachinery \nand \nequipment\n \n \n \n \n \n \n \nBASIC \nCOMPETENCIES \nCOMMON \nCOMPETENCIES \nCORE \nCOMPETENCIES\n\n--- PDF PAGE 91 ---\nTR –Agricultural Machinery Operation NC II Promulgated March 2016 87 \nGLOSSARY OF TERMS \n \n1. 4-Wheel Tractor – wheeled power source having two axles, design to carry work by \npulling or propel various agricultural machines and implements. They are classified \naccording to horsepower rating Agricultural machinery – consists of agricultural \ntractors, self-propelled and pedestrian-operated machines, implements, and other \nequipment primarily used for agricultural operations \n \n2. Attachment – anything that is specifically approved by the manufacturer of farm \nmachinery or farm equipment to be attached to the machinery or equipment in order \nto modify it \n \n3. Coconut coir decorticator – machine to crush matured coconut husk through \nimpact or beating action to separate coco fiber and coconut peat from the husk \n \n4. Coffee pulper – machine to remove and separate the soft pulp of ripe coffee cherry \nwithout making any damage to the parchment coffee \n \n5. Corn husker-sheller – machine used to remove the husk of corn ear, detach, \nseparate and clean the corn kernels from the cobs in one operation \n \n6. Corn sheller – machine used to detach, separate and clean the corn kernels from \nthe cobs \n \n7. Cultivator – field cultivator implement for seedbed preparation, weed eradication, or \nfallow cultivation subsequent to some form of primary tillage, equipped with spring \nsteel shank \n \n8. Disc harrow – implement used to pulverize the soil to attain a better soil tilth for the \nseed germination and growth \n \n9. Disc plow – implement with individually mounted concave disc blades which cut, \npartially or completely invert soil slices to bury surface material, and pulverize the \nsoil \n \n10. Dryer – machinery device used to lower down or remove available water from the \ncrop through evaporation by the application of heated air \n \n11. Fiber decorticator – mechanical device used for extracting fibers by crushing, \nbeating and scraping actions effected by the rotating cylinder with equally spaced \nblades and breaker or scraper block \n \n12. Grass cutter - a machine or device for cutting grass \n \n13. Hammer mill – device use for grinding which is a result of the impact between the \nparticles and hammers, which are mounted on a shaft rotating along a horizontal \naxis\n\n--- PDF PAGE 92 ---\nTR –Agricultural Machinery Operation NC II Promulgated March 2016 88 \n \n14. Hand tractor/power tiller– self-propelled machine having a single axle designed \nprimarily to pull and propel trailed or mounted agricultural implements and machinery \n \n15. Harvester – machinery device used to gather the useful portion of the crop from the \nfield \n \n16. Irrigation pump – pump device used to lift or transfer water from one source to \nanother \n \n17. Lever-operated knapsack sprayer (LOKS) backpack sprayer – sprayer which is \noperated manually with a lever and can be carried on the back of an operator for \nspraying \n \n18. Multicrop micromill – machine that grinds dried product meal of various crops into \nfiner particles suitable for the purpose of food seasoning or as flour \n \n19. Peanut sheller – machine used to remove kernels from the shell by \nbreaking/splitting the pods \n \n20. Power Sprayer – equipment powered by an electric motor or by an engine used to \nspray fertilizer or pesticide to a certain height \n \n21. Seeder/Planter/Digger– machinery device whether self-propelled or pulled/hitch to \na wheeled vehicle, used to place seeds or plant into the soil for propagation and \nproduction of crops \n \n22. Small engine – internal combustion engines with one or two cylinders of up to 20 \nkW rating used for agricultural purposes \n \n23. Weeder – implement used to remove/destroy the weeds from an agricultural land\n\n--- PDF PAGE 93 ---\nTR –Agricultural Machinery Operation NC II Promulgated March 2016 89",
