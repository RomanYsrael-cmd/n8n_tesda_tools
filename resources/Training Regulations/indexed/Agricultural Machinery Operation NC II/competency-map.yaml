  "source_text": "SECTION 1\nAGRICULTURAL MACHINERY OPERATION NC II QUALIFICATION\n\nThe AGRICULTURAL MACHINERY OPERATION NC II Qualification consists of\ncompetencies that an Agricultural Machinery Operator, Agricultural Tractor\nOperator,\nAgricultural\nPost-harvest\nMachinery\nOperator\nor\nAgricultural\nProduction Machinery Operator must have in order to operate agricultural small\nproduction machinery and equipment, operate agricultural large production machinery\nand equipment and operate agricultural post-production machinery and equipment.\n\nThis Qualification is packaged from the competency map of the Agriculture,\nForestry and Fishery Sector as shown in Annex A.\n\nThe Units of Competency comprising this Qualification include the following:\n\n\n\n\n\nA person who has achieved this Qualification is competent to be:\n\n• Agricultural Machinery Operator\n• Agricultural Tractor Operator\n• Agricultural Post-harvest Machinery Operator\n• Agricultural Production Machinery Operator\n\n\n\n\n\nUNIT CODE\nBASIC COMPETENCIES\n500311105\nParticipate in workplace communication\n500311106\nWork in team environment\n500311107\nPractice career professionalism\n500311108\nPractice occupational health and safety procedures\nUNIT CODE\nCOMMON COMPETENCIES\nAGR321201\nApply Safety Measures in Farm Operations\nAGR321202\nUse Farm Tools and Equipment\nAGR321203\nPerform Estimation and Basic Calculation\nUNIT CODE\nCORE COMPETENCIES\nAFF834367\nOperate agricultural small production machinery and equipment\nAFF834368\nOperate agricultural large production machinery and equipment\nAFF834369\nOperate agricultural post-production machinery and equipment\n\n--- PDF PAGE 6 ---\nTR –Agricultural Machinery Operation NC II Promulgated March 2016 2"
