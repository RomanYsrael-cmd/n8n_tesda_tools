  "source_text": "SECTION 4 \nASSESSMENT AND CERTIFICATION ARRANGEMENT \n \nCompetency Assessment is the process of collecting evidence and making \njudgments whether competency has been achieved. The purpose of assessment is to \nconfirm that an individual can perform to the standards expected at the workplace as \nexpressed in relevant competency standards. \n \nThe assessment process is based on evidence or information gathered to \nprove achievement of competencies. The process may be applied to a full \nqualification or employable unit(s) of competency in partial fulfillment of the \nrequirements of the national qualification. \n \n4.1. \nNATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS \n \n4.1.1 The Full National Qualification of AGRICULTURAL MACHINERY \nOPERATION NC II shall be acquired through the accumulation of \nCertificates of Competency in the following units of competencies: \n \nCOC 1 \nOperate agricultural small production machinery and \nequipment \nCOC 2 \nOperate agricultural large production machinery and \nequipment \nCOC 3 \nOperate \nagricultural \npost-production \nmachinery \nand \nequipment \n \n4.1.2 Upon accumulation and submission of all the above COCs acquired, \nan individual shall be issued the corresponding National Certificate \nsigned by the TESDA Director General. Certificates of Competency \n(COCs) shall be issued to candidates who have been assessed as \ncompetent in any of the above COCs (COC 1, COC 2, COC 3). \n \n4.1.3 Assessment shall focus on the core units of competency. The basic \nand common units shall be integrated or assessed concurrently with \nthe core units. \n \n4.1.4 Recognition of Prior Learning (RPL). Candidates who have gained \ncompetencies through education, informal training, and work or life \nexperiences may apply for recognition in a particular qualification \nthrough competency assessment. \n \n4.1.5 The following are qualified to apply for assessment: \n \n4.1.5.1 \nGraduating students/trainees of WTR-registered programs, \ngraduates of NTR programs or graduates of formal/non-\nformal/informal including enterprise-based training programs \nrelated to agricultural machinery operation\n\n--- PDF PAGE 88 ---\nTR –Agricultural Machinery Operation NC II Promulgated March 2016 84 \n4.1.5.2 \nIndustry workers in agricultural machinery operations \n \n4.1.6 Re-assessment shall focus only on the specific area/s where the \ncandidate has not satisfactorily achieved the required level of \ncompetence AND must be undertaken within two (2) years during the \nperiod of validity of the Training Regulations. \n \n4.1.7 A candidate who fails the assessment for two (2) consecutive times \nshall be advised to go through a refresher course before taking \nanother assessment. \n \n4.2. COMPETENCY ASSESSMENT REQUISITE \n \n4.2.1 Self-Assessment Guide. The self-assessment guide (SAG) is \naccomplished by the candidate prior to actual competency \nassessment. SAG is a pre-assessment tool to help the candidate and \nthe assessor determine what evidence is available, where gaps exist, \nincluding readiness for assessment. \n \nThis document can: \na) Identify the candidate’s skills and knowledge \nb) Highlight gaps in candidate’s skills and knowledge \nc) Provide critical guidance to the assessor and candidate on the \nevidence that need to be presented \nd) Assist the candidate to identify key areas in which practice is \nneeded or additional information or skills that should be gained \nprior to assessment \n \n4.2.2 Accredited \nAssessment \nCenter. \nOnly \nAssessment \nCenter \naccredited by TESDA is authorized to conduct competency \nassessment. Assessment centers undergo a quality assured \nprocedure for accreditation before they are authorized by TESDA to \nmanage the assessment for National Certification. \n \n4.2.3 Accredited Competency Assessor. Only accredited competency \nassessor is authorized to conduct assessment of competence. \nCompetency assessors undergo a quality assured system of \naccreditation procedure before they are authorized by TESDA to \nassess the competencies of candidates for National Certification. \n \n4.2.3.1 \nQualification of Competency Assessors\n\n--- PDF PAGE 89 ---\nTR –Agricultural Machinery Operation NC II Promulgated March 2016 85 \n \nFor Trainer-Assessor \n \n• Holder of National TVET Trainer Certificate Level I (NTTC) on \nAgricultural Machinery Operation NC II \n• Have at least 2 years relevant industry experience \n• Have assisted in the actual conduct of assessment to at least \ntwo (2) candidates. \n \n \nFor Industry Assessor \n \n• Holder of National Certificate on Agricultural Machinery \nOperation NC II \n• Holder of Certificate of Competency (COC) in Conduct \nCompetency Assessment under the Trainers Methodology \nLevel I (TM I) \n• Have at least two (2) years relevant industry experience \n• Have assisted in the actual conduct of assessment to at least \ntwo (2) candidates.\n\n--- PDF PAGE 90 ---\nTR –Agricultural Machinery Operation NC II Promulgated March 2016 86 \nCOMPETENCY MAP FOR AGRICULTURE, FORESTRY AND FISHERY SECTOR \nAGRICULTURAL MACHINERY OPERATION NCII \n \nANNEX A \n \n \nParticipate in \nworkplace \ncommunication\nWork in \nteam \nenvironment \nPractice career \nprofessionalism\nPractice \noccupational \nhealth and \nsafety \nprocedures\n \n \n \n \n \n \n \n \n \n \n \nApply \nSafety \nMeasures in \nFarm \nOperations\nUse Farm \nTools and \nEquipment \nPerform \nEstimation \nand Basic \nCalculation \n \n \n \n \n \n \n \n \n \n \n \n \n \nOperate \nagricultural \nsmall \nproduction \nmachinery \nand \nequipment\nOperate \nagricultural \nlarge \nproduction \nmachinery \nand \nequipment\nOperate \nagricultural \npost-\nproduction \nmachinery \nand \nequipment\n \n \n \n \n \n \n \nBASIC \nCOMPETENCIES \nCOMMON \nCOMPETENCIES \nCORE \nCOMPETENCIES\n\n--- PDF PAGE 91 ---\nTR –Agricultural Machinery Operation NC II Promulgated March 2016 87 \nGLOSSARY OF TERMS \n \n1. 4-Wheel Tractor – wheeled power source having two axles, design to carry work by \npulling or propel various agricultural machines and implements. They are classified \naccording to horsepower rating Agricultural machinery – consists of agricultural \ntractors, self-propelled and pedestrian-operated machines, implements, and other \nequipment primarily used for agricultural operations \n \n2. Attachment – anything that is specifically approved by the manufacturer of farm \nmachinery or farm equipment to be attached to the machinery or equipment in order \nto modify it \n \n3. Coconut coir decorticator – machine to crush matured coconut husk through \nimpact or beating action to separate coco fiber and coconut peat from the husk \n \n4. Coffee pulper – machine to remove and separate the soft pulp of ripe coffee cherry \nwithout making any damage to the parchment coffee \n \n5. Corn husker-sheller – machine used to remove the husk of corn ear, detach, \nseparate and clean the corn kernels from the cobs in one operation \n \n6. Corn sheller – machine used to detach, separate and clean the corn kernels from \nthe cobs \n \n7. Cultivator – field cultivator implement for seedbed preparation, weed eradication, or \nfallow cultivation subsequent to some form of primary tillage, equipped with spring \nsteel shank \n \n8. Disc harrow – implement used to pulverize the soil to attain a better soil tilth for the \nseed germination and growth \n \n9. Disc plow – implement with individually mounted concave disc blades which cut, \npartially or completely invert soil slices to bury surface material, and pulverize the \nsoil \n \n10. Dryer – machinery device used to lower down or remove available water from the \ncrop through evaporation by the application of heated air \n \n11. Fiber decorticator – mechanical device used for extracting fibers by crushing, \nbeating and scraping actions effected by the rotating cylinder with equally spaced \nblades and breaker or scraper block \n \n12. Grass cutter - a machine or device for cutting grass \n \n13. Hammer mill – device use for grinding which is a result of the impact between the \nparticles and hammers, which are mounted on a shaft rotating along a horizontal \naxis\n\n--- PDF PAGE 92 ---\nTR –Agricultural Machinery Operation NC II Promulgated March 2016 88 \n \n14. Hand tractor/power tiller– self-propelled machine having a single axle designed \nprimarily to pull and propel trailed or mounted agricultural implements and machinery \n \n15. Harvester – machinery device used to gather the useful portion of the crop from the \nfield \n \n16. Irrigation pump – pump device used to lift or transfer water from one source to \nanother \n \n17. Lever-operated knapsack sprayer (LOKS) backpack sprayer – sprayer which is \noperated manually with a lever and can be carried on the back of an operator for \nspraying \n \n18. Multicrop micromill – machine that grinds dried product meal of various crops into \nfiner particles suitable for the purpose of food seasoning or as flour \n \n19. Peanut sheller – machine used to remove kernels from the shell by \nbreaking/splitting the pods \n \n20. Power Sprayer – equipment powered by an electric motor or by an engine used to \nspray fertilizer or pesticide to a certain height \n \n21. Seeder/Planter/Digger– machinery device whether self-propelled or pulled/hitch to \na wheeled vehicle, used to place seeds or plant into the soil for propagation and \nproduction of crops \n \n22. Small engine – internal combustion engines with one or two cylinders of up to 20 \nkW rating used for agricultural purposes \n \n23. Weeder – implement used to remove/destroy the weeds from an agricultural land\n\n--- PDF PAGE 93 ---\nTR –Agricultural Machinery Operation NC II Promulgated March 2016 89 \nACKNOWLEDGEMENT \n \nThe Technical Education and Skills Development Authority (TESDA) wishes to \nextend thanks and appreciation to the many representatives of business, industry, \nacademe and government agencies who donated their time and expertise to the \ndevelopment and validation of this Training Regulation. \n \nTHE TECHNICAL EXPERT PANEL (TEP) \n \nENGR. VICTOR A. RODULFO, JR., PhD \nTechnical Expert \nUniversity of the Philippines Los Baños–\nAMDP \nCollege, Laguna \nENGR. MARIFE R. SANTIAGO \nTechnical Expert \nUniversity of the Philippines Los Baños \nCollege, Laguna \n \nMS. ERLINA G. JOSECO \nTechnical Expert \nAgricultural Machinery Manufacturers and \nDistributors Association (AMMDA), Inc. \nMakati City, Metro Manila \nENGR. GEORGE Q. CANAPI \nTechnical Expert \nAgricultural Machinery Manufacturers and \nDistributors Association (AMMDA), Inc. \nMakati City, Metro Manila \nENGR. ALDRIN BADUA \nTechnical Expert \nPhilippine Center for Postharvest \nDevelopment and Mechanization \nScience City of Muñoz, Nueva Ecija \nENGR. FRANCIA MACALINTAL \nTechnical Expert \nPhilippine Council for Agriculture and \nFishery \nDepartment of Agriculture \nQuezon City\n \nTHE PARTICIPANTS OF NATIONAL VALIDATION \n \nMR. DIONISIO M. ABRAJANO \nMember/Operator \nBasinay I-A \nBolante Munoz, Nueva Ecija \nMR. FERDINAND G. RAMOS \nMember/Operator \nSapang Liyang Wet IAPI \nDavid San Jose Tarlac \nMR. JEREMIA M. AÑASCO \nInstructor I \nVisayas State University \nVISCA, Baybay City, Leyte \nMS. JOANN V. RIVERA \nMember/Operator \nSapang Liyang Wet IAPI \nDavid San Jose Tarlac \nENGR. JOHNRICK M. LAQUINTA \nDepartment Head \nWestern Mindanao State University \nWMSU-CA, San Ramon, Zamboanga City \n \n \nMR. EDUARDO O. TOME \nPresident/Operator \nBIAG I-A \nBicos, Rizal, Nueva Ecija\n\n--- PDF PAGE 94 ---\nTR –Agricultural Machinery Operation NC II Promulgated March 2016 90 \nENGR. MARVIN C. PETINGCO \nAssistant Professor/Expert \nCagayan State University \nCarig Sur, Tuguegarao City \nMR. HARVEY V. VALDEZ \nScience Research Specialist I/Expert \nPhilippine Rice Research Institute \nMaligaya, Muñoz, Nueva Ecija \n \nThe Members of the TESDA Board and Secretariat \n \nThe MANAGEM