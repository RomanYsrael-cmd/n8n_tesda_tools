      "text": "1 The Full National Qualification of AGRICULTURAL MACHINERY OPERATION NC II shall be acquired through the accumulation of Certificates of Competency in the following units of competencies: COC 1 Operate agricultural small production machinery and equipment COC 2 Operate agricultural large production machinery and equipment COC 3 Operate agricultural post-production machinery and equipment"
    },
    {
      "number": "4.1",
