  "source_text": "SECTION 4\nASSESSMENT AND CERTIFICATION ARRANGEMENT\n\nCompetency Assessment is the process of collecting evidence and making\njudgments whether competency has been achieved. The purpose of assessment is to\nconfirm that an individual can perform to the standards expected at the workplace as\nexpressed in relevant competency standards.\n\nThe assessment process is based on evidence or information gathered to\nprove achievement of competencies. The process may be applied to a full\nqualification or employable unit(s) of competency in partial fulfillment of the\nrequirements of the national qualification.\n\n4.1.\nNATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1.1 The Full National Qualification of AGRICULTURAL MACHINERY\nOPERATION NC II shall be acquired through the accumulation of\nCertificates of Competency in the following units of competencies:\n\nCOC 1\nOperate agricultural small production machinery and\nequipment\nCOC 2\nOperate agricultural large production machinery and\nequipment\nCOC 3\nOperate\nagricultural\npost-production\nmachinery\nand\nequipment\n\n4.1.2 Upon accumulation and submission of all the above COCs acquired,\nan individual shall be issued the corresponding National Certificate\nsigned by the TESDA Director General. Certificates of Competency\n(COCs) shall be issued to candidates who have been assessed as\ncompetent in any of the above COCs (COC 1, COC 2, COC 3).\n\n4.1.3 Assessment shall focus on the core units of competency. The basic\nand common units shall be integrated or assessed concurrently with\nthe core units.\n\n4.1.4 Recognition of Prior Learning (RPL). Candidates who have gained\ncompetencies through education, informal training, and work or life\nexperiences may apply for recognition in a particular qualification\nthrough competency assessment.\n\n4.1.5 The following are qualified to apply for assessment:\n\n4.1.5.1\nGraduating students/trainees of WTR-registered programs,\ngraduates of NTR programs or graduates of formal/non-\nformal/informal including enterprise-based training programs\nrelated to agricultural machinery operation\n\n--- PDF PAGE 88 ---\nTR –Agricultural Machinery Operation NC II Promulgated March 2016 84\n4.1.5.2\nIndustry workers in agricultural machinery operations\n\n4.1.6 Re-assessment shall focus only on the specific area/s where the\ncandidate has not satisfactorily achieved the required level of\ncompetence AND must be undertaken within two (2) years during the\nperiod of validity of the Training Regulations.\n\n4.1.7 A candidate who fails the assessment for two (2) consecutive times\nshall be advised to go through a refresher course before taking\nanother assessment.\n\n4.2. COMPETENCY ASSESSMENT REQUISITE\n\n4.2.1 Self-Assessment Guide. The self-assessment guide (SAG) is\naccomplished by the candidate prior to actual competency\nassessment. SAG is a pre-assessment tool to help the candidate and\nthe assessor determine what evidence is available, where gaps exist,\nincluding readiness for assessment.\n\nThis document can:\na) Identify the candidate’s skills and knowledge\nb) Highlight gaps in candidate’s skills and knowledge\nc) Provide critical guidance to the assessor and candidate on the\nevidence that need to be presented\nd) Assist the candidate to identify key areas in which practice is\nneeded or additional information or skills that should be gained\nprior to assessment\n\n4.2.2 Accredited\nAssessment\nCenter.\nOnly\nAssessment\nCenter\naccredited by TESDA is authorized to conduct competency\nassessment. Assessment centers undergo a quality assured\nprocedure for accreditation before they are authorized by TESDA to\nmanage the assessment for National Certification.\n\n4.2.3 Accredited Competency Assessor. Only accredited competency\nassessor is authorized to conduct assessment of competence.\nCompetency assessors undergo a quality assured system of\naccreditation procedure before they are authorized by TESDA to\nassess the competencies of candidates for National Certification.\n\n4.2.3.1\nQualification of Competency Assessors\n\n--- PDF PAGE 89 ---\nTR –Agricultural Machinery Operation NC II Promulgated March 2016 85\n\nFor Trainer-Assessor\n\n• Holder of National TVET Trainer Certificate Level I (NTTC) on\nAgricultural Machinery Operation NC II\n• Have at least 2 years relevant industry experience\n• Have assisted in the actual conduct of assessment to at least\ntwo (2) candidates.\n\n\nFor Industry Assessor\n\n• Holder of National Certificate on Agricultural Machinery\nOperation NC II\n• Holder of Certificate of Competency (COC) in Conduct\nCompetency Assessment under the Trainers Methodology\nLevel I (TM I)\n• Have at least two (2) years relevant industry experience\n• Have assisted in the actual conduct of assessment to at least\ntwo (2) candidates.\n\n--- PDF PAGE 90 ---\nTR –Agricultural Machinery Operation NC II Promulgated March 2016 86\n"
