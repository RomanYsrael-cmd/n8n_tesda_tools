      "number": "4.1",
      "text": "NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS 4.1.1 The Full National Qualification of AGRICULTURAL MACHINERY OPERATION NC II shall be acquired through the accumulation of Certificates of Competency in the following units of competencies: COC 1 Operate agricultural small production machinery and equipment COC 2 Operate agricultural large production machinery and equipment COC 3 Operate agricultural post-production machinery and equipment 4.1.2 Upon accumulation and submission of all the above COCs acquired, an individual shall be issued the corresponding National Certificate signed by the TESDA Director General. Certificates of Competency (COCs) shall be issued to candidates who have been assessed as competent in any of the above COCs (COC 1, COC 2, COC 3). 4.1.3 Assessment shall focus on the core units of competency. The basic and common units shall be integrated or assessed concurrently with the core units. 4.1.4 Recognition of Prior Learning (RPL). Candidates who have gained competencies through education, informal training, and work or life experiences may apply for recognition in a particular qualification through competency assessment. 4.1.5 The following are qualified to apply for assessment: 4.1.5.1 Graduating students/trainees of WTR-registered programs, graduates of NTR programs or graduates of formal/non- formal/informal including enterprise-based training programs related to agricultural machinery operation 4.1.5.2 Industry workers in agricultural machinery operations 4.1.6 Re-assessment shall focus only on the specific area/s where the candidate has not satisfactorily achieved the required level of competence AND must be undertaken within two (2) years during the period of validity of the Training Regulations. 4.1.7 A candidate who fails the assessment for two (2) consecutive times shall be advised to go through a refresher course before taking another assessment."
