          "source_text": "1. \nCritical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1 \nInspected field/area \n1.2 \nSelected agricultural machineries \n1.3 \nPrepared hand tractor \n1.4 \nPrepared agricultural machines powered by more \nthan 20kW power rating \n1.5 \nOperated agricultural machineries powered by more \nthan 20kW power rating \n1.6 \nUsed proper field pattern for optimum efficiency \n1.7 \nOperated and shut down machines \n1.8 \nOperated machine at optimum efficiency \n1.9 \nPerformed post-operation activities \n1.10 Cleaned and stored machine and engine \n1.11 Cleaned and maintained work area \n1.12 Prepared record of operation \n1.13 Observed OHS procedures \n1.14 Performed basic preventive maintenance activities \n2. \nResource implications \nThe following resources MUST be provided: \n2.1 \nField/Area \n2.2 \nMachines and implements \n2.3 \nManufacturer’s manual \n2.4 \nSupplies and materials \n3. \nMethods of assessment \nCompetency may be assessed through: \n3.1 \nDirect observation/Demonstration with Oral \nQuestioning \n3.2 \nPortfolio \n4. \nContext for Assessment \n4.1 \nCompetency maybe assessed in actual workplace or \nat the designated TESDA Accredited Assessment \nCenter.\n\n--- PDF PAGE 45 ---\nTR –Agricultural Machinery Operation NC II Promulgated March 2016 41 \nUNIT OF COMPETENCY : \nOPERATE AGRICULTURAL POST-PRODUCTION \n \n \nMACHINERY AND EQUIPMENT \n \nUNIT CODE \n:",
