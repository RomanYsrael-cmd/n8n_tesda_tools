        "evidence_guide": {
          "source_text": "1. \nCritical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1 \nSelected agricultural machineries powered by small \nengines \n1.2 \nPrepared agricultural machineries powered by small \nengines for operations \n1.3 \nOperated agricultural machineries powered by small \nengines \n1.4\nPerformed post-operation activities\n2. \nResource Implications \nThe following resources MUST be provided: \n2.1 \nField/Area \n2.2 \nMachines and implements \n2.3 \nManufacturer’s manual \n2.4\nSupplies and materials\n3. \nMethod of Assessment \nCompetency may be assessed through: \n3.1 \nDirect observation \n3.2 \nDemonstration with Oral Questioning \n3.3\nPortfolio\n4. \nContext for Assessment \n4.1 \nCompetency maybe assessed in actual workplace or \nat the designated TESDA Accredited Assessment \nCenter.\n\n--- PDF PAGE 39 ---\nTR –Agricultural Machinery Operation NC II Promulgated March 2016 35 \nUNIT OF COMPETENCY : \nOPERATE AGRICULTURAL LARGE PRODUCTION \n \n \n \nMACHINERY AND EQUIPMENT \n \nUNIT CODE \n:",
