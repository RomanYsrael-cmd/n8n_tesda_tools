        "source_text": "--- PDF PAGE 6 ---\nTR –Agricultural Machinery Operation NC II               Promulgated March 2016                                    2 \nSECTION 2 COMPETENCY STANDARDS \n \n \nThis section gives the details of the contents of the units of competency required \nin AGRICULTURAL MACHINERY OPERATION NC II. \n \n \nBASIC COMPETENCIES \n \nUNIT OF COMPETENCY : \nPARTICIPATE IN WORKPLACE COMMUNICATION \n \nUNIT CODE \n: \n500311105 \n \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge, skills and attitudes   \nrequired to gather, interpret and convey information in \nresponse to workplace requirements. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1.  Obtain and \nconvey \nworkplace \ninformation \n1.1  Specific and  \nrelevant information \nis accessed from \nappropriate \nsources  \n1.2  Effective \nquestioning,  active \nlistening and \nspeaking skills are \nused to gather and \nconvey information \n1.3  Appropriate \nmedium is used to \ntransfer information \nand ideas \n1.4  Appropriate non- \nverbal \ncommunication is \nused \n1.5  Appropriate lines of \ncommunication with \nsupervisors and \ncolleagues are \nidentified and \nfollowed \n1.6  Defined workplace \nprocedures for the \nlocation and \n1.1 Effective \ncommunication \n1.2 Different \nmodes of \ncommunication \n1.3 Written \ncommunication \n1.4 Organizational \npolicies \n1.5 Communication \nprocedures and \nsystems \n1.6 Technology \nrelevant to the \nenterprise and \nthe individual’s \nwork \nresponsibilities  \n1.1 Follow simple \nspoken \nlanguage \n1.2 Perform routine \nworkplace \nduties following \nsimple written \nnotices \n1.3 Participate in \nworkplace \nmeetings and \ndiscussions \n1.4 Complete work \nrelated \ndocuments \n1.5 Estimate, \ncalculate and \nrecord routine \nworkplace \nmeasures \n1.6 Ability to relate \nto people of \nsocial range in \nthe workplace \n1.7 