        "source_text": "AFF834368 \n \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge, skills and attitudes required \nto operate agricultural production machinery and equipment \nwith more than 20kW power rating. This also includes to \nselect agricultural large production machineries, prepare \nagricultural machineries for operations, operate agricultural \nmachineries and perform post-operation activities. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Select \nagricultural \nlarge \nproduction \nmachineries \n1.1 Field is assessed as \nper established \npractice \n1.2 Land condition is \ndetermined based on \nindustry standard \n1.3 Crop condition is \nevaluated based on \nindustry standard \n1.4 Agricultural \nmachinery is \nidentified based on \nassessment result \n1.1. Knowledge, Theory, \nPractices and Systems \nOperations \n1.1.1 Field assessment \nprocedures \n1.1.2 Different land \nconditions \n1.1.3 Different crop \nconditions \n1.1.4 Different \nagricultural \nmachineries \npowered by more \nthan 20kW rating \n1.1.5 Compatibility of \nengine and hand \ntractor \n1.2. Communication \n1.2.1 Preparation of \nreport\n1.1 Assessing field \nsituation \n1.2 Determining land \ncondition \n1.3 Evaluating crop \ncondition \n1.4 Identifying agricultural \nmachineries powered \nby 20kW rating \n1.5 Preparing \nassessment report \n2. Prepare \nagricultural \nmachineries \nfor \noperations \n2.1 Agricultural \nmachineries are \nchecked and adjusted \nin following \nmanufacturer \noperator’s manual \n2.2 Agricultural \nmachineries are \nloaded and unloaded \non carrier in \naccordance with \nmanufacturer \noperator’s manual \n2.3 Tools and materials \nare prepared based \n2.1 Knowledge, Theory, \nPractices and Systems \nOperations \n2.1.1 Nomenclature of \nengine and \nmachines \n2.1.2 Procedures of \nchecking and \nadjusting \nmachineries \n2.1.3 Attachments \nadjustments \n- Implements \nadjustment \n-\nAccessories and \n2.1 Checking and \nadjusting the \nmachineries \n2.1.1 Performing \nstandard \noperating \nprocedure of \nequipment \n2.1.2 Using \nappropriate fuel \nand lubrication \nrequirements \n2.2 Reading and \ninterpreting manual/ \nmanufacturer’s\n\n--- PDF PAGE 40 ---\nTR –Agricultural Machinery Operation NC II Promulgated March 2016 36 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \non work requirements \n2.4 Attachments are \nchecked and adjusted \nin accordance with \nmanufacturer’s \nmanual \n2.5 Resources are made \navailable to meet the \nwork requirements \ncomponents \nadjustment \n2.1.4 Loading and \nunloading \nprocedures of \nagricultural \nmachinery \n2.1.5 Transport of \nagricultural \nmachineries \n2.1.6 Preparation of \ndifferent tools, \nmaterials and \nresources \n2.2. Communication \n2.2.1 Interpretation of \nmanufacturer’s \nmanual \n2.3. Safety practices \n2.3.1 Driving safety \nprocedures \n2.4. Code \n2.4.1 Driving rules and \nregulations \n2.5. Tools, materials and \nequipment \n2.5.1 Uses and \nfunctions of tools \nand materials\nspecifications, work \nand maintenance \nplans \n2.3 Preparing tools \nmaterials and other \nresources \n2.4 Checking and \nadjusting of \nattachments \n2.5 Driving skills during \nloading and unloading \nof agricultural \nmachineries \n3. Operate \nagricultural \nmachineries \n3.1 Personal Protective \nEquipment are worn \nper work requirement \n3.2 Machine is operated \naccording to \noperator’s manual. \n3.3 Malfunctions are \nidentified and \ncorrected in \naccordance with the \nstandard operating \nprocedures \n3.4 Performances are \nassessed according \nto set standards or \nclient’s specification \n3.5 Machine is shutdown \naccording to standard \npractices\n3.1. Knowledge, Theory, \nPractices and Systems \nOperations \n3.1.1 Defensive-driving \n3.2. Safety Practices \n3.2.1 Environmental \nprotection and \nconcerns \n3.2.2 Good grooming \nand personal \nhygiene \n3.2.3 Occupational \nSafety and Health \nStandards \n3.2.4 Guidelines: \n- 5S of Good \nHousekeeping \n- 3R applications \n3.3. Values \n3.1 Applying defensive-\ndriving \n3.2 Demonstrating safe \nand environmentally \nresponsible workplace \npractices \n3.3 Appropriate/ proper \nwearing of PPEs \n3.4 Performing safety \npractices and safe \noperation \n3.5 Assessing \nperformances of \noperation \n3.6 Shutting down of \nmachine\n\n--- PDF PAGE 41 ---\nTR –Agricultural Machinery Operation NC II Promulgated March 2016 37 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n3.3.1 Dedication to work \n3.3.2 Resourcefulness \n3.3.3 Sense of quality \nand open-\nmindedness\n4. Perform post-\noperation \nactivities \n4.1 Wastes are managed \naccording to \nenvironmental \nregulations \n4.2 Machine and engine \nare cleaned and \nchecked prior to \nstorage \n4.3 Work area is cleaned \nand maintained \naccording to OHS \nand enterprise \nrequirements. \n4.4 Records of \ninformation are \nprepared in \nappropriate format \n4.5 Basic preventive \nmaintenance is \nperformed according \nto manufacturer’s \ninstructions and/or \nstandard practices \n4.1. Safety Practices \n4.1.1 Wastes \nmanagement \n4.2. Materials, Tools and \nEquipment: Uses, \nSpecifications and \nMaintenance \n4.2.1 Maintaining the \nvarious equipment, \ntools and utensils \n4.2.2 Procedures in \ncleaning and \nchecking machine \nand engine \n4.3. Codes: \n4.3.1 OSHS \n4.3.2 Waste \nManagement Act \n4.4. Values \n4.4.1 Patience \n4.4.2 Perseverance \n4.4.3 Environmentally \nconscious\n4.1 Managing wastes \n4.2 Cleaning and checking \nof machine and engine\n4.3 Cleaning and \nmaintaining work area \n4.4 Preparing records \n4.5 Performing preventive \nmaintenance \n4.6 Computation and \ncommunication skills \n4.7 Troubleshooting\n\n--- PDF PAGE 42 ---\nTR –Agricultural Machinery Operation NC II Promulgated March 2016 38 \nRANGE OF VARIABLES \n \n \nVARIABLE\nRANGE\n1. Land Condition \nLand Condition includes: \n1.1 \nLow land \n1.2\nHigh land\n2. Crop condition \nCrop condition includes: \n2.1 \nPest incidence \n2.2 \nWater shortage \n2.3\nNutrient shortage\n3. Agricultural \nMachineries \nAgricultural Machines with more than 20kW power rating: \n3.1 \n4-Wheel tractor \n3.2 \nIrrigation pump \n3.3 \nGrass cutter \n3.4\nPower sprayer\n4. Tools and \nmaterials \nTools and materials may include but are not limited to:\n4.1 \nWrenches \n4.2 \nHammer \n4.3 \nFuel/Oil \n4.4 \nGrease gun \n4.5 \nSeeds \n4.6 \nSacks (for seeds and waste) \n4.7 \nMeasuring can \n4.8 \nSeedlings \n4.9 \nTray \n4.10 Teflon tape \n4.11 Fertilizer \n4.12 Chemicals \n4.13 Screw drivers \n4.14 Sacks \n4.15 Air compressor \n4.16 Broomstick and dustpan* \n4.17 Rags* \n4.18 Pressurized water sprayer* \n*For cleaning purposes\n5. Attachments \nAttachments may include but are not limited to: \n5.1 \nImplements: \n5.1.1 \nMoldboard/disc plow \n5.1.2 \nHarrow \n5.1.3 \nTrailer (for transport of implements of hand tractor) \n5.1.4 \nRotavator \n5.1.5 \nLeveller \n5.1.6 \nSeeder/planter/Digger \n5.1.7 \nWeeder/Cultivator \n5.2 \nAccessories: \n5.2.1 \nGuide stick \n5.2.2 \nFloater \n5.2.3 \nFurrow opener and closer \n5.2.4 \nPressure gauge \n5.2.5 \nPipe connector \n5.2.6 \nLance \n5.2.7 \nNozzle \n5.2.8\nHose\n6. Resources \nResources \n6.1 \nWater source \n6.2\nRequired field\n\n--- PDF PAGE 43 ---\nTR –Agricultural Machinery Operation NC II Promulgated March 2016 39 \nVARIABLE\nRANGE\n7. Personal \nProtective \nEquipment \nPersonal Protective Equipment \n7.1 \nBoots \n7.2 \nDust Mask \n7.3 \nGloves \n7.4 \nEar muff \n7.5\nProtective cap\n8. Malfunctions \nMalfunctions may include but is not limited to: \n8.1 \nErratic engine speed \n8.2 \nBelt slippage \n8.3 \nUnplowed field/area \n8.4 \nNo water discharged \n8.5\nPesticide leak\n9. Performances \nPerformances may include but are not limited to: \n9.1 \nEven seeding rate \n9.2 \nStraight row planting \n9.3 \nUniform transplanted seedlings \n9.4 \nAcceptable field efficiency \n9.5 \nDischarge capacity \n9.6 \nEfficiency of machines \n9.7\nCapacity of machines\n10. Waste \nWaste may include but are not limited to: \n10.1 Excess seeds after operation \n10.2 Sacks \n10.3 Remaining seedlings after operation \n10.4 Pesticide bottle \n10.5 Used Teflon seals \n10.6 Used fertilizer \n10.7 Container/sacks\n11. Records of \ninformation \nRecords of information \n11.1 Machine failure \n11.2 Fuel consumption \n11.3 Area operated \n11.4 Hours of operation \n11.5 Manpower requirements \n11.6 Date of operation\n12. Basic preventive \nmaintenance \nBasic preventive maintenance may include but are not limited to: \n12.1 Dismantling and assembling procedures \n12.2 Safety and pre-start checks \n12.3 Testing \n12.4 Tightening \n12.5 Minor adjustments and repairs (e.g. belt tension/ pulley \nalignment, engine speed) \n12.6 Routine servicing procedures (e.g. cleaning, lubricating, priming \npumps, cleaning filters, checks of cooling systems, fuel, grease \nand oil, battery levels)\n\n--- PDF PAGE 44 ---\nTR –Agricultural Machinery Operation NC II Promulgated March 2016 40 \n \nEVIDENCE GUIDE \n \n \n1. \nCritical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1 \nInspected field/area \n1.2 \nSelected agricultural machineries \n1.3 \nPrepared hand tractor \n1.4 \nPrepared agricultural machines powered by more \nthan 20kW power rating \n1.5 \nOperated agricultural machineries powered by more \nthan 20kW power rating \n1.6 \nUsed proper field pattern for optimum efficiency \n1.7 \nOperated and shut down machines \n1.8 \nOperated machine at optimum efficiency \n1.9 \nPerformed post-operation activities \n1.10 Cleaned and stored machine and engine \n1.11 Cleaned and maintained work area \n1.12 Prepared record of operation \n1.13 Observed OHS procedures \n1.14 Performed basic preventive maintenance activities \n2. \nResource implications \nThe following resources MUST be provided: \n2.1 \nField/Area \n2.2 \nMachines and implements \n2.3 \nManufacturer’s manual \n2.4 \nSupplies and materials \n3. \nMethods of assessment \nCompetency may be assessed through: \n3.1 \nDirect observation/Demonstration with Oral \nQuestioning \n3.2 \nPortfolio \n4. \nContext for Assessment \n4.1 \nCompetency maybe assessed in actual workplace or \nat the designated TESDA Accredited Assessment \nCenter.\n\n--- PDF PAGE 45 ---\nTR –Agricultural Machinery Operation NC II Promulgated March 2016 41 \nUNIT OF COMPETENCY : \nOPERATE AGRICULTURAL POST-PRODUCTION \n \n \nMACHINERY AND EQUIPMENT \n \nUNIT CODE \n:"
