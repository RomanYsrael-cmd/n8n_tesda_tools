        "source_text": "--- PDF PAGE 14 ---\nTR –Agricultural Machinery Operation NC II               Promulgated March 2016                                    10 \nUNIT OF COMPETENCY : \nPRACTICE CAREER PROFESSIONALISM \n \nUNIT CODE \n: \n500311107 \n \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge, skills and attitudes in \npromoting career growth and advancement. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1.  Integrate \npersonal \nobjectives \nwith \norganizationa\nl goals \n1.1  Personal growth and \nwork plans are \npursued towards \nimproving the \nqualifications set for \nthe profession \n1.2  Intra- and \ninterpersonal \nrelationships are \nmaintained in the \ncourse of managing \noneself based on \nperformance \nevaluation \n1.3  Commitment to the \norganization and its \ngoal is demonstrated \nin the performance of \nduties \n1.1 Work values and \nethics (Code of \nConduct, Code \nof Ethics, etc.) \n1.2 Company \npolicies \n1.3 Company \noperations, \nprocedures and \nstandards  \n1.4 Fundamental \nrights at work \nincluding gender \nsensitivity \n1.5 Personal \nhygiene \npractices \n1.1 Appropriate \npractice of \npersonal hygiene \n1.2 Intra and \nInterpersonal \nskills \n1.3 Communication \nskills \n2.  Set and meet \nwork \npriorities \n2.1  Competing demands \nare prioritized to \nachieve personal, \nteam and \norganizational goals \nand objectives. \n2.2  Resources are \nutilized efficiently and \neffectively to manage \nwork priorities and \ncommitments \n2.3  Practices along \neconomic use and \nmaintenance of \nequipment and \nfacilities are followed  \nas per established \nprocedures \n2.1 Work values and \nethics (Code of \nConduct, Code \nof Ethics, etc.) \n2.2 Company  \npolicies \n2.3 Company \noperations, \nprocedures and \nstandards  \n2.4 Fundamental \nrights at work \nincluding gender \nsensitivity \n2.5 Personal \nhygiene \npractices \n2.6 Time \nmanagement\n2.1 Appropriate \npractice of \npersonal hygiene \n2.2 Intra and \nInterpersonal \nskills \n2.3 Communication \nskills \n2.4 Managing goals \nand time\n\n--- PDF PAGE 15 ---\nTR –Agricultural Machinery Operation NC II               Promulgated March 2016                                    11 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n3.  Maintain \nprofessional \ngrowth and \ndevelopment \n3.1  Trainings and \ncareer opportunities \nare identified and \navailed of based on \njob requirements \n3.2  Recognitions are \nsought/received and \ndemonstrated as \nproof of career \nadvancement \n3.3  Licenses and/or \ncertifications \nrelevant to job and \ncareer are obtained \nand renewed \n3.1 Work values and \nethics (Code of \nConduct, Code \nof Ethics, etc.) \n3.2 Company  \npolicies \n3.3 Company \noperations, \nprocedures and \nstandards  \n3.4 Fundamental \nrights at work \nincluding gender \nsensitivity \n3.5 Personal \nhygiene \npractices\n3.1 Appropriate \npractice of \npersonal hygiene \n3.2 Intra and \nInterpersonal \nskills \n3.3 Communication \nskills\n\n--- PDF PAGE 16 ---\nTR –Agricultural Machinery Operation NC II               Promulgated March 2016                                    12 \nRANGE OF VARIABLES \n \n \nVARIABLE \nRANGE \n1. Evaluation \nMay include: \n1.1 \nPerformance Appraisal \n1.2 \nPsychological Profile \n1.3 \nAptitude Tests \n2. Resources \nMay include: \n2.1 \nHuman \n2.2 \nFinancial \n2.3 \nTechnology \n2.3.1 \nHardware \n2.3.2 \nSoftware \n3. Trainings and career \nopportunities \nMay include: \n3.1 \nParticipation in training programs \n3.1.1 \nTechnical \n3.1.2 \nSupervisory \n3.1.3 \nManagerial \n3.1.4 \nContinuing Education \n3.2 \nServing as Resource Persons in conferences and \nworkshops \n4. Recognitions \nMay include: \n4.1 \nRecommendations \n4.2 \nCitations \n4.3 \nCertificate of Appreciations \n4.4 \nCommendations \n4.5 \nAwards \n4.6 \nTangible and Intangible Rewards \n5. Licenses and/or \ncertifications \nMay include: \n5.1 \nNational Certificates \n5.2 \nCertificate of Competency \n5.3 \nSupport Level Licenses \n5.4 \nProfessional Licenses\n\n--- PDF PAGE 17 ---\nTR –Agricultural Machinery Operation NC II               Promulgated March 2016                                    13 \nEVIDENCE GUIDE \n \n \n1. \nCritical aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 \nAttained job targets within key result areas (KRAs) \n1.2 \nMaintained intra - and interpersonal relationship in the \ncourse of managing oneself based on performance \nevaluation \n1.3 \nCompleted trainings and career opportunities which \nare based on the requirements of the industries \n1.4 \nAcquired and maintained licenses and/or certifications \naccording to the requirement of the qualification \n2. \nResource Implications \nThe following resources should be provided: \n2.1 \nWorkplace or assessment location \n2.2 \nCase studies/scenarios \n3. \nMethods of Assessment \nCompetency in this unit may be assessed through: \n3.1 \nPortfolio Assessment \n3.2 \nInterview \n3.3 \nSimulation/Role-plays \n3.4 \nObservation \n3.5 \nThird Party Reports \n3.6 \nExams and Tests \n4. \nContext for Assessment \nCompetency may be assessed in the work place or in a \nsimulated work place setting\n",
