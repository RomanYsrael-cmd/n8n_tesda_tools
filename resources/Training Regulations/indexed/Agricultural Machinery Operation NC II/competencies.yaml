hinery Operation NC II Promulgated March 2016 4 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n3.2 Workplace data is \nrecorded on \nstandard workplace \nforms and \ndocuments \n3.3 Basic mathematical \nprocesses are used \nfor routine \ncalculations \n3.4 Errors in recording \ninformation on \nforms/ documents \nare identified and \nproperly acted upon\n3.5 Reporting \nrequirements to \nsupervisor are \ncompleted \naccording to \norganizational \nguidelines\n3.4 Organizational \npolicies \n3.5 Communication \nprocedures and \nsystems \n3.6 Technology \nrelevant to the \nenterprise and \nthe individual’s \nwork \nresponsibilities \nsubtraction, \ndivision and \nmultiplication \n3.3 Gather and \nprovide \ninformation in \nresponse to \nworkplace \nrequirements\n\n--- PDF PAGE 9 ---\nTR –Agricultural Machinery Operation NC II Promulgated March 2016 5 \nRANGE OF VARIABLES \n \n \nVARIABLE \nRANGE \n1. Appropriate sources \nMay include: \n1.1. Team members \n1.2. Suppliers \n1.3. Trade personnel \n1.4. Local government \n1.5.\nIndustry bodies\n2. Medium \nMay include: \n2.1. Memorandum \n2.2. Circular \n2.3. Notice \n2.4. Information discussion \n2.5. Follow-up or verbal instructions \n2.6.\nFace to face communication\n3. Storage \nMay include: \n3.1. Manual filing system \n3.2.\nComputer-based filing system\n4. Forms \nMay include: \n4.1 \nPersonnel forms \n4.2 \nTelephone message forms \n4.3\nSafety reports\n5. Workplace interactions \nMay include: \n5.1. Face to face \n5.2. Telephone \n5.3. Electronic and two way radio \n5.4. Written including electronic, memos, instruction and \nforms, non-verbal including gestures, signals, signs \nand diagrams\n6. Protocols \nMay include: \n6.1. Observing meeting \n6.2. Compliance with meeting decisions \n6.3.\nObeying meeting instructions\n\n--- PDF PAGE 10 ---\nTR –Agricultural Machinery Operation NC II Promulgated March 2016 6 \nEVIDENCE GUIDE \n \n \n1. \nCritical aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 \nPrepared written communication following standard \nformat of the organization \n1.2 \nAccessed information using communication \nequipment \n1.3 \nMade use of relevant terms as an aid to transfer \ninformation effectively \n1.4 \nConveyed information effectively adopting the formal \nor informal communication\n2. \nResource Implications \nThe following resources should be provided: \n2.1 \nFax machine \n2.2 \nTelephone \n2.3 \nWriting materials \n2.4\nInternet\n3. \nMethods of Assessment \nCompetency in this unit may be assessed through: \n3.1 \nDirect Observation \n3.2\nOral interview and written test\n4. \nContext for Assessment \nCompetency may be assessed individually in the actual \nworkplace or through accredited institution\n\n--- PDF PAGE 11 ---\nTR –Agricultural Machinery Operation NC II Promulgated March 2016 7 \nUNIT OF COMPETENCY : \nWORK IN TEAM ENVIRONMENT \n \nUNIT CODE \n: \n500311106 \n \nUNIT DESCRIPTOR \n: \nThis unit covers the skills, knowledge and attitudes to \nidentify role and responsibility as a member of a team. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Describe \nteam role \nand scope \n1.1 The role and \nobjective of the \nteam is identified \nfrom available \nsources of \ninformation \n1.2 Team parameters, \nreporting \nrelationships and \nresponsibilities are \nidentified from team \ndiscussions and \nappropriate external \nsources\n1.1 Communication \nprocess \n1.2 Team structure \n1.3 Team roles \n1.4 Group planning \nand decision \nmaking \n1.1 Communicate \nappropriately, \nconsistent with \nthe culture of the \nworkplace \n2. Identify own \nrole and \nresponsibility \nwithin team \n2.1 Individual role and \nresponsibilities within \nthe team environment \nare identified \n2.2 Roles and \nresponsibility of other \nteam members are \nidentified and \nrecognized \n2.3 Reporting \nrelationships within \nteam and external to \nteam are identified\n2.1 Communication \nprocess \n2.2 Team structure \n2.3 Team roles \n2.4 Group planning \nand decision \nmaking \n2.1 Communicate \nappropriately, \nconsistent with \nthe culture of the \nworkplace \n3. Work as a \nteam \nmember \n3.1 Effective and \nappropriate forms of \ncommunications used \nand interactions \nundertaken with team \nmembers who \ncontribute to known \nteam activities and \nobjectives \n3.2 Effective and \nappropriate \ncontributions made to \ncomplement team \n3.1 Communication \nprocess \n3.2 Team structure \n3.3 Team roles \n3.4 Group planning \nand decision \nmaking \n3.1 Communicate \nappropriately, \nconsistent with \nthe culture of the \nworkplace \n3.2 Interacting \neffectively with \nothers\n\n--- PDF PAGE 12 ---\nTR –Agricultural Machinery Operation NC II Promulgated March 2016 8 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \nactivities and \nobjectives, based on \nindividual skills and \ncompetencies and \nworkplace context \n3.3 Observed protocols in \nreporting using \nstandard operating \nprocedures \n3.4 Contribute to the \ndevelopment of team \nwork plans based on \nan understanding of \nteam’s role and \nobjectives and \nindividual \ncompetencies of the \nmembers\n \n \nRANGE OF VARIABLES \n \n \nVARIABLE \nRANGE \n1. Role and \nobjective of team \nMay include: \n1.1. Work activities in a team environment with enterprise or specific sector \n1.2. Limited discretion, initiative and judgment maybe demonstrated on the \njob, either individually or in a team environment\n2. Sources of \ninformation \nMay include: \n2.1. Standard operating and/or other workplace procedures \n2.2. Job procedures \n2.3. Machine/equipment manufacturer’s specifications and instructions \n2.4. Organizational or external personnel \