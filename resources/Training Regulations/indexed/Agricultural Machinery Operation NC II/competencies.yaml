        "source_text": "AFF834367 \n \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge, skills and attitudes \nrequired to operate agricultural production machinery and \nequipment powered by small engines. This also includes \nto select of agricultural small production machineries, \nprepare agricultural machineries for operations, operate \nagricultural machineries and perform post-operation \nactivities. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Select \nagricultural \nsmall \nproduction \nmachineries \n1.1 Field is assessed as \nper established \npractice \n1.2 Land condition is \ndetermined based on \nindustry standard \n1.3 Crop condition is \nevaluated based on \nindustry standard \n1.4 Agricultural \nmachineries are \nidentified based on \nassessment result \n1.1. Knowledge, \nTheory, Practices \nand Systems \nOperations \n1.1.1 Assessment results \n1.1.2 Procedures of field \nassessment \n1.1.3 Different land \nconditions \n1.1.4 Different crop \nconditions \n1.1.5 Compatibility of \nengine and hand \ntractor \n1.1.6 Different agricultural \nmachineries \npowered by small \nengines \n1.2. Communication \n1.2.1 Preparation of \nassessment report \n1.3. Values \n1.3.1 Dedication to work \nand resourcefulness \n1.3.2 Sense of quality and \nopen-mindedness \n1.3.3 Patience, \nPerseverance and \nEnvironmentally \nconscious \n1.1 Assessing land \nand crop \nconditions \n1.2 Determining and \nselecting \nagricultural \nmachineries \nbased on land \nand crop \nconditions \n1.3 Preparing \nassessment \nreport\n\n--- PDF PAGE 33 ---\nTR –Agricultural Machinery Operation NC II Promulgated March 2016 29 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n2. Prepare \nagricultural \nmachineries \nfor \noperations \n2.1 Agricultural \nmachineries are \nchecked and adjusted \nin accordance with \njob requirements \n2.2 Tools and materials \nare prepared \naccording to work \nrequirements \n2.3 Attachments are \nchecked and adjusted \nfollowing \nmanufacturer’s \nmanual \n2.4 Resources are \nreadied to meet the \nwork requirements \n2.1. Knowledge, \nTheory, Practices \nand Systems \nOperations \n2.1.1 Procedures of \nchecking and \nadjusting agricultural \nmachines \n2.1.2 Nomenclature of \nengine and \nmachines \n2.1.3 Different tools and \nmaterials \n2.1.4 Procedures of \nchecking and \nadjusting different \nimplements/ \nattachments \n2.1.5 Procedures of \nchecking and \nadjusting \naccessories and \ncomponents \n2.1.6 Resources required \n2.2. Communication \n2.2.1 Interpretation of \nmanufacturer’s \nmanual \n2.3. Values \n2.3.1 Dedication to work \n2.3.2 Resourcefulness \n2.3.3 Sense of quality \n2.3.4 Open-mindedness \n2.3.5 Patience \n2.3.6 Perseverance \n2.3.7 Environmentally \nconscious\n2.1 Reading and \ninterpreting \nmanual/ \nmanufacturer’s \nspecifications, \nwork and \nmaintenance \nplans \n2.2 Checking and \nadjusting \nagricultural \nmachineries \n2.3 Preparing tools \nand materials \n2.4 Using appropriate \nfuel and \nlubrication \nrequirements \n2.5 Checking and \nadjusting different \nimplements/ \nattachments \n2.6 Checking and \nadjusting \naccessories and \ncomponents \n2.7 Preparing other \nresources \nrequired \n2.8 Using \nmanufacturer’s \nmanual \n3. Operate \nagricultural \nmachineries \n3.1 Personal Protective \nEquipment are \nselected and worn as \nper work requirement \n3.2 Machine is operated \nfollowing operator’s \nmanual \n3.3 Malfunctions are \nidentified and \ncorrected in \naccordance with \n3.1. Knowledge, \nTheory, Practices \nand Systems \nOperations \n3.1.1 Operation \nprocedures of \nagricultural \nmachines \n3.1.2 Corrective \nprocedures for \ndifferent \n3.1 Operating \ndifferent \nagricultural \nmachineries \npowered by small \nengines \n3.2 Wearing \nappropriate/ \nproper of PPEs \n3.3 Performing safety \npractices and\n\n--- PDF PAGE 34 ---\nTR –Agricultural Machinery Operation NC II Promulgated March 2016 30 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \noperator’s manual \n3.4 Performances are \nassessed according \nto set \nstandards/client’s \nspecification \n3.5 Machinery is \nshutdown according \nto operator’s manual. \nmalfunctions of \nagricultural \nmachineries \npowered by small \nengines \n3.1.3 Assessment \nprocedures for \nperformances of \nagricultural machine \nperformances \n3.1.4 Shutting down \nprocedures of \nmachineries \n3.2. Communication \n3.2.1 Interpretation of \nmanufacturer’s \nmanual \n3.3. Safety Practices \n3.3.1 Wearing PPE \n3.4. Code \n3.4.1 OSHS \n3.4.2 PAES \n3.5. Values \n3.5.1 Dedication to work \nand resourcefulness \n3.5.2 Sense of quality and \nopen-mindedness \n3.5.3 Patience, \n3.5.4 Perseverance \n3.5.5 Environmentally \nconscious\nsafe operation \n3.4 Demonstrating \nsafe and \nenvironmentally \nresponsible \nworkplace \npractices \n3.5 Using \nmanufacturer’s \nmanual \n3.6 Applying \ncorrective \nmeasures for \nmalfunctions of \nmachineries \n3.7 Assessing \nperformances of \nmachineries \n3.8 Shutting down of \nmachineries \n4. Perform post-\noperation \nactivities \n4.1 Wastes are managed \naccording to \nenvironmental \nregulations \n4.2 Machineries and \nengines are cleaned \nand checked prior to \nstorage \n4.3 Work area is cleaned \nand maintained \naccording to OHS \nand enterprise \nrequirements \n4.4 Records of \ninformation are \nprepared in with \nreference to \n4.1. Knowledge, \nTheory, Practices \nand Systems \nOperations \n4.1.1 Management of \ndifferent wastes \n4.1.2 Procedures of \ncleaning and \nchecking of \nmachineries and \nengines prior to \nstorage \n4.1.3 Maintenance of work \narea \n4.1.4 Record keeping \nprocedures \n4.1.5 Basic preventive \n4.1 Managing wastes \n4.2 Segregating \