        "source_text": "--- PDF PAGE 11 ---\nTR –Agricultural Machinery Operation NC II               Promulgated March 2016                                    7 \nUNIT OF COMPETENCY : \nWORK IN TEAM ENVIRONMENT \n \nUNIT CODE \n: \n500311106 \n \nUNIT DESCRIPTOR \n: \nThis unit covers the skills, knowledge and attitudes to \nidentify role and responsibility as a member of a team. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1.  Describe \nteam role \nand scope \n1.1  The role and \nobjective of the \nteam is identified \nfrom available \nsources of \ninformation \n1.2  Team parameters, \nreporting \nrelationships and \nresponsibilities are \nidentified from team \ndiscussions and \nappropriate external \nsources\n1.1 Communication \nprocess \n1.2 Team structure \n1.3 Team roles \n1.4 Group planning \nand decision \nmaking \n1.1 Communicate \nappropriately, \nconsistent with \nthe culture of the \nworkplace \n2.  Identify own \nrole and \nresponsibility \nwithin team \n2.1  Individual role and \nresponsibilities within \nthe team environment \nare identified \n2.2  Roles and \nresponsibility of other \nteam members are \nidentified and \nrecognized \n2.3  Reporting \nrelationships within \nteam and external to \nteam are identified\n2.1 Communication \nprocess \n2.2 Team structure \n2.3 Team roles \n2.4 Group planning \nand decision \nmaking   \n2.1 Communicate \nappropriately, \nconsistent with \nthe culture of the \nworkplace \n3.  Work as a \nteam \nmember  \n3.1  Effective and \nappropriate forms of \ncommunications used \nand interactions \nundertaken with team \nmembers who \ncontribute to known \nteam activities and \nobjectives \n3.2  Effective and \nappropriate \ncontributions made to \ncomplement team \n3.1 Communication \nprocess \n3.2 Team structure \n3.3 Team roles \n3.4 Group planning \nand decision \nmaking \n3.1 Communicate \nappropriately, \nconsistent with \nthe culture of the \nworkplace \n3.2 Interacting \neffectively with \nothers\n\n--- PDF PAGE 12 ---\nTR –Agricultural Machinery Operation NC II               Promulgated March 2016                                    8 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \nactivities and \nobjectives, based on \nindividual skills and \ncompetencies and \nworkplace context \n3.3  Observed protocols in \nreporting using \nstandard operating \nprocedures \n3.4  Contribute to the \ndevelopment of team \nwork plans based on \nan understanding of  \nteam’s role and \nobjectives and \nindividual \ncompetencies of the \nmembers\n \n \nRANGE OF VARIABLES \n \n \nVARIABLE \nRANGE \n1. Role and \nobjective of team \nMay include: \n1.1. Work activities in a team environment with enterprise or specific sector \n1.2. Limited discretion, initiative and judgment maybe demonstrated on the \njob, either individually or in a team environment\n2. Sources of \ninformation \nMay include: \n2.1. Standard operating and/or other workplace procedures \n2.2. Job procedures \n2.3. Machine/equipment manufacturer’s specifications and instructions \n2.4. Organizational or external personnel \n2.5. Client/supplier instructions \n2.6. Quality standards \n2.7. OHS and environmental standards\n3. Workplace \ncontext \nMay include: \n3.1. Work procedures and practices \n3.2. Conditions of work environments \n3.3. Legislation and industrial agreements \n3.4. Standard work practice including the storage, safe handling and \ndisposal of chemicals \n3.5. Safety, environmental, housekeeping and quality guidelines\n\n--- PDF PAGE 13 ---\nTR –Agricultural Machinery Operation NC II               Promulgated March 2016                                    9 \n \nEVIDENCE GUIDE \n \n \n1. \nCritical aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 \nOperated in a team to complete workplace activity \n1.2 \nWorked effectively with others \n1.3 \nConveyed information in written or oral form \n1.4 \nSelected and used appropriate workplace language \n1.5 \nFollowed designated work plan for the job \n1.6\nReported outcomes \n2. \nResource Implications \nThe following resources should be provided: \n2.1 \nAccess to relevant workplace or appropriately simulated \nenvironment where assessment can take place \n2.2\nMaterials relevant to the proposed activity or tasks\n3. \nMethods of Assessment \nCompetency in this unit may be assessed through: \n3.1 \nObservation   of the individual member in relation to the work \nactivities of the group \n3.2 \nObservation of simulation and or role play involving the \nparticipation of individual member to the attainment of \norganizational goal \n3.3 \nCase studies and scenarios as a basis for discussion of \nissues and strategies in teamwork\n4. \nContext for Assessment \n4.1 \nCompetency may be assessed in workplace or in a \nsimulated workplace setting \n4.2 \nAssessment shall be observed while task are being \nundertaken whether individually or in group\n",
