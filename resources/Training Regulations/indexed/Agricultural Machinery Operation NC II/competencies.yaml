.5 \nGrass cutter \n3.6\nPower sprayer\n4. Tools and materials \nTools and materials may include but not limited to: \n4.1 \nWrenches \n4.2 \nHammer \n4.3 \nFuel/Oil \n4.4 \nGrease gun \n4.5 \nSeeds \n4.6 \nSacks (for seeds and waste) \n4.7 \nMeasuring can \n4.8 \nPlanting materials \n4.9 \nTeflon tape \n4.10 Fertilizer \n4.11 Chemicals \n4.12 Screw drivers \n4.13 Sacks \n4.14 Air compressor \n4.15 Broomstick and dustpan* \n4.16 Rags* \n4.17 Pressurized water sprayer* \n \n*For cleaning purposes\n5. Attachments \nAttachments may include but not limited to: \n \n5.1 \nImplements \n5.1.1 \nMoldboard/disc plow \n5.1.2 \nHarrow \n5.1.3 \nTrailer (for transport of implements of hand \ntractor) \n5.1.4 \nRotavator \n5.1.5 \nLeveller\n\n--- PDF PAGE 37 ---\nTR –Agricultural Machinery Operation NC II Promulgated March 2016 33 \nVARIABLE\nRANGE\n5.2 \nAccessories \n5.2.1 \nGuide stick \n5.2.2 \nFloater \n5.2.3 \nFurrow opener and closer \n5.2.4 \nPressure gauge \n5.2.5 \nPipe connector \n5.2.6 \nLance \n5.2.7 \nNozzle \n5.2.8\nHose\n6. Resources \nResources includes: \n6.1 \nWater source \n6.2\nRequired field\n7. Personal Protective \nEquipment \nPersonal Protective Equipment \n7.1 \nBoots \n7.2 \nDust Mask \n7.3 \nGloves \n7.4 \nEar muff \n7.5\nProtective cap\n8. Malfunctions \nMalfunctions may include but is not limited to: \n8.1 \nErratic engine speed \n8.2 \nBelt slippage \n8.3 \nUnplowed field/area \n8.4 \nNo water discharged \n8.5\nPesticide leak\n9. Performances \nPerformances may include but are not limited to: \n9.1 \nEven seeding rate \n9.2 \nStraight row planting \n9.3 \nUniform transplanted seedlings \n9.4 \nAcceptable field efficiency \n9.5 \nDischarge capacity \n9.6 \nEfficiency of machines \n9.7\nCapacity of machines\n10. Waste \nWaste may include but are not limited to: \n10.1 Excess seeds after operation \n10.2 Sacks \n10.3 Remaining seedlings after operation \n10.4 Pesticide bottle \n10.5 Used Teflon seals \n10.6 Used fertilizer \n10.7 Container/sacks\n11. Records of information \nRecords of information \n11.1 Machine failure \n11.2 Fuel consumption \n11.3 Area operated \n11.4 Hours of operation \n11.5 Manpower requirements \n11.6 Date of operation\n\n--- PDF PAGE 38 ---\nTR –Agricultural Machinery Operation NC II Promulgated March 2016 34 \nVARIABLE\nRANGE\n12. Basic preventive \nmaintenance \nMay include but are not limited to: \n12.1 Dismantling and assembling procedures \n12.2 Safety and pre-start checks \n12.3 Testing \n12.4 Tightening \n12.5 Minor adjustments and repairs (e.g. belt tension/ \npulley alignment, engine speed) \n12.6 Routine servicing procedures (e.g. cleaning, \nlubricating, priming pumps, cleaning filters, checks of \ncooling systems, fuel, grease and oil, battery levels)\n \n \nEVIDENCE GUIDE \n \n \n1. \nCritical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1 \nSelected agricultural machineries powered by small \nengines \n1.2 \nPrepared agricultural machineries powered by small \nengines for operations \n1.3 \nOperated agricultural machineries powered by small \nengines \n1.4\nPerformed post-operation activities\n2. \nResource Implications \nThe following resources MUST be provided: \n2.1 \nField/Area \n2.2 \nMachines and implements \n2.3 \nManufacturer’s manual \n2.4\nSupplies and materials\n3. \nMethod of Assessment \nCompetency may be assessed through: \n3.1 \nDirect observation \n3.2 \nDemonstration with Oral Questioning \n3.3\nPortfolio\n4. \nContext for Assessment \n4.1 \nCompetency maybe assessed in actual workplace or \nat the designated TESDA Accredited Assessment \nCenter.\n\n--- PDF PAGE 39 ---\nTR –Agricultural Machinery Operation NC II Promulgated March 2016 35 \nUNIT OF COMPETENCY : \nOPERATE AGRICULTURAL LARGE PRODUCTION \n \n \n \nMACHINERY AND EQUIPMENT \n \nUNIT CODE \n:"
