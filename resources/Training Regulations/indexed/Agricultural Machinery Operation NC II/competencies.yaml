            Promulgated March 2016                                    29 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n2.  Prepare \nagricultural \nmachineries  \nfor \noperations \n2.1  Agricultural \nmachineries are \nchecked and adjusted \nin accordance with \njob requirements \n2.2  Tools and materials \nare prepared \naccording to  work \nrequirements \n2.3  Attachments are \nchecked and adjusted \nfollowing \nmanufacturer’s \nmanual \n2.4  Resources are \nreadied to meet the \nwork requirements \n2.1.    Knowledge, \nTheory, Practices \nand Systems \nOperations \n2.1.1 Procedures of \nchecking and \nadjusting agricultural \nmachines \n2.1.2 Nomenclature of \nengine and \nmachines \n2.1.3 Different tools and \nmaterials \n2.1.4 Procedures of \nchecking and \nadjusting different \nimplements/ \nattachments \n2.1.5 Procedures of \nchecking and \nadjusting \naccessories and \ncomponents \n2.1.6 Resources required  \n2.2.    Communication \n2.2.1 Interpretation of \nmanufacturer’s \nmanual  \n2.3. Values \n2.3.1 Dedication to work \n2.3.2 Resourcefulness \n2.3.3 Sense of quality \n2.3.4 Open-mindedness \n2.3.5 Patience \n2.3.6 Perseverance  \n2.3.7 Environmentally \nconscious\n2.1 Reading and \ninterpreting \nmanual/ \nmanufacturer’s \nspecifications, \nwork and \nmaintenance \nplans \n2.2 Checking and \nadjusting \nagricultural \nmachineries \n2.3 Preparing tools \nand materials \n2.4 Using appropriate \nfuel and \nlubrication \nrequirements \n2.5 Checking and \nadjusting different \nimplements/ \nattachments \n2.6 Checking and \nadjusting \naccessories and \ncomponents \n2.7 Preparing other \nresources \nrequired \n2.8 Using \nmanufacturer’s \nmanual \n3.  Operate \nagricultural \nmachineries  \n3.1  Personal Protective \nEquipment are \nselected and worn as \nper work requirement \n3.2  Machine is operated \nfollowing operator’s \nmanual \n3.3  Malfunctions are \nidentified and \ncorrected in \naccordance with \n3.1.    Knowledge, \nTheory, Practices \nand Systems \nOperations \n3.1.1 Operation \nprocedures of \nagricultural \nmachines \n3.1.2 Corrective \nprocedures for \ndifferent \n3.1 Operating \ndifferent \nagricultural \nmachineries \npowered by small \nengines \n3.2 Wearing \nappropriate/ \nproper of PPEs \n3.3 Performing safety \npractices and\n\n--- PDF PAGE 34 ---\nTR –Agricultural Machinery Operation NC II               Promulgated March 2016                                    30 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \noperator’s manual \n3.4  Performances are \nassessed according \nto set \nstandards/client’s \nspecification \n3.5  Machinery is \nshutdown according \nto operator’s manual. \nmalfunctions of \nagricultural \nmachineries \npowered by small \nengines \n3.1.3 Assessment \nprocedures for \nperformances of \nagricultural machine \nperformances \n3.1.4 Shutting down \nprocedures of \nmachineries \n3.2.   Communication \n3.2.1 Interpretation of \nmanufacturer’s \nmanual  \n3.3.   Safety Practices \n3.3.1 Wearing PPE \n3.4.    Code  \n3.4.1 OSHS \n3.4.2 PAES \n3.5.    Values \n3.5.1 Dedication to work \nand resourcefulness \n3.5.2 Sense of quality and \nopen-mindedness \n3.5.3 Patience,  \n3.5.4 Perseverance  \n3.5.5 Environmentally \nconscious\nsafe operation \n3.4 Demonstrating \nsafe and \nenvironmentally \nresponsible \nworkplace \npractices \n3.5 Using \nmanufacturer’s \nmanual \n3.6 Applying \ncorrective \nmeasures for \nmalfunctions of \nmachineries \n3.7 Assessing \nperformances of \nmachineries \n3.8 Shutting down of \nmachineries \n4.  Perform post-\noperation \nactivities \n4.1  Wastes are managed \naccording to   \nenvironmental \nregulations \n4.2  Machineries  and \nengines are cleaned \nand checked prior to \nstorage \n4.3  Work area is cleaned \nand maintained \naccording to OHS \nand enterprise \nrequirements \n4.4  Records of \ninformation are \nprepared in with \nreference to \n4.1.    Knowledge, \nTheory, Practices \nand Systems \nOperations \n4.1.1 Management of \ndifferent wastes \n4.1.2 Procedures of \ncleaning and \nchecking of \nmachineries and \nengines prior to \nstorage \n4.1.3 Maintenance of work \narea \n4.1.4 Record keeping \nprocedures \n4.1.5 Basic preventive \n4.1 Managing wastes \n4.2 Segregating \nwastes \n4.3 Cleaning and \nchecking \nagricultural \nmachineries \n4.4 Maintaining work \narea \n4.5 Keeping records \nof information \n4.6 Troubleshooting \nand practicing \nbasic preventive \nmaintenance \n4.7 Practicing 5S of \nGood\n\n--- PDF PAGE 35 ---\nTR –Agricultural Machinery Operation NC II               Promulgated March 2016                                    31 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \nenterprise format \n4.5  Basic preventive \nmaintenance is \nperformed according \nto manufacturer’s \nmanuals \nmaintenance for \nmachineries \npowered by small \nengines \n4.2.    Materials, Tools \nand Equipment:  \nUses, \nSpecifications and \nMaintenance \n4.2.1 Maintaining the \nvarious equipment, \ntools and utensils \n4.2.2 Procedures in \ncleaning and \nchecking machine \nand engine \n4.3. Codes and \nRegulations \n4.3.1 OSHS \n4.3.2 5S of Good \nHousekeeping \n4.3.3 3R applications \n4.3.4 Waste Management \nAct \n4.4.    Safety Practices \n4.4.1 Wearing PPE \n4.5.   Communication \n4.5.1 Preparation of \nrecords of \ninformation \n4.5.2 Interpreting \nmanufacturer’s \nmanual \n4.6. Maintenance \n4.6.1 Basic preventive \nmaintenance \n4.7. Values \n4.7.1 Dedication to work \nand resourcefulness \n4.7.2 Sense of quality and \nopen-mindedness \n4.7.3 Patience \n4.7.4 Perseverance \n4.7.5 Environmentally \nconscious\nHousekeeping \nand 3Rs \n4.8 Preparing records \n4.9 Communicationon \nskills\n\n--- PDF PAGE 36 ---\nTR –Agricultural Machinery Operation NC II               Promulgated March 2016                                    32 \n \nRANGE OF VARIABLES \n \n \nVARIABLE\nRANGE\n1. Land Condition \nLand condition includes: \n1.1 \nLow land \n1.2\nHigh land\n2. Crop condition \nCrop condition includes: \n2.1 \nPest incidence \n2.2 \nWater shortage \n2.3\nNutrient shortage\n3. Agricultural machineries \nAgricultural machineries include: \n3.1 \nHand tractor/power tiller \n3.2 \nSeeder/planter/digger \n3.3 \nIrrigation pump \n3.4 \nWeeder/Cultivator \n3.5 \nGrass cutter \n3.6\nPower sprayer\n4. Tools and materials \nTools and materials may include but not limited to: \n4.1 \nWrenches \n4.2 \nHammer \n4.3 \nFuel/Oil \n4.4 \nGrease gun \n4.5 \nSeeds  \n4.6 \nSacks (for seeds and waste) \n4.7 \nMeasuring can \n4.8 \nPlanting materials \n4.9 \nTeflon tape \n4.10 Fertilizer \n4.11 Chemicals \n4.12 Screw drivers \n4.13 Sacks  \n4.14 Air compressor \n4.15 Broomstick and dustpan* \n4.16 Rags* \n4.17 Pressurized water sprayer* \n \n*For cleaning purposes\n5. Attachments \nAttachments may include but not limited to: \n \n5.1 \nImplements \n5.1.1 \nMoldboard/disc plow \n5.1.2 \nHarrow \n5.1.3 \nTrailer (for transport of implements of hand \ntractor) \n5.1.4 \nRotavator \n5.1.5 \nLeveller\n\n--- PDF PAGE 37 ---\nTR –Agricultural Machinery Operation NC II               Promulgated March 2016                                    33 \nVARIABLE\nRANGE\n5.2 \nAccessories \n5.2.1 \nGuide stick \n5.2.2 \nFloater \n5.2.3 \nFurrow opener and closer \n5.2.4 \nPressure gauge \n5.2.5 \nPipe connector \n5.2.6 \nLance \n5.2.7 \nNozzle \n5.2.8\nHose\n6. Resources \nResources includes: \n6.1 \nWater source \n6.2\nRequired field\n7. Personal Protective \nEquipment \nPersonal Protective Equipment \n7.1 \nBoots \n7.2 \nDust Mask \n7.3 \nGloves \n7.4 \nEar muff \n7.5\nProtective cap\n8. Malfunctions \nMalfunctions may include but is not limited to: \n8.1 \nErratic engine speed \n8.2 \nBelt slippage \n8.3 \nUnplowed field/area \n8.4 \nNo water discharged \n8.5\nPesticide leak\n9. Performances \nPerformances may include but are not limited to: \n9.1 \nEven seeding rate \n9.2 \nStraight row planting \n9.3 \nUniform transplanted seedlings  \n9.4 \nAcceptable field efficiency \n9.5 \nDischarge capacity \n9.6 \nEfficiency of machines \n9.7\nCapacity of machines\n10. Waste \nWaste may include but are not limited to: \n10.1 Excess seeds after operation \n10.2 Sacks \n10.3 Remaining seedlings after operation \n10.4 Pesticide bottle \n10.5 Used Teflon seals \n10.6 Used fertilizer \n10.7 Container/sacks\n11. Records of information \nRecords of information \n11.1 Machine failure \n11.2 Fuel consumption \n11.3 Area operated \n11.4 Hours of operation \n11.5 Manpower requirements \n11.6 Date of operation\n\n--- PDF PAGE 38 ---\nTR –Agricultural Machinery Operation NC II               Promulgated March 2016                                    34 \nVARIABLE\nRANGE\n12. Basic preventive \nmaintenance \nMay include but are not limited to: \n12.1 Dismantling and assembling procedures \n12.2 Safety and pre-start checks \n12.3 Testing \n12.4 Tightening \n12.5 Minor adjustments and repairs (e.g. belt tension/ \npulley alignment, engine speed) \n12.6 Routine servicing procedures (e.g. cleaning, \nlubricating, priming pumps, cleaning filters, checks of \ncooling systems, fuel, grease and oil, battery levels)\n \n \nEVIDENCE GUIDE \n \n \n1. \nCritical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1 \nSelected agricultural machineries powered by small \nengines \n1.2 \nPrepared agricultural machineries powered by small \nengines for operations \n1.3 \nOperated agricultural machineries powered by small \nengines \n1.4\nPerformed post-operation activities\n2. \nResource Implications \nThe following resources MUST be provided: \n2.1 \nField/Area \n2.2 \nMachines and implements \n2.3 \nManufacturer’s manual \n2.4\nSupplies and materials\n3. \nMethod of Assessment \nCompetency may be assessed through: \n3.1 \nDirect observation \n3.2 \nDemonstration with Oral Questioning \n3.3\nPortfolio\n4. \nContext for Assessment \n4.1 \nCompetency maybe assessed in actual workplace or \nat the designated TESDA Accredited Assessment \nCenter.\n",
