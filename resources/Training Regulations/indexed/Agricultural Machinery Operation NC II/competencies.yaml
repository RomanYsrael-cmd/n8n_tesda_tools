        "source_text": "--- PDF PAGE 27 ---\nTR –Agricultural Machinery Operation NC II               Promulgated March 2016                                    23 \nUNIT OF COMPETENCY : \nUSE FARM TOOLS AND EQUIPMENT \n \nUNIT CODE \n: \nAFF321202 \n \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge, skills and attitudes \nrequired to use farm tools and equipment. It includes \nselection, operation and preventive maintenance of farm \ntools and equipment. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1.  Select and \nuse farm \ntools \n1.1  Appropriate farm \ntools are identified \naccording to \nrequirement/use \n1.2  Farm tools are \nchecked for faults \nand defective tools \nreported in \naccordance with farm \nprocedures \n1.3  Appropriate tools are \nsafely used according \nto job requirements \nand manufacturers \nconditions\n1.1 Types and uses \nof farm tools  \n1.2 Characteristics \nof functional \ntools \n1.3 Checking tools \nfor defects/faults \n1.4 Segregation and \nreporting  \ndefective tools  \n1.5 Uses of  tools \nand equipment  \n1.1 Identifying farm \ntools for the work \n1.2 Checking the \nconditions of tools \n1.3 Reporting \ndefective tools \n1.4 Using tools  \n2.  Select and \noperate farm \nequipment \n2.1  Identify appropriate \nfarm equipment \n2.2  Instructional manual \nof the farm tools and \nequipment are \ncarefully read prior to \noperation \n2.3  Pre-operation \ncheck-up is \nconducted in line with \nmanufacturers \nmanual \n2.4  Faults in farm \nequipment are \nidentified and \nreported in line with \nfarm procedures \n2.5  Farm equipment used \naccording to its \nfunction \n2.6  Safety procedures \nare followed. \n2.1 Types and  \noperations of  \nfarm equipment  \n2.2 Standards  \noperating \nprocedures of \nfarm equipment \n2.3 Instructional \nmanual of \nequipment \n2.4 Pre-operation \ncheck-up \n2.5 Equipment  \nSpecification \n2.6 Procedures  in \ncalibrating and \nuse of equipment \n2.7 Equipment faults \nidentification and \nreporting \n2.8 Operation of \nequipment \n2.9\nCodes and \n2.1 Identifying \nappropriate farm \nequipment for the \nwork \n2.2 Reading \ninstructional \nmanual. \n2.3 Conducting pre-\noperation check-\nup \n2.4 Identifying \nfaults/defects of \nfarm equipment \n2.5 Reporting on \ndefective farm \nequipment \n2.6 Operating farm \nequipment \n2.7 Following safety \nprocedures.\n\n--- PDF PAGE 28 ---\nTR –Agricultural Machinery Operation NC II               Promulgated March 2016                                    24 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \nRegulations on \nenvironmental \nprotection  \n2.10 Safety and \nkeeping of \nequipment every \nafter use \n2.11 Safety measures\n3.  Perform \npreventive \nmaintenance \n3.1  Tools and equipment \nare cleaned \nimmediately after use \nin line with farm \nprocedures \n3.2  Routine check-up and \nmaintenance are \nperformed \n3.3  Tools and equipment \nare stored in \ndesignated areas in \nline with farm \nprocedures\n3.1 Cleaning \nprocedures of \ntools and \nequipment \n3.2 Maintenance \nprocedures of \nfarm equipment  \n3.3 Storage of tools \nand equipment \n3.4 Designated \nstorage areas \n3.1 Cleaning tools \nand equipment \n3.2 Performing \nroutinary check-\nup of tools and \nequipment \n3.3 Maintaining farm \nequipment \n3.4 Storing tools and \nequipment\n\n--- PDF PAGE 29 ---\nTR –Agricultural Machinery Operation NC II               Promulgated March 2016                                    25 \nRANGE OF VARIABLES \n \n \nVARIABLE \nRANGE \n1. Farm equipment \nFarm equipment include: \n1.1 \nEngine \n1.2 \nPumps \n1.3 \nGenerators \n1.4\nSprayers\n2. Farm tools \nFarm tools includes: \n2.1 \nSickle \n2.2 \nCutters \n2.3 \nWeighing scales \n2.4 \nHand tools \n2.5 \nMeasuring tools \n2.6\nGarden tools\n3. Pre-operation check-up \nPre-operation check–up includes: \n3.1 \nTires \n3.2 \nBrake fluid \n3.3 \nFuel \n3.4 \nWater \n3.5 \nOil \n3.6 \nLubricants \n3.7\nBattery\n \n \nEVIDENCE GUIDE \n \n \n1. \nCritical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 \nCorrectly identified appropriate farm tools and \nequipment \n1.2 \nOperated farm equipment according to manual \nspecification  \n1.3\nPerformed preventive maintenance\n2. \nResource Implications \nThe following resources should be provided: \n2.1 \nService/operational manual of farm tools and \nequipment \n2.2 \nTools and equipment \n2.3\nFarm implements\n3. \nMethod of Assessment \nCompetency in this unit must be assessed through: \n3.1 \nDirect observation  \n3.2 \nPractical demonstration \n3.3\nThird Party Report\n4. \nContext of Assessment \n4.1. Competency maybe assessed in actual workplace or \nat the designated TESDA Accredited Assessment \nCenter.\n",
