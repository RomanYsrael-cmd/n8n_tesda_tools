        "source_text": "AFF321202 \n \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge, skills and attitudes \nrequired to use farm tools and equipment. It includes \nselection, operation and preventive maintenance of farm \ntools and equipment. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Select and \nuse farm \ntools \n1.1 Appropriate farm \ntools are identified \naccording to \nrequirement/use \n1.2 Farm tools are \nchecked for faults \nand defective tools \nreported in \naccordance with farm \nprocedures \n1.3 Appropriate tools are \nsafely used according \nto job requirements \nand manufacturers \nconditions\n1.1 Types and uses \nof farm tools \n1.2 Characteristics \nof functional \ntools \n1.3 Checking tools \nfor defects/faults \n1.4 Segregation and \nreporting \ndefective tools \n1.5 Uses of tools \nand equipment \n1.1 Identifying farm \ntools for the work \n1.2 Checking the \nconditions of tools \n1.3 Reporting \ndefective tools \n1.4 Using tools \n2. Select and \noperate farm \nequipment \n2.1 Identify appropriate \nfarm equipment \n2.2 Instructional manual \nof the farm tools and \nequipment are \ncarefully read prior to \noperation \n2.3 Pre-operation \ncheck-up is \nconducted in line with \nmanufacturers \nmanual \n2.4 Faults in farm \nequipment are \nidentified and \nreported in line with \nfarm procedures \n2.5 Farm equipment used \naccording to its \nfunction \n2.6 Safety procedures \nare followed. \n2.1 Types and \noperations of \nfarm equipment \n2.2 Standards \noperating \nprocedures of \nfarm equipment \n2.3 Instructional \nmanual of \nequipment \n2.4 Pre-operation \ncheck-up \n2.5 Equipment \nSpecification \n2.6 Procedures in \ncalibrating and \nuse of equipment \n2.7 Equipment faults \nidentification and \nreporting \n2.8 Operation of \nequipment \n2.9\nCodes and \n2.1 Identifying \nappropriate farm \nequipment for the \nwork \n2.2 Readi