        "source_text": "--- PDF PAGE 45 ---\nTR –Agricultural Machinery Operation NC II               Promulgated March 2016                                    41 \nUNIT OF COMPETENCY : \nOPERATE AGRICULTURAL POST-PRODUCTION  \n \n \nMACHINERY AND EQUIPMENT \n \nUNIT CODE \n: \n \nAFF834369 \n \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge, skills and attitudes  \n \nrequired in operating post-production machinery and \nequipment. It also includes to prepare post-production \nmachineries, to operate machineries and monitor \nperformance and to perform post-operation activities. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1.  Prepare post-\nproduction \nmachineries  \n1.1  Post production \nmachineries  are \nchecked and \nadjusted in \naccordance with \nestablished \nstandards and \nmanufacturer’s \nmanual \n1.2  Tools and \nmaterials  are \nprepared as per \nwork requirements \n1.3  Accessories are \nprepared and \nchecked as per work \nrequirement and \nestablished \nstandards and \nmanufacturer’s \nmanual \n1.1.   Knowledge, Theory, \nPractices and \nSystems Operations \n1.1.1 Different post \nproduction \nmachineries \n1.1.2 Procedures of \nchecking/adjustin\ng post production \nmachineries \n1.1.3 Preparation of \ntools and \nmaterial \n1.1.4 Preparation and \ninspection of \naccessories \n1.1.5 Compatibility of \nmachines and \nengines \n1.2. Communication \n1.2.1 Preparation of    \nrecords of \ninformation \n1.2.2 Manufacturer’s \nmanual\n1.1 Checking and \nadjusting post \nproduction \nmachineries \n1.2 Preparing tools \nand materials  \n1.3 Preparing and \nchecking \naccessories \n1.4 Using relevant \nfarm tools and \nequipment \n1.5 Using appropriate \nfuel and \nlubrication \nrequirement \n1.6 Preparing report \n2.  Operate \nmachineries \nand monitor \nperformance \n2.1  Personal Protective \nEquipment (PPE) \nare selected and \nworn as per work \nrequirement \n2.2  Machine is operated \naccording to \nestablished \nstandards and \nmanufacturer’s \nmanual\n2.1 Knowledge, Theory, \nPractices and Systems \nOperations \n2.1.1 Nomenclature of \nengine and \nmachines \n2.1.2 Components \nadjustments \n2.1.3 Operation of \nmachine \n2.1.4 Abnormal \n2.1 Appropriate/ \nproper wearing of \nPPEs \n2.2 Performing \nstandard \noperating \nprocedure of \nequipment \n2.3 Performing safety \npractices and \nsafe operation\n\n--- PDF PAGE 46 ---\nTR –Agricultural Machinery Operation NC II               Promulgated March 2016                                    42 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n2.3  Abnormal \nconditions are \nidentified and \ncorrected in \naccordance with the \nstandard operating \nprocedures \n2.4  Performances are \nassessed according \nto set standards and \nclients’ \nspecifications \n2.5  Malfunctions are \nrecorded for \nappropriate \nadjustment by \nproper personnel \n2.6  Machine is shutdown \naccording to \nestablished \nstandards and \nmanufacturer’s \nmanual \nconditions of \nmachine \n2.1.5 Shutting down \nprocedures \n2.2 Communication \n2.2.1 Record keeping \nof malfunctions \n2.3  Safety Practices \n2.3.1 Occupational \nhealth and safety \nprocedure \n2.3.2 Guidelines: \n- 5S of Good \nHousekeeping \n- 3R applications \n2.4  Values \n2.4.1 Dedication to work \n2.4.2 Resourcefulness \n2.4.3 Patience  \n2.4.4 Perseverance \n2.4.5 Environmentally \nconscious  \n2.4.6 Sense of quality  \n2.4.7 Open mindedness\n2.4 Demonstrating \nsafe and \nenvironmentally \nresponsible    \nworkplace \npractices \n2.5 Reading and \ninterpreting \nmanual/ \nmanufacturer’s \nspecifications, \nwork and \nmaintenance \nplans \n2.6 Assessing \nperformances of \noperation \n2.7 Recording \nmalfunctions \n2.8 Shutting down \nmachine \n3.  Perform post-\noperation \nactivities \n3.1  Wastes are \nmanaged according \nto environmental \nregulations \n3.2  Machine and engine \nare cleaned and \nstored as per \nestablished \nstandards and \nmanufacturer’s \nmanual \n3.3  Work area is \ncleaned and \nmaintained \naccording to OHS \nand enterprise \nrequirements \n3.4  Records of \ninformation are \nprepared in \nappropriate format \n3.5  Basic preventive \nmaintenance is \nperformed according \n3.1 Knowledge, Theory, \nPractices and Systems \nOperations \n3.1.1 Waste \nmanagement \n3.1.2 Maintenance and \nstorage of \nmachine and \nengine \n3.1.3 Maintenance of \nwork area \n3.2 Communication \n3.2.1 Written and oral \ncommunication \n3.2.2 Records of \ninformation \n3.3 Code \n3.3.1 OSHS \n3.3.2 Environmental \nregulations \n3.4 Tools, materials and \nequipment \n3.4.1 Preventive \nmaintenance\n3.1 Managing wastes \n3.2 Cleaning and \nstoring machine \nand engine \n3.3 Maintaining work \narea \n3.4 Practicing OSHS \n3.5 Preparing records \nof information \n3.6 Performing basic \npreventive \nmaintenance \n3.7 Troubleshooting \n3.8 Basic \ncomputation and \ncommunication \nskills\n\n--- PDF PAGE 47 ---\nTR –Agricultural Machinery Operation NC II               Promulgated March 2016                                    43 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \nto manufacturer’s \ninstructions and/or \nstandard practices\n \n \nRANGE OF VARIABLES \n \n \nVARIABLE\nRANGE\n1. Post production \nMachineries \nMachines may include but are not limited to: \n1.1 \nHarvester \n1.2 \nDryer \n1.3 \nMill \n1.4 \nThresher \n1.5 \nSheller \n1.6 \nDecorticator \n1.7\nDehusker/Depulper\n2. Accessories \nAccessories may include but are not limited to: \n2.1 \nMoisture meter \n2.2 \nThermometer \n2.3 \nTachometer \n2.4 \nVelometer \n2.5 \nMamometer \n2.6 \nHygrometer \n2.7 \nCleaner \n2.8 \nPolisher \n2.9 \nSeparator \n2.10 Grader \n2.11 Bagger \n2.12 Engines \n2.13 Electric Motor \n2.14 Huller \n2.15 Weighing scale \n2.16 Dust collection system\n3. Tools and \nmaterials \nTools and materials may include but are not limited to: \n3.1 \nWrenches tools \n3.2 \nCrop samples materials \n3.3 \nOil/fuel materials \n3.4 \nSacks (for grains and waste) materials \n3.5 \nPlastic twine materials \n3.6 \nVacuum cleaner materials \n3.7 \nBroomstick and dustpan materials \n3.8 \nRags materials \n3.9\nGrease gun tools\n\n--- PDF PAGE 48 ---\nTR –Agricultural Machinery Operation NC II               Promulgated March 2016                                    44 \nVARIABLE\nRANGE\n4. Personal \nProtective \nEquipment \nPersonal Protective Equipment may include but are not limited to:\n4.1 \nDust mask \n4.2 \nGloves \n4.3 \nEar muff \n4.4 \nLong sleeve shirt \n4.5\nProtective cap\n5. Abnormal \nAbnormal conditions may include but are not limited to: \n5.1 \nErratic engine speed \n5.2 \nBelt spillage \n5.3 \nProlonged drying time \n5.4 \nHigh moisture gradiant \n5.5 \nLow airflow/low drying air temperature \n5.6 \nClogging \n5.7 \nHigh losses  \n5.8\nExcessive broken/return paddy\n6. Performances \nPerformance may include but are not limited to: \n6.1 \nMoisture reduction rate \n6.2 \nDrying capacity \n6.3 \nLoading capacity \n6.4 \nProduct quality \n6.5 \nDrying rate \n6.6 \nSpillage \n6.7 \nHeating system efficiency  \n6.8 \nDrying efficiency \n6.9 \nMoisture gradient \n6.10 Milling recovery \n6.11 Milling degree \n6.12 Hulling efficiency\n7. Wastes \nWastes may include but are not limited to: \n7.1 \nAshes \n7.2 \nImpurities \n7.3 \nBiomass waste \n7.4\nUsed plastic twine and sacks\n8. Records of \ninformation \nRecords of information may include but are not limited to: \n8.1 \nMachine failure \n8.2 \nFuel consumption \n8.3 \nDrying time \n8.4 \nHours of operation \n8.5 \nManpower requirements \n8.6 \nQuality and quantity \n8.7 \nDrying air temperature \n8.8 \nInitial and final moisture of grains \n8.9 \nGrain quantity & quality \n8.10 Machine Failure \n8.11 Fuel/electricity consumption \n8.12 Hours of operation \n8.13 Labor requirement\n\n--- PDF PAGE 49 ---\nTR –Agricultural Machinery Operation NC II               Promulgated March 2016                                    45 \nVARIABLE\nRANGE\n9. Basic preventive \nmaintenance \nBasic preventive maintenance may include but are not limited to: \n9.1 \nDismantling and assembling procedures \n9.2 \nSafety and pre-start checks \n9.3 \nTesting \n9.4 \nTightening \n9.5 \nMinor adjustments and repairs (e.g. belt   tension/ pulley \nalignment, engine speed) \n9.6 \nRoutine servicing procedures (e.g. cleaning, lubricating, priming \npumps, cleaning filters, checks of cooling systems, fuel, grease \nand oil, battery levels\n\n--- PDF PAGE 50 ---\nTR –Agricultural Machinery Operation NC II               Promulgated March 2016                                    46 \nEVIDENCE GUIDE \n \n \n1. \nCritical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1 \nPrepared post-production machines \n1.2 \nOperated and shut down machine \n1.3 \nOperated machine at optimum efficiency \n1.4 \nCleaned and stored machine and engine \n1.5 \nCleaned and maintained work area \n1.6 \nPrepared record of operation \n1.7 \nObserved OHS procedures \n1.8\nPerformed basic routine preventive maintenance\n2. \nResource implications \nThe following resources MUST be provided: \n2.1 \nDryer machinery \n2.2 \nManufacturer’s manual \n2.3\nSupplies and materials (grain samples, etc)\n3. \nMethods of assessment \nCompetency may be assessed through: \n3.1 \nDirect observation/Demonstration with Oral \nQuestioning \n3.2\nPortfolio\n4. \nContext for Assessment \n4.1 \nCompetency maybe assessed in actual workplace or \nat the designated TESDA Accredited Assessment \nCenter.\n",
