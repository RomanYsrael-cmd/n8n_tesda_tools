  "source_text": "COMPETENCY MAP – HEALTH CARE SECTOR (DENTAL LABORATORYTECHNOLOGY SERVICES NC II)\nBASIC COMPETENCIES\n\nReceive and respond to\nworkplace communication\nWork with others\nDemonstrate work\nvalues\nPractice basic\nhousekeeping\nprocedures\nParticipate in workplace\ncommunication\nWork in team\nenvironment\nPractice career\nprofessionalism\nPractice occupational\nhealth and safety\nprocedures\nLead workplace\ncommunication\nLead small team\nDevelop and practice\nnegotiation skills\nSolve problems related\nto work activities\nUse mathematical\nconcepts and\ntechniques\nUse relevant\ntechnologies\nUtilize specialized\ncommunication skills\nDevelop teams and\nindividuals\nApply problem solving\ntechniques in the\nworkplace\nCollect, analyze and\norganize information\nPlan and organize work\nPromote environmental\nprotection\n\nCOMMON COMPETENCIES\n\nImplement and monitor\ninfection control policies\nand procedures\nRespond effectively to\ndifficult/challenging\nbehavior\nApply basic first aid\nMaintain high\nstandard of patient\nservices\nProcess reusable\ninstruments and\nequipment in health\nwork\nPrepare for and assist\nwith oral health care\nprocedures\nAssist with\nadministration in dental\npractice\nMaintain an effective\nrelationship with\ncustormers and clients\nManage own\nperformance\nFollow occupational\nhealth and safety\npolicies in dental\npractice\nMaintain infection\ncontrol in dental\npractice\n\nCORE COMPETENCIES\n\nProvide care and support to\ninfants and toddlers\nProvide care and support\nto children\nFoster social, intellectual,\ncreative and emotional\ndevelopment of children\nFoster the physical\ndevelopment of\nchildren\nProvide care and\nsupport to elderly\nProvide care and\nsupport to people with\nspecial needs\nMaintain a healthy and\nsafe environment\nRespond to emergency\nClean living room, dining\nroom, bedrooms, toilet\nand bathroom\nWash and iron clothes,\nlinen and fabric\nPrepare hot and cold\nmeals\nPrepare and maintain\nbeds\nCollect and maintain\nlinen stocks at end\nusers location\nAssist in patient\nmobility\n\nAssist in transporting\npatients\nAssist in bio-psychosocial\nsupport care of patients\nHandle waste in a health\ncare environment\nInstall biomedical\nequipment\nPerform corrective\nmaintenance on\nbiomedical equipment\nPerform preventive\nmaintenance on\nbiomedical equipment\nRepair biomedical\nequipment\n\nPerform basic life support\n\nMaintain life support\nequipment and resources\nImplement safe access\nand extrication\nprocedures in an\nemergency\nManage request for\nambulance service\nAllocate ambulance\nservice resources\nCoordinate emergency\nresources\nDeliver basic\nambulance\ncommunication skills\n\nSupervise on-road\noperations\n\nManage the scene of a\nspecial event\nManage routine scene\nDeliver pre-hospital\npatient care\nManage ambulance\noperations\nTransport emergency\npatients\nTransport non-\nemergency patients\n\n--- PDF PAGE 65 ---\nTR Dental Laboratory Technology Services (Removable Dentures/Appliances) NC II\n\nAmended April 8, 2010\n\n60\nDrive vehicles under\noperational conditions\nWork within a holistic\ntherapeutic massage\nframework\nPerform therapeutic\nmassage assessment\nPlan the therapeutic\nmassage treatment\nImplement therapeutic\nmassage treatment\nPerform remedial\ntherapeutic massage\ntreatment\nWork within a\ncommunity\ndevelopment\nframework\nPrepare for work in the\ncommunity service industry\nSupport community\nresources\nProvide\nprimary/residential care\nSupport community\nparticipation\nRecruit and coordinate\nvolunteers\nRespond holistically to\nclient issues\nDevelop and provide\nhealth education\nprogram in the\ncommunity\nImplement health promotion\nand community interventions\nFabricate models\nFabricate custom\nimpression trays\nFabricate registration\nbite rims\nArticulate models and\ntransfer records\nFabricate mouthguard\nArrange artificial teeth\nfor complete dentures\nSet up and wax removable\npartial dentures\