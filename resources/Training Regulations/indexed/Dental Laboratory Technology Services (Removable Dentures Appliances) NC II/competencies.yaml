        "source_title": "FABRICATE ORAL SPLINTS",
        "source_text": "--- PDF PAGE 48 ---\nTR Dental Laboratory Technology Services (Removable Dentures/Appliances) NC II                  Amended April 8, 2010    \n \n \n44\nUNIT OF COMPETENCY : \nFABRICATE ORAL SPLINTS \n \nUNIT CODE \n: \nHCS322332 \n \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge, skills and attitude in fabricating oral \nsplints. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables\n1.  Fabricate splint \n1.1 \nMaterials for the fabrication of splint are selected.  \n1.2 \nSplint is fabricated according to work order requirements. \n1.3 \nSplint is processed according to manufacturer’s \nrecommendations. \n \n2.  Trim, shape and \nfinish \n2.1 \nSplint is trimmed according to material selection. \n2.2 \nSplint is shaped according to work order and rechecked on \narticulator. \n2.3 \nSplint is fitted back to master model. \n2.4 \nSplint is finished appropriately according to type of material \nselected. \n \n \n \n \n \n \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.  Materials  \nMay include but are not limited to: \n1.1 \nCast alloys \n1.2 \nAcrylic resins (heat activated, chemically activated, thermo-\nformed) \n1.3\nVisible light-cured composite resins\n2.  Splint to be fabricated\nMay include but are not limited to: \n2.1 \nCast metal alloy cap splints \n2.2 \nAcrylic cap splints \n2.3 \nGunning splints \n2.4 \nWrought wire retained splints \n2.5 \nOcclusal splints (bruxing, neutral, anterior, repositioning, TMJ, \northodontic)\n\n--- PDF PAGE 49 ---\nTR Dental Laboratory Technology Services (Removable Dentures/Appliances) NC II                  Amended April 8, 2010    \n \n \n45\nEVIDENCE GUIDE \n \n1. Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1 \nFabricated splint \n1.2 \nTrimmed, shaped and finished splint \n1.3 \nFollowed OH&S and DOH infection control guidelines \n1.4 \nIdentified dental anatomy and dental metallurgy \n1.5 \nUsed surveying equipment and vacuum forming procedures \n2. Underpinning \nknowledge  \nKnowledge on: \n2.1 \nArticulation and occlusion \n2.2 \nRelevant dental anatomy \n2.3 \nDental metallurgy \n2.4 \nRelevant material science for carrying out procedures \n2.5 \nUse of surveying equipment \n2.6 \nOHS and material safety data sheets \n2.7 \nCurrent DOH infection control guidelines \n2.8 \nProcessing of wax patterns in acrylic resin \n2.9 \nUsing of vacuum forming procedures \n2.10 Dental Laboratory Materials, splint materials, jaw relations and \nmalocclusions of severe skeletal orthodontic type \n2.11 Range of articulators \n3. Underpinning skills \n3.1 \nManual dexterity \n3.2 \nSurveying and blocking out undercuts \n3.3 \nSelecting articulators \n3.4 \nUsing face-bow and centric records \n3.5 \nPlanning and organizing \n4. Resource \nimplications \nThe following resources MUST be provided: \n4.1 \nA real or simulated dental laboratory environment \n4.2 \nRange of dental laboratory materials, splint materials, jaw \nrelations and malocclusions of severe skeletal orthodontic \ntype \n4.3 \nRange of articulators \n5. Method of \nassessment \nCompetency may be assessed through: \n5.1 \nDemonstration with questioning \n5.2 \nWritten Test/Examination \n5.3 \nThird Party Report \n5.4 \nPortfolio \n6. Context of \nassessment \n6.1 \nCompetency may be assessed in the workplace or in a \nsimulated workplace setting.\n",
        "required_knowledge": null,
        "required_skills": null
      },
