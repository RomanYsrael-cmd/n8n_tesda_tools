          "source_text": "1 \nFollow workplace \nprocedures for \nhazard identification \nand risk control  \n \n1.1 \nHazards in the work area are recognized and reported to \nsupervisor in accordance with workplace procedures. \n1.2 \nWorkplace procedures and work instructions for \ncontrolling risks, including infection control, are followed \naccurately. \n1.3 \nWorkplace procedures for dealing with accidents, fires and \nemergencies are followed where necessary. \n2 \nContribute to the \nmanagement of \nOHS \n2.1 \nOHS issues are raised with designated personnel and co-\nworkers as appropriate. \n2.2 \nContributions are made as appropriate to workplace OHS \ndiscussions. \n3 \nUtilize and \nimplement \nstrategies as \ndirected to prevent \ninfection in the \nworkplace \n3.1 \nThe environment is kept clean and tidy. \n3.2 \nPersonal hygiene practices are followed. \n3.3 \nAny items that may be contaminated are disposed of safely. \n4 \nUtilize strategies to \nprevent stress \noverload \n4.1 \nNominated rest time and breaks are taken. \n4.2 \nSources of stress are identified and issues raised with \nsupervisor. \n4.3 \nWork roles are clarified and followed. \n5 \nWork in a safe \nmanner \n5.1 \nDefined procedures are followed to ensure personal safety. \n5.2 \nAll work is carried out in a manner which ensures safety \nof self and others \n5.3 \nOrganizational security measures are followed. \n5.4 \nSafe manual handling procedures are followed.\n\n--- PDF PAGE 25 ---\nTR Dental Laboratory Technology Services (Removable Dentures/Appliances) NC II                  Amended April 8, 2010    \n \n \n21\nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. \nWorkplace \nprocedures for \ncontrolling risks \n \nMay include: \n1.1 \nManual handling techniques \n1.2 \nSafe handling, storage and disposal of inflammable or \npotentially dangerous substances \n1.5 \nStrategies for reducing the amount of manual handling \nrequired \n2. \nStress \nMay include: \n2.1 \nHealth problems \n2.2 \nChanges in behavior \n2.3 \nFrequent absences \n2.4 \nNegative attitudes \n2.5 \nUnawareness of own stress levels \n3. \nRest time and \nbreaks \nMay include: \n3.1  \nMorning and afternoon tea, lunch, dinner breaks \n4. \nWorkplace \nprocedures \nMay include: \n4.1 \nGrievance procedures \n4.2 \nTeam meetings \n4.3 \nIncident reports \n4.4 \nDebriefing procedures following crisis \n4.5 \nSmoke free environment \n5. \nItems that may be \ncontaminated \nMay include: \n5.1 \nWork surfaces \n5.2 \nClothing \n6. \nWorking in a \nmanner that \nensures personal \nsafety \nMay include: \n6.1 \nCarrying communication equipment \n6.2 \nUsing personal protection equipment \n6.3 \nSafe work practices for handling sharps and other hazards in \ndental laboratory practice \n6.4 \nCarrying alarms \n6.5 \nMaintaining infection control in dental laboratory practice \n7. \nOrganizational \nsecurity measures \nMay include: \n7.1 \nLocking doors \n7.2 \nAlarm system \n7.3 \nContracted security personnel\n\n--- PDF PAGE 26 ---\nTR Dental Laboratory Technology Services (Removable Dentures/Appliances) NC II                  Amended April 8, 2010    \n \n \n22"
