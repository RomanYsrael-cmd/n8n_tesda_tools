        "source_text": "HCS346205\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes required to\ncomply with infection control procedures before, during and after\nhealth care procedures.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1\nMonitor and\nmaintain the\ncleanliness of the\ndental laboratory\n\n1.1\nAppropriate personal protective wear is used during cleaning\nof equipment and surfaces.\n1.2\nAppropriate disinfectants and cleaning equipment are\nselected, prepared and used on surfaces in accordance with\nthe manufacturer’s specification.\n1.3\nUsed surface covers, if applicable, are removed and replaced\nin a manner to prevent cross contamination.\n1.4\nCleaning equipment is correctly stored.\n1.5\nAll surfaces including internal storage units within the dental\nlaboratory are monitored and maintained for cleanliness.\n2\nClean and disinfect\ndental laboratory\n/instruments and\nequipment\n2.1\nDental laboratory instruments and equipment are cleaned of\nbio-burden and lubricated, where appropriate, prior to cleaning\nand disinfecting.\n2.2\nDental laboratory instruments and equipment are checked for\nfaults and disassembled where appropriate.\n2.3\nPrior to cleaning of dental laboratory instruments and\nequipment are loaded safely and effectively.\n2.4\nAppropriate cleaning procedures are carried out in the correct\nsequence and duration in accordance with manufacturer\nspecifications.\n2.5\nRegular maintenance program including faults and incidences\nare recognized, reported and documented.\n\n--- PDF PAGE 28 ---\nTR Dental Laboratory Technology Services (Removable Dentures/Appliances) NC II Amended April 8, 2010\n\n24\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n3\nMaintain hygiene\nand personal\nprotection\n\n3.1\nHand washing procedures are correctly followed.\n3.2\nOpen cuts and abrasions are covered with a waterproof\ndressing.\n3.3\nAppropriate personal protection wear is correctly worn.\n3.4\nImmunization is undertaken in accordance with current\nrecommendations for dental health care worker.\n3.5\nAll work is carried out in a manner that minimizes the risk of\ncross contamination and complies with OHS policy and\nprocedures.\n3.6\nHazards in the dental laboratory is recognized and reported to\noperator.\n3.7\nAppropriate procedures for dealing with accidents, including\nsharp injuries, are followed correctly.\n4\nDispose of dental\nlaboratory waste\nsafely\n4.1\nAppropriate protective clothing is worn or used in accordance\nwith OHS policy and procedures when handling waste.\n4.2\nWaste is segregated, contained, stored and transported\ncorrectly.\n4.3\nDamaged and/or pre-packed items are disposed of safely.\n4.4\nWaste is disposed of safely.\n5\nUndertake the\nnecessary\nmeasures to ensure\nprevention of\ntransmission of\ninfection\n5.1\nRisks of cross contamination are identified and appropriate\nresponses implemented within dental practice.\n5.2\nClean, contaminated and administrative zones are clearly\nidentified and maintained.\n5.3\nInstruments, materials, medicaments and equipment are set\nup prior to commencement of treatment where appropriate.\n5.4\nOne-way workflow from clean to dirty zone is maintained.\n5.5\nRisk of transmission of infection is minimized in all dental\nlaboratory related and administrative procedures.\n5.6\nSpills are removed correctly.\n\n--- PDF PAGE 29 ---\nTR Dental Laboratory Technology Services (Removable Dentures/Appliances) NC II Amended April 8, 2010\n\n25\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1.\nInfection control\nguidelines and\nprocedures\nMay include but are not limited to:\n1.1\nCurrent DOH guidelines for infection control in health care\nsettings\n1.2\nStandard Precautions and Additional Precautions as defined\nby DOH\n1.3\nDental laboratory practice/organizational policy procedures\nand infection control guidelines and procedures\n1.4\nMaterial Safety Data Sheets (MSDS)\n1.5\nLocal government ordinances\n1.6\nLegislative requirements\n2.\nPersonal protective\nwear\nMay include but not limited to:\n2.1\nSterile and non sterile gloves including heavy duty\n2.2\nMasks\n2.3\nEye protection\n2.4\nEnclosed footwear\n2.5\nGowns\n2.6\nAprons\n3.\nCleaning equipment\nMay include but is not limited to:\n3.1\nUltrasonic cleaner\n3.2\nManual cleaning with a range of brushes\n3.3\nDrying\n3.4\nBuckets and mops\n4\nWaste segregation\nMay include but is not limited to:\n4.1\nClinical and related waste\n4.2\nInfectious waste\n4.3\nSharps\n4.4\nGeneral waste\n4.5\nOther hazardous substances\n5\nRequirements for\nsafe disposal of\nwaste\nMay be determined by:\n5.1\nMain drainage\n5.2\nLocal government ordinances\n5.3\nMaterial Safety Data Sheet (MSDS)\n\n--- PDF PAGE 30 ---\nTR Dental Laboratory Technology Services (Removable Dentures/Appliances) NC II Amended April 8, 2010\n\n26\nEVIDENCE GUIDE\n\n1.\nCritical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nDemonstrated knowledge of infection risks in health\nenvironment and specifically in dental laboratory practice\n1.2\nComplied with current DOH infection control guidelines and\nprocedures, OHS and legislative requirements\n1.3\nHandled waste safely managed procedures in accordance\nwith legislative requirements\n1.4\nSelected and used appropriate cleaning agents for particular\nsurfaces and equipment in accordance with the\nmanufacturer’s specifications\n2.\nUnderpinning\nknowledge\n2.1\nKnowledge on how infection is spread, cross infection and\nprevention strategies\n2.2\nKnowledge of relevant OHS policies and procedures\n2.3\nLimitations, properties and precautions required of\ndisinfectants and decontaminates\n2.4\nKnowledge of potential hazards in a health environment\n2.5\nKnowledge of currently available vaccinations against\ntransmissible disease\n2.6\nKnowledge of dental laboratory waste disposal methods\n3.\nUnderpinning skills\n3.1\nApplying standard and additional precautions\n3.2\nUsing safe work practices to minimize the risk of transmission\nof infection\n3.3\nSelecting and using appropriate chemicals in cleaning and\nsanitizing\n3.4\nUsing correct hand washing and hand care techniques\n3.5\nUsing correct hygiene procedures\n3.6\nSelecting and using equipment and cleaning agents effectively\n3.7\nUsing procedures appropriate to the cleaning area and\npurpose\n3.8\nMinimizing disruption to the work environment\n3.9\nMinimizing safety hazards for self and others\n3.10 Using time management strategies to set priorities\n3.11\nUsing technology to work safely and competently\n4.\nResource\nimplications\n\nThe following resources MUST be provided:\n4.1\nRelevant dental laboratory practice/organizational policy and\nprocedures\n4.2\nIncident reporting procedures\n4.3\nOccupational health and safety policy and procedures\n4.4\nInfection control guidelines\n4.5\nWaste management policies\n4.6\nRelevant state legislations\n4.7\nManufacturer’s instructions for the use of relevant equipment,\ninstruments, medicaments, materials and Material Safety Data\nSheets (MSDS)\n4.8\nCleaning agents currently used in the workplace\n\n--- PDF PAGE 31 ---\nTR Dental Laboratory Technology Services (Removable Dentures/Appliances) NC II Amended April 8, 2010\n\n27\n\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1\nWritten Test/Examination\n5.2\nDemonstration with questioning\n5.3\nObservation with questioning\n5.4\nPortfolio\n5.5\nThird Party Report\n6. Context of\nassessment\n6.1\nCompetency may be assessed in the workplace or in a\nsimulated work setting.\n\n--- PDF PAGE 32 ---\nTR Dental Laboratory Technology Services (Removable Dentures/Appliances) NC II Amended April 8, 2010\n\n28\n\nUNIT TITLE\n:\nOPERATE A PERSONAL COMPUTER\nUNIT CODE\n:"
