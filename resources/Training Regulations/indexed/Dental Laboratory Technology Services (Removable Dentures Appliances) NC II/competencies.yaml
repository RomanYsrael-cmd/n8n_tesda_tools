          "source_text": "1. Critical aspect of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nPrepared case for setting of teeth\n1.2\nArranged artificial teeth\n1.3\nWaxed up denture for try-in\n1.4\nComplied with infection control policies and procedures\n1.5\nFollowed OH&S policies and procedures\n2. Underpinning\nknowledge\n2.1\nRange of articulators\n2.2\nSelection of artificial teeth\n2.3\nArticulation and occlusion\n2.4\nTooth morphology\n2.5\nCurrent DOH infection control guidelines\n2.6\nRelevant material science for carrying out procedures\n2.7\nOH&S and material safety data sheets\n2.8\nIndustry Codes of Practice\n2.9\nRelevant laws as appropriate\n2.10 Housekeeping and maintenance procedures\n3. Underpinning skills\n3.1\nManual dexterity\n3.2\nMaintaining a healthy and safe working environment\n3.3\nSelecting artificial teeth\n3.4\nMaintaining personal hygiene\n3.5\nPlanning and organizing work activities\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 A real or simulated dental laboratory environment\n4.2 Relevant documentation such as:\n4.2.1 industry codes of practice\n4.2.2 relevant laws as appropriate\n4.2.3 housekeeping/maintenance procedures\n4.3 Range of articulators\n4.3\nA qualified workplace assessor and/or a technical expert\nworking in partnership with assessor\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1 Demonstration with questioning\n5.2 Written Test/Examination\n5.3 Third Party Report\n5.4 Portfolio\n6. Context of\nassessment\n6.1\nCompetency may be assessed in the workplace or in a\nsimulated workplace setting.\n\n--- PDF PAGE 38 ---\nTR Dental Laboratory Technology Services (Removable Dentures/Appliances) NC II Amended April 8, 2010\n\n34\n\nUNIT OF COMPETENCY :\nSET-UP AND WAX REMOVABLE PARTIAL DENTURES\nUNIT CODE\n\n :"
        },
        "source_text": "HCS322328\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes required in the\nselection, arrangement and wax contouring of a complete denture.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Prepare case for\nsetting of teeth\n1.1\nArtificial teeth are selected to work order.\n1.2\nBases and rims are modified as required for positioning of\nteeth.\n2 Arrange artificial\nteeth\n2.1\nWork order is followed.\n2.2\nTeeth are positioned to achieve aesthetics and centric\nocclusion, balanced articulation and balanced occlusion.\n2.3\nTeeth are secured in wax and contoured to gingival outline.\n3. Wax up denture for\ntry-in\n3.1\nWax is applied as required.\n3.2\nFacial and lingual aspects are contoured.\n3.3\nMuscle attachments are located and relieved.\n3.4\nPeripheral extensions are smoothened and rounded.\n3.5\nDistal extensions are confirmed.\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Dentures\nMay include but are not limited to:\n1.1\nComplete maxillary or complete mandibular\n1.2\nCombined complete maxillary and complete mandibular.\n\n--- PDF PAGE 37 ---\nTR Dental Laboratory Technology Services (Removable Dentures/Appliances) NC II Amended April 8, 2010\n\n33\n\nEVIDENCE GUIDE\n\n1. Critical aspect of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nPrepared case for setting of teeth\n1.2\nArranged artificial teeth\n1.3\nWaxed up denture for try-in\n1.4\nComplied with infection control policies and procedures\n1.5\nFollowed OH&S policies and procedures\n2. Underpinning\nknowledge\n2.1\nRange of articulators\n2.2\nSelection of artificial teeth\n2.3\nArticulation and occlusion\n2.4\nTooth morphology\n2.5\nCurrent DOH infection control guidelines\n2.6\nRelevant material science for carrying out procedures\n2.7\nOH&S and material safety data sheets\n2.8\nIndustry Codes of Practice\n2.9\nRelevant laws as appropriate\n2.10 Housekeeping and maintenance procedures\n3. Underpinning skills\n3.1\nManual dexterity\n3.2\nMaintaining a healthy and safe working environment\n3.3\nSelecting artificial teeth\n3.4\nMaintaining personal hygiene\n3.5\nPlanning and organizing work activities\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 A real or simulated dental laboratory environment\n4.2 Relevant documentation such as:\n4.2.1 industry codes of practice\n4.2.2 relevant laws as appropriate\n4.2.3 housekeeping/maintenance procedures\n4.3 Range of articulators\n4.3\nA qualified workplace assessor and/or a technical expert\nworking in partnership with assessor\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1 Demonstration with questioning\n5.2 Written Test/Examination\n5.3 Third Party Report\n5.4 Portfolio\n6. Context of\nassessment\n6.1\nCompetency may be assessed in the workplace or in a\nsimulated workplace setting.\n\n--- PDF PAGE 38 ---\nTR Dental Laboratory Technology Services (Removable Dentures/Appliances) NC II Amended April 8, 2010\n\n34\n\nUNIT OF COMPETENCY :\nSET-UP AND WAX REMOVABLE PARTIAL DENTURES\nUNIT CODE\n\n :"
