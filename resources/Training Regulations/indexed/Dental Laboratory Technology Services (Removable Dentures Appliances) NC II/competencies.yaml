          "source_text": "1.  Prepare case for \nsetting of teeth \n1.1 \nArtificial teeth are selected to work order. \n1.2 \nBases and rims are modified as required for positioning of \nteeth. \n2 Arrange artificial \nteeth \n2.1 \nWork order is followed. \n2.2 \nTeeth are positioned to achieve aesthetics and centric \nocclusion, balanced articulation and balanced occlusion. \n2.3 \nTeeth are secured in wax and contoured to gingival outline. \n3.  Wax up denture for \ntry-in \n3.1 \nWax is applied as required. \n3.2 \nFacial and lingual aspects are contoured. \n3.3 \nMuscle attachments are located and relieved. \n3.4 \nPeripheral extensions are smoothened and rounded. \n3.5 \nDistal extensions are confirmed. \n \n \n \n \n \n \n \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Dentures  \nMay include but are not limited to: \n1.1 \nComplete maxillary or complete mandibular  \n1.2 \nCombined complete maxillary and complete mandibular.\n\n--- PDF PAGE 37 ---\nTR Dental Laboratory Technology Services (Removable Dentures/Appliances) NC II                  Amended April 8, 2010    \n \n \n33"
