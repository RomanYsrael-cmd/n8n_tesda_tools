        "evidence_guide": {
          "source_text": "1. Critical aspect of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Waxed case for finish consistent with work orders\n1.2 Selected and prepared materials and processing techniques\n1.3 Processed denture or appliance\n1.4 Grind dentures and appliances selectively\n1.5 Finished denture or appliance\n1.6 Complied with infection control policies and procedures\n1.7 Followed OH&S policies\n2. Underpinning\nknowledge\n2.1 Relevant material science for carrying out procedures\n2.2 Tooth morphology and anatomy\n2.3 OH&S and materials safety data sheets\n2.4 Current DOH infection control guidelines\n2.5 Workplace Policy and Procedures Manuals\n2.6 Product Labels and Sources of Product Information\n3. Underpinning skills\n3.1\nManual dexterity\n3.2\nMaintaining a healthy and safe working environment\n3.3\nMaintaining personal hygiene\n3.4\nPlanning and organizing work activities\n4. Resource implication\nThe following resources MUST be provided:\n4.1 Relevant documentation, such as:\n - workplace policy and procedures manuals\n4.2 Access to a range of clients with different requirements\n4.3 A range of equipment and products appropriate to the\nworkplace\n4.4\n Product labels and sources of product information\n4.5\nA qualified workplace assessor or assessment team\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1 Demonstration with questioning\n5.2 Written Test/Examination\n5.3 Third party Report\n5.4\nPortfolio\n6. Context of\nassessment\n6.1\nAssessment may be conducted in the workplace or in a\nsimulated environment\n\n--- PDF PAGE 42 ---\nTR Dental Laboratory Technology Services (Removable Dentures/Appliances) NC II Amended April 8, 2010\n\n38\nUNIT OF COMPETENCY :\nFABRICATE THERMO-FORMED BASES AND APPLIANCES\n\nUNIT CODE\n:"
