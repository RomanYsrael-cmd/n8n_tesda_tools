        "source_text": "--- PDF PAGE 18 ---\nTR Dental Laboratory Technology Services (Removable Dentures/Appliances) NC II                  Amended April 8, 2010    \n \n \n14\n \nCOMMON COMPETENCIES \n \nUNIT OF COMPETENCY  : \nMAINTAIN AN EFFECTIVE RELATIONSHIP WITH CLIENTS AND \nCUSTOMERS \nUNIT CODE                  \n:    HCS516201 \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge, skills and attitudes and values \nrequired in building and maintaining an effective relationship with \nclients, customers and the public. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables\n1. Maintain a clean and \nhygienic environment \n \n1.1 \nUniform and personal grooming maintained to assignment \nrequirements. \n1.2 \nPersonal presence maintained according to employer \nstandards. \n1.3 \nVisible work area kept tidy and uncluttered. \n1.4 \nEquipment stored according to assignment requirements. \n \n2. Meet client/customer \nrequirements \n \n2.1 \nClient requirements identified and understood by referral to \nassignment instructions. \n2.2 \nClient requirements met according to the assignment \ninstructions. \n2.3 \nChanges to client’s needs and requirements monitored and \nappropriate action taken. \n2.4 \nAll communication with client or customer is cleared and \ncomplied with assignment requirements. \n \n3.  Build credibility with \ncustomers/clients \n3.1 \nClient expectations for reliability, punctuality and appearance \nadhered to. \n3.2 \nPossible causes of client/customer dissatisfaction identified, \ndealt with recorded according employer policy. \n3.3 \nClient fully informed of all relevant matters in a timely manner \nand according to agreed reporting procedures.\n\n--- PDF PAGE 19 ---\nTR Dental Laboratory Technology Services (Removable Dentures/Appliances) NC II                  Amended April 8, 2010    \n \n \n15\nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Personal Presence \nMay include but not limited to: \n1.1 \nStance \n1.2 \nPosture \n1.3 \nBody Language \n1.4 \nDemeanor \n1.5 \nGrooming \n \n 2. Employer Standards \nMay include but not limited to: \n2.1 \nStanding Orders \n \n3. Client Requirements  \nMay include but are not limited to: \n3.1 \nAssignment instructions \n3.2 \nPost Orders \n3.3 \nScope to modify instructions/orders in light of changed \nsituations \n \n4. Assignment \nInstructions \nMay be conveyed in: \n4.1 \nWriting \n4.2 \nVerbally \n4.3 \nElectronically \n \n5. Client Needs and \nRequirements \nMay be detected by: \n5.1 \nReview of the client brief and/or assignment instructions \n5.2 \nDiscussion with the client/customer \n \n6. Appropriate Action \nMay include: \n6.1 \nImplementing required changes \n6.2 \nReferring to appropriate employer personnel \n6.3 \nClarification of client needs and instructions \n6.4 \nHazard reports \n \n7.  Customers \nMay include: \n7.1 \nAll members of the public\n\n--- PDF PAGE 20 ---\nTR Dental Laboratory Technology Services (Removable Dentures/Appliances) NC II                  Amended April 8, 2010    \n \n \n16\nEVIDENCE GUIDE \n \n1. Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1 \nMaintained a professional image \n1.2 \nInterpreted client/customer requirements from information \n1.3 \nDealt successfully with a variety of client/customer interactions\n1.4 \nMonitored and acted on changing client or customer needs \n1.5 \nMet client/customer requirements \n1.6 \nBuilt credibility with customers/client \n2. Underpinning \nknowledge  \n2.1 \nUniform and personal grooming requirements of the employer \n2.2 \nOccupational health and safety requirement for the \nassignment \n2.3 \nAssignment Instructions \n3. Underpinning skills  \n3.1      Attention to detail when completing client/employer \ndocumentation \n3.2 \nInterpersonal and communication skills required in client \ncontact assignments \n3.3 \nCustomer service skills required to meet client/customer \nneeds \n3.4 \nPunctuality \n3.5 \nCustomer Service \n3.6 \nTelephone Technique \n3.7 \nProblem Solving and Negotiation \n3.8 \nMaintaining Records \n4. Resource \nimplications \nThe following resources MUST be provided \n4.1 \nAssessment Centers/Venues \n4.2 \nAccredited Assessors \n4.3 \nModes of Assessment \n4.4 \nEvaluation Reports  \n4.5 \nAccess to a relevant venue, equipment and materials  \n4.6 \nAssignment Instructions \n4.7 \nLogbooks \n4.8 \nOperational manuals and makers/customers’ instructions \n4.9 \nAssessment instruments, including personal planner and \nassessment record book \n5. Method of \nassessment \nCompetency may be assessed through: \n5.1 \nWritten Test  \n5.2 \nDemonstration with questioning \n5.3 \nObservation with questioning \n6. Context of \nassessment \n6.1    Assessment may be done in the workplace or in a simulated \nworkplace setting.\n",
