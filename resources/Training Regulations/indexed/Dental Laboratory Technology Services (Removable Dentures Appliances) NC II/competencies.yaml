        "source_text": "HCS322331\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes concerned with\nfabrication of alloy removable partial denture framework.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Prepare master\nmodel\n1.1\nWork order is interpreted.\n1.2\nAlloy is selected\n1.3\nModel is surveyed.\n1.4\nDesigned is transferred to master model.\n1.5\nUndesirable undercuts are blocked out.\n1.6\nClasp ledges are created.\n1.7\nFinished lines are scribed.\n1.8\nTissue relief is applied.\n1.9\nSaddle relief is applied.\n2. Construct refractory\nmodel\n2.1\nMaster model is duplicated in refractory material and sprue\nformer is constructed, as necessary.\n2.2\nRefractory model surface is treated.\n3. Wax and invest\nremovable partial\ndenture framework\n3.1\nDesign is transferred to refractory model.\n3.2\nPatterns and waxes are selected.\n3.3\nPatterns are waxed up and sprues attached.\n3.4\nAppropriate investment and technique are selected.\n3.5\nInvestment material is prepared.\n3.6\nWax, patterns and sprues are treated.\n3.7\nInvestment setting time is allowed for.\n4. Burn out, cast and\nfinish removable\npartial denture\nframework\n4.1\nBurn out and preheat cycles are selected for appropriate\ninvestment/alloy combination.\n4.2\nInvestment mould is burnt out and preheated.\n4.3\nAlloy is melted and cast using appropriate\nequipment/technique.\n4.4\nCooling cycle is selected and applied.\n4.5\nDenture framework is devested.\n4.6\nDenture framework is trimmed, shaped, treated, finished and\nfitted to master model.\n4.7\nFramework is treated in accordance with DOH infection\ncontrol guidelines.\n\n--- PDF PAGE 53 ---\nTR Dental Laboratory Technology Services (Removable Dentures/Appliances) NC II Amended April 8, 2010\n\n49\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n 1. Alloy\nMay include but are not limited to:\n1.1 Cobalt chromium based alloys\n1.2 Gold alloys\n1.3 Metal/ceramic alloys\n\n2. Melting/casting\ntechniques\nMay include but are not limited to:\n2.1 Flame melting\n2.2 Induction melting\n2.3 Resistance melting\n2.4 Centrifugal casting\n2.5 Gas pressure casting\n2.6 Vacuum casting\n\n--- PDF PAGE 54 ---\nTR Dental Laboratory Technology Services (Removable Dentures/Appliances) NC II Amended April 8, 2010\n\n50\n\nEVIDENCE GUIDE\n\n1. Critical aspect of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Selected and prepared materials for fabrication of metal/cast\nmetal alloy\n1.2 Fabricated base and registration rim\n1.3 Prepared face-bow (if required)\n1.4 Complied with infection control policies and procedures\n1.5 Followed OH&S policies\n2. Underpinning\nknowledge\n2.1 Dental alloy\n2.2 Relevant material science for carrying out procedures\n2.3 Solidification\n2.4 Melting and casting\n2.5 Heat treatment\n2.6 Surface finishing\n2.7 Industry Codes of Practice\n2.8 Relevant Laws as appropriate\n2.9 Housekeeping Maintenance\n3. Underpinning skills\n3.1 Manual dexterity\n3.2 Maintaining a healthy and safe working environment\n3.3 Melting and casting techniques\n3.4 Maintaining personal hygiene\n3.5 Planning and organizing work activities\n4. Resource implication\nThe following resources MUST be provided:\n4.1 A real or simulated dental laboratory environment\n4.2 Relevant documentation, such as:\n4.2.1 industry codes of practice\n4.2.2 state legislation as appropriate\n4.2.3 housekeeping/maintenance\n4.3 Dental alloys\n4.4 A qualified workplace assessor and/or a technical expert\nworking in partnership with the assessor\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1 Demonstration with questioning\n5.2 Written Test/Examination\n5.3 Third Party Report\n5.4 Portfolio\n6. Context of\nassessment\n6.1\nAssessment may be conducted in the workplace or in a\nsimulated environment\n\n--- PDF PAGE 55 ---\nTR Dental Laboratory Technology Services (Removable Dentures/Appliances) NC II Amended April 8, 2010\n\n51"
      }
    ]
  },
  "source_section_text": "SECTION 2 COMPETENCY STANDARDS\n\nThis section gives the details of the contents of the basic, common and core units of\ncompetency required in DENTAL LABORATORY TECHNOLOGY SERVICES (Removable\nDentures/Appliances) NC II.\n\nBASIC COMPETENCIES\n\nUNIT OF COMPETENCY : PARTICIPATE IN WORKPLACE COMMUNICATION\nUNIT CODE\n: 500311105\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes required to\ngather, interpret and convey information in response to workplace\nrequirements.\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Obtain and convey\nworkplace\ninformation\n1.1\nSpecific and relevant information is accessed from\nappropriate sources.\n1.2\nEffective questioning, active listening and speaking skills are\nused to gather and convey information.\n1.3\nAppropriate medium is used to transfer information and ideas\n1.4\nAppropriate non- verbal communication is used.\n1.5\nAppropriate lines of communication with supervisors and\ncolleagues are identified and followed.\n1.6\nDefined workplace procedures for the location and storage of\ninformation are used.\n1.7\nPersonal interaction is carried out clearly and concisely.\n2. Participate in\nworkplace meetings\nand discussions\n2.1\nTeam meetings are attended on time.\n2.2\nOwn opinions are clearly expressed and those of others are\nlistened to without interruption.\n2.3\nMeeting inputs are consistent with the meeting purpose and\nestablished protocols.\n2.4\nWorkplace interactions are conducted in a courteous\nmanner.\n2.5\nQuestions about simple routine workplace procedures and\nmaters concerning working conditions of employment are\nasked and responded to.\n2.6\nMeetings outcomes are interpreted and implemented.\n3. Complete relevant\nwork related\ndocuments\n3.1\nRange of forms relating to conditions of employment is\ncompleted accurately and legibly.\n3.2\nWorkplace data is recorded on standard workplace forms and\ndocuments.\n3.3\nBasic mathematical processes are used for routine\ncalculations.\n3.4\nErrors in recording information on forms/ documents are\nidentified and properly acted upon.\n3.5\nReporting requirements to supervisor are completed\naccording to organizational guidelines.\n\n--- PDF PAGE 7 ---\nTR Dental Laboratory Technology Services (Removable Dentures/Appliances) NC II Amended April 8, 2010\n\n3\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Appropriate sources\n1.1\nTeam members\n1.2\nSuppliers\n1.3\nTrade personnel\n1.4\nLocal government\n1.5\nIndustry bodies\n2. Medium\n2.1\nMemorandum\n2.2\nCircular\n2.3\nNotice\n2.4\nInformation discussion\n2.5\nFollow-up or verbal instructions\n2.6\nFace to face communication\n3. Storage\n3.1\nManual filing system\n3.2\nComputer-based filing system\n4. Forms\n4.1\nPersonnel forms, telephone message forms, safety reports\n5. Workplace\ninteractions\n5.1\nFace to face\n5.2\nTelephone\n5.3\nElectronic and two way radio\n5.4\nWritten including electronic, memos, instruction and forms,\nnon-verbal including gestures, signals, signs and diagrams\n6. Protocols\n6.1\nObserving meeting\n6.2\nCompliance with meeting decisions\n6.3\nObeying meeting instructions\n\n--- PDF PAGE 8 ---\nTR Dental Laboratory Technology Services (Removable Dentures/Appliances) NC II Amended April 8, 2010\n\n4\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nPrepared written communication following standard format of\nthe organization\n1.2\nAccessed information using communication equipment\n1.3\nMade use of relevant terms as an aid to transfer information\neffectively\n1.4\nConveyed information effectively adopting the formal or\ninformal communication\n2. Underpinning\nknowledge\n\n2.1\nEffective communication\n2.2\nDifferent modes of communication\n2.3\nWritten communication\n2.4\nOrganizational policies\n2.5\nCommunication procedures and systems\n2.6\nTechnology relevant to the enterprise and the individual’s\nwork responsibilities\n3. Underpinning skills\n3.1\nFollow simple spoken language\n3.2\nPerform routine workplace duties following simple written\nnotices\n3.3\nParticipate in workplace meetings and discussions\n3.4\nComplete work related documents\n3.5\nEstimate, calculate and record routine workplace measures\n3.6\nBasic mathematical processes of addition, subtraction,\ndivision and multiplication\n3.7\nAbility to relate to people of social range in the workplace\n3.8\nGather and provide information in response to workplace\nRequirements\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nFax machine\n4.2\nTelephone\n4.3\nWriting materials\n4.4\nInternet\n5. Method of\nassessment\nCompetency MUST be assessed through:\n5.1\nDirect observation with questioning\n5.2\nOral interview and written test\n6. Context of\nassessment\n6.1\nCompetency may be assessed individually in the actual\nworkplace or through accredited institution\n\n--- PDF PAGE 9 ---\nTR Dental Laboratory Technology Services (Removable Dentures/Appliances) NC II Amended April 8, 2010\n\n5\n\nUNIT OF COMPETENCY :\nWORK IN A TEAM ENVIRONMENT\nUNIT CODE\n: 500311106\nUNIT DESCRIPTOR\n:\nThis unit covers the skills, knowledge and attitudes to identify role\nand responsibility as a member of a team.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Describe team role\nand scope\n1.1\nThe role and objective of the team is identified from\navailable sources of information.\n1.2\nTeam parameters, reporting relationships and responsibilities\nare identified from team discussions and appropriate external\nsources.\n2. Identify own role and\nresponsibility within\nteam\n2.1\nIndividual role and responsibilities within the team\nenvironment are identified.\n2.2\nRoles and responsibility of other team members are identified\nand recognized.\n2.3\nReporting relationships within team and external to team are\nidentified.\n3. Work as a team\nmember\n3.1\nEffective and appropriate forms of communications used and\ninteractions undertaken with team members who contribute to\nknown team activities and objectives.\n3.2\nEffective and appropriate contributions made to complement\nteam activities and objectives, based on individual skills and\ncompetencies and workplace context.\n3.3\nObserved protocols in reporting using standard operating\nprocedures.\n3.4\nContribute to the development of team work plans based on\nan understanding of team’s role and objectives and individual\ncompetencies of the members.\n\n--- PDF PAGE 10 ---\nTR Dental Laboratory Technology Services (Removable Dentures/Appliances) NC II Amended April 8, 2010\n\n6\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Role and objective of\nteam\n1.1\nWork activities in a team environment with enterprise or\nspecific sector\n1.2\nLimited discretion, initiative and judgment maybe\ndemonstrated on the job, either individually or in a team\nenvironment\n2. Sources of\ninformation\n2.1\nStandard operating and/or other workplace procedures\n2.2\nJob procedures\n2.3\nMachine/equipment manufacturer’s specifications and\ninstructions\n2.4\nOrganizational or external personnel\n2.5\nClient/supplier instructions\n2.6\nQuality standards\n2.7\nOHS and environmental standards\n3. Workplace context\n3.1\nWork procedures and practices\n3.2\nConditions of work environments\n3.3\nLegislation and industrial agreements\n3.4\nStandard work practice including the storage, safe handling\nand disposal of chemicals\n3.5\nSafety, environmental, housekeeping and quality guidelines\n\n--- PDF PAGE 11 ---\nTR Dental Laboratory Technology Services (Removable Dentures/Appliances) NC II Amended April 8, 2010\n\n7\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nOperated in a team to complete workplace activity\n1.2\nWorked effectively with others\n1.3\nConveyed information in written or oral form\n1.4\nSelected and used appropriate workplace language\n1.5\nFollowed designated work plan for the job\n1.6\nReported outcomes\n2. Underpinning\nknowledge\n2.1\nCommunication process\n2.2\nTeam structure\n2.3\nTeam roles\n2.4\nGroup planning and decision making\n3. Underpinning skills\n3.1\nCommunicate appropriately, consistent with the culture of the\nworkplace\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nAccess to relevant workplace or appropriately simulated\nenvironment where assessment can take place\n4.2\nMaterials relevant to the proposed activity or tasks\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1\nObservation of the individual member in relation to the work\nactivities of the group\n5.2\nObservation of simulation and or role play involving the\nparticipation of individual member to the attainment of\norganizational goal\n5.3\nCase studies and scenarios as a basis for discussion of\nissues and strategies in teamwork\n6. Context of\nassessment\n6.1\nCompetency may be assessed in workplace or in a simulated\nworkplace setting\n6.2\nAssessment shall be observed while task are being\nundertaken whether individually or in group\n\n--- PDF PAGE 12 ---\nTR Dental Laboratory Technology Services (Removable Dentures/Appliances) NC II Amended April 8, 2010\n\n8\nUNIT OF COMPETENCY : PRACTICE CAREER PROFESSIONALISM\nUNIT CODE\n:\n500311107\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes in promoting\ncareer growth and advancement.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Integrate personal\nobjectives with\norganizational goals\n1.1\nPersonal growth and work plans are pursued towards\nimproving the qualifications set for the profession.\n1.2\nIntra and interpersonal relationships is are maintained in the\ncourse of managing oneself based on performance\nevaluation.\n1.3\nCommitment to the organization and its goal is demonstrated\nin the performance of duties.\n2. Set and meet work\npriorities\n2.1\nCompeting demands are prioritized to achieve personal, team\nand organizational goals and objectives.\n2.2\nResources are utilized efficiently and effectively to manage\nwork priorities and commitments.\n2.3\nPractices along economic use and maintenance of equipment\nand facilities are followed as per established procedures.\n3. Maintain professional\ngrowth and\ndevelopment\n3.1\nTrainings and career opportunities are identified and\navailed of based on job requirements.\n3.2\nRecognitions are sought/received and demonstrated as\nproof of career advancement.\n3.3\nLicenses and/or certifications relevant to job and career are\nobtained and renewed.\n\n--- PDF PAGE 13 ---\nTR Dental Laboratory Technology Services (Removable Dentures/Appliances) NC II Amended April 8, 2010\n\n9\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Evaluation\n1.1\nPerformance Appraisal\n1.2\nPsychological Profile\n1.3\nAptitude Tests\n2. Resources\n2.1\nHuman\n2.2\nFinancial\n2.3\nTechnology\n2.3.1 Hardware\n2.3.2 Software\n3. Trainings and career\nopportunities\n3.1\nParticipation in training programs\n3.1.1 Technical\n3.1.2 Supervisory\n3.1.3 Managerial\n3.1.4 Continuing Education\n3.2 Serving as Resource Persons in conferences and workshops\n4. Recognitions\n4.1\nRecommendations\n4.2\nCitations\n4.3\nCertificate of Appreciations\n4.4\nCommendations\n4.5\nAwards\n4.6\nTangible and Intangible Rewards\n5. Licenses and/or\ncertifications\n5.1\nNational Certificates\n5.2\nCertificate of Competency\n5.3\nSupport Level Licenses\n5.4\nProfessional Licenses\n\n--- PDF PAGE 14 ---\nTR Dental Laboratory Technology Services (Removable Dentures/Appliances) NC II Amended April 8, 2010\n\n10\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nAttained job targets within key result areas (KRAs)\n1.2\nMaintained intra - and interpersonal relationship in the course\nof managing oneself based on performance evaluation\n1.3\nCompleted trainings and career opportunities which are based\non the requirements of the industries\n1.4\nAcquired and maintained licenses and/or certifications\naccording to the requirement of the qualification\n2. Underpinning\nknowledge\n2.1\nWork values and ethics (Code of Conduct, Code of Ethics,\netc.)\n2.2\nCompany policies\n2.3\nCompany operations, procedures and standards\n2.4\nFundamental rights at work including gender sensitivity\n2.5\nPersonal hygiene practices\n3. Underpinning skills\n3.1\nAppropriate practice of personal hygiene\n3.2\nIntra and Interpersonal skills\n3.3\nCommunication skills\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nWorkplace or assessment location\n4.2\nCase studies/scenarios\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1\nPortfolio Assessment\n5.2\nInterview\n5.3\nSimulation/Role-plays\n5.4\nObservation with questioning\n5.5\nThird Party Reports\n5.6\nExams and Tests\n6. Context of\nassessment\n6.1\nCompetency may be assessed in the work place or in a\nsimulated work place setting\n\n--- PDF PAGE 15 ---\nTR Dental Laboratory Technology Services (Removable Dentures/Appliances) NC II Amended April 8, 2010\n\n11\nUNIT OF COMPETENCY : PRACTICE OCCUPATIONAL HEALTH AND SAFETY\nPROCEDURES\nUNIT CODE\n:\n500311108\nUNIT DESCRIPTOR\n:\nThis unit covers the outcomes required to comply with regulatory\nand organizational requirements for occupational health and safety.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Identify hazards and\nrisks\n1.1\nSafety regulations and workplace safety and hazard control\npractices and procedures are clarified and explained based on\norganization procedures.\n1.2\nHazards/risks in the workplace and their corresponding\nindicators are identified to minimize or eliminate risk to co-\nworkers, workplace and environment in accordance with\norganization procedures.\n1.3\nContingency measures during workplace accidents, fire and\nother emergencies are recognized and established in\naccordance with organization procedures.\n2. Evaluate hazards and\nrisks\n2.1\nTerms of maximum tolerable limits which when exceeded will\nresult in harm or damage are identified based on threshold\nlimit values (TLV).\n2.2\nEffects of the hazards are determined.\n2.3\n OHS issues and/or concerns and identified safety hazards\nare reported to designated personnel in accordance with\nworkplace requirements and relevant workplace OHS\nlegislation.\n3. Control hazards and\nrisks\n3.1\nOccupational Health and Safety (OHS) procedures for\ncontrolling hazards/risks in workplace are consistently\nfollowed.\n3.2\nProcedures for dealing with workplace accidents, fire and\nemergencies are followed in accordance with organization\nOHS policies.\n3.3\nPersonal protective equipment (PPE) is correctly used in\naccordance with organization OHS procedures and practices.\n3.4\nAppropriate assistance is provided in the event of a workplace\nemergency in accordance with established organization\nprotocol.\n4. Maintain OHS\nawareness\n4.1\nEmergency-related drills and trainings are participated in\nas per established organization guidelines and procedures.\n4.2\nOHS personal records are completed and updated in\naccordance with workplace requirements.\n\n--- PDF PAGE 16 ---\nTR Dental Laboratory Technology Services (Removable Dentures/Appliances) NC II Amended April 8, 2010\n\n12\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Safety regulations\nMay include but are not limited to:\n1.1\nClean Air Act\n1.2\nBuilding code\n1.3\nNational Electrical and Fire Safety Codes\n1.4\nWaste management statutes and rules\n1.5\nPhilippine Occupational Safety and Health Standards\n1.6\nDOLE regulations on safety legal requirements\n1.7\nECC regulations\n2. Hazards/risks\nMay include but are not limited to:\n2.1\nPhysical hazards – impact, illumination, pressure, noise,\nvibration, temperature, radiation\n2.2\nBiological hazards- bacteria, viruses, plants, parasites, mites,\nmolds, fungi, insects\n2.3\nChemical hazards – dusts, fibers, mists, fumes, smoke,\ngasses, vapors\n2.4\nErgonomics\n• Psychological factors – over exertion/ excessive force,\nawkward/static positions, fatigue, direct pressure, varying\nmetabolic cycles\n• Physiological factors – monotony, personal relationship,\nwork out cycle\n3. Contingency\nmeasures\nMay include but are not limited to:\n3.1\nEvacuation\n3.2\nIsolation\n3.3\nDecontamination\n3.4\n(Calling designed) emergency personnel\n4. PPE\nMay include but are not limited to:\n4.1\nMask\n4.2\nGloves\n4.3\nGoggles\n4.4\nHair Net/cap/bonnet\n4.5\nFace mask/shield\n4.6\nEar muffs\n4.7\nApron/Gown/coverall/jump suit\n4.8\nAnti-static suits\n5. Emergency-related\ndrills and training\n5.1\nFire drill\n5.2\nEarthquake drill\n5.3\nBasic life support/CPR\n5.4\nFirst aid\n5.5\nSpillage control\n5.6\nDecontamination of chemical and toxic\n5.7\nDisaster preparedness/management\n6. OHS personal\nrecords\n6.1\nMedical/Health records\n6.2\nIncident reports\n6.3\nAccident reports\n6.4\nOHS-related training completed\n\n--- PDF PAGE 17 ---\nTR Dental Laboratory Technology Services (Removable Dentures/Appliances) NC II Amended April 8, 2010\n\n13\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nExplained clearly established workplace safety and hazard\ncontrol practices and procedures\n1.2\nIdentified hazards/risks in the workplace and its corresponding\nindicators in accordance with company procedures\n1.3\nRecognized contingency measures during workplace\naccidents, fire and other emergencies\n1.4\nIdentified terms of maximum tolerable limits based on\nthreshold limit value- TLV.\n1.5\nFollowed Occupational Health and Safety (OHS) procedures\nfor controlling hazards/risks in workplace\n1.6\nUsed Personal Protective Equipment (PPE) in accordance\nwith company OHS procedures and practices\n1.7\nCompleted and updated OHS personal records in accordance\nwith workplace requirements\n2. Underpinning\nknowledge\n2.1\nOHS procedures and practices and regulations\n2.2\nPPE types and uses\n2.3\nPersonal hygiene practices\n2.4\nHazards/risks identification and control\n2.5\nThreshold Limit Value -TLV\n2.6\nOHS indicators\n2.7\nOrganization safety and health protocol\n2.8\nSafety consciousness\n2.9\nHealth consciousness\n3. Underpinning\n skills\n3.1 Practice of personal hygiene\n3.2\nHazards/risks identification and control skills\n3.3\nInterpersonal skills\n3.4 Communication skills\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\n Workplace or assessment location\n4.2\nOHS personal records\n4.3\nPPE\n4.4\nHealth records\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1\nPortfolio Assessment\n5.2\nInterview\n5.3\nCase Study/Situation\n6. Context of\nassessment\n6.1\nCompetency may be assessed in the work place or in a\nsimulated work place setting\n\n--- PDF PAGE 18 ---\nTR Dental Laboratory Technology Services (Removable Dentures/Appliances) NC II Amended April 8, 2010\n\n14\n\nCOMMON COMPETENCIES\n\nUNIT OF COMPETENCY :\nMAINTAIN AN EFFECTIVE RELATIONSHIP WITH CLIENTS AND\nCUSTOMERS\nUNIT CODE\n: HCS516201\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes and values\nrequired in building and maintaining an effective relationship with\nclients, customers and the public.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Maintain a clean and\nhygienic environment\n\n1.1\nUniform and personal grooming maintained to assignment\nrequirements.\n1.2\nPersonal presence maintained according to employer\nstandards.\n1.3\nVisible work area kept tidy and uncluttered.\n1.4\nEquipment stored according to assignment requirements.\n\n2. Meet client/customer\nrequirements\n\n2.1\nClient requirements identified and understood by referral to\nassignment instructions.\n2.2\nClient requirements met according to the assignment\ninstructions.\n2.3\nChanges to client’s needs and requirements monitored and\nappropriate action taken.\n2.4\nAll communication with client or customer is cleared and\ncomplied with assignment requirements.\n\n3. Build credibility with\ncustomers/clients\n3.1\nClient expectations for reliability, punctuality and appearance\nadhered to.\n3.2\nPossible causes of client/customer dissatisfaction identified,\ndealt with recorded according employer policy.\n3.3\nClient fully informed of all relevant matters in a timely manner\nand according to agreed reporting procedures.\n\n--- PDF PAGE 19 ---\nTR Dental Laboratory Technology Services (Removable Dentures/Appliances) NC II Amended April 8, 2010\n\n15\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Personal Presence\nMay include but not limited to:\n1.1\nStance\n1.2\nPosture\n1.3\nBody Language\n1.4\nDemeanor\n1.5\nGrooming\n\n 2. Employer Standards\nMay include but not limited to:\n2.1\nStanding Orders\n\n3. Client Requirements\nMay include but are not limited to:\n3.1\nAssignment instructions\n3.2\nPost Orders\n3.3\nScope to modify instructions/orders in light of changed\nsituations\n\n4. Assignment\nInstructions\nMay be conveyed in:\n4.1\nWriting\n4.2\nVerbally\n4.3\nElectronically\n\n5. Client Needs and\nRequirements\nMay be detected by:\n5.1\nReview of the client brief and/or assignment instructions\n5.2\nDiscussion with the client/customer\n\n6. Appropriate Action\nMay include:\n6.1\nImplementing required changes\n6.2\nReferring to appropriate employer personnel\n6.3\nClarification of client needs and instructions\n6.4\nHazard reports\n\n7. Customers\nMay include:\n7.1\nAll members of the public\n\n--- PDF PAGE 20 ---\nTR Dental Laboratory Technology Services (Removable Dentures/Appliances) NC II Amended April 8, 2010\n\n16\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nMaintained a professional image\n1.2\nInterpreted client/customer requirements from information\n1.3\nDealt successfully with a variety of client/customer interactions\n1.4\nMonitored and acted on changing client or customer needs\n1.5\nMet client/customer requirements\n1.6\nBuilt credibility with customers/client\n2. Underpinning\nknowledge\n2.1\nUniform and personal grooming requirements of the employer\n2.2\nOccupational health and safety requirement for the\nassignment\n2.3\nAssignment Instructions\n3. Underpinning skills\n3.1 Attention to detail when completing client/employer\ndocumentation\n3.2\nInterpersonal and communication skills required in client\ncontact assignments\n3.3\nCustomer service skills required to meet client/customer\nneeds\n3.4\nPunctuality\n3.5\nCustomer Service\n3.6\nTelephone Technique\n3.7\nProblem Solving and Negotiation\n3.8\nMaintaining Records\n4. Resource\nimplications\nThe following resources MUST be provided\n4.1\nAssessment Centers/Venues\n4.2\nAccredited Assessors\n4.3\nModes of Assessment\n4.4\nEvaluation Reports\n4.5\nAccess to a relevant venue, equipment and materials\n4.6\nAssignment Instructions\n4.7\nLogbooks\n4.8\nOperational manuals and makers/customers’ instructions\n4.9\nAssessment instruments, including personal planner and\nassessment record book\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1\nWritten Test\n5.2\nDemonstration with questioning\n5.3\nObservation with questioning\n6. Context of\nassessment\n6.1 Assessment may be done in the workplace or in a simulated\nworkplace setting.\n\n--- PDF PAGE 21 ---\nTR Dental Laboratory Technology Services (Removable Dentures/Appliances) NC II Amended April 8, 2010\n\n17\nUNIT OF COMPETENCY : MANAGE OWN PERFORMANCE\nUNIT CODE : HCS516202\nUNIT DESCRIPTOR\n: This unit of competency covers the knowledge, skills and attitudes\nin effectively managing own workload and quality work.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Plan for completion of\nown workload\n1.1\nTasks accurately identified.\n1.2\nPriority allocated to each task.\n1.3\nTime lines allocated to each task or series of tasks.\n1.4\nTasks deadlines known and complied with whenever possible.\n1.5\nWork schedules are known and completed with agreed time\nframes.\n1.6\nWork plans developed according to assignment requirements\nand employer policy.\n1.7\nUncompleted work or tasks detailed and responsibility for\ncompletion passed to incoming shift or other appropriate\npersons.\n\n2. Maintain quality of\nperformance\n2.1\nPersonal performance continually monitored against agreed\nperformance standards.\n2.2\nAdvice and guidance sought when necessary to achieve or\nmaintain agreed standards.\n2.3\nGuidance from management applied to achieve or maintain\nagreed standards.\n2.4\nStandard of work clarified and agreed according employer\npolicy and procedures.\n\n3. Build credibility with\ncustomers/clients\n3.1\nClient expectations for reliability, punctuality and appearance\nadhered to.\n3.2\nPossible causes of client/customer dissatisfaction identified,\ndealt with, recorded and in accordance with employer policy.\n3.3\nClient fully informed of all relevant matters in a timely manner.\n\n--- PDF PAGE 22 ---\nTR Dental Laboratory Technology Services (Removable Dentures/Appliances) NC II Amended April 8, 2010\n\n18\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Tasks\n1.1\nMay be identified through:\n1.1.1 Assignment Instructions\n1.1.2 Verbal Instructions by Senior Staff\n1.1.3 Policy Documents\n1.1.4 Duty Statements\n1.1.5 Self Assessment\n1.2\nMay be:\n1.2.1 Daily tasks\n1.2.2 Weekly tasks\n1.2.3 Regularly or irregularly occurring tasks\n\n2. Performance\nStandards\nMay include:\n2.1\nAssignment Instructions\n2.2\nProcedures established in policy documents\n\n--- PDF PAGE 23 ---\nTR Dental Laboratory Technology Services (Removable Dentures/Appliances) NC II Amended April 8, 2010\n\n19\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nPlanned for completion of own workload\n1.2\nAssessed verbal or written work plan through observation and\ndiscussion of site and employer requirements\n1.3\nDemonstrated capacity to complete task within specified time\nframe\n1.4\nMaintained quality of own performance\n2. Underpinning\nknowledge\n2.1\nSight and assignment requirements\n2.2\nEmployer policy on performance management\n2.3\nIndicators of appropriate performance for each area of\nresponsibility\n2.4\nSteps for improving or maintaining performance\n3. Underpinning skills\n3.1\nCapacity to plan and prioritize work loads and requirements\n3.2\nTime and task management\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nAssessment Centers/Venues\n4.2\nAccredited Assessors\n4.3\nModes of Assessment\n4.4\nEvaluation Reports\n4.5\nAccess to relevant venue, equipment and materials\n4.6\nAssignment Instructions\n4.7\nLogbooks\n4.8\nOperational manuals and makers’/customers’ instructions\n4.9\nAssessment Instruments, including personal planner and\nassessment record book\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1\nWritten Test\n5.2\nDemonstration with questioning\n5.3 Observation with questioning\n5.4 Oral questioning/Interview\n6. Context of\nassessment:\n6.1\nAssessment may be done in the workplace or in a simulated\nworkplace setting.\n\n--- PDF PAGE 24 ---\nTR Dental Laboratory Technology Services (Removable Dentures/Appliances) NC II Amended April 8, 2010\n\n20\nUNIT OF COMPETENCY :\nFOLLOW OCCUPATIONAL HEALTH AND SAFETY POLICIES\nIN DENTAL LABORATORY FACILITIES\n\nUNIT CODE\n:\nHCS346204\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes required in\napplying relevant OHS legislation and codes of practice, including\nduties and responsibilities for all parties under general duty of care.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1\nFollow workplace\nprocedures for\nhazard identification\nand risk control\n\n1.1\nHazards in the work area are recognized and reported to\nsupervisor in accordance with workplace procedures.\n1.2\nWorkplace procedures and work instructions for\ncontrolling risks, including infection control, are followed\naccurately.\n1.3\nWorkplace procedures for dealing with accidents, fires and\nemergencies are followed where necessary.\n2\nContribute to the\nmanagement of\nOHS\n2.1\nOHS issues are raised with designated personnel and co-\nworkers as appropriate.\n2.2\nContributions are made as appropriate to workplace OHS\ndiscussions.\n3\nUtilize and\nimplement\nstrategies as\ndirected to prevent\ninfection in the\nworkplace\n3.1\nThe environment is kept clean and tidy.\n3.2\nPersonal hygiene practices are followed.\n3.3\nAny items that may be contaminated are disposed of safely.\n4\nUtilize strategies to\nprevent stress\noverload\n4.1\nNominated rest time and breaks are taken.\n4.2\nSources of stress are identified and issues raised with\nsupervisor.\n4.3\nWork roles are clarified and followed.\n5\nWork in a safe\nmanner\n5.1\nDefined procedures are followed to ensure personal safety.\n5.2\nAll work is carried out in a manner which ensures safety\nof self and others\n5.3\nOrganizational security measures are followed.\n5.4\nSafe manual handling procedures are followed.\n\n--- PDF PAGE 25 ---\nTR Dental Laboratory Technology Services (Removable Dentures/Appliances) NC II Amended April 8, 2010\n\n21\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1.\nWorkplace\nprocedures for\ncontrolling risks\n\nMay include:\n1.1\nManual handling techniques\n1.2\nSafe handling, storage and disposal of inflammable or\npotentially dangerous substances\n1.5\nStrategies for reducing the amount of manual handling\nrequired\n2.\nStress\nMay include:\n2.1\nHealth problems\n2.2\nChanges in behavior\n2.3\nFrequent absences\n2.4\nNegative attitudes\n2.5\nUnawareness of own stress levels\n3.\nRest time and\nbreaks\nMay include:\n3.1\nMorning and afternoon tea, lunch, dinner breaks\n4.\nWorkplace\nprocedures\nMay include:\n4.1\nGrievance procedures\n4.2\nTeam meetings\n4.3\nIncident reports\n4.4\nDebriefing procedures following crisis\n4.5\nSmoke free environment\n5.\nItems that may be\ncontaminated\nMay include:\n5.1\nWork surfaces\n5.2\nClothing\n6.\nWorking in a\nmanner that\nensures personal\nsafety\nMay include:\n6.1\nCarrying communication equipment\n6.2\nUsing personal protection equipment\n6.3\nSafe work practices for handling sharps and other hazards in\ndental laboratory practice\n6.4\nCarrying alarms\n6.5\nMaintaining infection control in dental laboratory practice\n7.\nOrganizational\nsecurity measures\nMay include:\n7.1\nLocking doors\n7.2\nAlarm system\n7.3\nContracted security personnel\n\n--- PDF PAGE 26 ---\nTR Dental Laboratory Technology Services (Removable Dentures/Appliances) NC II Amended April 8, 2010\n\n22\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nWorked safely and followed OHS policies and procedures in\ndental laboratory practice\n1.2\nComplied with DOH infection control guidelines\n1.3\nContributed to the management of OHS\n1.4\nUtilized and implemented strategies as directed to prevent\ninfection in the workplace\n1.5\nUtilized strategies to prevent stress overload\n1.6\nWorked in a safe manner\n2. Underpinning\nknowledge\n2.1\nCompliance with OHS policy and procedures and infection\ncontrol guidelines and procedures\n2.2\nKnowledge of potential hazards in the workplace\n2.3\nKnowledge of laboratory waste disposal methods\n2.4\nKnowledge of personal hygiene and personal protection\nincluding immunization\n2.5\nKnowledge of legislative requirements and best practice\napproaches to OHS\n2.6\nEmergency procedures\n3. Underpinning skills\n3.1\nManual handling techniques\n3.2\nSafe handling techniques\n3.3\nCorrect use of equipment, instruments and materials in\naccordance with manufacturer specifications\n3.4\nTechnology used to work safely and competently\n3.5\nSafe work practices to prevent or minimize risk\n3.6\nReading and writing skills\n3.7\nOral communication skills\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nRelevant dental laboratory practice/organizational policies and\nprocedures manuals such as:\n4.1.1 Incident reporting procedures\n4.1.2 OHS policy and procedures\n4.1.3 Infection control guidelines (DOH)\n4.1.4 Waste management policies\n4.1.5 Relevant state legislation\n4.1.6 Manufacturer’s instructions for the use of relevant\nequipment, instruments and materials\n4.1.7 Material Safety Data Sheets (MSDs)\n5\nMethod of\nassessment\nCompetency may be assessed through:\n5.1\nObservation with questioning\n5.2\nOral questioning/Interview\n5.3\nPortfolio\n5.4\nThird Party Report\n6\nContext of\nassessment\n6.1\nCompetency may be assessed in the workplace or in a\nsimulated work setting.\n\n--- PDF PAGE 27 ---\nTR Dental Laboratory Technology Services (Removable Dentures/Appliances) NC II Amended April 8, 2010\n\n23\nUNIT OF COMPETENCY :\nMAINTAIN INFECTION CONTROL IN DENTAL LABORATORY\nPRACTICE\n\nUNIT CODE\n:\nHCS346205\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes required to\ncomply with infection control procedures before, during and after\nhealth care procedures.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1\nMonitor and\nmaintain the\ncleanliness of the\ndental laboratory\n\n1.1\nAppropriate personal protective wear is used during cleaning\nof equipment and surfaces.\n1.2\nAppropriate disinfectants and cleaning equipment are\nselected, prepared and used on surfaces in accordance with\nthe manufacturer’s specification.\n1.3\nUsed surface covers, if applicable, are removed and replaced\nin a manner to prevent cross contamination.\n1.4\nCleaning equipment is correctly stored.\n1.5\nAll surfaces including internal storage units within the dental\nlaboratory are monitored and maintained for cleanliness.\n2\nClean and disinfect\ndental laboratory\n/instruments and\nequipment\n2.1\nDental laboratory instruments and equipment are cleaned of\nbio-burden and lubricated, where appropriate, prior to cleaning\nand disinfecting.\n2.2\nDental laboratory instruments and equipment are checked for\nfaults and disassembled where appropriate.\n2.3\nPrior to cleaning of dental laboratory instruments and\nequipment are loaded safely and effectively.\n2.4\nAppropriate cleaning procedures are carried out in the correct\nsequence and duration in accordance with manufacturer\nspecifications.\n2.5\nRegular maintenance program including faults and incidences\nare recognized, reported and documented.\n\n--- PDF PAGE 28 ---\nTR Dental Laboratory Technology Services (Removable Dentures/Appliances) NC II Amended April 8, 2010\n\n24\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n3\nMaintain hygiene\nand personal\nprotection\n\n3.1\nHand washing procedures are correctly followed.\n3.2\nOpen cuts and abrasions are covered with a waterproof\ndressing.\n3.3\nAppropriate personal protection wear is correctly worn.\n3.4\nImmunization is undertaken in accordance with current\nrecommendations for dental health care worker.\n3.5\nAll work is carried out in a manner that minimizes the risk of\ncross contamination and complies with OHS policy and\nprocedures.\n3.6\nHazards in the dental laboratory is recognized and reported to\noperator.\n3.7\nAppropriate procedures for dealing with accidents, including\nsharp injuries, are followed correctly.\n4\nDispose of dental\nlaboratory waste\nsafely\n4.1\nAppropriate protective clothing is worn or used in accordance\nwith OHS policy and procedures when handling waste.\n4.2\nWaste is segregated, contained, stored and transported\ncorrectly.\n4.3\nDamaged and/or pre-packed items are disposed of safely.\n4.4\nWaste is disposed of safely.\n5\nUndertake the\nnecessary\nmeasures to ensure\nprevention of\ntransmission of\ninfection\n5.1\nRisks of cross contamination are identified and appropriate\nresponses implemented within dental practice.\n5.2\nClean, contaminated and administrative zones are clearly\nidentified and maintained.\n5.3\nInstruments, materials, medicaments and equipment are set\nup prior to commencement of treatment where appropriate.\n5.4\nOne-way workflow from clean to dirty zone is maintained.\n5.5\nRisk of transmission of infection is minimized in all dental\nlaboratory related and administrative procedures.\n5.6\nSpills are removed correctly.\n\n--- PDF PAGE 29 ---\nTR Dental Laboratory Technology Services (Removable Dentures/Appliances) NC II Amended April 8, 2010\n\n25\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1.\nInfection control\nguidelines and\nprocedures\nMay include but are not limited to:\n1.1\nCurrent DOH guidelines for infection control in health care\nsettings\n1.2\nStandard Precautions and Additional Precautions as defined\nby DOH\n1.3\nDental laboratory practice/organizational policy procedures\nand infection control guidelines and procedures\n1.4\nMaterial Safety Data Sheets (MSDS)\n1.5\nLocal government ordinances\n1.6\nLegislative requirements\n2.\nPersonal protective\nwear\nMay include but not limited to:\n2.1\nSterile and non sterile gloves including heavy duty\n2.2\nMasks\n2.3\nEye protection\n2.4\nEnclosed footwear\n2.5\nGowns\n2.6\nAprons\n3.\nCleaning equipment\nMay include but is not limited to:\n3.1\nUltrasonic cleaner\n3.2\nManual cleaning with a range of brushes\n3.3\nDrying\n3.4\nBuckets and mops\n4\nWaste segregation\nMay include but is not limited to:\n4.1\nClinical and related waste\n4.2\nInfectious waste\n4.3\nSharps\n4.4\nGeneral waste\n4.5\nOther hazardous substances\n5\nRequirements for\nsafe disposal of\nwaste\nMay be determined by:\n5.1\nMain drainage\n5.2\nLocal government ordinances\n5.3\nMaterial Safety Data Sheet (MSDS)\n\n--- PDF PAGE 30 ---\nTR Dental Laboratory Technology Services (Removable Dentures/Appliances) NC II Amended April 8, 2010\n\n26\nEVIDENCE GUIDE\n\n1.\nCritical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nDemonstrated knowledge of infection risks in health\nenvironment and specifically in dental laboratory practice\n1.2\nComplied with current DOH infection control guidelines and\nprocedures, OHS and legislative requirements\n1.3\nHandled waste safely managed procedures in accordance\nwith legislative requirements\n1.4\nSelected and used appropriate cleaning agents for particular\nsurfaces and equipment in accordance with the\nmanufacturer’s specifications\n2.\nUnderpinning\nknowledge\n2.1\nKnowledge on how infection is spread, cross infection and\nprevention strategies\n2.2\nKnowledge of relevant OHS policies and procedures\n2.3\nLimitations, properties and precautions required of\ndisinfectants and decontaminates\n2.4\nKnowledge of potential hazards in a health environment\n2.5\nKnowledge of currently available vaccinations against\ntransmissible disease\n2.6\nKnowledge of dental laboratory waste disposal methods\n3.\nUnderpinning skills\n3.1\nApplying standard and additional precautions\n3.2\nUsing safe work practices to minimize the risk of transmission\nof infection\n3.3\nSelecting and using appropriate chemicals in cleaning and\nsanitizing\n3.4\nUsing correct hand washing and hand care techniques\n3.5\nUsing correct hygiene procedures\n3.6\nSelecting and using equipment and cleaning agents effectively\n3.7\nUsing procedures appropriate to the cleaning area and\npurpose\n3.8\nMinimizing disruption to the work environment\n3.9\nMinimizing safety hazards for self and others\n3.10 Using time management strategies to set priorities\n3.11\nUsing technology to work safely and competently\n4.\nResource\nimplications\n\nThe following resources MUST be provided:\n4.1\nRelevant dental laboratory practice/organizational policy and\nprocedures\n4.2\nIncident reporting procedures\n4.3\nOccupational health and safety policy and procedures\n4.4\nInfection control guidelines\n4.5\nWaste management policies\n4.6\nRelevant state legislations\n4.7\nManufacturer’s instructions for the use of relevant equipment,\ninstruments, medicaments, materials and Material Safety Data\nSheets (MSDS)\n4.8\nCleaning agents currently used in the workplace\n\n--- PDF PAGE 31 ---\nTR Dental Laboratory Technology Services (Removable Dentures/Appliances) NC II Amended April 8, 2010\n\n27\n\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1\nWritten Test/Examination\n5.2\nDemonstration with questioning\n5.3\nObservation with questioning\n5.4\nPortfolio\n5.5\nThird Party Report\n6. Context of\nassessment\n6.1\nCompetency may be assessed in the workplace or in a\nsimulated work setting.\n\n--- PDF PAGE 32 ---\nTR Dental Laboratory Technology Services (Removable Dentures/Appliances) NC II Amended April 8, 2010\n\n28\n\nUNIT TITLE\n:\nOPERATE A PERSONAL COMPUTER\nUNIT CODE\n:\nICT311201\nUNIT DESCRIPTOR\n:\nThis unit defines the competency required to operate a personal\ncomputer by: starting the PC, logging in, using and working with\nfiles, folders and programs, saving work, and closing down the PC.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized Bold terms are elaborated in the Range of Variables\n1. Start the\ncomputer\n\n1.1\nThe peripheral devices are properly connected\n1.2\nPower is checked and the computer and peripheral devices are\nswitched on\n1.3\nProper logging in and logging off is successfully done\n1.4\nThe operating system features and functions are accessed and\nnavigated\n1.5\nHardware configuration and other system features are checked\n2. Arrange and\ncustomize\ndesktop display/\nWindows\nsettings\n\n2.1\nThe desktop screen or Windows elements are changed as needed\n2.2\nDesktop icons are added, renamed, moved, copied or deleted\n2.3\nThe online help functions are accessed or used as needed\n2.4\nDesktop icons of application programs are selected, opened and\nclosed\n2.5\nProperties of icons are displayed\n2.6\nComputer or desktop settings are saved and restored\n3. Work with files\nand folders (or\ndirectories)\n\n3.1\nA file or folder is created, opened, moved, renamed or copied\n3.2\nFiles are located, deleted and restored\n3.3\nDetails and properties of files and folders are displayed or viewed\n3.4\nVarious files are organized for easy lookup and use\n3.5\nFiles and information are searched\n3.6\nDisks are checked, erased or formatted as necessary\n4. Work with user\napplication\nprograms\n4.1\nApplication programs are added, changed, removed or ran\n4.2\nUser software or application program are installed, updated and\nupgraded\n4.3\nInformation/data are moved between documents or files\n5. Print\ninformation\n5.1\nPrinter is added or installed and correct printer settings is ensured\n5.2\nDefault printer is assigned accordingly\n5.3\nInformation or document is printed on the installed printer\n5.4\nProgress of print jobs are viewed and deleted as required\n6. Shut down\ncomputer\n6.1\nAll open application programs are closed\n6.2\nComputer and peripheral devices are properly shut down\n\n--- PDF PAGE 33 ---\nTR Dental Laboratory Technology Services (Removable Dentures/Appliances) NC II Amended April 8, 2010\n\n29\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Peripheral device\nThis may include but is not limited to:\n1.1 mouse\n1.2 keyboard\n1.3 monitor or visual display unit\n1.4 printer\n1.5 scanner\n2. Computer\nMay include:\n2.1 Laptops/notebooks\n2.2 Workstations\n2.3 Servers\n2.4 other personal computer devices\n3. Application\nprograms\nCan include:\n3.1 user programs\n3.2 database programs\n3.3 word processors\n3.4 email programs\n3.5 Internet browsers\n3.6 system browsers\n3.7 spreadsheets\n4. Operating system\nMay include but is not limited to the various versions and variants of:\n4.1 Windows\n4.2 NT\n4.3 Mac OS\n4.4 Linux\n4.5 Solaris\n4.6 Unix\n\n5. System features\nMay include but is not limited to the operating system features and\nhardware features like:\n5.1 memory size\n5.2 disk capacities\n5.3 video cards\n5.4 USBs\n5.5 Modems\n5.6 1394 and LAN connectors\n5.7 SD and PC cards\n5.8 wireless and infrared connections.\n\n--- PDF PAGE 34 ---\nTR Dental Laboratory Technology Services (Removable Dentures/Appliances) NC II Amended April 8, 2010\n\n30\n\nVARIABLE\nRANGE\n6. Online help\nfunctions\n6.1 An instruction manual, or a portion of the manual, integrated and\naccessible from within the program or software being used.\n7. Properties\nIndicates the description of the file or folder to include the:\n7.1 file name\n7.2 type of file\n7.3 file size\n7.4 date created and modified\n7.5 attributes (hidden, read-only).\n8. Various files\n8.1 Documents\n8.2 Records\n8.3 Pictures\n8.4 Music\n8.5 Video\n9. Disks\nMay include but is not limited to:\n9.1 Floppy disks\n9.2 CDs\n9.3 CD-RW (Compact discs-Read/Write)\n9.4 DVD RW\n9.5 zip disks\n9.6 flash drives\n9.7 memory sticks\n9.8 hard drives\n10. Printer settings\nThe properties of the printer that enables it to work includes:\n10.1 page layout\n10.2 paper size\n10.3 ink/cartridge type\n10.4 number of copies\n10.5 page orientation\n\n--- PDF PAGE 35 ---\nTR Dental Laboratory Technology Services (Removable Dentures/Appliances) NC II Amended April 8, 2010\n\n31\nEVIDENCE GUIDE\n\n1.\nCritical aspects\nof Competency\n1.1 Assessment must confirm the ability to utilize software, navigate\nthe desktop, using system features to perform tasks and save\nresults of work.\n2.\nUnderpinning\nKnowledge\nKnowledge includes:\n2.1 Keyboard layout and functions\n2.2 Computer functions\n2.3 Basic parts of a computer and various hardware components\n2.4 Storage devices and file concepts\n2.5 Basic software operation and functionalities\n3.\nUnderpinning\nSkills\nSkills include:\n3.1 Saving and retrieving files to and from various folders or disk\nstorage\n3.2 Mouse and keyboarding skills for running software applications\n3.3 Reading and writing at a level where basic workplace documents\nare understood\n3.4 Clear ability to communicate with peers and supervisors\n3.5 Interpretation of user manuals and help functions\n3.6 The ability to carry out written and verbal instructions using a\npersonal computer whether standalone or in a networked\nenvironment\n4.\nResource\nImplications\nTo demonstrate competence in this unit access to the following\nresources will be required:\n4.1 A personal computer\n4.2 A printer\n4.3 Mouse and keyboard\n4.4 Basic systems software\n5.\nMethods of\nAssessment\nCompetency may be assessed through:\n5.1 Observation in a workplace or simulated environment\n5.2 Third party reports\n5.3 Exams and tests\n5.4 Demonstration of required skills\n5.5 Interviews\n6.\nContext for\nAssessment\n6.1 Competency may be assessed in the workplace or in a simulated\nwork environment.\n\n--- PDF PAGE 36 ---\nTR Dental Laboratory Technology Services (Removable Dentures/Appliances) NC II Amended April 8, 2010\n\n32\n\nCORE COMPETENCIES\n\nUNIT OF COMPETENCY :\nARRANGE ARTIFICIAL TEETH FOR COMPLETE DENTURES\nUNIT CODE\n\n : HCS322328\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes required in the\nselection, arrangement and wax contouring of a complete denture.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Prepare case for\nsetting of teeth\n1.1\nArtificial teeth are selected to work order.\n1.2\nBases and rims are modified as required for positioning of\nteeth.\n2 Arrange artificial\nteeth\n2.1\nWork order is followed.\n2.2\nTeeth are positioned to achieve aesthetics and centric\nocclusion, balanced articulation and balanced occlusion.\n2.3\nTeeth are secured in wax and contoured to gingival outline.\n3. Wax up denture for\ntry-in\n3.1\nWax is applied as required.\n3.2\nFacial and lingual aspects are contoured.\n3.3\nMuscle attachments are located and relieved.\n3.4\nPeripheral extensions are smoothened and rounded.\n3.5\nDistal extensions are confirmed.\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Dentures\nMay include but are not limited to:\n1.1\nComplete maxillary or complete mandibular\n1.2\nCombined complete maxillary and complete mandibular.\n\n--- PDF PAGE 37 ---\nTR Dental Laboratory Technology Services (Removable Dentures/Appliances) NC II Amended April 8, 2010\n\n33\n\nEVIDENCE GUIDE\n\n1. Critical aspect of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nPrepared case for setting of teeth\n1.2\nArranged artificial teeth\n1.3\nWaxed up denture for try-in\n1.4\nComplied with infection control policies and procedures\n1.5\nFollowed OH&S policies and procedures\n2. Underpinning\nknowledge\n2.1\nRange of articulators\n2.2\nSelection of artificial teeth\n2.3\nArticulation and occlusion\n2.4\nTooth morphology\n2.5\nCurrent DOH infection control guidelines\n2.6\nRelevant material science for carrying out procedures\n2.7\nOH&S and material safety data sheets\n2.8\nIndustry Codes of Practice\n2.9\nRelevant laws as appropriate\n2.10 Housekeeping and maintenance procedures\n3. Underpinning skills\n3.1\nManual dexterity\n3.2\nMaintaining a healthy and safe working environment\n3.3\nSelecting artificial teeth\n3.4\nMaintaining personal hygiene\n3.5\nPlanning and organizing work activities\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 A real or simulated dental laboratory environment\n4.2 Relevant documentation such as:\n4.2.1 industry codes of practice\n4.2.2 relevant laws as appropriate\n4.2.3 housekeeping/maintenance procedures\n4.3 Range of articulators\n4.3\nA qualified workplace assessor and/or a technical expert\nworking in partnership with assessor\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1 Demonstration with questioning\n5.2 Written Test/Examination\n5.3 Third Party Report\n5.4 Portfolio\n6. Context of\nassessment\n6.1\nCompetency may be assessed in the workplace or in a\nsimulated workplace setting.\n\n--- PDF PAGE 38 ---\nTR Dental Laboratory Technology Services (Removable Dentures/Appliances) NC II Amended April 8, 2010\n\n34\n\nUNIT OF COMPETENCY :\nSET-UP AND WAX REMOVABLE PARTIAL DENTURES\nUNIT CODE\n\n : HCS322329\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes required to set-\nup and wax removable partial dentures.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Design acrylic\nremovable partial\ndenture\n1.1\nModels are surveyed.\n1.2\nDesign is established and transferred to master model.\n1.3\nUndesirable undercuts are blocked out.\n1.4\nFood lines are scribed.\n\n2. Select and prepare\nmaterials\n2.1\nMaterials are selected according to work order.\n2.2\nShape and dimension of components are established from\ndesign.\n\n3. Arrange artificial\nteeth\n3.1\nTeeth are selected and positioned in wax to established\naesthetics and function.\n3.2\nWax is contoured and dentures made suitable for try-in in\nmouth.\n\n4. Fabricate retainer\nunits\n4.1\nComponents are constructed as required.\n4.2\nComponents are joined as required.\n4.3\nTeeth and components are secured in wax.\n4.4\nFacial and lingual aspects are contoured.\n4.5\nAppliance is secured for processing.\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n 1. Material options for\nbase\nMay include but are not limited to:\n1.1\nAcrylic\n1.2\nLight-cured\n1.3\nFlexible materials\n\n--- PDF PAGE 39 ---\nTR Dental Laboratory Technology Services (Removable Dentures/Appliances) NC II Amended April 8, 2010\n\n35\n\nEVIDENCE GUIDE\n\n1. Critical aspect of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Designed acrylic removable partial denture\n1.2 Selected and prepared materials\n1.3 Arrange artificial teeth\n1.4 Fabricated retainer units\n1.5 Complied with infection control policies and procedures\n1.6 Followed OH&S policies\n1.7 Industry Codes of Practice\n1.8 Relevant laws as appropriate\n1.9 Housekeeping Maintenance Procedures\n1.10 Dental Alloys\n2. Underpinning\nknowledge\n\n2.1 Metallurgy - soldering techniques\n2.2 Wrought component fabrication techniques\n2.3 Tooth morphology\n2.4 Articulation and occlusion\n2.5 Principles of partial denture design\n2.6 Relevant material science for carrying out procedures\n2.7 Duplication techniques\n2.11 Current DOH infection control guidelines\n3. Underpinning skills\n3.1 Manual dexterity\n3.2 Maintaining a healthy and safe working environment\n3.3 Investing and packing techniques\n3.4 Duplicating techniques\n3.5\nFabricating techniques of wrought components\n3.6\nMaintaining personal hygiene\n3.7\nPlanning and organizing work activities\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 A real or simulated dental laboratory environment\n4.2 Relevant documentation such as:\n4.2.1 industry codes of practice\n4.2.2 state legislation as appropriate\n4.2.3 housekeeping/maintenance procedures\n4.3 Dental alloys\n4.4 A qualified workplace assessor and/or a technical expert\nworking in partnership with the assessor\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1 Demonstration with questioning\n5.2 Written Test/Examination\n5.3 Third Party Report\n5.4\nPortfolio\n6. Context of\nassessment\n6.1\nAssessment may be conducted in the workplace or in a\nsimulated environment\n\n--- PDF PAGE 40 ---\nTR Dental Laboratory Technology Services (Removable Dentures/Appliances) NC II Amended April 8, 2010\n\n36\nUNIT OF COMPETENCY : WAX, PROCESS AND FINISH ACRYLIC DENTURES AND\nAPPLIANCES\nUNIT CODE\n\n : HCS322330\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes concerned with\nthe process involved in polymerization and finishing of acrylic\ndentures and appliances.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Wax case for finish\nconsistent with work\norder\n1.1\nWax is applied as required by work order.\n1.2\nFacial and lingual aspects are contoured.\n2. Select and prepare\nmaterials and\nprocessing\n2.1\nAppropriate polymer system for case is identified.\n2.2\nAppropriate investment technique is identified.\n2.3\nAppropriate processing cycle is identified.\n2.4\nMaterial is selected from identified polymer system.\n2.5\nSystem components are combined.\n2.6\nMaterials are allowed to reach application stage.\n3. Process denture or\nappliance\n3.1\nAppropriate investment techniques are applied.\n3.2\nMaterial is applied to mould.\n3.3\nAppropriate processing cycle is applied.\n3.4\nModel is divested.\n3.5\nRemount on articulator.\n4. Grind dentures and\nappliances selectively\n4.1\nCentric occlusion is restored.\n4.2\nBalanced occlusion is restored.\n4.3\nBalanced articulation is restored.\n4.4\nFunction is restored.\n5. Finish denture or\nappliance\n5.1\nDenture or appliance is trimmed, shaped and finished\naccording to job specifications.\n5.2\nDentures are disinfected according to current DOH infection\nguidelines.\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n 1. Acrylic dentures and\nappliances\nMay include but are not limited to:\n1.1\nComplete and partial dentures\n1.2\nOrthodontic appliances\n1.3\nTherapeutic appliances\n\n--- PDF PAGE 41 ---\nTR Dental Laboratory Technology Services (Removable Dentures/Appliances) NC II Amended April 8, 2010\n\n37\n\nEVIDENCE GUIDE\n\n1. Critical aspect of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Waxed case for finish consistent with work orders\n1.2 Selected and prepared materials and processing techniques\n1.3 Processed denture or appliance\n1.4 Grind dentures and appliances selectively\n1.5 Finished denture or appliance\n1.6 Complied with infection control policies and procedures\n1.7 Followed OH&S policies\n2. Underpinning\nknowledge\n2.1 Relevant material science for carrying out procedures\n2.2 Tooth morphology and anatomy\n2.3 OH&S and materials safety data sheets\n2.4 Current DOH infection control guidelines\n2.5 Workplace Policy and Procedures Manuals\n2.6 Product Labels and Sources of Product Information\n3. Underpinning skills\n3.1\nManual dexterity\n3.2\nMaintaining a healthy and safe working environment\n3.3\nMaintaining personal hygiene\n3.4\nPlanning and organizing work activities\n4. Resource implication\nThe following resources MUST be provided:\n4.1 Relevant documentation, such as:\n - workplace policy and procedures manuals\n4.2 Access to a range of clients with different requirements\n4.3 A range of equipment and products appropriate to the\nworkplace\n4.4\n Product labels and sources of product information\n4.5\nA qualified workplace assessor or assessment team\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1 Demonstration with questioning\n5.2 Written Test/Examination\n5.3 Third party Report\n5.4\nPortfolio\n6. Context of\nassessment\n6.1\nAssessment may be conducted in the workplace or in a\nsimulated environment\n\n--- PDF PAGE 42 ---\nTR Dental Laboratory Technology Services (Removable Dentures/Appliances) NC II Amended April 8, 2010\n\n38\nUNIT OF COMPETENCY :\nFABRICATE THERMO-FORMED BASES AND APPLIANCES\n\nUNIT CODE\n:\nHCS322334\n\nUNIT DESCRIPTOR :\nThis unit covers the knowledge, skills and attitude in fabricating\nthermo-formed bases and appliances.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Prepare model\n1.1\nWork order is interpreted.\n1.2\nOutline is marked and finished lines are scribed where\napplicable.\n1.3\nBlock-out material is applied as required.\n2. Thermo-form\nappliance or base\n2.1\n Thermo-forming material and apparatus is selected.\n2.2\n Heat is applied to material.\n2.3\n Softened material is adapted.\n2.4\n Material is allowed to cool.\n2.5 Adaptation is verified.\n3. Trim, shape and\nfinish appliances or\nbases\n3.1 Thermo-formed blank is removed.\n3.2 Outline is trimmed and fitted to model.\n3.3 Outline is refined.\n3.4 Appliance or base is smoothened and finished.\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1.\nAppliances\nMay include but are not limited to:\n1.1\nMouthguard\n1.2 Bleach trays\n1.3 Occlussal splints\n1.4 Baseplates\n1.5 Temporary crown stents\n1.6 Retaining devices\n1.7 Custom impression trays\n2. Thermo-forming\nequipment used\nMay include but are not limited to:\n2.1 Vacuum\n2.2 Pressure\n\n--- PDF PAGE 43 ---\nTR Dental Laboratory Technology Services (Removable Dentures/Appliances) NC II Amended April 8, 2010\n\n39\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Prepared model\n1.2 Thermo-formed appliance or base from blank\n1.3 Trimmed, shaped and finished appliance or bases\n1.4 Complied with infection control policies and procedures\n1.5 Followed OH&S policies\n2. Underpinning\nknowledge\n2.1 Relevant material science for carrying out procedures\n2.2 Oro-facial anatomy\n2.3 Thermoforming technology\n2.4 Polymer science\n2.5 Tooth morphology\n2.6 Principles of occlusion\n2.7 Industry Codes of Practice\n2.8 Relevant laws as appropriate\n2.9 Housekeeping and Maintenance Procedures\n3. Underpinning skills\n3.1 Manual dexterity\n3.2 Maintaining a healthy and safe working environment\n3.3 Performing orthodontic procedures and wrought wire\nfabrication techniques\n3.4 Maintaining personal hygiene\n3.5 Following correct measurements\n3.6 Planning and organizing work activities\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 A real or simulated dental laboratory environment\n4.2 Relevant documentation such as:\n4.2.1 industry codes of practice\n4.2.2 state legislation as appropriate\n4.2.3 housekeeping/maintenance procedures\n4.3 A qualified workplace assessor and/or a technical expert\nworking in partnership with the assessor\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1 Demonstration with questioning\n5.2 Written Test/Examination\n5.3 Third Party Report\n5.4 Portfolio\n6. Context of\nassessment\n6.1 Competency may be assessed in the workplace or accredited\nassessment center.\n\n--- PDF PAGE 44 ---\nTR Dental Laboratory Technology Services (Removable Dentures/Appliances) NC II Amended April 8, 2010\n\n40\nUNIT OF COMPETENCY:\nREPAIR AND MODIFY DENTURES AND APPLIANCES\nUNIT CODE :\nHCS322339\nUNIT DESCRIPTION:\nThis unit covers the knowledge and skills required to reline,\nrebase, repair and modify removable prostheses.\n\nDemonstration of this unit of competency requires training and/or\nexperience in infection-control procedures, constructing models,\narticulating models and transferring records, and constructing\nsimple complete removable acrylic dentures and appliances.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Prepare case\n\n1.1 Standard precautions are applied when receiving, handling and\nworking on dentures and appliances\n1.2 Dentures and appliances are decontaminated according to\ninfection control guidelines\n1.3 Prescription are read and interpreted\n1.4 Fractured components are examined for defects\n1.5 Fractured components are realigned, positioned and secured in\ntheir correct relationship\n2. Prepare model\n\n2.1 Model is constructed in accordance with the dentist requirements\n2.2 Articulation key is constructed if required\n3. Repair denture or\nappliance\n\n3.1 Denture surfaces are prepared and shaped to allow for bonding with\nthe new material\n3.2 Components are relocated\n3.3 Materials and processing equipment are selected and prepared\n3.4 Repair material is applied using the correct technique to acquire the\nrequired shape and thickness\n3.5 Material is processed in accordance with manufacturer’s\ninstructions/specifications\n4. Modify denture or\nappliance, where\nrequired\n\n4.1 Impressions are decontaminated according to infection control\nguidelines\n4.2 The model material is poured into the impression in accordance\nwith accepted techniques\n4.3 Where necessary, case is articulated and records are transferred or\narticulation key is constructed based on client requirement\n4.4 Denture or appliance surfaces are prepared appropriately in\naccordance with modification to be made\n4.5 Denture is relined, re-based or modified in accordance with dentist\nprescription\n5. Trim, shape and\nfinish denture or\nappliance\n\n5.1 Denture or appliance is trimmed to relevant anatomical outline or\nrequired extension of the base\n5.2 The tissue fitting surface is examined and any processing\nanomalies and sharp surfaces are removed\n5.3 Surfaces are refined and polished in order produce required\ncontours\n5.4 Finished prosthesis are evaluated in accordance with quality\nstandard\n5.5 The appliance is decontaminated according to infection control\nguidelines\n5.6 The appliance is placed in a sealed container for dispatch\n\n--- PDF PAGE 45 ---\nTR Dental Laboratory Technology Services (Removable Dentures/Appliances) NC II Amended April 8, 2010\n\n41\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Standard precautions\n\nMay include but are not limited to:\n1.1 A dedicated clean area to receive incoming cases\n1.2 Appropriate personal protection:\n1.2.1 disposable gloves\n1.2.2 apron\n1.2.3 eye protection\n1.2.4 mask where there is a risk of airborne transmission of\ninfection\n1.3 Decontamination of dentures and appliances\n1.4 Disposal of all packaging materials in accordance with the waste\nregulations of DOH and environmental authorities (DENR)\n1.5 Cleaning reusable containers with detergent followed by\ndisinfection\n1.6 Washing hands before leaving the work area\n1.7 Excluding all food and drink from the work area\n2. Decontamination of\ndentures and\nappliances\n\nMay include but is not limited to:\n2.1 Rinsing denture or appliance in clean running water\n2.2 Cleaning in an ultrasonic cleaner\n2.3 Cleaning in a mild detergent solution until all traces of blood and\nbody fluids are removed, followed by rinsing\n3. Preparation of\nmaterials\n\nMay include but is not limited to:\n3.1 Selection of materials appropriate to the removable prosthesis\nthat is to be repaired\n3.2 The correct quantities necessary for the repair\n4. Modifications to a\nprothesis\n\nMay include but is not limited to:\n4.1 Adding new artificial teeth\n4.2 Replacing existing artificial teeth\n4.3 Modifying the denture base\n4.4 Adding new metallic components\n4.5 Modifying existing metallic components\n5. Evaluation of the\nfinished prosthesis\n\nMay include but is not limited to:\n5.1 Checking the prosthesis for:\n 5.1.1 Compliance with the prescription\n 5.1.2 Quality and freedom from defects\n 5.1.3 Functional effectiveness of the design\n 5.1.4 Accurate fit to the cast\n\n--- PDF PAGE 46 ---\nTR Dental Laboratory Technology Services (Removable Dentures/Appliances) NC II Amended April 8, 2010\n\n42\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Complied consistently with current infection control guidelines,\nDOH and PDA requirements as they relate to the dental\ntechnician’s specific job role\n1.2 Complied consistently with occupational health and safety\npolicies and procedures as they relate to the dental technician’s\nspecific job role\n1.3 Demonstrated consistent performance over the required range of\nworkplace situations including:\n1.3.1 consistently design and manufacture oral splints using a\nrange of materials, for a range of jaw relations and\nmalocclusions\n1.3.2 consistently use a range of articulators\n1.4 Trimmed, polished, finished and evaluated oral splints for\nsuitability for insertion in the mouth\n2. Underpinning\nknowledge\n and attitudes\nKnowledge on:\n2.1 Infection control guidelines for the decontamination of dentures\nand appliances that have already been inserted into the mouth\n2.2 Applied oral anatomy\n2.2.1 structures of the oral cavity – hard and soft palate, lateral\nand posterior borders of the oral cavity, tongue and floor\nof the mouth\n2.2.2 teeth – form and function\n2.2.3 dentition – Arrangement of the teeth, naming and coding\nof teeth\n2.3 Constructional faults that cause fractures of denture base\nincluding:\n2.3.1 incorrect positioning of upper posterior teeth\n2.3.2 absence of balanced occlusion\n2.3.3 insufficient thickness of acrylic resin in the anterior palatal\nregion of the denture\n2.3.4 incorrect dough consistency when packing\n2.3.5 inadequate polymerisation times and temperatures\n2.3.6 rapid cooling after processing\n2.4 Constructional faults that cause broken teeth\n2.5 Methods for modifying, repairing and maintaining removable\nprostheses\n2.6 Denture base materials\n\n--- PDF PAGE 47 ---\nTR Dental Laboratory Technology Services (Removable Dentures/Appliances) NC II Amended April 8, 2010\n\n43\n\n3. Underpinning skills\n3.1 Use safe work practices to minimize the risk of transmission of\ninfection including:\n3.1.1 consistently following the procedure for washing and\ndrying hands\n3.1.2 consistently putting into practice clean techniques\n3.1.3 consistently using personal protective equipment\n3.1.4 consistently limiting contamination\n3.1.5 consistently maintaining clean receiving and work areas\n3.2 Consistently follow occupational health and safety policies and\nprocedures\n3.3 Use literacy skills to read and follow directions, policies and\nprocedures including:\n3.3.1 occupational health and safety policies and procedures\n 3.3.2 infection control policies and procedures\n 3.3.3 material safety data sheets\n 3.3.4 laboratory policies and procedures\n3.4 Select materials, techniques and equipment to reline, rebase,\nrepair and modify removable prostheses\n3.5 Consistently follow sequenced written instructions and\nmanufacturer specifications for the preparation of materials\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nA real or simulated dental laboratory environment\n4.2\nDental materials\n4.3\nDental tools and equipment\n4.4\nDentist requirements/prescription\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1\nDemonstration with questioning\n5.2\nObservation with questioning\n5.3\nOral questioning/Interview\n6. Context of\nassessment\n6.1\nCompetency may be assessed in the workplace or in a\nsimulated workplace setting.\n\n--- PDF PAGE 48 ---\nTR Dental Laboratory Technology Services (Removable Dentures/Appliances) NC II Amended April 8, 2010\n\n44\nUNIT OF COMPETENCY :\nFABRICATE ORAL SPLINTS\n\nUNIT CODE\n:\nHCS322332\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitude in fabricating oral\nsplints.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Fabricate splint\n1.1\nMaterials for the fabrication of splint are selected.\n1.2\nSplint is fabricated according to work order requirements.\n1.3\nSplint is processed according to manufacturer’s\nrecommendations.\n\n2. Trim, shape and\nfinish\n2.1\nSplint is trimmed according to material selection.\n2.2\nSplint is shaped according to work order and rechecked on\narticulator.\n2.3\nSplint is fitted back to master model.\n2.4\nSplint is finished appropriately according to type of material\nselected.\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Materials\nMay include but are not limited to:\n1.1\nCast alloys\n1.2\nAcrylic resins (heat activated, chemically activated, thermo-\nformed)\n1.3\nVisible light-cured composite resins\n2. Splint to be fabricated\nMay include but are not limited to:\n2.1\nCast metal alloy cap splints\n2.2\nAcrylic cap splints\n2.3\nGunning splints\n2.4\nWrought wire retained splints\n2.5\nOcclusal splints (bruxing, neutral, anterior, repositioning, TMJ,\northodontic)\n\n--- PDF PAGE 49 ---\nTR Dental Laboratory Technology Services (Removable Dentures/Appliances) NC II Amended April 8, 2010\n\n45\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nFabricated splint\n1.2\nTrimmed, shaped and finished splint\n1.3\nFollowed OH&S and DOH infection control guidelines\n1.4\nIdentified dental anatomy and dental metallurgy\n1.5\nUsed surveying equipment and vacuum forming procedures\n2. Underpinning\nknowledge\nKnowledge on:\n2.1\nArticulation and occlusion\n2.2\nRelevant dental anatomy\n2.3\nDental metallurgy\n2.4\nRelevant material science for carrying out procedures\n2.5\nUse of surveying equipment\n2.6\nOHS and material safety data sheets\n2.7\nCurrent DOH infection control guidelines\n2.8\nProcessing of wax patterns in acrylic resin\n2.9\nUsing of vacuum forming procedures\n2.10 Dental Laboratory Materials, splint materials, jaw relations and\nmalocclusions of severe skeletal orthodontic type\n2.11 Range of articulators\n3. Underpinning skills\n3.1\nManual dexterity\n3.2\nSurveying and blocking out undercuts\n3.3\nSelecting articulators\n3.4\nUsing face-bow and centric records\n3.5\nPlanning and organizing\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nA real or simulated dental laboratory environment\n4.2\nRange of dental laboratory materials, splint materials, jaw\nrelations and malocclusions of severe skeletal orthodontic\ntype\n4.3\nRange of articulators\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1\nDemonstration with questioning\n5.2\nWritten Test/Examination\n5.3\nThird Party Report\n5.4\nPortfolio\n6. Context of\nassessment\n6.1\nCompetency may be assessed in the workplace or in a\nsimulated workplace setting.\n\n--- PDF PAGE 50 ---\nTR Dental Laboratory Technology Services (Removable Dentures/Appliances) NC II Amended April 8, 2010\n\n46\nUNIT OF COMPETENCY :\nFABRICATE ORTHODONTIC APPLIANCES\n\nUNIT CODE\n:\nHCS322333\n\nUNIT DESCRIPTOR :\nThis unit covers the knowledge, skills and attitude in fabricating\northodontic appliances.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Select or fabricate\nand assemble\ncomponents and\nmaterials\n1.1\nMaterials are selected according to design and function\nspecified by work order.\n1.2\nIndividual components are selected and/or fabricated as\nappropriate to work order.\n\n2. Fabricate orthodontic\nappliance\n2.1\nComponents are secured to model by appropriate means.\n2.2\nMaterials are applied and processed according to\nmanufacturer’s instructions.\n\n3. Finish orthodontic\nappliance\n3.1\nAppliances are trimmed, shaped and finished.\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Components\nMay include but are not limited to:\n1.1\nScrews\n1.2\nPiston-screws\n1.3\nSprings an sheaths made in a variety of metals and polymers\n2. Materials\nMay include but are not limited to:\n2.1\nPolymers or metals and metal joining techniques\n3. Appliances\nMay include but are not limited to:\n3.1\nFunctional appliances\n3.2\nRetainers of varying types\n3.2.1 bite opening\n3.2.2 retraction\n3.2.3 expansion\n3.2.4 retaining\n3.2.5 incline plane\n3.2.6\noral screen\n\n--- PDF PAGE 51 ---\nTR Dental Laboratory Technology Services (Removable Dentures/Appliances) NC II Amended April 8, 2010\n\n47\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nSelected or fabricated and assembled components and\nmaterials\n1.2\nFabricated orthodontic appliance\n1.3\nFinished orthodontic appliances\n1.4\nComplied with infection control policies and procedures\n1.5\nFollowed OH&S policies\n2. Underpinning\nknowledge\n2.1\nDental metallurgy\n2.2\nRelevant material science for carrying out procedures\n2.3\nRelevant oral anatomy\n2.4\nPrinciples of Orthodontic Procedures\n2.5\nOcclusion\n2.6\nWrought wire fabrication techniques\n2.7\nIndustry Codes of Practice\n2.8\nRelevant laws as appropriate\n2.9\nHousekeeping and maintenance procedures\n3. Underpinning skills\n3.1 Manual dexterity\n3.2 Maintaining a healthy and safe working environment\n3.3 Performing orthodontic procedures and wrought wire\nfabrication techniques\n3.4 Maintaining personal hygiene\n3.5 Following correct measurements\n3.6 Planning and organizing work activities\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 A real or simulated dental laboratory environment\n4.2 Relevant documentation such as:\n4.2.1 industry codes of practice\n4.2.2 state legislation as appropriate\n4.2.3 housekeeping/maintenance procedures\n4.3 A qualified workplace assessor and/or a technical expert\nworking in partnership with the assessor\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1 Demonstration with questioning\n5.2 Written Test/Examination\n5.3 Third party Report\n5.4 Portfolio\n6. Context of\nassessment\n6.1 Competency may be assessed in the workplace or accredited\nassessment center.\n\n--- PDF PAGE 52 ---\nTR Dental Laboratory Technology Services (Removable Dentures/Appliances) NC II Amended April 8, 2010\n\n48\nUNIT OF COMPETENCY :\nFABRICATE CAST METAL REMOVABLE PARTIAL DENTURE\nFRAMEWORK\nUNIT CODE\n\n : HCS322331\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes concerned with\nfabrication of alloy removable partial denture framework.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Prepare master\nmodel\n1.1\nWork order is interpreted.\n1.2\nAlloy is selected\n1.3\nModel is surveyed.\n1.4\nDesigned is transferred to master model.\n1.5\nUndesirable undercuts are blocked out.\n1.6\nClasp ledges are created.\n1.7\nFinished lines are scribed.\n1.8\nTissue relief is applied.\n1.9\nSaddle relief is applied.\n2. Construct refractory\nmodel\n2.1\nMaster model is duplicated in refractory material and sprue\nformer is constructed, as necessary.\n2.2\nRefractory model surface is treated.\n3. Wax and invest\nremovable partial\ndenture framework\n3.1\nDesign is transferred to refractory model.\n3.2\nPatterns and waxes are selected.\n3.3\nPatterns are waxed up and sprues attached.\n3.4\nAppropriate investment and technique are selected.\n3.5\nInvestment material is prepared.\n3.6\nWax, patterns and sprues are treated.\n3.7\nInvestment setting time is allowed for.\n4. Burn out, cast and\nfinish removable\npartial denture\nframework\n4.1\nBurn out and preheat cycles are selected for appropriate\ninvestment/alloy combination.\n4.2\nInvestment mould is burnt out and preheated.\n4.3\nAlloy is melted and cast using appropriate\nequipment/technique.\n4.4\nCooling cycle is selected and applied.\n4.5\nDenture framework is devested.\n4.6\nDenture framework is trimmed, shaped, treated, finished and\nfitted to master model.\n4.7\nFramework is treated in accordance with DOH infection\ncontrol guidelines.\n\n--- PDF PAGE 53 ---\nTR Dental Laboratory Technology Services (Removable Dentures/Appliances) NC II Amended April 8, 2010\n\n49\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n 1. Alloy\nMay include but are not limited to:\n1.1 Cobalt chromium based alloys\n1.2 Gold alloys\n1.3 Metal/ceramic alloys\n\n2. Melting/casting\ntechniques\nMay include but are not limited to:\n2.1 Flame melting\n2.2 Induction melting\n2.3 Resistance melting\n2.4 Centrifugal casting\n2.5 Gas pressure casting\n2.6 Vacuum casting\n\n--- PDF PAGE 54 ---\nTR Dental Laboratory Technology Services (Removable Dentures/Appliances) NC II Amended April 8, 2010\n\n50\n\nEVIDENCE GUIDE\n\n1. Critical aspect of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Selected and prepared materials for fabrication of metal/cast\nmetal alloy\n1.2 Fabricated base and registration rim\n1.3 Prepared face-bow (if required)\n1.4 Complied with infection control policies and procedures\n1.5 Followed OH&S policies\n2. Underpinning\nknowledge\n2.1 Dental alloy\n2.2 Relevant material science for carrying out procedures\n2.3 Solidification\n2.4 Melting and casting\n2.5 Heat treatment\n2.6 Surface finishing\n2.7 Industry Codes of Practice\n2.8 Relevant Laws as appropriate\n2.9 Housekeeping Maintenance\n3. Underpinning skills\n3.1 Manual dexterity\n3.2 Maintaining a healthy and safe working environment\n3.3 Melting and casting techniques\n3.4 Maintaining personal hygiene\n3.5 Planning and organizing work activities\n4. Resource implication\nThe following resources MUST be provided:\n4.1 A real or simulated dental laboratory environment\n4.2 Relevant documentation, such as:\n4.2.1 industry codes of practice\n4.2.2 state legislation as appropriate\n4.2.3 housekeeping/maintenance\n4.3 Dental alloys\n4.4 A qualified workplace assessor and/or a technical expert\nworking in partnership with the assessor\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1 Demonstration with questioning\n5.2 Written Test/Examination\n5.3 Third Party Report\n5.4 Portfolio\n6. Context of\nassessment\n6.1\nAssessment may be conducted in the workplace or in a\nsimulated environment\n\n--- PDF PAGE 55 ---\nTR Dental Laboratory Technology Services (Removable Dentures/Appliances) NC II Amended April 8, 2010\n\n51"
}
