        "source_title": "FABRICATE THERMO-FORMED BASES AND APPLIANCES",
        "source_text": "--- PDF PAGE 42 ---\nTR Dental Laboratory Technology Services (Removable Dentures/Appliances) NC II                  Amended April 8, 2010    \n \n \n38\nUNIT OF COMPETENCY : \nFABRICATE THERMO-FORMED BASES AND APPLIANCES \n \nUNIT CODE \n: \nHCS322334 \n \nUNIT DESCRIPTOR          : \nThis unit covers the knowledge, skills and attitude in fabricating \nthermo-formed bases and appliances. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables\n1. Prepare model \n1.1 \nWork order is interpreted. \n1.2 \nOutline is marked and finished lines are scribed where \napplicable. \n1.3 \nBlock-out material is applied as required. \n2. Thermo-form \nappliance or base \n2.1 \n Thermo-forming material and apparatus is selected. \n2.2 \n  Heat is applied to material. \n2.3 \n  Softened material is adapted. \n2.4 \n  Material is allowed to cool. \n2.5       Adaptation is verified. \n3. Trim, shape and \nfinish appliances or \nbases \n3.1       Thermo-formed blank is removed. \n3.2       Outline is trimmed and fitted to model. \n3.3       Outline is refined. \n3.4        Appliance or base is smoothened and finished. \n \n \n \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. \nAppliances \nMay include but are not limited to: \n1.1 \nMouthguard  \n1.2      Bleach trays \n1.3      Occlussal splints \n1.4      Baseplates \n1.5      Temporary crown stents \n1.6      Retaining devices \n1.7      Custom impression trays \n2. Thermo-forming \nequipment used  \nMay include but are not limited to: \n2.1       Vacuum \n2.2        Pressure\n\n--- PDF PAGE 43 ---\nTR Dental Laboratory Technology Services (Removable Dentures/Appliances) NC II                  Amended April 8, 2010    \n \n \n39\nEVIDENCE GUIDE \n \n1. Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1      Prepared model \n1.2      Thermo-formed appliance or base from blank \n1.3      Trimmed, shaped and finished appliance or bases \n1.4      Complied with infection control policies and procedures \n1.5      Followed OH&S policies \n2. Underpinning \nknowledge  \n2.1      Relevant material science for carrying out procedures \n2.2      Oro-facial anatomy \n2.3      Thermoforming technology \n2.4      Polymer science \n2.5      Tooth morphology \n2.6      Principles of occlusion \n2.7      Industry Codes of Practice \n2.8      Relevant laws as appropriate \n2.9      Housekeeping and Maintenance Procedures \n3.  Underpinning skills \n3.1      Manual dexterity \n3.2      Maintaining a healthy and safe working environment \n3.3      Performing orthodontic procedures and wrought wire \nfabrication techniques \n3.4      Maintaining personal hygiene \n3.5      Following correct measurements \n3.6      Planning and organizing work activities \n4. Resource \nimplications \nThe following resources MUST be provided: \n4.1     A real or simulated dental laboratory environment \n4.2     Relevant documentation such as: \n4.2.1 industry codes of practice \n4.2.2 state legislation as appropriate \n4.2.3 housekeeping/maintenance procedures \n4.3     A qualified workplace assessor and/or a technical expert \nworking in partnership with the assessor \n5. Method of \nassessment \nCompetency may be assessed through: \n5.1     Demonstration with questioning \n5.2     Written Test/Examination \n5.3     Third Party Report \n5.4     Portfolio \n6. Context of \nassessment \n6.1      Competency may be assessed in the workplace or accredited \nassessment center.\n",
