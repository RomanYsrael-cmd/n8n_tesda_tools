tional health and safety policy and procedures \n4.4 \nInfection control guidelines \n4.5 \nWaste management policies \n4.6 \nRelevant state legislations \n4.7 \nManufacturer’s instructions for the use of relevant equipment, \ninstruments, medicaments, materials and Material Safety Data \nSheets (MSDS) \n4.8\nCleaning agents currently used in the workplace\n\n--- PDF PAGE 31 ---\nTR Dental Laboratory Technology Services (Removable Dentures/Appliances) NC II                  Amended April 8, 2010    \n \n \n27\n \n \n5. Method of \nassessment \nCompetency may be assessed through: \n5.1 \nWritten Test/Examination \n5.2 \nDemonstration with questioning \n5.3 \nObservation with questioning \n5.4 \nPortfolio  \n5.5\nThird Party Report\n6.  Context of \nassessment\n6.1 \nCompetency may be assessed in the workplace or in a \nsimulated work setting.",
