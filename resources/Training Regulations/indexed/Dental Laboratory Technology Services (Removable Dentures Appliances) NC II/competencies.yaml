          "source_text": "1.  Prepare case \n \n1.1  Standard precautions are applied when receiving, handling and \nworking on dentures and appliances \n1.2  Dentures and appliances are decontaminated according to \ninfection control guidelines \n1.3  Prescription are read and interpreted  \n1.4  Fractured components are examined for defects \n1.5  Fractured components are realigned, positioned and secured in \ntheir correct relationship\n2.  Prepare model \n \n2.1  Model is constructed in accordance with the dentist requirements  \n2.2  Articulation key is constructed if required \n3. Repair denture or \nappliance \n \n3.1  Denture surfaces are prepared and shaped to allow for bonding with \nthe new material \n3.2  Components are relocated  \n3.3  Materials and processing equipment are selected and prepared  \n3.4  Repair material is applied using the correct technique to acquire the \nrequired shape and thickness \n3.5  Material is processed in accordance with manufacturer’s \ninstructions/specifications\n4. Modify denture or \nappliance, where \nrequired \n \n4.1  Impressions are decontaminated according to infection control \nguidelines \n4.2  The model material is poured into the impression in accordance \nwith accepted techniques \n4.3  Where necessary, case is articulated and records are transferred or \narticulation key is constructed based on client requirement \n4.4  Denture or appliance surfaces are prepared appropriately in \naccordance with modification to be made \n4.5  Denture is relined, re-based or modified in accordance with dentist \nprescription\n5. Trim, shape and \nfinish denture or \nappliance \n \n5.1  Denture or appliance is trimmed to relevant anatomical outline or \nrequired extension of the base \n5.2  The tissue fitting surface is examined and any processing \nanomalies and sharp surfaces are removed \n5.3  Surfaces are refined and polished in order produce required \ncontours \n5.4  Finished prosthesis are evaluated in accordance with quality \nstandard \n5.5  The appliance is decontaminated according to infection control \nguidelines \n5.6  The appliance is placed in a sealed container for dispatch\n\n--- PDF PAGE 45 ---\nTR Dental Laboratory Technology Services (Removable Dentures/Appliances) NC II                  Amended April 8, 2010    \n \n \n41\nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.  Standard precautions \n \nMay include but are not limited to: \n1.1 A dedicated clean area to receive incoming cases \n1.2 Appropriate personal protection: \n1.2.1 disposable gloves \n1.2.2 apron \n1.2.3 eye protection \n1.2.4 mask where there is a risk of airborne transmission of \ninfection \n1.3 Decontamination of dentures and appliances \n1.4 Disposal of all packaging materials in accordance with the waste \nregulations of DOH and environmental authorities (DENR) \n1.5 Cleaning reusable containers with detergent followed by \ndisinfection \n1.6 Washing hands before leaving the work area \n1.7 Excluding all food and drink from the work area \n2. Decontamination of \ndentures and \nappliances \n \nMay include but is not limited to: \n2.1 Rinsing denture or appliance in clean running water \n2.2 Cleaning in an ultrasonic cleaner \n2.3 Cleaning in a mild detergent solution until all traces of blood and \nbody fluids are removed, followed by rinsing \n3. Preparation of \nmaterials \n \nMay include but is not limited to: \n3.1 Selection of materials appropriate to the removable prosthesis \nthat is to be repaired \n3.2 The correct quantities necessary for the repair \n4. Modifications to a \nprothesis \n \nMay include but is not limited to: \n4.1 Adding new artificial teeth \n4.2 Replacing existing artificial teeth \n4.3 Modifying the denture base \n4.4 Adding new metallic components \n4.5 Modifying existing metallic components \n5. Evaluation of the \nfinished prosthesis \n \nMay include but is not limited to: \n5.1  Checking the prosthesis for: \n        5.1.1  Compliance with the prescription \n        5.1.2  Quality and freedom from defects \n        5.1.3  Functional effectiveness of the design \n        5.1.4  Accurate fit to the cast\n\n--- PDF PAGE 46 ---\nTR Dental Laboratory Technology Services (Removable Dentures/Appliances) NC II                  Amended April 8, 2010    \n \n \n42"
        },
        "evidence_guide": {
          "source_text": "1.  Critical aspects of \ncompetency      \nAssessment requires evidence that the candidate: \n1.1 Complied consistently with current infection control guidelines, \nDOH and PDA requirements as they relate to the dental \ntechnician’s specific job role \n1.2 Complied consistently with occupational health and safety \npolicies and procedures as they relate to the dental technician’s \nspecific job role \n1.3 Demonstrated consistent performance over the required range of \nworkplace situations including: \n1.3.1 consistently design and manufacture oral splints  using a \nrange of materials, for a range of jaw relations and \nmalocclusions \n1.3.2 consistently use a range of articulators \n1.4 Trimmed, polished, finished and evaluated oral splints for \nsuitability for insertion in the mouth \n2.  Underpinning \nknowledge \n     and attitudes \nKnowledge on: \n2.1 Infection control guidelines for the decontamination of dentures \nand appliances that have already been inserted into the mouth \n2.2 Applied oral anatomy \n2.2.1 structures of the oral cavity – hard and soft palate, lateral \nand posterior borders of the oral cavity, tongue and floor \nof the mouth \n2.2.2 teeth – form and function \n2.2.3 dentition – Arrangement of the teeth, naming and coding \nof teeth \n2.3 Constructional faults that cause fractures of denture base \nincluding: \n2.3.1 incorrect positioning of upper posterior teeth \n2.3.2 absence of balanced occlusion \n2.3.3 insufficient thickness of acrylic resin in the anterior palatal \nregion of the denture \n2.3.4 incorrect dough consistency when packing \n2.3.5 inadequate polymerisation times and temperatures \n2.3.6 rapid cooling after processing \n2.4 Constructional faults that cause broken teeth \n2.5 Methods for modifying, repairing and maintaining removable \nprostheses \n2.6 Denture base materials\n\n--- PDF PAGE 47 ---\nTR Dental Laboratory Technology Services (Removable Dentures/Appliances) NC II                  Amended April 8, 2010    \n \n \n43\n \n3.  Underpinning skills  \n3.1  Use safe work practices to minimize the risk of transmission of \ninfection including: \n3.1.1  consistently following the procedure for washing and \ndrying hands \n3.1.2  consistently putting into practice clean techniques \n3.1.3  consistently using personal protective equipment \n3.1.4  consistently limiting contamination \n3.1.5  consistently maintaining clean receiving and work areas \n3.2  Consistently follow occupational health and safety policies and \nprocedures \n3.3  Use literacy skills to read and follow directions, policies and \nprocedures including: \n3.3.1  occupational health and safety policies and procedures \n       3.3.2  infection control policies and procedures \n       3.3.3  material safety data sheets \n       3.3.4  laboratory policies and procedures \n3.4  Select materials, techniques and equipment to reline, rebase, \nrepair and modify removable prostheses \n3.5  Consistently follow sequenced written instructions and \nmanufacturer specifications for the preparation of materials\n4.  Resource \nimplications \nThe following resources MUST be provided: \n4.1 \nA real or simulated dental laboratory  environment \n4.2 \nDental materials  \n4.3 \nDental tools and equipment  \n4.4 \nDentist requirements/prescription \n5.  Method of \nassessment \nCompetency may be assessed through: \n5.1 \nDemonstration with questioning \n5.2 \nObservation with questioning \n5.3 \nOral questioning/Interview \n6.  Context of \nassessment\n6.1 \nCompetency may be assessed in the workplace or in a \nsimulated workplace setting.",
