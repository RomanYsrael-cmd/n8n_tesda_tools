  "source_section_text": "SECTION 3 TRAINING STANDARDS\n\nThis set of standards provides Technical and Vocational Education and Training (TVET)\nproviders with information and other important requirements to consider when designing training\nprograms\nfor\nDENTAL\nLABORATORY\nTECHNOLOGY\nSERVICES\n(Removable\nDentures/Appliances) NC II.\n\nThis includes information on curriculum design, training delivery, trainee entry requirements,\ntools, materials and equipment, training facilities and trainers qualification and national\nassessment and certification arrangements.\n\n3.1 CURRICULUM DESIGN\n\nCourse Title: DENTAL LABORATORY TECHNOLOGY SERVICES\n (Removable Dentures/Appliances)\nNC Level: NC II\n\nNominal Training Hours: 1,446 Hours\n\nCourse Description:\n\nThis course is designed to enhance the knowledge, skills and attitudes of DENTAL\nLABORATORY TECHNOLOGY SERVICES (Removable Dentures/Appliances) in accordance\nwith industry standards. It covers basic, common and core competencies in NC II.\n\nBASIC COMPETENCIES\n18 Hours\nUNIT OF\nCOMPETENCY\nLEARNING OUTCOMES\nMETHODOLOGY\nASSESSMENT\nAPPROACH\n1. Participate in\nworkplace\ncommunication\n1.1\nObtain and convey\nworkplace information.\n1.2\nComplete relevant work\nrelated documents.\n1.3\nParticipate in workplace\nmeeting and discussion.\n• Group\ndiscussion\n• Interaction\n\n• Demonstration\n Observation\n• Interviews/\n• Questioning\n2. Work in a team\nenvironment\n2.1\nDescribe and identify\nteam role and\nresponsibility in a team.\n2.2\nDescribe work as a\nteam member.\n• Discussion\n• Interaction\n• Demonstration\n• Observation\n• Interviews/\n• Questioning\n3. Practice career\nprofessionalism\n3.1\nIntegrate personal\nobjectives with\norganizational goals.\n3.2\nSet and meet work\npriorities.\n3.3\nMaintain professional\ngrowth and\ndevelopment.\n• Group\ndiscussion\n• Interaction\n\n• Demonstration\n Observation\n• Interviews/\n• Questioning\n\n--- PDF PAGE 56 ---\nTR Dental Laboratory Technology Services (Removable Dentures/Appliances) NC II Amended April 8, 2010\n\n52\n4. Practice\noccupational health\nand safety\n1.1 Evaluate hazard and\nrisks.\n4.2\nControl hazards and\nrisks.\n4.3\nMaintain occupational\nhealth and safety\nawareness.\n• Discussion\n• Plant Tour\n• Symposium\n• Observation\n• Interviews\n\nCOMMON COMPETENCIES\n46 Hours\nUNIT OF\nCOMPETENCY\nLEARNING OUTCOMES\nMETHODOLOGY\nASSESSMENT\nAPPROACH\n1. Maintain an\neffective\nrelationship with\nclients and\ncustomers\n1.1\nMaintain a clean and\nhygienic environment.\n1.2\nMeet client/custormer\nrequirements\n1.3\nBuild credibility with\ncustomers/clients\n• Lecturette\n• Interaction\n\n• Observation\nand oral\nquestioning\n• Grid\nquestioning\n• Practical\nexercise\n2. Manage own\nperformance\n2.1\nPlan for completion of\nown workload.\n2.2\nMaintain quality\nperformance.\n2.3\nBuild credibility with\ncustomers/clients\n\n• Lecturette\n• Brainstroming\n\n• Observation\nand oral\nquestioning\n• Grid\nquestioning\n• Practical\nexercise\n3 Follow\noccupational health\nand safety policies\nin dental facilities\n\n3.1 Apply workplace\nprocedures for hazard\nidentification and risk\ncontrol\n3.2 Utilize and implement\nstrategies as directed to\nprevent infection in the\nworkplace\n3.3 Work in a safe manner\n• Group\nDiscussion\n• Interaction\n• Demonstration\n• Observation\n• Interviews/\n Questioning\n4 Maintain infection\ncontrol in dental\npractice\n4.1 Monitor and maintain the\ncleanliness of the dental\nlaboratory rooms\n4.2 Clean and maintain\ndental instruments and\nequipment\n4.3 Maintain hygiene and\npersonal protection\n4.4 Dispose of dental\nlaboratory waste safely\n4.5 Disinfect and clean\nimpressions\n• Group\nDiscussion\n• Interaction\n• Demonstration\n• Observation\n• Interviews/\n Questioning\n\n--- PDF PAGE 57 ---\nTR Dental Laboratory Technology Services (Removable Dentures/Appliances) NC II Amended April 8, 2010\n\n53\n5 Operate a personal\ncomputer\n5.1\nStart and shut down\nthe computer\n5.2\nArrange and customize\ndesktop display/window\nsetting\n5.3\nWork with files and\nfolders (or directories)\n5.4\nWork with user\napplication programs\n5.5\nPrint information\n\n• Group\nDiscussion\n• Interaction\n• Lecture\n• Demonstration\n• Observation\n• Interviews/\n Questioning\n• Written Exam\n\nCORE COMPETENCIES\n 1,382 Hours\nUNIT OF\nCOMPETENCY\nLEARNING OUTCOME\nMETHODOLOGY\nASSESSMENT\nAPPROACH\n1\nArrange artificial\nteeth for complete\ndentures\n1.1 Prepare case for setting\nof teeth\n1.2 Arrange artificial teeth\n1.3 Wax up denture for try-in\n• Demonstration/\nPractical Hands-\non Exercises\n• Competency-\nBased Learning\nMaterials\nMethod\n• Written\nexamination\n• Observation\n• Questioning\n\n2\nSet-up and wax\nremovable partial\ndentures\n2.1 Design acrylic removable\npartial denture\n2.2 Select and prepare\nmaterials\n2.3 Arrange artificial teeth\n2.4 Fabricate retainer units\n• Demonstration/\nPractical Hands-\non Exercises\n• Competency-\nBased Learning\nMaterials\nMethod\n• Written\nexamination\n• Observation\n• Questioning\n\n3\nWax, process and\nfinish acrylic\ndentures and\nappliances\n3.1 Wax case for finish\nconsistent with work\norder\n3.2 Select and prepare\nmaterials and processing\n3.3 Process denture or\nappliance\n3.4 Grind dentures and\nappliances selectively\n• Demonstration/\nPractical Hands-\non Exercises\n• Competency-\nBased Learning\nMaterials\nMethod\n• Written\nexamination\n• Observation\n• Questioning\n4\nFabricate thermo-\nformed bases and\nappliances\n4.1 Prepare model\n4.2 Thermo-form appliance\nor base\n4.3 Trim, shape and finish\n• Lecture/\nDemonstration\n• OJT\n• Written\nExamination\n• Demonstration\n• Observation\n\n--- PDF PAGE 58 ---\nTR Dental Laboratory Technology Services (Removable Dentures/Appliances) NC II Amended April 8, 2010\n\n54\nUNIT OF\nCOMPETENCY\nLEARNING OUTCOME\nMETHODOLOGY\nASSESSMENT\nAPPROACH\n5. Repair and modify\ndentures and\nappliances\n5.1 Prepare case\n5.2 Prepare model\n5.3 Repair denture or\nappliance\n5.4 Modify denture or\nappliance, where\nrequired\n5.5 Trim, shape and finish\ndenture or appliance\n• Lecture/\nDemonstration\n• OJT\n• Written\nExamination\n• Demonstration\n• Observation\n6\nFabricate oral\nsplints\n\n6.1 Fabricate splint\n6.2 Trim, shape and finish\n\n• Lecture/\nDemonstration\n• OJT\n• Written\nExamination\n• Demonstration\n• Observation\n7 Fabricate\northodontic\nappliances\n7.1 Select or fabricate and\nassemble components\nand materials\n7.2 Fabricate orthodontic\nappliance\n7.3 Finish orthodontic\nappliance\n• Lecture/\nDemonstration\n• OJT\n• Written\nExamination\n• Demonstration\n• Observation\n8 Fabricate cast\nmetal removable\npartial denture\nframework\n8.1 Prepare master model\n8.2 Fabricate refractory\nmodel\n8.3 Wax and invest\nremovable partial denture\nframework\n8.4 Burn out, cast and finish\nremovable partial denture\nframework\n• Lecture\n• Discussion\n• Demo\n• Written\nexamination\n• Interview\n\n--- PDF PAGE 59 ---\nTR Dental Laboratory Technology Services (Removable Dentures/Appliances) NC II Amended April 8, 2010\n\n55\n3.2 TRAINING DELIVERY\n\nThe delivery of training should adhere to the design of the curriculum. Delivery should be\nguided by the 10 basic principles of competency-based TVET.\n\n The training is based on curriculum developed from the competency standards;\n Learning is modular in its structure;\n Training delivery is individualized and self-paced;\n Training is based on work that must be performed;\n Training materials are directly related to the competency standards and the curriculum\nmodules;\n Assessment is based in the collection of evidence of the performance of work to the\nindustry required standard;\n Training is based both on and off-the-job components;\n Allows for recognition of prior learning (RPL) or current competencies;\n Training allows for multiple entry and exit; and\n Approved training programs are nationally accredited.\n\nThe competency – based TVET system recognizes various types of delivery modes, both\non and off-the-job as long as the learning is driven by the competency standards specified by\nthe industry. The following training modalities may be adopted when designing training\nprograms:\n\n The dualized mode of training delivery is preferred and recommended. Thus programs\nwould contain both in-school and in – industry training or fieldwork components. Details can\nbe referred to the Dual Training System (DTS) Implementing Rules and Regulations.\n Modular/self-paced learning is a competency-based training modality wherein the trainee is\nallowed to progress at his own pace. The trainer facilitates the training delivery\n Peer teaching/mentoring is a training modality wherein fast learners are given the\nopportunity to assist the slow learners\n Supervised industry training or on-the-job training is an approach in training designed to\nenhance the knowledge an skills of the trainee through actual experience in the workplace\nto acquire specific competencies prescribed in the training regulations.\n Distance learning is a formal education process in which majority of the instruction occurs\nwhen the students and instructor are not in the same place. Distance learning may employ\ncorrespondence study, or audio, video or computer technologies.\n Project-Based Instruction is an authentic instructional model or strategy in which students\nplan, implement and evaluate projects that have real world applicants.\n\n--- PDF PAGE 60 ---\nTR Dental Laboratory Technology Services (Removable Dentures/Appliances) NC II Amended April 8, 2010\n\n56\n3.3 TRAINEE ENTRY REQUIREMENTS:\n\nTrainees or students wishing to gain entry into these qualifications should possess the\nfollowing requirements:\n\n Must be 18 years old\n Must be a holder of a Dental Laboratory Technology Services NCI or its equivalent\n Must be physically fit and mentally fit (specifically on eye and hand coordination)\n Must be able to communicate either oral or written\n Must be at least a high school graduate or its equivalent\n\nThis list does not include specific institutional requirements such as educational\nattainment, appropriate work experience, and others that may be required of the trainees by\nthe school or training center delivering this TVET program.\n\n3.4 TOOLS, MATERIALS AND EQUIPMENT:\nDENTAL LABORATORY TECHNOLOGY SERVICES (Removable Dentures/Appliances)\nNC II\n\nRecommended list of tools, equipment and materials for the training of 25 trainees for\nDENTAL LABORATORY TECHNOLOGY SERVICES (Removable Dentures/Appliances)\nNC II are as follows:\n\nTOOLS\nEQUIPMENT\nMATERIALS\nQty.\nDescription\nQty.\nDescription\nQty.\nDescription\n25 sets\nBase Former (upper,\nlower quadrant)\n25\npcs.\n5\npcs.\n1 pc.\nArticulator, Non-\nAdjustable\nArticulator, Semi-\nAdjustable\nArticulator, Fully\nAdjustable\n25\npcs.\nAbrasive (assorted\n25 pcs.\nPlaster Knife\n1 pc. Steamer\n25\npcs.\nMasks\n25 pcs.\nCaliper\n25\npcs.\nBunsen Burner\n25\npcs.\nLaboratory Gown\n25 sets\nWaxing Instrument\nSet\n1 pc. Cleaning Unit\n1\nbox\nGloves\n5 pcs.\nChisel\n1 pc. Die Trimming\nMachine\n1\nkilo\nAcrylic Resin\n25 pcs.\nDuplicating Tray\n25\npcs.\nMicro Motor\n\nPolishing Paste and\nCompound (assorted)\n25 pcs.\nMixing Bowl\n1 pc. Vacuum Former\nMachine\n1\ngal.\nDisinfecting Solution\n25 pcs.\nPlaster Spatula\n2\npcs.\nVibrator\n\nDental Lab Waxes\n(assorted)\n25 pcs.\nImpression Tray or\nStock Tray\n2\npcs.\nLathe Machine\n25\npcs.\nAdhesives\n100\npcs.\nMandrel\n2\npcs.\nPressure Pot\n25\nkilos\neac\nh\nGypsum (assorted)\n\n--- PDF PAGE 61 ---\nTR Dental Laboratory Technology Services (Removable Dentures/Appliances) NC II Amended April 8, 2010\n\n57\n\nTOOLS\nEQUIPMENT\nMATERIALS\nQty.\nDescription\nQty.\nDescription\nQty.\nDescription\n25 pcs.\nPlaster Cutters\n1 pc. Vacuum Mixer\n25\npcs.\neach\nDuplicating Materials\n(assorted)\n25 pcs.\nAlcohol Torch\n2\npcs.\nCast Trimmer\n25\nbtls.\nAlcohol\n25 pcs.\nGuide or Template\n1\nunit\nWeighing Scale\n2\ntanks\nLaboratory Gases\n25 pcs.\nDenture/Bantam Flask\n1 unit\nInjection Moulding\nMachine/Flexibles and\naccessories\n25\nsets\nArtificial Teeth\n12 pcs.\nOrtho pliers (assorted)\n1 unit Surveyor\n25\npcs\nThermoplastic\nmaterials\n10pcs.\nFlask carrier\n5 unit High speed grinder\n25\npcs\nLight cure materials\n25 pcs.\nDuplicating Flask\n1 unit\nSandblaster\n1kl.\nNickel\nchrome/Chrome\ncobalt alloy\n\n1 unit\nHydraulic/Bench\nPresser\n5kls.\nAluminum oxide\n\n1 unit\nBoil-out unit\n25\nkls.\nInvestment materials\n\n1 unit\nCasting\nmachine/Burn-out\noven and accessories\n2\nsets\nOrthodontic wire\n1 unit\nLight curing machine\n1 gal\nSeparating medium\n1 unit\nElectro plater\n1 btl.\nDebubblelizer\n\n1 gal Electro plating\nsolution\n\n3.5 TRAINING FACILITIES\nDENTAL LABORATORY TECHNOLOGY SERVICES (Removable Dentures/Appliances)\nNC II\n\nThe Dental Laboratory Technology Services (Removable Dentures/Appliances) Learning\nFacility must be of concrete structure. Based on class size of 25 students / trainees the space\nrequirements for the teaching / learning and curriculum areas are as follows.\n\nTEACHING / LEARNING AREAS\nSIZE IN\nMETERS\nAREA IN S.\nMETERS\nTOTAL AREA IN\nSQ. METERS\nStudent/Trainee Performance Space\n(S/TPS)\n5 X 4\n20\n20\nLearning Resource Center (LRC)\n3 X 5\n15\n15\nCirculation Area\n21\n21\nSeparate Restrooms for Male and\nFemale Trainees/Students\n2 X 5\n10\n10\nTotal Workshop Area\n75 sq. m.\n\n--- PDF PAGE 62 ---\nTR Dental Laboratory Technology Services (Removable Dentures/Appliances) NC II Amended April 8, 2010\n\n58\n3.6 TRAINER QUALIFICATION (TQ II)\n\n Must have completed Trainer’s Training Methodology Course (TTMC) or its equivalent\n Must be a holder of a Dental Laboratory Technology Services (Removable\nDentures/Appliances) NC II or its equivalent\n Must be able to communicate effectively both orally and in written form\n Must be physically, emotionally, psychologically and mentally fit\n Must have a minimum of five (5) years experience as a dental technician\n\n3.7 INSTITUTIONAL ASSESSMENT\n\nInstitutional Assessment is undertaken by trainees to determine their achievement of units\nof competency. A certificate of achievement is issued for each unit of competency.\n\n--- PDF PAGE 63 ---\nTR Dental Laboratory Technology Services (Removable Dentures/Appliances) NC II Amended April 8, 2010\n\n59"
