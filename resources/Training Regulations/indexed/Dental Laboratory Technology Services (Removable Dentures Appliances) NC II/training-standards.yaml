    "source_text": "3.1 CURRICULUM DESIGN\n\nCourse Title: DENTAL LABORATORY TECHNOLOGY SERVICES\n (Removable Dentures/Appliances)\nNC Level: NC II\n\nNominal Training Hours: 1,446 Hours\n\nCourse Description:\n\nThis course is designed to enhance the knowledge, skills and attitudes of DENTAL\nLABORATORY TECHNOLOGY SERVICES (Removable Dentures/Appliances) in accordance\nwith industry standards. It covers basic, common and core competencies in NC II.\n\nBASIC COMPETENCIES\n18 Hours\nUNIT OF\nCOMPETENCY\nLEARNING OUTCOMES\nMETHODOLOGY\nASSESSMENT\nAPPROACH\n1. Participate in\nworkplace\ncommunication\n1.1\nObtain and convey\nworkplace information.\n1.2\nComplete relevant work\nrelated documents.\n1.3\nParticipate in workplace\nmeeting and discussion.\n• Group\ndiscussion\n• Interaction\n\n• Demonstration\n Observation\n• Interviews/\n• Questioning\n2. Work in a team\nenvironment\n2.1\nDescribe and identify\nteam role and\nresponsibility in a team.\n2.2\nDescribe work as a\nteam member.\n• Discussion\n• Interaction\n• Demonstration\n• Observation\n• Interviews/\n• Questioning\n3. Practice career\nprofessionalism\n3.1\nIntegrate personal\nobjectives with\norganizational goals.\n3.2\nSet and meet work\npriorities.\n3.3\nMaintain professional\ngrowth and\ndevelopment.\n• Group\ndiscussion\n• Interaction\n\n• Demonstration\n Observation\n• Interviews/\n• Questioning\n\n--- PDF PAGE 56 ---\nTR Dental Laboratory Technology Services (Removable Dentures/Appliances) NC II Amended April 8, 2010\n\n52\n4. Practice\noccupational health\nand safety\n1.1 Evaluate hazard and\nrisks.\n4.2\nControl hazards and\nrisks.\n4.3\nMaintain occupational\nhealth and safety\nawareness.\n• Discussion\n• Plant Tour\n• Symposium\n• Observation\n• Interviews\n\nCOMMON COMPETENCIES\n46 Hours\nUNIT OF\nCOMPETENCY\nLEARNING OUTCOMES\nMETHODOLOGY\nASSESSMENT\nAPPROACH\n1. Maintain an\neffective\nrelationship with\nclients and\ncustomers\n1.1\nMaintain a clean and\nhygienic environment.\n1.2\nMeet client/custormer\nrequirements\n1.3\nBuild credibility with\ncustomers/clients\n• Lecturette\n• Interaction\n\n• Observation\nand oral\nquestioning\n• Grid\nquestioning\n• Practical\nexercise\n2. Manage own\nperformance\n2.1\nPlan for completion of\nown workload.\n2.2\nMaintain quality\nperformance.\n2.3\nBuild credibility with\ncustomers/clients\n\n• Lecturette\n• Brainstroming\n\n• Observation\nand oral\nquestioning\n• Grid\nquestioning\n• Practical\nexercise\n3 Follow\noccupational health\nand safety policies\nin dental facilities\n\n3.1 Apply workplace\nprocedures for hazard\nidentification and risk\ncontrol\n3.2 Utilize and implement\nstrategies as directed to\nprevent infection in the\nworkplace\n3.3 Work in a safe manner\n• Group\nDiscussion\n• Interaction\n• Demonstration\n• Observation\n• Interviews/\n Questioning\n4 Maintain infection\ncontrol in dental\npractice\n4.1 Monitor and maintain the\ncleanliness of the dental\nlaboratory rooms\n4.2 Clean and maintain\ndental instruments and\nequipment\n4.3 Maintain hygiene and\npersonal protection\n4.4 Dispose of dental\nlaboratory waste safely\n4.5 Disinfect and clean\nimpressions\n• Group\nDiscussion\n• Interaction\n• Demonstration\n• Observation\n• Interviews/\n Questioning\n\n--- PDF PAGE 57 ---\nTR Dental Laboratory Technology Services (Removable Dentures/Appliances) NC II Amended April 8, 2010\n\n53\n5 Operate a personal\ncomputer\n5.1\nStart and shut down\nthe computer\n5.2\nArrange and customize\ndesktop display/window\nsetting\n5.3\nWork with files and\nfolders (or directories)\n5.4\nWork with user\napplication programs\n5.5\nPrint information\n\n• Group\nDiscussion\n• Interaction\n• Lecture\n• Demonstration\n• Observation\n• Interviews/\n Questioning\n• Written Exam\n\nCORE COMPETENCIES\n 1,382 Hours\nUNIT OF\nCOMPETENCY\nLEARNING OUTCOME\nMETHODOLOGY\nASSESSMENT\nAPPROACH\n1\nArrange artificial\nteeth for complete\ndentures\n1.1 Prepare case for setting\nof teeth\n1.2 Arrange artificial teeth\n1.3 Wax up denture for try-in\n• Demonstration/\nPractical Hands-\non Exercises\n• Competency-\nBased Learning\nMaterials\nMethod\n• Written\nexamination\n• Observation\n• Questioning\n\n2\nSet-up and wax\nremovable partial\ndentures\n2.1 Design acrylic removable\npartial denture\n2.2 Select and prepare\nmaterials\n2.3 Arrange artificial teeth\n2.4 Fabricate retainer units\n• Demonstration/\nPractical Hands-\non Exercises\n• Competency-\nBased Learning\nMaterials\nMethod\n• Written\nexamination\n• Observation\n• Questioning\n\n3\nWax, process and\nfinish acrylic\ndentures and\nappliances\n3.1 Wax case for finish\nconsistent with work\norder\n3.2 Select and prepare\nmaterials and processing\n3.3 Process denture or\nappliance\n3.4 Grind dentures and\nappliances selectively\n• Demonstration/\nPractical Hands-\non Exercises\n• Competency-\nBased Learning\nMaterials\nMethod\n• Written\nexamination\n• Observation\n• Questioning\n4\nFabricate thermo-\nformed bases and\nappliances\n4.1 Prepare model\n4.2 Thermo-form appliance\nor base\n4.3 Trim, shape and finish\n• Lecture/\nDemonstration\n• OJT\n• Written\nExamination\n• Demonstration\n• Observation\n\n--- PDF PAGE 58 ---\nTR Dental Laboratory Technology Services (Removable Dentures/Appliances) NC II Amended April 8, 2010\n\n54\nUNIT OF\nCOMPETENCY\nLEARNING OUTCOME\nMETHODOLOGY\nASSESSMENT\nAPPROACH\n5. Repair and modify\ndentures and\nappliances\n5.1 Prepare case\n5.2 Prepare model\n5.3 Repair denture or\nappliance\n5.4 Modify denture or\nappliance, where\nrequired\n5.5 Trim, shape and finish\ndenture or appliance\n• Lecture/\nDemonstration\n• OJT\n• Written\nExamination\n• Demonstration\n• Observation\n6\nFabricate oral\nsplints\n\n6.1 Fabricate splint\n6.2 Trim, shape and finish\n\n• Lecture/\nDemonstration\n• OJT\n• Written\nExamination\n• Demonstration\n• Observation\n7 Fabricate\northodontic\nappliances\n7.1 Select or fabricate and\nassemble components\nand materials\n7.2 Fabricate orthodontic\nappliance\n7.3 Finish orthodontic\nappliance\n• Lecture/\nDemonstration\n• OJT\n• Written\nExamination\n• Demonstration\n• Observation\n8 Fabricate cast\nmetal removable\npartial denture\nframework\n8.1 Prepare master model\n8.2 Fabricate refractory\nmodel\n8.3 Wax and invest\nremovable partial denture\nframework\n8.4 Burn out, cast and finish\nremovable partial denture\nframework\n• Lecture\n• Discussion\n• Demo\n• Written\nexamination\n• Interview\n\n--- PDF PAGE 59 ---\nTR Dental Laboratory Technology Services (Removable Dentures/Appliances) NC II Amended April 8, 2010\n\n55"
