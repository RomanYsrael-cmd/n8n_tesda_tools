  "source_text": "SECTION 4 NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1\nTo attain the National Qualification of Dental Laboratory Technology Services\n(Removable Dentures/Appliances) NC II, the candidate must demonstrate\ncompetence in all the units of competency listed in Section 1. Successful candidates\nshall be awarded a National Certificate signed by the TESDA Director General.\n\n4.2\n The\nqualification\nof\nDental\nLaboratory\nTechnology\nServices\n(Removable\nDentures/Appliances) NC II may be attained through –\n\n4.2.1\nAccumulation of Certificates of Competency (COCs) in the following areas –\n\n•\nPerform complete denture setting and festooning\n - Arrange artificial teeth for complete dentures\n\n - Set-up and wax removable partial dentures\n•\nProcess complete denture\n - Wax, process and finish acrylic dentures and appliances\n - Fabricate thermo formed bases and appliances\n - Repair and modify dentures and appliances\n•\nPerform fabrication of oral splints\n - Fabricate oral splints\n\n - Fabricate orthodontic appliances\n•\nFabricate cast metal removable partial denture framework\n\n4.2.2 Demonstration of competence through project-type assessment covering all\nrequired units of qualification\n\n4.3\nAssessment shall focus on the core units of competency. The basic and common\nunits shall be integrated or assessed concurrently with the core units.\n\n4.4\nThe following are qualified to apply for assessment and certification:\n\n4.4.1 Graduates of formal, non-formal and informal including enterprise-based\ntraining programs.\n\n4.4.2 Experienced Workers (wage employed or self – employed)\n\n4.5\nThe guidelines on assessment and certification are discussed in detail in the\n“Procedures Manual on Assessment and Certification” and “Guidelines on the\nImplementation of the Philippine TVET Qualification and Certification System\n(PTQCS)”.\n\n--- PDF PAGE 64 ---\nTR Dental Laboratory Technology Services (Removable Dentures/Appliances) NC II\n\nAmended April 8, 2010\n\n59\n\n"
}
