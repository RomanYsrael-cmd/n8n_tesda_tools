    "source_text": "SECTION 3 TRAINING STANDARDS\n\nThese guidelines are set to provide the Technical and Vocational Education\nand Training (TVET) providers with information and other important requirements to\nconsider when designing training programs for Masonry NC Level II.\n\n3.1\nCURRICULUM DESIGN\n\nCourse Title: Masonry NC Level II\n\nNominal Training Hours: 18 hours (Basic)\n24 hours (Common)\n216 hours (core)\nCourse Description:\n\nThis course is designed to enhance the knowledge, skills and attitudes of\nmason in accordance with industry standards. It covers the basic, common and\ncore competencies in masonry.\n\nBASIC COMPETENCIES\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and convey\n workplace information.\n1.2 Complete relevant work\nrelated documents.\n1.3 Participate in workplace\n meeting and discussion.\nGroup\ndiscussion\nInteraction\n\nDemonstration\nObservation\nInterviews/\nquestioning\n2. Work in a team\nenvironment\n2.1 Describe and identify team\nrole and responsibility in a\nteam.\n2.2 Describe work as a team\n member.\nDiscussion\nInteraction\n\nDemonstration\nObservation\nInterviews/\nquestioning\n3. Practice career\nprofessionalism\n3.1 Integrate personal objectives\nwith organizational goals.\n3.2 Set and meet work priorities.\n3.3 Maintain professional growth\nand development.\nDiscussion\nInteraction\n\nDemonstration\nObservation\nInterviews/\nquestioning\n4. Practice\noccupational\nhealth and\nsafety\n4.1 Evaluate hazard and risks\n4.2 Control hazards and risks\n4.3 Maintain occupational health\nand safety awareness\nDiscussion\nPlant tour\nSymposium\nObservation\nInterview\n\n--- PDF PAGE 54 ---\n_____________________________________________________________________________________________\nTR MASONRY NC II 52\n\nCOMMON COMPETENCIES\n\nSECTOR : CONSTRUCTION\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment Approach\n1. Prepare\nconstruction\nmaterials and\ntools\n1.1 Identify Materials\n1.2 Requisition\nMaterials\n1.3 Receive and\ninspect materials\nAudio Visual\n\nSimulation\n\nDiscussion\n\nPractical\nExercise\n\nDemonstration\nDirect observation\nQuestions or interview\nPortfolio (credentials)\nWritten / Oral Test\nDemonstration\n2. Observe\nprocedures,\nSpecifications\nand Manuals\nof\nInstructions\n2.1 Identify and access\nspecification/\nmanuals\nAudio Visual\n\nSimulation\n\nDiscussion\n\nPractical Lab\n\nDemonstration\nDirect observation\nOral questioning\nWritten test or examination\nThird party report\nDemonstration (able to\nimpart knowledge and\nskills)\n3. Perform\nmensurations\nand\ncalculation\n3.1 Select measuring\ninstruments\n3.2 Carry out\nmeasurements\nand calculations\nAudio Visual\n\nSimulation\n\nDiscussion\n\nPractical Lab\n\nDemonstration\nDirect observation\nOral questioning\nWritten test or examination\nThird party report\nDemonstration (able to\nimpart knowledge and\nskills)\n4. Maintain tools\nand\nequipment\n4.1 Check condition of\ntools and\nequipment\n4.2 Perform basic\npreventive\nmaintenance\n4.3 Sharpen edge and\ntooth cutting tools\n4.4 Store tools and\nequipment\nAudio Visual\n\nSimulation\n\nDiscussion\n\nPractical Lab\n\nDemonstration\nDirect observation of\napplication of tasks.\nOral questioning\nWritten test or examination\nThird party report\nDemonstration\n\n--- PDF PAGE 55 ---\n_____________________________________________________________________________________________\nTR MASONRY NC II 53\n\nCORE COMPETENCIES\n\nThe core competencies for Masonry NC II covers the units of competency\nsuch as lay brick/block for structure, plaster concrete/masonry surface and install\npre-cast baluster and handrails.\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Lay brick/\nblock for\nstructure\n1. Identify and explain the uses\nof tools and equipment in\nbrick/block laying.\n2. Identify and explain the\ncomposition, properties, uses\nand types of masonry\nmaterials.\n3. Enumerate and explain the\nvarious methods and\nprocesses in masonry\nconstruction.\n4. Identify and interpret drawing\nsymbols and plans.\n5. Perform trade mathematics\nand mensuration.\n6. Perform 5S.\n7. Identify and describe\nsafework practices and first\naid regulations.\n8. Perform safe work practices\nand respond to emergency\nsituations.\n9. Install/dismantle scaffold.\n10. Install and mark\nbatterboards.\n11. Install reinforcing bar/dowel.\n12. Lay brick/block.\n13. Check for plumbness/\nsquareness.\n14. Construct/cast-in place\nconcrete structures.\n15. Check all brick/block and\nconcrete works for quality.\n16. Clean work site and maintain\nLecture\nDemonstration\nOn-the-Job\nDual training\nProject-based\ninstruction\n\n• Observation and\noral questioning\n• Demonstration\nand oral\nquestioning\n• Written test\n\n--- PDF PAGE 56 ---\n_____________________________________________________________________________________________\nTR MASONRY NC II 54\ntools and equipment.\n\n--- PDF PAGE 57 ---\n_____________________________________________________________________________________________\nTR MASONRY NC II 55\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n2. Plaster\nconcrete/\nmasonry\nsurface\n1. Identify and explain the uses\nof tools and equipment in\nplastering concrete surface.\n2. Identify and explain the\nmaterials used in plastering\n3. Identify and explain the use\nof masonry anchors, ties and\nreinforcements.\n4. Identify and interpret drawing\nsymbols and plans.\n5. Perform trade mathematics\nand mensuration.\n6. Perform 5S.\n7. Identify and describe safety\npractices and first aid\nregulations in plastering.\n8. Perform safe work practices\nand respond to emergency\nsituations.\n9. Install/dismantle scaffold.\n10. Establish plumbness and\nsquareness of surface.\n11. Plaster wall.\n12. Check all plastered wall/s.\n13. Clean work site and maintain\ntools and equipment.\nLecture\nDemonstration\nOn-the-Job\nDual training\nProject-based\ninstruction\n• Observation\nand oral\nquestioning\n• Demonstration\nand oral\nquestioning\n• Written test\n\n3. Install pre-\ncast baluster\nand handrails\n1. Identify and explain the uses\nof tools and equipment in\ninstalling pre-cast\nbaluster/handrails.\n2. Identify and explain the\nmaterials used in installing\npre-cast baluster/handrails.\n3. Enumerate the methods of\ninstalling pre-cast baluster\nand handrails.\n4. Identify and interpret drawing\nsymbols and plans.\n5. Perform trade mathematics\nand mensuration.\nLecture\nDemonstration\nOn-the-Job\nDual training\nProject-based\ninstruction\n\n• Observation\nand oral\nquestioning\n• Demonstration\nand oral\nquestioning\n• Written test\n\n--- PDF PAGE 58 ---\n_____________________________________________________________________________________________\nTR MASONRY NC II 56\n6. Perform 5S.\n7. Identify and describe safe\nwork practices and first aid\nregulations in installing pre-\ncast baluster and handrails.\n8. Perform safework practices\nand respond to emergency\nsituation.\n9. Lay out and mark the\nlocation of pre-cast\nbaluster/handrails.\n10. Install baluster/ handrails.\n11. Check all installed\nbaluster/handrails.\n12. Clean work site and maintain\ntools and equipment.\n\n3.2 TRAINING DELIVERY\n\nThe delivery of training should adhere to the design of the curriculum.\nDelivery should be guided by the 10 basic principles of competency-based\nTVET.\n\n• The training is based on curriculum developed from the competency\nstandards;\n• Learning is modular in its structure;\n• Training delivery is individualized and self-paced;\n• Training is based on work that must be performed;\n• Training materials are directly related to the competency standards and\nthe curriculum modules;\n• Assessment is based in the collection of evidence of the performance of\nwork to the industry required standard;\n• Training is based both on and off-the-job components;\n• Allows for recognition of prior learning (RPL) or current competencies;\n• Training allows for multiple entry and exit; and\n• Approved training programs are Nationally Accredited\n\n--- PDF PAGE 59 ---\n_____________________________________________________________________________________________\nTR MASONRY NC II 57\n\nThe competency-based TVET system recognizes various types of delivery\nmodes, both on and off-the-job as long as the learning is driven by the\ncompetency standards specified by the industry. The following training\nmodalities may be adopted when designing training programs:\n\n• The dualized mode of training delivery is preferred and recommended.\nThus programs would contain both in-school and in-industry training or\nfieldwork components. Details can be referred to the Dual Training System\n(DTS) Implementing Rules and Regulations.\n• Modular/self-paced learning is a competency-based training modality\nwherein the trainee is allowed to progress at his own pace. The trainer just\nfacilitates the training delivery.\n• Peer teaching/mentoring is a training modality wherein fast learners are\ngiven the opportunity to assist the slow learners.\n• Supervised industry training or on-the-job training is an approach in\ntraining designed to enhance the knowledge and skills of the trainee\nthrough actual experience in the workplace to acquire specific\ncompetencies prescribed in the training regulations.\n• Distance learning is a formal education process in which majority of the\ninstruction occurs when the students and instructor are not in the same\nplace. Distance learning may employ correspondence study, audio, video\nor computer technologies.\n\n3.3 TRAINEE ENTRY REQUIREMENTS\n\nTrainees or students wishing to gain entry into this course should possess\nthe following requirements:\n\n•\ncan communicate either oral and written\n•\nphysically and mentally fit\n•\nwith good moral character\n•\ncan perform basic mathematical computation and mensuration\n\n--- PDF PAGE 60 ---\n_____________________________________________________________________________________________\nTR MASONRY NC II 58\n\n3.4\nLIST OF TOOLS,EQUIPMENT AND MATERIALS\n\nRecommended list of tools, equipment and materials for the training of 25\ntrainees for Masonry NC Level II.\n\nTOOLS\nEQUIPMENT\nMATERIAL\nQty.\nDescription\nQty.\nDescription\nQty.\nDescription\n10 pcs.\nBucket\n1 unit\nOne bagger\nmixer\n625\npcs.\nConcrete Hallow\nblocks\n1 pc\nMixing board\n25 sets\nPPE\n4450\npcs.\nBricks\n12 pcs.\nShovel\n1 set\nAutomatic level\n(optional)\n20\nbags\nCement\n25 pcs.\nSteel trowel\n1 unit\nWelding\nmachine\n6 m3\nSand\n25 pcs.\nWooden float\n2 pcs.\nPortable Grinder\n50\npcs.\nReinforcing bars\n(10 mm dia)\n25 pcs.\nSteel tape\n2 pcs.\nHammer drill\n\nWater\n6 pcs.\nMason\nhammer\n2 pcs.\nElectric drill\n40 kls.\nGI wire\n6 pcs.\nPlumb bob\n\n10 kls.\nCommon wire\nNails (assorted\nsizes)\n1 set\nScaffolding\n\n100\npcs.\nLumber(2” x 2” x\n10’)\n6 pcs.\nMarking\ngauge\n\n5 kls.\nConcrete nails\n6 pcs.\nHand saw\n\n10\nbags\nLime\n2 pcs.\nBar cutter\n\n10\nbags\nFly ash\n2 pcs.\nBar bender\n\n25\npcs.\nPencil\n4 pcs.\nSteel square\n\n5 kls.\nNylon string\n25 pcs.\nCold chisel\n\n6 m3\nGravel\n12 pcs.\nHacksaw\n\n5 m\nSand Screen\n100mm\n6 pcs.\nLevel hose\n\n5 gals.\nConcrete\nneutralizer\n25 pcs.\nStraight edge\n\n9 pcs\nPlywood ½” X 4’\nX 8’\n6 pcs.\nSpirit level\n\n12\npcs.\nHandrails\n3”x4”x8”\n25 pcs.\nClaw hammer\n\n50\npcs.\n5”x5” pre-cast\nbaluster\n25 pcs.\nChalk line\n\n25 pcs.\nSteel float\n\n4 pcs.\nMeasuring\nbox\n\n--- PDF PAGE 61 ---\n_____________________________________________________________________________________________\nTR MASONRY NC II 59\n2 dozen\nHack saw\nblade\n\n5 kls.\nWelding rod\n\n12 pcs.\nTri-square\n\n25 pcs.\nSteel brush\n\n4 pcs.\nWheel borrow\n\n25 pcs.\n4” Paint Brush\n\n25 pcs.\n2” Paint Brush\n\n12 pcs.\nClaw bar\n\n4 pcs.\nSledge\nhammer\n\n20 meters Rope 1“ dia.\n\n4 pcs.\nPulley\n\n1 set\nDrill bits\n\nNOTE: Estimate of materials was based on an individual project of a 1m X 2m wall with 8” X 8” X\n1m concrete post hence, the kind and quantity of materials will vary accordingly on the type of\nprojects designed.\n\n3.5\nTRAINING FACILITIES\n\nMasonry NC – II\n\nThe masonry workshop must be of concrete structure. Based on class size of\n25 students/trainees the space requirements for the teaching/learning and\ncirculation areas are as follows:\n\nTEACHING/LEARNING\nAREAS\nSIZE IN\nMETERS\nAREA IN\nSQ.\nMETERS\nTOTAL AREA\nIN SQ.\nMETERS\n Open plain ground\n25 X 25\n\n625\n Lecture Room (job\nsite/school) including\nwash area\n\n62.5\nTotal Workshop Area\n\n687.50\n\n--- PDF PAGE 62 ---\n_____________________________________________________________________________________________\nTR MASONRY NC II 60\n\n3.6\nTRAINERS QUALIFICATIONS FOR\n\nMasonry NC II\n\nTRAINER QUALIFICATION (TQ II)\n\n• Must be a holder of NC III or its equivalent qualification\n• Must have undergone training on Training Methodology II (TM II) or have\nattended any trainer training methodology course accredited by TESDA\nor graduate of any education course\n• Must be physically and mentally fit\n• Must have at least 2 years job/industry experience\n\nReference: TESDA Board Resolution No. 2004 03\n\n3.7\nINSTITUTIONAL ASSESSMENT\n\nInstitutional assessment is undertaken by trainees to determine their\nachievement of units of competency. A certificate of achievement is issued\nfor each unit of competency.\n\n--- PDF PAGE 63 ---\n_____________________________________________________________________________________________\nTR MASONRY NC II 61"
