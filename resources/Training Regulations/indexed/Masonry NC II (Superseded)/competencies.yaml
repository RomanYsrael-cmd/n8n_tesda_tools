        "evidence_guide": {
          "source_text": "1. Critical aspects\nof competency\nAssessment requires evidence that the candidate:\n1.1 Interpreted plans and details according to job requirements\n1.2 Prepared and selected materials consistent with the job\nrequirements\n1.3 Laid out and established location of pre-cast baluster and in\naccordance with job requirements\n1.4 Installed pre-cast baluster and handrail consistent with the job\n requirements\n1.5 Demonstrated compliance with safety regulations applicable to\n work site operations\n1.6 Demonstrated ability to produce quality installation works\n1.7 Erected scaffoldings (if needed) in accordance with OHSC\n regulation\n\n2. Underpinning\nKnowledge\n2.1 SAFE WORK PRACTICES AND FIRST AID REGULATIONS\n 2.1.1 Prevention of accidents\n 2.1.2 Appropriate actions to take when accidents occur\n 2.1.3 First aid treatments and regulations\n 2.1.4 Safe handling of materials, tools and equipment\n 2.1.5 Housekeeping for safety\n 2.1.6 Safety signs and symbols\n 2.1.7 Rules on the safe use of scaffolds and ladders\n2.2 TRADE MATHEMATICS AND MENSURATION\n 2.2.1 Linear measurements\n 2.2.2 Fundamental operations of Mathematics\n2.3 BLUEPRINT AND SPECIFICATIONS READING\n 2.3.1 Interpret blueprints / plans & drawings\n2.4 MATERIALS\n 2.4.1 Types and uses of pre-cast baluster and handrail\n 2.4.2 Form works and platforms\n 2.4.3 Scaffoldings construction elements and materials\n2.5 TRADE THEORY\n 2.5.1 Basic carpentry\n 2.5.2 Basic re-bar work\n2.6 MASONRY TOOLS AND EQUIPMENT\n 2.6.1 Types and uses of trowels\n 2.6.2 Measuring tools\n 2.6.3Proper use of hand tools\n2.7 MASONRY PROCESS\n 2.7.1 Methods of Installation of pre-cast baluster and handrail\n 2.7.2 Curing processes\n\n--- PDF PAGE 52 ---\n_____________________________________________________________________________________________\nTR MASONRY NC II 50\n\n3. Underpinning\nSkills\n3.1 Following safe work practices and first aid regulations\n3.2 Applying trade Math and mensuration\n3.3 Interpreting blueprint and specifications\n3.4 Using materials, tools and equipment\n3.5 Applying trade theory\n3.6 Following instalation of pre-cast baluster and handrail\n\n4. Resource\nImplications\nThe following resources must be provided:\n4.1 Workplace location / simulated workplace setting\n4.2 Tools and equipment appropriate to construction processes\n4.3 Scaffolding / form works / rebars required for activity\n4.4 Masonry materials relevant to the proposed activity\n4.5 Drawings / plans and specifications relevant to the task\n\n5. Methods of\nAssessment\nCompetency must be assessed through:\n5.1 Direct Observation\n5.2 Interview\n5.3 Portfolio\n5.4 Third Party Report\n5.5 Demonstration\n\n6. Context for\nAssessment\n6.1 Competency may be assessed in the workplace or in a\nsimulated workplace setting\n\n--- PDF PAGE 53 ---\n_____________________________________________________________________________________________\nTR MASONRY NC II 51"
        },
        "source_text": "CON712305\n\nUNIT DESCRIPTOR :\n\nThis unit describes the outcomes required to install pre-\ncast baluster and handrail. It covers the skills required to\nprepare and install pre-cast baluster and handrail and for\npreparing completion work report.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\n1. Lay-out / establish pre-cast\nbaluster and handrail location\n\n1.1 Appropriate PPE is selected and used according\n to job requirement\n1.2 Plans and details are interpreted as per job\n requirements\n1.3 Materials, tools and equipment are prepared\nand selected consistent with job requirements\n1.4 Pre-cast baluster and handrail is marked in\n accordance with job requirements\n\n2. Perform pre-cast baluster and\nhandrail installation\n\n2.1 Pre-cast baluster and handrail are laid-out,\naligned and secured according to job\nrequirements\n2.2 Mortar is applied to pre-cast baluster and handrail\naccording to job requirements\n2.3 Worksite is cleaned and kept in safe state in line\nwith OHS regulations\n\n3. Complete installation of pre-\ncast baluster and handrail\nwork and curing\n3.1 Final Checks are made to ensure that work\n conforms with instructions, curing and other job\n requirements.\n3.2 Inform immediate superior upon completion of\n work\n3.3 Tools, equipment and any surplus resources\n and materials are checked and monitored in\n accordance with established procedures\n3.4 Work area is maintained of its cleanliness and\n safety\n\n--- PDF PAGE 50 ---\n_____________________________________________________________________________________________\nTR MASONRY NC II 48\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Materials\n\nMay include but are not limited to:\n1.1 G.I. wires\n1.2 Reinforcing bars\n1.3 Form work materials\n1.4 Water\n1.5 Strings or nylon cord\n1.6 Concrete and CW nails\n1.7 Lumber\n\n2. Tools and equipment\n\nMay include but are not limited to:\n2.1 Push-pull rule\n2.2 Steel square\n2.3 Leveling tools ( levelling hose , spirit level)\n2.4 Plumb bob\n2.5 Mason’s hammer\n2.6 Pencil\n2.7 Pointed trowel\n2.8 Shovel\n2.9 Mortar box\n2.10 Hacksaw / bar cutter\n2.11 Finishing Trowel\n2.12 Steel float\n2.13 Chalk line\n3. PPE\nMay include but are not limited to:\n3.1 Safety goggles\n3.2 Safety shoes\n3.3 Safety gloves\n3.4 Safety belt / body harness\n3.5 Safety Helmet\n3.6 Proper working clothes\n\n4. Final checks\n4.1 Plumbness\n4.2 Levelness\n4.3 Squareness\n4.4 Alignment of balusters\n\n--- PDF PAGE 51 ---\n_____________________________________________________________________________________________\nTR MASONRY NC II 49\nEVIDENCE GUIDE\n1. Critical aspects\nof competency\nAssessment requires evidence that the candidate:\n1.1 Interpreted plans and details according to job requirements\n1.2 Prepared and selected materials consistent with the job\nrequirements\n1.3 Laid out and established location of pre-cast baluster and in\naccordance with job requirements\n1.4 Installed pre-cast baluster and handrail consistent with the job\n requirements\n1.5 Demonstrated compliance with safety regulations applicable to\n work site operations\n1.6 Demonstrated ability to produce quality installation works\n1.7 Erected scaffoldings (if needed) in accordance with OHSC\n regulation\n\n2. Underpinning\nKnowledge\n2.1 SAFE WORK PRACTICES AND FIRST AID REGULATIONS\n 2.1.1 Prevention of accidents\n 2.1.2 Appropriate actions to take when accidents occur\n 2.1.3 First aid treatments and regulations\n 2.1.4 Safe handling of materials, tools and equipment\n 2.1.5 Housekeeping for safety\n 2.1.6 Safety signs and symbols\n 2.1.7 Rules on the safe use of scaffolds and ladders\n2.2 TRADE MATHEMATICS AND MENSURATION\n 2.2.1 Linear measurements\n 2.2.2 Fundamental operations of Mathematics\n2.3 BLUEPRINT AND SPECIFICATIONS READING\n 2.3.1 Interpret blueprints / plans & drawings\n2.4 MATERIALS\n 2.4.1 Types and uses of pre-cast baluster and handrail\n 2.4.2 Form works and platforms\n 2.4.3 Scaffoldings construction elements and materials\n2.5 TRADE THEORY\n 2.5.1 Basic carpentry\n 2.5.2 Basic re-bar work\n2.6 MASONRY TOOLS AND EQUIPMENT\n 2.6.1 Types and uses of trowels\n 2.6.2 Measuring tools\n 2.6.3Proper use of hand tools\n2.7 MASONRY PROCESS\n 2.7.1 Methods of Installation of pre-cast baluster and handrail\n 2.7.2 Curing processes\n\n--- PDF PAGE 52 ---\n_____________________________________________________________________________________________\nTR MASONRY NC II 50\n\n3. Underpinning\nSkills\n3.1 Following safe work practices and first aid regulations\n3.2 Applying trade Math and mensuration\n3.3 Interpreting blueprint and specifications\n3.4 Using materials, tools and equipment\n3.5 Applying trade theory\n3.6 Following instalation of pre-cast baluster and handrail\n\n4. Resource\nImplications\nThe following resources must be provided:\n4.1 Workplace location / simulated workplace setting\n4.2 Tools and equipment appropriate to construction processes\n4.3 Scaffolding / form works / rebars required for activity\n4.4 Masonry materials relevant to the proposed activity\n4.5 Drawings / plans and specifications relevant to the task\n\n5. Methods of\nAssessment\nCompetency must be assessed through:\n5.1 Direct Observation\n5.2 Interview\n5.3 Portfolio\n5.4 Third Party Report\n5.5 Demonstration\n\n6. Context for\nAssessment\n6.1 Competency may be assessed in the workplace or in a\nsimulated workplace setting\n\n--- PDF PAGE 53 ---\n_____________________________________________________________________________________________\nTR MASONRY NC II 51"
