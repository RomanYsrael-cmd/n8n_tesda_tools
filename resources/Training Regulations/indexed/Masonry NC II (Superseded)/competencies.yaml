        "evidence_guide": {
          "source_text": "1. Critical aspects\nof competency\n\nAssessment requires evidence that the candidate:\n1.1 Correctly interpreted and identified plans and details\n1.2 Performed concrete / masonry surface preparation in\naccordance with established plastering procedure\n1.3 Performed plastering works consistent with established\nplastering procedure\n1.4 Demonstrated compliance with safety regulations applicable to\nwork site operations\n1.5 Demonstrated ability to produce quality of plastering works\n1.6 Demonstrated ability to erect and dismantle scaffolds\n1.7 Identified, minimized and eliminated safety hazards\n1.8 Communicated interactively with others when applicable to\n ensure safe and effective work operations\n1.9 Completed plastering concrete / masonry surface according to\n job specifications\nUnderpinning\n Knowledge\n2.1 SAFE WORK PRACTICES AND FIRST AID REGULATIONS\n 2.1.1 Prevention of accidents\n 2.1.2 Knows to do when accidents occur\n 2.1.3 First aid treatments and regulations\n 2.1.4 Safe handling of materials, tools and equipment\n 2.1.5 Housekeeping for safety\n 2.1.6 Safety signs and symbols\n 2.1.7 Rules on the safe use of scaffolds and ladders\n2.2 TRADE MATHEMATICS AND MENSURATION\n 2.2.1 Linear measurements\n 2.2.2 Fundamental operations of mathematics\n 2.2.3 System of measurement/Metric system of measurement\n2.3 BLUEPRINT AND SPECIFICATIONS READING\n 2.3.1 Interpret Blueprints / Plans& Drawings\n 2.3.2 Composition, properties / types , uses and sizes of\n plastering\n2.4 MATERIALS\n 2.4.1 Types / uses of Mortar\n 2.4.2 Scaffoldings construction elements and materials\n2.5 TRADE THEORY\n 2.5.1 Plastering proportion & procedures\n2.6 MASONRY TOOLS AND EQUIPMENT\n 2.6.1 Types and uses of trowels\n 2.6.2 Measuring and testing tools\n 2.6.3 Types and uses of brick hammers\n2.7 MASONRY PROCESS\n 2.7.1 Methods of Plastering Works\n 2.7.2 Economic use of material\n\n--- PDF PAGE 48 ---\n_____________________________________________________________________________________________\nTR MASONRY NC II 46\n3. Underpinning\nSkills\n\n3.1 Following safe work practices\n3.2 Applying trade Math and mensuration\n3.3 Interpreting blueprint and specification\n3.4 Using materials, tools and equipment\n3.5 Applying trade theory\n3.6 Performing plastering processes\n\n4. Resource\nImplications\nThe following resources must be provided:\n4.1 Workplace location / simulated workplace setting\n4.2 Tools and equipment appropriate to construction processes\n4.3 Scaffolding/ form works /rebars required for activity\n4.4 Masonry materials relevant to the proposed activity\n4.5 Drawings/plans and specifications relevant to the task\n\n5. Methods of\nAssessment\nCompetency must be assessed through:\n5.1 Direct Observation\n5.2 Interview\n5.3 Portfolio\n5.4 Third Party Report\n5.5 Demonstration\n\n6. Context for\nAssessment\n\n6.1 Competency may be assessed in the workplace or in a\nsimulated workplace setting\n\n--- PDF PAGE 49 ---\n_____________________________________________________________________________________________\nTR MASONRY NC II 47\n\nUNIT OF COMPETENCY : INSTALL PRE-CAST BALUSTER AND HANDRAILS\n\nUNIT CODE :"
        },
        "source_text": "CON712304\n\nUNIT DESCRIPTOR :\n\nThis unit covers the knowledge, skills and attitudes in\nplastering concrete / masonry surface. It includes skills\nrequired for preparing concrete / masonry surfaces for\nplastering and performing plastering work.\n\n ELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\n1. Prepare concrete / masonry\nsurfaces for plastering\n\n1.1 Appropriate PPE is selected and used\naccording to job requirements.\n1.2 Plans and details are interpreted as per job\nrequirements\n1.3 Materials, tools and equipment are selected\nand prepared in line with job requirements\n1.4 Materials are properly staged/stockpiled at\n designated workplace and must be free from\n any foreign matters\n1.5 Wall surface preparation is performed according\n to establish plastering procedure\n\n2. Perform plastering work\n\n2.1 Limits of plastering are determined to establish\nrequired thickness, plumbness, squareness,\nlevelness and alignment of structure\n2.2 Plastering wall is performed according to\n job requirements\n2.3 Distribution of mortar / coating is applied on\nthe wall surface evenly\n2.4 Work site is cleaned and kept in safe state in\n accordance with OHS regulations\n\n3. Complete plastering work /\n curing\n4.1 Final Checks are made to ensure that work\n conforms with instructions, curing and other job\n requirements\n4.2 Inform immediate superior upon completion of\n work\n4.3 Tools, equipment and any surplus resources\n and materials are checked and monitored in\n accordance with established procedures\n4.4 Work area is maintained of its cleanliness and\n safety\n\n--- PDF PAGE 46 ---\n_____________________________________________________________________________________________\nTR MASONRY NC II 44\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. PPE\n1.1 Safety goggles\n1.2 Safety shoes\n1.3 Working Gloves\n1.4 Dust mask\n1.5 Safety belt\n1.6 Safety helmet\n1.7 Proper working clothes\n\n2. Materials\nMay include but are not limited to :\n2.1 Mortar\n2.2 Plastering guide\n2.3 String or nylon cord\n2.4 Concrete and CW nails\n2.5 Water\n\n3. Tools and equipment\nMay include but are not limited to :\n3.1 Mason's hammer\n3.2 Scaffolding\n3.3 Steel tape / push-pull rule\n3.4 Plumb bob\n3.5 Leveling tools (leveling hose, spirit level)\n3.6 Pail\n3.7 Mortar box\n3.8 Pointed trowel\n3.9 Wooden float\n3.10 Steel float\n3.11 Shovel\n3.12 Foam / paper\n3.13 Straight edge / screed (bara)\n3.14 Mason's brush\n3.15 Claw hammer\n\n4. Final checks\n4.1 Plumbness\n4.2 Levelness\n4.3 Squareness\n4.4 Evenness or flatness of surface\n\n--- PDF PAGE 47 ---\n_____________________________________________________________________________________________\nTR MASONRY NC II 45\nEVIDENCE GUIDE\n1. Critical aspects\nof competency\n\nAssessment requires evidence that the candidate:\n1.1 Correctly interpreted and identified plans and details\n1.2 Performed concrete / masonry surface preparation in\naccordance with established plastering procedure\n1.3 Performed plastering works consistent with established\nplastering procedure\n1.4 Demonstrated compliance with safety regulations applicable to\nwork site operations\n1.5 Demonstrated ability to produce quality of plastering works\n1.6 Demonstrated ability to erect and dismantle scaffolds\n1.7 Identified, minimized and eliminated safety hazards\n1.8 Communicated interactively with others when applicable to\n ensure safe and effective work operations\n1.9 Completed plastering concrete / masonry surface according to\n job specifications\nUnderpinning\n Knowledge\n2.1 SAFE WORK PRACTICES AND FIRST AID REGULATIONS\n 2.1.1 Prevention of accidents\n 2.1.2 Knows to do when accidents occur\n 2.1.3 First aid treatments and regulations\n 2.1.4 Safe handling of materials, tools and equipment\n 2.1.5 Housekeeping for safety\n 2.1.6 Safety signs and symbols\n 2.1.7 Rules on the safe use of scaffolds and ladders\n2.2 TRADE MATHEMATICS AND MENSURATION\n 2.2.1 Linear measurements\n 2.2.2 Fundamental operations of mathematics\n 2.2.3 System of measurement/Metric system of measurement\n2.3 BLUEPRINT AND SPECIFICATIONS READING\n 2.3.1 Interpret Blueprints / Plans& Drawings\n 2.3.2 Composition, properties / types , uses and sizes of\n plastering\n2.4 MATERIALS\n 2.4.1 Types / uses of Mortar\n 2.4.2 Scaffoldings construction elements and materials\n2.5 TRADE THEORY\n 2.5.1 Plastering proportion & procedures\n2.6 MASONRY TOOLS AND EQUIPMENT\n 2.6.1 Types and uses of trowels\n 2.6.2 Measuring and testing tools\n 2.6.3 Types and uses of brick hammers\n2.7 MASONRY PROCESS\n 2.7.1 Methods of Plastering Works\n 2.7.2 Economic use of material\n\n--- PDF PAGE 48 ---\n_____________________________________________________________________________________________\nTR MASONRY NC II 46\n3. Underpinning\nSkills\n\n3.1 Following safe work practices\n3.2 Applying trade Math and mensuration\n3.3 Interpreting blueprint and specification\n3.4 Using materials, tools and equipment\n3.5 Applying trade theory\n3.6 Performing plastering processes\n\n4. Resource\nImplications\nThe following resources must be provided:\n4.1 Workplace location / simulated workplace setting\n4.2 Tools and equipment appropriate to construction processes\n4.3 Scaffolding/ form works /rebars required for activity\n4.4 Masonry materials relevant to the proposed activity\n4.5 Drawings/plans and specifications relevant to the task\n\n5. Methods of\nAssessment\nCompetency must be assessed through:\n5.1 Direct Observation\n5.2 Interview\n5.3 Portfolio\n5.4 Third Party Report\n5.5 Demonstration\n\n6. Context for\nAssessment\n\n6.1 Competency may be assessed in the workplace or in a\nsimulated workplace setting\n\n--- PDF PAGE 49 ---\n_____________________________________________________________________________________________\nTR MASONRY NC II 47\n\nUNIT OF COMPETENCY : INSTALL PRE-CAST BALUSTER AND HANDRAILS\n\nUNIT CODE :"
