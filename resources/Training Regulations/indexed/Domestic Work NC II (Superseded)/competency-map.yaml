  "source_text": "COMPETENCY MAP\nHOUSEHOLD SERVICES NC II\nClean living room,\ndining room,\nbedrooms, toilets and\nkitchen\nWash and iron\nclothes, linen and\nfabric\nPrepare hot and cold\nmeals\nProvide food and\nbeverage\nservices\nMaintain an effective\nrelationship with\nclients and customer\nManage\nown\nperformance\nEstablish\nprofessionalism\nin the workplace\nLead workplace\ncommunication\nWork with\nothers\nWork in team\nenvironment\nLead small\nteams\nSolve problems\nrelated to work\nactivities\nReceive and\nrespond to\nworkplace\ncommunication\nParticipate in\nworkplace\ncommunication\nBASIC\nCOMPETENCIES\nApply problem\nsolving\ntechniques to\nworkplace\nPlan and\norganize work\nPractice career\nprofessionalism\nDemonstrate\nwork values\nPractice\noccupational\nhealth and safety\nprocedures\nDevelop and\npractice\nnegotiation\nskills\nUse\nmathematical\nmethod\nUse relevant\ntechnologies\nUtilize\nspecialized\ncommunication\nskills\nDevelop team\nand individual\nCollect, analyze\nand organize\ninformation\nPromote\nenvironmental\nprotection\nPractice basic\nhousekeeping\nprocedures\nMonitor activities\nwithin area of\nresponsibility\nEnforce access\ncontrol and\nIdentification system\nSecure territorial\njurisdiction of the\ncompany\nEnforce emergency\nresponse procedures\nPrepare security\nreports\nApply OHS practices\nand 5S in the\nworkplace\nApply quality\nstandards\nELECTIVE\nCOMPETENCIES\nProvide care and\nsupport to infants and\ntoddlers\nProvide care and\nsupport to children\nProvide care and\nsupport to elderly\nProvide care and\nsupport to people\nwith special needs\nAssist in the care of\nanimals\nComplete animal\ncare hygiene routines\nTrim and Prune\nlandscape plants\nPerform weeding and\ncultivation\nWater/irrigate plants\nControl and prevent\nplant pest and\ndiseases\n\n--- PDF PAGE 108 ---\nTR Domestic Work NC II (Amended)\nPromulgated February 2017\n105",
