        "evidence_guide": {
          "source_text": "1. Critical aspects of \ncompetency  \n      \n \nAssessment requires evidence that the candidate \n1.1 \nPrepared ingredients according to recipes \n1.2 \nCooked meals and dishes according to recipes \n1.3 \nPresented cooked dishes \n1.4 \nPrepared appetizers \n1.5 \nPrepared sauces, dressings and garnishes \n1.6 \nPrepared desserts and salads \n1.7 \nPrepared sandwiches \n1.8 \nStored excess foods and ingredients \n1.9 \nConverted unconsumed cooked and uncooked food \n2. Required Knowledge \n2.1 \nFood Theory \n2.2 \nMaterials Specifications and Uses \n2.3 \nTools and Equipment: Uses and Specifications \n2.4      Codes and Regulations \n2.4.1 Pertinent food and drink sanitation laws, rules and \nregulations \n2.5 \nMaintenance Operation \n2.6 \nBalance Diet \n2.7 \nNutrition  \n2.8 \nFood Serving \n2.9 \nSafe Work Practices and First Aid Regulations \n2.10 Personal Hygiene \n2.11 Providing Safe Food \n2.12 Food and Safety Hazard \n2.13 Safe Food Handling \n2.14 Food Costing and Portioning \n2.15 Food Storage \n2.16 Method of Preparing Salad \n2.17 Handling of Kitchen Equipment \n3. Required Skills \n3.1 \nCooking Method \n3.2 \nHandling of Kitchen Equipment \n3.3 \nProper Storing \n3.4 \nFood Costing and Portioning \n4. Resource \nImplications  \n \nThe following resources should be provided: \n4.1 \nFacilities, equipment, supplies and materials relevant to the \nunit of competency \n5. Methods of \nAssessment \nCompetency in this unit must be assessed through: \n5.1 \nWritten Test/Examination \n5.2 \nDemonstration with questioning \n5.3 \nObservation with questioning \n5.4 \nOral Questioning/Interview \n5.5 \nPortfolio Assessment \n6. Context of \nAssessment \n6.1 \nCompetency may be assessed in the workplace or in a \nsimulated work setting.",
