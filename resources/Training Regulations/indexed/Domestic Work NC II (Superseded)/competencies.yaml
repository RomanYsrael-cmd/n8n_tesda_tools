        "source_text": "HCS913302\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes in washing and\nironing clothes, linen and fabric. It includes checking and sorting\nsoiled clothes, linen and fabric, removing stains, preparing washing\nequipment and supplies, performing laundry, drying and ironing\nclothes, linen and fabric.\n\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Check and sort\nclothes, linens and\nfabrics\n1.1\nSoiled clothes, linen and fabrics are sorted according to texture,\ncolor, size and defects.\n1.2\nSorted items are prioritized according to the cleaning process\nrequired ad the urgency of the item.\n1.3\nDefective clothing, linen and fabric are sewn/darned using\nappropriate threads and stitches.\n2. Remove stains\n2.1\nPersonal protective paraphernalia are worn in accordance with\nstandard operating procedures (SOPs).\n2.2\nStain removing agents and chemicals are used in accordance\nwith manufacturer’s instruction.\n2.3\nStains are treated and removed using correct chemicals or\nagents.\n2.4\nAll stain removing agents and chemicals are stored following\nsafety procedures.\n3. Prepare washing\nequipment and\nsupplies\n\n3.1\nLaundry area is cleaned and made ready at all times.\n3.2\nLaundry supplies and materials are prepared and made\navailable at all times.\n3.3\nWashing machine is checked and prepared for operation per\nmanual procedures.\n4. Perform laundry\n\n4.1\nCorrect laundry method is selected as per SOPs.\n4.2\nClothes, linen and fabric are washed according to the labeling\ncodes and washing instructions.\n4.3\nLaundry equipment is used in accordance with manufacturer’s\ninstruction.\n4.4\nClothes, linen and fabric are freed from stain, dirt and unpleasant\nodor after washing based on procedures.\n4.5\nWashed clothes, linen and fabric are sun-dried/machine dried as\nper instructions.\n4.6\nDried clothes, linen and fabric are freed from unpleasant odor\nand static cling.\n4.7\nWashing area is cleaned in accordance with safety and health\nprocedures.\n4.8\nEquipment is cleaned after use in accordance with\nmanufacturer’s instructions.\n4.9\nAll cleaning materials and equipment are stored following safety\nprocedures.\n4.10\nRoutine maintenance is carried out or arranged as per standard\noperating procedures.\n5. Dry clothes, linen and\nfabric\n\n5.1\nWashed clothes, linen and fabric are dried according to\nprocedures.\n5.2\nDrying machine is prepared according to procedure.\n5.3\nDried clothes, linen and fabric are removed when dryer bell rings\nor stops to prevent wrinkles and to minimize need for ironing.\n5.4\nClothes, linen and fabric are dried without wrinkles according to\nprocedures.\n6. Iron clothes, linens\nand fabrics\n\n6.1\nIroning is done in accordance to the standard procedures.\n6.2\nIroned clothes, linens and fabrics are folded, placed in a hanger\nand stored in designated cabinets as per instructions.\n6.3\nIroning equipment and materials are stored in the appropriate\narea following safety procedures.\n\n--- PDF PAGE 31 ---\nTESDA-SOP-QSO-01-F08\nTR Domestic Work NC II (Amended)\nPromulgated February 2017\n28\nRANGE OF VARIABLES\n\nVARIABLES\nRANGE\n1. Sorted Items\nMay include:\n1.1\nSoiled/Defective Clothes\n1.2\nLinen\n1.3\nFabrics\n2. Personal Protective\nParaphernalia\nMay include:\n2.1\nGloves\n2.2\nApron\n3. Stains\nMay include:\n3.1\nCoffee\n3.2\nCola\n3.3\nCordial\n3.4\nChewing Gum\n3.5\nFood\n3.6\nMud/Dirt\n3.7\nGrease\n3.8\nBlood\n3.9\nFruit Stains\n3.10 Wine\n4. Stain Removers\nMay include:\n4.1\nAcid Cleaners\n4.2\nAlkali Cleaners\n4.3\nChlorine Bleach\n4.4\nAll-Purpose Detergent\n5. Laundry Area\nMay include:\n5.1\nWashers\n5.2\nDryers\n5.3\nClothesline\n5.4\nClothes Pins\n5.5\nClothespin Bag\n5.6\nClothes Rack for Indoor Drying\n6. Laundry Supplies and\nMaterials\nMay include:\n6.1\nSorting Baskets/Shelves\n6.2\nHangers\n6.3\nStain Removing Agents\n6.4\nFabric Softener\n6.5\nChlorine Bleach\n6.6\nLaundry Bag\n6.7\nLaundry Basket\n\n--- PDF PAGE 32 ---\nTESDA-SOP-QSO-01-F08\nTR Domestic Work NC II (Amended)\nPromulgated February 2017\n29\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nChecked and sorted soiled clothes, linen and fabric\n1.2\nRemoved stains\n1.3\nPrepared washing equipment and supplies\n1.4\nPerformed laundry\n1.5\nDried clothes, linen and fabric\n1.6\nIroned clothes, linen and fabric\n2. Required Knowledge\n2.1\nProcedures in Sorting Laundry\n2.2\nPrinciples and Procedures in Darning Holes and Tears\n2.3\nHygiene, Health and Safety issues Specific to Laundry\nOperations\n2.4\nTypes/Uses and Handling of Laundry Chemicals\n2.5\nPrinciples and Procedures in Removing Stains\n2.6\nTypes/Uses of Stain Removing Agents\n2.7\nLanguage Label (Fabric and Garments Labels)\n2.8\nTypes and Characteristics of Clothes, Linen and Fabric\n2.9\nStandard Procedures in Checking and Preparing Washing\nMachine\n2.10 Procedures in Preparing Laundry Supplies and Materials\n2.11 Preparing Mixtures or Bleaching Solutions\n2.12 Types and Uses of Washing Machines and Dryers\n2.13 Principles and Procedures in Washing, Drying and Ironing\nClothes, Linen and Fabric\n2.14 Hygiene, Health and Safety Issues of Specific Relevance to\nLaundry Operations\n2.15 Maintenance of Laundry Area\n2.16 Procedures in Drying Clothes, Linen and Fabric\n2.17 Procedures in Ironing Clothes, Linen and Fabric\n2.18 Types/Uses of Ironing Equipment, Tools and Paraphernalia\n2.19 Procedures in Storing Clothes, Linen and Fabric\n2.20 Basics of Pressing\n2.21 Types and Uses of Irons, Ironing Boards and Ironing\nAccessories\n2.22 Types and Use of Hangers\n2.23 Folding Method and Techniques\n2.24 Pressing Procedures\n3. Required Skills\n3.1\nChecking and sorting soiled clothes, linen and fabric\n3.2\nRemoving Stains\n3.3\nPreparing washing equipment and supplies\n3.4\nPerforming laundry\n3.5\nDrying clothes, linen and fabric\n3.6\nIroning clothes, linen and fabric\n4. Resource\nImplications\nThe following resources should be provided:\n4.1\nFacilities, equipment, supplies and materials relevant to the\nunit of competency\n5. Methods of\nAssessment\nCompetency in this unit must be assessed through:\n5.1\nWritten Test/Examination\n5.2\nDemonstration with questioning\n5.3\nObservation with questioning\n5.4\nOral Questioning/Interview\n5.5\nPortfolio Assessment\n6. Context of\nAssessment\n6.1\nCompetency may be assessed in the workplace or in a\nsimulated work setting.\n\n--- PDF PAGE 33 ---\nTESDA-SOP-QSO-01-F08\nTR Domestic Work NC II (Amended)\nPromulgated February 2017\n30\nUNIT OF COMPETENCY :\nPREPARE HOT AND COLD MEALS/FOOD\n\nUNIT CODE\n:"
