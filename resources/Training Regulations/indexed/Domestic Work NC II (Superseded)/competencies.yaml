        "source_title": "PROVIDE CARE AND SUPPORT TO ELDERLY",
        "source_text": "--- PDF PAGE 48 ---\nTESDA-SOP-QSO-01-F08 \nTR Domestic Work NC II (Amended) \nPromulgated February 2017 \n45 \nUNIT OF COMPETENCY : \nPROVIDE CARE AND SUPPORT TO ELDERLY \n \nUNIT CODE \n: \nHCS323305 \n \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge, skills and attitudes required in \nproviding support and assistance to maintain quality care for the \nelderly to meet his/her daily needs including nourishment, mobility, \npersonal hygiene and other support within the plan of care. \n \nELEMENTS \nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables \n1. Establish and maintain \nan appropriate \nrelationship with the \nelderly \n1.1\nSelf introduction by the caregiver to the elderly client is done \nbased on established procedures. \n1.2 \nAppropriate attitudes such as confidentiality, privacy, courtesy \nand respect are adhered to and demonstrated towards the \nelderly based on established procedures. \n1.3 \nThe elderly’s own interest, rights, freedom and decision-making \nare supported and respected based on established procedures. \n1.4 \nShort interpersonal exchanges with the elderly in establishing, \ndeveloping and maintaining rapport are encouraged.\n2. Provide appropriate \nsupport to the elderly  \n2.1\nAll support is provided to the elderly in accordance with the \nelderly’s needs, rights, self determination and individual \ndifferences. \n2.2 \nThe elderly is encouraged and supported to participate in \nceremonial, cultural, educational, recreational, religious, social, \nand spiritual activities as appropriately planned. \n2.3 \nAssistance is provided at all times in order to maintain a safe \nand healthy environment, including minimizing    physical \ndangers and risk of infections based on established procedures. \n2.1 \nProper response to situations of risks to health and safety is \nprovided and maintained based on established procedures.\n3. Provide assistance \nwith elderly’s personal \ncare needs \n3.1\nPersonal preferences are identified in consultation with the \nelderly and a plan for execution is mapped out based on \nestablished procedures. \n3.2 \nThe elderly is supported and encouraged in exercising their \nrights and personal preferences without compromising their \nsafety and those of others and in accordance with established \nprocedures. \n3.3 \nShort interpersonal exchanges, clarifying meaning and \nmaintaining interaction to identify the elderly’s preferences are \nconducted based on established procedures. \n3.4 \nTime is scheduled to effectively listen to the elderly’s preferences \nto maximize his/her well being.\n4.  Provide assistance \nwith the elderly’s \npersonal care needs  \n4.1\nThe elderly’s personal care needs (aids to daily living) are \nidentified and assistance provided. \n4.2 \nSpecific concerns and difficulties in meeting some personal care \nneeds are identified, clarified and modified with the elderly in \norder to effectively address such concerns and problem needs. \n4.3 \nAssistive devices for providing assistance for the elderly are \nidentified and used as appropriate. \n4.4 \nOrganizational policies and practices for reporting are followed \nas appropriate. \n4.5 \nThe elderly’s self esteem and confidence are enhanced. \n4.6 \nProvisions for interaction between the elderly and the community \nare researched and developed.   \n4.7 \nDevelopmental and progressing personal care needs are \nidentified, acknowledged and provided for as appropriate. \n4.8 \nEmpathy is demonstrated in supporting and caring for the \nelderly’s feelings of grief and loss.\n\n--- PDF PAGE 49 ---\nTESDA-SOP-QSO-01-F08 \nTR Domestic Work NC II (Amended) \nPromulgated February 2017 \n46 \nRANGE OF VARIABLES \n \nVARIABLES \nRANGE \n1. Elderly rights may be \ndetailed in \nMay include:\n1.1 \nService/outcomes standards documents \n1.2 \nLegislation \n1.3 \nOrganizational policies and practices \n2. Short interpersonal \nexchanges \nMay include:\n2.1 \nChatting in friendly manner \n2.2 \nInquiring about the elderly’s health  \n2.3 \nShort casual exchanges \n2.4 \nEffective communication \n2.5 \nDialogue \n2.6 \nQuestion and answer/interview techniques \n3. Needs of the elderly \nMay include:\n3.1 \nPhysical, sexual \n3.2 \nFinancial \n3.3 \nHousehold assistance and maintenance \n3.4 \nReligious \n3.5 \nCultural \n3.6 \nSpiritual \n3.7 \nRecreational \n3.8 \nSocial and emotional \n3.9 \nIntellectual \n4. Factors contributing \nto individual \n     difference  \nMay include:\n4.1 \nCulture \n4.2 \nAge \n4.3 \nEconomic \n4.4 \nSocial \n4.5 \nGender \n4.6 \nPhysical \n4.7 \nIntellectual \n4.8 \nLanguage \n4.9 \nSpiritual \n4.10 Marital Status \n5. Assistance \nMay include:\n5.1 \nProviding information and advice \n5.2 \nAccompanying or providing specific services \n5.3 \nEncouragement and support for decisions and actions \n5.4 \nCompanionship \n6. Maximum well being \nMay include:\n6.1 \nIndependent living \n6.2 \nObservation of own customs and cultural practices coming \nand going from environment with safety \n6.3 \nBelonging to social groups \n6.4 \nFrequent visits to and from family, relatives and friends \n6.5 \nCompanionship \n6.6 \nEfficient care from caregiver\n\n--- PDF PAGE 50 ---\nTESDA-SOP-QSO-01-F08 \nTR Domestic Work NC II (Amended) \nPromulgated February 2017 \n47 \nVARIABLES \nRANGE \n7. Personal care needs \nMay include:\n7.1 \nDaily living including: \n7.1.1 Maintaining personal safety \n7.1.2 Communication (speech, writing, non-verbal \ncommunication) \n7.1.3 Eating and drinking \n7.1.4 Eliminating \n7.1.5 Breathing \n7.1.6 Mobilizing and transferring (moving from place to place \nand position to position) \n7.1.7 Attending to personal hygiene (bathing, laundering \npersonal linen) \n7.1.8 Dressing and undressing \n7.1.9 Attending to own spiritual needs \n7.1.10 Grooming and expressing sexuality \n7.1.11 Toileting \n7.1.12 Keeping appointments (Doctors, Dentists, Bankers, \nLawyers) \n7.1.13 SPICE (Spice, Physical, Intellectual, Creative and \nEmotional) activities \n7.2 \nDaily Routine \n7.2.1 Accessing education and employment \n7.2.2 Accessing financial resources and allowances \n7.2.3 Paying bills and regular outgoings \n7.2.4 Shopping \n7.2.5 Preparing meals \n7.2.6 Climbing stairs \n7.2.7 Maintaining household (cleaning, laundry, décor, \nrepair) \n7.2.8 Traveling by private and public transport \n7.2.9 Interacting with others and socializing \n7.2.10 Accessing leisure, recreational and sporting activities \n7.3 \nAssisting with self-administration of medication according to: \n7.3.1 Organizational practice and policy \n7.3.2 Government regulation, policy and legislation \n7.3.3 Instructions from the elderly, their trustees, medical \nteam and significant others \n7.4 \nPhysical comfort and rest \n7.4.1 Appropriate rest \n7.4.2 Proper clothing \n7.4.3 Fit dentures \n7.4.4 Aids (wheelchairs, braces, walker, reading glasses) \n7.4.5 Comfortable bed and chair \n7.5 \nPrivacy \n7.6 \nConfidentiality \n7.7 \nTo be treated in a dignified, safe and comfortable manner  \n7.8 \nTo express success, satisfied or own feelings \n8. Assistive Devices\nMay include:\n8.1 \nWheelchair \n8.2 \nWalker \n8.3 \nCane \n8.4 \nCrutches \n8.5 \nParallel Bars \n8.6 \nFeeding Utensils \n8.7 \nHandrails \n8.9 \nCommode \n8.10 Reading Materials\n\n--- PDF PAGE 51 ---\nTESDA-SOP-QSO-01-F08 \nTR Domestic Work NC II (Amended) \nPromulgated February 2017 \n48 \n \nVARIABLES \nRANGE \n9. Appropriate \ncommunication and \nrelationship building \nprocesses  \nMay include:\n9.1 \nCourtesy \n9.2 \nEmpathy \n9.3 \nNon judgmental manner \n9.4 \nListening \n9.5 \nTreating the elderly person as an individual \n9.6 \nRespect for difference \n9.6.1 Cultural \n9.6.2 Physical \n9.6.3 Emotional \n9.6.4 Beliefs \n9.6.5 Customs \n9.6.6 Values \n9.6.7 Religions \n10 Assistance may vary \naccording to \nMay include:\n10.1 The ability of the worker \n10.2 Mental well being \n10.3 Physical well being \n10.4 Social well being \n10.5 Emotional well being \n10.6 Creative well being \n11. Factual information \nto identify the \nelderly’s preferences \nmay be gathered by \nMay include:\n11.1 Asking questions \n11.2 Observing the elderly \n11.3 Asking for clarification from the elderly \n11.4 Asking other significant people such as relatives, friends, staff \n11.5 Listening for relevant information concerning the elderly’s \npreferences \n11.6 Offering choices and suggestions \n11.7 Consulting professionals’ opinions and suggestions for the \nelderly to consider \n12. Assistance may vary \naccording to \nMay include:\n12.1 The ability of the worker \n12.2 Mental well being \n12.3 Physical well being \n12.4 Social well being \n12.5 Emotional well being \n12.6 Creative well being \n13. Processes and aides May include:\n13.1 Meals on wheels \n13.2 All equipment and aids \n13.3 Transport services \n13.4 Around the clock caregiver \n13.5 Occasional caregiver \n13.6 Senior lodges accommodation \n13.7 Trips to or visits from medical team \n14. Reporting \nMay include:\n14.1 Changes in appearance and behavior in accordance with \nreporting instructions \n14.2 Medicine chart \n14.3 Observation log book \n14.4 Incident and Accident Reports\n\n--- PDF PAGE 52 ---\nTESDA-SOP-QSO-01-F08 \nTR Domestic Work NC II (Amended) \nPromulgated February 2017 \n49 \nVARIABLES \nRANGE \n15. Reporting may be to\nMay include:\n15.1 Supervisors \n15.2 Colleagues \n15.3 Health workers \n15.4 Administrator \n15.5 Health care services \n15.6 Emergency services \n15.7 Community care \n15.8 Social services \n15.9\nRelatives\n16. Reporting may be \nvia \nMay include:\n16.1 Telephone \n16.2 Hand over reports \n16.3 Face to face \n16.4\nWritten\n17. Social and personal \nwell being \nMay include:\n17.1 Being independent \n17.2 Maintenance of personal contacts \n17.3 Control of financial affairs \n17.4 Coming and going from environment within safety \nrequirements \n17.5 Observation of own customs and cultural practices \n17.6 Exercising legal, social and other obligations and \nresponsibilities \n17.7 Keeping and maintaining personal possessions \n17.8 Privacy \n17.9 Access and entitlement to respite and other services \n17.10  Maintaining  community participation \n17.11 Participation in programs and activities \n17.12 Sharing knowledge and skills\n18. Well being may vary \naccording to \nMay include:\n18.1 Service provision environment e.g. independent living, \nresidential care facility, day center \n18.2 Health Status \n18.3 Worker’s Role \n18.4\nSPICE Status\n19. Provision of aids \nMay include:\n19.1 Referral to advisory centers \n19.2\nInformation\n20. Spiritual needs \nMay include:\n20.1 Formal and informal religious observance \n20.2 Need for private time and space for contemplation \n20.3\nCeremonial Observances\n21. Aids \nMay include:\n21.1 Mobility \n21.2 Hearing \n21.3 Speech \n21.4\nVision\n22. The elderly’s self \nesteem and \nconfidence may be \nencouraged by\nMay include:\n22.1 Assisting the elderly with difficult tasks \n22.2 Clarifying and discussing the elderly’s abilities and disabilities \n22.3\nEncouraging the elderly to try new activities\n23. Psychological needs \nMay include:\n23.1 Freedom from undue stress \n23.2 Self-esteem \n23.3 Purpose \n23.4 Personal identity \n23.5\nLife stage development\n\n--- PDF PAGE 53 ---\nTESDA-SOP-QSO-01-F08 \nTR Domestic Work NC II (Amended) \nPromulgated February 2017 \n50 \nEVIDENCE GUIDE \n \n1.  Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1 \nWorked  within roles and responsibilities in a manner which \naccommodates and accepts individual differences of the \nelderly \n1.2 \nEstablished and maintained appropriate relationship with the \nelderly \n1.3 \nProvided appropriate support and assistance with the elderly’s \npersonal care needs \n1.4 \nUnderstood and adhered to own roles and responsibilities \n1.5 \nUnderstood accountability and responsibility of supervisors \nand colleagues \n1.6 \nConsulted with the elderly, including asking questions, \nobserving, listening and suggesting \n1.7 \nRecognized and understood the elderly’s rights and personal \npreferences including the ability to list the elderly’s \npreferences. \n1.8 \nDemonstrated a non-judgmental attitude to the different \nemotional, psychological and spiritual needs of the elderly in \nall communications \n2.  Required Knowledge  2.1 \nTypes, uses, specifications and maintenance of bathing \nparaphernalia \n2.2 \nProcedures of bathing and dressing the elderly \n2.3 \nProper care of elders \n2.4 \nPrinciples and procedures in taking vital signs \n2.5 \nCommon signs and symptoms of common illnesses \n2.6 \nPrinciples and procedures of medicine administration \n2.7 \nRelevant plan of care, roles and responsibilities of caregiver \n4.1 \nRelevant policies, protocols and practices of the certain \norganizations in relation to services to the elderly \n2.9 \nProcess of ageing \n2.10 Different religious, cultural, spiritual, physical and ceremonial \nperspectives \n2.11 Causes, implications and treatment of  dementia and other \nelderly related conditions \n2.12 Depending on the work, roles or services provided, specific \nknowledge of particular groups or issues may be required like: \n2.12.1 Alcohol and other drugs \n2.12.2 Cultural and linguistics diversity \n2.12.3 Risk of self harm \n2.12.4 Women \n2.12.5 Men \n2.12.6 Community education \n2.12.7 Mental health \n2.13 Common problems of the elderly and their ramifications       \n2.14 Different cultural requirements and preferences \n2.15 Factors giving rise to grief and loss in the elderly \n2.16 Safety risks to the elderly \n2.17 Major systems of the body\n\n--- PDF PAGE 54 ---\nTESDA-SOP-QSO-01-F08 \nTR Domestic Work NC II (Amended) \nPromulgated February 2017 \n51 \n3.   Required Skills \n3.1 \nAbility to establish and maintain a relationship that takes into \naccount the elderly’s individual differences (e.g. age, abilities, \ndisabilities, cultural background) \n3.2 \nOral communication skills (language skills) and non-verbal \ncommunication skills (e.g. touch, smiling, etc.) necessary to \ndevelop a trusting relationship with an elderly. Language skills \nmay be English, mother language or technical language \n(medical terms) as required by employment service or \norganization \n3.3 \nOral communication skills (language competence) required to \nfulfill job roles as specified by the employment \norganization/service. Oral communication skills include asking \nquestions, clarifying understanding of the elderly’s \npreferences and expressing encouragement in oral \ncommunication. Service/organization may require competence \nin English or native language, as required by the elderly. \n3.4 \nReading and writing skill (literacy competence) required to \nfulfill job roles as specified by employment \norganization/service. The level of skills may range from the \nability to write short messages or a shopping list, to assist the \nelderly with banking, reading of mail, answering the phone, \nreceiving messages etc. the employment service/organization \nmay require competence in a language other than English, \ndepending on job request \n3.5 \nBasic counseling \n4. Resource \nImplications \nThe following resources should be provided \n4.1 \nA childcare workplace \n4.2 \nFacilities, equipment, supplies and materials relevant to the \nunit of competency \n5. Methods of \nAssessment \nCompetency in this unit must be assessed through: \n5.1 \nDemonstration with questioning \n5.2 \nInterview \n6. Context of \nAssessment \n6.1 \nCompetency may be assessed in the workplace or in a \nsimulated work setting.\n",
