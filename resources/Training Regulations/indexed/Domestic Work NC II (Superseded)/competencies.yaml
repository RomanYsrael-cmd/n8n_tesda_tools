          "source_text": "1. Explore workplace \nactivities and basic \nterminology \n1.1 \nIndustry terminology is used to describe and identify animal \ncare workplace activities. \n1.2 \nAnimal care workplace tasks are identified and ranked in \norder of importance to animal wellbeing and general health. \n1.3 \nPotential occupational health and safety (OHS) risks when \nworking with animals are identified and reporting requirements \nconfirmed. \n1.4 \nDaily workplace information and documentation \nrequirements are confirmed with supervisor. \n2. Maintain a clean \nworkplace \n2.1 \nFloors benches and other flat areas are cleaned in accordance \nwith workplace protocols. \n2.2 \nAnimal housing areas are cleaned in accordance with \nworkplace protocols. \n2.3 \nWaste and soiled bedding is disposed of in accordance with \nworkplace protocols. \n3. Assist in feeding \nanimals \n3.1 \nFood stuffs are identified and categorized for specific animal \ndietary needs. \n3.2 \nEquipment used in food preparation and distribution is made \nready for use. \n3.3 \nAssistance is provided to experienced staff in the preparation \nand distribution of meals. \n3.4 \nEquipment and materials are cleaned and stored in \naccordance with organizational policies and procedures. \n4. Report basic animal \nbehavior and health \nstatus \n4.1 \nCharacteristics of animal behavior are identified. \n4.2 \nSigns of healthy, sick or distressed animals are identified and \nbehavior and health status is reported to supervisor.\n\n--- PDF PAGE 62 ---\nTESDA-SOP-QSO-01-F08 \nTR Domestic Work NC II (Amended) \nPromulgated February 2017 \n59 \nRANGE OF VARIABLES \nVARIABLES \nRANGE \n1. Animal care \nworkplace tasks  \nMay include:\n1.1 \nAssisting in heath care of animals \n1.2 \nEnclosure and bed cleaning and bedding replacement \n1.3 \nEquipment and consumables stocktake and ordering \n1.4 \nExercising animals \n1.5 \nFeeding and watering animals \n1.6 \nFollowing environmentally sustainable work practices \n1.7 \nGrooming and animal cleaning \n1.8 \nInformation collection, record and resource update \n1.9 \nObserving animal behavior and reporting \n1.10 Taking messages and relaying information to appropriate \nperson \n1.11\nCleaning workplace and equipment.\n2. OHS risks when \nworking with animals \nMay include:\n2.1 \nAnimal bites, envenomation, kicks, scratches and crush \ninjuries \n2.2 \nBiological hazardous waste and sharps disposal \n2.3 \nHandling of chemicals and medicines \n2.4 \nGas leakage \n2.5 \nInhalation of aerosol particles \n2.6 \nIntraocular contamination \n2.7 \nManual handling, including carrying, lifting and shifting \n2.8 \nNeedle pricks and cuts from other sharps \n2.9 \nRelease of infective agents (animal and human) \n2.10 Slippery or uneven work surfaces \n2.11\nZoonoses.\n3. Daily workplace \ninformation and \ndocumentation  \nMay include:\n3.1 \nAccident and incident records \n3.2 \nAnimal feeding, health and treatment records \n3.3 \nAnimal identification and history \n3.4 \nOHS and emergency procedures and contact information \n3.5 \nEquipment inventory, damage and repairs registers \n3.6 \nProvisions records of current stock and items used and items \nrequired \n3.7\nStaff work roster.\n4. Characteristics of \nanimal behavior  \nMay include:\n4.1      Indicators of stress: \n4.1.1 \nAggressive behavior \n4.1.2 \nSubdued behavior \n4.1.3 \nTrembling \n4.1.4 \nVocalization \n4.2     Confidence and willingness to be approached gestures: \n4.2.1      Relaxed body tone and tail wagging \n4.2.2      Standing still or remaining sitting or laying down \nwhen approached \n4.3     Defensive gestures: \n4.3.1      Defending territory, other animals or food \n4.3.2      Growling, barking, hissing and spitting \n4.3.3      Hair on topline being raised \n4.3.4      Lunging forward \n4.3.5      Pecking \n4.3.6      Striking out with paws \n4.4  Submissive gestures: \n4.4.1      Lowering body \n4.4.2      Rolling onto back \n4.4.3      Tail between legs \n4.4.4     Turning away from handler.\n\n--- PDF PAGE 63 ---\nTESDA-SOP-QSO-01-F08 \nTR Domestic Work NC II (Amended) \nPromulgated February 2017 \n60"
