        "source_text": "HCS323306\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes required in\nproviding support and assistance to maintain quality care for people\nwith special needs to be able to enhance their abilities to\ncommunicate and be independent; responding to the physical,\nmedical, health and safety, personal care and home maintenance\nrequirements of people with disabilities.\n\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Establish and\nmaintain appropriate\nrelationship with\npeople with special\nneeds\n1.1\nAll dealings with people with special needs are aimed at\ngenerating a trusting relationship which includes protecting\nconfidentiality, privacy, individual choices and the right to\ndecision making.\n1.2\nRespect for individual differences is demonstrated in all\ndealings with people with special needs.\n1.3\nSupport for the interests, rights and decision making of people\nwith special needs is demonstrated in all dealings.\n1.4\nPeople with special needs are actively encouraged and\nsupported to communicate ideas, feelings and preferences.\n2. Provide appropriate\nsupport to people\nwith special needs\n2.1\nAll support to people with special needs is provided in\naccordance with their needs, rights and self determination.\n2.2\nAssistance is provided to people with disabilities according to\nthe employment organization guidelines.\n2.3\nInformation required by people with special needs are\nidentified and provided.\n2.4\nReactions and limitations regarding differences are\nrecognized and appropriate assistance is sought to ensure\nthat the rights of people with special needs are upheld.\n3. Assist in maintaining\nwell being of people\nwith special needs.\n3.1\nPeople with special needs are provided with support in\nmaintaining a clean, safe and comfortable environment.\n3.2\nSituations of risk to health and safety are responded to in\naccordance with established and approved health and\nsafety procedures.\n3.3\nPeople with special needs are actively encouraged to practice\nself expression.\n3.4\nRights and responsibilities of people with special needs are\ndiscussed with them professionally and in a non-threatening\nand non-critical ways.\n3.5\nStrategies are developed for people with special needs to\nassert self terms of accomplishments and achievements.\n\n--- PDF PAGE 56 ---\nTESDA-SOP-QSO-01-F08\nTR Domestic Work NC II (Amended)\nPromulgated February 2017\n53\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n4. Assist people with\nspecial needs to\nidentify and meet\ntheir needs\n4.1\nThe dignity, privacy and personal choice of people with\nspecial needs in relation to needs are upheld.\n4.2\nPeople with special needs are assisted to identify, select and\nprioritize their specified nursing needs.\n4.3\nPeople with special needs are assisted to identify, select,\nprioritize and fulfill or implement their social, physical,\nintellectual, creative and emotional activities.\n4.4\nPeople with special needs are assisted to select and develop\nstrategies to meet their requirements in order to achieve their\nnursing needs.\n5. Assist people with\nspecial needs in\nmaintaining an\nenvironment that\nenables maximum\nindependent living\n5.1\nThe types, frequency and triggers of challenging behaviors of\na person with special needs are identified, assessed and\nresearched.\n5.2\nStrategies for the prevention and management of\nchallenging behavior/s are planned and implemented\naccording to approved safety procedures.\n5.3\nPeople with special needs are encouraged and supported to\nexpress self.\n5.4\nIndependent thinking (such as decision, opinion and\npreferences) by people with special needs are encouraged\nand supported.\n5.5\nStrategies that would promote independence of people with\nspecial needs are developed and implemented.\n\n--- PDF PAGE 57 ---\nTESDA-SOP-QSO-01-F08\nTR Domestic Work NC II (Amended)\nPromulgated February 2017\n54\nRANGE OF VARIABLES\nVARIABLES\nRANGE\n1. Tools and equipment\nMay include:\n1.1\nBed with side rails\n1.2\nNight Light\n1.3\nHandrails\n1.4\nAssistive device (wheelchair, cane, walker and crutches\n1.5\nCommode\n1.6\nFeeding Utensils\n1.7\nClock\n1.8\nReading Materials\n1.9\nActivity Kit\n2. Individual differences\nMay include:\n2.1\nDaily living such as:\n2.1.1\nCulture\n2.1.2\nAge\n2.1.3\nEconomic\n2.1.4\nSocial\n2.1.5\nGender\n2.1.6\nPhysical\n2.1.7\nEmotional\n2.1.8\nIntellectual\n2.1.9\nLanguage\n2.2\nRights may be detailed in:\n2.2.1 Service/outcomes standards\n2.2.2 Legislation\n2.2.3 Organizational policies and practice\n2.3\nSupport will be in the Context for services offered including:\n2.3.1 Personal support\n2.3.2 Employment support\n2.3.3 Community access\n2.3.4 Accommodation support\n2.3.5\nLifestyle support\n3. Assistance\nMay include:\n3.1\nProviding information\n3.2\nAssistance with mobility or providing specific support such as\ntransport\n3.3\nEncouragement and support for decisions and and actions\n3.4\nGeneral household assistance and maintenance\n4. Differences\nMay include:\n4.1\nIndividual (age, gender, ability, history, personal preferences)\n4.2\nCultural\n4.3\nSpiritual\n4.4\nSexual preference\n5. Rights\nMay include:\n5.1\nChoose for oneself\n5.2\nHave meaningful work\n5.3\nPrivacy\n5.4\nDignity\n5.5\nConfidentiality\n5.6\nSelf determination\n5.7\nAppropriate support\n5.8\nSkill development\n5.9\nAdvocacy\n5.10\nBeing treated as a valued individual\n5.11\nFair treatment\n5.12\nRight to enter into a relationship\n5.13\nRight to express sexuality\n6. Responsibilities\n\nMay include:\n6.1\nAct within the law\n6.2\nTreat others with consideration and respect\n6.3\nAbide by family obligations\n6.4\nAbide by the policies and procedures of the services being used\n\n--- PDF PAGE 58 ---\nTESDA-SOP-QSO-01-F08\nTR Domestic Work NC II (Amended)\nPromulgated February 2017\n55\nVARIABLES\nRANGE\n7. Personal needs may\ninclude providing\nassistance with\nMay include:\n7.1\nDaily living including:\n7.1.1 Maintaining personal safety\n7.1.2 Communication (speech, writing, non-verbal\ncommunication)\n7.1.3 Eating and drinking\n7.1.4 Eliminating\n7.1.5 Breathing\n7.1.6 Mobilizing and transferring (moving from place to place\nand position to position)\n7.1.7 Attending to personal hygiene (bathing, laundering\npersonal linen)\n7.1.8 Dressing and undressing\n7.1.9 Attending own spiritual needs\n7.1.10 Grooming and expressing sexuality\n7.2\nPhysical/instrumental activities of daily living:\n7.2.1 Accessing education and employment\n7.2.2 Accessing financial resources and allowances\n7.2.3 Paying bills and regular outgoings\n7.2.4 Shopping\n7.2.5 Preparing meals\n7.2.6 Climbing stairs\n7.2.7 Maintaining household (cleaning, laundry, décor,\nrepairs)\n7.2.8 Traveling by private and public transport\n7.2.9 Interacting with others and socializing\n7.2.10 Accessing leisure, recreational and sporting activities\n7.3\nAssisting with self-administration of medication according to:\n7.3.1 Organizational practice and policy\n7.3.2 Government regulation, policy and legislation\n7.4\nPhysical comfort and rest\n7.5\nPain management\n7.6\nMaximization of independence and personal preferences\n7.7\nEmpowerment e.g. Enhancing of clients ability to\ncommunicate, act independently and uphold rights and\nresponsibilities\n8. Strategies to meet\nneeds\nMay include:\n8.1\nResponding to requirements arising from differences\n8.2\nUtilizing personal support equipment e.g. chair lifts,\nwheelchairs, hearing impaired phones, etc.\n8.3\nEnlisting specialist skills\n9. Support may be\nprovided\nMay include:\n9.1\nIn the clients home\n9.2\nAt residential or other services\n10.Relevant legislation\nand policies on health\nand safety\nMay include:\n10.1 Occupational health and safety\n10.2 State health acts\n10.3 EEO legislation\n10.4 Organizational policies and guidelines\n10.5 Daily living\n10.6 Medications\n10.7 Dealing with changes in physical or mental well being\n10.8 Occupational Health and Safety\n10.9 Sexual Harassment\n10.10 Abuse prevention\n11.Prevention and\nmanagement of\nchallenging behavior\nMay include:\n11.1 Recognizing triggers and deflecting them\n11.2 Using active listening and observation skills\n11.3 Ensuring effective communication\n11.4\nSeeking expert assistance\n\n--- PDF PAGE 59 ---\nTESDA-SOP-QSO-01-F08\nTR Domestic Work NC II (Amended)\nPromulgated February 2017\n56\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nEstablished and maintained appropriate relationship with\npeople who have special needs\n1.2\nProvided appropriate support to people with special needs\n1.3\nAssisted in maintaining the well being of people with special\nneeds\n1.4\nAssisted people with special needs to identify and meets their\nneeds\n\n2. Required Knowledge 2.1\nRelevant organizational policies and procedures and\nresponsibilities within it\n2.2\nRelevant policies, protocols and practices of the organization\nin relation to own work activities\n2.3\nBasic knowledge of different types of disabilities and their\neffects on clients need\n2.4\nUnderstanding of support requirements for people with special\nneeds\n2.5\nDifferent religious, cultural, spiritual, physical, specific\nknowledge of particular groups or issues may be required like\nthe following:\n2.5.1 Alcohol and other drugs\n2.5.2 Cultural and linguistic diversity\n2.5.3 Risk of self harm\n2.5.4 Women\n2.5.5 Men\n2.5.6 Community education\n2.5.7 Mental health\n2.6\nOrganizational philosophy and goals\n2.7\nLegislative provision in relation to the rights of people with\ndisabilities\n2.8\nBasic knowledge of human, social, psychological, cognitive\nand physical development\n2.9\nRole and responsibility of self and others in the organization\n2.10 Organization’s definition of challenging behavior\n2.11 Relevant support equipment (and technologies) and related\noccupational health and safety requirements regarding their\nuse\n2.12 Impact of particular types of disability\n2.13 Principles of empowerment/disempowerment in relation to\npeople with special needs\n2.14 Occupational health and safety guidelines\n2.15 Cultural factors affecting people with special needs\nrequirements\n2.16 Understanding of regulations and guidelines governing the\nhandling of medication\n\n--- PDF PAGE 60 ---\nTESDA-SOP-QSO-01-F08\nTR Domestic Work NC II (Amended)\nPromulgated February 2017\n57\n3. Required Skills\n3.1\nInterpersonal skills appropriate to work with people with\nspecial needs\n3.2\nOral communication skills (language skills) necessary to\ndevelop a trusting relationship with people with special needs.\nLanguage may be English or community language as required\nby service or organization\n3.3\nCommunication\n3.4\nTeam work\n3.5\nNegotiation\n3.6\nUse of equipment\n3.7\nInterpersonal communication\n3.8\nObservation as required by job role\n3.9\nAssessment as required by job role\n4. Resource\nImplications\nThe following resources should be provided:\n4.1\nA child care workplace\n4.2\nFacilities, equipment, tools, supplies and materials relevant to\nthe unit of competency.\n5. Methods of\nAssessment\nCompetency in this unit must be assessed through:\n5.1\nDemonstration with questioning\n5.2\nInterview\n6. Context of\nAssessment\n6.1\nCompetency may be assessed in the workplace or in a\nsimulated workplace setting.\n\n--- PDF PAGE 61 ---\nTESDA-SOP-QSO-01-F08\nTR Domestic Work NC II (Amended)\nPromulgated February 2017\n58\nUNIT OF COMPETENCY\n:\nASSIST IN THE CARE OF ANIMALS\n\nUNIT CODE\n:"
