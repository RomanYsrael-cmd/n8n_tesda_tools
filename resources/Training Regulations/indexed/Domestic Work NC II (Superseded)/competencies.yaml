          "source_text": "1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nCleaned surfaces and floors\n1.2\nCleaned furnishings and fixtures\n1.3\nMade-up beds and cots\n1.4\nCleaned toilets and bathrooms\n1.5\nSanitized rooms\n1.6\nMaintained clean room environment\n1.7\nCleaned kitchen\n\n2. Required Knowledge\n\n2.1\nProcedures in Cleaning, Polishing, Disinfecting and Sanitizing\nRooms (Living Room, Dining Room, Bedrooms, Bathrooms,\nToilets and Kitchen)\n2.2\nTypes and Characteristics of Floors\n2.3\nMethod of Removing Suitable Dirt/Stain\n2.4\nTypes/Uses/Functions of Cleaning Equipment, Supplies and\nMaterials\n2.5\nGlass Types, including defects\n2.6\nMethods of Identifying Stains, Mud, Dirt and Grease\n2.7\nStain Removal Techniques\n2.8\nEffects of Pre-Existing Conditions on Safe Work Practices\n2.9\nProcedures in Arranging Furniture\n2.10 Types and Characteristics of Furniture and Furnishings\n2.11 Procedures in Bed Making\n2.12 Knowledge on Different Linen and Fabric\n2.13 Procedures in Cleaning and Maintaining Room Furniture and\nFurnishings\n2.14 Knowledge on Different Areas Where Dirt and Dust Can\nEasily Accumulate\n2.15 Schedule of House Chores\n2.16 Types of Ancillary Rooms\n2.17 Types of Home Set-Up\n2.18 Types of Living Room Appliances and Ornament\n3. Required Skills\n3.1\nCleaning and Maintaining rooms (living room, bedroom,\nbathroom, toilet and kitchen)\n3.2\nHandling and Disposing of Chemical\n3.3\nReporting and Recording Information\n3.4\nCommunicating with others\n3.5\nMinimizing Waste\n3.6\nDecanting Chemicals\n3.7\nArranging Furniture\n3.8\nMaking-up Beds\n3.9\nEquipment Operation and Cleaning\n3.10 Work Planning and Organization\n3.11 Waste Minimization\n3.12 Decanting Chemicals\n\n--- PDF PAGE 29 ---\nTESDA-SOP-QSO-01-F08\nTR Domestic Work NC II (Amended)\nPromulgated February 2017\n26\n4. Resource\nImplications\nThe following resources should be provided:\n4.1\nCopies of Relevant Standards, Training Books and\nAssessment Planning Guides\n4.2\nAccident Report Forms\n4.3\nJob Specifications and Reporting Forms\n4.4\nAccess to a Suitable Venue\n4.5\nManufacturer/Enterprise Product Specifications\n4.6\nA range of equipment, including personal protective\nequipment and relevant cleaning or spot removing chemicals\n4.7\nMaterial safety data sheets and equipment operating manuals,\nif relevant\n4.8\nAccess to a registered provider of assessment services\n4.9\nChemical Color Charts\n5. Methods of\nAssessment\nCompetency in this unit must be assessed through:\n5.1\nWritten Test/Examination\n5.2\nDemonstration with questioning\n5.3\nObservation with questioning\n5.4\nOral Questioning/Interview\n5.5\nPortfolio Assessment\n6. Context of\nAssessment\n6.1\nCompetency may be assessed in the workplace or in a\nsimulated work setting.\n\n--- PDF PAGE 30 ---\nTESDA-SOP-QSO-01-F08\nTR Domestic Work NC II (Amended)\nPromulgated February 2017\n27\nUNIT OF COMPETENCY :\nWASH AND IRON CLOTHES, LINEN AND FABRIC\n\nUNIT CODE\n:"
