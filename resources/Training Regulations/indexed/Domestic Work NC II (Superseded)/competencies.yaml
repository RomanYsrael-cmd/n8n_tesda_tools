        "source_title": "PROVIDE FOOD AND BEVERAGE SERVICE",
        "source_text": "--- PDF PAGE 38 ---\nTESDA-SOP-QSO-01-F08 \nTR Domestic Work NC II (Amended) \nPromulgated February 2017 \n35 \nUNIT OF COMPETENCY : \nPROVIDE FOOD AND BEVERAGE SERVICE  \n \nUNIT CODE \n: \nHCS913304 \n \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge, skills and attitudes in food and \nbeverage service. It includes preparing dining area, setting up table, \nserving food and beverage and clearing table. \n \nELEMENTS \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1.  Prepare dining area\n \n1.1\nDining area is checked for cleanliness prior to service in \naccordance with standard operating procedures and when \nrequired, take corrective actions. \n1.2 \nDining environment is prepared and adjusted to ensure \ncomfort and ambience of client and as appropriate. \n1.3 \nFurniture is set up in accordance with standard operating \nprocedures. \n1.4 \nTables and table settings are checked for stability, and easy \naccess to client and at all times. \n1.5 \nEquipment are checked and prepared for service and as per \nSOPs. \n2.  Set-up Table\n \n2.1\nTable cloth is laid without creases and in accordance with \nprescribed procedures. \n2.2 \nTable appointment is laid according to standards. \n2.3 \nNapkin folded in accordance to table napkin folding standards.\n2.4 \nCenterpiece is arranged in accordance with standard \noperating procedures and used appropriate equipment, \nsupplies and materials. \n3.  Serve food and \nbeverage \n3.1\nFoods are checked for completeness and correctness before \nserving. \n3.2 \nFoods are placed on the tray and carried using the left hand \nand in accordance with food and beverage serving \nprocedures. \n3.3 \nFoods are served from the left side using the left hand in \nserving as per SOPs. \n3.4 \nWater goblets are filled/refilled from the right side without \nspilling as per SOPs. \n3.5 \nBeverage are taken from the bar/kitchen and inspected for \ncomplete garnishing (if any). \n3.6 \nBeverage are served on a bar tray from the right side of the \nclient being served as per SOPs. \n4.  Clear table\n \n4.1\nClients are asked politely if they are finished as per SOPs.\n4.2 \nSoiled plates/flat wares are bussed out from the right side of \nthe family members and brought to the washing station/area \nas per SOPs. \n4.3 \nTable is crumbed as per standard operating procedure. \n4.4 \nSide plates and knives are removed from the table as per \nSOPs. \n4.5 \nCondiments/shakers and other soiled items are removed from \nthe table as per SOPs. \n4.6 \nAshtrays are replaced as per SOPs. \n4.7 \nAdditional requests are asked politely from clients as per \nSOPs. \n4.8 \nClients’ needs are checked form time to time until they move \nout from the dining area as per SOPs.\n\n--- PDF PAGE 39 ---\nTESDA-SOP-QSO-01-F08 \nTR Domestic Work NC II (Amended) \nPromulgated February 2017 \n36 \nRANGE OF VARIABLES \n \nVARIABLES \nRANGE \n1.  Dining environment \nMay include: \n1.1 \nLighting \n1.2 \nRoom Temperature \n1.3 \nMusic \n1.4 \nFloral and Other Decorations \n1.5 \nPrivacy \n1.6 \nBackground  \n2.  Equipment \nMay include: \n2.1 \nTable Cloth/Linen \n2.2 \nChina Wares \n2.3 \nGlassware \n2.4 \nSilverware \n2.5 \nCutlery \n2.6 \nWine \n2.7 \nCondiments \n2.8 \nChairs \n2.9 \nTables \n2.10 Ashtray \n2.11 Toothpicks \n2.12 Cloth/Paper Napkin \n3.  Beverage \nMay include: \n3.1 \nJuice \n3.2 \nWine & Spirits \n3.3 \nTea \n3.4 \nCoffee\n\n--- PDF PAGE 40 ---\nTESDA-SOP-QSO-01-F08 \nTR Domestic Work NC II (Amended) \nPromulgated February 2017 \n37 \nEVIDENCE GUIDE \n \n1. Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1 \nPrepared the dining area \n1.2 \nSet up table \n1.3 \nServed food and beverage \n1.4 \nCleared table \n1.5 \nComplied with quality standards \n1.6 \nComplied with occupational safety and health practices \n2. Required Knowledge \n2.1 \nPrinciples and Method of Table Setting \n2.2 \nTypes and Uses of China Wares, Glassware, Silverware \n2.3 \nTypes and Uses of Crockery, Cutlery and Condiments \n2.4 \nPrinciples and Method of Serving  \n2.5 \nPlate Clearing and Carrying Techniques \n2.6 \nWaste Minimization and Environmental Techniques \n2.7 \nSafety Practices \n2.8 \nCodes and Regulations \n3. Required Skills \n3.1 \nManaging time, supplies and materials \n3.2 \nPreparing dining area \n3.3 \nSetting-up table \n3.4 \nServing food and beverage \n3.5 \nClearing table \n3.6 \nServing Techniques \n3.7 \nInterpersonal Skills \n3.8 \nVerbal and Non-Verbal Communication \n4. Resource \nImplications \nThe following resources should be provided: \n4.1 \nManual \n4.2 \nAvailability of Equipment, Supplies and Materials \n4.3 \nMenu/Recipes \n5. Methods of \nAssessment \nCompetency in this unit must be assessed through: \n5.1 \nWritten Test/Examination \n5.2 \nDemonstration with questioning \n5.3 \nObservation with questioning \n5.4 \nOral Questioning/Interview \n5.5 \nPortfolio Assessment \n6. Context of \nassessment \n6.1      Assessment may be done in the workplace or in a simulated \nworkplace setting.\n",
