 \n1.14 Nursery Rhymes \n1.15 Toys for the Crib (Mobile) \n1.16 Infants/Toddlers Toys \n1.17 Story Books \n2. Appropriate method \nor Activities   \nMay include: \n2.1 \nImitating babies’ vocalizations \n2.2 \nTalking \n2.3 \nSinging \n2.4 \nLaughing  \n2.5 \nRhymes \n2.6 \nFinger Games \n2.7 \nHolding \n2.8 \nDancing \n2.9 \nGentle Bouncing \n2.10 Substituting Activities \n2.11 Playing \n2.12 Distraction to an activity \n2.13 Cuddles, comfort \n2.14 Listening, talking with the infant or toddler quietly \n2.15 Use of  transition object\n\n--- PDF PAGE 43 ---\nTESDA-SOP-QSO-01-F08 \nTR Domestic Work NC II (Amended) \nPromulgated February 2017 \n40 \nVARIABLES\nRANGE\n3. Infants/toddlers  \nMay include: \n(May show distress by) \n3.1 \nCrying \n3.2 \nAppearing withdrawn \n3.3 \nSquirming \n3.4 \nLack of eye contact \n3.5 \nSleeping  difficulties \n3.6 \nWhining \n3.7 \nNot playing or not playing creatively \n3.8 \nRepetitive display of trauma \n3.9 \nAggression \n3.10 Regression \n3.11 Speech difficulties (e.g. Stuttering) \n3.12 Toilet training difficulties \n3.13 Nervous tics (e.g. Cough) \n3.14 Hunger \n3.15 Tiredness \n3.16 Discomfort \n3.17 Fear \n3.18 Anxiety \n3.19 Boredom \n3.20 Clinging behavior \n4.  Non Verbal Cues \nMay include: \n4.1 \nCues to indicate distress \n4.2 \nResponse to an interesting activity \n4.3 \nSmiling \n4.4 \nCues that express a desire to engage in an activity of \ninteraction \n5.  Comforters  \nMay include: \n5.1 \nSpecial toys \n5.2 \nBlankets \n5.3 \nDummies\n\n--- PDF PAGE 44 ---\nTESDA-SOP-QSO-01-F08 \nTR Domestic Work NC II (Amended) \nPromulgated February 2017 \n41"
