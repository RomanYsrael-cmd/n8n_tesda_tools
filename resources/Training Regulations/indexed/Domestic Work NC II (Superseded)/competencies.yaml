y\n7. Supplies, tools and \nequipment for \nweeding operations \n \nMay include:\n7.1 \nSmall bolo “dulos” \n7.2 \nScythe (“Karit”) \n7.3 \nSmall round/flat bar \n7.4 \nSpade \n7.5 \nTrowel \n7.6\nChemicals (Types: Selective herbicide; Wide spectrum) \n8. Tools and equipment \nfor soil cultivator \nMay in clued:\n8.1 \nSmall bolo (“dulos”) \n8.2 \nSmall round/flat bar \n8.3 \nSpade \n8.4\nSoil cultivating machine\n9. Protective/safety \ndevices used in \nweeding and \ncultivation\nMay include:\n9.1 \nGoggles \n9.2 \nOveralls, gloves \n9.3\nReflectorized vest (depends on location of work)\n10.Maintenance of clean \nand safe area \nMay include:\n10.1 Keeping public access paths and roads clear of debris, waste, \ntools and equipment \n10.2 Disabling tools and equipment after use \n10.3 Using signage and barriers where necessary \n10.4 Removing debris and waste from the work area\n\n--- PDF PAGE 76 ---\nTESDA-SOP-QSO-01-F08 \nTR Domestic Work NC II (Amended) \nPromulgated February 2017 \n73"
