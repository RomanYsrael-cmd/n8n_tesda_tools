          "source_text": "1. Prepare ingredients \naccording to recipes \n \n1.1 \nIngredients are purchased in accordance with purchase list. \n1.2 \n“Mise en place” is checked as per SOPs. \n1.3 \nThawing is prepared according to thawing procedures. \n1.4 \nMeat are prepared according to procedures and prescribed \nrecipe. \n1.5 \nVegetables are prepared according to the manner of \npreparation. \n1.6 \nSeafood are prepared according to method of preparation. \n \n2. Cook meals and \ndishes according to \nrecipes \n2.1 \nSoup is cooked as per menu. \n2.2 \nVegetable dishes are cooked according to recipe. \n2.3 \nMeat dishes are cooked according to culinary methods. \n2.4 \nPoultry and game dishes are cooked according to recipe. \n2.5 \nSea food dishes are cooked according to recipe.  \n2.6 \nEgg dishes are cooked according to client’s preference. \n2.7 \nPasta grain and farinaceous dishes are cooked according to \nrecipe.  \n \n3. Present cooked \ndishes \n3.1 \nServing portion is standardized. \n3.2 \nPresentation of cooked dishes are developed and corrected in \naccordance with SOPs. \n3.3 \nFood quality is maintained and checked as per SOPs. \n3.4 \nTime and temperature condition of foods is ensured before \nserving based on freezing temperature. \n4. Prepare sauces, \ndressings and \ngarnishes \n4.1 \nMaterials, equipment/utensils are prepared prior to \npreparation of sauces, dressings and garnishes as per SOPs. \n4.2 \nSauces, garnishes, hot and cold dressing is prepared as per \nSOPs. \n5. Prepare appetizers \n5.1 \nD’oeuvres is prepared according to requirement and \npreference of client. \n5.2 \nCanape’s are prepared according to requirement for \npreference of client. \n5.3 \nFinger foods are prepared according to requirement or \npreference of client.\n\n--- PDF PAGE 34 ---\nTESDA-SOP-QSO-01-F08 \nTR Domestic Work NC II (Amended) \nPromulgated February 2017 \n31 \nELEMENTS \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n6. Prepare desserts and \nsalads \n6.1 \nMaterials, equipment/utensils used for cooking are prepared \nas per SOPs. \n6.2  \nSherbets, ices and ice cream are prepared in accordance with \nprescribed procedures. \n6.3 \nFruit desserts are prepared as per prescribed procedures. \n6.4 \nPastry desserts are prepared as per prescribed procedures. \n6.5 \nMousse is prepared as per prescribed procedures. \n6.6 \nCold salads and molded salads are prepared as per \nprescribed procedures. \n7. Prepare sandwiches \n7.1 \nHot sandwiches are prepared as per SOPs. \n7.2 \nCold dressings are prepared as per SOPs. \n7.3 \nHot sauces are prepared as per SOPs. \n7.4 \nCold sauces are prepared as per SOPs. \n \n8. Store  excess foods \nand ingredients \n8.1 \nUnconsumed cooked food is stored according to procedures. \n8.2 \nExcess ingredients are stored according to client’s \nrequirement. \n8.3 \nProper method of refrigeration is implemented as per SOPs. \n8.4 \nProper storing of dry and wet food/ingredients is implemented \nin accordance with SOPs. \n \n9. Convert unconsumed \ncooked food \n9.1 \nUnconsumed cooked food is converted/transformed into new \ndishes as per SOPs. \n9.2 \nUnconsumed cooked food is stored/frozen at a temperature of \nzero degrees and in accordance with SOPs. \n9.3 \nPacked/wrapped uncooked foods are frozen at zero degrees \nF temperature and in accordance with SOPs. \n9.4 \nPacked/wrapped food for storage is prepared as per SOPs. \n9.5 \nUncooked food is maintained at proper temperature and as \nper SOPs.\n\n--- PDF PAGE 35 ---\nTESDA-SOP-QSO-01-F08 \nTR Domestic Work NC II (Amended) \nPromulgated February 2017 \n32 \nRANGE OF VARIABLES \n \nVARIABLES \nRANGE \n1. Ingredients\n \nMay include:\n1.1 \nMeat \n1.2 \nVegetable \n1.3 \nSeafood \n1.4 \nPoultry and Game \n1.5 \nStock \n1.6 \nCold Food \n1.7 \nCondiments \n1.8 \nMilk \n1.9 \nDairies \n1.10 Cereals \n1.11 Flour \n1.12 Butter Sauces \n1.13 Fruits  \n \n2. Mis en Place \n  \n \nMay include:\n2.1 \nIngredients \n2.2 \nPans \n2.3 \nUtensils \n2.4 \nPlates/Serving Pieces \n \n3. Thawing\n \nMay include:\n3.1 \nSoaking  \n3.2 \nUnfreezing \n \n4. Vegetable Ingredient\nPreparation \nMay include:\n4.1 \nSkin, Peel, Pare \n4.2 \nChop, Slice, Shred, Cube \n4.3 \nWedge, Grate, Pure \n4.4 \nCore, Quarter \n \n5. Vegetable Manner of \nPreparation  \n      \nMay include:\n5.1 \nBoiling, Blanching \n5.2 \nSauteing \n5.3 \nBraising \n5.4 \nGratinating \n5.5 \nRoasting/Baking \n \n6. Seafood Ingredient\n      Preparation \nMay include:\n6.1 \nChop, Slice \n6.2 \nFillet \n6.3 \nMince, Shred \n6.4 \nPeel, Dice, Blanch \n6.5 \nMarinate, Poach \n \n7. Seafood Dishes  \nPreparation  \n     \n \nMay include:\n7.1 \nBoiling, Steaming \n7.2 \nSauteing \n7.3 \nDeep Frying, Pan Frying \n7.4 \nPoaching \n7.5 \nGrilling \n7.6 \nBaking \n \n8. Soup Preparation\n      \nMay include:\n8.1 \nSauteing \n8.2 \nSimmering\n\n--- PDF PAGE 36 ---\nTESDA-SOP-QSO-01-F08 \nTR Domestic Work NC II (Amended) \nPromulgated February 2017 \n33 \nVARIABLES \nRANGE \n9. Meat Ingredient \nPreparation \nMay include:\n9.1 \nSlice, Chop \n9.2 \nDebone \n9.3 \nDice, Mince \n9.4 \nMarinate \n10. Meat Dishes  \nPreparation  \n        \nMay include:\n10.1 Boiling, Steaming, Simmering, Stewing \n10.2 Frying (deep, pan, stir) \n10.3 Sauteing \n10.4 Roasting, Baking, Browning \n10.5 Pressurize Cooking \n10.6 Poaching, Blanching, Braising \n10.7 Broiling, Grilling \n11. Poultry Ingredient \nPreparation \nMay include:\n11.1 Deboned \n11.2 Chop, Slice \n11.3 Dice, Shred, Cube \n11.4 Mince, Skin \n11.5 Marinate \n12. Poultry Dishes \nPreparation \nMay include:\n12.1 Boiling, Simmering, Stewing \n12.2 Frying (deep, pan, stir) \n12.3 Sauteing \n12.4 Braising, Grilling, Roasting \n12.5 Barbecuing, Baking \n13. Egg Dishes \nPreparation \nMay include:\n13.1 Boiling \n13.2 Frying \n13.3 Poaching \n13.4 Basting \n13.5\nBaking\n14. Pasta Grain and \nFarinaceous Dishes \nPreparation \nMay include:\n14.1 Boiling \n14.2 Steaming \n14.3 Poaching \n14.4 Sauteing \n14.5 Gratinating \n14.6 Baking \n15. Hors D’oeuvres \nPreparation \nMay include:\n15.1 Peel, Pare, Slice, Shred, Cubes \n15.2 Blanch, Boiled, Steam \n15.3 Marinate, Seasoned \n16. Sauces\nMay include:\n16.1 Sugar Syrups \n16.2 Fruit Syrups \n16.3 Fruit Purees, Sauces and Coulis \n16.4 Chocolate-Based Sauces \n16.5 Custard and Cremes \n16.6 Flavoured Butters and Creams\n\n--- PDF PAGE 37 ---\nTESDA-SOP-QSO-01-F08 \nTR Domestic Work NC II (Amended) \nPromulgated February 2017 \n34"
