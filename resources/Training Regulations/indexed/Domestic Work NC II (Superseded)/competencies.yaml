          "source_text": "1. Identify trimming and \npruning requirements \n \n1.1\nLandscape plants and their parts that are in need of trimming \nand pruning are distinguished according to landscape \nmaintenance standards (LMS). \n1.2 \nPurpose and method of pruning are determined according to \nLMS. \n1.3 \nUtility services are located using site plans and in \nconsultation with concerned persons or authority. \n1.4 \nAccess to the site is determined in consultation with \nconcerned persons or authority. \n1.5 \nOccupational Health and Safety (OHS) hazards are identified, \nrisks assessed and reported to concerned persons or \nauthority. \n2. Prepare for trimming \nand pruning \noperations \n2.1\nTools, supplies and equipment are prepared in accordance \nwith the work requirements. \n2.2 \nPre-operational and safety checks are carried out on tools and \nequipment according to manufacturer’s specifications and \nindustry work practices. \n2.3 \nPrescribed safety and personal protective equipment \n(PPE) is selected, used and maintained.  \n3. Perform trimming and \npruning  \n3.1\nSafety and warning devices are installed around the site \nduring and between work periods. \n3.2 \nLandscape plants are trimmed and pruned in accordance with \nwork program and LMS. \n3.3 \nTrimming and pruning of landscape plants are done using \nprescribed tools and equipment. \n3.4 \nSterilizing agent/compound are applied on pruning wounds \nin accordance with LMS. \n3.5 \nTasks are conducted using appropriate PPE.   \n4. Perform post-\ntrimming and pruning \nactivities \n4.1\nTrimming and pruning wastes are collected and disposed \nfrom the site in accordance with environmental standards and \nLMS. \n4.2 \nRecommended manual handling techniques are used when \nlifting or moving heavy loads. \n4.3 \nTools and equipment are cleaned, maintained and stored \naccording to LMS. \n4.4 \nMaintenance of clean and safe area is undertaken \nthroughout and on completion of work. \n4.5 \nWork outputs are recorded or reported to concerned persons \nor authority according to industry practices.\n\n--- PDF PAGE 71 ---\nTESDA-SOP-QSO-01-F08 \nTR Domestic Work NC II (Amended) \nPromulgated February 2017 \n68 \nRANGE OF VARIABLES \n \nVARIABLES \nRANGE \n1. Landscape plants \nMay include: \n1.1 \nShrubs and hedges \n1.2 \nVines \n1.3 \nPalms \n1.4 \nBamboos \n1.5 \nTrees \n2. Purpose \nMay include: \n2.1 \nCreate and maintain form and shape of landscape  plant \n2.2 \nPromote health \n2.3 \nDirect or control growth \n2.4 \nEncourage flowering and fruiting \n2.5 \nRemove/minimize risk/hazard \n3. Utility services \nMay include: \n3.1 \nAboveground utilities \n3.1.1 \nElectrical and communication lines \n3.1.2 \nCable/TV lines \n3.2 \nUnderground utilities \n3.2.1 \nIrrigation and domestic water distribution lines  \n3.2.2 \nElectrical and communication lines \n3.2.3 \nCable/TV lines \n3.2.4 \nDrainages and sewerages \n4. Concerned persons \nor authority \nMay include: \n4.1 \nSupervisor \n4.2 \nProperty management officer  \n4.3 \nHome owner \n4.4 \nInspector \n5. Hazards \nMay include: \n5.1 \nDisturbance or interruption of services \n5.2 \nSolar radiation \n5.3 \nPollutants (e.g. gaseous, suspended particulate matters) \n5.4 \nNoise \n5.5 \nManual handling of moving powered equipment or parts, \nsharp tools and materials \n5.6 \nUneven landforms/surfaces \n5.7 \nFlying and falling objects \n6. Risks \nMay include: \n6.1 \nRisk to co-workers, equipment, other people and animals \nexternal to the workplace (e.g. members of the public, stray \npets and wildlife) \n6.2 \nRisk to natural environment\n\n--- PDF PAGE 72 ---\nTESDA-SOP-QSO-01-F08 \nTR Domestic Work NC II (Amended) \nPromulgated February 2017 \n69 \nVARIABLE \nRANGE \n7. Tools, supplies and \nequipment \nMay include: \n7.1 \nHedge trimmers (HT): Power and manual \n7.2 \nShears:  Pruning, loping \n7.3 \nSaws:  Pruning saws, chain saws, bow saws \n7.4 \nPole/Tree pruner \n7.5 \nTelescopic shaft/high branch pruning chain saws \n7.6 \nLadder/adjustable ladder \n7.7 \nBasket type boom/cherry picker \n7.8 \nSterilizing agent/pruning compound \n8. Safety and PPE \nMay include: \n8.1 \nEarly warning devices \n8.2 \nOverall \n8.3 \nGloves \n8.4 \nGoggles \n8.5 \nEar muff/plugs \n8.6 \nGas mask \n8.7 \nSafety belt/harness \n8.8 \nClimbing ropes/gadgets \n8.9 \nHard hat \n8.10 Shoes/safety shoes \n8.11 Reflectorized vest (depends on location of work) \n9. Early warning \ndevices \nMay include: \n9.1 \nTraffic cones \n9.2 \nWarning tapes \n9.3 \nWarning signage \n10. Sterilizing agent/ \ncompound \n10.1 Coal tar \n10.2 Bituminous pruning compound \n10.3 Latex Paint with fungicide \n10.4 Fungicide \n11. Trimming and \npruning wastes \n \nMay include: \n11.1 Tops or shoots \n11.2 Branches \n11.3 Twigs \n11.4 Leaves \n11.5 Flowers and fruits \n12. Maintenance of clean \nand safe area \nMay include: \n12.1 Keeping public access paths and roads clear of debris, waste, \ntools and equipment \n12.2 Disabling tools and equipment after use \n12.3 Using signage and barriers where necessary \n12.4 Removing debris and waste from the work area\n\n--- PDF PAGE 73 ---\nTESDA-SOP-QSO-01-F08 \nTR Domestic Work NC II (Amended) \nPromulgated February 2017 \n70"
