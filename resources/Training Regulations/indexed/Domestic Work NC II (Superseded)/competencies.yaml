        "source_title": "MAINTAIN AN EFFECTIVE RELATIONSHIP WITH CLIENT/CUSTOMERS",
        "source_text": "--- PDF PAGE 16 ---\nTESDA-SOP-QSO-01-F08 \nTR Domestic Work NC II (Amended) \nPromulgated February 2017 \n13 \nCOMMON COMPETENCIES \n \nUNIT OF COMPETENCY : \nMAINTAIN AN EFFECTIVE RELATIONSHIP WITH \nCLIENT/CUSTOMERS \n \nUNIT CODE \n: \nHCS913201 \n \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge, skills and attitudes and values \nrequired in building and maintaining an effective relationship with \nclients, customers and the public. \n \nELEMENTS \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1.  Maintain a \nprofessional image \n1.1 \nUniform and personal grooming maintained to assignment \nrequirements.  \n1.2 \nPersonal presence maintained according to employer \nstandards. \n1.3 \nVisible work area kept tidy and uncluttered. \n1.4 \nEquipment stored according to assignment requirements. \n2.  Meet client/customer \nrequirements \n2.1 \nClient requirements identified and understood by referral to \nthe assignment instructions. \n2.2 \nClient requirements met according to the assignment \ninstructions.  \n2.3 \nChanges to client’s needs and requirements monitored and \nappropriate action taken. \n2.4 \nAll communication with the client or customer is clear and \ncomplied with assignment requirements. \n3.  Build credibility with \ncustomers/clients \n3.1 \nClient expectations for reliability, punctuality and appearance \nadhered to. \n3.2 \nPossible causes of client/customer dissatisfaction identified, \ndealt with recorded according to employer policy.  \n3.3 \nClient fully informed of all relevant security matters in a timely \nmanner and according to agreed reporting procedures.\n\n--- PDF PAGE 17 ---\nTESDA-SOP-QSO-01-F08 \nTR Domestic Work NC II (Amended) \nPromulgated February 2017 \n14 \nRANGE OF VARIABLES \n \nVARIABLES \nRANGE \n1.  Personal Presence \n \nMay include: \n1.1 \nStance \n1.2 \nPosture \n1.3 \nBody Language \n1.4 \nDemeanor \n1.5 \nGrooming \n2.  Employer Standards \nMay include: \n2.1 \nStanding Orders \n3.  Client Requirements \nMay include: \n3.1 \nAssignment Instructions \n3.2 \nPost Orders \n3.3 \nScope to modify instructions/orders in light of changed \nsituations \n4.  Assignment \nInstructions \nMay include: \n4.1 \nWriting \n4.2 \nVerbally \n4.3 \nElectronically \n5.  Client Needs and \nRequirements \nMay include: \n5.1 \nReview of the client brief and/or assignment instructions \n5.2 \nDiscussion with the client/customer \n6. Appropriate Action \n \nMay include: \n6.1 \nImplementing required changes \n6.2 \nReferral to appropriate employer personnel \n6.3 \nClarification of client needs and instructions \n7. Customers \nMay include: \n7.1 \nAll members of the public\n\n--- PDF PAGE 18 ---\nTESDA-SOP-QSO-01-F08 \nTR Domestic Work NC II (Amended) \nPromulgated February 2017 \n15 \nEVIDENCE GUIDE \n \n1.  Critical aspects of \ncompetency  \n \nAssessment requires that the candidate: \n1.1 \nMaintained a professional image \n1.2 \nInterpreted client/customer requirements from information \ncontained in the client brief and/or assignment instructions \n1.3 \nDealt successfully with a variety of client/customer interactions\n1.4 \nMonitored and acted on changing client or customer needs. \n1.5 \nMet client/customer requirements. \n1.6 \nBuilt credibility with customers/clients \n1.7 \nDemonstrated knowledge and understanding of the \nKasambahay Law (e.g. standard employment contract, rights \nand privileges, pre-employment requirements, working \nconditions, barangay registrations, social and other benefits, \netc.)\n2. Required Knowledge \n2.1 \nUniform and personal grooming requirements of the employer \nand the client \n2.2 \nOccupational health and safety requirement for the \nassignment \n2.3 \nAssignment Instructions \n2.4\nUse of various means of communication (add’l)\n3. Required Skills \n3.1 \nAttention to detail when completing client/employer \ndocumentation  \n3.2 \nInterpersonal and communication skills required in client \ncontact assignments  \n3.3 \nCustomer service skills required to meet client/customer \nneeds  \n3.4 \nPunctuality \n3.5 \nCustomer Service \n3.6 \nTelephone Technique \n3.7 \nProblem Solving and Negotiation \n3.8\nMaintaining Records\n4. Resource Implications The following resources should be provided: \n4.1 \nAssessment Centers/Venues \n4.2 \nAccredited Assessors \n4.3 \nModes of Assessment \n4.4 \nEvaluation Reports \n4.5 \nAccess to a relevant venue, equipment and materials \n4.6 \nAssignment Instructions \n4.7 \nLogbooks \n4.8 \nOperational manuals and makers/customers’ instructions  \n4.9 \nAssessment instruments, including personal planner and  \nassessment record book\n5. Methods of \nAssessment \nCompetency in this unit must be assessed through: \n5.1 \nWritten Test \n5.2 \nDemonstration with questioning \n5.3\nObservation with questioning\n6. Context of \nAssessment\n6.1      Assessment may be conducted in the workplace or in a \nsimulated environment.\n",
        "required_knowledge": null,
        "required_skills": null
      },
