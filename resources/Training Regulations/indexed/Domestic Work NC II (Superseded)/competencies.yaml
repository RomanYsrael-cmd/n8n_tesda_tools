        "source_text": "HCS913301\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills, and attitudes required in\ncleaning living room, dining room, bedrooms, toilets and bathrooms.\nIt includes the cleaning of surfaces and floors, cleaning of furnishings\nand fixtures, making up beds and cots, cleaning of toilets and\nbathroom,\nsanitizing\nrooms\nand\nmaintaining\nclean\nroom\nenvironment.\n\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Clean surfaces and\nfloors\n1.1\nAppropriate removal/cleaning equipment, supplies,\nmaterials, procedures and techniques are used in\naccordance with soil and litter types and established\nprocedures.\n1.2\nAll wastes are removed from surface based on procedures.\n1.3\nSuitable maintenance procedures is selected and applied\nbased on identified floor types and surface textures.\n1.4\nCleaning, polishing and sweeping are performed according to\nstandard operating procedures.\n1.5\nCleaning, polishing and sweeping equipment, supplies and\nmaterials are used following safety procedures and\nmanufacturer’s specifications.\n1.6\nCleaning/polishing equipment is cleaned after use in\naccordance with relevant safety procedures and\nmanufacturer’s instructions.\n1.7\nAll cleaning, polishing, sweeping materials and equipment are\nstored as per standard operating procedures (SOPs).\n1.8\nRoutine maintenance is carried out as per SOPs.\n2. Clean furnishing and\nfixtures\n2.1\nFurnishings and fixtures are cleaned in accordance with\nstandard operating procedures.\n2.2\nFurniture positioned based on comfort and convenience and\nroom lay out.\n2.3\nEquipment is cleaned after use in accordance with relevant\nsafety and manufacturer’s instructions.\n2.4\nAll cleaning materials and equipment are stored following\nSOPs.\n2.5\nRoutine maintenance is carried out or arranged as per\nstandard operating procedures.\n3. Make up beds and\ncots\n3.1\nMattress is aired, freed from dust and vacuumed in\naccordance with SOPs.\n3.2\nSoiled linens and pillowcases are replaced in accordance with\nSOPs.\n3.3\nLinens are centered and mitered when replaced as per SOPs.\n3.4\nBeds and cots are made-up according to prescribed\nprocedure.\n\n--- PDF PAGE 23 ---\nTESDA-SOP-QSO-01-F08\nTR Domestic Work NC II (Amended)\nPromulgated February 2017\n20\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n4. Clean toilet and\nbathroom\n4.1\nCeilings and walls are cleaned in accordance with standard\noperating procedures and techniques.\n4.2\nWindow edges and sills are wiped clean in accordance with\nstandard operating procedures.\n4.3\nBath tub, lavatory and toilet bowls are scrubbed and\ndisinfected in accordance with standard operating procedures\nand techniques.\n4.4\nAccessories are washed and cleaned in accordance with\nstandard operating procedures and techniques.\n4.5\nBathroom supplies are replenished and defective\naccessories replaced as per SOPs.\n4.6\nEquipment is cleaned after use in accordance with\nmanufacturer’s instruction.\n4.7\nAll cleaning materials and equipment are stored in a safe\nplace as per SOPs.\n4.8\nRoutine maintenance is carried out or arranged as per\nstandard operating procedures.\n5. Sanitize rooms\n\n5.1\nSanitizing agents are 100% accurately measured and mixed\nin accordance with relevant safety regulations.\n5.2\nExcess mixtures of sanitizing agents are disposed according\nto environmental requirements.\n5.3\nRooms are sanitized in accordance with standard operating\nprocedures.\n5.4\nEquipment is cleaned after use in accordance with\nmanufacturer’s instructions.\n5.5\nAll cleaning materials and equipment are stored in a safe\nplace as per SOPs.\n5.6\nRoutine maintenance is carried out or arranged as per\nstandard operating procedures.\n6. Maintain clean room\nenvironment\n6.1\nAll equipment and cleaning paraphernalia are checked and\nmaintained according to manufacturer’s instructions.\n6.2\nAll wastes are removed and disposed of in accordance with\nemployer’s requirements.\n6.3\nAll movable furniture and fittings are shifted to allow access to\nhidden dust/waste/dirt and as per SOPs.\n6.4\nRooms are checked regularly for orderliness/tidiness in\naccordance with employer’s requirements.\n7. Clean kitchen\n7.1\nSoiled dishes, pots, pans and linen are washed in accordance\nwith standard operating procedures.\n7.2\nCleaned/dried dishes, pots and pans are stored as per\nstandard operating procedures.\n7.3\nKitchen appliances are cleaned in accordance with standard\noperating procedures.\n7.4\nKitchen fixtures, tables and chairs are wiped in accordance\nwith standard operating procedures.\n7.5\nFloor is mopped and dried in accordance with standard\noperating procedures.\n7.6\nKitchen supplies are inspected and replenished in\naccordance with standard operating procedures.\n\n--- PDF PAGE 24 ---\nTESDA-SOP-QSO-01-F08\nTR Domestic Work NC II (Amended)\nPromulgated February 2017\n21\nRANGE OF VARIABLES\n\nVARIABLES\nRANGE\n1. Cleaning equipment,\nsupplies and\nmaterials\n\nMay include:\n1.1\nBrooms\n1.2\nDust pan and brush\n1.3\nCleaning implements\n1.4\nVacuum cleaner\n1.5\nFloor carpet\n1.6\nWater hoses\n1.7\nBucket\n1.8\nBed\n1.9\nDining table\n1.10 Water pitcher\n1.11 Table cloth\n1.12 Flowers\n1.13 Bed cover\n1.14 Spoon\n1.15 Fork\n1.16 Knife\n1.17 Plate\n1.18 Wine glass\n1.19 Serving utensils\n1.20 Table napkin\n1.21 Paper towel\n1.22 Flower vase\n1.23 Drinking water\n1.24 Serving tray\n1.25 Soiled table\n1.26 Cleaning detergent\n1.27 Liquid detergent\n1.28 Cleaning solution\n1.29 Scrubbing foam\n1.30 Flat sheets\n1.31 Fitted sheet\n1.32 Pillow\n1.33 Pillow case\n1.34 Bed mattress\n1.35 Dish pan\n1.36 Dish sponge/dish cloth\n1.37 Pan with hot water\n1.38 Rolled newspaper\n1.39 Cleaning rag\n1.40 Wax paper/aluminum foil\n1.41 Talcum powder\n1.42 Bowl cleaner\n1.43 Toilet disinfectant\n1.44 Acid cleaner\n1.45 Cup\n1.46 Soup plate\n1.47 Soup bowl\n1.48 Drinking glass/goblet\n1.49\nServing dish\n\n--- PDF PAGE 25 ---\nTESDA-SOP-QSO-01-F08\nTR Domestic Work NC II (Amended)\nPromulgated February 2017\n22\nVARIABLES\nRANGE\n1.50 Rubber spatula\n1.51 Floor mop\n1.52 Toilet bowl swab\n1.53 Toilet caddy\n1.54 Spray bottle\n1.55 Guess model\n1.56 Antistatic duster/cleaning cloth\n1.57 Vacuum cleaner with circular brushes\n1.58 Sponges\n1.59 Scourer\n1.60 Glass cleaning equipment\n1.61 Drop sheets\n1.62 ‘A” frame ladders\n1.63 Cobwebber\n1.64 Lint free cleaning cloths\n1.65 Squeegees (various sizes)\n1.66 Extension poles\n1.67 Hoses\n\n2. Floor types/surface\ntextures\nMay include:\n2.1\nConcrete\n2.2\nTerrazo\n2.3 Vinyl\n2.4\nSlate\n2.5\nCeramic tile\n2.6 Wood\n2.7\nMarble\n2.8\nBrick\n2.9\nParquetry\n2.10 Rubber\n2.11 Polished wood\n\n3. Waste (wet or dry)\nMay include:\n3.1\nDust\n3.2\nPaper\n3.3 Food\n3.4\nStones\n3.5\nGravel\n\n4. Furnishings/fixtures\nMay include:\n4.1\nDesks\n4.2\nTables\n4.3\nChairs\n4.4\nComputers\n4.5\nFiling cabinets\n4.6\nClocks\n4.7\nStoves\n4.8\nLamps\n4.9\nRailing\n4.10 Window sills\n4.11 Skirting\n4.12 Doors\n4.13 Door handles\n\n--- PDF PAGE 26 ---\nTESDA-SOP-QSO-01-F08\nTR Domestic Work NC II (Amended)\nPromulgated February 2017\n23\nVARIABLES\nRANGE\n4.14 Light switches\n4.15 Telephone handsets\n4.16 Air conditioning vents\n4.17 Lights\n4.18 Ceiling fans\n4.19 Blinds\n4.20 Curtains\n4.21 Grilles\n4.22 Refrigerators\n4.23 Picture frames\n4.24 Shelves\n4.25 Compactus\n4.26 Work stations\n4.27 Showcases\n4.28 Bars\n4.29 Beds\n4.30 Bedside cupboards\n5. Ceiling fittings\nMay include:\n5.1\nRecessed lights\n5.2\nOrnamental hanging lights\n5.3\nProjected lights\n5.4\nCeiling fans\n5.5\nTelevisions\n5.6\nSpeakers\n5.7\nSmoke detectors\n5.8\nSprinkler systems\n5.9\nVents and grilles\n5.10 Skylights\n5.11 Cameras\n5.12 Chandelier\n6. Ceiling\nMay include:\n6.1\nFlat\n6.2\nSuspended\n6.3\nHard\n7. Bathroom supplies/\naccessories\nMay include:\n7.1\nLiquid and bar soap\n7.2\nToilet paper\n7.3\nBathroom deodorizer\n7.4\nCloth/paper towels\n7.5\nPersonal toiletries\n7.6\nBathroom slippers\n7.7\nFloor towel\n7.8\nTrash can\n8. Sanitizing agents\nMay include:\n8.1\nSolvent spray\n8.2\nAnti-static solution\n8.3\nAnti-static spray\n\n--- PDF PAGE 27 ---\nTESDA-SOP-QSO-01-F08\nTR Domestic Work NC II (Amended)\nPromulgated February 2017\n24\nVARIABLES\nRANGE\n9. Sanitizing equipment,\nsupplies and\nmaterials\nMay include:\n9.1\nLadders\n9.2\nVacuum unit\n9.3\nDust mop\n9.4\nLint free clothing cloths\n9.5\nMop head and bucket\n9.6\nDust pan\n9.7\nBroom\n10. Linen\nMay include:\n10.1 Napkins\n10.2 Tablecloths\n10.3 Serving cloths\n10.4 Tea towels\n10.5 Clothing\n10.6 Cleaning cloths\n11. Kitchen appliances\nMay include:\n11.1 Food processor\n11.2 Grill\n11.3 High pressure steamer\n11.4 Microwave oven\n11.5 Oven (electric/gas)\n11.6 Range\n11.7 Refrigerator\n11.8 Tilting skillet\n11.9 Toaster\n11.10 Electric knife\n11.11 Juice maker\n11.12 Rice cooker\n12. Kitchen supplies and\nmaterials\nMay include:\n12.1 All-purpose detergent\n12.2 All-purpose soap\n12.3 Coffee, tea, cream\n12.4 Condiments\n12.5 Disinfectants\n12.6 Drain solvent\n12.7 Food items (dairy, vegetable, bread, meat and fruits)\n12.8 Garbage bag\n12.9 Scouring pad\n12.10 Cooking oil\n12.11 Ingredients\n\n--- PDF PAGE 28 ---\nTESDA-SOP-QSO-01-F08\nTR Domestic Work NC II (Amended)\nPromulgated February 2017\n25\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nCleaned surfaces and floors\n1.2\nCleaned furnishings and fixtures\n1.3\nMade-up beds and cots\n1.4\nCleaned toilets and bathrooms\n1.5\nSanitized rooms\n1.6\nMaintained clean room environment\n1.7\nCleaned kitchen\n\n2. Required Knowledge\n\n2.1\nProcedures in Cleaning, Polishing, Disinfecting and Sanitizing\nRooms (Living Room, Dining Room, Bedrooms, Bathrooms,\nToilets and Kitchen)\n2.2\nTypes and Characteristics of Floors\n2.3\nMethod of Removing Suitable Dirt/Stain\n2.4\nTypes/Uses/Functions of Cleaning Equipment, Supplies and\nMaterials\n2.5\nGlass Types, including defects\n2.6\nMethods of Identifying Stains, Mud, Dirt and Grease\n2.7\nStain Removal Techniques\n2.8\nEffects of Pre-Existing Conditions on Safe Work Practices\n2.9\nProcedures in Arranging Furniture\n2.10 Types and Characteristics of Furniture and Furnishings\n2.11 Procedures in Bed Making\n2.12 Knowledge on Different Linen and Fabric\n2.13 Procedures in Cleaning and Maintaining Room Furniture and\nFurnishings\n2.14 Knowledge on Different Areas Where Dirt and Dust Can\nEasily Accumulate\n2.15 Schedule of House Chores\n2.16 Types of Ancillary Rooms\n2.17 Types of Home Set-Up\n2.18 Types of Living Room Appliances and Ornament\n3. Required Skills\n3.1\nCleaning and Maintaining rooms (living room, bedroom,\nbathroom, toilet and kitchen)\n3.2\nHandling and Disposing of Chemical\n3.3\nReporting and Recording Information\n3.4\nCommunicating with others\n3.5\nMinimizing Waste\n3.6\nDecanting Chemicals\n3.7\nArranging Furniture\n3.8\nMaking-up Beds\n3.9\nEquipment Operation and Cleaning\n3.10 Work Planning and Organization\n3.11 Waste Minimization\n3.12 Decanting Chemicals\n\n--- PDF PAGE 29 ---\nTESDA-SOP-QSO-01-F08\nTR Domestic Work NC II (Amended)\nPromulgated February 2017\n26\n4. Resource\nImplications\nThe following resources should be provided:\n4.1\nCopies of Relevant Standards, Training Books and\nAssessment Planning Guides\n4.2\nAccident Report Forms\n4.3\nJob Specifications and Reporting Forms\n4.4\nAccess to a Suitable Venue\n4.5\nManufacturer/Enterprise Product Specifications\n4.6\nA range of equipment, including personal protective\nequipment and relevant cleaning or spot removing chemicals\n4.7\nMaterial safety data sheets and equipment operating manuals,\nif relevant\n4.8\nAccess to a registered provider of assessment services\n4.9\nChemical Color Charts\n5. Methods of\nAssessment\nCompetency in this unit must be assessed through:\n5.1\nWritten Test/Examination\n5.2\nDemonstration with questionin