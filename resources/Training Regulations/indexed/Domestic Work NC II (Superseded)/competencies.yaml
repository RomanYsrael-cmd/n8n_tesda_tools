istressed animals are identified and \nbehavior and health status is reported to supervisor.\n\n--- PDF PAGE 62 ---\nTESDA-SOP-QSO-01-F08 \nTR Domestic Work NC II (Amended) \nPromulgated February 2017 \n59 \nRANGE OF VARIABLES \nVARIABLES \nRANGE \n1. Animal care \nworkplace tasks  \nMay include:\n1.1 \nAssisting in heath care of animals \n1.2 \nEnclosure and bed cleaning and bedding replacement \n1.3 \nEquipment and consumables stocktake and ordering \n1.4 \nExercising animals \n1.5 \nFeeding and watering animals \n1.6 \nFollowing environmentally sustainable work practices \n1.7 \nGrooming and animal cleaning \n1.8 \nInformation collection, record and resource update \n1.9 \nObserving animal behavior and reporting \n1.10 Taking messages and relaying information to appropriate \nperson \n1.11\nCleaning workplace and equipment.\n2. OHS risks when \nworking with animals \nMay include:\n2.1 \nAnimal bites, envenomation, kicks, scratches and crush \ninjuries \n2.2 \nBiological hazardous waste and sharps disposal \n2.3 \nHandling of chemicals and medicines \n2.4 \nGas leakage \n2.5 \nInhalation of aerosol particles \n2.6 \nIntraocular contamination \n2.7 \nManual handling, including carrying, lifting and shifting \n2.8 \nNeedle pricks and cuts from other sharps \n2.9 \nRelease of infective agents (animal and human) \n2.10 Slippery or uneven work surfaces \n2.11\nZoonoses.\n3. Daily workplace \ninformation and \ndocumentation  \nMay include:\n3.1 \nAccident and incident records \n3.2 \nAnimal feeding, health and treatment records \n3.3 \nAnimal identification and history \n3.4 \nOHS and emergency procedures and contact information \n3.5 \nEquipment inventory, damage and repairs registers \n3.6 \nProvisions records of current stock and items used and items \nrequired \n3.7\nStaff work roster.\n4. Characteristics of \nanimal behavior  \nMay include:\n4.1      Indicators of stress: \n4.1.1 \nAggressive behavior \n4.1.2 \nSubdued behavior \n4.1.3 \nTrembling \n4.1.4 \nVocalization \n4.2     Confidence and willingness to be approached gestures: \n4.2.1      Relaxed body tone and tail wagging \n4.2.2      Standing still or remaining sitting or laying down \nwhen approached \n4.3     Defensive gestures: \n4.3.1      Defending territory, other animals or food \n4.3.2      Growling, barking, hissing and spitting \n4.3.3      Hair on topline being raised \n4.3.4      Lunging forward \n4.3.5      Pecking \n4.3.6      Striking out with paws \n4.4  Submissive gestures: \n4.4.1      Lowering body \n4.4.2      Rolling onto back \n4.4.3      Tail between legs \n4.4.4     Turning away from handler.\n\n--- PDF PAGE 63 ---\nTESDA-SOP-QSO-01-F08 \nTR Domestic Work NC II (Amended) \nPromulgated February 2017 \n60 \nEVIDENCE GUIDE \n \n1. Critical aspects of \ncompetency \nAssessment requires that the candidate: \n1.1 \nConfirmed industry terminology used to describe daily work \nroutines and to report observations and activities to supervisor \n1.2 \nCleaned work areas and animal housing in accordance with \nOHS and organization policies and procedures \n1.3 \nAssisted in the preparation and distribution of food under \nsupervision \n1.4 \nRelated basic animal behavior to animal categories and report \nobservations of live animal behavior and health status to \nsupervisor. \nThe skills and knowledge required to assist in the care of animals \nmust be transferable to a range of work environments and contexts \nand include the ability to deal with unplanned events. \n2. Required knowledge \n2.1 \nAnimal temperaments and behaviors related to the associated \nhazards and risks to animals and staff during animal feeding \nand cleaning of housing \n2.2 \nBasic awareness of natural animal behavior relating to the \ncharacteristics of the species, age, health status and social \nneeds \n2.3 \nBasic nutritional requirements for animals, including water  \n2.4 \ncleaning techniques and related safety issues for general \nworkplace and animal housing \n2.5 \nPrinciples of animal welfare and ethics \n2.6 \nProcesses that support environment and resource efficiencies \n2.7 \nRelevant organizational policies and procedures, including \nOHS and emergency procedures, animal welfare and waste \ndisposal requirements \n2.8 \nSafe work practices \n2.9 \nStorage, preparation and presentation requirements for food \n2.10 Types of food and food supplements and their basic role in \nanimal diets \n2.11 Types of information that has to be reported and recorded in \nanimal care workplaces \n2.12 Workplace hygiene standards, disinfectants, cleaning agents, \ncleaning techniques and cleaning equipment and materials. \n3. Required skills \n3.1 \nEmploy safe and environmentally responsible organizational \nsystems and procedures when handling animals and feed \n3.2 \nDocument and report basic workplace information related to \nthe daily care of animals \n3.3 \nMaintain the highest standards of hygiene and infection \ncontrol at all times to reduce the risk of infection and cross-\ninfection \n3.4 \nParticipate in arrangements for maintaining the health and \nsafety of all people and animals in the workplace \n3.5 \nUndertake work with animals as directed under supervision \n3.6 \nUse equipment and materials correctly and in accordance with \nmanufacturers' specifications \n.\n\n--- PDF PAGE 64 ---\nTESDA-SOP-QSO-01-F08 \nTR Domestic Work NC II (Amended) \nPromulgated February 2017 \n61 \n \n3.7 \nNumeracy skills to estimate, calculate and record routine \nworkplace measures \n3.8 \nOral communication skills/language to fulfill the job role as \nspecified by the organization, including questioning, active \nlistening, asking for clarification and seeking advice from \nsupervisor \n3.9 \nInterpersonal skills to work with and relate to people from a \nrange of cultural, social and religious backgrounds \n3.10 Problem-solving skills to select required materials and \nequipment and prioritize tasks \n3.11 Use safe manual handling techniques and/or