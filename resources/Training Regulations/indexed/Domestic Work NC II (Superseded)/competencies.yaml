        "evidence_guide": {
          "source_text": "1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nDetermined requirements for weeding and cultivation activity\n1.2\nPrepared for weeding and cultivation operation\n1.3\nConducted weeding and removal of “volunteer” plant species\n1.4\nDetermined compacted soil\n1.5\nCultivated compacted soil\n1.6\nConducted post weeding and soil cultivation operations\n1.7\nUsed/operated tools and equipment properly\n1.8\nUsed prescribed protective/safety gadgets\n2. Required Knowledge\n\n2.1\nRecognition of the effects of weeds and undesirable\n“volunteer” species (invaders) on landscape plants\n2.2\nKnowledge in distinguishing weeds and undesirable\n“volunteer” species\n2.3\nUse of weed control and soil cultivation method\n2.4\nFunctions, uses and maintenance of tools and equipment\n2.5\nValues:\n2.5.1 Diligence\n2.5.2 Time consciousness\n2.5.3 Cost consciousness\n2.5.4 Hygiene consciousness\n2.5.5 Persistence\n2.5.6 Systematic and organized\n3. Required Skills\n3.1\nUse of appropriate tools and equipment and prescribed\nprotective/safety devices in weeding and soil cultivation\n3.2\nCommunication skills in receiving instructions and rendering\neven verbal reports about the completed task\n4. Resource\nImplications\nThe following resources should be provided:\n4.1\nLandscape area\n4.2\nNecessary tools and equipment\n4.3\nRelevant supplies and materials\n5. Methods of\nAssessment\nCompetency in this unit must be assessed through:\n5.1\nDirect Observation with Oral Questioning\n5.2\nInterview\n5.3\nPortfolio\n6. Context of\nAssessment\n6.1\nCompetency may be assessed individually in the actual\nworkplace or simulation environment in TESDA accredited\ninstitutions.\n\n--- PDF PAGE 77 ---\nTESDA-SOP-QSO-01-F08\nTR Domestic Work NC II (Amended)\nPromulgated February 2017\n74\nUNIIT OF COMPETENCY :\nWATER PLANTS\n\nUNIT CODE\n:"
        },
        "source_text": "AGR611377\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes required to\nconduct weeding operations and soil cultivation activities. This is\npurposely to minimize competition and to improve soil aeration and\nwater absorption/retention, respectively for better growth and\ndevelopment of the landscape plants.\n\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Determine\nrequirements for\nweeding and\ncultivation activity\n1.1\nWeed species and “volunteer” plants (“’invaders”) that are\nout-of-place and considered undesirable in the landscape are\nidentified based on specific landscape maintenance guidelines\nor as per instructions.\n1.2\nLandscape areas needing weeding and cultivation are\nidentified based on instructions or in accordance with LMS\n2. Prepare for weeding\nand cultivation\noperation\n\n2.1\nList of weeds and “volunteer plants” and the map of specific\nlandscape areas are prepared and secured\n2.2\nMethod and purpose of weeding are determined based on\nthe type of weed species and out-of-place “volunteer” species\n2.3\nTools, supplies and equipment needed are made ready and\navailable for use according to the types of weeds and\n“volunteer” species that needs removal\n2.4\nAppropriate safety protective devices are prepared for use\n3. Conduct weeding and\nremoval of\n“volunteer” species\n\n3.1\nWeeds and out-of-place “volunteer” plant species in the\nlandscape are removed and disposed in accordance with\nlandscape maintenance standard or as per instructions.\n3.2\nWeeds and out-of-place “volunteer” plant species are\nremoved using prescribed tools and equipment\n3.3\nTasks are done using appropriate safety/protective devices\n4. Determine\ncompacted soil\n4.1\nCompacted soil or soil that is having problem with aeration,\nwater infiltration and conditions for root development is\ndetermined as per established practice\n4.2\nEffects of compacted soil on root development and anchorage\nare recognized\n4.3\nMethod and purpose of soil cultivation are determined\nbased on the conditions of the soil\n5. Cultivate compacted\nsoil\n5.1\nCompacted soil is cultivated simultaneous with weeding\noperations in accordance with landscape maintenance\nstandards or as per instructions\n5.2\nSoil cultivation is done using appropriate tools and equipment\n5.3\nTask is performed using prescribed safety/protective devices\n6. Perform post-\nweeding and soil\ncultivation activities\n6.1\nTools and equipment are cleaned, maintained and stored as\nper instruction of in accordance with LMS\n6.2\nMaintenance of clean and safe area is undertaken\nthroughout and on completion of work\n6.3\nWork outputs are recorded or reported to concerned persons\nor authority according to industry practices\n\n--- PDF PAGE 75 ---\nTESDA-SOP-QSO-01-F08\nTR Domestic Work NC II (Amended)\nPromulgated February 2017\n72\nRANGE OF VARIABLES\nVARIABLES\nRANGE\n1. Weed species and\nvolunteer plants\n(invaders)\nMay include:\n1.1\nWeeds\n1.1.1 Grass\n1.1.2 Sedges\n1.1.3 Shrubs\n1.1.4 Vines\n1.2\nOut-of-place “volunteer” plant species are those that grow\nnaturally in the site and are competing with desirable plants,\nmaking the site ugly and/or are eye-sore in the landscape.\nVolunteer species can be landscape plants but is not included\nin the landscape design\n2. Landscape areas\nMay include:\n2.1\nLawn\n2.2\nFlower beds\n2.3\nHedges and shrubs landscape area\n2.4\nTree lawn or tree planting verges\n3. Methods of weed\ncontrol\nMay include:\n3.1\nManual weeding\n3.2\nMechanical weeding\n3.3\nChemical weeding\n4. Purpose of weeding\nMay include:\n4.1\nRelease the desirable landscape plants from competition of\nweeds and out-of-place “volunteer” species\n4.2\nImprove the health conditions of the landscape plants\n4.3\nLessen susceptibility of the landscape plants from pest and\ndisease attack\n5. Methods of soil\ncultivation\nMay include:\n5.1\nManual\n5.2\nMechanical\n6. Purpose of soil\ncultivation\nMay include:\n6.1\nImprove soil structure, porosity, aeration and water infiltration\n6.2\nImprove conditions for root system development and root\nanchorage\n6.3\nImprove water and nutrient absorption\n6.4\nEnhance soil macro and micro-organisms activity\n7. Supplies, tools and\nequipment for\nweeding operations\n\nMay include:\n7.1\nSmall bolo “dulos”\n7.2\nScythe (“Karit”)\n7.3\nSmall round/flat bar\n7.4\nSpade\n7.5\nTrowel\n7.6\nChemicals (Types: Selective herbicide; Wide spectrum)\n8. Tools and equipment\nfor soil cultivator\nMay in clued:\n8.1\nSmall bolo (“dulos”)\n8.2\nSmall round/flat bar\n8.3\nSpade\n8.4\nSoil cultivating machine\n9. Protective/safety\ndevices used in\nweeding and\ncultivation\nMay include:\n9.1\nGoggles\n9.2\nOveralls, gloves\n9.3\nReflectorized vest (depends on location of work)\n10.Maintenance of clean\nand safe area\nMay include:\n10.1 Keeping public access paths and roads clear of debris, waste,\ntools and equipment\n10.2 Disabling tools and equipment after use\n10.3 Using signage and barriers where necessary\n10.4 Removing debris and waste from the work area\n\n--- PDF PAGE 76 ---\nTESDA-SOP-QSO-01-F08\nTR Domestic Work NC II (Amended)\nPromulgated February 2017\n73\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nDetermined requirements for weeding and cultivation activity\n1.2\nPrepared for weeding and cultivation operation\n1.3\nConducted weeding and removal of “volunteer” plant species\n1.4\nDetermined compacted soil\n1.5\nCultivated compacted soil\n1.6\nConducted post weeding and soil cultivation operations\n1.7\nUsed/operated tools and equipment properly\n1.8\nUsed prescribed protective/safety gadgets\n2. Required Knowledge\n\n2.1\nRecognition of the effects of weeds and undesirable\n“volunteer” species (invaders) on landscape plants\n2.2\nKnowledge in distinguishing weeds and undesirable\n“volunteer” species\n2.3\nUse of weed control and soil cultivation method\n2.4\nFunctions, uses and maintenance of tools and equipment\n2.5\nValues:\n2.5.1 Diligence\n2.5.2 Time consciousness\n2.5.3 Cost consciousness\n2.5.4 Hygiene consciousness\n2.5.5 Persistence\n2.5.6 Systematic and organized\n3. Required Skills\n3.1\nUse of appropriate tools and equipment and prescribed\nprotective/safety devices in weeding and soil cultivation\n3.2\nCommunication skills in receiving instructions and rendering\neven verbal reports about the completed task\n4. Resource\nImplications\nThe following resources should be provided:\n4.1\nLandscape area\n4.2\nNecessary tools and equipment\n4.3\nRelevant supplies and materials\n5. Methods of\nAssessment\nCompetency in this unit must be assessed through:\n5.1\nDirect Observation with Oral Questioning\n5.2\nInterview\n5.3\nPortfolio\n6. Context of\nAssessment\n6.1\nCompetency may be assessed individually in the actual\nworkplace or simulation environment in TESDA accredited\ninstitutions.\n\n--- PDF PAGE 77 ---\nTESDA-SOP-QSO-01-F08\nTR Domestic Work NC II (Amended)\nPromulgated February 2017\n74\nUNIIT OF COMPETENCY :\nWATER PLANTS\n\nUNIT CODE\n:"
