        "source_text": "--- PDF PAGE 77 ---\nTESDA-SOP-QSO-01-F08 \nTR Domestic Work NC II (Amended) \nPromulgated February 2017 \n74 \nUNIIT OF COMPETENCY : \nWATER PLANTS \n \nUNIT CODE \n: \nAGR611379 \n \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge, skills and attitudes required to \nmaintain the health and vigor of the landscape plants through proper \nwatering/irrigation. \n \nELEMENTS \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1. Determine \nrequirements of \nwatering/irrigating \nlandscape plants \n \n1.1 \nImportance of water to growth and development of landscape \nplants and the effects of water stress (less or excess water) to \nplants are recognized as per established practice. \n1.2 \nLandscape plants suffering from less or excessive watering \nare determined using some visually observable plant and \nsoil conditions and/or guidelines. \n2. Prepare for \nwatering/irrigation \nactivity \n2.1 \nAmount and frequency of watering/irrigation of plants are \ndetermined in accordance with LMS or as per instructions. \n2.2 \nTools, supplies and equipment needed are prepared based \non the method of watering and/or irrigation to be used. \n2.3 \nPrescribed protective/safety devices are made ready and \navailable for use. \n3. Conduct \nwatering/irrigation of \nplant  \n3.1 \nWatering or irrigating of plants is done in accordance with the \nbasic principles or standard practice or as per instructions. \n3.2 \nWatering/irrigation is performed using the irrigation tools and \nequipment appropriate to the methods selected. \n3.3 \nTask is performed using the prescribed protective/safety \ngadgets. \n4. Perform post-\nwatering/irrigation \nactivities \n4.1 \nTools and equipment are cleaned, maintained and stored as \nper instruction of in accordance with LMS. \n4.2 \nMaintenance of clean and safe area is undertaken \nthroughout and upon completion of work. \n4.3 \nWork outputs are recorded or reported to concerned persons \nor authority according to industry practices.\n\n--- PDF PAGE 78 ---\nTESDA-SOP-QSO-01-F08 \nTR Domestic Work NC II (Amended) \nPromulgated February 2017 \n75 \nRANGE OF VARIABLES \n \nVARIABLES \nRANGE \n1.  Importance of water \nto plants \nMay include: \n1.1 \nMaintains of vital physiological processes in plants  \n1.2 \nPrimary raw material for photosynthesis or food  manufacture \n1.3 \nMaintains of turgidity of the cells  \n1.4 \nHelps in the translocation of nutrients, food and other \nassimilates  \n1.5 \nMaintains the health conditions of the plant   \n2.  Plant conditions\nMay include:\nVisually observable conditions of plants suffering from water stress \n2.1 \nWilting and die back \n2.2 \nChange in color and appearance of the leaves \n2.3 \nPremature falling of leaves/defoliation \n3.  Soil conditions\nMay include:\nVisually observable conditions of soil suffering from water stress \n3.1 \nWhen dry \n3.1.1 \nToo dusty \n3.1.2 \nCracks on soil  \n3.2 \nWhen waterlogged or over-watered \n3.2.1 \nToo wet  \n3.2.2 \nMuddy   \n4.  Amount and \nfrequency of watering\nMay include:\nDetermining when and how much to irrigate may include: \n4.1 \nObservation of the conditions of the plant \n4.2 \nObservation of the conditions of the soil \n4.3 \nUse of moisture meter \n5.  Methods of \nwatering/irrigation \n \nMay include:\nThe methods of watering depends on the kind of landscape \nplants/landscape areas and available facilities: \n5.1 \nOverhead irrigation: overhead sprinkler, pop-up etc.  \n5.2 \nDrip irrigation \n5.3 \nFurrow irrigation \n5.4 \nBasin irrigation \n6.  Tools and equipment\n \nMay include:\nDepending on the method, the following may be needed:  \n6.1 \nWater hose with  and without sprinklers \n6.2 \nWater truck \n6.3 \nIrrigation system installed \n6.4 \nPlumbing tools \n7.  Protective/safety \ndevices \n7.1\nOveralls\n7.2 \nGloves \n7.3 \nHat/hard hat \n7.4 \nRain boots \n7.5 \nReflectorized vest (depends on the location of work)   \n8.  Maintenance of clean \nand safe area \nMay include:\n8.1 \nKeeping public access paths and roads clear of debris, waste, \ntools and equipment \n8.2 \nDisabling tools and equipment after use \n8.3 \nUsing signage and barriers where necessary \n8.4 \nRemoving debris and waste from the work area\n\n--- PDF PAGE 79 ---\nTESDA-SOP-QSO-01-F08 \nTR Domestic Work NC II (Amended) \nPromulgated February 2017 \n76 \nEVIDENCE GUIDE  \n \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 \nDetermined requirements of watering/irrigating plants \n1.2 \nRecognized importance of water to plants and the consequent \neffects of less or over-watering \n1.3 \nDistinguished plants needing watering and plants in excess of \nwatering or suffering from waterlogged conditions \n1.4 \nPrepared for watering/irrigation activity as per instructions  \n1.5 \nConducted watering/irrigation using the prescribed tools, \nsupplies and equipment and in accordance with standard \npractice \n1.6 \nPerformed post-watering/irrigation activity \n2. Required Knowledge  \n \n2.1 \nProcedures and techniques in watering/irrigation \n2.2 \nFunctions, uses and maintenance of tools and equipment for \nefficient watering/irrigation \n2.3 \nValues: \n2.3.1 \nDiligence  \n2.3.2 \nTime consciousness \n2.3.3 \nCost consciousness \n2.3.4 \nHygiene consciousness \n2.3.5 \nPersistence \n2.3.6 \nSystematic and organized \n3. Required Skills \n3.1 \nUse of appropriate tools and equipment and prescribed \nprotective/safety devices in watering/irrigation \n3.2 \nCommunication skills in receiving instructions and rendering \neven verbal reports about the completed task \n4. Resource \nImplications \nThe following resources should be provided: \n4.1 \nLandscape area/landscape plants \n4.2 \nTools and equipment \n4.3 \nProtective/safety gadgets \n5. Methods of \nAssessment \nCompetency in this unit must be assessed through: \n5.1 \nDirect Observation with Oral Questioning \n5.2 \nInterview \n5.3 \nPortfolio \n6. Context of \nAssessment \n6.1 \nCompetency may be assessed individually in the actual \nworkplace or simulation environment in TESDA accredited \ninstitutions.\n",
