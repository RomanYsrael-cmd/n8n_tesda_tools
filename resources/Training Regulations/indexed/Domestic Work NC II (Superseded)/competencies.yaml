          "source_text": "1. Determine \nrequirements of \npreventing and \ncontrolling plant pests \nand diseases \n1.1\nInfested and diseased landscape plants are determined \nbased on plant conditions, symptoms and signs and other \nmanifestation of infestation and infection. \n1.2 \nPests and diseases are identified and classified using \ngeneral classification guidelines.  \n1.3 \nLife cycle or various life stages of pests from eggs, larvae, \npupa and adult and their mode of attack or infestation are \nknown. \n1.4 \nLife cycle or various life stages and signs and symptoms of \nplant diseases and their mode of attack are known. \n1.5 \nAccess to the site is determined in consultation with \nconcerned persons or authority. \n1.6 \nOccupational Health and Safety (OHS) hazards are identified, \nrisks assessed and reported to concerned persons or \nauthority. \n2. Prepare for \napplication of pests \nand disease \nprevention and \ncontrol measures \n \n2.1\nMethod of prevention and control is determined based on \ntypes of pests and diseases, their mode of attack and extent \nof infestation and infection. \n2.2 \nTools, equipment, supplies and materials relevant to the \nmethod of prevention and control are prepared. \n2.3 \nPrescribed safety and personal protective equipment \n(PPE) is selected in accordance with work requirements. \n3. Apply pest and \ndisease prevention \nand control measures\n3.1\nManual and biological method of prevention and control of \npest and disease are applied whenever applicable. \n3.2 \nIn case of using chemical and bio-pesticides, the frequency \nand dosage of application is determined based on types of \npests and diseases and extent of attack and in accordance \nwith LMS or manufacturer’s recommendation. \n3.3 \nPest and disease prevention and control measures are \napplied in accordance with to OHS requirements and Fertilizer \nand Pesticide Authority (FPA) guidelines. \n3.4 \nTask is performed using prescribed tools, supplies and \nappropriate protective/safety devices. \n4. Perform post-\nprevention and \ncontrol measures  \n4.1\nTools and equipment are cleaned, maintained and stored \naccording to LMS. \n4.2 \nMaintenance of clean and safe area is undertaken \nthroughout and on completion of work. \n4.3 \nWork outputs are recorded and reported to concerned \npersons or authority according to industry practices.\n\n--- PDF PAGE 81 ---\nTESDA-SOP-QSO-01-F08 \nTR Domestic Work NC II (Amended) \nPromulgated February 2017 \n78 \nRANGE OF VARIABLES \n \nVARIABLES \nRANGE \n1. Landscape plants  \n \nMay include:\n1.1 \nShrubs and hedges \n1.2 \nVines \n1.3 \nPalms \n1.4 \nBamboos \n1.5\nTrees\n2. Plant conditions\nMay include:\n2.1 \nAge/Stage of growth  \n2.2 \nHealthy and vigorous \n2.3 \nDiseased/infected:  \n2.4\nInfested\n3. Symptoms, signs  and \nother manifestations \ndiseases \nMay include:\n3.1 \nDiseases \n3.2 \nLeaf spots \n3.3 \nAnthracnose \n3.4 \nFruiting bodies \n3.5 \nPresence of hyphae \n3.6 \nPests \n3.6.1 \nGall on leaves, stems, branches \n3.6.2 \nSkeletonized, browsed/chewed leaves \n3.6.3\nWithering, die back etc\n4. Pests and diseases\nMay include:\n4.1 \nPests \n4.1.1 \nInsect pests: Chewing, Sucking, Girdling/Boring, etc. \n4.1.2 \nTermites \n4.1.3 \nNematodes \n4.2 \nDiseases \n4.2.1 \nParasitic fungus \n4.2.2 \nBacteria \n4.2.3\nViruses\n5. Methods of prevention \nand control \n \nMay include:\n5.1 \nPrevention \n5.1.1 \nSpecies/individual (genetically superior) selection \n5.1.2 \nPest and disease free \n5.1.3 \nCultural management \n5.1.4 \nSanitation \n5.2 \nControl  \n5.3 \nManual/mechanical \n5.4 \nChemical (systemic, broad spectrum, contact)  \n5.5 \nBiological- (insects, microorganisms) \n5.6\nBio-pesticides\n6. Tools, supplies and \nequipment \nMay include:\n6.1 \nBackpack sprayer \n6.2 \nBoom sprayer \n6.3 \nSoil drencher \n6.4 \nPruning shears,  \n6.5\nPruning saws\n7. Protective/safety \ngadgets  \nMay include:\n7.1 \nOveralls, gloves \n7.2 \nGas mask \n7.3 \nGoggles \n7.4\nReflectorized vest ( depends on location of work)\n8. Maintenance of clean \nand safe area \nMay include:\n8.1 \nKeeping public access paths and roads clear of debris, waste, \ntools and equipment \n8.2 \nDisabling tools and equipment after use \n8.3 \nUsing signage and barriers where necessary \n8.4\nRemoving debris and waste from the work area\n\n--- PDF PAGE 82 ---\nTESDA-SOP-QSO-01-F08 \nTR Domestic Work NC II (Amended) \nPromulgated February 2017 \n79"
