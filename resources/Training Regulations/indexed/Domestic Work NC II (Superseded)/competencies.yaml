tandardized.\n3.2\nPresentation of cooked dishes are developed and corrected in\naccordance with SOPs.\n3.3\nFood quality is maintained and checked as per SOPs.\n3.4\nTime and temperature condition of foods is ensured before\nserving based on freezing temperature.\n4. Prepare sauces,\ndressings and\ngarnishes\n4.1\nMaterials, equipment/utensils are prepared prior to\npreparation of sauces, dressings and garnishes as per SOPs.\n4.2\nSauces, garnishes, hot and cold dressing is prepared as per\nSOPs.\n5. Prepare appetizers\n5.1\nD’oeuvres is prepared according to requirement and\npreference of client.\n5.2\nCanape’s are prepared according to requirement for\npreference of client.\n5.3\nFinger foods are prepared according to requirement or\npreference of client.\n\n--- PDF PAGE 34 ---\nTESDA-SOP-QSO-01-F08\nTR Domestic Work NC II (Amended)\nPromulgated February 2017\n31\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n6. Prepare desserts and\nsalads\n6.1\nMaterials, equipment/utensils used for cooking are prepared\nas per SOPs.\n6.2\nSherbets, ices and ice cream are prepared in accordance with\nprescribed procedures.\n6.3\nFruit desserts are prepared as per prescribed procedures.\n6.4\nPastry desserts are prepared as per prescribed procedures.\n6.5\nMousse is prepared as per prescribed procedures.\n6.6\nCold salads and molded salads are prepared as per\nprescribed procedures.\n7. Prepare sandwiches\n7.1\nHot sandwiches are prepared as per SOPs.\n7.2\nCold dressings are prepared as per SOPs.\n7.3\nHot sauces are prepared as per SOPs.\n7.4\nCold sauces are prepared as per SOPs.\n\n8. Store excess foods\nand ingredients\n8.1\nUnconsumed cooked food is stored according to procedures.\n8.2\nExcess ingredients are stored according to client’s\nrequirement.\n8.3\nProper method of refrigeration is implemented as per SOPs.\n8.4\nProper storing of dry and wet food/ingredients is implemented\nin accordance with SOPs.\n\n9. Convert unconsumed\ncooked food\n9.1\nUnconsumed cooked food is converted/transformed into new\ndishes as per SOPs.\n9.2\nUnconsumed cooked food is stored/frozen at a temperature of\nzero degrees and in accordance with SOPs.\n9.3\nPacked/wrapped uncooked foods are frozen at zero degrees\nF temperature and in accordance with SOPs.\n9.4\nPacked/wrapped food for storage is prepared as per SOPs.\n9.5\nUncooked food is maintained at proper temperature and as\nper SOPs.\n\n--- PDF PAGE 35 ---\nTESDA-SOP-QSO-01-F08\nTR Domestic Work NC II (Amended)\nPromulgated February 2017\n32\nRANGE OF VARIABLES\n\nVARIABLES\nRANGE\n1. Ingredients\n\nMay include:\n1.1\nMeat\n1.2\nVegetable\n1.3\nSeafood\n1.4\nPoultry and Game\n1.5\nStock\n1.6\nCold Food\n1.7\nCondiments\n1.8\nMilk\n1.9\nDairies\n1.10 Cereals\n1.11 Flour\n1.12 Butter Sauces\n1.13 Fruits\n\n2. Mis en Place\n\nMay include:\n2.1\nIngredients\n2.2\nPans\n2.3\nUtensils\n2.4\nPlates/Serving Pieces\n\n3. Thawing\n\nMay include:\n3.1\nSoaking\n3.2\nUnfreezing\n\n4. Vegetable Ingredient\nPreparation\nMay include:\n4.1\nSkin, Peel, Pare\n4.2\nChop, Slice, Shred, Cube\n4.3\nWedge, Grate, Pure\n4.4\nCore, Quarter\n\n5. Vegetable Manner of\nPreparation\n\nMay include:\n5.1\nBoiling, Blanching\n5.2\nSauteing\n5.3\nBraising\n5.4\nGratinating\n5.5\nRoasting/Baking\n\n6. Seafood Ingredient\n Preparation\nMay include:\n6.1\nChop, Slice\n6.2\nFillet\n6.3\nMince, Shred\n6.4\nPeel, Dice, Blanch\n6.5\nMarinate, Poach\n\n7. Seafood Dishes\nPreparation\n\nMay include:\n7.1\nBoiling, Steaming\n7.2\nSauteing\n7.3\nDeep Frying, Pan Frying\n7.4\nPoaching\n7.5\nGrilling\n7.6\nBaking\n\n8. Soup Preparation\n\nMay include:\n8.1\nSauteing\n8.2\nSimmering\n\n--- PDF PAGE 36 ---\nTESDA-SOP-QSO-01-F08\nTR Domestic Work NC II (Amended)\nPromulgated February 2017\n33\nVARIABLES\nRANGE\n9. Meat Ingredient\nPreparation\nMay include:\n9.1\nSlice, Chop\n9.2\nDebone\n9.3\nDice, Mince\n9.4\nMarinate\n10. Meat Dishes\nPreparation\n\nMay include:\n10.1 Boiling, Steaming, Simmering, Stewing\n10.2 Frying (deep, pan, stir)\n10.3 Sauteing\n10.4 Roasting, Baking, Browning\n10.5 Pressurize Cooking\n10.6 Poaching, Blanching, Braising\n10.7 Broiling, Grilling\n11. Poultry Ingredient\nPreparation\nMay include:\n11.1 Deboned\n11.2 Chop, Slice\n11.3 Dice, Shred, Cube\n11.4 Mince, Skin\n11.5 Marinate\n12. Poultry Dishes\nPreparation\nMay include:\n12.1 Boiling, Simmering, Stewing\n12.2 Frying (deep, pan, stir)\n12.3 Sauteing\n12.4 Braising, Grilling, Roasting\n12.5 Barbecuing, Baking\n13. Egg Dishes\nPreparation\nMay include:\n13.1 Boiling\n13.2 Frying\n13.3 Poaching\n13.4 Basting\n13.5\nBaking\n14. Pasta Grain and\nFarinaceous Dishes\nPreparation\nMay include:\n14.1 Boiling\n14.2 Steaming\n14.3 Poaching\n14.4 Sauteing\n14.5 Gratinating\n14.6 Baking\n15. Hors D’oeuvres\nPreparation\nMay include:\n15.1 Peel, Pare, Slice, Shred, Cubes\n15.2 Blanch, Boiled, Steam\n15.3 Marinate, Seasoned\n16. Sauces\nMay include:\n16.1 Sugar Syrups\n16.2 Fruit Syrups\n16.3 Fruit Purees, Sauces and Coulis\n16.4 Chocolate-Based Sauces\n16.5 Custard and Cremes\n16.6 Flavoured Butters and Creams\n\n--- PDF PAGE 37 ---\nTESDA-SOP-QSO-01-F08\nTR Domestic Work NC II (Amended)\nPromulgated February 2017\n34\nEVIDENCE GUIDE\n1. Critical aspects of\ncompetency\n\nAssessment requires evidence that the candidate\n1.1\nPrepared ingredients according to recipes\n1.2\nCooked meals and dishes according to recipes\n1.3\nPresented cooked dishes\n1.4\nPrepared appetizers\n1.5\nPrepared sauces, dressings and garnishes\n1.6\nPrepared desserts and salads\n1.7\nPrepared sandwiches\n1.8\nStored excess foods and ingredients\n1.9\nConverted unconsumed cooked and uncooked food\n2. Required Knowledge\n2.1\nFood Theory\n2.2\nMaterials Specifications and Uses\n2.3\nTools and Equipment: Uses and Specifications\n2.4 Codes and Regulations\n2.4.1 Pertinent food and drink sanitation laws, rules and\nregulations\n2.5\nMaintenance Operation\n2.6\nBalance Diet\n2.7\nNutrition\n2.8\nFood Serving\n2.9\nSafe Work Practices and First Aid Regulations\n2.10 Personal Hygiene\n2.11 Providing Safe Food\n2.12 Food and Safety Hazard\n2.13 Safe Food Handling\n2.14 Food Costing and Portioning\n2.15 Food Storage\n2.16 Method of Preparing Salad\n2.17 Handling of Kitchen Equipment\n3. Required Skills\n3.1\nCooking Method\n3.2\nHandling of Kitchen Equipment\n3.3\nProper Storing\n3.4\nFood Costing and Portioning\n4. Resource\nImplications\n\nThe following resources should be provided:\n4.1\nFacilities, equipment, supplies and materials relevant to the\nunit of competency\n5. Methods of\nAssessment\nCompetency in this unit must be assessed through:\n5.1\nWritten Test/Examination\n5.2\nDemonstration with questioning\n5.3\nObservation with questioning\n5.4\nOral Questioning/Interview\n5.5\nPortfolio Assessment\n6. Context of\nAssessment\n6.1\nCompetency may be assessed in the workplace or in a\nsimulated work setting.\n\n--- PDF PAGE 38 ---\nTESDA-SOP-QSO-01-F08\nTR Domestic Work NC II (Amended)\nPromulgated February 2017\n35\nUNIT OF COMPETENCY :\nPROVIDE FOOD AND BEVERAGE SERVICE\n\nUNIT CODE\n:\nHCS913304\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes in food and\nbeverage service. It includes preparing dining area, setting up table,\nserving food and beverage and clearing table.\n\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Prepare dining area\n\n1.1\nDining area is checked for cleanliness prior to service in\naccordance with standard operating procedures and when\nrequired, take corrective actions.\n1.2\nDining environment is prepared and adjusted to ensure\ncomfort and ambience of client and as appropriate.\n1.3\nFurniture is set up in accordance with standard operating\nprocedures.\n1.4\nTables and table settings are checked for stability, and easy\naccess to client and at all times.\n1.5\nEquipment are checked and prepared for service and as per\nSOPs.\n2. Set-up Table\n\n2.1\nTable cloth is laid without creases and in accordance with\nprescribed procedures.\n2.2\nTable appointment is laid according to standards.\n2.3\nNapkin folded in accordance to table napkin folding standards.\n2.4\nCenterpiece is arranged in accordance with standard\noperating procedures and used appropriate equipment,\nsupplies and materials.\n3. Serve food and\nbeverage\n3.1\nFoods are checked for completeness and correctness before\nserving.\n3.2\nFoods are placed on the tray and carried using the left hand\nand in accordance with food and beverage serving\nprocedures.\n3.3\nFoods are served from the left side using the left hand in\nserving as per SOPs.\n3.4\nWater goblets are filled/refilled from the right side without\nspilling as per SOPs.\n3.5\nBeverage are taken from the bar/kitchen and inspected for\ncomplete garnishing (if any).\n3.6\nBeverage are served on a bar tray from the right side of the\nclient being served as per SOPs.\n4. Clear table\n\n4.1\nClients are asked politely if they are finished as per SOPs.\n4.2\nSoiled plates/flat wares are bussed out from the right side of\nthe family members and brought to the washing station/area\nas per SOPs.\n4.3\nTable is crumbed as per standard operating procedure.\n4.4\nSide plates and knives are removed from the table as per\nSOPs.\n4.5\nCondiments/shakers and other soiled items are removed from\nthe table as per SOPs.\n4.6\nAshtrays are replaced as per SOPs.\n4.7\nAdditional requests are asked politely from clients as per\nSOPs.\n4.8\nClients’ needs are checked form time to time until they move\nout from the dining area as per SOPs.\n\n--- PDF PAGE 39 ---\nTESDA-SOP-QSO-01-F08\nTR Domestic Work NC II (Amended)\nPromulgated February 2017\n36\nRANGE OF VARIABLES\n\nVARIABLES\nRANGE\n1. Dining environment\nMay include:\n1.1\nLighting\n1.2\nRoom Temperature\n1.3\nMusic\n1.4\nFloral and Other Decorations\n1.5\nPrivacy\n1.6\nBackground\n2. Equipment\nMay include:\n2.1\nTable Cloth/Linen\n2.2\nChina Wares\n2.3\nGlassware\n2.4\nSilverware\n2.