s, specifications and maintenance of bathing\nparaphernalia\n2.2\nProcedures of bathing and dressing the elderly\n2.3\nProper care of elders\n2.4\nPrinciples and procedures in taking vital signs\n2.5\nCommon signs and symptoms of common illnesses\n2.6\nPrinciples and procedures of medicine administration\n2.7\nRelevant plan of care, roles and responsibilities of caregiver\n4.1\nRelevant policies, protocols and practices of the certain\norganizations in relation to services to the elderly\n2.9\nProcess of ageing\n2.10 Different religious, cultural, spiritual, physical and ceremonial\nperspectives\n2.11 Causes, implications and treatment of dementia and other\nelderly related conditions\n2.12 Depending on the work, roles or services provided, specific\nknowledge of particular groups or issues may be required like:\n2.12.1 Alcohol and other drugs\n2.12.2 Cultural and linguistics diversity\n2.12.3 Risk of self harm\n2.12.4 Women\n2.12.5 Men\n2.12.6 Community education\n2.12.7 Mental health\n2.13 Common problems of the elderly and their ramifications\n2.14 Different cultural requirements and preferences\n2.15 Factors giving rise to grief and loss in the elderly\n2.16 Safety risks to the elderly\n2.17 Major systems of the body\n\n--- PDF PAGE 54 ---\nTESDA-SOP-QSO-01-F08\nTR Domestic Work NC II (Amended)\nPromulgated February 2017\n51\n3. Required Skills\n3.1\nAbility to establish and maintain a relationship that takes into\naccount the elderly’s individual differences (e.g. age, abilities,\ndisabilities, cultural background)\n3.2\nOral communication skills (language skills) and non-verbal\ncommunication skills (e.g. touch, smiling, etc.) necessary to\ndevelop a trusting relationship with an elderly. Language skills\nmay be English, mother language or technical language\n(medical terms) as required by employment service or\norganization\n3.3\nOral communication skills (language competence) required to\nfulfill job roles as specified by the employment\norganization/service. Oral communication skills include asking\nquestions, clarifying understanding of the elderly’s\npreferences and expressing encouragement in oral\ncommunication. Service/organization may require competence\nin English or native language, as required by the elderly.\n3.4\nReading and writing skill (literacy competence) required to\nfulfill job roles as specified by employment\norganization/service. The level of skills may range from the\nability to write short messages or a shopping list, to assist the\nelderly with banking, reading of mail, answering the phone,\nreceiving messages etc. the employment service/organization\nmay require competence in a language other than English,\ndepending on job request\n3.5\nBasic counseling\n4. Resource\nImplications\nThe following resources should be provided\n4.1\nA childcare workplace\n4.2\nFacilities, equipment, supplies and materials relevant to the\nunit of competency\n5. Methods of\nAssessment\nCompetency in this unit must be assessed through:\n5.1\nDemonstration with questioning\n5.2\nInterview\n6. Context of\nAssessment\n6.1\nCompetency may be assessed in the workplace or in a\nsimulated work setting.\n\n--- PDF PAGE 55 ---\nTESDA-SOP-QSO-01-F08\nTR Domestic Work NC II (Amended)\nPromulgated February 2017\n52\nUNIT OF COMPETENCY :\nPROVIDE CARE AND SUPPORT TO PEOPLE WITH SPECIAL\nNEEDS\n\nUNIT CODE\n:\nHCS323306\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes required in\nproviding support and assistance to maintain quality care for people\nwith special needs to be able to enhance their abilities to\ncommunicate and be independent; responding to the physical,\nmedical, health and safety, personal care and home maintenance\nrequirements of people with disabilities.\n\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Establish and\nmaintain appropriate\nrelationship with\npeople with special\nneeds\n1.1\nAll dealings with people with special needs are aimed at\ngenerating a trusting relationship which includes protecting\nconfidentiality, privacy, individual choices and the right to\ndecision making.\n1.2\nRespect for individual differences is demonstrated in all\ndealings with people with special needs.\n1.3\nSupport for the interests, rights and decision making of people\nwith special needs is demonstrated in all dealings.\n1.4\nPeople with special needs are actively encouraged and\nsupported to communicate ideas, feelings and preferences.\n2. Provide appropriate\nsupport to people\nwith special needs\n2.1\nAll support to people with special needs is provided in\naccordance with their needs, rights and self determination.\n2.2\nAssistance is provided to people with disabilities according to\nthe employment organization guidelines.\n2.3\nInformation required by people with special needs are\nidentified and provided.\n2.4\nReactions and limitations regarding differences are\nrecognized and appropriate assistance is sought to ensure\nthat the rights of people with special needs are upheld.\n3. Assist in maintaining\nwell being of people\nwith special needs.\n3.1\nPeople with special needs are provided with support in\nmaintaining a clean, safe and comfortable environment.\n3.2\nSituations of risk to health and safety are responded to in\naccordance with established and approved health and\nsafety procedures.\n3.3\nPeople with special needs are actively encouraged to practice\nself expression.\n3.4\nRights and responsibilities of people with special needs are\ndiscussed with them professionally and in a non-threatening\nand non-critical ways.\n3.5\nStrategies are developed for people with special needs to\nassert self terms of accomplishments and achievements.\n\n--- PDF PAGE 56 ---\nTESDA-SOP-QSO-01-F08\nTR Domestic Work NC II (Amended)\nPromulgated February 2017\n53\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n4. Assist people with\nspecial needs to\nidentify and meet\ntheir needs\n4.1\nThe dignity, privacy and personal choice of people with\nspecial needs in relation to needs are upheld.\n4.2\nPeople with special needs are assisted to identify, select and\nprioritize their specified nursing needs.\n4.3\nPeople with special needs are assisted to identify, select,\nprioritize and fulfill or implement their social, physical,\nintellectual, creative and emotional activities.\n4.4\nPeople with special needs are assisted to select and develop\nstrategies to meet their requirements in order to achieve their\nnursing needs.\n5. Assist people with\nspecial needs in\nmaintaining an\nenvironment that\nenables maximum\nindependent living\n5.1\nThe types, frequency and triggers of challenging behaviors of\na person with special needs are identified, assessed and\nresearched.\n5.2\nStrategies for the prevention and management of\nchallenging behavior/s are planned and implemented\naccording to approved safety procedures.\n5.3\nPeople with special needs are encouraged and supported to\nexpress self.\n5.4\nIndependent thinking (such as decision, opinion and\npreferences) by people with special needs are encouraged\nand supported.\n5.5\nStrategies that would promote independence of people with\nspecial needs are developed and implemented.\n\n--- PDF PAGE 57 ---\nTESDA-SOP-QSO-01-F08\nTR Domestic Work NC II (Amended)\nPromulgated February 2017\n54\nRANGE OF VARIABLES\nVARIABLES\nRANGE\n1. Tools and equipment\nMay include:\n1.1\nBed with side rails\n1.2\nNight Light\n1.3\nHandrails\n1.4\nAssistive device (wheelchair, cane, walker and crutches\n1.5\nCommode\n1.6\nFeeding Utensils\n1.7\nClock\n1.8\nReading Materials\n1.9\nActivity Kit\n2. Individual differences\nMay include:\n2.1\nDaily living such as:\n2.1.1\nCulture\n2.1.2\nAge\n2.1.3\nEconomic\n2.1.4\nSocial\n2.1.5\nGender\n2.1.6\nPhysical\n2.1.7\nEmotional\n2.1.8\nIntellectual\n2.1.9\nLanguage\n2.2\nRights may be detailed in:\n2.2.1 Service/outcomes standards\n2.2.2 Legislation\n2.2.3 Organizational policies and practice\n2.3\nSupport will be in the Context for services offered including:\n2.3.1 Personal support\n2.3.2 Employment support\n2.3.3 Community access\n2.3.4 Accommodation support\n2.3.5\nLifestyle support\n3. Assistance\nMay include:\n3.1\nProviding information\n3.2\nAssistance with mobility or providing specific support such as\ntransport\n3.3\nEncouragement and support for decisions and and actions\n3.4\nGeneral household assistance and maintenance\n4. Differences\nMay include:\n4.1\nIndividual (age, gender, ability, history, personal preferences)\n4.2\nCultural\n4.3\nSpiritual\n4.4\nSexual preference\n5. Rights\nMay include:\n5.1\nChoose for oneself\n5.2\nHave meaningful work\n5.3\nPrivacy\n5.4\nDignity\n5.5\nConfidentiality\n5.6\nSelf determination\n5.7\nAppropriate support\n5.8\nSkill development\n5.9\nAdvocacy\n5.10\nBeing treated as a valued individual\n5.11\nFair treatment\n5.12\nRight to enter into a relationship\n5.13\nRight to express sexuality\n6. Responsibilities\n\nMay include:\n6.1\nAct within the law\n6.2\nTreat others with consideration and respect\n6.3\nAbide by family obligations\n6.4\nAbide by the policies and procedures of the services being used\n\n--- PDF PAGE 58 ---\nTESDA-SOP-QSO-01-F08\nTR Domestic Work NC II (Amended)\nPromulgated February 2017\n55\nVARIABLES\nRANGE\n7. Personal needs may\ninclude providing\nassistance with\nMay include:\n7.1\nDaily living including:\n7.1.1 Maintaining personal safety\n7.1.2 Communication (speech, writing, non-verbal\ncommunication)\n7.1.3 Eating and drinking\n7.1.4 Eliminating\n7.1.5 Breathing\n7.1.6 Mobilizing and transferring (moving from place to place\nand position to position)\n7.1.7 Attending to personal hygiene (bathing, laundering\npersonal linen)\n7.1.8 Dressing and undressing\n7.1.9 Attending own spiritual needs\n7.1.10 Grooming and expressing sexuality\n7.2\nPhysical/instrumental activities of daily living:\n7.2.1 Accessing education and employment\n7.2.2 Accessing financial resources and allowances\n7.2.3 Paying bills and regular outgoings\n7.2.4 Shopping\n7.2.5 Preparing meals\n7.2.6 Climbing stairs\n7.2.7 Maintaining household (cleaning, laundry, décor,\nrepairs)\n7.2.8 Traveling by private and public transport\n7.2.9 Interacting with others and socializing\n7.2.10 Accessing leisure, recreational and sporting activities\n7.3\nAssisting with self-administration of medication according to:\n7.3.1 Organizational practice and policy\n7.3.2 Government regulation, policy and legislation\n7.4\nPhysical comfort and rest\n7.5\nPain management\n7.6\nMaximization of independence and personal preferences\n7.7\nEmpowerment e.g. Enhancing of clients ability to\ncommunicate, act independently and uphold rights and\nresponsibilities\n8. Strategies to meet\nneeds\nMay include:\n8.1\nResponding to requirements arising from differences\n8.2\nUtilizing personal support equipment e.g. chair lifts,\nwheelchairs, hearing impaired phones, etc.\n8.3\nEnlisting specialist skills\n9. Support may be\nprovided\nMay include:\n9.1\nIn the clients home\n9.2\nAt residential or other services\n10.Relevant legislation\nand policies on health\nand safety\nMay include:\n10.1 Occupational health and safety\n10.2 State health acts\n10.3 EEO legislation\n10.4 Organizational policies and guidelines\n10.5 Daily living\n10.6 Medications\n10.7 Dealing with changes in physical or mental well being\n10.8 Occupational Health and Safety\n10.9 Sexual Harassment\n10.10 Abuse prevention\n11.Prevention and\nmanagement of\nchallenging behavior\nMay include:\n11.1 Recognizing triggers and deflecting them\n11.2 Using active listening and observation skills\n11.3 Ensuring effective communication\n11.4\nSeeking expert assistance\n\n--- PDF PAGE 59 ---\nTESDA-SOP-QSO-01-F08\nTR Domestic Work NC II (Amended)\nPromulgated February 2017\n56\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nEstablished and maintained appropriate relationship with\npeople who have special needs\n1.2\nProvided appropriate support to people with special needs\n1.3\nAssisted in maintaining the well being of people with special\nneeds\n1.4\nAssisted people with special needs to identify and meets their\nneeds\n\n2. Required Knowledge 2.1\nRelevant organizational policies and procedures and\nresponsibilities within it\n2.2\nRelevant policies, protocols and practices of the organization\nin relation to own work activities\n2.3\nBasic knowledge of different types of disabilities and their\neffects on clients need\n2.4\nUnderstanding of support requirements for people with special\nneeds\n2.5\nDifferent religious, cultural, spiritual, physical, specific\nknowledge of particular groups or issues may be required like\nthe following:\n2.5.1 Alcohol and other drugs\n2.5.2 Cultural and linguistic diversity\n2.5.3 Risk of self harm\n2.5.4 Women\n2.5.5 Men\n2.5.6 Community education\n2.5.7 Mental health\n2.6\nOrganizational philosophy and goals\n2.7\nLegislative provision in relation to the rights of people with\ndisabilities\n2.8\nBasic knowledge of human, social, psychological, cognitive\nand physical development\n2.9\nRole and responsibility of self and others in the organization\n2.10 Organization’s definition of challenging behavior\n2.11 Relevant support equipment (and technologies) and related\noccupational health and safety requirements regarding their\nuse\n2.12 Impact of particular types of disability\n2.13 Principles of empowerment/disempowerment in relation to\npeople with special needs\n2.14 Occupational health and safety guidelines\n2.15 Cultural factors affecting people with special needs\nrequirements\n2.16 Understanding of regulations and guidelines governing the\nhandling of medication\n\n--- PDF PAGE 60 ---\nTESDA-SOP-QSO-01-F08\nTR Domestic Work NC II (Amended)\nPromulgated February 2017\n57\n3. Required Skills\n3.1\nInterpersonal skills appropriate to work with people with\nspecial needs\n3.2\nOral communication skills (language skills) necessary to\ndevelop a trusting relationship with people with special needs.\nLanguage may be English or community language as required\nby service or organization\n3.3\nCommunication\n3.4\nTeam work\n3.5\nNegotiation\n3.6\nUse of equipment\n3.7\nInterpersonal communication\n3.8\nObservation as required by job role\n3.9\nAssessment as required by job role\n4. Resource\nImplications\nThe following resources should be provided:\n4.1\nA child care workplace\n4.2\nFacilities, equipment, tools, supplies and materials relevant to\nthe unit of competency.\n5. Methods of\nAssessment\nCompetency in this unit must be assessed through:\n5.1\nDemonstration with questioning\n5.2\nInterview\n6. Context of\nAssessment\n6.1\nCompetency may be assessed in the workplace or in a\nsimulated workplace setting.\n\n--- PDF PAGE 61 ---\nTESDA-SOP-QSO-01-F08\nTR Domestic Work NC II (Amended)\nPromulgated February 2017\n58\nUNIT OF COMPETENCY\n:\nASSIST IN THE CARE OF ANIMALS\n\nUNIT CODE\n:\nHCS913401\n\nUNIT DESCRIPTOR\n:\nThis unit of competency covers introductory level skills in the\nbasic care of quiet, well-handled animals under supervision.\n\nNo licensing, legislative, regulatory or certification requirements\napply to this unit at the time of publication.\n\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Explore workplace\nactivities and basic\nterminology\n1.1\nIndustry terminology is used to describe and identify animal\ncare workplace activities.\n1.2\nAnimal care workplace tasks are identified and ranked in\norder of importance to animal wellbeing and general health.\n1.3\nPotential occupational health and safety (OHS) risks when\nworking with animals are identified and reporting requirements\nconfirmed.\n1.4\nDaily workplace information and documentation\nrequirements are confirmed with supervisor.\n2. Maintain a clean\nworkplace\n2.1\nFloors benches and other flat areas are cleaned in accordance\nwith workplace protocols.\n2.2\nAnimal housing areas are cleaned in accordance with\nworkplace protocols.\n2.3\nWaste and soiled bedding is disposed of in accordance with\nworkplace protocols.\n3. Assist in feeding\nanimals\n3.1\nFood stuffs are identified and categorized for specific animal\ndietary needs.\n3.2\nEquipment used in food preparation and distribution is made\nready for use.\n3.3\nAssistance is provided to experienced staff in the preparation\nand distribution of meals.\n3.4\nEquipment and materials are cleaned and stored in\naccordance with organizational policies and procedures.\n4. Report basic animal\nbehavior and health\nstatus\n4.1\nCharacteristics of animal behavior are identified.\n4.2\nSigns of healthy, sick or distressed animals are identified and\nbehavior and health status is reported to supervisor.\n\n--- PDF PAGE 62 ---\nTESDA-SOP-QSO-01-F08\nTR Domestic Work NC II (Amended)\nPromulgated February 2017\n59\nRANGE OF VARIABLES\nVARIABLES\nRANGE\n1. Animal care\nworkplace tasks\nMay include:\n1.1\nAssisting in heath care of animals\n1.2\nEnclosure and bed cleaning and bedding replacement\n1.3\nEquipment and consumables stocktake and ordering\n1.4\nExercising animals\n1.5\nFeeding and watering animals\n1.6\nFollowing environmentally sustainable work practices\n1.7\nGrooming and animal cleaning\n1.8\nInformation collection, record and resource update\n1.9\nObserving animal behavior and reporting\n1.10 Taking messages and relaying information to appropriate\nperson\n1.11\nCleaning workplace and equipment.\n2. OHS risks when\nworking with animals\nMay include:\n2.1\nAnimal bites, envenomation, kicks, scratches and crush\ninjuries\n2.2\nBiological hazardous waste and sharps disposal\n2.3\nHandling of chemicals and medicines\n2.4\nGas leakage\n2.5\nInhalation of aerosol particles\n2.6\nIntraocular contamination\n2.7\nManual handling, including carrying, lifting and shifting\n2.8\nNeedle pricks and cuts from other sharps\n2.9\nRelease of infective agents (animal and human)\n2.10 Slippery or uneven work surfaces\n2.11\nZoonoses.\n3. Daily workplace\ninformation and\ndocumentation\nMay include:\n3.1\nAccident and incident records\n3.2\nAnimal feeding, health and treatment records\n3.3\nAnimal identification and history\n3.4\nOHS and emergency procedures and contact information\n3.5\nEquipment inventory, damage and repairs registers\n3.6\nProvisions records of current stock and items used and items\nrequired\n3.7\nStaff work roster.\n4. Characteristics of\nanimal behavior\nMay include:\n4.1 Indicators of stress:\n4.1.1\nAggressive behavior\n4.1.2\nSubdued behavior\n4.1.3\nTrembling\n4.1.4\nVocalization\n4.2 Confidence and willingness to be approached gestures:\n4.2.1 Relaxed body tone and tail wagging\n4.2.2 Standing still or remaining sitting or laying down\nwhen approached\n4.3 Defensive gestures:\n4.3.1 Defending territory, other animals or food\n4.3.2 Growling, barking, hissing and spitting\n4.3.3 Hair on topline being raised\n4.3.4 Lunging forward\n4.3.5 Pecking\n4.3.6 Striking out with paws\n4.4 Submissive gestures:\n4.4.1 Lowering body\n4.4.2 Rolling onto back\n4.4.3 Tail between legs\n4.4.4 Turning away from handler.\n\n--- PDF PAGE 63 ---\nTESDA-SOP-QSO-01-F08\nTR Domestic Work NC II (Amended)\nPromulgated February 2017\n60\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires that the candidate:\n1.1\nConfirmed industry terminology used to describe daily work\nroutines and to report observations and activities to supervisor\n1.2\nCleaned work areas and animal housing in accordance with\nOHS and organization policies and procedures\n1.3\nAssisted in the preparation and distribution of food under\nsupervision\n1.4\nRelated basic animal behavior to animal categories and report\nobservations of live animal behavior and health status to\nsupervisor.\nThe skills and knowledge required to assist in the care of animals\nmust be transferable to a range of work environments and contexts\nand include the ability to deal with unplanned events.\n2. Required knowledge\n2.1\nAnimal temperaments and behaviors related to the associated\nhazards and risks to animals and staff during animal feeding\nand cleaning of housing\n2.2\nBasic awareness of natural animal behavior relating to the\ncharacteristics of the species, age, health status and social\nneeds\n2.3\nBasic nutritional requirements for animals, including water\n2.4\ncleaning techniques and related safety issues for general\nworkplace and animal housing\n2.5\nPrinciples of animal welfare and ethics\n2.6\nProcesses that support environment and resource efficiencies\n2.7\nRelevant organizational policies and procedures, including\nOHS and emergency procedures, animal welfare and waste\ndisposal requirements\n2.8\nSafe work practices\n2.9\nStorage, preparation and presentation requirements for food\n2.10 Types of food and food supplements and their basic role in\nanimal diets\n2.11 Types of information that has to be reported and recorded in\nanimal care workplaces\n2.12 Workplace hygiene standards, disinfectants, cleaning agents,\ncleaning techniques and cleaning equipment and materials.\n3. Required skills\n3.1\nEmploy safe and environmentally responsible organizational\nsystems and procedures when handling animals and feed\n3.2\nDocument and report basic workplace information related to\nthe daily care of animals\n3.3\nMaintain the highest standards of hygiene and infection\ncontrol at all times to reduce the risk of infection and cross-\ninfection\n3.4\nParticipate in arrangements for maintaining the health and\nsafety of all people and animals in the workplace\n3.5\nUndertake work with animals as directed under supervision\n3.6\nUse equipment and materials correctly and in accordance with\nmanufacturers' specifications\n.\n\n--- PDF PAGE 64 ---\nTESDA-SOP-QSO-01-F08\nTR Domestic Work NC II (Amended)\nPromulgated February 2017\n61\n\n3.7\nNumeracy skills to estimate, calculate and record routine\nworkplace measures\n3.8\nOral communication skills/language to fulfill the job role as\nspecified by the organization, including questioning, active\nlistening, asking for clarification and seeking advice from\nsupervisor\n3.9\nInterpersonal skills to work with and relate to people from a\nrange of cultural, social and religious backgrounds\n3.10 Problem-solving skills to select required materials and\nequipment and prioritize tasks\n3.11 Use safe manual handling techniques and/or equipment\n3.12 Use safe waste handling and disposal procedures.\n4. Resource\nImplications\nThe following resources should be provided:\n4.1\nAnimal care workplace\n4.2\nMaterials, tools and equipment relevant to the proposed\nactivity or task\n5. Methods of\nAssessment\nCompetency in this unit must be assessed through:\n5.1\nWritten examination\n5.2\nInterview\n5.3\nDemonstration with questioning\n6. Context of\nAssessment\n6.1 Competency may be assessed in the workplace or in a\nsimulated workplace setting.\n\n--- PDF PAGE 65 ---\nTESDA-SOP-QSO-01-F08\nTR Domestic Work NC II (Amended)\nPromulgated February 2017\n62\nUNIT OF COMPETENCY\n:\nPROVIDE ANIMAL CARE HYGIENE ROUTINES\n\nUNIT CODE\n:\nHCS913402\n\nUNIT DESCRIPTOR\n:\nThis unit of competency covers the responsibilities and\nprocedures required to provide daily care of animals, including\nthe cleaning of animal housing and grooming or cleaning of\nanimals under supervision.\n\nNo licensing, legislative, regulatory or certification requirements\napply to this unit at the time of publication.\n\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Confirm workplace\nanimal care routine\nschedules\n1.1\nDaily, weekly and periodical workplace routine schedules are\nidentified and confirmed with (supervisor) appropriate\nhousehold staff\n1.2\nPersonal workplace responsibilities are clarified.\n1.3\nWorkplace schedule and recording documents are collected\nand updated as required.\n2. Check animals\n2.1\nAnimals under personal responsibility during (shift)\nhousehold work are clarified.\n2.2\nAnimal status is verified via records or verbal reports.\n2.3\nAnimals are counted and basic behavior is noted at beginning\nof (shift) household work.\n2.4\nChanges in animal numbers, behavior or condition are\nreported to (supervisor.) appropriate household staff\n2.5\nAnimals under personal responsibility are checked and status\nreported.\n3. Maintain a clean\nworkplace\n3.1\nFloors benches and other flat areas are cleaned in accordance\nwith workplace (protocols) SOPs.\n3.2\nAnimal housing areas are cleaned in accordance with\nworkplace (protocols) SOPs\n3.3\nWaste and soiled bedding is disposed of in accordance with\nworkplace (protocols.) SOPs.\n3.4\nDamage to housing and equipment is identified and reported.\n3.5\nPost-cleaning procedures are completed.\n4. Complete hygiene\npractices for animals\n4.1\nHygiene control methods for a range of animals are identified\nand practiced.\n4.2\nBasic animal hygiene inspection is performed and cleaning\nneeds of nominated animals are identified.\n4.3\nAnimals are bathed or cleaned under supervision.\n4.4\nGrooming techniques are determined in accordance with\nindividual animal requirements.\n4.5\nAnimals are groomed according to individual needs under\nsupervision.\n5. Complete post-\nhygiene care of\nanimals\n5.1\nAnimals are returned to housing.\n5.2\nWashing equipment is cleaned and stored.\n5.3\nGrooming tools are cleaned, checked and stored.\n5.4\nDamaged tools are reported to (supervisor.) appropriate\nhousehold staff.\n5.5\nSupplies are audited and documented in accordance with\nworkplace procedures.\n5.6\nWorkplace documents are updated as required.\n\n--- PDF PAGE 66 ---\nTESDA-SOP-QSO-01-F08\nTR Domestic Work NC II (Amended)\nPromulgated February 2017\n63\nRANGE OF VARIABLES\nVARIABLES\nRANGE\n1. Workplace routines\nMay include:\n1.1\nAssisting others in completion of tasks within limits of current\nlevel of competence\n1.2\nCatching and handling animals under supervision\n1.3\nChecking animals for signs of distress, illness and injury\n1.4\nChecking security and repair of animal housing, equipment and\ngeneral facility\n1.5\nCleaning and grooming animals under supervision\n1.6\nCleaning and preparation of animal cages, enclosures, exhibits,\ndisplays, general work areas, office, reception and customer\nservice areas\n1.7\nConfirming all animals are in their cages or enclosures\n1.8\nDocumenting work tasks in accordance with workplace\nprocedures\n1.9\nOperating general equipment used to complete workplace\ncleaning routines\n1.10\nPicking up rubbish, removing branches or other unsightly items\nnot part of exhibit or animal housing\n1.11\nReporting animal health concerns to supervisor\n1.12\nStocktaking and re-supply of items\n1.13\nTimeframes for completing tasks.\n2. Animals\nMay include:\n2.1\nAnimals commonly encountered within the industry workplace\nand may cover both native and introduced species\n2.2\nAnimals from the six major animal groups (mammals, birds,\nreptiles, amphibians, fish and invertebrates).\n3. Animal status\nMay include:\n3.1\nCounting animals\n3.2\nObserving and reporting unusual behavior for nominated animal:\n3.3\nAggression or docility (depending on animal)\n3.4\nDisinterest in surroundings, other animals, people or usual\nstimuli\n3.5\nExcessive licking, scratching and rubbing\n3.6\nLethargy\n3.7\nNest building\n3.8\nSelf mutilation\n3.9\nTrembling\n3.10\nVocalizing\n3.11\nObserving and reporting indicators of illness or injury:\n3.11.1 Bleeding\n3.11.2 Changes in drinking or eating patterns\n3.11.3 Lameness or reluctance to move and vocalizing when\nattempting to move\n3.11.4 Swelling\n3.11.5 Unusual amounts, color or texture of feces.\n4. Maintaining a clean\nworkplace\nMay include:\n4.1 Animal housing:\n4.1.1 Adjusting animal housing features according to weather\nand climatic conditions\n4.1.2 Collection and removal of feces\n4.1.3 Completing cleaning routines for sick or quarantined\nanimals to avoid cross-contamination\n4.1.4 Emptying and cleaning water and feeding receptacles\nusing approved cleaning products and methods\n4.1.5 Refilling water containers\n4.1.6 Removing rubbish from housing and surrounding areas\n\n--- PDF PAGE 67 ---\nTESDA-SOP-QSO-01-F08\nTR Domestic Work NC II (Amended)\nPromulgated February 2017\n64\nVARIABLES\nRANGE\n4.1.7 Removing soiled bedding and disposing in approved\narea\n4.1.8 Replacement of housing furniture items, such as\nvegetation and behavior stimulation items under\ndirection of supervisor\n4.1.9 Resetting of clean bedding materials\n4.1.10 Washing down of toilet areas to remove urine and\nfaeces using approved cleaning products and methods\n4.2 General work area cleaning:\n4.2.1 Emptying rubbish bins, picking up general litter within\nthe workplace\n4.2.2 Vacuuming, sweeping, floor cleaning\n4.2.3 Using non-disrupting cleaning methods to control\npotential biohazards, when required\n4.2.4 Washing and wiping down work areas, benches and\nequipment\n4.3 Storing equipment to avoid slip and trip hazards\n4.4 Reporting damaged equipment.\n5. Hygiene control\npractices\nMay include:\n5.1 Aseptic technique\n5.2 Checking animals skin, coat, shell, carapace or other external\nfeatures for:\n5.2.1 Foreign objects such as grass seeds, sticks or other\nvegetation and hardware, such as nails\n5.2.2 General condition\n5.2.3 Signs of coat, skin, shell and carapace shedding\n5.2.4 Signs of damage, including cracks, breaks, splits,\nexudates and, tenderness\n5.2.5 Signs of dirt, feces, food or other items\n5.2.6 Signs of parasites, including presence of eggs, blisters\nor other lesions, rubbed areas of coat, skin texture\nchanges and color changes\n5.3 Completing infection control procedures as required\n5.4 Grooming animals to remove shedding coat or skin, if required, or\nfor general health and wellbeing\n5.5 Isolating potentially contagious or ill animals under supervision\n5.6 Personal hygiene practices especially washing and drying hands\n(e.g. before and after animal contact)\n5.7 Providing housing furnishings to assist animal to complete own\nshedding process\n5.8 Referring to supervisor animals that may require:\n5.8.1 Wound and injury management treatment\n5.8.2 Examination in relation to potential contagious\nconditions\n5.8.3 repairs to shell\n5.9 Use of personal protective equipment\n5.10 Washing animal to remove dirt, foreign objects, parasites and\nother undesirable items.\n6. Workplace documents\nMay include:\n6.1\nAnimal health records\n6.2\nChemical register\n6.3\nDiary, rosters and task completion and timeframe records\n6.4\nEquipment use, damage and repair register\n6.5\nFacility damage and repair register\n6.6\nIncident reports\n6.7\nMessage recording systems\n6.8\nStock control records\n6.9\nSafe operating procedures.\n\n--- PDF PAGE 68 ---\nTESDA-SOP-QSO-01-F08\nTR Domestic Work NC II (Amended)\nPromulgated February 2017\n65\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires that the candidate:\n1.1\nConfirmed animal care routines required, clean and maintain\nanimal housing and related facilities\n1.2\nMaintained animal comfort and health through cleaning and\ngrooming of animals\n1.3\nReported and documented personal animal care duties\n1.4\nMonitored animals and reported issues as required according\nto workplace protocols and procedures.\nThe skills and knowledge required to complete animal care hygiene\nroutines must be transferable to a range of work environments and\ncontexts and include the ability to deal with unplanned events.\n2. Required Knowledge\n2.1\nAnimal care and hygiene principles\n2.2\nAnimal housing cleaning techniques and equipment\n2.3\nAnimal temperaments and behaviors related to the associated\nhazards and risks to animals and staff during animal handling\nand cleaning of housing\n2.4\nBasic animal grooming techniques and equipment\n2.5\nBasic awareness of natural animal behavior relating to the\ncharacteristics of the species, age, health status and social\nneeds\n2.6\nCommon diseases, ailments, injuries and other impacts on\nanimal health and wellbeing\n2.7\nHousing, exercise, social and activity needs of animals\n2.8\nIndicators of poor response to treatment or management of\nyoung, ill, injured or compromised animals\n2.9\nOrganization policies, procedures and requirements, including\nOHS and emergency procedures\n2.10 Principles of animal welfare and ethics\n2.11 Protocols, legal and ethical considerations in documenting\nobservations, measurements, treatments and decisions on\nanimal care\n2.12 Regulations relating to the disposal of hazardous waste\n2.13 Relevant occupational health and safety (OHS) and animal\nwelfare legislative requirements and codes of practice\n2.14 Safe animal handling techniques and procedures\n2.15 Safe use of chemicals and cleaning agents\n2.16 Terminology used to identify animals and describe their\nbehavior\n2.17 Workplace hygiene standards, disinfectants, cleaning agents,\ncleaning techniques and cleaning equipment and materials.\n3. Required Skills\n3.1\nEmploy safe and environmentally responsible organizational\nsystems and procedures when working with animals\n3.2\nIdentify common indicators of the presence of disease injury,\ncompromised health or distress in animals\n3.3\nInterpret and report basic workplace information related to the\ndaily care of animals\n\n--- PDF PAGE 69 ---\nTESDA-SOP-QSO-01-F08\nTR Domestic Work NC II (Amended)\nPromulgated February 2017\n66\n\n3.4\nMaintain the highest standards of hygiene and infection\ncontrol at all times to reduce the risk of infection and cross-\ninfection\n3.5\nObserve, document and report findings on animal health and\nbehavior using workplace protocols and procedures\n3.6\nParticipate in arrangements for maintaining the health and\nsafety of all people and animals in the workplace\n3.7\nPrepare materials, tools and equipment\n3.8\nUse equipment and materials correctly and in accordance with\nmanufacturers' specifications\n3.9\nLiteracy skills to follow sequenced written instructions, and\nrecord information accurately and legibly\n3.10 Oral communication skills/language to fulfill the job role as\nspecified by the organization, including questioning, active\nlistening, asking for clarification and seeking advice from\nsupervisor\n3.11 Numeracy skills to estimate, calculate and record routine\nworkplace measures\n3.12 Interpersonal skills to relate to people from a range of social,\ncultural and ethnic backgrounds and with a range of physical\nand mental abilities\n3.13 Use safe manual handling techniques and/or equipment\n3.14 Use safe waste handling and disposal procedures.\n4. Resource\nImplications\nThe following resources should be provided:\n4.1\nAnimal care work place\n4.2\nMaterials, tools and equipment relevant to the proposed\nactivity or task\n5. Methods of\nAssessment\nCompetency in this unit must be assessed through:\n5.1\nWritten Examination\n5.2\nInterview\n5.3\nDemonstration with questioning\n6. Context of\nAssessment\n6.1 Competency may be assessed in the workplace or in a\nsimulated workplace setting.\n\n--- PDF PAGE 70 ---\nTESDA-SOP-QSO-01-F08\nTR Domestic Work NC II (Amended)\nPromulgated February 2017\n67\nUNIT OF COMPETENCY :\nTRIM AND PRUNE LANDSCAPE PLANTS\n\nUNIT CODE\n:\nAGR611376\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes required to trim\nand prune landscape plant based on the purposes of such landscape\nmaintenance activity.\n\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Identify trimming and\npruning requirements\n\n1.1\nLandscape plants and their parts that are in need of trimming\nand pruning are distinguished according to landscape\nmaintenance standards (LMS).\n1.2\nPurpose and method of pruning are determined according to\nLMS.\n1.3\nUtility services are located using site plans and in\nconsultation with concerned persons or authority.\n1.4\nAccess to the site is determined in consultation with\nconcerned persons or authority.\n1.5\nOccupational Health and Safety (OHS) hazards are identified,\nrisks assessed and reported to concerned persons or\nauthority.\n2. Prepare for trimming\nand pruning\noperations\n2.1\nTools, supplies and equipment are prepared in accordance\nwith the work requirements.\n2.2\nPre-operational and safety checks are carried out on tools and\nequipment according to manufacturer’s specifications and\nindustry work practices.\n2.3\nPrescribed safety and personal protective equipment\n(PPE) is selected, used and maintained.\n3. Perform trimming and\npruning\n3.1\nSafety and warning devices are installed around the site\nduring and between work periods.\n3.2\nLandscape plants are trimmed and pruned in accordance with\nwork program and LMS.\n3.3\nTrimming and pruning of landscape plants are done using\nprescribed tools and equipment.\n3.4\nSterilizing agent/compound are applied on pruning wounds\nin accordance with LMS.\n3.5\nTasks are conducted using appropriate PPE.\n4. Perform post-\ntrimming and pruning\nactivities\n4.1\nTrimming and pruning wastes are collected and disposed\nfrom the site in accordance with environmental standards and\nLMS.\n4.2\nRecommended manual handling techniques are used when\nlifting or moving heavy loads.\n4.3\nTools and equipment are cleaned, maintained and stored\naccording to LMS.\n4.4\nMaintenance of clean and safe area is undertaken\nthroughout and on completion of work.\n4.5\nWork outputs are recorded or reported to concerned persons\nor authority according to industry practices.\n\n--- PDF PAGE 71 ---\nTESDA-SOP-QSO-01-F08\nTR Domestic Work NC II (Amended)\nPromulgated February 2017\n68\nRANGE OF VARIABLES\n\nVARIABLES\nRANGE\n1. Landscape plants\nMay include:\n1.1\nShrubs and hedges\n1.2\nVines\n1.3\nPalms\n1.4\nBamboos\n1.5\nTrees\n2. Purpose\nMay include:\n2.1\nCreate and maintain form and shape of landscape plant\n2.2\nPromote health\n2.3\nDirect or control growth\n2.4\nEncourage flowering and fruiting\n2.5\nRemove/minimize risk/hazard\n3. Utility services\nMay include:\n3.1\nAboveground utilities\n3.1.1\nElectrical and communication lines\n3.1.2\nCable/TV lines\n3.2\nUnderground utilities\n3.2.1\nIrrigation and domestic water distribution lines\n3.2.2\nElectrical and communication lines\n3.2.3\nCable/TV lines\n3.2.4\nDrainages and sewerages\n4. Concerned persons\nor authority\nMay include:\n4.1\nSupervisor\n4.2\nProperty management officer\n4.3\nHome owner\n4.4\nInspector\n5. Hazards\nMay include:\n5.1\nDisturbance or interruption of services\n5.2\nSolar radiation\n5.3\nPollutants (e.g. gaseous, suspended particulate matters)\n5.4\nNoise\n5.5\nManual handling of moving powered equipment or parts,\nsharp tools and materials\n5.6\nUneven landforms/surfaces\n5.7\nFlying and falling objects\n6. Risks\nMay include:\n6.1\nRisk to co-workers, equipment, other people and animals\nexternal to the workplace (e.g. members of the public, stray\npets and wildlife)\n6.2\nRisk to natural environment\n\n--- PDF PAGE 72 ---\nTESDA-SOP-QSO-01-F08\nTR Domestic Work NC II (Amended)\nPromulgated February 2017\n69\nVARIABLE\nRANGE\n7. Tools, supplies and\nequipment\nMay include:\n7.1\nHedge trimmers (HT): Power and manual\n7.2\nShears: Pruning, loping\n7.3\nSaws: Pruning saws, chain saws, bow saws\n7.4\nPole/Tree pruner\n7.5\nTelescopic shaft/high branch pruning chain saws\n7.6\nLadder/adjustable ladder\n7.7\nBasket type boom/cherry picker\n7.8\nSterilizing agent/pruning compound\n8. Safety and PPE\nMay include:\n8.1\nEarly warning devices\n8.2\nOverall\n8.3\nGloves\n8.4\nGoggles\n8.5\nEar muff/plugs\n8.6\nGas mask\n8.7\nSafety belt/harness\n8.8\nClimbing ropes/gadgets\n8.9\nHard hat\n8.10 Shoes/safety shoes\n8.11 Reflectorized vest (depends on location of work)\n9. Early warning\ndevices\nMay include:\n9.1\nTraffic cones\n9.2\nWarning tapes\n9.3\nWarning signage\n10. Sterilizing agent/\ncompound\n10.1 Coal tar\n10.2 Bituminous pruning compound\n10.3 Latex Paint with fungicide\n10.4 Fungicide\n11. Trimming and\npruning wastes\n\nMay include:\n11.1 Tops or shoots\n11.2 Branches\n11.3 Twigs\n11.4 Leaves\n11.5 Flowers and fruits\n12. Maintenance of clean\nand safe area\nMay include:\n12.1 Keeping public access paths and roads clear of debris, waste,\ntools and equipment\n12.2 Disabling tools and equipment after use\n12.3 Using signage and barriers where necessary\n12.4 Removing debris and waste from the work area\n\n--- PDF PAGE 73 ---\nTESDA-SOP-QSO-01-F08\nTR Domestic Work NC II (Amended)\nPromulgated February 2017\n70\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nIdentified trimming and pruning requirements\n1.2\nPrepared supplies, materials, tools, equipment and PPE\n1.3\nTrimmed and pruned landscape plants\n1.4\nApplied sterilizing agent/compound\n1.5\nPerformed post-trimming and pruning operations\n1.6\nObserved OHS practices\n2. Required Knowledge\n\n2.1\nTypes of landscape plants, their characteristics and growth\nhabit\n2.2\nTechniques, principles and procedures of trimming and\npruning applicable to plant types and plant factors,\nenvironmental and cultural considerations and objectives of\nthe tasks\n2.3\nEffects of trimming and pruning operations on plant growth\nand development\n2.4\nFunctions and uses of tools and equipment\n2.5\nHygiene practices and plant health principles relevant to\ntrimming and pruning\n2.6\nHazards/risks and responsibilities associated with working in a\npublicly accessible situation\n2.7\nValues:\n2.7.1\nDiligence\n2.7.2\nTime consciousness\n2.7.3\nCost consciousness\n2.7.4\nHygiene consciousness\n2.7.5\nPersistence\n2.7.6\nSystematic and organized\n3. Required Skills\n3.1\nUsing of appropriate tools and equipment and prescribed\nsafety/protective devices\n3.2\nUnderstanding work procedures\n3.3\nParticipating in teams and contributing to team objectives\n3.4\nCommunication skills in receiving instructions and rendering\neven simple oral and written reports\n3.5\nMaintaining tools and equipment\n3.6\nMinimizing environmental disturbances\n\n4. Resource\nImplications\nThe following resources should be provided:\n4.1\nLandscape plants and/or landscaped area\n4.2\nTools, equipment and supplies relevant to the activity\n4.3\nProtective/safety gadgets\n5. Methods of\nAssessment\nCompetency in this unit must be assessed through:\n5.1\nDirect Observation with Oral Questioning\n5.2\nInterview\n5.3\nPortfolio\n6. Context of\nAssessment\n6.1\nCompetency may be assessed individually in the actual\nworkplace or simulation environment in TESDA accredited\ninstitutions.\n\n--- PDF PAGE 74 ---\nTESDA-SOP-QSO-01-F08\nTR Domestic Work NC II (Amended)\nPromulgated February 2017\n71\nUNIT OF COMPETENCY :\nPERFORM WEEDING AND CULTIVATION\n\nUNIT CODE\n:\nAGR611377\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes required to\nconduct weeding operations and soil cultivation activities. This is\npurposely to minimize competition and to improve soil aeration and\nwater absorption/retention, respectively for better growth and\ndevelopment of the landscape plants.\n\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Determine\nrequirements for\nweeding and\ncultivation activity\n1.1\nWeed species and “volunteer” plants (“’invaders”) that are\nout-of-place and considered undesirable in the landscape are\nidentified based on specific landscape maintenance guidelines\nor as per instructions.\n1.2\nLandscape areas needing weeding and cultivation are\nidentified based on instructions or in accordance with LMS\n2. Prepare for weeding\nand cultivation\noperation\n\n2.1\nList of weeds and “volunteer plants” and the map of specific\nlandscape areas are prepared and secured\n2.2\nMethod and purpose of weeding are determined based on\nthe type of weed species and out-of-place “volunteer” species\n2.3\nTools, supplies and equipment needed are made ready and\navailable for use according to the types of weeds and\n“volunteer” species that needs removal\n2.4\nAppropriate safety protective devices are prepared for use\n3. Conduct weeding and\nremoval of\n“volunteer” species\n\n3.1\nWeeds and out-of-place “volunteer” plant species in the\nlandscape are removed and disposed in accordance with\nlandscape maintenance standard or as per instructions.\n3.2\nWeeds and out-of-place “volunteer” plant species are\nremoved using prescribed tools and equipment\n3.3\nTasks are done using appropriate safety/protective devices\n4. Determine\ncompacted soil\n4.1\nCompacted soil or soil that is having problem with aeration,\nwater infiltration and conditions for root development is\ndetermined as per established practice\n4.2\nEffects of compacted soil on root development and anchorage\nare recognized\n4.3\nMethod and purpose of soil cultivation are determined\nbased on the conditions of the soil\n5. Cultivate compacted\nsoil\n5.1\nCompacted soil is cultivated simultaneous with weeding\noperations in accordance with landscape maintenance\nstandards or as per instructions\n5.2\nSoil cultivation is done using appropriate tools and equipment\n5.3\nTask is performed using prescribed safety/protective devices\n6. Perform post-\nweeding and soil\ncultivation activities\n6.1\nTools and equipment are cleaned, maintained and stored as\nper instruction of in accordance with LMS\n6.2\nMaintenance of clean and safe area is undertaken\nthroughout and on completion of work\n6.3\nWork outputs are recorded or reported to concerned persons\nor authority according to industry practices\n\n--- PDF PAGE 75 ---\nTESDA-SOP-QSO-01-F08\nTR Domestic Work NC II (Amended)\nPromulgated February 2017\n72\nRANGE OF VARIABLES\nVARIABLES\nRANGE\n1. Weed species and\nvolunteer plants\n(invaders)\nMay include:\n1.1\nWeeds\n1.1.1 Grass\n1.1.2 Sedges\n1.1.3 Shrubs\n1.1.4 Vines\n1.2\nOut-of-place “volunteer” plant species are those that grow\nnaturally in the site and are competing with desirable plants,\nmaking the site ugly and/or are eye-sore in the landscape.\nVolunteer species can be landscape plants but is not included\nin the landscape design\n2. Landscape areas\nMay include:\n2.1\nLawn\n2.2\nFlower beds\n2.3\nHedges and shrubs landscape area\n2.4\nTree lawn or tree planting verges\n3. Methods of weed\ncontrol\nMay include:\n3.1\nManual weeding\n3.2\nMechanical weeding\n3.3\nChemical weeding\n4. Purpose of weeding\nMay include:\n4.1\nRelease the desirable landscape plants from competition of\nweeds and out-of-place “volunteer” species\n4.2\nImprove the health conditions of the landscape plants\n4.3\nLessen susceptibility of the landscape plants from pest and\ndisease attack\n5. Methods of soil\ncultivation\nMay include:\n5.1\nManual\n5.2\nMechanical\n6. Purpose of soil\ncultivation\nMay include:\n6.1\nImprove soil structure, porosity, aeration and water infiltration\n6.2\nImprove conditions for root system development and root\nanchorage\n6.3\nImprove water and nutrient absorption\n6.4\nEnhance soil macro and micro-organisms activity\n7. Supplies, tools and\nequipment for\nweeding operations\n\nMay include:\n7.1\nSmall bolo “dulos”\n7.2\nScythe (“Karit”)\n7.3\nSmall round/flat bar\n7.4\nSpade\n7.5\nTrowel\n7.6\nChemicals (Types: Selective herbicide; Wide spectrum)\n8. Tools and equipment\nfor soil cultivator\nMay in clued:\n8.1\nSmall bolo (“dulos”)\n8.2\nSmall round/flat bar\n8.3\nSpade\n8.4\nSoil cultivating machine\n9. Protective/safety\ndevices used in\nweeding and\ncultivation\nMay include:\n9.1\nGoggles\n9.2\nOveralls, gloves\n9.3\nReflectorized vest (depends on location of work)\n10.Maintenance of clean\nand safe area\nMay include:\n10.1 Keeping public access paths and roads clear of debris, waste,\ntools and equipment\n10.2 Disabling tools and equipment after use\n10.3 Using signage and barriers where necessary\n10.4 Removing debris and waste from the work area\n\n--- PDF PAGE 76 ---\nTESDA-SOP-QSO-01-F08\nTR Domestic Work NC II (Amended)\nPromulgated February 2017\n73\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nDetermined requirements for weeding and cultivation activity\n1.2\nPrepared for weeding and cultivation operation\n1.3\nConducted weeding and removal of “volunteer” plant species\n1.4\nDetermined compacted soil\n1.5\nCultivated compacted soil\n1.6\nConducted post weeding and soil cultivation operations\n1.7\nUsed/operated tools and equipment properly\n1.8\nUsed prescribed protective/safety gadgets\n2. Required Knowledge\n\n2.1\nRecognition of the effects of weeds and undesirable\n“volunteer” species (invaders) on landscape plants\n2.2\nKnowledge in distinguishing weeds and undesirable\n“volunteer” species\n2.3\nUse of weed control and soil cultivation method\n2.4\nFunctions, uses and maintenance of tools and equipment\n2.5\nValues:\n2.5.1 Diligence\n2.5.2 Time consciousness\n2.5.3 Cost consciousness\n2.5.4 Hygiene consciousness\n2.5.5 Persistence\n2.5.6 Systematic and organized\n3. Required Skills\n3.1\nUse of appropriate tools and equipment and prescribed\nprotective/safety devices in weeding and soil cultivation\n3.2\nCommunication skills in receiving instructions and rendering\neven verbal reports about the completed task\n4. Resource\nImplications\nThe following resources should be provided:\n4.1\nLandscape area\n4.2\nNecessary tools and equipment\n4.3\nRelevant supplies and materials\n5. Methods of\nAssessment\nCompetency in this unit must be assessed through:\n5.1\nDirect Observation with Oral Questioning\n5.2\nInterview\n5.3\nPortfolio\n6. Context of\nAssessment\n6.1\nCompetency may be assessed individually in the actual\nworkplace or simulation environment in TESDA accredited\ninstitutions.\n\n--- PDF PAGE 77 ---\nTESDA-SOP-QSO-01-F08\nTR Domestic Work NC II (Amended)\nPromulgated February 2017\n74\nUNIIT OF COMPETENCY :\nWATER PLANTS\n\nUNIT CODE\n:\nAGR611379\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes required to\nmaintain the health and vigor of the landscape plants through proper\nwatering/irrigation.\n\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Determine\nrequirements of\nwatering/irrigating\nlandscape plants\n\n1.1\nImportance of water to growth and development of landscape\nplants and the effects of water stress (less or excess water) to\nplants are recognized as per established practice.\n1.2\nLandscape plants suffering from less or excessive watering\nare determined using some visually observable plant and\nsoil conditions and/or guidelines.\n2. Prepare for\nwatering/irrigation\nactivity\n2.1\nAmount and frequency of watering/irrigation of plants are\ndetermined in accordance with LMS or as per instructions.\n2.2\nTools, supplies and equipment needed are prepared based\non the method of watering and/or irrigation to be used.\n2.3\nPrescribed protective/safety devices are made ready and\navailable for use.\n3. Conduct\nwatering/irrigation of\nplant\n3.1\nWatering or irrigating of plants is done in accordance with the\nbasic principles or standard practice or as per instructions.\n3.2\nWatering/irrigation is performed using the irrigation tools and\nequipment appropriate to the methods selected.\n3.3\nTask is performed using the prescribed protective/safety\ngadgets.\n4. Perform post-\nwatering/irrigation\nactivities\n4.1\nTools and equipment are cleaned, maintained and stored as\nper instruction of in accordance with LMS.\n4.2\nMaintenance of clean and safe area is undertaken\nthroughout and upon completion of work.\n4.3\nWork outputs are recorded or reported to concerned persons\nor authority according to industry practices.\n\n--- PDF PAGE 78 ---\nTESDA-SOP-QSO-01-F08\nTR Domestic Work NC II (Amended)\nPromulgated February 2017\n75\nRANGE OF VARIABLES\n\nVARIABLES\nRANGE\n1. Importance of water\nto plants\nMay include:\n1.1\nMaintains of vital physiological processes in plants\n1.2\nPrimary raw material for photosynthesis or food manufacture\n1.3\nMaintains of turgidity of the cells\n1.4\nHelps in the translocation of nutrients, food and other\nassimilates\n1.5\nMaintains the health conditions of the plant\n2. Plant conditions\nMay include:\nVisually observable conditions of plants suffering from water stress\n2.1\nWilting and die back\n2.2\nChange in color and appearance of the leaves\n2.3\nPremature falling of leaves/defoliation\n3. Soil conditions\nMay include:\nVisually observable conditions of soil suffering from water stress\n3.1\nWhen dry\n3.1.1\nToo dusty\n3.1.2\nCracks on soil\n3.2\nWhen waterlogged or over-watered\n3.2.1\nToo wet\n3.2.2\nMuddy\n4. Amount and\nfrequency of watering\nMay include:\nDetermining when and how much to irrigate may include:\n4.1\nObservation of the conditions of the plant\n4.2\nObservation of the conditions of the soil\n4.3\nUse of moisture meter\n5. Methods of\nwatering/irrigation\n\nMay include:\nThe methods of watering depends on the kind of landscape\nplants/landscape areas and available facilities:\n5.1\nOverhead irrigation: overhead sprinkler, pop-up etc.\n5.2\nDrip irrigation\n5.3\nFurrow irrigation\n5.4\nBasin irrigation\n6. Tools and equipment\n\nMay include:\nDepending on the method, the following may be needed:\n6.1\nWater hose with and without sprinklers\n6.2\nWater truck\n6.3\nIrrigation system installed\n6.4\nPlumbing tools\n7. Protective/safety\ndevices\n7.1\nOveralls\n7.2\nGloves\n7.3\nHat/hard hat\n7.4\nRain boots\n7.5\nReflectorized vest (depends on the location of work)\n8. Maintenance of clean\nand safe area\nMay include:\n8.1\nKeeping public access paths and roads clear of debris, waste,\ntools and equipment\n8.2\nDisabling tools and equipment after use\n8.3\nUsing signage and barriers where necessary\n8.4\nRemoving debris and waste from the work area\n\n--- PDF PAGE 79 ---\nTESDA-SOP-QSO-01-F08\nTR Domestic Work NC II (Amended)\nPromulgated February 2017\n76\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nDetermined requirements of watering/irrigating plants\n1.2\nRecognized importance of water to plants and the consequent\neffects of less or over-watering\n1.3\nDistinguished plants needing watering and plants in excess of\nwatering or suffering from waterlogged conditions\n1.4\nPrepared for watering/irrigation activity as per instructions\n1.5\nConducted watering/irrigation using the prescribed tools,\nsupplies and equipment and in accordance with standard\npractice\n1.6\nPerformed post-watering/irrigation activity\n2. Required Knowledge\n\n2.1\nProcedures and techniques in watering/irrigation\n2.2\nFunctions, uses and maintenance of tools and equipment for\nefficient watering/irrigation\n2.3\nValues:\n2.3.1\nDiligence\n2.3.2\nTime consciousness\n2.3.3\nCost consciousness\n2.3.4\nHygiene consciousness\n2.3.5\nPersistence\n2.3.6\nSystematic and organized\n3. Required Skills\n3.1\nUse of appropriate tools and equipment and prescribed\nprotective/safety devices in watering/irrigation\n3.2\nCommunication skills in receiving instructions and rendering\neven verbal reports about the completed task\n4. Resource\nImplications\nThe following resources should be provided:\n4.1\nLandscape area/landscape plants\n4.2\nTools and equipment\n4.3\nProtective/safety gadgets\n5. Methods of\nAssessment\nCompetency in this unit must be assessed through:\n5.1\nDirect Observation with Oral Questioning\n5.2\nInterview\n5.3\nPortfolio\n6. Context of\nAssessment\n6.1\nCompetency may be assessed individually in the actual\nworkplace or simulation environment in TESDA accredited\ninstitutions.\n\n--- PDF PAGE 80 ---\nTESDA-SOP-QSO-01-F08\nTR Domestic Work NC II (Amended)\nPromulgated February 2017\n77\nUNIIT OF COMPETENCY :\nCONTROL AND PREVENT PLANT PEST AND DISEASES\n\nUNIT CODE\n:\nAGR611380\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes required to\ndetermine types of pests and diseases and their prevention and\ncontrol measures\n\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Determine\nrequirements of\npreventing and\ncontrolling plant pests\nand diseases\n1.1\nInfested and diseased landscape plants are determined\nbased on plant conditions, symptoms and signs and other\nmanifestation of infestation and infection.\n1.2\nPests and diseases are identified and classified using\ngeneral classification guidelines.\n1.3\nLife cycle or various life stages of pests from eggs, larvae,\npupa and adult and their mode of attack or infestation are\nknown.\n1.4\nLife cycle or various life stages and signs and symptoms of\nplant diseases and their mode of attack are known.\n1.5\nAccess to the site is determined in consultation with\nconcerned persons or authority.\n1.6\nOccupational Health and Safety (OHS) hazards are identified,\nrisks assessed and reported to concerned persons or\nauthority.\n2. Prepare for\napplication of pests\nand disease\nprevention and\ncontrol measures\n\n2.1\nMethod of prevention and control is determined based on\ntypes of pests and diseases, their mode of attack and extent\nof infestation and infection.\n2.2\nTools, equipment, supplies and materials relevant to the\nmethod of prevention and control are prepared.\n2.3\nPrescribed safety and personal protective equipment\n(PPE) is selected in accordance with work requirements.\n3. Apply pest and\ndisease prevention\nand control measures\n3.1\nManual and biological method of prevention and control of\npest and disease are applied whenever applicable.\n3.2\nIn case of using chemical and bio-pesticides, the frequency\nand dosage of application is determined based on types of\npests and diseases and extent of attack and in accordance\nwith LMS or manufacturer’s recommendation.\n3.3\nPest and disease prevention and control measures are\napplied in accordance with to OHS requirements and Fertilizer\nand Pesticide Authority (FPA) guidelines.\n3.4\nTask is performed using prescribed tools, supplies and\nappropriate protective/safety devices.\n4. Perform post-\nprevention and\ncontrol measures\n4.1\nTools and equipment are cleaned, maintained and stored\naccording to LMS.\n4.2\nMaintenance of clean and safe area is undertaken\nthroughout and on completion of work.\n4.3\nWork outputs are recorded and reported to concerned\npersons or authority according to industry practices.\n\n--- PDF PAGE 81 ---\nTESDA-SOP-QSO-01-F08\nTR Domestic Work NC II (Amended)\nPromulgated February 2017\n78\nRANGE OF VARIABLES\n\nVARIABLES\nRANGE\n1. Landscape plants\n\nMay include:\n1.1\nShrubs and hedges\n1.2\nVines\n1.3\nPalms\n1.4\nBamboos\n1.5\nTrees\n2. Plant conditions\nMay include:\n2.1\nAge/Stage of growth\n2.2\nHealthy and vigorous\n2.3\nDiseased/infected:\n2.4\nInfested\n3. Symptoms, signs and\nother manifestations\ndiseases\nMay include:\n3.1\nDiseases\n3.2\nLeaf spots\n3.3\nAnthracnose\n3.4\nFruiting bodies\n3.5\nPresence of hyphae\n3.6\nPests\n3.6.1\nGall on leaves, stems, branches\n3.6.2\nSkeletonized, browsed/chewed leaves\n3.6.3\nWithering, die back etc\n4. Pests and diseases\nMay include:\n4.1\nPests\n4.1.1\nInsect pests: Chewing, Sucking, Girdling/Boring, etc.\n4.1.2\nTermites\n4.1.3\nNematodes\n4.2\nDiseases\n4.2.1\nParasitic fungus\n4.2.2\nBacteria\n4.2.3\nViruses\n5. Methods of prevention\nand control\n\nMay include:\n5.1\nPrevention\n5.1.1\nSpecies/individual (genetically superior) selection\n5.1.2\nPest and disease free\n5.1.3\nCultural management\n5.1.4\nSanitation\n5.2\nControl\n5.3\nManual/mechanical\n5.4\nChemical (systemic, broad spectrum, contact)\n5.5\nBiological- (insects, microorganisms)\n5.6\nBio-pesticides\n6. Tools, supplies and\nequipment\nMay include:\n6.1\nBackpack sprayer\n6.2\nBoom sprayer\n6.3\nSoil drencher\n6.4\nPruning shears,\n6.5\nPruning saws\n7. Protective/safety\ngadgets\nMay include:\n7.1\nOveralls, gloves\n7.2\nGas mask\n7.3\nGoggles\n7.4\nReflectorized vest ( depends on location of work)\n8. Maintenance of clean\nand safe area\nMay include:\n8.1\nKeeping public access paths and roads clear of debris, waste,\ntools and equipment\n8.2\nDisabling tools and equipment after use\n8.3\nUsing signage and barriers where necessary\n8.4\nRemoving debris and waste from the work area\n\n--- PDF PAGE 82 ---\nTESDA-SOP-QSO-01-F08\nTR Domestic Work NC II (Amended)\nPromulgated February 2017\n79\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nDetermined requirements for the prevention and control of\npests and diseases\n1.2\nPrepared for the application of pest and disease prevention\nand control\n1.3\nApplied pest and disease prevention and control measures\n1.4\nConducted post-pest and disease prevention and control\noperations\n1.5\nPerformed tasks using appropriate tools, equipment and\nsafety/protective devices\n2. Required Knowledge\n\n2.1\nTypes of landscape plants, their conditions and stage of\ngrowth\n2.2\nGeneral classification of pests and diseases, life cycle and\nmode of attack\n2.3\nProcedures and techniques in prevention and control of pests\nand diseases\n2.4\nFunctions, uses and maintenance of tools and equipment\n2.5\nValues:\n2.5.1\nDiligence\n2.5.2\nTime consciousness\n2.5.3\nCost consciousness\n2.5.4\nHygiene consciousness\n2.5.5\nPersistence\n2.5.6\nSystematic and organized\n3. Required Skills\n3.1\nUse of appropriate tools and equipment and prescribed\nprotective/safety devices in the prevention and control of\npests and diseases\n3.2\nCommunication skills in receiving instructions and in rendering\nsimple written and even oral reports\n4. Resource\nImplications\nThe following resources should be provided:\n4.1\nLandscape area/landscape plants\n4.2\nTools, equipment, supplies and materials and\nprotective/safety devices\n4.3\nInstructions or guidelines\n5. Methods of\nAssessment\nCompetency in this unit must be assessed through:\n5.1\nDirect Observation with Oral Questioning\n5.2\nInterview\n5.3\nPortfolio\n\n6. Context of\nAssessment\n6.1\nCompetency may be assessed individually in the actual\nworkplace or simulation environment in TESDA accredited\ninstitutions.\n\n--- PDF PAGE 83 ---\nTR Domestic Work NC II (Amended)\nPromulgated February 2017\n80"
