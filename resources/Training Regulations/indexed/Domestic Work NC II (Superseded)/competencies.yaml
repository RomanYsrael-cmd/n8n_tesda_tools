        "source_text": "HCS913402\n\nUNIT DESCRIPTOR\n:\nThis unit of competency covers the responsibilities and\nprocedures required to provide daily care of animals, including\nthe cleaning of animal housing and grooming or cleaning of\nanimals under supervision.\n\nNo licensing, legislative, regulatory or certification requirements\napply to this unit at the time of publication.\n\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Confirm workplace\nanimal care routine\nschedules\n1.1\nDaily, weekly and periodical workplace routine schedules are\nidentified and confirmed with (supervisor) appropriate\nhousehold staff\n1.2\nPersonal workplace responsibilities are clarified.\n1.3\nWorkplace schedule and recording documents are collected\nand updated as required.\n2. Check animals\n2.1\nAnimals under personal responsibility during (shift)\nhousehold work are clarified.\n2.2\nAnimal status is verified via records or verbal reports.\n2.3\nAnimals are counted and basic behavior is noted at beginning\nof (shift) household work.\n2.4\nChanges in animal numbers, behavior or condition are\nreported to (supervisor.) appropriate household staff\n2.5\nAnimals under personal responsibility are checked and status\nreported.\n3. Maintain a clean\nworkplace\n3.1\nFloors benches and other flat areas are cleaned in accordance\nwith workplace (protocols) SOPs.\n3.2\nAnimal housing areas are cleaned in accordance with\nworkplace (protocols) SOPs\n3.3\nWaste and soiled bedding is disposed of in accordance with\nworkplace (protocols.) SOPs.\n3.4\nDamage to housing and equipment is identified and reported.\n3.5\nPost-cleaning procedures are completed.\n4. Complete hygiene\npractices for animals\n4.1\nHygiene control methods for a range of animals are identified\nand practiced.\n4.2\nBasic animal hygiene inspection is performed and cleaning\nneeds of nominated animals are identified.\n4.3\nAnimals are bathed or cleaned under supervision.\n4.4\nGrooming techniques are determined in accordance with\nindividual animal requirements.\n4.5\nAnimals are groomed according to individual needs under\nsupervision.\n5. Complete post-\nhygiene care of\nanimals\n5.1\nAnimals are returned to housing.\n5.2\nWashing equipment is cleaned and stored.\n5.3\nGrooming tools are cleaned, checked and stored.\n5.4\nDamaged tools are reported to (supervisor.) appropriate\nhousehold staff.\n5.5\nSupplies are audited and documented in accordance with\nworkplace procedures.\n5.6\nWorkplace documents are updated as required.\n\n--- PDF PAGE 66 ---\nTESDA-SOP-QSO-01-F08\nTR Domestic Work NC II (Amended)\nPromulgated February 2017\n63\nRANGE OF VARIABLES\nVARIABLES\nRANGE\n1. Workplace routines\nMay include:\n1.1\nAssisting others in completion of tasks within limits of current\nlevel of competence\n1.2\nCatching and handling animals under supervision\n1.3\nChecking animals for signs of distress, illness and injury\n1.4\nChecking security and repair of animal housing, equipment and\ngeneral facility\n1.5\nCleaning and grooming animals under supervision\n1.6\nCleaning and preparation of animal cages, enclosures, exhibits,\ndisplays, general work areas, office, reception and customer\nservice areas\n1.7\nConfirming all animals are in their cages or enclosures\n1.8\nDocumenting work tasks in accordance with workplace\nprocedures\n1.9\nOperating general equipment used to complete workplace\ncleaning routines\n1.10\nPicking up rubbish, removing branches or other unsightly items\nnot part of exhibit or animal housing\n1.11\nReporting animal health concerns to supervisor\n1.12\nStocktaking and re-supply of items\n1.13\nTimeframes for completing tasks.\n2. Animals\nMay include:\n2.1\nAnimals commonly encountered within the industry workplace\nand may cover both native and introduced species\n2.2\nAnimals from the six major animal groups (mammals, birds,\nreptiles, amphibians, fish and invertebrates).\n3. Animal status\nMay include:\n3.1\nCounting animals\n3.2\nObserving and reporting unusual behavior for nominated animal:\n3.3\nAggression or docility (depending on animal)\n3.4\nDisinterest in surroundings, other animals, people or usual\nstimuli\n3.5\nExcessive licking, scratching and rubbing\n3.6\nLethargy\n3.7\nNest building\n3.8\nSelf mutilation\n3.9\nTrembling\n3.10\nVocalizing\n3.11\nObserving and reporting indicators of illness or injury:\n3.11.1 Bleeding\n3.11.2 Changes in drinking or eating patterns\n3.11.3 Lameness or reluctance to move and vocalizing when\nattempting to move\n3.11.4 Swelling\n3.11.5 Unusual amounts, color or texture of feces.\n4. Maintaining a clean\nworkplace\nMay include:\n4.1 Animal housing:\n4.1.1 Adjusting animal housing features according to weather\nand climatic conditions\n4.1.2 Collection and removal of feces\n4.1.3 Completing cleaning routines for sick or quarantined\nanimals to avoid cross-contamination\n4.1.4 Emptying and cleaning water and feeding receptacles\nusing approved cleaning products and methods\n4.1.5 Refilling water containers\n4.1.6 Removing rubbish from housing and surrounding areas\n\n--- PDF PAGE 67 ---\nTESDA-SOP-QSO-01-F08\nTR Domestic Work NC II (Amended)\nPromulgated February 2017\n64\nVARIABLES\nRANGE\n4.1.7 Removing soiled bedding and disposing in approved\narea\n4.1.8 Replacement of housing furniture items, such as\nvegetation and behavior stimulation items under\ndirection of supervisor\n4.1.9 Resetting of clean bedding materials\n4.1.10 Washing down of toilet areas to remove urine and\nfaeces using approved cleaning products and methods\n4.2 General work area cleaning:\n4.2.1 Emptying rubbish bins, picking up general litter within\nthe workplace\n4.2.2 Vacuuming, sweeping, floor cleaning\n4.2.3 Using non-disrupting cleaning methods to control\npotential biohazards, when required\n4.2.4 Washing and wiping down work areas, benches and\nequipment\n4.3 Storing equipment to avoid slip and trip hazards\n4.4 Reporting damaged equipment.\n5. Hygiene control\npractices\nMay include:\n5.1 Aseptic technique\n5.2 Checking animals skin, coat, shell, carapace or other external\nfeatures for:\n5.2.1 Foreign objects such as grass seeds, sticks or other\nvegetation and hardware, such as nails\n5.2.2 General condition\n5.2.3 Signs of coat, skin, shell and carapace shedding\n5.2.4 Signs of damage, including cracks, breaks, splits,\nexudates and, tenderness\n5.2.5 Signs of dirt, feces, food or other items\n5.2.6 Signs of parasites, including presence of eggs, blisters\nor other lesions, rubbed areas of coat, skin texture\nchanges and color changes\n5.3 Completing infection control procedures as required\n5.4 Grooming animals to remove shedding coat or skin, if required, or\nfor general health and wellbeing\n5.5 Isolating potentially contagious or ill animals under supervision\n5.6 Personal hygiene practices especially washing and drying hands\n(e.g. before and after animal contact)\n5.7 Providing housing furnishings to assist animal to complete own\nshedding process\n5.8 Referring to supervisor animals that may require:\n5.8.1 Wound and injury management treatment\n5.8.2 Examination in relation to potential contagious\nconditions\n5.8.3 repairs to shell\n5.9 Use of personal protective equipment\n5.10 Washing animal to remove dirt, foreign objects, parasites and\nother undesirable items.\n6. Workplace documents\nMay include:\n6.1\nAnimal health records\n6.2\nChemical register\n6.3\nDiary, rosters and task completion and timeframe records\n6.4\nEquipment use, damage and repair register\n6.5\nFacility damage and repair register\n6.6\nIncident reports\n6.7\nMessage recording systems\n6.8\nStock control records\n6.9\nSafe operating procedures.\n\n--- PDF PAGE 68 ---\nTESDA-SOP-QSO-01-F08\nTR Domestic Work NC II (Amended)\nPromulgated February 2017\n65\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires that the candidate:\n1.1\nConfirmed animal care routines required, clean and maintain\nanimal housing and related facilities\n1.2\nMaintained animal comfort and health through cleaning and\ngrooming of animals\n1.3\nReported and documented personal animal care duties\n1.4\nMonitored animals and reported issues as required according\nto workplace protocols and procedures.\nThe skills and knowledge required to complete animal care hygiene\nroutines must be transferable to a range of work environments and\ncontexts and include the ability to deal with unplanned events.\n2. Required Knowledge\n2.1\nAnimal care and hygiene principles\n2.2\nAnimal housing cleaning techniques and equipment\n2.3\nAnimal temperaments and behaviors related to the associated\nhazards and risks to animals and staff during animal handling\nand cleaning of housing\n2.4\nBasic animal grooming techniques and equipment\n2.5\nBasic awareness of natural animal behavior relating to the\ncharacteristics of the species, age, health status and social\nneeds\n2.6\nCommon diseases, ailments, injuries and other impacts on\nanimal health and wellbeing\n2.7\nHousing, exercise, social and activity needs of animals\n2.8\nIndicators of poor response to treatment or management of\nyoung, ill, injured or compromised animals\n2.9\nOrganization policies, procedures and requirements, including\nOHS and emergency procedures\n2.10 Principles of animal welfare and ethics\n2.11 Protocols, legal and ethical considerations in documenting\nobservations, measurements, treatments and decisions on\nanimal care\n2.12 Regulations relating to the disposal of hazardous waste\n2.13 Relevant occupational health and safety (OHS) and animal\nwelfare legislative requirements and codes of practice\n2.14 Safe animal handling techniques and procedures\n2.15 Safe use of chemicals and cleaning agents\n2.16 Terminology used to identify animals and describe their\nbehavior\n2.17 Workplace hygiene standards, disinfectants, cleaning agents,\ncleaning techniques and cleaning equipment and materials.\n3. Required Skills\n3.1\nEmploy safe and environmentally responsible organizational\nsystems and procedures when working with animals\n3.2\nIdentify common indicators of the presence of disease injury,\ncompromised health or distress in animals\n3.3\nInterpret and report basic workplace information related to the\ndaily care of animals\n\n--- PDF PAGE 69 ---\nTESDA-SOP-QSO-01-F08\nTR Domestic Work NC II (Amended)\nPromulgated February 2017\n66\n\n3.4\nMaintain the highest standards of hygiene and infection\ncontrol at all times to reduce the risk of infection and cross-\ninfection\n3.5\nObserve, document and report findings on animal health and\nbehavior using workplace protocols and procedures\n3.6\nParticipate in arrangements for maintaining the health and\nsafety of all people and animals in the workplace\n3.7\nPrepare materials, tools and equipment\n3.8\nUse equipment and materials correctly and in accordance with\nmanufacturers' specifications\n3.9\nLiteracy skills to follow sequenced written instructions, and\nrecord information accurately and legibly\n3.10 Oral communication skills/language to fulfill the job role as\nspecified by the organization, including questioning, active\nlistening, asking for clarification and seeking advice from\nsupervisor\n3.11 Numeracy skills to estimate, calculate and record routine\nworkplace measures\n3.12 Interpersonal skills to relate to people from a range of social,\ncultural and ethnic backgrounds and with a range of physical\nand mental abilities\n3.13 Use safe manual handling techniques and/or equipment\n3.14 Use safe waste handling and disposal procedures.\n4. Resource\nImplications\nThe following resources should be provided:\n4.1\nAnimal care work place\n4.2\nMaterials, tools and equipment relevant to the proposed\nactivity or task\n5. Methods of\nAssessment\nCompetency in this unit must be assessed through:\n5.1\nWritten Examination\n5.2\nInterview\n5.3\nDemonstration with questioning\n6. Context of\nAssessment\n6.1 Competency may be assessed in the workplace or in a\nsimulated workplace setting.\n\n--- PDF PAGE 70 ---\nTESDA-SOP-QSO-01-F08\nTR Domestic Work NC II (Amended)\nPromulgated February 2017\n67\nUNIT OF COMPETENCY :\nTRIM AND PRUNE LANDSCAPE PLANTS\n\nUNIT CODE\n:"
