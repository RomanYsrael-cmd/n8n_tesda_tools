          "source_text": "1.  Prepare dining area\n \n1.1\nDining area is checked for cleanliness prior to service in \naccordance with standard operating procedures and when \nrequired, take corrective actions. \n1.2 \nDining environment is prepared and adjusted to ensure \ncomfort and ambience of client and as appropriate. \n1.3 \nFurniture is set up in accordance with standard operating \nprocedures. \n1.4 \nTables and table settings are checked for stability, and easy \naccess to client and at all times. \n1.5 \nEquipment are checked and prepared for service and as per \nSOPs. \n2.  Set-up Table\n \n2.1\nTable cloth is laid without creases and in accordance with \nprescribed procedures. \n2.2 \nTable appointment is laid according to standards. \n2.3 \nNapkin folded in accordance to table napkin folding standards.\n2.4 \nCenterpiece is arranged in accordance with standard \noperating procedures and used appropriate equipment, \nsupplies and materials. \n3.  Serve food and \nbeverage \n3.1\nFoods are checked for completeness and correctness before \nserving. \n3.2 \nFoods are placed on the tray and carried using the left hand \nand in accordance with food and beverage serving \nprocedures. \n3.3 \nFoods are served from the left side using the left hand in \nserving as per SOPs. \n3.4 \nWater goblets are filled/refilled from the right side without \nspilling as per SOPs. \n3.5 \nBeverage are taken from the bar/kitchen and inspected for \ncomplete garnishing (if any). \n3.6 \nBeverage are served on a bar tray from the right side of the \nclient being served as per SOPs. \n4.  Clear table\n \n4.1\nClients are asked politely if they are finished as per SOPs.\n4.2 \nSoiled plates/flat wares are bussed out from the right side of \nthe family members and brought to the washing station/area \nas per SOPs. \n4.3 \nTable is crumbed as per standard operating procedure. \n4.4 \nSide plates and knives are removed from the table as per \nSOPs. \n4.5 \nCondiments/shakers and other soiled items are removed from \nthe table as per SOPs. \n4.6 \nAshtrays are replaced as per SOPs. \n4.7 \nAdditional requests are asked politely from clients as per \nSOPs. \n4.8 \nClients’ needs are checked form time to time until they move \nout from the dining area as per SOPs.\n\n--- PDF PAGE 39 ---\nTESDA-SOP-QSO-01-F08 \nTR Domestic Work NC II (Amended) \nPromulgated February 2017 \n36 \nRANGE OF VARIABLES \n \nVARIABLES \nRANGE \n1.  Dining environment \nMay include: \n1.1 \nLighting \n1.2 \nRoom Temperature \n1.3 \nMusic \n1.4 \nFloral and Other Decorations \n1.5 \nPrivacy \n1.6 \nBackground  \n2.  Equipment \nMay include: \n2.1 \nTable Cloth/Linen \n2.2 \nChina Wares \n2.3 \nGlassware \n2.4 \nSilverware \n2.5 \nCutlery \n2.6 \nWine \n2.7 \nCondiments \n2.8 \nChairs \n2.9 \nTables \n2.10 Ashtray \n2.11 Toothpicks \n2.12 Cloth/Paper Napkin \n3.  Beverage \nMay include: \n3.1 \nJuice \n3.2 \nWine & Spirits \n3.3 \nTea \n3.4 \nCoffee\n\n--- PDF PAGE 40 ---\nTESDA-SOP-QSO-01-F08 \nTR Domestic Work NC II (Amended) \nPromulgated February 2017 \n37"
        },
