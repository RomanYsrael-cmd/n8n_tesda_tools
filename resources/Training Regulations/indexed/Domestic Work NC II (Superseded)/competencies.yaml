nt free clothing cloths\n9.5\nMop head and bucket\n9.6\nDust pan\n9.7\nBroom\n10. Linen\nMay include:\n10.1 Napkins\n10.2 Tablecloths\n10.3 Serving cloths\n10.4 Tea towels\n10.5 Clothing\n10.6 Cleaning cloths\n11. Kitchen appliances\nMay include:\n11.1 Food processor\n11.2 Grill\n11.3 High pressure steamer\n11.4 Microwave oven\n11.5 Oven (electric/gas)\n11.6 Range\n11.7 Refrigerator\n11.8 Tilting skillet\n11.9 Toaster\n11.10 Electric knife\n11.11 Juice maker\n11.12 Rice cooker\n12. Kitchen supplies and\nmaterials\nMay include:\n12.1 All-purpose detergent\n12.2 All-purpose soap\n12.3 Coffee, tea, cream\n12.4 Condiments\n12.5 Disinfectants\n12.6 Drain solvent\n12.7 Food items (dairy, vegetable, bread, meat and fruits)\n12.8 Garbage bag\n12.9 Scouring pad\n12.10 Cooking oil\n12.11 Ingredients\n\n--- PDF PAGE 28 ---\nTESDA-SOP-QSO-01-F08\nTR Domestic Work NC II (Amended)\nPromulgated February 2017\n25\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nCleaned surfaces and floors\n1.2\nCleaned furnishings and fixtures\n1.3\nMade-up beds and cots\n1.4\nCleaned toilets and bathrooms\n1.5\nSanitized rooms\n1.6\nMaintained clean room environment\n1.7\nCleaned kitchen\n\n2. Required Knowledge\n\n2.1\nProcedures in Cleaning, Polishing, Disinfecting and Sanitizing\nRooms (Living Room, Dining Room, Bedrooms, Bathrooms,\nToilets and Kitchen)\n2.2\nTypes and Characteristics of Floors\n2.3\nMethod of Removing Suitable Dirt/Stain\n2.4\nTypes/Uses/Functions of Cleaning Equipment, Supplies and\nMaterials\n2.5\nGlass Types, including defects\n2.6\nMethods of Identifying Stains, Mud, Dirt and Grease\n2.7\nStain Removal Techniques\n2.8\nEffects of Pre-Existing Conditions on Safe Work Practices\n2.9\nProcedures in Arranging Furniture\n2.10 Types and Characteristics of Furniture and Furnishings\n2.11 Procedures in Bed Making\n2.12 Knowledge on Different Linen and Fabric\n2.13 Procedures in Cleaning and Maintaining Room Furniture and\nFurnishings\n2.14 Knowledge on Different Areas Where Dirt and Dust Can\nEasily Accumulate\n2.15 Schedule of House Chores\n2.16 Types of Ancillary Rooms\n2.17 Types of Home Set-Up\n2.18 Types of Living Room Appliances and Ornament\n3. Required Skills\n3.1\nCleaning and Maintaining rooms (living room, bedroom,\nbathroom, toilet and kitchen)\n3.2\nHandling and Disposing of Chemical\n3.3\nReporting and Recording Information\n3.4\nCommunicating with others\n3.5\nMinimizing Waste\n3.6\nDecanting Chemicals\n3.7\nArranging Furniture\n3.8\nMaking-up Beds\n3.9\nEquipment Operation and Cleaning\n3.10 Work Planning and Organization\n3.11 Waste Minimization\n3.12 Decanting Chemicals\n\n--- PDF PAGE 29 ---\nTESDA-SOP-QSO-01-F08\nTR Domestic Work NC II (Amended)\nPromulgated February 2017\n26\n4. Resource\nImplications\nThe following resources should be provided:\n4.1\nCopies of Relevant Standards, Training Books and\nAssessment Planning Guides\n4.2\nAccident Report Forms\n4.3\nJob Specifications and Reporting Forms\n4.4\nAccess to a Suitable Venue\n4.5\nManufacturer/Enterprise Product Specifications\n4.6\nA range of equipment, including personal protective\nequipment and relevant cleaning or spot removing chemicals\n4.7\nMaterial safety data sheets and equipment operating manuals,\nif relevant\n4.8\nAccess to a registered provider of assessment services\n4.9\nChemical Color Charts\n5. Methods of\nAssessment\nCompetency in this unit must be assessed through:\n5.1\nWritten Test/Examination\n5.2\nDemonstration with questioning\n5.3\nObservation with questioning\n5.4\nOral Questioning/Interview\n5.5\nPortfolio Assessment\n6. Context of\nAssessment\n6.1\nCompetency may be assessed in the workplace or in a\nsimulated work setting.\n\n--- PDF PAGE 30 ---\nTESDA-SOP-QSO-01-F08\nTR Domestic Work NC II (Amended)\nPromulgated February 2017\n27\nUNIT OF COMPETENCY :\nWASH AND IRON CLOTHES, LINEN AND FABRIC\n\nUNIT CODE\n:\nHCS913302\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes in washing and\nironing clothes, linen and fabric. It includes checking and sorting\nsoiled clothes, linen and fabric, removing stains, preparing washing\nequipment and supplies, performing laundry, drying and ironing\nclothes, linen and fabric.\n\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Check and sort\nclothes, linens and\nfabrics\n1.1\nSoiled clothes, linen and fabrics are sorted according to texture,\ncolor, size and defects.\n1.2\nSorted items are prioritized according to the cleaning process\nrequired ad the urgency of the item.\n1.3\nDefective clothing, linen and fabric are sewn/darned using\nappropriate threads and stitches.\n2. Remove stains\n2.1\nPersonal protective paraphernalia are worn in accordance with\nstandard operating procedures (SOPs).\n2.2\nStain removing agents and chemicals are used in accordance\nwith manufacturer’s instruction.\n2.3\nStains are treated and removed using correct chemicals or\nagents.\n2.4\nAll stain removing agents and chemicals are stored following\nsafety procedures.\n3. Prepare washing\nequipment and\nsupplies\n\n3.1\nLaundry area is cleaned and made ready at all times.\n3.2\nLaundry supplies and materials are prepared and made\navailable at all times.\n3.3\nWashing machine is checked and prepared for operation per\nmanual procedures.\n4. Perform laundry\n\n4.1\nCorrect laundry method is selected as per SOPs.\n4.2\nClothes, linen and fabric are washed according to the labeling\ncodes and washing instructions.\n4.3\nLaundry equipment is used in accordance with manufacturer’s\ninstruction.\n4.4\nClothes, linen and fabric are freed from stain, dirt and unpleasant\nodor after washing based on procedures.\n4.5\nWashed clothes, linen and fabric are sun-dried/machine dried as\nper instructions.\n4.6\nDried clothes, linen and fabric are freed from unpleasant odor\nand static cling.\n4.7\nWashing area is cleaned in accordance with safety and health\nprocedures.\n4.8\nEquipment is cleaned after use in accordance with\nmanufacturer’s instructions.\n4.9\nAll cleaning materials and equipment are stored following safety\nprocedures.\n4.10\nRoutine maintenance is carried out or arranged as per standard\noperating procedures.\n5. Dry clothes, linen and\nfabric\n\n5.1\nWashed clothes, linen and fabric are dried according to\nprocedures.\n5.2\nDrying machine is prepared according to procedure.\n5.3\nDried clothes, linen and fabric are removed when dryer bell rings\nor stops to prevent wrinkles and to minimize need for ironing.\n5.4\nClothes, linen and fabric are dried without wrinkles according to\nprocedures.\n6. Iron clothes, linens\nand fabrics\n\n6.1\nIroning is done in accordance to the standard procedures.\n6.2\nIroned clothes, linens and fabrics are folded, placed in a hanger\nand stored in designated cabinets as per instructions.\n6.3\nIroning equipment and materials are stored in the appropriate\narea following safety procedures.\n\n--- PDF PAGE 31 ---\nTESDA-SOP-QSO-01-F08\nTR Domestic Work NC II (Amended)\nPromulgated February 2017\n28\nRANGE OF VARIABLES\n\nVARIABLES\nRANGE\n1. Sorted Items\nMay include:\n1.1\nSoiled/Defective Clothes\n1.2\nLinen\n1.3\nFabrics\n2. Personal Protective\nParaphernalia\nMay include:\n2.1\nGloves\n2.2\nApron\n3. Stains\nMay include:\n3.1\nCoffee\n3.2\nCola\n3.3\nCordial\n3.4\nChewing Gum\n3.5\nFood\n3.6\nMud/Dirt\n3.7\nGrease\n3.8\nBlood\n3.9\nFruit Stains\n3.10 Wine\n4. Stain Removers\nMay include:\n4.1\nAcid Cleaners\n4.2\nAlkali Cleaners\n4.3\nChlorine Bleach\n4.4\nAll-Purpose Detergent\n5. Laundry Area\nMay include:\n5.1\nWashers\n5.2\nDryers\n5.3\nClothesline\n5.4\nClothes Pins\n5.5\nClothespin Bag\n5.6\nClothes Rack for Indoor Drying\n6. Laundry Supplies and\nMaterials\nMay include:\n6.1\nSorting Baskets/Shelves\n6.2\nHangers\n6.3\nStain Removing Agents\n6.4\nFabric Softener\n6.5\nChlorine Bleach\n6.6\nLaundry Bag\n6.7\nLaundry Basket\n\n--- PDF PAGE 32 ---\nTESDA-SOP-QSO-01-F08\nTR 