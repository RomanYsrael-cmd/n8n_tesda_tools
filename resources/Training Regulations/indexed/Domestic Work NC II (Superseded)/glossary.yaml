      "definition": "TR Domestic Work NC II (Amended) Promulgated February 2017 106 25. Linen – traditionally a cloth made from flax fiber but now, it is used to indicate sheets, pillow cases, washcloths, cloth bath mats, towels, tablecloths and napkins. 26. Marinade – a method used in cooking to flavor and moisten foods, may be liquid or dry. Liquid marinades are usually based on acidic ingredients such as wine or vinegar. Dry marinades are usually salt-based. 27. Menu – a list of the chef’s dishes. A list in specific order of the dishes to be served at a given time. 28. Mise en place – French phrase meaning “everything in its place”; a state of overall preparedness, having all the necessary ingredients and cooking utensils at hand ready to use at the moment work on a dish begins. 29. Microwave – a method of meat transfer in which electro-magnetic waves generated by a device called a magnetron penetrate food and cause the water molecules in it to oscillate. 30. Mince – to chop into small pieces. 31. Panbroil – a cooking method similar to dry sautéing that simulates broiling by cooking an item in a hot pan with little or no fat. 32. Panfry – a cooking method in which items are cooked in deep fat in a skillet over medium heat; this generally involves more fat than sautéing or stir-frying but less than deep-frying. 33. Poach – a method in which items are cooked gently in simmering liquid. 34. Pressure Steamer – a machine that steams food by heating water under pressure in a sealed compartment, allowing the steam to reach higher-than-boiling temperature. The food is placed in a sealer chamber that cannot be opened until the pressure has released and the steam properly vented from the chamber. 35. Roast – a dry heat cooking method in which items are cooked in an oven or on a spit over a fire. 36. Sanitizer – a sanitizing substance or product. To sanitize is to prevent the spread of disease. 37. Saute’ - a cooking method in which items are cooked quickly in a small amount in fat in a pan on the range top. 38. Silverware – tableware made of solid silver, silver glit or silver metal; silver plate made from single strip of plated metal. 39. Simmer – to maintain the temperature of a liquid just below boiling. Also, a cooking method in which items are cooked in a simmering liquid. 40. Spirits – are drinks obtained by distillation after fermentation from vegetables, grains, fruits, plants and other substance with sugar or starch-based. 41. Squeegee – a cleaning instrument with rubber blade used for cleaning glass windows and panels. 42. Steaming – a cooking method in which items are cooked in a vapor by boiling water or other liquids. 43. Step Ladder – used to reach high objects. 44. Stew – a cooking method nearly identical to braising but generally involving smaller pieces of meat and hence a shorter cooking time. Stewed items also may be blanched, rather than seared, to give the finished product a pale color. Also a dish prepared by using the stewing method."
