      "definition": "Alcohol – naturally occurring and easily synthesized compound that induces intoxication when consumed. 2. Ambiance – the combined atmosphere created by the décor, lighting, service, possible environment (such as background music) and song, that enhances the dining or lodging experience. 3. Barbecue – a cooking method involving grilling food over a wood or charcoal fire. Usually some sort of rub, marinade or sauce is burdened on the item before or during cooking. 4. Bed and Bath Linen – items such as sheets, pillow cases, hand towels, bath towels, washcloths and cloth bath mats. 5. Beddings – all bed linens such as sheets and pillow cases and all blankets, shams, dust raffles, pillows, quilts, comforters, coverlets, mattress pads and bed spreads. 6. Blanch – to cook an item briefly in boiling water or hot fat before finishing or storing it. 7. Boil – a cooking method in which items are immersed in liquid at or above the boiling point. 8. Braise – a cooking method in which the main item, usually meat, is seared in fat, then simmered in stock to another liquid in a covered vessel. 9. Broil – a cooking method in which items are cooked by a radiant heat source placed above the food, usually in a broiler. 10. Carpet Sweeper – a handy type of sweeper used to pick-up dirt and particles from the carpet surface. 11. Chop – to cut into pieces of roughly the same size. Also, a small cut of meat including part of the rib. 12. Cuisine – food cooked and served in styles from around the world. 13. Cutlery – refers to knives and other cutting implements. 14. Deep Fry – a cooking method in which foods are cooked by immersion in hot fat; deep fried foods are often coated with breadcrumbs or butter before being cooked. 15. Detergent – a chemical that acts like a soap and is used for cleaning numerous surfaces. Detergents can be used effectively in hard water where ordinary soap not produce suds and will leave a residue. 16. Dice – to cut ingredients into small cubes (1/4 inches for small, 1/3 for medium, ¾ inch for large). 17. Disinfectant – a substance or means used to destroy pathogenic microorganisms. 18. Disinfection – a condition existing when infectious material or infection/s are removed. 19. Fillet – a boneless cut of meat, fish or poultry. 20. Flatware – it denotes all forms of spoons and forks. 21. Furniture, Fixtures & Eqpt. (FFE) – classification of fixed assets that have specified depreciable lives, usually ranging from three to seven years. 22. Garnish – an ingredient that decorates, accompanies or completes a dish. Many dishes are identified by the name of their garnishes. 23. Grill – a cooking technique in which foods are cooked by a radiant heat source placed below the food. Also, the piece of equipment on which grilling is done. 24. Housekeeping – refers to cleaning and sanitizing rooms."
