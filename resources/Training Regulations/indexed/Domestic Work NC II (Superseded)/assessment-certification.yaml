  "source_text": "SECTION 4 ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1\nTo attain the National Qualification of DOMESTIC WORK NC II, the candidate must\ndemonstrate competence through project-type assessment covering all units listed in\nSection 1. Successful candidates shall be awarded a National Certificate signed by\nthe TESDA Director General.\n\n4.2\nThe qualification of DOMESTIC WORK NC II may be attained through –\n\n4.2.1 Accumulation of Certificates of Competency (COCs) in the following areas –\n4.2.1.1\nClean living room, dining room, bedrooms, toilet and kitchen\n4.2.1.2\nWash and iron clothes, linen and fabric\n4.2.1.3\nPrepare hot and cold meals/food\n4.2.1.4\nProvide food and beverage service\n4.2.2 Demonstration of competence through project-type assessment covering all\nrequired units of qualification.\n\n4.2.3 Depending on specific employer/workplace requirements, the candidate may\nchoose one or more from the following groups of elective competencies. Each\ngroup will lead to the issuance of Certificate of Competency (COC).\n\n4.2.3.1\nProviding care and support for infants, toddlers and children\n•\nProvide care and support to infants/toddlers\n•\nProvide care and support to children\n•\nFoster, social, intellectual, creative and emotional development\nof children\n•\nFoster the physical development of children\n•\nMaintain healthy and safe environment\n•\nRespond to emergency\n•\nClean living room, dining room, bedrooms, toilet and bathroom\n•\nWash and iron clothes, linen and fabric\n•\nPrepare hot and cold meals\n\n* Holders of unexpired Caregiving NCII or COC in providing care and\nsupport for infants, toddlers and children shall be exempted from this\nrequirement.\n\n4.2.3.2\nProviding care and support for the elderly and people with\nspecial needs\n•\nProvide care and support to elderly\n•\nProvide care and support to people with special needs\n•\nMaintain healthy and safe environment\n•\nRespond to emergency\n•\nClean living room, dining room, bedrooms, toilet and bathroom\n•\nWash and iron clothes, linen and fabric\n•\nPrepare hot and cold meals\n\n* Holders of unexpired Caregiving NCII or COC in providing care and\nsupport for the elderly and people with special needs shall be\nexempted from this requirement.\n\n--- PDF PAGE 106 ---\nTR Domestic Work NC II (Amended)\nPromulgated February 2017\n103\n4.2.3.3\nProvide care for animals\n•\nAssist in the care of animals\n•\nProvide animal care hygiene routines\n\n4.2.3.4\nMaintain plants and gardens\n•\nTrim and prune landscape plants\n•\nPerform weeding and cultivation\n•\nWater/irrigate plants\n•\nControl and prevent plant pest and diseases\n\n* Holders of unexpired Landscape NCII or COC in maintaining\nlandscape area (soft scape) and shall be exempted from this\nrequirement.\n\n4.3\nAssessment shall focus on the units of competency. The basic and common units shall\nbe integrated or assessed concurrently with the core units.\n\n4.4\nThe following are qualified to apply for assessment and certification:\n\n4.4.1 Graduates of formal, non-formal and informal including enterprise-based\ntraining programs.\n\n4.4.2 Experienced workers (wage employed or self-employed).\n\n4.5\nReassessment for a National Certificate shall be done only on the task/s that the\ncandidate did not successfully achieve.\n\n4.6\nA candidate who fails the assessment for two (2) consecutive times will be required to\ngo through a refresher course before taking another assessment.\n\n4.7\nOnly certified individuals in this Qualification may be nominated by the industry sector\nfor accreditation as competency assessor.\n\n4.8\nOnly accredited competency assessors are allowed to conduct competency\nassessment, however trainers who are accredited competency assessors are not\nallowed to assess their trainees.\n\n4.9\nAssessment of competence must be undertaken only in the TESDA accredited\nassessment center. The performance assessment (demonstration of competence),\nhowever, may be done in any venue or workplace duly designated by an accredited\nassessment center.\n\n4.10 The guidelines on assessment and certification are discussed in detail in the\nProcedures Manual on Assessment and Certification.\n\n--- PDF PAGE 107 ---\nTR Domestic Work NC II (Amended)\nPromulgated February 2017\n104\n\nCOMMON\nCOMPETENCIES\nCORE\nCOMPETENCIES\n"
}
