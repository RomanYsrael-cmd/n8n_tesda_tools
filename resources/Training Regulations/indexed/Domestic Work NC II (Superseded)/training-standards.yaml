 5 m.\n15 sq. m.\n15 sq. m.\nFacilities/Equipment/ Circulation\nArea\n6 x 4 m.\n24 sq. m.\n24 sq. m.\n\n3.6\nTRAINER’S QUALIFICATIONS FOR DOMESTIC WORK NC II\nDOMESTIC WORK – NC II\n\nTRAINER QUALIFICATION\n• Must be a holder of NTTC Level I in Domestic Work NC II\n• Must be able to communicate in English and Filipino/vernacular\n• Must have at least two (2) years job/industry experience*\n*Optional\n\n3.7\nINSTITUTIONAL ASSESSMENT\n\nInstitutional assessment is undertaken by trainees to determine their achievement of units\nof competency. A certificate of achievement is issued for each unit of competency.\n\n--- PDF PAGE 105 ---\nTR Domestic Work NC II (Amended)\nPromulgated February 2017\n102"
