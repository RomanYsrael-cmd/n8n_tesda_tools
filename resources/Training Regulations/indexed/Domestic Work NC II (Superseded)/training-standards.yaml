      "source_text": "SECTION 3 TRAINING ARRANGEMENTS\n\nThis set of standards provides Technical and Vocational Education and Training (TVET)\nproviders with information and other important requirements to consider when designing training\nprograms for Domestic Work NC II.\n\nThis includes information on curriculum design; training delivery; trainee entry requirements;\ntools and equipment; training facilities; and trainer’s qualification and institutional assessment.\n\n3.1 CURRICULUM DESIGN\n\nCourse Title : DOMESTIC WORK\nNC Level: NC II\n\nNominal Duration : Basic\n 20 hrs.\nCommon\n 40 hrs.\nCore\n158 hrs.\nElective\n496 hrs.\nTotal\n 714 hrs.\n\nCourse Description:\n\nThis course is designed to enhance the knowledge, skills and attitude of household workers in\naccordance with industry standards. It covers the basic, common and core competencies on\ncleaning living room, dining room, bedrooms, toilet and kitchen, washing and ironing clothes, linen\nand fabric, preparing hot and cold meals/food, and providing food and beverage service.\n\nThis\nincludes\ncommon\ncompetencies:\nmaintain\nan\neffective\nrelationship\nwith\nclients/customers, and manage own performance. It also includes basic competencies such as,\nparticipate in workplace communication, work in a team environment, practice career\nprofessionalism, and practice occupational health and safety procedures. The common\ncompetency –Maintain an effective relationship with clients and customers has been\ncontextualized to include the provisions of Kasambahay law, e.g. standard employment contract,\nrights and privileges, pre-employment requirements, working conditions, barangay registrations,\nsocial and other benefits, etc.\n\nIt also has ten (10) elective competencies as indicated below:\n1.\nProvide care and support to infants and toddlers (50 Hrs)\n2.\nProvide care and support to children (50 Hrs)\n3.\nProvide care and support to elderly (150 Hrs)\n4.\nProvide care and support to people with special needs (150 Hrs)\n5.\nAssist in the care of animals (20 Hrs)\n6.\nProvide animal care hygiene routines (20 Hrs)\n7.\nTrim and Prune landscape plants (15 Hrs)\n8.\nPerform weeding and cultivation (15 Hrs)\n9.\nWater/irrigate plants (12 Hrs)\n10. Control and prevent plant pest and diseases (14 Hrs)\n\nThe Elective competencies are additional core units of competencies that are useful but not\nabsolutely necessary for enhancing the mobility/employability of a person. These competencies\nare considered important in the performance of the job and may be drawn from among the units\nof competency in the TRs promulgated for other sectors.\n\nThese Elective Competencies where selected from the core units of competencies from the\nexisting WTR in Caregiving and Landscape Installation and Maintenance (Softscape) and\none (1) NTR on Animal Care with two (2) units of competencies by the Technical Experts invited\n\n--- PDF PAGE 84 ---\nTR Domestic Work NC II (Amended)\nPromulgated February 2017\n81\nduring the development of the Training Regulation and Competency-Based Curriculum for the\nDomestic Work NC II.\n\nElective\ncompetencies\nare\nnot\nmandatory\nfor\nprogram\nregistration.\nTVET\nInstitutions/Training Providers may opt to offer one or two or more competencies if they have the\navailable resources and facilities.\n\n--- PDF PAGE 85 ---\nTR Domestic Work NC II (Amended)\nPromulgated February 2017\n82\nBASIC COMPETENCIES\n(20 Hours)\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and convey\nworkplace information\n1.2 Complete relevant work\nrelated documents\n1.3 Participate in workplace\nmeeting and discussion\n• Group\ndiscussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n2. Work in a team\nenvironment\n2.1 Describe and identify team\nrole and responsibility in a\nteam\n2.2 Describe work as a team\nmember\n• Discussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n3. Practice career\nprofessionalism\n3.1 Integrate personal objectives\nwith organizational goals\n3.2 Set and meet work priorities\n3.3 Maintain professional growth\nand development\n• Discussion\n• Interaction\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n4. Practice\noccupational\nhealth and safety\n4.1 Evaluate hazard and risks\n4.2 Control hazards and risks\n4.3 Maintain occupational health\nand safety awareness\n• Discussion\n• Plant tour\n• Symposium\n• Observation\n• Interview\n\nCOMMON COMPETENCIES\n(40 Hours)\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Maintain an\neffective\nrelationship with\nclients/\ncustomers\n1.1 Maintain a professional\nimage\n1.2 Build credibility to meet\ncustomers/clients\nrequirements\n\n• Group\ndiscussion\n• Lecture\n• Role Playing\n• Simulation\n• Written\nExamination\n• Demonstration\n• Observation\n2. Manage own\nperformance\n2.1 Plan completion of own\nworkload\n2.2 Maintain quality of own\nperformance\n\n• Group\ndiscussion\n• Lecture\n• Role Playing\n• Simulation\n• Written\nExamination\n• Demonstration\n• Observation\n\n--- PDF PAGE 86 ---\nTR Domestic Work NC II (Amended)\nPromulgated February 2017\n83\nCORE COMPETENCIES\n(158 Hours)\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Clean living\nroom, dining\nroom, bedrooms,\ntoilet and kitchen\n\n1.1\nUse of appropriate cleaning\nequipment, supplies and\nmaterials\n1.2 Clean surfaces, floors, furniture\nand fixtures\n1.3 Make up beds and cots\n1.4 Clean toilet and bathroom\n1.5 Clean kitchen area,\nutensils/table appointments and\nkitchen appliances\n1.6 Provide supplies for dining\nroom, living room, bedroom and\nbathroom/toilet\n1.7 Maintain clean and sanitize\nroom environment\n•Lecture/\nDemonstration\n•Written\nExamination\n• Demonstration\n• Observation\n\n2. Wash and iron\nclothes linen and\nfabric\n2.1\nCheck and sort soiled clothes,\nlinen and fabric\n2.2 Prepare washing equipment and\nsupplies\n2.3 Perform laundry\n2.4 Dry clothes, linen and fabric\n2.5 Iron clothes, linen and fabric\n2.6 Maintain regular housekeeping\nand maintenance of laundry\narea and equipment\n•Lecture/\nDemonstration\n•Written\nExamination\n• Demonstration\n• Observation\n\n3. Prepare hot and\ncold meals/food\n3.1\nPrepare ingredients according\nto recipes\n3.2 Check “Mise en Place”\n3.3 Cook soup as per menu\n3.4 Cook vegetable dishes as per\nrecipe\n3.5 Cook meat/poultry, fish/ seafood\ndishes as per culinary method\n3.6 Cook egg dishes as per client’s\npreference\n3.7 Cook pasta, grain and\nfarinaceous dishes as per recipe\n3.8 Garnish cooked dishes\n3.9 Prepare appetizers as per\nrequirement or client’s\npreference\n3.10 Prepare sauces as per recipe\n3.11 Prepare cold desserts\n3.12 Prepare pastry desserts\n3.13 Prepare sandwiches\n3.14 Store dry and liquid ingredients\n•Lecture/\nDemonstration\n•Written\nExamination\n• Demonstration\n• Observation\n\n4. Provide food and\nbeverage service\n4.1\nPrepare dining area\n4.2 Set-up table\n4.3 Serve food and beverage\n4.4 Clear table\n•Lecture/\nDemonstration\n•Written\nExamination\n• Demonstration\n• Observation\n\n--- PDF PAGE 87 ---\nTR Domestic Work NC II (Amended)\nPromulgated February 2017\n84\nELECTIVE COMPETENCIES\n(496 Hours)\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Provide care\nand support to\ninfants and\ntoddlers\n(50 hrs.)\n1.1\nExplain the concepts and\nprinciples of caring, growth\nand development of\ninfants/toddlers\n•Discussion\n• Demonstration\n\n•Questioning\n• Demonstration\n• Observation\n\n1.2\nPrepare infants / toddlers for\ntaking vital signs, bathing and\ndressing\n1.3\nClean, sterilize feeding bottles\nand prepare milk formula\n1.4\nPrepare and introduce\nadequate nutrition and semi-\nsolid food.\n1.5\nPrepare infant / toddlers crib.\n2. Provide care\nand support to\nchildren\n(50 hrs.)\n2.1\nExplain the importance of\ninstilling personal hygiene\npractices to children crib.\n•Discussion\n• Demonstration\n• Brainstorming\n•Demonstration\n• Observation\n• Questioning\n2.2\nMaintain children’s\nparaphernalia\n2.3\nPrepare children for taking\nvital sign, bathing and\ndressing\n2.4\nPerform after care activities\nfor materials and\nparaphernalia\n2.5\nDetermine nutritional food\nrequirements of children\n3. Provide care\nand support to\nelderly\n(150 hrs.)\n3.1\nExplain the concepts and\nprinciples of basic nursing\ncare of the elderly\n•Discussion\n• Demonstration\n•Brainstorming\n•Questioning\n• Written exam\n•Demonstration\n3.2\nIdentify appropriate physical,\nemotional, spiritual and\nintellectual needs.\n\n3.3\nProvide assistance in\npromoting the appropriate\nneeds for roles,\nresponsibilities, rights,\nfreedom and activities of\nelderly.\n3.4\nProvide adequate nutrition\nand elimination\n4. Provide care\nand support to\npeople with\nspecial needs\n(150 hrs.)\n4.1\nIdentify and explain the needs\nof people with special needs\n•Discussion\n• Demonstration\n•Questioning\n• Written exam\n• Demonstration\n4.2\nIdentify personal care and\nassistance needed for daily\nliving\n4.3\nEstablish and maintain\nappropriate relationship\n4.4\nProvide appropriate support\nfor people with special needs\n4.5\nAssist in oral and written\ncommunication\n4.6\nProvide adequate nutrition\nand elimination for people\nwith special needs\n\n--- PDF PAGE 88 ---\nTR Domestic Work NC II (Amended)\nPromulgated February 2017\n85\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n5. Assist in the\ncare of animals\n(20 hrs.)\n5.1\nExplore workplace activities\nand basic terminology\n•Discussion\n• Demonstration\n•Questioning\n• Written exam\n• Demonstration\n5.2\nMaintain a clean workplace\n5.3\nPrepare for feeding\n5.4\nFeeding animals\n5.5\nReport basic animal behavior\nand health status\n6. Provide animal\ncare hygiene\nroutines\n(20 hrs.)\n6.1\nConfirm workplace 