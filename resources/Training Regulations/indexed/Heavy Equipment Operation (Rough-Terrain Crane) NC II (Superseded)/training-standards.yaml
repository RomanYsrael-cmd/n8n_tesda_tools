form basic\npreventive\nmaintenance\n5.3 Sharpen edge and\ntooth cutting tools\n5.4 Store tools and\nequipment\nAudio Visual\nSimulation\nDiscussion\nPractical Lab\nDemonstration\n• Direct observation\nof application of\ntasks\n• Oral questioning\n• Written test or\nexamination\n• Third party report\n• Demonstration\n\n--- PDF PAGE 67 ---\nTR HEAVY-EQUIPMENT OPERATION (Rough-Terrain Crane) NC II Promulgated July 2007\nPage 66 of 79\n\nCORE COMPETENCIES\n\nCourse Title\n: HEAVY EQUIPMENT OPERATION Level: NC II\n\n ROUGH-TERRAIN CRANE\n\nNominal Training Hours:\n120 Hours\n\nCourse Description:\n\nThis course is designed to enhance knowledge, desirable attitudes and\nskills in the use of rough-terrain crane in accordance with industry standards. It\ncovers core competencies such as: performing pre- and post-operation\nprocedures, performing productive operation, and performing basic preventive-\nmaintenance servicing on a given rough-terrain crane.\n\nTo obtain this, all units prescribed for this qualification must be achieved:\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Perform pre- and\npost-operation\nprocedures for\nRough-terrain Crane\n\n1.1 Identify rough-terrain\ncrane types /\ncomponents parts\n1.2 Perform visual check of\nequipment\n1.3 Check BLOWAF of\nrough-terrain crane\n1.10.1 Battery\n1.3.2 Light\n1.3.3 Oil\n1.3.4 Water\n1.3.5 Air\n1.3.6 Fuel\n1.4 Check rough-terrain\ncrane system operation\n1.5 Check safety devices\naccessories\n1.6 Perform post operation\ncheck\nLecture\nPractical /\nDemonstration\n\n• Observation\nand oral\nquestioning\n• Demonstration\nand oral\nquestioning\n• Written test\n\n--- PDF PAGE 68 ---\nTR HEAVY-EQUIPMENT OPERATION (Rough-Terrain Crane) NC II Promulgated July 2007\nPage 67 of 79\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n2. Perform productive\noperation for\nRough-terrain\nCrane\n\n2.1 Perform loading\n and unloading of\n rough-terrain\n crane to trailer\n (low bed)\n2.2 Perform rough-\n terrain crane\n application\n2.2.1 travel\n2.2.2 position the\n crane\n2.2.3 lifting and\ntransferring\nLecture\nPractical /\nDemonstration\n\n• Observation\nand oral\nquestioning\n• Demonstration\nand oral\nquestioning\n• Written test\n3. Perform basic\nmaintenance\nservicing for\nRough-terrain\nCrane\n\n3.1 Perform safety\n practices, and\n housekeeping\n3.2 Perform preventive\n maintenance and\n servicing\n\nLecture\nPractical /\ndemonstration\n\n• Observation\nand oral\nquestioning\n• Demonstration\nand oral\nquestioning\n• Written test\n\n--- PDF PAGE 69 ---\nTR HEAVY-EQUIPMENT OPERATION (Rough-Terrain Crane) NC II Promulgated July 2007\nPage 68 of 79\n\n3.2\nTRAINING DELIVERY\n\nThe delivery of training should adhere to the design of the curriculum.\nDelivery should be guided by the 10 basic principles of competency-based TVET.\n\n• The training is based on curriculum developed from the\ncompetency standards;\n• Learning is modular in its structure;\n• Training delivery is individualized and self-paced;\n• Training is based on work that must be performed;\n• Training materials are directly related to the competency standards\nand the curriculum modules;\n• Assessment is based in the collection of evidence of the\nperformance of work to the industry required standard;\n• Training is based both on and off-the-job components;\n• Allows for recognition of prior learning (RPL) or current\ncompetencies;\n• Training allows for multiple entry and exit; and\n• Approved training programs are nationally accredited.\n\nThe competency-based TVET system recognizes various types of delivery\nmodes, both on and off-the-job as long as the learning is driven by the\ncompetency standards specified by the industry. The following training modalities\nmay be adopted when designing training programs:\n\n• The dualized mode of training delivery is preferred and\nrecommended. Thus programs would contain both in-school and in-\nindustry training or fieldwork components. Details can be referred to\nthe Dual Training System (DTS) Implementing Rules and\nRegulations.\n• Modular/self-paced learning is a competency-based training\nmodality wherein the trainee is allowed to progress at his own pace.\nThe trainer facilitates the training delivery\n• Peer teaching/mentoring is a training modality wherein fast learners\nare given the opportunity to assist the slow learners.\n\n--- PDF PAGE 70 ---\nTR HEAVY-EQUIPMENT OPERATION (Rough-Terrain Crane) NC II Promulgated July 2007\nPage 69 of 79\n\n• Supervised industry training or on-the-job training is an approach in\ntraining designed to enhance the knowledge and skills of the\ntrainee through actual experience in the workplace to acquire\nspecific competencies prescribed in the training regulations.\n• Distance learning is a formal education process in which majority of\nthe instruction occurs when the students and instructor are not in\nthe same place. Distance learning may employ correspondence\nstudy, or audio, video or computer technologies.\n\n3.3\n TRAINEE ENTRY REQUIREMENTS\n\nThis section specifies the qualifications of trainees and educational\nexperience. Other requirements like health and physical requirements may also\nbe stated. Passing written entrance examinations may also be indicated if\nnecessary.\n\n• Can communicate both orally and in writing\n\n• Physically and mentally fit\n\n• With good moral character\n\n• Can perform basic mathematical computations.\n\n--- PDF PAGE 71 ---\nTR HEAVY-EQUIPMENT OPERATION (Rough-Terrain Crane) NC II Promulgated July 2007\nPage 70 of 79\n\n3.4\nLIST OF TOOLS, EQUIPMENT AND MATERIALS\n\nRecommended list of tools, equipment and materials for the training of 25\ntrainees for the operation of rough-terrain crane.\n\nTOOLS\nEQUIPMENT\nMATERIALS\nQTY\nQTY\nQTY\n1 set\n• Wrenches (box and\nopen-end 8-24 mm-\nmetric & 7/16 –1” -\nEnglish )\n1 unit • Rough –terrain\nCrane (MOA\n/rental)\n5 kls\n• Multi- purpose\ngrease\n1 set\n• Hammer ballpeen\n(3-4 lbs)\n1 unit • Low bed trailer\nwith tractor head &\noperator\n(MOA/rental)\n4\nliters\n• Engine oil (\nSAE 15w40)\n1 set\n• Pliers( mechanical 10\n“)\n1 unit • Vacuum cleaner\n20\nliters\n• Hydraulic /\nsteering fluid\n(TELLUS\n68/10W)\n1 pc\n\n• Adjustable wrench\n(18 “)\n 1 unit\n• Portable electric\n air compressor\n10\nliters\n• Final drive/\ndifferential\n(gear oil GP90/\n140)\n1 pc\n• Grease gun\n\n10\nliters\n• Transmission\n oil (ATF)\n1 set\n• Screw driver ( 10 “\n flat & Philips)\n\n4\nliters\n• Water coolant\n1 pc\n•\n Putty\nknife\n\n200\nliters\n• Diesel fuel\n1 pc\n• Pry bar (heavy\n duty)\n\n5\nliters\n• Battery\n distilled\n water\n\n1 set\n• Primary &\nsecondary\n air filter\n\n1 pair\n• Working\n clothes\n\n10\npairs\n• Safety shoes\n\n10\npairs\n• Gloves\n\n--- PDF PAGE 72 ---\nTR HEAVY-EQUIPMENT OPERATION (Rough-Terrain Crane) NC II Promulgated July 2007\nPage 71 of 79\n\nTOOLS\nEQUIPMENT\nMATERIALS\nQTY\nQTY\nQTY\n\n10\npcs\n• Goggles\n\n10\npcs\n• Dust Mask\n\n10\npcs\n• Hard hat\n\n2\nunits\n• Test weights\n- 3 tons\n - 10 tons\n\n1 pc\n• Crawler Crane\nminiture\n\n1 pc\n• Operator’s\nmanual with\nload chart\n\n--- PDF PAGE 73 ---\nTR HEAVY-EQUIPMENT OPERATION (Rough-Terrain Crane) NC II Promulgated July 2007\nPage 72 of 79\n\n3.5 TRAINING FACILITIES\n\nThe rough-terrain crane operation workshop must be of concrete\nstructure. Based on class size of 25 students/trainees the space requirements\nfor the teaching/learning and circulation areas are as follows:\n\nSPACE REQUIREMENT\nSIZE IN METERS\nAREA IN SQ.\nMETERS\nTOTAL AREA\nIN SQ.\nMETERS\n• Student/Trainee’s Working\nSpace\n 2.0 x 2.0 meters\n4 sq.m per\nstudent\n100.0 sq.m.\n•\nLecture Room\n8.00 x 6.00\n48.00\n48.0\n•\nLearning Resource Center\n4.00 x 6.00\n24.00\n24.0\n•\n\n172\n• Facilities/Equipment/\nCirculation Area\n-\n-\n52\nTOTAL WORK AREA\n-\n224\nWorking field\n0.25 hectare (MOA/Rental)\n\n--- PDF PAGE 74 ---\nTR HEAVY-EQUIPMENT OPERATION (Rough-Terrain Crane) NC II Promulgated July 2007\nPage 73 of 79\n\n 3.6 TRAINERS’ QUALIFICATION\n\n HEAVY EQUIPMENT OPERATION (LIFTING)\n\nTRAINER QUALIFICATION (TQ II)\n•\nMust be a holder of Heavy-Equipment Operation (Rough-Terrain\nCrane) NC-II or equivalent qualification\n•\nMust have undergone training on Training Methodology II (TM II)\nor equivalent in training/experience\n•\nMust be computer-literate\n•\nMust be physically and mentally fit\n•\nMust have at least 5 years job/industry experience*\n•\nMust be a civil-service eligible or holder of appropriate\nprofessional license issued by the Professional Regulations\nCommission (for government position)\n\n* Optional. Only when required by the hiring institution.\n\nReference: TESDA Board Resolution No. 2004-03\n\n--- PDF PAGE 75 ---\nTR HEAVY-EQUIPMENT OPERATION (Rough-Terrain Crane) NC II Promulgated July 2007\nPage 74 of 79"
