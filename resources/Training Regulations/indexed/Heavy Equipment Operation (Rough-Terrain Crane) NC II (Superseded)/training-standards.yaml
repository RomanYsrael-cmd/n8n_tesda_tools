  "source_section_text": "SECTION 3 TRAINING STANDARDS\n\nThese guidelines are set to provide the Technical and Vocational\nEducation and Training (TVET) providers with information and other important\nrequirements to consider when designing training programs for HEAVY-\nEQUIPMENT OPERATION (Rough-terrain Crane) NC II.\n\n 3.1 CURRICULUM DESIGN\n\nCourse Title : HEAVY EQUIPMENT OPERATION - ROUGH-TERRAIN\n CRANE\nNC Level:\nII\n\nBASIC COMPETENCIES\nNominal Training Hours:\n18 Hours (Basic) + 18 Hours (Common)\nCourse Description:\n\nThis course is designed to equip individuals with the basic, common and\ncore competencies in Construction Sector particularly in Heavy-Equipment\nOperation (Rough-terrain Crane).\n\nTo obtain this, all units prescribed for this qualification must be achieved:\n\nBASIC COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and convey\nworkplace information.\n1.2 Complete relevant work\n related documents\n1.3 Participate in\nworkplace meeting and\ndiscussion.\nGroup\ndiscussion\nInteraction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n2. Work in a team\n environment\n2.1 Describe and identify\nteam role and\nresponsibility in a team.\n2.2 Describe work as a team\nmember.\nDiscussion\nInteraction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n\n--- PDF PAGE 64 ---\nTR HEAVY-EQUIPMENT OPERATION (Rough-Terrain Crane) NC II Promulgated July 2007\nPage 63 of 79\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n3. Practice career\nprofessionalism\n3.1 Integrate personal\nobjectives with\norganizational goals.\n3.2 Set and meet work\npriorities.\n3.3 Maintain professional\ngrowth and development.\nDiscussion\nInteraction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n4. Practice\noccupational\nhealth and safety\n4.1 Evaluate hazard and\nrisks\n4.2 Control hazards and risks\n4.3 Maintain occupational\nhealth and safety\nawareness\nDiscussion\nPlant tour\nSymposium\n• Observation\n• Interview\n\n--- PDF PAGE 65 ---\nTR HEAVY-EQUIPMENT OPERATION (Rough-Terrain Crane) NC II Promulgated July 2007\nPage 64 of 79\n\nCOMMON COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Prepare\nconstruction\nmaterials and\ntools\n1.8 Identify Materials\n1.9 Requisition\nMaterials\n1.10 Receive and\ninspect materials\nAudio Visual\nsimulation\nDiscussion\nPractical\nexercise\nDemonstration\n• Direct observation\n• Questions or\ninterview\n• Portfolio\n(credentials)\n• Written / Oral Test\n•\nDemonstration\n2. Observe\nprocedures,\nSpecifications\nand Manuals of\nInstructions\n2.1 Identify and access\nspecification/\nmanuals\nAudio Visual\nSimulation\nDiscussion\nPractical Lab\nDemonstration\n• Direct observation\n• Oral questioning\n• Written test or\nexamination\n• Third party report\n• Demonstration\n(able to impart\nknowledge and\nskills)\n3. Interpret\nTechnical\nDrawing\n3.1 Analyze sign,\nsymbols and data\n3.2 Interpret technical\ndrawing and plans\n3.3 Apply freehand\nsketching\nAudio Visual\nSimulation\nDiscussion\nPractical Lab\nDemonstration\n• Direct observation\n• Oral questioning\n• Written test or\nexamination\n• Third party report\n• Demonstration\n(able to impart\nknowledge and\nskills)\n4. Perform\nmensurations\nand calculation\n4.1 Select measuring\ninstruments\n4.2 Carry out\nmeasurements\nand calculations\nAudio Visual\nSimulation\nDiscussion\nPractical Lab\nDemonstration\n• Direct observation\n• Oral questioning\n• Written test or\nexamination\n• Third party report\n• Demonstration\n(able to impart\nknowledge and\nskills)\n\n--- PDF PAGE 66 ---\nTR HEAVY-EQUIPMENT OPERATION (Rough-Terrain Crane) NC II Promulgated July 2007\nPage 65 of 79\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n5. Maintain tools\nand equipment\n5.1 Check condition of\ntools and\nequipment\n5.2 Perform basic\npreventive\nmaintenance\n5.3 Sharpen edge and\ntooth cutting tools\n5.4 Store tools and\nequipment\nAudio Visual\nSimulation\nDiscussion\nPractical Lab\nDemonstration\n• Direct observation\nof application of\ntasks\n• Oral questioning\n• Written test or\nexamination\n• Third party report\n• Demonstration\n\n--- PDF PAGE 67 ---\nTR HEAVY-EQUIPMENT OPERATION (Rough-Terrain Crane) NC II Promulgated July 2007\nPage 66 of 79\n\nCORE COMPETENCIES\n\nCourse Title\n: HEAVY EQUIPMENT OPERATION Level: NC II\n\n ROUGH-TERRAIN CRANE\n\nNominal Training Hours:\n120 Hours\n\nCourse Description:\n\nThis course is designed to enhance knowledge, desirable attitudes and\nskills in the use of rough-terrain crane in accordance with industry standards. It\ncovers core competencies such as: performing pre- and post-operation\nprocedures, performing productive operation, and performing basic preventive-\nmaintenance servicing on a given rough-terrain crane.\n\nTo obtain this, all units prescribed for this qualification must be achieved:\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Perform pre- and\npost-operation\nprocedures for\nRough-terrain Crane\n\n1.1 Identify rough-terrain\ncrane types /\ncomponents parts\n1.2 Perform visual check of\nequipment\n1.3 Check BLOWAF of\nrough-terrain crane\n1.10.1 Battery\n1.3.2 Light\n1.3.3 Oil\n1.3.4 Water\n1.3.5 Air\n1.3.6 Fuel\n1.4 Check rough-terrain\ncrane system operation\n1.5 Check safety devices\naccessories\n1.6 Perform post operation\ncheck\nLecture\nPractical /\nDemonstration\n\n• Observation\nand oral\nquestioning\n• Demonstration\nand oral\nquestioning\n• Written test\n\n--- PDF PAGE 68 ---\nTR HEAVY-EQUIPMENT OPERATION (Rough-Terrain Crane) NC II Promulgated July 2007\nPage 67 of 79\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n2. Perform productive\noperation for\nRough-terrain\nCrane\n\n2.1 Perform loading\n and unloading of\n rough-terrain\n crane to trailer\n (low bed)\n2.2 Perform rough-\n terrain crane\n application\n2.2.1 travel\n2.2.2 position the\n crane\n2.2.3 lifting and\ntransferring\nLecture\nPractical /\nDemonstration\n\n• Observation\nand oral\nquestioning\n• Demonstration\nand oral\nquestioning\n• Written test\n3. Perform basic\nmaintenance\nservicing for\nRough-terrain\nCrane\n\n3.1 Perform safety\n practices, and\n housekeeping\n3.2 Perform preventive\n maintenance and\n servicing\n\nLecture\nPractical /\ndemonstration\n\n• Observation\nand oral\nquestioning\n• Demonstration\nand oral\nquestioning\n• Written test\n\n--- PDF PAGE 69 ---\nTR HEAVY-EQUIPMENT OPERATION (Rough-Terrain Crane) NC II Promulgated July 2007\nPage 68 of 79\n\n3.2\nTRAINING DELIVERY\n\nThe delivery of training should adhere to the design of the curriculum.\nDelivery should be guided by the 10 basic principles of competency-based TVET.\n\n• The training is based on curriculum developed from the\ncompetency standards;\n• Learning is modular in its structure;\n• Training delivery is individualized and self-paced;\n• Training is based on work that must be performed;\n• Training materials are directly related to the competency standards\nand the curriculum modules;\n• Assessment is based in the collection of evidence of the\nperformance of work to the industry required standard;\n• Training is based both on and off-the-job components;\n• Allows for recognition of prior learning (RPL) or current\ncompetencies;\n• Training allows for multiple entry and exit; and\n• Approved training programs are nationally accredited.\n\nThe competency-based TVET system recognizes various types of delivery\nmodes, both on and off-the-job as long as the learning is driven by the\ncompetency standards specified by the industry. The following training modalities\nmay be adopted when designing training programs:\n\n• The dualized mode of training delivery is preferred and\nrecommended. Thus programs would contain both in-school and in-\nindustry training or fieldwork components. Details can be referred to\nthe Dual Training System (DTS) Implementing Rules and\nRegulations.\n• Modular/self-paced learning is a competency-based training\nmodality wherein the trainee is allowed to progress at his own pace.\nThe trainer facilitates the training delivery\n• Peer teaching/mentoring is a training modality wherein fast learners\nare given the opportunity to assist the slow learners.\n\n--- PDF PAGE 70 ---\nTR HEAVY-EQUIPMENT OPERATION (Rough-Terrain Crane) NC II Promulgated July 2007\nPage 69 of 79\n\n• Supervised industry training or on-the-job training is an approach in\ntraining designed to enhance the knowledge and skills of the\ntrainee through actual experience in the workplace to acquire\nspecific competencies prescribed in the training regulations.\n• Distance learning is a formal education process in which majority of\nthe instruction occurs when the students and instructor are not in\nthe same place. Distance learning may employ correspondence\nstudy, or audio, video or computer technologies.\n\n3.3\n TRAINEE ENTRY REQUIREMENTS\n\nThis section specifies the qualifications of trainees and educational\nexperience. Other requirements like health and physical requirements may also\nbe stated. Passing written entrance examinations may also be indicated if\nnecessary.\n\n• Can communicate both orally and in writing\n\n• Physically and mentally fit\n\n• With good moral character\n\n• Can perform basic mathematical computations.\n\n--- PDF PAGE 71 ---\nTR HEAVY-EQUIPMENT OPERATION (Rough-Terrain Crane) NC II Promulgated July 2007\nPage 70 of 79\n\n3.4\nLIST OF TOOLS, EQUIPMENT AND MATERIALS\n\nRecommended list of tools, equipment and materials for the training of 25\ntrainees for the operation of rough-terrain crane.\n\nTOOLS\nEQUIPMENT\nMATERIALS\nQTY\nQTY\nQTY\n1 set\n• Wrenches (box and\nopen-end 8-24 mm-\nmetric & 7/16 –1” -\nEnglish )\n1 unit • Rough –terrain\nCrane (MOA\n/rental)\n5 kls\n• Multi- purpose\ngrease\n1 set