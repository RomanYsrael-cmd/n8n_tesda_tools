      "term": "1. Attachment",
      "definition": "Refers to anything like clamshell, drag line, boring (drilling) equipment, pile driver, drop hammer of other accessories/special attachments used instead of the conventional lift block to perform different types of lifting jobs. 2. Boom (crane) Refers to the rotating superstructure and used for supporting the hoisting tackle. 3) Boom Length Refers to the measurement from the boom foot pins to the center of the boom point sheaves. 4. Portfolio A tool containing pieces of evidence demonstrating work outputs that have been collected by the candidate. The items are usually produced over a period of time and come from different sources. 5. Reeving Refers to a rope system in which the rope travels around the drums and sheaves. 6. Rough-terrain Crane Refers to equipment, which has four-wheel crab and tram steering as well as the normal two wheel front steering capabilities. This equipment also both two-wheel and four-wheel drive capabilities to enhance its usability. 7. Standard Refers to a degree or level of requirement set by the manufacturer. 8. Stability Refers to the machine resistance to overturning (Rough-terrain and Truck-mounted Cranes - lifting on outriggers are based on 85 percent of their tipping capacity). 9. Safety Devices Refer to boom angle indicators, load moment indicators, anti-two blocking devices (where applicable), boom kick out lever, etc. 10. Work Area Normally refers to any place inside the swing circle of the crane. It must be barricaded off and only those directly involve in the lift shall be allowed to entry."
