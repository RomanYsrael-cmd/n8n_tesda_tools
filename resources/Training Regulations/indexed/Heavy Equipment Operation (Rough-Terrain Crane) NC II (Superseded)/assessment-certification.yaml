  "source_text": "SECTION 4\nNATIONAL ASSESSMENT AND CERTIFICATION\nARRANGEMENTS\n\n4.1\nTo attain the National Qualification of HEAVY-EQUIPMENT OPERATION\n(Rough-Terrain Crane) NC II, the candidate must demonstrate\ncompetence in all the units of competency in Section 1. Successful\ncandidates shall be awarded National Certificates signed by the TESDA\nDirector General.\n\n4.2\nThe qualification of HEAVY EQUIPMENT OPERATION (Rough-Terrain\nCrane) NC II may be attained through demonstration of competence in a\nproject-type assessment covering the following core units. Candidates\nmay apply for assessment in any accredited assessment center.\n\n4.2.1\nRough-Terrain Crane operation\n Perform pre- and post-operation for lifting equipment\n Perform productive operation for rough-terrain crane\n Perform basic preventive maintenance servicing for lifting\nequipment\n\n4.3 Assessment shall focus on the core units of competency. The basic and\ncommon units shall be integrated or assessed concurrently with the core\nunits.\n\n4.4 The following are qualified to apply for assessment and certification:\n\n4.4.1\nGraduates of formal, non-formal and/or informal training including\nenterprise-based training programs\n\n4.4.2\nExperienced Workers (wage-employed or self-employed)\n\n4.5 The guidelines on assessment and certification are discussed in detail in the\nProcedures Manual on Assessment and Certification and Guidelines on the\nImplementation of the Philippine TVET Qualification and Certification\nSystem (PTQCS).\n\n--- PDF PAGE 76 ---\nTR HEAVY-EQUIPMENT OPERATION (Rough-terrain Crane) NC II Promulgated July 2007\nPage 75 of 79\n\n"
