    "source_text": "SECTION 3\nTRAINING STANDARDS\n\nThese standards are set to provide technical and vocational education and training (TVET)\nproviders with information and other important requirements to consider when designing\ntraining programs for TINSMITHING OPERATION NC II\n\n3.1 CURRICULUM DESIGN\n\nCourse Title: TINSMITHING OPERATION NC II\n\nNC Level NC II\n\nNominal Training Duration:\n18 Hours (Basic Competencies)\n\n20 Hours (Common Competencies)\n88 Hours (Core Competencies)\n\nCourse Description:\n\nThis course is designed to enhance the knowledge, skills and attitudes of an individual in\nthe field of automotive manufacturing in accordance with industry standards. It covers\ncompetencies such to perform tinsmith operation which includes welding & brazing in accordance\nwith manufacturer’s specification. It also covers headlight focus aiming operations.\n.\n\nTo obtain this, all units prescribed for this qualification must be achieved.\n\nBASIC COMPETENCIES\n(18 Hours)\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and convey workplace\ninformation\n1.2 Complete relevant work related\ndocuments\n1.3 Participate in workplace meeting\nand discussion\n• Group\ndiscussion\n• Interaction\n• Lecture\n• Reportorial\n\n• Written test\n• Practical/\nperformance test\n• Interview\n2. Work in a team\nenvironment\n2.1\nDescribe and identify team role\nand responsibility in a team.\n2.2 Describe work as a team\nmember.\n• Group\ndiscussion\n• Case studies\n• Simulation\n• Written test\n• Observation\n• Simulation\n• Role playing\n3. Practice career\nprofessionalism\n3.1\nIntegrate personal objectives with\norganizational goals\n3.2 Set and meet work problems\n3.3 Maintain professional growth and\ndevelopment\n• Interactive\nlecture\n• Structure\nactivity\n• Simulation\n• Demonstration\n• Self-paced\ninstruction\n• Role play\n• Interview\n• Written\nexamination\n\n--- PDF PAGE 41 ---\nTR Tinsmithing (Automotive Manufacturing) NC II Promulgated\n37\n\n4. Practice\noccupational\nhealth and safety\n4.1\nEvaluate hazards and risks\n4.2 Control hazards and risks\n4.3 Maintain occupational health and\nsafety awareness\n• Interactive\nlecture\n• Simulation\n• Symposium\n• Group dynamics\n• Film viewing\n• Situational\nanalysis\n• Interview\n• Practical\nexamination\n• Written exam\n• Portfolio\nassessment\nCOMMON COMPETENCIES\n(20 Hours)\n\n Unit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Perform\nmensuration and\ncalculation\n1.1 Select measuring instruments\n1.2 Carry out measurements and\ncalculation\n1.3 Maintain measuring instruments\n• Lecture/\nDemonstration\n• Practical\nexercises\n• Simulation\n• Written test\n• Oral questioning\n• Direct\nobservation\n\n2. Read, interpret\nand apply\nengineering\ndrawings/specific\nations\n2.1 Identify/access engineering\nmanuals / specification\n2.2 Interpret manual\n2.3 Apply information in manual\n2.4 Store manuals\n• Lecture/\nDemonstration\n• Dual training\n• Direct\nobservation\n• Interview\n3. Move and\nposition vehicle\n3.1 Prepare vehicle for driving\n3.2 Move and position vehicle\n3.3 Check the vehicle\n• Lecture/\nDemonstration\n• Practical\nexercises\n• Simulation\n• Written test\n• Oral questioning\n• Direct\nobservation\n\n4. Apply appropriate\nsealant/ adhesive\n4.1 Identify appropriate sealant/\nadhesive\n4.2 Prepare surface for sealant /\nadhesive application\n4.3 Store unused and dispose used\nsealant/adhesive\n• Lecture/\nDemonstration\n• Dual training\n• Distance\nlearning\n• Written test\n• Oral questioning\n• Direct\nobservation\n• Interview\n•Project method\n5. Perform shop\nmaintenance\n5.1 Inspect/clean tools and work area\n5.2 Store/arrange tools and shop\nequipment\n5.3 Dispose waste/used lubricants\n5.4 Report damaged tools/equipment\n• Lecture/\nDemonstration\n• Dual training\n• Self-paced\n(modular)\n• Written test\n• Direct\nobservation\n• Interview\n• Practical\nexercises\n\n--- PDF PAGE 42 ---\nTR Tinsmithing (Automotive Manufacturing) NC II Promulgated\n38\n\nCORE COMPETENCIES\n(88 Hours)\nUnits of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1.\nWeld and\nbraze\nautomotive\nbody shells\n1.1 Prepare body shell for Welding and\nBrazing Application\n1.2 Perform Welding Application\n1.3 Perform Brazing Application\n\n• Practical\nTraining\n• Direct\nObservation\n• Demonstration\n• Written Exam\n2.\nPerform\ntinsmith\noperation\n2.1 Perform installation of skin panel\n parts\n\n2.2 Inspect installed panel parts\n2.3 Perform Tinsmith Operation\n• Practical\nTraining\n• Direct\nObservation\n• Demonstration\n• Written Exam\n\n3.2 TRAINING DELIVERY\n\nThe delivery of training should adhere to the design of the curriculum. Delivery should be\nguided by the 10 basic principles of competency-based TVET.\n\n• The training is based on curriculum developed from the competency standards;\n• Learning is modular in its structure;\n• Training delivery is learner-centered and should accommodate individualized and self-\npaced learning strategies;\n• Training is based on work that must be performed;\n• Training materials are directly related to the competency standards and the curriculum\nmodules;\n• Assessment is based in the collection of evidence of the performance of work to the\nindustry required standard;\n• Training is based on and off-the-job components;\n• Allows for recognition of prior learning (RPL) or current competencies;\n• Training allows for multiple entry and exit; and\n• Approved training programs are nationally accredited.\n\nThe competency-based TVET system recognizes various types of delivery modes, both\non and off-the-job as long as the learning is driven by the competency standards specified by\nthe industry. The following training modalities may be adopted when designing training\nprograms:\n\n• The dualized mode of training delivery is preferred and recommended. Thus programs\nwould contain both in-school and in-industry training or fieldwork components. Details can\nbe referred to the Dual Training System (DTS) Implementing Rules and Regulations.\n• Modular/self-paced learning is a competency-based training modality wherein the trainee\nis allowed to progress at his own pace. The trainer facilitates the training delivery\n• Peer teaching/mentoring is a training modality wherein fast learners are given the\nopportunity to assist the slow learners.\n• Supervised industry training or on-the-job training is an approach in training designed to\nenhance the knowledge and skills of the trainee through actual experience in the\nworkplace to acquire specific competencies prescribed in the training regulations.\n\n--- PDF PAGE 43 ---\nTR Tinsmithing (Automotive Manufacturing) NC II Promulgated\n39\n\n• Distance learning is a formal education process in which majority of the instruction occurs\nwhen the students and instructor are not in the same place. Distance learning may\nemploy correspondence study, or audio, video or computer technologies.\n• Project-Based Instruction is an authentic instructional model or strategy in which students\nplan, implement and evaluate projects that have real world applications.\n\n3.3 TRAINEE ENTRY REQUIREMENTS\n\nTrainees or students should possess the following requirements:\n\n• can communicate both oral and written;\n• physically and mentally fit; and\n• with good moral character\n\nThis list does not include specific institutional requirements such as educational\nattainment, appropriate work experience, and others that may be required of the\ntrainees by the school or training center delivering the TVET program.\n\n3.4 LIST OF TOOLS, EQUIPMENT AND MATERIALS\nTINSMITH OPERATION NC II\n\nRecommended list of tools, equipment and materials for the training of 15 trainees for\nTinsmith Operation NC II\n\nTOOLS\nEQUIPMENT\nMATERIALS\nQTY\nQTY\nQTY\n2 sets\nWrench open-end\n2 units\nWelding machine\n1 Kg.\nWelding electrodes\n3 pcs.\nSteel ruler\n2 units Welding\nOxyacetylene\n1 Kg.\nWire G.I.\n3 pcs.\nVise grip plier\n2 units\nLifter\n1 Kg.\nFIller rod, Bronze\n3 sets\nPry bar\n2 units\nDolly\n2 can\nBorax\n3 sets\nHammer\na.) Cross-peen\nb.) Ball peen\n\n30 pcs.\nSand paper\nGrit # 280\nGrit # 180\nGrit # 120\n3 units Rubber mallet\n\n20 pcs.\nSanding Disc Grit # 80\nGrit # 100\n3 units\nPneumatic sander\n10 Kls.\nColored rag\n2 units\nPneumatic grinder\n3 units Pneumatic impact\ngun\n\n5 pcs.\nFile\n3 units\nWire brush\n15 pcs.\nWelding goggle\n15 pcs.\nCotton glove\n15 pcs.\nSafety shoe\n15 pcs.\nApron\n\n--- PDF PAGE 44 ---\nTR Tinsmithing (Automotive Manufacturing) NC II Promulgated\n40\n\n3.5 TRAINING FACILITIES\nTINSMITHING OPERATION NC II\n\nBased on a class size of 15 students/trainees\n\nSPACE REQUIREMENT\nSIZE IN METERS\nAREA IN SQ.\nMETERS\nTOTAL AREA IN\nSQ. METERS\n• Building (permanent)\n26.00 x 28.00\n728.00\n728.00\n• Trainee Working Space\n3.50 x 3.50 per\nstudent/trainee\n12.25 per\nstudent\n306.00\n• Lecture Room\n9.00 x 10.00\n90.00\n90.00\n•\nLearning Resource Center\n5.00 x 8.00\n40.00\n40.00\n• Facilities/ Equipment/\nCirculation Area\n-\n-\n291.75\n\n3.6 TRAINER’S QUALIFICATIONS FOR AUTOMOTIVE SECTOR\n MANUFACTURING SUB-SECTOR\n\nTINSMITHING OPERATIONNC II\nTRAINER QUALIFICATION (TQ II)\n\n• Must be a holder of Painting Machine Operation NC II\n• Must have undergone training on Training Methodology II (TM II)\n• Must be computer literate\n• Must be physically and mentally fit\n• *Must have at least 2 years job/industry experience\n• Must be a civil service eligible (for government position or appropriate professional license\nissued by the Professional Regulatory Commission)\n\n* Optional. Only when required by the hiring institution.\nReference: TESDA Board Resolution No. 2004 03\n\n3.7 INSTITUTIONAL ASSESSMENT\n\nInstitutional assessment is undertaken by trainees to determine their achievement of\nunits of competency. A certificate of achievement is issued for each unit of competency.\n\n--- PDF PAGE 45 ---\nTR Tinsmithing (Automotive Manufacturing) NC II Promulgated\n41"
