  "source_text": "DEFINITION OF TERMS\n\n1. Brazing\nBrazing is a method of joining metal parts using nonferrous filler\nmetals with high melting points such as copper, silver, and aluminum\nalloys. Brazing differs from soldering by using a higher temperature;\nand unlike welding, the parts are not melted. Brazing is best for\ndissimilar or thinner metal parts difficult to weld or solder.\n\n2. Dent\nA dent is a depression in a surface made by pressure or a blow.\n\n3. File\nThe file is any of several hardened steel tools with cutting ridges for\nforming, smoothing, or reducing especially metallic surfaces.\n4. Impact gun\nAn impact gun is a pneumatic tool with attached sockets used to\ntighten and loosen screws or bolts.\n\n5. Jig\nA jig is a device for guiding a tool or for holding machine work in\nplace.\n6. Pry bar\nA pry bar is a heavy steel bar, pointed at one end and shaped lie\nchisel at the other end; used for prying.\n\n7. Rubber mallet\nThe rubber mallet is a tool with a large head, used to strike a surface\nwithout damaging it.\n\n8. Sander\nA sander is a machine having a powered abrasive-covered disk or\nbelt, used for smoothing or polishing surfaces.\n9. Skin panel parts\nSkin panel parts refers to the parts of the vehicle such as hood,\ntrunk lid, LH-RH doors, LH-RH fender.\n\n10. Steel brush\n(wire)\nA steel brush is a hard brush wire, providing a high fatigue life and\ndurable cutting action. It is most appropriate for work on steel and iron\nwork pieces, but may also be used on wood, aluminum, brass and\ncopper; however the softer the material to be brushed, the more likely\nthat a steel wire brush will cut into the material and remove base\nmaterial in addition to the targeted coating or contamination.\n11. Tinsmith\noperation\nTinsmith operation is a part of the body shop section wherein the\nadditional welding process, brazing application, sin panel installation,\ndent and other metal damages rectification are performed.\n\n12. Welding\nWelding is the process of joining metals by applying heat, sometimes w\npressure and sometimes with an intermediate or filler metal having a hig\nmelting point. It is the process of fastening two pieces of metal together\nsoftening with heat and applying pressure.\n\n--- PDF PAGE 48 ---\nTR Tinsmithing (Automotive Manufacturing) NC II Promulgated\n - 44 -"
