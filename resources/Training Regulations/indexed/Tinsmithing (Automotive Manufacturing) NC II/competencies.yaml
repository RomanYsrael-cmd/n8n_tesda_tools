  "source_section_text": "Section 1. Successful candidates shall be awarded a National Certificate signed\nby the TESDA Director General.\n\n4.2 The qualification of Tinsmithing Operation (Automotive Manufacturing) NC II may be\nattained through:\n\n4.2.1\nAccumulation of Certificates of Competency (COCs) in all the following areas:\n\n4.2.1.1 Weld and Braze Automotive Body Shell\n4.2.1.2 Perform Tinsmith Operation\n\n4.3 Assessment shall focus on the core units of competency. The basic and common units\nshall be integrated or assessed concurrently with the core units.\n\n4.4 The following are qualified to apply for assessment and certification:\n\n1.1.1 Graduates of formal, non-formal and informal including enterprise-\nbased training programs.\n\n1.1.2 Experienced workers (wage employed or self-employed)\n\n4.5 The guidelines on assessment and certification are discussed in detail in the Procedures\nManual on Assessment and Certification and Guidelines on the Implementation of the\nPhilippine TVET Qualification and Certification System (PTQCS).\n\n--- PDF PAGE 46 ---\nTR Tinsmithing (Automotive Manufacturing) NC II Promulgated\n42\n\nTINSMITHING (Automotive Manufacturing) NC II\nLegend:\nPerform pre-treatment and\nCathodic Electro-deposition\nprocess operation\nANNEX A\nWeld and braze\nautomotive body shell\nPerform tinsmith\noperation\nPerform Gray Primer\n(2nd Primer) application\nprocedures\nPerform Top coat\napplication\nCOMPETENCY MAP- AUTOMOTIVE SECTOR\nMANUFACTURING SUB SECTOR\n( ASSEMBLY)\n\nTINSMITHING (AUTOMOTIVE MANUFACTURING) NC II\n\nCOMMON\nCOMPETENCIES\nReceive and\nrespond workplace\ncommunication\nParticipate in\nworkplace\ncommunication\nLead in workplace\ncommunication\nUtilize specialist\ncommunication skills\nWork in team\nenvironment\nDevelop team\n and individual\nSolve workplace\nproblems related\nto work activities\nWork with Other\nLead small Team\nApply problem\nsolving techniques\nin the workplace\nPlan and\norganize work\nBASIC\nCOMPETENCIES\nCORE COMPETENCIES\nDemonstrate\nwork values\nPractice basic\n housekeeping\nprocedures\nPractice career\nprofessionalism\nPractice occupational\nhealth and safety\n procedures\nDevelop and\npractice negotiation\nskills\nUse mathematical\nconcepts and\n techniques\nUse relevant\n technologies\nPerform Mensuration\nand Calculation\nRead, Interpret and Apply\nEngineering Drawings\nMove and Position\nVehicle\nApply Appropriate\nSealant/Adhesives\nInstall/Fit out Electrical\nParts to Engine\nAssembly\nAssemble Mechanical\nAssemblies Using Jigs/\nFixtures\nMount/ Install Brake\nFuel System\nMount/ Install\nSuspension Drive\nSystem\nMount/ Install Power\nDrive System\nInstall/Fit Trim\nParts/Components\nPerform Final Engine\nRun\nPerform Wheel\nAlignment Operation\nPerform Shop\nMaintenance\nInstall/Fit out Electronic\nUnits to Body Interior\nComponents\nInstall/Fit out Electrical\nParts & Electronic Units to\nDash Board Instrument\nPanel\nInstall/Fit out Electrical\nParts to Exterior and\nEngine Compartment\nInstall/Fit out Audio and\nVideo Systems\nPerform Headlight\nFocus Aiming Operation\n\n--- PDF PAGE 47 ---\nTR Tinsmithing (Automotive Manufacturing) NC II Promulgated\n - 43 -\n\nDEFINITION OF TERMS\n\n1. Brazing\nBrazing is a method of joining metal parts using nonferrous filler\nmetals with high melting points such as copper, silver, and aluminum\nalloys. Brazing differs from soldering by using a higher temperature;\nand unlike welding, the parts are not melted. Brazing is best for\ndissimilar or thinner metal parts difficult to weld or solder.\n\n2. Dent\nA dent is a depression in a surface made by pressure or a blow.\n\n3. File\nThe file is any of several hardened steel tools with cutting ridges for\nforming, smoothing, or reducing especially metallic surfaces.\n4. Impact gun\nAn impact gun is a pneumatic tool with attached sockets used to\ntighten and loosen screws or bolts.\n\n5. Jig\nA jig is a device for guiding a tool or for holding machine work in\nplace.\n6. Pry bar\nA pry bar is a heavy steel bar, pointed at one end and shaped lie\nchisel at the other end; used for prying.\n\n7. Rubber mallet\nThe rubber mallet is a tool with a large head, used to strike a surface\nwithout damaging it.\n\n8. Sander\nA sander is a machine having a powered abrasive-covered disk or\nbelt, used for smoothing or polishing surfaces.\n9. Skin panel parts\nSkin panel parts refers to the parts of the vehicle such as hood,\ntrunk lid, LH-RH doors, LH-RH fender.\n\n10. Steel brush\n(wire)\nA steel brush is a hard brush wire, providing a high fatigue life and\ndurable cutting action. It is most appropriate for work on steel and iron\nwork pieces, but may also be used on wood, aluminum, brass and\ncopper; however the softer the material to be brushed, the more likely\nthat a steel wire brush will cut into the material and remove base\nmaterial in addition to the targeted coating or contamination.\n11. Tinsmith\noperation\nTinsmith operation is a part of the body shop section wherein the\nadditional welding process, brazing application, sin panel installation,\ndent and other metal damages rectification are performed.\n\n12. Welding\nWelding is the process of joining metals by applying heat, sometimes w\npressure and sometimes with an intermediate or filler metal having a hig\nmelting point. It is the process of fastening two pieces of metal together\nsoftening with heat and applying pressure.\n\n--- PDF PAGE 48 ---\nTR Tinsmithing (Automotive Manufacturing) NC II Promulgated\n - 44 -\n\nACKNOWLEDGEMENT\n\nThe Technical Education and Skills Development Authority (TESDA) wishes to\nextend thanks and appreciation to the many representatives of business, industry,\nacademe and government agencies who rendered their time and expertise to the\ndevelopment and validation of this Training Regulation.\n\nTHE TECHNICAL AND INDUSTRY EXPERT PANEL\nTINSMITHING (Automotive Manufacturing)\nNMPI / CATC/PAFI\nAntonio A. Gimenez\nExecutive Director -\nCATC/PAFI\n\nEdgardo P. Zaragoza-\nPaint Shop Manager- NMPI\n(CATC/PAFI)\nRene Torres\n(Labor Representative)\nNissan Motors Philippines\nWorkers Union-AIWA\nNissan TechnoPark Bo.\nPulong, Sta. Cruz Laguna\nMr. Valentino de Leon\nVP- Plant Adminstration-\nNMPI\nRodolfo T. Nunez-\nPlant Manager-Nissan\nMotors Phils. Inc.(NMPI)\nCATC/PAFI\n\nCarina J. Bondad-\nAdministrative Support Staff,\n(CATC/PAFI)\n\nThe PARTICIPANTS in the National Validation of this Training Regulation\nROBERTS RADIATOR\nPILIPINAS HINO INC.\nNISSAN MOTOR PHILIPPINES\nINC.\nMembers of the TESDA Board\nThe MANAGEMENT and STAFF of the TESDA Secretariat\nTESDA EXCOM\nQualification and Standards Office\nFlorante P. Inoturan\nAgnes P. Panem\nAbel B. Elpedes"
