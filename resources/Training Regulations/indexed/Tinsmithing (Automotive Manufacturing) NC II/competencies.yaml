  "source_section_text": "SECTION 2 COMPETENCY STANDARDS\n\nThis section gives the details of the contents of the basic, common and core units\nof competency required in TINSMITHING (AUTOMOTIVE MANUFACTURING) NC II.\n\nBASIC COMPETENCIES\n\nUNIT OF COMPETENCY :\nPARTICIPATE IN WORKPLACE COMMUNICATION\nUNIT CODE\n:\n500311105\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes\nrequired to gather, interpret and convey information in\nresponse to workplace requirements.\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Obtain and\nconvey\nworkplace\ninformation\n1.1\nSpecific and relevant information is accessed from\nappropriate sources\n1.2\nEffective questioning , active listening and speaking skills are\nused to gather and convey information\n1.3\nAppropriate medium is used to transfer information and ideas\n1.4\nAppropriate non- verbal communication is used\n1.5\nAppropriate lines of communication with supervisors and\ncolleagues are identified and followed\n1.6\nDefined workplace procedures for the location and storage of\ninformation are used\n1.7\nPersonal interaction is carried out clearly and concisely\n2. Participate in\nworkplace\nmeetings and\ndiscussions\n2.1\nTeam meetings are attended on time\n2.2\nOwn opinions are clearly expressed and those of others are\nlistened to without interruption\n2.3\nMeeting inputs are consistent with the meeting purpose and\nestablished protocols\n2.4\nWorkplace interactions are conducted in a courteous manner\n2.5\nQuestions about simple routine workplace procedures and\nmatters concerning working conditions of employment are\ntasked and responded to\n2.6\nMeetings outcomes are interpreted and implemented\n3. Complete\nrelevant work\nrelated\ndocuments\n3.1\nRange of forms relating to conditions of employment are\ncompleted accurately and legibly\n3.2\nWorkplace data are recorded on standard workplace forms and\ndocuments\n3.3\nBasic mathematical processes are used for routine calculations\n3.4\nErrors in recording information on forms/ documents are\nidentified and properly acted upon\n3.5\nReporting requirements to supervisor are completed according\nto organizational guidelines\n\n--- PDF PAGE 7 ---\nTR Tinsmithing (Automotive Manufacturing) NC II Promulgated 3\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Appropriate\nsources\n1.1.\nTeam members\n1.2.\nSuppliers\n1.3.\nTrade personnel\n1.4.\nLocal government\n1.5.\nIndustry bodies\n2. Medium\n2.1.\nMemorandum\n2.2.\nCircular\n2.3.\nNotice\n2.4.\nInformation discussion\n2.5.\nFollow-up or verbal instructions\n2.6.\nFace to face communication\n3. Storage\n3.1.\nManual filing system\n3.2.\nComputer-based filing system\n4. Forms\n4.1.\nPersonnel forms, telephone message forms, safety reports\n5. Workplace\ninteractions\n5.1.\nFace-to-face interactions\n5.2.\nTelephone conversation\n5.3.\nElectronic and two-way radio communication\n5.4.\nWritten communication including electronic mail, memos,\ninstruction and forms\n5.5.\nNon-verbal communication including gestures, signals, signs\nand diagrams\n6. Protocols\n6.1.\nObserving meeting\n6.2.\nCompliance with meeting decisions\n6.3.\nObeying meeting instructions\n\n--- PDF PAGE 8 ---\nTR Tinsmithing (Automotive Manufacturing) NC II Promulgated 4\n\n EVIDENCE GUIDE\n\n1. Critical\naspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1.\nPrepared written communication following standard format of\nthe organization\n1.2.\nAccessed information using communication equipment\n1.3.\nMade use of relevant terms as an aid to transfer information\neffectively\n1.4.\nConveyed information effectively adopting the formal or\ninformal communication\n2. Underpinning\nknowledge\n\n2.1.\nEffective communication\n2.2.\nDifferent modes of communication\n2.3.\nWritten communication\n2.4.\nOrganizational policies\n2.5.\nCommunication procedures and systems\n2.6.\nTechnology relevant to the enterprise and the individual’s work\nresponsibilities\n3. Underpinning\nskills\n3.1.\nFollow simple spoken language\n3.2.\nPerform routine workplace duties following simple written notices\n3.3.\nParticipate in workplace meetings and discussions\n3.4.\nComplete work related documents\n3.5.\nEstimate, calculate and record routine workplace measures\n3.6.\nFour fundamental operations (addition, subtraction, division and\nmultiplication)\n3.7.\nAbility to relate to people of social range in the workplace\n3.8.\nGather and provide information in response to workplace\nRequirements\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1.\nFax machine\n4.2.\nTelephone\n4.3.\nWriting materials\n4.4.\nInternet\n5. Method of\nassessment\nCompetency MUST be assessed through:\n5.1.\nDirect observation\n5.2.\nOral interview and written test\n6. Context of\nassessment\n6.1.\nCompetency may be assessed individually in the actual workplace or\nthrough accredited institution\n\n--- PDF PAGE 9 ---\nTR Tinsmithing (Automotive Manufacturing) NC II Promulgated 5\n\nUNIT OF COMPETENCY : WORK IN TEAM ENVIRONMENT\n\nUNIT CODE\n:\n500311106\nUNIT DESCRIPTOR\n:\nThis unit covers the skills, knowledge and attitudes to\nidentify role and responsibility as a member of a team.\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Describe\nteam’s role\nand scope\n1.1.\nThe role and objective of the team is identified from available\nsources of information\n1.2.\nTeam parameters, reporting relationships and responsibilities\nare identified from team discussions and appropriate external\nsources\n2. Identify own\nrole and\nresponsibility\nwithin the\nteam\n2.1.\nIndividual role and responsibilities within the team environment\nare identified\n2.2.\nRoles and responsibility of other team members are identified\nand recognized\n2.3.\nReporting relationships within team and external to team are\nidentified\n3. Work as a\nteam\nmember\n3.1.\nEffective and appropriate forms of communications used and\ninteractions undertaken with team members who contribute to\nknown team activities and objectives\n3.2.\nEffective and appropriate contributions made to complement\nteam activities and objectives, based on individual skills and\ncompetencies and workplace context\n3.3.\nObserved protocols in reporting using standard operating\nprocedures\n3.4.\nContribute to the development of team work plans based on an\nunderstanding of team’s role and objectives and individual\ncompetencies of the members.\n\n--- PDF PAGE 10 ---\nTR Tinsmithing (Automotive Manufacturing) NC II Promulgated 6\n\n RANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Role and\nobjective of\nteam\n1.1.\nWork activities in a team environment with enterprise or\nspecific sector\n1.2.\nLimited discretion, initiative and judgment maybe demonstrated\non the job, either individually or in a team environment\n2. Sources of\ninformation\n2.1.\nStandard operating and/or other workplace procedures\n2.2.\nJob procedures\n2.3.\nMachine/equipment manufacturer’s specifications and\ninstructions\n2.4.\nOrganizational or external personnel\n2.5.\nClient/supplier instructions\n2.6.\nQuality standards\n2.7.\nOHS and environmental standards\n3. Workplace\ncontext\n3.1.\nWork procedures and practices\n3.2.\nConditions of work environments\n3.3.\nLegislation and industrial agreements\n3.4.\nStandard work practice including the storage, safe handling\nand disposal of chemicals\n3.5.\nSafety, environmental, housekeeping and quality guidelines\n\n--- PDF PAGE 11 ---\nTR Tinsmithing (Automotive Manufacturing) NC II Promulgated 7\n\n EVIDENCE GUIDE\n\n1. Critical\naspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1.\nOperated in a team to complete workplace activity\n1.2.\nWorked effectively with others\n1.3.\nConveyed information in written or oral form\n1.4.\nSelected and used appropriate workplace language\n1.5.\nFollowed designated work plan for the job\n1.6.\nReported outcomes\n2. Underpinning\nknowledge\n2.1.\nCommunication process\n2.2.\nTeam structure\n2.3.\nTeam roles\n2.4.\nGroup planning and decision making\n3. Underpinning\nskills\n3.1.\nCommunicate appropriately, consistent with the culture of the\nworkplace\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1.\nAccess to relevant workplace or appropriately simulated\nenvironment where assessment can take place\n4.2. Materials relevant to the proposed activity or tasks\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1.\nObservation of the individual member in relation to the work\nactivities of the group\n5.2.\nObservation of simulation and or role play involving the\nparticipation of individual member to the attainment of\norganizational goal\n5.3\nCase studies and scenarios as a basis for discussion of\nissues and strategies in teamwork\n6. Context of\nassessment\n6.1.\nCompetency may be assessed in workplace or in a simulated\nworkplace setting\n6.2.\nAssessment shall be observed while task are being\nundertaken whether individually or in group\n\n--- PDF PAGE 12 ---\nTR Tinsmithing (Automotive Manufacturing) NC II Promulgated 8\n\nUNIT OF COMPETENCY : PRACTICE CAREER PROFESSIONALISM\n\nUNIT CODE\n:\n500311107\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes in\npromoting career growth and advancement.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Integrate\npersonal\nobjectives\nwith\norganizational\ngoals\n1.1\nPersonal growth and work plans are pursued towards\nimproving the qualifications set for the profession\n1.2\nIntra- and interpersonal relationships is are maintained in the\ncourse of managing oneself based on performance evaluation\n1.3\nCommitment to the organization and its goal is demonstrated in\nthe performance of duties\n2. Set and meet\nwork priorities\n2.1\nCompeting demands are prioritized to achieve personal, team\nand organizational goals and objectives.\n2.2\nResources are utilized efficiently and effectively to manage\nwork priorities and commitments\n2.3\nPractices along economic use and maintenance of equipment\nand facilities are followed as per established procedures\n3. Maintain\nprofessional\ngrowth and\ndevelopment\n3.1\nTrainings and career opportunities are identified and availed\nof based on job requirements\n3.2\nRecognitions are sought/received and demonstrated as proof\nof career advancement\n3.3\nLicenses and/or certifications relevant to job and career are\nobtained and renewed\n\n--- PDF PAGE 13 ---\nTR Tinsmithing (Automotive Manufacturing) NC II Promulgated 9\n\n RANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Evaluation\n1.1\nPerformance appraisal\n1.2\nPsychological profile\n1.3\nAptitude tests\n2. Resources\n2.1\nHuman\n2.2\nFinancial\n2.3\nTechnology\n2.3.1 Hardware\n2.3.2 Software\n3. Trainings\nand career\nopportunities\n3.1\nParticipation in training programs\n3.1.1 Technical\n3.1.2 Supervisory\n3.1.3 Managerial\n3.1.4 Continuing education\n3.2\nServing as resource persons in conferences and workshops\n4. Recognitions\n4.1\nRecommendations\n4.2\nCitations\n4.3\nCertificate of appreciations\n4.4\nCommendations\n4.5\nAwards\n4.6\nTangible and intangible rewards\n5. Licenses\nand/or\ncertifications\n5.1\nNational certificates\n5.2\nCertificate of competency\n5.3\nSupport level licenses\n5.4\nProfessional licenses\n\n--- PDF PAGE 14 ---\nTR Tinsmithing (Automotive Manufacturing) NC II Promulgated 10\n\n EVIDENCE GUIDE\n\n1. Critical\naspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nAttained job targets within key result areas (KRAs)\n1.2\nMaintained intra and interpersonal relationship in the course of\nmanaging oneself based on performance evaluation\n1.3\nCompleted trainings and career opportunities which are based\non the requirements of the industries\n1.4\nAcquired and maintained licenses and/or certifications\naccording to the requirement of the qualification\n2. Underpinning\nknowledge\n2.1\nWork values and ethics (Code of Conduct, Code of Ethics, etc.)\n2.2\nCompany policies\n2.3\nCompany operations, procedures and standards\n2.4\nFundamental rights at work including gender sensitivity\n2.5\nPersonal hygiene practices\n3. Underpinning\nskills\n3.1\nAppropriate practice of personal hygiene\n3.2\nIntra- and Interpersonal skills\n3.3\nCommunication skills\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nWorkplace or assessment location\n4.2\nCase studies/scenarios\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1\nPortfolio Assessment\n5.2\nInterview\n5.3\nSimulation/Role-plays\n5.4\nObservation\n5.5\nThird Party Reports\n5.6\nExams and Tests\n6. Context of\nassessment\n6.1\nCompetency may be assessed in the work place or in a\nsimulated work place setting\n\n--- PDF PAGE 15 ---\nTR Tinsmithing (Automotive Manufacturing) NC II Promulgated 11\n\nUNIT OF COMPETENCY :\nPRACTICE OCCUPATIONAL HEALTH AND SAFETY\nPROCEDURES\n\nUNIT CODE\n:\n500311108\n\nUNIT DESCRIPTOR\n:\nThis unit covers the outcomes required to comply with\nregulatory\nand\norganizational\nrequirements\nfor\noccupational health and safety.\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Identify\nhazards and\nrisks\n1.1\nSafety regulations and workplace safety and hazard control\npractices and procedures are clarified and explained based on\norganization procedures\n1.2\nHazards/risks in the workplace and their corresponding\nindicators are identified to minimize or eliminate risk to co-\nworkers, workplace and environment in accordance with\norganization procedures\n1.3\nContingency measures during workplace accidents, fire and\nother emergencies are recognized and established in\naccordance with organization procedures\n2. Evaluate\nhazards and\nrisks\n2.1\nTerms of maximum tolerable limits which when exceeded will\nresult in harm or damage are identified based on threshold limit\nvalues (TLV)\n2.2\nEffects of the hazards are determined\n2.3\nOHS issues and/or concerns and identified safety hazards are\nreported to designated personnel in accordance with workplace\nrequirements and relevant workplace OHS legislation\n3. Control\nhazards and\nrisks\n3.1\nOccupational Health and Safety (OHS) procedures for\ncontrolling hazards/risks in workplace are consistently followed\n3.2\nProcedures for dealing with workplace accidents, fire and\nemergencies are followed in accordance with organization\nOHS policies\n3.3\nPersonal protective equipment (PPE) is correctly used in\naccordance with organization OHS procedures and practices\n3.4\nAppropriate assistance is provided in the event of a workplace\nemergency in accordance with established organization\nprotocol\n4. Maintain\nOHS\nawareness\n4.1\nEmergency-related drills and trainings are participated in as\nper established organization guidelines and procedures\n4.2\nOHS personal records are completed and updated in\naccordance with workplace requirements\n\n--- PDF PAGE 16 ---\nTR Tinsmithing (Automotive Manufacturing) NC II Promulgated 12\n\n RANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Safety\nregulations\nMay include but are not limited to:\n1.1\nClean air act\n1.2\nBuilding code\n1.3\nNational electrical and fire safety codes\n1.4\nWaste management statutes and rules\n1.5\nPhilippine occupational safety and health standards\n1.6\nDOLE regulations on safety legal requirements\n1.7\nECC regulations\n2. Hazards /\nRisks\nMay include but are not limited to:\n2.1\nPhysical hazards – impact, illumination, pressure, noise,\nvibration, temperature, radiation\n2.2\nBiological hazards- bacteria, viruses, plants, parasites, mites,\nmolds, fungi, insects\n2.3\nChemical hazards – dusts, fibers, mists, fumes, smoke,\ngasses, vapors\n2.4\nErgonomics\n• Psychological factors – over exertion/ excessive force,\nawkward/static positions, fatigue, direct pressure, varying\nmetabolic cycles\n• Physiological factors – monotony, personal relationship,\nwork out cycle\n3. Contingency\nmeasures\nMay include but are not limited to:\n3.1\nEvacuation\n3.2\nIsolation\n3.3\nDecontamination\n3.4\n(Calling designed) emergency personnel\n4. PPE\nMay include but are not limited to:\n4.1\nMask\n4.2\nGloves\n4.3\nGoggles\n4.4\nHair Net/cap/bonnet\n4.5\nFace mask/shield\n4.6\nEar muffs\n4.7\nApron/Gown/coverall/jump suit\n4.8\nAnti-static suits\n\n--- PDF PAGE 17 ---\nTR Tinsmithing (Automotive Manufacturing) NC II Promulgated 13\n\n5. Emergency-\nrelated drills\nand training\n5.1\nFire drill\n5.2\nEarthquake drill\n5.3\nBasic life support/cardio pulmonary resuscitation (CPR)\n5.4\nFirst aid\n5.5\nSpillage control\n5.6\nDecontamination of chemical and toxic\n5.7\nDisaster preparedness/management\n6. OHS\npersonal\nrecords\n6.1\nMedical/health records\n6.2\nIncident reports\n6.3\nAccident reports\n6.4\nOHS-related training completed\n\n--- PDF PAGE 18 ---\nTR Tinsmithing (Automotive Manufacturing) NC II Promulgated 14\n\n EVIDENCE GUIDE\n\n1. Critical\naspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nExplained clearly established workplace safety and hazard\ncontrol practices and procedures\n1.2\nIdentified hazards/risks in the workplace and its corresponding\nindicators in accordance with company procedures\n1.3\nRecognized contingency measures during workplace\naccidents, fire and other emergencies\n1.4\nIdentified terms of maximum tolerable limits based on\nthreshold limit value (TLV)\n1.5\nFollowed Occupational Health and Safety (OHS) procedures\nfor controlling hazards/risks in workplace\n1.6\nUsed Personal Protective Equipment (PPE) in accordance with\ncompany OHS procedures and practices\n1.7\nCompleted and updated OHS personal records in accordance\nwith workplace requirements\n2. Underpinning\nknowledge\n.1.1. OHS procedures and practices and regulations\n.1.2. PPE types and uses\n.1.3. Personal hygiene practices\n.1.4. Hazards/risks identification and control\n.1.5. Threshold limit value (TLV)\n.1.6. OHS indicators\n.1.7. Organization safety and health protocol\n.1.8. Safety consciousness\n.1.9.\nHealth consciousness\n3. Underpinning\nskills\n3.1\nPractice of personal hygiene\n.2.\nHazards/risks identification and control skills\n.3.\nInterpersonal skills\n3.4\nCommunication skills\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nWorkplace or assessment location\n4.2\nOHS personal records\n4.3\nPPE\n4.4\nHealth records\n5. Method of\nassessment\nCompetency MUST be assessed through:\n5.1\nPortfolio Assessment\n5.2\nInterview\n5.3\nCase Study/Situation\n6. Context of\nassessment\n6.1\nCompetency may be assessed in the work place or in a\nsimulated work place setting\n\n--- PDF PAGE 19 ---\nTR Tinsmithing (Automotive Manufacturing) NC II Promulgated 15\n\nCOMMON COMPETENCIES\n(AUTOMOTIVE MANUFACTURING-ASSEMBLY)\n\nUNIT OF COMPETENCY :\nPERFORM MENSURATION AND CALCULATION\n\nUNIT CODE\n: ALT311202\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes in\nmeasuring and calculating using tools and measuring\ninstrument. It also covers caring for and handling of\nmeasuring instrument.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Select\nmeasuring\ninstruments\n1.1\nObject or component to be measured is identified\n1.2\nCorrect specifications are obtained from relevant source\n1.3\nAppropriate measuring instrument is selected according to\njob requirements\n2. Carry out\nmeasurements\nand calculation\n\n2.1 Measuring tools are selected in line with job requirements\n2.2 Accurate measurements are obtained to job\n2.3 Calculation needed to complete work tasks are performed\nusing the four fundamental operation of addition (+),\nsubtraction (-), multiplication (x) and division (/).\n2.4 Calculations involving fractions, percentages and mixed\nnumbers are used to complete workplace tasks.\n2.5\nNumerical computation is self-checked and corrected for\naccuracy\n2.6\nInstruments are read to the limit of accuracy of the tool.\n3. Maintain\nmeasuring\ninstruments\n\n3.1\nMeasuring instruments are kept free from corrosion\n3.2\nMeasuring instruments are not dropped to avoid damage\n3.3\nMeasuring instruments are cleaned before and after using.\n\n--- PDF PAGE 20 ---\nTR Tinsmithing (Automotive Manufacturing) NC II Promulgated 16\n\n RANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Measuring\ninstruments\nMeasuring instruments includes:\n1.1\nMultitester\n1.2\nMicrometer (In-out, depth)\n1.3\nVernier caliper (Out, inside)\n1.4\nDial gauge with Mag. Std.\n1.5\nPlastigauge\n1.6\nStraight edge\n1.7\nThickness gauge\n1.8\nTorque gauge\n1.9\nSmall hole gauge\n1.10 Telescopic gauge\n1.11 Try square\n1.12 Protractor\n1.13 Combination gauge\n1.14 Steel rule\n2. Calculation\n\nIncludes calculation of the following:\n2.1 Volume\n2.2 Area\n2.3 Displacement\n2.4 Inside diameter\n2.5 Circumference\n2.6 Length\n2.7 Thickness\n2.8 Outside diameter\n2.9 Taper\n2.10 Out of roundness\n2.11 Oil clearance\n2.12 End play/thrust clearance\n\n--- PDF PAGE 21 ---\nTR Tinsmithing (Automotive Manufacturing) NC II Promulgated 17\n\n EVIDENCE GUIDE\n\n1. Critical\naspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1. Selected measuring instruments\n1.2. Carried-out measurements and calculations.\n1.3.\nMaintained measuring instruments\n2. Underpinning\nknowledge\n2.1\nTypes of measuring instruments and its uses\n2.2\nSafe handling procedures in using measuring instruments\n2.3\nFour fundamental operation of mathematics\n2.2\nFormula for volume, area, perimeter and other geometric figures\n3. Underpinning\n skills\n3.1\nCaring and handling measuring instruments\n3.2\nCalibrating and using measuring instruments\n3.3 Performing calculation by Addition, Subtraction, Multiplication\nand Division\n3.4 Visualizing objects and shapes\n3.5 Interpreting formula for volume, area, perimeter and other\ngeometric figures\n4. Resource\n implications\nThe following resources MUST be provided:\n4.1 Workplace location\n4.2 Measuring instrument appropriate to servicing processes\n4.3\nInstructional materials relevant to the propose activity\n5. Method of\nassessment\n\nCompetency may be assessed through:\n5.1 Observation with questioning\n5.2 Written or oral examination\n5.3 Interview\n5.4\nDemonstration with questioning\n6. Context of\nassessment\n\n6.1\nCompetency elements must be assessed in a safe working\nenvironment\n6.2\nAssessment may be conducted in a workplace or simulated\nenvironment\n\n--- PDF PAGE 22 ---\nTR Tinsmithing (Automotive Manufacturing) NC II Promulgated 18\n\nUNIT OF COMPETENCY:\nREAD, INTERPRET AND APPLY ENGINEERING\nDRAWINGS\n\nUNIT CODE : ALT742201\n\nUNIT DESCRIPTOR :\nThis unit deals with identifying, interpreting and applying\nautomotive mechanical assembly engineering manuals /\nspecifications in accordance with requirements of the job.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n\n1. Identify and\naccess\nengineering\nmanuals /\nspecifications\n\n1.1 Appropriate manuals are identified and accessed as per job\nrequirements.\n1.2 Version and date of manual is checked to ensure correct\nspecification and procedure are identified.\n\n2. Interpret\nmanuals\n\n2.1 Relevant sections, chapters of manuals/specifications are located\nin relations to the work to be conducted\n2.2 Information and procedure in the manual are interpreted in\naccordance to industry practices\n\n3. Apply\ninformation in\nmanual\n\n3.1 Manual is interpreted according to job requirements\n3.2 Work steps are correctly identified in accordance with\nmanufacturer specification\n3.3 Manual data is applied according to the given task\n3.4 All correct sequencing and adjustments are interpreted in\naccordance with information contained on the manual or\nspecifications\n\n4. Store manuals\n\n4.1 Manual or specification are stored appropriately to\n ensure prevention of damage, ready access and\n updating of information when required in accordance\n with company requirements\n\n--- PDF PAGE 23 ---\nTR Tinsmithing (Automotive Manufacturing) NC II Promulgated 19\n\n RANGE OF VARIABLES\n\nVARIABLE\nRANGE\n\n1. Manuals\n\n Kinds of manuals:\n1.1 Manufacturer’s specification manual\n1.2 Vehicle assembly manual\n1.3 Vehicle quality standard manual\n1.4 Vehicle specification manual\n\n--- PDF PAGE 24 ---\nTR Tinsmithing (Automotive Manufacturing) NC II Promulgated 20\n\n EVIDENCE GUIDE\n\n1.Critical aspects\nof competency\nAssessment requires evidence that the candidate:\n1.1 Identified and accessed manual/specification\n1.2 Interpreted manuals\n1.3 Applied information in manuals\n1.4 Stored manuals\n12 Underpinning\nknowledge\n2.1 Types of manuals used in automotive industry\n2.2 Identification of symbols used in the manuals\n3.1 Identification of units of measurements\n3.2 Unit conversion\n13 Underpinning\nskills\n3.1. Reading and comprehension skills required to identify and\ninterpret automotive manuals and specifications\n3.2.Accessing information and data\n14 Resource\nImplications\n\nThe following resources MUST be provided:\n4.1. All manuals/catalogues relative to Automotive\n4.2. Work order\n4.3. Actual vehicle or simulator\n15 Method of\nassessment\n\nCompetency MUST be assessed through:\n5.1. Observation with questioning\n5.2. Interview\n16 Context of\nassessment\n\n6.1 Assessment must be undertaken in accordance with\n the endorsed TESDA assessment guidelines\n6.2 Assessment may be conducted in the workplace or a\n simulated environment.\n\n--- PDF PAGE 25 ---\nTR Tinsmithing (Automotive Manufacturing) NC II Promulgated 21\n\nUNIT OF COMPETENCY :\nMOVE AND POSITION VEHICLE\n\nUNIT CODE\n:\nALT723202\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitude needed\nto move and position vehicle in a workshop before and after\nservicing.\n ELEMENT\n PERFORMANCE CRITERIA\n Italicized terms are elaborated in the Range of Variables\n1. Prepare\nvehicle for\ndriving\n1.1\nCheck-up procedures is performed based on vehicle\nmanufacturer standard\n2. Move and\nposition\nvehicle\n2.1\nSelect vehicle to be moved or re-position.\n2.2 Drive the vehicle to appropriate location\n2.3\nPark vehicle following parking safety techniques and\nprocedure\n3. Check the\nvehicle\n3.1 Vehicle position is checked as per required\n3.2 Vehicle is checked for external damages\n\n--- PDF PAGE 26 ---\nTR Tinsmithing (Automotive Manufacturing) NC II Promulgated 22\n\n RANGE OF VARIABLE\n\nVARIABLE\nRANGE\n1. Check-up procedure\nCheck-up procedures include the following:\n1.1\nOil level\n1.2\nBrake fluid\n1.3\nClutch fluid\n1.4\nCoolant level\n1.5\nBattery (electrolyte)\n1.6\nTire pressure\n1.7\nPosition of driving gear\n1.8\nLighting and warning devices\n2. Vehicles\n2.1 Vehicles with automatic transmission\n2.2 Vehicles with manual transmission\n3. Parking safety\ntechniques\n3.1 Engaging of park brake\n3.2 Vehicle parking position\n3.3 Front wheel position\n\n--- PDF PAGE 27 ---\nTR Tinsmithing (Automotive Manufacturing) NC II Promulgated 23\n\n EVIDENCE GUIDE\n\n1. Critical\naspects of\ncompetency\n\nAssessment requires evidence that the candidate:\n1.1\nPrepared vehicle for driving.\n1.2\nMoved and positioned vehicle\n1.3\nChecked the vehicle.\n2. Underpinning\nknowledge\nand attitudes\n2.1 Driver’s code of conduct\n2.2 Workshop signs and symbols\n2.3 Driving skills\n2.4 Vehicle accessories for safe driving and parking\n3. Underpinning\nskills\n3.1\nAbility to handle vehicle/maneuver vehicle the easiest way\n3.2\nImmediate response to accident\n3.3\nPreparing vehicle for driving\n3.4\nParking downhill, uphill, parallel\n3.5\nShifting gears\n3.6\nManeuvering\n4. Resource\n implications\nThe following resources MUST be provided:\n4.1\nDriving range/area\n4.2\nAppropriate vehicle for driving\n4.3\nVehicle accessories\n5. Method of\nassessment\nCompetency MUST be assessed through:\n5.1\nObservation with questioning\n5.2\nWritten or oral examination\n6. Context of\nassessment\n6.1\nAssessment must be undertaken in accordance with the\nendorsed TESDA assessment guidelines\n6.2\nAssessment of practical skills must be done in a workplace or\nsimulated environment.\n\n--- PDF PAGE 28 ---\nTR Tinsmithing (Automotive Manufacturing) NC II Promulgated 24\n\nUNIT OF COMPETENCY :\nAPPLY APPROPRIATE SEALANT/ADHESIVE\n\nUNIT CODE :\nALT723201\n\nUNIT DESCRIPTOR\n:\nThis competency unit covers the selection and\napplication of sealant/adhesives.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Identify\nappropriate\nsealant /\nadhesive\n1.1 Sealant/adhesive is selected in line with job\n requirements and manufacturer’s specification\n1.2 Sealant/adhesive checking is performed to ensure that\nproduct is fit for use.\n2. Prepare\nsurface for\nsealant /\nadhesive\napplication\n2.1 Surface materials are identified as per construction\n2.2 Surface is cleaned and free of moisture, dust and other\n foreign matters to ensure maximum adhesion or seal.\n3. Apply\nSealant /\nadhesive\n evenly\n3.1 Sealant/adhesive is applied evenly on the surface in line\n with manufacturer’s specification\n3.2 Excess sealant/adhesive is removed by sanding or\n scrapping\n\n3.3 Tools and equipment used to apply sealant/adhesive are\nappropriate to job requirements\n3.6 Safety are observed and PPE are worn in accordance with\nindustry SOP\n3.7 Hazards associated with the use of sealant and adhesives are\nidentified.\n4. Store /\nDispose of\nsealant /\nadhesive\n4.1 Sealant/adhesive are stored as per prescribed procedure\n4.2 Waste are disposed as per workshop SOP\n\n--- PDF PAGE 29 ---\nTR Tinsmithing (Automotive Manufacturing) NC II Promulgated 25\n\n RANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Sealant/Adhesive\nSealant/adhesive includes:\n1.1Form in Place Gasket (FIPG)\n1.2 Ribbon Sealer\n1.3Hametite\n1.4Silicon Body sealer\n1.5 Prestite for Auto and Auto Aircon\n2.Adhesive/Sealant\n checking\n\nAdhesive/Sealant checking includes:\n2.1 Expiry date\n2.2 Free of contamination\n2.3 Cap/Covers\n2.4 Tightly closed\n2.5 Concentration\n3. Tools and\nequipment\nTools and equipment include:\n3.1 Putty knife\n3.2 Scraper\n3.3 Compressor\n3.4 Steel brush\n3.5 Paint brush\n3.6 Rubber hammer\n3.7 Hand tools\nPersonal protective equipment include:\n3.8 Gloves\n3.9 Apron\n3.10 Safety shoes\n3.11Goggles\n3.12Gas mask\n4. Safety\nSafety includes:\n4.1 Ventilation\n4.2 Handling of Flammable/Irritating substances\n4.3 Use of Personal Protective Equipment\n5. Hazards\n Hazard includes:\n5.1 Fumes\n5.2 Skin irritation\n5.3 Burns\n\n--- PDF PAGE 30 ---\nTR Tinsmithing (Automotive Manufacturing) NC II Promulgated 26\n\n EVIDENCE GUIDE\n\n1. Critical\naspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Identified appropriate sealant/adhesives\n1.2 Prepared surface for sealant/adhesive\n1.3 Applied sealant/adhesive\n1.4 Stored unused or dispose of used sealant/adhesive\n2. Underpinning\nknowledge\nand attitude\n2.1 OH & S regulations\n2.2 Safe handling of sealant/adhesive\n2.3 Industry code of practice\n2.3 Procedures in sealant/adhesive application\n2.4 Procedures in interpreting manuals\n3. Underpinning\nskills\n3.1 Handling sealant/adhesive\n3.2 Applying sealant/adhesive\n3.3. Sanding the surface\n3.4 Use of tools, equipment\n3.5 Mixing of body filler and epoxy base and hardener\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Materials relevant to the activity\n4.2 Appropriate tools and equipment\n4.3 Real or simulated workplace\n5. Method of\nassessment\nCompetency MUST be assessed through\n5.1 Observation with questioning\n5.2 Interview related to:\n• Safe and correct use of tools and equipment\n• Application of adhesive/sealant\n6. Context of\nassessment\n6.1 Competency elements must be assessed in a safe\n working environment\n6.2 Assessment may be done in a workplace or simulated\nenvironment\n\n--- PDF PAGE 31 ---\nTR Tinsmithing (Automotive Manufacturing) NC II Promulgated 27\n\nUNIT OF COMPETENCY : PERFORM SHOP MAINTENANCE\n\nUNIT CODE : ALT723205\n\nUNIT DESCRIPTOR : This unit deals with inspecting and cleaning of work area\nincluding tools, equipment and facilities. Storage and\nchecking of tools/equipment and disposal of used\nmaterials are also incorporated in this competency\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Inspect/clean tools\nand work area\n.1.1 Cleaning solvent used as per workshop/tools\n cleaning requirement\n\n1.2 Work area is checked and cleaned\n\n1.3 Wet surface/spot in work area is wiped and dried\n2. Store/arrange tools\nand shop\nequipment\n\n1.5 Tools/equipment are checked and stored in their\n respective shelves/location\n\n2.2 Corresponding labels are posted and visible\n\n2.3 Tools are safely secured and logged in the records\n3. Dispose\nwastes/used\nlubricants\n3.1 Containers for used lubricants are visibly labeled\n\n3.2 Wastes/used lubricants are disposed as per\n workshop SOP\n4. Report damaged\ntools/equipment\n\n4.1 Complete inventory of tools/equipment is maintained\n\n4.2 Damaged tools/equipment/facilities are identified and\n repair recommendation is given\n\n4.3 Reports prepared has no error/discrepancy\n\n--- PDF PAGE 32 ---\nTR Tinsmithing (Automotive Manufacturing) NC II Promulgated 28\n\n RANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Cleaning\n requirement\n1.1 Cleaning solvent\n1.2 Inventory of supplies, tools, equipment, facilities\n1.3 List of mechanics/technicians\n1.4 Rags\n1.5 Broom\n1.6 Map\n1.7 Pail\n1.8 Used oil container\n1.9 Oiler\n1.10 Dust/waste bin\n2. Work Area\nWork areas include:\n2.1 Workshop areas for assembly of automotive vehicle and/or\noutdoor power equipment\n2.2 Open workshop and enclosed, ventilated office area\n2.3 Other variables may include workshop with:\n• Mess hall\n• Wash room\n•\nComfort room\n\n--- PDF PAGE 33 ---\nTR Tinsmithing (Automotive Manufacturing) NC II Promulgated\n- 29 -\n\n EVIDENCE GUIDE\n\n1. Critical\naspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Cleaned workshop tools/facilities\n1.2 Maintained equipment, tools and facilities\n1.3 Disposed wastes and used lubricants/fluid as per required\n procedure\n2. Underpinning\nknowledge\nand attitudes\n2.1 5S or TQM\n2.2 Service procedures\n2.3 Relevant technical information\n2.4 Safe handling of Equipment and tools\n2.5 Vehicle safety requirements\n2.6 Workshop policies\n2.7 Personal safety procedures\n2.8 Fire Extinguishers and prevention\n2.9 Storage/Disposal of Hazardous/flammable materials\n2.10 Positive Work Values (Perseverance, Honesty, Patience,\n Attention to Details)\n3. Underpinning\nskills\n3.1 Handling/Storing of tools/equipment/supplies and material\n3.2 Cleaning grease/lubricants\n3.3 Disposing of wastes and fluid\n3.4 Preparing inventory of s/m and tools and equipment\n3.5 Monitoring of s/m and tools/equipment\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Workplace: Real or simulated work area\n4.2 Appropriate Tools & equipment\n4.3 Materials relevant to the activity\n5. Method of\nassessment\nCompetency MUST be assessed through:\n5.1 Written/Oral Questioning\n5.2 Demonstration\n5.3 Assessment of underpinning knowledge and practical skills\n may be combined.\n6. Context of\nassessment\n6.1 Competency must be assessed on the job or\n simulated environment.\n6.2 The assessment of practical skills must take place after a\n period of supervised practice and repetitive experience.\n\n--- PDF PAGE 34 ---\nTR Tinsmithing (Automotive Manufacturing) NC II Promulgated\n\n-30-\n\nCORE COMPETENCIES\n\nUNIT OF COMPETENCY : WELD AND BRAZE AUTOMOTIVE BODY SHELL\n\nUNIT CODE\n\n: ALT827314\n\nUNIT DESCRIPTOR : This unit covers the skills knowledge and attitudes required to\nperform welding and brazing operation including repair of defects on\nautomotive body shells.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n\n1. Prepare body shell\nfor welding and\nbrazing operation\n\n1.1 Tools, equipment and PPEs are selected and prepared in\naccordance with standard operating procedures.\n1.2 Body shell is checked for compliance with job requirement\n1.3 Corrective measures are undertaken to rectify body shell errors\nand defects in accordance with standard operating procedures\n1.4 Body shell is prepared based on standard operating procedure\n2. Perform welding\n2.1 Areas/Sections for welding are identified based on the standards/\njob specification requirements\n2.2 Welding is applied to designated areas/sections based on the\nstandard welding procedure\n2.3 Safety standards are followed in accordance with Occupational\nHealth and Safety (OHS) requirements\n3. Perform Brazing\n3.1 Brazing tools, equipment and materials are prepared in\naccordance with the job requirements\n3.2 Areas/Sections for brazing are identified based on the standards/\njob specification requirements\n3.3 Appropriate brazing jigs are installed in accordance with the job\nrequirements\n3.4 Brazing is applied to designated areas/sections based on the\ncompany standard\n3.5 Brazed areas are ground and polished to the required finish in\naccordance with company standards\n3.6 Safety standards are followed in accordance with Occupational\nHealth and Safety (OHS) requirements\n\n--- PDF PAGE 35 ---\nTR Tinsmithing (Automotive Manufacturing) NC II Promulgated\n31\n\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n\n1. Tools and Equipment\n\n1.1 Welding Machine (MIG)\n1.2 Pneumatic sander and grinder\n1.3 File and rubber mallets\n1.4 Pneumatic impact gun\n1.5 Measuring equipment/ instrument for clearances and\nalignments\n\n2. Personal Protective\nEquipment\n\nWearing of personal protective equipment include:\n2.1 cotton gloves\n2.2 apron\n2.3 goggles\n2.4 safety shoes\n\n3. Body shell\n\n1.1 Passenger vehicle\n1.2 Commercial vehicle\n1.3 Light truck\n\n4. Defects\nDefects and damages include but not limited to:\n4.1 excess weld and metal\n4.2 dents and wavy metal\n4.3 sanding and/or file marks\n4.4 poor brazing\n4.5 lack of welding\n4.6 poor or incomplete weld\n4.6 poor clearance and misalignment of skin panels\n\n--- PDF PAGE 36 ---\nTR Tinsmithing (Automotive Manufacturing) NC II Promulgated\n32\n\nEVIDENCE GUIDE\n1. Critical aspect of\ncompetency\nThe Assessment requires evidence that the candidate :\n1.1 Prepared body shell for welding and brazing\n1.2 Performed welding\n1.3 Performed brazing\n1.4 Finished body shell by grinding and polishing\n1.5 Followed standard safety procedure in the workplace\n2. Underpinning\nknowledge and\nattitudes\n2.1 Standard Operating Procedure of Welding and Brazing\n2.2 Standard Preventive Maintenance of tools and equipment\nrelevant to operation\n2.3 Welding and brazing areas/ sections in body shell\n2.4 Defects in body shell\n2.5 Techniques and procedures in rectifying welding/brazing defects\n2.6 Tools and procedures used in grinding and polishing body shells\n2.7 Safety standards and housekeeping in the workplace\n2.8 Shop communication procedures and systems\n2.9 Work in team environment\n3. Underpinning skills\n3.1 Interpret standard information regarding the operation\n3.2 Handling hand and pneumatic/power tools\n3.3 Organizing and planning work activities\n3.4 Using measuring equipment/instrument\n4. Resource implication\nThe following resources must be provided:\n4.1 Adequate working area for Welding and Brazing\n4.2 Welding machine (MIG), accessories and supplies\n4.3 Pneumatic sander, grinder, and polisher\n4.4 Pneumatic impact gun\n4.5 Standard jigs\n4.6 Body shell\n4.7 PPE\n5. Method of\nassessment\nCompetency must be assessed through:\n5.1 Direct observation while the tasks are being performed\n5.2 Demonstration with questioning\n5.2 Written examination\n6. Context of\nassessment\nCompetency assessment may be conducted in the workplace or\nsimulated environment\n\n--- PDF PAGE 37 ---\nTR Tinsmithing (Automotive Manufacturing) NC II Promulgated\n33\n\nUNIT OF COMPETENCY: PERFORM TINSMITH OPERATION\n\nUNIT CODE\n\n: ALT827314\n\nUNIT DESCRIPTOR : This unit covers the skills, knowledge and attitudes required to install\nskin panels and perform metal finishing operation in automotive\nmanufacturing.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n\n1. Install skin\npanels\n\n1.1 Tools and equipment are selected and prepared in accordance with\nstandard operating procedures\n1.2 Skin panels are checked for compliance with the job requirement\n1.3 Skin panels are installed based on company standards procedures\n1.4 Task is performed using appropriate PPE and without incurring damage\nto the body shell and skin panels\n\n2. Inspect installed\nskin panels\n\n2.1 Clearances and alignments of installed skin panels are checked for\ncompliance with work specification\n2.2 Bolt fitting of panel parts is checked based on company standard\n2.3 Corrective measures are undertaken to rectify incorrect clearances\nand/or misalignment\n\n3. Perform metal\nfinishing\noperation\n\n3.1 Inspect the main body shell based on the standard inspection procedure\n3.2 Defects and/or damages are detected and marked or labeled after\ninspection in accordance with standard company procedures\n3.3 Metal finishing operation is performed based on company standard\n3.4 Finished main body shell is 100% free of any defects and damages\n\n--- PDF PAGE 38 ---\nTR Tinsmithing (Automotive Manufacturing) NC II Promulgated\n34\n\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n\n1. Tools and Equipment\n\n1.1 Pneumatic impact range\n1.2 File and Pry Bar\n1.3 Rubber Mallet\n1.4 Set of Wrench\n1.5 Set of Sockets\n1.6 Measuring Equipment for clearance and alignment\n1.7 Pneumatic Sander\n1.8 Standard Jigs\n\n2. Skin panels\n\nAutomotive skin panels includes:\n2.1 LH (Left hand) and RH (Right hand) Door Panel\n2.2 LH (Left hand) and RH (Right hand) Fender\n2.3 Trunk lid and Hood Panel\n\n3. Body shell\n\nBody shell model include\n3.1 Passenger vehicle\n3.2 Commercial vehicle\n3.3 Light truck\n\n4. Defects and Damages\n\n4.1 Poor skin panel alignment\n4.2 Off-standard clearances of skin panel\n4.3 Dent and wavy metal defects\n4.4 Deep sanding mark\n4.5 Deep file mark\n\n5. Metal finishing operation\n\n5.1 Bumping\n5.2 Grinding\n5.3 Dent fixing\n5.4 Polishing using wire brush\n\n--- PDF PAGE 39 ---\nTR Tinsmithing (Automotive Manufacturing) NC II Promulgated\n35\n\nEVIDENCE GUIDE\n\n1. Critical aspect of\ncompetency\nThe Assessment requires evidence that the candidate:\n\n1.1 Inspected and installed skin panels\n1.2 Checked alignment and clearances of installed skin panels and\nrectified incorrect clearance and /or misalignment\n1.3 Performed metal finishing operation\n1.4 Maintained tools and equipment and stored on designated area\n1.5 Wore personal protective equipment\n1.6 Cleaned and organized working area\n\n2. Underpinning\nknowledge and\nattitude\n\n2.1 Vehicle models and their corresponding skin panels\n2.2 Causes of incorrect skin panel clearance and misalignment\n2.3 Shell body defects and damages and corrective measures\n2.4 Standard Operating Procedure of panel Installation\n2.5 Standard Preventive Maintenance of all tools and equipment\n2.6 Standard safety procedure of the operation\n2.7 Tinsmithing procedures\n2.8 Metal finishing procedures\n\n3. Underpinning skills\n\n3.1 Handling tools and equipment used in skin panel installation and\ntinsmith operation\n3.2 Interpreting standard information regarding the operation\n3.3 Using inspection/ measuring instruments\n\n4. Resource Implication\n\nThe following resources must be provided:\n4.1 Adequate working area for tinsmith Operation\n4.2 Tools and equipment appropriate for the activity (jigs, pneumatic\nimpact gun, sander and steel brush, pry bar and file, etc.)\n4.3 Skin panels and body shell\n4.4 Documents and other relevant reference\n4.5 Personal protective equipment: (safety shoes, gloves, goggles,\nmask)\n\n5. Method of\nAssessment\nCompetency must be assessed through:\n\n5.1 Direct observation while the tasks are being performed\n5.2 Demonstration with questioning\n5.3 Written examination\n5.4 Third party\n5.5 Portfolio\n\n6. Context of\nAssessment\n\nCompetency assessment is conducted in the workplace or in\nsimulated environment\n\n--- PDF PAGE 40 ---\nTR Tinsmithing (Automotive Manufacturing) NC II Promulgated\n36"
