  "source_text": "SECTION 4\nNATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1 To attain the National Qualification of Metal Stamping NC II, the candidate must\ndemonstrate competence in all the units of competency listed in Section 1.\nSuccessful candidates shall be awarded a National Certificate signed by the TESDA\nDirector General.\n\n4.2 Individual aspiring to be awarded the qualification of Metal Stamping NC II must\nacquire Certificates of Competency (COC) in all the following core units of the\nQualification. Candidates may apply for assessment in any accredited assessment\ncenter.\n\n4.2.1\nPerform Press Machine Setting\n4.2.2\nPerform Mechanical Shearing Operation\n4.2.3\nPerform Mechanical Press Forming Operation\n\n4.3 Upon accumulation and submission of all COCs acquired for the relevant units of\ncompetency comprising a qualification, an individual shall be issued the\ncorresponding National Certificate.\n\n4.4 Assessment shall focus on the core units of competency. The basic and common\nunits shall be integrated or assessed concurrently with the core units.\n\n4.5 The following are qualified to apply for assessment and certification:\n\n4.5.1\nGraduates of formal, non-formal and informal including enterprise-\nbased training programs.\n\n4.5.2\nExperienced workers (wage employed or self employed)\n\n4.6 The guidelines on assessment and certification are discussed in detail in the\n\"Procedures Manual on Assessment and Certification\" and \"Guidelines on the\nImplementation of the Philippine TVET Qualification and Certification System\n(PTQCS)\".\n\n--- PDF PAGE 49 ---\nTR METAL STAMPING NC II\nPromulgated\n\n47\nCOMPETENCY MAP- AUTOMOTIVE SECTOR\nMANUFACTURING SUB-SECTOR\n(Parts Manufacturing)\nMETAL STAMPING NC II\nLegend:\nANNEX A\nCOMMON\nCOMPETENCIES\nReceive and\nrespond workplace\ncommunication\nParticipate in\nworkplace\ncommunication\nLead in workplace\ncommunication\nUtilize specialist\ncommunication skills\nWork in team\nenvironment\nDevelop team\n and individual\nSolve workplace\nproblems related\nto work activities\nWork with Other\nLead small Team\nApply problem\nsolving techniques\nin the workplace\nPlan and\norganize work\nBASIC\nCOMPETENCIES\nDemonstrate\nwork values\nPractice basic\n housekeeping\nprocedures\nPractice career\nprofessionalism\nPractice occupational\nhealth and safety\n procedures\nDevelop and\npractice negotiation\nskills\nUse mathematical\nconcepts and\n techniques\nUse relevant\n technologies\nRead & Interpret\nEngineering Drawings\nPerform Mensuration\nand Calculation\nRead, Interpret and\nApply Specifications\nand Manuals\nPerform Shop\nMaintenance\n-\nCORE COMPETENCIES\nDevelop and\nManufacture Wood\nPattern\nDevelop and\nManufacture Polymer\nPattern\nDevelop and\nManufacture Assembled\nPlated Pattern\nDevelop and\nManufacture Production\nPattern\nPerform General\nWoodworking Machine\nOperations\nUse and Maintain\nMeasuring Instrument\nPrepare & Mix Sand for\nMetal Molding\nProduce Molds by Hand\nProduce Cores by Hand\nOperate Molding\nMachine\nOperate Core-Making\nMachine\nPour Molten Metal to\nMolds\nOperate Melting\nFurnaces (non-electric)\nOperate Cupola Melting\nFurnace\nOperate Electric\nInduction Melting\nFurnace\nFettle & Trim Metal\nCastings/Forgings\nPerform Refractory\nInstallation & Repair\nMelt Aluminum-\nSilicon Alloys for\nSafety Tested\nCastings\nMelt Metals Using\nCoreless Induction\nFurnace\nMelt Automotive Gray\nIron Castings in Cupola\nPrepare Sand Mixture\nfor Heavy Casting\nPour Molten Metal\nto Heavy Castings\n\nManufacture and\ndevelop corebox for\nShell Core Box\nDevelop and\nManufacture Gear,\nConveyor Screw and\nDevelop Gravity Die\nCasting Mold\nUse Comparison and Basic\nMeasuring Devices\nMeasure Components\nUsing Coordinate\nMeasuring Machines\nUse Graphical Techniques\nand Perform Simple\nStatistical Computations\nConduct Product\nand/or Process\nCapability Studies\nMaintain/Supervise the\nApplication of Quality\nProcedures\nPerform Mechanical\nPress Forming\nOperation\nChange\nEquipment Dies\nPerform Press Machine\nSetting\nMachine Parts\nPerform Precision\nAssembly\nPerform Mechanical\nShearing Operation\nApply Quality\nSystems\nPerform Hand Forging\nPerform Hammer Forging\nPerform Basic Incidental\nHeat/Quenching,\nTempering and\nAnnealing\nHammer Forge\nComplex Shapes\nPerform Drop and Upset\nForging\nSelect Heat\nTreatment Process\nPerform Heat\nTreatment Process\nHand Forge Complex\nShapes\nPerform Hand Molding\nto Produce Heavy\nCasting\nProduce Injection\nMolded Products\nProduce Blow\nMolded Products\nPrepare and Start\nEquipment for\nProduction\nSelect and Control\nInspection Processes\nand Procedures\nPerform Precision\nMechanical\nMeasurement\nCalibrate Measuring\nEquipment\nPerform Inspection\nPerform Engineering\nMeasurement\nPerform Basic\nStatistical Quality\nControl\nUse Improvement\nProcesses in Team\nActivities\nOperate injection\nMolding Equipment\nPrepare Materials for\nFormulae\n\nAssemble Materials and\nEquipment for\nProduction\nOperate Blow Molding\nEquipment\nPrepare Molds for\nComposites Production\nMonitor Process\nOperations\nFinish Products and\nComponents\n\n--- PDF PAGE 50 ---\nTR METAL STAMPING NC II\nPromulgated\n\n48\nDefinition of Terms\n\n1.\nPress\nA machine by which pressure is applied to a workpiece to\ncut, pierce, bend or shape it\n2.\nDie\nA tool used to impart shapes to or to form impressions on\nsheet metal\n3.\nBlanking\nA press operation wherein metal sheets are cut into shapes\nby striking with a punch\n4.\nBending\nA press operation that involves forming a metal part into a\ncurved or angular shape, or the stretching or flanging of it\nalong a curved path\n5.\nDrawing\nA press operation that forces plastic deformation of metal in\na die to form recessed parts or cuplike shapes\n6.\nDrawing die\nA die that forms sheet metal into cuplike, wrinkle-free\nshapes\n7.\nFeed stock\nThe raw material furnished to a press machine to form or\nshape the metal\n8.\nTrimming\nRemoving excess materials from drawn or blanked part\n9.\nPunching\nA piece removed from a sheet metal or other material by a\npunch press\n10.\nRam\nA plunger, weight or other guided structure for exerting\npressure by impact\n11\nShearing\nShearing is a metalworking process which cuts stock without\nthe formation of chips or the use of burning or melting.\nStrictly speaking, if the cutting blades are straight the\nprocess is called shearing; if the cutting blades are curved\nthen they are shearing-type operations.[1] The most\ncommonly sheared materials are in the form of sheet metal\nor plates, however rods can also be sheared. Shearing-type\noperations include: blanking, piercing, roll slitting, and\ntrimming.\n12\nPiercing\nPiercing is a shearing process where a punch and die are\nused to create a hole in sheet metal or a plate. The process\nand machinery are usually the same as that used in blanking,\nexcept that the piece being punched out is scrap in the\npiercing process.[1] There are many specialized types of\npiercing: lancing, perforating, notching, nibbling, shaving,\ncutoff, and dinking.\n\n--- PDF PAGE 51 ---\nTR METAL STAMPING NC II\nPromulgated\n\n49\nACKNOWLEDGEMENT\n\nThe Technical Education and Skills Development Authority (TESDA) wishes to extend\nthanks and appreciation to the many representatives of business, industry, academe and\ngovernment agencies who rendered their time and expertise to the development and\nvalidation of this Training Regulation.\n\nTHE TECHNICAL AND INDUSTRY EXPERT PANEL\nMETAL STAMPING\nAntonio A. Gimenez\nPhilippine Automotive\nFederation, Inc. (PAFI)\n\nCesar R. Leal\nPhilippine Automotive\nFederation, Inc. (PAFI)\n\nElmo N. Serbito\nPAFI (Samahan ng mga\nManggagawang Supercast)\n\nCarina J. Bondad\n(Administrative Staff)\nThe PARTICIPANTS in the National Validation of this Training Regulation\n• (Supercast Foundry &\nMachinery Corp.\nSFMC)\n\n• Philippine Aluminum Wheels\nInc. (PAWI)\n\n• Toyota Auto Parts Phils. Inc.\n\nMembers of the TESDA Board\nThe MANAGEMENT and STAFF of the TESDA Secretariat\nTESDA EXCOM\nQualification and Standards Office\nFlorante P. Inoturan\nAgnes P. Panem\nAbel B. Elpedes"
