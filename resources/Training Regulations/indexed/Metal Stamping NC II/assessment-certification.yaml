      "text": "6 The guidelines on assessment and certification are discussed in detail in the \"Procedures Manual on Assessment and Certification\" and \"Guidelines on the Implementation of the Philippine TVET Qualification and Certification System (PTQCS)\". --- PDF PAGE 49 --- Promulgated 47 (Parts Manufacturing) Legend: Receive and respond workplace communication Participate in workplace communication Lead in workplace communication Utilize specialist communication skills Work in team environment Develop team and individual Solve workplace problems related to work activities Work with Other Lead small Team Apply problem solving techniques in the workplace Plan and organize work Demonstrate work values Practice basic housekeeping procedures Practice career professionalism Practice occupational health and safety procedures Develop and practice negotiation skills Use mathematical concepts and techniques Use relevant technologies Read & Interpret Engineering Drawings Perform Mensuration and Calculation Read, Interpret and Apply Specifications and Manuals Perform Shop Maintenance - Develop and Manufacture Wood Pattern Develop and Manufacture Polymer Pattern Develop and Manufacture Assembled Plated Pattern Develop and Manufacture Production Pattern Perform General Woodworking Machine Operations Use and Maintain Measuring Instrument Prepare & Mix Sand for Metal Molding Produce Molds by Hand Produce Cores by Hand Operate Molding Machine Operate Core-Making Machine Pour Molten Metal to Molds Operate Melting Furnaces (non-electric) Operate Cupola Melting Furnace Operate Electric Induction Melting Furnace Fettle & Trim Metal Castings/Forgings Perform Refractory Installation & Repair Melt Aluminum- Silicon Alloys for Safety Tested Castings Melt Metals Using Coreless Induction Furnace Melt Automotive Gray Iron Castings in Cupola Prepare Sand Mixture for Heavy Casting Pour Molten Metal to Heavy Castings Manufacture and develop corebox for Shell Core Box Develop and Manufacture Gear, Conveyor Screw and Develop Gravity Die Casting Mold Use Comparison and Basic Measuring Devices Measure Components Using Coordinate Measuring Machines Use Graphical Techniques and Perform Simple Statistical Computations Conduct Product and/or Process Capability Studies Maintain/Supervise the Application of Quality Procedures Perform Mechanical Press Forming Operation Change Equipment Dies Perform Press Machine Setting Machine Parts Perform Precision Assembly Perform Mechanical Shearing Operation Apply Quality Systems Perform Hand Forging Perform Hammer Forging Perform Basic Incidental Heat/Quenching, Tempering and Annealing Hammer Forge Complex Shapes Perform Drop and Upset Forging Select Heat Treatment Process Perform Heat Treatment Process Hand Forge Complex Shapes Perform Hand Molding to Produce Heavy Casting Produce Injection Molded Products Produce Blow Molded Products Prepare and Start Equipment for Production Select and Control Inspection Processes and Procedures Perform Precision Mechanical Measurement Calibrate Measuring Equipment Perform Inspection Perform Engineering Measurement Perform Basic Statistical Quality Control Use Improvement Processes in Team Activities Operate injection Molding Equipment Prepare Materials for Formulae Assemble Materials and Equipment for Production Operate Blow Molding Equipment Prepare Molds for Composites Production Monitor Process Operations Finish Products and Components --- PDF PAGE 50 --- Promulgated 48 Definition of Terms 1. Press A machine by which pressure is applied to a workpiece to cut, pierce, bend or shape it 2. Die A tool used to impart shapes to or to form impressions on sheet metal 3. Blanking A press operation wherein metal sheets are cut into shapes by striking with a punch 4. Bending A press operation that involves forming a metal part into a curved or angular shape, or the stretching or flanging of it along a curved path 5. Drawing A press operation that forces plastic deformation of metal in a die to form recessed parts or cuplike shapes 6. Drawing die A die that forms sheet metal into cuplike, wrinkle-free shapes 7. Feed stock The raw material furnished to a press machine to form or shape the metal 8. Trimming Removing excess materials from drawn or blanked part 9. Punching A piece removed from a sheet metal or other material by a punch press 10. Ram A plunger, weight or other guided structure for exerting pressure by impact 11 Shearing Shearing is a metalworking process which cuts stock without the formation of chips or the use of burning or melting. Strictly speaking, if the cutting blades are straight the process is called shearing; if the cutting blades are curved then they are shearing-type operations.[1] The most commonly sheared materials are in the form of sheet metal or plates, however rods can also be sheared. Shearing-type operations include: blanking, piercing, roll slitting, and trimming. 12 Piercing Piercing is a shearing process where a punch and die are used to create a hole in sheet metal or a plate. The process and machinery are usually the same as that used in blanking, except that the piece being punched out is scrap in the piercing process.[1] There are many specialized types of piercing: lancing, perforating, notching, nibbling, shaving, cutoff, and dinking. --- PDF PAGE 51 --- Promulgated 49 The Technical Education and Skills Development Authority (TESDA) wishes to extend thanks and appreciation to the many representatives of business, industry, academe and government agencies who rendered their time and expertise to the development and validation of this Training Regulation. Antonio A. Gimenez Philippine Automotive Federation, Inc. (PAFI) Cesar R. Leal Philippine Automotive Federation, Inc. (PAFI) Elmo N. Serbito PAFI (Samahan ng mga Manggagawang Supercast) Carina J. Bondad (Administrative Staff) The PARTICIPANTS in the National Validation of this Training Regulation • (Supercast Foundry & Machinery Corp. SFMC) • Philippine Aluminum W