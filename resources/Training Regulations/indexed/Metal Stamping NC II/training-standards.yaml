    "source_text": "3.1 CURRICULUM DESIGN\n\nCourse Title: METAL STAMPING\n\nNC Level: NC II\n\nNominal Training Duration:\n18 Hours (Basic Competencies)\n20 Hours (Common Competencies)\n256 Hours (Core Competencies)\n\nThis qualification is designed to develop knowledge, desirable attitudes and skills\nin Metal Stamping NC II Qualification specifically to set up, conduct trial run and operate\nmechanical press; perform mechanical shearing operation which applies to a range of\npress operations including blanking, cutting-off, piercing/punching, trimming and\nbending; and perform mechanical press forming operation which applies to a range of\npress forming operations including piercing/punching, trimming, and forming/drawing.\nBasic competencies such as: Participate in workplace communication; Work in a\nteam environment; Practice career professionalism; and Practice occupational health\nand safety are included.\nIt also includes common competencies such as: Read, Interpret and Apply\nEngineering Drawings; Perform Mensuration and Calculation Read; Interpret and Apply\nSpecifications and Manuals and; Perform Shop Maintenance.\n To obtain this, all units of competency prescribed for this qualification must be\nachieved.\n\nBASIC COMPETENCIES\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and convey\n workplace information.\n1.2 Complete relevant work\n related documents.\n1.3 Participate in workplace\n meeting and discussion\n• Group discussion\n• Interaction\n• Lecture\n• Reportorial\n\n• Written test\n• Practical/\nperformance test\n• Interview\n2. Work in a team\nenvironment\n2.1 Describe and identify\nteam role and\nresponsibility in a team.\n2.2 Describe work as a team\nmember.\n• Group discussion\n• Case studies\n• Simulation\n\n• Written test\n• Observation\n• Simulation\n• Role playing\n•Case studies\n\n--- PDF PAGE 42 ---\nTR METAL STAMPING NC II\nPromulgated\n\n40\n3. Practice career\nprofessionalism\n3.1Integrate personal\nobjectives with\norganizational goals.\n3.2 Set and meet work\npriorities.\n3.3 Maintain professional\ngrowth & development.\n• Group Discussion\n• Interaction\n• Simulation\n• Demonstration\n• Self-paced\ninstruction\n• Structured activity\n•Film viewing\n• Role playing\n• Interview\n• Written\nexamination\n• Portfolio\n4. Practice\noccupational\nhealth and\nsafety\n4.1 Evaluate hazard and\nrisks\n4.2 Control hazards and risks\n4.3 Maintain occupational\nhealth and safety\nawareness\n• Interactive-lecture\n• Simulation\n• Symposium\n• Group dynamics\n• Film viewing\n• Situation analysis\n• Self-paced\ninstruction\n• Situation\nanalysis\n• Interview\n• Practical\nexamination\n• Written\nexamination\n\nCOMMON COMPETENCIES\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Read, Interpret\nand Apply\nEngineering\nDrawings\n1.1 Identify and access\nengineering drawings/\nspecification\n1.2.Interpret drawings\n1.3.Apply information in the\ndrawings & specifications\n1.4 Store drawings\n• Lecture/\nDemonstration\n• Dual training\n• Practical\nexercises\n\n• Direct\nobservation\n• Written\nexamination\n• Oral\nexamination\n2. Perform\nMensuration\nand Calculation\n2.1. Select measuring\ninstrument\n2.2 Carry out\nmeasurement and\ncalculations.\n2.3. Maintain measuring\ninstruments\n• Demonstration\n• Practical\nexercises\n\n• Written test\n• Oral\nquestioning\n• Direct\nobservation\n3. Read, Interpret\nand Apply\nSpecifications\nand Manual\n3.1 Identify/accessed\nmanuals and interpret\ndata and specification\n3.2 Apply information\naccessed in manual\n3.3 Store manual\n• Lecture/\nDemonstration\n• Dual training\n• Distance\nLearning\n• Written test\n• Direct\nobservation\n• Project method\n• Interview\n\n--- PDF PAGE 43 ---\nTR METAL STAMPING NC II\nPromulgated\n\n41\n\n4. Perform Shop\nMaintenance\n\n4.1 Inspect/clean tools and\nwork area\n4.2 Store/arrange tools and\nshop equipment\n4.3 Dispose wastes/used\nlubricants\n4.4 Report damaged\ntools/equipment\n• Lecture/\nDemonstration\n• Dual training\n• Self paced\n(modular)\n• Simulation\n• Interactive\nlecture\n• Written test\n• Direct\nobservation\n• Demonstration\n• Interview\n\nCORE COMPETENCIES\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n\n1. Perform press\nmachine setting\n1.1 Set up die on the press\nmachine\n1.2 Conduct trial run\n1.3 Replace worn/damaged\ntooling or dies\n• Lecture\n• Demonstration\n• Dualized\ntraining\n•Distance\n• Direct\nObservation\n• Written test\n• Demonstration\n•Portfolio\n2. Perform\nmechanical\nshearing\noperations\n2.1 Secure job order, part\ndrawings and instructions\n2.2 Conduct machine settings\nand set-up checks\n2.3 Select steel feed stock\nmaterials\n2.4 Perform shearing press\noperations\n2.5 Monitor machine operation\n• Demonstration\nDiscussion\n• Dualized\ntraining\n• Distance\nlearning\n\n• Direct\nObservation\n• Written or oral\nexamination\n• Demonstration\n• Portfolio\n• Third party\nreport\n3. Perform\nmechanical\npress forming\noperations\n3.1 Secure job order, part\ndrawings and instructions\n3.2 Conduct machine settings\nand set-up checks\n3.3 Inspect delivered steel\nfeed stock materials\n3.4 Perform press operations\n3.5 Monitor machine operation\n• Lecture\n• Demonstration\nDiscussion\n• Dualized\ntraining\n• Distance\nlearning\n\n• Direct\nObservation\n• Written or oral\nexamination\n• Demonstration\n• Portfolio\n\n--- PDF PAGE 44 ---\nTR METAL STAMPING NC II\nPromulgated\n\n42"
