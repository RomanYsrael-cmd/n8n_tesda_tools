    "source_text": "SECTION 3. TRAINING STANDARDS\n\nThese guidelines are set to provide the Technical and Vocational Education and\nTraining (TVET) providers with information and other important requirements to consider\nwhen designing training programs for Metal Stamping NC II.\n\n3.1 CURRICULUM DESIGN\n\nCourse Title: METAL STAMPING\n\nNC Level: NC II\n\nNominal Training Duration:\n18 Hours (Basic Competencies)\n20 Hours (Common Competencies)\n256 Hours (Core Competencies)\n\nThis qualification is designed to develop knowledge, desirable attitudes and skills\nin Metal Stamping NC II Qualification specifically to set up, conduct trial run and operate\nmechanical press; perform mechanical shearing operation which applies to a range of\npress operations including blanking, cutting-off, piercing/punching, trimming and\nbending; and perform mechanical press forming operation which applies to a range of\npress forming operations including piercing/punching, trimming, and forming/drawing.\nBasic competencies such as: Participate in workplace communication; Work in a\nteam environment; Practice career professionalism; and Practice occupational health\nand safety are included.\nIt also includes common competencies such as: Read, Interpret and Apply\nEngineering Drawings; Perform Mensuration and Calculation Read; Interpret and Apply\nSpecifications and Manuals and; Perform Shop Maintenance.\n To obtain this, all units of competency prescribed for this qualification must be\nachieved.\n\nBASIC COMPETENCIES\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and convey\n workplace information.\n1.2 Complete relevant work\n related documents.\n1.3 Participate in workplace\n meeting and discussion\n• Group discussion\n• Interaction\n• Lecture\n• Reportorial\n\n• Written test\n• Practical/\nperformance test\n• Interview\n2. Work in a team\nenvironment\n2.1 Describe and identify\nteam role and\nresponsibility in a team.\n2.2 Describe work as a team\nmember.\n• Group discussion\n• Case studies\n• Simulation\n\n• Written test\n• Observation\n• Simulation\n• Role playing\n•Case studies\n\n--- PDF PAGE 42 ---\nTR METAL STAMPING NC II\nPromulgated\n\n40\n3. Practice career\nprofessionalism\n3.1Integrate personal\nobjectives with\norganizational goals.\n3.2 Set and meet work\npriorities.\n3.3 Maintain professional\ngrowth & development.\n• Group Discussion\n• Interaction\n• Simulation\n• Demonstration\n• Self-paced\ninstruction\n• Structured activity\n•Film viewing\n• Role playing\n• Interview\n• Written\nexamination\n• Portfolio\n4. Practice\noccupational\nhealth and\nsafety\n4.1 Evaluate hazard and\nrisks\n4.2 Control hazards and risks\n4.3 Maintain occupational\nhealth and safety\nawareness\n• Interactive-lecture\n• Simulation\n• Symposium\n• Group dynamics\n• Film viewing\n• Situation analysis\n• Self-paced\ninstruction\n• Situation\nanalysis\n• Interview\n• Practical\nexamination\n• Written\nexamination\n\nCOMMON COMPETENCIES\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Read, Interpret\nand Apply\nEngineering\nDrawings\n1.1 Identify and access\nengineering drawings/\nspecification\n1.2.Interpret drawings\n1.3.Apply information in the\ndrawings & specifications\n1.4 Store drawings\n• Lecture/\nDemonstration\n• Dual training\n• Practical\nexercises\n\n• Direct\nobservation\n• Written\nexamination\n• Oral\nexamination\n2. Perform\nMensuration\nand Calculation\n2.1. Select measuring\ninstrument\n2.2 Carry out\nmeasurement and\ncalculations.\n2.3. Maintain measuring\ninstruments\n• Demonstration\n• Practical\nexercises\n\n• Written test\n• Oral\nquestioning\n• Direct\nobservation\n3. Read, Interpret\nand Apply\nSpecifications\nand Manual\n3.1 Identify/accessed\nmanuals and interpret\ndata and specification\n3.2 Apply information\naccessed in manual\n3.3 Store manual\n• Lecture/\nDemonstration\n• Dual training\n• Distance\nLearning\n• Written test\n• Direct\nobservation\n• Project method\n• Interview\n\n--- PDF PAGE 43 ---\nTR METAL STAMPING NC II\nPromulgated\n\n41\n\n4. Perform Shop\nMaintenance\n\n4.1 Inspect/clean tools and\nwork area\n4.2 Store/arrange tools and\nshop equipment\n4.3 Dispose wastes/used\nlubricants\n4.4 Report damaged\ntools/equipment\n• Lecture/\nDemonstration\n• Dual training\n• Self paced\n(modular)\n• Simulation\n• Interactive\nlecture\n• Written test\n• Direct\nobservation\n• Demonstration\n• Interview\n\nCORE COMPETENCIES\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n\n1. Perform press\nmachine setting\n1.1 Set up die on the press\nmachine\n1.2 Conduct trial run\n1.3 Replace worn/damaged\ntooling or dies\n• Lecture\n• Demonstration\n• Dualized\ntraining\n•Distance\n• Direct\nObservation\n• Written test\n• Demonstration\n•Portfolio\n2. Perform\nmechanical\nshearing\noperations\n2.1 Secure job order, part\ndrawings and instructions\n2.2 Conduct machine settings\nand set-up checks\n2.3 Select steel feed stock\nmaterials\n2.4 Perform shearing press\noperations\n2.5 Monitor machine operation\n• Demonstration\nDiscussion\n• Dualized\ntraining\n• Distance\nlearning\n\n• Direct\nObservation\n• Written or oral\nexamination\n• Demonstration\n• Portfolio\n• Third party\nreport\n3. Perform\nmechanical\npress forming\noperations\n3.1 Secure job order, part\ndrawings and instructions\n3.2 Conduct machine settings\nand set-up checks\n3.3 Inspect delivered steel\nfeed stock materials\n3.4 Perform press operations\n3.5 Monitor machine operation\n• Lecture\n• Demonstration\nDiscussion\n• Dualized\ntraining\n• Distance\nlearning\n\n• Direct\nObservation\n• Written or oral\nexamination\n• Demonstration\n• Portfolio\n\n--- PDF PAGE 44 ---\nTR METAL STAMPING NC II\nPromulgated\n\n42\n3.2 TRAINING DELIVERY\n\n The delivery of training should adhere to the design of the curriculum.\nDelivery should be guided by the 10 basic principles of Competency-Based TVET.\n\n The training is based on curriculum developed from the competency standards;\n Learning is modular in its structure;\n Training delivery is individualized and self-paced;\n Training is based on work that must be performed;\n Training materials are directly related to the competency standards and curriculum\nmodules;\n Assessment is based in the collection of evidence of the performance of work to the\nindustry required standard;\n Training is based both on and off-the –job component;\n Allows for the recognition of prior learning ( RPL ) or current competencies;\n Training allows for multiple entry and exit ; and\n Approved training programs are nationally accredited.\n\n The competency-based TVET system recognizes various types of delivery\nmodes, both on and off-the–job as long as the learning is driven by the competency\nstandards specified by the industry. The following training modalities may be adopted\nwhen designing training programs:\n\n The dualized mode of training delivery is preferred and recommended. Thus\nprograms would contain both in school and in-industry training of fieldwork\ncomponents. Details can be referred to the Dual Training System ( DTS )\nImplementing Rules and Regulations\n\n Modular / self-paced learning is a competency- based training modality wherein the\ntrainee is allowed to progress at his own pace. The trainer facilitates the training\ndelivery\n\n Peer teaching / mentoring is training modality wherein fast learners are given the\nopportunity to assist the slow learners.\n\n Supervised industry training or on-the-hob training is an approach in training\ndesigned to enhance the knowledge and skills of the trainee through actual\nexperience in the workplace to acquire specific competencies prescribed in the\ntraining regulations.\n\n Distance learning is formal education process in which majority of the instruction\noccurs when the students and instructor are not in the same place. Distance learning\nmay employ correspondence study, or audio, video or computer technologies.\n\n--- PDF PAGE 45 ---\nTR METAL STAMPING NC II\nPromulgated\n\n43\n3.3 TRAINEE ENTRY REQUIREMENTS\n\nThis section specifies the qualifications of trainees and educational\nexperience. Other requirements like health and physical requirements are\nalso stated. Passing entry written examinations may also be indicated if\nnecessary.\n\n•\nMust be high school graduate;\n•\nAbility to communicate both orally and in writing; and\n•\nPhysically and mentally fit\n\n 3.4 LIST OF TOOLS, EQUIPMENT AND MATERIALS\n METAL STAMPING NC II\n\nRecommended list of tools, equipment and materials for the training of 25\ntrainees for Metal Stamping NC II\n\nTOOLS\nQTY\n\nQTY\n\nQTY\n\n2\nsets\n•\nBox wrench\n2 sets\n• Open end\nwrench\n 4 mm to 20\nmm\n2\nsets\n•\nAllen wrench\n4 to 10 mm\n2\nsets\n•\nAdjustable wrench\n2 set\n•\nFlat screw\ndriver\nlength 140 &\n160\n2\nsets\n•\nPhilips screw\ndriver\n2\nsets\n•\nVice grip\nlength175 mm\n\n•\n\n•\n\n Measuring Tools:\n25\npcs\n•\nSteel rule\n15\npcs.\n•\nVernier caliper\n- Inside\n- outside\n15\npcs.\n•\nMicrometer\n- inside\n- outside\n10\npcs.\n•\nFeeler gauges\n\n•\n\n•\n\n Safety Device:\n1\nbox\n•\nFirst –Aid kit\n25\npcs\n•\nSafety goggle\n25\npcs\n•\nSafety\nshield/mask\n4 cyl\n•\nFire extinguisher\n25\npcs\n•\nSafety shoes\n25\npcs\n•\nGloves\n\n--- PDF PAGE 46 ---\nTR METAL STAMPING NC II\nPromulgated\n\n44\nEQUIPMENT\n\nDIES\nQTY\n1\nunit\n•\nMechanical press\nmachine with\naccessories\n•\nBlanking\n•\nBending\n1\nunit\n•\nCompressor with\naccessories\n•\n Cut-off\n•\n Compound\n1\nunit\n•\nHoists\n•\n Piercing\n•\n Progressive\n1\nunit\n•\nJacks\n•\n Trimming\n•\n Forming/drawing\n\nMATERIALS\n•\nSteel sheets\n•\nLubricating oil\n\nHousekeeping materials:\n20\npcs\n Brooms\n10 k\n Clean rags\n5\npcs\n Dustpan\n10\npcs\n Scrapers\n10\npcs\n Mops\n2\npcs.\n Trash can\n10\ngal\n Kerosene oil\n2\nbars\n Soap\n\nTraining Materials:\n\n Reference\nbooks\n\n Catalogs\n Brochures / LE s\n\n CD s / Video tape\n\n--- PDF PAGE 47 ---\nTR METAL STAMPING NC II\nPromulgated\n\n45\n3.5 TRAINING FACILITIES\n METAL STAMPING NC II\n\nThe workshop must be of concrete structure. Based on class size of 25\nstudents/trainees the space requirements for the teaching/learning and circulation areas\nare as follows:\n\nSPACE\nREQUIREMENT\nSIZE IN METERS\nAREA IN SQ.\nMETERS\nTOTAL AREA IN\nSQ. METERS\n• Building\n(permanent)\n\n 10 M X 30 M\n\n 300 Sq. M\n Trainee working\nspace\n\n 2 M X 2 M\n\n4 Sq.M/trainee\n\n 100 sq. M.\nLecture Room\n 8 M X 10 M\n 80 Sq. M.\n 80 sq. M\n Learning\nResource\nCenter\n\n 4 M X 8 M.\n\n 32 Sq. M\n\n 32 Sq. M\n Facilities/\nEquipment/\nCirculation\nArea**\n\n 154 Sq. M.\n** Area requirement is equivalent to 30% of the total teaching/learning areas\n\n3.6 TRAINER’S QUALIFICATIONS FOR AUTOMOTIVE MANUFACTURING SECTOR\n\nMETAL STAMPING NC II TRAINER QUALIFICATION (TQ I)\n• Must be a holder of METAL STAMPING NC II\n• Must have undergone training on Training Methodology II (TM II) 1\n• Must be computer literate\n• Must be physically and mentally fit\n• Must have at least 2 years job/industry experience2\n• Must be a civil-service eligible or holder of appropriate professional license\nissued by the Professional Regulatory Commission (for government positions\n\n1\nThis shall be changed to “:Must be a holder of Trainer Qualification Level II (TQII) or\nequivalent” upon promulgation by the TESDA Board of the TQ/AQ training regulations\n2\nOptional. Only when required by the hiring institution\n\nReference: TESDA Board Resolution No. 2004 03\n\n3.7 INSTITUTIONAL ASSESSMENT\n\nInstitutional assessment is undertaken by trainees to determine their\nachievement of units of competency. A certificate of achievement is issued for\neach unit of competency.\n\n--- PDF PAGE 48 ---\nTR METAL STAMPING NC II\nPromulgated\n\n46"
