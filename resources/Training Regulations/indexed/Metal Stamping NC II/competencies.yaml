a \n2.3 Displacement \n2.4 Inside diameter \n2.5 Circumference \n2.6 Length \n2.7 Thickness \n2.8 Outside diameter \n2.9 Taper \n2. 10 Out of roundness \n2.11 Shrinkage allowance\n\n--- PDF PAGE 23 ---\nTR METAL STAMPING NC II \nPromulgated \n \n21\nEVIDENCE GUIDE \n \n \n1. Critical aspects \nof competency \nAssessment requires evidence that the candidate: \n1.1 Selected measuring instruments \n1.2 Carried-out measurements and calculations. \n1.3 Maintained measuring instruments\n \n2. Underpinning \nknowledge and \nattitudes \n2.1 Types of Measuring instruments and its uses \n2.2 Safe handling procedures in using measuring instruments \n2.3 Four fundamental operation of mathematics \n2.4 Formula for Volume, Area, Perimeter and other geometric \nfigures\n \n3. Underpinning     \nSkills \n3.1 Caring and Handling measuring instruments \n3.2 Calibrating and using measuring instruments \n3.3 Performing calculation by  Addition, Subtraction, Multiplication \nand Division \n3.4  Visualizing objects and shapes \n3.5  Interpreting formula for volume, area, perimeter and other \ngeometric figures\n \n4. Resource     \nImplications \nThe following resources MUST be provided: \n4.1 Workplace location \n4.2 Measuring instrument appropriate to servicing processes \n4.3 Instructional materials relevant to the propose activity \n \n5. Method of  \n    assessment \n \nCompetency MUST be assessed through: \n5.1 Observation with questioning \n5.2 Written or oral examination \n5.3 Interview \n5.4 Demonstration with questioning\n \n6. Context of  \n    assessment \n \n \n6.1 Competency elements must be assessed in a safe \n       working environment \n6.2 Assessment may be conducted in a workplace or  \n      simulated environment\n",
