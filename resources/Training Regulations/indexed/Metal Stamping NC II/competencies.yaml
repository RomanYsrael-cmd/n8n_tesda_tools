        "source_text": "--- PDF PAGE 33 ---\nTR METAL STAMPING NC II \nPromulgated \n \n31\nUNIT OF COMPETENCY : \nPERFORM MECHANICAL SHEARING PRESS \nOPERATIONS   \n \nUNIT CODE  \n \n: \nALT722309    \n \nUNIT DESCRIPTOR: \nThis unit covers the skills, knowledge and attitudes required \nto conduct pre-start checks, select feed stock materials, \noperate and monitor basic press operations. The unit applies \nto a range of press operations including blanking, cutting-off, \ntrimming and bending  \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1. \nSecure job order, \npart drawings and \ninstructions  \n1.1 \n \n1.2\nJob order and instructions are correctly interpreted and \nunderstood. \nDimensional and task requirements are understood \nincluding machine set up and parameters.\n2. \nConduct machine \nsettings and set-up \nchecks \n2.1\n \n2.2\n \n2.3\n \n2.4\nPre-start checks are undertaken to standard operating \nprocedure. \nTemplates, stoppers and cutting guides are measured \nand installed firmly in place. \nSafety procedures are observed and all safety \nequipment is checked for correct operation  \nMachine check up results are recorded in accordance \nwith company procedures\n3. \nSelect steel feed \nstock materials \n3.1\n \n3.2\n \nMaterials are selected in conformance to job order \nspecifications and instructions. \nMaterials stocks are counted to ensure availability of \nsufficient quantities of materials to meet job \nrequirements\n4. \nPerform shearing \npress operations \n4.1\n \n4.2\n \n4.3\n \n4.4\n \n4.5\n \n4.6\nMachine is started up safely and correctly in accordance \nwith standard operating procedures. \nMachine is operated in accordance with job instructions \nor standard operating procedures. \nFeed stock are loaded and maintained consistent with \nproduction requirements. \nMachine output is unloaded safely to standard operating \nprocedures. \nMachine output is handled and stored in a manner not \nlikely to cause damage. \nProduction data is recorded to standard operating \nprocedures.\n\n--- PDF PAGE 34 ---\nTR METAL STAMPING NC II \nPromulgated \n \n32\n \n5. \nMonitor machine \noperation \n5.1\n \n \n5.2\n \n \n5.3\n \n \n5.4\nMachine operation is monitored for safe and correct \noperation in accordance with standard operating \nprocedures. \nDeviations and faults are identified and reported in \naccordance with standard operating procedures. \nSafety procedures and work practices are followed in \naccordance with Occupational Health and Safety (OHS) \nrequirements.   \nEmergency procedures are understood and followed in \naccordance with standard operating procedures\n\n--- PDF PAGE 35 ---\nTR METAL STAMPING NC II \nPromulgated \n \n33\n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. \nInstructions  \n \n1.1\n1.2\n1.3\n1.4\nInstructions include but not limited to: \ndrawings \njob instructions \nspecifications \nequivalent instructions \n2. \nOperation \n \n \n2.1\n2.2\n2.3\n2.4\nMechanical shearing press machine operation \ninclude but not limited to: \nblanking \ncutting –off \ntrimming \nbending\n\n--- PDF PAGE 36 ---\nTR METAL STAMPING NC II \nPromulgated \n \n34\n \nEVIDENCE GUIDE \n1. \nCritical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1  Secured job instructions \n1.2  Conducted pre-start checks \n1.3  Selected feed stock materials \n1.4  Performed shearing press operations \n1.5  Monitored machine operation  \n \n2. \nUnderpinning knowledge \n2.1  Types and characteristics of press machines, \naccessories and attachments   \n2.2  Shearing machine setting procedures \n2.3  Shearing machine operating procedures \n2.4  Feed stocks and their characteristics \n2.5  Techniques and tools used in measuring \nprocess output \n2.6  Shearing machine tooling   \n2.7  Signs of tool wear \n2.8  Safety practices and personal protective \nequipment \n2.9  Hazards and control measures associated with \noperating machines \n2.10 Emergency procedures \n2.11 First aid \n2.12 Perseverance and Honesty in the workplace\n3. \nUnderpinning skills \n3.1 Interpreting drawings, job sheets, standard \noperating procedures, specifications, safe \nworking procedures and other relevant \nreferences \n3.2 Following oral instructions \n3.3 Identifying worn/damaged tooling or dies \n3.4 Using hand tools \n3.5 Measuring workpieces \n3.6 Applying first aid measures \n4. \nResource implication \nThe following resources MUST be provided: \n4.1 Tools, equipment and materials relevant to the \nactivity \n4.2 Drawings, job sheets or instructions \n4.3 Personal Protective Equipment\n5. \nMethod of assessment \nCompetency MUST be assessed through: \n5.1 Observation with questioning \n5.2 Portfolio\n6. \nContext of assessment \nCompetency may be assessed at work or in a \nsimulated workplace.\n",
