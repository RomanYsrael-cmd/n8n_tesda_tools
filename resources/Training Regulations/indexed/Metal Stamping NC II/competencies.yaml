          "source_text": "1. Set up die on the press \nmachine \n1.1 Instructions are read, interpreted and understood \ncorrectly. \n1.2 Prepare die, die accessories, die attachments, \ntools, installing bolts, transport and lifting \nequipment. \n1.3 The die is set on the press machine according to \nstandard operating procedure;  \n1.4 Machine accessories/ attachments are selected \nand installed to meet requirements of the \noperation. \n1.5 Machine is adjusted to meet specifications and \noperational requirements.\n2. Conduct trial run \n2.1 Trial run is conducted in accordance with \nprescribed operating procedures \n2.2  First-off samples are measured for compliance \nwith quality standards, and adjustments are \nmade to ensure compliance with specification  \n2.3  Safety practices are followed in accordance with \nOHS requirements\n3. Replace worn/damaged \ntooling or dies   \n3.1 Abnormal machine operation is noted and \nreported to concerned personnel \n3.2 Worn or damaged tooling is identified and \nreported as required \n3.3 Safety practices are followed in accordance with \nOHS requirements\n\n--- PDF PAGE 31 ---\nTR METAL STAMPING NC II \nPromulgated \n \n29\n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. \n Instructions  \n \n1.1\n1.2\n1.3\n1.4\nInstructions include but not limited to: \ndrawings \njob orders \njob sheets \nequivalent instructions \n2. \nOperation \n \n \n2.1\n2.2\n2.3\n2.4\n2.5\n2.6\nPress machine operation include but not \nlimited to: \nblanking \ncutting –off \npiercing/punching \ntrimming \nbending \nforming/drawing \n3. \nAdjustments \n \n \n3.1\n3.2\n3.3\nAdjustments are made in \nram shut height  \nfeed/guide mechanism setting \ndie clearance/alignment\n\n--- PDF PAGE 32 ---\nTR METAL STAMPING NC II \nPromulgated \n \n30"
