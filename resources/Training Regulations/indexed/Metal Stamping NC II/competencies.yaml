        "source_text": "ALT722310\n\nUNIT DESCRIPTOR:\nThis unit covers the skills, knowledge and attitudes required\nto conduct pre-start checks, select feed stock materials,\noperate and monitor forming press operations. The unit\napplies to a range of press forming operations including\npiercing/punching, trimming, and forming/drawing.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Secure job order, part\ndrawings and instructions\n1.1 Job order and instructions are correctly\ninterpreted and understood\n1.2 Dimensional and task requirements are\nunderstood including machine set up and\nparameters.\n2. Conduct machine settings\nand set-up checks\n2.1 Prior to machine start up, checks are carried out\naccording to standard operating procedure.\n2.2 Dies are checked for proper set-up, centering,\nclamping and stability.\n2.3 Safety procedures are observed and all safety\nequipment is checked for correct operation\n2.4 Machine check up results are recorded in\naccordance with workplace procedures\n3. Inspect delivered steel feed\nstock materials\n3.1 Delivered steel materials are inspected to assure\nconformance to job order specifications and\ninstructions.\n3.2 Materials stocks are counted to ensure availability\nof sufficient quantities of materials to meet job\nrequirements.\n4. Perform press operations\n4.1 Inspect condition of die, clamping devices and\nmachine set up before press machine is started\nup safely and correctly in accordance with\nstandard operating procedures.\n4.2 Machine is operated in accordance with job\ninstructions or standard operating procedures.\n4.3 Steel feed stock are loaded and maintained\nconsistent with production requirements.\n4.4 Machine output is inspected and unloaded safely\nto standard operating procedures.\n4.5 Machine output is handled and stored in a manner\nnot likely to cause damage.\n4.6 Production data is recorded to standard operating\nprocedure\n\n--- PDF PAGE 38 ---\nTR METAL STAMPING NC II\nPromulgated\n\n36\n\n5. Monitor machine operation\n5.1 Machine operation is monitored for safe and\ncorrect operation in accordance with standard\noperating procedures.\n5.2 Deviations and faults are identified and reported in\naccordance with standard operating procedures.\n5.3 Safety procedures and work practices are\nfollowed in accordance with Occupational Health\nand Safety (OHS) requirements.\n5.4 Emergency procedures are understood and\nfollowed in accordance with standard operating\nprocedures\n\n--- PDF PAGE 39 ---\nTR METAL STAMPING NC II\nPromulgated\n\n37\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1.\nInstruction\n\n1.1\n1.2\n1.3\n1.4\nInstructions include but not limited to:\ndrawings\njob instructions\nspecifications\nequivalent instructions\n2.\nOperation\n\n2.1\n2.2\n2.3\nMechanical forming press machine operation\ninclude but not limited to:\npiercing/punching\nDrawing / Forming\nTrimming\n\n--- PDF PAGE 40 ---\nTR METAL STAMPING NC II\nPromulgated\n\n38\n\nEVIDENCE GUIDE\n1.\nCritical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Secured job instructions\n1.2 Conducted pre-start checks\n1.3 Selected feed stock materials\n1.4 Performed press operations\n1.5 Monitor machine operation\n\n2.\nUnderpinning knowledge\nand attitudes\n2.1 Types and characteristics of press machines,\naccessories and attachments\n2.2 Machine setting procedures\n2.3 Machine operating procedures\n2.4 Feed stocks and their characteristics\n2.5 Techniques and tools used in measuring\nprocess output\n2.6 Machine tooling\n2.7 Signs of tool wear\n2.8 Safety practices and personal protective\nequipment\n2.9 Hazards and control measures associated with\noperating machines\n2.10 Emergency procedures\n2.11 First aid\n2.12 Perseverance and Honesty in the workplace\n3.\nUnderpinning skills\n3.1 Interpreting drawings, job sheets, standard\noperating procedures, specifications, safe\nworking procedures and other relevant\nreferences\n3.2 Following oral instructions\n3.3 Identifying worn/damaged tooling or dies\n3.4 Using hand tools\n3.5 Measuring workpieces\n3.6 Applying first aid measures\n4.\nResource implication\nThe following resources MUST be provided:\n4.1 Tools, equipment and materials relevant to the\nactivity\n4.2 Drawings, job sheets or instructions\n4.3 Personal Protective Equipment\n5.\nMethod of assessment\nCompetency MUST be assessed through:\n5.1 Observation with questioning\n5.2 Portfolio\n6.\nContext of assessment\nCompetency may be assessed at work or in a\nsimulated workplace.\n\n--- PDF PAGE 41 ---\nTR METAL STAMPING NC II\nPromulgated\n\n39"
