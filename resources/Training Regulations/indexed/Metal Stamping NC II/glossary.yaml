      "definition": "Press A machine by which pressure is applied to a workpiece to cut, pierce, bend or shape it 2. Die A tool used to impart shapes to or to form impressions on sheet metal 3. Blanking A press operation wherein metal sheets are cut into shapes by striking with a punch 4. Bending A press operation that involves forming a metal part into a curved or angular shape, or the stretching or flanging of it along a curved path 5. Drawing A press operation that forces plastic deformation of metal in a die to form recessed parts or cuplike shapes 6. Drawing die A die that forms sheet metal into cuplike, wrinkle-free shapes 7. Feed stock The raw material furnished to a press machine to form or shape the metal 8. Trimming Removing excess materials from drawn or blanked part 9. Punching A piece removed from a sheet metal or other material by a punch press 10. Ram A plunger, weight or other guided structure for exerting pressure by impact 11 Shearing Shearing is a metalworking process which cuts stock without the formation of chips or the use of burning or melting. Strictly speaking, if the cutting blades are straight the process is called shearing; if the cutting blades are curved then they are shearing-type operations.[1] The most commonly sheared materials are in the form of sheet metal or plates, however rods can also be sheared. Shearing-type operations include: blanking, piercing, roll slitting, and trimming. 12 Piercing Piercing is a shearing process where a punch and die are used to create a hole in sheet metal or a plate. The process and machinery are usually the same as that used in blanking, except that the piece being punched out is scrap in the piercing process.[1] There are many specialized types of piercing: lancing, perforating, notching, nibbling, shaving, cutoff, and dinking."
