      "definition": "--- PDF PAGE 102 --- ------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- Electric Power Distribution Operation and Maintenance NC III Revision 00 Promulgated June 27, 2018 98 ANNEX A - COMPETENCY MAP TRANSMISSION LINE INSTALLATION & MAINTENANCE NC III COMPETENCY MAP BASIC COMPETENCIES Receive and Respond to Workplace Communication Work with Others Demonstrate work values Practice basic housekeeping procedures Participate in Workplace Communication Work in a Team Environment Practice career professionalism Practice occupational health and safety procedures Lead Workplace Communication Lead Small Working Teams Develop and Practice Negotiating Skills With Team Members Guide Effective Solutions to Problems Arising from Work Activities Check and Develop the Use of Mathematical Concepts & Techniques Use Relevant Technologies Applicable to Assigned Work Lead in Utilizing Specialized Communication Skills Assist in Developing Team and Individuals Apply Problem Solving Techniques in the Workplace Collect, analyze and organize information Plan and Organize Work for Several Working Teams Promote Environmental Protection COMMON COMPETENCIES Apply quality standards Comply with environmental protection procedures Observe procedures, specifications and manual of instruction Operate and Maintain T/L tools and equipment Operate a personal computer CORE COMPETENCIES Tender Diesel Engine Operate Diesel Power plant Maintain and Repair Diesel Engine Systems and Alternator Service Alternator/ Generator Diagnose and Repair Diesel Engine Diagnose and Repair Electrical System Overhaul Diesel Engine Perform transmission line pole erection Perform overhead transmission line work Perform cold-line maintenance work Perform live-line maintenance work Perform ground line maintenance work Plan transmission line maintenance job Install emergency restoration structure (ERS) Inspect/Assess transmission line components’ conditions Implement transmission line maintenance works Inspect transmission line, poles, towers and appurtenances Erect distribution line poles Climb pole and install pole assembly/conductors Install distribution line equipment and devices Install consumer service connection facility Conduct initial root cause analysis Perform ground transmission line works Perform overhead maintenance works Install/construct new transmission line structures Perform overhead transmission line works Install emergency restoration structure (ERS) Perform earth ground resistance testing Plan assigned maintenance work Supervise transmission line maintenance work Erect electric distribution pole Install single-phase distribution line equipment and devices Climb pole and install pole top assembly and conductors Install single-phase consumer service connection facility Replace electric distribution pole, pole top assembly and conductors Install/Replace single-, three- or vee-phase distribution line equipment and devices Install/Replace single-, three- or vee-phase consumer service connection facility Conduct vegetation clearing along distribution system Perform onsite assessment and testing of installed electric distribution line equipment and devices Troubleshoot faults and implement solution on electric power distribution system Supervise operation and maintenance on electric power distribution system"
