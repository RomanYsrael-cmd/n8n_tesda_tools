      "text": "1 NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS"
    },
    {
      "number": "4.1",
      "text": "1 The National Qualification of ELECTRIC POWER DISTRIBUTION LINE OPERATION AND MAINTENANCE NC III shall be obtained when a candidate demonstrate competence in all units of competency listed in Section 1. Successful candidates shall be awarded a National Certificate signed by the TESDA Director General."
    },
    {
      "number": "4.1",
      "text": "2 The Qualification of Electric Power Distribution Operation and Maintenance NC III can be attained by demonstration of competence through project-type assessment covering all the units required."
    },
    {
      "number": "4.1",
      "text": "3 Assessment shall cover all competencies with basic and common integrated or assessed concurrently with the core units of competency."
    },
    {
      "number": "4.1",
      "text": "4 Any of the following are qualified to apply for assessment and certification:"
    },
    {
      "number": "4.1",
      "text": "4.1 Graduates of training on Electric Power Distribution Operation and Maintenance NC III;"
    },
    {
      "number": "4.1",
      "text": "4.2 Graduates of upgrading training on distribution line installation/construction, operation and maintenance from enterprise/s and an NC Holder in Electrical Power Distribution Line Construction NC II;"
    },
    {
      "number": "4.1",
      "text": "4.3 Existing NC holders in Electrical Power Distribution Line Construction NC II and has at least 3 years of work experience in distribution line installation/construction, operation and maintenance."
    },
    {
      "number": "4.1",
      "text": "5 The guidelines on assessment and certification are discussed in detail in the \"Procedures Manual on Assessment and Certification\" and \"Guidelines on the Implementation of the Philippine TVET Competency Assessment and Certification System (PTCACS)\". --- PDF PAGE 96 --- ------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- Electric Power Distribution Operation and Maintenance NC III Revision 00 Promulgated June 27, 2018 92"
