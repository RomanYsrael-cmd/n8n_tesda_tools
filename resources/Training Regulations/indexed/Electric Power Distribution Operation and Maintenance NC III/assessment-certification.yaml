      "text": "Unit of Competency – is a component of the competency standards stating a specific key function or role in a particular job or occupation; it is the smallest component of achievement that can be assessed and certified under the PTQF --- PDF PAGE 99 --- ------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- Electric Power Distribution Operation and Maintenance NC III Revision 00 Promulgated June 27, 2018 95 1. ACSR - abbreviation of Aluminum Cable Steel Reinforced, a cable type having aluminum strands and a core of one or more steel strands. ACSR are primarily used for medium and high voltage lines and may also be used for overhead services to individual customers. 2. Anchor Rod – used for securing a machine, structure or part to masonry or other material. 3. Block and Tackle - is a combination or set of single or several sheaved blocks used to obtain a mechanical advantage in handling heavy loads. 4. Cable Height Meter - to determine the height of overhead cables 5. Conductor – is a conductive material usually made of aluminum or copper used to carry current along the overhead transmission or distribution line 6. De-energized – where electrical energy has been discharged through a mechanically secure connection to an effective ground potential 7. Distribution system – operating system which delivers energy from substation to customers and generally operates between 2400 volts to 34,500 volts. 8. Energized – capable of delivering energy by reason of being dynamically alive or charged 9. Fault indicators – device which indicates a defect or abnormal condition in a conductor"
