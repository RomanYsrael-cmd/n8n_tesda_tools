      "text": "Insulator - a device that is used to electrically isolate a conductor or electrical device from ground or a different electrical potential. Insulators must support the conductors and withstand both the normal operating voltage and surges due to switching and lightning. Insulators are broadly classified as either pin-type, which support the conductor above the structure, or suspension type, where the conductor hangs below the structure. At higher voltages only suspension-type insulators are common for overhead conductors. Insulators are usually made of wet-process porcelain or toughened glass, with increasing use of glass-reinforced polymer insulators."
