  "source_text": "SECTION 4 ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\nCompetency Assessment is the process of collecting evidence and making\njudgments whether competency has been achieved. The purpose of assessment is to\nconfirm that an individual can perform to the standards expected at the workplace as\nexpressed in relevant competency standards.\nThe assessment process is based on evidence or information gathered to prove\nachievement of competencies. The process may be applied to an employable unit(s) of\ncompetency in partial fulfillment of the requirements of the national qualification.\n\n4.1 NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1.1 The National Qualification of ELECTRIC POWER DISTRIBUTION LINE\nOPERATION AND MAINTENANCE NC III shall be obtained when a\ncandidate demonstrate competence in all units of competency listed in\nSection 1. Successful candidates shall be awarded a National Certificate\nsigned by the TESDA Director General.\n\n4.1.2 The Qualification of Electric Power Distribution Operation and\nMaintenance NC III can be attained by demonstration of competence\nthrough project-type assessment covering all the units required.\n\n4.1.3 Assessment shall cover all competencies with basic and common\nintegrated or assessed concurrently with the core units of competency.\n\n4.1.4 Any of the following are qualified to apply for assessment and\ncertification:\n\n4.1.4.1 Graduates of training on Electric Power Distribution Operation and\nMaintenance NC III;\n\n4.1.4.2 Graduates\nof\nupgrading\ntraining\non\ndistribution\nline\ninstallation/construction,\noperation\nand\nmaintenance\nfrom\nenterprise/s and an NC Holder in Electrical Power Distribution\nLine Construction NC II;\n\n4.1.4.3 Existing NC holders in Electrical Power Distribution Line\nConstruction NC II and has at least 3 years of work experience in\ndistribution\nline\ninstallation/construction,\noperation\nand\nmaintenance.\n\n4.1.5 The guidelines on assessment and certification are discussed in detail\nin the \"Procedures Manual on Assessment and Certification\" and\n\"Guidelines on the Implementation of the Philippine TVET Competency\nAssessment and Certification System (PTCACS)\".\n\n--- PDF PAGE 96 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nElectric Power Distribution Operation and Maintenance NC III Revision 00 Promulgated June 27, 2018 92\n\n4.2 COMPETENCY ASSESSMENT REQUISITE\n\n4.2.1 Self-Assessment Guide. The self-assessment guide (SAG) is accomplished\nby the candidate prior to actual competency assessment. SAG is a pre-\nassessment tool to help the candidate and the assessor determine what\nevidence is available, where gaps exist, including readiness for assessment.\n\nThis document can:\n\na.\nIdentify the candidate’s skills and knowledge\nb.\nHighlight gaps in candidate’s skills and knowledge\nc.\nProvide critical guidance to the assessor and candidate on the evidence\nthat need to be presented\nd.\nAssist the candidate to identify key areas in which practice is needed or\nadditional information or skills that should be gained prior `\n\n4.2.2 Accredited Assessment Center. Only Assessment Center accredited by\nTESDA is authorized to conduct competency assessment. Assessment\ncenters undergo a quality assured procedure for accreditation before they are\nauthorized by TESDA to manage the assessment for National Certification.\n\n4.2.3 Accredited Competency Assessor. Only accredited competency assessor is\nauthorized to conduct assessment of competence. Competency assessors\nundergo a quality assured system of accreditation procedure before they are\nauthorized by TESDA to assess the competencies of candidates for National\nCertification.\n\n--- PDF PAGE 97 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nElectric Power Distribution Operation and Maintenance NC III Revision 00 Promulgated June 27, 2018 93\n\nDEFINITION OF TERMS\n\nGENERAL\n\n1) Certification - is the process of verifying and validating the competencies of a\nperson through assessment\n\n2) Certificate of Competency (COC) – is a certification issued to individuals who pass\nthe assessment for a single unit or cluster of units of competency\n\n3) Common Competencies - are the skills and knowledge needed by all people\nworking in a particular industry\n\n4) Competency - is the possession and application of knowledge, skills and attitudes\nto perform work activities to the standard expected in the workplace\n\n5) Competency Assessment - is the process of collecting evidence and making\njudgments on whether competency has been achieved\n\n6) Competency Standard (CS) - is the industry-determined specification of\ncompetencies required for effective work performance\n\n7) Context of Assessment - refers to the place where assessment is to be conducted\nor carried out\n\n8) Core Competencies - are the specific skills and knowledge needed in a particular\narea of work - industry sector/occupation/job role\n\n9) Critical aspects of competency - refers to the evidence that is essential for\nsuccessful performance of the unit of competency\n\n10) Elective Competencies - are the additional skills and knowledge required by the\nindividual or enterprise for work\n\n11) Elements - are the building blocks of a unit of competency. They describe in\noutcome terms the functions that a person performs in the workplace.\n\n12) Evidence Guide - is a component of the unit of competency that defines or identifies\nthe evidences required to determine the competence of the individual. It provides\ninformation on critical aspects of competency, underpinning knowledge,\nunderpinning skills, resource implications, assessment method and context of\nassessment\n\n13) Level - refers to the category of skills and knowledge required to do a job\n\n14) Method of Assessment - refers to the ways of collecting evidence and when,\nevidence should be collected\n\n--- PDF PAGE 98 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nElectric Power Distribution Operation and Maintenance NC III Revision 00 Promulgated June 27, 2018 94\n\n15) National Certificate (NC) – is a certification issued to individuals who achieve all\nthe required units of competency for a national qualification defined under the\nTraining Regulations. NCs are aligned to specific levels within the PTQF\n\n16) Performance Criteria - are evaluative statements that specify what is to be\nassessed and the required level of performance\n\n17) Qualification - is a cluster of units of competencies that meets job roles and is\nsignificant in the workplace. It is also a certification awarded to a person on\nsuccessful completion of a course in recognition of having demonstrated\ncompetencies in an industry sector\n\n18) Range of Variables - describes the circumstances or context in which the work is\nto be performed\n\n19) Recognition of Prior Learning (RPL) – is the acknowledgement of an individual’s\nskills, knowledge and attitudes gained from life and work experiences outside\nregistered training programs\n\n19) Resource Implication - refer to the resources needed for the successful\nperformance of the work activity described in the unit of competency. It includes\nwork environment and conditions, materials, tools and equipment\n\n20) Basic Competencies - are the skills and knowledge that everyone needs for work\n\n21) Training Regulations (TR) – refers to the document promulgated and issued by\nTESDA consisting of competency standards, national qualifications and training\nguidelines for specific sectors/occupations. The TR serves as basis for\nestablishment of qualification and certification under the PTQF. It also serves as\nguide for development of competency-based curricula and instructional materials\nincluding registration of TVET programs offered by TVET providers\n\n22) Underpinning Knowledge - refers to the competency that involves in applying\nknowledge to perform work activities. It includes specific knowledge that is essential\nto the performance of the competency\n\n23) Underpinning Skills - refers to the list of the skills needed to achieve the elements\nand performance criteria in the unit of competency. It includes generic and industry\nspecific skills\n\n24) Unit of Competency – is a component of the competency standards stating a\nspecific key function or role in a particular job or occupation; it is the smallest\ncomponent of achievement that can be assessed and certified under the PTQF\n\n--- PDF PAGE 99 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nElectric Power Distribution Operation and Maintenance NC III Revision 00 Promulgated June 27, 2018 95\n\nSECTOR SPECIFIC\n\n1.\nACSR - abbreviation of Aluminum Cable Steel Reinforced, a cable type having\naluminum strands and a core of one or more steel strands. ACSR are primarily used\nfor medium and high voltage lines and may also be used for overhead services to\nindividual customers.\n2.\nAnchor Rod – used for securing a machine, structure or part to masonry or other\nmaterial.\n3.\nBlock and Tackle - is a combination or set of single or several sheaved blocks used\nto obtain a mechanical advantage in handling heavy loads.\n4.\nCable Height Meter - to determine the height of overhead cables\n5.\nConductor – is a conductive material usually made of aluminum or copper used to\ncarry current along the overhead transmission or distribution line\n6.\nDe-energized – where electrical energy has been discharged through a\nmechanically secure connection to an effective ground potential\n7.\nDistribution system – operating system which delivers energy from substation to\ncustomers and generally operates between 2400 volts to 34,500 volts.\n8.\nEnergized – capable of delivering energy by reason of being dynamically alive or\ncharged\n9.\nFault indicators – device which indicates a defect or abnormal condition in a\nconductor\n10. Fiberglass reinforced plastic (ERP) tool – insulated live-line tools; also known as\nhot stick, (see also Hot stick).\n11. Full Body Harness - form of protective equipment designed to protect a person from\ninjury due to falling\n12. Grounding – placing interconnected parts at ground/earth potential\n13. Grounding Cluster – used to protect personnel working in de-energized lines, from\ninduced voltage, fault current feed, lightning strikes, erroneous switching & accidental\ncontact with adjacent lines\n14. Ground line maintenance work – refers to activities in the ground done by\ntransmission line personnel which do not require climbing activity\n15. Groundworks - a person working at ground level in support of a Line worker working\noverhead.\n16. Guy Wires – high tensile steel wire attached to an anchor point which is installed to\noffset a conductor tension and equipment load.\n17. Guy-wire assembly -is a tensioned cable designed to add stability to structures\n(frequently ship masts, radio masts, wind turbines, utility poles, and tents). One end\nof the cable is attached to the structure, and the other is anchored to the ground at a\ndistance from the structure's base.\n18. Handline - used for lifting or lowering small objects and also for holding equipment\naway from the pole as it is being raised\n19. Hazard - a dangerous condition, potential or inherent, that can bring about an\ninterruption or interfere with the expected orderly progress of an activity. It is any\n\n--- PDF PAGE 100 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nElectric Power Distribution Operation and Maintenance NC III Revision 00 Promulgated June 27, 2018 96\n\nwork materials, equipment, methods or practices that have the potential to cause\nharm to life, health, property or environment.\n20. Hazardous - an atmosphere that may expose employees to the risk of death,\natmosphere incapacitation, impaired ability to self-rescue unaided, injury, or acute\nillness.\n21. Hazardous atmospheres - include flammable gas, vapor, or mist, airborne\ncombustible dust, oxygen concentration below 19.5 percent or above 23.5 percent,\nconcentrations of substances that exceed dose or permissible exposure limits, or\nother atmospheric condition immediately dangerous to life or health.\n22. Hot Line Order - a statement with documentation from the Operations Supervisor to\nthe Job Supervisor that specific work may be done on or near a line or other\nequipment without requiring that it be disconnected from all sources of energy. The\nequipment is to be considered energized or “hot.”\n23. Hot stick - an insulated stick, usually made of fiberglass, which is used to work\nenergized overhead conductors and operate electrical equipment that is overhead,\nunderground and pad mounted.\n24. Insulator - a device that is used to electrically isolate a conductor or electrical device\nfrom ground or a different electrical potential. Insulators must support the conductors\nand withstand both the normal operating voltage and surges due to switching and\nlightning. Insulators are broadly classified as either pin-type, which support the\nconductor above the structure, or suspension type, where the conductor hangs below\nthe structure. At higher voltages only suspension-type insulators are common for\noverhead conductors. Insulators are usually made of wet-process porcelain or\ntoughened glass, with increasing use of glass-reinforced polymer insulators.\n25. Line to line clearance – refers to the distance of live conductors to another live\nconductor.\n26. Line to ground clearance - refers to the distance of live conductors to the ground\n27. Line worker - a payroll classification or title given a craftsperson whose duties\ninclude climbing wood poles or steel structures to perform work on electric power\ntransmission and distribution circuits.\n28. Low voltage – less than 1000 volts, used for connection between a residential or\nsmall commercial customer and the utility.\n29. Medium Voltage (Distribution) – between 1000 volts (1 kV) and to about 33 kV, used\nfor distribution in urban and rural areas.\n30. Lock-out and tag-out – procedure to prevent unauthorized operation of equipment\n31. Maintenance programs – preventive or pro-active programs to ensure reliability of\nsystem\n32. Meggering – to apply potential to test electrical equipment for continuity and\ninsulation\n33. Metering equipment – equipment used to track customer consumption of electricity\nfor billing purposes\n34. Personal Protective Equipment (PPE) - refers to protective clothing, helmets,\ngoggles, or other garment or equipment designed to protect line personnel from job-\nrelated occupational hazards\n\n--- PDF PAGE 101 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nElectric Power Distribution Operation and Maintenance NC III Revision 00 Promulgated June 27, 2018 97\n\n35. Pole Dressing – refers to installation of structure components, such as cross arms,\ninsulators and etc.\n36. Potential – latent energy (potential presence of voltage)\n37. Pole Setting – refers to pole positioning, pole erection and pole facing.\n38. Primary – voltage above 751 volts alternating current (distribution system)\n39. Rigging – is the term used to describe the process of moving/lifting both heavy and\nlight loads using rope, blocks, and other special equipment.\n40. Right of way (ROW) – the legal right, established by usage or grant, to pass along a\nspecific route through grounds or property belonging to another.\n41. Risks - a probability or threat of damage, injury, liability, loss or any other negative\noccurrence that is caused by external or internal vulnerabilities, and that may be\navoided through preemptive action.\n42. Secondary – voltage 750 volts alternating current, and below (distribution system)\n43. Sectionalize – to isolate or separate sections of line\n44. Slings - provide a method of attaching rigging tools to structures or equipment.\nThey can be made of rope, webbing or steel. Some slings are made with a\ncontinuous loop while others are made with an eye on each end.\n45. Slope Protection – The protection of an embankment slope against wave action or\nerosion.\n46. Structure – a device used to support conductors or cables and related equipment;\nfor example, poles and towers\n47. Switching – an operation that affects or modifies the status of a system\n48. Tag Line - A rope used to control the position of equipment being lifted. This is not to\nbe confused with the rope used to actually lift the equipment.\n49. Voltage Detector- is a sensor used to detect presence of electricity in a wire.\n\n--- PDF PAGE 102 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nElectric Power Distribution Operation and Maintenance NC III Revision 00 Promulgated June 27, 2018 98\n\nANNEX A - COMPETENCY MAP\n\nTRANSMISSION LINE INSTALLATION & MAINTENANCE NC III COMPETENCY MAP\n\nBASIC COMPETENCIES\n\nReceive and Respond to\nWorkplace\nCommunication\nWork with Others\nDemonstrate work\nvalues\nPractice basic\nhousekeeping procedures\nParticipate in Workplace\nCommunication\nWork in a Team Environment\nPractice career\nprofessionalism\nPractice occupational\nhealth and safety\nprocedures\nLead Workplace\nCommunication\nLead Small\nWorking Teams\nDevelop and Practice\nNegotiating Skills\nWith Team Members\nGuide Effective\nSolutions to Problems\nArising from Work\nActivities\nCheck and Develop the\nUse of Mathematical\nConcepts & Techniques\nUse Relevant\nTechnologies\nApplicable to Assigned\nWork\nLead in Utilizing\nSpecialized\nCommunication Skills\nAssist in Developing\nTeam and Individuals\nApply Problem Solving\nTechniques in the\nWorkplace\nCollect, analyze and\norganize information\nPlan and Organize Work for\nSeveral Working Teams\nPromote Environmental\nProtection\n\nCOMMON COMPETENCIES\n\nApply quality standards\nComply with\nenvironmental protection\nprocedures\nObserve procedures,\nspecifications and manual\nof instruction\nOperate and Maintain T/L\ntools and equipment\nOperate a personal\ncomputer\n\nCORE COMPETENCIES\nTender Diesel Engine\nOperate Diesel Power plant\nMaintain and Repair\nDiesel Engine Systems\nand Alternator\nService Alternator/ Generator\nDiagnose and Repair\nDiesel Engine\nDiagnose and Repair\nElectrical System\nOverhaul Diesel Engine\nPerform transmission line\npole erection\nPerform overhead\ntransmission line work\nPerform cold-line\nmaintenance work\nPerform live-line maintenance\nwork\nPerform ground line\nmaintenance work\nPlan transmission line\nmaintenance job\nInstall emergency\nrestoration structure\n(ERS)\nInspect/Assess\ntransmission line\ncomponents’ conditions\nImplement transmission line\nmaintenance works\nInspect transmission\nline, poles, towers and\nappurtenances\nErect distribution line poles\nClimb pole and install pole\nassembly/conductors\nInstall distribution line\nequipment and devices\n\nInstall consumer service\nconnection facility\nConduct initial root cause\nanalysis\nPerform ground transmission\nline works\nPerform overhead\nmaintenance works\nInstall/construct new\ntransmission line structures\nPerform overhead\ntransmission line works\nInstall emergency\nrestoration structure\n(ERS)\nPerform earth ground\nresistance testing\n\nPlan assigned\nmaintenance work\nSupervise transmission line\nmaintenance work\n\nErect electric distribution\npole\nInstall single-phase distribution\nline equipment and devices\nClimb pole and install pole\ntop assembly and\nconductors\nInstall single-phase\nconsumer service\nconnection facility\nReplace electric\ndistribution pole, pole\ntop assembly and\nconductors\nInstall/Replace single-,\nthree- or vee-phase\ndistribution line\nequipment and devices\nInstall/Replace single-,\nthree- or vee-phase\nconsumer service\nconnection facility\nConduct vegetation\nclearing along\ndistribution system\nPerform onsite assessment and\ntesting of installed electric\ndistribution line equipment and\ndevices\nTroubleshoot faults and\nimplement solution on\nelectric power distribution\nsystem\nSupervise operation and\nmaintenance on electric\npower distribution\nsystem\n\n--- PDF PAGE 103 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nElectric Power Distribution Operation and Maintenance NC III Revision 00 Promulgated June 27, 2018 99\n\n TRAINING REGULATIONS (TR)\n DOCUMENT REVISION HISTORY\n\nQualification Title : Electric Power Distribution Operation and Maintenance NC III\nQualification Code: UTLEPD318\n\nRevision\nNo.\n\nDocument\nDescription Types*\nReplaces Version\n(TESDA Board\nResolution No./\nDate)\nNew Version\n(TESDA Board\nResolution No./\nDate)\n\nDeployment\nCircular\n00\nDocument Created –\nElectric Power\nDistribution Line\nConstruction NC III\n\nNot Applicable\nTB No. 2018-14/\nJune 27, 2018\nTESDA Circular\nNo. __ s. 2018\n Legend: *Description Types\n- Document Created\n- Document Amended\n\n--- PDF PAGE 104 ---\n-------------------------------------------------------------------------------------------------------