  "source_section_text": "SECTION 3 TRAINING ARRANGEMENTS\n\nThis set of standards provides Technical and Vocational Education and Training\n(TVET) providers with information and other important requirements to consider when\ndesigning training programs for Electric Power Distribution Operation and Maintenance NC\nIII.\n\nThis includes information on curriculum design; training delivery; trainee entry\nrequirements; tools and equipment; training facilities; and trainer’s qualification and\ninstitutional assessment.\n\n3.1\nCURRICULUM DESIGN\n\nTESDA shall provide the training on the development of competency-based curricula\nto enable training providers develop their own curricula with the components mentioned\nbelow.\n\nDelivery of knowledge requirements for the basic, common and core units of\ncompetency\nspecifically\nin\nthe\nareas\nof\nmathematics,\nscience/technology,\ncommunication/language and other academic subjects shall be contextualized. To this end,\nTVET providers shall develop a Contextual Learning Matrix (CLM) to accompany their\ncurricula.\n\nCourse Title : Electric Power Distribution Operation and Maintenance\n\nNC Level\n: NC III\n\nNominal Training Duration:\n 48 hrs – Basic Competencies\n\n 60 hrs – Common Competencies\n\n 112 hrs – Core Competencies\n\n ------------\n220 hrs\n\nCourse Description:\n\nThis course is designed to develop & enhance the knowledge, skills, & attitudes of\nan electric power distribution line worker, in accordance with industry standards. It covers\nthe basic and common competencies in addition to the core competencies such as replace\nelectric distribution pole, pole top assemblies and conductors, install/replace single-, three-\nor vee-phase distribution line equipment and accessories, as well as install/replace single-,\nthree- or vee-phase consumer service connection facilities and conduct vegetation clearing\nalong distribution system.\n\nThe nominal duration of 220 hours covers the required units at Electric Power\nDistribution Operation and Maintenance NC III. TVET providers can however, offer a longer,\nladderized course covering the NC III basic, common and core units.\n\nTo obtain this, all units prescribed for this qualification must be achieved:\n\n--- PDF PAGE 72 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nElectric Power Distribution Operation and Maintenance NC III Revision 00 Promulgated June 27, 2018 68\n\nBASIC COMPETENCIES\n(48 hours)\n\nUNIT OF\nCOMPETENCY\nLEARNING\nOUTCOMES\nLEARNING ACTIVITIES\nMETHODOLOGY\nASSESSMENT\nAPPROACH\nNOMINAL\nDURATION\n1. Lead workplace\ncommunication\n1.1. Communicate\ninformation about\nworkplace\nprocesses\n1.1.1. Read\no Effective verbal communication methods\no Sources of information\n1.1.2. Practice organizing information\n1.1.3. Identify organization requirements for\nwritten and electronic communication\nmethods\n1.1.4. Follow organization requirements for the\nuse of written and electronic communication\nmethods\n1.1.5. Perform exercises on understanding and\nconveying intended meaning scenario\n• Lecture\n• Demonstration\n• Practical\nexercises\n• Role Play\n\n• Written Test\n• Observation\n2 Hours\n1.2. Lead workplace\ndiscussions\n1.2.1. Discuss organizational policy on production,\nquality and safety\n1.2.2. Goals/ objectives and action plan setting\n1.2.3. Read effective verbal communication\nmethods\n1.2.4. Prepare/set action plans based on\norganizational goals and objectives\n• Group\ndiscussion\n• Lecture\n• Demonstration\n• Oral\nevaluation\n• Written Test\n• Observation\n2 Hours\n1.3. Identify and\ncommunicate\nissues arising in\nthe workplace\n1.3.1. Discuss organizational policy in dealing with\nissues and problems\n1.3.2. Read effective verbal communication\nmethods\n1.3.3. Practice organizing information\n1.3.4. Perform exercises on understanding and\nconveying intended meaning scenario\n• Group\ndiscussion\n• Lecture\n• Demonstration\n• Role Play\n• Oral\nevaluation\n• Written Test\n• Observation\n\n2 Hours\n\n2. Lead small team\n2.1. Provide team\nleadership\n2.1.1. Discuss company policies and procedures\n2.1.2. Identify client expectations\n2.1.3. Practice team building skills\n2.1.4. Perform exercises on communication skills\nrequired for leading teams\n• Group\ndiscussion\n• Lecture\n• Demonstration\n• Role Play\n• Oral\nevaluation\n• Written\nexamination\n• Observation\n2 Hours\n\n--- PDF PAGE 73 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nElectric Power Distribution Operation and Maintenance NC III Revision 00 Promulgated June 27, 2018 69\n\nUNIT OF\nCOMPETENCY\nLEARNING\nOUTCOMES\nLEARNING ACTIVITIES\nMETHODOLOGY\nASSESSMENT\nAPPROACH\nNOMINAL\nDURATION\n2.2. Assign\nresponsibilities\n2.2.1. Discuss:\no Team member’s duties and\nresponsibilities\n2.2.2. Identify client expectations\n2.2.3. Practice negotiating skills\n2.2.4. Perform group exercises showing the skills\nand techniques in promoting team building\n\n• Group\ndiscussion\n• Lecture\n• Demonstration\n• Role Play\n• Oral\nevaluation\n• Written\nexamination\n• Observation\n2 Hours\n\n2.3. Set performance\nexpectations for\nteam members\n2.3.1. Discuss:\no Team member’s duties and\nresponsibilities\no How performance expectations are set\n2.3.2. Identify client expectations\n2.3.3. Perform group exercises in setting\nindividual target/ expectation\n2.3.4. Read instruction and requirements in up to\ndate dissemination to members\n• Group\ndiscussion\n• Lecture\n• Demonstration\n• Role Play\n• Lecture\n• Oral\nevaluation\n• Written\nexamination\n• Observation\n1 Hour\n2.4. Supervise team\nperformance\n2.4.1. Describe listening and treating individual\nteam members concern\n2.4.2. Identify methods of Monitoring Performanc