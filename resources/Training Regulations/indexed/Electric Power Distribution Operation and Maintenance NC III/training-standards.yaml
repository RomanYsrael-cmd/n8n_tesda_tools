      "source_text": "3.1\nCURRICULUM DESIGN\n\nTESDA shall provide the training on the development of competency-based curricula\nto enable training providers develop their own curricula with the components mentioned\nbelow.\n\nDelivery of knowledge requirements for the basic, common and core units of\ncompetency\nspecifically\nin\nthe\nareas\nof\nmathematics,\nscience/technology,\ncommunication/language and other academic subjects shall be contextualized. To this end,\nTVET providers shall develop a Contextual Learning Matrix (CLM) to accompany their\ncurricula.\n\nCourse Title : Electric Power Distribution Operation and Maintenance\n\nNC Level\n: NC III\n\nNominal Training Duration:\n 48 hrs – Basic Competencies\n\n 60 hrs – Common Competencies\n\n 112 hrs – Core Competencies\n\n ------------\n220 hrs\n\nCourse Description:\n\nThis course is designed to develop & enhance the knowledge, skills, & attitudes of\nan electric power distribution line worker, in accordance with industry standards. It covers\nthe basic and common competencies in addition to the core competencies such as replace\nelectric distribution pole, pole top assemblies and conductors, install/replace single-, three-\nor vee-phase distribution line equipment and accessories, as well as install/replace single-,\nthree- or vee-phase consumer service connection facilities and conduct vegetation clearing\nalong distribution system.\n\nThe nominal duration of 220 hours covers the required units at Electric Power\nDistribution Operation and Maintenance NC III. TVET providers can however, offer a longer,\nladderized course covering the NC III basic, common and core units.\n\nTo obtain this, all units prescribed for this qualification must be achieved:\n\n--- PDF PAGE 72 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nElectric Power Distribution Operation and Maintenance NC III Revision 00 Promulgated June 27, 2018 68\n\nBASIC COMPETENCIES\n(48 hours)\n\nUNIT OF\nCOMPETENCY\nLEARNING\nOUTCOMES\nLEARNING ACTIVITIES\nMETHODOLOGY\nASSESSMENT\nAPPROACH\nNOMINAL\nDURATION\n1. Lead workplace\ncommunication\n1.1. Communicate\ninformation about\nworkplace\nprocesses\n1.1.1. Read\no Effective verbal communication methods\no Sources of information\n1.1.2. Practice organizing information\n1.1.3. Identify organization requirements for\nwritten and electronic communication\nmethods\n1.1.4. Follow organization requirements for the\nuse of written and electronic communication\nmethods\n1.1.5. Perform exercises on understanding and\nconveying intended meaning scenario\n• Lecture\n• Demonstration\n• Practical\nexercises\n• Role Play\n\n• Written Test\n• Observation\n2 Hours\n1.2. Lead workplace\ndiscussions\n1.2.1. Discuss organizational policy on production,\nquality and safety\n1.2.2. Goals/ objectives and action plan setting\n1.2.3. Read effective verbal communication\nmethods\n1.2.4. Prepare/set action plans based on\norganizational goals and objectives\n• Group\ndiscussion\n• Lecture\n• Demonstration\n• Oral\nevaluation\n• Written Test\n• Observation\n2 Hours\n1.3. Identify and\ncommunicate\nissues arising in\nthe workplace\n1.3.1. Discuss organizational policy in dealing with\nissues and problems\n1.3.2. Read effective verbal communication\nmethods\n1.3.3. Practice organizing information\n1.3.4. Perform exercises on understanding and\nconveying intended meaning scenario\n• Group\ndiscussion\n• Lecture\n• Demonstration\n• Role Play\n• Oral\nevaluation\n• Written Test\n• Observation\n\n2 Hours\n\n2. Lead small team\n2.1. Provide team\nleadership\n2.1.1. Discuss company policies and procedures\n2.1.2. Identify client expectations\n2.1.3. Practice team building skills\n2.1.4. Perform exercises on communication skills\nrequired for leading teams\n• Group\ndiscussion\n• Lecture\n• Demonstration\n• Role Play\n• Oral\nevaluation\n• Written\nexamination\n• Observation\n2 Hours\n\n--- PDF PAGE 73 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nElectric Power Distribution Operation and Maintenance NC III Revision 00 Promulgated June 27, 2018 69\n\nUNIT OF\nCOMPETENCY\nLEARNING\nOUTCOMES\nLEARNING ACTIVITIES\nMETHODOLOGY\nASSESSMENT\nAPPROACH\nNOMINAL\nDURATION\n2.2. Assign\nresponsibilities\n2.2.1. Discuss:\no Team member’s duties and\nresponsibilities\n2.2.2. Identify client expectations\n2.2.3. Practice negotiating skills\n2.2.4. Perform group exercises showing the skills\nand techniques in promoting team building\n\n• Group\ndiscussion\n• Lecture\n• Demonstration\n• Role Play\n• Oral\nevaluation\n• Written\nexamination\n• Observation\n2 Hours\n\n2.3. Set performance\nexpectations for\nteam members\n2.3.1. Discuss:\no Team member’s duties and\nresponsibilities\no How performance expectations are set\n2.3.2. Identify client expectations\n2.3.3. Perform group exercises in setting\nindividual target/ expectation\n2.3.4. Read instruction and requirements in up to\ndate dissemination to members\n• Group\ndiscussion\n• Lecture\n• Demonstration\n• Role Play\n• Lecture\n• Oral\nevaluation\n• Written\nexamination\n• Observation\n1 Hour\n2.4. Supervise team\nperformance\n2.4.1. Describe listening and treating individual\nteam members concern\n2.4.2. Identify methods of Monitoring Performance\n2.4.3. Perform group exercises showing the skills\nin monitoring team performance\n• Group\ndiscussion\n• Lecture\n• Demonstration\n• Oral\nevaluation\n• Written\nexamination\n• Observation\n1 Hour\n3. Develop and\npractice\nnegotiation skills\n3.1. Identify relevant\ninformation in\nplanning\nnegotiations\n3.1.1. Discuss codes of practice and guidelines for\nthe organization\n3.1.2. Discuss differences between content and\nprocess\n3.1.3. Read:\no Organizations policy and procedures for\nnegotiations\no Decision making and conflict resolution\nstrategies procedures\no Strategies to manage conflict\no Steps in negotiating process\n3.1.4. Identify bargaining information\n3.1.5. Apply strategies to manage process\n3.1.6. Apply steps in negotiating process\n• Group\nDiscussion\n• Lecture\n• Demonstration\n• Oral\nevaluation\n• Written\nexamination\n• Observation\n2 hours\n\n--- PDF PAGE 74 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nElectric Power Distribution Operation and Maintenance NC III Revision 00 Promulgated June 27, 2018 70\n\nUNIT OF\nCOMPETENCY\nLEARNING\nOUTCOMES\nLEARNING ACTIVITIES\nMETHODOLOGY\nASSESSMENT\nAPPROACH\nNOMINAL\nDURATION\n3.2. Participate in\nnegotiations\n3.2.1. Describe the following strategies during\nnegotiation:\no Decision making and conflict resolution\nstrategies procedures\no Problem solving strategies on how to\ndeal with unexpected questions and\nattitudes during negotiation\n3.2.2. Practice the following scenarios in a group\nactivity:\no Perform interpersonal skills to develop\nrapport with other parties\no Perform verbal communication and\nlistening skill\no observation skills\no negotiation skills\n\n• Group\nDiscussion\n• Case studies\n• Demonstration\n• Simulation/\nRole play\n• Oral\nevaluation\n• Observation\n2 Hours\n3.3. Document areas\nfor agreement\n3.3.1. Discuss the procedure in documenting\nnegotiations\n3.3.2. Apply a filing system in managing\ninformation\n3.3.3. Demonstrate filing of documents\n• Group\nDiscussion\n• Simulation/\nRole play\n• Demonstration\n• Oral\nevaluation\n• Observation\n2 Hours\n4. Solve workplace\nproblems related\nto work activities\n4.1. Identify the\nproblem\n\n4.1.1. Discuss Normal operating parameters &\nproduct quality\n4.1.2. Identify & clarify the nature of problem\n4.1.3. Read:\no Brainstorming\no Cause and effect diagrams\no PARETO analysis\no SWOT analysis\no GANT chart\no PERT CPM & graph\no SCATTERGRAMS\n4.1.4. Apply observation, investigation and\nanalytical techniques in solving problem in\nthe workplace\n• Group\ndiscussion\n• Lecture\n• Demonstration\n• Oral\nevaluation\n• Written\nexamination\n• Observation\n2 Hours\n\n--- PDF PAGE 75 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nElectric Power Distribution Operation and Maintenance NC III Revision 00 Promulgated June 27, 2018 71\n\nUNIT OF\nCOMPETENCY\nLEARNING\nOUTCOMES\nLEARNING ACTIVITIES\nMETHODOLOGY\nASSESSMENT\nAPPROACH\nNOMINAL\nDURATION\n4.2. Determine\nfundamental cause\nof the problem\n4.2.1. Discuss Teamwork and work allocation\nproblem\n4.2.2. Read:\no Using range of formal problem solving\ntechniques\no Enterprise goals, targets and measures\no Enterprise quality, OHS and\nenvironmental requirement\no Non-routine process and quality\nproblems\n4.2.3. Perform group exercises showing safety in\nemergency situations and incidents\n4.2.4. Identify & clarify the nature of problem\n4.2.5. Select relevant equipment and operational\nprocesses\n• Group\ndiscussion\n• Lecture\n• Demonstration\n• Role Play\n\n• Oral\nevaluation\n• Written\nexamination\n• Observation\n\n1 Hour\n4.3. Determine correct /\npreventive action\n4.3.1. Discuss principles of decision making\nstrategies and techniques\n4.3.2. Read:\no Evaluating the solution\no Devising the best solution\n4.3.3. Perform group exercise how to implement\nthe developed plan to rectify a problem\n\n• Group\nDiscussion\n• Lecture\n• Demonstration\n• Role Play\n• Oral\nevaluation\n• Written\nexamination\n• Observation\n1 Hour\n4.4. Provide\nrecommendation\nto manager\n4.4.1. Discuss industry codes and standards\n4.4.2. Apply enterprise information systems and\ndata collation\n4.4.3. Prepare recommendation letter\n\n• Group\nDiscussion\n• Demonstration\n• Oral\nevaluation\n• Observation\n1 Hour\n\n--- PDF PAGE 76 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nElectric Power Distribution Operation and Maintenance NC III Revision 00 Promulgated June 27, 2018 72\n\nUNIT OF\nCOMPETENCY\nLEARNING\nOUTCOMES\nLEARNING ACTIVITIES\nMETHODOLOGY\nASSESSMENT\nAPPROACH\nNOMINAL\nDURATION\n5. Use mathematical\nconcepts and\ntechniques\n5.1. Identify\nmathematical tools\nand techniques to\nsolve problems\n5.1.1. Discuss the four fundamental operation\n(addition, subtraction, division,\nmultiplication)\n5.1.2. Read:\no Measurement system\no Precision and accuracy\no Basic measuring tools/devices\n5.1.3. Apply mathematical computations\n5.1.4. Demonstrate activities on:\no Use of calculator\no Use of different measuring tools\n\n• Group\nDiscussion\n• Lecture\n• Demonstration\n• Oral\nevaluation\n• Written\nexamination\n• Observation\n1 Hour\n\n5.2. Apply\nmathematical\nprocedures /\nsolution\n5.2.1. Read:\no Estimation\no Problem-based questions\no Mathematical techniques\n5.2.2. Apply mathematical computations\n5.2.3. Demonstrate activities on:\no Use of calculator\no Use of different measuring tools\no Use of mathematical tools and standard\nformulas\n• Lecture\n• Demonstration\n• Simulation/\nRole play\n• Written\nexamination\n• Observation\n•\n2 Hours\n5.3. Analyze results\n5.3.1. Discuss the four fundamental operation\n(addition, subtraction, division,\nmultiplication)\n5.3.2. Read:\no Measurement system\no Precision and accuracy\no Basic measuring tools/devices\n5.3.3. Apply mathematical computations\n5.3.4. Demonstrate activities on:\no Use of calculator\no Use of different measuring tools\n• Group\nDiscussion\n• Lecture\n• Demonstration\n\n• Oral\nevaluation\n• Written\nexamination\n• Observation\n\n1 Hours\n\n--- PDF PAGE 77 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nElectric Power Distribution Operation and Maintenance NC III Revision 00 Promulgated June 27, 2018 73\n\nUNIT OF\nCOMPETENCY\nLEARNING\nOUTCOMES\nLEARNING ACTIVITIES\nMETHODOLOGY\nASSESSMENT\nAPPROACH\nNOMINAL\nDURATION\n6. Use relevant\ntechnologies\n6.1. Identify\nappropriate\ntechnology\n6.1.1. Discuss company policy in relation to\nrelevant technology\n6.1.2. Read:\no Awareness on technology and its\nfunction\no Relevant technology application/\nimplementation\no Operating instructions\n6.1.3. Practice basic communication skill in a\ngroup activity\n• Group\nDiscussion\n• Lecture\n• Demonstration\n• Simulation/\nRole Play\n• Oral\nevaluation\n• Written\nexamination\n• Observation\n1 Hour\n6.2. Apply relevant\ntechnology\n\n6.2.1. Discuss different management concepts\n6.2.2. Read:\no Relevant technology application/\nimplementation\no Technology adaptability\no Different management concepts\no Health and safety procedure\no Communication techniques\n6.2.3. Apply software applications skills\n6.2.4. Practice drills on installing application\nsoftware\n6.2.5. Practice basic communication skill in a\ngroup activity\n\n• Group\nDiscussion\n• Lecture\n• Demonstration\n• Simulation/\nRole Play\n• Oral\nevaluation\n• Written\nexamination\n• Observation\n2 Hours\n6.3. Maintain / enhance\nrelevant\ntechnology\n6.3.1. Read:\no Repair and maintenance procedure\no Operating instructions\n6.3.2. Practice drills:\no Installing application software\no Basic troubleshooting skills\n\n• Lecture\n• Demonstration\n• Simulation/\nRole Play\n• Written\nexamination\n• Observation\n2 Hours\n\n--- PDF PAGE 78 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nElectric Power Distribution Operation and Maintenance NC III Revision 00 Promulgated June 27, 2018 74\n\nUNIT OF\nCOMPETENCY\nLEARNING\nOUTCOMES\nLEARNING ACTIVITIES\nMETHODOLOGY\nASSESSMENT\nAPPROACH\nNOMINAL\nDURATION\n7. Apply critical\nthinking and\nproblem solving\ntechniques in the\nworkplace\n7.1. Examine specific\nworkplace\nchallenges\n7.1.1. Lecture and discussion on\no Processes, normal operating\nparameters, and product quality to\nrecognize nonstandard situations\no Enterprise goals, targets and measures\no Analytical techniques\no Types of problems\no Identification of fundamental cause\n• Lecture\n• Group\nDiscussion\n• Oral\nevaluation\n• Written\nExamination\n\n2 hrs\n7.2. Analyze the\ncauses of specific\nworkplace\nchallenges\n7.2.1. Lecture and collaboration on\no Root cause of the problem\no Problem solving tools\n7.2.2. Exercise on cause and effect\n\n• Lecture\n• Group\nDiscussion\n• Oral\nevaluation\n• Written\nExamination\n• Observation\n2 hrs\n7.3. Formulate\nresolutions to\nspecific workplace\nchallenges\n7.3.1. Lecture and discussion on\no Identification and analysis of possible\noptions for problem resolution\no Corrective actions\no Principles of decision making strategies\nand techniques\no Provision of recommendation\n7.3.2. Layouting of action plans\n• Lecture\n• Group\nDiscussion\n• Oral\nevaluation\n• Written\nExamination\n• Observation\n2 hrs\n7.4. Implement action\nplans and\ncommunicate\nresults\n7.4.1. Using range of formal problem solving\ntechniques\n7.4.2. Devising best solutions\n7.4.3. Preparation and presentation of sample\nrecommendation report\n\n• Lecture\n• Group\nDiscussion\n• Oral\nevaluation\n• Written\nExamination\n• Presentation\n2 hrs\n8. Work in a\ndiverse\nenvironment\n8.1. Develop an\nindividual’s cultural\nawareness and\nsensitivity\n8.1.1. Lecture and discussion on:\no Enterprise policies and core values\no Awareness on individual cultures and\nworld geography\no Different methods of verbal and non-\nverbal communication in a multicultural\nsetting\no Workplace Diversity Policy\n\n• Lecture\n• Group\nDiscussion\n• Oral\nevaluation\n• Written\nExamination\n• Presentation\n\n2 hrs\n\n--- PDF PAGE 79 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nElectric Power Distribution Operation and Maintenance NC III Revision 00 Promulgated June 27, 2018 75\n\nUNIT OF\nCOMPETENCY\nLEARNING\nOUTCOMES\nLEARNING ACTIVITIES\nMETHODOLOGY\nASSESSMENT\nAPPROACH\nNOMINAL\nDURATION\n8.2. Work effectively in\nan environment\nthat acknowledges\nand values cultural\ndiversity\n8.2.1. Lecture and discussion on:\no The value of diversity in the economy\nand society in terms of Workforce\ndevelopment\no Innovation\no Social justice\no Customer service excellence\no Teamwork and collaboration\n8.2.2. Applying strategies for customer service\nexcellence\n\n• Lecture\n• Group\nDiscussion\n• Oral\nevaluation\n• Written\nExamination\n• Presentation\n\n2 hrs\n8.3. Identify common\nissues in a\nmulticultural and\ndiverse\nenvironment\n8.3.1. Lecture and discussion on:\no Diversity-related conflicts within the\nworkplace\no Change management policies\no Advance strategies for customer service\nexcellence\n8.3.2. Identifying and addressing workplace\nharassment\n8.3.3. Applying advance strategies for customer\nservice excellence\n\n• Lecture\n• Group\nDiscussion\n• Oral\nevaluation\n• Written\nExamination\n• Presentation\n\n4 hrs\n\nNote: Basic competencies may be embedded in the core competencies.\n\n--- PDF PAGE 80 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nElectric Power Distribution Operation and Maintenance NC III Revision 00 Promulgated June 27, 2018 76\n\nCOMMON COMPETENCIES\n(60 hours)\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n1. Apply Quality\nStandards\n1.1 Assess quality\nof received\nmaterials\n\n1.1.1 Identify relevant production processes, materials\nand products\n1.1.2 Study and interpret characteristics of materials,\nsoftware and hardware used in production\nprocesses\n1.1.3 Perform quality checking procedures\n1.1.4 Apply quality Workplace procedures\n1.1.5 Identify faulty materials\n1.1.6 Check quality of materials or component parts as\nper manufacturer’s standards\n1.1.7 Interpret specifications or symbols\n• Lecture\n• Field trip\n• Symposium\n• Video clips\n• Simulation/ Role\nplaying\n• Written test\n• Demonstration\n& questioning\n• Observation &\nquestioning\n2 hours\n1.2 Assess own\nwork\n1.2.1 Perform workplace procedure in documenting\ncompleted work\n1.2.2 Perform fault identification and reporting\n1.2.3 Observe safety and environmental aspects of\nproduction processes\n1.2.4 Utilize workplace quality indicators\n1.2.5 Document and report deviations from specified\nquality standards\n• Field trip\n• Symposium\n• Simulation\n• On the job training\n• Demonstration\n& questioning\n• Observation &\nquestioning\n2 hours\n1.3 Engage in\nquality\nimprovement\n1.3.1 Participate in quality improvement processes\na. IEC/ISO standards\nb. Environmental and safety standards\n1.3.2 Carry out work as per process improvement\nprocedures\n1.3.3 Monitor operation performance\n1.3.4 Implement continuous improvement\n• Field trip\n• Symposium\n• Simulation\n• On the job training\n• Demonstration\n& questioning\n• Observation &\nquestioning\n\n8 hours\n2. Comply with\nenvironmental\nprotection\nprocedures\n2.1 Access\ninformation\nconcerning\nenvironmental\nprotection\nregulations and\nprocedures\n2.1.1 Lecture on relevant environmental protection\nregulations & codes of practice\n2.1.2 Lecture/Discussion on environmental risks\nassociated with workplace operations and related\nprecautions to control the risk\n2.1.3 Lecture/Discussion on environmental protection\nstandards required in the workplace\n• Lecture\n• Discussion\n• Demonstration\n• Viewing\nmultimedia\n• Hands on practice\n\n• Observation in\nworkplace\n• Demonstration\n• Oral\nquestioning\n• Third Party\nReport\n4 hours\n\n--- PDF PAGE 81 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nElectric Power Distribution Operation and Maintenance NC III Revision 00 Promulgated June 27, 2018 77\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n2.1.4 Lecture on workplace reporting and recording\nprocesses and procedures\n2.1.5 Accessing information and data\n2.1.6 Identifying potential environmental risks and ways\nof minimizing them\n\n2.2 Implement and\nmonitor\nprocedures\nconcerning\nenvironmental\nhazards\n\n2.2.1 Applying environmental protection regulations &\ncodes of practice concerning environmental\nhazards\n2.2.2 Lecture/Discussion on workplace procedures and\nguidelines for implementing and monitoring\nprocedures concerning environmental hazards\n2.2.3 Lecture/Discussion on workplace environmental\nhazards and related hazard control measures\n2.2.4 Using equipment and resources required when\nimplementing and monitoring environmental\nprotection procedures\n2.2.5 Lecture/Discussion on Organizational structure and\nsite layout\n2.2.6 Reporting and recording processes and procedures\n2.2.7 Application of problem solving techniques\n2.2.8 Identifying potential environmental hazards and\nways on minimizing them\n2.2.9 Identifying and correctly using equipment and\nvehicles in accordance with environmental\nprotection regulations and guidelines\n• Lecture\n• Discussion\n• Demonstration\n• Viewing\nmultimedia\n• Hands on practice\n\n• Observation in\nworkplace\n• Demonstration\n• Oral\nquestioning\n• Third Party\nReport\n\n4 hours\n\n2.3 Implement and\nmonitor\nenvironmental\ncontrol\nprocedures\n2.3.1 Applying relevant environmental protection\nregulations & codes of practice for environmental\ncontrol procedures\n2.3.2 Lecture/Discussion on workplace procedures and\nguidelines for implementing and monitoring\nenvironmental control procedures\n2.3.3 Using equipment and resources required when\nimplementing and monitoring environmental control\nprocedures\n2.3.4 Carry out workplace reporting and recording\nprocesses and procedures\n• Lecture\n• Discussion\n• Demonstration\n• Viewing\nmultimedia\n• Hands on practice\n\n• Observation in\nworkplace\n• Demonstration\n• Oral\nquestioning\n\n4 hours\n\n--- PDF PAGE 82 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nElectric Power Distribution Operation and Maintenance NC III Revision 00 Promulgated June 27, 2018 78\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n2.3.5 Application of problem solving techniques\n2.3.6 counsel, advise and inform others on\nenvironmental control procedures\n2.3.7 identifying and correctly using equipment and\nvehicles in accordance with environmental control\nprocedures, regulations and guidelines\n3. Observe\nprocedures,\nSpecifications\nand Manuals\nof\nInstructions\n3.1. Identify and\naccess\nspecification/\nmanuals\n3.1.1. Familiarization on types of manuals used in\ntransmission lines\n3.1.2. Identification of symbols used in the manuals\n3.1.3. Discussion on manuals and specifications\n3.1.4. Accessing information and data\n• Lecture-\ndemonstration\n• Oral\nquestioning\n• Written test or\nexamination\n2 Hours\n3.2. Interpret\nmanuals\n3.2.1. Interpretation of symbols used in manuals\n3.2.2. Lecture and discussion on system of\nmeasurements\n3.2.3. Lecture on Unit conversion\n3.2.4. Accessing information and data\n• Ac