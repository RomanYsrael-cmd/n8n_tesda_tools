      "source_text": "3.6 TRAINERS QUALIFICATIONS\n\nElectric Power Distribution Operation and Maintenance NC III\n•\nHolder of National TVET Trainer’s Certificate (NTTC) Level 1 in Electric\nPower Distribution Operation and Maintenance NC III\n•\nMust have at least 3-years relevant supervisory experience in distribution\nline works within the last 10 years, e.g. Line Supervisor/Lead Lineworker\n•\nMust have completed the Basic Occupational Safety and Health (BOSH)\nCourse and/or related Electrical Safety Training conducted by OSHC and\nDOLE accredited Safety Training Organizations\n•\nMust be physically fit"
