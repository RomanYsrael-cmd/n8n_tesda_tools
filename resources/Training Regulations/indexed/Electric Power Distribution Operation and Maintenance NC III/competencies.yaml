        "source_text": "UTL311207\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills, (and) attitudes and values\nneeded to perform computer operations which include inputting,\naccessing, producing and transferring data using the appropriate\nhardware and software\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Plan and\nprepare for\ntask to be\nundertaken\n1.1. Requirements of task are\ndetermined\n1.2. Appropriate hardware and\nsoftware are selected\naccording to task assigned\nand required outcome\n1.3. Task is planned to ensure\nOH&S guidelines and\nprocedures are followed\n1.1. Main types of\ncomputers and\nbasic features of\ndifferent\noperating\nsystems\n1.2. Main parts of a\ncomputer\n1.3. Information on\nhardware and\nsoftware\n1.4. Data security\nguidelines\n1.1. Reading and\ncomprehension\nskills required to\ninterpret work\ninstruction and to\ninterpret basic user\nmanuals.\n1.2. Communication\nskills to identify\nlines of\ncommunication,\nrequest advice,\nfollow instructions\nand receive\nfeedback.\n1.3. Interpreting user\nmanuals and\nsecurity guidelines\n2. Input data\ninto\ncomputer\n2.1. Data are entered into the\ncomputer using appropriate\nprogram/application in\naccordance with company\nprocedures\n2.2. Accuracy of information is\nchecked and information is\nsaved in accordance with\nstandard operating\nprocedures\n2.3. Inputted data are stored in\nstorage media according to\nrequirements\n2.4. Work is performed within\nergonomic guidelines\n2.1. Basic\nergonomics of\nkeyboard and\ncomputer user\n2.2. Storage devices\nand basic\ncategories of\nmemory\n2.3. Relevant types\nof software\n2.1. Technology skills\nto use equipment\nsafely including\nkeyboard skills.\n2.2. Entering data\n3. Access\ninformation\nusing\ncomputer/\nsmartphone\n3.1. Correct program/application\nis selected based on job\nrequirements\n3.2. Program/application\ncontaining the information\nrequired is accessed\naccording to company\nprocedures\n3.3. Desktop icons are\ncorrectly selected, opened\nand closed for navigation\npurposes\n3.1. General security,\nprivacy\nlegislation and\ncopyright\n3.2. Productivity\nApplication\n3.3. Business\nApplication\n3.1. Accessing\ninformation\n3.2. Searching and\nbrowsing files and\ndata\n\n--- PDF PAGE 51 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nElectric Power Distribution Operation and Maintenance NC III Revision 00 Promulgated June 27, 2018 47\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n\n3.4. Keyboard techniques are\ncarried out in line with\nOH&S requirements for safe\nuse of keyboards\n\n4. Produce/\noutput data\nusing\ncomputer\nsystem\n4.1. Entered data are processed\nusing appropriate software\ncommands\n4.2. Data printed out as required\nusing computer\nhardware/peripheral devices\nin accordance with standard\noperating procedures\n4.3. Files, data are transferred\nbetween compatible\nsystems using computer\nsoftware, hardware/\nperipheral devices in\naccordance with standard\noperating procedures\n4.1. Computer\napplication in\nprinting,\nscanning and\nsending facsimile\n4.2. Types and\nfunction of\ncomputer\nperipheral\ndevices\n4.1. Computer data\nprocessing\n4.2. Printing of data\n4.3. Transferring files\nand data\n5. Maintain\ncomputer\nequipment\nand systems\n5.1. Systems for cleaning, minor\nmaintenance and\nreplacement of\nconsumables are\nimplemented\n5.2. Procedures for ensuring\nsecurity of data, including\nregular back-ups and virus\nchecks are implemented in\naccordance with standard\noperating procedures\n5.3. Basic file maintenance\nprocedures are\nimplemented in line with the\nstandard operating\nprocedures\n5.1. Computer\nequipment/\nsystem basic\nmaintenance\nprocedures\n5.2. Viruses\n5.3. OH & S\nprinciples and\nresponsibilities\n5.4. Calculating\ncomputer\ncapacity\n5.5. System Software\n5.1. Basic file\nmaintenance\nprocedures\n5.1. Removing\ncomputer viruses\nfrom infected\nmachines\n5.1. Making backup\nfiles\n\n--- PDF PAGE 52 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nElectric Power Distribution Operation and Maintenance NC III Revision 00 Promulgated June 27, 2018 48\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Hardware and\nperipheral devices\nMay include:\n1.1. Personal computers\n1.2. Networked systems\n1.3. Communication equipment\n1.4. Printers\n1.5. Scanners\n1.6. Keyboard\n1.7. Mouse\n\n2. Software\nSoftware includes the following but not limited to:\n2.1. Word processing packages\n2.2. Data base packages\n2.3. Internet\n2.4. Spreadsheets\n\n3. OH & S guidelines\n3.1. OHS guidelines\n3.2. Enterprise procedures\n\n4. Storage media\nStorage media include the following but not limited to:\n4.1. CDs\n4.2. zip disks\n4.3. hard disk drives, local and remote\n4.4. cloud storage\n\n5. Ergonomic guidelines\n5.1. Types of equipment used\n5.2. Appropriate furniture\n5.3. Seating posture\n5.4. Lifting posture\n5.5. Visual display unit screen brightness\n\n6. Desktop icons\nIcons include the following but not limited to:\n6.1. directories/folders\n6.2. files\n6.3. network devices\n6.4. recycle bin\n\n7. Maintenance\nMay include:\n7.1. Creating more space in the hard disk\n7.2. Reviewing programs\n7.3. Deleting unwanted files\n7.4. Backing up files\n7.5. Checking hard drive for errors\n7.6. Using up to date anti-virus programs\n7.7. Cleaning dust from internal and external surfaces\n\n--- PDF PAGE 53 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nElectric Power Distribution Operation and Maintenance NC III Revision 00 Promulgated June 27, 2018 49\n\nEVIDENCE GUIDE\n\n1. Critical aspect of\ncompetency\nAssessment requires evidence that the candidate:\n1.1. Selected and used hardware components correctly and\naccording to the task requirement\n1.2. Identified and explain the functions of both hardware\nand software used, their general features and\ncapabilities\n1.3. Produced accurate and complete data in accordance\nwith the requirements\n1.4. Used appropriate devices and procedures to transfer\nfiles/data accurately\n1.5. Maintained computer system\n2. Resource implication\n2.1. Computer hardware with peripherals\n2.2. Appropriate software\n3. Method of assessment\n3.1. The assessor may select two of the following\nassessment methods to objectively assess the\ncandidate:\n3.1.1. Observation\n3.1.2. Questioning\n3.1.3. Practical demonstration\n4. Context of Assessment\n4.1.\nAssessment may be conducted in the workplace or in\na simulated work environment\n\n--- PDF PAGE 54 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nElectric Power Distribution Operation and Maintenance NC III Revision 00 Promulgated June 27, 2018 50\n\nCORE COMPETENCIES\n\nUNIT OF COMPETENCY : REPLACE ELECTRIC DISTRIBUTION POLE, POLE TOP\nASSEMBLY AND CONDUCTORS\nUNIT CODE\n :"
