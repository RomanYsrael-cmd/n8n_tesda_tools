        "evidence_guide": {
          "source_text": "1. Critical aspects\nof competency\nAssessment requires evidence that the candidate:\n1.1. Planned and prepared for installation/ replacement work\n1.2. Installed single-, three- or vee-phase line equipment and\naccessories\n1.3. Tapped/Connected single-, three- or vee-phase line\nequipment and devices to distribution line\n2. Resource\nimplications\nThe following resources should be available:\n2.1. Needed tools, equipment and devices\n2.2. Appropriate PPE\n2.3. Site or work area\n2.4. Transformer gin, Pulley or block and tackle, Handline / Rope /\nBull line\n2.5. Boom or derrick truck (if necessary)\n\n3. Method of\nassessment\nCompetency may be assessed through:\n3.1 Direct observation/Demonstration with oral questioning\n3.2 Written test\n4. Context of\nassessment\n4.1. Competency maybe assessed in the workplace or in a\nsimulated workplace setting\n4.2. Assessment shall be undertaken either individually or part of\nteam under limited supervision\n\n--- PDF PAGE 63 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nElectric Power Distribution Operation and Maintenance NC III Revision 00 Promulgated June 27, 2018 59\n\nUNIT OF COMPETENCY : INSTALL/REPLACE SINGLE-, THREE- OR VEE-PHASE\nCONSUMER SERVICE CONNECTION FACILITY\nUNIT CODE :"
        },
        "source_text": "UTL741317\nDESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes required\nto install/replace single-, three-, or vee-phase distribution line\nequipment and devices. This involves planning and\npreparing for installation or replacement work, installing\nsingle-, three- or vee-phase equipment and accessories and\ntapping/connecting single-, three- or vee-phase line\nequipment and devices to distribution line. This involves\nworking with a team.\nELEMENT\nPERFORMANCE CRITERIA\n(Italicized Bold terms are elaborated in\nthe range of variables)\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Plan and\nprepare for\ninstallation/\nreplacement\nwork\n\n1.1 Work instructions are secured\nand interpreted according to job\nrequirements\n1.2 Relevant occupational safety\nrequirements are identified\nfollowing job specifications\n1.3 Relevant single-, three- or vee-\nphase distribution line tools,\nequipment, materials and\ndevices are identified,\nrequested and acquired in\naccordance with construction\nspecifications\n1.4 Personal protective equipment\n(PPE) are obtained following\njob requirements\n\n1.1 Uses and\nspecifications of\nsingle-, three- or\nvee-phase\ndistribution line\nequipment and\ndevices\n1.2 Relevant\noccupational safety\nrequirements\n1.3 Safety procedures\nfor installing single-\n, three- or vee-\nphase distribution\nline equipment and\ndevices\n1.4 Power distribution\nindustry standards\nand specifications\n1.1 Interpretation\nskills\n1.2 Identifying\nsingle-, three-\nor vee-phase\ndistribution line\nequipment and\ndevices\n1.3 Identifying\noccupational\nsafety\nstandards for\nline workers\n\n2. Install single-,\nthree- or vee-\nphase line\nequipment\nand\naccessories\n2.1 Lifting devices and pole clamp\nor bracket are installed securely\nto the top of the pole.\n2.2 Boring is performed, if\nnecessary, in accordance with\nthe installation procedure\n2.3 Line equipment and\naccessories are installed in\naccordance with construction\nand wiring specification\nstandards\n2.4 Housekeeping procedure is\nperformed in line with\nestablished procedure\n\n2.1 Types of lifting\nequipment\n2.2 Types of single-,\nthree- or vee-phase\nline equipment and\ndevices\n2.3 Line equipment and\naccessories\ninstallation\nprocedures\n\n2.1 Identifying\nlifting of\ndevices and\nequipment\n2.2 Rigging skills\n2.3 Boring skills\n2.4 Wiring skills\n\n3. Tap/Connect\nthree-phase\nline equipment\n3.1 Connectors/jumpers are\ninstalled between line\nconductors and equipment for\nsafety, conductivity and\nreliability purposes.\n3.1 Kinds of connectors\n3.2 Tapping and\nconnection\nprocedure of\nsingle-, three- or\n3.1 Proper use of\nconnectors\n3.2 Correct\ntapping and\nconnections\n\n--- PDF PAGE 59 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nElectric Power Distribution Operation and Maintenance NC III Revision 00 Promulgated June 27, 2018 55\n\nELEMENT\nPERFORMANCE CRITERIA\n(Italicized Bold terms are elaborated in\nthe range of variables)\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\nand devices to\ndistribution line\n3.2 Grounding for equipment is\ninstalled in accordance with line\nconstruction specifications.\n3.3 Line tapping and connection is\nperformed in accordance with\nthe wiring specification\n\nvee-phase\nequipment and\ndevices\n3.3 Proper grounding\nprocedure for\nsingle-, three- or\nvee-phase\nequipment and\ndevices\n3.3 Proper\ninstallation of\ngrounding\n\n--- PDF PAGE 60 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nElectric Power Distribution Operation and Maintenance NC III Revision 00 Promulgated June 27, 2018 56\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Work instruction\nMay include but are not limited to:\n1.1\njob order form\n1.2\nwork order form\n2. Occupational\nsafety\nrequirements\nMay include:\n2.1 Personal protective equipment (PPE)\n2.1.1. Hard hat/Safety hat\n2.1.2. Goggles/Eye protector\n2.1.3. Working gloves\n2.1.4. Line worker boots\n2.1.5. Working clothes\n2.1.6. Rain suits\n2.1.7. Rubber boots\n2.2\nPole climbing equipment\n2.2.1. Safety strap/cord\n2.2.2. Body belt\n2.2.3. Pair of climbers\n\n3. Tools, materials,\nequipment and\ndevices\nMay include but not limited to:\n3.1 Tools\n3.1.1. Rope/Hand line/Bull line\n3.1.2. Adjustable wrench or Line worker wrench\n3.1.3. Pliers\n3.1.4. Ball peen hammer\n3.1.5. Measuring rule / steel tape\n3.1.6. Screw driver\n3.1.7. Auger bit\n3.1.8. Wire skinning knife\n3.1.9. Compression tool\n3.2\nMaterials/Hardware\n3.2.1. conductors\n3.2.2. insulators and pins\n3.2.3. ground rod\n3.2.4. ground lead\n3.2.5. connectors\n3.2.6. ground clip\n3.2.7. bolts and accessories\n3.2.8. pole clamps\n3.2.9. wedge clamps\n3.2.10.\nhot line clamps\n3.3\nEquipment and devices\n3.3.1. Transformer gin\n3.3.2. Cut-out and lightning arrester\n3.3.3. Distribution transformer\n3.3.4. Pulley or block and tackle\n3.3.5. Ladder\n3.3.6. Boom truck or derrick truck\n3.3.7. Pole climbing equipment\n\n--- PDF PAGE 61 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nElectric Power Distribution Operation and Maintenance NC III Revision 00 Promulgated June 27, 2018 57\n\nVARIABLE\nRANGE\n4. Lifting devices\nMay include:\n4.1\nTransformer gin\n4.2\nPulley or block and tackle\n4.3\nHandline / Rope / Bull line\n5. line equipment\nand accessories\nMay include:\n5.1\ndistribution transformer\n5.2\ncut-out\n5.3\nlightning arrester\n6. equipment\nMay include:\n6.1\nfuse cut-out\n6.2\nlightning arrester\n6.3\ntransformer\n\n--- PDF PAGE 62 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nElectric Power Distribution Operation and Maintenance NC III Revision 00 Promulgated June 27, 2018 58\n\n EVIDENCE GUIDE\n1. Critical aspects\nof competency\nAssessment requires evidence that the candidate:\n1.1. Planned and prepared for installation/ replacement work\n1.2. Installed single-, three- or vee-phase line equipment and\naccessories\n1.3. Tapped/Connected single-, three- or vee-phase line\nequipment and devices to distribution line\n2. Resource\nimplications\nThe following resources should be available:\n2.1. Needed tools, equipment and devices\n2.2. Appropriate PPE\n2.3. Site or work area\n2.4. Transformer gin, Pulley or block and tackle, Handline / Rope /\nBull line\n2.5. Boom or derrick truck (if necessary)\n\n3. Method of\nassessment\nCompetency may be assessed through:\n3.1 Direct observation/Demonstration with oral questioning\n3.2 Written test\n4. Context of\nassessment\n4.1. Competency maybe assessed in the workplace or in a\nsimulated workplace setting\n4.2. Assessment shall be undertaken either individually or part of\nteam under limited supervision\n\n--- PDF PAGE 63 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nElectric Power Distribution Operation and Maintenance NC III Revision 00 Promulgated June 27, 2018 59\n\nUNIT OF COMPETENCY : INSTALL/REPLACE SINGLE-, THREE- OR VEE-PHASE\nCONSUMER SERVICE CONNECTION FACILITY\nUNIT CODE :"
