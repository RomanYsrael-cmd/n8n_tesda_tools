        "source_text": "--- PDF PAGE 17 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ \nElectric Power Distribution Operation and Maintenance NC III  Revision 00   Promulgated June 27, 2018   13  \nUNIT OF COMPETENCY : \nSOLVE PROBLEMS RELATED TO WORK ACTIVITIES  \nUNIT CODE \n:    500311112 \nUNIT DESCRIPTOR \n: \nThis unit of covers the knowledge, skills and attitudes \nrequired to solve problems in the workplace including the \napplication of problem solving techniques and to determine \nand resolve the root cause of problems. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated \nin the  Range of Variables \nREQUIRED \nKNOWLEDGE \n \nREQUIRED SKILLS \n1. Identify the \nproblem \n1.1. Variances are identified \nfrom normal operating \nparameters; and product \nquality \n1.2. Extent, cause and nature \nof the problem are \ndefined through \nobservation, investigation \nand analytical \ntechniques  \n1.3. Problems are clearly \nstated and specified \n \n1.1. Competence \nincludes a thorough \nknowledge and \nunderstanding of \nthe process, normal \noperating \nparameters, and \nproduct quality to \nrecognize non-\nstandard situations \n1.2. Competence to \ninclude the ability to \napply and explain, \nsufficient for the \nidentification of \nfundamental cause, \ndetermining the \ncorrective action \nand provision of \nrecommendations \n1.3. Relevant equipment \nand operational \nprocesses \n1.4. Enterprise goals, \ntargets and \nmeasures \n1.5. Enterprise quality, \nOHS and \nenvironmental \nrequirement \n1.6. Enterprise \ninformation systems \nand data collation \n1.7. Industry codes and \nstandards \n1.8. Normal operating \nparameters and \nproduct quality \n1.9. Identifying and \nclarifying the nature \nof problem \n1.1. Using range of \nformal problem \nsolving \ntechniques \n1.2. Identifying and \nclarifying the \nnature of the \nproblem \n1.3. Evaluating the \neffectiveness of \na present \nprocess in the \nworkplace \n1.4. Applying \nanalytical \ntechniques \n \n2. Determine \nfundamental \n2.1 Possible causes are \nidentified based on \nexperience and the use \n2.1 Relevant equipment \nand operational \nprocesses \n2.1  Analysis of root \ncauses\n\n--- PDF PAGE 18 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ \nElectric Power Distribution Operation and Maintenance NC III  Revision 00   Promulgated June 27, 2018   14  \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated \nin the  Range of Variables \nREQUIRED \nKNOWLEDGE \n \nREQUIRED SKILLS \ncauses of the \nproblem  \nof problem solving tools/ \nanalytical techniques. \n2.2 Possible cause \nstatements are \ndeveloped based on \nfindings \n2.3 Fundamental causes are \nidentified per results of \ninvestigation conducted \n \n2.2 Enterprise goals, \ntargets and \nmeasures \n2.3 Enterprise quality, \nOHS and \nenvironmental \nrequirements \n2.4 Enterprise \ninformation systems \nand data collation \n2.5 Industry codes and \nstandards \n3. Determine \ncorrective action \n3.1. All possible options are \nconsidered for resolution \nof the problem \n3.2. Strengths and \nweaknesses of possible \noptions are considered \n3.3. Corrective actions are \ndetermined to resolve the \nproblem and possible \nfuture causes \n3.4. Action plans are \ndeveloped identifying \nmeasurable objectives, \nresource needs and \ntimelines in accordance \nwith safety and operating \nprocedures \n \n3.1. Understanding the \nprocedure in \nundertaking \ncorrective action \n3.2. Principles of \ndecision making \nstrategies and \ntechniques \n3.3. Enterprise \ninformation systems \nand data collation \n3.4. Action planning \n3.1. Identifying and \nclarifying the \nnature of the \nproblem \n3.2. Devising the \nbest solution \n3.3. Evaluating the \nsolution \n3.4. Implementing  \ndeveloped plan \nto rectify the \nproblem  \n3.5. Implementing \ncorrective and \npreventive \nactions based \non root cause \nanalysis \n4. Provide \nrecommendation/s \nto manager \n4.1 Report on \nrecommendations is \nprepared according to \nprocedures. \n4.2 Recommendations are \npresented to appropriate \npersonnel. \n4.3 Recommendations are \nfollowed-up, if required \n4.1 How to make a \nreport and \nrecommendation \n4.1 Writing report and \nrecommendations\n\n--- PDF PAGE 19 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- \nElectric Power Distribution Operation and Maintenance NC III  Revision 00   Promulgated June 27, 2018   15  \n \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Analytical techniques \n1.1. \nBrainstorming \n1.2. \nIntuitions/Logic \n1.3. \nCause and effect diagrams \n1.4. \nPareto analysis \n1.5. \nSWOT analysis \n1.6. \nGant chart, Pert CPM and graphs \n1.7. \nScatter grams  \n \n2. Problem \n \n2.1. \nNon – routine process and quality problems \n2.2. \nEquipment selection, availability and failure \n2.3. \nTeamwork and work allocation problem \n2.4. \nSafety and emergency situations and \nincidents \n \n3. Action plans  \n \n3.1. \nPriority requirements \n3.2. \nMeasurable objectives \n3.3. \nResource requirements \n3.4. \nTimelines \n3.5. \nCo-ordination and feedback requirements \n3.6. \nSafety requirements \n3.7. \nRisk assessment \n3.8. \nEnvironmental requirements\n\n--- PDF PAGE 20 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- \nElectric Power Distribution Operation and Maintenance NC III  Revision 00   Promulgated June 27, 2018   16  \n \nEVIDENCE GUIDE \n \n1. Critical aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1. \nIdentified the problem \n1.2. \nDetermined the fundamental causes of the problem \n1.3. \nDetermined the correct / preventive action \n1.4. \nProvided recommendation to manager \nThese aspects may be best assessed using a range of \nscenarios / case studies / what ifs as a stimulus with a walk \nthrough forming part of the response. These assessment \nactivities should include a range of problems, including new, \nunusual and improbable situations that may have happened. \n2. Resource \nImplications \n2.1. \nAssessment will require access to an operating plant \nover an extended period of time, or a suitable method \nof gathering evidence of operating ability over a range \nof situations. A bank of scenarios / case studies / what \nifs will be required as well as bank of questions which \nwill be used to probe the reason behind the observable \naction.  \n3.  Methods of \nAssessment \nCompetency may be assessed through: \n3.1. \nCase studies on solving problems in the workplace \n3.2. \n Observation \nThe unit will be assessed in a holistic manner as is practical \nand may be integrated with the assessment of other relevant \nunits of competency. Assessment will occur over a range of \nsituations, which will include disruptions to normal, smooth \noperation. Simulation may be required to allow for timely \nassessment of parts of this unit of competency. Simulation \nshould be based on the actual workplace and will include walk \nthrough of the relevant competency components.  \n4. Context for \nAssessment \n4.1. \nIn all workplace, it may be appropriate to assess this \nunit concurrently with relevant teamwork or operation \nunits.\n",
