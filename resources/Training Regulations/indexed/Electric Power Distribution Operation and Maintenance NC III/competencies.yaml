        "source_text": "UTL741318\nDESCRIPTOR : This unit covers the outcomes required for installing/replacing\nsingle-, three- or vee-phase consumer service connection\nfacility. The scope of this unit covers installing service drop and\nsingle-, three- or vee-phase KWH meter.\nELEMENT\nPERFORMANCE CRITERIA\n(Italicized Bold terms are\nelaborated in the range of variables)\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Plan and\nprepare for\nwork\n\n1.1 Work instruction is secured\nand interpreted according to\njob requirements\n1.2 Relevant occupational\nsafety requirements are\nidentified following job\nspecifications\n1.3 Necessary tools, materials,\nequipment and devices\nneeded for the work are\nidentified, requested and\nacquired in accordance with\nconstruction specifications\n1.4 Personal protective\nequipment (PPE) are\nobtained following job\nrequirements\n1.1 Uses and\nspecifications of\nsingle-, three- or\nvee-phase\ndistribution line\nequipment and\ndevices\n1.2 Relevant\noccupational\nsafety\nrequirements\n1.3 Safety procedures\nfor installing\nsingle-, three- or\nvee-phase\nconsumer service\ndevices\n1.4 Power distribution\nindustry standards\nand specifications\n1.1 Interpretation\nskills\n1.2 Identifying\nsingle-, three-\nor vee-phase\nconsumer\nservice devices\n1.3 Identifying\noccupational\nsafety\nstandards for\nline workers\n\n2. Install/\nReplace\nService Drop\n2.1 Approved electrical/ house\nwiring permit is secured for\nnew installation.\n2.2 Service drop accessories\nare installed/replaced\naccording to construction\nstandards and requirements\n2.3 Service drop cables are\ninstalled/replaced according\nconstruction standards and\nrequirements\n2.4 Service drop clearance is\nchecked in compliance to\nPhilippine Electrical Code\n2.1 Safety procedures\nfor proper\ninstallation/\nreplacement of\nservice drop\n2.2 Kinds of service\ndrop accessories\n2.3 Types of service\ndrop cables\n2.1 Interpretation\nskills\n2.2 Identifying and\nfollowing\noccupational\nsafety\nstandards for\nline workers\n2.3 Following safety\nprocedures for\nservice drop\ninstallation\n3. Install/\nReplace\nsingle-, three-\nor vee-phase\nKWH meter\n3.1 Meter base (socket-type) is\ninstalled/ replaced, if\nnecessary, according to\nconstruction standards and\nrequirements\n3.2 KWH meter is installed/\nreplaced according to\n3.1 Safety procedures\nfor proper\ninstallation/\nreplacement of\nsingle-, three- or\n3.1 Communication\nskills\n3.2 Identifying and\nfollowing\noccupational\nsafety\nstandards for\nline workers\n3.3 Following safety\nprocedures for\n\n--- PDF PAGE 64 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nElectric Power Distribution Operation and Maintenance NC III Revision 00 Promulgated June 27, 2018 60\n\nELEMENT\nPERFORMANCE CRITERIA\n(Italicized Bold terms are\nelaborated in the range of variables)\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\nconstruction standards and\nrequirements\n3.3 Customer is advised for\ncompletion of work and\nverify availability of electric\npower\n3.4 Housekeeping procedure is\nperformed in line with\nestablished procedure\n\nvee-phase KWH\nmeter\n3.2 Types of KWH\nmeter\n3.3 5-S principles\n\nsingle-, three- or\nvee-phase KWH\nmeter\ninstallation\n\n--- PDF PAGE 65 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nElectric Power Distribution Operation and Maintenance NC III Revision 00 Promulgated June 27, 2018 61\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Occupational safety\nrequirements\nMay include but not limited to:\n1.1 Personal protective equipment (PPE)\n1.1.1. Hard hat/Safety hat\n1.1.2. Goggles/Eye protector\n1.1.3. Work gloves\n1.1.4. Line worker boots\n1.1.5. Working clothes\n1.1.6. Rubber boots\n1.1.7. Rain suits\n1.2 Pole climbing equipment\n1.2.1. Safety strap/cord\n1.2.2. Body belt\n1.2.3. pair of climbers\n2. Tools, materials,\nequipment and\ndevices\nMay include but not limited to:\n2.1 Tools\n2.1.1. Rope/Hand line\n2.1.2. Adjustable wrench or lineman wrench\n2.1.3. Pliers\n2.1.4. Ball peen hammer\n2.1.5. Measuring rule (wood)\n2.1.6. Screw driver\n2.1.7. Auger bit\n2.1.8. Electric tape\n2.1.9. Wire skinning knife\n2.1.10. Compression/crimping tool\n2.2 Equipment and devices\n2.2.1. Ladder\n2.2.2. Pole climbing equipment\n2.2.3. Single-, three- or vee-phase KWH meter\n2.2.4. Multi-tester (amps-volt)\n2.3 Materials/Wires\n2.3.1 Service drop cables\n2.3.2 Service connection accessories\n3. Service drop\naccessories\nMay include:\n3.1 Oval eye bolt/nut\n3.2 Service swinging clevis\n3.3 Spool insulator\n3.4 Service grip / Dead-end loop clamp\n3.5 Service drop wire\n3.6 Service wire grip\n3.7 Strain/Screw insulators\n3.8 Compression connector/ Clamps\n3.9 Meter box\n4. Service drop cable\nMay include:\n4.1 Triplex aluminum/copper cable\n4.2 Duplex aluminum/copper cable\n4.3 Single wire copper\n\n--- PDF PAGE 66 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nElectric Power Distribution Operation and Maintenance NC III Revision 00 Promulgated June 27, 2018 62\n\nVARIABLE\nRANGE\n5. KWH meter\nMay include:\n5.1 Single-, three- or vee-phase\n5.2 Socket type or button connected\n\nEVIDENCE GUIDE\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1. Planned and prepared for work\n1.2. Installed/ Replaced Service Drop\n1.3. Install/ Replace single-, three- or vee-phase KWH meter\n\n2. Resource implications\nThe following resources should be available:\n2.1. PPE,\n2.2. Tools, materials, equipment and devices\n2.3. Site or work area\n\n3. Method of\nassessment\nCompetency may be assessed through:\n3.1. Direct observation / Demonstration with oral questioning\n3.2. Written test\n\n4. Context of\nassessment\n4.1. Competency maybe assessed in the workplace or in a\nsimulated workplace setting\n4.2. Assessment shall be undertaken either individually or part\nof team under limited supervision\n\n--- PDF PAGE 67 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nElectric Power Distribution Operation and Maintenance NC III Revision 00 Promulgated June 27, 2018 63\n\nUNIT OF COMPETENCY: CONDUCT VEGETATION CLEARING ALONG\nDISTRIBUTION SYSTEM\nUNIT CODE\n :"
