        "source_text": "UTL311203\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes needed to\napply quality standards in the workplace. The unit also includes\nthe application of relevant safety procedures and regulations,\norganization procedures and customer requirements\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized Bold terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Assess quality\nof received\nmaterials or\ncomponents\n1.1. Work instructions are\nobtained and work is carried\nout in accordance with\nstandard operating\nprocedures\n1.2. Received materials or\ncomponent parts are\nchecked against workplace\nstandards and specifications\n1.3. Faulty material or\ncomponents related to work\nare identified and isolated\n1.4. Faults and any identified\ncauses are recorded and/or\nreported to the supervisor\nconcerned in accordance with\nworkplace procedures\n1.5. Faulty materials or\ncomponents are replaced in\naccordance with workplace\nprocedures\n\n1.1. Relevant\nproduction\nprocesses,\nmaterials and\nproducts\n1.2. Characteristics of\nmaterials,\nsoftware and\nhardware used in\nproduction\nprocesses\n1.3. Quality checking\nprocedures\n1.4. Quality\nWorkplace\nprocedures\n1.5. Identification of\nfaulty materials\nrelated to work\n1.1. Reading skills\nrequired to\ninterpret work\ninstruction\n1.2. Critical\nthinking\n1.3. Interpreting\nwork\ninstructions\n2. Assess own\nwork\n2.1. Documentation relative to\nquality within the company is\nidentified and used\n2.2. Completed work is checked\nagainst workplace standards\nrelevant to the task\nundertaken\n2.3. Faulty pieces are identified\nand isolated\n2.4. Information on the quality and\nother indicators of production\nperformance is recorded in\naccordance with workplace\nprocedures\n2.5. Deviations from specified\nquality standards, causes\nare documented and reported\nin accordance with the\n2.1. Safety and\nenvironmental\naspects of\nproduction\