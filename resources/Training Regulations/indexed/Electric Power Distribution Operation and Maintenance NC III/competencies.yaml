  "source_section_text": "SECTION 2:\nCOMPETENCY STANDARDS\n\nThis section gives the details of the contents of the basic, common, and core units\nof competency required for Electric Power Distribution Operation and Maintenance NC III.\n\nBASIC COMPETENCIES\n\nUNIT OF COMPETENCY : LEAD WORKPLACE COMMUNICATION\n\nUNIT CODE\n : 500311109\n\n UNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes required\nto lead in the dissemination and discussion of ideas,\ninformation and issues in the workplace.\n\nELEMENT\n PERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\n\nREQUIRED SKILLS\n1. Communicate\ninformation\nabout\nworkplace\nprocesses\n1.1. Appropriate\ncommunication method\nis selected\n1.2. Multiple operations\ninvolving several topics\nareas are communicated\naccordingly\n1.3. Questions are used to\ngain extra information\n1.4. Correct sources of\ninformation are identified\n1.5. Information is selected\nand organized correctly\n1.6. Verbal and written\nreporting is undertaken\nwhen required\n1.7. Communication skills are\nmaintained in all situations\n1.1. Organization\nrequirements for\nwritten and\nelectronic\ncommunication\nmethods\n1.2. Effective verbal\ncommunication\nmethods\n1.3. Methods of\nCommunication\n1.4. Types of\nQuestion\n1.5. Communication\nTools\n1.6. Questioning\nTechniques\n1.1. Organizing\ninformation\n1.2. Understanding\nand conveying\nintended meaning\n1.3. Participating in\nvariety of\nworkplace\ndiscussions\n1.4. Complying with\norganization\nrequirements for\nthe use of written\nand electronic\ncommunication\nmethods\n\n2. Lead workplace\ndiscussions\n2.1. Response to workplace\nissues are sought\n2.2. Response to workplace\nissues are provided\nimmediately\n2.3. Constructive contributions\nare made to workplace\ndiscussions on such\nissues as production,\nquality and safety\n2.4. Goals/objectives and\naction plan are\nundertaken in the\nworkplace are\ncommunicated\n2.1. Leading as a\nmanagement\nfunction\n2.2. Barriers of\ncommunication\n2.3. Effective verbal\ncommunication\nmethods\n2.4. Method/technique\ns of discussion\n2.5. How to lead\ndiscussion\n2.6. How to solicit\nresponse\n2.7. Goal setting and\naction planning\n2.1. Communicating\neffectively\n2.2. Consulting the\ncrew on the\nprepared menu\nfor the month\n\n--- PDF PAGE 8 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nElectric Power Distribution Operation and Maintenance NC III Revision 00 Promulgated June 27, 2018 4\nELEMENT\n PERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\n\nREQUIRED SKILLS\n3. Identify and\ncommunicate\nissues arising in\nthe workplace\n3.1. Issues and problems are\nidentified as they arise\n3.2. Information regarding\nproblems and issues are\norganized coherently to\nensure clear and effective\ncommunication\n3.3. Dialogue is initiated with\nappropriate personnel\n3.4. Communication problems\nand issues are raised as\nthey arise\n\n3.1. Types of issues\nand problems in\nthe workplace\n3.1.1. Workplace\nhazards\n3.1.2. Environmen\ntal hazards\n3.2. Written and\nelectronic\ncommunication\nmethods\n3.3. Communication\nbarriers affecting\nworkplace\ndiscussions\n\n3.1. Identifying cause\nof problems\n3.2. Identifying\nproblems and\nissues\n3.3. Organizing\ninformation on\nproblems and\nissues\n3.4. Relating\nproblems and\nissues in the\nworkplace\n3.5. Reporting\noccupational &\nenvironmental\nhazards during\nsafety meeting\n\n--- PDF PAGE 9 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nElectric Power Distribution Operation and Maintenance NC III Revision 00 Promulgated June 27, 2018 5\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Methods of\ncommunication\nMethods of communication may include:\n1.1. Non-verbal gestures\n1.2. Verbal\n1.3. Face to face\n1.4. Two-way radio\n1.5. Speaking to groups\n1.6. Using telephone\n1.7. Written\n1.8. Internet\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1.\nDealt with a range of communication/information at one\ntime\n1.2.\nMade constructive contributions in workplace issues\n1.3.\nSought workplace issues effectively\n1.4.\nResponded to workplace issues promptly\n1.5.\nPresented information clearly and effectively written form\n1.6.\nUsed appropriate sources of information\n1.7.\nAsked appropriate questions\n1.8.\nProvided accurate information\n\n2. Resource\nImplications\nThe following resources MUST be provided:\n2.1.\nVariety of Information\n2.2.\nCommunication tools\n2.3.\nSimulated workplace\n\n3. Methods of\nAssessment\nCompetency may be assessed through:\n3.1.\nCompetency in this unit must be assessed through\n3.2.\nDirect Observation\n3.3.\nInterview\n\n4. Context for\nAssessment\n4.1.\nCompetency may be assessed in the workplace or in\nsimulated workplace environment\n\n--- PDF PAGE 10 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nElectric Power Distribution Operation and Maintenance NC III Revision 00 Promulgated June 27, 2018 6\nUNIT OF COMPETENCY\n: LEAD SMALL TEAMS\nUNIT CODE\n : 500311110\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes to lead\nsmall teams including setting and maintaining team and\nindividual performance standards.\n\nELEMENT\n PERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n1. Provide team\nleadership\n1.1. Work requirements are\nidentified and presented\nto team members\n1.2. Reasons for instructions\nand requirements are\ncommunicated to team\nmembers\n1.3. Team members’\nqueries and concerns\nare recognized,\ndiscussed and dealt with\n1.1. Company policies and\nprocedures\n1.2. How performance\nexpectations are set\n1.3. Methods of\nMonitoring\nPerformance\n1.4. Client expectations\n1.5. Team member’s\nduties and\nresponsibilities\n1.6. Definition of Team\n1.7. Skills and techniques\nin promoting team\nbuilding\n1.8. Up-to-date\ndissemination of\ninstructions and\nrequirements to\nmembers\n1.9. Art of listening and\ntreating individual\nteam members\nconcern\n1.1. Communication\nskills required\nfor leading\nteams\n1.2. Team building\nskills\n1.3. Negotiating\nskills\n1.4. Evaluation\nskills\n2. Assign\nresponsibilities\n2.1. Duties and responsibilities\nare allocated having\nregard to the skills,\nknowledge and aptitude\nrequired to properly\nundertake the assigned\ntask and according to\ncompany policy\n2.2. Duties are allocated\nhaving regard to individual\npreference, domestic and\npersonal considerations,\nwhenever possible\n2.1. Concept of delegation\n2.2. How to delegate\n2.3. Understanding\nindividual differences\n2.4. Methods of\nmonitoring\nperformance\n2.5. Duties and\nresponsibilities of\neach team member\n2.6. Knowledge in\nidentifying each team\nmember duties and\nresponsibilities\n2.1. Delegating\nskills\n2.2. Identifying\nindividual\nskills,\nknowledge and\nattitude as\nbasis for\nallocating\nresponsibilities\n2.3. Identifying\neach team\nmember duties\nand\nresponsibilities\n3. Set\nperformance\nexpectations for\nteam members\n3.1. Performance\nexpectations are\nestablished based on\nclient needs and\naccording to assignment\nrequirements\n3.1. Definition of\nperformance\nindicators/ criteria\n3.2. Definition of team\ngoals and\nexpectations\n3.1. Identifying\nperformance\nindicators\n3.2. Evaluating\nperformance\n3.3. Setting\nindividual\n\n--- PDF PAGE 11 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nElectric Power Distribution Operation and Maintenance NC III Revision 00 Promulgated June 27, 2018 7\nELEMENT\n PERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n3.2. Performance\nexpectations are based\non individual team\nmembers duties and area\nof responsibility\n3.3. Performance\nexpectations are\ndiscussed and\ndisseminated to\nindividual team members\n3.3. Methods of\nmonitoring\nperformance\n3.4. Client expectations\n3.5. Team members\nduties and\nresponsibilities\n3.6. Defining performance\nexpectations criteria\nperformance\ntarget/\nexpectation\nindicators\n4. Supervised\nteam\nperformance\n4.1. Monitoring of\nperformance takes place\nagainst defined\nperformance criteria\nand/or assignment\ninstructions and corrective\naction taken if required\n4.2. Team members are\nprovided with feedback,\npositive support and\nadvice on strategies to\novercome any\ndeficiencies\n4.3. Performance issues\nwhich cannot be rectified\nor addressed within the\nteam are referenced to\nappropriate personnel\naccording to employer\npolicy\n4.4. Team members are kept\ninformed of any changes\nin the priority allocated to\nassignments or tasks\nwhich might impact on\nclient/customer needs and\nsatisfaction\n4.5. Team operations are\nmonitored to ensure that\nemployer/client needs and\nrequirements are met\n4.6. Follow-up communication\nis provided on all issues\naffecting the team\n4.7. All relevant\ndocumentation is\ncompleted in accordance\nwith company procedures\n4.1. Understanding\nMonitoring of work\n4.2. How to undertake\ncorrective action\n4.3. Understanding\nfeedback and\nprocedure\n4.4. Feedback reporting\nprocedure\n4.5. Methods of\nmonitoring\nperformance\n4.6. Team member’s\nduties and\nresponsibilities\n4.7. Monitoring team\noperation to ensure\nclient needs and\nsatisfaction\n4.1. Monitoring\nskills\n4.2. Setting\npriorities\n4.3. Evaluating\nperformance\n4.4. Informal/\nformal\ncounseling\nskills\n\n--- PDF PAGE 12 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nElectric Power Distribution Operation and Maintenance NC III Revision 00 Promulgated June 27, 2018 8\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Work requirements\n1.1. Client Profile\n1.2. Assignment instructions\n\n2. Team member’s concerns\n2.1. Roster/shift details\n3. Monitor performance\n3.1. Formal process\n3.2. Informal process\n\n4. Feedback\n4.1. Formal process\n4.2. Informal process\n\n5. Performance issues\n5.1. Work output\n5.2. Work quality\n5.3. Team participation\n5.4. Compliance with workplace protocols\n5.5. Safety\n5.6. Customer service\n\n--- PDF PAGE 13 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nElectric Power Distribution Operation and Maintenance NC III Revision 00 Promulgated June 27, 2018 9\n\nEVIDENCE GUIDE\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1. Maintained or improved individuals and/or team\nperformance given a variety of possible scenario\n1.2. Assessed and monitored team and individual\nperformance against set criteria\n1.3. Represented concerns of a team and individual to next\nlevel of management or appropriate specialist and to\nnegotiate on their behalf\n1.4. Allocated duties and responsibilities, having regard to\nindividual’s knowledge, skills and aptitude and the needs\nof the tasks to be performed\n1.5. Set and communicated performance expectations for a\nrange of tasks and duties within the team and provided\nfeedback to team members\n\n2. Resource\nImplications\nThe following resources MUST be provided:\n2.1. Access to relevant workplace or appropriately simulated\nenvironment where assessment can take place\n2.2. Materials relevant to the proposed activity or task\n\n3. Methods of\nAssessment\nCompetency may be assessed through:\n3.1. Direct observations of work activities of the individual\nmember in relation to the work activities of the group\n3.2. Observation of simulation and/or role play involving the\nparticipation of individual member to the attainment of\norganizational goal\n3.3. Case studies and scenarios as a basis for discussion of\nissues and strategies in teamwork\n\n4. Context for\nAssessment\n4.1. Competency assessment may occur in workplace or any\nappropriately simulated environment\n4.2. Assessment shall be observed while task are being\nundertaken whether individually or in-group\n\n--- PDF PAGE 14 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nElectric Power Distribution Operation and Maintenance NC III Revision 00 Promulgated June 27, 2018 10\nUNIT OF COMPETENCY: DEVELOP AND PRACTICE NEGOTIATION SKILLS\n\nUNIT CODE : 500311111\n\nUNIT DESCRIPTOR : This unit covers the skills, knowledge and attitudes required to\ncollect information in order to negotiate to a desired outcome\nand participate in the negotiation.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\n\nREQUIRED SKILLS\n1. Plan\nnegotiations\n1.1. Information on preparing\nfor negotiation is\nidentified and included in\nthe plan\n1.2. Information on creating\nnonverbal environments\nfor positive negotiating is\nidentified and included in\nthe plan\n1.3. Information on active\nlistening is identified and\nincluded in the plan\n1.4. Information on different\nquestioning techniques\nis identified and included in\nthe plan\n1.5. Information is checked to\nensure it is correct and up-\nto- date\n1.1. Knowledge on\nCodes of practice\nand guidelines\nfor the\norganization\n1.2. Knowledge of\norganizations\npolicy and\nprocedures for\nnegotiations\n1.3. Decision making\nand conflict\nresolution\nstrategies\nprocedures\n1.4. Concept of\nnegotiation\n\n1.1. Communication\nskills (verbal and\nlistening)\n1.2. Active listening\n1.3. Setting conflict\n1.4. Preparing conflict\nresolution\n1.5. Problem solving\nstrategies on how\nto deal with\nunexpected\nquestions and\nattitudes during\nnegotiation\n1.6. Interpersonal\nskills to develop\nrapport with other\nparties\n2. Participate in\nnegotiations\n2.1 Criteria for successful\noutcome are agreed upon\nby all parties\n2.2 Desired outcome of all\nparties are considered\n2.3 Appropriate language is\nused throughout the\nnegotiation\n2.4 A variety of questioning\ntechniques are used\n2.5 The issues and processes\nare documented and agreed\nupon by all parties\n2.6 Possible solutions are\ndiscussed and their viability\nassessed\n2.7 Areas for agreement are\nconfirmed and recorded\n2.8 Follow-up action is agreed\nupon by all parties\n2.1 Outcome of\nnegotiation\n2.2 Knowledge on\nLanguage\n2.3 Different\nQuestioning\ntechniques\n2.4 Problem solving\nstrategies on\nhow to deal with\nunexpected\nquestions and\nattitudes during\nnegotiation\n\n2.1 Negotiating skill\n2.2 Communication\nskills (verbal and\nlistening)\n2.3 Observation skills\n2.4 Interpersonal\nskills to develop\nrapport with other\nparties\n2.5 Applying effective\nquestioning\ntechniques\n2.6 Setting conflict\n\n--- PDF PAGE 15 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nElectric Power Distribution Operation and Maintenance NC III Revision 00 Promulgated June 27, 2018 11\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Preparing for\nnegotiation\n1.1\n\n1.2\n1.3\n1.4\n\n1.5\n\n1.6\nBackground information on other parties to the\nnegotiation\nGood understanding of topic to be negotiated\nClear understanding of desired outcome/s\nPersonal attributes\n1.4.1 self-awareness\n1.4.2 self esteem\n1.4.3 objectivity\n1.4.4 empathy\n1.4.5 respect for others\nInterpersonal skills\n1.5.1 listening/reflecting\n1.5.2 nonverbal communication\n1.5.3 assertiveness\n1.5.4 behavior labeling\n1.5.5 testing understanding\n1.5.6 seeking information\n1.5.7 self-disclosing\nAnalytic skills\n1.6.1 observing differences between content and\nprocess\n1.6.2 identifying bargaining information\n1.6.3 applying strategies to manage process\n1.6.4 applying steps in negotiating process\n1.6.5 strategies to manage conflict\n1.6.6 steps in negotiating process\n1.6.7 options within organization and externally\nfor resolving conflict\n\n2. Nonverbal\nenvironments\n2.1\n2.2\n2.3\n2.4\nFriendly reception\nWarm and welcoming room\nRefreshments offered\nLead in conversation before negotiation begins\n\n3. Active listening\n3.1\n3.2\n3.3\n3.4\n3.5\nAttentive\nDon’t interrupt\nGood posture\nMaintain eye contact\nReflective listening\n\n4. Questioning\ntechniques\n4.1\n4.2\n4.3\nDirect\nIndirect\nOpen-ended\n\n--- PDF PAGE 16 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nElectric Power Distribution Operation and Maintenance NC III Revision 00 Promulgated June 27, 2018 12\nEVIDENCE GUIDE\n\n1. Critical aspects\nof Competency\nAssessment requires evidence that the candidate:\n1.1. Demonstrated sufficient knowledge of the factors\ninfluencing negotiation to achieve agreed outcome\n1.2. Participated in negotiation with at least one person to\nachieve an agreed outcome\n\n2. Resource\nImplications\nThe following resources MUST be provided:\n2.1. Room with facilities necessary for the negotiation process\n2.2. Human resources (negotiators)\n3. Methods of\nAssessment\nCompetency may be assessed through:\n3.1. Observation/demonstration and questioning\n3.2. Portfolio assessment\n3.3. Oral and written questioning\n3.4. Third party report\n4. Context for\nAssessment\n4.1. Competency to be assessed in real work environment or\nin a simulated workplace setting.\n\n--- PDF PAGE 17 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nElectric Power Distribution Operation and Maintenance NC III Revision 00 Promulgated June 27, 2018 13\nUNIT OF COMPETENCY :\nSOLVE PROBLEMS RELATED TO WORK ACTIVITIES\nUNIT CODE\n: 500311112\nUNIT DESCRIPTOR\n:\nThis unit of covers the knowledge, skills and attitudes\nrequired to solve problems in the workplace including the\napplication of problem solving techniques and to determine\nand resolve the root cause of problems.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\n\nREQUIRED SKILLS\n1. Identify the\nproblem\n1.1. Variances are identified\nfrom normal operating\nparameters; and product\nquality\n1.2. Extent, cause and nature\nof the problem are\ndefined through\nobservation, investigation\nand analytical\ntechniques\n1.3. Problems are clearly\nstated and specified\n\n1.1. Competence\nincludes a thorough\nknowledge and\nunderstanding of\nthe process, normal\noperating\nparameters, and\nproduct quality to\nrecognize non-\nstandard situations\n1.2. Competence to\ninclude the ability to\napply and explain,\nsufficient for the\nidentification of\nfundamental cause,\ndetermining the\ncorrective action\nand provision of\nrecommendations\n1.3. Relevant equipment\nand operational\nprocesses\n1.4. Enterprise goals,\ntargets and\nmeasures\n1.5. Enterprise quality,\nOHS and\nenvironmental\nrequirement\n1.6. Enterprise\ninformation systems\nand data collation\n1.7. Industry codes and\nstandards\n1.8. Normal operating\nparameters and\nproduct quality\n1.9. Identifying and\nclarifying the nature\nof problem\n1.1. Using range of\nformal problem\nsolving\ntechniques\n1.2. Identifying and\nclarifying the\nnature of the\nproblem\n1.3. Evaluating the\neffectiveness of\na present\nprocess in the\nworkplace\n1.4. Applying\nanalytical\ntechniques\n\n2. Determine\nfundamental\n2.1 Possible causes are\nidentified based on\nexperience and the use\n2.1 Relevant equipment\nand operational\nprocesses\n2.1 Analysis of root\ncauses\n\n--- PDF PAGE 18 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nElectric Power Distribution Operation and Maintenance NC III Revision 00 Promulgated June 27, 2018 14\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\n\nREQUIRED SKILLS\ncauses of the\nproblem\nof problem solving tools/\nanalytical techniques.\n2.2 Possible cause\nstatements are\ndeveloped based on\nfindings\n2.3 Fundamental causes are\nidentified per results of\ninvestigation conducted\n\n2.2 Enterprise goals,\ntargets and\nmeasures\n2.3 Enterprise quality,\nOHS and\nenvironmental\nrequirements\n2.4 Enterprise\ninformation systems\nand data collation\n2.5 Industry codes and\nstandards\n3. Determine\ncorrective action\n3.1. All possible options are\nconsidered for resolution\nof the problem\n3.2. Strengths and\nweaknesses of possible\noptions are considered\n3.3. Corrective actions are\ndetermined to resolve the\nproblem and possible\nfuture causes\n3.4. Action plans are\ndeveloped identifying\nmeasurable objectives,\nresource needs and\ntimelines in accordance\nwith safety and operating\nprocedures\n\n3.1. Understanding the\nprocedure in\nundertaking\ncorrective action\n3.2. Principles of\ndecision making\nstrategies and\ntechniques\n3.3. Enterprise\ninformation systems\nand data collation\n3.4. Action planning\n3.1. Identifying and\nclarifying the\nnature of the\n