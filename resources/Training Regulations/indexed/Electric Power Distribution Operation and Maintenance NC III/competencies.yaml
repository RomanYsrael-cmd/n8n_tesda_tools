        "evidence_guide": {
          "source_text": "1. Critical aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1. \nIdentified the problem \n1.2. \nDetermined the fundamental causes of the problem \n1.3. \nDetermined the correct / preventive action \n1.4. \nProvided recommendation to manager \nThese aspects may be best assessed using a range of \nscenarios / case studies / what ifs as a stimulus with a walk \nthrough forming part of the response. These assessment \nactivities should include a range of problems, including new, \nunusual and improbable situations that may have happened. \n2. Resource \nImplications \n2.1. \nAssessment will require access to an operating plant \nover an extended period of time, or a suitable method \nof gathering evidence of operating ability over a range \nof situations. A bank of scenarios / case studies / what \nifs will be required as well as bank of questions which \nwill be used to probe the reason behind the observable \naction.  \n3.  Methods of \nAssessment \nCompetency may be assessed through: \n3.1. \nCase studies on solving problems in the workplace \n3.2. \n Observation \nThe unit will be assessed in a holistic manner as is practical \nand may be integrated with the assessment of other relevant \nunits of competency. Assessment will occur over a range of \nsituations, which will include disruptions to normal, smooth \noperation. Simulation may be required to allow for timely \nassessment of parts of this unit of competency. Simulation \nshould be based on the actual workplace and will include walk \nthrough of the relevant competency components.  \n4. Context for \nAssessment \n4.1. \nIn all workplace, it may be appropriate to assess this \nunit concurrently with relevant teamwork or operation \nunits.",
