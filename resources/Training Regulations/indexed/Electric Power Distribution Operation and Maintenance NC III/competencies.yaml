          "source_text": "1. Critical aspects of\ncompetency\n\nAssessment requires evidence that the candidate:\n1.1. Planned, assessed and prepared for clearing work\n1.2. Undertook clearing of vegetation\n1.3. Completed pruning activity\n\n2. Resource implications\nThe following resources should be available:\n2.1. Trimming/Pruning tools and equipment\n2.2. PPE\n2.3. Work area\n\n3. Method of assessment\nCompetency may be assessed through:\n3.1. Direct observation / Demonstration with oral\nquestioning\n3.2. Written test\n\n4. Context of assessment\n4.1. Competency maybe assessed in the workplace or in\na simulated workplace setting\n4.2. Assessment shall be undertaken either individually or\npart of team under limited supervision\n\n--- PDF PAGE 71 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nElectric Power Distribution Operation and Maintenance NC III Revision 00 Promulgated June 27, 2018 67"
