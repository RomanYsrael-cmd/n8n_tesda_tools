ie\n\n--- PDF PAGE 57 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- \nElectric Power Distribution Operation and Maintenance NC III  Revision 00   Promulgated June 27, 2018   53  \n \nEVIDENCE GUIDE \n \n1. Critical aspects \nof competency \nAssessment requires evidence that the candidate: \n1.1 Planned and prepared for maintenance work  \n1.2 Replaced electric distribution pole and pole top assembly \n1.3 Replaced conductors/ wires \n \n2. Resource \nimplications \nThe following resources should be available: \n2.1 Needed tools, equipment, poles, cross-arms, hardware and \nPPEs  \n2.2 Site or work area \n2.3 Boom or derrick truck (if necessary) \n3. Method of \nassessment \nCompetency may be assessed through: \n3.1 Direct observation/Demonstration with oral questioning \n3.2 Written test \n \n4. Context of \nassessment \n4.1 Competency maybe assessed in the workplace or in a \nsimulated workplace setting \n4.2 Assessment shall be undertaken either individually or part of \nteam under limited supervision\n",
