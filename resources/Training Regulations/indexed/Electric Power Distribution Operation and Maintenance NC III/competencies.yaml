        "source_text": "UTL741319\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitude required to\nconduct vegetation clearing in particular trees for defects and\nhazards prior to cutting and pruning around live distribution\nlines up to the live work zone. This involves working with a\nteam.\n\nELEMENT\nPERFORMANCE CRITERIA\n(Italicized Bold terms are elaborated\nin the range of variables)\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Plan, assess\nand prepare\nfor clearing\nwork\n\n1.1 Work instructions are secured\nand interpreted according to\njob requirements\n1.2 Relevant occupational safety\nrequirements are identified\nfollowing job specifications\n1.3 Relevant trimming/ pruning\ntools and equipment are\nidentified, requested and\nacquired in accordance with\njob requirements\n1.4 Personal protective equipment\n(PPE) are obtained following\njob requirements\n1.5 Hazards near live distribution\nline and equipment are\nidentified and reported\naccording to electric utility\nprocedures.\n1.6 Relevant permit/s to cut/trim\ntrees or other plants are\nsecured and confirmed with\nrelevant personnel.\n1.7 Road signage, barriers and\nwarning devices are identified,\nwhere appropriate, in\naccordance with given\ninstructions and requirements.\n1.8 Assistance for traffic and road\nsafety is coordinated with\nrelated authority for\ndirections according to electric\nutility procedures.\n1.1 Relevant\noccupational\nsafety\nrequirements\n1.2 Types of\ntrimming/ pruning\ntools and\nequipment\n1.3 Personal\nProtective\nEquipment (PPE)\n1.4 Possible hazards\nencountered\nduring clearing\noperation\n1.5 Road signage,\nbarriers, warning\ndevices\n1.6 Traffic and road\nsafety\nregulations and\nstandards\n1.7 Power\ndistribution\nindustry\nstandards and\nspecifications\n1.1 Interpretation\nskills\n1.2 Communication\nskills\n1.3 Identifying\ntypes of\ntrimming/\npruning tools\nand equipment\n1.4 Identifying\noccupational\nsafety\nstandards for\nline workers\n1.5 Skills in\ninterpreting\ntraffic and road\nsafety\nregulations and\nstandards\n\n2. Undertake\nclearing of\nvegetation\n2.1. Relevant occupational safety\nrequirements are followed in\naccordance with given\ninstructions, requirements\nand/or electric utility\nprocedures.\n2.2. Trimming/Pruning site is\nsuitably signed and barricaded\nduring operations in\n2.1. Relevant\noccupational\nsafety\nrequirements\n2.2. Types of\ntrimming/ pruning\ntools and\nequipment\n2.3. PPE\n2.1. Interpretation\nskills\n2.2. Communication\nskills\n2.3. Identifying\noccupational\nsafety\nstandards for\nline workers\n\n--- PDF PAGE 68 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nElectric Power Distribution Operation and Maintenance NC III Revision 00 Promulgated June 27, 2018 64\n\naccordance with electric utility\nprocedures.\n2.3. Trimming/Pruning activities are\nundertaken according to\nelectric utility procedures and\nsafety requirements.\n2.4. Trimming/Pruning tools and\nequipment are operated safely\nand effectively.\n2.5. Ongoing checks of quality of\nthe work and safety\nclearances are undertaken in\naccordance with given\ninstructions and electric utility\nprocedures.\n2.4. Possible hazards\nencountered\nduring clearing\noperation\n2.5. Road signage,\nbarriers, warning\ndevices\n2.6. Traffic and road\nsafety\nregulations and\nstandards\n2.7. Trimming/\nPruning tools\nand equipment\noperation\n2.8. Proper handling\nof tools and\nequipment\n2.9. Safety\nclearances\nstandards\n2.10. Power\ndistribution\nindustry\nstandards and\nspecifications\n2.4. Trimming/\nPruning skills\n2.5. Skills in\ninterpreting\ntraffic and road\nsafety\nregulations and\nstandards\n2.6. Skills in\nhandling tools\nand equipment\n3. Complete\npruning\nactivity\n3.1. Prunings and waste material\nremoved from the site are\ndisposed of in an\nenvironmentally aware and\nsafe manner according to\nelectric utility procedures.\n3.2. Correct manual handling\ntechniques are used when\nlifting or moving loads.\n3.3. Trimming/Pruning tools and\nequipment are cleaned,\nmaintained and stored\naccording to electric utility\nprocedures.\n3.4. Clean and safe area is\nmaintained throughout and on\ncompletion of work.\n3.5. Accomplishment report is\nsubmitted in accordance with\nthe guidelines.\n3.1. Relevant\noccupational\nsafety\nrequirements\n3.2. Waste disposal\nmanagement\nregulations\n3.3. Types of\ntrimming/ pruning\ntools and\nequipment\n3.4. Proper lifting or\nmoving loads\nprocedures\n3.5. Road signage,\nbarriers, warning\ndevices\n3.6. Traffic and road\nsafety\nregulations and\nstandards\n3.7. Proper handling\nof tools and\nequipment\n3.8. Principles of\ngood\nhousekeeping\n3.1. Interpretation\nskills\n3.2. Communication\nskills\n3.3. Identifying\noccupational\nsafety\nstandards for\nline workers\n3.4. Trimming/\nPruning skills\n3.5. Skills in\ninterpreting\ntraffic and road\nsafety\nregulations and\nstandards\n3.6. Skills in\nhandling tools\nand equipment\n3.7. Rigging skills\n3.8. Skills in\nhousekeeping\n\n--- PDF PAGE 69 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nElectric Power Distribution Operation and Maintenance NC III Revision 00 Promulgated June 27, 2018 65\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Occupational safety\nrequirements\nMay include but not limited to:\n1.1 Personal protective equipment (PPE)\n1.1.1. Hard hat/Safety hat\n1.1.2. Goggles/Eye protector\n1.1.3. Work gloves\n1.1.4. Line worker boots\n1.1.5. Working clothes\n1.1.6. Rubber boots\n1.1.7. Rain suits\n1.1.8. Rubber gloves\n1.2\nPole climbing equipment\n1.2.1. Safety strap/cord\n1.2.2. Body belt\n1.2.3. pair of climbers\n1.3\nHotline tools\n1.3.1. shotgun stick\n1.3.2. hot stick or telescopic stick\n1.4\nGrounding cluster\n2. Trimming/ Pruning\ntools and equipment\nMay include but not limited to:\n2.1 Tools\n2.1.1. chainsaw\n2.1.2. pruning saw\n2.1.3. bolo\n2.1.4. scythe\n2.1.5. rope/handline\n2.1.6. Pole climbing equipment\n2.2\nEquipment and devices\n2.2.1. Ladder\n2.2.2. boom truck\n2.2.3. basket truck\n3. Permit/s\nMay include permit/s secured from:\n3.1\nDENR\n3.2\nprivate property owners\n3.3\nLGUs\n3.4\nFor road safety permits (LGUs/Barangay, MMDA,\nPNP, etc.)\n4. related authority\nMay include:\n4.1\nLGU\n4.2\nBarangay\n4.3\nMMDA\n4.4\nPNP\n4.5\netc.)\n\n--- PDF PAGE 70 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nElectric Power Distribution Operation and Maintenance NC III Revision 00 Promulgated June 27, 2018 66\n\nEVIDENCE GUIDE\n1. Critical aspects of\ncompetency\n\nAssessment requires evidence that the candidate:\n1.1. Planned, assessed and prepared for clearing work\n1.2. Undertook clearing of vegetation\n1.3. Completed pruning activity\n\n2. Resource implications\nThe following resources should be available:\n2.1. Trimming/Pruning tools and equipment\n2.2. PPE\n2.3. Work area\n\n3. Method of assessment\nCompetency may be assessed through:\n3.1. Direct observation / Demonstration with oral\nquestioning\n3.2. Written test\n\n4. Context of assessment\n4.1. Competency maybe assessed in the workplace or in\na simulated workplace setting\n4.2. Assessment shall be undertaken either individually or\npart of team under limited supervision\n\n--- PDF PAGE 71 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nElectric Power Distribution Operation and Maintenance NC III Revision 00 Promulgated June 27, 2018 67"
