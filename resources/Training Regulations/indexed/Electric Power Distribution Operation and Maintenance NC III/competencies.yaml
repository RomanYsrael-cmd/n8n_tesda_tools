          "source_text": "REQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n1. Develop an \nindividual’s \ncultural \nawareness \nand sensitivity  \n1.1. Individual differences with \nclients, customers and \nfellow workers are \nrecognized and respected \nin accordance with \nenterprise policies and \ncore values. \n1.2. Differences are responded \nto in a sensitive and \nconsiderate manner  \n1.3. Diversity is \naccommodated using \nappropriate verbal and \nnonverbal communication.   \n1.4. Actions/decisions are \nmaintained consistent with \nlegislative requirements \nand enterprise guidelines. \n1.1. Understanding \ncultural diversity in \nthe workplace  \n1.2. Awareness of \nindividual cultures \nand world geography  \n1.3. Norms of behavior for \ninteracting and \ndialogue with specific \ngroups (e.g., Muslims \nand other non-\nChristians, non-\nCatholics, \ntribes/ethnic groups, \nforeigners)  \n1.4. Different methods of \nverbal and non-verbal \ncommunication in a \nmulticultural setting  \n1.5. Enterprise policies on \nworkplace diversity \n(Workplace Diversity \nPolicy) \n1.1. Cross-cultural \ncommunication skills \n(i.e. different business \ncustoms, beliefs, \ncommunication \nstrategies)  \n1.2. Communication skills \n– reading, writing, \nconversational skills  \n1.3. Affective skills – \nestablishing rapport \nand empathy, \nunderstanding, etc.  \n1.4. Active Listening \n1.5. Openness and \nflexibility in \ncommunication  \n1.6. Giving/receiving \nfeedback \n1.7. Identifying/ \nRecognizing diverse \ngroups in the \nworkplace and \ncommunity as defined \nby divergent culture, \nreligion, traditions and \npractices \n2. Work \neffectively in \nan \nenvironment \nthat \nacknowledges \nand values \ncultural \ndiversity \n2.1. Knowledge, skills and \nexperiences of others are \nrecognized and \ndocumented in relation to \nteam objectives.   \n2.2. Fellow workers are \nencouraged to utilize and \nshare their specific \nqualities, skills or \nbackgrounds with other \n