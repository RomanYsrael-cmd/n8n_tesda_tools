        "source_text": "--- PDF PAGE 54 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- \nElectric Power Distribution Operation and Maintenance NC III  Revision 00   Promulgated June 27, 2018   50  \n \nCORE COMPETENCIES \n \nUNIT OF COMPETENCY :    REPLACE ELECTRIC DISTRIBUTION POLE, POLE TOP \nASSEMBLY AND CONDUCTORS \nUNIT CODE  \n          :    UTL741316 \nDESCRIPTOR                 : \nThis unit covers the knowledge, skills and attitudes required \nto replace electric distribution pole, pole top assembly and \nconductors. It includes competencies in planning and \npreparing for maintenance work, replacing electric distribution \npole, pole top assembly and conductors or wires. This \ninvolves working with a team. \nELEMENT \nPERFORMANCE CRITERIA \n(Italicized Bold terms are elaborated \nin the range of variables) \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Plan and \nprepare for \nmaintenance \nwork  \n \n1.1 Work instruction is secured \nand interpreted according to \njob requirements \n1.2 Relevant occupational \nsafety requirements are \nidentified following job \nspecifications \n1.3 Relevant distribution line \ntools, equipment and \nhardware are identified, \nrequested and acquired in \naccordance with construction \nspecifications \n1.4 Personal protective equipment \n(PPE) are obtained following \njob requirements \n1.1 Uses and \nspecifications of \ndistribution line \ntools, equipment \nand hardware \n1.2 Relevant \noccupational safety \nrequirements \n1.3 Safety procedures \nfor installing pole \nhardware and \nconductors \n1.4 Power distribution \nindustry standards \nand specifications \n1.1 Interpretation \nskills \n1.2 Identifying \ndistribution \nhand/line tools, \nequipment and \nhardware  \n1.3 Identifying \noccupational \nsafety \nstandards for \nline workers \n \n2. Replace \nelectric \ndistribution \