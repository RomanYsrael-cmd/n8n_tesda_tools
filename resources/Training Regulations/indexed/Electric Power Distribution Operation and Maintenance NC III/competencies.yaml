        "evidence_guide": {
          "source_text": "1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Studied and selected appropriate technology\nconsistent with work requirements\n1.2 Applied relevant technology\n1.3 Maintained and enhanced operative ability of relevant\ntechnology\n\n2. Resource\nImplications\nThe following resources MUST be provided:\n2.1 Relevant technology\n2.2 Interview and demonstration questionnaires\n2.3 Assessment packages\n\n3. Methods of\nAssessment\nCompetency must be assessed through:\n3.1 Interview\n3.2 Actual demonstration\n3.3 Authenticated portfolio (related certificates of\ntraining/seminar)\n\n4. Context for\nAssessment\n4.1 Competency may be assessed in actual workplace or\nsimulated environment\n\n--- PDF PAGE 26 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nElectric Power Distribution Operation and Maintenance NC III Revision 00 Promulgated June 27, 2018 22\n\nUNIT OF COMPETENCY: APPLY CRITICAL THINKING AND PROBLEM SOLVING\nTECHNIQUES IN THE WORKPLACE\n\nUNIT CODE :"
        },
        "source_text": "500311114\n\nUNIT DESCRIPTOR : This unit of competency covers the knowledge, skills, and\nattitude required in selecting, sourcing and applying appropriate\nand affordable technologies in the workplace.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\nREQUIRED KNOWLEDGE\nREQUIRED\nSKILLS\n1. Study/\nSelect\nappropriate\ntechnology\n1.1 Usage of different\ntechnologies is determined\nbased on job requirements\n1.2 Appropriate technology is\nselected as per work\nSpecification\n1.1 Awareness on\ntechnology and its\nfunction\n1.2 Communication\ntechniques\n1.3 Health and safety\nprocedure\n1.4 Company policy in\nrelation to relevant\ntechnology\n1.5 Machineries/ equipment\nand their application\n1.6 Software programs\n1.1 Identifying\nrelevant\ntechnology on\njob\n2. Apply\nrelevant\ntechnology\n\n2.1 Relevant technology is\neffectively used in carrying\nout function\n2.2 Applicable software and\nhardware are used as per\ntask requirement\n2.3 Management concepts are\nobserved and practiced as\nper established industry\npractices\n2.1 Knowledge on\noperating instructions\n2.2 Understanding software\nand hardware system\n2.3 Communication\ntechniques\n2.4 Health and safety\nprocedure\n2.5 Company policy in\nrelation to relevant\ntechnology\n2.6 Different management\nconcepts\n2.7 Technology adaptability\n2.1 Applying\nrelevant\ntechnology\n2.2 Communicating\nskills\n2.3 Using software\napplications\nskills\n2.4 Conducting risk\nassessment\n3. Maintain/\nenhance\nrelevant\ntechnology\n3.1 Maintenance of technology is\napplied in accordance with\nthe industry standard\noperating procedure,\nmanufacturer’s operating\nguidelines and occupational\nhealth and safety procedure\nto ensure its operative ability\n3.2 Updating of technology is\nmaintained through continuing\neducation or training in\naccordance with job\nrequirement\n3.3 Technology failure/ defect is\nimmediately reported to the\nconcern/responsible person\nor section for appropriate\naction\n3.1 Awareness on\ntechnology and its\nfunction\n3.2 Repair and\nmaintenance procedure\n3.3 Health and safety\nprocedure\n3.4 Company policy in\nrelation to relevant\ntechnology\n3.5 Upgrading of\ntechnology\n3.6 Organizational set-\nup/work flow\n3.1 Performing\nbasic\ntroubleshooting\nskills\n3.2 Identifying\nfailures or\ndefects\n3.3 Communication\nskills\n3.4 Applying\ncorrective and\npreventive\nmaintenance\n\n--- PDF PAGE 24 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nElectric Power Distribution Operation and Maintenance NC III Revision 00 Promulgated June 27, 2018 20\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Technology\nMay include but are not limited to:\n1.1 Office technology\n1.2 Industrial technology\n1.3 System technology\n1.4 Information technology\n1.5 Training technology\n\n2. Management concepts\nMay include but not limited to:\n2.1 Real Time Management\n2.2 KAIZEN or continuous improvement\n2.3 5s\n2.4 Total Quality Management\n2.5 Other management/productivity tools\n\n3. Industry standard operating\nprocedure\n3.1 Written guidelines relative to the usage of\noffice technology/equipment\n3.2 Verbal advise/instruction from the co-worker\n4. Manufacturer’s operating\nguidelines/ instructions\n4.1 Written instruction/manuals of specific\ntechnology/ equipment\n4.2 General instruction manual\n4.3 Verbal advise from manufacturer relative to\nthe operation of equipment\n\n5. Occupational health and\nsafety procedure\n5.1 Relevant statutes on OHS\n5.2 Company guidelines in using\n technology/equipment\n\n6. Appropriate action\n6.1 Implementing preventive maintenance\nschedule\n6.2 Coordinating with manufacturer’s technician\n\n--- PDF PAGE 25 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nElectric Power Distribution Operation and Maintenance NC III Revision 00 Promulgated June 27, 2018 21\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Studied and selected appropriate technology\nconsistent with work requirements\n1.2 Applied relevant technology\n1.3 Maintained and enhanced operative ability of relevant\ntechnology\n\n2. Resource\nImplications\nThe following resources MUST be provided:\n2.1 Relevant technology\n2.2 Interview and demonstration questionnaires\n2.3 Assessment packages\n\n3. Methods of\nAssessment\nCompetency must be assessed through:\n3.1 Interview\n3.2 Actual demonstration\n3.3 Authenticated portfolio (related certificates of\ntraining/seminar)\n\n4. Context for\nAssessment\n4.1 Competency may be assessed in actual workplace or\nsimulated environment\n\n--- PDF PAGE 26 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nElectric Power Distribution Operation and Maintenance NC III Revision 00 Promulgated June 27, 2018 22\n\nUNIT OF COMPETENCY: APPLY CRITICAL THINKING AND PROBLEM SOLVING\nTECHNIQUES IN THE WORKPLACE\n\nUNIT CODE :"
