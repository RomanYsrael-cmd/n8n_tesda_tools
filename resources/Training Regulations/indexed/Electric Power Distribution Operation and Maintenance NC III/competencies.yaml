        "evidence_guide": {
          "source_text": "1. Critical aspects\nof competency\nAssessment requires evidence that the candidate:\n1.1 Planned and prepared for maintenance work\n1.2 Replaced electric distribution pole and pole top assembly\n1.3 Replaced conductors/ wires\n\n2. Resource\nimplications\nThe following resources should be available:\n2.1 Needed tools, equipment, poles, cross-arms, hardware and\nPPEs\n2.2 Site or work area\n2.3 Boom or derrick truck (if necessary)\n3. Method of\nassessment\nCompetency may be assessed through:\n3.1 Direct observation/Demonstration with oral questioning\n3.2 Written test\n\n4. Context of\nassessment\n4.1 Competency maybe assessed in the workplace or in a\nsimulated workplace setting\n4.2 Assessment shall be undertaken either individually or part of\nteam under limited supervision\n\n--- PDF PAGE 58 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nElectric Power Distribution Operation and Maintenance NC III Revision 00 Promulgated June 27, 2018 54\n\nUNIT OF COMPETENCY :\nINSTALL/REPLACE SINGLE-, THREE- OR VEE-PHASE\nDISTRIBUTION LINE EQUIPMENT AND ACCESSORIES\nUNIT CODE\n:"
        },
        "source_text": "UTL741316\nDESCRIPTOR :\nThis unit covers the knowledge, skills and attitudes required\nto replace electric distribution pole, pole top assembly and\nconductors. It includes competencies in planning and\npreparing for maintenance work, replacing electric distribution\npole, pole top assembly and conductors or wires. This\ninvolves working with a team.\nELEMENT\nPERFORMANCE CRITERIA\n(Italicized Bold terms are elaborated\nin the range of variables)\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Plan and\nprepare for\nmaintenance\nwork\n\n1.1 Work instruction is secured\nand interpreted according to\njob requirements\n1.2 Relevant occupational\nsafety requirements are\nidentified following job\nspecifications\n1.3 Relevant distribution line\ntools, equipment and\nhardware are identified,\nrequested and acquired in\naccordance with construction\nspecifications\n1.4 Personal protective equipment\n(PPE) are obtained following\njob requirements\n1.1 Uses and\nspecifications of\ndistribution line\ntools, equipment\nand hardware\n1.2 Relevant\noccupational safety\nrequirements\n1.3 Safety procedures\nfor installing pole\nhardware and\nconductors\n1.4 Power distribution\nindustry standards\nand specifications\n1.1 Interpretation\nskills\n1.2 Identifying\ndistribution\nhand/line tools,\nequipment and\nhardware\n1.3 Identifying\noccupational\nsafety\nstandards for\nline workers\n\n2. Replace\nelectric\ndistribution\npole and pole\ntop assembly\n2.1. Occupational work safety\nprocedures are observed\nbased on job requirements\n2.2. Pole top assembly are\nremoved for replacement\n2.3. Electric distribution pole is\nremoved using appropriate\nequipment\n2.4. Pole digging is performed\nfollowing established depth\nrequirements\n2.5. Pole setting/erection\nprocedure is performed in line\nwith job requirements\n2.6. Proper backfill and tamping is\nperformed according to\nstandard procedure\n2.7. Pole top assemblies are\nreinstalled/ replaced based on\njob requirements\n2.1. Occupational work\nsafety procedures\n2.2. Different pole top\nassemblies\n2.3. Safety standard\nprocedures for\ninstalling pole\nhardware and\nconductors\n2.4. Pole climbing\ntechniques\n2.5. Pole setting/\nerection\nprocedures\n2.6. Proper use of pole\ndigging tools\n\n2.1. Communicatio\nn skills\n2.2. Pole climbing\nskills\n2.3. Knot tying\nskills\n2.4. Skills on pole\nsetting and\nalignment\n\n--- PDF PAGE 55 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nElectric Power Distribution Operation and Maintenance NC III Revision 00 Promulgated June 27, 2018 51\n\nELEMENT\nPERFORMANCE CRITERIA\n(Italicized Bold terms are elaborated\nin the range of variables)\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n3. Replace\nconductors/\nwires\n3.1. Old conductors/wires are\nreplaced of appropriate sizes\nbased on job requirements and\nspecifications\n3.2. Stringing/payout and\ntensioning performed based on\nelectric utility procedures\n3.3. Armoring is applied for\nprotection of conductor.\n3.4. Tying of conductors is\napplied to avoid detachment\nfrom the insulators.\n3.1. Types and sizes of\nconductors/ wires\n3.2. Proper use of\ncompression\nconnectors and\nsplicing materials\nand tools\n3.3. Splicing techniques\n3.4. Armoring and tying\nof conductors\n3.1. Identifying\nconductors/\nwires\n3.2. Proper care\nand handling\nof conductors\n3.3. Splicing skills\n3.4. Armoring and\ntying skills\n\n--- PDF PAGE 56 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nElectric Power Distribution Operation and Maintenance NC III Revision 00 Promulgated June 27, 2018 52\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Occupational safety\nrequirements\nMay include:\n1.1 Personal protective equipment (PPE)\n1.1.1. Hard hat/Safety hat\n1.1.2. Goggles/Eye protector\n1.1.3. Work gloves\n1.1.4. Line worker boots/Rubber boots\n1.1.5. Working clothes\n1.1.6. Rain suits\n1.2\nPole climbing equipment\n1.2.1. Safety strap/cord\n1.2.2. Body belt\n1.2.3. pair of climbers\n1.3\nCompany health and safety policies and procedures\n2. Distribution line\ntools, equipment\nand hardware\nMay include but not limited to:\n2.1 Tools\n2.1.1. Rope/Hand line\n2.1.2. Adjustable wrench or Line worker wrench\n2.1.3. Pliers\n2.1.4. Ball peen hammer\n2.1.5. Measuring rule / steel tape\n2.1.6. Screw driver\n2.1.7. Auger bit\n2.1.8. Ratchet\n2.1.9. Cum-a-long\n2.1.10. Bolt cutter\n2.1.11. wire skinning knife\n2.1.12. Compression tool\n2.1.13. Pulley\n2.2\nEquipment\n2.1.1 Boom truck or derrick truck\n2.1.2 Pole climbing equipment\n2.1.3 Wench\n2.1.4 Ladder\n2.3\nConstruction materials for pole top, conductor, (anchor, guy,\ngrounding assemblies, if needed)\n2.4\nConductors or wires (bare or insulated)\n2.4.1. Aluminum Conductor Steel Reinforced (ACSR)\n2.4.2. Copper wire\n3. pole top/ conductor\nassemblies\n3.1\nPrimary\n3.1.1. Single-phase\n3.1.2. Vee-phase\n3.1.3. Three-phase\n3.2\nSecondary\n3.2.1. Open\n3.2.2. Underbuilt\n4. Tying of conductors\n4.1\nTop groove tie\n4.2\nSide groove tie\n\n--- PDF PAGE 57 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nElectric Power Distribution Operation and Maintenance NC III Revision 00 Promulgated June 27, 2018 53\n\nEVIDENCE GUIDE\n\n1. Critical aspects\nof competency\nAssessment requires evidence that the candidate:\n1.1 Planned and prepared for maintenance work\n1.2 Replaced electric distribution pole and pole top assembly\n1.3 Replaced conductors/ wires\n\n2. Resource\nimplications\nThe following resources should be available:\n2.1 Needed tools, equipment, poles, cross-arms, hardware and\nPPEs\n2.2 Site or work area\n2.3 Boom or derrick truck (if necessary)\n3. Method of\nassessment\nCompetency may be assessed through:\n3.1 Direct observation/Demonstration with oral questioning\n3.2 Written test\n\n4. Context of\nassessment\n4.1 Competency maybe assessed in the workplace or in a\nsimulated workplace setting\n4.2 Assessment shall be undertaken either individually or part of\nteam under limited supervision\n\n--- PDF PAGE 58 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nElectric Power Distribution Operation and Maintenance NC III Revision 00 Promulgated June 27, 2018 54\n\nUNIT OF COMPETENCY :\nINSTALL/REPLACE SINGLE-, THREE- OR VEE-PHASE\nDISTRIBUTION LINE EQUIPMENT AND ACCESSORIES\nUNIT CODE\n:"
      }
