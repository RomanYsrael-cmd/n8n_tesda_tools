        "source_text": "--- PDF PAGE 26 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- \nElectric Power Distribution Operation and Maintenance NC III  Revision 00   Promulgated June 27, 2018   22  \n \nUNIT OF COMPETENCY:  APPLY CRITICAL THINKING AND PROBLEM SOLVING \nTECHNIQUES IN THE WORKPLACE \n \nUNIT CODE                     :   500311142 \n \nUNIT DESCRIPTOR        :  This unit of covers the knowledge, skills and attitudes required \nto solve problems in the workplace including the application of \nproblem solving techniques and to determine and resolve the \nroot cause of problems.                          \n \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated \nin the Range of Variables \nREQUIRED KNOWLEDGE \nREQUIRED SKILLS \n1. Examine \nspecific \nworkplace \nchallenges  \n1.1. Variances are identified \nfrom normal operating \nparameters; and product \nquality \n1.2. Extent, cause and nature \nare of the problem are \ndefined through \nobservation, investigation \nand analytical \ntechniques \n1.3. Problems are clearly \nstated and specified \n1.1. Competence includes a \nthorough knowledge and \nunderstanding of the \nprocess, normal operating \nparameters, and product \nquality to recognize \nnonstandard situations \n1.2. Competence to include the \nability to apply and explain, \nsufficient for the \nidentification of fundamental \ncause, determining the \ncorrective action and \nprovision of \nrecommendations  \n1.2.1. Relevant equipment \nand operational \nprocesses \n1.2.2. Enterprise goals, \ntargets and measures  \n1.2.3. Enterprise quality, \nOHS and \nenvironmental \nrequirement \n1.2.4. Enterprise information \nsystems and data \ncollation  \n1.2.5. Industry codes and \nstandards \n1.1. Using range of \nanalytical \ntechniques (e.g., \nplanning, \nattention, \nsimultaneous and \nsuccessive \nprocessing of \ninformation) in \nexamining specific \nchallenges in the \nworkplace \n1.2. Identifying extent \nand causes of \nspecific \nchallenges in the \nworkplace \n2. Analyze the \ncauses of \nspecific \nworkplace \nchallenges \n2.1. Possible causes of \nspecific problems are \nidentified based on \nexperience and the use \nof problem solving tools / \nanalytical techniques. \n2.2. Possible cause \nstatements are \ndeveloped based on \nfindings \n2.3. Fundamental causes are \nidentified per results of \ninvestigation conducted \n2.1. Competence includes a \nthorough knowledge and \nunderstanding of the \nprocess, normal operating \nparameters, and product \nquality to recognize \nnonstandard situations  \n2.2. Competence to include the \nability to apply and explain, \nsufficient for the \nidentification of fundamental \ncause, determining the \ncorrective action and \n2.1. Using range of \nanalytical \ntechniques (e.g., \nplanning, \nattention, \nsimultaneous and \nsuccessive \nprocessing of \ninformation) in \nexamining \nspecific \nchallenges in the \nworkplace.\n\n--- PDF PAGE 27 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- \nElectric Power Distribution Operation and Maintenance NC III  Revision 00   Promulgated June 27, 2018   23  \n \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated \nin the Range of Variables \nREQUIRED KNOWLEDGE \nREQUIRED SKILLS \nprovision of \nrecommendations \n2.2.1.  Relevant equipment \nand operational \nprocesses  \n2.2.2. Enterprise goals, \ntargets and measures \n2.2.3. Enterprise quality, \nOHS and \nenvironmental \nrequirement  \n2.2.4. Enterprise information \nsystems and data \ncollation \n2.2.5. Industry codes and \nstandards \n2.2. Identifying extent \nand causes of \nspecific \nchallenges in the \nworkplace \n2.3. Providing clear-\ncut findings on \nthe nature of \neach identified \nworkplace \nchallenges \n3. Formulate \nresolutions to \nspecific \nworkplace \nchallenges \n3.1. All possible options are \nconsidered for \nresolution of the \nproblem \n3.2. Strengths and \nweaknesses of possible \noptions are considered  \n3.3. Corrective actions are \ndetermined to resolve \nthe problem and \npossible future causes \n3.4. Action plans are \ndeveloped identifying \nmeasurable objectives, \nresource needs and \ntimelines in accordance \nwith safety and \noperating procedures \n3.1. Competence includes a \nthorough knowledge and \nunderstanding of the \nprocess, normal operating \nparameters, and product \nquality to recognize \nnonstandard situations \n3.2. Competence to include the \nability to apply and explain, \nsufficient for the \nidentification of fundamental \ncause, determining the \ncorrective action and \nprovision of \nrecommendations  \n3.2.1. Relevant equipment \nand operational \nprocesses  \n3.2.2. Enterprise goals, \ntargets and measures  \n3.2.3. Enterprise quality, \nOHS and \nenvironmental \nrequirement  \n3.2.4. Principles of decision \nmaking strategies and \ntechniques  \n3.2.5. Enterprise information \nsystems and data \ncollation \n3.2.6. Industry codes and \nstandards \n3.1. Using range of \nanalytical \ntechniques (e.g., \nplanning, \nattention, \nsimultaneous and \nsuccessive \nprocessing of \ninformation) in \nexamining specific \nchallenges in the \nworkplace  \n3.2. Identifying extent \nand causes of \nspecific \nchallenges in the \nworkplace  \n3.3. Providing clear-\ncut findings on the \nnature of each \nidentified \nworkplace \nchallenges  \n3.4. Devising, \ncommunicating, \nimplementing and \nevaluating \nstrategies and \ntechniques in \naddressing \nspecific workplace \nchallenges\n\n--- PDF PAGE 28 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- \nElectric Power Distribution Operation and Maintenance NC III  Revision 00   Promulgated June 27, 2018   24  \n \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated \nin the Range of Variables \nREQUIRED KNOWLEDGE \nREQUIRED SKILLS \n4. Implement \naction plans \nand \ncommunicate \nresults \n4.1. Action plans are \nimplemented and \nevaluated \n4.2. Results of plan \nimplementation and \nrecommendations are \nprepared. \n4.3. Recommendations are \npresented to appropriate \npersonnel.  \n4.4. Recommendations are \nfollowed-up, if required \n4.1. Competence includes a \nthorough knowledge and \nunderstanding of the \nprocess, normal operating \nparameters, and product \nquality to recognize \nnonstandard situations \n4.2. Competence to include the \nability to apply and explain, \nsufficient for the \nidentification of \nfundamental cause, \ndetermining the corrective \naction and provision of \nrecommendations  \n4.2.1. Relevant equipment \nand operational \nprocesses  \n4.2.2. Enterprise goals, \ntargets and measures  \n4.2.3. Enterprise quality, \nOHS and \nenvironmental \nrequirement  \n4.2.4. Principles of decision \nmaking strategies and \ntechniques  \n4.2.5. Enterprise information \nsystems and data \ncollation  \n4.2.6. Industry codes and \nstandards \n4.1. Using range of \nanalytical \ntechniques (e.g., \nplanning, \nattention, \nsimultaneous and \nsuccessive \nprocessing of \ninformation) in \nexamining specific \nchallenges in the \nworkplace  \n4.2. Identifying extent \nand causes of \nspecific \nchallenges in the \nworkplace  \n4.3. Providing clear-\ncut findings on the \nnature of each \nidentified \nworkplace \nchallenges  \n4.4. Devising, \ncommunicating, \nimplementing and \nevaluating \nstrategies and \ntechniques in \naddressing \nspecific workplace \nchallenges\n\n--- PDF PAGE 29 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- \nElectric Power Distribution Operation and Maintenance NC III  Revision 00   Promulgated June 27, 2018   25  \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Analytical techniques \nMay include: \n1.1. Brainstorming  \n1.2. Intuitions/Logic \n1.3. Cause and effect diagrams  \n1.4. Pareto analysis  \n1.5. SWOT analysis  \n1.6. Gant chart, Pert CPM and graphs  \n1.7. Scattergrams  \n2. Problem \nMay include: \n2.1.  Non – routine process and quality problems  \n2.2. Equipment selection, availability and failure  \n2.3. Teamwork and work allocation problem \n2.4. Safety and emergency situations and incidents \n3. Action plans \nMay include: \n3.1. Priority requirements \n3.2. Measurable objectives  \n3.3. Resource requirements  \n3.4. Timelines  \n3.5. Co-ordination and feedback requirements  \n3.6. Safety requirements  \n3.7. Risk assessment \n3.8. Environmental requirements\n\n--- PDF PAGE 30 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- \nElectric Power Distribution Operation and Maintenance NC III  Revision 00   Promulgated June 27, 2018   26  \n \nEVIDENCE GUIDE \n \n1. Critical aspect of \ncompetency \nAssessment requires evidence that the candidate: \n \n1.1. Identified the problem  \n1.2. Determined the fundamental causes of the \nproblem  \n1.3. Determined the correct / preventive action  \n1.4. Provided recommendation to manager  \n \nThese aspects may be best assessed using a range of \nscenarios / case studies / what ifs as a stimulus with a \nwalk through forming part of the response. These \nassessment activities should include a range of \nproblems, including new, unusual and improbable \nsituations that may have happened. \n \n2. Resource implication \n \n2.1. Assessment will require access to an operating \nplant over an extended period of time, or a suitable \nmethod of gathering evidence of operating ability \nover a range of situations. A bank of scenarios / \ncase studies / what ifs will be required as well as \nbank of questions which will be used to probe the \nreason behind the observable action \n \n3. Method of assessment \nCompetency in this unit may be assessed through: \n \n3.1. Case studies on solving problems in the workplace  \n3.2. Observation \n \nThe unit will be assessed in a holistic manner as is \npractical and may be integrated with the assessment of \nother relevant units of competency. Assessment will \noccur over a range of situations, which will include \ndisruptions to normal, smooth operation. Simulation may \nbe required to allow for timely assessment of parts of this \nunit of competency. Simulation should be based on the \nactual workplace and will include walk through of the \nrelevant competency components \n \n4. Context of Assessment \n \n4.1. In all workplace, it may be appropriate to assess this \nunit concurrently with relevant teamwork or operation \nunits\n",
