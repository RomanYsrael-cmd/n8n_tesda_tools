n2.3. Results of mathematical \ncomputation is \ndetermined and verified \nbased on job \nrequirements \n2.1. Problem-based \nquestions \n2.2. Estimation \n2.3. Use of mathematical \ntools and standard \nformulas \n2.4. Mathematical \ntechniques \n \n2.1. Solving \nmathematical \ncomputations \n2.2. Converting Metric \nto English \n2.3. Selecting and \nusing appropriate \nand efficient \ntechniques and \nstrategies to solve \nproblems \n \n3. Analyze \nresults  \n3.1. Result of application is \nreviewed based on \nexpected and required \nspecifications and \noutcome \n3.2. Appropriate action is \napplied in case of error \n \n3.1. Techniques in \nanalyzing the results \n3.2. Process in reviewing \nthe results \n3.3. Precision and \naccuracy \n3.4. Four fundamental \noperations \n3.5. Steps in solving \n3.1. Analyzing the \nresult based on \nthe specified \nrequirements \n3.2. Interpreting and \ncommunicating the \nresults of the \nanalysis\n\n--- PDF PAGE 22 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- \nElectric Power Distribution Operation and Maintenance NC III  Revision 00   Promulgated June 27, 2018   18  \n \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated \nin the Range of Variables \nREQUIRED \nKNOWLEDGE \n \nREQUIRED SKILLS \nproblem \n3.6. Standard formulas \n3.7. Conversion \nmeasurement \n \n \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.  Mathematical techniques \nMay include but are not limited to: \n1.1 Four fundamental operations \n1.2 Measurements \n1.3 Use/Conversion of units of measurements \n1.4 Use of standard formulas \n \n2.  Appropriate action \n2.1  Review in the use of mathematical techniques \n(e.g. recalculation, re-modeling) \n2.2  Report error to immediate superior for proper \naction \n \n \n \n \nEVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1. Identified, applied and reviewed the use of mathematical \nconcepts and techniques to workplace problems \n \n2. Resource \nImplications \nThe following resources MUST be provided: \n2.1. Calculator \n2.2. Basic measuring tools \n2.3. Case Problems \n \n3. Methods of \nAssessment \nCompetency may be assessed through: \n3.1. Authenticated portfolio \n3.2. Written Test \n3.3. Interview/Oral Questioning \n3.4. Demonstration \n \n4. Context for \nAssessment \n4.1. Competency may be assessed in the work place or in a \nsimulated work place setting\n",
