        "source_text": "--- PDF PAGE 14 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ \nElectric Power Distribution Operation and Maintenance NC III  Revision 00   Promulgated June 27, 2018   10  \nUNIT OF COMPETENCY:   DEVELOP AND PRACTICE NEGOTIATION SKILLS \n \nUNIT CODE                     :   500311111 \n \nUNIT DESCRIPTOR        : This unit covers the skills, knowledge and attitudes required to \ncollect information in order to negotiate to a desired outcome \nand participate in the negotiation.   \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in \nthe Range of Variables \nREQUIRED \nKNOWLEDGE \n \nREQUIRED SKILLS \n1. Plan \nnegotiations \n1.1. Information on preparing \nfor negotiation is \nidentified and included in \nthe plan \n1.2. Information on creating \nnonverbal environments \nfor positive negotiating is \nidentified and included in \nthe plan \n1.3. Information on active \nlistening is identified and \nincluded in the plan \n1.4. Information on different \nquestioning techniques \nis identified and included in \nthe plan \n1.5. Information is checked to \nensure it is correct and up-\nto- date \n1.1. Knowledge on \nCodes of practice \nand guidelines \nfor the \norganization   \n1.2. Knowledge of \norganizations \npolicy and \nprocedures for \nnegotiations   \n1.3. Decision making \nand conflict \nresolution \nstrategies \nprocedures   \n1.4. Concept of \nnegotiation \n \n1.1. Communication \nskills  (verbal and \nlistening) \n1.2. Active listening  \n1.3. Setting conflict \n1.4. Preparing conflict \nresolution \n1.5. Problem solving \nstrategies on how \nto deal with \nunexpected \nquestions and \nattitudes during \nnegotiation \n1.6. Interpersonal \nskills to develop \nrapport with other \nparties \n2. Participate in \nnegotiations   \n2.1 Criteria for successful \noutcome are agreed upon \nby all parties \n2.2 Desired outcome of all \nparties are considered \n2.3 Appropriate language is \nused throughout the \nnegotiation \n2.4 A variety of questioning \ntechniques are used \n2.5 The issues and processes \nare documented and agreed \nupon by all parties \n2.6 Possible solutions are \ndiscussed and their viability \nassessed \n2.7 Areas for agreement are \nconfirmed and recorded \n2.8 Follow-up action is agreed \nupon by all parties \n2.1 Outcome of   \nnegotiation   \n2.2 Knowledge on \nLanguage \n2.3 Different \nQuestioning \ntechniques \n2.4 Problem solving \nstrategies on \nhow to deal with \nunexpected \nquestions and \nattitudes during \nnegotiation  \n \n2.1 Negotiating skill \n2.2 Communication \nskills  (verbal and \nlistening) \n2.3 Observation skills  \n2.4 Interpersonal \nskills to develop \nrapport with other \nparties \n2.5 Applying effective \nquestioning \ntechniques \n2.6 Setting conflict\n\n--- PDF PAGE 15 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ \nElectric Power Distribution Operation and Maintenance NC III  Revision 00   Promulgated June 27, 2018   11  \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Preparing for \nnegotiation \n1.1 \n \n1.2 \n1.3 \n1.4 \n \n \n \n \n \n1.5 \n \n \n \n \n \n \n \n1.6  \nBackground information on other parties to the \nnegotiation \nGood understanding of topic to be negotiated \nClear understanding of desired outcome/s \nPersonal attributes \n1.4.1 self-awareness \n1.4.2 self esteem \n1.4.3 objectivity \n1.4.4 empathy \n1.4.5 respect for others \nInterpersonal skills \n1.5.1 listening/reflecting \n1.5.2 nonverbal communication \n1.5.3 assertiveness \n1.5.4 behavior labeling \n1.5.5 testing understanding \n1.5.6 seeking information \n1.5.7 self-disclosing \nAnalytic skills \n1.6.1 observing differences between content and \nprocess \n1.6.2 identifying bargaining information \n1.6.3 applying strategies to manage process \n1.6.4 applying steps in negotiating process \n1.6.5 strategies to manage conflict \n1.6.6 steps in negotiating process \n1.6.7 options within organization and externally \nfor resolving conflict \n  \n2.   Nonverbal \nenvironments \n2.1 \n2.2 \n2.3 \n2.4 \nFriendly reception \nWarm and welcoming room \nRefreshments offered \nLead in conversation before negotiation begins \n \n3.  Active listening \n3.1 \n3.2 \n3.3 \n3.4 \n3.5 \nAttentive \nDon’t interrupt \nGood posture \nMaintain eye contact \nReflective listening \n \n4.  Questioning   \ntechniques \n4.1 \n4.2 \n4.3 \nDirect \nIndirect \nOpen-ended\n\n--- PDF PAGE 16 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ \nElectric Power Distribution Operation and Maintenance NC III  Revision 00   Promulgated June 27, 2018   12  \nEVIDENCE GUIDE \n \n1. Critical aspects \nof Competency \nAssessment requires evidence that the candidate: \n1.1. Demonstrated sufficient knowledge of the factors \ninfluencing negotiation to achieve agreed outcome \n1.2. Participated in negotiation with at least one person to \nachieve an agreed outcome \n \n2. Resource \nImplications \nThe following resources MUST be provided:  \n2.1. Room with facilities necessary for the negotiation process \n2.2. Human resources (negotiators)  \n3. Methods of \nAssessment \nCompetency may be assessed through: \n3.1. Observation/demonstration and questioning \n3.2. Portfolio assessment \n3.3. Oral and written questioning \n3.4. Third party report \n4. Context for \nAssessment \n4.1. Competency to be assessed in real work environment or \nin a simulated workplace setting.\n",
