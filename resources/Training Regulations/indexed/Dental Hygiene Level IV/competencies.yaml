        "evidence_guide": {
          "source_text": "1.\nCritical Aspects\nof Competency\n1.1 Assessment must confirm the ability to utilize software,\nnavigate the desktop, using system features to perform\ntasks and save results of work.\n2.\nResource\nImplications\nTo demonstrate competence in this unit access to the following\nresources will be required:\n2.1 A personal computer\n2.2 A printer\n2.3 Mouse and keyboard\n2.4 Basic systems software\n3.\nMethods of\nAssessment\nCompetency may be assessed through:\n3.1 Observation in a workplace or simulated environment\n3.2 Third party reports\n3.3 Exams and tests\n3.4 Demonstration of required skills\n3.5 Interviews\n4.\nContext for\nAssessment\n4.1 Competency may be assessed in the workplace or in a\nsimulated work environment.\n\n--- PDF PAGE 84 ---\nDENTAL HYGIENE LEVEL IV Revision 01 Promulgated (01/11/2019) 80\nCORE COMPETENCIES\n\nUNIT OF COMPETENCY:\nPERFORM ORAL EXAMINATION\nUNIT CODE:",
