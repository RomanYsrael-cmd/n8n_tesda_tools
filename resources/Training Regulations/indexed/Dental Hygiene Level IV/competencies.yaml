        "source_title": "APPLY BASIC FIRST AID",
        "source_text": "--- PDF PAGE 71 ---\nDENTAL HYGIENE LEVEL IV                     Revision 01                     Promulgated (01/11/2019)        67 \n \nUNIT OF COMPETENCY \nAPPLY BASIC FIRST AID \nUNIT CODE \nHHC323203 \nUNIT DESCRIPTOR \nThis unit covers the knowledge, skills and attitudes required to \nprovide an initial response where First Aid is required. In this \nunit it is assumed that the First Aider is working under \nsupervision and / or according to established workplace First-\nAid procedures and policies. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are elaborated in \nthe Range of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1.  Assess the \nsituation \n1.1 \nPhysical hazards \nto self and \ncasualty’s health \nand safety are \nidentified. \n1.2 \nImmediate risks  to \nself and casualty’s \noccupational  health \nand safety (OSH \n)are minimized by \ncontrolling the \nhazard in \naccordance with \nOSH requirements. \n1.3 \nCasualty’s vital \nsigns and physical \ncondition are \nassessed in \naccordance with \nworkplace \nprocedures. \n1.1 Physical Hazards \n1.2 Risks \n1.3 Occupational \nSafety and \nHealth Policies \nand Procedures \n1.4 Vital Signs \n1.5 Workplace \nProcedures \n• Assessing \nsituation \n• Report \npreparation \n• Communication \nskills \n• Interpreting and \nusing  listed \ndocuments\n\n--- PDF PAGE 72 ---\nDENTAL HYGIENE LEVEL IV                     Revision 01                     Promulgated (01/11/2019)        68 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are elaborated in \nthe Range of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n2.  Apply basic \nfirst aid \ntechniques \n2.1 \nFirst Aid \nmanagement is \nprovided in \naccordance with \nestablished First \nAid procedures. \n2.2 \nCasualty is \nreassured in a \ncaring and calm \nmanner and made \ncomfortable using \navailable resources. \n2.3 \nFirst Aid assistance \nis sought from \nothers in a timely \nmanner and as \nappropriate. \n2.4 \nCasualty’s \ncondition is \nmonitored and \nresponded to in \naccordance with \neffective First-Aid \nprinciples and \nworkplace \nprocedures. \n2.5 \nDetails of casualty’s \nphysical condition, \nchanges in \nconditions, \nmanagement and \nresponse are \naccurately recorded \nin line with \norganizational \nprocedures. \n2.6 \nCasualty \nmanagement is \nfinalized according \nto his/her needs \nand First Aid \nprinciples. \n2.1 First Aid \nManagement \n2.2 First Aid \nProcedures \n2.3 Occupational \nSafety and \nHealth Policies \nand Procedures \n2.4 Vital Signs \n2.5 Workplace \nProcedures \n2.6 Basic Anatomy \nand Physiology \n• Resuscitation \n• Safe manual \nhandling of \ncasualty \n• Consideration \nof the welfare \nof the casualty \n• Assessing \nsituation \n• Report \npreparation \n• Communication \nskills \n• Interpreting and \nusing listed \ndocuments \n3.  Communicate \ndetails of the \n3.1 Appropriate medical \nassistance is \nrequested using \n3.1 Medical \nAssistance \n3.2 Communication \n3.1 Assessing \nsituation \n3.2 Preparing\n\n--- PDF PAGE 73 ---\nDENTAL HYGIENE LEVEL IV                     Revision 01                     Promulgated (01/11/2019)        69 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are elaborated in \nthe Range of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \nincident \nrelevant \ncommunication \nmedia and \nequipment. \n3.2 Details of casualty’s \ncondition and \nmanagement activities \nare accurately \nconveyed to \nemergency \nservices/relieving \npersonnel. \n3.3 \nReports to \nsupervisors are \nprepared in a timely \nmanner, presenting \nall relevant facts \naccording to \nestablished \ncompany \nprocedures. \nMedia \nEquipment \n3.3 Emergency \nServices \n3.4 Report Writing \n3.5 Workplace \nProcedures \n \nreport  \n3.3 Communicati\non skills \n3.4 Interpreting \nand using \nlisted \ndocuments\n\n--- PDF PAGE 74 ---\nDENTAL HYGIENE LEVEL IV                     Revision 01                  