        "source_text": "--- PDF PAGE 46 ---\nDENTAL HYGIENE LEVEL IV                     Revision 01                     Promulgated (01/11/2019)        42 \n \nCOMMON COMPETENCIES \n \nUNIT OF COMPETENCY: \n \nMAINTAIN AN EFFECTIVE RELATIONSHIP WITH CLIENTS \nAND CUSTOMERS \nUNIT CODE:                  \nHHC516201 \nUNIT DESCRIPTOR: \nThis unit covers the knowledge, skills and attitudes and values \nrequired in building and maintaining an effective relationship \nwith clients, customers and the public. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are elaborated in \nthe Range of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Maintain a clean \nand hygienic \nenvironment \n \n1.1 \nUniform and \npersonal grooming \nmaintained to \nassignment \nrequirements. \n1.2 \nPersonal \npresence \nmaintained \naccording to \nemployer \nstandards. \n1.3 \nVisible work area \nkept tidy and \nuncluttered. \n1.4 \nEquipment stored \naccording to \nassignment \nrequirements. \n1.1 Uniform and \npersonal \ngrooming \nrequirements of \nthe employer and \nthe client \n1.2 Occupational \nsafety and health \nrequirements for \nthe assignment \n1.3 Assignment \ninstructions \n \n1.1 Attention to \ndetail when \ncompleting \nclient/employer \ndocumentation  \n1.2 Interpersonal \nand \ncommunication \nskills required \nin client contact \nassignments  \n \n2. Meet \nclient/customer \nrequirements \n \n2.1 \nClient \nrequirements \nidentified and \nunderstood by \nreferral to \nassignment \ninstructions. \n2.2 \nClient \nrequirements met \naccording to the \nassignment \ninstructions. \n2.1 Assignment \nInstructions \n2.2 Use of various \nmeans of \ncommunication \n(additional) \n2.3 Customer \nService \n2.4 Telephone \nTechnique \n2.5 Problem Solving \nand Negotiation \n2.6 Maintaining \n2.1 Customer \nservice skills \nrequired to \nmeet \nclient/custome\nr needs  \n2.2 Punctuality \n2.3 Customer \nService \n2.4 Telephone \nTechnique \n2.5 Problem \nSolving and\n\n--- PDF PAGE 47 ---\nDENTAL HYGIENE LEVEL IV                     Revision 01                     Promulgated (01/11/2019)        43 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are elaborated in \nthe Range of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n2.3 \nChanges to \nclient’s needs \nand requirements \nmonitored and \nappropriate \naction taken. \n2.4 \nAll communication \nwith client or \ncustomer is \ncleared and \ncomplied with \nassignment \nrequirements. \nRecords \nNegotiation \n2.6 Maintaining \nRecords \n2.7 Attention to \ndetail when \ncompleting \nclient/custome\nr \n2.8 Interpersonal \nand \ncommunicatio\nn skills \nrequired in \nclient contact \nassignments \n3.  Build credibility \nwith customers/ \nclients \n3.1 \nClient expectations \nfor reliability, \npunctuality and \nappearance \nadhered to. \n3.2 \nPossible causes of \nclient/customer \ndissatisfaction \nidentified, dealt \nwith recorded \naccording \nemployer policy. \n3.3 \nClient fully \ninformed of all \nrelevant matters in \na timely manner \nand according to \nagreed reporting \nprocedures. \n \n3.1 Types of \ncustomers/clients \n3.2 Behaviors, \ngestures and \nattitudes \n3.3 Related \ncustomer \ninformation and \nrequirements \n3.1 Dealing with \ncustomers/ \nclients \nconcerns \n3.2 Asserting \nemployer \npolicies and \nprocedures \n3.3 Implementing \nsecurity \ninformation \nand \nprocedures\n\n--- PDF PAGE 48 ---\nDENTAL HYGIENE LEVEL IV                     Revision 01                     Promulgated (01/11/2019)        44 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Personal Presence \nMay include: \n1.1 \nStance \n1.2 \nPosture \n1.3 \nBody Language \n1.4 \nDemeanor \n1.5 \nGrooming \n 2. Employer \nStandards \nMay include: \n2.1 \nStanding Orders \n3. Client \nRequirements  \nMay include: \n3.1 \nAssignment instructions \n3.2 \nPost Orders \n3.3 \nScope to modify instructions/orders in light of \nchanged situations \n4. Assignment \nInstructions \nMay be conveyed in: \n4.1 \nWriting \n4.2 \nVerbally \n4.3 \nElectronically \n5. Client Needs and \nRequirements \nMay be detected by: \n5.1 \nReview of the client brief and/or assignment \ninstructions \n5.2 \nDiscussion with the client/customer \n6. Appropriate Action \nMay include: \n6.1 \nImplementing required changes \n6.2 \nReferring to appropriate employer personnel \n6.3 \nClarification of client needs and instructions \n6.4 \nHazard reports \n7.  Customers \nMay include: \n7.1 \nAll members of the public\n\n--- PDF PAGE 49 ---\nDENTAL HYGIENE LEVEL IV                     Revision 01                     Promulgated (01/11/2019)        45 \nEVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 \nMaintained a professional image \n1.2 \nInterpreted client/customer requirements from information \n1.3 \nDealt successfully with a variety of client/customer \ninteractions \n1.4 \nMonitored and acted on changing client or customer \nneeds \n1.5 \nMet client/customer requirements \n1.6 \nBuilt credibility with customers/client \n2. Resource \nImplications \nThe following resources should be provided: \n2.1 \nAssessment Centers/Venues \n2.2 \nAccredited Assessors \n2.3 \nModes of Assessment \n2.4 \nEvaluation Reports  \n2.5 \nAccess to a relevant venue, equipment and materials  \n2.6 \nAssignment Instructions \n2.7 \nLogbooks \n2.8 \nOperational manuals and makers/customers’ instructions \n2.9 \nAssessment instruments, including personal planner and \nassessment record book \n3. Methods of \nAssessment \nCompetency in this unit may be assessed through: \n3.1 \nWritten Test  \n3.2 \nDemonstration with questioning \n3.3 \nObservation with questioning \n4. Context of \nAssessment \n4.1    Competency maybe assessed in actual workplace or at \ndesignated TESDA Accredited Assessment Center.\n",
