        "source_text": "500311409\n\n UNIT DESCRIPTOR\n:\nThis unit covers the outcomes required to update\nand continue one’s professional development along\nentrepreneurship, including applying such growth in\nskills\ntoward\nexpanding\nthe\nenterprise\nand\ndeveloping its work force.\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n1. Enhance\none’s\nbusiness\nskills\n1.1 Entrepreneurial skills\ndevelopment needs are\nidentified and\nresponded to promptly.\n1.2 Market trends are\nmonitored, anticipated\nand taken advantage of\nwhere feasible.\n1.3 New technologies,\nproducts and processes\nare included/utilized\nwhere advantageous to\nthe enterprise.\n1.4 Constant\ndialog/linkages with\nother\nentrepreneurs/peers\nand stakeholders are\nmaintained\n1.5 Circulation and\nparticipation in\nbusiness fora,\nmeetings, conventions\nand exhibits are\nmaintained.\n1.1 Business models\nand strategies\n1.2 Types and\ncategories of\nbusinesses\n1.3 Business internal\ncontrols\n1.4 Market Trends\n1.5 Relevant\nnational and local\nlegislation and\nregulations\n1.6 Basic quality\ncontrol and\nassurance\nconcepts\n\n1.1 Basic bookkeeping/\naccounting skills\n1.2 Communication\nskills\n1.3 Building relations\nwith customer and\nemployees\n1.4 Building competitive\nadvantage of the\nenterprise\n1.5 Networking and\nLinkaging skills\n\n--- PDF PAGE 43 ---\nDENTAL HYGIENE LEVEL IV Revision 01 Promulgated (01/11/2019) 39\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n2. Manage\nentrepreneurial\npractices\n2.1 Ideas and comments\nfor improvements are\nsought from workers\nand clients.\n2.2 Staff/workers are\nencouraged and\nsupported in their skills\ndevelopment and\nenhancement.\n2.3 A culture of\ncontinuous\nimprovement is\nfostered within the\nenterprise.\n2.4 Innovations on the\nexisting lines of\nproducts and services\nare encouraged\n\n2.1 Public relations\nconcepts\n2.2 Basic product\npromotion\nstrategies\n2.3 Basic market and\nfeasibility studies\n2.4 Basic business\nethics\n2.1 Building customer\nrelations\n2.2 Individual marketing\nskills\n2.3 Using basic\nadvertising (posters/\ntarpaulins, flyers,\nsocial media, etc.)\n3. Expand\nmarkets and\nclientele\n3.1 Enterprise is built up\nand sustained through\njudicious control of\ncash flows.\n3.2 Profitability of\nenterprise is ensured\nthough appropriate\ninternal controls.\n3.3 Unnecessary or lower-\npriority expenses and\npurchases are avoided.\n3.4 New markets and\nclients are identified\nbased on current\nmarket trends\n\n3.1 Basic cost-benefit\nanalysis\n3.2 Basic financial\nmanagement\n3.3 Basic financial\naccounting\n3.4 Business internal\ncontrols\n\n3.1 Setting business\npriorities and\nstrategies\n3.2 Interpreting basic\nfinancial statements\n3.3 Preparing business\nplans\n\n--- PDF PAGE 44 ---\nDENTAL HYGIENE LEVEL IV Revision 01 Promulgated (01/11/2019) 40\n RANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Entrepreneurial skills\nMay include:\n1.1. Financial management skills\n1.2. People management skills\n1.3. Operations management skills\n1.4. Business acumen\n\n2. Business operations\nMay include:\n2.1 Purchasing\n2.2 Accounting/Administrative work\n2.3 Production/Operations/Sales\n\n3. Internal controls\nMay include:\n3.1 Accounting systems\n3.2 Financial statements/reports\n3.3 Cash management\n3.4 Managing property, plant and equipment\n4. Continuous\nimprovement\nMay include:\n4.1 Quality management systems (PDCA, ISO 9001,TQM, Six-\nSigma, etc.)\n4.2 Client feedback systems\n4.3 Quality assurance/Quality control systems\n\n--- PDF PAGE 45 ---\nDENTAL HYGIENE LEVEL IV Revision 01 Promulgated (01/11/2019) 41\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Demonstrated enhancement of one’s entrepreneurial\nskills through performance of business, supervisor\nevaluation, worker and client testimony\n\n2. Resource\nImplications\nThe following resources should be provided:\n2.1 Interview guide for entrepreneurs, enterprise workers\nand third parties\n2.2 Materials and location relevant to the proposed\nactivity and tasks\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through :\n3.1 Written report\n3.2 Written examination\n3.3 Demonstration/observation with oral questioning\n3.4 Portfolio assessment with interview\n3.5 Third-party report\n\n4. Context of\nAssessment\n4.1 Competency may be assessed in workplace or in a\nsimulated workplace setting\n4.2 Assessment shall be observed while tasks are being\nundertaken whether individually or in-group\n\n--- PDF PAGE 46 ---\nDENTAL HYGIENE LEVEL IV Revision 01 Promulgated (01/11/2019) 42\n\nCOMMON COMPETENCIES\n\nUNIT OF COMPETENCY:\n\nMAINTAIN AN EFFECTIVE RELATIONSHIP WITH CLIENTS\nAND CUSTOMERS\nUNIT CODE:"
