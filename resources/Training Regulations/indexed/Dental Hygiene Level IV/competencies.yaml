          "source_text": "1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nWorked safely and followed OHS policies and\nprocedures in dental laboratory practice\n1.2\nComplied with DOH infection control guidelines\n1.3\nContributed to the management of OHS\n1.4\nUtilized and implemented strategies as directed to\nprevent infection in the workplace\n1.5\nUtilized strategies to prevent stress overload\n1.6\nWorked in a safe manner\n2. Resource\nImplications\nThe following resources MUST be provided:\n2.1\nRelevant dental laboratory practice/organizational\npolicies and procedures manuals such as:\n2.1.1 Incident reporting procedures\n2.1.2 OHS policy and procedures\n2.1.3 Infection control guidelines (DOH)\n2.1.4 Waste management policies\n2.1.5 Relevant state legislation\n2.1.6 Manufacturer’s instructions for the use of relevant\nequipment, instruments and materials\n2.1.7 Material Safety Data Sheets (MSDs)\n\n3. Method of\nAssessment\nCompetency may be assessed through:\n3.1\nObservation with questioning\n3.2\nOral questioning/Interview\n3.3\nPortfolio\n3.4\nThird Party Report\n4. Context of\nAssessment\n4.1\nCompetency may be assessed in the workplace or in a\nsimulated work setting.\n\n--- PDF PAGE 64 ---\nDENTAL HYGIENE LEVEL IV Revision 01 Promulgated (01/11/2019) 60\nUNIT OF COMPETENCY:\nMAINTAIN INFECTION CONTROL IN DENTAL\nLABORATORY PRACTICE\nUNIT CODE:"
