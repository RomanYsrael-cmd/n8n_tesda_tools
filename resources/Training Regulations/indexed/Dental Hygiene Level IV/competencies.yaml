eve data for \ndecision making. \n3.2. Technology available in \nthe work area/ \norganisation is used to \nmanage information. \n3.3. Recommendations for \nimproving the \ninformation system are \nsubmitted to \ndesignated persons/ \ngroups. \n \n3.1. Analysis and \ndisplay \ntechniques \n3.2. Information \ncollection, \ncollation \n3.3. Information \nevaluation issues \n3.4. Information \nstorage \nrequirements and \nmethods \n3.5. Reporting \nprocedures of the \norganisation \n3.1. Analysing record \ninformation \n3.2. Collecting and \ncollating information \n3.3. Communicating \neffectively \n3.4. Disseminating \ninformation \n3.5. Presenting \ninformation \n3.6. Using management \ninformation systems \nto store and retrieve \ndata \n4. Report and \ndisseminate \nanalyzed \ninformation \n \n4.1. The results of \ninformation gathering, \nanalysis and synthesis \nare reported within \nspecified time frames \nand to the standard \ndefined by the \norganisation. \n4.2. The results of \ninformation gathering, \nanalysis and synthesis \nare reported so they \ncan be inputs to policy \ndevelopment and \norganisation decision \nmaking. \n4.3. Information which is \ngathered is \ndisseminated to \nappropriate personnel \nwithin the specified \ntimeframe \n4.1. Analysis and \ndisplay \ntechniques \n4.2. Information \ncollection, \ncollation \n4.3. Information \nevaluation issues \n4.4. Information \nstorage \nrequirements and \nmethods \n4.5. Reporting \nprocedures of the \norganisation \n \n4.1. Analysing record \ninformation \n4.2. Collecting and \ncollating information \n4.3. Communicating \neffectively \n4.4. Disseminating \ninformation \n4.5. Presenting \ninformation \n4.6. Using management \ninformation systems \nto store and retrieve \ndata\n\n--- PDF PAGE 32 ---\nDENTAL HYGIENE LEVEL IV                     Revision 01                     Promulgated (01/11/2019)        28 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Information \nMay include: \n1.1 Routine and complex reports and submissions \n1.2 Briefing notes \n1.3 Ministerial \n1.4 Proposals \n1.5 Project plans \n1.6 Articles and promotional material \n \n2. Collection \ntechniques or \nmethods \n2.1 Collection techniques may include: \n2.1.1 Research \n2.1.2 Surveys \n2.1.3 Literature search \n2.1.4 Interviews \n2.1.5 Data bases \n2.1.6 Observation \n2.2 Collection methods may include: \n2.2.1 Indexing \n2.2.2 linking \n2.2.3 Sorting \n2.2.4 Comparing \n2.2.5 Categorizing \n2.2.6 Integrating \n \n3. Analysis  \nMay include: \n3.1. application of statistical methods \n3.2. mathematical calculations \n3.3. critical analysis \n3.4. problem solving \n4. Management \ninformation \nsystems  \nMay include: \n4.1. Computers \n4.2. Communication channels \n4.3. Records management \n4.4. Procedures \n4.5. Manuals \n4.6. Protocol \n4.7. Legislation \n4.8. Guidelines and awards \n4.9. Organizational \n4.10. Legal and policy materials\n\n--- PDF PAGE 33 ---\nDENTAL HYGIENE LEVEL IV                     Revision 01                     Promulgated (01/11/2019)        29"
