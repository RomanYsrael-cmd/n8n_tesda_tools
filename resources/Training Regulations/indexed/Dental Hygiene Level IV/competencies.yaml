        "evidence_guide": {
          "source_text": "1 Critical Aspects \nof Competency \n \nAssessment requires evidence that the candidate: \n1.1 Applied knowledge of ionizing radiation to produce a dental \nradiograph \n1.2 Applied knowledge of radiation biology to protect patients, \noperator and others from ionizing radiation \n1.3 Determined image characteristics of a dental radiographic \nimage to minimize re-takes \n1.4 Minimized radiation by maintaining quality in processing \n1.5 Demonstrated consistent compliance with infection control \nguidelines and legislative requirements \n1.6 Demonstrated consistent performance over the required \nrange of workplace situations including: \n- \ncorrect preparation of clients for dental radiographic \nimaging procedures \n- \napplication of radiation occupational health and safety \npolicies and procedures to minimize the risk of radiation \nto the patient, operator and others during the exposure of \na prescribed dental radiographic image \n- \nimplementation of quality assurance measures to ensure \nproduction of radiographs to consistent diagnostic \nstandard \n2 Resource \nImplications \n \nThe following resources should be provided: \n2.1 A real or simulated dental clinic environment \n2.2 Access to dental radiographic imaging units and resources \nnormally used in the workplace \n2.3 Relevant dental practice/organization policy and procedures \nmanuals such as: \n- \nincident reporting procedures \n- \ninfection control guidelines \n- \nOH&S policies and procedures \n2.4 Relevant national/local legislation \n2.5 Manufacturer’s specifications for dental radiographic units \n2.6 Radiographic viewing equipment \n2.7 A qualified workplace assessor \n \n3 Methods of \nAssessment \n \nCompetency may be assessed through: \n3.1 Demonstration with oral questioning \n3.2 Oral interview  \n3.3 Third party report \n3.4 Portfolio (authenticated evidence of relevant work \nexperience and/or formal/informal learnings \n4 Context of \nAssessment \n \n4.1 Assessment may be conducted in the workplace or in a \nsimulated environment",
