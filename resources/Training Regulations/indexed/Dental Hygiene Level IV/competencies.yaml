 \nglobally and acting \nlocally” is practiced. \n3.1 Actions that can \nbe taken \nindividually and \ncollectively \n3.2  Ethically \nresponsible \nbehaviour \n3.3 Importance and \nbenefits of civic \nengagement \n3.4  Strategies and \ntechniques of \n“thinking globally \nand acting \nlocally \n3.1 Employing \nappropriate actions \nto address \nworkplace issues \ninvolving national \nand global trends \n3.2 Showing concern \nand willingness to \ntake part in the \ndevelopment \nefforts to discuss \nworkplace issues \nand concerns \n3.3 Applying the \nattitude of “thinking \nglobally and acting \nlocally” in the \nworkplace\n\n--- PDF PAGE 26 ---\nDENTAL HYGIENE LEVEL IV                     Revision 01                     Promulgated (01/11/2019)        22 \nRANGE OF VARIABLES"
