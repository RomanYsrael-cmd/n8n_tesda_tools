dental\nradiographic\nimaging\ntechniques and\nthe reasons for\nselection of each\ntechnique\n4.6 Features and\ncharacteristics\nincluding range\nof movements of\na range of dental\nradiographic\nequipment\n4.7 Reasons for\nprocessing and\ntechnique\ninaccuracies and\nmethods to\nminimize errors\n4.5 Processing\nand\nmaintaining\nquality and\nsafety in\nusing and\nprocessing\nexposed\ndental\nradiographic\nfilm\n4.6 Using\nliteracy skills\nto read and\nfollow\ndirections,\npolicies and\nprocedures\n4.7 Using oral\ncommunicati\non skills\nrequired to\nfulfill the job\nrole as\nspecified by\nthe dental\npractice\n5. Monitor\nequipment\n5.1 Basic machine\noperation is\nmonitored in\naccordance with\nmachine operating\nmanuals\n5.2 Machine is referred\nto qualified\npersonnel for regular\ncheck-up and\nmaintenance\nfollowing enterprise\nprocedures\n5.3 Breakdowns are\nreported to qualified\npersonnel in\n5.1 Legislative and\nethical\nresponsibilities\nfor the safe use\nof radiation in\ndentistry\n5.2 Relevant\nlegislation and\nstatutory\nrequirements of\nconsent\n5.3 Fundamental\nknowledge of the\nradiographic\nappearance of\nanatomic\n5.1 Operating\nradiographic\nunit\n5.2 Observing\nsafety and\nhealth\nprecautions\nin dental\nradiography\n5.3 Minimizing\ntechnical\ninaccuracies\nin dental\nradiographic\nimages\n5.4 Using terms\n\n--- PDF PAGE 103 ---\nDENTAL HYGIENE LEVEL IV Revision 01 Promulgated (01/11/2019) 99\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\naccordance with\norganization and\nlegislative guidelines\n\nlandmarks,\nnormal dentition\nand association\nbony structures\nfor intraoral\nradiographs\n5.4 Fundamental\nknowledge of the\nradiographic\nappearance of\ndental anomalies\nand common oral\npathological\nconditions\n5.5 Range od dental\nradiographic\nimaging\ntechniques and\nthe reasons for\nselection of each\ntechnique\n5.6 Features and\ncharacteristics\nincluding range\nof movements of\na range of dental\nradiographic\nequipment\n5.7 Reasons for\nprocessing and\ntechnique\ninaccuracies and\nmethods to\nminimize errors\nfor technical\ninaccuracies\nin dental\nradiographic\nimages\n5.5 Processing\nand\nmaintaining\nquality and\nsafety in\nusing and\nprocessing\nexposed\ndental\nradiographic\nfilm\n5.6 Using\nliteracy skills\nto read and\nfollow\ndirections,\npolicies and\nprocedures\n5.7 Using oral\ncommunicati\non skills\nrequired to\nfulfill the job\nrole as\nspecified by\nthe dental\npractice\n\n--- PDF PAGE 104 ---\nDENTAL HYGIENE LEVEL IV Revision 01 Promulgated (01/11/2019) 100\n\nRANGE OF VARIABLES\n\nVARIABLE\n\nRANGES\n1. Radiation safety\nmeasures for patient,\noperator and others\n\n1.1 Radiation safety measures for the client may include:\n1.1.1\nUse of lead aprons\n1.1.2\nAppropriate technique\n1.1.3\nReceptor (film) selection\n1.1.4\nTechnical features of the radiographic unit as\ndetermined by manufacturer specifications\nincluding:\n1.1.4.1 Kilovoltage\n1.1.4.2 Filtration\n1.1.4.3 X-ray beam collimation\n1.2 Radiation safety measures for the operator and others\nincludes but is not limited to:\n1.2.1 Maximum permissible dose (MDP) of radiation\n1.2.2 Determination of pregnancy\n1.2.3 Distance from primary beam\n1.2.4 Use of lead lined barriers\n1.2.5 Legislative requirements\n2. Appropriate technical\nvariables\n\nMay include:\n2.1 Technical variables, milliamperage, kilovoltage and\ntube length are pre-determined by manufacturer\nspecifications for radiographic unit or selected by the\ndentist or dental specialist prior to the procedure:\n-\nselection\nof\ntechnical\nvariables\nof\ndental\nradiographic units by the dental assistant in\naccordance with manufacturers specifications and\npatient requirements may include but is not limited\nto exposure times.\n\n3. Appropriate\nradiographic technique\n\nAppropriate radiographic technique may include:\n3.1 The bisected angle technique\n3.2 The paralleling technique\n3.3 Extra oral techniques:\n-\nhorizontal and vertical angulation\n-\nreceptor (film) selection and placement\n-\ncorrect assembly of film locating device\n-\npositioning of client\n-\nuse of intensifying screens\n\n--- PDF PAGE 105 ---\nDENTAL HYGIENE LEVEL IV Revision 01 Promulgated (01/11/2019) 101\n\n4. Patient requirements\nMay include but are not limited to:\n4.1 Age\n4.2 Size\n4.3 Weight\n4.4 Physical capabilities\n4.5 Pregnancy\n4.6 Ability to comply with instructions\n4.7 Radiographic view/position\n4.7.1\nIntraoral radiographic views\n4.7.1.1 Occlusal\n4.7.1.2 Periapical\n4.7.1.3 Bitewing view\n4.7.1.4 Full mouth series\n4.7.2\nExtraoral radiographic views\n4.7.2.1 Panoramic films\n4.7.2.2 Cephalometric\n\n5. Accessories\n\nMay include but are not limited to:\n5.1 Film locating devices\n5.2 Film holders\n5.3 Immobilization equipment\n5.4 Intensifying screens\n5.5 Modifications for the use of film locating devices\n\n6. Processing errors\nMay include but are not limited to:\n6.1 Film that is marked\n6.2 Film with inadequate or low contrast\n6.3 Film that is too dark\n6.4 Film that is too light\n\n7. Errors in techniques\nMay include but are not limited to:\n7.1 Incorrect horizontal and vertical angulation\n7.2 Incorrect film placement\n7.3 Incorrect assembly and use of film locating device\n7.4 Incorrect tubehead placement\n7.5 Failure to remove oral appliances and jewellery\n7.6 Over/under exposure\n7.7 Movement of patient or film\n\n8. Organization and\nlegislative guidelines\n\n8.1 Radiation safety act 1999\n8.2 Radiation safety and protection plan\n8.3 X-ray machine operating manuals\n8.4 DOH\nGuidelines\nfor\nOperation\nof\nRadiographic\nEquipment\n\n--- PDF PAGE 106 ---\nDENTAL HYGIENE LEVEL IV Revision 01 Promulgated (01/11/2019) 102\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\n\nAssessment requires evidence that the candidate:\n1.1 Positioned patient and dental radiographic film to obtain\nradiographic image\n1.2 Operated radiographic imaging safely\n1.3 Processed and provided quality assured exposed dental\nradiographic film\n1.4 Demonstrated consistent compliance with infection\ncontrol guidelines and legislative requirements\n1.5 Applied code of practice for safe use of radiation in\ndentistry\n1.6 Documented/recorded all radiographs taken in the\nlogbook in accordance with the licensing requirements of\nRadiation Health\n2. Resource Implications\nThe following resources MUST be provided:\n2.1 A real or simulated dental clinic environment\n2.2 Access to dental radiographic imaging units, radiographic\nviewing equipment and resources normally used in the\nworkplace\n2.3 Relevant documentation such as:\n2.3.1Industry codes of practice\n 2.3.2National and local legislation as appropriate\n2.4A qualified workplace assessor\n\n3. Methods of\nAssessment\nCompetency may be assessed through:\n3.1 Demonstration with oral questioning\n3.2 Oral Interview\n3.3 Third Party Report\n3.4 Portfolio (authenticated evidence of relevant work\nexperience and/or formal/informal learning)\n\n4. Context of\nassessment\n4.1 Assessment may be conducted in the workplace or in a\nsimulated environment\n\n--- PDF PAGE 107 ---\nDENTAL HYGIENE LEVEL IV Revision 01 Promulgated (01/11/2019) 103\n\nUNIT OF COMPETENCY\nAPPLY THE PRINCIPLE OF RADIATION BIOLOGY AND\nPROTECTION IN DENTAL PRACTICE\nUNIT CODE"
