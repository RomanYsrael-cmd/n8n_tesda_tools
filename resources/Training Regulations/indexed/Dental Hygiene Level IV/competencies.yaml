        "source_text": "ICT311201\nUNIT DESCRIPTOR:\nThis unit defines the competency required to operate a\npersonal computer by: starting the PC, logging in, using and\nworking with files, folders and programs, saving work, and\nclosing down the PC.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Start the\ncomputer\n\n1.1\nThe peripheral\ndevices are\nproperly\nconnected\n1.2\nPower is checked\nand the computer\nand peripheral\ndevices are\nswitched on\n1.3\nProper logging in\nand logging off is\nsuccessfully done\n1.4\nThe operating\nsystem features\nand functions are\naccessed and\nnavigated\n1.5\nHardware\nconfiguration and\nother system\nfeatures are\nchecked\n1.1 Peripheral\nDevices\n1.2 Keyboard\nLayout and\nFunctions\n1.3 Basic parts of\na computer\nand various\nhardware\ncomponents\n1.4 Storage\ndevices and\nthe concepts\n1.5 Basic\nsoftware\noperation and\nfunctionalities\n1.1 Starting the\ncomputer\n1.2 Connecting\nproperly\nperipheral\ndevices\n1.3 Logging\nproperly\n1.4 Accessing and\nnavigating\noperating\nsystem\n1.5 Checking\nhardware\nconfiguration\nand other\nsystem\nfeatures\n2. Arrange and\ncustomize\ndesktop\ndisplay/\nWindows\nsettings\n\n2.1\nThe desktop\nscreen or\nWindows\nelements are\nchanged as\nneeded\n2.2\nDesktop icons are\nadded, renamed,\nmoved, copied or\ndeleted\n2.3\nThe online help\nfunctions are\naccessed or used\n2.1 Peripheral\nDevices\n2.2 Keyboard\nLayout and\nFunctions\n2.3 Basic parts of\na computer\nand various\nhardware\ncomponents\n2.4 Storage\ndevices and\nthe concepts\n2.1 Computer\nskills\n2.2 Mouse and\nkeyboarding\nskills for\nrunning\nsoftware\napplications\n2.3 Reading and\nwriting at a\nlevel where\nbasic\ndocuments\n\n--- PDF PAGE 78 ---\nDENTAL HYGIENE LEVEL IV Revision 01 Promulgated (01/11/2019) 74\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\nas needed\n2.4\nDesktop icons of\napplication\nprograms are\nselected, opened\nand closed\n2.5\nProperties of\nicons are\ndisplayed\n2.6\nComputer or\ndesktop settings\nare saved and\nrestored\n2.5 Basic\nsoftware\noperation and\nfunctionalities\nare\nunderstood\n2.4 Clear ability\nto\ncommunicate\nwith peers\nand\nsupervisors\n2.5 Interpretation\nof user\nmanuals and\nhelp functions\n2.6 The ability to\ncarry out\nwritten and\nverbal\ninstructions\nusing a\npersonal\ncomputer\nwhether\nstandalone or\nin a\nnetworked\nenvironment\n\n3. Work with files\nand folders (or\ndirectories)\n\n3.1\nA file or folder is\ncreated, opened,\nmoved, renamed\nor copied\n3.2\nFiles are located,\ndeleted and\nrestored\n3.3\nDetails and\nproperties of files\nand folders are\ndisplayed or\nviewed\n3.4\nVarious files are\norganized for\neasy lookup and\nuse\n3.5\nFiles and\ninformation are\n3.1 Keyboard\nLayout and\nFunctions\n3.2 Computer\nFunctions\n3.3 Basic parts of\na computer\nand various\nhardware\ncomponents\n3.4 Storage\ndevices and\nthe concepts\n3.5 Basic\nsoftware\noperation and\nfunctionalities\n3.1 Saving and\nretrieving files\nto and from\nvarious\nfolders or disk\nstorage\n3.2 Mouse and\nkeyboarding\nskills for\nrunning\nsoftware\napplications\n3.3 Clear ability\nto\ncommunicate\nwith peers\nand\nsupervisors\n\n--- PDF PAGE 79 ---\nDENTAL HYGIENE LEVEL IV Revision 01 Promulgated (01/11/2019) 75\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\nsearched\n3.6\nDisks are\nchecked, erased\nor formatted as\nnecessary\n3.4 Interpretation\nof user\nmanuals and\nhelp functions\n4. Work with\nuser\napplication\nprograms\n4.1\nApplication\nprograms are\nadded, changed,\nremoved or ran\n4.2\nUser software or\napplication\nprogram are\ninstalled, updated\nand upgraded\n4.3\nInformation/data\nare moved\nbetween\ndocuments or files\n4.1 Keyboard\nLayout and\nFunctions\n4.2 Computer\nFunctions\n