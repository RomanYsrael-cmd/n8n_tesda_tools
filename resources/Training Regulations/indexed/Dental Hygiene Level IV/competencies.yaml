        "source_text": "--- PDF PAGE 24 ---\nDENTAL HYGIENE LEVEL IV                     Revision 01                     Promulgated (01/11/2019)        20 \nUNIT OF COMPETENCY : CONTRIBUTE TO THE PRACTICE OF SOCIAL \nJUSTICE IN THE WORKPLACE \n \nUNIT CODE \n:    500311404 \n \nUNIT DESCRIPTOR \n: This unit covers ways and means to assume active \nroles in resolving local and global challenges and to \nbecome proactive contributors to a more peaceful and \nsustainable world. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Update self \non local, \nnational and \nglobal \ntrends/ \nissues in the \nworkplace \n1.1 Media are regularly \nscanned/ monitored \nfor trends and issues \nrelevant to human \nrights, gender equality, \npromotion of culture of \npeace and non-\nviolence, global \ncitizenship and \nappreciation of cultural \ndiversity.   \n1.2 Knowledge and \nunderstanding of local, \nnational and global \nissues and their \ninterconnectedness and \ninterdependency are \nacquired. \n1.3 Notable issues and \ntrends are critically \nexamined and \ndiscussed with peers, \ncolleagues, or family \nmembers. \n1.1 Local, national \nand global \nsystems and \nstructures \n1.2 Issues affecting \ninteraction and \nconnectedness of \ncommunities at \nlocal, national \nand global levels \n1.3 Underlying \nassumptions and \npower dynamics  \n(politics, \nunderstanding \npolitical system, \nsocial structures, \nlabor laws, labor \nrelations, human \nright)  \n \n \n1.1 Monitoring trends \nand issues \nrelevant to human \nrights, gender \nequality, culture of \npeace, global \ncitizenship, and \ncultural diversity \nusing different \nmedia platforms \n1.2 Analyzing trends \nand issues \nrelevant to human \nrights, gender \nequality, culture of \npeace, global \ncitizenship, and \ncultural diversity  \n1.3 Engaging in \ndiscourse about \nthe local, national \nand global issues\n\n--- PDF PAGE 25 ---\nDENTAL HYGIENE LEVEL IV                     Revision 01                     Promulgated (01/11/2019)        21 \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n3. Engage and \ntake actions \non workplace \nissues and \nconcerns \n3.1 Effective and \nresponsible actions at \nlocal, national and \nglobal levels are \nidentified. \n3.2 Motivation and \nwillingness to take \nnecessary actions are \ndeveloped. \n3.3  Attitude of “thinking \nglobally and acting \nlocally” is practiced. \n3.1 Actions that can \nbe taken \nindividually and \ncollectively \n3.2  Ethically \nresponsible \nbehaviour \n3.3 Importance and \nbenefits of civic \nengagement \n3.4  Strategies and \ntechniques of \n“thinking globally \nand acting \nlocally \n3.1 Employing \nappropriate actions \nto address \nworkplace issues \ninvolving national \nand global trends \n3.2 Showing concern \nand willingness to \ntake part in the \ndevelopment \nefforts to discuss \nworkplace issues \nand concerns \n3.3 Applying the \nattitude of “thinking \nglobally and acting \nlocally” in the \nworkplace\n\n--- PDF PAGE 26 ---\nDENTAL HYGIENE LEVEL IV                     Revision 01                     Promulgated (01/11/2019)        22 \nRANGE OF VARIABLES \n \n \n \nEVIDENCE GUIDE \n \n \n \n \n \nVARIABLE \nRANGE \n1. Media \nMay include but not limited to: \n1.1 \nPrint media \n1.2 \nBroadcast media \n1.3 \nInternet and social media  \n2. Scanning/Monitoring \nMay include but not limited to: \n2.1 \nSourcing from key informants \n2.2 \nConversation with clients \n2.3 \nMan-on-the-street conversation \n2.4 \nScanning print and broadcast media \n3. Local, national and \nglobal issues \n \nMay include but not limited to: \n3.1 \nPoverty \n3.2 \nUnemployment \n3.3 \nGlobal warming \n3.4 \nSafety, security, and well-being \n1. Critical aspects of \nCompetency  \nAssessment requires evidence that the candidate: \n1.1 Demonstrated ability and attitude to keep oneself \nupdated of relevant issues/trends  \n1.2 Demonstrated ability to think and act based on one’s \nprinciples and values \n1.3 Demonstrated a holistic/global outlook on internal and \nexternal events in the workplace  \n2. Resource \nImplications \nThe following resources should be provided: \n2.1 Access to workplace and resources \n2.2 Case studies \n3. Methods of \nAssessment \nCompetency in this unit may be assessed through: \n3.1 \nDemonstration or simulation with oral questioning \n3.2 \nCase problems involving global and local issues \n3.3 \nThird-party report \n4. Context for \nAssessment \n4.1 \nCompetency assessment may occur in workplace or \nany appropriately simulated environment\n",
