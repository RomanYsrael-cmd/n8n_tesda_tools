        "evidence_guide": {
          "source_text": "1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nFollowed safe handling, drying and cleaning protocols\n1.2\nFollowed correct packing, assembly and wrapping\nprocedures and storage\n1.3\nFollowed appropriate OH&S procedures\n\n2. Resource\nImplications\nThe following resources MUST be provided:\n2.1\nWorkplace: Real or simulated work area\n2.2\nAppropriate tools and equipment\n2.3\nAppropriate supplies and materials\n\n3. Method of\nassessment\nCompetency may be assessed through:\n3.1 Demonstration with questioning\n3.2 Written Test/Examination\n3.3 Third Party Report\n3.4 Portfolio\n\n4. Context of\nassessment\n4.1\nCompetency may be assessed in the workplace or in\na simulated work setting or environment.\n\n--- PDF PAGE 60 ---\nDENTAL HYGIENE LEVEL IV Revision 01 Promulgated (01/11/2019) 56\n\nUNIT OF COMPETENCY:\nFOLLOW OCCUPATIONAL HEALTH AND SAFETY\nPOLICIES IN DENTAL LABORATORY FACILITIES\nUNIT CODE:"
        },
        "source_text": "HHC346201\nUNIT DESCRIPTOR:\nThis unit covers the knowledge, skills and attitudes required in\nmaintaining instruments and equipment in the work area.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Prepare to\nclean used\nitems\n\n1.1\nSafe work\npractices and\nstandard\nprecautions are\nfollowed at all times\nin accordance with\nlegislative and\nworkplace\nguidelines.\n1.2\nSharps and sharps\ndebris are disposed\ninto a container and\nin accordance with\nworkplace\nguidelines.\n1.3 Waste is\nsegregated and\ndisposed in\naccordance with\norganization and\nlegislative\nguidelines.\n1.1 Workflow\nprotocols in the\ninstrument\nreprocessing\narea\n1.2 Workplace\nprocedures for\nusing ultrasonic\ncleaner\n1.3 Workplace\nprocedures for\nmanual cleaning\n1.4 Instrument\nmaintenance\nchecklists\n1.1 Maintaining\nworkflow\nprotocols in\ninstrument\nreprocessing\narea from\ncontaminated\nto clean and\ndisinfect\n\n2. Clean and dry\nused items\n2.1\nWorkflow\nprotocols are\nmaintained in\ninstrument\nreprocessing area\nand in accordance\nwith workplace\nguidelines.\n2.2\nInstruments are\nprepared for\ncleaning and in\naccordance with\nworkplace\nguidelines.\n2.3\nAppropriate\n2.1 Workflow\nprotocols in the\ninstrument\nreprocessing\narea\n2.2 Workplace\nprocedures for\nusing ultrasonic\ncleaner\n2.3 Workplace\nprocedures for\nmanual cleaning\n2.4 Instrument\nmaintenance\nchecklists\n2.1 Following\nsafe work\npractices and\napplying\nstandard\nprecautions\nduring\ncleaning and\npreparation of\nitems:\n- Checking\nitems for\ndefects after\ncleaning\n\n--- PDF PAGE 55 ---\nDENTAL HYGIENE LEVEL IV Revision 01 Promulgated (01/11/2019) 51\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\ncleaning agents\nare selected and\nused in accordance\nwith workplace\nguidelines and\nmanufacturer’s\nspecification.\n2.4\nCleaning methods\nthat avoid the\ngeneration of\naerosols are used\nin accordance with\nworkplace\nguidelines.\n2.5\nInstruments are\ndried and inspected\nfor damage and\nremaining debris\nand in accordance\nwith workplace\nprocedures.\n2.6\n Cleaning process\nis monitored in\naccordance with\nworkplace\nguidelines.\nagents\n- Selecting\nand safely\nusing\nappropriate\ncleaning\nagents\n- Selecting\nand wearing\nappropriate\npersonal\nprotective\nequipment\n2.2 Maintaining\nworkflow\nprotocols in\ninstrument\nreprocessing\narea from\ncontaminate\nd to clean\nand disinfect\n2.3 Operating\nmechanical\ncleaners\nincluding\nultrasonic\ncleaner or\nsteamer\n2.4 Drying items\nbefore\npackaging\n3. Prepare and\npack items for\nstorage\n\n3.1 Instruments with\nhinges or ratchets\nare opened and\nunlocked in\naccordance with\nstandard operating\nprocedures.\n3.2\nInstrument trays are\nprepared in\naccordance with\n3.1 Workflow\nprotocols in the\ninstrument\nreprocessing\narea\n3.2 Workplace\nprocedures for\nusing ultrasonic\ncleaner\n3.3 Workplace\n3.1 Following\nsafe work\npractices\nand applying\nstandard\nprecautions\nduring\ncleaning and\npreparation\nof items:\n\n--- PDF PAGE 56 ---\nDENTAL HYGIENE LEVEL IV Revision 01 Promulgated (01/11/2019) 52\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\nworkplace\nprotocols.\n3.3\nCritical site\ninstruments are\npackaged or\nwrapped in a\nmanner that\nprevents damage to\ndelicate items.\nprocedures for\nmanual cleaning\n3.4 Instrument\nmaintenance\nchecklists\n- Checking\nitems for\ndefects after\ncleaning\nagents\n- Selecting\nand safely\nusing\nappropriate\ncleaning\nagents\n- Selecting\nand wearing\nappropriate\npersonal\nprotective\nequipment\n3.2 Maintaining\nworkflow\nprotocols in\ninstrument\nreprocessing\narea from\ncontaminate\nd to clean\nand disinfect\n3.3 Operating\nmechanical\ncleaners\nincluding\nultrasonic\ncleaner or\nsteamer\n3.4 Drying items\nbefore\npackaging\n\n--- PDF PAGE 57 ---\nDENTAL HYGIENE LEVEL IV Revision 01 Promulgated (01/11/2019) 53\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Safe work practices\n\nMay include but are not limited to:\n1.1\nTreatment of all items as a potential source of infection\n1.2\nPersonal hygiene practices especially washing and\ndrying hands\n1.3\nWork practices for the safe handling of sharps\n1.4\nWork practices for the safe disposal of sharps and other\nclinical waste\n1.5\nThe use of personal protective equipment:\n1.5.1 heavy duty gloves\n1.5.2 mask and protective eyewear\n1.5.3 hair protection or covering\n1.5.4 protective clothing and safety footwear\n1.6 Safe handling, storage and disposal of chemicals\n1.7 Safe handling techniques especially as they relate to\nlifting and handling dangerous and contaminated items\n2. Legislative and\nworkplace guidelines\nMay include:\n2.1 Infection control guidelines for the transmission of\ninfectious diseases in the health care setting\n2.2\nState legislative requirements\n2.3\nOrganization infection control policies and procedures\n2.4\nOccupational Health and Safety policies and procedures\n2.5\nMaterial Safety Data Sheets for the chemicals used\n3. Waste\nMay include but is not limited to:\n3.1\nClinical waste:\n3.1.1 discarded sharps\n3.1.2 human tissues\n3.1.3 laboratory waste\n3.1.4 any other waste as specified by the workplace\n3.2\nRelated waste:\n3.2.1 radiographic waste\n3.2.2 chemical waste\n3.2.3 metal alloy waste\n3.3\nGeneral waste\n4. Disposal of waste\nrequirements\nMay include:\n4.1\nDisposal in accordance with:\n4.1.1 Environment Protection Policy (Waste\nManagement)\n4.1.2 Environment Protection Regulations (Waste\nManagement)\n4.2\nOrganization policy\n5. Work flow protocols\nMay include:\n5.1\nSeparate hand washing facilities\n5.2\nSink suitable for disposal of liquid waste\n5.3\nOne direction flow of instruments from contaminated to\nclean to sterile\n\n--- PDF PAGE 58 ---\nDENTAL HYGIENE LEVEL IV Revision 01 Promulgated (01/11/2019) 54\nVARIABLE\nRANGE\n5.4\nDesignated work area that is physically separate to\nprevent possible contamination of processed items\n5.5\nIdentification and reporting of disruptions to work flow\nprotocols in accordance with workplace procedures\n6. Preparation of\ninstruments for\ncleaning\n\nMay include:\n6.1\nSorting according to type of instrument and\ncorresponding cleaning method\n6.2 Written procedures for handling specialized items\n6.3\nDisassembly of instruments where possible for detergent\nto reach all surfaces\n6.4 Checking for instrument defects, damage and missing\nparts\n\n7. Selection and use of\nappropriate cleaning\nagents\nMay include:\n7.1 Meeting requirements of Product Data Bulletins and\nMaterials Safety Data Sheets for the chemicals used\n8. Cleaning methods\nMay include:\n8.1 Initial treatment of used instruments close to their point\nof use to decrease bio burden\n8.2 Thermal washer/disinfector in accordance with current\nstandards\n8.3\nUltrasonic cleaner in accordance with current standards\n8.4\nManual cleaning\n\n9. Monitoring the\ncleaning process\nMay include:\n9.1 Visual inspection of all items for cleanliness and absence\nof detergent or rinse additive residues\n9.2 Daily cleaning and maintenance of ultrasonic cleaner\nand washer/disinfector\n9.3\nDaily performance testing of ultrasonic cleaner\n9.4\nDaily checks of washer/disinfector function and detergent\ndispenser\n10. Critical site\ninstruments\nMay include:\n10.1 Instruments which must be cleaned and disinfected as\nneeded\n11 Routine cleaning and\nchecking of\nsterilizers\nMay include but is not limited to:\n11.1 Daily checks:\n11.1.1 floor of sterilizer is free of debris\n11.1.2 chamber drain and filter are clear\n11.1.3 recording devices, gauges and timers are\nfunctioning correctly\n11.1.4 water reservoir (portable benchtop sterilizers)\nemptied, cleaned and refilled with distilled water\n11.1.5 door seals are intact\n11.2 Cleaning:\n11.2.1 loading tray and external surfaces cleaned daily\n\n--- PDF PAGE 59 ---\nDENTAL HYGIENE LEVEL IV Revision 01 Promulgated (01/11/2019) 55\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nFollowed safe handling, drying and cleaning protocols\n1.2\nFollowed correct packing, assembly and wrapping\nprocedures and storage\n1.3\nFollowed appropriate OH&S procedures\n\n2. Resource\nImplications\nThe following resources MUST be provided:\n2.1\nWorkplace: Real or simulated work area\n2.2\nAppropriate tools and equipment\n2.3\nAppropriate supplies and materials\n\n3. Method of\nassessment\nCompetency may be assessed through:\n3.1 Demonstration with questioning\n3.2 Written Test/Examination\n3.3 Third Party Report\n3.4 Portfolio\n\n4. Context of\nassessment\n4.1\nCompetency may be assessed in the workplace or in\na simulated work setting or environment.\n\n--- PDF PAGE 60 ---\nDENTAL HYGIENE LEVEL IV Revision 01 Promulgated (01/11/2019) 56\n\nUNIT OF COMPETENCY:\nFOLLOW OCCUPATIONAL HEALTH AND SAFETY\nPOLICIES IN DENTAL LABORATORY FACILITIES\nUNIT CODE:"
