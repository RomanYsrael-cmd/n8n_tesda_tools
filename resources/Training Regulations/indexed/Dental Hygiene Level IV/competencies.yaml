.1. Analysing record \ninformation \n4.2. Collecting and \ncollating information \n4.3. Communicating \neffectively \n4.4. Disseminating \ninformation \n4.5. Presenting \ninformation \n4.6. Using management \ninformation systems \nto store and retrieve \ndata\n\n--- PDF PAGE 32 ---\nDENTAL HYGIENE LEVEL IV                     Revision 01                     Promulgated (01/11/2019)        28 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Information \nMay include: \n1.1 Routine and complex reports and submissions \n1.2 Briefing notes \n1.3 Ministerial \n1.4 Proposals \n1.5 Project plans \n1.6 Articles and promotional material \n \n2. Collection \ntechniques or \nmethods \n2.1 Collection techniques may include: \n2.1.1 Research \n2.1.2 Surveys \n2.1.3 Literature search \n2.1.4 Interviews \n2.1.5 Data bases \n2.1.6 Observation \n2.2 Collection methods may include: \n2.2.1 Indexing \n2.2.2 linking \n2.2.3 Sorting \n2.2.4 Comparing \n2.2.5 Categorizing \n2.2.6 Integrating \n \n3. Analysis  \nMay include: \n3.1. application of statistical methods \n3.2. mathematical calculations \n3.3. critical analysis \n3.4. problem solving \n4. Management \ninformation \nsystems  \nMay include: \n4.1. Computers \n4.2. Communication channels \n4.3. Records management \n4.4. Procedures \n4.5. Manuals \n4.6. Protocol \n4.7. Legislation \n4.8. Guidelines and awards \n4.9. Organizational \n4.10. Legal and policy materials\n\n--- PDF PAGE 33 ---\nDENTAL HYGIENE LEVEL IV                     Revision 01                     Promulgated (01/11/2019)        29 \nEVIDENCE GUIDE \n \n1 Critical aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 \nIdentified information needs and sources  \n1.2 \nCollected and analyzed information  \n1.3 \nDetermined the correct / preventive action \n1.4 \nUsed management information systems \n1.5 \nRecord and support information \n \nThese aspects may be best assessed using a range of \nscenarios what ifs as a stimulus with a walk through forming \npart of the response. These assessment activities should \ninclude a range of problems, including new, unusual and \nimprobable situations that may have happened. \n2 Resource \nImplications \nSpecific resources for assessment \n2.1 \nEvidence of competent performance should be obtained \nby observing an individual in an information management \nrole within the workplace or operational or simulated \nenvironment. \n3 Methods of \nAssessment \nCompetency in this unit may be assessed through: \n3.1 \nWritten Test \n3.2 \nInterview \n \nThe unit will be assessed in a holistic manner as is practical \nand may be integrated with the assessment of other relevant \nunits of competency. Assessment will occur over a range of \nsituations, which will include disruptions to normal, smooth \noperation. Simulation may be required to allow for timely \nassessment of parts of this unit of competency. Simulation \nshould be based on the actual workplace and will include walk \nthrough of the relevant competency components.  \n4 Context for \nAssessment \n4.1 \nIn all workplace, it may be appropriate to assess this unit \nconcurrently with relevant teamwork or operation units.\n",
