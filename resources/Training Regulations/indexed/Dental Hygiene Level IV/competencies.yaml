in \naccordance with \nOH&S policies and \nprocedures \n4.3 Quality assurance \nprocesses for the use \nof radiographic \nchemicals are \nfollowed in \naccordance with \nmanufacturer’s \nspecifications \n4.4 Appropriate \nconditions for manual \n4.1 Code of \npractice for \nradiation \nprotection in \ndentistry \n4.2 Production, \nproperties and \ninteraction of \nthe x-rays \n4.3 Biological \neffects and \nrisks \nassociated with \nx-rays \n4.4 Units of \nradiation \nmeasurements \n4.5 Radiographic \nappearance of \nanatomic \nlandmarks, \nnormal \ndentition and \nassociated \n4.1 Using safe \nwork practices \nto minimize \nthe risk of \ntransmission \nof infection \n4.2 Using correct \naccessories in \ndental \nradiographic \ntechniques \n4.3 Minimizing \ntechnical \ninaccuracies in \ndental \nradiographic \nimages \n4.4 Minimizing \nerrors and \nmaintaining \nquality \nassurance in \nprocessing \nprocedures\n\n--- PDF PAGE 110 ---\nDENTAL HYGIENE LEVEL IV                     Revision 01                     Promulgated (01/11/2019)        106 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are elaborated in \nthe Range of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \nand automatic \nprocessing are \nmaintained in \naccordance with \nmanufacturer’s \nspecifications \n4.5 A range of \nprocessing errors \nare identified and \ncorrective measures \nare implemented to \nproduce a diagnostic \nradiograph \nbony structures \n4.6 Reasons for \nprocessing and \ntechnique \ninaccuracies \nand methods to \nminimize errors \n4.5 Applying \ncorrect dental \nterminology \n4.6 Selecting \nappropriate \nfilm variables \n4.7 Selecting and \nusing correct \ntechniques\n\n--- PDF PAGE 111 ---\nDENTAL HYGIENE LEVEL IV                     Revision 01                     Promulgated (01/11/2019)        107 \nRANGE OF VARIABLES \n \n \nVARIABLE \n \nRANGE \n1 X-ray properties \n \nMay include: \n1.1  The intensity of the diagnostic x-ray beam \n1.2  The quality of the diagnostic x-ray beam \n2 Safe work \npractices \n \nMay include: \n2.1 Current code of practice for radiation protection in dentistry \n2.2 Legislative requirements \n2.3 Dental practice/organization policies and procedures \n2.4 DOH Guidelines for Operation of Radiographic Equipment \n3 Units of radiation \nmeasurement \n \nMay include: \n3.1 Radiation absorbed dose \n3.2 Equivalent dose \n3.3 Effective dose \n3.4 Collective affective dose \n3.5 Dose rate \n4 Radiation safety \nmeasures for the \nclient, operator \nand others \n \n \n4.1 Radiation safety measures for client includes but are not \nlimited to: \n- \nUse of lead apron \n- \nAppropriate technique \n- \nFilm selection \n- \nTechnical features of the radiographic unit as determined \nby manufacturer specifications including kilovoltage, \nfiltration, x-ray beam collimation \n- \nUse of film locating devices \n- \nCorrect processing procedures to minimize retakes \n- \nLegislative requirements and code of practice \n4.2 Radiation safety measures for the operator and others \nincludes but is not limited to: \n- \nMaximum permissible dose (MPD) of radiation \n- \nDetermination of pregnancy \n- \nDistance from primary beam \n- \nUse of lead line barriers \n- \nMaintenance of radiographic equipment \n- \nLegislative requirements \n5 Geometric \ncharacteristics of \nthe image \nMay include: \n5.1 Blurred image due to motion of patient \n5.2 Distortion due to incorrect technique \n6 Quality assurance \nfor processing \nMay include but are not limited to: \n6.1   Image quality assessment \n6.2   X-ray equipment and appropriate maintenance \n6.3   Darkroom and image receptors including x-ray film an \ncassettes \n6.4   Processing \n6.5   Working procedures\n\n--- PDF PAGE 112 ---\nDENTAL HYGIENE LEVEL IV                     Revision 01                     Promulgated (01/11/2019)        108 \n \nVARIABLE \n \nRANGE \n7 Processing errors \nMay include: \n7.1   Film is too dark \n7.2   Film that is too light \n7.3   Film with inadequate or low contrast \n7.4   Film that is marked\n\n--- PDF PAGE 113 ---\nDENTAL HYGIENE LEVEL IV                     Revision 01                     Promulgated (01/11/2019)        109 \nEVIDENCE GUIDE \n \n1 Critical Aspects \nof Competency \n \nAssessment requires evidence that the candidate: \n1.1 Applied knowledge of ionizing radiation to produce a dental \nradiograph \n1.2 Applied knowledge of radiation biology to protect patients, \noperator and others from ionizing radiation \n1.3 Determined image characteristics of a dental radiographic \nimage to minimize re-takes \n1.4 Minimized radiation by maintaining quality in processing \n1.5 Demonstrated consistent compliance with infection control \nguidelines and legislative requirements \n1.6 Demonstrated consistent performance over the required \nrange of workplace situations including: \n- \ncorrect preparation of clients for dental radiographic \nimaging procedures \n- \napplication of radiation occupational health and safety \npolicies and procedures to minimize the risk of radiation \nto the patient, operator and others during the exposure of \na prescribed dental radiographic image \n- \nimplementation of quality assurance measures to ensure \nproduction of radiographs to consistent diagnostic \nstandard \n2 Resource \nImplications \n \nThe following resources should be provided: \n2.1 A real or simulated dental clinic environment \n2.2 Access to dental radiographic imaging units and resources \nnormally used in the workplace \n2.3 Relevant dental practice/organization policy and procedures \nmanuals such as: \n- \nincident reporting procedures \n- \ninfection control guidelines \n- \nOH&S policies and procedures \n2.4 Relevant national/local legislation \n2.5 Manufacturer’s specifications for dental radiographic units \n2.6 Radiographic viewing equipment \n2.7 A qualified workplace assessor \n \n3 Methods of \nAssessment \n \nCompetency may be assessed through: \n3.1 Demonstration with oral questioning \n3.2 Oral interview  \n3.3 Third party report \n3.4 Portfolio (authenticated evidence of relevant work \nexperience and/or formal/informal learnings \n4 Context of \nAssessment \n \n4.1 Assessment may be conducted in the workplace or in a \nsimulated environment\n",
