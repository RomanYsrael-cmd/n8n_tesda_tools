        "source_text": "--- PDF PAGE 50 ---\nDENTAL HYGIENE LEVEL IV                     Revision 01                     Promulgated (01/11/2019)        46 \n \nUNIT OF COMPETENCY: \nMANAGE OWN PERFORMANCE \nUNIT CODE:                     \nHHC516202 \nUNIT DESCRIPTOR: \nThis unit of competency covers the knowledge, skills and \nattitudes in effectively managing own workload and quality \nwork. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are elaborated in \nthe Range of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Plan for \ncompletion of \nown workload \n1.1 \nTasks accurately \nidentified.  \n1.2 \nPriority allocated to \neach task. \n1.3 \nTime lines allocated \nto each task or \nseries of tasks. \n1.4 \nTasks deadlines \nknown and \ncomplied with \nwhenever possible. \n1.5 \nWork schedules are \nknown and \ncompleted with \nagreed time frames. \n1.6 \nWork plans \ndeveloped \naccording to \nassignment \nrequirements and \nemployer policy. \n1.7 \nUncompleted work \nor tasks detailed \nand responsibility \nfor completion \npassed to incoming \nshift or other \nappropriate \npersons. \n1.1 Site and \nassignment \nrequirements \n1.2 Employer policy \non performance \nmanagement \n \n \n1.1 Ability to plan \nand prioritize \nworkloads \nand \nrequirements \n1.2 Implement \nwork plans \naccording to \nemployer \npolicy \n1.3 Time and task \nmanagement \n2. Maintain \nquality of \nperformance \n2.1 \nPersonal \nperformance \ncontinually \nmonitored against \nagreed \nperformance \n2.1 Indicators of \nappropriate \nperformance for \neach area of \nresponsibility \n2.2 Steps for \n2.1 Ability to \nobserve and \nrecord \nperformance-\nrelated \nconcerns and\n\n--- PDF PAGE 51 ---\nDENTAL HYGIENE LEVEL IV                     Revision 01                     Promulgated (01/11/2019)        47 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are elaborated in \nthe Range of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \nstandards. \n2.2 \nAdvice and \nguidance sought \nwhen necessary to \nachieve or maintain \nagreed standards. \n2.3 \nGuidance from \nmanagement \napplied to achieve \nor maintain agreed \nstandards. \n2.4 \nStandard of work \nclarified and agreed \naccording employer \npolicy and \nprocedures. \nimproving or \nmaintaining \nperformance \n \ninformation \n2.2 Time and task \nmanagement \n \n3. Build credibility \nwith \ncustomers/ \nclients \n3.1 \nClient expectations \nfor reliability, \npunctuality and \nappearance \nadhered to. \n3.2 \nPossible causes of \nclient/customer \ndissatisfaction \nidentified, dealt \nwith, recorded and \nin accordance with \nemployer policy. \n3.3 \nClient fully informed \nof all relevant \nmatters in a timely \nmanner. \n \n3.1 Indicators of \nappropriate \nperformance to \nbuild credibility \n3.2 Steps in \nproviding \ninformation and \nrelevant security \nmatters \n3.1 Time and \ntask \nmanagement  \n3.2 Self-\nevaluation \nand \nmonitoring \nskills  \n[additional] \n3.3 Time and \ntask \nmanagement\n\n--- PDF PAGE 52 ---\nDENTAL HYGIENE LEVEL IV                     Revision 01                     Promulgated (01/11/2019)        48 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Tasks \n1.1 \nMay be identified through: \n1.1.1   Assignment Instructions \n1.1.2 Verbal Instructions by Senior Staff \n1.1.3 Policy Documents \n1.1.4 Duty Statements \n1.1.5 Self Assessment \n1.2 \nMay be: \n1.2.1 Daily tasks \n1.2.2 Weekly tasks \n1.2.3 Regularly or irregularly occurring tasks \n \n2. Performance \nStandards  \nMay include: \n2.1 \nAssignment Instructions \n2.2 \nProcedures established in policy documents\n\n--- PDF PAGE 53 ---\nDENTAL HYGIENE LEVEL IV                     Revision 01                     Promulgated (01/11/2019)        49 \nEVIDENCE GUIDE \n \n1. Critical Aspects of   \nCompetency \nAssessment requires evidence that the candidate: \n1.1 \nPlanned for completion of own workload \n1.2 \nAssessed verbal or written work plan through observation \nand discussion of site and employer requirements \n1.3 \nDemonstrated capacity to complete task within specified \ntime frame \n1.4 \nMaintained quality of own performance  \n2. Resource \nImplications \nThe following resources MUST be provided: \n2.1 Assessment Centers/Venues \n2.2 Accredited Assessors \n2.3 Modes of Assessment \n2.4 Evaluation Reports \n2.5 Access to relevant venue, equipment and materials \n2.6 Assignment Instructions \n2.7 Logbooks \n2.8 Operational manuals and makers’/customers’ instructions \n2.9 Assessment Instruments, including personal planner and \nassessment record book \n3. Methods of \nAssessment \nCompetency in this unit may be assessed through: \n3.1 Written Test \n3.2 Demonstration with questioning \n3.3 Observation with questioning \n3.4 Oral questioning/Interview \n4. Context of \nAssessment \n4.1 \nCompetency maybe assessed in actual workplace or at \nthe designated TESDA Accredited Assessment Center.\n",
