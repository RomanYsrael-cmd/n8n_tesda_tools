        "evidence_guide": {
          "source_text": "1 Critical Aspects\nof Competency\n\nAssessment requires evidence that the candidate:\n1.1 Applied knowledge of ionizing radiation to produce a dental\nradiograph\n1.2 Applied knowledge of radiation biology to protect patients,\noperator and others from ionizing radiation\n1.3 Determined image characteristics of a dental radiographic\nimage to minimize re-takes\n1.4 Minimized radiation by maintaining quality in processing\n1.5 Demonstrated consistent compliance with infection control\nguidelines and legislative requirements\n1.6 Demonstrated consistent performance over the required\nrange of workplace situations including:\n-\ncorrect preparation of clients for dental radiographic\nimaging procedures\n-\napplication of radiation occupational health and safety\npolicies and procedures to minimize the risk of radiation\nto the patient, operator and others during the exposure of\na prescribed dental radiographic image\n-\nimplementation of quality assurance measures to ensure\nproduction of radiographs to consistent diagnostic\nstandard\n2 Resource\nImplications\n\nThe following resources should be provided:\n2.1 A real or simulated dental clinic environment\n2.2 Access to dental radiographic imaging units and resources\nnormally used in the workplace\n2.3 Relevant dental practice/organization policy and procedures\nmanuals such as:\n-\nincident reporting procedures\n-\ninfection control guidelines\n-\nOH&S policies and procedures\n2.4 Relevant national/local legislation\n2.5 Manufacturer’s specifications for dental radiographic units\n2.6 Radiographic viewing equipment\n2.7 A qualified workplace assessor\n\n3 Methods of\nAssessment\n\nCompetency may be assessed through:\n3.1 Demonstration with oral questioning\n3.2 Oral interview\n3.3 Third party report\n3.4 Portfolio (authenticated evidence of relevant work\nexperience and/or formal/informal learnings\n4 Context of\nAssessment\n\n4.1 Assessment may be conducted in the workplace or in a\nsimulated environment\n\n--- PDF PAGE 114 ---\nDENTAL HYGIENE LEVEL IV Revision 01 Promulgated (01/11/2019) 110\n\nUNIT OF COMPETENCY:\nPERFORM SCALING AND POLISHING\nUNIT CODE:"
        },
        "source_text": "HHC325304\nUNIT DESCRIPTOR\nThis unit covers the knowledge, skills and attitudes required to\nminimize the risk of radiation to the client, the operator and\nothers during the exposure of a prescribed dental radiographic\nimage. It also describes the quality assurance measures\nnecessary to ensure all radiographs are of consistent diagnostic\nstandard.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Apply\nknowledge of\nionizing\nradiation to\nproduce a\ndental\nradiograph\n\n1.1 Knowledge of X-ray\nproperties is\ndemonstrated in\naccordance with\noccupational health\nand safety policies\nand procedures in\nminimizing radiation\nrisks.\n1.2 Technical variables of\ndental X-ray\ngenerating equipment\nare identified and\nselected in\naccordance with\nmanufacturer’s\nspecifications and\nclient requirements\n1.3 The main\ncomponents of\ntubehead are\nidentified\n1.4 Appropriate\ntechnique for the type\nof cone is identified\nand selected\n1.1 Code of\npractice for\nradiation\nprotection in\ndentistry\n1.2 Production,\nproperties and\ninteraction of\nthe x-rays\n1.3 Biological\neffects and\nrisks\nassociated with\nx-rays\n1.4 Units of\nradiation\nmeasurements\n1.5 Radiographic\nappearance of\nanatomic\nlandmarks,\nnormal\ndentition and\nassociated\nbony structures\n1.6 Reasons for\nprocessing and\ntechnique\ninaccuracies\nand methods to\nminimize errors\n1.1 Using safe\nwork practices\nto minimize\nthe risk of\ntransmission\nof infection\n1.2 Using correct\naccessories in\ndental\nradiographic\ntechniques\n1.3 Minimizing\ntechnical\ninaccuracies in\ndental\nradiographic\nimages\n1.4 Minimizing\nerrors and\nmaintaining\nquality\nassurance in\nprocessing\nprocedures\n1.5 Applying\ncorrect dental\nterminology\n1.6 Selecting\nappropriate\nfilm variables\n1.7 Selecting and\nusing correct\ntechniques\n\n--- PDF PAGE 108 ---\nDENTAL HYGIENE LEVEL IV Revision 01 Promu