        "source_text": "--- PDF PAGE 120 ---\nDENTAL HYGIENE LEVEL IV                     Revision 01                     Promulgated (01/11/2019)        116 \n \nUNIT OF COMPETENCY \nMAINTAIN DENTAL RECORDS AND RESOURCES \n \nUNIT CODE \n \nHHC325306 \n \nUNIT DESCRIPTOR \n \nThis unit covers the knowledge, skills and attitudes required \nto maintain patients/clients dental records and resources. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are elaborated in \nthe Range of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Maintain \npatient’s \nrecords \n1.1  Patient’s/client’s vital \nsigns are measured \nand recorded in \naccordance with \nclinic procedures. \n1.2  Patient’s/client’s \nchief complaint are \nprobed and recorded \nin accordance with \nclinic procedures. \n1.3  Where applicable \npatient/client is \nrescheduled for \nanother appointment \nto dental specialist or \nmedical specialist. \n1.4  Returning \npatient’s/client’s \nrecord/dental history \nis retrieved and \nreferred to where \nappropriate. \n1.5  Patient’s/client’s \ndental history/record \nis updated based on \nhygienist or dentist’s \nfindings. \n1.1 Patient’s \nRecords \n1.2 Vital Signs \n1.3 Clinic \nProcedures \n1.4 Relevant \nstandards, policy \nand procedures \non dental \nhygiene practices \n1.5 Relevant \nstatutory and \nlegal \nrequirements \n1.6 Dental Ethics \nand \nJurisprudence \n1.7 Occupational \nSafety and \nHealth \n1.1 Interpersonal \n1.2 Skills \n1.3 Monitoring \npatient’s \nrecords \n1.4 Recording \nand reporting \nskills \n2. Maintain \nfinancial \nrecords of the \nclinic \n2.1  Payments are \nreceived and \nrecorded in \naccordance with \naccounting \nprocedures \n2.2  Billings and other \nrelated \ncommunications are \nprepared and sent to \n2.1 Financial \nRecords \n2.2 Payments \n2.3 Accounting \nProcedures \n2.4 Billings and \nOther Related \nCommunications \n2.1 Interpersonal \n2.2 Skills \n2.3 Maintaining \npatient’s \nfinancial \nrecords \n2.4 Recording \nand \nReporting \nSkills\n\n--- PDF PAGE 121 ---\nDENTAL HYGIENE LEVEL IV                     Revision 01                     Promulgated (01/11/2019)        117 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are elaborated in \nthe Range of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \nhealth insurance and \nother companies \n2.3  Payments of \npatient’s/clients are \nmonitored \n3.  Purchase \ndental \nproducts \n3.1  Stocks are \ninventoried/monitored for \nreplenishment \n3.2  Dental equipment \nand materials are \nprocured in \naccordance with \nestablished \nprocedures \n3.3  Purchased dental \nequipment and \nmaterials are \ninspected /tested and \nreturned to suppliers \nwhere necessary \n3.4  Dental materials and \nequipment are \ndocumented and \nstored/safekept in \nappropriate \narea/location  \n3.1 Dental Products \n3.2 Stocks Inventory \n3.3 Dental \nEquipment and \nMaterials \n3.4 Workplace \nProcedures \n3.5 Documentation \nProcedures \n3.6 Storing \nProcedures \n3.7 Dental Clinic \nMaintenance and \nProcurement \nProgram \n3.1 Interpersonal \n3.2 Skills \n3.3 Monitoring \ndental \nproducts \n3.4 Recording \nand \nReporting \nSkills \n4. Monitor quality \ncontrol \n4.1  Service quality \nstandards is \nestablished according \nto legal \nrequirements, \npatient’s/client’s \nrequirements and \ndental policy \n4.2  Quality of service is \nmonitored and \nensured during \ndelivery processes \n4.3  Client feedbacks are \nsolicited, recorded \nand analyzed in \naccordance with \nquality requirements \n4.1 Quality Control \n4.2 Legal \nRequirements \n4.3 Patient’s \nRequirements \n4.4 Dental Policy \n4.1 Interpersonal \n4.2 Skills \n4.3 Monitoring \ndental \nproducts \n4.4 Recording \nand \nReporting \nSkills\n\n--- PDF PAGE 122 ---\nDENTAL HYGIENE LEVEL IV                     Revision 01                     Promulgated (01/11/2019)        118 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are elaborated in \nthe Range of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n5. Comply with \ndental ethics \nand \njurisprudence \n5.1  Key elements of \nmajor legal systems \naffecting business to \ndental clinic \noperations are \nexamined to ensure \nfull compliance under \nlegal and legislative \nprovisions \n5.2  Various issues \naffecting different \nforms of contract \nare compared within \nbusiness operations  \n5.3 Statutory and legal \nrequirements for the \ndelivery of dental \nservices are \ndetermined across \nthe industry    \n5.4 Dental products are \nhandled and stored \naccording to \nstandards, policies \nand procedures, and \nsafety practices \n5.5  Compliance with \nstandards on current \ndental services, \nmaterials and \nequipment are \nmonitored in \naccordance with \nstatutory and legal \nrequirements  \n5.1 Dental Ethics \nand \nJurisprudence \n5.2 Legal Systems \n5.3 Legal and \nLegislative \nProvisions \n5.4 Different Forms \nof Contract \n5.5 Statutory and \nLegal \nRequirements \n5.6 Dental Products \n5.7 Storing \nProcedures \n5.8 Dental Services, \nMaterials and \nEquipment \n5.1 Interpersonal \n5.2 Skills \n5.3 Monitoring \npatient’s \nrecords \n5.4 Recording \nand reporting \nskills \n5.5 Complying \nwith dental \nethics and \njurisprudence\n\n--- PDF PAGE 123 ---\nDENTAL HYGIENE LEVEL IV                     Revision 01                     Promulgated (01/11/2019)        119 \nRANGE OF VARIABLES \n \n \nVARIABLE \n \nRANGE \n1.  Vital signs \nMay include: \n1.1 Blood Pressure \n1.2 Heart Rate \n1.3 Pulse Rate \n2.  Findings \nMay include: \n2.1 Poor oral hygiene \n2.2 Halitosis \n2.3  Dental Caries \n2.4  Gingivitis \n2.5  Periodontitis \n2.6  Abrasion, Attrition, Erosion \n2.7  Heavy Stains \n3.  Payments \nMay include: \n3.1  Cash \n3.2  Installment \n3.3  Post dated cheques \n3.4  Health insurance claims \n4.  Billings and other \nrelated \ncommunications \nMay include: \n4.1  Client billings \n4.2  Health card billings \n4.3  Follow-up/Demand letter \n5.  Legal requirements \nMay include: \n5.1 Types of products and services provided \n5.2 Size, type and location of business \n5.3 Characteristics of specific products or services \n5.4 Worksite-specific context, variations and  \nenvironments \n6.  Legal systems \nMay include: \n4.2 Workplace relations \n4.3 Industry codes and practices \n4.4 License, patent or copyright arrangements \n \n7.  Legal and legislative \nprovisions \nMay include: \n7.1   Dental Law \n7.2 Occupational Health and Safety (OHS) \n7.3 Workplace relations \n7.4 Workers’ compensations \n7.5 Equal employment opportunity (EEO) \n7.6 Environmental protection legislation \n8.  Different forms of \ncontract \nMay include: \n8.1  Letters of appointments or intent \n8.2 Memorandum of agreement \n8.2.1 External contracts \n8.2.2 Written contracts \n8.3 Terms of payment agreement\n\n--- PDF PAGE 124 ---\nDENTAL HYGIENE LEVEL IV                     Revision 01                     Promulgated (01/11/2019)        120 \n \nVARIABLE \n \nRANGE \n8.4 Purchase order \n8.5 Petty cash \n9.  Satutory and legal \nrequirements \nMay include: \n9.1 Equal Employment Opportunity (EEO) \n9.2  Disciplinary procedures \n9.3  Awards and agreements \n9.4  Wages and conditions \n9.5  OHS \n9.6  Anti-discrimination \n9.7  Company policies and procedures\n\n--- PDF PAGE 125 ---\nDENTAL HYGIENE LEVEL IV                     Revision 01                     Promulgated (01/11/2019)        121 \nEvidence Guide \n \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 Maintained patient’s records \n1.2 Maintained financial records of the clinic \n1.3 Purchased dental products \n1.4 Monitored quality control \n1.5 Complied with dental ethics and jurisprudence in accordance \nwith legal and legislative provisions \n1.6 Demonstrated knowledge on dental law, and other relevant \nlegal and statutory requirements \n2. Resource \nImplications \nThe following resources should be provided: \n2.1Workplace: Real or simulated work area \n2.2 Appropriate tools and equipment \n2.3 Appropriate personnel, supplies and materials     \n3.  Method of \nassessment \nCompetency may be assessed through: \n3.1Demonstration with questioning \n3.2Written Test/Examination \n3.3Third Party Report \n3.4Portfolio   \n4. Context of \nassessment \n4.1 Competency may be assessed in the workplace or in a \nsimulated work setting or environment.\n",
