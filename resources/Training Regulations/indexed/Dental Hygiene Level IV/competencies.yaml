vance and accuracy;\nidentify and elaborate\non learning outcomes\n1.7 Facilitation skills to\nconduct small group\ntraining sessions\n\n--- PDF PAGE 13 ---\nDENTAL HYGIENE LEVEL IV Revision 01 Promulgated (01/11/2019) 9\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n2. Foster\nindividual and\nteam growth\n2.1. Learning and\ndevelopment program\ngoals and objectives\nare identified to match\nthe specific\nknowledge and skills\nrequirements of\ncompetency\nstandards\n2.2. Learning delivery\nmethods are\nappropriate to the\nlearning goals, the\nlearning style of\nparticipants and\navailability of\nequipment and\nresources\n2.3. Workplace learning\nopportunities and\ncoaching/ mentoring\nassistance are\nprovided to facilitate\nindividual and team\nachievement of\ncompetencies\n2.4. Resources and\ntimelines required for\nlearning activities are\nidentified and\napproved in\naccordance with\norganizational\nrequirements\n2.1 Advanced\ncoaching and\nmentoring\ntechniques\n2.2 Performance\nevaluation\nconcepts\n2.3 Training and\ndevelopment\ntechniques\n\n2.1 Instructional\nplanning and\ndelivery skills\n2.2 Monitoring and\nevaluation skills\n2.3 Mentoring and\ncoaching skills\n\n--- PDF PAGE 14 ---\nDENTAL HYGIENE LEVEL IV Revision 01 Promulgated (01/11/2019) 10\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n3. Monitor and\nevaluate\nworkplace\nlearning\n3.1 Feedback from\nindividuals or teams is\nused to identify and\nimplement\nimprovements in\nfuture learning\narrangements\n3.2 Outcomes and\nperformance of\nindividuals/teams are\nassessed and\nrecorded to determine\nthe effectiveness of\ndevelopment\nprograms and the\nextent of additional\nsupport\n3.3 Modifications to\nlearning plans are\nnegotiated to improve\nthe efficiency and\neffectiveness of\nlearning\n3.4 Records and reports of\