        "evidence_guide": {
          "source_text": "1. Critical Aspects of\nCompetency\n\nAssessment requires evidence that the candidate:\n1.1 Positioned patient for dental diagnosis\n1.2 Performed tooth scaling and polishing\n1.3 Provided oral-health advice to patient\n1.4 Demonstrated consistent compliance with infection\ncontrol guidelines and legislative requirements\n\n2. Resource implications\n\nThe following resources should be provided:\n2.1 A real or simulated dental clinic environment\n2.2 Relevant documentation such as:\n2.2.1Industry codes of practice\n 2.2.2National and local legislation as appropriate\n2.3 A qualified workplace assessor\n3 Method of assessment\n\nCompetency may be assessed through:\n3.1 Demonstration with oral questioning\n3.2 Written test\n3.3Interview\n3.4Portfolio\n\n4 Context of assessment\n\n4.1 Assessment may be conducted in the workplace or in a\nsimulated environment\n\n--- PDF PAGE 120 ---\nDENTAL HYGIENE LEVEL IV Revision 01 Promulgated (01/11/2019) 116\n\nUNIT OF COMPETENCY\nMAINTAIN DENTAL RECORDS AND RESOURCES\n\nUNIT CODE"
        },
        "source_text": "HHC325305\nUNIT DESCRIPTOR:\nThis unit covers the knowledge, skills and attitudes require\nto perform dental cleaning of teeth through scaling,\npolishing, and fluoride application.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Perform dental\ncharting on\npatient\n\n1.1 Dental\ncharting\nis\nperformed on patient\nto determine the type\nof treatment to be\ndone.\n1.2 Precautions\nare\nundertaken based on\npatient’s\noral\nand\nmedical condition.\n1.3 Patient and operator\nare\npositioned\nin\naccordance with the\ndental\ncleaning\nprocedures.\n1.1 Dental\nCharting\n1.2 Precaution\ns\n1.3 Dental\n1.4 Cleaning\nProcedures\n1.1 Manual\nDexterity\n1.2 Maintaining a\nhealthy and\nsafe\nenvironment\n1.3 Maintaining\npersonal\nhygiene\n1.4 Language,\nliteracy and\nnumeracy skills\nappropriate to\nthe role and\nworkplace\nrequirements\n1.5 Operational\nskills to\nconsistently\nuse time\neffectively and\nprovide quality\ncustomer\nservice in the\ndental\nenvironment\n1.6 Computer Skills\n2. Scale and\npolish teeth\n\n2.1 Dental cleaning\ninstrument and\ndevices are\nidentified and\nprepared in\naccordance with\npatient requirements\n2.2 Dental cleaning\ninstrument is set,\noperated and\nadjusted in\n2.1 Oral\nAnatomy\n2.2 Oral\nPhysiology\n2.3 Anatomy\nand\nPhysiology\n2.4 Infection\nControl\nProcedures\n2.5 Dental\n2.1 Manual\nDexterity\n2.2 Maintaining a\nhealthy and\nsafe\nenvironment\n2.3 Maintaining\npersonal\nhygiene\n2.4 Language,\nliteracy and\n\n--- PDF PAGE 115 ---\nDENTAL HYGIENE LEVEL IV Revision 01 Promulgated (01/11/2019) 111\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\naccordance with\nmanufacturer’s\nspecifications and\npatient’s\nconvenience/comfort.\n2.3 Deposits are\nremoved from the\nsurface of the tooth\nin accordance with\ndental established\nprocedures\n2.4 Devices or finer hand\ntools are used to\nremove smaller\ndeposits and\nsmoothen the tooth\nsurface\n2.5 Moderate amount of\npressure is applied in\nremoving supra and\nsubgingival calcular\ndeposits.\n2.6 Scaled teeth are\npolished.\n2.7 Appropriate dental\nmaterial may be\napplied accordingly.\n2.8 Unexpected events\nare responded to in\naccordance with\nexisting medical\npractices\nMaterials\n2.6 Dental\nCleaning\nInstrument\nand Devices\n2.7 Periodontol\nogy\n2.8 Restorative\nDentistry\n2.9 Pathology\n2.10 Dental\nAnesthesia\n2.11 Pharmacolo\ngy\n2.12 Dental\nJurispruden\nce and\nEthics\n2.13 Basic\nComputer\n2.14 Nutrition\nnumeracy skills\nappropriate to\nthe role and\nworkplace\nrequirements\n2.5 Operational\nskills to\nconsistently\nuse time\neffectively and\nprovide quality\ncustomer\nservice in the\ndental\nenvironment\n2.6 Computer Skills\n3\nMotivate\nthe\npatient\n3.1 Findings are\ndiscussed with\npatient in layman’s\nterms\n3.2 Where necessary,\nfollow-up\nappointment is\nscheduled in the next\n2 weeks to check on\nthe improvement\n3.3 Routine examination\nof the teeth is\nrecommended for at\n3.1 Workplace\nPolicies and\nProcedures\n3.2 Patient\nMotivation\n3.3 Proper\nHome-Care\nand Dental\nRecall\n3.4 Dental\nJurisprudenc\ne and Ethics\n3.5 Basic\n3.1 Interpersonal\nSkills\n3.2 Computer Skills\n\n--- PDF PAGE 116 ---\nDENTAL HYGIENE LEVEL IV Revision 01 Promulgated (01/11/2019) 112\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\nleast every six\nmonths or depending\non the needs of the\npatient\n3.4 Patient is advised on\nproper home-care\nand dental recall\nbased on results of\noral examination and\ndental diagnosis\n3.5 Where necessary,\npatient is referred to\ndentist or other\nmedical\nprofessionals for\nappropriate/further\ntreatment\nComputer\n\n--- PDF PAGE 117 ---\nDENTAL HYGIENE LEVEL IV Revision 01 Promulgated (01/11/2019) 113\nRANGE OF VARIABLES\n\nVARIABLE\n\nRANGE\n1. Precautions\nMay include:\n1.1 Patients with heart-valve disease must take antibiotics\nto prevent bacteria to spread into the blood stream that\ncould cause endocarditis\n1.2 Patients with history or possibility of hypertension\nshould have their blood pressure monitored.\n1.3 Patients with relevant allergies\n1.4 Patients with medication such as blood thinners\n1.5 Patients with HIV or other contagious diseases\n1.6 Patients with mental disorders\n1.7 Patients\nwith\nartificial\nprosthetic\ndevices\nand\ntransplants\n1.8 Patients who have a history of taking biphosponates\n2. Dental cleaning\ninstrument and devices\n\nMay include:\n2.1 Ultrasonic machine\n2.2 Scalers and curettes\n2.3 Micromotor\n2.4 Prophylactic Brush\n2.5 Rubber Cup\n2.6 Mouth Mirror\n2.7 Cotton Pliers\n2.8 Explorer\n2.9 Periodontal probe\n3. Deposits\nMay include:\n3.1 Plaque\n3.2 Calculus\n3.3 Stains\n\n4. Dental material\n\nMay include:\n4.1 Prophylaxis paste\n4.2 Sealant\n4.3 Fluoride gel\n4.4 Fluoride tray\n4.5 Topical anesthesia\n4.6 Composite material\n\n5. Unexpected events\nMay include:\n5.1 Fainting/Syncope\n5.2 Hemorrhage or bleeding\n5.3 Hypertension/stroke\n5.4 Dislocation of TMJ (Temporo-Mandibular Joint)\n5.5 Accidental blocking of air passage\n\n--- PDF PAGE 118 ---\nDENTAL HYGIENE LEVEL IV Revision 01 Promulgated (01/11/2019) 114\n\n6. Response\nMay include:\n6.1 Stop procedures\n6.2 First aid e.g. mouth to mouth resuscitation\n6.3 Removal of air way blockage\n6.4 Apply pressure on the affected area\n6.5 Referral or transport of the patient to the appropriate\nmedical specialist\n\n7. Proper home-care and\ndental recall\nMay include:\n7.1 Proper instructions/advices on food intake, drug\nprescription and lifestyles\n7.2 Proper tooth brushing techniques\n7.3 Proper using of dental floss and mouth wash\n7.4 Proper care of dentures/teeth, gums and tongue\n\n--- PDF PAGE 119 ---\nDENTAL HYGIENE LEVEL IV Revision 01 Promulgated (01/11/2019) 115\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\n\nAssessment requires evidence that the candidate:\n1.1 Positioned patient for dental diagnosis\n1.2 Performed tooth scaling and polishing\n1.3 Provided oral-health advice to patient\n1.4 Demonstrated consistent compliance with infection\ncontrol guidelines and legislative requirements\n\n2. Resource implications\n\nThe following resources should be provided:\n2.1 A real or simulated dental clinic environment\n2.2 Relevant documentation such as:\n2.2.1Industry codes of practice\n 2.2.2National and local legislation as appropriate\n2.3 A qualified workplace assessor\n3 Method of assessment\n\nCompetency may be assessed through:\n3.1 Demonstration with oral questioning\n3.2 Written test\n3.3Interview\n3.4Portfolio\n\n4 Context of assessment\n\n4.1 Assessment may be conducted in the workplace or in a\nsimulated environment\n\n--- PDF PAGE 120 ---\nDENTAL HYGIENE LEVEL IV Revision 01 Promulgated (01/11/2019) 116\n\nUNIT OF COMPETENCY\nMAINTAIN DENTAL RECORDS AND RESOURCES\n\nUNIT CODE"
