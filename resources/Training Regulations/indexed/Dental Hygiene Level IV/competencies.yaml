ent\ntechniques of\ncommunicatio\nn as\nappropriate\n\n--- PDF PAGE 89 ---\nDENTAL HYGIENE LEVEL IV Revision 01 Promulgated (01/11/2019) 85\nRANGE OF VARIABLES\n\nVARIABLE\n\nRANGE\n1. Information\nMay include but are not limited to:\n1.1 Personal information\n1.1.1\nName\n1.1.2\nAddress\n1.1.3\nAge\n1.1.4\nStatus\n1.1.5\nOccupation\n1.2 List of medications currently taking\n1.3 List of vitamins and natural healing remedies currently taking\n1.4 Smoking and alcohol consumption\n1.5 Allergy list\n1.6 Previous experience or adverse reaction with anesthesia,\nanesthesias, anti-biotics and analgesics\n1.7 Family member reactions to anesthesia\n1.8 Any medical conditions currently being treated for\n1.9 Previous surgeries or hospitalizations and other severe\ndental and medical conditions\n2. Equipment /\ninstruments\nMay include but are not limited to:\n2.1 Mouth mirror\n2.2 Dental Explorer\n2.3 Cotton pliers\n2.4 Periodontal probe\n\n3. Special\nprecautionary\nmeasures\n3.1 Patients with heart-valve disease must take antibiotics to\nprevent bacteria to spread into the blood stream that could\ncause endocarditis\n3.2 Patients with history or possibility of hypertension should\nhave their blood pressure monitored.\n3.3 Patients with relevant allergies\n3.4 Patients with medication such as blood thinners\n3.5 Patients with HIV or other contagious diseases\n3.6 Patients with mental disorders\n3.7 Patients with artificial prosthetic devices and transplants\n3.8 Patients who have a history of taking biphosponates\n4. Oral cavity\nMay include but are not limited to:\n4.1 Hard and soft palates\n4.2 Tongue\n4.3 Cheeks\n4.4 Lips\n4.5 Floor of the mouth\n4.6 Measurement of salivary flow\n4.7 Examination of neck area specifically the lymph nodes\n\n--- PDF PAGE 90 ---\nDENTAL HYGIENE LEVEL IV Revision 01 Promulgated (01/11/2019) 86\n\n5. Condition of teeth,\ngums and tissue of the\nmouth\n\nMay include but are not limited to:\n5.1 Condition of teeth:\n5.1.1 Erupted or un-erupted\n5.1.2 Carious or non-carious\n5.1.3 Damages to abrasion, erosion and attrition\n5.1.4 Previous treatments\n5.1.4.1 Restorations\n5.1.4.2 Crowns\n5.1.4.3 Others\n\n5.2 Condition of the gums\n5.2.1 Color and texture\n5.2.2 Bleeding\n5.2.3 Gingival recession\n5.2.4 Periodontal pockets\n5.2.5 Furcation involvement\n5.2.6 Tooth mobility\n\n6. Advice /\n recommendations\nMay include but are not limited to:\n6.1 Proper brushing of teeth\n6.2 Proper flossing of teeth\n6.3 Use of fluoride toothpaste\n6.4 Regular scaling and polishing\n\n--- PDF PAGE 91 ---\nDENTAL HYGIENE LEVEL IV Revision 01 Promulgated (01/11/2019) 87\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\n\nAssessment requires evidence that the candidate:\n1.1\nTook medical and dental history of client/patient\n1.2\nInspected teeth, gums and tissues of the mouth\n1.3\nEducated patient on oral hygiene\n1.4\nDemonstrated consistent compliance with infection\ncontrol guidelines and legislative requirements\n2. Resource implications\nThe following resources MUST be provided:\n2.1 A real or simulated dental clinic environment\n2.2\nRelevant documentation such as:\n2.2.1Industry codes of practice\n2.2.2Local legislation as appropriate\n2.3\nA qualified workplace assessor\n3. Method of assessment\nCompetency may be assessed through:\n3.1 Demonstration with oral questioning\n3.2 Interview\n3.3 Portfolio\n3.4 Written Examination\n4. Context of assessment\n4.1\nAssessment may be conducted in the workplace or in\na simulated environment\n\n--- PDF PAGE 92 ---\nDENTAL HYGIENE LEVEL IV Revision 01 Promulgated (01/11/2019) 88\nUNIT OF COMPETENCY:\nPROMOTE ORAL HEALTH AND HYGIENE\nUNIT CODE:\nHHC325302\nUNIT DESCRIPTOR:\nThis unit covers the knowledge, skills and attitude required\nto provide an oral health promotion program in both dental\nclinic and community setting. It acknowledges that dental\ndiseases are the most prevalent chronic diseases worldwide\nand that oral diseases impacts on a person’s everyday life\ncausing pain and disability and influencing eating, sleeping\nand social roles.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Develop oral\nhealth\npromotion\nstrategies for\nthe target\ngroup\n\n1.1 Information on the\ncauses and\nprevention of oral\ndiseases is provided\nto the target group\nusing language that\ncan be easily\nunderstood.\n1.2 Information on\nacids and\nfermentable\ncarbohydrates are\ndeveloped and given\nin a manner that can\nbe easily understood\n1.3 Target group are\ninvolved in the\nreview of current\ndietary habits and\nthe development of\nan approach to\nhealthy eating which\nimproves general\nand oral health\n1.4 Information is\nprovided on dentally\nhealthy lifestyle\nand behavioral\nchange\n1.5 Appropriate\nenvironment is\nprovided for the\ntarget group to ask\n1.1 Information on\nthe causes and\nprevention of oral\ndiseases\n1.2 Information on\nacids and\nfermentable\ncarbohydrates\n1.3 Target Group\n1.4 Current dietary\nhabits and the\ndevelopment of\nan approach to\nhealthy eating\n1.5 Information on\ndentally healthy\nlifestyle and\nbehavioral\nchange\n1.6 Environment\n\n1.1 Using\nevaluation\nskills to review\nthe\neffectiveness\nof an oral\nhealth\npromotion\nprogram\n1.2 Using\ncommunicatio\nn skills to\neffectively\ninform and\nmotivate\nbehavior\nchange\n1.3 Demonstrating\ninterpersonal\nskills when\nrelating to\npeople from a\nrange of social\ncultural and\nreligious\nbackgrounds\nand physical\nand mental\nabilities\n1.4 Dealing with\nconflict\n1.5 Working with\nothers and\nemphatizing\n\n--- PDF PAGE 93 ---\nDENTAL HYGIENE LEVEL IV Revision 01 Promulgated (01/11/2019) 89\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\nquestions and\nbecome involved in\noral health\nwith client and\nrelatives\n1.6 Applying\nproblem\nsolving skills\n2. Implement an\noral health\npromotion\nprogram\n\n2.1 Target group and\nappropriate teaching\nand learning styles\nare identified to\neffectively\ncommunicate an oral\nhealth promotion\nprogram\n2.2 Oral health issues\nare prioritized for the\ntarget group and the\npotential for\ninterventions\n2.3 Suitable oral health\npromotion\nmaterials are\nprepared for use\nacross age groups\n2.4 Flexibility of delivery\nof oral health\npromotions are\nensured by taking\ninto account the\ntarget group’s\nlocation, economic\nand physical\ncircumstances,\nlanguage, culture\nand communication\nneeds\n2.5 Community groups\nare actively involved\nin health decisions\nmaking and setting of\noral health promotion\npriorities\n2.6 A review strategy is\nimplemented to\ndetermine the\n2.1 Target group\nand appropriate\nteaching and\nlearning styles\n2.2 Oral Health\nPromotion\n2.3 Oral Health\nIssues and\nPotential\nInterventions\n2.4 Oral Health\nPromotion\nMaterials\n2.5 Target group’s\nlocation,\neconomic and\nphysical\ncircumstances,\nlanguage,\nculture and\ncommunication\n2.1 Using\nevaluation\nskills to review\nthe\neffectiveness\nof an oral\nhealth\npromotion\nprogram\n2.2 Using\ncommunicatio\nn skills to\neffectively\ninform and\nmotivate\nbehavior\nchange\n2.3 Demonstrating\ninterpersonal\nskills when\nrelating to\npeople from a\nrange of social\ncultural and\nreligious\nbackgrounds\nand physical\nand mental\nabilities\n2.4 Dealing with\nconflict\n2.5 Working with\nothers and\nemphatizing\nwith client and\nrelatives\n2.6 Apply problem\nsolving skills\n\n--- PDF PAGE 94 ---\nDENTAL HYGIENE LEVEL IV Revision 01 Promulgated (01/11/2019) 90\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\neffectiveness of the\noral health promotion\nprogram\n2.7 Work collaboratively\nwith other health\ncare workers in a\nculturally sensitive\nand competent\nmanner to address\nrisk factors that oral\ndiseases have in\ncommon with other\ndiseases\n2.8 The delivery of\nhealth information is\npersonalized so that\nit is immediately\nrelevant to the\nindividual and the\nconsequences of\nbehavior\n\n--- PDF PAGE 95 ---\nDENTAL HYGIENE LEVEL IV Revision 01 Promulgated (01/11/2019) 91\nRANGE OF VARIABLES\n\nVARIABLE\n\nRANGES\n1. Teaching and\nlearning styles\n\nMay include but are not limited to:\n1.1 Auditory learning\n1.2 Visual learning\n2. Oral health issues\ntargeted in an oral\nhealth promotion\nprogram\n\n2.1 Dental caries\n2.2 Periodontal diseases\n2.3 Non carious tooth wear\n-\nerosion\n-\nabrasion\n-\nattrition\n2.4 Damage to dentition due to trauma\n2.5 Damage to oral diseases due to cigarette smoking\n2.6 Harmful effects of low salivary flow\n2.7 Interrelationship between oral health and individual medical\nconditions\n2.8 Poor nutrition and poor oral health\n3. Oral health\npromotion materials\n\n3.1 Power point presentations\n3.2 Videos\n3.3 Brochures and information sheets\n3.4 Models\n4. Age group\nMay include but are not limited to:\n4.1 Children and adolescents\n4.2 Older people\n4.3 Low income and socially disadvantaged\n4.4 People with special needs\n5. Causes and\nprevention of oral\ndiseases\n\nMay include but are not limited to:\n5.1 Causes of oral diseases\n5.1.1 Bacteria in dental plaque\n5.1.2 Diet\n-\nconsumption of foods with high sugar content\n-\nfrequently consumption foods with high sugar\ncontent\n-\nconsumption of highly acidic food and drinks\n5.1.3\nSusceptible tooth surfaces\n5.1.4\nAlterations to the quantity and composition of saliva\n5.1.5\nSmoking\n\n--- PDF PAGE 96 ---\nDENTAL HYGIENE LEVEL IV Revision 01 Promulgated (01/11/2019) 92\n\nVARIABLE\n\nRANGES\n5.1.6\nLifestyle\n5.2 Prevention of oral diseases\n5.2.1\nIncreasing salivary flow and optimizing its\ncomposition\n5.2.2\nPromoting the use of fluorides\n5.2.3\nPlaque control\n5.2.3.1 Encourage regular dental care\n5.2.4\nDietary change\n5.2.5\nDiscouraging tobacco use\n5.2.6\nDiscouraging alcohol, drug and substance abuse\n5.2.7\nPreventing oral trauma e.g. sports injuries\n\n6. Information on acids\nand fermentable\ncarbohydrates\nMay include but are not limited to:\n6.1 The development of dental caries and its relation to:\n-\nthe frequency of eating foods containing added sugars\n-\nthe consistency of food containing added sugars\n-\nthe consumption of highly acidic drinks that may also\nhave a high sugar content\n\n7. Dentally healthy\nlifestyle and\nbehavioural change\nMay include but are not limited to:\n7.1 Adequate oral hygiene measures\n7.2 Decreased intake of alcohol and caffeine\n7.3 Decreased intake of fermentable carbohydrates\n7.4 Cessation of smoking\n\n8. Common risk factors May include but are not limited to:\n8.1 Poor oral hygiene\n8.2 Poor diet and nutrition\n8.3 Smoking\n8.4 Alcohol consumption\n8.5 Exposure to ultraviolet radiation\n8.6 Lifestyle factors\n8.7 Defective dental restorations\n\n--- PDF PAGE 97 ---\nDENTAL HYGIENE LEVEL IV Revision 01 Promulgated (01/11/2019) 93\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\n\nAssessment requires evidence that the candidate:\n1.1 Delivers an oral health promotion program\n1.2\nDevelops an oral health promotion strategies for target\ngroup\n1.3\nIntegrates oral health promotions with targeted National\nhealth priorities\n1.4\nDemonstrates consistent compliance with legislative\nrequirements, infection control guidelines and occupational\nhealth and safety procedures\n1.5\nDemonstrates consistent performance over the required\nrange of workplace situations including\n-\nthe ability to communicate effectively across population\ngroups\n-\nthe development of oral health program strategies for\nspecific target groups within the community\n-\nintegration of oral health promotion with targeted National\nhealth priorities\n\n2. Resource\nimplications\n\nThe following resources MUST be provided:\n2.1 A real or simulated dental clinic environment\n2.2 Relevant documentation such as:\n2.2.1 Case problems on community-based oral health\npromotion\n2.2.2 Industry codes of practice\n2.2.3 National and local legislation as appropriate\n2.3 A qualified workplace assessor\n\n3. Method of\nassessment\n\nCompetency may be assessed through:\n3.1 Demonstration with oral questioning\n3.2 Interview\n3.3Third party report\n\n4. Context of\nassessment\n\n4.1 Assessment may be conducted in the workplace or in a\nsimulated environment\n\n--- PDF PAGE 98 ---\nDENTAL HYGIENE LEVEL IV Revision 01 Promulgated (01/11/2019) 94\n\nUNIT OF COMPETENCY:\nOPERATE DENTAL RADIOGRAPHIC EQUIPMENT\nUNIT CODE:\nHHC325303\nUNIT DESCRIPTOR:\nThis unit covers the knowledge, skills and attitudes required\nto operate dental radiographic equipment and position the\npatient and radiographic film in order to produce an\ninterpretable diagnostic image\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Position patient\nto obtain\nradiographic\nimage\n\n1.1 Radiation safety\nmeasures for\npatient, operator\nand others are\nimplemented and\nmaintained\nthroughout the\nprocedures.\n1.2 Patient is positioned\nin accordance with\nradiographic\nprocedures\n1.1 Legislative and\nethical\nresponsibilities\nfor the safe use\nof radiation in\ndentistry\n1.2 Relevant\nlegislation and\nstatutory\nrequirements of\nconsent\n1.3 Fundamental\nknowledge of the\nradiographic\nappearance of\nanatomic\nlandmarks,\nnormal dentition\nand association\nbony structures\nfor intraoral\nradiographs\n1.4 Fundamental\nknowledge of the\nradiographic\nappearance of\ndental anomalies\nand common oral\npathological\nconditions\n1.5 Range od dental\nradiographic\nimaging\ntechniques and\nthe reasons for\nselection of each\n1.1 Operating\nradiographic\nunit\n1.2 Observing\nsafety and\nhealth\nprecautions\nin dental\nradiography\n1.3 Minimizing\ntechnical\ninaccuracies\nin dental\nradiographic\nimages\n1.4 Using terms\nfor technical\ninaccuracies\nin dental\nradiogra