d to:\n4.1\nClinical and related waste\n4.2\nInfectious waste\n4.3\nSharps\n4.4\nGeneral waste\n4.5\nOther hazardous substances\n5\nRequirements for\nsafe disposal of\nwaste\nMay be determined by:\n5.1\nMain drainage\n5.2\nLocal government ordinances\n5.3\nMaterial Safety Data Sheet (MSDS)\n\n--- PDF PAGE 70 ---\nDENTAL HYGIENE LEVEL IV Revision 01 Promulgated (01/11/2019) 66\nEVIDENCE GUIDE\n\n1.\nCritical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nDemonstrated knowledge of infection risks in health\nenvironment and specifically in dental laboratory practice\n1.2\nComplied with current DOH infection control guidelines\nand procedures, OHS and legislative requirements\n1.3\nHandled waste safely managed procedures in\naccordance with legislative requirements\n1.4\nSelected and used appropriate cleaning agents for\nparticular surfaces and equipment in accordance with the\nmanufacturer’s specifications\n2. Resource\nImplications\n\nThe following resources MUST be provided:\n2.1\nRelevant dental laboratory practice/organizational policy\nand procedures\n2.2\nIncident reporting procedures\n2.3\nOccupational health and safety policy and procedures\n2.4\nInfection control guidelines\n2.5\nWaste management policies\n2.6\nRelevant state legislations\n2.7\nManufacturer’s instructions for the use of relevant\nequipment, instruments, medicaments, materials and\nMaterial Safety Data Sheets (MSDS)\n2.8\nCleaning agents currently used in the workplace\n3. Methods of\nAssessment\nCompetency may be assessed through:\n3.1\nWritten Test/Examination\n3.2\nDemonstration with questioning\n3.3\nObservation with questioning\n3.4\nPortfolio\n3.5\nThird Party Report\n4. Context of\nassessment\n4.1\nCompetency may be assessed in the workplace or in a\nsimulated work setting.\n\n--- PDF PAGE 71 ---\nDENTAL HYGIENE LEVEL IV Revision 01 Promulgated (01/11/2019) 67\n\nUNIT OF COMPETENCY\nAPPLY BASIC FIRST AID\nUNIT CODE\nHHC323203\nUNIT DESCRIPTOR\nThis unit covers the knowledge, skills and attitudes required to\nprovide an initial response where First Aid is required. In this\nunit it is assumed that the First Aider is working under\nsupervision and / or according to established workplace First-\nAid procedures and policies.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Assess the\nsituation\n1.1\nPhysical hazards\nto self and\ncasualty’s health\nand safety are\nidentified.\n1.2\nImmediate risks to\nself and casualty’s\noccupational health\nand safety (OSH\n)are minimized by\ncontrolling the\nhazard in\naccordance with\nOSH requirements.\n1.3\nCasualty’s vital\nsigns and physical\ncondition are\nassessed in\naccordance with\nworkplace\nprocedures.\n1.1 Physical Hazards\n1.2 Risks\n1.3 Occupational\nSafety and\nHealth Policies\nand Procedures\n1.4 Vital Signs\n1.5 Workplace\nProcedures\n• Assessing\nsituation\n• Report\npreparation\n• Communication\nskills\n• Interpreting and\nusing listed\ndocuments\n\n--- PDF PAGE 72 ---\nDENTAL HYGIENE LEVEL IV Revision 01 Promulgated (01/11/2019) 68\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n2. Apply basic\nfirst aid\ntechniques\n2.1\nFirst Aid\nmanagement is\nprovided in\naccordance with\nestablished First\nAid procedures.\n2.2\nCasualty is\nreassured in a\ncaring and calm\nmanner and made\ncomfortable using\navailable resources.\n2.3\nFirst Aid assistance\nis sought from\nothers in a timely\nmanner and as\nappropriate.\n2.4\nCasualty’s\ncondition is\nmonitored and\nresponded to in\naccordance with\neffective First-Aid\nprinciples and\nworkplace\nprocedures.\n2.5\nDetails of casualty’s\nphysical condition,\nchanges in\nconditions,\nmanagement and\nresponse are\naccurately recorded\nin line with\norganizational\nprocedures.\n2.6\nCasualty\nmanagement is\nfinalized according\nto his/her needs\nand First Aid\n