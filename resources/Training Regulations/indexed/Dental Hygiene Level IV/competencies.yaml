        "evidence_guide": {
          "source_text": "1. Critical Aspects of\nCompetency\n\nAssessment requires evidence that the candidate:\n1.1\nTook medical and dental history of client/patient\n1.2\nInspected teeth, gums and tissues of the mouth\n1.3\nEducated patient on oral hygiene\n1.4\nDemonstrated consistent compliance with infection\ncontrol guidelines and legislative requirements\n2. Resource implications\nThe following resources MUST be provided:\n2.1 A real or simulated dental clinic environment\n2.2\nRelevant documentation such as:\n2.2.1Industry codes of practice\n2.2.2Local legislation as appropriate\n2.3\nA qualified workplace assessor\n3. Method of assessment\nCompetency may be assessed through:\n3.1 Demonstration with oral questioning\n3.2 Interview\n3.3 Portfolio\n3.4 Written Examination\n4. Context of assessment\n4.1\nAssessment may be conducted in the workplace or in\na simulated environment\n\n--- PDF PAGE 92 ---\nDENTAL HYGIENE LEVEL IV Revision 01 Promulgated (01/11/2019) 88\nUNIT OF COMPETENCY:\nPROMOTE ORAL HEALTH AND HYGIENE\nUNIT CODE:"
        },
        "source_text": "HHC325301\nUNIT DESCRIPTOR:\nThis unit covers the knowledge, skills and attitudes required to\ntake medical and dental history, examine teeth, gums and\ntissue of the mouth and educate patient on oral hygiene.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Take\nmedical/\ndental\nhistory of the\npatient\n\n1.1 Information are\ncollected from the\npatient in\naccordance with\ndental standard\noperating\nprocedures.\n1.2 Special conditions\nof the patient are\ndetermined and\ndocumented\nfollowing\nestablished\nprocedures.\n1.3 Special\nprecautionary\nmeasures are\ntaken prior to\ndental examination\nbased on patient’s\nmedical condition.\n1.4 Treatment\nappointments are\nallocated in\naccordance to\npriority\n1.1 Able to understand\nMedical History\nAssessment\n1.2 Relationship\nBetween Systemic\nDiseases and Oral\nHealth\n1.3 Determination of\nMedical Risk and\nConsultation with a\nPhysician\n1.4 Stress Reduction\nProtocol for\nAnxious Patients\n1.5 Medical Conditions\nand Diseases\n1.6 Common\nPrescription\nMedications; Uses,\nConcerns and Oral\nManifestations\n1.7 Knowledge on vital\nsigns\n1.8 Knowledge on Oral\ntemperature\nmeasurement\n1.9 Able to understand\npulse rate\nassessment\n\n1.1 Ability to extract\nmedical health\nhistory from\npatients\n1.2 Ability to\ndetermine pulse\nrate\n1.3 Ability to\ndetermine\nrespiration\nassessment\n1.4 Ability to\ndetermine blood\npressure\nmeasurements\n1.5 Identifying\nhealth risks of\nsmoking and\nharmful\nproperties of\ntobacco\n1.6 Apply\nGuidelines for\nTobacco\nCessation\nCounseling\n1.7 Implement\nproper head and\nneck\nexamination\n\n--- PDF PAGE 85 ---\nDENTAL HYGIENE LEVEL IV Revision 01 Promulgated (01/11/2019) 81\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n\n1.10 Able to understand\nrespiration\nassessment\n1.11 Able to understand\nblood pressure\nassessment\n1.12 Knowledge on the\nHealth effects of\ntobacco use\n1.13 Medical Health\nRisks of Smoking\n1.14 To the\nPeriodontium\n1.15 Smokeless\nTobacco\n1.16 Secondhand\nSmoke\n1.17 Knowledge on the\nhead and neck\nexamination\n1.18 Anatomy of head\nand neck\n1.19 Anatomy of Eyes,\nEars and Nose\n1.20 Sternomastoid\nMuscles\n1.21 Lymph Nodes of\nthe Head and\nNeck\n1.22 Salivary Glands\n1.23 Thyroid Glands\n1.24 Temporomandibul\nar joint\n1.8\nApply oral\ntemperature\nmeasurement\n1.9\nApply\nCommunicati\non\nTechniques\nfor Patient\nAssessment\n1.10 Gather\nmedical/\ndental\ninformation of\npatient\n1.11 Gather dental\nhealth history\ninformation of\npatient\n\n--- PDF PAGE 86 ---\nDENTAL HYGIENE LEVEL IV Revision 01 Promulgated (01/11/2019) 82\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n\n1.25 Use of Mercury-\nin-Glass\nThermometer\n1.26 Use of Electronic\nThermometer\n1.27 Use of\nequipment for\nmeasuring blood\npressure\n1.28 Knowledge on\nthe\nCommunication\nTechniques for\nAssessment\n1.29 Communication\nProcess\n1.30 Patient-centered\ncommunication\n1.31 Listening skills\n1.32 Knowledge on\nHealth History\nforms\n1.33 Questioning\nskills\n1.34 Communication\nTasks during\npatient\nassessment\n1.35 Knowledge on\nRoadblocks to\nEffective\ncommunication\n1.36 Medical and\nDental\nTerminology\n1.37 Language\nBarriers\n1.38 Age Barriers\n1.39 Speech Barriers\n\n--- PDF PAGE 87 ---\nDENTAL HYGIENE LEVEL IV Revision 01 Promulgated (01/11/2019) 83\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n\n1.40 Knowledge on\nDental Health\nHistory\nQuestionnaire\n\n2. Examine\nteeth, gums\nand tissues\nof the mouth\n\n2.1 Equipment/\ninstruments to be\nused during\nexaminations are\nprepared and\nsterilized in\naccordance with\nOH&S standard\noperating\nprocedures.\n2.2 The oral cavity is\nchecked/examined\nin accordance with\nOH&S standard\noperating\nprocedures.\n2.3 Teeth conditions are\ndetermined following\nestablished\nprocedures.\n2.4 Patient’s observations\nare recorded using\ntooth chart and other\ndocumentation\nmethods\n2.1\nKnowledge on\nOral Anatomy,\nTooth\nMorphology and\nOcclusion\n2.2\nTissues of the\nPeriodontium in\nHealth\n2.3\nStructures of the\nPeriodontium\n2.4\nNerve Supply,\nBlood Supply\nand Lymphatic\nSystem\n2.5\nKnowledge on\noral cavity\n2.6\nKnowledge on\ndental charting\n2.7\nKnowledge on\nintraoral\nassessment\n2.8\nUse of dental\nequipment/\ninstruments\n2.9\nUse of dental\ntooth charting\nand other\ndocumentation\nmethods\n\n2.1 Ability to apply\nindividual\ntooth\nidentification,\ndrawing and\ncarving\n2.2 Ability to apply\ndental charting\n2.3 Ability to\ncheck/\nexamine\npatients oral\ncavity / teeth\nconditions\n2.4 Ability to\nconduct\nintraoral\nassessment\n2.5 Ability to\nprepare and\nsterilize dental\nequipment/\ninstruments\n2.6 Proper\ndocumentation\n\n--- PDF PAGE 88 ---\nDENTAL HYGIENE LEVEL IV Revision 01 Promulgated (01/11/2019) 84\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n3. Educate\npatient on\noral hygiene\n\n3.1 Findings, concerns\nand issues are\ndiscussed with the\npatient\n3.2 Professional advice/\nrecommendations\non proper oral\nhygiene is given to\nthe patient in\naccordance with the\ndentist instructions\n3.3 A complete oral\nhygiene program is\nscheduled and\nmaintained in\naccordance with the\ndentist instructions.\n3.1 Knowledge on oral\nhygiene\n3.2 Knowledge on\nperiodontal\npathology\n3.3 History of the\nPeriodontal\nDisease\n3.4 Causes of\nPeriodontal\nDisease\n3.5 Microbiology of\nPeriodontal\nDisease\n3.6 Host Immune\nResponse\n3.7 Local Contributing\nFactors\n3.8 Systemic\nContributing\nFactors\n3.9 Following\ninstructions in\nconducting oral\nhygiene program\n\n3.1 Apply different\ntechniques of\ncommunicatio\nn as\nappropriate\n\n--- PDF PAGE 89 ---\nDENTAL HYGIENE LEVEL IV Revision 01 Promulgated (01/11/2019) 85\nRANGE OF VARIABLES\n\nVARIABLE\n\nRANGE\n1. Information\nMay include but are not limited to:\n1.1 Personal information\n1.1.1\nName\n1.1.2\nAddress\n1.1.3\nAge\n1.1.4\nStatus\n1.1.5\nOccupation\n1.2 List of medications currently taking\n1.3 List of vitamins and natural healing remedies currently taking\n1.4 Smoking and alcohol consumption\n1.5 Allergy list\n1.6 Previous experience or adverse reaction with anesthesia,\nanesthesias, anti-biotics and analgesics\n1.7 Family member reactions to anesthesia\n1.8 Any medical conditions currently being treated for\n1.9 Previous surgeries or hospitalizations and other severe\ndental and medical conditions\n2. Equipment /\ninstruments\nMay include but are not limited to:\n2.1 Mouth mirror\n2.2 Dental Explorer\n2.3 Cotton pliers\n2.4 Periodontal probe\n\n3. Special\nprecautionary\nmeasures\n3.1 Patients with heart-valve disease must take antibiotics to\nprevent bacteria to spread into the blood stream that could\ncause endocarditis\n3.2 Patients with history or possibility of hypertension should\nhave their blood pressure monitored.\n3.3 Patients with relevant allergies\n3.4 Patients with medication such as blood thinners\n3.5 Patients with HIV or other contagious diseases\n3.6 Patients with mental disorders\n3.7 Patients with artificial prosthetic devices and transplants\n3.8 Patients who have a history of taking biphosponates\n4. Oral cavity\nMay include but are not limited to:\n4.1 Hard and soft palates\n4.2 Tongue\n4.3 Cheeks\n4.4 Lips\n4.5 Floor of the mouth\n4.6 Measurement of salivary flow\n4.7 Examination of neck area specifically the lymph nodes\n\n--- PDF PAGE 90 ---\nDENTAL HYGIENE LEVEL IV Revision 01 Promulgated (01/11/2019) 86\n\n5. Condition of teeth,\ngums and tissue of the\nmouth\n\nMay include but are not limited to:\n5.1 Condition of teeth:\n5.1.1 Erupted or un-erupted\n5.1.2 Carious or non-carious\n5.1.3 Damages to abrasion, erosion and attrition\n5.1.4 Previous treatments\n5.1.4.1 Restorations\n5.1.4.2 Crowns\n5.1.4.3 Others\n\n5.2 Condition of the gums\n5.2.1 Color and texture\n5.2.2 Bleeding\n5.2.3 Gingival recession\n5.2.4 Periodontal pockets\n5.2.5 Furcation involvement\n5.2.6 Tooth mobility\n\n6. Advice /\n recommendations\nMay include but are not limited to:\n6.1 Proper brushing of teeth\n6.2 Proper flossing of teeth\n6.3 Use of fluoride toothpaste\n6.4 Regular scaling and polishing\n\n--- PDF PAGE 91 ---\nDENTAL HYGIENE LEVEL IV Revision 01 Promulgated (01/11/2019) 87\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\n\nAssessment requires evidence that the candidate:\n1.1\nTook medical and dental history of client/patient\n1.2\nInspected teeth, gums and tissues of the mouth\n1.3\nEducated patient on oral hygiene\n1.4\nDemonstrated consistent compliance with infection\ncontrol guidelines and legislative requirements\n2. Resource implications\nThe following resources MUST be provided:\n2.1 A real or simulated dental clinic environment\n2.2\nRelevant documentation such as:\n2.2.1Industry codes of practice\n2.2.2Local legislation as appropriate\n2.3\nA qualified workplace assessor\n3. Method of assessment\nCompetency may be assessed through:\n3.1 Demonstration with oral questioning\n3.2 Interview\n3.3 Portfolio\n3.4 Written Examination\n4. Context of assessment\n4.1\nAssessment may be conducted in the workplace or in\na simulated environment\n\n--- PDF PAGE 92 ---\nDENTAL HYGIENE LEVEL IV Revision 01 Promulgated (01/11/2019) 88\nUNIT OF COMPETENCY:\nPROMOTE ORAL HEALTH AND HYGIENE\nUNIT CODE:"
