:\nHHC325301\nUNIT DESCRIPTOR:\nThis unit covers the knowledge, skills and attitudes required to\ntake medical and dental history, examine teeth, gums and\ntissue of the mouth and educate patient on oral hygiene.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Take\nmedical/\ndental\nhistory of the\npatient\n\n1.1 Information are\ncollected from the\npatient in\naccordance with\ndental standard\noperating\nprocedures.\n1.2 Special conditions\nof the patient are\ndetermined and\ndocumented\nfollowing\nestablished\nprocedures.\n1.3 Special\nprecautionary\nmeasures are\ntaken prior to\ndental examination\nbased on patient’s\nmedical condition.\n1.4 Treatment\nappointments are\nallocated in\naccordance to\npriority\n1.1 Able to understand\nMedical History\nAssessment\n1.2 Relationship\nBetween Systemic\nDiseases and Oral\nHealth\n1.3 Determination of\nMedical Risk and\nConsultation with a\nPhysician\n1.4 Stress Reduction\nProtocol for\nAnxious Patients\n1.5 Medical Conditions\nand Diseases\n1.6 Common\nPrescription\nMedications; Uses,\nConcerns and Oral\nManifestations\n1.7 Knowledge on vital\nsigns\n1.8 Knowledge on Oral\ntemperature\nmeasurement\n1.9 Able to understand\npulse rate\nassessment\n\n1.1 Ability to extract\nmedical health\nhistory from\npatients\n1.2 Ability to\ndetermine pulse\nrate\n1.3 Ability to\ndetermine\nrespiration\nassessment\n1.4 Ability to\ndetermine blood\npressure\nmeasurements\n1.5 Identifying\nhealth risks of\nsmoking and\nharmful\nproperties of\ntobacco\n1.6 Apply\nGuidelines for\nTobacco\nCessation\nCounseling\n1.7 Implement\nproper head and\nneck\nexamination\n\n--- PDF PAGE 85 ---\nDENTAL HYGIENE LEVEL IV Revision 01 Promulgated (01/11/2019) 81\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n\n1.10 Able to understand\nrespiration\nassessment\n1.11 Able to understa