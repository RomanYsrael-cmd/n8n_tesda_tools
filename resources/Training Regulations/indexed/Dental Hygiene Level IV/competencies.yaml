gnment\nrequirements.\nRecords\nNegotiation\n2.6 Maintaining\nRecords\n2.7 Attention to\ndetail when\ncompleting\nclient/custome\nr\n2.8 Interpersonal\nand\ncommunicatio\nn skills\nrequired in\nclient contact\nassignments\n3. Build credibility\nwith customers/\nclients\n3.1\nClient expectations\nfor reliability,\npunctuality and\nappearance\nadhered to.\n3.2\nPossible causes of\nclient/customer\ndissatisfaction\nidentified, dealt\nwith recorded\naccording\nemployer policy.\n3.3\nClient fully\ninformed of all\nrelevant matters in\na timely manner\nand according to\nagreed reporting\nprocedures.\n\n3.1 Types of\ncustomers/clients\n3.2 Behaviors,\ngestures and\nattitudes\n3.3 Related\ncustomer\ninformation and\nrequirements\n3.1 Dealing with\ncustomers/\nclients\nconcerns\n3.2 Asserting\nemployer\npolicies and\nprocedures\n3.3 Implementing\nsecurity\ninformation\nand\nprocedures\n\n--- PDF PAGE 48 ---\nDENTAL HYGIENE LEVEL IV Revision 01 Promulgated (01/11/2019) 44\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Personal Presence\nMay include:\n1.1\nStance\n1.2\nPosture\n1.3\nBody Language\n1.4\nDemeanor\n1.5\nGrooming\n 2. Employer\nStandards\nMay include:\n2.1\nStanding Orders\n3. Client\nRequirements\nMay include:\n3.1\nAssignment instructions\n3.2\nPost Orders\n3.3\nScope to modify instructions/orders in light of\nchanged situations\n4. Assignment\nInstructions\nMay be conveyed in:\n4.1\nWriting\n4.2\nVerbally\n4.3\nElectronically\n5. Client Needs and\nRequirements\nMay be detected by:\n5.1\nReview of the client brief and/or assignment\ninstructions\n5.2\nDiscussion with the client/customer\n6. Appropriate Action\nMay include:\n6.1\nImplementing required changes\n6.2\nReferring to appropriate employer personnel\n6.3\nClarification of client needs and instructions\n6.4\nHazard reports\n7. Customers\nMay include:\n7.1\nAll members of the public\n\n--- PDF PAGE 49 ---\nDENTAL HYGIENE LEVEL IV Revision 01 Promulgated (01/11/2019) 45\nEVIDENCE GUIDE\n\n1. Critical Aspects of