es \n8.1 Documents \n8.2 Records \n8.3 Pictures \n8.4 Music \n8.5 Video \n \n9. Disks \nMay include but is not limited to:  \n9.1 Floppy disks \n9.2 CDs \n9.3 CD-RW (Compact discs-Read/Write) \n9.4 DVD RW \n9.5 zip disks \n9.6 flash drives \n9.7 memory sticks \n9.8 hard drives \n \n10. Printer settings \nThe properties of the printer that enables it to work  includes:  \n10.1 page layout \n10.2 paper size \n10.3 ink/cartridge type \n10.4 number of copies \n10.5 page orientation.\n\n--- PDF PAGE 83 ---\nDENTAL HYGIENE LEVEL IV                     Revision 01                     Promulgated (01/11/2019)        79"
