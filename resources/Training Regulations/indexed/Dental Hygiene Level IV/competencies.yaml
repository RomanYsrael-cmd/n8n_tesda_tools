lls\n3.2. Evaluation Skills\n3.3. Auditing Skills\n3.4. Coaching Skills\n3.5. Supervisory Skills\n\n--- PDF PAGE 36 ---\nDENTAL HYGIENE LEVEL IV Revision 01 Promulgated (01/11/2019) 32\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. OSH Practices and\nPrograms\nMay include but not limited to:\n1.1\nPlanning, implementation and maintenance of\nmanufacturing plants\n1.2\nWork-physiological, psychological, ergonomic and\nhygienic practices and programs\n1.3\nFirst aid within the workplace\n1.4\nSafety inspection practices\n\n2. OSH Reference Guides\nMay include but not limited to:\n2.1\nOccupational Safety and Health Standards Book\n2.2\nOSHA Safety Bulletins and Magazines\n2.3\nEquipment Safety Operating Instructions\n2.4\nEstablished National Safety Management Books\n2.5\nCredible OSH Web-sites\n2.6\nSafety Solution Guide Books and Handbooks\n3. OSH Work Improvement\nInitiatives\nMay include but not limited to:\n3.1\nEliminate the hazard altogether (i.e., get rid of the\ndangerous machine)\n3.2\nIsolate the hazard from anyone who could be harmed (i.e.,\nkeep the machine in a closed room and operate it remotely;\nbarricade an unsafe area off)\n3.3\nSubstitute the hazard with a safer alternative (i.e., replace\nthe machine with a safer one)\n3.4\nUse administrative controls to reduce the risk (i.e., train\nworkers how to use equipment safely; train workers about\nthe risks of harassment; issue signage)\n3.5\nUse engineering controls to reduce the risk (i.e., attach\nguards to the machine to protect users)\n3.6\nUse personal protective equipment (i.e., wear gloves and\ngoggles when using the machine)\n\n--- PDF PAGE 37 ---\nDENTAL HYGIENE LEVEL IV Revision 01 Promulgated (01/11/2019) 33\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1. Consult appropriate personnel or OSH reference guides for proper\nguidance based on workplace policies and procedures\n1.2. Evaluate current practices and programs based on acceptable\nlevel of OSH work standards\n1.3. Identify OSH work improvement initiatives that are relevant with the\nworkplace scenario\n1.4. Present OSH program improvement plans based on workplace\npolicies and procedures\n1.5. Communicate approved improvements on OSH work program\ninitiatives based on workplace policies and procedures\n1.6. Monitor implementation of the approved OSH initiatives in accordance\nwith workplace policies and procedures\n1.7. Evaluate implementation of approved OSH initiatives based on\nworkplace policies and procedures\n2. Resource\nImplications\nThe following resources should be provided:\n2.1 Workplace or assessment location\n2.2 OSH personal records\n2.3 PPE\n2.4 Health records\n\n3. Methods of\nAssessment\nCompetency may be assessed through:\n3.1 Portfolio Assessment\n3.2 Interview\n3.3 Case Study/Situation\n3.4 Observation/Demonstration and oral questioning\n4. Context for\nAssessment\n4.1 Competency may be assessed in the work place or in a\nsimulated work place setting\n\n--- PDF PAGE 38 ---\nDENTAL HYGIENE LEVEL IV Revision 01 Promulgated (01/11/2019) 34\n\n UNIT OF COMPETENCY\n:\nLEAD TOWARDS IMPROVEMENT OF\nENVIRONMENTAL WORK PROGRAMS, POLICIES\nAND PROCEDURES\n\n UNIT CODE\n:\n500311408\n\n UNIT DESCRIPTOR\n\n:\n\nThis unit covers the knowledge, skills and attitudes\nrequired in assessing environmental work practices and\nstandards, recommending environmental work\nimprovement initiatives and implementing recommended\nenvironmental improvements\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Assess\nenvironmenta\nl work\npractices and\nprograms\n1.1. Environmental\npractices and\nprograms are\nreviewed based on\nworkplace policies\n1.2 Appropriate personnel\nor environmental\nreference guides are\nconsulted for proper\nguidance based on\nworkplace policies*\n1.3 Current practices and\nprograms are\nevaluated based on\nacceptable level of\nenvi