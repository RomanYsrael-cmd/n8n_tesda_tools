bers to\nparticipate are used\nroutinely\n5.3 Objectives and agenda\nfor meetings and\ndiscussions are\nroutinely set and\nfollowed\n5.4 Relevant information is\nprovided to group to\nfacilitate outcomes\n5.5 Evaluation of group\ncommunication\nstrategies is\nundertaken to promote\nparticipation of all\nparties\n5.6 Specific\ncommunication needs\nof individuals are\nidentified and\naddressed\n5.1 Communication\nprocess\n5.2 Dynamics of\ngroups and\ndifferent styles of\ngroup leadership\n5.3 Openness and\nflexibility in\ncommunication\n5.4 Communication\nskills relevant to\nclient groups\n\n5.1 Full range of\ncommunication\ntechniques\nincluding:\n5.1.1 Effective\ncommunication\nprocess\n5.1.2 Active listening\n5.1.3 Giving/receiving\nfeedback\n5.1.4 Interpretation of\ninformation\n5.1.5 Role boundaries\nsetting\n5.1.6 Negotiation\n5.1.7 Establishing\nempathy\n5.1.8 Openness and\nflexibility in\ncommunication\n5.2 Communication\nskills required to\nfulfill job roles as\nspecified by the\norganization\n\n6. Conduct\ninterview\n6.1 A range of appropriate\ncommunication\nstrategies are\nemployed in interview\nsituations\n6.2 Records of interviews\nare made and\nmaintained in\naccordance with\norganizational\nprocedures\n6.3 Effective questioning,\nlistening and nonverbal\ncommunication\ntechniques are used to\nensure that required\nmessage is\ncommunicated\n6.1 Communication\nprocess\n6.2 Dynamics of\ngroups and\ndifferent styles of\ngroup leadership\n6.3 Effective\nquestioning\ntechniques\n6.3 Communication\nskills relevant to\nclient groups\n\n6.1 Full range of\ncommunication\ntechniques\nincluding:\n6.1.1 Effective\ncommunication\nprocess\n6.1.2 Active listening\n6.1.3 Giving/ receiving\nfeedback\n6.1.4 Interpretation of\ninformation\n6.1.5 Role boundaries\nsetting\n6.1.6 Negotiation\n6.1.7 Establishing\nempathy\n6.2 Effective clarifying\n\n--- PDF PAGE 10 ---\nDENTAL HYGIENE LEVEL IV Revision 01 Promulgated (01/11/2019) 6\nand probing\ntechniques\n(questioning\nskills)\n6.3 Communication\nskills required to\nfulfill job roles as\nspecified by the\norganization\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Strategies\nMay include:\n1.1\nRecognizing own limitations\n1.2\nReferral to specialists\n1.3\nUtilizing techniques and aids\n1.4\nProviding written drafts\n1.5\nVerbal and non verbal communication\n2. Effective group\ninteraction\nMay include:\n2.1\nIdentifying and evaluating what is occurring within an\ninteraction in a non judgmental way\n2.2\nUsing active listening\n2.3\nMaking decision about appropriate words, behavior\n2.4\nPutting together response which is culturally\nappropriate\n2.5\nExpressing an individual perspective\n2.6\nExpressing own philosophy, ideology and background\nand exploring impact with relevance to communication\n2.7\nOpenness and flexibility in communication\n3. Types of Interview\nMay include:\n3.1\nRelated to staff issues\n3.2\nRoutine\n3.3\nConfidential\n3.4\nEvidential\n3.5\nNon disclosure\n3.6\nDisclosure\n4. Interview situations\nMay include:\n4.1\nEstablish rapport\n4.2\nElicit facts and information\n4.3\nFacilitate resolution of issues\n4.4\nDevelop action plans\n4.5\nDiffuse potentially difficult situation\n\n--- PDF PAGE 11 ---\nDENTAL HYGIENE LEVEL IV Revision 01 Promulgated (01/11/2019) 7\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Demonstrated effective communication skills with clients\naccessing service and work colleagues\n1.2 Adopted relevant communication techniques and\nstrategies to meet client particular needs and difficulties\n2. Resource Implications\n2.1 Access to appropriate workplace where assessment can\ntake place\n\n3. Methods of Assessment\nCompetency in this unit may be assessed through:\n3.1 Case Study\n3.2 Interview\n3.3 Portfolio\n3.4 Written Test\n3.5 Role Play\n\n4. Context for Assessment\n4.1 This unit should be assessed on the job through\nsimulation\n\n--- PDF PAGE 12 ---\nDENTAL HYGIENE LEVEL IV Revision 01 Promulgated (01/11/2019) 8\nUNIT OF COMPETENCY :\nDEVELOP AND LEAD TEAMS\n\nUNIT CODE\n:\n500311402\n\nUNIT DESCRIPTOR\n:\nThis unit covers the skills, knowledge and attitudes\nrequired to determine individual and team development\nneeds and facilitate the development of the workgroup.\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n1. Foster\nIndividual\ngrowth\n1.1 Learning and\ndevelopment\nneeds of team\nmembers are\nsystematically\nidentified in line\nwith\norganizational\nrequirements\n1.2 Development plan\nto meet individual\nneeds is\ncollaboratively\ndeveloped and\nimplemented\n1.3 Individuals are\nencouraged to self\n-evaluate\nperformance and\nidentify areas for\nimprovement\n1.4 Feedback on\nperformance of\nteam members is\ncollected from\nrelevant sources\nand compared with\nestablished team\nlearning process\n1.1 Effective\nworkplace\ncommunication,\ncoaching and\nmentoring\nprinciples\n1.2 Feedback\nprinciples and\nprocedures\n1.3 Working\ninterdependently:\nstrategies and\ntechniques\n1.4 Leadership\nConcepts:\n1.4.1 Types of\nDecisions\nTeams Make\n1.4.2 Team\nResponsibilities\n1.4.3 Problems That\nAffect Teams\n1.4.4 Building Strong\nTeam\nCommunication\n1.4.5 Expressing\nYourself on a\nTeam\n1.4.6 Team Problem\nSolving\n\n1.1 Ability to read and\nunderstand a variety of\ntexts, prepare general\ninformation and\ndocuments according to\ntarget audience; spell\nwith accuracy; use\ngrammar and\npunctuation effective\nrelationships and\nconflict management\n1.2 Coaching and\nmentoring skills to\nprovide support to\ncolleagues\n1.3 Communication skills\nincluding receiving\nfeedback and reporting,\nmaintaining effective\nrelationships and\nconflict management\n1.4 Ability to relate to\npeople from a range of\nsocial, cultural, physical\nand mental\nbackgrounds\n1.5 Planning skills to\norganize required\nresources and\nequipment to meet\nlearning needs