        "evidence_guide": {
          "source_text": "VARIABLE \nRANGE \n1. Media \nMay include but not limited to: \n1.1 \nPrint media \n1.2 \nBroadcast media \n1.3 \nInternet and social media  \n2. Scanning/Monitoring \nMay include but not limited to: \n2.1 \nSourcing from key informants \n2.2 \nConversation with clients \n2.3 \nMan-on-the-street conversation \n2.4 \nScanning print and broadcast media \n3. Local, national and \nglobal issues \n \nMay include but not limited to: \n3.1 \nPoverty \n3.2 \nUnemployment \n3.3 \nGlobal warming \n3.4 \nSafety, security, and well-being \n1. Critical aspects of \nCompetency  \nAssessment requires evidence that the candidate: \n1.1 Demonstrated ability and attitude to keep oneself \nupdated of relevant issues/trends  \n1.2 Demonstrated ability to think and act based on one’s \nprinciples and values \n1.3 Demonstrated a holistic/global outlook on internal and \nexternal events in the workplace  \n2. Resource \nImplications \nThe following resources should be provided: \n2.1 Access to workplace and resources \n2.2 Case studies \n3. Methods of \nAssessment \nCompetency in this unit may be assessed through: \n3.1 \nDemonstration or simulation with oral questioning \n3.2 \nCase problems involving global and local issues \n3.3 \nThird-party report \n4. Context for \nAssessment \n4.1 \nCompetency assessment may occur in workplace or \nany appropriately simulated environment",
