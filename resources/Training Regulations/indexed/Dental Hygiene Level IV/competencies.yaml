lovoltage and\ntube length are pre-determined by manufacturer\nspecifications for radiographic unit or selected by the\ndentist or dental specialist prior to the procedure:\n-\nselection\nof\ntechnical\nvariables\nof\ndental\nradiographic units by the dental assistant in\naccordance with manufacturers specifications and\npatient requirements may include but is not limited\nto exposure times.\n\n3. Appropriate\nradiographic technique\n\nAppropriate radiographic technique may include:\n3.1 The bisected angle technique\n3.2 The paralleling technique\n3.3 Extra oral techniques:\n-\nhorizontal and vertical angulation\n-\nreceptor (film) selection and placement\n-\ncorrect assembly of film locating device\n-\npositioning of client\n-\nuse of intensifying screens\n\n--- PDF PAGE 105 ---\nDENTAL HYGIENE LEVEL IV Revision 01 Promulgated (01/11/2019) 101\n\n4. Patient requirements\nMay include but are not limited to:\n4.1 Age\n4.2 Size\n4.3 Weight\n4.4 Physical capabilities\n4.5 Pregnancy\n4.6 Ability to comply with instructions\n4.7 Radiographic view/position\n4.7.1\nIntraoral radiographic views\n4.7.1.1 Occlusal\n4.7.1.2 Periapical\n4.7.1.3 Bitewing view\n4.7.1.4 Full mouth series\n4.7.2\nExtraoral radiographic views\n4.7.2.1 Panoramic films\n4.7.2.2 Cephalometric\n\n5. Accessories\n\nMay include but are not limited to:\n5.1 Film locating devices\n5.2 Film holders\n5.3 Immobilization equipment\n5.4 Intensifying screens\n5.5 Modifications for the use of film locating devices\n\n6. Processing errors\nMay include but are not limited to:\n6.1 Film that is marked\n6.2 Film with inadequate or low contrast\n6.3 Film that is too dark\n6.4 Film that is too light\n\n7. Errors in techniques\nMay include but are not limited to:\n7.1 Incorrect horizontal and vertical angulation\n7.2 Incorrect film placement\n7.3 Incorrect assembly and use of film locating device\n7.4 Incorrect tubehead placement\n7.5 Failure to remove oral appliances and jewellery\n7.6 Over/under exposure\n7.7 Movement 