  "source_section_text": "SECTION 2 COMPETENCY STANDARDS\n\nThis section gives the details of the contents of the basic, common and core\nunits of competency required in DENTAL HYGIENE LEVEL IV.\n\nBASIC COMPETENCIES\nUNIT OF COMPETENCY :\nUTILIZE SPECIALIZED COMMUNICATION SKILLS\n\nUNIT CODE\n:\n500311401\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes\nrequired to use specialized communication skills to\nmeet specific needs of internal and internal clients,\nconduct interviews, facilitate discussion with groups,\nand contribute to the development of communication\nstrategies.\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n1. Meet common\nand specific\ncommunication\nneeds of clients\nand colleagues\n1.1 Specific\ncommunication needs\nof clients and\ncolleagues are\nidentified and met\n1.2 Different approaches\nare used to meet\ncommunication needs\nof clients and\ncolleagues\n1.3 Conflict is addressed\npromptly in a manner\nwhich does not\ncompromise the\norganization\n\n1.1 Communication\nprocesses\n1.2 Dynamics of\ngroups and\ndifferent styles\nof group\nleadership\n1.3 Communication\nskills relevant to\nclient groups\n1.4 Flexibility in\ncommunication\n\n1.1 Full range of\ncommunication\ntechniques\nincluding:\n1.1.1 Effective\ncommunication\nprocess\n1.1.2 Active listening\n1.1.3 Giving/ receiving\nfeedback\n1.1.4 Interpretation of\ninformation\n1.1.5 Role boundaries\nsetting\n1.1.6 Negotiation\n1.1.7 Establishing\nempathy\n1.1.8 Conduct seminars\n1.1.9 Public speaking\n1.2 Communication\nskills required to\nfulfill job roles as\nspecified by the\norganization\n\n--- PDF PAGE 7 ---\nDENTAL HYGIENE LEVEL IV Revision 01 Promulgated (01/11/2019) 3\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n2. Contribute to the\ndevelopment of\ncommunication\nstrategies\n2.1 Strategies for internal\nand external\ndissemination of\ninformation are\ndeveloped, promoted,\nimplemented and\nreviewed as required\n2.2 Channels of\ncommunication are\nestablished and\nreviewed regularly\n2.3 Coaching in effective\ncommunication is\nprovided\n2.4 Work related network\nand relationship are\nmaintained\n2.5 Negotiation and\nconflict resolution\nstrategies are used\nwhere required\n2.5 Communication with\nclients and colleagues\nis performed\nappropriate to\nindividual needs and\norganizational\nobjectives\n2.1 Communication\nprocess\n2.2 Dynamics of\ngroups and\ndifferent styles of\ngroup leadership\n2.3 Openness and\nflexibility in\ncommunication\n2.4 Communication\nskills relevant to\nclient groups\n\n2.1 Full range of\ncommunication\ntechniques\nincluding:\n2.1.1 Effective\ncommunication\nprocess\n2.1.2 Active listening\n2.1.3 Giving/ receiving\nFeedback\n2.1.4 Interpretation of\ninformation\n2.1.5 Role boundaries\nsetting\n2.1.6 Negotiation\n2.1.7 Establishing\nempathy\n2.1.8 Openness and\nflexibility in\ncommunication\n2.2 Communication\nskills required to\nfulfill job roles as\nspecified by the\norganization\n3. Deliver a\ntechnical\npresentation\n3.1 Presentation is\ndelivered clearly,\nsequential and\ndelivered within allotted\ntime\n3.3 Utilize appropriate\nmedia to enhance\npresentation\n3.4 Differences in\nviews/opinions are\nrespected\n3.5 Questions during fora\nare responded in a\nmanner consistent with\norganizational standard\n3.1 Communication\nprocess\n3.2 Dynamics of\ngroups and\ndifferent styles of\ngroup leadership\n3.3 Openness and\nflexibility in\ncommunication\n3.4 Communication\nskills relevant to\nclient groups\n\n3.1 Full range of\ncommunication\ntechniques\nincluding:\n3.1.1 Effective\ncommunication\nprocess\n3.1.2 Active listening\n3.1.3 Giving/receiving\nfeedback\n3.1.4 Interpretation of\ninformation\n3.1.5 Role boundaries\nsetting\n3.1.6 Negotiation\n3.1.7 Establishing\nempathy\n3.1.8 Openness and\n\n--- PDF P