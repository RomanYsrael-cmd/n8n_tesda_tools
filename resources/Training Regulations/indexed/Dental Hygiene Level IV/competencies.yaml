isks\n1.3\nAssessed and monitored the physical condition of the\ncasualty\n1.4\nResponded to emergency using basic life support\nmeasures\n1.5\nProvided initial response where First Aid is required\n1.6\nDealt with complex casualties or incidents\n1.7\nPrepared reports to concerned personnel in a timely\nmanner\n2. Resource\nimplications\nThe following resources MUST be provided:\n2.1\n Access to relevant work station\n2.2 Relevant institutional policies, guidelines procedure\nand protocol\n2.3 Equipment and materials relevant to the proposed\nactivities\n3. Method of\nassessment\nCompetency may be assessed through:\n3.1\nDemonstration with questioning\n3.2\nInterview\n3.3\nThird-Party report\n3.4\nPortfolio\n4. Context of\nassessment\n4.1\nAssessment may be done in a workplace or simulated\nwork area setting.\n\n--- PDF PAGE 77 ---\nDENTAL HYGIENE LEVEL IV Revision 01 Promulgated (01/11/2019) 73\n\nUNIT OF COMPETENCY:\nOPERATE A PERSONAL COMPUTER\nUNIT CODE:\nICT311201\nUNIT DESCRIPTOR:\nThis unit defines the competency required to operate a\npersonal computer by: starting the PC, logging in, using and\nworking with files, folders and programs, saving work, and\nclosing down the PC.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Start the\ncomputer\n\n1.1\nThe peripheral\ndevices are\nproperly\nconnected\n1.2\nPower is checked\nand the computer\nand peripheral\ndevices are\nswitched on\n1.3\nProper logging in\nand logging off is\nsuccessfully done\n1.4\nThe operating\nsystem features\nand functions are\naccessed and\nnavigated\n1.5\nHardware\nconfiguration and\nother system\nfeatures are\nchecked\n1.1 Peripheral\nDevices\n1.2 Keyboard\nLayout and\nFunctions\n1.3 Basic parts of\na computer\nand various\nhardware\ncomponents\n1.4 Storage\ndevices and\nthe concepts\n1.5 Basic\nsoftware\noperation and\nfunctionalities\n1.1 Starting the\ncomputer\n1.2 Connecting\nproperly\nperipher