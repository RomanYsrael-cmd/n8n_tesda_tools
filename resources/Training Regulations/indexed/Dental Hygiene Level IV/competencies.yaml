        "source_text": "HHC325307\n\nUNIT DESCRIPTOR\n\nThis unit of competency deals with the knowledge, skills and\nattitudes in providing effective patient/client service. It includes\ngreeting patient/client, identifying patient/client needs,\ndelivering service to patient/client, handling queries through\ntelephone, fax machine, internet and email and handling\ncomplaints, evaluation and recommendation.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Greet\npatient/client\n1.1 Patient’s/client’s are\ngreeted in line with\ndental procedure\n1.2 Verbal and non-\nverbal\ncommunications are\nappropriate to the\ngiven situation\n1.3 Non verbal\ncommunication of\npatient/client is\nobserved\nresponding to\npatient/client\n1.4 Sensitivity to cultural\nand social\ndifferences is\ndemonstrated\n1.1 Dental Procedure\n1.2 Verbal and Non-\nVerbal\nCommunication\n1.3 Cultural and\nSocial\nDifferences\n1.4 Safety Practices\n1.5 Attitude\n1.6 Communication\nProcess\n1.7 Communication\nBarriers\n1.1 Effective\ncommunication\nskills\n1.2 Non-verbal\ncommunication\n– body\nlanguage\n1.3 Interpersonal\nSkills\n2. Identify\npatient/client\nneeds\n2.1 Appropriate\ninterpersonal skills\nare used to ensure\nthat patient/client\nneeds are accurately\nidentified\n2.2 Patient/client\nneeds are assessed\nfor urgency so that\npriority for dental\nservice delivery can\nbe identified\n2.3 Patient/client are\nprovided with\n2.1 Patient/Client\nNeeds\n2.2 Dental Procedure\n2.3 Verbal and Non-\nVerbal\nCommunication\n2.4 Cultural and\nSocial\nDifferences\n2.5 Safety Practices\n2.6 Attitude\n2.7 Communication\nProcess\n2.1 Effective\ncommunicatio\nnskills\n2.2 Non-verbal\ncommunicatio\nn – body\nlanguage\n2.3 Interpersonal\nSkills\n\n--- PDF PAGE 127 ---\nDENTAL HYGIENE LEVEL IV Revision 01 Promulgated (01/11/2019) 123\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\ninformation\nregarding dental\nprocedures\n2.4 Personal limitation in\naddressing\npatient/client needs\nis identified and\nwhere appropriate,\nassistance is sought\nfrom dentist\n2.8 Communication\nBarriers\n3. Deliver dental\nservice to\npatient/client\n3.1 Patient/client needs\nare promptly\nattended to in line\nwith dental\nprocedures\n3.2 Appropriate rapport\nis maintained with\npatient/client to\nenable high quality\ndental service\n3.3 Opportunity to\nenhance the quality\nof dental services\nare taken wherever\npossible\n\n3.1 Patient/Client\nNeeds\n3.2 Dental\nProcedure\n3.3 Verbal and Non-\nVerbal\nCommunication\n3.4 Cultural and\nSocial\nDifferences\n3.5 Safety Practices\n3.6 Attitude\n3.7 Communication\nProcess\n3.8 Communication\nBarriers\n3.1 Effective\ncommunication\nskills\n3.2 Non-verbal\ncommunication\n– body\nlanguage\n3.3 Interpersonal\nSkills\n4. Handle queries\nthrough\ntelephone, fax\nmachine,\ninternet and\nemail\n4.1 Use telephone,\ncomputer, fax\nmachine, internet\nefficiently to\ndetermine\npatient/client\nrequirements\n4.2 Queries/\ninformation are\nrecorded in line with\ndental procedure\n4.3 Queries are acted\nupon promptly and\ncorrectly in line with\ndental procedure\n4.1 Use of\ncommunication\nequipment\n4.2 Queries/\nInformation\n4.3 Safety practices\n\n4.1 Effective\ncommunication\nskills\n4.2 Non-verbal\ncommunication\n– body\nlanguage\n4.3 Interpersonal\nSkills\n4.4 Good Time\nManagement\n4.5 Ability to\nhandle\ntelephone\ninquiries and\nconversations\n\n--- PDF PAGE 128 ---\nDENTAL HYGIENE LEVEL IV Revision 01 Promulgated (01/11/2019) 124\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n4.6 Ability to work\ncalmly and\nunobtrusively\neffectively\n4.7 Proper way of\nhandling\ncomplaints\n5. Handle\ncomplaints,\nevaluation and\nrecommendatio\nns\n5.1 Patient/clients are\ngreeted with a smile\nand eye-to-eye\ncontact\n5.2 Responsibility for\nresolving the\ncomplaint is taken\nwithin limit of\nresponsibility\n5.3 Nature and details\nof complaint are\nestablished and\nagreed with the\npatient/client\n5.4 Appropriate\ntreatment is taken\nto resolve the\ncomplaint to the\npatient/client\nsatisfaction\nwherever possible\n\n5.1 Complaints,\nevaluation and\nrecommendation\n5.2 Queries/\nInformation\n5.3 Safety practices\n5.4 Workplace\nPolicies and\nProcedures\n\n5.1 Effective\ncommunication\nskills\n5.2 Non-verbal\ncommunication\n– body\nlanguage\n5.3 Interpersonal\nSkills\n5.4 Good Time\nManagement\n5.5 Ability to\nhandle\ntelephone\ninquiries and\nconversations\n5.6 Ability to work\ncalmly and\nunobtrusively\neffectively\n5.7 Proper way of\nhandling\ncomplaints\n\n--- PDF PAGE 129 ---\nDENTAL HYGIENE LEVEL IV Revision 01 Promulgated (01/11/2019) 125\n\n RANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Non-verbal\ncommunication\nMay include:\n1.1 body language\n1.2 dress and accessories\n1.3 gestures and mannerisms\n1.4 voice tonality and volume\n1.5 use of space\n1.6 culturally specific communication customs and\npractices\n2. Cultural and social\ndifferences\nMay include:\n2.1 modes of greeting, farewelling and conversation\n2.2 body language/ use of body gestures\n2.3 formality of language\n3. Interpersonal skills\nMay include:\n3.1 interactive communication\n3.2 public relation\n3.3 good working attitude\n3.4 sincerity\n3.5 pleasant disposition\n3.6 effective communication skills\n4. Patient/client needs\nMay include :\n4.1 those with a disability\n4.2 those with special cultural or language needs\n4.3 unaccompanied children\n4.4 parents with young children\n4.5 pregnant women\n4.6 single women\n5. Dental clinic procedure\nMay include :\n5.1 modes of greeting and farewell\n5.2 addressing the person by name\n5.3 time-lapse before a response\n5.4 style manual requirements\n5.5 standard letters and proforma\n\n--- PDF PAGE 130 ---\nDENTAL HYGIENE LEVEL IV Revision 01 Promulgated (01/11/2019) 126\n EVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\n\nAssessment requires evidence that the candidate:\n1.1 Complied with industry practices and procedures\n1.2 Used interactive communication with others\n1.3 Complied with occupational, health and safety\npractices\n1.4 Promoted public relation among others\n1.5 Complied with service manual standards\n1.6 Demonstrated familiarity with dental clinic facilities,\nproducts and services\n1.7 Applied dental clinic rules and standards\n1.8 Applied telephone ethics\n1.9 Applied correct procedure in using telephone, fax\nmachine, internet\n1.10 Handled patient/client complaints\n2. Resource\nImplications\nThe following resources should be provided:\n2.1 Availability of telephone, fax machine, internet, etc.\n2.2 Availability of data on projects and services; tariff and\nrates, promotional activities in place etc.\n2.3 Availability of office supplies\n3. Methods of\nAssessment\nCompetency in this unit must be assessed through:\n3.1 Written examination\n3.2 Practical demonstration\n\n4. Context for\nAssessment\n4.1 Assessment may be done in the workplace or in a\nsimulated workplace setting (assessment centers)\n4.2 Assessment activities are carried out through\nTESDA's accredited assessment center\n\n--- PDF PAGE 131 ---\nDENTAL HYGIENE LEVEL IV Revision 01 Promulgated (01/11/2019) 127"
