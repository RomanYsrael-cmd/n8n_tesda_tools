ulated environment\n\n--- PDF PAGE 120 ---\nDENTAL HYGIENE LEVEL IV Revision 01 Promulgated (01/11/2019) 116\n\nUNIT OF COMPETENCY\nMAINTAIN DENTAL RECORDS AND RESOURCES\n\nUNIT CODE\n\nHHC325306\n\nUNIT DESCRIPTOR\n\nThis unit covers the knowledge, skills and attitudes required\nto maintain patients/clients dental records and resources.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Maintain\npatient’s\nrecords\n1.1 Patient’s/client’s vital\nsigns are measured\nand recorded in\naccordance with\nclinic procedures.\n1.2 Patient’s/client’s\nchief complaint are\nprobed and recorded\nin accordance with\nclinic procedures.\n1.3 Where applicable\npatient/client is\nrescheduled for\nanother appointment\nto dental specialist or\nmedical specialist.\n1.4 Returning\npatient’s/client’s\nrecord/dental history\nis retrieved and\nreferred to where\nappropriate.\n1.5 Patient’s/client’s\ndental history/record\nis updated based on\nhygienist or dentist’s\nfindings.\n1.1 Patient’s\nRecords\n1.2 Vital Signs\n1.3 Clinic\nProcedures\n1.4 Relevant\nstandards, policy\nand procedures\non dental\nhygiene practices\n1.5 Relevant\nstatutory and\nlegal\nrequirements\n1.6 Dental Ethics\nand\nJurisprudence\n1.7 Occupational\nSafety and\nHealth\n1.1 Interpersonal\n1.2 Skills\n1.3 Monitoring\npatient’s\nrecords\n1.4 Recording\nand reporting\nskills\n2. Maintain\nfinancial\nrecords of the\nclinic\n2.1 Payments are\nreceived and\nrecorded in\naccordance with\naccounting\nprocedures\n2.2 Billings and other\nrelated\ncommunications are\nprepared and sent to\n2.1 Financial\nRecords\n2.2 Payments\n2.3 Accounting\nProcedures\n2.4 Billings and\nOther Related\nCommunications\n2.1 Interpersonal\n2.2 Skills\n2.3 Maintaining\npatient’s\nfinancial\nrecords\n2.4 Recording\nand\nReporting\nSkills\n\n--- PDF PAGE 121 ---\nDENTAL HYGIENE LEVEL IV Revision 01 Promulgated (01/11/2019) 117\nELEMENT\nPERFORMANCE\nCRITERIA\nItalic