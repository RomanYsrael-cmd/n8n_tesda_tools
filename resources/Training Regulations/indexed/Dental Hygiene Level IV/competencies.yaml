          "source_text": "REQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1.  Assess the \nsituation \n1.1 \nPhysical hazards \nto self and \ncasualty’s health \nand safety are \nidentified. \n1.2 \nImmediate risks  to \nself and casualty’s \noccupational  health \nand safety (OSH \n)are minimized by \ncontrolling the \nhazard in \naccordance with \nOSH requirements. \n1.3 \nCasualty’s vital \nsigns and physical \ncondition are \nassessed in \naccordance with \nworkplace \nprocedures. \n1.1 Physical Hazards \n1.2 Risks \n1.3 Occupational \nSafety and \nHealth Policies \nand Procedures \n1.4 Vital Signs \n1.5 Workplace \nProcedures \n• Assessing \nsituation \n• Report \npreparation \n• Communication \nskills \n• Interpreting and \nusing  listed \ndocuments\n\n--- PDF PAGE 72 ---\nDENTAL HYGIENE LEVEL IV                     Revision 01                     Promulgated (01/11/2019)        68 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are elaborated in \nthe Range of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n2.  Apply basic \nfirst aid \ntechniques \n2.1 \nFirst Aid \nmanagement is \nprovided in \naccordance with \nestablished First \nAid procedures. \n2.2 \nCasualty is \nreassured in a \ncaring and calm \nmanner and made \ncomfortable using \navailable resources. \n2.3 \nFirst Aid assistance \nis sought from \nothers in a timely \nmanner and as \nappropriate. \n2.4 \nCasualty’s \ncondition is \nmonitored and \nresponded to in \naccordance with \neffective First-Aid \nprinciples and \nworkplace \nprocedures. \n2.5 \nDetails of casualty’s \nphysical condition, \nchanges in \nconditions, \nmanagement and \nresponse are \naccurately recorded \nin line with \norganizational \nprocedures. \n2.6 \nCasualty \nmanagement is \nfinalized according \nto his/her needs \nand First Aid \nprinciples. \n2.1 First Aid \nManagement \n2.2 First Aid \nProcedures \n2.3 Occupational \nSafety and \nHealth Policies \nand Procedures \n2.4 Vital Signs \n2.5 Workplace \nProcedures \n2.6 Basic Anatomy \nand Physiology \n• Resuscitation \n• Safe manual \nhandling of \ncasualty \n• Consideration \nof the welfare \nof the casualty \n• Assessing \nsituation \n• Report \npreparation \n• Communication \nskills \n• Interpreting and \nusing listed \ndocuments \n3.  Communicate \ndetails of the \n3.1 Appropriate medical \nassistance is \nrequested using \n3.1 Medical \nAssistance \n3.2 Communication \n3.1 Assessing \nsituation \n3.2 Preparing\n\n--- PDF PAGE 73 ---\nDENTAL HYGIENE LEVEL IV                     Revision 01                     Promulgated (01/11/2019)        69 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are elaborated in \nthe Range of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \nincident \nrelevant \ncommunication \nmedia and \nequipment. \n3.2 Details of casualty’s \ncondition and \nmanagement activities \nare accurately \nconveyed to \nemergency \nservices/relieving \npersonnel. \n3.3 \nReports to \nsupervisors are \nprepared in a timely \nmanner, presenting \nall relevant facts \naccording to \nestablished \ncompany \nprocedures. \nMedia \nEquipment \n3.3 Emergency \nServices \n3.4 Report Writing \n3.5 Workplace \nProcedures \n \nreport  \n3.3 Communicati\non skills \n3.4 Interpreting \nand using \nlisted \ndocuments\n\n--- PDF PAGE 74 ---\nDENTAL HYGIENE LEVEL IV                     Revision 01                     Promulgated (01/11/2019)        70 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. First Aid Management \nThis may include but is not limited to: \n1.1 \nWorkplace policies and procedures \n1.2 \nIndustry/site specific regulations, codes \n1.3 \nOSH \n1.4 \nState and territory workplace health and safety \nrequirements \n1.5 \nAllergies the casualty may have \n2.  Physical Hazards \nPhysical hazards may include: \n2.1 \nWorkplace hazards \n2.2 \nEnvironmental hazards \n2.3 \nProximity of other people \n2.4 \nHazards associated with casualty management \nprocesses \n3.  Risks \nRisks may include: \n3.1 \nWorksite equipment, machinery and substances \n3.2 \nEnvironmental risks \n3.3 \nBodily fluids \n3.4 \nRisk of further injury to the casualty \n3.5 \nRisk associated with the proximity of the others and \nbystanders \n4 Casualty’s Condition \nCasualty’s condition may include but be not limited to the \nfollowing: \n4.1 \nAbdominal injuries \n4.2 \nAllergic reactions \n4.3 \nBleeding \n4.4 \nBurns-thermal, chemical, friction, electrical \n4.5 \nCardiac conditions \n4.6 \nChemical contamination \n4.7 \nCod injuries \n4.8 \nCrush injuries \n4.9 \nDislocations \n4.10 Drowning \n4.11 Eye injuries \n4.12 Fractures \n4.13 Head injuries \n4.14 Epilepsy \n4.15 Minor skin injuries \n4.16 Neck and spinal injuries \n4.17 Needle stick injuries \n4.18 Poisoning and toxic substances \n4.19 Shock \n4.20 Smoke inhalation\n\n--- PDF PAGE 75 ---\nDENTAL HYGIENE LEVEL IV                     Revision 01                     Promulgated (01/11/2019)        71 \n \nVARIABLE \nRANGE \n5. Equipment and \nResources \nEquipment and other resources may include: \n5.1 \nDefibrillation units \n5.1 \nPressure bandages \n5.2 \nThermometers \n5.3 \nFirst Aid kit \n5.4 \nEyewash \n5.5 \nThermal blankets \n5.6 \nPocket face masks \n5.7 \nRubber gloves \n5.8 \nDressing \n5.9 \nSpace device \n5.10 Cervical collars \n6. Communication \nSystem \n6.1 \nMobile phone \n6.2 \nSatellite phones \n6.3 \nHF/VHF radio \n6.4 \nFlags \n6.5 \nFlares \n6.6 \nTwo-way radio \n6.7 \nEmail \n6.8 \nElectronic equipment \n7. Vital Signs \n7.1 \nBreathing \n7.2 \nCirculation \n7.3 \nConsciousness \n8. First Aid Principles \n8.1 \nChecking the site for danger to self, casualty and \nothers and minimizing the danger \n8.2 \nChecking and maintaining the casualty’s airways, \nbreathing and circulation\n\n--- PDF PAGE 76 ---\nDENTAL HYGIENE LEVEL IV                     Revision 01                     Promulgated (01/11/2019)        72"
