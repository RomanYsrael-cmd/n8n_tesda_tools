        "source_text": "HHC325303\nUNIT DESCRIPTOR:\nThis unit covers the knowledge, skills and attitudes required\nto operate dental radiographic equipment and position the\npatient and radiographic film in order to produce an\ninterpretable diagnostic image\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Position patient\nto obtain\nradiographic\nimage\n\n1.1 Radiation safety\nmeasures for\npatient, operator\nand others are\nimplemented and\nmaintained\nthroughout the\nprocedures.\n1.2 Patient is positioned\nin accordance with\nradiographic\nprocedures\n1.1 Legislative and\nethical\nresponsibilities\nfor the safe use\nof radiation in\ndentistry\n1.2 Relevant\nlegislation and\nstatutory\nrequirements of\nconsent\n1.3 Fundamental\nknowledge of the\nradiographic\nappearance of\nanatomic\nlandmarks,\nnormal dentition\nand association\nbony structures\nfor intraoral\nradiographs\n1.4 Fundamental\nknowledge of the\nradiographic\nappearance of\ndental anomalies\nand common oral\npathological\nconditions\n1.5 Range od dental\nradiographic\nimaging\ntechniques and\nthe reasons for\nselection of each\n1.1 Operating\nradiographic\nunit\n1.2 Observing\nsafety and\nhealth\nprecautions\nin dental\nradiography\n1.3 Minimizing\ntechnical\ninaccuracies\nin dental\nradiographic\nimages\n1.4 Using terms\nfor technical\ninaccuracies\nin dental\nradiographic\nimages\n1.5 Processing\nand\nmaintaining\nquality and\nsafety in\nusing and\nprocessing\nexposed\ndental\nradiographic\nfilm\n1.6 Using\nliteracy skills\nto read and\nfollow\n\n--- PDF PAGE 99 ---\nDENTAL HYGIENE LEVEL IV Revision 01 Promulgated (01/11/2019) 95\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\ntechnique\n1.6 Features and\ncharacteristics\nincluding range\nof movements of\na range of dental\nradiographic\nequipment\n1.7 Reasons for\nprocessing an