        "source_text": "--- PDF PAGE 64 ---\nDENTAL HYGIENE LEVEL IV                     Revision 01                     Promulgated (01/11/2019)        60 \nUNIT OF COMPETENCY: \nMAINTAIN INFECTION CONTROL IN DENTAL \nLABORATORY PRACTICE \nUNIT CODE: \nHHC346205 \nUNIT DESCRIPTOR: \nThis unit covers the knowledge, skills and attitudes required to \ncomply with infection control procedures before, during and \nafter health care procedures. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are elaborated in \nthe Range of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1 \nMonitor and \nmaintain the \ncleanliness of \nthe dental \nlaboratory  \n \n1.1 \nAppropriate \npersonal protective \nwear is used during \ncleaning of \nequipment and \nsurfaces. \n1.2 \nAppropriate \ndisinfectants and \ncleaning equipment \nare selected, \nprepared and used \non surfaces in \naccordance with the \nmanufacturer’s \nspecification. \n1.3 \nUsed surface \ncovers, if \napplicable, are \nremoved and \nreplaced in a \nmanner to prevent \ncross \ncontamination. \n1.4 \nCleaning \nequipment is \ncorrectly stored. \n1.5 \nAll surfaces \nincluding internal \nstorage units within \nthe dental \nlaboratory are \nmonitored and \nmaintained for \ncleanliness. \n1.1 Knowledge \non how \ninfection is \nspread, cross \ninfection and \nprevention \nstrategies \n1.2 Knowledge of \nrelevant OSH \npolicies and \nprocedures \n1.3 Limitations, \nproperties \nand \nprecautions \nrequired of \ndisinfectants \nand \ndecontaminat\nes \n1.4 Knowledge of \npotential \nhazards in a \nhealth \nenvironment \n1.5 Knowledge of \ncurrently \navailable \nvaccinations \nagainst \ntransmissible \ndisease \n1.6 Knowledge of \ndental \nlaboratory \nwaste \ndisposal \n1.1 Applying standard \nand additional \nprecautions \n1.2 Using safe work \npractices to minimize \nthe risk of \ntransmission of \ninfection \n1.3 Selecting and using \nappropriate \nchemicals in cleaning \nand sanitizing \n1.4 Using correct hand \nwashing and hand \ncare techniques \n1.5 Using correct \nhygiene procedures \n1.6 Selecting and using \nequipment and \ncleaning agents \neffectively \n1.7 Using procedures \nappropriate to the \ncleansing area and \npurpose \n1.8 Minimizing disruption \nto the work \nenvironment \n1.9 Minimizing safety \nhazards for self and \nothers \n1.10 \nUsing time \nmanagement \nstrategies to set \npriorities \n1.11 \nUsing technology\n\n--- PDF PAGE 65 ---\nDENTAL HYGIENE LEVEL IV                     Revision 01                     Promulgated (01/11/2019)        61 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are elaborated in \nthe Range of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \nmethods \nto work safely and \ncompetently \n2 \nClean and \ndisinfect \ndental \nlaboratory \n/instruments \nand \nequipment  \n2.1 \nDental laboratory \ninstruments and \nequipment are \ncleaned of bio-\nburden and \nlubricated, where \nappropriate, prior to \ncleaning and \ndisinfecting. \n2.2 \nDental laboratory \ninstruments and \nequipment are \nchecked for faults \nand disassembled \nwhere appropriate. \n2.3 \nPrior to cleaning of \ndental laboratory \ninstruments and \nequipment are \nloaded safely and \neffectively. \n2.4 \nAppropriate \ncleaning \nprocedures are \ncarried out in the \ncorrect sequence \nand duration in \naccordance with \nmanufacturer \nspecifications. \n2.5 \nRegular \nmaintenance \nprogram including \nfaults and \nincidences are \nrecognized, \nreported and \ndocumented. \n2.1 Knowledge \non how \ninfection is \nspread, cross \ninfection and \nprevention \nstrategies \n2.2 Knowledge of \nrelevant OSH \npolicies and \nprocedures \n2.3 Limitations, \nproperties \nand \nprecautions \nrequired of \ndisinfectants \nand \ndecontaminat\nes \n2.4 Knowledge of \npotential \nhazards in a \nhealth \nenvironment \n2.5 Knowledge of \ncurrently \navailable \nvaccinations \nagainst \ntransmissible \ndisease \n2.6 Knowledge of \ndental \nlaboratory \nwaste \ndisposal \nmethods \n2.1 Applying standard \nand additional \nprecautions \n2.2 Using safe work \npractices to minimize \nthe risk of \ntransmission of \ninfection \n2.3 Selecting and using \nappropriate \nchemicals in cleaning \nand sanitizing \n2.4 Using correct hand \nwashing and hand \ncare techniques \n2.5 Using correct \nhygiene procedures \n2.6 Selecting and using \nequipment and \ncleaning agents \neffectively \n2.7 Using procedures \nappropriate to the \ncleansing area and \npurpose \n2.8 Minimizing disruption \nto the work \nenvironment \n2.9 Minimizing safety \nhazards for self and \nothers \n2.10 Using time \nmanagement \nstrategies to set \npriorities \n2.11 Using technology to \nwork safely and \ncompetently\n\n--- PDF PAGE 66 ---\nDENTAL HYGIENE LEVEL IV                     Revision 01                     Promulgated (01/11/2019)        62 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are elaborated in \nthe Range of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n3 \nMaintain \nhygiene and \npersonal \nprotection  \n \n3.1 \nHand washing \nprocedures are \ncorrectly followed. \n3.2 \nOpen cuts and \nabrasions are \ncovered with a \nwaterproof \ndressing. \n3.3 \nAppropriate \npersonal \nprotection wear is \ncorrectly worn. \n3.4 \nImmunization is \nundertaken in \naccordance with \ncurrent \nrecommendations \nfor dental health \ncare worker. \n3.5 \nAll work is carried \nout in a manner that \nminimizes the risk \nof cross \ncontamination and \ncomplies with OHS \npolicy and \nprocedures. \n3.6 \nHazards in the \ndental laboratory is \nrecognized and \nreported to \noperator. \n3.7 \nAppropriate \nprocedures for \ndealing with \naccidents, including \nsharp injuries, are \nfollowed correctly. \n3.1 Knowledge \non how \ninfection is \nspread, cross \ninfection and \nprevention \nstrategies \n3.2 Knowledge of \nrelevant OSH \npolicies and \nprocedures \n3.3 Limitations, \nproperties \nand \nprecautions \nrequired of \ndisinfectants \nand \ndecontaminat\nes \n3.4 Knowledge of \npotential \nhazards in a \nhealth \nenvironment \n3.5 Knowledge of \ncurrently \navailable \nvaccinations \nagainst \ntransmissible \ndisease \n3.6 Knowledge of \ndental \nlaboratory \nwaste \ndisposal \nmethods \n3.1 Applying standard \nand additional \nprecautions \n3.2 Using safe work \npractices to minimize \nthe risk of \ntransmission of \ninfection \n3.3 Selecting and using \nappropriate \nchemicals in cleaning \nand sanitizing \n3.4 Using correct hand \nwashing and hand \ncare techniques \n3.5 Using correct \nhygiene procedures \n3.6 Selecting and using \nequipment and \ncleaning agents \neffectively \n3.7 Using procedures \nappropriate to the \ncleansing area and \npurpose \n3.8 Minimizing disruption \nto the work \nenvironment \n3.9 Minimizing safety \nhazards for self and \nothers \n3.10 Using time \nmanagement \nstrategies to set \npriorities \n3.11 Using technology \nto work safely and \ncompetently \n4 \nDispose of \ndental \nlaboratory \nwaste safely \n4.1 \nAppropriate \nprotective clothing \nis worn or used in \naccordance with \nOHS policy and \n4.1 Knowledge \non how \ninfection is \nspread, cross \ninfection and \n4.1 Applying standard \nand additional \nprecautions \n4.2 Using safe work \npractices to minimize\n\n--- PDF PAGE 67 ---\nDENTAL HYGIENE LEVEL IV                     Revision 01                     Promulgated (01/11/2019)        63 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are elaborated in \nthe Range of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \nprocedures when \nhandling waste. \n4.2 \nWaste is \nsegregated, \ncontained, stored \nand transported \ncorrectly. \n4.3 \nDamaged and/or \npre-packed items \nare disposed of \nsafely. \n4.4 \nWaste is disposed \nof safely. \nprevention \nstrategies \n4.2 Knowledge of \nrelevant OSH \npolicies and \nprocedures \n4.3 Limitations, \nproperties \nand \nprecautions \nrequired of \ndisinfectants \nand \ndecontaminat\nes \n4.4 Knowledge of \npotential \nhazards in a \nhealth \nenvironment \n4.5 Knowledge of \ncurrently \navailable \nvaccinations \nagainst \ntransmissible \ndisease \n4.6 Knowledge of \ndental \nlaboratory \nwaste \ndisposal \nmethods \nthe risk of \ntransmission of \ninfection \n4.3 Selecting and using \nappropriate \nchemicals in cleaning \nand sanitizing \n4.4 Using correct hand \nwashing and hand \ncare techniques \n4.5 Using correct \nhygiene procedures \n4.6 Selecting and using \nequipment and \ncleaning agents \neffectively \n4.7 Using procedures \nappropriate to the \ncleansing area and \npurpose \n4.8 Minimizing disruption \nto the work \nenvironment \n4.9 Minimizing safety \nhazards for self and \nothers \n4.10 Using time \nmanagement \nstrategies to set \npriorities \n4.11 Using technology \nto work safely and \ncompetently\n\n--- PDF PAGE 68 ---\nDENTAL HYGIENE LEVEL IV                     Revision 01                     Promulgated (01/11/2019)        64 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are elaborated in \nthe Range of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n5 \nUndertake \nthe \nnecessary \nmeasures to \nensure \nprevention of \ntransmission \nof infection \n5.1 \nRisks of cross \ncontamination are \nidentified and \nappropriate \nresponses \nimplemented within \ndental practice. \n5.2 \nClean, \ncontaminated and \nadministrative \nzones are clearly \nidentified and \nmaintained. \n5.3 \nInstruments, \nmaterials, \nmedicaments and \nequipment are set \nup prior to \ncommencement of \ntreatment where \nappropriate. \n5.4 \nOne-way workflow \nfrom clean to dirty \nzone is maintained. \n5.5 \nRisk of \ntransmission of \ninfection is \nminimized in all \ndental laboratory \nrelated and \nadministrative \nprocedures. \n5.6 \nSpills are removed \ncorrectly. \n5.1 Knowledge \non how \ninfection is \nspread, cross \ninfection and \nprevention \nstrategies \n5.2 Knowledge of \nrelevant OSH \npolicies and \nprocedures \n5.3 Limitations, \nproperties \nand \nprecautions \nrequired of \ndisinfectants \nand \ndecontaminat\nes \n5.4 Knowledge of \npotential \nhazards in a \nhealth \nenvironment \n5.5 Knowledge of \ncurrently \navailable \nvaccinations \nagainst \ntransmissible \ndisease \n5.6 Knowledge of \ndental \nlaboratory \nwaste \ndisposal \nmethods \n5.1 Applying standard \nand additional \nprecautions \n5.2 Using safe work \npractices to \nminimize the risk of \ntransmission of \ninfection \n5.3 Selecting and using \nappropriate \nchemicals in \ncleaning and \nsanitizing \n5.4 Using correct hand \nwashing and hand \ncare techniques \n5.5 Using correct \nhygiene procedures \n5.6 Selecting and using \nequipment and \ncleaning agents \neffectively \n5.7 Using procedures \nappropriate to the \ncleansing area and \npurpose \n5.8 Minimizing \ndisruption to the \nwork environment \n5.9 Minimizing safety \nhazards for self and \nothers \n5.10 Using time \nmanagement \nstrategies to set \npriorities \n5.11 Using technology to \nwork safely and \ncompetently\n\n--- PDF PAGE 69 ---\nDENTAL HYGIENE LEVEL IV                     Revision 01                     Promulgated (01/11/2019)        65 \nRANGE OF VARIABLES \nVARIABLE \nRANGE \n1. \nInfection control \nguidelines and \nprocedures \nMay include but are not limited to: \n1.1 \nCurrent DOH guidelines for infection control in health \ncare settings \n1.2 \nStandard Precautions and Additional Precautions as \ndefined by DOH \n1.3 \nDental laboratory practice/organizational policy \nprocedures and infection control guidelines and \nprocedures \n1.4 \nMaterial Safety Data Sheets (MSDS) \n1.5 \nLocal government ordinances \n1.6 \nLegislative requirements \n2. \nPersonal protective \nwear \nMay include but not limited to: \n2.1 \nSterile and non sterile gloves including heavy duty \n2.2 \nMasks \n2.3 \nEye protection \n2.4 \nEnclosed footwear \n2.5 \nGowns \n2.6 \nAprons \n3. \nCleaning equipment May include but is not limited to: \n3.1 \nUltrasonic cleaner \n3.2 \nManual cleaning with a range of brushes \n3.3 \nDrying  \n3.4 \nBuckets and mops \n4 \nWaste segregation \nMay include but is not limited to: \n4.1 \nClinical and related waste \n4.2 \nInfectious waste \n4.3 \nSharps \n4.4 \nGeneral waste \n4.5 \nOther hazardous substances \n5 \nRequirements for \nsafe disposal of \nwaste \nMay be determined by: \n5.1 \nMain drainage \n5.2 \nLocal government ordinances \n5.3 \nMaterial Safety Data Sheet (MSDS)\n\n--- PDF PAGE 70 ---\nDENTAL HYGIENE LEVEL IV                     Revision 01                     Promulgated (01/11/2019)        66 \nEVIDENCE GUIDE \n \n1. \nCritical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 \nDemonstrated knowledge of infection risks in health \nenvironment and specifically in dental laboratory practice \n1.2 \nComplied with current DOH infection control guidelines \nand procedures, OHS and legislative requirements  \n1.3 \nHandled waste safely managed procedures in \naccordance with legislative requirements \n1.4 \nSelected and used appropriate cleaning agents for \nparticular surfaces and equipment in accordance with the \nmanufacturer’s specifications \n2. Resource \nImplications \n \nThe following resources MUST be provided: \n2.1 \nRelevant dental laboratory practice/organizational policy \nand procedures \n2.2 \nIncident reporting procedures \n2.3 \nOccupational health and safety policy and procedures \n2.4 \nInfection control guidelines \n2.5 \nWaste management policies \n2.6 \nRelevant state legislations \n2.7 \nManufacturer’s instructions for the use of relevant \nequipment, instruments, medicaments, materials and \nMaterial Safety Data Sheets (MSDS) \n2.8 \nCleaning agents currently used in the workplace \n3. Methods of \nAssessment \nCompetency may be assessed through: \n3.1 \nWritten Test/Examination \n3.2 \nDemonstration with questioning \n3.3 \nObservation with questioning \n3.4 \nPortfolio  \n3.5 \nThird Party Report \n4. Context of \nassessment \n4.1 \nCompetency may be assessed in the workplace or in a \nsimulated work setting.\n",
