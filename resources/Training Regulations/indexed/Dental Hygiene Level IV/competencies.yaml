        "source_text": "--- PDF PAGE 107 ---\nDENTAL HYGIENE LEVEL IV                     Revision 01                     Promulgated (01/11/2019)        103 \n \nUNIT OF COMPETENCY \nAPPLY THE PRINCIPLE OF RADIATION BIOLOGY AND \nPROTECTION IN DENTAL PRACTICE \nUNIT CODE \nHHC325304 \nUNIT DESCRIPTOR \nThis unit covers the knowledge, skills and attitudes required to \nminimize the risk of radiation to the client, the operator and \nothers during the exposure of a prescribed dental radiographic \nimage. It also describes the quality assurance measures \nnecessary to ensure all radiographs are of consistent diagnostic \nstandard. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are elaborated in \nthe Range of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Apply \nknowledge of \nionizing \nradiation to \nproduce a \ndental \nradiograph \n \n1.1 Knowledge of X-ray \nproperties is \ndemonstrated in \naccordance with \noccupational health \nand safety policies \nand procedures in \nminimizing radiation \nrisks. \n1.2 Technical variables of \ndental X-ray \ngenerating equipment \nare identified and \nselected in \naccordance with \nmanufacturer’s \nspecifications and \nclient requirements \n1.3 The main \ncomponents of \ntubehead are \nidentified \n1.4 Appropriate \ntechnique for the type \nof cone is identified \nand selected \n1.1 Code of \npractice for \nradiation \nprotection in \ndentistry \n1.2 Production, \nproperties and \ninteraction of \nthe x-rays \n1.3 Biological \neffects and \nrisks \nassociated with \nx-rays \n1.4 Units of \nradiation \nmeasurements \n1.5 Radiographic \nappearance of \nanatomic \nlandmarks, \nnormal \ndentition and \nassociated \nbony structures \n1.6 Reasons for \nprocessing and \ntechnique \ninaccuracies \nand methods to \nminimize errors \n1.1 Using safe \nwork practices \nto minimize \nthe risk of \ntransmission \nof infection \n1.2 Using correct \naccessories in \ndental \nradiographic \ntechniques \n1.3 Minimizing 