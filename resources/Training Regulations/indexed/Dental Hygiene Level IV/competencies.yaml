\n3.1 Utilizing and\nimplementing\nstrategies\n\n--- PDF PAGE 61 ---\nDENTAL HYGIENE LEVEL IV Revision 01 Promulgated (01/11/2019) 57\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\ndirected to\nprevent\ninfection in the\nworkplace\npractices are\nfollowed.\n3.3\nAny items that may\nbe contaminated\nare disposed of\nsafely.\nand Procedures\n3.2 Workplace\nProcedures\n3.3 Personal\nHygiene\n3.4 Disposal\nProcedures\n3.2 Safe work\npractices to\nprevent or\nminimize risk\n3.3 Reading and\nwriting skills\n3.4 Oral\ncommunication\n4\nUtilize\nstrategies to\nprevent stress\noverload\n4.1\nNominated rest\ntime and breaks\nare taken.\n4.2\nSources of stress\nare identified and\nissues raised with\nsupervisor.\n4.3\nWork roles are\nclarified and\nfollowed.\n4.1 Stress\n4.2 Work Roles\n4.3 Workplace\nProcedures\n4.1 Utilizing and\nimplementing\nstrategies\n4.2 Safe work\npractices to\nprevent or\nminimize risk\n4.3 Reading and\nwriting skills\n4.4 Oral\ncommunication\n5\nWork in a safe\nmanner\n5.1\nDefined procedures\nare followed to\nensure personal\nsafety.\n5.2\nAll work is carried\nout in a manner\nwhich ensures\nsafety of self and\nothers\n5.3\nOrganizational\nsecurity measures\nare followed.\n5.4\nSafe manual\nhandling procedures\nare followed.\n5.1 Workplace\nProcedures\n5.2 Organizational\nSecurity\nMeasures\n5.3 Safe Handling\nManual\nProcedures\n5.1 Working in a\nsafe manner\n5.2 Safe work\npractices to\nprevent or\nminimize risk\n5.3 Reading and\nwriting skills\n5.4 Oral\ncommunication\n5.5 Safe handling\ntechniques\n\n--- PDF PAGE 62 ---\nDENTAL HYGIENE LEVEL IV Revision 01 Promulgated (01/11/2019) 58\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1.\nWorkplace\nprocedures for\ncontrolling risks\n\nMay include:\n1.1\nManual handling techniques\n1.2\nSafe handling, storage and disposal of inflammable or\npotentially dangerous substances\n1.3\nStrategies for reducing the amount of manual\n