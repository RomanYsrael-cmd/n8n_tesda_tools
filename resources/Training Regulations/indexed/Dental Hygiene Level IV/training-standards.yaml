3.4.3 Perform Dental\nRadiographic Infection\nControl, Ownership and\nDocumentatio\n\n• Lecture\n\n• Demonstration\n• Role Playing\n• OJT\n\n• Demonstration\n• OJT\n• Lecture\n\n• Written Examination\n\n• Observation\n\n• Observation\n\n660 hours\n\n--- PDF PAGE 187 ---\nDENTAL HYGIENE LEVEL IV Revision 01 Promulgated (01/11/2019) 183\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nMethod\nNominal\nDuration\n4\nApply the\nprinciple of\nradiation\nbiology and\nprotection in\ndental practice\n4.1 Apply knowledge of\nionizing radiation to\nproduce a dental\nradiograph\n4.2 Apply knowledge of\nradiation biology to\nprotect patient,\noperator and\nothers from\nionizing radiation\n4.3 Determine image\ncharacteristics of a\ndental radiographic\nimage to minimize\nthe necessity for\nretake\n4.4 Minimize radiation\nby maintaining\nquality in\nprocessing\n\n• Lecture/\nDemonstration\n• OJT\n\n• Written Examination\n• Demonstration\n• Observation\n500 hours\n5\nPerform\nscaling and\npolishing\n5.1 Perform dental\ndiagnosis on\npatient\n5.2 Scale and polish\nteeth\n5.3 Provide advice to\npatient\n\n• Lecture/\nDemonstration\n• OJT\n\n• Written Examination\n• Demonstration\n• Observation\n700 hours\n\n--- PDF PAGE 188 ---\nDENTAL HYGIENE LEVEL IV Revision 01 Promulgated (01/11/2019) 184\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nMethod\nNominal\nDuration\n\n•\n• Written\nExamination\n• Demonstration\n• Observation\n\n6\nMaintain dental\nrecords and\nresources\n6.1 Maintain patient’s\nrecords\n6.2 Maintain financial\nrecords of the clinic\n6.3 Purchase dental\nproducts\n6.4 Monitor quality\ncontrol\n6.5 Comply with dental\nethics and\njurisprudence\n\n•\nLecture/\nDemonstration\n•\nOJT\n•\n241 hours\n\n--- PDF PAGE 189 ---\nDENTAL HYGIENE LEVEL IV Revision 01 Promulgated (01/11/2019) 185\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nMethod\nNominal\nDuration