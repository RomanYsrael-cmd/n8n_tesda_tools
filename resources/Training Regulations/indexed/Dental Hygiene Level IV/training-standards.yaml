ry performance of all\nspecified competencies.\n\n2. The competency-based TVET system recognizes various types of delivery\nmodes, both on-and off-the-job as long as the learning is driven by the\ncompetency standards specified by the industry. The following training\nmodalities and their variations/ components may be adopted singly or in\ncombination with other modalities when designing and delivering training\nprograms:\n\n2.1.\nInstitution- Based:\n\n• Dual Training System (DTS)/Dualized Training Program (DTP)\nwhich contain both in-school and in-industry training or fieldwork\ncomponents. Details can be referred to the Implementing Rules\nand Regulations of the DTS Law and the TESDA Guidelines on\nthe DTP;\n\n• Distance learning is a formal education process in which\nmajority of the instruction occurs when the students and\ninstructor are not in the same place. Distance learning may\nemploy\ncorrespondence\nstudy,\naudio,\nvideo,\ncomputer\n\n--- PDF PAGE 191 ---\nDENTAL HYGIENE LEVEL IV Revision 01 Promulgated (01/11/2019) 187\ntechnologies or other modern technology that can be used to\nfacilitate learning and formal and non-formal training. Specific\nguidelines on this mode shall be issued by the TESDA\nSecretariat.\n• The traditional classroom-based or in-center instruction may be\nenhanced through use of learner-centered methods as well as\nlaboratory or field-work components.\n\n3.3 TRAINEE ENTRY REQUIREMENTS:\n\nTrainees or students who wants to undergo training should possess the\nfollowing requirements:\n\n➢ Must have completed twelve (12) years of basic education (Senior High\nSchool) or Alternative Learning System (ALS) Certificate of Completion with\ngrade twelve (12) equivalent holder\n➢ Must be physically and;\n➢ Must have good communication skills\n\n3.4 TOOLS, MATERIALS AND EQUIPMENT:\nDENTAL HYGIENE LEVEL IV\n\nRecommended list of instruments, equipment and dental materials for the\ntraining of 25 trainees for DENTAL HYGIENE LEVEL IV are as fol