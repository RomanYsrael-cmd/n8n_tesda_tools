  "source_section_text": "SECTION 3 TRAINING STANDARDS\n\nThese standards are set to provide Technical and Vocational Education and Training\n(TVET) providers with information and other important requirements to consider when\ndesigning training programs for DENTAL HYGIENE LEVEL IV.\n\nThey include information on curriculum design, training delivery, trainee entry\nrequirements, tools, materials and equipment, training facilities and trainers qualification.\n\n3.1 CURRICULUM DESIGN\n\nCourse Title: DENTAL HYGIENE NC Level: LEVEL IV\n\nNominal Training Hours: 3499 Hours (Includes 1056 Hours OJT*)\n\n 92 Hrs. Basic Competencies\n 56 Hrs. Common Competencies\n 3351 Hrs. Core Competencies\n 3499 Hrs. Total\n 1056 Hrs. OJT\nCourse Description:\n\nThis course is designed to enhance the knowledge, skills and attitudes of an individual\nin the field of DENTAL HYGIENE in accordance with industry standards. It covers core\ncompetencies such as: performing oral examination, promoting oral health and hygiene,\noperating a dental radiographic equipment, applying the principle of radiology, biology and\nprotection in dental practice, performing scaling and polishing, maintaining dental records\nand resources, and providing effective patient’s/clients service.\nThis includes the common competencies: Maintain an effective relationship with\ncustomers and clients, maintain instruments and equipment in the work area, manage own\nperformance, follow occupational health and safety policies in dental facilities, maintain\ninfection control in dental practice, apply basic first aid and operate a personal computer.\nIt also includes competencies such as: Utilize specialized communication skills,\ndevelop teams and individuals, apply problem solving techniques in the workplace, collect,\nanalyse and organize information, plan and organize work and promote environmental\nprotection.\nThis list does not include specific institutional requirements such as educational\nattainment, appropriate work experience, and others that may be required of the trainees by\nthe school of training center delivering this TVET program.\nThe above requirements will satisfy the prescribed 2 years certificate in dental\nhygiene with at least 6 months OJT in the IRR of Republic Act 9484 (PRC Board of Dentistry\nResolution No. 12 s. 2007).\nCompletion of the two-year course and the six- month on-the-job training is required\nfor those applying for the PRC licensure exam.\nPursuant to the provision of the IRR of Republic Act 9484, the Dental Hygiene Level\nIV program shall be registered in UTPRAS to a recognized and legally constituted college, or\nschool of dentistry.\n*Note: The OJT should be at least six months and may be integrated/embedded in the two-\nyear program.\n\n--- PDF PAGE 132 ---\nDENTAL HYGIENE LEVEL IV Revision 01 Promulgated (01/11/2019) 128\nBASIC COMPETENCIES\n(92 Hours)\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nMethod\nNominal\nDuration\n1. Utilize\nspecialized\ncommunication\nskills\n\n1.1 Meet common and\nspecific\ncommunication\nneeds of clients\nand colleagues\n\n•\nRead\n➢ Communication process\n➢ Dynamics of groups and different\nstyles of group leadership\n•\nIdentify different approaches to meet\nthe needs of clients and colleagues\n•\nLecture\n•\nWritten\nexamination\n1 hour\n1.2. Contribute to the\ndevelopment of\ncommunication\nstrategies\n•\nApply communication skills to fulfill\njob roles as specified by the\norganization\n•\nApply communication techniques in\ncommunicating with clients and\ncolleagues\n➢ Active listening\n➢ Feedback\n➢ Interpretation\n➢ Role boundaries setting\n➢ Negotiation\n➢ Establishing empathy\n•\nDescribe strategies for internal and\nexternal dissemination of information\n•\nDemonstration\n•\nGroup\ndiscussion\n•\nObservation\n•\nOral\nevaluation\n1 hour\n\n1.3. Represent the\norganization\n\n•\nDescribe criteria for a good\npresentation\n•\nPrepare presentation material for\ninternal or external forums to promote\nthe organization\n•\nUse appropriate media to enhance\nthe presentation\n•\nDemonstration\n•\nObservation\n1 hour\n\n--- PDF PAGE 133 ---\nDENTAL HYGIENE LEVEL IV Revision 01 Promulgated (01/11/2019) 129\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nMethod\nNominal\nDuration\n1.4. Facilitate group\ndiscussion\n•\nGather relevant information\n•\nApply values in facilitating differences\nin views\n•\nDemonstration\n•\nObservation\n1 hour\n1.5. Conduct interview\n•\nDescribe communication strategies\nemployed in interview situations\n•\nConduct interview\n•\nApply organizations procedure in\nmaintaining records of interviews\n•\nUse questioning, listening and\nnonverbal communication techniques\nto client groups\n•\nGroup\ndiscussion\n•\nDemonstration\n•\nOral\nevaluation\n•\nObservation\n1 hour\n2. Develop and\nLead Teams\n2.1 Provide team\nleadership\n• Discussion on Team Leadership and\nexpectation from team leaders\n• Case study on learning and development\nneeds of team members\n• Discussion on organizational\nrequirements from team members\n• Role play on coaching and mentoring\n• Discussion on preparation of team\nmembers development plan\n• Role Play on providing feedback on\nperformance\n•\nObservation\nLecture/\nDiscussion\n•\nCase Study\n•\nRole Play\n•\nRole Play\n•\nCase Study\n•\nWritten Test\n• Observation\n• Role Play\n• Case Study\n▪ Written Test\n2 hours\n2.2 Foster individual\nand organizational\ngrowth\n• Discussion on learning and development\nprogram goal setting\n• Preparation of learning and development\nprogram goals\n• Discussion on learning delivery methods\n• Role play on the different learning\ndelivery methods\n• Discussion on workplace learning\nopportunities\n• Role play on coaching and mentoring\n• Lecture/ Discussion\n• Case Study\n• Role Play\n• Observation\n• Role Play\n• Case Study\n• Written Test\n2 hours\n\n--- PDF PAGE 134 ---\nDENTAL HYGIENE LEVEL IV Revision 01 Promulgated (01/11/2019) 130\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nMethod\nNominal\nDuration\n\n2.3 Monitor and\nevaluate\nworkplace learning\n•\nDiscussion on the different levels of\nlearning evaluation.\n•\nDiscussion on the different methods\nused to evaluate learning\n•\nDevelop reporting system for\nmonitoring of performance attributed\nto learning programs\n•\nGathering of information to evaluate\nindividual performance attributed to\nlearning programs\n•\nCase study on modification of\nlearning plan based on performance\n• Lecture/ Discussion\n• Case Study\nRole Play\n• Observation\n• Role Play\n• Case Study\n• Written Test\n2 hours\n\n2.4 Develop team\ncommitment and\ncooperation\n•\nDiscussion on team commitment and\ncooperation and its impact to\nattainment of goals\n•\nPlay games on team commitment\nand cooperation\n•\nDiscussion on team dynamics and its\nrelation to team performance\n•\nPlay games on team dynamics and\nperformance\n•\nDevelopment of career plans\n\n• Lecture/ Discussion\n• Case Study\n• Role Play\n• Observation\n• Role Play\n• Case Study\n• Written Test\n1 hour\n\n--- PDF PAGE 135 ---\nDENTAL HYGIENE LEVEL IV Revision 01 Promulgated (01/11/2019) 131\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nMethod\nNominal\nDuration\n\n2.5 Facilitate\naccomplishment of\norganizational\ngoals\n• Perform team building activities towards\nimproving communication among team\nmembers, goal setting and improving\nperformance\n• Case studies involving collaborative\nactivities to improve attainment of group\ngoals\n• Group Activity\n• Case Study\n\n• Role Play\n• Case Study\n• Observation\n1 hour\n3. Perform\nhigher-order\nthinking\nprocesses and\napply\ntechniques in\nthe workplace\n3.1 Evaluate\neffectiveness and\nefficiency of the\nworkplace systems,\nprocesses and\nprocedures\n• Examine current systems, standards,\nprocedures and protocols in the\nworkplace\n• Discuss different methods of critical and\nappreciative inquiry and their relevance\nto different situations\n• Form habit of asking questions and\ntaking responsibility for answers\n• Appreciate importance of why questions\nfor individuals, businesses and\ncommunities\n• Use range of analytical techniques\n• Examine different strategies and\ntechniques in communicating results,\napplying critical thinking pathway,\nassessing effectiveness and efficiency\nof systems, processes and procedures\n\n• Group discussion\n• Lecture\n• Demonstration\n• Role playing\n• Case Formulation\n• Life Narrative\nInquiry (Interview)\n• Standardized test\n1 hour\n\n--- PDF PAGE 136 ---\nDENTAL HYGIENE LEVEL IV Revision 01 Promulgated (01/11/2019) 132\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nMethod\nNominal\nDuration\n\n3.2 Foster the habit of\ncritical inquiry and\ncuriosity in the\nworkplace\n• Discuss different methods of critical and\nappreciative inquiry and their relevance\nto different situations\n• Form habit of asking questions and\ntaking responsibility for answers\n• Appreciate importance of why questions\nfor individuals, businesses and\ncommunities\n• Use range of analytical techniques,\ngrowth mindset and positive\ncommunication strategies\n• Examine different strategies and\ntechniques in communicating results,\napplying critical thinking pathway,\nassessing effectiveness and efficiency of\nsystems, processes and procedures\n• Discuss insights on workplace\neffectiveness and efficiency\n• Group discussion\n• Lecture\n• Demonstration\n• Role playing\n• Case\nFormulation\n• Life Narrative\nInquiry\n(Interview)\n• Standardized\ntest\n1 hour\n\n3.3 Develop practical\naction plans for\nimproving\nworkplace\nconditions\n• Use range of analytical techniques,\ngrowth mindset and positive\ncommunication strategies in developing\naction plans for efficiency and\neffectiveness\n• Examine different strategies and\ntechniques in communicating results,\napplying critical thinking pathway,\nassessing effectiveness and efficiency of\nsystems, processes and procedures\n• Discuss concepts creative negotiation\nskills, change management and\nimprovement strategies\n• Group discussion\n• Lecture\n• Demonstration\n• Role playing\n• Case\nFormulation\n• Life Narrative\nInquiry\n(Interview)\n• Standardized\ntest\n• Project-based\nlearning\n2 hours\n\n--- PDF PAGE 137 ---\nDENTAL HYGIENE LEVEL IV Revision 01 Promulgated (01/11/2019) 133\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nMethod\nNominal\nDuration\n4. Contribute to\nthe Practice of\nSocial Justice\nin the\nWorkplace\n\n4.1 Update self on\nlocal, national and\nglobal trends/\nissues in the\nworkplace\n• Explain the local, national and global\nsystems and structures\n• Discuss issues affecting interaction and\nconnectedness of communities at local,\nnational and global levels\n• Explain underlying assumptions and\npower dynamics (politics, understanding\npolitical system, social structures, labor\nlaws, labor relations, human right)\n• Monitor trends and issues relevant to\nhuman rights, gender equality, culture of\npeace, global citizenship, and cultural\ndiversity using different media platforms\n• Analyze trends and issues relevant to\nhuman rights, gender equality, culture of\npeace, global citizenship, and cultural\ndiversity\n• Engage in discourse about the local,\nnational and global issues\n• Interactive Lecture\n• Small Group\nDiscussion\n• Brainstorming\n• Role-playing\n• Demonstration\nor simulation\nwith oral\nquestioning\n• Group\ndiscussions and\ninteractive\nactivities\n• Case studies/\nproblems\ninvolving\nworkplace\ndiversity issues\n• Written\nexamination\n(Essay)\n• Role Playing\n1 hour\n\n4.2 Relate local and\nglobal trends to\nworkplace context\n• Discuss the different levels of human\nidentity according to Amber Mayer\n(2015)\n• Explain different communities people\nbelong to and how these are connected\n• Recognize cultural differences and\nrespect for cultural diversity\n• Recognize differences and\ncommonalities among people\n• Demonstrate attitudes of empathy,\nsolidarity and respect for diversity\n• Connect local issues to global trends,\nand vice versa.\n• Interactive Lecture\n• Small Group\nDiscussion\n• Brainstorming\n• Role-playing\n• Demonstration\nor simulation\nwith oral\nquestioning\n• Group\ndiscussions and\ninteractive\nactivities\n• Case studies/\nproblems\ninvolving\nworkplace\ndiversity issues\n1 hour\n\n--- PDF PAGE 138 ---\nDENTAL HYGIENE LEVEL IV Revision 01 Promulgated (01/11/2019) 134\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nMethod\nNominal\nDuration\n• Written\nexamination\n(Essay)\n\n4.3 Engage and take\nactions on\nworkplace issues\nand concerns\n• Identify the actions that can be taken\nindividually and collectively\n• Describe ethically responsible behaviour\n• Explain the importance and benefits of\ncivic engagement\n• Employ appropriate actions to address\nworkplace issues involving national and\nglobal trends\n• Show concern and willingness to take\npart in the development efforts to\ndiscuss workplace issues and concerns\n• Apply the attitude of “thinking globally\nand acting locally” in the workplace\n• Interactive Lecture\n• Small Group\nDiscussion\n• Brainstorming\n• Role-playing\n• Demonstration\nor simulation\nwith oral\nquestioning\n• Group\ndiscussions and\ninteractive\nactivities\n• Case studies/\nproblems\ninvolving\nworkplace\ndiversity issues\n• Written\nexamination\n(Essay)\n• Role Playing\n1 hour\n5. Manage\ninnovative\nwork\ninstructions\n5.1 Review and\nanalyze existing\nworkplace\npractices\n• Show mastery of basic management\nconcepts according to Gallup, nine\ndimensions of innovative practices and\nclimate; and different types of innovation\n• Contextualize innovation to different\nvariables in the organization\n• Review current organizational