      "source_text": "3.1 CURRICULUM DESIGN\n\nCourse Title: DENTAL HYGIENE NC Level: LEVEL IV\n\nNominal Training Hours: 3499 Hours (Includes 1056 Hours OJT*)\n\n 92 Hrs. Basic Competencies\n 56 Hrs. Common Competencies\n 3351 Hrs. Core Competencies\n 3499 Hrs. Total\n 1056 Hrs. OJT\nCourse Description:\n\nThis course is designed to enhance the knowledge, skills and attitudes of an individual\nin the field of DENTAL HYGIENE in accordance with industry standards. It covers core\ncompetencies such as: performing oral examination, promoting oral health and hygiene,\noperating a dental radiographic equipment, applying the principle of radiology, biology and\nprotection in dental practice, performing scaling and polishing, maintaining dental records\nand resources, and providing effective patient’s/clients service.\nThis includes the common competencies: Maintain an effective relationship with\ncustomers and clients, maintain instruments and equipment in the work area, manage own\nperformance, follow occupational health and safety policies in dental facilities, maintain\ninfection control in dental practice, apply basic first aid and operate a personal computer.\nIt also includes competencies such as: Utilize specialized communication skills,\ndevelop teams and individuals, apply problem solving techniques in the workplace, collect,\nanalyse and organize information, plan and organize work and promote environmental\nprotection.\nThis list does not include specific institutional requirements such as educational\nattainment, appropriate work experience, and others that may be required of the trainees by\nthe school of training center delivering this TVET program.\nThe above requirements will satisfy the prescribed 2 years certificate in dental\nhygiene with at least 6 months OJT in the IRR of Republic Act 9484 (PRC Board of Dentistry\nResolution No. 12 s. 2007).\nCompletion of the two-year course and the six- month on-the-job training is required\nfor those applying for the PRC licensure exam.\nPursuant to the provision of the IRR of Republic Act 9484, the Dental Hygiene Level\nIV program shall be registered in UTPRAS to a recognized and legally constituted college, or\nschool of dentistry.\n*Note: The OJT should be at least six months and may be integrated/embedded in the two-\nyear program.\n\n--- PDF PAGE 132 ---\nDENTAL HYGIENE LEVEL IV Revision 01 Promulgated (01/11/2019) 128\nBASIC COMPETENCIES\n(92 Hours)\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nMethod\nNominal\nDuration\n1. Utilize\nspecialized\ncommunication\nskills\n\n1.1 Meet common and\nspecific\ncommunication\nneeds of clients\nand colleagues\n\n•\nRead\n➢ Communication process\n➢ Dynamics of groups and different\nstyles of group leadership\n•\nIdentify different approaches to meet\nthe needs of clients and colleagues\n•\nLecture\n•\nWritten\nexamination\n1 hour\n1.2. Contribute to the\ndevelopment of\ncommunication\nstrategies\n•\nApply communication skills to fulfill\njob roles as specified by the\norganization\n•\nApply communication techniques in\ncommunicating with clients and\ncolleagues\n➢ Active listening\n➢ Feedback\n➢ Interpretation\n➢ Role boundaries setting\n➢ Negotiation\n➢ Establishing empathy\n•\nDescribe strategies for internal and\nexternal dissemination of information\n•\nDemonstration\n•\nGroup\ndiscussion\n•\nObservation\n•\nOral\nevaluation\n1 hour\n\n1.3. Represent the\norganization\n\n•\nDescribe criteria for a good\npresentation\n•\nPrepare presentation material for\ninternal or external forums to promote\nthe organization\n•\nUse appropriate media to enhance\nthe presentation\n•\nDemonstration\n•\nObservation\n1 hour\n\n--- PDF PAGE 133 ---\nDENTAL HYGIENE LEVEL IV Revision 01 Promulgated (01/11/2019) 129\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nMethod\nNominal\nDuration\n1.4. Facilitate group\ndiscussion\n•\nGather relevant information\n•\nApply values