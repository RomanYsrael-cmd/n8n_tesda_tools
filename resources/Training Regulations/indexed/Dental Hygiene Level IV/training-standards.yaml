nformation\nneeds and sources\n• Lecture and discussion on:\no Kinds of information\no Information evaluation issues\no Information storage requirements\nand methods\n• Analysing record information\n• Identification of information sources\n• Lecture\n• Group Discussion\n• Hands on\n• Demonstration\n• Practical exercises\n• Oral evaluation\n• Written Test\n• Observation\n• Presentation\n2 Hours\n\n6.2 Collect and analyze\ninformation\n• Lecture and discussion on:\no Information collection and collation\no Relevant trends and developments\n• Collection of information\n• Analyzation of information\n• Lecture\n• Group Discussion\n• Hands on\n• Demonstration\n• Practical exercises\n• Oral evaluation\n• Written Test\n• Observation\n• Presentation\n2 Hours\n\n6.3 Use management\ninformation\nsystems\n• Lecture and discussion on:\no Management information systems\no Available technology in information\nmanagement\n• Lecture\n• Group Discussion\n• Hands on\n• Demonstration\n• Oral evaluation\n• Written Test\n• Observation\n• Presentation\n2 Hours\n\n--- PDF PAGE 141 ---\nDENTAL HYGIENE LEVEL IV Revision 01 Promulgated (01/11/2019) 137\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nMethod\nNominal\nDuration\no Advance strategies for customer\nservice excellence\n• Use of available technology in\ninformation management\n• Practical exercises\n\n6.4 Report and\ndisseminate\nanalyzed\ninformation\n• Lecture and discussion on:\no Reporting procedures of the\norganisation\no Analysis and display techniques\n• Using management information systems\nto store and retrieve data\n• Lecture\n• Group Discussion\n• Hands on\n• Demonstration\n• Practical exercises\n• Oral evaluation\n• Written Test\n• Observation\n• Presentation\n2 Hours\n7. Lead towards\nimprovement\nof\nenvironmental\nwork\nprograms,\npolicies and\nprocedures\n\n7.1 Assess\nOccupational\nSafety and Health\n(OSH) practices\nand programs\n• Case Study in evaluating current OSH\nprograms effectiveness\n• Practice auditing the workplace\n•\nLecture\n•\nGroup\nDiscussion\n•\nCase Study\n•\nGroup Project\n\n•\nWritten Exam\n•\nDemonstration\n•\nObservation\n•\nInterviews /\nQuestioning\nPortfolio\n2 hours\n\n7.2 Recommend OSH\n program\n improvement\n initiatives\n• Writing and Presenting Action Plans to\nimprove OSH compliance in the\nworkplace and/or increase effectiveness\nof OSH Programs\n•\nLecture\n•\nGroup\nDiscussion\n•\nCase Study\n•\nGroup Project\n\n•\nWritten Exam\n•\nDemonstration\n•\nObservation\n•\nInterviews /\nQuestioning\nPortfolio\n4 hours\n\n7.3 Implement\nrecommended\nimprovements on\nOccupational Safety\nand Health (OSH)\n• Role play in increasing the OSH\nawareness\n• Measuring the impact of the new OHS\nprogram or initiative\n•\nLecture\n•\nGroup\nDiscussion\n•\nCase Study\n•\nWritten Exam\n•\nDemonstration\n•\nObservation\n•\nInterviews /\n2 hours\n\n--- PDF PAGE 142 ---\nDENTAL HYGIENE LEVEL IV Revision 01 Promulgated (01/11/2019) 138\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nMethod\nNominal\nDuration\nPrograms, Procedures\nand Policies\n•\nGroup Project\nQuestioning\nPortfolio\n8. Lead Towards\nImprovement\nof\nEnvironmenta\nl Work\nPrograms,\nPolicies and\nProcedures\n8.1 Assess\nEnvironmental\nWork Practices and\nPrograms\n• Discussion of Green structural change\nand retraining needs\n-\nWhat is green structural change and\nwhere is it happening\n-\nWorkforce restructuring and\nadjustment\n-\nEmployment effects of Environment\n-\nSectors most affected by green\nrestructuring\n-\nRetraining and skills upgrading\n-\nEffective and equitable\nrestructuring: Good practices and\nprograms by public and private\nsector actors\n• Perform Impact Assessment\n• Discussions of Gender Implications\n• Lecture\n• Group Discussion\n• Demonstration\n• Case Study\n• Reporting\n\n• Written Exam\n• Demonstration\n• Observation\n• Interviews /\nQuestioning\n• Third Party\nReports\n1 hour\n\n8.2 Rec