-\nDENTAL HYGIENE LEVEL IV Revision 01 Promulgated (01/11/2019) 133\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nMethod\nNominal\nDuration\n4. Contribute to\nthe Practice of\nSocial Justice\nin the\nWorkplace\n\n4.1 Update self on\nlocal, national and\nglobal trends/\nissues in the\nworkplace\n• Explain the local, national and global\nsystems and structures\n• Discuss issues affecting interaction and\nconnectedness of communities at local,\nnational and global levels\n• Explain underlying assumptions and\npower dynamics (politics, understanding\npolitical system, social structures, labor\nlaws, labor relations, human right)\n• Monitor trends and issues relevant to\nhuman rights, gender equality, culture of\npeace, global citizenship, and cultural\ndiversity using different media platforms\n• Analyze trends and issues relevant to\nhuman rights, gender equality, culture of\npeace, global citizenship, and cultural\ndiversity\n• Engage in discourse about the local,\nnational and global issues\n• Interactive Lecture\n• Small Group\nDiscussion\n• Brainstorming\n• Role-playing\n• Demonstration\nor simulation\nwith oral\nquestioning\n• Group\ndiscussions and\ninteractive\nactivities\n• Case studies/\nproblems\ninvolving\nworkplace\ndiversity issues\n• Written\nexamination\n(Essay)\n• Role Playing\n1 hour\n\n4.2 Relate local and\nglobal trends to\nworkplace context\n• Discuss the different levels of human\nidentity according to Amber Mayer\n(2015)\n• Explain different communities people\nbelong to and how these are connected\n• Recognize cultural differences and\nrespect for cultural diversity\n• Recognize differences and\ncommonalities among people\n• Demonstrate attitudes of empathy,\nsolidarity and respect for diversity\n• Connect local issues to global trends,\nand vice versa.\n• Interactive Lecture\n• Small Group\nDiscussion\n• Brainstorming\n• Role-playing\n• Demonstration\nor simulation\nwith oral\nquestioning\n• Group\ndiscussions and\ninteractive\nactivities\n• Case studies/\nproblems\ninvolving\nworkplace\ndiversity issues\n1 hour\n\n--- PDF PAGE 138 ---\nDENTAL HYGIENE LEVEL IV Revision 01 Promulgated (01/11/2019) 134\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nMethod\nNominal\nDuration\n• Written\nexamination\n(Essay)\n\n4.3 Engage and take\nactions on\nworkplace issues\nand concerns\n• Identify the actions that can be taken\nindividually and collectively\n• Describe ethically responsible behaviour\n• Explain the importance and benefits of\ncivic engagement\n• Employ appropriate actions to address\nworkplace issues involving national and\nglobal trends\n• Show concern and willingness to take\npart in the development efforts to\ndiscuss workplace issues and concerns\n• Apply the attitude of “thinking globally\nand acting locally” in the workplace\n• Interactive Lecture\n• Small Group\nDiscussion\n• Brainstorming\n• Role-playing\n• Demonstration\nor simulation\nwith oral\nquestioning\n• Group\ndiscussions and\ninteractive\nactivities\n• Case studies/\nproblems\ninvolving\nworkplace\ndiversity issues\n• Written\nexamination\n(Essay)\n• Role Playing\n1 hour\n5. Manage\ninnovative\nwork\ninstructions\n5.1 Review and\nanalyze existing\nworkplace\npractices\n• Show mastery of basic management\nconcepts according to Gallup, nine\ndimensions of innovative practices and\nclimate; and different types of innovation\n• Contextualize innovation to different\nvariables in the organization\n• Review current organizational practices\nwhere innovation is contextualized\n• Interactive Lecture\n• Appreciative\nInquiry\n• Demonstration\n• Group work\n• Psychological\nand behavioral\nInterviews\n• Performance\nEvaluation\n• Life Narrative\nInquiry\n• Review of\nportfolios of\nevidence and\nthird-party\nworkplace\n1 hour\n\n--- PDF PAGE 139 ---\nDENTAL HYGIENE LEVEL IV Revision 01 Promulgated (01/11/2019) 135\nUnit of\nCompetency\nLearning Outcomes\nLearning Acti