ctivities\n• Case studies/\nproblems\ninvolving\nworkplace\ndiversity issues\n1 hour\n\n--- PDF PAGE 138 ---\nDENTAL HYGIENE LEVEL IV Revision 01 Promulgated (01/11/2019) 134\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nMethod\nNominal\nDuration\n• Written\nexamination\n(Essay)\n\n4.3 Engage and take\nactions on\nworkplace issues\nand concerns\n• Identify the actions that can be taken\nindividually and collectively\n• Describe ethically responsible behaviour\n• Explain the importance and benefits of\ncivic engagement\n• Employ appropriate actions to address\nworkplace issues involving national and\nglobal trends\n• Show concern and willingness to take\npart in the development efforts to\ndiscuss workplace issues and concerns\n• Apply the attitude of “thinking globally\nand acting locally” in the workplace\n• Interactive Lecture\n• Small Group\nDiscussion\n• Brainstorming\n• Role-playing\n• Demonstration\nor simulation\nwith oral\nquestioning\n• Group\ndiscussions and\ninteractive\nactivities\n• Case studies/\nproblems\ninvolving\nworkplace\ndiversity issues\n• Written\nexamination\n(Essay)\n• Role Playing\n1 hour\n5. Manage\ninnovative\nwork\ninstructions\n5.1 Review and\nanalyze existing\nworkplace\npractices\n• Show mastery of basic management\nconcepts according to Gallup, nine\ndimensions of innovative practices and\nclimate; and different types of innovation\n• Contextualize innovation to different\nvariables in the organization\n• Review current organizational practices\nwhere innovation is contextualized\n• Interactive Lecture\n• Appreciative\nInquiry\n• Demonstration\n• Group work\n• Psychological\nand behavioral\nInterviews\n• Performance\nEvaluation\n• Life Narrative\nInquiry\n• Review of\nportfolios of\nevidence and\nthird-party\nworkplace\n1 hour\n\n--- PDF PAGE 139 ---\nDENTAL HYGIENE LEVEL IV Revision 01 Promulgated (01/11/2019) 135\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAsse