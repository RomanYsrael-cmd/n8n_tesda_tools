  "source_text": "SECTION 4 ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\nCompetency Assessment is the process of collecting evidence and making\njudgments whether competency has been achieved. The purpose of assessment is\nto confirm that an individual can perform to the standards expected at the workplace\nas expressed in relevant competency standards.\n\nThe assessment process is based on evidence or information gathered to\nprove achievement of competencies. The process may be applied to an\nemployable unit(s) of competency in partial fulfillment of the requirements of the\nnational qualification.\n\n4.1 NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1.1 The National Qualification of Dental Hygiene Level IV covers the\ncompetency requirements for practicing as a Registered Dental Hygienist\nunder the Philippine Dental Act of 2007 (RA 9484)\n\n4.1.2 In accordance with Section 13 of Republic Act 9484 examination and\nlicensing of Dental Hygienists shall be administered by the Professional\nRegulatory Board of Dentistry of the Professional Regulations\nCommission.\n\n4.1.3 In accordance with Section 14 of Republic Act 9484 and its IRR,\napplicants for admission to the licensure examination at the time of filing\nhis/her application must be:\n\n4.1.3.1 A citizen of the Philippines;\n4.1.3.2 Of good moral character;\n4.1.3.3 He/she had finished the two years certificate in dental hygiene\nconferred by a recognized and legally constituted college, or\nschool of dentistry registered with TESDA: Transcript of Records\nand Certificate with indication of graduation date and S.O. if\nrequired shall be submitted with the application;\n4.1.3.4 Have completed the refresher course required after failing three\nconsecutive licensure examinations. A refresher course shall be\ntaken in PRBOD accredited dental school; and a certificate\nthereon shall be submitted with the application.\n\n--- PDF PAGE 196 ---\nDENTAL HYGIENE NC IV Revision 01 Promulgated (mm/dd/yyyy)\n\n192\n\nCOMPETENCY MAP – HUMAN HEALTH/HEALTH CARE SECTOR (DENTAL HYGIENE LEVEL IV)\n\nBASIC COMPETENCIES\n\nUtilize specialized\ncommunication skills\nDevelop and lead\nteams\nPerform higher-\norder thinking\nprocesses and\napply techniques in\nthe workplace\nContribute to the\npractice of social\njustice in the\nworkplace\nManage innovative\nwork instructions\nManage and evaluate\nusage of information\nLead in\nimprovement of\nOccupational Safety\nand Health (OSH)\nprograms, policies\nand procedures\nLead towards\nimprovement of\nenvironment work\nprograms, policies and\nprocedures\nSustain\nentrepreneurial skills\n\nCOMMON COMPETENCIES\n\nMaintain an effective\nrelationship with\ncustomers and clients\nManage own\nperformance\nMaintain\ninstruments and\nequipment in work\narea\nFollow occupational\nhealth and safety\npolicies in dental\nlaboratory facilities\nMaintain infection\ncontrol in dental\npractice\nApply basic first aid\nOperate a personal\ncomputer\n\nCORE COMPETENCIES\n\nPerform oral\nexamination\nPromote oral health\nand hygiene\nOperate a dental\nradiographic\nequipment\nApply the principle\nof radiology biology\nand protection in\ndental practice\nPerform scaling and\npolishing\nMaintain dental\nrecords and\nresources\nProvide effective\npatient/client service\n\n--- PDF PAGE 197 ---\nDENTAL HYGIENE NC IV Revision 01 Promulgated (mm/dd/yyyy)\n193\n\nDEFINITION OF TERMS\n\nABUTMENT\n-\nTooth or teeth that support a fixed or removable bridge\nANTERIOR TEETH\n-\nthe six upper or six lower front teeth (canines, laterals & central\nincisors)\nAPEX\n-\nthe tip of the root of a tooth\nARCH\n-\ndescribes the alignment of the upper or lower teeth\nARTICULATE\n-\nto unite by forming a joint or joints\nARTICULATOR\n-\na mechanical device representing the temporomandibular joints and\njaw members to which casts of the mouth\nBASE\n-\ncement placed under a dental restoration to insulate the pulp (nerve\nchamber)\nBITE\n-\nrelationship of the upper and lower teeth on closure (occlusion)\nBONDING\n-\nadhesive dental restoration technique; a tooth-colored composite resin\nto repair and/or change the color or shape of a tooth\nBRACES\n-\ndevices used by orthodontists to gradually reposition teeth to a more\nfavorable alignment\nBRIDGE\n-\nstationary dental prosthesis (appliance) fixed to teeth adjacent to a\nspace; replaces one or more missing teeth, cemented or bonded to\nsupporting teeth or implants adjacent to the space\nCANTILEVER BRIDGE -\nfixed bridge that attaches to adjacent teeth only on one end\nCAP\n-\ncommon term for dental crown\nCLASP\n-\ndevice that retains a removable partial denture to stationary teeth; can\nbe metal or acrylic (matches teeth and gums)\nCROSS BITE\n-\nreverse biting relationship of upper and lower teeth; aka \"under bite,\"\nas in Class III malocclusuion (prognathic jaw)\nCROWN\n\n(1) the portion of a tooth above the gum line;\n(2) dental restoration covering all or most of the natural tooth\nCUSTOM IMPRESION\nTRAY\n-\nan impression tray made from a preliminary impression used to\nmake the final impression\nDENTAL WAXES\n-\n wax compounds used in dentistry are mixtures of individual waxes of\nmaterials or synthetic origin. As with all other dental materials, each\ncomponent n the mixture is selected to given specific properties best\nsuited for the procedure being performed\nDENTURE\n-\nremovable (partial or complete) set of artificial teeth\nDIASTEMA\n-\nopen space between teeth\nDISTAL\n-\nfarthest from any point of reference\nDUPLICATE\n-\nidentically copied from an original\nFABRICATE\n-\nto make; create; to construct by combining or assembling\nFACE-BOW FORK\n- a device used to attach the face-bow to an occlusion rim for a face-\nbow transfer\n\n--- PDF PAGE 198 ---\nDENTAL HYGIENE NC IV Revision 01 Promulgated (mm/dd/yyyy)\n194\n\nFACING\n-\ntooth colored overlay on the visible portion of a crown; may be acrylic,\ncomposite or porcelain\nFILLING\n-\nrestoration of lost tooth structure with metal, porcelain or resin\nmaterials\nFULL DENTURE\n-\nremovable dental prosthesis (appliance) replacing all upper or lower\nteeth\nFULL MOUTH\nRECONSTRUCTION\n-\nextensive restorations of natural teeth with crowns and or fixed bridges\nto manage restorative and bite problems.\nGYPSUM\n-\nis the common name for calcium sulfate dehydrate. Gypsum products\nare more frequently used on laboratory procedures than any other\nsingle group of compounds. Controlled variations in the manufacturing\nof gypsum products yield a group of dental materials including plaster,\nartificial stone (hydrosol), disc stone, casting investment and soldering\ninvestment\nIMPRESSION\n-\nmold made of the teeth and soft tissues\nINLAY\n-\nindirect – filling made by a dental laboratory that is cemented or\nbonded into place,\ndirect – placement of dental composite resin, or porcelain restoration\nat chairside\nINTEROCCLUSAL\n-\nspace between upper and lower teeth\nJACKET\n-\ncrown for a front tooth, usually made of porcelain\nLAMINATE\n-\nthin plastic or porcelain veneer produced in a dental laboratory and\nthen bonded to a tooth\nMALOCCLUSION\n-\n“bad bite” or misalignment of the upper and lower teeth\nMARGIN\n-\ninterface between a restoration and tooth structure\nMARYLAND BRIDGE\n-\na bridge that is bonded to the back of the adjacent teeth; requires\nminimum tooth reduction\nMODEL\n-\na material used extensively for making impressions. It contains\nshellac, talc, glycerin, wax, tallow and palm oil\nOVERBITE\n-\nvertical overlap of the front teeth; deep bite\nPARTIAL DENTURE\n-\nremovable dental prosthesis (appliance) replacing one or more natural\nteeth\nPONTIC\n-\nreplacement tooth mounted on a fixed or removal appliance\nPORCELAIN CROWN\n-\nall porcelain restoration covering the coronal portion of tooth (above\nthe gum line)\nPORCELAIN FUSED\nTO METAL (PFM)\nCROWN\n-\nrestoration with metal coping (for strength) covered by porcelain (for\nappearance)\nPORCELAIN INLAY\nOR ONLAY\n-\ntooth-colored restoration made of porcelain, cemented or bonded in\nplace\n\n--- PDF PAGE 199 ---\nDENTAL HYGIENE NC IV Revision 01 Promulgated (mm/dd/yyyy)\n195\n\nPORCELAIN\nVENEERS\n-\na thin layer of porcelain, fabricated by a laboratory) bonded to a\nnatural tooth to replace lost tooth structure, close spaces, straighten\nteeth or change color and/or shape\nPROSTHESIS\n\nan artificial appliance for the replacement for a body part, tooth or\nteeth\nSOLDERING\nINVESTMENT\n-\na soldering investment is similar in composition to a casting\ninvestment that has a\nSPLINT\n-\nconnection of two or more teeth so they function as a stronger single\nstructure\n\n--- PDF PAGE 200 ---\nDENTAL HYGIENE NC IV Revision 01 Promulgated (mm/dd/yyyy)\n199\n\nTRAINING REGULATIONS (TR)\nDOCUMENT REVISION HISTORY\n\nQualification Title: Dental Hygiene Level IV\nQualification Code: HHCDHY410\n\nRevision\nNo.\nDocument\nDescription Types*\nQualification\nTitle\nTESDA Board\nResolution\nNo./ Date\nDeployment\n(TESDA\nCircular/\nImplementin\ng\nGuidelines)\n00\nDocument Created\nDental Hygiene\nLevel IV\n2019-\n07/01/11/19\n035/3/1/2019\n01\nDocument Amended\n\nDental Hygiene\nNC IV\n2010-\n02/04/08/10\nN.A\n Legend: *Description Types\n- Document Created\n- Document Amended\n\n--- PDF PAGE 201 ---\nDENTAL HYGIENE NC IV Revision 01 Promulgated (mm/dd/yyyy)\n200\n\nACKNOWLEDGEMENT\n\nThe Technical Education and Skills Development Authority (TESDA) would like\nto extend thanks and appreciation to the many representatives of business, industry,\nacademe and government agencies who provided their time and expertise to the\ndevelopment and validation of these Training Regulations.\n\nTECHNICAL EXPERTS REVIEW PANEL\n\n DR. JOMER V. PASOL\n\n Faculty\n\n National University\n Jhocson St., Sampaloc\n Manila\n\n DR. RANNIER F. REYES\n Board Member, Board of Dentistry\n\nProfessional Regulation Commission\n\nP. Paredes St. cor. Morayta St.\n\nSampaloc, Manila\n\n DR. MACARIO A. FADRIGALAN IV\n Director of Dent