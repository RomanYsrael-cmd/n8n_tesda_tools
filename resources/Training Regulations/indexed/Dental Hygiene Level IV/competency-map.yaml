  "source_text": "SECTION 1 DENTAL HYGIENE LEVEL IV\n\nThis DENTAL HYGIENE LEVEL IV consists of competencies relating to\nrendering oral health promotion and preventive measures, performing oral\nexamination and prophylaxis, taking brief clinical history, taking radiographs, giving\noral-health education to patients, managing dental records and resources and\nproviding effective patient/client service.\nThe Units of Competency comprising this qualification include the following:\n\nUNIT CODE\nBASIC COMPETENCIES\n5003311401\nUtilize specialized communication skills\n5003311402\nDevelop and lead teams\n5003311403\nPerform higher-order thinking processes and apply techniques in the\nworkplace\n5003311404\nContribute to the practice of social justice in the workplace\n5003311405\nManage innovative work instructions\n5003311406\nManage and evaluate usage of information\n5003311407\nLead in improvement of Occupational Safety and Health (OSH) programs,\npolicies and procedures\n5003311408\nLead towards improvement of environment work programs, policies and\nprocedures\n5003311409\nSustain entrepreneurial skills\n\nUNIT CODE\nCOMMON COMPETENCIES\nHHC516201\nMaintain an effective relationship with customers and clients\nHHC516202\nManage own performance\nHHC322201\nMaintain instruments and equipment in work area\nHHC322204\nFollow occupational health and safety policies in dental laboratory facilities\nHHC322205\nMaintain infection control in dental practice\nHHC323203\nApply basic first aid\nICT311201\nOperate a personal computer\n\nUNIT CODE\nCORE COMPETENCIES\nHHC325301\nPerform oral examination\nHHC325302\nPromote oral health and hygiene\nHHC325303\nOperate a dental radiographic equipment\nHHC325304\nApply the principle of radiology biology and protection in dental practice\nHHC325305\nPerform scaling and polishing\nHHC325306\nMaintain dental records and resources\nHHC325307\nProvide effective patient/client service\n\nOccupational/Job titles corresponding to this qualification may include:\n\n❑ Dental Hygienist\n❑ Dental Assistant\n\nThe national practice of this qualification requires a license from the Board of\nDentistry – Professional Regulation Commission.\n\n--- PDF PAGE 6 ---\nDENTAL HYGIENE LEVEL IV Revision 01 Promulgated (01/11/2019) 2"
