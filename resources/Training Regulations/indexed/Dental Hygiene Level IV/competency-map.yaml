  "source_text": "COMPETENCY MAP – HUMAN HEALTH/HEALTH CARE SECTOR (DENTAL HYGIENE LEVEL IV)\n\nBASIC COMPETENCIES\n\nUtilize specialized\ncommunication skills\nDevelop and lead\nteams\nPerform higher-\norder thinking\nprocesses and\napply techniques in\nthe workplace\nContribute to the\npractice of social\njustice in the\nworkplace\nManage innovative\nwork instructions\nManage and evaluate\nusage of information\nLead in\nimprovement of\nOccupational Safety\nand Health (OSH)\nprograms, policies\nand procedures\nLead towards\nimprovement of\nenvironment work\nprograms, policies and\nprocedures\nSustain\nentrepreneurial skills\n\nCOMMON COMPETENCIES\n\nMaintain an effective\nrelationship with\ncustomers and clients\nManage own\nperformance\nMaintain\ninstruments and\nequipment in work\narea\nFollow occupational\nhealth and safety\npolicies in dental\nlaboratory facilities\nMaintain infection\ncontrol in dental\npractice\nApply basic first aid\nOperate a personal\ncomputer\n\nCORE COMPETENCIES\n\nPerform oral\nexamination\nPromote oral health\nand hygiene\nOperate a dental\nradiographic\nequipment\nApply the principle\nof radiology biology\nand protection in\ndental practice\nPerform scaling and\npolishing\nMaintain dental\nrecords and\nresources\nProvide effective\npatient/client service\n\n--- PDF PAGE 197 ---\nDENTAL HYGIENE NC IV Revision 01 Promulgated (mm/dd/yyyy)\n193",
