0 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC II Promulgated: Nov. 25, 2010\n68\n3.5 TRAINING FACILITIES\n\nBased on class size of 25 students/trainees the space requirements for the\nteaching/learning and circulation areas are as follows:\n\nTEACHING/LEARNING\nAREAS\n\nSIZE IN\nMETERS\n\nAREA IN SQ.\nMETERS\n\nQTY\nTOTAL AREA\nIN SQ.\nMETERS\n\nLecture Area\n\nNOTE: Facilities/ Equipment/\nCirculation Area is also\nLecture Area.\n\nLearning Resource Area\n\n6mX8m\n\n48 sq. meters\n\n48 sq. meters\n\nTool Room/ Storage Area\n\n6mX7m\n\n42 sq. meters\n\n42 sq. meters\n\nWash, Toilet & Locker Room\n\n5mX7m\n\n35 sq. meters\n\n35 sq. meters\n\n Total\n\n125 sq.meters\n\nFacilities/Equipment/\nCirculation\n\n12mX10m\n\n65sq.m/trainee\n\n 15\n\n120 sq.meters\n\n Total Area\n\n245\nsq.meters\n** Area requirement is equivalent to 30% of the total teaching/learning areas\n\n3.6 TRAINERS QUALIFICATIONS FOR JEWELRY MAKING (FINE JEWELRY) NC II\n\nTRAINER QUALIFICATION\n\n• Must have completed Training Methodology Course (TMC) or its equivalent\n• Must be a holder of Jewelry Making (Fine Jewelry) NC III certificate\n• Must have knowledge of Phil. National Standard on Jewelry\n• Must be able to communicate effectively both orally and in writing\n• Must be physically, emotionally and mentally fit\n•\nMust have at least five (5) years of relevant work experience\n\n3.7 INSTITUTIONAL ASSESSMENT\n\nInstitutional Assessment is undertaken by trainees to determine their\nachievement of units of competency. A certificate of achievement is issued for\neach unit of competency.\n\n--- PDF PAGE 71 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC II Promulgated: Nov. 25, 2010\n69"
