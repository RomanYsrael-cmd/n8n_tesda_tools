      "source_text": "Course Title: JEWELRY MAKING (FINE JEWELRY) NC Level: II\n\nNominal Training Duration: 18 Hrs. (Basic Competencies)\n\n 24Hrs. (Common Competencies)\n\n 800Hrs. (Core Competencies)\nCourse Description:\n\nThis course is designed to provide the knowledge, skills, and attitude along\nJewelry Making (Fine Jewelry) NC II in accordance with industry standards. It covers\nthe basic, common and core competencies on mensurations and calculations,\nmanaging own performance, application of first-aid, application of quality and safety\nstandards, fabricating basic jewelry components, polishing, plating and rubber mold\nmaking of jewelries.\n\nTo obtain this, all units prescribed for this qualification must be achieved.\n\nBASIC COMPETENCIES\n(18 Hours)\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and convey\n Workplace informa-\n tion.\n\n1.2 Complete relevant\nwork related\ndocuments.\n\n1.3 Participate in work-\nplace meeting and\n discussion\n• Group\ndiscussion\n• Interaction\n• Lecture\n• Reportorial\n\n• Written test\n• Practical/\nperformance test\n• Interview\n2. Work in a team\nenvironment\n2.1 Describe and identify\nteam role and\nresponsibility in a\nteam.\n\n2.2 Describe work as a\nteam member.\n• Group\ndiscussion/\ninteraction\n• Case studies\n• Simulation\n• Written test\n• Observation\n• Simulation\n• Role-playing\n\n--- PDF PAGE 61 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC II Promulgated: Nov. 25, 2010\n59\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n3. Practice career\nprofessionalism\n3.1 Integrate personal\nobjectives with\norganizational goals.\n\n3.2 Set and meet work\npriorities.\n\n3.3 Maintain professional\ngrowth and\n development\n\n• Interactive –\nlecture\n• Simulation\n• Demonstrati\non\n• Self-paced\nlearning\n• Group\ndiscussion\n• Structured\nactivity\n• Film viewing\n• Role play\n• Interview\n• Written\nexamination\n• Demonstration\n4. Practice\noccupational\nhealth and safety\n4.1 Evaluate hazard and\nrisks\n\n4.2 Control hazards and\nrisks\n\n4.3 Maintain\noccupational health\nand safety\nawareness\n• Interactive-\nlecture\n• Simulation\n• Symposium\n• Group\ndynamics\n• Situation\nanalysis\n• Film viewing\n• Self-paced\nlearning\n• Situation analysis\n• Interview\n• Practical\nexamination\n• Written\nexamination\n• Simulation\n• Demonstration\n\n--- PDF PAGE 62 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC II Promulgated: Nov. 25, 2010\n60\nCOMMON COMPETENCIES\n(24Hours)\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Observe\nprocedures\nspecifications and\nmanuals of\ninstruction\n\n1.1 Identify, access and\nspecification/manuals\n1.2 Interpret manuals\n1.3 Apply information in\nmanual\n1.4 Store manuals\n• Classroom\ndiscussions/\nLecture\n• Self-paced\nlearning\n• Demonstration\n\n• Practical\nexamination\n• Oral\nExamination\n• Written test/\nquestioning\n• Direct\nobservation\n2. Perform\nmensurations and\ncalculations\n\n2.1 Select measuring\ninstruments\n\n2.2 Carry out\nmeasurements and\ncalculations\n\n• Lecture/\n Demonstration\n• Self-paced\nlearning\n• Group\ndiscussion\n\n• Oral\nquestioning\n• Written Test\n• Direct\nobservation\n• Actual\ndemonstration\n3. Manage own\nperformance\n3.1 Plan for completion of\nown workload.\n3.2 Maintain quality of\nown performance.\n3.3 Build credibility with\ncustomers/clients.\n• Lecture\n• Group\nDiscussion\n• Role Play\n• Demonstration\nwith oral\nquestioning\n• Written report\n• Interview\n4. Applying Quality\nStandards\n4.1 Assess quality of\nreceived materials or\ncomponents\n4.2 Assess own work\n4.3 Engage in process\nimprovement\n• Lecture\n• Discussion\n• Hands-on\n• Role-Play\n• Interview\n• Written report\n• Demonstration\nwith questioning\n5. Apply basic first aid 5.1 Assess the situation\n\n5.2 Apply basic first aid\ntechniques\n\n5.3 Communicate details\nof the incident\n• Lecture\n\n• Demonstration\n\n• Role-Play\n\n• Group\nDiscussion\n• Oral Test\n\n• Group Role-\nPlay\n• Interview\n\n--- PDF PAGE 63 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC II Promulgated: Nov. 25, 2010\n61\nCORE COMPETENCIES\n(800 Hours)\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Fabricate basic\njewelry\ncomponents\n1.1 Prepare requirements\nfor fabrication\n1.2 Perform fabrication\n1.3 Perform post-\nfabrication activities\n\n• Demonstration/\nFilm viewing\n\n• Self-paced\nlearning\n• Interview\n\n• Direct\nObservation\n\n• Demonstration\n\n• Written\nExamination\n2. Polish jewelry\n2.1 Prepare requirements\nfor polishing\n2.2 Perform polishing\n2.3 Perform post-\npolishing activities\n\n• Demonstration\n\n• Film viewing\n\n•\nSelf-paced\nlearning\n•\nModular\n• Interview\n\n• Written\n\n• Practical\n\n• Direct\nObservation\n3. Plate jewelry\n3.1 Prepare requirements\nfor plating\n3.3 Plate jewelry\n3.4 Perform post-plating\nactivities\n• Lecture /\nDemonstration\n\n• Modular/ Self-\npaced learning\n\n• Simulation\n• Written test\n\n• Demonstration\n/ questioning\n\n4. Perform rubber\nmold making\n4.1 Prepare for rubber\nmold making\n4.2 Vulcanize mold frame\n4.3 Cut rubber mold\n4.4 Produce wax pattern\n• Demonstration\n\n• Modular/ Self-\npaced learning\n\n•\nSimulation\n• Written test\n\n• Demonstration\n/ questioning\n\n* For the Core Competencies, the training provider may choose to include practicum\nor on-the-job training as a training methodology.\n\n--- PDF PAGE 64 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC II Promulgated: Nov. 25, 2010\n62",
