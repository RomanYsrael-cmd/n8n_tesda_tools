  "source_section_text": "SECTION 3 TRAINING STANDARDS\n\n3.1 CURRICULUM DESIGN\n\nCourse Title: JEWELRY MAKING (FINE JEWELRY) NC Level: II\n\nNominal Training Duration: 18 Hrs. (Basic Competencies)\n\n 24Hrs. (Common Competencies)\n\n 800Hrs. (Core Competencies)\nCourse Description:\n\nThis course is designed to provide the knowledge, skills, and attitude along\nJewelry Making (Fine Jewelry) NC II in accordance with industry standards. It covers\nthe basic, common and core competencies on mensurations and calculations,\nmanaging own performance, application of first-aid, application of quality and safety\nstandards, fabricating basic jewelry components, polishing, plating and rubber mold\nmaking of jewelries.\n\nTo obtain this, all units prescribed for this qualification must be achieved.\n\nBASIC COMPETENCIES\n(18 Hours)\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and convey\n Workplace informa-\n tion.\n\n1.2 Complete relevant\nwork related\ndocuments.\n\n1.3 Participate in work-\nplace meeting and\n discussion\n• Group\ndiscussion\n• Interaction\n• Lecture\n• Reportorial\n\n• Written test\n• Practical/\nperformance test\n• Interview\n2. Work in a team\nenvironment\n2.1 Describe and identify\nteam role and\nresponsibility in a\nteam.\n\n2.2 Describe work as a\nteam member.\n• Group\ndiscussion/\ninteraction\n• Case studies\n• Simulation\n• Written test\n• Observation\n• Simulation\n• Role-playing\n\n--- PDF PAGE 61 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC II Promulgated: Nov. 25, 2010\n59\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n3. Practice career\nprofessionalism\n3.1 Integrate personal\nobjectives with\norganizational goals.\n\n3.2 Set and meet work\npriorities.\n\n3.3 Maintain professional\ngrowth and\n development\n\n• Interactive –\nlecture\n• Simulation\n• Demonstrati\non\n• Self-paced\nlearning\n• Group\ndiscussion\n• Structured\nactivity\n• Film viewing\n• Role play\n• Interview\n• Written\nexamination\n• Demonstration\n4. Practice\noccupational\nhealth and safety\n4.1 Evaluate hazard and\nrisks\n\n4.2 Control hazards and\nrisks\n\n4.3 Maintain\noccupational health\nand safety\nawareness\n• Interactive-\nlecture\n• Simulation\n• Symposium\n• Group\ndynamics\n• Situation\nanalysis\n• Film viewing\n• Self-paced\nlearning\n• Situation analysis\n• Interview\n• Practical\nexamination\n• Written\nexamination\n• Simulation\n• Demonstration\n\n--- PDF PAGE 62 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC II Promulgated: Nov. 25, 2010\n60\nCOMMON COMPETENCIES\n(24Hours)\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Observe\nprocedures\nspecifications and\nmanuals of\ninstruction\n\n1.1 Identify, access and\nspecification/manuals\n1.2 Interpret manuals\n1.3 Apply information in\nmanual\n1.4 Store manuals\n• Classroom\ndiscussions/\nLecture\n• Self-paced\nlearning\n• Demonstration\n\n• Practical\nexamination\n• Oral\nExamination\n• Written test/\nquestioning\n• Direct\nobservation\n2. Perform\nmensurations and\ncalculations\n\n2.1 Select measuring\ninstruments\n\n2.2 Carry out\nmeasurements and\ncalculations\n\n• Lecture/\n Demonstration\n• Self-paced\nlearning\n• Group\ndiscussion\n\n• Oral\nquestioning\n• Written Test\n• Direct\nobservation\n• Actual\ndemonstration\n3. Manage own\nperformance\n3.1 Plan for completion of\nown workload.\n3.2 Maintain quality of\nown performance.\n3.3 Build credibility with\ncustomers/clients.\n• Lecture\n• Group\nDiscussion\n• Role Play\n• Demonstration\nwith oral\nquestioning\n• Written report\n• Interview\n4. Applying Quality\nStandards\n4.1 Assess quality of\nreceived materials or\ncomponents\n4.2 Assess own work\n4.3 Engage in process\nimprovement\n• Lecture\n• Discussion\n• Hands-on\n• Role-Play\n• Interview\n• Written report\n• Demonstration\nwith questioning\n5. Apply basic first aid 5.1 Assess the situation\n\n5.2 Apply basic first aid\ntechniques\n\n5.3 Communicate details\nof the incident\n• Lecture\n\n• Demonstration\n\n• Role-Play\n\n• Group\nDiscussion\n• Oral Test\n\n• Group Role-\nPlay\n• Interview\n\n--- PDF PAGE 63 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC II Promulgated: Nov. 25, 2010\n61\nCORE COMPETENCIES\n(800 Hours)\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Fabricate basic\njewelry\ncomponents\n1.1 Prepare requirements\nfor fabrication\n1.2 Perform fabrication\n1.3 Perform post-\nfabrication activities\n\n• Demonstration/\nFilm viewing\n\n• Self-paced\nlearning\n• Interview\n\n• Direct\nObservation\n\n• Demonstration\n\n• Written\nExamination\n2. Polish jewelry\n2.1 Prepare requirements\nfor polishing\n2.2 Perform polishing\n2.3 Perform post-\npolishing activities\n\n• Demonstration\n\n• Film viewing\n\n•\nSelf-paced\nlearning\n•\nModular\n• Interview\n\n• Written\n\n• Practical\n\n• Direct\nObservation\n3. Plate jewelry\n3.1 Prepare requirements\nfor plating\n3.3 Plate jewelry\n3.4 Perform post-plating\nactivities\n• Lecture /\nDemonstration\n\n• Modular/ Self-\npaced learning\n\n• Simulation\n• Written test\n\n• Demonstration\n/ questioning\n\n4. Perform rubber\nmold making\n4.1 Prepare for rubber\nmold making\n4.2 Vulcanize mold frame\n4.3 Cut rubber mold\n4.4 Produce wax pattern\n• Demonstration\n\n• Modular/ Self-\npaced learning\n\n•\nSimulation\n• Written test\n\n• Demonstration\n/ questioning\n\n* For the Core Competencies, the training provider may choose to include practicum\nor on-the-job training as a training methodology.\n\n--- PDF PAGE 64 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC II Promulgated: Nov. 25, 2010\n62\n3.2 TRAINING DELIVERY\n\nThe delivery of training should adhere to the design of the curriculum. Delivery\nshould be guided by the 10 basic principles of competency-based TVET.\n\n• The training is based on curriculum developed from the competency\nstandards;\n• Learning is modular in its structure;\n• Training delivery is individualized and self-paced;\n• Training is based on work that must be performed;\n• Training materials are directly related to the competency standards and the\ncurriculum modules;\n• Assessment is based in the collection of evidence of the performance of work\nto the industry required standard;\n• Training is based both on and off-the-job components;\n• Allows for recognition of prior learning (RPL) or current competencies;\n• Training allows for multiple entry and exit; and\n• Approved training programs are Nationally Accredited\n\nThe competency-based TVET system recognizes various types of delivery\nmodes, both on and off-the-job as long as the learning is driven by the\ncompetency standards specified by the industry. The following training modalities\nmay be adopted when designing training programs:\n• The dual mode of training delivery is preferred and recommended. Thus\nprograms would contain both in-school and in-industry training or fieldwork\ncomponents. Details can be referred to and conform with the Dual Training\nSystem (DTS) Implementing Rules and Regulations.\n• Modular/self-paced learning is a competency-based training modality wherein\nthe trainee is allowed to progress at his own pace. The trainer just facilitates the\ntraining delivery.\n• Peer teaching/mentoring is a training modality wherein fast learners are given\nthe opportunity to assist the slow learners.\n• Supervised industry training or on-the-job training is an approach in training\ndesigned to enhance the knowledge and skills of the trainee through actual\nexperience in the workplace to acquire specific competencies prescribed in the\ntraining regulations.\n• Distance learning is a formal education process in which majority of the\ninstruction occurs when the students and instructor are not in the same place.\nDistance learning may employ correspondence study, audio, video or computer\ntechnologies.\n\n--- PDF PAGE 65 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC II Promulgated: Nov. 25, 2010\n63\n\n3.3 TRAINEE ENTRY REQUIREMENTS\n\n Trainees or students wishing to gain entry into this course should satisfy the\nfollowing requirements:\n\n•\nMust be able to communicate effectively both orally and in written form\n•\nMust be physically, emotionally and mentally fit\n• Must be able to perform basic mathematical computations\n\nThis list does not include specific institutional requirements such as educational\nattainment, minimum age, and others that may be required of the trainees by the\nschool or training center delivering the TVET program.\n\n3.4 LIST OF TOOLS, EQUIPMENT AND MATERIALS\n\nRecommended list of tools, equipment and materials for the training of 25\ntrainees for Jewelry Making (Fine Jewelry) NC II:\n\nTOOLS\nEQUIPMENT\nMATERIALS\nQty.\nDescription\nQty.\nDescription\nQty.\nDescription\n\n25 sets\n25 pcs\n25 pcs\n\n25 pcs\n\n25 pcs\n25 pcs\n25 pcs\n25 pcs\n25 pcs\n\n25 pcs\n\n25 pcs\n\n25 pcs\n\n25 pcs\n\n25 pcs\n\nJeweler’s saw\nLight hammer\nJeweler”s Steel\nblock\nStainless steel\nscoop/shovel\n\nBrush paint 3”\nLong nose plier\nFlat nose plier\nRound nose plier\nRounding plier\n\nNeedle file set w/\nhandle\nHalf round file w/\nhandle\nKnife edge file w/\nhandle\n\nDivider Compass\n\nStainless steel\nboiling pan\n\n5 pcs\n\n5 pcs\n\n5 pcs\n\n5 pcs\n\n5 pcs\n\n5 pcs\n5 pcs\n10 pcs\n25 pcs\n25 pcs\n\n5 pcs\n\nCombination\nRolling mill\nRound hole draw\nplate\nTriangle draw\nplate\nHalf round draw\nplate\n Square draw\nplate\n\nSteel draw bench\nDraw tong\nAnvil\nSteel channel\nDapping die and\ntools set\nMelting\nequipment\n(double torch per\npiece,gas\ntank,foot\npump,rubber\nhose)\n\n2.5 k\n\n2 k\n1 k\n1 k\n\n2 k\n\n25 pcs\n\n25 pcs\n\n25 pcs\n\n25 pcs\n\n1/2 kl\n1 gal\n50 pcs\n25 ltrs\n12 pcs\n\n25 pcs\n\nAlloyed metal\nSolders\nBorax\nBorico\nSalpeter\n(Salitre)\nPlaster of paris\n(Escayola)\nSand paper grit\n#280\nSand paper grit\n#300\nSand paper grit\n#600\nSand paper grit\n#800\nCopper wire\nGasoline\nSheet bees wax\nNitric acid\nG