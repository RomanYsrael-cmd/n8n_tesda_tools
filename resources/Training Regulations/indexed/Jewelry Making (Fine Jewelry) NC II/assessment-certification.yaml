  "source_text": "SECTION 4 NATIONAL ASSESSMENT AND CERTIFICATION\nARRANGEMENTS\n\n4.1\nTo attain the National Qualification of Jewelry Making (Fine Jewelry)\nNC II, the candidate must demonstrate the competence in all the units\nlisted in Section 1. Successful candidate shall be awarded a National\nCertificate signed by the TESDA Director General.\n\n4.2 Individuals aspiring to be awarded the qualification of Jewelry\nMaking(Fine Jewelry) NC II must acquire Certificates of Competency\nin all of the following individual core units of the Qualification.\nCandidates may apply for assessment in any accredited assessment\ncenter.\n\n4.2.1\n Fabricate basic jewelry components\n\n4.2.2\n Polish jewelry\n\n4.2.3\n Plate jewelry\n\n4.2.4\n Perform rubber mold making\n\nSuccessful candidates shall be awarded Certificates of Competency\n(COCs).\n\n4.3\n Upon accumulation and submission of all COCs acquired for the above\nunits of competency comprising this qualification, an individual shall be\nissued the corresponding National Certificate.\n\n4.4 Assessment shall focus on the core units of competency. The basic and\ncommon units shall be integrated or assessed concurrently with the\ncore units.\n\n4.5 The following are qualified to apply for assessment and certification:\n\n4.5.1 Graduates of formal and non-formal including enterprise-based\ntraining programs\n\n4.5.2 Experienced Workers (wage employed or self-employed)\n\n4.6\n The guidelines on assessment and certification are discussed in detail\nin the “Procedures Manual on Assessment and Certification” and\n“Guidelines on the Implementation of the Philippine TVET Qualification\nand Certification System (PTQCS)”.\n\n--- PDF PAGE 72 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC II Date Promulgated: Nov. 2010\n70\nPerform\nhair\nbleaching\nPerform\nhair\nbleaching\n\n"
}
