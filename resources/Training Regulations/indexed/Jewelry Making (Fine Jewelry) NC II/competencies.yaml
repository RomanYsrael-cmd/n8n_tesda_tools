        "source_text": "--- PDF PAGE 19 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC II                    Promulgated: Nov. 25, 2010 \n17 \n \nCOMMON COMPETENCIES \n \nUNIT OF COMPETENCY     : \n \nOBSERVE PROCEDURES, SPECIFICATIONS \nAND MANUALS OF INSTRUCTIONS \nUNIT CODE                          : \nCON311202 \nUNIT DESCRIPTOR             : \nThis unit covers the knowledge, skills and attitudes \nin identifying, interpreting, applying services in \naccordance with specifications and manuals, and  \nstorage of manuals.\nELEMENT \nPERFORMANCE CRITERIA \nBold and Italicized terms are elaborated in the  \nRange of Variables\n1.  Identify and access \nspecification / \nmanuals \n \n  \n1.1 Appropriate manuals are identified and accessed as \nper job requirements. \n1.2 Version and date of manual are checked to ensure \nthat correct specification and procedure are identified. \n2.  Interpret manuals \n \n2.1 Relevant sections/ chapters of specifications/manuals \nare accessed in relation to the work to be conducted. \n2.2 Information and procedure/s in the manual are \ninterpreted in accordance with current industry \npractices. \n3.  Apply information in \nmanual \n3.1   Manual is interpreted according to job requirements \nand in accordance with current industry practices. \n3.2   Work steps are correctly identified in accordance with \nmanufacturer’s specification. \n3.3   (Manual) Data in the manual data are applied \naccording to the given task. \n3.4 All correct sequencing and adjustments are interpreted \nin accordance with information contained on the \nmanual or in accordance with specifications. \n4. Store manuals \n4.1 Manual or specifications are stored appropriately to \nensure prevention of damage, ready access and \nupdating of information when required in accordance \nwith company requirements and current industry \npractices.\n\n--- PDF PAGE 20 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC II                    Promulgated: Nov. 25, 2010 \n18 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.  Procedures, \nSpecifications and \nManuals of \ninstructions \n \nKinds of Manuals: \n1.1  Manufacturer’s Specification Manual \n1.2  Periodic Maintenance Manual \n1.3  Maintenance Procedure Manual \n1.4  Repair Manual\n\n--- PDF PAGE 21 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC II                    Promulgated: Nov. 25, 2010 \n19 \nEVIDENCE GUIDE \n \n1. Critical aspects \nof competency \nAssessment requires evidence that the candidate: \n1.1 Identified and accessed specification/manuals as per job \nrequirements. \n1.2 Interpreted manuals in accordance with industry practices.\n1.3 Applied information in manuals according to the given \ntask. \n1.4 Stored manuals in accordance with company \nrequirements. \n2. Underpinning \nKnowledge \n2.1 Type of manuals used in  the Decorative Crafts (Jewelry)   \nSector \n2.2 Identification of symbols used in the manuals \n2.3 Identification of units of measurements \n2.4 Unit/s of conversion \n3. Underpinning \nSkills \n3.1 Reading and comprehension skills required to identify and \ninterpret  decorative crafts (jewelry) manuals and \nspecifications \n3.2 Accessing information and data \n4. Resource \nImplications \nThe following resources should be provided: \n4.1   All manuals/catalogues relative to  the decorative crafts \n(jewelry) sector \n5. Methods of \nAssessment \nCompetency in this unit must be assessed through: \n5.1   Direct observation   \n5.2   Questions/Interview \n6. Context for \nAssessment \n6.1   Competency assessment must be undertaken in \naccordance with the endorsed TESDA assessment \nguidelines \n6.2 Assessment may be conducted in the workplace or \nsimulated environment\n",
