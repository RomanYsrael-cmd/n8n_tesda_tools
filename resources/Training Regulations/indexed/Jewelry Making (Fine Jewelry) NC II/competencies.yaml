          "source_text": "1.  Prepare \nrequirements for \nplating  \n \n1.1   Jewelry plating requirements are established from \npredetermined specifications in accordance with \norganizational and design specifications \n1.2   Plating techniques are selected in accordance with \nspecific plating/organizational requirements and \ndesignated timeframes \n1.3   Materials and consumables are selected, requested and \nobtained in accordance with organizational requirements \nand in consultation with appropriate person(s). \n1.4   Jewelry is subjected to quality control whether its ready \nfor plating in accordance with organizational procedures/ \nindustry standards  \n1.5   When necessary, defective items are returned for fixing in \naccordance with organizational procedures/ industry \nstandards \n1.6   Tools, machineries and equipment are selected and \nused appropriate to job requirements and check for \noperational effectiveness in accordance with \nmanufacturers’ specifications and organizational \nprocedures \n2.  Perform plating \n2.1   Plating activities are performed in accordance with OHS \nand organizational requirements, and industry standards  \n2.2   Plating result is produced as to required specifications \nand in accordance with organizational requirements and \nindustry standards \n2.3   Finished product is quality checked for color consistency \nin accordance with client’s specifications/ Philippine \nNational Standard (PNS) on Jewelry\n\n--- PDF PAGE 50 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC II                    Promulgated: Nov. 25, 2010 \n48 \n \n \nELEMENT\nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n3.  Perform post-\nplating activities \n3.1   Documentation is accurately completed and processed \nin accordance with organizational requirements  \n3.2   Finished item is packaged/presented and stored safely in \naccordance with organizational requirements \n3.3   Notification of work completion is made to appropriate \nperson(s) in accordance with organizational procedures \n3.4   Work area, tools and equipment are cleaned and stored in \naccordance with OHS and organizational requirements \n3.5   Unused/excess materials are collected and \nstored/returned in accordance with organizational \nrequirements\n\n--- PDF PAGE 51 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC II                    Promulgated: Nov. 25, 2010 \n49 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.  Plating \ntechniques(s)  \nMay include but are not limited to: \n1.1  Barrel \n1.2  Ordinary or manual \n2.  Plating \nactivities \nMay include but are not limited to: \n2.1   Select plating bath and appropriate container size  \n2.2   Warm plating bath to the correct temperature \n2.3   Select appropriate anode size for the jewelry to be plated  \n2.4   Connect jewelry to be plated to cathode [-] pole \n2.5   Plate - Immerse jewelry  in plating bath and turn on current \nrequirements \n2.6   Drag-out \n2.7   De-ionized  rinse \n2.8   Dry \n3.  Materials and \nconsumables \nMay include but are not limited to: \n3.1  Plating Bath \n       3.1.1  Silver  \n       3.1.2  Gold \n       3.1.3  Rhodium \n3.2  Anode \n3.3  De-ionized water \n3.4  Acid dip solution \n3.5  Anti-tarnish solution \n3.6  De-greasing solution \n4. Tools and \nequipment \nMay include but are not limited to: \nTools \n4.1  Jigs \n4.2  Thermometer \n4.3  Stirring rod \n4.4  Plating bath containers (e.g. beakers) \n Equipment and machineries \n4.5  Rectifier \n4.6  Heater \n4.7  Dryer \n4.8  Ultrasonic cleaner \n4.9  Steamer\n5.  Plating \nactivities \nMay include but are not limited to: \n5.1  Select plating bath and appropriate container size \n5.2  Warm plating bath to the correct temperature \n5.3  Select appropriate anode size for the jewelry to be plated \n5.4  Connect jewelry to be plated to cathode [-] pole \n5.5  Plate – Immerse jewelry in plating bath and turn on current \nrequirements\n\n--- PDF PAGE 52 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC II                    Promulgated: Nov. 25, 2010 \n50 \n5.6  Drag-out \n5.7  De-ionized rinse \n5.8  Dry \n6. Documentation \nMay include but are not limited to: \n6.1  Job Order form  \n6.2  Work instructions and procedures \n6.4  Materials and consumables used \n6.5 Time and record sheets\n\n--- PDF PAGE 53 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC II                    Promulgated: Nov. 25, 2010 \n51"
