uctions and procedures\n10.3 Materials and consumables used\n10.4 Time and record sheets\n10.5 Unused/excess materials\n\n--- PDF PAGE 41 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC II Promulgated: Nov. 25, 2010\n39\n\nEVIDENCE GUIDE\n\n1. Critical Aspects\nof Competency\n\nAssessment requires evidence that the candidate:\n1.1 Identified and established components and basic jewelry\nfabrication requirements based from predetermined\nspecifications in accordance with organizational and client\nrequirements\n1.2 Selected and obtained tools, equipment, materials and\nconsumables with appropriate person/s in accordance with\norganizational and OH&S requirements\n1.3 Performed fabrication in accordance with OH&S,\norganizational and industry accepted methods\n1.4 Fabricated items are checked for quality and to ensure\nconstruction conforms with required specifications and\norganizational requirements and standards\n1.5 When necessary, reworked/retouched defective items in\naccordance with specifications and organizational procedures\n1.6 Checked finished product for quality, dimension and\nconstruction in accordance with client’s specifications and\norganizational requirements\n1.7 Notified work completion to appropriate person/s in\naccordance with organizational procedures\n1.8 Cleaned and stored work area, tools and equipment in\naccordance with OHS and organizational requirements\n1.9 Used personal protective equipment (PPE) in accordance\nwith job requirements and OHS requirements\n1.10\n Demonstrated knowledge on calculation and\nmeasurements\n2. Underpinning\nKnowledge\n\n2.1 Philippine National Standard (PNS) on Jewelry\n2.2 Types of jewelry\n2.2 Basic jewelry components\n2.3 Properties of metals used in jewelry\n2.4 Basic jewelry fabricating procedures\n2.5 Basic knowledge in hand tools and usages\n2.6 Materials and consumables used in jewelry fabrication\n2.7 Operation of machines and equipment in fabricating jewelry\n2.8 Basic measuring and weighing devices\n2.9 Read and understand specification\n2.10 Interpret design and illustration\n2.11 Factor that can affect the flow of fabrication\n2.12 Procedures for checking serviceability of applicable tools and\nequipment\n2.13 Safe operating procedures for applicable tools and equipment\n2.14 Follow organizational, client quality and work standards\n2.15 Organizational procedures for storage of chemicals, tools and\nequipment\n2.16 First-aid measures\n2.17 Safe work practices and procedures/OH&S requirements\n2.18 Accounting of unused/excess materials\n\n--- PDF PAGE 42 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC II Promulgated: Nov. 25, 2010\n40\n\n3. Underpinning\nSkills\n3.1 Following oral and written instructions\n3.2 Reading and interpreting specifications, illustrations and\ndrawings\n3.3 Steady hand and good motor skill\n3.4 Identifying relevant fabrication process on every task\n3.5 Measurements, weighing and calculation\n3.6 Selecting appropriate tools and equipment\n3.7 Selecting appropriate materials\n3.8 Applying appropriate production techniques\n3.9 Applying first-aid measures\n3.10 Applying safe working skills\n3.11 Identifying alternative metals\n4. Resource\nImplications\nThe following resources should be provided:\n4.1\nMaterials relevant to the activity\n4.2\nTools, machineries and equipment\n4.3\nConsumables\n4.4\nPersonal Protective Equipment (PPE)\n4.5\nWorkplace\n4.6\nDocumentation\n4.7\nExhaust fan\n4.8\nFire extinguisher\n\n5. Method of\nAssessment\nCompetency in this unit must may be assessed through:\n5.1 Demonstration with oral questioning\n5.2 Portfolio (Training Certificates, Certificate of Employment,\nWork piece, etc.)\n5.3 Third Party Report\n6. Context of\nAssessment\n6.1 Competency may be assessed in the workplace or in a\nsimulated workplace (TESDA Accredited Assessment\nCenter)\n\n--- PDF PAGE 43 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC II Promulgated: Nov. 25, 2010\n41\nUNIT OF COMPETENCY: POLISH JEWELRY\n\nUNIT CODE : DCJ731302\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes in\npolishing jewelry of fine jewelry.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Prepare\nrequirements for\npolishing\n\n1.1 Items to be polished are checked in accordance with\ndesign specifications\n1.2 When necessary, defective items are returned to issuing\npersonnel in accordance with organizational procedures\nand design specifications\n1.3 Item characteristics and finishing are established from\npredetermined specifications in accordance with\norganizational and design specifications\n1.4 Finishing specifications and required outcomes are\nconfirmed and clarified as necessary with appropriate\nperson(s) and in accordance with organizational\nrequirements and design specifications\n1.5 Polishing techniques are selected in accordance with\ndesignated timeframes , organizational and specific\npolishing requirements\n1.6 Materials and consumables are selected and requested\nin accordance with organizational requirements and in\nconsultation with appropriate person(s).\n1.7 Tools, machineries and equipment are selected,\nrequested and checked for operational effectiveness in\naccordance with the manufacturer’s specification and\norganizational procedures\n2. Perform polishing\n2.1 Polishing tools, machineries and equipment are used in\naccordance with manufacturers’ specifications\n2.2 Polishing activities are performed using safe operating\npractices, protective equipment, and in accordance with\nOHS, organizational and industry standards.\n2.3 Polished items are checked to ensure outcome conforms\nwith design specifications, quality and organizational\nstandards\n2.4 Jewelry is completely polished and free of soils and\nabrasive compounds\n\n--- PDF PAGE 44 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC II Promulgated: Nov. 25, 2010\n42\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n3. Perform post-\npolishing activities\n3.1 Documentation is completed and processed in\naccordance with organizational requirements and\nstandards\n3.2 Finished item is turned over to issuing personnel in\naccordance with organizational procedures\n3.3 Notification of work completion is made to appropriate\nperson(s) in accordance with organizational procedures.\n3.4 Work area, tools and equipment are cleaned and stored\nin accordance with OHS and organizational requirements.\n3.5 Waste materials are collected and stored/reclaimed in\naccordance with organizational requirements\n\n--- PDF PAGE 45 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC II Promulgated: Nov. 25, 2010\n43\nRANGE OF VARIABLES\n\nVARIABLE\n\nRANGE\n1. Design\nspecifications\nMay include but are not limited to:\n1.1 Design proportions\n1.2 Sizes\n1.3 Free from deformities\n1.4 Smoothness of surfaces\n2. Appropriate\nperson(s)\nMay include but are not limited to:\n2.1 Supervisor\n2.2 Issuing personnel/officer\n3. Polishing\ntechniques\n3.1 Manual\n3.2 Chemical\n3.3 Mechanical\n4. Materials and\nconsumables\nMay include but are not limited to:\n4.1 Cleaning Solutions\n4.2 Abrasives\n4.3 Barrels\n4.4 Grinding Wheels\n4.5 Polishing and buffing Wheels\n4.6 Lapping Wheels\n4.7 Hand Polishing Tools\n4.8 Wheel Brushes\n4.9 Bristle and Wire wheel brushes\n4.10 Polishing and Buffing compounds\n5. Tools, machineries\nand equipment\nMay include but are not limited to:\n\n5.1 Polishing motor with spindles\n5.2 Ultrasonic Cleaner\n5.3 Vibratory Tumbler\n5.4 Steamer\n5.5 Split Lapping Machine\n5.6 Magnetic Tumbler\n5.7 All hand and power tools appropriate to cleaning of\njewelry items and personal protective equipment\n6. Polishing activities\nMay include but are not limited to:\n6.1 Degreasing\n6.2 Grinding\n6.3 Tumbling or barrel finishing\n6.4 Burnishing\n6.5 Polishing\n\n--- PDF PAGE 46 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC II Promulgated: Nov. 25, 2010\n44\n6.6 Brushing\n6.7 Buffing\n6.8 Split-lapping\n7. Soils\nMay include but are not limited to:\n7.1 Grease\n7.2 Polishing compound\n7.3 Rusts\n7.4 Organic materials\n7.5 Oxides\n8. Documentation\nMay include but are not limited to:\n8.1 Job order form\n8.2 Work instructions and procedures\n8.3 Parts and components reference guide/manual\n8.4 Materials and consumables used\n8.5 Time and record sheets\n\n--- PDF PAGE 47 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC II Promulgated: Nov. 25, 2010\n45\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\n\nAssessment requires evidence that the candidate:\n1.1 Identified jewelry polishing requirements\n1.2 Confirmed and clarified with appropriate persons the\nrequired finish specifications and outcomes\n1.3 Prepared materials and consumables for polishing\njewelry\n1.4 Checked and returned defective tools, machineries and\nequipment to issuing personnel in accordance with\norganizational procedures\n1.5 Polished jewelry items in accordance with OH&S ,\norganizational and industry standards\n1.6 Completed jewelry polishing documentation procedures\n1.7 Collected and stored shavings/excess materials in\naccordance with organizational requirements\n2. Underpinning\nKnowledge\n\n2.1 Philippine National Standard (PNS) on Jewelry\n2.2 Types of jewelry\n2.2 Properties and characteristics of metals used in jewelry\n2.3 Tools, machineries, equipment, materials and\nconsumables for polishing a range of jewelry\nitems/designs\n2.4 Common jewelry design features, constructions and\nfinishes\n2.5 Metal preparation and polishing techniques to suit\ndifferent design requirements\n2.6 Factors affecting the selection of preparation of polishing\nmethods\n2.7 Organizational requirements for polishing activities\n2.8 Ratios and proportions to prepare required\ngrade/quality/composition of polishing media\n2.9 Procedures for checking serviceability of applicable tools\nand equipment\n2.10 Safe operating procedures for applicable tools and\nequipment\n2.11 Security measures for protection of jewelry items\n2.12 Safe work practices and procedures/ OH&S\nrequirements\n2.13 First aid measures\n2.14 Accounting of unused/excess materials\n\n--- PDF PAGE 48 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC II Promulgated: Nov. 25, 2010\n46\n\n3. Underpinning Skills\n3.1 Interpreting polishing specifications\n3.2 Following instructions (oral or written)\n3.3 Selecting appropriate tools and equipment\n3.4 Selecting appropriate materials and polishing techniques\n3.5 Applying appropriate polishing procedures\n3.6 Applying safe working skills\n3.7 Applying first-aid measures\n4. Resource\nImplications\nThe following resources should be provided:\n4.1 Materials relevant to the activity\n4.2 Tools, machineries and equipment\n4.3 Consumables\n4.4 Personal Protective Equipment (PPE)\n4.5 Workplace\n4.6 Documentation\n4.7 Exhaust fan\n4.8 Fire extinguisher\n\n5. Method of\nAssessment\nCompetency in this unit must be assessed through:\n5.1 Demonstration with oral questioning\n5.2 Portfolio (Training Certificates, Certificate of Employment,\nWorkpiece, etc.)\n5.3 Third-Party Report\n6. Context of\nAssessment\n6.1 Competency may be assessed in the workplace or in a\nsimulated workplace (TESDA Accredited Assessment\nCenter)\n\n--- PDF PAGE 49 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC II Promulgated: Nov. 25, 2010\n47\nUNIT OF COMPETENCY : PLATE JEWELRY\n\nUNIT CODE : DCJ731303\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and\nattitudes in plating jewelry of fine jewelry involving\nsilver, gold and rhodium plating techniques.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Prepare\nrequirements for\nplating\n\n1.1 Jewelry plating requirements are established from\npredetermined specifications in accordance with\norganizational and design specifications\n1.2 Plating techniques are selected in accordance with\nspecific plating/organizational requirements and\ndesignated timeframes\n1.3 Materials and consumables are selected, requested and\nobtained in accordance with organizational requirements\nand in consultation with appropriate person(s).\n1.4 Jewelry is subjected to quality control whether its ready\nfor plating in accordance with organizational procedures/\nindustry standards\n1.5 When necessary, defective items are returned for fixing in\naccordance with organizational procedures/ industry\nstandards\n1.6 Tools, machineries and equipment are selected and\nused appropriate to job requirements and check for\noperational effectiveness in accordance with\nmanufacturers’ specifications and organizational\nprocedures\n2. Perform plating\n2.1 Plating activities are performed in accordance with OHS\nand organizational requirements, and industry standards\n2.2 Plating result is produced as to required specifications\nand in accordance with organizational requirements and\nindustry standards\n2.3 Finished product is quality checked for color consistency\nin accordance with client’s specifications/ Philippine\nNational Standard (PNS) on Jewelry\n\n--- PDF PAGE 50 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC II Promulgated: Nov. 25, 2010\n48\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n3. Perform post-\nplating activities\n3.1 Documentation is accurately completed and processed\nin accordance with organizational requirements\n3.2 Finished item is packaged/presented and stored safely in\naccordance with organizational requirements\n3.3 Notification of work completion is made to appropriate\nperson(s) in accordance with organizational procedures\n3.4 Work area, tools and equipment are cleaned and stored in\naccordance with OHS and organizational requirements\n3.5 Unused/excess materials are collected and\nstored/returned in accordance with organizational\nrequirements\n\n--- PDF PAGE 51 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC II Promulgated: Nov. 25, 2010\n49\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Plating\ntechniques(s)\nMay include but are not limited to:\n1.1 Barrel\n1.2 Ordinary or manual\n2. Plating\nactivities\nMay include but are not limited to:\n2.1 Select plating bath and appropriate container size\n2.2 Warm plating bath to the correct temperature\n2.3 Select appropriate anode size for the jewelry to be plated\n2.4 Connect jewelry to be plated to cathode [-] pole\n2.5 Plate - Immerse jewelry in plating bath and turn on current\nrequirements\n2.6 Drag-out\n2.7 De-ionized rinse\n2.8 Dry\n3. Materials and\nconsumables\nMay include but are not limited to:\n3.1 Plating Bath\n 3.1.1 Silver\n 3.1.2 Gold\n 3.1.3 Rhodium\n3.2 Anode\n3.3 De-ionized water\n3.4 Acid dip solution\n3.5 Anti-tarnish solution\n3.6 De-greasing solution\n4. Tools and\nequipment\nMay include but are not limited to:\nTools\n4.1 Jigs\n4.2 Thermometer\n4.3 Stirring rod\n4.4 Plating bath containers (e.g. beakers)\n Equipment and machineries\n4.5 Rectifier\n4.6 Heater\n4.7 Dryer\n4.8 Ultrasonic cleaner\n4.9 Steamer\n5. Plating\nactivities\nMay include but are not limited to:\n5.1 Select plating bath and appropriate container size\n5.2 Warm plating bath to the correct temperature\n5.3 Select appropriate anode size for the jewelry to be plated\n5.4 Connect jewelry to be plated to cathode [-] pole\n5.5 Plate – Immerse jewelry in plating bath and turn on current\nrequirements\n\n--- PDF PAGE 52 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC II Promulgated: Nov. 25, 2010\n50\n5.6 Drag-out\n5.7 De-ionized rinse\n5.8 Dry\n6. Documentation\nMay include but are not limited to:\n6.1 Job Order form\n6.2 Work instructions and procedures\n6.4 Materials and consumables used\n6.5 Time and record sheets\n\n--- PDF PAGE 53 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC II Promulgated: Nov. 25, 2010\n51\nEVIDENCE GUIDE\n\n1. Critical Aspects\nof Competency\n\nAssessment requires evidence that the candidate:\n1.1 Identified plating jewelry requirements based from\npredetermined specification and in accordance with client’s\nrequirements and organizational procedures\n1.2 Selected and obtained materials, consumables, tools,\nmachineries and equipment appropriate to job requirements and\nin accordance with manufacturer’s specifications and\norganizational procedures\n1.3 Performed applicable plating techniques to produce the\nrequired specifications using safe operating practices and\npersonal protective equipment, and in accordance with\norganizational requirements\n1.4 Washed and dried plated jewelry to required specifications in\naccordance with organizational procedures\n1.5 Quality checked finished product for color consistency in\naccordance with design specifications\n1.6 Finished item is packaged/presented and stored safely in\naccordance with organizational requirements\n1.7 Notified work completion to appropriate person/s in accordance\nwith organizational procedures\n1.8 Observed safe work practices and procedures during the entire\nprocess in accordance with OHS and organizational\nrequirements\n2. Underpinning\nKnowledge\n\n2.1 Philippine National Standard (PNS) on Jewelry\n2.2 Types of jewelry\n2.3 Properties of metals used in jewelry\n2.4 Principles of plating\n2.5 Plating shop procedures\n2.6 Chemicals used in Plating\n2.7 Appropriate anode, voltage, temperature, and immersion time\n2.8 Tools, Machineries and equipment used in Plating\n2.9 Various Plating Baths\n2.10 Troubleshooting and maintenance of plating bath/solution\n2.11 Metal preparation and plating techniques\n2.12 Factors affecting the selection of preparation and plating\n methods\n2.13 Relevant materials and consumables for given jewelry plating jobs\n2.14 Properties and characteristics gemstones\n2.15 Procedures for checking serviceability of applicable tools and\nequipment\n2.16 Safe operating procedures for applicable tools and equipment\n2.17 Organization of customer service, quality and work standards\n2.18 Industry Standards of Qualities\n2.19 Organization procedures for storage of chemicals, tools and\nequipment\n2.20 First-aid measures\n2.21 Safe work practices and procedures/OH&S requirements\n2.22 Accounting of unused/excess materials\n\n--- PDF PAGE 54 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC II Promulgated: Nov. 25, 2010\n52\n\n3. Underpinning\nSkills\n3.1 Applicable plating techniques and processes\n3.2 Plating Sequence\n3.3 Weighing and measuring\n3.4 Selecting appropriate tools, machineries and equipment\n3.5 Selecting appropriate materials\n3.6 Applying appropriate plating\n3.7 Applying safe working skills\n3.8 Applying first-aid measures\n3.9 Performing troubleshooting and maintenance of plating\nbath/solution\n4. Resource\nImplications\nThe following resources should be provided:\n4.1 Materials/Consumables relevant to the activity\n4.2 Tools, machineries and equipment\n4.3 Consumables\n4.4 Personal Protective Equipment (PPE)\n4.5 Workplace\n4.6 Documentation\n4.7 Exhaust fan\n4.8 Fire Extinguisher\n\n5. Method of\nAssessment\nCompetency in this unit may be assessed through:\n5.1 Demonstration with oral questioning\n5.2 Portfolio (Training Certificates, Certificate of Employment,\nWorkpiece, etc.)\n5.3 Third-Party Report\n6. Context of\nAssessment\n6.1 Competency may be assessed in the workplace or in a\nsimulated workplace (TESDA Accredited Assessment Center)\n\n--- PDF PAGE 55 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC II Promulgated: Nov. 25, 2010\n53\nUNIT OF COMPETENCY : PERFORM RUBBER MOLD MAKING\n\nUNIT CODE : DCJ731304\n\n UNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes\n\n in performing rubber mold making of fine jewelry.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\n1. Prepare for\nrubber mold\nmaking\n1.1 Sprued prototype (metal mold), materials and\nconsumables are requested and obtained in accordance\nwith job requirements and organizational requirements\n1.2 Tools, machineries and equipment are selected and\nchecked for operational effectiveness in accordance with job\nrequirements and manufacturer’s specifications\n1.3 Uncured rubber sheets are prepared/cut to a required\ndimension to fit standard mold frame\n1.4 Sprued prototype metal is packed with cut cleaned-uncured\nrubber sheet and placed inside the aluminum mold frame\n1.5 Vulcanizer is pre-heated in accordance with manufacturer’s\nspecifications\n1.6 Personal protective equipment (PPE) is used in\naccordance with OHS requirements\n2. Vulcanize mold\nframe\n2.1 Aluminum mold frame is placed in the vulcanizing machine\nand tightened in accordance with standard operating\nprocedures (SOPs)\n2.2 Mold frame is heated as per manufacturer’s specifications\n2.3 Vulcanized mold is cooled and removed from the vulcanizer\nin accordance with SOPs\n2.4 Rubber mold is removed from the mold frame and excess\nrubber is trimmed\n2.5 Mold frame is cleaned and stored in accordance with\norganizational procedures\n3. Cut rubber mold\n3.1 Rubber mold is cut and separated into sections with surgical\nknives in accordance with the design requirements\n3.2 Air-vents/release cuts are made in the cured rubber mold to\nattain complete pattern form\n3.3 Metal prototype is removed from the rubber mold\n and initial testing is conducted\n\n--- PDF PAGE 56 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC II Promulgated: Nov. 25, 2010\n54\n\n4. Produce wax\npattern\n4.1 Wax injector machine is pre-heated according to\nmanufacturer’s specifications\n4.2 Powder/silicon mist is applied to the cured rubber mold for\neasy release of wax pattern\n4.3 Pre-heated wax is injected to the rubber mold according to\nmanufacturer’s specifications\n4.4 Wax pattern is cooled and removed from the rubber mold in\naccordance with SOPs\n4.5 Wax pattern is checked from defects and appropriate\nmeasure is undertaken to rectify defects\n4.6 Wax pattern is cleaned and prepared for sprueing\n4.7 Finished rubber mold is submitted to appropriate personnel\nfor documentation and safekeeping\n\n--- PDF PAGE 57 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC II Promulgated: Nov. 25, 2010\n55\nRANGE OF VARIABLES\n\nVARIABLE\n\nRANGE\n1. Materials and\nconsumables\n\nMay include but are not limited to:\nMaterials\n1.1 Uncured rubber sheets\n1.2 Metal mold (Prototype)\nConsumables\n1.3 Wax\n1.4 Silicon spray\n1.5 Cleaning agents (e.g Benzene)\n1.6 Surgical blades\n1.7 Silicon rubber\n2. Tools, and\nequipment\nMay include but are not limited to:\nTools\n2.1 Conical metal pin\n2.2 Frames (e.g. Aluminum, steel)\n2.3 Surgical knives\n2.4 Metal sprue rod\nEquipment\n2.5 Vulcanizer\n2.6 Wax injector\n3. Personal\nprotective\nequipment\n3.1 Gloves\n3.2 Facial mask/Gauze mask\n3. Design\nrequirements\nMay include but are not limited to:\n3.1 Simple\n - One-piece band ring\n - Flat pendant\n3.2 Complicated\n - Intricately designed rings/earrings\n - Multiple parts jewelry\n4. Defects\nMay include but are not limited to:\n4.1 Incompletely cured rubber\n4.2 Overheated rubber\n4.3 Metal pattern misalignment\n\n--- PDF PAGE 58 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC II Promulgated: Nov. 25, 2010\n56\nEVIDENCE GUIDE\n\n1. Critical Aspects\nof Competency\n\nAssessment requires evidence that the candidate:\n1.1 Prepared materials, consumables, tools and equipment for\nrubber mold making\n1.2 Prepared/cut uncured rubber sheets to the required\ndimensions\n1.3 Packed sprued prototype metal with cut cleaned-uncured\nrubber sheet and placed inside the aluminum mold frame\n1.4 Vulcanized mold frame\n1.5 Cut rubber mold\n1.6 Produced wax pattern\n1.7 Checked wax pattern for defects and undertook measures\nto rectify defects\n1.8 Cleaned and prepared wax pattern for sprueing\n2. Underpinning\nKnowledge\n\n2.1 Philippine National Standard (PNS) on Jewelry\n2.2 Types of jewelry\n2.3 Mold making for jewelry\n2.4 Properties of metals used in jewelry\n2.5 Different kinds of rubber mold\n2.6 Hazards related to rubber mold making\n2.7 Sizes of mold frames\n2.8 Safety gadgets/apparatus\n2.9 Data recording procedures\n2.10 Consequences of poor work practices\n2.11 Tools and materials\n2.12 Equipment preparation and operating procedures\n2.13 Housekeeping and equipment cleaning procedures\n2.14 Safe work practices and procedures/OH&S requirements\n2.15 First aid measures\n2.16 Accounting of unused/excess materials\n3. Underpinning\nSkills\n3.1 Reading and interpreting routine information on written job\ninstructions, specifications and standard operating\nprocedures\n3.2 Setting up, checking and operating equipment\n3.3 Maintaining vulcanizing temperatures\n3.4 Mold cutting skills\n3.5 Applying safe rubber mold making/cutting procedures\n3.6 Working within heating timeframe constraints\n3.7 Rectifying rubber mold defects\n3.8 Handling of tools in cutting rubber molds\n3.9 Housekeeping\n3.10 Applying first-aid measures\n\n--- PDF PAGE 59 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC II Promulgated: Nov. 25, 2010\n57\n\n4. Resource\nImplications\nThe following resources should be provided:\n4.1 Materials relevant to the activity\n4.2 Tools and equipment\n4.3 Shop supplies\n4.4 PPE\n4.5 Workplace\n4.6 Exhaust fan\n4.7 Fire extinguisher\n5. Method of\nAssessment\nCompetency in this unit must be assessed through:\n5.1 Demonstration with oral questioning\n5.2 Portfolio (Training Certificates, Certificate of Employment,\nWorkpiece, etc.)\n5.3 Third-Party Report\n\n6. Context of\nAssessment\n6.1 Competency may be assessed in the workplace or in a\nsimulated workplace (TESDA Accredited Assessment\nCenter)\n\n--- PDF PAGE 60 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC II Promulgated: Nov. 25, 2010\n58"
