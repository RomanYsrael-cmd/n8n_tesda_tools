        "source_title": "PERFORM RUBBER MOLD MAKING",
        "source_text": "--- PDF PAGE 55 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC II                    Promulgated: Nov. 25, 2010 \n53 \nUNIT OF COMPETENCY :     PERFORM RUBBER MOLD MAKING \n \nUNIT CODE                      :     DCJ731304 \n  \n UNIT DESCRIPTOR         :    This unit covers the knowledge, skills and attitudes  \n \n \n \n \n    in performing rubber mold making of fine jewelry. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the \nRange of Variables\n1. Prepare for \nrubber mold \nmaking \n1.1 Sprued prototype (metal mold), materials and \nconsumables are requested and obtained in accordance \nwith job requirements and organizational requirements \n1.2 Tools, machineries and equipment are selected and \nchecked for operational effectiveness in accordance with job \nrequirements and manufacturer’s specifications \n1.3 Uncured rubber sheets are prepared/cut to a required \ndimension to fit standard mold frame \n1.4 Sprued prototype metal is packed with cut cleaned-uncured \nrubber sheet and placed inside the aluminum mold frame  \n1.5 Vulcanizer is pre-heated in accordance with manufacturer’s \nspecifications \n1.6 Personal protective equipment (PPE) is used in \naccordance with OHS requirements \n2.  Vulcanize mold \nframe \n2.1   Aluminum mold frame is placed in the vulcanizing machine \nand tightened in accordance with standard operating \nprocedures (SOPs)  \n2.2   Mold frame is heated as per manufacturer’s specifications  \n2.3   Vulcanized mold is cooled  and removed from the vulcanizer \nin accordance with SOPs \n2.4   Rubber mold is removed from the mold frame and excess \nrubber is trimmed  \n2.5   Mold frame is cleaned and stored in accordance with \norganizational procedures \n3. Cut rubber mold \n3.1   Rubber mold is cut and separated into sections with surgical \nknives in accordance with the design requirements \n3.2   Air-vents/release cuts are made in the cured rubber mold to \nattain complete pattern form \n3.3   Metal prototype is removed from the rubber mold  \n        and initial testing is conducted\n\n--- PDF PAGE 56 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC II                    Promulgated: Nov. 25, 2010 \n54 \n \n4.  Produce wax \npattern  \n4.1   Wax injector machine is pre-heated according to \nmanufacturer’s specifications \n4.2   Powder/silicon mist is applied to the cured rubber mold for \neasy release of wax pattern   \n4.3   Pre-heated wax is injected to the rubber mold according to \nmanufacturer’s specifications \n4.4   Wax pattern is cooled and removed from the rubber mold in \naccordance with SOPs \n4.5   Wax pattern is checked from defects and appropriate \nmeasure is undertaken to rectify defects \n4.6   Wax pattern is cleaned and prepared for sprueing \n4.7   Finished rubber mold is submitted to appropriate personnel \nfor documentation and safekeeping\n\n--- PDF PAGE 57 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC II                    Promulgated: Nov. 25, 2010 \n55 \nRANGE OF VARIABLES \n \n \nVARIABLE \n \nRANGE \n1. Materials and \nconsumables \n \nMay include but are not limited to: \nMaterials \n1.1    Uncured rubber sheets \n1.2   Metal mold (Prototype) \nConsumables \n1.3  Wax \n1.4  Silicon spray \n1.5  Cleaning agents (e.g Benzene)  \n1.6  Surgical blades \n1.7  Silicon rubber \n2.  Tools, and \nequipment \nMay include but are not limited to: \nTools \n2.1   Conical metal pin   \n2.2   Frames (e.g. Aluminum, steel) \n2.3  Surgical knives \n2.4  Metal sprue rod  \nEquipment \n2.5   Vulcanizer \n2.6   Wax injector \n3.  Personal \nprotective \nequipment\n3.1   Gloves \n3.2   Facial mask/Gauze mask \n3.  Design \nrequirements \nMay include but are not limited to: \n3.1  Simple \n       - One-piece band ring \n       - Flat pendant \n3.2  Complicated \n       - Intricately designed rings/earrings \n      - Multiple parts jewelry\n4.  Defects \nMay include but are not limited to: \n4.1   Incompletely cured rubber \n4.2   Overheated rubber \n4.3   Metal pattern misalignment\n\n--- PDF PAGE 58 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC II                    Promulgated: Nov. 25, 2010 \n56 \nEVIDENCE GUIDE \n \n1. Critical Aspects \nof Competency \n \n \n \n \nAssessment requires evidence that the candidate: \n1.1   Prepared materials, consumables, tools and equipment for \nrubber mold making \n1.2   Prepared/cut uncured rubber sheets to the required \ndimensions \n1.3   Packed sprued prototype metal with cut cleaned-uncured \nrubber sheet and placed inside the aluminum mold frame \n1.4   Vulcanized mold frame \n1.5   Cut rubber mold \n1.6   Produced wax pattern \n1.7   Checked wax pattern for defects and undertook measures \nto rectify defects \n1.8   Cleaned and prepared wax pattern for sprueing \n2.  Underpinning \nKnowledge \n \n2.1   Philippine National Standard (PNS) on Jewelry \n2.2   Types of jewelry \n2.3   Mold making for jewelry \n2.4   Properties of metals used in jewelry \n2.5   Different kinds of rubber mold \n2.6   Hazards related to rubber mold making \n2.7   Sizes of mold frames \n2.8   Safety gadgets/apparatus  \n2.9   Data recording procedures \n2.10   Consequences of poor work practices \n2.11   Tools and materials  \n2.12   Equipment preparation and operating procedures \n2.13   Housekeeping and equipment cleaning procedures \n2.14   Safe work practices and procedures/OH&S requirements  \n2.15   First aid measures \n2.16   Accounting of unused/excess materials \n3.  Underpinning \nSkills \n3.1   Reading and interpreting routine information on written job \ninstructions, specifications and standard operating \nprocedures \n3.2   Setting up, checking and operating equipment \n3.3   Maintaining vulcanizing temperatures \n3.4   Mold cutting skills \n3.5   Applying safe rubber mold making/cutting procedures \n3.6   Working within heating timeframe constraints \n3.7   Rectifying rubber mold defects \n3.8   Handling of tools in cutting rubber molds \n3.9   Housekeeping \n3.10   Applying first-aid measures\n\n--- PDF PAGE 59 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC II                    Promulgated: Nov. 25, 2010 \n57 \n \n4.  Resource \nImplications \nThe following resources should be provided: \n4.1   Materials relevant to the activity  \n4.2   Tools and equipment \n4.3   Shop supplies \n4.4   PPE  \n4.5   Workplace \n4.6   Exhaust fan \n4.7 Fire extinguisher\n5.  Method of \nAssessment \nCompetency in this unit must be assessed through: \n5.1   Demonstration with oral questioning \n5.2   Portfolio (Training Certificates, Certificate of Employment, \nWorkpiece, etc.) \n5.3   Third-Party Report \n \n \n6.  Context of \nAssessment \n6.1 Competency may be assessed in the workplace or in a \nsimulated workplace (TESDA Accredited Assessment \nCenter)\n",
