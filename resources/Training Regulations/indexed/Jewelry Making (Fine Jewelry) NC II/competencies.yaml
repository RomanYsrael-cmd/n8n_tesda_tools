        "source_title": "FABRICATE BASIC JEWELRY COMPONENTS",
        "source_text": "--- PDF PAGE 37 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC II                    Promulgated: Nov. 25, 2010 \n35 \nCORE COMPETENCIES \n \nUNIT OF COMPETENCY :    FABRICATE BASIC JEWELRY COMPONENTS \n \n \n \n \n \nUNIT CODE                      :     DCJ731301   \n  \nUNIT DESCRIPTOR         :    This unit covers the knowledge, skills and attitudes \nin fabricating basic components of fine jewelry. \n \n \nELEMENT\nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1.  Prepare \nrequirements for \nfabrication \n \n1.1   Jewelry design construction, dimension, composition, \ncharacteristic and finish requirements are established from \npredetermined specifications in accordance with \norganizational and client requirements \n1.2   Fabrication and finish specifications and required outcomes \nas indicated in the prescribed form are confirmed and \nclarified as necessary with appropriate person(s) and in \naccordance with organizational and client’s requirements \n1.3   Appropriate preparation and fabrication techniques are \nestablished in accordance with job order requirements and \norganizational procedures  \n1.4   Fabrication and finishing activities are prioritized in \naccordance with designated timeframes, organizational and \nspecific requirements  \n1.5   Tools and equipment, materials and consumables are \nselected, requested and checked for operational \neffectiveness in accordance with the manufacturer’s \nspecification and organizational procedures\n2.  Perform \nfabrication \n2.1   Pre-formed materials are fabricated to produce basic \ncomponents using applicable fabrication activities  and \nsafe operating practices,  protective equipment, and in \naccordance with OH&S, organizational and industry \naccepted methods \n2.2   Fabricated Item is checked to ensure if construction \nconforms with required specifications, quality and industry/ \norganizational standard \n2.3   When necessary, defective items are reworked/retouched \nin accordance with specifications and organizational \nprocedures \n2.4   Fabricated Items are submitted to appropriate person(s) for  \nquality control in accordance with industry/organizational \nrequirements and standards\n\n--- PDF PAGE 38 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC II                    Promulgated: Nov. 25, 2010 \n36 \n \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n \n2.5   Proper care in handling of materials are  strictly observed to \nensure that quality and quantity is followed in accordance \nwith the organizational requirements     \n2.6   Personal protective equipment (PPE) is used in \naccordance with job requirements and OHS requirements \n2.7   Metal filings of same kind and quality are melted together \nfor proper re-testing of its quality and quantity as required \nby organizational procedures and submitted to issuing \npersonnel for storage and safekeeping \n3.  Perform post-\nfabrication \nactivities \n3.1   Documentation is completed and processed in accordance \nwith organizational requirements and standards \n3.2   Notification of work completion is made to appropriate \nperson(s) in accordance with organizational procedures \n3.3   Work area, tools and equipment are cleaned and stored in \naccordance with OHS and organizational requirements\n\n--- PDF PAGE 39 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC II                    Promulgated: Nov. 25, 2010 \n37 \nRANGE OF VARIABLES \n \nVARIABLE     \nRANGE   \n1.  Appropriate \nperson(s)  \nMay include but are not limited to: \n1.1 Supervisor \n1.2 Quality Control Personnel \n1.3   Designer \n2.  Appropriate \npreparation and \nfabrication \ntechniques  \nMay include but are not limited to: \n2.1  Melting and casting metal into ingot. \n2.2  De-oxidizing metal \n2.3  Calibrated metal sheet preparation \n2.4  Wire and tube making \n2.5  Fabricating simple wedding band  \n2.6  Controlled sawing of decorative shapes \n2.7  Usage of control heat application \n2.8  Surface enhancement    \n3.   Fabrication and \nfinishing activities \nMay include but are not limited to: \n3.1  Casting metal sheet  \n3.2   Annealing metal \n3.3   Roll pressing \n3.4   Cutting metal strips for wire and tubes \n3.5   Drawing metal strip into wire and tubes. \n3.6   Making simple ring shanks e.g. wedding band \n3.7   Cut out pre pattern designs \n3.8   Cut, file, bend, and braze thicker components \n3.9   Fine finish items using finer grit sand paper    \n4.  Tools, \nmachineries and \nEquipments \nMay include but are not limited to: \n4.1  Melting and soldering blow torch \n4.2  Crucibles and Sheet mold \n4.3  Roll Press \n4.4  Wire draw plate and Thong \n4.5  Jeweler’s pliers \n4.6  Jeweler’s saw \n4.7  Set of files \n4.8  Set of needle files \n4.8  Sears \n4.9  Tweezers \n4.10   Ball hammer \n4.11   Rawhide mallet \n4.12   Ring mandrel \n4.13   Anvil \n4.14   Work bench\n\n--- PDF PAGE 40 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC II                    Promulgated: Nov. 25, 2010 \n38 \n \n \nVARIABLE     \nRANGE   \n5.    Materials \nMay include but not limited to: \n5.1  Precious metals \n       -  Gold  \n       -  Silver \n5.2  Non- precious base metals \n       -  Copper Nickel \n       -  Zinc  \n      - Brass      \n6.   Consumables \nMay include but are not limited to: \n6.1  Borax \n6.2  Boric Acid   \n6.3  Potassium Nitrate \n6.4  Alum \n6.5  Fuel     \n6.6  Emery paper \n6.7  Crucibles  \n    \n7.   Pre-formed \nmaterials \nMay include but are not limited to: \n7.1  Sheets \n7.2  Wires \n7.3  Tubes \n8.   Basic \ncomponents \nMay include but are not limited to: \n8.1  Ring shanks \n8.2  Simple findings (e.g. earring posts/clips/backs, bezels, \npendant, hooks, etc.) \n9.  Personal \nprotective \nequipment (PPE)\nMay include but are not limited to: \n9.1  Heat resistant gloves \n9.2  Heat resistant apron \n9.3  Face shield \n9.4  Safety goggles \n9.5  Safety shoes (Optional)\n10. Documentation \nMay include but are not limited to: \n10.1  Job Order form  \n10.2  Work instructions and procedures \n10.3  Materials and consumables used \n10.4  Time and record sheets \n10.5  Unused/excess materials\n\n--- PDF PAGE 41 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC II                    Promulgated: Nov. 25, 2010 \n39 \n \nEVIDENCE GUIDE \n \n1. Critical Aspects \nof Competency \n \n \nAssessment requires evidence that the candidate: \n1.1 Identified and established components and basic jewelry \nfabrication requirements  based from predetermined \nspecifications in accordance with organizational and client \nrequirements \n1.2 Selected and obtained tools, equipment, materials and \nconsumables with appropriate person/s in accordance with \norganizational and OH&S requirements \n1.3 Performed fabrication in accordance with OH&S, \norganizational and industry accepted methods \n1.4 Fabricated items are checked for quality and to ensure \nconstruction conforms with required specifications and \norganizational requirements and standards \n1.5 When necessary, reworked/retouched defective items in \naccordance with specifications and organizational procedures\n1.6 Checked finished product for quality, dimension and \nconstruction in accordance with client’s specifications and \norganizational requirements \n1.7 Notified work completion to appropriate person/s in \naccordance with organizational procedures \n1.8 Cleaned and stored work area, tools and equipment in \naccordance with OHS and organizational requirements \n1.9 Used personal protective equipment (PPE) in accordance \nwith job requirements and OHS requirements  \n1.10 \n Demonstrated knowledge on calculation and \nmeasurements \n2. Underpinning \nKnowledge \n \n2.1  Philippine National Standard (PNS) on Jewelry  \n2.2  Types of jewelry \n2.2  Basic jewelry components \n2.3  Properties of metals used in jewelry \n2.4  Basic jewelry fabricating procedures \n2.5  Basic knowledge in hand tools and usages \n2.6  Materials and consumables used in jewelry fabrication \n2.7  Operation of machines and equipment in fabricating jewelry   \n2.8  Basic measuring and weighing devices \n2.9  Read and understand specification \n2.10  Interpret design and illustration  \n2.11  Factor that can affect the flow of fabrication \n2.12  Procedures for checking serviceability of applicable tools and \nequipment \n2.13  Safe operating procedures for applicable tools and equipment \n2.14  Follow organizational, client quality and work standards \n2.15  Organizational procedures for storage of chemicals, tools and \nequipment  \n2.16  First-aid measures \n2.17  Safe work practices and procedures/OH&S requirements \n2.18  Accounting of unused/excess materials\n\n--- PDF PAGE 42 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC II                    Promulgated: Nov. 25, 2010 \n40 \n \n3.  Underpinning \nSkills \n3.1  Following oral and written instructions \n3.2  Reading and interpreting specifications, illustrations and \ndrawings \n3.3  Steady hand and good motor skill \n3.4  Identifying relevant fabrication process  on every task \n3.5  Measurements, weighing and calculation \n3.6  Selecting appropriate tools and equipment \n3.7  Selecting appropriate materials  \n3.8  Applying appropriate production techniques \n3.9  Applying first-aid measures \n3.10  Applying safe working skills \n3.11 Identifying alternative metals  \n4.  Resource \nImplications \nThe following resources should be provided: \n4.1 \nMaterials relevant to the activity  \n4.2 \nTools, machineries and equipment \n4.3 \nConsumables \n4.4 \nPersonal Protective Equipment (PPE)  \n4.5 \nWorkplace \n4.6 \nDocumentation \n4.7 \nExhaust fan \n4.8 \nFire extinguisher \n \n5.  Method of \nAssessment \nCompetency in this unit must may be assessed through: \n5.1 Demonstration with oral  questioning \n5.2 Portfolio (Training Certificates, Certificate of   Employment, \nWork piece, etc.)  \n5.3 Third Party Report\n6.  Context of \nAssessment \n6.1 Competency may be assessed in the workplace or in a \nsimulated workplace (TESDA Accredited Assessment \nCenter)\n",
