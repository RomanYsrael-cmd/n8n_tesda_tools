  "source_section_text": "SECTION 2 COMPETENCY STANDARDS\n\nThis section gives the details of the contents of the basic, common and core\nunits of competency required in JEWELRY MAKING (FINE JEWELRY) NC II.\n\nBASIC COMPETENCIES\n\nUNIT OF COMPETENCY : PARTICIPATE IN WORKPLACE COMMUNICATION\nUNIT CODE\n : 500311105\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes\nrequired to gather, interpret and convey information in\nresponse to workplace requirements.\n\nELEMENT\nPERFORMANCE CRITERIA\nBold and Italicized terms are elaborated in the\nRange of Variables\n1. Obtain and convey\nworkplace\ninformation\n1.1 Specific and relevant information is accessed from\nappropriate sources\n1.2 Effective questioning , active listening and speaking\nskills are used to gather and convey information\n1.3 Appropriate medium is used to transfer information\nand ideas\n1.4 Appropriate non- verbal communication is used\n1.5 Appropriate lines of communication with supervisors\nand colleagues are identified and followed\n1.6 Defined workplace procedures for the location and\nstorage of information are used\n1.7 Personal interaction is carried out clearly and concisely\n2. Participate in\nworkplace meetings\nand discussions\n2.1 Team meetings are attended on time\n2.2 Own opinions are clearly expressed and those of\nothers are listened to without interruption\n2.3 Meeting inputs are consistent with the meeting purpose\nand established protocols\n2.4 Workplace interactions are conducted in a courteous\nmanner\n2.5 Questions about simple routine workplace procedures\nand maters concerning working conditions of\nemployment are asked and responded to\n2.6 Meeting outcomes are interpreted and implemented\n\n--- PDF PAGE 5 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC II Promulgated: Nov. 25, 2010\n3\n\n3. Complete relevant\nwork related\ndocuments\n\n3.1 Range of forms relating to conditions of employment\nare completed accurately and legibly\n3.2 Workplace data is recorded on standard workplace\nforms and documents\n3.3 Basic mathematical processes are used for routine\ncalculations\n3.4 Errors in recording information on forms/ documents\nare identified and properly acted upon\n3.5 Reporting requirements to supervisor are completed\naccording to organizational guidelines\n\n--- PDF PAGE 6 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC II Promulgated: Nov. 25, 2010\n4\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Appropriate sources\n1.1 Team members\n1.2 Suppliers\n1.3 Trade personnel\n1.4 Local government\n1.5 Industry bodies\n2. Medium\n2.1 Memorandum\n2.2 Circular\n2.3 Notice\n2.4 Information discussion\n2.5 Follow-up or verbal instructions\n2.6 Face to face communication\n3. Storage\n3.1 Manual filing system\n3.2 Computer-based filing system\n4. Forms\n4.1\nPersonnel forms, telephone message forms,\nsafety reports\n5. Workplace interactions\n5.1 Face to face\n5.2 Telephone\n5.3 Electronic and two way radio\n5.4\nWritten including electronic, memos, instruction\nand forms, non-verbal including gestures,\nsignals, signs and diagrams\n6. Protocols\n6.1 Observing meeting\n6.2 Compliance with meeting decisions\n6.3 Obeying meeting instructions\n\n--- PDF PAGE 7 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC II Promulgated: Nov. 25, 2010\n5\n EVIDENCE GUIDE\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Prepared written communication following standard\nformat of the organization\n1.2 Accessed information using communication\nequipment\n1.3 Made use of relevant terms as an aid to transfer\ninformation effectively\n1.4 Conveyed information effectively adopting the formal\nor informal communication\n2. Underpinning\nKnowledge\n\n2.1 Effective communication\n2.2 Different modes of communication\n2.3 Written communication\n2.4 Organizational policies\n2.5 Communication procedures and systems\n2.6 Technology relevant to the enterprise and the\nindividual’s work responsibilities\n3. Underpinning Skills\n3.1 Follow simple spoken language\n3.2 Perform routine workplace duties following simple\nwritten notices\n3.3 Participate in workplace meetings and discussions\n3.4 Complete work related documents\n3.5 Estimate, calculate and record routine workplace\nmeasures\n3.6 Basic mathematical processes of addition,\nsubtraction, division and multiplication\n3.7 Ability to relate to people of social range in the\nworkplace\n3.8 Gather and provide information in response to\nworkplace requirements\n4. Resource\nImplications\n4.1 Fax machine\n4.2 Telephone\n4.3 Writing materials\n4.4\nInternet\n5. Method of\nAssessment\n5.1 Direct Observation\n5.2 Oral interview and written test\n6. Context for\nAssessment\n6.1 Competency may be assessed individually in the\nactual workplace or through accredited institution\n\n--- PDF PAGE 8 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC II Promulgated: Nov. 25, 2010\n6\nUNIT OF COMPETENCY : WORK IN TEAM ENVIRONMENT\nUNIT CODE\n : 500311106\nUNIT DESCRIPTOR : This unit covers the skills, knowledge and attitudes to\nidentify role and responsibility as a member of a team.\n\nELEMENT\nPERFORMANCE CRITERIA\nBold and Italicized terms are elaborated in the\nRange of Variables\n1. Describe team role\nand scope\n1.1 The role and objective of the team is identified from\navailable sources of information\n1.2 Team parameters, reporting relationships and\nresponsibilities are identified from team discussions\nand appropriate external sources\n2. Identify own role\nand responsibility\nwithin team\n2.1 Individual role and responsibilities within the team\nenvironment are identified\n2.2 Roles and responsibility of other team members are\nidentified and recognized\n2.3 Reporting relationships within team and external to\nteam are identified\n3. Work as a team\nmember\n3.1 Effective and appropriate forms of communications\nused and interactions undertaken with team members\nwho contribute to known team activities and objectives\n3.2 Effective and appropriate contributions made to\ncomplement team activities and objectives, based on\nindividual skills and competencies and workplace\ncontext\n3.3 Observed protocols in reporting using standard\noperating procedures\n3.4 Contribute to the development of teamwork plans\nbased on an understanding of team’s role and\nobjectives and individual competencies of the\nmembers.\n\n--- PDF PAGE 9 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC II Promulgated: Nov. 25, 2010\n7\n RANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Role and objective\nof team\n1.1\nWork activities in a team environment with enterprise\nor specific sector\n1.2\nLimited discretion, initiative and judgement maybe\ndemonstrated on the job, either individually or in a\nteam environment\n2. Sources of\ninformation\n2.1\nStandard operating and/or other workplace\nprocedures\n2.2\nJob procedures\n2.3\nMachine/equipment manufacturer’s specifications and\ninstructions\n2.4\nOrganizational or external personnel\n2.5\nClient/supplier instructions\n2.6\nQuality standards\n2.7\nOHS and environmental standards\n3. Workplace context\n3.1\nWork procedures and practices\n3.2\nConditions of work environments\n3.3\nLegislation and industrial agreements\n3.4\nStandard work practice including the storage, safe\nhandling and disposal of chemicals\n3.5\nSafety, environmental, housekeeping and quality\nguidelines\n\n--- PDF PAGE 10 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC II Promulgated: Nov. 25, 2010\n8\n EVIDENCE GUIDE\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Operated in a team to complete workplace activity\n1.2 Worked effectively with others\n1.3 Conveyed information in written or oral form\n1.4 Selected and used appropriate workplace language\n1.5 Followed designated work plan for the job\n1.6 Reported outcomes\n2. Underpinning\nKnowledge\n2.1 Communication process\n2.2 Team structure\n2.3 Team roles\n2.4 Group planning and decision making\n3. Underpinning Skills\n3.1 Communicate appropriately, consistent with the\nculture of the workplace\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1 Access to relevant workplace or appropriately\nsimulated environment where assessment can take\nplace\n4.2 Materials relevant to the proposed activity or tasks\n5. Method of\nAssessment\nCompetency may be assessed through:\n5.1 Observation of the individual member in relation to\nthe work activities of the group\n5.2 Observation of simulation and or role play involving\nthe participation of individual member to the\nattainment of organizational goal\n5.3. Case studies and scenarios as a basis for discussion\nof issues and strategies in teamwork\n6. Context for\nAssessment\n6.1 Competency may be assessed in workplace or in a\nsimulated workplace setting\n6.2 Assessment shall be observed while task are being\nundertaken whether individually or in group\n\n--- PDF PAGE 11 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC II Promulgated: Nov. 25, 2010\n9\n UNIT OF COMPETENCY: PRACTICE CAREER PROFESSIONALISM\n\n UNIT CODE : 500311107\n\n UNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes in\npromoting career growth and advancement.\n\nELEMENT\nPERFORMANCE CRITERIA\nBold and Italicized terms are elaborated in the\nRange of Variables\n1. Integrate personal\nobjectives with\norganizational goals\n1.1 Personal growth and work plans are pursued towards\nimproving the qualifications set for the profession\n1.2 Intra- and interpersonal relationships are maintained\nin the course of managing oneself based on\nperformance evaluation\n1.3 Commitment to the organization and its goal is\ndemonstrated in the performance of duties\n2. Set and meet work\npriorities\n2.1 Competing demands are prioritized to achieve\npersonal, team and organizational goals and\nobjectives.\n2.2 Resources are utilized efficiently and effectively to\nmanage work priorities and commitments\n2.3 Practices along economic use and maintenance of\nequipment and facilities are followed as per\nestablished procedures\n3. Maintain professional\ngrowth and\ndevelopment\n3.1 Trainings and career opportunities are identified\nand availed of based on job requirements\n3.2 Recognitions are sought/received and\ndemonstrated as proof of career advancement\n3.3 Licenses and/or certifications relevant to job and\ncareer are obtained and renewed\n\n--- PDF PAGE 12 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC II Promulgated: Nov. 25, 2010\n10\n RANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Evaluation\n1.1 Performance Appraisal\n1.2 Psychological Profile\n1.3 Aptitude Tests\n2. Resources\n2.1 Human\n2.2 Financial\n2.3 Technology\n2.3.1 Hardware\n2.3.2 Software\n3. Training and career\nopportunities\n3.1 Participation in training programs\n 3.1.1 Technical\n 3.1.2 Supervisory\n 3.1.3 Managerial\n 3.1.4 Continuing Education\n3.2 Serving as Resource Persons in conferences and\nworkshops\n4. Recognitions\n4.1 Recommendations\n4.2 Citations\n4.3 Certificate of Appreciations\n4.4 Commendations\n4.5 Awards\n4.6 Tangible and Intangible Rewards\n5. Licenses and/or\ncertifications\n5.1 National Certificates\n5.2 Certificate of Competency\n5.3 Support Level Licenses\n\n--- PDF PAGE 13 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC II Promulgated: Nov. 25, 2010\n11\n5.4 Professional Licenses\n\n EVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Attained job targets within key result areas (KRAs)\n1.2 Maintained intra - and interpersonal relationship in the\ncourse of managing oneself based on performance\nevaluation\n1.3 Completed trainings and career opportunities which are\nbased on the requirements of the industries\n1.4 Acquired and maintained licenses and/or certifications\naccording to the requirement of the qualification\n2. Underpinning\nKnowledge\n2.1 Work values and ethics (Code of Conduct, Code of\nEthics, etc.)\n2.2 Company policies\n2.3 Company operations, procedures and standards\n2.4 Fundamental rights at work including gender sensitivity\n2.5 Personal hygiene practices\n3. Underpinning Skills\n3.1 Appropriate practice of personal hygiene\n3.2 Intra and Interpersonal skills\n3.3 Communication skills\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1 Workplace or assessment location\n4.2 Case studies/scenarios\n5. Method of\nAssessment\nCompetency may be assessed through:\n5.1 Portfolio Assessment\n5.2 Interview\n5.3 Simulation/Role-plays\n5.4 Observation\n5.5 Third Party Reports\n5.6 Exams and Tests\n6. Context for\nAssessment\n6.1 Competency may be assessed in the work place or in a\nsimulated work place setting\n\n--- PDF PAGE 14 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC II Promulgated: Nov. 25, 2010\n12\n\nUNIT OF\nCOMPETENCY :\n PRACTICE OCCUPATIONAL HEALTH AND SAFETY\nPROCEDURES\nUNIT CODE : 500311108\nUNIT DESCRIPTOR :\nThis unit covers the outcomes required to comply with\nregulatory\nand\norganizational\nrequirements\nfor\noccupational health and safety.\n\nELEMENT\nPERFORMANCE CRITERIA\nBold and Italicized terms are elaborated in the\nRange of Variables\n1. Identify hazards\nand risks\n1.1 Safety regulations and workplace safety and hazard\ncontrol practices and procedures are clarified and\nexplained based on organization procedures\n\n1.2 Hazards/risks in the workplace and their corresponding\nindicators are identified to minimize or eliminate risk to\nco-workers, workplace and environment in accordance\nwith organization procedures\n\n1.3 Contingency measures during workplace accidents,\nfire and other emergencies are recognized and\nestablished in accordance with organization procedures\n2. Evaluate hazards\nand risks\n2.1 Terms of maximum tolerable limits which when\nexceeded will result in harm or damage are identified\nbased on threshold limit values (TLV)\n\n2.2 Effects of the hazards are determined\n\n2.3 OHS issues and/or concerns and identified safety\nhazards are reported to designated personnel in\naccordance with workplace requirements and relevant\nworkplace OHS legislation\n\n--- PDF PAGE 15 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC II Promulgated: Nov. 25, 2010\n13\n\nELEMENT\nPERFORMANCE CRITERIA\nBold and Italicized terms are elaborated in the\nRange of Variables\n3. Control hazards and\nrisks\n3.1 Occupational Health and Safety (OHS) procedures for\ncontrolling hazards/risks in workplace are consistently\nfollowed\n3.2 Procedures for dealing with workplace accidents, fire\nand emergencies are followed in accordance with\norganization OHS policies\n3.3 Personal protective equipment (PPE) is correctly\nused in accordance with organization OHS\nprocedures and practices\n3.4 Appropriate assistance is provided in the event of a\nworkplace emergency in accordance with established\norganization protocol\n\n4. Maintain OHS\nawareness\n\n4.1 Emergency-related drills and trainings are\nparticipated in as per established organization\nguidelines and procedures\n4.2 OHS personal records are completed and updated\nin accordance with workplace requirements\n\n--- PDF PAGE 16 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC II Promulgated: Nov. 25, 2010\n14\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Safety regulations\nMay include but are not limited to:\n1.1 Clean Air Act\n1.2 Building code\n1.3 National Electrical and Fire Safety Codes\n1.4 Waste management statutes and rules\n1.5 Philippine Occupational Safety and Health Standards\n1.6 DOLE regulations on safety legal requirements\n1.7 ECC regulations\n2. Hazards/Risks\nMay include but are not limited to:\n2.1 Physical hazards – impact, illumination, pressure,\nnoise, vibration, temperature, radiation\n2.2 Biological hazards- bacteria, viruses, plants, parasites,\n mites, molds, fungi, insects\n2.3 Chemical hazards – dusts, fibers, mists, fumes,\nsmoke, gasses, vapors\n2.4 Ergonomics\n2.4.1 Psychological factors – over exertion/ excessive\nforce, awkward/static positions, fatigue, direct\npressure, varying metabolic cycles\n2.4.2 Physiological factors – monotony, personal\nrelationship, work out cycle\n3.\nContingency\nmeasures\nMay include but are not limited to:\n3.1 Evacuation\n3.2 Isolation\n3.3 Decontamination\n3.4 (Calling designed) emergency personnel\n4. PPE\nMay include but are not limited to:\n4.1 Mask\n4.2 Gloves\n4.3 Goggles\n4.4 Hair Net/cap/bonnet\n4.5 Face mask/shield\n4.6 Ear muffs\n4.7 Apron/Gown/coverall/jump suit\n4.8 Anti-static suits\n\n--- PDF PAGE 17 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC II Promulgated: Nov. 25, 2010\n15\n\nVARIABLE\nRANGE\n\n5. Emergency-related\ndrills and training\n\n5.1 Fire drill\n5.2 Earthquake drill\n5.3 Basic life support/CPR\n5.4 First aid\n5.5 Spillage control\n5.6 Decontamination of chemical and toxic\n5.7 Disaster preparedness/management\n\n6. OHS personal\nrecords\n\n6.1 Medical/Health records\n6.2 Incident reports\n6.3 Accident reports\n6.4 OHS-related training completed\n\n--- PDF PAGE 18 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC II Promulgated: Nov. 25, 2010\n16\n EVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Explained clearly established workplace safety and\nhazard control practices and procedures\n1.2 Identified hazards/risks in the workplace and its\ncorresponding indicators in accordance with company\nprocedures\n1.3 Recognized contingency measures during workplace\naccidents, fire and other emergencies\n1.4 Identified terms of maximum tolerable limits based on\nthreshold limit value- TLV.\n1.5 Followed Occupational Health and Safety (OHS)\nprocedures for controlling hazards/risks in workplace\n1.6 Used Personal Protective Equipment (PPE) in\naccordance with company OHS procedures and\npractices\n1.7 Completed and updated OHS personal records in\naccordance with workplace requirements\n2. Underpinning\nKnowledge\n2.1 OHS procedures and practices and regulations\n2.2 PPE types and uses\n2.3 Personal hygiene practices\n2.4 Hazards/risks identification and control\n2.5 Threshold Limit Value –TLV\n2.6 OHS indicators\n2.7 Organization safety and health protocol\n2.8 Safety consciousness\n2.9 Health consciousness\n3. Underpinning Skills\n\n3.1 Practice of personal hygiene\n3.2 Hazards/risks identification and control skills\n3.3 Interpersonal skills\n3.4 Communication skills\n4. Resource\nImplications\nThe following resources must be provided:\n4.1 Workplace or assessment location\n4.2 OHS personal records\n4.3 PPE\n4.4 Health records\n5. Method of\nAssessment\nCompetency may be assessed through:\n5.1 Portfolio Assessment\n5.2 Interview\n5.3 Case Study/Situation\n6. Context for\nAssessment\n6.1 Competency may be assessed in the work place or in\na simulated work place setting\n\n--- PDF PAGE 19 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC II Promulgated: Nov. 25, 2010\n17\n\nCOMMON COMPETENCIES\n\nUNIT OF COMPETENCY :\n\nOBSERVE PROCEDURES, SPECIFICATIONS\nAND MANUALS OF INSTRUCTIONS\nUNIT CODE :\nCON311202\nUNIT DESCRIPTOR :\nThis unit covers the knowledge, skills and attitudes\nin identifying, interpreting, applying services in\naccordance with specifications and manuals, and\nstorage of manuals.\nELEMENT\nPERFORMANCE CRITERIA\nBold and Italicized terms are elaborated in the\nRange of Variables\n1. Identify and access\nspecification /\nmanuals\n\n1.1 Appropriate manuals are identified and accessed as\nper job requirements.\n1.2 Version and date of manual are checked to ensure\nthat correct specification and procedure are identified.\n2. Interpret manuals\n\n2.1 Relevant sections/ chapters of specifications/manuals\nare accessed in relation to the work to be conducted.\n2.2 Information and procedure/s in the manual are\ninterpreted in accordance with current industry\npractices.\n3. Apply information in\nmanual\n3.1 Manual is interpreted according to job requirements\nand in accordance with current industry practices.\n3.2 Work steps are correctly identified in accordance with\nmanufacturer’s specification.\n3.3 (Manual) Data in the manual data are applied\naccording to the given task.\n3.4 All correct sequencing and adjustments are interpreted\nin accordance with information contained on the\nmanual or in accordance with specifications.\n4. Store manuals\n4.1 Manual or specifications are stored appropriately to\nensure prevention of damage, ready access and\nupdating of information when required in accordance\nwith company requirements and current industry\npractices.\n\n--- PDF PAGE 20 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC II Promulgated: Nov. 25, 2010\n18\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Procedures,\nSpecifications and\nManuals of\ninstructions\n\nKinds of Manuals:\n1.1 Manufacturer’s Specification Manual\n1.2 Periodic Maintenance Manual\n1.3 Maintenance Procedure Manual\n1.4 Repair Manual\n\n--- PDF PAGE 21 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC II Promulgated: Nov. 25, 2010\n19\nEVIDENCE GUIDE\n\n1. Critical aspects\nof competency\nAssessment requires evidence that the candidate:\n1.1 Identified and accessed specification/manuals as per job\nrequirements.\n1.2 Interpreted manuals in accordance with industry practices.\n1.3 Applied information in manuals according to the given\ntask.\n1.4 Stored manuals in accordance with company\nrequirements.\n2. Underpinning\nKnowledge\n2.1 Type of manuals used in the Decorative Crafts (Jewelry)\nSector\n2.2 Identification of symbols used in the manuals\n2.3 Identification of units of measurements\n2.4 Unit/s of conversion\n3. Underpinning\nSkills\n3.1 Reading and comprehension skills required to identify and\ninterpret decorative crafts (jewelry) manuals and\nspecifications\n3.2 Accessing information and data\n4. Resource\nImplications\nThe following resources should be provided:\n4.1 All manuals/catalogues relative to the decorative crafts\n(jewelry) sector\n5. Methods of\nAssessment\nCompetency in this unit must be assessed through:\n5.1 Direct observation\n5.2 Questions/Interview\n6. Context for\nAssessment\n6.1 Competency assessment must be undertaken in\naccordance with the endorsed TESDA assessment\nguidelines\n6.2 Assessment may be conducted in the workplace or\nsimulated environment\n\n--- PDF PAGE 22 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC II Promulgated: Nov. 25, 2010\n20\n\nUNIT OF COMPETENCY :\nPERFORM MENSURATIONS AND CALCULATIONS\nUNIT CODE :\nCON311203\nUNIT DESCRIPTOR :\nThis unit covers the knowledge, skills and attitudes in\nidentifying and measuring objects based on the\nrequired performance standards.\n\nELEMENT\nPERFORMANCE CRITERIA\nBold and Italicized terms are elaborated in the\nRange of Variables\n1. Select measuring\ninstrument\n\n1.1 Object/design or component to be measured is\nidentified, classified and interpreted in accordance with\nthe appropriate geometric shape/s.\n1.2 Measuring tools are selected/identified as per\nobject/design to be measured or job requirements\n1.3 Correct design and specifications are obtained from\nrelevant sources.\n1.4 Appropriate measuring instruments are selected\naccording to job requirements\n1.5 Alternative measuring tools are used without sacrificing\ncost and quality of work.\n2. Carry out\nmeasurements and\ncalculations\n\n2.1 Accurate measurements are obtained according to job\nrequirements.\n2.2 Alternative measuring tools are used without sacrificing\ncost and quality of work.\n2.3 Calculation needed to complete work tasks are\nperformed using four basic process of addition (+),\nsubtraction (-) multiplication (x) and division(/) including\nbut not limited to\ntrigonometric functions, algebraic computations\n2.4 Calculations involving fractions, percentages and mixed\nnumbers are used to complete workplace tasks.\n2.5 Numerical computation is self-checked and corrected\nfor accuracy.\n2.6 Instruments are read to the limit of accuracy and\nprecision of the tool used.\n2.7 Systems of measurement are identified and converted\naccording to job requirements/ISO\n2.8 Work pieces are measured according to job\nrequirements.\n\n--- PDF PAGE 23 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC II Promulgated: Nov. 25, 2010\n21\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n\n1. Geometric shape\n\nIncluding but not limited to:\n1.1 Round\n1.2 Square\n1.3 Rectangle\n1.4 Triangle\n1.5 Sphere\n1.6 Cone\n2. Measuring\ninstruments\n\nIncluding but not limited to:\n2.1 tape measure\n2.2 various calipers\n2.3 weighing scale\n2.4 densimeter\n2.5 ruler\n2.6 micrometer\n3. Measurements and\ncalculations\n\nIncluding but not limited to:\n3.1 size\n3.2 width\n3.3 length\n3.4 weight\n3.5 area\n3.6 volume\n3.7 diameter\n3.8 thickness\n3.9 angle/s\n\n--- PDF PAGE 24 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC II Promulgated: Nov. 25, 2010\n22\n EVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Selected and prepared appropriate measuring\ninstruments in accordance with job requirements\n1.2 Performed measurements and calculations according to\njob requirements/ISO\n2. Underpinning\nknowledge\n2.1 TRADE MATHEMATICS/MENSURATION\n2.1.1 Four fundamental operation\n2.1.2 Linear measurement\n2.1.3 Dimensions\n2.1.4 Unit conversion\n2.1.5 Ratio and proportion\n2.1.6 Trigonometric functions\n2.1.7 Algebraic equations\n3. Underpinning\nskills\n3.1 Performing mensuration and calculation by addition,\nsubtraction, multiplication and division: trigonometric\nfunctions and algebraic equations\n3.2 Visualizing objects and shapes\n3.3 Interpreting and using appropriate formula(s) for volume,\nareas, perimeters of plane and geometric figures\n3.4 Proper handling and storing of measuring instruments\n4. Resource\nimplications\nThe following resources should be provided:\n4.1 Workplace location\n4.2 Problems to solve\n4.3 Measuring instrument/s appropriate to carry out tasks\n4.4 Instructional materials relevant to the proposed activity\n5. Methods of\nassessment\nCompetency in this unit must be assessed through:\n5.1 Direct observation/Actual test.\n5.2 Questions/Interview\n6. Context for\nassessment\n6.1 Competency assessment must be undertaken in\naccordance with the endorsed TESDA assessment\nguidelines\n6.2 Assessment may be conducted in the workplace or in a\n(simulated) similar environment\n\n--- PDF PAGE 25 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC II Promulgated: Nov. 25, 2010\n23\n\nUNIT OF COMPETENCY :\nMANAGE OWN PERFORMANCE\nUNIT CODE\n:\nHCS516202\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes\nrequired in effectively managing one’s workload and\nquality of work.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Plan for\ncompletion of own\nworkload\n\n1.1\nTasks accurately identified\n1.2\nPriority allocated to each task\n1.3\nTime lines allocated to each task or series of tasks\n1.4\nTasks deadlines known and complied with whenever\npossible\n1.5\nWork schedules are known and completed within\nagreed time frames\n1.6\nWork plans developed according to assignment\nrequirements and employer policy\n1.7\nUncompleted work or tasks detailed and responsibility\nfor completion passed to incoming shift or other\nappropriate persons\n2. Maintain quality of\nown performance\n2.1\nPersonal performance continually monitored against\nagreed performance standards\n2.2\nAdvice and guidance sought when necessary to achieve\nor maintain agreed standards\n2.3\nGuidance from management applied to achieve or\nmaintain agreed standards\n2.4\nStandard of work clarified and agreed according to\nemployer policy and procedures\n3. Build credibility\nwith\ncustomers/clients\n3.1\nClient expectations for reliability, punctuality and\nappearance adhered to\n3.2\nPossible causes of client/customer dissatisfaction\nidentified, dealt with and recorded according to\nemployer policy\n3.3\nClient fully informed of all relevant security matters in a\ntimely manner and according to agreed reporting\nprocedures\n\n--- PDF PAGE 26 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC II Promulgated: Nov. 25, 2010\n24\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Tasks\n\n1.1\nMay identified through:\n1.1.1 Assignment instructions\n1.1.2 Verbal Instructions by senior officer\n1.1.3 Policy Documents\n1.1.4 Duty Statements\n1.1.5 Self Assessment\n1.2 May be:\n1.2.1 Daily tasks\n1.2.2 Weekly tasks\n1.2.3 Regularly or irregularly occurring tasks\n2. Performance\nStandards\nMay include:\n2.1\nAssignment/Instructions\n2.2\nProcedures established in policy documents\n\n--- PDF PAGE 27 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC II Promulgated: Nov. 25, 2010\n25\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nPlanned for completion of own workload\n1.2\nAssessed verbal or written work plan through observation\nand discussion of site and employer requirements\n1.3\nDemonstrated capacity to complete task within specified\ntime frame\n1.4\nMaintained quality of own performance\n2. Underpinning\nknowledge and\nattitudes\n2.1\nSite and assignment requirements\n2.2\nEmployer policy on performance management\n2.3\nIndicators of appropriate performance for each area of\nresponsibility\n2.4\nSteps for improving or maintaining performance\n3. Underpinning\nskills\n3.1\nCapacity to plan and prioritize security work loads and\nrequirements\n3.2\nTime and task management\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nAssessment Centers/Venues\n4.2\nAccredited Assessors\n4.3\nModes of Assessment\n4.4\nEvaluation Reports\n4.5\nAccess to a relevant venue, equipment and materials\n4.6\nAssignment Instructions\n4.7\nLogbooks\n4.8\nOperational manuals and makers’/customers’\ninstructions (if relevant)\n4.9\nAssessment Instruments, including personal planner and\nassessment record book\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1\nWritten Test/Examination\n5.2\nDemonstration with questioning\n5.3\nObservation with questioning\n6. Context of\nassessment\n6.1 Competency assessment must be undertaken in\naccordance with the endorsed TESDA assessment\nguidelines\n6.2 Assessment may be conducted in the workplace or in a\n(simulated) similar environment\n\n--- PDF PAGE 28 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC II Promulgated: Nov. 25, 2010\n26\n\nUNIT OF COMPETENCY :\nAPPLY BASIC FIRST AID\nUNIT CODE\n:\nHCS323203\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes\nrequired to provide an initial response where First Aid\nis required. In this unit it is assumed that the First\nAider is working under supervision and / or according\nto established workplace First Aid procedures and\npolicies\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Assess the situation\n1.1\n Physical hazards to self and casualty’s health and\nsafety are identified.\n1.2\nImmediate risks to self and casualty’s occupational\nhealth and safety (OSH )are minimized by\ncontrolling the hazard in accordance with OSH\nrequirements.\n1.3\nCasualty’s vital signs and physical condition are\nassessed in accordance with workplace procedures.\n2. Apply basic first aid\ntechniques\n2.1\nFirst Aid management is provided in accordance\nwith established First Aid procedures.\n2.2\nCasualty is reassured in a caring and calm manner\nand made comfortable using available resources.\n2.3\nFirst Aid assistance is sought from others in a timely\nmanner and as appropriate.\n2.4\nCasualty’s condition is monitored and responded\nto in accordance with effective First Aid principles\nand workplace procedures.\n2.5\nDetails of casualty’s physical condition, changes in\nconditions,\nmanagement\nand\nresponse\nare\naccurately recorded in line with organizational\nprocedures.\n2.6\nCasualty management is finalized according to\nhis/her needs and First Aid principles.\n\n--- PDF PAGE 29 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC II Promulgated: Nov. 25, 2010\n27\n\n3. Communicate details\nof the incident\n3.1\nAppropriate medical assistance is requested using\nrelevant communication media and equipment.\n3.5\nDetails of casualty’s condition and management\nactivities are accurately conveyed to emergency\nservices/relieving personnel.\n3.6\nReports to supervisors are prepared in a timely\nmanner, presenting all relevant facts according to\nestablished company procedures.\n\n--- PDF PAGE 30 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC II Promulgated: Nov. 25, 2010\n28\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. First Aid\nManagement\nThis may include but not limited to:\n1.1\nWorkplace policies and procedures\n1.2\nIndustry/site specific regulations, codes\n1.3\nOSH\n1.4\nState and territory workplace health and safety\nrequirements\n1.5\nAllergies the casualty may have\n2. Physical Hazards\nPhysical hazards may include:\n2.1\nWorkplace hazards\n2.2\nEnvironmental hazards\n2.3\nProximity of other people\n2.4\nHazards associated with casualty management\nprocesses\n3. Risks\nRisks may include:\n3.1\nWorksite equipment, machinery and substances\n3.2\nEnvironmental risks\n3.3\nBodily fluids\n3.4\nRisk of further injury to the casualty\n3.5\nRisk associated with the proximity of the others and\nbystanders\n4. Casualty’s Condition\nCasualty’s condition may include but not limited to the\nfollowing:\n4.1\nAbdominal injuries\n4.2\nAllergic reactions\n4.3\nBleeding\n4.4\nBurns-thermal, chemical, friction, electrical\n4.5\nCardiac conditions\n4.6\nChemical contamination\n4.7\nCod injuries\n4.8\nCrush injuries\n4.9\nDislocations\n4.10 Drowning\n4.11 Eye injuries\n4.12 Fractures\n4.13 Head injuries\n4.14 Epilepsy\n4.15 Minor skin injuries\n4.16 Neck and spinal injuries\n4.17 Needle stick injuries\n\n--- PDF PAGE 31 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC II Promulgated: Nov. 25, 2010\n29\nVARIABLE\nRANGE\n4.18 Poisoning and toxic substances\n4.19 Shock\n4.20 Smoke inhalation\n5. Equipment and\nResources\nEquipment and other resources may include:\n5.1\nDefibrillation units\n5.1\nPressure bandages\n5.2\nThermometers\n5.3\nFirst Aid kit\n5.4\nEyewash\n5.5\nThermal blankets\n5.6\nPocket face masks\n5.7\nRubber gloves\n5.8\nDressing\n5.9\nSpace device\n5.10 Cervical collars\n6. Communication\nsystem\n6.1\nMobile phone\n6.2\nSatellite phones\n6.3\nHF/VHF radio\n6.4\nFlags\n6.5\nFlares\n6.6\nTwo - way radio\n6.7\nEmail\n6.8\nElectronic equipment\n7. Vital signs\n7.1\nBreathing\n7.2\nCirculation\n7.3\nConsciousness\n8. First Aid Principles\n8.1\nChecking the site for danger to self, casualty’ and\nothers and minimizing the danger\n8.2\nChecking and maintaining the casualty’s airways,\nbreathing and circulation\n\n--- PDF PAGE 32 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC II Promulgated: Nov. 25, 2010\n30\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nComplied with institutional requirements, OSH laws\ninfections control and manual handling procedures\nand relevant health regulations\n1.2\nIdentified physical hazards of the casualty and\nminimized immediate risks\n1.3\nAssessed and monitored the physical condition of\nthe casualty\n1.4\nResponded to emergency using basic life support\nmeasures.\n1.5\nProvided initial response where First Aid is required\n1.6\nDealt with complex casualties or incident\n1.7\nPrepared reports to concerned personnel in a\ntimely manner\n2. Underpinning\nknowledge\n2.1\nBasic anatomy and physiology\n2.2\nCompany standard operating procedures (SOPs)\n2.3\nDealing with confidentiality\n2.4\nKnowledge of the First Aiders’ skills limitations\n2.5\nOSH legislation and regulations\n2.6\nHow to gain access to and interpret material safety\ndata sheets\n3. Underpinning skills\n3.1\nResuscitation\n3.2\nSafe manual handling of casualty\n3.3\nConsideration of the welfare of the casualty\n3.4\nReport preparation\n3.5\nCommunication skills\n3.6\nAbility to interpret and use listed documents\n\n--- PDF PAGE 33 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC II Promulgated: Nov. 25, 2010\n31\n\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nAccess to relevant work station\n4.2\nRelevant institutional policies, guidelines procedure\nand protocol\n4.3\nEquipment and materials relevant to the proposed\nactivities\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1\nDemonstration with questioning\n5.2\nInterview\n5.3\nThird Party Report\n5.4\nPortfolio\n6. Context of\nassessment\n6.1\nAssessment may be done in a workplace or\nsimulated work area setting.\n\n--- PDF PAGE 34 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC II Promulgated: Nov. 25, 2010\n32\n\nUNIT TITLE:\nAPPLY QUALITY STANDARDS\nUNIT CODE:\nICT315202\nUNIT DESCRIPTOR:\nThis unit covers the knowledge, skills, attitudes required to\napply quality standards in the workplace. The unit also\nincludes the application of relevant safety procedures and\nregulations, organization procedures and customer\nrequirements\n\nELEMENT\n\nPERFORMANCE CRITERIA\nBold and Italicized terms are elaborated in the Range of Variables\n1. Assess quality of\n received materials or\n components\n1.1 Received materials or component parts are checked\n based on material specifications\n1.2 Defective material or components are identified and\n isolated following standard operating procedures\n1.3 Defective materials or components are replaced in\n accordance with workplace procedures.\n2. Assess own work\n2.1 Documents relative to quality within the company is\n identified and used\n2.2 Completed work is checked based on workplace standards\nrelevant to the task undertaken\n2.3 In cases of deviations from specified quality standards,\n causes are documented and reported in accordance with\n the workplace’ standards operating procedures\n3. Engage in process\n improvement\n3.1 Process improvement procedures are participated in\n relation to workplace assignment\n3.2 Work is carried out in accordance with process\n improvement procedures\n3.3 Performance of operation or quality of product or service is\n monitored in accordance to customer satisfaction\n\n--- PDF PAGE 35 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC II Promulgated: Nov. 25, 2010\n33\n\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Materials /\n components\nMay include but not limited to:\n1.1 Electrical materials and consumables\n1.2 Welding materials and consumables\n1.3 Furniture making materials and consumables\n1.4 Carpentry materials and consumables\n1.5 Masonry materials and consumables\n1.6 Heavy equipment materials and consumables\n2. Defective\nMay include but not limited to:\n2.1 Components / materials do not conform to specification\n2.2 Components / materials containing manufacturing defects\n2.3 Components / materials do not conform with government\n regulation i.e., PEC, environmental code\n2.4 Components / materials possessed safety defects\n3. Documents\nMay include but not limited to:\n3.1 Organization work procedures / reports\n3.2 Manufacturer’s instruction manual\n3.3 Customer requirements\n3.4 Forms\n4. Quality standards\nMay include but not limited to:\n4.1 Materials / consumables\n4.2 Component parts\n4.3 Final product\n4.4 Production processes\n4.5 Methods\n5. Customer\nMay include but not limited to:\n5.1 Co-worker\n5.2 Supplier\n5.3 Client\n5.4 Organization receiving the product or service\n\n--- PDF PAGE 36 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC II Promulgated: Nov. 25, 2010\n34\nEVIDENCE GUIDE\n1. Critical aspect of\n competency\nAssessment must show that the candidate:\n1.1 Demonstrates ability to follow company’s standard\n operating procedures\n1.2 Demonstrates knowledge of types and uses of materials\n and component parts\n1.3 Demonstrates knowledge of quality standards\n1.4 Demonstrates ability to follow process improvement\n procedures\n2. Underpinning\n knowledge\n2.1 Production processes\n2.2 Types and uses of materials and components\n2.3 Company standard operating procedures\n2.4 Safety practices and applications\n3. Underpinning skills\n3.1 Following production processes\n3.2 Checking of materials and component parts and finished\n products\n3.3 Following company standard operating procedures\n3.4 Applying safety practices\n4. Method of\n assessment\n4.1 Observation of practical skills\n4.2 Oral questions\n5. Resource implication\n\nThe following materials must be provided:\n5.1 Materials and component parts relevant to the activity\n5.2 Documents related to quality\n6. Context of\n Assessment\n6.1 Assessment may be conducted in the workplace or in a\n simulated environment.\n\n--- PDF PAGE 37 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC II Promulgated: Nov. 25, 2010\n35\nCORE COMPETENCIES\n\nUNIT OF COMPETENCY : FABRICATE BASIC JEWELRY COMPONENTS\n\nUNIT CODE : DCJ731301\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes\nin fabricating basic components of fine jewelry.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Prepare\nrequirements for\nfabrication\n\n1.1 Jewelry design construction, dimension, composition,\ncharacteristic and finish requirements are established from\npredetermined specifications in accordance with\norganizational and client requirements\n1.2 Fabrication and finish specifications and required outcomes\nas indicated in the prescribed form are confirmed and\nclarified as necessary with appropriate person(s) and in\naccordance with organizational and client’s requirements\n1.3 Appropriate preparation and fabrication techniques are\nestablished in accordance with job order requirements and\norganizational procedures\n1.4 Fabrication and finishing activities are prioritized in\naccordance with designated timeframes, organizational and\nspecific requirements\n1.5 Tools and equipment, materials and consumables are\nselected, requested and checked for operational\neffectiveness in accordance with the manufacturer’s\nspecification and organizational procedures\n2. Perform\nfabrication\n2.1 Pre-formed materials are fabricated to produce basic\ncomponents using applicable fabrication activities and\nsafe operating practices, protective equipment, and in\naccordance with OH&S, organizational and industry\naccepted methods\n2.2 Fabricated Item is checked to ensure if construction\nconforms with required specifications, quality and industry/\norganizational standard\n2.3 When necessary, defective items are reworked/retouched\nin accordance with specifications and organizational\nprocedures\n2.4 Fabricated Items are submitted to appropriate person(s) for\nquality control in accordance with industry/organizational\nrequirements and standards\n\n--- PDF PAGE 38 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC II Promulgated: Nov. 25, 2010\n36\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n\n2.5 Proper care in handling of materials are strictly observed to\nensure that quality and quantity is followed in accordance\nwith the organizational requirements\n2.6 Personal protective equipment (PPE) is used in\naccordance with job requirements and OHS requirements\n2.7 Metal filings of same kind and quality are melted together\nfor proper re-testing of its quality and quantity as required\nby organizational procedures and submitted to issuing\npersonnel for storage and safekeeping\n3. Perform post-\nfabrication\nactivities\n3.1 Documentation is completed and processed in accordance\nwith organizational requirements and standards\n3.2 Notification of work completion is made to appropriate\nperson(s) in accordance with organizational procedures\n3.3 Work area, tools and equipment are cleaned and stored in\naccordance with OHS and organizational requirements\n\n--- PDF PAGE 39 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC II Promulgated: Nov. 25, 2010\n37\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Appropriate\nperson(s)\nMay include but are not limited to:\n1.1 Supervisor\n1.2 Quality Control Personnel\n1.3 Designer\n2. Appropriate\npreparation and\nfabrication\ntechniques\nMay include but are not limited to:\n2.1 Melting and casting metal into ingot.\n2.2 De-oxidizing