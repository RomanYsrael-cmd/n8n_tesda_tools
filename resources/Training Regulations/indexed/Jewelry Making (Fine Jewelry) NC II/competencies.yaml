        "source_text": "--- PDF PAGE 49 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC II                    Promulgated: Nov. 25, 2010 \n47 \nUNIT OF COMPETENCY  :       PLATE JEWELRY \n \nUNIT CODE                        :       DCJ731303 \n  \nUNIT DESCRIPTOR          :      This unit covers the knowledge, skills and \nattitudes in plating jewelry of fine jewelry involving  \nsilver, gold and rhodium plating techniques. \n \n \nELEMENT\nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1.  Prepare \nrequirements for \nplating  \n \n1.1   Jewelry plating requirements are established from \npredetermined specifications in accordance with \norganizational and design specifications \n1.2   Plating techniques are selected in accordance with \nspecific plating/organizational requirements and \ndesignated timeframes \n1.3   Materials and consumables are selected, requested and \nobtained in accordance with organizational requirements \nand in consultation with appropriate person(s). \n1.4   Jewelry is subjected to quality control whether its ready \nfor plating in accordance with organizational procedures/ \nindustry standards  \n1.5   When necessary, defective items are returned for fixing in \naccordance with organizational procedures/ industry \nstandards \n1.6   Tools, machineries and equipment are selected and \nused appropriate to job requirements and check for \noperational effectiveness in accordance with \nmanufacturers’ specifications and organizational \nprocedures \n2.  Perform plating \n2.1   Plating activities are performed in accordance with OHS \nand organizational requirements, and industry standards  \n2.2   Plating result is produced as to required specifications \nand in accordance with organizational requirements and \nindustry standards \n2.3   Finished product is quality checked for color consistency \nin accordance with client’s specifications/ Philippine \nNational Standard (PNS) on Jewelry\n\n--- PDF PAGE 50 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC II                    Promulgated: Nov. 25, 2010 \n48 \n \n \nELEMENT\nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n3.  Perform post-\nplating activities \n3.1   Documentation is accurately completed and processed \nin accordance with organizational requirements  \n3.2   Finished item is packaged/presented and stored safely in \naccordance with organizational requirements \n3.3   Notification of work completion is made to appropriate \nperson(s) in accordance with organizational procedures \n3.4   Work area, tools and equipment are cleaned and stored in \naccordance with OHS and organizational requirements \n3.5   Unused/excess materials are collected and \nstored/returned in accordance with organizational \nrequirements\n\n--- PDF PAGE 51 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC II                    Promulgated: Nov. 25, 2010 \n49 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.  Plating \ntechniques(s)  \nMay include but are not limited to: \n1.1  Barrel \n1.2  Ordinary or manual \n2.  Plating \nactivities \nMay include but are not limited to: \n2.1   Select plating bath and appropriate container size  \n2.2   Warm plating bath to the correct temperature \n2.3   Select appropriate anode size for the jewelry to be plated  \n2.4   Connect jewelry to be plated to cathode [-] pole \n2.5   Plate - Immerse jewelry  in plating bath and turn on current \nrequirements \n2.6   Drag-out \n2.7   De-ionized  rinse \n2.8   Dry \n3.  Materials and \nconsumables \nMay include but are not limited to: \n3.1  Plating Bath \n       3.1.1  Silver  \n       3.1.2  Gold \n       3.1.3  Rhodium \n3.2  Anode \n3.3  De-ionized water \n3.4  Acid dip solution \n3.5  Anti-tarnish solution \n3.6  De-greasing solution \n4. Tools and \nequipment \nMay include but are not limited to: \nTools \n4.1  Jigs \n4.2  Thermometer \n4.3  Stirring rod \n4.4  Plating bath containers (e.g. beakers) \n Equipment and machineries \n4.5  Rectifier \n4.6  Heater \n4.7  Dryer \n4.8  Ultrasonic cleaner \n4.9  Steamer\n5.  Plating \nactivities \nMay include but are not limited to: \n5.1  Select plating bath and appropriate container size \n5.2  Warm plating bath to the correct temperature \n5.3  Select appropriate anode size for the jewelry to be plated \n5.4  Connect jewelry to be plated to cathode [-] pole \n5.5  Plate – Immerse jewelry in plating bath and turn on current \nrequirements\n\n--- PDF PAGE 52 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC II                    Promulgated: Nov. 25, 2010 \n50 \n5.6  Drag-out \n5.7  De-ionized rinse \n5.8  Dry \n6. Documentation \nMay include but are not limited to: \n6.1  Job Order form  \n6.2  Work instructions and procedures \n6.4  Materials and consumables used \n6.5 Time and record sheets\n\n--- PDF PAGE 53 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC II                    Promulgated: Nov. 25, 2010 \n51 \nEVIDENCE GUIDE \n \n1. Critical Aspects \nof Competency \n \n \nAssessment requires evidence that the candidate: \n1.1 Identified plating jewelry requirements based from \npredetermined specification and in accordance with client’s \nrequirements and organizational procedures \n1.2 Selected and obtained materials, consumables, tools, \nmachineries and equipment appropriate to job requirements and \nin accordance with manufacturer’s specifications and \norganizational procedures \n1.3 Performed applicable plating techniques  to produce the \nrequired specifications using safe operating practices and  \npersonal protective equipment, and in accordance with \norganizational requirements  \n1.4 Washed and dried plated jewelry to required specifications in \naccordance with organizational procedures  \n1.5 Quality checked finished product  for color consistency in \naccordance with design specifications \n1.6 Finished item is packaged/presented and stored safely in \naccordance with organizational requirements \n1.7 Notified work completion to appropriate person/s in accordance \nwith organizational procedures \n1.8 Observed safe work practices and procedures during the entire \nprocess in accordance with OHS and organizational \nrequirements   \n2. Underpinning  \nKnowledge \n \n2.1   Philippine National Standard (PNS) on Jewelry \n2.2   Types of jewelry \n2.3   Properties of metals used in jewelry \n2.4   Principles of plating \n2.5   Plating shop procedures \n2.6   Chemicals used in Plating \n2.7   Appropriate anode, voltage, temperature, and immersion   time  \n2.8   Tools, Machineries and equipment used in Plating \n2.9   Various Plating Baths \n2.10   Troubleshooting and maintenance of plating bath/solution \n2.11   Metal preparation and plating techniques  \n2.12   Factors affecting the selection of preparation and plating  \n          methods \n2.13   Relevant materials and consumables for given jewelry  plating  jobs \n2.14   Properties and characteristics gemstones \n2.15   Procedures for checking serviceability of applicable tools and \nequipment \n2.16   Safe operating procedures for applicable tools and  equipment \n2.17   Organization of customer service, quality and work standards \n2.18   Industry Standards of Qualities \n2.19   Organization procedures for storage of chemicals, tools and \nequipment \n2.20   First-aid measures \n2.21   Safe work practices and procedures/OH&S requirements \n2.22   Accounting of unused/excess materials\n\n--- PDF PAGE 54 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC II                    Promulgated: Nov. 25, 2010 \n52 \n \n3. Underpinning \nSkills \n3.1   Applicable plating techniques and processes \n3.2   Plating Sequence \n3.3   Weighing and measuring \n3.4   Selecting appropriate tools, machineries and equipment \n3.5   Selecting appropriate materials  \n3.6   Applying appropriate plating  \n3.7   Applying safe working skills \n3.8   Applying first-aid measures \n3.9   Performing troubleshooting and maintenance of plating \nbath/solution\n4.  Resource \nImplications \nThe following resources should be provided: \n4.1   Materials/Consumables relevant to the activity  \n4.2   Tools, machineries and equipment \n4.3   Consumables \n4.4    Personal Protective Equipment (PPE)  \n4.5    Workplace \n4.6    Documentation \n4.7    Exhaust fan \n4.8    Fire Extinguisher \n \n5.  Method of \nAssessment \nCompetency in this unit may be assessed through: \n5.1   Demonstration with oral  questioning \n5.2   Portfolio (Training Certificates, Certificate of  Employment, \nWorkpiece, etc.)  \n5.3   Third-Party Report \n6.  Context of \nAssessment\n6.1  Competency may be assessed in the workplace or in a \nsimulated workplace (TESDA Accredited Assessment Center)\n",
