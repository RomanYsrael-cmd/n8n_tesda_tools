  "source_section_text": "Section 1. Successful candidate shall be awarded a National\nCertificate signed by the TESDA Director General.\n\n4.2 Individuals aspiring to be awarded the qualification of Jewelry\nMaking(Fine Jewelry) NC II must acquire Certificates of Competency\nin all of the following individual core units of the Qualification.\nCandidates may apply for assessment in any accredited assessment\ncenter.\n\n4.2.1\n Fabricate basic jewelry components\n\n4.2.2\n Polish jewelry\n\n4.2.3\n Plate jewelry\n\n4.2.4\n Perform rubber mold making\n\nSuccessful candidates shall be awarded Certificates of Competency\n(COCs).\n\n4.3\n Upon accumulation and submission of all COCs acquired for the above\nunits of competency comprising this qualification, an individual shall be\nissued the corresponding National Certificate.\n\n4.4 Assessment shall focus on the core units of competency. The basic and\ncommon units shall be integrated or assessed concurrently with the\ncore units.\n\n4.5 The following are qualified to apply for assessment and certification:\n\n4.5.1 Graduates of formal and non-formal including enterprise-based\ntraining programs\n\n4.5.2 Experienced Workers (wage employed or self-employed)\n\n4.6\n The guidelines on assessment and certification are discussed in detail\nin the “Procedures Manual on Assessment and Certification” and\n“Guidelines on the Implementation of the Philippine TVET Qualification\nand Certification System (PTQCS)”.\n\n--- PDF PAGE 72 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC II Date Promulgated: Nov. 2010\n70\nPerform\nhair\nbleaching\nPerform\nhair\nbleaching\n\nCOMPETENCY MAP\n DECORATIVE CRAFTS SECTOR\nJEWELRY MAKING (Fine Jewelry) NC II\nObserve\nprocedures,\nspecifications\nand manuals\nof instructions\n\nManage\nown\nperformance\n\nPerform\nmensurations and\ncalculations\n\nCOMMON\nCOMPETENCIES\n\nApply\nquality\nstandards\nDemonstrate\nwork values\nPractice\nhousekeeping\nprocedures\nParticipate\nin workplace\ncommunication\nWork\n in team\nenvironment\nPractice\ncareer\nprofessionalism\nWork\nwith others\nDevelop and\npractice\nnegotiation\nskills\nUse\nmathematical\nconcepts and\ntechniques\nUse\nrelevant\ntechnologies\nSolve problems\nrelated to work\nactivities\nReceive and\nrespond to\nworkplace\ncommunication\nDevelop\nteams and\nindividuals\nUtilize\nspecialized\ncommunication\nskills\n\nPractice\noccupational\nhealth and\nsafety\nprocedures\nLead\nworkplace\n communication\nCollect,\nanalyze and\norganize\ninformation\nPlan\nand organize\nwork\nApply\nproblem-\nsolving\ntechniques in\nthe workplace\nLead\nsmall teams\nPromote\nenvironmental\nprotection\nBASIC\nCOMPETENCIES\nCORE\nCOMPETENCIES\n\nFabricate\n multi-parts\njewelry\n\nFabricate\ncomplex and\nintricately\ndesigned jewelry\nPerform\n stone setting\nactivities\n\nPerform\n jewelry metal\ncasting\nPerform\n jewelry wax\nmetal\n\nPerform\n rubber mold\nmaking\nFabricate\nbasic jewelry\ncomponents\n\nPolish\njewelry\n\nPlate\njewelry\n\nEngrave\njewelry\n\nApply\nfirst-aid\ntreatment\n\n--- PDF PAGE 73 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC II Date Promulgated: Nov. 2010\n71\nGLOSSARY OF TERMS\n\nAlloy\nCombination of homogenized metals. Base metal mixed with\nprecious ore to make it workable, harden it, or change its color\nAnnealing metal\nIs a heat process whereby a metal is heated to a specific\ntemperature/color and then allowed to cool slowly. This softens the\nmetal which means it can be cut and shaped more easily.\nAntiquing\nProcess of darkening recessed areas of to enhance the visibility of\nengraving\nAssay\nProcess of establishing purity of gold, silver and other alloys\nBail\nConnector at the top of a pendant. Enables pendant to hang from a\nchain or jumpring.\nBasse-taille\n(bass-tie)\nTechnique of applying glass enamel to a metal surface that has\nbeen engraved deeply enough to hold the enamel when heated\nand has sides high enough to keep the enamel colors separate.\nBezel setting\nThe oldest and most basic gemstone setting, derived from the\nFrench word “Biseau” meaning chamfered. A collar style setting for\na gemstone that offers more protection of softer or delicate\nminerals such as opal.\nCarre Setting\nIs where the stone is seated directly over a light well, and the stone\nis set by raising (hammering) four “spurs” with a “graver” tool.\nCarat\nCarat is a number from 1 to 24 that designates the percentage of\npure gold in a sample of gold alloy. 24 carat represents pure gold.\n18 carat indicates that 18/24 % or 75% of that sample is pure gold\nand the remainder is made up of metals other than gold\nCasting\nMethod of shaping metal by melting and pouring into hollow molds.\nLess dense than wrought metals and requires additional polishing\nand finishing\nChannel setting\nAre primarily used to set faceted gemstones that are straight-sided,\nor quadrilateral in shape (baguette or princess cut)\nElectro-plating\nElectro chemical process of applying one metal to the surface of\nanother.\nEngraving\nProcess of decorating metal by gouging a design into its surface\nGold Plating\nIs a method of depositing a thin layer of gold on the surface of other\nmetal, most often copper or silver. It is often used in electronics, to\nprovide a corrosion-resistant electrically conductive layer on\ncopper, typically in electrical connectors and printed circuit boards.\n\n--- PDF PAGE 74 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC II Date Promulgated: Nov. 2010\n72\nHarden\nHardening is the process of making a jewelry component more stiff\nand permanent. This can be accomplished in a variety of ways\nincluding hammering and work hardening.\nInvisible setting\nSetting style where rows of square cut gemstones rest flush edge\nto edge; all within a metal border or frame, with no metal separating\nindividual gems\nJewelry Wire\nJewelry wire is soft wire used to make jewelry. Jewelry wire can be\nbrass, copper, gold, sterling silver, fine silver, gold-filled and/or gold\nand silver plated wire.\nJig\nA jig is a jewelry-making tool with a series of pegs used to form or\nshape wire. The most popular brand of jigs is the WigJig brand.\nMounting\nDevice that holds a gem in place\nOxidation\nChemical process to blacken or tarnish. Sulphur and oxygen is\nused on silver.\nPave setting\nIs a tight grouping of identically sized stones laid across a flat, or\nconvex surface, from the French word for “paved.” The stones are\nheld in place using three to six raised beads per stone.\nPlating\nIs a surface covering in which a metal is deposited on a conductive\nsurface. Plating is used to decorate objects, for corrosion inhibition,\nto improve solderability, to harden, to improve wearability, to\nreduce friction, to improve paint adhesion, to alter conductivity, for\nradiation shielding, and for other purposes. Jewelry typically uses\nplating to give a silver or gold finish.\nPolishing\nPolishing is the process of smoothing the surface of an object. With\njewelry wire polishing results in a shiny appearance and can\nremove minor tool marks or blemishes. Frequently polishing\ninvolves using a mildly abrasive polishing compound to remove a\nthin layer of material.\nProng setting\nThe most common variety for faceted gemstones is a prong setting,\nwith either 3 or 4 prongs that hold the stone in place. This type of\nsetting exposes the maximum amount of light to the sides and\nbottom (pavilion).\n\nPrecious metal\nMetals valued for their color, malleability, and rarity; gold, silver and\nplatinum\n\nQuenching\nQuenching is a process for heat treating metals to change its\nhardness. This process involves heating the metal to a high\ntemperature and then rapidly cooling it by dipping it in a liquid bath\nmade of oil or water.\n\n--- PDF PAGE 75 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC II Date Promulgated: Nov. 2010\n73\n\nRhodium\n Is a sheen of white metal. It is the rarest of all non-radioactive\nmetals on Earth. The most expensive metal and the best in\nresistance to corrosion and tarnish under most environmental\ncondition.\nSetting\nMethod by which a stone is held into a mounting.\nSoldering\nTechnique used in making and repairing jewelry whereby two\npieces of metal are joined when a molten metal with a lower\nmelting point than the two metals being joined is used.\nStamping\nUsing a die set to cut or emboss metal with a mark\nTiffany setting\nUsually round and elevated setting with six long slender prongs that\nflare from the base. Commonly used for large stones such as\ndiamond soliitaires\nTin\nA malleable semi-precious silvery metal that resists oxidation.\nMalleable at ordinary temperatures, but brittle when heated, tin acts\nas an agent in numerous alloys\nVise\nA vise is a tool used for gripping and holding components very\nsecurely. Vises are often fastened to a table or other sturdy base.\nWhite gold\nGold alloy made of nickel; sometimes contains palladium or zinc\n\n--- PDF PAGE 76 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC II Date Promulgated: Nov. 2010\n74\nACKNOWLEDGEMENTS\n\nThe Technical Education and Skills Development Authority (TESDA) wishes to\nextend thanks and appreciation to the many representatives of business, industry,\nacademe and government agencies who devoted their time and expertise in the\ndevelopment and validation of these Training Regulations.\n\nTechnical Experts:\n\nMS. CECILIA R. RAMOS\nChairman\nMeycauayan Jewelry Industry Association, Inc. (MJIA)\nPhilippine Jewelry Center\nPandayan, Meycauayan, Bulacan\nMS. MA. LUISA D. UNSON\nPresident\nPhilippine Jewelry Business Club Foundation, Inc.\n1903 B West Tower (Tektite Bldg.),\nPhilippine Stock Exchange\nExchange Road, Ortigas Center, Pasig City\nMR. MIGUEL M. RODRIGUEZ\nManager\nMiersons’ Jewelry\n680 L. Sarno, Calvario, Meycauayan, Bulacan\nMR. PETER A. ZUÑIGA\nPresident\nConfederation of Philippine Jewelers, Inc.\nPhilippine Jewelry Center\nMalhacan, Meycauayan, Bulacan\nMR. ANGELINO V. GABON\nHans Brumann, Inc.\n134 Ground Floor, Legaspi Street\nLegaspi Village, Makati City\nMR. RUFINO L. RAMOS\nProprietor\nLeah’s Jewelry\nGen. Luna, Malabon City\nMR. PEEWEE R. GARCIA\nProduction Manager\nIkthos\n2436 Taal St., Malate, Manila\nMS. SHIELA CLAVEL-TEJADA\nConsultant\nPhilippine Jewelry Business Club Foundation, Inc.\n1903 B West Tower (Tektite Bldg.),\nPhilippine Stock Exchange\nExchange Road, Ortigas Center, Pasig City\nMS. RHODORA PATRICIA C. TORRECAMPO\nTechnician Education Specialist III\nCottage Industry Technology Center (CITC)\n20 Russet St., SSS Village, Marikina City\nMS. INGRID M. JAVALERA\nSr. Trade and Industry Dev’t. Specialist\nBureau of Export Trade Promotion\n2nd Floor, Dept. of Trade and Industry\nDTI Int’l. Bldg.,\n375 Sen. Gil J. Puyat Ave., Makati City\n\nThe Participants in the Validation of this Training Regulation\n•\nMembers of the Cebu Fame Foundation Philippines, Inc.\n•\nMembers of the Mindanao United Jewelry Association, Inc.\n\nThe Members of the TESDA Board\n\nThe MANAGEMENT and Staff of the TESDA Secretariat\n•\nQualifications and Standards Office (QSO)"
