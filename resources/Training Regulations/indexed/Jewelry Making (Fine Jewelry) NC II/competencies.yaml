        "source_text": "DCJ731302\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes in\npolishing jewelry of fine jewelry.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Prepare\nrequirements for\npolishing\n\n1.1 Items to be polished are checked in accordance with\ndesign specifications\n1.2 When necessary, defective items are returned to issuing\npersonnel in accordance with organizational procedures\nand design specifications\n1.3 Item characteristics and finishing are established from\npredetermined specifications in accordance with\norganizational and design specifications\n1.4 Finishing specifications and required outcomes are\nconfirmed and clarified as necessary with appropriate\nperson(s) and in accordance with organizational\nrequirements and design specifications\n1.5 Polishing techniques are selected in accordance with\ndesignated timeframes , organizational and specific\npolishing requirements\n1.6 Materials and consumables are selected and requested\nin accordance with organizational requirements and in\nconsultation with appropriate person(s).\n1.7 Tools, machineries and equipment are selected,\nrequested and checked for operational effectiveness in\naccordance with the manufacturer’s specification and\norganizational procedures\n2. Perform polishing\n2.1 Polishing tools, machineries and equipment are used in\naccordance with manufacturers’ specifications\n2.2 Polishing activities are performed using safe operating\npractices, protective equipment, and in accordance with\nOHS, organizational and industry standards.\n2.3 Polished items are checked to ensure outcome conforms\nwith design specifications, quality and organizational\nstandards\n2.4 Jewelry is completely polished and free of soils and\nabrasive compounds\n\n--- PDF PAGE 44 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC II Promulgated: Nov. 25, 2010\n42\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n3. Perform post-\npolishing activities\n3.1 Documentation is completed and processed in\naccordance with organizational requirements and\nstandards\n3.2 Finished item is turned over to issuing personnel in\naccordance with organizational procedures\n3.3 Notification of work completion is made to appropriate\nperson(s) in accordance with organizational procedures.\n3.4 Work area, tools and equipment are cleaned and stored\nin accordance with OHS and organizational requirements.\n3.5 Waste materials are collected and stored/reclaimed in\naccordance with organizational requirements\n\n--- PDF PAGE 45 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC II Promulgated: Nov. 25, 2010\n43\nRANGE OF VARIABLES\n\nVARIABLE\n\nRANGE\n1. Design\nspecifications\nMay include but are not limited to:\n1.1 Design proportions\n1.2 Sizes\n1.3 Free from deformities\n1.4 Smoothness of surfaces\n2. Appropriate\nperson(s)\nMay include but are not limited to:\n2.1 Supervisor\n2.2 Issuing personnel/officer\n3. Polishing\ntechniques\n3.1 Manual\n3.2 Chemical\n3.3 Mechanical\n4. Materials and\nconsumables\nMay include but are not limited to:\n4.1 Cleaning Solutions\n4.2 Abrasives\n4.3 Barrels\n4.4 Grinding Wheels\n4.5 Polishing and buffing Wheels\n4.6 Lapping Wheels\n4.7 Hand Polishing Tools\n4.8 Wheel Brushes\n4.9 Bristle and Wire wheel brushes\n4.10 Polishing and Buffing compounds\n5. Tools, machineries\nand equipment\nMay include but are not limited to:\n\n5.1 Polishing motor with spindles\n5.2 Ultrasonic Cleaner\n5.3 Vibratory Tumbler\n5.4 Steamer\n5.5 Split Lapping Machine\n5.6 Magnetic Tumbler\n5.7 All hand and power tools appropriate to cleaning of\njewelry items and personal protective equipment\n6. Polishing activities\nMay include but are not limited to:\n6.1 Degreasing\n6.2 Grinding\n6.3 Tumbling or barrel finishing\n6.4 Burnishing\n6.5 Polishing\n\n--- PDF PAGE 46 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC II Promulgated: Nov. 25, 2010\n44\n6.6 Brushing\n6.7 Buffing\n6.8 Split-lapping\n7. Soils\nMay include but are not limited to:\n7.1 Grease\n7.2 Polishing compound\n7.3 Rusts\n7.4 Organic materials\n7.5 Oxides\n8. Documentation\nMay include but are not limited to:\n8.1 Job order form\n8.2 Work instructions and procedures\n8.3 Parts and components reference guide/manual\n8.4 Materials and consumables used\n8.5 Time and record sheets\n\n--- PDF PAGE 47 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC II Promulgated: Nov. 25, 2010\n45\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\n\nAssessment requires evidence that the candidate:\n1.1 Identified jewelry polishing requirements\n1.2 Confirmed and clarified with appropriate persons the\nrequired finish specifications and outcomes\n1.3 Prepared materials and consumables for polishing\njewelry\n1.4 Checked and returned defective tools, machineries and\nequipment to issuing personnel in accordance with\norganizational procedures\n1.5 Polished jewelry items in accordance with OH&S ,\norganizational and industry standards\n1.6 Completed jewelry polishing documentation procedures\n1.7 Collected and stored shavings/excess materials in\naccordance with organizational requirements\n2. Underpinning\nKnowledge\n\n2.1 Philippine National Standard (PNS) on Jewelry\n2.2 Types of jewelry\n2.2 Properties and characteristics of metals used in jewelry\n2.3 Tools, machineries, equipment, materials and\nconsumables for polishing a range of jewelry\nitems/designs\n2.4 Common jewelry design features, constructions and\nfinishes\n2.5 Metal preparation and polishing techniques to suit\ndifferent design requirements\n2.6 Factors affecting the selection of preparation of polishing\nmethods\n2.7 Organizational requirements for polishing activities\n2.8 Ratios and proportions to prepare required\ngrade/quality/composition of polishing media\n2.9 Procedures for checking serviceability of applicable tools\nand equipment\n2.10 Safe operating procedures for applicable tools and\nequipment\n2.11 Security measures for protection of jewelry items\n2.12 Safe work practices and procedures/ OH&S\nrequirements\n2.13 First aid measures\n2.14 Accounting of unused/excess materials\n\n--- PDF PAGE 48 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC II Promulgated: Nov. 25, 2010\n46\n\n3. Underpinning Skills\n3.1 Interpreting polishing specifications\n3.2 Following instructions (oral or written)\n3.3 Selecting appropriate tools and equipment\n3.4 Selecting appropriate materials and polishing techniques\n3.5 Applying appropriate polishing procedures\n3.6 Applying safe working skills\n3.7 Applying first-aid measures\n4. Resource\nImplications\nThe following resources should be provided:\n4.1 Materials relevant to the activity\n4.2 Tools, machineries and equipment\n4.3 Consumables\n4.4 Personal Protective Equipment (PPE)\n4.5 Workplace\n4.6 Documentation\n4.7 Exhaust fan\n4.8 Fire extinguisher\n\n5. Method of\nAssessment\nCompetency in this unit must be assessed through:\n5.1 Demonstration with oral questioning\n5.2 Portfolio (Training Certificates, Certificate of Employment,\nWorkpiece, etc.)\n5.3 Third-Party Report\n6. Context of\nAssessment\n6.1 Competency may be assessed in the workplace or in a\nsimulated workplace (TESDA Accredited Assessment\nCenter)\n\n--- PDF PAGE 49 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC II Promulgated: Nov. 25, 2010\n47\nUNIT OF COMPETENCY : PLATE JEWELRY\n\nUNIT CODE :"
