lishing techniques\n3.5 Applying appropriate polishing procedures\n3.6 Applying safe working skills\n3.7 Applying first-aid measures\n4. Resource\nImplications\nThe following resources should be provided:\n4.1 Materials relevant to the activity\n4.2 Tools, machineries and equipment\n4.3 Consumables\n4.4 Personal Protective Equipment (PPE)\n4.5 Workplace\n4.6 Documentation\n4.7 Exhaust fan\n4.8 Fire extinguisher\n\n5. Method of\nAssessment\nCompetency in this unit must be assessed through:\n5.1 Demonstration with oral questioning\n5.2 Portfolio (Training Certificates, Certificate of Employment,\nWorkpiece, etc.)\n5.3 Third-Party Report\n6. Context of\nAssessment\n6.1 Competency may be assessed in the workplace or in a\nsimulated workplace (TESDA Accredited Assessment\nCenter)\n\n--- PDF PAGE 49 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC II Promulgated: Nov. 25, 2010\n47\nUNIT OF COMPETENCY : PLATE JEWELRY\n\nUNIT CODE :"
