        "source_text": "--- PDF PAGE 34 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC II                    Promulgated: Nov. 25, 2010 \n32 \n \nUNIT TITLE:  \nAPPLY QUALITY STANDARDS\nUNIT CODE:  \nICT315202\nUNIT DESCRIPTOR: \nThis unit covers the knowledge, skills, attitudes required to \napply quality standards in the workplace.  The unit also \nincludes the application of relevant safety procedures and \nregulations, organization procedures and customer \nrequirements\n \nELEMENT \n \nPERFORMANCE CRITERIA \nBold and Italicized terms are elaborated in the Range of Variables\n1. Assess quality of  \n    received materials or  \n    components \n1.1 Received materials or component parts are checked  \n      based on material specifications \n1.2 Defective material or components are identified and  \n     isolated following standard operating procedures \n1.3 Defective materials or components are replaced in  \n      accordance with workplace procedures. \n2. Assess own work \n2.1 Documents relative to quality within the company is  \n      identified and used \n2.2 Completed work is checked based on workplace standards \nrelevant to the task undertaken \n2.3 In cases of deviations from specified quality standards,  \n      causes are documented and reported in accordance with  \n      the workplace’ standards operating procedures \n3. Engage in process  \n    improvement  \n3.1 Process improvement procedures are participated in  \n      relation to workplace assignment \n3.2 Work is carried out in accordance with process  \n      improvement procedures \n3.3 Performance of operation or quality of product or service is  \n      monitored in accordance to customer satisfaction\n\n--- PDF PAGE 35 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC II                    Promulgated: Nov. 25, 2010 \n33 \n \nRANGE OF VARIABLES \nVARIABLE \nRANGE \n1. Materials /  \n    components \nMay include but not limited to:  \n1.1 Electrical materials and consumables  \n1.2 Welding materials and consumables \n1.3 Furniture making materials and consumables \n1.4 Carpentry materials and consumables \n1.5 Masonry materials and consumables  \n1.6 Heavy equipment materials and consumables \n2. Defective  \nMay include but not limited to:  \n2.1 Components / materials do not conform to specification \n2.2 Components / materials containing manufacturing defects \n2.3 Components / materials do not conform with government  \n      regulation i.e., PEC, environmental code \n2.4 Components / materials possessed safety defects \n3. Documents  \nMay include but not limited to: \n3.1 Organization work procedures / reports  \n3.2 Manufacturer’s instruction manual \n3.3 Customer requirements \n3.4 Forms \n4. Quality standards \nMay include but not limited to:  \n4.1 Materials / consumables \n4.2 Component parts \n4.3 Final product \n4.4 Production processes \n4.5 Methods  \n5. Customer \nMay include but not limited to: \n5.1 Co-worker \n5.2 Supplier \n5.3 Client \n5.4 Organization receiving the product or service\n\n--- PDF PAGE 36 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC II                    Promulgated: Nov. 25, 2010 \n34 \nEVIDENCE GUIDE \n1. Critical aspect of  \n    competency \nAssessment must show that the candidate: \n1.1 Demonstrates ability to follow company’s standard  \n      operating procedures \n1.2 Demonstrates knowledge of types and uses of materials  \n      and component parts  \n1.3 Demonstrates knowledge of quality standards  \n1.4 Demonstrates ability to follow process improvement  \n      procedures  \n2. Underpinning  \n    knowledge \n2.1 Production processes \n2.2 Types and uses of materials and components  \n2.3 Company standard operating procedures \n2.4 Safety practices and applications \n3. Underpinning skills \n3.1 Following production processes \n3.2 Checking of materials and component parts and finished  \n      products \n3.3 Following company standard operating procedures  \n3.4 Applying safety practices  \n4. Method of  \n    assessment \n4.1  Observation of practical skills  \n4.2  Oral questions  \n5. Resource implication \n \nThe following materials must be provided:  \n5.1 Materials and component parts relevant to the activity \n5.2 Documents related to quality  \n6. Context of  \n    Assessment \n6.1 Assessment may be conducted in the workplace or in a  \n      simulated environment.\n",
