          "source_text": "1. Critical Aspects\nof Competency\n\nAssessment requires evidence that the candidate:\n1.1 Identified and established components and basic jewelry\nfabrication requirements based from predetermined\nspecifications in accordance with organizational and client\nrequirements\n1.2 Selected and obtained tools, equipment, materials and\nconsumables with appropriate person/s in accordance with\norganizational and OH&S requirements\n1.3 Performed fabrication in accordance with OH&S,\norganizational and industry accepted methods\n1.4 Fabricated items are checked for quality and to ensure\nconstruction conforms with required specifications and\norganizational requirements and standards\n1.5 When necessary, reworked/retouched defective items in\naccordance with specifications and organizational procedures\n1.6 Checked finished product for quality, dimension and\nconstruction in accordance with client’s specifications and\norganizational requirements\n1.7 Notified work completion to appropriate person/s in\naccordance with organizational procedures\n1.8 Cleaned and stored work area, tools and equipment in\naccordance with OHS and organizational requirements\n1.9 Used personal protective equipment (PPE) in accordance\nwith job requirements and OHS requirements\n1.10\n Demonstrated knowledge on calculation and\nmeasurements\n2. Underpinning\nKnowledge\n\n2.1 Philippine National Standard (PNS) on Jewelry\n2.2 Types of jewelry\n2.2 Basic jewelry components\n2.3 Properties of metals used in jewelry\n2.4 Basic jewelry fabricating procedures\n2.5 Basic knowledge in hand tools and usages\n2.6 Materials and consumables used in jewelry fabrication\n2.7 Operation of machines and equipment in fabricating jewelry\n2.8 Basic measuring and weighing devices\n2.9 Read and understand specification\n2.10 Interpret design and illustration\n2.11 Factor that can affect the flow of fabrication\n2.12 Procedures for checking serviceability of applicable tools and\nequipment\n2.13 Safe operating procedures for applicable tools and equipment\n2.14 Follow organizational, client quality and work standards\n2.15 Organizational procedures for storage of chemicals, tools and\nequipment\n2.16 First-aid measures\n2.17 Safe work practices and procedures/OH&S requirements\n2.18 Accounting of unused/excess materials\n\n--- PDF PAGE 42 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC II Promulgated: Nov. 25, 2010\n40\n\n3. Underpinning\nSkills\n3.1 Following oral and written instructions\n3.2 Reading and interpreting specifications, illustrations and\ndrawings\n3.3 Steady hand and good motor skill\n3.4 Identifying relevant fabrication process on every task\n3.5 Measurements, weighing and calculation\n3.6 Selecting appropriate tools and equipment\n3.7 Selecting appropriate materials\n3.8 Applying appropriate production techniques\n3.9 Applying first-aid measures\n3.10 Applying safe working skills\n3.11 Identifying alternative metals\n4. Resource\nImplications\nThe following resources should be provided:\n4.1\nMaterials relevant to the activity\n4.2\nTools, machineries and equipment\n4.3\nConsumables\n4.4\nPersonal Protective Equipment (PPE)\n4.5\nWorkplace\n4.6\nDocumentation\n4.7\nExhaust fan\n4.8\nFire extinguisher\n\n5. Method of\nAssessment\nCompetency in this unit must may be assessed through:\n5.1 Demonstration with oral questioning\n5.2 Portfolio (Training Certificates, Certificate of Employment,\nWork piece, etc.)\n5.3 Third Party Report\n6. Context of\nAssessment\n6.1 Competency may be assessed in the workplace or in a\nsimulated workplace (TESDA Accredited Assessment\nCenter)\n\n--- PDF PAGE 43 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC II Promulgated: Nov. 25, 2010\n41\nUNIT OF COMPETENCY: POLISH JEWELRY\n\nUNIT CODE :"
