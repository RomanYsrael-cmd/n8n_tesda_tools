        "evidence_guide": {
          "source_text": "1. Critical Aspects\nof Competency\n\nAssessment requires evidence that the candidate:\n1.1 Identified plating jewelry requirements based from\npredetermined specification and in accordance with client’s\nrequirements and organizational procedures\n1.2 Selected and obtained materials, consumables, tools,\nmachineries and equipment appropriate to job requirements and\nin accordance with manufacturer’s specifications and\norganizational procedures\n1.3 Performed applicable plating techniques to produce the\nrequired specifications using safe operating practices and\npersonal protective equipment, and in accordance with\norganizational requirements\n1.4 Washed and dried plated jewelry to required specifications in\naccordance with organizational procedures\n1.5 Quality checked finished product for color consistency in\naccordance with design specifications\n1.6 Finished item is packaged/presented and stored safely in\naccordance with organizational requirements\n1.7 Notified work completion to appropriate person/s in accordance\nwith organizational procedures\n1.8 Observed safe work practices and procedures during the entire\nprocess in accordance with OHS and organizational\nrequirements\n2. Underpinning\nKnowledge\n\n2.1 Philippine National Standard (PNS) on Jewelry\n2.2 Types of jewelry\n2.3 Properties of metals used in jewelry\n2.4 Principles of plating\n2.5 Plating shop procedures\n2.6 Chemicals used in Plating\n2.7 Appropriate anode, voltage, temperature, and immersion time\n2.8 Tools, Machineries and equipment used in Plating\n2.9 Various Plating Baths\n2.10 Troubleshooting and maintenance of plating bath/solution\n2.11 Metal preparation and plating techniques\n2.12 Factors affecting the selection of preparation and plating\n methods\n2.13 Relevant materials and consumables for given jewelry plating jobs\n2.14 Properties and characteristics gemstones\n2.15 Procedures for checking serviceability of applicable tools and\nequipment\n2.16 Safe operating procedures for applicable tools and equipment\n2.17 Organization of customer service, quality and work standards\n2.18 Industry Standards of Qualities\n2.19 Organization procedures for storage of chemicals, tools and\nequipment\n2.20 First-aid measures\n2.21 Safe work practices and procedures/OH&S requirements\n2.22 Accounting of unused/excess materials\n\n--- PDF PAGE 54 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC II Promulgated: Nov. 25, 2010\n52\n\n3. Underpinning\nSkills\n3.1 Applicable plating techniques and processes\n3.2 Plating Sequence\n3.3 Weighing and measuring\n3.4 Selecting appropriate tools, machineries and equipment\n3.5 Selecting appropriate materials\n3.6 Applying appropriate plating\n3.7 Applying safe working skills\n3.8 Applying first-aid measures\n3.9 Performing troubleshooting and maintenance of plating\nbath/solution\n4. Resource\nImplications\nThe following resources should be provided:\n4.1 Materials/Consumables relevant to the activity\n4.2 Tools, machineries and equipment\n4.3 Consumables\n4.4 Personal Protective Equipment (PPE)\n4.5 Workplace\n4.6 Documentation\n4.7 Exhaust fan\n4.8 Fire Extinguisher\n\n5. Method of\nAssessment\nCompetency in this unit may be assessed through:\n5.1 Demonstration with oral questioning\n5.2 Portfolio (Training Certificates, Certificate of Employment,\nWorkpiece, etc.)\n5.3 Third-Party Report\n6. Context of\nAssessment\n6.1 Competency may be assessed in the workplace or in a\nsimulated workplace (TESDA Accredited Assessment Center)\n\n--- PDF PAGE 55 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC II Promulgated: Nov. 25, 2010\n53\nUNIT OF COMPETENCY : PERFORM RUBBER MOLD MAKING\n\nUNIT CODE :"
