ment\n• Performing preventive\nmaintenance\n\n• Simulation\n• Group discussion\n• Practical Lab\n• Demonstration\n\n• Written\nexamination\n• Third party\nreport\n• Demonstration\nwith oral\nquestioning\n2 Hours\n\n5.3 Store tools and\nequipment\n• Storing tools and equipment\n• Handling of tools and equipment\n• Demonstration\n• Group discussion\n• Practical Lab\n• Practical exam\n• Written\nexamination\n• Demonstration\nwith oral\nquestioning\n\n1 Hour\n\n--- PDF PAGE 93 ---\nHEAVY EQUIPMENT OPERATION (Forklift) NC II Revision 01 Promulgated (11/07/2019)\n\n88\nCORE COMPETENCIES\n(120 HOURS)\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n1. Perform pre- and\npost-operation\n procedures for\n forklift\n1.1 Perform visual\ncheck\n\n• Select personal protective\nequipment\n• Select forklift capacity\n• Identify and explain operator\nserviceable parts\n• Perform inspection of equipment\n• Lecture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nwith oral\nquestioning\n\n16 hours\n1.2 Perform walk-\naround check\n\n• Explain and perform procedures\nin BLOWAF check for engine\ntype\n• Explain and perform procedures\nin checking battery-operated type\nforklift\n• Lecture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nwith oral\nquestioning\n1.3 Perform visual\ncheck for lifting\nattachments and\npower train\n• Explain procedures in visual\ncheck for lifting attachments and\npower train components\n• Identify abnormal conditions\n• Perform visual check for lifting\nattachments and power train\n• Lecture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nwith oral\nquestioning\n\n1.4 Perform operation\n check\n\n• Explain and perform start-up and\nwarming procedures\n• Explain procedures in conducting\nwalk-around check while the\nforklift is power on\n• Perform operation of forklift\ncomponents and safety devices\n• Lecture\n•