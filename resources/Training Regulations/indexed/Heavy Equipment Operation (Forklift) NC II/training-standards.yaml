emonstrate verbal\ninstructions and signals\n• Lecture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nwith oral\nquestioning\n\n3.3 Interpret load chart\n\n• Read and interpret load chart\n• Perform load computations\nbased on load chart\n• Lecture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nwith oral\nquestioning\n\n--- PDF PAGE 96 ---\nHEAVY EQUIPMENT OPERATION (Forklift) NC II Revision 01 Promulgated (11/07/2019)\n\n91\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodologies\n• Assessment\nMethods\nNominal\nDuration\n\n3.4 Perform lifting and\n handling of load\n\n•\nUnderstand site and weather\nconditions\n•\nExplain procedures and\npractices in lifting operation\n•\nUnderstand signals and\nsigns\n•\nExplain procedures in\nresponding to unexpected\nsituations\n•\nDemonstrate lifting and\nhandling of load\n\n• Lecture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nwith oral\nquestioning\n\n--- PDF PAGE 97 ---\nHEAVY EQUIPMENT OPERATION (Forklift) NC II Revision 01 Promulgated (11/07/2019)\n\n92"
