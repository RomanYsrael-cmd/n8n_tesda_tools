    "source_text": "SECTION 3 TRAINING ARRANGEMENTS\n\nThese standards are set to provide technical and vocational education and training\n(TVET) providers with information and other important requirements to consider when designing\ntraining programs for HEAVY EQUIPMENT OPERATION (FORKLIFT) NC II.\n\nThey include information on curriculum design; training delivery; trainee entry\nrequirements; tools and equipment; training facilities; and trainer’s qualification.\n\n3.1\nCURRICULUM DESIGN\n\nTESDA shall provide the training on the development of competency-based\ncurricula to enable training providers develop their own curricula with the components\nmentioned below.\n\nDelivery of knowledge requirements for the basic, common and core units of\ncompetency\nspecifically\nin\nthe\nareas\nof\nmathematics,\nscience/technology,\ncommunication/language and other academic subjects shall be contextualized. To this\nend, TVET providers shall develop a Contextual Learning Matrix (CLM) to accompany\ntheir curricula.\n\nCourse Title: HEAVY EQUIPMENT OPERATION (FORKLIFT) NC II\n\nNominal Training Duration:\n37 Hours Basic Competencies\n24 Hours Common Competencies\n 120 Hours Core Competencies\n\n40 Hours - Supervised Industry Learning (SIL)\n\n Total - 221 Hours\nCourse Description:\n\nThis course is designed to provide the learner with knowledge, practical skills and\nattitude, applicable in performing work activities involve in performing pre and post-operation\nprocedures, performing basic preventive maintenance servicing and performing productive\noperation for forklift. This includes classroom learning activities and practical work in actual work\nsite or simulation area.\n\nUpon completion of the course, the learners are expected to demonstrate the above-\nmentioned competencies to be employed. To obtain this, all units prescribed for this qualification\nmust be achieved.\n\n--- PDF PAGE 80 ---\nHEAVY EQUIPMENT OPERATION (Forklift) NC II Revision 01 Promulgated (11/07/2019)\n\n75\n\nBASIC COMPETENCIES\n(37 HOURS)\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n1. Participate in\nworkplace\ncommunication\n1.1. Obtain and\nconvey\nworkplace\ninformation\n•\nDescribe Organizational policies\n•\nRead:\no Effective communication\no Written communication\no Communication procedures and\nsystems\n•\nIdentify:\no Different modes of communication\no Medium of communication\no Flow of communication\no Available technology relevant to the\nenterprise and the individual’s work\nresponsibilities\n•\nPrepare different Types of question\n•\nGather different sources of information\n•\nApply storage system in establishing\nworkplace information\n•\nDemonstrate Telephone courtesy\n• Group\ndiscussion\n• Lecture\n• Demonstration\n• Oral evaluation\n• Written\nexamination\n• Observation\n2 Hours\n1.2. Perform duties\nfollowing\nworkplace\ninstructions\n•\nRead:\no Written notices and instructions\no Workplace interactions and procedures\n•\nRead instructions on work related\nforms/documents\n•\nPerform workplace duties scenario\nfollowing workplace instructions\n\n• Group\ndiscussion\n• Lecture\n• Demonstration\n• Oral evaluation\n• Written\nexamination\n• Observation\n2 Hours\n\n--- PDF PAGE 81 ---\nHEAVY EQUIPMENT OPERATION (Forklift) NC II Revision 01 Promulgated (11/07/2019)\n\n76\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n1.3. Complete\nrelevant work\nrelated\ndocuments\n•\nDescribe Communication procedures and\nsystems\n•\nRead:\no Meeting protocols\no Nature of workplace meetings\no Workplace interactions\no Barriers of communication\n•\nRead instructions on work related\nforms/documents\n•\nPractice:\no Estimate, calculate and record routine\nworkplace measures\no Basic mathematical processes of\naddition, subtraction, division and\nmultiplication\n•\nDemonstrate office activities in:\no workplace meetings and discussions\nscenario\n•\nPerform workplace duties scenario\nfollowing simple written notices\n•\nFollow simple spoken language\n•\nIdentify the different Non-verbal\ncommunication\n•\nDemonstrate ability to relate to people of\nsocial range in the workplace\n•\nGather and provide information in\nresponse to workplace requirements\n•\nComplete work related documents\n• Group\ndiscussion\n• Lecture\n• Demonstration\n• Role play\n• Oral evaluation\n• Written\nexamination\n• Observation\n2 Hours\n\n2. Work in a team\nenvironment\n2.1 Describe team\nrole and scope\n•\nDiscussion on team roles and scope\n•\nParticipate in the discussion:\no\nDefinition of Team\no\nDifference between team and group\no Objectives and goals of team\n•\nLocate needed information from the\n• Lecture/\nDiscussion\n• Group Work\n• Individual Work\n• Role Play\n• Role Play\n• Case Study\n• Written Test\n1 Hour\n\n--- PDF PAGE 82 ---\nHEAVY EQUIPMENT OPERATION (Forklift) NC II Revision 01 Promulgated (11/07/2019)\n\n77\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\ndifferent sources of information\n\n2.2 Identify one’s\nrole and\nresponsibility\nwithin team\n•\nRole play:\no individual role and responsibility\n•\nRole Play\no Understanding Individual differences\n•\nDiscussion on gender sensitivity\n•Role Play\n•Lecture/\nDiscussion\n• Role Play\n• Written Test\n1 Hour\n\n2.3 Work as a\nteam member\n• Participate in group planning activities\n\n• Role play: Communication protocols\n\n• Participate in the discussion of standard\nwork procedures and practices\n• Group work\n• Role Play\n• Lecture/\nDiscussion\n• Role Play\n• Written Test\n1 Hour\n3. Solve/address\nroutine\nproblems\n3.1 Identify routine\nproblems\n• Review of the current industry hardware\nand software products and services\n• Identify correctly the industry maintenance,\nservice and helpdesk practices, processes\nand procedures\n• Make use of the industry standard\ndiagnostic tools\n• Share best practices in determining basic\nmalfunctions and resolutions to general\nproblems in the workplace\n• Analyze routine/procedural problems\n•Group discussion\n•Lecture\n•Demonstration\n•Role playing\n• Case\nFormulation\n• Life Narrative\nInquiry\n(Interview)\n• Standardized\ntest\n1 Hour\n\n--- PDF PAGE 83 ---\nHEAVY EQUIPMENT OPERATION (Forklift) NC II Revision 01 Promulgated (11/07/2019)\n\n78\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\n3.2 Look for\nsolutions to\nroutine\nproblems\n• Review of the current industry hardware\nand software products and services\n• Identify correctly the industry maintenance,\nservice and helpdesk practices, processes\nand procedures\n• Make use of the industry standard\ndiagnostic tools\n• Share best practices in determining basic\nmalfunctions and resolutions to general\nproblems in the workplace\n• Formulate possible solutions to problems\nand document procedures for reporting\n•Group discussion\n•Lecture\n•Demonstration\n•Role playing\n• Case\nFormulation\n• Life Narrative\nInquiry\n(Interview)\n• Standardized\ntest\n1 Hour\n\n3.3 Recommend\nsolutions to\nproblems\n• Discuss standard operating procedures\nand documentation processes\n•Group discussion\n•Lecture\n•Demonstration\n•Role playing\n• Case\nFormulation\n• Life Narrative\nInquiry\n(Interview)\n• Standardized\ntest\n1 Hour\n4. Develop Career\nand Life\nDecisions\n4.1 Manage one’s\nemotion\n• Demonstrate self-management strategies\nthat assist in regulating behavior and\nachieving personal and learning goals\n• Explain enablers and barriers in achieving\npersonal and career goals\n• Identify techniques in handling negative\nemotions and unpleasant situation in the\nworkplace such as frustration, anger,\nworry, anxiety, etc.\n• Manage properly one’s emotions and\nrecognize situations that cannot be\nchanged and accept them and remain\nprofessional\n• Recall instances that demonstrate self-\ndiscipline, working independently and\n• Discussion\n• Interactive\nLecture\n• Brainstorming\n• Demonstration\n• Role-playing\n• Demonstration\nor simulation\nwith oral\nquestioning\n• Case problems\ninvolving\nworkplace\ndiversity\nissues\n\n1 Hour\n\n--- PDF PAGE 84 ---\nHEAVY EQUIPMENT OPERATION (Forklift) NC II Revision 01 Promulgated (11/07/2019)\n\n79\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\nshowing initiative to achieve personal and\ncareer goals\n• Share experiences that show confidence,\nand resilience in the face of setbacks and\nfrustrations and other negative emotions\nand unpleasant situations in the workplace\n\n4.2 Develop\nreflective\npractice\n• Enumerate strategies to improve one’s\nattitude in the workplace\n• Explain Gibbs’ Reflective Cycle/Model\n(Description, Feelings, Evaluation,\nAnalysis, Conclusion, and Action plan)\n• Use basic SWOT analysis as self-\nassessment strategy\n• Develop reflective practice through\nrealization of limitations, likes/ dislikes;\nthrough showing of self-confidence\n• Demonstrate self-acceptance and being\nable to accept challenges\n• Small Group\nDiscussion\n• Interactive\nLecture\n•Brainstorming\n• Demonstration\n•5 Role-playing\n• Demonstration\nor simulation\nwith oral\nquestioning\n• Case problems\ninvolving\nworkplace\ndiversity\nissues\n\n1 Hour\n\n4.3 Boost self-\nconfidence and\ndevelop self-\nregulation\n• Describe the components of self-regulation\nbased on Self-Regulation Theory (SRT)\n• Explain personality development concepts\n• Cite self-help concepts (e. g., 7 Habits by\nStephen Covey, transactional analysis,\npsycho-spiritual concepts)\n• Perform effective communication skills –\nreading, writing, conversing skills\n• Show affective skills – flexibility,\nadaptability, etc.\n• Determine strengths and weaknesses\n• Small Group\nDiscussion\n• Interactive\nLecture\n• Brainstorming\n• Demonstration\n• Role-playing\n•\nDemonstration\nor simulation\nwith oral\nquestioning\n• Case\nproblems\ninvolving\nworkplace\ndiversity\nissues\n\n1 Hour\n\n--- PDF PAGE 85 ---\nHEAVY EQUIPMENT OPERATION (Forklift) NC II Revision 01 Promulgated (11/07/2019)\n\n80\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n5. Contribute to\nworkplace\ninnovation\n5.1 Identify\nopportunities\nto do things\nbetter\n• Identify different roles of individuals in\ncontributing to doing things better in the\nworkplace\n• Appreciate positive impacts and challenges\nin innovation\n• Show mastery of the different types of\nchanges and levels of participation in the\nworkplace\n• Discuss 7 habits of highly effective people\n•Interactive\nLecture\n•Appreciative\nInquiry\n•Demonstration\n•Group work\n• Psychological\nand behavioral\nInterviews\n• Performance\nEvaluation\n• Life Narrative\nInquiry\n• Review of\nportfolios of\nevidence and\nthird-party\nworkplace\nreports of on-\nthe-job\nperformance.\n• Standardized\nassessment of\ncharacter\nstrengths and\nvirtues applied\n1 Hour\n\n5.2 Discuss and\ndevelop ideas\nwith others\n\n• Identify different roles of individuals in\ncontributing to doing things better in the\nworkplace\n• Appreciate positive impacts and challenges\nin innovation\n• Show mastery of the different types of\nchanges and levels of participation in the\nworkplace\n• Discuss 7 habits of highly effective people\n• Communicate ideas through small group\ndiscussions and meetings\n•Interactive\nLecture\n•Appreciative\nInquiry\n•Demonstration\n•Group work\n• Psychological\nand behavioral\nInterviews\n• Performance\nEvaluation\n• Life Narrative\nInquiry\n• Review of\nportfolios of\nevidence and\nthird-party\nworkplace\nreports of on-\nthe-job\nperformance.\n1 Hour\n\n--- PDF PAGE 86 ---\nHEAVY EQUIPMENT OPERATION (Forklift) NC II Revision 01 Promulgated (11/07/2019)\n\n81\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n• Standardized\nassessment of\ncharacter\nstrengths and\nvirtues applied\n\n5.3 Integrate ideas\nfor change in\nthe workplace\n\n• Identify different roles of individuals in\ncontributing to doing things better in the\nworkplace\n• Appreciate positive impacts and challenges\nin innovation\n• Show mastery of the different types of\nchanges and levels of participation in the\nworkplace\n• Discuss 7 habits of highly effective people\n• Communicate ideas through small group\ndiscussions and meetings\n• Demonstrate basic skills in data analysis\n•Interactive\nLecture\n•Appreciative\nInquiry\n•Demonstration\n•Group work\n• Psychological\nand behavioral\nInterviews\n• Performance\nEvaluation\n• Life Narrative\nInquiry\n• Review of\nportfolios of\nevidence and\nthird-party\nworkplace\nreports of on-\nthe-job\nperformance.\n• Standardized\nassessment of\ncharacter\nstrengths and\nvirtues applied\n\n1 Hour\n6. Present\nrelevant\ninformation\n6.1 Gather data/\ninformation\n• Lecture and discussion on:\no Organisational protocols\no Confidentiality and accuracy\no Business mathematics and statistics\no Legislation, policy and procedures\nrelating to the conduct of evaluations\n• Reviewing data/ information\n• Group\ndiscussion\n• Lecture\n• Demonstration\n• Role Play\n• Oral evaluation\n• Written Test\n• Observation\n• Presentation\n2 Hours\n\n--- PDF PAGE 87 ---\nHEAVY EQUIPMENT OPERATION (Forklift) NC II Revision 01 Promulgated (11/07/2019)\n\n82\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n6.2 Assess\ngathered data/\ninformation\n• Lecture and discussion on:\no Data analysis techniques/ procedures\no Organisational values, ethics and\ncodes of conduct\no Trends and anomalies\n• Computing business mathematics and\nstatistics\n• Application of data analysis techniques\n• Group\ndiscussion\n• Lecture\n• Demonstration\n• Role Play\n• Practical\nexercises\n• Oral evaluation\n• Written Test\n• Observation\n• Presentation\n3 Hours\n6.3 Record and\npresent\ninformation\n• Lecture and discussion on:\no Reporting requirements to a range of\naudiences\no Recommendations for possible\nimprovements\n• Analysis and comparison of interim and\nfinal reports’ outcomes\n• Reporting of data findings\n• Group\ndiscussion\n• Lecture\n• Demonstration\n• Role Play\n• Practical\nexercises\n\n• Oral evaluation\n• Written Test\n• Observation\n• Presentation\n3 Hours\n7. Practice\nOccupational\nSafety And\nHealth Policies\nAnd\nProcedures\n7.1 Identify OSH\ncompliance\nrequirements\n• Discussion regarding:\n- Hierarchy of Controls\n- Hazard Prevention and Controls\n- Work Standards and Procedures\n- Personal Protective Equipment\n•\nLecture\n•\nGroup\nDiscussion\n\n•\nWritten Exam\n•\nDemonstratio\nn\n•\nObservation\n•\nInterviews /\nQuestioning\n1 Hour\n\n7.2 Prepare OSH\nrequirements\nfor compliance\n• Identification of required safety materials,\ntools and equipment\n• Handling of safety control resources\n\n• Lecture\n• Group\nDiscussion\n\n• Written Exam\n• Demonstration\n• Observation\n• Interviews /\n• Questioning\n1 Hour\n\n--- PDF PAGE 88 ---\nHEAVY EQUIPMENT OPERATION (Forklift) NC II Revision 01 Promulgated (11/07/2019)\n\n83\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\n7.3 Perform tasks\nin accordance\nwith relevant\nOSH policies\nand\nprocedures\n•\nDiscussion of General OSH Standards and\nPrinciples\n• Performing industry related work activities\nin accordance with OSH Standards\n• Lecture\n• Group\nDiscussion\n•\n• Written Exam\n• Demonstration\n• Observation\n• Interviews /\n• Questioning\n2 Hours\n8. Exercise\nEfficient and\nEffective\nSustainable\nPractices in\nthe Workplace\n8.1 Identify the\nefficiency and\neffectiveness\nof resource\nutilization\n- Discussion on the process how\nEnvironmental Policies coherence is\nachieved\n•\nDiscussion on Necessary Skills in\nresponse to changing environmental\npolicies needs\n-\nWaste Skills\n-\nEnergy Skills\n-\nWater Skills\n-\nBuilding Skills\n-\nTransport Skills\n-\nMaterial Skills\n• Lecture\n• Group\nDiscussion\n• Simulation\n• Demonstration\n\n• Written Exam\n• Demonstration\n• Observation\n• Interviews /\n• Questioning\n1 Hour\n\n8.2 Determine\ncauses of\ninefficiency of\nresource\nutilization\n• Discussion of Environmental Protection\nand Resource Efficiency Targets\n• Analysis on the Relevant Work Procedure\n• Lecture\n• Group\nDiscussion\n• Demonstration\n\n• Written Exam\n• Demonstration\n• Observation\n• Interviews /\n• Questioning\n1 Hour\n\n8.3 Convey\ninefficient and\nineffective\nenvironmental\npractices\n• Identification of (re)training needs and\nusage of environment friendly methods and\ntechnologies\n• Identification of environmental corrective\nactions\n• Practicing Environment Awareness\n• Lecture\n• Group\nDiscussion\n• Role Play\n• Demonstration\n\n• Written Exam\n• Demonstration\n• Observation\n• Interviews /\n• Questioning\n1 Hour\n\n--- PDF PAGE 89 ---\nHEAVY EQUIPMENT OPERATION (Forklift) NC II Revision 01 Promulgated (11/07/2019)\n\n84\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n9. Practice\nEntrepreneurial\nSkills in the\nWorkplace\n9.1 Apply\nentrepreneurial\nworkplace best\npractices\n\n• Case studies on Best entrepreneurial\npractices\n• Discussion on Quality procedures and\npractices\n• Case studies on Cost consciousness in\nresource utilization\n• Case Study\n• Lecture/Discuss\nion\n• Case Study\n• Written Test\n• Interview\n1 Hour\n\n9.2 Communicate\nentrepreneurial\nworkplace best\npractices\n• Discussion on communicating\nentrepreneurial workplace best practices\n\n• Lecture/Discuss\nion\n• Written Test\n• Interview\n1 Hour\n\n9.3 Implement\ncost-\neffective\noperations\n• Case studies on Preservation, optimization\nand judicious use of workp