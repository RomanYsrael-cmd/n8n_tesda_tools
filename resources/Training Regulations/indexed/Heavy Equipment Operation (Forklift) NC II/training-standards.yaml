ment\n• Performing preventive\nmaintenance\n\n• Simulation\n• Group discussion\n• Practical Lab\n• Demonstration\n\n• Written\nexamination\n• Third party\nreport\n• Demonstration\nwith oral\nquestioning\n2 Hours\n\n5.3 Store tools and\nequipment\n• Storing tools and equipment\n• Handling of tools and equipment\n• Demonstration\n• Group discussion\n• Practical Lab\n• Practical exam\n• Written\nexamination\n• Demonstration\nwith oral\nquestioning\n\n1 Hour\n\n--- PDF PAGE 93 ---\nHEAVY EQUIPMENT OPERATION (Forklift) NC II Revision 01 Promulgated (11/07/2019)\n\n88\nCORE COMPETENCIES\n(120 HOURS)\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n1. Perform pre- and\npost-operation\n procedures for\n forklift\n1.1 Perform visual\ncheck\n\n• Select personal protective\nequipment\n• Select forklift capacity\n• Identify and explain operator\nserviceable parts\n• Perform inspection of equipment\n• Lecture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nwith oral\nquestioning\n\n16 hours\n1.2 Perform walk-\naround check\n\n• Explain and perform procedures\nin BLOWAF check for engine\ntype\n• Explain and perform procedures\nin checking battery-operated type\nforklift\n• Lecture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nwith oral\nquestioning\n1.3 Perform visual\ncheck for lifting\nattachments and\npower train\n• Explain procedures in visual\ncheck for lifting attachments and\npower train components\n• Identify abnormal conditions\n• Perform visual check for lifting\nattachments and power train\n• Lecture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nwith oral\nquestioning\n\n1.4 Perform operation\n check\n\n• Explain and perform start-up and\nwarming procedures\n• Explain procedures in conducting\nwalk-around check while the\nforklift is power on\n• Perform operation of forklift\ncomponents and safety devices\n• Lecture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nwith oral\nquestioning\n\n--- PDF PAGE 94 ---\nHEAVY EQUIPMENT OPERATION (Forklift) NC II Revision 01 Promulgated (11/07/2019)\n\n89\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodologies\n• Assessment\nMethods\nNominal\nDuration\n\n1.5 Perform post-\n operation\n procedures\n•\nExplain walk around\nprocedures while engine is\ncooling down\n•\nExplain and perform parking\nand shut-down procedures\n•\nExplain how to accomplish\nDETR\n\n• Lecture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nwith oral\nquestioning\n\n2. Perform basic\npreventive\nmaintenance\nservicing for\nforklift\n\n2.1 Perform\n adjustment or\n replacement for\n noted defects\n\n• Explain procedures in\nperforming adjustments or\nreplacements for noted defects\n• Explain usage of basic hand\ntools and portable powered tools\n• Perform adjustments or\nreplacements for minor defects\n• Lecture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nwith oral\nquestioning\n\n24 hours\n2.2 Perform basic\n preventive\n maintenance\n servicing(PMS)\n•\nExplain procedures in basic\npreventive maintenance\nservicing\n•\nEnumerate Operator’s\nServiceable parts\n•\nExecute Basic preventive\nmaintenance servicing (PMS)\n\n• Lecture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nwith oral\nquestioning\n\n2.3 Prepare\nequipment\n reports\n\n•\nExplain procedures in\naccomplishing equipment\nreports\n•\nExplain how to accomplish\nequipment reports\n• Lecture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nwith oral\nquestioning\n\n--- PDF PAGE 95 ---\nHEAVY EQUIPMENT OPERATION (Forklift) NC II Revision 01 Promulgated (11/07/2019)\n\n90\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodologies\n• Assessment\nMethods\nNominal\nDuration\n3. Perform\nproductive\n operation for\nforklift\n\n3.1 Travel the forklift\n• Enumerate different road and\nweather conditions\n• Identify potential hazards in work\narea\n• Explain procedures in\nresponding to unexpected\nsituations\n• Perform travel operation\n• Lecture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nwith oral\nquestioning\n\n80 hours\n3.2 Load and unload\nforklift to low-bed\ntrailer/truck\n• Perform loading and unloading\nof forklift to low-bed trailer\n• Explain and demonstrate verbal\ninstructions and signals\n• Lecture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nwith oral\nquestioning\n\n3.3 Interpret load chart\n\n• Read and interpret load chart\n• Perform load computations\nbased on load chart\n• Lecture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nwith oral\nquestioning\n\n--- PDF PAGE 96 ---\nHEAVY EQUIPMENT OPERATION (Forklift) NC II Revision 01 Promulgated (11/07/2019)\n\n91\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodologies\n• Assessment\nMethods\nNominal\nDuration\n\n3.4 Perform lifting and\n handling of load\n\n•\nUnderstand site and weather\nconditions\n•\nExplain procedures and\npractices in lifting operation\n•\nUnderstand signals and\nsigns\n•\nExplain procedures in\nresponding to unexpected\nsituations\n•\nDemonstrate lifting and\nhandling of load\n\n• Lecture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nwith oral\nquestioning\n\n--- PDF PAGE 97 ---\nHEAVY EQUIPMENT OPERATION (Forklift) NC II Revision 01 Promulgated (11/07/2019)\n\n92\n3.2\nTRAINING DELIVERY\n\n1. The delivery of training shall adhere to the design of the curriculum. Delivery shall\nbe guided by the principles of competency-based TVET.\n\na. Course design is based on competency standards set by the industry or\nrecognized industry sector; (Learning system is driven by competencies written\nto industry standards)\n\nb. Training delivery is learner-centered and should accommodate individualized\nand self-paced learning strategies;\n\nc. Training can be done on an actual workplace setting, simulation of a workplace\nand/or through adoption of modern technology.\n\nd. Assessment is based in the collection of evidence of the performance of work to\nthe industry required standards;\n\ne. Assessment of competency takes the trainee’s knowledge and attitude into\naccount but requires evidence of actual performance of the competency as the\nprimary source of evidence.\n\nf. Training program allows for recognition of prior learning (RPL) or current\ncompetencies;\n\ng. Training completion is based on satisfactory performance of all specified\ncompetencies.\n\n2. The competency-based TVET system recognizes various types of delivery modes,\nboth on-and off-the-job as long as the learning is driven by the competency\nstandards specified by the industry. The following training modalities and their\nvariations/components may be adopted singly or in combination with other\nmodalities when designing and delivering training programs:\n\n2.1 Institution-Based:\n\n• Dual Training System (DTS)/Dualized Training Program (DTP) which\ncontain both in-school and in-industry training or fieldwork components.\nDetails can be referred to the Implementing Rules and Regulations of the\nDTS Law and the TESDA Guidelines on the DTP;\n\n• Distance learning is a formal education process in which majority of the\ninstruction occurs when the students and instructor are not in the same\nplace. Distance learning may employ correspondence study, audio,\nvideo, computer technologies or other modern technology that can be\nused to facilitate learning and formal and non-formal training. Specific\nguidelines on this mode shall be issued by the TESDA Secretariat.\n\n•\nThe classroom-based or in-center instruction uses of learner-centered\nmethods as well as laboratory or field-work components.\n\n--- PDF PAGE 98 ---\nHEAVY EQUIPMENT OPERATION (Forklift) NC II Revision 01 Promulgated (11/07/2019)\n\n93\n\n2.1 Enterprise-Based:\n\n• Formal Apprenticeship – Training within employment involving a contract\nbetween an apprentice and an enterprise on an approved apprenticeable\noccupation.\n\n• Informal Apprenticeship - is based on a training (and working) agreement\nbetween an apprentice and a master craftsperson wherein the agreement\nmay be written or oral and the master craftsperson commits to training the\napprentice in all the skills relevant to his or her trade over a significant\nperiod of time, usually between one and four years, while the apprentice\ncommits to contributing productively to the work of the business. Training\nis integrated into the production process and apprentices learn by working\nalongside the experienced craftsperson.\n\n• Enterprise-based Training- where training is implemented within the\ncompany in accordance with the requirements of the specific company.\nSpecific guidelines on this mode shall be issued by the TESDA\nSecretariat.\n\n2.2 Community-Based – Community-Based – short term programs\nconducted by non-government organizations (NGOs), LGUs, training\ncenters and other TVET providers which are intended to address the\nspecific needs of a community. Such programs can be conducted in\ninformal settings such as barangay hall, basketball courts, etc. These\nprograms can also be mobile training program (MTP).\n\n3.3 TRAINEE ENTRY REQUIREMENTS\n\nTrainees or students who wish to enter this training should possess the following\nrequirements:\n\n• At least Junior High School Level Completer or an Alternative Learning System\n(ALS) Certificate of Completion with grade 10 equivalent holder\n• Must possess good communication skills\n• Can perform basic mathematical computation\n• Physically fit\n\n--- PDF PAGE 99 ---\nHEAVY EQUIPMENT OPERATION (Forklift) NC II Revision 01 Promulgated (11/07/2019)\n\n94\n3.4 LIST OF TOOLS, EQUIPMENT AND MATERIALS\n\nList of tools, equipment and materials for the training of a maximum of 25 trainees for\nForklift Operation NC II are as follows:\n\nTOOLS\nEQUIPMENT\nMATERIALS\nQTY\n\nQTY\n\nQTY\n\n1 set\nWrenches (box and open-\nend 8-24 mm- metric &\n7/16 –1” -English )\n1 unit\nForklift certified by\nThird Party\naccredited by DOLE-\nOHSC\n(Memorandum of\nAgreement (MOA)/\nrental)\n5 kgs.\nMulti- purpose grease\n5 pcs.\nHammer ballpeen\n(3 - 4 lbs.)\n1 unit\n Vacuum cleaner\n(heavy duty),\n220volts\n20 liters Engine oil ( SAE\n15w40)\n5 pcs.\nPliers (mechanical 10 “)\n1 unit\nPortable electric air\ncompressor, 180 cfm\n20 liters Hydraulic / steering\nfluid (TELLUS\n68/10W)\n4 pcs.\n\nAdjustable wrench (8”,10”,\n12”,18 “)\n1 piece for each size\n1 unit\nHigh pressure\nwasher, 150-250 psi\n20 liters PTO / differential and\ntransfer case drive\n(gear oil GP90/ 140)\n2 pcs.\nGrease gun (portable)\n1 unit\nLow-bed trailer/truck\n(MOA / rental)\n20 liters Automatic Trans-\nmission oil (ATF)\n5 pcs.\nScrew driver\n( 10”, flat )\n1 unit\nForklift Simulator\n(Optional)\nDisplay (Screen,\nMonitor),Controls,\nSoftware and\nHardware\nComponents, Seat\nwith Seatbelt, Power\nSupply (110-230 V\n50-60Hz)\n20 liters Manual transmission\noil GP 90/140\n5 pcs.\nScrew driver\n(10”, Philips)\n25 pcs Safety\nEquipment/PPE\n(Safety vest, Gloves,\nGoggles, Dust mask,\nHard Hat)\n4 liters\n Water coolant\n5 pcs.\nPutty knife, 2” width\n\n5 pairs\nSafety\nEquipment/PPE\n(Safety Shoes)\n200\nliters\nDiesel fuel\n5 pcs.\nPry bar (heavy duty, 18”)\n\n20 liters Battery distilled\nwater\n5 pcs.\nTire gauge (0-150 psi)\n\n1 set\nPrimary & secondary\nair filter\n\n1 unit\nFire extinguisher, 10\nlbs., dry chemical\n\n--- PDF PAGE 100 ---\nHEAVY EQUIPMENT OPERATION (Forklift) NC II Revision 01 Promulgated (11/07/2019)\n\n95\n\nTOOLS\nEQUIPMENT\nMATERIALS\nQTY\n\nQTY\n\nQTY\n\n10 pcs\nWooden/Plastic Palette,\n1m x 1m\n\n1 pc.\nForklift miniature,\n(1:50 scale)\n5 pcs\nEmpty drums, 210 liters\ncapacity\n\n1 pc\nOperator’s manual\nwith load chart\n\n3.5 TRAINING FACILITIES\n\nThe forklift operation workshop must be of concrete structure. Based on class size of\n25 students/trainees the space requirements for the teaching/learning and circulation areas\nare as follows:\n\nSPACE REQUIREMENT\nSIZE IN METERS\nAREA IN SQ.\nMETERS\nTOTAL AREA IN\nSQ. METERS\nStudent/Trainee’s Working\nSpace (Maintenance Workshop)\n 2 x 2\n4 sq.m per\nstudent\n100\nLecture Room\n8 x 6\n48\n48\nLearning Resource Center\n4 x 6\n24\n24\nFacilities/Equipment/ Circulation\nArea\n6.5 x 8\n52\n52\nWorking field\n10 x 20\n200\n200\nTOTAL AREA\n\n424\n\nNOTE: Training Center may enter into Memorandum of Agreement (MOA) with industry\n for use of facilities and heavy equipment\n\n--- PDF PAGE 101 ---\nHEAVY EQUIPMENT OPERATION (Forklift) NC II Revision 01 Promulgated (11/07/2019)\n\n96\n3.6 TRAINERS’ QUALIFICATION\n\n• Holder of National TVET Trainer Certificate Level I (NTTC Level I) in Heavy\nEquipment Operation (Forklift) NC II\n• Must have completed the 40-Hour Construction Occupational Safety and Health\n(COSH) per Department Order No. 13 s. 1998, Guidelines Governing\nOccupational Safety and Health in the Construction Industry conducted by OSHC\nand DOLE accredited Safety Training Organizations\n• Must be computer-literate\n• Must have at least 4 years work/industry experience.\n\n3.7 INSTITUTIONAL ASSESSMENT\n\nInstitutional assessment is undertaken by trainees to determine their\nachievement of units of competency. A certificate of achievement is issued for each\nunit of Competency.\n\n--- PDF PAGE 102 ---\nHEAVY EQUIPMENT OPERATION (Forklift) NC II Revision 01 Promulgated (11/07/2019)\n\n97"
