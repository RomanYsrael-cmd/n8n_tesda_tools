      "source_text": "53 CORE COMPETENCIES"
    },
    {
      "source_text": "UNIT OF COMPETENCY : PERFORM PRE AND POST-OPERATION PROCEDURES FOR FORKLIFT"
    },
    {
      "source_text": "UNIT CODE"
    },
    {
      "source_text": ": CON834216"
    },
    {
      "source_text": "UNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes in performing visual and operation check before and after productive operation of forklift."
    },
    {
      "source_text": "ELEMENT PERFORMANCE CRITERIA Italicized terms are elaborated in the Range of Variables REQUIRED KNOWLEDGE REQUIRED SKILLS 1. Perform visual check"
    },
    {
      "source_text": "1.1 Capacity of forklift is selected based on job requirements. 1.2 Operator-serviceable (OS) parts are checked in accordance with equipment checklist and manufacturer’s procedures. 1.3 Inspection of equipment is performed with checklist while power is stopped/not running 1.4 Personal Protective Equipment (PPE) is used in accordance with Rule 1080 of Occupational Safety and Health Standards. 1.5 Required output is completed based on accomplished checklist 1.1 DOLE Department Order No. 13 s. 1998 Guidelines Governing Occupational Safety and Health in the Construction Industry 1.2 Procedures in conducting visual and walk-around check 1.3 Computation of load versus capacity of forklift 1.4 Functions of parts and components of forklift 1.5 Factors affecting productivity 1.6 Productivity work measurements 1.7 Ways of improving productivity"
    },
    {
      "source_text": "1.1 Performing visual and walk-around checking procedures 1.2 Calculating load and capacity of forklift 1.3 Identifying parts and components of forklift and its functions 1.4 Accomplishing checklist 1.5 Applying productive methods and techniques 1.6 Using PPE"
    },
    {
      "source_text": "-- PDF PAGE 59 --- HEAVY EQUIPMENT OPERATION (Forklift) NC II Revision 01 Promulgated (11/07/2019)"
    },
    {
      "source_text": "54"
    },
    {
      "source_text": "ELEMENT PERFORMANCE CRITERIA Italicized terms are elaborated in the Range of Variables REQUIRED KNOWLEDGE REQUIRED SKILLS 2. Perform walk-around check"
    },
    {
      "source_text": "2.1 “BLOWAF” check is performed using checklist while engine is stopped/not running. 2.2 Battery-operated type is checked in accordance with manufacturer’s manual 2.3 Fluid levels are maintained in accordance with equipment manufacturer’s manual. 2.4 Abnormal conditions are noted in checklist and reported to authorized person. 2.5 Personal Protective Equipment (PPE) is used in accordance with Rule 1080 of Occupational Safety and Health Standards 2.6 Required output is completed based on accomplished checklist 2.1 Procedures in performing “BLOWAF” check 2.2 Procedures in checking battery- operated type 2.3 DOLE Department Order No. 13 s. 1998 Guidelines Governing Occupational Safety and Health in the Construction Industry 2.4 Waste disposal procedures 2.5 Fluid’s level and contamination 2.6 Factors affecting productivity 2.7 Productivity work measurements 2.8 Ways of improving productivity"
    },
    {
      "source_text": "2.1 Accomplishing checklist 2.2 Applying waste disposal procedures 2.3 Performing “BLOWAF” checking procedures 2.4 Performing battery-operated type checking procedures 2.5 Determining fluid level and contamination 2.6 Using PPE 2.7 Applying productive methods and techniques 3 Perform visual check for lifting attachments and power train 3.1 Lifting attachments and power train components are checked in accordance with checklist and manufacturer’s procedures 3.2 Abnormal conditions are noted in checklist and reported to authorized person 3.3 Personal Protective Equipment (PPE) is used in accordance with Rule 1080 of Occupational Safety and Health Standards 3.4 Required output is completed based on accomplished checklist"
    },
    {
      "source_text": "3.1 Procedures in visual check for lifting attachments and power train components 3.2 DOLE Department Order No. 13 s. 1998 Guidelines Governing Occupational Safety and Health in the Construction Industry 3.3 Functions of lifting attachments and power train components 3.4 Factors affecting productivity 3.5 Productivity work measurements 3.6 Ways of improving productivity 3.1 Accomplishing checklist 3.2 Performing visual check for lifting attachments and power train components 3.3 Identifying lifting attachments and power train components and its functions 3.4 Using PPE 3.5 Applying productive methods and techniques"
    },
    {
      "source_text": "-- PDF PAGE 60 --- HEAVY EQUIPMENT OPERATION (Forklift) NC II Revision 01 Promulgated (11/07/2019)"
    },
    {
      "source_text": "55 ELEMENT PERFORMANCE CRITERIA Italicized terms are elaborated in the Range of Variables REQUIRED KNOWLEDGE REQUIRED SKILLS 4 Perform operation check"
    },
    {
      "source_text": "4.1 Starting/running check/operation check is performed with checklist and in accordance with manufacturer’s recommendations. 4.2 Electrical motor is checked for normal functioning based on manufacturer's specifications. 4.3 Safety devices are checked for proper functions in accordance with safe operating procedures. 4.4 Personal Protective Equipment (PPE) is used in accordance with Rule 1080 of Occupational Safety and Health Standards 4.5 Required output is completed based on accomplished checklist 4.1 Start-up and warming procedures 4.2 Procedures in Operation check 4.3 DOLE Department Order No. 13 s. 1998 Guidelines Governing Occupational Safety and Health in the Construction Industry 4.4 Warning signs and symbols 4.5 Functions of all components and safety devices 4.6 Factors affecting productivity 4.7 Productivity work measurements 4.8 Ways of improving productivity"
    },
    {
      "source_text": "4.1 Performing procedures in operation check 4.2 Accomplishing checklist 4.3 Applying productive methods and techniques 4.4 Using PPE"
    },
    {
      "source_text": "5 Perform post- operation procedures 5.1 Forklift is parked and turned off after productive operation in accordance to manufacturer’s manual. 5.2 Controls are set into neutral position and parking brakes are engaged in accordance to manufacturer’s manual. 5.3 Safety locks are all engaged in accordance with manufacturer’s manual. 5.4 Walk-around inspection check is re-conducted after operation 5.5 Daily equipment time record/report (DETR) is accomplished/submitted according to company rules and regulations 5.6 Personal Protective Equipment (PPE) is used in accordance with Rule 1080 of Occupational Safety and Health Standard 5.1 Company rules and regulations 5.2 Parking and shut- down procedures 5.3 DOLE Department Order No. 13 s. 1998 Guidelines Governing Occupational Safety and Health in the Construction Industry 5.4 Factors affecting productivity 5.5 Productivity work measurements 5.6 Ways of improving productivity"
    },
    {
      "source_text": "5.1 Following rules and regulations in parking and shutting down Forklift 5.2 Performing post- operation procedures 5.3 Accomplishing DETR 5.4 Applying productive methods and techniques 5.5 Using PPE"
    },
    {
