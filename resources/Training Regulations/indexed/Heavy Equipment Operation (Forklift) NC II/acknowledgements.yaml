    {
      "source_text": "67 UNIT OF COMPETENCY : PERFORM PRODUCTIVE OPERATION FOR FORKLIFT"
    },
    {
      "source_text": "UNIT CODE"
    },
    {
      "source_text": ": CON834218"
    },
    {
      "source_text": "UNIT DESCRIPTOR"
    },
    {
      "source_text": ": This unit involves the knowledge, skills and attitudes in traveling, loading and unloading to low-bed trailer, interpreting load chart and lifting operation for Forklift."
    },
    {
      "source_text": "ELEMENT PERFORMANCE CRITERIA Bold and Italicized terms are elaborated in the Range of Variables REQUIRED KNOWLEDGE REQUIRED SKILLS 1. Travel the forklift"
    },
    {
      "source_text": "1.1 Road conditions are considered before travelling the forklift. 1.2 Work area is surveyed for potential hazards in accordance with safe operating procedures. 1.3 Travel speed and position of forklift are observed in accordance with manufacturer’s manual and/or company rules and regulations 1.4 Unexpected situations are responded in line with company rules and regulations. 1.5 Personal Protective Equipment (PPE) is used in accordance with Rule 1080 of Occupational Safety and Health Standards 1.1 DOLE Department Order No. 13 s. 1998 Guidelines Governing Occupational Safety and Health in the Construction Industry 1.2 Company rules and regulations 1.3 Site and weather conditions 1.4 Road worthiness 1.5 Clearance and distances 1.6 Speed limit 1.7 Procedures in travelling and positioning of forklift 1.8 Factors affecting productivity 1.9 Productivity work measurements 1.10 Ways of improving productivity"
    },
    {
      "source_text": "1.1 Following company rules and regulations 1.2 Driving skills 1.3 Travelling the forklift 1.4 Using PPE 1.5 Applying productive methods and techniques"
    },
    {
      "source_text": "-- PDF PAGE 73 --- HEAVY EQUIPMENT OPERATION (Forklift) NC II Revision 01 Promulgated (11/07/2019)"
