    {
      "source_text": "ELEMENT PERFORMANCE CRITERIA Bold and Italicized terms are elaborated in the Range of Variables REQUIRED KNOWLEDGE REQUIRED SKILLS 3. Interpret load chart"
    },
    {
      "source_text": "3.1 Weight of the load is determined according to load information 3.2 Lifting capacity is determined according to manufacturer’s specifications 3.3 Lifting capacity in the load chart is followed according to manufacturer’s specifications 3.4 Loads are calculated based on load center 3.6 Personal Protective Equipment (PPE) is used in accordance with Rule 1080 of Occupational Safety and Health Standards"
    },
    {
      "source_text": "3.1 DOLE Department Order No. 13 s. 1998 Guidelines Governing Occupational Safety and Health in the Construction Industry 3.2 Conversion of units 3.3 Forklift capacity based on load chart 3.4 Procedures in interpreting load chart. 3.5 Factors affecting productivity 3.6 Productivity work measurements 3.7 Ways of improving productivity"
    },
    {
      "source_text": "3.1 Interpreting load chart 3.2 Calculating load capacity 3.3 Using PPE 3.4 Applying productive methods and techniques"
    },
