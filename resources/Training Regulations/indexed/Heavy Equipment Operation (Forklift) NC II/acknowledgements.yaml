e of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1. Travel the forklift\n\n1.1 Road conditions are\nconsidered before\ntravelling the forklift.\n1.2 Work area is surveyed\nfor potential hazards\nin accordance with safe\noperating procedures.\n1.3 Travel speed and\nposition of forklift are\nobserved in\naccordance with\n manufacturer’s manual\nand/or company rules\nand regulations\n1.4 Unexpected situations\nare responded in\n line with company rules\nand regulations.\n1.5 Personal Protective\n Equipment (PPE) is\n used in accordance\n with Rule 1080 of\n Occupational Safety\n and Health Standards\n1.1 DOLE\nDepartment\nOrder No. 13 s.\n1998 Guidelines\nGoverning\nOccupational\nSafety and\nHealth in the\nConstruction\nIndustry\n1.2 Company rules\nand regulations\n1.3 Site and weather\nconditions\n1.4 Road worthiness\n1.5 Clearance and\ndistances\n1.6 Speed limit\n1.7 Procedures in\ntravelling and\npositioning of\nforklift\n1.8 Factors affecting\nproductivity\n1.9 Productivity work\nmeasurements\n1.10 Ways of\nimproving\nproductivity\n\n1.1 Following\ncompany rules\nand regulations\n1.2 Driving skills\n1.3 Travelling the\nforklift\n1.4 Using PPE\n1.5 Applying\nproductive\nmethods and\ntechniques\n\n--- PDF PAGE 73 ---\nHEAVY EQUIPMENT OPERATION (Forklift) NC II Revision 01 Promulgated (11/07/2019)\n\n68\n\nELEMENT\nPERFORMANCE\nCRITERIA\nBold and Italicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n2. Load and unload\nforklift to low-bed\ntrailer/truck\n2.1 Low-bed trailer /truck for\ntransporting the forklift\nis selected according to\njob requirements.\n2.2 Lifting attachments are\npositioned and secured\nbased on\nmanufacturer’s manual.\n2.3 Verbal instructions and\nsignals are conveyed\nwith authorized spotter\nduring loading and\nunloading as per\nstandard operating\nprocedures.\n2.4 All safety locks and\ncontrol levers are\nsecured at neutral\nposition before and after\nloading based on\nmanufacturer's\nspecifications.\n2.5 Personal Protective\nEquipment (PPE) is\nused in accordance with\nRule 1080 of\nOccupational Safety\nand Health Standards\n\n2.1 DOLE\nDepartment\nOrder No. 13 s.\n1998 Guidelines\nGoverning\nOccupational\nSafety and Health\nin the\nConstruction\nIndustry\n2.2 Hand signals\n2.3 Site and weather\nconditions\n2.4 Clearance and\ndistances\n2.5 Speed limit\n2.6 Procedures in\nloading and\nunloading\n2.7 Factors affecting\nproductivity\n2.8 Productivity work\nmeasurements\n2.9 Ways of improving\nproductivity\n\n2.1 Following verbal\ninstructions and\nsignals\n2.2 Operating skills in\nloading and\nunloading forklift to\nlow-bed\ntrailer/truck\n2.3 Using PPE\n2.4 Applying\nproductive\nmethods and\ntechniques\n\n--- PDF PAGE 74 ---\nHEAVY EQUIPMENT OPERATION (Forklift) NC II Revision 01 Promulgated (11/07/2019)\n\n69\n\nELEMENT\nPERFORMANCE\nCRITERIA\nBold and Italicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n3. Interpret load chart\n\n3.1 Weight of the load is\ndetermined according\nto load information\n3.2 Lifting capacity is\ndetermined according to\nmanufacturer’s\nspecifications\n3.3 Lifting capacity in the\nload chart is followed\naccording to\nmanufacturer’s\nspecifications\n3.4 Loads are calculated\nbased on load center\n3.6 Personal Protective\nEquipment (PPE) is\nused in accordance with\nRule 1080 of\nOccupational Safety\nand Health Standards\n\n3.1 DOLE\nDepartment\nOrder No. 13 s.\n1998 Guidelines\nGoverning\nOccupational\nSafety and Health\nin the\nConstruction\nIndustry\n3.2 Conversion of\nunits\n3.3 Forklift capacity\nbased on load\nchart\n3.4 Procedures in\ninterpreting load\nchart.\n3.5 Factors affecting\nproductivity\n3.6 Productivity work\nmeasurements\n3.7 Ways of improving\nproductivity\n\n3.1 Interpreting load\nchart\n3.2 Calculating load\ncapacity\n3.3 Using PPE\n3.4 Applying\nproductive\nmethods and\ntechniques\n\n--- PDF PAGE 75 ---\nHEAVY EQUIPMENT OPERATION (Forklift) NC II Revision 01 