    },
    {
      "source_text": "4.1 Site and weather conditions are considered before lifting and handling of load 4.2 Safe work procedures and practices are observed during handling and lifting operation based on OSH standards and manufacturer’s manual 4.3 Optimum speed during travel, lifting and tilting operation is controlled based on manufacturer’s manual 4.4 Loads are handled in accordance with cargo contents within required capacity 4.5 Communication with spotter is established and maintained during traveling and lifting of loads based on company rules and regulations 4.6 Unexpected situations are responded in line with company rules and regulations 4.7 Personal Protective Equipment (PPE) is used in accordance with Rule 1080 of Occupational Safety and Health Standards"
    },
    {
