    {
      "source_text": "68"
    },
    {
      "source_text": "ELEMENT PERFORMANCE CRITERIA Bold and Italicized terms are elaborated in the Range of Variables REQUIRED KNOWLEDGE REQUIRED SKILLS 2. Load and unload forklift to low-bed trailer/truck 2.1 Low-bed trailer /truck for transporting the forklift is selected according to job requirements. 2.2 Lifting attachments are positioned and secured based on manufacturer’s manual. 2.3 Verbal instructions and signals are conveyed with authorized spotter during loading and unloading as per standard operating procedures. 2.4 All safety locks and control levers are secured at neutral position before and after loading based on manufacturer's specifications. 2.5 Personal Protective Equipment (PPE) is used in accordance with Rule 1080 of Occupational Safety and Health Standards"
    },
    {
      "source_text": "2.1 DOLE Department Order No. 13 s. 1998 Guidelines Governing Occupational Safety and Health in the Construction Industry 2.2 Hand signals 2.3 Site and weather conditions 2.4 Clearance and distances 2.5 Speed limit 2.6 Procedures in loading and unloading 2.7 Factors affecting productivity 2.8 Productivity work measurements 2.9 Ways of improving productivity"
    },
    {
      "source_text": "2.1 Following verbal instructions and signals 2.2 Operating skills in loading and unloading forklift to low-bed trailer/truck 2.3 Using PPE 2.4 Applying productive methods and techniques"
    },
    {
      "source_text": "-- PDF PAGE 74 --- HEAVY EQUIPMENT OPERATION (Forklift) NC II Revision 01 Promulgated (11/07/2019)"
