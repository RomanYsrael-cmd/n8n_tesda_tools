    {
      "source_text": "May include: 3.1 Busted hydraulic hose 3.2 Hard starting engine 3.3 Excessive engine oil consumption 3.4 Leakage on 3.4.1 Air 3.4.2 Fuel 3.4.3 Cooling 3.4.4 Hydraulic system 3.5 Weak brakes 3.6 Busted/flat tires 3.7 Defective electrical components 3.7.1 Charging 3.7.2 Lighting 3.7.3 Starting 3.7.4 Gauges 4 Authorized personnel"
    },
    {
