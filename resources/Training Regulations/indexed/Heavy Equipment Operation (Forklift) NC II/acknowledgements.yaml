      "source_text": "102 GLOSSARY OF TERMS"
    },
    {
      "source_text": "1. Lifting Attachment Refers to mechanism which is attached to carriage, either permanently or temporarily, to help in proper engagement of the load"
    },
    {
      "source_text": "2. Foklift Refers to a self-propelled machine for lifting and handling objects by means of fork inserted under the load"
    },
    {
      "source_text": "3. Standard Refers to a degree or level of requirement set by the manufacturer."
    },
    {
      "source_text": "4. Derated capacity of equipment"
    },
    {
      "source_text": "5. Power train"
    },
    {
      "source_text": "6. Hazards"
    },
    {
      "source_text": "7. Spotter"
    },
    {
      "source_text": "8. Load center"
    },
    {
      "source_text": "9. Computer Literate"
    },
    {
      "source_text": "Refers to the reduction of lifting capacity of equipment as certified by a third party."
    },
    {
      "source_text": "Refers to mechanism that transmits the drive from the engine of a vehicle to its axle."
    },
    {
      "source_text": "Refers to situation that poses threat to life, health, property, or environment."
    },
    {
      "source_text": "Refers to signalman that directs the schedule of lifts for the forklift, and is responsible for the safety of the loads."
    },
    {
      "source_text": "Refers to the distance from the front face of the forks to the center of gravity of the load"
    },
    {
