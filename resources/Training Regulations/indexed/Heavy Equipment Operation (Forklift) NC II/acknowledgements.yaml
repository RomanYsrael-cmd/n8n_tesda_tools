place or simulation environment in TESDA\naccredited institutions.\n\n--- PDF PAGE 20 ---\nHEAVY EQUIPMENT OPERATION (Forklift) NC II Revision 01 Promulgated (11/07/2019)\n\n15\nUNIT OF COMPETENCY :\nDEVELOP CAREER AND LIFE DECISIONS\n\nUNIT CODE\n : 400311213\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills, and attitudes in managing\none’s emotions, developing reflective practice, and boosting self-\nconfidence and developing self-regulation.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Manage one’s\nemotion\n1.1 Self-management\nstrategies are\nidentified\n1.2 Skills to work\nindependently and to\nshow initiative, to be\nconscientious, and\npersevering in the\nface of setbacks and\nfrustrations are\ndeveloped\n1.3 Techniques for\neffectively handling\nnegative emotions\nand unpleasant\nsituation in the\nworkplace are\nexamined\n\n1.1 Self-\nmanagement\nstrategies that\nassist in\nregulating\nbehavior and\nachieving\npersonal and\nlearning goals\n(e.g. Nine self-\nmanagement\nstrategies\naccording to\nRobert Kelley)\n1.2 Enablers and\nbarriers in\nachieving\npersonal and\ncareer goals\n1.3 Techniques in\nhandling\nnegative\nemotions and\nunpleasant\nsituation in the\nworkplace\nsuch as\nfrustration,\nanger, worry,\nanxiety, etc.\n1.1 Managing\nproperly one’s\nemotions and\nrecognizing\nsituations that\ncannot be\nchanged and\naccept them and\nremain\nprofessional\n1.2 Developing self-\ndiscipline,\nworking\nindependently\nand showing\ninitiative to\nachieve personal\nand career goals\n1.3 Showing\nconfidence, and\nresilience in the\nface of setbacks\nand frustrations\nand other\nnegative\nemotions and\nunpleasant\nsituations in the\nworkplace\n\n--- PDF PAGE 21 ---\nHEAVY EQUIPMENT OPERATION (Forklift) NC II Revision 01 Promulgated (11/07/2019)\n\n16\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWL