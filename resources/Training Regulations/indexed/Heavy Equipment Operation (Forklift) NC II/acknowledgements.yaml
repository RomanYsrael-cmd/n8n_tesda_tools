    },
    {
      "source_text": "2.1 Understanding Operator’s Maintenance Manual (OMM) 2.2 DOLE Department Order No. 13 s. 1998 Guidelines Governing Occupational Safety and Health in the Construction Industry 2.3 Site and weather conditions 2.4 Waste disposal procedures 2.5 Volume 2.6 Clearance and distances 2.7 Types of fluids and lubricants 2.8 Procedures in basic preventive maintenance servicing 2.9 Types and uses of basic hand tools and portable powered tools 2.10 Factors affecting productivity 2.11 Productivity work measurements 2.12 Ways of improving productivity"
