  "source_text": "SECTION 1 HEAVY EQUIPMENT OPERATION (FORKLIFT)\n\nThe HEAVY EQUIPMENT OPERATION (FORKLIFT) NC II qualification consists of\ncompetencies that workers must achieve to enable them to perform tasks such as inspection,\nbasic preventive maintenance, lifting and handling of loads in construction sites or other\nlocations with the use of a forklift.\n\nThis qualification is packaged from the competency map of Construction - Heavy\nEquipment sub-sector as shown in Annex A.\n\nThe units of competency comprising this qualification include the following:\n\nCODE NO.\nBASIC COMPETENCIES\n400311210\nParticipate in workplace communication\n400311211\n400311212\n400311213\n400311214\n400311215\n400311216\n400311217\n\n400311218\nWork in a team environment\nSolve/address general workplace problems\nDevelop career and life decisions\nContribute to workplace innovation\nPresent relevant information\nPractice occupational safety and health policies and proced\nExercise efficient and effective sustainable practices in\nthe workplace\nPractice entrepreneurial skills in the workplace\n\nCODE NO.\nCOMMON COMPETENCIES\nCON931201\nPrepare construction materials and tools\nCON311201\nObserve procedures, specifications and manuals of\ninstruction\nCON311202\nInterpret technical drawings and plans\nCON311203\nPerform mensurations and calculations\nCON311204\nMaintain tools and equipment\n\nCODE NO.\nCORE COMPETENCIES\nCON834216\nPerform pre and post-operation procedures for forklift\nCON834217\nPerform basic preventive maintenance servicing for\nforklift\nCON834218\nPerform productive operation for forklift\n\nA person who has achieved this Qualification is competent to be a –\n\n❑ Forklift operator\n\n--- PDF PAGE 7 ---\nHEAVY EQUIPMENT OPERATION (Forklift) NC II Revision 01 Promulgated (11/07/2019)\n\n2"
