  "source_text": "COMPETENCY MAP - CONSTRUCTION Sector\n(HEAVY EQUIPMENT OPERATION)\n HEAVY EQUIPMENT OPERATION (FORKLIFT) NC II\n\nBASIC COMPETENCIES\n\n--- PDF PAGE 105 ---\nHEAVY EQUIPMENT OPERATION (Forklift) NC II Revision 01 Promulgated (11/07/2019)\n\n100\n\nUtilize specialize\nspecialized\ncommunication\nskill\nDevelop and\nlead teams\nPerform higher\norder thinking\nprocesses and\napply\ntechniques in\nthe workplace\nContribute to\nthe practice\nof social\njustice in the\nworkplace\nManage\ninnovative\nwork\ninstructions\nManage and\nevaluate usage\nof information\nLead in\nimprovement\nof\nOccupational\nSafety and\nHealth\nProgram,\nPolicies and\nProcedures\nLead towards\nimprovement of\nenvironmental\nwork programs,\npolicies and\nprocedures\nSustain\nentrepreneurial\nskills\nManage and\nsustain effective\ncommunication\nstrategies\nManage and\nsustain high\nperforming\nteams\nEvaluate higher\norder thinking\nskills and\nadjust problem\nsolving\ntechniques\nAdvocate\nstrategic\nthinking for\nglobal\ncitizenship\nIncorporate\ninnovation into\nwork\nprocedures\nDevelop\nsystems in\nmanaging, and\nmaintaining\ninformation\nManage\nimplementatio\nn of OSH\nprograms in\nthe workplace\nManage\nimplementation\nof\nenvironmental\nprogram in the\nworkplace\nDevelop and\nsustain a high-\nperforming\nenterprise\nPrepare\nconstruction\nmaterials and tools\n\nObserve\nprocedures,\nspecifications and\nmanual of\ninstructions\n\nInterpret technical\ndrawings and plans\nPerform\nmensurations and\ncalculations\n\nMaintain tools and\nequipment\n\nBASIC COMPETENCIES\n\nCOMMON COMPETENCIES\n\n--- PDF PAGE 106 ---\nHEAVY EQUIPMENT OPERATION (Forklift) NC II Revision 01 Promulgated (11/07/2019)\n\n101\n\nPerform pre and post\noperation procedures for\ntruck mounted crane\n\nPerform basic preventive\nmaintenance servicing\nfor truck mounted crane\n\nPerform productive\noperation for truck\nmounted crane\n\nPerform pre and post\noperation procedures for\nrough terrain crane\n\nPerform basic preventive\nmaintenance servicing\nfor rough terrain crane\n\nPerform productive\noperation for rough\nterrain crane\n\nPerform pre and post\noperation procedures for\ncrawler crane\n\nPerform basic preventive\nmaintenance servicing\nfor crawler crane\n\nPerform productive\noperation for crawler\ncrane\n\nPerform pre and post\noperation procedures for\nforklift\n\nPerform basic preventive\nmaintenance servicing\nfor forklift\n\nPerform productive\noperation for forklift\n\nPerform pre and post\noperation procedures for\ntower crane\n\nPerform basic preventive\nmaintenance servicing\nfor tower crane\nPerform productive\noperation for tower care\n\nPerform pre and post\noperation procedures for\noverhead and gantry\ncrane\nPerform basic preventive\nmaintenance servicing\noverhead and gantry\ncrane\n\nPerform productive\noperation for overhead\nand gantry crane\n\nPerform pre and post\noperation procedures for\nhydraulic excavator\n\nPerform basic preventive\nmaintenance servicing\nfor hydraulic excavator\nPerform productive\noperation for hydraulic\nexcavator\n\nPerform pre and post\noperation procedures for\non-highway dump truck\n(rigid)\nPerform basic preventive\nmaintenance servicing\nfor on-highway dump\ntruck (rigid)\nPerform productive\noperation for on-highway\ndump truck (rigid)\n\nCORE COMPETENCIES\n\n--- PDF PAGE 107 ---\nHEAVY EQUIPMENT OPERATION (Forklift) NC II Revision 01 Promulgated (11/07/2019)\n\n102\nGLOSSARY OF TERMS\n\n1. Lifting Attachment Refers to mechanism which is attached to carriage, either\npermanently or temporarily, to help in proper engagement of the\nload\n\n2. Foklift\nRefers to a self-propelled machine for lifting and handling objects\nby means of fork inserted under the load\n\n3. Standard\nRefers to a degree or level of requirement set by the\nmanufacturer.\n\n4. Derated capacity\nof equipment\n\n5. Power train\n\n6. Hazards\n\n7. Spotter\n\n8. Load center\n\n9. Computer Literate\n\nRefers to the reduction of lifting capacity of equipment as\ncertified by a third party.\n\nRefers to mechanism that transmits the drive from the engine of\na vehicle to its axle.\n\nRefers to situation that poses threat to life, health, property, or\nenvironment.\n\nRefers to signalman that directs the schedule of lifts for the\nforklift, and is responsible for the safety of the loads.\n\nRefers to the distance from the front face of the forks to the\ncenter of gravity of the load\n\nIs defined as the knowledge and ability to utilize computers and\nrelated technology efficiently, with a range of skills covering\nlevels from elementary use to computer programming and\nadvanced problem solving.\n\n--- PDF PAGE 108 ---\nHEAVY EQUIPMENT OPERATION (Forklift) NC II Revision 01 Promulgated (11/07/2019)\n103\n\nTRAINING REGULATIONS (TR)\nDOCUMENT REVISION HISTORY\n\nQualification Title:\nHeavy Equipment Operation (Forklift ) NC II\nQualification Code:\nCONFOR319\n\nRevision\nNo.\nDocument\nTypes*\nQualification Title\nTESDA Board\nResolution No./\nDate\nDeployment\n(TESDA Circular/\nImplementing\nGuidelines)\n00\nDocument Created\n\nHEO (Forklift ) NC II\n2007-20 /\nN/A\n01\nDocument Amended\n\nHEO (Forklift) NC II\n\n Legend: *Description Types\n- Document Created\n- Document Amended\n\n--- PDF PAGE 109 ---\nHEAVY EQUIPMENT OPERATION (Forklift) NC II Revision 01 Promulgated (11/07/2019)\n104\nACKNOWLEDGMENTS\n\nThe Technical Education and Skills Development Authority (TESDA) wishes to\nextend thanks and appreciation to the many representatives of business, industry,\nacademe and government agencies who donated their time and expertise to the\ndevelopment and validation of these Training Regulations.\n\nTECHNICAL EXPERTS REVIEW PANEL\n\nENGR. SEBASTIAN Q. ALAMPAYAN, JR.\nSafety & Training Manager-\nIndustry Expert\nFirst Balfour, Inc.\nParañaque City\nEDUARDO C. EMAS\nTrainer/ Assessor\nAssociation of Carriers and Equipment\nLessors, Inc. (ACEL)\nPasig City\nMARY LOU C. URLANDA\nTrainer\nAssociation of Carriers and Equipment\nLessors, Inc. (ACEL)\nPasig City\n\nENGR. CORNELIO D. PADUA\nDepartment Head - Industry Expert\nManila’s Finest Construction, Inc.\nParañaque City\nJESUS C. SALVACION\nLifting Superintendent\nRoyal Cargo Inc.\nBatangas City /\nRigging Gears Specialist\nAssessment Center Inc.\nChairman/ AC Manager\nROBENSON S. LIM\nManpower Head/ Trainer\nAssociation of Carriers and Equipment\nLessors, Inc. (ACEL)\nPasig City\n\n--- PDF PAGE 110 ---\nHEAVY EQUIPMENT OPERATION (Forklift) NC II Revision 01 Promulgated (11/07/2019)\n105\nThe PARTICIPANTS in the Validation of this Training Regulations\n\n• C.M. Pancho Construction, Inc.\n Quezon City\n• EEI Corporation\n Calamba City\n\n• J. E. Manalo and Company, Inc.\n Makati City\n\n• Makati Development Corporation\n Taguig City\n\n• Monark Equipment\nQuezon City\n\n• Sta. Clara Int’l. Corp.\n Mandaluyong City\n\n• Occupational Safety and Health\n Center (OSHC)\n Quezon City\n\n• Bureau of Working Condition - DOLE\n Intramuros, Manila\n\nThe MEMBERS of the TESDA Board and Secretariat\n\nThe MANAGEMENT and STAFF of the TESDA Secretariat\n• Qualifications and Standards Office (QSO)\n• TR Development Team/Facilitators\n- Ma. Isabel G. Gamurot\n- Howard Mark N. Plete\n- Evangeline A. Cosep",
