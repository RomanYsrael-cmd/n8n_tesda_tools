        "source_text": "CON834217\n\nUNIT DESCRIPTOR\n\n:\nThis unit involves the knowledge, skills and attitudes\nrequired in cleaning/greasing, adjusting and replacing\noperator-serviceable (OS) parts of Forklift.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nBold and Italicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1. Perform adjustment\nor replacement for\nnoted defects\n\n1.1 Minor defects are\nidentified and\nrepaired/replaced in\naccordance with\nmanufacturer’s\nprocedures.\n1.2 Basic hand tools\nand portable powered\ntools are selected\nbased on job\nrequirements.\n1.3 Major defects are\nidentified using\nchecklist and referred to\nauthorized personnel\nfor action.\n1.4 Personal Protective\nEquipment (PPE) is\nused in accordance\nwith Rule 1080 of\nOccupational Safety\nand Health Standards\n\n1.1 DOLE\nDepartment Order\nNo. 13 s. 1998\nGuidelines\nGoverning\nOccupational\nSafety and Health\nin the\nConstruction\nIndustry\n1.2 Waste disposal\nprocedures\n1.3 Volume/Capacity\n1.4 Clearance and\ndistances\n1.5 Types of fluids\nand lubricants\n1.6 Procedures in\nperforming\nadjustments or\nreplacements for\nnoted defects.\n1.7 Types and uses of\nbasic hand tools\nand portable\npowered tools\n1.8 Structure and\nfunction of Forklift\ncomponents\n1.9 Factors affecting\nproductivity\n1.10 Productivity work\nmeasurements\n1.11 Ways of\nimproving\nproductivity\n\n1.1 Application of\ndifferent basic\nhand tools and\nportable powered\ntools\n1.2 Identifying defects\n1.3 Performing\nadjustments or\nreplacements for\nminor defects\n1.4 Using PPE\n1.5 Applying\nproductive\nmethods and\ntechniques\n1.6 Handling,\nsegregation and\ndisposal of\nhazardous waste\n\n--- PDF PAGE 66 ---\nHEAVY EQUIPMENT OPERATION (Forklift) NC II Revision 01 Promulgated (11/07/2019)\n\n61\n\nELEMENT\nPERFORMANCE\nCRITERIA\nBold and Italicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n2 Perform basic\npreventive\nmaintenance\nservicing (PMS)\n\n2.1 Operator’s\nServiceable parts are\nidentified and serviced\naccording to\nmanufacturer’s\nrecommendations.\n2.2 Standard parameters\nare checked according\nto manufacturer’s\nrecommendations.\n2.3 Fluids and lubricants\nare used based on\nmanufacturer’s manual.\n2.4 Basic hand tools,\nportable powered tools\nand consumable\nmaterials are identified\nand used in\naccordance with job\nrequirements.\n2.5 Basic preventive\nmaintenance\nservicing (PMS) is\ncarried out in\naccordance with\nmanufacturer’s and\nsite regulations\n2.6 Site conditions are\nconsidered during PMS\n2.7 Personal Protective\nEquipment (PPE) is\nused in accordance\nwith Rule 1080 of\nOccupational Safety\nand Health Standards\n\n2.1 Understanding\nOperator’s\nMaintenance\nManual (OMM)\n2.2 DOLE\nDepartment\nOrder No. 13 s.\n1998 Guidelines\nGoverning\nOccupational\nSafety and\nHealth in the\nConstruction\nIndustry\n2.3 Site and weather\nconditions\n2.4 Waste disposal\nprocedures\n2.5 Volume\n2.6 Clearance and\ndistances\n2.7 Types of fluids\nand lubricants\n2.8 Procedures in\nbasic preventive\nmaintenance\nservicing\n2.9 Types and uses\nof basic hand\ntools and\nportable powered\ntools\n2.10 Factors affecting\nproductivity\n2.11 Productivity work\nmeasurements\n2.12 Ways of\nimproving\nproductivity\n\n2.1 Performing basic\npreventive\nmaintenance\nservicing (PMS)\n2.2 Application of\nbasic hand tools\nand portable\npowered tools\n2.3 Application of\nfluids and\nlubricants\n2.4 Handling,\nsegregation and\ndisposal of\nhazardous waste\n2.5 Using PPE\n2.6 Applying\nproductive\nmethods and\ntechniques\n\n--- PDF PAGE 67 ---\nHEAVY EQUIPMENT OPERATION (Forklift) NC II Revision 01 Promulgated (11/07/2019)\n\n62\n\nELEMENT\nPERFORMANCE\nCRITERIA\nBold and Italicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n3 Prepare equipment\nreports\n\n3.1 Equipment checklist is\naccomplished in\naccordance with\nmanufacturer’s/company\nrequirements\n3.2 Equipment defects are\nreported to appropriate\npersonnel\n3.3 Document control\nprocedures is observed\nbased on company\nrequirements\n3.4 Personal Protective\nEquipment (PPE) is\nused in accordance with\nRule 1080 of\nOccupational Safety and\nHealth Standards\n\n3.1 DOLE\nDepartment\nOrder No. 13 s.\n1998 Guidelines\nGoverning\nOccupational\nSafety and\nHealth in the\nConstruction\nIndustry\n3.2 Completion of\nchecklist and\ndefects reports\n3.3 Document control\nprocedures\n\n3.1 Accomplishing\nequipment\nreport/checklist\n3.2 Using PPE\n\n--- PDF PAGE 68 ---\nHEAVY EQUIPMENT OPERATION (Forklift) NC II Revision 01 Promulgated (11/07/2019)\n\n63\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Minor defects\n\nMay include:\n1.1 Weak battery\n1.2 Tire inflation\n1.3 Belt tension\n1.4 Clogged air cleaner\n1.5 Defective radiator cap\n1.6 Loose battery clamps\n1.7 Bolts and mountings\n1.8 Presence of water in fuel separator\n2. Basic hand tools\nand portable\npowered tools\nMay include:\n2.1 Hand tools\n 2.1.1 Wrenches\n 2.1.2 Pliers\n 2.1.3 Brush (steel, paint)\n 2.1.4 Grease gun\n 2.1.5 Hammer (ball-peen, rubber, test)\n 2.1.6 Vice grip\n 2.1.7 Meter tape\n 2.1.8 Screw driver (Philips and flat tip)\n 2.1.9 Tire gauge (instrument)\n2.2 Portable Powered Tools\n2.2.1 High pressure washer\n2.3 Air compressor\n2.4 Battery charger\n3. Major defects\n\nMay include:\n3.1 Busted hydraulic hose\n3.2 Hard starting engine\n3.3 Excessive engine oil consumption\n3.4 Leakage on\n 3.4.1 Air\n 3.4.2 Fuel\n 3.4.3 Cooling\n 3.4.4 Hydraulic system\n3.5 Weak brakes\n3.6 Busted/flat tires\n3.7 Defective electrical components\n 3.7.1 Charging\n 3.7.2 Lighting\n3.7.3 Starting\n 3.7.4 Gauges\n4 Authorized\npersonnel\n\nMay include:\n4.1 Equipment supervisor\n4.2 Equipment Dispatcher/Foreman\n4.3 Equipment Maintenance personnel\n\n--- PDF PAGE 69 ---\nHEAVY EQUIPMENT OPERATION (Forklift) NC II Revision 01 Promulgated (11/07/2019)\n\n64\nVARIABLE\nRANGE\n5 Operator\nserviceable (OS)