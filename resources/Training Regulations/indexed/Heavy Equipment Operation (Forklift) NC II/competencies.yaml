        "source_text": "CON931201\n\nUNIT DESCRIPTOR\n\n:\nThis unit covers the knowledge, skills and attitudes on\nidentifying, requesting and receiving construction\nmaterials and tools in various workplace settings.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variable\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Identify materials\n\n1.1 Materials are identified\nas per job requirements\n1.2 Quantity and\ndescription of\nmaterials and tools\nconform with the job\nrequirements\n1.3 Tools and accessories\nare identified according\nto job requirements\n1.1 Different work\nspecifications\n1.2 Types and uses\nof heavy\nequipment tools\nand accessories\n\n1.1 Identifying tools\nand accessories\naccording to the\njob requirements\n\n2. Prepare requisition\nof materials\n\n2.1 Materials and tools\nneeded are requested\naccording to the\nidentified requirements\n2.2 Request is done as per\ncompany standard\noperating procedures\n(SOP)\n2.3 Substitute materials and\ntools are provided\nwithout sacrificing cost\nand quality of work\n2.1 Work\nrequirements\n2.2 Types and uses\nof heavy\nequipment tools\nand accessories\n2.3 Material take-off\n2.4 Requisition\nprocedures\n2.1 Preparing material\ntake-off\n2.2 Requesting\nmaterials and tools\n\n3. Receive and\ninspect materials\n3.1 Materials and tools\nissued are inspected as\nper quantity and\nspecification\n3.2 Tools, accessories and\nmaterials are checked\n3.3 Materials and tools are\nset aside to appropriate\nlocation\n3.1 Policy on\nreceiving\nmaterial\ndeliveries\n3.2 Material and\ntools quality and\ndefects\n3.3 Material\nhandling\n3.1 Checking and\ninspecting\nmaterials and tools\n3.2 Storing/ stacking\nof tool and\nmaterials\n\n--- PDF PAGE 42 ---\nHEAVY EQUIPMENT OPERATION (Forklift) NC II Revision 01 Promulgated (11/07/2019)\n\n37\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Description of\nmaterials and tools\n\nMay include:\n2.1 Brand name\n2.2 Size\n2.3 Capacity\n2.4 Kind of application\n2. Tools and\naccessories\nMay include:\n1.1 Electrical supplies\n1.2 Mechanical supplies\n1.3 Cleaning supplies\n3. Company standard\noperating\nprocedures\nMay include:\n3.1 Job order\n3.2 Requisition slip\n3.3 Borrower slip\n\n EVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\n\nAssessment requires evidence that the candidate:\n1.1 Listed materials and tools according to quantity and job\nrequirements\n1.2 Requested materials and tools according to the list prepared\nand as per company SOP\n1.3 Inspected issued materials and tools as per quantity and job\nspecifications\n1.4 Provided tools with safety devices\n2. Resource Implications\n\nThe following resources should be provided:\n2.1 Workplace location\n2.2 Materials relevant to the unit of competency\n2.3 Plans, drawings and specifications relevant to the activities\n3. Methods of\nAssessment\n\nCompetency in this unit may be assessed through:\n3.1 Direct observation/Demonstration with oral questioning\n4. Context of\nAssessment\n\n4.1 Competency may be assessed in actual workplace or at the\ndesignated TESDA Accredited Assessment Center\n\n--- PDF PAGE 43 ---\nHEAVY EQUIPMENT OPERATION (Forklift) NC II Revision 01 Promulgated (11/07/2019)\n\n38\n\nUNIT OF COMPETENCY\n:\nOBSERVE PROCEDURES, SPECIFICATIONS\nAND MANUALS OF INSTRUCTIONS\n\nUNIT CODE\n\n:"
