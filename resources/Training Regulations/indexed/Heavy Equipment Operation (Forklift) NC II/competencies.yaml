riables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1. Travel the forklift\n\n1.1 Road conditions are\nconsidered before\ntravelling the forklift.\n1.2 Work area is surveyed\nfor potential hazards\nin accordance with safe\noperating procedures.\n1.3 Travel speed and\nposition of forklift are\nobserved in\naccordance with\n manufacturer’s manual\nand/or company rules\nand regulations\n1.4 Unexpected situations\nare responded in\n line with company rules\nand regulations.\n1.5 Personal Protective\n Equipment (PPE) is\n used in accordance\n with Rule 1080 of\n Occupational Safety\n and Health Standards\n1.1 DOLE\nDepartment\nOrder No. 13 s.\n1998 Guidelines\nGoverning\nOccupational\nSafety and\nHealth in the\nConstruction\nIndustry\n1.2 Company rules\nand regulations\n1.3 Site and weather\nconditions\n1.4 Road worthiness\n1.5 Clearance and\ndistances\n1.6 Speed limit\n1.7 Procedures in\ntravelling and\npositioning of\nforklift\n1.8 Factors affecting\nproductivity\n1.9 Productivity work\nmeasurements\n1.10 Ways of\nimproving\nproductivity\n\n1.1 Following\ncompany rules\nand regulations\n1.2 Driving skills\n1.3 Travelling the\nforklift\n1.4 Using PPE\n1.5 Applying\nproductive\nmethods and\ntechniques\n\n--- PDF PAGE 73 ---\nHEAVY EQUIPMENT OPERATION (Forklift) NC II Revision 01 Promulgated (11/07/2019)\n\n68\n\nELEMENT\nPERFORMANCE\nCRITERIA\nBold and Italicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n2. Load and unload\nforklift to low-bed\ntrailer/truck\n2.1 Low-bed trailer /truck for\ntransporting the forklift\nis selected according to\njob requirements.\n2.2 Lifting attachments are\npositioned and secured\nbased on\nmanufacturer’s manual.\n2.3 Verbal instructions and\nsignals are conveyed\nwith authorized spotter\nduring loading and\nunloading as per\nstandard operating\nprocedures.\n2.4 All safety locks and\ncontrol levers are\nsecured at neutral\nposition before and after\nloading based on\nmanufacturer's\nspecifications.\n2.5 Personal Protective\nEquipment (PPE) is\nused in accordance with\nRule 1080 of\nOccupational Safety\nand Health Standards\n\n2.1 DOLE\nDepartment\nOrder No. 13 s.\n1998 Guidelines\nGoverning\nOccupational\nSafety and Health\nin the\nConstruction\nIndustry\n2.2 Hand signals\n2.3 Site and weather\nconditions\n2.4 Clearance and\ndistances\n2.5 Speed limit\n2.6 Procedures in\nloading and\nunloading\n2.7 Factors affecting\nproductivity\n2.8 Productivity work\nmeasurements\n2.9 Ways of improving\nproductivity\n\n2.1 Following verbal\ninstructions and\nsignals\n2.2 Operating skills in\nloading and\nunloading forklift to\nlow-bed\ntrailer/truck\n2.3 Using PPE\n2.4 Applying\nproductive\nmethods and\ntechniques\n\n--- PDF PAGE 74 ---\nHEAVY EQUIPMENT OPERATION (Forklift) NC II Revision 01 Promulgated (11/07/2019)\n\n69\n\nELEMENT\nPERFORMANCE\nCRITERIA\nBold and Italicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n3. Interpret load chart\n\n3.1 Weight of the load is\ndetermined according\nto load information\n3.2 Lifting capacity is\ndetermined according to\nmanufacturer’s\nspecifications\n3.3 Lifting capacity in the\nload chart is followed\naccording to\nmanufacturer’s\nspecifications\n3.4 Loads are calculated\nbased on load center\n3.6 Personal Protective\nEquipment (PPE) is\nused in accordance with\nRule 1080 of\nOccupational Safety\nand Health Standards\n\n3.1 DOLE\nDepartment\nOrder No. 13 s.\n1998 Guidelines\nGoverning\nOccupational\nSafety and Health\nin the\nConstruction\nIndustry\n3.2 Conversion of\nunits\n3.3 Forklift capacity\nbased on load\nchart\n3.4 Procedures in\ninterpreting load\nchart.\n3.5 Factors affecting\nproductivity\n3.6 Productivity work\nmeasurements\n3.7 Ways of improving\nproductivity\n\n3.1 Interpreting load\nchart\n3.2 Calculating load\ncapacity\n3.3 Using PPE\n3.4 Applying\nproductive\nmethods and\ntechniques\n\n--- PDF PAGE 75 ---\nHEAVY EQUIPMENT OPERATION (Forklift) NC II Revision 01 Promulgated (11/07/2019)\n\n70\n\nELEMENT\nPERFORMANCE\nCRITERIA\nBold and Italicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n4. Perform lifting and\nhandling of load\n\n4.1 Site and weather\nconditions are\nconsidered before lifting\nand handling of load\n4.2 Safe work procedures\nand practices are\n observed during\nhandling and lifting\noperation based on\nOSH standards and\nmanufacturer’s manual\n4.3 Optimum speed during\ntravel, lifting and tilting\noperation is controlled\nbased on\nmanufacturer’s manual\n4.4 Loads are handled in\naccordance with cargo\ncontents within\nrequired capacity\n4.5 Communication with\nspotter is established\nand maintained during\ntraveling and lifting of\nloads based on\ncompany rules and\nregulations\n4.6 Unexpected situations\nare responded in line\n with company rules and\n regulations\n4.7 Personal Protective\nEquipment (PPE) is\nused in accordance\nwith Rule 1080 of\nOccupational Safety\nand Health Standards\n\n4.1 DOLE\nDepartment\nOrder No. 13 s.\n1998 Guidelines\nGoverning\nOccupational\nSafety and\nHealth in the\nConstruction\nIndustry\n4.2 Signs and\nsymbols\n4.3 Cargo\nclassification,\nweight and\nsegregation\n4.4 Company rules\nand regulations\n4.5 Manufacturer’s\nmanual\n4.6 Site and\nweather\nconditions\n4.7 Conversion of\nunits\n4.8 Forklift capacity\nbased on load\nchart\n4.9 Clearance and\ndistances\n4.10 Safety devices\n4.11 Procedures in\ntravelling and\nhandling of load\n4.12 Factors affecting\nproductivity\n4.13 Productivity work\nmeasurements\n4.14 Ways of\nimproving\nproductivity\n\n4.1 Performing\nhandling and\nlifting of load\n4.2 Interpreting sign\nand symbols\n4.3 Identifying safe\nconditions\n4.4 Following\ncompany rules\nand regulations\n4.5 Identifying cargo\nweight and\nsegregation\n4.6 Interpreting\nmanufacturer’s\nmanual\n4.7 Using PPE\n4.8 Applying\nproductive\nmethods and\ntechniques\n\n--- PDF PAGE 76 ---\nHEAVY EQUIPMENT OPERATION (Forklift) NC II Revision 01 Promulgated (11/07/2019)\n\n71\n RANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Potential hazards\n\nMay include:\n1.1 Other equipment\n1.2 Building\n1.3 Deep excavation\n1.4 Sloping ground\n1.5 Uneven terrain\n1.6 Overhead “live” electrical wires\n1.7 Underground utilities\n1.8 Unstable ground\n2. Unexpected\nsituations\nMay include:\n2.1 Sudden engine breakdown\n2.2 Busted hydraulic hose and oil leakages\n2.3 Broken lifting chain\n2.4 Sudden loss of brake\n2.5 Hitting high tension wire\n2.6 Loss control of steering\n2.7 Sudden ground failure\n2.8 Force majeure e.g., earthquake, tornado, typhoon\n2.9 Operator fatigue or sickness/condition\n2.10 Accidents/incidents\n3. Load information\nMay include:\n3.1 Bill of ladings\n3.2 Packing and shipping list\n3.3 Delivery receipt\n3.4 Dimension\n\n--- PDF PAGE 77 ---\nHEAVY EQUIPMENT OPERATION (Forklift) NC II Revision 01 Promulgated (11/07/2019)\n\n72\n\nVARIABLE\nRANGE\n4. Loads\nMay include:\n4.1 Bulk cargo\n4.2 Palletized cargo\n4.3 Containerized\n4.4 Specialized cargo\n5. Safe work\nprocedures and\npractices\nMay include:\n5.1 Lifting Plan\n5.2 Load chart\n5.3 Work area\n5.4 Storage\n5.5 Communication\n5.6 Risk management control\n6. Cargo content\nMay include:\n6.1 Signs and symbols (e.g. fragile, this side up, etc.)\n6.2 Stacking level\n6.3 Stacking positions/directions\n6.4 Poisonous substance\n6.5 Flammable/explosives\n6.6 Weather classification\n\n--- PDF PAGE 78 ---\nHEAVY EQUIPMENT OPERATION (Forklift) NC II Revision 01 Promulgated (11/07/2019)\n\n73\nEVIDENCE GUIDE\n\n1. Critical aspects\nof competency\n\nAssessment requires evidence that the candidate:\n1.1 Travelled the forklift\n1.2 Load and unload forklift to low-bed trailer/truck\n1.3 Interpreted load chart\n1.4 Performed lifting and handling of load\n1.5 Observed safety measures applicable to worksite operation\n1.6 Communicated effectively with others to ensure effective work\noperation\n2. Resource\nimplications\n\nThe following resources should be provided:\n2.1 Access to Forklift and job site/terrain\n2.2 Available loads\n2.3 Barricades and informative signages\n2.4 PPE\n3. Method of\nassessment\n\nCompetency in this unit may be assessed through:\n3.1 Written Examination\n3.2 Direct observation / Demonstration with Oral Questioning\n4. Context for\nassessment\n4.1 Competency may be assessed in actual workplace or at the\ndesignated TESDA Accredited Assessment Center\n\n--- PDF PAGE 79 ---\nHEAVY EQUIPMENT OPERATION (Forklift) NC II Revision 01 Promulgated (11/07/2019)\n\n74"
