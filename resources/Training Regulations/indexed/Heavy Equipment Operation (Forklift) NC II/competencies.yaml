QUIRED SKILLS\n1. Perform visual check\n\n1.1 Capacity of forklift is\nselected based on job\nrequirements.\n1.2 Operator-serviceable\n(OS) parts are\nchecked in accordance\nwith equipment\nchecklist and\nmanufacturer’s\nprocedures.\n1.3 Inspection of\nequipment is performed\nwith checklist while\npower is stopped/not\nrunning\n1.4 Personal Protective\nEquipment (PPE) is\nused in accordance\nwith Rule 1080 of\nOccupational Safety\nand Health Standards.\n1.5 Required output is\ncompleted based on\naccomplished checklist\n1.1 DOLE\nDepartment Order\nNo. 13 s. 1998\nGuidelines\nGoverning\nOccupational\nSafety and Health\nin the\nConstruction\nIndustry\n1.2 Procedures in\nconducting visual\nand walk-around\ncheck\n1.3 Computation of\nload versus\ncapacity of forklift\n1.4 Functions of parts\nand components\nof forklift\n1.5 Factors affecting\nproductivity\n1.6 Productivity work\nmeasurements\n1.7 Ways of\nimproving\nproductivity\n\n1.1 Performing visual\nand walk-around\nchecking\nprocedures\n1.2 Calculating load\nand capacity of\nforklift\n1.3 Identifying parts\nand components\nof forklift and its\nfunctions\n1.4 Accomplishing\nchecklist\n1.5 Applying\nproductive\nmethods and\ntechniques\n1.6 Using PPE\n\n--- PDF PAGE 59 ---\nHEAVY EQUIPMENT OPERATION (Forklift) NC II Revision 01 Promulgated (11/07/2019)\n\n54\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are elaborated\nin the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n2. Perform\nwalk-around\ncheck\n\n2.1 “BLOWAF” check is\nperformed using\nchecklist while engine\nis stopped/not running.\n2.2 Battery-operated type\nis checked in\naccordance with\nmanufacturer’s manual\n2.3 Fluid levels are\nmaintained in\naccordance with\nequipment\nmanufacturer’s manual.\n2.4 Abnormal conditions\nare noted in checklist\nand reported to\nauthorized person.\n2.5 Personal Protective\nEquipment (PPE) is\nused in accordance\nwith Rule 1080 of\nOccupational Safety\nand Health Standards\n2.6 Required output is\ncomple