            Revision 01        Promulgated (11/07/2019) \n \n5 \nRANGE OF VARIABLES \n \nVARIABLES \nRANGE \n1. Appropriate \nsources \nMay include: \n1.1. \nTeam members \n1.2. \nSupervisor/Department Head \n1.3. \nSuppliers \n1.4. \nTrade personnel \n1.5. \nLocal government \n1.6. \nIndustry bodies \n2. Medium \nMay include: \n2.1. \nMemorandum \n2.2. \nCircular \n2.3. \nNotice \n2.4. \nInformation dissemination \n2.5. \nFollow-up or verbal instructions \n2.6. \nFace-to-face communication \n2.7. \nElectronic media (disk files, cyberspace) \n3. Storage \nMay include: \n3.1. \nManual filing system \n3.2. \nComputer-based filing system \n4. Workplace \ninteractions \nMay include: \n4.1. \nFace-to-face \n4.2. \nTelephone \n4.3. \nElectronic and two-way radio \n4.4. \nWritten including electronic means, memos, instruction and \nforms \n4.5. \nNon-verbal including gestures, signals, signs and diagrams \n5. Forms \nMay include: \n5.1. \nHR/Personnel forms, telephone message forms, safety \nreports\n\n--- PDF PAGE 11 ---\nHEAVY EQUIPMENT OPERATION (Forklift) NC II                         Revision 01        Promulgated (11/07/2019) \n \n6 \nEVIDENCE GUIDE \n \n1. Critical aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1. Prepared written communication following standard \nformat of the organization \n1.2. Accessed information using workplace communication \nequipment/systems \n1.3. Made use of relevant terms as an aid to transfer \ninformation effectively \n1.4. Conveyed information effectively adopting formal or \ninformal communication \n2. Resource \nImplications \nThe following resources should be provided: \n2.1. Fax machine \n2.2. Telephone \n2.3. Notebook \n2.4. Writing materials \n2.5. Computer with Internet connection \n3. Methods of \nAssessment \nCompetency in this unit may be assessed through: \n3.1. Demonstration with oral questioning  \n3.2. Interview  \n3.3. Written test \n3.4. Third-party report \n \n4. Context for \nAssessment \n4.1. Competency may be assessed individually in the \nactual workplace or through an accredited institution\n",
