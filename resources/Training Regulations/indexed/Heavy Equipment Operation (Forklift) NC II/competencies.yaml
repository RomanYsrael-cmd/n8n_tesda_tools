ble \nimprovement. \n2.1 Business \nmathematics and \nstatistics \n2.2 Data analysis \ntechniques/ \nprocedures \n2.3 Reporting \nrequirements to a \nrange of audiences \n2.4 Legislation, policy \nand procedures \nrelating to the \nconduct of \nevaluations \n2.5 Organisational \nvalues, ethics and \ncodes of conduct \n2.1 Computing \nbusiness \nmathematics and \nstatistics \n2.2 Describing data \nanalysis \ntechniques/ \nprocedures \n2.3 Reporting \nrequirements to a \nrange of \naudiences \n2.4 Stating legislation, \npolicy and \nprocedures \nrelating to the \nconduct of\n\n--- PDF PAGE 28 ---\nHEAVY EQUIPMENT OPERATION (Forklift) NC II                         Revision 01        Promulgated (11/07/2019) \n \n23 \n \n \nELEMENTS \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \n \nREQUIRED \nKNOWLEDGE \n \nREQUIRED \nSKILLS \n \n \nevaluations \n2.5 Stating \norganisational \nvalues, ethics and \ncodes of conduct \n \n3. Record and \npresent \ninformation  \n3.1 Studied \ndata/information are \nrecorded. \n3.2 Recommendations \nare analysed for \naction to ensure they \nare compatible with \nthe project’s scope \nand terms of \nreference. \n3.3 Interim and final \nreports are analysed \nand outcomes are \ncompared to the \ncriteria established at \nthe outset. \n3.4 Findings are \npresented to \nstakeholders. \n \n3.1 Data analysis \ntechniques/ \nprocedures \n3.2 Reporting \nrequirements to a \nrange of audiences \n3.3 Legislation, policy \nand procedures \nrelating to the \nconduct of \nevaluations \n3.4 Organisational \nvalues, ethics and \ncodes of conduct \n \n3.1 Describing data \nanalysis \ntechniques/ \nprocedures \n3.2 Reporting \nrequirements to a \nrange of \naudiences \n3.3 Stating legislation, \npolicy and \nprocedures \nrelating to the \nconduct of \nevaluations \n3.4 Stating \norganisational \nvalues, ethics and \ncodes of conduct \npractices\n\n--- PDF PAGE 29 ---\nHEAVY EQUIPMENT OPERATION (Forklift) NC II   