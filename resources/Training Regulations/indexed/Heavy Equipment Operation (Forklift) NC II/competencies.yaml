        "evidence_guide": {
          "source_text": "1. Critical aspects\nof competency\n\nAssessment requires evidence that the candidate:\n1.1 Performed visual check\n1.2 Performed walk-around check\n1.3 Performed visual check for lifting attachments and power train\n1.4 Performed operation check\n1.5 Performed post-operation procedures\n1.6 Observed safety measures applicable to worksite operation\n1.7 Communicated effectively with others to ensure effective work\noperation\n2. Resource\nimplications\n\nThe following resources should be provided:\n2.1 Work area for forklift operation\n2.2 Access to forklift and manuals\n2.3 Basic hand tools and portable powered tools\n2.4 PPE\n2.5 Safety signage/barricades\n3. Method of\nassessment\n\nCompetency in this unit may be assessed through:\n3.1 Written Examination\n3.2 Direct observation /Demonstration with Oral Questioning\n4. Context for\nassessment\n4.1 Competency may be assessed in actual workplace or at the\ndesignated TESDA Accredited Assessment Center\n\n--- PDF PAGE 65 ---\nHEAVY EQUIPMENT OPERATION (Forklift) NC II Revision 01 Promulgated (11/07/2019)\n\n60\nUNIT OF COMPETENCY\n:\nPERFORM BASIC PREVENTIVE MAINTENANCE\nSERVICING FOR FORKLIFT\n\nUNIT CODE\n\n:"
        },
        "source_text": "CON834216\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes in\nperforming visual and operation check before and after\nproductive operation of forklift.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are elaborated\nin the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1. Perform visual check\n\n1.1 Capacity of forklift is\nselected based on job\nrequirements.\n1.2 Operator-serviceable\n(OS) parts are\nchecked in accordance\nwith equipment\nchecklist and\nmanufacturer’s\nprocedures.\n1.3 Inspection of\nequipment is performed\nwith checklist while\npower is stopped/not\nrunning\n1.4 Personal Protective\nEquipment (PPE) is\nused in accordance\nwith Rule 1080 of\nOccupational Safety\nand Health Standards.\n1.5 Required output is\ncompleted based on\naccomplished checklist\n1.1 DOLE\nDepartment Order\nNo. 13 s. 1998\nGuidelines\nGoverning\nOccupational\nSafety and Health\nin the\nConstruction\nIndustry\n1.2 Procedures in\nconducting visual\nand walk-around\ncheck\n1.3 Computation of\nload versus\ncapacity of forklift\n1.4 Functions of parts\nand components\nof forklift\n1.5 Factors affecting\nproductivity\n1.6 Productivity work\nmeasurements\n1.7 Ways of\nimproving\nproductivity\n\n1.1 Performing visual\nand walk-around\nchecking\nprocedures\n1.2 Calculating load\nand capacity of\nforklift\n1.3 Identifying parts\nand components\nof forklift and its\nfunctions\n1.4 Accomplishing\nchecklist\n1.5 Applying\nproductive\nmethods and\ntechniques\n1.6 Using PPE\n\n--- PDF PAGE 59 ---\nHEAVY EQUIPMENT OPERATION (Forklift) NC II Revision 01 Promulgated (11/07/2019)\n\n54\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are elaborated\nin the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n2. Perform\nwalk-around\ncheck\n\n2.1 “BLOWAF” check is\nperformed using\nchecklist while engine\nis stopped/not running.\n2.2 Battery-operated type\nis checked in\naccordance with\nmanufacturer’s manual\n2.3 Fluid levels are\nmaintained in\naccordance with\nequipment\nmanufacturer’s manual.\n2.4 Abnormal conditions\nare noted in checklist\nand reported to\nauthorized person.\n2.5 Personal Protective\nEquipment (PPE) is\nused in accordance\nwith Rule 1080 of\nOccupational Safety\nand Health Standards\n2.6 Required output is\ncompleted based on\naccomplished checklist\n2.1 Procedures in\nperforming\n“BLOWAF” check\n2.2 Procedures in\nchecking battery-\noperated type\n2.3 DOLE Department\nOrder No. 13 s. 1998\nGuidelines Governing\nOccupational Safety\nand Health in the\nConstruction Industry\n2.4 Waste disposal\nprocedures\n2.5 Fluid’s level and\ncontamination\n2.6 Factors affecting\nproductivity\n2.7 Productivity work\nmeasurements\n2.8 Ways of improving\nproductivity\n\n2.1 Accomplishing\n checklist\n2.2 Applying waste\ndisposal\nprocedures\n2.3 Performing\n“BLOWAF”\nchecking\nprocedures\n2.4 Performing\nbattery-operated\ntype checking\nprocedures\n2.5 Determining fluid\nlevel and\ncontamination\n2.6 Using PPE\n2.7 Applying\nproductive\nmethods and\ntechniques\n3 Perform visual\ncheck for lifting\nattachments and\npower train\n3.1 Lifting attachments\nand power train\ncomponents are\nchecked in accordance\nwith checklist and\nmanufacturer’s\nprocedures\n3.2 Abnormal conditions are\nnoted in checklist and\nreported to authorized\nperson\n3.3 Personal Protective\nEquipment (PPE) is\nused in accordance with\nRule 1080 of\nOccupational Safety\nand Health Standards\n3.4 Required output is\ncompleted based on\naccomplished checklist\n\n3.1 Procedures in visual\ncheck for lifting\nattachments and\npower train\ncomponents\n3.2 DOLE Department\nOrder No. 13 s. 1998\nGuidelines Governing\nOccupational Safety\nand Health in the\nConstruction Industry\n3.3 Functions of lifting\nattachments and\npower train\ncomponents\n3.4 Factors affecting\nproductivity\n3.5 Productivity work\nmeasurements\n3.6 Ways of improving\nproductivity\n3.1 Accomplishing\nchecklist\n3.2 Performing visual\ncheck for lifting\nattachments and\npower train\ncomponents\n3.3 Identifying lifting\nattachments and\npower train\ncomponents and\nits functions\n3.4 Using PPE\n3.5 Applying\nproductive\nmethods and\ntechniques\n\n--- PDF PAGE 60 ---\nHEAVY EQUIPMENT OPERATION (Forklift) NC II Revision 01 Promulgated (11/07/2019)\n\n55\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n4 Perform\noperation check\n\n4.1 Starting/running\ncheck/operation check is\nperformed with checklist and in\naccordance with manufacturer’s\nrecommendations.\n4.2 Electrical motor is checked for\nnormal functioning based on\nmanufacturer's specifications.\n4.3 Safety devices are checked for\nproper functions in accordance\nwith safe operating procedures.\n4.4 Personal Protective Equipment\n(PPE) is used in accordance with\nRule 1080 of Occupational Safety\nand Health Standards\n4.5 Required output is completed\nbased on accomplished checklist\n4.1 Start-up and\nwarming\nprocedures\n4.2 Procedures in\nOperation check\n4.3 DOLE\nDepartment Order\nNo. 13 s. 1998\nGuidelines\nGoverning\nOccupational\nSafety and Health\nin the\nConstruction\nIndustry\n4.4 Warning signs\nand symbols\n4.5 Functions of all\ncomponents and\nsafety devices\n4.6 Factors affecting\nproductivity\n4.7 Productivity work\nmeasurements\n4.8 Ways of\nimproving\nproductivity\n\n4.1 Performing\nprocedures in\noperation check\n4.2 Accomplishing\nchecklist\n4.3 Applying\nproductive\nmethods and\ntechniques\n4.4 Using PPE\n\n5 Perform post-\noperation\nprocedures\n5.1 Forklift is parked and turned off\nafter productive operation in\naccordance to manufacturer’s\nmanual.\n5.2 Controls are set into neutral\nposition and parking brakes are\nengaged in accordance to\nmanufacturer’s manual.\n5.3 Safety locks are all engaged in\naccordance with manufacturer’s\nmanual.\n5.4 Walk-around inspection check is\nre-conducted after operation\n5.5 Daily equipment time record/report\n(DETR) is accomplished/submitted\naccording to company rules and\nregulations\n5.6 Personal Protective Equipment\n(PPE) is used in accordance with\nRule 1080 of Occupational Safety\nand Health Standard\n5.1 Company rules\nand regulations\n5.2 Parking and shut-\ndown procedures\n5.3 DOLE Department\nOrder No. 13 s.\n1998 Guidelines\nGoverning\nOccupational\nSafety and Health\nin the Construction\nIndustry\n5.4 Factors affecting\nproductivity\n5.5 Productivity work\nmeasurements\n5.6 Ways of improving\nproductivity\n\n5.1 Following rules\nand regulations in\nparking and\nshutting down\nForklift\n5.2 Performing post-\noperation\nprocedures\n5.3 Accomplishing\nDETR\n5.4 Applying\nproductive\nmethods and\ntechniques\n5.5 Using PPE\n\n--- PDF PAGE 61 ---\nHEAVY EQUIPMENT OPERATION (Forklift) NC II Revision 01 Promulgated (11/07/2019)\n\n56\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Capacity of\nForklift\nMay include:\n1.1 0.5 – 1.0 ton\n1.2 2.0 - 10 tons\n1.3 11 tons and above\n2. Operator\nserviceable parts\n(OS)\n\nMay include:\n2.1 Air cleaner\n2.2 Battery terminals/connection/clamp/case\n2.3 Fan belt\n2.4 Grease/lube points\n2.5 Fuel water separator/radiator\n2.6 Tire inflation\n2.7 Fuel tank\n2.8 Hydraulic oil filters\n2.9 Engine oil fan\n2.10 Lights\n2.11 Steering/suspension\n3. Inspection of\nequipment\n\nMay include:\n3.1\nPower off\n3.1.1 Leaks\n3.1.2 Worn out/damaged parts\n3.1.3 Fluid levels\n 3.1.4 Loose parts and accessories (nuts/bolts/belts)\n 3.1.5 Missing parts and accessories\n 3.1.6 Mast\n 3.1.7 Fork\n 3.1.8 Chain\n 3.1.9 Fork carrier\n 3.1.10 Hydraulic Cylinder (Lift and Tilt)\n 3.1.11 Levers and controls\n 3.1.12 Counter weight\n 3.1.13 Rim, tires and stud bolts\n\n--- PDF PAGE 62 ---\nHEAVY EQUIPMENT OPERATION (Forklift) NC II Revision 01 Promulgated (11/07/2019)\n\n57\n\nVARIABLE\nRANGE\n\n3.2 Power on\n3.2.1 Gauges\n3.2.2 Lever and controls\n3.2.3 Safety devices\n3.2.3 Oil leaks\n3.2.4 Pedals\n3.2.5 Brakes\n3.2.6 Steering\n 3.2.7 Electrical system\n4. Personal\nProtective\nEquipment\n(PPE)\nMay include:\n4.1 Hard hat\n4.2 Goggles\n4.3 Gloves\n4.4 Safety shoes\n4.5 Safety vest\n5. B L O W A F\ncheck\n\nMay include:\n5.1 Battery (starting and charging system)\n5.2 Light (lighting system)\n5.3 Oil (lubricating system)\n5.4 Water (cooling system)\n5.5 Air (intake and exhaust system)\n5.6 Fuel (diesel, gas, LPG)\n6. Fluid\nMay include:\n6.1 Engine oil\n6.2 Hydraulic oil\n6.3 Radiator coolant/radiator\n6.4 Battery electrolyte/distilled water\n6.5 Brake/clutch fluid\n6.6 Transmission/Gear oil\n6.7 Steering oil\n6.8 Torque converter oil\n6.9 Automatic transmission fluid\n7. Authorized\nperson\nMay include:\n7.1 Equipment Supervisor\n7.2 Equipment Dispatcher/Foreman\n7.3 Equipment Maintenance personnel\nVARIABLE\nRANGE\n8. Lifting\nattachments and\npower train\ncomponents\nMay include:\n8.1 Lifting attachments\n8.1.1 Mast\n8.1.2 Fork carrier\n8.1.3 Fork\n8.1.4 Lift chain\n8.1.5 Hydraulic cylinder\n8.2 Power train\n8.2.1 Clutch and torque converter\n 8.2.2 Transmission\n 8.2.3 Differential\n 8.2.4 Tires/ Stud and Bolts\n\n--- PDF PAGE 63 ---\nHEAVY EQUIPMENT OPERATION (Forklift) NC II Revision 01 Promulgated (11/07/2019)\n\n58\n9. Starting/running\ncheck/operation\ncheck\n\nMay include:\n9.1 Controls\n10.1.1 Travel\n10.1.2 Steering\n10.1.3 Brake\n10.1.4 Tilt\n10.1.5 Lift\n10.1.6 Side shift\n9.2 Gauges\n 10.2.1 Hour meter\n 10.2.2 Battery charging\n 10.2.3 Pressure (oil and air)\n 10.2.4 Temperature (oil and water)\n 10.2.5 RPM (Tachometer)\n 10.2.6 Fuel indicator\n 10.2.7 Speedometer\n 10.2.8 Hydraulic pressure\n9.3 Leaks in\n 10.3.1 Fuel\n 10.3.2 Oil\n 10.3.3 Water\n9.4 Electrical/switches\n 10.4.1 Lights\n 10.4.2 Horns\n 10.4.3 Wiper\n 10.4.4 Beacon\n\n10. Electrical motor\nMay include:\n10.1 Travel motor\n10.2 Steering motor\n10.3 Hydraulic pump motor\n\n11. Safety devices\nMay include:\n11.1 Back horn/warning horn\n11.2 Signal/stop light\n11.3 Blinkers\n11.4 Seat belt\n11.5 Parking brake\n11.6 Overhead guard protector\n11.7 Fork lock\n\n--- PDF PAGE 64 ---\nHEAVY EQUIPMENT OPERATION (Forklift) NC II Revision 01 Promulgated (11/07/2019)\n\n59\nEVIDENCE GUIDE\n\n1. Critical aspects\nof competency\n\nAssessment requires evidence that the candidate:\n1.1 Performed visual check\n1.2 Performed walk-around check\n1.3 Performed visual check for lifting attachments and power train\n1.4 Performed operation check\n1.5 Performed post-operation procedures\n1.6 Observed safety measures applicable to worksite operation\n1.7 Communicated effectively with others to ensure effective work\noperation\n2. Resource\nimplications\n\nThe following resources should be provided:\n2.1 Work area for forklift operation\n2.2 Access to forklift and manuals\n2.3 Basic hand tools and portable powered tools\n2.4 PPE\n2.5 Safety signage/barricades\n3. Method of\nassessment\n\nCompetency in this unit may be assessed through:\n3.1 Written Examination\n3.2 Direct observation /Demonstration with Oral Questioning\n4. Context for\nassessment\n4.1 Competency may be assessed in actual workplace or at the\ndesignated TESDA Accredited Assessment Center\n\n--- PDF PAGE 65 ---\nHEAVY EQUIPMENT OPERATION (Forklift) NC II Revision 01 Promulgated (11/07/2019)\n\n60\nUNIT OF COMPETENCY\n:\nPERFORM BASIC PREVENTIVE MAINTENANCE\nSERVICING FOR FORKLIFT\n\nUNIT CODE\n\n:"
