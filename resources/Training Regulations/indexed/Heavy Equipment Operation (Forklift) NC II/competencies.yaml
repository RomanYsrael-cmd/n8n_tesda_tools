changes \nand responsibility. \n2.4 Seven habits of \nhighly effective \npeople. \n \n2.1 Identifying \nopportunities to \nimprove and to do \nthings better. \nInvolvement. \n2.2 Identifying the \npositive impacts \nand the challenges \nof change and \ninnovation. \n2.3 Providing examples \nof the types of \nchanges that are \nwithin and outside \nown scope of \nresponsibility \n2.4 Communicating \nideas for change \nthrough small \ngroup discussions \nand meetings.\n\n--- PDF PAGE 24 ---\nHEAVY EQUIPMENT OPERATION (Forklift) NC II                         Revision 01        Promulgated (11/07/2019) \n \n19 \n \n \n \nELEMENTS \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \n \nREQUIRED \nKNOWLEDGE \n \nREQUIRED \nSKILLS \n3. Integrate \nideas for \nchange in \nthe \nworkplace. \n3.1 Critical inquiry \nmethod is used to \nintegrate different \nideas for change \nof key people. \n3.2 Summarizing, \nanalyzing and \ngeneralizing skills \nare used to extract \nsalient points in \nthe pool of ideas. \n3.3 Reporting skills \nare likewise used \nto communicate \nresults. \n3.4 Current Issues \nand concerns on \nthe systems, \nprocesses and \nprocedures, as \nwell as the need \nfor simple \ninnovative \npractices are \nidentified. \n3.1 Roles of individuals \nin suggesting and \nmaking \nimprovements. \n3.2 Positive impacts \nand challenges in \ninnovation. \n3.3 Types of changes \nand responsibility. \n3.4 Seven habits of \nhighly effective \npeople. \n3.5 Basic research \nskills. \n3.1 Identifying \nopportunities to \nimprove and to do \nthings better. \nInvolvement. \n3.2 Identifying the \npositive impacts \nand the challenges \nof change and \ninnovation. \n3.3 Providing examples \nof the types of \nchanges that are \nwithin and outside \nown scope of \nresponsibility. \n3.4 Communicating \nideas for change \nthrough small \ngroup discussions \nand meetings. \n3.5 Demonstrating \nskills in analysis \nand interpretation \nof data.\n\n--- PDF PAGE 25 ---\nHEAVY EQUIPMENT OPERATION (Forklift) NC II                         Revision 01        Promulgated (11/07/2019) \n \n20 \nRANGE OF VARIABLES \n \nVARIABLES \nRANGE \n1. Opportunities for \nimprovement \nMay include: \n1.1 Systems. \n1.2 Processes. \n1.3 Procedures. \n1.4 Protocols. \n1.5 Codes. \n1.6 Practices. \n2. Information  \nMay include: \n2.1 Workplace communication problems. \n2.2 Performance evaluation results. \n2.3 Team dynamics issues and concerns. \n2.4 Challenges on return of investment \n2.5 New tools, processes and procedures. \n2.6 New people in the organization. \n3. People who could provide \ninput \nMay include: \n3.1 Leaders. \n3.2 Managers. \n3.3 Specialists. \n3.4 Associates. \n3.5 Researchers. \n3.6 Supervisors. \n3.7 Staff. \n3.8 Consultants (external) \n3.9 People outside the organization in the same field or \nsimilar expertise/industry. \n3.10 Clients \n4. Critical inquiry method \nMay include: \n4.1 \nPreparation. \n4.2 \nDiscussion. \n4.3 \nClarification of goals. \n4.4 \nNegotiate towards a Win-Win outcome. \n4.5 \nAgreement. \n4.6 \nImplementation of a course of action. \n4.7 \nEffective verbal communication. See our pages: \nVerbal Communication and Effective Speaking. \n4.8 \nListening. \n4.9 \nReducing misunderstandings is a key part of \neffective negotiation. \n4.10 Rapport Building. \n4.11 Problem Solving. \n4.12 Decision Making. \n4.13 Assertiveness. \n4.14 Dealing with Difficult Situations. \n5. Reporting skills \nMay include: \n5.1 Data management. \n5.2 Coding. \n5.3 Data analysis and interpretation. \n5.4 Coherent writing. \n5.5 Speaking.\n\n--- PDF PAGE 26 ---\nHEAVY EQUIPMENT OPERATION (Forklift) NC II                         Revision 01        Promulgated (11/07/2019) \n \n21 \nEVIDENCE GUIDE \n \n1.   Critical aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 Identified opportunities to do things better. \n1.2 Discussed and developed ideas with others on how to \ncontribute to workplace innovation. \n1.3 Integrated ideas for change in the workplace. \n1.4 Analyzed and reported rooms for innovation and learning \nin the workplace. \n2.   Resource \nImplications \nThe following resources should be provided: \n2.1 Pens, papers and writing implements. \n2.2 Cartolina. \n2.3 Manila papers. \n3.   Methods of \nAssessment \nCompetency in this unit may be assessed through: \n3.1 Psychological and behavioral Interviews. \n3.2 Performance Evaluation. \n3.3 Life Narrative Inquiry. \n3.4 Review of portfolios of evidence and third-party workplace \nreports of on-the-job performance. \n3.5 Sensitivity analysis. \n3.6 Organizational analysis. \n3.7 Standardized assessment of character strengths and \nvirtues applied. \n4.   Context for \nAssessment \n4.1   Competency may be assessed individually in the actual \nworkplace or simulation environment in TESDA accredited \ninstitutions.\n",
