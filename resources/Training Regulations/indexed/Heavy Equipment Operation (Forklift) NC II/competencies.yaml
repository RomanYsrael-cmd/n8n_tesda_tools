        "source_text": "400311218\n\nUNIT DESCRIPTOR\n: This unit covers the outcomes required to apply\nentrepreneurial workplace best practices and implement\ncost-effective operations\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Apply\n entrepreneurial\n workplace best\n practices\n\n1.1 Good practices\nrelating to workplace\noperations are\nobserved and\nselected following\nworkplace policy.\n1.2 Quality procedures\nand practices are\ncomplied with\naccording to\nworkplace\nrequirements.\n1.3 Cost-conscious\nhabits in resource\nutilization are\napplied based on\nindustry standards.\n1.1 Workplace best\npractices, policies\nand criteria\n1.2 Resource utilization\n1.3Ways in fostering\nentrepreneurial\nattitudes:\n•\nPatience\n•\nHonesty\n•\nQuality-\nconsciousness\n•\nSafety-\nconsciousness\n•\nResourcefulness\n\n1.1 Communication\nskills\n1.2 Complying with\nquality procedures\n\n2. Communicate\nentrepreneurial\nworkplace best\npractices\n\n2.1 Observed good\npractices relating to\nworkplace\noperations are\ncommunicated to\nappropriate\nperson.\n2.2 Observed quality\nprocedures and\npractices are\ncommunicated to\nappropriate person\n2.3 Cost-conscious\nhabits in resource\nutilization are\ncommunicated\nbased on industry\nstandards.\n\n2.1 Workplace best\npractices, policies\nand criteria\n2.2 Resource utilization\n2.3 Ways in fostering\nentrepreneurial\nattitudes:\n•\nPatience\n•\nHonesty\n•\nQuality-\nconsciousness\n•\nSafety-\nconsciousness\n•\nResourcefulness\n\n2.1 Communication skills\n2.2 Complying with\nquality procedures\n2.3 Following\nworkplace\ncommunication\nprotocol\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n\n--- PDF PAGE 39 ---\nHEAVY EQUIPMENT OPERATION (Forklift) NC II Revision 01 Promulgated (11/07/2019)\n\n34\n3. Implement cost-\neffective operations\n3.1 Preservation and\noptimization of\nworkplace resources\nis implemented in\naccordance with\nenterprise policy\n3.2 Judicious use of\nworkplace tools,\nequipment and\nmaterials are\nobserved according\nto manual and work\nrequirements.\n3.3 Constructive\ncontributions to\noffice operations are\nmade according to\nenterprise\nrequirements.\n3.4 Ability to work within\none’s allotted time\nand finances is\nsustained.\n\n3.1 Optimization of\nworkplace\nresources\n3.2 5S procedures and\nconcepts\n3.3 Criteria for cost-\neffectiveness\n3.4 Workplace\nproductivity\n3.5 Impact of\nentrepreneurial\nmindset to\nworkplace\nproductivity\n3.6 Ways in fostering\nentrepreneurial\nattitudes:\n•\nQuality-\nconsciousness\n•\nSafety-\nconsciousness\n3.1 Implementing\npreservation and\noptimizing\nworkplace resources\n3.2 Observing judicious\nuse of workplace\ntools, equipment\nand materials\n3.3 Making constructive\ncontributions to\noffice operations\n3.4 Sustaining ability to\nwork within allotted\ntime and finances\n\n--- PDF PAGE 40 ---\nHEAVY EQUIPMENT OPERATION (Forklift) NC II Revision 01 Promulgated (11/07/2019)\n\n35\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1.Good practices\nMay include:\n1.1 Economy in use of resources\n1.2 Documentation of quality practices\n\n2.Resources utilization\nMay include:\n2.1 Consumption/ use of consumables\n2.2 Use/Maintenance of assigned equipment\nand furniture\n2.3 Optimum use of allotted /available time\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the\ncandidate:\n1.1 Demonstrated ability to identify and\nsustain cost-effective activities in the\nworkplace\n1.2 Demonstrated ability to practice\nentrepreneurial knowledge, skills and\nattitudes in the workplace.\n\n2. Resource Implications\nThe following resources should be\nprovided:\n2.1 Simulated or actual workplace\n2.2 Tools, materials and supplies needed to\ndemonstrate the required tasks\n2.3 References and manuals\n2.3.1 Enterprise procedures manuals\n2.3.2 Company quality policy\n\n3. Methods of Assessment\nCompetency\nin\nthis\nunit\nshould\nbe\nassessed through:\n3.1 Interview\n3.2 Third-party report\n\n4.Context of Assessment\n4.1 Competency may be assessed in\nworkplace or in a simulated workplace\nsetting\n4.2 Assessment shall be observed while tasks\nare being undertaken whether individually\nor in-group\n\n--- PDF PAGE 41 ---\nHEAVY EQUIPMENT OPERATION (Forklift) NC II Revision 01 Promulgated (11/07/2019)\n\n36\nCOMMON COMPETENCIES\n\nUNIT OF COMPETENCY\n:\nPREPARE CONSTRUCTION MATERIALS AND\nTOOLS\n\nUNIT CODE\n\n:"
