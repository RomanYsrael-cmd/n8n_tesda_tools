        "source_text": "400311215\n\nUNIT DESCRIPTOR : This unit of covers the knowledge, skills and attitudes\n\nrequired to present data/information appropriately.\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n1. Gather data/\ninformation\n1.1 Evidence, facts and\ninformation are\ncollected\n1.2 Evaluation, terms of\nreference and\nconditions are\nreviewed to\ndetermine whether\ndata/information falls\nwithin project scope\n\n1.1 Organisational\nprotocols\n1.2 Confidentiality\n1.3 Accuracy\n1.4 Business\nmathematics and\nstatistics\n1.5 Data analysis\ntechniques/procedu\nres\n1.6 Reporting\nrequirements to a\nrange of audiences\n1.7 Legislation, policy\nand procedures\nrelating to the\nconduct of\nevaluations\n1.8 Organisational\nvalues, ethics and\ncodes of conduct\n\n1.1 Describing\norganisational\nprotocols relating\nto client liaison\n1.2 Protecting\nconfidentiality\n1.3 Describing\naccuracy\n1.4 Computing\nbusiness\nmathematics and\nstatistics\n1.5 Describing data\nanalysis\ntechniques/\nprocedures\n1.6 Reporting\nrequirements to a\nrange of audiences\n1.7 Stating legislation,\npolicy and\nprocedures relating\nto the conduct of\nevaluations\n1.8 Stating\norganisational\nvalues, ethics and\ncodes of conduct\n2. Assess\ngathered data/\ninformation\n2.1 Validity of data/\ninformation is\nassessed\n2.2 Analysis techniques\nare applied to assess\ndata/ information.\n2.3 Trends and\nanomalies are\nidentified\n2.4 Data analysis\ntechniques and\nprocedures are\ndocumented\n2.5 Recommendations\nare made on areas of\npossible\nimprovement.\n2.1 Business\nmathematics and\nstatistics\n2.2 Data analysis\ntechniques/\nprocedures\n2.3 Reporting\nrequirements to a\nrange of audiences\n2.4 Legislation, policy\nand procedures\nrelating to the\nconduct of\nevaluations\n2.5 Organisational\nvalues, ethics and\ncodes of conduct\n2.1 Computing\nbusiness\nmathematics and\nstatistics\n2.2 De