        "source_text": "--- PDF PAGE 7 ---\nHEAVY EQUIPMENT OPERATION (Forklift) NC II                         Revision 01        Promulgated (11/07/2019) \n \n2 \nSECTION 2 COMPETENCY STANDARDS \n \n \nThis section gives the details and contents of the units of competency required in HEAVY \nEQUIPMENT OPERATION (FORKLIFT) NC II. These units of competency are categorized into \nbasic, common and core competencies. \n \nBASIC COMPETENCIES \n \nUNIT OF COMPETENCY  :    PARTICIPATE IN WORKPLACE COMMUNICATION \n \nUNIT CODE \n       :    400311210 \n \nUNIT DESCRIPTOR        : This unit covers the knowledge, skills and attitudes   required to \ngather, interpret and convey information in response to workplace \nrequirements. \n \n \n \nELEMENTS \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \n \nREQUIRED \nKNOWLEDGE \n \nREQUIRED \nSKILLS \n1.   Obtain and \nconvey \nworkplace \ninformation \n1.1  Specific and  relevant \ninformation is \naccessed from \nappropriate sources  \n1.2  Effective questioning,  \nactive listening and \nspeaking skills are \nused to gather and \nconvey information \n1.3  Appropriate medium is \nused to transfer \ninformation and ideas \n1.4  Appropriate non- \nverbal communication \nis used \n1.5  Appropriate lines of \ncommunication with \nsupervisors and \ncolleagues are \nidentified and followed \n1.6  Defined workplace \n       procedures for the \nlocation and storage of \ninformation are used \n1.7  Personal interaction is \ncarried out clearly and \nconcisely \n1.1 Effective verbal \nand nonverbal \ncommunication \n1.2 Different modes of \ncommunication  \n1.3 Medium of \ncommunication in \nthe workplace \n1.4 Organizational \npolicies \n1.5 Communication \nprocedures and \nsystems \n1.6 Lines of \nCommunication \n1.7 Technology \nrelevant to the \nenterprise and the \nindividual’s work \nresponsibilities  \n1.8 Workplace \netiquette \n \n \n1.1  Following simple \nspoken language \n1.2  Performing routine \nworkplace duties \nfollowing simple \nwritten notices \n1.3  Participating in \nworkplace meetings \nand discussions \n1.4  Preparing work- \nrelated documents \n1.5  Estimating, calculating \nand recording routine \nworkplace measures \n1.6  Relating/ Interacting \nwith people of various \nlevels in the \nworkplace \n1.7  Gathering and \nproviding basic \ninformation in \nresponse to workplace \nrequirements \n1.8 Basic business writing \nskills \n19  Interpersonal skills in \nthe workplace \n2.0 Active-listening skills\n\n--- PDF PAGE 8 ---\nHEAVY EQUIPMENT OPERATION (Forklift) NC II                         Revision 01        Promulgated (11/07/2019) \n \n3 \n \n \nELEMENTS \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \n \nREQUIRED \nKNOWLEDGE \n \nREQUIRED \nSKILLS \n2.  Perform \nduties \nfollowing \nworkplace \ninstructions   \n2.1 Written notices and \ninstructions are read \nand   interpreted in \naccordance with \norganizational \nguidelines \n2.2 Routine written \ninstruction are followed \nbased on established \nprocedures \n2.3 Feedback is given to \nworkplace supervisor \nbased instructions/ \ninformation received \n2.4 Workplace \ninteractions are \nconducted in a \ncourteous manner \n2.5 Where necessary, \nclarifications about \nroutine workplace \nprocedures and \nmatters concerning \nconditions of \nemployment are sought \nand asked from \nappropriate  \n      sources  \n2.6  Meetings outcomes \nare interpreted and \nimplemented \n2.1 Effective verbal \nand non-verbal \ncommunication \n2.2 Different modes of \ncommunication  \n2.3 Medium of \ncommunication in \nthe workplace \n2.4 Organizational/ \nWorkplace \npolicies \n2.5 Communication \nprocedures and \nsystems \n2.6 Lines of \ncommunication \n2.7 Technology \nrelevant to the \nenterprise and the \nindividual’s work \nresponsibilities \n2.8 Effective \nquestioning \ntechniques \n(clarifying and \nprobing) \n2.9 Workplace \netiquette \n \n 