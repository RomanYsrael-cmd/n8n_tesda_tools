  "source_text": "Section 1. Successful candidates shall be awarded a National\nCertificate II signed by the TESDA Director General.\n\n4.2\nThe qualification of Telecom OSP Installation (Fiber Optic Cable) NC II\nmay be attained through demonstration of competence through a single\ncomprehensive project-type assessment covering all required units of\ncompetency of the qualification.\n\n4.3\nAssessment shall focus on the core units of competency. The basic and\ncommon units shall be integrated or assessed concurrently with the core\nunits.\n\n4.4\nThe following are qualified to apply for assessment and certification:\n\n4.4.1. Graduate of formal, non-formal, and informal, including enterprise-\nbased, training programs.\n\n4.4.2. Experienced workers (wage employed or self employed)\n\n4.5\nThe guidelines on assessment and certification are discussed in detail in the\n“Procedures Manual on Assessment and Certification” and “Guidelines on the\nImplementation of the Philippine TVET Qualification and Certification System\n(PTQCS)”.\n\n--- PDF PAGE 40 ---\n--------------------------------------------------------------------------------------------------------------------------------------------------------------------- Page 38\nTRAINING REGULATIONS – Telecom OSP Installation (Fiber Optic Cable) NC II\n Promulgated: October 2011\n\nDEFINITION OF TERMS\n\nGENERAL\n\n1) Certification - is the process of verifying and validating the competencies of a\nperson through assessment\n\n2) Certificate of Competency (COC) – is a certification issued to individuals who\npass the assessment for a single unit or cluster of units of competency\n\n3) Common Competencies - are the skills and knowledge needed by all people\nworking in a particular industry\n\n4) Competency - is the possession and application of knowledge, skills and\nattitudes to perform work activities to the standard expected in the workplace\n\n5) Competency Assessment - is the process of collecting evidence and making\njudgments on whether competency has been achieved\n\n6) Competency Standard (CS) - is the industry-determined specification of\ncompetencies required for effective work performance\n\n7) Context of Assessment - refers to the place where assessment is to be\nconducted or carried out\n\n8) Core Competencies - are the specific skills and knowledge needed in a\nparticular area of work - industry sector/occupation/job role\n\n9) Critical aspects of competency - refers to the evidence that is essential for\nsuccessful performance of the unit of competency\n\n10) Elective Competencies - are the additional skills and knowledge required by\nthe individual or enterprise for work\n\n11) Elements - are the building blocks of a unit of competency. They describe in\noutcome terms the functions that a person performs in the workplace.\n\n12) Evidence Guide - is a component of the unit of competency that defines or\nidentifies the evidences required to determine the competence of the\nindividual. It provides information on critical aspects of competency,\nunderpinning\nknowledge,\nunderpinning\nskills,\nresource\nimplications,\nassessment method and context of assessment\n\n13) Level - refers to the category of skills and knowledge required to do a job\n\n14) Method of Assessment - refers to the ways of collecting evidence and when,\nevidence should be collected\n\n--- PDF PAGE 41 ---\n--------------------------------------------------------------------------------------------------------------------------------------------------------------------- Page 39\nTRAINING REGULATIONS – Telecom OSP Installation (Fiber Optic Cable) NC II\n Promulgated: October 2011\n\n15) National Certificate (NC) – is a certification issued to individuals who achieve\nall the required units of competency for a national qualification defined under\nthe Training Regulations. NCs are aligned to specific levels within the PTQF\n\n16) Performance Criteria - are evaluative statements that specify what is to be\nassessed and the required level of performance\n\n17) Qualification - is a cluster of units of competencies that meets job roles and is\nsignificant in the workplace. It is also a certification awarded to a person on\nsuccessful completion of a course in recognition of having demonstrated\ncompetencies in an industry sector\n\n18) Range of Variables - describes the circumstances or context in which the\nwork is to be performed\n\n19) Recognition of Prior Learning (RPL) – is the acknowledgement of an\nindividual’s skills, knowledge and attitudes gained from life and work\nexperiences outside registered training programs\n\n20) Resource Implications - refers to the resources needed for the successful\nperformance of the work activity described in the unit of competency. It\nincludes work environment and conditions, materials, tools and equipment\n\n21) Basic Competencies - are the skills and knowledge that everyone needs for\nwork\n\n22) Training Regulations (TR) – refers to the document promulgated and issued\nby TESDA consisting of competency standards, national qualifications and\ntraining guidelines for specific sectors/occupations. The TR serves as basis\nfor establishment of qualification and certification under the PTQF. It also\nserves as guide for development of competency-based curricula and\ninstructional materials including registration of TVET programs offered by\nTVET providers\n\n23) Required Knowledge - refers to the competency that involves in applying\nknowledge to perform work activities. It includes specific knowledge that is\nessential to the performance of the competency\n\n24) Required Skills - refers to the list of the skills needed to achieve the elements\nand performance criteria in the unit of competency. It includes generic and\nindustry specific skills\n\n25) Unit of Competency – is a component of the competency standards stating a\nspecific key function or role in a particular job or occupation; it is the smallest\ncomponent of achievement that can be assessed and certified under the\nPTQF\n\n--- PDF PAGE 42 ---\n--------------------------------------------------------------------------------------------------------------------------------------------------------------------- Page 40\nTRAINING REGULATIONS – Telecom OSP Installation (Fiber Optic Cable) NC II\n Promulgated: October 2011\n\nSECTOR SPECIFIC\n\n1. Buffer tube cutter – used to cut and separates buffer from FO strands\n\n2. Cable – is used for the distribution to provide communication.\n\n3. Cable Slitter - tool used to slit or open FO cable\n\n4. Cleaver – use to cut fiber strands\n\n5. Crimping – proper preparation of cable, appropriate type of connectors.\n\n6. Drop cable – a small-diameter cable leading from the tap-off in the cable plant to\nthe subscribers’ TV receivers. A drop cable used by the CATV system should be\neither RG-59 or RG-6, 75-ohms coaxial cable (foam).\n\n7. Environment - The area surrounding the work site which can be directly or indirectly\naffected by occurrences at the work site. It includes the atmosphere, soils, drains,\nunderground water tables, and the ecosystem. Protection of the environment would\nrequire the proper disposal of waste materials, restriction of burning off, the correct\nhandling of toxic substances, the containment of CFCs and the like.\n\n8. Established procedures - Formal arrangements of an organization, enterprise or\nstatutory authority of how work is to be done.\n\n9. Fiber optics - a technology that transmits light rather than electricity through a fiber\nmade of thin, flexible glass or plastic. Fiber optic cables are replacing older copper\ncables for most telecommunications applications.\n\n10. Fiber optic cable - A group of individual optical fibers bundled together. Fiber optic\ncables have higher bandwidth than standard copper cable.\n\n11. Fiber Optic Stripper - used to strip fiber coating .\n\n12. Hazardous materials - Flammable gases and vapors and combustible dusts.\n\n13. Headend – is the main site at which all the signals from the various program\nsources are received, assembled, processed and combined for transmission through\nthe distribution network. It is the originating point for all services carried on a cable\ntelevision system\n\n14. Mechanical Connector- connectors used to join fiber through mechanical crimping\nmethod.\n\n15. Modifications - To make changes to the physical parameters or operational\nfunction of a device, component or piece of equipment or apparatus.\n\n16. Notification (notified) - Can include verbal, written, electronic or recorded\ninformation at completion of work which may be required to be completed in\naccordance with established procedures.\n\n--- PDF PAGE 43 ---\n--------------------------------------------------------------------------------------------------------------------------------------------------------------------- Page 41\nTRAINING REGULATIONS – Telecom OSP Installation (Fiber Optic Cable) NC II\n Promulgated: October 2011\n\n17. OH&S policies and procedures - Arrangements of an organization or enterprise to\nmeet their legal and ethical obligations of ensuring the workplace is safe and without\nrisk to health.\n\n18. Outside Plant (OSP) – is a part of telephone network system that provides for the\ndistribution of voice and data channels to the paying subscribers\n\n19. OTDR – Optical Time Domain Reflectometer used to test, locate fiber optic faults\n\n20. Requirements - That to which equipment and procedures and their outcomes must\nconform and includes statutory obligations and regulations and standards called-up\nby legislation or regulations.\n\n21. Servicing - Undertaking routine inspection, repair and maintenance of circuits,\nsystems or apparatus. Maintaining, fault finding and repair of equipment, plant and\nmachinery.\n\n22. Splicing - the act or process of creating a physical connection between two separate\npieces of optical fiber. Optical fibers should only be spliced by a technician who\npossesses the required skills and interconnection technology.\n\n23. Standards - Technical documents, which set out specifications and other criteria for\nequipment, materials, and methods to ensure them consistently, perform as\nintended.\n\n24. Subscriber – a person who pays a fee for voice and data services.\n\n25. Subscriber terminal – the telephone network system terminal to which a\nsubscriber’s equipment is connected.\n\n26. Supervised Industry Training – similar to on-the-job training – an approach in\ntraining designed to enhance the knowledge and skills of the trainee through actual\nexperience in the workplace to acquire specific competencies prescribed in the\ntraining regulations.\n\n27. System - A group or combination of inter-related, inter-dependent or interlocking\nelements forming a collective entity. Includes circuits, apparatus, equipment and the\nlike.\n\n28. Telecom – refers to Telecommunication. It is the process of transmitting information\nto a receiver by means of electric current or pulses of light.\n\n29. Termination - The act by means of which an electrical connection to an apparatus\nis established; specifically a prepared joint or connection between a cable, cord or\nconductor and a point in an electrical circuit such as a terminal or connection point.\nSuch terminations include soldering, crimping, clamping, wire wrapping, insulation\npiercing/compression.\n\n30. Testing devices - Devices and instruments used to ensure safety requirements and\noperational functions are met, and to diagnose faults in apparatus, circuits or\nsystems.\n\n31. Visual Fault Locator – used to locate/trace fibers fault(open fault)\n\n--- PDF PAGE 44 ---\n--------------------------------------------------------------------------------------------------------------------------------------------------------------------- Page 42\nTRAINING REGULATIONS – Telecom OSP Installation (Fiber Optic Cable) NC II\n Promulgated: October 2011\n\nANNEX A - ICT COMPETENCY MAP\n\nTELECOM OSP INSTALLATION (FIBER OPTIC CABLE) NC II\n\nBASIC COMPETENCIES\n\nReceive & Respond\nto Workplace\nCommunication\nWork with Others\nDemonstrate work\nvalues\nPractice basic\nhousekeeping\nprocedures\nParticipate in\nWorkplace\nCommunication\nWork in a Team\nEnvironment\nPractice career\nprofessionalism\nPractice\noccupational health\n& safety procedures\nLead Workplace\nCommunication\nLead Small Team\nDevelop and practice\nnegotiation skills\nSolve Problems\nRelated to Work\nActivities\nUse mathematical\nconcepts and\ntechniques\nUse relevant\ntechnologies\nUtilize Specialist\nCommunication Skills\nDevelop Team and\nIndividuals\nApply Problem\nSolving Techniques\nin the Workplace\nCollect, analyze and\norganize information\nPlan and Organize\nWork\nPromote\nenvironmental\nprotection\n\nCOMMON COMPETENCIES\n\nUse Hand Tools\nPerform Mensuration\nand Calculation\nPrepare and Interpret\nTechnical Drawing\nApply Quality\nStandards\nOperate a Personal\nComputer\nTerminate & Connect\nElectrical Wiring and\nElectronic Circuits\nPerform Computer\nOperations\n\nCORE COMPETENCIES\n\nRender Service Excellence\nto Customers\nInstall Mast and Accessories\nInstall and Lay Out Cables\nInstall and Configure\nCPE\nInstall Pole Hardware and\nAccessories\nLay Out and Install Fiber-\nOptic/ Coaxial Cables\nInstall Active and Passive\nDevices and Accessories\nInstall Subscriber Drop\nLines and CPE\nInstall Cables and Devices\nfor MDU\nOperate CATV system\nImplement preventive\nmaintenance of CATV system\nPerform CATV system\ntroubleshooting and\nrepair\nCommission CATV system\nPerform CATV outside plant\nexpansion works\nInstall pole hardware, cable\nterminal, line wire and\naccessories\nPerform main cable\ninstallation\nSplice/Joint cable terminal\nto main aerial and/or\nunderground copper cable\nsplice\nPerform basic\ntroubleshooting and\ncorrection of cable fault and\nerror\nInstall POTS subscriber line\nInstall Digital Subscriber\nLine (DSL)\nInstall and Splice\nAerial/Underground Fiber\nOptic Cables\n Perform optical testing\nand repair\n\n--- PDF PAGE 45 ---\n--------------------------------------------------------------------------------------------------------------------------------------------------------------------- Page 43\nTRAINING REGULATIONS – Telecom OSP Installation (Fiber Optic Cable) NC II\n Promulgated: October 2011\n\nACKNOWLEDGEMENTS\n\nThe Technical Education and Skills Development Authority (TESDA) wishes to extend\ngratitude and appreciation to the many representatives of business, industry, academe and\ngovernment agencies and labor groups who donated their time and expertise to the\ndevelopment and validation of these Training Regulations.\n\n• THE TECHNICAL EXPERT COMMITTEE\n\nMr. Juan D. Manlapaz Jr.\nDivision Head - Senior Manager\nPLDT Technical Training Division\nBoni Avenue, Mandaluyong City\nMr. Alexander S. Kibanoff\nVice President\nPLDT Training Development and\nCareer Management\nBoni Avenue, Mandaluyong City\nMr. Ramon L. Gonzales\nLead Training Officer\nFOA Cert. Fiber Optic Specialist/Instructors\nNetwork Access Technology\nPhilippine Long Distance Company\nBoni Avenue, Mandaluyong City\n\n• THE PARTICIPANTS IN THE VALIDATION OF THIS TRAINING REGULATIONS\n\nMr. Ramon L. Gonzales\nLead Training Officer\nPhilippine Long Distance Company\nMr. Ramon B. Rivera, Jr.\nSr. Technical Consultant\nDigitel Telecommunications Phils., Inc.\n\nMr. Alexander S. Gonzaga, Jr.\nTechnical Training Manager\nBayan Telecommunications, Inc.\n\nMr. Adolfo C. Areola\nVice President\nDigitel Telecommunications Phils., Inc.\n\nMr. Benjo N. Moreno\nF.O. Engineer\nBayan Telecommunications, Inc.\n\nMs. Jardine Sher C. Villarruz\nMT / Service Delivery Group\nDigitel Telecommunications Phils., Inc.\n\nMr. Jeers S. Juakay\nOutside Plant Network Engineer\nBayan Telecommunications, Inc.\n\n• THE TESDA BOARD - STANDARDS SETTING AND SYSTEMS\nDEVELOPMENT COMMITTEE\n\n• THE MANAGEMENT AND STAFF OF TESDA SECRETARIAT\n\n•\