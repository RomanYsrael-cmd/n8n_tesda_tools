    "source_text": "SECTION 3 TRAINING STANDARDS\n\n3.1\nCURRICULUM DESIGN\n\nCourse Title: Telecom OSP Installation (Fiber Optic Cable) NC II\n\nNominal Training Duration: 16 hrs – Basic Competencies\n\n 16 hrs – Common Competencies\n\n 288 hrs – Core Competencies\n\n 104 hrs in-school +\n\n 184 hrs Supervised-Industry Training (SIT) in\n\n------------------\nactual work environment\n\n 320 hrs – Total training duration\n\nCourse Description:\n\nThis course is designed to develop & enhance the knowledge, skills, & attitudes of\na Fiber Optic Cable Technician, in accordance with industry standards. It covers the\nbasic and common competencies in addition to the core competencies such as installing\nand splicing/joining aerial/underground fiber optic cables as well as performing optical\ntesting and repair thru re-splicing/joining and testing using optical time domain\nreflectometer (OTDR).\n\nBASIC COMPETENCIES\n16 hrs\n\nUnit of\nCompetency\nLearning Outcome\nTraining\nMethodology\nInstitutional\nAssessment\nApproach\n1. Participate in\nWorkplace\nCommunication\n1.1 Obtain and convey\nworkplace information\n1.2 Complete relevant work-\nrelated document\n1.3 Participate in workplace\nmeeting and discussion\n• Group\ndiscussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n2. Work in a Team\nEnvironment\n2.1 Describe and identify team\nrole and responsibility in a\nteam\n2.2 Describe work as a team\nmember\n• Discussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n\n--- PDF PAGE 33 ---\n--------------------------------------------------------------------------------------------------------------------------------------------------------------------- Page 31\nTRAINING REGULATIONS – Telecom OSP Installation (Fiber Optic Cable) NC II\n Promulgated: October 2011\n\n3. Practice Career\nProfessionalism\n3.1 Integrate personal\nobjectives with\norganizational goals.\n3.2 Set and meet work\npriorities.\n3.3 Maintain professional\ngrowth and development.\n• Discussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n4. Practice\nOccupational\nHealth and\nSafety\nProcedures\n4.1 Identify hazards and risks.\n4.2 Evaluate hazards and risks.\n4.3 Control hazards and risks.\n4.4 Maintain occupational\nhealth and safety\nawareness.\n• Discussion\n• Plant tour\n• Symposium\n• Observation\n• Interview\n\nCOMMON COMPETENCIES\n16 hrs\n\nUnit of\nCompetency\nLearning Outcomes\nTraining\nMethodology\nInstitutional\nAssessment\nApproach\n1. Apply Quality\nStandards\n1.1 Asses quality of received\nmaterials\n1.2 Assess own work\n1.3 Engage in quality\nimprovement\n Field trip\n Symposium\n Film showing\n Simulation\n On the job\ntraining\n Demonstration\n& questioning\n Observation &\nquestioning\n Third party\nreport\n2. Operate a\nPersonal\nComputer\n2.1 Start and shutdown\ncomputer\n2.2 Work with files and folders\n2.3 Arrange and customize\ndesktop display\n2.4 Utilize OS bundled\napplication\n• Modular\n• Film showing\n• Computer based\ntraining (e-\nlearning)\n• Project method\n• On the job\ntraining\n\n• Demonstration\n& questioning\n• Observation &\nquestioning\n• Third party\nreport\n• Assessment of\noutput product\n• Portfolio\n• Computer-\nbased\nassessment\n\n--- PDF PAGE 34 ---\n--------------------------------------------------------------------------------------------------------------------------------------------------------------------- Page 32\nTRAINING REGULATIONS – Telecom OSP Installation (Fiber Optic Cable) NC II\n Promulgated: October 2011\n\nCORE COMPETENCIES\n320 hrs (104 hrs in-school + 184 hrs. SIT*)\n\nUnit of\nCompetency\nLearning Outcomes\nTraining\nMethodology\nInstitutional\nAssessment\nApproach\n1. Install and\nsplice/ join\naerial/under-\nground fiber\noptic cable\n\n1.1 Prepare for fiber optic cable\nlayout and installation\n1.2 Prepare fiber optic cable for\nsplicing and joining\n1.3 Splice/Join fibers and install\nprotection sleeves using\nfusion machine\n1.4 Splice/Join fibers and install\nprotection sleeves using\nmechanical method\n1.5 Install cable closure and\nsupport (aerial and\nunderground)\n1.6 Wrap up job\n Lecture\n Discussion\n Demonstration\n Viewing\nmultimedia\n Hands on\npractice /\nSimulation\n\n Observation in\nworkplace\n Demonstration\n Oral questioning\n Written test\n2. Perform\noptical testing\nand repair\n2.1 Prepare for optical fiber\ntesting and repair\n2.2 Test and repair fiber strands\n2.3 Wrap up job\n\n Lecture\n Discussion\n Demonstration\n Viewing\nmultimedia\n Hands on\npractice/\nSimulation\n Observation in\nworkplace\n Demonstration\n Oral questioning\n Written test\n\n*Note: Supervised-Industry Training (SIT) in actual workplace environment is included in the\nnominal number of training hours.\n\n--- PDF PAGE 35 ---\n--------------------------------------------------------------------------------------------------------------------------------------------------------------------- Page 33\nTRAINING REGULATIONS – Telecom OSP Installation (Fiber Optic Cable) NC II\n Promulgated: October 2011\n\n3.2\nTRAINING DELIVERY\n\nThe delivery of training should adhere to the design of the curriculum.\nDelivery should be guided by the 10 basic principles of the competency-based\nTVET.\n• The training is based on curriculum developed from the competency\nstandards;\n• Learning is modular in its structure;\n• Training delivery is individualized and self-paced;\n• Training is based on work that must be performed;\n• Training materials are directly related to the competency standards\nand the curriculum modules;\n• Assessment is based in the collection of evidence of the performance\nof work to the industry required standard;\n• Training is based both on and off-the-job components;\n• Allows\nfor\nrecognition\nof\nprior\nlearning\n(RPL)\nor\ncurrent\ncompetencies;\n• Training allows for multiple entry and exit; and\n• Approved training programs are nationally accredited.\n\nThe competency-based TVET system recognizes various types of\ndelivery modes, both on and off-the-job as long as the learning is driven by the\ncompetency standards specified by the industry. The following training\nmodalities may be adopted when designing training programs:\n• The\ndualized\nmode\nof\ntraining\ndelivery\nis\npreferred\nand\nrecommended. Thus programs would contain both in-school and in-\nindustry training or fieldwork components. Details can be referred to\nthe Dual Training System (DTS) Implementing Rules and\nRegulations.\n• Modular/self-paced learning is a competency-based training modality\nwherein the trainee is allowed to progress at his own pace. The\ntrainer only facilitates the training delivery.\n• Peer teaching/mentoring is a training modality wherein fast learners\nare given the opportunity to assist the slow learners.\n• Supervised industry training or on-the-job training is an approach in\ntraining designed to enhance the knowledge and skills of the trainee\nthrough actual experience in the workplace to acquire a specific\ncompetencies prescribed in the training regulations.\n• Distance learning is a formal education process in which majority of\nthe instruction occurs when the students and instructors are not in\nthe same place. Distance learning may employ correspondence\nstudy, or audio, video or computer technologies.\n\n--- PDF PAGE 36 ---\n--------------------------------------------------------------------------------------------------------------------------------------------------------------------- Page 34\nTRAINING REGULATIONS – Telecom OSP Installation (Fiber Optic Cable) NC II\n Promulgated: October 2011\n\n3.3\nTRAINEE ENTRY REQUIREMENTS\n\nThe trainees who wish to enter the course should possess the following\nrequirements:\n\n•\nCan communicate in oral and written language\n•\nCan perform basic mathematical computations\n•\nMust be physically and mentally fit to undergo training\n\nThis list does not include specific institutional requirements such as\neducational attainment, appropriate work experience and others that may be\nrequired from the trainees by the school or training center delivering the TVET\nprogram.\n\n3.4 LIST OF TOOLS, EQUIPMENT AND MATERIALS (Institution-based)\n\nRecommended list of tools, equipment and materials required for a class size\nof 15 trainees for Fiber Optic Cable Splicing and Installation:\n\nTOOLS\nEQUIPMENT\nMATERIALS\nQty.\nDescription\nQty.\nDescription\nQty.\nDescription\n5\nset of wrenches\n1\ncable roller block (single\nor multiple cable)*\n3\nset of suspension clamps\n5\nSet of screwdrivers\n1\nService vehicle*\n3\npole extension arm\n5\ntorque wrench\n3\nPower Meter\n5\ncable-loop form / X-frame\n5\nF-open wrench\n3\nOTDR\n5\nground/guying insulator\n1\nbolt cutter\n3\nVisual Fault Locator\n5\npole clamps of various\nsizes\n5\ncable cutter/slitter\n3\nguy protector\n5\nNT cutter / blade\ncutter\n5\nKevlar cutter\n3\nset of guy grips\n5\nPolyethylene knife\n5\nAlcohol dispenser\n5\ncable clip\n5\nCable prep tool\n3\nLaser Source\n5\nlag screws\n5\nset of hammer\n3\nFusion Machine\n5\nsets of washer, bolts and\nnuts, machine bolts\n5\nset of pliers\n3\nMechanical Splicing Kit\n\n3\nBoring tools\n\n1rl\nstainless lashing wire\n5\nhacksaw\n\n10\nlashing wire clamps\n5\ncable tensioner/\nrachet/ coping jack\n1\nPPE:\n5\nscrew hooks\n5\nFiber optic Stripper\n5\nbody belt & strap\n1\ncable guide\n5\nhard hat/ helmet\n5\naerial hand-line\n5\nset gloves\n\n5\nBuffer tube cutter\n5\nsafety shoes\n5\ntape linen/steel tape\n5\nSafety goggles\n\n5\nmultiple cable puller*\n5\ntool pouch/holster\n\n1\ncome-a-long/guy grip*\n3\nsafety cones/other\ncollapsible signs\n\n5\nManhole ladder\n5\nrubber boots\n\n--- PDF PAGE 37 ---\n--------------------------------------------------------------------------------------------------------------------------------------------------------------------- Page 35\nTRAINING REGULATIONS – Telecom OSP Installation (Fiber Optic Cable) NC II\n Promulgated: October 2011\n\nTOOLS\nMaterials for Fiber-optics:\nMATERIALS\n\nQty.\nDescription\nQty.\nDescription\nQty.\nDescription\n\nFIBER OPTICS\n1\nfixing brackets/ clamps\n5\nOptical closure kit\n5\nbonding clamp\n5\nanchor and grounding rods\n1\nlay-up stick / cable lifter\n5\nPatchcord\n60\ncable spacer\n1\ndrill/electric drill (w/ bits\nof various sizes)\n5\nPigtail\n1 rl\ngrounding wire (gauge 12,\nstranded)\n5\nadjustable wrench\n\n5 rls\nadhesive tape\n5\nextension ladders (24\nft. length)\n100\nProtection Sleeves\n60\npcs\ncable tie 6”\n1\nbender board/cable\nform\n10\nTissue paper\n\n1\nmessenger wire raising\ntool\n5\nbot\nAlcohol 99.9%\n\n50m\nFiber optic cable 12C\n\n100\npcs\nMechanical Connector\n\n* Optional:\nOnly when required by the hiring institution\n\n3.5 TRAINING FACILITIES\n\nRecommended space requirements for the various teaching/learning areas\nare as follows:\n\nTEACHING/LEARNING AREAS\nSIZE IN\nMETERS (M)\nAREA IN\nSQ. M\nQTY\nTOTAL AREA\nIN SQ. M\nLecture Area\n6 x 5\n30\n1\n30\nLaboratory Area\n10x10\n100\n1\n100\nLearning Resource Area\n4 x 5\n20\n1\n20\nTool Room/Storage Area\n4 x 4\n16\n1\n16\nWash ,Toilet & Locker Room\n2 x 5\n10\n2\n20\n Total\n116\nFacilities / Equipment / Circulation*\n\n35\n Total Area\n\n151\n\n*Area requirement is equivalent to 30% of the total teaching/learning areas\n\n--- PDF PAGE 38 ---\n--------------------------------------------------------------------------------------------------------------------------------------------------------------------- Page 36\nTRAINING REGULATIONS – Telecom OSP Installation (Fiber Optic Cable) NC II\n Promulgated: October 2011\n\n3.6 TRAINERS QUALIFICATIONS\n\n•\nMust be a holder of TESDA Telecom Installation (Fiber Optic Cable) NC II or\nequivalent\n•\nMust be a holder of National TVET Trainers Certificate\n•\n* Must have at least 5-years relevant industry experience.\n•\nMust be physically & mentally fit.\n\n.\n\n3.7 ASSESSMENT\n\nInstitutional assessment is undertaken by trainees to determine their\n\nachievement of units of competency. A certificate of achievement is issued for\n\neach unit of competency.\n\nAs a matter of policy, graduates of programs registered with TESDA\nunder these training regulations are required to undergo mandatory national\ncompetency assessment upon completion of the program.\n\n--- PDF PAGE 39 ---\n--------------------------------------------------------------------------------------------------------------------------------------------------------------------- Page 37\nTRAINING REGULATIONS – Telecom OSP Installation (Fiber Optic Cable) NC II\n Promulgated: October 2011"
