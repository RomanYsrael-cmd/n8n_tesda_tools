        "evidence_guide": {
          "source_text": "1. Critical aspects\nof competency\nAssessment requires evidence that the candidate:\n1.1.\nSpliced and joined fiber strands\n1.2.\nOrganized fiber optic strands\n1.3.\nLaid out and installed fiber-optic cables aerial and\nunderground\n1.4.\nInstalled closure and support for aerial and underground\n2. Required\nknowledge and\nattitude\n\n2.1 Safety Practices\n1.1.1 Work safety requirements\n1.1.2 Proper use of tools and equipment\n2.2 Materials, Tools and Equipment: Uses and Specifications\n2.2.1 Identification of appropriate tools, equipment; and\ndevices and proper usage\n2.3 Theory and Practices\n2.1.1 Fiber Optic Basics\n2.1.2 Fiber optic cable splicing and joining\n2.1.3 Cable Map reading and identification of OSP\nStandards symbols and diagrams\n2.1.4 Handling of fiber-optic cables\n2.1.5 Installation of cable closure and support\n2.4 Government regulations and environmental health & safety\nrequirements\n2.5 Desirable work values and attitudes (cost conscious, safety\nconscious, quality conscious, etc.)\n3. Required skills\n3.1.\nWork efficiently and systematically\n3.2.\nObserving safety precautions\n3.3.\nSTP in pole climbing & proper handling of extension ladder\n3.4.\nProper handling, use and maintenance of tools and\nequipment.\n3.5.\nProper handling of fiber-optic cables\n3.6.\nCommunicating effectively\n3.7.\nInterpreting plans and symbols\n4. Resource\nimplications\nThe following resources should be available:\n4.1.\nTools, equipment, materials and PPE (see range of\nvariables)\n4.2.\nWork area with pole/s installed or manhole\n5. Method of\nassessment\n5.1.\nDirect observation/demonstration with oral questioning\n5.2.\nWritten test\n6. Context of\nassessment\n6.1.\nCompetency maybe assessed in the workplace or in a\nsimulated workplace setting\n6.2.\nAssessment shall be undertaken individually and direct\nsupervision\n\n--- PDF PAGE 29 ---\n--------------------------------------------------------------------------------------------------------------------------------------------------------------------- Page 27\nTRAINING REGULATIONS – Telecom OSP Installation (Fiber Optic Cable) NC II\n Promulgated: October 2011\n\nUNIT OF COMPETENCY : PERFORM OPTICAL TESTING AND REPAIR\nUNIT CODE\n:"
        },
        "source_text": "ICT724611\nDESCRIPTOR\n:\nThis unit covers the outcomes required for installation and\nsplicing/joining of aerial/underground fiber optic cables\nincluding protection sleeves installation using fusion\nmachine and mechanical method as well as cable closure\nand cable support installation both for aerial and\nunderground. This involves working with a team.\nELEMENT\nPERFORMANCE CRITERIA\nBold & italicized fonts are elaborated in the range of variables\n1. Prepare for fiber\noptic cable layout\nand installation\n\n1.1. Necessary tools, equipment, materials and personal\nprotective equipment (PPE) are prepared in line with\njob requirements.\n1.2. Cable preparation and installation requirements and\nconstraints from plan and site inspection are identified as\nper job requirements.\n1.3. Cable preparation and installation equipment is set up in\naccordance with manufacturer's and job requirements.\n1.4. Site is made safe and secure for cable installation.\n1.5. Suitable protective clothing is selected and required\nsafety devices are used.\n1.6. Support structure is assessed in line with job\nrequirements.\n1.7. Cable route is checked for obstructions and vertical\nclearances from street level and are made clear using\nsuitable methods and in coordination with authorities\nconcerned.\n1.8. Fiber optic cable is laid out in line with installation plan.\n2. Prepare Fiber Optic\ncable for splicing\nand joining\n2.1\nSheath opening of the cable and strength member is\ninstalled as required per outside plant standards.\n2.2\nBuffer tubes and fiber strands are secured and assembly\nof fiber optic organizer is aligned/ positioned in\naccordance with standard installation procedures.\n2.3\nFiber strands are stripped, cleaned and cleaved in\naccordance with established procedures.\n2.4\nLoop and bending radius tolerance is observed for cable\nmaterials at all times.\n\n--- PDF PAGE 25 ---\n--------------------------------------------------------------------------------------------------------------------------------------------------------------------- Page 23\nTRAINING REGULATIONS – Telecom OSP Installation (Fiber Optic Cable) NC II\n Promulgated: October 2011\n\n3. Splice/join fibers\nand install\nprotection sleeves\nusing fusion\nmachine\n3.1\nOccupational health & safety (OH&S) policies and\nprocedures are followed based on safety requirements.\n3.2\nInsertion of fibers strand to the fusion machine\n(automatic operation) is performed in accordance to\nprocedural standards and product/equipment\nspecification.\n3.3\nSpliced fiber strands are protected and organized as\nper procedure and job requirements.\n3.4\nLoop and bending radius tolerance is applied in line\nwith established standards\n3.5\nProblems encountered are reported as per standard\noperating procedures (SOP).\n3.6\nAccomplishment reports are accurately reported/\ndocumented in accordance with job requirements\n\n4. Splice/join fibers\nand install\nprotection sleeves\nusing mechanical\nmethod\n4.1.\nOccupational health & safety (OH&S) policies and\nprocedures are followed based on safety requirements.\n4.2.\nPlacement of prepared fiber in mechanical splicing kit is\nfollowed as per established procedure.\n4.3.\nSpliced fiber strands are protected and organized as\nper procedure and job requirements.\n4.4.\nLoop and bending radius tolerance is applied in line\nwith established standards\n4.5.\nProblems encountered are reported as per standard\noperating procedures (SOP).\n4.6.\nAccomplishment reports are accurately reported/\ndocumented in accordance with job requirements\n\n5. Install Cable\nclosure and support\n(aerial and\nunderground)\n5.1. Cable are placed inside the cable cover and properly\nattached and closed in accordance with the product\nspecification.\n5.2. Problems encountered are reported as per standard\noperating procedures (SOP).\n5.3. Flash testing of completed closure according to job\nrequirements and SOP to prevent water and moisture\nentry.\n5.4. Spliced cable are attached to messenger wire/pole or\ncable rack for support in line with job requirements and\nproduct specifications\n\n6. Wrap up job\n6.1. Tools, equipment and materials are gathered and\nstored back to the service vehicle\n6.2. Waste materials are removed from work place and\ndisposed off in accordance with government regulations\nand environmental health & safety requirements\n6.3. Changes made are restored to the work area during\ninstallation, splicing and re-splicing for acceptance as\njob requirements and procedure.\n\n--- PDF PAGE 26 ---\n--------------------------------------------------------------------------------------------------------------------------------------------------------------------- Page 24\nTRAINING REGULATIONS – Telecom OSP Installation (Fiber Optic Cable) NC II\n Promulgated: October 2011\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Tools, equipment\nand materials\nand PPE\n\nMay include but not limited to:\nTools and Equipment:\n1.1\nhammers\n1.2\naerial handline\n1.3\nextension ladders (24 ft.\nand 20 ft. length)\n1.4\nadjustable wrench\n1.5\nfixing brackets/clamps\n1.6\ncable tensioner/rachet\n1.7\ncome-a-long / guy grip\n1.8\npolyethylene knife\n1.9\nwire/lashing wire\n1.10 cable puncher\n1.11 tape linen/steel tape\n1.12 height measuring stick/pole\nstick for clearances.\nTools for fiber-optics:\n1.13 Fiber cleaver\n1.14 Buffer Tube Stripper\n1.15 Cable slitter\n1.16 Fiber stripper\n1.17 Kevlar cutter\n1.18 Alcohol dispenser\n1.19 Tissue paper/cotton buds\n1.20 Alcohol 99.9% Isopropyl\n1.21 Diagonal side cutter\n1.22 Bolt cutter\n1.23 Safety goggles\n1.24 NT cutter\n1.25 Messenger Grip M118\nMaterials:\n1.26 cable clip\n1.27 grounding wire\n1.28 lashing wire\n1.29 lashing wire clamps\n1.30 cable closure\n1.31 cable support\n1.32 cable spacer\n1.33 adhesive tape\n1.34 strand clamps\n1.35 cable roller\n1.36 standard rope\n1.37 tie wrap\n1.38 cable-loop form / X-frame\n1.39 ground/guying insulator\n\n1.40 thimble eye nut\n1.41 sets of washer, bolts and\nnuts, machine bolts\n1.42 guying fixtures\n1.43 conduit pipes\n1.44 cable tag\n1.45 pole tag\n1.46 braces\n1.47 color coded marked tape\n1.48 spiral sleeve\nMaterials for Fiber-optics:\n1.49 Fiber Optic Cable 12C\n1.50 Optical closure\n1.51 X-Frame Fiber\nManagement\n1.52 Patch cord\n1.53 Pigtail\n1.54 Optical Adapter\n1.55 Preformed Wire ¼\n1.56 Protection Sleeves\n1.57 Optical Distribution\nFrame (Patch Panel)\n1.58 3-bolt suspension clamp\n1.59 Pole clamp\n1.60 Mechanical connector\nEquipment:\n1.61 lashing machine\n1.62 tensioning machine\n1.63 cable trailer\n1.64 lineman’s truck\n1.65 Fusion machine\n1.66 OTDR\n1.67 Power Meter\n1.68 Fiber scope\n1.69 Mechanical splicing kit\nPPE:\n1.70 body belt & strap\n1.71 hard hat/ helmet\n1.72 set gloves\n1.73 goggles\n1.74 safety shoes\n1.75 tool pouch\n1.76 safety cones/traffic\nsafety devices\n\n--- PDF PAGE 27 ---\n--------------------------------------------------------------------------------------------------------------------------------------------------------------------- Page 25\nTRAINING REGULATIONS – Telecom OSP Installation (Fiber Optic Cable) NC II\n Promulgated: October 2011\n\n2. Support structure\n2.1\nElectric/Telephone pole\n2.2\nGuy wire\n2.3\nPole dressing\n3. Obstructions\n\n3.1\nTrees\n3.2\nStructures such as arcs, billboards, etc.\n3.3\nParts of buildings and houses such as roof\nextensions/overhangs\n3.4\nTraffic lights, street lights, etc.\n3.5\nPower lines\n4. Suitable\nmethods for\nremoving\nobstructions\n4.1\nTrimming of tree branches\n4.2\nInstallation of ten-pin alley arm\n4.3\nInstallation of high-tension insulation materials\n\n--- PDF PAGE 28 ---\n--------------------------------------------------------------------------------------------------------------------------------------------------------------------- Page 26\nTRAINING REGULATIONS – Telecom OSP Installation (Fiber Optic Cable) NC II\n Promulgated: October 2011\n\nEVIDENCE GUIDE\n1. Critical aspects\nof competency\nAssessment requires evidence that the candidate:\n1.1.\nSpliced and joined fiber strands\n1.2.\nOrganized fiber optic strands\n1.3.\nLaid out and installed fiber-optic cables aerial and\nunderground\n1.4.\nInstalled closure and support for aerial and underground\n2. Required\nknowledge and\nattitude\n\n2.1 Safety Practices\n1.1.1 Work safety requirements\n1.1.2 Proper use of tools and equipment\n2.2 Materials, Tools and Equipment: Uses and Specifications\n2.2.1 Identification of appropriate tools, equipment; and\ndevices and proper usage\n2.3 Theory and Practices\n2.1.1 Fiber Optic Basics\n2.1.2 Fiber optic cable splicing and joining\n2.1.3 Cable Map reading and identification of OSP\nStandards symbols and diagrams\n2.1.4 Handling of fiber-optic cables\n2.1.5 Installation of cable closure and support\n2.4 Government regulations and environmental health & safety\nrequirements\n2.5 Desirable work values and attitudes (cost conscious, safety\nconscious, quality conscious, etc.)\n3. Required skills\n3.1.\nWork efficiently and systematically\n3.2.\nObserving safety precautions\n3.3.\nSTP in pole climbing & proper handling of extension ladder\n3.4.\nProper handling, use and maintenance of tools and\nequipment.\n3.5.\nProper handling of fiber-optic cables\n3.6.\nCommunicating effectively\n3.7.\nInterpreting plans and symbols\n4. Resource\nimplications\nThe following resources should be available:\n4.1.\nTools, equipment, materials and PPE (see range of\nvariables)\n4.2.\nWork area with pole/s installed or manhole\n5. Method of\nassessment\n5.1.\nDirect observation/demonstration with oral questioning\n5.2.\nWritten test\n6. Context of\nassessment\n6.1.\nCompetency maybe assessed in the workplace or in a\nsimulated workplace setting\n6.2.\nAssessment shall be undertaken individually and direct\nsupervision\n\n--- PDF PAGE 29 ---\n----------------------------------------------------------------------------------------------------------