. cable faults\n2.1\nopen\n2.2\nhigh attenuation\n2.3\ntransposed\n\n--- PDF PAGE 31 ---\n--------------------------------------------------------------------------------------------------------------------------------------------------------------------- Page 29\nTRAINING REGULATIONS – Telecom OSP Installation (Fiber Optic Cable) NC II\n Promulgated: October 2011\n\nEVIDENCE GUIDE\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nIdentified fiber strands (color coding)\n1.2\nChecked quality of fiber optic joints\n1.3\nRepaired fiber optic cable faults\n2. Required\nknowledge and\nattitude\n2.1 Safety Practices\n2.1.1 Work safety requirements\n2.1.2 Proper handling and use of tools and equipment\n2.2 Materials, Tools and Equipment: Uses and Specifications\n2.2.1 Identification of appropriate tools, equipment and\nproper usage\n2.3 Theory and Practices\n2.3.1 Fiber Optic Basics\n2.3.2 Fiber Optic cable testing\n2.3.3 Operation of OTDR\n2.3.4 Fiber optic cable faults\n2.4 Government regulations and environmental health &\nsafety requirements\n2.5 Desirable work values and attitudes (cost conscious,\nsafety conscious, quality conscious, etc.)\n3. Required skills\n3.1\nWork efficiently and systematically\n3.2\nObserving safety precautions\n3.3\nFiber optic splicing\n3.4\nFiber optic testing\n3.5\nProper handling of tools, equipment and proper\nmaintenance.\n3.6\nCommunicating effectively\n4. Resource\nimplications\nThe following resources must be available:\n4.1 Tools and test instruments and PPE (see range of\nvariables)\n4.2 Work area with OSP fiber optic cable network\n5. Method of\nassessment\n5.1 Direct observation/ oral questioning /written test\n5.2 Written test\n6. Context of\nassessment\n6.1 Competency may be assessed in the workplace or in a\nsimulated workplace setting\n6.2 Assessment shall be undertaken either individually and\ndirect supervision\n\n--- PDF PAGE 32 ---\n--------------------------------------------------------------------------------------------------------------------------------------------------------------------- Page 30\nTRAINING REGULATIONS – Telecom OSP Installation (Fiber Optic Cable) NC II\n Promulgated: October 2011"
