onscious, \nsafety conscious, quality conscious, etc.) \n3. Required skills \n3.1 \nWork efficiently and systematically \n3.2 \nObserving safety precautions  \n3.3 \nFiber optic splicing \n3.4 \nFiber optic testing \n3.5 \nProper handling of tools, equipment and proper \nmaintenance. \n3.6 \nCommunicating effectively \n4. Resource \nimplications \nThe following resources must be available: \n4.1 Tools and test instruments and PPE (see range of \nvariables) \n4.2 Work area with OSP fiber optic cable network  \n5. Method of \nassessment \n5.1 Direct observation/ oral questioning /written test \n5.2 Written test \n6. Context of \nassessment \n6.1 Competency may be assessed in the workplace or in a \nsimulated workplace setting \n6.2 Assessment shall be undertaken either individually and \ndirect supervision\n",
