  "source_section_text": "SECTION 2:\nCOMPETENCY STANDARDS\n\nThis section gives the details of the contents of the basic, common, and core units\nof competency required for Telecom outside plant (OSP) installation for fiber optic cable.\n\nBASIC COMPETENCIES\n\nUNIT OF COMPETENCY : PARTICIPATE IN WORKPLACE COMMUNICATION\nUNIT CODE\n : 500311105\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes\nrequired to gather, interpret and convey information in\nresponse to workplace requirements.\nELEMENT\nPERFORMANCE CRITERIA\nBold & italicized fonts are elaborated in the Range of Variables\n1. Obtain and convey\nworkplace information\n1.1\nSpecific and relevant information is accessed from\nappropriate sources\n1.2\nEffective questioning , active listening and speaking\nskills are used to gather and convey information\n1.3\nAppropriate medium is used to transfer information\nand ideas\n1.4\nAppropriate non- verbal communication is used\n1.5\nAppropriate lines of communication with supervisors\nand colleagues are identified and followed\n1.6\nDefined workplace procedures for the location and\nstorage of information are used\n1.7\nPersonal interaction is carried out clearly and concisely\n2. Participate in\nworkplace meetings\nand discussions\n2.1\nTeam meetings are attended on time\n2.2\nOwn opinions are clearly expressed and those of\nothers are listened to without interruption\n2.3\nMeeting inputs are consistent with the meeting purpose\nand established protocols\n2.4\nWorkplace interactions are conducted in a courteous\nmanner\n2.5\nQuestions about simple routine workplace procedures\nand matters concerning working conditions of\nemployment are asked and responded to\n2.6\nMeetings outcomes are interpreted and implemented\n3. Complete relevant\nwork related\ndocuments\n3.1\nRange of forms relating to conditions of employment\nare completed accurately and legibly\n3.2\nWorkplace data is recorded on standard workplace\nforms and documents\n3.3\nBasic mathematical processes are used for routine\ncalculations\n3.4\nErrors in recording information on forms/ documents\nare identified and properly acted upon\n3.5\nReporting requirements to supervisor are completed\naccording to organizational guidelines\n\n--- PDF PAGE 5 ---\n--------------------------------------------------------------------------------------------------------------------------------------------------------------------- Page 3\nTRAINING REGULATIONS – Telecom OSP Installation (Fiber Optic Cable) NC II\n Promulgated: October 2011\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Appropriate sources\n1.1.\nTeam members\n1.2.\nSuppliers\n1.3.\nTrade personnel\n1.4.\nLocal government\n1.5.\nIndustry bodies\n2. Medium\n2.1.\nMemorandum\n2.2.\nCircular\n2.3.\nNotice\n2.4.\nInformation discussion\n2.5.\nFollow-up or verbal instructions\n2.6.\nFace to face communication\n3. Storage\n3.1.\nManual filing system\n3.2.\nComputer-based filing system\n4. Forms\n4.1.\nPersonnel forms, telephone message forms,\nsafety reports\n\n5. Workplace interactions\n5.1.\nFace to face\n5.2.\nTelephone\n5.3.\nElectronic and two way radio\n5.4.\nWritten including electronic, memos, instruction\nand forms, non-verbal including gestures, signals,\nsigns and diagrams\n6. Protocols\n6.1.\nObserving meeting\n6.2.\nCompliance with meeting decisions\n6.3.\nObeying meeting instructions\n\n--- PDF PAGE 6 ---\n--------------------------------------------------------------------------------------------------------------------------------------------------------------------- Page 4\nTRAINING REGULATIONS – Telecom OSP Installation (Fiber Optic Cable) NC II\n Promulgated: October 2011\n\nEVIDENCE GUIDE\n\n1. Critical aspects\nof Competency\nAssessment requires evidence that the candidate:\n1.1. Prepared written communication following standard format\nof the organization\n1.2. Accessed information using communication equipment\n1.3. Made use of relevant terms as an aid to transfer\ninformation effectively\n1.4. Conveyed information effectively adopting the formal or\ninformal communication\n2. Required\nKnowledge and\nAttitude\n\n2.1. Effective communication\n2.2. Different modes of communication\n2.3. Written communication\n2.4. Organizational policies\n2.5. Communication procedures and systems\n2.6. Technology relevant to the enterprise and the individual’s\nwork responsibilities\n3. Required Skills\n3.1. Follow simple spoken language\n3.2. Perform routine workplace duties following simple written\nnotices\n3.3. Participate in workplace meetings and discussions\n3.4. Complete work related documents\n3.5. Estimate, calculate and record routine workplace\nmeasures\n3.6. Basic mathematical processes of addition, subtraction,\ndivision and multiplication\n3.7. Ability to relate to people of social range in the workplace\n3.8. Gather and provide information in response to workplace\nRequirements\n4. Resource\nImplications\n4.1. Fax machine\n4.2. Telephone\n4.3. Writing materials\n4.4. Internet\n5. Methods of\nAssessment\n5.1. Direct Observation\n5.2. Oral interview\n5.3. Written test\n6. Context for\nAssessment\n6.1. Competency may be assessed individually in the actual\nworkplace or through accredited institution\n\n--- PDF PAGE 7 ---\n--------------------------------------------------------------------------------------------------------------------------------------------------------------------- Page 5\nTRAINING REGULATIONS – Telecom OSP Installation (Fiber Optic Cable) NC II\n Promulgated: October 2011\n\nUNIT OF COMPETENCY: WORK IN TEAM ENVIRONMENT\nUNIT CODE\n : 500311106\nUNIT DESCRIPTOR :\nThis unit covers the skills, knowledge and attitudes to\nidentify role and responsibility as a member of a team.\nELEMENT\nPERFORMANCE CRITERIA\nBold & italicized fonts are elaborated in the Range of Variables\n1. Describe team role\nand scope\n1.1. The role and objective of the team is identified from\navailable sources of information\n1.2. Team parameters, reporting relationships and\nresponsibilities are identified from team discussions\nand appropriate external sources\n2. Identify own role and\nresponsibility within\nteam\n2.1. Individual role and responsibilities within the team\nenvironment are identified\n2.2. Roles and responsibility of other team members are\nidentified and recognized\n2.3. Reporting relationships within team and external to\nteam are identified\n3. Work as a team\nmember\n3.1. Effective and appropriate forms of communications\nused and interactions undertaken with team members\nwho contribute to known team activities and objectives\n3.2. Effective and appropriate contributions made to\ncomplement team activities and objectives, based on\nindividual skills and competencies and workplace\ncontext\n3.3. Observed protocols in reporting using standard\noperating procedures\n3.4. Contribute to the development of team work plans\nbased on an understanding of team’s role and\nobjectives and individual competencies of the\nmembers.\n\n--- PDF PAGE 8 ---\n--------------------------------------------------------------------------------------------------------------------------------------------------------------------- Page 6\nTRAINING REGULATIONS – Telecom OSP Installation (Fiber Optic Cable) NC II\n Promulgated: October 2011\n\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Role and objective of\nteam\n1.1.\nWork activities in a team environment with enterprise\nor specific sector\n1.2.\nLimited discretion, initiative and judgement maybe\ndemonstrated on the job, either individually or in a team\nenvironment\n2. Sources of\ninformation\n2.1.\nStandard operating and/or other workplace procedures\n2.2.\nJob procedures\n2.3.\nMachine/equipment manufacturer’s specifications and\ninstructions\n2.4.\nOrganizational or external personnel\n2.5.\nClient/supplier instructions\n2.6.\nQuality standards\n2.7.\nHealth, safety and environmental standards\n3. Workplace context\n3.1.\nWork procedures and practices\n3.2.\nConditions of work environments\n3.3.\nLegislation and industrial agreements\n3.4.\nStandard work practice including the storage, safe\nhandling and disposal of chemicals\n3.5.\nOccupational Health Safety, environmental,\nhousekeeping and quality guidelines\n\n--- PDF PAGE 9 ---\n--------------------------------------------------------------------------------------------------------------------------------------------------------------------- Page 7\nTRAINING REGULATIONS – Telecom OSP Installation (Fiber Optic Cable) NC II\n Promulgated: October 2011\n\nEVIDENCE GUIDE\n1. Critical aspects\nof Competency\nAssessment requires evidence that the candidate:\n1.1.\nOperated in a team to complete workplace activity\n1.2.\nWorked effectively with others\n1.3.\nConveyed information in written or oral form\n1.4.\nSelected and used appropriate workplace language\n1.5.\nFollowed designated work plan for the job\n1.6.\nReported outcomes\n2. Required\nKnowledge and\nAttitude\n2.1.\nCommunication process\n2.2.\nTeam structure\n2.3.\nTeam roles\n2.4.\nGroup planning and decision making\n3. Required Skills\n3.1.\nCommunicate appropriately, consistent with the culture of\nthe workplace\n3.2.\nParticipate in workplace discussion\n3.3.\nComply with organization work requirements\n\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1.\nAccess to relevant workplace or appropriately simulated\nenvironment where assessment can take place\n4.2.\nMaterials relevant to the proposed activity or tasks\n4.3.\nCommunication and work tools\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1.\nObservation of the individual member in relation to the\nwork activities of the group\n5.2.\nObservation of simulation and or role play involving the\nparticipation of individual member to the attainment of\norganizational goal\n5.3. Case studies and scenarios as a basis for discussion of\nissues and strategies in teamwork\n6. Context for\nAssessment\n6.1.\nCompetency may be assessed in workplace or in a\nsimulated workplace setting\n6.2.\nAssessment shall be observed while task are being\nundertaken individually\n\n--- PDF PAGE 10 ---\n--------------------------------------------------------------------------------------------------------------------------------------------------------------------- Page 8\nTRAINING REGULATIONS – Telecom OSP Installation (Fiber Optic Cable) NC II\n Promulgated: October 2011\n\nUNIT OF COMPETENCY: PRACTICE CAREER PROFESSIONALISM\n\nUNIT CODE : 500311107\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes in\npromoting career growth and advancement.\n\nELEMENT\nPERFORMANCE CRITERIA\nBold & italicized fonts are elaborated in the Range of Variables\n1. Integrate personal\nobjectives with\norganizational goals\n1.1. Personal growth and work plans are pursued towards\nimproving the qualifications set for the profession\n1.2. Intra- and interpersonal relationships are maintained\nin the course of managing oneself based on\nperformance evaluation\n1.3. Commitment to the organization and its goal is\ndemonstrated in the performance of duties\n2. Set and meet work\npriorities\n2.1. Competing demands are prioritized to achieve\npersonal, team and organizational goals and\nobjectives.\n2.2. Resources are utilized efficiently and effectively to\nmanage work priorities and commitments\n2.3. Practices along economic use and maintenance of\nequipment and facilities are followed as per\nestablished procedures\n3. Maintain professional\ngrowth and\ndevelopment\n3.1. Trainings and career opportunities are identified\nand availed of based on job requirements\n3.2\nRecognitions are sought/received and\ndemonstrated as proof of career advancement\n3.3\nLicenses and/or certifications relevant to job and\ncareer are obtained and renewed every 3 years\n\n--- PDF PAGE 11 ---\n--------------------------------------------------------------------------------------------------------------------------------------------------------------------- Page 9\nTRAINING REGULATIONS – Telecom OSP Installation (Fiber Optic Cable) NC II\n Promulgated: October 2011\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Evaluation\n1.1 Performance Appraisal\n1.2 Psychological Profile\n1.3 Aptitude Tests\n2. Resources\n2.1 Human\n2.2 Financial\n2.3 Technology\n2.3.1 Hardware\n2.3.2 Software\n3. Trainings and career\nopportunities\n3.1 Participation in training programs\n 3.1.1 Technical\n 3.1.2 Supervisory\n 3.1.3 Managerial\n 3.1.4 Continuing Education\n3.2 Serving as Resource Persons in conferences\nand workshops\n4. Recognitions\n4.1 Recommendations\n4.2 Citations\n4.3 Certificate of Appreciations\n4.4 Commendations\n4.5 Awards\n4.6 Tangible and Intangible Rewards\n5. Licenses and/or\ncertifications\n5.1 National Certificates\n5.2 Certificate of Competency\n5.3 Support Level Licenses\n5.4 Professional Licenses\n\n--- PDF PAGE 12 ---\n--------------------------------------------------------------------------------------------------------------------------------------------------------------------- Page 10\nTRAINING REGULATIONS – Telecom OSP Installation (Fiber Optic Cable) NC II\n Promulgated: October 2011\n\nEVIDENCE GUIDE\n\n1. Critical aspects\nof Competency\nAssessment requires evidence that the candidate:\n1.1 Attained job targets within key result areas (KRAs)\n1.2 Maintained intra - and interpersonal relationship in the\ncourse of managing oneself based on performance\nevaluation\n1.3 Completed trainings and career opportunities which are\nbased on the requirements of the industries\n1.4 Acquired and maintained licenses and/or certifications\naccording to the requirement of the qualification\n2. Required\nKnowledge and\nAttitude\n2.1 Work values and ethics (Code of Conduct, Code of Ethics,\netc.)\n2.2 Company policies\n2.3 Company operations, procedures and standards\n2.4 Fundamental rights at work including gender sensitivity\n2.5 Personal hygiene practices\n3. Required Skills\n3.1 Application of outside plant safety practices\n3.2 Intra and Interpersonal skills\n3.3 Communication skills\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1 Workplace or assessment location\n4.2 Case studies/scenarios\n4.3 Standard tools/equipment\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1 Portfolio Assessment\n5.2 Interview\n5.3 Simulation/Role-plays\n5.4 Observation\n5.5 Third Party Reports\n5.6 Exams and Tests\n6. Context for\nAssessment\n6.1 Competency may be assessed in the work place or in a\nsimulated work place setting\n\n--- PDF PAGE 13 ---\n--------------------------------------------------------------------------------------------------------------------------------------------------------------------- Page 11\nTRAINING REGULATIONS – Telecom OSP Installation (Fiber Optic Cable) NC II\n Promulgated: October 2011\n\nUNIT OF\nCOMPETENCY :\n PRACTICE OCCUPATIONAL HEALTH AND SAFETY\nPROCEDURES\nUNIT CODE : 500311108\nUNIT DESCRIPTOR :\nThis unit covers the knowledge, skills and attitudes\nrequired to comply with regulatory and organizational\nrequirements for occupational health and safety.\n\nELEMENT\nPERFORMANCE CRITERIA\nBold & italicized fonts are elaborated in the Range of Variables\n1. Identify hazards and\nrisks\n1.1 Safety regulations and workplace safety and hazard\ncontrol practices and procedures are clarified and\nexplained based on organization procedures\n1.2 Hazards/risks in the workplace and their\ncorresponding indicators are identified to minimize or\neliminate risk to co-workers, workplace and\nenvironment in accordance with organization\nprocedures\n1.3 Contingency measures during workplace accidents,\nfire and other emergencies are recognized and\nestablished in accordance with organization procedures\n2. Evaluate hazards and\nrisks\n2.1 Terms of maximum tolerable limits which when\nexceeded will result in harm or damage are identified\nbased on threshold limit values (TLV)\n2.2 Effects of the hazards are determined\n2.3 OHS issues and/or concerns and identified safety\nhazards are reported to designated personnel in\naccordance with workplace requirements and relevant\nworkplace OHS legislation\n3. Control hazards and\nrisks\n3.1 Occupational Health and Safety (OHS) procedures for\ncontrolling hazards/risks in workplace are consistently\nfollowed\n3.2 Procedures for dealing with workplace accidents, fire\nand emergencies are followed in accordance with\norganization OHS policies\n3.3 Personal protective equipment (PPE) is correctly\nused in accordance with organization OHS procedures\nand practices\n3.4 Appropriate assistance is provided in the event of a\nworkplace emergency in accordance with established\norganization protocol\n4. Maintain OHS\nawareness\n4.1 Emergency-related drills and trainings are\nparticipated in as per established organization\nguidelines and procedures\n4.2 OHS personal records are completed and updated in\naccordance with workplace requirements\n\n--- PDF PAGE 14 ---\n--------------------------------------------------------------------------------------------------------------------------------------------------------------------- Page 12\nTRAINING REGULATIONS – Telecom OSP Installation (Fiber Optic Cable) NC II\n Promulgated: October 2011\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Safety regulations\nMay include but are not limited to:\n1.1 Clean Air Act\n1.2 Building code\n1.3 National Electrical and Fire Safety Codes\n1.4 Waste management statutes and rules\n1.5 Philippine Occupational Safety and Health\nStandards\n1.6 DOLE regulations on safety legal requirements\n1.7 ECC regulations\n2. Hazards/Risks\nMay include but are not limited to:\n2.1 Physical hazards – impact, illumination, pressure,\nnoise, vibration, temperature, radiation\n2.2 Biological hazards- bacteria, viruses, plants,\nparasites, mites, molds, fungi, insects\n2.3 Chemical hazards – dusts, fibers, mists, fumes,\nsmoke, gasses, vapors\n2.4 Ergonomics\n2.4.1 Psychological factors – over exertion/\nexcessive force, awkward/static positions,\nfatigue, direct pressure, varying metabolic\ncycles\n2.4.2 Physiological factors – monotony, personal\nrelationship, work out cycle\n3. Contingency measures\nMay include but are not limited to:\n3.1 Evacuation\n3.2 Isolation\n3.3 Decontamination\n3.4 (Calling designed) emergency personnel\n4. Personal Protective\nEquipment\nMay include but are not limited to:\n4.1 Mask\n4.2 Gloves\n4.3 Goggles\n4.4 Hair Net/cap/bonnet\n4.5 Face mask/shield\n4.6 Ear muffs\n4.7 hard hat/body belt /safety straps\n4.8 Anti-static suits\n\n--- PDF PAGE 15 ---\n--------------------------------------------------------------------------------------------------------------------------------------------------------------------- Page 13\nTRAINING REGULATIONS – Telecom OSP Installation (Fiber Optic Cable) NC II\n Promulgated: October 2011\n\nVARIABLE\nRANGE\n\n5. Emergency-related drills\nand training\n\n5.1 Fire drill\n5.2 Earthquake drill\n5.3 Basic life support/CPR\n5.4 First aid\n5.5 Spillage control\n5.6 Decontamination of chemical and toxic\n5.7 Disaster preparedness/management\n\n6. OHS personal records\n\n6.1 Medical/Health records\n6.2 Incident reports\n6.3 Accident reports\n6.4 OHS-related training completed\n\n--- PDF PAGE 16 ---\n--------------------------------------------------------------------------------------------------------------------------------------------------------------------- Page 14\nTRAINING REGULATIONS – Telecom OSP Installation (Fiber Optic Cable) NC II\n Promulgated: October 2011\n\nEVIDENCE GUIDE\n\n1. Critical aspects\nof Competency\nAssessment requires evidence that the candidate:\n1.1 Explained clearly established workplace safety and hazard\ncontrol practices and procedures\n1.2 Identified hazards/risks in the workplace and its\ncorresponding indicators in accordance with company\nprocedures\n1.3 Recognized contingency measures during workplace\naccidents, fire and other emergencies\n1.4 Identified terms of maximum tolerable limits based on\nthreshold limit value- TLV.\n1.5 Followed Occupational Health and Safety (OHS)\nprocedures for controlling hazards/risks in workplace\n1.6 Used Personal Protective Equipment (PPE) in accordance\nwith company OHS procedures and practices\n1.7 Completed and updated OHS personal records in\naccordance with workplace requirements\n\n2. Required\nKnowledge and\nAttitude\n\n2.1 OHS procedures and practices and regulations\n2.2 PPE types and uses\n2.3 Personal hygiene practices\n2.4 Hazards/risks identification and control\n2.5 Threshold Limit Value -TLV\n2.6 OHS indicators\n2.7 Organization safety and health protocol\n2.8 Safety consciousness\n2.9 Health consciousness\n3. Required\n Skills\n3.1 Outside plant safety and practices\n3.2 Hazards/risks identification and control skills\n3.3 Interpersonal skills\n3.4 Communication skills\n\n2. Resource\nImplications\nThe following resources must be provided:\n4.1 Workplace or assessment location\n4.2 OHS personal records\n4.3 Personal protective equipment\n4.4 Health records\n3. Methods of\nAssessment\nCompetency may be assessed through:\n5.1 Portfolio Assessment\n5.2 Interview/written test\n5.3 Case Study/Situation\n4. Context for\nAssessment\n6.1 Competency may be assessed in the work place or in a\nsimulated work place setting\n\n--- PDF PAGE 17 ---\n--------------------------------------------------------------------------------------------------------------------------------------------------------------------- Page 15\nTRAINING REGULATIONS – Telecom OSP Installation (Fiber Optic Cable) NC II\n Promulgated: October 2011\n\nCOMMON COMPETENCIES\n\nUNIT TITLE\n:\nAPPLY QUALITY STANDARDS\nUNIT CODE\n:\nICT315202\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes needed\nto apply quality standards in the workplace. The unit also\nincludes the application of relevant safety procedures and\nregulations,\norganization\nprocedures\nand\ncustomer\nrequirements\n\nELEMENT\nPERFORMANCE CRITERIA\nBold & italicized fonts are elaborated in the Range of Variables\n1. Assess quality of\nreceived materials or\ncomponents\n1.1. Work instructions are obtained and work is carried\nout in accordance with standard operating\nprocedures\n1.2. Received materials or component parts are\nchecked against workplace standards and\nspecifications\n1.3. Faulty material or components related to work are\nidentified and isolated\n1.4. Faults and any identified causes are recorded\nand/or reported to the supervisor concerned in\naccordance with workplace procedures\n1.5. Faulty materials or components are replaced in\naccordance with workplace procedures\n2. Assess own work\n2.1. Documentation relative to quality within the\ncompany is identified and used\n2.2. Completed work is checked against workplace\nstandards relevant to the task undertaken\n2.3. Faulty pieces are identified and isolated\n2.4. Information on the quality and other indicators of\nproduction performance is recorded in accordance\nwith workplace procedures\n2.5. Deviations from specified quality standards,\ncauses are documented and reported in\naccordance with the workplace’ standards\noperating procedures\n3. Engage in quality\nimprovement\n3.1. Process improvement procedures are participated\nin relation to workplace assignment\n3.2. Work is carried out in accordance with process\nimprovement procedures\n3.3. Performance of operation or quality of product or\nservice to ensure customer satisfaction is\nmonitored\n\n--- PDF PAGE 18 ---\n--------------------------------------------------------------------------------------------------------------------------------------------------------------------- Page 16\nTRAINING REGULATIONS – Telecom OSP Installation (Fiber Optic Cable) NC II\n Promulgated: October 2011\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Materials/components\n1.1. Materials may include but not limited to:\n1.1.1. Wires\n1.1.2. Optical Cables, soldering lead\n1.1.3. Electrical tape\n1.1.4. Connectors\n1.1.5. Optical Cable closures\n1.1.6. Protection sleeve\n1.1.7. FO organizers\n1.2. Components may include but not limited to:\n1.2.1. ICs\n1.2.2. Diodes\n1.2.3. Resistors\n1.2.4. capacitors\n2. Faults\nFaults may include but not limited to:\n2.1. Components/materials not according to\nspecification\n2.2. Components/materials contain manufacturing\ndefects\n2.3. Components/materials do not conform with\ngovernment regulation i.e., PEC, environmental\ncode\n2.4. Components/materials have safety defect\n3. Documentation\n3.1. Organization work procedures\n3.2. Manufacturer’s instruction manual\n3.3. Customer requirements\n3.4. Forms\n4. Quality standards\n4.1. Quality standards may relate but not limited to the\nfollowing:\n4.1.1. Materials\n4.1.2. Component parts\n4.1.3. Final product\n4.1.4. Production processes\n5. Customer\n5.1. Co-worker\n5.2. Supplier\n5.3. Client\n5.4. Organization receiving the product or service\n\n--- PDF PAGE 19 ---\n--------------------------------------------------------------------------------------------------------------------------------------------------------------------- Page 17\nTRAINING REGULATIONS – Telecom OSP Installation (Fiber Optic Cable) NC II\n Promulgated: October 2011\n\nEVIDENCE GUIDE\n\n1. Critical aspect of\ncompetency\nAssessment requires evidence that the candidate:\n\n1.1. Carried out work in accordance with the\ncompany’s standard operating procedures\n1.2. Performed task according to specifications\n1.3. Reported defects detected in accordance with\nstandard operating procedures\n1.4. Carried out work in accordance with the\nprocess improvement procedures\n2. Required knowledge and\nattitude\n2.1. Relevant production processes, materials and\nproducts\n2.2. Characteristics of materials/component parts\nused in electronic production processes\n2.3. Quality checking procedures\n2.4. Workplace procedures\n2.5. Safety and environmental aspects of production\nprocesses\n2.6. Fault identification and reporting\n2.7. Quality improvement process\n3. Required skills\n3.1. Reading skills required to interpret work\ninstruction\n3.2. Communication skills needed to interpret and\napply defined work procedures\n3.3. Carry out work in accordance with OHS policies\nand procedures\n4. Method of assessment\n4.1. The assessor may select at least two (2) of the\nfollowing assessment methods to objectively\nassess the candidate:\n4.1.1. Observation\n4.1.2. Questioning\n4.1.3. Practical demonstration\n5. Resource implication\n\n5.1. Materials and component parts and equipment\nto be used in a real or simulated electronic\nproduction situation\n6. Context of Assessment\n\n6.1. Assessment may be conducted in the\nworkplace or in a simulated work environment.\n\n--- PDF PAGE 20 ---\n--------------------------------------------------------------------------------------------------------------------------------------------------------------------- Page 18\nTRAINING REGULATIONS – Telecom OSP Installation (Fiber Optic Cable) NC II\n Promulgated: October 2011\n\nUNIT TITLE\n:\nOPERATE A PERSONAL COMPUTER\nUNIT CODE\n:\nICT 311203\nUNIT DESCRIPTOR\n:\nThis unit defines the competency required to operate a\npersonal computer by: starting the PC, logging in, using\nand working with files, folders and programs, saving work,\nand closing down the PC.\n\nELEMENT\nPERFORMANCE CRITERIA\nBold & italicized fonts are elaborated in the Range of Variables\n1. Start the\ncomputer\n\n1.1 The peripheral devices are properly connected\n1.2 Power is checked and the computer and peripheral\ndevices are switched on\n1.3 Proper logging in and logging off is successfully done\n1.4 The operating system features and functions are\naccessed and navigated\n1.5 Hardware configuration and other system features are\nchecked\n2. Arrange and\ncustomize\ndesktop display/\nGUI settings\n\n2.1 The desktop screen or GUI elements are changed as\nneeded\n2.2 Desktop icons are added, renamed, moved, copied or\ndeleted\n2.3 The online help functions are accessed or used as\nneeded\n2.4 Desktop icons of application programs are selected,\nopened and closed\n2.5 Properties of icons are displayed\n2.6 Computer or desktop settings are saved and restored\n3. Work with files\nand folders (or\ndirectories)\n\n3.1 A file or folder is created, opened, moved, renamed or\ncopied\n3.2 Files are located, deleted and restored\n3.3 Details and properties of files and folders are displayed or\nviewed\n3.4 Various files are organized for easy lookup and use\n3.5 Files and information are searched\n3.6 Disks are checked, erased or formatted as necessary\n4. Work with user\napplication\nprograms\n4.1 Application programs are added, changed, removed or\nran\n4.2 User software or application program are installed,\nupdated and upgraded\n4.3 Information/data are moved between documents or files\n5. Print information\n5.1 Printer is added or installed and correct printer settings\nis ensured\n5.2 Default printer is assigned accordingly\n5.3 Information or document is printed on the installed printer\n5.4 Progress of print jobs are viewed and deleted as required\n6. Shut down\ncomputer\n6.1 All open application programs are closed\n6.2 Computer and peripheral devices are properly shut down\n\n--- PDF PAGE 21 ---\n--------------------------------------------------------------------------------------------------------------------------------------------------------------------- Page 19\nTRAINING REGULATIONS – Telecom OSP Installation (Fiber Optic Cable) NC II\n Promulgated: October 2011\n\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1.\nPeripheral\ndevice\nThis may include but is not limited to:\n1.1 mouse\n1.2 keyboard\n1.3 monitor or visual display unit\n1.4 printer\n1.5 scanner\n2.\nComputer\nMay include:\n2.1. Laptops/notebooks\n2.2. Workstations\n2.3. Servers\n2.4. other personal computer devices\n3.\nApplication\nprograms\nCan include:\n3.1 user programs\n3.2 database programs\n3.3 word processors\n3.4 email programs\n3.5 Internet browsers\n3.6 system browsers\n3.7 spreadsheets\n4.\nOperating\nsystem\nMay include but is not limited to the various versions and\nvariants of operating systems running on personal\ncomputers and servers, such as:\n4.1 Windows\n4.2 NT\n4.3 Mac OS\n4.4 Linux\n4.5 Solaris\n4.6 Unix\n5.\nSystem features\nMay include but is not limited to the operating system\nfeatures and hardware features like:\n5.1 memory size\n5.2 disk capacities\n5.3 video cards\n5.4 USBs\n5.5 Modems\n5.6 1394 and LAN connectors\n5.7 SD and PC cards\n5.8 wireless and infrared connections.\n6.\nOnline help\nfunctions\n6.1 An instruction manual, or a portion of the manual,\nintegrated and accessible from within the program or\nsoftware being used.\n\n--- PDF PAGE 22 ---\n--------------------------------------------------------------------------------------------------------------------------------------------------------------------- Page 20\nTRAINING REGULATIONS – Telecom OSP Installation (Fiber Optic Cable) NC II\n Promulgated: October 2011\n\nVARIABLE\nRANGE\n7.\nProperties\nIndicates the description of the file or folder to include the:\n7.1 file name\n7.2 type of file\n7.3 file size\n7.4 date created and modified\n7.5 attributes (hidden, read-only).\n8.\nVarious files\n8.1 Documents\n8.2 Records\n8.3 Pictures\n8.4 Music\n8.5 Video\n9.\nDisks\nMay include but is not limited to:\n9.1 Floppy disks\n9.2 CDs\n9.3 CD-RW (Compact discs-Read/Write)\n9.4 DVD RW\n9.5 zip disks\n9.6 flash drives\n9.7 memory sticks\n9.8 hard drives\n10. Printer settings\nThe properties of the printer that enables it to work includes:\n10.1 page layout\n10.2 paper size\n10.3 ink/cartridge type\n10.4 number of copies\n10.5 page orientation.\n\n--- PDF PAGE 23 ---\n--------------------------------------------------------------------------------------------------------------------------------------------------------------------- Page 21\nTRAINING REGULATIONS – Telecom OSP Installation (Fiber Optic Cable) NC II\n Promulgated: October 2011\n\nEVIDENCE GUIDE\n1.\nCritical aspects\nof Competency\n\nAssessment must confirm the candidate's ability to:\n1.1 utilize software\n1.2 navigate the desktop\n1.3 use system features to perform tasks\n1.4 save results of work.\n2.\nRequired\nKnowledge and\nAttitude\nKnowledge includes:\n2.1 Keyboard layout and functions\n2.2 Computer functions\n2.3 Basic parts of a computer and various hardware\ncomponents\n2.4 Storage devices and file concepts\n2.5 Basic software operation and functionalities\n3.\nRequired Skills\nSkills include:\n3.1 Saving and retrieving files to and from various folders\nor disk storage\n3.2 Mouse and keyboarding skills for running software\napplications\n3.3 Reading and writing at a level where basic workplace\ndocuments are understood\n3.4 Clear ability to communicate with peers and\nsupervisors\n3.5 Interpretation of user manuals and help functions\n3.6 The ability to carry out written and verbal instructions\nusing a personal computer whether standalone or in\na networked environment\n4.\nResource\nImplications\nTo demonstrate competence in this unit access to the\nfollowing resources will be required:\n4.1 A personal computer\n4.2 A printer\n4.3 Mouse and keyboard\n4.4 Basic systems software\n5.\nMethods of\nAssessment\nCompetency may be assessed through:\n5.1 Observation in a workplace or simulated environment\n5.2 Third party reports\n5.3 Exams and tests\n5.4 Demonstration of required skills\n5.5 Interviews\n6.\nContext for\nAssessment\n6.1 Competency may be assessed in the workplace or in\na simulated work environment.\n\n--- PDF PAGE 24 ---\n--------------------------------------------------------------------------------------------------------------------------------------------------------------------- Page 22\nTRAINING REGULATIONS – Telecom OSP Installation (Fiber Optic Cable) NC II\n Promulgated: October 2011\n\nCORE COMPETENCIES\nUNIT OF COMPETENCY :\nINSTALL AND SPLICE/JOIN AERIAL/\nUNDERGROUND FIBER OPTIC CABLES\nUNIT CODE\n\n: ICT724611\nDESCRIPTOR\n:\nThis unit covers the outcomes required for installation and\nsplicing/joining of aerial/underground fiber optic cables\nincluding protection sleeves installation using fusion\nmachine and mechanical method as well as cable closure\nand cable support installation both for aerial and\nunderground. This involves working with a team.\nELEMENT\nPERFORMANCE CRITERIA\nBold & italicized fonts are elaborated in the range of variables\n1. Prepare for fiber\noptic cable layout\nand installation\n\n1.1. Necessary tools, equipment, materials and personal\nprotective equipment (PPE) are prepared in line with\njob requirements.\n1.2. Cable preparation and installation requirements and\nconstraints from plan and site inspection are identified as\nper job requirements.\n1.3. Cable preparation and installation equipment is set up in\naccordance with manufacturer's and job requirements.\n1.4. Site is made safe and secure for cable installation.\n1.5. Suitable protective clothing is selected and required\nsafety devices are used.\n1.6. Support structure is assessed in line with job\nrequirements.\n1.7. Cable route is checked for obstructions and vertical\nclearances from street level and are made clear using\nsuitable methods and in coordination with authorities\nconcerned.\n1.8. Fiber optic cable is laid out in line with installation plan.\n2. Prepare Fiber Optic\ncable for splicing\nand joining\n2.1\nSheath opening of the cable and strength member is\ninstalled as required per outside plant standards.\n2.2\nBuffer tubes and fiber strands are secured and assembly\nof fiber optic organizer is aligned/ positioned in\naccordance with standard installation procedures.\n2.3\nFiber strands are stripped, cleaned and cleaved in\naccordance with established procedures.\n2.4\nLoop and bending radius tolerance is observed for cable\nmaterials at all times.\n\n--- PDF PAGE 25 ---\n--------------------------------------------------------------------------------------------------------------------------------------------------------------------- Page 23\nTRAINING REGULATIONS – Telecom OSP Installation (Fiber Optic Cable) NC II\n Promulgated: October 2011\n\n3. Splice/join fibers\nand install\nprotection sleeves\nusing fusion\nmachine\n3.1\nOccupational health & safety (OH&S) policies and\nprocedures are followed based on safety requirements.\n3.2\nInsertion of fibers strand to the fusion machine\n(automatic operation) is performed in accordance to\nprocedural standards and product/equipment\nspecification.\n3.3\nSpliced fiber strands are protected and organized as\nper procedure and job requirements.\n3.4\nLoop and bending radius tolerance is applied in line\nwith established standards\n3.5\nProblems encountered are reported as per standard\noperating procedures (SOP).\n3.6\nAccomplishment reports are accurately reported/\ndocumented in accordance with job requirements\n\n4. Splice/join fibers\nand install\nprotection sleeves\nusing mechanical\nmethod\n4.1.\nOccupational health & safety (OH&S) policies and\nprocedures are followed based on safety requirements.\n4.2.\nPlacement of prepared fiber in mechanical splicing kit is\nfollowed as per established procedure.\n4.3.\nSpliced fiber strands are protected and organized as\nper procedure and job requirements.\n4.4.\nLoop and bending radius tolerance is applied in line\nwith established standards\n4.5.\nProblems encountered are reported as per standard\noperating procedures (SOP).\n4.6.\nAccomplishment reports are accurately reported/\ndocumented in accordance with job requirements\n\n5. Install Cable\nclosure and support\n(aerial and\nunderground)\n5.1. Cable are placed inside the cable cover and properly\nattached and closed in accordance with the product\nspecification.\n5.2. Problems encountered are reported as per standard\noperating procedures (SOP).\n5.3. Flash testing of completed closure according to job\nrequirements and SOP to prevent water and moisture\nentry.\n5.4. Spliced cable are attached to messenger wire/pole or\ncable rack for support in line with job requirements and\nproduct specifications\n\n6. Wrap up job\n6.1. Tools, equipment and materials are gathered and\nstored back to the service vehicle\n6.2. Waste materials are removed from work place and\ndisposed off in accordance with government regulations\nand environmental health & safety requirements\n6.3. Changes made are restored to the work area during\ninstallation, splicing and re-splicing for acceptance as\njob requirements and procedure.\n\n--- PDF PAGE 26 ---\n--------------------------------------------------------------------------------------------------------------------------------------------------------------------- Page 24\nTRAINING REGULATIONS – Telecom OSP Installation (Fiber Optic Cable) NC II\n Promulgated: October 2011\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Tools, equipment\nand materials\nand PPE\n\nMay include but not limited to:\nTools and Equipment:\n1.1\nhammers\n1.2\naerial handline\n1.3\nextension ladders (24 ft.\nand 20 ft. length)\n1.4\nadjustable wrench\n1.5\nfixing brackets/clamps\n1.6\ncable tensioner/rachet\n1.7\ncome-a-long / guy grip\n1.8\npolyethylene knife\n1.9\nwire/lashing wire\n1.10 cable puncher\n1.11 tape linen/steel tape\n1.12 height measuring stick/pole\nstick for clearances.\nTools for fiber-optics:\n1.13 Fiber cleaver\n1.14 Buffer Tube Stripper\n1.15 Cable slitter\n1.16 Fiber stripper\n1.17 Kevlar cutter\n1.18 Alcohol dispenser\n1.19 Tissue paper/cotton buds\n1.20 Alcohol 99.9% Isopropyl\n1.21 Diagonal side cutter\n1.22 Bolt cutter\n1.23 Safety goggles\n1.24 NT cutter\n1.25 Messenger Grip M118\nMaterials:\n1.26 cable clip\n1.27 grounding wire\n1.28 lashing wire\n1.29 lashing wire clamps\n1.30 cable closure\n1.31 cable support\n1.32 cable spacer\n1.33 adhesive tape\n1.34 strand clamps\n1.35 cable roller\n1.36 standard rope\n1.37 tie wrap\n1.38 cable-loop form / X-frame\n1.39 ground/guying insulator\n\n1.40 thimble eye nut\n1.41 sets of washer, bolts and\nnuts, machine bolts\n1.42 guying fixtures\n1.43 conduit pipes\n1.44 cable tag\n1.45 pole tag\n1.46 braces\n1.47 color coded marked tape\n1.48 spiral sleeve\nMaterials for Fiber-optics:\n1.49 Fiber Optic Cable 12C\n1.50 Optical closure\n1.51 X-Frame Fiber\nManagement\n1.52 Patch cord\n1.53 Pigtail\n1.54 Optical Adapter\n1.55 Preformed Wire ¼\n1.56 Protection Sleeves\n1.57 Optical Distribution\nFrame (Patch Panel)\n1.58 3-bolt suspension clamp\n1.59 Pole clamp\n1.60 Mechanical connector\nEquipment:\n1.61 lashing machine\n1.62 tensioning machine\n1.63 cable trailer\n1.64 lineman’s truck\n1.65 Fusion machine\n1.66 OTDR\n1.67 Power Meter\n1.68 Fiber scope\n1.69 Mechanical splicing kit\nPPE:\n1.70 body belt & strap\n1.71 hard hat/ helmet\n1.72 set gloves\n1.73 goggles\n1.74 safety shoes\n1.75 tool pouch\n1.76 safety cones/traffic\nsafety devices\n\n--- PDF PAGE 27 ---\n--------------------------------------------------------------------------------------------------------------------------------------------------------------------- Page 25\nTRAINING REGULATIONS – Telecom OSP Installation (Fiber Optic Cable) NC II\n Promulgated: October 2011\n\n2. Support structure\n2.1\nElectric/Telephone pole\n2.2\nGuy wire\n2.3\nPole dressing\n3. Obstructions\n\n3.1\nTrees\n3.2\nStructures such as arcs, billboards, etc.\n3.3\nParts of buildings and houses such as roof\nextensions/overhangs\n3.4\nTraffic lights, street lights, etc.\n3.5\nPower lines\n4. Suitable\nmethods for\nremoving\nobstructions\n4.1\nTrimming of tree branches\n4.2\nInstallation of ten-pin alley arm\n4.3\nInstallation of high-tension insulation materials\n\n--- PDF PAGE 28 ---\n--------------------------------------------------------------------------------------------------------------------------------------------------------------------- Page 26\nTRAINING REGULATIONS – Telecom OSP Installation (Fiber Optic Cable) NC II\n Promulgated: October 2011\n\nEVIDENCE GUIDE\n1. Critical aspects\nof competency\nAssessment requires evidence that the candidate:\n1.1.\nSpliced and joined fiber strands\n1.2.\nOrganized fiber optic strands\n1.3.\nLaid out and installed fiber-optic cables aerial and\nunderground\n1.4.\nInstalled closure and support for aerial and underground\n2. Required\nknowledge and\nattitude\n\n2.1 Safety Practices\n1.1.1 Work safety requirements\n1.1.2 Proper use of tools and equipment\n2.2 Materials, Tools and Equipment: Uses and Specifications\n2.2.1 Identification of appropriate tools, equipment; and\ndevices and proper usage\n2.3 Theory and Practices\n2.1.1 Fiber Optic Basics\n2.1.2 Fiber optic cable splicing and joining\n2.1.3 Cable Map reading and identification of OSP\nStandards symbols and diagrams\n2.1.4 Handling of fiber-optic cables\n2.1.5 Installation of cable closure and support\n2.4 Government regulations and environmental health & safety\nrequirements\n2.5 Desirable work values and attitudes (cost conscious, safety\nconscious, quality conscious, etc.)\n3. Required skills\n3.1.\nWork efficiently and systematically\n3.2.\nObserving safety precautions\n3.3.\nSTP in pole climbing & proper handling of extension ladder\n3.4.\nProper handling, use and maintenance of tools and\nequipment.\n3.5.\nProper handling of fiber-optic cables\n3.6.\nCommunicating effectively\n3.7.\nInterpreting plans and symbols\n4. Resource\nimplications\nThe following resources should be available:\n4.1.\nTools, equipment, materials and PPE (see range of\nvariables)\n4.2.\nWork area with pole/s installed or manhole\n5. Method of\nassessment\n5.1.\nDirect observation/demonstration with oral questioning\n5.2.\nWritten test\n6. Context of\nassessment\n6.1.\nCompetency maybe assessed in the workplace or in a\nsimulated workplace setting\n6.2.\nAssessment shall be undertaken individually and direct\nsupervision\n\n--- PDF PAGE 29 ---\n--------------------------------------------------------------------------------------------------------------------------------------------------------------------- Page 27\nTRAINING REGULATIONS – Telecom OSP Installation (Fiber Optic Cable) NC II\n Promulgated: October 2011\n\nUNIT OF COMPETENCY : PERFORM OPTICAL TESTING AND REPAIR\nUNIT CODE\n: ICT724612\nUNIT DESCRIPTOR :\nThis unit covers the knowledge, skills and attitudes\nrequired to perform optical testing and repair of spliced\nfibers. This unit focuses in testing fiber optics using optical\ntime domain reflectometer (OTDR).\nELEMENT\nPERFORMANCE CRITERIA\nBold & italicized fonts are elaborated in the range of variables\n1. Prepare for optical fiber\ntesting and repair\n1.1 Documentation are required and interpreted in\naccordance with enterprise procedures\n1.2 Necessary tools, equipment, materials and\npersonal protective equipment (PPE) are identified\nand prepared in line with job requirements.\n1.3 Fiber strands identification and preparation is\nperformed in accordance with job requirements and\nassignments.\n\n2. Test and repair fiber\nstrands\n2.1 Occupational health & safety (OH&S) policies and\nprocedures are followed based on safety\nrequirements.\n2.2 Identification of optical cable faults and error is\nperformed in line with OTDR manual.\n2.3 Localization of optical cable faults are performed in\naccordance to standard industry practices\n2.4 Faulty fiber optic strands are re-spliced in\naccordance with established procedures\n2.5 Problems encountered are reported as per standard\noperating procedures (SOP).\n2.6 Testing is properly documented according to job\nrequirements and SOP.\n3. Wrap up job\n3.1 Tools, equipment and materials are gathered and\nstored back to the service vehicle\n3.2 Waste materials are removed from work place and\ndisposed off in accordance with environmental health\n& safety requirements.\n\n--- PDF PAGE 30 ---\n------------------------------------------------------------------------------------------------------------------