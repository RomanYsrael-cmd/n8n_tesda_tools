        "source_text": "ICT724612\nUNIT DESCRIPTOR :\nThis unit covers the knowledge, skills and attitudes\nrequired to perform optical testing and repair of spliced\nfibers. This unit focuses in testing fiber optics using optical\ntime domain reflectometer (OTDR).\nELEMENT\nPERFORMANCE CRITERIA\nBold & italicized fonts are elaborated in the range of variables\n1. Prepare for optical fiber\ntesting and repair\n1.1 Documentation are required and interpreted in\naccordance with enterprise procedures\n1.2 Necessary tools, equipment, materials and\npersonal protective equipment (PPE) are identified\nand prepared in line with job requirements.\n1.3 Fiber strands identification and preparation is\nperformed in accordance with job requirements and\nassignments.\n\n2. Test and repair fiber\nstrands\n2.1 Occupational health & safety (OH&S) policies and\nprocedures are followed based on safety\nrequirements.\n2.2 Identification of optical cable faults and error is\nperformed in line with OTDR manual.\n2.3 Localization of optical cable faults are performed in\naccordance to standard industry practices\n2.4 Faulty fiber optic strands are re-spliced in\naccordance with established procedures\n2.5 Problems encountered are reported as per standard\noperating procedures (SOP).\n2.6 Testing is properly documented according to job\nrequirements and SOP.\n3. Wrap up job\n3.1 Tools, equipment and materials are gathered and\nstored back to the service vehicle\n3.2 Waste materials are removed from work place and\ndisposed off in accordance with environmental health\n& safety requirements.\n\n--- PDF PAGE 30 ---\n--------------------------------------------------------------------------------------------------------------------------------------------------------------------- Page 28\nTRAINING REGULATIONS – Telecom OSP Installation (Fiber Optic Cable) NC II\n Promulgated: October 2011\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Tools, equipment,\nmaterials and\nPPE\n\nMay include but not