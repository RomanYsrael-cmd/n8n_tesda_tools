        "source_text": "ICT 311203\nUNIT DESCRIPTOR\n:\nThis unit defines the competency required to operate a\npersonal computer by: starting the PC, logging in, using\nand working with files, folders and programs, saving work,\nand closing down the PC.\n\nELEMENT\nPERFORMANCE CRITERIA\nBold & italicized fonts are elaborated in the Range of Variables\n1. Start the\ncomputer\n\n1.1 The peripheral devices are properly connected\n1.2 Power is checked and the computer and peripheral\ndevices are switched on\n1.3 Proper logging in and logging off is successfully done\n1.4 The operating system features and functions are\naccessed and navigated\n1.5 Hardware configuration and other system features are\nchecked\n2. Arrange and\ncustomize\ndesktop display/\nGUI settings\n\n2.1 The desktop screen or GUI elements are changed as\nneeded\n2.2 Desktop icons are added, renamed, moved, copied or\ndeleted\n2.3 The online help functions are accessed or used as\nneeded\n2.4 Desktop icons of application programs are selected,\nopened and closed\n2.5 Properties of icons are displayed\n2.6 Computer or desktop settings are saved and restored\n3. Work with files\nand folders (or\ndirectories)\n\n3.1 A file or folder is created, opened, moved, renamed or\ncopied\n3.2 Files are located, deleted and restored\n3.3 Details and properties of files and folders are displayed or\nviewed\n3.4 Various files are organized for easy lookup and use\n3.5 Files and information are searched\n3.6 Disks are checked, erased or formatted as necessary\n4. Work with user\napplication\nprograms\n4.1 Application programs are added, changed, removed or\nran\n4.2 User software or application program are installed,\nupdated and upgraded\n4.3 Information/data are moved between documents or files\n5. Print information\n5.1 Printer is added or installed and correct printer settings\nis ensured\n5.2 Default printer is assigned accordingly\n5.3 Information or document is printed on the installed printer\n5.4 Progress of print jobs are viewed and deleted as required\n6. Shut down\ncomputer\n6.1 All open application programs are closed\n6.2 Computer and peripheral devices are properly shut down\n\n--- PDF PAGE 21 ---\n--------------------------------------------------------------------------------------------------------------------------------------------------------------------- Page 19\nTRAINING REGULATIONS – Telecom OSP Installation (Fiber Optic Cable) NC II\n Promulgated: October 2011\n\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1.\nPeripheral\ndevice\nThis may include but is not limited to:\n1.1 mouse\n1.2 keyboard\n1.3 monitor or visual display unit\n1.4 printer\n1.5 scanner\n2.\nComputer\nMay include:\n2.1. Laptops/notebooks\n2.2. Workstations\n2.3. Servers\n2.4. other personal computer devices\n3.\nApplication\nprograms\nCan include:\n3.1 user programs\n3.2 database programs\n3.3 word processors\n3.4 email programs\n3.5 Internet browsers\n3.6 system browsers\n3.7 spreadsheets\n4.\nOperating\nsystem\nMay include but is not limited to the various versions and\nvariants of operating systems running on personal\ncomputers and servers, such as:\n4.1 Windows\n4.2 NT\n4.3 Mac OS\n4.4 Linux\n4.5 Solaris\n4.6 Unix\n5.\nSystem features\nMay include but is not limited to the operating system\nfeatures and hardware features like:\n5.1 memory size\n5.2 disk capacities\n5.3 video cards\n5.4 USBs\n5.5 Modems\n5.6 1394 and LAN connectors\n5.7 SD and PC cards\n5.8 wireless and infrared connections.\n6.\nOnline help\nfunctions\n6.1 An instruction manual, or a portion of the manual,\nintegrated and accessible from within the program or\nsoftware being used.\n\n--- PDF PAGE 22 ---\n--------------------------------------------------------------------------------------------------------------------------------------------------------------------- Page 20\nTRAINING REGULATIONS – Telecom OSP Installation (Fiber Optic Cable) NC II\n Promulgated: October 2011\n\nVARIABLE\nRANGE\n7.\nProperties\nIndicates the description of the file or folder to include the:\n7.1 file name\n7.2 type of file\n7.3 file size\n7.4 date created and modified\n7.5 attributes (hidden, read-only).\n8.\nVarious files\n8.1 Documents\n8.2 Records\n8.3 Pictures\n8.4 Music\n8.5 Video\n9.\nDisks\nMay include but is not limited to:\n9.1 Floppy disks\n9.2 CDs\n9.3 CD-RW (Compact discs-Read/Write)\n9.4 DVD RW\n9.5 zip disks\n9.6 flash drives\n9.7 memory sticks\n9.8 hard drives\n10. Printer settings\nThe properties of the printer that enables it to work includes:\n10.1 page layout\n10.2 paper size\n10.3 ink/cartridge type\n10.4 number of copies\n10.5 page orientation.\n\n--- PDF PAGE 23 ---\n--------------------------------------------------------------------------------------------------------------------------------------------------------------------- Page 21\nTRAINING REGULATIONS – Telecom OSP Installation (Fiber Optic Cable) NC II\n Promulgated: October 2011\n\nEVIDENCE GUIDE\n1.\nCritical aspects\nof Competency\n\nAssessment must confirm the candidate's ability to:\n1.1 utilize software\n1.2 navigate the desktop\n1.3 use system features to perform tasks\n1.4 save results of work.\n2.\nRequired\nKnowledge and\nAttitude\nKnowledge includes:\n2.1 Keyboard layout and functions\n2.2 Computer functions\n2.3 Basic parts of a computer and various hardware\ncomponents\n2.4 Storage devices and file concepts\n2.5 Basic software operation and functionalities\n3.\nRequired Skills\nSkills include:\n3.1 Saving and retrieving files to and from various folders\nor disk storage\n3.2 Mouse and keyboarding skills for running software\napplications\n3.3 Reading and writing at a level where basic workplace\ndocuments are understood\n3.4 Clear ability to communicate with peers and\nsupervisors\n3.5 Interpretation of user manuals and help functions\n3.6 The ability to carry out written and verbal instructions\nusing a personal computer whether standalone or in\na networked environment\n4.\nResource\nImplications\nTo demonstrate competence in this unit access to the\nfollowing resources will be required:\n4.1 A personal computer\n4.2 A printer\n4.3 Mouse and keyboard\n4.4 Basic systems software\n5.\nMethods of\nAssessment\nCompetency may be assessed through:\n5.1 Observation in a workplace or simulated environment\n5.2 Third party reports\n5.3 Exams and tests\n5.4 Demonstration of required skills\n5.5 Interviews\n6.\nContext for\nAssessment\n6.1 Competency may be assessed in the workplace or in\na simulated work environment.\n\n--- PDF PAGE 24 ---\n--------------------------------------------------------------------------------------------------------------------------------------------------------------------- Page 22\nTRAINING REGULATIONS – Telecom OSP Installation (Fiber Optic Cable) NC II\n Promulgated: October 2011\n\nCORE COMPETENCIES\nUNIT OF COMPETENCY :\nINSTALL AND SPLICE/JOIN AERIAL/\nUNDERGROUND FIBER OPTIC CABLES\nUNIT CODE\n\n:"
