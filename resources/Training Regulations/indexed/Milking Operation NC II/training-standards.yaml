 ---\nTR-Milking Operation NCII Promulgated February 3, 2017\n\n91\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n• Employ personal hygiene\n• Cleaning and sanitizing tools and\nutensils\n• Storing and inventorying of tools,\nutensils and materials\n• Managing of wastes\n• Practice EMS\n•Practice 7S of Good Housekeeping\n\n--- PDF PAGE 93 ---\nTR-Milking Operation NCII Promulgated February 3, 2017\n\n92\n3.2\nTRAINING DELIVERY\n\nThe delivery of training shall adhere to the design of the curriculum. Delivery\nshall be guided by the principles of competency-based TVET.\n\na. Course design is based on competency standards set by the industry or\nrecognized industry sector; (Learning system is driven by competencies\nwritten to industry standards)\n\nb. Training delivery is learner-centered and should accommodate\nindividualized and self-paced learning strategies;\n\nc. Training can be done on an actual workplace setting, simulation of a\nworkplace and/or through adoption of modern technology (Video\nConferencing, Webinar, etc).\n\nd. Assessment is based in the collection of evidence of the performance of\nwork to the industry required standards;\n\ne. Assessment of competency takes the trainee’s knowledge and attitude\ninto account but requires evidence of actual performance of the\ncompetency as the primary source of evidence.\n\nf. Training program allows for recognition of prior learning (RPL) or current\ncompetencies;\n\ng. Training completion is based on satisfactory performance of all specified\ncompetencies.\n\nThe competency-based TVET system recognizes various types of delivery\nmodes, both on-and off-the-job as long as the learning is driven by the competency\nstandards specified by the industry. The following training modalities and their\nvariations/components may be adopted singly or in combination with other modalities\nwhen designing and delivering training programs:\n\nInstitution- Based:\n\n• Dual Training System (DTS) / Dualized Training Program (DTP) which\ncontain both in-school and in-industry training or fieldwork components.\nDetails can be referred to the Implementing Rules and regulations of the\nDTS Law and the TESDA Guidelines on the DTP:\n\nEnterprise-Based:\n\nEnterprise-based training may also be taken to mean a school or training center\nwith one or more partner enterprise or an enterprise or group of enterprises\nsetting up a common training facility or partnering with a school or training\ncenter.\n\n--- PDF PAGE 94 ---\nTR-Milking Operation NCII Promulgated February 3, 2017\n\n93\n• Enterprise-based Training - where training is implemented within the\ncompany in accordance with the requirements of the specific company.\n\n• Apprenticeship – Training within employment involving a contract between\nan apprentice and an enterprise on an approved apprenticeable occupation.\n\nCommunity-Based –refers to a short program conducted or coordinated by\nNGOs, LGUs, training centers and other TVET providers which are intended to\naddress the specific needs of a community. Such programs are usually\nconducted in informal settings such as barangay hall, basketball courts and\nother available venues in a community.\n\n--- PDF PAGE 95 ---\nTR-Milking Operation NCII Promulgated February 3, 2017\n\n94\n3.3\nTRAINEE ENTRY REQUIREMENTS\n\nTrainees or students who want to enroll in this course should possess\nthe following requirements:\n\n• Able to read and write;\n• Able to communicate, both orally and in writing; and\n• Basic mathematical skills\n• No active pulmonary tuberculosis as certified by local physician\n\n3.4\nLIST OF TOOLS, EQUIPMENT AND MATERIALS\n\n MILKING OPERATION NC II\n\nRecommended list of tools, equipment and materials for the training of 25\ntrainees for Milking Operation NC II\n\nTOOLS\nEQUIPMENT\nMATERIALS\nQTY.\n\nQTY\n\nQTY.\n\n5 pcs\nMilk can\n(40 liters)\n2\nunits\nMilking machine\n(Bucket type)\n10 pcs\nCheesecloth\n