  "source_section_text": "SECTION 3. TRAINING ARRANGEMENTS\n\nThese standards are set to provide Technical and Vocational Education and\nTraining (TVET) providers with information and other important requirements to consider\nwhen designing and delivering inclusive training programs for MILKING OPERATION NC\nII.\n\nThey include information on curriculum design; training delivery; trainee entry\nrequirements; tools and equipment; training facilities; and trainer’s qualification.\n\n3.3 CURRICULUM DESIGN\nTESDA shall provide the training on the development of competency-based curricula\nto enable training providers develop their own curricula with the components mentioned\nbelow.\n\nDelivery of knowledge requirements for the basic, common and core units of\ncompetency\nspecifically\nin\nthe\nareas\nof\nmathematics,\nscience/technology,\ncommunication/language and other academic subjects shall be contextualized. To this\nend, TVET providers shall develop a Contextual Learning Matrix (CLM) to green\ntechnology, issues on health and drugs and cater person with disabilities (PWD’s).\n\nCourse Title: MILKING OPERATION NC Level NC II\n\nNominal Training Duration:\n\n20 hrs\nBasic Competencies\n72 hrs\nCommon Competencies\n68 hrs\nCore Competencies\n160 hrs\nTotal\n\nCourse Description:\n\nThis course is designed to provide the students/learner with knowledge,\ndesirable attitudes and skills required to perform the following competencies in\naccordance with industry standards: conduct pre-milking activities, perform milking\noperation and conduct post-milking operation.\n\n--- PDF PAGE 63 ---\nTR-Milking Operation NCII Promulgated February 3, 2017\n\n62\nBASIC COMPETENCIES\n20 HRS\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal Duration\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and\nconvey\nworkplace\ninformation\n• Describe Organizational\npolicies\n• Group\ndiscussion\n• Oral\nevaluation\n4 Hours\n• 