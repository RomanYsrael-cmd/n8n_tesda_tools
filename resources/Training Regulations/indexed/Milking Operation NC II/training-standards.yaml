SHERY SECTOR\n\nTrainers who will deliver the training on MILKING OPERATION NC II should\nhave the following:\n\n• Must be a holder of National TVET Trainer Certificate in Milking Operation\nNC II or preferably graduate of Animal Science and related areas or\ngraduate of Agricultural Engineering/Agricultural Biosystems Engineering\nwith TM I\n• Must have two (2) years industry experience for the last five (5) years\n\n--- PDF PAGE 97 ---\nTR-Milking Operation NCII Promulgated February 3, 2017\n\n96\n3.7\nINSTITUTIONAL ASSESSMENT\n\nInstitutional assessment is undertaken by trainees to determine their\nachievement of units of competency . A certificate of achievement is issued for each\nunit of competency.\n\n--- PDF PAGE 98 ---\nTR-Milking Operation NCII Promulgated February 3, 2017\n\n97"
