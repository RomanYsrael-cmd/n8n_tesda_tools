        "source_text": "AFF321201\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes\nrequired to perform safety measures effectively and\nefficiently. It includes identifying areas, tools, materials,\ntime and place in performing safety measures.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1.\nDetermine\nareas of\nconcern for\nsafety\nmeasures\n1.1\nWork tasks are\nidentified in line\nwith farm\noperations\n1.2\nPlace for safety\nmeasures are\ndetermined in\nline with farm\noperations\n1.3\nTime for safety\nmeasures are\ndetermined in\nline with farm\noperations\n1.4\nAppropriate\ntools, materials\nand outfits are\nprepared in line\nwith job\nrequirements\n• Different work\ntasks in farm\noperations\n• Place and time\nfor\nimplementation\nof safety\nmeasures\n• Different\nhazards in the\nworkplace\n• Types of tools,\nmaterials and\noutfits\n• Preparation of\ntools, materials\nand outfits\n\n• Identifying\n• work tasks in\nfarm\noperations\n• Determining\nplace and\ntime for\nimplementatio\nn of safety\nmeasures\n• Reading\nlabels,\nmanuals and\nother basic\nsafety\ninformation\n• Identifying\neffective/functi\nonal tools,\nmaterials and\noutfit\n• Preparing\ntools,\nmaterials and\noutfits\n• Discarding\ndefective\ntools, and\nmaterials\n\n--- PDF PAGE 26 ---\nTR-Milking Operation NCII Promulgated February 3, 2017\n\n25\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1\nApply\nappropriate\nsafety\nmeasures\n2.1Tools and materials\nare used according\nto specifications and\nprocedures\n2.2Outfits are worn\naccording to farm\nrequirements\n2.3 Effectivity/shelf\nlife/expiration of\nmaterials are strictly\nobserved\n2.4 Emergency\nprocedures are\nknown and followed\nto ensure a safe\nwork requirement\n2.5 Hazards in the\nworkplace are\nidentified and\nreported in line with\nfarm guidelines\n• Uses and\nfunctions of tools\n• Outfits and how\nto wear it.\n• Expiration/shelf\nlife of materials\n• Proper disposal\nof expired\nmaterials\n• Environmental\nrules and\nregulations\n• Emergency\nprocedures\n• Hazards\nidentification and\nreporting\n• Communication\nskills\n• OSHS\n\n• Using tools\nand materials\nin the\nworkplace\n• Wearing of\noutfits\n• Observing\nexpiration/shelf\nlife of materials\n• Disposing of\nexpired\nmaterials\n• Following\nemergency\nprocedures\n• Identifying and\nreporting of\nhazards in\nworkplace\narea.\n\n2\nSafe keep\n/dispose\ntools,\nmaterials\nand outfit\n3.1Used tools and outfit\nare cleaned after\nuse and stored in\ndesignated areas\n3.2Unused materials\nare properly labeled\nand stored\naccording to\nmanufacturers\nrecommendation\nand farm\nrequirements\n3.3 Waste materials are\ndisposed according\nto manufacturers,\ngovernment and\nfarm requirements\n• Procedures of\ncleaning used\ntools and outfits\n• Label and\nstorage unused\nmaterials\n• Disposal of\nwastes materials\n• Manufacturers\nrecommendation\non keeping\nmaterials\n• Environmental\nrules and\nregulations\n• Cleaning used\ntools and outfit\n• Labelling and\nstoring unused\nmaterials\n• Disposing\nwaste\nmaterials\n\n--- PDF PAGE 27 ---\nTR-Milking Operation NCII Promulgated February 3, 2017\n\n26\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Work tasks\nWork task may be selected from any of the\nsubsectors:\n1.1 Crop Production\n1.2 Post-harvest\n1.3 Agri-marketing\n1.4\nFarm Equipment\n2. Place\nPlace includes:\n2.1 Stock room/storage areas/warehouse\n2.2\nField/farm/orchard\n3. Time\nTime includes:\n3.1 Fertilizer and pesticides application\n3.2 Feed mixing and feeding\n3.3 Harvesting and hauling\n4.\nTools, materials and\noutfits\nTools, materials and outfits may include:\n4.1 Tools\n4.1.1 Wrenches\n4.1.2 Screw driver\n4.1.3 Pliers\n4.2 Outfit\n4.2.1 Masks\n4.2.2 Gloves\n4.2.3 Boots\n4.2.4 Overall coats\n4.2.5 Hat\n4.2.6 Eye goggles\n5. Emergency procedures\nEmergency procedures include:\n5.1 Location of first aid kit\n5.2 Evacuation\n5.3 Agencies contract\n5.4\nFarm emergency procedures\n6. Hazards\nHazards include:\n6.1 Chemical\n6.2 Electrical\n6.3\nFalls\n\n--- PDF PAGE 28 ---\nTR-Milking Operation NCII Promulgated February 3, 2017\n\n27\nEVIDENCE GUIDE\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Determined areas of concern for safety measures\n1.2 Applied appropriate safety measures according to\nindustry requirements\n1.3 Prepared tools, materials and outfit needed\n1.4 Performed proper disposal of used materials\n1.5 Cleaned and stored tools, materials and outfit in\ndesignated facilities\n2. Resource\nImplications\n\nThe following resources should be provided:\n2.1 Farm location\n2.2 Tools, equipment and outfits appropriate in applying\nsafety measures\n3. Method of\nAssessment\nCompetency in this unit must be assessed through:\n3.1Practical demonstration\n3.2 Third Party Report\n4. Context of\nAssessment\n4.1\nCompetency may be assessed in the actual\nworkplace or at the designated TESDA Accredited\nAssessment Center.\n\n--- PDF PAGE 29 ---\nTR-Milking Operation NCII Promulgated February 3, 2017\n\n28\nUNIT OF COMPETENCY : USE FARM TOOLS AND EQUIPMENT\n\nUNIT CODE\n:"
