        "source_text": "AFF751303\n\nUNIT DESCRIPTOR\n:\nThis competency unit covers the knowledge, skills\nand attitude to shut-down milking parlor, clean and\nstore tools, utensils and equipment and complete\npost-milking operation.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1. Shut down\nmilking\nparlor\n1.1 Teat disinfectant is\nprepared following\nstandard\nprocedures.\n1.2 Post-dipping and\nspraying are\nperformed\naccording to GAHP\nand HACCP\n1.3 Animals are\nreleased following\nGAHP\n1.4 Cleaning solution\nis prepared\nfollowing\nrecommended\nconcentration,\ntemperature and\ntime\n1.5 Milking machine\nis cleaned and\ndisinfected\naccording to\nmanual and\nindustry\nprocedures\n1.6 Milking area is\ncleaned and\ndisinfected\naccording to GMP.\n•\nPPEs\n•\nGAHP on post\ndipping and\nspraying\n•\nOSHS on\nmilking machine\n•\nWorkplace\nprocedure\n•\nManuals on\nmilking\noperation\n•\nHACCP\nawareness\n•\nAwareness of\nMaterial Safety\nData Sheet\n(MSDS)\n•\nAnimal Welfare\nAct\n•\nProcedures in\nreleasing\nanimals\n•\nGAHP in\nhandling\nanimals\n•\nCleaning\nsolutions\n•\nProcedure in\npreparing\ncleaning\nsolution\n•\nIndustry\nprocedures (CIP\nand COP)\n•\nWearing of PPEs\n•\nOperate milking\nunits\n•\nFollowing written\ninstruction and\napply procedure\n•\nIdentifying Hazards\nand implement safe\noperating procedure\n•\nComputing\nconcentration of\ncleaning solution\n•\nFollowing\nprocedures in\nMSDS\n•\nCleaning and\ndisinfecting milking\nparlor\n•\nCleaning and\nsanitizing milking\nmachine\n•\nFollowing\nprocedures of CIP\n•\nReleasing animals\n•\nPracticing Animal\nWelfare Act and\nGAHP\n•\nPreparing cleaning\nsolutions\n•\nPracticing manual\nand CIP and COP\nmethods in cleaning\nthe milking\nmachines\n\n--- PDF PAGE 58 ---\nTR-Milking Operation NCII Promulgated February 3, 2017\n\n57\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n•\nCleaning and\nSanitizing\nProcedures\n•\nMilking machine\nand procedures\nof cleaning the\nparts\n•\nWork\ninstructions\n•\nHygiene on\npremises\n•\nGood\nManufacturing\nPractices (GMP)\nfor milking\nmachine and\narea\n•\nOSHS in\nshutting down\nmilking parlor\n•\nAttitude:\n- Patient\n- Time-conscious\n- Diligent\n•\nPracticing cleaning\nand disinfection\npremises\n•\nPracticing GMP,\nGAHP and OSHS\n2. Maintain\ntools,\nutensils\nmaterials\nand\nequipment\n2.1 Sanitizing solution\nis prepared\nfollowing required\nconcentration\n2.2 Tools and utensils\nare cleaned and\nsanitized according\nto GMP\n2.3 Tools and utensils\nare stored\nfollowing\nworkplace\nprocedures.\n2.4 Tools, utensils,\nmaterials and\nmilking machine\nare inventoried\nfollowing\nworkplace\nprocedures\n•\nCleaning\nsolutions\n•\nProcedure in\npreparing\ncleaning\nsolutions\n•\nProcedures in\ncleaning and\nsanitizing tools\nand utensils\n•\nStorage of tools\nand utensils\n•\nInventory of\ntools, utensils,\nmaterials and\nmilking machine\n•\nGood\nManufacturing\nPractices\n•\nPreparing cleaning\nsolutions\n•\nCleaning and\nsanitizing tools\n•\nStoring tools and\nutensils\n•\nPerforming\ninventory of tools,\nutensils, materials\nand milking\nmachine\n•\nFollowing GMP\n\n--- PDF PAGE 59 ---\nTR-Milking Operation NCII Promulgated February 3, 2017\n\n58\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n3. Complete\npost-\nmilking\noperations\n3.1 Milk form sheet is\naccomplished\nfollowing\nestablished farm\nprocedures\n3.2 Individual milk\nproduction data is\ncollected following\nestablished farm\nprocedures\n3.3 Total milk\nproduction is\ncomputed following\nworkplace\nprocedures\n3.4 Report on milk\nproduction is\nprepared according\nto workplace\nprocedures\n3.5 Wastes are\nmanaged following\nenvironmental\nrules and\nregulations\n•\nAccomplishment\nof milk form\nsheet\n•\nHACCP and\nGMP\n•\nPPEs\n•\nPersonal\nHygiene\n•\nOSHS\n•\nMSDS\n•\nMathematical\noperation\n•\nWorkplace\nprocedure\n•\nManuals on\nmilking\noperation\n•\nEMS standards\n•\nIndividual milk\nproduction data\nand collection\nprocedures\n•\nComputation of\ntotal milk\nproduction\n•\nRecord keeping\n•\nPreparation of\nmilk production\nreport\n•\nWaste\nmanagement\n•\nEnvironmental\nrules and\nregulations\n•\nEMS 14001\n•\nAttitude:\n- Patient\n- Time-conscious\n- Diligent\n•\nRecording\naccurately and\nlegible\n•\nLiteracy skills to\nread\n•\nUsing simple\nmathematical\noperation\n•\nPreparing report on\nmilk production\naccording to\nworkplace\nprocedure\n•\nComputing\nconcentration of\ncleaning solution\n•\nPreparing cleaning\nsolution\n•\nFollowing\nprocedures of\npreparing & storing\ntools, utensils &\nmaterials\n•\nManaging waste\n•\nPracticing\nEnvironmental\nmanagement\nsystem (EMS) rules\nand regulations\n•\nCollecting individual\nmilk production data\n•\nComputing for total\nmilk production\n•\nPracticing accurate\nand practical record\nkeeping\n•\nPreparing report on\nmilk production\n•\nManaging wastes\n•\nPracticing\nenvironmental rules\nand regulations\n\n--- PDF PAGE 60 ---\nTR-Milking Operation NCII Promulgated February 3, 2017\n\n59\nRANGE OF VARIABLES\n\nVARIABLE\nSCOPE\n1.\nCleaning solution\nCleaning solution includes:\n1.1 Alkaline solution (0.5-1% solution)\n1.2 Acid solution (0.5-1% solution)\n2.\nMilking machine\nMilking machine includes:\n2.1 Herringbone type\n2.2 Bucket type\n2.3 Chilling tank\n3.\nTools and utensils\nTools and utensils may include:\n3.1 Milk Bucket\n3.2 Milk can\n3.3 Thermometer\n3.4 Measuring cup\n4.\nMaterials\nMaterials may include:\n4.1 Detergent\n4.2 Face towel\n4.3 Push brush\n4.4 Scrubbing pads\n4.5 Chlorine\n5.\nRecord keeping\nRecord keeping includes:\n5.1 Logbooks\n5.2 Calculators\n5.3 Pens\n5.4 Laptops\n\n--- PDF PAGE 61 ---\nTR-Milking Operation NCII Promulgated February 3, 2017\n\n60\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Released animals\n1.2 Shutdown milking machine\n1.3 Cleaned milking parlor and chilling machine\n1.4 Cleaned and stored tools, utensils, materials and\nequipment\n1.5 Cleaned and dried milking area\n1.6 Conducted record keeping\n1.7 Disposed waste materials\n2. Resource\nImplications\nThe following resources should be provided:\n2.1 Dairy animal\n2.2 Milking parlor\n2.3 Milking machine\n2.4 Tools, utensils and materials to demonstrate tasks\nrequired\n2.5 PPE\n2.6 References and Manuals\n3. Method of\nAssessment\nCompetency in this unit must be assessed through:\n3.1 Written exam\n3.2 Demonstration with oral questioning\n4. Context of\nAssessment\n4.1 Competency maybe assessed in actual workplace or at the\ndesignated TESDA Accredited Assessment Center.\n\n--- PDF PAGE 62 ---\nTR-Milking Operation NCII Promulgated February 3, 2017\n\n61"
