        "source_text": "500311107\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes in\npromoting career growth and advancement.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Integrate\npersonal\nobjectives with\norganizational\ngoals\n1.1 Personal growth and\nwork plans are\npursued towards\nimproving the\nqualifications set for\nthe profession\n1.2 Intra- and\ninterpersonal\nrelationships are\nmaintained in the\ncourse of managing\noneself based on\nperformance\nevaluation\n1.3 Commitment to the\norganization and its\ngoal is demonstrated\nin the performance of\nduties\n\n• Work values and\nethics (Code of\nConduct, Code of\nEthics, etc.)\n• Company policies\n• Company\noperations,\nprocedures and\nstandards\n• Company\nmission/vision\nstatements\n• Ways of integrating\npersonal objectives\nwith organizational\ngoals\n\n• Integrating\nskills of\npersonal\nobjectives\nwith\norganizationa\nl goals\n• Pursuing\npersonal\ngrowth and\nwork plans\n• Demonstratin\ng\ncommitment\nto the\norganization\nand its goals\n• Intra and\nInterpersonal\nskills\n2. Set and meet\nwork priorities\n2.1 Competing demands\nare prioritized to\nachieve personal,\nteam and\norganizational goals\nand objectives.\n2.2 Resources are\nutilized efficiently and\neffectively to manage\nwork priorities and\ncommitments\n2.3 Practices along\neconomic use and\nmaintenance of\nequipment and\nfacilities are followed\nas per established\n• Company policies\n• procedures and\nstandards\n• Company and\ndepartmental goals\nand priorities\n• Managing priorities\nand commitments\n• Economic use and\nmaintenance of\nequipment and\nfacilities\n• Ways and means of\npracticing economic\nuse and\nmaintenance of\n• Setting skills\nof work\npriorities\n• Meeting with\nwork priorities\n• Intra and\nInterpersonal\nskills\n• Communicati\non skills\n\n--- PDF PAGE 16 ---\nTR-Milking Operation NCII Promulgated February 3, 2017\n\n15\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\nprocedures\nequipment and\nfacilities\n3. Maintain\nprofessional\ngrowth and\ndevelopment\n3.1 Trainings and\ncareer\nopportunities are\nidentified and availed\nof based on job\nrequirements\n3.2 Recognitions are\nsought/received and\ndemonstrated as\nproof of career\nadvancement\n3.3 Licenses and/or\ncertifications\nrelevant to job and\ncareer are obtained\nand renewed\n\n• Ways of identifying\ntrainings and\ncareer\nopportunities\n• Techniques of\nseeking and\nreceiving\nrecognitions\n• Procedures of\nobtaining licenses\nand/or\ncertifications\nrelevant to the job\n\n• Identifying\ntrainings and\ncareer\nopportunities\n• Seeking\nrecognitions\nare\nsought/recei\nved and\ndemonstrate\nd as proof of\ncareer\nadvancemen\nt\n• Obtaining\nand\nrenewing\nLicenses\nand/or\ncertifications\nrelevant to\njob and\ncareer\n\n--- PDF PAGE 17 ---\nTR-Milking Operation NCII Promulgated February 3, 2017\n\n16\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Evaluation\nEvaluation may include:\n1.2\nPerformance Appraisal\n1.2 Psychological Profile\n1.3\nAptitude Tests\n2. Resources\nResources may include:\n2.1\nHuman\n2.2 Financial\n2.3 Technology\n2.3.1 Hardware\n2.3.1 Software\n3. Trainings and career\nopportunities\nTrainings and career opportunities may include:\n3.1 Participation in training programs\n 3.1.1 Technical\n 3.1.2 Supervisory\n 3.1.3 Managerial\n 3.1.4 Continuing Education\n3.2 Serving as Resource Persons in conferences and\nworkshops\n4. Recognitions\nRecognitions may include:\n4.1 Recommendations\n4.2 Citations\n4.3 Certificate of Appreciations\n\nCommendations\n4.6\nAwards\n4.7\nTangible and Intangible Rewards\n5. Licenses and/or\ncertifications\nLicenses and/or certifications may include:\n5.1\nNational Certificates\n5.2\nCertificate of Competency\n5.3\nSupport Level Licenses\n5.4\nProfessional Licenses\n\n--- PDF PAGE 18 ---\nTR-Milking Operation NCII Promulgated February 3, 2017\n\n17\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nAttained job targets within key result areas (KRAs)\n1.2\nMaintained intra - and interpersonal relationship in\nthe course of managing oneself based on\nperformance evaluation\n1.3\nCompleted trainings and career opportunities\nwhich are based on the requirements of the\nindustries\n1.4\nAcquired and maintained licenses and/or\ncertifications according to the requirement of the\nqualification\n2. Resource Implications\nThe following resources should be provided:\n2.1\nWorkplace or assessment location\n2.2\nCase studies/scenarios\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1\nPortfolio Assessment\n3.2\nInterview\n3.3\nSimulation/Role-plays\n3.4\nObservation\n3.5\nThird Party Reports\n3.6\nExams and Tests\n4. Context for\nAssessment\n4.2. Competency may be assessed in actual workplace\nor at the designated TESDA Accredited\nAssessment Center.\n\n--- PDF PAGE 19 ---\nTR-Milking Operation NCII Promulgated February 3, 2017\n\n18\nUNIT OF COMPETENCY : PRACTICE OCCUPATIONAL HEALTH AND\nSAFETY PROCEDURES\nUNIT CODE :"
