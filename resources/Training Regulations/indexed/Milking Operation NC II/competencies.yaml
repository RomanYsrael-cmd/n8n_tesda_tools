          "source_text": "1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1. Determined inventory inputs according enterprise requirements\n1.2. Determined defective tools and equipment according to\noperation manuals.\n1.3. Inspected facilities according to standard codes and laws.\n1.4. Prepared production plan and report according to enterprise\nrequirements and reporting procedures.\n2. Resource\nImplications\nThe following resources should be provided:\n2.1 All supplies, materials and farm implements needed during farm\noperations should be readily available at the farm site:\n2.1.1 Farm site\n2.2.1 Office supplies, materials, tools and farm equipment\n2.2 Protective clothing equipment and materials. All workers involved\nin different activities must be fully oriented and cautioned on the\ndifferent specific work activities of the farm.\n2.3 Technical supervisors should have skills and ability in the\nsuccessful implementation of work program activities.\n3. Method of\nAssessment\nCompetency in this unit may be assessed through:\n3.1 Demonstration with oral questioning\n3.2\nWritten examination\n4. Context of\nAssessment\n4.1. Assessment may occur in an appropriately simulated\nenvironment through TESDA accredited assessment centers\n\n--- PDF PAGE 47 ---\nTR-Milking Operation NCII Promulgated February 3, 2017\n\n46\nCORE COMPETENCIES\n\nUNIT OF COMPETENCY\n:\nCONDUCT PRE-MILKING ACTIVITIES\n\nUNIT CODE\n:"
        },
        "source_text": "SOC 413206\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitude required\nto carry-out inventory activities, maintain production record\nand prepare financial records.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1. Carry out\ninventory\nactivities\n1.1 Inventory inputs\nare determined\naccording\nenterprise\nrequirements.\n1.2 Defective tools and\nequipment are\ndetermined\naccording to\noperation manuals\n1.3 Facilities are\ninspected according\nto standard codes\nand laws.\n• Inventory inputs\n• Inventory\nprocedures\n• Types of tools and\nequipment defects\n•\nInspection of\nfacilities\n•\nIndustry rules and\nlaws\n• Determining\ninventory inputs\n• Determining\ndefective tools\nand equipment\n•\nInspecting\nfacilities\n•\nCommunication\nskills\n2. Maintain\nproduction\nrecord\n\n2.1 Production plan are\nprepared according\nto enterprise\nrequirements.\n2.2 Schedule for\nproduction\nactivities are\nprepared based\nfrom enterprise\nrequirements and\nplan.\n2.3 Production report\nare prepared in\naccordance with\nenterprise reporting\nprocedures\n2.4 Input and\nproduction are\nmonitored using\nmonitoring chart.\n• Preparation of\nproduction plan\n• Preparation of\nschedule for\nproduction\nactivities\n• Preparation of\nproduction report\nprocedure\n• Monitoring of input\nand production\n\n• Preparing\nproduction plan\n• Preparing\nschedule for\nproduction\nactivities\n• Preparing\nproduction report\n• Monitoring input\nand production\n• Communication\nskills\n\n--- PDF PAGE 43 ---\nTR-Milking Operation NCII Promulgated February 3, 2017\n\n42\n3. Prepare\nfinancial\nrecords\n3.1. Production cost\nare computed using\nestablished\ncomputation\nprocedures.\n3.2. Revenue is\ncomputed using\nestablished\ncomputation\nprocedures.\n\n• Production costing\nplan\n• Computation of\nproduction cost\nand revenue\n•\nFour fundamental\noperation\n• Computing\nproduction cost\n• Computing\nrevenue\n• Basic\nmathematics skills\n• Communication\nskills\n\n--- PDF PAGE 44 ---\nTR-Milking Operation NCII Promulgated February 3, 2017\n\n43\nRANGE OF VARIABLES\n\nVARIABLE\nSCOPE\n1. Inventory inputs\n\nInventory inputs include:\n1.1 Plant\n1.1.1. Planting materials\n1.1.2. Fertilizer\n1.1.3. Concoctions (Pesticides and insecticides)\n1.1.4. Beneficial microorganisms\n\n1.2 Animals\n1.2.1. Stocks\n1.2.2. Feeds\n1.2.3. Concoctions\n1.2.4. Medications\n1.2.5. Beneficial microorganisms\n\n1.3 Miscellaneous materials\n2. Production activities\nProduction activities include:\n2.1.\nPlant\n2.1.1 Planting\n2.1.2 Fertilizer application\n2.1.3 Pesticides application\n2.1.4 Implementation of bio-security measures\n2.1.5 Irrigation/watering\n2.1.6 Weeding\n2.1.7 Harvesting\n2.1.8 Post-harvesting\n2.2.\nAnimal\n2.2.1 Feeding\n2.2.2 Cleaning and Sanitization\n2.2.3 Implementation of bio-security measures\n2.2.4 Growth and health condition\n2.2.5 Harvesting\n2.2.6 Post harvesting\n2.2.7 Miscellaneous activities\n3. Production report\nProduction report includes:\n3.1.\nCategorize and record quality of harvest\n3.2.\nVolume /quantity of products harvested\n4. Input\nInput includes:\n4.1.\nInput(plant)\n4.1.1 Fertilizer\n4.1.2 Concoctions (Pesticides and insecticides)\n4.1.3 Beneficial microorganisms\n4.2.\nInput(animal)\n4.2.1 Feeds\n4.2.2 Concoctions\n4.2.3 Medications\n4.2.4 Beneficial microorganisms\n4.2.5 Miscellaneous inputs\n\n--- PDF PAGE 45 ---\nTR-Milking Operation NCII Promulgated February 3, 2017\n\n44\n5. Production\nProduction includes:\n5.1\nGrowth rate\n5.2\nSurvival rate\n6. Production cost\nProduction cost includes:\n6.1.\nLabor\n6.2.\nInputs\n6.3.\nTools, equipment and facility depreciation cost\n6.4.\nAdministrative cost\n6.5.\nMiscellaneous\n\n--- PDF PAGE 46 ---\nTR-Milking Operation NCII Promulgated February 3, 2017\n\n45\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1. Determined inventory inputs according enterprise requirements\n1.2. Determined defective tools and equipment according to\noperation manuals.\n1.3. Inspected facilities according to standard codes and laws.\n1.4. Prepared production plan and report according to enterprise\nrequirements and reporting procedures.\n2. Resource\nImplications\nThe following resources should be provided:\n2.1 All supplies, materials and farm implements needed during farm\noperations should be readily available at the farm site:\n2.1.1 Farm site\n2.2.1 Office supplies, materials, tools and farm equipment\n2.2 Protective clothing equipment and materials. All workers involved\nin different activities must be fully oriented and cautioned on the\ndifferent specific work activities of the farm.\n2.3 Technical supervisors should have skills and ability in the\nsuccessful implementation of work program activities.\n3. Method of\nAssessment\nCompetency in this unit may be assessed through:\n3.1 Demonstration with oral questioning\n3.2\nWritten examination\n4. Context of\nAssessment\n4.1. Assessment may occur in an appropriately simulated\nenvironment through TESDA accredited assessment centers\n\n--- PDF PAGE 47 ---\nTR-Milking Operation NCII Promulgated February 3, 2017\n\n46\nCORE COMPETENCIES\n\nUNIT OF COMPETENCY\n:\nCONDUCT PRE-MILKING ACTIVITIES\n\nUNIT CODE\n:"
      }
