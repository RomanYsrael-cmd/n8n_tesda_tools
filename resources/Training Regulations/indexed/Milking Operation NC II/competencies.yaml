nSafety Data Sheet \n(MSDS) \n2.2  Tools and \nutensils are \nchecked and \nsanitized according \nto GMP \n2.3  Materials are \nacquired according \nto work \nrequirement \n \nPPEs \n \nGMP on tools, \nutensils and \nmaterials \npreparation \n \nOSHS on tools, \nutensils and \nmaterials \npreparation \n \nPersonal hygiene\n \nDifferent \ncleaning \nsolutions \n \nComputation of \nconcentration of \ncleaning solution \n \nPreparation of \ncleaning solution \n \nAwareness of \nMaterial Safety \nData Sheet \n(MSDS) \n \nFollow \nProcedures of \npreparation of \n \nWearing PPEs \n \nPracticing GMP, \nOSHS \n \nPracticing \npersonal hygiene\n \nComputing \nconcentration of \ncleaning solution \n \nPreparing \ncleaning solution \n \nFollowing \nprocedures of \npreparing tools, \nutensils and \nmaterials\n\n--- PDF PAGE 49 ---\nTR-Milking Operation NCII                                      Promulgated February 3, 2017 \n \n48\nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \ntools, utensils & \nmaterials \n \nOperation and \nControl \nProcedure (OCP)\n \nHazard Risk \nIdentification \n \nAttitude: \n- Patient \n- Time-conscious \n- Diligent\n3.  Prepare \nanimal for \nmilking \n3.1  PPEs are worn \naccording to GMP \n3.2  Personal hygiene \nis practiced \naccording to \nindustry standards \n3.3  Animal udders are \ncleaned and \ndisinfected \nfollowing Good \nAnimal Husbandry \nPractices (GAHP) \n3.4  Mastitis test is \nconducted \nfollowing \nestablished \nindustry procedure \n3.5  Foremilking is \nperformed to \nensure quality milk \n3.6  Teat dipping is \ndone based \nstandard dairy \npractices \n3.7  Animal is handled \nfor milking \naccording to \nAnimal Welfare Act\n \nPPEs \n \nAnimal Welfare \nAct \n \nGMP on milking \nparlor \npreparation \n \nGAHP on \ncleaning animal \nudders \n \nOSHS on milking \nparlor \npreparation \n \nPersonal hygiene\n \nProcedures in \nworkplace \ninstruction \n \nOperation and \nControl \nProcedure (OCP)\n \nHazard Risk \nIdentification \n \nAttitude: \n- Patient \n- Time-conscious \n- Diligent \n- Animal lover \n \nWearing of PPEs\n \nPracticing GMP, \nOSHS, GAHP \n \nPracticing \npersonal hygiene\n \nFollowing \nworkplace \ninstruction \n \nPracticing \nAnimal Welfare \nAct \n \nPerforming \nMastitis Testing \n \nPerforming \nforemilking \n \nPerforming teats \ndipping \n \nPracticing animal \nhandling\n\n--- PDF PAGE 50 ---\nTR-Milking Operation NCII                                      Promulgated February 3, 2017 \n \n49\nRANGE OF VARIABLES \n \nVARIABLE \nSCOPE \n1. Cleaning solution \n \nCleaning solution may include: \n1.1. Sodium hydroxide (caustic soda) solution (0.5-1% \nsolution) \n1.2. Nitric acid (0.5-1% solution) \n1.3. Sodium hypochlorite (chlorox) \n1.4. Phosphoric acid \n2. Milking machine \nMilking machine includes: \n2.1 Herringbone type \n2.2 Bucket type \n3. Industry procedures \nIndustry procedures include: \n3.1 CIP (clean in place) \n3.2\nCOP (clean out place)\n4. Tools and utensils \nTools and utensils may include: \n4.1 Tools: \n4.1.1 Hands spray \n4.1.2 “Teat dipper” \n4.1.3 Thermometer \n4.1.4 Mastitis test kit \n4.2 Utensils: \n4.2.1 Milk Bucket \n4.2.2 Milk can \n4.2.3 Measuring cup \n4.2.4 Strip cup \n5. Materials \nMaterials may include: \n5.1 Mild liquid detergent  \n5.2 Face towel \n5.3 Paper towel \n5.4 Push brush \n5.5 Scrubbing pads \n5.6 Chlorine \n5.7 Iodine \n6. Handling of animal \nHandling of animals Includes: \n6.1 Feeding the animal with concentrates \n6.2 Providing calm environment (away from disturbances) \n6.3 Positioning and placing in the animal chute \n6.4 Avoid hitting\n\n--- PDF PAGE 51 ---\nTR-Milking Operation NCII                                      Promulgated February 3, 2017 \n \n50"
