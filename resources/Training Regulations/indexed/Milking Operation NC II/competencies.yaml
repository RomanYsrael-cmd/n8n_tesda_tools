nt \nwith the meeting \npurpose and \nestablished \nprotocols \n2.4 Workplace \ninteractions are \nconducted in a \ncourteous manner \n2.5 Questions about \nsimple routine \nworkplace \nprocedures and \nmatters \nconcerning \nworking \nconditions of \nemployment are \nasked and \nresponded to\n Effective \ncommunication \n Different modes of \ncommunication  \n Written \ncommunication \n Organizational \npolicies \n Communication \nprocedures and \nsystems \n Decorum in \nparticipating \nworkplace meetings \nand discussions \n Participating \nskills in \nworkplace \nmeetings and \ndiscussions \n Following simple \nspoken \nlanguage \n Completing \nwork related \ndocuments \n Estimating, \ncalculating and \nrecording \nroutine \nworkplace \nmeasures \n Relating to \npeople of social \nrange in the \nworkplace \n Gathering and \nproviding \ninformation in \nresponse to \nworkplace \nRequirements\n\n--- PDF PAGE 8 ---\nTR-Milking Operation NCII                                      Promulgated February 3, 2017 \n \n7\nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n2.6 Meetings \noutcomes are \ninterpreted and \nimplemented\n3.  Complete \nrelevant work \nrelated \ndocuments \n3.1 Range of forms \nrelating to \nconditions of \nemployment are \ncompleted \naccurately and \nlegibly \n3.2 Workplace data is \nrecorded on \nstandard \nworkplace forms \nand documents \n3.3 Basic \nmathematical \nprocesses are \nused for routine \ncalculations \n3.4 Errors in \nrecording \ninformation on \nforms/ documents \nare identified and \nproperly acted \nupon \n3.5 Reporting \nrequirements to \nsupervisor are \ncompleted \naccording to \norganizational \nguidelines\n Methods of \nmaking/completing \nwork related \ndocuments \n Company \nstandards and \nprocedures in \nmaking work \nrelated documents \n Effective \ncommunication \n Different modes of \ncommunication  \n Written \ncommunication \n Organizational \npolicies \n Communication \nprocedures and \nsystems \n Technology \nrelevant to the \nenterprise and the \nindividual’s work \nresponsibilities \n Documenting \nskills  \n Report writing \nskills \n Making/developi\nng work related \ndocuments \n Perform routine \nworkplace \nduties following \nsimple written \nnotices \n Completing \nwork related \ndocuments \n Estimating, \ncalculating and \nrecording \nroutine \nworkplace \nmeasures \n Ability to relate \nto people of \nsocial range in \nthe workplace\n\n--- PDF PAGE 9 ---\nTR-Milking Operation NCII                                      Promulgated February 3, 2017 \n \n8\nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Appropriate sources \nAppropriate sources may include: \n1.1. \nTeam members \n1.2. \nSuppliers \n1.3. \nTrade personnel \n1.4. \nLocal government \n1.5.\nIndustry bodies\n2. Medium \nMedium may include:  \n2.1 \nMemorandum \n2.2 \nCircular \n2.3 \nNotice \n2.4 \nInformation discussion \n2.5 \nFollow-up or verbal instructions \n2.6\nFace to face communication\n3. Storage \nStorage may include:  \n3.1. \nManual filing system \n3.2.\nComputer-based filing system\n4. Forms \nForms may include:  \n4.1. \nPersonnel forms \n4.2. \nTelephone message forms \n4.3.\nSafety reports\n5. Workplace interactions \nWorkplace interactions may include:  \n5.1 \nFace to face \n5.2 \nTelephone \n5.3 \nElectronic and two-way radio \n5.4 \nWritten including electronic, memos, instruction \nand forms, non-verbal including gestures, signals, \nsigns and diagrams\n6. Protocols \nProtocols may include:  \n6.1. \nObserving meeting \n6.2. \nCompliance with meeting decisions \n6.3.\nObeying meeting instructions\n\n--- PDF PAGE 10 ---\nTR-Milking Operation NCII                                      Promulgated February 3, 2017 \n \n9"
