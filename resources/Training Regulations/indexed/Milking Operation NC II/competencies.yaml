ommunication\nprocedures and\nsystems\n• Technology\nrelevant to the\nenterprise and the\nindividual’s work\nresponsibilities\n• Documenting\nskills\n• Report writing\nskills\n• Making/developi\nng work related\ndocuments\n• Perform routine\nworkplace\nduties following\nsimple written\nnotices\n• Completing\nwork related\ndocuments\n• Estimating,\ncalculating and\nrecording\nroutine\nworkplace\nmeasures\n• Ability to relate\nto people of\nsocial range in\nthe workplace\n\n--- PDF PAGE 9 ---\nTR-Milking Operation NCII Promulgated February 3, 2017\n\n8\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Appropriate sources\nAppropriate sources may include:\n1.1.\nTeam members\n1.2.\nSuppliers\n1.3.\nTrade personnel\n1.4.\nLocal government\n1.5.\nIndustry bodies\n2. Medium\nMedium may include:\n2.1\nMemorandum\n2.2\nCircular\n2.3\nNotice\n2.4\nInformation discussion\n2.5\nFollow-up or verbal instructions\n2.6\nFace to face communication\n3. Storage\nStorage may include:\n3.1.\nManual filing system\n3.2.\nComputer-based filing system\n4. Forms\nForms may include:\n4.1.\nPersonnel forms\n4.2.\nTelephone message forms\n4.3.\nSafety reports\n5. Workplace interactions\nWorkplace interactions may include:\n5.1\nFace to face\n5.2\nTelephone\n5.3\nElectronic and two-way radio\n5.4\nWritten including electronic, memos, instruction\nand forms, non-verbal including gestures, signals,\nsigns and diagrams\n6. Protocols\nProtocols may include:\n6.1.\nObserving meeting\n6.2.\nCompliance with meeting decisions\n6.3.\nObeying meeting instructions\n\n--- PDF PAGE 10 ---\nTR-Milking Operation NCII Promulgated February 3, 2017\n\n9\nEVIDENCE GUIDE\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1.\nPrepared written communication following standard\nformat of the organization\n1.2.\nAccessed information using communication\nequipment\n1.3.\nMade use of relevant terms as an aid to transfer\ninformation effectively\n1.4.\nConveyed information effectively adopting the\nformal or informal communication\n2. Resource Implications\nThe following resources should be provided:\n2.1.\nFax machine\n2.2.\nTelephone\n2.3.\nWriting materials\n2.4.\nInternet\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1.\nDirect Observation\n3.2.\nOral interview and written test\n4. Context for\nAssessment\n4.1. Competency may be assessed in actual workplace\nor at the designated TESDA Accredited Assessment\nCenter.\n\n--- PDF PAGE 11 ---\nTR-Milking Operation NCII Promulgated February 3, 2017\n\n10\nUNIT OF COMPETENCY: WORK IN TEAM ENVIRONMENT\nUNIT CODE\n :"
