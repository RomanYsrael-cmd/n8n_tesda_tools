        "source_text": "500311108\n\nUNIT DESCRIPTOR :\nThis unit covers the outcomes required to comply with\nregulatory\nand\norganizational\nrequirements\nfor\noccupational health and safety.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Identify\nhazards and\nrisks\n1.1 Safety\nregulations and\nworkplace safety\nand hazard control\npractices and\nprocedures are\nclarified and\nexplained based\non organization\nprocedures\n1.2 Hazards/risks in\nthe workplace and\ntheir\ncorresponding\nindicators are\nidentified to\nminimize or\neliminate risk to\nco-workers,\nworkplace and\nenvironment in\naccordance with\norganization\nprocedures\n1.3 Contingency\nmeasures during\nworkplace\naccidents, fire and\nother emergencies\nare recognized\nand established in\naccordance with\norganization\nprocedures\n• Company\nworkplace safety\nregulations\n• Industry hazard\ncontrol practices\nand procedures\n• Internationally\nrecognized OSH\nprocedures and\npractices and\nregulations\n• PPE types and\nuses\n• Personal\nhygiene\npractices\n• Hazards/risks\nidentification and\ncontrol\n• Threshold Limit\nValue -TLV\n• OSH indicators\n• Organization\nsafety and\nhealth protocol\n• Safety\nconsciousness\n• Health\nconsciousness\n• Clarifying and\nexplaining safety\nregulations and\nworkplace safety\nand hazard\ncontrol\n• Identifying\nhazards/risks in\nthe workplace\nand their\ncorresponding\nindicators\n• Recognizing\ncontingency\nmeasures during\nworkplace\naccidents, fire\nand other\nemergencies\n• Practice of\npersonal\nhygiene\n• Interpersonal\nskills\n• Communication\nskills\n\n--- PDF PAGE 20 ---\nTR-Milking Operation NCII Promulgated February 3, 2017\n\n19\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n2. Evaluate\nhazards and\nrisks\n2.1 Terms of\nmaximum tolerable\nlimits which when\nexceeded will\nresult in harm or\ndamage are\nidentified based on\nthreshold limit\nvalues (TLV)\n2.2 Effects of the\nhazards are\ndetermined\n2.3 OSH issues and/or\nconcerns and\nidentified safety\nhazards are\nreported to\ndesignated\npersonnel in\naccordance with\nworkplace\nrequirements and\nrelevant workplace\nOSH legislation\n• Methods of\nidentifying terms\nof maximum\ntolerable limits\n• Hazard effects\n• Reporting\nmethods on\nOSH\nissues/concerns\n• OSH procedures\nand practices\nand regulations\n• PPE types and\nuses\n• Hazards/risks\nidentification and\ncontrol\n• Threshold Limit\nValue -TLV\n• OSH indicators\n• Organization\nsafety and\nhealth protocol\n• Safety\nconsciousness\n• Health\nconsciousness\n• Identifying terms\nof maximum\ntolerable limits\n• Determining\neffects of\nhazards and\nrisks\n• Reporting OSH\nissues and/or\nconcerns\n• Identifying safety\nhazards\n• Hazards/risks\nidentification and\ncontrol skills\n• Interpersonal\nskills\n• Communication\nskills\n3. Control\nhazards and\nrisks\n3.1 Occupational\nSafety and Health\n(OSH) procedures\nfor controlling\nhazards/risks in\nworkplace are\nconsistently\nfollowed\n3.2 Procedures for\ndealing with\nworkplace\naccidents, fire and\nemergencies are\nfollowed in\naccordance with\norganization OSH\npolicies\n• Ways of\nfollowing\nOccupational\nSafety and\nHealth (OSH)\nprocedures for\ncontrolling\nhazards/risks in\nworkplace\n• Ways of\nfollowing\nprocedures for\ndealing with\nworkplace\naccidents, fire\nand\nemergencies\n• Following\noccupational\nhealth and\nsafety (OSH)\nprocedures for\ncontrolling\nhazards/risks in\nworkplace\n• Following\nprocedures for\ndealing with\nworkplace\naccidents, fire\nand\nemergencies\n• Using correctly\npersonal\n\n--- PDF PAGE 21 ---\nTR-Milking Operation NCII Promulgated February 3, 2017\n\n20\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n3.3 Personal\nprotective\nequipment (PPE)\nis correctly used in\naccordance with\norganization OSH\nprocedures and\npractices\n3.4 Appropriate\nassistance is\nprovided in the\nevent of a\nworkplace\nemergency in\naccordance with\nestablished\norganization\nprotocol\n• Types and use\nof personal\nprotective\nequipment\n(PPE)\n• OSH procedures\nand practices\nand regulations\n\n• Methods and\ntechniques in\nproviding\nappropriate\nassistance in the\nevent of a\nworkplace\nemergency\n• Hazards/risks\nidentification and\ncontrol\nprotective\nequipment\n(PPE)\n\n• Providing\nassistance in the\nevent of a\nworkplace\nemergency in\naccordance with\nestablished\norganization\nprotocol\n4. Maintain OSH\nawareness\n4.1 Emergency-\nrelated drills and\ntrainings are\nparticipated in as\nper established\norganization\nguidelines and\nprocedures\n4.2 OSH personal\nrecords are\ncompleted and\nupdated in\naccordance with\nworkplace\nrequirements\n• Participation\nprocedures in\nemergency-\nrelated drills and\ntrainings\n• Ways of\ncompleting and\nupdating OSH\npersonal records\n• OSH procedures\nand practices\nand regulations\n• OSH indicators\n• Participating in\nemergency-\nrelated drills and\ntrainings\n• Completing and\nupdating OSH\npersonal records\n\n--- PDF PAGE 22 ---\nTR-Milking Operation NCII Promulgated February 3, 2017\n\n21\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Safety regulations\nSafety regulations may include:\n1.1\nClean Air Act\n1.2\nBuilding code\n1.3\nNational Electrical and Fire Safety Codes\n1.4\nWaste management statutes and rules\n1.5\nPhilippine Occupational Safety and Health\nStandards\n1.6\nDOLE regulations on safety legal requirements\n1.7\nECC regulations\n2. Hazards/Risks\nHazards/risks may include:\n2.1\nPhysical hazards – impact, illumination, pressure,\nnoise, vibration, temperature, radiation\n2.2\nBiological hazards - bacteria, viruses, plants,\nparasites, mites, molds, fungi, insects\n2.3\nChemical hazards – dusts, fibers, mists, fumes,\nsmoke, gasses, vapors\n2.4\nErgonomics\n2.4.1 Psychological factors – over exertion/\nexcessive force, awkward/static positions,\nfatigue, direct pressure, varying metabolic\ncycles\n2.4.2 Physiological factors – monotony, personal\nrelationship, work out cycle\n3. Contingency measures\nContigency measures may include:\n3.1\nEvacuation\n3.2\nIsolation\n3.3\nDecontamination\n3.4\n(Calling designed) emergency personnel\n4. PPE\nPPEs may include:\n4.1\nMask\n4.2\nGloves\n4.3\nGoggles\n4.4\nHair Net/cap/bonnet\n4.5\nFace mask/shield\n4.6\nEar muffs\n4.7\nApron/Gown/coverall/jump suit\n4.8\nAnti-static suits\n5. Emergency-related\ndrills and training\nEmergency-related drills traning may include:\n5.1\nFire drill\n5.2\nEarthquake drill\n5.3\nBasic life support/CPR\n5.4\nFirst aid\n5.5\nSpillage control\n5.6\nDecontamination of chemical and toxic\n5.7\nDisaster preparedness/management\n\n--- PDF PAGE 23 ---\nTR-Milking Operation NCII Promulgated February 3, 2017\n\n22\nVARIABLE\nRANGE\n6. OSH personal records\nOSH personal records may include:\n6.1\nMedical/Health records\n6.2\nIncident reports\n6.3\nAccident reports\n6.4\nOSH -related training completed\n\n--- PDF PAGE 24 ---\nTR-Milking Operation NCII Promulgated February 3, 2017\n\n23\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nExplained clearly established workplace safety and\nhazard control practices and procedures\n1.2\nIdentified hazards/risks in the workplace and its\ncorresponding indicators in accordance with\ncompany procedures\n1.3\nRecognized contingency measures during\nworkplace accidents, fire and other emergencies\n1.4\nIdentified terms of maximum tolerable limits based\non threshold limit value- TLV\n1.5\nFollowed Occupational Health and Safety (OSH)\nprocedures for controlling hazards/risks in\nworkplace\n1.6\nUsed Personal Protective Equipment (PPE) in\naccordance with company OSH procedures and\npractices\n1.7\nCompleted and updated OSH personal records in\naccordance with workplace requirements\n2. Resource\nImplications\nThe following resources should be provided:\n2.1\nWorkplace or assessment location\n2.2\nOSH personal records\n2.3\nPPE\n2.4\nHealth records\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1\nPortfolio Assessment\n3.2\nInterview\n3.3\nCase Study/Situation\n4. Context for\nAssessment\n4.1\nCompetency may be assessed in the actual\nworkplace or at the designated TESDA Accredited\nAssessment Center.\n\n--- PDF PAGE 25 ---\nTR-Milking Operation NCII Promulgated February 3, 2017\n\n24\nCOMMON COMPETENCIES\n\nUNIT OF COMPETENCY :\nAPPLY SAFETY MEASURES IN FARM OPERATIONS\nUNIT CODE\n:"
