        "evidence_guide": {
          "source_text": "1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nExplained clearly established workplace safety and\nhazard control practices and procedures\n1.2\nIdentified hazards/risks in the workplace and its\ncorresponding indicators in accordance with\ncompany procedures\n1.3\nRecognized contingency measures during\nworkplace accidents, fire and other emergencies\n1.4\nIdentified terms of maximum tolerable limits based\non threshold limit value- TLV\n1.5\nFollowed Occupational Health and Safety (OSH)\nprocedures for controlling hazards/risks in\nworkplace\n1.6\nUsed Personal Protective Equipment (PPE) in\naccordance with company OSH procedures and\npractices\n1.7\nCompleted and updated OSH personal records in\naccordance with workplace requirements\n2. Resource\nImplications\nThe following resources should be provided:\n2.1\nWorkplace or assessment location\n2.2\nOSH personal records\n2.3\nPPE\n2.4\nHealth records\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1\nPortfolio Assessment\n3.2\nInterview\n3.3\nCase Study/Situation\n4. Context for\nAssessment\n4.1\nCompetency may be assessed in the actual\nworkplace or at the designated TESDA Accredited\nAssessment Center.\n\n--- PDF PAGE 25 ---\nTR-Milking Operation NCII Promulgated February 3, 2017\n\n24\nCOMMON COMPETENCIES\n\nUNIT OF COMPETENCY :\nAPPLY SAFETY MEASURES IN FARM OPERATIONS\nUNIT CODE\n:"
