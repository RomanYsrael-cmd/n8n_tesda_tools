        "source_text": "--- PDF PAGE 6 ---\nTR-Milking Operation NCII                                      Promulgated February 3, 2017 \n \n5\nSECTION 2 COMPETENCY STANDARDS \n \nThis section gives the details and contents of the units of competency required \nin MILKING OPERATION NC II. These units of competency are categorized into basic, \ncommon and core competencies. \n \n \nBASIC COMPETENCIES \n \nUNIT OF COMPETENCY :    PARTICIPATE IN WORKPLACE COMMUNICATION \nUNIT CODE \n     :    500311105 \nUNIT DESCRIPTOR      : This unit covers the knowledge, skills and attitudes   \nrequired to gather, interpret and convey information in \nresponse to workplace requirements. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1.  Obtain and \nconvey \nworkplace \ninformation \n1.1 Specific and \nrelevant \ninformation is \naccessed from \nappropriate \nsources  \n1.2 Effective \nquestioning, \nactive listening \nand speaking \nskills are used to \ngather and \nconvey \ninformation \n1.3 Appropriate \nmedium is used \nto transfer \ninformation and \nideas \n1.4 Appropriate non- \nverbal \ncommunication \nis used \n1.5 Appropriate lines \nof \ncommunication \nwith supervisors \nand colleagues \n Procedure of \ngathering \nworkplace \ninformation \n Techniques in \ngathering \ninformation \n Effective methods \nof conveying \ninformation \n Written \ncommunication \nmethods \n Techniques in \nconveying \ncommunication \n Different modes of \ncommunication  \n Organizational \npolicies \n Communication \nprocedures and \nsystems \n Technology \nrelevant to the \nenterprise and the \nindividual’s work \nresponsibilities\n Gathering of \nworkplace \ninformation skills\n Sourcing of \ninformation skills\n Sorting of \ninformation skills\n Obtaining \nworkplace \ninformation skills\n Conveying \nworkplace \ninformation skills\n Gathering and \nproviding \ninformation in \nresponse to \nworkplace \nRequirements\n\n--- PDF PAGE 7 ---\nTR-Milking Operation NCII                                      Promulgated February 3, 2017 \n \n6\nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \nare identified and \nfollowed \n1.6 Defined \nworkplace \nprocedures for \nthe location and \nstorage of \ninformation are \nused \n1.7 Personal \ninteraction is \ncarried out \nclearly and \nconcisely\n2.  Participate in \nworkplace \nmeetings and \ndiscussions \n2.1 Team meetings \nare attended on \ntime \n2.2 Own opinions are \nclearly expressed \nand those of \nothers are \nlistened to without \ninterruption \n2.3 Meeting inputs \nare consistent \nwith the meeting \npurpose and \nestablished \nprotocols \n2.4 Workplace \ninteractions are \nconducted in a \ncourteous manner \n2.5 Questions about \nsimple routine \nworkplace \nprocedures and \nmatters \nconcerning \nworking \nconditions of \nemployment are \nasked and \nresponded to\n Effective \ncommunication \n Different modes of \ncommunication  \n Written \ncommunication \n Organizational \npolicies \n Communication \nprocedures and \nsystems \n Decorum in \nparticipating \nworkplace meetings \nand discussions \n Participating \nskills in \nworkplace \nmeetings and \ndiscussions \n Following simple \nspoken \nlanguage \n Completing \nwork related \ndocuments \n Estimating, \ncalculating and \nrecording \nroutine \nworkplace \nmeasures \n Relating to \npeople of social \nrange in the \nworkplace \n Gathering and \nproviding \ninformation in \nresponse to \nworkplace \nRequirements\n\n--- PDF PAGE 8 ---\nTR-Milking Operation NCII                                      Promulgated February 3, 2017 \n \n7\nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n2.6 Meetings \noutcomes are \ninterpreted and \nimplemented\n3.  Complete \nrelevant work \nrelated \ndocuments \n3.1 Range of forms \nrelating to \nconditions of \nemployment are \ncompleted \naccurately and \nlegibly \n3.2 Workplace data is \nrecorded on \nstandard \nworkplace forms \nand documents \n3.3 Basic \nmathematical \nprocesses are \nused for routine \ncalculations \n3.4 Errors in \nrecording \ninformation on \nforms/ documents \nare identified and \nproperly acted \nupon \n3.5 Reporting \nrequirements to \nsupervisor are \ncompleted \naccording to \norganizational \nguidelines\n Methods of \nmaking/completing \nwork related \ndocuments \n Company \nstandards and \nprocedures in \nmaking work \nrelated documents \n Effective \ncommunication \n Different modes of \ncommunication  \n Written \ncommunication \n Organizational \npolicies \n Communication \nprocedures and \nsystems \n Technology \nrelevant to the \nenterprise and the \nindividual’s work \nresponsibilities \n Documenting \nskills  \n Report writing \nskills \n Making/developi\nng work related \ndocuments \n Perform routine \nworkplace \nduties following \nsimple written \nnotices \n Completing \nwork related \ndocuments \n Estimating, \ncalculating and \nrecording \nroutine \nworkplace \nmeasures \n Ability to relate \nto people of \nsocial range in \nthe workplace\n\n--- PDF PAGE 9 ---\nTR-Milking Operation NCII                                      Promulgated February 3, 2017 \n \n8\nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Appropriate sources \nAppropriate sources may include: \n1.1. \nTeam members \n1.2. \nSuppliers \n1.3. \nTrade personnel \n1.4. \nLocal government \n1.5.\nIndustry bodies\n2. Medium \nMedium may include:  \n2.1 \nMemorandum \n2.2 \nCircular \n2.3 \nNotice \n2.4 \nInformation discussion \n2.5 \nFollow-up or verbal instructions \n2.6\nFace to face communication\n3. Storage \nStorage may include:  \n3.1. \nManual filing system \n3.2.\nComputer-based filing system\n4. Forms \nForms may include:  \n4.1. \nPersonnel forms \n4.2. \nTelephone message forms \n4.3.\nSafety reports\n5. Workplace interactions \nWorkplace interactions may include:  \n5.1 \nFace to face \n5.2 \nTelephone \n5.3 \nElectronic and two-way radio \n5.4 \nWritten including electronic, memos, instruction \nand forms, non-verbal including gestures, signals, \nsigns and diagrams\n6. Protocols \nProtocols may include:  \n6.1. \nObserving meeting \n6.2. \nCompliance with meeting decisions \n6.3.\nObeying meeting instructions\n\n--- PDF PAGE 10 ---\nTR-Milking Operation NCII                                      Promulgated February 3, 2017 \n \n9\nEVIDENCE GUIDE \n1. Critical aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1. \nPrepared written communication following standard \nformat of the organization \n1.2. \nAccessed information using communication \nequipment \n1.3. \nMade use of relevant terms as an aid to transfer \ninformation effectively \n1.4. \nConveyed information effectively adopting the \nformal or informal communication\n2. Resource Implications \nThe following resources should be provided: \n2.1. \nFax machine \n2.2. \nTelephone \n2.3. \nWriting materials \n2.4. \nInternet \n3. Methods of \nAssessment \nCompetency in this unit may be assessed through: \n3.1. \nDirect Observation \n3.2. \nOral interview and written test \n4. Context for \nAssessment \n4.1. Competency may be assessed in actual workplace \nor at the designated TESDA Accredited Assessment \nCenter.\n",
