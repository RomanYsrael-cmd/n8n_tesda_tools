m equipment include: \n1.1 Engine \n1.2 Pumps \n1.3 Generators \n1.4 Sprayers\n2. Farm tools \nFarm tools includes: \n2.1 Sickle \n2.2 Cutters \n2.3 Weighing scales \n2.4 Hand tools \n2.5 \nMeasuring tools \n2.6 Garden tools\n3. Pre-operation check-up \nPre-operation check –up includes: \n3.1 Tires \n3.2 Brake fluid \n3.3 Fuel \n3.4 Water \n3.5 Oil \n3.6 Lubricants \n3.7 Battery\n \nEVIDENCE GUIDE \n1. Critical Aspects \nof  Competency \nAssessment requires evidence that the candidate: \n1.1 Correctly identified appropriate farm tools and equipment \n1.2 Operated farm equipment according to manual \nspecification  \n1.3\nPerformed preventive maintenance\n2. \nResource \nImplications \nThe following resources should be provided: \n2.1 Service/operational manual of farm tools and equipment \n2.2 Tools and equipment \n2.3 Farm implements \n3. \nMethod of \nAssessment \n \nCompetency in this unit must be assessed through: \n3.1 Direct observation  \n3.2 Practical demonstration \n3.3\nThird Party Report\n4. \nContext of \nAssessment \n4.1 \nCompetency may be assessed in the actual workplace \nor at the designated TESDA Accredited Assessment \nCenter.\n",
