        "source_title": "CONDUCT PRE-MILKING ACTIVITIES",
        "source_text": "--- PDF PAGE 47 ---\nTR-Milking Operation NCII                                      Promulgated February 3, 2017 \n \n46\nCORE COMPETENCIES \n \nUNIT OF COMPETENCY \n: \nCONDUCT PRE-MILKING ACTIVITIES \n \nUNIT CODE  \n: \nAFF751301 \nUNIT DESCRIPTOR \n: \nThis competency unit covers the knowledge, skills \nand    attitude to prepare milker for operation, prepare \nmilking parlor, prepare animal for milking and prepare \ntools, utensils, materials. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n1.  Prepare \nmilking \nparlor and \nmachinery \n1.1  PPEs are worn \naccording to GMP \nand OSH \n1.2  Personal hygiene \nis practiced \naccording to \nindustry standards \n1.3  Cleaning solution \nis prepared \nfollowing Material \nSafety Data Sheet \n(MSDS) \n1.4  Milking parlor are \ncleaned and \ndisinfected \naccording to GMP \n1.5  Milking machine \nis cleaned and \nsanitized following \nindustry \nprocedures \n \nPPEs \n \nGMP on milking \nparlor \npreparation \n \nOSHS on milking \nparlor \npreparation \n \nPersonal hygiene\n \nDifferent \ncleaning \nsolutions \n \nComputation of \nconcentration of \ncleaning solution \n \nPreparation of \ncleaning and \ndisinfectant \nsolution \n \nAwareness of \nMaterial Safety \nData Sheet \n(MSDS) \n \nProcedures in \ncleaning and \ndisinfecting \nmilking parlor \n \nFamiliarization \non the different \nmilking machine \nand its \ncomponents\n \nWearing of PPEs\n \nPracticing GMP, \nOSHS \n \nPracticing \npersonal hygiene\n \nComputing \nconcentration of \ncleaning solution \n \nPreparing \ncleaning solution \n \nFollowing \nprocedures in \nMSDS \n \nCleaning and \ndisinfecting \nmilking parlor \n \nCleaning and \nsanitizing milking \nmachine \n \nFollowing \nprocedures of \nCIP and COP\n\n--- PDF PAGE 48 ---\nTR-Milking Operation NCII                                      Promulgated February 3, 2017 \n \n47\nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n \nProcedures in \ncleaning and \nsanitizing milking \nmachine \n \nIndustry \nprocedures of \ncleaning (CIP \nand COP) \n \nOperation and \nControl \nProcedure (OCP)\n \nHazard Risk \nIdentification \n \nAttitude: \n- Patient \n- Time-\nconscious \n- Diligent \n- Animal lover\n2.  Prepare \ntools, \nutensils \nand \nmaterials \n2.1  Sanitizing solution \nis prepared \nfollowing Material \nSafety Data Sheet \n(MSDS) \n2.2  Tools and \nutensils are \nchecked and \nsanitized according \nto GMP \n2.3  Materials are \nacquired according \nto work \nrequirement \n \nPPEs \n \nGMP on tools, \nutensils and \nmaterials \npreparation \n \nOSHS on tools, \nutensils and \nmaterials \npreparation \n \nPersonal hygiene\n \nDifferent \ncleaning \nsolutions \n \nComputation of \nconcentration of \ncleaning solution \n \nPreparation of \ncleaning solution \n \nAwareness of \nMaterial Safety \nData Sheet \n(MSDS) \n \nFollow \nProcedures of \npreparation of \n \nWearing PPEs \n \nPracticing GMP, \nOSHS \n \nPracticing \npersonal hygiene\n \nComputing \nconcentration of \ncleaning solution \n \nPreparing \ncleaning solution \n \nFollowing \nprocedures of \npreparing tools, \nutensils and \nmaterials\n\n--- PDF PAGE 49 ---\nTR-Milking Operation NCII                                      Promulgated February 3, 2017 \n \n48\nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \ntools, utensils & \nmaterials \n \nOperation and \nControl \nProcedure (OCP)\n \nHazard Risk \nIdentification \n \nAttitude: \n- Patient \n- Time-conscious \n- Diligent\n3.  Prepare \nanimal for \nmilking \n3.1  PPEs are worn \naccording to GMP \n3.2  Personal hygiene \nis practiced \naccording to \nindustry standards \n3.3  Animal udders are \ncleaned and \ndisinfected \nfollowing Good \nAnimal Husbandry \nPractices (GAHP) \n3.4  Mastitis test is \nconducted \nfollowing \nestablished \nindustry procedure \n3.5  Foremilking is \nperformed to \nensure quality milk \n3.6  Teat dipping is \ndone based \nstandard dairy \npractices \n3.7  Animal is handled \nfor milking \naccording to \nAnimal Welfare Act\n \nPPEs \n \nAnimal Welfare \nAct \n \nGMP on milking \nparlor \npreparation \n \nGAHP on \ncleaning animal \nudders \n \nOSHS on milking \nparlor \npreparation \n \nPersonal hygiene\n \nProcedures in \nworkplace \ninstruction \n \nOperation and \nControl \nProcedure (OCP)\n \nHazard Risk \nIdentification \n \nAttitude: \n- Patient \n- Time-conscious \n- Diligent \n- Animal lover \n \nWearing of PPEs\n \nPracticing GMP, \nOSHS, GAHP \n \nPracticing \npersonal hygiene\n \nFollowing \nworkplace \ninstruction \n \nPracticing \nAnimal Welfare \nAct \n \nPerforming \nMastitis Testing \n \nPerforming \nforemilking \n \nPerforming teats \ndipping \n \nPracticing animal \nhandling\n\n--- PDF PAGE 50 ---\nTR-Milking Operation NCII                                      Promulgated February 3, 2017 \n \n49\nRANGE OF VARIABLES \n \nVARIABLE \nSCOPE \n1. Cleaning solution \n \nCleaning solution may include: \n1.1. Sodium hydroxide (caustic soda) solution (0.5-1% \nsolution) \n1.2. Nitric acid (0.5-1% solution) \n1.3. Sodium hypochlorite (chlorox) \n1.4. Phosphoric acid \n2. Milking machine \nMilking machine includes: \n2.1 Herringbone type \n2.2 Bucket type \n3. Industry procedures \nIndustry procedures include: \n3.1 CIP (clean in place) \n3.2\nCOP (clean out place)\n4. Tools and utensils \nTools and utensils may include: \n4.1 Tools: \n4.1.1 Hands spray \n4.1.2 “Teat dipper” \n4.1.3 Thermometer \n4.1.4 Mastitis test kit \n4.2 Utensils: \n4.2.1 Milk Bucket \n4.2.2 Milk can \n4.2.3 Measuring cup \n4.2.4 Strip cup \n5. Materials \nMaterials may include: \n5.1 Mild liquid detergent  \n5.2 Face towel \n5.3 Paper towel \n5.4 Push brush \n5.5 Scrubbing pads \n5.6 Chlorine \n5.7 Iodine \n6. Handling of animal \nHandling of animals Includes: \n6.1 Feeding the animal with concentrates \n6.2 Providing calm environment (away from disturbances) \n6.3 Positioning and placing in the animal chute \n6.4 Avoid hitting\n\n--- PDF PAGE 51 ---\nTR-Milking Operation NCII                                      Promulgated February 3, 2017 \n \n50\nEVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1. Prepared milking parlor and machinery \n2. Prepared tools, utensils and materials \n3. Prepared animal for milking \n4. Practiced of GMP, HACCP, GAHP and OSHS\n2. Resource \nImplications \nThe following resources should be provided: \n2.1 Dairy animal \n2.2 Milking Parlor \n2.3 Milking machine \n2.4 Tools, utensils and materials to demonstrate the tasks \nrequired \n2.5  PPE \n2.6 References and Manual\n3. Method of \nAssessment \nCompetency in this unit must be assessed through: \n3.1 Written exam \n3.2 Demonstration with oral questioning\n4. Context of \nAssessment \n4.1 Competency may be assessed in the actual \nworkplace or at the designated TESDA Accredited \nAssessment Center.\n",
