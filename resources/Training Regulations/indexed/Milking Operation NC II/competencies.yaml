        "source_title": "WORK IN TEAM ENVIRONMENT",
        "source_text": "--- PDF PAGE 11 ---\nTR-Milking Operation NCII                                      Promulgated February 3, 2017 \n \n10\nUNIT OF COMPETENCY:    WORK IN TEAM ENVIRONMENT \nUNIT CODE \n    :     500311106 \nUNIT DESCRIPTOR     : \nThis unit covers the skills, knowledge and attitudes to \nidentify role and responsibility as a member of a team. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Describe team \nrole and scope\n1.1 The role and \nobjective of the \nteam is identified \nfrom available \nsources of \ninformation \n1.2 Team \nparameters, \nreporting \nrelationships and \nresponsibilities \nare identified \nfrom team \ndiscussions and \nappropriate \nexternal sources\n Company \nvision/mission \nstatements \n Company policies \nand employee \ncode of conduct  \n Communication \nprocess \n Team structure \n Team roles \n Group planning \nand decision \nmaking \n Communicating \nskills \nappropriately \nand  consistent \nwith the culture \nof the \nworkplace \n Adopting skills \nto team role \nand scope of \nresponsibilities \n2. Identify own \nrole and \nresponsibility \nwithin team \n2.1 Individual role \nand \nresponsibilities \nwithin the team \nenvironment are \nidentified \n2.2 Roles and \nresponsibility of \nother team \nmembers are \nidentified and \nrecognized \n2.3 Reporting \nrelationships \nwithin team and \nexternal to team \nare identified \n Company \nvision/mission \nstatements \n Company policies \nand employee \ncode of conduct  \n Communication \nprocess \n Team structure \n Team roles \n Group planning \nand decision \nmaking \n Methods and \ntechniques of role \nand responsibility \nidentification with \na team\n Communicating \nskills \nappropriately \nand  consistent \nwith the culture \nof the \nworkplace \n Role and \nresponsibility \nidentification \nskills\n\n--- PDF PAGE 12 ---\nTR-Milking Operation NCII                                      Promulgated February 3, 2017 \n \n11\nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n3. Work as a \nteam member  \n3.1 Effective and \nappropriate \nforms of \ncommunications \nare used and \ninteractions \nundertaken with \nteam members \nwho contribute to \nknown team \nactivities and \nobjectives \n3.2 Effective and \nappropriate \ncontributions are \nmade to \ncomplement \nteam activities \nand objectives, \nbased on \nindividual skills \nand \ncompetencies \nand workplace \ncontext \n \n3.3 SOP/Protocols in \nreporting are \nobserved  \n \n3.4 Contribute to the \ndevelopment of \nteam work plans \nbased on an \nunderstanding of  \nteam’s role and \nobjectives and \nindividual \ncompetencies of \nthe members\n Approaches of \ninteracting with \nteam members \n Types of \ncommunications \nused in effective \ninteraction with \nteam members \n Methods of \nworking as a team\n Techniques in \nworking as a team\n \n Team working \nskills \n Communicating \nskills \nappropriately \nand consistent \nwith the culture \nof the \nworkplace \n Skills in \nobserving \nprotocols when \nmaking reports \n Using standard \nprocedures \nwhen making \nreports \n Developing \nteamwork plans \nbased on \nteam’s role and \nobjectives\n\n--- PDF PAGE 13 ---\nTR-Milking Operation NCII                                      Promulgated February 3, 2017 \n \n12\nRANGE OF VARIABLES \nVARIABLE\nRANGE\n1. Role and objective of \nteam  \nRole and objective of team may include: \n1.1. Work activities in a team environment with \nenterprise or specific sector \n1.2. Limited discretion, initiative and judgment maybe \ndemonstrated on the job, either individually or in a \nteam environment\n2. Sources of information \nSources of information may include: \n2.1. Standard operating and/or other workplace \nprocedures \n2.2. Job procedures \n2.3. Machine/equipment manufacturer’s specifications \nand instructions \n2.4. Organizational or external personnel \n2.5. Client/supplier instructions \n2.6. Quality standards \n2.7. OSH and environmental standards\n3. Workplace context \nWorkplace context may include: \n3.1. Work procedures and practices \n3.2. Conditions of work environments \n3.3. Legislation and industrial agreements \n3.4. Standard work practice including the storage, safe \nhandling and disposal of chemicals \n3.5. Safety, environmental, housekeeping and quality \nguidelines\n\n--- PDF PAGE 14 ---\nTR-Milking Operation NCII                                      Promulgated February 3, 2017 \n \n13\nEVIDENCE GUIDE \n1. Critical aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1. \nOperated in a team to complete workplace activity \n1.2. \nWorked effectively with others \n1.3. \nConveyed information in written or oral form \n1.4. \nSelected and used appropriate workplace language \n1.5. \nFollowed designated work plan for the job \n1.6.\nReported outcomes \n2. Resource Implications \nThe following resources should be provided: \n2.1. \nAccess to relevant workplace or appropriately \nsimulated environment where assessment can take \nplace \n2.2.\nMaterials relevant to the proposed activity or tasks\n3. Methods of \nAssessment \nCompetency in this unit may be assessed through: \n3.1. \nObservation   of the individual member in relation to \nthe work activities of the group \n3.2. \nObservation of simulation and or role play involving \nthe participation of individual member to the \nattainment of organizational goal \n3.3. \nCase studies and scenarios as a basis for \ndiscussion of issues and strategies in teamwork\n4. Context for \nAssessment \n4.1. \nCompetency may be assessed in actual workplace \nor at the designated TESDA Accredited \nAssessment Center.\n",
