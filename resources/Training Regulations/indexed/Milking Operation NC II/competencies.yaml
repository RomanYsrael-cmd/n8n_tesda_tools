        "source_text": "AFF 321206\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes\nrequired to process farm wastes. It comprises functions\nsuch as collecting farm wastes, conducting waste\nidentification and segregation, treating and processing\nfarm wastes and performing housekeeping duties.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1. Collect farm\nwastes\n1.1 Tools and\nmaterials are\nprepared for\ncollection of farm\nwastes.\n1.2 Wastes are\ncollected following\nOSHS and waste\ncollection\nrequirements and\nplan.\n1.3 Dangerous and\nhazardous\nwastes are\ncollected following\nthe\nHAZMAT(hazardo\nus material)\nprotocol.\n1.4 Appropriate\npersonal\nprotective\nequipment (PPE)\nare worn as\nprescribed by\nOccupational\nSafety and Health\nStandards\n(OSHS).\n• Types of tools\nand materials\n• Uses of tools\nand materials\n• Farm wastes\ncollection\n• Dangerous and\nhazardous\nwastes\n• Waste\ncollection\nrequirements\nand plan\n• PPE\n• OSHS\n• HAZMAT\nprotocol\n\n• Preparing tools\nand materials\n• Collecting wastes\n• Collecting\ndangerous and\nhazardous wastes\n• Wearing PPEs\n• Following\nHAZMAT protocol\nand OSHS\n\n--- PDF PAGE 37 ---\nTR-Milking Operation NCII Promulgated February 3, 2017\n\n36\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n2 Identify and\nsegregate\nwastes\n\n2.2 Wastes are\nidentified by\ncategories\naccording to\nindustry\nstandards and\nenvironmental\nlegislation.\n2.3 Wastes are\nsegregated\naccording to\norganizational\nrequirements and\nrelevant\nlegislation.\n2.4 Sorted waste is\nplaced into\nlabelled\ncontainer to\navoid littering\nand prevent\ncross-\ncontamination.\n2.5 Information on\nwaste is obtained\nby asking\nauthority to\nensure correct\nidentification.\n• Types and\ncategories of\nwastes\n• Procedure of\nwaste\nidentification and\nsegregation\n• Labelling of\nwaste containers\n• Avoidance of\nlittering and\ncross-\ncontamination\n• Information\nsourcing on\nwaste\nidentification\n• Environmental\nStandards for\nwaste\nmanagement\n• OSHS\n• Identifying wastes\n• Segregating\nwastes\n• Placing sorted\nwaste to labeled\ncontainer\n• Obtaining\ninformation on\nwaste\n• Practicing OSHS\n\n3 Treat and\nprocess farm\nwastes\n3.2 Dangerous and\nhazardous\nwastes are\nhandled\naccording to\norganizational\nrequirements and\nrelevant\nlegislation\nfollowing OSHS\nprocedures.\n3.3 Processing of\nfarm wastes is\ndone following\nenvironmental\n• Handling of\ndangerous\nwastes\n• Processing of\nfarm wastes\n• Application of 3\nRs\n• Disposal of farm\nwastes\n• OSHS\n• Handling of\ndangerous and\nhazardous\nwastes\n• Processing of farm\nwastes\n• Applying principles\nof 3Rs\n• Disposing farm\nwastes\n• Practicing and\napplying OSHS\nand environmental\n\n--- PDF PAGE 38 ---\nTR-Milking Operation NCII Promulgated February 3, 2017\n\n37\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\nlegislation and\ncodes.\n3.4 Principles of 3Rs\n(reduce, reuse\nand recycle) are\napplied\naccordingly.\n3.5 Farm wastes are\ndisposed of\naccording to\nenvironmental\nlegislation and\ncodes.\n• Environmental\nLegislation and\nCodes\n\nlegislation and\ncodes\n\n4 Perform\nhousekeeping\n4.1 Appropriate\nwarning signs\nand labels are\ndisplayed in\nconspicuous\nplaces around\nthe workplace.\n4.2 Work area is\ncleaned\naccording to 5S\nprinciples.\n4.3 Tools are\nchecked, cleaned\nand stowed\naccording to\nestablished\nindustry\nprocedures and\nfollowing user’s\nmanual.\n4.4 Materials are\nstored following\nindustry standard\nprocedures and\nmanufacturer’s\nspecifications.\n4.5 PPE is checked\nfor damage prior\nto ensuring that\nclean and\nundamaged\n• Types of\nwarning signs\nand labels\n• Placing warning\nsigns and labels\non conspicuous\nareas\n• Checking,\ncleaning and\nstowing\nprocedure of\ntools\n• Storage of\nmaterials\n• Checking of PPE\n• Checking of\nstorage facility\n• Record keeping\nprocedure\n• 5S of Good\nHousekeeping\n• OSHS\n• PPE\n• Displaying\nappropriate\nwarning signs\nand labels\n• Cleaning work\narea\n• Checking,\ncleaning and\nstowing tools\n• Storing materials\n• Checking\ndamaged PPEs\n• Checking storage\nfacilities\n• Conducting record\nkeeping\n\n--- PDF PAGE 39 ---\nTR-Milking Operation NCII Promulgated February 3, 2017\n\n38\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\nequipment is\nstored.\n4.6 Storage facility is\nchecked to\nensure no\ncontamination in\nthe area\naccording to\norganizational\nrequirements and\nlegislation and\ncodes.\n4.7 Record keeping\nis done\naccording to\nindustry\nrequirements.\n\n--- PDF PAGE 40 ---\nTR-Milking Operation NCII Promulgated February 3, 2017\n\n39\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Tools and materials\nTools and materials include:\n1.1. Tools\n1.1.1 Spade\n1.1.2 Wheel borrow\n1.1.3 Broomstick\n1.1.4 Sprayer or pressurized pump\n1.2. Materials\n1.2.1 Sacks\n1.2.2 Containers\n1.2.3 Disinfectants\n1.2.4 Detergents\n1.2.5 First-aid kit\n1.2.6 Chemical spill kit\n1.2.7 Personal Protective Equipment\no Goggles\no Disposal gloves\no Face mask\no Rubber boots\no\nOverall\n2. Agricultural wastes\nAgricultural wastes may include:\n2.1. Plant materials\n2.2. Hay\n2.3. Weeds\n2.4. Twigs\n2.5. Twines\n2.6. Empty wooden crates\n2.7. Animal manure\n2.8. Feed refuse\n2.9. Spoiled feeds (Forage and feed supplements)\n2.10. Spent bedding materials\n2.11. Empty sacks\n2.12. Trash fish\n2.13. Fish meal\n2.14. Effluent\n3. Dangerous and\nhazardous wastes\nDangerous and hazardous wastes may include:\n3.1 Pesticides\n3.2 Syringes\n3.3 Expired biologics\n3.4 Expired veterinary drugs\n3.5 Spoiled milk\n3.6 Diseased plant and plant parts\n3.7 Empty veterinary bottles/syringes\n4. Categories\nCategories may include:\n4.1 Re-usable\n4.2 Recyclable\n\n--- PDF PAGE 41 ---\nTR-Milking Operation NCII Promulgated February 3, 2017\n\n40\nVARIABLE\nRANGE\n4.3 Solid\n4.4 Liquid\n5. Processing of wastes\nProcessing of wastes may include:\n5.1. Composting\n5.2. Compacting\n5.3. Liquefying\n5.4. Shredding\n5.5. Carbonizing\n5.6. Charcoaling\n6. Record\nRecord includes:\n6.1. Record of farm wastes generated and disposed\n6.2. Record of incidence of infection and accidents\n6.3. Record of chemical spillage\n6.4. Record of destroyed carcasses\n6.5. Inventory of tools, materials and equipment\n\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1. Collected farm wastes\n1.2. Identified and segregated farm wastes\n1.3. Processed farm wastes\n1.4. Performed housekeeping\n2. Resource\nImplications\nThe following resources should be provided:\n2.1 Farm area\n2.2 Different farm wastes\n2.3 Farm-waste processing area\n2.4 Tools, supplies and materials use in farm wastes\ncollection, segregation and processing\n2.5 Housekeeping tools and supplies\n2.6\nPPE\n3. Method of\nAssessment\n\nCompetency in this unit may be assessed through:\n3.1 Observation and questioning\n3.2 Third-Party Report\n3.3 Demonstration and oral questioning\n4. Context of\nAssessment\n4.1 Competency maybe assessed individually in the actual\nworkplace or in accredited farms or institution\n\n--- PDF PAGE 42 ---\nTR-Milking Operation NCII Promulgated February 3, 2017\n\n41\nUNIT OF COMPETENCY\n:\nPERFORM RECORD-KEEPING\n\nUNIT CODE\n:"
