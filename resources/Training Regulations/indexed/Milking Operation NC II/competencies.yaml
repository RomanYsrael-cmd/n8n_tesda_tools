        "source_text": "AFF321202\n\nUNIT DESCRIPTOR :\nThis unit covers the knowledge, skills and attitudes\nrequired to use farm tools and equipment. It includes\nselection, operation and preventive maintenance of farm\ntools and equipment.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms\nare elaborated in\nthe Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Select and use\nfarm tools\n\n1.1\nAppropriate\nfarm tools are\nidentified\naccording to\nrequirement/u\nse\n1.2\nFarm tools are\nchecked for\nfaults and\ndefective tools\nreported in\naccordance\nwith farm\nprocedures\n1.3\nAppropriate\ntools are\nsafely used\naccording to\njob\nrequirements\nand\nmanufacturers\nconditions\n• Types and\nuses of farm\ntools\n• Characteristics\nof functional\ntools\n• Checking tools\nfor\ndefects/faults\n• Segregation\nand reporting\ndefective tools\n• Uses of tools\nand equipment\n\n• Identifying farm\ntools for the\nwork\n• Checking the\nconditions of\ntools\n• Reporting\ndefective tools\n• Using tools\n2.\nSelect and\noperate farm\nequipment\n2.1\nIdentify\nappropriate\nfarm\nequipment\n2.2\nInstructional\nmanual of the\nfarm tools and\nequipment are\ncarefully read\nprior to\noperation\n• Types and\noperations of\nfarm\nequipment\n• Standards\noperating\nprocedures of\nfarm\nequipment\n• Identifying\nappropriate\nfarm equipment\nfor the work\n• Reading\ninstructional\nmanual.\n• Conducting pre-\noperation\ncheck-up\n\n--- PDF PAGE 30 ---\nTR-Milking Operation NCII Promulgated February 3, 2017\n\n29\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms\nare elaborated in\nthe Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n2.3\nPre-\noperation\ncheck-up is\nconducted in\nline with\nmanufacturers\nmanual\n2.4\nFaults in farm\nequipment are\nidentified and\nreported in\nline with farm\nprocedures\n2.5\nFarm\nequipment\nused\naccording to\nits function\n2.6\nSafety\nprocedures\nare followed.\n• Instructional\nmanual of\nequipment\n• Pre-operation\ncheck-up\n• Equipment\nSpecification\n• Procedures in\ncalibrating and\nuse of\nequipment\n• Equipment\nfaults\nidentification\nand reporting\n• Operation of\nequipment\n• Codes and\nRegulations on\nenvironmental\nprotection\n• Safety and\nkeeping of\nequipment\nevery after use\n• Safety\nmeasures\n• Identifying\nfaults/defects of\nfarm equipment\n• Reporting on\ndefective farm\nequipment\n• Operating farm\nequipment\n• Following safety\nprocedures.\n\n3.\nPerform\npreventive\nmaintenance\n3.1\nTools and\nequipment are\ncleaned\nimmediately\nafter use in\nline with farm\nprocedures\n3.2\nRoutine\ncheck-up and\nmaintenance\nare performed\n• Cleaning\nprocedures of\ntools and\nequipment\n• Maintenance\nprocedures of\nfarm\nequipment\n• Cleaning tools\nand equipment\n• Performing\nroutinary check-\nup of tools and\nequipment\n• Maintaining\nfarm equipment\n\n--- PDF PAGE 31 ---\nTR-Milking Operation NCII Promulgated February 3, 2017\n\n30\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms\nare elaborated in\nthe Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n3.3\nTools and\nequipment are\nstored in\ndesignated\nareas in line\nwith farm\nprocedures\n• Storage of\ntools and\nequipment\n• Designated\nstorage areas\n• Storing tools\nand equipment\n\n--- PDF PAGE 32 ---\nTR-Milking Operation NCII Promulgated February 3, 2017\n\n31\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Farm equipment\n\nFarm equipment include:\n1.1 Engine\n1.2 Pumps\n1.3 Generators\n1.4 Sprayers\n2. Farm tools\nFarm tools includes:\n2.1 Sickle\n2.2 Cutters\n2.3 Weighing scales\n2.4 Hand tools\n2.5\nMeasuring tools\n2.6 Garden tools\n3. Pre-operation check-up\nPre-operation check –up includes:\n3.1 Tires\n3.2 Brake fluid\n3.3 Fuel\n3.4 Water\n3.5 Oil\n3.6 Lubricants\n3.7 Battery\n\nEVIDENCE GUIDE\n1. Critical Aspects\nof Competency\nAssessment requires evidence that the candidate:\n1.1 Correctly identified appropriate farm tools and equipment\n1.2 Operated farm equipment according to manual\nspecification\n1.3\nPerformed preventive maintenance\n2.\nResource\nImplications\nThe following resources should be provided:\n2.1 Service/operational manual of farm tools and equipment\n2.2 Tools and equipment\n2.3 Farm implements\n3.\nMethod of\nAssessment\n\nCompetency in this unit must be assessed through:\n3.1 Direct observation\n3.2 Practical demonstration\n3.3\nThird Party Report\n4.\nContext of\nAssessment\n4.1\nCompetency may be assessed in the actual workplace\nor at the designated TESDA Accredited Assessment\nCenter.\n\n--- PDF PAGE 33 ---\nTR-Milking Operation NCII Promulgated February 3, 2017\n\n32\nUNIT OF COMPETENCY : PERFORM ESTIMATION AND BASIC CALCULATION\n\nUNIT CODE :"
