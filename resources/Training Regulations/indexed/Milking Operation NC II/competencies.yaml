ion\n2.1 Performance\nof milking\nmachine is\nmonitored\nfollowing\ninstructional\nmanual\n2.2 Milk quality\nis determined\naccording to\nindustry\nstandards and\nenterprise\nrequirements\n2.3 Milk yield per\ncow is\nrecorded\naccording to\nworkplace\nprocedures\n2.4 Condition of\nanimal is\nchecked\nfollowing\nAnimal\nWelfare Act\nand GAHP\n•\nPPEs\n•\nGMP on milking\nmachine\n•\nOSHS on milking\nmachine\n•\nWorkplace\nprocedure\n•\nManuals on milking\noperation\n•\nHACCP awareness\n•\nDetermine machines\nfor maintenance\n•\nAnimal Welfare Act\n•\nPerformance of\nmilking machine\n•\nCharacteristics of\ngood and rejected\nmilk\n•\nMonitoring\nprocedures of milk\nquality\n•\nRecord keeping of\nmilk yield\n•\nComputation for milk\nyield per cow\n•\nOSHS on milking\noperation\n•\nPPE\n•\nHACCP and GMP on\nmilking operation\n•\nAttitude:\n- Patient\n- Time-conscious\n- Diligent\n•\nWearing of PPEs\n•\nPracticing GMP,\nOSHS\n•\nOperate milking\nunits\n•\nFollows written\ninstruction and\napply procedure\n•\nIdentify Hazards\nand implement\nsafe operating\nprocedure\n•\nMaintain quality\nmilk\n•\nUse literacy skills\nto read\n•\nRecord accurately\nand legible\n•\nMonitor animal\nhealth condition\n•\nMonitoring\nperformance of\nmilking machine\n•\nMonitoring milk\nquality\n•\nRecording milk\nyield per cow\n•\nComputing milk\nyield\n•\nPracticing GMP,\nHACCP and\nOSHS\n3. Perform\nsimple\ntroubleshoot\ning and\nrepair\n3.1 Signs of\ndefects and\nmalfunctions\nof machine are\nidentified\naccording to\nmachine\nmanual\n•\nPPEs\n•\nGMP on milking\nmachine\n•\nOSHS on milking\nmachine\n•\nDetermine machines\nfor maintenance\n•\nMachines\ntroubleshooting\n•\nWearing of PPEs\n•\nPracticing GMP,\nOSHS\n•\nOperating milking\nunits\n•\nFollows written\ninstruction and\napply procedure\n\n--- PDF PAGE 54 ---\nTR-Milking Operation NCII Promulgated February 3, 2017\n\n53\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms\nare elaborated in\nthe Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n3.2 Simple repair\nis undertaken\nfollowing\ninstructional\nmanual\n3.3 Malfunctions\nof milking\nmachine are\nreported to\nimmediate\nsupervisor\naccording to\nworkplace\nprocedures\n•\nRecord keeping and\nreport writing\n•\nInterpersonal skills\n•\nAttitude:\n- Patient\n- Time-conscious\n- Diligent\n•\nConducting minor\ntroubleshooting\nand repair of\nmilking machines\n•\nLiteracy skills to\nread\n•\nRecording\naccurately and\nlegible\n•\nOral\ncommunication\nskills/language\ncompetence\n•\nAnticipating\nemergencies and\nremove hazards\nin the workplace\n\n--- PDF PAGE 55 ---\nTR-Milking Operation NCII Promulgated February 3, 2017\n\n54\nRANGE OF VARIABLES\n\nVARIABLE\nSCOPE\n1. Cleaning solution\nCleaning solution may include:\n1.1 Sodium hydroxide (caustic soda) solution (0.5-1%\nsolution)\n1.2 Nitric acid (0.5-1% solution)\n1.3 Sodium hypochlorite (chlorox)\n1.4 Phosphoric acid\n2. Monitoring of performance\nof milking machine\nMay include but not limited to:\n2.1 Attachment of milk cluster\n2.2 Vacuum gauge\n2.3 Flow of milk in milk line\n2.4 Milk meter\n3. Milk quality\nMay include but not limited to:\n3.1 Good milk\n3.1.1 White in color\n3.1.2 Pleasant smell\n3.2 Rejected milk\n3.2.1 Presence of coagulation\n3.2.2 Blood\n3.2.3 Pus\n3.2.4 Foul smell\n\n--- PDF PAGE 56 ---\nTR-Milking Operation NCII Promulgated February 3, 2017\n\n55\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Operated milking machine\n1.2 Monitored milking operation\n1.3 Performed simple troubleshooting and repair\n1.4 Practiced GMP, HACCP, GAHP and OSHS\n2. Resource Implications\nThe following resources should be provided:\n2.1 Dairy animal\n2.2 Milking parlor\n2.3 Milking Machine\n2.4 Tools, materials and equipment to demonstrate\nrequired tasks\n2.5 PPE\n2.6 References and Manuals\n3. Method of Assessment\nCompetency in this unit must be assessed\nthrough:\n3.1 Written exam\n3.2 Demonstration with oral questioning\n4. Context of Assessment\n4.1 Competency may be assessed in the actual\nworkplace or at the designated TESDA Accredited\nAssessment Center.\n\n--- PDF PAGE 57 ---\nTR-Milking Operation NCII Promulgated February 3, 2017\n\n56\nUNIT OF COMPETENCY\n:\nCARRY-OUT POST-MILKING OPERATION\n\nUNIT CODE\n:"
