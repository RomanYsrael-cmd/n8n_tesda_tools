  "source_text": "SECTION 4 ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n.\nCompetency Assessment is the process of collecting evidence and making\njudgments whether competency has been achieved. The purpose of assessment is\nto confirm that an individual can perform to the standards expected at the workplace\nas expressed in relevant competency standards.\n\nThe assessment process is based on evidence or information gathered to\nprove achievement of competencies. The process may be applied to an\nemployable unit(s) of competency in partial fulfillment of the requirements of the\nnational qualification.\n\n4.1.\nNATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1.1 To attain the National Qualification of MILKING OPERATION NC II the\ncandidate must demonstrate competence covering all the units of\ncompetency listed in Section 1. A successful candidate shall be awarded\na National Certificate by the TESDA Director General\n\n4.1.2 Assessment shall focus on the core units of competency. The basic and\ncommon units are assessed concurrently with the core units.\n\n4.1.3 Recognition of Prior Learning (RPL). Candidates who have gained\ncompetencies through education, informal training, and work or life\nexperience may apply for recognition in a particular qualification through\ncompetency assessment.\n\n4.1.4 The following are qualified to apply for assessment:\n4.1.4.1 Graduating students/trainees of WTR-registered programs,\ngraduates of NTR programs or graduates of formal/non-\nformal/informal including enterprise-based training programs\nrelated to milking operation.\n\n4.1.4.2 Experienced workers in dairy industry\n\n4.1.5 Conduct of assessment and issuance of certificates shall follow the\n“Procedures Manual on Assessment and Certification” and\n“Guidelines on the Implementation of the “Philippine TVET\n4.2.\nCOMPETENCY ASSESSMENT REQUISITE\n\n4.2.1 Self-Assessment Guide. The self-assessment guide (SAG) is\naccomplished by the candidate prior to actual competency\nassessment. SAG is a pre-assessment tool to help the candidate and\nthe assessor determine what evidence is available, where gaps exist,\nincluding readiness for assessment.\n\nThis document can:\n\n--- PDF PAGE 99 ---\nTR-Milking Operation NCII Promulgated February 3, 2017\n\n98\na) Identify the candidate’s skills and knowledge\nb) Highlight gaps in candidate’s skills and knowledge\nc) Provide critical guidance to the assessor and candidate on the\nevidence that need to be presented\nd) Assist the candidate to identify key areas in which practice is\nneeded or additional information or skills that should be gained\nprior to assessment\n\n4.2.2 Accredited Assessment Center. Only a TESDA-accredited\nassessment center is authorized to conduct competency assessment.\nThe center has to undergo a quality assured procedure for\naccreditation before it is authorized by TESDA to manage the\nassessment for National Certification. The Accredited Assessment\nCenter may partner with a Dairy Facilities and enter into a\nMemorandum of Agreement for venue use.\n\n4.2.3 Accredited Competency Assessor. Only accredited competency\nassessor is authorized to conduct assessment of competence.\nCompetency assessors undergo a quality assured system of\naccreditation procedure before they are authorized by TESDA to\nassess the competencies of candidates for National Certification.\n\n4.2.3.1\nQualification of Competency Assessors\n\nFor Trainer-Assessor\n• Holder of National TVET Trainer Certificate Level I\n(NTTC) on Milking Operation NC II with at least three\n(3) years work experience in the dairy industry\n\nFor Industry-Assessor\n• Holder of National Certificate in Milking Operation NC\nII\n• Holder of Certificate of Competency (COC) in Conduct\nCompetency under the Trainers Methodology Level I\n(TM I)\n\n• Must have at least three (3) years work experience in\nthe dairy industry\n\n--- PDF PAGE 100 ---\nTR-Milking Operation NCII Promulgated February 3, 2017\n\n99\n\nSupermarket of Competencies\nAGRI-FISHERY Sector\nSupermarket of Competencies\nAGRICULTURE, FORESTRY AND FISHERY SECTOR\nConduct pre-\nmilking activities\n\nPerform milking\noperation\nCarry-out post-\nmilking operation\nCORE\nCOMPETENCIES\n\nCOMMON\nCOMPETENCIES\nApply Safely\nMeasures in\nfarm\noperations\nUse Farm Tools\nand Equipment\nPerform\nEstimation and\nBasic Calculation\nWork in a team\nenvironment\nParticipate in\nworkplace\ncommunication\nBASIC\nCOMPETENCIES\nPractice career\nprofessionalism\n\nPractice occupational\nhealth and safety\nprocedures\n\n--- PDF PAGE 101 ---\nTR-Milking Operation NCII Promulgated February 3, 2017\n\n100\nGLOSSARY OF TERMS\n\n1. Milkers’ PPE\nSpecialized clothing or equipment worn by milkers for\nprotection against health and safety hazards. Personal\nprotective equipment includes head cap, scrub suit, and\nboots\n2. Animal udders\nOrgan formed of the mammary glands of female\nquadruped mammals\n3. Teats dipping\nThe dipping of teats of dairy cows in a long-acting\ndisinfectant before and at the end of each milking\n4. Clean-in-place\n(CIP)\nMethod of cleaning the interior surfaces of pipes, vessels,\nprocess equipment, filters and associated fittings, without\ndisassembly\n5. Milking Parlor\nAn isolated room or separate building including the milking\nmachine to which cows kept on a loose-housing system\nare taken for milking\n6. Foremilking\nis the process of the extraction of first milk or foremilk\ndrawn from a cow's udder prior to milking\n7. Clean-out-of- place\n(COP)\nCleaning disassembling or dismantling the equipment,\noften done manually\n\n--- PDF PAGE 102 ---\nTR-Milking Operation NCII Promulgated February 3, 2017\n\n101\nACKNOWLEDGEMENTS\n\nThe Technical Education and Skills Development Authority (TESDA) wishes to\nextend gratitude and appreciation to the many representatives of business, industry,\nacademe and government agencies and labor groups who donated their time and\nexpertise to the development and validation of the