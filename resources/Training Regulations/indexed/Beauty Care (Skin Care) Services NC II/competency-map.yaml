  "source_text": "COMPETENCY MAP – SOCIAL AND OTHER COMMUNITY DEVELOPMENT SERVICES SECTOR\n\nBEAUTY CARE (SKIN CARE) SERVICES NC II\n\nBASIC COMPETENCIES\n\nParticipate in workplace\ncommunication\nWork in a team environment\n\nSolve/address general workplace\nproblems\n\nDevelop career and life decisions\n\nContribute to workplace\ninnovation\nPresent relevant information\n\nPractice occupational safety and\nhealth policies and procedures\nExercise efficient and effective\nsustainable practices in the\nworkplace\n\nPractice entrepreneurial skills in\nthe workplace\n\nCOMMON COMPETENCIES\n\nCORE COMPETENCIES\n\nMaintain an effective\nrelationship with\nclients/customers\nManage own performance\nApply quality standards\nMaintain a safe, clean and\nefficient environment\nPerform facial cleansing\nPerform temporary hair\nremoval activity\nPerform body scrub\n\n--- PDF PAGE 189 ---\nTR Beauty Care Services (Skin Care) NC II Revision 01 Promulgated(01//11/2019)\n 187",
