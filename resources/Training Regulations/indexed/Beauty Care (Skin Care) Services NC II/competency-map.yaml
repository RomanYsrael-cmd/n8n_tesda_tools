  "source_text": "SECTION 1 BEAUTY CARE (SKIN CARE) SERVICES NC II QUALIFICATION\n\nThe BEAUTY CARE (SKIN CARE) SERVICES NC II Qualification consists of\ncompetencies that a person must achieve to perform in enhancing of someone’s personal\nbeauty, such as, facial cleansing, hair removal and body scrub.\n\nThe Units of Competency comprising this Qualification include the following:\n\nUNIT CODE\nBASIC COMPETENCIES\n400311210\nParticipate in workplace communication\n400311211\n400311212\n400311213\n400311214\n400311215\n400311216\n400311217\n400311218\nWork in a team environment\nSolve/address general workplace problems\nDevelop career and life decisions\nContribute to workplace innovation\nPresent relevant information\nPractice occupational safety and health policies and procedures\nExercise efficient and effective sustainable practices in the workplace\nPractice entrepreneurial skills in the workplace\n\nUNIT CODE\nCOMMON COMPETENCIES\nHHC515201\nMaintain an effective relationship with clients/customers\nHHC515202\nManage own performance\nHHC515204\nApply quality standards\nHHC515205\nMaintain a safe, clean and efficient environment\n\nUNIT CODE\nCORE COMPETENCIES\n\nSOC514301\nPerform facial cleansing\nSOC514302\nPerform temporary hair removal activity\nSOC514303\nPerform body scrub\n\nA person who has achieved this Qualification is competent to be:\n\n❑ Beauty Therapy Assistant (Facial Cleansing)\n❑ Beauty Therapy Assistant (Hair Removal)\n❑ Beauty Therapy Assistant (Body Scrub)\n❑ Beauty Therapy Assistant (Full)\n\n--- PDF PAGE 6 ---\nTR Beauty Care Services (Skin Care) NC II Revision 01 Promulgated(01/11/2019)\n 2"
