 (DTS)/Dualized training Program (DTP) which\ncontain both in-school and in-industry training or fieldwork components.\nDetails can be referred to the Implementing Rules and Regulations of\nthe DTS Law and the TESDA Guidelines on the DTP;\n•\nDistance learning is formal education process in which majority of the\ninstruction occurs when the students and instructor are not in the same\nplace. Distance learning may employ correspondence study, audio,\nvideo, computer technologies or other modern technology that can be\nused to facilitate learning and formal and non-formal training. Specific\nguidelines on this mode shall be issued by the TESDA Secretariat.\n•\nThe traditional classroom-based or in-center instruction may be\nenhanced through use of learner-centered methods as well as laboratory\nor field-work components.\n\n--- PDF PAGE 180 ---\nTR Beauty Care Services (Skin Care) NC II Revision 01 Promulgated(01/11/2019)\n 178\n 2.2 Enterprised-Based:\n\n• Formal Apprenticeship – Training within employment involving a\ncontract between an apprentice and an enterprise on an approved\napprenticeable occupation.\n\n• Informal Apprenticeship – is based on training (and working) agreement\nbetween an apprentice and a master craftsperson wherein the\nagreement may be written or oral and the master craftsperson commits\nto training the apprentice in all the skills relevant to his or her trade over\na significant period of time, usually between one and four years, while\nthe apprentice commits to contributing productively to the work of the\nbusiness. Training is integrated into the production process and\napprentices learn by working alongside the experienced craftsperson.\n\n• Enterprise-based Training – where training is implemented within the\ncompany in accordance with the requirements of the specific company.\nSpecific guidelines on this mode shall be issued by the TESDA\nSecretariat.\n\n2.3 Community-Based – short term programs conducted by Non-Government\nOrganizations (NGOs), LGUs, training centers and other TVET providers\nwhich are intended to address the specific needs of a community. Such\nprograms can be conducted in informal settings such as barangay hall,\nbasketball courts, etc. These programs can also be Mobile Training\nPrograms (MTP).\n\n--- PDF PAGE 181 ---\nTR Beauty Care Services (Skin Care) NC II Revision 01 Promulgated(01/11/2019)\n 179\n3.3 TRAINEE ENTRY REQUIREMENTS\n\nTrainees or students wishing to gain entry into these qualifications should possess the following requirements:\n\n•\nMust have completed ten (10) years of basic education (Junior High School) or Alternative Learning System (ALS)\nCertificate of Completion with Grade 10 equivalent holder\n•\nMust have good communication skills\n•\nMust be able to perform basic mathematical computation\n•\nMust be physically fit\n\n3.4 TOOLS, EQUIPMENT AND MATERIALS\n\nRecommended list of tools, equipment and materials for the training of a minimum of 25 trainees for Beauty Care (Skin Care)\nServices NC II are as follows:\n\nFACIAL CLEANSING\nTOOLS\nEQUIPMENT\nMATERIALS\nQuantity\nUnit\nDescription/Specification\nQuantity\nUnit\nDescription/Specification\nQuantity\nUnit\nDescription/Specification\n5\npieces\nHandheld mirror 6” tall\n2\nunits\nFacial machine which\ninclude (Iontophorosis,\nSonophoresis, High\nfrequency, Rotary brush,\nVacuum, Spray, Galvanic\nskin tightening)\n\n5\npieces\nTrolley 45x33x3cm.\n5\nunits\nFacial bed 76.5”Lx2.5W\n20\npieces\nBib (as bib) adult size\nwhite\n5\npieces\nStainless basin\n1\nunit\nU.V Sterilizer 15”x9”x9”\n8\nboxes\nTissue 2 ply (100 pulls)\n5\npieces\nWaste basket plastic\n5\nunits\nLED Magnifying lamp\nwith steamer floor\nstanding, lens 1. Cm. in\ndiameter\n20\npieces\nFacial mask\n\n5\nPcs.\nStool 16”x23”\n20\npieces\nCotton ball (pack of 20\npieces)\n\n20\npieces\nHeadband\n\n20\npairs\nEye pads\n\n20\nbottles\nMake up remover\n\n--- PDF PAGE 182 ---\nTR Beauty Care Services (Skin Care) NC II Revision 01 Promulgated(01