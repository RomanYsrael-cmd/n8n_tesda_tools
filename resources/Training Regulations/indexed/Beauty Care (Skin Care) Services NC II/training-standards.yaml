  "source_section_text": "SECTION 3 TRAINING STANDARDS\n\nThis set of standards provides Technical and Vocational Education and Training\n(TVET) providers with information and other important requirements to consider when\ndesigning training programs for BEAUTY CARE (SKIN CARE) SERVICES NC II.\n\nThis includes information on curriculum design; training delivery; trainee entry\nrequirements; tools and equipment; training facilities; trainers’ qualification and institutional\nassessment.\n\n3.1 CURRICULUM DESIGN\n\nCourse Title: BEAUTY CARE (SKIN CARE) SERVICES\n\nNC Level: NC II\n\nNominal Training Duration: 37 Hours (Basic)\n\n 18 Hours (Common)\n\n 222 Hours (Core)\n\n 277 Hours - Total\n\n 30 Hours SIT\n\nCourse Description:\n\nThis course is designed to enhance the knowledge, skills and attitudes of spa-\nassistant in accordance with industry standards. It covers basic, common and core\ncompetencies in NC II.\n\n--- PDF PAGE 86 ---\nTR Beauty Care Services (Skin Care) NC II Revision 01 Promulgated(01/11/2019)\n 82\nBASIC COMPETENCIES\n(37 HOURS)\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n1. Participate in\nworkplace\ncommunication\n1.1. Obtain and convey\nworkplace\ninformation\n•\nDescribe Organizational policies\n•\nRead:\no Effective communication\no Written communication\no Communication procedures and\nsystems\n•\nIdentify:\no Different modes of communication\no Medium of communication\no Flow of communication\no Available technology relevant to the\nenterprise and the individual’s work\nresponsibilities\n•\nPrepare different Types of question\n•\nGather different sources of information\n•\nApply storage system in establishing\nworkplace information\n•\nDemonstrate Telephone courtesy\n• Group discussion\n• Lecture\n• Demonstration\n• Oral evaluation\n• Written\nexamination\n• Observation\n2 hours\n1.2. Perform duties\nfollowing\nworkplace\ninstructions\n•\nRead:\no Written notices and