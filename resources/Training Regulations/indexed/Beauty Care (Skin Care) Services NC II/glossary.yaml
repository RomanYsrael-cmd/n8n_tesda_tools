  "source_text": "DEFINITION OF TERMS FOR BEAUTY CARE\n\nBEAUTY CARE -\nAn overall beauty treatment intended to change or Improve\na person’s appearance\nBODY SCRUB –\n\nCONTRAINDICATION\nIs a process of removing dead skin cells and Exfoliating\nthe top layer of the skin?\nsomething that makes a particular treatment or procedure\ninadvisable\nECOLOGICAL SOLID\nWASTE MATERIALS –\n\nERGONOMICS-\nshall refer to the Systematic administration of activities\nwhich Provide for segregations at source, segregated\nTransportation, storage, transfer, processing, Treatment,\nand disposal of solid waste and all other waste\nmanagement activities which do not harm the Environment\nan applied science concerned with designing and arranging\nthings and people use so that the people and things interact\nmost efficiently and safely.\nETHICS -\nStudy of morality’s effect on conduct: the study of Moral\nstandards and how they affect conduct.\nEXPIRY OR\nEXPIRATION DATE –\nmeans the date stated in the label of a drug or device after\nwhich the drug is not expected to retain its claimed safety,\nefficacy and quality or potency or after which it is not\npermissible to sell the drug or device (As amended by E.O.\n175)\nFACIAL -\nCare for the face that usually involves cleansing and\nmassage and the application of cosmetic creams\nFIRST AID -\nmeans immediate assistance given in case of injury until\nmedical aid has been obtained\nHAZARDOUS -\nmeans likely to cause harm or injury in certain circumstances.\n\nHAZARDOUS WASTE\n-\nshall refer to solid or combination of solid waste which\nbecause of its quantity, concentration, or physical, chemical\nor infectious characteristics may cause, or significantly\ncontribute to an increase in mortality or an increase in\nserious irreversible, or incapacitating reversible, illness; or\npose a substantial present or potential hazard to human\nhealth or the environment when improperly treated, stored,\ntransported, or disposed of, or otherwise managed.\n\nHYGIENE –\npreservation of health: the science dealing with the\npreservation of health.\n\nINFECTIOUS –\nCommunicable: describes a disease that is capable of\nbeing passed from one person to another.\n\nLABEL –\nmeans a display of written, printed, or graphic matter on the\nimmediate container, or to other materials affixed thereto, of\nany article, Any word, statement or other information\nappearing on the label required underauthority of the FDA\nAct of 2009 or other relevant laws shall be deemed and\ncomplied with if such word, statement or other information\n\n--- PDF PAGE 190 ---\nTR Beauty Care Services (Skin Care) NC II Revision 01 Promulgated(01//11/2019)\n 188\n\nalso appears on the outside container or wrapper, if any\nthere be, of the retail package of such article, or easily\nlegible through the outside container or wrapper\nPERSONAL\nPROTECTIVE\nEQUIPMENT -\nmeans any clothing, device or other article that is intended\nto be worn or used by a Worker to prevent injury or to\nfacilitate rescue;\nPLUCKING -\nMeans the process of removing hair by mechanically\npulling the hair from owner’s body\nSAFETY\nthe condition of being free from danger and hazards which\nmay cause injuries or diseases\nSANITIZE –\nan effective bactericidal treatment to render surfaces of\nutensils, tools and equipment free pathogenic\nmicroorganisms\nSEGRAGATION–\nshall refer to sorting and segregation of different materials\nfound in solid waste in order to promote recycling and re-\nuse of resources and to reduce the volume of waste\ncollection and disposal\nSHAVING -\nIs the removal of hair, by using a razor or any kind of bladed\nimplements, to slice it down to the level of the skin\nSPA -\nPlaces devoted to overall well-being through a variety of\nprofessional services that encourage the renewal of mind,\nBody and spirit.\nSTERILIZATION –\n\nTREADING-\nAny chemical and or physical process which kills and\ndestroys all microorganisms.\na method of hair removal that involves stripping the root out\nalong with the hair using thread\n\nTONSORIAL AND\nBEAUTY\nESTABLISHMENT –\nincludes barber shop, parlors and other establishments engage\nthe physical make-over of an individual\nWAXING-\nmethod of hair removal\n\n--- PDF PAGE 191 ---\nTR Beauty Care Services (Skin Care) NC II Revision 01 Promulgated(01//11/2019)\n 189\n\nTRAINING REGULATIONS (TR)\nDOCUMENT REVISION HISTORY\n\nQualification Title:\nBeauty Care (Skin Care) Services NC II\nQualification Code:\nSOCBEC219\n\nRevision\nNo.\nDocument\nTypes*\nQualification Title\nTESDA Board\nResolution No./\nDate\nDeployment\n(TESDA\nCircular/\nImplementing\nGuidelines)\n00\nDocument Created\nBeauty Care (Skin\nCare) Services NC II\n2019-09\n01//11/19\n025/3/1/2019\n01\nDocument Amended\nBeauty Care NC III\n2010-02\n04/08/2010\nN/A\n\n Legend: *Description Types\n-\nDocument Created\n-\nDocument Amended\n\n--- PDF PAGE 192 ---\nTR Beauty Care Services (Skin Care) NC II Revision 01 Promulgated(01//11/2019)\n 190"
