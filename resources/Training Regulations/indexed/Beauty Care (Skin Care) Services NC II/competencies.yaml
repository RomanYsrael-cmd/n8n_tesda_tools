y in the actual\nworkplace or simulation environment in TESDA\naccredited institutions.\n\n--- PDF PAGE 19 ---\nTR Beauty Care Services (Skin Care) NC II Revision 01 Promulgated(01/11/2019)\n 15\nUNIT OF COMPETENCY :\nDEVELOP CAREER AND LIFE DECISIONS\n\nUNIT CODE\n : 400311213\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills, and attitudes in\nmanaging one’s emotions, developing reflective practice,\nand boosting self-confidence and developing self-regulation.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Manage one’s\nemotion\n1.1 Self-management\nstrategies are\nidentified\n1.2 Skills to work\nindependently and to\nshow initiative, to be\nconscientious, and\npersevering in the\nface of setbacks and\nfrustrations are\ndeveloped\n1.3 Techniques for\neffectively handling\nnegative emotions\nand unpleasant\nsituation in the\nworkplace are\nexamined\n\n1.1 Self-\nmanagement\nstrategies that\nassist in\nregulating\nbehavior and\nachieving\npersonal and\nlearning goals\n(e.g. Nine self-\nmanagement\nstrategies\naccording to\nRobert Kelley)\n1.2 Enablers and\nbarriers in\nachieving\npersonal and\ncareer goals\n1.3 Techniques in\nhandling\nnegative\nemotions and\nunpleasant\nsituation in the\nworkplace\nsuch as\nfrustration,\nanger, worry,\nanxiety, etc.\n1.1 Managing\nproperly one’s\nemotions and\nrecognizing\nsituations that\ncannot be\nchanged and\naccept them and\nremain\nprofessional\n1.2 Developing self-\ndiscipline,\nworking\nindependently\nand showing\ninitiative to\nachieve personal\nand career goals\n1.3 Showing\nconfidence, and\nresilience in the\nface of setbacks\nand frustrations\nand other\nnegative\nemotions and\nunpleasant\nsituations in the\nworkplace\n\n--- PDF PAGE 20 ---\nTR Beauty Care Services (Skin Care) NC II Revision 01 Promulgated(01/11/2019)\n 16\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n2. Develop\nreflective\npractice\n2.1 Personal strengths\nand achievements,\nbased on self-\nassessment\nstrategies and\nteacher feedback\nare contemplated\n2.2 Progress when\nseeking and\nresponding to\nfeedback from\nteachers to assist\nthem in\nconsolidating\nstrengths,\naddressing\nweaknesses and\nfulfilling their\npotential are\nmonitored\n2.3 Outcomes of\npersonal and\nacademic\nchallenges by\nreflecting on\nprevious problem\nsolving and decision\nmaking strategies\nand feedback from\npeers and teachers\nare predicted\n2.1 Basic SWOT\nanalysis\n2.2 Strategies to\nimprove one’s\nattitude in the\nworkplace\n2.3 Gibbs’\nReflective\nCycle/Model\n(Description,\nFeelings,\nEvaluation,\nAnalysis,\nConclusion,\nand Action\nplan)\n2.1 Using the basic\nSWOT analysis\nas self-\nassessment\nstrategy\n2.2 Developing\nreflective practice\nthrough\nrealization of\nlimitations, likes/\ndislikes; through\nshowing of self-\nconfidence\n2.3 Demonstrating\nself-acceptance\nand being able to\naccept\nchallenges\n\n3. Boost self-\nconfidence and\ndevelop self-\nregulation\n3.1 Efforts for continuous\nself-improvement are\ndemonstrated\n3.2 Counter-productive\ntendencies at work\nare eliminated\n3.3 Positive outlook in life\nare maintained.\n3.1 Four\ncomponents of\nself-regulation\nbased on Self-\nRegulation\nTheory (SRT)\n3.2 Personality\ndevelopment\nconcepts\n3.3 Self-help\nconcepts (e. g.,\n7 Habits by\nStephen Covey,\ntransactional\nanalysis,\npsycho-spiritual\nconcepts)\n3.1 Performing\neffective\ncommunication\nskills – reading,\nwriting, conversing\nskills\n\n3.2 Showing affective\nskills – flexibility,\nadaptability, etc.\n\n3.3 Self-assessment\nfor determining\none’s strengths\nand weaknesses\n\n--- PDF PAGE 21 ---\nTR Beauty Care Services (Skin Care) NC II Revision 01 Promulgated(01/11/2019)\n 17\n\n RANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Self-management\nstrategies\nMay include but not limited to:\n1.1\nSeeking assistance in the 