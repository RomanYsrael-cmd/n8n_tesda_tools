            "title": "Hair Removal",
            "performance_criteria": [
              {
                "number": "15.1",
                "text": "Tweezing or Plucking 15.1.1 Perform Hygiene procedures 15.1.2 Cleanse skin areas to be treated with antiseptic or alcohol (70% isopropyl) 15.1.3 Apply appropriate hair removal products on skin area to be treated following FDA notification 15.1.4 Remove hair with a tweezers 15.1.5 Apply moisturizing cream or lotion products"
              },
              {
                "number": "15.2",
                "text": "Threading 15.2.1 Perform Hygiene procedures 15.2.2 Form a loop and lock the thread 15.2.3 Twist and pull along the area of unwanted hair lifts the hair follicle directly from the root. 15.2.4 Apply appropriate skin products to reduce the redness of the skin --- PDF PAGE 74 --- TR Beauty Care Services (Skin Care) NC II Revision 01 Promulgated(01/11/2019) 70 VARIABLE RANGE 15.2.5 Apply moisturizing cream or lotion products"
              },
              {
                "number": "15.3",
                "text": "Shaving 15.3.1 Perform Hygiene procedures 15.3.2 Cleanse the surface of the body to be treated with antiseptic or alcohol (70% isopropyl) 15.3.3 Apply appropriate skin softening products on skin area to be treated 15.3.4 Perform appropriate shaving strokes 15.3.5 Check if the hair is completely removed 15.3.6 Apply moisturizing cream or lotion product"
              },
              {
                "number": "15.4",
                "text": "Cold Waxing 15.4.1 Perform Hygiene procedures 15.4.2 Cleanse and disinfect the surface of the skin area to be treated with antiseptic or alcohol (70% isopropyl) 15.4.3 Apply appropriate product on the skin area to be treated. 15.4.4 Spread cold waxing gel evenly on the skin area to be treated using spatula. 15.4.5 Apply a cloth strip or appropriate product over the wax, 15.4.6 Press the cloth strip firmly onto the skin, so that the hair and wax would adhere together and leave until dry 15.4.7 Pull the cloth strip off towards the opposite direction of hair growth in one swift motion, 15.4.8 Apply appropriate skin products to reduce the redness of the skin 15.4.9 Apply moisturizing cream or lotion product"
              }
            ]
