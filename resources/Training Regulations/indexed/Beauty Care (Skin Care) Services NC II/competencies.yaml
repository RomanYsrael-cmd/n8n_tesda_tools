        "source_text": "SOC514302\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitude in\nperforming temporary hair removal activity. This involves\npreparing the client, performing the hair removal methods\nand procedures, performing post hair removal activities\n\nELEMENT\nPERFORMANCE\nCRITERIA\nREQUIRED KNOWLEDGE\nREQUIRED SKILLS\n1. Prepare\nclients\n1.1 Clients’ medical\nhistory and skin\ntype, skin\nconditions are\nconsulted and\nevaluated on the skin\narea to be treated in\naccordance with\nstandard medical\nhistory and skin\ntype taking\nprocedures.\n1.2 Clients with\ncontraindications\nare advised to forego\nor defer hair removal\nprocedures\n1.3 Client is advised to\nremove personal\naccessories\n1.4 Client’s Personal\nProtective\nEquipment\n(Clothing/materials)\nare provided,\nprepared and\nchecked in\naccordance with\nestablished\nprocedures\n1.4 Skin test is\nconducted to\ndetermine the\nsensitivity of the\nclient to the treatment\nproduct.\n1.1\nCode of Ethics\n1.2\nClient Evaluation\n1.3\nFamiliarization of clinic\nand or/spa policies and\nProcedures\n1.4\nClient’s Forms and\nRecords\n1.5\nOffice Protocol\n1.6\nPD 856 (Sanitation\nCode of the Philippines)\n1.7\nRA 9003 (Ecological\nWaste Management\nProgram)\n1.8\nDOH and Occupational\nSafety and Health\nPolicies and\nProcedures\n1.9\nEnvironment Safety\nRules and Regulations\n1.10 Basic Mathematics\n1.11 Ratio and proportion\n1.12 Medical History\n1.13 Skin Types\n1.14 Skin conditions\n1.15 Skin Area\n1.16 Personal Protective\nEquipment\nClothing/materials\n1.17 Providing of protective\nclothing materials\n\n1.1 Following code of\nethics\n1.2 Interpersonal skills\n1.3 Recording client’s\ninformation\n1.4 Evaluating client\n1.5 Conducting skin test\n1.6 Providing\nappropriate\nPersonal Protective\nClothing/materials\n1.7 Complying PD 856\n1.8 Complying RA 9003\n1.9 Complying\nDepartment of\nHealth (DOH) and\nOccupational Safety\nand Health (OSH)\npolicies and\nprocedures\n\n2. P