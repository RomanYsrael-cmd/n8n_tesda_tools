.2 Time and task\nmanagement\n2.3 Self-evaluation\nand monitoring\nskills [add’l]\n\n--- PDF PAGE 46 ---\nTR Beauty Care Services (Skin Care) NC II Revision 01 Promulgated(01/11/2019)\n 42\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n3. Build\ncredibility with\ncustomers/clie\nnts\n3.1\nClient expectations for\nreliability, punctuality\nand appearance\nadhered to.\n3.2\nPossible causes of\nclient/customer\ndissatisfaction\nidentified, dealt with\nrecorded according to\nemployer policy.\n3.3\nClient fully informed of\nall relevant security\nmatters in a timely\nmanner.\n\n3.1 Site and\nassignment\nrequirements\n3.2 Employer policy on\nperformance\nmanagement\n3.3 Indicators of\nappropriate\nperformance for\neach area of\nresponsibility\n3.4 Steps for improving\nor maintaining\nperformance\n3.5 Work schedules\n3.6 Work plans\n3.7 Performance\nstandards\n\n3.1 Capacity to plan\nand prioritize\nworkloads and\nrequirements\n3.2 Time and task\nmanagement\n3.3 Self-evaluation\nand monitoring\nskills [add’l]\n\nRANGE OF VARIABLES\n\nVARIABLES\nRANGE\n1. Tasks\n\n1.1\nMay be identified through:\n1.1.1 Assignment Instructions\n1.1.2 Verbal Instructions by Senior Staff/household\nmembers\n1.1.3 Policy Documents\n1.1.4 Duty Statements\n1.1.5 Self-Assessment\n1.2\nMay be:\n1.2.1 Daily tasks\n1.2.2 Weekly tasks\n1.2.3 Regularly or irregularly occurring tasks\n\n2. Performance\nStandards\nMay include:\n2.1\nAssignment Instructions\n2.2\nProcedures established in policy documents\n\n--- PDF PAGE 47 ---\nTR Beauty Care Services (Skin Care) NC II Revision 01 Promulgated(01/11/2019)\n 43\nEVIDENCE GUIDE\n\n1. Critical Aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nPlanned for completion of own workload\n1.2\nAssessed verbal or written work plan through observation and\ndiscussion of site and employer requirements\n1.3\nDemonstrated capacity to complete task within specified time\nframe\n1.4\nMaintained quality of own performance\n\n4. Resource Implications The following resources should be provided:\n4.1\nAssessment Centers/Venues\n4.2\nAccredited Assessors\n4.3\nModes of Assessment\n4.4\nEvaluation Reports\n4.5\nAccess to relevant venue, equipment and materials\n4.6\nAssignment Instructions\n4.7\nLogbooks\n4.8\nOperational manuals and makers’/customers’ instructions\n4.9\nAssessment Instruments, including personal planner and\nassessment record book\n\n5. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n5.1\nWritten Test\n5.2\nDemonstration\n5.3\nObservation\n5.4\nQuestioning\n\n6. Context of\nAssessment\n6.1 Competency may be assessed in the workplace or in a\nsimulated work setting.\n\n--- PDF PAGE 48 ---\nTR Beauty Care Services (Skin Care) NC II Revision 01 Promulgated(01/11/2019)\n 44\nUNIT OF COMPETENCY :\nAPPLY QUALITY STANDARDS\n\nUNIT CODE\n:"
