islation,\npolicy and\n\n--- PDF PAGE 27 ---\nTR Beauty Care Services (Skin Care) NC II Revision 01 Promulgated(01/11/2019)\n 23\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n2.5 Recommendation\ns are made on\nareas of possible\nimprovement.\n\n2.5 Organisational\nvalues, ethics and\ncodes of conduct\nprocedures\nrelating to the\nconduct of\nevaluations\n2.5 Stating\norganisational\nvalues, ethics and\ncodes of conduct\n\n3. Record and\npresent\ninformation\n3.1 Studied\ndata/information\nare recorded.\n3.2 Recommendation\ns are analysed for\naction to ensure\nthey are\ncompatible with\nthe project’s\nscope and terms\nof reference.\n3.3 Interim and final\nreports are\nanalysed and\noutcomes are\ncompared to the\ncriteria\nestablished at the\noutset.\n3.4 Findings are\npresented to\nstakeholders.\n\n3.1 Data analysis\ntechniques/\nprocedures\n3.2 Reporting\nrequirements to a\nrange of audiences\n3.3 Legislation, policy\nand procedures\nrelating to the\nconduct of\nevaluations\n3.4 Organisational\nvalues, ethics and\ncodes of conduct\n\n3.1 Describing data\nanalysis\ntechniques/\nprocedures\n3.2 Reporting\nrequirements to a\nrange of\naudiences\n3.3 Stating legislation,\npolicy and\nprocedures\nrelating to the\nconduct of\nevaluations\n3.4 Stating\norganisational\nvalues, ethics and\ncodes of conduct\npractices\n\n--- PDF PAGE 28 ---\nTR Beauty Care Services (Skin Care) NC II Revision 01 Promulgated(01/11/2019)\n 24\nRANGE OF VARIABLES\n\nVARIABLES\nRANGE\n1. Data analysis\ntechniques\nMay include but not limited to:\n1.1. Domain analysis\n1.2. Content analysis\n1.3. Comparison technique\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Determine data / information\n1.2 Studied and applied gathered data/information\n1.3 Recorded and studied studied data/information\n\nThese aspects may be best assessed using a range