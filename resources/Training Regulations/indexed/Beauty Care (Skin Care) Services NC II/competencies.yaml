        "source_text": "HHC515205\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes needed to\nmaintain client relations. The unit incorporates the work safety\nguidelines. It encompasses competencies necessary to\nmaintain a safe workplace for staff, clients and others. It also\ninvolves the application of health regulations, including\npersonal hygiene practiced by staff members, provision of a\ncaring client environment and the efficient operation of the\nsalon.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Comply with\nhealth\nregulations\n\n1.1\nSalon policies and\nprocedures for\npersonal hygiene\napplied.\n1.2\nProcedures and\npractices implemented\nin a variety of salon\nsituations in\naccordance with\ngovernment health\nregulations.\n1.1 Salon policies and\nprocedures\n1.2 Data Gathering\n1.3 Salon Policies\n1.4 International\nMarket\n1.5 New Trends in\nProducts and\nServices\n1.6 Ethical Limitations\n\n1.1 Communication\nskills to identify\nlines of\ncommunication,\nrequest advice,\nfollow instructions\nand receive\nfeedback.\n1.2 Technology Skills\n1.3 Interpersonal\nSkills\n2. Assess own\nwork\n\n2.1\nReception, work areas\nand walkways\nmaintained in a safe,\nuncluttered and\norganized manner\naccording to salon\npolicy.\n2.2\nAll routines carried out\nsafely, effectively with\nminimum\ninconvenience to\nclients and staff.\n2.3\nWaste is stored and\ndisposed of according\nto OH&S\nrequirements.\n\n2.1 Media Options\n2.2 Data Gathering\n2.3 Salon Policies\n2.4 International\nMarket\n2.5 New Trends in\nProducts and\nServices\n2.6 Ethical Limitations\n\n2.1 Communication\nskills to identify\nlines of\ncommunication,\nrequest advice,\nfollow instructions\nand receive\nfeedback.\n2.2 Technology Skills\n2.3 Interpersonal\nSkills\n\n--- PDF PAGE 53 ---\nTR Beauty Care Services (Skin Care) NC II Revision 01 Promulgated(01/11/2019)\n 49\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n\n2.4\nSpills, food, waste,\nhair or potential\nhazards promptly\nremoved from floors\naccording to salon\npolicy.\n2.5\nSpills, food, waste, hair\nor other potential\nhazards promptly\nremoved from floors\naccording to salon\npolicy.\n2.6\nLinen is stored,\ncleaned and disinfected\nin line with OHS\nrequirements and salon\nprocedures.\n2.7\nRefreshments are\nprovided to all clients.\n\n3. Check and\nmaintain\ntools and\nequipment\n3.1\nTools and equipment\nare stored safely and in\nposition to comply with\nsalon requirements and\nlocal health regulations.\n3.2 Tools and equipment\nare prepared for\nspecific services as\nrequired.\n3.3 Tools and equipment\nare checked for\nmaintenance\nrequirements.\n3.4 Tools and equipment\nare referred for repair\nas required.\n3.1 Tools and\nequipment\n3.2 Storage Policies\nand Procedures\n3.3 Maintenance\nrequirements\n3.1 Communication\nskills to identify\nlines of\ncommunication,\nrequest advice,\nfollow instructions\nand receive\nfeedback.\n3.2 Technology Skills\n3.3 Interpersonal\nSkills\n4. Check and\nmaintain\nstocks\n\n4.1\nStock rotation\nprocedures are carried\nout routinely and\naccurately according to\nsalon procedures.\n4.2\nStock levels are\naccurately recorded\naccording to salon\nprocedures.\n4.3\nUnder or over supplied\nstock items are notified\nimmediately to the salon\nsupervisor.\n4.1 Stock\n4.2 Stock Rotation\n4.3 Safe lifting and\ncarrying\ntechniques\n4.4 Occupational\nSafety and Health\nPolicies and\nProcedures\n4.1 Communication\nskills to identify\nlines of\ncommunication,\nrequest advice,\nfollow instructions\nand receive\nfeedback.\n4.2 Technology Skills\n4.3 Interpersonal\nSkills\n\n--- PDF PAGE 54 ---\nTR Beauty Care Services (Skin Care) NC II Revision 01 Promulgated(01/11/2019)\n 50\n4.4\nIncorrectly ordered or\ndelivered stock is\nreferred to the salon\nsupervisor for return to\nsupplier.\n4.5\nSafe lifting and carrying\ntechniques maintained\nin line with salon\noccupational health\nand safety policy and\ngovernment legislation.\n5. Provide a\nrelaxed and\ncaring\nenvironment\n5.1\nClients are made to feel\ncomfortable according\nto salon policy.\n5.2\nClients’ needs are\nreported to.\n5.3\nClients are consulted\non specific desired\nservice.\n\n5.1 Salon policies and\nprocedures\n5.2 Clients\n5.1 Communication\nskills to identify\nlines of\ncommunication,\nrequest advice,\nfollow instructions\nand receive\nfeedback.\n5.2 Technology Skills\n5.3 Interpersonal Skills\n\n--- PDF PAGE 55 ---\nTR Beauty Care Services (Skin Care) NC II Revision 01 Promulgated(01/11/2019)\n 51\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Relevant salon\npolicies and\nprocedures\n\nMay include:\n1.1\nHazard Policies and Procedures\n1.2\nEmergency, Fire and Accident Procedures\n1.3\nPersonal Safety Procedures\n1.4\nProcedures for the use of Personal Protective\nClothing and Equipment\n1.5\nHazard Identification\n1.6\nJob Procedures\n\n2. Occupational health\nand safety\nprocedures\nMay include:\n2.1\nClient\n2.2\nStaff\n2.3\nEquipment/Tools\n2.4\nPremises\n2.5\nStock\n\n3. Unsafe situations\nMay include:\n3.1\nDamaged Packaging Material or Containers\n3.2\nBroken or Damaged Equipment\n3.3\nInflammable Materials and Fire Hazards\n3.4\nLifting Practices\n3.5\nSpillages\n3.6\nWaste including hair especially on floors\n3.7\nTrolleys\n\n4. Linkage\nMay be related to the following:\n4.1\nInstitutional\n4.2\nOrganizational Linkage\n4.3\nSocial Services\n4.4\nInternational Market\n\n--- PDF PAGE 56 ---\nTR Beauty Care Services (Skin Care) NC II Revision 01 Promulgated(01/11/2019)\n 52\nEVIDENCE GUIDE\n\n1 Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nGenerated information on different client\nrequirements and needs.\n1.2\nSelected and used strategies to accurately analyzed\nthe client requirements.\n1.3\nAssessed current product and services as against\nclient demand.\n1.4\nIdentified avenues to establish relevant linkage.\n1.5\nSelected promotional activities relevant to enhance\ncompetitiveness of salon.\n1.6\nAssisted clients on specific desired services.\n1.7\nChecked and prepared tools for the specific salon\nactivities.\n\n2. Resource\nImplications\nThe following resources should be provided:\n2.1\nClient\n2.2\nRelevant Information\n2.3 Appropriate Products\n\n3. Methods of\nAssessment\nCompetency must be assessed through:\n3.1\nObservation with questioning\n3.2\nPractical Demonstration with questioning\n\n4. Context of\nAssessment\n4.1 Assessment may be conducted in the workplace or in\na simulated environment\n\n--- PDF PAGE 57 ---\nTR Beauty Care Services (Skin Care) NC II Revision 01 Promulgated(01/11/2019)\n 53\nCORE COMPETENCIES\n\nUNIT OF COMPETENCY :\nPERFORM FACIAL CLEANSING\nUNIT CODE\n:"
