S\n\nVARIABLE\nRANGE\n1. Medical History\nMay include:\n1.1\nAllergies\n1.2\nSunburn\n1.3\nVascular skin conditions\n1.4\nPressure urticaria\n1.5\nSkin infections (e.g. herpes, impetigo, etc.)\n1.6\nAcne\n1.7\nWarts\n1.8\nOpen wound, new scars\n1.9\nSkin Disorders/Diseases (e.g. eczema, psoriasis)\n1.10 Pregnancy\n1.11 Previous treatment procedures\n2. Skin Types\nMay include:\n2.1\nOily\n2.2\nDry\n2.3\nSensitive\n2.4\nResistant\n2.5\nWith Blemishes (e.g. acne, comedones, scars, etc.)\n3. Skin Condition\nMay include:\n3.1\nSmooth\n3.2\nRough\n3.3\nWith rashes\n3.4\nWith abrasions\n3.5\nWith blemishes\n4. Skin Area\nMay include:\n4.1\nLower lips\n4.2\nArmpit\n4.3\nNape area\n4.4\nCheeks\n4.5\nUpper lips\n4.6\nChin\n4.7\nBikini line\n4.8\nBrazilian\n4.9\nUpper legs\n4.10 Navel\n4.11 Chest\n4.12 Moustache/Beard\n4.13 Eyebrows\n\n5. Medical History and\nSkin Type and\nconditions Taking\nProcedures\nMay include:\n5.1\nAge (at least 18 years old)\n5.2\nGender\n5.3\nPast medical history (i.e.: herpes labialis, etc.)\n5.4\nCurrent medical history (i.e.: acne/pimples, vascular\nconditions/rosacea, etc.)\n5.5\nCurrent medications (topical and oral) (i.e.: glycolic\n\n--- PDF PAGE 72 ---\nTR Beauty Care Services (Skin Care) NC II Revision 01 Promulgated(01/11/2019)\n 68\nVARIABLE\nRANGE\nacid, tretinoin, antibiotics, etc.)\n6. Contraindications\nMay include:\n6.1\nWith rashes\n6.2\nWith sunburned peeling skin\n6.3\nWith skin infections\n6.4\nWith open wounds\n6.5\nWith skin diseases\n6.6\nPregnancy (with OB clearance)\n\n7. Personal\nAccessories\nMay include:\n7.1\nWrist Watch\n7.2\nAnklet\n7.3\nBangles\n7.4\nRings\n7.5\nNecklace\n7.6\n\n8. Personal Protective\nEquipment\n(Clothing/Materials)\nMay include:\n8.1 BEAUTY THERAPY ASSISTANT\n8.1.1\nFace Mask\n8.1.2\nApron\n8.1.3\nHeadband\n8.1.4\nGloves\n8.2 CLIENT\n8.2.1\nFace Towel\n8.2.2\nHead Band\n8.2.3\nFace towel as (Bib) adult size white\n9. Tools\n9.1\nTweezing\n9.1.1.\nTweezers\n9.2\nShaving\n9.2.1.\nShaver\n9.3\nCold waxing\n9.3.1.\nStainless Bowl\n9.3.2.\nSpatula\n9.4 Threading\n10. Equipment\n10.1 Facial bed\n10.2 Magnifying lamp\n10.3 Stool\n10.4 trolley\n11. Supplies and\nMaterials\n\nMay include:\n11.1 Tweezing\n11.1.1.\nTalcum powder\n11.1.2.\nLotion\n11.1.3.\nSkin Toner\n11.1.4.\nDisinfectant (isopropyl 70%)\n11.2 Shaving\n11.2.1.\nShaving Cream\n11.2.2.\nAntiseptic\n11.3 Cold waxing\n\n--- PDF PAGE 73 ---\nTR Beauty Care Services (Skin Care) NC II Revision 01 Promulgated(01/11/2019)\n 69\nVARIABLE\nRANGE\n\n11.3.1.\nwax product\n11.3.2.\nSkin Toner\n11.3.3.\nMoisturizer\n11.3.4.\n antiseptic\n11.3.5.\nCloth Cotton strip\n11.3.6.\nTalcum powder\n11.4 Threading\n 11.4.1 Thread (sewing, cotton)\n11.5 Tissue\n11.6 Cotton balls\n11.7 Gauze\n11.8 Gloves vinyl disposable\n11.9 Face towel as (Bib) adult size white\n11.10 isinfectant (isopropyl 70%)\n12. Hair Removal\nProducts Form\nMay include:\n12.1 Cream\n12.2 Gel\n12.3 Liquid\n12.4\n Paste\n13. Work Station\n\nMay include:\n13.1 Facial bed\n13.2 Stool\n13.3 Magnifying lamp\n13.4 cubicle\n13.5 trolley\n14. Hair Removal\nMethods\nMay include:\n14.1 Shaving\n14.2 Waxing\n14.1.1 Cold Waxing\n14.1.2 Hot Waxing\n14.3 Tweezing or Plucking\n14.4 Threading\n15. Hair Removal\nProcedures\n15.1 Tweezing or Plucking\n15.1.1 Perform Hygiene procedures\n15.1.2 Cleanse skin areas to be treated with\nantiseptic or alcohol (70% isopropyl)\n15.1.3 Apply appropriate hair removal products on\nskin area to be treated following FDA\nnotification\n15.1.4 Remove hair with a tweezers\n15.1.5 Apply moisturizing cream or lotion products\n15.2 Threading\n15.2.1 Perform Hygiene procedures\n15.2.2 Form a loop and lock the thread\n15.2.3 Twist and pull along the area of unwanted hair\nlifts the hair follicle directly from the root.\n15.2.4 Apply appropriate skin products to reduce the\nredness of the skin\n\n--- PDF PAGE 74 ---\nTR Beauty Care Services (Skin Care) NC II Revision 01 Promulgated(01/11/2019)\n 70\nVARIABLE\nRANGE\n15.2.5 Apply moisturizing cream or lotion products\n15.3 Shaving\n15.3.1 Perform Hygiene procedures\n15.3.2 Cleanse the surface of the body to be treated\nwith antiseptic or alcohol (70% isopropyl)\n15.3.3 Apply appropriate skin softening products on\nskin area to be treated\n15.3.4 Perform appropriate shaving strokes\n15.3.5 Check if the hair is completely removed\n15.3.6 Apply moisturizing cream or lotion product\n15.4 Cold Waxing\n15.4.1 Perform Hygiene procedures\n15.4.2 Cleanse and disinfect the surface of the skin\narea to be treated with antiseptic or alcohol\n(70% isopropyl)\n15.4.3 Apply appropriate product on the skin area to\nbe treated.\n15.4.4 Spread cold waxing gel evenly on the skin\narea to be treated using spatula.\n15.4.5 Apply a cloth strip or appropriate product over\nthe wax,\n15.4.6 Press the cloth strip firmly onto the skin, so\nthat the hair and wax would adhere together\nand leave until dry\n15.4.7 Pull the cloth strip off towards the opposite\ndirection of hair growth in one swift motion,\n15.4.8 Apply appropriate skin products to reduce the\nredness of the skin\n15.4.9 Apply moisturizing cream or lotion product\n16. Skin Care Regimens\n16.1 Advise client not to wash the treated skin area within\nsix (6) hours\n16.2 Appropriate maintenance products maybe advised as\nnecessary\n16.3 Advise clients to keep treated skin areas clean and\ndry\n\n--- PDF PAGE 75 ---\nTR Beauty Care Services (Skin Care) NC II Revision 01 Promulgated(01/11/2019)\n 71\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nChecked and analyzed the condition of the skin area\nto be treated or removed.\n1.2\nConducted skin test to determine tolerance level of\nthe sensitivity of the client.\n1.3\nPrepared, sanitized, sterilized and used tools,\nequipment following manufacturer’s manual of\ninstructions.\n1.4\nUsed supplies and materials according to FDA\nnotification.\n1.5\nApplied hair removal methods (e.g., shaving\ntweezing, waxing and threading) according to client’s\nrequirements and established hair removal\nprocedures.\n1.6\nEnsured client’s safety and comfort during the entire\nprocess.\n1.7\nChecked and evaluated results, skin areas treated\naccording to desired outcomes\n1.8\nCleaned and sanitized work area in accordance with\nspa policies and procedures\n1.9\nSegregated and Disposed wastes in accordance with\nwaste management program and OSH requirements\n\n2. Resource\nImplications\nThe following resources should be provided:\n2.1\nModel\n2.2\nTools, equipment and supplies/materials relevant to\nthe activity to be performed\n2.3 Work area/facilities\n\n3. Methods of\nAssessment\nCompetency may be assessed through:\n3.1 Demonstration with Oral Questioning\n3.2 Interview\n3.3 Written Examination\n\n4. Context of\nAssessment\nAssessment may be conducted in the workplace or in a\nsimulated environment (TESDA accredited assessment\ncenters)\n\n--- PDF PAGE 76 ---\nTR Beauty Care Services (Skin Care) NC II Revision 01 Promulgated(01/11/2019)\n 72\nUNIT OF COMPETENCY : PERFORM BODY SCRUB\n\nUNIT CODE\n:"
