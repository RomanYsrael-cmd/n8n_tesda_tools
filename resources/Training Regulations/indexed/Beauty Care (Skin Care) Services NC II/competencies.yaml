idelines\n4.13 Complying FDA\na.\notification\n4.14\nomplying PD 856 and\nPD. 9003\n\n5.Perform post\nworkstation\n5.1 Equipment are\ncleaned and sanitized\nin accordance with\ncleaning and sanitizing\nprocedures.\n5.2 Supplies, products\nand materials are\nchecked, recorded,\nreplenished and\nstored in accordance\nwith standard\ndocumentation\n5.3 Waste materials are\nsegregated and\ndisposed in\naccordance with the\nEcological Waste\nManagement\nProgram.\n5.4 Workstation is cleaned\nand prepared for next\nactivities.\n\n5.1 Code of ethics\n5.2 Office protocol\n5.3 Time management\n5.4 Cleaning and\nsanitizing procedures\n5.5 Familiarization on\nclinic and or/spa\npolicies and\nprocedures\n5.6 Familiarization of\nsupplies, materials,\nfacial products and\nequipment\n5.7 Forms and Records\nof equipment,\nsupplies and\nmaterials and facial\nproducts\n5.8 Maintenance of\nEquipment, supplies,\nmaterials and\nproducts\n5.9 PD 856 (Sanitation\nCode of the\nPhilippines)\n5.10 RA 3009 (Ecological\nWaste management\nprogram)\n5.11 FDA notification\n5.1 Following code of\nethics\n5.2 Interpersonal and\n5.3 intra-personal Skills\n5.4 Checking, recording,\n5.5 replenishing and\n5.6 storing\n5.7 information of\nproducts,\n5.8 materials, supplies,\ntools\n5.9 and equipment\n5.10 Following\nsafekeeping\n5.11 and maintenance\n5.12 procedure\n5.13 Following\nHousekeeping\n5.14 procedures\n5.15 Cleaning, sanitizing\n5.16 and storing materials\n5.17 and equipment\n5.18 Complying with PD\n856\n5.19 and RA 9003\n5.20 Complying FDA\n\n--- PDF PAGE 61 ---\nTR Beauty Care Services (Skin Care) NC II Revision 01 Promulgated(01/11/2019)\n 57\nELEMENT\nPERFORMANCE\nCRITIERIA\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n5.12 OSH policies and\nguidelines\n5.13 Environment Safety\nRules and\nRegulations\n5.14 Basic mathematics\n5.15 Housekeeping\nprinciples\n5.16 Safekeeping\nprocedures\n5.17 Methods of\nSanitation\n5.18 Storage of tools,\nsupplies, materials\nand equipment\n5.19 Workstation\n5.20 Waste management\nProgram\n5.21 Preparation and set\nup of workplace area\n5.21 notification\n5.22 Complying with\n5.23 DOH, OSH policies\n5.24 and guidelines\n5.25 Preparing and\n5.26 Setting up of\n5.27 workplace area\n\n--- PDF PAGE 62 ---\nTR Beauty Care Services (Skin Care) NC II Revision 01 Promulgated(01/11/2019)\n 58\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Medical History\nMay include:\n1.1\nAllergies\n1.2\nSunburn\n1.3\nVascular skin conditions\n1.4\nPressure urticaria\n1.5\nSkin infections (e.g. herpes, impetigo, etc.)\n1.6\nAcne\n1.7\nWarts\n1.8\nOpen wound, new scars\n1.9\nSkin Disorders/Diseases (e.g. eczema, psoriasis)\n1.10 Pregnancy\n2. Skin Types\nMay include:\n2.1\nOily\n2.2\nDry\n2.3\nSensitive\n2.4\nResistant\n2.5\nWith Blemishes (e.g. acne, comedones, scars, etc.)\n3. Skin Condition\nMay include:\n3.1\nSmooth\n3.2\nRough\n3.3\nWith rashes\n3.4\nWith abrasion\n3.5\nWith blemishes\n4. Medical History and\nSkin Type and\nconditions Taking\nProcedures\nMay include:\n4.1\n Age (18 years old)\n4.2\nGender\n4.3\nPast medical history (i.e.: herpes labialis, etc.)\n4.4\nCurrent medical history (i.e.: acne/pimples, vascular\nconditions/rosacea, etc.)\n4.5\nCurrent medications (topical and oral) (i.e.: glycolic acid,\ntretinoin, antibiotics, etc.)\n5. Contraindications\nMay include:\n5.1\nWith rashes\n5.2\nWith sunburned peeling skin\n5.3\nWith skin infections\n5.4\nWith open wounds\n5.5\nWith skin diseases\n5.6\nPregnancy\n5.7\nMinor-Consent Form\n6. Personal\nAccessories\nMay include:\n6.1\n Earrings\n6.2\n Necklace\n6.3\n Eye glasses\n7. Personal Protective\nEquipment (Clothing\n/materials)\nMay include:\n7.1. BEAUTY THERAPY ASSISTANT\n7.1.1. Head cap\n7.1.2. Facial mask\n\n--- PDF PAGE 63 ---\nTR Beauty Care Services (Skin Care) NC II Revision 01 Promulgated(01/11/2019)\n 59\nVARIABLE\nRANGE\n7.1.3. Disposable gloves\n7.1.4. Apron/ gown\n7.2. CLIENT\n7.2.1. Eye pads\n7.1.2. Face Towel (as Bib) adult size white\n7.1.3. Headband/cap\n7.1.4. Bib (white cloth)\n7.1.5. Bedsheet\n8. Tools And Equipment\nMay include:\n8.1.\nFacial Bed\n8.2.\nHandheld Mirror\n8.3.\nSterilizer\n8.4.\nTrolley\n8.5.\nLED Magnifying Lamp with steamer floor standing\n8.6.\nFacial Machine /(steamer)\nMust have LED magnifying lamp. Steamer\n\nOptional Equipment: Iontophorosis, Sonophoresis, High\nfrequency, Rotary brush, Vacuum, Spray, Skin scrubber, U.V\nsterilizer, Galvanic skin tightening)\n8.7.\n Basin, stainless\n8.8.\nU.V. Sterilizer\n8.9.\nWaste basket plastic\n9. Supplies And\nMaterials\nMay include:\n9.1 Distilled water\n9.1.\nEye pad\n9.2.\nFace Sponge\n9.3.\nFacial Cleanser\n9.4.\nFacial cream\n9.5.\nFacial lotion\n9.6.\nFacial mask (disposable)\n9.7.\nMake up remover\n9.8.\nSerum\n9.9.\nSunblock/Sunscreen\n9.10. Tissue\n9.11. Cotton balls\n9.12. Gauze\n9.13. Gloves vinyl\n9.14. Skin toner\n9.15. Face Towel (as Bib) adult size white\n9.16. Waste bin\n9.17. Bed sheet\n9.18. Disinfectant (isopropyl 70%)\n10. Facial Cleansing\nProducts\nMay include;\n10.1 Cleansing cream/ Facial cream\n10.2 Skin toner/Make-up remover\n10.3 Serum\n\n--- PDF PAGE 64 ---\nTR Beauty Care Services (Skin Care) NC II Revision 01 Promulgated(01/11/2019)\n 60\nVARIABLE\nRANGE\n10.4 Moisturizer\n10.5 Sun block cream\n\n11. Work Station\nMay include:\n11.1 Magnifying lamp\n11.2 Trolley\n11.3 Steamer\n11.4 Basin\n11.5 Head Band\n11.6 Towel\n11.7 Eye Pads\n11.8 Make-up Remover\n11.9 Tissue\n11.10 Facial sponge\n11.11 Facial cleanser\n11.12 Facial toner\n11.13 Cotton\n11.14 Gauze\n11.15 Facial mask\n11.16 Cubicle\n11.17 Waste Bin\n12. Established Facial\nCleansing\nprocedures\nEstablished Facial Cleansing procedures:\n12.1 Remove make-up with make-up remover if applicable. Wet the\nface with sprayer filled with distilled water. Apply warmed mild\nnon-foaming liquid cleanser in the face. Gently massage using\ncircular and upward motions, guiding the skin towards the\nlymph nodes. Cleanse the face with damp facial sponge.\n12.2 Turn on the steamer, with the head facing away from the\nclient. Once steam is emitted, adjust the steam to face the\nclient at a distance of 10-12 inches. Steam for 10 minutes.\nUse distilled water for the steamer.\n12.3 Prepare the facial brush in a wet or dry manner, in the wet\nmanner, apply warmed mild non-foaming liquid cleanser on\nthe face.\n12.4 Turn on the facial brush, in the dry manner turn on the facial\nbrush. Guide the facial brush, starting with the chin going up\nto the forehead. Spend 5 seconds per part of the face before\nmoving the brush to another part of the face.\n12.4.1 Extraction maybe done if a medical practitioner\npresent.\n12.4.2 Lightly mist the skin with the spray bottle with distilled\nwater using spray bottle. Prepare the lymphatic\nvacuum tube. Glide the lymphatic vacuum tube over\nthe facial skin, starting from the chin going up to the\nforehead. Use quick, short strokes directed towards\nthe lymph nodes.\n12.4.3 Place dry gauze over the client’s face. Prepare the\nhigh frequency equipment using the mushroom glass\n\n--- PDF PAGE 65 ---\nTR Beauty Care Services (Skin Care) NC II Revision 01 Promulgated(01/11/2019)\n 61\nVARIABLE\nRANGE\ntube. Gently place the mushroom glass tube on the\nface, starting with the chin up to the forehead. Use\nlight circular strokes.\n12.4.4 Prepare the galvanic equipment as such: the active\npole is positive while the passive pole is negative.\nApply treatment serum on the facial skin. Glide the\nactive pole over the wet skin until the serum is\ncompletely absorbed.\n12.4.5 Use a spatula or facial brush to apply a finishing facial\nmask. Let the mask set for 5-10 minutes before\ncleansing with clean warm water.\n12.5 Complete facial cleansing with sunscreen or product of your\nchoice.\n\n13. Desired Result\nMay include:\n13.1 Facial skin should be visibly free from make-up and dirt.\n13.2 Skin should feel hydrated and supple.\n14. Aftercare Regimens\nMay include:\n14.1 Client is advised not to wash the face for 4 to 6 hours and\navoid sun exposure.\n14.2 Appropriate maintenance products may be advised as\nnecessary.\n14.3 Client is advised to follow-up check-up\n14.4 Client is advised to inform the spa or clinic if she or he\nexperiences any adverse reactions (e.g. rashes or discomfort)\n14.5 Client is advised regular facial cleansing once a month\n\n--- PDF PAGE 66 ---\nTR Beauty Care Services (Skin Care) NC II Revision 01 Promulgated(01/11/2019)\n 62\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\n\nAssessment required evidence that the candidate:\n1.1\nPrepared client\n1.2\nApplied listening and questioning skills ensuring the safety\nand comfort of clients.\n1.3 Consulted and evaluated clients’ medical history, facial\nskin tone and condition in accordance with standard\nmedical history and skin type taking procedures.\n1.4\nProvided client with appropriate protective clothing\nmaterial in accordance with the established procedures.\n1.5\nChecked set, use and sanitize tools and equipment\nsupplies and materials according to OSH requirements.\n1.6\nPrepared work station\n1.7\nObserved personal hygiene sanitation practices during the\nentire process.\n1.8\nUsed appropriate facial cleansing products.\n1.9\nPerformed established facial cleansing procedures and\nmassage strokes in accordance with product specification\nand DOH and OSH requirements.\n1.10 Checked desired result and advised client for facial\nmaintenance products.\n1.11 Perform post service activity\n\n2. Resource Implications The following resources should be provided:\n2.1\nLive Model\n2.2\nEquipment and supplies/materials relevant of the activity\nto be performed\n2.3\nTreatment Products\n2.4\nActual workstation or simulated workplace with complete\nfacilities\n3. Methods of\nAssessment\nCompetency may be assessed through:\n3.1\nDemonstration with oral questioning\n3.2\nDirect observation with questioning\n3.3\nWritten test\n3.4\nInterview\n4. Context for\nAssessment\nCompetency may be assessed in the actual workplace or at the\ndesignated TESDA Accredited Assessment Center.\n\n--- PDF PAGE 67 ---\nTR Beauty Care Services (Skin Care) NC II Revision 01 Promulgated(01/11/2019)\n 63\n\nUNIT OF COMPETENCY :\nPERFORM TEMPORARY HAIR REMOVAL ACTIVITY\n\nUNIT CODE\n:"
