        "evidence_guide": {
          "source_text": "1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nPrepared client\n1.2\nChecked and analyzed the client’s medical history\nskin type condition following Spa policies and\nprocedures.\n1.3\nConsulted and explained all possible skin\nimprovement enhancement of skin.\n1.4\nProvided client with appropriate protective clothing\nmaterial in accordance with established body scrub\nprocedures.\n1.5\n Prepared work station.\n1.6\nEnsured clients safety and comfort during the\nentire process.\n1.7\nPrepared and used supplies and materials\naccording to Spa policies and procedures and FDA\nnotification.\n1.8\nSponge client with lukewarm water before and after\nscrubbing the body surface following spa and\nestablished body scrub procedures.\n1.9\nApplied appropriate scrubbing products ingredients\non body surface in accordance with established\nbody scrub procedures and product specification.\n1.10 Performed body scrubbing in accordance with\nestablished body scrub procedures and DOH\nrequirements.\n1.11 Checked result and advised client on appropriate\n\n--- PDF PAGE 84 ---\nTR Beauty Care Services (Skin Care) NC II Revision 01 Promulgated(01/11/2019)\n 80\nmaintenance program.\n1.12 Perform post service activities to workstation.\n2. Resource Implications\nThe following resources should be provided:\n2.1\nLive Model\n2.2\nTools, equipment and supplies/materials relevant\nof the activity to be performed\n2.3\nWork Area/Facilities relevant to the activity\n3. Methods of Assessment\nCompetency in this unit may be assessed through:\n3.1.\nDemonstration with oral questioning\n3.2.\nPortfolio\n3.3.\nWritten Examination\n3.4.\nInterview\n\n4. Context of Assessment\n4.1.\nCompetency may be assessed in the actual\nworkplace or at the designated TESDA Accredited\nAssessment Center.\n\n--- PDF PAGE 85 ---\nTR Beauty Care Services (Skin Care) NC II Revision 01 Promulgated(01/11/2019)\n 81"
        },
        "source_text": "SOC514303\nUNIT DESCRIPTOR\n: This unit covers the knowledge, skills and attitude in\nperforming body scrub in a spa setting. It involves the\npreparation and consultation of the clients, application of\nappropriate body scrub products, body scrub procedures and\nperforming pre and post body scrubbing activities.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1. Prepare\nclient\n\n1.1 Clients’ medical\nhistory and skin\ntype, skin conditions\nare consulted and\nevaluated on the skin\narea to be treated in\naccordance with\nstandard medical\nhistory and skin type\ntaking procedures.\n1.2 Clients with\ncontraindications are\nadvised to forego or\ndefer body scrub\ntreatment.\n1.3 Client is advised to\nremove personal\naccessories to\nachieve optimum\nservice results.\n1.4 Client’s Personal\nProtective\nEquipment\n(Clothing/materials)\nare provided, prepared\nand checked in\naccordance with\nestablished\nprocedures\n\n1.1\nCode of Ethics\n1.2\nClient Evaluation\n1.3\nOffice protocol\n1.4\nClient’s Form and\nRecords\n1.5\nFamiliarization\nclinic and or/Spa\nPolicies and\nProcedures\n1.6\nPD 856 (Code of\nSanitation)\n1.7\nOccupational\nHealth and Safety\npolicies and\nprocedures\n1.8\nEnvironment\nSafety Rules and\nRegulations\n1.9\nBasic\nmathematics\n1.10 Ratio and\nproportion\n1.11 Medical History\n1.12 Skin Types\n1.13 Skin Condition\n1.14 Contraindication\n1.15 Protective\nClothing and\nmaterials\n1.16 Medical history,\nskin type taking\nprocedures\n1.17 Providing\nprotective clothing\nmaterials\n1.1 Following code of\nethics\n1.2 Interpersonal skill\n1.3 Handling,\npreparing,\nconsulting and\nevaluating client\n1.4 Following medical\nhistory, skin type\ntaking procedures\n1.5 Following Spa\npolicies and\nprocedures\n1.6 Following filing\nand recording\nclient’s\ninformation\n1.7 Providing\nappropriate PPE\n1.8 Complying PD\n856 and OSH\npolicies and\nproc