uty Care Services (Skin Care) NC II Revision 01 Promulgated(01/11/2019)\n 78\nVARIABLE\nRANGE\n7.1.3 Slipper\n7.1.4 Headband\n7.2 FOR SPA ATTENDANT\n7.2.1 Apron\n7.2.2 Mask\n7.2.3 Scrubbing gloves\n7.2.4 Headband\n8. Tools, Equipment,\nSupplies and Materials\nMay include:\n8.1 Tools\n8.1.1 Basin stainless\n8.1.2 Timer\n8.3\n Equipment\n8.3.10 Facial Bed\n8.3.11 Trolley\n8.3 Supplies and Materials\n 8.3.1 Face Towel\n 8.3.2 Sponge\n 8.3.3 Scrubbing Gloves\n 8.3.5 Bedsheet\n 8.3.6 Lukewarm Water\n 8.3.7 Scrubber (e.g. Loofa or mitten)\n 8.3.8 Bath towel\n8.3.9 Plastic or Rubber Sheet\n8.3.10 Bath Towel (draping)\n8.3.11 Eye pad\n8.3.12 Disinfectant (isopropyl 70%)\n9. Scrubbing Product\ningredients\n\nMay include:\n9.1 Sea salt\n9.2 Sugar\n9.3 Coffee\n9.4 Organic/herbal, oil\n10. Work Station\nMay include:\n10.1 Cubicle\n10.2 Trolley\n10.3 Basin\n11. Established Spa\nProcedures\nMay include:\n11.1 Sponge bath client’s body in lukewarm water\n11.2 Scrubbing the body surface using face towel or\nsponge and pat dried.\n11.3 Apply appropriate scrubbing product ingredients\nslightly on the body surface.\n11.4 Scrub the body using different strokes/motion\nsuch as upward, downward and circular\nstrokes/motion\n11.5 Sponge bath client’s body in lukewarm water\nafter scrubbing the body surface using face\ntowel or sponge and pat dried.\n11.6 Apply and advice aftercare regimen with\n\n--- PDF PAGE 83 ---\nTR Beauty Care Services (Skin Care) NC II Revision 01 Promulgated(01/11/2019)\n 79\nVARIABLE\nRANGE\nappropriate product following product\ninstructions and accordance with FDA\nnotification\n12. Aftercare Regimens\nMay include:\n12.1 Daily bath\n12.2 Skin check up\n12.3 Daily skin care (e.g. sunblock, moisturizer and\nother appropriate maintenance products)\n12.4 Client is advised regular body scrub once a\nmonth\n\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nPrepared client\n1.2\nChecked and analyzed the client’s medical history\nskin type condition following Spa policies and\nprocedures.\n1.3\nConsulted and explained all possible skin\nimprovement enhancement of skin.\n1.4\nProvided client with appropriate protective clothing\nmaterial in accordance with established body scrub\nprocedures.\n1.5\n Prepared work station.\n1.6\nEnsured clients safety and comfort during the\nentire process.\n1.7\nPrepared and used supplies and materials\naccording to Spa policies and procedures and FDA\nnotification.\n1.8\nSponge client with lukewarm water before and after\nscrubbing the body surface following spa and\nestablished body scrub procedures.\n1.9\nApplied appropriate scrubbing products ingredients\non body surface in accordance with established\nbody scrub procedures and product specification.\n1.10 Performed body scrubbing in accordance with\nestablished body scrub procedures and DOH\nrequirements.\n1.11 Checked result and advised client on appropriate\n\n--- PDF PAGE 84 ---\nTR Beauty Care Services (Skin Care) NC II Revision 01 Promulgated(01/11/2019)\n 80\nmaintenance program.\n1.12 Perform post service activities to workstation.\n2. Resource Implications\nThe following resources should be provided:\n2.1\nLive Model\n2.2\nTools, equipment and supplies/materials relevant\nof the activity to be performed\n2.3\nWork Area/Facilities relevant to the activity\n3. Methods of Assessment\nCompetency in this unit may be assessed through:\n3.1.\nDemonstration with oral questioning\n3.2.\nPortfolio\n3.3.\nWritten Examination\n3.4.\nInterview\n\n4. Context of Assessment\n4.1.\nCompetency may be assessed in the actual\nworkplace or at the designated TESDA Accredited\nAssessment Center.\n\n--- PDF PAGE 85 ---\nTR Beauty Care Services (Skin Care) NC II Revision 01 Promulgated(01/11/2019)\n 81"
