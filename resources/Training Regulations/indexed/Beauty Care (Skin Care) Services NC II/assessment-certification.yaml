  "source_text": "SECTION 4 ASSESSMENT AND CERTIFICATION ARRANGEMENT\n\nCompetency Assessment is the process of collecting evidence and making\njudgments whether competency has been achieved. The purpose of assessment is\nto confirm that an individual can perform to the standards expected at the workplace\nas expressed in relevant competency standards.\n\nThe assessment process is based on evidence or information gathered to\nprove achievement of competencies. The process may be applied to an employable\nunit(s) of competency in partial fulfillment of the requirements of the national\nqualification.\n\n4.1.\nNATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1.1. Assessment shall cover all the competencies of the qualification with\nthe basic and common units integrated or assessed concurrently with\nthe core units of competency.\n\n4.1.2. A National Certificate (NC) is issued when a candidate has\ndemonstrated competence through full assessment, covering all the\nunits required in the Training Regulations of Beauty Care (Skin Care)\nServices NC II.\n\n4.1.3. The qualification of Beauty Care (Skin Care) Services NC II may be\nacquired through the accumulation of Certificates of Competency in the\nfollowing units of competencies:\nCOC 1 Perform facial cleansing\nCOC 2 Perform temporary hair removal activity\nCOC 3 Perform body scrub\n\nCertificates of Competency (COCs) shall be issued to candidates\nwho have been assessed as competent in any of the above COCs\n(COC 1, COC 2, COC 3). Upon accumulation and submission of all\nthe COCs acquired, an individual shall be issued the corresponding\nNational Certificate for the Qualification.\n\n4.1.4 Any of following are qualified to apply for assessment and\ncertification:\n\n4.1.4.1 Graduates of WTR-registered programs or graduates of NTR\nprograms, including enterprise-based training programs\nrelated to Beauty Care (Skin Care) Services NC II.\n4.1.4.2 Experienced workers (wage employed or self-employed) who\ngained competencies in providing skin care services for at\nleast 2 years within the last 5 years.\n\n4.1.5\nCurrent holders of National Certificates (NC) in Beauty Care Services NC\nII are required to undergo re-assessment under the amended Training\nRegulations (TR) upon expiration of their NC.\n\n--- PDF PAGE 187 ---\nTR Beauty Care Services (Skin Care) NC II Revision 01 Promulgated(01/11/2019)\n 185\nCOMPETENCY ASSESSMENT REQUISITE\n\n4.2.1 Self-Assessment Guide. The self-assessment guide (SAG) is\naccomplished by the candidate prior to actual competency\nassessment. SAG is a pre-assessment tool to help the candidate\nand the assessor determine what evidence is available, where gaps\nexist, including readiness for assessment.\n\nThis document can:\na) Identify the candidate’s skills and knowledge\nb) Highlight gaps in candidate’s skills and knowledge\nc) Provide critical guidance to the assessor and candidate on the\nevidence that need to be presented\nd) Assist the candidate to identify key areas in which practice is\nneeded or additional information or skills that should be gained prior\nto assessment\n\n4.2.2 Accredited\nAssessment\nCenter.\nOnly\nAssessment\nCenter\naccredited by TESDA is authorized to conduct competency\nassessment. Assessment centers undergo a quality assured\nprocedure for accreditation before they are authorized by TESDA to\nmanage the assessment for National Certification.\n\n4.2.3\nAccredited Competency Assessor. Only accredited competency\nassessor is authorized to conduct assessment of competence.\nCompetency assessors undergo a quality assured system of\naccreditation procedure before they are authorized by TESDA to\nassess the competencies of candidates for National Certification.\n\n--- PDF PAGE 188 ---\nTR Beauty Care Services (Skin Care) NC II Revision 01 Promulgated(01/11/2019)\n 186\nCOMPETENCY MAP – SOCIAL AND OTHER COMMUNITY DEVELOPMENT SERVICES SECTOR\n\nBEAUTY CARE (SKIN CARE) SERVICES NC II\n\nBASIC COMPETENCIES\n\nParticipate in workplace\ncommunication\nWork in a team environment\n\nSolve/address general workplace\nproblems\n\nDevelop career and life decisions\n\nContribute to workplace\ninnovation\nPresent relevant information\n\nPractice occupational safety and\nhealth policies and procedures\nExercise efficient and effective\nsustainable practices in the\nworkplace\n\nPractice entrepreneurial skills in\nthe workplace\n\nCOMMON COMPETENCIES\n\nCORE COMPETENCIES\n\nMaintain an effective\nrelationship with\nclients/customers\nManage own performance\nApply quality standards\nMaintain a safe, clean and\nefficient environment\nPerform facial cleansing\nPerform temporary hair\nremoval activity\nPerform body scrub\n\n--- PDF PAGE 189 ---\nTR Beauty Care Services (Skin Care) NC II Revision 01 Promulgated(01//11/2019)\n 187\n\nDEFINITION OF TERMS FOR BEAUTY CARE\n\nBEAUTY CARE -\nAn overall beauty treatment intended to change or Improve\na person’s appearance\nBODY SCRUB –\n\nCONTRAINDICATION\nIs a process of removing dead skin cells and Exfoliating\nthe top layer of the skin?\nsomething that makes a particular treatment or procedure\ninadvisable\nECOLOGICAL SOLID\nWASTE MATERIALS –\n\nERGONOMICS-\nshall refer to the Systematic administration of activities\nwhich Provide for segregations at source, segregated\nTransportation, storage, transfer, processing, Treatment,\nand disposal of solid waste and all other waste\nmanagement activities which do not harm the Environment\nan applied science concerned with designing and arranging\nthings and people use so that the people and things interact\nmost efficiently and safely.\nETHICS -\nStudy of morality’s effect on conduct: the study of Moral\nstandards and how they affect conduct.\nEXPIRY OR\nEXPIRATION DATE –\nmeans the date stated in the label of a drug or device after\nwhich the drug is not expected to retain its claimed safety,\nefficacy and quality or potency or after which it is not\npermissible to sell the drug or device (As amended by E.O.\n175)\nFACIAL -\nCare for the face that usually involves cleansing and\nmassage and the application of cosmetic creams\nFIRST AID -\nmeans immediate assistance given in case of injury until\nmedical aid has been obtained\nHAZARDOUS -\nmeans likely to cause harm or injury in certain circumstances.\n\nHAZARDOUS WASTE\n-\nshall refer to solid or combination of solid waste which\nbecause of its quantity, concentration, or physical, chemical\nor infectious characteristics may cause, or significantly\ncontribute to an increase in mortality or an increase in\nserious irreversible, or incapacitating reversible, illness; or\npose a substantial present or potential hazard to human\nhealth or the environment when improperly treated, stored,\ntransported, or disposed of, or otherwise managed.\n\nHYGIENE –\npreservation of health: the science dealing with the\npreservation of health.\n\nINFECTIOUS –\nCommunicable: describes a disease that is capable of\nbeing passed from one person to another.\n\nLABEL –\nmeans a display of written, printed, or graphic matter on the\nimmediate container, or to other materials affixed thereto, of\nany article, Any word, statement or other information\nappearing on the label required underauthority of the FDA\nAct of 2009 or other relevant laws shall be deemed and\ncomplied with if such word, statement or other information\n\n--- PDF PAGE 190 ---\nTR Beauty Care Services (Skin Care) NC II Revision 01 Promulgated(01//11/2019)\n 188\n\nalso appears on the outside container or wrapper, if any\nthere be, of the retail package of such article, or easily\nlegible through the outside container or wrapper\nPERSONAL\nPROTECTIVE\nEQUIPMENT -\nmeans any clothing, device or other article that is intended\nto be worn or used by a Worker to prevent injury or to\nfacilitate rescue;\nPLUCKING -\nMeans the process of removing hair by mechanically\npulling the hair from owner’s body\nSAFETY\nthe condition of being free from danger and hazards which\nmay cause injuries or diseases\nSANITIZE –\nan effective bactericidal treatment to render surfaces of\nutensils, tools and equipment free pathogenic\nmicroorganisms\nSEGRAGATION–\nshall refer to sorting and segregation of different materials\nfound in solid waste in order to promote recycling and re-\nuse of resources and to reduce the volume of waste\ncollection and disposal\nSHAVING -\nIs the removal of hair, by using a razor or any kind of bladed\nimplements, to slice it down to the level of the skin\nSPA -\nPlaces devoted to overall well-being through a variety of\nprofessional services that encourage the renewal of mind,\nBody and spirit.\nSTERILIZATION –\n\nTREADING-\nAny chemical and or physical process which kills and\ndestroys all microorganisms.\na method of hair removal that involves stripping the root out\nalong with the hair using thread\n\nTONSORIAL AND\nBEAUTY\nESTABLISHMENT –\nincludes barber shop, parlors and other establishments engage\nthe physical make-over of an individual\nWAXING-\nmethod of hair removal\n\n--- PDF PAGE 191 ---\nTR Beauty Care Services (Skin Care) NC II Revision 01 Promulgated(01//11/2019)\n 189\n\nTRAINING REGULATIONS (TR)\nDOCUMENT REVISION HISTORY\n\nQualification Title:\nBeauty Care (Skin Care) Services NC II\nQualification Code:\nSOCBEC219\n\nRevision\nNo.\nDocument\nTypes*\nQualification Title\nTESDA Board\nResolution No./\nDate\nDeployment\n(TESDA\nCircular/\nImplementing\nGuidelines)\n00\nDocument Created\nBeauty Care (Skin\nCare) Services NC II\n2019-09\n01//11/19\n025/3/1/2019\n01\nDocument Amended\nBeauty Care NC III\n2010-02\n04/08/2010\nN/A\n\n Legend: *Description Types\n-\nDocument Created\n-\nDocument Amended\n\n--- PDF PAGE 192 ---\nTR Beauty Care Services (Skin Care) NC II Revision 01 Promulgated(01//11/2019)\n 190\n\nACKNOWLEDGEMENT\n\nThe Technical Education and Skills Development Authority (TESDA) wishes to\nextend thanks and appreciation to the many representatives of business, industry,\nacademe and government agencies who donated their time and expertise to the\ndevelopment and validation of these Training Regulations.\n\nTECHNICAL PANEL\n\nDR. MABELLE F. COLAYCO\nMR. MANOLITO “CHING”D.\nDONDONILLA\nPhilippine International Cosmetologists\nAssociation\n32-B Sct. Borromeo St., Brgy. South Triangle,\nTomas Morato, Quezon City\n\nDR. JUANITA H. FANDINO\nHealth Human Resource Development Bureau\nDepartment of Health\nBldg. 12-A San Lazaro Compound\nRizal Avenue, Sta. Cruz\nManila\n\nMS. MARIA YZLETTE M. LISING\nHealth Human Resource Development Bureau\nDepartment of Health\nBldg. 12-A San Lazaro Compound\nRizal Avenue, Sta. Cruz\nManila\n\nPhilippine Dermatological Society (PDS)\nRm. 1015 South Tower, Cathedral Heights Bldg.\nComplex St. Luke’s Medical Center\nE. Rodriguez Avenue, Quezon City\n\nDR. MARIA DEANNA T. MORENO\nPhilippine Dermatological Society (PDS)\nRm. 1015 South Tower, Cathedral Heights Bldg.\nComplex St. Luke’s Medical Center\nE. Rodriguez Avenue, Quezon City\n\nDR. KATRINA ANGELA Z. REYES\nPhilippine Dermatological Society (PDS)\nRm. 1015 South Tower, Cathedral Heights Bldg.\nComplex St. Luke’s Medical Center\nE. Rodriguez Avenue, Quezon City\n\nThe Participants in the Validation of this\nTraining Regulation\n\n•\nMembers of the Philippine International\nHaircutters Association (PIHA)\n•\nMembers of the Philippine International\nCosmetologists Association (PICA)\n• Members of the Haircutters and\nCosmetologists Association of the\nPhilippines (HACAP)\n\nThe Members of the TESDA Board\nThe MANAGEMENT and Staff of the\nTESDA Secretariat\nQualifications and Standards Office\n\n--- PDF PAGE 193 ---\nTR Beauty Care Services (Skin Care) NC II Revision 01 Promulgated(01//11/2019)\n 191"
