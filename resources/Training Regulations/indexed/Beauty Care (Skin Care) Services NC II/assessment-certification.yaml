    {
      "number": "4.1",
      "text": "NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS 4.1.1. Assessment shall cover all the competencies of the qualification with the basic and common units integrated or assessed concurrently with the core units of competency. 4.1.2. A National Certificate (NC) is issued when a candidate has demonstrated competence through full assessment, covering all the units required in the Training Regulations of Beauty Care (Skin Care) Services NC II. 4.1.3. The qualification of Beauty Care (Skin Care) Services NC II may be acquired through the accumulation of Certificates of Competency in the following units of competencies: COC 1 Perform facial cleansing COC 2 Perform temporary hair removal activity COC 3 Perform body scrub Certificates of Competency (COCs) shall be issued to candidates who have been assessed as competent in any of the above COCs (COC 1, COC 2, COC 3). Upon accumulation and submission of all the COCs acquired, an individual shall be issued the corresponding National Certificate for the Qualification. 4.1.4 Any of following are qualified to apply for assessment and certification: 4.1.4.1 Graduates of WTR-registered programs or graduates of NTR programs, including enterprise-based training programs related to Beauty Care (Skin Care) Services NC II. 4.1.4.2 Experienced workers (wage employed or self-employed) who gained competencies in providing skin care services for at least 2 years within the last 5 years. 4.1.5 Current holders of National Certificates (NC) in Beauty Care Services NC II are required to undergo re-assessment under the amended Training Regulations (TR) upon expiration of their NC."
    },
    {
      "number": "185",
      "text": "COMPETENCY ASSESSMENT REQUISITE 4.2.1 Self-Assessment Guide. The self-assessment guide (SAG) is accomplished by the candidate prior to actual competency assessment. SAG is a pre-assessment tool to help the candidate and the assessor determine what evidence is available, where gaps exist, including readiness for assessment. This document can: a) Identify the candidate’s skills and knowledge b) Highlight gaps in candidate’s skills and knowledge c) Provide critical guidance to the assessor and candidate on the evidence that need to be presented d) Assist the candidate to identify key areas in which practice is needed or additional information or skills that should be gained prior to assessment 4.2.2 Accredited Assessment Center. Only Assessment Center accredited by TESDA is authorized to conduct competency assessment. Assessment centers undergo a quality assured procedure for accreditation before they are authorized by TESDA to manage the assessment for National Certification. 4.2.3 Accredited Competency Assessor. Only accredited competency assessor is authorized to conduct assessment of competence. Competency assessors undergo a quality assured system of accreditation procedure before they are authorized by TESDA to assess the competencies of candidates for National Certification."
    }
