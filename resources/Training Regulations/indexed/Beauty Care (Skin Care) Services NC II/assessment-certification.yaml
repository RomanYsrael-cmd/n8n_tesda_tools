  "source_text": "SECTION 4 ASSESSMENT AND CERTIFICATION ARRANGEMENT\n\nCompetency Assessment is the process of collecting evidence and making\njudgments whether competency has been achieved. The purpose of assessment is\nto confirm that an individual can perform to the standards expected at the workplace\nas expressed in relevant competency standards.\n\nThe assessment process is based on evidence or information gathered to\nprove achievement of competencies. The process may be applied to an employable\nunit(s) of competency in partial fulfillment of the requirements of the national\nqualification.\n\n4.1.\nNATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1.1. Assessment shall cover all the competencies of the qualification with\nthe basic and common units integrated or assessed concurrently with\nthe core units of competency.\n\n4.1.2. A National Certificate (NC) is issued when a candidate has\ndemonstrated competence through full assessment, covering all the\nunits required in the Training Regulations of Beauty Care (Skin Care)\nServices NC II.\n\n4.1.3. The qualification of Beauty Care (Skin Care) Services NC II may be\nacquired through the accumulation of Certificates of Competency in the\nfollowing units of competencies:\nCOC 1 Perform facial cleansing\nCOC 2 Perform temporary hair removal activity\nCOC 3 Perform body scrub\n\nCertificates of Competency (COCs) shall be issued to candidates\nwho have been assessed as competent in any of the above COCs\n(COC 1, COC 2, COC 3). Upon accumulation and submission of all\nthe COCs acquired, an individual shall be issued the corresponding\nNational Certificate for the Qualification.\n\n4.1.4 Any of following are qualified to apply for assessment and\ncertification:\n\n4.1.4.1 Graduates of WTR-registered programs or graduates of NTR\nprograms, including enterprise-based training programs\nrelated to Beauty Care (Skin Care) Services NC II.\n4.1.4.2 Experienced workers (wage employed or self-employed) who\ngained competencies in providing skin care services for at\nleast 2 years within the last 5 years.\n\n4.1.5\nCurrent holders of National Certificates (NC) in Beauty Care Services NC\nII are required to undergo re-assessment under the amended Training\nRegulations (TR) upon expiration of their NC.\n\n--- PDF PAGE 187 ---\nTR Beauty Care Services (Skin Care) NC II Revision 01 Promulgated(01/11/2019)\n 185\nCOMPETENCY ASSESSMENT REQUISITE\n\n4.2.1 Self-Assessment Guide. The self-assessment guide (SAG) is\naccomplished by the candidate prior to actual competency\nassessment. SAG is a pre-assessment tool to help the candidate\nand the assessor determine what evidence is available, where gaps\nexist, including readiness for assessment.\n\nThis document can:\na) Identify the candidate’s skills and knowledge\nb) Highlight gaps in candidate’s skills and knowledge\nc) Provide critical guidance to the assessor and candidate on the\nevidence that need to be presented\nd) Assist the candidate to identify key areas in which practice is\nneeded or additional information or skills that should be gained prior\nto assessment\n\n4.2.2 Accredited\nAssessment\nCenter.\nOnly\nAssessment\nCenter\naccredited by TESDA is authorized to conduct competency\nassessment. Assessment centers undergo a quality assured\nprocedure for accreditation before they are authorized by TESDA to\nmanage the assessment for National Certification.\n\n4.2.3\nAccredited Competency Assessor. Only accredited competency\nassessor is authorized to conduct assessment of competence.\nCompetency assessors undergo a quality assured system of\naccreditation procedure before they are authorized by TESDA to\nassess the competencies of candidates for National Certification.\n\n--- PDF PAGE 188 ---\nTR Beauty Care Services (Skin Care) NC II Revision 01 Promulgated(01/11/2019)\n 186\n"
