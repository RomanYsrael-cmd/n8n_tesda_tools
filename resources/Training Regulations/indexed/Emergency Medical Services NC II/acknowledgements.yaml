    },
    {
      "source_text": "ELEMENTS PERFORMANCE CRITERIA Italicized terms are elaborated in the Range of Variables 1. Assess emergency situation in relation to safe access and extrication 1.1 Information relevant to the situation is obtained on or before arrival. 1.2 Situation is viewed to identify and mitigate dangers according to standard local ambulance procedure. 1.3 Condition of victim/patient is assessed. 1.4 Obstacles impacting on safe access and extrication are accurately identified. 1.5 Access and extrication plan is formulated based on an assessment of all factors associated with the situation or incident in line with national emergency management arrangements. 1.6 Access and extrication plan is formulated and prioritized based on the main concerns of victim/patient welfare and safety of all personnel. 1.7 Equipment and personnel needs are assessed based on an assessment of all factors associated with the situation or incident. 1.8 Equipment and personnel needs are assessed based on victim/patient and personnel welfare as the prime concern. 2. Implement procedure to enable safe access and extrication 2.1 Additional personnel and equipment are requested or arranged as the need dictates. 2.2 Access/extrication plan is implemented using equipment and personnel necessary to ensure safe access/extrication and victim/patient welfare. 2.3 Means of safe access and extrication negotiated and maintained according to national OSH standards, as well as service policies and procedures. 2.4 Actions are in accordance with local ambulance standard operation procedures. 2.5 Available resources are utilized as necessary. 2.6 Must be familiar with the use of carry chairs. 3. Monitor access and extrication procedure in an emergency situation 3.1 Safety of victim/patient and personnel is of prime concern. 3.2 Progress of access/extrication is monitored constantly to ensure welfare of the victim/patient and safety of personnel. 3.3 Victim/Patient is monitored constantly to detect any change in condition. 3.4 All conditions and factors impacting on safe access/extrication and victim/patient welfare are monitored constantly. 3.5 Access/extrication plan is modified as necessary to ensure safety and the welfare of the victim/patient."
