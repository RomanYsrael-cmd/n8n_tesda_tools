 II (Amended)\nPromulgated December 2013\n46\nUNIT OF COMPETENCY :\nDELIVER BASIC AMBULANCE COMMUNICATION SKILLS\n\nUNIT CODE\n:\nHCS322307\n\nUNIT DESCRIPTOR\n:\nThis unit of competency covers the skills required to exercise\neffective communication skills in work relating to ambulance\noperations.\n\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Exercise effective\ncommunication\ntechniques\n1.1\nVerbal and non-verbal communication is used constructively to\nachieve planned work outcomes.\n1.2 All forms of communication with clients and colleagues reflect an\nunderstanding and respect for individual differences and\nneeds.\n1.3 Self-introduction occurs appropriately when required.\n1.4 Interviewing and active listening techniques are used where\nneeded to identify and confirm work requirements.\n1.5 Communication is clear and relevant to situation, context and\nactivities undertaken.\n1.6 Touch and other non-verbal means of communication are used\nprudently, carefully and only as appropriate.\n1.7 Advice about communication difficulties with clients or colleagues\nis sought and obtained from supervisor/appropriate person and\nimplemented as required.\n1.8 Advice and assistance is sought from legitimate sources as and\nwhen appropriate to maintain and develop effective\ncommunication skills.\n1.9 Own style is adjusted to incorporate advice that addresses\nperformance issues to maintain the agreed standard of effective\ncommunication.\n2. Convey and receive\ninformation using\navailable modes of\ncommunication\n2.1\nCommunication codes and equipment are used correctly.\n2.2 Information received is acknowledged and/or clarified using\nactive listening.\n3. Follow routine\ninstructions\n3.1\nWorkplace instructions are interpreted correctly and carried out\nwithin agreed time frames.\n3.2 Clarification of work instructions is sought when required to\nensure understanding.\n3.3 Difficulties in carrying out instructions are referred to supervisor\nor appropriate person to ensure required work outcomes.\n4. Communicate with\npatients\n4.1\nRapport is established through open, sensitive and confident\nmanner.\n4.2 Patient (or agent of patient) is informed about patient care\nprocedures in a manner, and at a time consistent with the overall\nneeds of the patient and situation as a whole.\n4.3 Information is obtained from patient or others showing the\nfirmness, sensitivity and respect for confidentiality demanded by\nthe situation.\n4.4 Interaction recognizes and respects religious, social and cultural\ndifferences between individuals that may require special\ncommunication skills or patient care procedures.\n5. Complete reports as\nrequired\n5.1\nReports are completed as required to the standard expected in\nthe workplace.\n5.2 Reports are completed correctly within identified time frames.\n5.3\nReports are clear and accurate.\n6. Present a positive\nimage of the service\nto the public\n6.1\nCommunication with the public is conducted in a courteous\nmanner and respecting privacy.\n6.2 Standards of personal presentation are appropriate to the\norganization.\n\n--- PDF PAGE 50 ---\nTESDA-SOP-QSO-01-F08\nTR-Emergency Medical Services NC II (Amended)\nPromulgated December 2013\n47\nRANGE OF VARIABLES\n\nVARIABLES\nRANGE\n1. Individual differences\nand needs\nMay include:\n1.1\nDevelopmental\n1.2\nCultural\n1.3\nPhysical\n1.4\nEmotional\n1.5\nBehavioral\n1.6\nIntellectual\n1.7 Religion\n2. Communication\nMay Include:\nAll verbal and non-verbal interaction with clients and colleagues in a\nrange of appropriate interpersonal contexts\n3. Communicating\neffectively will be\ncarried out within\nrequirements\nestablished by\nMay include:\n3.1\nAnti discrimination legislation\n3.2\nAccepted cultural protocols\n3.3\nAccepted language protocols and systems\n3.4\nInforming patients of procedures that may be conducted before,\nduring or after treatment\n4. Exercising effective\ncommunication skills\nMay include:\n4.1\nBeing non judgmental\n4.2\nActive listening\n4.3\nUsing culturally appropriate communication methods\n4.4\nNon-verbal behavior to indicate understanding of what is being\nsaid\n4.5\nClarifying what is said\n4.6\nResponses that are culturally appropriate\n4.7\nParticipating constructively in group processes\n5. Appropriate persons\nmay be from within or\noutside the\norganizations\nMay include:\n5.1\nColleagues\n5.2\nImmediate supervisor/s\n5.3\nOther health workers\n5.4\nConsultants\n6. Communication\nequipment\nMay include:\n6.1\nTwo way portable Radio\n6.2\nTelephone\n6.3\nComputer\n6.4\nFax\n6.5\nMobile phone\n6.6\nMobile data terminal\n7. Procedures, according\nto the judgment of the\nambulance officer,\nwith due regard to\nMay include:\n7.1\nLife threatening conditions\n7.2\nDuty of care\n7.3\nContract of care\n7.4\nMedico-legal implications\n7.5\nNature of illness/injury\n8. Instructions\nMay include:\n8.1\nManufacturer/operating written instructions\n8.2\nWork unit guidelines, procedures and protocols including OSH\nprocedures and protocols for using interpreters\n8.3\nSupervisor or management instructions\n8.4\nInstructions may be:\n8.4.1 Written\n8.4.2\nVerbal\n9. Reports may be verbal\nor written\nMay include:\n9.1\nNotes\n9.2\nRecords\n9.3\nMemos\n9.4\nLetters\n9.5\nClient records\n9.6\nEndorsements at the end of a shift\n\n--- PDF PAGE 51 ---\nTESDA-SOP-QSO-01-F08\nTR-Emergency Medical Services NC II (Amended)\nPromulgated December 2013\n48\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nUsed a range of communication methods used in the\nworkplace e.g. oral, written notes, memos, letters, charts,\ndiagrams\n1.2\nCommunicated with both clients and colleagues in a\nrepresentative range of workplace situations\n2. Required Knowledge\n2.1\nReferral processes of organization\n2.2\nEffect of sensory loss and cognitive impairment\n2.3\nRelevant guidelines and procedures, and a range of written\ninformation relevant to the job role\n3. Required Skills\n3.1\nOral communication skills\n3.2\nWritten communication\n3.3\nInterpersonal skills required include working with others,\nempathy with patient and relatives and an ability to relate to\npersons from differing cultural, social and religious\nbackgrounds\n4. Resource\nImplications\nThe following resources should be provided:\n4.1\nAccess to appropriate workplace or simulation of realistic\nworkplace setting where assessment can be conducted\n4.2\nAccess to equipment and resources normally used in the\nworkplace\n5. Methods of\nAssessment\nCompetency in this unit must be assessed through:\n5.1\nObservations with questioning\n5.2\nOral questioning/Interview\n5.3\nEvidence gathered from the workplace environment\n5.4\nDemonstration over a period of time to ensure consistency of\nperformance\n6. Context of\nAssessment\n6.1\nEvidence must include observation of performance in the\nwork environment or in a simulated work setting\n\n--- PDF PAGE 52 ---\nTESDA-SOP-QSO-01-F08\nTR-Emergency Medical Services NC II (Amended)\nPromulgated December 2013\n49\nUNIT OF COMPETENCY :\nCONTRIBUTE IN ON-ROAD OPERATIONS\n\nUNIT CODE\n:\nHCS322321\n\nUNIT DESCRIPTOR\n:\nThis unit of competency involves day-to-day management of\nambulance in on-road operations, excluding patient care.\n\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Contribute in\nrelaying\ncommunication\n1.1\nCommunication techniques and procedures are managed to\nensure they are consistent with implementing rules and\nregulations, laws, ordinances, service policies and\nprocedures.\n1.2\nCommunication with control centre is managed to ensure\nthat it is established and maintained.\n1.3\nNotification of receiving facility is managed to ensure that\nlocal policies and procedures are adhered to.\n2. Oversee ambulance\nand equipment\npreparation,\nmaintenance and\ncleaning\n2.1\nAmbulance and equipment are 