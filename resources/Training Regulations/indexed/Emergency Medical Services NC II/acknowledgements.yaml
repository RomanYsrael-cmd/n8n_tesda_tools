ions and Ambulance Acts\nand regulations of the Land Transportation Office\n3.2\nAll lawful standing orders, policies and procedures issued by\nAmbulance Services pertaining to the driving and operation of\nservice vehicles.\n4. Safe work practices\nare detailed in\nMay include:\n4.1\nOccupational Safety and Health Acts, Regulations and\nStandards (e.g. Lifting and moving techniques)\n4.2\nService policy and procedures\n4.3\nLegislation, acts, regulations, service policies and procedures\ninclude those relating to the operation of radio and electronic\ncommunication equipment\n5. Communication\nequipment\nMay include:\n5.1\nService radio equipment (e.g. two way portable radio)\n5.2\nEquipment of other services\n5.3\nViable alternatives which support effective communication\n\n--- PDF PAGE 54 ---\nTESDA-SOP-QSO-01-F08\nTR-Emergency Medical Services NC II (Amended)\nPromulgated December 2013\n51\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nObservation of performance in the work environment or a\nsimulation\n1.2\nObservation in management of ambulance operations\nincluding communications, transport and handling of patients\nin a variety of situations\n2. Required Knowledge\n2.1\nKnowledge of relevant legislation, regulations, service policies\nand procedures.\n2.2\nStandards of cleanliness and serviceability of vehicles\nrequired by law and Service policies and procedures\n2.3\nRoad rules and laws applying to emergency vehicles in the\narea\n2.4\nPatient care and restraint during transportation\n2.5\nMethods of loading and unloading patients under life-\nthreatening conditions\n2.6\nKnowledge of relevant acts, regulations, procedures and\nindustrial guidelines governing the removal of patients from\nthe scene of the incident\n2.7\nSupervisory methods and techniques\n3. Required Skills\n3.1\nUsing communications equipment and systems\n3.2\nOral communication skills\n3.3\nWritten communication skills\n3.4\nInterpersonal skills required include working with others,\nempathy with patient and relatives and an ability to relate to\npersons from differing cultural, social and religious\nbackgrounds\n3.5\nProblem solving skills required include an ability to assess and\nevaluate available resources, analyse information and make\ndecisions that ensure the effective supervision of on-road\noperations\n4. Resource\nImplications\nThe following resources should be provided:\n4.1\nAccess to appropriate workplace or simulation of realistic\nworkplace setting where assessment can be conducted\n4.2\nAccess to equipment and resources normally used in the\nworkplace\n5. Methods of\nAssessment\nCompetency in this unit must be assessed through:\n5.1\nObservations, questioning and evidence gathered from the\nworkplace environment\n5.2\nDemonstration over a period of time to ensure consistency of\nperformance\n6. Context of\nAssessment\n6.1\nEvidence must include observation of performance in the work\nenvironment or in a simulated work setting\n\n--- PDF PAGE 55 ---\nTESDA-SOP-QSO-01-F08\nTR-Emergency Medical Services NC II (Amended)\nPromulgated December 2013\n52\nUNIT OF COMPETENCY :\nCONTRIBUTE TO EMERGENCY SCENE MANAGEMENT\n\nUNIT CODE\n:\nHCS322322\n\nUNIT DESCRIPTOR\n:\nThis unit of competency involves management of procedures\ninvolving victim/patient care at the scene of an emergency.\n\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Contribute in\nidentifying real and\npotential hazards in\nthe environment\n1.1\nInformation is gathered to allow accurate assessment of\nthe situation or incident.\n1.2\nHazards (existing and potential) are accurately identified.\n1.3\nThe approach to an incident is accurately accessed,\nlooking for visible signs of danger.\n1.4\nAppropriate resources are positioned to facilitate\nsafe/timely ambulance access and extrication.\n2. Communicate with\nthose involved in the\nincident\n2.1\nInformation about the incident or scenariois\ncommunicated to coordinator in accordance with service\npolicies.\n2.2\nInformation is communicated to people involved in the\nincident in accordance with service policies.\n3. Control\nhazards/scene safety\n3.1\nExisting and potential hazards to the safety and welfare of\npatients and others are mitigated or avoided/negated.\n3.2\nPersonal protective clothing and equipment is worn/used\nas necessary.\n3.3\nInfection control procedures are implemented when\nnecessary.\n3.4\nResistive and/or combative patients are managed\nappropriately.\n3.5\nSecurity of the scene for ambulance personnel is ensured\nby the ambulance/medical command in consultation with\nincident commander.\n3.6\nResources are made available, utilized appropriately, and\nreplenished as needed.\n4. Communicate with\nmedical and other\nemergency and allied\nservices with EMT’s\nsupervision to ensure\nsafety at scene\n4.1\nApply the standard operating procedures for\ncommunication and coordination with medical services\nand allied services.\n4.2\nCommunicate necessary information for allied services thru\nchannels (Chain of Command).\n\n5. Monitor the\nenvironment\n5.1\nThe environment is monitored to identify changes that may\ncompromise safety or victim/patient care.\n5.2\nEnvironmental changes requiring further control are quickly\nrecognized and communicated to appropriate agencies.\n\n--- PDF PAGE 56 ---\nTESDA-SOP-QSO-01-F08\nTR-Emergency Medical Services NC II (Amended)\nPromulgated December 2013\n53\nRANGE OF VARIABLES\n\nVARIABLES\nRANGE\n1. Scenarios\nMay include:\n1.1\nPublic traffic accidents (air, land, water)\n1.2\nHousehold accidents\n1.3\nEvents such as concerts and religious events\n1.4\nExhibitions, sporting events\n1.5\nStreet scene (e.g. riots, rally, stampedes, etc.)\n1.6\nRavine and Cliff accidents\n1.7\nFire ground incidents\n2. Hazards are dangers\nor risks that may\naffect or influence\nambulance\noperations\nMay include:\n2.1\nNatural (eg: typhoon, earthquake, volcanic eruptions,\ngeologic, meteorological, etc.)\n2.2\nHuman Generated (eg: civil disturbance, hazardous materials,\nfire, warfare, etc.)\n3. Information\ncommonly gathered\nMay include:\n3.1\nDetails of the incident/event\n3.2\nName, profile and number of victims.\n3.3\nReligious, social and cultural differences are those that may\ninfluence the administration of patient care and general\nwelfare of the patient. These values are identified and\nassessed in terms of their importance to the patient, based on\nthe judgment of the ambulance personnel.\n3.4\nIngress and Egress Routes\n3.5\nHazards, obstacles critical terrain features.\n3.6\nBest location for staging, treatment and evacuation areas.\n4. Medical services\nMay include:\n4.1\nMedical Command\n4.2\nAmbulance Command/ Ambulance Team Leader\n4.3\nEmergency support agencies\n4.4\nNational Disaster Risk Reduction Management Council\n(NDRRMC) and its local counterparts depending on the extent\nof the incident.\n4.5\nLocal Healthcare Providers\n4.6\nLocal and International NGO’s (medical missions)\n5. Emergency and allied\nservices\nMay include:\n5.1\nIncident Commander\n5.2\nAFP\n5.3\nPolice\n5.4\nFire\n5.5\nLGU\n5.6\nElectricity and water services\n5.7 Coast Guard\n5.8 Local and International recognized NGO’s\n\n--- PDF PAGE 57 ---\nTESDA-SOP-QSO-01-F08\nTR-Emergency Medical Services NC II (Amended)\nPromulgated December 2013\n54\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nDemonstrated successful performance in the work environment\nor simulation\n1.2\nDemonstrated ability in management of situations/incidents\nrequiring:\n1.2.1 Scene Size-up\nM- major incident\nE- exact location\nT- type of incident\nH- hazards involved\nA- access to site\nN- number of casualties\nE- emergency services required\n1.2.2 Establishment and maintenance of inter-service liaison\n1.2.3 Infection control procedures\n1.2.4 Restive and combative patient control procedures\n1.2.5 Identification of resources and their uses\n1.2.6 Communication and interpersonal skills\n1.2.7 Pre-hospital Skills\n1.2.8 Appropriate use of Personal Protective Equipment (PPE)\n1.2.9\nDocumentation and reporting\n2. Required Knowledge\n2.1\nKnowledge of allied service procedures (e.g. Bureau of Fire\nProtection)\n2.2\nKnowledge of appropriate national policies and procedures\n2.3\nWorking knowledge of command, control and coordination\nresponsibilities\n2.4\nUse of communications equipment and systems\n2.5\nKnowledge of hazards and potential hazards and their effect\n2.6\nRelevant service policies and procedures\n2.7\nInfection control procedures\n2.8\nRestive and combative patient control procedures\n2.9\nServices provided by medical and other emergency and allied\nagencies, and their limitations\n3. Required Skills\n3.1\nOral communication skills required to fulfill job roles as specified\nby the organization/service.\n3.2\nWritten communication skills required to fulfill job roles as\nspecified by organization/service.\n3.3\nInterpersonal skills required include working with others, and an\nability to relate to persons from differing cultural, social and\nreligious backgrounds\n3.4\nObserve and practice different regional sensitive and cultural\ndifferences.\n3.5\nProblem solving skills required include an ability to use available\nresources, analyze information quickly, manage multiple\ncompeting priorities and make decisions that ensure the overall\neffective management of the scene of an emergency\n4. Resource Implications\nThe following resources should be provided:\n4.1\nAccess to appropriate workplace or simulation of realistic\nworkplace setting where assessment can be conducted\n4.2\nAccess to equipment and resources normally used in the\nworkplace\n4.3\nAccess to experienced Instructors and Assessors.\n5. Methods of\nAssessment\nCompetency in this unit must be assessed through:\n5.1\nObservation with questioning\n5.2\nOral questioning/Interview\n5.3\nEvidence gathered from the workplace environment\n5.4\nDemonstration over a period of time to ensure consistency of\nperformance\n5.5\nDemonstration with questioning.\n6. Context of\nAssessment\n6.1\nEvidence must include observation of performance in the work\nenvironment or in a simulated work setting.\n6.2\nDemonstration in the workplace.\n\n--- PDF PAGE 58 ---\nTESDA-SOP-QSO-01-F08\nTR-Emergency Medical Services NC II (Amended)\nPromulgated December 2013\n55\nUNIT OF COMPETENCY :\nCONTRIBUTE TO SPECIAL EVENT SCENE MANAGEMENT\n\nUNIT CODE\n:\nHCS322323\n\nUNIT DESCRIPTOR\n:\nThis unit of competency involves attending the scene of sporting or\nspecial events involving large numbers of people or special risks,\nand ensuring safety at the scene.\n\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Attend mass\ngathering events\n1.1\nPlanning stage of any event is participated and attended\nin accordance with mass gathering guidelines stated in\nWorld Health Organization (WHO).\n1.2\nScene of event is assessed using all available information\nand first hand observation.\n1.3\nHazards (existing and potential) and the level of risk and\naccurately identified utilizing current emergency risk\nmanagement process.\n1.4\nEmergency management plan is developed, or existing\nemergency management plan is implemented in consultation\nwith event organizers.\n1.5\nAmbulance Staging is developed and implemented to\nunderpin ambulance operations and their role within the\nemergency management plan.\n1.6\nAmbulance resources are deployed in accordance with the\nunified management plan.\n1.7\nAmbulance resources are positioned to facilitate access and\negress.\n1.8\nLines of communication are established and maintained in\naccordance with the management plan and Service policies\nand procedures.\n2. Ensure safety at the\nscene\n2.1\nAmbulance is positioned strategically: a) to ensure safety for\nvehicle, crew, patient, equipment, b) allow accessibility.\n2.2\nThe Personnel are properly identified and personal\nprotective clothing and equipment is worn as required\n2.3\nSecurity of the scene for Emergency Medical Services\n(EMS) is ensured by the Medical Commander in consultation\nwith the event Incident Commander or Security Commander.\n2.4\nCoordinate with Allied Services regarding mitigation of\nspecific hazards to enable patient treatment in hazard-free\nenvironment in line with standard ambulance staging\nprocedures in accordance with established standards.\n2.5\nActions are in accordance with current and existing\nestablished standard.\n\n--- PDF PAGE 59 ---\nTESDA-SOP-QSO-01-F08\nTR-Emergency Medical Services NC II (Amended)\nPromulgated December 2013\n56\nRANGE OF VARIABLES\n\nVARIABLES\nRANGE\n1. Scene\nMay include:\n1.1\nMass Gathering Events\n1,1,1 Local Fairs\n1.1.2 Music Events\n1.1.3 School and University Gatherings\n1.1.4 Stadium Events\n1.1.5 Sports Events\n1.1.6 Motor Sports\n1.1.7 Water Sports\n1.1.8 Political demonstrations\n1.1.9 Religious Events\n2. Hazards are dangers\nor risks that may\naffect or influence\nambulance care\nMay include:\n(Natural and Human Generated)\n2.1\nAgent release\n2.2\nRiot or panic\n2.3\nFire\n2.4\nFlood\n2.5\nPower/electricity\n2.6\nLighting\n2.7\nRough/slippery Surfaces\n2.8\nAtmospheric conditions\n2.9\nClimatic conditions\n2.10 Vehicles\n2.11 Structures\n2.12 Bystanders\n2.13 Human judgment and influence\n3. Emergency and allied\nservices\nMay include:\n3.1\nIncident Commander\n3.2\nOperations Officer\n3.2.1Medical\n3.2.2SAR (Search and Rescue)\n3.2.3Security\n3.2.4 Safety\n3.2.5 Fire\n3.2.6 Hazard specific agencies\n3.2.7 Volunteer agencies/personnel\n3.2.8 Media\n3.3\nLogistics Officer\n3.3.1Electricity, Telecommunication and Water\n3.3.2 Food and Supplies\n3.3.3 Manpower Roster\n3.3.4 Equipment\n3.4\nFinance Officer\n3.5\nLocal government/barangay\n3.6\nEvent organizers\n\n--- PDF PAGE 60 ---\nTESDA-SOP-QSO-01-F08\nTR-Emergency Medical Services NC II (Amended)\nPromulgated December 2013\n57\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nComplied the criteria stated in the Observation Checklist for work\nenvironment or simulated situations\n1.2\nDocumented evidence must include production of an effective\nevent plan which provides for:\n1.2.1 Effective communications\n1.2.2 Rapid response\n1.2.3 Rapid and safe access and egress\n1.2.4 Safety of personnel, equipment, ambulance, self, crew,\nand patient\n2. Required Knowledge\n2.1\nOral communication skills required to fulfill job roles as specified\nby the organization/service.\n2.2\nWritten communication skills required to fulfill job roles as\nspecified by organization/service.\n2.3\nInterpersonal skills required include working with others, and an\nability to relate to persons from differing cultural, social and\nreligious backgrounds\n2.4\nObserve and practice different regional sensitive and cultural\ndifferences.\n2.5\nProblem solving skills required include an ability to use available\nresources, analyze information quickly, manage multiple\ncompeting priorities and make decisions that ensure the overall\neffective management of the scene of an emergency\n2.6\nKnowledge of allied service procedures\n2.7\nKnowledge of appropriate organizational policies and procedures\n2.8\nWorking knowledge of command, control and coordination\nresponsibilities\n2.9\nUse of communications equipment and systems\n2.10\nKnowledge of hazards and potential hazards and their effect\n2.11\nRelevant service policies and procedures\n3. Required Skills\n3.1\nStress management skills\n3.2\nOral communication skills required to fulfill job roles as specified\nby the organization/service.\n3.3\nWritten communication skills required to fulfill job roles as\nspecified by organization/service.\n3.4\nInterpersonal skills required include working with others,\nempathy with patient and relatives and an ability to relate to\npersons from differing cultural, social and religious backgrounds\n3.5\nProblem solving skills required include an ability to use available\nresources innovatively, analyze information and make decisions\nthat ensure the effective management of the scene/event\n4. Resource Implications\nThe following resources should be provided:\n4.1\nAccess to appropriate workplace or simulation of realistic\nworkplace setting where assessment can be conducted\n4.2\nAccess to equipment and resources normally used in the\nworkplace\n4.3\nAccess to experienced Instructors and Assessors.\n5. Methods of\nAssessment\nCompetency in this unit must be assessed through:\n5.1\nObservation with questioning\n5.2\nOral questioning/Interview\n5.3\nEvidence gathered from the workplace environment\n5.4\nDemonstration over a period of time to ensure consistency of\nperformance\n5.5\nWritten exam\n6. Context of\nAssessment\n6.1\nEvidence must include observation of performance in the work\nenvironment or in a simulated work setting\n\n--- PDF PAGE 61 ---\nTESDA-SOP-QSO-01-F08\nTR-Emergency Medical Services NC II (Amended)\nPromulgated December 2013\n58\nUNIT OF COMPETENCY :\nCONTRIBUTE TO NON-EMERGERGENCY ROUTINE SCENE\nMANAGEMENT\n\nUNIT CODE\n:\nHCS322324\n\nUNIT DESCRIPTOR\n:\nThis unit of competency involves the routine management of a\nnon-emergency situation to ensure safety at the scene.\n\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Attend to non-\nemergency event\n1.1\nAmbulance is positioned to facilitate access and departure\nwhile keeping safe all personnel and the vehicle.\n1.2\nHazards, real or potential, are identified where there are\nrisks to participants or bystanders.\n1.3\nLines of communication with others are identified and\nmaintained according to service policy and procedures.\n1.4\nCorrect communication procedures are observed in\naccordance with service policy and procedures.\n2. Take appropriate\nmeasures to ensure\nsafety at the scene\n2.1\nAmbulance is positioned to protect self, team and patient(s).\n2.2\nPersonal protective clothing is worn in accordance with\noperating procedures.\n2.3\nAmbulance resources are utilized and improvised to secure\nthe scene.\n2.4\nAppropriate roles are undertaken as prescribed by Acts,\nregulations, service policy and procedure.\n2.5\nRisk is minimized by enlisting hazard reduction agents to\nenable provision of treatment in hazard-free or hazard-\nreduced environment.\n2.6\nAction is in accordance with current and existing established\nstandard.\n\nRANGE OF VARIABLES\n\nVARIABLES\nRANGE\n1. Scene\nMay include:\n1.1\nConcerts\n1.2\nExhibitions\n1.3\nSporting events\n1.4 Religious events\n2. Hazards are dangers\nor risks that may\naffect or influence\npre-hospital care\nMay include:\n2.1\nLighting\n2.2\nSurfaces\n2.3\nAtmospheric conditions\n2.4\nClimatic conditions\n2.5\nVehicles\n2.6\nStructures\n2.7\nBystanders\n2.8\nHuman judgment and influence\n\n--- PDF PAGE 62 ---\nTESDA-SOP-QSO-01-F08\nTR-Emergency Medical Services NC II (Amended)\nPromulgated December 2013\n59\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\n\nAssessment requires evidence that the candidate:\n1.1\nDemonstrated successful performance in the work\nenvironment or simulated situations\n1.2\nFollowing an effective event plan for managing a routine non-\nemergency which provides for:\n Effective communications\n Rapid response\n Rapid and safe access and egress\n Safety of personnel\n2. Required Knowledge\n2.1\nA knowledge of allied service procedures\n2.2\nA knowledge of appropriate national and local policies and\nprocedures\n2.3\nA working knowledge of command, control and coordination\nresponsibilities\n2.4\nRelevant national standards\n2.5\nUse of communications equipment and systems\n2.6\nKnowledge of hazards and potential hazards and their effect\n2.7\nRelevant service policies and procedures\n3. Required Skills\n3.1\nStress management skills\n3.2\nOral communication skills required to fulfill job roles as\nspecified by the organization/service.\n3.3\nWritten communication skills required to fulfill job roles as\nspecified by organization/service.\n3.4\nInterpersonal skills required include working with others, and\nan ability to relate to persons from differing cultural, social and\nreligious backgrounds\n3.5\nProblem solving skills required include an ability to use\navailable resources innovatively, analyze information and\nmake decisions that ensure the routine management of a non-\nemergency\n4. Resource\nImplications\nThe following resources should be provided:\n4.1\nAccess to appropriate workplace or simulation of realistic\nworkplace setting where assessment can be conducted\n4.2\nAccess to equipment and resources normally used in the\nworkplace\n4.3 Access to expert and experienced Instructors and Assessors\n5. Methods of\nAssessment\nCompetency in this unit must be assessed through:\n5.1\nObservation with questioning\n5.2 Oral questioning/Interview\n5.3\n Evidence gathered from the workplace environment\n5.4\nDemonstration over a period of time to ensure consistency of\nperformance\n6. Context of\nAssessment\n6.1\nEvidence must include observation of performance in the work\nenvironment or in a simulated work setting\n\n--- PDF PAGE 63 ---\nTESDA-SOP-QSO-01-F08\nTR-Emergency Medical Services NC II (Amended)\nPromulgated December 2013\n60\nUNIT OF COMPETENCY :\nDELIVER PRE- HOSPITAL PATIENT CARE\n\nUNIT CODE\n:\nHCS322325\n\nUNIT DESCRIPTOR\n:\nThis unit of competency involves assessing basic patient needs,\nplanning the procedure(s) to be implemented, implementing\nprocedure(s) and monitoring the state of the patient at the level of\nbasic patient care.\n\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1.\nContribute in\nmaking initial\npatient\nassessment\n1.1\nPre-planning is conducted before arrival at scene based on\ninformation communicated in request for service.\n1.2\nScene survey is conducted according to local ambulance\nstandard operating procedure.\n1.3\nPrimary survey is conducted according to local ambulance\nstandard operating procedure.\n1.4\nVital signs are checked and monitored in accordance with\nlocal ambulance standard operating procedure.\n1.5\nHistory of the event is obtained following established\nprocedures.\n1.6\nTransport requirements and appropriate destination are\nassessed, considering patient's condition and the type of\nresources needed to ensure that requirements of urgency\nand patient care are met.\n2.\nContribute in\nimplementing\npatient care\nprocedures as\nthe situation\npresents itself\n2.1\nAssist the EMTs in patient care procedures which are\ncommenced as patient’s present condition determines,\nwith reference to local clinical guidelines.\n2.2\nMust be familiar with all the supplies and equipment in the\nambulance.\n2.3\nWhere the situation or patient’s condition requires treatment\nthat is outside the scope or authority to practise of the\nattending officer, the need for assistance is recognized and\nsought immediately.\n2.4\nAmbulance equipment utilized in patient management is\ncorrectly operated according to manufacturer/supplier’s\ninstructions and local clinical guidelines.\n2.5\nPatient care techniques are implemented in accordance with\ninfection control procedures and techniques.\n2.6\nPractice safe lifting and patient handling techniques in\naccordance with established existing International Labor\nOrganization and local EMS policies and procedures.\n\n3.\nContribute in\nmonitoring basic\npatient care and\nmodify as\nrequired\n3.1\nPatient and his/her presenting conditions are re-assessed at\nappropriate intervals as required according to local\nambulance standard operating procedure.\n\n3.2\nAssist the EMTs in monitoring pulse Oximeter (SPO2)\n\n4. Endorse patients\nrequiring basic\ncare\n4.1\nRelevant patient details are documented according to local\nambulance standard operating procedure.\n4.2\nPatient confidentiality is maintained at all times.\n4.3\nDocumentation for endorsement procedures conveys all\nnecessary information.\n4.4\nInformation is conveyed appropriately to those\nindividuals involved in ongoing patient care to facilitate\nunderstanding and optimize continuing patient care.\n4.5\nBasic Patient care is maintained until responsibility for patient\ncare is taken over by staff of the receiving agency.\n\n--- PDF PAGE 64 ---\nTESDA-SOP-QSO-01-F08\nTR-Emergency Medical Services NC II (Amended)\nPromulgated December 2013\n61\nRANGE OF VARIABLES\n\nVARIABLES\nRANGE\n1. Pre-planning\nMay include:\n1.1\nPotential resources required such as equipment, personnel,\nother services\n1.2\nAccess and egress requirements\n1.3\nIdentification of potential safety issues\n2. Scene survey\nMay include:\n2.1\nIdentification of dangers and hazards of the environment/\nlocation\n2.2\nOperational safety\n2.3\nConfirmation of location and initial case details\n2.4\nDetermination of access, egress and initial equipment\nrequirements\n\n3. Primary survey\nMay include:\n3.1\nDangers\n3.2\nResponse\n3.3\nCirculation\n3.4\nAirway\n3.5\nBreathing\n4. Vital signs\nMay include:\n4.1\nConscious state assessment e.g. Glasgow Coma Score,\nAVPU - alert, voice, pain, unconscious\n4.2\nPupillary size and reactions\n4.3\nRespiratory status assessment, e.g. rate, rhythm, effort and\nbreath sounds\n4.4\nPerfusion status assessment, e.g. pulse, blood pressure,\ncapillary refill and skin color\n\n5. Situation involving\npatient transfer\nMay include:\n5.1\nTransfer of patient with illness or injury\n5.2\nAssist the EMTs in the management of all patients in trauma\nor with illness\n\n6. Mode of transport is\nselected for its\navailability and\npotential to provide\nthe means of mobile\ncare most suited to\nthe needs of the\npatient\n\nMay include:\n6.1\nRoad ambulances/fire trucks/vans\n6.2\nRescue or retrieval units\n6.3\nFixed and rotary wing aircraft\n6.4\nWater-borne craft\n6.5\nFour wheel drive vehicle, motorcycle, tricycle\n7. Patient management\nwill need to take into\naccount for\nMay include:\n7.1\nLocation and nature of incident\n7.2\nEnvironmental conditions\n7.3\nNumber of casualties and potential casualties\n7.4\nUse and availability of ambulance equipment\n\n--- PDF PAGE 65 ---\nTESDA-SOP-QSO-01-F08\nTR-Emergency Medical Services NC II (Amended)\nPromulgated December 2013\n62\nVARIABLES\nRANGE\n8. Techniques expected\nto be utilized where\npatient’s condition\nindicates they would\nbe of some benefit\nMay include:\n8.1\nAirway management e.g. Head tilt chin lift, oropharyngeal\nairway and suction\n8.2\nAutomated External Defibrillatior (AED)\n8.3\nSpinal immobilization device/vacuum, mattress, c-collar,\nextrication device\n8.4\nGeneral splinting device\n8.5\nTraction and other types of splinting\n9. Non-verbal cues\nMay include:\n9.1\nPosturing\n9.2\nGait\n9.3\nAnxiety, restlessness\n10. Types of\ndocumentation\n\nMay include:\n10.1 Preparation (ambulance) of incident reports\n10.2 Handover reports\n10.3 Case management material\n11. Persons authorized to\nreceive confidential\ninformation\nMay include:\n11.1 Medical personnel at hospitals and surgeries\n11.2 Police Officers\n11.3 Legal practitioners\n11.4 Others, where approved as acting in the best interests of the\npatient (e.g. Social Services)\n12. Reports\n\nMay include:\n12.1 Verbal (oral or written)\n12.2 Non-verbal (with gestures)\n13. Acts and regulations\nare those specified in\nthe locality that relate\nMay include:\n13.1 Confidentiality\n13.2 Freedom of information\n14. Policy and procedures\nthat relate to\n\nMay include:\n14.1 Documentation\n14.2 Reporting of patient medical information\n\n--- PDF PAGE 66 ---\nTESDA-SOP-QSO-01-F08\nTR-Emergency Medical Services NC II (Amended)\nPromulgated December 2013\n63\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate demonstrated:\n1.1\nCorrect use of approved documents\n1.2\nCorrect documentation of patient and incident details\n1.3\nInteraction with receiving facility personnel\n1.4\nThe initial patient assessment used to detect and correct any\nimmediate life threatening conditions. These must include\nprimary survey of:\n Danger\n Response\n Circulation\n Airway\n Breathing\n1.5\nAccurate completion of all documentation and supplying all\nrelevant patient information to receiving facility staff under a\nvariety of conditions and circumstances\n2. Required Knowledge\n\n2.1\nBasic physiology and anatomy\n2.2\nProcedures and equipment used for Cardio Pulmonary\nResuscitation with Automated External Defibrillator operation,\nas specified within authorized limits defined by legal\nrequirements and service policies\n2.3\nReceiving facility requirements or how to access these\nrequirements\n2.4\nFunction of documentation being provided\n3. Required Skills\n3.1\nOral communication skills required to fulfil job roles as\nspecified by the organization/service.\n3.2\nWritten communication skills required to fulfil job roles as\nspecified by organization/service.\n3.3\nInterpersonal skills required include working with others,\nempathy with patient and relatives and an ability to relate to\npersons from differing cultural, social and religious\nbackgrounds\n3.4\nImplementing basic procedures(CPR, AED, Suctioning,\nPrimary Survey, Basic Airway, Adjuncts, Vital Signs,SPO2)\n3.5\nAssist the EMT in the collection and documentation of relevant\ninformation\n4. Resource\nImplications\n\nThe following resources should be provided:\n4.1\nAccess to appropriate workplace or simulation of realistic\nworkplace setting where assessment can be conducted\n4.2\nAccess to equipment and resources normally used in the\nworkplace\n5. Methods of\nAssessment\nCompetency in this unit must be assessed through:\n5.1\nObservations, questioning and evidence gathered from the\nworkplace environment\n5.2\nDemonstration over a period of time to ensure consistency of\nperformance\n6. Context of\nAssessment\n6.1\nEvidence must include observation of performance in the work\nenvironment or in a simulated work setting\n\n--- PDF PAGE 67 ---\nTESDA-SOP-QSO-01-F08\nTR-Emergency Medical Services NC II (Amended)\nPromulgated December 2013\n64\nUNIT OF COMPETENCY :\nCONTRIBUTE TO AMBULANCE OPERATIONS MANAGEMENT\n\nUNIT CODE\n:\nHCS322326\n\nUNIT DESCRIPTOR\n:\nThis unit of competency involves the efficient use of ambulance in\ndelivering emergency medical services.\n\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Maintain\noperations to\nmeet quality\nstandards\n1.1\nSupplies (necessary for operations are available and meet\nservice requirements (except medicines)).\n1.2\nOperations within the area of responsibility meet service\ndelivery specifications.\n1.3\nInformation and advice given to staff, members of the public and\nrelated organizations are accurate, in line with service policy and\nwithin the manager's area of responsibility.\n1.4\nOperational information is communicated to the appropriate\npeople in a manner, at a level and at a pace to promote\nunderstanding.\n1.5\nSystems to monitor quality, time and cost specifications for\nservice provided are fully and correctly implemented and\nmaintained.\n1.6\nFactors which disrupt operations affecting service delivery\nare recognised and appropriate action taken to minimise their\neffects.\n1.7\nComplete an accurate record of operations in accordance with\nservice policies and procedures in relation to ambulance\noperation.\n1.8\nMake recommendations for improving efficiency of operations\nand quality of service which are promptly communicated to the\nappropriate people.\n1.9\nOperations are in accordance with local ambulance standard\noperating procedure.\n2. Create and\nmaintain\nconditions\nconducive to\nproductive work\nand quality\nservice\n2.1\nHighest possible level of safety is applied to the work\nenvironment.\n2.2\nA sufficient supply of resources is established and maintained to\nmeet community needs.\n2.3\nStaff working conditions and use of resources satisfy current\nlegislation and service guidelines.\n2.4\nMaintenance frequency and the use of equipment conform to\nservice standards, schedules and procedures.\n2.5\nWhere resources do not meet requirements, the matter is\nreferred to the appropriate person/s.\n2.6\nWorkplace accidents and incidents are reported promptly to the\nappropriate person/s and recorded as required.\n2.7\nRecommendations for improving conditions are promptly\nreferred to the appropriate person/s.\n2.8\nAll necessary records are complete, accurate and legible and\navailable to authorized person/s when required.\n2.9\nRecords are reviewed to ensure completeness and accuracy, in\naccordance with service policy.\n3. Monitor and\ncontrol the use of\nresources\n3.1\nExpenditure is within agreed budgets, does not compromise\nfuture spending requirements and conforms to service\nprocedures.\n3.2\nThe contribution of each team member can make to control of\nresources is communicated effectively.\n3.3\nRecords of expenditure are complete, accurate and legible.\n3.4\nPrompt corrective action is taken in response to actual or\npotential significant deviations from plans.\n3.5\nRequests for expenditure outside the person in\ncharge/superior’s area of responsibility are promptly referred to\nthe appropriate person/s.\n\n--- PDF PAGE 68 ---\nTESDA-SOP-QSO-01-F08\nTR-Emergency Medical Services NC II (Amended)\nPromulgated December 2013\n65\nRANGE OF VARIABLES\n\nVARIABLES\nRANGE\nOperations include all those activities under the responsibility of the person in charge/superior.\n1. Sources of supply\nMay include:\n1.1\nExternal organizations (e.g. Medical and pharmaceutical\nsupplies)\n1.2\nInternal departments/teams\n2. Supplies\nMay include:\n2.1\nMaterial supplies (consumables)\n2.2\nEquipment/technology (stretchers, AED)\n2.3\nInformation( manual/guidebook/checklists(ambulance)/patient\nforms)\n2.4 Budgetary requirements (i.e. fuel, meals, operating expenses)\n3. Service delivery\nspecification\nMay include:\n3.1\nOperational requirements for meeting quality\nstandards(registration, insurance)\n3.2\nSpecific functional duties within the organization\n3.3\nQuality assurance is achieved through systems that are both\nformal and informal.\n4. Factors which disrupt\noperations are those\naffecting service\ndelivery\nMay include:\n4.1\nOperational resources\n4.2\nQuality of service\n4.3\nCorrective actions are consistent with Service Policy and\nwithin budgetary constraints.\n5. Conditions are those\nrelating to\nMay include:\n5.1\nWork environment\n5.2\nEquipment/technology\n5.3\nHours worked\n6. The person in\ncharge/superior is\nlegally bound by the\nrequirements of\nMay include:\n6.1\nOccupational Safety and Health Act legislation\n6.2\nCollective Bargaining Agreement, Collective Negotiating\nAgreement, ECC, Disability Law, Gender Sensitivity, Anti-\nSexual Harassment, Child Protection, Related Labor Laws,\nLabor Code\n6.3\nInsurance\n6.4\nOther relevant promulgations or requirements\n\n--- PDF PAGE 69 ---\nTESDA-SOP-QSO-01-F08\nTR-Emergency Medical Services NC II (Amended)\nPromulgated December 2013\n66\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nDemonstrated ability to use ambulance resources in delivering\nemergency medical services\n2. Required Knowledge\n2.1\nSound clinical knowledge\n2.2\nResource requirements\n2.3\nService policies and procedures\n2.4\nRelevant legislation and industrial guidelines\n2.5\nBudgets and finance management\n2.6\nRecord-keeping\n3. Required Skills\n3.1\nOral communication skills\n3.2\nWritten communication skills\n3.3\nInterpersonal skills required include working with others, and\nan ability to relate to persons from differing cultural, social and\nreligious backgrounds\n3.4\nProblem solving skills required include an ability to use\navailable resources, analyse information and make decisions\nthat maximise the effective management of ambulance\noperations\n4. Resource\nImplications\nThe following resources should be provided:\n4.1\nAccess to appropriate workplace or simulation of realistic\nworkplace setting where assessment can be conducted\n4.2\nAccess to equipment and resources normally used in the\nworkplace\n5. Methods of\nAssessment\nCompetency in this unit must be assessed through:\n5.1\nObservation with questioning\n5.2\nOral questioning/Interview\n5.3\nEvidence gathered from the workplace environment\n5.4\nDemonstration over a period of time to ensure consistency of\nperformance\n6. Context of\nAssessment\n6.1\nEvidence must include observation of performance in the work\nenvironment or simulation\n\n--- PDF PAGE 70 ---\nTESDA-SOP-QSO-01-F08\nTR-Emergency Medical Services NC II (Amended)\nPromulgated December 2013\n67\nUNIT OF COMPETENCY :\nTRANSPORT EMERGENCY PATIENTS\n\nUNIT CODE\n:\nHCS322327\n\nUNIT DESCRIPTOR\n:\nThis unit of competency involves transportation of patients and\nother appropriate personnel under emergency circumstances.\n\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Convey and receive\ninformation relating\nto emergency\ntransport\n1.1\nCommunication with control center is established and\nmaintained according to local ambulance standard operation\nprocedure.\n1.2\nAppropriate receiving facility is notified according to local\nambulance standard operation procedure.\n2. Transport patient\nunder emergency\nconditions\n2.1\nAmbulance is driven in a manner that avoids exacerbation\nof patient's condition.\n2.2\nHazards are recognized and negotiated at low risk.\n2.3\nVehicle is driven according to legal requirements governing\nemergency vehicles.\n2.4\nAppropriate route is chosen according to distance, time,\ntravel and terrain.\n2.5\nCommunication is established and maintained as required\nbetween driver and patient care officer to ensure safe\ntransport and effective patient care.\n\n3. Load, unload and\nsecure patient and\nequipment for\nemergency\ntransportation\n3.1\nLoading/unloading is conducted smoothly, consistent with\nsafe work practices, and local ambulance standard\noperating procedure.\n3.2\nPatient's illness/injury is not exacerbated by unnecessary\nmovement during loading and unloading.\n3.3\nPatients are removed from scene in a manner consistent\nwith relevant Acts, Regulations and in accordance with\nlocal ambulance standard operating procedure.\n3.4\nEquipment is secured in accordance with relevant\nPhilippine Standards, Acts, and regulations and in\naccordance with local ambulance standard operating\nprocedure.\n\n--- PDF PAGE 71 ---\nTESDA-SOP-QSO-01-F08\nTR-Emergency Medical Services NC II (Amended)\nPromulgated December 2013\n68\nRANGE OF VARIABLES\n\nVARIABLES\nRANGE\n1. Type of ambulance\ncategory\nMay include:\n(based on ambulance classification)\n1.1\nPatient Transport Vehicle\n1.2\nBasic Life Support Ambulance\n1.3\nAdvanced Life Support Ambulance\n2. Equipment\nMay include:\n2.1\nStandard inventory of ambulance equipment\n2.2\nNumber of personnel in ambulance which follows the standard\noperating procedures\n3. Legal requirements\nMay include:\n3.1\nLocal and national traffic ordinances, acts and regulations and\nAmbulance Acts and Regulations\n3.2\nAll lawful standing orders, policies and procedures issued by\nAmbulance Services pertaining to the driving and operation of\nservice vehicles\n3.3\nDepartment of Transportation and Communication,\nDepartment of Interior and Local Government, Local\nGovernment Units and the Department of Health.\n4. Service and national\nstandards for safe\nwork practices\nMay include:\n(Are detailed in)\n4.1\nOccupational Safety and Health Acts, Regulations and\nStandards\n4.2\nLocal Ambulance Service standard operating policies and\nprocedures\n4.3\nSafe lifting and manual handling procedures\n4.4\nActs, Regulations service policy and procedures include those\nrelating to the operation of radio and electronic communication\nequipment\n5. Communication\nequipment\nMay include:\n5.1\nRadio equipment (two way portable radio)\n5.2\nEquipment of other organizations\n5.3\nViable alternatives that support effective communication\n5.4\nOnline network\n5.5\nCellular network\n5.6\nSatellite network\n\n--- PDF PAGE 72 ---\nTESDA-SOP-QSO-01-F08\nTR-Emergency Medical Services NC II (Amended)\nPromulgated December 2013\n69\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nDemonstrated satisfactory performance in the work\nenvironment or a simulation\n1.2\nDemonstrated ability in variety of situations involving the\ntransport of patients in life-threatening situations\n1.3\nDemonstrated ability in loading/unloading patients requiring\nthe superior/person in charge to exhibit diverse patient\nhandling skills and knowledge\n1.4\nDemonstrated ability in transportation of patients over routes\nrequiring the superior/person in charge to display a variety of\ndriving and route selection skills\n2. Required Knowledge\n2.1\nUse of communications equipment and systems, and\nknowledge of relevant Acts, Regulations, Service policies and\nprocedures\n2.2\nRoad rules and laws applying to emergency vehicles in the\nstate or territory\n2.3\nBasic Patient care and proper methods of restraint during\ntransportation\n2.4\nMethods of loading and unloading patients under life-\nthreatening conditions\n2.5\nKnowledge of relevant acts, regulations and procedures\ngoverning the handling/lifting of patients\n3. Required Skills\n3.1\nDriving skills relevant to the transportation of patients in life-\nthreatening circumstances\n3.2\nOral communication skills include asking questions, active\nlistening, asking for clarification of instructions if required,\nacknowledging and responding to a range of views\n3.3\nWritten communication skills\n3.4\nInterpersonal skills required include working with others, and\nan ability to relate to persons from differing cultural, social and\nreligious backgrounds\n3.5\nProblem solving skills required include an ability to use\navailable resources, assess and analyze available driving\nroutes, patient handling requirements and transportation\nneeds. Make decisions to ensure the safe driving of vehicles\nunder operational conditions.\n4. Resource\nImplications\nThe following resources should be provided:\n4.1\nAccess to appropriate workplace or simulation of realistic\nworkplace setting where assessment can be conducted\n4.2\nAccess to equipment and resources normally used in the\nworkplace\n5. Methods of\nAssessment\nCompetency in this unit must be assessed through:\n5.1\nObservation with questioning\n5.2 Oral questioning/Interview\n5.2\nEvidence gathered from the workplace environment\n5.3\nDemonstration over a period of time to ensure consistency of\nperformance\n6. Context of\nAssessment\n6.1\nEvidence must include observation of performance in the work\nenvironment or in a simulated work setting\n\n--- PDF PAGE 73 ---\nTESDA-SOP-QSO-01-F08\nTR-Emergency Medical Services NC II (Amended)\nPromulgated December 2013\n70\nUNIT OF COMPETENCY :\nTRANSPORT NON-EMERGENCY PATIENTS\n\nUNIT CODE\n:\nHCS322328\n\nUNIT DESCRIPTOR\n:\nThis unit of competency involves the transport of non-emergency\npatients, checking the ambulance vehicle and equipment.\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Prepare and check\nvehicle and\nequipment\n1.1\nAmbulance and equipment is checked systematically and\ncomprehensively based on a local vehicle checklist.\n1.2\nAmbulance checks are conducted on a regular basis\naccording to Service procedures to ensure serviceability of\nambulance and equipment.\n1.3\nAmbulance checks ensure interior and exterior cleanliness of\nambulance in accordance with service policies and procedures\npertaining to the minimization of infection risk to both\nambulance personnel and patients/clients.\n1.4\nAmbulance operating stock is maintained to acceptable\nminimum and maximum levels.\n1.5\nAmbulance and equipment is maintained according to local\npolicy and procedures.\n2. Ensure faults in\nambulance and\nequipment are\nremedied\n2.1\nGeneral nature of fault is identified and reported according to\nlocal policy and procedure.\n2.2\nFurther damage to malfunctioning ambulance or equipment is\nassessed against patient care priorities and avoided when\npossible.\n2.3\nMinor faults are rectified where possible.\n2.4\nNeed for additional or replacement resources is established\nand communicated to appropriate personnel.\n3. Convey and receive\ninformation through\nuse of necessary\nmodes of\ncommunication\n3.1\nCommunication techniques and procedures are consistent with\nacts, regulations and in accordance with local standard\noperating procedure.\n3.2\nCommunication with control center is established and\nmaintained in accordance with local standard operating\nprocedure.\n3.3\nAppropriate receiving facility is notified in accordance with local\nstandard operating procedure.\n4. Load, unload and\nsecure non-\nemergency patient\nand other specific\npersonnel for\ntransportation\n4.1\nLoading/unloading is conducted smoothly, consistent with safe\nwork practices, Service policy and procedures in accordance\nwith the national code.\n4.2\nPatient is given appropriate support/assistance during\nloading/unloading.\n4.3\nAppropriate personnel are transported to accompany the\npatient where such a need has been identified and there is a\ncapacity to do so, in accordance with local standard operating\nprocedure.\n4.4\nEquipment and belongings are secured appropriately to avoid\nmovement during travel.\n4.5\nMust be familiar with the use of carry chairs\n5. Drive vehicle\n5.1\nAmbulance is driven in a reduced risk manner and according to\nlegal requirements.\n5.2\nAppropriate route is chosen according to distance, time\nconstraints, travel and terrain.\n5.3\nCommunication is established between driver and patient or\npatient care officer to ensure effective patient care during\ntransport.\n5.4\nMap is consulted accurately, when necessary.\n6. Transport patient's\nrelatives or other\nspecific personnel\n6.1\nPersonnel are transported to accompany the patient where\nsuch a need has been identified and there is a capacity to do\nso, in accordance with local standard operating procedure.\n6.2\nSafety of the personnel, the patient and the patient’s relatives in\nthe ambulance is considered during transport.\n\n--- PDF PAGE 74 ---\nTESDA-SOP-QSO-01-F08\nTR-Emergency Medical Services NC II (Amended)\nPromulgated December 2013\n71\nRANGE OF VARIABLES\n\nVARIABLES\nRANGE\n1. Ambulance categories\nMay include:\n1.1 Patient Transport Vehicle\n1.2 Basic Life Support Ambulance\n1.3 Advanced Life Support Ambulance\n2. Ambulance checks\nMay include:\n2.1\nReadiness\n2.2\nCleanliness\n2.3\nFaults\n2.4\nMalfunctions\n2.5\nEquipment and supplies\n3. Equipment\nMay include:\n3.1\nInventory of equipment for routine non-emergency patient care\n3.2\nInventory of equipment carried for emergency use\n3.3\nAny equipment specified for particular vehicles\n4. Minor faults should be\ndetected using a\nchecklist and do not\ninclude those normally\nremedied by a service\nagent or dealer\nMay include:\n4.1\nBlown fuses and bulbs\n4.2\nLess than optimum tire inflation\n4.3\nLow radiator level\n4.4\nLow engine fluids\n4.5\nLow brake system fluids\n4.6 Discharged Batteries\n4.7 Defective wipers\n5. Communication\nequipment\nMay include\n5.1 Radio equipment (two way portable radio)\n5.2 Equipment of other organizations\n5.3 Viable alternatives that support effective communication\n5.4 Online network\n5.5 Cellular network\n5.6 Satellite network\n6. Appropriate personnel\nMay include:\n6.1 Ambulance personnel\n6.2 Patient’s companion as appropriate\n7. Securing of patient\nMay include:\n7.1\nPatients' belongings\n7.2\nWheelchairs/Stretchers\n7.3 Carry Chairs\n7.4 Belts and straps\n8. Legal requirements\nMay include:\n8.1\nTraffic Ordinances and Regulations and Ambulance Acts and\nRegulations\n8.2\nAll lawful standing orders, policies and procedures issued by\nAmbulance Services pertaining to the driving and operation of\nService vehicles.\n9. Service and national\nstandards for safe\nwork practices are\ndetailed in\nMay include:\n9.1\nOccupational Safety and Health Acts, Regulations and\nStandards\n9.2\nService policy and procedures\n9.3\nSafe lifting procedures\n9.4 Acts, Regulations, service policy and procedures include those\nrelating to the operation of radio and electronic communication\nequipment.\n10.Communication\nequipment\nMay include:\n10.1 Radio equipment (two way portable radio)\n10.2 Equipment of other organizations\n10.3 Viable alternatives that support effective communication\n10.4 Online network\n10.5 Cellular network\n10.6 Satellite network\n\n--- PDF PAGE 75 ---\nTESDA-SOP-QSO-01-F08\nTR-Emergency Medical Services NC II (Amended)\nPromulgated December 2013\n72\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nProvided observation of performance in the workplace or a\nsimulation\n1.2\nDemonstrated ability in a range of non-emergency transport\nneeds and requirements\n1.3\nDemonstrated ability in a range of driving situations and\nconditions\n1.4\nProvided opportunities to demonstrate safe, efficient driving\nskills suited to specific situations and the case being attended\nto\n2. Required Knowledge\n2.1\nRelevant endorsed driving license as per local and national\nrequirements\n2.2\nElementary knowledge of vehicle being used\n2.3\nKnowledge of patient care during transportation\n2.4\nKnowledge of Service policy and procedures related to\nequipment and vehicle checks\n2.5\nKnowledge of the use of relevant equipment and patient\nrestraints during transportation\n2.6\nUse of communications equipment and systems, and\nknowledge of relevant procedures\n3. Required Skills\n\n3.1\nResponsible approach to acting on faults and/or deficiencies\n3.2\nDriving skills relevant to the transportation of non-emergency\npatients\n3.3\nSkills in the assessment of driving needs relevant to patient\nneeds and individual cases\n3.4\nOral communication skills required fulfilling job roles as\nspecified by the organization/service.\n3.5\nWritten communication skills required fulfilling job roles as\nspecified by organization/service. Skills include reading and\nunderstanding routine instructions.\n3.6\nInterpersonal skills required include working with others,\nempathy with patient and relatives and an ability to relate to\npersons from differing cultural, and social and religious\nbackgrounds.\n3.7\nProblem solving skills required include an ability to use\navailable resources, analyze information and make decisions\nthat ensure the efficient and safe transport of non-emergency\npatients.\n4. Resource\nImplications\nThe following resources should be provided:\n4.1\nAccess to appropriate workplace conducted or simulation of\nrealistic workplace setting\n4.2\nAccess to equipment and resources normally used in the\nworkplace\n5. Methods of\nAssessment\nCompetency in this unit must be assessed through:\n5.1\nObservation with questioning\n5.2\nOral questioning/Interview\n5.3\nEvidence gathered from the workplace environment\n5.4\nDemonstration over a period of time to ensure consistency of\nperformance\n6. Context of\nAssessment\n6.1\nEvidence must include observation of performance in the work\nenvironment or in a simulated work setting\n\n--- PDF PAGE 76 ---\nTESDA-SOP-QSO-01-F08\nTR-Emergency Medical Services NC II (Amended)\nPromulgated December 2013\n73\nUNIT OF COMPETENCY :\nDRIVE AMBULANCE UNDER OPERATIONAL CONDITIONS\n\nUNIT CODE\n:\nHCS322316\n\nUNIT DESCRIPTOR\n:\nThis unit covers the competency to drive ambulance safely,\nincluding the systematic, safe and efficient control of all vehicles\nfunctions and effective management of hazardous situations under\noperational conditions.\n\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Prepare ambulance\nfor operational\nresponse\n1.1\nThe ambulance is selected to meet operational\nrequirements and is suitable to use in the terrain.\n1.2\nPreliminary check of the vehicle is completed to ensure it is\nserviceable.\n1.3\nAssist in checking the equipment and accessories to ensure\nthey are available and serviceable.\n1.4\nCabin drill and start-up checks are completed in\naccordance with operational standards.\n1.5\nEngine is started in accordance with manufacturer’s\nspecifications.\n1.6\nAudible and visual warning systems including instruments\nand gauges are checked to ensure that they are all\noperational.\n2. Drive the\nambulance\n2.1\nAmbulance is prepared for, and safely operated in terrain\nsuitable to the vehicle.\n2.2\nAmbulance and/or trailers are operated and positioned in\naccordance with traffic regulations in accordance with local\nambulance standard operation procedure to ensure safe and\nefficient operation.\n2.3\nReduced-risk driving techniques are used which minimize\nthe likelihood of injury to persons or damage to equipment or\nproperty and in accordance with local ambulance standard\noperation procedure.\n3. Monitor traffic, road\nand terrain under\noperational\nconditions\n3.1\nAmbulance movement is controlled in response to external\nconditions to ensure safety of persons.\n3.2\nThe most efficient route of travel is taken through monitoring\nfactors likely to cause delays or route deviations.\n3.3\nTraffic and surface conditions are consistently monitored\nand acted upon to enable safe operation and ensure no\ninjury to people or damage to property, equipment, loads and\nfacilities.\n\n--- PDF PAGE 77 ---\nTESDA-SOP-QSO-01-F08\nTR-Emergency Medical Services NC II (Amended)\nPromulgated December 2013\n74\nRANGE OF VARIABLES\n\nThis unit relates to driving ambulances while responding to, or at emergency operations and\nincludes the use of audible visual warning devices. Vehicles may be responding or operating on\nurban or rural roads, four-wheel drive tracks or private roads, or cross country. Drivers will be\nrequired to have the appropriate driving license.\n\nVARIABLES\nRANGE\n1. Ambulance\ncategories\nMay include:\n1.1\nAll types of operational ambulance\n1.2\nCommunication vehicles\n1.3\nCommand/control vehicles\n\n2. Operational\nconditions\nMay include:\n2.1 Non-emergency driving\n2.2\nEmergency response driving\n2.3\nOff-road driving\n2.4\nHazardous environmental conditions\n2.5\nDriving in special environments (i.e. on actual airport\nmovement areas)\n2.6\nPrevailing weather\n2.7\nTime of day/night\n2.8\nVisibility\n2.9\nRecovery\n3. Considerations\nMay include:\n3.1\nProcedures\n3.2\nTraffic conditions\n3.3\nLevels of emergency response\n3.4\nAdverse weather\n3.5\nTraffic regulations\n3.6\nWarning devices\n3.7\nAdverse terrain\n3.8\nType of vehicle\n3.9\nAdverse surfaces\n4. Cabin drill\nMay include:\n4.1\nAdjustment of seats\n4.2\nSeatbelts\n4.3\nMirrors and steering\n4.4\nRadio on\n4.5\nAll crew seated/restrained\n4.6\nDash layout\n4.7\nGauges\n4.8\nWarning lights\n4.9 GPS\n4.10 Drive vehicles under operational conditions\n5. Start-up check\nMay include:\n5.1\nFuel\n5.2\nCoolant\n5.3\nOil\n5.4\nPump\n5.5\nWater\n5.6\nEquipment/locker security\n5.7\nVisual inspection of vehicle\n5.8\nOperation of emergency warning devices (lights/sirens)\n5.9\nCrew intercom\n5.10 Physical check or scan of gauges\n\n--- PDF PAGE 78 ---\nTESDA-SOP-QSO-01-F08\nTR-Emergency Medical Services NC II (Amended)\nPromulgated December 2013\n75\nVARIABLE\nRANGE\n6. Instruments/gauges\nMay include:\n6.1\nWarning lights\n6.2\nTachometer\n6.3\nTemperature\n6.4\nElectrical charging\n6.5\nSystems indicators (high beam)\n6.6\nTurn signals\n6.7\nParking brakes\n6.8\nSpeedometer\n6.9\nOil pressure\n6.10 Brake warning lights\n6.11 Audible warning devices\n6.12 Water tank level indicator\n7. Relevant legislation\nand procedures\nMay include:\n7.1\nTraffic regulations\n7.2\nOrganizational policy and procedures\n7.3\nAccident procedures\n7.4\nEmergency parking\n7.5\nPossession of appropriate license\n8. Manufacturer’s\nspecifications\nMay include:\n8.1\nEngine characteristics\n8.2\nSystems warning functions\n8.3\nRadius of turning circle\n8.4\nSafety procedures\n8.5\nHorsepower rating\n8.6\nMaximum vehicle weight\n8.7\nFuel capacity for range\n8.8\nClearance height\n8.9\nEngagement procedures\n8.10 No-spin locking differential\n8.11 Anti-lock braking systems\n9. Traffic conditions\nMay include:\n9.1\nParking\n9.2\nTraffic pattern and density\n9.3\nKnown peak traffic periods and community functions and\nevents\n9.4\nEffect of weather on roads\n9.5\nRoad surface\n9.6\nVisibility\n9.7\nDrive ambulances under operational conditions\n\n--- PDF PAGE 79 ---\nTESDA-SOP-QSO-01-F08\nTR-Emergency Medical Services NC II (Amended)\nPromulgated December 2013\n76\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nDemonstrated driving skills\n1.2 Maintained personal safety\n1.3 Demonstrated awareness of safety, traffic conditions and other\nroad users’ safety\n2. Required Knowledge\n2.1\nTraffic rules and regulations\n2.2\nEmergency vehicle requirements and regulations\n2.3\nVehicle operating procedures\n2.4\nLocal area knowledge\n2.5\nKnowledge of equipment and accessories\n2.6\nAncillary equipment\n2.7\nTraffic legislation\n2.8\nAppreciation of automotive systems\n2.9\nKnowledge of emergency vehicle inspection procedures\n3. Required Skills\n3.1\nLow risk driving techniques\n3.2\nMonitoring and anticipating traffic hazard\n3.3\nOral communication skills (language competence) required to\nfulfill job roles as specified by the organization/service. Oral\ncommunication skills include asking questions, active\nlistening, asking for clarification of instructions if required,\nacknowledging and responding to a range of views.\n3.4\nWritten communication skills (literacy competence) required to\nfulfill job roles as specified by organization/service. The level\nof skill may range from reading and understanding vehicle\nmaintenance manuals and manufacturer’s specifications to\npreparing reports.\n3.5\nInterpersonal skills required include working with others, and\nan ability to relate to persons from differing cultural, social and\nreligious backgrounds.\n3.6\nProblem solving skills required include an ability to use\navailable resources, analyze information and to make\ndecisions that ensure the safe driving of vehicles under\noperational conditions.\n4. Resource\nImplications\nThe following resources should be provided:\n4.1\nAccess to appropriate workplace where assessment can be\nconducted or simulation of realistic workplace setting for\nassessment.\n4.2\nAccess to equipment and resources normally used in the\nworkplace\n5. Methods of\nAssessment\nCompetency in this unit must be assessed through:\n5.1\nObservations, questioning and evidence gathered from the\nworkplace environment.\n5.2\nDemonstration over a period of time to ensure consistency of\nperformance.\n6. Context of\nAssessment\n6.1\nEvidence must include observation of performance in the work\nenvironment or simulation.\n\n--- PDF PAGE 80 ---\nTR-Emergency Medical Services NC II (Amended)\nPromulgated December 2013\n77\nSECTION 3 TRAINING STANDARDS\n\nThis set of standards provides Technical and Vocational Education and Training (TVET)\nproviders with information and other important requirements to consider when designing training\nprograms for EMERGENCY MEDICAL SERVICES NC II\n\nThis includes information on curriculum design, training delivery, trainee entry requirements,\ntools and equipment, training facilities, trainer’s qualification and institutional assessment.\n\n3.1 CURRICULUM DESIGN\n\nCourse Title: EMERGENCY MEDICAL SERVICES\nNC Level: NC II\n\nSuggested Nominal Training Hours: 280 HOURS\n\nCourse Description:\n\nThis course is designed to enhance the knowledge, skills and attitude of EMERGENCY\nMEDICAL SERVICES NC II in accordance with industry standards. This course covers the basic,\ncommon and core competencies in perform basic life support, maintain life support equipment and\nresources, implement safe access and extrication procedures in an emergency, contribute in\nreceiving request for ambulance service, contribute in allocating ambulance service resources,\ncontribute in coordinating emergency resources, deliver basic ambulance communication skills,\ncontribute in on – road operations, contribute in emergency scene management, contribute in a\nspecial event scene management, contribute in routine scene management, deliver pre- hospital\npatient care, contribute in ambulance operations management, transport emergency patients and\ntransport non- emergency patients and drive ambulance under operational condition.\n\nTo obtain this, all units prescribed for this qualification must be achieved.\n\n*The suggested training hour is to be used as a guide only. Competency-based education\nand training is not based on time or length of training contacts.\n\nBASIC COMPETENCIES\n\nUNIT OF\nCOMPETENCY\nLEARNING OUTCOMES\nMETHODOLOGY\nASSESSMENT\nAPPROACH\n1. Participate in\nworkplace\ncommunication\n1.1\nObtain and convey\nworkplace information\n1.2\nComplete relevant work\nrelated documents\n1.3\nParticipate in workplace\nmeeting and discussion\n\n Group\ndiscussion\n Interaction\n Demonstration\n Observation\n Interviews/\n Questioning\n\n--- PDF PAGE 81 ---\nTR-Emergency Medical Services NC II (Amended)\nPromulgated December 2013\n78\nUNIT OF\nCOMPETENCY\nLEARNING OUTCOMES\nMETHODOLOGY\nASSESSMENT\nAPPROACH\n2. Work in a team\nenvironment\n2.1\nDescribe and identify team\nrole and responsibility in a\nteam\n2.2\nDescribe work as a team\nmember\n\