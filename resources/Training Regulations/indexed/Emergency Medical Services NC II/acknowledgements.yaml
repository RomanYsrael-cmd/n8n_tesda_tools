  "source_text": "ACKNOWLEDGEMENTS\n89\n\n--- PDF PAGE 4 ---\nTR-Emergency Medical Services NC II (Amended)\nPromulgated December 2013\n1\nTRAINING REGULATIONS FOR\nEMERGENCY MEDICAL SERVICES NC II\n\nSECTION 1 EMERGENCY MEDICAL SERVICES NC II QUALIFICATION\n\nThe EMERGENCY MEDICAL SERVICES NC II Qualification consists of competencies that a\nperson must achieve to perform cardiopulmonary resuscitation with automated external\ndefibrillation operation, maintain life support equipment and resources, implement safe access and\nextrication procedures in an emergency, contribute in receiving request for ambulance service,\ncontribute in allocating ambulance service resources, contribute in coordinating emergency\nresources, deliver basic ambulance communication skills, contribute in on – road operations,\ncontribute to emergency scene management, contribute to special event scene management,\ncontribute to routine scene management, deliver pre- hospital patient care, contribute to\nambulance operations management, transport emergency patients, transport non- emergency\npatients and drive ambulance under operational conditions.\n\nThe Units of Competency comprising this Qualification include the following:\n\nUNIT CODE\nBASIC COMPETENCIES\n500311105\nParticipate in workplace communication\n500311106\nWork in a team environment\n500311107\nPractice career professionalism\n500311108\nPractice occupational health and safety procedures\n\nUNIT CODE\nCOMMON COMPETENCIES\nHCS323201\nImplement and monitor infection control policies and procedures\nHCS323202\nRespond effectively to difficult and challenging behavior\nHCS323203\nApply basic first aid\nHCS323204\nMaintain high standard of patient services\n\nUNIT CODE\nCORE COMPETENCIES\nHCS322317\nPerform Cardiopulmonary Resuscitation with AED Operation\nHCS322302\nMaintain life support equipment and resources\nHCS322303\nImplement safe access and extrication procedures in an emergency\nHCS322318\nContribute in receiving request for ambulance service\nHCS322319\nContribute in allocating ambulance service resources\nHCS322320\nContribute in coordinating emergency resources\nHCS322307\nDeliver basic ambulance communication skills\nHCS322321\nContribute in on- road operations\nHCS322322\nContribute to emergency scene management\nHCS322323\nContribute to special event scene management\nHCS322324\nContribute to routine scene management\nHCS322325\nDeliver pre- hospital patient care\nHCS322326\nContribute to ambulance operations management\nHCS322327\nTransport emergency patients\nHCS322328\nTransport non- emergency patients\nHCS322316\nDrive ambulance under operational conditions\n\nA person who has achieved this Qualification is only competent to be the following and NOT as an\nEmergency Medical Technician (EMT):\n\n First-Aider\n Medical First Responder\n Ambulance Care Assistant\n\n--- PDF PAGE 5 ---\nTR-Emergency Medical Services NC II (Amended)\nPromulgated December 2013\n2\nSECTION 2 COMPETENCY STANDARDS\n\nThis section gives the details of the contents of the basic, common and core units of\ncompetency required in EMERGENCY MEDICAL SERVICES NC II.\n\nBASIC COMPETENCIES\n\nUNIT OF COMPETENCY : PARTICIPATE IN WORKPLACE COMMUNICATION\nUNIT CODE\n: 500311105\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes required to\ngather, interpret and convey information in response to workplace\nrequirements.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Obtain and convey\nworkplace\ninformation\n1.1\nSpecific and relevant information is accessed from\nappropriate sources.\n1.2\nEffective questioning, active listening and speaking skills are\nused to gather and convey information.\n1.3\nAppropriate medium is used to transfer information and ideas.\n1.4\nAppropriate non- verbal communication is used.\n1.5\nAppropriate lines of communication with supervisors and\ncolleagues are identified and followed.\n1.6\nDefined workplace procedures for the location and storage of\ninformation are used.\n1.7\nPersonal interaction is carried out clearly and concisely.\n2. Participate in\nworkplace meetings\nand discussions\n2.1\nTeam meetings are attended on time.\n2.2\nOwn opinions are clearly expressed and those of others are\nlistened to without interruption.\n2.3\nMeeting inputs are consistent with the meeting purpose and\nestablished protocols.\n2.4\nWorkplace interactions are conducted in a courteous\nmanner.\n2.5\nQuestions about simple routine workplace procedures and\nmaters concerning working conditions of employment are\nasked and responded to.\n2.6\nMeetings outcomes are interpreted and implemented.\n3. Complete relevant\nwork related\ndocuments\n3.1\nRange of forms relating to conditions of employment is\ncompleted accurately and legibly.\n3.2\nWorkplace data is recorded on standard workplace forms and\ndocuments.\n3.3\nBasic mathematical processes are used for routine\ncalculations.\n3.4\nErrors in recording information on forms/ documents are\nidentified and properly acted upon.\n3.5\nReporting requirements to supervisor are completed\naccording to organizational guidelines.\n\n--- PDF PAGE 6 ---\nTR-Emergency Medical Services NC II (Amended)\nPromulgated December 2013\n3\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Appropriate sources\n1.1.\nTeam members\n1.2.\nSuppliers\n1.3.\nTrade personnel\n1.4.\nLocal government\n1.5.\nIndustry bodies\n2. Medium\n2.1.\nMemorandum\n2.2.\nCircular\n2.3.\nNotice\n2.4.\nInformation discussion\n2.5.\nFollow-up or verbal instructions\n2.6.\nFace to face communication\n3. Storage\n3.1.\nManual filing system\n3.2.\nComputer-based filing system\n4. Forms\n4.1.\nPersonnel forms, telephone message forms, safety reports\n5. Workplace\ninteractions\n5.1.\nFace to face\n5.2.\nTelephone\n5.3.\nElectronic and two way radio\n5.4.\nWritten including electronic, memos, instruction and forms,\nnon-verbal including gestures, signals, signs and diagrams\n6. Protocols\n6.1.\nObserving meeting\n6.2.\nCompliance with meeting decisions\n6.3.\nObeying meeting instructions\n\n--- PDF PAGE 7 ---\nTR-Emergency Medical Services NC II (Amended)\nPromulgated December 2013\n4\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1.\nPrepared written communication following standard format of\nthe organization.\n1.2.\nAccessed information using communication equipment.\n1.3.\nMade use of relevant terms as an aid to transfer information\neffectively.\n1.4.\nConveyed information effectively adopting the formal or\ninformal communication.\n2. Underpinning\nknowledge\n\n2.1.\nEffective communication\n2.2.\nDifferent modes of communication\n2.3.\nWritten communication\n2.4.\nOrganizational policies\n2.5.\nCommunication procedures and systems\n2.6.\nTechnology relevant to the enterprise and the individual’s\nwork responsibilities\n3. Underpinning skills\n3.1.\nFollow simple spoken language\n3.2.\nPerform routine workplace duties following simple written\nnotices\n3.3.\nParticipate in workplace meetings and discussions\n3.4.\nComplete work related documents\n3.5.\nEstimate, calculate and record routine workplace measures\n3.6.\nBasic mathematical processes of addition, subtraction,\ndivision and multiplication\n3.7.\nAbility to relate to people of social range in the workplace\n3.8.\nGather and provide information in response to workplace\nrequirements\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1.\nFax machine\n4.2.\nTelephone\n4.3.\nWriting materials\n4.4.\nInternet\n5. Method of\nassessment\nCompetency MUST be assessed through:\n5.1.\nDirect Observation\n5.2.\nOral interview and written test\n6. Context of\nassessment\n6.1.\nCompetency may be assessed individually in the actual\nworkplace or through accredited institution\n\n--- PDF PAGE 8 ---\nTR-Emergency Medical Services NC II (Amended)\nPromulgated December 2013\n5\nUNIT OF COMPETENCY :\nWORK IN A TEAM ENVIRONMENT\nUNIT CODE\n: 500311106\nUNIT DESCRIPTOR\n:\nThis unit covers the skills, knowledge and attitudes to identify role\nand responsibility as a member of a team.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Describe team role\nand scope\n1.1\nThe role and objective of the team is identified from\navailable sources of information.\n1.2\nTeam parameters, reporting relationships and responsibilities\nare identified from team discussions and appropriate external\nsources.\n\n2. Identify own role and\nresponsibility within\nteam\n2.1\nIndividual role and responsibilities within the team\nenvironment are identified.\n2.2\nRoles and responsibility of other team members are identified\nand recognized.\n2.3\nReporting relationships within team and external to team are\nidentified.\n\n3. Work as a team\nmember\n3.1\nEffective and appropriate forms of communications used and\ninteractions undertaken with team members who contribute to\nknown team activities and objectives.\n3.2\nEffective and appropriate contributions made to complement\nteam activities and objectives, based on individual skills and\ncompetencies and workplace context.\n3.3\nObserved protocols in reporting using standard operating\nprocedures.\n3.4\nContribute to the development of team work plans based on\nan understanding of team’s role and objectives and individual\ncompetencies of the members.\n\n--- PDF PAGE 9 ---\nTR-Emergency Medical Services NC II (Amended)\nPromulgated December 2013\n6\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Role and objective of\nteam\n1.1\nWork activities in a team environment with enterprise or\nspecific sector\n1.2\nLimited discretion, initiative and judgment maybe\ndemonstrated on the job, either individually or in a team\nenvironment\n2. Sources of\ninformation\n2.1\nStandard operating and/or other workplace procedures\n2.2\nJob procedures\n2.3\nMachine/equipment manufacturer’s specifications and\ninstructions\n2.4\nOrganizational or external personnel\n2.5\nClient/supplier instructions\n2.6\nQuality standards\n2.7\nOHS and environmental standards\n3. Workplace context\n3.1\nWork procedures and practices\n3.2\nConditions of work environments\n3.3\nLegislation and industrial agreements\n3.4\nStandard work practice including the storage, safe handling\nand disposal of chemicals\n3.5\nSafety, environmental, housekeeping and quality guidelines\n\n--- PDF PAGE 10 ---\nTR-Emergency Medical Services NC II (Amended)\nPromulgated December 2013\n7\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nOperated in a team to complete workplace activity\n1.2\nWorked effectively with others\n1.3\nConveyed information in written or oral form\n1.4\nSelected and used appropriate workplace language\n1.5\nFollowed designated work plan for the job\n1.6\nReported outcomes\n2. Underpinning\nknowledge\n2.1\nCommunication process\n2.2\nTeam structure\n2.3\nTeam roles\n2.4\nGroup planning and decision making\n3. Underpinning skills\n3.1\nCommunicate appropriately, consistent with the culture of the\nworkplace\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nAccess to relevant workplace or appropriately simulated\nenvironment where assessment can take place\n 4.2\nMaterials relevant to the proposed activity or tasks\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1\nObservation of the individual member in relation to the work\nactivities of the group\n5.2\nObservation of simulation and or role play involving the\nparticipation of individual member to the attainment of\norganizational goal\n5.3\nCase studies and scenarios as a basis for discussion of\nissues and strategies in teamwork\n6. Context of\nassessment\n6.1\nCompetency may be assessed in workplace or in a simulated\nworkplace setting\n6.2\nAssessment shall be observed while task are being\nundertaken whether individually or in group\n\n--- PDF PAGE 11 ---\nTR-Emergency Medical Services NC II (Amended)\nPromulgated December 2013\n8\nUNIT OF COMPETENCY :\nPRACTICE CAREER PROFESSIONALISM\nUNIT CODE\n:\n500311107\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes in promoting\ncareer growth and advancement.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Integrate personal\nobjectives with\norganizational goals\n1.1\nPersonal growth and work plans are pursued towards\nimproving the qualifications set for the profession.\n1.2\nIntra and interpersonal relationships are maintained in the\ncourse of managing oneself based on performance\nevaluation.\n1.3\nCommitment to the organization and its goal is demonstrated\nin the performance of duties.\n2. Set and meet work\npriorities\n2.1\nCompeting demands are prioritized to achieve personal, team\nand organizational goals and objectives.\n2.2\nResources are utilized efficiently and effectively to manage\nwork priorities and commitments.\n2.3\nPractices along economic use and maintenance of equipment\nand facilities are followed as per established procedures.\n3. Maintain professional\ngrowth and\ndevelopment\n3.1\nTrainings and career opportunities are identified and\navailed of based on job requirements.\n3.2\nRecognitions are sought/received and demonstrated as proof\nof career advancement.\n3.3\nLicenses and/or certifications relevant to job and career are\nobtained and renewed.\n\n--- PDF PAGE 12 ---\nTR-Emergency Medical Services NC II (Amended)\nPromulgated December 2013\n9\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Evaluation\n1.1\nPerformance Appraisal\n1.2\nPsychological Profile\n1.3\nAptitude Tests\n2. Resources\n2.1\nHuman\n2.2\nFinancial\n2.3\nTechnology\n2.3.1 Hardware\n2.3.2 Software\n3. Trainings and career\nopportunities\n3.1\nParticipation in training programs\n3.1.1 Technical\n3.1.2 Supervisory\n3.1.3 Managerial\n3.1.4 Continuing Education\n3.2\nServing as Resource Persons in conferences and workshops\n4. Recognitions\n4.1\nRecommendations\n4.2\nCitations\n4.3\nCertificate of Appreciations\n4.4\nCommendations\n4.5\nAwards\n4.6\nTangible and Intangible Rewards\n5. Licenses and/or\ncertifications\n5.1\nNational Certificates\n5.2\nCertificate of Competency\n5.3\nSupport Level Licenses\n5.4\nProfessional Licenses\n\n--- PDF PAGE 13 ---\nTR-Emergency Medical Services NC II (Amended)\nPromulgated December 2013\n10\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nAttained job targets within key result areas (KRAs)\n1.2\nMaintained intra and interpersonal relationship in the course of\nmanaging oneself based on performance evaluation\n1.3\nCompleted trainings and career opportunities which are based\non the requirements of the industries\n1.4\nAcquired and maintained licenses and/or certifications\naccording to the requirement of the qualification\n2. Underpinning\nknowledge\n2.1\nWork values and ethics (Code of Conduct, Code of Ethics,\netc.)\n2.2\nCompany policies\n2.3\nCompany operations, procedures and standards\n2.4\nFundamental rights at work including gender sensitivity\n2.5\nPersonal hygiene practices\n3. Underpinning skills\n3.1\nAppropriate practice of personal hygiene\n3.2\nIntra and Interpersonal skills\n3.3\nCommunication skills\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nWorkplace or assessment location\n4.2\nCase studies/scenarios\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1\nPortfolio Assessment\n5.2\nInterview\n5.3\nSimulation/Role-plays\n5.4\nObservation\n5.5\nThird Party Reports\n5.6\nExams and Tests\n6. Context of\nassessment\n6.1\nCompetency may be assessed in the work place or in a\nsimulated work place setting\n\n--- PDF PAGE 14 ---\nTR-Emergency Medical Services NC II (Amended)\nPromulgated December 2013\n11\nUNIT OF COMPETENCY : PRACTICE OCCUPATIONAL HEALTH AND SAFETY\nPROCEDURES\nUNIT CODE\n:\n500311108\nUNIT DESCRIPTOR\n:\nThis unit covers the outcomes required to comply with regulatory\nand organizational requirements for occupational health and safety.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Identify hazards and\nrisks\n1.1\nSafety regulations and workplace safety and hazard control\npractices and procedures are clarified and explained based on\norganization procedures.\n1.2\nHazards/risks in the workplace and their corresponding\nindicators are identified to minimize or eliminate risk to co-\nworkers, workplace and environment in accordance with\norganization procedures.\n1.3\nContingency measures during workplace accidents, fire and\nother emergencies are recognized and established in\naccordance with organization procedures.\n2. Evaluate hazards and\nrisks\n2.1\nTerms of maximum tolerable limits which when exceeded will\nresult in harm or damage are identified based on threshold\nlimit values (TLV).\n2.2\nEffects of the hazards are determined.\n2.3\nOHS issues and/or concerns and identified safety hazards are\nreported to designated personnel in accordance with\nworkplace requirements and relevant workplace OHS\nlegislation.\n3. Control hazards and\nrisks\n3.1\nOccupational Health and Safety (OHS) procedures for\ncontrolling hazards/risks in workplace are consistently\nfollowed.\n3.2\nProcedures for dealing with workplace accidents, fire and\nemergencies are followed in accordance with organization\nOHS policies.\n3.3\nPersonal protective equipment (PPE) is correctly used in\naccordance with organization OHS procedures and practices.\n3.4\nAppropriate assistance is provided in the event of a workplace\nemergency in accordance with established organization\nprotocol.\n4. Maintain OHS\nawareness\n4.1\nEmergency-related drills and trainings are participated in\nas per established organization guidelines and procedures.\n4.2\nOHS personal records are completed and updated in\naccordance with workplace requirements.\n\n--- PDF PAGE 15 ---\nTR-Emergency Medical Services NC II (Amended)\nPromulgated December 2013\n12\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Safety regulations\nMay include but are not limited to:\n1.1\nClean Air Act\n1.2\nBuilding code\n1.3\nNational Electrical and Fire Safety Codes\n1.4\nWaste management statutes and rules\n1.5\nPhilippine Occupational Safety and Health Standards\n1.6\nDOLE regulations on safety legal requirements\n1.7\nECC regulations\n2. Hazards/Risks\nMay include but are not limited to:\n2.1\nPhysical hazards – impact, illumination, pressure, noise,\nvibration, temperature, radiation\n2.2\nBiological hazards- bacteria, viruses, plants, parasites, mites,\nmolds, fungi, insects\n2.3\nChemical hazards – dusts, fibers, mists, fumes, smoke,\ngasses, vapors\n2.4\nErgonomics\n• Psychological factors – over exertion/ excessive force,\nawkward/static positions, fatigue, direct pressure, varying\nmetabolic cycles\n• Physiological factors – monotony, personal relationship,\nwork out cycle\n3. Contingency\nmeasures\nMay include but are not limited to:\n3.1\nEvacuation\n3.2\nIsolation\n3.3\nDecontamination\n3.4\n(Calling designed) emergency personnel\n4. PPE\nMay include but are not limited to:\n4.1\nMask\n4.2\nGloves\n4.3\nGoggles\n4.4\nHair Net/cap/bonnet\n4.5\nFace mask/shield\n4.6\nEar muffs\n4.7\nApron/Gown/coverall/jump suit\n4.8\nAnti-static suits\n5. Emergency-related\ndrills and training\n5.1\nFire drill\n5.2\nEarthquake drill\n5.3\nBasic life support/CPR\n5.4\nFirst aid\n5.5\nSpillage control\n5.6\nDecontamination of chemical and toxic\n5.7\nDisaster preparedness/management\n6. OHS personal\nrecords\n6.1\nMedical/Health records\n6.2\nIncident reports\n6.3\nAccident reports\n6.4\nOHS-related training completed\n\n--- PDF PAGE 16 ---\nTR-Emergency Medical Services NC II (Amended)\nPromulgated December 2013\n13\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nExplained clearly established workplace safety and hazard\ncontrol practices and procedures\n1.2\nIdentified hazards/risks in the workplace and its corresponding\nindicators in accordance with company procedures\n1.3\nRecognized contingency measures during workplace\naccidents, fire and other emergencies\n1.4\nIdentified terms of maximum tolerable limits based on\nthreshold limit value (TLV)\n1.5\nFollowed Occupational Health and Safety (OHS) procedures\nfor controlling hazards/risks in workplace\n1.6\nUsed Personal Protective Equipment (PPE) in accordance\nwith company OHS procedures and practices\n1.7\nCompleted and updated OHS personal records in accordance\nwith workplace requirements\n2. Underpinning\nknowledge\n\n2.1\nOHS procedures and practices and regulations\n2.2\nPPE types and uses\n2.3\nPersonal hygiene practices\n2.4\nHazards/risks identification and control\n2.5\nThreshold Limit Value -TLV\n2.6\nOHS indicators\n2.7\nOrganization safety and health protocol\n2.8\nSafety consciousness\n2.9\nHealth consciousness\n3. Underpinning\n skills\n3.1\nPractice of personal hygiene\n3.2\nHazards/risks identification and control skills\n3.3\nInterpersonal skills\n3.4\nCommunication skills\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nWorkplace or assessment location\n4.2\nOHS personal records\n4.3\nPPE\n4.4\nHealth records\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1\nPortfolio Assessment\n5.2\nInterview\n5.3\nCase Study/Situation\n6. Context of\nassessment\n6.1\nCompetency may be assessed in the work place or in a\nsimulated work place setting\n\n--- PDF PAGE 17 ---\nTESDA-SOP-QSO-01-F08\nTR-Emergency Medical Services NC II (Amended)\nPromulgated December 2013\n14\nCOMMON COMPETENCIES\n\nUNIT OF COMPETENCY :\nIMPLEMENT AND MONITOR INFECTION CONTROL POLICIES\nAND PROCEDURES\n\nUNIT CODE\n:\nHCS323201\n\nUNIT DESCRIPTOR\n:\nThis unit is concerned with infection control responsibilities of\nemployees with supervisory accountability to implement and\nmonitor infection control policy and procedures in a specific work\nunit or team within an organization. This unit does not apply to a\nrole with organization-wide responsibilities for infection control\npolicy and procedure development, implementation or monitoring.\n\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Provide information to\nthe work group about\nthe organization's\ninfection control\npolicies and\nprocedures\n\n1.1\nRelevant information about the organization's infection control\npolicies and procedures, and applicable industry codes of\npractices are accurately and clearly explained to the work\ngroup.\n1.2\nInformation about identified hazards and the outcomes of\ninfection risk assessments is regularly provided to the work\ngroup.\n1.3\nOpportunity is provided for the work group to seek further\ninformation on workplace infection control issues and practices.\n2. Integrate the\norganization's\ninfection control policy\nand procedure into\nwork practices\n2.1\nInfection control policies and procedures are implemented by\nsupervisor and members of the work group.\n2.2\nLiaison is maintained with person responsible for organization-\nwide infection control.\n2.3\nThe Supervisor's coaching support ensures that\nindividuals/teams are able to implement infection control\npractices.\n2.4\nWork procedures are adopted to reflect appropriate infection\ncontrol practice.\n2.5\nIssues raised through consultation are dealt with and resolved\npromptly or referred to the appropriate personnel for resolution.\n2.6\nWorkplace procedures for dealing with infection control risks and\nhazardous events are implemented whenever necessary.\n2.7\nEmployees are encouraged to report infection risks and to\nimprove infection control procedures.\n3. Monitor infection\ncontrol performance\nand implement\nimprovements in\npractices\n\n3.1\nInfection control hazardous events are investigated promptly to\nidentify their cause in accordance with organization policy and\nprocedures.\n3.2\nWork procedures to control infection risks are monitored to\nensure compliance.\n3.3\nWork procedures are regularly reviewed and adjusted to ensure\nimprovements in infection control practice.\n3.4\nSupervisor provides feedback to team and individuals on\ncompliance issues, changes in work procedures and infection\ncontrol outcomes.\n3.5\nTraining in work procedures is provided as required to ensure\nmaintenance of infection control standards.\n3.6\nInadequacies in work procedures and infection control measures\nare identified, corrected or reported to designated personnel.\n3.7\nRecords of infection control risks and incidents are accurately\nmaintained as required.\n3.8\nAggregate infection control information reports are used to\nidentify hazards, to monitor and improve risk control methods\nand to indicate training needs.\n\n--- PDF PAGE 18 ---\nTESDA-SOP-QSO-01-F08\nTR-Emergency Medical Services NC II (Amended)\nPromulgated December 2013\n15\nRANGE OF VARIABLES\nVARIABLES\nRANGE\n1. Infection Control\nPolicies and\nProcedures\nMay include:\n1.1\nCleaning procedures and schedules\n1.2\nCleaning agents\n1.3\nCleaning equipment\n1.4\nHandling, storage and disposal of all types of waste\n1.5\nFood handling and food safety\n1.6\nHygiene procedures\n1.7\nInfection control risk management\n1.8\nInfection control incident and hazard reporting\n1.9\nSterilizing\n1.10\nLinen production and handling\n1.11\nMaintenance procedures\n1.12\nStorage requirements\n1.13\nPersonal protective clothing\n1.14\nWork flows\n1.15\nManagement of blood and body fluid spills\n1.16\nSingle use of disposables\n1.17\nAseptic techniques\n1.18\nSkin preparation procedures\n1.19\nImmunization\n1.20\nNeedle stick injuries\n1.21\nPersonal contact with infectious patients\n1.22\nStandard and additional precautions\n1.23\nConfidentiality\n1.24\nEmployee training\n1.25\nContractors\n2. Industry Codes of\nPractice\nMay include:\n2.1\nNational Health and Medical Research Council Guidelines for\nInfection Control\n2.2\nLocal & National Government Guidelines and Standards\n2.3\nManufacturer's recommendations and operating manuals\n3. Identified hazards and\nthe outcomes of\ninfection risk\nassessments\nMay include:\n3.1\nSharps\n3.2\nGlass\n3.3\nWaste\n3.4\nHuman waste and human tissues\n3.5\nPersonal contact with infectious patients\n3.6\nAnimals, insects and vermin\n3.7\nStock, including food, which has passed \"used-by\" dates.\n3.8\nIncorrect concentration of disinfectants and chemicals\n3.9\nCleaning procedures\n3.10\nLinen handling procedures\n3.11\nWork flows\n3.12\nUse of personal protective clothing\n3.13\nFood safety\n3.14\nPersonal hygiene\n4. Infection Control\nMonitoring Procedures\nMay include:\n4.1\nObservations\n4.2\nInterviews\n4.3\nSurveys and inspections\n4.4\nQuality assurance activities\n4.5\nReview of outcomes\n4.6\nData analysis\n5. Designated personnel\nMay include:\n5.1\nManager\n5.2\nInfection Control Coordinator\n5.3\nQuality Improvement Coordinator\n5.4\nInfection Control Committee\n5.5\nOccupational Safety and Health Committee\n6. Aggregate infection\ncontrol information\nMay include:\n6.1\nRecords of needle stick injuries\n6.2\nHospital-acquired infection rates\n6.3\nDOH healthcare standards clinical indicators\n6.4\nHACCP records\n6.5\nHazard reports\n\n--- PDF PAGE 19 ---\nTESDA-SOP-QSO-01-F08\nTR-Emergency Medical Services NC II (Amended)\nPromulgated December 2013\n16\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nCommunicated with team and individuals on organizational\npolicy and procedures for infection control\n1.2\nApplied infection control policies and procedures which impact\non work processes of the specific work unit\n1.3\nApplied procedures for adopting appropriate infection\npractices within work unit\n1.4\nProvided appropriate supervision of work group\n2. Required Knowledge\n2.1\nWorking knowledge, consistent with the elements of\ncompetence, of the organization's applicable infection control\npolicy and procedures and relevant industry codes of practice\n2.2\nThe hierarchy risk control measures from most to least\npreferred, that is, elimination, engineering controls,\nadministrative control, and lastly, personal protective\nequipment\n2.3\nKnowledge of infection risks and control measures in specific\nwork unit and related work processes\n2.4\nThe significance of patient confidentiality in relation to\ninfection control\n2.5\nThe significance of other management systems and\nprocedures for infection control\n2.6\nLiteracy levels and communication skills of work group\nmembers and consequent suitable communication techniques\n2.7\nOrganizational procedures for monitoring, training\n2.8\nBasic understanding of communicable disease transmission\n3. Required Skills\n3.1\nEffective communication and interpersonal skills including:\n language competence\n literacy and reading competence\n3.2\nNegotiation\n3.3\nWork planning and management\n3.4\nManagement of change of work processes\n3.5\nMonitoring compliance with policy and procedures\n3.6\nMaintaining and interpreting infection control records\n4. Resource\nImplications\nThe following resources should be provided:\n4.1\nWorkplace infection control and health and safety policies and\nprocedures\n4.2\nWaste management procedures\n4.3\nFood safety procedures\n4.4\nOther organizational policies and procedures\n4.5\nDuties statements and/or job descriptions\n5. Methods of\nAssessment\nCompetency in this unit must be assessed through:\n5.1\nObservation with questioning\n5.2\nInterview\n5.3\nPortfolio\n5.4\nDemonstration with questioning\n6. Context of\nAssessment\n6.1\nAssessment may be done in the workplace or in a simulated\nworkplace setting.\n\n--- PDF PAGE 20 ---\nTESDA-SOP-QSO-01-F08\nTR-Emergency Medical Services NC II (Amended)\nPromulgated December 2013\n17\nUNIT OF COMPETENCY :\nRESPOND EFFECTIVELY TO DIFFICULT/CHALLENGING\nBEHAVIOR\n\nUNIT CODE\n:\nHCS323202\n\nUNIT DESCRIPTOR\n:\nThis unit of competency covers the knowledge, skills and attitudes\nrequired to effectively respond to difficult or challenging behaviour\nof patients.\n\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Plan responses\n1.1\nResponses are planned to instances of difficult or\nchallenging behavior to maximize the availability of other\nappropriate staff and resources.\n1.2\nSpecific manifestations of difficult or challenging behavior\nare identified and strategies appropriate to these behaviors\nare planned as required.\n1.3\nSafety of self and others is given priority in responding to\ndifficult or challenging behavior according to institutional\npolicies and procedures.\n2. Apply response\n2.1\nDifficult or challenging behavior is dealt with promptly, firmly\nand diplomatically in accordance with institutional policies\nand procedures.\n2.1\nCommunication is used effectively to achieve the desired\noutcomes in responding to difficult or challenging behavior.\n2.2\nAppropriate strategies are selected to suit particular\ninstances of difficult or challenging behavior.\n3. Report and review\nincidents\n3.1\nIncidents are reported according to institutional policies and\nprocedures.\n3.2\nIncidents are reviewed with appropriate staff and suggestions\nappropriate to area of responsibility are made.\n3.3\nDebriefing mechanisms and other activities are used and\nparticipated in.\n3.4\nAdvice and assistance is sought from legitimate sources when\nappropriate.\n\n--- PDF PAGE 21 ---\nTESDA-SOP-QSO-01-F08\nTR-Emergency Medical Services NC II (Amended)\nPromulgated December 2013\n18\nRANGE OF VARIABLES\n\nVARIABLES\nRANGE\n1. Planned responses\nMay include:\n1.1\nOwn ability and experience\n1.2\nEstablished institutional procedures\n1.3\nKnowledge of individual persons and underlying causes\n2. Difficult or\nchallenging behaviors\nMay include:\n2.1\nAggression/Assaultive behavior\n2.2\nConfusion or other cognitive impairment\n2.3\nNoisiness\n2.4\nManipulative\n2.5\nWandering\n2.6\nSelf-destructive\n2.7\nIntoxication\n2.8\nWithdrawn/depressed\n2.9\nNegativistic\n2.10 Intrusive behavior\n2.11 Verbal offensiveness\n3. Strategies\nappropriate for\ndealing with\nchallenging behaviors\nMay include:\n3.1\nDiversional activities\n3.2\nReferring to appropriate personnel e.g. supervisor, security\nofficer\n3.3\nFollowing established emergency response procedures\n4. Selection of\nstrategies for dealing\nwith challenging\nbehaviors\nMay include:\n4.1\nThe nature of the incident\n4.2\nPotential effect on different parties, patient, staff and others\n4.3\nEstablished procedures and guidelines\n5. Institutional policies\nand procedures\nMay include:\n5.1\nIncident reporting and documentation\n5.2\nOperational guidelines for handling incidents and/or cases\ninvolving difficult and challenging behavior\n5.3\nDebriefing of staff involved in the incident\n\n--- PDF PAGE 22 ---\nTESDA-SOP-QSO-01-F08\nTR-Emergency Medical Services NC II (Amended)\nPromulgated December 2013\n19\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nIdentified specific manifestations of difficult or challenging\nbehavior and strategies are planned, selected and applied as\nrequired\n1.2\nMaintained personal safety and the safety of others\n1.3\nReported incidents, reviewed and responded quickly and\neffectively to contingencies\n1.4\nDebriefing mechanisms are used\n2. Required Knowledge\n2.1\nOSH and issues relating to difficult and challenging behavior\n2.2\nPatient issues which need to be referred to an appropriate\nhealth professional\n2.3\nAbility to interpret and follow the instructions and guidance of\nhealth professionals involved with the care of patient/client\n3. Required Skills\n3.1\nEffectively using techniques for monitoring own service area\nincluding client satisfaction\n3.2\nSpeaking in a firm, diplomatic and culturally appropriate\nmanner\n3.3\nRemaining calm and positive in adversity\n3.4\nThinking and responding quickly and strategically\n3.5\nRemaining alert to potential incidents of difficult or challenging\nbehavior\n3.6\nMonitoring and/or maintaining security equipment\n3.7\nWorking with others and displaying empathy with patient and\nrelatives\n4. Resource\nImplications\nThe following resources should be provided:\n4.1\nAccess to relevant workplace or appropriately simulated\nenvironment where assessment can take place\n4.2\nRelevant institutional policy, guidelines, procedures and\nprotocols\n4.3\nEmergency response procedures and employee support\narrangements\n5. Methods of\nassessment\nCompetency in this unit must be assessed through:\n5.1\nObservation with questioning\n5.2\nDemonstration with questioning\n6. Context of\nAssessment\n6.1\nAssessment may be done in the workplace or in a simulated\nworkplace setting.\n\n--- PDF PAGE 23 ---\nTESDA-SOP-QSO-01-F08\nTR-Emergency Medical Services NC II (Amended)\nPromulgated December 2013\n20\nUNIT OF COMPETENCY :\nAPPLY BASIC FIRST AID\n\nUNIT CODE\n:\nHCS323203\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes required to\nprovide an initial response where First Aid is required. In this unit it\nis assumed that the Ambulance Care Assistant is working under\nsupervision and / or according to established workplace First-Aid\nprocedures and policies.\n\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Assess the situation\n1.1\nPhysical hazards to self and casualty’s health and safety are\nidentified.\n1.2\nImmediate risks to self and casualty’s occupational safety and\nhealth (OSH) are minimized by controlling the hazard in\naccordance with OSH requirements.\n1.3\nCasualty’s vital signs and physical condition are assessed in\naccordance with workplace procedures.\n2. Apply basic first aid\ntechniques\n2.1\nFirst Aid management is provided in accordance with\nestablished First Aid procedures.\n2.2\nCasualty is reassured in a caring and calm manner and made\ncomfortable using available resources.\n2.3\nFirst Aid assistance is sought from others in a timely manner\nand as appropriate.\n2.4\nCasualty’s condition is monitored and responded to in\naccordance with effective First-Aid principles and workplace\nprocedures.\n2.5\nDetails of casualty’s physical condition, changes in conditions,\nmanagement and response are accurately recorded in line\nwith organizational procedures.\n2.6\nCasualty management is finalized according to his/her needs\nand First Aid principles.\n3. Communicate details\nof the incident\n3.1\n Appropriate medical assistance is requested using relevant\ncommunication media and equipment.\n3.2\nDetails of casualty’s condition and management activities are\naccurately conveyed to emergency services/relieving\npersonnel.\n3.3\nReports to supervisors are prepared in a timely manner,\npresenting all relevant facts according to established company\nprocedures.\n\n--- PDF PAGE 24 ---\nTESDA-SOP-QSO-01-F08\nTR-Emergency Medical Services NC II (Amended)\nPromulgated December 2013\n21\nRANGE OF VARIABLES\n\nVARIABLES\nRANGE\n1.First Aid\nManagement\nMay include:\n1.1\nWorkplace policies and procedures\n1.2\nIndustry/site specific regulations, codes\n1.3\nOSH\n1.4\nState and territory workplace health and safety requirements\n1.5\nAllergies the casualty may have\n\n2. Physical\nHazards\nMay include:\n2.1\nWorkplace hazards\n2.2\nEnvironmental hazards\n2.3\nProximity of other people\n2.4\nHazards associated with casualty management processes\n3. Risks\nMay include:\n3.1\nWorksite equipment, machinery and substances\n3.2\nEnvironmental risks\n3.3\nBodily fluids\n3.4\nRisk of further injury to the casualty\n3.5\nRisk associated with the proximity of the others and bystanders\n4. Casualty’s\nCondition\nMay include:\n4.1\nAbdominal injuries\n4.2\nAllergic reactions\n4.3\nBleeding\n4.4\nBurns-thermal, chemical, friction, electrical\n4.5\nCardiac conditions\n4.6\nChemical contamination\n4.7\nCod injuries\n4.8\nCrush injuries\n4.9\nDislocations\n4.10 Drowning\n4.11 Eye injuries\n4.12 Fractures\n4.13 Head injuries\n4.14 Epilepsy\n4.15 Minor skin injuries\n4.16 Neck and spinal injuries\n4.17 Needle stick injuries\n4.18 Poisoning and toxic substances\n4.19 Shock\n4.20 Smoke inhalation\n\n--- PDF PAGE 25 ---\nTESDA-SOP-QSO-01-F08\nTR-Emergency Medical Services NC II (Amended)\nPromulgated December 2013\n22\nVARIABLES\nRANGE\n5. Equipment and\nResources\nMay include:\n5.1\nDefibrillation units\n5.2\nPressure bandages\n5.3\nThermometers\n5.4\nFirst Aid kit\n5.5\nEyewash\n5.6\nThermal blankets\n5.7\nPocket face masks\n5.8\nRubber gloves\n5.9\nDressing\n5.10 Space device\n5.11 Cervical collars\n6. Communication\nSystem\nMay include:\n6.1\nMobile phone\n6.2\nSatellite phones\n6.3\nHF/VHF radio\n6.4\nFlags\n6.5\nFlares\n6.6\nTwo-way radio\n6.7\nEmail\n6.8\nElectronic equipment\n7. Vital Signs\nMay include:\n7.1\nConsciousness\n7.2\nCirculation\n7.3\nAirway\n7.4\nBreathing\n8. First Aid\nPrinciples\nMay include:\n8.1\nChecking the site for danger to self, casualty and others and\nminimizing the danger\n8.2\nChecking and maintaining the casualty’s circulation, airway and\nbreathing\n\n--- PDF PAGE 26 ---\nTESDA-SOP-QSO-01-F08\nTR-Emergency Medical Services NC II (Amended)\nPromulgated December 2013\n23\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nComplied with institutional requirements, OSH laws infections\ncontrol and manual handling procedures and relevant health\nregulations\n1.2\nIdentified physical hazards of the casualty and minimized\nimmediate risks\n1.3\nAssessed and monitored the physical condition of the casualty\n1.4\nResponded to emergency using basic life support measures\n1.5\nProvided initial response where First Aid is required\n1.6\nDealt with complex casualties or incidents\n1.7\nPrepared reports to concerned personnel in a timely manner\n2. Required Knowledge\n2.1\nBasic anatomy and physiology\n2.2\nCompany standard operating procedures (sops)\n2.3\nDealing with confidentiality\n2.4\nKnowledge of the Ambulance Care Assistants’ skills\nlimitations\n2.5\nOSH legislation and regulations\n2.6\nHow to gain access to and interpret material safety data\nsheets\n3. Required Skills\n3.1\nResuscitation\n3.2\nSafe manual handling of casualty\n3.3\nConsideration of the welfare of the casualty\n3.4\nReport preparation\n3.5\nCommunication skills\n3.6\nInterpreting and using listed documents\n4. Resource\nImplications\nThe following resources should be provided:\n4.1\nAccess to relevant work station\n4.2\nRelevant institutional policies, guidelines procedure and\nprotocol\n4.3\nEquipment and materials relevant to the proposed activities\n5. Methods of\nAssessment\nCompetency in this unit must be assessed through:\n5.1\nDemonstration with questioning\n5.2\nInterview\n5.3\nThird-Party report\n5.4\nPortfolio\n6. Context of\nAssessment\n6.1\nAssessment may be done in a workplace or simulated work\narea setting.\n\n--- PDF PAGE 27 ---\nTESDA-SOP-QSO-01-F08\nTR-Emergency Medical Services NC II (Amended)\nPromulgated December 2013\n24\nUNIT OF COMPETENCY :\nMAINTAIN HIGH STANDARDS OF PATIENT SERVICES\n\nUNIT CODE\n:\nHCS323204\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes required in the\nmaintenance of high standards of patient services.\n\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Communicate\nappropriately with\npatients\n1.1\nEffective communication strategies and techniques are\nidentified and used to achieve best patient service outcomes.\n1.2\nComplaints are responded to in accordance with\norganizational policy to ensure best service to patients.\n1.3\nComplaints are dealt with in accordance with established\nprocedures.\n1.4\nInterpreter services are accessed as required.\n1.5\nAction is taken to resolve conflicts either directly, where a\npositive outcome can be immediately achieved, or by referral\nto the appropriate personnel.\n1.6\nParticipation in work team is constructive and collaborative\nand demonstrates an understanding of own role.\n2. Establish and\nmaintain good\ninterpersonal\nrelationship with\npatients\n2.1\nRapport is established to ensure the service is appropriate to\nand in the best interests of patients.\n2.2\nEffective listening skills are used to ensure a high level of\neffective communication and quality of service.\n2.3\nPatient concerns and needs are correctly identified and\nresponded to responsibly and according to established\nprocedures and guidelines.\n2.4\nEffectiveness of interpersonal interaction is consistently\nmonitored and evaluated to ensure best patient service\noutcomes.\n3. Act in a respectful\nmanner at all times\n3.1\nRespect for differences is positively, actively and\nconsistently demonstrated in all work.\n3.2\nConfidentiality and privacy of patients is maintained.\n3.3\nCourtesy is demonstrated in all interactions with patients, their\nvisitors, cares and family.\n3.4\nAssistance with the care of patients with challenging\nbehaviors is provided in accordance with established\nprocedures.\n3.5\nTechniques are used to manage and minimize aggression.\n4. Evaluate own work to\nmaintain a high\nstandard of patient\nservice\n4.1\nAdvice and assistance is received or sought from appropriate\nsources on own performance.\n4.2\nOwn work is adjusted, incorporating recommendations that\naddress performance issues, to maintain the agreed standard\nof patient support.\n\n--- PDF PAGE 28 ---\nTESDA-SOP-QSO-01-F08\nTR-Emergency Medical Services NC II (Amended)\nPromulgated December 2013\n25\nRANGE OF VARIABLES\n\nVARIABLES\nRANGE\n1. Patients\nMay include:\n1.1\nPatients (In-patients and Out-patients)\n1.2\nProspective patients to the service or services\n1.3\nPatients may be in contact with the institution through\nappropriate health care personnel and professionals or other\nadvocates or agencies\n2. Others with whom\ninteraction is required\nin regard to patient\nservices\nMay include:\n2.1\nOther staff and team members\n2.2\nService units or departments\n2.3\nFamily members, carers and friends of patients\n2.4\nProfessional representatives or agents of patients such as:\n Medical specialists\n Nurses\n Social workers\n Dietitians\n Therapists\n Allied health professionals\n Volunteers\n Teachers and/or spiritual\n Community\n2.5\nGeneral public\n3. Communication\nMay include:\n3.1\nEnglish/Tagalog/vernacular\n3.2\nSign language\n3.3\nThrough an interpreter\n3.4\nCommunity language as required by the service / organization\n4. Modes of\ncommunication\nMay include:\n4.1\nContinuing interaction with patients and clients\n4.2\nVerbal conversations either in person or via telephone\n4.3\nWritten notes by post or electronic media\n4.4\nWorker, family member friend or professional interpreter who has\nrelevant languages\n5. Respect for difference\nMay include:\n5.1\nPhysical\n5.2\nCognitive/mental or intellectual issues that may impact on\ncommunication\n5.3\nCultural and ethnic\n5.4\nReligious/spiritual\n5.5\nSocial\n5.6\nAge\n5.7\nLanguage literacy and numeracy abilities\n5.8\nSexuality and sexual preference\n6. Confidentiality and\nprivacy of patients\nMay include:\n6.1\nFees\n6.2\nHealth fund entitlements\n6.3\nWelfare entitlements\n6.4\nPayment methods and records\n6.5\nPublic environments\n6.6\nLegal and ethical requirements\n6.7\nWriting details i.e. medical and consent forms\n6.8\nConversations on the telephone\n6.9\nSecure location for written records\n6.10\nOffering a private location for discussions\n6.11\nInformation disclosed to an appropriate person consistent with\none’s level of responsibility\n7. Performance\nmonitoring\nMay include:\n7.1\nSelf-monitoring\n7.2\nSupervisor assessment\n7.3\nPatient feedback\n\n--- PDF PAGE 29 ---\nTESDA-SOP-QSO-01-F08\nTR-Emergency Medical Services NC II (Amended)\nPromulgated December 2013\n26\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nCommunicated appropriately with patients\n1.2\nHandled complaints and resolved conflict, or referred matters\nto supervisors when required\n1.3\nComplied with relevant policies, protocols, guidelines and\nprocedures of the organization\n1.4\nEstablished and maintained good interpersonal relationship\nwith patients\n1.5\nDemonstrated courtesy in all interactions with patients, their\nvisitors, and family\n2. Required Knowledge\n2.1\nRoles and responsibilities of self and other workers within the\norganization\n2.2\nWhen client/patient issues need to be referred to an\nappropriate health professional\n2.3\nOrganizational policies and procedures for privacy and\nconfidentiality of information provided by patients and others\n2.4\nKnowledge of cultures relevant to the particular service\n2.5\nInstitutional policy on patient rights and responsibilities\n3. Required Skills\n3.1\nEstablishing and maintaining relationships, taking into account\nindividual differences\n3.2\nUsing effective listening techniques\n3.3\nUsing appropriate verbal and non verbal communication styles\n3.4\nInterpreting and following instructions and guidance of health\nprofessionals involved with the care of patient/clients\n3.5\nOral and written communication\n3.6\nProblem solving skills required includes using available\nresources and prioritising workload\n3.7\nDealing with conflict\n3.8\nWorking with others and displaying empathy with patient and\nrelatives\n\n4. Resource\nImplications\nThe following resources should be provided:\n4.1\nAccess to relevant workplace or appropriately simulated\nenvironment where assessment can take place\n4.2\nRelevant government and organizational policy, guidelines,\nprocedures and protocols\n4.3\nAny relevant legislation in relation to service delivery\n5. Methods of\nAssessment\nCompetency in this unit must be assessed through:\n5.1\nDemonstration with questioning\n5.2\nInterview\n5.3\nThird party report\n6. Context of\nAssessment\n6.1\nAssessment may be done in the workplace or a simulated\nworkplace setting\n\n--- PDF PAGE 30 ---\nTESDA-SOP-QSO-01-F08\nTR-Emergency Medical Services NC II (Amended)\nPromulgated December 2013\n27\nCORE COMPETENCIES\n\nUNIT OF COMPETENCY :\nPERFORM CARDIO PULMONARY RESUSCITATION (CPR)\nWITH AUTOMATED EXTERNAL DEFIBRILLATOR (AED)\nOPERATION\n\nUNIT CODE\n:\nHCS322317\n\nUNIT DESCRIPTOR\n:\nThis unit of competency deals with reviving the heart and lungs by\nperforming cardiopulmonary resuscitation (CPR) with automated\nexternal defibrillator (AED).\n\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Assess the situation\n1.1\nPhysical hazards are identified and minimized according to\nsafety requirements and workplace procedures.\n1.2\nRisks to ambulance care assistants and others are assessed\nand appropriate response determined to ensure prompt\ncontrol of situation.\n1.3\nNeed for emergency services/medical assistance is\nascertained and prioritized and triage undertaken where\nrequired.\n1.4\nResources are deployed to appropriate locations as required\nin accordance with workplace procedure.\n2. Contribute in the\nmanagement of\ncasualty/ies\n2.1\nAgreement for management of the casualty’s injury/illness is\nsought from person(s) where relevant.\n2.2\nWelfare procedure is determined and implemented according\nto casualty/ies needs.\n2.3\nEffects of injury are controlled and effective CPR and AED\noperation is determined and applied to meet the needs of the\ncasualty\n2.4\nCasualty/ies level of consciousness, circulation, airway and\nbreathing are monitored and responded to in a timely manner\nin accordance with effective pre-hospital care\n2.5\nAutomated External Defibrillator(AED)is correctly operated\nin accordance with manufacturer’s/supplier’s instructions.\n2.6 Recovery position is also determined and applied to meet the\nneed of the patient\n2.7\nManagement is finalised according to casualty/ies needs\n3. Manage ambulance\nand personnel\nresources\n3.1\nAvailable resources required are identified and\ncommunication links with appropriate personnel, emergency\nmanagement services and medical assistance are established\nas appropriate.\n3.2\nEmergency management service and medical assistance are\nestablished as appropriate\n3.3\nCorrect amount of resources are deployed to appropriate\nlocations in an effective manner to ensure timely arrival of\nrequired resources.\n3.4\nThe provision of resources is documented and modifications\nrecommended.\n3.5\nEvacuation of casualties is coordinated according to worksite\nevacuation procedures.\n3.6\nSupport services are arranged for personnel involved in the\nincident in accordance with workplace principles and\nprocedures.\n\n--- PDF PAGE 31 ---\nTESDA-SOP-QSO-01-F08\nTR-Emergency Medical Services NC II (Amended)\nPromulgated December 2013\n28\n\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n4. Communicate\nessential incident\ndetails\n4.1\nCommunication is maintained with relevant personnel using\nappropriate media and equipment.\n4.2\nPatient care information is communicated with other\nproviders/carers as appropriate to meet their needs and in\naccordance with workplace procedures.\n4.3\nInformation is calmly provided to reassure casualty, adopting\na communication style to match the casualty's level of\nconsciousness.\n5. Manage casualty in a\nremote and/or\nisolated area\n5.1\nPreparation for isolated travel or work is undertaken,\naccounting for expected contingencies.\n5.2\nCasualty’s condition is assessed and appropriate response is\ndetermined in order to minimise hazards and determine need\nfor medical assistance.\n5.3\nCasualty’s condition is monitored and responded to in\naccordance with effective CPR and AED Operation\n5.4\nReassurance and support is provided to the casualty.\n5.5\nCasualty's comfort is ensured and determined by establishing\nand explaining the nature of the illness/injury and the\nmanagement procedures.\n5.6\nShelter from elements is undertaken in accordance with\nenvironmental conditions.\n5.7\nCondition of casualty is documented over time to assist in on-\ngoing management.\n5.8\nCommunication links to medical services are established to\nensure prompt control action is undertaken.\n5.9.\nDecision whether to transport casualty to medical assistance\nor wait is made by evaluating environmental and casualty’s\ncondition.\n5.10 Assistance in the evacuation of the casualty by emergency\nservices is provided as required.\n6. Evaluate the incident\n6.1\nManagement of the incident is evaluated and where required\nan action plan is developed in consultation with relevant\nparties.\n6.2\nParticipation in debriefing/evaluation occurs either by self or\nothers or both in order to improve future operations and\naddress individual’s needs.\n6.3\nAccess is provided to bona fide critical stress facilitators\nwhere required/requested.\n6.4\nSite management/procedures are implemented and evaluated\nin accordance with risk assessment.\n\n--- PDF PAGE 32 ---\nTESDA-SOP-QSO-01-F08\nTR-Emergency Medical Services NC II (Amended)\nPromulgated December 2013\n29\nRANGE OF VARIABLES\n\nVARIABLES\nRANGE\n1. Physical hazards\nMay include:\n1.1\nWorkplace hazards\n1.2\nEnvironmental hazards\n1.3\nProximity to other people\n1.4\nHazards associated with the casualty management processes\n2. Risks\nMay include:\n2.1\nWorksite equipment, machinery and substances\n2.2\nAmbulance equipment (oxygen cylinders, AED)\n2.3\nEnvironmental risks\n2.4\nBody fluids\n2.5\nRisk of further injury to the casualty\n2.6\nRisks associated with the proximity of other workers and\nbystanders\n3. Cardio Pulmonary\nResuscitation (CPR)\nMay include:\n3.1\nCardio = Heart\n3.2\nPulmonary = Lungs\n3.3\nResuscitate = Revive\n4. Automated External\nDefibrillator (AED)\nMay include:\nIs used in cases of:\n4.1\nLife threatening cardiac arrhythmias of ventricular fibrillation\n4.2\nLife threatening cardiac arrhythmias of pulseless ventricular\ntachycardia\n5. Resources and\nequipment are used\nappropriate to the\nrisk to be met\nMay include:\n7.1\nSphygmomanometer\n7.2\nStethoscope\n7.3\nAutomated External Defibrillators\n7.4\nPulse Oximeter\n7.5\nPressure bandages\n7.6\nThermometers\n7.7\nScoop Stretchers\n7.8\nTrolley cot\n7.9\nVacuum mattress\n7.10 Emergency kit\n7.11 Eyewash\n7.12 Thermal blankets\n7.13 HEPA/surgical masks\n7.14 Surgical gloves\n7.15 Dressing set\n7.16 Capnography\n7.17 X-collars\n7.18 Bag-valve-mask with reservoir\n\n--- PDF PAGE 33 ---\nTESDA-SOP-QSO-01-F08\nTR-Emergency Medical Services NC II (Amended)\nPromulgated December 2013\n30\nVARIABLES\nRANGE\n6. Communication\nsystems\nMay include:\n6.1\nMobile phone\n6.2\nSatellite phones\n6.3\nHF/VHF radio\n6.4\nFlags\n6.5\nFlares\n6.6\nTwo way radio\n6.7\nEmail\n6.8\nElectronic equipment\n6.9\nHand signals\n7. Preparation for\nisolated/remote travel\nMay include:\n7.1\nSelection of relevant communication equipment\n7.2\nRelevant First Aid supplies and resources to supply for\nenvironmental conditions\n8. In remote/isolated\nareas consideration\nto travel or wait\nwould depend upon:\nMay include:\n8.1\nSeverity of injury\n8.2\nTime required for medical assistance to arrive\n8.3\nMovement that might hinder rescue procedures\n9. Documentation,\nespecially in\nremote/isolated\nareas\nMay include:\n9.1\nTime\n9.2\nFluid intake/output\n9.3\nBlood\n9.4\nVomit\n9.5\nFaeces\n9.6\nUrine\n9.7\nVital signs\n\n--- PDF PAGE 34 ---\nTESDA-SOP-QSO-01-F08\nTR-Emergency Medical Services NC II (Amended)\nPromulgated December 2013\n31\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nDemonstrated competence working individually, under\nsupervision or as part of a First Aid team\n1.2\nWhere applicable, assessment should replicate workplace\nconditions as far as possible. Where, for reasons of safety,\nspace access to equipment and resources and assessment\ntakes place away from the workplace, simulations should be\nused to represent workplace conditions as closely as possible\n1.3\nConsistency of performance should be maintained over the\nrequired range of workplace situations until renewal of\ncompetence/license is required by the industry/organization\n2. Required Knowledge\n2.1\nOSH legislation and regulations\n2.2\nLegal responsibilities and duty of care\n2.3\nBasic anatomy – skeleton, muscles, joints, bones\n2.4\nBasic physiology\n2.5\nRespiratory/circulatory system\n2.6\nHow to gain access to and interpret material safety data sheets\n(MSDS)\n2.7\nCompany standard operating procedures (SOPS)\n2.8\nDebriefing counselling procedures\n2.9\nDealing with social problems and confidentiality\n2.10\nCapabilities of emergency management services\n2.11\nKnowledge of Ambulance Care Assistants’ skills and limitations\n2.12\nBasic toxicology\n2.13\nLegal Requirements\n2.14\nInfection Control\n2.15\nLocal and national regulatory requirements relating to currency of\nskill and knowledge\n3. Required Skills\nThe specific injuries/illnesses managed should be identified according\nto the workplace/environmental needs of the workplace and the range\nof variables listed in this unit:\n3.1\nResuscitation\n3.2\nUsing semi-automated defibrillator\n3.3\nDemonstrating First Aid principles\n3.4\nApplying infection control procedures\n3.5\nSafe manual handling\n3.6\nConsideration of the welfare of the casualty\n3.7\nInitial casualty assessment\n3.8\nPreparing report\n3.9\nCommunication skills\n3.10\nIncident management skills\n3.11\nInterpreting and using listed documents\n3.12\nTransporting techniques\n3.13\nAssertiveness skills\n3.14\nCommunication skills\n3.15\nLeadership\n3.16\nDecision making\n3.17\nDuty of care\n3.18\nBleeding control\n3.19 Airway management\n3.20\nCare of unconscious\n4. Resource Implications\nThe following resources should be provided:\n4.1\nAccess to relevant workplace or appropriately simulated\nenvironment where assessment can take place.\n4.2 Relevant government and organizational policy, guidelines,\nprocedures and protocols.\n5. Methods of\nAssessment\nCompetency in this unit must be assessed through:\n5.1\nDemonstration with questioning\n5.2\nInterview\n5.3\nThird party report\n6. Context of\nAssessment\n6.1\nAssessment may be done in the workplace or a simulated\nworkplace setting.\n\n--- PDF PAGE 35 ---\nTESDA-SOP-QSO-01-F08\nTR-Emergency Medical Services NC II (Amended)\nPromulgated December 2013\n32\nUNIT OF COMPETENCY :\nMAINTAIN LIFE SUPPORT EQUIPMENT AND RESOURCES\n\nUNIT CODE\n:\nHCS322302\n\nUNIT DESCRIPTOR\n:\nThis unit of competency deals with the responsibilities in ensuring\nthat adequate supplies of ambulance equipment and resources and\nrecords are maintained. He may or may not necessarily be\nresponsible for the ordering and purchasing of equipment and\nresources, depending on the workplace organizational structure.\n\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Maintain resources\n1.1\nAvailability of adequate and relevant resources is ensured\nand secured in accordance with workplace procedures.\n1.2\nNon-consumables required by workplace are identified and\nobtained to maintain adequate readiness of supplies.\n1.3\nConsumables required by workplace are identified and\nobtained to maintain adequate readiness of supplies.\n1.4\nStock is checked and regular inspection of equipment is\ncarried out for condition and currency.\n1.5\nEquipment is recovered, cleaned and waste is disposed of\nsafely according to legislative and site procedures.\n1.6\nResources are maintained in operational readiness in\naccordance with workplace procedures.\n1.7\nResources are stored in the correct manner to ensure their\nfuture operation and serviceability.\n2. Manage records\n2.1\nRelevant forms are completed as required according to\nlegislation and site procedures.\n2.2\nForms are stored in accordance with legislative and site\nprocedures.\n2.3\nRelevant forms are sent to appropriate bodies and\nappropriate filing of these records and security of such records\nis undertaken according to workplace and legislative\nrequirements.\n2.4\nConfidentiality of records and information is maintained in\naccordance with privacy principles and statutory and/or\norganizational policies.\n\n--- PDF PAGE 36 ---\nTESDA-SOP-QSO-01-F08\nTR-Emergency Medical Services NC II (Amended)\nPromulgated December 2013\n33\nRANGE OF VARIABLES\n\nVARIABLES\nRANGE\n1. Ambulance resources\nMay include:\nNon-consumables:\n1.1\nMachines (e.g. AED, Suction machine, etc.)\n1.2\nBooks\n1.3\nReference materials including MSDSS, ECC, OHSA,\nPhilHealth\n1.4\nLegislative regulations\n1.5\nCommunication systems\n1.6\nRelevant texts\n1.7\nEquipment (e.g. Trolley Cot, Scoop Stretchers, etc.)\nConsumables:\n1.1\nEmergency kits (bandages, tape, scissors, splinter\nremovers, antiseptic, eye management, disinfectants,\nemergency numbers and contacts, etc.)\n1.2\nDressings\n1.3\nCold packs\n\n1.4\nSplints\n1.5\nSharps disposal\n1.6\nBio-hazardous waste\n1.7\nBandages\n1.8\nPersonal protective equipment\n1.9\nDisinfectants\n1.10\nCervical collars\n1.11\nSupplemental oxygen device (e.g. nasal cannula, face mask,\nnon-rebreather mask, etc.)\n1.12\nIntubation and Intravenous set (for the physician’s use only)\n2. Legislation\nMay include:\n2.1\nOSHA legislation\n2.2\nRegulations and codes of practice\n2.3\nIndustrial relations legislation\n3. Codes of practice\nMay include:\n3.1\nIndustry codes\n3.2\nIndustry standards\n3.3\nCompany procedures\n3.4\nNational and local health and safety authorities\n4. Relevant forms\nMay include:\n4.1\nIncident/injury forms\n4.2\nCasualty history forms\n4.3\nDisease notification\n4.4\nECC forms\n4.5\nPhilHealth membership\n4.6\nWorkers' compensation\n4.7\nLog book\n4.8\nPre-participation records (sport)\n4.9\nMedical histories\n4.10 Management records\n4.11 Stock records\n4.12 Infection control records\n4.13 Training records\n5. Policies and procedures\nmay be from\norganizations such as\nMay include:\n5.1\nCompany Standard Operating Procedures\n5.2\nOthers\n\n--- PDF PAGE 37 ---\nTESDA-SOP-QSO-01-F08\nTR-Emergency Medical Services NC II (Amended)\nPromulgated December 2013\n34\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nDemonstrated competence by working individually, under\nsupervision or as part of EMS team.\n\nWhere applicable, assessment should replicate workplace\nconditions as far as possible. Where, for reasons of safety,\nspace access to equipment and resources and assessment\ntakes place away from the workplace, simulations should be\nused to represent workplace conditions as closely as possible.\n\n2. Required Knowledge\n2.1\nOccupational Safety and Health Act and regulations\n2.2\nLegal responsibilities and duty of care\n2.3\nPolicies and procedures\n2.4\nCleaning agents\n2.5\nStock control\n2.6\nWaste disposal\n2.7\nTransportation techniques\n2.8\nUse of referral networks\n2.9\nDecency of skills and knowledge\n2.10 Gaining access to material safety data sheets (MSDS)\n\n3. Required Skills\n3.1\nApplying OSH legislation and regulations\n3.2\nReading skills to interpret work instructions, diagrams,\nschematics\n3.3\nCommunication skills needed to interpret, define and explain\nwork procedures\n3.4\nProblem solving in emergency situation/s\n3.5\nTroubleshooting\n3.6\nCourtesy and helping attitude\n3.7\nUsing cleaning agents\n3.8\nControlling stocks\n3.9\nDisposing waste\n3.10 Applying transportation techniques\n3.11 Using referral networks\n3.12 Gaining access to material safety data sheets\n4. Resource\nImplications\nThe following resources should be provided:\n4.1 Tools\n4.2 Test equipment and instruments\n4.3\nMaterials\n4.4\nWork station\n4.5\nJob orders/requests\n\n5. Methods of\nAssessment\nCompetency in this unit must be assessed through:\n5.1\nObservation with questioning\n5.2\nInterview\n5.3\nDemonstration with questioning\n5.4\nThird Party Report\n5.5\nPortfolio\n\n6. Context of\nAssessment\n6.1\nAssessment may be conducted in the workplace or in a\nsimulated environment.\n\n--- PDF PAGE 38 ---\nTESDA-SOP-QSO-01-F08\nTR-Emergency Medical Services NC II (Amended)\nPromulgated December 2013\n35\nUNIT OF COMPETENCY :\nIMPLEMENT SAFE ACCESS AND EXTRICATION\nPROCEDURES IN AN EMERGENCY\n\nUNIT CODE\n:\nHCS322303\n\nUNIT DESCRIPTOR\n:\nThis unit of competency involves implementing procedures to\nenable safe access to a victim/patient at the scene of a life-\nthreatening incident and then safely removing the victim/patient\nfrom the scene.\n\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Assess emergency\nsituation in relation\nto safe access and\nextrication\n1.1\nInformation relevant to the situation is obtained on or before\narrival.\n1.2\nSituation is viewed to identify and mitigate dangers according to\nstandard local ambulance procedure.\n1.3\nCondition of victim/patient is assessed.\n1.4\nObstacles impacting on safe access and extrication are\naccurately identified.\n1.5\nAccess and extrication plan is formulated based on an\nassessment of all factors associated with the situation or\nincident in line with national emergency management\narrangements.\n1.6\nAccess and extrication plan is formulated and prioritized based\non the main concerns of victim/patient welfare and safety of all\npersonnel.\n1.7\nEquipment and personnel needs are assessed based on an\nassessment of all factors associated with the situation or\nincident.\n1.8\nEquipment and personnel needs are assessed based on\nvictim/patient and personnel welfare as the prime concern.\n2. Implement\nprocedure to enable\nsafe access and\nextrication\n2.1\nAdditional personnel and equipment are requested or arranged\nas the need dictates.\n2.2\nAccess/extrication plan is implemented using equipment and\npersonnel necessary to ensure safe access/extrication and\nvictim/patient welfare.\n2.3\nMeans of safe access and extrication negotiated and maintained\naccording to national OSH standards, as well as service policies\nand procedures.\n2.4\nActions are in accordance with local ambulance standard\noperation procedures.\n2.5\nAvailable resources are utilized as necessary.\n2.6\nMust be familiar with the use of carry chairs.\n3. Monitor access and\nextrication procedure\nin an emergency\nsituation\n3.1\nSafety of victim/patient and personnel is of prime concern.\n3.2\nProgress of access/extrication is monitored constantly to ensure\nwelfare of the victim/patient and safety of personnel.\n3.3\nVictim/Patient is monitored constantly to detect any change in\ncondition.\n3.4\nAll conditions and factors impacting on safe access/extrication\nand victim/patient welfare are monitored constantly.\n3.5\nAccess/extrication plan is modified as necessary to ensure\nsafety and the welfare of the victim/patient.\n\n--- PDF PAGE 39 ---\nTESDA-SOP-QSO-01-F08\nTR-Emergency Medical Services NC II (Amended)\nPromulgated December 2013\n36\nRANGE OF VARIABLES\n\nVARIABLES\nRANGE\nObstacles affecting access and extrication may include:\n1. Modes of transport\nMay include:\n1.1\nRoad ambulances\n1.2\nClinic cars\n1.3\nBuses\n1.4\nTricycle/motorcycle\n1.5\nJeepney\n2. Physical obstacles\n\nMay include:\n2.1\nWreckage\n2.2\nStairs\n2.3\nDebris\n2.4\nLive power\n2.5\nWater\n2.6\nDifficult house layout-squatters area\n2.7\nConfined space\n2.8\nTraffic conditions\n2.8\nAlleys\n3. Atmospheric\nobstacles\nMay include:\n3.1\nWeather – aircraft/helicopter evacuation\n3.2\nGaseous or toxic environment\n4. Geographical\nobstacles\nMay include:\n4.1\nCliffs\n4.2\nGullies\n4.3\nMountains\n4.4\nIsolated places (Batanes)\n5. Human obstacles\nMay include:\n5.1\nCrowds\n5.2\nViolent behaviour\n5.3\nRiots\n6. Emergency situation\nMay include:\n6.1\nMotor vehicle or other accident\n6.2\nFire\n6.3\nFlood\n6.4\nRiots, gangwars, violent demonstrations\n6.5\nEmergency procedures may include those recognised by\nservice policies i.e. Safety First Principles, Codes of Practice\n7. Equipment to enable\nsafe access and\nextrication\nMay include:\n7.1\nSpinal and other immobilization devices\n7.2\nScoop Stretcher\n7.3\nVacuum Mattress\n7.4\nLifting equipment including carry chair\n7.5\nWrenches\n\n--- PDF PAGE 40 ---\nTESDA-SOP-QSO-01-F08\nTR-Emergency Medical Services NC II (Amended)\nPromulgated December 2013\n37\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nDemonstrated performance in the work environment or a\nsimulated situation\n1.2\nDeveloped and implemented access/extrication plans under a\nvariety of emergency conditions\n1.3\nUsed equipment in accordance with manufacturer\nspecifications and standard operating procedures\n1.4\nRecognized that victim/patient, personnel and bystander\nwelfare is paramount in access and extrication procedures\n1.5\nObserved OSHA requirements\n2. Required Knowledge\n2.1\nDangers associated with various hazardous situations\n2.2\nCombating agency for hazard control\n2.3\nNational and local policies and procedures related to access\nand extrication\n2.4\nOSH policies and procedures relevant to access and\nextrication\n2.5\nPatient care under these circumstances\n2.6\nRelevant equipment and its uses\n2.7\nFactors which may affect safe access/extrication and\nvictim/patient welfare\n3. Required Skills\n3.1\nOral communication skills required to fulfil job roles as\nspecified by the organization/service.\n3.2\nWritten communication skills required to fulfil job roles as\nspecified by organisation/service\n3.3\nInterpersonal skills required include working with others,\nempathy with patient and relatives and an ability to relate to\npersons from differing cultural, social and religious\nbackgrounds\n3.4\nProblem solving skills required include an ability to use\navailable resources, analyse information and make decisions\nthat ensure patient welfare and their safe access/extrication in\nan emergency situation\n4. Resource\nImplications\nThe following resources should be provided:\n4.1\nAccess to appropriate workplace or simulation realistic\nworkplace setting of where assessment can be conducted\n4.2\nAccess to equipment and resources normally used in the\nworkplace\n5. Methods of\nAssessment\nCompetency in this unit must be assessed through:\n5.1\nObservation with questioning\n5.2\nOral questioning/Interview\n5.3\nEvidence gathered from the workplace environment\n5.4\nDemonstration over a period of time to ensure consistency of\nperformance\n6. Context of\nAssessment\n6.1\nEvidence must include observation of performance in the work\nenvironment or in a simulated work setting\n\n--- PDF PAGE 41 ---\nTESDA-SOP-QSO-01-F08\nTR-Emergency Medical Services NC II (Amended)\nPromulgated December 2013\n38\nUNIT OF COMPETENCY :\nCONTRIBUTE IN RECEIVING REQUEST FOR AMBULANCE\nSERVICE\n\nUNIT CODE\n:\nHCS322318\n\nUNIT DESCRIPTOR\n:\nThis unit of competency involves contributing in receiving requests\nfor ambulance services, and transferring the call for action.\n\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Receive request for\nservice\n1.1\nIncoming requests for service are answered promptly in\naccordance with local ambulance standard operating\nprocedure.\n1.2\nDetails of the situation are established using effective\ncommunication skills, techniques and resources, in\naccordance with local ambulance standard operating\nprocedure.\n1.3\nComplete details of the request are accurately recorded in a\ntimely and efficient manner and in accordance with local\nambulance standard operating procedure.\n1.4\nThe request is dealt with in a professional manner at all\ntimes.\n2. Respond to request\nfor service\n2.1\nUrgency of the request is determined using information\ngained from the person requesting the service.\n2.2\nThe person requesting the service is provided with advice.\n2.3\nA suitable response is formulated and initiated using a\nprioritizing tool in accordance with local ambulance standard\noperating procedure.\n3. Refer request\n3.1\nAny need to refer the request for service is identified and\nacted upon.\n3.2\nRequest referred in line with the situation presented and in\naccordance with local ambulance standard operating\nprocedure.\n4. Finalize request\n4.1\nCall terminated in accordance with local ambulance standard\noperating procedure.\n4.2\nFollow-up action taken as necessary and in accordance with\nthe needs of the situation, and local ambulance standard\noperating procedure.\n\n--- PDF PAGE 42 ---\nTESDA-SOP-QSO-01-F08\nTR-Emergency Medical Services NC II (Amended)\nPromulgated December 2013\n39\nRANGE OF VARIABLES\n\nVARIABLES\nRANGE\n1. Details of the\nsituation or incident\nMay include:\n1.1\nAddress or location of the incident\n1.2\nAddress or location of the caller\n1.3\nCaller’s telephone number, name and address\n1.4\nNature of the incident, e.g., identification of single and multiple\nvehicle accidents, entrapments\n1.5\nSpecial needs as requested\n1.6\nValidation of caller identity through caller ID\n2. Requests for service\nMay include:\n2.1\nMembers of the public\n2.2\nMembers of the ambulance service\n2.3\nOther emergency service organizations\n2.4\nHealth professionals\n2.5\nMilitary\n2.6\nOthers\n3. Communication\nresources\nMay include:\n3.1\nTelephone, mobile phones, text messages\n3.2\nComputer\n3.3\nFax\n3.4\nCards and log sheets\n3.5\nPrepared questionnaires and scripts\n3.6\nMedia, e.g., TV, radio stations\n4. Suitable response to\nsituations\nMay include:\n4.1\nReferral\n4.2\nTermination of call (in case of non-genuine calls)\n5. Referral may mean\nMay include:\n5.1\nPassing the request to another officer, supervisor or medical\nadviser\n5.2\nPassing the request to an interpreter\n5.3\nPassing the request to another service\n5.4\nObtaining information from another officer, supervisor or\nmedical adviser\n5.5\nObtaining information from any other source\n6. Referral of request\nmay be necessary to\nMay include:\n6.1\nDispatch ambulance\n6.2\nObtain assistance from another service as required (e.g.\npolice, fire brigade, SAR, etc.)\n6.3\nObtain assistance from an interpreter\n6.4\nProvide immediate clinical advice\n\n--- PDF PAGE 43 ---\nTESDA-SOP-QSO-01-F08\nTR-Emergency Medical Services NC II (Amended)\nPromulgated December 2013\n40\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nAssessed and dealt with a variety of situations, including:\n1.1.1 Life-threatening situations\n1.1.2 Non life-threatening situations\n1.1.3 Routine situations\n1.1.4 Situations that need to be referred\n1.1.5 Situations where people have difficulty in\ncommunicating their needs\n1.2\nDemonstrated the ability to illicit relevant information that may\ninclude previous patient history, contributing factors and\nindividual circumstances in assessment of requests for service\n2. Required Knowledge\n2.1\nOrganizational operational policies and procedures\n2.2\nUse of communications resources\n2.3\nEmergency and non-emergency services and their function\n2.4\nWorking knowledge of the geographical area\n2.5\nClinical symptoms\n3. Required Skills\n3.1\nAssessing and analyzing clinical symptoms\n3.2\nAssessing and analyzing patient history, contributing factors\nand individual circumstances surrounding the incident\n3.3\nJudgment in all aspects of receiving and dealing with requests\nfor service\n3.4\nComputer literacy including proficiency in operating prioritizing\ntools\n3.5\nDocumentation skills to enable accurate inputting and\nextraction of data\n3.6\nOral communication skills include asking questions, active\nlistening, asking for clarification of information from caller,\nnegotiating solutions, acknowledging and responding to a\nrange of views. The ability to explain clearly and concisely the\nnature of the service request, including location of the event,\nto emergency crews.\n3.7\nWritten communication skills\n3.8\nInterpersonal skills required include working with others,\nempathy with callers, patients and relatives and an ability to\nrelate to persons from differing cultural, social and religious\nbackgrounds. Ability to work with interpreters as required.\n3.9\nProblem-solving skills required include the ability to use\navailable resources, analyze information and make decisions\nthat ensure the most efficient and effective use of resources\n4. Resource\nImplications\nThe following resources should be provided:\n4.1\nAccess to appropriate workplace or simulation of realistic\nworkplace setting where assessment can be conducted\n4.2\nAccess to equipment and resources normally used in the\nworkplace\n5. Methods of\nAssessment\nCompetency in this unit must be assessed through:\n5.1\nObservation with questioning\n5.2\nOral questioning/Interview\n5.3\nEvidence gathered from the workplace environment\n5.4\nDemonstration over a period of time to ensure consistency of\nperformance\n6. Context of\nAssessment\n6.1\nEvidence must include observation of performance in the work\nenvironment or in a simulated work setting\n\n--- PDF PAGE 44 ---\nTESDA-SOP-QSO-01-F08\nTR-Emergency Medical Services NC II (Amended)\nPromulgated December 2013\n41\nUNIT OF COMPETENCY :\nCONTRIBUTE IN ALLOCATING AMBULANCE SERVICE\nRESOURCES\n\nUNIT CODE\n:\nHCS322319\n\nUNIT DESCRIPTOR\n:\nThis unit of competency involves contributing in allocating\nresources to ensure effective ambulance service.\n\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Allocate ambulance\nservice resources\n1.1\nRequests for service are prioritized in accordance with\nlocal ambulance standard operation procedure.\n1.2\nAvailable resources are assessed in accordance with local\nambulance standard operation procedure.\n1.3\nResources are allocated to emergency, non-emergency\nand special requests in accordance with local ambulance\nstandard operation procedure.\n2. Dispatch ambulance\nservice resources\n2.1\nSituation briefing to assigned personnel is adequate, clear,\ntimely and accurate.\n2.2\nCommunication is recorded according to local ambulance\nstandard operation procedure.\n2.3\nAmbulance resources are dispatched within timeframes set\nby the Ambulance Service and in accordance with local\nambulance standard operation procedure.\n3. Monitor progress of\nassigned personnel\n3.1\nAssigned personnel arrival at scene of incident/situation is\nconfirmed according to co-ordination procedures.\n3.2\nAssigned personnel capacity to deal with the\nsituation/incident is established at earliest opportunity.\n3.3\nNeed for additional resources is identified and arranged\nas needed.\n3.4\nArrival at receiving facility is arranged and monitored.\n3.5\nPersonnel and ambulance availability for re-assignment is\nnoted according to local ambulance standard operation\nprocedure.\n3.6\nNotify peer support/critical incident stress debriefing (CISD)\nteam.\n4. Maintain records of\nambulance service\nco-ordination\nactivity\n4.1\nRecords of ambulance and personnel are maintained\naccording to local ambulance standard operation procedure.\n4.2\nRecords of supplementary resources are summoned and\nmaintained according to local ambulance standard operation\nprocedure\n\n--- PDF PAGE 45 ---\nTESDA-SOP-QSO-01-F08\nTR-Emergency Medical Services NC II (Amended)\nPromulgated December 2013\n42\nRANGE OF VARIABLES\n\nVARIABLES\nRANGE\n1. Requests\nMay include:\n1.1\nEmergency requests\n1.2\nNon-emergency services such as hospital discharges, hospital\ntransport\n1.3\nSpecial requests\n1.4\nSpecial events\n1.5\nMulti casualty incidents\n2. Prioritizing\nMay include:\n2.1\nNature of request\n2.2\nSource of request\n2.3\nAnalysis of available information\n2.4\nAssessed urgency of request presented by on-site doctor,\nmedical staff or ambulance officer\n2.5\nBased on a sound clinical understanding of the symptoms\npresented\n2.6\nTimeframes set by the Ambulance Service\n3. Ambulance service\nresources\nMay include:\n(based on ambulance classification)\n3.1\nPatient Transport Ambulance\n3.2\nBasic Life Support Ambulance\n3.3\nAdvanced Life Support Ambulance\n4. Resource allocation\nassessed on\nMay include:\n4.1\nLocation of incident/situation\n4.2\nSpecific skill/equipment needs\n4.3\nAvailability of resources e.g. specific skills of available crew\n4.4\nLocal ambulance standard operating procedure\n5. Additional resources\nMay include\n5.1\nAdditional ambulance personnel and/or equipment\n5.2\nOther services (fire, police, rescue)\n5.3\nMedical support\n5.4\nCounseling services\n5.5\nInterpreters\n6. Receiving facilities\nMay include:\n6.1\nHospitals with specialized capability in terms of staff,\nequipment, material.\n6.2\nMakeshift facilities (field hospitals) for disaster\n6.3\nMedical clinics\n6.4\nNursing homes\n\n--- PDF PAGE 46 ---\nTESDA-SOP-QSO-01-F08\nTR-Emergency Medical Services NC II (Amended)\nPromulgated December 2013\n43\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nDealt with a variety of situations with variable factors such as:\n Nature of incident/request\n Extent or severity of incident/request\n Skill/knowledge needs\n Equipment needs\n1.2\nSituations where varying incidents/requests must be assessed\nagainst available resources and skills\n2. Required Knowledge\n2.1\nLocal standard ambulance operation procedure\n2.2\nUse of communications equipment and systems\n2.3\nKnowledge of available resources and their application\n2.4\nKnowledge of other emergency and non-emergency services\nand their function\n3. Required Skills\n3.1\nOral communication skills required to fulfill job roles as\nspecified by the organization/service\n3.2\nWritten communication skills required to fulfill job roles as\nspecified by organization/service\n3.3\nInterpersonal skills required include working with others,\nliaising with personnel from other emergency services, and an\nability to relate to persons from differing cultural, social and\nreligious backgrounds\n3.4\nProblem solving skills required include an ability to use\navailable resources, analyze information and make decisions\nthat ensure the efficient and effective use of resources\n3.5\nPrioritizing ambulance resources when in receipt of multiple\ncalls for service\n4. Resource\nImplications\nThe following resources should be provided:\n4.1\nAccess to appropriate workplace or simulation of realistic\nworkplace setting where assessment can be conducted\n4.2\nAccess to equipment and resources normally used in the\nworkplace\n5. Methods of\nAssessment\nCompetency in this unit must be assessed through:\n5.1\nObservations, questioning and evidence gathered from the\nworkplace environment\n5.2\nDemonstration over a period of time to ensure consistency of\nperformance\n6. Context of\nAssessment\n6.1\nEvidence must include observation of performance in the work\nenvironment or in a simulated work setting\n\n--- PDF PAGE 47 ---\nTESDA-SOP-QSO-01-F08\nTR-Emergency Medical Services NC II (Amended)\nPromulgated December 2013\n44\nUNIT OF COMPETENCY :\n CONTRIBUTE IN COORDINATING EMERGENCY RESOURCES\n\nUNIT CODE\n:\nHCS322320\n\nUNIT DESCRIPTOR\n:\nThis unit of competency involves contributing in coordinating\nservice resources to ensure availability of vehicles, materials,\nequipment and personnel.\n\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Coordinate\nambulance and\npersonnel\nresources\n1.1\nResource allocation is undertaken in accordance with local\nambulance standard operating procedure.\n1.2\nKnown factors that may impact on service demand are\nmonitored at all times.\n1.3\nAmbulance service resources locations and commitments are\nknown at all times.\n2. Liaise with\nambulance\ncommunications\npersonnel\n2.1\nPersonnel are given clear information at all times.\n2.2\nFactors affecting resource availability are communicated to\npersonnel.\n2.3\nFactors affecting resource availability are sought from other\nambulance communications personnel.\n2.4\nInformation is documented according to local ambulance\nstandard operating procedure.\n2.5\n“On scene” communication chain of command is\nimplemented.\n3. Liaise with other\nrelated\norganizations and\nemergency services\n3.1\nThe need for involvement of other service is identified in a\ntimely manner.\n3.2\nOther service involvement is determined in line with the case\nneed.\n3.3\nOther service is contacted, adequately briefed, and\nappropriate assistance requested.\n\nRANGE OF VARIABLES\n\nVARIABLES\nRANGE\n1. Known factors\nMay include:\n1.1\nOrganized events (sporting and social)\n1.2\nDemonstrations\n1.3\nMarches\n1.4\nHolidays and festive occasions\n2. Ambulance service\nresources\nMay include:\n(based on ambulance classification)\n2.1\nPatient Transport Ambulance\n2.2\nBasic Life Support Ambulance\n2.3\nAdvanced Life Support Ambulance\n3. Other emergency\nservices\nMay include:\n3.1\nFire\n3.2\nPolice/Military\n3.3\nVoluntary organizations (e.g. NGOs)\n3.4\nUtilities (e.g. Electrical, Telecommunication, Water Services,\netc.)\n3.5\nCommunity services\n3.6\nLocal government, barangay\n\n--- PDF PAGE 48 ---\nTESDA-SOP-QSO-01-F08\nTR-Emergency Medical Services NC II (Amended)\nPromulgated December 2013\n45\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nDealt with a variety of situations/incidents, including:\n Urgent\n Non-urgent\n Routine\n Special\n1.2\nEvidence must include:\n Incidents when the involvement of other related\nemergency and non-emergency services 