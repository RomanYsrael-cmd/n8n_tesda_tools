ace setting where assessment can be conducted 4.2 Access to equipment and resources normally used in the workplace 5. Methods of Assessment Competency in this unit must be assessed through: 5.1 Observation with questioning 5.2 Oral questioning/Interview 5.2 Evidence gathered from the workplace environment 5.3 Demonstration over a period of time to ensure consistency of performance 6. Context of Assessment 6.1 Evidence must include observation of performance in the work environment or in a simulated work setting"
