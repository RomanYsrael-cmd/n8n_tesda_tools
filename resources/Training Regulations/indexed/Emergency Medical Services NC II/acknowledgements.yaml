rdinator 5.3 Quality Improvement Coordinator 5.4 Infection Control Committee 5.5 Occupational Safety and Health Committee 6. Aggregate infection control information May include: 6.1 Records of needle stick injuries 6.2 Hospital-acquired infection rates 6.3 DOH healthcare standards clinical indicators 6.4 HACCP records 6.5 Hazard reports"
