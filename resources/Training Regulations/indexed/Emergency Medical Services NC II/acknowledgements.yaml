      "source_text": "-- PDF PAGE 88 --- TR-Emergency Medical Services NC II (Amended) Promulgated December 2013 85 3.5 TRAINING FACILITIES"
    },
    {
      "source_text": "A. The EMERGENCYMEDICAL SERVICES NC II Learning Facility must be of concrete structure. Based on class size of 20 students / trainees, the space requirements for the teaching / learning and curriculum areas are as follows."
    },
    {
      "source_text": "TEACHING / LEARNING AREAS SIZE IN METERS AREA IN S. METERS QTY. TOTAL AREA IN SQ. METERS Laboratory Area 5 X 10 50 1 50 Tool Room 2 X 5 10 1 10 Storage Room/ 4X5 20 1 20 Learning Resources Area 5 X 7 35 1 35 Wash Area/Comfort Room (male & female) 2.5 X 4 10 1 10 Admin and Staff Room 5 X 5 25 1 25 Circulation Area 1 30 Total Workshop Area 180"
    },
    {
      "source_text": "B. Affiliation to agencies with medical ambulance is preferred. C. Identified or Specified Area for Practice Ambulance Driving"
    },
    {
      "source_text": "3.6 TRAINER QUALIFICATION (TQ II)"
    },
    {
      "source_text": " Must be a holder of NTTC Level I in Emergency Medical Services NC II  Equivalent training/experience or accredited by any of the following: Department of Health, Philippine College of Emergency Medicine, Philippine Society of Emergency Care Nurses, Philippine Society of Emergency Medical Technician, Philippine Red Cross, Bureau of Fire and Protection -EMS and Emergency Response Unit Foundation (ERUF) or  With at least 2 years experience in the emergency health care service (pre-hospital care)  Must be physically, emotionally and mentally fit as certified by a Licensed Philippine Physician  Must not have any criminal record"
    },
    {
      "source_text": "3.7 INSTITUTIONAL ASSESSMENT"
    },
    {
      "source_text": "Institutional assessment is undertaken by trainees to determine their achievement of units of competency. A certificate of achievement may be issued for each unit of competency."
    },
    {
      "source_text": "It is recommended that a comprehensive written examination covering the basic, common and core competencies be administered at the end of training. Also, the trainees must pass the practical assessment and ambulance driving assessment."
    },
    {
      "source_text": "-- PDF PAGE 89 --- TR-Emergency Medical Services NC II (Amended) Promulgated December 2013 86 SECTION 4 – NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS"
    },
    {
      "source_text": "4.1 To attain the National Qualification of EMERGENCY MEDICAL SERVICES NC II, the candidate must demonstrate competence through project-type assessment covering all units listed in Section 1. Successful candidates shall be awarded a National Certificate signed by the TESDA Director General."
    },
    {
      "source_text": "4.2 Assessment shall focus on the units of competency. The basic and common units shall be integrated or assessed concurrently with the core units."
    },
    {
      "source_text": "4.3 The following are qualified to apply for assessment and certification:"
    },
    {
      "source_text": "4.3.1 Graduates of formal, non-formal and informal including enterprise-based training programs. 4.3.2 Experienced workers (wage employed or self-employed)."
    },
    {
      "source_text": "4.4 Reassessment is allowed only after one month from the date of assessment. Reassessment for a National Certificate shall be done only on the task/s that the candidate did not successfully achieve."
    },
    {
      "source_text": "4.5 A candidate who fails the assessment for two (2) consecutive times will be required to go through a refresher course before taking another assessment."
    },
    {
      "source_text": "4.6 Only certified individuals in this Qualification may be nominated by the industry sector for accreditation as competency assessor."
    },
    {
      "source_text": "4.7 Only accredited competency assessors are allowed to conduct competency assessment, however trainers who are accredited competency assessors are not allowed to assess their trainees."
    },
    {
      "source_text": "4.8 Assessment of competence must be undertaken only in the TESDA accredited assessment center. The performance assessment (demonstration of competence), however, may be done in any venue or workplace duly designated by an accredited assessment center."
    },
    {
      "source_text": "4.9 The guidelines on assessment and certification are discussed in detail in the Procedures Manual on Assessment and Certification."
    },
    {
