 Service policy and procedures in accordance with the national code. 4.2 Patient is given appropriate support/assistance during loading/unloading. 4.3 Appropriate personnel are transported to accompany the patient where such a need has been identified and there is a capacity to do so, in accordance with local standard operating procedure. 4.4 Equipment and belongings are secured appropriately to avoid movement during travel. 4.5 Must be familiar with the use of carry chairs 5. Drive vehicle 5.1 Ambulance is driven in a reduced risk manner and according to legal requirements. 5.2 Appropriate route is chosen according to distance, time constraints, travel and terrain. 5.3 Communication is established between driver and patient or patient care officer to ensure effective patient care during transport. 5.4 Map is consulted accurately, when necessary. 6. Transport patient's relatives or other specific personnel 6.1 Personnel are transported to accompany the patient where such a need has been identified and there is a capacity to do so, in accordance with local standard operating procedure. 6.2 Safety of the personnel, the patient and the patient’s relatives in the ambulance is considered during transport."
