ssessment Competency in this unit must be assessed through: 5.1 Observation with questioning 5.2 Interview 5.3 Portfolio 5.4 Demonstration with questioning 6. Context of Assessment 6.1 Assessment may be done in the workplace or in a simulated workplace setting."
