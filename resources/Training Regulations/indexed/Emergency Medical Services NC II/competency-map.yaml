  "source_text": "COMPETENCY MAP – HEALTH SECTOR (EMS NC II)\nBASIC COMPETENCIES\n\nReceive and respond to\nworkplace communication\nWork with others\nDemonstrate work\nvalues\nParticipate in\nworkplace\ncommunication\nWork in a team\nenvironment\nPractice career\nprofessionalism\nPractice occupational\nhealth and safety\nprocedures\nPractice housekeeping\nprocedures (5S)\nLead workplace\ncommunication\nLead small team\nDevelop and practice\nnegotiation skills\nSolve problems related\nto work activities\nUse mathematical\nconcepts and\ntechniques\nUse relevant\ntechnologies\nUtilize specialized\ncommunication skills\nDevelop team and\nindividual\nApply problem solving\ntechniques in the\nworkplace\nCollect, analyze and\norganize information\nPlan and organize work\nPromote environmental\nprotection\n\nCOMMON COMPETENCIES\n\nImplement and monitor\ninfection control policies\nand procedures\nRespond effectively to\ndifficult/challenging\nbehavior\nApply basic first aid\nMaintain high standard\nof patient services\n\nCORE COMPETENCIES\n\nProvide care and support to\ninfants and toddlers\nProvide care and support\nto children\nFoster social, intellectual,\ncreative and emotional\ndevelopment of children\nFoster the physical\ndevelopment of\nchildren\nProvide care and\nsupport to elderly\nProvide care and\nsupport to people with\nspecial needs\nMaintain a healthy and\nsafe environment\nRespond to emergency\nClean living room, dining\nroom, bedrooms, toilet\nand bathroom\nWash and iron clothes,\nlinen and fabric\nPrepare hot and cold\nmeals/food\nPrepare and maintain\nbeds\nCollect and maintain\nlinen stocks at end-\nusers location\nAssist in patient\nmobility\nAssist in transporting\npatients\nAssist in bio-psychosocial\nsupport care of patients\nHandle waste in a health\ncare environment\nInstall biomedical\nequipment\nPerform corrective\nmaintenance on\nbiomedical equipment\nPerform preventive\nmaintenance on\nbiomedical equipment\nRepair biomedical\nequipment\nAssess and refer biomedical\nequipment\nPerform\nCardiopulmonary\nResuscitation with AED\nOperation\nMaintain life support\nequipment and resources\nImplement safe\naccess and extrication\nprocedures in an\nemergency\nContribute in receiving\nrequest for ambulance\nservice\nContribute in allocating\nambulance service\nresources\nContribute in\ncoordinating\nemergency resources\nDeliver basic ambulance\ncommunication skills\nContribute in on-road\noperations\nContribute to emergency\nscene management\nContribute to special\nevent scene\nmanagement\nContribute to routine\nscene management\nDeliver pre-hospital\npatient care\nDeliver intensive pre-\nhospital patient care\n Contribute to ambulance\noperations management\nTransport emergency\npatients\nTransport non-\nemergency patients\nDrive ambulance\nunder operational\nconditions\nWork within a holistic\ntherapeutic massage\nframework\nPerform therapeutic\nmassage assessment\nPlan the therapeutic\nmassage treatment\nImplement therapeutic\nmassage treatment\nPerform remedial\ntherapeutic massage\ntreatment\nWork within a community\ndevelopment framework\nPrepare for work in the\ncommunity service\nindustry\nSupport community\nresources\nProvide\nprimary/residential care\nSupport community\nparticipation\nRecruit and coordinate\nvolunteers\nRespond holistically to\nclient issues\nDevelop and provide\nhealth education program\nin the community\nImplement health\npromotion and\ncommunity\ninterventions\n\n--- PDF PAGE 91 ---\nTR-Emergency Medical Services NC II (Amended)\nPromulgated December 2013\n88",
