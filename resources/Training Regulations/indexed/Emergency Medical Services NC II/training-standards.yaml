  "source_section_text": "SECTION 3 TRAINING STANDARDS\n\nThis set of standards provides Technical and Vocational Education and Training (TVET)\nproviders with information and other important requirements to consider when designing training\nprograms for EMERGENCY MEDICAL SERVICES NC II\n\nThis includes information on curriculum design, training delivery, trainee entry requirements,\ntools and equipment, training facilities, trainer’s qualification and institutional assessment.\n\n3.1 CURRICULUM DESIGN\n\nCourse Title: EMERGENCY MEDICAL SERVICES\nNC Level: NC II\n\nSuggested Nominal Training Hours: 280 HOURS\n\nCourse Description:\n\nThis course is designed to enhance the knowledge, skills and attitude of EMERGENCY\nMEDICAL SERVICES NC II in accordance with industry standards. This course covers the basic,\ncommon and core competencies in perform basic life support, maintain life support equipment and\nresources, implement safe access and extrication procedures in an emergency, contribute in\nreceiving request for ambulance service, contribute in allocating ambulance service resources,\ncontribute in coordinating emergency resources, deliver basic ambulance communication skills,\ncontribute in on – road operations, contribute in emergency scene management, contribute in a\nspecial event scene management, contribute in routine scene management, deliver pre- hospital\npatient care, contribute in ambulance operations management, transport emergency patients and\ntransport non- emergency patients and drive ambulance under operational condition.\n\nTo obtain this, all units prescribed for this qualification must be achieved.\n\n*The suggested training hour is to be used as a guide only. Competency-based education\nand training is not based on time or length of training contacts.\n\nBASIC COMPETENCIES\n\nUNIT OF\nCOMPETENCY\nLEARNING OUTCOMES\nMETHODOLOGY\nASSESSMENT\nAPPROACH\n1. Participate in\nworkplace\ncommunication\n1.1\nObtain and convey\nworkplace information\n1.2