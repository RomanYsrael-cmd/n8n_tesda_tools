ents\n4.3\nAct in a respectful manner\nat all times\n4.4\nEvaluate own work to\nmaintain a high standard of\npatient service\n Lecturette\n Brainstorming\n Observation and\noral questioning\n Grid question\n Practical exercise\n\n--- PDF PAGE 83 ---\nTR-Emergency Medical Services NC II (Amended)\nPromulgated December 2013\n80\nCORE COMPETENCIES\n\nUNIT OF\nCOMPETENCY\nLEARNING OUTCOME\nMETHODOLOGY\nASSESSMENT\nAPPROACH\n1. Perform Cardio\npulmonary\nResuscitation\nwith AED\nOperation\n1.1\nAssess the situation\n1.2\nManage the casualty/ties\n1.3\nManage ambulance and\npersonnel resources\n1.4\nCommunicate essential\nincident details\n1.5 Manage casualty in a\nremote and/ or isolated\narea\n1.7\nEvaluate the incident\nLecture/ demo\n Questioning\n Simulation\n On-the- Job\nPractice\nObservation\n Demonstration\n Third Party\nReport\n2. Maintain life\nsupport\nequipment and\nresources\n2.1\nMaintain resources\n2.2\nManage records\nLecture/ demo\n Questioning\n Simulation\n On-the- Job\nPractice\nObservation\n Demonstration\n Third Party\n Report\n3. Implement safe\naccess and\nextrication\nprocedures in\nan emergency\n3.1\nAssess emergency\nsituation in relation to safe\naccess and extrication\n3.2\nImplement procedure to\nenable safe access and\nextrication\n3.3\nMonitor access and\nextrication procedure in an\nemergency situation\nLecture/ demo\n Questioning\n Simulation\n On-the- Job\nPractice\n\nObservation/\nquestioning\n Demonstration\n Third Party\n Report\n4.\nContribute in\nreceiving\nrequest for\nambulance\nservice\n4.1\nReceive request for service\n4.2\nRespond to request for\nservice\n4.3\nRefer request\n4.4\nFinalize request\nLecture/ demo\n Questioning\n Simulation\n On-the- Job\nPractice\nObservation/\nquestioning\n Demonstration\n Third Party\n Report\n5. Contribute in\nallocating\nambulance\nservice\nresources\n5.1\nAllocate ambulance service\nresources\n5.2\nDispatch ambulance\nservice resources\n5.3\nMonitor progress of\nassigned personnel\n5.4\nMaintain records of\nambulance service\ncoordination activity\nLecture/ demo\n Questioning\n Simulation\n On-the- Job\nPractice\n\nObservation/\nquestioning\n Demonstration\n Third Party\n Report\n6.\nContribute in\ncoordinating\nemergency\nresources\n6.1\nCoordinate vehicle and\npersonnel resources\n6.2\nLiaise with ambulance\ncommunications personnel\n6.3\nLiaise with other related\norganizations and\nemergency services\nLecture/ demo\n Questioning\n\n Simulation\n On-the- Job\nPractice\nObservation/\nquestioning\n Demonstration\n Third Party\n Report\n\n--- PDF PAGE 84 ---\nTR-Emergency Medical Services NC II (Amended)\nPromulgated December 2013\n81\nUNIT OF\nCOMPETENCY\nLEARNING OUTCOME\nMETHODOLOGY\nASSESSMENT\nAPPROACH\n7. Deliver basic\nambulance\ncommunication\nskills\n7.1\nExercise effective\ncommunication techniques\n7.2\nConvey and receive\ninformation using available\nmodes of communication\n7.3\nFollow routine instructions\n7.4\nCommunicate with patients\n7.5\nComplete reports as\nrequired\n7.6\nPresent a positive image of\nthe service to the public\nLecture/ demo\n Questioning\n Simulation\n On-the- Job\nPractice\n\nObservation/\nquestioning\n Demonstration\n Third Party\n Report\n8. Contribute in\non-road\noperations\n8.1\nRelay communication\n8.2\nOversee ambulance and\nequipment preparation,\ncleaning and checking\n8.3\n Contribute in the transport\nof patients\n8.4\nContribute in scene\nmanagement\nLecture/ demo\n Questioning\n Simulation\n On-the- Job\nPractice\n\nObservation/\nquestioning\n Demonstration\n Third Party\n Report\n9. Contribute to\nemergency\nscene\nmanagement\n9.1\nAssess the environment to\nidentify real and potential\nhazards\n9.2\nCommunicate with those\ninvolved in the incident\n9.3\nControl hazards/scene\nsafety\n9.4\nCommunicate with medical\nand other emergency and\nallied services with EMT’s\nsupervision\n9.5\nMonitor the environment\nLecture/ demo\n Questioning\n Simulation\n On-the- Job\nPractice\nObservation/\nquestioning\n Demonstration\n Third Party\n Report\n10.Contribute to\nspecial event\nscene\nmanagement\n10.1 Handle a mass gathering\nevents\n10.2 Ensure safety at the scene\nLecture/ demo\n Questioning\n Simulation\n On-the- Job\nPractice\nObservation/\nquestioning\n Demonstration\n Third Party\n Report\n11.Contribute to\nroutine scene\nmanagement\n11.1\nHandle non-emergency\nscene\n11.2 Ensure safety at the scene\nLecture/ demo\n Questioning\n Simulation\n On-the- Job\nPractice\nObservation/\nquestioning\n Demonstration\n Third Party\n Report\n12.Deliver pre-\nhospital patient\ncare\n12.1 Contribute in making initial\npatient assessment\n12.2 Contribute in implementing\npatient care procedures\n12.3 Contribute in monitoring\nbasic patient care and\nmodify as required\n12.4 Endorse patients requiring\nemergency basic care\nLecture/ demo\n Questioning\n Simulation\n On-the- Job\nPractice\nObservation/\nquestioning\n Demonstration\n Third Party\n Report\n\n--- PDF PAGE 85 ---\nTR-Emergency Medical Services NC II (Amended)\nPromulgated December 2013\n82\nUNIT OF\nCOMPETENCY\nLEARNING OUTCOME\nMETHODOLOGY\nASSESSMENT\nAPPROACH\n13.Contribute to\nambulance\noperations\nmanagement\n\n13.1 Maintain operations to\nmeet quality standards\n13.2 Create and maintain\nconditions productive work\nand quality service\n13.3 Monitor and control the use\nof resources\nLecture\n Questioning\n On-the- Job\nPractice\n Demonstration\nObservation\n Demonstration\n Third Party\nReport\n Return\nDemonstration\n14.Transport\nemergency\npatients\n14.1 Convey and receive\ninformation\n14.2 Transport patient under\nemergency conditions\n14.3 Load, unload and secure\npatient and equipment for\nemergency transport\nLecture/ demo\n Questioning\n Simulation\n On-the- Job\nPractice\nObservation/\nquestioning\n Demonstration\n Third Party\n Report\n15.Transport non-\nemergency\npatients\n15.1 Prepare and check vehicle\nand equipment\n15.2 Ensure faults in vehicle\nand equipment are\nremedied\n15.3 Convey and receive\ninformation\n15.4 Load, unload and secure\nnon- emergency patient\nand other specific\npersonnel for\ntransportation\n15.5 Drive vehicle\n15.6 Transport patient’s\nrelatives or other specific\npersonnel\nLecture/ demo\n Questioning\n Simulation\n On-the- Job\nPractice\nObservation/\nquestioning\n Demonstration\n Third Party\n Report\n16.Drive\nambulance\nunder\noperational\nconditions\n16.1 Prepare ambulance for\noperational response\n16.2 Drive vehicle\n16.3 Monitor traffic, road and\nterrain under operational\nconditions\nLecture/ demo\n Questioning\n Simulation\n On-the- Job\nPractice\nObservation/\nquestioning\n Demonstration\n Third Party\n Report\n\n--- PDF PAGE 86 ---\nTR-Emergency Medical Services NC II (Amended)\nPromulgated December 2013\n83",
