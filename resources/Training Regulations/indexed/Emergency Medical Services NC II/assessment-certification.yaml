  "arrangements": [
    {
      "number": "4.1",
      "text": "To attain the National Qualification of EMERGENCY MEDICAL SERVICES NC II, the candidate must demonstrate competence through project-type assessment covering all units listed in Section 1. Successful candidates shall be awarded a National Certificate signed by the TESDA Director General."
    },
    {
      "number": "4.2",
      "text": "Assessment shall focus on the units of competency. The basic and common units shall be integrated or assessed concurrently with the core units."
    },
    {
      "number": "4.3",
      "text": "The following are qualified to apply for assessment and certification: 4.3.1 Graduates of formal, non-formal and informal including enterprise-based training programs. 4.3.2 Experienced workers (wage employed or self-employed)."
    },
    {
      "number": "4.4",
      "text": "Reassessment is allowed only after one month from the date of assessment. Reassessment for a National Certificate shall be done only on the task/s that the candidate did not successfully achieve."
    },
    {
      "number": "4.5",
      "text": "A candidate who fails the assessment for two (2) consecutive times will be required to go through a refresher course before taking another assessment."
    },
    {
      "number": "4.6",
      "text": "Only certified individuals in this Qualification may be nominated by the industry sector for accreditation as competency assessor."
    },
    {
      "number": "4.7",
      "text": "Only accredited competency assessors are allowed to conduct competency assessment, however trainers who are accredited competency assessors are not allowed to assess their trainees."
    },
    {
