  "source_text": "SECTION 4 – NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1\nTo attain the National Qualification of EMERGENCY MEDICAL SERVICES NC II, the\ncandidate must demonstrate competence through project-type assessment covering all\nunits listed in Section 1. Successful candidates shall be awarded a National Certificate\nsigned by the TESDA Director General.\n\n4.2\nAssessment shall focus on the units of competency. The basic and common units shall be\nintegrated or assessed concurrently with the core units.\n\n4.3\nThe following are qualified to apply for assessment and certification:\n\n4.3.1 Graduates of formal, non-formal and informal including enterprise-based training\nprograms.\n4.3.2 Experienced workers (wage employed or self-employed).\n\n4.4\nReassessment is allowed only after one month from the date of assessment.\nReassessment for a National Certificate shall be done only on the task/s that the candidate\ndid not successfully achieve.\n\n4.5\nA candidate who fails the assessment for two (2) consecutive times will be required to go\nthrough a refresher course before taking another assessment.\n\n4.6\nOnly certified individuals in this Qualification may be nominated by the industry sector for\naccreditation as competency assessor.\n\n4.7\nOnly accredited competency assessors are allowed to conduct competency assessment,\nhowever trainers who are accredited competency assessors are not allowed to assess their\ntrainees.\n\n4.8\nAssessment of competence must be undertaken only in the TESDA accredited assessment\ncenter. The performance assessment (demonstration of competence), however, may be\ndone in any venue or workplace duly designated by an accredited assessment center.\n\n4.9\nThe guidelines on assessment and certification are discussed in detail in the Procedures\nManual on Assessment and Certification.\n\n--- PDF PAGE 90 ---\nTR-Emergency Medical Services NC II (Amended)\nPromulgated December 2013\n87\n"
}
