  "source_text": "SECTION 4 – NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1\nTo attain the National Qualification of EMERGENCY MEDICAL SERVICES NC II, the\ncandidate must demonstrate competence through project-type assessment covering all\nunits listed in Section 1. Successful candidates shall be awarded a National Certificate\nsigned by the TESDA Director General.\n\n4.2\nAssessment shall focus on the units of competency. The basic and common units shall be\nintegrated or assessed concurrently with the core units.\n\n4.3\nThe following are qualified to apply for assessment and certification:\n\n4.3.1 Graduates of formal, non-formal and informal including enterprise-based training\nprograms.\n4.3.2 Experienced workers (wage employed or self-employed).\n\n4.4\nReassessment is allowed only after one month from the date of assessment.\nReassessment for a National Certificate shall be done only on the task/s that the candidate\ndid not successfully achieve.\n\n4.5\nA candidate who fails the assessment for two (2) consecutive times will be required to go\nthrough a refresher course before taking another assessment.\n\n4.6\nOnly certified individuals in this Qualification may be nominated by the industry sector for\naccreditation as competency assessor.\n\n4.7\nOnly accredited competency assessors are allowed to conduct competency assessment,\nhowever trainers who are accredited competency assessors are not allowed to assess their\ntrainees.\n\n4.8\nAssessment of competence must be undertaken only in the TESDA accredited assessment\ncenter. The performance assessment (demonstration of competence), however, may be\ndone in any venue or workplace duly designated by an accredited assessment center.\n\n4.9\nThe guidelines on assessment and certification are discussed in detail in the Procedures\nManual on Assessment and Certification.\n\n--- PDF PAGE 90 ---\nTR-Emergency Medical Services NC II (Amended)\nPromulgated December 2013\n87\nCOMPETENCY MAP – HEALTH SECTOR (EMS NC II)\nBASIC COMPETENCIES\n\nReceive and respond to\nworkplace communication\nWork with others\nDemonstrate work\nvalues\nParticipate in\nworkplace\ncommunication\nWork in a team\nenvironment\nPractice career\nprofessionalism\nPractice occupational\nhealth and safety\nprocedures\nPractice housekeeping\nprocedures (5S)\nLead workplace\ncommunication\nLead small team\nDevelop and practice\nnegotiation skills\nSolve problems related\nto work activities\nUse mathematical\nconcepts and\ntechniques\nUse relevant\ntechnologies\nUtilize specialized\ncommunication skills\nDevelop team and\nindividual\nApply problem solving\ntechniques in the\nworkplace\nCollect, analyze and\norganize information\nPlan and organize work\nPromote environmental\nprotection\n\nCOMMON COMPETENCIES\n\nImplement and monitor\ninfection control policies\nand procedures\nRespond effectively to\ndifficult/challenging\nbehavior\nApply basic first aid\nMaintain high standard\nof patient services\n\nCORE COMPETENCIES\n\nProvide care and support to\ninfants and toddlers\nProvide care and support\nto children\nFoster social, intellectual,\ncreative and emotional\ndevelopment of children\nFoster the physical\ndevelopment of\nchildren\nProvide care and\nsupport to elderly\nProvide care and\nsupport to people with\nspecial needs\nMaintain a healthy and\nsafe environment\nRespond to emergency\nClean living room, dining\nroom, bedrooms, toilet\nand bathroom\nWash and iron clothes,\nlinen and fabric\nPrepare hot and cold\nmeals/food\nPrepare and maintain\nbeds\nCollect and maintain\nlinen stocks at end-\nusers location\nAssist in patient\nmobility\nAssist in transporting\npatients\nAssist in bio-psychosocial\nsupport care of patients\nHandle waste in a health\ncare environment\nInstall biomedical\nequipment\nPerform corrective\nmaintenance on\nbiomedical equipment\nPerform preventive\nmaintenance on\nbiomedical equipment\nRepair biomedical\nequipment\nAssess and refer biomedical\nequipment\nPerform\nCardiopulmonary\nResuscitation with AED\nOperation\nMaintain life support\nequipment and resources\nImplement safe\naccess and extrication\nprocedures in an\nemergency\nContribute in receiving\nrequest for ambulance\nservice\nContribute in allocating\nambulance service\nresources\nContribute in\ncoordinating\nemergency resources\nDeliver basic ambulance\ncommunication skills\nContribute in on-road\noperations\nContribute to emergency\nscene management\nContribute to special\nevent scene\nmanagement\nContribute to routine\nscene management\nDeliver pre-hospital\npatient care\nDeliver intensive pre-\nhospital patient care\n Contribute to ambulance\noperations management\nTransport emergency\npatients\nTransport non-\nemergency patients\nDrive ambulance\nunder operational\nconditions\nWork within a holistic\ntherapeutic massage\nframework\nPerform therapeutic\nmassage assessment\nPlan the therapeutic\nmassage treatment\nImplement therapeutic\nmassage treatment\nPerform remedial\ntherapeutic massage\ntreatment\nWork within a community\ndevelopment framework\nPrepare for work in the\ncommunity service\nindustry\nSupport community\nresources\nProvide\nprimary/residential care\nSupport community\nparticipation\nRecruit and coordinate\nvolunteers\nRespond holistically to\nclient issues\nDevelop and provide\nhealth education program\nin the community\nImplement health\npromotion and\ncommunity\ninterventions\n\n--- PDF PAGE 91 ---\nTR-Emergency Medical Services NC II (Amended)\nPromulgated December 2013\n88\nDEFINITION OF TERMS\n1)\nAspiration – the entry of secretions or foreign material into the trachea and lungs\n2)\nAssault – refers to a violent physical or verbal attack\n3)\nBag Valve Mask with reservoir – refers to a supplemental oxygen device used to provide\npositive pressure ventilation to patients who are not breathing or not breathing adequately.\n4)\nBody Mechanics – refers to using the body in an efficient and careful way\n5)\nChair Lifts – power-driven chair assembly used to transport patients\n6)\nCardiopulmonary Resuscitation (CPR)- refers to good quality of external chest\ncompression and adequate rescue breaths\n7)\nChoking – refers to a person having difficulty in breathing due to foreign body airway\nobstruction\n8)\nCapnography (End Tidal CO2) - a device measures the exhaled carbon dioxide level.\n9)\nFirst Aid Kit – emergency tools used to administer immediate treatment to injured person.\n10) Hazardous Waste – refers to items contaminated with blood, body fluids, or body\nsubstances that maybe harmful to others\n11) Pulse Oximeter – a device measures the percentage of oxygen in the hemoglobin\n12) Pressure or Elastic Bandage – refers to a piece of material used to cover a wound and\n Immobilize a part of the body or restrict the movement\n13) Sling – refers to a material or a piece of cloth used to support the upper extremities\n14) Splint – refers to a hard plastic or piece of wood used to immobilize a limb in the case of\nfractures or deformity.\n15) Stressors – refers to an agent or factor that produces stress\n16) Scoop Stretchers – refers to a device used in transferring patients in a lying position.\n17) Suffocation – refers to suppression of one’s breathing due to lack of oxygen\n18) Suicide – refers to the act of intentionally killing or injuring oneself\n19) Thermal Blanket – refers to a material used to decrease the body temperature or keep the\npatient warm\n20) Triangular Bandage- refers to a tool used to hold the dressing in place and to immobilize an\ninjured body part\n21) Trolley cot – refers to a rolling device used to transport patient.\n22) Walking frames – refers to a assistive device used to support body weight for patients with\ndifficulty in walking\n23) Wheel Chair - refers to a device used to transport patient from one place to another in a\nsitting position\n24) AED (Automated External Defibrillator) – a machine that analyzes and delivers electrical\ntreatment.\n25) GPS- Global Positioning System\n26) LOC- Level of consciousness\n27) OSHA – Occupational Safety and Health Act\n28) PPE – personal protective equipment\n29) SPO2- saturation of peripheral oxygen\n30) HEPA (High Efficient Particulate Air Respirator Mask) – special personal protective\nequipment for airborne diseases\n\n--- PDF PAGE 92 ---\nACKNOWLEDGMENT\n\nThe Technical Education and Skills Development Authority (TESDA) wishes to extend thanks and\nappreciation to the many representatives of business, industry, academe and government agencies, non-\ngovernment organizations including professional associations who donated their time and expertise to the\ndevelopment and validation of this Training Regulations.\n Health Care Industry Training Council, Inc.\n•\nDr. Irineo Bernardo, III\nChair\n•\nDr. Juan Ma. Pablo R. Nañagas, MPH, MNSA\nBoard Member\n•\nGloria G. Almariego, RN, MAN\nSecretary\n•\nEvangeline E. Rafael, RN, MPA, MHA, DECD\nTreasurer\n\n•\nMrs. Ellen P. Yu, RN, MAN\nVice-Chair\n•\nMa. Rita V. Tamse, RN, MAN\nBoard Member\n•\nDr. Kenneth Vincent Ronquillo, MPHM\nBoard Member\n\nReview Committee\n•\nDr. Jorge M. Concepcion\nChair-Department of Emergency Medicine of UP-PGH\n•\nPaul Steven Veloso\nDEM, Philippine General Hospital\n•\nCloyd Santiago\nDEM, Philippine General Hospital\n•\nJose Luis Domingo\nRepresentative, Emergency Response Center\n•\nElena P. Yu\nHCITC\n•\nEvangeline E. Rafael, RN\nHCITC\n•\nGloria G. Almariego, RN\nHCITC\n•\nMa. Rita V. Tamse, RN\nHCITC\n•\nCaridad A. Ulanday\nDepartment of Health\n•\nJacqkeline B. Acosta\nDepartment of Health\n•\nFlorinda V. Panlilio\nDepartment of Health\n\n•\nDr.Carlos Primero D. Gundran\nCoordinator for Hospital Disaster Management\nand EMS Philippine General Hospital and\nPhilippine College of Emergency Medicine\n•\nRobert Emer S. Bautista\nEMT- B, Philippine General Hospital\n•\nChristian B. Reyes\nEMT- B, Philippine General Hospital\n•\nRomeu N. Baluyot\nEMS, Philippine General Hospital\n•\nPaul M. Daquiz\nEMT- B, Philippine General Hospital\n•\nMichelle S. Catacutan\nEMT- B, Philippine General Hospital\n•\nManuel Lorenzo D.R. Bulatao\nEMT-B, Philippine General Hospital\n•\nElmer B. Collong\nHEMS, Philippine Heart Center\n•\nSusana Juangco\nHEMS, Department of Health\n\nValidation Committee\n\n•\nTeodoro J. Herbosa, MD, FPCS\n\nUSec DOH\n•\nElis Santiago V. Maghirang, MD, FPCEM\n\nPresident, PCEM\n•\nApril B. Llaneta, MD, FPCEM\n\nVice-President, PCEM\n•\nAidan Tasker-Lynch, REMT-P\n\nExecutive Director, PSEMT\n\nChair, Education- Asian EMS Council\n•\nJoan Z. Tasker-Lynch, RN, RGN,\nREMT-P, MAN(UP Candidate)\n\nTraining Director, LSTI\n\n•\nJuan Francisco G. Beltran III, MD\n\nEMS Coordinator, Ospital ng Makati\n•\nJohn Edmund Lei, MD\n\nResident, Ospital ng Makati\n•\nDick James De Guzman, MD\n\nSeagull Rescue\n•\nRommel Lozada\n\nPhilippine Red Cross\n•\nBernabe Bacani\n\nPhilippine Red Cross"
