      "term": "DEFINITION OF TERMS",
      "definition": "1) Aspiration – the entry of secretions or foreign material into the trachea and lungs 2) Assault – refers to a violent physical or verbal attack 3) Bag Valve Mask with reservoir – refers to a supplemental oxygen device used to provide positive pressure ventilation to patients who are not breathing or not breathing adequately. 4) Body Mechanics – refers to using the body in an efficient and careful way 5) Chair Lifts – power-driven chair assembly used to transport patients 6) Cardiopulmonary Resuscitation (CPR)- refers to good quality of external chest compression and adequate rescue breaths 7) Choking – refers to a person having difficulty in breathing due to foreign body airway obstruction 8) Capnography (End Tidal CO2) - a device measures the exhaled carbon dioxide level. 9) First Aid Kit – emergency tools used to administer immediate treatment to injured person. 10) Hazardous Waste – refers to items contaminated with blood, body fluids, or body substances that maybe harmful to others 11) Pulse Oximeter – a device measures the percentage of oxygen in the hemoglobin 12) Pressure or Elastic Bandage – refers to a piece of material used to cover a wound and Immobilize a part of the body or restrict the movement 13) Sling – refers to a material or a piece of cloth used to support the upper extremities 14) Splint – refers to a hard plastic or piece of wood used to immobilize a limb in the case of fractures or deformity. 15) Stressors – refers to an agent or factor that produces stress 16) Scoop Stretchers – refers to a device used in transferring patients in a lying position. 17) Suffocation – refers to suppression of one’s breathing due to lack of oxygen 18) Suicide – refers to the act of intentionally killing or injuring oneself 19) Thermal Blanket – refers to a material used to decrease the body temperature or keep the patient warm 20) Triangular Bandage- refers to a tool used to hold the dressing in place and to immobilize an injured body part 21) Trolley cot – refers to a rolling device used to transport patient. 22) Walking frames – refers to a assistive device used to support body weight for patients with difficulty in walking 23) Wheel Chair - refers to a device used to transport patient from one place to another in a sitting position 24) AED (Automated External Defibrillator) – a machine that analyzes and delivers electrical treatment. 25) GPS- Global Positioning System 26) LOC- Level of consciousness 27) OSHA – Occupational Safety and Health Act 28) PPE – personal protective equipment 29) SPO2- saturation of peripheral oxygen 30) HEPA (High Efficient Particulate Air Respirator Mask) – special personal protective equipment for airborne diseases"
