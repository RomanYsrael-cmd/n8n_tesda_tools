  "source_text": "DEFINITION OF TERMS\n1)\nAspiration – the entry of secretions or foreign material into the trachea and lungs\n2)\nAssault – refers to a violent physical or verbal attack\n3)\nBag Valve Mask with reservoir – refers to a supplemental oxygen device used to provide\npositive pressure ventilation to patients who are not breathing or not breathing adequately.\n4)\nBody Mechanics – refers to using the body in an efficient and careful way\n5)\nChair Lifts – power-driven chair assembly used to transport patients\n6)\nCardiopulmonary Resuscitation (CPR)- refers to good quality of external chest\ncompression and adequate rescue breaths\n7)\nChoking – refers to a person having difficulty in breathing due to foreign body airway\nobstruction\n8)\nCapnography (End Tidal CO2) - a device measures the exhaled carbon dioxide level.\n9)\nFirst Aid Kit – emergency tools used to administer immediate treatment to injured person.\n10) Hazardous Waste – refers to items contaminated with blood, body fluids, or body\nsubstances that maybe harmful to others\n11) Pulse Oximeter – a device measures the percentage of oxygen in the hemoglobin\n12) Pressure or Elastic Bandage – refers to a piece of material used to cover a wound and\n Immobilize a part of the body or restrict the movement\n13) Sling – refers to a material or a piece of cloth used to support the upper extremities\n14) Splint – refers to a hard plastic or piece of wood used to immobilize a limb in the case of\nfractures or deformity.\n15) Stressors – refers to an agent or factor that produces stress\n16) Scoop Stretchers – refers to a device used in transferring patients in a lying position.\n17) Suffocation – refers to suppression of one’s breathing due to lack of oxygen\n18) Suicide – refers to the act of intentionally killing or injuring oneself\n19) Thermal Blanket – refers to a material used to decrease the body temperature or keep the\npatient warm\n20) Triangular Bandage- refers to a tool used to hold the dressing in place and to immobilize an\ninjured body part\n21) Trolley cot – refers to a rolling device used to transport patient.\n22) Walking frames – refers to a assistive device used to support body weight for patients with\ndifficulty in walking\n23) Wheel Chair - refers to a device used to transport patient from one place to another in a\nsitting position\n24) AED (Automated External Defibrillator) – a machine that analyzes and delivers electrical\ntreatment.\n25) GPS- Global Positioning System\n26) LOC- Level of consciousness\n27) OSHA – Occupational Safety and Health Act\n28) PPE – personal protective equipment\n29) SPO2- saturation of peripheral oxygen\n30) HEPA (High Efficient Particulate Air Respirator Mask) – special personal protective\nequipment for airborne diseases\n\n--- PDF PAGE 92 ---\nACKNOWLEDGMENT\n\nThe Technical Education and Skills Development Authority (TESDA) wishes to extend thanks and\nappreciation to the many representatives of business, industry, academe and government agencies, non-\ngovernment organizations including professional associations who donated their time and expertise to the\ndevelopment and validation of this Training Regulations.\n Health Care Industry Training Council, Inc.\n•\nDr. Irineo Bernardo, III\nChair\n•\nDr. Juan Ma. Pablo R. Nañagas, MPH, MNSA\nBoard Member\n•\nGloria G. Almariego, RN, MAN\nSecretary\n•\nEvangeline E. Rafael, RN, MPA, MHA, DECD\nTreasurer\n\n•\nMrs. Ellen P. Yu, RN, MAN\nVice-Chair\n•\nMa. Rita V. Tamse, RN, MAN\nBoard Member\n•\nDr. Kenneth Vincent Ronquillo, MPHM\nBoard Member\n\nReview Committee\n•\nDr. Jorge M. Concepcion\nChair-Department of Emergency Medicine of UP-PGH\n•\nPaul Steven Veloso\nDEM, Philippine General Hospital\n•\nCloyd Santiago\nDEM, Philippine General Hospital\n•\nJose Luis Domingo\nRepresentative, Emergency Response Center\n•\nElena P. Yu\nHCITC\n•\nEvangeline E. Rafael, RN\nHCITC\n•\nGloria G. Almariego, RN\nHCITC\n•\nMa. Rita V. Tamse, RN\nHCITC\n•\nCaridad A. Ulanday\nD