        "evidence_guide": {
          "source_text": "1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nDemonstrated satisfactory performance in the work\nenvironment or a simulation\n1.2\nDemonstrated ability in variety of situations involving the\ntransport of patients in life-threatening situations\n1.3\nDemonstrated ability in loading/unloading patients requiring\nthe superior/person in charge to exhibit diverse patient\nhandling skills and knowledge\n1.4\nDemonstrated ability in transportation of patients over routes\nrequiring the superior/person in charge to display a variety of\ndriving and route selection skills\n2. Required Knowledge\n2.1\nUse of communications equipment and systems, and\nknowledge of relevant Acts, Regulations, Service policies and\nprocedures\n2.2\nRoad rules and laws applying to emergency vehicles in the\nstate or territory\n2.3\nBasic Patient care and proper methods of restraint during\ntransportation\n2.4\nMethods of loading and unloading patients under life-\nthreatening conditions\n2.5\nKnowledge of relevant acts, regulations and procedures\ngoverning the handling/lifting of patients\n3. Required Skills\n3.1\nDriving skills relevant to the transportation of patients in life-\nthreatening circumstances\n3.2\nOral communication skills include asking questions, active\nlistening, asking for clarification of instructions if required,\nacknowledging and responding to a range of views\n3.3\nWritten communication skills\n3.4\nInterpersonal skills required include working with others, and\nan ability to relate to persons from differing cultural, social and\nreligious backgrounds\n3.5\nProblem solving skills required include an ability to use\navailable resources, assess and analyze available driving\nroutes, patient handling requirements and transportation\nneeds. Make decisions to ensure the safe driving of vehicles\nunder operational conditions.\n4. Resource\nImplications\nThe following resources should be provided:\n4.1\nAccess to appropriate workplace or simulation of realistic\nworkplace setting where assessment can be conducted\n4.2\nAccess to equipment and resources normally used in the\nworkplace\n5. Methods of\nAssessment\nCompetency in this unit must be assessed through:\n5.1\nObservation with questioning\n5.2 Oral questioning/Interview\n5.2\nEvidence gathered from the workplace environment\n5.3\nDemonstration over a period of time to ensure consistency of\nperformance\n6. Context of\nAssessment\n6.1\nEvidence must include observation of performance in the work\nenvironment or in a simulated work setting\n\n--- PDF PAGE 73 ---\nTESDA-SOP-QSO-01-F08\nTR-Emergency Medical Services NC II (Amended)\nPromulgated December 2013\n70\nUNIT OF COMPETENCY :\nTRANSPORT NON-EMERGENCY PATIENTS\n\nUNIT CODE\n:"
        },
        "source_text": "HCS322327\n\nUNIT DESCRIPTOR\n:\nThis unit of competency involves transportation of patients and\nother appropriate personnel under emergency circumstances.\n\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Convey and receive\ninformation relating\nto emergency\ntransport\n1.1\nCommunication with control center is established and\nmaintained according to local ambulance standard operation\nprocedure.\n1.2\nAppropriate receiving facility is notified according to local\nambulance standard operation procedure.\n2. Transport patient\nunder emergency\nconditions\n2.1\nAmbulance is driven in a manner that avoids exacerbation\nof patient's condition.\n2.2\nHazards are recognized and negotiated at low risk.\n2.3\nVehicle is driven according to legal requirements governing\nemergency vehicles.\n2.4\nAppropriate route is chosen according to distance, time,\ntravel and terrain.\n2.5\nCommunication is established and maintained as required\nbetween driver and patient care officer to ensure safe\ntransport and effective patient care.\n\n3. Load, unload and\nsecure patient and\nequipment for\nemergency\ntransportation\n3.1\nLoading/unloading is conducted smoothly, consistent with\nsafe work practices, and local ambulance standard\noperating procedure.\n3.2\nPatient's illness/injury is not exacerbated by unnecessary\nmovement during loading and unloading.\n3.3\nPatients are removed from scene in a manner consistent\nwith relevant Acts, Regulations and in accordance with\nlocal ambulance standard operating procedure.\n3.4\nEquipment is secured in accordance with relevant\nPhilippine Standards, Acts, and regulations and in\naccordance with local ambulance standard operating\nprocedure.\n\n--- PDF PAGE 71 ---\nTESDA-SOP-QSO-01-F08\nTR-Emergency Medical Services NC II (Amended)\nPromulgated December 2013\n68\nRANGE OF VARIABLES\n\nVARIABLES\nRANGE\n1. Type of ambulance\ncategory\nMay include:\n(based on ambulance classification)\n1.1\nPatient Transport Vehicle\n1.2\nBasic Life Support Ambulance\n1.3\nAdvanced Life Support Ambulance\n2. Equipment\nMay include:\n2.1\nStandard inventory of ambulance equipment\n2.2\nNumber of personnel in ambulance which follows the standard\noperating procedures\n3. Legal requirements\nMay include:\n3.1\nLocal and national traffic ordinances, acts and regulations and\nAmbulance Acts and Regulations\n3.2\nAll lawful standing orders, policies and procedures issued by\nAmbulance Services pertaining to the driving and operation of\nservice vehicles\n3.3\nDepartment of Transportation and Communication,\nDepartment of Interior and Local Government, Local\nGovernment Units and the Department of Health.\n4. Service and national\nstandards for safe\nwork practices\nMay include:\n(Are detailed in)\n4.1\nOccupational Safety and Health Acts, Regulations and\nStandards\n4.2\nLocal Ambulance Service standard operating policies and\nprocedures\n4.3\nSafe lifting and manual handling procedures\n4.4\nActs, Regulations service policy and procedures include those\nrelating to the operation of radio and electronic communication\nequipment\n5. Communication\nequipment\nMay include:\n5.1\nRadio equipment (two way portable radio)\n5.2\nEquipment of other organizations\n5.3\nViable alternatives that support effective communication\n5.4\nOnline network\n5.5\nCellular network\n5.6\nSatellite network\n\n--- PDF PAGE 72 ---\nTESDA-SOP-QSO-01-F08\nTR-Emergency Medical Services NC II (Amended)\nPromulgated December 2013\n69\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nDemonstrated satisfactory performance in the work\nenvironment or a simulation\n1.2\nDemonstrated ability in variety of situations involving the\ntransport of patients in life-threatening situations\n1.3\nDemonstrated ability in loading/unloading patients requiring\nthe superior/person in charge to exhibit diverse patient\nhandling skills and knowledge\n1.4\nDemonstrated ability in transportation of patients over routes\nrequiring the superior/person in charge to display a variety of\ndriving and route selection skills\n2. Required Knowledge\n2.1\nUse of communications equipment and systems, and\nknowledge of relevant Acts, Regulations, Service policies and\nprocedures\n2.2\nRoad rules and laws applying to emergency vehicles in the\nstate or territory\n2.3\nBasic Patient care and proper methods of restraint during\ntransportation\n2.4\nMethods of loading and unloading patients under life-\nthreatening conditions\n2.5\nKnowledge of relevant acts, regulations and procedures\ngoverning the handling/lifting of patients\n3. Required Skills\n3.1\nDriving skills relevant to the transportation of patients in life-\nthreatening circumstances\n3.2\nOral communication skills include asking questions, active\nlistening, asking for clarification of instructions if required,\nacknowledging and responding to a range of views\n3.3\nWritten communication skills\n3.4\nInterpersonal skills required include working with others, and\nan ability to relate to persons from differing cultural, social and\nreligious backgrounds\n3.5\nProblem solving skills required include an ability to use\navailable resources, assess and analyze available driving\nroutes, patient handling requirements and transportation\nneeds. Make decisions to ensure the safe driving of vehicles\nunder operational conditions.\n4. Resource\nImplications\nThe following resources should be provided:\n4.1\nAccess to appropriate workplace or simulation of realistic\nworkplace setting where assessment can be conducted\n4.2\nAccess to equipment and resources normally used in the\nworkplace\n5. Methods of\nAssessment\nCompetency in this unit must be assessed through:\n5.1\nObservation with questioning\n5.2 Oral questioning/Interview\n5.2\nEvidence gathered from the workplace environment\n5.3\nDemonstration over a period of time to ensure consistency of\nperformance\n6. Context of\nAssessment\n6.1\nEvidence must include observation of performance in the work\nenvironment or in a simulated work setting\n\n--- PDF PAGE 73 ---\nTESDA-SOP-QSO-01-F08\nTR-Emergency Medical Services NC II (Amended)\nPromulgated December 2013\n70\nUNIT OF COMPETENCY :\nTRANSPORT NON-EMERGENCY PATIENTS\n\nUNIT CODE\n:"
