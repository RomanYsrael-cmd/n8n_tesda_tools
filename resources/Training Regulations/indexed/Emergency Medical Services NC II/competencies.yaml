        "evidence_guide": {
          "source_text": "1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1.\nPrepared written communication following standard format of\nthe organization.\n1.2.\nAccessed information using communication equipment.\n1.3.\nMade use of relevant terms as an aid to transfer information\neffectively.\n1.4.\nConveyed information effectively adopting the formal or\ninformal communication.\n2. Underpinning\nknowledge\n\n2.1.\nEffective communication\n2.2.\nDifferent modes of communication\n2.3.\nWritten communication\n2.4.\nOrganizational policies\n2.5.\nCommunication procedures and systems\n2.6.\nTechnology relevant to the enterprise and the individual’s\nwork responsibilities\n3. Underpinning skills\n3.1.\nFollow simple spoken language\n3.2.\nPerform routine workplace duties following simple written\nnotices\n3.3.\nParticipate in workplace meetings and discussions\n3.4.\nComplete work related documents\n3.5.\nEstimate, calculate and record routine workplace measures\n3.6.\nBasic mathematical processes of addition, subtraction,\ndivision and multiplication\n3.7.\nAbility to relate to people of social range in the workplace\n3.8.\nGather and provide information in response to workplace\nrequirements\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1.\nFax machine\n4.2.\nTelephone\n4.3.\nWriting materials\n4.4.\nInternet\n5. Method of\nassessment\nCompetency MUST be assessed through:\n5.1.\nDirect Observation\n5.2.\nOral interview and written test\n6. Context of\nassessment\n6.1.\nCompetency may be assessed individually in the actual\nworkplace or through accredited institution\n\n--- PDF PAGE 8 ---\nTR-Emergency Medical Services NC II (Amended)\nPromulgated December 2013\n5\nUNIT OF COMPETENCY :\nWORK IN A TEAM ENVIRONMENT\nUNIT CODE\n:"
        },
        "source_text": "500311105\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes required to\ngather, interpret and convey information in response to workplace\nrequirements.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Obtain and convey\nworkplace\ninformation\n1.1\nSpecific and relevant information is accessed from\nappropriate sources.\n1.2\nEffective questioning, active listening and speaking skills are\nused to gather and convey information.\n1.3\nAppropriate medium is used to transfer information and ideas.\n1.4\nAppropriate non- verbal communication is used.\n1.5\nAppropriate lines of communication with supervisors and\ncolleagues are identified and followed.\n1.6\nDefined workplace procedures for the location and storage of\ninformation are used.\n1.7\nPersonal interaction is carried out clearly and concisely.\n2. Participate in\nworkplace meetings\nand discussions\n2.1\nTeam meetings are attended on time.\n2.2\nOwn opinions are clearly expressed and those of others are\nlistened to without interruption.\n2.3\nMeeting inputs are consistent with the meeting purpose and\nestablished protocols.\n2.4\nWorkplace interactions are conducted in a courteous\nmanner.\n2.5\nQuestions about simple routine workplace procedures and\nmaters concerning working conditions of employment are\nasked and responded to.\n2.6\nMeetings outcomes are interpreted and implemented.\n3. Complete relevant\nwork related\ndocuments\n3.1\nRange of forms relating to conditions of employment is\ncompleted accurately and legibly.\n3.2\nWorkplace data is recorded on standard workplace forms and\ndocuments.\n3.3\nBasic mathematical processes are used for routine\ncalculations.\n3.4\nErrors in recording information on forms/ documents are\nidentified and properly acted upon.\n3.5\nReporting requirements to supervisor are completed\naccording to organizational guidelines.\n\n--- PDF PAGE 6 ---\nTR-Emergency Medical Services NC II (Amended)\nPromulgated December 2013\n3\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Appropriate sources\n1.1.\nTeam members\n1.2.\nSuppliers\n1.3.\nTrade personnel\n1.4.\nLocal government\n1.5.\nIndustry bodies\n2. Medium\n2.1.\nMemorandum\n2.2.\nCircular\n2.3.\nNotice\n2.4.\nInformation discussion\n2.5.\nFollow-up or verbal instructions\n2.6.\nFace to face communication\n3. Storage\n3.1.\nManual filing system\n3.2.\nComputer-based filing system\n4. Forms\n4.1.\nPersonnel forms, telephone message forms, safety reports\n5. Workplace\ninteractions\n5.1.\nFace to face\n5.2.\nTelephone\n5.3.\nElectronic and two way radio\n5.4.\nWritten including electronic, memos, instruction and forms,\nnon-verbal including gestures, signals, signs and diagrams\n6. Protocols\n6.1.\nObserving meeting\n6.2.\nCompliance with meeting decisions\n6.3.\nObeying meeting instructions\n\n--- PDF PAGE 7 ---\nTR-Emergency Medical Services NC II (Amended)\nPromulgated December 2013\n4\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1.\nPrepared written communication following standard format of\nthe organization.\n1.2.\nAccessed information using communication equipment.\n1.3.\nMade use of relevant terms as an aid to transfer information\neffectively.\n1.4.\nConveyed information effectively adopting the formal or\ninformal communication.\n2. Underpinning\nknowledge\n\n2.1.\nEffective communication\n2.2.\nDifferent modes of communication\n2.3.\nWritten communication\n2.4.\nOrganizational policies\n2.5.\nCommunication procedures and systems\n2.6.\nTechnology relevant to the enterprise and the individual’s\nwork responsibilities\n3. Underpinning skills\n3.1.\nFollow simple spoken language\n3.2.\nPerform routine workplace duties following simple written\nnotices\n3.3.\nParticipate in workplace meetings and discussions\n3.4.\nComplete work related documents\n3.5.\nEstimate, calculate and record routine workplace measures\n3.6.\nBasic mathematical processes of addition, subtraction,\ndivision and multiplication\n3.7.\nAbility to relate to people of social range in the workplace\n3.8.\nGather and provide information in response to workplace\nrequirements\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1.\nFax machine\n4.2.\nTelephone\n4.3.\nWriting materials\n4.4.\nInternet\n5. Method of\nassessment\nCompetency MUST be assessed through:\n5.1.\nDirect Observation\n5.2.\nOral interview and written test\n6. Context of\nassessment\n6.1.\nCompetency may be assessed individually in the actual\nworkplace or through accredited institution\n\n--- PDF PAGE 8 ---\nTR-Emergency Medical Services NC II (Amended)\nPromulgated December 2013\n5\nUNIT OF COMPETENCY :\nWORK IN A TEAM ENVIRONMENT\nUNIT CODE\n:"
