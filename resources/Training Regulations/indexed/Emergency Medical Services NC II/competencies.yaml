        "source_text": "HCS322302\n\nUNIT DESCRIPTOR\n:\nThis unit of competency deals with the responsibilities in ensuring\nthat adequate supplies of ambulance equipment and resources and\nrecords are maintained. He may or may not necessarily be\nresponsible for the ordering and purchasing of equipment and\nresources, depending on the workplace organizational structure.\n\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Maintain resources\n1.1\nAvailability of adequate and relevant resources is ensured\nand secured in accordance with workplace procedures.\n1.2\nNon-consumables required by workplace are identified and\nobtained to maintain adequate readiness of supplies.\n1.3\nConsumables required by workplace are identified and\nobtained to maintain adequate readiness of supplies.\n1.4\nStock is checked and regular inspection of equipment is\ncarried out for condition and currency.\n1.5\nEquipment is recovered, cleaned and waste is disposed of\nsafely according to legislative and site procedures.\n1.6\nResources are maintained in operational readiness in\naccordance with workplace procedures.\n1.7\nResources are stored in the correct manner to ensure their\nfuture operation and serviceability.\n2. Manage records\n2.1\nRelevant forms are completed as required according to\nlegislation and site procedures.\n2.2\nForms are stored in accordance with legislative and site\nprocedures.\n2.3\nRelevant forms are sent to appropriate bodies and\nappropriate filing of these records and security of such records\nis undertaken according to workplace and legislative\nrequirements.\n2.4\nConfidentiality of records and information is maintained in\naccordance with privacy principles and statutory and/or\norganizational policies.\n\n--- PDF PAGE 36 ---\nTESDA-SOP-QSO-01-F08\nTR-Emergency Medical Services NC II (Amended)\nPromulgated December 2013\n33\nRANGE OF VARIABLES\n\nVARIABLES\nRANGE\n1. Ambulance resources\nMay include:\nNon-consumables:\n1.1\nMachines (e.g. AED, Suction machine, etc.)\n1.2\nBooks\n1.3\nReference materials including MSDSS, ECC, OHSA,\nPhilHealth\n1.4\nLegislative regulations\n1.5\nCommunication systems\n1.6\nRelevant texts\n1.7\nEquipment (e.g. Trolley Cot, Scoop Stretchers, etc.)\nConsumables:\n1.1\nEmergency kits (bandages, tape, scissors, splinter\nremovers, antiseptic, eye management, disinfectants,\nemergency numbers and contacts, etc.)\n1.2\nDressings\n1.3\nCold packs\n\n1.4\nSplints\n1.5\nSharps disposal\n1.6\nBio-hazardous waste\n1.7\nBandages\n1.8\nPersonal protective equipment\n1.9\nDisinfectants\n1.10\nCervical collars\n1.11\nSupplemental oxygen device (e.g. nasal cannula, face mask,\nnon-rebreather mask, etc.)\n1.12\nIntubation and Intravenous set (for the physician’s use only)\n2. Legislation\nMay include:\n2.1\nOSHA legislation\n2.2\nRegulations and codes of practice\n2.3\nIndustrial relations legislation\n3. Codes of practice\nMay include:\n3.1\nIndustry codes\n3.2\nIndustry standards\n3.3\nCompany procedures\n3.4\nNational and local health and safety authorities\n4. Relevant forms\nMay include:\n4.1\nIncident/injury forms\n4.2\nCasualty history forms\n4.3\nDisease notification\n4.4\nECC forms\n4.5\nPhilHealth membership\n4.6\nWorkers' compensation\n4.7\nLog book\n4.8\nPre-participation records (sport)\n4.9\nMedical histories\n4.10 Management records\n4.11 Stock records\n4.12 Infection control records\n4.13 Training records\n5. Policies and procedures\nmay be from\norganizations such as\nMay include:\n5.1\nCompany Standard Operating Procedures\n5.2\nOthers\n\n--- PDF PAGE 37 ---\nTESDA-SOP-QSO-01-F08\nTR-Emergency Medical Services NC II (Amended)\nPromulgated December 2013\n34\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nDemonstrated competence by working individually, under\nsupervision or as part of EMS team.\n\nWhere applicable, assessment should replicate workplace\nconditions as far as possible. Where, for reasons of safety,\nspace access to equipment and resources and assessment\ntakes place away from the workplace, simulations should be\nused to represent workplace conditions as closely as possible.\n\n2. Required Knowledge\n2.1\nOccupational Safety and Health Act and regulations\n2.2\nLegal responsibilities and duty of care\n2.3\nPolicies and procedures\n2.4\nCleaning agents\n2.5\nStock control\n2.6\nWaste disposal\n2.7\nTransportation techniques\n2.8\nUse of referral networks\n2.9\nDecency of skills and knowledge\n2.10 Gaining access to material safety data sheets (MSDS)\n\n3. Required Skills\n3.1\nApplying OSH legislation and regulations\n3.2\nReading skills to interpret work instructions, diagrams,\nschematics\n3.3\nCommunication skills needed to interpret, define and explain\nwork procedures\n3.4\nProblem solving in emergency situation/s\n3.5\nTroubleshooting\n3.6\nCourtesy and helping attitude\n3.7\nUsing cleaning agents\n3.8\nControlling stocks\n3.9\nDisposing waste\n3.10 Applying transportation techniques\n3.11 Using referral networks\n3.12 Gaining access to material safety data sheets\n4. Resource\nImplications\nThe following resources should be provided:\n4.1 Tools\n4.2 Test equipment and instruments\n4.3\nMaterials\n4.4\nWork station\n4.5\nJob orders/requests\n\n5. Methods of\nAssessment\nCompetency in this unit must be assessed through:\n5.1\nObservation with questioning\n5.2\nInterview\n5.3\nDemonstration with questioning\n5.4\nThird Party Report\n5.5\nPortfolio\n\n6. Context of\nAssessment\n6.1\nAssessment may be conducted in the workplace or in a\nsimulated environment.\n\n--- PDF PAGE 38 ---\nTESDA-SOP-QSO-01-F08\nTR-Emergency Medical Services NC II (Amended)\nPromulgated December 2013\n35\nUNIT OF COMPETENCY :\nIMPLEMENT SAFE ACCESS AND EXTRICATION\nPROCEDURES IN AN EMERGENCY\n\nUNIT CODE\n:"
