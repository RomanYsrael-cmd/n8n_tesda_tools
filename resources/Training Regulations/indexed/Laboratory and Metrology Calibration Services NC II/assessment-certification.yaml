  "source_text": "SECTION 4 NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1 To attain the National Qualification of LABORATORY AND METROLOGY/CALIBRATION\nSERVICES NC II, the candidate must demonstrate competence in all the units listed in\nSection 1.\n\nSuccessful candidates shall be awarded a National Certificate signed by the TESDA Director\nGeneral.\n\n4.2 Individual\naspiring\nto\nbe\nawarded\nthe\nqualification\nof\nof\nLABORATORY\nAND\nMETROLOGY/CALIBRATION SERVICES NC II must acquire Certificates of Competency in\nall the following core units of the Qualification. Candidates may apply for assessment in any\naccredited assessment center.\n\n4.2.1 Perform Engineering Measurement\n\n4.2.2 Perform Precision Mechanical Measurement\n\n4.2.3 Calibrate Measuring Equipment\n\n4.3\nAssessment shall focus on the core units of competency. The basic and common units\nshall be integrated or assessed concurrently with the core units.\n\n4.4\nThe following are qualified to apply for assessment and certification:\n\n4.4.1 Graduates of formal, non-formal and informal including enterprise-based\ntraining programs.\n\n4.4.2 Experienced workers (wage employed or self-employed)\n\n4.5\nThe guidelines on assessment and certification are discussed in detail in the Procedures\nManual on Assessment and Certification and Guidelines on the Implementation of the\nPhilippine TVET Qualification and Certification System (PTQCS).\n\n--- PDF PAGE 47 ---\nTR Laboratory and Metrology/Calibration Services NC II Promulgated\n- 43 -\n"
