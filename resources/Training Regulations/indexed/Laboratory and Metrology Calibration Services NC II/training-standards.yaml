  "source_section_text": "SECTION 3 TRAINING STANDARDS\n\nThese guidelines are set to provide the Technical and Vocational Education and Training\n(TVET) providers with information and other important requirements to consider when designing\ntraining programs for LABORATORY AND METROLOGY/CALIBRATION SERVICES NC II.\n\n3.1 CURRICULUM DESIGN\n\nCourse Title: LABORATORY AND METROLOGY/CALIBRATION SERVICES Level: NC II\n\nNominal Training Duration:\n18 Hours (Basic Competencies)\n\n20 Hours (Common Competencies)\n56 Hours (Core Competencies)\nCourse Description:\n\nThis course is designed to equip individual with competency to perform Laboratory and\nMetrology/Calibration Services work including mensuration of engineering prototypes, automotive\nparts, geometric shapes and similar components. Measurements may be taken using ordinary\nmanual equipment..\n\nIt also includes competencies on interpreting specifications, drawings, technical sketches\nand/or customer requirements. Tasks undertaken would also include utilizing appropriate\nstandards, calibrating tools and proper machineries using principles and techniques; designated\nprocedures, correct and appropriate inspection methods, measure and repair procedures; sets up\nand operates variety of specialized coordinate measuring machines needed for precision\nmeasurements and calibration.\n\nThis course is also designed to provide basic and common skills to equip individual with\noperational skills in Laboratory and Metrology/Calibration Services.\n\nTo obtain this, all units prescribed for this qualification must be achieved.\n\nBASIC COMPETENCIES\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and convey workplace\ninformation.\n1.2 Complete relevant work related\ndocuments.\n1.3 Participate in workplace meeting\nand discussion.\n• Group\ndiscussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n2. Work in a team\nenvironment\n2.1 Describe and identify team role and\nresponsibility in a team.\n2.2 Describe work as a team member.\n• Discussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n3. Practice career\nprofessionalism\n3.1 Integrate personal objectives with\norganizational goals.\n3.2 Set and meet work priorities.\n3.3 Maintain professional growth and\ndevelopment.\n• Discussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n\n--- PDF PAGE 41 ---\nTR Laboratory and Metrology/Calibration Services NC II Promulgated\n- 37 -\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n4. Practice\noccupational\nhealth and safety\n4.1 Evaluate hazard and risks\n4.2 Control hazards and risks\n4.3 Maintain occupational health and\nsafety awareness\n• Discussion\n• Plant tour\n• Symposium\n• Observation\n• Interview\n\nCOMMON COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Read, Interpret\nand Apply\nEngineering\nDrawings\n1.1 Identify and access engineering\ndrawings/ specification\n1.2 Interpret drawings\n1.3 Apply information in the drawings &\nspecifications\n1.4 Store drawings\n• Lecture/\nDemonstration\n• Dual training\n• Self paced\n(modular)\n• Distance\nLearning\n• Written test\n• Oral questioning\n• Direct\nobservation\n• Project method\n• Interview\n2. Perform\nMensuration\nand Calculation\n2.1 Select measuring instrument and\ncarry out measurement and\ncalculations.\n2.2 Maintain measuring instruments\n• Lecture/\nDemonstration\n• Dual training\n• Self paced\n(modular)\n• Distance\nLearning\n• Written test\n• Oral questioning\n• Direct\nobservation\n• Project method\n• Interview\n3. Read, Interpret\nand Apply\nSpecifications\nand Manual\n3.1 Identify/accessed manuals and\ninterpret data and specification\n3.2 Apply information accessed in\nmanual\n3.3 Store manual\n• Lecture/\nDemonstration\n• Dual training\n• Self paced\n(modular)\n• Distance\nLearning\n• Written test\n• Oral questioning\n• Direct\nobservation\n• Project method\n• Interview\n4. Perform Shop\nMaintenance\n\n4.1 Inspect/clean tools and work area\n4.2 Store/arrange tools and shop\nequipment\n4.3 Dispose wastes/used lubricants\n4.4 Report damaged tools/equipment\n• Lecture/\nDemonstration\n• Dual training\n• Self paced\n(modular)\n• Distance\nLearning\n• Written test\n• Oral questioning\n• Direct\nobservation\n• Project method\n• Interview\n\nCORE COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Perform\nEngineering\nmeasurement\n1.1 Select measuring instruments\n1.2. Carry out engineering\nmeasurement\n1.3 Maintain measuring tools,\ndevices and instruments\n• Demonstration\n• Discussion\n• Written\nexamination\n• Demonstration of\npractical skills\n• Practical Test\n\n--- PDF PAGE 42 ---\nTR Laboratory and Metrology/Calibration Services NC II Promulgated\n- 38 -\n\n2. Perform\nprecision\nmechanical\nmeasurement\n2.1 Select measuring instruments\n2.2. Carry out measurements/\ncalculations\n2.3 Maintain measuring instruments\n• Demonstration\n• Discussion\n• Interview\n• Practical test\n• Direct\nObservation\n3. Calibrate\nmeasuring\nequipment\n3.1 Check equipment for correct\noperation\n3.2. Validate / Calibrate precision\nmeasuring equipment\n• Demonstration\n• Discussion\n• Practical test\n\n3.2 TRAINING DELIVERY\n\nThe delivery of training should adhere to the design of the curriculum. Delivery should be\nguided by the 10 basic principles of competency-based TVET.\n\n• The training is based on curriculum developed from the competency standards;\n• Learning is modular in its structure;\n• Training delivery is learner-centered and should accommodate individualized and self-\npaced learning strategies;\n• Training is based on work that must be performed;\n• Training materials are directly related to the competency standards and the curriculum\nmodules;\n• Assessment is based in the collection of evidence of the performance of work to the\nindustry required standard;\n• Training is based on and off-the-job components;\n• Allows for recognition of prior learning (RPL) or current competencies;\n• Training allows for multiple entry and exit; and\n• Approved training programs are nationally accredited.\n\nThe competency-based TVET system recognizes various types of delivery modes, both\non and off-the-job as long as the learning is driven by the competency standards specified by\nthe industry. The following training modalities may be adopted when designing training\nprograms:\n\n• The dualized mode of training delivery is preferred and recommended. Thus programs\nwould contain both in-school and in-industry training or fieldwork components. Details can\nbe referred to the Dual Training System (DTS) Implementing Rules and Regulations.\n• Modular/self-paced learning is a competency-based training modality wherein the trainee\nis allowed to progress at his own pace. The trainer facilitates the training delivery\n• Peer teaching/mentoring is a training modality wherein fast learners are given the\nopportunity to assist the slow learners.\n• Supervised industry training or on-the-job training is an approach in training designed to\nenhance the knowledge and skills of the trainee through actual experience in the\nworkplace to acquire specific competencies prescribed in the training regulations.\n• Distance learning is a formal education process in which majority of the instruction occurs\nwhen the students and instructor are not in the same place. Distance learning may\nemploy correspondence study, or audio, video or computer technologies.\n• Project-Based Instruction is an authentic instructional model or strategy in which students\nplan, implement and evaluate projects that have real world applications.\n\n--- PDF PAGE 43 ---\nTR Laboratory and Metrology/Calibration Services NC II Promulgated\n- 39 -\n3.3 TRAINEE ENTRY REQUIREMENTS\n\nThis section specifies the qualifications of trainees and educational experience. Other\nrequirements like health and physical requirements are also stated. Passing entry written\nexaminations may also be indicated if necessary.\n\n• With background in basic mensuration\n• With good moral character;\n• Ability to communicate both oral and written; and\n• Physically and mentally fit\n\n3.4 LIST OF TOOLS, EQUIPMENT AND MATERIALS\nLABORATORY AND METROLOGY/CALIBRATION SERVICES NC II\n\nRecommended list of tools, equipment and materials for the training of 25 trainees for\nLABORATORY AND METROLOGY/CALIBRATION SERVICES NC II\nTOOLS\nEQUIPMENT\nMATERIALS\nQTY\nQTY\nQTY\n25\nunits\nLine graduated rules\n2\nunits\nOil Free\nCompressor\n\n25\nunits\nLine graduated Bar\nstandard\n1 unit\nAir Conditioner\n\n25\nunits\nVernier caliper\n2\nunits\nAir Handling\nEquipment\n\n6 units Outside Micrometer\n3\nunits\nSurface Plate\n\n5 units Inside micrometer\n1 set Dial indicator with\ngage stand or\ncomparator base\n\n6 pcs.\nBore gauges\n3\nunits\n\n2 units Master setting\ngages\n1 set\n\n1 unit\nGage block\nstandard for square,\nrectangular and\nround\n3\nunits\n\n20 L.\nSolvent Naptha\n2 units\nHeight gage\n1 unit\n4 units\nSine bar\n1 unit\n2 units Depth indicator\ngage\n5\nunits\n\n15 pcs.\nRubber glove\n10\nunits\n\n15 pcs.\nCotton glove\n3\nunits\n\n15 pcs.\nNylon glove\n2\nunits\n\n15 pcs.\nGoggle\n15 pcs.\nGas mask\n15 pcs.\nSafety shoe\n15 pcs.\nApron\n\n--- PDF PAGE 44 ---\nTR Laboratory and Metrology/Calibration Services NC II Promulgated\n- 40 -\n1 yard\nFilter Cloth\n(200 mesh)\n\n30 pcs.\nSandpaper\n(Asstd. Grit)\nGrit# 1200\nGrit# 600\nGrit# 400\nGrit# 360\nGrit# 280\nGrit# 180\n\n2 kls.\nWhite rag\n(De Hilo)\n\n--- PDF PAGE 45 ---\nTR Laboratory and Metrology/Calibration Services NC II Promulgated\n- 41 -\n3.5 TRAINING FACILITIES\nLABORATORY AND METROLOGY/CALIBRATION SERVICES NC II\n\nBased on a class size of 25 students/trainees\n\nSPACE REQUIREMENT\nSIZE IN METERS\nAREA IN SQ.\nMETERS\nTOTAL AREA IN\nSQ. METERS\n•\nBuilding (permanent)\n26.00 x 28.00\n728.00\n728.00\n• Trainee Working Space\n2.0 x 1.5 per\nstudent/trainee\n3.0 per student\n75.00\n•\nLecture Room\n9.00 x 10.00\n90.00\n90.00\n•\nLearning Resource Center\n5.00 x 8.00\n40.00\n40.00\n• Facilities/ Equipment/\nCirculation Area\n-\n-\n523.00\n\n3.6 TRAINER’S QUALIFICATIONS FOR AUTOMOTIVE SECTOR\n MANUFACTURING SUB-SECTOR\n\nLABORATORY AND METROLOGY/CALIBRATION SERVICES NC II\nTRAINER QUALIFICATION (TQ II)\n\n• Must be a holder of an Engineering or similar course\n• Must have undergone training on Training Methodology II (TM II)\n• Must be computer literate\n• Must be physically and mentally fit\n• *Must have at least 4 years job/industry experience\n• Must be a civil service eligible (for government position or appropriate professional license\nissued by the Professional Regulatory Commission)\n\n* Optional. Only when required by the hiring institution.\nReference: TESDA Board Resolution No. 2004 03\n\n3.7 INSTITUTIONAL ASSESSMENT\n\nInstitutional assessment is undertaken by trainees to determine their achievement of\nunits of competency. A certificate of achievement is issued for each unit of competency.\n\n--- PDF PAGE 46 ---\nTR Laboratory and Metrology/Calibration Services NC II Promulgated\n- 42 -"
