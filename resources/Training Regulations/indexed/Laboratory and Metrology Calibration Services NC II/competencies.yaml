        "source_title": "PERFORM ENGINEERING MEASUREMENTS",
        "source_text": "--- PDF PAGE 30 ---\nTR Laboratory and Metrology/Calibration Services NC II   Promulgated \n- 26 - \n  \nCORE COMPETENCIES \n \n \nUNIT OF COMPETENCY \n:  \nPERFORM ENGINEERING MEASUREMENTS \n \nUNIT CODE \n \n \n:  \nALT315305 \n \nUNIT DESCRIPTOR \n:    \nThis unit covers the skills, knowledge and attitudes \nrequired in measuring parts and components (with more than \n0.01mm/0.025 inch tolerance) using mechanical measuring \ndevices and associated calculations. \n \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variable   \n(All inspections methods are carried out according to industry \nregulations/guidelines, occupational health and safety and company \nprocedures)\n \n1. Select appropriate device \nor equipment \n \n \n1.1 Measurement requirements are determined from \nspecifications. \n1.2 Appropriate device or equipment is selected according to \nstandard operating procedures, to achieve required \noutcome. \n \n2. Obtain measurements \nusing a range of \nmeasuring devices \n \n \n2.1 Correct and appropriate measuring technique is used. \n2.2 Measurements are accurately obtained using a range of \nmeasuring devices. \n2.3 Dimensions are determined or verified using basic \ncalculations, where required. \n \n3. Maintain measuring \ndevices \n \n3.1 Routine care and storage of devices is undertaken to \nmanufacturers’ specifications or standard operating \nprocedures. \n3.2 Routine adjustments to devices are made and checked. \n \n4. Communicate \nmeasurements as \nrequired \n \n4.1 Measurements are accurately recorded, where required. \n4.2 Freehand sketch which depicts required information is \nprepared, as required.\n\n--- PDF PAGE 31 ---\nTR Laboratory and Metrology/Calibration Services NC II   Promulgated \n- 27 - \nRANGE OF VARIABLES \nVARIABLE \nRANGE \n1.   Industry \nregulations/ \nguidelines \n1.1  Strict adherence to automotive manufacturing standards such as: \n1.1.1  Japanese industrial standards (JIS) \n1.1.2  Society of Automotive Engineers (SAE) \n1.1.3  American Society of Testing Materials (ASTM) \n1.2  Compliance to Local Government Unit (LGU) or Department of \nEnvironment and Natural Resources (DENR) regulations  \n1.2.1  Handling, storing and disposal of chemical and other \nwastes \n1.2.2  Pollution control   \n1.3  Provision of safety devices to equipment e.g. safety or limit \nswitches, guards or railings \n1.4  Use of personal protective equipment (cap, safety shoes, face \nshield/safety goggles, shop uniform)\n \n2. Specifications  \n \n \n2.1 Drawings \n2.2 Sketches \n2.3 Job instructions \n2.4 Schematics \n2.5 Diagrams \n2.6 Technical manual\n \n3. Measuring \ndevices \n3.1 Protractors \n3.2 Combination squares \n3.3 Jet squares \n3.4 Dial indicators \n3.5 Height gauges\n3.6 Tapes \n3.7 Rules \n3.8 Micrometers  \n3.9  Vernier scaled measuring \nequipment\n \n4. Basic calculations \nCalculations needed to assist in determining measurements where a \nreading of the graduated device is not sufficient, for example \nsubtracting one measurement from another to give a third \nmeasurement. Examples of calculations needed are: \n3.1 Addition \n3.2 Subtraction \n3.3 Multiplication \n3.4 Division \n3.5 Fractions  \n3.6 Decimals \nCalculations may be made using a calculator or if applicable can be \nmanual calculation\n \n5. Routine \nadjustments\nValidating the device using  \n5.1 simple zeroing \n5.2 scale adjustment\n \n6. Measurements \n5.1 Measuring length \n5.2 Squareness \n5.3 Flatness \n5.4 Angle \n5.5 Roundness \n5.6 Clearances or any other measurements that can be read off \n5.7 analog measuring device\n7. Information \n6.1 Dimensions \n6.2 Instructions \n6.3 Base line or datum points\n\n--- PDF PAGE 32 ---\nTR Laboratory and Metrology/Calibration Services NC II   Promulgated \n- 28 - \n \nEVIDENCE GUIDE \n \n1. Critical aspects \nof competency \n \nAssessment requires evidence that the candidate: \n1.1 Selected the appropriate measuring instrument  \n1.2 Computed/Obtained measurement using the required measuring \ninstrument \n1.3 Maintained measuring instruments \n1.4 Prepared the necessary reports or computation as required.\n \n2. Underpinning \nknowledge and \nattitudes \n2.1 Correct application of a range of measuring devices \n2.2 Correct and appropriate measuring technique for a range \nof measuring devices \n2.3 Addition, subtraction, multiplication, division, fractions, \ndecimals to the scope required by this unit \n2.4 Procedures for handling and storing a range of measuring devices \n2.5 Procedures for adjusting and zeroing a range of measuring devices \n2.6 Methods of communicating measurements by drawings as required \n2.7 Safe work practices and procedures\n \n3. Underpinning \nskills \n3.1 Reading, interpreting and following information on written job \ninstructions, specifications, standard operating procedures, charts, \nlists, drawings and other applicable reference documents \n3.2 Planning and sequencing operations \n3.3 Checking and clarifying task related information \n3.4 Checking for conformance to specifications \n3.5  Undertaking numerical operations involving addition, subtraction, \nmultiplication, division, fractions and decimals  \n3.6 Preparing drawings as required \n3.7 Selecting the appropriate measuring device for given measuring tasks \n3.8 Using appropriate measuring technique \n3.8 Reading all measurements taken accurately to the finest \ngraduation of the selected measuring device \n3.10 Handling and storing measuring devices in accordance with \nmanufacturers' specifications or standard operating procedures \n3.11 Verifying all measuring devices before use \n3.12  Making routine adjustments to measuring devices\n \n4. Resource \nimplications \nThe following resources MUST be provided: \n4.1 Workplace: Real or simulated work area \n4.2  Access to all tools & equipment materials and documentations \nrequired \n4.3 Relevant workplace procedures, product and manufacturing \nspecifications, codes, standards, manuals and reference materials\n \n5. Method of \nassessment  \nCandidate MUST be assessed through: \nObservation with questioning \nPortfolio \nThird party report\n \n6. Context of \nassessment \n \n6.1 This unit may be assessed on the job, off the job or a \ncombination of both on and off the job.  \n6.2 Where assessment occurs off the job, that is the candidate is not in \nproductive work, then an appropriate simulation must be used where \nthe range of conditions reflects realistic workplace situations.  \n6.3 The competencies covered by this unit would be \ndemonstrated by an individual working alone or as part of a team.\n",
