        "source_title": "CALIBRATE MEASURING EQUIPMENT",
        "source_text": "--- PDF PAGE 36 ---\nTR Laboratory and Metrology/Calibration Services NC II   Promulgated \n- 32 - \n UNIT OF COMPETENCY : \n CALIBRATE MEASURING EQUIPMENT \n \nUNIT CODE  \n \n:  \nALT315307 \n \nUNIT DESCRIPTOR  \n:  \nThis unit covers checking engineering and precision measuring \nequipment for correct operation, and validating/calibrating \nprecision measuring equipment in accordance with \npredetermined procedures. \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n(All inspections methods are carried out according to industry \nregulations/guidelines, occupational health and safety and company \nprocedures)\n \n1. Check equipment for \ncorrect operation \n \n \n \nStatistical analyses of previous measurements are conducted \nin accordance with standard operating procedures. \nPhysical conditions of measuring equipment are checked in \naccordance with standard operating procedures. \n \n2. Validate/calibrate \nprecision measuring \nequipment \n \n2.1 Calibration of precision measuring equipment is assessed to \nmanufacturers’ specifications and/or standard operating \nprocedures. \n2.2 Equipment is calibrated against appropriate physical \nstandards using correct calibration devices, equipment, \ntechniques using predetermined procedures. \n2.3 Equipment is recommissioned in accordance with standard \noperating procedures. \n2.4 Calibration activity is recorded, updated and stored.\n\n--- PDF PAGE 37 ---\nTR Laboratory and Metrology/Calibration Services NC II   Promulgated \n- 33 - \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n \n1. Physical condition \n \n \n \nComponents are checked for \n \nwear \n \nloose connections \n \nother faults \n2. Physical standards \n \nReference standards of:  \n2.1 Mass length \n2.2 Time \n2.3 Temperature \n2.4 Pressure \n2.5 Volume \n2.6 Process characteristics etc. \n \n3. Calibration devices, \nequipment \n \n \n3.1  Micrometer \n3.2  All types of calipers \n3.3  Gauge blocks (bores, squares, micrometer blocks, etc.) \n3.4  Voltmeter  \n3.5  Oscilloscope \n3.6  All types of comparators \n3.7  Jigs and fixtures  \n3.8  Templates, protractors, patterns etc. \n3.9  Ultrasonics \n \n4. Recommissioned \n \n5.1 Sealing \n5.2 Tagging \n5.3 Recommendation for usage/application \n5.4 Identification or storage in accordance with standard \noperating procedures\n\n--- PDF PAGE 38 ---\nTR Laboratory and Metrology/Calibration Services NC II   Promulgated \n- 34 - \nEVIDENCE GUIDE \n \n1.Critical aspects  \nof competency\n Assessment requires evidence that the candidate: \n1.1  checked equipment for correct operation \n1.2  validated/calibrated precision measuring equipment\n \n2. Underpinning \nknowledge and \nattitudes \n2.1 Precision mechanical measuring device for given measurement  \n2.2 Procedures to verify equipment being used has been calibrated \n2.3 Environmental conditions for the measurements being carried out \n2.4 Procedures/techniques for obtaining a range of mechanical \nmeasurements \n2.5 Accuracy to which a range of precision mechanical measuring devices \ncan be read \n2.6 Measuring equipment specifications, operation, wearing \n2.7 parts, connections and components \n2.8 Procedures for reading graduated mechanical measuring devices \n2.9 Units of measurement and numerical operations  \n2.10 Procedures for setting precision mechanical measuring devices \n2.11 Specifications of the equipment to be set \n2.12 Tools and equipment for setting mechanical measuring devices \n2.13 Adjustments that can be made to a range of precision mechanical  \nmeasuring devices \n2.14 Common fault(s) that may be found in the measuring equipment \n2.15 Effects of faults on the performance/accuracy of the measuring \nequipment \n2.16 General knowledge of standards, legislative or regulatory \nrequirements applicable to the measuring equipment and/or its \ncalibration \n2.17 standard operating procedures for calibrating the measuring \nequipment and the tools and equipment required to do so \n2.18 Standard operating procedures for commissioning the measuring \nequipment \n2.19 Calibration records to be kept/maintained in accordance with \nstandard operating procedures \n2.20 Procedures for adjusting and maintaining precision mechanical \nmeasuring devices \n2.21 Procedures for storing precision mechanical measuring devices \n2.22 Hazards and control measures associated with precision \nmechanical measurement, including housekeeping \n2.23\nSafe work practices and procedures\n \n3. Underpinning \nskills \n3.1  \nInterpreting work requirements \n3.2 \nUsing appropriate tools and equipment to check measuring \nequipment for faults \n3.3 \nUsing appropriate techniques to check the calibration of the \nmeasuring equipment for conformance to specifications \n3.4 \nCalibrating the measuring equipment against the appropriate \nphysical standard \n3.5 \nRecommissioning the measuring equipment \n3.6 \nUsing literacy and numeracy skills to enable correct completion of \ncalibration records \n3.7 \nChecks that are to be made of the measuring equipment \nand the tools and equipment to be used when checking the \nmeasuring equipment\n\n--- PDF PAGE 39 ---\nTR Laboratory and Metrology/Calibration Services NC II   Promulgated \n- 35 - \n \n \n4 Resource \nimplications \nThe following resources MUST be provided: \n4.1 Workplace: Real or simulated work area \n4.2  Access to all tools & equipment materials and documentations  \n4.3 Relevant workplace procedures, product and manufacturing \nspecifications, codes, standards, manuals and reference materials\n \n5 Method of \nassessment \nCandidate MUST be assessed through: \n5.1 Observation with questioning \n5.2 Portfolio \n5.3Third party report\n \n6 Context of \nassessment \n6.1 This unit may be assessed on the job, off the job or a \ncombination of both on and off the job.  \n6.2 Where assessment occurs off the job, that is the candidate is not in \nproductive work, then an appropriate simulation must be used where \nthe range of conditions reflects realistic workplace situations.\n",
