          "source_text": "VARIABLE \nRANGE \n1.   Industry \nregulations/ \nguidelines \n1.1  Strict adherence to automotive manufacturing standards such as: \n1.1.1  Japanese industrial standards (JIS) \n1.1.2  Society of Automotive Engineers (SAE) \n1.1.3  American Society of Testing Materials (ASTM) \n1.2  Compliance to Local Government Unit (LGU) or Department of \nEnvironment and Natural Resources (DENR) regulations  \n1.2.1  Handling, storing and disposal of chemical and other \nwastes \n1.2.2  Pollution control   \n1.3  Provision of safety devices to equipment e.g. safety or limit \nswitches, guards or railings \n1.4  Use of personal protective equipment (cap, safety shoes, face \nshield/safety goggles, shop uniform)\n \n2. Specifications  \n \n \n2.1 Drawings \n2.2 Sketches \n2.3 Job instructions \n2.4 Schematics \n2.5 Diagrams \n2.6 Technical manual\n \n3. Measuring \ndevices \n3.1 Protractors \n3.2 Combination squares \n3.3 Jet squares \n3.4 Dial indicators \n3.5 Height gauges\n3.6 Tapes \n3.7 Rules \n3.8 Micrometers  \n3.9  Vernier scaled measuring \nequipment\n \n4. Basic calculations \nCalculations needed to assist in determining measurements where a \nreading of the graduated device is not sufficient, for example \nsubtracting one measurement from another to give a third \nmeasurement. Examples of calculations needed are: \n3.1 Addition \n3.2 Subtraction \n3.3 Multiplication \n3.4 Division \n3.5 Fractions  \n3.6 Decimals \nCalculations may be made using a calculator or if applicable can be \nmanual calculation\n \n5. Routine \nadjustments\nValidating the device using  \n5.1 simple zeroing \n5.2 scale adjustment\n \n6. Measurements \n5.1 Measuring length \n5.2 Squareness \n5.3 Flatness \n5.4 Angle \n5.5 Roundness \n5.6 Clearances or any other measurements that can be read off \n5.7 analog measuring device\n7. Information \n6.1 Dimensions \n6.2 Instructions \n6.3 Base line or datum points\n\n--- PDF PAGE 32 ---\nTR Laboratory and Metrology/Calibration Services NC II   Promulgated \n- 28 -"
