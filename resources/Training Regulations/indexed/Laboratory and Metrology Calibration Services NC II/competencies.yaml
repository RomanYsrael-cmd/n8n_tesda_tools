        "evidence_guide": {
          "source_text": "1.Critical aspects\nof competency\n Assessment requires evidence that the candidate:\n1.1 checked equipment for correct operation\n1.2 validated/calibrated precision measuring equipment\n\n2. Underpinning\nknowledge and\nattitudes\n2.1 Precision mechanical measuring device for given measurement\n2.2 Procedures to verify equipment being used has been calibrated\n2.3 Environmental conditions for the measurements being carried out\n2.4 Procedures/techniques for obtaining a range of mechanical\nmeasurements\n2.5 Accuracy to which a range of precision mechanical measuring devices\ncan be read\n2.6 Measuring equipment specifications, operation, wearing\n2.7 parts, connections and components\n2.8 Procedures for reading graduated mechanical measuring devices\n2.9 Units of measurement and numerical operations\n2.10 Procedures for setting precision mechanical measuring devices\n2.11 Specifications of the equipment to be set\n2.12 Tools and equipment for setting mechanical measuring devices\n2.13 Adjustments that can be made to a range of precision mechanical\nmeasuring devices\n2.14 Common fault(s) that may be found in the measuring equipment\n2.15 Effects of faults on the performance/accuracy of the measuring\nequipment\n2.16 General knowledge of standards, legislative or regulatory\nrequirements applicable to the measuring equipment and/or its\ncalibration\n2.17 standard operating procedures for calibrating the measuring\nequipment and the tools and equipment required to do so\n2.18 Standard operating procedures for commissioning the measuring\nequipment\n2.19 Calibration records to be kept/maintained in accordance with\nstandard operating procedures\n2.20 Procedures for adjusting and maintaining precision mechanical\nmeasuring devices\n2.21 Procedures for storing precision mechanical measuring devices\n2.22 Hazards and control measures associated with precision\nmechanical measurement, including housekeeping\n2.23\nSafe work practices and procedures\n\n3. Underpinning\nskills\n3.1\nInterpreting work requirements\n3.2\nUsing appropriate tools and equipment to check measuring\nequipment for faults\n3.3\nUsing appropriate techniques to check the calibration of the\nmeasuring equipment for conformance to specifications\n3.4\nCalibrating the measuring equipment against the appropriate\nphysical standard\n3.5\nRecommissioning the measuring equipment\n3.6\nUsing literacy and numeracy skills to enable correct completion of\ncalibration records\n3.7\nChecks that are to be made of the measuring equipment\nand the tools and equipment to be used when checking the\nmeasuring equipment\n\n--- PDF PAGE 39 ---\nTR Laboratory and Metrology/Calibration Services NC II Promulgated\n- 35 -\n\n4 Resource\nimplications\nThe following resources MUST be provided:\n4.1 Workplace: Real or simulated work area\n4.2 Access to all tools & equipment materials and documentations\n4.3 Relevant workplace procedures, product and manufacturing\nspecifications, codes, standards, manuals and reference materials\n\n5 Method of\nassessment\nCandidate MUST be assessed through:\n5.1 Observation with questioning\n5.2 Portfolio\n5.3Third party report\n\n6 Context of\nassessment\n6.1 This unit may be assessed on the job, off the job or a\ncombination of both on and off the job.\n6.2 Where assessment occurs off the job, that is the candidate is not in\nproductive work, then an appropriate simulation must be used where\nthe range of conditions reflects realistic workplace situations.\n\n--- PDF PAGE 40 ---\nTR Laboratory and Metrology/Calibration Services NC II Promulgated\n- 36 -"
        },
        "source_text": "ALT315307\n\nUNIT DESCRIPTOR\n:\nThis unit covers checking engineering and precision measuring\nequipment for correct operation, and validating/calibrating\nprecision measuring equipment in accordance with\npredetermined procedures.\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n(All inspections methods are carried out according to industry\nregulations/guidelines, occupational health and safety and company\nprocedures)\n\n1. Check equipment for\ncorrect operation\n\nStatistical analyses of previous measurements are conducted\nin accordance with standard operating procedures.\nPhysical conditions of measuring equipment are checked in\naccordance with standard operating procedures.\n\n2. Validate/calibrate\nprecision measuring\nequipment\n\n2.1 Calibration of precision measuring equipment is assessed to\nmanufacturers’ specifications and/or standard operating\nprocedures.\n2.2 Equipment is calibrated against appropriate physical\nstandards using correct calibration devices, equipment,\ntechniques using predetermined procedures.\n2.3 Equipment is recommissioned in accordance with standard\noperating procedures.\n2.4 Calibration activity is recorded, updated and stored.\n\n--- PDF PAGE 37 ---\nTR Laboratory and Metrology/Calibration Services NC II Promulgated\n- 33 -\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n\n1. Physical condition\n\nComponents are checked for\n\nwear\n\nloose connections\n\nother faults\n2. Physical standards\n\nReference standards of:\n2.1 Mass length\n2.2 Time\n2.3 Temperature\n2.4 Pressure\n2.5 Volume\n2.6 Process characteristics etc.\n\n3. Calibration devices,\nequipment\n\n3.1 Micrometer\n3.2 All types of calipers\n3.3 Gauge blocks (bores, squares, micrometer blocks, etc.)\n3.4 Voltmeter\n3.5 Oscilloscope\n3.6 All types of comparators\n3.7 Jigs and fixtures\n3.8 Templates, protractors, patterns etc.\n3.9 Ultrasonics\n\n4. Recommissioned\n\n5.1 Sealing\n5.2 Tagging\n5.3 Recommendation for usage/application\n5.4 Identification or storage in accordance with standard\noperating procedures\n\n--- PDF PAGE 38 ---\nTR Laboratory and Metrology/Calibration Services NC II Promulgated\n- 34 -\nEVIDENCE GUIDE\n\n1.Critical aspects\nof competency\n Assessment requires evidence that the candidate:\n1.1 checked equipment for correct operation\n1.2 validated/calibrated precision measuring equipment\n\n2. Underpinning\nknowledge and\nattitudes\n2.1 Precision mechanical measuring device for given measurement\n2.2 Procedures to verify equipment being used has been calibrated\n2.3 Environmental conditions for the measurements being carried out\n2.4 Procedures/techniques for obtaining a range of mechanical\nmeasurements\n2.5 Accuracy to which a range of precision mechanical measuring devices\ncan be read\n2.6 Measuring equipment specifications, operation, wearing\n2.7 parts, connections and components\n2.8 Procedures for reading graduated mechanical measuring devices\n2.9 Units of measurement and numerical operations\n2.10 Procedures for setting precision mechanical measuring devices\n2.11 Specifications of the equipment to be set\n2.12 Tools and equipment for setting mechanical measuring devices\n2.13 Adjustments that can be made to a range of precision mechanical\nmeasuring devices\n2.14 Common fault(s) that may be found in the measuring equipment\n2.15 Effects of faults on the performance/accuracy of the measuring\nequipment\n2.16 General knowledge of standards, legislative or regulatory\nrequirements applicable to the measuring equipment and/or its\ncalibration\n2.17 standard operating procedures for calibrating the measuring\nequipment and the tools and equipment required to do so\n2.18 Standard operating procedures for commissioning the measuring\nequipment\n2.19 Calibration records to be kept/maintained in accordance with\nstandard operating procedures\n2.20 Procedures for adjusting and maintaining precision mechanical\nmeasuring devices\n2.21 Procedures for storing precision mechanical measuring devices\n2.22 Hazards and control measures associated with precision\nmechanical measurement, including housekeeping\n2.23\nSafe work practices and procedures\n\n3. Underpinning\nskills\n3.1\nInterpreting work requirements\n3.2\nUsing appropriate tools and equipment to check measuring\nequipment for faults\n3.3\nUsing appropriate techniques to check the calibration of the\nmeasuring equipment for conformance to specifications\n3.4\nCalibrating the measuring equipment against the appropriate\nphysical standard\n3.5\nRecommissioning the measuring equipment\n3.6\nUsing literacy and numeracy skills to enable correct completion of\ncalibration records\n3.7\nChecks that are to be made of the measuring equipment\nand the tools and equipment to be used when checking the\nmeasuring equipment\n\n--- PDF PAGE 39 ---\nTR Laboratory and Metrology/Calibration Services NC II Promulgated\n- 35 -\n\n4 Resource\nimplications\nThe following resources MUST be provided:\n4.1 Workplace: Real or simulated work area\n4.2 Access to all tools & equipment materials and documentations\n4.3 Relevant workplace procedures, product and manufacturing\nspecifications, codes, standards, manuals and reference materials\n\n5 Method of\nassessment\nCandidate MUST be assessed through:\n5.1 Observation with questioning\n5.2 Portfolio\n5.3Third party report\n\n6 Context of\nassessment\n6.1 This unit may be assessed on the job, off the job or a\ncombination of both on and off the job.\n6.2 Where assessment occurs off the job, that is the candidate is not in\nproductive work, then an appropriate simulation must be used where\nthe range of conditions reflects realistic workplace situations.\n\n--- PDF PAGE 40 ---\nTR Laboratory and Metrology/Calibration Services NC II Promulgated\n- 36 -"
      }
    ]
  },
  "source_section_text": "SECTION 2 COMPETENCY STANDARDS\n\nThis section gives the details of the contents of the basic, common and core units of\ncompetency required in LABORATORY AND METROLOGY/CALIBRATION SERVICES NC II.\n\nBASIC COMPETENCIES\n\nUNIT OF COMPETENCY :\nPARTICIPATE IN WORKPLACE COMMUNICATION\n\nUNIT CODE\n:\n500311105\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes required to\ngather, interpret and convey information in response to workplace\nrequirements.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Obtain and convey\nworkplace\ninformation\n1.1\nSpecific and relevant information is accessed from\nappropriate sources\n1.2\nEffective questioning, active listening and speaking skills are\nused to gather and convey information\n1.3\nAppropriate medium is used to transfer information and ideas\n1.4\nAppropriate non- verbal communication is used\n1.5\nAppropriate lines of communication with supervisors and\ncolleagues are identified and followed\n1.6\nDefined workplace procedures for the location and storage of\ninformation are used\n1.7\nPersonal interaction is carried out clearly and concisely\n2. Participate in\nworkplace meetings\nand discussions\n2.1\nTeam meetings are attended on time\n2.2\nOwn opinions are clearly expressed and those of others are\nlistened to without interruption\n2.3\nMeeting inputs are consistent with the meeting purpose and\nestablished protocols\n2.4\nWorkplace interactions are conducted in a courteous\nmanner\n2.5\nQuestions about simple routine workplace procedures and\nmaters concerning working conditions of employment are\nasked and responded to\n2.6\nMeetings outcomes are interpreted and implemented\n3. Complete relevant\nwork related\ndocuments\n3.1\nRange of forms relating to conditions of employment are\ncompleted accurately and legibly\n3.2\nWorkplace data is recorded on standard workplace forms and\ndocuments\n3.3\nBasic mathematical processes are used for routine\ncalculations\n3.4\nErrors in recording information on forms/ documents are\nidentified and properly acted upon\n3.5\nReporting requirements to supervisor are completed\naccording to organizational guidelines\n\n--- PDF PAGE 7 ---\nTR Laboratory and Metrology/Calibration Services NC II Promulgated\n- 3 -\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Appropriate sources\n1.1.\nTeam members\n1.2.\nSuppliers\n1.3.\nTrade personnel\n1.4.\nLocal government\n1.5.\nIndustry bodies\n2. Medium\n2.1.\nMemorandum\n2.2.\nCircular\n2.3.\nNotice\n2.4.\nInformation discussion\n2.5.\nFollow-up or verbal instructions\n2.6.\nFace to face communication\n3. Storage\n3.1.\nManual filing system\n3.2.\nComputer-based filing system\n4. Forms\n4.1.\nPersonnel forms, telephone message forms, safety reports\n5. Workplace\ninteractions\n5.1.\nFace to face\n5.2.\nTelephone\n5.3.\nElectronic and two way radio\n5.4.\nWritten including electronic, memos, instruction and forms,\nnon-verbal including gestures, signals, signs and diagrams\n6. Protocols\n6.1.\nObserving meeting\n6.2.\nCompliance with meeting decisions\n6.3.\nObeying meeting instructions\n\n--- PDF PAGE 8 ---\nTR Laboratory and Metrology/Calibration Services NC II Promulgated\n- 4 -\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1.\nPrepared written communication following standard format of\nthe organization\n1.2.\nAccessed information using communication equipment\n1.3.\nMade use of relevant terms as an aid to transfer information\neffectively\n1.4.\nConveyed information effectively adopting the formal or\ninformal communication\n2. Underpinning\nknowledge and\nattitudes\n\n2.1.\nEffective communication\n2.2.\nDifferent modes of communication\n2.3.\nWritten communication\n2.4.\nOrganizational policies\n2.5.\nCommunication procedures and systems\n2.6.\nTechnology relevant to the enterprise and the individual’s\nwork responsibilities\n3. Underpinning skills\n3.1.\nFollow simple spoken language\n3.2.\nPerform routine workplace duties following simple written\nnotices\n3.3.\nParticipate in workplace meetings and discussions\n3.4.\nComplete work related documents\n3.5.\nEstimate, calculate and record routine workplace measures\n3.6.\nBasic mathematical processes of addition, subtraction,\ndivision and multiplication\n3.7.\nAbility to relate to people of social range in the workplace\n3.8.\nGather and provide information in response to workplace\nRequirements\n4. Resource\nimplications\n4.1.\nFax machine\n4.2.\nTelephone\n4.3.\nWriting materials\n4.4.\nInternet\n5. Method of\nassessment\n5.1.\nDirect observation\n5.2.\nOral interview and written test\n6. Context of\nassessment\n6.1.\nCompetency may be assessed individually in the actual\nworkplace or through accredited institution\n\n--- PDF PAGE 9 ---\nTR Laboratory and Metrology/Calibration Services NC II Promulgated\n- 5 -\nUNIT OF COMPETENCY :\nWORK IN TEAM ENVIRONMENT\n\nUNIT CODE\n:\n500311106\n\nUNIT DESCRIPTOR\n:\nThis unit covers the skills, knowledge and attitudes to identify role\nand responsibility as a member of a team.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Describe team role\nand scope\n1.1.\nThe role and objective of the team is identified from\navailable sources of information\n1.2.\nTeam parameters, reporting relationships and responsibilities\nare identified from team discussions and appropriate external\nsources\n2. Identify own role and\nresponsibility within\nteam\n2.1.\nIndividual role and responsibilities within the team\nenvironment are identified\n2.2.\nRoles and responsibility of other team members are identified\nand recognized\n2.3.\nReporting relationships within team and external to team are\nidentified\n3. Work as a team\nmember\n3.1.\nEffective and appropriate forms of communications used and\ninteractions undertaken with team members who contribute to\nknown team activities and objectives\n3.2.\nEffective and appropriate contributions made to complement\nteam activities and objectives, based on individual skills and\ncompetencies and workplace context\n3.3.\nObserved protocols in reporting using standard operating\nprocedures\n3.4.\nContribute to the development of team work plans based on\nan understanding of team’s role and objectives and individual\ncompetencies of the members.\n\n--- PDF PAGE 10 ---\nTR Laboratory and Metrology/Calibration Services NC II Promulgated\n- 6 -\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Role and objective of\nteam\n1.1.\nWork activities in a team environment with enterprise or\nspecific sector\n1.2.\nLimited discretion, initiative and judgment maybe\ndemonstrated on the job, either individually or in a team\nenvironment\n2. Sources of\ninformation\n2.1.\nStandard operating and/or other workplace procedures\n2.2.\nJob procedures\n2.3.\nMachine/equipment manufacturer’s specifications and\ninstructions\n2.4.\nOrganizational or external personnel\n2.5.\nClient/supplier instructions\n2.6.\nQuality standards\n2.7.\nOHS and environmental standards\n3. Workplace context\n3.1.\nWork procedures and practices\n3.2.\nConditions of work environments\n3.3.\nLegislation and industrial agreements\n3.4.\nStandard work practice including the storage, safe handling\nand disposal of chemicals\n3.5.\nSafety, environmental, housekeeping and quality guidelines\n\n--- PDF PAGE 11 ---\nTR Laboratory and Metrology/Calibration Services NC II Promulgated\n- 7 -\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1.\nOperated in a team to complete workplace activity\n1.2.\nWorked effectively with others\n1.3.\nConveyed information in written or oral form\n1.4.\nSelected and used appropriate workplace language\n1.5.\nFollowed designated work plan for the job\n1.6.\nReported outcomes\n2. Underpinning\nknowledge and\nattitude\n2.1.\nCommunication process\n2.2.\nTeam structure\n2.3.\nTeam roles\n2.4.\nGroup planning and decision making\n3. Underpinning skills\n3.1.\nCommunicate appropriately, consistent with the culture of the\nworkplace\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1.\nAccess to relevant workplace or appropriately simulated\nenvironment where assessment can take place\n4.2.\nMaterials relevant to the proposed activity or tasks\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1.\nObservation of the individual member in relation to the work\nactivities of the group\n5.2.\nObservation of simulation and or role play involving the\nparticipation of individual member to the attainment of\norganizational goal\n5.3.\nCase studies and scenarios as a basis for discussion of\nissues and strategies in teamwork\n6. Context of\nassessment\n6.1.\nCompetency may be assessed in workplace or in a simulated\nworkplace setting\n6.2.\nAssessment shall be observed while task are being\nundertaken whether individually or in group\n\n--- PDF PAGE 12 ---\nTR Laboratory and Metrology/Calibration Services NC II Promulgated\n- 8 -\nUNIT OF COMPETENCY : PRACTICE CAREER PROFESSIONALISM\n\nUNIT CODE\n:\n500311107\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes in promoting\ncareer growth and advancement.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Integrate personal\nobjectives with\norganizational goals\n1.1\nPersonal growth and work plans are pursued towards\nimproving the qualifications set for the profession\n1.2\nIntra and interpersonal relationships is are maintained in the\ncourse of managing oneself based on performance\nevaluation\n1.3\nCommitment to the organization and its goal is demonstrated\nin the performance of duties\n2. Set and meet work\npriorities\n2.1\nCompeting demands are prioritized to achieve personal, team\nand organizational goals and objectives.\n2.2\nResources are utilized efficiently and effectively to mana