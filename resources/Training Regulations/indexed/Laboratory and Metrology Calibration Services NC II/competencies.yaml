        "source_title": "PERFORM PRECISION MECHANICAL MEASUREMENT",
        "source_text": "--- PDF PAGE 33 ---\nTR Laboratory and Metrology/Calibration Services NC II   Promulgated \n- 29 - \n \n \nUNIT OF COMPETENCY :  \nPERFORM PRECISION MECHANICAL MEASUREMENT \n \nUNIT CODE  \n \n:  \nALT315306 \n \nUNIT DESCRIPTOR           :  \nThis unit covers performing precision mechanical measurement \n(with less than 0.01mm/0.025 inch tolerance) by using precision \nmeasuring equipment, setting comparison measuring devices \nand maintaining precision equipment. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n(All inspections methods are carried out according to industry \nregulations/guidelines, occupational health and safety and company \nprocedures)\n \n1. Use precision \nmeasurement equipment \n \n \n \n1.1 Appropriate precision mechanical equipment is selected \nto achieve specified outcome. \n1.2 Correct and appropriate measuring techniques are used \nfor the measurement task. \n1.3 Measurements are taken accurately to the finest graduation \nof instrument. \n1.4 Readings and measurements are interpreted correctly and \naccurately.\n \n2. Set comparative \nmeasuring devices \n \n2.1 Statistical analyses of previous measurements are \nconducted in accordance with standard operating \nprocedures. \n2.2 Comparative measuring equipment is set to specifications \nusing manufacturer guidelines or standard operating \nprocedures and techniques. \n \n3. Maintain precision \nequipment \n3.1 Measuring equipment is adjusted and maintained to \nrequired accuracy, using manufacturer or standard \noperating procedures and techniques. \n3.2 Equipment is stored to manufacturer specifications or \nstandard operating procedures.\n\n--- PDF PAGE 34 ---\nTR Laboratory and Metrology/Calibration Services NC II   Promulgated \n- 30 - \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.   Industry regulations/ \nguidelines \nStrict adherence to automotive manufacturing standards such as: \n1.1.1  Japanese industrial standards (JIS) \n1.1.2  Society of Automotive Engineers (SAE) \n1.1.3  American Society of Testing Materials (ASTM) \n1.2  Compliance to Local Government Unit (LGU) or Department \nof Environment and Natural Resources (DENR) regulations  \n1.2.1  Handling, storing and disposal of chemical and other \nwastes \n1.2.2  Pollution control   \n1.3  Provision of safety devices to equipment e.g. safety or limit \nswitches, guards or railings \n1.4  Use of personal protective equipment (cap, safety shoes, face \nshield/safety goggles, shop uniform) \n \n2. Precision mechanical \nequipment  \n \n \n2.1 Strip gauges  \n2.2 Engineering \nsquares  \n2.3 Gauge blocks \n2.4 Sine bars \n2.5 Angle gauges  \n2.6 Polygons  \n2.7 Dividing heads  \n2.8 Bore gauge \n \n2.9 \nRotary tables \n2.10 Precision levels \n2.11 Vernier calipers \n2.12 Micrometers \n2.13 Height gauges \n2.14 Hardness testers \n2.15 Texture measuring equipment \n2.16 Surface plate (Granite) \n2.17 Air gauge \n \n3. Appropriate measuring \ntechniques \n \n \nIncludes considerations of the suitability of the \nenvironmental conditions for measurements being taken such as \n3.1  set up of parts/components to be measured \n3.2  temperature \n3.3  relative humidity \n3.4  barometric pressure \n3.5  surface stability \n \n4. Measurements \n \n4.1 Length  \n4.2 Circular  \n4.3 Straightness  \n4.4 Flatness  \n4.5 Hardness  \n4.6 Angles \n \n4.7 \nFinishes  \n4.8 \nTextures  \n4.9 \nRoundness \n4.10 Squareness  \n4.11 Alignment  \n4.12 Coordinate measurement etc. on \ncomponents or equipment\n\n--- PDF PAGE 35 ---\nTR Laboratory and Metrology/Calibration Services NC II   Promulgated \n- 31 - \nEVIDENCE GUIDE \n \n1. Critical aspects \nof competency \nAssessment requires evidence that the candidate: \n1.1 Used precision measuring instrument \n1.2 Had set comparative measuring devices \n1.3 Maintained precision measuring instrument.\n \n2. Underpinning \nknowledge and \nattitudes \n2.1 Precision mechanical measuring device for given measurement  \n2.2 Procedures to verify equipment being used has been calibrated \n2.3 Environmental conditions for the measurements being carried out \n2.4 Procedures/techniques for obtaining a range of mechanical \nmeasurements \n2.5 Accuracy to which a range of precision mechanical measuring devices \ncan be read \n2.6 Procedures for reading graduated mechanical measuring devices \n2.7 Units of measurement and numerical operations  \n2.8 Procedures for setting precision mechanical measuring devices \n2.9 Specifications of the equipment to be set \n2.10 Tools and equipment for setting mechanical measuring devices \n2.11 Adjustments that can be made to a range of precision mechanical \nmeasuring devices \n2.12 Procedures for adjusting and maintaining precision mechanical \nmeasuring devices \n2.13  Procedures for storing precision mechanical measuring devices \n2.14 Hazards and control measures associated with precision mechanical \nmeasurement, including housekeeping \n2.15 Safe work practices and procedures\n \n3. Underpinning \nskills \n3.1 Reading and interpreting text and numerical information on \nmanufacturer specifications, standard operating procedures, charts, \nlists, drawings and other applicable reference documents \n3.2 Selecting/using precision mechanical measuring devices \n3.3 Setting measuring devices to specification \n3.4 Obtaining specified mechanical measurements to the finest graduation \nof the device \n3.5  Measuring components to specified tolerances \n3.6 Reading and interpreting measurements \n3.7 Maintaining and adjusting precision mechanical measuring devices \nstoring precision mechanical measuring devices \n3.8 Undertaking calculations and numerical operations for measurement \nusing precision mechanical measuring equipment\n \n4. Resource \nimplications \nThe following resources MUST be provided: \n4.1 Workplace: Real or simulated work area \n4.2  Access to all tools & equipment materials and documentations  \n4.3 Relevant workplace procedures, product and manufacturing \nspecifications, codes, standards, manuals and reference materials\n \n5. Method of \nassessment \nCandidate MUST be assessed through: \n5.1 Observation with questioning \n5.2 Portfolio \n5.3 Third party report\n \n6. Context of \nassessment \n \n6.1 This unit may be assessed on the job, off the job or a \ncombination of both on and off the job.  \n6.2 Where assessment occurs off the job, that is the candidate is not in \nproductive work, then an appropriate simulation must be used where \nthe range of conditions reflects realistic workplace situations.\n",
        "required_knowledge": null,
        "required_skills": null
