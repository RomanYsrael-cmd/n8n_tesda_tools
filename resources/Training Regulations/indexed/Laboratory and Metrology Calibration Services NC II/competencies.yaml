rial\n3.2 Cleaning grease/lubricants\n3.3 Disposing of wastes and fluid\n3.4 Preparing inventory of s/m and tools and equipment\n3.5\nMonitoring of s/m and tools/equipment\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Workplace: Real or simulated work area\n4.2 Appropriate Tools & equipment\n4.3\nMaterials relevant to the activity\n5. Method of\nassessment\nCompetency MUST be assessed through:\n5.1 Written/Oral Questioning\n5.2\nDemonstration\n6. Context of\nassessment\n6.1\nCompetency must be assessed on the job or in a simulated\nenvironment.\n6.2\nThe assessment of practical skills must take place after a period\nof supervised practice and repetitive experience.\n\n--- PDF PAGE 30 ---\nTR Laboratory and Metrology/Calibration Services NC II Promulgated\n- 26 -\n\nCORE COMPETENCIES\n\nUNIT OF COMPETENCY\n:\nPERFORM ENGINEERING MEASUREMENTS\n\nUNIT CODE\n\n:\nALT315305\n\nUNIT DESCRIPTOR\n:\nThis unit covers the skills, knowledge and attitudes\nrequired in measuring parts and components (with more than\n0.01mm/0.025 inch tolerance) using mechanical measuring\ndevices and associated calculations.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variable\n(All inspections methods are carried out according to industry\nregulations/guidelines, occupational health and safety and company\nprocedures)\n\n1. Select appropriate device\nor equipment\n\n1.1 Measurement requirements are determined from\nspecifications.\n1.2 Appropriate device or equipment is selected according to\nstandard operating procedures, to achieve required\noutcome.\n\n2. Obtain measurements\nusing a range of\nmeasuring devices\n\n2.1 Correct and appropriate measuring technique is used.\n2.2 Measurements are accurately obtained using a range of\nmeasuring devices.\n2.3 Dimensions are determined or verified using basic\ncalculations, where required.\n\n3. Maintain measuring\ndevices\n\n3.1 Routine care and storage of devices is undertaken to\nmanufacturers’ specifications or standard operating\nprocedures.\n3.2 Routine adjustments to devices are made and checked.\n\n4. Communicate\nmeasurements as\nrequired\n\n4.1 Measurements are accurately recorded, where required.\n4.2 Freehand sketch which depicts required information is\nprepared, as required.\n\n--- PDF PAGE 31 ---\nTR Laboratory and Metrology/Calibration Services NC II Promulgated\n- 27 -\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Industry\nregulations/\nguidelines\n1.1 Strict adherence to automotive manufacturing standards such as:\n1.1.1 Japanese industrial standards (JIS)\n1.1.2 Society of Automotive Engineers (SAE)\n1.1.3 American Society of Testing Materials (ASTM)\n1.2 Compliance to Local Government Unit (LGU) or Department of\nEnvironment and Natural Resources (DENR) regulations\n1.2.1 Handling, storing and disposal of chemical and other\nwastes\n1.2.2 Pollution control\n1.3 Provision of safety devices to equipment e.g. safety or limit\nswitches, guards or railings\n1.4 Use of personal protective equipment (cap, safety shoes, face\nshield/safety goggles, shop uniform)\n\n2. Specifications\n\n2.1 Drawings\n2.2 Sketches\n2.3 Job instructions\n2.4 Schematics\n2.5 Diagrams\n2.6 Technical manual\n\n3. Measuring\ndevices\n3.1 Protractors\n3.2 Combination squares\n3.3 Jet squares\n3.4 Dial indicators\n3.5 Height gauges\n3.6 Tapes\n3.7 Rules\n3.8 Micrometers\n3.9 Vernier scaled measuring\nequipment\n\n4. Basic calculations\nCalculations needed to assist in determining measurements where a\nreading of the graduated device is not sufficient, for example\nsubtracting one measurement from another to give a third\nmeasurement. Examples of calculations needed are:\n3.1 Addition\n3.2 Subtraction\n3.3 Multiplication\n3.4 Division\n3.5 Fractions\n3.6 Decimals\nCalculations may be made using a calculator or if applicable can be\nmanual calculation\n\n5. Routine\nadjustments\nValidating the device using\n5.1 simple zeroing\n5.2 scale adjustment\n\n6. Measurements\n5.1 Measuring length\n5.2 Squareness\n5.3 Flatness\n5.4 Angle\n5.5 Roundness\n5.6 Clearances or any other measurements that can be read off\n5.7 analog measuring device\n7. Information\n6.1 Dimensions\n6.2 Instructions\n6.3 Base line or datum points\n\n--- PDF PAGE 32 ---\nTR Laboratory and Metrology/Calibration Services NC II Promulgated\n- 28 -\n\nEVIDENCE GUIDE\n\n1. Critical aspects\nof competency\n\nAssessment requires evidence that the candidate:\n1.1 Selected the appropriate measuring instrument\n1.2 Computed/Obtained measurement using the required measuring\ninstrument\n1.3 Maintained measuring instruments\n1.4 Prepared the necessary reports or computation as required.\n\n2. Underpinning\nknowledge and\nattitudes\n2.1 Correct application of a range of measuring devices\n2.2 Correct and appropriate measuring technique for a range\nof measuring devices\n2.3 Addition, subtraction, multiplication, division, fractions,\ndecimals to the scope required by this unit\n2.4 Procedures for handling and storing a range of measuring devices\n2.5 Procedures for adjusting and zeroing a range of measuring devices\n2.6 Methods of communicating measurements by drawings as required\n2.7 Safe work practices and procedures\n\n3. Underpinning\nskills\n3.1 Reading, interpreting and following information on written job\ninstructions, specifications, standard operating procedures, charts,\nlists, drawings and other applicable reference documents\n3.2 Planning and sequencing operations\n3.3 Checking and clarifying task related information\n3.4 Checking for conformance to specifications\n3.5 Undertaking numerical operations involving addition, subtraction,\nmultiplication, division, fractions and decimals\n3.6 Preparing drawings as required\n3.7 Selecting the appropriate measuring device for given measuring tasks\n3.8 Using appropriate measuring technique\n3.8 Reading all measurements taken accurately to the finest\ngraduation of the selected measuring device\n3.10 Handling and storing measuring devices in accordance with\nmanufacturers' specifications or standard operating procedures\n3.11 Verifying all measuring devices before use\n3.12 Making routine adjustments to measuring devices\n\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Workplace: Real or simulated work area\n4.2 Access to all tools & equipment materials and documentations\nrequired\n4.3 Relevant workplace procedures, product and manufacturing\nspecifications, codes, standards, manuals and reference materials\n\n5. Method of\nassessment\nCandidate MUST be assessed through:\nObservation with questioning\nPortfolio\nThird party report\n\n6. Context of\nassessment\n\n6.1 This unit may be assessed on the job, off the job or a\ncombination of both on and off the job.\n6.2 Where assessment occurs off the job, that is the candidate is not in\nproductive work, then an appropriate simulation must be used where\nthe range of conditions reflects realistic workplace situations.\n6.3 The competencies covered by this unit would be\ndemonstrated by an individual working alone or as part of a team.\n\n--- PDF PAGE 33 ---\nTR Laboratory and Metrology/Calibration Services NC II Promulgated\n- 29 -\n\nUNIT OF COMPETENCY :\nPERFORM PRECISION MECHANICAL MEASUREMENT\n\nUNIT CODE\n\n:\nALT315306\n\nUNIT DESCRIPTOR :\nThis unit covers performing precision mechanical measurement\n(with less than 0.01mm/0.025 inch tolerance) by using precision\nmeasuring equipment, setting comparison measuring devices\nand maintaining precision equipment.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n(All inspections methods are carried out according to industry\nregulations/guidelines, occupational health and safety and company\nprocedures)\n\n1. Use precision\nmeasurement equipment\n\n1.1 Appropriate precision mechanical equipment is selected\nto achieve specified outcome.\n1.2 Correct and appropriate measuring techniques are used\nfor the measurement task.\n1.3 Measurements are taken accurately to the finest graduation\nof instrument.\n1.4 Readings and measurements are interpreted correctly and\naccurately.\n\n2. Set comparative\nmeasuring devices\n\n2.1 Statistical analyses of previous measurements are\nconducted in accordance with standard operating\nprocedures.\n2.2 Comparative measuring equipment is set to specifications\nusing manufacturer guidelines or standard operating\nprocedures and techniques.\n\n3. Maintain precision\nequipment\n3.1 Measuring equipment is adjusted and maintained to\nrequired accuracy, using manufacturer or standard\noperating procedures and techniques.\n3.2 Equipment is stored to manufacturer specifications or\nstandard operating procedures.\n\n--- PDF PAGE 34 ---\nTR Laboratory and Metrology/Calibration Services NC II Promulgated\n- 30 -\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Industry regulations/\nguidelines\nStrict adherence to automotive manufacturing standards such as:\n1.1.1 Japanese industrial standards (JIS)\n1.1.2 Society of Automotive Engineers (SAE)\n1.1.3 American Society of Testing Materials (ASTM)\n1.2 Compliance to Local Government Unit (LGU) or Department\nof Environment and Natural Resources (DENR) regulations\n1.2.1 Handling, storing and disposal of chemical and other\nwastes\n1.2.2 Pollution control\n1.3 Provision of safety devices to equipment e.g. safety or limit\nswitches, guards or railings\n1.4 Use of personal protective equipment (cap, safety shoes, face\nshield/safety goggles, shop uniform)\n\n2. Precision mechanical\nequipment\n\n2.1 Strip gauges\n2.2 Engineering\nsquares\n2.3 Gauge blocks\n2.4 Sine bars\n2.5 Angle gauges\n2.6 Polygons\n2.7 Dividing heads\n2.8 Bore gauge\n\n2.9\nRotary tables\n2.10 Precision levels\n2.11 Vernier calipers\n2.12 Micrometers\n2.13 Height gauges\n2.14 Hardness testers\n2.15 Texture measuring equipment\n2.16 Surface plate (Granite)\n2.17 Air gauge\n\n3. Appropriate measuring\ntechniques\n\nIncludes considerations of the suitability of the\nenvironmental conditions for measurements being taken such as\n3.1 set up of parts/components to be measured\n3.2 temperature\n3.3 relative humidity\n3.4 barometric pressure\n3.5 surface stability\n\n4. Measurements\n\n4.1 Length\n4.2 Circular\n4.3 Straightness\n4.4 Flatness\n4.5 Hardness\n4.6 Angles\n\n4.7\nFinishes\n4.8\nTextures\n4.9\nRoundness\n4.10 Squareness\n4.11 Alignment\n4.12 Coordinate measurement etc. on\ncomponents or equipment\n\n--- PDF PAGE 35 ---\nTR Laboratory and Metrology/Calibration Services NC II Promulgated\n- 31 -\nEVIDENCE GUIDE\n\n1. Critical aspects\nof competency\nAssessment requires evidence that the candidate:\n1.1 Used precision measuring instrument\n1.2 Had set comparative measuring devices\n1.3 Maintained precision measuring instrument.\n\n2. Underpinning\nknowledge and\nattitudes\n2.1 Precision mechanical measuring device for given measurement\n2.2 Procedures to verify equipment being used has been calibrated\n2.3 Environmental conditions for the measurements being carried out\n2.4 Procedures/techniques for obtaining a range of mechanical\nmeasurements\n2.5 Accuracy to which a range of precision mechanical measuring devices\ncan be read\n2.6 Procedures for reading graduated mechanical measuring devices\n2.7 Units of measurement and numerical operations\n2.8 Procedures for setting precision mechanical measuring devices\n2.9 Specifications of the equipment to be set\n2.10 Tools and equipment for setting mechanical measuring devices\n2.11 Adjustments that can be made to a range of precision mechanical\nmeasuring devices\n2.12 Procedures for adjusting and maintaining precision mechanical\nmeasuring devices\n2.13 Procedures for storing precision mechanical measuring devices\n2.14 Hazards and control measures associated with precision mechanical\nmeasurement, including housekeeping\n2.15 Safe work practices and procedures\n\n3. Underpinning\nskills\n3.1 Reading and interpreting text and numerical information on\nmanufacturer specifications, standard operating procedures, charts,\nlists, drawings and other applicable reference documents\n3.2 Selecting/using precision mechanical measuring devices\n3.3 Setting measuring devices to specification\n3.4 Obtaining specified mechanical measurements to the finest graduation\nof the device\n3.5 Measuring components to specified tolerances\n3.6 Reading and interpreting measurements\n3.7 Maintaining and adjusting precision mechanical measuring devices\nstoring precision mechanical measuring devices\n3.8 Undertaking calculations and numerical operations for measurement\nusing precision mechanical measuring equipment\n\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Workplace: Real or simulated work area\n4.2 Access to all tools & equipment materials and documentations\n4.3 Relevant workplace procedures, product and manufacturing\nspecifications, codes, standards, manuals and reference materials\n\n5. Method of\nassessment\nCandidate MUST be assessed through:\n5.1 Observation with questioning\n5.2 Portfolio\n5.3 Third party report\n\n6. Context of\nassessment\n\n6.1 This unit may be assessed on the job, off the job or a\ncombination of both on and off the job.\n6.2 Where assessment occurs off the job, that is the candidate is not in\nproductive work, then an appropriate simulation must be used where\nthe range of conditions reflects realistic workplace situations.\n\n--- PDF PAGE 36 ---\nTR Laboratory and Metrology/Calibration Services NC II Promulgated\n- 32 -\n UNIT OF COMPETENCY :\n CALIBRATE MEASURING EQUIPMENT\n\nUNIT CODE\n\n:\nALT315307\n\nUNIT DESCRIPTOR\n:\nThis unit covers checking engineering and precision measuring\nequipment for correct operation, and validating/calibrating\nprecision measuring equipment in accordance with\npredetermined procedures.\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n(All inspections methods are carried out according to industry\nregulations/guidelines, occupational health and safety and company\nprocedures)\n\n1. Check equipment for\ncorrect operation\n\nStatistical analyses of previous measurements are conducted\nin accordance with standard operating procedures.\nPhysical conditions of measuring equipment are checked in\naccordance with standard operating procedures.\n\n2. Validate/calibrate\nprecision measuring\nequipment\n\n2.1 Calibration of precision measuring equipment is assessed to\nmanufacturers’ specifications and/or standard operating\nprocedures.\n2.2 Equipment is calibrated against appropriate physical\nstandards using correct calibration devices, equipment,\ntechniques using predetermined procedures.\n2.3 Equipment is recommissioned in accordance with standard\noperating procedures.\n2.4 Calibration activity is recorded, updated and stored.\n\n--- PDF PAGE 37 ---\nTR Laboratory and Metrology/Calibration Services NC II Promulgated\n- 33 -\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n\n1. Physical condition\n\nComponents are checked for\n\nwear\n\nloose connections\n\nother faults\n2. Physical standards\n\nReference standards of:\n2.1 Mass length\n2.2 Time\n2.3 Temperature\n2.4 Pressure\n2.5 Volume\n2.6 Process characteristics etc.\n\n3. Calibration devices,\nequipment\n\n3.1 Micrometer\n3.2 All types of calipers\n3.3 Gauge blocks (bores, squares, micrometer blocks, etc.)\n3.4 Voltmeter\n3.5 Oscilloscope\n3.6 All types of comparators\n3.7 Jigs and fixtures\n3.8 Templates, protractors, patterns etc.\n3.9 Ultrasonics\n\n4. Recommissioned\n\n5.1 Sealing\n5.2 Tagging\n5.3 Recommendation for usage/application\n5.4 Identification or storage in accordance with standard\noperating procedures\n\n--- PDF PAGE 38 ---\nTR Laboratory and Metrology/Calibration Services NC II Promulgated\n- 34 -\nEVIDENCE GUIDE\n\n1.Critical aspects\nof competency\n Assessment requires evidence that the candidate:\n1.1 checked equipment for correct operation\n1.2 validated/calibrated precision measuring equipment\n\n2. Underpinning\nknowledge and\nattitudes\n2.1 Precision mechanical measuring device for given measurement\n2.2 Procedures to verify equipment being used has been calibrated\n2.3 Environmental conditions for the measurements being carried out\n2.4 Procedures/techniques for obtaining a range of mechanical\nmeasurements\n2.5 Accuracy to which a range of precision mechanical measuring devices\ncan be read\n2.6 Measuring equipment specifications, operation, wearing\n2.7 parts, connections and components\n2.8 Procedures for reading graduated mechanical measuring devices\n2.9 Units of measurement and numerical operations\n2.10 Procedures for setting precision mechanical measuring devices\n2.11 Specifications of the equipment to be set\n2.12 Tools and equipment for setting mechanical measuring devices\n2.13 Adjustments that can be made to a range of precision mechanical\nmeasuring devices\n2.14 Common fault(s) that may be found in the measuring equipment\n2.15 Effects of faults on the performance/accuracy of the measuring\nequipment\n2.16 General knowledge of standards, legislative or regulatory\nrequirements applicable to the measuring equipment and/or its\ncalibration\n2.17 standard operating procedures for calibrating the measuring\nequipment and the tools and equipment required to do so\n2.18 Standard operating procedures for commissioning the measuring\nequipment\n2.19 Calibration records to be kept/maintained in accordance with\nstandard operating procedures\n2.20 Procedures for adjusting and maintaining precision mechanical\nmeasuring devices\n2.21 Procedures for storing precision mechanical measuring devices\n2.22 Hazards and control measures associated with precision\nmechanical measurement, including housekeeping\n2.23\nSafe work practices and procedures\n\n3. Underpinning\nskills\n3.1\nInterpreting work requirements\n3.2\nUsing appropriate tools and equipment to check measuring\nequipment for faults\n3.3\nUsing appropriate techniques to check the calibration of the\nmeasuring equipment for conformance to specifications\n3.4\nCalibrating the measuring equipment against the appropriate\nphysical standard\n3.5\nRecommissioning the measuring equipment\n3.6\nUsing literacy and numeracy skills to enable correct completion of\ncalibration records\n3.7\nChecks that are to be made of the measuring equipment\nand the tools and equipment to be used when checking the\nmeasuring equipment\n\n--- PDF PAGE 39 ---\nTR Laboratory and Metrology/Calibration Services NC II Promulgated\n- 35 -\n\n4 Resource\nimplications\nThe following resources MUST be provided:\n4.1 Workplace: Real or simulated work area\n4.2 Access to all tools & equipment materials and documentations\n4.3 Relevant workplace procedures, product and manufacturing\nspecifications, codes, standards, manuals and reference materials\n\n5 Method of\nassessment\nCandidate MUST be assessed through:\n5.1 Observation with questioning\n5.2 Portfolio\n5.3Third party report\n\n6 Context of\nassessment\n6.1 This unit may be assessed on the job, off the job or a\ncombination of both on and off the job.\n6.2 Where assessment occurs off the job, that is the candidate is not in\nproductive work, then an appropriate simulation must be used where\nthe range of conditions reflects realistic workplace situations.\n\n--- PDF PAGE 40 ---\nTR Laboratory and Metrology/Calibration Services NC II Promulgated\n- 36 -"
