        "evidence_guide": {
          "source_text": "1. Critical aspects \nof competency \n \nAssessment requires evidence that the candidate: \n1.1 Selected the appropriate measuring instrument  \n1.2 Computed/Obtained measurement using the required measuring \ninstrument \n1.3 Maintained measuring instruments \n1.4 Prepared the necessary reports or computation as required.\n \n2. Underpinning \nknowledge and \nattitudes \n2.1 Correct application of a range of measuring devices \n2.2 Correct and appropriate measuring technique for a range \nof measuring devices \n2.3 Addition, subtraction, multiplication, division, fractions, \ndecimals to the scope required by this unit \n2.4 Procedures for handling and storing a range of measuring devices \n2.5 Procedures for adjusting and zeroing a range of measuring devices \n2.6 Methods of communicating measurements by drawings as required \n2.7 Safe work practices and procedures\n \n3. Underpinning \nskills \n3.1 Reading, interpreting and following information on written job \ninstructions, specifications, standard operating procedures, charts, \nlists, drawings and other applicable reference documents \n3.2 Planning and sequencing operations \n3.3 Checking and clarifying task related information \n3.4 Checking for conformance to specifications \n3.5  Undertaking numerical operations involving addition, subtraction, \nmultiplication, division, fractions and decimals  \n3.6 Preparing drawings as required \n3.7 Selecting the appropriate measuring device for given measuring tasks \n3.8 Using appropriate measuring technique \n3.8 Reading all measurements taken accurately to the finest \ngraduation of the selected measuring device \n3.10 Handling and storing measuring devices in accordance with \nmanufacturers' specifications or standard operating procedures \n3.11 Verifying all measuring devices before use \n3.12  Making routine adjustments to measuring devices\n \n4. Resource \nimplications \nThe following resources MUST be provided: \n4.1 Workplace: Real or simulated work area \n4.2  Access to all tools & equipment materials and documentations \nrequired \n4.3 Relevant workplace procedures, product and manufacturing \nspecifications, codes, standards, manuals and reference materials\n \n5. Method of \nassessment  \nCandidate MUST be assessed through: \nObservation with questioning \nPortfolio \nThird party report\n \n6. Context of \nassessment \n \n6.1 This unit may be assessed on the job, off the job or a \ncombination of both on and off the job.  \n6.2 Where assessment occurs off the job, that is the candidate is not in \nproductive work, then an appropriate simulation must be used where \nthe range of conditions reflects realistic workplace situations.  \n6.3 The competencies covered by this unit would be \ndemonstrated by an individual working alone or as part of a team.",
