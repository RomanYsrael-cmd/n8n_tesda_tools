  "source_text": "SECTION 4\nNATIONAL ASSESSMENT AND CERTIFICATION\nARRANGEMENTS\n\n4.1\nTo attain the National Qualification of HEAVY EQUIPMENT OPERATION\n(Crawler Crane) NC II, the candidate must demonstrate competence in all\nthe units of competency listed in Section 1. The successful candidate shall\nbe awarded a National Certificate signed by the TESDA Director General.\n\n4.2\nThe qualification of HEAVY EQUIPMENT OPERATION (Crawler Crane)\nNC II may be attained through demonstration of competence in a project-\ntype assessment covering the following core units. Candidates may apply\nfor assessment in any accredited assessment center.\n\n4.2.1 Crawler Crane operation\n Perform pre- and post-operation for lifting equipment\n Perform productive operation for crawler crane\n Perform basic preventive maintenance servicing for lifting\nequipment\n\n4.3\nAssessment shall focus on the core units of competency. The basic and\ncommon units shall be integrated or assessed concurrently with the core\nunits.\n\n4.4\nThe following are qualified to apply for assessment and certification:\n\n4.4.1 Graduates of formal, non-formal and/or informal training including\nenterprise-based training programs\n\n4.4.2 Experienced Workers (wage-employed or self-employed)\n\nThe guidelines on assessment and certification are discussed in detail in\nthe \"Procedures Manual on Assessment and Certification\" and \"Guidelines on\nthe Implementation of the Philippine TVET Qualification and Certification System\n(PTQCS).\"\n\n--- PDF PAGE 76 ---\nTR HEAVY EQUIPMENT OPERATION\n\n"
