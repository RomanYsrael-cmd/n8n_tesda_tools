      "term": "For the purpose of these Competency Standards, the words",
      "definition": "1. Attachment Refers to anything like clampshell, dragline, boring/rotary (drilling) equipment, pile driver, drop hammer or other accessories/special attachments used instead of the conventional lift block to perform different types of lifting jobs. 2. Boom (crane) Refers to lattice type of boom or jib used for supporting the hoisting tackle. 3. Boom Length Refers to the measurement from the boom foot pins to the center of the boom point sheaves. 4. Lattice Boom Refers to a movable mechanical part of the crane carrying the hoisting gear; it is made up of a network of crisscrossed strips of metal 5. Reeving Refers to a rope system in which the rope travels around the drums and sheaves. 7. Crawler Crane Refers to a mobile type of crane consists of rotating superstructure with power plant operating machinery, and lattice boom mounted on a base, equipped with thread (track assembly) for travel. In addition to its primary use for lifting services, it is designed also for duty cycle operations such as dragline, clampshell and magnet operations. It is normally controlled by a system of brakes, clutches, and torque converters. This equipment is classified based on 75 percent of its tipping capacity. 7. Standard Refers to a degree or level of requirement set by the manufacturer. 8. Stability Refers to the machine resistance to overturning (Truck Mounted"
    },
