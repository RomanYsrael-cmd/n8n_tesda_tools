      "term": "Crane",
      "definition": "lifting on outriggers are based on 85 percent of the tipping capacity). 9. Safety Devices Refer to boom angle indicators, load moment indicators, anti-two blocking devices (where applicable), boom kick out lever, etc. 10. Work Area Refers to any place inside the swing circle of the crane. It must be barricaded off and only those directly involve in the lift shall be allowed to entry."
