  "source_text": "For the purpose of these Competency Standards, the words\n\n1. Attachment\nRefers to anything like clampshell, dragline, boring/rotary (drilling)\nequipment, pile driver, drop hammer or other accessories/special\nattachments used instead of the conventional lift block to perform\ndifferent types of lifting jobs.\n2. Boom (crane)\nRefers to lattice type of boom or jib used for supporting the\nhoisting tackle.\n3. Boom Length\nRefers to the measurement from the boom foot pins to the center\nof the boom point sheaves.\n4. Lattice Boom\nRefers to a movable mechanical part of the crane carrying the\nhoisting gear; it is made up of a network of crisscrossed strips of\nmetal\n5. Reeving\nRefers to a rope system in which the rope travels around the\ndrums and sheaves.\n7. Crawler Crane\nRefers to a mobile type of crane consists of rotating\nsuperstructure with power plant operating machinery, and lattice\nboom mounted on a base, equipped with thread (track assembly)\nfor travel. In addition to its primary use for lifting services, it is\ndesigned also for duty cycle operations such as dragline,\nclampshell and magnet operations. It is normally controlled by a\nsystem of brakes, clutches, and torque converters. This\nequipment is classified based on 75 percent of its tipping\ncapacity.\n7. Standard\nRefers to a degree or level of requirement set by the\nmanufacturer.\n8. Stability\nRefers to the machine resistance to overturning (Truck Mounted\nCrane - lifting on outriggers are based on 85 percent of the tipping\ncapacity).\n9. Safety Devices\nRefer to boom angle indicators, load moment indicators, anti-two\nblocking devices (where applicable), boom kick out lever, etc.\n10. Work Area\n\nRefers to any place inside the swing circle of the crane. It must be\nbarricaded off and only those directly involve in the lift shall be\nallowed to entry.\n\n--- PDF PAGE 78 ---\nTR HEAVY EQUIPMENT OPERATION",
