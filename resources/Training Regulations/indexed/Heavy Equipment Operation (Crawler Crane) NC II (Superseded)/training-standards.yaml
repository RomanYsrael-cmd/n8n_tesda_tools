    "source_text": "SECTION 3 TRAINING STANDARDS\n\nThese guidelines are set to provide the Technical and Vocational\nEducation and Training (TVET) providers with information and other important\nrequirements to consider when designing training programs for HEAVY\nEQUIPMENT OPERATION NC II.\n\n 3.1 CURRICULUM DESIGN\n\nCourse Title : HEAVY EQUIPMENT OPERATION - CRAWLER CRANE\nNC Level:\n\nBASIC COMPETENCIES\nNominal Training Hours: 18 Hours (Basic) + 18 Hours (Common)\nCourse Description:\n\nThis course is designed to equip individual with the basic, common and\ncore competencies in Construction Sector particularly in Heavy Equipment\nOperation.\n\nTo obtain this, all units prescribed for this qualification must be achieved:\n\nBASIC COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and convey\nworkplace information.\n1.2 Complete relevant work\n related documents\n1.3 Participate in\nworkplace meeting and\ndiscussion.\nGroup\ndiscussion\nInteraction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n2. Work in a team\n environment\n2.1 Describe and identify\nteam role and\nresponsibility in a team.\n2.2 Describe work as a team\nmember.\nDiscussion\nInteraction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n\n--- PDF PAGE 64 ---\nTR HEAVY EQUIPMENT OPERATION Promulgated December 2004/July 2007\n\n3. Practice career\nprofessionalism\n3.1 Integrate personal\nobjectives with\norganizational goals.\n3.2 Set and meet work\npriorities.\n3.3 Maintain professional\ngrowth and development.\nDiscussion\nInteraction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n4. Practice\noccupational\nhealth and safety\n4.1 Evaluate hazard and\nrisks\n4.2 Control hazards and risks\n4.3 Maintain occupational\nhealth and safety\nawareness\nDiscussion\nPlant tour\nSymposium\n• Observation\n• Interview\n\n--- PDF PAGE 65 ---\nTR HEAVY EQUIPMENT OPERATION Promulgated December 2004/July 2007\n\nCOMMON COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Prepare\nconstruction\nmaterials and\ntools\n1.8 Identify Materials\n1.9 Requisition\nMaterials\n1.10 Receive and\ninspect materials\nAudio Visual\nsimulation\nDiscussion\nPractical\nexercise\nDemonstration\n• Direct observation\n• Questions or\ninterview\n• Portfolio\n(credentials)\n• Written / Oral Test\n•\nDemonstration\n2. Observe\nprocedures,\nSpecifications\nand Manuals of\nInstructions\n2.1 Identify and access\nspecification/\nmanuals\nAudio Visual\nSimulation\nDiscussion\nPractical Lab\nDemonstration\n• Direct observation\n• Oral questioning\n• Written test or\nexamination\n• Third party report\n• Demonstration\n(able to impart\nknowledge and\nskills)\n3. Interpret\nTechnical\nDrawing\n3.1 Analyze sign,\nsymbols and data\n3.2 Interpret technical\ndrawing and plans\n3.3 Apply freehand\nsketching\nAudio Visual\nSimulation\nDiscussion\nPractical Lab\nDemonstration\n• Direct observation\n• Oral questioning\n• Written test or\nexamination\n• Third party report\n• Demonstration\n(able to impart\nknowledge and\nskills)\n4. Perform\nmensurations\nand calculation\n4.1 Select measuring\ninstruments\n4.2 Carry out\nmeasurements\nand calculations\nAudio Visual\nSimulation\nDiscussion\nPractical Lab\nDemonstration\n• Direct observation\n• Oral questioning\n• Written test or\nexamination\n• Third party report\n• Demonstration\n(able to impart\nknowledge and\nskills)\n\n--- PDF PAGE 66 ---\nTR HEAVY EQUIPMENT OPERATION Promulgated December 2004/July 2007\n\n5. Maintain tools\nand equipment\n5.1 Check condition of\ntools and\nequipment\n5.2 Perform basic\npreventive\nmaintenance\n5.3 Sharpen edge and\ntooth cutting tools\n5.4 Store tools and\nequipment\nAudio Visual\nSimulation\nDiscussion\nPractical Lab\nDemonstration\n• Direct observation\nof application of\ntasks\n• Oral questioning\n• Written test or\n1. examination\n• Third party report\n• Demonstration\n\n--- PDF PAGE 67 ---\nTR HEAVY EQUIPMENT OPERATION Promulgated December 2004/July 2007\n\nCORE COMPETENCIES\n\nCourse Title\n: HEAVY EQUIPMENT OPERATION Level:\n\n CRAWLER CRANE\n\nNominal Training Hours:\n120 Hours\n\nCourse Description:\n\nThis course is designed to enhance the knowledge, desirable attitudes\nand skills in the use of crawler crane in accordance with industry standards. It\ncovers core competencies such as: perform pre- and post operation procedure,\nperform productive operation, and perform basic preventive maintenance\nservicing on a given crawler crane.\n\nTo obtain this, all units prescribed for this qualification must be achieved:\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Perform pre- and\npost-operation\n procedure for\nCrawler Crane\n2.1 Identify crawler crane\ncomponents / parts\n2.2 Perform visual check of\nequipment\n2.3 Check BLOWAF of\ncrawler crane\n2.3.1 Battery\n2.3.2 Light\n2.3.3 Oil\n2.3.4 Water\n2.3.5 Air\n2.3.6 Fuel\n2.4 Check crawler crane\nsystem’s operation\n2.5 Check safety devices\naccessories\n2.6 Perform post operation\ncheck\nLecture\nPractical /\nDemonstration\n\n• Observation /\nDemonstration\nand interview\n• Written test\n\n--- PDF PAGE 68 ---\nTR HEAVY EQUIPMENT OPERATION Promulgated December 2004/July 2007\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n2. Perform productive\noperation for\nCrawler Crane\n2.1 Apply safe work\n practices\n2.2 Identify different\n crane signals\n2.3 Load and unload\n crawler crane to and\n from trailer bed\n2.4 Travel crawler crane\n2.5 Position the crane\n2.6 Apply interpreted\n crawler cranes load to\n load chart\n2.7 Perform crawler\n crane lifting and\n transferring of load\nLecture\nPractical /\nDemonstration\n\n• Observation /\nDemonstration\nand interview\n• Written test\n\n3. Perform basic\n preventive\n maintenance\nservicing for\nCrawler Crane\n\n3.1 Perform safety\npractices, and\nhousekeeping\n3.2 Perform\n preventive\n maintenance and\n servicing\nLecture\nPractical /\ndemonstration\n\n• Observation /\nDemonstration\nand interview\n• Written test\n\n--- PDF PAGE 69 ---\nTR HEAVY EQUIPMENT OPERATION Promulgated December 2004/July 2007\n\n3.2\nTRAINING DELIVERY\n\nThe delivery of training should adhere to the design of the curriculum.\nDelivery should be guided by the 10 basic principles of competency-based TVET.\n\n• The training is based on curriculum developed from the\ncompetency standards;\n• Learning is modular in its structure;\n• Training delivery is individualized and self-paced;\n• Training is based on work that must be performed;\n• Training materials are directly related to the competency standards\nand the curriculum modules;\n• Assessment is based in the collection of evidence of the\nperformance of work to the industry required standard;\n• Training is based both on and off-the-job components;\n• Allows for recognition of prior learning (RPL) or current\ncompetencies;\n• Training allows for multiple entry and exit; and\n• Approved training programs are nationally accredited.\n\nThe competency-based TVET system recognizes various types of delivery\nmodes, both on and off-the-job as long as the learning is driven by the\ncompetency standards specified by the industry. The following training modalities\nmay be adopted when designing training programs:\n\n• The dualized mode of training delivery is preferred and\nrecommended. Thus programs would contain both in-school and in-\nindustry training or fieldwork components. Details can be referred to\nthe Dual Training System (DTS) Implementing Rules and\nRegulations.\n• Modular/self-paced learning is a competency-based training\nmodality wherein the trainee is allowed to progress at his own pace.\nThe trainer facilitates the training delivery\n• Peer teaching/mentoring is a training modality wherein fast learners\nare given the opportunity to assist the slow learners.\n• Supervised industry training or on-the-job training is an approach in\ntraining designed to enhance the knowledge and skills of the\ntrainee through actual experience in the workplace to acquire\nspecific competencies prescribed in the training regulations.\n• Distance learning is a formal education process in which majority of\nthe instruction occurs when the students and instructor are not in\n\n--- PDF PAGE 70 ---\nTR HEAVY EQUIPMENT OPERATION Promulgated December 2004/July 2007\n\nthe same place. Distance learning may employ correspondence\nstudy, or audio, video or computer technologies.\n\n3.3\nTRAINEE ENTRY REQUIREMENTS\n\nThis section specifies the qualifications of trainees and educational\nexperience. Other requirements like health and physical requirements may also\nstated. Passing written entrance examinations may also be indicated if\nnecessary.\n\n• Can communicate both orally and in writing\n\n• Physically and mentally fit\n\n• With good moral character\n\n• Can perform basic mathematical computations.\n\n3.4\nLIST OF TOOLS, EQUIPMENT AND MATERIALS\n\n--- PDF PAGE 71 ---\nTR HEAVY EQUIPMENT OPERATION Promulgated December 2004/July 2007\n\nRecommended list of tools, equipment and materials for the training of 25\ntrainees for the operation of crawler crane.\n\nTOOLS\nEQUIPMENT\nMATERIALS\nQTY\nQTY\nQTY\n1 set\n• Wrenches (box and\nopen-end 8-24 mm-\nmetric & 7/16 –1” -\nEnglish )\n1 unit\n• Crawler\nCrane(MOA /\nrental)\n5 kls\n• Multi- purpose\ngrease\n1 set\n• Hammer ballpeen\n(3-4 lbs)\n1 unit\n• Low bed trailer\nwith tractor head\n& operator\n(MOA/rental)\n4\nliters\n• Engine oil\n ( SAE\n 15w40)\n1 set\n• Pliers( mechanical\n10 “)\n1 unit\n• Vacuum cleaner\n20\nliters\n• Hydraulic /\nsteering fluid\n(TELLUS\n68/10W)\n1 pc\n\n• Adjustable wrench\n(18 “)\n1 unit\n• Portable electric\nair compressor\n10\nliters\n• Final drive/\ndifferential\n(gear oil\nGP90/ 140)\n1 pc\n• Grease gun\n\n10\nliters\n• Trans-\n mission oil\n (ATF)\n1set\n• Screw driver ( 10 “\n flat & Philips)\n\n4\nliters\n• Water\n coolant\n1 pc\n• Putty knife\n\n200\nliters\n• Diesel fuel\n1 pc\n• Pry bar (heavy duty)\n\n5\nliters\n• Battery\n distilled\n water\n\n1 set\n• Primary &\n secondary\n air filter\n\n1 pair\n• Working\n clothes\n\n10\npairs\n• Safety shoes\n\n10\npairs\n• Gloves\n\n10\npcs\n• Goggles\n\n10\n•Dust Mask\n\n--- PDF PAGE 72 ---\nTR HEAVY EQUIPMENT OPERATION Promulgated December 2004/July 2007\n\nTOOLS\nEQUIPMENT\nMATERIALS\nQTY\nQTY\nQTY\npcs\n\n10\npcs\n• Hard hat\n\n2\nunits\n• Test weights\n- 3 tons\n - 10 tons\n\n1 pc\n• Crawler crane\nminiture\n\n1 pc\n• Operator’s\nmanual with\nload chart\n\n--- PDF PAGE 73 ---\nTR HEAVY EQUIPMENT OPERATION Promulgated December 2004/July 2007\n\n3.5\nTRAINING FACILITIES\n\n2.\n\nThe crawler crane operation workshop must be of concrete\nstructure. Based on class size of 25 students/trainees the space requirements\nfor the teaching/learning and circulation areas are as follows:\n\nSPACE REQUIREMENT\nSIZE IN METERS\nAREA IN SQ.\nMETERS\nTOTAL AREA\nIN SQ.\nMETERS\n• Student/Trainee’s Working\nSpace\n 2.0 x 2.0 meters\n4 sq.m per\nstudent\n100.0 sq.m.\n•\nLecture Room\n8.00 x 6.00\n48.00\n48.0\n•\nLearning Resource Center\n4.00 x 6.00\n24.00\n24.0\n•\n\n172\n• Facilities/Equipment/\nCirculation Area\n-\n-\n52\nTOTAL WORK AREA\n-\n224\nWorking field\n0.25 hectare (MOA/Rental)\n\n--- PDF PAGE 74 ---\nTR HEAVY EQUIPMENT OPERATION Promulgated December 2004/July 2007\n\n 3.6 TRAINERS’ QUALIFICATION\n\nHEAVY-EQUIPMENT OPERATION (CRAWLER CRANE)\n\nTRAINER QUALIFICATION (TQ II)\n• Must be a holder of Heavy Equipment Operation (Crawler Crane)\nNC-II or equivalent qualification\n• Must have undergone training on Training Methodology II (TM II)\nor equivalent training/experience\n• Must be computer-literate\n• Must be physically and mentally fit\n• Must have at least 5 years job/industry experience*\n• Must be a civil-service eligible (for government position or\nappropriate professional license issued by the Professional\nRegulatory Commission)\n\n* Optional. Only when required by the hiring institution.\n\nReference: TESDA Board Resolution No. 2004 03\n\n--- PDF PAGE 75 ---\nTR HEAVY EQUIPMENT OPERATION Promulgated December 2004/July 2007"
