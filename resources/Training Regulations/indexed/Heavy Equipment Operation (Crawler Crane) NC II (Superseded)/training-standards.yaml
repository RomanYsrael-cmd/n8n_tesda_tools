    "source_text": "3.1 CURRICULUM DESIGN\n\nCourse Title : HEAVY EQUIPMENT OPERATION - CRAWLER CRANE\nNC Level:\n\nBASIC COMPETENCIES\nNominal Training Hours: 18 Hours (Basic) + 18 Hours (Common)\nCourse Description:\n\nThis course is designed to equip individual with the basic, common and\ncore competencies in Construction Sector particularly in Heavy Equipment\nOperation.\n\nTo obtain this, all units prescribed for this qualification must be achieved:\n\nBASIC COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and convey\nworkplace information.\n1.2 Complete relevant work\n related documents\n1.3 Participate in\nworkplace meeting and\ndiscussion.\nGroup\ndiscussion\nInteraction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n2. Work in a team\n environment\n2.1 Describe and identify\nteam role and\nresponsibility in a team.\n2.2 Describe work as a team\nmember.\nDiscussion\nInteraction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n\n--- PDF PAGE 64 ---\nTR HEAVY EQUIPMENT OPERATION Promulgated December 2004/July 2007\n\n3. Practice career\nprofessionalism\n3.1 Integrate personal\nobjectives with\norganizational goals.\n3.2 Set and meet work\npriorities.\n3.3 Maintain professional\ngrowth and development.\nDiscussion\nInteraction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n4. Practice\noccupational\nhealth and safety\n4.1 Evaluate hazard and\nrisks\n4.2 Control hazards and risks\n4.3 Maintain occupational\nhealth and safety\nawareness\nDiscussion\nPlant tour\nSymposium\n• Observation\n• Interview\n\n--- PDF PAGE 65 ---\nTR HEAVY EQUIPMENT OPERATION Promulgated December 2004/July 2007\n\nCOMMON COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Prepare\nconstruction\nmaterials and\ntools\n1.8 Identify Materials\n1.9 Requisition\nMaterials\n1.10 Receive and\ninspect materials\nAudio Visual\nsimulation\nDiscussion\nPractical\nexercise\nDemonstration\n• Direct observation\n• Questions or\ninterview\n• Portfolio\n(credentials)\n• Written / Oral Test\n•\nDemonstration\n2. Observe\nprocedures,\nSpecifications\nand Manuals of\nInstructions\n2.1 Identify and access\nspecification/\nmanuals\nAudio Visual\nSimulation\nDiscussion\nPractical Lab\nDemonstration\n• Direct observation\n• Oral questioning\n• Written test or\nexamination\n• Third party report\n• Demonstration\n(able to impart\nknowledge and\nskills)\n3. Interpret\nTechnical\nDrawing\n3.1 Analyze sign,\nsymbols and data\n3.2 Interpret technical\ndrawing and plans\n3.3 Apply freehand\nsketching\nAudio Visual\nSimulation\nDiscussion\nPractical Lab\nDemonstration\n• Direct observation\n• Oral questioning\n• Written test or\nexamination\n• Third party report\n• Demonstration\n(able to impart\nknowledge and\nskills)\n4. Perform\nmensurations\nand calculation\n4.1 Select measuring\ninstruments\n4.2 Carry out\nmeasurements\nand calculations\nAudio Visual\nSimulation\nDiscussion\nPractical Lab\nDemonstration\n• Direct observation\n• Oral questioning\n• Written test or\nexamination\n• Third party report\n• Demonstration\n(able to impart\nknowledge and\nskills)\n\n--- PDF PAGE 66 ---\nTR HEAVY EQUIPMENT OPERATION Promulgated December 2004/July 2007\n\n5. Maintain tools\nand equipment\n5.1 Check condition of\ntools and\nequipment\n5.2 Perform basic\npreventive\nmaintenance\n5.3 Sharpen edge and\ntooth cutting tools\n5.4 Store tools and\nequipment\nAudio Visual\nSimulation\nDiscussion\nPractical Lab\nDemonstration\n• Direct observation\nof application of\ntasks\n• Oral questioning\n• Written test or\n1. examination\n• Third party report\n• Demonstration\n\n--- PDF PAGE 67 ---\nTR HEAVY EQUIPMENT OPERATION Promulgated December 2004/July 2007\n\nCORE COMPETENCIES\n\nCourse Title\n: HEAVY EQUIPMENT OPERATION Level:\n\n CRAWLER CRANE\n\nNominal Training Hours:\n120 Hours\n\nCourse Description:\n\nThis course is designed to enhance the knowledge, desirable attitudes\nand skills in the use of crawler crane in accordance with industry standards. It\ncovers core competencies such as: perform pre- and post operation procedure,\nperform productive operation, and perform basic preventive maintenance\nservicing on a given crawler crane.\n\nTo obtain this, all units prescribed for this qualification must be achieved:\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Perform pre- and\npost-operation\n procedure for\nCrawler Crane\n2.1 Identify crawler crane\ncomponents / parts\n2.2 Perform visual check of\nequipment\n2.3 Check BLOWAF of\ncrawler crane\n2.3.1 Battery\n2.3.2 Light\n2.3.3 Oil\n2.3.4 Water\n2.3.5 Air\n2.3.6 Fuel\n2.4 Check crawler crane\nsystem’s operation\n2.5 Check safety devices\naccessories\n2.6 Perform post operation\ncheck\nLecture\nPractical /\nDemonstration\n\n• Observation /\nDemonstration\nand interview\n• Written test\n\n--- PDF PAGE 68 ---\nTR HEAVY EQUIPMENT OPERATION Promulgated December 2004/July 2007\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n2. Perform productive\noperation for\nCrawler Crane\n2.1 Apply safe work\n practices\n2.2 Identify different\n crane signals\n2.3 Load and unload\n crawler crane to and\n from trailer bed\n2.4 Travel crawler crane\n2.5 Position the crane\n2.6 Apply interpreted\n crawler cranes load to\n load chart\n2.7 Perform crawler\n crane lifting and\n transferring of load\nLecture\nPractical /\nDemonstration\n\n• Observation /\nDemonstration\nand interview\n• Written test\n\n3. Perform basic\n preventive\n maintenance\nservicing for\nCrawler Crane\n\n3.1 Perform safety\npractices, and\nhousekeeping\n3.2 Perform\n preventive\n maintenance and\n servicing\nLecture\nPractical /\ndemonstration\n\n• Observation /\nDemonstration\nand interview\n• Written test\n\n--- PDF PAGE 69 ---\nTR HEAVY EQUIPMENT OPERATION Promulgated December 2004/July 2007"
