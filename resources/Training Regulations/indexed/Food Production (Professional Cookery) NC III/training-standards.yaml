  "source_section_text": "SECTION 3 TRAINING ARRANGEMENTS\n\nThese standards are set to provide technical and vocational education and training (TVET)\nproviders with information and other important requirements to consider when designing\ntraining programs for FOOD PRODUCTION (PROFESSIONAL COOKERY) NC III.\n\nThey include information on curriculum design; training delivery; trainee entry\nrequirements; tools and equipment; training facilities; and trainer’s qualification.\n\n3.1\nCURRICULUM DESIGN\n\nTESDA shall provide the training on the development of competency-based curricula to\nenable training providers develop their own curricula with the components mentioned\nbelow.\n\nDelivery of knowledge requirements for the basic, common and core units of competency\nspecifically in the areas of mathematics, science/technology, communication/language\nand other academic subjects shall be contextualized. To this end, TVET providers shall\ndevelop a Contextual Learning Matrix (CLM) to accompany their curricula.\n\nCourse Title: PROFESSIONAL COOKERY (FOOD PRODUCTION)\n NC Level: NC III\n\nNominal Training Duration:\n 40 Hours (Basic)\n 96 Hours (Common)\n 415 Hours (Core)\n 551 Hours\n 160 Hours – Supervised Industry Learning (SIL)\nCourse Description:\n\nThis course is designed to enhance the knowledge skills , behavior and motivations in\naccordance with industry standards. This covers competencies that a person must achieve\n– ensure correct materials are used and procedures are followed, apply and demonstrate\nprinciples and current trends of methods of cookery, prepare/cook special hot , cold dishes\nand dessert for guest in various food and beverage service facilities.\n\nUpon completion of the course, the learners are expected to demonstrate the above\nmentioned competencies to be employed. To obtain this, all units prescribed for this\nqualification must be achieved.\n\n--- PDF PAGE 194 ---\nFOOD PRODUCTION (Professional Cookery) NC III Revision 01 Promulgated (11