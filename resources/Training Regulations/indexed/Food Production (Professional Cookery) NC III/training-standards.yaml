ision 01 Promulgated (11/07/2019) 236\n\nFish\n\nShellfish\n\nCrustacean\n\nNOTE: Implementation of the training program can be made possible through a Memorandum of\nAgreement (MOA) between the training school and industry for the use of the facilities. This is in response\nto the resource limitations of the training school due to the high cost of equipment.\n\n3.5\nTRAINING FACILITIES\n\n Based on a class intake of 25 students/trainees.\n\nSpace Requirement\n\nSize in Meters\n\nArea in Sq. Meters\n\nTotal Area in Sq. Meters\nStudent/Trainee\nWorking Space\n1 x 1 m.\n1 sq. m.\n25 sq. m\nLecture/Demo Room\n8 x 5 m.\n40 sq. m.\n40 sq. m.\nLaboratory\n8 x 5 m.\n40 sq. m.\n40 sq. m.\nLearning Resource\nCenter\n3 x 5 m.\n15 sq. m.\n15 sq. m.\nFacilities/Equipment/\nCirculation Area\n\n36 sq. m.\nTotal workshop area:\n156 sq. m.\n\nNOTE: Training Center may enter into Memorandum of Agreement (MOA) with industry\n for use of facilities and equipment\n\n--- PDF PAGE 241 ---\nFOOD PRODUCTION (Professional Cookery) NC III Revision 01 Promulgated (11/07/2019) 237\n3.6\nTRAINER’S QUALIFICATIONS\n\n• Must be a holder of National TVET Trainer’s Certificate (NTTC) Level I in FOOD\nPRODUCTION (PROFESSIONAL COOKERY) NC III\n• Must have at least 3 years work experience in the food production industry or has\ntaught or delivered training programs in Cookery NC II for at least 2 years.\n• Must be a holder of a Health Certificate (free of hepatitis or any communicable\ndisease)\n• Must have an industry recognized National or International Food Safety,\nSanitation and Hygiene Certification (ServSafe™ Certification or its equivalent)\n• Must have attended relevant training and seminars such as:\n▪ Current trends in cookery and baking\n▪ Menu Costing\n▪ Catering Management\n\n3.7\nINSTITUTIONAL ASSESSMENT\n\nInstitutional assessment is undertaken by trainees to determine their achievement of units\nof competency. A certificate of achievement is issued for each unit of competency.\n\n--- P