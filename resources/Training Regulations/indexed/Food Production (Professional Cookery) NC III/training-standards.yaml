      "source_text": "3.6\nTRAINER’S QUALIFICATIONS\n\n• Must be a holder of National TVET Trainer’s Certificate (NTTC) Level I in FOOD\nPRODUCTION (PROFESSIONAL COOKERY) NC III\n• Must have at least 3 years work experience in the food production industry or has\ntaught or delivered training programs in Cookery NC II for at least 2 years.\n• Must be a holder of a Health Certificate (free of hepatitis or any communicable\ndisease)\n• Must have an industry recognized National or International Food Safety,\nSanitation and Hygiene Certification (ServSafe™ Certification or its equivalent)\n• Must have attended relevant training and seminars such as:\n▪ Current trends in cookery and baking\n▪ Menu Costing\n▪ Catering Management"
