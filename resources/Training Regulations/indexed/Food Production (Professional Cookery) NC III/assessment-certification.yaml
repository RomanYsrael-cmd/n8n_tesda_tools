      "text": "NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS 4.1.1 A National Certificate (NC) is issued when a candidate has demonstrated competence through project-type full qualification assessment covering all the units of competency that comprise the Training Regulations for FOOD PRODUCTION (PROFESSIONAL COOKERY) NC III as listed in Section 1 following the group or cluster of Core Competencies: 4.1.1.1 COC 1 Plan, Prepare, Hold, and Present Foods • Monitor daily cleaning routines • Apply and demonstrate current trends in methods of cookery • Organize bulk cooking operations for buffet service • Establish and maintain quality control in food production • Prepare and serve special cuisines 4.1.1.2 COC 2 Plan, Cost and Prepare Quantity Foods • Plan, Cost, and Prepare Quantity Foods • Organize bulk cooking operations for buffet service • Develop and maintain beverage and wine product knowledge • Apply catering control and procedures • Plan and cost menus Successful candidates shall be awarded Certificates of Competency (COC). 4.1.2 Upon accumulation and submission of all COCs acquired, an individual shall be issued the corresponding National Certificate. 4.1.3 Candidates wanting to be certified will have to be assessed in accordance with the requirements identified in the evidence guide of the relevant unit/s of competency. 4.1.4 Assessment shall cover all the competencies of the qualification with the basic and common units integrated or assessed concurrently with the core units of competency. 4.1.5 The following are qualified to apply for assessment and certification: FOOD PRODUCTION (Professional Cookery) NC III Revision 01 Promulgated (11/07/2019) 239 • Graduates of formal, non-formal and informal institutions and enterprise-based training programs • Experienced Workers (wage employed or self-employed) 4.1.6 For the renewal of valid or expired National Certificate (NC) or Certificate of Competency (COC) under Commercial Cooking NC III will have to undergo assessment in the amended TR for Food Production (Professional Cookery) NC III. 4.1.7 Recognition of Prior Learning (RPL). Candidates who have gained competencies through informal training, previous work or life experiences may apply for recognition in a particular qualification through competency assessment. 4.1.8 The industry shall determine assessment and certification requirements for each qualification with promulgated Training Regulations: It includes the following: a. Entry requirements for candidates b. Evidence gathering methods c. Qualification requirements of competency assessors d. Specific assessment and certification arrangements as identified by industry"
