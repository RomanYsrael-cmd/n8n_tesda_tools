  "source_text": "SECTION 4 NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\nCompetency Assessment is the process of collecting evidence and making\njudgments whether competency has been achieved. The purpose of assessment is\nto confirm that an individual can perform to the standards expected at the workplace\nas expressed in relevant competency standards.\n\nThe assessment process is based on evidence or information gathered to prove\nachievement of competencies. The process may be applied to an employable unit(s) of\ncompetency in partial fulfillment of the requirements\n\n4.1 NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1.1 A National Certificate (NC) is issued when a candidate has demonstrated\ncompetence through project-type full qualification assessment covering\nall the units of competency that comprise the Training Regulations for\nFOOD PRODUCTION (PROFESSIONAL COOKERY) NC III as listed in\nSection 1 following the group or cluster of Core Competencies:\n\n4.1.1.1 COC 1\nPlan, Prepare, Hold, and Present Foods\n\n• Monitor daily cleaning routines\n• Apply and demonstrate current trends in methods of cookery\n• Organize bulk cooking operations for buffet service\n• Establish and maintain quality control in food production\n• Prepare and serve special cuisines\n\n4.1.1.2 COC 2\nPlan, Cost and Prepare Quantity Foods\n\n• Plan, Cost, and Prepare Quantity Foods\n• Organize bulk cooking operations for buffet service\n• Develop and maintain beverage and wine product knowledge\n• Apply catering control and procedures\n• Plan and cost menus\n Successful candidates shall be awarded Certificates of Competency (COC).\n\n4.1.2 Upon accumulation and submission of all COCs acquired, an individual shall\nbe issued the corresponding National Certificate.\n\n4.1.3 Candidates wanting to be certified will have to be assessed in accordance\nwith the requirements identified in the evidence guide of the relevant unit/s of\ncompetency.\n\n4.1.4 Assessment shall cover all the competencies of the qualification with the basic\nand common units integrated or assessed concurrently with the core units of\ncompetency.\n\n4.1.5 The following are qualified to apply for assessment and certification:\n\n--- PDF PAGE 243 ---\nFOOD PRODUCTION (Professional Cookery) NC III Revision 01 Promulgated (11/07/2019) 239\n• Graduates of formal, non-formal and informal institutions and\nenterprise-based training programs\n• Experienced Workers (wage employed or self-employed)\n\n4.1.6 For the renewal of valid or expired National Certificate (NC) or Certificate of\nCompetency (COC) under Commercial Cooking NC III will have to undergo\nassessment in the amended TR for Food Production (Professional Cookery)\nNC III.\n\n4.1.7 Recognition of Prior Learning (RPL). Candidates who have gained\ncompetencies through informal training, previous work or life experiences\nmay apply for recognition in a particular qualification through competency\nassessment.\n\n4.1.8 The industry shall determine assessment and certification requirements for\neach qualification with promulgated Training Regulations: It includes the\nfollowing:\na. Entry requirements for candidates\nb. Evidence gathering methods\nc. Qualification requirements of competency assessors\nd. Specific assessment and certification arrangements as identified by industry\n\n4.2 Competency Assessment Requisite\n4.2.1 Self-Assessment\nGuide.\nThe\nself-assessment\nguide\n(SAG)\nis\naccomplished by the candidate prior to actual competency assessment.\nSAG is a pre-assessment tool to help the candidate and the assessor\ndetermine what evidence is available, where gaps exist, including\nreadiness for assessment.\n\n This document can:\na. Identify the candidate’s skills and knowledge\nb. Highlight gaps in candidate’s skills and knowledge\nc. Provide critical guidance to the assessor and candidate on the evidence\nthat need to be presented\nd. Assist the candidate to identify key areas in which practice is needed or\nadditional information or skills that should be gained prior `\n4.2.2 Accredited Assessment Center. Only Assessment Center accredited by\nTESDA is authorized to conduct competency assessment. Assessment\ncenters undergo a quality assured procedure for accreditation before they\nare authorized by TESDA to manage the assessment for National\nCertification.\n4.2.3 Accredited Competency Assessor. Only accredited competency\nassessor is authorized to conduct assessment of competence.\nCompetency assessors undergo a quality assured system of accreditation\nprocedure before they are authorized by TESDA to assess the\ncompetencies of candidates for National Certification.\n\n--- PDF PAGE 244 ---\nFOOD PRODUCTION (Professional Cookery) NC III Revision 01 Promulgated (11/07/2019) 240\n\nClean and\nmaintain\nkitchen\npremises\nPrepare meat\ndishes\nPrepare\nseafood dishes\nOrganize bulk\ncooking\noperations for\nbuffet service\nPrepare\nbakery\nproducts for\npatisserie\nSelect\ncatering\nsystems\nMonitor\ncatering costs\nand revenues\n\nPrepare\nstocks, sauces\nand soups\nPrepare\nvegetable\ndishes\nPrepare\ndesserts\nEstablish and\nmaintain quality\ncontrol in food\nproduction\nApply catering\ncontrol and\nprocedures\nDesign menus\nto meet specific\nmarket\nrequirements\nDevelop a food\nsafety program\n\nPrepare\nappetizers\nPrepare egg\ndishes\nPackage\nprepared food\nPrepare and\nserve special\ncuisines\nPlan and cost\nmenus\nDesign meals\nto meet special\ndietary,\nreligious and\ncultural\nrequirements\nImplement\nsafety, health,\nenvironmental,\nand sustainable\npolicies and\nprocedures\n\nPrepare\nsalads and\ndressings\nPrepare\nstarch dishes\nMonitor daily\ncleaning\nroutines\nPlan and\nprepare Garde\nManger\nproducts\nManage food\nproduction\noperations for\ncatering\nPrepare\ncatering\ntenders\n\nPrepare\nsandwiches\nPrepare\npoultry and\ngame dishes\nApply and\ndemonstrate\ncurrent trends\nin methods of\ncookery\nDevelop and\nmaintain\nbeverage and\nwine product\nknowledge\nManage\nbakery and\npatisserie\nproduction for\ncatering\nPlan and\nmanage menu-\nbased catering\nfor an event or\nfunction\n\nDevelop and\nupdate industry\nknowledge\nPerform\nworkplace and\nsafety practices\nWork\ncooperatively in\na general\nadministration\nenvironment\nControl and\nOrder stock\nMaintain\nhospitality\nindustry\nknowledge\nManage\nquality\ncustomer\nservice\nUse the\nassessment\nsystem for\ntraining\noutcomes\n\nObserve\nworkplace\nhygiene\nprocedures\nProvide\neffective\ncustomer\nservice\nMaintain\nquality\ncustomer/guest\nservice\n\nPrepare and\ndeliver training\nsessions\nPerform child\nprotection\nduties relevant\nto the tourism\nindustry\nManage\nfinances\nwithin a\nbudget\n\n"
