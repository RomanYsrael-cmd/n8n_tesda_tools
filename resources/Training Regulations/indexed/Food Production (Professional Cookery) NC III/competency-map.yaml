  "source_text": "Section 1 following the group or cluster of Core Competencies:\n\n4.1.1.1 COC 1\nPlan, Prepare, Hold, and Present Foods\n\n• Monitor daily cleaning routines\n• Apply and demonstrate current trends in methods of cookery\n• Organize bulk cooking operations for buffet service\n• Establish and maintain quality control in food production\n• Prepare and serve special cuisines\n\n4.1.1.2 COC 2\nPlan, Cost and Prepare Quantity Foods\n\n• Plan, Cost, and Prepare Quantity Foods\n• Organize bulk cooking operations for buffet service\n• Develop and maintain beverage and wine product knowledge\n• Apply catering control and procedures\n• Plan and cost menus\n Successful candidates shall be awarded Certificates of Competency (COC).\n\n4.1.2 Upon accumulation and submission of all COCs acquired, an individual shall\nbe issued the corresponding National Certificate.\n\n4.1.3 Candidates wanting to be certified will have to be assessed in accordance\nwith the requirements identified in the evidence guide of the relevant unit/s of\ncompetency.\n\n4.1.4 Assessment shall cover all the competencies of the qualification with the basic\nand common units integrated or assessed concurrently with the core units of\ncompetency.\n\n4.1.5 The following are qualified to apply for assessment and certification:\n\n--- PDF PAGE 243 ---\nFOOD PRODUCTION (Professional Cookery) NC III Revision 01 Promulgated (11/07/2019) 239\n• Graduates of formal, non-formal and informal institutions and\nenterprise-based training programs\n• Experienced Workers (wage employed or self-employed)\n\n4.1.6 For the renewal of valid or expired National Certificate (NC) or Certificate of\nCompetency (COC) under Commercial Cooking NC III will have to undergo\nassessment in the amended TR for Food Production (Professional Cookery)\nNC III.\n\n4.1.7 Recognition of Prior Learning (RPL). Candidates who have gained\ncompetencies through informal training, previous work or life experiences\nmay apply for recognition in a particular qualification through competency\nassessment.\n\n4.1.8 The industry shall determine assessment and certification requirements for\neach qualification with promulgated Training Regulations: It includes the\nfollowing:\na. Entry requirements for candidates\nb. Evidence gathering methods\nc. Qualification requirements of competency assessors\nd. Specific assessment and certification arrangements as identified by industry\n\n4.2 Competency Assessment Requisite\n4.2.1 Self-Assessment\nGuide.\nThe\nself-assessment\nguide\n(SAG)\nis\naccomplished by the candidate prior to actual competency assessment.\nSAG is a pre-assessment tool to help the candidate and the assessor\ndetermine what evidence is available, where gaps exist, including\nreadiness for assessment.\n\n This document can:\na. Identify the candidate’s skills and knowledge\nb. Highlight gaps in candidate’s skills and knowledge\nc. Provide critical guidance to the assessor and candidate on the evidence\nthat need to be presented\nd. Assist the candidate to identify key areas in which practice is needed or\nadditional information or skills that should be gained prior `\n4.2.2 Accredited Assessment Center. Only Assessment Center accredited by\nTESDA is authorized to conduct competency assessment. Assessment\ncenters undergo a quality assured procedure for accreditation before they\nare authorized by TESDA to manage the assessment for National\nCertification.\n4.2.3 Accredited Competency Assessor. Only accredited competency\nassessor is authorized to conduct assessment of competence.\nCompetency assessors undergo a quality assured system of accreditation\nprocedure before they are authorized by TESDA to assess the\ncompetencies of candidates for National Certification.\n\n--- PDF PAGE 244 ---\nFOOD PRODUCTION (Professional Cookery) NC III Revision 01 Promulgated (11/07/2019) 240\n\nClean and\nmaintain\nkitchen\npremises\nPrepare meat\ndishes\nPrepare\nseafood dishes\nOrganize bulk\ncooking\noperations for\nbuffet service\nPrepare\nbakery\nproducts for\npatisserie\nSelect\ncatering\nsystems\nMonitor\ncatering costs\nand revenues\n\nPrepare\nstocks, sauces\nand soups\nPrepare\nvegetable\ndishes\nPrepare\ndesserts\nEstablish and\nmaintain quality\ncontrol in food\nproduction\nApply catering\ncontrol and\nprocedures\nDesign menus\nto meet specific\nmarket\nrequirements\nDevelop a food\nsafety program\n\nPrepare\nappetizers\nPrepare egg\ndishes\nPackage\nprepared food\nPrepare and\nserve special\ncuisines\nPlan and cost\nmenus\nDesign meals\nto meet special\ndietary,\nreligious and\ncultural\nrequirements\nImplement\nsafety, health,\nenvironmental,\nand sustainable\npolicies and\nprocedures\n\nPrepare\nsalads and\ndressings\nPrepare\nstarch dishes\nMonitor daily\ncleaning\nroutines\nPlan and\nprepare Garde\nManger\nproducts\nManage food\nproduction\noperations for\ncatering\nPrepare\ncatering\ntenders\n\nPrepare\nsandwiches\nPrepare\npoultry and\ngame dishes\nApply and\ndemonstrate\ncurrent trends\nin methods of\ncookery\nDevelop and\nmaintain\nbeverage and\nwine product\nknowledge\nManage\nbakery and\npatisserie\nproduction for\ncatering\nPlan and\nmanage menu-\nbased catering\nfor an event or\nfunction\n\nDevelop and\nupdate industry\nknowledge\nPerform\nworkplace and\nsafety practices\nWork\ncooperatively in\na general\nadministration\nenvironment\nControl and\nOrder stock\nMaintain\nhospitality\nindustry\nknowledge\nManage\nquality\ncustomer\nservice\nUse the\nassessment\nsystem for\ntraining\noutcomes\n\nObserve\nworkplace\nhygiene\nprocedures\nProvide\neffective\ncustomer\nservice\nMaintain\nquality\ncustomer/guest\nservice\n\nPrepare and\ndeliver training\nsessions\nPerform child\nprotection\nduties relevant\nto the tourism\nindustry\nManage\nfinances\nwithin a\nbudget\n\nCOMPETENCY MAP - TOURISM Sector\n(Hotel and Restaurant)\n FOOD PRODUCTION\n(PROFESSIONAL COOKERY) NC III\nANNEX A\nCORE COMPETENCIES\n\n--- PDF PAGE 245 ---\nFOOD PRODUCTION (Professional Cookery) NC III Revision 01 Promulgated (11/07/2019) 241\nPerform\ncomputer\noperations\nReceive and\nresolve\ncustomer\ncomplaints\nRoster staff\nPlan, conduct\nand evaluate\nstaff\nperformance\nassessment\nDevelop and\nsupervise\noperational\napproaches\nPlan and\nimplement a\nseries of\ntraining\nevents\n\nParticipate in\nworkplace\ncommunication\nLead\nworkplace\ncommunication\nPropose\nmethods of\napplying\nlearning and\ninnovation in\nthe\norganization\nFacilitate\nentrepreneurial\nskills for micro-\nsmall- medium\nenterprises\n(MSMEs)\nContribute to\nthe practice of\nsocial justice in\nthe workplace\n\nLead towards\nimprovement of\nenvironment\nwork programs,\npolicies and\nprocedures\n\nWork in a team\nenvironment\nLead small\nteams\nUse\ninformation\nsystematically\nUtilize\nspecialized\ncommunication\nskills\nManage\ninnovative\nwork\ninstructions\nSustain\nentrepreneurial\nskills\n\nPractice career\nprofessionalism\nApply critical\nthinking and\nproblem-solving\ntechniques in\nthe workplace\nEvaluate\noccupational\nsafety and\nhealth work\npractices\nDevelop and\nlead teams\nManage and\nevaluate usage\nof information\n\nPractice\noccupational\nhealth and\nsafety\nprocedures\nWork in a\ndiverse\nenvironment\nEvaluate\nenvironmental\nwork practices\nPerform\nhigher-order\nthinking\nprocesses and\napply\ntechniques in\nthe workplace\nLead in\nimprovement\nof\nOccupational\nSafety and\nHealth (OSH)\nprograms,\npolicies and\nprocedures\n\nCOMMON\nCOMPETENCIES\nBASIC COMPETENCIES\n\n--- PDF PAGE 246 ---\nFOOD PRODUCTION (Professional Cookery) NC III Revision 01 Promulgated (11/07/2019) 242\nWork in a team\nenvironment\nLead small\nteams\nUse\ninformation\nsystematically\nUtilize\nspecialized\ncommunication\nskills\nManage\ninnovative\nwork\ninstructions\nSustain\nentrepreneurial\nskills\n\nPractice career\nprofessionalism\nApply critical\nthinking and\nproblem-solving\ntechniques in\nthe workplace\nEvaluate\noccupational\nsafety and\nhealth work\npractices\nDevelop and\nlead teams\nManage and\nevaluate usage\nof information\n\nPractice\noccupational\nhealth and\nsafety\nprocedures\nWork in a\ndiverse\nenvironment\nEvaluate\nenvironmental\nwork practices\nPerform\nhigher-order\nthinking\nprocesses and\napply\ntechniques in\nthe workplace\nLead in\nimprovement\nof\nOccupational\nSafety and\nHealth (OSH)\nprograms,\npolicies and\nprocedures\n\n--- PDF PAGE 247 ---\nFOOD PRODUCTION (Professional Cookery) NC III Revision 01 Promulgated (11/07/2019) 243\nGLOSSARY OF TERMS\n\n1. Aging (of Meat) – A controlled process where connective tissue and other proteins of\nthe meat is broken down by the natural enzymes to improve taste and/or tenderness.\n2. Anti-griddling – A process where food is flash frozen or semi-frozen on a chilled metal\ngriddle.\n3. Audit – An official inspection of an individual’s or organization’s accounts, typically byu\nan independent body.\n4. Charcuterie – The branch of cooking devoted to prepared meat products, such as\nbacon, ham, sausage, terrrines, galantines, ballotines, pates and confit, primarily from\npork.\n5. Convenience Product - A product that has had all or part of the preparation done.\n6. Direct Cost – The costs which are directly accountable to a cost object.\n7. Eco-friendly Packaging - May refer to packaging that are produced to improve\necological and environmental impacts\n8. Emulsification – The process of mixing two immiscible (unmixable) liquids.\n9. Engastration – A cooking technique in which the cook stuffs the remains of one animal\ninto another animal.\n10. Environmentally Friendly Tools and Equipment – refer to tools and equipment that\nminimize generation of wastage and emissions in all environmental media (air, soil,\nwater), reduces usage of non-renewable resources, particularly by means of efficient\nuse of energy using other natural resources (solar, wind, biomass, geothermal and\nbiofuel), and/or energy saving\n11. Expense - Costs incurred in the normal course of operations to support the production\nof revenue\n12. Farinaceous Dishes – A term that denotes that a food product that contains a high\nproportion of starch\n13. Feedback – A system of giving information or advice to others, in response to an\nactivity, action or performance of a task, etc., which is used as a basis for improvement.\n14. Flash Freezing – A freezing method for food in which it is frozen rapidly so as to\nprevent the formation of ice crystals.\n15. Food Cost Percentage – The allocation of a business’s operating budget that can be\nallocated to food for the operation to still turn a profit.\n16. Food Flow – Refers to the steps in the food production system in which the food must\ngo through from starting from purchasing until service.\n17. Free-Range – Denotes a method of farming husbandry where the animals, for at least\npart of the day, can roam freely outdoors, rather than being confined in an enclosure\nfor 24 hours each day.\n18. Gelatinization – The process where starch and water are subjected to heat causing\nthe starch granules to swell.\n19. Gelation – The conversion from a liquid solution to a semi-solid state, through the\nincorporation of gelling agents, whether with heat or without heat.\n\n--- PDF PAGE 248 ---\nFOOD PRODUCTION (Professional Cookery) NC III Revision 01 Promulgated (11/07/2019) 244\n20. General Cleaning – Refers to the whole cleaning of tools, equipment, general and\npublic areas at a set time, that may result to a partial halting of operations to ensure\ncomplete or total cleaning.\n21. Gluten – An interconnected network of proteins produced in baked goods that trap\ngasses and that make doughs elastic and extensible.\n22. HACCP (Hazard Analysis Critical Control Point) – A proactive food safety\nmanagement system based on the approach of controlling critical control points in food\nhandling to prevent food safety problems.\n23. Immersion Circulator – An electrically powered device that circulates and heats a\nwarm fluid kept at an accurate and stable temperature.\n24. Indirect Cost – The cists that are not directly accountable to a cost object. They may\nbe either fixed or variable.\n25. Instant-read thermometer – a thermometer used to measure the internal temperature\nof foods. The stem is inserted into the food, producing an instant temperature read out.\n26. Job schedule - A written plan of where you should be cleaning with approximate times.\nIts purpose is to monitor certain tasks that have been completed and help address any\nproblem or maintenance issues that need attention.\n27. Lecithin – A generic term to designate any group of yellow-brownish fatty substances\noccurring in animal and plant tissues which are amphiphilic – they attract both water\nand fatty substances, and are used for smoothing food textures, emulsifying,\nhomogenizing liquid mixtures and repelling sticky materials.\n28. Liabilities – The company’s legal financial debt or obligation that arise during the\ncourse of business operations.\n29. Molecular Cooking – A subdiscipline of food science that seeks to investigate the\nphysical and chemical transformations of ingredients that occur in cooking.\n30. MSDS (Material Safety Data Sheet) – A document that contains information on the\npotential hazards (health, fire, reactivity and environmental) and how to work safely\nwith the chemical product. The sheets also provide info in case of an\naccident/emergency involving the chemical.\n31. Off-Premise Catering – A type of catering where food is served at a location away\nfrom the caterer’s food production facility.\n32. OHS – OHS refers to “Occupational Safety and Health,” a multidisciplinary field\nconcerned with workplace safety and health policies, procedures and practices.\n33. On-Site Catering – A type of catering where food is served at the same location as the\ncaterer’s food production facility.\n34. Organic Food – Food produced by methods that comply with the standards of organic\nfarming such as the restriction on the use of pesticides and fertilizers and where foods\nare not subject to irradiation, industrian solvents or synthetic food additives.\n35. Periodic Cleaning – Refers to cleaning on a regular and agreed period or time period.\n36. Personal Protective Equipment (PPE) – These are clothing or equipment designed\nto be worn by someone to protect them from the risk of injury or illness.\n37. Portion control – Determining the proper size or quantity of food to be served for each\ncustomer and ensuring that this designated amount is actually served to the guess.\n\n--- PDF PAGE 249 ---\nFOOD PRODUCTION (Professional Cookery) NC III Revision 01 Promulgated (11/07/2019) 245\n38. Preventive Maintenance – A type of maintenance that is regularly performed on a\npiece of equipment to lessen the likelihood of it failing.\n39. Production Schedule – The timetable for the use of resources and processes required\nby the food production facility to produce goods and provide services.\n40. Production Sheet – A tool that is used in foodservice operation to plan and control\nfood production.\n41. Re-thermalization – A process whereby cooked food that is cold is reheated to serving\ntemperature.\n42. Revenue – Total amount of earnings received by a business for providing goods and\nservices for a certain period\n43. Reverse Spherification – A method of molecular gastronomy that is used to enclose\nliquid containing alcohol content, as well as liquid with calcium content such as milk or\nyogurt.\n44. Set-Menu – A type of limited menu offered for a set number of courses, at a fixed price.\n45. Sous Vide – Literally means “in vacuum” and refers to the process of vacuum-sealing\nfood in a bag, then cooking it to a very precise temperature in a water bath.\n46. Spherification – A method of molecular gastronomy that employs sodium alginate and\neither calcium chloride or calcium glucate lactate to shape a liquid into squishy spheres,\nwhich visually and texturally resemble roe.\n47. Spot cleaning – This refers to the removal of stains from different kinds of hard and\nsoft surfaces.\n48. Standardized Recipe – A recipe that has been tested to produce consistent products\nfollowing a set quantity of food at a specific standard.\n49. Stock Rotation – The process of organizing inventory to mitigate stock loss caused by\nexpiration or obsolescence.\n50. Stock take – Refers to the counting of all unused commodities that are still unsold\n51. Sustainable ingredients – These refer to ingredients that are produced and\ntransported in a way that help to: limit global warming, protect biodiversity and\necosystems, respect natural resources and living world, and ensure fair and sufficient\ncompensation as well as decent working conditions.\n52. Target markets – A particular group of customers, with similar characteristics, in which\nan establishment aims its products or services.\n53. Thermal Cooking – A cooking technique where food in cooked in a device that uses\nthermal insulation to retain heat and cook food without the continuous use of fuel or\nother heat source.\n54. Varietal Wine – A wine made primarily from a single named grape variety, and which\ntypically displays the name of that variety on the wine label.\n55. Vintage – In winemaking, is the process of picking grapes and creating the finished\nproduct – wine.\n\n--- PDF PAGE 250 ---\nFOOD PRODUCTION (Professional Cookery) NC III Revision 01 Promulgated (11/07/2019) 246\n56. Vintage Wine – A type of wine made from grapes that were all, or primarily, grown and\nharvested in a single specified year.\n57. Yield Testing – Defined as a technique to determine how much usable product is\nobtained from a set amount after the required processing has been performed.\n\n--- PDF PAGE 251 ---\nFOOD PRODUCTION (Professional Cookery) NC III Revision 01 Promulgated (11/07/2019) 247\n\nTRAINING REGULATIONS (TR)\nDOCUMENT REVISION HISTORY\n\nQualification Title :\nQualification Code :\nFood Production (Professional Cookery) NC III\nTRSFP319\n\nRevision\nNo.\nDocument\nTypes*\nQualification Title\nTESDA Board\nResolution No./\nDate\nDeployment\n(TESDA\nCircular/\nImplementing\nGuidelines)\n00\nDocument Created\n\nCommercial\nCooking NC III\n2007-41 /\n11/22/2007\nN/A\n01\nDocument Amended\n\nFood Production\n(Professional\nCookery) NC III\n2019-58 /\nNovember 07,\n2019\n\nLegend: *Description Types\n-\nDocument Created\n-\nDocument Amended\n\n--- PDF PAGE 252 ---\nFOOD PRODUCTION (Professional Cookery) NC III Revision 01 Promulgated (11/07/2019) 248\nACKNOWLEDGMENTS\n\nThe Technical Education and Skills Development Authority (TESDA) wishes to extend\nthanks and appreciation to the many representatives of business, industry, academe and\ngovernment agencies who donated their time and expertise to the development and\nvalidation of these Training Regulations.\n\nTECHNICAL EXPERTS REVIEW PANEL\n\nHEINZ D. PELAYO\nELENA C. RIVERA\nNational Master Assessor;\nASEAN Master Assessor;\nChef Consultant, Peotraco Food, Inc.;\nCulinary Arts Instructor\nCulinary Arts Instructor,\nCenter for Asian Culinary Studies\nCollege of International Tourism\n\n and Hospitality Management\n\nLyceum of the Philippines University\n\nIntramuros, Manila\n\nJOSE GABRIEL E. PRATS\nJULIE ANN F. MENDOZA\nASEAN Master Assessor;\nASEAN Master Assessor;\nCulinary Training Director,\nProgram Chair – Culinary Arts,\nUnited Marine Training Center\nCollege of International Tourism\n\n and Hospitality Management\n\nLyceum of the Philippines University\n\nIntramuros, Manila\nHESSEL A. LARCIA\nNational Union Workers in Hotel\n and Allied Industries\n(NUWHRAIN-Restaurant Sentro)\n TIBFI\n\nANABELLE O. MORENO\nBoard of Trustees\nTourism Industry Board Foundation, Inc.(TIBFI)\nASEAN Master Trainer\n\nDANIEL L. EDRALIN\nNational Union Workers in Hotel\n and Allied Industries\n(NUWHRAIN-Restaurant Sentro)\n TIBFI\n\nMA. CHRISTINA G. AQUINO\nExecutive Director/Chair\nLyceum of the Philippines University\nIntramuros, Manila/TIBFI\