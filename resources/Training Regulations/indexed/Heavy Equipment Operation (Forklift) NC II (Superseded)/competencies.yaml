ss to forklift equipment and manuals.\n5. Method of\nassessment\n\nCompetency must be assessed through\n5.1 Written/oral questioning\n5.2 Direct observation/practical demonstration\n5.3 Work record and documents\n6. Context for\nassessment\n6.1 Assessment may be conducted on-the-job or in a simulated\n venue.\n\n--- PDF PAGE 47 ---\nTR HEAVY EQUIPMENT OPERATION Promulgated December 2004\n\nUNIT OF COMPETENCY:\nPERFORM BASIC PREVENTIVE-MAINTENANCE\nSERVICING FOR LIFTING EQUIPMENT\nUNIT CODE:\nCON833310\nUNIT DESCRIPTOR:\nThis unit involves the knowledge, skills and\nattitudes required in conducting routine basic\npreventive maintenance for lifting equipment.\n\nELEMENT\nPERFORMANCE CRITERIA\nBold and Italicized terms are elaborated in the\nRange of Variables\n1. Perform adjustment/s\nreplacements\n\n1.1 Minor defects are identified and remedied in\naccordance with company/manufacturer’s\nprocedures.\n1.2 Tools are selected based on job requirements.\n1.3 Major defects are identified using check list\nand referred to appropriate personnel for\naction.\n2. Perform basic preventive\nmaintenance servicing\n(PMS)\n\n2.1 OS parts/standards are identified and\nserviced according to manufacturer’s\nrecommendations.\n2.2 Fluids and lubricants are used based on\nmanufacturer’s manual.\n2.3 Basic hand tools and equipment and\nconsumable materials are identified and used\nin accordance with job requirements.\n2.4 Basic preventive maintenance servicing\n(PMS) is carried out in accordance with\nmanufacturer’s and/or site requirements/\nconditions.\n3. Prepare equipment reports\n\n3.1 Daily checklist form is accomplished in\naccordance with manufacturer’s/company\nrequirements.\n3.2 Minor/major equipment defects are reported\nto appropriate personnel.\n\n--- PDF PAGE 48 ---\nTR HEAVY EQUIPMENT OPERATION Promulgated December 2004\n\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Lifting\nequipment\n1.1 Rough-Terrain Crane\n1.2 Truck-Mounted Crane\n1.3 Crawler Crane\n1.4 Forklift\n 1.4.1 Di