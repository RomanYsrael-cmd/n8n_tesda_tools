  "source_text": "Section 1. Successful candidates shall be awarded\nNational Certificates signed by the TESDA Director General.\n\n4.2\nThe qualification of HEAVY EQUIPMENT OPERATION (Bulldozer) NC II\nmay be attained through demonstration of competence in a project-type\nassessment covering the following core units. Candidates may apply for\nassessment in any accredited assessment center.\n\n4.2.1 Forklift operation\n Perform pre- and post-operation for lifting equipment\n Perform productive operation for forklift\n Perform basic preventive-maintenance servicing for lifting\nequipment\n\n4.3\nAssessment shall focus on the core units of competency. The basic and\ncommon units shall be integrated or assessed concurrently with the core\nunits.\n\n4.4\nThe following are qualified to apply for assessment and certification:\n\n4.4.1 Graduates of formal, non-formal and/or informal training including\nenterprise-based training programs\n\n4.4.2 Experienced Workers (wage-employed or self-employed)\n\nThe guidelines on assessment and certification are discussed in detail in\nthe \"Procedures Manual on Assessment and Certification\" and \"Guidelines on\nthe Implementation of the Philippine TVET Qualification and Certification System\n(PTQCS).\"\n\n--- PDF PAGE 73 ---\n\n--- PDF PAGE 74 ---\nTR HEAVY EQUIPMENT OPERATION\n\nCOMPETENCY MAP\nCONSTRUCTION-HEAVY EQUIPMENT OPERATION -\nSUB- SECTOR\nBASIC\nInspect\nrigging\ngears\nPerform productive\noperation for\nhydraulic excavator\nPerform productive\noperation for truck-\nmounted crane\nPerform productive\noperation for tower crane\nPerform productive\noperation for forklift\nInstall\nrigging\ngears\nPerform productive\noperation for\nbackhoe loader\nPerform pre- and post-\noperation procedures for\nlifting equipment\nPerform basic\npreventive maintenance\nservicing for hauling\nPerform productive\noperation for off-\nhigh way dump\ntruck (articulated)\nPerform productive\noperation for\nbulldozer\nPerform productive\noperation for wheel\nloader\nPerform productive\noperation for motor\ngrader\nPerform pre- and post-\noperation procedures for\nhauling equipment\nPerform productive\noperation for road\nroller\nPerform basic preventive\nmaintenance servicing for\nlifting equipment\nAssist\ncrane\noperator\nPerform pre- and post-\noperation procedures for\nearth moving equipment\nPerform productive\noperation for\ncrawler crane\nPerform basic preventive\nmaintenance servicing for\nearth moving equipment\nPerform productive\noperation for rough-\nterrain crane\nPerform productive\noperation for off-highway\ndump truck (rigid)\nPerform productive\noperation for\nconcrete pump\nPerform productive\noperation for paver\nPerform basic preventive\nmaintenance servicing for\nconcreting and asphalting\nequipment\nPerform productive\noperation for on-\nhighway dump truck\n(rigid)\nPerform pre- and post-\noperation procedures for\nconcreting and asphalting\nequipment\nPerform productive\noperation for transit\nmixer\nCORE\nCOMPETENCIES\nPrepare\nconstruction\nmaterials and\ntools\nInterpret technical\ndrawings and plans\nObserve procedures,\nspecifications and\nmanual of instructions\nMaintain tools and\nequipment\nPerform\nmensuration and\ncalculations\nCOMMON\nCOMPETENCIES\nBASIC\nCOMPETENCIES\nReceive and respond\nto workplace\ncommunication\nWork with others\nUse relevant\ntechnologies\nPractice career\nprofessionalism\nUtilize specialized\ncommunication\nskills\nPractice occupational\nhealth and safety\nprocedures\nDevelop teams and\nindividuals\nLead workplace\ncommunication\nDemonstrate work\nvalues\nSolve problems\nrelated to work\nactivities\nDevelop and\npractice negotiation\nskills\nPractice\nhousekeeping\nprocedure (5s)\nUse mathematical\nconcepts and\ntechniques\nWork in a team\nenvironment\nParticipate in\nworkplace\ncommunication\nApply problem-\nsolving techniques\nin the workplace\nPlan and organize\nwork\nCollect, analyze\nand organize\ninformation\nLead small team\nPromote\nenvironmental\nprotection\n\n--- PDF PAGE 75 ---\nTR HEAVY EQUIPMENT OPERATION\n\nDefinition of Terms\n\nFor the purpose of these Competency Standards, the words\n\n1. Forklift\nRefers to a lift truck machine used for handling\nloads/cargoes.\n2. Forklift operator\nRefers to a person who can pick, transfer and stack\ncargoes using a forklift machine and perform preventive\nmaintenance on such equipment.\n3. Preventive-maintenance\nchecklist form\nRefers to a list of activities performed during preventive\nmaintenance works.\n4. Operator-Serviceable\n(OS) parts\nRefer to the parts of the equipment, which can be serviced\nby an operator, e.g air cleaner, filter, battery clamp, fan belt\netc.\n5. Daily Equipment Time\nRecord (DETR)/ Daily\nTrip Ticket (DTT)\nRefers to a document accomplished by the operator in\nsecuring the equipment relative to load/cargo handling\noperation.\n6. Job site\nRefers to the actual location of work activity.\n7. Safe working load\nRefers to the maximum rated capacity of the forklift\n\n--- PDF PAGE 76 ---\nTR HEAVY EQUIPMENT OPERATION\n\nACKNOWLEDGEMENTS\n\nThe Technical Education and Skills Development Authority (TESDA)\nwishes to extend thanks and appreciation to the many representatives of\nbusiness, industry, academe and government agencies who contributed their\ntime and expertise to the development and validation of these Training\nRegulations.\n\n•\nTHE TECHNICAL EXPERT PANEL (TEP)\n\nFlorello P. Quianzon\nConsultant, Equipment Concrete Product Division\n(Equipment Management)\nMakati Development Corporation\nAyala-Alabang, Muntinlupa City\nRenato P. Faigao\nEquipment Manager (Operations and\nMaintenance Management)\nMANCON-CBDC Joint Venture\nPasong Tamo, Extension,\nMakati City\nSamuel M. Puquiz\nHead, Mechanical and Technical (Construction\nEquipment Repair and Maintenance)\nDM Consunji Inc.\nPasong Tamo Extension, Makati City\nArturo M. Abrera\nHead, Mechanical Works Training Division\n(Civil Works, Heavy Equipment Operation)\nDepartment of Trade and Industry -\nConstruction Manpower Development\nFoundation\nPasong Tamo, Makati City\nLuciano E. Policarpio\nSafety Engineer (Construction Safety)\nFoundation Specialists, Inc.\nPaseo de Roxas, Legaspi Village, Makati City\nRoberto B. Ocampo\nSenior Technical Trainer\nMonark Equipment Corporation\nE. Rodriguez Jr., Avenue,\nLibis, Quezon City\nTito C. Tadios\nTraining Manager (Heavy Equipment Operation\nand Maintenance)\nMaxima Equipment Co. Inc.\nMapulang lupa, Valenzuela City\nCresencio B. Maramag Jr.\nVice President for Operations (Equipment\nManagement, Testing and Certification)\nFirst Philippines Skills and Equipment Testing\nCorp.\nBagong Ilog, Pasig City\nNicanor A. Lucanas Jr.\nMachine Operations Specialist\nMonark Equipment Corporation\nE. Rodriguez Jr. Avenue,\nLibis, Quezon City\nRudolfo D. Ancheta\nQuality Controller Supervisor (Repair and\nMaintenance of Hydraulic Excavator/Basic\nHydraulic)\nCivil Merchanidising Inc.\nPag-asa, Quezon City\n\n--- PDF PAGE 77 ---\nTR HEAVY EQUIPMENT OPERATION\n\nNestor T. Butacan\nTechnical Trainer\nMaxima Equipment Co. Inc.\nQuezon Avenue,\nQuezon City\nMichael B. Rudolfo\nMaintenance Engineer\nC.M. Pancho Construction Inc.\nScout Borromeo St.,\nDiliman, Quezon City\nVerano O. Maligalig\nTechnical Officer (Heavy Equipment Operation\nand Maintenance)\nACEL, Inc.\nJollibee Plaza Bldg., Emerald Avenue, Ortigas,\nPasig City\nErwin Y. Bituin\nTechnical Training Specialist\nMonark Equipment Corporation\nE. Rodriguez jr. Avenue,\nLibis, Quezon City\nFernando B. Seva\nDivision Manager (Operations, Management\nTraining Delivery Division)\nPhilippine Ports Authority\nPort Area, South Harbor, Manila\nSixto Benedicto\nVice President for Operations (Rigging -\nTrainor)\nBenedicto Steel Corp.\nPasong Tamo, Makati City\nRaymundo O. Espiritu\nIndustrial Relations Development (Cargo Handling\nSpecialist)\nPhilippine Ports Authority\nPort Area, South Harbor, Manila\nIsagani G. Pamanilaga\nForklift Operator\nNorth Star Po