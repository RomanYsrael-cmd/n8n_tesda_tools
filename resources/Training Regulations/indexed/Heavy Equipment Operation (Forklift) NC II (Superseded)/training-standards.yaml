  "source_section_text": "SECTION 3 TRAINING STANDARDS\n\nThese guidelines are set to provide the Technical and Vocational\nEducation and Training (TVET) providers with information and other important\nrequirements to consider when designing training programs for HEAVY\nEQUIPMENT OPERATION NC II.\n\n 3.1 CURRICULUM DESIGN\n\nCourse Title : HEAVY EQUIPMENT OPERATION - FORKLIFT\nNC Level:\n\nBASIC COMPETENCIES\nNominal Training Hours:\n18 Hours (Basic) + 18 Hours (Common)\nCourse Description:\n\nThis course is designed to equip individuals with the basic, common and\ncore competencies in Construction Sector particularly in Heavy-Equipment\nOperation.\n\nTo obtain this, all units prescribed for this qualification must be achieved:\n\nBASIC COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and convey\nworkplace information.\n1.2 Complete relevant work\n related documents\n1.3 Participate in\nworkplace meeting and\ndiscussion.\nGroup\ndiscussion\nInteraction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n2. Work in a team\n environment\n2.1 Describe and identify\nteam role and\nresponsibility in a team.\n2.2 Describe work as a team\nmember.\nDiscussion\nInteraction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n\n--- PDF PAGE 61 ---\nTR HEAVY EQUIPMENT OPERATION Promulgated December 2004\n\n3. Practice career\nprofessionalism\n3.1 Integrate personal\nobjectives with\norganizational goals.\n3.2 Set and meet work\npriorities.\n3.3 Maintain professional\ngrowth and development.\nDiscussion\nInteraction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n4. Practice\noccupational\nhealth and safety\n4.1 Evaluate hazard and\nrisks\n4.2 Control hazards and risks\n4.3 Maintain occupational\nhealth and safety\nawareness\nDiscussion\nPlant tour\nSymposium\n• Observation\n• Interview\n\n--- PDF PAGE 62 ---\nTR HEAVY EQUIPMENT OPERATION Promulgated December 2004\n\nCOMMON COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Prepare\nconstruction\nmaterials and\ntools\n1.1 Identify Materials\n1.2 Requisition\nMaterials\n1.3 Receive and inspect\nmaterials\nAudio Visual\nsimulation\nDiscussion\nPractical\nexercise\nDemonstration\n• Direct observation\n• Questions or\ninterview\n• Portfolio\n(credentials)\n• Written / Oral Test\n•\nDemonstration\n2. Observe\nprocedures,\nSpecifications\nand Manuals of\nInstructions\n2.1 Identify and access\nspecification/\nmanuals\nAudio Visual\nSimulation\nDiscussion\nPractical Lab\nDemonstration\n• Direct observation\n• Oral questioning\n• Written test or\nexamination\n• Third party report\n• Demonstration\n(able to impart\nknowledge and\nskills)\n3. Interpret\nTechnical\nDrawing\n3.1 Analyze sign,\nsymbols and data\n3.2 Interpret technical\ndrawing and plans\n3.3 Apply freehand\nsketching\nAudio Visual\nSimulation\nDiscussion\nPractical Lab\nDemonstration\n• Direct observation\n• Oral questioning\n• Written test or\nexamination\n• Third party report\n• Demonstration\n(able to impart\nknowledge and\nskills)\n4. Perform\nmensurations\nand calculation\n4.1 Select measuring\ninstruments\n4.2 Carry out\nmeasurements\nand calculations\nAudio Visual\nSimulation\nDiscussion\nPractical Lab\nDemonstration\n• Direct observation\n• Oral questioning\n• Written test or\nexamination\n• Third party report\n• Demonstration\n(able to Impart\nknowledge and\nskills)\n\n--- PDF PAGE 63 ---\nTR HEAVY EQUIPMENT OPERATION Promulgated December 2004\n\n5. Maintain tools\nand equipment\n5.1 Check condition of\ntools and\nequipment\n5.2 Perform basic\npreventive\nmaintenance\n5.3 Sharpen edge and\ntooth cutting tools\n5.4 Store tools and\nequipment\nAudio Visual\nSimulation\nDiscussion\nPractical Lab\nDemonstration\n• Direct observation of\napplication of tasks\n• Oral questioning\n• Written test or\n1.\nexamination\n• Third party report\n• Demonstration\n\n--- PDF PAGE 64 ---\nTR HEAVY EQUIPMENT OPERATION Promulgated December 2004\n\nCORE COMPETENCIES\n\nCourse Title\n: HEAVY EQUIPMENT OPERATION Level: NC II\n\n FORKLIFT\n\nNominal Training Hours:\n120 Hours\n\nCourse Description:\n\nThis course is designed to enhance the knowledge, desirable attitudes\nand skills in the use of forklift in accordance with industry standards. It covers the\ncore competencies of: performing pre- and post operation procedure, performing\nproductive operation, and performing basic preventive-maintenance servicing on\na given forklift.\n\nTo obtain this, all units prescribed for this qualification must be achieved.\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Perform\n pre- and post\n operation\n procedure for\nForklift\n1.1 Identify forklift types /\ncomponents parts\n1.2 Perform visual check of\nequipment\n1.3 Check BLOWAF of\nforklift\n1.3.1 Battery\n1.3.2 Light\n1.3.3 Oil\n1.3.4 Water\n1.3.5 Air\n1.3.6 Fuel\n1.4 Check forklift system\noperation\n1.5 Check safety devices\naccessories\n1.6 Perform post operation\ncheck\n\nLecture\nPractical /\nDemonstration\n\n• Observation /\nDemonstration\nand interview\n• Written test\n\n--- PDF PAGE 65 ---\nTR HEAVY EQUIPMENT OPERATION Promulgated December 2004\n\n2. Perform productive\noperation for Forklift\n\n2.1 Check operational\n area\n2.2 Identify types of\n cargoes\n2.3 Perform load handling\noperation\nLecture\nPractical /\nDemonstration\n\n• Observation /\nDemonstration\nand interview\n• Written test\n\n3. Perform basic\nPreventive-\n maintenance\nservicing for\n Forklift\n\n3.1 Perform safety\npractices and\nhousekeeping\n3.2 Perform preventive\n maintenance and\n servicing\nLecture\nPractical /\ndemonstration\n\n• Observation /\nDemonstration\nand interview\n• Written test\n\n--- PDF PAGE 66 ---\nTR HEAVY EQUIPMENT OPERATION Promulgated December 2004\n\n3.2\nTRAINING DELIVERY\n\nThe delivery of training should adhere to the design of the curriculum.\nDelivery should be guided by the 10 basic principles of competency-based TVET.\n\n• The training is based on curriculum developed from the\ncompetency standards;\n• Learning is modular in its structure;\n• Training delivery is individualized and self-paced;\n• Training is based on work that must be performed;\n• Training materials are directly related to the competency\nstandards and the curriculum modules;\n• Assessment is based in the collection of evidence of the\nperformance of work to the industry required standard;\n• Training is based both on and off-the-job components;\n• Allows for recognition of prior learning (RPL) or current\ncompetencies;\n• Training allows for multiple entry and exit; and\n• Approved training programs are nationally accredited.\n\nThe competency-based TVET system recognizes various types of delivery\nmodes, both on and off-the-job as long as the learning is driven by the\ncompetency standards specified by the industry. The following training modalities\nmay be adopted when designing training programs:\n\n• The dualized mode of training delivery is preferred and\nrecommended. Thus programs would contain both in-school\nand in-industry training or fieldwork components. Details can be\nreferred to the Dual Training System (DTS) Implementing Rules\nand Regulations.\n• Modular/self-paced learning is a competency-based training\nmodality wherein the trainee is allowed to progress at his own\npace. The trainer facilitates the training delivery\n• Peer teaching/mentoring is a training modality wherein fast\nlearners are given the opportunity to assist the slow learners.\n• Supervised industry training or on-the-job training is an\napproach in training designed to enhance the knowledge and\nskills of the trainee through actual experience in the workplace\nto acquire specific competencies prescribed in the training\nregulations.\n• Distance learning is a formal education process in which\nmajority of the instruction occurs when the students and\n\n--- PDF PAGE 67 ---\nTR HEAVY EQUIPMENT OPERATION Promulgated December 2004\n\ninstructor are not in the same place. Distance learning may\nemploy correspondence study, or audio, video or computer\ntechnologies.\n\n3.3\n TRAINEE ENTRY REQUIREMENTS\n\nThis section specifies the qualifications of trainees and educational\nexperience. Other requirements like health and physical requirements may also\nbe stated. Passing written entrance examinations may also be indicated if\nnecessary.\n\n• Can communicate both orally and in writing\n\n• Physically and mentally fit\n\n• With good moral character\n\n• Can perform basic mathematical computations.\n\n3.4\nLIST OF TOOLS, EQUIPMENT AND MATERIALS\n\n--- PDF PAGE 68 ---\nTR HEAVY EQUIPMENT OPERATION Promulgated December 2004\n\nRecommended list of tools, equipment and materials for the training of 25\ntrainees for the operation of forklift.\n\nTOOLS\nEQUIPMENT\nMATERIALS\nQTY\n\nQTY\n\nQTY\n\n1 set\n• Wrenches (box and\nopen-end 8-24 mm-\nmetric & 7/16 –1” -\nEnglish )\n1 unit\n• Forklift (MOA /\nrental)\n10 kg\n• Grease\n1 set\n• Hammer ballpeen\n(3-4 lbs)\n1 unit\n• Portable electric\nair compressor\n4\nliters\n• Engine oil\n(SAE 10w-\n40)\n1 set\n• Pliers (mechanical\n10 “)\n\n30\nliters\n• Hydraulic\nfluid\n (TELLUS\n 68/10W)\n1 pc\n\n• Adjustable wrench\n(18 “)\n\n10\nliters\n• Gear oil (GP\n90/140)\n1 pc\n• Grease gun\n\n1 liter\n• Brake fluid\n(DOT-3)\n1 set\n• Screw driver ( 10 “\nflat & Philips)\n\n4\nliters\n• Water\ncoolant\n1 pc\n• Putty knife\n\n50\nliters\n• Diesoline\n\n50\nliters\n• Gasoline\n\n10\npcs\n• Battery\ndistilled\nwater\n\n1 pc\n•Fuel filter\n\n1 pc\n•Drive belt\n\n2\ncans\n• Penetrating\n Oil (250 ml)\n\n2 kilos\n•Cotton rugs\n\n10\nliters\n• Cleaning\nsolvent\n\n--- PDF PAGE 69 ---\nTR HEAVY EQUIPMENT OPERATION Promulgated December 2004\n\nTOOLS\nEQUIPMENT\nMATERIALS\nQTY\nQTY\nQTY\n\n2 cyl\n•LPG 30 kg\n\n10\npairs\n• Safety shoes\n\n10\npairs\n• Gloves\n\n10\npcs\n• Goggles\n\n10\npcs\n• Dust Mask\n\n10\npcs\n• Hard hat\n\n1 pc\n• Operator’s\nmanual\n\n2 pcs\n• Test weight\n- 2 tons\n - 4 tons\n\nNOTE: Implementation of the training program can be made possible through a MOA\nbetween the training school and industry\n\n--- PDF PAGE 70 ---\nTR HEAVY EQUIPMENT OPERATION Promulgated December 2004\n\n3.5\nTRAINING FACILITIES\n\n2.\n\nThe forklift operation workshop must be of concrete structure.\nBased on class size of 25 students/trainees the space requirements for the\nteaching/learning and circulation areas are as follows:\n\nSPACE REQUIREMENT\nSIZE IN METERS\nAREA IN SQ.\nMETERS\nTOTAL AREA\nIN SQ.\nMETERS\n• Student/Trainee’s Working\nSpace\n 2.0 x 2.0 meters\n4 sq.m per\nstudent\n100.0 sq.m.\n•\nLecture Room\n8.00 x 6.00\n48.00\n48.0\n•\nLearning Resource Center\n4.00 x 6.00\n24.00\n24.0\n•\n\n172\n• Facilities/Equipment/\nCirculation Area\n-\n-\n52\nTOTAL WORK AREA\n-\n224\nWorking field\n0.25 hectare (MOA/Rental)\n\n--- PDF PAGE 71 ---\nTR HEAVY EQUIPMENT OPERATION Promulgated December 2004\n\n 3.6 TRAINERS’ QUALIFICATION\n\nHEAVY-EQUIPMENT OPERATION (FORKLIFT) NC II\n\nTRAINER QUALIFICATION (TQ II)\n•\nMust be a holder of Heavy Equipment Operation (Forklift) NC-II\nor equivalent qualification\n•\nMust have undergone training on Training Methodology II (TM II)\nor equivalent training/experience\n•\nMust be computer literate\n•\nMust be physically and mentally fit\n•\nMust have had at least 5 years job/industry experience*\n•\nMust be a civil-service eligible (for government position or\nappropriate professional license issued by the Professional\nRegulatory Commission)\n\n* Optional. Only when required by the hiring institution.\n\nReference: TESDA Board Resolution No. 2004-03\n\n--- PDF PAGE 72 ---\nTR HEAVY EQUIPMENT OPERATION Promulgated December 2004"
