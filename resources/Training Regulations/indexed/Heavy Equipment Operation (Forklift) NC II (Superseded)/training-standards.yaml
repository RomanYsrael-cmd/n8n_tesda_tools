      "source_text": "3.4\nLIST OF TOOLS, EQUIPMENT AND MATERIALS\n\n--- PDF PAGE 68 ---\nTR HEAVY EQUIPMENT OPERATION Promulgated December 2004\n\nRecommended list of tools, equipment and materials for the training of 25\ntrainees for the operation of forklift.\n\nTOOLS\nEQUIPMENT\nMATERIALS\nQTY\n\nQTY\n\nQTY\n\n1 set\n• Wrenches (box and\nopen-end 8-24 mm-\nmetric & 7/16 –1” -\nEnglish )\n1 unit\n• Forklift (MOA /\nrental)\n10 kg\n• Grease\n1 set\n• Hammer ballpeen\n(3-4 lbs)\n1 unit\n• Portable electric\nair compressor\n4\nliters\n• Engine oil\n(SAE 10w-\n40)\n1 set\n• Pliers (mechanical\n10 “)\n\n30\nliters\n• Hydraulic\nfluid\n (TELLUS\n 68/10W)\n1 pc\n\n• Adjustable wrench\n(18 “)\n\n10\nliters\n• Gear oil (GP\n90/140)\n1 pc\n• Grease gun\n\n1 liter\n• Brake fluid\n(DOT-3)\n1 set\n• Screw driver ( 10 “\nflat & Philips)\n\n4\nliters\n• Water\ncoolant\n1 pc\n• Putty knife\n\n50\nliters\n• Diesoline\n\n50\nliters\n• Gasoline\n\n10\npcs\n• Battery\ndistilled\nwater\n\n1 pc\n•Fuel filter\n\n1 pc\n•Drive belt\n\n2\ncans\n• Penetrating\n Oil (250 ml)\n\n2 kilos\n•Cotton rugs\n\n10\nliters\n• Cleaning\nsolvent\n\n--- PDF PAGE 69 ---\nTR HEAVY EQUIPMENT OPERATION Promulgated December 2004\n\nTOOLS\nEQUIPMENT\nMATERIALS\nQTY\nQTY\nQTY\n\n2 cyl\n•LPG 30 kg\n\n10\npairs\n• Safety shoes\n\n10\npairs\n• Gloves\n\n10\npcs\n• Goggles\n\n10\npcs\n• Dust Mask\n\n10\npcs\n• Hard hat\n\n1 pc\n• Operator’s\nmanual\n\n2 pcs\n• Test weight\n- 2 tons\n - 4 tons\n\nNOTE: Implementation of the training program can be made possible through a MOA\nbetween the training school and industry\n\n--- PDF PAGE 70 ---\nTR HEAVY EQUIPMENT OPERATION Promulgated December 2004"
