  "source_text": "Definition of Terms\n\nFor the purpose of these Competency Standards, the words\n\n1. Forklift\nRefers to a lift truck machine used for handling\nloads/cargoes.\n2. Forklift operator\nRefers to a person who can pick, transfer and stack\ncargoes using a forklift machine and perform preventive\nmaintenance on such equipment.\n3. Preventive-maintenance\nchecklist form\nRefers to a list of activities performed during preventive\nmaintenance works.\n4. Operator-Serviceable\n(OS) parts\nRefer to the parts of the equipment, which can be serviced\nby an operator, e.g air cleaner, filter, battery clamp, fan belt\netc.\n5. Daily Equipment Time\nRecord (DETR)/ Daily\nTrip Ticket (DTT)\nRefers to a document accomplished by the operator in\nsecuring the equipment relative to load/cargo handling\noperation.\n6. Job site\nRefers to the actual location of work activity.\n7. Safe working load\nRefers to the maximum rated capacity of the forklift\n\n--- PDF PAGE 76 ---\nTR HEAVY EQUIPMENT OPERATION"
