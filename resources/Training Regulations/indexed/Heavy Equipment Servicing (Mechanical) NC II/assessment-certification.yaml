  "source_text": "SECTION 4 NATIONAL ASSESSMENT AND CERTIFICATION\nARRANGEMENTS\n\n4.1.\nTo attain the National Qualification of Heavy Equipment Servicing\n(Mechanical) - NC II, the candidate must demonstrate competence\nthrough project-type assessment covering all the units listed in\nSection 1. Successful candidates shall be awarded a National\nCertificate signed by the TESDA Director General.\n\n4.2.\nThe qualification of Heavy Equipment Servicing (Mechanical) - NC II\ncan be attained through:\n\n 4.2.2 Demonstration of competence through project-type\n assessment covering all the required units of the qualification\n\n4.3.\nAssessment shall focus on the core units of competency. The basic\nand common units shall be integrated or assessed concurrently with\nthe core units.\n\n4.4.\nThe following are qualified to apply for assessment and certification:\n\n 4.4.1 Graduates of formal, non-formal and informal including\n enterprise-based training programs\n\n4.4.2 Experienced Workers (wage employed or self-employed)\n\n4.5.\nThe guidelines on assessment and certification are discussed in\ndetail in the Procedures Manual on Assessment and Certification and\nguidelines on the Implementation of the Philippine TVET Qualification\nand Certification System (PTQCS).\n\n--- PDF PAGE 89 ---\nTR HEAVY EQUIPMENT OPERATION\n\n I\n\n"
