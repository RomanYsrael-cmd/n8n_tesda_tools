        "evidence_guide": {
          "source_text": "1. Critical aspects\nof competency\nAssessment requires that the candidate:\n1.1 Identified and determined signs, symbols and data\naccording to work plan, job requirements and\nclassifications\n1.2 Identified tools and equipment in accordance with job\nrequirements\n1.3 Listed supplies and materials according to blueprint\nspecifications\n1.4 Drawn workplan following specifications\n1.5 Determined job specifications based on working/technical\ndrawing\n\n2. Underpinning\nknowledge\n\n2.1 TRADE MATHEMATICS\n 2.1.1 Linear measurement\n 2.1.2 Dimension\n 2.1.3 Unit conversion\n2.2 BLUEPRINT READING AND PLAN SPECIFICATION\n 2.2.1 Electrical, mechanical plan, symbols and\nabbreviations\n 2.2.2 Drawing standard symbols\n2.3 TRADE THEORY\n 2.3.1 Basic technical drawing\n 2.3.2 Types technical plans\n 2.3.3 Various types of drawings\n 2.3.4 Notes and specifications\n3. Underpinning skills\n3.1 Interpreting drawing/orthographic drawing\n3.2 Interpreting technical plans\n3.3 Matching specification details with existing resources\n3.4 Following instructions\n3.5 Handling of drawing instruments\n4. Resource implications\nThe following resources should be provided:\n4.1 Workplace\n4.2 Drawings and specification relevant to task\n4.3 Materials and instrument relevant to proposed activity\n\n--- PDF PAGE 29 ---\nTR HEAVY EQUIPMENT SERVICING NC II\n27\n5. Methods of\nassessment\nCompetency should be assessed through:\n5.1 Direct observation\n5.2 Questions/interview\n5.3 Written test related to underpinning knowledge\n6. Context of assessment\n6.1 Competency assessment may occur in the workplace or in\nany appropriate simulated environment\n6.2 Assessment shall be observed while task are being\nundertaken whether individually or in group\n6.3 Competency assessment must be undertaken in\naccordance with the endorsed TESDA assessment\nguidelines\n\n--- PDF PAGE 30 ---\nTR HEAVY EQUIPMENT SERVICING NC II\n28\n\nUNIT OF COMPETENCY:\nPERFORM MENSURATIONS AND CALCULATIONS\nUNIT CODE :"
        },
        "source_text": "CON311202\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes on\nanalyzing and interpreting symbols, data and work plan based\non the required performance standards.\n\nELEMENT\nPERFORMANCE CRITERIA\nBold and italicized terms are elaborated in the\nRange of Variables\n1. Analyze signs, symbols\nand data\n\n1.1 Technical plans are obtained according to job\nrequirements\n1.2 Signs, symbols and data are identified according to job\nspecifications\n1.3 Signs symbols and data are determined according to\nclassification or as appropriate in drawing\n\n2. Interpret technical\ndrawings and plans\n2.1 Necessary tools, materials and equipment are identified\naccording to the plan\n2.2 Supplies and materials are listed according to\nspecifications\n2.3 Components, assemblies or objects are recognized as\nrequired\n2.4 Dimensions are identified as appropriate to the plan\n2.5 Specification details are matched with existing/available\nresources and in line with job requirements\n2.6 Work plan is drawn following the specifications\n3. Apply freehand\nsketching\n3.1 Where applicable, correct freehand sketching is produced\nin accordance with the job requirements\n\n--- PDF PAGE 27 ---\nTR HEAVY EQUIPMENT SERVICING NC II\n25\n\nRANGE OF VARIABLES\nVARIAB\nLE\nRANGE\n1. Technical plans\nIncluding but not limited to:\n1.1 Electrical plans\n1.2 Structural plans\n1.3 Architectural plans\n1.4 Plumbing plans\n1.5 Welding Procedures Specifications (WPS)\n2. Work plan\n\n2.1 Job requirements\n2.2 Installation instructions\n2.3 Components instruction\n3. Classification\n\nIncluding but not limited to:\n3.1 Electrical\n3.2 Mechanical\n3.3 Plumbing\n4. Drawing\n4.1 Drawing symbols\n4.2 Alphabet of lines\n4.3 Orthographic views\n-\nFront view\n-\nRight side view/left side view\n-\nTop view\n-\nPictorial\n4.4 Schematic diagram\n4.5 Electrical drawings\n4.6 Structural drawings\n4.7 Plumbing drawings\n-\nWater\n-\nSewerage/Drainage\n-\nVentilation\n4.8 Welding symbols\n5. Tools and materials\nIncluding but not limited to:\n5.1 Compass\n5.2 Divider\n5.3 Rulers\n5.4 Triangles\n5.5 Drawing tables\n\n--- PDF PAGE 28 ---\nTR HEAVY EQUIPMENT SERVICING NC II\n26\n5.6 Computer\n\nEVIDENCE GUIDE\n1. Critical aspects\nof competency\nAssessment requires that the candidate:\n1.1 Identified and determined signs, symbols and data\naccording to work plan, job requirements and\nclassifications\n1.2 Identified tools and equipment in accordance with job\nrequirements\n1.3 Listed supplies and materials according to blueprint\nspecifications\n1.4 Drawn workplan following specifications\n1.5 Determined job specifications based on working/technical\ndrawing\n\n2. Underpinning\nknowledge\n\n2.1 TRADE MATHEMATICS\n 2.1.1 Linear measurement\n 2.1.2 Dimension\n 2.1.3 Unit conversion\n2.2 BLUEPRINT READING AND PLAN SPECIFICATION\n 2.2.1 Electrical, mechanical plan, symbols and\nabbreviations\n 2.2.2 Drawing standard symbols\n2.3 TRADE THEORY\n 2.3.1 Basic technical drawing\n 2.3.2 Types technical plans\n 2.3.3 Various types of drawings\n 2.3.4 Notes and specifications\n3. Underpinning skills\n3.1 Interpreting drawing/orthographic drawing\n3.2 Interpreting technical plans\n3.3 Matching specification details with existing resources\n3.4 Following instructions\n3.5 Handling of drawing instruments\n4. Resource implications\nThe following resources should be provided:\n4.1 Workplace\n4.2 Drawings and specification relevant to task\n4.3 Materials and instrument relevant to proposed activity\n\n--- PDF PAGE 29 ---\nTR HEAVY EQUIPMENT SERVICING NC II\n27\n5. Methods of\nassessment\nCompetency should be assessed through:\n5.1 Direct observation\n5.2 Questions/interview\n5.3 Written test related to underpinning knowledge\n6. Context of assessment\n6.1 Competency assessment may occur in the workplace or in\nany appropriate simulated environment\n6.2 Assessment shall be observed while task are being\nundertaken whether individually or in group\n6.3 Competency assessment must be undertaken in\naccordance with the endorsed TESDA assessment\nguidelines\n\n--- PDF PAGE 30 ---\nTR HEAVY EQUIPMENT SERVICING NC II\n28\n\nUNIT OF COMPETENCY:\nPERFORM MENSURATIONS AND CALCULATIONS\nUNIT CODE :"
