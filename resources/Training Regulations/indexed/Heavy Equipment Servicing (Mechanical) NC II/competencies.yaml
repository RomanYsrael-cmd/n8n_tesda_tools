        "source_text": "--- PDF PAGE 40 ---\nTR HEAVY EQUIPMENT SERVICING NC II                                                                                                                                                               \n38\n \n \nCORE COMPETENCIES \n \nUNIT OF COMPETENCY:\nSERVICE ENGINE SYSTEM (II)\nUNIT CODE: \nCON723305 \nUNIT DESCRIPTOR: \nThis unit involves the knowledge, skills and \nattitudes in servicing engine system of heavy \nequipment. This unit specifically deals with the \nrequired skills for checking, testing, adjusting, \ntroubleshooting, repairing and / or replacing the \nvarious parts and components of heavy equipment \nengine system.\n \nELEMENT \nPERFORMANCE CRITERIA  \nBold and Italicized terms are elaborated in the  \nRange of Variables\n1. Check engine system \n1.1 Work instructions are secured from immediate \nsuperior. \n1.2 PPE and basic/special hand tools and shop \nequipment are selected and used based on \njob requirements. \n1.3 Equipment operation is performed following \nstandard operating procedures.  \n1.4 Engine system and related components and \nparts checking procedure is applied following \nmanufacturer's specifications.  \n1.5 Unexpected situations are responded to in \nline with company rules and regulations in a \nmanner that minimizes risks to personnel and \nequipment. \n1.6 Completion report is prepared and submitted \nbased on standard operating procedures.\n\n--- PDF PAGE 41 ---\nTR HEAVY EQUIPMENT SERVICING NC II                                                                                                                                                               \n39\n \n2. Test and adjust engine  \n     system  \n2.1 Work instructions are secured from immediate  \n      superior. \n2.2 PPE and basic/special hand tools and shop  \n      equipment are selected and used based on  \n      job requirements. \n2.3 Equipment operation is performed following  \n      standard operating procedures.  \n2.4 Engine system testing procedure is  \n      applied in accordance with manufacturer's  \n      specifications. \n2.5 Structure and parts adjustment procedure is \n      applied following manufacturer's specifications. \n2.6 Unexpected situations are responded to in  \n      line with company rules and regulations in a  \n      manner that minimizes risks to personnel  \n      and equipment. \n2.7 Completion report is prepared and submitted  \n      based on standard operating procedures.  \n3. Troubleshoot engine system \n3.1 Work instructions are secured from immediate  \n      superior. \n3.2 PPE and basic/special hand tools and shop  \n      equipment are selected and used based on  \n      job requirements. \n3.3 Equipment operation is performed following  \n      standard operating procedures.  \n3.4 Engine system troubleshooting  \n      procedure is applied in accordance with  \n      manufacturer's specifications. \n3.5 Structure and parts troubleshooting  \n      procedure is applied following manufacturer's  \n      specifications.  \n3.6 Unexpected situations are responded to in  \n      line with company rules and regulations in a  \n      manner that minimizes risks to personnel  \n      and equipment. \n3.7 Completion report is prepared and submitted  \n      based on standard operating procedures.\n\n--- PDF PAGE 42 ---\nTR HEAVY EQUIPMENT SERVICING NC II                                                                                                                                                               \n40\n \n4. Repair and / or replace  \n    engine related components  \n    and parts \n4.1 Work instructions are secured from immediate  \n      superior. \n4.2 PPE and basic/special hand tools and shop  \n      equipment are selected and used based on  \n      job requirements. \n4.3 Equipment operation is performed following  \n      standard operating procedures.  \n4.4 Engine system and related components and \n      parts repair and / or replacement procedure \n      is applied in accordance with manufacturer's  \n      specifications. \n4.5 Unexpected situations are responded to in  \n      line with company rules and regulations in a  \n      manner that minimizes risks to personnel  \n      and equipment. \n4.6 Completion report is prepared and submitted  \n      based on standard operating procedures.\n\n--- PDF PAGE 43 ---\nTR HEAVY EQUIPMENT SERVICING NC II                                                                                                                                                               \n41\nRANGE OF VARIABLES \nVARIABLE \nRANGE \n1.  PPE \nMay include but not limited to: \n1.1 Working clothes \n1.2 Safety shoes  \n1.3 Hard hats  \n1.4 Goggles  \n1.5 Gloves  \n1.6 Respiratory mask \n1.7 Ear plugs  \n2.  Basic / special  \n     hand tools and     \n     shop equipment \n \nMay include but not limited to:  \n2.1 Wrench \n2.2  Pliers \n2.3  Cutters  \n2.4  Hammer  \n2.5  Screw drivers \n2.6  Filler gauge \n2.7  Torque wrench\n\n--- PDF PAGE 44 ---\nTR HEAVY EQUIPMENT SERVICING NC II                                                                                                                                                               \n42\n3.  Engine system  \n     and related       \n     components and \n     parts \n3.1 Air induction and exhaust system \n3.1.1 Pre-cleaner  \n3.1.2 Air filter (primary and secondary) \n3.1.3 Air filter restriction indicator \n3.1.4 Evacuator valve \n3.1.5 Automatic dust ejector \n3.1.6 Air filter housing  \n3.1.7 Intake and exhaust manifold \n3.1.8 Hose and clamps \n3.1.9 Turbocharger \n3.1.10  Aftercooler \n3.1.11  Muffler \n3.1.12  Stack \n3.1.13  Gaskets \n3.1.14  Rain cap \n       3.1.15  Air breather \n3.2 Cooling system \n       3.2.1 Water pump \n       3.2.2 Thermostat \n       3.2.3 Hoses and clamps \n       3.2.4 Fan belts \n       3.2.5 Radiator fan \n       3.2.6 Radiator and fan guard/shroud \n       3.2.7 Radiator cap \n       3.2.8 Reservoir/Expansion tank \n       3.2.9 Fan motor drive \n       3.2.10  Radiator \n3.3 Fuel system \n       3.3.1 Fuel tank  \n       3.3.2 Filler cap \n       3.3.3 Hose, fuel lines and fittings \n       3.3.4 Filter (primary and secondary) \n       3.3.5 Priming pump \n       3.3.6 Water separator \n       3.3.7 Fuel transfer pump  \n       3.3.8 Injection pump and governor \n       3.3.9 Injector and injection nozzles\n\n--- PDF PAGE 45 ---\nTR HEAVY EQUIPMENT SERVICING NC II                                                                                                                                                               \n43\n \n \n3.4 Lubrication system \n3.4.1 Oil pan \n        3.4.2 Oil filter (primary and secondary) \n        3.4.3 Hoses and tubes \n        3.4.4 Oil cooler \n3.5 Electronic system \n3.5.1 Sensors \n3.5.2 Electronic control unit/module (ECU/ECM) \n3.5.3 Actuators/solenoids \n3.5.4 Control panel/Electronic Monitoring System (EMS) \n4.  Checking \nprocedures \n4.1 Visual \n4.2 Actual/sensory \n5.  Unexpected \nsituations \n \nMay include but not limited to: \n5.1 Collapse of unstable terrain \n5.2 Natural calamities \n5.3 Situations arising from poor peace and order \n5.4 Force majeure \n5.5 Mechanic fatigue or sickness \n6.   Testing \nprocedures \n6.1 Sensory  \n6.2 Diagnostic field test  \n7.   Engine system \ntesting \nprocedure  \nTest the following and which may include: \n7.1 Air induction and exhaust system \n        7.1.1 Boost pressure    \n        7.1.2 Boost temperature \n        7.1.3 Exhaust manifold temperature \n        7.1.4 Intake pressure and resistance  \n        7.1.5 Exhaust pressure  \n        7.1.6 Exhaust temperature \n        7.1.7 Blow-by pressure (crank case)   \n        7.1.8 Compression pressure \n        7.1.9 Exhaust gas color condition \n7.2 Cooling system \n        7.2.1 Thermostat condition (opening temperature) \n        7.2.2 Coolant flow (water pump)   \n        7.2.3 Radiator temperature differential  \n        7.2.4 Radiator expansion tank/relief pressure (opening  \n                 pressure)  \n        7.2.5 Fan belt tension and adjust if necessary \n        7.2.6 Hydraulic driven fan pressure\n\n--- PDF PAGE 46 ---\nTR HEAVY EQUIPMENT SERVICING NC II                                                                                                                                                               \n44\n \n7.3 Fuel system  \n        7.3.1 Fuel pressure  \n        7.3.2 Priming pump pressure  \n        7.3.3 Incorrect travel distance of governor linkage and  \n                 adjust if necessary \n        7.3.4 Injection timing \n        7.3.5 Fuel filter differential pressure \n        7.3.6 Fuel pressure regulator \n        7.3.7 Fuel cooler temperature differential \n7.4 Lubrication system  \n        7.4.1 Oil pressure  \n        7.4.2 Oil cooler and filter-based by-pass valve (opening  \n                 pressure)  \nPriority valve pressure (turbocharger) and adjust if  \n         necessary \nOil temperature \nElectronic system \n7.5.1 Open, grounded, shortage, intermittent signal  \n                   7.5.1.1 Sensor, switches and senders \n                   7.5.1.2 Temperature \n                   7.5.1.3  Pressure \n                   7.5.1.4 Level \n                   7.5.1.5 Speed/timing  \n                   7.5.1.6 Throttle position \n                   7.5.1.7 Flow \n8.  Structure and  \n     parts adjusting \n     procedure \nField work adjustment is applied on the following: \n8.1 Valve clearance  \n8.2 Injector timing/injection pump timing \n8.3 Valve timing \n9.  Engine system  \n     troubleshooting \n     procedure  \nTroubleshoot the following and which may include: \n9.1 Air induction and exhaust system  \n      9.1.1 Black (smoke) exhaust emission \n9.2 Cooling system \n      9.2.1 Engine overheating \n      9.2.2 Engine overcooling \n9.3 Fuel system  \n      9.3.1 Low fuel pressure \n      9.3.2 Fuel knocking  \n      9.3.3 Black smoke \n9.4 Lubrication system \n      9.4.1 Blue smoke emission \n       9.4.2 Low oil pressure\n\n--- PDF PAGE 47 ---\nTR HEAVY EQUIPMENT SERVICING NC II                                                                                                                                                               \n45\n10. Structure and   \n      parts  \n      troubleshooting \n     procedure\n10.1 Blue smoke emission \n10.2 Low oil pressure \n10.3 Blow-by (crank case) pressure \n11. Engine system  \n      and related   \n      components  \n      repair and / or  \n      replacement  \n      procedure \nRepair and / or replace the following and which may include: \n11.1 Air induction and exhaust  \n        11.1.1 Turbocharger \n        11.1.2 Manifold (intake/exhaust) \n        11.1.3 Hoses and clamps \n        11.1.4 Air filters (primary and secondary) \n        11.1.5 After-cooler \n11.2 Cooling system  \n      11.2.1 Water pump  \n      11.2.2 Thermostat \n      11.2.3 Hose and clamps \n      11.2.4 Guard/shroud \n      11.2.5 Fan belts \n      11.2.6 Fan drive/hydraulic fan motor \n      11.2.7 Water manifold \n      11.2.8 Radiator \n      11.2.9 Cooling fan \n11.2.10  Seals and gaskets \n11.3 Fuel system  \n     11.3.1 PT/injection pump \n     11.3.2 Unit injectors/injection nozzle \n     11.3.3 Priming pump \n     11.3.4 Transfer pump \n     11.3.5 Fuel lines \n     11.3.6 Seals and gaskets \n     11.3.7 Linkages \n     11.3.8 Fuel cooler \n11.4 Lubrication system  \n     11.4.1 Oil cooler \n     11.4.2 Oil pump \n     11.4.3 Relief valve \n     11.4.4 Oil filters and oil cooler by-pass valve \n     11.4.5 Oil line, fittings and couplings \n     11.4.6 Seals and gaskets\n\n--- PDF PAGE 48 ---\nTR HEAVY EQUIPMENT SERVICING NC II                                                                                                                                                               \n46\nEVIDENCE GUIDE \n1. Critical aspects  \nof evidence \n \nAssessment requires evidence that the candidate: \n1.1 Demonstrated ability to perform various engine systems,  \n       components structure and parts checking, testing and  \n       adjusting troubleshooting and repairing or replacing  \n       procedures. \n1.2 Demonstrated ability to read and interpret schematic  \n       diagrams, graph, drawings and symbols.  \n1.3 Demonstrated knowledge of parts and components of the  \n       various engine systems  \n1.4 Demonstrated ability to read and interpret manufacturer’s  \n       specifications. \n1.5 Demonstrated ability to comply with company rules and  \n       regulations. \n2. Underpinning \nknowledge and \nattitude \n \n2.1 Identify components structures and parts and functions of \nengine systems  \n2.2 Checking, testing and adjusting, and repairing and/or  \nreplacement procedures for engine systems \n2.3  Types and uses of PPE \n2.4  Types and uses of basic and special hand tools \n2.5  Ability to understand manufacturer’s specifications \n2.6  Schematic diagrams, graphs, drawings and symbols \n2.7  Basic shop mathematics and mensuration  \n2.8  Company rules and regulations \n2.9  Computer literacy \n2.10     Positive work values (cost, time, quality consciousness, \n            etc.) \n3. Underpinning \nskills \n3.1  Following checking, testing and adjusting, repair and/or   \n       replacing procedures of component structures, parts and   \n       systems procedures for engine system  \n3.2  Using PPE \n3.3  Using basic and special hand tools and shop equipment \n3.4  Following manufacturer’s specifications \n3.5  Interpreting schematic diagrams, drawings and symbols \n3.6  Applying mensuration  \n3.7  Operating computer \n3.8  Following company rules and regulations\n\n--- PDF PAGE 49 ---\nTR HEAVY EQUIPMENT SERVICING NC II                                                                                                                                                               \n47\n4. Resource \nimplications \nThings necessary for the conduct of assessment include \n4.1 Access to heavy equipment \n4.2 Shop and parts manual/catalogue \n4.3 Basic and special hand tools and shop equipment \n4.4 PPE \n4.5 Materials relevant to the activity \n5. Method of \nassessment \nCompetency in this unit must be assessed through  \n5.1 Written / oral questioning \n5.2 Observation of practical demonstration \n5.3 Work documents  \n5.4 Third party report \n6. Context of \nassessment \n6.1 Assessment may be conducted on-the-job or in a simulated  \n      venue and in accordance with safe work procedures.\n",
