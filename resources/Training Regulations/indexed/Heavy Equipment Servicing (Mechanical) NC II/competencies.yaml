        "source_text": "--- PDF PAGE 66 ---\nTR HEAVY EQUIPMENT SERVICING NC II                                                                                                                                                               \n64\nUNIT OF COMPETENCY:\nSERVICE UNDERCARRIAGE SYSTEM (II)\nUNIT CODE: \nCON723308 \nUNIT DESCRIPTOR: \nThis unit describes the outcomes required for \nservicing the undercarriage system of heavy \nequipment. It deals with the skills required for \nchecking, testing, measuring and repairing or \nreplacing \nthe \nundercarriage \nsystem \nand \ncomponents for heavy equipment.\n \nELEMENT \n \n \nPERFORMANCE CRITERIA  \nBold and Italicized terms are elaborated in the Range \nof Variables \n1.   Check undercarriage \nsystem \n1.1 Work instructions are secured from immediate  \n      superior. \n1.2 PPE and basic/special tools and shop  \n      equipment are selected and used based on  \n       job requirements. \n1.3 Equipment operation is performed following  \n      standard operating procedures.  \n1.4 Undercarriage system and related  \n      components checking procedure is applied  \n      according to manufacturer's specifications. \n1.5 Unexpected situations are responded to in     \n       line with company rules and regulations in a       \n       manner that minimizes risks to personnel        \n       and equipment. \n1.6 Completion report is prepared and         \n       submitted based on standard operating        \n       procedures.\n\n--- PDF PAGE 67 ---\nTR HEAVY EQUIPMENT SERVICING NC II                                                                                                                                                               \n65\n \n2. Test undercarriage system \n2.1 Work instructions are secured from immediate  \n      superior. \n2.2 PPE and basic/special hand tools and shop  \n      equipment are selected and used based on job \n      requirements. \n2.3 Equipment operation is performed following  \n      standard operating procedures.  \n2.4 Undercarriage system testing  \n      procedure is applied according to job  \n      requirements. \n2.5 Unexpected situations are responded to in  \n      line with company rules and regulations in a  \n      manner that minimizes risks to personnel  \n      and equipment. \n2.6 Completion report is prepared and submitted  \n      based on standard operating procedures.  \n3. Measure wear of \nundercarriage and   \n    related components  \n3.1 Work instructions are secured from immediate  \n      superior. \n3.2 PPE and basic/special hand tools and shop  \n      equipment are selected and used based on job \n      requirements. \n3.3 Equipment operation is performed following  \n      standard operating procedures. \n3.4 Undercarriage system measuring  \n      procedure is applied according to  \n      manufacturer's specifications. \n3.5 Unexpected situations are responded to in  \n      line with company rules and regulations in a  \n      manner that minimizes risks to personnel  \n      and equipment. \n3.6 Completion report is prepared and  \n      submitted based on standard operating  \n      procedures.\n\n--- PDF PAGE 68 ---\nTR HEAVY EQUIPMENT SERVICING NC II                                                                                                                                                               \n66\n \n4. Repair and/or replacement of \n    undercarriage  \n    components/parts \n4.1 Work instructions are secured from immediate  \n      superior. \n4.2 PPE and basic/special hand tools and shop  \n      equipment are selected and used based on job \n      requirements. \n4.3 Equipment operation is performed following  \n      standard operating procedures. \n4.4 Undercarriage system and related  \n      components/parts \nrepair \nand/or \nreplacement procedure is applied  according \nto manufacturer's specifications. \n4.5 Unexpected situations are responded to in  \n      line with company rules and regulations in a  \n      manner that minimizes risks to personnel  \n      and equipment. \n4.6 Completion report is prepared and submitted  \n      based on standard operating procedures.\n\n--- PDF PAGE 69 ---\nTR HEAVY EQUIPMENT SERVICING NC II                                                                                                                                                               \n67\nRANGE OF VARIABLES \nVARIABLE \nRANGE \n1. PPE \n \nMay include but not limited to: \n1.1 Working clothes \n1.2 Safety shoes  \n1.3 Hard hats  \n1.4 Goggles  \n1.5 Gloves  \n1.6 Respiratory mask \n1.7 Ear plugs  \n2.  Basic / special  \ntools and shop \nequipment \n \nMay include but are not limited to:  \n2.1  Wrench \n2.2  Pliers \n2.3  Cutters  \n2.4  Hammer  \n2.5  Pry bar \n2.6  Hydraulic Jack \n2.7  Measuring Tool Kit \n2.8 Ultrasonic \n2.9 Multi scale \n2.10 Straight gauge \n2.11 Depth gauge \n2.12 Outside/inside caliper \n2.13 Steel rule \n2.14 Vernier caliper \n2.15  Hydraulic press (push/pull) \n2.16 Impact/Torque wrench \n2.17 Grease gun\n\n--- PDF PAGE 70 ---\nTR HEAVY EQUIPMENT SERVICING NC II                                                                                                                                                               \n68\n3.   Undercarriage \nsystem and \nrelated  \ncomponents \nchecking \nprocedure \n3.1 Track Group  \n    3.1.1Track Shoe  \n    3.1.2 Bolts / nuts \n    3.1.3 Pin and Bushing \n    3.1.4 Link \n    3.1.5 Master Pin/Link \n3.2 Idler  \n    3.2.1 Bearing \n    3.2.2 Cover \n    3.2.3 Seals \n    3.2.4 Bushing \n    3.2.5 Pin \n    3.2.6 Gasket \n    3.2.7 Shim \n    3.2.8 Bolts \n    3.2.9Cap \n3.3 Track and Carrier Roller \n    3.3.1 Packing seals \n    3.3.2 Pin \n    3.3.3 Bushing \n    3.3.4 Cover/collar \n    3.3.5 Bolts and nuts \n    3.3.6 Protective guard \n    3.3.7 Cap \n3.4 Track frame and related components \n        3.4.1 Protective guard \n3.4.2 Bolts/nuts \n3.4.3 Equalizer bar \n3.4.4 Pivot Shaft \n3.4.5 Shim \n3.4.6 Bushing \n3.4.7 Diagonal brace and beam \n3.4.8 Spring \n3.4.9 Yoke \n3.4.10 Roller guard \n3.4.11 Trunion holder \n3.5 Track adjuster cylinder \n    3.5.1 Cylinder housing \n    3.5.2 Cover \n    3.5.3 Packing seals \n    3.5.4 Rod \n    3.5.5 Spring \n    3.5.6 Fittings \n    3.5.7 Bolts and nuts \n    3.5.8 bushing\n\n--- PDF PAGE 71 ---\nTR HEAVY EQUIPMENT SERVICING NC II                                                                                                                                                               \n69\n 4.   Unexpected  \n       situations \n \nMay include but not limited to: \n4.1 Collapse of unstable terrain \n4.2 Natural calamities \n4.3 Situations arising from poor peace and order \n4.4 Force majeure \n4.5 Mechanic fatigue or sickness \n5.   Undercarriage  \n      group testing  \n      procedures \nMay include but not limited to: \n5.1 Test system operations and functions \n5.1.1  Rotations and movements \n    5.1.2  Alignments \n    5.1.3  Leakages \n    5.1.4  Bolts and nuts \n6.   Undercarriage \nsystem \nmeasuring \nprocedure \nMeasure the following: \n6.1 Track group \n            6.1.1 Track shoe \n    6.1.2 Grouser height \n    6.1.3 Plate thickness \n6.2 Link \n    6.2.1 Height \n    6.2.2 Pitch \n    6.2.3 Width \n6.3 Bushing \n    6.3.1 Diameter (inside and outside) \n6.4 Tension \n    6.4.1 Sag / clearance \n6.5 Idler  \n            6.5.1 Flange height and width \n            6.5.2 Outside diameter \n6.6 Sprocket \n            6.6.1 Wear pattern \n6.7 Carrier and track roller  \n            6.7.1 Flange height and width \n            6.7.2 Outside diameter \n6.8 Track adjuster cylinder \n6.9 Clearance between yoke and frame\n\n--- PDF PAGE 72 ---\nTR HEAVY EQUIPMENT SERVICING NC II                                                                                                                                                               \n70\n7.  Undercarriage  \n     system   and        \n     related       \n     components /  \n     parts repair        \n     and/or   \n     replacement  \n     procedures \n7.1 Track Group  \n7.1.1  Track Shoe  \n7.1.2  Bolts/nuts \n7.1.3  Pin and Bushing \n7.1.4  Link \n7.1.5  Master Pin/Link \n7.2 Idler  \n     7.2.1 Bearing \n     7.2.2 Cover \n     7.2.3 Seals \n     7.2.4 Bushing \n     7.2.5 Pin \n     7.2.6 Gasket \n     7.2.7 Shim \n     7.2.8 Bolts \n     7.2.9 Cap \n7.3 Track and Carrier Roller \n     7.3.1 Packing seals \n     7.3.2 Pin \n     7.3.3 Bushing \n     7.3.4 Cover/collar \n     7.3.5 Bolts and nuts \n     7.3.6 Protective guard \n     7.3.7 Cap \n7.4 Track frame and related components \n7.4.1  Protective guard \n7.4.2  Bolts/nuts \n7.4.3  Equalizer bar \n7.4.4  Pivot Shaft \n7.4.5  Shim \n7.4.6  Bushing \n7.4.7 Diagonal brace and beam \n7.4.8 Spring \n7.4.9  Yoke \n7.4.10 Roller guard \n7.4.11 Trunion holder \n7.5 Track adjuster cylinder \n      7.5.1 Cylinder housing \n      7.5.2 Cover \n      7.5.3 Packing seals \n      7.5.4 Rod \n      7.5.5 Spring \n      7.5.6 Fittings \n      7.5.7 Bolts and nuts \n      7.5.8 Bushing\n\n--- PDF PAGE 73 ---\nTR HEAVY EQUIPMENT SERVICING NC II                                                                                                                                                               \n71\nEVIDENCE GUIDE \n1. Critical aspects  \nof evidence \n \nThe evidence must show that the candidate: \n1.1 Demonstrated ability to perform undercarriage components \n      checking, testing and adjusting, measuring, and repair or   \n      replacement procedures. \n1.2 Demonstrated ability to read and interpret drawings  \n1.3 Demonstrated knowledge of structure and  \n      components/parts of undercarriage \n1.4 Demonstrated ability to read and interpret manufacturer’s  \n      specifications. \n1.5 Demonstrated ability to comply with company rules and  \n      regulations. \n2. Underpinning \nknowledge and \nattitude \n \n2.1 Structure, components/parts and functions of \n      undercarriage  \n2.2 Checking, testing and adjusting, measuring and repair or  \n      replacement procedures for undercarriage and  \n      components / parts  \n2.3 Types and uses of PPE \n2.4 Types and uses of basic and special tools \n2.5 Ability to understand manufacturer’s specifications \n2.6 Interpretation of drawings \n2.7 Basic shop mathematics and mensuration  \n2.8 Company rules and regulations \n2.9 Computer literacy \n2.10    Positive work values (cost, time, quality consciousness,  \n           etc.) \n3. Underpinning \nskills \n3.1 Identifying parts, components and functions of  \n      undercarriage  \n3.2 Performing checking, testing and adjusting, measuring,    \n       repair or replacement procedures for undercarriage  \n       and  components / parts \n3.3  Using PPE \n3.4  Using basic and special hand tools \n3.5  Ability to understand manufacturer’s specifications \n3.6  Interpreting drawings  \n3.7  Applying mensuration \n3.8  Operating computer\n\n--- PDF PAGE 74 ---\nTR HEAVY EQUIPMENT SERVICING NC II                                                                                                                                                               \n72\n \n4. Resource \nimplications \nThings necessary for the conduct of assessment include \n4.1 Access to heavy equipment \n4.2 Shop and parts manual/catalogue \n4.3 Basic and special tools and shop equipment \n4.4 PPE \n4.5 Materials relevant to the activity \n5. Method of \nassessment \nCompetency in this unit must be assessed through  \n5.1  Written / oral questioning \n5.2  Observation of practical demonstration \n5.3  Work documents  \n5.4  Third party report \n6. Context of \nassessment \n6.1 Assessment may be conducted on-the-job or in a simulated \n      venue and in accordance with safe work procedures.\n",
