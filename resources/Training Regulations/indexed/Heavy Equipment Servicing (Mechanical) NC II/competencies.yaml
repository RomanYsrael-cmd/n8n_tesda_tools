es and uses of PPE\n2.4 Types and uses of basic and special hand tools\n2.5 Ability to understand manufacturer’s specifications\n2.6 Schematic diagrams, graphs, drawings and symbols\n2.7 Basic shop mathematics and mensuration\n2.8 Company rules and regulations\n2.9 Computer literacy\n2.10 Positive work values (cost, time, quality consciousness,\n etc.)\n3. Underpinning\nskills\n3.1 Following checking, testing and adjusting, repair and/or\n replacing procedures of component structures, parts and\n systems procedures for engine system\n3.2 Using PPE\n3.3 Using basic and special hand tools and shop equipment\n3.4 Following manufacturer’s specifications\n3.5 Interpreting schematic diagrams, drawings and symbols\n3.6 Applying mensuration\n3.7 Operating computer\n3.8 Following company rules and regulations\n\n--- PDF PAGE 49 ---\nTR HEAVY EQUIPMENT SERVICING NC II\n47\n4. Resource\nimplications\nThings necessary for the conduct of assessment include\n4.1 Access to heavy equipment\n4.2 Shop and parts manual/catalogue\n4.3 Basic and special hand tools and shop equipment\n4.4 PPE\n4.5 Materials relevant to the activity\n5. Method of\nassessment\nCompetency in this unit must be assessed through\n5.1 Written / oral questioning\n5.2 Observation of practical demonstration\n5.3 Work documents\n5.4 Third party report\n6. Context of\nassessment\n6.1 Assessment may be conducted on-the-job or in a simulated\n venue and in accordance with safe work procedures.\n\n--- PDF PAGE 50 ---\nTR HEAVY EQUIPMENT SERVICING NC II\n48\n\nUNIT OF COMPETENCY:\nSERVICE POWER TRAIN SYSTEM (II)\nUNIT CODE:\nCON723306\nUNIT DESCRIPTOR:\nThis unit involves the knowledge, skills and\nattitudes in servicing heavy equipment power train\nsystem. In particular this unit deals with the skills\nfor\nchecking,\ntesting\nand\nadjusting\nand\ntroubleshooting heavy equipment power train\nsystem and related components.\n\nELEMENT\nPERFORMANCE CRITERIA\nBold and Italicized terms are elaborated in the\nRange of Variab