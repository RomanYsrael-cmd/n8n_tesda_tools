eration is performed following  \n      standard operating procedures. \n3.4 Undercarriage system measuring  \n      procedure is applied according to  \n      manufacturer's specifications. \n3.5 Unexpected situations are responded to in  \n      line with company rules and regulations in a  \n      manner that minimizes risks to personnel  \n      and equipment. \n3.6 Completion report is prepared and  \n      submitted based on standard operating  \n      procedures.\n\n--- PDF PAGE 68 ---\nTR HEAVY EQUIPMENT SERVICING NC II                                                                                                                                                               \n66\n \n4. Repair and/or replacement of \n    undercarriage  \n    components/parts \n4.1 Work instructions are secured from immediate  \n      superior. \n4.2 PPE and basic/special hand tools and shop  \n      equipment are selected and used based on job \n      requirements. \n4.3 Equipment operation is performed following  \n      standard operating procedures. \n4.4 Undercarriage system and related  \n      components/parts \nrepair \nand/or \nreplacement procedure is applied  according \nto manufacturer's specifications. \n4.5 Unexpected situations are responded to in  \n      line with company rules and regulations in a  \n      manner that minimizes risks to personnel  \n      and equipment. \n4.6 Completion report is prepared and submitted  \n      based on standard operating procedures.\n\n--- PDF PAGE 69 ---\nTR HEAVY EQUIPMENT SERVICING NC II                                                                                                                                                               \n67\nRANGE OF VARIABLES \nVARIABLE \nRANGE \n1. PPE \n \nMay include but not limited to: \n1.1 Working clothes \n1.2 Safety shoes  \n1.3 Hard hats  \n1.4 Goggles  \n1.5 Gloves  \n1.6 Respiratory mask \n1.7 Ear plugs  \n2.  Basic / special  \ntools and shop \nequipment \n \nMay include but are not limited to:  \n2.1  Wrench \n2.2  Pliers \n2.3  Cutters  \n2.4  Hammer  \n2.5  Pry bar \n2.6  Hydraulic Jack \n2.7  Measuring Tool Kit \n2.8 Ultrasonic \n2.9 Multi scale \n2.10 Straight gauge \n2.11 Depth gauge \n2.12 Outside/inside caliper \n2.13 Steel rule \n2.14 Vernier caliper \n2.15  Hydraulic press (push/pull) \n2.16 Impact/Torque wrench \n2.17 Grease gun\n\n--- PDF PAGE 70 ---\nTR HEAVY EQUIPMENT SERVICING NC II                                                                                                                                                               \n68\n3.   Undercarriage \nsystem and \nrelated  \ncomponents \nchecking \nprocedure \n3.1 Track Group  \n    3.1.1Track Shoe  \n    3.1.2 Bolts / nuts \n    3.1.3 Pin and Bushing \n    3.1.4 Link \n    3.1.5 Master Pin/Link \n3.2 Idler  \n    3.2.1 Bearing \n    3.2.2 Cover \n    3.2.3 Seals \n    3.2.4 Bushing \n    3.2.5 Pin \n    3.2.6 Gasket \n    3.2.7 Shim \n    3.2.8 Bolts \n    3.2.9Cap \n3.3 Track and Carrier Roller \n    3.3.1 Packing seals \n    3.3.2 Pin \n    3.3.3 Bushing \n    3.3.4 Cover/collar \n    3.3.5 Bolts and nuts \n    3.3.6 Protective guard \n    3.3.7 Cap \n3.4 Track frame and related components \n        3.4.1 Protective guard \n3.4.2 Bolts/nuts \n3.4.3 Equalizer bar \n3.4.4 Pivot Shaft \n3.4.5 Shim \n3.4.6 Bushing \n3.4.7 Diagonal brace and beam \n3.4.8 Spring \n3.4.9 Yoke \n3.4.10 Roller guard \n3.4.11 Trunion holder \n3.5 Track adjuster cylinder \n    3.5.1 Cylinder housing \n    3.5.2 Cover \n    3.5.3 Packing seals \n    3.5.4 Rod \n    3.5.5 Spring \n    3.5.6 Fittings \n    3.5.7 Bolts and nuts \n    3.5.8 bushing\n\n--- PDF PAGE 71 ---\nTR HEAVY EQUIPMENT SERVICING NC II                                                                                                                                                               \n69\n 4.   Unexpected  \n       situations \n \nMay include but not limited to: \n4.1 Collapse of unstable terrain \n4.2 Natural calamities \n4.3 Situations arising from poor peace and order \n4.4 Force majeure \n4.5 Mechanic fatigue or sickness \n5.   Undercarriage  \n      group testing  \n      procedures \nMay include but not limited to: \n5.1 Test system operations and functions \n5.1.1  Rotations and movements \n    5.1.2  Alignments \n    5.1.3  Leakages \n    5.1.4  Bolts and nuts \n6.   Undercarriage \nsystem \nmeasuring \nprocedure \nMeasure the following: \n6.1 Track group \n            6.1.1 Track shoe \n    6.1.2 Grouser height \n    6.1.3 Plate thickness \n6.2 Link \n    6.2.1 Height \n    6.2.2 Pitch \n    6.2.3 Width \n6.3 Bushing \n    6.3.1 Diameter (inside and outside) \n6.4 Tension \n    6.4.1 Sag / clearance \n6.5 Idler  \n            6.5.1 Flange height and width \n            6.5.2 Outside diameter \n6.6 Sprocket \n            6.6.1 Wear pattern \n6.7 Carrier and track roller  \n            6.7.1 Flange height and width \n            6.7.2 Outside diameter \n6.8 Track adjuster cylinder \n6.9 Clearance between yoke and frame\n\n--- PDF PAGE 72 ---\nTR HEAVY EQUIPMENT SERVICING NC II                                                                                                                                                               \n70\n7.  Undercarriage  \n     system   and        \n     related       \n     components /  \n     parts repair        \n     and/or   \n     replacement  \n     procedures \n7.1 Track Group  \n7.1.1  Track Shoe  \n7.1.2  Bolts/nuts \n7.1.3  Pin and Bushing \n7.1.4  Link \n7.1.5  Master Pin/Link \n7.2 Idler  \n     7.2.1 Bearing \n     7.2.2 Cover \n     7.2.3 Seals \n     7.2.4 Bushing \n     7.2.5 Pin \n     7.2.6 Gasket \n     7.2.7 Shim \n     7.2.8 Bolts \n     7.2.9 Cap \n7.3 Track and Carrier Roller \n     7.3.1 Packing seals \n     7.3.2 Pin \n     7.3.3 Bushing \n     7.3.4 Cover/collar \n     7.3.5 Bolts and nuts \n     7.3.6 Protective guard \n     7.3.7 Cap \n7.4 Track frame and related components \n7.4.1  Protecti