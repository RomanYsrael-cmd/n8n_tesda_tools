        "evidence_guide": {
          "source_text": "1. Critical aspects\nof evidence\n\nThe evidence must show that the candidate:\n1.1 Demonstrated ability to perform hydraulic system\n components checking, testing and adjusting,\n troubleshooting and minor repair and / or replacement\n procedures.\n1.2 Demonstrated ability to read and interpret schematic\n diagrams, graphs, drawings and symbols.\n1.3 Demonstrated knowledge of parts and components of\n hydraulic system\n1.4 Demonstrated ability to read and interpret manufacturer’s\n specifications.\n1.6 Demonstrated ability to comply with company rules and\n regulations.\n2. Underpinning\nknowledge and\nattitude\n\n2.1 Parts, components and functions of hydraulic system\n2.2 Check, test, adjust and minor repair and / or replacement\nprocedures for hydraulic system and components\n2.3 Types and uses of PPE\n2.4 Types and uses of basic and special tools\n2.5 Ability to understand manufacturer’s specifications\n2.6 Schematic diagrams, graphs, drawings and symbols\n2.7 Basic shop mathematics and mensuration\n2.8 Company rules and regulations\n2.9 Computer literacy\n2.10 Positive work values (cost, time, quality consciousness,\n etc.)\n3. Underpinning\nskills\n3.1 Identifying parts, components and functions of hydraulic\nsystem\n3.2 Performing inspection, checking, testing and adjusting,\n minor repair and / or replacement procedures for hydraulic\n system and components\n3.3 Using PPE\n3.4 Using basic and special tools\n3.5 Ability to understand manufacturer’s specifications\n3.6 Interpreting schematic diagrams, graphs, drawings and\n symbols\n3.7 Applying mensuration\n3.8 Operating computer\n\n--- PDF PAGE 65 ---\nTR HEAVY EQUIPMENT SERVICING NC II\n63\n4. Resource\nimplications\nThings necessary for the conduct of assessment include\n4.1 Access to heavy equipment\n4.2 Shop and parts manual/catalogue\n4.3 Basic and special tools and shop equipment\n4.4 PPE\n4.5 Materials relevant to the activity\n5. Method of\nassessment\nCompetency in this unit must be assessed through\n5.1 Written / oral questioning\n5.2 Observation of practical demonstration\n5.3 Work documents\n5.4 Third party report\n6. Context of\nassessment\n6.1 Assessment may be conducted on-the-job or in a simulated\n venue and in accordance with safe work procedures.\n\n--- PDF PAGE 66 ---\nTR HEAVY EQUIPMENT SERVICING NC II\n64\nUNIT OF COMPETENCY:\nSERVICE UNDERCARRIAGE SYSTEM (II)\nUNIT CODE:"
        },
        "source_text": "CON723307\nUNIT DESCRIPTOR:\nThis unit involves the knowledge, skills and\nattitudes in servicing hydraulic system of heavy\nequipment. It deals with the skills required to\ncheck, test and adjust, troubleshoot, and perform\nminor repair and/or replacement procedures for the\nvarious parts and components of heavy equipment\nhydraulic system.\n\nELEMENT\nPERFORMANCE CRITERIA\nBold and Italicized terms are elaborated in the\nRange of Variables\n1. Check hydraulic system\n1.1 Work instructions are secured from immediate\n superior.\n1.2 PPE and basic/special hand tools and shop\n equipment are selected and used based on\n job requirements.\n1.3 Equipment operation is performed following\n standard operating procedures.\n1.4 Hydraulic system and related components\n checking procedure is applied according to\n manufacturer's specifications.\n1.5 Electronic system checking procedure is\n applied according to manufacturer’s\n specifications.\n1.6 Unexpected situations are responded to in\n line with company rules and regulations in a\n manner that minimizes risks to personnel\n and equipment.\n1.7 Completion report is prepared and submitted\n based on standard operating procedures.\n\n--- PDF PAGE 59 ---\nTR HEAVY EQUIPMENT SERVICING NC II\n57\n\n2. Test and adjust hydraulic\nsystem\n2.1 Work instructions are secured from immediate\n superior.\n2.2 PPE and basic/special hand tools and shop\n equipment are selected and used based on job\n requirements.\n2.3 Equipment operation is performed following\n standard operating procedures.\n2.4 Hydraulic system and related components\n testing procedure is applied according to\n manufacturer's specifications.\n2.5 Electronic system testing procedure is\n applied\naccording\nto\nmanufacturer’s\nspecifications.\n2.6 Unexpected situations are responded to in\n line with company rules and regulations in a\n manner that minimizes risks to personnel\n and equipment.\n2.7 Completion report is prepared and submitted\n based on standard operating procedures.\n3. Troubleshoot hydraulic\nsystem\n3.1 Work instructions are secured from immediate\n superior.\n3.2 PPE and basic/special hand tools and shop\n equipment are selected and used based on job\n requirements.\n3.3 Equipment operation is performed following\n standard operating procedures.\n3.4 Hydraulic system and related components\n performance troubleshooting procedure is\n applied according to manufacturer's\n specifications.\n3.5 Unexpected situations are responded to in\n line with company rules and regulations in a\n manner that minimizes risks to personnel\n and equipment.\n3.6 Completion report is prepared and submitted\n based on standard operating procedures.\n\n--- PDF PAGE 60 ---\nTR HEAVY EQUIPMENT SERVICING NC II\n58\n\n4. Repair and / or replace\nhydraulic system components\n4.1 Work instructions are secured from immediate\n superior.\n4.2 PPE and basic/special hand tools and shop\n equipment are selected and used based on job\n requirements.\n4.3 Equipment operation is performed following\n standard operating procedures.\n4.4 Hydraulic system and related components\nminor repair and/or replacement procedure\nis\napplied\naccording\nto\nmanufacturer's\nspecifications.\n4.5 Unexpected situations are responded to in\n line with company rules and regulations in a\n manner that minimizes risks to personnel\n and equipment.\n4.6 Completion report is prepared and submitted\n based on standard operating procedures.\n\n--- PDF PAGE 61 ---\nTR HEAVY EQUIPMENT SERVICING NC II\n59\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. PPE\nMay include but not limited to:\n1.1 Protective working clothes\n1.2 Safety shoes\n1.3 Hard hats\n1.4 Goggles\n1.5 Face mask\n1.6 Gloves\n1.7 Ear plugs\n2. Basic / special\ntools and shop\nequipment\n\nMay include but not limited to:\n2.1 Wrenches\n2.2 Pliers\n2.3 Cutters\n2.4 Hammer\n2.5 Screw drivers\n2.6 Measuring tape\n2.7 Pressure gauge\n2.8 Stop watch\n2.9 Software type diagnostic tool\n2.10 Thermal gun or infrared\n\n--- PDF PAGE 62 ---\nTR HEAVY EQUIPMENT SERVICING NC II\n60\n\n3. Hydraulic\nsystem and\nrelated\ncomponents\nchecking\nprocedure\n\nCheck the following and which may include but not limited to:\n3.1 Pumps\n3.2 Control valves\n3.3 Cylinders / Rod\n3.4 Motor\n3.5 Lines / fittings / couplings\n3.6 Tank\n3.7 Filters / Strainers\n3.8 Relief / Bypass valves\n3.9 Oil\n3.10 Oil cooler\n4. Electronic\nsystem\nchecking\nprocedure\nCheck the following and which may include but not limited to:\n4.1 Sensors, switches and senders\n4.2 ECU/ECM\n4.3 Actuators/solenoids\n4.4 Control panel/EMS\n4.5 Wiring and connectors\n5. Unexpected\nsituations\nMay include but not limited to:\n5.1 Collapse of unstable terrain\n5.2 Natural calamities\n5.3 Situations arising from poor peace and order\n5.4 Force majeure\n5.5 Mechanic fatigue or sickness\n6. Hydraulic\nsystem and\nrelated\ncomponents\ntesting\nprocedures\n\nTest the following and which may include but not limited to:\n6.1 Pumps\n6.2 Control valves\n6.3 Cylinders / Rod\n6.4 Motors\n6.5 Tank\n6.6 Oil cooler\n6.7 Lines, fittings and couplings\n7. Electronic\nsystem testing\nprocedure\nTest the following and which may include but not limited to:\n7.1 Sensors, switches and senders\n7.2 Controls (ECU/ECM)\n7.3 Actuators/solenoids\n7.4 Alert/warning indicators (monitoring panel)\n7.5 Harness\n\n--- PDF PAGE 63 ---\nTR HEAVY EQUIPMENT SERVICING NC II\n61\n8. Hydraulic\nsystem and\nrelated\ncomponents\ntroubleshooting\nprocedure\n\nTroubleshoot the following:\n8.1 Pumps\n8.2 Control valves\n8.3 Cylinders / Rod\n8.4 Motor\n8.5 Lines, fittings and couplings\n8.6 Tanks\n8.7 Filters\n8.8 Oil cooler\n8.9 Relief / By pass valves\n9. Hydraulic\nsystem and\nrelated\ncomponents\nminor repair\nand/or\nreplacement\nprocedure\n\nMinor repair and/or replace the following and which may\ninclude but not limited to:\n9.1 Pumps\n9.2 Control valves\n9.3 Cylinders / Rod\n9.4 Motor\n9.5 Lines, fittings and couplings\n9.6 Tanks\n9.7 Filters\n9.8 Oil cooler\n9.9 Relief / By pass valves\n\n--- PDF PAGE 64 ---\nTR HEAVY EQUIPMENT SERVICING NC II\n62\nEVIDENCE GUIDE\n1. Critical aspects\nof evidence\n\nThe evidence must show that the candidate:\n1.1 Demonstrated ability to perform hydraulic system\n components checking, testing and adjusting,\n troubleshooting and minor repair and / or replacement\n procedures.\n1.2 Demonstrated ability to read and interpret schematic\n diagrams, graphs, drawings and symbols.\n1.3 Demonstrated knowledge of parts and components of\n hydraulic system\n1.4 Demonstrated ability to read and interpret manufacturer’s\n specifications.\n1.6 Demonstrated ability to comply with company rules and\n regulations.\n2. Underpinning\nknowledge and\nattitude\n\n2.1 Parts, components and functions of hydraulic system\n2.2 Check, test, adjust and minor repair and / or replacement\nprocedures for hydraulic system and components\n2.3 Types and uses of PPE\n2.4 Types and uses of basic and special tools\n2.5 Ability to understand manufacturer’s specifications\n2.6 Schematic diagrams, graphs, drawings and symbols\n2.7 Basic shop mathematics and mensuration\n2.8 Company rules and regulations\n2.9 Computer literacy\n2.10 Positive work values (cost, time, quality consciousness,\n etc.)\n3. Underpinning\nskills\n3.1 Identifying parts, components and functions of hydraulic\nsystem\n3.2 Performing inspection, checking, testing and adjusting,\n minor repair and / or replacement procedures for hydraulic\n system and components\n3.3 Using PPE\n3.4 Using basic and special tools\n3.5 Ability to understand manufacturer’s specifications\n3.6 Interpreting schematic diagrams, graphs, drawings and\n symbols\n3.7 Applying mensuration\n3.8 Operating computer\n\n--- PDF PAGE 65 ---\nTR HEAVY EQUIPMENT SERVICING NC II\n63\n4. Resource\nimplications\nThings necessary for the conduct of assessment include\n4.1 Access to heavy equipment\n4.2 Shop and parts manual/catalogue\n4.3 Basic and special tools and shop equipment\n4.4 PPE\n4.5 Materials relevant to the activity\n5. Method of\nassessment\nCompetency in this unit must be assessed through\n5.1 Written / oral questioning\n5.2 Observation of practical demonstration\n5.3 Work documents\n5.4 Third party report\n6. Context of\nassessment\n6.1 Assessment may be conducted on-the-job or in a simulated\n venue and in accordance with safe work procedures.\n\n--- PDF PAGE 66 ---\nTR HEAVY EQUIPMENT SERVICING NC II\n64\nUNIT OF COMPETENCY:\nSERVICE UNDERCARRIAGE SYSTEM (II)\nUNIT CODE:"
