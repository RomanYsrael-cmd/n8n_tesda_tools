 \n        3.4.3 Hoses and tubes \n        3.4.4 Oil cooler \n3.5 Electronic system \n3.5.1 Sensors \n3.5.2 Electronic control unit/module (ECU/ECM) \n3.5.3 Actuators/solenoids \n3.5.4 Control panel/Electronic Monitoring System (EMS) \n4.  Checking \nprocedures \n4.1 Visual \n4.2 Actual/sensory \n5.  Unexpected \nsituations \n \nMay include but not limited to: \n5.1 Collapse of unstable terrain \n5.2 Natural calamities \n5.3 Situations arising from poor peace and order \n5.4 Force majeure \n5.5 Mechanic fatigue or sickness \n6.   Testing \nprocedures \n6.1 Sensory  \n6.2 Diagnostic field test  \n7.   Engine system \ntesting \nprocedure  \nTest the following and which may include: \n7.1 Air induction and exhaust system \n        7.1.1 Boost pressure    \n        7.1.2 Boost temperature \n        7.1.3 Exhaust manifold temperature \n        7.1.4 Intake pressure and resistance  \n        7.1.5 Exhaust pressure  \n        7.1.6 Exhaust temperature \n        7.1.7 Blow-by pressure (crank case)   \n        7.1.8 Compression pressure \n        7.1.9 Exhaust gas color condition \n7.2 Cooling system \n        7.2.1 Thermostat condition (opening temperature) \n        7.2.2 Coolant flow (water pump)   \n        7.2.3 Radiator temperature differential  \n        7.2.4 Radiator expansion tank/relief pressure (opening  \n                 pressure)  \n        7.2.5 Fan belt tension and adjust if necessary \n        7.2.6 Hydraulic driven fan pressure\n\n--- PDF PAGE 46 ---\nTR HEAVY EQUIPMENT SERVICING NC II                                                                                                                                                               \n44\n \n7.3 Fuel system  \n        7.3.1 Fuel pressure  \n        7.3.2 Priming pump pressure  \n        7.3.3 Incorrect travel distance of governor linkage and  \n                 adjust if necessary \n        7.3.4 Injection timing \n        7.3.5 Fuel filter differential pressure \n        7.3.6 Fuel pressure regulator \n        7.3.7 Fuel cooler temperature differential \n7.4 Lubrication system  \n        7.4.1 Oil pressure  \n        7.4.2 Oil cooler and filter-based by-pass valve (opening  \n                 pressure)  \nPriority valve pressure (turbocharger) and adjust if  \n         necessary \nOil temperature \nElectronic system \n7.5.1 Open, grounded, shortage, intermittent signal  \n                   7.5.1.1 Sensor, switches and senders \n                   7.5.1.2 Temperature \n                   7.5.1.3  Pressure \n                   7.5.1.4 Level \n                   7.5.1.5 Speed/timing  \n                   7.5.1.6 Throttle position \n                   7.5.1.7 Flow \n8.  Structure and  \n     parts adjusting \n     procedure \nField work adjustment is applied on the following: \n8.1 Valve clearance  \n8.2 Injector timing/injection pump timing \n8.3 Valve timing \n9.  Engine system  \n     troubleshooting \n     procedure  \nTroubleshoot the following and which may include: \n9.1 Air induction and exhaust system  \n      9.1.1 Black (smoke) exhaust emission \n9.2 Cooling system \n      9.2.1 Engine overheating \n      9.2.2 Engine overcooling \n9.3 Fuel system  \n      9.3.1 Low fuel pressure \n      9.3.2 Fuel knocking  \n      9.3.3 Black smoke \n9.4 Lubrication system \n      9.4.1 Blue smoke emission \n       9.4.2 Low oil pressure\n\n--- PDF PAGE 47 ---\nTR HEAVY EQUIPMENT SERVICING NC II                                                                                                                                                               \n45\n10. Structure and   \n      parts  \n      troubleshooting \n     procedure\n10.1 Blue smoke emission \n10.2 Low oil pressure \n10.3 Blow-by (crank case) pressure \n11. Engine system  \n      and related   \n      components  \n      repair and / or  \n      replacement  \n      procedure \nRepair and / or replace the following and which may include: \n11.1 Air induction and exhaust  \n        11.1.1 Turbocharger