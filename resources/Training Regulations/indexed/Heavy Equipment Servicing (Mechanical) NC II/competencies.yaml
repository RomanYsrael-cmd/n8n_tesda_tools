ponded to in line\nwith company rules and regulations in a\nmanner that minimizes risks to personnel and\nequipment.\n3.6 Completion report is prepared and submitted\nbased on standard operating procedures.\n\n--- PDF PAGE 52 ---\nTR HEAVY EQUIPMENT SERVICING NC II\n50\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. PPE\n\nMay include but not limited to:\n1.1 Working clothes\n1.2 Safety shoes\n1.3 Hard hats\n1.4 Goggles\n1.5 Gloves\n2. Basic / special\nhand tools and\nshop\nequipment\n\nMay include but not limited to:\n2.1 Wrenches\n2.2 Hammers\n2.3 Screw drivers\n2.4 Pliers\n2.5 Snap ring removers\n2.6 Pullers\n2.7 Pneumatic and hydraulic wrench\n2.8 Bearing installer\n2.9 Hydraulic press\n2.10 Analog hydraulic tester\n2.11 Push-full scale\n2.12 Multi-tachometer\n2.13 Thermistor kit\n2.14 Torque multiplier/wrench\n\n--- PDF PAGE 53 ---\nTR HEAVY EQUIPMENT SERVICING NC II\n51\n3. Power train\nsystem and\nrelated\ncomponents\nchecking\nprocedure\n\nCheck the following:\n3.1 Torque converter and divider\n3.1.1 Planetary gear set\n3.1.2 Impeller\n3.1.3 Stator\n3.1.4 Turbine\n3.1.5 Output shaft\n3.1.6 Housing\n3.1.7 Seals\n3.2 Mechanical flywheel clutch\n 3.2.1 Clutch disc\n 3.2.2 Clutch fork\n 3.2.3 Pressure plate\n 3.2.4 Release bearing\n 3.2.5 Bell housing\n 3.2.6 Hydraulic/mechanical dry clutch type\n 3.2.7 Hydraulic clutch booster\n 3.2.8 Seals\n3.3 Transmission\n 3.3.1 Direct drive\n 3.3.2 Power shift drive\n 3.3.3 Hydrostatic/Hydraulic drive\n 3.3.4 Input/output shaft\n 3.3.5 Synchronizer gear assembly\n 3.3.6 Directional gears (Forward and Reverse)\n 3.3.7 Speed gears\n 3.3.8 Clutches\n 3.3.9 Mesh gears\n 3.3.10 Clutch pistons\n 3.3.11 Control valve\n 3.3.12 Planetary gear set\n 3.3.13 Pumps\n 3.3.14 Seals\n3.4 Transfer gear drive\n 3.4.1 Planetary gear (drive, idler and driven gear)\n 3.4.2 Housing\n 3.4.3 Seals\n 3.4.4 Yoke\n 3.4.5 Shafts\n\n--- PDF PAGE 54 ---\nTR HEAVY EQUIPMENT SERVICING NC II\n52\n\n3.5 Differential axle and final drive\n 3.5.1 Bevel gear and ring gear\n 3.5.2 Differential case\n 3.5.3 Spider\n 3.5.4 Side gear\n 3.5.5 Pinion\n 3.5.6 Axle shaft and housing\n 3.5.7 Planetary gear set\n 3.5.8 Housing and cover\n 3.5.9 Seals\n 3.5.10 Bearing\n 3.5.11 Bull gear\n3.6 Lower power train structure\n 3.6.1 Steering clutch (and adjust if necessary)\n 3.6.2 Differential steer\n 3.6.3 Final drive\n 3.6.4 Brake\n 3.6.5 Travel motor\n 3.6.6 Steering pump and motor (and adjust if necessary)\n 3.6.7 Suspension (gas type and mechanical)\n 3.6.8 Steering mechanical linkage (and adjust if necessary)\n3.7 Power take-off [gear/vane/belt driven type]\n 3.7.1 Housing\n 3.7.2 Seals\n 3.7.3 Shafts\nr/vane/belt\n4. Power train\n electronic\n system\n checking\n procedure\nCheck the following:\n4.1 Sensors conditions\n4.2 ECU/ECM condition\n4.3 Actuators/solenoids condition\n4.4 Control panel/EMS\n5. Unexpected\nsituations\n\nMay include but not limited to:\n5.1 Collapse of unstable terrain\n5.2 Natural calamities\n5.3 Situations arising from poor peace and order\n5.4 Mechanic fatigue or sickness\n\n--- PDF PAGE 55 ---\nTR HEAVY EQUIPMENT SERVICING NC II\n53\n\n6. Power train\n system testing\n and / or\n adjusting\n procedure\n\nTest / adjust the following:\n6.1 Torque converter and divider\n6.2 Transmission\n6.3 Lower power train structure\n6.4 Mechanical flywheel/clutch\n6.5 Differential axle and final drive\n6.6 Transfer gear drive\n6.7 Power take-off (PTO)\n\n7. Power train\n electronic\n system testing\n procedure\n7.1 Open, grounded, shortage, intermittent signal\n 7.1.1 Sensor, switches and senders\n 7.1.1.1 Temperature\n 7.1.1.2 Pressure\n 7.1.1.3 Level\n 7.1.1.4 FNR position sensor\n 7.1.1.5 Speed sensor\n 7.1.2 Solenoid\n 7.1.3 Electronic control\n 7.1.4 Control panel (EMS)\n8. Power train\nsystem trouble-\nshooting\nprocedure\n\nTroubleshoot the following performance problems/condition:\n8.1 Torque converter and divider\n8.2 Mechanical flywheel clutch\n8.3 Transmission\n 8.3.1 Transfer gear drive\n 8.3.2 Power take-off (PT