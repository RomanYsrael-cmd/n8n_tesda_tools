shop \nequipment are selected and used based on \njob requirements. \n3.3 Equipment operation is performed following \nstandard operating procedures.  \n3.4   Power train system troubleshooting  \n        procedure \nis \napplied \naccording \nto \nmanufacturer's specifications. \n3.5   Unexpected situations are responded to in line \nwith company rules and regulations in a \nmanner that minimizes risks to personnel and \nequipment. \n3.6  Completion report is prepared and submitted \nbased on standard operating procedures.\n\n--- PDF PAGE 52 ---\nTR HEAVY EQUIPMENT SERVICING NC II                                                                                                                                                               \n50\nRANGE OF VARIABLES \nVARIABLE \nRANGE \n1.  PPE \n \nMay include but not limited to: \n1.1 Working clothes \n1.2 Safety shoes  \n1.3 Hard hats  \n1.4 Goggles  \n1.5 Gloves  \n2.  Basic / special \nhand tools and \nshop \nequipment \n \nMay include but not limited to: \n2.1 Wrenches  \n2.2 Hammers  \n2.3 Screw drivers                  \n2.4 Pliers                                 \n2.5 Snap ring removers \n2.6 Pullers \n2.7 Pneumatic and hydraulic wrench \n2.8 Bearing installer \n2.9 Hydraulic press \n2.10 Analog hydraulic tester \n2.11 Push-full scale \n2.12 Multi-tachometer \n2.13 Thermistor kit \n2.14 Torque multiplier/wrench\n\n--- PDF PAGE 53 ---\nTR HEAVY EQUIPMENT SERVICING NC II                                                                                                                                                               \n51\n3.  Power train \nsystem and \nrelated  \ncomponents \nchecking \nprocedure \n \nCheck the following: \n3.1 Torque converter and divider \n3.1.1 Planetary gear set \n3.1.2 Impeller \n3.1.3 Stator \n3.1.4 Turbine \n3.1.5 Output shaft \n3.1.6 Housing \n3.1.7 Seals \n3.2 Mechanical flywheel clutch \n      3.2.1 Clutch disc \n      3.2.2 Clutch fork \n      3.2.3 Pressure plate \n      3.2.