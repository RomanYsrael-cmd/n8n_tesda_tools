    "source_text": "3.1 CURRICULUM DESIGN\n\nCourse Title: HEAVY EQUIPMENT SERVICING\n (MECHANICAL) NC Level: II\n\nSuggested Nominal Training Duration: 18 hours (Basic)\n\n 24 hours (Common)\n 320 hours (Core)\n\nCourse Description:\n\nThis course is designed to enhance the knowledge, positive work attitudes\nand skills in Heavy Equipment Servicing (Mechanical) II, in accordance with\nindustry standards. It covers basic, common and core competencies. It includes\nbasic skills in participate in workplace communication, work in a team environment,\ndemonstrate work values, and practice housekeeping.\n\nThe common competencies are Interpret technical drawings and plans,\nobserve procedures, specifications and manuals of instructions, perform\nmensurations and calculation, and maintain tools and equipment. The core\ncompetencies include service engine systems, service power train systems,\nservice hydraulic systems, and service undercarriage systems.\n\nBASIC COMPETENCIES\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Participate in\n workplace\n communication\n1.1 Obtain and convey\n workplace Information\n\n1.2 Complete relevant work\n related documents\n\n1.3 Participate in workplace\n meetings and discussions\nLecture\n\nPractical\nexercises\n\nObservation\n\nDemonstration\n\nWritten test\n\n--- PDF PAGE 76 ---\nTR HEAVY EQUIPMENT SERVICING NC II\n74\n\n2. Work in a team\n environment\n2.1 Describe team role\nand Scope\n\n2.2 Identify own role and\n responsibility within team\n\n2.3 Work as a team member\nLecture\n\nPractical\nexercises\n\nObservation\n\nDemonstration\n\nWritten test\n\n3. Demonstrate work\nvalues\n3.1 Apply work values/ethics\n\n3.2 Maintain integrity of\n conduct in the workplace\n\nLecture\n\nDemonstration\n\nPractical\nexercises\nObservation and\noral questioning\n\nWritten test\n4. Practice house\n keeping\n procedures\n4.1 Sort recyclable and\nremove unnecessary\nmaterials\n\n4.2 Store materials\n\n4.3 Maintain work are, tools\nand equipment\nLecture\n\nDemonstration\n\nPractical\nexercises\nDemonstration\nand oral\nquestioning\n\nWritten test\n\n--- PDF PAGE 77 ---\nTR HEAVY EQUIPMENT SERVICING NC II\n75\n\nCOMMON COMPETENCIES\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Interpret\ntechnical\ndrawings and\nplans\n\n1.1 Read / Interpret blueprints\n and plans\n\n1.2 Perform freehand sketching\nLecture\n\nDemonstration\n\nPractical\nexercises\nDemonstration\nand oral\nquestioning\n\nWritten test\n\n2. Observe\nprocedures,\nspecifications\nand manuals of\ninstructions.\n2.1 Identify and access\n specifications / technical\n manuals\n\n2.2 Interpret technical\nmanuals\n\n2.3 Apply information in\ntechnical manual\n\n2.4 Store technical manual\nLecture\n\nDemonstration\n\nPractical\nexercises\nDemonstration\nand oral\nquestioning\n\nWritten test\n\n3. Perform\n mensurations\n and calculations\n\n3.1 Select measuring\n instruments\n\n3.2 Carryout measurement and\n calculations\n\nLecture\n\nDemonstration\n\nPractical\nexercises\nDemonstration\nand oral\nquestioning\n\nWritten test\n\n4. Maintain tools\nand equipment\n4.1 Check condition of tools\n and equipment\n\n4.2 Perform preventive\n maintenance\n\n4.3 Store tools and equipment\nLecture\n\nDemonstration\n\nPractical\nexercises\nDemonstration\nand oral\nquestioning\n\nWritten test\n\n--- PDF PAGE 78 ---\nTR HEAVY EQUIPMENT SERVICING NC II\n76\n5. Prepare\nconstruction\nmaterials and\ntools\n5.1 Identify Materials\n\n5.2 Requisition Materials\n\n5.3 Receive and inspect\nmaterials\nAudio Visual\n\nSimulation\n\nDiscussion\n\nPractical\nExercise\n\nDemonstration\nDirect\nobservation\n\nQuestions or\ninterview\n\nPortfolio\n(credentials)\n\nWritten / Oral\nTest\n\nDemonstration\n\n--- PDF PAGE 79 ---\nTR HEAVY EQUIPMENT SERVICING NC II\n77\nCORE COMPETENCIES\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Service Engine\n system (II)\n1.1 Check engine systems\n\n1.2 Test and adjust engine\nsystem\n\n1.3 Troubleshoot engine\nsystem\n\n1.4 Repair / Replace engine\ncomponents\nLecture\n\nPractical\nexercises\n\nOJT\nObservation\n\nDemonstration\n\n Written test\n\n2. Service Power\n Train system (II)\n2.1 Check power train system\n\n2.2 Test power train\n\n2.3 Troubleshoot power train\n\n2.4 Remove and install power\n train components system\nLecture\n\nPractical\ndemonstration\n\nOJT\nObservation\n\nDemonstration\n\nWritten test\n\n3. Service Hydraulic\n system (II)\n3.1 Check hydraulic system\n\n3.2 Test and adjust hydraulic\nsystem\n\n3.3 Troubleshoot hydraulic\nsystem\n\n3.4 Repair or replace\nhydraulic system\ncomponents\nLecture\n\nPractical\nexercises\n\nOJT\nObservation\n\nDemonstration\n\nWritten test\n\n--- PDF PAGE 80 ---\nTR HEAVY EQUIPMENT SERVICING NC II\n78\n\n4. Service\n undercarriage\n system (II)\n4.1 Check under carriage\nsystem\n\n4.2 Test undercarriage\nsystem\n\n4.3 Measure wear of\nundercarriage related\ncomponents\n\n4.4 Repair and replace\nundercarriage\ncomponents/parts\nLecture\n\nPractical\nexercises,\n\nOJT\nObservation\n\nDemonstration\n\nWritten test\n\n--- PDF PAGE 81 ---\nTR HEAVY EQUIPMENT SERVICING NC II\n79"
