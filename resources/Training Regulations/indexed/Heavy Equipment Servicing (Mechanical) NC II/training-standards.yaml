t minor Heavy\nEquipment Servicing and parts maintenance. Most of the learning activities are\nperformed individually in the students/trainees work area.\n\nSPACE REQUIREMENT\nSIZE IN METERS\nAREA IN SQ. METERS\nTOTAL AREA\nIN SQ.\nMETERS\nStudent/Trainee’s Working Space\n\n4 (sq.m per\nstudent)\n100.0 sq.m.\nLecture Room\n48.0\n48.0\nLearning Resource Center\n24.0\n24.0\ntool/storeroom\n12.0\n12.0\n184\nFacilities/Equipment/ Circulation Area\n-\n-\n52\nTOTAL WORK AREA\n-\n236\n\n--- PDF PAGE 87 ---\nTR HEAVY EQUIPMENT SERVICING NC II\n85\n\n3.6\nTRAINERS’ QUALIFICATION\nHEAVY EQUIPMENT SERVICING (MECHANICAL) II\n\n TRAINER QUALIFICATION (TQ III)\n\n Must be a holder of NC III Heavy Equipment Servicing (Mechanical)\n Must have undergone training on Training Methodology III (TM III)\n Must be computer literate\n Must be physically and mentally fit\n *Must have at least 5 years job/industry experience\n Must be a civil service eligible (for government position or appropriate\nprofessional license issued by the Professional Regulatory\nCommission)\n\n*\nOptional. Only when required by the hiring institution.\n\nReference: TESDA Board Resolution No. 2004 03\n\n3.7\nINSTITUTIONAL ASSESSMENT\n\nInstitutional assessment is undertaken by trainees to determine their\nachievement of units of competency. A certificate of achievement is issued\nfor each unit of competency.\n\n--- PDF PAGE 88 ---\nTR HEAVY EQUIPMENT SERVICING NC II\n86"
