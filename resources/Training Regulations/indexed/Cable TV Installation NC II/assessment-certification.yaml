  "source_text": "SECTION 4: NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1\nTo attain the National Qualification of Cable TV (CATV) Installation NC II,\nthe candidate must demonstrate competency in all the units listed in Section\n1. Successful candidates shall be awarded a National Certificate II signed by\nthe TESDA Director General.\n\n4.2\nThe qualification of Cable TV (CATV) Installation NC II may be attained\nthrough demonstration of competence through a single comprehensive\nproject-type assessment covering all required units of competency of the\nqualification.\n\n4.3\nAssessment shall focus on the core units of competency. The basic and\ncommon units shall be integrated or assessed concurrently with the core\nunits.\n\n4.4\nThe following are qualified to apply for assessment and certification:\n\n4.4.1. Graduate of formal, non-formal, and informal, including enterprise-\nbased, training programs.\n\n4.4.2. Experienced workers (wage employed or self employed)\n\n4.5\nThe guidelines on assessment and certification are discussed in detail in the\n“Procedures Manual on Assessment and Certification” and “Guidelines on the\nImplementation of the Philippine TVET Qualification and Certification System\n(PTQCS)”.\n\n--- PDF PAGE 59 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS – CABLE TELEVISION (CATV) INCSTALLATION NC II\n\n Page 57\n\n"
