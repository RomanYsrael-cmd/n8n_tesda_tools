      "definition": "1. Amplifier – an electronic device used to increase the strength of a signal. 2. Audio/visual equipment - includes televisions, radios, monitors, cameras, closed circuit television, mono and stereo sound systems, gaming machines, electronic display panels, cassette recorders, video cassette recorders, CDROM players, sound and video duplication equipment, digital versatile discs, professional and domestic speaker systems, mixer desks. 3. Bridger amplifier – a device which extracts a portion of the signal from the trunk, amplifies it to a higher level, and feeds it to the distribution system. 4. Cable – is used for the distribution of television signals from the headend to the subscribers. The nominal characteristic impedance used in CATV system must be 75-ohms. 5. CATV – any facility that, in whole or in part, receives directly or indirectly over the air, and amplifies or otherwise modifies (improves) the signals transmitting programs broadcast by one or more television, satellite or radio stations and distributes such signals by wire or cable to subscribing members of the public who pay for such service or services. 6. Component - That portion of a unit of equipment, which has been designed as a discrete unit and that can be identified as such. 7. Connectorization – proper preparation of cable for installation of appropriate type of connectors. 8. Directional couplers – is a device used to divide the power unequally into two paths. 9. Drop cable – a small-diameter cable leading from the tap-off in the cable plant to the subscribers’ TV receivers. A drop cable used by the CATV system should be either RG-59 or RG-6, 75-ohms coaxial cable (foam). 10. Environment - The area surrounding the work site which can be directly or indirectly affected by occurrences at the work site. It includes the atmosphere, soils, drains, underground water tables, and the ecosystem. Protection of the environment would require the proper disposal of waste materials, restriction of burning off, the correct handling of toxic substances, the containment of CFCs and the like. 11. Established procedures - Formal arrangements of an organization, enterprise or statutory authority of how work is to be done. 12. Hazardous materials - Flammable gases and vapors and combustible dusts. 13. Headend – is the main site at which all the signals from the various program sources are received, assembled, processed and combined for transmission through the distribution network. It is the originating point for all services carried on a cable television system"
