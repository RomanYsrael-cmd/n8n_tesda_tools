res \n4.1 pole dressing  \n4.2 anchor rod \n4.3\nanchor block\n\n--- PDF PAGE 31 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ \nTRAINING REGULATIONS – CABLE TELEVISION (CATV) INCSTALLATION NC II \n \n                         Page 29  \n \n \n       \n \n \n \n \n \n \n \n5. Installation of \nfixing structures \n5.1 bury anchor block and anchor rod \n5.2 install pole dressings \n6. Fixing devices \n6.1 screw hooks \n6.2 set of bolts, nuts and \nwashers \n6.3 machine bolts – straight, \nthimble-eye and bent \ntypes   \n6.4 lag screws \n6.5 conduit pipes \n6.6 messenger-wire clamps \n6.7\nmessenger wire\n6.8 \nextension arm \n6.9 \nsuspension clamps \n6.10 anchor and grounding \nrods \n6.11 sidewalk guy fixture  \n6.12 bonding clamp \n7. Pole identifier \nmarks  \n7.1 Written or stamped on steel plate and strapped to concrete \npole or nailed to wooden pole \n7.2 Contains data on \n7.2.1. Company markings \n7.2.2. Pole identification\n8. Guy-wire \nassembly \n8.1 Guy grip \n8.2 Insulator strain \n8.3 Guy wire \n8.4\nGuy-wire protector\n9. appropriate \npersonnel \n9.1 \nleadman/team leader \n9.2 \nsupervisor/foreman \n9.3 \npole climber assistant \n9.4 \nsupervisor \n9.5 \nmanager \n \n10. Installation and \ndesign \namendments \n10.1 cable re-routing \n10.2 as-built plan\n\n--- PDF PAGE 32 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ \nTRAINING REGULATIONS – CABLE TELEVISION (CATV) INCSTALLATION NC II \n \n                         Page 30"
