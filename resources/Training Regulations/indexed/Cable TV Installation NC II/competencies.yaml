          "source_text": ") \n1. Prepare for cable \ninstallation  \n1.1 \nOcular inspection and system designs are \ninterpreted and confirmed in accordance with job \nrequirements \n1.2 \nNecessary tools, equipment, materials and \npersonal protective equipment (PPE) are identified \nand prepared in line with job requirements. \n2. Lay out cables \n2.1 \nCable are inserted and pulled in the conduits through \nthe pull wire in accordance with the design plan \n2.2 \nProblems encountered are referred to appropriate \npersonnel as per standard operating procedures \n(SOP). \n2.3 \nLaying out of cables is properly documented \naccording to SOP\n3. Connect all devices \n3.1 \nPreparation and connectorization of all cable ends \nis performed \n3.2 \nDevices are installed and connected to the cable \nends in accordance with the system design and good \nengineering practice \n3.3 \nConcerned personnel are notified of the completion of \nwork with proper documentation\n4. Connect CPE \n4.1 \nInterconnecting cables are prepared and terminated \nto the CPE in accordance with manufacturer’s \ninstallation manual \n4.2 \nCPE are tested and adjusted in accordance with the \nmanufacturer’s operation manual \n4.3 \nProblems encountered are referred to appropriate \npersonnel as per standard operating procedures \n(SOP).\n5. Wrap up job \n5.1 \nTools, equipment and materials are gathered and \nstored back to the service vehicle  \n5.2 \nWaste and debris are removed from work place and \ndisposed off in accordance with government \nregulations and environmental requirements \n5.3 \nChanges made are restored to the work area during \ninstallation, disconnection and reconnection to the \ncustomer's satisfaction\n\n--- PDF PAGE 45 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ \nTRAINING REGULATIONS – CABLE TELEVISION (CATV) INCSTALLATION NC II \n 