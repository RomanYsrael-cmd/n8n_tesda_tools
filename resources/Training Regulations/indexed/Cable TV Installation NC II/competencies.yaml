        "source_title": "INSTALL POLE HARDWARE AND ACCESSORIES",
        "source_text": "--- PDF PAGE 29 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ \nTRAINING REGULATIONS – CABLE TELEVISION (CATV) INCSTALLATION NC II \n \n                         Page 27  \n \n \n       \n \n \n \n \n \n \nCORE COMPETENCIES \nUNIT OF COMPETENCY : \nINSTALL POLE HARDWARE AND ACCESSORIES  \nUNIT CODE \n:       MDA724301 \nDESCRIPTOR \n: \nThis unit covers the outcomes required for installing \ncable TV pole hardware and accessories. This involves \nworking with a team. \nELEMENT \nPERFORMANCE CRITERIA \n(Italicized Bold terms are elaborated in the range of variables) \n1. Prepare for pole \nhardware \ninstallation \n \n1.1 Necessary tools, materials and personal protective \nequipment (PPE) are prepared in line with job \nrequirements.  \n1.2 Information on proposed locations and necessary \napprovals from relevant authorities is obtained. \n1.3 Site is cleared and prepared to provide unrestricted access \nfor installation works in accordance with joint pole \nagreement  \n1.4 Installation constraints and safety hazards are identified \nand suitable action determined\n2. Install pole \nhardware, \naccessories and \ncable  \n2.1 \nTools, equipment, clothing and safety requirements are \nidentified and obtained for the installation. \n2.2 \nTools and equipment are checked to be in good working \norder and adjusted to manufacturers' specifications \n2.3 \nInstallation site is made safe through erection of necessary \nbarriers in accordance with standard practices  \n2.4 \nFixing structures on pole are installed securely in \naccordance with manufacturer’s specifications and joint \npole agreement (JPA) \n2.5 \nFixing devices where the support is other than a pole are \ninstalled in accordance with the JPA \n2.6 \nPole identifier marks are placed on installed poles for \nidentification \n2.7 \nGround rods are installed and grounding wires are bonded \nto messenger wire of coaxial/fiber-optic cable in \naccordance with the industry construction standards \n2.8 \nGuy-wire assembly is installed and tensioned to required \nspecifications   \n2.9 \nProblems encountered are referred to appropriate \npersonnel as per standard operating procedures (SOP). \n2.10 Installation and design amendments are reported/ \ndocumented in accordance with job requirements\n\n--- PDF PAGE 30 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ \nTRAINING REGULATIONS – CABLE TELEVISION (CATV) INCSTALLATION NC II \n \n                         Page 28  \n \n \n       \n \n \n \n \n \n \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Tools and \nequipment, \nmaterials and \nPPE  \nMay include but not limited to: \nTools and equipment: \n1.1 \nset of wrenches \n1.2 \nset of pliers \n1.3 \nextension ladder \n1.4 \nbolt cutter \n1.5 \ncoping jack \n1.6 \ncome-a-long / guy grip \n1.7 \nset of hammer \n1.8 \nhacksaw \n1.9 \nset of ropes \n1.10 lashing machine \n1.11 lineman boom truck \n1.12 electric drill with different \nbits of various sizes \n1.13 cable trailer \n1.14 reel stand \n1.15 bender board/cable form \n1.16 cable roller block (single or \nmultiple cable) \n1.17 pole mount cable block (for \nself support cable) \n1.18 dynamometer \n1.19 cable guide \n1.20 lay-up stick / cable lifter \n1.21 multiple cable puller \n1.22 messenger wire raising tool \nMaterials: \n1.23 pole clamps of various \nsizes \n1.24 set of suspension clamps \n1.25 messengered cable \n1.26 pole extension arm \n \n1.27 grounding rod \n1.28 pole insulator \n1.29 set of guy grips \n1.30 guy protector \n1.31 anchor rod \n1.32 ground/guying insulator \n1.33 tie wrap \n1.34 thimble eye nut \n1.35 stainless strap and \nbuckle \n1.36 machine bolts \n1.37 sets of washer, bolts and \nnuts \n1.38 guying fixtures \n1.39 cable tag \n1.40 pole tag \n1.41 stainless lashing wire \n1.42 lashing clamp \n1.43 grounding wire \n1.44 braces \n1.45 color coded marked tape \n1.46 spiral sleeve \n \nPPE: \n1.47 body belt & strap \n1.48 hard hat/ helmet \n1.49 set gloves \n1.50 goggles \n1.51 safety shoes \n1.52 tool pouch \n1.53 safety cones/other \ncollapsible signs \n2. relevant \nauthorities  \n2.1 local government \n2.1.1. barangay \n2.1.2. municipality/city \n2.2 DPWH \n2.3 homeowner’s association \n2.4 house owners \n3. barriers \n3.1 safety cones \n3.2 early warning devices \n3.3 collapsible barrier and signs \n3.4 service vehicles \n3.5 wooden barricades \n3.6 red flag warning signs \n4. Fixing structures \n4.1 pole dressing  \n4.2 anchor rod \n4.3\nanchor block\n\n--- PDF PAGE 31 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ \nTRAINING REGULATIONS – CABLE TELEVISION (CATV) INCSTALLATION NC II \n \n                         Page 29  \n \n \n       \n \n \n \n \n \n \n \n5. Installation of \nfixing structures \n5.1 bury anchor block and anchor rod \n5.2 install pole dressings \n6. Fixing devices \n6.1 screw hooks \n6.2 set of bolts, nuts and \nwashers \n6.3 machine bolts – straight, \nthimble-eye and bent \ntypes   \n6.4 lag screws \n6.5 conduit pipes \n6.6 messenger-wire clamps \n6.7\nmessenger wire\n6.8 \nextension arm \n6.9 \nsuspension clamps \n6.10 anchor and grounding \nrods \n6.11 sidewalk guy fixture  \n6.12 bonding clamp \n7. Pole identifier \nmarks  \n7.1 Written or stamped on steel plate and strapped to concrete \npole or nailed to wooden pole \n7.2 Contains data on \n7.2.1. Company markings \n7.2.2. Pole identification\n8. Guy-wire \nassembly \n8.1 Guy grip \n8.2 Insulator strain \n8.3 Guy wire \n8.4\nGuy-wire protector\n9. appropriate \npersonnel \n9.1 \nleadman/team leader \n9.2 \nsupervisor/foreman \n9.3 \npole climber assistant \n9.4 \nsupervisor \n9.5 \nmanager \n \n10. Installation and \ndesign \namendments \n10.1 cable re-routing \n10.2 as-built plan\n\n--- PDF PAGE 32 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ \nTRAINING REGULATIONS – CABLE TELEVISION (CATV) INCSTALLATION NC II \n \n                         Page 30  \n \n \n       \n \n \n \n \n \n \nEVIDENCE GUIDE \n1. Critical aspects \nof competency \nAssessment requires evidence that the candidate: \n1.1. Complied with job requirements and safety procedures at all \ntimes during installation \n1.2. \nInstalled pole hardware, accessories and messenger cables \nfollowing job requirements and within agreed time frame \n1.3. \nCommunicated and worked with authorities and personnel \nconcerned \n2. Underpinning \nknowledge and \nattitude \n \n \n \n \n2.1 \nSafety Practices \n1.1.1 Work safety requirements \n1.1.2 Proper use of tools and equipment  \n2.2 \nMaterials, Tools and Equipment: Uses and Specifications \n2.2.1 Identification of appropriate tools, equipment; and \ndevices \n2.3  Theory and Practices \n2.3.1 Cable trailer equipment operations \n2.2.1 Installation of anchor logs or blocks \n2.2.2 Installation of extension arms and other pole hardware \nand accessories \n2.2.3 Grounding and bonding techniques \n2.2.4 Lashing machine operation \n2.3 \nDesirable work values and attitudes (cost conscious, safety \nconscious, quality conscious, etc.) \n3. Underpinning \nskills \n3.1. \nWork efficiently and systematically \n3.2. \nObserving safety precautions  \n3.3. \nproper handling and positioning of extension ladder \n3.4. \nProper handling, use and maintenance of tools and \nequipment \n3.5. \nCommunicate effectively \n3.6. \nInterpretation of plans and symbols \n3.7.\ndocumentation skills\n4. Resource \nimplications \nThe following resources should be available: \n4.1. \nTools, equipment, materials and PPE (see range of variables)\n4.2. \nWork area  \n4.3.\nService vehicle and traffic safety equipment \n5. Method of \nassessment \n5.1. \nDirect observation/demonstration with oral questioning  \n5.2. \nThird Party Report \n5.3.\nPortfolio\n6. Context of \nassessment \n6.1. \nCompetency maybe assessed in the workplace or in a \nsimulated workplace setting \n6.2. \nAssessment shall be undertaken either individually or part of \nteam under limited supervision\n",
