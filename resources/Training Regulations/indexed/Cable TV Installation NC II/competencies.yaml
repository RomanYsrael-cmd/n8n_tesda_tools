          "source_text": "1. Critical aspects\nof competency\nAssessment requires evidence that the candidate:\n1.1.\nComplied with standard installation practices and safety\nprocedures at all times during installation\n1.2.\nLaid out and installed fiber-optic/coaxial cables following job\nand quality requirements and within agreed time frame\n1.3.\nCommunicated and worked with authorities and personnel\nconcerned\n2. Underpinning\nknowledge and\nattitude\n\n2.1 Safety Practices\n1.1.3 Work safety requirements\n1.1.4 Proper use of tools and equipment\n2.2 Materials, Tools and Equipment: Uses and Specifications\n2.3.2 Identification of appropriate tools, equipment; and\ndevices and proper usage\n2.3 Theory and Practices\n2.3.1 Cable TV systems overview\n2.3.2 Basic electricity\n2.3.3 Map reading and identification of CATV symbols and\ndiagrams\n2.3.4 Handling of coaxial and fiber-optic cables\n2.3.5 Lay out and installation of fiber-optic/coaxial cables\n2.3.6 Cable trailer equipment operations\n2.3.7 Installation of anchor logs or blocks\n2.3.8 Installation of extension arms and other pole\nhardware and accessories\n2.3.9 Lashing machine operation\n2.4 Desirable work values and attitudes (cost conscious, safety\nconscious, quality conscious, etc.)\n3. Underpinning\nskills\n3.1.\nWork efficiently and systematically\n3.2.\nObserving safety precautions\n3.3.\nSTP in pole climbing & proper handling of extension ladder\n3.4.\nProper handling, use and maintenance of tools and\nequipment.\n3.5.\nProper handling of coaxial and fiber-optic cables\n3.6.\nCommunicating effectively\n3.7.\nInterpreting plans and symbols\n4. Resource\nimplications\nThe following resources should be available:\n4.1.\nTools, equipment, materials and PPE (see range of\nvariables)\n4.2.\nWork area with pole/s installed\n4.3.\nService vehicle and traffic safety devices\n5. Method of\nassessment\n5.1.\nDirect observation/demonstration with oral questioning\n5.2.\nThird Party Report\n5.3.\nPortfolio\n6. Context of\nassessment\n6.1.\nCompetency maybe assessed in the workplace or in a\nsimulated workplace setting\n6.2.\nAssessment shall be undertaken either individually or part\nof team under limited supervision\n\n--- PDF PAGE 37 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS – CABLE TELEVISION (CATV) INCSTALLATION NC II\n\n Page 35\n\nUNIT OF COMPETENCY :\nINSTALL ACTIVE AND PASSIVE DEVICES AND\nACCESSORIES\nUNIT CODE\n:"
