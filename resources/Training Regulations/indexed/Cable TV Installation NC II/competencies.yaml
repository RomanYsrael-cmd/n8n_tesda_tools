aple gun\n1.6 Set of pliers\n1.7 Set of screwdrivers\n1.8 F-open wrench\n1.9 Extension ladders (24 feet\nlength)\nMaterials:\n1.10 Drop cable\n1.11 F-connectors (crimped or\ncompression type)\n1.12 cable tie\n1.13 silicon gel\n1.14 rubber boots\n1.15 cable tag\n1.16 terminators\n1.17 grounding wire (gauge\n12, stranded)\n\n1.18 grounding rod (1/4’ by 4’\nwith clamp)\n1.19 grounding block\n1.20 P-hook\nEquipment:\n1.21 F.I. meter\n1.22 VOM\n1.23 Addressable\nbox/converter\n1.24 Cable modem\n1.25 In-house amplifier\n1.26 Service vehicle\nPPE:\n1.27 body belt & strap\n1.28 hard hat/ helmet\n1.29 set gloves\n1.30 goggles\n1.31 safety shoes\n1.32 tool pouch / holster\n1.33 safety cones/traffic\nsafety devices\n2. Installation of drop\nlines\n2.1\nConnect of drop cable to tap-off device\n2.2\nProvide drip loop\n2.3\nTest signal quality in drop cable\n2.4\nExtend cable to subscriber residence observing 14 ft.\nclearance from the ground\n2.5\nDetach messenger wire and attach to P-hook attached to the\nwall of the building\n2.6\nProvide drip loop and attach the cable properly to the wall of\nthe building either through conduit or staple wire\n2.7\nInstall grounding block nearest to ground and provide drip loop\nbefore inserting the cable inside the building\n2.8\nExtend drop cable to TV receiver\n3. appropriate\npersonnel\n3.1 cable installer / lead man\n3.2 ground man / helper\n4. problems\nencountered\n4.1\nfor CPE connections\n4.1.1. failure of equipment / factory defects\n4.1.2. incompatibility of CPE standards\n4.1.3. power failure/interruptions\n\n--- PDF PAGE 43 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS – CABLE TELEVISION (CATV) INCSTALLATION NC II\n\n Page 41\n\nEVIDENCE GUIDE\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nComplied with standard industry pract