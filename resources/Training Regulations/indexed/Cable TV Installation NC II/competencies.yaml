        "source_title": "LAY OUT AND INSTALL FIBER-OPTIC/ COAXIAL CABLES",
        "source_text": "--- PDF PAGE 33 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ \nTRAINING REGULATIONS – CABLE TELEVISION (CATV) INCSTALLATION NC II \n \n                         Page 31  \n \n \n       \n \n \n \n \n \n \nUNIT OF COMPETENCY : \nLAY OUT AND INSTALL FIBER-OPTIC/ COAXIAL \nCABLES  \nUNIT CODE \n:     MDA724302 \nDESCRIPTOR \n: \nThis unit covers the outcomes required for laying out \nand installing cable television cables. Cable types may \nbe fiber-optic or co-axial. This involves working with a \nteam. \n \nELEMENT \nPERFORMANCE CRITERIA \n(Italicized Bold terms are elaborated in the range of variables) \n1. Prepare for cable \nlay out and \ninstallation \n \n1.1. Necessary tools, equipment, materials and personal \nprotective equipment (PPE) are prepared in line with \njob requirements.  \n1.2. Cable lay out and installation requirements and \nconstraints from plan and site inspection are identified as \nper job requirements \n1.3. Cable lay out and installation equipment is set up in \naccordance with manufacturer's and job requirements \n1.4. Site is made safe and secure for cable installation \n1.5. Suitable protective clothing is selected and required \nsafety devices used \n1.6. Support structure is assessed as safe for normal \nworking conditions \n1.7. Support structure is assessed to be sound for cable \nsupport as per job requirements \n1.8. Cable route is checked for obstructions and vertical \nclearances from street level and are made clear using \nsuitable methods and in coordination with authorities \nconcerned. \n1.9. Where necessary, obstructing cables, lines and pole \nattachments of other carriers are requested to be fixed or \ncorrected to facilitate work of laying out and installing \nnew cables \n2. Lay out and Install \ncable \n2.1 \nTools, equipment, clothing and safety requirements are \nidentified and obtained for the lay out and installation. \n2.2 \nMessengered cable is laid out, installed and tensioned \nto required specifications \n2.3 \nCable is secured permanently to support structure in \naccordance with standard installation procedures \n2.4 \nBending radius tolerance is observed for cable materials \nat all times \n2.5 \nProblems encountered are referred to appropriate \npersonnel as per standard operating procedures (SOP).\n\n--- PDF PAGE 34 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ \nTRAINING REGULATIONS – CABLE TELEVISION (CATV) INCSTALLATION NC II \n \n                         Page 32  \n \n \n       \n \n \n \n \n \n \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Tools, equipment \nand materials \nand  PPE  \n \n \n \n \nMay include but not limited to: \nTools and Equipment: \n1.1 \nhammers \n1.2 \naerial handline \n1.3 \nextension ladders (24 ft. \nlength) \n1.4 \nadjustable wrench \n1.5 \nfixing brackets/clamps \n1.6 \ncable tensioner/rachet/ \ncoping jack \n1.7 \ncome-a-long / guy grip \n1.8 \ndrill/electric drill \n1.9 \nwire/lashing wire \n1.10 raising tool (insulated) \n1.11 tape linen/steel tape \n1.12 height measuring stick/pole \nstick for clearances. \nTools for fiber-optics: \n1.13 Fusion splice \n1.14 Fiber cleaver \n1.15 OTDR \n1.16 Power Meter \n1.17 Fiber scope \n1.18 Buffer Tube Stripper \n1.19 Cable slitter \n1.20 Fiber stripper \n1.21 Kevlar cutter \n1.22 Alcohol dispenser \n1.23 Tissue paper/cotton buds \n1.24 Alcohol 99.9% Isopropyl \n1.25 Diagonal side cutter \n1.26 Bolt cutter \n1.27 Safety goggles \n1.28 NT cutter \n1.29 Messenger Grip M118 \nMaterials: \n1.30 cable clip \n1.31 grounding wire \n1.32 lashing wire \n1.33 lashing wire clamps \n1.34 cable support \n1.35 cable spacer \n1.36 adhesive tape \n1.37 strand clamps \n \n \n1.38 cable roller \n1.39 standard rope \n1.40 tie wrap  \n1.41 cable-loop form / X-\nframe \n1.42 ground/guying insulator \n1.43 thimble eye nut \n1.44 sets of washer, bolts and \nnuts, machine bolts \n1.45 guying fixtures \n1.46 conduit pipes \n1.47 cable tag \n1.48 pole tag \n1.49 braces \n1.50 color coded marked tape \n1.51 spiral sleeve \nMaterials for Fiber-optics: \n1.52 Optical closure \n1.53 X-Frame Fiber \nManagement \n1.54 Patch cord \n1.55 Pigtail \n1.56 Optical Adapter \n1.57 Preformed Wire ¼ \n1.58 Fusion Sleeves \n1.59 Optical Distribution \nFrame (Patch Panel) \n1.60 3-bolt suspension clamp \n1.61 Pole clamp \nEquipment: \n1.62 lashing machine \n1.63 tensioning machine \n1.64 cable trailer \n1.65 lineman’s truck \nPPE: \n1.66 body belt & strap \n1.67 hard hat/ helmet \n1.68 set gloves \n1.69 goggles \n1.70 safety shoes \n1.71 tool pouch \n1.72 safety cones/traffic \nsafety devices\n\n--- PDF PAGE 35 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ \nTRAINING REGULATIONS – CABLE TELEVISION (CATV) INCSTALLATION NC II \n \n                         Page 33  \n \n \n       \n \n \n \n \n \n \n \n2. Support structure \n2.1 \nElectric pole  \n2.2 \nGuy wire \n2.3 \nPole dressing \n3. Obstructions  \n \n \n \n \n3.1 \nTrees \n3.2 \nStructures such as arcs, billboards, etc. \n3.3 \nParts of buildings and houses such as roof \nextensions/overhangs \n3.4 \nTraffic lights, street lights, etc. \n3.5 \nPower lines \n4. Suitable \nmethods for \nremoving \nobstructions \n4.1 \nTrimming of tree branches \n4.2 \nInstallation of ten-pin alley arm \n4.3 \nInstallation of high-tension insulation materials \n5. Installation \nprocedures \n5.1 \nStringing of cable between suspension clamps \n5.2 \nTensioning of cable \n6. appropriate \npersonnel \n6.1 \nleadman/team leader \n6.2 \nsupervisor/foreman\n\n--- PDF PAGE 36 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ \nTRAINING REGULATIONS – CABLE TELEVISION (CATV) INCSTALLATION NC II \n \n                         Page 34  \n \n \n       \n \n \n \n \n \n \nEVIDENCE GUIDE \n1. Critical aspects \nof competency \nAssessment requires evidence that the candidate: \n1.1. \nComplied with standard installation practices and safety \nprocedures at all times during installation \n1.2. \nLaid out and installed fiber-optic/coaxial cables following job \nand quality requirements and within agreed time frame \n1.3. \nCommunicated and worked with authorities and personnel \nconcerned \n2. Underpinning \nknowledge and \nattitude \n \n \n \n \n2.1 Safety Practices \n1.1.3 Work safety requirements \n1.1.4 Proper use of tools and equipment  \n2.2 Materials, Tools and Equipment: Uses and Specifications \n2.3.2 Identification of appropriate tools, equipment; and \ndevices and proper usage \n2.3 Theory and Practices \n2.3.1 Cable TV systems overview \n2.3.2 Basic electricity \n2.3.3 Map reading and identification of CATV symbols and \ndiagrams \n2.3.4 Handling of coaxial and fiber-optic cables \n2.3.5 Lay out and installation of fiber-optic/coaxial cables \n2.3.6 Cable trailer equipment operations \n2.3.7 Installation of anchor logs or blocks \n2.3.8 Installation of extension arms and other pole \nhardware and accessories \n2.3.9 Lashing machine operation \n2.4 Desirable work values and attitudes (cost conscious, safety \nconscious, quality conscious, etc.)\n3. Underpinning \nskills \n3.1. \nWork efficiently and systematically \n3.2. \nObserving safety precautions  \n3.3. \nSTP in pole climbing & proper handling of extension ladder \n3.4. \nProper handling, use and maintenance of tools and \nequipment. \n3.5. \nProper handling of coaxial and fiber-optic cables \n3.6. \nCommunicating effectively \n3.7.\nInterpreting plans and symbols\n4. Resource \nimplications \nThe following resources should be available: \n4.1. \nTools, equipment, materials and PPE (see range of \nvariables) \n4.2. \nWork area with pole/s installed  \n4.3.\nService vehicle and traffic safety devices\n5. Method of \nassessment \n5.1. \nDirect observation/demonstration with oral questioning  \n5.2. \nThird Party Report \n5.3.\nPortfolio\n6. Context of \nassessment \n6.1. \nCompetency maybe assessed in the workplace or in a \nsimulated workplace setting \n6.2. \nAssessment shall be undertaken either individually or part \nof team under limited supervision\n",
