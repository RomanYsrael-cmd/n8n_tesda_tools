        "source_title": "INSTALL ACTIVE AND PASSIVE DEVICES AND ACCESSORIES",
        "source_text": "--- PDF PAGE 37 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ \nTRAINING REGULATIONS – CABLE TELEVISION (CATV) INCSTALLATION NC II \n \n                         Page 35  \n \n \n       \n \n \n \n \n \n \nUNIT OF COMPETENCY : \nINSTALL ACTIVE AND PASSIVE DEVICES AND \nACCESSORIES \nUNIT CODE \n:    MDA724303 \nDESCRIPTOR \n: \nThis unit covers the outcomes required for installing \nactive and passive devices and accessories, such as \ntrunk and line extender amplifiers, splitters, directional \ncouplers, power inserter, connectors, etc., for the \noutside plant (OSP) cable television systems.  \nELEMENT \nPERFORMANCE CRITERIA \n(Italicized Bold terms are elaborated in the range of variables) \n1. Prepare for \ninstallation of \ndevices \n1.1. \nNecessary tools, equipment, materials and personal \nprotective equipment (PPE) are identified and \nprepared in line with job requirements.  \n1.2. \nCable preparation and connectorization is performed in \naccordance with manufacturer’s specifications and as \nper design plan \n2. Install devices \n2.1. \nTools, equipment, materials and PPE requirements are \nobtained for the installation of devices. \n2.2. \nInstallation plan is read and interpreted as per job \nrequirements \n2.3. \nDevices are installed in accordance with manufacturer’s \nspecification and industry standards \n2.4. \nProblems encountered are referred to appropriate \npersonnel as per standard operating procedures \n(SOP). \n3. Seal, water-proof \nand terminate \ndevices \n3.1. Installed devices are sealed in accordance with job \nrequirements \n3.2. Connectors are water-proofed in accordance with \nspecified industry standards \n3.3. All open ports are terminated in accordance with \nmanufacturers’ specifications \n3.4. Accomplishment reports are accurately reported/ \ndocumented in accordance with job requirements\n\n--- PDF PAGE 38 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ \nTRAINING REGULATIONS – CABLE TELEVISION (CATV) INCSTALLATION NC II \n \n                         Page 36  \n \n \n       \n \n \n \n \n \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Tools, equipment, \nmaterials and  \nPPE  \n \n \n \n \nMay include but not limited to: \nTools: \n1.1 \nCable cutter \n1.2 \nBolt cutter \n1.3 \nCoring tools \n1.4 \nCenter conductor’s \nstripper \n1.5 \nTechnician’s knife \n1.6 \nScrewdrivers \n1.7 \nSocket / adjustable \nwrench \n1.8 \nTorque wrench \n1.9 \nBlow torch \n1.10 extension ladders (24 feet \nlength) \nMaterials: \n1.11 cable clip \n1.12 heat shrink \n1.13 silicon gel \n1.14 tie wrap \n1.15 cable-loop form \n1.16 color coded marked tape \n1.17 terminators \n1.18 tap-off bracket \n1.19 conduit / GI pipes\n \n1.20 electric meter \n1.21 circuit breaker \n1.22 grounding wire (gauge \n12, stranded) \n1.23 TW wire (gauge 12, \nstranded or solid) \nEquipment: \n1.24 Power supply  \n1.25 Trunk amplifier \n1.26 Line extended \n1.27 Node \n1.28 Power inserter/splitter/ \ndirectional coupler/      \ntap-offs \n1.29 Service vehicle \nPPE: \n1.30 body belt & strap \n1.31 hard hat/ helmet \n1.32 set gloves \n1.33 goggles \n1.34 safety shoes \n1.35 tool pouch / holster \n1.36 safety cones/traffic safety \ndevices \n2. Installation of \ndevices  \n2.1 Clamping/Attachment of devices to messenger wire \n2.2 Cable preparation and connectorization \n2.3 Forming of proper drift loop observing the bending radius \nspecified by the cable manufacturers \n2.4 Attaching/Linking/Connecting the devices to the coaxial cable \n2.5 Sealing and water-proofing of all inter-phase devices or \nconnectors \n2.6\nTermination of all open ports\n3. Devices and \naccessories \n \n \n \n \n3.1 Passive \n3.1.1. splitter \n3.1.2. directional coupler \n3.1.3. power inserter \n3.1.4. directional taps \n3.2 Active \n3.2.1. trunk amplifiers \n3.2.2. line extender \namplifiers \n \n3.2.3. nodes \n3.2.4. power supplies \n3.3 Accessories \n3.3.1. connectors \n3.3.2. terminators \n3.3.3. heat shrink \n \n4. appropriate \npersonnel \n4.1 leadman/team leader \n4.2 supervisor/foreman\n\n--- PDF PAGE 39 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ \nTRAINING REGULATIONS – CABLE TELEVISION (CATV) INCSTALLATION NC II \n \n                         Page 37  \n \n \n       \n \n \n \n \n \n \nEVIDENCE GUIDE \n1. Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1. \nComplied with standard installation practices and \nsafety procedures at all times during installation \n1.2. \nInstalled active and passive devices following job and \nquality requirements and within agreed time frame \n1.3. \nCommunicated and worked with authorities and \npersonnel concerned  \n2. Underpinning \nknowledge and \nattitude \n \n \n \n \n2.1 \nSafety Practices \n2.1.1 Work safety requirements \n2.1.2 Proper use of tools and equipment  \n2.2 \nMaterials, Tools and Equipment: Uses and \nSpecifications \n2.2.1 Identification of appropriate tools, equipment; \nand devices and proper usage \n2.3 \nTheory and Practices \n2.3.1 Basic Electricity \n2.3.2 Identification and usage of active and passive \ndevices \n2.3.3 Aerial cable practices and installations \n2.3.4 Sealing, waterproofing and termination of CATV \ndevices \n2.3.5 Pole climbing techniques \n2.4 \nDesirable work values and attitudes (cost conscious, \nsafety conscious, quality conscious, etc.) \n3. Underpinning skills \n3.1. Work efficiently and systematically \n3.2. Observing safety precautions  \n3.3. proper handling of extension ladder \n3.4. Proper handling, use and maintenance of tools and \nequipment. \n3.5. Proper handling of coaxial and fiber-optic cables \n3.6. Communicating effectively \n3.7.\nInterpreting plans and symbols\n4. Resource \nimplications \nThe following resources should be available: \n4.1. \nTools, equipment, materials and PPE (see range of \nvariables) \n4.2. \nWork area with pole/s installed  \n4.3.\nService vehicle and traffic safety devices\n5. Method of \nassessment \n5.1. \nDirect observation/demonstration with oral questioning \n5.2. \nThird Party Report \n5.3.\nPortfolio\n6. Context of \nassessment \n6.1. \nCompetency maybe assessed in the workplace or in a \nsimulated workplace setting \n6.2. \nAssessment shall be undertaken either individually or \npart of team under limited supervision\n",
