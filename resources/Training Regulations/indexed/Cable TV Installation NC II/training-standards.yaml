ntify tasks to be\nundertaken and the\nappropriate tools to\nperform the task\n2.2 Prepare and check the\nrequired hand tools and\nuse them properly\n2.3 Use appropriate hand\ntools and test equipment\nin accordance with safety\nrules and procedure\n2.4 Perform basic\nmaintenance procedures\non hand tools and test\nequipment\n Lecture /\nDemonstration\n Distance\nlearning\n Film Showing\n\n Written/Oral\nexamination\n Practical\ndemonstration\n Observation and\nquestioning\n\n3 Perform\nMensuration\nand\nCalculation\n3.1 Identify tasks to be\nperformed and the\nappropriate measuring\ninstruments required\n3.2 Perform measurement and\ncalculation tasks\naccording to specifications\nand requirements\n3.3 Perform basic\nmaintenance tasks on\nmeasuring instruments\naccording to established\nrules and procedure\n Self- paced/\nmodular\n Lecture/\nDemonstration\n Small group\ndiscussion\n Distance\nlearning\n Written/Oral\nexamination\n Practical\ndemonstration\n\n--- PDF PAGE 51 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS – CABLE TELEVISION (CATV) INCSTALLATION NC II\n\n Page 49\n\n4 Prepare and\nInterpret\nTechnical\nDrawings\n4.1 Identify and select the\nappropriate technical\ndrawing required\n4.2 Identify symbols and\nInterpret the technical\ndrawing properly\n4.3 Check and validate\ndrawing requirements and\nprepare/make changes on\nelectrical/electronic\nschematics and drawings\n4.4 Explain how to record and\nstore technical drawings,\nequipment and\ninstruments properly\n Lecture/\ndemonstration\n Dualized\ntraining\n Distance\nlearning\n Written /oral\n examinations\n Direct\n observation\n Project method\n interview\n\n--- PDF PAGE 52 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS – CABLE TELEVISION (CATV) INCSTALLATION NC II\n\n Page 50\n\nCORE COMPETENCIES\n300 hrs\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Install Pole\nHardware and\nAccessories\n\n1.1 Read & interpret work instructions as\nper plan\n1.2 Identify the tools, equipment, testing\ndevices, & materials needed for\ninstallation\n1.3 Identify the PPE & OHS policies &\nprocedures required for the installation\njob\n1.4 Install pole hardware, accessories and\ncable\n1.5 Conduct final inspection of the installed\npole hardware, accessories and cable\n1.6 Prepare an installation & testing report\n\n Lecture\n Discussion\n Demonstration\n Viewing\nmultimedia\n Hands on\npractice\n\n Observation in\nworkplace\n Demonstration\n Oral\nquestioning\n Third Party\nReport\n Portfolio\n2. Lay Out and\nInstall Coaxial\n/ Fiber-Optic\nCables\n\n2.1 Read & interpret work instructions as\nper plan\n2.2 Identify the tools, equipment, testing\ndevices, & materials needed for\ninstallation\n2.3 Identify the PPE & OHS policies &\nprocedures required for the lay out job\n2.4 Lay out and install coaxial/ fiber-optic\ncables\n2.5 Conduct final inspection of the installed\naerial and underground cable\n\n Lecture\n Discussion\n Demonstration\n Viewing\nmultimedia\n Hands on\npractice /\nSimulation\n\n Observation in\nworkplace\n Demonstration\n Oral\nquestioning\n Third Party\nReport\n Portfolio\n3. Install Active\nand Passive\nDevices and\nAccessories\n\n3.1 Read & interpret work instructions as\nper plan\n3.2 Identify the tools, equipment, testing\ndevices, materials & PPE needed for\ninstallation\n3.3 Install active and passive devices &\naccessories\n3.4 Seal, waterproof and terminate devices\n& accessories\n3.5 Conduct final inspection of the installed\ndevices\n3.6 Prepare an installation & testing report\n\n Lecture\n Discussion\n Demonstration\n Viewing\nmultimedia\n Hands on\npractice/\nSimulation\n\n Observation in\nworkplace\n Demonstration\n Oral\nquestioning\n Third Party\nReport\n Portfolio\n\n--- PDF PAGE 53 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS – CABLE TELEVISION (CATV) INCSTALLATION NC II\n\n Page 51\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n4. Install\nSubscriber\nDrop Lines\nand CPE\n\n4.1 Read & interpret work instructions as\nper plan\n4.2 Identify the tools, equipment, testing\ndevices, & materials needed for\ninstallation\n4.3 Identify the PPE & OHS policies &\nprocedures required for the installation\njob\n4.4 Install subscriber drop lines\n4.5 Connect , test and adjust customer\npremises equipment (CPE)\n4.6 Prepare an installation report\n\n Lecture\n Discussion\n Demonstration\n Viewing\nmultimedia\n Hands on\npractice/\nSimulation\n\n Observation in\nworkplace\n Demonstration\n Oral\nquestioning\n Third Party\nReport\n Portfolio\n5. Install Cables\nand Devices\nfor MDU\n\n5.1 Read & interpret work instructions as\nper plan\n5.2 Identify the tools, equipment, testing\ndevices, materials & PPE needed for\ninstallation\n5.3 Lay out cables as per design\n5.4 Install and connect devices\n5.5 Conduct final inspection of the installed\ncable and devices\n5.6 Prepare an installation & testing report\n\n Lecture\n Discussion\n Demonstration\n Viewing\nmultimedia\n Hands on\npractice/\nSimulation\n\n Observation in\nworkplace\n Demonstration\n Oral\nquestioning\n Third Party\nReport\n Portfolio\n\n--- PDF PAGE 54 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS – CABLE TELEVISION (CATV) INCSTALLATION NC II\n\n Page 52"
