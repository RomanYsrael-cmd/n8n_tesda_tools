  "source_text": "Alloy\nCombination of homogenized metals. Base metal mixed with\nprecious ore to make it workable, harden it, or change its color\nAnnealing metal\nIs a heat process whereby a metal is heated to a specific\ntemperature/color and then allowed to cool slowly. This softens the\nmetal which means it can be cut and shaped more easily.\nAntiquing\nProcess of darkening recessed areas of to enhance the visibility of\nengraving\nAssay\nProcess of establishing purity of gold, silver and other alloys\nBail\nConnector at the top of a pendant. Enables pendant to hang from a\nchain or jumpring.\nBasse-taille\n(bass-tie)\nTechnique of applying glass enamel to a metal surface that has\nbeen engraved deeply enough to hold the enamel when heated\nand has sides high enough to keep the enamel colors separate.\nBezel setting\nThe oldest and most basic gemstone setting, derived from the\nFrench word “Biseau” meaning chamfered. A collar style setting for\na gemstone that offers more protection of softer or delicate\nminerals such as opal.\nCarre Setting\nIs where the stone is seated directly over a light well, and the stone\nis set by raising (hammering) four “spurs” with a “graver” tool.\nCarat\nCarat is a number from 1 to 24 that designates the percentage of\npure gold in a sample of gold alloy. 24 carat represents pure gold.\n18 carat indicates that 18/24 % or 75% of that sample is pure gold\nand the remainder is made up of metals other than gold\nCasting\nMethod of shaping metal by melting and pouring into hollow molds.\nLess dense than wrought metals and requires additional polishing\nand finishing\nChannel setting\nAre primarily used to set faceted gemstones that are straight-sided,\nor quadrilateral in shape (baguette or princess cut)\nElectro-plating\nElectro chemical process of applying one metal to the surface of\nanother.\nEngraving\nProcess of decorating metal by gouging a design into its surface\nGold Plating\nIs a method of depositing a thin layer of gold on the surface of other\nmetal, most often copper or silver. It is often used in electronics, to\nprovide a corrosion-resistant electrically conductive layer on\ncopper, typically in electrical connectors and printed circuit boards.\n\n--- PDF PAGE 90 ---\n88\nTR-JEWELRY MAKING (Fine Jewelry) NC III Date Promulgated: Nov. 2010\nHarden\nHardening is the process of making a jewelry component more stiff\nand permanent. This can be accomplished in a variety of ways\nincluding hammering and work hardening.\nInvisible setting\nSetting style where rows of square cut gemstones rest flush edge\nto edge; all within a metal border or frame, with no metal separating\nindividual gems\nJewelry Wire\nJewelry wire is soft wire used to make jewelry. Jewelry wire can be\nbrass, copper, gold, sterling silver, fine silver, gold-filled and/or gold\nand silver plated wire.\nJig\nA jig is a jewelry-making tool with a series of pegs used to form or\nshape wire. The most popular brand of jigs is the WigJig brand.\nMounting\nDevice that holds a gem in place\nOxidation\nChemical process to blacken or tarnish. Sulphur and oxygen is\nused on silver.\nPave setting\nIs a tight grouping of identically sized stones laid across a flat, or\nconvex surface, from the French word for “paved.” The stones are\nheld in place using three to six raised beads per stone.\nPlating\nIs a surface covering in which a metal is deposited on a conductive\nsurface. Plating is used to decorate objects, for corrosion inhibition,\nto improve solderability, to harden, to improve wearability, to\nreduce friction, to improve paint adhesion, to alter conductivity, for\nradiation shielding, and for other purposes. Jewelry typically uses\nplating to give a silver or gold finish.\nPolishing\nPolishing is the process of smoothing the surface of an object. With\njewelry wire polishing results in a shiny appearance and can\nremove minor tool marks or blemishes. Frequently polishing\ninvolves using a mildly abrasive polishing compound to remove a\nthin layer of material.\nProng setting\nThe most common variety for faceted gemstones is a prong setting,\nwith either 3 or 4 prongs that hold the stone in place. This type of\nsetting exposes the maximum amount of light to the sides and\nbottom (pavilion).\n\nPrecious metal\nMetals valued for their color, malleability, and rarity; gold, silver and\nplatinum\n\nQuenching\nQuenching is a process for heat treating metals to change its\nhardness. This process involves heating the metal to a high\ntemperature and then rapidly cooling it by dipping it in a liquid bath\nmade of oil or water.\n\n--- PDF PAGE 91 ---\n89\nTR-JEWELRY MAKING (Fine Jewelry) NC III Date Promulgated: Nov. 2010\n\nRhodium\n Is a sheen of white metal. It is the rarest of all non-radioactive\nmetals on Earth. The most expensive metal and the best in\nresistance to corrosion and tarnish under most environmental\ncondition.\nSetting\nMethod by which a stone is held into a mounting.\nSoldering\nTechnique used in making and repairing jewelry whereby two\npieces of metal are joined when a molten metal with a lower\nmelting point than the two metals being joined is used.\nStamping\nUsing a die set to cut or emboss metal with a mark\nTiffany setting\nUsually round and elevated setting with six long slender prongs that\nflare from the base. Commonly used for large stones such as\ndiamond soliitaires\nTin\nA malleable semi-precious silvery metal that resists oxidation.\nMalleable at ordinary temperatures, but brittle when heated, tin acts\nas an agent in numerous alloys\nVise\nA vise is a tool used for gripping and holding components very\nsecurely. Vises are often fastened to a table or other sturdy base.\nWhite gold\nGold alloy made of nickel; sometimes contains palladium or zinc\n\n--- PDF PAGE 92 ---\n90\nTR-JEWELRY MAKING (Fine Jewelry) NC III Date Promulgated: Nov. 2010",
