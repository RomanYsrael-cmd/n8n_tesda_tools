        "evidence_guide": {
          "source_text": "1. Critical Aspects of\nCompetency\n\nAssessment requires evidence that the candidate:\n1.1 Identified and established fabrication requirements for\ndifferent complex and intricately designed jewelry\nbased from predetermined specifications in accordance\nwith organizational and client requirements\n1.2\nSelected and obtained tools, equipment, materials and\nconsumables with appropriate person/s in accordance\nwith organizational and OH&S requirements\n1.3\nPerformed fabrication in accordance with OH&S,\norganizational and industry accepted methods\n1.4\nFabricated items are checked for quality and to ensure\nconstruction conforms with required specifications and\norganizational requirements and standards\n1.5\nWhere necessary, reworked/retouched defective items in\naccordance with specifications and organizational\nprocedures\n1.6\nChecked finished product for quality, dimension and\nconstruction in accordance with design’s specifications\nand organizational requirements\n1.7\nNotified work completion to appropriate person/s in\naccordance with organizational procedures\n1.8\nCleaned and stored work area, tools and equipment in\naccordance with OHS and organizational requirements\n1.9\nUsed personal protective equipment (PPE) in accordance\nwith job requirements and OHS requirements\n1.10 Demonstrated knowledge on calculation and\nmeasurements\n2. Underpinning\nKnowledge\n2.1\nPhilippine National Standard (PNS) on Jewelry\n2.2\nTypes of jewelry\n2.3\nProperties and characteristics of metals used in jewelry\n2.4\nMetal preparation and fabrication techniques to suit\ndifferent design requirements\n2.5\nFactors affecting the selection of preparation and\nfabrication methods\n2.6\nRelevant materials and consumables for given jewelry\nfabrication jobs\n2.7\nProcedures for checking serviceability of applicable tools\nand equipment\n2.8\nAccounting of unused/excess materials\n2.9\nTools, machineries and equipment: Its specifications and\nusage\n2.10 Safe work practices and procedures/OH&S requirements\n2.11 First-aid measures\n\n--- PDF PAGE 54 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC III Promulgated: Nov. 25, 2010\n52\n3. Underpinning\nSkills\n3.1 Interpreting design specifications and follow instructions\n(oral or written)\n3.2 Measurements, weighing and calculation\n3.3 Selecting appropriate tools and equipment\n3.4 Selecting appropriate materials and manufacturing\ntechniques\n3.5 Applying appropriate fabrication and finishing procedures\n3.6 Applying safe working skills\n3.7 Identifying alternative metals\n3.8 Applying first-aid measures\n4. Resource\nImplications\nThe following resources should be provided:\n4.1 Materials relevant to the activity\n4.2 Tools and equipment\n4.3 Consumables\n4.4 PPE\n4.5 Workplace\n4.6 Documentation\n4.7 Exhaust fan\n4.8 Fire extinguisher\n5. Method of\nAssessment\nCompetency in this unit must be assessed through:\n5.1 Direct observation with oral questioning\n5.2 Demonstration with oral questioning\n5.3 Portfolio (Training Certificates, Certificate of Employment,\nWorkpiece, etc.)\n5.4 Third-Party Report\n6. Context of\nAssessment\n6.1 Competency may be assessed in the workplace or in a\n simulated work environment (TESDA Accredited\nAssessment Center)\n\n--- PDF PAGE 55 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC III Promulgated: Nov. 25, 2010\n53\nUNIT OF COMPETENCY: PERFORM STONE SETTING ACTIVITIES\n\nUNIT CODE :"
        },
        "source_text": "DCJ731306\n\nUNIT DESCRIPTOR : This unit covers knowledge, skills and attitudes in\nfabricating fine jewelry with complex and intricate\ndesigns\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Prepare\nrequirements for\nfabrication\n1.1 Design fabrication system, techniques, process, and\nfinishing requirements are established from\npredetermined specifications in accordance with\norganizational and client requirements\n1.2 Fabrication and finish specifications and required\noutcomes as indicated in the prescribed form are\nconfirmed and clarified as necessary with appropriate\nperson(s) and in accordance with organizational and\nclient’s requirements\n1.3 Appropriate preparation and fabrication techniques\nare established in accordance with in accordance with\njob requirements and organizational procedures\n1.4 Fabrication and finishing activities are prioritized in\naccordance with designated timeframes, organizational\nand specific plating requirements\n1.5 Tools, machineries and equipment are selected,\nrequested and checked for operational effectiveness in\naccordance with the manufacturer’s specification and\norganizational procedures\n1.6 Materials and consumables are also selected,\nrequested and obtained in accordance with\norganizational requirements and in consultation with\nappropriate person(s)\n1.7 Material preparation is conducted using safe operating\npractices and protective equipment, in accordance with\nOHS and organizational requirements\n\n--- PDF PAGE 49 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC III Promulgated: Nov. 25, 2010\n47\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n2. Perform fabrication\n2.1 Pre-formed materials are fabricated to produce\ncomponents using applicable fabrication activities and\nsafe operating practices, protective equipment, and in\naccordance with OH&S, organizational and industry\naccepted methods\n2.2 Fabricated item is checked to ensure construction\nconforms with required specifications and quality,\napplicable to industry and organizational standards\n2.3 When necessary, defective items are\nreworked/retouched in accordance with specifications\nand organizational procedures\n2.4 Fabricated items are submitted to appropriate person(s)\nfor quality control in accordance with organizational\nrequirements and standards\n2.5 Proper care in handling of metals (materials) is strictly\nobserved to ensure the quality and quantity is followed\nin accordance with the organizational requirements\n3. Perform post-\nfabrication activities\n3.1 Documentation is completed and processed in\naccordance with organizational requirements and\nstandards\n3.2 Unused/excess materials of same kind and quality are\nmelted together for proper re-testing of its quality and\nquantity as required by organizational procedures and\nsubmitted to issuing personnel for storage and\nsafekeeping\n3.3 Notification of work completion is made to appropriate\nperson(s) in accordance with organizational procedures\n3.4 Work area, tools and equipment are cleaned and stored\nin accordance with OHS and organizational\nrequirements\n\n--- PDF PAGE 50 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC III Promulgated: Nov. 25, 2010\n48\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Appropriate\nperson(s)\nMay include but are not limited to:\n1.1 Quality Control Personnel\n1.2 Client\n1.3 Designer\n2. Appropriate\npreparation and\nfabrication\ntechniques\nMay include but are not limited to:\n2.1 Read and interpret design sketches from the client\n2.2 Communicate and seek and take notes other opinion from\nappropriate person(s). Suggest modification if necessary\n2.3 Utilize graphic illustration\n2.4 Check all available ready made parts and\n components\n2.5 Obtain pre-fabricated wires, sheets and tubes\n2.6 Utilize lost wax casting techniques\n2.7 Use wax carving techniques and/ or CADCAM\n2.8 Design and plan fabrication of intricate, moving and\nfunctional component and parts\n2.9 Select and obtain tools, machineries and equipment\nneeded for fabrication\n2.10 Plan in advance surface texture, finishing and other\nmetal and surface treatment\n3. Fabrication and\nfinishing activities\nMay include but are not limited to:\n3.1 Handmade techniques\n3.2 Wax carving techniques\n3.3 Lost wax casting techniques\n3.4 Surface polishing\n3.5 Engraving and other surface modification, e.g. texturing,\n granulation, enameling etc..\n3.6 Stone setting\n3.7 Special metal treatment, e.g. Anti-tarnish,\n oxidizing, plating, etc.\n\n--- PDF PAGE 51 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC III Promulgated: Nov. 25, 2010\n49\n\nVARIABLE\nRANGE\n4. Tools, machineries\nand equipment\nMay include but not limited to:\nHand Tools\n4.1 HoldingTools\n4.2 Cutting tools\n4.3 Measuring tools\n4.4 Boring tools\n4.5 Forming tools\nEquipment and Machineries\n4.6 Heating equipment\n4.7 Soldering equipment\n4.8 Press equipment\n4.9 Casting equipment\n4.10\nTurning equipment\n5. Materials\nMay include but not limited to:\n5.1 Precious metals\n 5.1.1 Gold\n 5.1.2 Silver\n5.2 Non- precious base metals\n 5.2.1 Copper Nickel\n 5.2.2 Zinc\n 5.2.3 Brass\n5.3 Precious and/or Non- precious gemstones\n5.4 Non-traditional materials for jewelry making\n (e.g. Leather, sea shells, woods, etc.)\n6. Consumables\nMay include but not limited to:\n6.1 Chemicals\n 6.1.1 Borax\n 6.1.2 Boric Acid\n 6.1.3 Potassium Nitrate\n 6.1.4 Alum\n6.2 Supplies\n 6.2.1 Fuel\n 6.2.2 Emery paper\n 6.2.3 Crucibles\n 6.2.4 Solder\n\n--- PDF PAGE 52 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC III Promulgated: Nov. 25, 2010\n50\n\nVARIABLE\nRANGE\n7. Material\npreparation\nMay include but not limited to:\n7.1 Anneal pre-fabricated materials\n (e.g. tube, wires, sheets, etc.)\n7.2 Test ready made components ensuring proper quality\n7.3 Pre-alloyed metals:\n 7.3.1 Carefully check its weight,\n 7.3.2 Test its quality.\n 7.3.3 Place in crucible with sufficient flux\n 7.3.4 Fuse all metals into complete liquid stage for\nsheet preparation requirements\n7.4 Pure metals\n 7.4.1 Compute, prepare, accomplice alloying\nprocedure\n7.5 De- oxidize metal after annealing and before and\n after soldering\n7.6 Work area is free of other non ferrous metals to avoid\ncontamination to materials (metals)\n7.7 Exercise extreme care in handling material\n8. Documentation\nMay include but are not limited to:\n8.1 Job Order form\n8.2 Work instructions and procedures\n8.3 Materials and consumables used\n8.4 Time and record sheets\n8.5 Unused/excess materials\n\n--- PDF PAGE 53 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC III Promulgated: Nov. 25, 2010\n51\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\n\nAssessment requires evidence that the candidate:\n1.1 Identified and established fabrication requirements for\ndifferent complex and intricately designed jewelry\nbased from predetermined specifications in accordance\nwith organizational and client requirements\n1.2\nSelected and obtained tools, equipment, materials and\nconsumables with appropriate person/s in accordance\nwith organizational and OH&S requirements\n1.3\nPerformed fabrication in accordance with OH&S,\norganizational and industry accepted methods\n1.4\nFabricated items are checked for quality and to ensure\nconstruction conforms with required specifications and\norganizational requirements and standards\n1.5\nWhere necessary, reworked/retouched defective items in\naccordance with specifications and organizational\nprocedures\n1.6\nChecked finished product for quality, dimension and\nconstruction in accordance with design’s specifications\nand organizational requirements\n1.7\nNotified work completion to appropriate person/s in\naccordance with organizational procedures\n1.8\nCleaned and stored work area, tools and equipment in\naccordance with OHS and organizational requirements\n1.9\nUsed personal protective equipment (PPE) in accordance\nwith job requirements and OHS requirements\n1.10 Demonstrated knowledge on calculation and\nmeasurements\n2. Underpinning\nKnowledge\n2.1\nPhilippine National Standard (PNS) on Jewelry\n2.2\nTypes of jewelry\n2.3\nProperties and characteristics of metals used in jewelry\n2.4\nMetal preparation and fabrication techniques to suit\ndifferent design requirements\n2.5\nFactors affecting the selection of preparation and\nfabrication methods\n2.6\nRelevant materials and consumables for given jewelry\nfabrication jobs\n2.7\nProcedures for checking serviceability of applicable tools\nand equipment\n2.8\nAccounting of unused/excess materials\n2.9\nTools, machineries and equipment: Its specifications and\nusage\n2.10 Safe work practices and procedures/OH&S requirements\n2.11 First-aid measures\n\n--- PDF PAGE 54 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC III Promulgated: Nov. 25, 2010\n52\n3. Underpinning\nSkills\n3.1 Interpreting design specifications and follow instructions\n(oral or written)\n3.2 Measurements, weighing and calculation\n3.3 Selecting appropriate tools and equipment\n3.4 Selecting appropriate materials and manufacturing\ntechniques\n3.5 Applying appropriate fabrication and finishing procedures\n3.6 Applying safe working skills\n3.7 Identifying alternative metals\n3.8 Applying first-aid measures\n4. Resource\nImplications\nThe following resources should be provided:\n4.1 Materials relevant to the activity\n4.2 Tools and equipment\n4.3 Consumables\n4.4 PPE\n4.5 Workplace\n4.6 Documentation\n4.7 Exhaust fan\n4.8 Fire extinguisher\n5. Method of\nAssessment\nCompetency in this unit must be assessed through:\n5.1 Direct observation with oral questioning\n5.2 Demonstration with oral questioning\n5.3 Portfolio (Training Certificates, Certificate of Employment,\nWorkpiece, etc.)\n5.4 Third-Party Report\n6. Context of\nAssessment\n6.1 Competency may be assessed in the workplace or in a\n simulated work environment (TESDA Accredited\nAssessment Center)\n\n--- PDF PAGE 55 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC III Promulgated: Nov. 25, 2010\n53\nUNIT OF COMPETENCY: PERFORM STONE SETTING ACTIVITIES\n\nUNIT CODE :"
