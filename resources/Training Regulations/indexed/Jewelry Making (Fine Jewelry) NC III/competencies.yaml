        "source_title": "PERFORM STONE SETTING ACTIVITIES",
        "source_text": "--- PDF PAGE 55 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC III               Promulgated: Nov. 25, 2010 \n53 \nUNIT OF COMPETENCY:     PERFORM STONE SETTING ACTIVITIES \n \nUNIT CODE                     :     DCJ731307 \n  \nUNIT DESCRIPTOR        :     This unit covers the knowledge, skills and attitudes \nin setting gemstones of fine jewelry using varied \ndesigns of mountings to hold the stone.  \n \n \nELEMENT\nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1.   Perform stone \nsetting \npreparatory \nactivities \n \n1.1   Stone setting requirements are identified based on design \nspecifications  \n1.2   Process, finish specifications, and required outcomes are \nconfirmed and clarified as necessary with appropriate \nperson(s) and in accordance with organizational and \nclient’s requirements \n1.3   Materials (stones and mounting) are obtained, sorted \nout, checked and accounted for in accordance with \norganizational requirements and in consultation with \nappropriate person(s) \n1.4   Gemstones are pre-arranged/laid-out  in required position \nin temporary holder  for better viewing and accounting \npurposes \n1.5   When necessary, out of specs materials are returned or \nrequested for replacement in accordance with \norganizational requirements \n1.6   Consumables are identified,  requested and obtained  in \npreparation to specific process \n1.7   Tool, machineries and equipment  appropriate to job \nrequirements are selected and checked for operational \neffectiveness in accordance with manufacturers’ \nspecifications and organizational procedures \n1.8   Stone setting and finishing processes are prioritized in \naccordance with designated timeframes, organizational \nand specific fabrication requirements    \n1.9    Material preparation is conducted using safe operating \npractices and protective equipment in accordance with \nOHS and organizational requirements\n\n--- PDF PAGE 56 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC III               Promulgated: Nov. 25, 2010 \n54 \n \n \nELEMENT\nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n2.  Perform stone \nsetting \n \n  \n2.1  Applicable setting techniques are performed using safe \noperating practices and protective equipment, and in \naccordance with OH&S, organizational and industry \naccepted methods \n2.2   Stoned set is checked to ensure outcome conforms to \nrequired specifications, and quality based on organizational \nand industry standards \n2.3   Appropriate surface finish is produced to required \nspecifications and in accordance with organizational \nrequirements \n2.4  Finishing techniques are selected and applied prior to \nfinal cleaning and polishing requirements in accordance \nwith manufacturers’ specifications and organizational \nprocedures      \n3.  Perform post-\nstone setting \nactivities \n3.1  Finished item is submitted for final quality control and \ndocumentation in accordance with organizational \nrequirements \n3.2  Unused/excess materials are collected and \nstored/reclaimed in accordance with organizational \nrequirements \n3.3  Work area, tools and equipment are cleaned and stored in \naccordance with OH&S and organizational requirements\n\n--- PDF PAGE 57 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC III               Promulgated: Nov. 25, 2010 \n55 \nRANGE OF VARIABLES \n \nVARIABLE   \nRANGE  \n1.  Specifications \nMay include but are not limited to: \n1.1 Job Order \n1.2 Work instructions \n1.3 Illustrations \n1.4 Work samples \n2.  Appropriate \nperson(s)  \nMay include but are not limited to: \n2.1   Supervisor \n2.2   Client \n2.3   Colleague \n3.  Materials \n(stones and \nmounting) \nMay include but are not limited to: \n3.1 Mountings for gemstones setting requirements \n3.2 Un-assembled jewelry part with gem requirements \n3.3 Supplied gemstones for the job \n4.  Gemstones \nMay include but are not limited to: \n4.1  Precious stones \n4.2  Synthetic stones\n5.  Temporary \nholder \nMay include but are not limited to: \n5.1  Bees’ wax \n5.2  Stone holder \n5.3  Modeling clay \n5.4  Single-side tape/Masking tape \n6.  Consumables \nMay include but are not limited to: \n6.1  Shellac \n6.2  Gravers \n6.3  Drill bits and setting burs \n6.4  Emery paper \n6.5  Fine rubber wheels \n6.6  Cleaning and buffing compounds \n6.7  Kerosene/Thinner\n\n--- PDF PAGE 58 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC III               Promulgated: Nov. 25, 2010 \n56 \n \nVARIABLE   \nRANGE  \n7.  Tools, \nmachineries and \nequipment \nMay include but are not limited to: \n7.1 Hand and power tools for: \n      7.1.1 Cutting and raising beads. \n      7.1.2 Hammering and pushing \n      7.1.3 Drilling and boring \n      7.1.4 Bending and twisting  \n      7.1.5 Grinding and buffing \n      7.1.6 Prong lifting \n7.2 Holding tools \n7.3 Heating equipment \n7.4 Weighing and measuring \n7.5 Personal protective equipment (PPE)\n8.  Finishing \nprocess \nMay include but are not limited to: \n8.1  Hand graver cutting  \n8.2  Hand pushing \n8.3  Emery paper finishing \n8.4  Fine rubber wheel finishing \n8.5  Unseating mounting from holders \n8.6  Washing and drying\n9.  Applicable \nsetting \ntechniques \nMay include but are not limited to: \n9.1 Hammered \n9.2 Burin method \n9.3 Stone cast-in-place\n10.  Finishing \ntechniques \nMay include but are not limited to: \n10.1 Matte finish \n10.2 Florentine finish \n10.3 Bark finish \n10.4 Stone illusion finish (Bato-bato)\n\n--- PDF PAGE 59 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC III               Promulgated: Nov. 25, 2010 \n57 \nEVIDENCE GUIDE \n \n1. Critical aspects \nof Competency \n \n \nAssessment requires evidence that the candidate: \n1.1 Identified stone setting requirements based on design \nspecifications \n1.2 Selected and obtained components, materials, tools, \nmachineries and equipment  appropriate to job \nrequirements \n1.3 Returned or requested for replacement out of specs in \naccordance with organizational requirements \n1.4 Conducted material preparation using safe operating \npractices and protective equipment in accordance with \nOH&S and organizational requirements \n1.5 Performed applicable setting techniques using safe \noperating practices and protective equipment in \naccordance with OH&S and organizational requirements \n1.6 Checked item to ensure outcome conforms to required \nspecifications and in accordance with organizational \nrequirements \n1.7 Submitted finished item for final quality control and \ndocumentation in accordance with organizational \nrequirements \n1.8 Work area, tools and equipment are cleaned and stored in  \naccordance with OH&S and organizational requirements \n1.9 Observed safe work practices and procedures \n \n2. Underpinning \nKnowledge \n \n2.1 \nPhilippine National Standard (PNS) on Jewelry \n2.2 \nTypes of jewelry \n2.3 \nProperties and characteristics of metals used in jewelry \n2.4 \nTools and equipment for setting a range of jewelry \nitems/designs \n2.5 \nCommon jewelry design features, constructions and \nfinishes \n2.6 \nMetals, materials and consumables for given jewelry \nsetting jobs \n2.7 \nProperties and characteristics of applicable gemstones \n2.8 \nProcedures for checking serviceability of applicable tools \nand equipment \n2.9 \nSafe operating procedures for applicable tools and \nequipment \n2.10 Different techniques and processes of jewelry stone \nsetting \n2.11 Accounting of unused/excess materials \n2.12 Safe work practices and procedures/OH&S \nrequirementts \n2.13 First-aid measures\n\n--- PDF PAGE 60 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC III               Promulgated: Nov. 25, 2010 \n58 \n \n3.  Underpinning \nSkills \n3.1  Interpreting design specifications and follow instructions \n(oral or written) \n3.2  Interpreting drawings \n3.3  Measuring \n3.4  Selection and application of appropriate tools and \n       equipment \n3.5  Selection and application of appropriate processes and \nsetting techniques \n3.6  Finishing techniques (including basic engraving skills) \n3.7  Applying safe working skills \n3.8  Identifying alternative process, techniques, and materials \n3.9  Applying first-aid measures \n4.  Resource \nImplications \nThe following resources should be provided: \n4.1   Materials relevant to the activity  \n4.2   Tools and equipment \n4.3   Consumables \n4.4   PPE  \n4.5   Workplace \n4.6   Documentation \n4.7   Exhaust fan \n4.8   Fire extinguisher \n5.  Method of \nAssessment \nCompetency in this unit must be assessed through: \n5.1  Direct observation with oral questioning or \n5.2  Demonstration with oral questioning \n5.3  Portfolio (Training Certificates, Certificate of Employment, \nWorkpiece, etc.) \n5.4  Third-Party Report \n \n6.  Context of \nAssessment \n6.1  Competency may be assessed in the workplace or in a \nsimulated work environment (TESDA Accredited \nAssessment Center)\n",
