culation and\nmeasurements\n2. Underpinning\nKnowledge\n2.1\nPhilippine National Standard (PNS) on Jewelry\n2.2\nTypes of jewelry\n2.3\nProperties and characteristics of metals used in jewelry\n2.4\nMetal preparation and fabrication techniques to suit\ndifferent design requirements\n2.5\nFactors affecting the selection of preparation and\nfabrication methods\n2.6\nRelevant materials and consumables for given jewelry\nfabrication jobs\n2.7\nProcedures for checking serviceability of applicable tools\nand equipment\n2.8\nAccounting of unused/excess materials\n2.9\nTools, machineries and equipment: Its specifications and\nusage\n2.10 Safe work practices and procedures/OH&S requirements\n2.11 First-aid measures\n\n--- PDF PAGE 54 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC III Promulgated: Nov. 25, 2010\n52\n3. Underpinning\nSkills\n3.1 Interpreting design specifications and follow instructions\n(oral or written)\n3.2 Measurements, weighing and calculation\n3.3 Selecting appropriate tools and equipment\n3.4 Selecting appropriate materials and manufacturing\ntechniques\n3.5 Applying appropriate fabrication and finishing procedures\n3.6 Applying safe working skills\n3.7 Identifying alternative metals\n3.8 Applying first-aid measures\n4. Resource\nImplications\nThe following resources should be provided:\n4.1 Materials relevant to the activity\n4.2 Tools and equipment\n4.3 Consumables\n4.4 PPE\n4.5 Workplace\n4.6 Documentation\n4.7 Exhaust fan\n4.8 Fire extinguisher\n5. Method of\nAssessment\nCompetency in this unit must be assessed through:\n5.1 Direct observation with oral questioning\n5.2 Demonstration with oral questioning\n5.3 Portfolio (Training Certificates, Certificate of Employment,\nWorkpiece, etc.)\n5.4 Third-Party Report\n6. Context of\nAssessment\n6.1 Competency may be assessed in the workplace or in a\n simulated work environment (TESDA Accredited\nAssessment Center)\n\n--- PDF PAGE 55 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC III Promulgated: Nov. 25, 2010\n53\nUNIT OF COMPETENCY: PERFORM STONE SETTING ACTIVITIES\n\nUNIT CODE : DCJ731307\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes\nin setting gemstones of fine jewelry using varied\ndesigns of mountings to hold the stone.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Perform stone\nsetting\npreparatory\nactivities\n\n1.1 Stone setting requirements are identified based on design\nspecifications\n1.2 Process, finish specifications, and required outcomes are\nconfirmed and clarified as necessary with appropriate\nperson(s) and in accordance with organizational and\nclient’s requirements\n1.3 Materials (stones and mounting) are obtained, sorted\nout, checked and accounted for in accordance with\norganizational requirements and in consultation with\nappropriate person(s)\n1.4 Gemstones are pre-arranged/laid-out in required position\nin temporary holder for better viewing and accounting\npurposes\n1.5 When necessary, out of specs materials are returned or\nrequested for replacement in accordance with\norganizational requirements\n1.6 Consumables are identified, requested and obtained in\npreparation to specific process\n1.7 Tool, machineries and equipment appropriate to job\nrequirements are selected and checked for operational\neffectiveness in accordance with manufacturers’\nspecifications and organizational procedures\n1.8 Stone setting and finishing processes are prioritized in\naccordance with designated timeframes, organizational\nand specific fabrication requirements\n1.9 Material preparation is conducted using safe operating\npractices and protective equipment in accordance with\nOHS and organizational requirements\n\n--- PDF PAGE 56 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC III Promulgated: Nov. 25, 2010\n54\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n2. Perform stone\nsetting\n\n2.1 Applicable setting techniques are performed using safe\noperating practices and protective equipment, and in\naccordance with OH&S, organizational and industry\naccepted methods\n2.2 Stoned set is checked to ensure outcome conforms to\nrequired specifications, and quality based on organizational\nand industry standards\n2.3 Appropriate surface finish is produced to required\nspecifications and in accordance with organizational\nrequirements\n2.4 Finishing techniques are selected and applied prior to\nfinal cleaning and polishing requirements in accordance\nwith manufacturers’ specifications and organizational\nprocedures\n3. Perform post-\nstone setting\nactivities\n3.1 Finished item is submitted for final quality control and\ndocumentation in accordance with organizational\nrequirements\n3.2 Unused/excess materials are collected and\nstored/reclaimed in accordance with organizational\nrequirements\n3.3 Work area, tools and equipment are cleaned and stored in\naccordance with OH&S and organizational requirements\n\n--- PDF PAGE 57 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC III Promulgated: Nov. 25, 2010\n55\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Specifications\nMay include but are not limited to:\n1.1 Job Order\n1.2 Work instructions\n1.3 Illustrations\n1.4 Work samples\n2. Appropriate\nperson(s)\nMay include but are not limited to:\n2.1 Supervisor\n2.2 Client\n2.3 Colleague\n3. Materials\n(stones and\nmounting)\nMay include but are not limited to:\n3.1 Mountings for gemstones setting requirements\n3.2 Un-assembled jewelry part with gem requirements\n3.3 Supplied gemstones for the job\n4. Gemstones\nMay include but are not limited to:\n4.1 Precious stones\n4.2 Synthetic stones\n5. Temporary\nholder\nMay include but are not limited to:\n5.1 Bees’ wax\n5.2 Stone holder\n5.3 Modeling clay\n5.4 Single-side tape/Masking tape\n6. Consumables\nMay include but are not limited to:\n6.1 Shellac\n6.2 Gravers\n6.3 Drill bits and setting burs\n6.4 Emery paper\n6.5 Fine rubber wheels\n6.6 Cleaning and buffing compounds\n6.7 Kerosene/Thinner\n\n--- PDF PAGE 58 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC III Promulgated: Nov. 25, 2010\n56\n\nVARIABLE\nRANGE\n7. Tools,\nmachineries and\nequipment\nMay include but are not limited to:\n7.1 Hand and power tools for:\n 7.1.1 Cutting and raising beads.\n 7.1.2 Hammering and pushing\n 7.1.3 Drilling and boring\n 7.1.4 Bending and twisting\n 7.1.5 Grinding and buffing\n 7.1.6 Prong lifting\n7.2 Holding tools\n7.3 Heating equipment\n7.4 Weighing and measuring\n7.5 Personal protective equipment (PPE)\n8. Finishing\nprocess\nMay include but are not limited to:\n8.1 Hand graver cutting\n8.2 Hand pushing\n8.3 Emery paper finishing\n8.4 Fine rubber wheel finishing\n8.5 Unseating mounting from holders\n8.6 Washing and drying\n9. Applicable\nsetting\ntechniques\nMay include but are not limited to:\n9.1 Hammered\n9.2 Burin method\n9.3 Stone cast-in-place\n10. Finishing\ntechniques\nMay include but are not limited to:\n10.1 Matte finish\n10.2 Florentine finish\n10.3 Bark finish\n10.4 Stone illusion finish (Bato-bato)\n\n--- PDF PAGE 59 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC III Promulgated: Nov. 25, 2010\n57\nEVIDENCE GUIDE\n\n1. Critical aspects\nof Competency\n\nAssessment requires evidence that the candidate:\n1.1 Identified stone setting requirements based on design\nspecifications\n1.2 Selected and obtained components, materials, tools,\nmachineries and equipment appropriate to job\nrequirements\n1.3 Returned or requested for replacement out of specs in\naccordance with organizational requirements\n1.4 Conducted material preparation using safe operating\npractices and protective equipment in accordance with\nOH&S and organizational requirements\n1.5 Performed applicable setting techniques using safe\noperating practices and protective equipment in\naccordance with OH&S and organizational requirements\n1.6 Checked item to ensure outcome conforms to required\nspecifications and in accordance with organizational\nrequirements\n1.7 Submitted finished item for final quality control and\ndocumentation in accordance with organizational\nrequirements\n1.8 Work area, tools and equipment are cleaned and stored in\naccordance with OH&S and organizational requirements\n1.9 Observed safe work practices and procedures\n\n2. Underpinning\nKnowledge\n\n2.1\nPhilippine National Standard (PNS) on Jewelry\n2.2\nTypes of jewelry\n2.3\nProperties and characteristics of metals used in jewelry\n2.4\nTools and equipment for setting a range of jewelry\nitems/designs\n2.5\nCommon jewelry design features, constructions and\nfinishes\n2.6\nMetals, materials and consumables for given jewelry\nsetting jobs\n2.7\nProperties and characteristics of applicable gemstones\n2.8\nProcedures for checking serviceability of applicable tools\nand equipment\n2.9\nSafe operating procedures for applicable tools and\nequipment\n2.10 Different techniques and processes of jewelry stone\nsetting\n2.11 Accounting of unused/excess materials\n2.12 Safe work practices and procedures/OH&S\nrequirementts\n2.13 First-aid measures\n\n--- PDF PAGE 60 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC III Promulgated: Nov. 25, 2010\n58\n\n3. Underpinning\nSkills\n3.1 Interpreting design specifications and follow instructions\n(oral or written)\n3.2 Interpreting drawings\n3.3 Measuring\n3.4 Selection and application of appropriate tools and\n equipment\n3.5 Selection and application of appropriate processes and\nsetting techniques\n3.6 Finishing techniques (including basic engraving skills)\n3.7 Applying safe working skills\n3.8 Identifying alternative process, techniques, and materials\n3.9 Applying first-aid measures\n4. Resource\nImplications\nThe following resources should be provided:\n4.1 Materials relevant to the activity\n4.2 Tools and equipment\n4.3 Consumables\n4.4 PPE\n4.5 Workplace\n4.6 Documentation\n4.7 Exhaust fan\n4.8 Fire extinguisher\n5. Method of\nAssessment\nCompetency in this unit must be assessed through:\n5.1 Direct observation with oral questioning or\n5.2 Demonstration with oral questioning\n5.3 Portfolio (Training Certificates, Certificate of Employment,\nWorkpiece, etc.)\n5.4 Third-Party Report\n\n6. Context of\nAssessment\n6.1 Competency may be assessed in the workplace or in a\nsimulated work environment (TESDA Accredited\nAssessment Center)\n\n--- PDF PAGE 61 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC III Promulgated: Nov. 25, 2010\n59\n\nUNIT OF COMPETENCY : PERFORM JEWELRY METAL CASTING\n\nUNIT CODE : DCJ731308\n\n UNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes\nin metal casting fine jewelry primarily by the “lost\nwax” method of investment casting.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Prepare pre-\ncasting\noperations\n\n1.1 Tools, machineries, equipment, materials and\nconsumables are requested and prepared in accordance\nwith appropriate job requirements and organizational\nrequirements\n1.2 Pre-casting activities is performed in accordance with\norganizational or industry standards\n1.3 Metals and alloys are requested and obtained from\nappropriate personnel\n1.4 Personal protective equipment (PPE) is used in\naccordance with job requirements and OHS requirements\n2. Perform casting\noperations\n2.1 Requested metals and alloys are weighed out in\nappropriate wax-to-metal ratios\n2.2 Protective coating/chemicals is applied to jewelry metal\nas appropriate\n2.3 Burn-out flask is positioned into casting chamber in\naccordance with standard operating procedures\n2.4 Jewelry metal is heated according to required casting\ntemperature\n2.5 Molten metal is cast in accordance with standard operating\nprocedures (SOPs) and OH&S requirements\n2.6 Cast metal is cooled and removed from the flask by\nquenching in water\n2.7 Item is checked for quality to ensure conformance with\nrequired specifications following organizational procedures\n3. Perform post-\ncasting\noperations\n\n3.1 Cast metals and leftovers are cleaned, checked and\nsubmitted to appropriate personnel for documentation\n3.2 Casting flask is removed, cleaned and stored in a safe\nmanner\n3.3 Casting materials/consumables are stored as appropriate\nfor possible metal recovery\n3.4 Work area and equipment are cleaned after casting\nprocedure is completed\n\n--- PDF PAGE 62 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC III Promulgated: Nov. 25, 2010\n60\n RANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Tools, materials\nand\nconsumables\n\nMay include but are not limited to:\nTools\n1.1 Spatula\n1.2 Surgical knives\n1.3 Crucibles\nConsumables\n1.4 Investment powder\n1.5 Wax\n1.6 Fluxes\n1.7 Silicon spray\n1.8 Cleaning agents (e.g Denatured alcohol, Debubblelizer)\n Materials\n1.9 Rubber molds\n1.10 Flasks\nEquipment and Machineries\n1.11 Air compressor\n1.12 Centrifugal casting machine\n1.13 Vacuum casting machine\n1.14 Electric burn out furnace\n1.15 Steam de-waxer\n1.16 Electric melting machine\n1.17 Pressure water jet cabinet\n1.18 Blow torch\n1.19\nWax injector\n2. Organizational\nor industry\nstandards\n2.1\nWax injector machine is preheated\n2.2\nRubber mold is checked for dirt and imperfection/defects\n2.3\nRubber mold is sprayed with silicon\n2.4\nWax is injected in rubber mold\n2.5\nWax pattern is attach on the wax sprue and weigh to\ncalculate the amount of metal needed for casting\n2.6\nSprue tree is mounted on a flask base and enclosed with\nmetal flask in preparation for investing\n2.6.1\nCompute required water and investment powder\nappropriate to flask size\n2.6.2\nMix investment/ water using electric mixer or\nspatula\n2.6.3\nSlurry is vacuumed and poured into the flask\n2.7\nFlask is invested, vacuumed, in accordance with SOPs\n2.8\nPreheating of furnace is carried out according to job\nrequirements and manufacturer’s specifications\n2.9\nTemperature of invested flask is maintained in\naccordance with manufacturer’s specifications\n\n--- PDF PAGE 63 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC III Promulgated: Nov. 25, 2010\n61\n\nVARIABLE\nRANGE\n3. Metals and\nalloys\nMay include but are not limited to:\n3.1 Gold\n3.2 Silver\n3.3 Platinum\n6. Personal\nprotective\nequipment\n(PPE)\nMay include but are not limited to:\n6.1 Heat resistant gloves\n6.2 Heat resistant apron\n6.3 Face shield\n6.4 Safety goggles\n6.5 Safety shoes (Optional)\n7. Protective\ncoating /\nchemicals\nMay include but are not limited to:\n7.1 Fluxes (e.g. borax, boric acid)\n7.2 Inert Gases\n\n--- PDF PAGE 64 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC III Promulgated: Nov. 25, 2010\n62\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Prepared for metal casting in accordance with job\nrequirements and organizational procedures\n1.2 Conducted pre-casting operations in accordance with\nmanufacturer’s specifications\n1.3 Melted jewelry metal according to required casting\ntemperature\n1.4 Cast metal in accordance with standard operating\nprocedures and OH&S requirements\n1.5 Checked cast metal for quality to ensure conformance\nwith required specifications following organizational\nprocedures\n1.6 Submitted cast metals and leftovers for documentation\n1.7 Notified work completion to appropriate person/s in\naccordance with organizational procedures\n1.8 Cleaned and stored work area, tools and equipment in\naccordance with OHS and organizational requirements\n1.9 Used personal protective equipment (PPE) in\naccordance with job requirements and OHS\nrequirements\n\n2. Underpinning\nKnowledge\n2.1 Philippine National Standard on Jewelry\n2.2 Types of jewelry\n2.3 Different Casting Techniques and procedure\n2.4 Properties of metals used in jewelry\n2.5 Tools, machineries, Equipment, materials/consumables\npreparation and operating procedures\n2.6 Safe work practices and procedures/ OH&S requirements\n2.7 Accounting of unused/excess materials\n2.8 First aid measures\n3. Underpinning\nSkills\n3.1 Reading and interpreting routine information on written\njob instructions, specifications and standard operating\nprocedures.\n3.2 Identifying metals and their alloys\n3.3 Weighing metals and their alloys\n3.4 Setting up, checking and operating equipment\n3.5 Maintaining furnace temperatures\n3.6 Heating metals and alloys\n3.7 Applying safe casting procedures\n3.8 Working within heating timeframe constraints\n3.9 Housekeeping\n3.10 Applying first aid measures\n\n--- PDF PAGE 65 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC III Promulgated: Nov. 25, 2010\n63\n\n4. Resource\nImplications\nThe following resources should be provided:\n4.1 Materials relevant to the activity\n4.2 Tools, machineries and equipment\n4.3 Shop supplies\n4.4 PPE\n4.5 Workplace\n4.6 Exhaust fan\n4.7 Fire extinguisher\n4.8\nDocumentation\n5. Method of\nAssessment\nCompetency in this unit must be assessed through:\n5.1 Demonstration with oral questioning\n5.2 Portfolio (Training Certificates, Certificate of\nEmployment, Workpiece, etc.)\n5.3 Third-Party Report\n\n6. Context of\nAssessment\n6.1 Competency may be assessed in the workplace or in a\nsimulated work environment (TESDA Accredited\nAssessment Center)\n\n--- PDF PAGE 66 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC III Promulgated: Nov. 25, 2010\n64\n\nUNIT OF COMPETENCY: PRODUCE JEWELRY WAX MODEL\n\nUNIT CODE : DCJ731309\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes\nrequired in producing one-off wax models in simple\nto moderate carved forms and simple to moderate\nstructural forms for fine jewelry.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Prepare for wax\nmodeling\nactivities\n1.1 Wax modeling requirements are identified based on design\nspecifications\n1.2 Process and finish specifications and required outcomes are\nconfirmed and clarified as necessary with appropriate\nperson(s) and in accordance with organizational\nrequirements\n1.3 Wax modeling activities are established in accordance with\nprocess, verbal and written specifications, organizational\nrequirements and personal abilities\n1.4 Tools, machineries and equipment appropriate to job\nrequirements are selected and checked for operational\neffectiveness in accordance with manufacturers’\nspecifications and organizational procedures\n1.5 Material preparation is conducted using safe operating\npractices and protective equipment in accordance with\nOH&S and organizational requirements\n2. Produce wax\nmodels\n\n2.1 Wax is sculpted to specifications\n2.2 Sculpted wax model is checked and adjustments are made\nwhen necessary to rectify imperfections\n2.3 Wax model are finished in accordance with the design\nrequirements\n2.4 Finished wax model is cast in silicon rubber mold for future\nreproduction (optional)\n3. Perform post-\nwax modeling\nactivities\n3.1 Finished item is submitted for final quality control and\ndocumentation in accordance with organizational\nrequirements\n3.2 Unused/excess materials are collected and stored/reclaimed\nin accordance with organizational requirements\n3.3 Work area, tools and equipment are cleaned and stored in\naccordance with OH&S and organizational requirements\n\n--- PDF PAGE 67 ---\n65\nTR-JEWELRY MAKING (Fine Jewelry) NC III Date Promulgated: Nov. 2010\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Specifications\nMay include but are not limited to:\n1.1 Job Order\n1.2 Work instructions\n1.3 Illustrations\n1.4 Work samples\n2. Appropriate\nperson(s)\nMay include but are not limited to:\n2.1 Designer\n2.2 Supervisor\n3. Tools, machineries\nand equipment\nMay include but are not limited to:\n\n3.1 Electric and hand held tools\n 3.1.1 Wax pen/soldering iron\n 3.1.2 Wax guns\n 3.1.3 Saws\n 3.1.4 Carving tools\n 3.1.5 Wax files\n 3.1.6 Flaming/Blow torch\n 3.1.7 Wax carving burs\n 3.1.8 Miter box\n3.2 Ring tube reamer\n3.3 Wax ring mandrel\n3.4 Wax detailer\n3.5 Wax shaper\n3.6 Wax trimmer\n3.2 Equipment and machineries\n 3.2.1 Mini lathe\n 3.2.2 Flexible shafts with the following accessories\n 3.2.2.1 wax trimmer\n 3.2.2.2 wax gun kit\n 3.2.2.3 wax shaper\n 3.2.3 Electric wax pot\n 3.2.4 Wax welder with pen & 12 tips\n4. Material preparation 4.1 Appropriate waxes are selected, requested and\nobtained in accordance with organizational requirements\n4.2 Wax material is cut\n\n--- PDF PAGE 68 ---\n66\nTR-JEWELRY MAKING (Fine Jewelry) NC III Date Promulgated: Nov. 2010\nEVIDENCE GUIDE\n\n1. Critical aspects\nof Competency\n\nAssessment requires evidence that the candidate:\n1.1 Identified wax modeling requirements based on design\nspecifications\n1.2 Selected and checked tools, machineries and equipment\nappropriate to job requirements\n1.3 Conducted material preparation using safe operating\npractices and protective equipment in accordance with\nOH&S and organizational requirements\n1.4 Produced wax models in accordance with design\nrequirements\n1.5 Submitted finished item for final quality control and\ndocumentation in accordance with organizational\nrequirements\n1.6 Notified work completion to appropriate person/s in\naccordance with organizational procedures\n1.7 Cleaned and stored work area, tools and equipment in\naccordance with OHS and organizational requirements\n1.8 Used personal protective equipment (PPE) in accordance\nwith job requirements and OHS requirements\n2. Underpinning\nKnowledge\n\n2.1 Philippine National Standard (PNS) on jewelry\n2.2 Types of jewelry\n2.3 Properties of waxes\n2.4 Wax modeling techniques and procedures\n2.5 Factors affecting construction of wax model, including\ntype of wax, hand tools, method of construction, final\nfinish, weight of finished product\n2.6 Tools and equipment for wax modeling\n2.7 Design specifications\n2.8 Product Evaluation (Wax to metal ratio)\n2.9 Effects of casting shrinkage and finishing processes\n2.10 Safe work practices and procedures/OH&S requirements\n2.11 First-aid measures\n2.12 Accounting of unused/excess materials\n\n--- PDF PAGE 69 ---\n67\nTR-JEWELRY MAKING (Fine Jewelry) NC III Date Promulgated: Nov. 2010\n\n3. Underpinning\nSkills\n3.1 Clarifying design specifications\n3.2 Handling wax modeling tools\n3.3 Using protective safety equipment\n3.4 Reading and interpreting routine information on written job\ninstructions, specifications and standard operating\nprocedures\n3.5 Using measurement skills\n3.6 Planning, sequencing operations\n3.8 Evaluating product\n3.7 Applying first-aid measures\n\n4. Resource\nImplications\nThe following resources should be provided:\n4.1 Materials relevant to the activity\n4.2 Tools and equipment\n4.3 PPE\n4.4 Appropriately illuminated and ventilated workplace\n4.5 Fire extinguisher\n4.6 Exhaust fan\n4.7 Documentation\n5. Method of\nAssessment\nCompetency in this unit may be assessed through:\n5.1 Direct observation with oral questioning\n5.2 Demonstration with oral questioning\n5.3 Portfolio (Training Certificates, Certificate of Employment,\nWorkpiece, etc.)\n5.4 Third-Party Report\n\n6. Context of\nAssessment\n6.1 Competency may be assessed in the workplace or in a\nsimulated work environment (TESDA Accredited\nAssessment Center)\n\n--- PDF PAGE 70 ---\n68\nTR-JEWELRY MAKING (Fine Jewelry) NC III Date Promulgated: Nov. 2010\nUNIT OF COMPETENCY: ENGRAVE JEWELRY\n\nUNIT CODE : DCJ731310\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes\nrequired to engrave designs in fine jewelry using hand and\npower tools.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Perform engraving\npreparatory\nactivities\n1.1 Engraving jewelry requirements are identified from\nclient’s drawings and specifications\n1.2 Materials, tools and equipment are selected and\nprepared to carry out tasks consistent with job\nrequirements in accordance with workplace procedures\nand OHS procedures\n1.3 When necessary, out of specifications jewelry items are\nreturned or requested for replacement in accordance\nwith organizational requirements\n1.4 Engraving method is selected depending on job\nspecification and type of jewelry\n2. Perform engraving\n2.1 Patterns are outlined, pierced and carved on the jewelry\nand checked if details are properly transferred\n2.2 Design is inspected as to its proportion to the size and\nshape of the jewelry\n2.3 Designs are engraved on the jewelry in accordance\nwith job specification and organizational requirements\n2.4 Measures are undertaken to correct minor engraving\nomissions and errors\n2.5 Tools and equipment for engraving are used suitably in\naccordance with job specification\n2.6 Output is checked to ensure it conforms to required\nspecifications, quality and other engraving procedure\n3. Perform post-\nengraving\nactivities\n3.1 Finished item is submitted for final quality control and\ndocumentation in accordance with organizational\nrequirements\n3.2 Unused/excess materials are collected and\nstored/reclaimed in accordance with organizational\nrequirements\n3.3 Work area, tools and equipment are cleaned and stored\nin accordance with OHS and organizational requirements\n\n--- PDF PAGE 71 ---\n69\nTR-JEWELRY MAKING (Fine Jewelry) NC III Date Promulgated: Nov. 2010\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Materials, tools\nand equipment\nMay include but not limited to:\nMaterials\n1.1 Gravers\n1.2 Metal sheets\n1.3 Carbons/stencils\n1.4 White poster color\n1.5 Correction fluid\n1.6 Semi-finished jewelry\nTools\n1.7 Hand engraving tools\n1.8 Files\n1.9 Hammer\n1.10 Oil stone\n1.11 Magnifying lens\nEquipment\n1.12 Power graver set\n1.13 Ultrasonic machine\n2. Engraving\nMethod\n2.1 Hand engraving on hard metals\n2.2 Hand engraving on soft metals\n2.3 Engraving using pantograph\n2.4 Hand piercing and engraving\n2.5 Line engraving\n3. Designs\n3.1 Figures\n3.2 Letters\n3.3 Shapes\n3.4 Characters/Symbols\n4. Output\nMay include but not limited to:\n4.1 Rings\n4.2 Bracelets\n4.3 Lockets\n4.4 Earrings\n\n--- PDF PAGE 72 ---\n70\nTR-JEWELRY MAKING (Fine Jewelry) NC III Date Promulgated: Nov. 2010\nEVIDENCE GUIDE\n\n1. Critical aspects\nof competency\nAssessment requires evidence that the candidate:\n1.1 Identified job requirements based from client’s drawings\nand specifications\n1.2 Selected and prepared materials, tools and equipment in\nengraving jewelry in accordance with client and design\nspecifications\n1.3 Identified and selected appropriate methods of engraving\njewelry depending on job specifications and type of jewelry\n1.4 Engraved design on jewelry in accordance with job\nspecifications and organizational requirements\n1.5 Checked output to ensure conformity to required\nspecifications, quality and other engraving procedures\n1.6 Submitted finished item for final quality control and\ndocumentation in accordance with organizational\nrequirements\n1.7 Notified work completion to appropriate person/s in\naccordance with organizational procedures\n1.8 Cleaned and stored work area, tools and equipment in\naccordance with OH&S and organizational requirements\n1.9 Used personal protective equipment (PPE) in accordance\nwith job requirements and OHS requirements\n2. Underpinning\nKnowledge\n2.1 Philippine National Standard (PNS) on Jewelry\n2.2 Types of jewelry\n2.3 Properties of metals used in Jewelry\n2.4 Engraving methods and styles\n2.5 Design transfer\n2.6 Types and uses of engraving tools and equipment\n2.7 Health and safety precautions\n2.8 First-aid measures\n2.9 Accounting of unused/excess materials\n3. Underpinning\nSkills\n3.1 Reading and interpreting routine information on written job\ninstructions, specifications and standard operating\nprocedures\n3.2 Identifying and selecting of appropriate tools, equipment,\nmaterials, accessories and aids.\n3.3 Transferring of design to jewelry before engraving\n3.4 Performing of engraving methods to jewelry\n3.5 Techniques in correcting minor engraving omissions or\nerrors\n3.6 Examining finished work\n3.7 Using precision measuring instruments (i.e. calipers,\nmicrometers)\n3.8 Tools sharpening skills\n3.9 Handling engraving tools\n3.10 Applying first-aid measures\n3.11\nObserving OH&S procedures\n\n--- PDF PAGE 73 ---\n71\nTR-JEWELRY MAKING (Fine Jewelry) NC III Date Promulgated: Nov. 2010\n4. Resource\nImplications\nThe following resources should be provided:\n4.1 Tools, equipment and materials relevant to the activity\n4.2 PPE\n4.3 Consumables\n4.4 Work place\n4.5 Exhaust fan\n4.6 Fire extinguisher\n4.7 Documentation\n5. Method of\nAssessment\nCompetency in this unit may be assessed through:\n5.1 Direct observation with oral questioning or\n5.2 Demonstration with oral questioning\n5.3 Portfolio (Training Certificates, Certificate of Employment,\nWorkpiece, etc.)\n5.4 Third-Party Report\n\n6. Context of\nAssessment\n6.1 Competency may be assessed in the workplace or in a\nsimulated work environment (TESDA Accredited\nAssessment Center)\n\n--- PDF PAGE 74 ---\n72\nTR-JEWELRY MAKING (Fine Jewelry) NC III Date Promulgated: Nov. 2010"
