  "source_section_text": "SECTION 2 COMPETENCY STANDARDS\n\nThis section gives the details of the contents of the basic, common and\ncore units of competency required in JEWELRY MAKING (FINE JEWELRY) NC\nIII.\n\nBASIC COMPETENCIES\n\nUNIT OF COMPETENCY :\nLEAD WORKPLACE COMMUNICATION\n\nUNIT CODE\n:\n500311109\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and\nattitudes required to lead in the dissemination and\ndiscussion of ideas, information and issues in the\nworkplace.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Communicate\ninformation about\nworkplace processes\n1.1\nAppropriate communication method is selected\n1.2\nMultiple operations involving several topics areas are\ncommunicated accordingly\n1.3\nQuestions are used to gain extra information\n1.4\nCorrect sources of information are identified\n1.5\nInformation is selected and organized correctly\n1.6\nVerbal and written reporting is undertaken when\nrequired\n1.7\nCommunication skills are maintained in all situations\n2. Lead workplace\ndiscussions\n2.1.\nResponse to workplace issues is sought\n2.2.\nResponse to workplace issues is provided\nimmediately\n2.3.\nConstructive contributions are made to workplace\ndiscussions on such issues as production, quality and\nsafety\n2.4.\nGoals/objectives and action plan undertaken in the\nworkplace are communicated\n3. Identify and\ncommunicate issues\narising in the\nworkplace\n3.1\nIssues and problems are identified as they arise\n3.2\nInformation regarding problems and issues are\norganized coherently to ensure clear and effective\ncommunication\n3.3\nDialogue is initiated with appropriate personnel.\n3.4\nCommunication problems and issues are raised as\nthey arise\n\n--- PDF PAGE 5 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC III Promulgated: Nov. 25, 2010\n3\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Methods of\ncommunication\n1.1\nNon-verbal gestures\n1.2\nVerbal\n1.3\nFace to face\n1.4\nTwo-way radio\n1.5\nSpeaking to groups\n1.6\nUsing telephone\n1.7\nWritten\n1.8\nInternet\n\n--- PDF PAGE 6 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC III Promulgated: Nov. 25, 2010\n4\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nDealt with a range of communication/information at\none time\n1.2\nMade constructive contributions in workplace issues.\n1.3\nSought workplace issues effectively\n1.4\nResponded to workplace issues promptly\n1.5\nPresented information clearly and effectively written\nform\n1.6\nUsed appropriate sources of information\n1.7\nAsked appropriate questions\n1.8\nProvided accurate information\n2. Underpinning\nknowledge and\nattitudes\n2.1\nOrganization requirements for written and electronic\ncommunication methods\n2.2\nEffective verbal communication methods\n3. Underpinning skills\n3.1\nOrganize information\n3.2\nUnderstand and convey intended meaning\n3.3\nParticipate in variety of workplace discussions\n3.4\nComply with organization requirements for the use of\nwritten and electronic communication methods\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nVariety of Information\n4.2\nCommunication tools\n4.3\nSimulated workplace\n5. Method of\nassessment\nCompetency MUST be assessed through:\n5.1\nDirect Observation with questioning\n5.2\nInterview\n6. Context of\nassessment\n6.1\nCompetency may be assessed in the workplace or in\nsimulated workplace environment\n6.2\nAssessment shall be observed while task are being\nundertaken whether individually or in-group\n\n--- PDF PAGE 7 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC III Promulgated: Nov. 25, 2010\n5\nUNIT OF COMPETENCY :\nLEAD SMALL TEAMS\n\nUNIT CODE\n:\n500311110\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes\nto lead small teams including setting and\nmaintaining team and individual performance\nstandards.\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Provide team\nleadership\n1.1\nWork requirements are identified and presented to team\nmembers.\n1.2\nReasons for instructions and requirements are\ncommunicated to team members.\n1.3\nTeam members’ queries and concerns are recognized,\ndiscussed and dealt with.\n2. Assign\nresponsibilities\n2.1\nDuties, and responsibilities are allocated having regard to\nthe skills, knowledge and aptitude required to properly\nundertake the assigned task and according to company\npolicy.\n2.2\nDuties are allocated having regard to individual preference,\ndomestic and personal considerations, whenever possible.\n3. Set\nperformance\nexpectations\nfor team\nmembers\n3.1\nPerformance expectations are established based on client\nneeds and according to assignment requirements.\n3.2\nPerformance expectations are based on individual team\nmembers duties and area of responsibility.\n3.3\nPerformance expectations are discussed and disseminated\nto individual team members.\n4. Supervise team\nperformance\n4.1\nMonitoring of performance takes place against defined\nperformance criteria and/or assignment instructions and\ncorrective action taken if required.\n4.2\nTeam members are provided with feedback, positive\nsupport and advice on strategies to overcome any\ndeficiencies.\n4.3\nPerformance issues which cannot be rectified or\naddressed within the team are referenced to appropriate\npersonnel according to employer policy.\n4.4\nTeam members are kept informed of any changes in the\npriority allocated to assignments or tasks which might\nimpact on client/customer needs and satisfaction.\n4.5\nTeam operations are monitored to ensure that\nemployer/client needs and requirements are met.\n4.6\nFollow-up communication is provided on all issues affecting\nthe team.\n4.7\nAll relevant documentation is completed in accordance with\ncompany procedures.\n\n--- PDF PAGE 8 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC III Promulgated: Nov. 25, 2010\n6\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Work requirements\n1.1 Client Profile\n1.2 Assignment instructions\n2. Team member’s\nconcerns\n2.1 Roster/shift details\n3. Monitor performance\n3.1\nFormal process\n3.2\nInformal process\n4. Feedback\n4.1\nFormal process\n4.2\nInformal process\n5. Performance issues\n5.1\nWork output\n5.2\nWork quality\n5.3\nTeam participation\n5.4\nCompliance with workplace protocols\n5.5\nSafety\n5.6\nCustomer service\n\n--- PDF PAGE 9 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC III Promulgated: Nov. 25, 2010\n7\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nMaintained or improved individuals and/or team\nperformance given a variety of possible scenario\n1.2\nAssessed and monitored team and individual\nperformance against set criteria\n1.3\nRepresented concerns of a team and individual to\nnext level of management or appropriate specialist\nand to negotiate on their behalf\n1.4\nAllocated duties and responsibilities, having regard to\nindividual’s knowledge, skills and aptitude and the\nneeds of the tasks to be performed\n1.5\nSet and communicated performance expectations for\na range of tasks and duties within the team and\nprovided feedback to team members\n2. Underpinning\nknowledge and\nattitudes\n2.1\nCompany policies and procedures\n2.2\nRelevant legal requirements\n2.3\nHow performance expectations are set\n2.4\nMethods of Monitoring Performance\n2.5\nClient expectations\n2.6\nTeam member’s duties and responsibilities\n3. Underpinning skills\n3.1\nCommunication skills required for leading teams\n3.2\nInformal performance counseling skills\n3.3\nTeam building skills\n3.4\nNegotiating skills\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nAccess to relevant workplace or appropriately\nsimulated environment where assessment can take\nplace\n4.2\nMaterials relevant to the proposed activity or task\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1\nDirect observations of work activities of the individual\nmember in relation to the work activities of the group\n5.2\nObservation of simulation and/or role play involving\nthe participation of individual member to the\nattainment of organizational goal\n5.3\nCase studies and scenarios as a basis for discussion\nof issues and strategies in teamwork\n6. Context of\nassessment\n6.1\nCompetency assessment may occur in workplace or\nany appropriately simulated environment.\n6.2\nAssessment shall be observed while task are being\nundertaken whether individually or in-group.\n\n--- PDF PAGE 10 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC III Promulgated: Nov. 25, 2010\n8\n\nUNIT OF COMPETENCY :\nDEVELOP AND PRACTICE NEGOTIATION\nSKILLS\n\nUNIT CODE\n:\n500311111\n\nUNIT DESCRIPTOR\n:\nThis unit covers the skills, knowledge and attitudes\nrequired to collect information in order to negotiate to\na desired outcome and participate in the negotiation.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Plan negotiations\n1.1\nInformation on preparing for negotiation is identified\nand included in the plan\n1.2\nInformation on creating non verbal environments for\npositive negotiating is identified and included in the\nplan\n1.3\nInformation on active listening is identified and\nincluded in the plan\n1.4\nInformation on different questioning techniques is\nidentified and included in the plan\n1.5\nInformation is checked to ensure it is correct and up-\nto- date\n2. Participate in\nnegotiations\n2.1\nCriteria for successful outcome are agreed upon by\nall parties\n2.2\nDesired outcome of all parties are considered.\n2.3\nAppropriate language is used throughout the\nnegotiation\n2.4\nA variety of questioning techniques are used.\n2.5\nThe issues and processes are documented and\nagreed upon by all parties\n2.6\nPossible solutions are discussed and their viability\nassessed\n2.7\nAreas for agreement are confirmed and recorded\n2.8\nFollow-up action is agreed upon by all parties\n\n--- PDF PAGE 11 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC III Promulgated: Nov. 25, 2010\n9\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Preparing for\nnegotiation\n1.1\nBackground information on other parties to the\nnegotiation\n1.2\nGood understanding of topic to be negotiated\n1.3\nClear understanding of desired outcome/s\n1.4\nPersonal attributes\n1.4.1 self awareness\n1.4.2 self esteem\n1.4.3 objectivity\n1.4.4 empathy\n1.4.5 respect for others\n1.5\nInterpersonal skills\n1.5.1 listening/reflecting\n1.5.2 non verbal communication\n1.5.3 assertiveness\n1.5.4 behavior labeling\n1.5.5 testing understanding\n1.5.6 seeking information\n1.5.7 self disclosing\n1.6\nAnalytic skills\n1.6.1 observing differences between content and\nprocess\n1.6.2 identifying bargaining information\n1.6.3 applying strategies to manage process\n1.6.4 applying steps in negotiating process\n1.6.5 strategies to manage conflict\n1.6.6 steps in negotiating process\n1.6.7 options within organization and externally for\nresolving conflict\n2. Non verbal\nenvironments\n2.1\nFriendly reception\n2.2\nWarm and welcoming room\n2.3\nRefreshments offered\n2.4\nLead in conversation before negotiation begins\n3. Active listening\n3.1\nAttentive\n3.2\nDon’t interrupt\n3.3\nGood posture\n3.4\nMaintain eye contact\n3.5\nReflective listening\n4. Questioning\ntechniques\n4.1\nDirect\n4.2\nIndirect\n4.3\nOpen-ended\n\n--- PDF PAGE 12 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC III Promulgated: Nov. 25, 2010\n10\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nDemonstrated sufficient knowledge of the factors\ninfluencing negotiation to achieve agreed outcome.\n1.2\nParticipated in negotiation with at least one person to\nachieve an agreed outcome.\n2. Underpinning\nknowledge and\nattitudes\n2.1\nCodes of practice and guidelines for the organization\n2.2\nOrganizations policy and procedures for negotiations\n2.3\nDecision making and conflict resolution strategies\nprocedures\n2.4\nProblem solving strategies on how to deal with\nunexpected questions and attitudes during\nnegotiation\n2.5\nFlexibility\n2.6\nEmpathy\n3. Underpinning skills\n3.1\nInterpersonal skills to develop rapport with other\nparties\n3.2\nCommunication skills (verbal and listening)\n3.3\nObservation skills\n3.4\nNegotiation skills\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nRoom with facilities necessary for the negotiation\nprocess\n4.2\nHuman resources (negotiators)\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1\nObservation/demonstration and questioning\n5.2\nPortfolio assessment\n5.3\nOral and written questioning\n5.4\nThird party report\n6. Context of\nassessment\n6.1\nCompetency to be assessed in real work environment\nor in a simulated workplace setting.\n\n--- PDF PAGE 13 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC III Promulgated: Nov. 25, 2010\n11\nUNIT OF COMPETENCY :\nSOLVE PROBLEMS RELATED TO WORK\nACTIVITIES\n\nUNIT CODE\n:\n500311112\n\nUNIT DESCRIPTOR\n:\nThis unit of covers the knowledge, skills and\nattitudes required to solve problems in the\nworkplace including the application of problem\nsolving techniques and to determine and resolve\nthe root cause of problems.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Identify the problem\n1.1\nVariances are identified from normal operating\nparameters; and product quality.\n1.2\nExtent, cause and nature are of the problem are\ndefined through observation, investigation and\nanalytical techniques.\n1.3\nProblems are clearly stated and specified.\n2. Determine\nfundamental causes\nof the problem\n2.1\nPossible causes are identified based on experience\nand the use of problem solving tools / analytical\ntechniques.\n2.2\nPossible cause statements are developed based on\nfindings.\n2.3\nFundamental causes are identified per results of\ninvestigation conducted.\n3. Determine corrective\naction\n3.1\nAll possible options are considered for resolution of\nthe problem.\n3.2\nStrengths and weaknesses of possible options are\nconsidered.\n3.3\nCorrective actions are determined to resolve the\nproblem and possible future causes.\n3.4\nAction plans are developed identifying measurable\nobjectives, resource needs and timelines in\naccordance with safety and operating procedures.\n4. Provide\nrecommendation/s to\nmanager\n4.1\nReport on recommendations is prepared.\n4.2\nRecommendations are presented to appropriate\npersonnel.\n4.3\nRecommendations are followed-up, if required.\n\n--- PDF PAGE 14 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC III Promulgated: Nov. 25, 2010\n12\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Analytical techniques\n1.1\nBrainstorming\n1.2\nIntuitions/Logic\n1.3\nCause and effect diagrams\n1.4\nPareto analysis\n1.5\nSWOT analysis\n1.6\nGant chart, Pert CPM and graphs\n1.7\nScattergrams\n2. Problem\n2.1\nNon – routine process and quality problems\n2.2\nEquipment selection, availability and failure\n2.3\nTeamwork and work allocation problem\n2.4\nSafety and emergency situations and incidents\n3. Action plans\n\n3.1\nPriority requirements\n3.2\nMeasurable objectives\n3.3\nResource requirements\n3.4\nTimelines\n3.5\nCo-ordination and feedback requirements\n3.6\nSafety requirements\n3.7\nRisk assessment\n3.8\nEnvironmental requirements\n\n--- PDF PAGE 15 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC III Promulgated: Nov. 25, 2010\n13\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nIdentified the problem.\n1.2\nDetermined the fundamental causes of the problem.\n1.3\nDetermined the correct / preventive action.\n1.4\nProvided recommendation to manager.\nThese aspects may be best assessed using a range\nof scenarios / case studies / what ifs as a stimulus\nwith a walk through forming part of the response.\nThese assessment activities should include a range\nof problems, including new, unusual and improbable\nsituations that may have happened.\n2. Underpinning\nknowledge and\nattitudes\n2.1\nCompetence includes a thorough knowledge and\nunderstanding of the process, normal operating\nparameters, and product quality to recognize non-\nstandard situations\n2.2\nCompetence to include the ability to apply and\nexplain, sufficient for the identification of fundamental\ncause, determining the corrective action and provision\nof recommendations\n2.2.1 Relevant equipment and operational processes\n2.2.2 Enterprise goals, targets and measures\n2.2.3 Enterprise quality, OHS and environmental\nrequirement\n2.2.4 Principles of decision making strategies and\ntechniques\n2.2.5 Enterprise information systems and data\ncollation\n2.2.6 Industry codes and standards\n3. Underpinning skills\n3.1\nUsing range of formal problem solving techniques\n3.2\nIdentifying and clarifying the nature of the problem\n3.3\nDevising the best solution\n3.4\nEvaluating the solution\n3.5\nImplementation of a developed plan to rectify the\nproblem\n4. Resource\nimplications\n4.1\nAssessment will require access to an operating plant\nover an extended period of time, or a suitable method\nof gathering evidence of operating ability over a range\nof situations. A bank of scenarios / case studies /\nwhat ifs will be required as well as bank of questions\nwhich will be used to probe the reason behind the\nobservable action.\n\n--- PDF PAGE 16 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC III Promulgated: Nov. 25, 2010\n14\n\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1\nCase studies on solving problems in the workplace\n5.2\nObservation\nThe unit will be assessed in a holistic manner as is\npractical and may be integrated with the assessment\nof other relevant units of competency. Assessment\nwill occur over a range of situations, which will include\ndisruptions to normal, smooth operation. Simulation\nmay be required to allow for timely assessment of\nparts of this unit of competency. Simulation should be\nbased on the actual workplace and will include walk\nthrough of the relevant competency components.\n6. Context of\nassessment\n6.1\nIn all workplace, it may be appropriate to assess this\nunit concurrently with relevant teamwork or operation\nunits.\n\n--- PDF PAGE 17 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC III Promulgated: Nov. 25, 2010\n15\nUNIT OF COMPETENCY :\nUSE MATHEMATICAL CONCEPTS AND\nTECHNIQUES\n\nUNIT CODE\n:\n500311113\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes\nrequired in the application of mathematical\nconcepts and techniques.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Identify mathematical\ntools and techniques\nto solve problem\n1.1\nProblem areas are identified based on given condition\n1.2\nMathematical techniques are selected based on the\ngiven problem\n\n2. Apply mathematical\nprocedure/solution\n2.1\nMathematical techniques are applied based on the\nproblem identified\n2.2\nMathematical computations are performed to the level\nof accuracy required for the problem\n2.3\nResults of mathematical computation is determined\nand verified based on job requirements\n3. Analyze results\n3.1\nResult of application is reviewed based on expected\nand required specifications and outcome\n3.2\nAppropriate action is applied in case of error\n\n--- PDF PAGE 18 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC III Promulgated: Nov. 25, 2010\n16\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Mathematical\ntechniques\nMay include but are not limited to:\n1.1\nFour fundamental operations\n Measurements\n1.2\nUse/Conversion of units of measurements\n1.3\nUse of standard formulas\n2. Appropriate action\n2.1\nReview in the use of mathematical techniques (e.g.\nrecalculation, re-modeling)\n2.2\nReport error to immediate superior for proper action\n\n--- PDF PAGE 19 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC III Promulgated: Nov. 25, 2010\n17\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nIdentified, applied and reviewed the use of\nmathematical concepts and techniques to workplace\nproblems\n2. Underpinning\nknowledge and\nattitudes\n2.1\nFundamental operation (addition, subtraction,\ndivision, multiplication)\n2.2\nMeasurement system\n2.3\nPrecision and accuracy\n2.4\nBasic measuring tools/devices\n3. Underpinning skills\n3.1\nApplying mathematical computations\n3.2\nUsing calculator\n3.3\nUsing different measuring tools\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nCalculator\n4.2\nBasic measuring tools\n4.3\nCase Problems\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1\nAuthenticated portfolio\n5.2\nWritten Test\n5.3\nInterview/Oral Questioning\n5.4\nDemonstration with questioning\n6. Context of\nAssessment\n6.1\nCompetency may be assessed in the work place or in\na simulated work place setting\n\n--- PDF PAGE 20 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC III Promulgated: Nov. 25, 2010\n18\nUNIT OF COMPETENCY :\nUSE RELEVANT TECHNOLOGIES\n\nUNIT CODE\n:\n500311114\n\nUNIT DESCRIPTOR\n:\nThis unit of competency covers the knowledge,\nskills, and attitude required in selecting, sourcing\nand\napplying\nappropriate\nand\naffordable\ntechnologies in the workplace.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Study/select\nappropriate\ntechnology\n\n 1.1\nUsage of different technologies is determined based\non job requirements\n1.2.\nAppropriate technology is selected as per work\nspecification\n2. Apply relevant\ntechnology\n\n2.1\nRelevant technology is effectively used in carrying\nout function\n2.2\nApplicable software and hardware are used as per\ntask requirement\n2.3\nManagement concepts are observed and practiced\nas per established industry practices\n3. Maintain/enhance\nrelevant technology\n3.1\nMaintenance of technology is applied in accordance\nwith the industry standard operating procedure,\nmanufacturer’s operating guidelines and\noccupational health and safety procedure to\nensure its operative ability\n3.2\nUpdating of technology is maintained through\ncontinuing education or training in accordance with\njob requirement\n3.3\nTechnology failure/ defect is immediately reported to\nthe concern/responsible person or section for\nappropriate action\n\n--- PDF PAGE 21 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC III Promulgated: Nov. 25, 2010\n19\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Technology\nMay include but are not limited to:\n1.1\nOffice technology\n1.2\nIndustrial technology\n1.3\nSystem technology\n1.4\nInformation technology\n1.5\nTraining technology\n2. Management\nconcepts\nMay include but not limited to:\n2.1\nReal Time Management\n2.2\nKAIZEN or continuous improvement\n2.3\n5 S\n2.4\nTotal Quality Management\n2.5\nOther management/productivity tools\n3. Industry standard\noperating procedure\n3.1\nWritten guidelines relative to the usage of office\ntechnology/equipment\n3.2\nVerbal advise/instruction from the co-worker\n4. Manufacturer’s\noperating guidelines/\ninstructions\n4.1\nWritten instruction/manuals of specific\ntechnology/equipment\n4.2\nGeneral instruction manual\n4.3\nVerbal advise from manufacturer relative to the\noperation of equipment\n5. Occupational health\nand safety procedure\n5.1\nRelevant statutes on OHS\n5.2\nCompany guidelines in using technology/equipment\n6. Appropriate action\n6.1\nImplementing preventive maintenance schedule\n6.2\nCoordinating with manufacturer’s technician\n\n--- PDF PAGE 22 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC III Promulgated: Nov. 25, 2010\n20\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\n\nAssessment requires evidence that the candidate:\n1.1\nStudied and selected appropriate technology\nconsistent with work requirements\n1.2\nApplied relevant technology\n1.3\nMaintained and enhanced operative ability of relevant\ntechnology\n2. Underpinning\nknowledge and\nattitudes\n2.1\nAwareness on technology and its function\n2.2\nRepair and maintenance procedure\n2.3\nOperating instructions\n2.4\nApplicable software\n2.5\nCommunication techniques\n2.6\nHealth and safety procedure\n2.7\nCompany policy in relation to relevant technology\n2.8\nDifferent management concepts\n2.9\nTechnology adaptability\n3. Underpinning skills\n3.1\nRelevant technology application/implementation\n3.2\nBasic communication skills\n3.3\nSoftware applications skills\n3.4\nBasic troubleshooting skills\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nRelevant technology\n4.2\nInterview and demonstration questionnaires\n4.3\nAssessment packages\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1\nInterview\n5.2\nActual demonstration\n5.3\nAuthenticated portfolio (related certificates of\ntraining/seminar)\n6. Context of\nassessment\n6.1\nCompetency may be assessed in actual workplace or\nsimulated environment\n\n--- PDF PAGE 23 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC III Promulgated: Nov. 25, 2010\n21\n\nCOMMON COMPETENCIES\n\nUNIT OF COMPETENCY :\n\nOBSERVE PROCEDURES, SPECIFICATIONS\nAND MANUALS OF INSTRUCTIONS\nUNIT CODE :\nCON311202\nUNIT DESCRIPTOR :\nThis unit covers the knowledge, skills and attitudes\nin identifying, interpreting, applying services in\naccordance with specifications and manuals, and\nstorage of manuals.\nELEMENT\nPERFORMANCE CRITERIA\nBold and Italicized terms are elaborated in the Range of Variables\n1. Identify and access\nspecification /\nmanuals\n\n1.1 Appropriate manuals are identified and accessed\nas per job requirements.\n1.2 Version and date of manual are checked to ensure\nthat correct specification and procedure are\nidentified.\n2. Interpret manuals\n\n2.1 Relevant\nsections/\nchapters\nof\nspecifications/manuals are accessed in relation to\nthe work to be conducted.\n2.2 Information and procedure/s in the manual are\ninterpreted in accordance with current industry\npractices.\n3. Apply information in\nmanual\n3.1 Manual\nis\ninterpreted\naccording\nto\njob\nrequirements and in accordance with current\nindustry practices.\n3.2 Work steps are correctly identified in accordance\nwith manufacturer’s specification.\n3.3 (Manual) Data in the manual data are applied\naccording to the given task.\n3.4 All correct sequencing and adjustments are\ninterpreted\nin\naccordance\nwith\ninformation\ncontained on the manual or in accordance with\nspecifications.\n4. Store manuals\n4.1 Manual or specifications are stored appropriately to\nensure prevention of damage, ready access and\nupdating\nof\ninformation\nwhen\nrequired\nin\naccordance with company requirements and\ncurrent industry practices.\n\n--- PDF PAGE 24 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC III Promulgated: Nov. 25, 2010\n22\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Procedures,\nSpecifications and\nManuals of\ninstructions\n\nKinds of Manuals:\n1.1 Manufacturer’s Specification Manual\n1.2 Periodic Maintenance Manual\n1.3 Maintenance Procedure Manual\n1.4 Repair Manual\n\n--- PDF PAGE 25 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC III Promulgated: Nov. 25, 2010\n23\nEVIDENCE GUIDE\n\n1. Critical aspects\nof competency\nAssessment requires evidence that the candidate:\n1.1 Identified and accessed specification/manuals as per job\nrequirements.\n1.2 Interpreted manuals in accordance with industry practices.\n1.3 Applied information in manuals according to the given\ntask.\n1.4 Stored manuals in accordance with company\nrequirements.\n2. Underpinning\nKnowledge\n2.1 Type of manuals used in the Decorative Crafts (Jewelry)\nSector\n2.2 Identification of symbols used in the manuals\n2.3 Identification of units of measurements\n2.4 Unit/s of conversion\n3. Underpinning\nSkills\n3.1 Reading and comprehension skills required to identify and\ninterpret decorative crafts (jewelry) manuals and\nspecifications\n3.2 Accessing information and data\n4. Resource\nImplications\nThe following resources should be provided:\n4.1 All manuals/catalogues relative to the decorative crafts\n(jewelry) sector\n5. Methods of\nAssessment\nCompetency in this unit must be assessed through:\n5.1 Direct observation\n5.2 Questions/Interview\n6. Context for\nAssessment\n6.1 Competency assessment must be undertaken in\naccordance with the endorsed TESDA assessment\nguidelines\n6.2 Assessment may be conducted in the workplace or\nsimulated environment\n\n--- PDF PAGE 26 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC III Promulgated: Nov. 25, 2010\n24\n\nUNIT OF COMPETENCY :\nPERFORM MENSURATIONS AND CALCULATIONS\nUNIT CODE :\nCON311203\nUNIT DESCRIPTOR :\nThis unit covers the knowledge, skills and attitudes in\nidentifying and measuring objects based on the\nrequired performance standards.\n\nELEMENT\nPERFORMANCE CRITERIA\nBold and Italicized terms are elaborated in the Range of Variables\n1. Select measuring\ninstrument\n\n1.1 Object/design or component to be measured is\nidentified, classified and interpreted in accordance with\nthe appropriate geometric shape/s.\n1.2 Measuring tools are selected/identified as per\nobject/design to be measured or job requirements\n1.3 Correct design and specifications are obtained from\nrelevant sources.\n1.4 Appropriate measuring instruments are selected\naccording to job requirements\n1.5 Alternative measuring tools are used without sacrificing\ncost and quality of work.\n2. Carry out\nmeasurements and\ncalculations\n\n2.1 Accurate measurements are obtained according to job\nrequirements.\n2.2 Alternative measuring tools are used without sacrificing\ncost and quality of work.\n2.3 Calculation needed to complete work tasks are\nperformed using four basic process of addition (+),\nsubtraction (-) multiplication (x) and division(/) including\nbut not limited to\ntrigonometric functions, algebraic computations\n2.4 Calculations involving fractions, percentages and mixed\nnumbers are used to complete workplace tasks.\n2.5 Numerical computation is self-checked and corrected\nfor accuracy.\n2.6 Instruments are read to the limit of accuracy and\nprecision of the tool used.\n2.7 Systems of measurement are identified and converted\naccording to job requirements/ISO\n2.8 Work pieces are measured according to job\nrequirements.\n\n--- PDF PAGE 27 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC III Promulgated: Nov. 25, 2010\n25\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Geometric shape\nIncluding but not limited to:\n1.1 Round\n1.2 Square\n1.3 Rectangle\n1.4 Triangle\n1.5 Sphere\n1.6 Cone\n2. Measuring\ninstruments\nIncluding but not limited to:\n2.1 tape measure\n2.2 various calipers\n2.3 weighing scale\n2.4 densimeter\n2.5 ruler\n2.6 micrometer\n3. Measurements and\ncalculations\nIncluding but not limited to:\n3.1 size\n3.2 width\n3.3 length\n3.4 weight\n3.5 area\n3.6 volume\n3.7 diameter\n3.8 thickness\n3.9 angle/s\n\n--- PDF PAGE 28 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC III Promulgated: Nov. 25, 2010\n26\n EVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Selected and prepared appropriate measuring\ninstruments in accordance with job requirements\n1.2 Performed measurements and calculations according to\njob requirements/ISO\n2. Underpinning\nknowledge\n2.1 TRADE MATHEMATICS/MENSURATION\n2.1.1 Four fundamental operation\n2.1.2 Linear measurement\n2.1.3 Dimensions\n2.1.4 Unit conversion\n2.1.5 Ratio and proportion\n2.1.6 Trigonometric functions\n2.1.7 Algebraic equations\n3. Underpinning\nskills\n3.1 Performing mensuration and calculation by addition,\nsubtraction, multiplication and division: trigonometric\nfunctions and algebraic equations\n3.2 Visualizing objects and shapes\n3.3 Interpreting and using appropriate formula(s) for volume,\nareas, perimeters of plane and geometric figures\n3.4 Proper handling and storing of measuring instruments\n4. Resource\nimplications\nThe following resources should be provided:\n4.1 Workplace location\n4.2 Problems to solve\n4.3 Measuring instrument/s appropriate to carry out tasks\n4.4 Instructional materials relevant to the proposed activity\n5. Methods of\nassessment\nCompetency in this unit must be assessed through:\n5.1 Direct observation/Actual test.\n5.2 Questions/Interview\n6. Context for\nassessment\n6.1 Competency assessment must be undertaken in\naccordance with the endorsed TESDA assessment\nguidelines\n6.2 Assessment may be conducted in the workplace or in a\n(simulated) similar environment\n\n--- PDF PAGE 29 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC III Promulgated: Nov. 25, 2010\n27\nUNIT OF COMPETENCY :\nMANAGE OWN PERFORMANCE\nUNIT CODE\n:\nHCS516202\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes\nrequired in effectively managing one’s workload\nand quality of work.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Plan for\ncompletion of own\nworkload\n\n1.1\nTasks accurately identified\n1.2\nPriority allocated to each task\n1.3\nTime lines allocated to each task or series of tasks\n1.4\nTasks deadlines known and complied with whenever\npossible\n1.5\nWork schedules are known and completed within\nagreed time frames\n1.6\nWork plans developed according to assignment\nrequirements and employer policy\n1.7\nUncompleted work or tasks detailed and responsibility\nfor completion passed to incoming shift or other\nappropriate persons\n2. Maintain quality of\nown performance\n2.1\nPersonal performance continually monitored against\nagreed performance standards\n2.2\nAdvice and guidance sought when necessary to achieve\nor maintain agreed standards\n2.3\nGuidance from management applied to achieve or\nmaintain agreed standards\n2.4\nStandard of work clarified and agreed according to\nemployer policy and procedures\n3. Build credibility\nwith\ncustomers/clients\n3.1\nClient expectations for reliability, punctuality and\nappearance adhered to\n3.2\nPossible causes of client/customer dissatisfaction\nidentified, dealt with and recorded according to\nemployer policy\n3.3\nClient fully informed of all relevant security matters in a\ntimely manner and according to agreed reporting\nprocedures\n\n--- PDF PAGE 30 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC III Promulgated: Nov. 25, 2010\n28\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Tasks\n\n1.1\nMay identified through:\n1.1.1 Assignment instructions\n1.1.2 Verbal Instructions by senior officer\n1.1.3 Policy Documents\n1.1.4 Duty Statements\n1.1.5 Self Assessment\n1.2 May be:\n1.2.1 Daily tasks\n1.2.2 Weekly tasks\n1.2.3 Regularly or irregularly occurring tasks\n2. Performance\nStandards\nMay include:\n2.1\nAssignment/Instructions\n2.2\nProcedures established in policy documents\n\n--- PDF PAGE 31 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC III Promulgated: Nov. 25, 2010\n29\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nPlanned for completion of own workload\n1.2\nAssessed verbal or written work plan through observation\nand discussion of site and employer requirements\n1.3\nDemonstrated capacity to complete task within specified\ntime frame\n1.4\nMaintained quality of own performance\n2. Underpinning\nknowledge and\nattitudes\n2.1\nSite and assignment requirements\n2.2\nEmployer policy on performance management\n2.3\nIndicators of appropriate performance for each area of\nresponsibility\n2.4\nSteps for improving or maintaining performance\n3. Underpinning\nskills\n3.1\nCapacity to plan and prioritize security work loads and\nrequirements\n3.2\nTime and task management\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nAssessment Centers/Venues\n4.2\nAccredited Assessors\n4.3\nModes of Assessment\n4.4\nEvaluation Reports\n4.5\nAccess to a relevant venue, equipment and materials\n4.6\nAssignment Instructions\n4.7\nLogbooks\n4.8\nOperational manuals and makers’/customers’\ninstructions (if relevant)\n4.9\nAssessment Instruments, including personal planner and\nassessment record book\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1\nWritten Test/Examination\n5.2\nDemonstration with questioning\n5.3\nObservation with questioning\n6. Context of\nassessment\n6.1 Competency assessment must be undertaken in\naccordance with the endorsed TESDA assessment\nguidelines\n6.2 Assessment may be conducted in the workplace or in a\n(simulated) similar environment\n\n--- PDF PAGE 32 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC III Promulgated: Nov. 25, 2010\n30\nUNIT OF COMPETENCY : APPLY BASIC FIRST AID\nUNIT CODE\n:\nHCS323203\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes\nrequired to provide an initial response where First\nAid is required. In this unit it is assumed that the\nFirst Aider is working under supervision and / or\naccording to established workplace First Aid\nprocedures and policies\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Assess the situation\n1.1\n Physical hazards to self and casualty’s health\nand safety are identified.\n1.2\nImmediate risks to self and casualty’s\noccupational health and safety (OSH )are\nminimized by controlling the hazard in\naccordance with OSH requirements.\n1.3\nCasualty’s vital signs and physical condition are\nassessed in accordance with workplace\nprocedures.\n2. Apply basic first aid\ntechniques\n2.1\nFirst\nAid\nmanagement\nis\nprovided\nin\naccordance\nwith\nestablished\nFirst\nAid\nprocedures.\n2.2\nCasualty is reassured in a caring and calm\nmanner and made comfortable using available\nresources.\n2.3\nFirst Aid assistance is sought from others in a\ntimely manner and as appropriate.\n2.4\nCasualty’s\ncondition\nis\nmonitored\nand\nresponded to in accordance with effective First\nAid principles and workplace procedures.\n2.5\nDetails of casualty’s physical condition, changes\nin conditions, management and response are\naccurately recorded in line with organizational\nprocedures.\n2.6\nCasualty management is finalized according to\nhis/her needs and First Aid principles.\n\n--- PDF PAGE 33 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC III Promulgated: Nov. 25, 2010\n31\n\n3. Communicate details\nof the incident\n3.1\nAppropriate medical assistance is requested\nusing relevant communication media and\nequipment.\n3.1\nDetails of casualty’s condition and management\nactivities are accurately conveyed to emergency\nservices/relieving personnel.\n3.2\nReports to supervisors are prepared in a timely\nmanner, presenting all relevant facts according\nto established company procedures.\n\n--- PDF PAGE 34 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC III Promulgated: Nov. 25, 2010\n32\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. First Aid\nManagement\nThis may include but not limited to:\n1.1\nWorkplace policies and procedures\n1.2\nIndustry/site specific regulations, codes\n1.3\nOSH\n1.4\nState and territory workplace health and safety\nrequirements\n1.5\nAllergies the casualty may have\n2. Physical Hazards\nPhysical hazards may include:\n2.1\nWorkplace hazards\n2.2\nEnvironmental hazards\n2.3\nProximity of other people\n2.4\nHazards associated with casualty management\nprocesses\n3. Risks\nRisks may include:\n3.1\nWorksite equipment, machinery and substances\n3.2\nEnvironmental risks\n3.3\nBodily fluids\n3.4\nRisk of further injury to the casualty\n3.5\nRisk associated with the proximity of the others\nand bystanders\n4. Casualty’s Condition\nCasualty’s condition may include but not limited to the\nfollowing:\n4.1\nAbdominal injuries\n4.2\nAllergic reactions\n4.3\nBleeding\n4.4\nBurns-thermal, chemical, friction, electrical\n4.5\nCardiac conditions\n4.6\nChemical contamination\n4.7\nCod injuries\n4.8\nCrush injuries\n4.9\nDislocations\n4.10 Drowning\n4.11 Eye injuries\n4.12 Fractures\n\n--- PDF PAGE 35 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC III Promulgated: Nov. 25, 2010\n33\nVARIABLE\nRANGE\n4.13 Head injuries\n4.14 Epilepsy\n4.15 Minor skin injuries\n4.16 Neck and spinal injuries\n4.17 Needle stick injuries\n4.18 Poisoning and toxic substances\n4.19 Shock\n4.20 Smoke inhalation\n5. Equipment and\nResources\nEquipment and other resources may include:\n5.1\nDefibrillation units\n5.1\nPressure bandages\n5.2\nThermometers\n5.3\nFirst Aid kit\n5.4\nEyewash\n5.5\nThermal blankets\n5.6\nPocket face masks\n5.7\nRubber gloves\n5.8\nDressing\n5.9\nSpace device\n5.10 Cervical collars\n6. Communication\nsystem\n6.1\nMobile phone\n6.2\nSatellite phones\n6.3\nHF/VHF radio\n6.4\nFlags\n6.5\nFlares\n6.6\nTwo - way radio\n6.7\nEmail\n6.8\nElectronic equipment\n7. Vital signs\n7.1\nBreathing\n7.2\nCirculation\n7.3\nConsciousness\n8. First Aid Principles\n8.1\nChecking the site for danger to self, casualty’ and\nothers and minimizing the danger\n8.2\nChecking and maintaining the casualty’s airways,\nbreathing and circulation\n\n--- PDF PAGE 36 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC III Promulgated: Nov. 25, 2010\n34\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nComplied with institutional requirements, OSH\nlaws infections control and manual handling\nprocedures and relevant health regulations\n1.2\nIdentified physical hazards of the casualty and\nminimized immediate risks\n1.3\nAssessed and monitored the physical condition of\nthe casualty\n1.4\nResponded to emergency using basic life support\nmeasures.\n1.5\nProvided initial response where First Aid is\nrequired\n1.6\nDealt with complex casualties or incident\n1.7\nPrepared reports to concerned personnel in a\ntimely manner\n2. Underpinning\nknowledge\n2.1\nBasic anatomy and physiology\n2.2\nCompany standard operating procedures (SOPs)\n2.3\nDealing with confidentiality\n2.4\nKnowledge of the First Aiders’ skills limitations\n2.5\nOSH legislation and regulations\n2.6\nHow to gain access to and interpret material\nsafety data sheets\n3. Underpinning skills\n3.1\nResuscitation\n3.2\nSafe manual handling of casualty\n3.3\nConsideration of the welfare of the casualty\n3.4\nReport preparation\n3.5\nCommunication skills\n3.6\nAbility to interpret and use listed documents\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nAccess to relevant work station\n4.2\nRelevant institutional policies, guidelines\nprocedure and protocol\n4.3\nEquipment and materials relevant to the\nproposed activities\n\n--- PDF PAGE 37 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC III Promulgated: Nov. 25, 2010\n35\n\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1\nDemonstration with questioning\n5.2\nInterview\n5.3\nThird Party Report\n5.4\nPortfolio\n6. Context of\nassessment\n6.1\nAssessment may be done in a workplace or\nsimulated work area setting.\n\n--- PDF PAGE 38 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC III Promulgated: Nov. 25, 2010\n36\n\nUNIT TITLE:\nAPPLY QUALITY STANDARDS\nUNIT CODE:\nICT315202\nUNIT DESCRIPTOR:\nThis unit covers the knowledge, skills, attitudes required to\napply quality standards in the workplace. The unit also\nincludes the application of relevant safety procedures and\nregulations, organization procedures and customer\nrequirements.\n\nELEMENT\n\nPERFORMANCE CRITERIA\nBold and Italicized terms are elaborated in the Range of Variables\n1. Assess quality of\n received materials or\n components\n1.1 Received materials or component parts are checked\n based on material specifications\n1.2 Defective material or components are identified and\n isolated following standard operating procedures\n1.3 Defective materials or components are replaced in\n accordance with workplace procedures.\n2. Assess own work\n2.1 Documents relative to quality within the company is\n identified and used\n2.2 Completed work is checked based on workplace standards\n relevant to the task undertaken\n2.3 In cases of deviations from specified quality standards,\n causes are documented and reported in accordance with\n the workplace’ standards operating procedures\n3. Engage in process\n improvement\n3.1 Process improvement procedures are participated in\n relation to workplace assignment\n3.2 Work is carried out in accordance with process\n improvement procedures\n3.3 Performance of operation or quality of product or service is\n monitored in accordance to customer satisfaction\n\n--- PDF PAGE 39 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC III Promulgated: Nov. 25, 2010\n37\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Materials /\n components\nMay include but not limited to:\n1.1 Electrical materials and consumables\n1.2 Welding materials and consumables\n1.3 Furniture making materials and consumables\n1.4 Carpentry materials and consumables\n1.5 Masonry materials and consumables\n1.6 Heavy equipment materials and consumables\n2. Defective\nMay include but not limited to:\n2.1 Components / materials do not conform to specification\n2.2 Components / materials containing manufacturing defects\n2.3 Components / materials do not conform with government\n regulation i.e., PEC, environmental code\n2.4 Components / materials possessed safety defects\n3. Documents\nMay include but not limited to:\n3.1 Organization work procedures / reports\n3.2 Manufacturer’s instruction manual\n3.3 Customer requirements\n3.4 Forms\n4. Quality standards\nMay include but not limited to:\n4.1 Materials / consumables\n4.2 Component parts\n4.3 Final product\n4.4 Production processes\n4.5 Methods\n5. Customer\nMay include but not limited to:\n5.1 Co-worker\n5.2 Supplier\n5.3 Client\n5.4 Organization receiving the product or service\n\n--- PDF PAGE 40 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC III Promulgated: Nov. 25, 2010\n38\nEVIDENCE GUIDE\n1. Critical aspect of\n competency\nAssessment must show that the candidate:\n1.1 Demonstrates ability to follow company’s standard\n operating procedures\n1.2 Demonstrates knowledge of types and uses of materials\n and component parts\n1.3 Demonstrates knowledge of quality standards\n1.4 Demonstrates ability to follow process improvement\n procedures\n2. Underpinning\n knowledge\n2.1 Production processes\n2.2 Types and uses of materials and components\n2.3 Company standard operating procedures\n2.4 Safety practices and applications\n3. Underpinning skills\n3.1 Following production processes\n3.2 Checking of materials and component parts and finished\n products\n3.3 Following company standard operating procedures\n3.4 Applying safety practices\n4. Method of\n assessment\n4.1 Observation of practical skills\n4.2 Oral questions\n5. Resource implication\n\nThe following materials must be provided:\n5.1 Materials and component parts relevant to the activity\n5.2 Documents related to quality\n6. Context of\n Assessment\n6.1 Assessment may be conducted in the workplace or in a\n simulated environment.\n\n--- PDF PAGE 41 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC III Promulgated: Nov. 25, 2010\n39\nCORE COMPETENCIES\n\nUNIT OF COMPETENCY: FABRICATE MULTI-PARTS JEWELRY\n\nUNIT CODE : DCJ731305\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes\nin fabricating multi-parts jewelry of fine jewelry.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Prepare\nrequirements for\nfabrication\n\n1.1 Jewelry design construction, dimension, composition\ncharacteristic and finishing requirements are\nestablished from predetermined specifications in\naccordance with client requirements and\norganizational standard\n1.2 Fabrication and finish specifications and required\noutcomes as indicated in the prescribed form are\nconfirmed and clarified as necessary with\nappropriate person(s) and in accordance with\norganizational and client requirements\n1.3 Appropriate preparation and fabrication\ntechniques are established in accordance with in\naccordance with job requirements and organizational\nprocedures\n1.4 Fabrication and finishing activities are prioritized in\naccordance with designated timeframes,\norganizational and specific design requirements\n1.5 Tools, machineries and equipment are selected,\nrequested and checked for operational effectiveness\nin accordance with the manufacturer’s specification\nand organizational procedures.\n1.6 Materials and consumables are also selected,\nrequested and obtained in accordance with\norganizational requirements and in consultation with\nappropriate person/s\n1.7 Material preparation is conducted using safe\noperating practices and protective equipment, in\naccordance with OHS and organizational\nrequirements\n\n--- PDF PAGE 42 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC III Promulgated: Nov. 25, 2010\n40\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n2. Perform fabrication\n\n2.1 Pre-formed multi-parts materials are fabricated to\nproduce components using applicable fabrication\nactivities in accordance with OH&S, organizational\nand industry accepted methods\n2.2 Fabricated item is checked to ensure construction\nconforms with required specifications and quality,\napplicable to industry organizational standard\n2.3 When necessary, defective items are\nreworked/retouched in accordance with specifications\nand organizational procedures\n2.4 Proper care in handling and accounting of materials is\nstrictly observed to ensure that quality and quantity is\nfollowed in accordance with the organizational\nrequirements\n3. Perform post-\nfabrication activities\n3.1 Documentation completed and processed in\naccordance with organizational requirements and\nstandards\n3.2 Finished product is quality checked for dimension\nand construction in accordance with clients’\nspecifications and organizational requirements\n3.3 Unused/excess materials of same kind and quality are\nmelted together for proper re-testing of its quality and\nquantity as required by organizational procedures and\nsubmitted to issuing personnel for storage and\nsafekeeping\n3.4 Notification of work completion is made to appropriate\nperson(s) in accordance with organizational\nprocedures\n3.5 Work area, tools and equipment are cleaned and\nstored in accordance with OHS and organizational\nrequirements\n\n--- PDF PAGE 43 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC III Promulgated: Nov. 25, 2010\n41\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Appropriate\nperson(s)\nMay include but are not limited to:\n1.1 Supervisor\n1.2 Quality Control Personnel\n1.3 Designer\n2. Appropriate\npreparation and\nfabrication\ntechniques\nMay include but are not limited to:\n2.1 Gemstones are pre-positioned to develop an imaginary\npicture of the jewelry to be fabricated\n2.2 Appropriate pre-fabricated materials and components\nare prepared, selected, requested and obtain from the\nissuing officer\n2.3 Gemstones are calibrated using precision devices for\nproper construction of holders on its mounting.\n2.4 Necessary patterns for cut out parts are develop\n2.5 Design modification is often suggested for better\nappearance of the design especially with multiple\nnumbers of bigger sizes of stone\n2.6 Type of bezel to hold smaller gems are prepared and\nselected to ensure best appearance for the required\ndesign.\n2.7 Tools, machineries and equipment are selected and\nprepared to ensure the smooth flow of work\n2.8 Required materials are requested and obtained to start\nthe process\n2.9 Size replica of bigger stones are made to avoid accident\nof loss and damage during the process... these materials\nare entrusted to issuing person properly for safe keeping\nwhile it is readily available in cases of needs\n3. Fabrication and\nfinishing activities\nMay include but are not limited to:\n3.1 Make mounting for major gemstone(s)\n3.2 Make mountings for lesser size gem.\n3.3 Cut, shape, file and detail part required in the\n Design\n3.4 Assemble top portion of the item by soldering parts\ntogether\n3.5 Make appropriate shank, clips, and other parts required\nto its function...\n3.6 Re-check sizes, thickness, height and other specification\n3.7 Pre-polish major parts before final assembly\n3.8 Seek second opinion. from appropriate person(s) before\nfinal assembly\n3.9 De-oxidize item\n3.10 Fine finish items using finer grit sand paper\n\n--- PDF PAGE 44 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC III Promulgated: Nov. 25, 2010\n42\n\nVARIABLE\nRANGE\n\n3.11 Present finished product to proper personnel for quality\ninspection.\n3.12 Re-melt left over (filings, small cuttings, unused tiny\nparts) metal materials ensuring that no other metal was\nmix to guarantee maintenance of the quality of metal(s)\n4.\nTools,\nmachineries\n and equipment\nMay include but not limited to:\nHand tools\n4.1 Measuring devises\n4.2 Different Jewelers’ pliers\n4.3 Jewelers’ saw\n4.4 Set of files\n4.5 Set of needle files\n4.6 Sear\n4.7 Tweezers\n4.8 Ball hammers\n4.9 Rawhide or wood mallet\n4.10 Ring mandrel\n4.11 Assorted rubber wheels with mandrels\n Equipment and Machineries\n4.12 Work bench\n4.13 Anvil\n4.14 Melting and soldering blow torch\n4.15 Roll press\n4.16 Motor with flexible shaft\n5. Materials\nMay include but not limited to:\n5.1 Precious metals\n 5.1.1 Gold\n 5.1.2 Silver\n5.2 Non- precious base metals\n 5.2.1 Copper Nickel\n 5.2.2 Zinc\n 5.2.3 Brass\n5.3 Precious and/or Non- precious gemstones\n5.4 Non-traditional materials for jewelry making e.g.\n Leather, sea shells, woods etc….\n\n--- PDF PAGE 45 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC III Promulgated: Nov. 25, 2010\n43\n\nVARIABLE\nRANGE\n6. Consumables\nMay include but not limited to:\n6.1 Chemicals\n 6.1.1 Borax\n 6.1.2 Boric Acid\n 6.1.3 Potassium Nitrate\n 6.1.4 Alum\n6.2 Supplies\n 6.2.1 Fuel\n 6.2.2 Emery paper\n 6.2.3 Solder\n 6.2.4 Burs\n 6.2.5 Drill bits\n7. Material\npreparation\nMay include but not limited to:\n7.1 Anneal pre-fabricated materials, e.g. tube, wires,\n Sheets etc…\n7.2 Test ready made components and pars ensuring\n proper quality\n7.3 Pre-alloyed metals:\n 7.3.1 Carefully check its weight,\n 7.3.2 Test its quality\n 7.3.3 Place in crucible with sufficient flux\n 7.3.4 Fuse all metals into complete liquid stage for sheet\n preparation requirements\n7.4 Pure metals\n 7.4.1 Ask help from appropriate person to do the\n alloying\n 7.4.2 Do the task on 7.1\n7.5 De- oxidize metal after annealing and before and\n after soldering\n7.6 Work area is free of other non ferrous metals to\n avoid contamination to materials (metals)\n8. Documentation\nMay include but are not limited to:\n8.1 Job Order form\n8.2 Work instructions and procedures\n8.3 Materials and consumables used\n8.4 Time and record sheets\n8.5 Unused/excess materials\n\n--- PDF PAGE 46 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC III Promulgated: Nov. 25, 2010\n44\n\nEVIDENCE GUIDE\n\n1. Critical Aspects\nof Competency\n\nAssessment requires evidence that the candidate:\n1.1\nIdentified and established fabrication requirements for\ndifferent multi-parts(traditional and non-traditional) design of\njewelry requirements based from predetermined\nspecifications in accordance with organizational and client\nrequirements\n1.2\nSelected and obtained tools, equipment, materials and\nconsumables with appropriate person/s in accordance with\norganizational and OH&S requirements\n1.3\nPerformed fabrication in accordance with OH&S,\norganizational and industry accepted methods\n1.4\nFabricated items are checked for quality and to ensure\nconstruction conforms with required specifications and\norganizational requirements and standards\n1.5\nWhen necessary, reworked/retouched defective items in\naccordance with specifications and organizational\nprocedures\n1.6\nChecked finished product for quality, dimension and\nconstruction in accordance with client’s specifications and\norganizational requirements\n1.7\nNotified work completion to appropriate person/s in\naccordance with organizational procedures\n1.8\nCleaned and stored work area, tools and equipment in\naccordance with OHS and organizational requirements\n1.9\nUsed personal protective equipment (PPE) in accordance\nwith job requirements and OHS requirements\n1.10 Demonstrated knowledge on calculation and measurements\n2 Underpinning\nKnowledge\n2.1\nTypes of jewelry\n2.2\n Multi-parts jewelry fabrication and assembly\n2.3\nProperties of metals used in jewelry\n2.4\nBasic knowledge in tools, machineries and equipment, its\nusage and serviceability\n2.5\nRelevant materials and consumables used in jewelry\nfabrication\n2.6\nDesign interpretation and specification\n2.7\nPhilippine National Standard on jewelry\n2.8\nSafe work practices and procedures/OH & S requirements\n2.9\nAccounting of unused/excess materials\n2.10\nFirst-aid measures\n\n--- PDF PAGE 47 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC III Promulgated: Nov. 25, 2010\n45\n\n3. Underpinning\nSkills\n3.1 Following oral and written instructions.\n3.2 Reading and interpreting specification, illustrations and\ndrawings\n3.3 Measurements, weighing and calculation\n3.5 Ability to identify appropriate tools, machineries and\nequipment\n3.6 Applying manufacturing techniques\n3.7 Applying first-aid measures\n3.7 Applying safe working skills\n3.8 Identifying alternative metals\n4. Resource\nImplications\nThe following resources should be provided:\n4.1 Materials relevant to the activity\n4.2 Tools, machineries and equipment\n4.3 Consumables\n4.4 PPE\n4.5 Workplace\n4.6 Documentation\n4.7 Exhaust fan\n4.8 Fire extinguisher\n5. Method of\nAssessment\nCompetency in this unit must may be assessed through:\n5.1 Demonstration with oral questioning\n5.2 Portfolio (Training Certificates, Certificate of Employment,\nWork pieces, etc.)\n5.3 Third-Party Report\n6. Context of\nAssessment\n6.1 Competency may be assessed in the workplace or in a\n simulated work environment (TESDA Accredited Assessment\n Center)\n\n--- PDF PAGE 48 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC III Promulgated: Nov. 25, 2010\n46\nUNIT OF COMPETENCY : FABRICATE COMPLEX AND INTRICATELY\nDESIGNED JEWELRY\n\nUNIT CODE : DCJ731306\n\nUNIT DESCRIPTOR : This unit covers knowledge, skills and attitudes in\nfabricating fine jewelry with complex and intricate\ndesigns\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Prepare\nrequirements for\nfabrication\n1.1 Design fabrication system, techniques, process, and\nfinishing requirements are established from\npredetermined specifications in accordance with\norganizational and client requirements\n1.2 Fabrication and finish specifications and required\noutcomes as indicated in the prescribed form are\nconfirmed and clarified as necessary with appropriate\nperson(s) and in accordance with organizational and\nclient’s requirements\n1.3 Appropriate preparation and fabrication techniques\nare established in accordance with in accordance with\njob requirements and organizational procedures\n1.4 Fabrication and finishing activities are prioritized in\naccordance with designated timeframes, organizational\nand specific plating requirements\n1.5 Tools, machineries and equipment are selected,\nrequested and checked for operational effectiveness in\naccordance with the manufacturer’s specification and\norganizational procedures\n1.6 Materials and consumables are also selected,\nrequested and obtained in accordance with\norganizational requirements and in consultation with\nappropriate person(s)\n1.7 Material preparation is conducted using safe operating\npractices and protective equipment, in accordance with\nOHS and organizational requirements\n\n--- PDF PAGE 49 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC III Promulgated: Nov. 25, 2010\n47\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n2. Perform fabrication\n2.1 Pre-formed materials are fabricated to produce\ncomponents using applicable fabrication activities and\nsafe operating practices, protective equipment, and in\naccordance with OH&S, organizational and industry\naccepted methods\n2.2 Fabricated item is checked to ensure construction\nconforms with required specifications and quality,\napplicable to industry and organizational standards\n2.3 When necessary, defective items are\nreworked/retouched in accordance with specifications\nand organizational procedures\n2.4 Fabricated items are submitted to appropriate person(s)\nfor quality control in accordance with organizational\nrequirements and standards\n2.5 Proper care in handling of metals (materials) is strictly\nobserved to ensure the quality and quantity is followed\nin accordance with the organizational requirements\n3. Perform post-\nfabrication activities\n3.1 Documentation is completed and processed in\naccordance with organizational requirements and\nstandards\n3.2 Unused/excess materials of same kind and quality are\nmelted together for proper re-testing of its quality and\nquantity as required by organizational procedures and\nsubmitted to issuing personnel for storage and\nsafekeeping\n3.3 Notification of work completion is made to appropriate\nperson(s) in accordance with organizational procedures\n3.4 Work area, tools and equipment are cleaned and stored\nin accordance with OHS and organizational\nrequirements\n\n--- PDF PAGE 50 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC III Promulgated: Nov. 25, 2010\n48\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Appropriate\nperson(s)\nMay include but are not limited to:\n1.1 Quality Control Personnel\n1.2 Client\n1.3 Designer\n2. Appropriate\npreparation and\nfabrication\ntechniques\nMay include but are not limited to:\n2.1 Read and interpret design sketches from the client\n2.2 Communicate and seek and take notes other opinion from\nappropriate person(s). Suggest modification if necessary\n2.3 Utilize graphic illustration\n2.4 Check all available ready made parts and\n components\n2.5 Obtain pre-fabricated wires, sheets and tubes\n2.6 Utilize lost wax casting techniques\n2.7 Use wax carving techniques and/ or CADCAM\n2.8 Design and plan fabrication of intricate, moving and\nfunctional component and parts\n2.9 Select and obtain tools, machineries and equipment\nneeded for fabrication\n2.10 Plan in advance surface texture, finishing and other\nmetal and surface treatment\n3. Fabrication and\nfinishing activities\nMay include but are not limited to:\n3.1 Handmade techniques\n3.2 Wax carving techniques\n3.3 Lost wax casting techniques\n3.4 Surface polishing\n3.5 Engraving and other surface modification, e.g. texturing,\n granulation, enameling etc..\n3.6 Stone setting\n3.7 Special metal treatment, e.g. Anti-tarnish,\n oxidizing, plating, etc.\n\n--- PDF PAGE 51 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC III Promulgated: Nov. 25, 2010\n49\n\nVARIABLE\nRANGE\n4. Tools, machineries\nand equipment\nMay include but not limited to:\nHand Tools\n4.1 HoldingTools\n4.2 Cutting tools\n4.3 Measuring tools\n4.4 Boring tools\n4.5 Forming tools\nEquipment and Machineries\n4.6 Heating equipment\n4.7 Soldering equipment\n4.8 Press equipment\n4.9 Casting equipment\n4.10\nTurning equipment\n5. Materials\nMay include but not limited to:\n5.1 Precious metals\n 5.1.1 Gold\n 5.1.2 Silver\n5.2 Non- precious base metals\n 5.2.1 Copper Nickel\n 5.2.2 Zinc\n 5.2.3 Brass\n5.3 Precious and/or Non- precious gemstones\n5.4 Non-traditional materials for jewelry making\n (e.g. Leather, sea shells, woods, etc.)\n6. Consumables\nMay include but not limited to:\n6.1 Chemicals\n 6.1.1 Borax\n 6.1.2 Boric Acid\n 6.1.3 Potassium Nitrate\n 6.1.4 Alum\n6.2 Supplies\n 6.2.1 Fuel\n 6.2.2 Emery paper\n 6.2.3 Crucibles\n 6.2.4 Solder\n\n--- PDF PAGE 52 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC III Promulgated: Nov. 25, 2010\n50\n\nVARIABLE\nRANGE\n7. Material\npreparation\nMay include but not limited to:\n7.1 Anneal pre-fabricated materials\n (e.g. tube, wires, sheets, etc.)\n7.2 Test ready made components ensuring proper quality\n7.3 Pre-alloyed metals:\n 7.3.1 Carefully check its weight,\n 7.3.2 Test its quality.\n 7.3.3 Place in crucible with sufficient flux\n 7.3.4 Fuse all metals into complete 