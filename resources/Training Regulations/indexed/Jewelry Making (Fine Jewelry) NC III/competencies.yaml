        "evidence_guide": {
          "source_text": "1. Critical aspects\nof competency\nAssessment requires evidence that the candidate:\n1.1 Identified and accessed specification/manuals as per job\nrequirements.\n1.2 Interpreted manuals in accordance with industry practices.\n1.3 Applied information in manuals according to the given\ntask.\n1.4 Stored manuals in accordance with company\nrequirements.\n2. Underpinning\nKnowledge\n2.1 Type of manuals used in the Decorative Crafts (Jewelry)\nSector\n2.2 Identification of symbols used in the manuals\n2.3 Identification of units of measurements\n2.4 Unit/s of conversion\n3. Underpinning\nSkills\n3.1 Reading and comprehension skills required to identify and\ninterpret decorative crafts (jewelry) manuals and\nspecifications\n3.2 Accessing information and data\n4. Resource\nImplications\nThe following resources should be provided:\n4.1 All manuals/catalogues relative to the decorative crafts\n(jewelry) sector\n5. Methods of\nAssessment\nCompetency in this unit must be assessed through:\n5.1 Direct observation\n5.2 Questions/Interview\n6. Context for\nAssessment\n6.1 Competency assessment must be undertaken in\naccordance with the endorsed TESDA assessment\nguidelines\n6.2 Assessment may be conducted in the workplace or\nsimulated environment\n\n--- PDF PAGE 26 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC III Promulgated: Nov. 25, 2010\n24\n\nUNIT OF COMPETENCY :\nPERFORM MENSURATIONS AND CALCULATIONS\nUNIT CODE :"
