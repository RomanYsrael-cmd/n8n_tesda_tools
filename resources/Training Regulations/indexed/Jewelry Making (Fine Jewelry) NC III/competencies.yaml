            "title": "Appropriate",
            "performance_criteria": [
              {
                "number": "2.1",
                "text": "Gemstones are pre-positioned to develop an imaginary picture of the jewelry to be fabricated"
              },
              {
                "number": "2.2",
                "text": "Appropriate pre-fabricated materials and components are prepared, selected, requested and obtain from the issuing officer"
              },
              {
                "number": "2.3",
                "text": "Gemstones are calibrated using precision devices for proper construction of holders on its mounting."
              },
              {
                "number": "2.4",
                "text": "Necessary patterns for cut out parts are develop"
              },
              {
                "number": "2.5",
                "text": "Design modification is often suggested for better appearance of the design especially with multiple numbers of bigger sizes of stone"
              },
              {
                "number": "2.6",
                "text": "Type of bezel to hold smaller gems are prepared and selected to ensure best appearance for the required design."
              },
              {
                "number": "2.7",
                "text": "Tools, machineries and equipment are selected and prepared to ensure the smooth flow of work"
              },
              {
                "number": "2.8",
                "text": "Required materials are requested and obtained to start the process"
              },
              {
                "number": "2.9",
                "text": "Size replica of bigger stones are made to avoid accident of loss and damage during the process... these materials are entrusted to issuing person properly for safe keeping while it is readily available in cases of needs"
              }
