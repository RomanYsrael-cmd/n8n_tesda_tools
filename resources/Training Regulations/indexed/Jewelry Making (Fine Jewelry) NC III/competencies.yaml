          "source_text": "1. Perform engraving \npreparatory \nactivities \n1.1 Engraving jewelry requirements are identified from \nclient’s drawings and specifications \n1.2 Materials, tools and equipment are selected and \nprepared to carry out tasks consistent with job \nrequirements in accordance with workplace procedures \nand OHS procedures \n1.3   When necessary, out of specifications jewelry items are \nreturned or requested for replacement in accordance \nwith organizational requirements \n1.4  Engraving method is selected depending on job \nspecification and type of jewelry \n2. Perform engraving \n2.1 Patterns are outlined, pierced and carved on the jewelry \nand checked if details are properly transferred \n2.2 Design is inspected as to its proportion to the size and \nshape of the jewelry    \n2.3 Designs are engraved on the jewelry in accordance \nwith job specification and organizational requirements \n2.4 Measures are undertaken to correct minor engraving \nomissions and errors \n2.5 Tools and equipment for engraving are used suitably in \naccordance with job specification \n2.6 Output is checked to ensure it conforms to required \nspecifications, quality and other engraving procedure  \n3.   Perform post-\nengraving \nactivities \n3.1  Finished item is submitted for final quality control and \ndocumentation in accordance with organizational \nrequirements \n3.2  Unused/excess materials are collected and \nstored/reclaimed in accordance with organizational \nrequirements \n3.3  Work area, tools and equipment are cleaned and stored \nin accordance with OHS and organizational requirements\n\n--- PDF PAGE 71 ---\n69 \nTR-JEWELRY MAKING (Fine Jewelry) NC III                  Date Promulgated: Nov. 2010 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE  \n1. Materials, tools \nand equipment \nMay include but not limited to: \nMaterials \n1.1 Gravers \n1.2 Metal sheets \n1.3 Carbons/stencils \n1.4 White poster color \n1.5 Correction fluid \n1.6 Semi-finished jewelry \nTools \n1.7 Hand engraving tools \n1.8  Files \n1.9  Hammer \n1.10 Oil stone \n1.11 Magnifying lens \nEquipment \n1.12 Power graver set \n1.13 Ultrasonic machine \n2. Engraving \nMethod \n2.1   Hand engraving on hard metals \n2.2   Hand engraving on soft metals \n2.3 Engraving using pantograph \n2.4 Hand piercing and engraving \n2.5 Line engraving   \n3. Designs \n3.1 Figures \n3.2 Letters \n3.3 Shapes \n3.4 Characters/Symbols \n4. Output \nMay include but not limited to: \n4.1 Rings \n4.2 Bracelets  \n4.3 Lockets \n4.4 Earrings\n\n--- PDF PAGE 72 ---\n70 \nTR-JEWELRY MAKING (Fine Jewelry) NC III                  Date Promulgated: Nov. 2010"
