        "source_text": "HCS516202\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes\nrequired in effectively managing one’s workload\nand quality of work.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Plan for\ncompletion of own\nworkload\n\n1.1\nTasks accurately identified\n1.2\nPriority allocated to each task\n1.3\nTime lines allocated to each task or series of tasks\n1.4\nTasks deadlines known and complied with whenever\npossible\n1.5\nWork schedules are known and completed within\nagreed time frames\n1.6\nWork plans developed according to assignment\nrequirements and employer policy\n1.7\nUncompleted work or tasks detailed and responsibility\nfor completion passed to incoming shift or other\nappropriate persons\n2. Maintain quality of\nown performance\n2.1\nPersonal performance continually monitored against\nagreed performance standards\n2.2\nAdvice and guidance sought when necessary to achieve\nor maintain agreed standards\n2.3\nGuidance from management applied to achieve or\nmaintain agreed standards\n2.4\nStandard of work clarified and agreed according to\nemployer policy and procedures\n3. Build credibility\nwith\ncustomers/clients\n3.1\nClient expectations for reliability, punctuality and\nappearance adhered to\n3.2\nPossible causes of client/customer dissatisfaction\nidentified, dealt with and recorded according to\nemployer policy\n3.3\nClient fully informed of all relevant security matters in a\ntimely manner and according to agreed reporting\nprocedures\n\n--- PDF PAGE 30 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC III Promulgated: Nov. 25, 2010\n28\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Tasks\n\n1.1\nMay identified through:\n1.1.1 Assignment instructions\n1.1.2 Verbal Instructions by senior officer\n1.1.3 Policy Documents\n1.1.4 Duty Statements\n1.1.5 Self Assessment\n1.2 May be:\n1.2.1 Daily tasks\n1.2.2 Weekly tasks\n1.2.3 Regularly or irregularly occurring tasks\n2. Performance\nStandards\nMay include:\n2.1\nAssignment/Instructions\n2.2\nProcedures established in policy documents\n\n--- PDF PAGE 31 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC III Promulgated: Nov. 25, 2010\n29\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nPlanned for completion of own workload\n1.2\nAssessed verbal or written work plan through observation\nand discussion of site and employer requirements\n1.3\nDemonstrated capacity to complete task within specified\ntime frame\n1.4\nMaintained quality of own performance\n2. Underpinning\nknowledge and\nattitudes\n2.1\nSite and assignment requirements\n2.2\nEmployer policy on performance management\n2.3\nIndicators of appropriate performance for each area of\nresponsibility\n2.4\nSteps for improving or maintaining performance\n3. Underpinning\nskills\n3.1\nCapacity to plan and prioritize security work loads and\nrequirements\n3.2\nTime and task management\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nAssessment Centers/Venues\n4.2\nAccredited Assessors\n4.3\nModes of Assessment\n4.4\nEvaluation Reports\n4.5\nAccess to a relevant venue, equipment and materials\n4.6\nAssignment Instructions\n4.7\nLogbooks\n4.8\nOperational manuals and makers’/customers’\ninstructions (if relevant)\n4.9\nAssessment Instruments, including personal planner and\nassessment record book\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1\nWritten Test/Examination\n5.2\nDemonstration with questioning\n5.3\nObservation with questioning\n6. Context of\nassessment\n6.1 Competency assessment must be undertaken in\naccordance with the endorsed TESDA assessment\nguidelines\n6.2 Assessment may be conducted in the workplace or in a\n(simulated) similar environment\n\n--- PDF PAGE 32 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC III Promulgated: Nov. 25, 2010\n30\nUNIT OF COMPETENCY : APPLY BASIC FIRST AID\nUNIT CODE\n:"
