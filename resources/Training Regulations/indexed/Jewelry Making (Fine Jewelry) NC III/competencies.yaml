        "evidence_guide": {
          "source_text": "1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Prepared for metal casting in accordance with job\nrequirements and organizational procedures\n1.2 Conducted pre-casting operations in accordance with\nmanufacturer’s specifications\n1.3 Melted jewelry metal according to required casting\ntemperature\n1.4 Cast metal in accordance with standard operating\nprocedures and OH&S requirements\n1.5 Checked cast metal for quality to ensure conformance\nwith required specifications following organizational\nprocedures\n1.6 Submitted cast metals and leftovers for documentation\n1.7 Notified work completion to appropriate person/s in\naccordance with organizational procedures\n1.8 Cleaned and stored work area, tools and equipment in\naccordance with OHS and organizational requirements\n1.9 Used personal protective equipment (PPE) in\naccordance with job requirements and OHS\nrequirements\n\n2. Underpinning\nKnowledge\n2.1 Philippine National Standard on Jewelry\n2.2 Types of jewelry\n2.3 Different Casting Techniques and procedure\n2.4 Properties of metals used in jewelry\n2.5 Tools, machineries, Equipment, materials/consumables\npreparation and operating procedures\n2.6 Safe work practices and procedures/ OH&S requirements\n2.7 Accounting of unused/excess materials\n2.8 First aid measures\n3. Underpinning\nSkills\n3.1 Reading and interpreting routine information on written\njob instructions, specifications and standard operating\nprocedures.\n3.2 Identifying metals and their alloys\n3.3 Weighing metals and their alloys\n3.4 Setting up, checking and operating equipment\n3.5 Maintaining furnace temperatures\n3.6 Heating metals and alloys\n3.7 Applying safe casting procedures\n3.8 Working within heating timeframe constraints\n3.9 Housekeeping\n3.10 Applying first aid measures\n\n--- PDF PAGE 65 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC III Promulgated: Nov. 25, 2010\n63\n\n4. Resource\nImplications\nThe following resources should be provided:\n4.1 Materials relevant to the activity\n4.2 Tools, machineries and equipment\n4.3 Shop supplies\n4.4 PPE\n4.5 Workplace\n4.6 Exhaust fan\n4.7 Fire extinguisher\n4.8\nDocumentation\n5. Method of\nAssessment\nCompetency in this unit must be assessed through:\n5.1 Demonstration with oral questioning\n5.2 Portfolio (Training Certificates, Certificate of\nEmployment, Workpiece, etc.)\n5.3 Third-Party Report\n\n6. Context of\nAssessment\n6.1 Competency may be assessed in the workplace or in a\nsimulated work environment (TESDA Accredited\nAssessment Center)\n\n--- PDF PAGE 66 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC III Promulgated: Nov. 25, 2010\n64\n\nUNIT OF COMPETENCY: PRODUCE JEWELRY WAX MODEL\n\nUNIT CODE :"
