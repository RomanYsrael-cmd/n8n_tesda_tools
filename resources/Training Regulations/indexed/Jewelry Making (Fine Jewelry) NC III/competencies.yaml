        "evidence_guide": {
          "source_text": "1. Critical aspects\nof Competency\n\nAssessment requires evidence that the candidate:\n1.1 Identified stone setting requirements based on design\nspecifications\n1.2 Selected and obtained components, materials, tools,\nmachineries and equipment appropriate to job\nrequirements\n1.3 Returned or requested for replacement out of specs in\naccordance with organizational requirements\n1.4 Conducted material preparation using safe operating\npractices and protective equipment in accordance with\nOH&S and organizational requirements\n1.5 Performed applicable setting techniques using safe\noperating practices and protective equipment in\naccordance with OH&S and organizational requirements\n1.6 Checked item to ensure outcome conforms to required\nspecifications and in accordance with organizational\nrequirements\n1.7 Submitted finished item for final quality control and\ndocumentation in accordance with organizational\nrequirements\n1.8 Work area, tools and equipment are cleaned and stored in\naccordance with OH&S and organizational requirements\n1.9 Observed safe work practices and procedures\n\n2. Underpinning\nKnowledge\n\n2.1\nPhilippine National Standard (PNS) on Jewelry\n2.2\nTypes of jewelry\n2.3\nProperties and characteristics of metals used in jewelry\n2.4\nTools and equipment for setting a range of jewelry\nitems/designs\n2.5\nCommon jewelry design features, constructions and\nfinishes\n2.6\nMetals, materials and consumables for given jewelry\nsetting jobs\n2.7\nProperties and characteristics of applicable gemstones\n2.8\nProcedures for checking serviceability of applicable tools\nand equipment\n2.9\nSafe operating procedures for applicable tools and\nequipment\n2.10 Different techniques and processes of jewelry stone\nsetting\n2.11 Accounting of unused/excess materials\n2.12 Safe work practices and procedures/OH&S\nrequirementts\n2.13 First-aid measures\n\n--- PDF PAGE 60 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC III Promulgated: Nov. 25, 2010\n58\n\n3. Underpinning\nSkills\n3.1 Interpreting design specifications and follow instructions\n(oral or written)\n3.2 Interpreting drawings\n3.3 Measuring\n3.4 Selection and application of appropriate tools and\n equipment\n3.5 Selection and application of appropriate processes and\nsetting techniques\n3.6 Finishing techniques (including basic engraving skills)\n3.7 Applying safe working skills\n3.8 Identifying alternative process, techniques, and materials\n3.9 Applying first-aid measures\n4. Resource\nImplications\nThe following resources should be provided:\n4.1 Materials relevant to the activity\n4.2 Tools and equipment\n4.3 Consumables\n4.4 PPE\n4.5 Workplace\n4.6 Documentation\n4.7 Exhaust fan\n4.8 Fire extinguisher\n5. Method of\nAssessment\nCompetency in this unit must be assessed through:\n5.1 Direct observation with oral questioning or\n5.2 Demonstration with oral questioning\n5.3 Portfolio (Training Certificates, Certificate of Employment,\nWorkpiece, etc.)\n5.4 Third-Party Report\n\n6. Context of\nAssessment\n6.1 Competency may be assessed in the workplace or in a\nsimulated work environment (TESDA Accredited\nAssessment Center)\n\n--- PDF PAGE 61 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC III Promulgated: Nov. 25, 2010\n59\n\nUNIT OF COMPETENCY : PERFORM JEWELRY METAL CASTING\n\nUNIT CODE :"
