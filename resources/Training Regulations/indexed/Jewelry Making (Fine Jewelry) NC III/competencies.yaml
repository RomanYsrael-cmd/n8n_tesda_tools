          "source_text": "1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Selected and prepared appropriate measuring\ninstruments in accordance with job requirements\n1.2 Performed measurements and calculations according to\njob requirements/ISO\n2. Underpinning\nknowledge\n2.1 TRADE MATHEMATICS/MENSURATION\n2.1.1 Four fundamental operation\n2.1.2 Linear measurement\n2.1.3 Dimensions\n2.1.4 Unit conversion\n2.1.5 Ratio and proportion\n2.1.6 Trigonometric functions\n2.1.7 Algebraic equations\n3. Underpinning\nskills\n3.1 Performing mensuration and calculation by addition,\nsubtraction, multiplication and division: trigonometric\nfunctions and algebraic equations\n3.2 Visualizing objects and shapes\n3.3 Interpreting and using appropriate formula(s) for volume,\nareas, perimeters of plane and geometric figures\n3.4 Proper handling and storing of measuring instruments\n4. Resource\nimplications\nThe following resources should be provided:\n4.1 Workplace location\n4.2 Problems to solve\n4.3 Measuring instrument/s appropriate to carry out tasks\n4.4 Instructional materials relevant to the proposed activity\n5. Methods of\nassessment\nCompetency in this unit must be assessed through:\n5.1 Direct observation/Actual test.\n5.2 Questions/Interview\n6. Context for\nassessment\n6.1 Competency assessment must be undertaken in\naccordance with the endorsed TESDA assessment\nguidelines\n6.2 Assessment may be conducted in the workplace or in a\n(simulated) similar environment\n\n--- PDF PAGE 29 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC III Promulgated: Nov. 25, 2010\n27\nUNIT OF COMPETENCY :\nMANAGE OWN PERFORMANCE\nUNIT CODE\n:"
