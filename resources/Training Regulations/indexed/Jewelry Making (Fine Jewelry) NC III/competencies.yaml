          "source_text": "1. Critical aspects\nof competency\nAssessment requires evidence that the candidate:\n1.1 Identified job requirements based from client’s drawings\nand specifications\n1.2 Selected and prepared materials, tools and equipment in\nengraving jewelry in accordance with client and design\nspecifications\n1.3 Identified and selected appropriate methods of engraving\njewelry depending on job specifications and type of jewelry\n1.4 Engraved design on jewelry in accordance with job\nspecifications and organizational requirements\n1.5 Checked output to ensure conformity to required\nspecifications, quality and other engraving procedures\n1.6 Submitted finished item for final quality control and\ndocumentation in accordance with organizational\nrequirements\n1.7 Notified work completion to appropriate person/s in\naccordance with organizational procedures\n1.8 Cleaned and stored work area, tools and equipment in\naccordance with OH&S and organizational requirements\n1.9 Used personal protective equipment (PPE) in accordance\nwith job requirements and OHS requirements\n2. Underpinning\nKnowledge\n2.1 Philippine National Standard (PNS) on Jewelry\n2.2 Types of jewelry\n2.3 Properties of metals used in Jewelry\n2.4 Engraving methods and styles\n2.5 Design transfer\n2.6 Types and uses of engraving tools and equipment\n2.7 Health and safety precautions\n2.8 First-aid measures\n2.9 Accounting of unused/excess materials\n3. Underpinning\nSkills\n3.1 Reading and interpreting routine information on written job\ninstructions, specifications and standard operating\nprocedures\n3.2 Identifying and selecting of appropriate tools, equipment,\nmaterials, accessories and aids.\n3.3 Transferring of design to jewelry before engraving\n3.4 Performing of engraving methods to jewelry\n3.5 Techniques in correcting minor engraving omissions or\nerrors\n3.6 Examining finished work\n3.7 Using precision measuring instruments (i.e. calipers,\nmicrometers)\n3.8 Tools sharpening skills\n3.9 Handling engraving tools\n3.10 Applying first-aid measures\n3.11\nObserving OH&S procedures\n\n--- PDF PAGE 73 ---\n71\nTR-JEWELRY MAKING (Fine Jewelry) NC III Date Promulgated: Nov. 2010\n4. Resource\nImplications\nThe following resources should be provided:\n4.1 Tools, equipment and materials relevant to the activity\n4.2 PPE\n4.3 Consumables\n4.4 Work place\n4.5 Exhaust fan\n4.6 Fire extinguisher\n4.7 Documentation\n5. Method of\nAssessment\nCompetency in this unit may be assessed through:\n5.1 Direct observation with oral questioning or\n5.2 Demonstration with oral questioning\n5.3 Portfolio (Training Certificates, Certificate of Employment,\nWorkpiece, etc.)\n5.4 Third-Party Report\n\n6. Context of\nAssessment\n6.1 Competency may be assessed in the workplace or in a\nsimulated work environment (TESDA Accredited\nAssessment Center)\n\n--- PDF PAGE 74 ---\n72\nTR-JEWELRY MAKING (Fine Jewelry) NC III Date Promulgated: Nov. 2010"
