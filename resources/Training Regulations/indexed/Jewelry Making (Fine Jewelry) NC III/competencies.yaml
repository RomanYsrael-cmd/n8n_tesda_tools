        "source_text": "--- PDF PAGE 26 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC III               Promulgated: Nov. 25, 2010 \n24 \n \nUNIT OF COMPETENCY   :\nPERFORM MENSURATIONS AND CALCULATIONS \nUNIT CODE                        :\nCON311203 \nUNIT DESCRIPTOR           :\nThis unit covers the knowledge, skills and attitudes in \nidentifying and measuring objects based on the \nrequired performance standards.\n \nELEMENT \nPERFORMANCE CRITERIA \nBold and Italicized terms are elaborated in the  Range of Variables \n1.  Select measuring \ninstrument \n \n    \n1.1 Object/design or component to be measured is \nidentified, classified and interpreted in accordance with \nthe appropriate geometric shape/s. \n1.2 Measuring tools are selected/identified as per \nobject/design  to be measured or job requirements \n1.3 Correct design and specifications are obtained from \nrelevant sources. \n1.4 Appropriate measuring instruments are selected \naccording to job requirements \n1.5 Alternative measuring tools are used without sacrificing \ncost and quality of work. \n2.  Carry out \nmeasurements and \ncalculations \n \n2.1 Accurate measurements are obtained according to job \nrequirements. \n2.2 Alternative measuring tools are used without sacrificing \ncost and quality of work. \n2.3 Calculation needed to complete work tasks are \nperformed using four basic process of addition (+), \nsubtraction (-) multiplication (x) and division(/) including \nbut not limited to \ntrigonometric functions, algebraic computations \n2.4 Calculations involving fractions, percentages and mixed \nnumbers are used to complete workplace tasks. \n2.5 Numerical computation is self-checked and corrected \nfor accuracy. \n2.6 Instruments are read to the limit of accuracy and \nprecision of the tool used. \n2.7 Systems of measurement are identified and converted \naccording to job requirements/ISO \n2.8 Work pieces are measured according to job \nrequirements.\n\n--- PDF PAGE 27 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC III               Promulgated: Nov. 25, 2010 \n25 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.  Geometric shape \nIncluding but not limited to: \n1.1 Round \n1.2 Square \n1.3 Rectangle \n1.4 Triangle \n1.5 Sphere \n1.6 Cone \n2.  Measuring  \ninstruments \nIncluding but not limited to: \n2.1 tape measure                      \n2.2 various calipers                   \n2.3 weighing scale \n2.4 densimeter \n2.5 ruler \n2.6 micrometer \n3.  Measurements and \ncalculations \nIncluding but not limited to: \n3.1 size \n3.2 width  \n3.3 length \n3.4 weight \n3.5 area \n3.6 volume \n3.7 diameter \n3.8 thickness \n3.9 angle/s\n\n--- PDF PAGE 28 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC III               Promulgated: Nov. 25, 2010 \n26 \n EVIDENCE GUIDE \n \n1. Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1 Selected and prepared appropriate measuring \ninstruments in accordance with job requirements \n1.2 Performed measurements and calculations according to \njob requirements/ISO \n2. Underpinning \nknowledge \n2.1 TRADE MATHEMATICS/MENSURATION \n2.1.1 Four fundamental operation \n2.1.2 Linear measurement \n2.1.3 Dimensions \n2.1.4 Unit conversion \n2.1.5 Ratio and proportion \n2.1.6 Trigonometric functions \n2.1.7 Algebraic equations \n3. Underpinning \nskills \n3.1 Performing mensuration and calculation by addition, \nsubtraction, multiplication and division: trigonometric \nfunctions and algebraic equations \n3.2 Visualizing objects and shapes \n3.3 Interpreting and using appropriate formula(s) for volume, \nareas, perimeters of plane and geometric figures \n3.4 Proper handling and storing of measuring instruments \n4. Resource \nimplications \nThe following resources should be provided: \n4.1 Workplace location \n4.2 Problems to solve \n4.3 Measuring instrument/s appropriate to carry out tasks \n4.4 Instructional materials relevant to the proposed activity \n5. Methods of \nassessment \nCompetency in this unit must be assessed through: \n5.1  Direct observation/Actual test.   \n5.2  Questions/Interview \n6. Context for \nassessment \n6.1  Competency assessment must be undertaken in \naccordance with the endorsed TESDA assessment \nguidelines \n6.2  Assessment may be conducted in the workplace or in a \n(simulated) similar environment\n",
