        "source_text": "--- PDF PAGE 32 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC III               Promulgated: Nov. 25, 2010 \n30 \nUNIT OF COMPETENCY :    APPLY BASIC FIRST AID \nUNIT CODE \n: \nHCS323203 \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge, skills and attitudes \nrequired to provide an initial response where First \nAid is required. In this unit it is assumed that the \nFirst Aider is working under supervision and / or \naccording to established workplace First Aid \nprocedures and policies \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables\n1. Assess the situation \n1.1 \n Physical hazards to self and casualty’s health \nand safety are identified. \n1.2 \nImmediate risks  to self and casualty’s \noccupational  health and safety (OSH )are \nminimized by controlling the hazard in \naccordance with OSH requirements. \n1.3 \nCasualty’s vital signs and physical condition are \nassessed in accordance with workplace \nprocedures. \n2. Apply basic first aid \ntechniques \n2.1 \nFirst \nAid \nmanagement \nis \nprovided \nin \naccordance \nwith \nestablished \nFirst \nAid \nprocedures. \n2.2 \nCasualty is reassured in a caring and calm \nmanner and made comfortable using available \nresources. \n2.3 \nFirst Aid assistance is sought from others in a \ntimely manner and as appropriate. \n2.4 \nCasualty’s \ncondition \nis \nmonitored \nand \nresponded to in accordance with effective First \nAid principles and workplace procedures. \n2.5 \nDetails of casualty’s physical condition, changes \nin conditions, management and response are \naccurately recorded in line with organizational \nprocedures. \n2.6 \nCasualty management is finalized according to \nhis/her needs and First Aid principles.\n\n--- PDF PAGE 33 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC III               Promulgated: Nov. 25, 2010 \n31 \n \n3. Communicate details \nof the incident \n3.1 \nAppropriate medical assistance is requested \nusing relevant communication media and \nequipment. \n3.1 \nDetails of casualty’s condition and management \nactivities are accurately conveyed to emergency \nservices/relieving personnel. \n3.2 \nReports to supervisors are prepared in a timely \nmanner, presenting all relevant facts according \nto established company procedures.\n\n--- PDF PAGE 34 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC III               Promulgated: Nov. 25, 2010 \n32 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. First Aid \nManagement \nThis may include but not limited to: \n1.1 \nWorkplace policies and procedures \n1.2 \nIndustry/site specific regulations, codes \n1.3 \nOSH \n1.4 \nState and territory workplace health and safety \nrequirements \n1.5 \nAllergies the casualty may have \n2. Physical Hazards \nPhysical hazards may include: \n2.1 \nWorkplace hazards \n2.2 \nEnvironmental hazards \n2.3 \nProximity of other people \n2.4 \nHazards associated with casualty management \nprocesses \n3. Risks \nRisks may include: \n3.1 \nWorksite equipment, machinery and substances \n3.2 \nEnvironmental risks \n3.3 \nBodily fluids \n3.4 \nRisk of further injury to the casualty \n3.5 \nRisk associated with the proximity of the others \nand bystanders \n4. Casualty’s Condition \nCasualty’s condition may include but not limited to the \nfollowing: \n4.1 \nAbdominal injuries \n4.2 \nAllergic reactions \n4.3 \nBleeding \n4.4 \nBurns-thermal, chemical, friction, electrical \n4.5 \nCardiac conditions \n4.6 \nChemical contamination \n4.7 \nCod injuries \n4.8 \nCrush injuries \n4.9 \nDislocations \n4.10 Drowning \n4.11 Eye injuries \n4.12 Fractures\n\n--- PDF PAGE 35 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC III               Promulgated: Nov. 25, 2010 \n33 \nVARIABLE \nRANGE \n4.13 Head injuries \n4.14 Epilepsy \n4.15 Minor skin injuries \n4.16 Neck and spinal injuries \n4.17 Needle stick injuries \n4.18 Poisoning and toxic substances \n4.19 Shock \n4.20 Smoke inhalation \n5. Equipment and \nResources \nEquipment and other resources may include: \n5.1 \nDefibrillation units \n5.1 \nPressure bandages \n5.2 \nThermometers \n5.3 \nFirst Aid kit \n5.4 \nEyewash \n5.5 \nThermal blankets \n5.6 \nPocket face masks \n5.7 \nRubber gloves \n5.8 \nDressing \n5.9 \nSpace device \n5.10 Cervical collars \n6. Communication \nsystem \n6.1 \nMobile phone \n6.2 \nSatellite phones \n6.3 \nHF/VHF radio \n6.4 \nFlags \n6.5 \nFlares \n6.6 \nTwo - way radio \n6.7 \nEmail \n6.8 \nElectronic equipment \n7. Vital signs \n7.1 \nBreathing \n7.2 \nCirculation \n7.3 \nConsciousness \n8. First Aid Principles \n8.1 \nChecking the site for danger to self, casualty’ and \nothers and minimizing the danger \n8.2 \nChecking and maintaining the casualty’s airways, \nbreathing and circulation\n\n--- PDF PAGE 36 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC III               Promulgated: Nov. 25, 2010 \n34 \nEVIDENCE GUIDE \n \n1. Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1 \nComplied with institutional requirements, OSH \nlaws infections control and manual handling \nprocedures and relevant health regulations \n1.2 \nIdentified physical hazards of the casualty and \nminimized immediate risks \n1.3 \nAssessed and monitored the physical condition of \nthe casualty \n1.4 \nResponded to emergency using basic life support \nmeasures. \n1.5 \nProvided initial response where First Aid is \nrequired \n1.6 \nDealt with complex casualties or incident \n1.7 \nPrepared reports to concerned personnel in a \ntimely manner  \n2. Underpinning \nknowledge  \n2.1 \nBasic anatomy and physiology \n2.2 \nCompany standard operating procedures (SOPs) \n2.3 \nDealing with confidentiality \n2.4 \nKnowledge of the First Aiders’ skills limitations \n2.5 \nOSH legislation and regulations \n2.6 \nHow to gain access to and interpret material \nsafety data sheets \n3. Underpinning skills \n3.1 \nResuscitation \n3.2 \nSafe manual handling of casualty \n3.3 \nConsideration of the welfare of the casualty \n3.4 \nReport preparation \n3.5 \nCommunication skills \n3.6 \nAbility to interpret and use listed documents \n4. Resource \nimplications \nThe following resources MUST be provided: \n4.1 \nAccess to relevant work station \n4.2 \nRelevant institutional policies, guidelines \nprocedure and protocol \n4.3 \nEquipment and materials relevant to the \nproposed activities\n\n--- PDF PAGE 37 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC III               Promulgated: Nov. 25, 2010 \n35 \n \n5. Method of \nassessment \nCompetency may be assessed through:   \n5.1 \nDemonstration with questioning \n5.2 \nInterview \n5.3 \nThird Party Report \n5.4 \nPortfolio \n6. Context of \nassessment \n6.1 \nAssessment may be done in a workplace or \nsimulated work area setting.\n",
