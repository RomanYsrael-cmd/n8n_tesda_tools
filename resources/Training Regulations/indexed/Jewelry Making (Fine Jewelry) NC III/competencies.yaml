        "source_title": "PERFORM JEWELRY METAL CASTING",
        "source_text": "--- PDF PAGE 61 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC III               Promulgated: Nov. 25, 2010 \n59 \n \nUNIT OF COMPETENCY :     PERFORM JEWELRY METAL CASTING \n \nUNIT CODE                      :     DCJ731308 \n  \n UNIT DESCRIPTOR         :    This unit covers the knowledge, skills and attitudes \nin metal casting fine jewelry primarily by the “lost \nwax” method of investment casting. \n \n \nELEMENT\nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1. Prepare pre-\ncasting \noperations \n \n1.1 Tools, machineries, equipment,  materials and \nconsumables are requested and prepared in accordance \nwith appropriate job requirements and organizational \nrequirements \n1.2 Pre-casting activities is performed in accordance with \norganizational or industry standards \n1.3 Metals and alloys are requested and obtained from \nappropriate personnel  \n1.4 Personal protective equipment (PPE) is used in \naccordance with job requirements and OHS requirements \n2.  Perform casting \noperations \n2.1  Requested metals and alloys are weighed out in  \nappropriate wax-to-metal ratios \n2.2  Protective coating/chemicals is applied to jewelry metal \nas appropriate  \n2.3  Burn-out flask is positioned into casting chamber in \naccordance with standard operating procedures \n2.4  Jewelry metal is heated according to required casting \ntemperature \n2.5  Molten metal is cast in accordance with standard operating \nprocedures (SOPs) and OH&S requirements  \n2.6  Cast metal is cooled and removed from the flask by \nquenching in water  \n2.7  Item is checked for quality to ensure conformance with \nrequired specifications following organizational procedures\n3.   Perform post-\ncasting \noperations \n \n3.1  Cast metals and leftovers are cleaned, checked and \nsubmitted to appropriate personnel for documentation \n3.2  Casting flask is removed, cleaned and stored in a safe \nmanner \n3.3  Casting materials/consumables are stored as appropriate \nfor possible metal recovery \n3.4  Work area and equipment are cleaned after casting \nprocedure is completed\n\n--- PDF PAGE 62 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC III               Promulgated: Nov. 25, 2010 \n60 \n    RANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.  Tools, materials \nand \nconsumables \n \nMay include but are not limited to: \nTools \n1.1 Spatula \n1.2 Surgical knives \n1.3 Crucibles \nConsumables \n1.4 Investment powder \n1.5 Wax \n1.6 Fluxes \n1.7 Silicon spray \n1.8 Cleaning agents (e.g Denatured alcohol, Debubblelizer) \n Materials \n1.9 Rubber molds \n1.10 Flasks \nEquipment and Machineries \n1.11 Air compressor \n1.12 Centrifugal casting machine \n1.13 Vacuum casting machine \n1.14 Electric burn out furnace \n1.15 Steam de-waxer \n1.16 Electric melting machine \n1.17 Pressure water jet cabinet \n1.18 Blow torch \n1.19\nWax injector\n2.  Organizational \nor industry \nstandards \n2.1 \nWax injector machine is preheated \n2.2 \nRubber mold is checked for dirt and imperfection/defects \n2.3 \nRubber mold is sprayed with silicon \n2.4 \nWax is injected in rubber mold \n2.5 \nWax pattern is attach on the wax sprue and weigh to \ncalculate the amount of metal needed for casting \n2.6 \nSprue tree is mounted on a flask base and enclosed with \nmetal flask  in preparation for investing  \n2.6.1 \nCompute required water and investment powder \nappropriate to flask size \n2.6.2 \nMix investment/ water using electric mixer or \nspatula \n2.6.3 \nSlurry is vacuumed and poured into the flask \n2.7 \nFlask is invested, vacuumed,  in accordance with SOPs \n2.8 \nPreheating of furnace is carried out according to job \nrequirements and manufacturer’s specifications \n2.9 \nTemperature of invested flask is maintained in \naccordance with manufacturer’s specifications\n\n--- PDF PAGE 63 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC III               Promulgated: Nov. 25, 2010 \n61 \n \nVARIABLE \nRANGE \n3.  Metals and \nalloys \nMay include but are not limited to: \n3.1  Gold \n3.2  Silver \n3.3  Platinum \n6.  Personal \nprotective  \nequipment \n(PPE) \nMay include but are not limited to: \n6.1  Heat resistant gloves \n6.2  Heat resistant apron \n6.3  Face shield \n6.4  Safety goggles \n6.5  Safety shoes (Optional)\n7.  Protective \ncoating /  \nchemicals \nMay include but are not limited to: \n7.1   Fluxes (e.g. borax, boric acid) \n7.2   Inert Gases\n\n--- PDF PAGE 64 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC III               Promulgated: Nov. 25, 2010 \n62 \nEVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 Prepared for metal casting in accordance with job \nrequirements and organizational procedures \n1.2 Conducted pre-casting operations in accordance with \nmanufacturer’s specifications \n1.3 Melted jewelry metal according to required casting \ntemperature \n1.4 Cast metal in accordance with standard operating \nprocedures and OH&S requirements \n1.5 Checked cast metal for quality to ensure conformance \nwith required specifications following organizational \nprocedures \n1.6 Submitted cast metals and leftovers  for documentation \n1.7 Notified work completion to appropriate person/s in \naccordance with organizational procedures \n1.8 Cleaned and stored work area, tools and equipment in \naccordance with OHS and organizational requirements \n1.9 Used personal protective equipment (PPE) in \naccordance with job requirements and OHS \nrequirements  \n \n2.  Underpinning \nKnowledge \n2.1  Philippine National Standard on Jewelry \n2.2  Types of jewelry \n2.3  Different Casting Techniques and procedure \n2.4  Properties of metals used in jewelry \n2.5  Tools, machineries, Equipment, materials/consumables \npreparation and operating procedures \n2.6  Safe work practices and procedures/ OH&S requirements \n2.7  Accounting of unused/excess materials \n2.8 First aid measures  \n3.  Underpinning \nSkills \n3.1  Reading and interpreting routine information on written \njob instructions, specifications and standard operating \nprocedures. \n3.2  Identifying metals and their alloys  \n3.3  Weighing metals and their alloys \n3.4  Setting up, checking and operating equipment \n3.5  Maintaining furnace temperatures \n3.6  Heating metals and alloys \n3.7  Applying safe casting procedures \n3.8  Working within heating timeframe constraints \n3.9  Housekeeping \n3.10  Applying first aid measures\n\n--- PDF PAGE 65 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC III               Promulgated: Nov. 25, 2010 \n63 \n \n4.  Resource \nImplications \nThe following resources should be provided: \n4.1  Materials relevant to the activity  \n4.2  Tools, machineries and equipment \n4.3  Shop supplies \n4.4  PPE  \n4.5  Workplace \n4.6  Exhaust fan \n4.7  Fire extinguisher \n4.8\nDocumentation\n5.  Method of \nAssessment \nCompetency in this unit must be assessed through: \n5.1  Demonstration with oral questioning \n5.2  Portfolio (Training Certificates, Certificate of  \nEmployment, Workpiece, etc.) \n5.3  Third-Party Report \n \n \n6.  Context of \nAssessment \n6.1 Competency may be assessed in the workplace or in a  \nsimulated work environment (TESDA Accredited \nAssessment Center)\n",
