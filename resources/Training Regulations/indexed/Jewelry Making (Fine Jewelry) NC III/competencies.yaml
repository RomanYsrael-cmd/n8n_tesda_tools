        "source_title": "PRODUCE JEWELRY WAX MODEL",
        "source_text": "--- PDF PAGE 66 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC III               Promulgated: Nov. 25, 2010 \n64 \n \nUNIT OF COMPETENCY:   PRODUCE JEWELRY WAX MODEL \n \nUNIT CODE                     :   DCJ731309 \n  \nUNIT DESCRIPTOR    :  This unit covers the knowledge, skills and attitudes \nrequired in producing one-off wax models in simple \nto moderate carved forms and simple to moderate \nstructural forms for fine jewelry. \n \n \nELEMENT\nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1.  Prepare for wax \nmodeling \nactivities \n1.1 Wax modeling requirements are identified based on design \nspecifications  \n1.2  Process and finish specifications and required outcomes are \nconfirmed and clarified as necessary with appropriate \nperson(s) and in accordance with organizational \nrequirements \n1.3  Wax modeling activities are established in accordance with \nprocess, verbal and written specifications, organizational \nrequirements and personal abilities \n1.4  Tools, machineries and equipment  appropriate to job \nrequirements are selected and checked for operational \neffectiveness in accordance with manufacturers’ \nspecifications and organizational procedures \n1.5  Material preparation is conducted using safe operating \npractices and protective equipment in accordance with \nOH&S and organizational requirements   \n2.  Produce wax \nmodels  \n \n2.1  Wax is sculpted to specifications  \n2.2  Sculpted wax model is checked and adjustments are made \nwhen necessary to rectify imperfections \n2.3  Wax model are finished in accordance with the design \nrequirements \n2.4  Finished wax model is cast in silicon rubber mold for future \nreproduction (optional) \n3.  Perform post-\nwax modeling \nactivities \n3.1 Finished item is submitted for final quality control and \ndocumentation in accordance with organizational \nrequirements \n3.2 Unused/excess materials are collected and stored/reclaimed \nin accordance with organizational requirements \n3.3  Work area, tools and equipment are cleaned and stored in \naccordance with OH&S and organizational requirements\n\n--- PDF PAGE 67 ---\n65 \nTR-JEWELRY MAKING (Fine Jewelry) NC III                  Date Promulgated: Nov. 2010 \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Specifications \nMay include but are not limited to: \n1.1 Job Order \n1.2 Work instructions \n1.3 Illustrations \n1.4 Work samples \n2.   Appropriate \nperson(s)  \nMay include but are not limited to: \n2.1 Designer \n2.2 Supervisor \n3.  Tools, machineries  \nand equipment \nMay include but are not limited to: \n \n3.1  Electric and hand held tools \n      3.1.1 Wax pen/soldering iron \n      3.1.2 Wax guns \n      3.1.3 Saws \n      3.1.4 Carving tools \n      3.1.5 Wax files \n      3.1.6 Flaming/Blow torch \n      3.1.7 Wax carving burs \n      3.1.8  Miter box \n3.2  Ring tube reamer \n3.3  Wax ring mandrel \n3.4  Wax detailer \n3.5  Wax shaper \n3.6  Wax trimmer \n3.2  Equipment and machineries \n      3.2.1  Mini lathe \n      3.2.2  Flexible shafts with the following accessories \n                3.2.2.1  wax trimmer \n                3.2.2.2  wax gun kit \n                3.2.2.3  wax shaper \n      3.2.3  Electric wax pot \n      3.2.4  Wax welder with pen & 12 tips \n4.  Material preparation 4.1  Appropriate waxes are selected, requested and \nobtained in accordance with organizational requirements \n4.2  Wax material is cut\n\n--- PDF PAGE 68 ---\n66 \nTR-JEWELRY MAKING (Fine Jewelry) NC III                  Date Promulgated: Nov. 2010 \nEVIDENCE GUIDE \n \n1. Critical aspects \nof Competency \n \n \nAssessment requires evidence that the candidate: \n1.1 Identified wax modeling requirements based on design \nspecifications \n1.2 Selected and checked tools, machineries and equipment \nappropriate to job requirements  \n1.3 Conducted material preparation using safe operating \npractices and protective equipment in accordance with \nOH&S and organizational requirements \n1.4 Produced wax models in accordance with design \nrequirements \n1.5 Submitted finished item for final quality control and \ndocumentation in accordance with organizational \nrequirements \n1.6 Notified work completion to appropriate person/s in \naccordance with organizational procedures \n1.7 Cleaned and stored work area, tools and equipment in \naccordance with OHS and organizational requirements \n1.8 Used personal protective equipment (PPE) in accordance \nwith job requirements and OHS requirements  \n2. Underpinning \nKnowledge \n \n2.1  Philippine National Standard (PNS) on jewelry \n2.2  Types of jewelry \n2.3  Properties of waxes \n2.4  Wax modeling techniques and procedures  \n2.5  Factors affecting construction of wax model, including \ntype of wax, hand tools, method of construction, final \nfinish, weight of finished product  \n2.6  Tools and equipment for wax modeling  \n2.7  Design specifications \n2.8  Product Evaluation (Wax to metal ratio)  \n2.9  Effects of casting shrinkage and finishing processes \n2.10 Safe work practices and procedures/OH&S requirements \n2.11 First-aid measures \n2.12 Accounting of unused/excess materials\n\n--- PDF PAGE 69 ---\n67 \nTR-JEWELRY MAKING (Fine Jewelry) NC III                  Date Promulgated: Nov. 2010 \n \n \n3.  Underpinning \nSkills \n3.1  Clarifying design specifications \n3.2  Handling wax modeling tools \n3.3  Using protective safety equipment  \n3.4  Reading and interpreting routine information on written job \ninstructions, specifications and standard operating \nprocedures  \n3.5  Using measurement skills  \n3.6  Planning, sequencing operations \n3.8  Evaluating product \n3.7  Applying first-aid measures \n \n4.  Resource \nImplications \nThe following resources should be provided: \n4.1   Materials relevant to the activity  \n4.2   Tools and equipment \n4.3   PPE  \n4.4   Appropriately illuminated and ventilated workplace \n4.5   Fire extinguisher \n4.6   Exhaust fan \n4.7   Documentation \n5.  Method of \nAssessment \nCompetency in this unit may be assessed through: \n5.1  Direct observation with oral questioning \n5.2  Demonstration with oral questioning \n5.3  Portfolio (Training Certificates, Certificate of Employment, \nWorkpiece, etc.) \n5.4  Third-Party Report \n \n6.  Context of \nAssessment \n6.1 Competency may be assessed in the workplace or in a   \nsimulated work environment (TESDA Accredited \nAssessment Center)\n",
