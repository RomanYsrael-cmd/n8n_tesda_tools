              {
                "number": "1.1",
                "text": "Jewelry design construction, dimension, composition characteristic and finishing requirements are established from predetermined specifications in accordance with client requirements and organizational standard"
              },
              {
                "number": "1.2",
                "text": "Fabrication and finish specifications and required outcomes as indicated in the prescribed form are confirmed and clarified as necessary with appropriate person(s) and in accordance with organizational and client requirements"
              },
              {
                "number": "1.3",
                "text": "Appropriate preparation and fabrication techniques are established in accordance with in accordance with job requirements and organizational procedures"
              },
              {
                "number": "1.4",
                "text": "Fabrication and finishing activities are prioritized in accordance with designated timeframes, organizational and specific design requirements"
              },
              {
                "number": "1.5",
                "text": "Tools, machineries and equipment are selected, requested and checked for operational effectiveness in accordance with the manufacturer’s specification and organizational procedures."
              },
              {
                "number": "1.6",
                "text": "Materials and consumables are also selected, requested and obtained in accordance with organizational requirements and in consultation with appropriate person/s"
              },
              {
                "number": "1.7",
                "text": "Material preparation is conducted using safe operating practices and protective equipment, in accordance with OHS and organizational requirements --- PDF PAGE 42 --- TR-JEWELRY MAKING (Fine Jewelry) NC III Promulgated: Nov. 25, 2010 40 Italicized terms are elaborated in the Range of Variables"
              }
            ]
          },
          {
            "number": 2,
            "title": "Perform fabrication",
            "performance_criteria": [
              {
                "number": "2.1",
                "text": "Pre-formed multi-parts materials are fabricated to produce components using applicable fabrication activities in accordance with OH&S, organizational and industry accepted methods"
              },
              {
                "number": "2.2",
                "text": "Fabricated item is checked to ensure construction conforms with required specifications and quality, applicable to industry organizational standard"
              },
              {
                "number": "2.3",
                "text": "When necessary, defective items are reworked/retouched in accordance with specifications and organizational procedures"
              },
              {
                "number": "2.4",
                "text": "Proper care in handling and accounting of materials is strictly observed to ensure that quality and quantity is followed in accordance with the organizational requirements"
              }
            ]
          },
          {
            "number": 3,
            "title": "Perform post-",
            "performance_criteria": [
              {
                "number": "3.1",
                "text": "Documentation completed and processed in accordance with organizational requirements and standards"
              },
              {
                "number": "3.2",
                "text": "Finished product is quality checked for dimension and construction in accordance with clients’ specifications and organizational requirements"
              },
              {
                "number": "3.3",
                "text": "Unused/excess materials of same kind and quality are melted together for proper re-testing of its quality and quantity as required by organizational procedures and submitted to issuing personnel for storage and safekeeping"
              },
              {
                "number": "3.4",
                "text": "Notification of work completion is made to appropriate person(s) in accordance with organizational procedures"
              },
              {
                "number": "3.5",
                "text": "Work area, tools and equipment are cleaned and stored in accordance with OHS and organizational requirements --- PDF PAGE 43 --- TR-JEWELRY MAKING (Fine Jewelry) NC III Promulgated: Nov. 25, 2010 41 RANGE OF VARIABLES VARIABLE RANGE"
              }
            ]
          },
