        "source_text": "--- PDF PAGE 20 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC III               Promulgated: Nov. 25, 2010 \n18 \nUNIT OF COMPETENCY : \nUSE RELEVANT TECHNOLOGIES \n \nUNIT CODE \n: \n500311114 \n \nUNIT DESCRIPTOR \n: \nThis unit of competency covers the knowledge, \nskills, and attitude required in selecting, sourcing \nand \napplying \nappropriate \nand \naffordable \ntechnologies in the workplace.                          \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1.  Study/select \nappropriate \ntechnology \n \n 1.1 \nUsage of different technologies is determined based \non job requirements \n1.2. \nAppropriate technology is selected as per work \nspecification \n2.  Apply relevant \ntechnology \n \n2.1 \nRelevant technology is effectively used in carrying   \nout function \n2.2 \nApplicable software and hardware are used as per   \ntask requirement \n2.3 \nManagement concepts are observed and practiced \nas per established industry practices \n3.  Maintain/enhance \nrelevant technology \n3.1 \nMaintenance of technology is applied in accordance \nwith the industry standard operating procedure, \nmanufacturer’s operating guidelines and \noccupational health and safety procedure to \nensure its operative ability \n3.2 \nUpdating of technology is maintained through \ncontinuing education or training in accordance with \njob requirement  \n3.3 \nTechnology failure/ defect is immediately reported  to \nthe concern/responsible person or section for \nappropriate action\n\n--- PDF PAGE 21 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC III               Promulgated: Nov. 25, 2010 \n19 \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Technology \nMay include but are not limited to: \n1.1 \nOffice technology \n1.2 \nIndustrial technology \n1.3 \nSystem technology \n1.4 \nInformation technology \n1.5 \nTraining technology \n2. Management \nconcepts \nMay include but not limited to: \n2.1 \nReal Time Management \n2.2 \nKAIZEN or continuous improvement \n2.3 \n5 S \n2.4 \nTotal Quality Management \n2.5 \nOther management/productivity tools \n3. Industry standard \noperating procedure \n3.1 \nWritten guidelines relative to the usage of office \ntechnology/equipment \n3.2 \nVerbal advise/instruction from the co-worker \n4. Manufacturer’s \noperating guidelines/ \ninstructions  \n4.1 \nWritten instruction/manuals of specific \ntechnology/equipment \n4.2 \nGeneral instruction manual \n4.3 \nVerbal advise from manufacturer relative to the \noperation of equipment \n5. Occupational health \nand safety procedure \n5.1 \nRelevant statutes on OHS \n5.2 \nCompany guidelines in using technology/equipment \n6. Appropriate action \n6.1 \nImplementing preventive maintenance schedule  \n6.2 \nCoordinating with manufacturer’s technician\n\n--- PDF PAGE 22 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC III               Promulgated: Nov. 25, 2010 \n20 \n \nEVIDENCE GUIDE \n \n1. Critical aspects of \ncompetency \n \n \nAssessment requires evidence that the candidate: \n1.1 \nStudied and selected appropriate technology \nconsistent with work requirements   \n1.2 \nApplied relevant technology \n1.3 \nMaintained and enhanced operative ability of relevant \ntechnology \n2. Underpinning \nknowledge and \nattitudes \n2.1 \nAwareness on technology and its function \n2.2 \nRepair and maintenance procedure \n2.3 \nOperating instructions \n2.4 \nApplicable software \n2.5 \nCommunication techniques \n2.6 \nHealth and safety procedure \n2.7 \nCompany policy in relation to relevant technology  \n2.8 \nDifferent management concepts \n2.9 \nTechnology adaptability \n3. Underpinning skills \n3.1 \nRelevant technology application/implementation \n3.2 \nBasic communication skills \n3.3 \nSoftware applications skills \n3.4 \nBasic troubleshooting skills  \n4. Resource \nimplications \nThe following resources MUST be provided: \n4.1 \nRelevant technology \n4.2 \nInterview and demonstration questionnaires \n4.3 \nAssessment packages \n5. Method of \nassessment \nCompetency may be assessed through: \n5.1 \nInterview \n5.2 \nActual demonstration \n5.3 \nAuthenticated portfolio (related certificates of \ntraining/seminar) \n6. Context of \nassessment \n6.1 \nCompetency may be assessed in actual workplace or \nsimulated environment\n",
