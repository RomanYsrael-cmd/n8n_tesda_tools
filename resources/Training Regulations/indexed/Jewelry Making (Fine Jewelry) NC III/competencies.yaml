        "evidence_guide": {
          "source_text": "1. Critical aspects\nof Competency\n\nAssessment requires evidence that the candidate:\n1.1 Identified wax modeling requirements based on design\nspecifications\n1.2 Selected and checked tools, machineries and equipment\nappropriate to job requirements\n1.3 Conducted material preparation using safe operating\npractices and protective equipment in accordance with\nOH&S and organizational requirements\n1.4 Produced wax models in accordance with design\nrequirements\n1.5 Submitted finished item for final quality control and\ndocumentation in accordance with organizational\nrequirements\n1.6 Notified work completion to appropriate person/s in\naccordance with organizational procedures\n1.7 Cleaned and stored work area, tools and equipment in\naccordance with OHS and organizational requirements\n1.8 Used personal protective equipment (PPE) in accordance\nwith job requirements and OHS requirements\n2. Underpinning\nKnowledge\n\n2.1 Philippine National Standard (PNS) on jewelry\n2.2 Types of jewelry\n2.3 Properties of waxes\n2.4 Wax modeling techniques and procedures\n2.5 Factors affecting construction of wax model, including\ntype of wax, hand tools, method of construction, final\nfinish, weight of finished product\n2.6 Tools and equipment for wax modeling\n2.7 Design specifications\n2.8 Product Evaluation (Wax to metal ratio)\n2.9 Effects of casting shrinkage and finishing processes\n2.10 Safe work practices and procedures/OH&S requirements\n2.11 First-aid measures\n2.12 Accounting of unused/excess materials\n\n--- PDF PAGE 69 ---\n67\nTR-JEWELRY MAKING (Fine Jewelry) NC III Date Promulgated: Nov. 2010\n\n3. Underpinning\nSkills\n3.1 Clarifying design specifications\n3.2 Handling wax modeling tools\n3.3 Using protective safety equipment\n3.4 Reading and interpreting routine information on written job\ninstructions, specifications and standard operating\nprocedures\n3.5 Using measurement skills\n3.6 Planning, sequencing operations\n3.8 Evaluating product\n3.7 Applying first-aid measures\n\n4. Resource\nImplications\nThe following resources should be provided:\n4.1 Materials relevant to the activity\n4.2 Tools and equipment\n4.3 PPE\n4.4 Appropriately illuminated and ventilated workplace\n4.5 Fire extinguisher\n4.6 Exhaust fan\n4.7 Documentation\n5. Method of\nAssessment\nCompetency in this unit may be assessed through:\n5.1 Direct observation with oral questioning\n5.2 Demonstration with oral questioning\n5.3 Portfolio (Training Certificates, Certificate of Employment,\nWorkpiece, etc.)\n5.4 Third-Party Report\n\n6. Context of\nAssessment\n6.1 Competency may be assessed in the workplace or in a\nsimulated work environment (TESDA Accredited\nAssessment Center)\n\n--- PDF PAGE 70 ---\n68\nTR-JEWELRY MAKING (Fine Jewelry) NC III Date Promulgated: Nov. 2010\nUNIT OF COMPETENCY: ENGRAVE JEWELRY\n\nUNIT CODE :"
