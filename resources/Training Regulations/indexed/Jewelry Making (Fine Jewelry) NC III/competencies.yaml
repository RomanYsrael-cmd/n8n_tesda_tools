        "source_title": "LEAD SMALL TEAMS",
        "source_text": "--- PDF PAGE 7 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC III               Promulgated: Nov. 25, 2010 \n5 \nUNIT OF COMPETENCY : \nLEAD SMALL TEAMS \n \nUNIT CODE \n: \n500311110 \n \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge, skills and attitudes \nto lead small teams including setting and \nmaintaining team and individual performance \nstandards.  \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables\n1. Provide team \nleadership \n1.1 \nWork requirements are identified and presented to team \nmembers. \n1.2 \nReasons for instructions and requirements are \ncommunicated to team members. \n1.3 \nTeam members’ queries and concerns are recognized, \ndiscussed and dealt with.\n2. Assign \nresponsibilities \n2.1 \nDuties,  and responsibilities are allocated having regard to \nthe skills, knowledge and aptitude required to properly \nundertake the assigned  task and according to company \npolicy. \n2.2 \nDuties are allocated having regard to individual preference, \ndomestic and personal considerations, whenever possible.\n3. Set \nperformance \nexpectations \nfor team \nmembers \n3.1 \nPerformance expectations are established based on client \nneeds and according to assignment requirements. \n3.2 \nPerformance expectations are based on individual team \nmembers duties and area of responsibility. \n3.3 \nPerformance expectations are discussed and disseminated \nto individual team members.\n4. Supervise team \nperformance \n4.1 \nMonitoring of performance takes place against defined \nperformance criteria and/or assignment instructions and \ncorrective action taken if required. \n4.2 \nTeam members are provided with feedback, positive \nsupport and advice on strategies to overcome any \ndeficiencies. \n4.3 \nPerformance issues which cannot be rectified or \naddressed within the team are referenced to appropriate \npersonnel according to employer policy. \n4.4 \nTeam members are kept informed of any changes in the \npriority allocated to assignments or tasks which might \nimpact on client/customer needs and satisfaction. \n4.5 \nTeam operations are monitored to ensure that \nemployer/client needs and requirements are met. \n4.6 \nFollow-up communication is provided on all issues affecting \nthe team. \n4.7 \nAll relevant documentation is completed in accordance with \ncompany procedures.\n\n--- PDF PAGE 8 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC III               Promulgated: Nov. 25, 2010 \n6 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Work requirements \n1.1 Client Profile \n1.2 Assignment instructions \n2. Team member’s \nconcerns\n2.1 Roster/shift details \n3. Monitor performance \n3.1 \nFormal process \n3.2 \nInformal process \n4. Feedback \n4.1 \nFormal process \n4.2 \nInformal process \n5. Performance issues \n5.1 \nWork output \n5.2 \nWork quality \n5.3 \nTeam participation \n5.4 \nCompliance with workplace protocols \n5.5 \nSafety \n5.6 \nCustomer service\n\n--- PDF PAGE 9 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC III               Promulgated: Nov. 25, 2010 \n7 \nEVIDENCE GUIDE \n \n1. Critical aspects of \ncompetency  \nAssessment requires evidence that the candidate: \n1.1 \nMaintained or improved individuals and/or team \nperformance given a variety of possible scenario \n1.2 \nAssessed and monitored team and individual \nperformance against set criteria \n1.3 \nRepresented concerns of a team and individual to \nnext level of management or appropriate specialist \nand to negotiate on their behalf \n1.4 \nAllocated duties and responsibilities, having regard to   \nindividual’s knowledge, skills and aptitude and the \nneeds of the tasks to be performed \n1.5 \nSet and communicated performance expectations for \na range of tasks and duties within the team and \nprovided feedback to team members\n2. Underpinning \nknowledge and \nattitudes \n2.1 \nCompany policies and procedures \n2.2 \nRelevant legal requirements \n2.3 \nHow performance expectations are set \n2.4 \nMethods of Monitoring Performance \n2.5 \nClient expectations \n2.6\nTeam member’s duties and responsibilities\n3. Underpinning skills \n3.1 \nCommunication skills required for leading teams \n3.2 \nInformal performance counseling skills \n3.3 \nTeam building skills \n3.4\nNegotiating skills\n4. Resource \nimplications \nThe following resources MUST be provided: \n4.1 \nAccess to relevant workplace or appropriately \nsimulated environment where assessment can take \nplace \n4.2\nMaterials relevant to the proposed activity or task\n5. Method of \nassessment \nCompetency may be assessed through: \n5.1 \nDirect observations of work activities of the individual \nmember in relation to the work activities of the group \n5.2 \nObservation of simulation and/or role play involving \nthe participation of individual member to the \nattainment of organizational goal \n5.3 \nCase studies and scenarios as a basis for discussion \nof  issues and strategies in teamwork\n6. Context of \nassessment \n6.1 \nCompetency assessment may occur in workplace or \nany appropriately simulated environment. \n6.2 \nAssessment shall be observed while task are being \nundertaken whether individually or in-group.\n",
