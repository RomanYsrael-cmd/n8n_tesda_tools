E \n1. Analytical techniques \n1.1 \nBrainstorming \n1.2 \nIntuitions/Logic \n1.3 \nCause and effect diagrams \n1.4 \nPareto analysis \n1.5 \nSWOT analysis \n1.6 \nGant chart, Pert CPM and graphs \n1.7 \nScattergrams  \n2. Problem \n2.1 \nNon – routine process and quality problems \n2.2 \nEquipment selection, availability and failure \n2.3 \nTeamwork and work allocation problem \n2.4 \nSafety and emergency situations and incidents \n3. Action plans  \n \n3.1 \nPriority requirements \n3.2 \nMeasurable objectives \n3.3 \nResource requirements \n3.4 \nTimelines \n3.5 \nCo-ordination and feedback requirements \n3.6 \nSafety requirements \n3.7 \nRisk assessment \n3.8 \nEnvironmental requirements\n\n--- PDF PAGE 15 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC III               Promulgated: Nov. 25, 2010 \n13 \nEVIDENCE GUIDE \n \n1. Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1 \nIdentified the problem. \n1.2 \nDetermined the fundamental causes of the problem. \n1.3 \nDetermined the correct / preventive action. \n1.4 \nProvided recommendation to manager. \nThese aspects may be best assessed using a range \nof scenarios / case studies / what ifs as a stimulus \nwith a walk through forming part of the response. \nThese assessment activities should include a range \nof problems, including new, unusual and improbable \nsituations that may have happened.\n2. Underpinning \nknowledge and \nattitudes \n2.1 \nCompetence includes a thorough knowledge and  \nunderstanding of the process, normal operating \nparameters, and product quality to recognize non-\nstandard situations \n2.2 \nCompetence to include the ability to apply and \nexplain, sufficient for the identification of fundamental \ncause, determining the corrective action and provision \nof recommendations \n2.2.1 Relevant equipment and operational processes\n2.2.2 Enterprise goals, targets and measures \n2.2.3 Enterprise quality, OHS and environmental \nrequirement \n2.2.4 Principles of decision making strategies and \ntechniques \n2.2.5 Enterprise information systems and data \ncollation \n2.2.6 Industry codes and standards\n3. Underpinning skills \n3.1 \nUsing range of formal problem solving techniques \n3.2 \nIdentifying and clarifying the nature of the problem \n3.3 \nDevising the best solution \n3.4 \nEvaluating the solution \n3.5 \nImplementation of a developed plan to rectify the \nproblem\n4. Resource \nimplications \n4.1 \nAssessment will require access to an operating plant \nover an extended period of time, or a suitable method \nof gathering evidence of operating ability over a range \nof situations. A bank of scenarios / case studies / \nwhat ifs will be required as well as bank of questions \nwhich will be used to probe the reason behind the \nobservable action.\n\n--- PDF PAGE 16 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC III               Promulgated: Nov. 25, 2010 \n14 \n \n \n5. Method of \nassessment \nCompetency may be assessed through: \n5.1 \nCase studies on solving problems in the workplace \n5.2 \nObservation \nThe unit will be assessed in a holistic manner as is \npractical and may be integrated with the assessment \nof other relevant units of competency. Assessment \nwill occur over a range of situations, which will include \ndisruptions to normal, smooth operation. Simulation \nmay be required to allow for timely assessment of \nparts of this unit of competency. Simulation should be \nbased on the actual workplace and will include walk \nthrough of the relevant competency components. \n6. Context of \nassessment \n6.1 \nIn all workplace, it may be appropriate to assess this \nunit concurrently with relevant teamwork or operation \nunits.\n",
