        "source_text": "DCJ731305\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes\nin fabricating multi-parts jewelry of fine jewelry.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Prepare\nrequirements for\nfabrication\n\n1.1 Jewelry design construction, dimension, composition\ncharacteristic and finishing requirements are\nestablished from predetermined specifications in\naccordance with client requirements and\norganizational standard\n1.2 Fabrication and finish specifications and required\noutcomes as indicated in the prescribed form are\nconfirmed and clarified as necessary with\nappropriate person(s) and in accordance with\norganizational and client requirements\n1.3 Appropriate preparation and fabrication\ntechniques are established in accordance with in\naccordance with job requirements and organizational\nprocedures\n1.4 Fabrication and finishing activities are prioritized in\naccordance with designated timeframes,\norganizational and specific design requirements\n1.5 Tools, machineries and equipment are selected,\nrequested and checked for operational effectiveness\nin accordance with the manufacturer’s specification\nand organizational procedures.\n1.6 Materials and consumables are also selected,\nrequested and obtained in accordance with\norganizational requirements and in consultation with\nappropriate person/s\n1.7 Material preparation is conducted using safe\noperating practices and protective equipment, in\naccordance with OHS and organizational\nrequirements\n\n--- PDF PAGE 42 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC III Promulgated: Nov. 25, 2010\n40\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n2. Perform fabrication\n\n2.1 Pre-formed multi-parts materials are fabricated to\nproduce components using applicable fabrication\nactivities in accordance with OH&S, organizational\nand industry accepted methods\n2.2 Fabricated item is checked to ensure construction\nconforms with required specifications and quality,\napplicable to industry organizational standard\n2.3 When necessary, defective items are\nreworked/retouched in accordance with specifications\nand organizational procedures\n2.4 Proper care in handling and accounting of materials is\nstrictly observed to ensure that quality and quantity is\nfollowed in accordance with the organizational\nrequirements\n3. Perform post-\nfabrication activities\n3.1 Documentation completed and processed in\naccordance with organizational requirements and\nstandards\n3.2 Finished product is quality checked for dimension\nand construction in accordance with clients’\nspecifications and organizational requirements\n3.3 Unused/excess materials of same kind and quality are\nmelted together for proper re-testing of its quality and\nquantity as required by organizational procedures and\nsubmitted to issuing personnel for storage and\nsafekeeping\n3.4 Notification of work completion is made to appropriate\nperson(s) in accordance with organizational\nprocedures\n3.5 Work area, tools and equipment are cleaned and\nstored in accordance with OHS and organizational\nrequirements\n\n--- PDF PAGE 43 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC III Promulgated: Nov. 25, 2010\n41\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Appropriate\nperson(s)\nMay include but are not limited to:\n1.1 Supervisor\n1.2 Quality Control Personnel\n1.3 Designer\n2. Appropriate\npreparation and\nfabrication\ntechniques\nMay include but are not limited to:\n2.1 Gemstones are pre-positioned to develop an imaginary\npicture of the jewelry to be fabricated\n2.2 Appropriate pre-fabricated materials and components\nare prepared, selected, requested and obtain from the\nissuing officer\n2.3 Gemstones are calibrated using precision devices for\nproper construction of holders on its mounting.\n2.4 Necessary patterns for cut out parts are develop\n2.5 Design modification is often suggested for better\nappearance of the design especially with multiple\nnumbers of bigger sizes of stone\n2.6 Type of bezel to hold smaller gems are prepared and\nselected to ensure best appearance for the required\ndesign.\n2.7 Tools, machineries and equipment are selected and\nprepared to ensure the smooth flow of work\n2.8 Required materials are requested and obtained to start\nthe process\n2.9 Size replica of bigger stones are made to avoid accident\nof loss and damage during the process... these materials\nare entrusted to issuing person properly for safe keeping\nwhile it is readily available in cases of needs\n3. Fabrication and\nfinishing activities\nMay include but are not limited to:\n3.1 Make mounting for major gemstone(s)\n3.2 Make mountings for lesser size gem.\n3.3 Cut, shape, file and detail part required in the\n Design\n3.4 Assemble top portion of the item by soldering parts\ntogether\n3.5 Make appropriate shank, clips, and other parts required\nto its function...\n3.6 Re-check sizes, thickness, height and other specification\n3.7 Pre-polish major parts before final assembly\n3.8 Seek second opinion. from appropriate person(s) before\nfinal assembly\n3.9 De-oxidize item\n3.10 Fine finish items using finer grit sand paper\n\n--- PDF PAGE 44 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC III Promulgated: Nov. 25, 2010\n42\n\nVARIABLE\nRANGE\n\n3.11 Present finished product to proper personnel for quality\ninspection.\n3.12 Re-melt left over (filings, small cuttings, unused tiny\nparts) metal materials ensuring that no other metal was\nmix to guarantee maintenance of the quality of metal(s)\n4.\nTools,\nmachineries\n and equipment\nMay include but not limited to:\nHand tools\n4.1 Measuring devises\n4.2 Different Jewelers’ pliers\n4.3 Jewelers’ saw\n4.4 Set of files\n4.5 Set of needle files\n4.6 Sear\n4.7 Tweezers\n4.8 Ball hammers\n4.9 Rawhide or wood mallet\n4.10 Ring mandrel\n4.11 Assorted rubber wheels with mandrels\n Equipment and Machineries\n4.12 Work bench\n4.13 Anvil\n4.14 Melting and soldering blow torch\n4.15 Roll press\n4.16 Motor with flexible shaft\n5. Materials\nMay include but not limited to:\n5.1 Precious metals\n 5.1.1 Gold\n 5.1.2 Silver\n5.2 Non- precious base metals\n 5.2.1 Copper Nickel\n 5.2.2 Zinc\n 5.2.3 Brass\n5.3 Precious and/or Non- precious gemstones\n5.4 Non-traditional materials for jewelry making e.g.\n Leather, sea shells, woods etc….\n\n--- PDF PAGE 45 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC III Promulgated: Nov. 25, 2010\n43\n\nVARIABLE\nRANGE\n6. Consumables\nMay include but not limited to:\n6.1 Chemicals\n 6.1.1 Borax\n 6.1.2 Boric Acid\n 6.1.3 Potassium Nitrate\n 6.1.4 Alum\n6.2 Supplies\n 6.2.1 Fuel\n 6.2.2 Emery paper\n 6.2.3 Solder\n 6.2.4 Burs\n 6.2.5 Drill bits\n7. Material\npreparation\nMay include but not limited to:\n7.1 Anneal pre-fabricated materials, e.g. tube, wires,\n Sheets etc…\n7.2 Test ready made components and pars ensuring\n proper quality\n7.3 Pre-alloyed metals:\n 7.3.1 Carefully check its weight,\n 7.3.2 Test its quality\n 7.3.3 Place in crucible with sufficient flux\n 7.3.4 Fuse all metals into complete liquid stage for sheet\n preparation requirements\n7.4 Pure metals\n 7.4.1 Ask help from appropriate person to do the\n alloying\n 7.4.2 Do the task on 7.1\n7.5 De- oxidize metal after annealing and before and\n after soldering\n7.6 Work area is free of other non ferrous metals to\n avoid contamination to materials (metals)\n8. Documentation\nMay include but are not limited to:\n8.1 Job Order form\n8.2 Work instructions and procedures\n8.3 Materials and consumables used\n8.4 Time and record sheets\n8.5 Unused/excess materials\n\n--- PDF PAGE 46 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC III Promulgated: Nov. 25, 2010\n44\n\nEVIDENCE GUIDE\n\n1. Critical Aspects\nof Competency\n\nAssessment requires evidence that the candidate:\n1.1\nIdentified and established fabrication requirements for\ndifferent multi-parts(traditional and non-traditional) design of\njewelry requirements based from predetermined\nspecifications in accordance with organizational and client\nrequirements\n1.2\nSelected and obtained tools, equipment, materials and\nconsumables with appropriate person/s in accordance with\norganizational and OH&S requirements\n1.3\nPerformed fabrication in accordance with OH&S,\norganizational and industry accepted methods\n1.4\nFabricated items are checked for quality and to ensure\nconstruction conforms with required specifications and\norganizational requirements and standards\n1.5\nWhen necessary, reworked/retouched defective items in\naccordance with specifications and organizational\nprocedures\n1.6\nChecked finished product for quality, dimension and\nconstruction in accordance with client’s specifications and\norganizational requirements\n1.7\nNotified work completion to appropriate person/s in\naccordance with organizational procedures\n1.8\nCleaned and stored work area, tools and equipment in\naccordance with OHS and organizational requirements\n1.9\nUsed personal protective equipment (PPE) in accordance\nwith job requirements and OHS requirements\n1.10 Demonstrated knowledge on calculation and measurements\n2 Underpinning\nKnowledge\n2.1\nTypes of jewelry\n2.2\n Multi-parts jewelry fabrication and assembly\n2.3\nProperties of metals used in jewelry\n2.4\nBasic knowledge in tools, machineries and equipment, its\nusage and serviceability\n2.5\nRelevant materials and consumables used in jewelry\nfabrication\n2.6\nDesign interpretation and specification\n2.7\nPhilippine National Standard on jewelry\n2.8\nSafe work practices and procedures/OH & S requirements\n2.9\nAccounting of unused/excess materials\n2.10\nFirst-aid measures\n\n--- PDF PAGE 47 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC III Promulgated: Nov. 25, 2010\n45\n\n3. Underpinning\nSkills\n3.1 Following oral and written instructions.\n3.2 Reading and interpreting specification, illustrations and\ndrawings\n3.3 Measurements, weighing and calculation\n3.5 Ability to identify appropriate tools, machineries and\nequipment\n3.6 Applying manufacturing techniques\n3.7 Applying first-aid measures\n3.7 Applying safe working skills\n3.8 Identifying alternative metals\n4. Resource\nImplications\nThe following resources should be provided:\n4.1 Materials relevant to the activity\n4.2 Tools, machineries and equipment\n4.3 Consumables\n4.4 PPE\n4.5 Workplace\n4.6 Documentation\n4.7 Exhaust fan\n4.8 Fire extinguisher\n5. Method of\nAssessment\nCompetency in this unit must may be assessed through:\n5.1 Demonstration with oral questioning\n5.2 Portfolio (Training Certificates, Certificate of Employment,\nWork pieces, etc.)\n5.3 Third-Party Report\n6. Context of\nAssessment\n6.1 Competency may be assessed in the workplace or in a\n simulated work environment (TESDA Accredited Assessment\n Center)\n\n--- PDF PAGE 48 ---\nTR-JEWELRY MAKING (Fine Jewelry) NC III Promulgated: Nov. 25, 2010\n46\nUNIT OF COMPETENCY : FABRICATE COMPLEX AND INTRICATELY\nDESIGNED JEWELRY\n\nUNIT CODE :"
