    "source_text": "3.1 CURRICULUM DESIGN\n\nCourse Title: JEWELRY MAKING\n NC Level: III\n\nNominal Training Duration: 20 Hrs. (Basic Competencies)\n\n 24 Hrs. (Common Competencies)\n\n 1,920 Hrs. (Core Competencies)\nCourse Description:\n\nThis course is designed to provide knowledge, skills, and attitude along Jewelry\nMaking NC III in accordance with industry standards. It covers the basic, common and\ncore competencies on mensurations and calculations, managing own performance,\napplication of first-aid, application of quality and safety standards, fabricating multi-\nparts, complex and intricately designed jewelry, stone-setting, metal casting, producing\nwax model and engraving jewelry.\n\nTo obtain this, all units prescribed for this qualification must be achieved.\n\nBASIC COMPETENCIES\n(20 Hours)\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Lead workplace\ncommunication\n1.1\nCommunicate\ninformation about\nworkplace processes\n1.2\nLead workplace\ndiscussions\n1.3\nIdentify and\ncommunicate issues\narising in the\nworkplace\n• Group\ndiscussion\n• Interaction\n• Lecture\n• Reportorial\n\n• Written test\n• Practical/\nperformance\ntest\n• Interview\n2. Lead small\nteams\n2.1\nProvide team\nleadership\n2.2\nAssign responsibilities\namong members\n2.3\nSet performance\nexpectation for team\nmembers\n2.4\nSupervise team\nperformance\n• Group\ndiscussion/\ninteraction\n• Case studies\n• Simulation\n• Written test\n• Observation\n• Simulation\n• Role playing\n\n--- PDF PAGE 75 ---\n73\nTR-JEWELRY MAKING (Fine Jewelry) NC III Date Promulgated: Nov. 2010\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n3. Develop and\npractice\nnegotiation skills\n3.1\nIdentify relevant\ninformation in\nplanning negotiations\n3.2\nParticipate in\nnegotiations\n3.3\nDocument areas for\nagreement\n• Interactive –\nlecture\n• Simulation\n• Demonstratio\nn\n• Self-paced\nlearning\n• Group\nDiscussion\n• Structured\nactivity\n• Role play\n• Interview\n• Written\nexamination\n4. Solve workplace\nproblem related\nto work activities\n4.1\nExplain the analytical\ntechniques\n4.2\nIdentify the problem.\n4.3\nDetermine the\npossible cause/s of\nthe problem\n• Interactive –\nlecture\n• Simulation\n• Symposium\n• Group\ndynamics\n• Film Viewing\n• Situation\nanalysis\n• Self-paced\nlearning\n• Situation\nanalysis\n• Interview\n• Practical\nexamination\n• Written\nexamination\n• Simulation\n5. Use\nmathematical\nconcepts and\ntechniques\n5.1\nExplain the analytical\ntechniques\n5.2\nIdentify mathematical\ntools and techniques\nto solve problem\n5.3\nApply mathematical\nprocedures/ solution\n5.4\nAnalyze results\n• Lecturette\n• Self-paced\nlearning\n• Group\ndiscussion\n• Practical work\napproach\n• Research\nstudy\n• Written test\n• Demonstration\n• Oral Interview\n6. Use relevant\ntechnologies\n6.1\nIdentify appropriate\ntechnology\n6.2\nApply relevant\ntechnology\n6.3\nMaintain/ enhance\nrelevant technology\n• Lecturette\n• Self-paced\nlearning\n• Group\ndiscussion\n•\nFilm showing\n• Written test\n• Interview\n\n--- PDF PAGE 76 ---\n74\nTR-JEWELRY MAKING (Fine Jewelry) NC III Date Promulgated: Nov. 2010\nCOMMON COMPETENCIES\n(24Hours)\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Observe\nprocedures\nspecifications\nand manuals of\ninstructions\n\n1.1 Identify, access and\ninterpret\nspecification/manuals\n1.2 Apply information in\nmanual\n1.3 Store manuals\n• Classroom\ndiscussions/\nLecture\n\n• Self-paced\nlearning\n\n• Demonstration\n\n• Practical\nexamination\n\n• Oral\nExamination\n\n• Written test/\nquestioning\n\n• Direct\nobservation\n2. Perform\nmensurations\nand calculations\n\n2.1 Select measuring\ninstruments\n\n2.2 Carry out\nmeasurements and\ncalculations\n\n• Lecture/\ndemonstration\n\n• Group\nDiscussion\n\n• Self-paced\nlearning\n\n• Oral\nquestioning\n\n• Written Test\n\n• Direct\nobservation\n\n• Demonstration\n3. Manage own\nperformance\n3.1 Plan own workload\n3.2 Maintain quality of own\nperformance\n3.3 Establish credibility\nwith customers/clients\n• Lecture\n• Group\nDiscussion\n• Role play\n• Demonstration\nwith\nquestioning\n• Interviews\n•Written report\n4. Applying quality\nstandards\n4.1 Assess quality of\nreceived materials or\ncomponents\n\n4.2 Assess own work\n\n4.3 Engage in process\nimprovement\n• Lecture\n\n• Discussion\n\n• Hands-on\n\n• Role-Play\n• Interview\n\n• Written report\n5. Apply basic first\naid\n5.1 Assess the situation\n\n5.2 Apply basic first aid\ntechniques\n\n5.3 Communicate details of\nthe incident\n\n• Lecture\n\n• Demonstration\n\n• Role-Play\n\n• Group\nDiscussion\n• Oral Test\n\n• Group Role-\nPlay\n• Interview\n\n--- PDF PAGE 77 ---\n75\nTR-JEWELRY MAKING (Fine Jewelry) NC III Date Promulgated: Nov. 2010\n\nCORE COMPETENCIES\n( 1,920 Hours)\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Fabricate multi-\nparts jewelry\n1.1 Prepare requirements\nfor fabrication\n1.2 Perform fabrication\n1.3 Perform post-\nfabrication activities\n• Lecture\n• Demonstration\n/ Film viewing\n• Self-paced\nlearning\n• Interview\n• Direct\nobservation\n• Demonstration\n• Written\nexamination\n2. Fabricate\ncomplex and\nintricately\ndesigned\njewelry\n2.1 Prepare requirements\nfor fabrication\n2.2 Perform fabrication\n2.3 Perform post-\nfabrication activities\n•\nLecture\n•\nDemonstratio\nn/ Film\nviewing\n•\nSelf-paced\nlearning\n• Interview\n• Written\n• Practical\n• Direct\nobservation\n3. Perform stone\nsetting activities\n3.1 Perform stone setting\npreparatory activities\n3.2 Perform stone setting\n3.3 Perform post-stone\nsetting activities\n• Lecture\n• Demonstration\n/ Film viewing\n• Self-paced\nlearning/\nmodular\n•E-learning\n• Interview\n• Direct\nobservation\n• Demonstration\n• Written\nexamination\n4. Perform jewelry\nmetal casting\n4.1 Prepare pre- casting\noperation\n4.2 Perform casting\noperations\n4.3 Perform post-casting\noperations\n•\nLecture\n•\nDemonstratio\nn/ Film\nviewing\n•\nModular\n• Interview\n• Written\n• Practical\n• Direct\nobservation\n5. Produce\njewelry wax\nmodel\n5.1 Prepare for wax\nmodeling activities\n5.2 Produce wax models\n5.3 Perform post wax\nmodeling activities\n•\nLecture\n•\nDemonstratio\nn/ Film\nviewing\n•\nModular\n• Interview\n• Written\n• Practical\n• Direct\nobservation\n\n--- PDF PAGE 78 ---\n76\nTR-JEWELRY MAKING (Fine Jewelry) NC III Date Promulgated: Nov. 2010\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n6. Engrave jewelry\n6.1 Perform engraving\npreparatory activities\n6.2 Perform engraving\n6.3 Perform post-\nengraving activities\n•\nLecture\n•\nDemonstratio\nn/ Film\nviewing\n•\nModular\n• Interview\n• Written\n• Practical\n• Direct\nobservation\n\n* For the Core Competencies, the training provider may choose to include practicum\nor on-the-job training as a training methodology."
