    {
      "number": "4.2",
      "text": "Individuals aspiring to be awarded the qualification of JEWELRY MAKING NC III must acquire Certificates of Competency in all of the following group or individual core units of the Qualification. Candidates may apply for assessment in any accredited assessment center. 4.2.1 Fabricating complicated jewelry 4.2.1.1 Fabricate multi-parts jewelry 4.2.1.2 Fabricate complex and intricately designed jewelry 4.2.2 Perform stone setting activities 4.2.3 Perform jewelry metal casting 4.2.4 Produce jewelry wax model 4.2.5 Engrave jewelry Successful candidates shall be awarded Certificates of Competency (COCs)."
