      "text": "6 The guidelines on assessment and certification are discussed in detail in the “Procedures Manual on Assessment and Certification” and “Guidelines on the Implementation of the Philippine TVET Qualification and Certification System (PTQCS)”. --- PDF PAGE 88 --- 86 TR-JEWELRY MAKING (Fine Jewelry) NC III Date Promulgated: Nov. 2010 Perform hair bleaching Perform hair bleaching Observe procedures, specifications and manuals of instructions Manage own performance Perform mensurations and calculations Apply quality standards Demonstrate work values Practice housekeeping procedures Participate in workplace communication Work in team environment Practice career professionalism Work with others Develop and practice negotiation skills Use mathematical concepts and techniques Use relevant technologies Solve problems related to work activities Receive and respond to workplace communication Develop teams and individuals Utilize specialized communication skills Practice occupational health and safety procedures Lead workplace communication Collect, analyze and organize information Plan and organize work Apply problem- solving techniques in the workplace Lead small teams Promote environmental protection Fabricate multi-parts jewelry Fabricate complex and intricately designed jewelry Perform stone setting activities Perform jewelry metal casting Perform jewelry wax metal Perform rubber mold making Fabricate basic jewelry components Polish jewelry Plate jewelry Engrave jewelry Apply first-aid treatment --- PDF PAGE 89 --- 87 TR-JEWELRY MAKING (Fine Jewelry) NC III Date Promulgated: Nov. 2010 Alloy Combination of homogenized metals. Base metal mixed with precious ore to make it workable, harden it, or change its color Annealing metal Is a heat process whereby a metal is heated to a specific temperature/color and then allowed to cool slowly. This softens the metal which means it can be cut and shaped more easily. Antiquing Process of darkening recessed areas of to enhance the visibility of engraving Assay Process of establishing purity of gold, silver and other alloys Bail Connector at the top of a pendant. Enables pendant to hang from a chain or jumpring. Basse-taille (bass-tie) Technique of applying glass enamel to a metal surface that has been engraved deeply enough to hold the enamel when heated and has sides high enough to keep the enamel colors separate. Bezel setting The oldest and most basic gemstone setting, derived from the French word “Biseau” meaning chamfered. A collar style setting for a gemstone that offers more protection of softer or delicate minerals such as opal. Carre Setting Is where the stone is seated directly over a light well, and the stone is set by raising (hammering) four “spurs” with a “graver” tool. Carat Carat is a number from 1 to 24 that designates the percentage of pure gold in a sample of gold alloy. 24 carat represents pure gold. 18 carat indicates that 18/24 % or 75% of that sample is pure gold and the remainder is made up of metals other than gold Casting Method of shaping metal by melting and pouring into hollow molds. Less dense than wrought metals and requires additional polishing and finishing Channel setting Are primarily used to set faceted gemstones that are straight-sided, or quadrilateral in shape (baguette or princess cut) Electro-plating Electro chemical process of applying one metal to the surface of another. Engraving Process of decorating metal by gouging a design into its surface Gold Plating Is a method of depositing a thin layer of gold on the surface of other metal, most often copper or silver. It is often used in electronics, to provide a corrosion-resistant electrically conductive layer on copper, typically in electrical connectors and printed circuit boards. --- PDF PAGE 90 --- 88 TR-JEWELRY MAKING (Fine Jewelry) NC III Date Promulgated: Nov. 2010 Harden Hardening is the process of making a jewelry component more stiff and permanent. This can be accomplished in a variety of ways including hammering and work hardening. Invisible setting Setting style where rows of square cut gemstones rest flush edge to edge; all within a metal border or frame, with no metal separating individual gems Jewelry Wire Jewelry wire is soft wire used to make jewelry. Jewelry wire can be brass, copper, gold, sterling silver, fine silver, gold-filled and/or gold and silver plated wire. Jig A jig is a jewelry-making tool with a series of pegs used to form or shape wire. The most popular brand of jigs is the WigJig brand. Mounting Device that holds a gem in place Oxidation Chemical process to blacken or tarnish. Sulphur and oxygen is used on silver. Pave setting Is a tight grouping of identically sized stones laid across a flat, or convex surface, from the French word for “paved.” The stones are held in place using three to six raised beads per stone. Plating Is a surface covering in which a metal is deposited on a conductive surface. Plating is used to decorate objects, for corrosion inhibition, to improve solderability, to harden, to improve wearability, to reduce friction, to improve paint adhesion, to alter conductivity, for radiation shielding, and for other purposes. Jewelry typically uses plating to give a silver or gold finish. Polishing Polishing is the process of smoothing the surface of an object. With jewelry wire polishing results in a shiny appearance and can remove minor tool marks or blemishes. Frequently polishing involves using a mildly abrasive polishing compound to remove a thin layer of material. Prong setting The most common variety for faceted gemstones is a prong setting, with either 3 or 4 prongs that hold the stone in place. This type of setting exposes the maximum amount of light to the sides and bottom (pavilion). Precious metal Metals valued for their color, malleability, and rarity; gold, silver and platinum Quenching Quenching is a process for heat treating metals to change its hardness. This process involves heating the metal to a high temperature and then rapidly cooling it by dipping it in a liquid bath made of oil or water. --- PDF PAGE 91 --- 89 TR-JEWELRY MAKING (Fine Jewelry) NC III Date Promulgated: Nov. 2010 Rhodium Is a sheen of white metal. It is the rarest of all non-radioactive metals on Earth. The most expensive metal and the best in resistance to corrosion and tarnish under most environmental condition. Setting Method by which a stone is held into a mounting. Soldering Technique used in making and repairing jewelry whereby two pieces of metal are joined when a molten metal with a lower melting point than the two metals being joined is used. Stamping Using a die set to cut or emboss metal with a mark Tiffany setting Usually round and elevated setting with six long slender prongs that flare from the base. Commonly used for large stones such as diamond soliitaires Tin A malleable semi-precious silvery metal that resists oxidation. Malleable at ordinary temperatures, but brittle when heated, tin acts as an agent in numerous alloys Vise A vise is a tool used for gripping and holding components very securely. Vises are often fastened to a table or other sturdy base. White gold Gold alloy made of nickel; sometimes contains palladium or zinc --- PDF PAGE 92 --- 90 TR-JEWELRY MAKING (Fine Jewelry) NC III Date Promulgated: Nov. 2010 The Technical Education and Skills Development Authority (TESDA) wishes to extend thanks and appreciation to the many representatives of business, industry, academe and government agencies who devoted their time and expertise in the development and validation of these Training Regulations. TECHNICAL EXPERTS: MS. CECILIA R. RAMOS Chairman Meycauayan Jewelry Industry Association, Inc. (MJIA) Philippine Jewelry Center Pandayan, Meycauayan, Bulacan MS. MA. LUISA D. UNSON President Philippine Jewelry Business Club Foundation, Inc. 1903 B West Tower (Tektite Bldg.), Philippine Stock Exchange Exchange Road, Ortigas Center, Pasig City MR. MIGUEL M. RODRIGUEZ Manager Miersons’ Jewelry 680 L. Sarno, Calvario, Meycauayan, Bulacan MR. PETER A. ZUNIGA President Confederation of Philippine Jewelers, Inc. Philippine Jewelry Center Malhacan, Meycauayan, Bulacan MR. ANGELINO V. GABON Hans Brumann, Inc. 134 Ground Floor, Legaspi Street Legaspi Village, Makati City MR. PEEWEE R. GARCIA Production Manager Ikthos 2436 Taal St., Malate, Manila MR. RUFINO L. RAMOS Proprietor Leah’s Jewelry Gen. Luna, Malabon City MS. SHIELA CLAVEL-TEJADA Consultant Philippine Jewelry Business Club Foundation, Inc. 1903 B West Tower (Tektite Bldg.), Philippine Stock Exchange Exchange Road, Ortigas Center, Pasig City MS. RHODORA PATRICIA C. TORRECAMPO Technician Education Specialist III Cottage Industry Technology Center (CITC) 20 Russet St., SSS Village, Marikina City MS. INGRID M. JAVALERA Sr. Trade and Industry Dev’t. Specialist Bureau of Export Trade Promotion 2nd Floor, Dept. of Trade and Industry DTI Int’l. Bldg., 375 Sen. Gil J. Puyat Ave., Makati City The Participants in the Validation of this Training Regulation • Members of the Cebu Fame Foundation Philippines, Inc. • Members of the Mindanao United Jewelry Association, Inc. The Members of the TESDA Board The MANAGEMENT and Staff of the TESDA Secretariat • Qualifications and Standards Office (QSO)"
