tten test\n7. Perform\nhousekeeping\nand safety\npractices\n\n7.1 Sort materials, tools and\nequipment\n7.2 Clean workplace area,\nmaterials, tools and\nequipment\n7.3 Systematize dispensing\nand retrieval of materials,\ntools and equipment\n7.4 Identify and minimize/\neliminate hazards\n7.5 Respond and record\naccidents\n7.6 Follow basic securities\n• Small Group\nDiscussion\n• Demonstration of\nPractical Skills\n• Modular\n\n• Demonstration\nand Oral\nquestioning\n• Written test\n\n--- PDF PAGE 72 ---\nTRAINING REGULATION - AIR DUCT SERVICING NC II\n71\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n8. Document work\naccomplished\n8.1 Identify forms and data\n8.2 Prepare reports\n• Small Group\nDiscussion\n• Demonstration of\nPractical Skills\n• Modular\n• Demonstration and\nOral questioning\n• Written Test\n\n\n\n\nCORE COMPETENCIES\n\nUnit of\nCompetency\n\nLearning Outcome\n\nMethodology\nAssessment\nApproach\n 1. Survey Site For\nAir Duct\nInstallation\n\n\n\n1.1 Interpret plan and\nspecifications\n1.2 Make preparations for site\nsurvey\n1.3 Prepare alteration and\ndeviation from the plan\n1.4 Prepare technical report\n• Discussion\n• Lecture\n• Plant visit\n\n• Questioning\n• Written report\n\n\n\n\n\n2. Fabricate Air\nDucts\n\n2.1 Prepare air duct\nrequirements\n2.2 Lay out sheet metal\n2.3 Cuts sheet metals to a\ngiven dimension\n2.4 Perform bending and\nfolding\n2.5 Join air duct components\n• Discussion\n• Demonstration\n• Practical exercises\n\n• Demonstration\n• Oral and written\nquestioning\n3. Install Air Duct\nSystem\n\n3.1 Prepare air duct installation\nrequirements\n3.2 Install/ Erect platforms and\nscaffoldings\n3.3 Install hangers & supports\n3.4 Install air duct system and\nits components\n• Discussion\n• Demonstration\n• Hands-on\n\n• Demonstration\n• Oral and written\nexam\n4. Perform Air Duct\nTesting\n\n\n4.1 Prepare for testing\n4.2 Test air duct\n\n• Discussion\n• Demonstration\n• Hands-on\n• Demonstration\n• 