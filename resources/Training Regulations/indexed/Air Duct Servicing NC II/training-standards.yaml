    "source_text": "SECTION 3 TRAINING STANDARDS \n \n \n \nThese guidelines are set to provide technical and vocational education and \ntraining (TVET) providers with information and other important requirements to \nconsider when designing training programs for AIR DUCT SERVICING NC II. \n \n \n3.1 \nCURRICULUM DESIGN \n \nCourse Title \n: AIR DUCT SERVICING \n \n \nNC Level \n: NC II \n \nNominal Duration : 144 Hours (Basic) \n 212 Hours (Common) \n 240 Hours (Core) \nCourse Description: \n \n \nThis course is designed to equip individual with operational skills to \ninstall, service and maintain, troubleshoot and repair Air Duct System In \nHVAC/R technology in accordance with Duct Construction Standards \n \nTo obtain this, all units prescribed for this qualification must be \nachieved: \n \n \nBASIC COMPETENCIES \n \nUnit of \nCompetency \nLearning Outcomes \nMethodology \nAssessment \nApproach \n1. Participate in \nworkplace \ncommunication \n1.1 Obtain and convey \nworkplace information \n1.2 Complete relevant work \nrelated documents \n1.3 Participate in workplace \nmeeting and discussion \nGroup discussion \nInteraction \n• \nDemonstration \n• \nInterview/ \nquestioning \n2. Work in a team \nenvironment \n2.1 Describe and identify team \nrole and responsibility in a \nteam \n2.2 Describe work as a team \nmember \nDiscussion \nInteraction \n• \nDemonstration \n• \nInterview/ \nquestioning\n\n--- PDF PAGE 70 ---\nTRAINING REGULATION - AIR DUCT SERVICING NC II \n69 \n \n \n \nUnit of \nCompetency \nLearning Outcomes \nMethodology \nAssessment \nApproach \n3. Practice career \nprofessionalism \n3.1 Integrate personal \nobjectives with \norganizational goals \n3.2 Set and meet work priorities \n3.3 Maintain professional \ngrowth and development \nDiscussion \nInteraction \n \n \n• \nDemonstration \n• \nInterviews/ \nquestioning \n4. Practice \noccupational \nhealth and \nsafety \n4.1 Evaluate hazard and risks \n4.2 Control hazards and risks \n4.3 Maintain occupational \nhealth and safety \nawareness \nDiscussion \nPlant tour \nSymposium \n• \nDemonstration \n• \nInterview \n \n \n \nCOMMON COMPETENCIES \n \n \nUnit of \nCompetency \nLearning Outcomes \nMethodology \nAssessment \nApproach \n1. Prepare \nmaterials and \ntools \n \n1.1 Identify materials and tools \n1.2 Request materials and \ntools \n1.3 Receive and inspect \nmaterials and tools \n• Self-paced/ \nModular \n• Demonstration \n• Small Group \nDiscussion \n• Distance \nEducation \n• Written \n• Practical / \nPerformance Test \n2. Observe \nprocedures, \nspecifications \nand manuals \nof instructions \n2.1 Identify and access \nspecifications and manuals \n2.2 Interpret manuals \n2.3 Apply information in \nmanuals \n• Discussion \n• Lecture \n• Modular \n \n \n• Written \n• Practical / \nPerformance Test \n \n \n3. Perform \nmensuration \nand calculation \n3.1 Select measuring \ninstruments \n3.2 Carry-out measurements \nand calculations \n \n \n• Self-paced/ \nModular \n• Demonstration \n• Small Group \nDiscussion \n• Distance \nEducation \n• Written/Oral \nExamination \n• Practical \nDemonstration\n\n--- PDF PAGE 71 ---\nTRAINING REGULATION - AIR DUCT SERVICING NC II \n70 \n \nUnit of \nCompetency \nLearning Outcomes \nMethodology \nAssessment \nApproach \n4. Perform basic \nbench work \n4.1 Prepare materials, tools \nand equipment for layout \n4.2 Layout features in \nworkplace \n4.3 Cut sheets, plates and bars \n4.4 Smooth sheets plates and \nbars \n4.5 Drill holes in sheets, plates \nand bars \n4.6 Bore holes in sheet plates \nand bars \n4.7 Bend sheets, plates and \nbars \n4.8 Join sheets, plates and \nbars \n• Modular \n• Film Showing \n• Demonstration \n• On-the-job training \n \n• Interview \n• Demonstration \n5. Perform basic \nelectrical works \n5.1 Measure and analyze \ncircuit and load resistance \nin electrical system \n5.2 Measure and analyze \nvoltage in electrical system \n5.3 Measure and analyze \ncurrent in electrical system \n5.4 Test simple electrical \ncomponents and \nconnections \n5.5 Repair minor electrical \nsystem troubles \n• Modular \n• Computer-based \ntraining \n(Simulation) \n• Demonstration \n• On- the-job \ntraining \n \n• Interview \n• Demonstration \n6. Maintain tools \nand equipment \n6.1 Check the conditions of \ntools and equipment \n6.2 Perform basic preventive \nmaintenance \n6.3 Store tools and equipment \n• Small Group \nDiscussion \n• Demonstration of \nPractical Skills \n• Modular \n• Demonstration \nand Oral \nquestioning \n• Written test \n7. Perform \nhousekeeping \nand safety \npractices \n \n7.1 Sort materials, tools and \nequipment \n7.2 Clean workplace area, \nmaterials, tools and \nequipment \n7.3 Systematize dispensing \nand retrieval of materials, \ntools and equipment \n7.4 Identify and minimize/ \neliminate hazards \n7.5 Respond and record \naccidents \n7.6 Follow basic securities \n• Small Group \nDiscussion \n• Demonstration of \nPractical Skills \n• Modular \n \n• Demonstration \nand Oral \nquestioning \n• Written test\n\n--- PDF PAGE 72 ---\nTRAINING REGULATION - AIR DUCT SERVICING NC II \n71 \n \nUnit of \nCompetency \nLearning Outcomes \nMethodology \nAssessment \nApproach \n8. Document work \naccomplished \n8.1 Identify forms and data \n8.2 Prepare reports \n• Small Group \nDiscussion \n• Demonstration of \nPractical Skills \n• Modular \n• Demonstration and \nOral questioning \n• Written Test \n \n \n \n \nCORE COMPETENCIES \n \nUnit of \nCompetency \n \nLearning Outcome \n \nMethodology \nAssessment \nApproach \n 1. Survey Site For \nAir Duct \nInstallation \n \n \n \n1.1 Interpret plan and \nspecifications \n1.2 Make preparations for site \nsurvey \n1.3 Prepare alteration and \ndeviation from the plan \n1.4 Prepare technical report \n• Discussion \n• Lecture \n• Plant visit \n \n• Questioning \n• Written report \n \n \n \n \n \n2. Fabricate Air \nDucts \n \n2.1 Prepare air duct \nrequirements \n2.2 Lay out sheet metal \n2.3 Cuts sheet metals to a \ngiven dimension \n2.4 Perform bending and \nfolding \n2.5 Join air duct components \n• Discussion \n• Demonstration \n• Practical exercises \n \n• Demonstration \n• Oral and written \nquestioning \n3. Install Air Duct \nSystem \n \n3.1 Prepare air duct installation \nrequirements \n3.2 Install/ Erect platforms and \nscaffoldings \n3.3 Install hangers & supports \n3.4 Install air duct system and \nits components \n• Discussion \n• Demonstration \n• Hands-on \n \n• Demonstration \n• Oral and written \nexam \n4. Perform Air Duct \nTesting \n \n \n4.1 Prepare for testing \n4.2 Test air duct \n \n• Discussion \n• Demonstration \n• Hands-on \n• Demonstration \n• Oral and written \nexam \n5. Insulate Air \nDuct \n5.1 Prepare insulation \nrequirements \n5.2 Insulate air duct \n5.3 Apply duct liners \n• Discussion \n• Demonstration \n• Hands-on \n• Demonstration \n• Oral and written \nexam \n6. Repair and \nMaintain Air Duct \nSystem \n6.1 Evaluate condition of air \nduct system \n6.2 Repair air duct system and \ncomponents \n6.3 Perform preventive \nmaintenance \n• Discussion \n• Demonstration \n• Hands-on \n• Demonstration \n• Oral and written \nexam\n\n--- PDF PAGE 73 ---\nTRAINING REGULATION - AIR DUCT SERVICING NC II \n72 \n \n3.2 TRAINING DELIVERY \n \n \nThe delivery of training should adhere to the design of the \ncurriculum. Delivery shall be guided by the 10 basic principles of \ncompetency-based TVET: \n \n• The training is based on curriculum developed from the \n \ncompetency standards; \n• Learning is modular in its structure; \n• Training delivery is learner-centered and should \n accommodate individualized and self-paced learning \n strategies; \n• Training is based on work that must be performed; \n• Training materials are directly related to the competency \n \nstandards and the curriculum modules; \n• Assessment is based in the collection of evidence of the \n \nperformance of work to the industry required standard; \n• Training is based both on and off-the-job components; \n• Training program allows for recognition of prior learning \n \n(RPL) or current competencies; \n• Training allows for multiple entry and exit; and \n• Training programs are registered with the UTPRAS. \n \nThe competency-based TVET system recognizes various types \nof delivery modes, both on and off-the-job as long as the learning is \ndriven by the competency standards specified by the industry. The \nfollowing training modalities may be adopted when designing training \nprograms: \n \n• The dualized mode of training delivery is preferred and \nrecommended. Thus programs would contain both in-school \nand in-industry training or fieldwork components. Details can \nbe referred to the Dual Training System (DTS) Implementing \nRules and Regulations. \n \n• Modular/self-paced is a competency-based training modality \nwherein the trainee is allowed to progress at his own pace. \nThe trainer facilitates the training delivery. \n \n• Peer teaching/mentoring is a training modality wherein fast \nlearners are given the opportunity to assist the slow learners. \n \n• Supervised Industry Training or On-the-Job Training is an \napproach in training designed to enhance the knowledge and \nskills of the trainee through actual experience in the\n\n--- PDF PAGE 74 ---\nTRAINING REGULATION - AIR DUCT SERVICING NC II \n73 \nworkplace to acquire specific competencies prescribed in the \ntraining regulations. \n \n• Distance learning is a formal education process in which \nmajority of the instruction occurs when the students and \ninstructor are not in the same place. Distance learning may \nemploy correspondence study, or audio, video or computer \ntechnologies. \n \n• Project-based instruction is an authentic instructional model \nor strategy in which students plan, implement and evaluate \nprojects that have real world applications. \n \n \n3.3 \nTRAINEE ENTRY REQUIREMENTS \n \nThis section specifies the qualifications of trainees and \neducational experience. Other requirements like health and physical \nrequirements are also stated. Passing entry written examinations may \nalso be indicated if necessary. \n \n• Can communicate both orally and in writing \n• Good moral character \n• Can perform basic mathematical computation \n• Physically and mentally fit \n \n \n3.4 \nLIST OF TOOLS, EQUIPMENT AND MATERIALS \n \nRecommended list of tools, equipment and materials for the \ntraining of 25 trainees for AIR DUCT SERVICING NC II. \n \n \nTOOLS \nEQUIPMENT \nMATERIALS \nQTY. \nDescription \nQTY \nDescription \nQty. \nDescription \n15 \nsets \nAdjustable wrench \n3 \nunits \nArc Welding set \n \nAcoustic Liner \n5 \nsets \nAnemometer \n3 \nunits \nBar folder \n \nAngular steel / \nRound Bar/ Flat \nBar \n15 \npairs \nAviation snip (left, \nstraight, right, \n&notching) \n3 \nunits \nBender machine \n \nB.I. fittings \n15 \npcs \nBall peen hammer \n3 \nunits \nBlower \n \nBlind rivets \n15 \nunits \nCenter puncher \n \nBox and pan brake \n \nClamps \n15 \nunits \nChalk line \n \nElectric hand drill \n \nDuct sox: Vinyl \nPolyester \n15 Cold chisel \n3 Electric spot \n \nDuct tape\n\n--- PDF PAGE 75 ---\nTRAINING REGULATION - AIR DUCT SERVICING NC II \n74 \npcs \nunits welding \n15 \npcs \nCutting tools \n2 \nunits \nJig Saw \n \nElectrical tape \n15 \npcs \nDividers \n3 \nsets \nManometer \n \nG.I Wire \n15 \npcs \nFlash light \n3 \nsets \nNitrogen regulator \n \nInsulation : \nFiberglass/ Rubber/ \nStyrophor/ \nPolyurethane \n15 \npairs \nFliers \n3 \nunits \nOxy / Acetylene \noutfit \n \nInsulation spacers \n15 \npcs \nHacksaw \n2 \nunits \nPlasma arc cutting \noutfit \n \nMarking pen \n5 pcs Hand riveter \n2 \nunits \nSlip form roll \nmachine \n \nNitrogen gas \n2 \nunits \nLadder / \nScaffolding \n3 \nunits \nSquaring sheer \n \nRed oxide/paint \n15 \npcs \nLevel Hose \n \n \n \nSealant / Adhesive \n15 \npcs \nMallet (rubber, \nplastic) \n \n \n \nSealant/ adhesive \n15 \npcs \nPlumb bob \n \n \n \nSheet Metal: G.I., \nB.I., Stainless \nAluminum \n15 \npcs \npush pull rule \n \n \n \nSteel Bars- Flat \nbar, round bar, \nAngles \n15 \npcs \nScratch awl/ \nscriber \n \n \n \nSulfur stick \n15 \npcs \nScrew driver (Flat \nand Philip)\n\n--- PDF PAGE 76 ---\nTRAINING REGULATION - AIR DUCT SERVICING NC II \n75 \n \n3.5 \nTRAINING FACILITIES \nAIR DUCT SERVICING NC II \n \nBased on a class intake of 25 students/trainees. \n \n \nSPACE REQUIREMENTS \n \nSpace \n(m) \n \nArea in \nSq. Meters \nTotal Area \nin \nSq. Meters \n \nA. LECTURE AREA* \n4.00 x \n8.00 \n32.00 \n32.00 \nB. LEARNING RESOURCE AREA \n \n4.00 x \n6.00 \n \n24.00 \n \n24.00 \nC. TOOL/STORAGE \n AREA* \n4.00 x \n4.00 \n16.00 \n16.00 \nD. WASH, TOILET AND LOCKER ROOM* \n \n3.00 x \n4.00 \n \n12.00 \n \n12.00 \nTOTAL \n84 \nE. FACILITIES/ \n EQUIPMENT/ \n CIRCULATION \n \n \n \n25 \n \nTOTAL AREA \n \n \n \n109 \n *Common facilities for all HVAC/R Courses \n \n \n3.6 \nTRAINER’S QUALIFICATION FOR HVAC/R SECTOR \n \n \n \nAIR DUCT SERVICING TRAINER QUALIFICATION II (TQ II) \n \n• Must have undergone training on Training Methodology II or \nequivalent training/experience \n• He must be a holder of AIR DUCT SERVICING NC II or equivalent \nqualification/experience \n• Good moral character \n• Must be physically and mentally fit \n• Must be computer literate \n• Must be a Civil Service eligible (for government position or \nappropriate professional license issued by the Professional \nRegulatory Board) \n• *Must have at least two (2) years job/industry experience \n \n \n*Optional: Only when required by the hiring institution \n \n Reference: TESDA Board Resolution No. 2004-03\n\n--- PDF PAGE 77 ---\nTRAINING REGULATION - AIR DUCT SERVICING NC II \n76 \n \n3.2 \nINSTITUTIONAL ASSESSMENT \n \nInstitutional assessment is undertaken by trainees to determine \ntheir achievement of units of competency. A certificate of achievement \nis issued for each unit of competency."
