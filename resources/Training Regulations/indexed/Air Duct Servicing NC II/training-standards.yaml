erview\n\n\n\nCOMMON COMPETENCIES\n\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Prepare\nmaterials and\ntools\n\n1.1 Identify materials and tools\n1.2 Request materials and\ntools\n1.3 Receive and inspect\nmaterials and tools\n• Self-paced/\nModular\n• Demonstration\n• Small Group\nDiscussion\n• Distance\nEducation\n• Written\n• Practical /\nPerformance Test\n2. Observe\nprocedures,\nspecifications\nand manuals\nof instructions\n2.1 Identify and access\nspecifications and manuals\n2.2 Interpret manuals\n2.3 Apply information in\nmanuals\n• Discussion\n• Lecture\n• Modular\n\n\n• Written\n• Practical /\nPerformance Test\n\n\n3. Perform\nmensuration\nand calculation\n3.1 Select measuring\ninstruments\n3.2 Carry-out measurements\nand calculations\n\n\n• Self-paced/\nModular\n• Demonstration\n• Small Group\nDiscussion\n• Distance\nEducation\n• Written/Oral\nExamination\n• Practical\nDemonstration\n\n--- PDF PAGE 71 ---\nTRAINING REGULATION - AIR DUCT SERVICING NC II\n70\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n4. Perform basic\nbench work\n4.1 Prepare materials, tools\nand equipment for layout\n4.2 Layout features in\nworkplace\n4.3 Cut sheets, plates and bars\n4.4 Smooth sheets plates and\nbars\n4.5 Drill holes in sheets, plates\nand bars\n4.6 Bore holes in sheet plates\nand bars\n4.7 Bend sheets, plates and\nbars\n4.8 Join sheets, plates and\nbars\n• Modular\n• Film Showing\n• Demonstration\n• On-the-job training\n\n• Interview\n• Demonstration\n5. Perform basic\nelectrical works\n5.1 Measure and analyze\ncircuit and load resistance\nin electrical system\n5.2 Measure and analyze\nvoltage in electrical system\n5.3 Measure and analyze\ncurrent in electrical system\n5.4 Test simple electrical\ncomponents and\nconnections\n5.5 Repair minor electrical\nsystem troubles\n• Modular\n• Computer-based\ntraining\n(Simulation)\n• Demonstration\n• On- the-job\ntraining\n\n• Interview\n• Demonstration\n6. Maintain tools\nand equipment\n6.1 Check the conditions of\ntools and equipment\n6.2 Perform basic preventive\nmaintenance\n6.3 Store tools and equipment\n• Small Group\nDiscussion\n• Demonstration of\nPractical Skills\n• Modular\n• Demonstration\nand Oral\nquestioning\n• Written test\n7. Perform\nhousekeeping\nand safety\npractices\n\n7.1 Sort materials, tools and\nequipment\n7.2 Clean workplace area,\nmaterials, tools and\nequipment\n7.3 Systematize dispensing\nand retrieval of materials,\ntools and equipment\n7.4 Identify and minimize/\neliminate hazards\n7.5 Respond and record\naccidents\n7.6 Follow basic securities\n• Small Group\nDiscussion\n• Demonstration of\nPractical Skills\n• Modular\n\n• Demonstration\nand Oral\nquestioning\n• Written test\n\n--- PDF PAGE 72 ---\nTRAINING REGULATION - AIR DUCT SERVICING NC II\n71\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n8. Document work\naccomplished\n8.1 Identify forms and data\n8.2 Prepare reports\n• Small Group\nDiscussion\n• Demonstration of\nPractical Skills\n• Modular\n• Demonstration and\nOral questioning\n• Written Test\n\n\n\n\nCORE COMPETENCIES\n\nUnit of\nCompetency\n\nLearning Outcome\n\nMethodology\nAssessment\nApproach\n 1. Survey Site For\nAir Duct\nInstallation\n\n\n\n1.1 Interpret plan and\nspecifications\n1.2 Make preparations for site\nsurvey\n1.3 Prepare alteration and\ndeviation from the plan\n1.4 Prepare technical report\n• Discussion\n• Lecture\n• Plant visit\n\n• Questioning\n• Written report\n\n\n\n\n\n2. Fabricate Air\nDucts\n\n2.1 Prepare air duct\nrequirements\n2.2 Lay out sheet metal\n2.3 Cuts sheet metals to a\ngiven dimension\n2.4 Perform bending and\nfolding\n2.5 Join air duct components\n• Discussion\n• Demonstration\n• Practical exercises\n\n• Demonstration\n• Oral and written\nquestioning\n3. Install Air Duct\nSystem\n\n3.1 Prepare air duct installation\nrequirements\n3.2 Install/ Erect platforms and\nscaffoldings\n3.3 Install hangers & supports\n3.4 In