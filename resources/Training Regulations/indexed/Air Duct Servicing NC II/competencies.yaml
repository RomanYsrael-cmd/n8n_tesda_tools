ere applicable \nto ensure safe and effective work operations \n2. Underpinning \nKnowledge \n2.1 BLUEPRINT READINGS \n• Mechanical plans, symbols and abbreviations \n2.2 TRADE MATHEMATICS/MENSURATION \n• Linear measurement \n• Dimension \n• Unit conversion \n• Ratio & proportion \n2.3 LEGISLATION/CODE \n• Building Code \n• Mechanical Engineering Code \n• SMACNA Duct Construction Standards \n• NFPA90A/90B \n• ASHRAE \n2.4 TRADE THEORY \n• Principles of air distribution \n• Principles of Fans & Blowers \n• Duct sizing \n• Materials specifications \n• Types and uses of ladders, platforms and scaffolding. \n• Types of supports and hangers \n• Types and uses of dampers and louvers. \n• Types and uses of grilles and diffusers \n3. Underpinning \nSkills \n3.1 Interpreting plan and specifications \n3.2 Communication skills \n4. Resource \nImplications \nThings necessary to conduct method of assessments: \n4.1 Technical plan/drawing relevant to the task \n4.2 Materials relevant to the proposed activity \n5. Methods of \nAssessment \nCompetency in this unit must be assessed through: \n5.1 Direct observation \n5.2 Demonstration \n5.3 Portfolio Report \n5.4 Questions related to underpinning knowledge \n6. Context for \nAssessment \n6.1 Competency may be assessed in the work place or in a \nsimulated work place setting\n\n--- PDF PAGE 46 ---\nTRAINING REGULATION - AIR DUCT SERVICING NC II \n45 \n \nUNIT OF COMPETENCY: FABRICATE AIR DUCTS \n \n UNIT CODE :"
