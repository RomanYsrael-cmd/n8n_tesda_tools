          "source_text": "1. Critical Aspects \n of Competency \nAssessment requires that the candidate: \n1.1 Interpreted work plan to determine job requirements \n1.2 Identified and prepared supplies, materials, tools and \nequipment in accordance with job requirements \n1.3 Selected and used appropriate processes, tools and \nequipment to carry out task \n1.4 Laid-out and checked dimensions in accordance with job \nrequirements and within the tolerances \n1.5 Followed work instructions to ensure safety \n1.6 Performed benchworks in accordance with job \nrequirements \n1.7 Cleaned worksite and left in safe state in accordance \nwith OHSA regulations \n2. Underpinning \nknowledge \n \n \n \n \n \n \n \n2.1 TRADE MATHEMATICS \n• Linear measurements \n• Dimensions \n• Unit conversion \n2.2 TRADE THEORY \n• Basic Benchwork \n2.3 SAFETY PRACTICES \n• PPE \n• Handling of tools, supplies and equipment \n• Good housekeeping \n3. Underpinning \nskills \n3.1 Performing basic benchwork \n3.2 Communicating effectively \n3.3 Work safety \n3.4 Preparing materials, tools and equipment \n3.5 Proper handling of tools and equipment \n4. Resource \nimplications \nThe following resources should be provided: \n4.1 Workplace \n4.2 Work plan \n4.3 Materials, tools and equipment relevant to the proposed \nactivity/task \n5. Methods of \nassessment \nCompetency should be assessed through: \n5.1 Actual demonstration \n5.2 Direct observation \n5.3 Written/questioning related to underpinning knowledge \n6. Context of \nassessment \n6.1 Competency assessment may occur in workplace or any \nappropriate simulated environment \n6.2 Assessment shall be observed while task are being \nundertaken whether individually or in group \n6.3 Competency assessment must be undertaken in \naccordance with the endorsed TESDA assessment \nguidelines\n\n--- PDF PAGE 31 ---\nTRAINING REGULATION - AIR DUCT SERVICING NC II \n30 \n \nUNIT OF COMPETENCY: PERFORM BASIC ELECTRICAL WORKS \n \n \nUNIT CODE \n \n :"
        },
        "source_text": "HVC713202 \n \n \n \n \n \nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes in \n preparing materials, tools and equipment, lay-outing \n dimensions and performing basic benchwork based \n on the required performance standards. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized bold terms are elaborated in the \n Range of Variables \n1. Prepare materials, \ntools and equipment \n \n1.1 Work plan is interpreted to determine job requirements \n1.2 Materials, tools and equipment are identified and \nprepared according to job requirements \n1.3 Materials are checked according to the required \nspecifications \n1.4 Tools and equipment conditions are checked following \nthe standard operating procedures (SOPs) \n2. Lay-out and mark \ndimensions/features on \nworkplace \n2.1 Metallic and non-metallic materials are selected \naccording to the requirements specified in the blueprint \n2.2 Dimensions/features are laid-out/marked according \nto job specifications/blueprint and within the required \ntolerance \n2.3 Dimensions are checked against the actual work plan \n3. Perform required \nbenchworks \n3.1 Work instructions are followed to ensure work safety \n3.2 Benchworks are performed applying knowledge on \nsafety procedures and according to job requirements \n3.3 Workpieces are clamped in workholding device to \navoid damage and accidents \n3.4 Work pieces are cut, chipped or filed according to \nrequired measurements, tolerance specified in the \nblueprint and free from burrs and sharp edges \n3.5 Drilling is performed according to recommended \nsequence and specifications \n3.6 Proper usage of materials, tools and equipment is \nobserved \n3.7 Appropriate PPE and safety procedures are applied \n3.8 Worksite is cleaned and cleared of all debris and left in \nsafe state in accordance with OHS regulations\n\n--- PDF PAGE 29 ---\nTRAINING REGULATION - AIR DUCT SERVICING NC II \n28 \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Work plan \n1.1 Job requirements \n1.2 Schedule of work \n2. Materials \n \n \n \n \n2.1 Steel brackets \n2.2 Grinding disc \n2.3 Drill bit \n2.4 Flat/angle bars \n2.5 Fastening screws \n3. Tools and equipment \n \n \n \n \n \n3.1 \nPortable grinder \n3.2 \nHacksaw \n3.3 \nFile \n3.4 \nMarkers \n3.5 \nScrew drivers \n3.6 \nBallpen hammer \n3.7 \nL-square/steel square \n3.8 \nSteel rule \n3.9 \nMeasuring tools \n3.10 Portable electric drill \n3.11 Bench wire \n3.12 Tri-square \n4. Metallic materials \n4.1 Mild steel plate \n4.2 Flat / Square / Angle /Round bar \n4.3 G.I./ B.I. sheet \n4.4 Beam \n5. Non-metallic materials \n5.1 PVC/ Fiber glass/ Plastic \n5.2 Rubber \n5.3 Wood \n5.4 Ceramics \n6. Dimensions \n \n6.1 Measurements \n6.2 Tolerances \n7. Work instructions \n \n7.1 Work plan/ Blueprint \n7.2 Manufacturer’s specifications \n8. Personal Protective Equipment \n(PPE) \n \n8.1 Safety shoes \n8.2 Gloves \n8.3 Goggles \n 9. Benchworks \n9.1 Cutting \n9.2 Filing \n9.3 Drilling \n10. Workholding device \n10.1 Machine vise \n10.2 Pliers \n10.3 Vise grip \n11. Manual \n11.1 Procedures manual \n11.2 Instructional manual\n\n--- PDF PAGE 30 ---\nTRAINING REGULATION - AIR DUCT SERVICING NC II \n29 \nEVIDENCE GUIDE \n \n1. Critical Aspects \n of Competency \nAssessment requires that the candidate: \n1.1 Interpreted work plan to determine job requirements \n1.2 Identified and prepared supplies, materials, tools and \nequipment in accordance with job requirements \n1.3 Selected and used appropriate processes, tools and \nequipment to carry out task \n1.4 Laid-out and checked dimensions in accordance with job \nrequirements and within the tolerances \n1.5 Followed work instructions to ensure safety \n1.6 Performed benchworks in accordance with job \nrequirements \n1.7 Cleaned worksite and left in safe state in accordance \nwith OHSA regulations \n2. Underpinning \nknowledge \n \n \n \n \n \n \n \n2.1 TRADE MATHEMATICS \n• Linear measurements \n• Dimensions \n• Unit conversion \n2.2 TRADE THEORY \n• Basic Benchwork \n2.3 SAFETY PRACTICES \n• PPE \n• Handling of tools, supplies and equipment \n• Good housekeeping \n3. Underpinning \nskills \n3.1 Performing basic benchwork \n3.2 Communicating effectively \n3.3 Work safety \n3.4 Preparing materials, tools and equipment \n3.5 Proper handling of tools and equipment \n4. Resource \nimplications \nThe following resources should be provided: \n4.1 Workplace \n4.2 Work plan \n4.3 Materials, tools and equipment relevant to the proposed \nactivity/task \n5. Methods of \nassessment \nCompetency should be assessed through: \n5.1 Actual demonstration \n5.2 Direct observation \n5.3 Written/questioning related to underpinning knowledge \n6. Context of \nassessment \n6.1 Competency assessment may occur in workplace or any \nappropriate simulated environment \n6.2 Assessment shall be observed while task are being \nundertaken whether individually or in group \n6.3 Competency assessment must be undertaken in \naccordance with the endorsed TESDA assessment \nguidelines\n\n--- PDF PAGE 31 ---\nTRAINING REGULATION - AIR DUCT SERVICING NC II \n30 \n \nUNIT OF COMPETENCY: PERFORM BASIC ELECTRICAL WORKS \n \n \nUNIT CODE \n \n :"
