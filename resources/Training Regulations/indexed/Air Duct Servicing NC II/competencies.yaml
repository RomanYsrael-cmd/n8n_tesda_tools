          "source_text": "1. Critical Aspects \n of Competency \nAssessment requires that the candidate: \n1.1 Selected and prepared appropriate measuring instruments \nin accordance with job requirements \n1.2 Performed measurements and calculations according to \njob requirements/ ISO \n2. Underpinning \nKnowledge \n \n \n \n \n \n2.1 TRADE MATHEMATICS/MENSURATION \n• Four fundamental operation \n• Linear measurement \n• Dimensions \n• Unit conversion \n• Ratio and proportion \n• Trigonometric functions \n• Algebraic equations \n3. Underpinning \nSkills \n3.1 Performing calculation by addition, subtraction, \nmultiplication and division: trigonometric functions and \nalgebraic equations \n3.2 Visualizing objects and shapes \n3.3 Interpreting formulas for volume, areas, perimeters of \nplane and geometric figures \n3.4 Proper handling of measuring instruments \n4. Resource \nImplications \nThe following resources should be provided: \n4.1 Workplace location \n4.2 Problems to solve \n4.3 Measuring instrument appropriate to carry out tasks \n4.4 Instructional materials relevant to the propose activity \n \nAssessment of underpinning knowledge and practical skills \nmay be combined. \n5. Methods of \nAssessment \nCompetency should be assessed through: \n5.1 Actual demonstration \n5.2 Direct observation \n5.3 Written test/questioning related to underpinning knowledge \n6. Context for \nAssessment \n6.1 Competency assessment may occur in workplace or any \nappropriate simulated environment \n6.2 Assessment shall be observed while task are being \nundertaken whether individually or in group \n6.3 Competency assessment must be undertaken in \naccordance with the TESDA assessment guidelines\n\n--- PDF PAGE 28 ---\nTRAINING REGULATION - AIR DUCT SERVICING NC II \n27 \n \nUNIT OF COMPETENCY: PERFORM BASIC BENCHWORK \n \nUNIT CODE \n \n :"
        },
        "source_text": "HVC311203 \n \nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes \n in identifying and measuring objects based on the \nrequired performance standards. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized bold terms are elaborated in the \n Range of Variables \n1. Select measuring \ninstruments \n \n \n1.1 Object or component to be measured is \nidentified, classified and interpreted to the \nappropriate regular geometric shape \n1.2 Measuring tools are selected/identified as per \nobject to be measured or job requirements \n1.3 Correct specifications are obtained from \nrelevant sources \n1.4 Appropriate measuring instruments are \nselected according to job requirements \n1.5 Alternative measuring tools are used without \nsacrificing cost and quality of work \n2. Carry out measurements \nand calculations \n \n \n2.1 Accurate measurements and calculations \nare obtained to job requirements \n2.2 Alternative measuring tools are used \n without sacrificing cost and quality of work \n2.3 Calculation needed to complete work tasks \nare performed using the four basic process of \naddition (+), subtraction (-), multiplication (x) \nand division (/) including but not limited to: \ntrigonometric \nfunctions, \nalgebraic \ncomputations \n2.4 Calculations involving fractions, percentages \nand mixed numbers are used to complete \nworkplace tasks \n2.5 Numerical computation is self-checked and \ncorrected for accuracy \n2.6 Instruments are read to the limit of accuracy \nof the tool \n2.7 Systems of measurement identified and \nconverted according to job requirements/ISO \n2.8 Workpieces are measured according to job \nrequirements\n\n--- PDF PAGE 26 ---\nTRAINING REGULATION - AIR DUCT SERVICING NC II \n25 \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Geometric Shape \n \n \n \n \n \n Including but I not limited to: \n1.1 Round \n1.2 Square \n1.3 Rectangular \n1.4 Triangle \n1.5 Sphere \n1.6 Conical \n2. Measuring instruments \nIncluding but not limited to: \n2.1 \nMicrometer (In-out, depth) \n2.2 \nVernier caliper (out, inside) \n2.3 \nDial gauge with mag, std. \n2.4 \nStraight edge/Steel rule \n2.5 \nThickness/Torque/Small Hole/ gauge \n2.6 \nTelescopic gauge \n2.7 \nTry-square/Protractor \n2.8 \nCombination gauge \n2.9 \nVoltmeter/Ammeter/Mega-ohmeter \n2.10 KWH meter \n2.11 Thermometers \n3. Measurements and \ncalculations \n \n3.1 \nLinear \n3.2 \nVolume \n3.3 \nArea \n3.4 \nWattage \n3.5 \nVoltage \n3.6 \nResistance \n3.7 \nAmperage \n3.8 \nFrequency \n3.9 \nImpedance \n3.10 Conductance \n3.11 Capacitance \n3.12 Displacement \n3.13 Inside diameter \n3.14 Circumference \n3.15 Length \n3.16 Thickness \n3.17 Outside diameter \n3.18 Taper \n3.19 Out of roundness\n\n--- PDF PAGE 27 ---\nTRAINING REGULATION - AIR DUCT SERVICING NC II \n26 \n \nEVIDENCE GUIDE \n \n1. Critical Aspects \n of Competency \nAssessment requires that the candidate: \n1.1 Selected and prepared appropriate measuring instruments \nin accordance with job requirements \n1.2 Performed measurements and calculations according to \njob requirements/ ISO \n2. Underpinning \nKnowledge \n \n \n \n \n \n2.1 TRADE MATHEMATICS/MENSURATION \n• Four fundamental operation \n• Linear measurement \n• Dimensions \n• Unit conversion \n• Ratio and proportion \n• Trigonometric functions \n• Algebraic equations \n3. Underpinning \nSkills \n3.1 Performing calculation by addition, subtraction, \nmultiplication and division: trigonometric functions and \nalgebraic equations \n3.2 Visualizing objects and shapes \n3.3 Interpreting formulas for volume, areas, perimeters of \nplane and geometric figures \n3.4 Proper handling of measuring instruments \n4. Resource \nImplications \nThe following resources should be provided: \n4.1 Workplace location \n4.2 Problems to solve \n4.3 Measuring instrument appropriate to carry out tasks \n4.4 Instructional materials relevant to the propose activity \n \nAssessment of underpinning knowledge and practical skills \nmay be combined. \n5. Methods of \nAssessment \nCompetency should be assessed through: \n5.1 Actual demonstration \n5.2 Direct observation \n5.3 Written test/questioning related to underpinning knowledge \n6. Context for \nAssessment \n6.1 Competency assessment may occur in workplace or any \nappropriate simulated environment \n6.2 Assessment shall be observed while task are being \nundertaken whether individually or in group \n6.3 Competency assessment must be undertaken in \naccordance with the TESDA assessment guidelines\n\n--- PDF PAGE 28 ---\nTRAINING REGULATION - AIR DUCT SERVICING NC II \n27 \n \nUNIT OF COMPETENCY: PERFORM BASIC BENCHWORK \n \nUNIT CODE \n \n :"
