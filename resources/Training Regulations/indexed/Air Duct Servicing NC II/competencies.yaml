        "evidence_guide": {
          "source_text": "1. Critical Aspects \n of Competency \nAssessment requires that the candidate: \n1.1 Interpreted work plan to determine job requirements \n1.2 Selected and used appropriate processes, tools and \nequipment to carry out task \n1.3 Identified and tested electrical tools and instruments in \naccordance with PEC \n1.4 Replaced defective tools and instruments \n1.5 Checked power supply and electrical components in \naccordance with PEC \n1.6 Cleaned work place and left in safe state in line with OHSA \nregulations \n1.7 Completed electrical wiring in HVAC/R units based in \nmanufacturer’s specifications and PEC \n1.8 Communicated effectively to ensure safety works \n2. Underpinning \nKnowledge \n \n \n \n \n \n2.1 Linear measurements \n2.2 Dimensions \n2.3 Unit conversion \n2.4 Basic electricity \n2.5 PPE \n2.6 Handling of tools and equipment \n2.7 Good housekeeping \n3. Underpinning \nSkills \n3.1 Installing and repairing electrical fixtures \n3.2 Communicating effectively \n3.3 Work safety \n3.4 Proper handling of materials, tools and equipment \n3.5 Preparing materials, tools and equipment \n3.6 Wiring components \n3.7 Testing power supply and electrical component \n4. Resource \nImplications \nThe following resources should be provided: \n4.1 Work place \n4.2 Work plan \n4.3 Materials, tools and equipment relevant to the proposed \nactivity/task \n5. Methods of \nAssessment \nCompetency should be assessed through: \n5.1 Direct observation \n5.2 Written test/questioning relevant to underpinning knowledge \n6. Context of \nAssessment \n6.1 Competency assessment may occur in workplace or any \nappropriate simulated environment \n6.2 Assessment shall be observed while task are being \nundertaken whether individually or in group \n6.3 Competency assessment must be undertaken in \naccordance with the endorsed TESDA assessment \nguidelines\n\n--- PDF PAGE 34 ---\nTRAINING REGULATION - AIR DUCT SERVICING NC II \n33 \n \n UNIT OF COMPETENCY: MAINTAIN TOOLS AND EQUIPMENT \n \n \nUNIT CODE \n \n :"
        },
        "source_text": "HVC724201 \n \nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes in \n preparing materials, tools and equipment, testing \n electrical components and basic repairing in \n electricity based on the required performance \n standards. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized bold terms are elaborated in the \nRange of Variables \n1. Prepare electrical tools and \ntest instruments \n \n1.1 Work plan is interpreted to determine job \nrequirements \n1.2 Electrical tools and instruments are \nidentified and prepared according to job \nrequirements \n1.3 Electrical tools and instruments are checked for \nconditions and calibrated as required \n2. Test power supply and \nelectrical components \n2.1 Instruments are tested in accordance with PEC \n2.2 Power supply and electrical components are \nchecked in accordance with manufacturer’s \nspecifications/PEC \n2.3 Defects of power supply and electrical \ncomponents are identified and recorded \n2.4 Safe working habits is observed \n3. Perform basic electrical repair \n3.1 Work instructions are followed to ensure \nsafety work \n3.2 Loose connections are tightened in accordance \nwith PEC \n3.3 Defective electrical components are replaced \nand tested in accordance with PEC \n3.4 Work place is cleaned and in safe state in line \nwith OHSA regulations\n\n--- PDF PAGE 32 ---\nTRAINING REGULATION - AIR DUCT SERVICING NC II \n31 \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Work plan \n1.1 Job requirements \n1.2 Schedule of work \n2. Materials \n \n \n \n \n2.1 Solid, stranded wire \n2.2 Service plug/outlet \n2.3 HVAC/R electrical components \n2.4 Soldering lead \n2.5 Terminal clips \n2.6 Moulding \n2.7 Fuses \n2.8 PVC/Mold flux \n2.9 Electrical tape \n3. Tools and equipment \n \n \n \n \n \n3.1 Clamp ammeter \n3.2 Multi tester \n3.3 Insulation tester \n3.4 PPE \n3.5 Soldering gun/iron \n3.6 Wire stripper \n3.7 Measuring tool \n3.8 Markers \n3.9 Crimping tools \n3.10 Screw drivers \n3.11 Electrician pliers \n3.12 Electric drill \n3.13 Long nose \n4. Work instructions \n4.1 Work plan \n4.2 Schematic diagrams \n4.3 Installation instruction\n\n--- PDF PAGE 33 ---\nTRAINING REGULATION - AIR DUCT SERVICING NC II \n32 \n \nEVIDENCE GUIDE \n \n1. Critical Aspects \n of Competency \nAssessment requires that the candidate: \n1.1 Interpreted work plan to determine job requirements \n1.2 Selected and used appropriate processes, tools and \nequipment to carry out task \n1.3 Identified and tested electrical tools and instruments in \naccordance with PEC \n1.4 Replaced defective tools and instruments \n1.5 Checked power supply and electrical components in \naccordance with PEC \n1.6 Cleaned work place and left in safe state in line with OHSA \nregulations \n1.7 Completed electrical wiring in HVAC/R units based in \nmanufacturer’s specifications and PEC \n1.8 Communicated effectively to ensure safety works \n2. Underpinning \nKnowledge \n \n \n \n \n \n2.1 Linear measurements \n2.2 Dimensions \n2.3 Unit conversion \n2.4 Basic electricity \n2.5 PPE \n2.6 Handling of tools and equipment \n2.7 Good housekeeping \n3. Underpinning \nSkills \n3.1 Installing and repairing electrical fixtures \n3.2 Communicating effectively \n3.3 Work safety \n3.4 Proper handling of materials, tools and equipment \n3.5 Preparing materials, tools and equipment \n3.6 Wiring components \n3.7 Testing power supply and electrical component \n4. Resource \nImplications \nThe following resources should be provided: \n4.1 Work place \n4.2 Work plan \n4.3 Materials, tools and equipment relevant to the proposed \nactivity/task \n5. Methods of \nAssessment \nCompetency should be assessed through: \n5.1 Direct observation \n5.2 Written test/questioning relevant to underpinning knowledge \n6. Context of \nAssessment \n6.1 Competency assessment may occur in workplace or any \nappropriate simulated environment \n6.2 Assessment shall be observed while task are being \nundertaken whether individually or in group \n6.3 Competency assessment must be undertaken in \naccordance with the endorsed TESDA assessment \nguidelines\n\n--- PDF PAGE 34 ---\nTRAINING REGULATION - AIR DUCT SERVICING NC II \n33 \n \n UNIT OF COMPETENCY: MAINTAIN TOOLS AND EQUIPMENT \n \n \nUNIT CODE \n \n :"
