        "evidence_guide": {
          "source_text": "1. Critical Aspects \n of Competency \nCompetency requires evidence that the candidate: \n1.1 Read and interpreted work instructions to determine job \nrequirements \n1.2 Selected tools, equipment & materials are in line with job \nrequirements \n1.3 Tested air duct in accordance with system instructions and \nspecifications \n1.4 Employed safe manual handling techniques in line with \nenterprise procedures \n1.5 Demonstrated compliance with safety regulation applicable \nto worksite operations \n1.6 Identified faults and problems and made necessary action \nto rectify in line with ducts construction standard \n1.7 Cleaned worksite & kept in a safe state in accordance with \nenterprise procedure \n1.8 Communicated interactively with others where applicable \nto ensure safety and effective work operations\n\n--- PDF PAGE 60 ---\nTRAINING REGULATION - AIR DUCT SERVICING NC II \n59 \n2. Underpinning \nKnowledge \n2.1 BLUEPRINT READINGS \n• Mechanical plans, symbols and abbreviations \n• Detailed drawings \n2.2 TRADE MATHEMATICS/MENSURATION \n• Linear measurement \n• Dimension \n• Unit conversion \n• Ratio & proportion \n• Velocity computation \n• Volume \n2.3 LEGISLATION/CODE \n• Building Code \n• Mechanical engineering Code \n• SMACNA Duct Construction Standards \n• NFPA90A/90B \n• ASHRAE \n2.4 TRADE THEORY \n• Principles of air distribution \n• Principles of Fans & Blowers \n• Equipment selection and application \n• Duct sizing \n• Materials specifications \n• Types and uses of ladders, platforms and scaffolding. \n• Types of supports and hangers \n• Types and uses of dampers and louvers. \n• Types and uses of grilles and diffusers \n• Types and uses of dampers \n• Types and uses of insulation and sealant \n• Duct leakage testing procedures \n3. Underpinning \nSkills \n \n \n3.1 Interpreting plan and specifications \n3.2 Preparing materials \n3.3 Proper use of duct testing tools and equipments \n3.4 Communication skills \n3.5 Problem Solving \n4. Resource \nImplications \nThe following resources must be provided: \n4.1 Access to work place location \n4.2 Tools and equipment appropriate for leak testing \n4.3 Technical plan/drawing relevant to the task \n4.4 Materials relevant to the proposed activity \n5. Methods of \nAssessment \nCompetency in this unit must be assessed through: \n5.1 Direct observation \n5.2 Demonstration \n5.3 Questions related to underpinning knowledge \n6. Context for \nAssessment \n6.1 Competency may be assessed in the work place or in a \nsimulated work place setting\n\n--- PDF PAGE 61 ---\nTRAINING REGULATION - AIR DUCT SERVICING NC II \n60 \n \nUNIT OF COMPETENCY : INSULATE AIR DUCTS \n \nUNIT CODE \n \n:"
        },
        "source_text": "HVC723334 \n \n \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge, skills and \nattitudes required to perform air-ducts testing \nin accordance with Duct Construction \nStandards \n \n \nELEMENT \n \nPERFORMANCE CRITERIA \nItalicized bold terms are elaborated in the \nRange of Variables \n1. Prepare for air duct test \n \n \n \n \n \n \n \n1.1 Work instructions are read and \ninterpreted to determine job \nrequirements \n1.2 Materials, tools & equipment are \nselected in accordance with job \nrequirements \n1.3 Testing method and procedures are \ndetermined/prepared in accordance with \nstandard operating procedure \n1.4 Pre-testing is performed and complied \naccording to procedures laid down in \nsystem documents \n1.5 PPE is prepared and checked in line \nwith job requirements \n2. Test air duct \n2.1 Testing materials / instruments are \nprepared and checked \n2.2 Duct lengths are not in excess of 30 \nmeters for vertical ducts and not in \nexcess of 45 meters for horizontal ducts \n2.3 Air duct system is checked for leaks \napplying light / smoke test method \n2.4 Joints are checked to ensure fit and air \ntightness in line with standard procedure \n2.5 Leaks are repaired according to system \nrequirements \n2.6 Work is undertaken in line with safety \nrules and regulations\n\n--- PDF PAGE 58 ---\nTRAINING REGULATION - AIR DUCT SERVICING NC II \n57 \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Materials \nMay include but not limited to: \n1.1 \nSulfur stick \n1.2 \nElectrical tape \n1.3 \nBlind rivets \n1.4 \nRed oxide/paint \n1.5 \nB.I. fittings \n1.6 \nInsulation spacers \n1.7 \nNitrogen gas \n1.8 \nClamps \n2. Tool \nMay include but not limited to: \n2.1 \nLevel Hose \n2.2 \nSteel rule \n2.3 \nPush-pull rule \n2.4 \nSpirit level \n2.5 \nChalk line \n2.6 \nStraight snip \n2.7 \nAviation snip (left, straight, right, and \nnotching) \n2.8 \nTin snip \n2.9 \nHacksaw \n2.10 Ball peen hammer \n2.11 Hand riveter \n2.12 Straight peen hammer \n2.13 Adjustable wrench \n2.14 Screw driver (Flat and Philip) \n \n3. Equipment \n \n \nMay include but not limited to: \n3.1 \nElectric hand drill \n3.2 \nBlower \n3.3 \nNitrogen regulator \n3.4 \nManometer \n4. Safety rules and regulations \nMay includes but not limited to: \n4.1 \nPersonal safety \n4.2 \nPersonal Protective Equipment (PPE) \n4.3 \nSafety of others \n4.4 \nSigns & Warnings\n\n--- PDF PAGE 59 ---\nTRAINING REGULATION - AIR DUCT SERVICING NC II \n58 \n \nEVIDENCE GUIDE \n \n1. Critical Aspects \n of Competency \nCompetency requires evidence that the candidate: \n1.1 Read and interpreted work instructions to determine job \nrequirements \n1.2 Selected tools, equipment & materials are in line with job \nrequirements \n1.3 Tested air duct in accordance with system instructions and \nspecifications \n1.4 Employed safe manual handling techniques in line with \nenterprise procedures \n1.5 Demonstrated compliance with safety regulation applicable \nto worksite operations \n1.6 Identified faults and problems and made necessary action \nto rectify in line with ducts construction standard \n1.7 Cleaned worksite & kept in a safe state in accordance with \nenterprise procedure \n1.8 Communicated interactively with others where applicable \nto ensure safety and effective work operations\n\n--- PDF PAGE 60 ---\nTRAINING REGULATION - AIR DUCT SERVICING NC II \n59 \n2. Underpinning \nKnowledge \n2.1 BLUEPRINT READINGS \n• Mechanical plans, symbols and abbreviations \n• Detailed drawings \n2.2 TRADE MATHEMATICS/MENSURATION \n• Linear measurement \n• Dimension \n• Unit conversion \n• Ratio & proportion \n• Velocity computation \n• Volume \n2.3 LEGISLATION/CODE \n• Building Code \n• Mechanical engineering Code \n• SMACNA Duct Construction Standards \n• NFPA90A/90B \n• ASHRAE \n2.4 TRADE THEORY \n• Principles of air distribution \n• Principles of Fans & Blowers \n• Equipment selection and application \n• Duct sizing \n• Materials specifications \n• Types and uses of ladders, platforms and scaffolding. \n• Types of supports and hangers \n• Types and uses of dampers and louvers. \n• Types and uses of grilles and diffusers \n• Types and uses of dampers \n• Types and uses of insulation and sealant \n• Duct leakage testing procedures \n3. Underpinning \nSkills \n \n \n3.1 Interpreting plan and specifications \n3.2 Preparing materials \n3.3 Proper use of duct testing tools and equipments \n3.4 Communication skills \n3.5 Problem Solving \n4. Resource \nImplications \nThe following resources must be provided: \n4.1 Access to work place location \n4.2 Tools and equipment appropriate for leak testing \n4.3 Technical plan/drawing relevant to the task \n4.4 Materials relevant to the proposed activity \n5. Methods of \nAssessment \nCompetency in this unit must be assessed through: \n5.1 Direct observation \n5.2 Demonstration \n5.3 Questions related to underpinning knowledge \n6. Context for \nAssessment \n6.1 Competency may be assessed in the work place or in a \nsimulated work place setting\n\n--- PDF PAGE 61 ---\nTRAINING REGULATION - AIR DUCT SERVICING NC II \n60 \n \nUNIT OF COMPETENCY : INSULATE AIR DUCTS \n \nUNIT CODE \n \n:"
