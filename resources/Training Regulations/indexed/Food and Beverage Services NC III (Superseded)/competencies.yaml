        "evidence_guide": {
          "source_text": "1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Demonstrated the ability to maintain continuous stock\nsupply within a specific hospitality industry environment\n1.2 Demonstrated the ability to meet accuracy and speed\nrequirements for completion and maintenance of stock\nrecords\n\n2. Required knowledge\n2.1 Stock level maintenance techniques as appropriate to the\nindustry sector\n2.2 Typical stocktaking procedures as appropriate to the\nindustry sector\n2.3 Stock recording systems\n2.4 Stock security systems\n2.5 Types of stock control documentation and systems that\nmay be applied in the hospitality industry\n2.6 Reasons for stock loss and damage\n\n3. Required skills\n3.1\nCollect, organize and analyze information\n3.2\nPlan and organize activities\n3.3\nApplication of Required knowledge\n\n4. Resource\nimplications\nThe following resources should be provided:\n4.1\nProject or work activities that allow the candidate to\ndemonstrate stock control and monitoring over a period of\ntime\n4.2\nUse of real stock items\n4.3\nUse of industry-current stock control technology or\ndocumentation\n4.4\nInvolvement of internal/external suppliers\n\n5. Methods of\nassessment\nCompetency in this unit may be assessed through:\n5.1 Review of activities undertaken by the candidate to\nmonitor stock for a given period of time for a specific\noutlet\n5.2 Written or oral questions to test knowledge of reasons for\nprocedures\n5.3 Review of workplace reports and records related to stock\ncontrol, prepared by the candidate\n5.4 Review of portfolios of evidence and third party workplace\nreports of on-the-job performance by the candidate\n\n6. Context for\nAssessment\n6.1 Competency assessment may occur in workplace or any\nappropriately simulated environment\n6.2 Assessment shall be observed while tasks are being\nundertaken whether individually or in a group\n\n--- PDF PAGE 26 ---\nTESDA-SOP-QSO-01-F08\n\nFOOD AND BEVERAGE SERVICE NCIII (Amended) Promulgated December 2013 24\nUNIT OF COMPETENCY :\nTRAIN SMALL GROUPS\n\nUNIT CODE\n:"
        },
        "source_text": "TRS311207\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills, behavior and\nmotivations required to control and order stock in a range of\nhospitality establishments. This role is generally carried out\nby supervisors and team leaders.\n\nELEMENT\nPERFORMANCE CRITERIA\nBold and italicized terms are elaborated in the Range of Variables\n1. Maintain stock levels\nand records\n1.1\nStock levels are monitored and maintained according to\ncompany requirements.\n1.2\nStock security is monitored and systems are adjusted as\nrequired.\n1.3\nStock reorder cycles are monitored and adjusted as\nrequired.\n1.4\nColleagues are informed of their individual responsibilities\nin regard to the reordering of stock.\n1.5\nRecords of stock storage and movement are maintained\nin accordance with company procedures.\n1.6\nStock performance is monitored and fast/slow-selling\nitems are identified and reported in accordance with\ncompany procedures.\n2. Process stock orders\n2.1\nOrders for stock are processed accurately and in\naccordance with company procedures.\n2.2\nStock levels are maintained and recorded ensuring\ninformation is complete, correct and current.\n2.3\nIncoming stock is checked against purchase and supply\nagreements and all necessary details are recorded.\n3. Minimize stock\nlosses\n3.1\nStock losses are identified and recorded according to\ncompany procedures.\n3.2\nLosses are reported in accordance with company\nprocedures.\n3.3\nAvoidable losses are identified and reasons behind these\nlosses are established.\n3.4\nSolutions to loss situations are recommended and related\nprocedures are implemented to prevent future avoidable\nlosses.\n4. Follow-up orders\n4.1\nThe delivery process is monitored to ensure agreed\ndeadlines are met.\n4.2\nContinuity of supply is ensured by liaising with colleagues\nand suppliers.\n4.3\nRoutine supply problems are followed up or referred to\nthe appropriate person in accordance with company\npolicy.\n4.4\nStock is distributed to agreed locations.\n5. Organize and\nadminister stocks\n5.1\nStocks are organized at appropriate intervals according\nto company policy and procedures.\n5.2\nStocktaking responsibilities are allocated to staff.\n5.3\nAccurate stock reports are produced within designated\ntimelines.\n\n--- PDF PAGE 24 ---\nTESDA-SOP-QSO-01-F08\n\nFOOD AND BEVERAGE SERVICE NCIII (Amended) Promulgated December 2013 22\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Stock\nMay include:\n1.1 Food\n1.2 Beverages\n1.3 Equipment such as maintenance and cleaning equipment,\noffice equipment\n1.4 Linen\n1.5 Stationery\n1.6 Brochures and promotional materials\n1.7 Cleaning supplies and chemicals\n1.8 Vouchers and tickets\n1.9 Souvenir products\n\n2. Stock losses\nMay include:\n2.1 Lack of rotation leading to product deterioration\n2.2 Inappropriate storage conditions\n2.3 Access by pests or vermin\n2.4 Theft\n2.5 Overstocking\n\n--- PDF PAGE 25 ---\nTESDA-SOP-QSO-01-F08\n\nFOOD AND BEVERAGE SERVICE NCIII (Amended) Promulgated December 2013 23\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Demonstrated the ability to maintain continuous stock\nsupply within a specific hospitality industry environment\n1.2 Demonstrated the ability to meet accuracy and speed\nrequirements for completion and maintenance of stock\nrecords\n\n2. Required knowledge\n2.1 Stock level maintenance techniques as appropriate to the\nindustry sector\n2.2 Typical stocktaking procedures as appropriate to the\nindustry sector\n2.3 Stock recording systems\n2.4 Stock security systems\n2.5 Types of stock control documentation and systems that\nmay be applied in the hospitality industry\n2.6 Reasons for stock loss and damage\n\n3. Required skills\n3.1\nCollect, organize and analyze information\n3.2\nPlan and organize activities\n3.3\nApplication of Required knowledge\n\n4. Resource\nimplications\nThe following resources should be provided:\n4.1\nProject or work activities that allow the candidate to\ndemonstrate stock control and monitoring over a period of\ntime\n4.2\nUse of real stock items\n4.3\nUse of industry-current stock control technology or\ndocumentation\n4.4\nInvolvement of internal/external suppliers\n\n5. Methods of\nassessment\nCompetency in this unit may be assessed through:\n5.1 Review of activities undertaken by the candidate to\nmonitor stock for a given period of time for a specific\noutlet\n5.2 Written or oral questions to test knowledge of reasons for\nprocedures\n5.3 Review of workplace reports and records related to stock\ncontrol, prepared by the candidate\n5.4 Review of portfolios of evidence and third party workplace\nreports of on-the-job performance by the candidate\n\n6. Context for\nAssessment\n6.1 Competency assessment may occur in workplace or any\nappropriately simulated environment\n6.2 Assessment shall be observed while tasks are being\nundertaken whether individually or in a group\n\n--- PDF PAGE 26 ---\nTESDA-SOP-QSO-01-F08\n\nFOOD AND BEVERAGE SERVICE NCIII (Amended) Promulgated December 2013 24\nUNIT OF COMPETENCY :\nTRAIN SMALL GROUPS\n\nUNIT CODE\n:"
