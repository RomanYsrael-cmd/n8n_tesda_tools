        "evidence_guide": {
          "source_text": "1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Set up banquet function room according to prescribed\nrequirements\n1.2 Conducted pre-event meetings or briefings\n1.3 Coordinated between the service staff and kitchen and\nother departments that are concerned with the event\n1.4 Monitoring staff performance during the event\n1.5 Prepare pre and post evaluation reports\n\n2. Required\nKnowledge\n2.1 Banquet service\n2.2 Banquet set-ups\n2.3 Banquet floor plan\n2.4 Catering service\n2.5 Understanding Banquet event order forms\n\n3. Required Skills\n3.1 Banquet service\n3.2 Setting up banquets\n3.3 Communication skills\n3.4 Preparing floor plans\n3.5 Interpreting Banquet Order forms\n3.6 Handling guest complaints\n\n4. Resource\nImplications\nThe following resources should be provided:\n4.1 Actual event or function\n4.2 Banquet event forms\n4.3 Staff schedules\n\n5. Methods of\nAssessment\nCompetency in this unit may be assessed through :\n5.1 Written and/or Oral questions to test candidate’s\nknowledge in the\na. organization of service staff for a banquet event.\nb. Floor plan preparation\nc. Table assignments\nd. Work flow\ne. Briefing\n5.2 Simulation/role play to test the candidate’s knowledge\nand skills in overseeing meal service; supervising after\nmeal service and performing customer relations.\n5.3 Portfolio\n\n6. Context of\nAssessment\nAssessment must be conducted in:\n6.1 Workplace or simulated work environment or\n6.2 TESDA accredited assessment center/venue\n\n--- PDF PAGE 41 ---\nFOOD AND BEVERAGE SERVICE NCIII (Amended) Promulgated December 2013 39"
        },
        "source_text": "TRS512395\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge and skills in supervising the\ntasks and duties related to the proper functioning of a\nbanquet event. This includes banquet logistics of pre-\nfunction set up, food and beverage service and post event\nclean up.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Supervise pre-\nfunction mise- en\nplace\n1.1\nAdequate supplies are obtained in accordance to\nevent/function requirements.\n1.2\nTables and chairs are set up according to event/function\nrequirements\n1.3\nServing stations/food islands are set up in designated\nlocations.\n1.4\nTableware are inspected for damages and cleanliness\n1.5\n Floor plan/ seating diagram is prepared and available for\nreference of the banquet staff.\n1.6\nAppropriate flatware is set according to the menu.\n1.7\nMeetings and briefings are conducted prior to the\nbanquet function.\n\n2. Oversee meal\nservice\n2.1\nContact with host, chef and kitchen staff is maintained all\nthroughout the event.\n2.2\nPrompt delivery of each course to every table is ensured.\n2.3\nTiming of service of each course of the meal is\ncoordinated with the kitchen, service staff and host.\n2.4\nBanquet staff work and pace are monitored all\nthroughout the meal service.\n2.5\nThe banquet service style is implemented in accordance\nwith what is stipulated in the event order form or with\nspecial arrangement with the host.\n\n3. Supervise after meal\nservice\n3.1\nCoffee and tea service is provided upon guest request.\n3.2\nBanquet area “break down” is supervised according to\nenterprise standards.\n3.3\nEvent report is prepared after each function\n\n4. Perform customer\nrelations\n4.1\nGuest needs and concerns are attended promptly.\n4.2\nProfessional demeanor of the staff is checked at all\ntimes.\n\n--- PDF PAGE 39 ---\nTESDA-SOP-QSO-01-F08\n\nFOOD AND BEVERAGE SERVICE NCIII (Amended) Promulgated December 2013 37\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Meetings and briefings Topics may include:\n1.1\nType of event\n1.2\nEvent date/time/number of participants\n1.3\nMenu items and descriptions\n1.4\nMajor ingredients\n1.5\nSauces\n1.6\nAccompaniments\n1.7\nPredominant spices and seasonings\n1.8\nDecorations/theme/concept\n1.9\nService style\n\n2. Normal Banquet staff\nwork\nMay include:\n2.1\nRefilling of water\n2.2\nProviding correct silverware or flatware\n2.3\nAnticipating guest needs\n2.4\nAnswering inquiries\n\n3. Room “break down”\nMay include:\n3.1\nClear all tables\n3.2\nClear all tablewares (silverware, glassware etc.)\n3.3\nDispose of decorations’\n3.4\nCollect linen according to standards\n3.5\nClearing out of tables and chairs\n3.6\nCleaning/vacuuming of floors\n3.7\nProper food waste disposal\n\n4. Event Report\nMay include :\n4.1\nActual number of covers\n4.2\nGuest concerns\n4.3\nIncident reports\n4.4\nPrice/cost of function\n4.5\nBreakage reports\n4.6\nNumber of staff\n4.7\nSummary of the function\n\n5. Professional\ndemeanor\nMay include :\n5.1\nProper uniform\n5.2\nGrooming and personal standards\n5.3\nEffective communication skills\n5.4\nProper footware\n5.5\nPolite and courteous manner towards guests\n\n--- PDF PAGE 40 ---\nTESDA-SOP-QSO-01-F08\n\nFOOD AND BEVERAGE SERVICE NCIII (Amended) Promulgated December 2013 38\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Set up banquet function room according to prescribed\nrequirements\n1.2 Conducted pre-event meetings or briefings\n1.3 Coordinated between the service staff and kitchen and\nother departments that are concerned with the event\n1.4 Monitoring staff performance during the event\n1.5 Prepare pre and post evaluation reports\n\n2. Required\nKnowledge\n2.1 Banquet service\n2.2 Banquet set-ups\n2.3 Banquet floor plan\n2.4 Catering service\n2.5 Understanding Banquet event order forms\n\n3. Required Skills\n3.1 Banquet service\n3.2 Setting up banquets\n3.3 Communication skills\n3.4 Preparing floor plans\n3.5 Interpreting Banquet Order forms\n3.6 Handling guest complaints\n\n4. Resource\nImplications\nThe following resources should be provided:\n4.1 Actual event or function\n4.2 Banquet event forms\n4.3 Staff schedules\n\n5. Methods of\nAssessment\nCompetency in this unit may be assessed through :\n5.1 Written and/or Oral questions to test candidate’s\nknowledge in the\na. organization of service staff for a banquet event.\nb. Floor plan preparation\nc. Table assignments\nd. Work flow\ne. Briefing\n5.2 Simulation/role play to test the candidate’s knowledge\nand skills in overseeing meal service; supervising after\nmeal service and performing customer relations.\n5.3 Portfolio\n\n6. Context of\nAssessment\nAssessment must be conducted in:\n6.1 Workplace or simulated work environment or\n6.2 TESDA accredited assessment center/venue\n\n--- PDF PAGE 41 ---\nFOOD AND BEVERAGE SERVICE NCIII (Amended) Promulgated December 2013 39"
      }
