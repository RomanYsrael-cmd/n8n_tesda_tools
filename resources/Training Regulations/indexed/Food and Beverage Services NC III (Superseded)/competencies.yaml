        "source_title": "TRAIN SMALL GROUPS",
        "source_text": "--- PDF PAGE 26 ---\nTESDA-SOP-QSO-01-F08 \n \nFOOD AND BEVERAGE SERVICE NCIII (Amended)                         Promulgated December 2013         24 \nUNIT OF COMPETENCY : \nTRAIN SMALL GROUPS \n \nUNIT CODE \n: \nTRS311208 \n \nUNIT DESCRIPTOR \n: \nThis unit covers the requirements for planning, delivering \nand reviewing training provided for the purposes of \ndeveloping competency on a one-to-one or small group \nbasis. \n \nELEMENT \nPERFORMANCE CRITERIA \nBold and italicized terms are elaborated in the Range of Variables \n1.  Prepare for trainings \n1.1 \nSpecific training needs are identified and confirmed \nthrough consultation with appropriate personnel. \n1.2 \nTraining objectives are matched to identify to identify \ncompetency development needs. \n1.3 \nTraining approaches are planned and documented. \n \n2.  Deliver training \n2.1 \nTraining is conducted in a safe and accessible \nenvironment. \n2.2 \nTraining delivery methods appropriate to the \nparticipant(s) needs, trainer availability, location and \nresources are selected. \n2.3 \nStrategies and techniques which facilitate the learning \nprocess are employed. \n2.4 \nTraining objectives, sequence of activities and \nassessment processes are discussed with training \nparticipant(s). \n2.5 \nSystematic approach to training is undertaken to meet \nspecific needs of training participant(s).  \n \n3.  Provide opportunities \nfor practices \n3.1 \nPractice opportunities are provided to ensure that the \nparticipants achieve the components of competency. \n3.2 \nVariety of methods for encouraging learning is \nimplemented to meet the individual needs of \nparticipants. \n \n4. Review training \n4.1 \nParticipants are encouraged to self evaluate performance \nand areas for improvement are identified. \n4.2 \nParticipants’ readiness for assessment is monitored and \nassistance is provided with the collection of evidence for \nsatisfactory performance. \n4.3 \nTraining is evaluated against objectives in the context of \nself-assessment, participant feedback, supervisor \ncomments and measurements. \n4.4 \nTraining details are recorded according to enterprise and \nlegislative requirements. \n4.5 \nResults of evaluation are utilized to guide further training.\n\n--- PDF PAGE 27 ---\nTESDA-SOP-QSO-01-F08 \n \nFOOD AND BEVERAGE SERVICE NCIII (Amended)                         Promulgated December 2013         25 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.  Training needs \nMay include: \n1.1 \nIndustry/enterprise or other performance competency \nstandards \n1.2 \nIndustry/workplace training practices \n1.3 \nJob descriptions \n1.4 \nResults of training needs analysis \n1.5 \nBusiness plans of the organization which identify skill \ndevelopment requirements \n1.6 \nStandard operating and/or other workplace procedures \n \n2.  Appropriate \npersonnel \nMay include: \n2.1 \nTeam leaders/supervisors/technical experts \n2.2 \nManagers/employers \n2.3 \nTraining and assessment coordinators \n2.4 \nTraining participants \n2.5 \nRepresentative from government regulatory bodies \n2.6 \nUnion/employee representatives \n \n3.  Training delivery \nmethods \nMay include: \n3.1 \nPresentations \n3.2 \nDemonstrations \n3.3 \nExplanations \n3.4 \nProblem solving \n3.5 \nMentoring \n3.6 \nExperiential learning \n3.7 \nGroup work \n3.8 \nJob rotation \n \n4.  Strategies and \ntechniques \nMay include: \n4.1 \nActive listening \n4.2 \nTargeted questioning  \n4.3 \nPoints of clarification \n4.4 \nGroup discussions \n \n5.  Components of \ncompetency \nMay include: \n5.1 \nTask skill \n5.2 \nTask management skills \n5.3 \nContingency management skills \n5.4 \nJob/role environment skills \n5.5 \nTransfer and application of skills and knowledge of new \ncontents \n \n6.  Needs of \nparticipants \nCharacteristics of training participants may include but not \nlimited to: \n6.1 \nCultural, language, and educational background \n6.2 \nGender \n6.3 \nPhysical ability \n6.4 \nLevel of confidence, nervousness or anxiety \n6.5 \nAge \n6.6 \nPrevious experience with the topic \n6.7 \nExperience in training and assessment\n\n--- PDF PAGE 28 ---\nTESDA-SOP-QSO-01-F08 \n \nFOOD AND BEVERAGE SERVICE NCIII (Amended)                         Promulgated December 2013         26 \nEVIDENCE GUIDE \n \n1. Critical aspects of \ncompetency  \nAssessment requires evidence that the candidate: \n1.1. \nDemonstrated the ability to identify specific training \nneeds and required competency outcomes. \n1.2. \nDemonstrated the ability to outline the training approach \nand steps to be followed. \n1.3. \nDemonstrated the ability to identify training participant(s) \nand delivery method(s) to be used \n1.4. \nDemonstrated the ability to organize and conduct the \ntraining. \n \n 2. Required knowledge \n2.1 \nIdentification of evidence of competency \n2.2 \nCompetency in the units being taught \n2.3 \nTraining delivery methods \n \n3.  Required skills \n3.1 \nPlanning and documenting training approaches  \n3.2 \nTraining delivery methods \n3.3 \nTraining strategies and techniques which facilitate \nlearning process \n3.4 \nCorrect use of equipment and presentation skills \nappropriate for the training \n3.5 \nCommunication skills (written and oral) \n \n4.  Resource  \nimplications \nThe following resources should be provided: \n4.1 \nProject or work activities that allow the candidate to \ndemonstrate planning, conducting and review of training o\na one-to-one or small group basis. \n4.2 \nAccess to records, logbooks, reports and other sources \nof information about the operation and/or the personnel.    \n \n5.  Methods of \nassessment \nCompetency in this unit may be assessed through: \n5.1 \nDirect observation of performance in the conduct of the \ntraining  \n5.2 \nEvaluation of the training plans and documents prepared \nby the candidate \n5.3 \nOral or written questions to assess knowledge in training \nneeds analysis \n \n6.  Context for \nassessment \n6.1 \nCompetency assessment may occur in workplace or any \nappropriately simulated environment \n6.2 \nAssessment shall be observed on multiple occasions \ninvolving a combination of direct, indirect and \nsupplementary forms of evidence.\n",
