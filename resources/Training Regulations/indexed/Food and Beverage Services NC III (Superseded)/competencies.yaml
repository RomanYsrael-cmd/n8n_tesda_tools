        "source_title": "DIRECT AND LEAD SERVICE TEAM IN THE DINING AREA/RESTUARANT",
        "source_text": "--- PDF PAGE 32 ---\nTESDA-SOP-QSO-01-F08 \n \nFOOD AND BEVERAGE SERVICE NCIII (Amended)                         Promulgated December 2013         30 \nCORE COMPETENCIES \n \nUNIT OF COMPETENCY : \nDIRECT AND LEAD SERVICE TEAM IN THE DINING \nAREA/RESTUARANT \n \nUNIT CODE \n: \nTRS512393 \n \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge and skills required in \nsupervising and coordinating the activities of food service \nstaff on their work shift in an outlet or restaurant to ensure \nfast and efficient food service to the guests.  This includes \nfood service duties as well as monitoring the entire food \nservice process. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1. Supervise pre-\nopening preparations \n1.1 \nGuest reservations are monitored and table assignment \nallocations are ensured. \n1.2 \nWaiter service stations are inspected for completeness in \nstocks and supplies. \n1.3 \nTables are rechecked for accuracy in setting. \n1.4 \nCleanliness of the dining area/restaurant is checked \naccording to standards of the establishment. \n \n2. Oversee food and \nbeverage service in \nthe dining area \n2.1 \nStandards of service are monitored throughout the day. \n2.2 \nService staffs are observed, ensuring quality service all \nthe time. \n2.3 \nService briefing is conducted among service staff at the \nbeginning of the shift. \n2.4 \nFlow of service is coordinated with the kitchen. \n2.5 \nQuality is controlled and ensured in all service areas. \n2.6 \nGuest concerns are communicated to the chef and the \nkitchen staff. \n2.7 \nAssistance in service is provided during peak hours or \nbusy periods. \n2.8 \nGuest concerns and complaints are resolved to the \nsatisfaction of the guest. \n \n3. Perform specialized \ndining room service \n3.1 \nSpecialized dining room service is carried out \nefficiently in accordance with the standards of the \nestablishment. \n3.2 \nGueridon or sidetable trolley is set up with proper mise \nen place. \n3.3 \nSafety precautions are taken and made certain all the \ntime.\n\n--- PDF PAGE 33 ---\nTESDA-SOP-QSO-01-F08 \n \nFOOD AND BEVERAGE SERVICE NCIII (Amended)                         Promulgated December 2013         31 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Service briefing \nMay include: \n1.1 \nTable reservations \n1.2 \nVIP guests \n1.3 \nDaily specials, food promos \n1.4 \nOut of stock items \n1.5 \nChefs’ recommendations \n \n2. Assistance in service \nMay include: \n2.1 \nGreeting and welcoming guests \n2.2 \nTaking table reservations \n2.3 \nEscorting and seating guests \n2.4 \nTaking food and beverage orders \n2.5 \nServing food and beverage orders \n2.6 \nWine selection \n \n3. Specialized dining \nroom service \nMay include: \n3.1 \nFlaming or flambé service \n3.2 \nFood carving (poultry and game etc) \n3.3 \nSalad preparation \n3.4 \nDeboning fish and seafoods \n \n4. Gueridon mise en \nplace \nMay include: \n4.1 \nAll necessary: dinnerware, glassware, silverware \n4.2 \nService plates \n4.3 \nNapkins \n4.4 \nCondiments \n4.5 \nSalt and Pepper shakers \n4.6 \nFood ingredients \n \n5. Safety precautions \nMay include: \n5.1 \nRegular checkup of tableside stove  \n5.2 \nFire extinguisher in place \n5.3 \nSufficient distance from guest tables \n5.4 \nCorrect equipment and tools used \n5.5 \nCompliance with occupational health and safety \nrequirements\n\n--- PDF PAGE 34 ---\nTESDA-SOP-QSO-01-F08 \n \nFOOD AND BEVERAGE SERVICE NCIII (Amended)                         Promulgated December 2013         32 \nEVIDENCE GUIDE \n \n1. Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1 \nMonitored mise en place preparations \n1.2 \nConducted service briefings \n1.3 \nPerformed specialized dining room service \n \n2. Required Knowledge \n2.1 \nMise en place preparation \n2.2 \nDuties and responsibilities of food and beverage \nservice personnel \n2.3 \nTableware \n2.4 \nTable set-ups \n2.5 \nSpecialized dining room service \n2.6 \nTable service styles \n2.7 \nSuggestive and upselling \n2.8 \nPrinciples of OSHC  \n3. Required skills \n3.1 \nTable set up \n3.2 \nConducting service briefing \n3.3 \nGueridon service \n3.4 \nSales skills \n3.5 \nEffective customer relation skills \n \n4. Resource  \nImplications \n      \nThe following resources should be provided: \n4.1 \ncarry out a range of suitably simulated practical \nassessment on how to conduct service briefings \n4.2 \nthe availability of gueridon or tableside trolley  \n \n5. Methods of \nAssessment     \n     \nCompetency in this unit may be assessed through : \n5.1 \nOral questions to test candidate’s knowledge on \nStation mise-en-place; staff monitoring; ensuring \nquality service in the dining area \n5.2 \nSimulation/role play to test the candidate’s knowledge \nand skills in conducting daily briefing and gueridon \nservice. \n5.3 \nPortfolio \n \n6. Context of \nAssessment \nAssessment must be conducted in  \n6.1 \nWorkplace or simulated environment \n6.2 \nTESDA accredited assessment center/venue\n",
