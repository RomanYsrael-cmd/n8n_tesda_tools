        "evidence_guide": {
          "source_text": "1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1.\nDemonstrated the ability to identify specific training\nneeds and required competency outcomes.\n1.2.\nDemonstrated the ability to outline the training approach\nand steps to be followed.\n1.3.\nDemonstrated the ability to identify training participant(s)\nand delivery method(s) to be used\n1.4.\nDemonstrated the ability to organize and conduct the\ntraining.\n\n 2. Required knowledge\n2.1\nIdentification of evidence of competency\n2.2\nCompetency in the units being taught\n2.3\nTraining delivery methods\n\n3. Required skills\n3.1\nPlanning and documenting training approaches\n3.2\nTraining delivery methods\n3.3\nTraining strategies and techniques which facilitate\nlearning process\n3.4\nCorrect use of equipment and presentation skills\nappropriate for the training\n3.5\nCommunication skills (written and oral)\n\n4. Resource\nimplications\nThe following resources should be provided:\n4.1\nProject or work activities that allow the candidate to\ndemonstrate planning, conducting and review of training o\na one-to-one or small group basis.\n4.2\nAccess to records, logbooks, reports and other sources\nof information about the operation and/or the personnel.\n\n5. Methods of\nassessment\nCompetency in this unit may be assessed through:\n5.1\nDirect observation of performance in the conduct of the\ntraining\n5.2\nEvaluation of the training plans and documents prepared\nby the candidate\n5.3\nOral or written questions to assess knowledge in training\nneeds analysis\n\n6. Context for\nassessment\n6.1\nCompetency assessment may occur in workplace or any\nappropriately simulated environment\n6.2\nAssessment shall be observed on multiple occasions\ninvolving a combination of direct, indirect and\nsupplementary forms of evidence.\n\n--- PDF PAGE 29 ---\nTESDA-SOP-QSO-01-F08\n\nFOOD AND BEVERAGE SERVICE NCIII (Amended) Promulgated December 2013 27\nUNIT OF COMPETENCY :\nESTABLISH AND CONDUCT BUSINESS\nRELATIONSHIPS\n\nUNIT CODE\n:"
