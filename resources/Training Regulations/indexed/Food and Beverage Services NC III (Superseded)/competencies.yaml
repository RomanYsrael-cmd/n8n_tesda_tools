        "source_title": "ESTABLISH AND CONDUCT BUSINESS RELATIONSHIPS",
        "source_text": "--- PDF PAGE 29 ---\nTESDA-SOP-QSO-01-F08 \n \nFOOD AND BEVERAGE SERVICE NCIII (Amended)                         Promulgated December 2013         27 \nUNIT OF COMPETENCY : \nESTABLISH AND CONDUCT BUSINESS \nRELATIONSHIPS   \n \nUNIT CODE \n: \nTRS311209 \n \nUNIT DESCRIPTOR \n: \nThis unit covers the skills and knowledge required to \nmanage business relationships with customers or suppliers \nwithin a tourism or hospitality context. It focuses on the \nrelationship building and negotiation skills. \n \nELEMENT \nPERFORMANCE CRITERIA \nBold and italicized terms are elaborated in the Range of Variables \n1.  Establish and \nconduct business \nrelationships \n1.1 \nRelationships are established in a manner that \npromotes goodwill and trust between the enterprise, its \ncustomers and suppliers. \n1.2 \nTrust and respect are built in business relationships \nthrough use of effective communication skills and \ntechniques  \n1.3 \nOpportunities to maintain regular contact with \ncustomers and suppliers are identified and taken up. \n \n2.  Conduct negotiations \n2.1 \nNegotiations are conducted in a business-like and \nprofessional manner within the relevant cultural context. \n2.2 \nNegotiations are conducted in the context of the current \nenterprise marketing focus. \n2.3 \nBenefits for all parties in the negotiation are maximized \nthrough use of established techniques and in the context \nof establishing long term relationships. \n2.4 \nFeedback and input from colleagues are incorporated \ninto the negotiation. \n2.5 \nThe results of negotiations are communicated to \nappropriate colleagues and stakeholders within the \nappropriate timeframes. \n \n3.  Make formal \nbusiness agreements \n3.1 \nAgreements are confirmed in writing using formal \ncontracts and in accordance to enterprise requirements. \n3.2 \nAppropriate approvals for all aspects of formal \nagreements are checked and obtained in accordance \nwith enterprise procedures. \n3.3 \nThe need for specialist advice in the development of \ncontracts is identified and sought where appropriate.  \n \n4.  Foster and maintain \nbusiness \nrelationships \n4.1 \nInformation needed to maintain sound business \nrelationships are pro-actively sought, reviewed and acted \nupon. \n4.2 \nAgreements are honored within the scope of individual \nresponsibility. \n4.3 \nAdjustments to agreements are made in consultation with \nthe customer/supplier and information is shared with \nappropriate colleagues. \n4.4 \nRelationships are nurtured through regular contact.\n\n--- PDF PAGE 30 ---\nTESDA-SOP-QSO-01-F08 \n \nFOOD AND BEVERAGE SERVICE NCIII (Amended)                         Promulgated December 2013         28 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.  Business \nrelationships \nMay include: \n1.1 \nCustomers \n1.2 \nSuppliers \n1.3 \nGovernment agencies \n1.4 \nConcessionaires \n \n2.  Opportunities \nMay include: \n2.1 \nInformal social occasions \n2.2 \nIndustry functions \n2.3 \nAssociation membership \n2.4 \nCo-operative promotions  \n2.5 \nProgram of regular telephone contact \n \n3.  Negotiations \nMay include: \n3.1 \nCorporate accounts \n3.2 \nService contacts \n3.3 \nAgency agreements \n3.4 \nVenue contracts \n3.5 \nRate negotiations \n3.6 \nMarketing agreements \n3.7 \nPreferred product agreements \n \n4.  Techniques \nMay include : \n4.1 \nIdentification of goals, limits \n4.2 \nClarification of needs of all parties \n4.3 \nIdentifying points of agreement and points of difference \n4.4 \nPreparatory research of facts \n4.5 \nActive listening and questioning \n4.6 \nNon-verbal communication techniques \n4.7 \nAppropriate language \n4.8 \nBargaining \n4.9 \nDeveloping options \n4.10 Confirming agreements \n4.11 Appropriate cultural behavior\n\n--- PDF PAGE 31 ---\nTESDA-SOP-QSO-01-F08 \n \nFOOD AND BEVERAGE SERVICE NCIII (Amended)                         Promulgated December 2013         29 \nEVIDENCE GUIDE \n \n1.  Critical aspects of \ncompetency  \nAssessment requires evidence that the candidate: \n1.1 Demonstrated the ability to conduct successfully \nbusiness negotiations \n1.2 Demonstrated the ability to build and maintain \nrelationships o achieve successful business outcomes \n1.3 Demonstrated the knowledge and understanding of the \ncurrent environment and major industry issues in which \ntourism and/or hospitality businesses operate. \n \n2.  Required knowledge \n2.1 \nBusiness environment including major industry issues in \nwhich the tourism and hospitality industry operates. \n2.2 \nLegal issues that affect negotiations and contracts \n2.3 \nGeneral knowledge about contracts. \n \n3.  Required skills \n3.1 \nNegotiation and communication techniques appropriate \nto negotiations. \n3.2 \nInterpersonal skills \n3.3 \nMathematical skills i.e. calculating profit margins for the \ncontract \n \n4.  Resource  \nimplications \nThe following resources should be provided: \n4.1 \nProject or work activities conducted over a period of time so\nthat all aspects of the unit can be assessed. \n4.2 \nRelationship-building and negotiation activities with a \nrange of individuals with whom the candidate has an \nactual or potential business relationship.  \n \n5.  Methods of \nassessment \nCompetency in this unit may be assessed through: \n5.1 \nEvaluation of negotiation and business relationships or \nagreements conducted or made by the candidate \n5.2 \nEvaluation of reports prepared by the candidate detailing \nhow the negotiation aspects of a project were managed. \n5.3 \nCase studies to assess application of knowledge to \nbusiness situations. \n \n6.  Context for \nassessment \n6.1 \nCompetency assessment may occur in workplace or any \nappropriately simulated environment \n6.2 \nAssessment shall be observed on multiple occasions \ninvolving a combination of direct, indirect and \nsupplementary forms of evidence.\n",
        "required_knowledge": null,
        "required_skills": null
      }
