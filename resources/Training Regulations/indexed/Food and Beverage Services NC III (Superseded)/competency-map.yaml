  "source_text": "Section 1. Successful candidates shall be awarded a National Certificate signed by\nthe TESDA Director General.\n\n4.2 The qualification for FOOD AND BEVERAGE SERVICES NC III may be attained\nthrough demonstration of competence covering all the required core units of\nqualification.\n\n4.3\nAssessment shall focus on the core units of competency. The basic and common\nunits shall be integrated or assessed concurrently with the core units.\n\n4.4\nThe following are qualified to apply for assessment and certification:\n\n4.4.1\nGraduates of formal, non-formal and informal institutions including\nenterprise-based training programs\n4.4.2\nExperienced workers (wage employed or self employed)\n\n4.5\nThe guidelines on assessment and certification are discussed in detail in the\n\"Procedures Manual on Assessment and Certification\" and \"Guidelines on the\nImplementation of the Philippine TVET Qualification and Certification System\n(PTQCS)\".\n\n--- PDF PAGE 50 ---\nFOOD AND BEVERAGE SERVICE NCIII (Amended) Promulgated December 2013 48\n\nCOMPETENCY MAP\nFOOD AND BEVERAGE SERVICES NC III\nCORE\nCOMPETENCIES\nLaunder linen\nand guest clothes\nOperate a\ncomputerized\nreservations\nsystem\nPrepare and\nproduce pastry\nproducts\nReceive and\nhandle guest\nconcerns\nSelect catering\nsystem\nPlan, prepare and\nserve specialized\nfood items\nPrepare starch\ndishes\nProvide a lost and\nfound facility\nProvide valet\nservices\nReceive and\nprocess\nreservations\nPrepare and\nproduce bakery\nproducts\nProvide room\nservice\nDevelop menus\nto meet special\ndietary and\ncultural needs\nPrepare pates and\nterrines\nPrepare egg\ndishes\nProvide for the\nsafety of Very\nImportant Persons\n(VIP)\nClean premises\nProvide wine\nservice\nPlan coffee shop\nlayout, menu and\nstorage (Coffee\nShop)\nPrepare food and\nbeverage service\nto guests\nApply catering\ncontrol principles\nOrganize bulk\ncooking operations\nPrepare\nvegetable dishes\nManage stock\npurchases and\ninve