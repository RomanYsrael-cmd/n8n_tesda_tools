  "source_section_text": "SECTION 3 TRAINING STANDARDS\n\nThese guidelines are set to provide the Technical and Vocational Education and\nTraining (TVET) providers with information and other important requirements to consider\nwhen designing training programs for FOOD AND BEVERAGE SERVICES NC III.\n\nThe guidelines include information on curriculum design, training delivery, trainee\nentry requirements, tools and equipment, training facilities, and trainer’s qualification\namong others.\n\n3.1\nCURRICULUM DESIGN\n\nCourse Title : FOOD AND BEVERAGE SERVICES\nNC Level: III\n\nNominal Training Duration:\n20 Hrs. (Basic)\n\n24 Hrs. (Common)\n\n 186 Hrs. (Core)\n\nCourse Description:\nThis course is designed to enhance the knowledge, skills, and attitudes of trainee in\naccordance with industry standards. It covers the basic, common and core competencies\nrequired for the NCIII level in the delivery and supervision of food and beverage service in\nvarious foodservice facilities. It covers the core competencies on directing and leading\nservice team in the dining area, overseeing dining operations and banquet and catering\nfunction.\n.\n\nBASIC COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Lead workplace\ncommunication\n1.1 Communicate\ninformation about\nworkplace processes.\n1.2 Lead workplace\ndiscussions.\n1.3 Identify and\ncommunicate issues\narising in the workplace\n\n• Group\ndiscussion\n• Role Play\n• Brainstorming\n\n• Observation\n• Interviews\n2. Lead small\nteams\n2.1 Provide team leadership.\n2.2 Assign responsibilities\namong members.\n2.3 Set performance\nexpectation for team\nmembers.\n2.4 Supervise team\nperformance\n\n• Lecture\n• Demonstration\n• Self-paced\n(modular)\n• Demonstration\n• Case studies\n\n--- PDF PAGE 42 ---\nFOOD AND BEVERAGE SERVICE NCIII (Amended) Promulgated December 2013 40\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n3. Develop and\npractice\nnegotiation\nskills\n3.1 Identify relevant\ninformation in planning\nnegotiations\n3.2 Participate in\nnegotiations\n3.3 Document areas for\nagreement\n\n• Direct\nobservation\n• Simulation/role\nplaying\n• Case studies\n• Written test\n• Practical/\nperformance\ntest\n4. Solve\nworkplace\nproblems\nrelated to work\nactivities\n4.1 Explain the analytical\ntechniques.\n4.2 Identify the problem.\n4.3 Determine the possible\ncause/s of the problem.\n\n• Direct\nobservation\n• Simulation/role\nplaying\n• Case studies\n• Written test\n• Practical/\nperformance\ntest\n5. Use\nmathematical\nconcepts and\ntechniques\n5.1 Identify mathematical\ntools and techniques to\nsolve problem\n5.2 Apply mathematical\nprocedures/solution\n5.3 Analyze results\n\n• Direct\nobservation\n• Simulation/role\nplaying\n• Case studies\n• Written test\n• Practical/\nperformance\ntest\n6. Use relevant\ntechnologies\n6.1 Study/select appropriate\ntechnology\n6.2 Apply relevant\ntechnology\n6.3 Maintain/enhance\nrelevant technology\n\n• Direct\nobservation\n• Simulation/role\nplaying\n• Case studies\n• Written test\n• Practical/\nperformance\ntest\n\n--- PDF PAGE 43 ---\nFOOD AND BEVERAGE SERVICE NCIII (Amended) Promulgated December 2013 41\nCOMMON COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Roster staff\n1.1\nDevelop and implement\nstaff rosters\n1.2\nMaintain staff records\n\n• Discussion\n• Case study\n• Observation\n• Interview\n• Written test\n2. Control and\norder stock\n2.1\nMaintain stock levels\nand records\n2.2\nProcess stock orders\n2.3\nManage stock losses\n2.4\nFollow-up orders\n2.5\nOrganize and administer\nstocks\n\n• Discussion\n• Lecture\n• Simulation\n• Written test\n• Review of\ndocuments\n3. Train small\ngroups\n3.1\nPrepare for training\n3.2\nDeliver training\n3.3\nProvide opportunities for\npractices\n3.4\nReview training\n• Lecture/\n• Discussion\n• Demonstration\n• Hands-on\n• Video Viewing\n• Written Test\n• Oral\nQuestioning\n• Review of\ndocuments\n• Direct\nobservation\n\n4. Establish and\nconduct\nbusiness\nrelationships\n4.1\nEstablish and conduct\nbusiness relationships\n4.2\nConduct negotiations\n4.3\nMake formal business\nagreements\n4.4\nFoster and maintain\nbusiness relationships\n• Lecture/\n• Discussion\n• Demonstration\n• Hands-on\n• Video Viewing\n• Written Test\n• Oral\nQuestioning\n• Review of\ndocuments\n• Direct\nobservation\n• Case studies\n\n--- PDF PAGE 44 ---\nFOOD AND BEVERAGE SERVICE NCIII (Amended) Promulgated December 2013 42\nCORE COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Direct and lead\nservice team in\nthe dining area/\nrestaurant\n\n1.1\nSupervise pre-opening\npreparations\n1.2\nOversee food and\nbeverage service in the\ndining area\n1.3\nPerform specialized\ndining room service\n\n• Lecture\n• Discussion\n• Demonstration\n• Hands-on\n• Video Viewing\n• Oral or written\ntest\n• Direct\nobservation\n• Practical test\n2. Oversee dining\narea operations\n2.1\nOrganize dining room\nstaff\n2.2\nEnforce policies\n2.3\nDevelop dining staff\n• Lecture\n• Discussion\n• Demonstration\n• Hands-on\n• Video Viewing\n• Oral or written\ntest\n• Direct\nobservation\n• Practical test\n• Sensory\nevaluation of\nfinished\nproduct\n\n3. Oversee\nbanquet and/or\ncatering\nfunction\n3.1\nSupervise pre-function\nmise-en place\n3.2\nOversee meal service\n3.3\nSupervise after meal\nservice\n3.4\nPerform customer\nrelations\n• Lecture\n• Discussion\n• Demonstration\n• Hands-on\n• Video Viewing\n• Oral or written\ntest\n• Direct\nobservation\n• Practical test\n• Sensory\nevaluation of\nfinished\nproduct\n\n--- PDF PAGE 45 ---\nFOOD AND BEVERAGE SERVICE NCIII (Amended) Promulgated December 2013 43\n3.2\nTRAINING DELIVERY\n\nThe delivery of training should follow the design of the curriculum. Delivery should\nbe guided by the 10 basic principles of competency-based TVET.\n\n•\nThe training is based on curriculum developed from the competency\nstandards;\n•\nLearning is modular in its structure;\n•\nTraining delivery is individualized and self-paced;\n•\nTraining is based on work that must be performed;\n•\nTraining materials are directly related to the competency standards and the\ncurriculum modules;\n•\nAssessment is based on the collection of evidence of the performance of work\nto the industry required standard;\n•\nTraining is based both on and off-the-job components;\n•\nAllows for recognition of prior learning (RPL) or current competencies;\n•\nTraining allows for multiple entry and exit; and\n•\nApproved training programs are Nationally Accredited\n\nThe competency-based TVET system recognizes various types of delivery\nmodes, both on and off-the-job as long as the learning is driven by the competency\nstandards specified by the industry. The following training modalities may be adopted\nwhen designing training programs:\n\n•\nThe dualized mode of training delivery is preferred and recommended, thus,\nprograms would contain both in-school and in-industry training or fieldwork\ncomponents. Details can be referred to the Dual Training System (DTS)\nImplementing Rules and Regulations.\n\n•\nModular/self-paced learning is a competency-based training modality where\nthe trainee is allowed to progress at his own pace. The trainer only facilitates\nthe training delivery\n\n•\nPeer teaching/mentoring is a training modality wherein fast learners are given\nthe opportunity to assist the slow learners\n\n•\nSupervised industry training or on-the-job training is a training approach\ndesigned to enhance the knowledge and skills of the trainee through actual\nexperience in the workplace to acquire specific competencies prescribed in the\ntraining regulations\n\n•\nDistance learning is a formal education process in which majority of the\ninstruction occurs when the students and instructor are not in the same place.\nDistance learning may employ correspondence study, audio, video or\ncomputer technologies\n\n--- PDF PAGE 46 ---\nFOOD AND BEVERAGE SERVICE NCIII (Amended) Promulgated December 2013 44\n3.3\nTRAINEE ENTRY REQUIREMENTS\n\nTrainees or students who wish to enter this training should possess the following\nrequirements:\n\n•\ncan communicate in basic English in both oral and written form\n•\nmust have completed the 10-year basic education\n•\ncan perform basic mathematical computation\n•\nmust be competent in the entire Food and Beverage Services NCII qualification\neither through training, experience or certification\n\n3.4\nLIST OF TOOLS, EQUIPMENT AND MATERIALS\n\nRecommended list of tools, equipment and materials for the training of a maximum\nof 25 trainees for FOOD AND BEVERAGE SERVICES NC III are as follows:\n\nWAITERING TOOLS, MATERIALS AND EQUIPMENT\nQTY\nDINNERWARE\nQTY\nCUTLERIES\nQTY\nGLASSWARE\n24\nDinner plates, 10”\n24\nDinner knives\n24\nRed wine glasses\n6\nShow/service\nplates, 11-14”\n24\nDinner forks\n24\nWhite wine glasses\n24\nSalad plates 7-8”\n24\nSalad knives\n24\nWater goblets\n24\nFish plates, 8-9”\n24\nSalad forks\n24\nJuice glasses/Hi ball\n24\nDessert plates, 7-\n8”\n24\nFish knives\n24\nChampagne flute\n24\nSide plates or\nbread plates, 6”\n24\nFish forks\n24\nCollins glasses\n24\nSoup plate/bowl\n24\nSoup spoons (cream\nand consume)\n24\nPilsner glasses/Ice tea\nglasses\n24\nCups and saucers\n5-6 oz\n24\nDessert spoons\n\n24\nDinner plates, 10”\n24\nDessert forks\n\n24\nTeaspoons\n\n24\nCocktail forks\n\n6\nService forks\n\n6\nService spoons\n\n24\nSteak knives\n\n24\nButter knives\n\n24\nOyster forks\n\n--- PDF PAGE 47 ---\nFOOD AND BEVERAGE SERVICE NCIII (Amended) Promulgated December 2013 45\nQTY\nOTHER\nSERVICEWARE\nQTY\n\nQTY\nOTHER ACCESSORIES\n2\nCoffee pot\n6\n table cloths\n6\nMenu Folders\n2\nTea pot\n6\nTable skirting cloths\n\nOrder pads\n4\nSalt and Pepper\nshakers\n6\nSide towels\n6\nBill folder/change trays\n6\nservice trays\n30\n16” x16” Cloth Table\nnapkin\n2\nWaiter station/cabinet\n8\nSilver platters\n\n2\nTray stand (Dummy\nwaiter)\n8\nRound (bar) trays\n\n2\nBoning knives\n4\nTooth pick holders\n\n6\nAll-purpose knives\n6\nNapkin holders\n\n4\nChopping boards\n3\nSugar containers\n\n10\nUtility bowls/plates\n3\nCreamer\ncontainers\n\nEQUIPMENT\n2 sets\nWooden fork and\nspoons\n4\nSauce/gravy boats\n1\nTableside service cart\nw/ rechaud (Gueridon)\n2\nWooden bowls (Caesar\nsalad preparation)\n4\nSoup tureen\n1\n(push) cart to\ntransport/move\nbanquet operating\nequipment\n4\nPlastic bin boxes to be\nused when moving\nbanquet operating\nequipment\n2\nPeppermill\n\n2\nNon-stick round (crepe)\npan\n6\nService forks and\nspoons\n\nINGREDIENTS for\n2\nTurners (for non-stick\npans)\n2\nFood tongs\n\nCaesar Salad\n\n2\nSauce ladles\n\nCrepes\n\n2\nSoup ladles\n\nTABLES/CHAIRS\n2\nCake servers\n\n4\nSquare/rectangular\ntables (4’s/6’s)\n6\nWater pitchers\n\n3\nround tables (8’s)\n2\nIce buckets with\ntongs\n\n50\nDining/Banquet chairs\n\n*NOTE:\nImplementation of the training program can be made possible through a MOA between\nthe Training school and Industry (Full Service Restaurant or Catering Service) for the\nuse of the facilities.\n\n--- PDF PAGE 48 ---\nFOOD AND BEVERAGE SERVICE NCIII (Amended) Promulgated December 2013 46\n3.5\nTRAINING FACILITIES\n\nBased on a class intake of 25 students/trainees.\n\nSpace Requirement\nSize in Meters\nArea in Sq.\nMeters\nTotal Area in Sq.\nMeters\nStudent/Trainee\nWorking Space\n1 x 1 m.\n1 sq. m.\n25 sq. m\nLecture/Demo Room\n8 x 5 m.\n40 sq. m.\n40 sq. m.\nLaboratory\n8 x 5 m.\n40 sq. m.\n40 sq. m.\nLearning Resource\nCenter\n3 x 5 m.\n15 sq. m.\n15 sq. m.\nFacilities/Equipment/\nCirculation Area\n\n36 sq. m.\nTotal workshop area:\n156 sq. m.\n\n3.6\nTRAINER’S QUALIFICATIONS FOR TOURISM SECTOR (HOTELS AND\nRESTAURANTS)\n\nFOOD AND BEVERAGE SERVICES NC III\n\nTRAINER’S QUALIFICATIONS\n\n• Must be a holder of National TVET Trainer Certificate (NTTC) Level I in Food\nand Beverage Services NC III\n• Must have at least 3 years industry experience\n• Must have attended relevant upgrading food and beverage services training and\nseminars\n\n3.7\nINSTITUTIONAL ASSESSMENT\n\nInstitutional assessment is undertaken by trainees to determine their achievement\nof units of competency. A certificate of achievement is issued for each unit of\ncompetency.\n\n--- PDF PAGE 49 ---\nFOOD AND BEVERAGE SERVICE NCIII (Amended) Promulgated December 2013 47"
