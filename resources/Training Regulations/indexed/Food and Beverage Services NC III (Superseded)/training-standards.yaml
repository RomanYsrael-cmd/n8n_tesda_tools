    "source_text": "3.1\nCURRICULUM DESIGN\n\nCourse Title : FOOD AND BEVERAGE SERVICES\nNC Level: III\n\nNominal Training Duration:\n20 Hrs. (Basic)\n\n24 Hrs. (Common)\n\n 186 Hrs. (Core)\n\nCourse Description:\nThis course is designed to enhance the knowledge, skills, and attitudes of trainee in\naccordance with industry standards. It covers the basic, common and core competencies\nrequired for the NCIII level in the delivery and supervision of food and beverage service in\nvarious foodservice facilities. It covers the core competencies on directing and leading\nservice team in the dining area, overseeing dining operations and banquet and catering\nfunction.\n.\n\nBASIC COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Lead workplace\ncommunication\n1.1 Communicate\ninformation about\nworkplace processes.\n1.2 Lead workplace\ndiscussions.\n1.3 Identify and\ncommunicate issues\narising in the workplace\n\n• Group\ndiscussion\n• Role Play\n• Brainstorming\n\n• Observation\n• Interviews\n2. Lead small\nteams\n2.1 Provide team leadership.\n2.2 Assign responsibilities\namong members.\n2.3 Set performance\nexpectation for team\nmembers.\n2.4 Supervise team\nperformance\n\n• Lecture\n• Demonstration\n• Self-paced\n(modular)\n• Demonstration\n• Case studies\n\n--- PDF PAGE 42 ---\nFOOD AND BEVERAGE SERVICE NCIII (Amended) Promulgated December 2013 40\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n3. Develop and\npractice\nnegotiation\nskills\n3.1 Identify relevant\ninformation in planning\nnegotiations\n3.2 Participate in\nnegotiations\n3.3 Document areas for\nagreement\n\n• Direct\nobservation\n• Simulation/role\nplaying\n• Case studies\n• Written test\n• Practical/\nperformance\ntest\n4. Solve\nworkplace\nproblems\nrelated to work\nactivities\n4.1 Explain the analytical\ntechniques.\n4.2 Identify the problem.\n4.3 Determine the possible\ncause/s of the problem.\n\n• Direct\nobservation\n• Simulation/role\nplaying\n• Case studies\n• Written test\n• Practical/\nperformance\ntest\n5. Use\nmathematical\nconcepts and\ntechniques\n5.1 Identify mathematical\ntools and techniques to\nsolve problem\n5.2 Apply mathematical\nprocedures/solution\n5.3 Analyze results\n\n• Direct\nobservation\n• Simulation/role\nplaying\n• Case studies\n• Written test\n• Practical/\nperformance\ntest\n6. Use relevant\ntechnologies\n6.1 Study/select appropriate\ntechnology\n6.2 Apply relevant\ntechnology\n6.3 Maintain/enhance\nrelevant technology\n\n• Direct\nobservation\n• Simulation/role\nplaying\n• Case studies\n• Written test\n• Practical/\nperformance\ntest\n\n--- PDF PAGE 43 ---\nFOOD AND BEVERAGE SERVICE NCIII (Amended) Promulgated December 2013 41\nCOMMON COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Roster staff\n1.1\nDevelop and implement\nstaff rosters\n1.2\nMaintain staff records\n\n• Discussion\n• Case study\n• Observation\n• Interview\n• Written test\n2. Control and\norder stock\n2.1\nMaintain stock levels\nand records\n2.2\nProcess stock orders\n2.3\nManage stock losses\n2.4\nFollow-up orders\n2.5\nOrganize and administer\nstocks\n\n• Discussion\n• Lecture\n• Simulation\n• Written test\n• Review of\ndocuments\n3. Train small\ngroups\n3.1\nPrepare for training\n3.2\nDeliver training\n3.3\nProvide opportunities for\npractices\n3.4\nReview training\n• Lecture/\n• Discussion\n• Demonstration\n• Hands-on\n• Video Viewing\n• Written Test\n• Oral\nQuestioning\n• Review of\ndocuments\n• Direct\nobservation\n\n4. Establish and\nconduct\nbusiness\nrelationships\n4.1\nEstablish and conduct\nbusiness relationships\n4.2\nConduct negotiations\n4.3\nMake formal business\nagreements\n4.4\nFoster and maintain\nbusiness relationships\n• Lecture/\n• Discussion\n• Demonstration\n• Hands-on\n• Video Viewing\n• Written Test\n• Oral\nQuestioning\n• Review of\ndocuments\n• Direct\nobservation\n• Case studies\n\n--- PDF PAGE 44 ---\nFOOD AND BEVERAGE SERVICE NCIII (Amended) Promulgated December 2013 42\nCORE COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Direct and lead\nservice team in\nthe dining area/\nrestaurant\n\n1.1\nSupervise pre-opening\npreparations\n1.2\nOversee food and\nbeverage service in the\ndining area\n1.3\nPerform specialized\ndining room service\n\n• Lecture\n• Discussion\n• Demonstration\n• Hands-on\n• Video Viewing\n• Oral or written\ntest\n• Direct\nobservation\n• Practical test\n2. Oversee dining\narea operations\n2.1\nOrganize dining room\nstaff\n2.2\nEnforce policies\n2.3\nDevelop dining staff\n• Lecture\n• Discussion\n• Demonstration\n• Hands-on\n• Video Viewing\n• Oral or written\ntest\n• Direct\nobservation\n• Practical test\n• Sensory\nevaluation of\nfinished\nproduct\n\n3. Oversee\nbanquet and/or\ncatering\nfunction\n3.1\nSupervise pre-function\nmise-en place\n3.2\nOversee meal service\n3.3\nSupervise after meal\nservice\n3.4\nPerform customer\nrelations\n• Lecture\n• Discussion\n• Demonstration\n• Hands-on\n• Video Viewing\n• Oral or written\ntest\n• Direct\nobservation\n• Practical test\n• Sensory\nevaluation of\nfinished\nproduct\n\n--- PDF PAGE 45 ---\nFOOD AND BEVERAGE SERVICE NCIII (Amended) Promulgated December 2013 43"
