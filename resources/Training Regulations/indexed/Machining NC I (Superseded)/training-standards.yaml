    "source_text": "3.1 CURRICULUM DESIGN\n\nCourse Title: MACHINING NC Level: NC I\n\nNominal Training Duration : 374 Hours\n\nThis qualification is designed to develop knowledge, desirable attitudes and skills\nof Machinist NC I.\n It covers the competencies required to Perform Bench work ( Basic ) ,Turn\nWorkpiece ( Basic ), Mill Workpiece ( Basic ) and Grind workpiece ( Basic ).\n To obtain this, all units of competency prescribed for this qualification must be\nachieved.\n\nBASIC COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Receive and\nrespond to\nworkplace\ncommunication\n1.1 Explain routinary\n speaking & messages\n in a workplace\n1.2 Follow routinary\n speaking & messages\n1.3 Perform work duties\n following written notices\n\n• Group\ndiscussion\n• Interaction\n\n•\nInterviews/\nquestioning\n•\nObservation\n2. Work with\nothers\n2.1 Develop effective\n workplace relationship\n2.2 Contribute to work\n group activities\n\n• Group\ndiscussion\n• Interaction\n\n•\nInterviews/\nquestioning\n•\nDemonstration\n•\nObservation\n3. Demonstrate\nwork values\n\n3.1 Define the purpose of\n work\n3.2 Apply work values/\n ethics\n3.3 Deal with ethical\n problems\n3.4 Maintain integrity of\n conduct in the\n workplace\n\n• Group\ndiscussion\n• Interaction\n\n•\nDemonstration\n•\nObservation\n•\nInterviews/\nquestioning\n\n--- PDF PAGE 57 ---\nmach110504ts\n01/04/05\n56\n4. Practice\nhousekeeping\nprocedures\n4.1 Sort and remove\n unnecessary items\n4.2 Arrange items\n4.3 Maintain work areas,\n tools and equipment\n4.4 Follow standardize work\n process and procedures\n4.5 Perform work\n spontaneously\n\n• Group\ndiscussion\n• Interaction\n\n•\nDemonstration\n•\nObservation\n•\nInterviews/\nquestioning\n\nCOMMON COMPETENCIES\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment Approach\n\n1. Apply safety\n practices\n\n2. Interpret\nworking\ndrawing and\nsketches\n\n3. Select / cut\nworkshop\nmaterials\n\n1.1 Identify hazards\n1.2 Use protective\n clothing and devices\n1.3 Perform safe handling\n of tools, equipment\n and materials\n1.4 Perform first aid\n1.5 Use fire extinguisher\n\n2.1 Interpret technical\n drawing\n2.2 Prepare freehand\n sketch of parts\n2.3 Interpret details from\n freehand sketch\n\n3.1 Determine requirement\n3.2 Select and measure\n materials\n 3.3 Cut materials\n\n• Lecture\n• Group\n discussion\n• Interaction\n• Role\n playing /\n Simulation\n• Lecture\n• Group\n discussion\n• Interaction\n\n• Lecture\n• Demonstration\n• Practical\n exercise\n\n• Observation\n• Demonstration\n• Interview /\n Questioning\n• Observation\n• Interview /\n Questioning\n• Demonstration\n• Observation\n• Performance\n test\n• Interview /\n Questioning\n\n--- PDF PAGE 58 ---\nmach110504ts\n01/04/05\n57\n4. Perform\n shop\n computations\n (Basic)\n\n5. Measure\n workpiece\n (Basic)\n\n6. Perform\n routine\nhousekeeping\n\n7. Perform\npreventive\nand\ncorrective\nmaintenance\n\n4.1 Perform four\n fundamental operations\n4.2 Perform basic\n calculations involving\n fractions and decimals\n4.3 Perform basic\n calculations involving\n percentages\n4.4 Perform basic\n calculations involving\n ration and proportion\n4.5 Perform calculations on\n algebraic expressions\n\n5.1 Select and use\n measuring tools\n5.2 Clean and store\n Measuring tools\n\n6.1 Organize work area\n6.2 Clean work area\n\n7.1 Perform inspection of\n machine\n7.2 Perform cleaning and\n lubricating of machine\n7.3 Perform minor machine\n repair and adjustments\n7.4 Maintain hand tools\n\n• Lecture\n• Demonstration\n• Practical\n exercise\n• Lecture\n• Demonstration\n• Practical\n exercise\n• Lecture\n• Group\n discussion\n• Simulation\n• Practical\n exercise\n• Lecture\n• Demonstration\n• Group\n discussion\n• Practical\n exercise\n• Demonstration\n• Observation\n• Performance\n test\n• Interview /\n Questioning\n• Demonstration\n• Observation\n• Performance\n test\n• Interview /\n Questioning\n• Demonstration\n• Observation\n• Performance\n test\n• Interview /\n Questioning\n• Demonstration\n• Observation\n• Performance\n test\n• Interview /\n Questioning\n\n--- PDF PAGE 59 ---\nmach110504ts\n01/04/05\n58\nCORE COMPETENCIES\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n\n1. Perform Bench\nwork\n\n1.1 Layout and mark\n dimensions / features on\n workpiece\n• Observed general shop\n safety practices\n• Read linear measuring tools\n• Identify layout tools\n• Care and use of measuring\n and layout tools\n\n1.2 Cut, chip and file flat,\n rectangular or round\n blocks\n• Identify kinds and uses of\n hacksaw blades\n• Observed safety practices in\n cutting with hacksaw\n• Identify kinds and uses of\n chisels\n• Observed safety practices in\n chipping\n• Identify kinds and uses of\n files\n• Observed safety practices in\n filing\n\n• Demonstration\n\n• Discussion\n\n• Direct\nObservation\n\n• Written or oral\n\n• Demonstration\n\n--- PDF PAGE 60 ---\nmach110504ts\n01/04/05\n59\n\n2. Turn Work piece\n\n1.3 Drill, ream and lap holes\n• Orient parts and function\n of drill press\n• Observed safety in drilling\n• Identify parts of drill bits\n• Identify kinds and care of\n reamers\n• Observed safety in reaming\n• Identify kinds of lapping tools\n• Safety in lapping\n\n1.4 Cut threads using tap and\n stock and die\n• Identify standard taps\n and die\n• Observed safety practices in\n using taps and die\n\n1.5 Off-hand grind cutting\n tools\n• Identify parts and function\n of off-hand grinder\n• Observed safety in\n sharpening\n• Sharpen lathe cutting\n tools, scribers, chisels and\n drill bits\n\n 2.1 Determine job\n requirements:\n• Observed safety on\n lathe work\n• Orient lathe machine\n parts and function\n• Identify lathe accessories,\n fixture and attachments\n• Mount and remove lathe\n chuck and accessories\n• Identify the uses of lathe\n cutting tools\n\n 2.2 Setup Workpiece\n ( per operation )\n\n 2.3 Perform turning\n Operations:\n• Face\n -Face both ends of work\n to length using 4-jaw chuck\n\n• Straight turn\n - Straight turn whole\n length of workpiece\n using 4 jaw chuck\n\n• Demonstration\n\n• Discussion\n\n• Written /Oral\n\n• Direct\nObservation\n\n• Demonstration\n\n--- PDF PAGE 61 ---\nmach110504ts\n01/04/05\n60\n\n3. Mill Workpiece\n\n• Cut recess and\n grooves\n• Drill, bore,\n countersink and ream\n - Drill through holes\n - Bore through holes\n - Countersink holes\n - ream holes ( straight )\n• Knurl\n• Cut single-start external\n vee and acme thread\n• Part – off\n• Cut threads using taps\n and stock and die\n• Cut external taper\n using compound slide or\n formed tool\n\n 2.4 Check / Measure\n work piece\n• Procedure and\n techniques in measuring\n work piece\n\n3.1 Determine job\n requirements\n• Observed milling\n machine safety\n precaution\n• Orient milling machine\n parts and function\n• Identify milling cutting\n tools\n• Mount and remove\n milling arbors, collets,\n adaptor, cutters, plain\n vice, circular vice and\n other accessories\n\n3.2 Setup Workpiece\n ( per operation )\n\n 3.3 Perform milling\n operations:\n• Drill\n• Bore\n• Spot face\n• Mill slot and keyways\n• Mill serrations\n• Mill vees\n• Part – off\n• Mill circular slots\n\n• Demonstration\n\n• Discussion\n\n• Direct\nObservation\n\n• Written / Oral\n\n• Demonstration\n\n--- PDF PAGE 62 ---\nmach110504ts\n01/04/05\n61\n\n4. Grind Workpiece\n\n 3. 4 Check / Measure\n workpiece\n• Perform procedure and\n techniques in measuring\n work piece\n\n 4.1 Determine job\n requirements:\n• Observed grinding\n machine safety\n precaution\n• Identify grinding machine\n types and specifications\n - Horizontal spindle\n surface grinder\n - Vertical spindle surface\n grinder\n• Orient grinding machine\n parts and functions\n• Identify grinding machine\n work holding devices\n• Identify the use of\n grinding machine\n accessories, fixture and\n attachments\n• Mount and remove\n grinding wheels\n\n4.2 Select wheels and\n accessories\n\n 4.3.Perform grinding\n operations:\n• Grind parallel surfaces\n• Grind square surfaces\n• Grind angles\n• Grind to a square\n shoulder\n• Grind radii\n• Grind to cut-off parts\n\n4.4 Check / Measure\n workpiece\nPerform the procedure\nand techniques in measuring\nwork piece\n\n• Demonstration\n\n• Discussion\n\n• Direct\nobservation\n\n• Written / Oral\nexamination\n\n• Demonstration\n\n--- PDF PAGE 63 ---\nmach110504ts\n01/04/05\n62"
