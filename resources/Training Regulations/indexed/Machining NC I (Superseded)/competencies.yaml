  "source_section_text": "Section 1.\nSuccessful candidates shall be awarded a National Certificate signed by the\nTESDA Director General.\n\n4.2\nIndividuals aspiring to be awarded the qualification of Machining NC I must\nacquire Certificates of Competency in all the core units of the Qualification.\nCandidates may apply for assessment in any accredited assessment center:\n\n4.2.1\nPerform bench work (Basic)\n4.2.2\nTurn workpiece (Basic)\n4.2.3\nMill workpiece (Basic)\n4.2.4\nGrind workpiece (Basic)\n\nSuccessful candidates shall be awarded Certificates of Competency (COC).\n\n4.3 Accumulation and submission of all COCs acquired for the relevant units of\ncompetency comprising a qualification, an individual shall be issued the\ncorresponding National Certificate.\n\n4.4\nAssessment shall focus on the core units of competency. The basic and common\nunits shall be integrated or assessed concurrently with the core units.\n\n4.5 The following are qualified to apply for assessment and certification:\n\n4.5.1 Graduates of formal, non-formal and informal including enterprise-based\ntraining programs.\n\n4.5.2 Experienced workers (wage employed or self employed)\n\n4.6 The guidelines on assessment and certification are discussed in detail in the\n\"Procedures Manual on Assessment and Certification\" and \"Guidelines on the\nImplementation of the Philippine TVET Qualification and Certification System\n(PTOQS)\".\n\n--- PDF PAGE 71 ---\nmach110504ts\n01/04/05\n70\nTurn workpiece\n(Basic)\nPerform bench work\n(Basic)\n\nPerform bench work\nComplex)\n\nTurn workpiece\n(Intermediate)\nCORE\nCOMPETENCIES\nMill workpiece\n(Basic)\n\nMill workpiece\n(Intermediate)\nMill workpiece\n (Advanced)\nGrind workpiece\n(Basic)\n\nGrind workpiece\n(Complex)\nSupermarket of Competencies\nMetals and Engineering Sector\nMACHINING\nTurn workpiece\n(Advanced)\nReceive and respond\nto workplace\ncommunication\n\nLead in workplace\n communication\nWork with others\nLead small teams\nSolve problems\nrelated to\nworkplace activities\n\nParticipate in\nworkplace\ncommunication\n\n Utilize specialist\ncommunication skills\nWork in team\nenvironment\nDevelop team and\nindividual\n\nApply problem-solving\ntechniques in the\nworkplace\n\nDemonstrate\n work values\nBASIC\nCOMPETENCIES\nCOMMON\nCOMPETENCIES\n Apply safety\n practices\n Perform routine\n housekeeping\n Measure workpiece\n (Basic)\n Interpret working\ndrawings and\nsketches\n Select and cut\nworkshop materials\n Perform shop\ncomputations (Basic)\n Perform preventive\nand corrective\nmaintenance\n Perform shop\ncomputations\n(Advanced)\n Perform shop\ncomputations\n (Intermediate)\n Measure workpiece\nusing gages and\ncomparators\n Measure workpiece\nusing angular\nmeasuring\ninstruments\nLegend\n\nMachining NC I\n\nPractice occupational\n health and\nsafety procedures\nDevelop and practice\n negotiation skills\nUse relevant\ntechnologies\nCollect, analyze\nand organize\ninformation\n\nPlan and\norganize work\nPractice career\nprofessionalism\n\nUse mathematical\nconcepts and\n techniques\nPromote\nenvironmental\n protection\n\nPractice\n housekeeping\n procedures\n\n--- PDF PAGE 72 ---\nmach110504ts\n01/04/05\n71\n\nDefinition of Terms\n\nbench work\nthe operations incident to the process of laying out, fitting,\nassembling, etc… when the work is placed on the bench or in\na bench vise\n\nboring\nis the operation of enlarging a hole by means of an adjustable\ncutting tool with only one cutting edge\n\nchipping\nis the operation of removing/cutting metal using hammer and\nchisel\n\ncounter boring\nis the operation of enlarging the end of a hole cylindrically\n\ndrilling\nis the operation of producing a circular hole by removing solid\nmetal\n\nfacing\nthe lathe operation of finishing the ends of the work, to make\nthe piece the right length. Also known as squaring\n\ngrinding\nrefers to the removal of material from a workpiece with\ngrinding wheel\n\nlaying out\nterm used to include the marking or scribling of center points,\ncircles, arcs, or straight lines upon metal surfaces, either\ncurved or flat, for the guidance of the worker\n\nmilling\nrefers to removal of metal by feeding a workpiece through the\nperiphery of rotating circular cutter\n\nreaming\nis an operation of sizing and finishing a hole by means of a\ncutting tool having several cutting edges. reaming serves to\nmake the hole smoother, straighter, and more accurate\n\nspot-facing\nis the operation of smoothing and squaring the surface\naround a hole\n\ntapping\nis the operation of forming internal threads by means of a tool\ncalled tap\n\nturning\nrefers to shaping a workpiece by gripping it in a work holding\ndevice and rotating it under power against a suitable cutting\ntool\n\n--- PDF PAGE 73 ---\nmach110504ts\n01/04/05\n72\n ACKNOWLEDGEMENTS\n\nThe Technical Education and Skills Development Authority (TESDA) wishes to extend\nthanks and appreciation to the many representatives of business, industry, academe and\ngovernment agencies who donated their time and expertise to the development and\nvalidation of this Training Regulation.\n\nTESDA ADVISORY PANEL (TAP) – METALS AND ENGINEERING SECTOR\nMR. BENJAMIN MA. AYCARDO†\nTAP Chairman\nUnimagma Philippines, Inc.\nLaguna\nMR. RAUL M. CONSUNJI\nMember - Industry\nRMC Consultancy Services, Inc.\nBlue Ridge, Cubao, Quezon City\n\nMR. CARLOS MEDINA, JR.\nMember - Academe\nDon Bosco Technical College\nMandaluyong City\n\nMR. EDUARDO R. LACBAY\nMember -Academe\nMIRDC, Bicutan, Taguig City\nMR. JIMMY LIBO-ON RUZGAL\nMember – Labor, FFW\nMFI, Ortigas Ave., Pasig City\n\nTESDA EXPERT PANEL (TEP) – MACHINING\nMR. EDUARDO CHUA KO KIONG\nSankei Philippines, Inc.\n\nMR. TIMOTEO INTALAN\nDirectric Industries, Inc.\nMR. REY FERNANDEZ\nMeralco Foundation, Inc.\n\nMR. CLETO JIMENEZ\nReynolds Philippines Corp.\nMR. JERRY R. OMALLAO\nReynolds Philippines Corp\n\nMR. ELSO CLARETE\nDon BOSCO Technical College\n\nMR. AGUSTIN M. PAYAD\nTechnological University of the Philippines\n\nThe PARTICIPANTS in the National Validation of this Training Regulations\n•\n Region I\n•\n Region VI\n•\n CAR\n•\n CARAGA\n\nMembers of the TESDA Board\n\nThe TESDA Executive Committee\n\nThe MANAGEMENT and STAFF of the TESDA Secretariat\n•\nSSCO\n•\nOFTVET\n•\nNITVET\n•\nONFTVET"
