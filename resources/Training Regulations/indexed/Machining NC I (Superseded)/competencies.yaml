  "source_section_text": "SECTION 2 COMPETENCY STANDARDS\n\n This section gives the details of the contents of the basic, common and core\nunits of competency required in MACHINING NC I.\n\nBASIC COMPETENCIES\n\nUNIT OF COMPETENCY: RECEIVE AND RESPOND TO WORKPLACE\nCOMMUNICATION\nUNIT CODE : 500311101\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes\nrequired to receive, respond and act on verbal and written\ncommunication.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Follow routine spoken\nmessages\n1.1.\nRequired information is gathered by listening\nattentively and correctly interpreting or\nunderstanding information/instructions\n1.2.\nInstructions/information are properly recorded\n1.3.\nInstructions are acted upon immediately in\naccordance with information received\n1.4.\nClarification is sought from workplace supervisor\non all occasions when any instruction/information\nis not clear\n2. Perform workplace\nduties following written\nnotices\n2.1 Written notices and instructions are read and\ninterpreted correctly in accordance with\norganizational guidelines\n2.2 Routine written instruction are followed in\nsequence\n2.3 Feedback is given to workplace supervisor based\non the instructions/information received\n\n--- PDF PAGE 5 ---\nmach110504ts\n01/04/05\n4\n\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Written notices and\ninstructions\nIt refers to :\n1.1. Handwritten and printed material\n1.2. Internal memos\n1.3. External communications\n1.4. Electronic mail\n1.5. Briefing notes\n1.6. General correspondence\n1.7. Marketing materials\n1.8. Journal articles\n2. Organizational Guidelines\nIt may include:\n2.1. Information documentation procedures\n2.2. Company policies and procedures\n2.3. Organization manuals\n2.4. Service manual\n\n--- PDF PAGE 6 ---\nmach110504ts\n01/04/05\n5\nEVIDENCE GUIDE\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1. Demonstrated knowledge of organizational procedures for\nhandling verbal and written communications\n1.2. Received and acted on verbal messages and instructions\n1.3. Demonstrated competency in recording\ninstructions/information\n\n2. Underpinning\nKnowledge and\nAttitudes\n2.1. Knowledge of organizational policies/guidelines in regard\nto processing internal/external information\n2.2. Ethical work practices in handling communications\n2.3. Communication process\n3. Underpinning\nSkills\n3.1. Conciseness in receiving and clarifying messages/\ninformation/communication\n3.2. Accuracy in recording messages/information\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1. Pens\n4.2. Note pads\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1. Direct Observation\n5.2. Oral interview\n5.3. Written Evaluation\n5.4. Third Party Report\n\n6. Context of\nAssessment\nCompetency may be assessed individually in the actual\nworkplace or simulation environment in TESDA accredited\ninstitutions\n\n--- PDF PAGE 7 ---\nmach110504ts\n01/04/05\n6\n\nUNIT OF COMPETENCY : WORK WITH OTHERS\n\nUNIT CODE\n:\n500311102\n\nUNIT DESCRIPTOR\n:\nThis unit cover the skills, knowledge and attitudes\nrequired to develop workplace relationship and contribute\nin workplace activities.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Develop effective\nworkplace relationship\n1.1 Duties and responsibilities are done in a positive\nmanner to promote cooperation and good relationship\n1.2 Assistance is sought from workgroup when\ndifficulties arise and addressed through discussions\n1.3 Feedback provided by others in the team is\nencouraged, acknowledged and acted upon\n1.4 Differences in personal values and beliefs are\nrespected and acknowledged in the development\n2. Contribute to work\ngroup activities\n2.1 Support is provided to team members to ensure\nworkgroup goals are met\n2.2 Constructive contributions to workgroup goals and\ntasks are made according to organizational\nrequirements\n2.3 Information relevant to work is shared with team\nmembers to ensure designated goals are met\n\n--- PDF PAGE 8 ---\nmach110504ts\n01/04/05\n7\n\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Duties and\nresponsibilities\n1.1 Job description and employment arrangements\n1.2 Organization’s policy relevant to work role\n1.3 Organizational structures\n1.4 Supervision and accountability requirements including OHS\n1.5 Code of conduct\n2. Work group\n2.1 Supervisor or manager\n2.2 Peers/work colleagues\n2.3 Other members of the organization\n3. Feedback on\nperformance\n3.1 Formal/Informal performance appraisal\n3.2 Obtaining feedback from supervisors and colleagues and\nclients\n3.3 Personal, reflective behavior strategies\n3.4 Routine organizational methods for monitoring service\ndelivery\n4. Providing\nsupport to team\nmembers\n4.1 Explaining/clarifying\n4.2 Helping colleagues\n4.3 Providing encouragement\n4.4 Providing feedback to another team member\n4.5 Undertaking extra tasks if necessary\n5. Organizational\nrequirements\n\n5.1 Goals, objectives, plans, system and processes\n5.2 Legal and organization policy/guidelines\n5.3 OHS policies, procedures and programs\n5.4 Ethical standards\n5.5 Defined resources parameters\n5.6 Quality and continuous improvement processes and\nstandards\n\n--- PDF PAGE 9 ---\nmach110504ts\n01/04/05\n8\n EVIDENCE GUIDE\n1. Critical aspects of\nCompetency\n\nAssessment requires evidence that the candidate:\n1.1.\nProvided support to team members to ensure goals\nare met\n1.2.\nActed on feedback from clients and colleagues\n1.3.\nAccessed learning opportunities to extend own\npersonal work competencies to enhance team goals\nand outcomes\n2. Underpinning\nKnowledge\n2.1.\nThe relevant legislation that affects operations,\nespecially with regards to safety\n2.2.\nReasons why cooperation and good relationships are\nimportant\n2.3.\nKnowledge of the organization’s policies, plans and\nprocedures\n2.4.\nUnderstanding how to elicit and interpret feedback\n2.5.\nKnowledge of workgroup member’s responsibilities\nand duties\n2.6.\nImportance of demonstrating respect and empathy in\ndealings with colleagues\n2.7.\nUnderstanding of how to identify and prioritize\npersonal development opportunities and options\n3. Underpinning Skills\n3.1.\nAbility to read and understand the organization’s\npolicies and work procedures\n3.2.\nWrite simple instructions for particular routine tasks\n3.3.\nInterpret information gained from correspondence\n3.4.\nCommunication skills to request advice, receive\nfeedback and work with a team\n3.5.\nPlanning skills to organized work priorities and\narrangement\n3.6.\nTechnology skills including the ability to select and\nuse technology appropriate to a task\n3.7.\nAbility to relate to people from a range of social,\ncultural and ethnic backgrounds.\n\n--- PDF PAGE 10 ---\nmach110504ts\n01/04/05\n9\n\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1.\nAccess to relevant workplace or appropriately\nsimulated environment where assessment can take\nplace\n4.2.\nMaterials relevant to the proposed activity or task\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1.\nDirect observations of work activities of the\nindividual member in relation to the work activities of\nthe group\n5.2.\nObservation of simulation and/or role play involving\nthe participation of individual member to the\nattainment of organizational goal\n5.3.\nCase studies and scenarios as a basis for\ndiscussion of issues and strategies\n6. Context for\nAssessment\n6.1.\nCompetency assessment may occur in workplace or\nany appropriately simulated environment\n6.2.\nAssessment shall be observed while task are being\nundertaken whether individually or in group\n\n--- PDF PAGE 11 ---\nmach110504ts\n01/04/05\n10\n\nUNIT OF COMPETENCY: DEMONSTRATE WORK VALUES\n\nUNIT CODE\n 500311103\n\nUNIT DESCRIPTOR :\nThis unit covers the knowledge, skills, and attitude in\ndemonstrating proper work values.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Define the purpose\nof work\n\n1.1 One’s unique sense of purpose for working and the\nwhy’s of work are identified, reflected on and clearly\ndefined for one’s development as a person and as a\nmember of society.\n1.2 Personal mission is in harmony with company’s values\n\n2. Apply work\nvalues/ethics\n2.1 Work values/ethics/concepts are classified and\nreaffirmed in accordance with the transparent company\nethical standards, policies and guidelines.\n2.2 Work practices are undertaken in compliance with\nindustry work ethical standards, organizational policy\nand guidelines\n2.3 Personal behavior and relationships with co-workers\nand/or clients are conducted in accordance with ethical\nstandards, policy and guidelines.\n2.4 Company resources are used in accordance with\n transparent company ethical standard, policies and\n guidelines.\n\n3. Deal with ethical\n problems\n3.1 Company ethical standards, organizational policy and\nguidelines on the prevention and reporting of unethical\nconduct are accessed and applied in accordance with\ntransparent company ethical standard, policies and\nguidelines.\n3.2 Work incidents/situations are reported and/or\nresolved in accordance with company\nprotocol/guidelines.\n3.3 Resolution and/or referral of ethical problems identified\nare used as learning opportunities.\n\n4. Maintain integrity of\nconduct in the\nworkplace\n4.1 Personal work practices and values are demonstrated\nconsistently with acceptable ethical conduct and\ncompany’s core values.\n4.2 Instructions to co-workers are provided based on\n ethical, lawful and reasonable directives.\n4.3 Company values/practices are shared with co-workers\n using appropriate behavior and language.\n\n--- PDF PAGE 12 ---\nmach110504ts\n01/04/05\n11\n\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Work values/ethics/ concepts\nMay include but are not limited to:\n1.1 Commitment/ Dedication\n1.2 Sense of urgency\n1.3 Sense of purpose\n1.4 Love for work\n1.5 High motivation\n1.6 Orderliness\n1.7 Reliability\n1.8 Competence\n1.9 Dependability\n1.10 Goal-oriented\n1.11 Sense of responsibility\n1.12 Being knowledgeable\n1.13 Loyalty to work/company\n1.14 Sensitivity to others\n1.15 Compassion/Caring attitude\n1.16 Balancing between family and work\n1.17 Pakikisama\n1.18 Bayanihan spirit/teamwork\n1.19 Sense of nationalism\n2. Work practices\n2.1 Quality of work\n2.2 Punctuality\n2.3 Efficiency\n2.4 Effectiveness\n2.5 Productivity\n2.6 Resourcefulness\n2.7 Innovativeness/Creativity\n2.8 Cost conciousness\n2.9 5S\n2.10 Attention to details\n3. Incidents/situations\n3.1 Violent/intensed dispute or argument\n3.2 Gambling\n3.3 Use of prohibited substances\n3.4 Pilferages\n3.5 Damage to person or property\n3.6 Vandalism\n3.7 Falsification\n3.8 Bribery\n3.9 Sexual Harassment\n3.10 Blackmail\n\n--- PDF PAGE 13 ---\nmach110504ts\n01/04/05\n12\nVARIABLE\nRANGE\n\n4. Company resources\n\n4.1 Consumable materials\n4.2 Equipment/Machineries\n4.3 Human\n4.4 Time\n4.5 Financial resources\n\n5. Instructions\n\n5.1 Verbal\n5.2 Written\n\n--- PDF PAGE 14 ---\nmach110504ts\n01/04/05\n13\n EVIDENCE GUIDE\n1. Critical Aspects\n of Competency\nAssessment requires evidence that the candidate:\n1.1 Defined one’s unique sense of purpose for working\n1.2 Clarified and affirmed work values/ethics/concepts\n consistently in the workplace\n1.2 Demonstrated work practices satisfactorily and consistently\nin compliance with industry work ethical standards,\n organizational policy and guidelines\n1.4 Demonstrated personal behavior and relationships with co-\nworkers and/or clients consistent with ethical standards,\npolicy and guidelines\n1.5 Used company resources in accordance with company\n ethical standard, policies and guidelines.\n1.6 Followed company ethical standards, organizational policy\nand guidelines on the prevention and reporting of unethical\nconduct/behavior\n\n2. Underpinning\nKnowledge\n2.1 Occupational health and safety\n2.2 Work values and ethics\n2.3 Company performance and ethical standards\n2.4 Company policies and guidelines\n2.5 Fundamental rights at work including gender sensitivity\n2.6 Work responsibilities/job functions\n2.7 Corporate social responsibilities\n2.8 Company code of conduct/values\n2.9 Balancing work and family responsibilities\n\n3. Underpinning\nSkills\n3.1 Interpersonal skills\n3.2 Communication skills\n3.3 Self awareness, understanding and acceptance\n3.4 Application of good manners and right conduct\n\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1 Workplace or assessment location\n4.2 Case studies/Scenarios\n\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1 Portfolio Assessment\n5.2 Interview\n5.3 Third Party Reports\n\n6. Context of\nAssessment\nCompetency may be assessed in the work place or in a\n simulated work place setting\n\n--- PDF PAGE 15 ---\nmach110504ts\n01/04/05\n14\nUNIT OF COMPETENCY: PRACTICE HOUSEKEEPING PROCEDURES\n\nUNIT CODE : 500311104\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes required\nto apply the basic housekeeping procedures.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Sort and remove\n unnecessary items\n1.1 Reusable, recyclable materials are sorted in\naccordance with company/office procedures\n1.2 Unnecessary items are removed and disposed of\nin accordance with company or office procedures\n\n2. Arrange items\n2.1 Items are arranged in accordance with\ncompany/office housekeeping procedures\n2.2 Work area is arranged according to job\nrequirements\n2.3 Activities are prioritized based on instructions.\n2.4 Items are provided with clear and visible\nidentification marks based on procedure\n2.5 Safety equipment and evacuation passages are\nkept clear and accessible based on instructions\n3. Maintain work area, tools\nand equipment\n3.1 Cleanliness and orderliness of work area is\nmaintained in accordance with company/office\nprocedures\n3.2 Tools and equipment are cleaned in accordance\nwith manufacturer’s instructions/manual\n3.3 Minor repairs are performed on tools and\nequipment in accordance with manufacturer’s\ninstruction/manual\n3.4 Defective tools and equipment are reported to\nimmediate supervisor\n4. Follow standardized work\nprocess and procedures\n4.1 Materials for common use are maintained in\ndesignated area based on procedures\n4.2 Work is performed according to standard work\nprocedures\n4.3 Abnormal incidents are reported to immediate\nsupervisor\n5. Perform work\nspontaneously\n5.1 Work is performed as per instruction\n5.2 Company and office decorum are followed and\ncomplied with\n5.3 Work is performed in accordance with\noccupational health and safety (OHS)\nrequirements\n\n--- PDF PAGE 16 ---\nmach110504ts\n01/04/05\n15\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Unnecessary items\nMay include but are not limited to:\n1.1 Non-recyclable materials\n1.2 Unserviceable tools and equipment\n1.3 Pictures, posters and other materials not\n related to work activity\n1.4 Waste materials\n\n2. Identification marks\n2.1 Labels\n2.2 Tags\n2.3 Color coding\n\n3. Decorum\n3.1 Company/ office rules and regulations\n3.2 Company/ office uniform\n3.3 Behavior\n\n4. Minor repair\nMinor repair include but not limited to:\n4.1 Replacement of parts\n4.2 Application of lubricants\n4.3 Sharpening of tools\n4.4 Tightening of nuts, bolts and screws\n\n--- PDF PAGE 17 ---\nmach110504ts\n01/04/05\n16\nEVIDENCE GUIDE\n1. Critical Aspects\nof Competency\n\nAssessment requires evidence that the candidate practiced\nthe basic procedures of 5S\n\n2. Underpinning\nKnowledge and\nAttitudes\n2.1 Principles of 5S\n2.2 Work process and procedures\n2.3 Safety signs and symbols\n2.4 General OH&S principles and legislation\n2.5 Environmental requirements relative to work safety\n2.6 Accident/Hazard reporting procedures\n\n3. Underpinning\nSkills\n3.1 Basic communication skills\n3.2 Interpersonal skills\n3.3 Reading skills required to interpret instructions\n3.4 Reporting/recording accidents and potential hazards\n\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1 Facilities, materials tools and equipment necessary for\nthe activity\n\n5. Methods of\nAssessment\nCompetency may be assessed through:\n\n5.1 Third party report\n5.2 Interview\n5.3 Demonstration with questioning\n\n6. Context for\nAssessment\nCompetency may be assessed in the work place or in a\nsimulated work place setting\n\n--- PDF PAGE 18 ---\nmach110504ts\n01/04/05\n17\n\nCOMMON COMPETENCIES\n\nUNIT OF COMPETENCY: APPLY SAFETY PRACTICES\n\nUNIT CODE: MEE722201\n\nUNIT DESCRIPTOR: This unit covers the competencies required to apply safety\npractices in the workplace.\n\n ELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1.\nIdentify hazards\n1.1\n\n1.2\nHazards are identified correctly in accordance\nwith OHS principles.\nSafety signs and symbols are identified and\nadhered to.\n\n2.\nUse protective clothing\nand devices\n2.1\n\nAppropriate protective clothing and devices\ncorrectly selected and used in accordance with\nOHS requirements or industry/company policy\n\n3.\nPerform safe handling of\ntools, equipment and\nmaterials\n3.1\n\n3.2\nSafety procedures for pre-use check and\noperation of tools and equipment followed in\naccordance with industry/ company policies.\nTools, equipment and materials handled safely in\naccordance with OHS requirements and industry/\ncompany policies.\n\n4.\nPerform first aid\n4.1\nFirst aid treatment of injuries are carried out\naccording to recommended procedures\n\n5.\nUse fire extinguisher\n5.1\nFire extinguisher selected and operated correctly\naccording to the type of fire.\n\n--- PDF PAGE 19 ---\nmach110504ts\n01/04/05\n18\n\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Hazards\n1.1 Cluttered tools and materials\n1.2 Slippery floors (caused by oil, grease or any liquid)\n1.3 Exposed electrical wires\n1.4 Sharp edges\n1.5 Machine without guards or with exposed moving\nparts\n1.6 Uncollected chips or other wastes\netc.\n\n2. Protective clothing\n and devices\nProtective clothing and devices may include but is not\nlimited to:\n2.1 safety glasses/goggles\n2.2 safety shoes\n2.3 overalls\n2.4 cap\n\n3. Injuries\nInjuries may include:\n3.1 burns/scalds\n3.2 fractures\n3.3 cuts and abrasions\n3.4 poisoning\n3.5 foreign bodies in the eye\n3.6 concussion\n3.7 shock\n\n4. Type of fires\nFires involving or caused by:\n4.1 common combustibles (wood, cloth, paper, rubber\nand plastic)\n4.2 flammable liquids (gasoline, oil, solvents, paints,\netc.)\n4.3 energized electrical equipment (wiring, fuse boxes,\ncircuit breakers, appliances, etc.\n4.4 combustible metals (magnesium, sodium, etc.)\n\n--- PDF PAGE 20 ---\nmach110504ts\n01/04/05\n19\nEVIDENCE GUIDE\n1.\nCritical aspects\nof Competency\nAssessment requires evidence that the candidate:\n1.1 identified hazardous area\n1.2 used protective clothing and devices\n1.3 handled tools, equipment and materials properly\n1.4 performed first aid\n1.5 used fire extinguisher\n\n2.\nUnderpinning\nknowledge and\nattitude\n2.1 Shop safety signs, symbols and alarms\n2.2 Safety precautionary measures\n2.3 Housekeeping\n2.4 Machine tools\n2.5 First aid\n2.6 Engineering materials\n2.7 Fire extinguishers\n\n3.\nUnderpinning\nskills\n3.1 Operating machine tools\n3.2 Handling tools and materials\n3.3 Communicating with superiors and co-workers\n3.4 Interpreting instructions\n\n4.\nResource\nimplications\nThe following resources MUST be provided\n4.1 Tools, equipment and facilities appropriate to processes\nor activity\n4.2 Materials relevant to the proposed activity\n\n5.\nMethod of\nassessment\nCompetency may be assessed through:\n5.1 Demonstration\n5.2 Written or oral short answer questions\n5.3 Practical exercises\n\n6.\nContext for\nassessment\nCompetency may be assessed in the workplace or in\nsimulated workplace environment.\n\n--- PDF PAGE 21 ---\nmach110504ts\n01/04/05\n20\n\nUNIT OF COMPETENCY: INTERPRET WORKING DRAWINGS AND SKETCHES\n\nUNIT CODE: MEE722202\n\nUNIT DESCRIPTOR: This unit covers the competencies required to read and\ninterpret drawings and sketches.\n\n ELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1.\nInterpret technical\ndrawing\n1.1\n\n1.2\n1.3\n1.4\n1.5\n1.6\nComponents, assemblies or objects recognized as\nrequired.\nDimensions identified as appropriate.\nInstructions identified and followed as required.\nMaterial requirements identified as required.\nSymbols recognized as appropriate in the drawing.\nTolerance, limits and fits identified in the drawing.\n\n2.\nPrepare freehand\nsketch of parts\n2.1\n2.2\n2.3\n2.4\n2.5\n\nSketch drawn correctly and appropriately.\nSketch depicted objects or part appropriately.\nDimensions indicated in sketch are clear and correct.\nInstructions included in sketch are clear and correct.\nBase line or datum points indicated as required.\n\n3.\nInterpret details from\nfreehand sketch\n3.1\n\n3.2\n3.3\n3.4\n3.5\nComponents, assemblies or objects recognized as\nrequired.\nDimensions identified as appropriate.\nInstructions identified and followed as required.\nMaterial requirements identified as required.\nSymbols recognized as appropriate in the drawing.\n\n--- PDF PAGE 22 ---\nmach110504ts\n01/04/05\n21\n\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Drawing\n1.1 Drawing technique include\n1.1.1\nPerspective\n1.1.2\nExploded view\n1.1.3\nHidden view technique\n\n1.2 Projections\n1.2.1\nFirst angle projections\n1.2.2\nThird angle projections\n\n2. Tolerance\n2.1 General tolerance\n2.2 Angular tolerance\n2.3 Geometric tolerance\n\n--- PDF PAGE 23 ---\nmach110504ts\n01/04/05\n22\nEVIDENCE GUIDE\n1.\nCritical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Interpreted technical drawing\n1.2 Prepared sketches\n1.3 Interpreted sketches.\n\n2.\nUnderpinning\nknowledge\n2.1 Alphabet of lines\n2.2 Projections\n2.3 Drawing symbols\n2.4 Dimensioning techniques\n2.5 Tolerance, limits and fits\n2.6 Engineering materials\n2.7 Drawing tools and supplies\n\n3.\nUnderpinning\nskills\n3.1 Handling tools and drawing instruments\n3.2 Using measuring instruments\n\n4.\nResource\nimplications\nThe following resources MUST be provided\n4.1 Drafting room/facilities and drafting instruments and\n supplies appropriate to the activity\n4.2 Measuring tools\n4.3 Drawings, sketches or blueprint\n4.4 Specimen parts/components\n\n5.\nMethod of\nassessment\nCompetency may be assessed through:\n5.1 direct observation\n5.2 written or oral short answer questions\n5.3 demonstration\n5.4 project/work sample\n5.5 portfolio\n\n6.\nContext for\nassessment\nCompetency may be assessed in the workplace or in\nsimulated workplace environment.\n\n--- PDF PAGE 24 ---\nmach110504ts\n01/04/05\n23\nUNIT OF COMPETENCY: SELECT/ CUT WORKSHOP MATERIALS\n\nUNIT CODE: MEE722203\n\nUNIT DESCRIPTOR: This unit covers the skills and knowledge required to select\n and cut workshop materials.\n\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Determine job requirement\n1.1 Plans/ drawings are interpreted to produce\ncomponent to specification\n1.2 Sequence of operation is determined to produce\ncomponent to specification\n\n2. Select and measure\nmaterials\n2.1 Materials are selected according to the\nrequirement of the operation\n2.2 Materials are measured to required level of\n accuracy using measuring tools\n2.3 Measuring tools are used according to\n manufacturers specification\n\n3. Cut materials\n3.1 Materials are cut according to plans/drawing\ninstruction\n3.2 Cutting tools/equipment are used based on\nmanufacturers specification, appropriate\ntechniques or the safety procedure\n\n--- PDF PAGE 25 ---\nmach110504ts\n01/04/05\n24\n\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Plan/drawings\n1.1 Dimensions\n1.2 Tolerance\n\n2. Materials\n2.1 Ferrous\n2.2 Non-ferrous\n\n3. Measuring tools\n3.1 Steel rule\n3.2 Pull-push rule\n\n4. Cutting tools/equipment\n4.1 Hacksaw\n4.2 Power hacksaw\n\n5. Safety procedure\nSafety involves the handling of\n\n5.1 Equipment\n5.2 Tools\n5.3 Materials\n\n--- PDF PAGE 26 ---\nmach110504ts\n01/04/05\n25\n\nEVIDENCE GUIDE\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Interpreted plans/drawings\n1.2 Selected natural according to the requirement\n1.3 Performed cutting operation\n1.4 Cutting tools/equipment used safely\n\n2. Underpinning knowledge\nand attitude\n2.1 Shop safety practices\n 2.1.1 Safe working habits\n 2.1.2 Safe handling of tools, equipment and materials\n\n2.2 Blueprint reading\n 2.2.1 Standard drawing scales, symbols and\nabbreviations\n2.2.2 Assembly and details of drawing\n2.2.3 Dimensions\n\n2.3 Measurement\n 2.3.1 Linear measuring tools\n\n2.4 Materials and related science\n 2.4.1 Classification and mechanical properties of\n engineering materials\n\n3. Underpinning skills\n3.1 Selecting materials\n3.2 Using measuring tools\n3.3 Operating power hacksaw\n\n4. Resource implications\nThe following resources MUST be provided\n4.1 Tools, equipment and facilities appropriate processes\nof an activity\n4.2 Materials relevant to the proposal activity\n4.3 Drawings/plans\n\n5. Method Assessment\n\nCompetency may be assessed through:\n5.1 Direct observation\n5.2 Oral short answer question\n5.3 Practical exercises\n\n6. Context for assessment\nCompetency may be assessed in the workplace or in\nsimulated work environment\n\n--- PDF PAGE 27 ---\nmach110504ts\n01/04/05\n26\n\nUNIT OF COMPETENCY: PERFORM SHOP COMPUTATIONS (BASIC)\n\nUNIT CODE: MEE722204\n\nUNIT DESCRIPTOR:\n This unit covers the competencies required to perform basic\n\n calculations using the four fundamental operation.\n\n ELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1.\nPerform four\nfundamental operations.\n1.1\n\n1.2\n\nSimple calculations performed using four\nfundamental operations.\nSimple calculations performed involving fractions\nand mixed numbers using four fundamental\noperations\n\n2.\nPerform basic\ncalculations involving\nfractions and decimals\n2.1\n\n2.2\n\nSimple calculations are performed involving\nfractions and decimals using the four fundamental\noperations.\nDecimal are converted into fraction (and vice\nversa) accurately,\n\n3.\nPerform basic\ncalculations involving\npercentages.\n3.1\nSimple calculations are performed to obtain\npercentages from information expressed in either\nfractional or decimal format\n\n4.\nPerform basic\ncalculation involving\nration and proportion\n4.1\nSimple calculations are performed involving ratios\nand proportion using whole numbers, fractions and\ndecimal fractions.\n5.\nPerform calculations on\nalgebraic expressions\n5.1\n\n5.2\nSimple calculations are performed on algebraic\nexpressions using the four fundamental\noperations.\nSimple transposition of formulae is carried out to\nisolate the variable required, involving the four\nfundamental operations.\n\n--- PDF PAGE 28 ---\nmach110504ts\n01/04/05\n27\n\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Four fundamental\n operations\n1.1 Addition\n1.2 Subtraction\n1.3 Multiplication\n1.4 Division\n\n2. Algebraic expressions\nCalculation using formula for determining\n\n2.1 tap drill size\n2.2 feed\n2.3 speed\n\n--- PDF PAGE 29 ---\nmach110504ts\n01/04/05\n28\n\nEVIDENCE GUIDE\n1.\nCritical aspects\nof Competency\nAssessment requires evidence that the candidate performed\ncalculations:\n1.1 using four fundamental operations\n1.2 involving fractions and mixed numbers\n1.3 involving fractions and decimals\n1.4 involving percentages\n1.5 involving ratio and proportion\n1.6 on algebraic expressions\n1.7 of simple formulae\n\n2.\nUnderpinning\nknowledge and\nattitude\nEnglish and metric system of measurements\n3.\nUnderpinning\nskills\nPerforming calculations using pen and paper or on a calculator.\n\n4.\nResource\nimplications\nThe following resources MUST be provided:\n4.1 Tools, equipment and facilities appropriate to processes or\n activity\n4.2 Materials relevant to the proposed activity\n\n5.\nMethod of\nassessment\nCompetency may be assessed through:\n5.1 written or oral short answer questions\n5.2 practical exercises\n\n6.\nContext for\nassessment\nCompetency may be assessed in the workplace or in simulated\nworkplace environment.\n\n--- PDF PAGE 30 ---\nmach110504ts\n01/04/05\n29\n\nUNIT OF COMPETENCY: MEASURE WORKPIECE (BASIC)\n\nUNIT CODE: MEE722205\n\nUNIT DESCRIPTOR: This unit covers the competencies required to measure\nworkpieces using measuring instruments such as steel rules,\nvernier calipers , micrometers, etc….\n\n ELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1.\nSelect and use\nmeasuring tools\n1.1\n\n1.2\n\n1.3\nMeasuring tools are selected and used according\nto the level of accuracy required.\nMeasurements taken are accurate to the finest\ngraduation of the selected measuring instrument.\nMeasuring technique used is correct and\nappropriate to the device used.\n\n2.\nClean and store\nmeasuring tools\n2.1\n\nCare and storage of devices undertaken to\nmanufacturer’s specifications or standard operating\nprocedures.\n\n--- PDF PAGE 31 ---\nmach110504ts\n01/04/05\n30\n\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Measuring tools\nMeasuring tools include:\n1.1 Steel tape\n1.2 Steel rule\n1.3 Straight edge\n1.4 Combination square\n1.5 Steel square\n1.6 Divider or trammel\n1.7 Caliper\n1.8 Protractor\n1.9 Vernier caliper\n1.10 Micrometer\n\n2. Measurements\n2.1 length\n2.2 diameter\n2.3 depth\n2.4 flatness\n2.5 straightness\n2.6 squareness\n\n--- PDF PAGE 32 ---\nmach110504ts\n01/04/05\n31\n\nEVIDENCE GUIDE\n1.\nCritical aspects\nof Competency\nAssessment requires evidence that the candidate:\n1.1 Selected and used measuring instruments\n1.2 Cleaned and stored measuring instruments\n\n2.\nUnderpinning\nknowledge\n2.1 Types, purposes and accuracy of measuring instruments\n2.2 Capability of measuring instruments\n2.3 Part dimensions and tolerances\n2.4 Techniques for measuring dimensions\n2.5 Care and storage procedure of measuring tools\n\n3.\nUnderpinning\nskills\n3.1 Safe handling of measuring tools and materials\n\n4.\nResource\nimplications\nThe following resources MUST be provided\n4.1 Tools, equipment and facilities appropriate to the activity\n4.2 Specimen component or part to the proposed activity\n\n5.\nMethod of\nassessment\nCompetency may be assessed through:\n5.1 direct observation\n5.2 demonstration\n5.3 written or oral short answer questions\n5.4 portfolio\n\n6.\nContext for\nassessment\nCompetency may be assessed in the workplace or in simulated\nworkplace environment.\n\n--- PDF PAGE 33 ---\nmach110504ts\n01/04/05\n32\n\nUNIT OF COMPETENCY: PERFORM ROUTINE HOUSEKEEPING\n\nUNIT CODE: MEE722206\n\nUNIT DESCRIPTOR: This unit covers the competencies required to maintain an\norganized and clean work area.\n\n ELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1.\nOrganize work area\n1.1\n\n1.2\n\n1.3\nWork area maintained in a safe, uncluttered and\norganized manner according to workshop policy.\nAll tasks carried out safely, effectively and\nefficiently with minimum inconvenience according\nto workshop policy.\nWorkshop policies and procedures for tidying work\nareas and placing items in designated areas\napplied.\n\n2.\nClean work area\n2.1\n\n2.2\n\n2.3\n\n2.4\n\n2.5\n\n2.6\nShop policies and procedures applied for cleaning\nwork area.\nWastes promptly removed and disposed of\naccording to shop policies and environmental\nrequirements.\nSpills, wastes and other potential hazards reported\nto appropriate personnel and removed according to\nshop policies and environmental requirements.\nSignage promptly displayed in regard to unsafe\nareas.\nConsumable materials maintained and stored\ncorrectly after use.\nTools and equipment (including guards) cleaned\nand used in accordance with manufacturer’s\ninstructions.\n\n--- PDF PAGE 34 ---\nmach110504ts\n01/04/05\n33\n\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Workshop policy\nShop policy and procedure in regard to:\n1.1 Housekeeping practices\n1.2 Maintenance and storage of cleaning equipment\n1.3 Use and storage of cleaning chemicals\n\n2. Work area\nWork area may include\n2.1 Work benches\n2.2 Walkways and aisles\n2.3 Fixtures and other working surfaces\n\n3. Tools and\n Equipment\nEquipment and tools may include\n3.1 Drill Press\n3.2 Pedestal Grinder\n3.3 Surface plate\n3.4 Layout and marking tools\n3.5 Cutting tools (hacksaw, chisel, files)\n3.6 Inspection and measuring tools (templates, vernier\ncaliper, micrometer, straight edge, gages, etc…)\n\n--- PDF PAGE 35 ---\nmach110504ts\n01/04/05\n34\n\nEVIDENCE GUIDE\n1.\nCritical aspects of\nCompetency\nAssessment requires evidence that the candidate organized\nand cleaned work area according shop policies and\nenvironmental requirements.\n\n2.\nUnderpinning\nknowledge and\nattitude\n2.1 Shop safety practices\n2.2 Machine shop equipment\n2.3 Shop policies regulations\n2.4 5-S\n2.5 Shop cleaning equipment\n\n3.\nUnderpinning\nskills\n3.1 Using and storing of cleaning equipment\n3.2 Using and storing chemicals, hazardous substances and\nflammable liquids\n3.3 Literacy and numeracy skills in reading and understanding\nlabels and instructions for the handling and use of\nchemicals and hazardous substances\n3.4 Communication skills\n3.5 Organizing skills\n\n4.\nResource\nimplications\nThe following resources MUST be provided:\n4.1 Tools, equipment and facilities appropriate to processes or\nactivity\n4.2 Materials and documentation relevant to the proposed\nactivity\n4.3 Shop policy and/or procedures manual on housekeeping,\ncleaning and occupational health and safety\n\n5.\nMethod of\nassessment\nCompetency may be assessed through:\n5.1 direct observation\n5.2 demonstration or role play\n5.3 written or oral short answer questions\n5.4 identify colleagues/clients who can be approached for the\ncollection of competency evidence, where appropriate\n\n6.\nContext for\nassessment\nCompetency may be assessed in the workplace or in simulated\nworkplace environment.\n\n--- PDF PAGE 36 ---\nmach110504ts\n01/04/05\n35\n\nUNIT OF COMPETENCY\nPERFORM PREVENTIVE AND CORRECTIVE\nMAINTENANCE\n\nUNIT CODE: MEE722211\n\nUNIT DESCRIPTOR:\nThis unit covers the knowledge and skills required in\nperforming preventive and corrective maintenance such\nas inspection and repair of hand tools, cleaning and\nlubrication of machine parts and changing drive pulley\nand belts.\n\n ELEMENTS\n PERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1.\nPerform inspection of\nmachine\n\n1.1\n\n1.2\nMachine inspected according to worksite\nprocedures.\nStatus/Report recorded on proforma or reported\norally according to worksite procedure.\n\n2.\nPerform cleaning and\nlubricating of machine\n\n2.1\n\n2.2\n\nMachines lubricated as per manufacturer’s\nrecommendation using appropriate tools and\nmaterials\nFluids and lubricants replaced and/or topped up\naccording to prescribed schedule.\n\n3.\nPerform minor machine\nrepair and adjustments\n\n3.1\n\n3.2\n\nMinor machine repairs performed according to\nmanufacturer’s instruction or worksite procedures.\nMachine moving parts adjusted to manufacturer’s\nspecifications.\n\n4.\nMaintain hand tools\n4.1\n4.2\nTool cutting ground to recommended specifications\nHand tools lubricated and stored according to\nprescribed procedure\n.\n\n--- PDF PAGE 37 ---\nmach110504ts\n01/04/05\n36\n\nRANGE OF VARIABLES\nVARIABLES\nRANGE\n1. Inspected\nInspected machine parts include:\n1.1 V-belt\n1.2 Bearing\n1.3 Gears\n1.4 Clutch\n1.5 Drive pulley\n\n2. Machines\nMachine include but not limited to:\n2.1 Lathe machine\n2.2 Milling machine\n2.3 Grinding machine\n\n3. Tools and materials\nTools and materials used include:\n3.1 Lubricants\n3.2 Oil can\n3.3 Grease gun\n3.4 Oil\n3.5 Coolant or compound\n\n--- PDF PAGE 38 ---\nmach110504ts\n01/04/05\n37\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that that the candidate:\n1.1 performed inspection of machine\n1.2 performed cleaning and lubricating of machine\n1.3 performed minor machine repairs and adjustments\n\n2. Underpinning knowledge\n2.1 Proper cleaning and oiling\n2.2 Kinds of oil\n2.3 Parts and function of machine tools\n2.4 Cutting oil, coolant or compound\n2.5 Pulleys and belts\n2.6 Location of main switches of the machine\n2.7 Handling and storage of tools\n2.8 Checklist of safe working conditions\n2.9 Procedures in cleaning and disposal of waste\nmaterials\n\n3. Underpinning skills\n3.1 Inspecting and repairing hand tools\n3.2 Inspecting and changing drive pulleys and belts\n3.3 Replacing and adjusting machine parts\n3.4 Distinguishing old and new coolant\n3.5 Distinguishing odor of polluted coolant\n3.6 Selecting coolant, cutting oil or compounds\n3.7 Changing coolant\n3.8 Inspecting work area for safe working environment\n3.9 Cleaning work area\n3.10 Disposing metal scraps, chips and waste materials.\n\n4. Resource Implications\nThe following resources MUST be provided:\n4.1 Tools, equipment and facilities appropriate to\nprocesses or activity\n4.2 Materials relevant to the proposed activity\n\n5. Method of Assessment\nCompetency may be assessed through:\n5.1 direct observation of activities\n5.2 oral or written questioning\n\n6. Context for Assessment\nCompetency may be assessed in the workplace or in\nsimulated workplace environment.\n\n--- PDF PAGE 39 ---\nmach110504ts\n01/04/05\n38\nCORE COMPETENCIES\n\nUNIT OF COMPETENCY:\nPerform Bench Work (Basic)\n\nUNIT CODE: MEE722301\n\nUNIT DESCRIPTOR: This unit covers the competencies required to determine job\nrequirements, perform basic bench work operations (i.e.\nlayout; cutting with hacksaw and chisel; filing; drilling; tapping\netc…) and check the components for conformance to\nspecifications.\n\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1.\nLayout and mark\ndimensions/\nfeatures on\nworkpiece\n1.1\n\n1.2\n\n1.3\n\nMaterials are selected according to the requirements\nspecified in the drawing.\nDimensions/features are laid out and marked in\naccordance with drawing specifications using bench\nwork tools and equipment.\nLayouting and marking are performed applying\nknowledge on safety procedures and using personal\nprotective devices.\n\n2.\nCut, chip and file\nflat, rectangular or\nround blocks\n2.1\n\n2.2\n\n2.3\n\n2.4\nWorkpieces are clamped in workholding devices to\navoid damage and accidents.\nWorkpieces are cut, chipped or filed to within tolerance\nspecified in the drawing.\nBroken or dull hacksaw blades are replaced according\nto requirements\nBench work operations are performed applying\nknowledge on safety procedures and using personal\nprotective devices.\n\n3.\n Drill, ream and lap\n holes\n3.1\n\n3.2\n\n3.3\n\nHole is drilled, reamed, spot-faced and lapped to\ndrawing specification.\nDrilling, reaming or lapping holes are performed\naccording to recommended sequence.\nOperations are performed applying knowledge on safety\nprocedures and using personal protective devices.\n\n4.\nCut threads using\ntap and stock and\ndie\n4.1\n\n4.2\n\n4.3\nThread is cut to fit gage or mating screw, within\ntolerance given in the blueprint\nThread is cut in accordance with the recommended\ntapping sequence\nThread cutting operations are performed applying\nknowledge on safety procedures and using personal\nprotective devices.\n\n--- PDF PAGE 40 ---\nmach110504ts\n01/04/05\n39\n\n5.\nOff-hand grind\ncutting tools\n5.1\n5.2\n5.3\n5.4\nCut edges are honed and free of burrs.\nCutter is sharpened to conform with specifications.\nCutters are ground using appropriate cooling agents.\nCutting tool grinding is performed applying knowledge\non safety procedures and using personal protective\ndevices.\n\n--- PDF PAGE 41 ---\nmach110504ts\n01/04/05\n40\n\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Materials\nMaterials used in bench work operations include\n1.1 Ferrous\n1.2 Non Ferrous\n2. Bench work tools and\n Equipment\nEquipment and tools may include\n2.1 Drill Press\n2.2 Pedestal Grinder\n2.3 Surface plate\n2.4 Layout and marking tools\n2.5 Cutting tools (hacksaw, chisel, files)\n2.6 Drills, reamers, laps\n2.7 Thread cutting tools (taps and stock and die)\n2.8 Inspection and measuring tools (templates, vernier\ncaliper, micrometer, straight edge, gages, etc…)\n3. Work holding Devices\nWork holding devices include the use of:\n3.1 Clamps\n3.2 Vises\n4. Bench work operations\nBench work operations:\n4.1 Layout and marking\n4.2 Cutting\n4.3 Chipping\n4.4 Filing\n4.5 Drilling, boring, counter boring, spot-facing\n4.6 Lapping\n4.7 Reaming\n4.8 Thread cutting\n4.9 Off-hand grinding\n\n--- PDF PAGE 42 ---\nmach110504ts\n01/04/05\n41\n\nEVIDENCE GUIDE\n1.\nCritical aspects\nof Competency\nAssessment requires evidence that the candidate:\n1.1 Laid-out and marked dimensions/features on the workpiece\n1.2 Cut, chipped and filed workpiece.\n1.3 Drilled, reamed and lapped holes.\n1.4 Cut threads\n1.5 Performed off-hand grinding\n\n2.\nUnderpinning\nknowledge and\nattitude\n2.1 Shop safety practices\n2.1.1 Safe working habits\n2.1.2 Identification of hazardous areas\n2.1.3 Protective clothing and devices\n2.1.4 Safe handling of tools, equipment and materials\n2.1.5 Housekeeping\n2.1.6 First-aid\n2.1.7 Fire extinguishers\n\n2.2 Drawing/Plans\n2.2.1 Standard drawing symbols\n2.2.2 Orthographic and isometric drawings\n\n2.3 Shop mathematics\n2.3.1 Basic arithmetic operations\n2.3.2 Fractions and decimals\n2.3.3 Percentages and ratios\n2.3.4 Conversion of units (English to metric)\n2.3.5 Trigonometric functions\n2.3.6 Computation of feed, cutting speed and machine\nrpm\n\n2.4 Measurements\n2.4.1 Linear measuring tools (rules, vernier, micrometer,\nheight gage)\n2.4.2 Geometrical tolerances\n\n2.5 Materials and related science\n2.5.1 Classification and mechanical properties of\nengineering materials\n\n2.6 Bench work\nTheory, use and care of hand tools for:\n2.6.1 Layout and marking tools\n2.6.2 Sawing, chipping, filing, lapping\n2.6.3 Drilling, reaming, tapping\n2.6.4 External threading\n2.6.5 Off-hand grinding\n\n--- PDF PAGE 43 ---\nmach110504ts\n01/04/05\n42\n\n3.\nUnderpinning\nskills\n3.1 Using bench work tools and equipment\n3.2 Using measuring instruments\n3.3 Operating drill press and grinders\n\n4.\nResource\nimplications\nThe following resources MUST be provided:\n4.1 Tools, equipment and facilities appropriate to processes or\n activity\n4.2 Materials relevant to the proposed activity\n4.3 Drawings, sketches or blueprint\n\n5.\nMethod of\nassessment\nCompetency may be assessed through:\n5.1 direct observation of bench work activities\n5.2 written or oral short answer questions\n5.3 practical exercises\n5.4 project work\n5.5 identify colleagues/clients who can be approached for the\ncollection of competency evidence, where appropriate\n\n6.\nContext for\nassessment\nCompetency may be assessed in the workplace or in simulated\nworkplace environment.\n\n--- PDF PAGE 44 ---\nmach110504ts\n01/04/05\n43\n\nUNIT OF COMPETENCY:\nTurn Workpiece (Basic)\n\nUNIT CODE: MEE722302\n\nUNIT DESCRIPTOR: This unit covers the skills required to setup and turn workpiece to\ndrawing specifications . It details the requirements for performing\nlathe operations such as facing and straight turning; cutting\ngrooves, drilling and boring, knurling; cutting single start external\nvee- and ACME threads; and cutting tapers using compound\nslide and formed tools.\n\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1.\nDetermine job\nrequirements\n1.1\n\n1.2\n\n1.3\n\nDrawings are interpreted to produce component to\nspecifications.\nSequence of operation is determined to produce\ncomponent to specifications.\nCutting tools are selected according to the\nrequirements of the operation.\n2.\nSetup workpiece\n2.1\n\n2.2\n\n2.3\n\nWorkpiece is mounted and centered on chuck to\nrequired level of accuracy using tools and\nequipment in accordance with worksite\nprocedures.\nWorkpiece is setup to required level of accuracy\nusing instruments/equipment according to work\nsite procedures.\nSetup operations are performed applying\nknowledge on safety procedures and using\npersonal protective devices.\n\n3.\nPerform turning\noperations\n3.1\n\n3.2\n\n3.3\n\n3.4\n\nSpeeds and feeds are calculated using appropriate\nmathematical techniques and reference material.\nLathe accessories used are appropriate to the\nrequirements of the operation.\nLathe operations are performed to produce\ncomponent to specifications in the drawing.\nOperations are performed applying knowledge on\nsafety procedures and using personal protective\ndevices.\n\n4.\nCheck/Measure\nworkpiece\n4.1\n\nWorkpiece is checked/measured for conformance\nto specification using appropriate techniques,\nmeasuring tools and equipment.\n\n--- PDF PAGE 45 ---\nmach110504ts\n01/04/05\n44\n\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Drawings\nReading and interpretation:\n1.1 Views and projections\n1.2 Drawing symbols\n1.3 Dimensions and features\n1.4 Tolerances\n2. Cutting Tools\nCutting tools used in lathe operations include:\n2.1 Tool bits\n2.1.1\nHigh speed steel\n2.1.2\nInserts\n2.2 Drills\n2.3 Reamers\n3. Workpiece\nWorkpiece materials used in turning operations:\n3.1 Ferrous metals\n3.2 Non-ferrous metals\n4. Instruments/\n equipment\n4.1 Surface gage\n4.2 Dial indicator on magnetic stand\n5. Lathe Accessories\n5.1 3- and 4-jaw chucks\n5.2 Lathe centers\n5.3 Drill chucks\n5.4 Knurling tools\n5.5 Boring bar\n6. Lathe Operations\nBasic lathe operations:\n6.1 facing\n6.2 straight turning\n6.3 cutting recess, shoulders, grooves and chamfers\n6.4 drilling, boring, counterboring, countersinking,\nreaming\n6.5 knurling\n6.6 single-start external vee and ACME thread cutting\n6.7 parting-off\n6.8 cutting external taper using compound slide or formed\ntool\n7 Measuring Tools\n7.1 Steel rule\n7.2 Vernier caliper\n7.3 Micrometer caliper\n7.4 Gages (thread, drill, surface finish, radius, screw\n pitch, taper)\n\n--- PDF PAGE 46 ---\nmach110504ts\n01/04/05\n45\nEVIDENCE GUIDE\n1.\nCritical aspects\nof Competency\nAssessment requires evidence that the candidate:\n1.1 determined job requirements\n1.2 setup the workpiece .\n1.3 performed turning operations\n1.4 checked/measured the workpiece\n\n2.\nUnderpinning\nknowledge and\nattitude\n2.1 Shop safety practices\n2.1.1 Safe working habits\n2.1.2 Identification of hazardous areas\n2.1.3 Protective clothing and devices\n2.1.4 Safe handling of tools, equipment and materials\n2.1.5 Housekeeping\n2.1.6 First-aid\n2.1.7 Fire extinguishers\n\n2.2 Drawing interpretation\n2.2.1 Standard drawing scales, symbols and abbreviations\n2.2.2 Orthographic and isometric drawings\n2.2.3 1st and 3rd angle projections\n2.2.4 Assembly and detail drawings\n2.2.5 Interpreting tolerances, limits and fits\n\n2.3 Shop mathematics\n2.3.1 Basic arithmetic operations\n2.3.2 Fractions and decimals\n2.3.3 Percentages and ratios\n2.3.4 Conversion of units (English to metric)\n2.3.5 Applying trigonometric functions\n\n2.4 Measurements\n2.4.1 Linear measuring tools (rules, vernier, micrometer)\n2.4.2 Angle measuring tools\n2.4.3 Geometrical tolerances\n2.4.4 Dial indicator\n2.4.5 Slip gages\n2.4.6 Precision levels\n\n2.5 Materials and related science\n2.5.1 Classification and mechanical properties of\nengineering materials\n\n2.6 Lathe machine operations\n2.6.1 Lathe types and specifications\n2.6.2 Lathe parts and functions\n2.6.3 Setting cutting speed, rpm, feed rate\n2.6.4 Workholding and tool holding devices\n2.6.5 Turning tools and tool geometry\n2.6.6 Tooling, set up and parameters in turning operations\n2.6.7 Lathe accessories, fixtures and attachments\n\n--- PDF PAGE 47 ---\nmach110504ts\n01/04/05\n46\n\n3.\nUnderpinning\nskills\n3.1 Selecting and grinding cutting tools\n3.2 Using measuring instruments\n3.3 Verifying workpiece specifications\n3.4 Computation of feed, cutting speed and machine rpm\n\n4.\nResource\nimplications\nThe following resources MUST be provided:\n4.1 Tools, equipment and facilities appropriate to processes or\nactivities\n4.2 Materials relevant to the proposed activity\n4.3 Drawings, sketches or blueprint\n\n5.\nMethod of\nassessment\nCompetency may be assessed through:\n5.1 direct observation of lathe setting activities\n5.2 written or oral short answer questions\n5.3 practical exercises\n5.4 identify colleagues/clients who can be approached for the\ncollection of competency evidence, where appropriate\n\n6.\nContext for\nassessment\nCompetency may be assessed in the workplace or in simulated\nworkplace environment.\n\n--- PDF PAGE 48 ---\nmach110504ts\n01/04/05\n47\nUNIT OF COMPETENCY:\nMill Workpiece (Basic)\n\nUNIT CODE: MEE722303\n\nUNIT DESCRIPTOR: This unit covers the skills required to setup and mill workpiece to\ndrawing specifications. It details the requirements for performing\nmilling operations such as drilling, boring, reaming and spot\nfacing holes; milling blocks, shoulder, parallel and angled faces;\nmilling slots, keys, serrations; and milling castings and circular\nslots and external radius.\n\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1.\nDetermine job\nrequirements\n1.1\n\n1.2\n\n1.3\n\nDrawings are interpreted to produce component to\nspecifications.\nSequence of operation is determined to produce\ncomponent to specifications.\nCutting tools are selected according to the\nrequirements of the operation.\n2.\nSetup workpiece\n2.1\n\n2.2\n\nWorkpiece is setup to required level of accuracy\nusing instruments/equipment according to work\nsite procedures.\nSetup operations are performed applying\nknowledge on safety procedures and using\npersonal protective devices.\n\n3.\nPerform milling\noperations\n3.1\n\n3.2\n\n3.3\n\n3.4\n\nSpeeds and feeds are set to requirements of the\njob.\nMilling machine accessories used are\nappropriate to the requirements of the operation.\nMilling operations are performed to produce\ncomponent to specifications in the drawing.\nMilling operations are performed applying\nknowledge on safety procedures and using\npersonal protective devices.\n\n4.\nCheck/Measure\nworkpiece\n4.1\n\nWorkpiece is checked/measured for conformance\nto specification using appropriate techniques,\nmeasuring tools and equipment.\n\n--- PDF PAGE 49 ---\nmach110504ts\n01/04/05\n48\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Cutting Tools\nCutting tools used in milling operations include:\n1.1 Drills\n1.2 Reamers\n1.3 Slab mills\n1.4 End mills\n1.5 Shell mills\n1.6 Side and face cutters\n1.7 Formed cutter\n1.8 Slitter\n1.9 T-slot cutter\n\n2. Workpiece\nWorkpiece materials used in milling operations:\n2.1 Ferrous\n2.2 Non-ferrous\n\n3. Milling machine\naccessories\n3.1 Workholding devices:\n3.1.1\nclamps\n3.1.2\nvises\n3.1.3\nangle plates\n3.2 Rotary tables\n\n4. Milling Operations\nBasic milling operations:\n4.1 drilling\n4.2 boring\n4.3 spot facing\n4.4 milling slot and keyways\n4.5 milling serrations\n4.6 milling vees\n4.7 parting-off\n4.8 milling circular slots\n\n5. Safety Procedures\nShop safety involves the handling of:\n5.1 Equipment\n5.2 Tools\n5.3 Materials\n\n6 Measuring Tools\n6.1 Steel rule\n6.2 Vernier caliper\n6.3 Micrometer caliper\n6.4 Gages (bore, surface finish, radius, depth)\n\n--- PDF PAGE 50 ---\nmach110504ts\n01/04/05\n49\nEVIDENCE GUIDE\n1.\nCritical aspects\nof Competency\nAssessment requires evidence that the candidate:\n1.1 determined job requirements\n1.2 setup the workpiece .\n1.3 performed turning operations\n1.4 checked/measured the workpiece\n\n2.\nUnderpinning\nknowledge\n2.1 Shop safety practices\n2.1.1 Safe working habits\n2.1.2 Identification of hazardous areas\n2.1.3 Protective clothing and devices\n2.1.4 Safe handling of tools, equipment and materials\n2.1.5 Housekeeping\n2.1.6 First-aid\n2.1.7 Fire extinguishers\n\n2.2 Drawing interpretation\n2.2.1 Alphabet of lines\n2.2.2 Drawing symbols\n2.2.3 Projections and views\n2.2.4 Fits and tolerances\n2.2.5 Surface texture\n2.2.6 Sketches and mechanical drawing\n\n2.3 Shop mathematics\n2.3.1 Basic arithmetic operations\n2.3.2 Fractions and decimals\n2.3.3 Percentages and ratios\n2.3.4 Conversion of units (English to metric)\n2.3.5 Applying trigonometric functions\n\n2.4 Measurements\n2.4.1 Linear measuring tools (rules, vernier, micrometer)\n2.4.2 Dial indicator\n2.4.3 Precision square\n2.4.4 Bevel protractor\n2.4.5 Vernier height gage\n\n2.5 Materials and related science\n2.5.1 Classification and mechanical properties of\nengineering materials\n2.5.2 Lubricants and coolants\n\n2.6 Milling operations\n2.6.1 Milling types and specifications\n2.6.2 Milling machine parts and functions\n2.6.3 Milling cutters and holders\n2.6.4 Setting cutting speed, rpm, feed rate\n2.6.5 Workholding devices\n 2.6.6 Milling machine accessories, fixtures and attachments\n\n--- PDF PAGE 51 ---\nmach110504ts\n01/04/05\n50\n3.\nUnderpinning\nskills\n3.1 Selecting and setting cutting tools\n3.2 Using measuring instruments\n3.3 Verifying workpiece specifications\n3.4 Computation of feed, cutting speed and machine rpm\n\n4.\nResource\nimplications\nThe following resources MUST be provided:\n4.1 Tools, equipment and facilities appropriate to processes or\nactivities\n4.2 Materials relevant to the proposed activity\n4.3 Drawings, sketches or blueprint\n\n5.\nMethod of\nassessment\nCompetency may be assessed through:\n5.1 direct observation of milling activities\n5.2 written or oral short answer questions\n5.3 practical exercises\n5.4 identify colleagues/clients who can be approached for the\ncollection of competency evidence, where appropriate\n\n6.\nContext for\nassessment\nCompetency may be assessed in the workplace or in simulated\nworkplace environment.\n\n--- PDF PAGE 52 ---\nmach110504ts\n01/04/05\n51\nUNIT OF COMPETENCY:\nGrind Workpiece (Basic)\n\nUNIT CODE: MEE722304\n\nUNIT DESCRIPTOR: This unit covers the skills required to setup and grind workpiece\nto drawing specifications. It details the requirements for grinding\nparallel surfaces, square surfaces, angles, radii and cutting off\nparts.\n\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1.\nDetermine job\nrequirements\n1.1\n\n1.2\n\n1.3\n\nDrawings are interpreted to produce component to\nspecifications.\nSequence of operation is determined to produce\ncomponent to specifications.\nWorkholding devices are selected according to the\nrequirements of the operation.\n2.\nSelect wheels and\naccessories\n2.1\n\n2.2\n\n2.3\n\nGrinding wheels are selected, inspected,\nmounted, dressed and trued according to worksite\nprocedures to produce component to\nspecifications.\nAccessories selected are appropriate to the\nrequirements of the operation.\nMachine guards, coolant and dust extraction\ndevices are checked according to worksite\nprocedure.\n\n3.\nPerform grinding\noperations\n3.1\n\n3.2\n3.3\n\n3.4\n\nGrinding machine is setup and adjusted in\naccordance with worksite procedures.\nWorkpiece is held or clamped to avoid damage.\nGrinding operations are performed safely, utilizing\nguards, safety procedures and personal protective\nclothing and devices.\nGrinding operations are performed to produce\ncomponent to specifications in the drawing.\n\n4.\nCheck/Measure\ncomponent\n4.1\n\nWorkpiece is checked/measured for conformance\nto specification using appropriate techniques,\nmeasuring tools and equipment.\n\n--- PDF PAGE 53 ---\nmach110504ts\n01/04/05\n52\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Grinding wheels\nWheels 