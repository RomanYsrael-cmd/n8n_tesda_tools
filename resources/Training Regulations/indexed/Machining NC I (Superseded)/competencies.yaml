        "source_text": "MEE722302\n\nUNIT DESCRIPTOR: This unit covers the skills required to setup and turn workpiece to\ndrawing specifications . It details the requirements for performing\nlathe operations such as facing and straight turning; cutting\ngrooves, drilling and boring, knurling; cutting single start external\nvee- and ACME threads; and cutting tapers using compound\nslide and formed tools.\n\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1.\nDetermine job\nrequirements\n1.1\n\n1.2\n\n1.3\n\nDrawings are interpreted to produce component to\nspecifications.\nSequence of operation is determined to produce\ncomponent to specifications.\nCutting tools are selected according to the\nrequirements of the operation.\n2.\nSetup workpiece\n2.1\n\n2.2\n\n2.3\n\nWorkpiece is mounted and centered on chuck to\nrequired level of accuracy using tools and\nequipment in accordance with worksite\nprocedures.\nWorkpiece is setup to required level of accuracy\nusing instruments/equipment according to work\nsite procedures.\nSetup operations are performed applying\nknowledge on safety procedures and using\npersonal protective devices.\n\n3.\nPerform turning\noperations\n3.1\n\n3.2\n\n3.3\n\n3.4\n\nSpeeds and feeds are calculated using appropriate\nmathematical techniques and reference material.\nLathe accessories used are appropriate to the\nrequirements of the operation.\nLathe operations are performed to produce\ncomponent to specifications in the drawing.\nOperations are performed applying knowledge on\nsafety procedures and using personal protective\ndevices.\n\n4.\nCheck/Measure\nworkpiece\n4.1\n\nWorkpiece is checked/measured for conformance\nto specification using appropriate techniques,\nmeasuring tools and equipment.\n\n--- PDF PAGE 45 ---\nmach110504ts\n01/04/05\n44\n\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Drawings\nReading and interpretation:\n1.1 Views and projections\n1.2 Drawing symbols\n1.3 Dimensions and features\n1.4 Tolerances\n2. Cutting Tools\nCutting tools used in lathe operations include:\n2.1 Tool bits\n2.1.1\nHigh speed steel\n2.1.2\nInserts\n2.2 Drills\n2.3 Reamers\n3. Workpiece\nWorkpiece materials used in turning operations:\n3.1 Ferrous metals\n3.2 Non-ferrous metals\n4. Instruments/\n equipment\n4.1 Surface gage\n4.2 Dial indicator on magnetic stand\n5. Lathe Accessories\n5.1 3- and 4-jaw chucks\n5.2 Lathe centers\n5.3 Drill chucks\n5.4 Knurling tools\n5.5 Boring bar\n6. Lathe Operations\nBasic lathe operations:\n6.1 facing\n6.2 straight turning\n6.3 cutting recess, shoulders, grooves and chamfers\n6.4 drilling, boring, counterboring, countersinking,\nreaming\n6.5 knurling\n6.6 single-start external vee and ACME thread cutting\n6.7 parting-off\n6.8 cutting external taper using compound slide or formed\ntool\n7 Measuring Tools\n7.1 Steel rule\n7.2 Vernier caliper\n7.3 Micrometer caliper\n7.4 Gages (thread, drill, surface finish, radius, screw\n pitch, taper)\n\n--- PDF PAGE 46 ---\nmach110504ts\n01/04/05\n45\nEVIDENCE GUIDE\n1.\nCritical aspects\nof Competency\nAssessment requires evidence that the candidate:\n1.1 determined job requirements\n1.2 setup the workpiece .\n1.3 performed turning operations\n1.4 checked/measured the workpiece\n\n2.\nUnderpinning\nknowledge and\nattitude\n2.1 Shop safety practices\n2.1.1 Safe working habits\n2.1.2 Identification of hazardous areas\n2.1.3 Protective clothing and devices\n2.1.4 Safe handling of tools, equipment and materials\n2.1.5 Housekeeping\n2.1.6 First-aid\n2.1.7 Fire extinguishers\n\n2.2 Drawing interpretation\n2.2.1 Standard drawing scales, symbols and abbreviations\n2.2.2 Orthographic and isometric drawings\n2.2.3 1st and 3rd angle projections\n2.2.4 Assembly and detail drawings\n2.2.5 Interpreting tolerances, limits and fits\n\n2.3 Shop mathematics\n2.3.1 Basic arithmetic operations\n2.3.2 Fractions and decimals\n2.3.3 Percentages and ratios\n2.3.4 Conversion of units (English to metric)\n2.3.5 Applying trigonometric functions\n\n2.4 Measurements\n2.4.1 Linear measuring tools (rules, vernier, micrometer)\n2.4.2 Angle measuring tools\n2.4.3 Geometrical tolerances\n2.4.4 Dial indicator\n2.4.5 Slip gages\n2.4.6 Precision levels\n\n2.5 Materials and related science\n2.5.1 Classification and mechanical properties of\nengineering materials\n\n2.6 Lathe machine operations\n2.6.1 Lathe types and specifications\n2.6.2 Lathe parts and functions\n2.6.3 Setting cutting speed, rpm, feed rate\n2.6.4 Workholding and tool holding devices\n2.6.5 Turning tools and tool geometry\n2.6.6 Tooling, set up and parameters in turning operations\n2.6.7 Lathe accessories, fixtures and attachments\n\n--- PDF PAGE 47 ---\nmach110504ts\n01/04/05\n46\n\n3.\nUnderpinning\nskills\n3.1 Selecting and grinding cutting tools\n3.2 Using measuring instruments\n3.3 Verifying workpiece specifications\n3.4 Computation of feed, cutting speed and machine rpm\n\n4.\nResource\nimplications\nThe following resources MUST be provided:\n4.1 Tools, equipment and facilities appropriate to processes or\nactivities\n4.2 Materials relevant to the proposed activity\n4.3 Drawings, sketches or blueprint\n\n5.\nMethod of\nassessment\nCompetency may be assessed through:\n5.1 direct observation of lathe setting activities\n5.2 written or oral short answer questions\n5.3 practical exercises\n5.4 identify colleagues/clients who can be approached for the\ncollection of competency evidence, where appropriate\n\n6.\nContext for\nassessment\nCompetency may be assessed in the workplace or in simulated\nworkplace environment.\n\n--- PDF PAGE 48 ---\nmach110504ts\n01/04/05\n47\nUNIT OF COMPETENCY:\nMill Workpiece (Basic)\n\nUNIT CODE:"
