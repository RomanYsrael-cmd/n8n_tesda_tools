  "source_text": "SECTION 4\nNATIONAL ASSESSMENT AND CERTIFICATION\nARRANGEMENTS\n\n4.1\nTo attain the National Qualification of Machining NC I, the candidate must\ndemonstrate competence in all the units of competency listed in Section 1.\nSuccessful candidates shall be awarded a National Certificate signed by the\nTESDA Director General.\n\n4.2\nIndividuals aspiring to be awarded the qualification of Machining NC I must\nacquire Certificates of Competency in all the core units of the Qualification.\nCandidates may apply for assessment in any accredited assessment center:\n\n4.2.1\nPerform bench work (Basic)\n4.2.2\nTurn workpiece (Basic)\n4.2.3\nMill workpiece (Basic)\n4.2.4\nGrind workpiece (Basic)\n\nSuccessful candidates shall be awarded Certificates of Competency (COC).\n\n4.3 Accumulation and submission of all COCs acquired for the relevant units of\ncompetency comprising a qualification, an individual shall be issued the\ncorresponding National Certificate.\n\n4.4\nAssessment shall focus on the core units of competency. The basic and common\nunits shall be integrated or assessed concurrently with the core units.\n\n4.5 The following are qualified to apply for assessment and certification:\n\n4.5.1 Graduates of formal, non-formal and informal including enterprise-based\ntraining programs.\n\n4.5.2 Experienced workers (wage employed or self employed)\n\n4.6 The guidelines on assessment and certification are discussed in detail in the\n\"Procedures Manual on Assessment and Certification\" and \"Guidelines on the\nImplementation of the Philippine TVET Qualification and Certification System\n(PTOQS)\".\n\n--- PDF PAGE 71 ---\nmach110504ts\n01/04/05\n70\nTurn workpiece\n(Basic)\nPerform bench work\n(Basic)\n\nPerform bench work\nComplex)\n\nTurn workpiece\n(Intermediate)\nCORE\nCOMPETENCIES\nMill workpiece\n(Basic)\n\nMill workpiece\n(Intermediate)\nMill workpiece\n (Advanced)\nGrind workpiece\n(Basic)\n\nGrind workpiece\n(Complex)\nSupermarket of Competencies\nMetals and Engineering Sector\nMACHINING\nTurn workpiece\n(Advanced)\nReceive and respond\nto workplace\ncommunication\n\nLead in workplace\n communication\nWork with others\nLead small teams\nSolve problems\nrelated to\nworkplace activities\n\nParticipate in\nworkplace\ncommunication\n\n Utilize specialist\ncommunication skills\nWork in team\nenvironment\nDevelop team and\nindividual\n\nApply problem-solving\ntechniques in the\nworkplace\n\nDemonstrate\n work values\nBASIC\nCOMPETENCIES\nCOMMON\nCOMPETENCIES\n Apply safety\n practices\n Perform routine\n housekeeping\n Measure workpiece\n (Basic)\n Interpret working\ndrawings and\nsketches\n Select and cut\nworkshop materials\n Perform shop\ncomputations (Basic)\n Perform preventive\nand corrective\nmaintenance\n Perform shop\ncomputations\n(Advanced)\n Perform shop\ncomputations\n (Intermediate)\n Measure workpiece\nusing gages and\ncomparators\n Measure workpiece\nusing angular\nmeasuring\ninstruments\nLegend\n\nMachining NC I\n\nPractice occupational\n health and\nsafety procedures\nDevelop and practice\n negotiation skills\nUse relevant\ntechnologies\nCollect, analyze\nand organize\ninformation\n\nPlan and\norganize work\nPractice career\nprofessionalism\n\nUse mathematical\nconcepts and\n techniques\nPromote\nenvironmental\n protection\n\nPractice\n housekeeping\n procedures\n\n--- PDF PAGE 72 ---\nmach110504ts\n01/04/05\n71\n\n"
