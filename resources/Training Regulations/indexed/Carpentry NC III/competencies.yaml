        "evidence_guide": {
          "source_text": "1. Critical aspects\nof Competency\nAssessment requires evidence that the candidate:\n1.1 Prepared materials and tools\n1.2 Laid-out location\n1.3 Cut and fixed moldings\n1.4 Performed housekeeping\n1.5 Communicated with others to ensure effective work operation\n1.6 Observed and complied with the productivity requirements\n1.7 Complied with attitudinal work requirements\n\n2. Resource\nimplications\n\nThe following resources should be provided:\n2.1\nActual or simulated workplace\n2.2\nTools, materials and equipment needed to perform the\nrequired tasks\n2.3\nReferences and manuals\n2.4\nPPE\n2.5\nFirst Aid Kit\n3. Method of\nassessment\n\nCompetency in this unit may be assessed through:\n3.1\nDemonstration/Observation with Oral Questioning\n\n4. Context for\nassessment\n2.1 Competency may be assessed in actual workplace or at the\ndesignated TESDA Accredited Assessment Center\n\n--- PDF PAGE 70 ---\nCarpentry NC III Revision 01 Promulgated (10/29/2018)\n66\nUNIT OF COMPETENCY\n:\nINSTALL CEILING FRAMES AND\nPANELS OR ACOUSTICAL CEILING\n\nUNIT CODE\n\n:"
        },
        "source_text": "CON711309\n\nUNIT DESCRIPTOR :\nThis unit covers the knowledge, skills, and attitudes in\nthe installation of different kinds and types of moldings.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1. Prepare\nmaterials, tools\nand equipment\n\n1.1 Personal Protective\nEquipment (PPE) is\nused in accordance\nwith 1080 of\nOccupational Safety\nand Health\nStandards.\n1.2 List of materials and\ntools are secured and\nfollowed according to\njob requirements\n1.3 Material, tools and\nequipment are\nselected, inspected\nand prepared\nconsistent with job\nrequirements.\n1.4 Work area is cleaned\naccording to safety\nand environmental\nregulations (e.g. PD\n1152 Section 6, 8 &\n42)\n1.5 Required output is\ncompleted as\nspecified by the\nimmediate supervisor\nbased on work\nschedule.\n\n1.1 DOLE Department\nOrder No. 13 series\n1998 Guidelines\nGoverning\nOccupational Safety\nand Health in the\nConstruction Industry\n1.2 Green Building\nConcept relative to\nConstruction (3R, 5S)\n1.3 Safe handling and\nstandard\nspecification of\nmaterials, tools and\nequipment\n1.4 Company rules and\nregulations\n1.5 Mensuration\n1.6 Safe and effective\nuse of tools\n1.7 Factors affecting\nproductivity\n1.8 Productivity work\nmeasurements\n1.9 Ways of improving\nproductivity\n1.10 Adherence to work\nrequirements\n1.1 Using PPE\n1.2 Communicating\neffectively\n1.3 Following company\nrules and\nregulations\n1.4 Organizing materials\nto be used\n1.5 Handling and use of\nmaterials, tools and\nequipment\n1.6 Applying\nmensuration\n1.7 Interpreting product\nmanual\n1.8 Implementing 3R\nand 5S\n1.9 Reading and\nunderstanding\ndrawings\n\n--- PDF PAGE 65 ---\nCarpentry NC III Revision 01 Promulgated (10/29/2018)\n61\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n2. Layout\nlocation\n2.1 Personal Protective