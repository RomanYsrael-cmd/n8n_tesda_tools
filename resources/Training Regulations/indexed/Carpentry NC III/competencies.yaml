        "source_text": "CON711314\n\nUNIT DESCRIPTOR :\nThis unit covers the knowledge, skills, and attitudes in\nthe installation of parquet floors.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Prepare materials\n and tools\n\n1.1 Personal protective\nequipment (PPE) is\nused in accordance\nwith Rule 1080 of\nOccupational Safety\nand Health\nStandards\n1.2 List of materials,\ntools and equipment\nare secured and\nfollowed according to\njob requirements\n1.3 Material and tools are\nselected, inspected\nand prepared\nconsistent with job\nrequirements.\n1.4 Work area is cleaned\naccording to safety\nand environmental\nregulations (e.g. PD\n1152 Section 6, 8 &\n42)\n1.5 Required output is\ncompleted as\nspecified by the\nimmediate supervisor\nbased on work\nschedule.\n\n1.1 DOLE\nDepartment\nOrder No. 13\nseries 1998\nGuidelines\nGoverning\nOccupational\nSafety and Health\nin the\nConstruction\nIndustry\n1.2 Green Building\nConcept relative\nto Construction\n(3R, 5S)\n1.3 Safe handling\nand standard\nspecification of\nmaterials and\ntools\n1.4 Markings and\nlabels\n1.5 Company rules\nand regulations\n1.6 Mensuration\n1.7 Safe and effective\nuse of hand tools\n1.8 Factors affecting\nproductivity\n1.9 Productivity work\nmeasurements\n1.10\nWays of\nimproving\nproductivity\n1.11\nAdherence to\nwork\nrequirements\n1.1 Using PPE\n1.2 Communicating\neffectively\n1.3 Following\ncompany rules\nand regulations\n1.4 Organizing\nmaterials to be\nused\n1.5 Handling and use\nof materials and\ntools\n1.6 Applying\nmensuration\n1.7 Interpreting\nproduct manual\n1.8 Implementing 3R\nand 5S\n1.9 Reading and\nunderstanding\ndrawings\n\n--- PDF PAGE 99 ---\nCarpentry NC III Revision 01 Promulgated (10/29/2018)\n95\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n2. Prepare surface\n2.1 Personal Protective\nEquipment (PPE) is\nused in accordance\nwith 1080 of\nOccupational Safety\nand Health Standards\n2.2 Surface is cleaned from\nresidue and protrusions\n2.3 Leveling compound is\napplied to ensure\nevenness, if necessary\n2.4 Work area is cleaned\naccording to safety and\nenvironmental\nregulations (e.g. PD\n1152 Section 6, 8 & 42)\n2.5 Required output is\ncompleted as specified\nby the immediate\nsupervisor based on\nwork schedule.\n\n2.1 DOLE\nDepartment\nOrder No. 13\nseries 1998\nGuidelines\nGoverning\nOccupational\nSafety and Health\nin the\nConstruction\nIndustry\n2.2 Green Building\nConcept relative\nto Construction\n(3R, 5S)\n2.3 Safe handling\nand standard\nspecification of\nmaterials and\ntools\n2.4 Company rules\nand regulations\n2.5 Safe and effective\nuse of tools\n2.6 Factors affecting\nproductivity\n2.7 Productivity work\nmeasurements\n2.8 Ways of\nimproving\nproductivity\n2.9 Adherence to\nwork\nrequirements\n2.1 Using PPE\n2.2 Communicating\neffectively\n2.3 Following\ncompany rules\nand regulations\n2.4 Organizing\nmaterials and\ntools\n2.5 Handling and use\nof materials and\ntools\n2.6 Interpreting\nproduct manual\n2.7 Implementing 3R\nand 5S\n2.8 Reading and\nunderstanding\ndrawings\n\n--- PDF PAGE 100 ---\nCarpentry NC III Revision 01 Promulgated (10/29/2018)\n96\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n3. Lay out parquet\npattern/ design\n3.1 Personal Protective\nEquipment (PPE) is\nused in accordance with\n1080 of Occupational\nSafety and Health\nStandards\n3.2 Parquet pattern/ design\nis marked and stringed\nbased on working\ndrawings\n3.3 Work area is cleaned\naccording to safety and\nenvironmental\nregulations (e.g. PD\n1152 Section 6, 8 & 42)\n3.4 Required output is\ncompleted as specified\nby the immediate\nsupervisor based on\nwork schedule.\n3.1 DOLE Department\nOrder No. 13\nseries 1998\nGuidelines\nGoverning\nOccupational\nSafety and Health\nin the Construction\nIndustry\n3.2 Green Building\nConcept relative to\nConstruction (3R,\n5S)\n3.3 Signs and symbols\n3.4 Company rules\nand regulations\n3.5 Methods and\ntechniques in\nlaying out\n3.6 Understanding\ninstructions\n3.7 Factors affecting\nproductivity\n3.8 Productivity work\nmeasurements\n3.9 Ways of improving\nproductivity\n3.10\nAdherence to\nwork requirements\n3.1 Handling and use\nof materials and\ntools\n3.2 Applying\nproductive\nmethods and\ntechniques in\nlaying out\n3.3 Using PPE\n3.4 Communicating\neffectively\n3.5 Following\ncompany rules\nand regulations\n3.6 Following\ninstructions\n3.7 Interpreting\nproduct manual\n3.8 Implementing 3R\nand 5S\n3.9 Reading and\nunderstanding\ndrawings\n\n--- PDF PAGE 101 ---\nCarpentry NC III Revision 01 Promulgated (10/29/2018)\n97\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n4. Place parquet\n\n4.1 Personal Protective\nEquipment (PPE) is\nused in accordance with\n1080 of Occupational\nSafety and Health\nStandards\n4.2 Adhesive is applied as\nneeded\n4.3 Parquet tiles are laid\nand fixed as per working\ndrawings\n4.4 Parquet is ground to\ndesired flatness\n4.5 Working area is\nvacuum-cleaned free of\ndust\n4.6 Work area is cleaned\naccording to safety and\nenvironmental\nregulations (e.g. PD\n1152 Section 6, 8 & 42)\n\n4.1 DOLE\nDepartment\nOrder No. 13\nseries 1998\nGuidelines\nGoverning\nOccupational\nSafety and\nHealth in the\nConstruction\nIndustry\n4.2 Green Building\nConcept relative\nto Construction\n(3R, 5S)\n4.3 Safe handling\nand standard\nspecification of\nmaterials and\ntools\n4.4 Markings and\nlabels\n4.5 Company rules\nand regulations\n4.6 Mensuration\n4.7 5-S\n4.8 Economic use of\nmaterial\n4.9 Installation\nprocedures\n4.10 Factors affecting\nproductivity\n4.11 Productivity work\nmeasurements\n4.12 Ways of\nimproving\nproductivity\n\n4.1 Using PPE\n4.2 Communicating\neffectively\n4.3 Following\ncompany rules\nand regulations\n4.4 Organizing\nmaterials to be\nused\n4.5 Handling and use\nof materials and\ntools\n4.6 Applying\nmensuration\n4.7 Following\ninstallation\nprocedures\n4.8 Interpreting\nproduct manual\n4.9 Implementing 3R\nand 5S\n4.10\nReading and\nunderstanding\ndrawings\n\n--- PDF PAGE 102 ---\nCarpentry NC III Revision 01 Promulgated (10/29/2018)\n98\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n5.Perform\nhousekeeping\n5.1 Personal protective\nequipment (PPE) is\nused in accordance with\nRule 1080 of\nOccupational Safety\nand Health Standards.\n5.2 Excess/un-used\nmaterials are recovered\nand stockpiled\naccording to company\nrules and procedures\n5.3 Work area is cleaned\naccording to safety and\nenvironmental\nregulations(e.g. PD\n1152 Section 6, 8 & 42)\n5.4 Tools and other\nmaterials are\ncleaned after use.\n5.5 Required output is\ncompleted as specified\nby the immediate\nsupervisor based on\nwork schedule.\n5.1 DOLE\nDepartment\nOrder No. 13\nseries 1998\nGuidelines\nGoverning\nOccupational\nSafety and Health\nin the\nConstruction\nIndustry\n5.2 Green Building\nConcept relative\nto Construction\n(3R, 5S)\n5.3 Safe handling\nand standard\nspecification of\nmaterials and\ntools\n5.4 Safety signs and\nsymbols\n5.5 Adherence to\nwork\nrequirements\n\n5.1 Working safely\n5.2 Organizing\nmaterials to be\nstored\n5.3 Handling and use\nof materials and\ntools\n5.4 Communicating\neffectively\n5.5 Using PPE\n5.6 Implementing 3R\nand 5S\n\n--- PDF PAGE 103 ---\nCarpentry NC III Revision 01 Promulgated (10/29/2018)\n99\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Personal\n Protective\n Equipment (PPE)\nMay include:\n1.1 Hard hat\n1.2 Safety shoes\n1.3 Rubber Gloves\n1.4 Working clothes\n1.5 Goggles\n1.6 Vest\n\n2. Job requirements\nMay include:\n2.1 Approved working drawings\n2.2 Sketches/ Shop drawings\n\n3. Materials and\n tools\n\nMay include:\n3.1 Parquet tiles\n3.2 Chalk line box\n3.3 Pen Marker/ Pencil/Chalk stone\n3.4 Rubber mallet\n3.5 Adhesive/wood glue\n3.6 Level hose/ level bar\n3.7 Pull push rule\n3.8 Nylon string\n3.9 Steel square/Carpenter’s square\n3.10 Sander with disc\n3.11 Polisher disc\n3.12 Notched trowel\n3.13 Floor roller\n3.14 Jigsaw\n3.15 Grinder\n3.16 Vacuum cleaner\n3.17 Rags\n\n--- PDF PAGE 104 ---\nCarpentry NC III Revision 01 Promulgated (10/29/2018)\n100\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Prepared materials, tools and equipment consistent with job\nrequirements.\n1.2 Prepare surface\n1.3 Laid-out parquet pattern/design based on working drawings\n1.4 Placed parquet as per working drawings\n1.5 Performed housekeeping\n1.6 Observed and complied with safety and environmental\nregulations\n1.7 Communicated with others to ensure effective work\noperation\n1.8 Observed and complied with the productivity requirements\n1.9 Complied with attitudinal work requirements\n\n2. Resource\nimplications\n\nThe following resources should be provided:\n2.1 Actual or simulated workplace\n2.2 Tools, materials and equipment needed to perform the\nrequired tasks\n2.3 References and manuals\n2.4 PPE\n2.5 First Aid Kit\n3. Method of\nassessment\n\nCompetency in this unit may be assessed through:\n3.1 Demonstration/Observation with Oral Questioning\n\n4. Context for\nassessment\n4.1 Competency may be assessed in actual workplace or at the\ndesignated TESDA Accredited Assessment Center\n\n--- PDF PAGE 105 ---\nCarpentry NC III Revision 01 Promulgated (10/29/2018)\n101"
