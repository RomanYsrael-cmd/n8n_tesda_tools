ed tools and materials in accordance with job\nrequirements\n1.3 Demonstrated ability to determine job specifications based on\nworking drawing\n2. Resource\nImplications\nThe following resources should be provided:\n2.4 Workplace\n2.5 Drawings and specification relevant to task\n2.6 Materials and instrument relevant to proposed activity\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1 Direct observation/Demonstration with Oral Questioning\n3.2 Written Examination\n4. Context of\nAssessment\n4.1 Competency may be assessed in actual workplace or at the\ndesignated TESDA Accredited Assessment Center.\n\n--- PDF PAGE 55 ---\nCarpentry NC III Revision 01 Promulgated (10/29/2018)\n51\nUNIT OF COMPETENCY\n:\nPERFORM MENSURATIONS AND CALCULATIONS\n\nUNIT CODE\n\n:\nCON311203\n\nUNIT DESCRIPTOR\n\n:\nThis unit covers the knowledge, skills and attitudes on\nidentifying and measuring objects based on the required\nperformance standards.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variable\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Select measuring\ninstruments\n\n1.1 Object or component to\nbe measured is\nidentified, classified\nand interpreted\naccording to the\nappropriate regular\ngeometric shape\n1.2 Measuring tools are\nselected/identified as\nper object to be\nmeasured or job\nrequirements\n1.3 Correct specifications\nare obtained from\nrelevant sources\n1.4 Measuring\ninstruments are\nselected according to\njob requirements\n1.5 Alternative measuring\ntools are used without\nsacrificing cost and\nquality of work\n\n1.1 Types of\nmeasuring tools\nand its uses\n\n1.1 Selecting\nmeasuring\ninstruments\n\n--- PDF PAGE 56 ---\nCarpentry NC III Revision 01 Promulgated (10/29/2018)\n52\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variable\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n2. Carry out\nmeasurements and\ncalculations\n\n2.1 Measurements are\nobtained according