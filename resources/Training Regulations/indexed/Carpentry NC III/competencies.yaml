        "evidence_guide": {
          "source_text": "1. Critical aspect of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Prepared materials, tools and equipment consistent with job\n requirements\n1.2 Erected scaffolds based on work requirements and safety\n standards\n1.3 Laid-out ceiling elevation and position of framing system based\n on working drawing\n1.4 Fasten frames and ceiling panels based on working drawings,\n specifications and manufacturer’s recommendation\n1.5 Performed housekeeping\n1.6 Observed and complied with safety and environmental\n regulations\n1.7 Communicated with others to ensure effective work\n operation\n1.8 Observed and complied with the productivity requirements\n1.9 Complied with attitudinal work requirements\n\n2. Resource\nimplications\n\nThe following resources should be provided:\n2.1 Actual or simulated workplace\n2.2 Tools, materials and equipment needed to perform the required\ntasks\n2.3 References and manuals\n2.4 PPE\n2.5 First Aid Kit\n3. Method of\nassessment\n\nCompetency in this unit may be assessed through:\n3.1 Demonstration/Observation with Oral Questioning\n\n4. Context for\nassessment\n4.1 Competency may be assessed in actual workplace or at the\ndesignated TESDA Accredited Assessment Center\n\n--- PDF PAGE 77 ---\nCarpentry NC III Revision 01 Promulgated (10/29/2018)\n73\nUNIT OF COMPETENCY\n:\nINSTALL EAVES OR SOFFITS FRAMES AND\nPANELS AND VENTS ASSEMBLY\n\nUNIT CODE\n\n:"
