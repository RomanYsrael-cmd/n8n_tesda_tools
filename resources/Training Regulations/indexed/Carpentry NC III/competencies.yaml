        "source_text": "CON711313\n\nUNIT DESCRIPTOR :\nThis unit covers the knowledge, skills, and attitudes in\ninstallation of laminate wooden floors.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1. Prepare\nmaterials and\ntools\n\n1.1 Personal protective\nequipment (PPE) is\nused in accordance\nwith Rule 1080 of\nOccupational Safety\nand Health\nStandards\n1.2 List of materials,\ntools and equipment\nare secured and\nfollowed according to\njob requirements\n1.3 Material and tools are\nselected, inspected\nand prepared\nconsistent with job\nrequirements.\n1.4 Work area is cleaned\naccording to safety\nand environmental\nregulations (e.g. PD\n1152 Section 6, 8 &\n42)\n1.5 Required output is\ncompleted as\nspecified by the\nimmediate supervisor\nbased on work\nschedule.\n\n1.1 DOLE Department\nOrder No. 13 series\n1998 Guidelines\nGoverning\nOccupational Safety\nand Health in the\nConstruction\nIndustry\n1.2 Green Building\nConcept relative to\nConstruction (3R,\n5S)\n1.3 Safe handling and\nstandard\nspecification of\nmaterials and tools\n1.4 Markings and labels\n1.5 Company rules and\nregulations\n1.6 Mensuration\n1.7 Safe and effective\nuse of hand tools\n1.8 Factors affecting\nproductivity\n1.9 Productivity work\nmeasurements\n1.10\nWays of\nimproving\nproductivity\n1.11\nAdherence to\nwork requirements\n1.1 Using PPE\n1.2 Communicating\neffectively\n1.3 Following company\nrules and\nregulations\n1.4 Organizing materials\nto be used\n1.5 Handling and use of\nmaterials and tools\n1.6 Applying\nmensuration\n1.7 Interpreting product\nmanual\n1.8 Implementing 3R\nand 5S\n1.9 Reading and\nunderstanding\ndrawings\n\n--- PDF PAGE 92 ---\nCarpentry NC III Revision 01 Promulgated (10/29/2018)\n88\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n2. Prepare surface\n2.1 Personal Protective\nEquipment (PPE) is\nused in accordance\nwith 1080 of\nOccupational Safety\nand Health\nStandards\n2.2 Surface is cleaned\nfrom residue and\nprotrusions\n2.3 Leveling compound\nis applied to ensure\nevenness, if\nnecessary\n2.4 Work area is cleaned\naccording to safety\nand environmental\nregulations (e.g. PD\n1152 Section 6, 8 &\n42)\n2.5 Required output is\ncompleted as\nspecified by the\nimmediate supervisor\nbased on work\nschedule.\n\n2.1 DOLE Department\nOrder No. 13 series\n1998 Guidelines\nGoverning\nOccupational Safety\nand Health in the\nConstruction Industry\n2.2 Green Building\nConcept relative to\nConstruction (3R, 5S)\n2.3 Safe handling and\nstandard specification\nof materials and tools\n2.4 Company rules and\nregulations\n2.5 Safe and effective use\nof tools\n2.6 Factors affecting\nproductivity\n2.7 Productivity work\nmeasurements\n2.8 Ways of improving\nproductivity\n2.9 Adherence to work\nrequirements\n2.1 Using PPE\n2.2 Communicating\neffectively\n2.3 Following company\nrules and\nregulations\n2.4 Organizing\nmaterials and tools\n2.5 Handling and use of\nmaterials and tools\n2.6 Interpreting\nproduct manual\n2.7 Implementing 3R\nand 5S\n2.8 Reading and\nunderstanding\ndrawings\n\n--- PDF PAGE 93 ---\nCarpentry NC III Revision 01 Promulgated (10/29/2018)\n89\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n3. Lay out\nlaminate\n floor starter\n3.1 Personal Protective\nEquipment (PPE) is\nused in accordance\nwith 1080 of\nOccupational Safety\nand Health\nStandards\n3.2 Laminate floor\ndirection is laid-out\nbased on job\nrequirements\n3.3 Work area is cleaned\naccording to safety\nand environmental\nregulations (e.g. PD\n1152 Section 6, 8 &\n42)\n3.4 Required output is\ncompleted as\nspecified by the\nimmediate supervisor\nbased on work\nschedule.\n3.1 DOLE Department\nOrder No. 13 series\n1998 Guidelines\nGoverning\nOccupational Safety\nand Health in the\nConstruction Industry\n3.2 Green Building\nConcept relative to\nConstruction (5S)\n3.3 Signs and symbols\n3.4 Company rules and\nregulations\n3.5 Methods and\ntechniques in laying\nout\n3.6 Understanding\ninstructions\n3.7 Factors affecting\nProductivity\n3.8 Productivity work\nmeasurements\n3.9 Ways of improving\nproductivity\n3.10\nAdherence to work\nrequirements\n\n3.1 Handling and use of\nmaterials and tools\n3.2 Applying productive\nmethods and\ntechniques in laying\nout\n3.3 Using PPE\n3.4 Communicating\neffectively\n3.5 Following company\nrules and\nregulations\n3.6 Following\ninstructions\n3.7 Interpreting product\nmanual\n3.8 Implementing 5S\n3.9 Reading and\nunderstanding\ndrawings\n\n--- PDF PAGE 94 ---\nCarpentry NC III Revision 01 Promulgated (10/29/2018)\n90\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n4. Place laminate\n floors\n\n4.1 Personal Protective\nEquipment (PPE) is\nused in accordance\nwith 1080 of\nOccupational Safety\nand Health\nStandards\n4.2 Insulation is laid and\nadhered if needed,\nfollowing\nmanufacturer’s\nrecommendation\n4.3 Laminate floor and\naccessories are\ninstalled as per\ndesign pattern\n4.4 Work area is cleaned\naccording to safety\nand environmental\nregulations (e.g. PD\n1152 Section 6, 8 &\n42)\n4.5 Required output is\ncompleted as\nspecified by the\nimmediate supervisor\nbased on work\nschedule.\n\n4.1 DOLE Department\nOrder No. 13 series\n1998 Guidelines\nGoverning\nOccupational Safety\nand Health in the\nConstruction Industry\n4.2 Green Building\nConcept relative to\nConstruction (3R, 5S)\n4.3 Safe handling and\nstandard specification\nof materials and tools\n4.4 Markings and labels\n4.5 Company rules and\nregulations\n4.6 Mensuration\n4.7 Installation procedures\n4.8 Factors affecting\nproductivity\n4.9 Productivity work\nmeasurements\n4.10 Ways of improving\nproductivity\n\n4.1 Using PPE\n4.2 Communicating\neffectively\n4.3 Following\ncompany rules\nand regulations\n4.4 Organizing\nmaterials to be\nused\n4.5 Handling and use\nof materials and\ntools\n4.6 Applying\nmensuration\n4.7 Following\ninstallation\nprocedures\n4.8 Interpreting\nproduct manual\n4.9 Implementing 3R\nand 5S\n4.10 Reading and\nunderstanding\ndrawings\n\n--- PDF PAGE 95 ---\nCarpentry NC III Revision 01 Promulgated (10/29/2018)\n91\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n5. Perform\nhousekeeping\n5.1 Personal protective\nequipment (PPE) is\nused in accordance with\nRule 1080 of\nOccupational Safety and\nHealth Standards.\n5.2 Excess/un-used\nmaterials are recovered\nand stockpiled\naccording to company\nrules and procedures\n5.3 Work area is cleaned\naccording to safety and\nenvironmental\nregulations(e.g. PD\n1152 Section 6, 8 & 42)\n5.4 Tools and other\nmaterials are\ncleaned after use.\n5.5 Required output is\ncompleted as specified\nby the immediate\nsupervisor based on\nwork schedule.\n5.1 DOLE\nDepartment\nOrder No. 13\nseries 1998\nGuidelines\nGoverning\nOccupational\nSafety and Health\nin the\nConstruction\nIndustry\n5.6 Green Building\nConcept relative\nto Construction\n(3R, 5S)\n5.7 Safe handling\nand standard\nspecification of\nmaterials and\ntools\n5.8 Safety signs and\nsymbols\n5.9 Adherence to\nwork\nrequirements\n\n5.1 Working safely\n5.2 Organizing\nmaterials to be\nstored\n5.3 Handling and use\nof materials and\ntools\n5.4 Communicating\neffectively\n5.5 Using PPE\n5.6 Implementing 3R\nand 5S\n\n--- PDF PAGE 96 ---\nCarpentry NC III Revision 01 Promulgated (10/29/2018)\n92\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Personal\n Protective\n Equipment (PPE)\nMay include:\n1.2 Hard hat\n1.3 Safety shoes\n1.4 Gloves\n1.5 Working clothes\n1.6 Goggles\n1.7 Vest\n1.8 Dust mask\n\n2. Job requirements\nMay include:\n2.1 Approved working drawings\n2.2 Sketches/ Shop drawings\n\n3. Materials and\n tools\n\nMay include:\n3.1 Laminate floors\n3.2 Polyethylene foam insulation\n3.3 Pen Marker/ Pencil/Chalk stone\n3.4 Cutter\n3.5 Glue/adhesive\n3.6 Level bar\n3.7 Pull push rule\n3.8 Hack saw\n3.9 Cross-cut saw\n3.10 Rags\n4. Accessories\nMay include:\n4.1 Baseboards\n4.2 Sealant\n4.3 Rubber molding\n\n--- PDF PAGE 97 ---\nCarpentry NC III Revision 01 Promulgated (10/29/2018)\n93\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Prepared materials and tools consistent with job\n requirements\n1.2 Prepare surface\n1.3 Laid-out laminated floor starter based on job requirements\n1.4 Placed laminate floors as per design pattern\n1.5 Performed housekeeping\n1.6 Observed and complied with safety and environmental\nregulations\n1.7 Communicated with others to ensure effective work\noperation\n1.8 Observed and complied with the productivity requirements\n1.9 Complied with attitudinal work requirements\n\n2. Resource\nimplications\n\nThe following resources should be provided:\n2.1 Actual or simulated workplace\n2.2 Tools, materials and equipment needed to perform the\nrequired tasks\n2.3 References and manuals\n2.4 PPE\n2.5 First Aid Kit\n3. Method of\nassessment\n\nCompetency in this unit may be assessed through:\n3.1 Demonstration/Observation with Oral Questioning\n\n4. Context for\nassessment\n4.1 Competency may be assessed in actual workplace or at the\ndesignated TESDA Accredited Assessment Center\n\n--- PDF PAGE 98 ---\nCarpentry NC III Revision 01 Promulgated (10/29/2018)\n94\nUNIT OF COMPETENCY\n:\nINSTALL PARQUET FLOORS\n\nUNIT CODE\n\n:"
