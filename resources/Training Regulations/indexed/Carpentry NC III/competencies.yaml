erials, tools and\nequipment\n4.4 Markings and labels\n4.5 Company rules and\nregulations\n4.6 Mensuration\n4.7 Installation\nprocedures\n4.8 Factors affecting\nproductivity\n4.9 Productivity work\nmeasurements\n4.10\nWays of\nimproving productivity\n4.11\nAdherence to\nwork requirements\n\n4.1 Using PPE\n4.2 Communicating\neffectively\n4.3 Following company\nrules and\nregulations\n4.4 Organizing materials\nto be used\n4.5 Handling and use of\nmaterials, tools and\nequipment\n4.6 Applying\nmensuration\n4.7 Interpreting product\nmanual\n4.8 Implementing 3R\nand 5S\n4.9 Reading and\nunderstanding\ndrawings\n\n--- PDF PAGE 74 ---\nCarpentry NC III Revision 01 Promulgated (10/29/2018)\n70\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n5. Perform\nhousekeeping\n5.1 Personal protective\nequipment (PPE) is\nused in accordance\nwith Rule 1080 of\nOccupational Safety\nand Health\nStandards.\n5.2 Excess/un-used\nmaterials are\nrecovered and\nstockpiled according\nto company rules and\nprocedures\n4.3 Work area is cleaned\naccording to safety\nand environmental\nregulations (e.g. PD\n1152 Section 6, 8 &\n42)\n4.4 Tools and other\nmaterials are\ncleaned after use.\n4.5 Required output is\ncompleted as\nspecified by the\nimmediate supervisor\nbased on work\nschedule.\n5.1 DOLE Department\nOrder No. 13 series\n1998 Guidelines\nGoverning\nOccupational Safety\nand Health in the\nConstruction Industry\n5.2 Green Building\nConcept relative to\nConstruction (3R, 5S)\n5.3 Safe handling and\nstandard\nspecification of\nmaterials, tools and\nequipment\n5.4 Safety signs and\nsymbols\n5.5 Adherence to work\nrequirements\n\n5.1 Working safely\n5.2 Organizing materials\nto be stored\n5.3 Handling and use of\nmaterials, tools and\nequipment\n5.4 Communicating\neffectively\n5.5 Using PPE\n5.6 Implementing 3R\nand 5S\n\n--- PDF PAGE 75 ---\nCarpentry NC III Revision 01 Promulgated (10/29/2018)\n71\nRANGE OF VA