ents/ ISO\n2. Resource\nimplications\nThe following resources should be provided:\n2.1 Workplace location\n2.2 Problems to solve\n2.3 Measuring instrument appropriate to carry out tasks\n2.4 Instructional materials relevant to the propose activity\n3. Methods of\nassessment\nCompetency in this unit may be assessed through:\n3.1 Direct observation/Demonstration with Oral Questioning\n4. Context of\nassessment\n 4.1 Competency may be assessed in actual workplace or at the\ndesignated TESDA Accredited Assessment Center\n\n--- PDF PAGE 59 ---\nCarpentry NC III Revision 01 Promulgated (10/29/2018)\n55\n\nUNIT OF COMPETENCY\n:\n MAINTAIN TOOLS AND EQUIPMENT\n\nUNIT CODE\n\n:\nCON311204\n\nUNIT DESCRIPTOR\n\n:\nThis unit covers the knowledge, skills and attitudes on\nchecking condition, performing preventive maintenance\nand storing of construction painting tools and\nequipment.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Check condition of\ntools and\nequipment\n\n1.1 Materials, tools and\nequipment are\nidentified according to\nclassification and job\nrequirements\n1.2 Non-functional tools\nand equipment are\nsegregated and labeled\naccording to\nclassification\n1.3 Safety of tools and\nequipment are\nobserved in\naccordance with\nmanufacturer's\ninstructions\n1.4 Condition of Personal\nProtective Equipment\n(PPE) are checked in\naccordance with\nmanufacturer's\ninstructions\n\n1.1 Use of PPE\n1.2 Handling of tools\nand equipment\n1.3 Good\nhousekeeping\n1.4 Types and uses\nof lubricants\n1.5 Types and uses\nof cleaning\nmaterials\n\n1.1 Maintaining\ntools and\nequipment\n1.2 Handling of\ntools and\nequipment\n1.3 Identifying\ntools and\nequipment\ndefects\n\n--- PDF PAGE 60 ---\nCarpentry NC III Revision 01 Promulgated (10/29/2018)\n56\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n2. Perform 