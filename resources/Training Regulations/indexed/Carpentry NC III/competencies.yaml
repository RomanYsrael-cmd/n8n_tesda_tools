          "source_text": "1. Critical aspects\nof competency\n\nAssessment requires that the candidate:\n1.1 Identified and determined signs, symbols and data according to\nwork plan and job requirements\n1.2 Identified tools and materials in accordance with job\nrequirements\n1.3 Demonstrated ability to determine job specifications based on\nworking drawing\n2. Resource\nImplications\nThe following resources should be provided:\n2.4 Workplace\n2.5 Drawings and specification relevant to task\n2.6 Materials and instrument relevant to proposed activity\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1 Direct observation/Demonstration with Oral Questioning\n3.2 Written Examination\n4. Context of\nAssessment\n4.1 Competency may be assessed in actual workplace or at the\ndesignated TESDA Accredited Assessment Center.\n\n--- PDF PAGE 55 ---\nCarpentry NC III Revision 01 Promulgated (10/29/2018)\n51\nUNIT OF COMPETENCY\n:\nPERFORM MENSURATIONS AND CALCULATIONS\n\nUNIT CODE\n\n:"
        },
        "source_text": "CON311202\n\nUNIT DESCRIPTOR\n\n:\nThis unit covers the knowledge, skills and attitudes in\nanalyzing and interpreting symbols, data and work plan\nbased on the required performance standards.\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Analyze signs,\nsymbols and data\n\n1.1 Signs, symbols and\ndata are identified\naccording to job\nspecifications\n1.2 Signs, symbols and\ndata are determined\naccording to site\nregulations\n1.1 Signs and\nsymbols\n1.2 Rules and\nregulations\n\n1.1 Interpreting\nworking drawing\n2. Interpret drawings\nand plans\n2.1 Necessary tools and\nmaterials are\nidentified according to\nthe work plan\n2.2 Supplies and materials\nare listed according to\nspecifications\n2.3 Components,\nassemblies or objects\nare recognized as\nrequired\n2.4 Dimensions are\nidentified as\nappropriate to the plan\n2.5 Specification details\nare matched with\nexisting/available\nresources and in line\nwith job requirements\n\n2.1 Systems of\nmeasurement\n2.2 Linear\nmeasurement\n2.3 Dimension\n2.4 Unit conversion\n\n2.1 Interpreting\ndrawing\n2.2 Matching\nspecification\ndetails with\nexisting resources\n\n--- PDF PAGE 53 ---\nCarpentry NC III Revision 01 Promulgated (10/29/2018)\n49\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Signs and\nsymbols\nMay include:\n1.1 Speed limit\n1.2 Direction/Road\n1.3 Warnings\n2. Site regulations\nMay include:\n2.1 Instructions\n2.2 Signages\n2.3 Work schedules\n2.4 Work bulletin boards\n2.5 Charts\n2.6 Memos\n2.7 Site Map\n2.8 Emergency response plan\n2.9 Permits\n3. Tools and\nmaterials\nMay include:\n3.1 Rulers\n3.2 Protractor\n3.3 Steel tape\n3.4 Calculator\n3.5 Pen Marker/ Pencil/Chalk stone\n4. Work plan\n\nMay include:\n4.1 Job requirements\n4.2 Installation instructions\n4.3 Components instruction\n\n--- PDF PAGE 54 ---\nCarpentry NC III Revision 01 Promulgated (10/29/2018)\n50\nEVIDENCE GUIDE\n\n1. Critical aspects\nof competency\n\nAssessment requires that the candidate:\n1.1 Identified and determined signs, symbols and data according to\nwork plan and job requirements\n1.2 Identified tools and materials in accordance with job\nrequirements\n1.3 Demonstrated ability to determine job specifications based on\nworking drawing\n2. Resource\nImplications\nThe following resources should be provided:\n2.4 Workplace\n2.5 Drawings and specification relevant to task\n2.6 Materials and instrument relevant to proposed activity\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1 Direct observation/Demonstration with Oral Questioning\n3.2 Written Examination\n4. Context of\nAssessment\n4.1 Competency may be assessed in actual workplace or at the\ndesignated TESDA Accredited Assessment Center.\n\n--- PDF PAGE 55 ---\nCarpentry NC III Revision 01 Promulgated (10/29/2018)\n51\nUNIT OF COMPETENCY\n:\nPERFORM MENSURATIONS AND CALCULATIONS\n\nUNIT CODE\n\n:"
