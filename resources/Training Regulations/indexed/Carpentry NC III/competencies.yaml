\nbased on work\nschedule.\n4.1 DOLE Department\nOrder No. 13 series\n1998 Guidelines\nGoverning\nOccupational Safety\nand Health in the\nConstruction Industry\n4.2 Green Building\nConcept relative to\nConstruction (3R, 5S)\n4.3 Safe handling and\nstandard specification\nof materials, tools and\nequipment\n4.4 Markings and labels\n4.5 Company rules and\nregulations\n4.6 Mensuration\n4.7 Installation procedures\n\n4.1 Using PPE\n4.2 Communicating\neffectively\n4.3 Following\ncompany rules\nand regulations\n4.4 Organizing\nmaterials to be\nused\n4.5 Handling and use\nof materials, tools\nand equipment\n4.6 Applying\nmensuration\n4.7 Interpreting\nproduct manual\n4.8 Implementing 3R\nand 5S\n4.9 Reading and\nunderstanding\ndrawings\n\n--- PDF PAGE 81 ---\nCarpentry NC III Revision 01 Promulgated (10/29/2018)\n77\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n5. Perform\nhousekeeping\n5.1 Personal protective\nequipment (PPE) is\nused in accordance\nwith Rule 1080 of\nOccupational Safety\nand Health Standards.\n5.2 Excess/un-used\nmaterials are\nrecovered and\nstockpiled according\nto company rules and\nprocedures\n5.3 Work area is cleaned\naccording to safety\nand environmental\nregulations(e.g. PD\n1152 Section 6, 8 &\n42)\n5.4 Tools and other\nmaterials are\ncleaned after use\n5.5 .Required output is\ncompleted as\nspecified by the\nimmediate supervisor\nbased on work\nschedule.\n5.1 DOLE Department\nOrder No. 13 series\n1998 Guidelines\nGoverning\nOccupational Safety\nand Health in the\nConstruction Industry\n5.2 Green Building\nConcept relative to\nConstruction (3R, 5S)\n5.3 Safe handling and\nstandard specification\nof materials, tools and\nequipment\n5.4 Safety signs and\nsymbols\n5.5 Adherence to work\nrequirements\n\n5.1 Working safely\n5.2 Organizing\nmaterials to be\nstored\n5.3 Handling and use\nof materials, tools\nand equipment\n5.4 Communicating\neffectively\n5.5 Using PPE\n5.6 Implementing 3R\nand 5S\n\n--- PDF PAGE 82 ---\nCarpentry NC III Revision 01 Promulgated (10/29/2018)\n78\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Personal\n Protective\n Equipment (PPE)\nMay include:\n1.1 Hard hat\n1.2 Safety shoes\n1.3 Gloves\n1.4 Working clothes\n1.5 Goggles\n1.6 Vest\n1.7 Full body harness (or alternative fall protection system such as\nrailings/guard rails or combination of both)\n\n2. Job requirements\nMay include:\n2.1 Approved working drawings\n2.2 Sketches/ Shop drawings\n\n3. Materials and\n tools\n\nMay include:\n3.1 Chalk line box\n3.2 Pen Marker/ Pen Marker/ Pencil/Chalk stone\n3.3 Claw hammer\n3.4 Level hose/ level bar\n3.5 Pull push rule/ steel tape/ laser meter\n3.6 Nylon string\n3.7 Plumb bob\n3.8 Steel square/Carpenter’s square\n3.9 Electric drill (Variable speed)\n3.10 Drill bit\n3.11 Screw bit\n3.12 Threaded rod\n3.13 Metal furring and accessories\n3.14 Fiber cement board\n3.15 Snips metal cutter\n3.16 Rivets\n3.17 Riveter\n3.18 Cutter\n3.19 Scoring knife\n3.20 Hack saw\n3.21 PVC or Wooden or Fiber cement vent assembly\n3.22 Vise grip\n3.23 Adjustable wrench\n\n4.Vents assembly\nMay include:\n4.1 PVC\n4.2 Wooden\n4.3 Fiber cement\n4.4 Metal\n\n--- PDF PAGE 83 ---\nCarpentry NC III Revision 01 Promulgated (10/29/2018)\n79\nEVIDENCE GUIDE\n\n1. Critical aspect of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Prepared materials, tools and equipment consistent with job\n requirements\n1.2 Erected scaffolds based on work requirements and safety\nstandards\n1.3 Laid-out eaves or soffits frames and panels and vents\nassembly elevation and position of framing system based on\nworking drawing\n1.4 Fasten eaves or soffits frames, panels and vents based on\nworking drawings, specifications and manufacturer’s\nrecommendation\n1.5 Performed housekeeping\n1.6 Observed and complied with safety and environmental\nregulations\n1.7 Communicated with others to ensure effective work\noperation\n1.8 Observed and complied