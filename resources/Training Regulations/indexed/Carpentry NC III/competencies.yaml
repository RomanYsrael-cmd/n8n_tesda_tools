        "source_text": "CON711311\n\nUNIT DESCRIPTOR :\nThis unit covers the knowledge, skills, and attitudes in\nthe installation of eaves or soffits frames and panels\nand vents assembly.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1. Prepare\nmaterials, tools\nand equipment\n\n1.1 Personal protective\nequipment (PPE) is\nused in accordance\nwith Rule 1080 of\nOccupational Safety\nand Health\nStandards\n1.2 List of materials,\ntools and equipment\nare secured\naccording to job\nrequirements\n1.3 Materials, tools and\nequipment are\nselected, inspected\nand prepared\nconsistent with job\nrequirements.\n1.4 Fabrication and\nstaging area are\nprepared based on\njob requirements\n1.5 Work area is cleaned\naccording to safety\nand environmental\nregulations (e.g. PD\n1152 Section 6, 8 &\n42)\n1.6 Required output is\ncompleted as\nspecified by the\nimmediate supervisor\nbased on work\nschedule.\n\n1.1 DOLE Department\nOrder No. 13 series\n1998 Guidelines\nGoverning\nOccupational Safety\nand Health in the\nConstruction Industry\n1.2 Green Building\nConcept relative to\nConstruction (3R, 5S)\n1.3 Safe handling and\nstandard\nspecification of\nmaterials, tools and\nequipment\n1.4 Markings and labels\n1.5 Company rules and\nregulations\n1.6 Mensuration\n1.7 Safe and effective\nuse of hand tools\n1.8 Factors affecting\nproductivity\n1.9 Productivity work\nmeasurements\n1.10\nWays of\nimproving\nproductivity\n1.11\nAdherence to\nwork requirements\n1.1 Using PPE\n1.2 Communicating\neffectively\n1.3 Following company\nrules and\nregulations\n1.4 Organizing materials\nto be used\n1.5 Handling and use of\nmaterials, tools and\nequipment\n1.6 Applying\nmensuration\n1.7 Interpreting product\nmanual\n1.8 Implementing 3R\nand 5S\n1.9 Reading and\nunderstanding\ndrawings\n\n--- PDF PAGE 78 ---\nCarpentry NC III Revision 01 Promulgated (10/29/2018)\n74\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n2. Erect scaffolds\n\n2.1 Personal protective\nequipment (PPE) is\nused in accordance\nwith Rule 1080 of\nOccupational Safety\nand Health\nStandards\n2.2 Scaffold systems are\nerected and stability\nis ensured based on\nwork requirements\nand safety standards\n2.3 Work area is cleaned\naccording to safety\nand environmental\nregulations (e.g. PD\n1152 Section 6, 8 &\n42)\n2.4 Required output is\ncompleted as\nspecified by the\nimmediate supervisor\nbased on work\nschedule.\n\n2.1 DOLE Department\nOrder No. 13 series\n1998 Guidelines\nGoverning\nOccupational Safety\nand Health in the\nConstruction Industry\n2.2 Green Building\nConcept relative to\nConstruction (3R, 5S)\n2.3 Working at heights\nprocedures\n2.4 Safe handling of\nmaterials, tools and\nequipment\n2.5 Markings and labels\n2.6 Company rules and\nregulations\n2.7 Mensuration\n2.8 Assembly and\nerection procedures\n2.9 Factors affecting\nproductivity\n2.10\nProductivity work\nmeasurements\n2.11\nWays of\nimproving\nproductivity\n2.1 Using PPE\n2.2 Communicating\neffectively\n2.3 Following company\nrules and\nregulations\n2.4 Organizing materials\nto be used\n2.5 Handling and use of\nmaterials, tools and\nequipment\n2.6 Complying safety\nrequirements on\nerection procedure\n2.7 Implementing 3R\nand 5S\n2.8 Reading and\nunderstanding\ndrawings\n\n--- PDF PAGE 79 ---\nCarpentry NC III Revision 01 Promulgated (10/29/2018)\n75\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n3. Layout eaves or\n soffits frames\n and panels and\n vents assembly\n elevation, and\n position of\n framing system\n\n3.1 Personal Protective\nEquipment (PPE) is\nused in accordance\nwith 1080 of\nOccupational Safety\nand Health Standards.\n3.2 Exact location or\nelevation is marked for\neaves or soffits frames\nand panels and vents\nassembly based on\nworking drawing\n3.