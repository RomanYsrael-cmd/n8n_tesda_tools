  "source_text": "SECTION 1 CARPENTRY NC III QUALIFICATION\n\nThe CARPENTRY NC III qualification consists of competencies on specialized carpentry\nthat a person must achieve in installation of architectural walls, ceilings and floors, using different\ntypes of materials.\n\nThis Qualification is packaged from the competency map of Construction – Civil Works sub-\nsector as shown in Annex A.\n\nThe units of competency comprising this qualification include the following:\n\nCODE NO.\n\nBASIC COMPETENCIES\n400311319\nLead workplace communication\n400311320\nLead small teams\n400311321\n\n400311322\nApply critical thinking and problem-solving techniques in\nthe workplace\nWork in a diverse environment\n400311323\n\n400311324\n400311325\n400311326\n400311327\nPropose methods of applying learning and innovation in\nthe organization\nUse information systematically\nEvaluate occupational safety and health work practices\nEvaluate environmental work practices\nFacilitate entrepreneurial skills for micro-small-medium\nenterprises (MSMEs)\n\nCODE NO.\nCOMMON COMPETENCIES\nCON931201\nPrepare construction materials and tools\nCON311201\nObserve procedures, specifications and manuals of\ninstruction\nCON311202\nInterpret technical drawings and plans\nCON311203\nPerform mensurations and calculations\nCON311204\nMaintain tools and equipment\n\nCODE NO.\nCON711309\nCON711310\nCON711311\nCON711312\nCON711313\nCON711314\n\n A person who\n\nCORE COMPETENCIES\nInstall decorative moldings\nInstall ceiling frames and panels or acoustical ceiling\nInstall eaves or soffits frames and panels and vents assembly\nInstall partition wall and/or cladding frames and boards\nInstall laminate floors\nInstall parquet floors\n\nhas achieved this Qualification is competent to be a –\n Specialized Carpenter\n\n--- PDF PAGE 6 ---\nCarpentry NC III Revision 01 Promulgated (10/29/2018)\n2"
