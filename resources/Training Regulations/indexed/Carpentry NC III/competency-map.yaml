  "source_text": "COMPETENCY MAP - CONSTRUCTION Sector\n(Civil Works)\n CARPENTRY NC III\n\nBASIC COMPETENCIES\n\n--- PDF PAGE 145 ---\nCarpentry NC III Revision 01 Promulgated (10/29/2018)\n141\n\nUtilize\nspecialize\nspecialized\ncommunication\nskill\nDevelop\nand lead\nteams\nPerform higher\norder thinking\nprocesses and\napply\ntechniques in\nthe workplace\nContribute\nto the\npractice of\nsocial\njustice in the\nworkplace\nManage\ninnovative\nwork\ninstructions\nManage and\nevaluate\nusage of\ninformation\nLead in\nimprovement of\nOccupational\nSafety and Health\nProgram, Policies\nand Procedures\nLead towards\nimprovement of\nenvironmental\nwork programs,\npolicies and\nprocedures\nSustain\nentrepreneurial\nskills\nManage and\nsustain\neffective\ncommunication\nstrategies\nManage\nand sustain\nhigh\nperforming\nteams\nEvaluate higher\norder thinking\nskills and adjust\nproblem solving\ntechniques\nAdvocate\nstrategic\nthinking for\nglobal\ncitizenship\nIncorporate\ninnovation\ninto work\nprocedures\nDevelop\nsystems in\nmanaging,\nand\nmaintaining\ninformation\nManage\nimplementation of\nOSH programs in\nthe workplace\nManage\nimplementation\nof\nenvironmental\nprogram in the\nworkplace\nDevelop and\nsustain a high-\nperforming\nenterprise\n\nPrepare\nconstruction\nmaterials and\ntools\n\nObserve\nprocedures,\nspecifications\nand manual of\ninstructions\n\nInterpret\ntechnical\ndrawings and\nplans\nPerform\nmensurations\nand\ncalculations\n\nMaintain tools\nand\nequipment\n\nCOMMON COMPETENCIES\n\nBASIC COMPETENCIES\n\n--- PDF PAGE 146 ---\nCarpentry NC III Revision 01 Promulgated (10/29/2018)\n142\nPrepare masonry\nmaterials\n\nPerform masonry tools\nand equipment\n\nPerform basic\nmasonry works\n\nLay concrete hollow\nblock for structure\nPlaster wall surface\nPerform basic tile\nsetting\nPerform straight-to-\nfinish floor concreting\nRectify non-\nconforming concrete\nand masonry surfaces\nLay tiles on plain and\ncurved surfaces for\nwalls, floors and other\napplication\nRepair of tiles on plain\nand curved surfaces\nLayout reference lines\n\nFabricate, install and\nremove wooden\nformworks\n\nInstall wooden door\njamb, window frame\nand panels\n\nInstall ceiling and wall\nframes and panels\n\nFabricate and install\nwooden stairs\n\nInstall wooden floor\nsupports and panels\n\nFabricate and install\nroofing system\n\nFabricate and install\nwooden cabinet\n\nInstall decorative\nmoldings\n\nInstall ceiling frames\nand panels or\nacoustical ceiling\n\nInstall eaves or\nsoffits frames and\npanels and vents\nassembly\nInstall partition wall\nand/or cladding\nframes and boards\n\nInstall laminate\nfloors\n\nInstall parquet floors\n\nErect and dismantle\nsupport type scaffold\n\nHandle, segregate and\nstack scaffolding\ncomponents\n\nCORE COMPETENCIES\n\n--- PDF PAGE 147 ---\nCarpentry NC III Revision 01 Promulgated (10/29/2018) 143\n\nGLOSSARY OF TERMS\n\n1.\n\nScaffolds\nany temporary elevated platform (supported or\nsuspended) and its supporting structure\n(including points of anchorage), used for\nsupporting workers or materials or both\n\n2.\n\nPlatform\nA raised level surface on which people or things\ncan stand\n\n3.\nMolding\nIs a strip of material with various profiles used to\ncover transitions between surfaces or for\ndecoration purposes\n\n4.\nCeiling Panels\nare boards secured to a ceiling frame either by\nfastening or laying\n\n5.\nAcoustical ceiling\nAlso called suspended ceiling, this type of ceiling\nuses inter-locking tee-runners and acoustically-\ndesigned panels\n\n6.\nFraming system\nA framing system that uses metal furrings and\naccessories or a grid of inter-locking tee-runners\nand accessories\n\n7.\nHangers\nA wire, strap, or rod attached to an overhead\nstructure, used to support the framework of a\nsuspended ceiling\n\n8.\nScaffolds and\nComponents\nany temporary elevated platform including lateral\nand diagonal support, access and anchorage\nused for supporting workers or materials or both\n\n9.\nEaves or soffits frames\nThe framework that surrounds and supports the\nentire eave or soffit system\n\n10. Vents assembly\nVents assembly includes a vent structure having\na mounting portion securing the vent structure\nover the opening in an eaves or soffits\n\n 11.\nHazards\nAn agent which has the potential to cause harm\n\n 12.\nSurface\nPertains to the area where the laminate floors\nwill be laid\n\n 13.\nLeveling compound\nA chemical mixture used to smooth uneven\nconcrete or wooden floors\n\n 14.\nInsulation\nServes as cushion or underlayment for the\nlaminate flooring\n\n--- PDF PAGE 148 ---\nCarpentry NC III Revision 01 Promulgated (10/29/2018) 144\n\n 15.\nLaminate floor\nIs a multi-layer synthetic flooring product fused\ntogether with a lamination process. It simulates\nwood (or sometimes stone) with a photographic\napplique layer under a clear protective layer.\nThe inner core layer is usually composed of\nmelamine resin and fiber board materials\n\n 16.\n\n 17.\n\nParquet\n\nComputer literate\n\nis a geometric mosaic of wood pieces used for\ndecorative effect in flooring\n\nThis term is usually used to describe the most\nbasic knowledge and skills needed to operate\nsoftware products such as an operating system,\na software application, or an automated Web\ndesign tool.\n\n 18.\n\n5S\nThe five in a 5S workplace organizational and\nhousekeeping methodology refers to five steps –\nsort, set in order, shine, standardize and sustain.\n\n 19.\n3Rs\nThe principle of reducing waste, reusing and\nrecycling resources and products\n\n Reduce\nThe waste management concept of reducing\nwhat is produced and what is consumed\n\n Reuse\n\nThe waste management concept of reusing\nitems, or re-purposing them for a use different\nthan what they are intended for\n\n Recycling\n\nThe waste management concept of transforming\nagain into a raw material that can be shaped into\na new item\n\n--- PDF PAGE 149 ---\nCarpentry NC III Revision 01 Promulgated (10/29/2018) 145\n\nTRAINING REGULATIONS (TR)\nDOCUMENT REVISION HISTORY\n\nQualification Title:\nCARPENTRY NC III\nQualification Code:\nCONCAR318\n\nRevision\nNo.\nDocument\nTypes*\nQualification Title\nTESDA Board\nResolution No./\nDate\nDeployment\n(TESDA Circular/\nImplementing\nGuidelines)\n00\nDocument Created\n\nCarpentry NC III\n2005-03 /\n03/18/05\nN/A\n01\nDocument Amended\n\nCarpentry NC III\n2018-35 /\n10/29/18\nNo. 011 series\nof 2019\n\nLegend: *Description Types\n- Document Created\n- Document Amended\n\n--- PDF PAGE 150 ---\nCarpentry NC III Revision 01 Promulgated (10/29/2018) 146\n\nACKNOWLEDGMENTS\n\nThe Technical Education and Skills Development Authority (TESDA) wishes to\nextend thanks and appreciation to the many representatives of business, industry,\nacademe and government agencies who donated their time and expertise to the\ndevelopment and validation of these Training Regulations.\n\nTECHNICAL EXPERTS REVIEW PANEL\n\nMARCELO R. ABAD\nConsultant/ Industry Expert\nQuezon City\nROLANDO C. BADILLA\nTechnical Specialist\nJames Hardie Philippines, Inc.\nCabuyao, Laguna\nALIPIO M. PANGANIBAN\nDepartment Head - Industry Expert\nDatem, Inc.\nQuezon City\nRIZALDY E. ANGELES\nConstruction Manager - Industry Expert\nEEI Corporation\nQuezon City\nJOHN S. JUAN\nSTIDS\nConstruction Industry Authority of the\nPhils. (CIAP) -CMDF\nMakati City\nANGELITO V. ZULUETA\nConsultant/ Industry Expert\nAVZ Management & Consulting Services\nSingalong, Manila\n\n--- PDF PAGE 151 ---\nCarpentry NC III Revision 01 Promulgated (10/29/2018) 147\n\nThe PARTICIPANTS in the Validation of this Training Regulations\n\nMINDANAO REGION\n\n• Allado Construction\n• Association of Construction Informal Workers (ACIW) - Davao\n• DJTECH\n• Department of Public Works and Highway (DPWH) - Davao\n• James Hardie Phils. Inc. (JHPI)\n• Maxbuilder Construction\n• Tagum City Trade School (TCTS)\n• PTC-San Isidro Manpower Training Center (SIMTRAC)\n• RTC-Korea Phils. Vocational Training Center (KPCTC)\n\nThe MEMBERS of the TESDA Board and Secretariat\n\nThe MANAGEMENT and STAFF of the TESDA Secretariat\n• Qualifications and Standards Office (QSO)\n• TR Development Team/Facilitators\n- Ma. Isabel G. Gamurot\n- Howard Mark N. Plete\n- Evangeline A. Cosep",
