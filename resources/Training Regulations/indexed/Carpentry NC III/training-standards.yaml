ion areas are as follows:\n\nSpace Requirement\nSize in Meters\nArea in\nSq. Meters\nPractical Training Area\n15 x 18\n270\nLibrary\n4 x 5\n20\nLecture Room\n8 x 6\n\n48\nTool Room/Storage\n4 x 5\n20\n\nWash room/Toilet\n\n4 x 5\n20\nCirculation area\n10 x 6\n\n60\nTOTAL AREA\n\n438\n\n--- PDF PAGE 141 ---\nCarpentry NC III Revision 01 Promulgated (10/29/2018)\n137\n\n3.6 TRAINERS’ QUALIFICATION\n\n• Holder of National TVET Trainer Certificate Level I (NTTC Level I) in\nCARPENTRY NC III\n• Must have completed the 40-Hour Construction Safety Training Course\n(COSH) per Department Order No. 13 s. 1998, Guidelines Governing\nOccupational Safety and Health in the Construction Industry conducted\nby OSHC and DOLE accredited Safety Training Organizations\n• Must have at least three (3) years industry experience in Civil works\nand one (1) year teaching experience in Carpentry\n\n3.7 INSTITUTIONAL ASSESSMENT\n\nInstitutional assessment is undertaken by trainees to determine their\nachievement of units of competency. A certificate of achievement is\nissued for each unit of Competency.\n\n--- PDF PAGE 142 ---\nCarpentry NC III Revision 01 Promulgated (10/29/2018)\n138"
