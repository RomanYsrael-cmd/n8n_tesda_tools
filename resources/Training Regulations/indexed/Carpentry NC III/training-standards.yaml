    "source_text": "3.1\nCURRICULUM DESIGN\n\nTESDA shall provide the training on the development of competency-based curricula\nto enable training providers develop their own curricula with the components mentioned\nbelow.\n\nDelivery of knowledge requirements for the basic, common and core units of\ncompetency\nspecifically\nin\nthe\nareas\nof\nmathematics,\nscience/technology,\ncommunication/language and other academic subjects shall be contextualized. To this end,\nTVET providers shall develop a Contextual Learning Matrix (CLM) to accompany their\ncurricula.\n\nCourse Title: CARPENTRY NC III\n\nNominal Training Duration:\n40 Hours Basic Competencies\n24 Hours Common Competencies\n 160 Hours Core Competencies\n Total 224 Hours\n\nCourse Description:\n\nThis course is designed to enhance the knowledge, skill and attitudes of CARPENTRY NC\nIII in accordance with construction industry standards. This covers competencies that a person\nmust achieve in performing tasks such as installing decorative moldings, ceiling frames and panels\nor acoustical ceiling, eaves or soffits frames and panels and vents assembly, partition wall and/or\ncladding frames and boards, laminate floors and parquet floors.\n\nTo complete the course, all units prescribed for this qualification must be achieved:\n\n--- PDF PAGE 106 ---\nCarpentry NC III Revision 01 Promulgated (10/29/2018) 102\n\nBASIC COMPETENCIES\n(40 HOURS)\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n1. Lead workplace\ncommunication\n1.1 Communicate\ninformation\nabout\nworkplace\nprocesses\n• Read\n• Lecture\n• Demonstration\n• Practical\nexercises\n• Role Play\n• Written Test\n• Observation\n2 Hours\no Effective verbal communication\nmethods\no Sources of information\n• Practice organizing information\n• Identify organization requirements for\nwritten and electronic communication\nmethods\n• Follow organization requirements for\nthe use of written and electronic\ncommunication methods\n• Perform exercises on understanding\nand conveying intended meaning\nscenario\n\n1.2 Lead\nworkplace\ndiscussions\n• Describe:\no Organizational policy on production,\nquality and safety\no Goals/ objectives and action plan\nsetting\n• Read\no Effective verbal communication\nmethods\n• Prepare/set action plans based on\norganizational goals and objectives\n• Group\ndiscussion\n• Lecture\n• Demonstration\n• Oral evaluation\n• Written Test\n• Observation\n2 Hours\n\n1.3 Identify and\ncommunicate\nissues arising\n• Describe:\no Organizational policy in dealing with\nissues and problems\n• Group\ndiscussion\n• Oral evaluation\n• Written Test\n2 Hours\n\n--- PDF PAGE 107 ---\nCarpentry NC III Revision 01 Promulgated (10/29/2018)\n103\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\nin the\nworkplace\n• Read\n• Effective verbal communication\nmethods\n• Lecture\n2. Lead small\nteams\n2.1 Provide team\nleadership\n\n• Discussion of Company policies and\nprocedures\n• Read web pages on situational\nleadership\n• Role play on situational leadership\n•\nGroup work\n•\nRole Play\n•\nLecture/\nDiscussion\n•\nIndividual\nWork\n\n• Role Play\n• Written Test\n\n1 Hour\n\n2.2 Assign\nresponsibilities\n• Read web pages on performance\nmanagement\n• Case study on allocating roles and\nresponsibilities based on competencies\nof current staff\n\n• Individual Work\n• Case Study\n• Role Play\n• Written Test\n\n1 Hour\n\n2.3 Set\nperformance\nexpectations\nfor team\nmembers\n• Role play to communicate performance\nexpectations with staff\n• Discussion on performance issues\n\n• Lecture/\nDiscussion\n• Role Play\n• Role Play\n• Written Test\n\n1 Hour\n\n2.4 Supervise\nteam\nperformance\n• Discussion on performance monitoring\n• Role play on providing feedback on\nperformance\n• Role play on performance coaching\n• Discussion on keeping the team\ninformed of team performance\n• Case study on Team performance\nmonitoring and feedback\n• Lecture/\nDiscussion\n• Role Play\n• Case Study\n• Role Play\n• Written Test\n\n1 Hour\n\n--- PDF PAGE 108 ---\nCarpentry NC III Revision 01 Promulgated (10/29/2018)\n104\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n3. Apply critical\nthinking and\nproblem-\nsolving\ntechniques in\nthe workplace\n3.1 Examine\nspecific\nworkplace\nstrategies\n\n• Show thorough knowledge and\nunderstanding of the process, normal\noperating parameters, and product\nquality to recognize non-standard\nsituations\n• Show mastery of the current industry\nhardware and software products and\nservices\n• Discuss process of identification of\nfundamental causes of specific\nworkplace challenges\n• Show mastery of knowledge and\nunderstanding of the process, normal\noperating parameters, and product\nquality to recognize non-standard\nsituations\n- Relevant equipment and\noperational processes\n- Enterprise goals, targets and\nmeasures\n- Enterprise quality OHS and\nenvironmental requirement\n- Enterprise information systems and\ndata collation\n- Industry codes and standards\n• Group\ndiscussion\n• Lecture\n• Demonstration\n• Role playing\n• Case Formulation\n• Life Narrative\nInquiry (Interview)\n• Standardized test\n1 Hour\n\n3.2 Analyze the\ncauses of\nspecific\nworkplace\nchallenges\n• Show thorough knowledge and\nunderstanding of the process, normal\noperating parameters, and product\nquality to recognize non-standard\nsituations\n• Group\ndiscussion\n• Lecture\n• Demonstration\n• Role playing\n• Case Formulation\n• Life Narrative\nInquiry (Interview)\n• Standardized test\n1 Hour\n\n--- PDF PAGE 109 ---\nCarpentry NC III Revision 01 Promulgated (10/29/2018)\n105\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\n• Show mastery of the current industry\nhardware and software products and\nservices\n• Discuss process of identification of\nfundamental causes of specific\nworkplace challenges\n• Show mastery of knowledge and\nunderstanding of the process, normal\noperating parameters, and product\nquality to recognize non-standard\nsituations\n- Relevant equipment and\noperational processes\n- Enterprise goals, targets and\nmeasures\n- Enterprise quality OHS and\nenvironmental requirement\n- Enterprise information systems and\ndata collation\n- Industry codes and standards\n• Identify extent and causes of specific\nchallenges in the workplace\n• Use of range of analytical problem-\nsolving techniques\n• Formulate clear-cut findings on the\nnature of each identified workplace\nchallenges\n\n--- PDF PAGE 110 ---\nCarpentry NC III Revision 01 Promulgated (10/29/2018)\n106\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\n3.3 Formulate\nresolutions to\nspecific\nworkplace\nchallenges\n\n• Show thorough knowledge and\nunderstanding of the process, normal\noperating parameters, and product\nquality to recognize non-standard\nsituations\n• Show mastery of the current industry\nhardware and software products and\nservices\n• Discuss process of identification of\nfundamental causes of specific\nworkplace challenges\n• Show mastery of knowledge and\nunderstanding of the process, normal\noperating parameters, and product\nquality to recognize non-standard\nsituations\n- Relevant equipment and\noperational processes\n- Enterprise goals, targets and\nmeasures\n- Enterprise quality OHS and\nenvironmental requirement\n- Enterprise information systems and\ndata collation\n- Industry codes and standards\n• Identify extent and causes of specific\nchallenges in the workplace\n• Use of range of analytical problem-\nsolving techniques\n• Group\ndiscussion\n• Lecture\n• Demonstration\n• Role playing\n• Case Formulation\n• Life Narrative\nInquiry (Interview)\n• Standardized test\n\n1 Hour\n\n--- PDF PAGE 111 ---\nCarpentry NC III Revision 01 Promulgated (10/29/2018)\n107\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n• Formulate clear-cut findings on the\nnature of each identified workplace\nchallenges\n• Discus strategies on devising,\ncommunicating, implementing and\nevaluating strategies and techniques in\naddressing specific workplace\nchallenges\n\n3.4 Implement\naction\nplans and\ncommunicate\nresults\n• Identify extent and causes of specific\nchallenges in the workplace\n• Use of range of analytical problem-\nsolving techniques\n• Formulate clear-cut findings on the\nnature of each identified workplace\nchallenges\n• Discus strategies on devising,\ncommunicating, implementing and\nevaluating strategies and techniques in\naddressing specific workplace\nchallenges\n• Group\ndiscussion\n• Lecture\n• Demonstration\n• Role playing\n• Case Formulation\n• Life Narrative\nInquiry (Interview)\n• Standardized test\n1 Hour\n4. Work in a\ndiverse\nenvironment\n\n4.1 Develop an\nindividual’s\ncultural\nawareness and\nsensitivity\n• Show understanding of cultural\ndiversity in the workplace\n• Recognize norms of behavior for\ninteracting and dialogue with specific\ngroups (e. g., Muslims and other non-\nChristians, non-Catholics, tribes/ethnic\ngroups, foreigners)\n• Small Group\nDiscussion\n• Interactive\nLecture\n• Brainstorming\n• Demonstration\n• Role-playing\n• Demonstration or\nsimulation with oral\nquestioning\n• Group discussions\nand interactive\nactivities\n• Case studies/\nproblems involving\n1 Hour\n\n--- PDF PAGE 112 ---\nCarpentry NC III Revision 01 Promulgated (10/29/2018)\n108\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n• Demonstrate different methods of\nverbal and non-verbal communication\nin a multicultural setting\n• Apply cross-cultural communication\nskills (i.e. different business customs,\nbeliefs, communication strategies)\n• Show affective skills – establishing\nrapport and empathy, understanding,\netc.\n• Demonstrate openness and flexibility\nin communication\n• Recognize diverse groups in the\nworkplace and community as defined\nby divergent culture, religion, traditions\nand practices\n\nworkplace diversity\nissues\n• Written\nexamination\n• Role Playing\n\n4.2 Work\neffectively in\nan\nenvironment\nthat\nacknowledges\nand values\ncultural\ndiversity\n• Explain the value of diversity in the\neconomy and society in terms of\nWorkforce development\n• Discuss the importance of\ninclusiveness in a diverse environment\n• Discuss the importance of shared\nvision and understanding of and\ncommitment to team, departmental,\nand organizational goals and\nobjectives\n• Identify and exhibit strategies for\ncustomer service excellence\n• Small Group\nDiscussion\n• Interactive\nLecture\n• Brainstorming\n• Demonstration\n• Role-playing\n• Demonstration or\nsimulation with oral\nquestioning\n• Group discussions\nand interactive\nactivities\n• Case studies/\nproblems involving\nworkplace diversity\nissues\n• Written\nexamination\n• Role Playing\n1 Hour\n\n--- PDF PAGE 113 ---\nCarpentry NC III Revision 01 Promulgated (10/29/2018)\n109\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n• Demonstrate cross-cultural\ncommunication skills and active\nlistening\n• Recognize diverse groups in the\nworkplace and community as defined\nby divergent culture, religion, traditions\nand practices\n• Demonstrate collaboration skills\n\n4.3 Identify\ncommon\nissues in a\nmulticultural\nand diverse\nenvironment\n• Explain the value, and leverage of\ncultural diversity\n• Discuss the inclusivity and conflict\nresolution\n• Describe the workplace harassment\n• Explain the change management and\ncite ways to overcome resistance to\nchange\n• Demonstrate advanced strategies for\ncustomer service excellence\n• Address diversity-related conflicts in\nthe workplace\n• Eliminate discriminatory behavior\ntowards customers and co-workers\n• Utilize change management policies in\nthe workplace\n\n• Small Group\nDiscussion\n• Interactive\nLecture\n• Brainstorming\n• Demonstration\n• Role-playing\n• Demonstration or\nsimulation with oral\nquestioning\n• Group discussions\nand interactive\nactivities\n• Case studies/\nproblems involving\nworkplace diversity\nissues\n• Written\nexamination\n• Role Playing\n1 Hour\n5. Propose\nmethods of\napplying\nlearning and\ninnovation in\n5.1 Assess work\nprocedures,\nprocesses and\nsystems in\nterms of\n• Show mastery of the following practical\nconcepts (e.g., 7 habits of highly\neffective people, character strengths\nthat foster learning and innovation, five\nminds of the future, adaptation\n• Interactive\nLecture\n• Appreciative\nInquiry\n• Demonstration\n• Psychological and\nbehavioral\nInterviews\n• Performance\nEvaluation\n1 Hour\n\n--- PDF PAGE 114 ---\nCarpentry NC III Revision 01 Promulgated (10/29/2018)\n110\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\nthe\norganization\ninnovative\npractices\n\nconcepts and transtheoretical model of\nbehavior change)\n• Demonstrate collaboration and\nnetworking skills\n• Show basic skills in research\n• Generate practical insights on how to\nimprove organizational procedures,\nprocesses and systems\n\n• Group work\n• Life Narrative\nInquiry\n• Review of\nportfolios of\nevidence and third-\nparty workplace\nreports of on-the-\njob performance.\n• Standardized\nassessment of\ncharacter\nstrengths and\nvirtues applied\n\n5.2 Generate\npractical action\nplans for\nimproving work\nprocedures,\nprocesses\n• Show mastery of the following practical\nconcepts (e.g., 7 habits of highly\neffective people, character strengths\nthat foster learning and innovation, five\nminds of the future, adaptation\nconcepts and transtheoretical model of\nbehavior change)\n• Demonstrate collaboration and\nnetworking skills\n• Show basic skills in research\n• Generate practical insights on how to\nimprove organizational procedures,\nprocesses and systems\n• Set up action plans on how to apply\ninnovative procedures in the\norganization\n• Interactive\nLecture\n• Appreciative\nInquiry\n• Demonstration\n• Group work\n• Psychological and\nbehavioral\nInterviews\n• Performance\nEvaluation\n• Life Narrative\nInquiry\n• Review of\nportfolios of\nevidence and third-\nparty workplace\nreports of on-the-\njob performance.\n• Standardized\nassessment of\ncharacter\n1 Hour\n\n--- PDF PAGE 115 ---\nCarpentry NC III Revision 01 Promulgated (10/29/2018)\n111\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n• Set up action plans on how to apply\ninnovative procedures in the\norganization\n• Generate practical insights on how to\nimprove organizational procedures,\nprocesses and systems\nstrengths and\nvirtues applied\n\n5.3 Evaluate the\neffectiveness\nof the\nproposed\naction plans\n• Show mastery of the following practical\nconcepts (e.g., 7 habits of highly\neffective people, character strengths\nthat foster learning and innovation, five\nminds of the future, adaptation\nconcepts and transtheoretical model of\nbehavior change)\n• Demonstrate collaboration and\nnetworking skills\n• Show basic skills in research\n• Generate practical insights on\ncontinuous improvement\n• Interactive\nLecture\n• Appreciative\nInquiry\n• Demonstration\n• Group work\n• Psychological and\nbehavioral\nInterviews\n• Performance\nEvaluation\n• Life Narrative\nInquiry\n• Review of\nportfolios of\nevidence and third-\nparty workplace\nreports of on-the-\njob performance.\n• Standardized\nassessment of\ncharacter\nstrengths and\nvirtues applied\n1 Hour\n6. Use information\nsystematically\n\n6.1 Use technical\ninformation\n• Lecture and discussion on:\n- Application in collating information\n- Procedures for inputting,\nmaintaining and archiving\ninformation\n• Lecture\n• Group\nDiscussion\n• Hands on\n• Demonstration\n• Oral evaluation\n• Written Test\n• Observation\n• Presentation\n4 Hours\n\n--- PDF PAGE 116 ---\nCarpentry NC III Revision 01 Promulgated (10/29/2018)\n112\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n- Guidance to people who need to\nfind and use information\n• Organizing information into a suitable\nform for reference and use\n• Classify stored information for\nidentification and retrieval\n• Operate the technical information\nsystem by using agreed procedures\n\n6.2 Apply\ninformation\ntechnology (IT)\n• Lecture and discussion on:\n- Attributes and limitations of available\nsoftware tool\n- Procedures and work instructions for\nthe use of IT\n- Operational requirements for IT\nsystems\n- Sources and flow paths of data\n- Security systems and measures that\ncan be used\n- Methods of entering and processing\ninformation\n• Use procedures and work instructions\nfor the use of IT\n• Extract data and format reports\n• Use WWW applications\n• Lecture\n• Group\nDiscussion\n• Self-paced\nhandout/\nmodule\n• Hands on\n• Demonstration\n• Oral evaluation\n• Written Test\n• Observation\n• Presentation\n2 Hours\n\n--- PDF PAGE 117 ---\nCarpentry NC III Revision 01 Promulgated (10/29/2018)\n113\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\n6.3 Edit, format and\ncheck\ninformation\n• Lecture and discussion on:\n- Basic file-handling techniques\n- Techniques in checking documents\n- Techniques in editing and formatting\n- Proof reading techniques\n• Use different techniques in checking\ndocuments\n• Edit and format information applying\ndifferent techniques\n• Proof read information applying\ndifferent techniques\n• Lecture\n• Group\nDiscussion\n• Self-paced\nhandout/\nmodule\n• Hands on\n• Demonstration\n• Oral evaluation\n• Written Test\n• Observation\n• Presentation\n2 Hours\n7. Evaluate\nOccupational\nSafety And\nHealth Work\nPractices\n7.1 Interpret\nOccupational\nSafety and\nHealth practices\n\n• Discuss the OSH standards, principles\nand legislations\n• Identify OSH work practices issues\n• Discuss standard safety requirements\n•\nLecture\n•\nGroup\nDiscussion\n\n•\nWritten Exam\n•\nDemonstration\n•\nObservation\n•\nInterviews /\nQuestioning\n2.5 Hours\n\n7.2 Set OSH work\ntargets\n• Discussion in actions plans that are\nnecessary in achieving the OSH target\n•\nLecture\n•\nGroup\nDiscussion\n\n•\nWritten Exam\n•\nDemonstration\n•\nObservation\n•\nInterviews /\nQuestioning\n1 Hour\n\n7.3 Evaluate\neffectiveness of\nOccupational\nSafety and\nHealth work\ninstructions\n• Practice evaluating safety data\n(Historical or Simulated)\n•\nLecture\n•\nGroup\nDiscussion\n\n•\nWritten Exam\n•\nDemonstration\n•\nObservation\n•\nInterviews /\nQuestioning\n1.5 Hours\n8. Evaluate\nEnvironmental\n8.1 Interpret\nenvironmental\npractices,\n• Discussion Environmental Issues\nregarding\n- Water Quality\n• Lecture\n• Group\nDiscussion\n•\nWritten Exam\n•\nDemonstration\n•\nObservation\n1 Hour\n\n--- PDF PAGE 118 ---\nCarpentry NC III Revision 01 Promulgated (10/29/2018)\n114\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\nWork\nPractices\npolicies and\nprocedures\n- National and Local Government\nIssues\n- Safety\n- Endangered Species\n- Noise\n- Air Quality\n- Historic\n- Waste\n- Cultural\n• Updating of existing occupation\npractices\n\n• Demonstration\n\n•\nInterviews /\nQuestioning\n\n8.2 Establish\ntargets to\nevaluate\nenvironmental\npractices\n• Discussion on\n-\nlower production costs and\nenergy consumption\n-\nEnvironmentally Sound\nProcesses\n-\nResource Efficient\n-\nRecycling and Waste\nManagement\n• Simple case study regarding energy\nefficiency\n• Lecture\n• Group\nDiscussion\n• Demonstration\n\n• Written Exam\n• Demonstration\n• Observatio