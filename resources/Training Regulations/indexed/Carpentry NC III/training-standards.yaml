ronmental requirement\n- Enterprise information systems and\ndata collation\n- Industry codes and standards\n• Identify extent and causes of specific\nchallenges in the workplace\n• Use of range of analytical problem-\nsolving techniques\n• Group\ndiscussion\n• Lecture\n• Demonstration\n• Role playing\n• Case Formulation\n• Life Narrative\nInquiry (Interview)\n• Standardized test\n\n1 Hour\n\n--- PDF PAGE 111 ---\nCarpentry NC III Revision 01 Promulgated (10/29/2018)\n107\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n• Formulate clear-cut findings on the\nnature of each identified workplace\nchallenges\n• Discus strategies on devising,\ncommunicating, implementing and\nevaluating strategies and techniques in\naddressing specific workplace\nchallenges\n\n3.4 Implement\naction\nplans and\ncommunicate\nresults\n• Identify extent and causes of specific\nchallenges in the workplace\n• Use of range of analytical problem-\nsolving techniques\n• Formulate clear-cut findings on the\nnature of each identified workplace\nchallenges\n• Discus strategies on devising,\ncommunicating, implementing and\nevaluating strategies and techniques in\naddressing specific workplace\nchallenges\n• Group\ndiscussion\n• Lecture\n• Demonstration\n• Role playing\n• Case Formulation\n• Life Narrative\nInquiry (Interview)\n• Standardized test\n1 Hour\n4. Work in a\ndiverse\nenvironment\n\n4.1 Develop an\nindividual’s\ncultural\nawareness and\nsensitivity\n• Show understanding of cultural\ndiversity in the workplace\n• Recognize norms of behavior for\ninteracting and dialogue with specific\ngroups (e. g., Muslims and other non-\nChristians, non-Catholics, tribes/ethnic\ngroups, foreigners)\n• Small Group\nDiscussion\n• Interactive\nLecture\n• Brainstorming\n• Demonstration\n• Role-playing\n• Demonstration or\nsimulation with oral\nquestioning\n• Group discussions\nand interactive\nactivities\n• Case studies/\nproblems involving\n1 Hour\n\n--- PDF PAGE 112 ---\nCarpentry NC III Revision 01 Promulgated (10/29/2018)\n108\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n• Demonstrate different methods of\nverbal and non-verbal communication\nin a multicultural setting\n• Apply cross-cultural communication\nskills (i.e. different business customs,\nbeliefs, communication strategies)\n• Show affective skills – establishing\nrapport and empathy, understanding,\netc.\n• Demonstrate openness and flexibility\nin communication\n• Recognize diverse groups in the\nworkplace and community as defined\nby divergent culture, religion, traditions\nand practices\n\nworkplace diversity\nissues\n• Written\nexamination\n• Role Playing\n\n4.2 Work\neffectively in\nan\nenvironment\nthat\nacknowledges\nand values\ncultural\ndiversity\n• Explain the value of diversity in the\neconomy and society in terms of\nWorkforce development\n• Discuss the importance of\ninclusiveness in a diverse environment\n• Discuss the importance of shared\nvision and understanding of and\ncommitment to team, departmental,\nand organizational goals and\nobjectives\n• Identify and exhibit strategies for\ncustomer service excellence\n• Small Group\nDiscussion\n• Interactive\nLecture\n• Brainstorming\n• Demonstration\n• Role-playing\n• Demonstration or\nsimulation with oral\nquestioning\n• Group discussions\nand interactive\nactivities\n• Case studies/\nproblems involving\nworkplace diversity\nissues\n• Written\nexamination\n• Role Playing\n1 Hour\n\n--- PDF PAGE 113 ---\nCarpentry NC III Revision 01 Promulgated (10/29/2018)\n109\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n• Demonstrate cross-cultural\ncommunication skills and active\nlistening\n• Recognize diverse groups in the\nworkplace and community as defined\nby divergent culture, religion, traditions\nand practices\n• Demonstrate collaboration skills\n\n4.3 Identify\ncommon\nissues in a\nmulticultural\nand diverse\nenvironment\n• Explain the value, and leverage of\ncultural diversity\n• Discuss the inclusivity and conflict\nresolution\n• Describe the workplace harassment\n• Explain the change management and\ncite ways to overcome resistance to\nchange\n• Demonstrate advanced strategies for\ncustomer service excellence\n• Address diversity-related conflicts in\nthe workplace\n• Eliminate discriminatory behavior\ntowards customers and co-workers\n• Utilize change management policies in\nthe workplace\n\n• Small Group\nDiscussion\n• Interactive\nLecture\n• Brainstorming\n• Demonstration\n• Role-playing\n• Demonstration or\nsimulation with oral\nquestioning\n• Group discussions\nand interactive\nactivities\n• Case studies/\nproblems involving\nworkplace diversity\nissues\n• Written\nexamination\n• Role Playing\n1 Hour\n5. Propose\nmethods of\napplying\nlearning and\ninnovation in\n5.1 Assess work\nprocedures,\nprocesses and\nsystems in\nterms of\n• Show mastery of the following practical\nconcepts (e.g., 7 habits of highly\neffective people, character strengths\nthat foster learning and innovation, five\nminds of the future, adaptation\n• Interactive\nLecture\n• Appreciative\nInquiry\n• Demonstration\n• Psychological and\nbehavioral\nInterviews\n• Performance\nEvaluation\n1 Hour\n\n--- PDF PAGE 114 ---\nCarpentry NC III Revision 01 Promulgated (10/29/2018)\n110\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\nthe\norganization\ninnovative\npractices\n\nconcepts and transtheoretical model of\nbehavior change)\n• Demonstrate collaboration and\nnetworking skills\n• Show basic skills in research\n• Generate practical insights on how to\nimprove organizational procedures,\nprocesses and systems\n\n• Group work\n• Life Narrative\nInquiry\n• Review of\nportfolios of\nevidence and third-\nparty workplace\nreports of on-the-\njob performance.\n• Standardized\nassessment of\ncharacter\nstrengths and\nvirtues applied\n\n5.2 Generate\npractical action\nplans for\nimproving work\nprocedures,\nprocesses\n• Show mastery of the following practical\nconcepts (e.g., 7 habits of highly\neffective people, character strengths\nthat foster learning and innovation, five\nminds of the future, adaptation\nconcepts and transtheoretical model of\nbehavior change)\n• Demonstrate collaboration and\nnetworking skills\n• Show basic skills in research\n• Generate practical insights on how to\nimprove organizational procedures,\nprocesses and systems\n• Set up action plans on how to apply\ninnovative procedures in the\norganization\n• Interactive\nLecture\n• Appreciative\nInquiry\n• Demonstration\n• Group work\n• Psychological and\nbehavioral\nInterviews\n• Performance\nEvaluation\n• Life Narrative\nInquiry\n• Review of\nportfolios of\nevidence and third-\nparty workplace\nreports of on-the-\njob performance.\n• Standardized\nassessment of\ncharacter\n1 Hour\n\n--- PDF PAGE 115 ---\nCarpentry NC III Revision 01 Promulgated (10/29/2018)\n111\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n• Set up action plans on how to apply\ninnovative procedures in the\norganization\n• Generate practical insights on how to\nimprove organizational procedures,\nprocesses and systems\nstrengths and\nvirtues applied\n\n5.3 Evaluate the\neffectiveness\nof the\nproposed\naction plans\n• Show mastery of the following practical\nconcepts (e.g., 7 habits of highly\neffective people, character strengths\nthat foster learning and innovation, five\nminds of the future, adaptation\nconcepts and transtheoretical model of\nbehavior change)\n• Demonstrate collaboration and\nnetworking skills\n• Show basic skills in research\n• Generate practical insights on\ncontinuous improvement\n• Interactive\nLecture\n• Appreciative\nInquiry\n• Demonstration\n• Group work\n• Psychological and\nbehavioral\nIntervi