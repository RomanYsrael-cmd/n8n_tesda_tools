iscriminatory behavior\ntowards customers and co-workers\n• Utilize change management policies in\nthe workplace\n\n• Small Group\nDiscussion\n• Interactive\nLecture\n• Brainstorming\n• Demonstration\n• Role-playing\n• Demonstration or\nsimulation with oral\nquestioning\n• Group discussions\nand interactive\nactivities\n• Case studies/\nproblems involving\nworkplace diversity\nissues\n• Written\nexamination\n• Role Playing\n1 Hour\n5. Propose\nmethods of\napplying\nlearning and\ninnovation in\n5.1 Assess work\nprocedures,\nprocesses and\nsystems in\nterms of\n• Show mastery of the following practical\nconcepts (e.g., 7 habits of highly\neffective people, character strengths\nthat foster learning and innovation, five\nminds of the future, adaptation\n• Interactive\nLecture\n• Appreciative\nInquiry\n• Demonstration\n• Psychological and\nbehavioral\nInterviews\n• Performance\nEvaluation\n1 Hour\n\n--- PDF PAGE 114 ---\nCarpentry NC III Revision 01 Promulgated (10/29/2018)\n110\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\nthe\norganization\ninnovative\npractices\n\nconcepts and transtheoretical model of\nbehavior change)\n• Demonstrate collaboration and\nnetworking skills\n• Show basic skills in research\n• Generate practical insights on how to\nimprove organizational procedures,\nprocesses and systems\n\n• Group work\n• Life Narrative\nInquiry\n• Review of\nportfolios of\nevidence and third-\nparty workplace\nreports of on-the-\njob performance.\n• Standardized\nassessment of\ncharacter\nstrengths and\nvirtues applied\n\n5.2 Generate\npractical action\nplans for\nimproving work\nprocedures,\nprocesses\n• Show mastery of the following practical\nconcepts (e.g., 7 habits of highly\neffective people, character strengths\nthat foster learning and innovation, five\nminds of the future, adaptation\nconcepts and transtheoretical model of\nbehavior change)\n• Demonstrate collaboration and\nnetworking skill