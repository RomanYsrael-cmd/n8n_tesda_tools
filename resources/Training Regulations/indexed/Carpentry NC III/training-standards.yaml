hnical\ndrawings and plans\n3.1 Analyze signs, symbols\nand data\n• Identifying signs, symbols and\ndata\n• Classifying signs, symbols and\ndata\n\n• Discussion\n• Demonstration\n• Demonstration\nwith oral\nquestioning\n• Written\nexamination\n2 Hours\n\n3.2 Interpret drawings and\nplans\n• Identifying tools, supplies,\nmaterials and equipment\n• Recognizing components,\nassemblies or objects\n• Identifying dimensions\n• Discussion\n• Demonstration\n• Demonstration\nwith oral\nquestioning\n• Written\nexamination\n2 Hours\n\n4.Perform mensurations\nand calculations\n4.1 Select measuring\ninstruments\n\n• Selecting measuring\ninstruments\n• Lecture-\ndemonstration\n• Group\ndiscussion\n• Demonstration\nwith oral\nquestioning\n\n2 Hours\n\n4.2 Carry out measurements\nand calculations\n\n• Interpreting formulas for\nvolume, areas, perimeters of\nplane and geometric figures\n• Handling of measuring\ninstruments\n\n• Group\ndiscussion\n• Practical Lab\n• Demonstration\n• Written\nexamination\n• Third party report\n• Demonstration\nwith oral\nquestioning\n2 Hours\n\n--- PDF PAGE 122 ---\nCarpentry NC III Revision 01 Promulgated (10/29/2018)\n118\nUnit of Competency\nLearning Outcomes\nLearning Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n5. Maintain tools and\nequipment\n5.1 Check condition of tools\nand equipment\n\n• Maintaining tools and\nequipment\n• Handling of tools and\nequipment\n• Identifying tools and\nequipment defects\n• Lecture-\ndemonstration\n• Group\ndiscussion\n• Demonstration\nwith oral\nquestioning\n\n1 Hour\n\n5.2 Perform basic\npreventive maintenance\n• Handling of tools and\nequipment\n• Performing preventive\nmaintenance\n\n• Simulation\n• Group\ndiscussion\n• Practical Lab\n• Demonstration\n\n• Written\nexamination\n• Third party report\n• Demonstration\nwith oral\nquestioning\n2 Hours\n\n5.3 Store tools and\nequipment\n• Storing tools and equipment\n• Handling of tools and\nequipment\n• Demonstration\n• Group\ndiscussion\n• Pr