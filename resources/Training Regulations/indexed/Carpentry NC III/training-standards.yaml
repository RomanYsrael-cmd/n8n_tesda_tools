ets, 1/8” x 3/8”\n3 pcs\n\nFibercement boards, 4.5mm x 4’ x 8’\n250 pcs\nHardiedrive screw, 20mm\n1 pail\n\nHardieputty, 5kgs\n\n1 set\n\nAll-purpose epoxy A&B, 300ml\n1 roll\n\nMesh tape, 250’\n\n--- PDF PAGE 138 ---\nCarpentry NC III Revision 01 Promulgated (10/29/2018)\n134\nMATERIALS\nQTY\nDESCRIPTION\n2 pcs\n\nDrill bit, 1/8”\n\n2pcs\n\nFibercement vented eaves, 4.5mm x 0.60m x 1.20m\n2 pcs each\n\nPVC eaves vent, metal eaves vent / wooden eaves vent\n30 pcs\nWood screw, 1-1/4“\n\nFOR FIBERCEMENT/GYSUM PARTITION/CLADDING\nMATERIALS\nQTY\nDESCRIPTION\n7 pcs\n\nMetal Studs, 0.60mm x 75mm x 3.0m\n3pcs\n\nMetal Tracks, 0.60mm x 75mm x 3.0m\n0.25 kgs\nConcrete Nail, 1”\n\n100 pcs\nBlind Rivets, 1/8” x 3/8”\n\n3 pcs\n\nFibercement boards, 6mm x 4’ x 8’\n3 pcs\n\nGypsum Board, 1/2” x 4’ x 8’\n200 pcs\nHardiedrive screw, 20mm\n200 pcs\n\nBlack screw, pointed, 1”\n1 pail\n\nHardieputty, 5kgs\n\n1 pc\nDrill bit, 1/8”\n\n--- PDF PAGE 139 ---\nCarpentry NC III Revision 01 Promulgated (10/29/2018)\n135\n\nFOR LAMINATE FLOORING\nMATERIALS\nQTY\nDESCRIPTION\n3 sq.m\n\nLaminate floor, 225mm x 900mm\n4 LM\nPE Foam Insulation, 3mm x 1.0m\n1 tb\n\nLaminate Floor Sealant, 300ml\n0.5kg\n\nWhite glue\n\n4 pcs\nRubber molding, 2”x8’\n\n FOR PARQUET FLOORING\nMATERIALS\nQTY\nDESCRIPTION\n3 sq.m\n\nParquet floor\n\n3 sq.m\n\nFlooring adhesive\n\n3 kgs\n\nFlooring adhesive\n\n1 pc.\nSander disc\n\nPERSONAL PROTECTIVE EQUIPMENT (PPE)\nQTY\nDESCRIPTION\nOne per trainee\nSafety shoes/ rubber boots (Trainee to provide)\nOne per trainee\nProper uniform/clothing (Trainee to provide)\nOne per trainee\nGloves (cotton) (Trainee to provide)\nOne per trainee\nSafety goggles (Trainee to provide)\n25 pcs.\nReflectorized vest\n\n--- PDF PAGE 140 ---\nCarpentry NC III Revision 01 Promulgated (10/29/2018)\n136\n\n3.5 TRAINING FACILITIES\n\nThe carpentry workshop must be of concrete structure. Based on class size\nof 25 students/trainees the space requirements for the teaching/learning and\ncirculation areas are as follows:\n\nSpace Requirement\nSize in Meters\nArea in\nSq. Meters\nPractical Training Area\n15 x 18\n270\nLibrary\n4 x 5\n20\nLecture Room\n8 x 6\n\n48\nTool Room/Storage\n4 x 5\n20\n\nWash room/Toilet\n\n4 x 5\n20\nCirculation area\n10 x 6\n\n60\nTOTAL AREA\n\n438\n\n--- PDF PAGE 141 ---\nCarpentry NC III Revision 01 Promulgated (10/29/2018)\n137\n\n3.6 TRAINERS’ QUALIFICATION\n\n• Holder of National TVET Trainer Certificate Level I (NTTC Level I) in\nCARPENTRY NC III\n• Must have completed the 40-Hour Construction Safety Training Course\n(COSH) per Department Order No. 13 s. 1998, Guidelines Governing\nOccupational Safety and Health in the Construction Industry conducted\nby OSHC and DOLE accredited Safety Training Organizations\n• Must have at least three (3) years industry experience in Civil works\nand one (1) year teaching experience in Carpentry\n\n3.7 INSTITUTIONAL ASSESSMENT\n\nInstitutional assessment is undertaken by trainees to determine their\nachievement of units of competency. A certificate of achievement is\nissued for each unit of Competency.\n\n--- PDF PAGE 142 ---\nCarpentry NC III Revision 01 Promulgated (10/29/2018)\n138"
