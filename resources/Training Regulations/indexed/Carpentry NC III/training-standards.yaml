ling techniques\n- Techniques in checking documents\n- Techniques in editing and formatting\n- Proof reading techniques\n• Use different techniques in checking\ndocuments\n• Edit and format information applying\ndifferent techniques\n• Proof read information applying\ndifferent techniques\n• Lecture\n• Group\nDiscussion\n• Self-paced\nhandout/\nmodule\n• Hands on\n• Demonstration\n• Oral evaluation\n• Written Test\n• Observation\n• Presentation\n2 Hours\n7. Evaluate\nOccupational\nSafety And\nHealth Work\nPractices\n7.1 Interpret\nOccupational\nSafety and\nHealth practices\n\n• Discuss the OSH standards, principles\nand legislations\n• Identify OSH work practices issues\n• Discuss standard safety requirements\n•\nLecture\n•\nGroup\nDiscussion\n\n•\nWritten Exam\n•\nDemonstration\n•\nObservation\n•\nInterviews /\nQuestioning\n2.5 Hours\n\n7.2 Set OSH work\ntargets\n• Discussion in actions plans that are\nnecessary in achieving the OSH target\n•\nLecture\n•\nGroup\nDiscussion\n\n•\nWritten Exam\n•\nDemonstration\n•\nObservation\n•\nInterviews /\nQuestioning\n1 Hour\n\n7.3 Evaluate\neffectiveness of\nOccupational\nSafety and\nHealth work\ninstructions\n• Practice evaluating safety data\n(Historical or Simulated)\n•\nLecture\n•\nGroup\nDiscussion\n\n•\nWritten Exam\n•\nDemonstration\n•\nObservation\n•\nInterviews /\nQuestioning\n1.5 Hours\n8. Evaluate\nEnvironmental\n8.1 Interpret\nenvironmental\npractices,\n• Discussion Environmental Issues\nregarding\n- Water Quality\n• Lecture\n• Group\nDiscussion\n•\nWritten Exam\n•\nDemonstration\n•\nObservation\n1 Hour\n\n--- PDF PAGE 118 ---\nCarpentry NC III Revision 01 Promulgated (10/29/2018)\n114\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\nWork\nPractices\npolicies and\nprocedures\n- National and Local Government\nIssues\n- Safety\n- Endangered Species\n- Noise\n- Air Quality\n- Historic\n- Waste\n- Cultural\n• Updating of existing occupation\npractices\