e\n•\nLevelling and cleaning of\nfloor surface\n•\nPracticing 3R and 5S\n• Lecture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nwith oral\nquestioning\n\n2 hours\n\n5.3 Layout laminate floor\nstarter\n•\nReading and understanding\nsketches and working\ndrawings\n•\nMeasuring and marking\ndimensions\n•\nChecking accuracy of\nmeasurements and\nmarkings\n•\nPracticing 5S\n• Lecture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nwith oral\nquestioning\n\n10 hours\n\n5.4 Place laminate floors\n\n•\nLaying of insulation\n•\nPlacing laminate floors and\naccessories\n•\nChecking squareness,\nlevelness and alignment\n•\nPracticing 3R and 5S\n• Lecture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nwith oral\nquestioning\n\n16 hours\n\n--- PDF PAGE 129 ---\nCarpentry NC III Revision 01 Promulgated (10/29/2018)\n125\nUnit of Competency\nLearning Outcomes\nLearning Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n\n5.5 Perform housekeeping\n•\nImplementing 3R and 5S\n\n• Lecture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nwith oral\nquestioning\n\n1 hour\n\n6.Install parquet floors\n6.1 Prepare materials and\ntools\n\n•\nReceiving and handling\nmaterials and tools at\nworkplace\n•\nIdentifying, checking and\ninspecting materials and\ntools\n•\nPracticing 3R and 5S\n• Lecture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nwith oral\nquestioning\n\n1 hour\n\n6.2 Prepare surface\n\n•\nIdentifying and selecting of\nmaterials to use for\npreparation of surface\n•\nLevelling and cleaning of\nfloor surface\n•\nPracticing 3R and 5S\n• Lecture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nwith oral\nquestioning\n\n2 hours\n\n6.3 Layout parquet\npattern/design\n•\nReading and understanding\nsketches and working\ndrawings\n•\nMeasuring and marking\ndimensions\n•\nChecking accuracy of\nmeasurements and\nmarkings\n•\nPracticing 5S\n• Lecture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nwith oral\nquestioning\n\n10 hours\n\n--- PDF PAGE 130 ---\nCarpentry NC III Revision 01 Promulgated (10/29/2018)\n126\nUnit of Competency\nLearning Outcomes\nLearning Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n\n6.4 Place parquet\n\n•\nApplying adhesive\n•\nLaying and fixing parquet\n•\nChecking squareness,\nlevelness and alignment\n•\nPracticing 3R and 5S\n• Lecture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nwith oral\nquestioning\n\n16 hours\n\n6.5 Perform\n housekeeping\n•\nImplementing 3R and 5S\n\n• Lecture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nwith oral\nquestioning\n\n1 hour\n\n--- PDF PAGE 131 ---\nCarpentry NC III Revision 01 Promulgated (10/29/2018) 127\n\n3.2\nTRAINING DELIVERY\n\n1. The delivery of training shall adhere to the design of the curriculum.\nDelivery shall be guided by the principles of competency-based TVET.\n\na. Course design is based on competency standards set by the industry\nor recognized industry sector; (Learning system is driven by\ncompetencies written to industry standards)\n\nb. Training delivery is learner-centered and should accommodate\nindividualized and self-paced learning strategies;\n\nc. Training can be done on an actual workplace setting, simulation of a\nworkplace and/or through adoption of modern technology.\n\nd. Assessment is based in the collection of evidence of the performance\nof work to the industry required standards;\n\ne. Assessment of competency takes the trainee’s knowledge and attitude\ninto account but requires evidence of actual performance of the\ncompetency as the primary source of evidence.\n\nf. Training program allows for recognition of prior learning (RPL) or\ncurrent competencies;\n\ng. Training completion is based on satisfactory completion of all specified\ncompetencies not on the specified nominal duration of learning.\n\n2. The competency-based TVET system recognizes various types of\ndelivery modes, both on-and off-the-job as long as the learning is driven\nby the competency standards specified by the industry. The following\ntraining modalities and their variations/components may be adopted\nsingly or in combination with other modalities when designing and\ndelivering training programs:\n\n2.1 Institution- Based:\n\n• Dual Training System (DTS)/Dualized Training Program (DTP)\nwhich contain both in-school and in-industry training or fieldwork\ncomponents. Details can be referred to the Implementing Rules\nand Regulations of the DTS Law and the TESDA Guidelines on\nthe DTP;\n\n• Distance learning is a formal education process in which majority\nof the instruction occurs when the students and instructor are not\nin\nthe\nsame\nplace.\nDistance\nlearning\nmay\nemploy\n\n--- PDF PAGE 132 ---\nCarpentry NC III Revision 01 Promulgated (10/29/2018)\n128\ncorrespondence study, audio, video, computer technologies or\nother modern technology that can be used to facilitate learning\nand formal and non-formal training. Specific guidelines on this\nmode shall be issued by the TESDA Secretariat.\n\n• The classroom-based or in-center instruction uses of learner-\ncentered methods as well as laboratory or field-work\ncomponents.\n\n2.2 Enterprise-Based:\n\n• Formal Apprenticeship – Training within employment involving a\ncontract between an apprentice and an enterprise on an\napproved apprenticeable occupation.\n\n• Informal Apprenticeship - is based on a training (and working)\nagreement between an apprentice and a master craftsperson\nwherein the agreement may be written or oral and the master\ncraftsperson commits to training the apprentice in all the skills\nrelevant to his or her trade over a significant period of time,\nusually between one and four years, while the apprentice\ncommits to contributing productively to the work of the business.\nTraining is integrated into the production process and apprentices\nlearn by working alongside the experienced craftsperson.\n\n• Enterprise-based Training- where training is implemented within\nthe company in accordance with the requirements of the specific\ncompany. Specific guidelines on this mode shall be issued by\nthe TESDA Secretariat.\n\n2.3 Community-Based – Community-Based – short term programs\nconducted by non-government organizations (NGOs), LGUs,\ntraining centers and other TVET providers which are intended to\naddress the specific needs of a community. Such programs can be\nconducted in informal settings such as barangay hall, basketball\ncourts, etc. These programs can also be mobile training program\n(MTP).\n\n--- PDF PAGE 133 ---\nCarpentry NC III Revision 01 Promulgated (10/29/2018)\n129\n4.3 TRAINEE ENTRY REQUIREMENTS\n\nTrainees or students who wish to enter this training should possess the\nfollowing requirements:\n\n• A Holder of National Certificate Level I in Civil Works or at least\nJunior High School Level Completer or an Alternative Learning\nSystem (ALS) Certificate of Completion with grade 10 equivalent\nholder\n• Must have one (1) year experience in metal furring installation or in\nCarpentry\n• Can communicate both orally and in writing\n• Can perform basic mathematical computation and mensuration\n\n--- PDF PAGE 134 ---\nCarpentry NC III Revision 01 Promulgated (10/29/2018)\n130\n4.4 LIST OF TOOLS, EQUIPMENT AND MATERIALS\n\nList of tools, equipment and materials for the training of a maximum of 25\ntrainees for CARPENTRY NC III are as follows:\n\nA. (Full Qualification)\n\nTOOLS\nQTY\nDESCRIPTION\n10 pcs\nHack saw\n5 pcs\nCutter, medium\n5 pcs\nScoring knife\n10 pcs\nClaw hammer, 16 oz\n10 pcs\nChalk line box\n25 pcs\nPen Marker/ Pencil/Chalk stone\n25 pcs\nPull-push rule (5 meters)\n10 pcs\nSteel square/Carpenter’s square/ Steel square\n10 pcs\nTri- square\n10 pcs\nLevel bar (36 in.)\n5 pcs each\nScrew driver (flat and Philips)\n10 pcs\nTool belt\n10 pc