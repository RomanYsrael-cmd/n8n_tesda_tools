      "source_text": "GLOSSARY OF TERMS"
    },
    {
      "source_text": "1."
    },
    {
      "source_text": "Scaffolds any temporary elevated platform (supported or suspended) and its supporting structure (including points of anchorage), used for supporting workers or materials or both"
    },
    {
      "source_text": "2."
    },
    {
      "source_text": "Platform A raised level surface on which people or things can stand"
    },
    {
      "source_text": "3. Molding Is a strip of material with various profiles used to cover transitions between surfaces or for decoration purposes"
    },
    {
      "source_text": "4. Ceiling Panels are boards secured to a ceiling frame either by fastening or laying"
    },
    {
      "source_text": "5. Acoustical ceiling Also called suspended ceiling, this type of ceiling uses inter-locking tee-runners and acoustically- designed panels"
    },
    {
      "source_text": "6. Framing system A framing system that uses metal furrings and accessories or a grid of inter-locking tee-runners and accessories"
    },
    {
      "source_text": "7. Hangers A wire, strap, or rod attached to an overhead structure, used to support the framework of a suspended ceiling"
    },
    {
      "source_text": "8. Scaffolds and Components any temporary elevated platform including lateral and diagonal support, access and anchorage used for supporting workers or materials or both"
    },
    {
      "source_text": "9. Eaves or soffits frames The framework that surrounds and supports the entire eave or soffit system"
    },
    {
      "source_text": "10. Vents assembly Vents assembly includes a vent structure having a mounting portion securing the vent structure over the opening in an eaves or soffits"
    },
    {
      "source_text": "11. Hazards An agent which has the potential to cause harm"
    },
    {
      "source_text": "12. Surface Pertains to the area where the laminate floors will be laid"
    },
    {
      "source_text": "13. Leveling compound A chemical mixture used to smooth uneven concrete or wooden floors"
    },
    {
      "source_text": "14. Insulation Serves as cushion or underlayment for the laminate flooring"
    },
    {
      "source_text": "-- PDF PAGE 148 --- Carpentry NC III Revision 01 Promulgated (10/29/2018) 144"
    },
    {
      "source_text": "15. Laminate floor Is a multi-layer synthetic flooring product fused together with a lamination process. It simulates wood (or sometimes stone) with a photographic applique layer under a clear protective layer. The inner core layer is usually composed of melamine resin and fiber board materials"
    },
    {
      "source_text": "16."
    },
    {
      "source_text": "17."
    },
    {
      "source_text": "Parquet"
    },
    {
      "source_text": "Computer literate"
    },
    {
      "source_text": "is a geometric mosaic of wood pieces used for decorative effect in flooring"
    },
    {
      "source_text": "This term is usually used to describe the most basic knowledge and skills needed to operate software products such as an operating system, a software application, or an automated Web design tool."
    },
    {
      "source_text": "18."
    },
    {
      "source_text": "5S The five in a 5S workplace organizational and housekeeping methodology refers to five steps – sort, set in order, shine, standardize and sustain."
    },
    {
      "source_text": "19. 3Rs The principle of reducing waste, reusing and recycling resources and products"
    },
    {
      "source_text": "Reduce The waste management concept of reducing what is produced and what is consumed"
    },
    {
      "source_text": "Reuse"
    },
    {
