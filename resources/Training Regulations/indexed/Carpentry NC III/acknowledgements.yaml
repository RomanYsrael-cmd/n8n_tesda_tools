requirements for the basic, common and core units of\ncompetency\nspecifically\nin\nthe\nareas\nof\nmathematics,\nscience/technology,\ncommunication/language and other academic subjects shall be contextualized. To this end,\nTVET providers shall develop a Contextual Learning Matrix (CLM) to accompany their\ncurricula.\n\nCourse Title: CARPENTRY NC III\n\nNominal Training Duration:\n40 Hours Basic Competencies\n24 Hours Common Competencies\n 160 Hours Core Competencies\n Total 224 Hours\n\nCourse Description:\n\nThis course is designed to enhance the knowledge, skill and attitudes of CARPENTRY NC\nIII in accordance with construction industry standards. This covers competencies that a person\nmust achieve in performing tasks such as installing decorative moldings, ceiling frames and panels\nor acoustical ceiling, eaves or soffits frames and panels and vents assembly, partition wall and/or\ncladding frames and boards, laminate floors and parquet floors.\n\nTo complete the course, all units prescribed for this qualification must be achieved:\n\n--- PDF PAGE 106 ---\nCarpentry NC III Revision 01 Promulgated (10/29/2018) 102\n\nBASIC COMPETENCIES\n(40 HOURS)\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n1. Lead workplace\ncommunication\n1.1 Communicate\ninformation\nabout\nworkplace\nprocesses\n• Read\n• Lecture\n• Demonstration\n• Practical\nexercises\n• Role Play\n• Written Test\n• Observation\n2 Hours\no Effective verbal communication\nmethods\no Sources of information\n• Practice organizing information\n• Identify organization requirements for\nwritten and electronic communication\nmethods\n• Follow organization requirements for\nthe use of written and electronic\ncommunication methods\n• Perform exercises on understanding\nand conveying intended meaning\nscenario\n\n1.2 Lead\nworkplace\ndiscussions\n• Describe:\no Organizational policy on production,\nquality and safety\no Goals/ objectives and 