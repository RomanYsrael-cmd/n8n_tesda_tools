\n38\nUNIT OF COMPETENCY :\nFACILITATE ENTREPRENEURIAL SKILLS FOR MICRO-\nSMALL-MEDIUM ENTERPRISES (MSMEs)\n\n UNIT CODE\n:\n400311327\n\nUNIT DESCRIPTOR\n:\nThis unit covers the outcomes required to build, operate and grow\na micro/small-scale enterprise.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Develop and\nmaintain micro-\nsmall-medium\nenterprise\n(MSMEs) skills\nin the\norganization\n1.1 Appropriate business\nstrategies are\ndetermined and set for\nthe enterprise based on\ncurrent and emerging\nbusiness environment.\n1.2 Business operations are\nmonitored and controlled\nfollowing established\nprocedures.\n1.3 Quality assurance\nmeasures are\nimplemented consistently.\n1.4 Good relations are\nmaintained with\nstaff/workers.\n1.5 Policies and procedures\non occupational safety\nand health and\nenvironmental concerns\nare constantly observed.\n1.1 Business models\nand strategies\n1.2 Types and\ncategories of\nbusinesses\n1.3 Business\noperation\n1.4 Basic\nBookkeeping\n1.5 Business\ninternal controls\n1.6 Basic quality\ncontrol and\nassurance\nconcepts\n1.7 Government and\nregulatory\nprocesses\n\n1.1 Basic bookkeeping/\naccounting skills\n1.2 Communication\nskills\n1.3 Building relations\nwith customer and\nemployees\n1.4 Building\ncompetitive\nadvantage of the\nenterprise\n2. Establish and\nmaintain client-\nbase/market\n2.1 Good customer relations\nare maintained\n2.2 New customers and\nmarkets are identified,\nexplored and reached out\nto.\n2.3 Promotions/Incentives are\noffered to loyal customers\n2.4 Additional products and\nservices are evaluated\nand tried where feasible.\n2.5 Promotional/advertising\ninitiatives are carried out\nwhere necessary and\nfeasible.\n\n2.1 Public relations\nconcepts\n2.2 Basic product\npromotion\nstrategies\n2.3 Basic market\nand feasibility\nstudies\n2.4 Basic business\nethics\n2.1 Building customer\nrelations\n2.2 Individual\nmarketing skills\n2.3 Using basic\nadvertising\n(posters/ tarpaulins,\nflyers, social media,\netc.)\n\n--- PDF PAGE 43 ---\nCarpentry NC III Revision 01 Promulgated (10/29/2018)\n39\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n3. Apply budgeting\nand financial\nmanagement\nskills\n3.1 Enterprise is built up and\nsustained through\njudicious control of cash\nflows.\n3.2 Profitability of enterprise\nis ensured though\nappropriate internal\ncontrols.\n3.3 Unnecessary or lower-\npriority expenses and\npurchases are avoided.\n3.1 Cash flow\nmanagement\n3.1 Basic financial\nmanagement\n3.2 Basic financial\naccounting\n3.3 Business internal\ncontrols\n\n3.1 Setting business\npriorities and\nstrategies\n3.2 Interpreting basic\nfinancial statements\n3.3 Preparing business\nplans\n\n--- PDF PAGE 44 ---\nCarpentry NC III Revision 01 Promulgated (10/29/2018)\n40\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Business strategies\nMay include:\n1.1. Developing/Maintaining niche market\n1.2. Use of organic/healthy ingredients\n1.3. Environment-friendly and sustainable practices\n1.4. Offering both affordable and high-quality products and\nservices\n1.5. Promotion and marketing strategies (e. g., on-line\nmarketing)\n2. Business operations\nMay include:\n2.1 Purchasing\n2.2 Accounting/Administrative work\n2.3 Production/Operations/Sales\n3. Internal controls\nMay include:\n3.1 Accounting systems\n3.2 Financial statements/reports\n3.3 Cash management\n4. Promotional/Advertising\ninitiatives\nMay include:\n4.1\nUse of tarpaulins, brochures, and/or flyers\n4.2\n Sales, discounts and easy payment terms\n4.3\nUse of social media/Internet\n4.4\n“Service with a smile”\n4.5\nExtra attention to regular customers\n\n--- PDF PAGE 45 ---\nCarpentry NC III Revision 01 Promulgated (10/29/2018)\n41\nEVIDENCE GUIDE\n\n1. Critical aspects\nof competency\nAssessment requires evidence that the candidate :\n1.1 Demonstrated basic entrepreneurial skills\n1.2 Demonstrated ability to conceptualize and plan a\nmicro/small enterprise\n 1.3 Demonstrated ability to manage/operate a\nmicro/small-scale business\n2. Resource\nImplications\nThe following resources should be provided:\n\n2.1 Simulated or actual workplace\n2.2 Tools, materials and supplies needed to demonstrate\nthe required tasks\n2.3 References and manuals\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through :\n3.1 Written examination\n3.2 Demonstration/observation with oral questioning\n3.3 Portfolio assessment with interview\n3.4 Case problems\n4. Context of\nAssessment\n1.1 Competency may be assessed in workplace or in a\nsimulated workplace setting\n1.2 Assessment shall be observed while tasks are being\nundertaken whether individually or in-group\n\n--- PDF PAGE 46 ---\nCarpentry NC III Revision 01 Promulgated (10/29/2018)\n42\nCOMMON COMPETENCIES\n\nUNIT OF COMPETENCY\n:\nPREPARE CONSTRUCTION MATERIALS AND\nTOOLS\n\nUNIT CODE\n\n:\nCON931201\n\nUNIT DESCRIPTOR\n\n:\nThis unit covers the knowledge, skills and attitudes on\nidentifying, requesting and receiving construction\nmaterials and tools in various workplace settings.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variable\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Identify materials\n\n1.1 Materials are identified\nas per job requirements\n1.2 Quantity and\ndescription of\nmaterials and tools\nconform with the job\nrequirements\n1.3 Tools and accessories\nare identified according\nto job requirements\n1.1 Different work\nspecifications\n1.2 Types and uses\nof carpentry\ntools and\naccessories\n\n1.1 Identifying tools\nand accessories\naccording to the\njob requirements\n\n2. Prepare requisition\nof materials\n\n2.1 Materials and tools\nneeded are requested\naccording to the\nidentified requirements\n2.2 Request is done as per\ncompany standard\noperating procedures\n(SOP)\n2.3 Substitute materials and\ntools are provided\nwithout sacrificing cost\nand quality of work\n2.1 Work\nrequirements\n2.2 Types and uses\nof carpentry\ntools and\naccessories\n2.3 Material take-off\n2.4 Requisition\nprocedures\n2.1 Preparing material\ntake-off\n2.2 Requesting\nmaterials and tools\n\n3. Receive and\ninspect materials\n3.1 Materials and tools\nissued are inspected as\nper quantity and\nspecification\n3.2 Tools, accessories and\nmaterials are checked\n3.3 Materials and tools are\nset aside to appropriate\nlocation\n3.1 Policy on\nreceiving\nmaterial\ndeliveries\n3.2 Material and\ntools quality and\ndefects\n3.3 Material\nhandling\n3.1 Checking and\ninspecting\nmaterials and tools\n3.2 Storing/ stacking\nof tool and\nmaterials\n\n--- PDF PAGE 47 ---\nCarpentry NC III Revision 01 Promulgated (10/29/2018)\n43\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Description of\nmaterials and tools\n\nMay include:\n1.1 Brand name\n1.2 Size\n1.3 Capacity\n1.4 Kind of application\n2. Tools and\naccessories\nMay include:\n2.1 Electrical supplies\n2.2 Mechanical supplies\n2.3 Cleaning supplies\n3. Company standard\noperating\nprocedures\nMay include:\n3.1 Job order\n3.2 Requisition slip\n3.3 Borrower slip\n\n--- PDF PAGE 48 ---\nCarpentry NC III Revision 01 Promulgated (10/29/2018)\n44\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\n\nAssessment requires evidence that the candidate:\n1.1 Listed materials and tools according to quantity and job\nrequirements\n1.2 Requested materials and tools according to the list prepared\nand as per company SOP\n1.3 Inspected issued materials and tools as per quantity and job\nspecifications\n1.4 Provided tools with safety devices\n2. Resource Implications\n\nThe following resources should be provided:\n2.1 Workplace location\n2.2 Materials relevant to the unit of competency\n2.3 Plans, drawings and specifications relevant to the activities\n3. Methods of\nAssessment\n\nCompetency in this unit may be assessed through:\n3.1 Direct observation/Demonstration with oral questioning\n4. Context of\nAssessment\n\n4.1 Competency may be assessed in actual workplace or at the\ndesignated TESDA Accredited Assessment Center\n\n--- PDF PAGE 49 ---\nCarpentry NC III Revision 01 Promulgated (10/29/2018)\n45\nUNIT OF COMPETENCY\n:\nOBSERVE PROCEDURES, SPECIFICATIONS\nAND MANUALS OF INSTRUCTIONS\n\nUNIT CODE\n\n:\nCON311201\n\nUNIT DESCRIPTOR\n\n:\nThis unit covers the knowledge, skills and attitudes on\nidentifying, interpreting, applying services to\nspecifications and manuals and storing manuals.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1. Identify and access\nspecification/\nmanuals\n\n1.1 Appropriate manuals are\nidentified and accessed\nas per job requirements\n1.2 Version and date of\nmanual are checked to\nensure that correct\nspecification and\nprocedures are\nidentified\n1.1 Types of\nmanuals used in\ncarpentry\n1.2 Identification of\nsymbols used in\nthe manuals\n\n1.1 Identifying\nmanuals and\nspecifications\n1.2 Accessing\ninformation and\ndata\n\n2. Interpret manuals\n2.1 Relevant sections,\nchapters of\nspecifications/ manuals\nare located in relation to\nthe work to be\nconducted\n2.2 Information and\nprocedure in the manual\nare interpreted in\naccordance with\nindustry practices\n\n2.1 Types of\nmanuals used in\ncarpentry\n2.2 Types of\nsymbols used in\nmanuals\n2.3 System of\nmeasurements\n2.4 Unit conversion\n2.1 Interpreting\nsymbols and\nspecifications\n2.2 Accessing\ninformation and\ndata\n2.3 Applying\nconversion of units\nof measurements\n\n--- PDF PAGE 50 ---\nCarpentry NC III Revision 01 Promulgated (10/29/2018)\n46\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\n\nREQUIRED SKILLS\n3. Apply information in\nmanual\n3.1 Manual is interpreted\naccording to job\nrequirements\n3.2 Work steps are\ncorrectly identified in\naccordance with\nmanufacturer's\nspecification\n3.3 Manual data are\napplied according to\nthe given task\n3.4 All correct sequencing\nand adjustments are\ninterpreted in\naccordance with\ninformation contained\non the manual or\nspecifications\n3.1 Types of\nmanuals used in\ncarpentry\n3.2 Types and\napplication of\nsymbols in\nmanuals\n3.3 Unit conversion\n3.1 Applying\ninformation from\nmanuals\n\n4. Store manuals\n4.1 Manual or specification\nis stored appropriately\nto prevent damage,\nready access and\nupdating of information\nwhen required in\naccordance with\ncompany requirements\n\n4.1 Types of\nmanuals used in\ncarpentry\n4.2 Manual storing\nand maintaining\nprocedures\n\n4.1 Storing and\nmaintaining\nmanuals\n\n--- PDF PAGE 51 ---\nCarpentry NC III Revision 01 Promulgated (10/29/2018)\n47\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Manual\n\nMay include:\n1.1 Manufacturer's Specification Manual\n1.2 Maintenance Procedure Manual\n1.3 Periodic Maintenance Manual\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\n\nAssessment requires that the candidate:\n1.1 Identified and accessed specification/manuals as per job\nrequirements\n1.2 Interpreted manuals in accordance with industry practices\n1.3 Applied information in manuals according to the given task\n1.4 Stored manuals in accordance with company requirements\n2. Resource\nimplications\nThe following resources should be provided:\n2.1 All manuals/catalogues relative to construction sector\n3. Methods of\nassessment\nCompetency in this unit may be assessed through:\n3.1 Direct observation/Demonstration with Oral Questioning\n4. Context of\nassessment\n4.1 Competency may be assessed in actual workplace or at the\ndesignated TESDA Accredited Assessment Center\n\n--- PDF PAGE 52 ---\nCarpentry NC III Revision 01 Promulgated (10/29/2018)\n48\nUNIT OF COMPETENCY\n:\nINTERPRET TECHNICAL DRAWINGS AND PLANS\n\nUNIT CODE\n\n:\nCON311202\n\nUNIT DESCRIPTOR\n\n:\nThis unit covers the knowledge, skills and attitudes in\nanalyzing and interpreting symbols, data and work plan\nbased on the required performance standards.\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Analyze signs,\nsymbols and data\n\n1.1 Signs, symbols and\ndata are identified\naccording to job\nspecifications\n1.2 Signs, symbols and\ndata are determined\naccording to site\nregulations\n1.1 Signs and\nsymbols\n1.2 Rules and\nregulations\n\n1.1 Interpreting\nworking drawing\n2. Interpret drawings\nand plans\n2.1 Necessary tools and\nmaterials are\nidentified according to\nthe work plan\n2.2 Supplies and materials\nare listed according to\nspecifications\n2.3 Components,\nassemblies or objects\nare recognized as\nrequired\n2.4 Dimensions are\nidentified as\nappropriate to the plan\n2.5 Specification details\nare matched with\nexisting/available\nresources and in line\nwith job requirements\n\n2.1 Systems of\nmeasurement\n2.2 Linear\nmeasurement\n2.3 Dimension\n2.4 Unit conversion\n\n2.1 Interpreting\ndrawing\n2.2 Matching\nspecification\ndetails with\nexisting resources\n\n--- PDF PAGE 53 ---\nCarpentry NC III Revision 01 Promulgated (10/29/2018)\n49\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Signs and\nsymbols\nMay include:\n1.1 Speed limit\n1.2 Direction/Road\n1.3 Warnings\n2. Site regulations\nMay include:\n2.1 Instructions\n2.2 Signages\n2.3 Work schedules\n2.4 Work bulletin boards\n2.5 Charts\n2.6 Memos\n2.7 Site Map\n2.8 Emergency response plan\n2.9 Permits\n3. Tools and\nmaterials\nMay include:\n3.1 Rulers\n3.2 Protractor\n3.3 Steel tape\n3.4 Calculator\n3.5 Pen Marker/ Pencil/Chalk stone\n4. Work plan\n\nMay include:\n4.1 Job requirements\n4.2 Installation instructions\n4.3 Components instruction\n\n--- PDF PAGE 54 ---\nCarpentry NC III Revision 01 Promulgated (10/29/2018)\n50\nEVIDENCE GUIDE\n\n1. Critical aspects\nof competency\n\nAssessment requires that the candidate:\n1.1 Identified and determined signs, symbols and data according to\nwork plan and job requirements\n1.2 Identified tools and materials in accordance with job\nrequirements\n1.3 Demonstrated ability to determine job specifications based on\nworking drawing\n2. Resource\nImplications\nThe following resources should be provided:\n2.4 Workplace\n2.5 Drawings and specification relevant to task\n2.6 Materials and instrument relevant to proposed activity\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1 Direct observation/Demonstration with Oral Questioning\n3.2 Written Examination\n4. Context of\nAssessment\n4.1 Competency may be assessed in actual workplace or at the\ndesignated TESDA Accredited Assessment Center.\n\n--- PDF PAGE 55 ---\nCarpentry NC III Revision 01 Promulgated (10/29/2018)\n51\nUNIT OF COMPETENCY\n:\nPERFORM MENSURATIONS AND CALCULATIONS\n\nUNIT CODE\n\n:\nCON311203\n\nUNIT DESCRIPTOR\n\n:\nThis unit covers the knowledge, skills and attitudes on\nidentifying and measuring objects based on the required\nperformance standards.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variable\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Select measuring\ninstruments\n\n1.1 Object or component to\nbe measured is\nidentified, classified\nand interpreted\naccording to the\nappropriate regular\ngeometric shape\n1.2 Measuring tools are\nselected/identified as\nper object to be\nmeasured or job\nrequirements\n1.3 Correct specifications\nare obtained from\nrelevant sources\n1.4 Measuring\ninstruments are\nselected according to\njob requirements\n1.5 Alternative measuring\ntools are used without\nsacrificing cost and\nquality of work\n\n1.1 Types of\nmeasuring tools\nand its uses\n\n1.1 Selecting\nmeasuring\ninstruments\n\n--- PDF PAGE 56 ---\nCarpentry NC III Revision 01 Promulgated (10/29/2018)\n52\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variable\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n2. Carry out\nmeasurements and\ncalculations\n\n2.1 Measurements are\nobtained according to\njob requirements\n2.2 Alternative measuring\ntools are used without\nsacrificing cost and\nquality of work\n2.3 Calculations needed to\ncomplete work tasks are\nperformed using the\nfour basic process of\naddition (+), subtraction\n(-), multiplication (x) and\ndivision (/)\n2.4 Calculations involving\nfractions, percentages\nand mixed numbers are\nused to complete\nworkplace tasks\n2.5 Numerical computation\nis self-checked and\ncorrected for accuracy\n2.6 Instruments are read to\nthe limit of accuracy of\nthe tool\n2.7 Systems of\nmeasurement identified\nand converted\naccording to job\nrequirements/ISO\n2.8 Workpieces are\nmeasured according to\njob requirements\n\n2.1 Linear\nmeasurement\n2.2 Geometrical\nmeasurement\n2.3 Unit conversion\n2.4 Ratio and\nproportion\n2.5 Area\n\n2.1 Interpreting\nformulas for\nvolume, areas,\nperimeters of\nplane and\ngeometric figures\n2.2 Handling of\nmeasuring\ninstruments\n\n--- PDF PAGE 57 ---\nCarpentry NC III Revision 01 Promulgated (10/29/2018)\n53\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Geometric shape\n\n May include:\n1.1 Round\n1.2 Square\n1.3 Rectangular\n1.4 Triangle\n1.5 Sphere\n1.6 Conical\n2. Measuring\n instruments\nMay include:\n2.1 Micrometer (In-out, depth)\n2.2 Vernier caliper (out, inside)\n2.3 Thickness gauge\n2.4 Torque gauge\n2.5 Small hole gauge\n2.6 Try-square\n2.7 Protractor\n2.8 Steel ruler\n2.9 Voltmeter\n2.10 Ammeter\n2.11 Gauges\n2.12 Thermometers\n3. Measurements\nand calculations\nMay include:\n3.1 Linear\n3.2 Volume\n3.3 Area\n3.4 Wattage\n3.5 Voltage\n3.6 Amperage\n3.7 Inside diameter\n3.8 Length\n3.9 Thickness\n3.10 Outside diameter\n3.11 Density\n\n--- PDF PAGE 58 ---\nCarpentry NC III Revision 01 Promulgated (10/29/2018)\n54\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires that the candidate:\n1.1 Selected and prepared appropriate measuring instruments\nin accordance with job requirements\n1.2 Performed measurements and calculations according to job\nrequirements/ ISO\n2. Resource\nimplications\nThe following resources should be provided:\n2.1 Workplace location\n2.2 Problems to solve\n2.3 Measuring instrument appropriate to carry out tasks\n2.4 Instructional materials relevant to the propose activity\n3. Methods of\nassessment\nCompetency in this unit may be assessed through:\n3.1 Direct observation/Demonstration with Oral Questioning\n4. Context of\nassessment\n 4.1 Competency may be assessed in actual workplace or at the\ndesignated TESDA Accredited Assessment Center\n\n--- PDF PAGE 59 ---\nCarpentry NC III Revision 01 Promulgated (10/29/2018)\n55\n\nUNIT OF COMPETENCY\n:\n MAINTAIN TOOLS AND EQUIPMENT\n\nUNIT CODE\n\n:\nCON311204\n\nUNIT DESCRIPTOR\n\n:\nThis unit covers the knowledge, skills and attitudes on\nchecking condition, performing preventive maintenance\nand storing of construction painting tools and\nequipment.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Check condition of\ntools and\nequipment\n\n1.1 Materials, tools and\nequipment are\nidentified according to\nclassification and job\nrequirements\n1.2 Non-functional tools\nand equipment are\nsegregated and labeled\naccording to\nclassification\n1.3 Safety of tools and\nequipment are\nobserved in\naccordance with\nmanufacturer's\ninstructions\n1.4 Condition of Personal\nProtective Equipment\n(PPE) are checked in\naccordance with\nmanufacturer's\ninstructions\n\n1.1 Use of PPE\n1.2 Handling of tools\nand equipment\n1.3 Good\nhousekeeping\n1.4 Types and uses\nof lubricants\n1.5 Types and uses\nof cleaning\nmaterials\n\n1.1 Maintaining\ntools and\nequipment\n1.2 Handling of\ntools and\nequipment\n1.3 Identifying\ntools and\nequipment\ndefects\n\n--- PDF PAGE 60 ---\nCarpentry NC III Revision 01 Promulgated (10/29/2018)\n56\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n2. Perform basic\npreventive\nmaintenance\n2.1 Appropriate lubricants\nare identified according\nto types of equipment\n2.2 Tools and equipment\nare lubricated\naccording to\npreventive\nmaintenance schedule\nor manufacturer's\nspecifications\n2.3 Measuring instruments\nare checked and\ncalibrated in\naccordance with\nmanufacturer’s\ninstructions\n2.4 Tools are cleaned and\nlubricated according to\nstandard procedures\n2.5 Defective instruments,\nequipment and\naccessories are\ninspected and replaced\naccording to\nmanufacturer’s\nspecifications\n2.6 Tools are inspected,\nrepaired and replaced\nafter use\n2.7 Work place is cleaned\nand kept in safe state\nin line with\nOccupational Safety\nand Health (OSHS)\n\n2.1 Use of PPE\n2.2 Handling of tools\nand equipment\n2.3 Good\nhousekeeping\n2.4 Types and uses\nof lubricants\n2.5 Types and uses\nof cleaning\nmaterials\n2.6 Methods and\ntechniques\n2.7 Procedures\n\n2.1 Handling of\ntools and\nequipment\n2.2 Performing\npreventive\nmaintenance\n\n--- PDF PAGE 61 ---\nCarpentry NC III Revision 01 Promulgated (10/29/2018)\n57\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n3. Store tools and\nequipment\n\n3.1 Inventory of tools,\ninstruments and\nequipment are\nconducted and\nrecorded as per\ncompany practices\n3.2 Tools and equipment\nare stored safely in\nappropriate locations in\naccordance with\nmanufacturer's\nspecifications or\ncompany procedures\n\n3.1 Use of PPE\n3.2 Handling of tools\nand equipment\n3.3 Storing\nprocedures and\ntechniques\n3.4 Storage\nconditions/\nlocations\n\n3.1 Storing tools\nand equipment\n3.2 Handling of\ntools and\nequipment\n\n--- PDF PAGE 62 ---\nCarpentry NC III Revision 01 Promulgated (10/29/2018)\n58\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Materials\nMay include:\n1.1 Lubricants\n1.2 Cleaning materials\n1.3 Rust remover\n1.4 Rugs\n1.5 Spare parts\n2. Tools and equipment\n\nMay include:\n2.1 Tools\nCutting tools - hacksaw, crosscut saw\nBoring tools - brace, hand drill\nHolding tools - vise grip, C-clamp, bench vise\nThreading tools - die and stock, taps\n2.2 Measuring instruments/equipment\n3. Personal Protective\nEquipment (PPE)\nMay include:\n3.1 Goggles\n3.2 Gloves\n3.3 Safety shoes\n3.4 Hard hat\n3.5 Reflectorized Vest\n\n--- PDF PAGE 63 ---\nCarpentry NC III Revision 01 Promulgated (10/29/2018)\n59\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires that the candidate:\n1.1 Selected and used appropriate processes, tools and\nequipment to carry out task\n1.2 Identified functional and non-functional tools and equipment\n1.3 Checked, lubricated and calibrated tools, equipment and\ninstruments according to manufacturer’s specifications\n1.4 Replaced defective tools, equipment and their accessories\n1.5 Observed and applied safe handling of tools and equipment\nand safety work practices\n1.6 Prepared and submitted inventory report, where applicable\n1.7 Maintained workplace in accordance with OSHA regulations\n1.8 Stored tools and equipment safely in appropriate locations\nand in accordance with company practices\n2. Resource\nimplications\nThe following resources should be provided:\n2.1 Workplace\n2.2 Maintenance schedule\n2.3 Maintenance materials, tools and equipment relevant to the\nproposed activity/task\n3. Methods of\nassessment\nCompetency in this unit may be assessed through:\n3.1 Direct observation/Demonstration with Oral Questioning\n3.2 Written Examination\n4. Context of\nassessment\n4.1 Competency may be assessed in actual workplace or at the\ndesignated TESDA Accredited Assessment Center.\n\n--- PDF PAGE 64 ---\nCarpentry NC III Revision 01 Promulgated (10/29/2018)\n60\nCORE COMPETENCIES\n\nUNIT OF COMPETENCY\n:\nINSTALL DECORATIVE MOLDINGS\n\nUNIT CODE\n\n:\nCON711309\n\nUNIT DESCRIPTOR :\nThis unit covers the knowledge, skills, and attitudes in\nthe installation of different kinds and types of mo