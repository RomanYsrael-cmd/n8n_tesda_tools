n\n100 pcs\nBlind Rivets, 1/8” x 3/8”\n\n3 pcs\n\nFibercement boards, 6mm x 4’ x 8’\n3 pcs\n\nGypsum Board, 1/2” x 4’ x 8’\n200 pcs\nHardiedrive screw, 20mm\n200 pcs\n\nBlack screw, pointed, 1”\n1 pail\n\nHardieputty, 5kgs\n\n1 pc\nDrill bit, 1/8”\n\n--- PDF PAGE 139 ---\nCarpentry NC III Revision 01 Promulgated (10/29/2018)\n135\n\nFOR LAMINATE FLOORING\nMATERIALS\nQTY\nDESCRIPTION\n3 sq.m\n\nLaminate floor, 225mm x 900mm\n4 LM\nPE Foam Insulation, 3mm x 1.0m\n1 tb\n\nLaminate Floor Sealant, 300ml\n0.5kg\n\nWhite glue\n\n4 pcs\nRubber molding, 2”x8’\n\n FOR PARQUET FLOORING\nMATERIALS\nQTY\nDESCRIPTION\n3 sq.m\n\nParquet floor\n\n3 sq.m\n\nFlooring adhesive\n\n3 kgs\n\nFlooring adhesive\n\n1 pc.\nSander disc\n\nPERSONAL PROTECTIVE EQUIPMENT (PPE)\nQTY\nDESCRIPTION\nOne per trainee\nSafety shoes/ rubber boots (Trainee to provide)\nOne per trainee\nProper uniform/clothing (Trainee to provide)\nOne per trainee\nGloves (cotton) (Trainee to provide)\nOne per trainee\nSafety goggles (Trainee to provide)\n25 pcs.\nReflectorized vest\n\n--- PDF PAGE 140 ---\nCarpentry NC III Revision 01 Promulgated (10/29/2018)\n136\n\n3.5 TRAINING FACILITIES\n\nThe carpentry workshop must be of concrete structure. Based on class size\nof 25 students/trainees the space requirements for the teaching/learning and\ncirculation areas are as follows:\n\nSpace Requirement\nSize in Meters\nArea in\nSq. Meters\nPractical Training Area\n15 x 18\n270\nLibrary\n4 x 5\n20\nLecture Room\n8 x 6\n\n48\nTool Room/Storage\n4 x 5\n20\n\nWash room/Toilet\n\n4 x 5\n20\nCirculation area\n10 x 6\n\n60\nTOTAL AREA\n\n438\n\n--- PDF PAGE 141 ---\nCarpentry NC III Revision 01 Promulgated (10/29/2018)\n137\n\n3.6 TRAINERS’ QUALIFICATION\n\n• Holder of National TVET Trainer Certificate Level I (NTTC Level I) in\nCARPENTRY NC III\n• Must have completed the 40-Hour Construction Safety Training Course\n(COSH) per Department Order No. 13 s. 1998, Guidelines Governing\nOccupational Safety and Health in the Construction Industry conducted\nby OSHC and DOLE accredited Safety Training Organizations\n• Must have at least three (3) years industry experience in Civil works\nand one (1) year teaching experience in Carpentry\n\n3.7 INSTITUTIONAL ASSESSMENT\n\nInstitutional assessment is undertaken by trainees to determine their\nachievement of units of competency. A certificate of achievement is\nissued for each unit of Competency.\n\n--- PDF PAGE 142 ---\nCarpentry NC III Revision 01 Promulgated (10/29/2018)\n138\nSECTION 4 ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\nCompetency Assessment is the process of collecting evidence and making\njudgments whether competency has been achieved. The purpose of assessment is\nto confirm that an individual can perform to the standards expected at the workplace\nas expressed in relevant competency standards.\n\nThe assessment process is based on evidence or information gathered to\nprove achievement of competencies. The process may be applied to a full\nqualification or employable unit(s) of competency in partial fulfillment of the\nrequirements of the national qualification.\n\n4.1\nNATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1.1 A National Certificate (NC) is issued when a candidate has\ndemonstrated competence in all unit/s of competency of a qualification\nwith a promulgated Training Regulations.\n\n4.1.2 Individuals wanting to be certified will have to be assessed in\naccordance with the requirements identified in the evidence guide of\nthe relevant unit/s of competency.\n\n4.1.3 Holders of valid National Certificate (NC) Carpentry NC III will have to\nundergo assessment in the amended Training Regulations for\nCarpentry NC III.\n\n4.1.4 Recognition of Prior Learning (RPL). Candidates who have gained\ncompetencies through informal training, previous work or life\nexperiences may apply for recognition in a particular qualification\nthrough competency assessment.\n\n4.1.5 The\nindustry\nshall\ndetermine\nassessment\nand\ncertification\nrequirements for each qualification with promulgated Training\nRegulations: It includes the following:\n\na. entry requirements for candidates\nb. evidence gathering methods\nc. qualification requirements of competency assessors\nd. specific assessment and certification arrangements as identified by\nindustry\n\n--- PDF PAGE 143 ---\nCarpentry NC III Revision 01 Promulgated (10/29/2018)\n139\n\n4.2\nCompetency Assessment Requisite\n\n4.2.1 Self-Assessment Guide. The self-assessment guide (SAG) is\naccomplished by the candidate prior to actual competency\nassessment. SAG is a pre-assessment tool to help the candidate\nand the assessor determine what evidence is available, where gaps\nexist, including readiness for assessment.\n\nThis document can:\na) Identify the candidate’s skills and knowledge\nb) Highlight gaps in candidate’s skills and knowledge\nc) Provide critical guidance to the assessor and candidate on the\nevidence that need to be presented\nd) Assist the candidate to identify key areas in which practice is\nneeded or additional information or skills that should be gained\nprior\n\n4.2.2 Accredited Assessment Center. Only Assessment Center\naccredited by TESDA is authorized to conduct competency\nassessment. Assessment centers undergo a quality assured\nprocedure for accreditation before they are authorized by TESDA to\nmanage the assessment for National Certification.\n\n4.2.3 Accredited Competency Assessor. Only accredited competency\nassessor is authorized to conduct assessment of competence.\nCompetency assessors undergo a quality assured system of\naccreditation procedure before they are authorized by TESDA to\nassess the competencies of candidates for National Certification.\n\n--- PDF PAGE 144 ---\nCarpentry NC III Revision 01 Promulgated (10/29/2018)\n140\n\nANNEX A\n\nReceive and\nrespond to\nworkplace\ncommunication\nWork with\nothers\nSolve/address\nroutine\nproblems\nEnhance\nself-\nmanagement\nskills\nSupport\nInnovation\nAccess and\nmaintain\ninformation\nFollow\noccupational\nsafety and\nhealth\npolicies and\nprocedures\nApply\nenvironmental\nwork standards\nAdopt\nentrepreneurial\nmindset in the\nworkplace\nParticipate in\nworkplace\ncommunication\nWork in\nTeam\nEnvironment\nSolve/address\ngeneral\nworkplace\nproblems\nDevelop\ncareer and\nlife decisions\nContribute to\nworkplace\ninnovation\nPresent\nrelevant\ninformation\nPractice\noccupational\nsafety and\nhealth\npolicies and\nprocedures\nExercise\nefficient and\neffective\nsustainable\npractices in the\nworkplace\nPractice\nentrepreneurial\nskills in the\nworkplace\nLead\nworkplace\ncommunication\nLead small\nteams\nApply critical\nthinking and\nproblem-\nsolving\ntechniques\nin the\nworkplace\n\nWork in a\ndiverse\nenvironment\nPropose\nmethods of\napplying\nlearning and\ninnovation\nin the\norganization\nUse\ninformation\nsystematically\nEvaluate\noccupational\nsafety and\nhealth work\npractices\n\nEvaluate\nenvironmental\nwork\npractices\n\nFacilitate\nentrepreneurial\nskills for\nmicro-small-\nmedium\nenterprises\n(MSMEs)\n\nCOMPETENCY MAP - CONSTRUCTION Sector\n(Civil Works)\n CARPENTRY NC III\n\nBASIC COMPETENCIES\n\n--- PDF PAGE 145 ---\nCarpentry NC III Revision 01 Promulgated (10/29/2018)\n141\n\nUtilize\nspecialize\nspecialized\ncommunication\nskill\nDevelop\nand lead\nteams\nPerform higher\norder thinking\nprocesses and\napply\ntechniques in\nthe workplace\nContribute\nto the\npractice of\nsocial\njustice in the\nworkplace\nManage\ninnovative\nwork\ninstructions\nManage and\nevaluate\nusage of\ninformation\nLead in\nimprovement of\nOccupational\nSafety and Health\nProgram, Policies\nand Procedures\nLead towards\nimprovement of\nenvironmental\nwork programs,\npolicies and\nprocedures\nSustain\nentrepreneurial\nskills\nManage and\nsustain\neffective\ncommunication\nstrategies\nManage\nand sustain\nhigh\nperforming\nteams\nEvaluate higher\norder thinking\nskills and adjust\nproblem solving\ntechniques\nAdvocate\nstrategic\nthinking for\nglobal\ncitizenship\nIncorporate\ninnovation\ninto work\nprocedures\nDevelop\nsystems in\nmanaging,\nand\nmaintaining\ninformation\nManage\nimplementation of\nOSH programs in\nthe workplace\nManage\nimplementation\nof\nenvironmental\nprogram in the\nworkplace\nDevelop and\nsustain a high-\nperforming\nenterprise\n\nPrepare\nconstruction\nmaterials and\ntools\n\nObserve\nprocedures,\nspecifications\nand manual of\ninstructions\n\nInterpret\ntechnical\ndrawings and\nplans\nPerform\nmensurations\nand\ncalculations\n\nMaintain tools\nand\nequipment\n\nCOMMON COMPETENCIES\n\nBASIC COMPETENCIES\n\n--- PDF PAGE 146 ---\nCarpentry NC III Revision 01 Promulgated (10/29/2018)\n142\nPrepare masonry\nmaterials\n\nPerform masonry tools\nand equipment\n\nPerform basic\nmasonry works\n\nLay concrete hollow\nblock for structure\nPlaster wall surface\nPerform basic tile\nsetting\nPerform straight-to-\nfinish floor concreting\nRectify non-\nconforming concrete\nand masonry surfaces\nLay tiles on plain and\ncurved surfaces for\nwalls, floors and other\napplication\nRepair of tiles on plain\nand curved surfaces\nLayout reference lines\n\nFabricate, install and\nremove wooden\nformworks\n\nInstall wooden door\njamb, window frame\nand panels\n\nInstall ceiling and wall\nframes and panels\n\nFabricate and install\nwooden stairs\n\nInstall wooden floor\nsupports and panels\n\nFabricate and install\nroofing system\n\nFabricate and install\nwooden cabinet\n\nInstall decorative\nmoldings\n\nInstall ceiling frames\nand panels or\nacoustical ceiling\n\nInstall eaves or\nsoffits frames and\npanels and vents\nassembly\nInstall partition wall\nand/or cladding\nframes and boards\n\nInstall laminate\nfloors\n\nInstall parquet floors\n\nErect and dismantle\nsupport type scaffold\n\nHandle, segregate and\nstack scaffolding\ncomponents\n\nCORE COMPETENCIES\n\n--- PDF PAGE 147 ---\nCarpentry NC III Revision 01 Promulgated (10/29/2018) 143\n\nGLOSSARY OF TERMS\n\n1.\n\nScaffolds\nany temporary elevated platform (supported or\nsuspended) and its supporting structure\n(including points of anchorage), used for\nsupporting workers or materials or both\n\n2.\n\nPlatform\nA raised level surface on which people or things\ncan stand\n\n3.\nMolding\nIs a strip of material with various profiles used to\ncover transitions between surfaces or for\ndecoration purposes\n\n4.\nCeiling Panels\nare boards secured to a ceiling frame either by\nfastening or laying\n\n5.\nAcoustical ceiling\nAlso called suspended ceiling, this type of ceiling\nuses inter-locking tee-runners and acoustically-\ndesigned panels\n\n6.\nFraming system\nA framing system that uses metal furrings and\naccessories or a grid of inter-locking tee-runners\nand accessories\n\n7.\nHangers\nA wire, strap, or rod attached to an overhead\nstructure, used to support the framework of a\nsuspended ceiling\n\n8.\nScaffolds and\nComponents\nany temporary elevated platform including lateral\nand diagonal support, access and anchorage\nused for supporting workers or materials or both\n\n9.\nEaves or soffits frames\nThe framework that surrounds and supports the\nentire eave or soffit system\n\n10. Vents assembly\nVents assembly includes a vent structure having\na mounting portion securing the vent structure\nover the opening in an eaves or soffits\n\n 11.\nHazards\nAn agent which has the potential to cause harm\n\n 12.\nSurface\nPertains to the area where the laminate floors\nwill be laid\n\n 13.\nLeveling compound\nA chemical mixture used to smooth uneven\nconcrete or wooden floors\n\n 14.\nInsulation\nServes as cushion or underlayment for the\nlaminate flooring\n\n--- PDF PAGE 148 ---\nCarpentry NC III Revision 01 Promulgated (10/29/2018) 144\n\n 15.\nLaminate floor\nIs a multi-layer synthetic flooring product fused\ntogether with a lamination process. It simulates\nwood (or sometimes stone) with a photographic\napplique layer under a clear protective layer.\nThe inner core layer is usually composed of\nmelamine resin and fiber board materials\n\n 16.\n\n 17.\n\nParquet\n\nComputer literate\n\nis a geometric mosaic of wood pieces used for\ndecorative effect in flooring\n\nThis term is usually used to describe the most\nbasic knowledge and skills needed to operate\nsoftware products such as an operating system,\na software application, or an automated Web\ndesign tool.\n\n 18.\n\n5S\nThe five in a 5S workplace organizational and\nhousekeeping methodology refers to five steps –\nsort, set in order, shine, standardize and sustain.\n\n 19.\n3Rs\nThe principle of reducing waste, reusing and\nrecycling resources and products\n\n Reduce\nThe waste management concept of reducing\nwhat is produced and what is consumed\n\n Reuse\n\nThe waste management concept of reusing\nitems, or re-purposing them for a use different\nthan what they are intended for\n\n Recycling\n\nThe waste management concept of transforming\nagain into a raw material that can be shaped into\na new item\n\n--- PDF PAGE 149 ---\nCarpentry NC III Revision 01 Promulgated (10/29/2018) 145\n\nTRAINING REGULATIONS (TR)\nDOCUMENT REVISION HISTORY\n\nQualification Title:\nCARPENTRY NC III\nQualification Code:\nCONCAR318\n\nRevision\nNo.\nDocument\nTypes*\nQualification Title\nTESDA Board\nResolution No./\nDate\nDeployment\n(TESDA Circular/\nImplementing\nGuidelines)\n00\nDocument Created\n\nCarpentry NC III\n2005-03 /\n03/18/05\nN/A\n01\nDocument Amended\n\nCarpentry NC III\n2018-35 /\n10/29/18\nNo. 011 series\nof 2019\n\nLegend: *Description Types\n- Document Created\n- Document Amended\n\n--- PDF PAGE 150 ---\nCarpentry NC III Revision 01 Promulgated (10/29/2018) 146\n\nACKNOWLEDGMENTS\n\nThe Technical Education and Skills Development Authority (TESDA) wishes to\nextend thanks and appreciation to the many representatives of business, industry,\nacademe and government agencies who donated their time and expertise to the\ndevelopment and validation of these Training Regulations.\n\nTECHNICAL EXPERTS REVIEW PANEL\n\nMARCELO R. ABAD\