      "source_text": "1.1 Seven habits of highly effective people. 1.2 Character strengths that foster innovation and learning (Christopher Peterson and Martin Seligman, 2004) 1.3 Five minds of the future concepts (Gardner, 2007). 1.4 Adaptation concepts in neuroscience (Merzenich, 2013). 1.5 Transtheoretical model of behavior change (Prochaska, DiClemente, & Norcross, 1992)."
