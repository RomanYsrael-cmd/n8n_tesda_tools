    "source_text": "SECTION 3\nTRAINING STANDARDS\n\nThese standards are set to provide technical and vocational education and\ntraining (TVET) providers with information and other important requirements to\nconsider when designing training programs for Heavy Equipment Operations.\n\n3.1 CURRICULUM DESIGN\n\nCourse Title: HEAVY EQUIPMENT OPERATION (GANTRY CRANE)\nNC Level: NCII\n\nCourse Description:\n\n This course is designed to equip individual with the basic, common and\ncore competencies in operating Heavy Equipment Operation (Gantry Crane)\nNC II.\n\nTo obtain this, all units prescribed for this qualification must be achieved:\n\nBASIC COMPETENCIES\n(18 Hours)\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and convey\nworkplace information.\n1.2 Complete relevant work\nrelated documents.\n1.3 Participate in workplace\nmeeting and discussion.\n•\nGroup\ndiscussion\n•\nInteraction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n2. Work in a team\nenvironment\n2.1 Describe and identify team\nrole and responsibility in a\nteam.\n2.2 Describe work as a team\nmember.\n•\nDiscussion\n•\nInteraction\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n3. Practice career\nprofessionalism\n3.1 Integrate personal objectives\nwith organizational goals.\n3.2 Set and meet work priorities.\n3.3 Maintain professional growth\nand development.\n•\nDiscussion\n•\nInteraction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n4. Practice\noccupational\nhealth and\nsafety\n4.1 Evaluate hazard and risks\n4.2 Control hazards and risks\n4.3 Maintain occupational health\nand safety awareness\n•\nDiscussion\n•\nPlant tour\n•\nSymposium\n• Observation\n• Interview\n\n--- PDF PAGE 51 ---\nTR HEAVY EQUIPMENT OPERATION\n\nCOMMON COMPETENCIES\n(24 Hours)\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Interpret\ntechnical\ndrawings and\nplans\n\n1.1 Read / Interpret blueprints\n and plans\n1.2 Perform freehand\nsketching\nLecture\nDemonstration\nPractical\nexercises\n\nDemonstration\nand oral\nquestioning\nWritten test\n\n2. Observe\nprocedures,\nspecifications\nand manuals of\ninstructions.\n2.1 Identify and access\n specifications / technical\n manuals\n2.2 Interpret technical\nmanuals\n2.3 Apply information in\ntechnical manual\n2.4 Store technical manual\nLecture\nDemonstration\nPractical\nexercises\nDemonstration\nand oral\nquestioning\nWritten test\n\n3. Perform\n mensurations\n and calculations\n\n3.1 Select measuring\n instruments\n3.2 Carryout measurement and\n calculations\nLecture\nDemonstration\nPractical\nexercises\nDemonstration\nand oral\nquestioning\nWritten test\n4. Maintain tools\nand equipment\n4.1 Check condition of tools\n and equipment\n4.2 Perform preventive\n maintenance\n4.3 Store tools and equipment\nLecture\nDemonstration\nPractical\nexercises\nDemonstration\nand oral\nquestioning\nWritten test\n\n5. Prepare\nconstruction\nmaterials and\ntools\n5.1 Identify Materials\n5.2 Request Materials\n5.3 Receive and inspect\nmaterials\nAudio Visual\nSimulation\nDiscussion\nPractical\nExercise\nDemonstration\nDirect\nobservation\nQuestions or\ninterview\nPortfolio\n(credentials)\nWritten / Oral\nTest\nDemonstration\n\n--- PDF PAGE 52 ---\nTR HEAVY EQUIPMENT OPERATION\n\nCORE COMPETENCIES\n(64 hours)\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Perform gantry\ncrane pre- and\npost operation\nprocedure\n1.1 Identify types of Gantry\ncrane and its components\nand structure\n1.2 Perform visual check of\nequipment\n1.3 Check Gantry Crane\nsystems functions\n1.1 Perform post-operation\n procedures\n• Lecture\n• Practical /\nDemonstration\n\n• Observation/\nDemonstration\nwith interview\n• Written test\n\n2. Perform Gantry\nCrane\nequipment\noperation\n2.1 Perform pre-loading\noperation\n2.2 Perform Gantry Crane\noperations\n• Lecture\n• Practical /\nDemonstration\n\n• Observation/\nDemonstration\nwith interview\n• Written test\n\n--- PDF PAGE 53 ---\nTR HEAVY EQUIPMENT OPERATION\n\n3.2\nTRAINING DELIVERY\n\nThe delivery of training should adhere to the design of the curriculum.\nDelivery should be guided by the 10 basic principles of competency-based TVET.\n\n• The training is based on curriculum developed from the\ncompetency standards;\n• Learning is modular in its structure;\n• Training delivery is individualized and self-paced;\n• Training is based on work that must be performed;\n• Training materials are directly related to the competency standards\nand the curriculum modules;\n• Assessment is based in the collection of evidence of the\nperformance of work to the industry required standard;\n• Training is based both on and off-the-job components;\n• Allows for recognition of prior learning (RPL) or current\ncompetencies;\n• Training allows for multiple entry and exit; and\n• Approved training programs are nationally accredited.\n\nThe competency-based TVET system recognizes various types of\ndelivery modes, both on and off-the-job as long as the learning is driven by the\ncompetency standards specified by the industry. The following training modalities\nmay be adopted when designing training programs:\n\n• The dualized mode of training delivery is preferred and\nrecommended. Thus programs would contain both in-school and\nin-industry training or fieldwork components. Details can be\nreferred to the Dual Training System (DTS) Implementing Rules\nand Regulations.\n\n• Modular/self-paced learning is a competency-based training\nmodality wherein the trainee is allowed to progress at his own\npace. The trainer facilitates the training delivery\n\n• Peer teaching/mentoring is a training modality wherein fast\nlearners are given the opportunity to assist the slow learners.\n\n• Supervised industry training or on-the-job training is an approach\nin training designed to enhance the knowledge and skills of the\ntrainee through actual experience in the workplace to acquire\nspecific competencies prescribed in the training regulations.\n\n--- PDF PAGE 54 ---\nTR HEAVY EQUIPMENT OPERATION\n\n• Distance learning is a formal education process in which majority of\nthe instruction occurs when the students and instructor are not in\nthe same place. Distance learning may employ correspondence\nstudy, or audio, video or computer technologies.\n\n3.3\nTRAINEE ENTRY REQUIREMENTS\n\nTrainees or students wishing to gain entry in any of these courses should\npossess the following requirements:\n\n• High school graduate\n• Knowledge in basic automotive\n• Can communicate both oral and written;\n• Physically and mentally fit;\n• Good moral character; and\n• Can perform basic mathematical computation\n\n--- PDF PAGE 55 ---\nTR HEAVY EQUIPMENT OPERATION\n\n3.4\nLIST OF TOOLS, EQUIPMENT AND MATERIALS\n\nBelow is the recommended list of tools, equipment and materials for the\ntraining of 25 trainees for the operation of Gantry Crane.\n\nTOOLS\nEQUIPMENT\nMATERIALS\nQTY.\nITEM\nQTY.\nITEM\nQTY.\nITEM\n1 set\n• Wrenches (box\n and open-end\n 8-24 mm-\n metric & 7/16 –\n 1” -English )\n1 unit\n• Gantry(MOA /\nrental)\n5 kilos\n• Multi-purpose\ngrease\n1 set • Hammer, ball peen\n(3-4 lbs)\n\n2 cans\n• Penetrating oil\n(250 ml)\n1 set\n• Pliers (mechanical\n10“)\n2 kilos\n• Cotton rugs\n1 pc\n\n• Adjustable wrench\n(18“)\n\n5 liters\n• Cleaning solvent\n1 pc\n• Grease gun\n\n1 set\n• Cleaning tool\n(one each kind)\n1 set\n• Screw driver (10 “\nflat & Philips)\n\n1 pair\n• Working Clothes\n1 pc\n• Putty knife\n\n10 pairs\n• Safety shoes\n1 pc\n• Pry bar (heavy\nduty)\n\n10 pairs\n• Gloves\n1 pc\n•Pipe wrench (12”)\n\n10 pcs\n•Goggles\n1 pc\n• Vise grip (12 “)\n\n10 pcs\n• Dust Mask\n\n10 pcs\n•Hard hats\n\n1 pc\n• Operator’s\nmanual\n\n25\npackats\n• (Hand cleaning)\nSoap\n\nNOTE: Implementation of the training program can be made possible through a MOA between the\ntraining school and industry\n\n--- PDF PAGE 56 ---\nTR HEAVY EQUIPMENT OPERATION\n\n3.5\nTRAINING FACILITIES\n\nThe Gantry Crane operation workshop must be made of reinforced\nconcrete or steel structure. The size must be suited on the requirements of the\ncompetencies. The class size of 25 students/trainees is reserved for the lecture\nroom and the practical demonstration area. Most of the learning activities are\nperformed individually in the students/trainees work area.\n\nSPACE REQUIREMENT\nSIZE IN\nMETERS\nAREA IN SQ.\nMETERS\nTOTAL AREA\nIN SQ.\nMETERS\n• Student/Trainee’s Working\nSpace\n 2.0 x 2.0 m.\n4 sq.m per student\n100.0 sq.m.\n•\nLecture Room\n8.00 x 6.00\n48.00\n48.0\n•\nLearning Resource Center\n4.00 x 6.00\n24.00\n24.0\n172\n• Facilities/Equipment/\nCirculation Area\n-\n-\n52\nTOTAL WORK AREA\n-\n224\nWorking field\n0.5 hectare (MOA/Rental)\n\n3.6\nTRAINER’S QUALIFICATIONS\n HEAVY EQUIPMENT OPERATION (GANTRY CRANE)\n\n• Must be a holder of Heavy Equipment Operation (Gantry\nCrane) NC II\n• Must have undergone training on Training Methodology II (TM\nII)\n• Must be physically and mentally fit\n• *Must have at least 5 years job/industry experience*\n• Must be a civil service eligible (for government position or\nappropriate professional license issued by the Professional\nRegulatory Commission)\n\n * Optional. Only when required by the hiring institution\n\nReference: TESDA Board Resolution No. 2004 03\n\n--- PDF PAGE 57 ---\nTR HEAVY EQUIPMENT OPERATION"
