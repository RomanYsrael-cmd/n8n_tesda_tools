          "source_text": "1. Perform visual check of \nequipment \n \n \n \n1.1 Materials handling equipment is selected based on job \nrequirements. \n1.2 OS parts in container stacker are checked in accordance \nwith equipment checklist and manufacturer's procedures.  \n1.3 Walk-around check is performed with equipment \nchecklist. \n1.4 Lifting gears of gantry crane are inspected for safe \nusage.  \n2. Perform \"BLOWAF\" \ncheck  \n \n \n \n \n \n2.1 BLOWAF check for container stacker is performed \nfollowing checklist form and with engine stopped / not \nrunning. \n2.2 Fluid levels in container stacker are maintained in \naccordance with equipment maintenance manual.  \n2.3 Abnormal conditions in container stacker are noted and \nreported to authorized person.\n\n--- PDF PAGE 39 ---\nTR HEAVY EQUIPMENT OPERATION                                                                            \n \n \n3. Perform operation \ncheck  \n3.1 Operation / starting running check is performed \nfollowing checklist and in accordance with manufacturer's \nrecommendations. \n3.2 Brake, steering and controls for container stacker and \nsafety devices for materials handling equipment are \nchecked for normal functioning as per manufacturer's \nspecifications.  \n3.3 Walk-around check is performed with equipment checklist \nand with engine running.  \n3.4 Abnormal conditions are noted in checklist and reported to \nauthorized personnel. \n4. Perform post-operation \nchecking procedures \n4.1 Materials handling equipment is turned off and container \nstacker is parked after productive operation in accordance \nwith company rules and regulations \n4.2 Equipment controls are set into neutral position and \nparking brakes for container stacker and safety locks are \nengaged according to manufacturer's operation manual \n4.3 Walk-around inspection is re-conducted while engine is \ncooling down. \n4.4 Daily equipment time record / report is accomplished / \nsubmitted according to company rules and regulations.\n\n--- PDF PAGE 40 ---\nTR HEAVY EQUIPMENT OPERATION                                                                            \n \nRANGE OF VARIABLES \nVARIABLE \nRANGE \n1. Materials handling \nequipment  \n1.1 Gantry crane  \n       1.1.1 Stationary \n       1.1.2 Mobile  \n                1.1.2.1 Wheel type \n                1.1.2.2 Steel type \n1.2 Container stacker \n        1.2.1 Type \n                 1.2.1.1 Top loader \n                 1.2.1.2 Reach stacker \n        1.2.2 Lifting capacity  \n                 1.2.2.1  30 tons to 42 tons \n2. OS parts  \n \n \n \n \n \n2.1 Air cleaner  \n2.2 Battery terminals / connection  \n2.3 Belts  \n2.4 Tire inflation  \n2.5 Grease / lube points  \n2.6 Fuel water separation  \n3. Walk-around check \nMaterials handling equipment  \n3.1 Worn-out / damaged parts \n3.2 Loose / missing parts and accessories \n3.3 Warning and safety devices  \n \nGantry crane  \n3.4 Base foundation \n3.5 Communication system \n3.6 Hook block assembly and cables \n3.7 Automatic locking mechanism  \n \nContainer stacker \n3.8 Leaks \n3.9 Fluid levels \n3.10 Wire rope cable and pulleys \n3.11 Gauges and controls \n3.12 Oil and leaks \n3.13 Working equipment function  \n4. Lifting gears \n4.1 Sheaves \n4.2 Hook and latch\n\n--- PDF PAGE 41 ---\nTR HEAVY EQUIPMENT OPERATION                                                                            \n \n5. BLOWAF check  \n \n \n \n \n \n5.1 Battery (starting and charging system)  \n5.2 Light (lighting system)  \n5.3 Oil (lubricating system) \n5.4 Water (cooling system)  \n5.5 Air (intake and exhaust system)  \n5.6 Fuel (fuel system)  \n        \n6. Fluid levels  \n6.1 Battery electrolyte  \n6.2 Engine oil  \n6.3 Hydraulic oil  \n6.4 Radiator coolant  \n6.5 Transmission / gear oil  \n6.6 Brake / clutch  \n6.7 Steering oil  \n6.8 Windshield wiper reservoir \n7. Authorized person \n7.1 Equipment supervisor \n7.2 Maintenance personnel  \n7.3 Equipment dispatcher / foreman\n\n-