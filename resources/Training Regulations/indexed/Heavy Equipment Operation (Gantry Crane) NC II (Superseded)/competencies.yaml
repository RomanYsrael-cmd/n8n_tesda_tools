        "source_title": "PERFORM MENSURATIONS AND CALCULATIONS",
        "source_text": "--- PDF PAGE 28 ---\nTR HEAVY EQUIPMENT OPERATION                                                                            \n \n \n6. Context of assessment \n6.1 Competency assessment may occur in the workplace or in \nany appropriate simulated environment \n6.2 Assessment shall be observed while task are being \nundertaken whether individually or in group \n6.3 Competency assessment must be undertaken in \naccordance with the endorsed TESDA assessment \nguidelines \n \n \n \n \n \n \n \n \n \n \n \n \nUNIT OF COMPETENCY:\nPERFORM MENSURATIONS AND CALCULATIONS \nUNIT CODE                     :\nCON311203\nUNIT DESCRIPTOR        : This unit covers the knowledge, skills and attitudes on \nidentifying and measuring objects based on the required \nperformance standards. \n \nELEMENT \nPERFORMANCE CRITERIA \nBold and italicized terms are elaborated in the \n Range of Variable \n1.  Select measuring \ninstruments \n \n \n1.1 Object or component to be measured is  identified, \nclassified and interpreted according to the appropriate \nregular geometric shape  \n1.2  Measuring tools are selected/identified as per object to be \nmeasured or job requirements \n1.3  Correct specifications are obtained from relevant sources \n1.4  Appropriate measuring instruments are selected according \nto job requirements   \n1.5  Alternative measuring tools are used without   \n       sacrificing cost and quality of work \n2.  Carry out \nmeasurements and \ncalculations \n \n2.1  Accurate measurements are obtained according to job \nrequirements \n2.2  Alternative measuring tools are used without sacrificing  \n       cost and quality of work \n2.3  Calculation needed to complete work tasks are performed\n\n--- PDF PAGE 29 ---\nTR HEAVY EQUIPMENT OPERATION                                                                            \n \nusing the four basic process of addition (+), subtraction (-), \nmultiplication (x) and division (/) including but not limited to: \ntrigonometric functions, algebraic computations \n2.4  Calculations involving fractions, percentages and mixed \nnumbers are used to complete workplace tasks \n2.5  Numerical computation is self-checked and corrected for \naccuracy \n2.6  Instruments are read to the limit of accuracy of the tool \n2.7  Systems of measurement identified and converted \naccording to job requirements/ISO \n2.8  Workpieces are measured according to job requirements \n \n \n \n \n \n \n \n \nRANGE OF VARIABLES \nVARIABLE \nRANGE \n1.  Geometric shape \n \n \n \n \n \nIncluding but is not limited to: \n1.1  Round \n1.2  Square \n1.3  Rectangular \n1.4  Triangle \n1.5  Sphere \n1.6  Conical \n2.  Measuring instruments \nIncluding but not limited to: \n2.1  Micrometer (In-out, depth) \n2.2  Vernier caliper (out, inside) \n2.3  Dial gauge with mag, std. \n2.4  Straight edge \n2.5  Thickness gauge \n2.6  Torque gauge \n2.7  Small hole gauge \n2.8  Telescopic gauge \n2.9  Try-square \n2.10 Protractor \n2.11 Combination gauge \n2.12 Steel rule \n2.13 Voltmeter \n2.14 Ammeter \n2.15 Mega-ohmeter \n2.16 Kilowatt hour meter\n\n--- PDF PAGE 30 ---\nTR HEAVY EQUIPMENT OPERATION                                                                            \n \n2.17 Gauges \n2.18 Thermometers \n3.  Measurements and \ncalculations \n \n3.1  Linear \n3.2  Volume \n3.3  Area \n3.4  Wattage \n3.5  Voltage \n3.6  Resistance \n3.7  Amperage \n3.8  Frequency \n3.9  Impedance \n \n \n \n \n \n \nVARIABLE \nRANGE \n \n \n3.10  Conductance \n3.11  Capacitance \n3.12  Displacement \n3.16  Inside diameter \n3.17  Circumference \n3.18  Length \n3.19  Thickness \n3.20  Outside diameter  \n3.21  Taper \n3.22  Out of roundness \n3.23  Oil clearance \n3.24  End play/Thrust clearance\n\n--- PDF PAGE 31 ---\nTR HEAVY EQUIPMENT OPERATION                                                                            \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \nEVIDENCE GUIDE \n1.  Critical aspects \n     of competency \nAssessment requires that the candidate: \n1.1  Selected and prepared appropriate measuring instruments \nin accordance with job requirements \n1.2  Performed measurements and calculations according to job \nrequirements/ ISO \n2.   Underpinning \nknowledge \n \n \n \n \n \nTRADE MATHEMATICS / MENSURATION \n2.1  Four fundamental operation \n2.2  Linear measurement \n2.3  Dimensions \n2.4  Unit conversion \n2.5  Ratio and proportion \n2.6  Trigonometric functions \n2.8  Algebraic equations \n3.   Underpinning skills \n3.1  Performing calculation by addition, subtraction, \nmultiplication and division; trigonometric functions and \nalgebraic equations \n3.2  Visualizing objects and shapes \n3.3  Interpreting formulas for volume, areas, perimeters of plane \nand geometric figures \n3.4  Proper handling of measuring instruments \n4.   Resource implications \nThe following resources should be provided: \n4.1  Workplace location \n4.2  Problems to solve\n",
