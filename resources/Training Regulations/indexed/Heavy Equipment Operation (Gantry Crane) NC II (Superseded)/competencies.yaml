        "source_title": "PERFORM PRODUCTIVE OPERATION FOR GANTRY CRANE",
        "source_text": "--- PDF PAGE 47 ---\nTR HEAVY EQUIPMENT OPERATION                                                                            \n \nUNIT OF \nCOMPETENCY:\nPERFORM PRODUCTIVE OPERATION FOR GANTRY \nCRANE \nUNIT CODE:\nCON833330\nUNIT DESCRIPTOR: \nThis unit covers the knowledge, skills and attitudes in \nperforming equipment standard operating procedures for a \nGantry Crane. It covers the skills required to position the crane, \ninterpret load chart and perform lifting and transferring of heavy \nloads.\n \n \nELEMENT \nPERFORMANCE CRITERIA  \nBold and Italicized terms are elaborated in the  \nRange of Variables \n \n1. Perform pre-loading \noperation  \n       \n \n \n \n \n \n \n1.1 Work instruction is secured from appropriate personnel \n1.2 Work instruction is interpreted according to job requirements \n1.3 Assistance from ground crew is sought in line  \n      with job requirements, if necessary \n1.4 Communication signal is selected and used in line with job \nrequirements  \n1.5 Unexpected situations are responded in line with company \nrules and regulations and in a manner that minimizes risk to \npersonnel and equipment. \n2. Perform load handling \noperation  \n \n \n \n \n \n2.1 Communication signal with ground crew is established and \nmaintained based on job requirements. \n2.2 Gantry crane is positioned in line with job requirements  \n2.3 Lifting and transferring procedures are performed based on \nload / cargoes specification  \n2.4 Unexpected situations are responded to in line with \ncompany safety rules and regulations.\n\n--- PDF PAGE 48 ---\nTR HEAVY EQUIPMENT OPERATION                                                                            \n \n \nRANGE OF VARIABLES \nVARIABLE \nRANGE \n1. Ground crew  \n \n1.1 Rigger  \n1.2 Spotter  \n2.  Communication signal  \nMay include but not limited to: \n2.1 Hand-held radio  \n2.2 Mobile phone  \n2.3 Hand signal  \n2.4 Flashing light \n3. Unexpected situations \nMay include but are not limited to: \n3.1 Oil leakages \n3.2 Fraying of wire rope \n3.3 Lost of power supply \n3.4 Failure of hoist brake \n3.5 Malfunction of control levers/electrical components \n3.6 Derail of track (for rail mounted type) \n3.7 Ground failure \n3.9 Force majeure e.g., earthquake, fire, tornado \n3.10 Sudden sickness/unstable health condition of operator \n4. Load / cargoes \nspecifications  \nMay include but are not limited to: \n4.1 Sign and symbols (e.g. fragile, this side up, etc.) \n4.2 Stacking level \n4.3 Stacking positions/directions \n4.4 Poisonous substance \n4.5 Flammable/Explosives \n4.6 Weather classification\n\n--- PDF PAGE 49 ---\nTR HEAVY EQUIPMENT OPERATION                                                                            \n \nEVIDENCE GUIDE \n1. Critical aspects of \nevidence to be \nconsidered \n \nAssessment requires evidence that the candidate: \n1.1 Demonstrates ability to secure and interpret work \ninstructions based on job requirements  \n1.2 Demonstrates ability to establish and maintain \ncommunication with ground crew  \n1.3 Demonstrates ability to follow company rules and \nregulations  \n1.4 Demonstrates ability to operate Gantry crane following \nestablished / recommended practices  \n2. Underpinning (related) \nknowledge and attitude\n \n2.1 Safe operating procedures and practices. \n2.2 Load / cargoes specifications  \n2.3 Work instructions  \n2.4 Positive work values (time and cost conscious, etc.) \n2.5 Communication signals and applications \n2.6 Company rules and regulations \n \n3. Underpinning skills \n \n3.1 Following safe operating procedures and practices  \n3.2 Interpreting and understanding of load / cargoes \nspecifications  \n3.3 Interpreting work instructions   \n3.4 Applying communication signals  \n3.5 Following company rules and regulations  \n4. Resource implications \n \nThings necessary for the conduct of assessment \n4.1 Access to Gantry crane and job site \n4.2 PPE \n4.3 Ground crew  \n4.4 Loads and cargoes  \n5. Method of assessment \n \nCompetency in this unit must be assessed through  \n5.1 Written/Oral questioning \n5.2 Observation/ demonstration \n5.3 Work record and documents \n5.4 Third party report \n6. Context for \nassessment \n \n6.1  Assessment maybe conducted in the work site or in a \nsimulated venue. \n6.2  Competency shall be assessed while work is being \nundertaken independently\n",
