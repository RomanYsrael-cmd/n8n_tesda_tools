ding  \n11.4 Emergency shut-off switch \n11.5 Beacon lights \n11.6 Lighting arrester \n11.7 Buzzer alarm \n11.8 Safety locks \n \nContainer stacker \n11.9 Twist lock sensor \n11.10 Spreader flipper \n11.11 Warning lights \n11.12 Alcogas detector      \n11.13 Landing sensor\n\n--- PDF PAGE 45 ---\nTR HEAVY EQUIPMENT OPERATION"
