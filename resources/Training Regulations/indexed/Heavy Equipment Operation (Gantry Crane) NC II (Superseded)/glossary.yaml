  "source_text": "For the purpose of this Competency Standard, the words\n\n1. Attachment\nRefers to anything like hook block and other accessories/special\nattachments used instead of the conventional lift block to perform\ndifferent types of lifting jobs.\n2. Gantry crane\nRefers to load handling equipment powered by electric /\nhydrostatic motor and used to lift and transfer cargoes. This\nequipment is commonly found in port operation.\n3. Hoist\nRefers to the mechanism that is used for raising and lowering the\nload.\n4. Safe Working\nLoad (SWL)\nRefers to the maximum allowable load that the crane can lift\nsafely.\n5. Trolleying\nRefers to the movement of the load in and out from the crane\ncenter.\n\n--- PDF PAGE 60 ---\nTR HEAVY EQUIPMENT OPERATION",
