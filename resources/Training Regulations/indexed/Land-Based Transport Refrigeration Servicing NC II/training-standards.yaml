 competencies\nwritten to industry standards)\n\nb. Training\ndelivery\nis\nlearner-centered\nand\nshould\naccommodate\nindividualized and self-paced learning strategies;\n\nc. Training can be done on an actual workplace setting, simulation of a\nworkplace and/or through adoption of modern technology.\n\nd. Assessment is based in the collection of evidence of the performance of\nwork to the industry required standards;\n\ne. Assessment of competency takes the trainee’s knowledge and attitude\ninto account but requires evidence of actual performance of the\ncompetency as the primary source of evidence.\n\nf. Training program allows for recognition of prior learning (RPL) or current\ncompetencies;\n\ng. Training completion is based on satisfactory performance of all specified\ncompetencies.\n\n2. The competency-based TVET system recognizes various types of delivery\nmodes, both on-and off-the-job as long as the learning is driven by the\ncompetency standards specified by the industry. The following training\nmodalities and their variations/components may be adopted singly or in\ncombination with other modalities when designing and delivering training\nprograms:\n\n2.1. Institution- Based:\n\n• Dual Training System (DTS)/Dualized Training Program (DTP)\nwhich contain both in-school and in-industry training or fieldwork\ncomponents. Details can be referred to the Implementing Rules and\nRegulations of the DTS Law and the TESDA Guidelines on the DTP;\n\n• The traditional classroom-based or in-center instruction may be\nenhanced through use of learner-centered methods as well as\nlaboratory or field-work components..\n\n--- PDF PAGE 87 ---\nTR- Land-based Transport Refrigeration Servicing NC II (New) Promulgated December 16, 2015 85\n\n2.2. Enterprise-Based:\n\n• Formal Apprenticeship – Training within employment involving a\ncontract between an apprentice and an enterprise on an approved\napprenticeable occupation.\n\n• Enterprise-based Training- where training is implemented within\nthe company in accordance with the requirements of the specific\ncompany. Specific guidelines on this mode shall be issued by the\nTESDA Secretariat.\n\n3.3\nTRAINEE ENTRY REQUIREMENTS\n\nTrainees or students should possess the following requirements:\n\n• Must have completed at least 10 yrs. basic education or an ALS\ncertificate of achievement with grade 10 equivalent holder\n• Can communicate both oral and written\n• Can perform basic mathematical computation\n\nThis list does not include specific institutional requirements such as\neducational attainment, appropriate work experience, and others that\nmay be required of the trainees by the school or training center\ndelivering the TVET program.\n\n--- PDF PAGE 88 ---\nTR- Land-based Transport Refrigeration Servicing NC II (New) Promulgated December 16, 2015 86\n\n3.4\nLIST OF TOOLS, EQUIPMENT AND MATERIALS\nLAND-BASED TRANSPORT REFRIGERATION SERVICING NC II\n\nRecommended list of tools, equipment and materials for the training of\n25 trainees for Land-based Transport Refrigeration Servicing NC II.\n\nTOOLS\nEQUIPMENT\nMATERIALS\nQTY.\nDescription\nQTY\nDescription\nQty.\nDescription\n6 sets\nSystem Analyzer\n2 units\nRecovery/recycling\nmachine with recovery\ncylinder\n1 pc\n Refrigerant tank/\ncylinder R 404A\n6 sets\nHacksaw\n3 units\nVacuum pump\n5 pcs\nExpansion valve\n6 pcs\nRubber mallet\n2 sets\nNitrogen cylinder w/\nregulator\n1 pc\nRefrigerant tank/\ncylinder R 134a\n3 sets\nOpen end wrench\n1 unit\nRefrigerant identifier\n1 gal\nMineral oil, 3GS, 5GS\n3 sets\nBox wrench\n2 units\nOxyacetylene unit\n1 gal\nSynthetic oil\n3 sets\nAllen wrench\n2 sets\nPressure washer\n1 roll\nCopper tube, 3/8”\n6 pcs\nAdjustable\nwrench, 12”\n4 sets\nCharging cylinder,\nR134a and R404A\n1 roll\nFlexible pipe,\ndischarge line\n6 pcs\nAdjustable\nwrench, 8”\n5 units\nCompressor,\nR134a/R404A\n1 roll\nFlexible pipe, suction\nline\n5 pcs\nBallpen hammer\n1 unit\nPortable welding\nmachine\n10 pcs\nFittings, disch