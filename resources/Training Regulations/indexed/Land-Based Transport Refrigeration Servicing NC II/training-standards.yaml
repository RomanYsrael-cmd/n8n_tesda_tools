      "source_text": "3.1\nCURRICULUM DESIGN\n\nTESDA shall provide the training on the development of competency-based\ncurricula to enable training providers develop their own curricula with the components\nmentioned below.\n\nDelivery of knowledge requirements for the basic, common and core units of\ncompetency\nspecifically\nin\nthe\nareas\nof\nmathematics,\nscience/technology,\ncommunication/language and other academic subjects shall be contextualized. To this\nend, TVET providers shall develop a Contextual Learning Matrix (CLM) to accompany\ntheir curricula.\n\nCourse Title: LAND-BASED TRANSPORT\n\nNC Level: NC II\n\n REFRIGERATION SERVICING\n\nNominal Training Duration: 18 Hours (Basic)\n\n 34 Hours (Common)\n 488 Hours (Core)\n\n-----------------------------------\n\n540 Hour - Total training duration\n\nCourse Description:\n\nThis course is designed to equip individual with operational skills in\ntransport refrigeration servicing which covers the basic and common\ncompetencies in addition to the core competencies such as servicing and\nmaintaining transport refrigeration unit, troubleshooting and repairing transport\nrefrigeration systems as well as performing testing and commissioning for\ntransport refrigeration systems.\n\nTo obtain this, all units prescribed for this qualification must be achieved:\n\n--- PDF PAGE 66 ---\nTR- Land-based Transport Refrigeration Servicing NC II (New) Promulgated December 16, 2015 64\nBASIC COMPETENCIES\n(18 hours)\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and convey\nworkplace\ninformation\n• Describe Organizational policies\n• Group\ndiscussion\n• Oral evaluation\n1 Hour\nRead:\no Effective communication\n• Lecture\n• Written\nexamination\n\no Written communication\n\no Communication procedures and systems\n\n• Identify:\no Different modes of communication\n\no Medium of communication\no Flo