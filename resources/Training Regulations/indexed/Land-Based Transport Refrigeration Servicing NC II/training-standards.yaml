  "source_section_text": "SECTION 3 TRAINING ARRANGEMENTS\n\nThese guidelines are set to provide technical and vocational education and\ntraining (TVET) providers with information and other important requirements to consider\nwhen designing training programs for Land-Based Transport Refrigeration NC II.\n\nThis includes information on curriculum design; training delivery; trainee entry\nrequirements; tools and equipment; training facilities; and trainer’s qualification and\ninstitutional assessment.\n\n3.1\nCURRICULUM DESIGN\n\nTESDA shall provide the training on the development of competency-based\ncurricula to enable training providers develop their own curricula with the components\nmentioned below.\n\nDelivery of knowledge requirements for the basic, common and core units of\ncompetency\nspecifically\nin\nthe\nareas\nof\nmathematics,\nscience/technology,\ncommunication/language and other academic subjects shall be contextualized. To this\nend, TVET providers shall develop a Contextual Learning Matrix (CLM) to accompany\ntheir curricula.\n\nCourse Title: LAND-BASED TRANSPORT\n\nNC Level: NC II\n\n REFRIGERATION SERVICING\n\nNominal Training Duration: 18 Hours (Basic)\n\n 34 Hours (Common)\n 488 Hours (Core)\n\n-----------------------------------\n\n540 Hour - Total training duration\n\nCourse Description:\n\nThis course is designed to equip individual with operational skills in\ntransport refrigeration servicing which covers the basic and common\ncompetencies in addition to the core competencies such as servicing and\nmaintaining transport refrigeration unit, troubleshooting and repairing transport\nrefrigeration systems as well as performing testing and commissioning for\ntransport refrigeration systems.\n\nTo obtain this, all units prescribed for this qualification must be achieved:\n\n--- PDF PAGE 66 ---\nTR- Land-based Transport Refrigeration Servicing NC II (New) Promulgated December 16, 2015 64\nBASIC COMPETENCIES\n(18 hours)\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and convey\nworkplace\ninformation\n• Describe Organizational policies\n• Group\ndiscussion\n• Oral evaluation\n1 Hour\nRead:\no Effective communication\n• Lecture\n• Written\nexamination\n\no Written communication\n\no Communication procedures and systems\n\n• Identify:\no Different modes of communication\n\no Medium of communication\no Flow of communication\n\no Available technology relevant to the\nenterprise and the individual’s work\nresponsibilities\n\n•Prepare different Types of question\n• Demonstration\n• Observation\n\n•Gather different sources of information\n\n• Apply storage system in establishing\nworkplace information\n\n•Demonstrate Telephone courtesy\n\n1.2 Complete relevant\nwork related\ndocuments\n• Describe Communication procedures and\nsystems\n• Group\ndiscussion\n• Oral evaluation\n2 Hours\n\n• Read:\no Meeting protocols\n• Lecture\n• Written\nexamination\n\no Nature of workplace meetings\n\no Workplace interactions\n\no Barriers of communication\n\n--- PDF PAGE 67 ---\nTR- Land-based Transport Refrigeration Servicing NC II (New) Promulgated December 16, 2015 65\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\n• Complete work related documents\n• Demonstration\n• Observation\n\n• Read instructions on work related\nforms/documents\n• Lecture\n• Written\nexamination\n\n• Practice:\n\no Estimate, calculate and record routine\nworkplace measures\n• Demonstration\n• Observation\n\no Basic mathematical processes of addition,\nsubtraction, division and multiplication\n\n• Demonstrate office activities in:\no workplace meetings and discussions\nscenario\n• Role play\n• Oral evaluation\n• Observation\n\n• Perform workplace duties scenario following\nsimple written notices\n\n• Follow simple spoken language\n• Demonstration\n• Observation\n\n• 