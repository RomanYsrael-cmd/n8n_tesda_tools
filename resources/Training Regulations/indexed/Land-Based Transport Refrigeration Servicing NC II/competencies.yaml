          "source_text": "1. Critical aspect of\ncompetencies\nAssessment must show that the candidate:\n\n1.1. selected correct technical drawing in line with\njob requirements\n1.2. correctly identified the objects represented in\nthe drawing\n1.3. identified and interpreted symbols used in the\ndrawing correctly\n1.4. prepared/produced electrical/electronic /RAC\ndrawings including all relevant specifications\n1.5. stored diagrams/equipment\n2. Method of assessment\nCompetency in this unit must be assessed through:\n\n2.1. Practical tasks involving interpretation of a\nrange of technical drawings\n2.2. Oral questioning\n3. Resource implication\n3.1. Drawings\n3.2. Diagrams\n3.3. Charts\n3.4. Plans\n4. Context of Assessment\nAssessment may be conducted in the workplace or in\na simulated environment\n\n--- PDF PAGE 24 ---\n\n--- PDF PAGE 25 ---\nTR- Land-based Transport Refrigeration Servicing NC II (New) Promulgated December 16, 2015 23\nUNIT OF COMPETENCY: OBSERVE PROCEDURES, SPECIFICATIONS AND\n MANUALS OF INSTRUCTION\n\nUNIT CODE\n :"
