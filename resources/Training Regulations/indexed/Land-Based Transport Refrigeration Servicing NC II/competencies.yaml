        "source_text": "HVC713202\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes in\npreparing materials, tools and equipment, lay-outing\ndimensions and performing basic benchwork based\non the required performance standards.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1. Prepare\nmaterials,\ntools and\nequipment\n\n1.1 Work plan is interpreted to\ndetermine job requirements\n1.2 Materials, tools and\nequipment are identified\nand prepared according to\njob requirements\n1.3 Materials are checked\naccording to the required\nspecifications\n1.4 Tools and equipment\nconditions are checked\nfollowing the standard\noperating procedures\n(SOPs)\n• Communication\nskills\n• Materials, tools\nand equipment;\nuses and\nspecifications\n• Material\nestimation\n• Mensuration\n• Interpretation\nskills\n• Handling of tools\nand materials\n2. Lay-out and\nmark\ndimensions/\nfeatures on\nworkplace\n2.1 Metallic and non-metallic\nmaterials are selected\naccording to the\nrequirements specified in the\nblueprint\n2.2 Dimensions/features are\nlaid-out/marked according\nto job\nspecifications/blueprint and\nwithin the required tolerance\n2.3 Dimensions are checked\nagainst the actual work plan\n• Measuring tools;\nfunctions and use\n• Trade\nmathematics\n• Mensuration\n• Calculation\n• Conversion\n• Plan\nspecifications\n• Quality assurance\n• Measuring and\nlay-outing\n• Blueprint reading\n• Communication\nskills\n3. Perform\nrequired\nbasic metal\nworks\n3.1 Work instructions are\nfollowed to ensure work\nsafety\n3.2 Basic metal works are\nperformed applying\nknowledge on safety\nprocedures and according to\njob requirements\n3.3 Workpieces are clamped in\nworkholding device to\navoid damage and\naccidents\n3.4 Work pieces are cut,\nchipped or filed according to\nrequired measurements,\ntolerance specified in the\n• Tools and\nequipment: use\nand specifications\n• Grinding, cutting,\ndrilling, filing\ntechniques\n• Basic welding\nprinciples and\napplication\n• Applied\noccupational\nhealth and safety\n(OH&S)\n• Using tools and\nequipment\n• Basic metal\nworks skills\no Grinding\no Cutting\no Drilling\no Filing\no Threading\no Reaming\no Welding\n• Practice safety\nskills\n\n--- PDF PAGE 32 ---\nTR- Land-based Transport Refrigeration Servicing NC II (New) Promulgated December 16, 2015 30\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\nblueprint and free from burrs\nand sharp edges\n3.5 Drilling is performed\naccording to recommended\nsequence and specifications\n3.6 Proper usage of materials,\ntools and equipment is\nobserved\n3.7 Appropriate PPE and safety\nprocedures are applied\n3.8 Worksite is cleaned and\ncleared of all debris and left\nin safe state in accordance\nwith OHS regulations\n\n--- PDF PAGE 33 ---\nTR- Land-based Transport Refrigeration Servicing NC II (New) Promulgated December 16, 2015 31\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n\n1. Work plan\n\n1.1 Job requirements\n1.2 Schedule of work\n\n2. Materials\n\n2.1 Steel brackets\n2.2 Grinding disc\n2.3 Drill bit\n2.4 Flat/angle bars\n2.5 Fastening screws\n2.6 Masonry\n\n3. Tools and equipment\n\n3.1\nPortable grinder\n3.2\nHacksaw\n3.3\nFile\n3.4\nMarkers\n3.5\nScrew drivers\n3.6\nBallpen hammer\n3.7\nL-square/steel square\n3.8\nSteel rule\n3.9\nMeasuring tools\n3.10 PPE\n3.11 Portable electric drill\n3.12 Bench wire\n3.13 Tri-square\n\n4. Metallic materials\n\n4.1 Mild steel plate\n4.2 Flat bar\n4.3 Square bar\n4.4 Angle bar\n4.5 Round bar\n4.6 G.I. sheet\n4.7 B.I. sheet\n4.8 Beam\n\n--- PDF PAGE 34 ---\nTR- Land-based Transport Refrigeration Servicing NC II (New) Promulgated December 16, 2015 32\nVARIABLE\nRANGE\n\n5. Non-metallic materials\n\n5.1 PVC\n5.2 Rubber\n5.3 Wood\n5.4 Fiber glass\n5.5 Plastic\n5.6 Ceramics\n\n6. Dimensions\n\n6.1 Measurements\n6.2 Tolerances\n\n7. Work instructions\n\n7.1 Work plan\n7.2 Blueprint\n7.3 Manufacturer’s specifications\n\n8. Personal Protective Equipment\n(PPE)\n\n8.1 Safety shoes\n8.2 Gloves\n8.3 Goggles\n\n9. Basic metal works\n\n9.1 Sheet metal\n9.2 Cutting\n9.3 Filing\n9.4 Drilling\n9.5 Arc welding\n9.6 Gas welding\n\n10. Workholding device\n\n10.1 Machine vise\n10.2 Pliers\n10.3 Vise grip\n\n11. Manual\n\n11.1 Procedures manual\n11.2 Instructional manual\n\n--- PDF PAGE 35 ---\nTR- Land-based Transport Refrigeration Servicing NC II (New) Promulgated December 16, 2015 33\n\nEVIDENCE GUIDE\n1. Critical aspects\n of competency\nAssessment requires that the candidate:\n1.1 Interpreted work plan to determine job requirements\n1.2 Identified and prepared supplies, materials, tools and\nequipment in accordance with job requirements\n1.3 Selected and used appropriate processes, tools and\nequipment to carry out task\n1.4 Laid-out and checked dimensions in accordance with job\nrequirements and within the tolerances\n1.5 Followed work instructions to ensure safety\n1.6 Performed benchworks in accordance with job\nrequirements\n1.7 Cleaned worksite and left in safe state in accordance\nwith OHSA regulations\n2. Resource\nimplications\nThe following resources should be provided:\n2.1 Workplace\n2.2 Work plan\n2.3 Materials, tools and equipment relevant to the proposed\nactivity/task\n3. Methods of\nassessment\nCompetency should be assessed through:\n3.1 Actual demonstration\n3.2 Direct observation\n3.3 Written/questioning related to required knowledge\n4. Context of\nassessment\n4.1 Competency assessment may occur in workplace or any\nappropriate simulated environment\n4.2 Assessment shall be observed while task are being\nundertaken whether individually or in group\n4.3 Competency assessment must be undertaken in\naccordance with the endorsed TESDA assessment\nguidelines\n\n--- PDF PAGE 36 ---\nTR- Land-based Transport Refrigeration Servicing NC II (New) Promulgated December 16, 2015 34\n\nUNIT OF COMPETENCY: PERFORM BASIC ELECTRICAL WORKS\n\nUNIT CODE\n :"
