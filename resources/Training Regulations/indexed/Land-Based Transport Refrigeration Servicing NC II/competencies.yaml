        "source_text": "500311106\nUNIT DESCRIPTOR :\nThis unit covers the skills, knowledge and attitudes to\nidentify role and responsibility as a member of a team.\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Describe\nteam role and\nscope\n1.1. The role and objective of the\nteam is identified from\navailable sources of\ninformation\n1.2. Team parameters, reporting\nrelationships and\nresponsibilities are identified\nfrom team discussions and\nappropriate external sources\n• Team roles\n• Definition of\nTeam\n• Difference\nbetween team\nand group\n• Different sources\nof information\n• Objectives and\ngoals of team\n• Describing the\nteam role and\nscope\n\n2. Identify own\nrole and\nresponsibility\nwithin team\n2.1 Individual role and\nresponsibilities within the team\nenvironment are identified\n2.2 Roles and responsibility of\nother team members are\nidentified and recognized\n2.3 Reporting relationships within\nteam and external to team are\nidentified\n• Team structure\n• Roles and\nresponsibility of\nteam members\n• Teams in work\nenvironment\n• Fundamental\nrights at work\nincluding gender\nsensitivity\n• Communicating\nappropriately,\nconsistent with\nthe culture of\nthe workplace\n• Identifying\nindividual role\nand\nresponsibility\n• Identifying\nexternal\nrelationship\n1. Work as a\nteam\nmember\n3.1 Effective and appropriate forms\nof communications used and\ninteractions undertaken with\nteam members who contribute\nto known team activities and\nobjectives\n3.2 Effective and appropriate\ncontributions made to\ncomplement team activities\nand objectives, based on\nindividual skills and\ncompetencies and workplace\ncontext\n3.3 Observed protocols in reporting\nusing standard operating\nprocedures\n3.4 Contribute to the development\nof team work plans based on\nan understanding of team’s\nrole and objectives and\nindividual competencies of the\nmembers\n• Communication\nprocess\n• Group planning\nand decision\nmaking\n• Team goals and\nobjectives\n• Understanding\nindividual\ncompetencies\nrelative to\nteamwork\n• Types of\nindividuals\n• Role of leaders\n• Interacting\neffectively with\nothers\n• Setting team\ngoals and\nexpectations\n\n--- PDF PAGE 9 ---\nTR- Land-based Transport Refrigeration Servicing NC II (New) Promulgated December 16, 2015 Page7\n\nRANGE OF VARIABLES\n\nVARIABLES\nRANGE\n1. Role and objective\nof team\n1.1.\nWork activities in a team environment with\nenterprise or specific sector\n1.2.\nLimited discretion, initiative and judgment maybe\ndemonstrated on the job, either individually or in a\nteam environment\n2. Sources of\ninformation\n2.1.\nStandard operating and/or other workplace\nprocedures\n2.2.\nJob procedures\n2.3.\nMachine/equipment manufacturer’s specifications\nand instructions\n2.4.\nOrganizational or external personnel\n2.5.\nClient/supplier instructions\n2.6.\nQuality standards\n2.7.\nOHS and environmental standards\n3. Workplace context\n3.1.\nWork procedures and practices\n3.2.\nConditions of work environments\n3.3.\nLegislation and industrial agreements\n3.4.\nStandard work practice including the storage, safe\nhandling and disposal of chemicals\n3.5.\nSafety, environmental, housekeeping and quality\nguidelines\n\n--- PDF PAGE 10 ---\nTR- Land-based Transport Refrigeration Servicing NC II (New) Promulgated December 16, 2015 8\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1.\nOperated in a team to complete workplace activity\n1.2.\nWorked effectively with others\n1.3.\nConveyed information in written or oral form\n1.4.\nSelected and used appropriate workplace language\n1.5.\nFollowed designated work plan for the job\n1.6.\nReported outcomes\n2. Resource\nImplications\nThe following resources should be provided:\n2.1.\nAccess to relevant\nworkplace or appropriately\nsimulated environment where assessment can take\nplace\n2.2. Materials relevant to the proposed activity or tasks\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1.\nObservation of the individual member in relation to\nthe work activities of the group\n3.2.\nObservation of simulation and or role play involving\nthe\nparticipation\nof\nindividual\nmember\nto\nthe\nattainment of organizational goal\n3.3. Case studies and scenarios as a basis for discussion\nof issues and strategies in teamwork\n4. Context for\nAssessment\n4.1.\nCompetency may be assessed in workplace or in a\nsimulated workplace setting\n4.2.\nAssessment shall be observed while task are being\nundertaken whether individually or in group\n\n--- PDF PAGE 11 ---\nTR- Land-based Transport Refrigeration Servicing NC II (New) Promulgated December 16, 2015 9\nUNIT OF COMPETENCY: PRACTICE CAREER PROFESSIONALISM\n\nUNIT CODE :"
