        "source_title": "PREPARE MATERIALS AND TOOLS",
        "source_text": "--- PDF PAGE 18 ---\nTR- Land-based Transport Refrigeration Servicing NC II (New)     Promulgated December 16, 2015                       16 \nCOMMON COMPETENCIES \n \n \nUNIT OF COMPETENCY:  PREPARE MATERIALS AND TOOLS \n \nUNIT CODE  \n        :   HVC713201 \n \nUNIT DESCRIPTOR        :  This unit covers the knowledge, skills and attitudes in \nidentifying, requesting and receiving   needed materials and \ntools based on the required performance standards. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the \nRange of Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n1. Identify \nmaterials \n \n \n1.1 Materials are listed as per \njob requirements \n1.2 Quantity and description of \nmaterials    conformed to \nthe job requirements \n1.3 Tools and accessories are \nidentified according to job \nrequirements \n \n Types and uses of \nHVAC/R materials \nand tools \n Different forms for \npreparation of  \nmaterials, tools \nand accessories \n Requisition \nprocedures \n Preparing \nmaterials and \ntools \n Proper handling \nof tools and \nequipment \n Following \nInstructions \n2.  Request \nmaterials \nand tools \n \n2.1  Materials and tools needed \nare requested according to \nthe list prepared \n2.2  Request is done as per \ncompany  standard \noperating procedures \n2.3 Substitute materials and \ntools are provided without \nsacrificing cost and quality \nof the work \n Standard \nprocedures in \nrequisition of \nmaterials and tools \n Listing of different  \nHVAC/R materials \nand tools \n Probable \nsubstitute \nmaterials \n Preparing \nrequisition slip \n Communication \nskills \n Identifying \nHVAC/R \nmaterials and \ntools \n \n3.  Receive and \ninspect  \n      materials \nand tools \n3.1 Materials and tools issued \nare inspected as per \nquantity and specification \n3.2  Tools, accessories and \nmaterials checked for \ndamages according to RAC \nCode of Practices \n3.3 Materials and tools are set \naside to  appropriate \nlocation nearest to the \nworkplace \n Safety \nrequirements in \ninspection of \nmaterials and  \ntools  \n Standard \nprocedures in \nchecking materials \nand tools \n 5S principles \n Applying safety \nprocedures in the \nworkplace \n Preparing \nmaterials and \ntools \n Proper handling \nof tools and \nequipment \n Following \nInstructions\n\n--- PDF PAGE 19 ---\nTR- Land-based Transport Refrigeration Servicing NC II (New)     Promulgated December 16, 2015                    17 \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Materials and tools \n \n \n1.1 Air-conditioning \n1.2 Refrigeration \n2.  Description of materials and \ntools \n \n2.1 Brand name \n2.2 Size \n2.3 Capacity \n2.4 Kind of application \n3.  Company standard   \nprocedures \n3.1 Job Order \n3.2 Requisition Slip \n3.3 Borrower Slip \n \n \n \n \nEVIDENCE GUIDE \n \n1. Critical aspects \nof Competency \n \n \n \n \n \n \n \nAssessment  requires evidence that the candidate: \n1.1 Listed materials and tools according to quantity and job \nrequirements  \n1.2 Requested materials and tools according to the list \nprepared and as per company standard operating \nprocedures \n1.3 Inspected issued materials and tools  as per quantity and \njob specifications \n1.4 Tools provided with appropriate safety devices \n2. Resource \nImplications \n \n \n \nThe following resources should be provided: \n2.1  Workplace location \n2.2  Materials relevant to the unit of competency \n2.3  Technical plans, drawings and specifications     relevant to \nthe activities \n3. Methods of \nAssessment \n \nCompetency in this unit must be assessed through: \nDirect observation and oral questioning \n4. Context for \nAssessment \n \n \n \n4.1  Competency may be assessed in the workplace or in a \nsimulated workplace \n4.2  Competency assessment must be undertaken in \naccordance with the endorsed TESDA assessment \nguidelines\n",
