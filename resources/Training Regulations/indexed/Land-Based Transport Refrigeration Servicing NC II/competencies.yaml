        "evidence_guide": {
          "source_text": "1 Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Prepared for maintenance activities.\n1.2 Checked and adjusted transport refrigeration\nequipment accessories, controls and operating\nconditions\n1.3 Applied maintenance procedures according to\nmanufacturer’s maintenance manual.\n1.4 Checked and maintained lubrication system in\ntransport refrigeration.\n1.5 Checked and maintained refrigeration system in\ntransport refrigeration.\n1.6 Checked and maintained air distribution system in\ntransport refrigeration.\n2 Resource Implications\nThe following resources MUST be provided:\n2.1 Work place location\n2.2 Tools and equipment appropriate to maintaining\ntransport refrigeration processes\n2.3 Materials relevant to the activity\n2.4 Drawings and specifications relevant to the task\n3 Methods of Assessment\nCompetency must be assessed through:\n3.1 Demonstration with oral questioning\n3.2 Observation with oral questioning\n4 Context for Assessment\nCompetency may be assessed in the work place or in\na simulated work place setting\n\n--- PDF PAGE 57 ---\nTR- Land-based Transport Refrigeration Servicing NC II (New) Promulgated December 16, 2015 55\nUNIT OF COMPETENCY: TROUBLESHOOT AND REPAIR TRANSPORT\nREFRIGERATION SYSTEMS\n\nUNIT CODE :"
        },
        "source_text": "HVC712304\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes required to\nservice and maintain transport refrigeration units of trucks\nand vans. This includes preparing for maintenance activities,\nchecking and adjusting accessories, controls and operating\nconditions as well as maintaining lubrication, refrigeration\nsystem and air distribution systems.\n\nLEMENT\nPERFORMANCE CRITERIA\nItalicized fonts are elaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Prepare for\nmaintenance\nactivities\n\n1.1. Work instructions are read\ninterpreted to determine job\nrequirements\n1.2. Appropriate manufacturer's\nmanual is consulted if\navailable; otherwise, RAC\nCode of Practice and/or\nenterprise maintenance policy\nprocedures are adopted.\n1.3. Tools and equipment are\nselected in accordance with\njob requirements\n1.4. Work safety is observed\naccording to established\noperating standards\n• Types of\nmaintenance works\n• Understanding of\nwork/job order\n• Proper\nmaintenance of\ntools, equipment\nand instruments\n• Understanding RAC\ncode of practice\n• Understanding\nmaintenance\nmanufacturer’s\nmanual\n• Safety practices\n• Housekeeping\n• Preparing\nmaintenance\nactivities\n• Applying safety\npractices\n• Interpreting\nsafety signs\nand symbols\n• Interpreting\nwork\ninstructions\n2. Check and\nadjust\ntransport\nrefrigeration\naccessories,\ncontrols and\noperating\nconditions\n2.1 Operation/Controls/\nSettings are checked and\nadjusted in accordance with\nmanufacturer's specifications.\n2.2 Transport refrigeration\naccessories are adjusted\naccordingly based on\nmanufacturer's maintenance\nmanual.\n2.3 Maintenance procedures are\napplied according to\nmanufacturer's maintenance\nmanual\n• Operation of\ntransport\nrefrigeration system\n• Accessories,\ncontrols and setting\nof transport\nrefrigeration system\n• Familiarization on\nfunctions of controls\nand accessories\n• Understanding RAC\ncode of practice\n• Understanding\nmaintenance\nmanufacturer’s\nmanual\n• Housekeeping\n\n• Operating\ntransport\nrefrigeration\nunit\n• Identifying\nfunctions of\ncontrols and\naccessories\n• Checking,\nadjusting and\nsetting of\ncontrols\n• Applying safety\nprocedure in\nsetting and\nadjusting of\ncontrols and\naccessories\n\n--- PDF PAGE 52 ---\nTR- Land-based Transport Refrigeration Servicing NC II (New) Promulgated December 16, 2015 50\nLEMENT\nPERFORMANCE CRITERIA\nItalicized fonts are elaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n3. Maintain\nlubrication\nsystem in\ntransport\nrefrigeration\n3.1. Maintenance record is\nchecked and verified based\non established maintenance\nprocedures\n3.2. Lubrication system variables\nand components are checked\nand adjusted based on\nmanufacturer’s maintenance\nmanual\n3.3. Oil parameters are checked\nand adjusted based on\nmanufacturer’s specifications\n3.4. Oil leaks and restrictions are\ndetected and rectified based\non manufacturer’s\nmaintenance manual\n3.5. Used oil is disposed properly\naccording to RAC Code of\nPractice.\n• Types of\nrefrigeration oil\n• Refrigeration\nlubrication system\n• Oil failure switches\nand controls\n• Regulations on oil\ndisposal\n• Safety in handling\noil and lubricants\n• Housekeeping\n• Identifying\nrefrigeration oil\n• Adding\nremoving oil to\na system\n• Adjusting and\nsetting oil\npressure\ncontrols\n• Disposal of\nused oil\n• Apply safety in\nhandling oil\nand lubricants\n• Performing\nhousekeeping\n4. Maintain\nrefrigeration\nsystem in\ntransport\nrefrigeration\n4.1 Maintenance record is\nchecked and verified based on\nestablished maintenance\nprocedures\n4.2 Evaporator/condenser coils\nare cleaned in accordance\nwith manufacturer's\nmaintenance manual.\n4.3 Refrigerant piping and fittings\nare checked for abnormal\nconditions based on\nprocedure.\n4.4 Operating parameters are\nmeasured and analyzed\nbased on manufacturer’s\nstandards and/or RAC Code\nof Practice.\n4.5 Pressure and temperature\ndrops are checked and\nrecorded based on\nmanufacturer’s maintenance\nmanual and/or RAC Code of\nPractice\n4.6 Leak testing is performed\nbased on RAC Code of\nPractice.\n4.7 Transport refrigeration\ncomponents, accessories\nand consumables are\nchecked for contaminants in\naccordance manufacturer’s\nmanual or RAC Code of\n• Types of\nevaporators\n• Parts and functions\nof evaporator and\ncondenser\nassembly\n• Parts and functions\nof components and\naccessories\n• Contaminants\n• Tube processing\noperation\n• Compressor\nassembly and\nfunctions\n• Proper belt tension\nand alignment\n• Types of belts\n• Reading and use of\nmeasuring\ninstruments\n• Refrigerant leakage\n• Housekeeping\n• Assembling\nand\ndisassembling\nevaporator and\ncondenser\nassembly\n• Checking and\ncleaning of\nevaporator and\ncondenser fins\n• Checking and\ncleaning\ncomponents\nand\naccessories\n• Removing\ncontaminants\n• Flaring,\nswaging,\ncutting\n• Measuring\noperating\nparameters\n• Checking\nprocedures of\nmagnetic clutch\n• Adjusting and\naligning of belts\nand pulley\n• Locating\nleakage on\n\n--- PDF PAGE 53 ---\nTR- Land-based Transport Refrigeration Servicing NC II (New) Promulgated December 16, 2015 51\nLEMENT\nPERFORMANCE CRITERIA\nItalicized fonts are elaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\nPractice.\ntubing and\nfittings\n• Safe\nprocedures in\nservicing\ncompressor,\npulley, belts,\ntubing and\nfittings\n• Performing\nhousekeeping\n5. Maintain air\ndistribution\nsystem in\ntransport\nrefrigeration\n5.1 Maintenance record is\nchecked and verified based on\nestablished maintenance\nprocedures\n5.2 Air distribution system\ncomponents are checked and\nensure air flows are free from\nrestrictions based on\nmanufacturer’s instructions.\n5.3 Outdoor air supply systems\nare checked and maintained\nto meet operational and\nregulatory requirements.\n\n• Fan motor\nassembly\n• Understanding\nschematic diagram\n• Different defects of\nfan motor and\nblower\n• Methods of\nmaintaining fan\nmotors and blowers\n• Housekeeping\n• Interpreting\nschematic\ndiagram\n• Disassembling\nand\nassembling fan\nmotor and\nblower\n• Determining\ndefects of fan\nmotors and\nblower\n• Cleaning and\noiling fan\nmotors\n• Performing\nhousekeeping\n\n--- PDF PAGE 54 ---\nTR- Land-based Transport Refrigeration Servicing NC II (New) Promulgated December 16, 2015 52\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Work instructions\nMay include:\n1.1 Work permits\n1.2 Job orders\n1.3 Blueprints/Diagrams\n1.4 Tools and materials requisition form/s\n\n2. Operation/Controls/Settings\nMay include:\n2.1 Pressures\n2.2 Temperatures\n2.3 Voltages\n2.4 Current draws\n2.5 Air flow\n2.6 Noise level\n2.7 Vibrations\n2.8 Motor RPM\n2.9 Frequency\n4. Transport refrigeration\naccessories\n\nMay include but not limited to:\n4.1 Pressure switch\n4.2 Temperature control\n4.3 Pulley alignment/belt tension\n4.4 Unloader\n4.5 Fan blades/blower\n4.6 Motors\n4.7 Defrost heater\n4.8 Defrost timer\n4.9 Crankcase heater\n4.10 Solenoid valve\n4.11 Oil failure switch\n5. Oil parameters\nMay include:\n5.1 Oil levels\n5.2 Oil properties\n5.3 Purity of oil\n5.4 Oil viscosity\n\n6 Abnormal conditions\nMay include:\n6.1 leaks\n6.2 insulation cracks\n6.3 looseness of supports/brackets/fittings\n6.4 vibrations\n6.5 kinks\n\n--- PDF PAGE 55 ---\nTR- Land-based Transport Refrigeration Servicing NC II (New) Promulgated December 16, 2015 53\n7 Operating parameters\nMay include but not limited to:\n7.1 Operating temperature\n7.2 Superheat\n7.3 Pressure\n7.4 Oil level\n7.5 voltage\n7.6 current\n7.7 air velocity\n7.8 sound level and vibration\n8 Transport refrigeration\ncomponents, accessories and\nconsumables\n\nMay include but not limited to:\n8.1 Components:\n8.1.1 Expansion valves\n8.1.2 Solenoid valves\n8.1.3 Evaporator\n8.1.4 Compressor\n8.1.5 Condenser\n8.2 Accessories\n8.2.1 Filter drier/ strainer\n8.2.2 Sight glass\n8.2.3 Oil separator\n8.2.4 accumulator\n8.2.5 liquid receiver\n8.3 Consumables\n8.3.1 Oil\n8.3.2 Refrigerant\n8.3.3 Filter drier/ strainer\n9 Air distribution system\nMay include:\n9.1 Grilles\n9.2 Louvers\n9.3 Evaporator fan motor and blower\n9.4 Condenser fan motor\n\n--- PDF PAGE 56 ---\nTR- Land-based Transport Refrigeration Servicing NC II (New) Promulgated December 16, 2015 54\nEVIDENCE GUIDE\n\n1 Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Prepared for maintenance activities.\n1.2 Checked and adjusted transport refrigeration\nequipment accessories, controls and operating\nconditions\n1.3 Applied maintenance procedures according to\nmanufacturer’s maintenance manual.\n1.4 Checked and maintained lubrication system in\ntransport refrigeration.\n1.5 Checked and maintained refrigeration system in\ntransport refrigeration.\n1.6 Checked and maintained air distribution system in\ntransport refrigeration.\n2 Resource Implications\nThe following resources MUST be provided:\n2.1 Work place location\n2.2 Tools and equipment appropriate to maintaining\ntransport refrigeration processes\n2.3 Materials relevant to the activity\n2.4 Drawings and specifications relevant to the task\n3 Methods of Assessment\nCompetency must be assessed through:\n3.1 Demonstration with oral questioning\n3.2 Observation with oral questioning\n4 Context for Assessment\nCompetency may be assessed in the work place or in\na simulated work place setting\n\n--- PDF PAGE 57 ---\nTR- Land-based Transport Refrigeration Servicing NC II (New) Promulgated December 16, 2015 55\nUNIT OF COMPETENCY: TROUBLESHOOT AND REPAIR TRANSPORT\nREFRIGERATION SYSTEMS\n\nUNIT CODE :"
