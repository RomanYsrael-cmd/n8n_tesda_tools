cessories are adjusted \naccordingly based on \nmanufacturer's maintenance \nmanual.  \n2.3 Maintenance procedures are \napplied according to \nmanufacturer's maintenance \nmanual \n Operation of \ntransport \nrefrigeration system \n Accessories, \ncontrols and setting \nof transport \nrefrigeration system \n Familiarization on \nfunctions of controls \nand accessories \n Understanding RAC \ncode of practice \n Understanding \nmaintenance \nmanufacturer’s \nmanual \n Housekeeping \n \n Operating \ntransport \nrefrigeration \nunit \n Identifying \nfunctions of \ncontrols and \naccessories \n Checking, \nadjusting and \nsetting of \ncontrols \n Applying safety \nprocedure in \nsetting and \nadjusting of \ncontrols and \naccessories\n\n--- PDF PAGE 52 ---\nTR- Land-based Transport Refrigeration Servicing NC II (New)     Promulgated December 16, 2015       50 \nLEMENT \nPERFORMANCE CRITERIA \nItalicized fonts are elaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n3. Maintain \nlubrication \nsystem in \ntransport \nrefrigeration \n3.1. Maintenance record is \nchecked and verified based \non established maintenance \nprocedures  \n3.2. Lubrication system variables \nand components are checked \nand adjusted based on \nmanufacturer’s maintenance \nmanual  \n3.3. Oil parameters are checked \nand adjusted based on \nmanufacturer’s specifications \n3.4. Oil leaks and restrictions are \ndetected and rectified based \non manufacturer’s \nmaintenance manual \n3.5. Used oil is disposed properly \naccording to RAC Code of \nPractice. \n Types of \nrefrigeration oil \n Refrigeration \nlubrication system \n Oil failure switches \nand controls \n Regulations on oil \ndisposal \n Safety in handling \noil and lubricants \n  Housekeeping \n Identifying \nrefrigeration oil \n Adding \nremoving oil to \na system \n Adjusting and \nsetting oil \npressure \ncontrols \n Disposal of \nused oil \n Apply safety in \nhandling oil \nand lubricants \n Performing \nhousekeeping \n4. Maintain \nrefrigeration \nsystem in \ntransport \nrefrigeration \n4.1 Maintenance record is \nchecked and verified based on \nestablished maintenance \nprocedures \n4.2 Evaporator/condenser coils \nare cleaned in accordance \nwith manufacturer's \nmaintenance manual. \n4.3 Refrigerant piping and fittings \nare checked for abnormal \nconditions based on \nprocedure. \n4.4 Operating parameters are \nmeasured and analyzed \nbased on manufacturer’s \nstandards and/or RAC Code \nof Practice. \n4.5 Pressure and temperature \ndrops are checked and \nrecorded based on \nmanufacturer’s maintenance \nmanual and/or RAC Code of \nPractice \n4.6 Leak testing is performed \nbased on RAC Code of \nPractice. \n4.7 Transport refrigeration \ncomponents, accessories \nand consumables are \nchecked for contaminants in \naccordance manufacturer’s \nmanual or RAC Code of \n Types of \nevaporators \n Parts and functions \nof evaporator and \ncondenser \nassembly \n Parts and functions \nof components and \naccessories \n Contaminants \n Tube processing \noperation \n Compressor \nassembly and \nfunctions \n Proper belt tension \nand alignment \n Types of belts \n Reading and use of \nmeasuring \ninstruments \n Refrigerant leakage \n Housekeeping \n Assembling \nand \ndisassembling \nevaporator and \ncondenser \nassembly \n Checking and \ncleaning of \nevaporator and \ncondenser fins \n Checking and \ncleaning \ncomponents \nand \naccessories \n Removing \ncontaminants \n  Flaring, \nswaging, \ncutting \n  Measuring \noperating \nparameters \n  Checking \nprocedures of \nmagnetic clutch\n  Adjusting and \naligning of belts \nand pulley \n Locating \nleakage on\n\n--- PDF PAGE 53 ---\nTR- Land-based Transport Refrigeration Servicing NC II (New)     Promulgated December 16, 2015       51 \nLEMENT \nPERFORMANCE CRITERIA \nItalicized fonts are elaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \nPractic