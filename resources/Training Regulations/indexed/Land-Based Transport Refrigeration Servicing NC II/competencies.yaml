        "source_text": "500311107\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes in\npromoting career growth and advancement.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1. Integrate\npersonal\nobjectives with\norganizational\ngoals\n1.1. Personal growth and work\nplans are pursued towards\nimproving the qualifications\nset for the profession\n1.2. Intra- and interpersonal\nrelationships are\nmaintained in the course of\nmanaging oneself based\non performance evaluation\n1.3. Commitment to the\norganization and its goal is\ndemonstrated in the\nperformance of duties\n• Work values and\nethics (Code of\nConduct, Code of\nEthics, etc.)\n• Understanding\npersonal objectives\n• Understanding\norganizational goals\n• Difference between\nintra and\ninterpersonal\nrelationship\n• Performance\nevaluation\n• Demonstrate\nIntra and\nInterpersonal\nskills at work\n• Demonstrate\npersonal\ncommitment in\nwork\n2. Set and meet\nwork priorities\n2.1 Competing demands are\nprioritized to achieve\npersonal, team and\norganizational goals and\nobjectives.\n2.2 Resources are utilized\nefficiently and effectively to\nmanage work priorities and\ncommitments\n2.3 Practices along economic\nuse and maintenance of\nequipment and facilities are\nfollowed as per\nestablished procedures\n• Company policies\n• Company operations,\nprocedures and\nstandards\n• Time management\n• Basic strategic\nplanning concepts\n• Resource utilization\nand management\n• Managing goals\nand time\n• Practice\neconomic use of\nresources and\nfacilities\n• Setting work\npriorities\n• Practice time\nmanagement\n3. Maintain\nprofessional\ngrowth and\ndevelopment\n3.1 Trainings and career\nopportunities are identified\nand availed of based on\njob requirements\n3.2 Recognitions are\nsought/received and\ndemonstrated as proof of\ncareer advancement\n3.3 Licenses and/or\ncertifications relevant to\njob and career are obtained\nand renewed\n• Career development\nopportunities\n• Company recognition\nand incentives\n• Information on\nrelevant licenses and\nor certifications\n• Determining\npersonal career\ndevelopment\nneeds\n• Identifying career\nopportunities\n\n--- PDF PAGE 12 ---\nTR- Land-based Transport Refrigeration Servicing NC II (New) Promulgated December 16, 2015 10\n RANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Evaluation\n1.1 Performance Appraisal\n1.2 Psychological Profile\n1.3 Aptitude Tests\n2. Resources\n2.1 Human\n2.2 Financial\n2.3 Technology\n2.3.1 Hardware\n2.3.2 Software\n3. Trainings and career\nopportunities\n3.1 Participation in training programs\n 3.1.1 Technical\n 3.1.2 Supervisory\n 3.1.3 Managerial\n 3.1.4 Continuing Education\n3.2 Serving as Resource Persons in conferences and\nworkshops\n4. Recognitions\n4.1 Recommendations\n4.2 Citations\n4.3 Certificate of Appreciations\n4.4 Commendations\n4.5 Awards\n4.6 Tangible and Intangible Rewards\n5. Licenses and/or\ncertifications\n5.1 National Certificates\n5.2 Certificate of Competency\n5.3 Support Level Licenses\n5.4 Professional Licenses\n\n--- PDF PAGE 13 ---\nTR- Land-based Transport Refrigeration Servicing NC II (New) Promulgated December 16, 2015 11\n\nEVIDENCE GUIDE\n\n1. Critical aspects\nof Competency\nAssessment requires evidence that the candidate:\n1.1 Attained job targets within key result areas (KRAs)\n1.2 Maintained intra - and interpersonal relationship in the\ncourse of managing oneself based on performance\nevaluation\n1.3 Completed trainings and career opportunities which are\nbased on the requirements of the industries\n1.4 Acquired and maintained licenses and/or certifications\naccording to the requirement of the qualification\n2. Resource\nImplications\nThe following resources should be provided:\n2.1 Workplace or assessment location\n2.2 Case studies/scenarios\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1 Portfolio Assessment\n3.2 Interview\n3.3 Simulation/Role-plays\n3.4 Observation\n3.5 Third Party Reports\n3.6 Exams and Tests\n4. Context for\nAssessment\n4.1 Competency may be assessed in the work place or in\na simulated work place setting\n\n--- PDF PAGE 14 ---\nTR- Land-based Transport Refrigeration Servicing NC II (New) Promulgated December 16, 2015 12\nUNIT OF COMPETENCY : PRACTICE OCCUPATIONAL HEALTH AND SAFETY\nPROCEDURES\nUNIT CODE :"
