        "source_text": "--- PDF PAGE 20 ---\nTR- Land-based Transport Refrigeration Servicing NC II (New)     Promulgated December 16, 2015                       18 \n \nUNIT OF COMPETENCY:  INTERPRET TECHNICAL DRAWINGS  \n \nUNIT CODE  \n       :   HVC311202 \n \nUNIT DESCRIPTOR \n  : This unit covers the knowledge, skills and attitudes and \nvalues needed to prepare/interpret diagrams, engineering \nabbreviation and drawings, symbols, dimension. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in \nthe Range of Variables\nREQUIRED KNOWLEDGE \nREQUIRED SKILLS \n1. Identify \ndifferent kinds \nof technical \ndrawings  \n1.1. Correct technical \ndrawing is selected \naccording to job \nrequirements. \n1.2. Technical drawings are \nsegregated in \naccordance with the \ntypes and kinds of \ndrawings \n Types of technical \ndrawings \n Applications for \ntechnical drawing  \n Methods of technical \ndrawings \n Symbols \n Mark up/Notation of \nDrawings\n Reading skills \nrequired to \ninterpret work \ninstruction \n Interpreting \nelectrical/ \nelectronic/RAC \nsigns and symbols  \n2. Interpret \ntechnical \ndrawing \n2.1. Components, assemblies \nor objects are recognized \nas required. \n2.2. Dimensions of the key \nfeatures of the objects \ndepicted in the drawing \nare correctly identified. \n2.3. Symbols used in the \ndrawing are identified \nand interpreted correctly. \n2.4. Drawing is checked and \nvalidated against job \nrequirements or \nequipment in accordance \nwith standard operating \nprocedures. \n \n Trade Mathematics \no Linear measurement \no Dimension \no Unit conversion \n Blueprint Reading and \nPlan Specification \no Architectural, \nelectrical, \nelectronics, RAC, \nmechanical plan, \nsymbols and \nabbreviations \no Drawing standard \nsymbols \n Trade Theory \no Basic technical \ndrawing \no Types technical \nplans \no Various types of \ndrawings \no Notes and \nspecifications\n Interpreting \ndrawing/ \northographic \ndrawing \n Interpreting \ntechnical plans \n Matching \nspecification \ndetails with \nexisting resources \n Safety handling of \ndrawing \ninstruments \n \n3. Prepare/make \nchanges to \nelectrical/ \nelectronic/ \nRAC \nschematics \nand drawings \n3.1. Electrical/electronic/RAC \nschematic is drawn and \ncorrectly identified. \n3.2. Correct drawing is \nidentified, equipment are \nselected and used in \naccordance with job \nrequirements. \n \n Drawing conventions \n Dimensioning \nConventions \n Mathematics \no Four fundamental \noperations \no Percentage \no Fraction \no Algebra \no Geometry\n Reading skills \nrequired to \ninterpret work \ninstruction \n Communication \nskills \n Preparing/ Making \nelectrical/ \nelectronic/ RAC \nsigns and symbols\n\n--- PDF PAGE 21 ---\nTR- Land-based Transport Refrigeration Servicing NC II (New)     Promulgated December 16, 2015                    19 \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in \nthe Range of Variables\nREQUIRED KNOWLEDGE \nREQUIRED SKILLS \n Computing \nformulas \n4. Store \ntechnical \ndrawings and \nequipment/ \ninstruments \n4.1. Care and maintenance of \ndrawings are undertaken \naccording to company \nprocedures. \n4.2. Technical drawings are \nrecorded and inventory is \nprepared in accordance \nwith company \nprocedures. \n4.3. Proper storage of \ninstruments is \nundertaken according to \ncompany procedures.  \n Effective ways to \ncatalogue and store \ntechnical drawings \n Manual methods of \nhandling, storing and \nmaintaining paper \ndrawings \n Storing drawing in digital \nforms \no Scanner \no CAD \n \n Handling and \nstoring of drawings\n Scanning and \nstoring drawings in \ndigital form \n Matching \nspecification \ndetails with \nexisting resources \n Handling of \ndrawing \ninstruments\n\n--- PDF PAGE 22 ---\nTR- Land-based Transport Refrigeration Servicing NC II (New)     Promulgated December 16, 2015                       20 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Technical drawings \nTechnical drawings include the following but not limited to: \n1.1. Schematic diagrams \n1.2. Charts \n1.3. Block diagrams \n1.4. Lay-out plans \n1.5. Location plans \n1.6. Process and instrumentation diagrams \n1.7. Loop diagrams \n1.8. System Control Diagrams \n1.9. Refrigeration and Air-conditioning control and circuit \ndiagram \n2. Dimensions   \nDimensions may include but not limited to: \n \n2.1. Length \n2.2. Width \n2.3. Height \n2.4. Diameter \n2.5. Angles \n3. Symbols \nMay include but not limited to: \n \n3.1. Architectural  \n3.2. Electrical \n3.3. Electronics \n3.4. Refrigeration and Air Conditioning \n3.5. Mechanical \n4. Instruments/ \nEquipment \n4.1. Components/dividers \n4.2. Drawing boards \n4.3. Rulers \n4.4. T-square \n4.5. Calculator\n\n--- PDF PAGE 23 ---\nTR- Land-based Transport Refrigeration Servicing NC II (New)     Promulgated December 16, 2015                    21 \n \nEVIDENCE GUIDE \n \n1. Critical aspect of \ncompetencies \nAssessment must show that the candidate: \n \n1.1. selected correct technical drawing in line with \njob requirements \n1.2. correctly identified the objects represented in \nthe drawing \n1.3. identified and interpreted symbols used in the \ndrawing correctly \n1.4. prepared/produced electrical/electronic /RAC \ndrawings including all relevant specifications \n1.5. stored diagrams/equipment \n2. Method of assessment \nCompetency in this unit must be assessed through: \n \n2.1. Practical tasks involving interpretation of a \nrange of technical drawings \n2.2. Oral questioning \n3. Resource implication \n3.1. Drawings \n3.2. Diagrams \n3.3. Charts \n3.4. Plans \n4. Context of Assessment \nAssessment may be conducted in the workplace or in \na simulated environment\n\n--- PDF PAGE 24 ---\n",
