ects\nof Competency\nCompetency requires evidence that the candidate:\n1.1 Prepared reports used terminology and language\nappropriate to all users\n1.2 Prepared reports to include alternatives, views,\napproaches and other findings and recommendations for\nconsideration by the supervisor\n1.3 Prepared reports are coherent and based on actual\nfindings/analysis/results\n1.4 Prepared reports are accomplished, completed as per\nstandard format and submitted within specified time to the\nconcerned supervisor\n\n2. Resource\nImplications\nThings necessary to conduct method of assessment:\n2.1 Work place location\n2.2 Materials relevant to the proposed activity\n3. Methods of\nAssessment\nCompetency in this unit must be assessed through:\n3.1. Direct observation\n3.2. Questions related to required knowledge\n4. Context for\nAssessment\nCompetency may be assessed in the work place or in a\nsimulated work place setting\n\n--- PDF PAGE 51 ---\nTR- Land-based Transport Refrigeration Servicing NC II (New) Promulgated December 16, 2015 49\nCORE COMPETENCIES\n\nUNIT OF COMPETENCY : SERVICE AND MAINTAIN TRANSPORT REFRIGERATION\nUNITS\n\nUNIT CODE\n\n :"
