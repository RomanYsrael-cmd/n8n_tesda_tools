ressure/leak testing \nprocedure \n Familiarization with \nRAC Code of \nPractice \n Retrofitting procedure \n Conversion \nprocedure \n Charging procedure \n Leak testing methods \n Alternative \nrefrigerants \n Housekeeping \n \n Following \nprocedures in \nidentifying \nrefrigerants \n Performing \nrecovery/ \nrecycling of \nrefrigerants \n Safe handling \nof refrigerants \n Performing \nevacuation \nprocedure \n Performing \ncharging \nprocedure \n Performing \npressure/ leak \ntesting \nprocedure \n Performing \nretrofitting \nprocedure \n Performing \nconversion \nprocedures \n Identifying \nalternative \nrefrigerants \n4. Test-run \nrepaired unit \n \n4.1. Electrical and mechanical \ncomponents of repaired unit \nare checked prior to test run \n4.2. Operating parameters are \nchecked and monitored in \nline with   manufacturer’s \ntesting procedures  \n4.3. Report on repair and testing \nof unit is prepared in line \nwith RAC Code of Practice \nor established standards \nprocedures \n \n Manufacturer’s \ntesting procedures \n Operating \nparameters \n Point of location for \nparameter reading \n Safety standards in \ntesting repaired unit \n Service report forms \n4.1 Applying \nprocedures \nand \ntechniques in \ntesting \nrepaired \nunits \n Interpreting \nparameter \nreadings \n Applying safety \nstandards \n Filling up of \nservice reports \nforms\n\n--- PDF PAGE 59 ---\nTR- Land-based Transport Refrigeration Servicing NC II (New)     Promulgated December 16, 2015       57 \n \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. PPE \nIncludes but not limited to: \n1.1. Mask \n1.2. Safety shoes \n1.3. Safety goggles \n1.4. Working apparel \n1.5. Gloves \n2. Components \nMay include but not limited to: \n2.1. Switches \n2.1.1 \nOn/Off switches \n2.1.2 \nChange-over switches \n2.1.3 \nTemperature selector \n2.2. Thermostat \n2.2.1 \nMechanical \n2.2.2 \nElectrical/Electronics \n2.3. Pressure switch/sensor \n2.4. Relay \n2.5. Damper motor