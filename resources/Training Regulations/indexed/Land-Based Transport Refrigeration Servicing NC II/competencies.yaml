        "source_title": "TROUBLESHOOT AND REPAIR TRANSPORT REFRIGERATION SYSTEMS",
        "source_text": "--- PDF PAGE 57 ---\nTR- Land-based Transport Refrigeration Servicing NC II (New)     Promulgated December 16, 2015       55 \nUNIT OF COMPETENCY: TROUBLESHOOT AND REPAIR TRANSPORT \nREFRIGERATION SYSTEMS \n \nUNIT CODE                     :   HVC712305 \n \n \n \n \nUNIT DESCRIPTOR        :  This unit covers the knowledge, skills and attitudes in \ntroubleshooting and repairing transport refrigeration systems \nfor trucks and vans. This includes planning and preparing for \ntroubleshooting and repair, identifying and repairing faults/ \ntroubles, performing refrigerant recovery/recycling and \nretrofitting/conversion on transport refrigeration unit as well \nas test-running the repaired unit. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized fonts are elaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Plan and \nprepare for \ntroubleshooting \nand repair \n1.1 Appropriate wiring \ndiagrams, charts and \nmanuals are interpreted in \nline with the job \nrequirements \n1.2 Appropriate materials, tools \nand equipment are selected \nbased on job requirements \n1.3 Work safety is observed \naccording to  established \noperating standards \n Schematic and \npictorial diagrams of \ntransport refrigeration \no Electrical \no Mechanical  \n Manufacturer’s \nmanual for transport \nrefrigeration \nequipment \n Appropriate \nmaterials, tools and \nequipment for \ntroubleshooting and \nrepair\n Interpreting \nschematic \ndiagram \n Preparing \nmaterials, tools \nand equipment \n Planning skills \n \n2. Identify and \nrepair faults/ \ntroubles \n2.1. Appropriate PPE are \nselected and used in line \nwith job requirements \n2.2. Components are tested \nfollowing manufacturer’s \nmanual or RAC Code of \nPractice  \n2.3. Faults/problems with \ncomponents are diagnosed \nin line with manufacturer’s \nmanual or RAC Code of \nPractice \n2.4. Remedial action is taken to \novercome faults/problems \nin line manufacturer’s 