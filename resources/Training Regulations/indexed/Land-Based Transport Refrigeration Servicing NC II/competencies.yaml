        "evidence_guide": {
          "source_text": "1. Critical aspects\nof competency\nAssessment requires evidence that the candidate:\n1.1\nPlanned and prepared for troubleshooting and repair\n1.2\nIdentified and repaired faults/troubles\n1.3\nPerformed refrigerant recovery/recycling and retrofitting/\nconversion on transport refrigeration unit\n1.4\nTested-run repaired unit\n4. Resource\n Implications\nThe following resources must be provided:\n2.1 access to work place location and mockup unit\n2.2 Tools and equipment appropriate to troubleshooting and\nrepair\n2.3 Materials relevant to the proposed activity\n2.4 Drawings and specifications relevant to the task\n5. Methods of\nAssessment\nCompetency must be assessed through:\n3.1 Demonstration with oral questioning\n3.2 Direct observation with oral questioning\n6. Context for\nAssessment\nCompetency may be assessed in the work place or in a\nsimulated work place setting\n\n--- PDF PAGE 61 ---\nTR- Land-based Transport Refrigeration Servicing NC II (New) Promulgated December 16, 2015 59\n\nUNIT OF COMPETENCY: PERFORM START-UP, TEST AND COMMISSIONING OF\nTRANSPORT REFRIGERATION UNIT\n\nUNIT CODE\n :"
        },
        "source_text": "HVC712305\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes in\ntroubleshooting and repairing transport refrigeration systems\nfor trucks and vans. This includes planning and preparing for\ntroubleshooting and repair, identifying and repairing faults/\ntroubles, performing refrigerant recovery/recycling and\nretrofitting/conversion on transport refrigeration unit as well\nas test-running the repaired unit.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized fonts are elaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Plan and\nprepare for\ntroubleshooting\nand repair\n1.1 Appropriate wiring\ndiagrams, charts and\nmanuals are interpreted in\nline with the job\nrequirements\n1.2 Appropriate materials, tools\nand equipment are selected\nbased on job requirements\n1.3 Work safety is observed\naccording to established\noperating standards\n• Schematic and\npictorial diagrams of\ntransport refrigeration\no Electrical\no Mechanical\n• Manufacturer’s\nmanual for transport\nrefrigeration\nequipment\n• Appropriate\nmaterials, tools and\nequipment for\ntroubleshooting and\nrepair\n• Interpreting\nschematic\ndiagram\n• Preparing\nmaterials, tools\nand equipment\n• Planning skills\n\n2. Identify and\nrepair faults/\ntroubles\n2.1. Appropriate PPE are\nselected and used in line\nwith job requirements\n2.2. Components are tested\nfollowing manufacturer’s\nmanual or RAC Code of\nPractice\n2.3. Faults/problems with\ncomponents are diagnosed\nin line with manufacturer’s\nmanual or RAC Code of\nPractice\n2.4. Remedial action is taken to\novercome faults/problems\nin line manufacturer’s\nmanual or RAC Code of\nPractice\n2.5. Work is completed safely in\nline with workplace safety\nguidelines\n2.6. Report on testing procedure,\nincluding faults and minor\nrepair, is completed in line\nwith manufacturer’s manual\n• Safety procedures in\ntroubleshooting and\nrepairing\n• Troubleshooting and\nrepair techniques\n• Functions and testing\nprocedures of\nrefrigeration parts\nand accessories\n• Processes in fault\nfinding\n• Understanding\nservice manuals\n• Familiarization with\nRAC Code of\nPractice\n• Service manuals &\nservice report forms\n• Applying safety\nprocedure in\ntroubleshooting\nand repair\n• Use of\nappropriate\ntesting\ninstrument\n• Selection of\ncomponents\nand\nreplacement\n• Applying\ntroubleshooting\nand repair\ntechniques\n• Preparing\nservice report\nand\ndocumentation\n\n--- PDF PAGE 58 ---\nTR- Land-based Transport Refrigeration Servicing NC II (New) Promulgated December 16, 2015 56\nELEMENT\nPERFORMANCE CRITERIA\nItalicized fonts are elaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\nor RAC Code of Practice\n3. Perform\nrefrigerant\nrecovery/\nrecycling and\nretrofitting/\nconversion on\ntransport\nrefrigeration\nunit\n3.1 Safe working practices are\nobserved throughout the\ntask as per RAC Code of\nPractice\n3.2 Suitable tools and\nequipment are selected and\nused based on job\nrequirement\n3.3 Refrigerants recovery/\nrecycling is performed\naccording to manufacturer's\nrecommendations and RAC\nCode of Practice\n3.4 Retrofitting is performed\nbased on RAC Code of\nPractice\n3.5 Conversion is performed\nbased on RAC Code of\nPractice Conversion\nManual.\n\n• Identification of\nrefrigerants\n• Characteristics of\nrefrigerants\n• Effects of refrigerants\nin the ozone layer\nand climate\n• Types of recovery\nmachine\n• Methods of\nrecovery/recycling of\nrefrigerants\n• Evacuation\nprocedures\n• Pressure/leak testing\nprocedure\n• Familiarization with\nRAC Code of\nPractice\n• Retrofitting procedure\n• Conversion\nprocedure\n• Charging procedure\n• Leak testing methods\n• Alternative\nrefrigerants\n• Housekeeping\n\n• Following\nprocedures in\nidentifying\nrefrigerants\n• Performing\nrecovery/\nrecycling of\nrefrigerants\n• Safe handling\nof refrigerants\n• Performing\nevacuation\nprocedure\n• Performing\ncharging\nprocedure\n• Performing\npressure/ leak\ntesting\nprocedure\n• Performing\nretrofitting\nprocedure\n• Performing\nconversion\nprocedures\n• Identifying\nalternative\nrefrigerants\n4. Test-run\nrepaired unit\n\n4.1. Electrical and mechanical\ncomponents of repaired unit\nare checked prior to test run\n4.2. Operating parameters are\nchecked and monitored in\nline with manufacturer’s\ntesting procedures\n4.3. Report on repair and testing\nof unit is prepared in line\nwith RAC Code of Practice\nor established standards\nprocedures\n\n• Manufacturer’s\ntesting procedures\n• Operating\nparameters\n• Point of location for\nparameter reading\n• Safety standards in\ntesting repaired unit\n• Service report forms\n4.1 Applying\nprocedures\nand\ntechniques in\ntesting\nrepaired\nunits\n• Interpreting\nparameter\nreadings\n• Applying safety\nstandards\n• Filling up of\nservice reports\nforms\n\n--- PDF PAGE 59 ---\nTR- Land-based Transport Refrigeration Servicing NC II (New) Promulgated December 16, 2015 57\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. PPE\nIncludes but not limited to:\n1.1. Mask\n1.2. Safety shoes\n1.3. Safety goggles\n1.4. Working apparel\n1.5. Gloves\n2. Components\nMay include but not limited to:\n2.1. Switches\n2.1.1\nOn/Off switches\n2.1.2\nChange-over switches\n2.1.3\nTemperature selector\n2.2. Thermostat\n2.2.1\nMechanical\n2.2.2\nElectrical/Electronics\n2.3. Pressure switch/sensor\n2.4. Relay\n2.5. Damper motors\n2.6. Compressor motor\n2.7. Fan motors\n3. Testing\nMay include:\n3.1. Insulation\n3.2. Resistance\n3.3. Mechanical\n3.4. Continuity\n3.5. Timing Sequence\n3.6. Pressure\n3.7. Temperature\n3.8. Leak\n4. Refrigerants\nMay include:\n4.1 Hydrochlorofluorocarbon (HCFC)\n4.2 Hydrofluorocarbon (HFC)\n4.3 Hydrocarbon (HC)\n\n--- PDF PAGE 60 ---\nTR- Land-based Transport Refrigeration Servicing NC II (New) Promulgated December 16, 2015 58\nEVIDENCE GUIDE\n1. Critical aspects\nof competency\nAssessment requires evidence that the candidate:\n1.1\nPlanned and prepared for troubleshooting and repair\n1.2\nIdentified and repaired faults/troubles\n1.3\nPerformed refrigerant recovery/recycling and retrofitting/\nconversion on transport refrigeration unit\n1.4\nTested-run repaired unit\n4. Resource\n Implications\nThe following resources must be provided:\n2.1 access to work place location and mockup unit\n2.2 Tools and equipment appropriate to troubleshooting and\nrepair\n2.3 Materials relevant to the proposed activity\n2.4 Drawings and specifications relevant to the task\n5. Methods of\nAssessment\nCompetency must be assessed through:\n3.1 Demonstration with oral questioning\n3.2 Direct observation with oral questioning\n6. Context for\nAssessment\nCompetency may be assessed in the work place or in a\nsimulated work place setting\n\n--- PDF PAGE 61 ---\nTR- Land-based Transport Refrigeration Servicing NC II (New) Promulgated December 16, 2015 59\n\nUNIT OF COMPETENCY: PERFORM START-UP, TEST AND COMMISSIONING OF\nTRANSPORT REFRIGERATION UNIT\n\nUNIT CODE\n :"
