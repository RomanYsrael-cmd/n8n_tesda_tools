ith PEC \n1.6 Cleaned work place and left in safe state in line with OHSA \nregulations \n1.7 Completed electrical wiring in HVAC/R units based in \nmanufacturer’s specifications and PEC \n1.8 Communicated effectively to ensure safety works\n2. Resource \nImplications \nThe following resources should be provided: \n2.1 Work place \n2.2 Work plan \n2.3  Materials, tools and equipment relevant to the proposed \nactivity/task \n3. Methods of \nAssessment \nCompetency should be assessed through: \n3.1 Direct observation \n3.2  Written test/questioning relevant to required knowledge\n4. Context of \nAssessment \n4.1 Competency assessment may occur in workplace or any \nappropriate simulated environment \n4.2 Assessment shall be observed while task are being undertaken \nwhether individually or in group \n4.3  Competency assessment must be undertaken in accordance with \nthe endorsed TESDA assessment guidelines\n",
