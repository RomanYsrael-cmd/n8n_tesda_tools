        "source_text": "HVC311205\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes on\nchecking condition, performing preventive maintenance and\nstoring of HVAC/R tools and equipment.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\nREQUIRED KNOWLEDGE\nREQUIRED\nSKILLS\n1. Check\ncondition of\ntools and\nequipment\n\n1.1 Materials, tools and\nequipment are identified\naccording to classification\nand job requirements\n1.2 Non-functional tools and\nequipment are segregated\nand labeled according to\nclassification\n1.3 Safety of tools and\nequipment are observed in\naccordance with\nmanufacturer's instructions\n1.4 Condition of PPE are\nchecked in accordance with\nmanufacturer's instructions\n\n• Safety Practices\no Use of PPE\no Handling of tools and\nequipment\no Good housekeeping\n• Materials, Tools and\nEquipment\no Types and uses of\nlubricants\no Types and uses of\ncleaning materials\no Types and uses of\nHVAC/R tools\no Types and uses of\nHVAC/R equipment\n• Operational conditions\nof HVAC/R tools and\nequipment\n• HVAC/R tools and\nequipment defects\n\n• Maintaining\ntools and\nequipment\n• Handling of\ntools and\nequipment\n• Identifying\ntools and\nequipment\ndefects\n2. Perform\nbasic\npreventive\nmaintenance\n2.1 Appropriate lubricants are\nidentified according to types\nof equipment\n2.2 Tools and equipment are\nlubricated according to\npreventive maintenance\nschedule or manufacturer's\nspecifications\n2.3 Measuring instruments are\nchecked and calibrated in\naccordance with\nmanufacturer’s instructions\n2.4 Tools are cleaned and\nlubricated according to\nstandard procedures\n2.5 Defective instruments,\nequipment and accessories\nare inspected and replaced\naccording to manufacturer’s\nspecifications\n2.6 Tools are inspected,\nrepaired and replaced after\nuse\n• Safety Practices\no Use of PPE\no Handling of tools and\nequipment\no Good housekeeping\n• Materials, Tools and\nEquipment\no Types and uses of\nlubricants\no Types and uses of\ncleaning materials\n• Preventive\nMaintenance\no Methods and\ntechniques\no Procedures\n\n• Handling of\ntools and\nequipment\n• Performing\npreventive\nmaintenance\n\n--- PDF PAGE 40 ---\nTR- Land-based Transport Refrigeration Servicing NC II (New) Promulgated December 16, 2015 38\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\nREQUIRED KNOWLEDGE\nREQUIRED\nSKILLS\n2.7 Work place is cleaned and\nkept in safe state in line with\nOccupational Safety and\nHealth Standards (OSHS)\n3. Store tools\nand\nequipment\n\n3.1 Inventory of tools,\ninstruments and equipment\nare conducted and recorded\nas per company practices\n3.2 Tools and equipment are\nstored safely in appropriate\nlocations in accordance with\nmanufacturer's\nspecifications or company\nprocedures\n• Safety Practices\no Use of PPE\no Handling of tools and\nequipment\no Storing procedures\nand techniques\no Storage conditions/\nlocations\n\n• Storing tools\nand\nequipment\n• Handling of\ntools and\nequipment\n\n--- PDF PAGE 41 ---\nTR- Land-based Transport Refrigeration Servicing NC II (New) Promulgated December 16, 2015 39\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Materials\nMay include:\n1.1 Lubricants\n1.2 Cleaning materials\n1.3 Rust remover\n1.4 Rugs\n1.5 Spare parts\n\n2. Tools and equipment\n\nMay include:\n2.1 Tools\nCutting tools - hacksaw, crosscut saw, rip saw\nBoring tools - auger, brace, grinlet, hand drill\nHolding tools - vise grip, C-clamp, bench vise\nThreading tools - die and stock, taps\n\n2.2 Measuring instruments/equipment\n\n3. PPE\nMay include:\n3.1 Goggles\n3.2 Gloves\n3.3 Safety shoes\n3.4 Aprons/Coveralls\n\n4. Forms\nMay include:\n4.1 Maintenance schedule forms\n4.2 Requisition slip\n4.3 Inventory Form\n4.4 Inspection Form\n4.5 Procedures\n\n--- PDF PAGE 42 ---\nTR- Land-based Transport Refrigeration Servicing NC II (New) Promulgated December 16, 2015 40\nEVIDENCE GUIDE\n\n1. Critical