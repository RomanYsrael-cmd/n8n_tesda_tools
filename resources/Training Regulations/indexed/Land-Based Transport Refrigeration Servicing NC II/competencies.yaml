        "source_text": "500311105\nUNIT DESCRIPTOR :\nThis unit covers the knowledge, skills and attitudes\nrequired to gather, interpret and convey information in\nresponse to workplace requirements.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1. Obtain and\nconvey\nworkplace\ninformation\n1.1 Specific and relevant\ninformation is accessed\nfrom appropriate\nsources\n1.2 Effective questioning,\nactive listening and\nspeaking skills are used to\ngather and convey\ninformation\n1.3 Appropriate medium is\nused to transfer\ninformation and ideas\n1.4 Appropriate non- verbal\ncommunication is used\n1.5 Appropriate lines of\ncommunication with\nsupervisors and\ncolleagues are identified\nand followed\n1.6 Defined workplace\nprocedures for the location\nand storage of\ninformation are used\n1.7 Personal interaction is\ncarried out clearly and\nconcisely\n• Effective\ncommunication\n• Different modes of\ncommunication\n• Written\ncommunication\n• Organizational\npolicies\n• Sources of\ninformation\n• Types of question\n• Medium of\ncommunication\n• Flow of\ncommunication\n• Storage system\n• Telephone\ncourtesy\n\n• Follow simple\nspoken language\n• Performing\nroutine workplace\nduties following\nsimple written\nnotices\n• Ability to relate to\npeople of social\nrange in the\nworkplace\n• Gather and\nprovide\ninformation in\nresponse to\nworkplace\nrequirements\n• Listening skills\n• Questioning skills\n• Workplace\nlanguage skills\n\n--- PDF PAGE 5 ---\nTR- Land-based Transport Refrigeration Servicing NC II (New) Promulgated December 16, 2015 3\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n2. Participate in\nworkplace\nmeetings and\ndiscussions\n2.1 Team meetings are\nattended on time\n2.2 Own opinions are clearly\nexpressed and those of\nothers are listened to\nwithout interruption\n2.3 Meeting inputs are\nconsistent with the\nmeeting purpose and\nestablished protocols\n2.4 Workplace interactions\nare conducted in a\ncourteous manner\n2.5 Questions about simple\nroutine workplace\nprocedures and matters\nconcerning working\nconditions of employment\nare asked and responded\nto according to\norganizational guidelines\n2.6 Meetings outcomes are\ninterpreted and\nimplemented\n• Communication\nprocedures and\nsystems\n• Meeting protocols\n• Nature of\nworkplace\nmeetings\n• Barriers of\ncommunication\n• Workplace\ninteractions\n• Nonverbal\ncommunication\n• Ability to relate to\npeople of social\nrange in the\nworkplace\n• Interpersonal\ncommunication\nskill\n• Observing\nmeeting protocols\n3. Complete\nrelevant work\nrelated\ndocuments\n3.1 Range of forms relating to\nconditions of employment\nare completed accurately\nand legibly\n3.2 Workplace data is\nrecorded on standard\nworkplace forms and\ndocuments\n3.3 Basic mathematical\nprocesses are used for\nroutine calculations\n3.4 Errors in recording\ninformation on forms/\ndocuments are identified\nand properly acted upon\n3.5 Reporting requirements to\nsupervisor are completed\naccording to\norganizational guidelines\n• Technology\nrelevant to the\nenterprise and the\nindividual’s work\n• Types of\nworkplace\ndocuments and\nforms\n• Basic\nmathematical\nconcepts\n• Kinds of\nworkplace report\n\n• Apply basic\nmathematical\nprocesses of\naddition,\nsubtraction,\ndivision and\nmultiplication\n• Data recording\n• Report writing\n\n--- PDF PAGE 6 ---\nTR- Land-based Transport Refrigeration Servicing NC II (New) Promulgated December 16, 2015 4\nRANGE OF VARIABLES\n\nVARIABLES\nRANGE\n1. Appropriate sources\n1.1.\nTeam members\n1.2.\nSuppliers\n1.3.\nTrade personnel\n1.4.\nLocal government\n1.5.\nIndustry bodies\n2. Medium\n2.1.\nMemorandum\n2.2.\nCircular\n2.3.\nNotice\n2.4.\nInformation discussion\n2.5.\nFollow-up or verbal instructions\n2.6.\nFace to face communication\n3. Storage\n3.1.\nManual filing system\n3.2.\nComputer-based filing system\n4. Forms\n4.1.\nPersonnel forms, telephone message forms,\nsafety reports\n5. Workplace\ninteractions\n5.1.\nFace to face\n5.2.\nTelephone\n5.3.\nElectronic and two way radio\n5.4.\nWritten including electronic, memos, instruction\nand forms, non-verbal including gestures, signals,\nsigns and diagrams\n6. Protocols\n6.1.\nObserving meeting\n6.2.\nCompliance with meeting decisions\n6.3.\nObeying meeting instructions\n\n--- PDF PAGE 7 ---\nTR- Land-based Transport Refrigeration Servicing NC II (New) Promulgated December 16, 2015 5\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1. Prepared written communication following standard\nformat of the organization\n1.2. Accessed information using communication\nequipment\n1.3. Made use of relevant terms as an aid to transfer\ninformation effectively\n1.4. Conveyed information effectively adopting the formal\nor informal communication\n2. Resource\nImplications\nThe following resources should be provided:\n2.1. Fax machine\n2.2. Telephone\n2.3. Writing materials\n2.4. Internet\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1. Direct Observation\n3.2. Oral interview and written test\n4. Context for\nAssessment\n4.1 Competency may be assessed individually in the\nactual workplace or through accredited institution\n\n--- PDF PAGE 8 ---\nTR- Land-based Transport Refrigeration Servicing NC II (New) Promulgated December 16, 2015 6\nUNIT OF COMPETENCY :\nWORK IN TEAM ENVIRONMENT\nUNIT CODE :"
