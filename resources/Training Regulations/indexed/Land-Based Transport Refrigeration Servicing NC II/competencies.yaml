        "source_text": "500311108\nUNIT DESCRIPTOR : This unit covers the outcomes required to comply with\nregulatory\nand\norganizational\nrequirements\nfor\noccupational health and safety.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1. Identify\nhazards\nand risks\n1.1 Safety regulations and\nworkplace safety and hazard\ncontrol practices and\nprocedures are clarified and\nexplained based on\norganization procedures\n1.2 Hazards/risks in the\nworkplace and their\ncorresponding indicators are\nidentified to minimize or\neliminate risk to co-workers,\nworkplace and environment in\naccordance with organization\nprocedures\n1.3 Contingency measures\nduring workplace accidents,\nfire and other emergencies\nare recognized and\nestablished in accordance\nwith organization procedures\n• OHS procedures and\npractices and\nregulations\n• Hazards/risks\nidentification and\ncontrol\n• OHS indicators\n• Organizational\ncontingency\npractices\n\n• Hazards/risks\nidentification\nand control\nskills\n• Practice of\nsafety and\nhealth\nprocedures and\npersonal\nhygiene\n\n2. Evaluate\nhazards\nand risks\n2.1 Terms of maximum tolerable\nlimits which when exceeded\nwill result in harm or damage\nare identified based on\nthreshold limit values (TLV)\n2.2 Effects of the hazards are\ndetermined\n2.3 OHS issues and/or concerns\nand identified safety hazards\nare reported to designated\npersonnel in accordance with\nworkplace requirements and\nrelevant workplace OHS\nlegislation\n• Threshold Limit\nValue -TLV\n• Effects of safety\nhazards\n\n• Communication\nskills\n• Reporting\nsafety hazards\n3. Control\nhazards\nand risks\n3.1 Occupational Health and\nSafety (OHS) procedures for\ncontrolling hazards/risks in\nworkplace are consistently\nfollowed\n\n• Personal hygiene\npractices\n• Organization safety\nand health protocol\n• Company emergency\nprocedure practices\n• Practice of\npersonal\nhygiene\n• Respond to\nemergency\n\n--- PDF PAGE 15 ---\nTR- Land-based Transport Refrigeration Servicing NC II (New) Promulgated December 16, 2015 13\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n3.2 Procedures for dealing with\nworkplace accidents, fire and\nemergencies are followed in\naccordance with organization\nOHS policies\n3.3 Personal protective\nequipment (PPE) is correctly\nused in accordance with\norganization OHS procedures\nand practices\n3.4 Appropriate assistance is\nprovided in the event of a\nworkplace emergency in\naccordance with established\norganization protocol\n\n4. Maintain\nOHS\nawareness\n4.1 Emergency-related drills\nand trainings are\nparticipated in as per\nestablished organization\nguidelines and procedures\n4.2 OHS personal records are\ncompleted and updated in\naccordance with workplace\nrequirements\n• Workplace OHS\npersonal records\n• Information on\nemergency-related\ndrills\n• Practice\nemergency-\nrelated drill\nskills in the\nworkplace\n\n--- PDF PAGE 16 ---\nTR- Land-based Transport Refrigeration Servicing NC II (New) Promulgated December 16, 2015 14\nRANGE OF VARIABLES\n\nVARIABLES\nRANGE\n1. Safety regulations\nMay include but are not limited to:\n1.1 Clean Air Act\n1.2 Building code\n1.3 National Electrical and Fire Safety Codes\n1.4 Waste management statutes and rules\n1.5 Philippine Occupational Safety and Health\nStandards\n1.6 DOLE regulations on safety legal requirements\n1.7 ECC regulations\n2. Hazards/Risks\nMay include but are not limited to:\n2.1 Physical hazards – impact, illumination, pressure,\nnoise, vibration, temperature, radiation\n2.2 Biological hazards- bacteria, viruses, plants,\nparasites, mites, molds, fungi, insects\n2.3 Chemical hazards – dusts, fibers, mists, fumes,\nsmoke, gasses, vapors\n2.4 Ergonomics\n2.4.1 Psychological factors – over exertion/\nexcessive force, awkward/static positions,\nfatigue, direct pressure, varying metabolic\ncycles\n2.4.2 Physiological factors – monotony, personal\nrelationship, work out cycle\n3. Contingency\nmeasures\nMay include but are not limited to:\n3.1 Evacuation\n3.2 Isolation\n3.3 Decontamination\n3.4 (Calling designed) emergency personnel\n4. Emergency-related\ndrills and training\n4.1 Fire drill\n4.2 Earthquake drill\n4.3 Basic life support/CPR\n4.4 First aid\n4.5 Spillage control\n4.6 Decontamination of chemical and toxic\n4.7 Disaster preparedness/management\n5. OHS personal\nrecords\n5.1 Medical/Health records\n5.2 Incident reports\n5.3 Accident reports\n5.4 OHS-related training completed\n\n--- PDF PAGE 17 ---\nTR- Land-based Transport Refrigeration Servicing NC II (New) Promulgated December 16, 2015 15\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Explained clearly established workplace safety and\nhazard control practices and procedures\n1.2 Identified hazards/risks in the workplace and its\ncorresponding indicators in accordance with company\nprocedures\n1.3 Recognized contingency measures during workplace\naccidents, fire and other emergencies\n1.4 Identified terms of maximum tolerable limits based on\nthreshold limit value- TLV.\n1.5 Followed Occupational Health and Safety (OHS)\nprocedures for controlling hazards/risks in workplace\n1.6 Used Personal Protective Equipment (PPE) in\naccordance with company OHS procedures and\npractices\n1.7 Completed and updated OHS personal records in\naccordance with workplace requirements\n2. Resource\nImplications\nThe following resources should be provided:\n2.1 Workplace or assessment location\n2.2 OHS personal records\n2.3 PPE\n2.4 Health records\n3. Methods of\nAssessment\nCompetency may be assessed through:\n3.1 Portfolio Assessment\n3.2 Interview\n3.3 Case Study/Situation\n4. Context for\nAssessment\nCompetency may be assessed in the work place or in a\nsimulated work place setting\n\n--- PDF PAGE 18 ---\nTR- Land-based Transport Refrigeration Servicing NC II (New) Promulgated December 16, 2015 16\nCOMMON COMPETENCIES\n\nUNIT OF COMPETENCY: PREPARE MATERIALS AND TOOLS\n\nUNIT CODE\n :"
