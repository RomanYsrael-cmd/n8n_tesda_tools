        "source_text": "HVC7315201\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes needed to\nwork safely in the workplace including sorting, cleaning and\ndispensing materials, tools and equipment, identifying and\nminimizing hazards, responding and recording accidents and\nfollowing basic security.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Sort materials,\ntools and\nequipment\n\n1.1 Materials, tools and equipment\nare classified according to its\nkinds\n1.2 Appropriate areas for materials,\ntools and equipment are\ndesignated\n• Classification of\ntools, equipment\nand materials\n• Selection of\nappropriate\nareas for storing\nmaterials, tools\nand equipment\n• Sorting\nprocedures and\nconsiderations\n•5S principles\n• Applying 5S\n(sorting)\n• Identifying\ntools and\nmaterials\n\n2. Clean\nworkplace\narea,\nmaterials,\ntools and\nequipment\n\n2.1 Cleaning materials are identified\nand used as per procedure\n2.2 Workplace areas, materials,\ntools and equipment are\ncleaned as per company\npractices\n2.3 Workplace are in safe state in\naccordance with safety\nregulations/ company practices\n• Cleaning\nmaterials, types\nand applications.\n• Procedures in\ncleaning\nworkplace area,\ntools and\nequipment.\n• Consideration of\na safe workplace\narea, tools and\nequipment\n• Applying 5S\n(cleaning)\n3. Systematize\ndispensing\nand\nretrieval of\nmaterials,\ntools and\nequipment\n3.1 Systems for requesting,\nborrowing and returning of\nmaterials, tools and equipment\nis in-place and implemented\n3.2 Forms used are completely\nfilled-up and filed\n3.3 Borrowed tools, and equipment\nare returned to designated area\n3.4 Consumable materials are\nrequested in exact quantity\n• Procedures in\ndispensing and\nretrieval of\nmaterials; tools,\nand equipment\n• Things to be\nconsidered in\nreturning the\nborrowed tools\nand equipment.\n• Applying 5S\n(systematize)\n• documentation\nskills\n4. Identify and\nminimize/\neliminate\nhazards\n\n4.1 Hazards in the work area are\nrecognized and\n reported to designated\npersonnel and appropriate\ncontrol actions are taken\n4.2 Workplace policies and\nprocedures for controlling risks\n• Composition of\nsafety committee\n• Policies and\nprocedures in\ncontrolling risk\n• Safety signs and\nfirst aid\n• Hazard\nidentification\nskills\n• Practice safety\nskills\n\n--- PDF PAGE 44 ---\nTR- Land-based Transport Refrigeration Servicing NC II (New) Promulgated December 16, 2015 42\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\nare established and followed\naccurately\n4.3 Workplace procedures for\ndealing with emergencies are\nfollowed whenever necessary\nwithin the scope of\nresponsibilities and\ncompetencies\n4.4 Safety signs and hazard\nwarnings are displayed and\nobserved at all times in line with\nworkplace health and safety\nregulations\n4.5 Equipment and safety\ndevices/PPE are used/ handled\naccording to company or\nmanufacturer's procedures and\nguidelines\n4.6 Work areas are kept clean, free\nfrom obstacles and emergency\nexits are known and kept clear\nat all times\n4.7 Safe manual handling/ fighting\ntechniques and safe equipment\noperation techniques are\nemployed at all times\n• Safety signs and\nhazards warning\npreparation\n• Equipment and\nsafety devices\n• Safe handling\ntechnique in\nusing equipment\nand safe\ndevices.\n\n5. Respond and\nrecord\naccidents\n5.1 Workplace accidents are\nidentified\n5.2 Workplace emergency first-aid\nprocedures/ treatment are\nfollowed/ carried out correctly in\naccordance with\nstandards/regulations and\nRAC Code of Practices/policies\n5.3 Medical assistance/ rescue is\ncoordinated with concerned\npersonnel in line with\norganizational policies\n5.4 Accident/incident records\nmaintained in accordance with\nstandard operating procedures\n• Types of\naccidents\n• Procedures in\napplying first aid/\ntreatment\n• First aid supplies\n• Steps in\nresponding to\nand recording\naccidents\n\n• First aid\napplication\nskills\n• Coordination\nskills\n• Documentatio\nn skills\n6. Follow basic\nsecurity\n6.1 Security policies/ procedures\nare followed according to\nenterprise practices and\nappropriate legislation\n6.2 Security related events are\nrecorded/reported on the\nrelevant forms\n6.3 Staff are advised of enterprise\nsecurity procedures and correct\nmethods of implementation\n• Basic security\nprocedures\n• Security signs\nand symbols\n• Loss control\nmanagement\no Hazards\no Safety signs\n\n• Coordination\nskills\n• Reporting\nskills\n• Documentatio\nn skills\n• Practice safety\nskills\n\n--- PDF PAGE 45 ---\nTR- Land-based Transport Refrigeration Servicing NC II (New) Promulgated December 16, 2015 43\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Hazards\nHazards that may be present in the workplace\ninclude but not limited to:\n1.1 Flammable materials\n1.2 Running machinery/equipment\n1.3 Toxic substances\n1.4 Debris\n1.5 Open flames\n1.6 Loose objects/fixtures\n1.7 Chemicals\n1.8 Electrical faults\n1.9 Hot metals\n2. Emergencies\nEmergencies may include but not limited to:\n2.1 Fire\n2.2 Explosion\n2.3 Spills\n2.4 Falls\n2.5 Electrocution\n2.6 Injuries caused by falling objects\n2.7 Injuries caused by sharp objects\n2.8 Injuries caused by wrong usage of tools\n3. Safety signs, symbols and\nhazard warnings\nSafety signs and symbols include but not limited to:\n3.1 Industry recognized hazard warning signs and\nsafety symbols\n3.1.1 Danger-High Voltage\n3.1.2 Unauthorized Persons Keep Out\n3.1.3 No Smoking\n3.1.4 Poisonous Gases\n3.1.5 Caution - Men working on line wires\n3.2 Internationally recognized hazard warning signs\nand safety symbols\n4. Personal Protective\nEquipment (PPE)\nPPE may include but not limited to:\n\n4.1\nGoggles\n4.2\nGas mask\n4.3\nWorking gloves\n4.4\nSafety shoes\n4.5\nFace shield\n4.6\nInsulating mat\n4.7\nOver-all apron\n4.8\nHard hat\n4.9\nSafety belt\n4.10 Protective eyewear\n\n--- PDF PAGE 46 ---\nTR- Land-based Transport Refrigeration Servicing NC II (New) Promulgated December 16, 2015 44\nVARIABLE\nRANGE\n5. First-aid Treatment\nFirst-aid treatment includes but is not limited to:\n5.1 CPR\n5.2 Mouth to mouth resuscitation\n5.3 Application of tourniquet\n5.4 Application of pressure to bleeding wounds or\ncuts\n5.5 First-aid treatment for burned victims\n6. Standards and Regulations\n6.1 RAC Code of Practice\n6.2 Philippine Electrical Code\n6.3 Philippine OH&S Standards\n6.4 Building Code\n6.5 Philippine Environmental Standards\n6.6 Welding Procedures Specifications\n6.7 Clean Air Act\n7. Security policies\n7.1 Wearing of ID\n7.2 Logging-in and out\n7.3 Wearing of uniform\n7.4 Observance of safety/security signs and\nsymbols\n\n--- PDF PAGE 47 ---\nTR- Land-based Transport Refrigeration Servicing NC II (New) Promulgated December 16, 2015 45\nEVIDENCE GUIDE\n1. Critical aspects of\nCompetency\nAssessment requires that the candidate:\n1.1 Classified materials, tools and equipment according to kind\n1.2 Cleaned workplace areas, materials, tools and equipment\nas per standard procedures\n1.3 Implemented systematize dispensing and retrieval of\nmaterials, tools and equipment\n1.4 Identified and described safety working practices relating to\nall tasks undertaken in the workplace\n1.5 Identified and selected appropriate equipment and safety\ndevices for particular workplace tasks and activities\n1.6 Interpreted hazard warnings and safety signs correctly and\ndescribed the application of these warnings and signs in the\nwork activities\n1.7 Carried out workplace emergency first-aid procedures/\ntreatment are in accordance with OHSA standards/\nlegislation and RAC Code of Practices\n1.8 Responded/maintained accidents/incidents records in\naccordance with SOPs\n1.9 Followed security procedures/policies in accordance with\nenterprise practices and legislation\n1.10 Kept workplace in safe state in accordance with safety\n Regulations\n2. Resource\nImplications\nThe following resources should be provided:\n2.1 Work place\n2.2 Materials, tools and equipment relevant to the proposed\nactivity/task\n2.3 Safety signs\n2.4 Safety devices\n2.5 Accident reporting procedures\n2.6 First-aid materials and guidelines\n3. Methods of\nAssessment\nCompetency should be assessed through:\n3.1 Direct observation while task is being undertaken\n3.2 Written test/questioning relevant to required knowledge\n\nAssessment of required knowledge and practical skills may be\ncombined\n4. Context for\nAssessment\n4.1 Competency assessment may occur in workplace or any\nappropriate simulated environment\n4.2 Assessment shall be observed while task are being\nundertaken whether individually or in group in accordance\nwith the approved industry OHSA regulations\n4.3 Competency assessment must be undertaken in\naccordance with the endorsed TESDA assessment\nguidelines\n\n--- PDF PAGE 48 ---\nTR- Land-based Transport Refrigeration Servicing NC II (New) Promulgated December 16, 2015 46\nUNIT OF COMPETENCY : DOCUMENT WORK ACCOMPLISHED\nUNIT CODE\n : HVC311205\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes in\ndocumenting work accomplished.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1. Identify\nforms and\ndata\n1.1 Forms are selected\nbased on the reports to\nbe prepared\n1.2 Data are collected based\non the reports to be\nprepared\n• Selecting and\ninterpreting forms\n• Interpreting work\naccomplished\n• Data gathering\ntechniques\n• Documentation\nskills\n• Interpretation skills\n• Data gathering\nskills\n2. Prepare\nreports\n2.1 Reports are completed\nusing standard form as\nper company procedures\n2.2 Reports provide details of\nwork completed, further\naction to be taken and\nother details as per\ncompany procedures\n2.3 Reports are comple