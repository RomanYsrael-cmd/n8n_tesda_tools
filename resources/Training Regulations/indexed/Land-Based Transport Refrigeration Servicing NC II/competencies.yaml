        "source_text": "--- PDF PAGE 61 ---\nTR- Land-based Transport Refrigeration Servicing NC II (New)     Promulgated December 16, 2015       59 \n \nUNIT OF COMPETENCY:  PERFORM START-UP, TEST AND COMMISSIONING OF \nTRANSPORT REFRIGERATION UNIT  \n \nUNIT CODE  \n        :   HVC712306 \n \nUNIT DESCRIPTOR        :  This unit covers the knowledge, skills and attitudes to \nperform start-up, testing and commissioning of transport \nrefrigeration unit for trucks and vans. This includes preparing \nfor start-up, test and commissioning of transport refrigeration \nunit, conducting start-up, test and commissioning of \ntransport refrigeration unit,  \n \nELEMENT \nPERFORMANCE CRITERIA\nItalicized fonts are elaborated \nin the  Range of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS\n1. Prepare for \nstart-up, test \nand \ncommissioning \nof transport \nrefrigeration unit \n1.1. Work instructions are \nread and interpreted to \ndetermine job \nrequirements \n1.2. Tools and equipment \nare selected in \naccordance with job \nrequirements \n1.3. Pre-start-up, testing \nand commissioning \nchecks are completed \nand complied with \nmanufacturer’s \nmanuals. \n1.4. Commissioning \nmethod, procedures \nand recording sheets \nare prepared in \naccordance with \nmanufacturer’s \nmanuals. \n1.5. PPEs are selected in \nline with job \nrequirements \n Safety signs and \nsymbols \n Forms: \no work instruction \nsheet \no job order sheet \no data sheet  \no manufacturer’s \nmanual \n Tools and testing \ninstruments \n Personal protective \nequipment \n \n Interpret work \ninstructions \n Selection of \nforms for \ncommissioning \n Selection and \nsafe handling of \ntools and testing \ninstruments \n selection of \nproper personal \nprotective \nequipment \n \n2. Conduct start-\nup, test and \ncommissioning \nof transport \nrefrigeration unit \n2.1 Electrical related \nchecks are performed \nbased on \nmanufacturer’s \nmanuals. \n2.2 Refrigerant piping \nand fitting connection \nrelated checks are \nperformed based on \nmanufacturer’s \nmanuals. \n2.3 Compressor unit \nrelated checks are \nperformed based on \n Basic electricity \n Operation of \ngenerator \n Electrical control \ntest procedures \n Interlocking control \nsequence \n Fundamentals of \npiping  \n Compressor test \nprocedures \n Power supply test \nprocedures \n Performing \nelectrical related \ntesting \n Performing pipe \nand tubing leak \ntesting \n Performing \ncompressor tests \n Performing \nevaporator/ \ncondenser motor \nand blower test \n Performing\n\n--- PDF PAGE 62 ---\nTR- Land-based Transport Refrigeration Servicing NC II (New)     Promulgated December 16, 2015       60 \nELEMENT \nPERFORMANCE CRITERIA\nItalicized fonts are elaborated \nin the  Range of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS\nmanufacturer’s \nmanuals. \n2.4 Temperature and \nairflow check is \nperformed based on \nmanufacturer’s manual \n2.5 Control panel related \nchecks are performed \nbased on \nmanufacturer’s \nmanuals  \n2.6 Sensing bulb and \nsensors are checked \nfor correct position \nbased on \nmanufacturer’s \nmanuals \n2.7 System operating \npressure and \ntemperature are \nchecked in \naccordance with \nmanufacturer's manual \n2.8 Start-up, testing and \ncommissioning reports \nare accomplished in \nline with enterprise \npolicies and \nprocedures.\n Condenser/ \nevaporator motor \nand blower test \nprocedures \n expansion valve \ntest procedures \n Leak testing \nprocedure \n Refrigerant type \ntest procedure \n Start-up and \ncommissioning \nforms \nexpansion valve \ntest \n Performing \nidentification of \nrefrigerants \n Filling-up of start-\nup and \ncommissioning \nreports\n\n--- PDF PAGE 63 ---\nTR- Land-based Transport Refrigeration Servicing NC II (New)     Promulgated December 16, 2015       61 \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Electrical related checks \nThis includes: \n1.1 Power supply source checks \n1.2 Safety and circuit protection checks \n1.3 Wiring insulations checks  \n1.4 Grounding and short circuit checks \n2. Refrigerant piping and fitting \nconnection related checks \nMay include: \n2.1 Leak testing \n2.2 Pipe insulation inspection \n2.3 Pipe and fittings inspection \n2.4 Clamps and brackets inspection \n3. Compressor unit related \nchecks \nMay include: \n3.1 Belt tension and pulley alignment \n3.2 Terminal connection inspection \n3.3 Mounting and alignment inspection \n4. Control panel related checks \nMay include but not limited to: \n4.1 main switch \n4.2 Control switch (on/off)  \n4.3 indicator lights \n4.4 temperature display indicator \n4.5 fuse, relays and sockets/connectors \n4.6 meter indicators \n4.7 wire harness\n\n--- PDF PAGE 64 ---\nTR- Land-based Transport Refrigeration Servicing NC II (New)     Promulgated December 16, 2015       62 \n EVIDENCE GUIDE \n1. Critical aspects \nof competency \nAssessment requires evidence that the candidate: \n1.1 \nPrepared for start-up, testing and commissioning of \ntransport refrigeration unit \n1.2 \nConducted start-up, testing and commissioning of \ntransport refrigeration unit \n2.  Resource \nImplications \n \n \nThe following resources MUST be provided: \n2.1 Work place location \n2.2 Tools and equipment appropriate in performing start-up, \ntesting and commissioning refrigeration and air-\nconditioning systems \n2.3  Materials relevant to the proposed activity \n2.4  Drawings and specifications relevant to the task \n3.  Methods of \nAssessment \nCompetency must be assessed through: \n3.1. Demonstration with oral questioning  \n3.2. Direct observation with oral questioning \n4.  Context for \nAssessment \nCompetency may be assessed in the work place or in a \nsimulated work place setting\n",
