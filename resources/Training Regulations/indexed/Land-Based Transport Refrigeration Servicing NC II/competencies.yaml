          "source_text": "REQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1.  Sort materials, \ntools and \nequipment \n \n \n1.1  Materials, tools and equipment \nare    classified according to its \nkinds \n1.2  Appropriate areas for materials, \ntools and equipment are \ndesignated \n Classification of \ntools, equipment \nand materials \n Selection of \nappropriate \nareas for storing \nmaterials, tools \nand equipment \n Sorting \nprocedures and \nconsiderations \n5S principles\n Applying 5S \n(sorting) \n Identifying \ntools and  \nmaterials \n \n2.  Clean \nworkplace \narea, \nmaterials, \ntools and \nequipment \n \n2.1 Cleaning materials are identified \nand used as per procedure \n2.2 Workplace areas, materials, \ntools and equipment are \ncleaned as per company \npractices \n2.3  Workplace are in safe state in \naccordance with safety \nregulations/ company practices \n Cleaning \nmaterials, types \nand applications. \n Procedures in \ncleaning \nworkplace area, \ntools and \nequipment. \n Consideration of \na safe workplace \narea, tools and \nequipment\n Applying 5S \n(cleaning) \n3.  Systematize \ndispensing \nand      \nretrieval of \nmaterials, \ntools and \nequipment  \n3.1 Systems for requesting, \nborrowing and returning of \nmaterials, tools and equipment \nis in-place and implemented \n3.2 Forms used are completely \nfilled-up and  filed \n3.3  Borrowed tools, and equipment \nare returned to designated area \n3.4  Consumable materials are \nrequested in exact quantity \n Procedures in \ndispensing and \nretrieval of \nmaterials; tools, \nand equipment \n Things to be \nconsidered in \nreturning the \nborrowed tools \nand equipment.\n Applying 5S \n(systematize) \n documentation \nskills \n4.  Identify and \nminimize/ \neliminate \nhazards \n \n4.1 Hazards in the work area are \nrecognized and  \n       reported to designated \npersonnel and appropriate \ncontrol actions are taken \n4.2  Workplace policies and \nprocedures for controlling