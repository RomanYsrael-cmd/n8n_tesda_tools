f manuals\nused in HVAC/R\nsector\n• Manual storing and\nmaintaining\nprocedures\n• Storing and\nmaintaining\nmanuals\n\n--- PDF PAGE 26 ---\nTR- Land-based Transport Refrigeration Servicing NC II (New) Promulgated December 16, 2015 24\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Procedures, specifications and\nmanuals of instructions\n\nKinds of Manuals:\n1.1 Manufacturer's Specification Manual\n1.2 Repair Manual\n1.3 Maintenance Procedure Manual\n1.4 Periodic Maintenance Manual\n\nEVIDENCE GUIDE\n1. Critical aspects\n of Competency\nAssessment requires that the candidate:\n1.1 Identified and accessed specification/manuals as per job\nrequirements\n1.2 Interpreted manuals in accordance to industry practices\n1.3 Applied information in manuals according to the given task\n1.4 Stored manuals in accordance with company requirements\n2. Resource\nImplications\nThe following resources should be provided:\nAll manuals/catalogues relative to HVAC/R sector\n3. Methods of\nAssessment\nCompetency should be assessed through:\n3.1 Direct Observation\n3.2 Questions/Interview\n\nAssessment of required knowledge and practical skills may be\ncombined\n4. Context for\nAssessment\n4.1 Competency assessment must be undertaken in accordance\nwith the endorsed TESDA assessment guidelines\n4.2 Assessment may be conducted in the workplace or a simulated\nenvironment\n\n--- PDF PAGE 27 ---\nTR- Land-based Transport Refrigeration Servicing NC II (New) Promulgated December 16, 2015 25\nUNIT OF COMPETENCY: PERFORM MENSURATIONS AND CALCULATIONS\n\nUNIT CODE\n :"
