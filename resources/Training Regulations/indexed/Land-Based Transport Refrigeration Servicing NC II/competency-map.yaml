  "source_text": "Section 1. Successful candidates\nshall be awarded a National Certificate II signed by the TESDA Director\nGeneral.\n\n4.2\nThe qualification of Land-Based Transport Refrigeration Servicing\nNC II can be attained through demonstration of competence through\nproject-type assessment covering all required units of the qualification:\n\n4.3\nAssessment shall focus on the core units of competency. The basic and\ncommon units shall be integrated or assessed concurrently with the core\nunits.\n\n4.4\nThe following are qualified to apply for assessment and certification:\n\n4.4.1 Graduates of formal and non-formal including enterprise-based\neducation/training programs/courses\n\n4.4.2 Experienced Workers (wage employed or self-employed)\n\n4.5\nFor individuals, holders of National Certificate of Transport RAC\nServicing NC II shall be converted to Land-Based Transport\nRefrigeration Servicing NC II upon renewal, provided they are already\nemployed and have related experience in transport refrigeration for the\npast three (3) years along the qualification.\n\n4.6\nThe guidelines on assessment and certification are discussed in detail in\nthe \"Procedures Manual on Assessment and Certification\" and\n\"Guidelines on the Implementation of the Philippine TVET Competency\nAssessment and Certification System (PTCACS)\".\n\n--- PDF PAGE 92 ---\nTR- Land-based Transport Refrigeration Servicing NC II (New) Promulgated December 16, 2015 90\nCOMPETENCY MAP - HVAC/R Sector\nLand-based Transport Refrigeration Servicing NC II\n\nCORE COMPETENCIES\n\nInstall window- type AC/\ndomestic refrigeration\nunits\nService & maintain\nwindow-type AC/\ndomestic refrigeration\nunits\nTroubleshoot window-\ntype AC/domestic\nrefrigeration systems\nRecover & recycle\nrefrigerant in window-\ntype AC/domestic\nrefrigeration systems\nRepair & retrofit\nwindow-type\nAC/ domestic\nrefrigeration systems\nPerform Testing and\ncommissioning for\nwindow-type AC/domestic\nrefrigeration\nInstall package-type air-\nconditioning unit (PACU)\n/ commercial refrigeration\nequipment (CRE)\n\nInstall PACU/CRE\nelectrical systems\n\nInstall PACU/CRE\npiping systems\n\nService & maintain\nPACU/CRE units\n\nSurvey site for installation\n\nTroubleshoot PACU/CRE\nsystems\nRecover / recycle\nrefrigerant in PACU/\nCRE systems\nRepair & retrofit\nPACU/CRE systems &\nits accessories\nPerform start-up, testing\nand\ncommissioning for\nPACU/CRE\nInstall transport air-\nconditioning\n& refrigeration units\nService & maintain\ntransport AC\n& refrigeration units\nRecover & recycle\nrefrigerant in transport\nAC & refrigeration\nsystems\nTroubleshoot transport\nair-conditioning &\nrefrigeration\nsystems\nPerform testing &\ncommissioning for\ntransport AC &\nrefrigeration\nRepair & retrofit transport\nac & refrigeration systems\n& its accessories\nInstall package-type air-\nconditioning unit (PACU)\nInstall commercial\nrefrigeration equipment\n(CRE)\nService & maintain\nPACU\nService & maintain CRE\n\nTroubleshoot and repair\nPACU\n\nTroubleshoot and repair\nCRE\nPerform start-up, test\nand\ncommissioning for PACU\nPerform start-up, test\nand\ncommissioning for CRE\nService and maintain\nLand-based Transport\nMAC units\nInstall Domestic RAC\nunits\nService & maintain\nDomestic RAC units\nTroubleshoot & Repair\nDomestic RAC systems\nTroubleshoot and repair\nLand-based Transport\nMAC systems\nPerform start-up, testing\nand commissioning for\nLand-based Transport\nMAC systems\nService and maintain\ntransport refrigeration\nunits\nTroubleshoot and repair\ntransport refrigeration\nsystems\nPerform start-up, test\nand commissioning of\ntransport refrigeration\nunit\n\nCOMMON COMPETENCIES\n\nPrepare materials\nand tools\nInterpret technical\ndrawings\nObserve procedures,\nspecifications &\nmanuals of instructions\nPerform mensurations\n& calculations\nPerform basic\nbenchwork\nPerform basic\nelectrical works\nMaintain tools and\nequipment\nPerform housekeeping\nand safety practices\nDocument work\naccomplished\n\nBASIC COMPETENCIES\n\nReceive and Respond to\nWorkplace\nCommunication\nWork with Others\nDemonstrate work\nvalues\nPractice basic\nhousekeeping\nprocedures\nParticipate in Workplace\nCommunication\nWork in a Team\nEnvironment\nPractice career\nprofessionalism\nPractice occupational\nhealth and safety\nprocedures\nLead Workplace\nCommunication\nLead Small Team\nDevelop and practice\nnegotiation skills\nSolve Problems\nRelated to Work\nActivities\nUse mathematical\nconcepts and\ntechniques\nUse relevant\ntechnologies\nUtilize Specialist\nCommunication Skills\nDevelop Team and\nIndividuals\nApply Problem Solving\nTechniques in the\nWorkplace\nCollect, analyze and\norganize information\nPlan and Organize Work\nPromote environmental\nprotection\n\nANNEX A\n\n--- PDF PAGE 93 ---\nTR- Land-based Transport Refrigeration Servicing NC II (New) Promulgated December 16, 2015 91\nDEFINITION OF TERMS\n\nGENERAL\n\n1) Certification - is the process of verifying and validating the competencies\nof a person through assessment\n\n2) Certificate of Competency (COC) – is a certification issued to individuals\nwho pass the assessment for a single unit or cluster of units of competency\n\n3) Common Competencies - are the skills and knowledge needed by all\npeople working in a particular industry\n\n4) Competency - is the possession and application of knowledge, skills and\nattitudes to perform work activities to the standard expected in the\nworkplace\n\n5) Competency Assessment - is the process of collecting evidence and\nmaking judgments on whether competency has been achieved\n\n6) Competency Standard (CS) - is the industry-determined specification of\ncompetencies required for effective work performance\n\n7) Context of Assessment - refers to the place where assessment is to be\nconducted or carried out\n\n8) Core Competencies - are the specific skills and knowledge needed in a\nparticular area of work - industry sector/occupation/job role\n\n9) Critical aspects of competency - refers to the evidence that is essential\nfor successful performance of the unit of competency\n\n10) Elective Competencies - are the additional skills and knowledge\nrequired by the individual or enterprise for work\n\n11) Elements - are the building blocks of a unit of competency. They describe\nin outcome terms the functions that a person performs in the workplace.\n\n12) Evidence Guide - is a component of the unit of competency that defines or\nidentifies the evidences required to determine the competence of the\nindividual. It provides information on critical aspects of competency,\nunderpinning knowledge, underpinning skills, resource implications,\nassessment method and context of assessment\n\n13) Level - refers to the category of skills and knowledge required to do a job\n\n14) Method of Assessment - refers to the ways of collecting evidence and\nwhen, evidence should be collected\n\n--- PDF PAGE 94 ---\nTR- Land-based Transport Refrigeration Servicing NC II (New) Promulgated December 16, 2015 92\n15) National Certificate (NC) – is a certification issued to individuals who\nachieve all the required units of competency for a national qualification\ndefined under the Training Regulations. NCs are aligned to specific levels\nwithin the PTQF\n\n16) Performance Criteria - are evaluative statements that specify what is to\nbe assessed and the required level of performance\n\n17) Qualification - is a cluster of units of competencies that meets job roles\nand is significant in the workplace. It is also a certification awarded to a\nperson on successful completion of a course in recognition of having\ndemonstrated competencies in an industry sector\n\n18) Range of Variables - describes the circumstances or context in which the\nwork is to be performed\n\n19) Recognition of Prior Learning (RPL) – is the acknowledgement of an\nindividual’s skills, knowledge and attitudes gained from life and work\nexperiences outside registered training programs\n\n19) Resource Implication - refer to the resources needed for the successful\nperformance of the work activity described in the unit of competency. It\nincludes work environment and conditions, materials, tools and equipment\n\n20) Basic Competencies - are the skills and knowledge that everyone needs\nfor work\n\n21) Training Regulations (TR) – refers to the document promulgated and\nissued by TESDA consisting of competency standards, national\nqualifications and training guidelines for specific sectors/occupations. The\nTR serves as basis for establishment of qualification and certification under\nthe PTQF. It also serves as guide for development of competency-based\ncurricula and instructional materials including registration of TVET\nprograms offered by TVET providers\n\n22) Underpinning Knowledge - refers to the competency that involves in\napplying knowledge to perform work activities. It includes specific\nknowledge that is essential to the performance of the competency\n\n23) Underpinning Skills - refers to the list of the skills needed to achieve the\nelements and performance criteria in the unit of competency. It includes\ngeneric and industry specific skills\n\n24) Unit of Competency – is a component of the competency standards\nstating a specific key function or role in a particular job or occupation; it is\nthe smallest component of achievement that can be assessed and certified\nunder the PTQF\n\n--- PDF PAGE 95 ---\nTR- Land-based Transport Refrigeration Servicing NC II (New) Promulgated December 16, 2015 93\n\nSECTOR SPECIFIC\n\n1) Accumulator – is used on systems that accommodate an orifice tube to\nmeter refrigerants into the evaporator. It is connected directly to the\nevaporator outlet and stores excess liquid refrigerant. The chief role of the\naccumulator is to isolate the compressor from any damaging liquid\nrefrigerant. Accumulators, like receiver-driers, also remove debris and\nmoisture from a system.\n\n2) Air Conditioning - is the cooling, heating, dehumidification, and filtration of\nthe air located within the passenger compartment of a vehicle.\n\n3) Air Cooled Condenser – an equipment that condenses refrigerant vapor\nusing air as the condensing medium\n\n4) Air Distribution – the process of distributing conditioned air into a confined\nspace\n\n5) Charge - A specific amount of refrigerant or compressor oil by weight. The\nvehicle manufacturer for individual A/C system applications specifies this.\n\n6) Charging - The process of placing a specified amount of refrigerant and\ncompressor oil into an A/C or refrigeration system.\n\n7) Check – to verify, inspect, or test an HVAC/R component for satisfactory\ncondition with the use of an instrument or a device\n\n8) Compressor - commonly referred to as the heart of the system, the\ncompressor is a belt driven pump that is fastened to the engine. It is\nresponsible for compressing and transferring refrigerant gas.\n\n9) Condenser - is the area in which heat dissipation occurs. The condenser\nis designed to radiate heat. As hot compressed gasses are introduced into\nthe top of the condenser, they are cooled off. As the gas cools, it\ncondenses and exits the bottom of the condenser as a high pressure liquid.\n\n10) Conversion – Is a process of applying a flammable, non-ozone depleting\nsubstance and low global warming potential refrigerant to a system that\nordinarily uses non-flammable, ozone depleting substance and high global\nwarming potential refrigerant. It not only deals with refrigerant replacement\nbut taking into consideration how to mitigate the flammability risk of the\nprocess.\n\n11) Dehydration – the process of removing moisture from a refrigeration\nsystem\n\n12) Electric Heat Defrost – use of electric resistance heating coils to melt ice\nor frost from evaporators\n\n--- PDF PAGE 96 ---\nTR- Land-based Transport Refrigeration Servicing NC II (New) Promulgated December 16, 2015 94\n13) Evacuation – removal of air/any gas and moisture from a refrigeration\nsystem\n\n14) Evaporator – is located in the interior of the vehicle. Its primary function is\nto transfer heat contained in the passenger compartment air, into the\nrefrigerant, which is circulated by the compressor, through the evaporator\ncoil. During this process the air is also filtered and dehumidified.\n\n15) Fan – a mechanical device for moving air\n\n16) Fan Coil Unit (FCU) – an air-conditioning component that consists of a fan\n motor and an evaporator coil\n\n17) Filter Drier – the component part used in air-conditioning or refrigeration\n system to filter and dehydrates refrigerant in the system\n\n18) Idler Pulley – a pulley used to maintain proper belt tension\n\n19) Inspect – determine the actual condition of HVAC/R component without\nthe use of instrument\n\n20) Interlocking – it is the action of interconnecting electric control wires to\nachieve a sequential action\n\n21) Leak Test – the procedure of determining/pin pointing leaks in a\npressurized system\n\n22) Liquid Line Solenoid Valve – electrically operated valve that shuts-off the\nflow of the refrigerant to the evaporator.\n\n23) Manifold Gauge Set – provides access to and monitors pressures within\nthe system. Manifold gauge sets are available in different configurations\nand styles. 3--way or 4--way, liquid filled gauges, with or without a sight\nglass, 3 hoses or 4 hoses, 1/4 inch or 3/8 inch manifold connections, etc.\n\n24) Metering Device – it is one of the major components in a refrigeration\nsystem used to regulate the flow of refrigerant into the evaporator\n\n25) REFRIGERATION unit – see Transport refrigeration unit.\n\n26) Pull-out – to remove from a place of installation\n\n27) Pressure Switches -- the systems use high and low pressure switches\nwired in series to control the power circuit of the compressor clutch relay. If\neither pressure switch opens, interrupting the circuit to the clutch relay, the\noperation of the compressor will stop. When conditions return to normal the\nswitch will automatically reset and the compressor will resume operating.\nThe switches are non--adjustable.\n\n--- PDF PAGE 97 ---\nTR- Land-based Transport Refrigeration Servicing NC II (New) Promulgated December 16, 2015 95\n28) Pressure Test – a procedure whereby pressure is applied to the piping\nsystem, the purpose of which is to determine its soundness and stability\n\n29) Pump down – a process of using the compressor to pump and contain all\nthe refrigerant charge into the condenser and/or receiver\n\n30) Recovery/Recycle Machine (R134a) - Recovers and recycles R134a\nrefrigerant that is present within the air conditioning system.\n\n31) Refrigerant -- is a material that is used to move heat from the passenger\ncompartment to the outside air. It is a substance that gives up heat by\ncondensing at high temperature and pressures and absorbs heat by\nevaporating at low temperatures and pressures. The heat transfer\nproperties exhibited when refrigerant changes state is the foundation of the\nrefrigerant cycle. Most Transport MAC systems use R134a.\n\n32) Refrigerant Charging – the process of introducing into the system the\nproper amount of refrigerant\n\n33) Refrigerant Cylinder -- Storage tank for R134a.\n\n34) Refrigerant Scale -- Accurately weighs the transfer of refrigerant into the\nair--conditioning system.\n\n35) Retrofit - the process of changing or converting an R12 A/C system to\nR134a. This may require the replacement of certain components\ndepending on the application.\n\n36) Retrofitting – a process of upgrading existing equipment or system using\nozone depleting substances to environmental friendly refrigerant\n\n37) Service Mechanic – worker who possess basic skills related to HVAC/R\nsystem\n\n38) Sight Glass/Liquid Line Moisture Indicator – indicates refrigerant quality\nand charge\n\n39) Supervised Industry Training – similar to on-the-job training – an\napproach in training designed to enhance the knowledge and skills of the\ntrainee through actual experience in the workplace to acquire specific\ncompetencies prescribed in the training regulations.\n\n40) Thermostat Expansion Valve (TXV) – a refrigerant control valve\nconnected before an evaporator that regulates flow of refrigerant.\nOperated by temperature and pressure, and reacts to the degree of gas\nsuperheat at the evaporator outlet through a feeler bulb\n\n--- PDF PAGE 98 ---\nTR- Land-based Transport Refrigeration Servicing NC II (New) Promulgated December 16, 2015 96\n\n41) Transport Refrigeration Unit – refers to refrigeration unit driven directly\nfrom the turning axle of the vehicle when they are in motion, or by the\nvehicle engine itself, or by a separate gasoline/diesel engine and/or electric\nmotor mounted on the same vehicle. It covers the land and marine/sea\ntransports.\n\n42) Troubleshoot – the process of analyzing system defect or malfunction\n\n43) Vacuum – pressure lower than atmospheric pressure measured in inches\nof mercury. Complete vacuum is 29.92 in. mercury or at least 500 microns\n\n44) Vacuum Pump – Removes moisture and air from the air conditioning\nsystem in order to obtain required micron level.\n\n45) Water Treatment – the use of chemicals in water to prevent corrosion,\nformation of scales, algae growth and formation of slime\n\n46) Workmanlike-manner – quality of work within the accepted industry\nstandard\n\n--- PDF PAGE 99 ---\nTR- Land-based Transport Refrigeration Servicing NC II (New) Promulgated December 16, 2015 97\nACKNOWLEDGEMENTS\n\nThe Technical Education and Skills Development Authority (TESDA) wishes\nto extend thanks and appreciation to the many representatives of business,\nindustry, academe and government agencies who donated their time and expertise\nto the development and validation of these Training Regulations.\n\n• THE TECHNICAL EXPERT COMMITTEE\n\nMR. MANUEL P. AZUCENA\nUNEP-ROWA / RACTAP\n\nMR. EDUARDO M. FERNANDEZ\nTUP – Manila / PSVARE / RACTAP\n\nMR. RAMON ELIAS F. ORTIZ\nMaintenance Ass’n of the Phil. (MAPHIL)/\nRef & Aircon Technician for Devt. Assn of the Phils.(RACTAP)\n\n•\nVALIDATION EXPERTS COMMITTEE\n\nMR. ROLYN S. SAPATOSE\nS-Coolmate Airconditioning and\n Refrigeration Services\nMR. CARLO S. BONIAO\nThe Key Car Aircon and Refrigeration\n\nMR. DOROTEO U. PASTRANA, JR.\nCooling Point Industry, Inc.\nMR. HECTOR V. PEREZ\nRAMS Cooling Solution\nMR. REDEN S. IGANA\nKenwood Cold Storage\nMR. WILLIAM M. SY\nCirrus Auto Climate,Inc.\n\n•\nTHE PHILIPPINE SOCIETY OF VENTILATING, AIR-CONDITIONING AND REFRIGERATION\nENGINEERS, INC. (PSVARE)\n\n•\nTHE TESDA BOARD - STANDARDS SETTING AND SYSTEMS DEVELOPMENT COMMITTEE\n\n•\nTHE MANAGEMENT AND STAFF OF THE TESDA SECRETARIAT\n\n• Qualifications and Standards Office (QSO)\n\n•\nLuz Victoria G. Amponin\n-\nTESDA-QSO\n•\nZoilo C. Galang\n-\nTESDA-QSO-CSDD\n•\nSamuel E. Calado, Jr.\n-\nTESDA-QSO-CSDD\n•\nFamy L. Pepito\n-\nTESDA-QSO-CTADD\n•\nRaymundo C. Vergara\n-\nTESDA-QSO-CPSDD"
