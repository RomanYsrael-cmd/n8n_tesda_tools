  "source_text": "SECTION 4\nNATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1\nTo attain the National Qualification of Land-Based Transport\nRefrigeration Servicing NC II, the candidate must demonstrate\ncompetence in all the units listed in Section 1. Successful candidates\nshall be awarded a National Certificate II signed by the TESDA Director\nGeneral.\n\n4.2\nThe qualification of Land-Based Transport Refrigeration Servicing\nNC II can be attained through demonstration of competence through\nproject-type assessment covering all required units of the qualification:\n\n4.3\nAssessment shall focus on the core units of competency. The basic and\ncommon units shall be integrated or assessed concurrently with the core\nunits.\n\n4.4\nThe following are qualified to apply for assessment and certification:\n\n4.4.1 Graduates of formal and non-formal including enterprise-based\neducation/training programs/courses\n\n4.4.2 Experienced Workers (wage employed or self-employed)\n\n4.5\nFor individuals, holders of National Certificate of Transport RAC\nServicing NC II shall be converted to Land-Based Transport\nRefrigeration Servicing NC II upon renewal, provided they are already\nemployed and have related experience in transport refrigeration for the\npast three (3) years along the qualification.\n\n4.6\nThe guidelines on assessment and certification are discussed in detail in\nthe \"Procedures Manual on Assessment and Certification\" and\n\"Guidelines on the Implementation of the Philippine TVET Competency\nAssessment and Certification System (PTCACS)\".\n\n--- PDF PAGE 92 ---\nTR- Land-based Transport Refrigeration Servicing NC II (New) Promulgated December 16, 2015 90\n"
}
