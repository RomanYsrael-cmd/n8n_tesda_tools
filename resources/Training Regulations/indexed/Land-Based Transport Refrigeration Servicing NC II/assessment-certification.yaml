      "number": "33",
      "text": "Refrigerant Cylinder -- Storage tank for R134a."
    },
    {
      "number": "34",
      "text": "Refrigerant Scale -- Accurately weighs the transfer of refrigerant into the air--conditioning system."
    },
    {
      "number": "35",
      "text": "Retrofit - the process of changing or converting an R12 A/C system to R134a. This may require the replacement of certain components depending on the application."
    },
    {
      "number": "36",
      "text": "Retrofitting – a process of upgrading existing equipment or system using ozone depleting substances to environmental friendly refrigerant"
    },
    {
      "number": "37",
      "text": "Service Mechanic – worker who possess basic skills related to HVAC/R system"
