        "source_title": "LEAD WORKPLACE COMMUNICATION",
        "source_text": "--- PDF PAGE 4 ---\n-------------------------------------------------------------------------------------------------------     \nTR – Bookkeeping NC III                                                                  Promulgated November 2007 \n2\nSECTION 2 COMPETENCY STANDARDS \n \nThis section gives the details of the contents of the units of competency \nrequired in BOOKKEEPING NC III.  These units of competency are categorized into \nbasic, common and core competencies.   \n \nBASIC COMPETENCIES \n \nUNIT OF COMPETENCY   :   LEAD WORKPLACE COMMUNICATION \n \nUNIT CODE \n      :   500311109 \n \n    UNIT DESCRIPTOR    : This unit covers the knowledge, skills and attitudes    \nrequired to lead in the dissemination and discussion of \nideas, information and issues in the workplace. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the  \nRange of Variables\n1.  Communicate \ninformation about \nworkplace processes \n1.1. Appropriate communication method is selected  \n1.2. Multiple operations involving several topics areas \nare communicated accordingly \n1.3. Questions are used to gain extra information \n1.4. Correct sources of information are identified \n1.5. Information is selected and organized correctly \n1.6. Verbal and written reporting is undertaken when \nrequired \n1.7. Communication skills are maintained in all \nsituations\n2.  Lead workplace \ndiscussions \n2.1. Response to workplace issues are sought  \n2.2. Response to workplace issues are provided \nimmediately \n2.3. Constructive contributions are made to workplace \ndiscussions on such issues as production, quality \nand safety \n2.4. Goals/objectives and action plan  undertaken in \nthe workplace are communicated\n3.   Identify and \ncommunicate issues \narising in the \nworkplace \n3.1. Issues and problems are identified as they arise \n3.2. Information regarding problems and issues are \norganized coherently to ensure clear and \neffective communication \n3.3. Dialogue is initiated with appropriate personnel \n3.4. Communication problems and issues are raised \nas they arise\n\n--- PDF PAGE 5 ---\n-------------------------------------------------------------------------------------------------------     \nTR – Bookkeeping NC III                                                                  Promulgated November 2007 \n3\nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n \n1.   Methods of \ncommunication \n1.1.   Non-verbal gestures \n1.2.   Verbal \n1.3.   Face to face \n1.4.   Two-way radio \n1.5.   Speaking to groups \n1.6.   Using telephone \n1.7.   Written \n1.8.   Internet\n\n--- PDF PAGE 6 ---\n-------------------------------------------------------------------------------------------------------     \nTR – Bookkeeping NC III                                                                  Promulgated November 2007 \n4\nEVIDENCE GUIDE \n1.   Critical aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1.    Dealt with a range of communication/information at one \ntime \n1.2.    Made constructive contributions in workplace issues \n1.3.    Sought workplace issues effectively \n1.4.    Responded to workplace issues promptly \n1.5.    Presented information clearly and effectively written \nform \n1.6.    Used appropriate sources of information \n1.7.    Asked appropriate  questions \n1.8.    Provided accurate information  \n2.   Underpinning \nknowledge  \n2.1. Organization requirements for written and electronic \ncommunication methods \n2.2.    Effective verbal communication methods \n3.  Underpinning \nSkills \n3.1.    Organize information \n3.2.    Understand and convey intended meaning \n3.3.    Participate in variety of workplace discussions \n3.4.  Comply with organization  requirements for the use of \nwritten and electronic communication methods \n4.   Resource \nImplications \nThe following resources MUST be provided: \n4.1.   Variety of Information \n4.2.   Communication tools \n4.3.    Simulated workplace \n5.   Methods of \nAssessment \nCompetency may be assessed through: \n5.1.    Direct Observation \n5.2.    Interview \n6.   Context  for \nAssessment \n6.1.  Competency may be assessed in the workplace or in \nsimulated workplace environment \n6.2.  Assessment shall be observed while task are being  \nundertaken whether individually or in-group\n",
