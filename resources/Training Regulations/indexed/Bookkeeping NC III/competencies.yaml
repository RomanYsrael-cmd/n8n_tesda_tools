        - {variable: Income/expense titles, values: [Sales, Salaries, Rent income, Rent expense, Purchases, Taxes and licenses, Utilities, Stationery and supplies, Insurance and bonds, Transportation and travel]}
        - {variable: Journal entries, values: [Routine journal entries, Adjusting journal entries, Closing entries]}
      evidence_guide:
        critical_aspects: [Prepare ledger, Transfer journal entries, Summarize each ledger account]
