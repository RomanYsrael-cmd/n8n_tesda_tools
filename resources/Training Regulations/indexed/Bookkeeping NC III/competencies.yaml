        "source_text": "HCS412305\n\nUNIT DESCRIPTOR: This unit covers the knowledge, skills, and attitudes in\nreviewing and determining extent of compliance with a\nfirm’s internal control manual.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\n1. Check policy compliance\n\n1.1 Internal control manual is\nprepared/updated in accordance\nwith industry practice\n1.2 Compliance is checked and\nvalidated in accordance with the\ninternal control system\n2. Prepare policy compliance report\n2.1 Policy compliance reports are\nprepared in accordance with the\ninternal control system\n2.2 Policy compliance reports are\nsubmitted to management for\nvalidation.\n2.3 Policy compliance reports are filed\nfor future reference.\n\n--- PDF PAGE 52 ---\n-------------------------------------------------------------------------------------------------------\nTR – Bookkeeping NC III Promulgated November 2007\n50\nRANGE OF VARIABLES\n\nVARIABLE\n\nRANGE\n1. Accounting Reports\n May include but are not limited to:\n1.1 Monthly reports\n1.2 Quarterly compliance reports\n1.3 Annual compliance reports\n2. Policy compliance\nMay include but are not limited to:\n2.1 Sales policy\n2.2 HR Policies\n\n--- PDF PAGE 53 ---\n-------------------------------------------------------------------------------------------------------\nTR – Bookkeeping NC III Promulgated November 2007\n51\nEVIDENCE GUIDE\n\n1. Critical aspects of competency\n Assessment requires evidence that the\ncandidate:\n1.1 Prepared internal control manual\n1.2 Prepared compliance reports\n2. Underpinning knowledge\n2.1 Internal control principles\n2.2 Management policies\n3. Underpinning skills\n3.1 Using four (4) fundamental\nmathematical operations\n3.2 Reading and comprehension skills\n3.3 Communication skills\n3.4 Computer/calculator operation\nskills\n4. Resource implications\nThe following resources MUST be\nprovided:\n4.1 Workplace: real or simulated work\narea\n4.2 Appropriate tools and equipment\n4.3 Materials/supplies relevant to the\nactivity\n5. Method of assessment\nCompetency MUST be assessed\nthrough:\n5.1 Written Examination\n5.2 Work Related Project\n6. Context of assessment\n6.1 Competency may be assessed in\nthe workplace or in a simulated\nwork setting.\n\n--- PDF PAGE 54 ---\n-------------------------------------------------------------------------------------------------------\nTR – Bookkeeping NC III Promulgated November 2007\n52"
