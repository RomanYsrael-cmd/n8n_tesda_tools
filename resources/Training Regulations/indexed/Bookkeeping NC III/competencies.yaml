  "source_section_text": "SECTION 2 COMPETENCY STANDARDS\n\nThis section gives the details of the contents of the units of competency\nrequired in BOOKKEEPING NC III. These units of competency are categorized into\nbasic, common and core competencies.\n\nBASIC COMPETENCIES\n\nUNIT OF COMPETENCY : LEAD WORKPLACE COMMUNICATION\n\nUNIT CODE\n : 500311109\n\n UNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes\nrequired to lead in the dissemination and discussion of\nideas, information and issues in the workplace.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\n1. Communicate\ninformation about\nworkplace processes\n1.1. Appropriate communication method is selected\n1.2. Multiple operations involving several topics areas\nare communicated accordingly\n1.3. Questions are used to gain extra information\n1.4. Correct sources of information are identified\n1.5. Information is selected and organized correctly\n1.6. Verbal and written reporting is undertaken when\nrequired\n1.7. Communication skills are maintained in all\nsituations\n2. Lead workplace\ndiscussions\n2.1. Response to workplace issues are sought\n2.2. Response to workplace issues are provided\nimmediately\n2.3. Constructive contributions are made to workplace\ndiscussions on such issues as production, quality\nand safety\n2.4. Goals/objectives and action plan undertaken in\nthe workplace are communicated\n3. Identify and\ncommunicate issues\narising in the\nworkplace\n3.1. Issues and problems are identified as they arise\n3.2. Information regarding problems and issues are\norganized coherently to ensure clear and\neffective communication\n3.3. Dialogue is initiated with appropriate personnel\n3.4. Communication problems and issues are raised\nas they arise\n\n--- PDF PAGE 5 ---\n-------------------------------------------------------------------------------------------------------\nTR – Bookkeeping NC III Promulgated November 2007\n3\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n\n1. Methods of\ncommunication\n1.1. Non-verbal gestures\n1.2. Verbal\n1.3. Face to face\n1.4. Two-way radio\n1.5. Speaking to groups\n1.6. Using telephone\n1.7. Written\n1.8. Internet\n\n--- PDF PAGE 6 ---\n-------------------------------------------------------------------------------------------------------\nTR – Bookkeeping NC III Promulgated November 2007\n4\nEVIDENCE GUIDE\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1. Dealt with a range of communication/information at one\ntime\n1.2. Made constructive contributions in workplace issues\n1.3. Sought workplace issues effectively\n1.4. Responded to workplace issues promptly\n1.5. Presented information clearly and effectively written\nform\n1.6. Used appropriate sources of information\n1.7. Asked appropriate questions\n1.8. Provided accurate information\n2. Underpinning\nknowledge\n2.1. Organization requirements for written and electronic\ncommunication methods\n2.2. Effective verbal communication methods\n3. Underpinning\nSkills\n3.1. Organize information\n3.2. Understand and convey intended meaning\n3.3. Participate in variety of workplace discussions\n3.4. Comply with organization requirements for the use of\nwritten and electronic communication methods\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1. Variety of Information\n4.2. Communication tools\n4.3. Simulated workplace\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1. Direct Observation\n5.2. Interview\n6. Context for\nAssessment\n6.1. Competency may be assessed in the workplace or in\nsimulated workplace environment\n6.2. Assessment shall be observed while task are being\nundertaken whether individually or in-group\n\n--- PDF PAGE 7 ---\n-------------------------------------------------------------------------------------------------------\nTR – Bookkeeping NC III Promulgated November 2007\n5\nUNIT OF COMPETENCY\n: LEAD SMALL TEAMS\n\nUNIT CODE\n : 500311110\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes\nto lead small teams including setting and maintaining\nteam and individual performance standards.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\n1. Provide team\nleadership\n1.1. Work requirements are identified and presented\nto team members\n1.2. Reasons for instructions and requirements are\ncommunicated to team members\n1.3. Team members’ queries and concerns are\nrecognized, discussed and dealt with\n2. Assign responsibilities\n2.1. Duties, and responsibilities are allocated having\nregard to the skills, knowledge and aptitude\nrequired to properly undertake the assigned task\nand according to company policy\n2.2. Duties are allocated having regard to individual\npreference, domestic and personal considerations,\nwhenever possible\n3. Set performance\nexpectations for team\nmembers\n3.1. Performance expectations are established based\non client needs and according to assignment\nrequirements\n3.2. Performance expectations are based on individual\nteam members duties and area of responsibility\n3.3. Performance expectations are discussed and\ndisseminated to individual team members\n\n--- PDF PAGE 8 ---\n-------------------------------------------------------------------------------------------------------\nTR – Bookkeeping NC III Promulgated November 2007\n6\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\n4. Supervised team\nperformance\n4.1. Monitoring of performance takes place\nagainst defined performance criteria and/or\nassignment instructions and corrective action\ntaken if required\n4.2. Team members are provided with feedback,\npositive support and advice on strategies to\novercome any deficiencies\n4.3. Performance issues which cannot be rectified\nor addressed within the team are referenced to\nappropriate personnel according to employer\npolicy\n4.4. Team members are kept informed of any\nchanges in the priority allocated to assignments\nor tasks which might impact on client/customer\nneeds and satisfaction\n4.5. Team operations are monitored to ensure that\nemployer/client needs and requirements are\nmet\n4.6. Follow-up communication is provided on all\nissues affecting the team\n4.7. All relevant documentation is completed in\naccordance with company procedures\n\n--- PDF PAGE 9 ---\n-------------------------------------------------------------------------------------------------------\nTR – Bookkeeping NC III Promulgated November 2007\n7\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Work requirements\n1.1. Client Profile\n1.2. Assignment instructions\n2. Team member’s concerns\n2.1. Roster/shift details\n3. Monitor performance\n3.1. Formal process\n3.2. Informal process\n4. Feedback\n4.1. Formal process\n4.2. Informal process\n5. Performance issues\n5.1. Work output\n5.2. Work quality\n5.3. Team participation\n5.4. Compliance with workplace protocols\n5.5. Safety\n5.6. Customer service\n\n--- PDF PAGE 10 ---\n-------------------------------------------------------------------------------------------------------\nTR – Bookkeeping NC III Promulgated November 2007\n8\nEVIDENCE GUIDE\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1. Maintained or improved individuals and/or team\nperformance given a variety of possible scenario\n1.2. Assessed and monitored team and individual\nperformance against set criteria\n1.3. Represented concerns of a team and individual to next\nlevel of management or appropriate specialist and to\nnegotiate on their behalf\n1.4. Allocated duties and responsibilities, having regard to\nindividual’s knowledge, skills and aptitude and the\nneeds of the tasks to be performed\n1.5. Set and communicated performance expectations for a\nrange of tasks and duties within the team and provided\nfeedback to team members\n2. Underpinning\nKnowledge\n2.1. Company policies and procedures\n2.2. Relevant legal requirements\n2.3. How performance expectations are set\n2.4. Methods of Monitoring Performance\n2.5. Client expectations\n2.6. Team member’s duties and responsibilities\n3. Underpinning\nSkills\n3.1. Communication skills required for leading teams\n3.2. Informal performance counseling skills\n3.3. Team building skills\n3.4. Negotiating skills\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1. Access to relevant workplace or appropriately\nsimulated environment where assessment can take\nplace\n4.2. Materials relevant to the proposed activity or task\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1. Direct observations of work activities of the individual\nmember in relation to the work activities of the group\n5.2. Observation of simulation and/or role play involving the\nparticipation of individual member to the attainment of\norganizational goal\n5.3. Case studies and scenarios as a basis for discussion\nof issues and strategies in teamwork\n6. Context for\nAssessment\n6.1. Competency assessment may occur in workplace or\nany appropriately simulated environment\n6.2. Assessment shall be observed while task are being\nundertaken whether individually or in-group\n\n--- PDF PAGE 11 ---\n-------------------------------------------------------------------------------------------------------\nTR – Bookkeeping NC III Promulgated November 2007\n9\nUNIT OF COMPETENCY: DEVELOP AND PRACTICE NEGOTIATION SKILLS\n\nUNIT CODE : 500311111\n\nUNIT DESCRIPTOR : This unit covers the skills, knowledge and attitudes\nrequired to collect information in order to negotiate to a\ndesired outcome and participate in the negotiation.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\n1. Plan negotiations\n1.1\n\n1.2\n\n1.3\n\n1.4\n\nInformation on preparing for negotiation is\nidentified and included in the plan\nInformation on creating non verbal environments\nfor positive negotiating is identified and included in\nthe plan\nInformation on active listening is identified and\nincluded in the plan\nInformation on different questioning techniques is\nidentified and included in the plan\nInformation is checked to ensure it is correct and up-\nto- date\n2. Participate in\nnegotiations\n\n2.1\n\n2.2\n2.3\n\n2.4\n2.5\n\n2.6\n\n2.7\nCriteria for successful outcome are agreed upon\nby all parties\nDesired outcome of all parties are considered\nAppropriate language is used throughout the\nnegotiation\nA variety of questioning techniques are used\nThe issues and processes are documented and\nagreed upon by all parties\nPossible solutions are discussed and their viability\nassessed\nAreas for agreement are confirmed and recorded\nFollow-up action is agreed upon by all parties\n\n--- PDF PAGE 12 ---\n-------------------------------------------------------------------------------------------------------\nTR – Bookkeeping NC III Promulgated November 2007\n10\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n\n1. Preparing for\nnegotiation\n1.1\n\n1.2\n1.3\n1.4\n\n1.5\n\n1.6\nBackground information on other parties to the\nnegotiation\nGood understanding of topic to be negotiated\nClear understanding of desired outcome/s\nPersonal attributes\n1.4.1. self awareness\n1.4.2. self esteem\n1.4.3. objectivity\n1.4.4. empathy\n1.4.5. respect for others\nInterpersonal skills\n1.5.1. listening/reflecting\n1.5.2. non verbal communication\n1.5.3. assertiveness\n1.5.4. behavior labeling\n1.5.5. testing understanding\n1.5.6. seeking information\n1.5.7. self disclosing\nAnalytic skills\n1.6.1. observing differences between content\nand process\n1.6.2. identifying bargaining information\n1.6.3. applying strategies to manage process\n1.6.4. applying steps in negotiating process\n1.6.5. strategies to manage conflict\n1.6.6. steps in negotiating process\n1.6.7. options within organization and externally\nfor resolving conflict\n2. Non verbal\nenvironments\n2.1\n2.2\n2.3\n2.4\nFriendly reception\nWarm and welcoming room\nRefreshments offered\nLead in conversation before negotiation begins\n3. Active listening\n3.1\n3.2\n3.3\n3.4\n3.5\nAttentive\nDon’t interrupt\nGood posture\nMaintain eye contact\nReflective listening\n4. Questioning\ntechniques\n4.1\n4.2\n4.3\nDirect\nIndirect\nOpen-ended\n\n--- PDF PAGE 13 ---\n-------------------------------------------------------------------------------------------------------\nTR – Bookkeeping NC III Promulgated November 2007\n11\nEVIDENCE GUIDE\n\n1. Critical aspects of\n Competency\nAssessment requires evidence that the candidate:\n1.1. Demonstrated sufficient knowledge of the factors\ninfluencing negotiation to achieve agreed outcome\n1.2. Participated in negotiation with at least one person to\nachieve an agreed outcome\n2. Underpinning\nKnowledge and\nAttitude\n2.1. Codes of practice and guidelines for the organization\n2.2. Organizations policy and procedures for negotiations\n2.3. Decision making and conflict resolution strategies\nprocedures\n2.4. Problem solving strategies on how to deal with\nunexpected questions and attitudes during negotiation\n2.5. Flexibility\n2.6. Empathy\n3. Underpinning\nSkills\n3.1. Interpersonal skills to develop rapport with other parties\n3.2. Communication skills (verbal and listening)\n3.3. Observation skills\n3.4. Negotiation skills\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1 Room with facilities necessary for the negotiation process\n4.2 Human resources (negotiators)\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1 Observation/demonstration and questioning\n5.2 Portfolio assessment\n5.3 Oral and written questioning\n5.4 Third party report\n6. Context for\nAssessment\n6.1 Competency to be assessed in real work environment or\nin a simulated workplace setting.\n\n--- PDF PAGE 14 ---\n-------------------------------------------------------------------------------------------------------\nTR – Bookkeeping NC III Promulgated November 2007\n12\nUNIT OF COMPETENCY :\nSOLVE PROBLEMS RELATED TO WORK\nACTIVITIES\n\nUNIT CODE\n: 500311112\n\nUNIT DESCRIPTOR\n:\nThis unit of covers the knowledge, skills and attitudes\nrequired to solve problems in the workplace including\nthe application of problem solving techniques and to\ndetermine and resolve the root cause of problems.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\n1. Identify the problem\n1.1. Variances are identified from normal operating\nparameters; and product quality\n1.2. Extent, cause and nature are of the problem are\ndefined through observation, investigation and\nanalytical techniques\n1.3. Problems are clearly stated and specified\n2. Determine\nfundamental causes\nof the problem\n2.1. Possible causes are identified based on\nexperience and the use of problem solving tools /\nanalytical techniques.\n2.2. Possible cause statements are developed based\non findings\n2.3. Fundamental causes are identified per results of\ninvestigation conducted\n3. Determine corrective\naction\n3.1. All possible options are considered for resolution\nof the problem\n3.2. Strengths and weaknesses of possible options\nare considered\n3.3. Corrective actions are determined to resolve the\nproblem and possible future causes\n3.4. Action plans are developed identifying\nmeasurable objectives, resource needs and\ntimelines in accordance with safety and operating\nprocedures\n4. Provide\nrecommendation/s\nto manager\n4.1. Report on recommendations are prepared\n4.2. Recommendations are presented to appropriate\npersonnel.\n4.3. Recommendations are followed-up, if required\n\n--- PDF PAGE 15 ---\n-------------------------------------------------------------------------------------------------------\nTR – Bookkeeping NC III Promulgated November 2007\n13\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Analytical techniques\n1.1. Brainstorming\n1.2. Intuitions/Logic\n1.3. Cause and effect diagrams\n1.4. Pareto analysis\n1.5. SWOT analysis\n1.6. Gant chart, Pert CPM and graphs\n1.7. Scattergrams\n2. Problem\n\n2.1. Non – routine process and quality problems\n2.2. Equipment selection, availability and failure\n2.3. Teamwork and work allocation problem\n2.4. Safety and emergency situations and incidents\n3. Action plans\n\n3.1. Priority requirements\n3.2. Measurable objectives\n3.3. Resource requirements\n3.4. Timelines\n3.5. Co-ordination and feedback requirements\n3.6. Safety requirements\n3.7. Risk assessment\n3.8. Environmental requirements\n\n--- PDF PAGE 16 ---\n-------------------------------------------------------------------------------------------------------\nTR – Bookkeeping NC III Promulgated November 2007\n14\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1. Identified the problem\n1.2. Determined the fundamental causes of the problem\n1.3. Determined the correct / preventive action\n1.4. Provided recommendation to manager\nThese aspects may be best assessed using a range of\nscenarios / case studies / what ifs as a stimulus with a\nwalk through forming part of the response. These\nassessment activities should include a range of\nproblems, including new, unusual and improbable\nsituations that may have happened.\n2. Underpinning\nKnowledge\n2.1. Competence includes a thorough knowledge and\nunderstanding of the process, normal operating\nparameters, and product quality to recognize non-\nstandard situations\n2.2. Competence to include the ability to apply and explain,\nsufficient for the identification of fundamental cause,\ndetermining the corrective action and provision of\nrecommendations\n2.2.1. Relevant equipment and operational processes\n2.2.2. Enterprise goals, targets and measures\n2.2.3. Enterprise quality, OHS and environmental\nrequirement\n2.2.4. Principles of decision making strategies and\ntechniques\n2.2.5. Enterprise information systems and data\ncollation\n2.2.6. Industry codes and standards\n3. Underpinning\nSkills\n3.1. Using range of formal problem solving techniques\n3.2. Identifying and clarifying the nature of the problem\n3.3. Devising the best solution\n3.4. Evaluating the solution\n3.5. Implementation of a developed plan to rectify the\nproblem\n4. Resource\nImplications\n4.1. Assessment will require access to an operating plant\nover an extended period of time, or a suitable method\nof gathering evidence of operating ability over a range\nof situations. A bank of scenarios / case studies / what\nifs will be required as well as bank of questions which\nwill be used to probe the reason behind the observable\naction.\n\n--- PDF PAGE 17 ---\n-------------------------------------------------------------------------------------------------------\nTR – Bookkeeping NC III Promulgated November 2007\n15\n5. Methods of\nAssessment\nCompetency may be assessed through:\n 5.1. Case studies on solving problems in the workplace\n 5.2. Observation\nThe unit will be assessed in a holistic manner as is practical\nand may be integrated with the assessment of other relevant\nunits of competency. Assessment will occur over a range of\nsituations, which will include disruptions to normal, smooth\noperation. Simulation may be required to allow for timely\nassessment of parts of this unit of competency. Simulation\nshould be based on the actual workplace and will include\nwalk through of the relevant competency components.\n6. Context for\nAssessment\n 6.1. In all workplace, it may be appropriate to assess this\nunit concurrently with relevant teamwork or operation\nunits.\n\n--- PDF PAGE 18 ---\n-------------------------------------------------------------------------------------------------------\nTR – Bookkeeping NC III Promulgated November 2007\n16\nUNIT OF COMPETENCY : USE MATHEMATICAL CONCEPTS AND\n TECHNIQUES\n\nUNIT CODE : 500311113\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes\nrequired in the application of mathematical concepts\nand techniques.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\n1. Identify mathematical\ntools and techniques to\nsolve problem\n1.1 Problem areas are identified based on given\ncondition\n1.2 Mathematical techniques are selected based on\nthe given problem\n2. Apply mathematical\nprocedure/solution\n2.1 Mathematical techniques are applied based on the\nproblem identified\n2.2 Mathematical computations are performed to the\nlevel of accuracy required for the problem\n2.3 Results of mathematical computation is determined\nand verified based on job requirements\n3. Analyze results\n3.1 Result of application is reviewed based on expected\nand required specifications and outcome\n3.2 Appropriate action is applied in case of error\n\n--- PDF PAGE 19 ---\n-------------------------------------------------------------------------------------------------------\nTR – Bookkeeping NC III Promulgated November 2007\n17\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Mathematical techniques\nMay include but are not limited to:\n1.1. Four fundamental operations\n Measurements\n1.2. Use/Conversion of units of measurements\n1.3. Use of standard formulas\n2. Appropriate action\n2.1 Review in the use of mathematical\ntechniques (e.g. recalculation, re-modeling)\n2.2 Report error to immediate superior for proper\naction\n\n--- PDF PAGE 20 ---\n-------------------------------------------------------------------------------------------------------\nTR – Bookkeeping NC III Promulgated November 2007\n18\n\n EVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Identified, applied and reviewed the use of\nmathematical concepts and techniques to workplace\nproblems\n2. Underpinning\nKnowledge\n2.1 Fundamental operation (addition, subtraction, division,\nmultiplication)\n2.2 Measurement system\n2.3 Precision and accuracy\n2.4 Basic measuring tools/devices\n3. Underpinning\nSkills\n3.1 Applying mathematical computations\n3.2 Using calculator\n3.3. Using different measuring tools\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1 Calculator\n4.2 Basic measuring tools\n4.3 Case Problems\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1 Authenticated portfolio\n5.2 Written Test\n5.3. Interview/Oral Questioning\n5.4. Demonstration\n6. Context for\nAssessment\n6.1. Competency may be assessed in the work place or in a\nsimulated work place setting\n\n--- PDF PAGE 21 ---\n-------------------------------------------------------------------------------------------------------\nTR – Bookkeeping NC III Promulgated November 2007\n19\n\nUNIT OF COMPETENCY : USE RELEVANT TECHNOLOGIES\n\nUNIT CODE : 500311114\n\nUNIT DESCRIPTOR : This unit of competency covers the knowledge, skills,\nand attitude required in selecting, sourcing and applying\nappropriate\nand\naffordable\ntechnologies\nin\nthe\nworkplace.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\n Range of Variables\n1. Study/select appropriate\ntechnology\n\n1.1. Usage of different technologies is determined\nbased on job requirements\n1.2. Appropriate technology is selected as per work\n specification\n\n2. Apply relevant\ntechnology\n\n 2.1. Relevant technology is effectively used in carrying\nout function\n 2.2. Applicable software and hardware are used as per\ntask requirement\n 2.3. Management concepts are observed and\npracticed as per established industry practices\n\n3. Maintain/enhance\nrelevant technology\n3.1. Maintenance of technology is applied in\naccordance with the industry standard operating\nprocedure, manufacturer’s operating guidelines\nand occupational health and safety procedure\nto ensure its operative ability\n3.2. Updating of technology is maintained through\ncontinuing education or training in accordance with\njob requirement\n3.3 Technology failure/ defect is immediately reported\nto the concern/responsible person or section for\nappropriate action\n\n--- PDF PAGE 22 ---\n-------------------------------------------------------------------------------------------------------\nTR – Bookkeeping NC III Promulgated November 2007\n20\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Technology\nMay include but are not limited to:\n1.1. Office technology\n1.2. Industrial technology\n1.3. System technology\n1.4. Information technology\n1.5. Training technology\n2. Management concepts\nMay include but not limited to:\n2.1 Real Time Management\n2.2 KAIZEN or continuous improvement\n2.3 5s\n2.4. Total Quality Management\n2.5. Other management/productivity tools\n3. Industry standard\noperating procedure\n3.1. Written guidelines relative to the usage of\noffice technology/equipment\n3.2. Verbal advise/instruction from the co-worker\n4. Manufacturer’s operating\nguidelines/ instructions\n4.1 Written instruction/manuals of specific\n Technology/ equipment\n4.2 General instruction manual\n4.3 Verbal advise from manufacturer relative to\nthe operation of equipment\n\n5. Occupational health and\nsafety procedure\n5.1 Relevant statutes on OHS\n5.2 Company guidelines in using\n technology/equipment\n6. Appropriate action\n6.1 Implementing preventive maintenance\n schedule\n6.2 Coordinating with manufacturer’s technician\n\n--- PDF PAGE 23 ---\n-------------------------------------------------------------------------------------------------------\nTR – Bookkeeping NC III Promulgated November 2007\n21\n\n EVIDENCE GUIDE\n\n 1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Studied and selected appropriate technology consistent\nwith work requirements\n1.2 Applied relevant technology\n1.3 Maintained and enhanced operative ability of relevant\ntechnology\n2. Underpinning\nKnowledge\n2.1 Awareness on technology and its function\n2.2 Repair and maintenance procedure\n2.3 Operating instructions\n2.4 Applicable software\n2.5 Communication techniques\n2.6 Health and safety procedure\n2.7 Company policy in relation to relevant technology\n2.8 Different management concepts\n2.9 Technology adaptability\n3. Underpinning\nSkills\n3.1 Relevant technology application/implementation\n3.2 Basic communication skills\n3.3 Software applications skills\n3.4 Basic troubleshooting skills\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1 Relevant technology\n4.2 Interview and demonstration questionnaires\n4.3 Assessment packages\n5. Methods of\nAssessment\nCompetency must be assessed through:\n5.1 Interview\n5.2 Actual demonstration\n5.3 Authenticated portfolio (related certificates of\n training/seminar)\n6. Context for\nAssessment\n6.1 Competency may be assessed in actual workplace or\nsimulated environment\n\n--- PDF PAGE 24 ---\n-------------------------------------------------------------------------------------------------------\nTR – Bookkeeping NC III Promulgated November 2007\n22\nCOMMON COMPETENCIES\n\nUNIT TITLE\n:\nAPPLY QUALITY STANDARDS\n\nUNIT CODE\n:\nHCS315202\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills, attitudes and values\nneeded to apply quality standards in the workplace. The unit\nalso includes the application of relevant safety procedures\nand regulations, organization procedures and customer\nrequirements.\n\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Assess quality of\nreceived materials\n1.1. Work instruction is obtained and work is carried out in\naccordance with standard operating procedures.\n1.2. Received materials are checked against workplace\nstandards and specifications.\n1.3. Faulty materials related to work are identified and\nisolated.\n1.4. Faults and any identified causes are recorded and/or\nreported to the supervisor concerned in accordance\nwith workplace procedures.\n1.5. Faulty materials are replaced in accordance with\nworkplace procedures.\n2. Assess own work\n2.1. Documentation relative to quality within the company\nis identified and used.\n2.2. Completed work is checked against workplace\nstandards relevant to the task undertaken.\n2.3. Errors are identified and isolated.\n2.4. Information on the quality and other indicators of\nproduction performance are recorded in accordance\nwith workplace procedures.\n2.5. In cases of deviations from specific quality\nstandards, causes are documented and reported in\naccordance with the workplace’ s standards operating\nprocedures.\n3. Engage in quality\nimprovement\n3.1. Process improvement procedures are participated in\nrelative to workplace assignment.\n3.2. Work is carried out in accordance with process\nimprovement procedures.\n3.3. Performance of operation or quality of product of\nservice to ensure customer satisfaction is monitored.\n\n--- PDF PAGE 25 ---\n-------------------------------------------------------------------------------------------------------\nTR – Bookkeeping NC III Promulgated November 2007\n23\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1 Materials\n1.1\nMaterials may include but not limited to:\n1.1.1. Manuals\n1.1.2. Job orders\n1.1.3. Instructional videos\n2 Faults\n2.1\nFaults may include but not limited to:\n2.1.1. Materials not to specification\n2.1.2. Materials contain incorrect/outdated\ninformation\n2.1.3. Hardware defects\n2.1.4. Materials that do not conform with any\nregulatory agencies\n3 Documentation\n3.1\nOrganization work procedures\n3.2\nManufacturer’s instruction manual\n3.3\nCustomer requirements\n3.4\nForms\n4 Errors\n4.1 Errors may be related but not limited to the following:\n4.1.1. Deviation from the requirements of the Client\n4.1.2. Deviation from the requirement of the\norganization\n5 Quality standards\n\n5.1 Quality standards may be related but not limited to\nthe following:\n5.1.1. Materials\n5.1.2. Hardware\n5.1.3. Final product\n5.1.4. Production processes\n5.1.5. Customer service\n6 Customer\n6.1\nCo-worker\n6.2\nSupplier/Vendor\n6.3\nClient\n6.4\nOrganization receiving the product or service\n\n--- PDF PAGE 26 ---\n-------------------------------------------------------------------------------------------------------\nTR – Bookkeeping NC III Promulgated November 2007\n24\n\nEVIDENCE GUIDE\n\n1 Critical aspect of\ncompetency\nAssessment must show that the candidate:\n1.1 Carried out work in accordance with the company’s\nstandard operating procedures\n1.2 Performed task according to specifications\n1.3 Reported defects detected in accordance with\nstandard operating procedures\n1.4 Carried out work in accordance with the process\nimprovement procedures\n2 Underpinning\nknowledge\n2.1 Relevant production processes, materials and\nproducts\n2.2 Characteristics of materials, software and hardware\nused in production processes\n2.3 Quality checking procedures\n2.4 Workplace procedures\n2.5 Safety and environmental aspects of production\nprocesses\n2.6 Fault identification and reporting\n2.7 Quality improvement processes\n3 Underpinning skills\n3.1 Reading skills required to interpret work instruction\n3.2 Communication skills needed to interpret and apply\ndefined work procedures\n3.3 Carry out work in accordance with OHS policies and\nprocedures\n3.4 Critical thinking\n3.5 Solution providing and decision-making\n4 Method of\nassessment\nThe assessor must select two of the following to objectively\nevaluate the candidate:\n4.1 Observation and oral questioning\n4.2 Third party report\n4.3 Portfolio\n4.4 Practical demonstration\n5 Resource implication\n5.1 Materials, software and hardware to be used in a real\nor simulated situation\n6 Context of\nAssessment\n6.1 Assessment may be conducted in the workplace or in\na simulated environment\n\n--- PDF PAGE 27 ---\n-------------------------------------------------------------------------------------------------------\nTR – Bookkeeping NC III Promulgated November 2007\n25\nUNIT TITLE\n:\nPERFORM COMPUTER OPERATIONS\n\nUNIT CODE\n:\nHCS311201\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills, attitudes and values\nneeded to perform computer operations which include\ninputting, accessing, producing and transferring data using\nthe appropriate hardware and software.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Plan and prepare for\ntask to be taken\nundertaken\n1.1. Requirements of task are determined in accordance\nwith the required output.\n1.2. Appropriate hardware and software are selected\naccording to task assigned and required outcome.\n1.3. Task is planned to ensure that OH & S guidelines\nand procedures are followed.\n1.4. Client -specific guidelines and procedures are\nfollowed.\n1.5. Required data security guidelines are applied in\naccordance with existing procedures.\n2. Input data into\ncomputer\n2.1. Data are entered into the computer using\nappropriate program/application in accordance with\ncompany procedures.\n2.2. Accuracy of information is checked and information\nis saved in accordance with standard operating\nprocedures.\n2.3. Inputted data is stored in storage media according\nto requirements.\n2.4. Work is performed within ergonomic guidelines.\n3. Access information\nusing computer\n3.1. Correct program/application is selected based on\njob requirements.\n3.2. Program/application containing the information\nrequired is accessed according to company\nprocedures.\n3.3. Desktop icons are correctly selected, opened and\nclosed for navigation purposes.\n3.4. Keyboard techniques are carried out in line with OH\n& S requirements for safe use of keyboards.\n\n--- PDF PAGE 28 ---\n-------------------------------------------------------------------------------------------------------\nTR – Bookkeeping NC III Promulgated November 2007\n26\n\n4. Produce output/ data\nusing computer system\n4.1. Entered data are processed using appropriate\nsoftware commands.\n4.2. Data are printed out as required using computer\nhardware /peripheral devices in accordance with\nstandard operating procedures.\n4.3. Files and data are transferred between compatible\nsystems using computer software,\nhardware/peripheral devices in accordance with\nstandard operating procedures.\n5. Use basic functions of\na www-browser to\nlocate information\n5.1. Information requirements for internet search are\nestablished.\n5.2. Browser is launched.\n5.3. Search engine is loaded.\n5.4. Appropriate search criteria/or URL of site is entered.\n5.5. Relevant links are followed to locate required\ninformation.\n5.6. Useful pages are bookmarked or printed as\nrequired.\n6. Maintain computer\nequipment and\nsystems\n6.1. Procedures for ensuring security of data, including\nregular back-ups and virus checks are implemented\nin accordance with standard operating procedures.\n6.2. Basic file maintenance procedures are implemented\nin line with the standards operating procedures.\n\n--- PDF PAGE 29 ---\n-------------------------------------------------------------------------------------------------------\nTR – Bookkeeping NC III Promulgated November 2007\n27\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1 Hardware and\nperipheral devices\n1.1 Personal computers\n1.2 Networked systems\n1.3 Communication equipment\n1.4 Printers\n1.5 Scanners\n1.6 Keyboard\n1.7 Mouse\n1.8 Voice/Data logger\n2 Software\nSoftware includes the following but are not limited to:\n2.1 Word processing packages\n2.2 Database packages\n2.3 Internet\n2.4 Spreadsheets\n2.5 Client Specific Software\n3 OH & S guidelines\n3.1 OHS guidelines\n3.2 Enterprise procedures\n4 Storage media\nStorage media include the following but are not limited to:\n4.1 Diskettes\n4.2 CDs\n4.3 Zip disks\n4.4 hard disk drives, local and remote\n4.5 Optical drives\n5 Ergonomic guidelines\n5.1 Types of equipment used\n5.2 Appropriate furniture\n5.3 Seating posture\n5.4 Lifting posture\n5.5 Visual display unit screen brightness\n6 Desktop icons\n6.1 Icons include the following but not limited to:\n6.2 Directories/folders\n6.3 Files\n6.4 Network devices\n6.5 Recycle bin\n6.6 Program icons\n\n--- PDF PAGE 30 ---\n-------------------------------------------------------------------------------------------------------\nTR – Bookkeeping NC III Promulgated November 2007\n28\n\n7 Maintenance\n7.1 Creating and managing more space in the hard disk\nand other peripherals\n7.2 Reviewing programs\n7.3 Deleting unwanted files\n7.4 Backing up files\n7.5 Checking hard drive for errors\n7.6 Using up to date anti-virus programs\n7.7 Cleaning dust from internal and external surfaces\n\n--- PDF PAGE 31 ---\n-------------------------------------------------------------------------------------------------------\nTR – Bookkeeping NC III Promulgated November 2007\n29\nEVIDENCE GUIDE\n1 Critical aspects of\ncompetency\nAssessment must show that the candidate:\n1.1 Selected and used hardware components correctly and\naccording to the task requirement\n1.2 used basic software applications to create new files and\ndocuments\n1.3 Produced accurate and complete data in accordance with\nthe requirements\n1.4 Used appropriate devices and procedures to transfer\nfiles/data accurately\n1.5 Used basic functions of a www-browser to locate\ninformation.\n2 Underpinning\nknowledge\n2.1 Basic ergonomics of keyboard and computer user\n2.2 Main types of computers and basic features of different\noperating systems\n2.3 Main parts of a computer\n2.4 Storage devices and basic categories of memory\n2.5 Relevant types of software\n2.6 General security, privacy legislation and copyright\n2.7 Viruses\n2.8 OH & S principles and responsibilities\n2.9 Calculating computer capacity\n2.10 Productivity Application\n2.11 Business Application\n2.12 System Software\n3 Underpinning\nskills\n3.1 Reading and comprehension skills required to interpret\nwork instruction and to interpret basic user manuals.\n3.2 Communication skills to identify lines of communication,\nrequest advice, follow instructions and receive feedback.\n3.3 Technology skills to use equipment safely including\nkeyboard skills.\n4 Method of\nassessment\nThe assessor may select two of the following assessment\nmethods to objectively assess the candidate:\n\n4.1 Direct Observation and Oral Questioning\n4.2 Practical demonstration\n5 Resource\nimplication\n5.1 Computer hardware with peripherals\n5.2 Appropriate software\n6 Context of\nAssessment\n6.1 Assessment may be conducted in the workplace or in a\nsimulated environment\n\n--- PDF PAGE 32 ---\n-------------------------------------------------------------------------------------------------------\nTR – Bookkeeping NC III Promulgated November 2007\n30\nUNIT OF COMPETENCY :\nMAINTAIN AN EFFECTIVE RELATIONSHIP WITH\nCLIENT/CUSTOMERS\n\nUNIT CODE\n:\nHCS913201\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes and\nvalues required in building and maintaining an effective\nrelationship with clients, customers and the public.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Maintain a clean and\nhygienic environment\n1.1\nUniform and personal grooming maintained to\nassignment requirements.\n1.2\nPersonal presence maintained according to\nemployer standards.\n1.3\nVisible work area kept tidy and uncluttered.\n1.4\nEquipment stored according to assignment\nrequirements.\n2. Meet client/customer\nrequirements\n2.1\nClient requirements identified and understood by\nreferral to the assignment instructions.\n2.2\nClient requirements met according to the assignment\ninstructions.\n2.3\nChanges to client’s needs and requirements\nmonitored and appropriate action taken.\n2.4\nAll communication with the client or customer is clear\nand complied with assignment requirements.\n3. Build credibility with\ncustomers/clients\n3.1\nClient expectations for reliability, punctuality and\nappearance adhered to.\n3.2\nPossible causes of client/customer dissatisfaction\nidentified, dealt with recorded according to employer\npolicy.\n3.3\nClient fully informed of all relevant security matters in\na timely manner and according to agreed reporting\nprocedures.\n\n--- PDF PAGE 33 ---\n-------------------------------------------------------------------------------------------------------\nTR – Bookkeeping NC III Promulgated November 2007\n31\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Personal Presence\n\nMay include:\n1.1\nStance\n1.2\nPosture\n1.3\nBody Language\n1.4\nDemeanor\n1.5\nGrooming\n2. Employer Standards\nMay include:\n2.1\nStanding Orders\n3. Client Requirements\nMay include:\n3.1\nAssignment Instructions\n3.2\nPost Orders\n3.3\nScope to modify instructions/orders in light of\nchanged situations\n4. Assignment\nInstructions\nMay conveyed in:\n4.1\nWriting\n4.2\nVerbally\n4.3\nElectronically\n5. Client Needs and\nRequirements\nMay be detected by:\n5.1\nReview of the client brief and/or assignment\ninstructions\n5.2\nDiscussion with the client/customer\n6. Appropriate Action\n\nMay include:\n6.1\nImplementing required changes\n6.2\nReferral to appropriate employer personnel\n6.3\nClarification of client needs and instructions\n7. Customers\nMay include:\n7.1\nAll members of the public\n\n--- PDF PAGE 34 ---\n-------------------------------------------------------------------------------------------------------\nTR – Bookkeeping NC III Promulgated November 2007\n32\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\n\nAssessment requires that the candidate:\n1.1\nMaintained a professional image.\n1.2\nInterpreted client/customer requirements from\ninformation contained in the client brief and/or\nassignment instructions.\n1.3\nDealt successfully with a variety of client/customer\ninteractions.\n1.4\nMonitored and acted on changing client or customer\nneeds.\n1.5\nMet client/customer requirements.\n1.6\nBuilt credibility with customers/clients\n2. Underpinning\nknowledge and\nattitudes\n2.1\nUniform and personal grooming requirements f the\nemployer and the client\n2.2\nOccupational health and safety requirement for the\nassignment\n2.3 Assignment Instructions\n3. Underpinning skills\n1.1\nAttention to detail when completing client/employer\ndocumentation\n1.2 Interpersonal and communication skills required in\nclient contact assignments\n1.3 Customer service skills required to meet\nclient/customer needs\n1.4 Punctuality\n1.5 Customer Service\n1.6 Telephone Technique\n1.7 Problem Solving and Negotiation\n1.8 Maintaining Records\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nAssessment Centers/Venues\n4.2\nAccredited Assessors\n4.3\nModes of Assessment\n4.4\nEvaluation Reports\n4.5\nAccess to a relevant venue, equipment and materials\n4.6\nAssignment Instructions\n4.7\nLogbooks\n4.8\nOperational manuals and makers/customers’\ninstructions\n4.9\nAssessment instruments, including personal planner\nand assessment record book\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1 Written Test\n5.2 Demonstration with questioning\n5.3 Observation with questioning\n6. Context of\nAssessment\n6.1 Assessment may be conducted in the workplace or in a\nsimulated environment.\n\n--- PDF PAGE 35 ---\n-------------------------------------------------------------------------------------------------------\nTR – Bookkeeping NC III Promulgated November 2007\n33\nUNIT OF COMPETENCY :\nMANAGE OWN PERFORMANCE\n\nUNIT CODE\n:\nHCS913202\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes in\neffectively managing own workload and quality of work.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Plan for completion of\nown workload\n1.1 Tasks accurately identified.\n1.2 Priority allocated to each task.\n1.3 Time lines allocated to each task or series of tasks.\n1.4 Tasks deadlines known and complied with whenever\npossible.\n1.5 Work schedules are known and completed with agreed\ntime frames.\n1.6 Work plans developed according to assignment\nrequirements and employer policy.\n1.7 Uncompleted work or tasks detailed and responsibility\nfor completion passed to incoming shift or other\nappropriate persons.\n2. Maintain quality of\nperformance\n2.1 Personal performance continually monitored against\nagreed performance standards.\n2.2 Advice and guidance sought when necessary to\nachieve or maintain agreed standards.\n2.3 Guidance from management applied to achieve or\nmaintain agreed standards.\n2.4 Standard of work clarified and agreed according to\nemployer policy and procedures.\n3. Build credibility with\ncustomers/clients\n3.1 Client expectations for reliability, punctuality and\nappearance adhered to.\n3.2 Possible causes of client/customer dissatisfaction\nidentified, dealt with recorded according to employer\npolicy.\n3.3 Client fully informed of all relevant security matters in a\ntimely.\n\n--- PDF PAGE 36 ---\n-------------------------------------------------------------------------------------------------------\nTR – Bookkeeping NC III Promulgated November 2007\n34\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Tasks\n\n1.1\nMay be identified through:\n1.1.1 Assignment Instructions\n1.1.2 Verbal Instructions by Senior Staff\n1.1.3 Policy Documents\n1.1.4 Duty Statements\n1.1.5 Self Assessment\n\n1.2 May be:\n1.2.1 Daily tasks\n1.2.2 Weekly tasks\n1.2.3 Regularly or irregularly occurring tasks\n2. Performance\nStandards\nMay include:\n2.1\nAssignment Instructions\n2.2\nProcedures established in policy documents\n\n--- PDF PAGE 37 ---\n-------------------------------------------------------------------------------------------------------\nTR – Bookkeeping NC III Promulgated November 2007\n35\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Planned for completion of own workload.\n1.2 Assessed verbal or written work plan through\nobservation and discussion of site and employer\nrequirements.\n1.3 Demonstrated capacity to complete task within\nspecified time frame.\n1.4 Maintained quality of own performance.\n2. Underpinning\nknowledge and\nattitudes\n2.1 Site and assignment requirements\n2.2 Employer policy on performance management\n2.3 Indicators of appropriate performance for each area of\nresponsibility\n2.4 Steps for improving or maintaining performance\n3. Underpinning skills\n3.1 Capacity to plan and prioritize work loads and\nrequirements\n3.2 Time and task management\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Assessment Centers/Venues\n4.2 Accredited Assessors\n4.3 Modes of Assessment\n4.4 Evaluation Reports\n4.5 Access to relevant venue, equipment and materials\n4.6 Assignment Instructions\n4.7 Logbooks\n4.8 Operational manuals and makers’/customers’\ninstructions\n4.9 Assessment Instruments, including personal planner\nand assessment record book\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1 Written Test\n5.2 Demonstration\n5.3 Observation\n5.4 Questioning\n6. Context of\nassessment\n6.1 Competency may be assessed in the workplace or in a\nsimulated work setting.\n\n--- PDF PAGE 38 ---\n-------------------------------------------------------------------------------------------------------\nTR – Bookkeeping NC III Promulgated November 2007\n36\nCORE COMPETENCIES\n\nUNIT OF COMPETENCY: JOURNALIZE TRANSACTIONS\n\nUNIT CODE: HCS412301\n\nUNIT DESCRIPTOR: This unit covers the knowledge, skills, and attitudes in\nlogging/recording business transactions in an accounting\njournal.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\n1. Prepare chart of accounts\n1.1 Nature of business is determined\nbased on client information\n1.2 List of asset, liability, equity, income,\nand expense account titles are\nprepared in accordance with industry\npractices\n1.3 Accounting manual is prepared in\naccordance with industry practice\n2. Analyze documents\n2.1 Documents are gathered, checked\nand verified in accordance with\nverification and validation processes\n2.2 Account titles are selected in\naccordance with standard selection\nprocesses\n3. Prepare journal entry\n3.1 Journals are prepared in accordance\nwith industry practice and generally\naccepted accounting\nprinciples/Philippine Financial\nReporting Standards for transactions\nand events.\n3.2 Debit account titles are determined in\naccordance with chart of accounts\n3.3 Credit account titles are determined in\naccordance with chart of accounts\n3.4 Explanation to journal entry is prepared\nin accordance with the nature of\ntransaction\n3.5 Journal entries are prepared with 100%\naccuracy\n\n--- PDF PAGE 39 ---\n-------------------------------------------------------------------------------------------------------\nTR – Bookkeeping NC III Promulgated November 2007\n37\nRANGE OF VARIABLES\n\nVARIABLE\n\nRANGE\n 1. Business\nMay include but are not limited to:\nA. Nature of Business:\n1.1 Manufacturing\n1.2 Trading\n1.3 Services\n\nB. Forms of Organization:\n1.1 Single proprietorship\n1.2 Partnership\n1.3 Corporation\n 2. Assets\nMay include but are not limited to:\n2.1 Cash and Cash Equivalents\n2.2 Receivables\n2.3 Inventories\n2.4 Prepayments\n2.5 Property, plant and equipment\n2.6 Other Assets\n3. Liabilities\nMay include but are not limited to:\n3.1 Accounts payables\n3.2 Loans payables\n3.3 Notes payables\n3.4 Income tax payables\n3.5 Accrued Expenses\n3.6 Other Liabilities\n4. Equity\nMay include but are not limited to:\n4.1 Capital\n4.2 Drawing\n4.3 Retained Earnings\n5. Income\nMay include but are not limited to:\n5.1 Sales\n5.2 Interest Income\n5.3 Dividend income\n5.4 Rent income\n5.5 Service Income\n5.6 Other Income\n6. Expenses\nMay include but are not limited to:\n6.1 Salaries/wages\n6.2 Rent expense\n6.3 Utilities expense\n6.4 Depreciation\n6.5 Supplies\n6.6 Repairs and Maintenance\n6.7 Transportation\n\n--- PDF PAGE 40 ---\n-------------------------------------------------------------------------------------------------------\nTR – Bookkeeping NC III Promulgated November 2007\n38\n7. Documents\nMay include but are not limited to:\n7.1 Sales invoice\n7.2 Vouchers\n7.3 Official receipts\n7.4 Purchase invoice\n8. Account titles\nMay include but are not limited to:\n8.1 Assets\n8.2 Liabilities\n8.3 Equities\n8.4 Income\n8.5 Expense\n9. Journals\nMay include but are not limited to:\n9.1 General Journal\n9.2 Cash Receipts Journals\n9.3 Cash Payments Journals\n9.4 Sales Journal\n9.5 Purchase Journal\n9.6 General Ledger\n10. Transactions and events\nMay include but are not limited to:\n10.1 Routine/daily transactions\n10.2 End of the month transaction to\nupdate the books of accounts\n10.3 End of the accounting year\ntransactions to close the books of\naccounts\n11. Debit account titles\nMay include but are not limited to:\n11.1 Cash\n11.2 Receivables\n11.3 Expenses\n11.4 Inventories\n11.5 Property, Plant and Equipment\n12. Credit account titles\nMay include but are not limited to:\n12.1 Sales\n12.2 Loans payables\n12.3 Interest income\n12.4 Cash\n\n--- PDF PAGE 41 ---\n---------------------------------------------------------------------------------------------------\n----\nTR – Bookkeeping NC III Promulgated November 2007\n39\nEVIDENCE GUIDE\n\n1. Critical aspects of competency\n Assessment requires evidence that the\ncandidate:\n1.1 Prepared chart of accounts\n1.2 Analyzed documents\n1.3Prepared journal entry\n2. Underpinning knowledge\n2.1 Accounting principles/Philippine\nFinancial Reporting Standards\n2.2 Accounting equation\n3. Underpinning skills\n3.1 Using four (4) fundamental\nmathematical operations\n3.2 Reading and comprehension skills\n3.3 Communication skills\n3.4 Computer operation skills\n4. Resource implications\nThe following resources MUST be\nprovided:\n4.1 Workplace: real or simulated work\narea\n4.2 Appropriate tools and equipment\n4.3 Materials/supplies relevant to the\nactivity\n5. Method of assessment\nCompetency MUST be assessed\nthrough:\n5.1 Written Examination\n5.2 Work Related Project\n6. Context of assessment\n6.1 Competency may be assessed in\nthe workplace or in a simulated\nwork setting.\n\n--- PDF PAGE 42 ---\n-----------------------------------------------------------------------------------------------------\n--\nTR – Bookkeeping NC III Promulgated November 2007\n40\nUNIT OF COMPETENCY: POST TRANSACTIONS\n\nUNIT CODE: HCS412302\n\nUNIT DESCRIPTOR: This unit covers the knowledge, skills, and attitudes\nin posting transactions manually.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\n1. Prepare ledger\n1.1 Ledger for the list of asset, liability,\nand equity account titles are\nprepared in accordance with the\nChart of Accounts\n1.2 Ledger for the list of income and\nexpense account titles are\nprepared in accordance with the\nChart of Accounts\n2. Transfer journal entries\n2.1 Journal entries are transferred in\nchronological order\n2.2 Postings are done with 100%\naccuracy\n3. Summarize ledger\n3.1 Debits & Credits for each ledger\naccount are added correctly\n3.2 Balances are extracted with 100%\naccuracy.\n\n--- PDF PAGE 43 ---\n-------------------------------------------------------------------------------------------------------\nTR – Bookkeeping NC III Promulgated November 2007\n41\nRANGE OF VARIABLES\n\nVARIABLE\n\nRANGE\n 1. Ledger\nMay include but are not limited to:\n1.1 General Ledger\n1.2 Subsidiary Ledger\n 1.2.1 Accounts Receivables\n 1.2.2 Accounts Payables\n 1.2.3 Property, Plant and Equipment\n 1.2.4 Payroll\n 2. Assets, liabilities, and equity\naccount titles\n May include but are not limited to:\n2.1 Cash\n2.2 Receivables\n2.3 Inventories\n2.4 Property, plant and equipment\n2.5 Accounts Payable\n3. Income and Expenses account\ntitles\n May include but are not limited to:\n3.1 Sales\n3.2 Salaries\n3.3 Rent Income\n3.4 Rent Expense\n3.5 Purchases\n3.6 Taxes and Licenses\n3.7 Utilities\n3.8 Stationery and Supplies\n3.9 Insurance and Bonds\n3.10 Transportation and Travel\n4. Journal entries\nMay include but are not limited to:\n4.1 routine journal entries\n4.2 adjusting journal entries\n4.3 closing entries\n\n--- PDF PAGE 44 ---\n-------------------------------------------------------------------------------------------------------\nTR – Bookkeeping NC III Promulgated November 2007\n42\nEVIDENCE GUIDE\n\n1. Critical aspects of competency\n Assessment requires evidence that the\ncandidate:\n1.1 Prepared ledger\n1.2 Transferred journal entries\n1.3 Summarized each ledger account\n2. Underpinning knowledge\n2.1 Accounting principles/Philippine\nFinancial Reporting Standards\n2.2 Accounting equation\n3. Underpinning skills\n3.1 Using four (4) fundamental\nmathematical operations\n3.2 Reading and comprehension skills\n3.3 Communication skills\n3.4 Computer operation skills\n4. Resource implications\nThe following resources MUST be\nprovided:\n4.1 Workplace: real or simulated work\narea\n4.2 Appropriate tools and equipment\n4.3 Materials/supplies relevant to the\nactivity\n5. Method of assessment\nCompetency MUST be assessed through:\n5.1 Written Examination\n5.2 Work Related Project\n6. Context of assessment\n6.1 Competency may be assessed in the\nworkplace or in a simulated work\nsetting\n\n--- PDF PAGE 45 ---\n-------------------------------------------------------------------------------------------------------\nTR – Bookkeeping NC III Promulgated November 2007\n43\nUNIT OF COMPETENCY: PREPARE TRIAL BALANCE\n\nUNIT CODE: HCS412303\n\nUNIT DESCRIPTOR: This unit covers the knowledge, skills, and attitudes in\nlisting accounts, transferring and summarizing trial\nbalances from a ledger.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\n1. List account titles\n1.1 Asset, liability, and equity\naccount titles are listed in\naccordance with Chart of Account\n1.2 Income and expense account\ntitles are listed in accordance with\nChart of Accounts\n2. Transfer balances from the ledger\n\n2.1 Asset, liability, and equity balances\nare transferred in accordance with\nChart of Accounts\n2.2 Income and expense balances are\ntransferred in accordance with\nChart of Accounts\n3. Summarize trial balance\n3.1 Debits and credits are totaled with\n100% accuracy\n3.2 Trial Balances are extracted with\n100% accuracy.\n\n--- PDF PAGE 46 ---\n-------------------------------------------------------------------------------------------------------\nTR – Bookkeeping NC III Promulgated November 2007\n44\nRANGE OF VARIABLES\n\nVARIABLE\n\nRANGE\n1. Assets, liability and equity account\ntitles\n May include but are not limited to:\n1.1 Cash\n1.2 Receivables\n1.3 Inventories\n1.4 Loans Payable\n2. Income and expense account titles\n May include but are not limited to:\n2.1 Sales\n2.2 Rent Income\n2.3 Rent Expense\n2.4 Depreciation\n3. Trial Balances\nMay include but are not limited to:\n3.1 Preliminary Trial Balance\n3.2 Adjusted Trial Balance\n3.3 Post-Closing Trial Balance\n\n--- PDF PAGE 47 ---\n-------------------------------------------------------------------------------------------------------\nTR – Bookkeeping NC III Promulgated November 2007\n45\nEVIDENCE GUIDE\n\n1. Critical aspects of competency\n Assessment requires evidence that the\ncandidate:\n1.1 Transferred ledger balances\n1.2 Summarized trial balance\n1.3 Prepared trial balance\n2. Underpinning knowledge\n2.1 Accounting principles/Philippine\nFinancial Reporting Standards\n2.2 Accounting equation\n3. Underpinning skills\n3.1 Using four (4) fundamental\nmathematical operations\n3.2 Reading and comprehension skills\n3.3 Communication skills\n3.4 Computer operation skills\n4. Resource implications\nThe following resources MUST be\nprovided:\n4.1 Workplace: real or simulated work\narea\n4.2 Appropriate tools and equipment\n4.3 Materials/supplies relevant to the\nactivity\n5. Method of assessment\nCompetency MUST be assessed\nthrough:\n\n5.1 Written Examination\n5.2 Work Related Project\n6. Context of assessment\n6.1 Competency may be assessed in the\nworkplace or in a simulated work\nsetting.\n\n--- PDF PAGE 48 ---\n-------------------------------------------------------------------------------------------------------\nTR – Bookkeeping NC III Promulgated November 2007\n46\n\nUNIT OF COMPETENCY: PREPARE FINANCIAL REPORTS\n\nUNIT CODE: HCS412304\n\n UNIT DESCRIPTOR: This unit covers the knowledge, skills, and attitudes in\npreparing financial reports manually.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\n1. Prepare financial statements\n\n1.1 Worksheet is prepared using the\nprescribed format\n1.2 Income statement is prepared in\naccordance with generally accepted\naccounting principles/Philippine\nFinancial Reporting Standards\n1.3 Statement of Changes in Equity is\nprepared in accordance with\ngenerally accepted accounting\nprinciples/Philippine Financial\nReporting Standards\n1.4 Balance Sheet is prepared in\naccordance with generally accepted\naccounting principles/Philippine\nFinancial Reporting Standards\n1.5 Statement of Cash Flow is prepared in\naccordance with generally accepted\naccounting principles/Philippine\nFinancial Reporting Standards\n1.6 Financial statements are prepared in\naccordance with generally accepted\naccounting principles/Philippine\nFinancial Reporting Standards\n2. Analyze financial statements\n\n2.1 Financial Statements are analyzed in\naccordance with prescribed format.\n2.2 Report on financial analysis is\nprepared in accordance with industry\nrequirements.\n\n--- PDF PAGE 49 ---\n-------------------------------------------------------------------------------------------------------\nTR – Bookkeeping NC III Promulgated November 2007\n47\nRANGE OF VARIABLES\n\nVARIABLE\n\nRANGE\n1. Financial statements\n\n May include but are not limited to:\n1.1 Balance sheet\n1.2 Income statement\n1.3 Cash Flow Statement\n2. Report\n\nMay include but are not limited to:\n2.1 Monthly\n2.2 Quarterly\n2.3 Annually\n\n--- PDF PAGE 50 -