  core:
    - unit_code: HCS412301
      title: Journalize transactions
      printed_pages: "36-39"
      descriptor: Log/record business transactions in an accounting journal.
      elements:
        - number: 1
          title: Prepare chart of accounts
          performance_criteria:
            - {number: "1.1", text: "Determine nature of business from client information."}
            - {number: "1.2", text: "Prepare asset, liability, equity, income and expense account titles according to industry practice."}
            - {number: "1.3", text: "Prepare accounting manual according to industry practice."}
        - number: 2
          title: Analyze documents
          performance_criteria:
            - {number: "2.1", text: "Gather, check and verify documents under verification/validation processes."}
            - {number: "2.2", text: "Select account titles using standard selection processes."}
        - number: 3
          title: Prepare journal entry
          performance_criteria:
            - {number: "3.1", text: "Prepare journals according to industry practice and GAAP/PFRS for transactions/events."}
            - {number: "3.2", text: "Determine debit account titles according to chart of accounts."}
            - {number: "3.3", text: "Determine credit account titles according to chart of accounts."}
            - {number: "3.4", text: "Prepare explanation for journal entry according to transaction nature."}
            - {number: "3.5", text: "Prepare journal entries with 100% accuracy."}
      range_of_variables:
        - {variable: Business nature, values: [Manufacturing, Trading, Services]}
        - {variable: Forms of organization, values: [Single proprietorship, Partnership, Corporation]}
        - {variable: Assets, values: [Cash and cash equivalents, Receivables, Inventories, Prepayments, Property plant and equipment, Other assets]}
        - {variable: Liabilities, values: [Accounts payable, Loans payable, Notes payable, Income tax payable, Accrued expenses, Other liabilities]}
        - {variable: Equity, values: [Capital, Drawing, Retained earnings]}
        - {variable: Income, values: [Sales, Interest income, Dividend income, Rent income, Service income, Other income]}
        - {variable: Expenses, values: [Salaries/wages, Rent expense, Utilities expense, Depreciation, Supplies, Repairs and maintenance, Transportation]}
        - {variable: Documents, values: [Sales invoice, Vouchers, Official receipts, Purchase invoice]}
        - {variable: Account titles, values: [Assets, Liabilities, Equities, Income, Expense]}
        - {variable: Journals/books, values: [General journal, Cash receipts journal, Cash payments journal, Sales journal, Purchase journal, General ledger]}
        - {variable: Transactions/events, values: [Routine/daily, End-of-month updating, End-of-year closing]}
        - {variable: Debit account titles, values: [Cash, Receivables, Expenses, Inventories, Property plant and equipment]}
        - {variable: Credit account titles, values: [Sales, Loans payable, Interest income, Cash]}
      evidence_guide:
        critical_aspects: [Prepare chart of accounts, Analyze documents, Prepare journal entry]
        underpinning_knowledge: [Accounting principles/PFRS, Accounting equation]
        underpinning_skills: [Four fundamental mathematical operations, Reading/comprehension, Communication, Computer operation]
        resource_implications: [Real/simulated workplace, Appropriate tools/equipment, Relevant materials/supplies]
        methods_of_assessment: [Written examination, Work-related project]
        context_of_assessment: [Workplace or simulated work setting]

    - unit_code: HCS412302
