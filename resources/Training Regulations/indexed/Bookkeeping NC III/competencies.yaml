dance with \nstandard operating procedures. \n5. Use basic functions of \na www-browser to \nlocate information \n5.1. Information requirements for internet search are \nestablished. \n5.2. Browser is launched. \n5.3. Search engine is loaded. \n5.4. Appropriate search criteria/or URL of site is entered. \n5.5. Relevant links are followed to locate required \ninformation. \n5.6. Useful pages are bookmarked or printed as \nrequired. \n6. Maintain computer \nequipment and \nsystems \n6.1. Procedures for ensuring security of data, including \nregular back-ups and virus checks are implemented \nin accordance with standard operating procedures. \n6.2. Basic file maintenance procedures are implemented \nin line with the standards operating procedures.\n\n--- PDF PAGE 29 ---\n-------------------------------------------------------------------------------------------------------     \nTR – Bookkeeping NC III                                                                  Promulgated November 2007 \n27\nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1 Hardware and \nperipheral devices \n1.1 Personal computers                        \n1.2 Networked systems  \n1.3 Communication equipment \n1.4 Printers \n1.5 Scanners \n1.6 Keyboard \n1.7 Mouse \n1.8 Voice/Data logger \n2 Software \nSoftware includes the following but are not limited to: \n2.1 Word processing packages \n2.2 Database packages \n2.3 Internet \n2.4 Spreadsheets \n2.5 Client Specific Software \n3 OH & S guidelines \n3.1 OHS guidelines \n3.2 Enterprise procedures \n4 Storage media \nStorage media include the following but are not limited to: \n4.1 Diskettes \n4.2 CDs \n4.3 Zip disks \n4.4 hard disk drives, local and remote \n4.5 Optical drives \n5 Ergonomic guidelines\n5.1 Types of equipment used \n5.2 Appropriate furniture \n5.3 Seating posture \n5.4 Lifting posture \n5.5 Visual display unit screen brightness \n6 Desktop icons \n6.1 Icons include the following but not limited to: \n6.2 Directories/folders \n6.3 Files \n6.4 Network devices \n6.5 Recycle bin \n6.6 Program icons\n\n--- PDF PAGE 30 ---\n-------------------------------------------------------------------------------------------------------     \nTR – Bookkeeping NC III                                                                  Promulgated November 2007 \n28\n \n7 Maintenance \n7.1 Creating and managing  more space in the hard disk \nand other peripherals \n7.2 Reviewing programs \n7.3 Deleting unwanted files \n7.4 Backing up files \n7.5 Checking hard drive for errors \n7.6 Using up to date anti-virus programs \n7.7 Cleaning dust from internal and external surfaces\n\n--- PDF PAGE 31 ---\n-------------------------------------------------------------------------------------------------------     \nTR – Bookkeeping NC III                                                                  Promulgated November 2007 \n29"
