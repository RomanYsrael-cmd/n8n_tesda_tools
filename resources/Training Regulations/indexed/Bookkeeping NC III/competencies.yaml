          title: Prepare ledger
          performance_criteria:
            - {number: "1.1", text: "Prepare ledgers for asset, liability and equity account titles according to the chart of accounts."}
            - {number: "1.2", text: "Prepare ledgers for income and expense account titles according to the chart of accounts."}
        - number: 2
          title: Transfer journal entries
          performance_criteria:
            - {number: "2.1", text: "Transfer journal entries in chronological order."}
            - {number: "2.2", text: "Complete postings with 100% accuracy."}
        - number: 3
          title: Summarize ledger
          performance_criteria:
            - {number: "3.1", text: "Add debits and credits correctly for each ledger account."}
            - {number: "3.2", text: "Extract balances with 100% accuracy."}
