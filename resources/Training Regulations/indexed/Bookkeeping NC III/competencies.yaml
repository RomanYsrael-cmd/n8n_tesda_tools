ried out in accordance with process \nimprovement procedures. \n3.3. Performance of operation or quality of product of \nservice to ensure customer satisfaction is monitored.\n\n--- PDF PAGE 25 ---\n-------------------------------------------------------------------------------------------------------     \nTR – Bookkeeping NC III                                                                  Promulgated November 2007 \n23\nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1 Materials  \n1.1 \nMaterials may include but not limited to: \n1.1.1. Manuals \n1.1.2. Job orders \n1.1.3. Instructional videos \n2 Faults \n2.1 \nFaults may include but not limited to: \n2.1.1. Materials not to specification \n2.1.2. Materials contain incorrect/outdated \ninformation \n2.1.3. Hardware defects \n2.1.4. Materials that do not conform with any \nregulatory agencies  \n3 Documentation  \n3.1 \nOrganization work procedures \n3.2 \nManufacturer’s instruction manual \n3.3 \nCustomer requirements \n3.4 \nForms  \n4 Errors \n4.1  Errors may be related  but not limited to the following:\n4.1.1. Deviation from the requirements of the Client  \n4.1.2. Deviation from the requirement of the \norganization \n5 Quality standards \n \n5.1  Quality standards may be related but not limited to \nthe following: \n5.1.1. Materials \n5.1.2. Hardware \n5.1.3. Final product \n5.1.4. Production processes \n5.1.5. Customer service \n6 Customer \n6.1 \nCo-worker \n6.2 \nSupplier/Vendor \n6.3 \nClient \n6.4 \nOrganization receiving the product or service\n\n--- PDF PAGE 26 ---\n-------------------------------------------------------------------------------------------------------     \nTR – Bookkeeping NC III                                                                  Promulgated November 2007 \n24\n \nEVIDENCE GUIDE \n \n \n \n1 Critical aspect of          \ncompetency \nAssessment must show that the candidate: \n1.1 Carried out work in accordance with the company’s \nstandard operating procedures \n1.2 Pe