        "evidence_guide": {
          "source_text": "1.   Critical aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1.  Identified the problem \n1.2.  Determined the fundamental causes of the problem \n1.3.  Determined the correct / preventive action \n1.4.  Provided recommendation to manager \nThese aspects may be best assessed using a range of \nscenarios / case studies / what ifs as a stimulus with a \nwalk through forming part of the response. These \nassessment activities should include a range of \nproblems, including new, unusual and improbable \nsituations that may have happened. \n2.   Underpinning \nKnowledge  \n2.1. Competence includes a thorough knowledge and  \nunderstanding of the process, normal operating \nparameters, and product quality to recognize non-\nstandard situations \n2.2. Competence to include the ability to apply and explain, \nsufficient for the identification of fundamental cause, \ndetermining the corrective action and provision of \nrecommendations \n2.2.1.    Relevant equipment and operational processes \n2.2.2.    Enterprise goals, targets and measures \n2.2.3.    Enterprise quality, OHS and environmental \nrequirement \n2.2.4.    Principles of decision making strategies and \ntechniques \n2.2.5.    Enterprise information systems and data \ncollation \n2.2.6.    Industry codes and standards \n3.   Underpinning \nSkills \n3.1.   Using range of formal problem solving techniques \n3.2.   Identifying and clarifying the nature of the problem \n3.3.   Devising the best solution \n3.4.   Evaluating the solution \n3.5. Implementation of a developed plan to rectify the \nproblem \n4.   Resource \nImplications \n4.1. Assessment will require access to an operating plant \nover an extended period of time, or a suitable method \nof gathering evidence of operating ability over a range \nof situations. A bank of scenarios / case studies / what \nifs will be required as well as bank of questions which \nwill be used to probe the reason behind the observable \naction.\n\n--- PDF PAGE 17 ---\n-------------------------------------------------------------------------------------------------------     \nTR – Bookkeeping NC III                                                                  Promulgated November 2007 \n15\n5.  Methods of \nAssessment \nCompetency may be assessed through: \n   5.1.   Case studies on solving problems in the workplace \n   5.2.   Observation \nThe unit will be assessed in a holistic manner as is practical \nand may be integrated with the assessment of other relevant \nunits of competency. Assessment will occur over a range of \nsituations, which will include disruptions to normal, smooth \noperation. Simulation may be required to allow for timely \nassessment of parts of this unit of competency. Simulation \nshould be based on the actual workplace and will include \nwalk through of the relevant competency components.  \n6.  Context for \nAssessment \n   6.1. In all workplace, it may be appropriate to assess this \nunit concurrently with relevant teamwork or operation \nunits.",
