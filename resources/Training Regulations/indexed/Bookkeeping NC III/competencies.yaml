        "source_text": "HCS412301\n\nUNIT DESCRIPTOR: This unit covers the knowledge, skills, and attitudes in\nlogging/recording business transactions in an accounting\njournal.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\n1. Prepare chart of accounts\n1.1 Nature of business is determined\nbased on client information\n1.2 List of asset, liability, equity, income,\nand expense account titles are\nprepared in accordance with industry\npractices\n1.3 Accounting manual is prepared in\naccordance with industry practice\n2. Analyze documents\n2.1 Documents are gathered, checked\nand verified in accordance with\nverification and validation processes\n2.2 Account titles are selected in\naccordance with standard selection\nprocesses\n3. Prepare journal entry\n3.1 Journals are prepared in accordance\nwith industry practice and generally\naccepted accounting\nprinciples/Philippine Financial\nReporting Standards for transactions\nand events.\n3.2 Debit account titles are determined in\naccordance with chart of accounts\n3.3 Credit account titles are determined in\naccordance with chart of accounts\n3.4 Explanation to journal entry is prepared\nin accordance with the nature of\ntransaction\n3.5 Journal entries are prepared with 100%\naccuracy\n\n--- PDF PAGE 39 ---\n-------------------------------------------------------------------------------------------------------\nTR – Bookkeeping NC III Promulgated November 2007\n37\nRANGE OF VARIABLES\n\nVARIABLE\n\nRANGE\n 1. Business\nMay include but are not limited to:\nA. Nature of Business:\n1.1 Manufacturing\n1.2 Trading\n1.3 Services\n\nB. Forms of Organization:\n1.1 Single proprietorship\n1.2 Partnership\n1.3 Corporation\n 2. Assets\nMay include but are not limited to:\n2.1 Cash and Cash Equivalents\n2.2 Receivables\n2.3 Inventories\n2.4 Prepayments\n2.5 Property, plant and equipment\n2.6 Other Assets\n3. Liabilities\nMay include but are not limited to:\n3.1 Accounts payables\n3.2 Loans payables\n3.3 Notes payables\n3.4 Income tax payables\n3.5 Accrued Expenses\n3.6 Other Liabilities\n4. Equity\nMay include but are not limited to:\n4.1 Capital\n4.2 Drawing\n4.3 Retained Earnings\n5. Income\nMay include but are not limited to:\n5.1 Sales\n5.2 Interest Income\n5.3 Dividend income\n5.4 Rent income\n5.5 Service Income\n5.6 Other Income\n6. Expenses\nMay include but are not limited to:\n6.1 Salaries/wages\n6.2 Rent expense\n6.3 Utilities expense\n6.4 Depreciation\n6.5 Supplies\n6.6 Repairs and Maintenance\n6.7 Transportation\n\n--- PDF PAGE 40 ---\n-------------------------------------------------------------------------------------------------------\nTR – Bookkeeping NC III Promulgated November 2007\n38\n7. Documents\nMay include but are not limited to:\n7.1 Sales invoice\n7.2 Vouchers\n7.3 Official receipts\n7.4 Purchase invoice\n8. Account titles\nMay include but are not limited to:\n8.1 Assets\n8.2 Liabilities\n8.3 Equities\n8.4 Income\n8.5 Expense\n9. Journals\nMay include but are not limited to:\n9.1 General Journal\n9.2 Cash Receipts Journals\n9.3 Cash Payments Journals\n9.4 Sales Journal\n9.5 Purchase Journal\n9.6 General Ledger\n10. Transactions and events\nMay include but are not limited to:\n10.1 Routine/daily transactions\n10.2 End of the month transaction to\nupdate the books of accounts\n10.3 End of the accounting year\ntransactions to close the books of\naccounts\n11. Debit account titles\nMay include but are not limited to:\n11.1 Cash\n11.2 Receivables\n11.3 Expenses\n11.4 Inventories\n11.5 Property, Plant and Equipment\n12. Credit account titles\nMay include but are not limited to:\n12.1 Sales\n12.2 Loans payables\n12.3 Interest income\n12.4 Cash\n\n--- PDF PAGE 41 ---\n---------------------------------------------------------------------------------------------------\n----\nTR – Bookkeeping NC III Promulgated November 2007\n39\nEVIDENCE GUIDE\n\n1. Critical aspects of competency\n Assessment requires evidence that the\ncandidate:\n1.1 Prepared chart of accounts\n1.2 Analyzed documents\n1.3Prepared journal entry\n2. Underpinning knowledge\n2.1 Accounting principles/Philippine\nFinancial Reporting Standards\n2.2 Accounting equation\n3. Underpinning skills\n3.1 Using four (4) fundamental\nmathematical operations\n3.2 Reading and comprehension skills\n3.3 Communication skills\n3.4 Computer operation skills\n4. Resource implications\nThe following resources MUST be\nprovided:\n4.1 Workplace: real or simulated work\narea\n4.2 Appropriate tools and equipment\n4.3 Materials/supplies relevant to the\nactivity\n5. Method of assessment\nCompetency MUST be assessed\nthrough:\n5.1 Written Examination\n5.2 Work Related Project\n6. Context of assessment\n6.1 Competency may be assessed in\nthe workplace or in a simulated\nwork setting.\n\n--- PDF PAGE 42 ---\n-----------------------------------------------------------------------------------------------------\n--\nTR – Bookkeeping NC III Promulgated November 2007\n40\nUNIT OF COMPETENCY: POST TRANSACTIONS\n\nUNIT CODE:"
