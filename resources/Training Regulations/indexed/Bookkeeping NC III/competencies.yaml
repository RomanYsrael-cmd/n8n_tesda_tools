        underpinning_skills: [Four fundamental mathematical operations, Reading/comprehension, Communication, Computer operation]
        resource_implications: [Real/simulated workplace, Appropriate tools/equipment, Relevant materials/supplies]
        methods_of_assessment: [Written examination, Work-related project]
        context_of_assessment: [Workplace or simulated work setting]

