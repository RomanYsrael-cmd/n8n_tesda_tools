        "source_title": "PREPARE TRIAL BALANCE",
        "source_text": "--- PDF PAGE 45 ---\n-------------------------------------------------------------------------------------------------------     \nTR – Bookkeeping NC III                                                                  Promulgated November 2007 \n43\nUNIT OF COMPETENCY: PREPARE TRIAL BALANCE \n \nUNIT CODE:                      HCS412303  \n \nUNIT DESCRIPTOR:        This unit covers the knowledge, skills, and attitudes  in \nlisting accounts, transferring and summarizing trial \nbalances from a ledger. \n \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the \nRange of Variables \n1.  List account titles \n1.1 Asset, liability, and equity \naccount titles are listed in \naccordance with Chart of Account \n1.2 Income and expense account \ntitles are listed in accordance with \nChart of Accounts \n2.  Transfer  balances from the ledger  \n       \n2.1 Asset, liability, and equity balances \nare transferred in accordance with \nChart of Accounts \n2.2 Income and expense balances are \ntransferred in accordance with \nChart of Accounts \n3.  Summarize trial balance \n3.1 Debits and credits are totaled with \n100% accuracy \n3.2 Trial Balances are extracted with \n100% accuracy.\n\n--- PDF PAGE 46 ---\n-------------------------------------------------------------------------------------------------------     \nTR – Bookkeeping NC III                                                                  Promulgated November 2007 \n44\nRANGE OF VARIABLES \n \n \nVARIABLE\n \nRANGE\n1.  Assets, liability and equity account \ntitles \n May include but are not limited to: \n1.1 Cash \n1.2 Receivables \n1.3 Inventories \n1.4 Loans Payable \n2.  Income and expense account titles \n May include but are not limited to: \n2.1 Sales \n2.2 Rent Income \n2.3 Rent Expense \n2.4 Depreciation \n3.  Trial Balances \nMay include but are not limited to: \n3.1 Preliminary Trial Balance \n3.2 Adjusted Trial Balance \n3.3 Post-Closing Trial Balance\n\n--- PDF PAGE 47 ---\n-------------------------------------------------------------------------------------------------------     \nTR – Bookkeeping NC III                                                                  Promulgated November 2007 \n45\nEVIDENCE GUIDE \n \n1.  Critical aspects of competency \n Assessment requires evidence that the \ncandidate: \n1.1  Transferred ledger balances  \n1.2  Summarized trial balance \n1.3  Prepared trial balance \n2. Underpinning knowledge \n2.1 Accounting principles/Philippine    \nFinancial Reporting Standards \n2.2 Accounting equation \n3. Underpinning skills \n3.1  Using four (4) fundamental \nmathematical operations \n3.2  Reading and comprehension skills \n3.3  Communication skills \n3.4  Computer operation skills \n4. Resource implications \nThe following resources MUST be \nprovided: \n4.1  Workplace: real or simulated work \narea \n4.2  Appropriate tools and equipment \n4.3  Materials/supplies relevant to the \nactivity \n5. Method of assessment \nCompetency MUST be assessed \nthrough: \n \n5.1 Written Examination   \n5.2 Work Related Project \n6. Context of assessment \n6.1 Competency may be assessed in the \nworkplace or in a simulated work \nsetting.\n",
