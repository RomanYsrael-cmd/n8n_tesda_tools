        "source_title": "MANAGE OWN PERFORMANCE",
        "source_text": "--- PDF PAGE 35 ---\n-------------------------------------------------------------------------------------------------------     \nTR – Bookkeeping NC III                                                                  Promulgated November 2007 \n33\nUNIT OF COMPETENCY : \nMANAGE OWN PERFORMANCE \n \nUNIT CODE \n: \nHCS913202 \n \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge, skills and attitudes in \neffectively managing own workload and quality of work. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables\n1.  Plan for completion of \nown workload \n1.1 Tasks accurately identified. \n1.2 Priority allocated to each task. \n1.3 Time lines allocated to each task or series of tasks. \n1.4 Tasks deadlines known and complied with whenever \npossible. \n1.5 Work schedules are known and completed with agreed \ntime frames. \n1.6 Work plans developed according to assignment \nrequirements and employer policy. \n1.7 Uncompleted work or tasks detailed and responsibility \nfor completion passed to incoming shift or other \nappropriate persons.\n2.  Maintain quality of \nperformance \n2.1  Personal performance continually monitored against   \nagreed   performance standards. \n2.2  Advice and guidance sought when necessary to \nachieve or maintain agreed standards. \n2.3 Guidance from management applied to achieve or \nmaintain agreed standards. \n2.4 Standard of work clarified and agreed according to \nemployer policy and procedures.\n3.  Build credibility with \ncustomers/clients \n3.1 Client expectations for reliability, punctuality and \nappearance adhered to. \n3.2 Possible causes of client/customer dissatisfaction \nidentified, dealt with recorded according to employer \npolicy.  \n3.3 Client fully informed of all relevant security matters in a \ntimely.\n\n--- PDF PAGE 36 ---\n-------------------------------------------------------------------------------------------------------     \nTR – Bookkeeping NC III                                                                  Promulgated November 2007 \n34\nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Tasks \n \n1.1 \nMay be identified through: \n1.1.1  Assignment Instructions \n1.1.2 Verbal Instructions by Senior Staff \n1.1.3 Policy Documents \n1.1.4 Duty Statements \n1.1.5 Self Assessment \n \n1.2      May be: \n1.2.1 Daily tasks \n1.2.2 Weekly tasks \n1.2.3 Regularly or irregularly occurring tasks \n2.  Performance \nStandards \nMay include: \n2.1 \nAssignment Instructions \n2.2\nProcedures established in policy documents\n\n--- PDF PAGE 37 ---\n-------------------------------------------------------------------------------------------------------     \nTR – Bookkeeping NC III                                                                  Promulgated November 2007 \n35\nEVIDENCE GUIDE \n \n1.  Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1   Planned for completion of own workload. \n1.2  Assessed verbal or written work plan through \nobservation and discussion of site and employer \nrequirements. \n1.3   Demonstrated capacity to complete task within \nspecified time frame. \n1.4 Maintained quality of own performance.\n2.  Underpinning \nknowledge and \nattitudes \n2.1 Site and assignment requirements \n2.2 Employer policy on performance management \n2.3 Indicators of appropriate performance for each area of \nresponsibility \n2.4 Steps for improving or maintaining performance\n3.  Underpinning skills \n3.1 Capacity to plan and prioritize work loads and \nrequirements \n3.2 Time and task management \n4.  Resource \nimplications \nThe following resources MUST be provided: \n4.1 Assessment Centers/Venues \n4.2 Accredited Assessors \n4.3 Modes of Assessment \n4.4 Evaluation Reports \n4.5 Access to relevant venue, equipment and materials \n4.6 Assignment Instructions \n4.7 Logbooks \n4.8 Operational manuals and makers’/customers’ \ninstructions  \n4.9 Assessment Instruments, including personal planner \nand assessment record book\n5.  Method of \nassessment \nCompetency may be assessed through: \n5.1   Written Test \n5.2   Demonstration \n5.3   Observation \n5.4 Questioning\n6.  Context of \nassessment\n6.1  Competency may be assessed in the workplace or in a \nsimulated work setting.\n",
