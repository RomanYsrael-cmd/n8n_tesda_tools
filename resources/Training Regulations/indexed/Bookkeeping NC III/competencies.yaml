ning skills \n1.1 \nAttention to detail when completing client/employer \ndocumentation  \n1.2     Interpersonal and communication skills required in \nclient contact assignments  \n1.3     Customer service skills required to meet \nclient/customer needs  \n1.4     Punctuality \n1.5     Customer Service \n1.6     Telephone Technique \n1.7     Problem Solving and Negotiation \n1.8   Maintaining Records\n4. Resource \nimplications \nThe following resources MUST be provided: \n4.1 \nAssessment Centers/Venues \n4.2 \nAccredited Assessors \n4.3 \nModes of Assessment \n4.4 \nEvaluation Reports \n4.5 \nAccess to a relevant venue, equipment and materials \n4.6 \nAssignment Instructions \n4.7 \nLogbooks \n4.8 \nOperational manuals and makers/customers’ \ninstructions  \n4.9 \nAssessment instruments, including personal planner \nand assessment record book\n5. Method of \nassessment \nCompetency may be assessed through: \n5.1 Written Test \n5.2 Demonstration with questioning \n5.3 Observation with questioning\n6. Context of \nAssessment\n6.1  Assessment may be conducted in the workplace or in a \nsimulated environment.\n",
