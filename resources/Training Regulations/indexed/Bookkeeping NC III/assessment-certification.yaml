source:
  heading: SECTION 4 NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS
  printed_page: 61

provisions:
  - number: "4.1"
    rule: Candidate must demonstrate competence through project-type assessment covering all units listed for the qualification; successful candidates receive a National Certificate signed by the TESDA Director General.
  - number: "4.2"
    rule: Assessment focuses on core units. Basic and common units are integrated or assessed concurrently with core units.
  - number: "4.3"
    rule: Eligible applicants include graduates of formal, non-formal and informal/enterprise-based training programs and experienced workers, whether wage-employed or self-employed.
  - number: "4.4"
    rule: Reassessment is allowed only after one month from the assessment date; for National Certificate reassessment, only unsuccessful task/s are reassessed.
  - number: "4.5"
    rule: A candidate who fails assessment twice consecutively must undergo a refresher course before another assessment.
  - number: "4.6"
    rule: Only certified individuals in the qualification may be nominated by the industry sector for accreditation as competency assessor.
  - number: "4.7"
    rule: Only accredited competency assessors may conduct assessment. A trainer who is also an accredited assessor may not assess that trainer's own trainees.
  - number: "4.8"
    rule: Competency assessment must be undertaken through a TESDA-accredited assessment center; performance demonstration may be conducted in a venue/workplace duly designated by an accredited assessment center.
  - number: "4.9"
    rule: Detailed guidelines are contained in TESDA's Procedures Manual on Assessment and Certification and Guidelines on the Implementation of the Philippine TVET Qualification and Certification System (PTQCS).
