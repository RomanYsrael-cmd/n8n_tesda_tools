      "text": "1 To attain the national Qualification of Bookkeeping NC III the candidate must demonstrate competence through project-type assessment covering all the units listed in Section 1. Successful candidates shall be awarded a National Certificate signed by the TESDA Director General."
    },
    {
      "number": "4",
      "text": "2 Assessment shall focus on the core units of competency. The basic and common units shall be integrated or assessed concurrently with the core units."
    },
    {
      "number": "4",
      "text": "3 The following are qualified to apply for assessment and certification:"
    },
    {
      "number": "4.3",
      "text": "1 Graduates of formal, non-formal and informal including enterprise-based training programs"
    },
    {
      "number": "4.3",
      "text": "2 Experienced Workers (wage employed or self-employed)"
    },
    {
      "number": "4",
      "text": "4 Reassessment is allowed only after one month from the date of assessment. Reassessment for a National Certificate shall be done only on the task/s that the candidate did not successfully achieve."
    },
    {
      "number": "4",
      "text": "5 A candidate who fails the assessment for two (2) consecutive times will be required to go through a refresher course before taking another assessment."
    },
    {
      "number": "4",
      "text": "6 Only certified individuals in this Qualification may be nominated by the industry sector for accreditation as competency assessor."
    },
    {
      "number": "4",
      "text": "7 Only accredited competency assessors are allowed to conduct competency assessment, however, trainees who are accredited competency assessors are not allowed to assess their trainees."
    },
    {
      "number": "4",
      "text": "8 Assessment of competence must be undertaken only in the TESDA accredited assessment center. The performance assessment (demonstration of competence), however, may be done in any venue or workplace duly designated by an accredited assessment center."
