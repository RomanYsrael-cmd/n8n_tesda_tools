      "definition": "Depreciation is the process of allocating the cost of property, plant and equipment assets to the periods that will benefit from its use Dividend income is income received from ownership shares in a corporation. A dividend is a distribution to a corporations stockholders usually in cash; Documents are bases of recording transactions in bookkeeping. This may include but not limited to sales invoice and official receipts. Drawing is when a business proprietor draws money for personal needs Equity represents the residual claims of owners Expenses represent the outflow of assets (or increases in liabilities) due to a company’s operating activities. Financial statements report the business activities during the year and the financial condition at the end of the year. It is also the presentation of financial data including BALANCE SHEETS, INCOME STATEMENTS and STATEMENTS OF CASH FLOW, or any supporting statement that is intended to communicate an entity's financial position at a point in time and its results of operations for a period then ended. Generally accepted accounting standards (GAAP) determine what to record, when to record, and amount to record. It is also the rules, and procedures necessary to define accepted accounting practice at a particular time. General Journal is the most basic of journals. It is a chronological list of transactions. General Ledger is the collection of all ASSET, LIABILITY, owners EQUITY, REVENUE, and expense accounts. This is a book of accounts in which data from transactions recorded in journals are posted and thereby classified and summarized. Also called ledger. Income is the inflow of REVENUE during a period of time. This also money received by a person or organization because of effort (work), or from return on investments. Income Statement shows the components of net income in detail. It is the summary of the effect of REVENUES and expenses over a period of time. Income Taxes Payable is income taxes due including current portion of deferred taxes. Interest Income includes amounts from interest on all interest-bearing deposits and accounts. Internal Control is the process designed to provide reasonable assurance regarding achievement of various management objectives such as the reliability of financial reports. Inventories are products on hand for sale to customers. Journal is a book where all transactions are initially recorded. Journal entry are the logging of business transactions and their monetary value into the t-accounts of the accounting journal as either debits or credits. A journal entry is usually backed up with a piece of paper; a receipt, a bill, an invoice, or some other direct record of the transaction; making them easy to record and to maintain traceability for each transaction. Journalize transactions is the process of recording a business transaction in a journal. Ledger is a tool used for classifying and summarizing information about increases, decreases, and balances of items in the chart of accounts. Liability represents obligations, payables or debts owed. DEBTS or obligations owed by one entity (DEBTOR) to another entity (CREDITOR) payable in money, goods, or services Loans Payable is the account title used to record amounts to be paid for borrowed money. This is also called Notes Payable. Notes Payable is the account title used to record amounts to be paid for borrowed money and evidenced by a promissory note. This is also called Loans Payable. Official receipts is a document issued to acknowledge receipt of cash. Partnership is a form of entity with two or more owners. Relationship between two or more persons based on a written, oral, or implied agreement whereby they agree to carry on a trade or business for profit and share the resulting profits. Philippine Financial Reporting Standards often known as PFRS are a set of accounting standards. They are issued by the Financial Reporting Standards"
