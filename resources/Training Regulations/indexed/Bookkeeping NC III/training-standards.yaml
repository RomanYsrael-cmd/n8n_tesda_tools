      "source_text": "3.4 TOOLS AND EQUIPMENT\n\nLIST OF TOOL, EQUIPMENT AND MATERIALS\nBOOKKEEPING – NC III\n\nRecommended list of tools, equipment and materials for the training of a\nminimum of 25 trainees for Bookkeeping NC III are as follows:\n\nTOOLS\nEQUIPMENT\nMATERIALS\nQTY\nSPECIFICATION/\nDESCRIPTION\nQTY\nSPECIFICATION/\nDESCRIPTION\n\nQTY\nSPECIFICATION/\nDESCRIPTION\n1 pc.\nStapler\n1 unit\nComputer/Laptop\n25 pcs.\nPencils\n25 pcs Calculators\n1 unit\nAircon unit\n25 pcs.\nPencil Erasers\n\n1 unit\nLCD Projector\n25 pcs.\nBallpens\n\n1 unit\nTeacher’s\nTable/Chair\n25 pcs.\nRuler\n\n25 pcs.\nArm Chairs\n25 pcs.\nJournals (assorted\ncolumns)\n\n1 pc.\nWhite Board\n25 pcs.\nLedger\n\n25 pcs.\nWorksheets\n(assorted)\n\n1 box\nAcetate\n\n3 pcs.\nMarker\n\nDiskettes/CD\n\n25 pcs.\nEnvelopes ( Long)\n\n25 pcs.\nRegistration Forms\n\n1 pc.\nTeacher’s Record\nBook\n\n50 pcs\nWorksheets\n(Asstd.)\n\n1 pc.\nMarker Ink\n\n25 pcs.\nLedger Book\n\n1 box\nStaple Wire\n\n--- PDF PAGE 61 ---\n-------------------------------------------------------------------------------------------------------\nTR – Bookkeeping NC III Promulgated November 2007\n59"
