trainer_qualifications:
  - Holder of Bookkeeping NC III or a Certified Public Accountant.
  - Graduate of B.S. Accounting or equivalent.
  - Completed Training Methodology III or equivalent.
  - Able to communicate effectively orally and in written form.
  - At least three years of industry experience as a bookkeeper.
  - Possess good moral character.

institutional_assessment:
  purpose: Determine trainee achievement of units of competency.
  award: Certificate of achievement for each unit of competency.
