    "source_text": "3.1 CURRICULUM DESIGN\n\nCourse Title: Bookkeeping\nNC Level: NC III\nNominal Training Duration: 20 HOURS (Basic Competencies)\n 24 HOURS (Common Competencies)\n 248 HOURS (Core Competencies)\n\nCourse Description:\n\nThis course is designed to enhance the knowledge, skills and attitude of\nBookkeepers in accordance with industry standards. It covers the basic, common\nand core competencies on journalizing transactions, posting transactions,\npreparing trial balance, preparing financial reports and reviewing internal control\nsystem.\n\nTo obtain this, all units prescribed for this qualification must be achieved.\n\nBASIC COMPETENCIES\n\nSuggested Nominal Training Duration: 20 Hrs.\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Lead workplace\ncommunication\n1.1\nCommunicate\ninformation about\nworkplace\nprocesses.\n1.2\nLead workplace\ndiscussions.\n1.3\nIdentify and\ncommunicate\nissues arising in\nthe workplace\n• Group\ndiscussion\n• Role Play\n• Brainstorming\n\n• Observation\n• Interviews\n\n--- PDF PAGE 55 ---\n-------------------------------------------------------------------------------------------------------\nTR – Bookkeeping NC III Promulgated November 2007\n53\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n2. Lead small\nteams\n2.1\nProvide team\nleadership.\n2.2\nAssign\nresponsibilities\namong members\n2.3\nSet performance\nexpectation for\nteam members\n2.4\nSupervise team\nperformance\n• Lecture\n• Demonstration\n• Self-paced\n(modular)\n• Demonstration\n• Case studies\n3. Develop and\npractice\nnegotiation skills\n3.1\nIdentify relevant\ninformation in\nplanning\nnegotiations\n3.2\nParticipate in\nnegotiations\n3.3\nDocument areas\nfor agreement\n• Direct\nobservation\n• Simulation/\nrole playing\n• Case studies\n• Written test\n• Practical/\nperformance\ntest\n4. Solve\nworkplace\nproblem related\nto work\nactivities\n\n4.1\nExplain the\nanalytical\ntechniques\n4.2\nIdentify the\nproblem.\n4.3\nDetermine the\npossible cause/s of\nthe problem.\n\n• Direct\nobservation\n• Simulation/role\nplaying\n• Case studies\n• Written test\n• Practical/\nperformance\ntest\n5. Use\nmathematical\nconcepts and\ntechniques\n5.1\nExplain the\nanalytical\ntechniques\n5.2\nIdentify\nmathematical tools\nand techniques to\nsolve problem\n5.3\nApply\nmathematical\nprocedures/\nsolution\n5.4\nAnalyze results\n\n• Direct\nobservation\n• Simulation/\nrole playing\n• Case studies\n• Written test\n• Practical/\nperformance\ntest\n6. Use relevant\ntechnologies\n6.1\nIdentify appropriate\ntechnology\n6.2\nApply relevant\ntechnology\n6.3\nMaintain/\nenhance relevant\ntechnology\n\n• Direct\nobservation\n• Simulation/\nrole playing\n• Case studies\n• Written test\n• Practical/\nperformance\ntest\n\n--- PDF PAGE 56 ---\n-------------------------------------------------------------------------------------------------------\nTR – Bookkeeping NC III Promulgated November 2007\n54\nCOMMON COMPETENCIES\n\nSuggested Nominal Training Duration: 24 Hrs.\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Maintain an\neffective\nrelationship with\nclients/customers\n\n1.1 Maintain a\nprofessional image\n1.2 Meet client/customer\nrequirements\n1.3 Build credibility with\ncustomers/clients\n\n• Group\nDiscussion\n• Power Point\nPresentation\n• Demonstration\n• Observation\n• Interviews/\nQuestioning\n2. Manage own\nperformance\n2.1 Identify tasks\naccurately\n2.2 Allocate priority to\neach task\n2.3 Allocate time lines to\neach task\n2.4 Meet and comply\ndeadlines\n2.5 Know and comply\nwith work schedules\n2.6 Develop work plans\n2.7 Monitor personal\nperformance\n2.8 Get advice and\nguidance from\nmanagement\n2.9 Apply guidance from\nmanagement\n2.10 Clarify standard of\nwork\n• Group\nDiscussion\n• Power Point\nPresentation\n• Demonstration\n• Observation\n• Interviews/\nQuestioning\n3. Apply quality\nstandards\n3.1 Assess clients\nneeds\n3.2 Assess own work\n3.3 Engage in quality\nimprovement\n• Group\nDiscussion\n• Interaction\n• Demonstration\n• Observation\n• Interviews/\nQuestioning\n\n--- PDF PAGE 57 ---\n-------------------------------------------------------------------------------------------------------\nTR – Bookkeeping NC III Promulgated November 2007\n55\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n4. Perform\ncomputer\noperations\n4.1 Identify and explain\nthe functions, general\nfeatures and\ncapabilities of both\nhardware and\nsoftware\n4.2 Prepare and use\nappropriate hardware\nand software\naccording to task\nrequirement\n4.3 Use appropriate\ndevices and\nprocedures to\ntransfer files/data\n4.4 Produce accurate\nand complete data\naccording to the\nrequirements\n\n• Lecture\n• Group\nDiscussion\n• Tutorial or\nself-pace\n\n• Interviews/\nQuestioning\n• Demonstration\n• Observation\n\nCORE COMPETENCIES\n\nCourse Title: BOOKKEEPING\nNC Level: NC III\n\nSuggested Nominal Training Duration: 248 Hrs.\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n\n1. Journalize\ntransactions\n\n1.1 Prepare chart of\naccounts\n\n1.2 Analyze\ndocuments\n\n1.3 Prepare journal\nentry\n\n• Lecture/\nDemonstration\n• OJT\n\n• Written\nExamination\n• Demonstration\n• Observation\n\n--- PDF PAGE 58 ---\n-------------------------------------------------------------------------------------------------------\nTR – Bookkeeping NC III Promulgated November 2007\n56\n\n2. Post\ntransactions\n\n2.1 Prepare ledger\n\n2.2 Transfer journal\nentries\n\n2.3 Summarize\nledger\n\n• Lecture/\nDemonstration\n• OJT\n\n• Written\nExamination\n• Demonstration\n• Observation\n\n3. Prepare trial\nbalance\n\n3.1 List account titles\n\n3.2 Transfer\nbalances from\nthe ledger\n\n3.3 Summarize trial\nbalance\n\n• Lecture/\nDemonstration\n• OJT\n\n• Written\nExamination\n• Demonstration\n• Observation\n\n4. Prepare financial\nreports\n\n4.1 Prepare financial\nstatements\n\n4.2 Analyze financial\nstatements\n\n• Lecture/\nDemonstration\n• OJT\n\n• Written\nExamination\n• Demonstration\n• Observation\n\n5. Review internal\ncontrol system\n\n5.1 Check policy\ncompliance\n\n5.2 Prepare policy\ncompliance\nreport\n\n• Lecture/\nDemonstration\n• OJT\n\n• Written\nExamination\n• Demonstration\n• Observation"
