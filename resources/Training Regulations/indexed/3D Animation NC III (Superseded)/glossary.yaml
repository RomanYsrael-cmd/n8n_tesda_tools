    {
      "term": "SECTOR SPECIFIC",
      "definition": "1. Animation – a simulation of movement created by displaying a series of pictures, or frames. Cartoons on television are one example of animation. Animation on computers is one of the chief ingredients of multimedia presentations. There are many software applications that enable you to create animations that you can display on a computer monitor. 2. 3D Animation – the creation of moving pictures in a three-dimensional digital environment. This is done by sequencing consecutive images, or \"frames\", that simulate motion by each image showing the next in a gradual progression of steps, filmed by a virtual \"camera\" and then output to video by a rendering engine. 3. Browser – a software package that provides the user interface for accessing Internet, intranet and extranet Web sites. /secjr 4. Computer – a device that has the ability to accept data; internally store and execute a program of instructions; perform mathematical, logical, and manipulative operations on data; and report the results. 5. Computer Terminal – any input/output device connected by telecommunications links to a computer. 6. Data - objective measurements of the attributes (characteristics) of entities such as people, places, things, and events. 7. Documentation – a collection of documents or information. 8. Edit – to modify the form or format of data 9. Encryption – to scramble data or convert it, prior to transmission, to a secret code that masks the meaning of he data to unauthorized recipients. 10. End user – anyone who uses an information system or the information it produces. 11. Ergonomics - the science and technology emphasizing the safety, comfort, and ease of use of human-operated machines. The goal of ergonomics is to produce systems that are user-friendly: safe, comfortable and easy to use. 12. Information – data placed in a meaningful and useful context for an end user. 13. Information and Communication Technology (ICT) - refers to technologies associated with the transmission and exchange of data in the form of sound, text, visual images, signals or any combination of those forms through the use of digital technology. It encompasses such services as telecommunications, posts, multimedia, electronic commerce, broadcasting, and information technology. 14. Local Area Network (LAN) – a communications network that typically connects computers, terminals, and other computerized devices within a limited physical area such as an office, building, manufacturing plant and other work sites. 15. Outsourcing – turning over all or part of an organization’s information systems operation to outside contractors, known as systems integrators or facilities management companies. 16. Quality Assurance – methods for ensuring that information system are free from errors and fraud and provide information products of high quality. 17. Simulation - the process of imitating a real phenomenon with a set of mathematical formulas. Advanced computer programs can simulate weather conditions, chemical reactions, atomic reactions, and even biological processes. 18. Software – computer programs and procedures concerned with the operation of an information system. 19. Standards – measures of performance developed to evaluate the progress of a system toward its objectives 20. System – an assembly of methods, procedures, or techniques unified by regulated interaction to form an organized whole 21. User- friendly – a characteristic of human-operated equipment and systems that makes them safe, comfortable, and easy to use. /secjr"
    }
  ],
  "source_text": "GENERAL\n\n1) Certification - is the process of verifying and validating the competencies of a\nperson through assessment\n\n2) Certificate of Competency (COC) – is a certification issued to individuals who pass\nthe assessment for a single unit or cluster of units of competency\n\n3) Common Competencies - are the skills and knowledge needed by all people\nworking in a particular industry\n\n4) Competency - is the possession and application of knowledge, skills and attitudes\nto perform work activities to the standard expected in the workplace\n\n5) Competency Assessment - is the process of collecting evidence and making\njudgements on whether competency has been achieved\n\n6) Competency Standard (CS) - is the industry-determined specification of\ncompetencies required for effective work performance\n\n7) Context of Assessment - refers to the place where assessment is to be conducted\nor carried out\n\n8) Core Competencies - are the specific skills and knowledge needed in a particular\narea of work - industry sector/occupation/job role\n\n9) Critical aspects of competency - refers to the evidence that is essential for\nsuccessful performance of the unit of competency\n\n10) Elective Competencies - are the additional skills and knowledge required by the\nindividual or enterprise for work\n\n11) Elements - are the building blocks of a unit of competency. They describe in\n outcome terms the functions that a person perform in the workplace\n\n12) Evidence Guide - is a component of the unit of competency that defines or\nidentifies the evidences required to determine the competence of the individual. It\nprovides information on critical aspects of competency, underpinning knowledge,\nunderpinning skills, resource implications, assessment method and context of\nassessment\n\n13) Level - refers to the category of skills and knowledge required to do a job\n\n14) Method of Assessment - refers to the ways of collecting evidence and when\nevidence should be collected\n\n15) National Certificate (NC) – is a certification issued to individuals who achieve all\nthe required units of competency for a national qualification defined under the\nTraining Regulations. NCs are aligned to specific levels within the PTQF\n\n16) Performance Criteria - are evaluative statements that specify what is to be\nassessed and the required level of performance\n\n--- PDF PAGE 50 ---\n__________________________________________________________________________________________\nTR - 3D ANIMATION NC III Promulgated July 20, 2007\n/secjr\n\n48\n\n17) Qualifications - is a cluster of units of competencies that meets job roles and are\nsignificant in the workplace. It is also a certification awarded to a person on\nsuccessful completion of a course in recognition of having demonstrated\ncompetencies in an industry sector\n\n18) Range of Variables - describes the circumstances or context in which the work is\nto be performed\n\n19) Recognition of Prior Learning (RPL) – is the acknowledgement of an individual’s\nskills, knowledge and attitudes gained from life and work experiences outside\nregistered training programs\n\n20) Resource Implications - refers to the resources needed for the successful\nperformance of the work activity described in the unit of competency. It includes\nwork environment and conditions, materials, tools and equipment\n\n21) Basic Competencies - are the skills and knowledge that everyone needs for work\n\n22) Training Regulations (TR) – refers to the document promulgated and issued by\nTESDA consisting of competency standards, national qualifications and training\nguidelines for specific sectors/occupations. The TR serve as basis for\nestablishment of qualification and certification under the PTQF. It also serves as\nguide for development of competency-based curricula and instructional materials\nincluding registration of TVET programs offered by TVET providers\n\n23) Underpinning Knowledge - refers to the competency that involves in applying\nknowledge to perform work activities. It includes specific knowledge that is\nessential to the performance of the competency\n\n24) Underpinning Skills - refers to the list of the skills needed to achieve the elements\nand performance criteria in the unit of competency. It includes generic and\nindustry specific skills\n\n25) Unit of Competency – is a component of the competency standards stating a\nspecific key function or role in a particular job or occupation; it is the smallest\ncomponent of achievement that can be assessed and certified under the PTQF\n\nSECTOR SPECIFIC\n\n1. Animation – a simulation of movement created by displaying a series of pictures,\nor frames. Cartoons on television are one example of animation. Animation on\ncomputers is one of the chief ingredients of multimedia presentations. There are\nmany software applications that enable you to create animations that you can\ndisplay on a computer monitor.\n2. 3D Animation – the creation of moving pictures in a three-dimensional digital\nenvironment. This is done by sequencing consecutive images, or \"frames\", that\nsimulate motion by each image showing the next in a gradual progression of steps,\nfilmed by a virtual \"camera\" and then output to video by a rendering engine.\n3. Browser – a software package that provides the user interface for accessing\nInternet, intranet and extranet Web sites.\n\n--- PDF PAGE 51 ---\n__________________________________________________________________________________________\nTR - 3D ANIMATION NC III Promulgated July 20, 2007\n/secjr\n\n49\n4. Computer – a device that has the ability to accept data; internally store and\nexecute a program of instructions; perform mathematical, logical, and manipulative\noperations on data; and report the results.\n5. Computer Terminal – any input/output device connected by telecommunications\nlinks to a computer.\n6. Data - objective measurements of the attributes (characteristics) of entities such as\npeople, places, things, and events.\n7. Documentation – a collection of documents or information.\n8. Edit – to modify the form or format of data\n9. Encryption – to scramble data or convert it, prior to transmission, to a secret code\nthat masks the meaning of he data to unauthorized recipients.\n10. End user – anyone who uses an information system or the information it\nproduces.\n11. Ergonomics - the science and technology emphasizing the safety, comfort, and\nease of use of human-operated machines. The goal of ergonomics is to produce\nsystems that are user-friendly: safe, comfortable and easy to use.\n12. Information – data placed in a meaningful and useful context for an end user.\n13. Information and Communication Technology (ICT) - refers to technologies\nassociated with the transmission and exchange of data in the form of sound, text,\nvisual images, signals or any combination of those forms through the use of digital\ntechnology. It encompasses such services as telecommunications, posts,\nmultimedia, electronic commerce, broadcasting, and information technology.\n14. Local Area Network (LAN) – a communications network that typically connects\ncomputers, terminals, and other computerized devices within a limited physical\narea such as an office, building, manufacturing plant and other work sites.\n15. Outsourcing – turning over all or part of an organization’s information systems\noperation to outside contractors, known as systems integrators or facilities\nmanagement companies.\n16. Quality Assurance – methods for ensuring that information system are free from\nerrors and fraud and provide information products of high quality.\n17. Simulation - the process of imitating a real phenomenon with a set of\nmathematical formulas. Advanced computer programs can simulate weather\nconditions, chemical reactions, atomic reactions, and even biological processes.\n18. Software – computer programs and procedures concerned with the operation of\nan information system.\n19. Standards – measures of performance developed to evaluate the progress of a\nsystem toward its objectives\n20. System – an assembly of methods, procedures, or techniques unified by regulated\ninteraction to form an organized whole\n21. User- friendly – a characteristic of human-operated equipment and systems that\nmakes them safe, comfortable, and easy to use.\n\n--- PDF PAGE 52 ---\n__________________________________________________________________________________________\nTR - 3D ANIMATION NC III Promulgated July 20, 2007\n/secjr\n\n50",
