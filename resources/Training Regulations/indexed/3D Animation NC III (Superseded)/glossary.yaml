      "term": "GENERAL",
      "definition": "1) Certification - is the process of verifying and validating the competencies of a person through assessment 2) Certificate of Competency (COC) – is a certification issued to individuals who pass the assessment for a single unit or cluster of units of competency 3) Common Competencies - are the skills and knowledge needed by all people working in a particular industry 4) Competency - is the possession and application of knowledge, skills and attitudes to perform work activities to the standard expected in the workplace 5) Competency Assessment - is the process of collecting evidence and making judgements on whether competency has been achieved 6) Competency Standard (CS) - is the industry-determined specification of competencies required for effective work performance 7) Context of Assessment - refers to the place where assessment is to be conducted or carried out 8) Core Competencies - are the specific skills and knowledge needed in a particular area of work - industry sector/occupation/job role 9) Critical aspects of competency - refers to the evidence that is essential for successful performance of the unit of competency 10) Elective Competencies - are the additional skills and knowledge required by the individual or enterprise for work 11) Elements - are the building blocks of a unit of competency. They describe in outcome terms the functions that a person perform in the workplace 12) Evidence Guide - is a component of the unit of competency that defines or identifies the evidences required to determine the competence of the individual. It provides information on critical aspects of competency, underpinning knowledge, underpinning skills, resource implications, assessment method and context of assessment 13) Level - refers to the category of skills and knowledge required to do a job 14) Method of Assessment - refers to the ways of collecting evidence and when evidence should be collected 15) National Certificate (NC) – is a certification issued to individuals who achieve all the required units of competency for a national qualification defined under the Training Regulations. NCs are aligned to specific levels within the PTQF 16) Performance Criteria - are evaluative statements that specify what is to be assessed and the required level of performance /secjr 17) Qualifications - is a cluster of units of competencies that meets job roles and are significant in the workplace. It is also a certification awarded to a person on successful completion of a course in recognition of having demonstrated competencies in an industry sector 18) Range of Variables - describes the circumstances or context in which the work is to be performed 19) Recognition of Prior Learning (RPL) – is the acknowledgement of an individual’s skills, knowledge and attitudes gained from life and work experiences outside registered training programs 20) Resource Implications - refers to the resources needed for the successful performance of the work activity described in the unit of competency. It includes work environment and conditions, materials, tools and equipment 21) Basic Competencies - are the skills and knowledge that everyone needs for work 22) Training Regulations (TR) – refers to the document promulgated and issued by TESDA consisting of competency standards, national qualifications and training guidelines for specific sectors/occupations. The TR serve as basis for establishment of qualification and certification under the PTQF. It also serves as guide for development of competency-based curricula and instructional materials including registration of TVET programs offered by TVET providers 23) Underpinning Knowledge - refers to the competency that involves in applying knowledge to perform work activities. It includes specific knowledge that is essential to the performance of the competency 24) Underpinning Skills - refers to the list of the skills needed to achieve the elements and performance criteria in the unit of competency. It includes generic and industry specific skills 25) Unit of Competency – is a component of the competency standards stating a specific key function or role in a particular job or occupation; it is the smallest component of achievement that can be assessed and certified under the PTQF"
