    "source_text": "3.1\nCURRICULUM DESIGN\n\nCourse Title: 3D Animation\n\nNC Level: NC III\n\nNominal Training Duration:\n64 hrs – Basic Competencies\n\n 16 hrs – Common Competencies\n\n 960 hrs – Core Competencies\n\nCourse Description:\n\nThis course is designed to develop & enhance the knowledge, skills, & attitudes of a 3D\nAnimator in accordance with industry standards. It covers the basic & common\ncompetencies in addition to the core competencies such as to produce key drawings for\nanimation, create 3D digital animation and to use an authoring tool to create an\ninteractive sequence. The nominal duration of 1,040 hours covers the required units at\n3D Animation NC III. TVET providers can however, offer a longer, ladderized course\ncovering the NC III basic, common and core units.\n\nBASIC COMPETENCIES\n64 hrs\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Lead workplace\ncommunication\n1.1 Communicate information\nabout workplace\nprocesses.\n1.2 Lead workplace\ndiscussions.\n1.3 Identify and communicate\nissues arising in the\nworkplace\n• Group discussion\n• Role Play\n• Brainstorming\n\n• Observation\n• Interviews\n2. Lead small\nteams\n2.1 Provide team leadership.\n2.2 Assign responsibilities\namong members.\n2.3 Set performance\nexpectation for team\nmembers.\n2.4 Supervise team\nperformance\n• Lecture\n• Demonstration\n• Self-paced\n(modular)\n• Demonstratio\nn\n• Case studies\n\n--- PDF PAGE 41 ---\n__________________________________________________________________________________________\nTR - 3D ANIMATION NC III Promulgated July 27, 2007\n/secjr\n\n39\n3. Develop and\npractice\nnegotiation\nskills\n3.1 Identify relevant\ninformation in planning\nnegotiations\n3.2 Participate in negotiations\n3.3 Document areas for\nagreement\n• Direct\nobservation\n• Simulation/role\nplaying\n• Case studies\n• Written test\n• Practical/\nperformance\ntest\n4. Solve\nworkplace\nproblem related\nto work\nactivities\n4.1 Explain the analytical\ntechniques.\n4.2 Identify the problem.\n4.3 Determine the possible\ncause/s of the problem.\n• Direct observation\n• Simulation/role\nplaying\n• Case studies\n• Written test\n• Practical/\nperformance\ntest\n5. Use\nmathematical\nconcepts and\ntechniques\n5.1 Identify mathematical\ntools and techniques to\nsolve problem\n5.2 Apply mathematical\nprocedures/solution\n5.3 Analyze results\n• Direct observation\n• Simulation/role\nplaying\n• Case studies\n• Written test\n• Practical/\nperformance\ntest\n6. Use relevant\ntechnologies\n6.1 Identify appropriate\ntechnology\n6.2 Apply relevant technology\n6.3 Maintain/enhance\nrelevant technology\n• Direct observation\n• Simulation/role\nplaying\n• Case studies\n• Written test\n• Practical/\nperformance\ntest\n\nCOMMON COMPETENCIES\n16 hrs\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Apply Quality\nStandards\n1.1 Asses quality of received\nmaterials\n1.2 Assess own work\n1.3 Engage in quality\nimprovement\n Field trip\n Symposium\n Film showing\n Simulation\n On the job\ntraining\n Demonstration &\nquestioning\n Observation &\nquestioning\n Third party\nreport\n2. Operate a\nPersonal\nComputer\n2.1 Plan and prepare for task\nto be undertaken\n2.2 Input data into computer\n2.3 Access information using\ncomputer\n2.4 Produce output/data using\ncomputer system\n2.5 Use basic functions of a\nweb browser to locate\ninformation\n2.6 Maintain computer\nequipment and systems\n Modular\n Film showing\n Computer\nbased training\n(e-learning)\n Project method\n On the job\ntraining\n\n Demonstration &\nquestioning\n Observation &\nquestioning\n Third party\nreport\n Assessment of\noutput product\n Portfolio\n Computer-\nbased\nassessment\n\n--- PDF PAGE 42 ---\n__________________________________________________________________________________________\nTR - 3D ANIMATION NC III Promulgated July 27, 2007\n/secjr\n\n40\nCORE COMPETENCIES\n960 hrs\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Produce key\ndrawings for\nanimation\n1.1. Identify animation\nrequirements\n1.2. Produce key drawings\n1.3. Edit, revise and complete key\ndrawings\n• Lecture/\nDiscussion\n• Hands on\n• Exercises\n• Demonstration\n• Viewing\nmultimedia\n\n• Written exam\n• Practical exam\nObservation in\nworkplace\n• Interviews/\nquestioning\n2. Create 3D\ndigital\nanimation\n2.1. Relate traditional arts to 3D\nAnimation productions and be\nable to work and set-up their\npersonal interface for work\nconvenience\n2.2. Model both 3D Environment\nand Character and start\nconstructing Objects\n2.3. Add life to objects they have\ncreated by adding shades\nand texture to the object, and\nbasic lights for the scene\n2.4. Create controllers to the\ncharacter, add motion to the\ncharacters and animated\nobjects and edit animation for\nproject presentation\n2.5. Finalize scene set-up, render,\ncomposite scene for final\nvideo output\n\n• Lecture/\nDiscussion\n• Hands on/\nPractical Work\nApproach\n• Exercises\n• Industry tour\n• Self-pace\n• Film showing\n• Demonstration\n• Direct\nobservation\n• Demonstration\nwith oral\nquestioning\n• Third Party\nReport\n• Portfolio\n3. Use an\nauthoring\ntool to create\nan interactive\nsequence\n3.1. Plan use of authoring tool\n3.2. Use authoring tool\n3.3. Check functionality of\nmultimedia sequence\n• Lecture/\nDiscussion\n• Hands on\n• Exercises\n• Demonstration\n• Viewing\nmultimedia\n\n• Written exam\n• Practical exam\n• Observation in\nworkplace\n• Interviews/\nquestioning\n\n--- PDF PAGE 43 ---\n__________________________________________________________________________________________\nTR - 3D ANIMATION NC III Promulgated July 27, 2007\n/secjr\n\n41"
