      "source_text": "3.4 LIST OF TOOLS, EQUIPMENT AND MATERIALS\n\nRecommended list of tools, equipment and materials for the conduct of training\nin 3D Animation NC III:\n\nTOOLS\nEQUIPMENT\nMATERIALS\nQty\nDescription\nQty.\nDescription\nQty.\nDescription\n\nOperating system\n\nComputer with peripherals\nReference Book\n\nInternet Browsers\n(Netscape Navigator,\nInternet Explorer,\nMozilla, Opera)\n\nErgonomic computer\ntables and chairs\n\nLearning materials/\nguide\n\nLCD Projector\n\nModules\n\nPrinter\n\nLearning elements\n\nMark–up Languages\n(HTML, DHTML, XML,\nXHTML, SGML,VRM,)\n\nOHP\n\nHand-outs\n\nPrintable\nstoryboard\n\nSoftwares, e.g.:\n - Maya\n - 3Dmax\n - Studio max\n - Softimage\n - Lightwave\n - Animation master\n - Maxxon\n - Electric image\n - Blender\n\nInteractive Flash\nmovies\n\nPractice materials\n\nAdobe PDF\ndocuments\n\nCD’s\n\nGraphics software\n\nFTP client and server\nsoftware\n\nAnimation disc\n\n--- PDF PAGE 45 ---\n__________________________________________________________________________________________\nTR - 3D ANIMATION NC III Promulgated July 27, 2007\n/secjr\n\n43\nThe quantity of tools and equipment to be used for the conduct of training for this\nqualification shall depend on the number of students, size of the class, and/or modality\nof training. The most important consideration is to make sure that tools and equipment\nare adequately provided to all trainees when needed. The actual list of tools, equipment,\nmachines, supplies and other materials to be used shall be identified and detailed in the\nCompetency Based Curriculum (CBC) to be submitted by the TVET provider when\nregistering a course or training program with TESDA.\n\nDue to the fast-changing nature of the Information and Communications\nTechnology (ICT) sector, TVET providers are reminded to use and provide their trainees\nwith the latest technology tools, equipment and materials where appropriate and\napplicable.\n\nIn cases where there are specialized tools, equipment and facilities that are\nnot generally considered standard requirements or not absolute requisites for training,\nthe industry working group or TESDA may provide guidelines or specific advice on such\nmatters."
