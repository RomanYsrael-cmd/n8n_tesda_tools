        "source_title": "LEAD WORKPLACE COMMUNICATION",
        "source_text": "--- PDF PAGE 4 ---\n__________________________________________________________________________________________ \nTR - 3D ANIMATION NC III                                                                                  Promulgated           July 27, 2007                \n/secjr \n \n2\nSECTION 2   COMPETENCY STANDARDS \n \nThis section gives the details of the contents of the basic, common and core \nunits of competency required in 3D ANIMATION NC III. \n \n \nBASIC COMPETENCIES \n \nUNIT OF COMPETENCY \n:   LEAD WORKPLACE COMMUNICATION \n \nUNIT CODE \n        \n:   500311109 \n \nUNIT DESCRIPTOR          \n:  This unit covers the knowledge, skills and attitudes    \nrequired to lead in the dissemination and discussion of  \nideas, information and issues in the workplace. \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1. Communicate \ninformation about \nworkplace \nprocesses \n1.1. Appropriate communication method is selected  \n1.2. Multiple operations involving several topics areas \nare communicated accordingly \n1.3. Questions are used to gain extra information \n1.4. Correct sources of information are identified \n1.5. Information is selected and organized correctly \n1.6. Verbal and written reporting is undertaken when \nrequired \n1.7. Communication skills are maintained in all situations \n2. Lead workplace \ndiscussions \n2.1. Response to workplace issues are sought  \n2.2. Response to workplace issues are provided \nimmediately \n2.3. Constructive contributions are made to workplace \ndiscussions on such issues as production, quality \nand safety \n2.4. Goals/objectives and action plan  undertaken in the \nworkplace are communicated \n3. Identify and \ncommunicate \nissues arising in the \nworkplace \n3.1. Issues and problems are identified as they arise \n3.2. Information regarding problems and issues are \norganized coherently to ensure clear and effective \ncommunication \n3.3. Dialogue is initiated with appropriate personnel \n3.4. Communication problems and issues are raised as \nthey arise\n\n--- PDF PAGE 5 ---\n__________________________________________________________________________________________ \nTR - 3D ANIMATION NC III                                                                                  Promulgated           July 27, 2007                \n/secjr \n \n3\n \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Methods of \ncommunication \n1.1. \nNon-verbal gestures \n1.2. \nVerbal \n1.3. \nFace to face \n1.4. \nTwo-way radio \n1.5. \nSpeaking to groups \n1.6. \nUsing telephone \n1.7. \nWritten \n1.8. \nInternet\n\n--- PDF PAGE 6 ---\n__________________________________________________________________________________________ \nTR - 3D ANIMATION NC III                                                                                  Promulgated           July 27, 2007                \n/secjr \n \n4\n \nEVIDENCE GUIDE \n \n1. Critical aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1. \nDealt with a range of communication/information at \none time \n1.2. \nMade constructive contributions in workplace \nissues \n1.3. \nSought workplace issues effectively \n1.4. \nResponded to workplace issues promptly \n1.5. \nPresented information clearly and effectively \nwritten form \n1.6. \nUsed appropriate sources of information \n1.7. \nAsked appropriate  questions \n1.8. \nProvided accurate information  \n2. Underpinning \nknowledge  \n2.1. \nOrganization \nrequirements \nfor \nwritten \nand \nelectronic communication methods \n2.2. \nEffective verbal communication methods \n3. Underpinning Skills \n3.1. \nOrganize information \n3.2. \nUnderstand and convey intended meaning \n3.3. \nParticipate in variety of workplace discussions \n3.4. \nComply with organization  requirements for the use \nof written and electronic communication methods \n4. Resource \nImplications \nThe following resources MUST be provided: \n4.1. \nVariety of Information \n4.2. \nCommunication tools \n4.3. \nSimulated workplace \n5. Methods of \nAssessment \nCompetency may be assessed through: \n5.1. \nCompetency in this unit must be assessed through \n5.2. \nDirect Observation \n5.3. \nInterview \n6. Context  for \nAssessment \n6.1. \nCompetency may be assessed in the workplace or \nin simulated workplace environment\n",
