  "source_section_text": "SECTION 2 COMPETENCY STANDARDS\n\nThis section gives the details of the contents of the basic, common and core\nunits of competency required in 3D ANIMATION NC III.\n\nBASIC COMPETENCIES\n\nUNIT OF COMPETENCY\n: LEAD WORKPLACE COMMUNICATION\n\nUNIT CODE\n\n: 500311109\n\nUNIT DESCRIPTOR\n: This unit covers the knowledge, skills and attitudes\nrequired to lead in the dissemination and discussion of\nideas, information and issues in the workplace.\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Communicate\ninformation about\nworkplace\nprocesses\n1.1. Appropriate communication method is selected\n1.2. Multiple operations involving several topics areas\nare communicated accordingly\n1.3. Questions are used to gain extra information\n1.4. Correct sources of information are identified\n1.5. Information is selected and organized correctly\n1.6. Verbal and written reporting is undertaken when\nrequired\n1.7. Communication skills are maintained in all situations\n2. Lead workplace\ndiscussions\n2.1. Response to workplace issues are sought\n2.2. Response to workplace issues are provided\nimmediately\n2.3. Constructive contributions are made to workplace\ndiscussions on such issues as production, quality\nand safety\n2.4. Goals/objectives and action plan undertaken in the\nworkplace are communicated\n3. Identify and\ncommunicate\nissues arising in the\nworkplace\n3.1. Issues and problems are identified as they arise\n3.2. Information regarding problems and issues are\norganized coherently to ensure clear and effective\ncommunication\n3.3. Dialogue is initiated with appropriate personnel\n3.4. Communication problems and issues are raised as\nthey arise\n\n--- PDF PAGE 5 ---\n__________________________________________________________________________________________\nTR - 3D ANIMATION NC III Promulgated July 27, 2007\n/secjr\n\n3\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Methods of\ncommunication\n1.1.\nNon-verbal gestures\n1.2.\nVerbal\n1.3.\nFace to face\n1.4.\nTwo-way radio\n1.5.\nSpeaking to groups\n1.6.\nUsing telephone\n1.7.\nWritten\n1.8.\nInternet\n\n--- PDF PAGE 6 ---\n__________________________________________________________________________________________\nTR - 3D ANIMATION NC III Promulgated July 27, 2007\n/secjr\n\n4\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1.\nDealt with a range of communication/information at\none time\n1.2.\nMade constructive contributions in workplace\nissues\n1.3.\nSought workplace issues effectively\n1.4.\nResponded to workplace issues promptly\n1.5.\nPresented information clearly and effectively\nwritten form\n1.6.\nUsed appropriate sources of information\n1.7.\nAsked appropriate questions\n1.8.\nProvided accurate information\n2. Underpinning\nknowledge\n2.1.\nOrganization\nrequirements\nfor\nwritten\nand\nelectronic communication methods\n2.2.\nEffective verbal communication methods\n3. Underpinning Skills\n3.1.\nOrganize information\n3.2.\nUnderstand and convey intended meaning\n3.3.\nParticipate in variety of workplace discussions\n3.4.\nComply with organization requirements for the use\nof written and electronic communication methods\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1.\nVariety of Information\n4.2.\nCommunication tools\n4.3.\nSimulated workplace\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1.\nCompetency in this unit must be assessed through\n5.2.\nDirect Observation\n5.3.\nInterview\n6. Context for\nAssessment\n6.1.\nCompetency may be assessed in the workplace or\nin simulated workplace environment\n\n--- PDF PAGE 7 ---\n__________________________________________________________________________________________\nTR - 3D ANIMATION NC III Promulgated July 27, 2007\n/secjr\n\n5\nUNIT OF COMPETENCY\n\n: LEAD SMALL TEAMS\n\nUNIT CODE\n\n: 500311110\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes to\nlead small teams including setting and maintaining\nteam and individual performance standards.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Provide team\nleadership\n1.1. Work requirements are identified and presented to\nteam members\n1.2. Reasons for instructions and requirements are\ncommunicated to team members\n1.3. Team members’ queries and concerns are\nrecognized, discussed and dealt with\n2. Assign\nresponsibilities\n2.1. Duties, and responsibilities are allocated having regard\nto the skills, knowledge and aptitude required to\nproperly undertake the assigned task and according to\ncompany policy\n2.2. Duties are allocated having regard to individual\npreference, domestic and personal considerations,\nwhenever possible\n3. Set performance\nexpectations for\nteam members\n3.1. Performance expectations are established based on\nclient needs and according to assignment requirements\n3.2. Performance expectations are based on individual team\nmembers duties and area of responsibility\n3.3. Performance expectations are discussed and\ndisseminated to individual team members\n4. Supervise team\nperformance\n4.1. Monitoring of performance takes place against\ndefined performance criteria and/or assignment\ninstructions and corrective action taken if required\n4.2. Team members are provided with feedback, positive\nsupport and advice on strategies to overcome any\ndeficiencies\n4.3. Performance issues which cannot be rectified or\naddressed within the team are referenced to appropriate\npersonnel according to employer policy\n4.4. Team members are kept informed of any changes in the\npriority allocated to assignments or tasks which might\nimpact on client/customer needs and satisfaction\n4.5. Team operations are monitored to ensure that\nemployer/client needs and requirements are met\n4.6. Follow-up communication is provided on all issues\naffecting the team\n4.7. All relevant documentation is completed in accordance\nwith company procedures\n\n--- PDF PAGE 8 ---\n__________________________________________________________________________________________\nTR - 3D ANIMATION NC III Promulgated July 27, 2007\n/secjr\n\n6\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Work requirements\n1.1. Client Profile\n1.2. Assignment instructions\n2. Team member’s\nconcerns\n2.1. Roster/shift details\n3. Monitor\nperformance\n3.1. Formal process\n3.2. Informal process\n4. Feedback\n4.1. Formal process\n4.2. Informal process\n5. Performance issues\n5.1. Work output\n5.2. Work quality\n5.3. Team participation\n5.4. Compliance with workplace protocols\n5.5. Safety\n5.6. Customer service\n\n--- PDF PAGE 9 ---\n__________________________________________________________________________________________\nTR - 3D ANIMATION NC III Promulgated July 27, 2007\n/secjr\n\n7\nEVIDENCE GUIDE\n1. Critical Aspects\nof Competency\nAssessment requires evidence that the candidate:\n1.1. Maintained or improved individuals and/or team\nperformance given a variety of possible scenario\n1.2. Assessed and monitored team and individual\nperformance against set criteria\n1.3. Represented concerns of a team and individual to next\nlevel of management or appropriate specialist and to\nnegotiate on their behalf\n1.4. Allocated duties and responsibilities, having regard to\nindividual’s knowledge, skills and aptitude and the needs\nof the tasks to be performed\n1.5. Set and communicated performance expectations for a\nrange of tasks and duties within the team and provided\nfeedback to team members\n2. Underpinning\nKnowledge\n2.1. Company policies and procedures\n2.2. Relevant legal requirements\n2.3. How performance expectations are set\n2.4. Methods of Monitoring Performance\n2.5. Client expectations\n2.6. Team member’s duties and responsibilities\n3. Underpinning\nSkills\n3.1. Communication skills required for leading teams\n3.2. Informal performance counseling skills\n3.3. Team building skills\n3.4. Negotiating skills\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1. Access to relevant workplace or appropriately simulated\nenvironment where assessment can take place\n4.2. Materials relevant to the proposed activity or task\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1. Direct observations of work activities of the individual\nmember in relation to the work activities of the group\n5.2. Observation of simulation and/or role play involving the\nparticipation of individual member to the attainment of\norganizational goal\n5.3. Case studies and scenarios as a basis for discussion of\nissues and strategies in teamwork\n6. Context of\nAssessment\n6.1. Competency assessment may occur in workplace or any\nappropriately simulated environment\n6.2. Assessment shall be observed while task are being\nundertaken whether individually or in-group\n\n--- PDF PAGE 10 ---\n__________________________________________________________________________________________\nTR - 3D ANIMATION NC III Promulgated July 27, 2007\n/secjr\n\n8\nUNIT OF COMPETENCY:\nDEVELOP AND PRACTICE NEGOTIATION\nSKILLS\n\nUNIT CODE :\n 500311111\nUNIT DESCRIPTOR :\nThis unit covers the skills, knowledge and attitudes\nrequired to collect information in order to negotiate to a\ndesired outcome and participate in the negotiation.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Plan negotiations\n1.1\n\n1.2\n\n1.3\n\n1.4\n\n1.5\nInformation on preparing for negotiation is\nidentified and included in the plan\nInformation on creating non verbal environments\nfor positive negotiating is identified and included in\nthe plan\nInformation on active listening is identified and\nincluded in the plan\nInformation on different questioning techniques is\nidentified and included in the plan\nInformation is checked to ensure it is correct and up-\nto- date\n\n2. Participate in\nnegotiations\n2.1\n\n2.2\n2.3\n\n2.4\n2.5\n\n2.6\n\n2.7\n2.8\nCriteria for successful outcome are agreed upon by\nall parties\nDesired outcome of all parties are considered\nAppropriate language is used throughout the\nnegotiation\nA variety of questioning techniques are used\nThe issues and processes are documented and\nagreed upon by all parties\nPossible solutions are discussed and their viability\nassessed\nAreas for agreement are confirmed and recorded\nFollow-up action is agreed upon by all parties\n\n--- PDF PAGE 11 ---\n__________________________________________________________________________________________\nTR - 3D ANIMATION NC III Promulgated July 27, 2007\n/secjr\n\n9\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Preparing for\nnegotiation\n1.1\n\n1.2\n1.3\n1.4\n\n1.5\n\n1.6\nBackground information on other parties to the\nnegotiation\nGood understanding of topic to be negotiated\nClear understanding of desired outcome/s\nPersonal attributes\n1.4.1 self awareness\n1.4.2 self esteem\n1.4.3 objectivity\n1.4.4 empathy\n1.4.5 respect for others\nInterpersonal skills\n1.5.1 listening/reflecting\n1.5.2 non verbal communication\n1.5.3 assertiveness\n1.5.4 behavior labeling\n1.5.5 testing understanding\n1.5.6 seeking information\n1.5.7 self disclosing\nAnalytic skills\n1.6.1 observing differences between content\nand process\n1.6.2 identifying bargaining information\n1.6.3 applying strategies to manage process\n1.6.4 applying steps in negotiating process\n1.6.5 strategies to manage conflict\n1.6.6 steps in negotiating process\n1.6.7 options within organization and\nexternally for resolving conflict\n\n2. Non-verbal\nenvironments\n2.1\n2.2\n2.3\n2.4\nFriendly reception\nWarm and welcoming room\nRefreshments offered\nLead in conversation before negotiation begins\n\n3. Active listening\n3.1\n3.2\n3.3\n3.4\n3.5\nAttentive\nDon’t interrupt\nGood posture\nMaintain eye contact\nReflective listening\n\n4. Questioning\ntechniques\n4.1\n4.2\n4.3\nDirect\nIndirect\nOpen-ended\n\n--- PDF PAGE 12 ---\n__________________________________________________________________________________________\nTR - 3D ANIMATION NC III Promulgated July 27, 2007\n/secjr\n\n10\n\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Demonstrated sufficient knowledge of the factors\ninfluencing negotiation to achieve agreed outcome\n1.2 Participated in negotiation with at least one person\nto achieve an agreed outcome\n\n2. Underpinning\nKnowledge and\nAttitude\n2.1 Codes of practice and guidelines for the\norganization\n2.2 Organizations policy and procedures for\nnegotiations\n2.3 Decision making and conflict resolution strategies\nprocedures\n2.4 Problem solving strategies on how to deal with\nunexpected questions and attitudes during\nnegotiation\n2.5 Flexibility\n2.6 Empathy\n3. Underpinning Skills\n3.1 Interpersonal skills to develop rapport with other\nparties\n3.2 Communication skills (verbal and listening)\n3.3 Observation skills\n3.1 Negotiation skills\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1 Room with facilities necessary for the negotiation\nprocess\n4.2 Human resources (negotiators)\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1 Observation/demonstration and questioning\n5.2 Portfolio assessment\n5.3 Oral and written questioning\n5.4 Third party report\n6. Context for\nAssessment\n6.1 Competency to be assessed in real work\nenvironment or in a simulated workplace setting.\n\n--- PDF PAGE 13 ---\n__________________________________________________________________________________________\nTR - 3D ANIMATION NC III Promulgated July 27, 2007\n/secjr\n\n11\nUNIT OF COMPETENCY :\nSOLVE PROBLEMS RELATED TO WORK\nACTIVITIES\nUNIT CODE\n\n: 500311112\nUNIT DESCRIPTOR\n\n:\nThis unit of covers the knowledge, skills and attitudes\nrequired to solve problems in the workplace including\nthe application of problem solving techniques and to\ndetermine and resolve the root cause of problems.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Identify the problem\n1.1.\nVariances are identified from normal operating\nparameters; and product quality\n1.2.\nExtent, cause and nature are of the problem\nare defined through observation, investigation\nand analytical techniques\n1.3.\nProblems are clearly stated and specified\n2. Determine\nfundamental causes\nof the problem\n2.1.\nPossible causes are identified based on\nexperience and the use of problem solving\ntools / analytical techniques.\n2.2.\nPossible cause statements are developed\nbased on findings\n2.3.\nFundamental causes are identified per results\nof investigation conducted\n3. Determine corrective\naction\n3.1.\nAll possible options are considered for\nresolution of the problem\n3.2.\nStrengths and weaknesses of possible options\nare considered\n3.3.\nCorrective actions are determined to resolve\nthe problem and possible future causes\n3.4.\nAction plans are developed identifying\nmeasurable objectives, resource needs and\ntimelines in accordance with safety and\noperating procedures\n4.\nProvide\nrecommendation/s\nto manager\n4.1.\nReport on recommendations are prepared\n4.2.\nRecommendations are presented to\nappropriate personnel.\n4.3.\nRecommendations are followed-up, if required\n\n--- PDF PAGE 14 ---\n__________________________________________________________________________________________\nTR - 3D ANIMATION NC III Promulgated July 27, 2007\n/secjr\n\n12\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Analytical techniques\n1.1.\nBrainstorming\n1.2.\nIntuitions/Logic\n1.3.\nCause and effect diagrams\n1.4.\nPareto analysis\n1.5.\nSWOT analysis\n1.6.\nGant chart, Pert CPM and graphs\n1.7.\nScattergrams\n\n2. Problem\n\n2.1.\nNon – routine process and quality problems\n2.2.\nEquipment selection, availability and failure\n2.3.\nTeamwork and work allocation problem\n2.4.\nSafety and emergency situations and\nincidents\n\n3. Action plans\n\n3.1.\nPriority requirements\n3.2.\nMeasurable objectives\n3.3.\nResource requirements\n3.4.\nTimelines\n3.5.\nCo-ordination and feedback requirements\n3.6.\nSafety requirements\n3.7.\nRisk assessment\n3.8.\nEnvironmental requirements\n\n--- PDF PAGE 15 ---\n__________________________________________________________________________________________\nTR - 3D ANIMATION NC III Promulgated July 27, 2007\n/secjr\n\n13\nEVIDENCE GUIDE\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1.\nIdentified the problem\n1.2.\nDetermined the fundamental causes of the problem\n1.3.\nDetermined the correct / preventive action\n1.4.\nProvided recommendation to manager\nThese aspects may be best assessed using a range of\nscenarios / case studies / what ifs as a stimulus with a\nwalk through forming part of the response. These\nassessment activities should include a range of problems,\nincluding new, unusual and improbable situations that may\nhave happened.\n2. Underpinning\nKnowledge\n2.1.\nCompetence includes a thorough knowledge and\nunderstanding of the process, normal operating\nparameters, and product quality to recognize non-\nstandard situations\n2.2.\nCompetence to include the ability to apply and\nexplain, sufficient for the identification of\nfundamental cause, determining the corrective\naction and provision of recommendations\n2.2.1. Relevant equipment and operational\nprocesses\n2.2.2. Enterprise goals, targets and measures\n2.2.3. Enterprise quality, OHS and environmental\nrequirement\n2.2.4. Principles of decision making strategies and\ntechniques\n2.2.5. Enterprise information systems and data\ncollation\n2.2.6. Industry codes and standards\n\n3. Underpinning\nSkills\n3.1.\nUsing range of formal problem solving techniques\n3.2.\nIdentifying and clarifying the nature of the problem\n3.3.\nDevising the best solution\n3.4.\nEvaluating the solution\n3.5.\nImplementation of a developed plan to rectify the\nproblem\n\n--- PDF PAGE 16 ---\n__________________________________________________________________________________________\nTR - 3D ANIMATION NC III Promulgated July 27, 2007\n/secjr\n\n14\n\n4. Resource\nImplications\n4.1.\nAssessment will require access to an operating\nplant over an extended period of time, or a suitable\nmethod of gathering evidence of operating ability\nover a range of situations. A bank of scenarios /\ncase studies / what ifs will be required as well as\nbank of questions which will be used to probe the\nreason behind the observable action.\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1.\nCase studies on solving problems in the workplace\n5.2.\nObservation\nThe unit will be assessed in a holistic manner as is\npractical and may be integrated with the assessment of\nother relevant units of competency. Assessment will occur\nover a range of situations, which will include disruptions to\nnormal, smooth operation. Simulation may be required to\nallow for timely assessment of parts of this unit of\ncompetency. Simulation should be based on the actual\nworkplace and will include walk through of the relevant\ncompetency components.\n6. Context of\nAssessment\n6.1.\nIn all workplace, it may be appropriate to assess\nthis unit concurrently with relevant teamwork or\noperation units.\n\n--- PDF PAGE 17 ---\n__________________________________________________________________________________________\nTR - 3D ANIMATION NC III Promulgated July 27, 2007\n/secjr\n\n15\n\nUNIT OF COMPETENCY: USE MATHEMATICAL CONCEPTS AND\n TECHNIQUES\nUNIT CODE :\n500311113\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes\nrequired in the application of mathematical concepts\nand techniques.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Identify mathematical\ntools and techniques to\nsolve problem\n1.1 Problem areas are identified based on given\ncondition\n1.2 Mathematical techniques are selected based\non the given problem\n\n2. Apply mathematical\nprocedure/solution\n2.1 Mathematical techniques are applied based on\nthe problem identified\n2.2 Mathematical computations are performed to the\nlevel of accuracy required for the problem\n2.3 Results of mathematical computation is\ndetermined and verified based on job\nrequirements\n\n3. Analyze results\n3.1 Result of application is reviewed based on\nexpected and required specifications and\noutcome\n3.2 Appropriate action is applied in case of error\n\n--- PDF PAGE 18 ---\n__________________________________________________________________________________________\nTR - 3D ANIMATION NC III Promulgated July 27, 2007\n/secjr\n\n16\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Mathematical\ntechniques\nMay include but are not limited to:\n1.1 Four fundamental operations\n1.2 Measurements\n1.3 Use/Conversion of units of measurements\n1.4 Use of standard formulas\n\n2. Appropriate action\n2.1 Review in the use of mathematical\ntechniques (e.g. recalculation, re-modeling)\n2.2 Report error to immediate superior for proper\naction\n\n--- PDF PAGE 19 ---\n__________________________________________________________________________________________\nTR - 3D ANIMATION NC III Promulgated July 27, 2007\n/secjr\n\n17\n\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Identified, applied and reviewed the use of\nmathematical concepts and techniques to workplace\nproblems\n\n2. Underpinning\nKnowledge\n2.1 Fundamental operation (addition, subtraction,\ndivision, multiplication)\n2.2 Measurement system\n2.3 Precision and accuracy\n2.4 Basic measuring tools/devices\n\n3. Underpinning Skills\n3.1 Applying mathematical computations\n3.2 Using calculator\n3.3 Using different measuring tools\n\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1 Calculator\n4.2 Basic measuring tools\n4.3 Case Problems\n\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1 Authenticated portfolio\n5.2 Written Test\n5.3 Interview/Oral Questioning\n5.4 Demonstration\n\n6. Context of\nAssessment\n6.1 Competency may be assessed in the work place or\nin a simulated work place setting\n\n--- PDF PAGE 20 ---\n__________________________________________________________________________________________\nTR - 3D ANIMATION NC III Promulgated July 27, 2007\n/secjr\n\n18\nUNIT OF COMPETENCY:\n USE RELEVANT TECHNOLOGIES\n\nUNIT CODE :\n 500311114\n\nUNIT DESCRIPTOR :\nThis unit of competency covers the knowledge,\nskills, and attitude required in selecting, sourcing\nand\napplying\nappropriate\nand\naffordable\ntechnologies in the workplace.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n\n1. Study/select\nappropriate technology\n\n1.1 Usage of different technologies is determined\nbased on job requirements\n1.2 Appropriate technology is selected as per work\n specification\n\n2. Apply relevant\ntechnology\n\n2.1 Relevant technology is effectively used in\ncarrying\n out function\n2.2 Applicable software and hardware are used as\nper\n task requirement\n2.3 Management concepts are observed and\npracticed as per established industry practices\n\n3. Maintain/enhance\nrelevant technology\n\n3.1 Maintenance of technology is applied in\naccordance with the industry standard\noperating procedure, manufacturer’s\noperating guidelines and occupational\nhealth and safety procedure to ensure its\noperative ability\n3.2 Updating of technology is maintained through\ncontinuing education or training in accordance\nwith job requirement\n3.3 Technology failure/ defect is immediately\nreported to the concern/responsible person or\nsection for appropriate action\n\n--- PDF PAGE 21 ---\n__________________________________________________________________________________________\nTR - 3D ANIMATION NC III Promulgated July 27, 2007\n/secjr\n\n19\n\n RANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Technology\nMay include but are not limited to:\n1.1 Office technology\n1.2 Industrial technology\n1.3 System technology\n1.4 Information technology\n1.5 Training technology\n\n2. Management concepts\nMay include but not limited to:\n2.1 Real Time Management\n2.2 KAIZEN or continuous improvement\n2.3 5s\n2.4 Total Quality Management\n2.5 Other management/productivity tools\n\n3. Industry standard operating\nprocedure\n3.1 Written guidelines relative to the usage of\noffice technology/equipment\n3.2 Verbal advise/instruction from the co-worker\n4. Manufacturer’s operating\nguidelines/ instructions\n4.1 Written instruction/manuals of specific\ntechnology/ equipment\n4.2 General instruction manual\n4.3 Verbal advise from manufacturer relative to\nthe operation of equipment\n\n5. Occupational health and\nsafety procedure\n5.1 Relevant statutes on OHS\n5.2 Company guidelines in using\n technology/equipment\n\n6. Appropriate action\n6.1 Implementing preventive maintenance\nschedule\n6.2 Coordinating with manufacturer’s technician\n\n--- PDF PAGE 22 ---\n__________________________________________________________________________________________\nTR - 3D ANIMATION NC III Promulgated July 27, 2007\n/secjr\n\n20\n\n EVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Studied and selected appropriate technology\nconsistent with work requirements\n1.2 Applied relevant technology\n1.3 Maintained and enhanced operative ability of\nrelevant technology\n\n2. Underpinning\nKnowledge\n2.1 Awareness on technology and its function\n2.2 Repair and maintenance procedure\n2.3 Operating instructions\n2.4 Applicable software\n2.5 Communication techniques\n2.6 Health and safety procedure\n2.7 Company policy in relation to relevant technology\n2.8 Different management concepts\n2.9 Technology adaptability\n\n3. Underpinning Skills\n3.1 Relevant technology application/implementation\n3.2 Basic communication skills\n3.3 Software applications skills\n3.4 Basic troubleshooting skills\n\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1 Relevant technology\n4.2 Interview and demonstration questionnaires\n4.3 Assessment packages\n\n5. Methods of\nAssessment\nCompetency must be assessed through:\n5.1 Interview\n5.2 Actual demonstration\n5.3 Authenticated portfolio (related certificates of\ntraining/seminar)\n\n6. Context of\nAssessment\n6.1 Competency may be assessed in actual workplace or\nsimulated environment\n\n--- PDF PAGE 23 ---\n__________________________________________________________________________________________\nTR - 3D ANIMATION NC III Promulgated July 27, 2007\n/secjr\n\n21\nCOMMON COMPETENCIES\n\nUNIT TITLE\n:\nAPPLY QUALITY STANDARDS\n\nUNIT CODE\n:\n506315202\n\nUNIT DESCRIPTOR :\nThis unit covers the knowledge, skills, attitudes and values\nneeded to apply quality standards in the workplace. The unit\nalso includes the application of relevant safety procedures\nand regulations, organization procedures and customer\nrequirements.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Assess quality of\nreceived materials\n1.1. Work instruction is obtained and work is carried out in\naccordance with standard operating procedures.\n1.2. Received materials are checked against workplace\nstandards and specifications.\n1.3. Faulty materials related to work are identified and\nisolated.\n1.4. Faults and any identified causes are recorded and/or\nreported to the supervisor concerned in accordance\nwith workplace procedures.\n1.5. Faulty materials are replaced in accordance with\nworkplace procedures.\n2. Assess own work\n2.1. Documentation relative to quality within the company\nis identified and used.\n2.2. Completed work is checked against workplace\nstandards relevant to the task undertaken.\n2.3. Errors are identified and isolated.\n2.4. Information on the quality and other indicators of\nproduction performance are recorded in accordance\nwith workplace procedures.\n2.5. In cases of deviations from specific quality\nstandards, causes are documented and reported in\naccordance with the workplace’ s standards operating\nprocedures.\n3. Engage in quality\nimprovement\n3.1. Process improvement procedures are participated in\nrelative to workplace assignment.\n3.2. Work is carried out in accordance with process\nimprovement procedures.\n3.3. Performance of operation or quality of product of\nservice to ensure customer satisfaction is monitored.\n\n--- PDF PAGE 24 ---\n__________________________________________________________________________________________\nTR - 3D ANIMATION NC III Promulgated July 27, 2007\n/secjr\n\n22\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1 Materials\n1.1 Materials may include but not limited to:\n1.1.1. Manuals\n1.1.2. Job orders\n1.1.3. Instructional videos\n2 Faults\n2.1 Faults may include but not limited to:\n2.1.1. Materials not to specification\n2.1.2. Materials contain incorrect/outdated\ninformation\n2.1.3. Hardware defects\n2.1.4. Materials that do not conform with any\nregulatory agencies\n3 Documentation\n3.1 Organization work procedures\n3.2 Manufacturer’s instruction manual\n3.3 Customer requirements\n3.4 Forms\n4 Errors\n4.1 Errors may be related but not limited to the following:\n4.1.1. Deviation from the requirements of the Client\n4.1.2. Deviation from the requirement of the\norganization\n5 Quality standards\n\n5.1 Quality standards may be related but not limited to\nthe following:\n5.1.1. Materials\n5.1.2. Hardware\n5.1.3. Final product\n5.1.4. Production processes\n5.1.5. Customer service\n6 Customer\n6.1 Co-worker\n6.2 Supplier/Vendor\n6.3 Client\n6.4 Organization receiving the product or service\n\n--- PDF PAGE 25 ---\n__________________________________________________________________________________________\nTR - 3D ANIMATION NC III Promulgated July 27, 2007\n/secjr\n\n23\n\nEVIDENCE GUIDE\n\n1 Critical aspect of\ncompetency\nAssessment must show that the candidate:\n1.1 Carried out work in accordance with the company’s\nstandard operating procedures\n1.2 Performed task according to specifications\n1.3 Reported defects detected in accordance with\nstandard operating procedures\n1.4 Carried out work in accordance with the process\nimprovement procedures\n2 Underpinning\nknowledge\n2.1 Relevant production processes, materials and\nproducts\n2.2 Characteristics of materials, software and hardware\nused in production processes\n2.3 Quality checking procedures\n2.4 Workplace procedures\n2.5 Safety and environmental aspects of production\nprocesses\n2.6 Fault identification and reporting\n2.7 Quality improvement processes\n3 Underpinning skills\n3.1 Reading skills required to interpret work instruction\n3.2 Communication skills needed to interpret and apply\ndefined work procedures\n3.3 Carry out work in accordance with OHS policies and\nprocedures\n3.4 Critical thinking\n3.5 Solution providing and decision-making\n4 Method of\nassessment\nThe assessor must select two of the following to objectively\nevaluate the candidate:\n4.1 Observation and oral questioning\n4.2 Third party report\n4.3 Portfolio\n4.4 Practical demonstration\n5 Resource implication\n5.1\nMaterials, software and hardware to be used in a\nreal or simulated situation\n6 Context of\nAssessment\n6.1\nAssessment may be conducted in the workplace or\nin a simulated environment\n\n--- PDF PAGE 26 ---\n__________________________________________________________________________________________\nTR - 3D ANIMATION NC III Promulgated July 27, 2007\n/secjr\n\n24\nUNIT TITLE\n:\nOPERATE A PERSONAL COMPUTER\nUNIT CODE\n:\nICT 311203\nUNIT DESCRIPTOR\n:\nThis unit defines the competency required to operate a\npersonal computer by: starting the PC, logging in, using\nand working with files, folders and programs, saving work,\nand closing down the PC.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Start the\ncomputer\n\n1.1 The peripheral devices are properly connected\n1.2 Power is checked and the computer and peripheral\ndevices are switched on\n1.3 Proper logging in and logging off is successfully done\n1.4 The operating system features and functions are\naccessed and navigated\n1.5 Hardware configuration and other system features are\nchecked\n2. Arrange and\ncustomize\ndesktop display/\nGUI settings\n\n2.1 The desktop screen or GUI elements are changed as\nneeded\n2.2 Desktop icons are added, renamed, moved, copied or\ndeleted\n2.3 The online help functions are accessed or used as\nneeded\n2.4 Desktop icons of application programs are selected,\nopened and closed\n2.5 Properties of icons are displayed\n2.6 Computer or desktop settings are saved and restored\n3. Work with files\nand folders (or\ndirectories)\n\n3.1 A file or folder is created, opened, moved, renamed or\ncopied\n3.2 Files are located, deleted and restored\n3.3 Details and properties of files and folders are displayed or\nviewed\n3.4 Various files are organized for easy lookup and use\n3.5 Files and information are searched\n3.6 Disks are checked, erased or formatted as necessary\n4. Work with user\napplication\nprograms\n4.1 Application programs are added, changed, removed or\nran\n4.2 User software or application program are installed,\nupdated and upgraded\n4.3 Information/data are moved between documents or files\n5. Print information\n5.1 Printer is added or installed and correct printer settings\nis ensured\n5.2 Default printer is assigned accordingly\n5.3 Information or document is printed on the installed printer\n5.4 Progress of print jobs are viewed and deleted as required\n6. Shut down\ncomputer\n6.1 All open application programs are closed\n6.2 Computer and peripheral devices are properly shut down\n\n--- PDF PAGE 27 ---\n__________________________________________________________________________________________\nTR - 3D ANIMATION NC III Promulgated July 27, 2007\n/secjr\n\n25\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1.\nPeripheral\ndevice\nThis may include but is not limited to:\n1.1 mouse\n1.2 keyboard\n1.3 monitor or visual display unit\n1.4 printer\n1.5 scanner\n\n2.\nComputer\nMay include:\n2.1. Laptops/notebooks\n2.2. Workstations\n2.3. Servers\n2.4. other personal computer devices\n\n3.\nApplication\nprograms\nCan include:\n3.1 user programs\n3.2 database programs\n3.3 word processors\n3.4 email programs\n3.5 Internet browsers\n3.6 system browsers\n3.7 spreadsheets\n\n4.\nOperating\nsystem\nMay include but is not limited to the various versions and\nvariants of operating systems running on personal\ncomputers and servers, such as:\n4.1 Windows\n4.2 NT\n4.3 Mac OS\n4.4 Linux\n4.5 Solaris\n4.6 Unix\n\n5.\nSystem features May include but is not limited to the operating system\nfeatures and hardware features like:\n5.1 memory size\n5.2 disk capacities\n5.3 video cards\n5.4 USBs\n5.5 Modems\n5.6 1394 and LAN connectors\n5.7 SD and PC cards\n5.8 wireless and infrared connections.\n\n6.\nOnline help\nfunctions\n6.1 An instruction manual, or a portion of the manual,\nintegrated and accessible from within the program or\nsoftware being used.\n\n--- PDF PAGE 28 ---\n__________________________________________________________________________________________\nTR - 3D ANIMATION NC III Promulgated July 27, 2007\n/secjr\n\n26\n\nVARIABLE\nRANGE\n7.\nProperties\nIndicates the description of the file or folder to include the:\n7.1 file name\n7.2 type of file\n7.3 file size\n7.4 date created and modified\n7.5 attributes (hidden, read-only).\n\n8.\nVarious files\n8.1 Documents\n8.2 Records\n8.3 Pictures\n8.4 Music\n8.5 Video\n\n9.\nDisks\nMay include but is not limited to:\n9.1 Floppy disks\n9.2 CDs\n9.3 CD-RW (Compact discs-Read/Write)\n9.4 DVD RW\n9.5 zip disks\n9.6 flash drives\n9.7 memory sticks\n9.8 hard drives\n\n10. Printer settings\nThe properties of the printer that enables it to work includes:\n10.1 page layout\n10.2 paper size\n10.3 ink/cartridge type\n10.4 number of copies\n10.5 page orientation.\n\n--- PDF PAGE 29 ---\n__________________________________________________________________________________________\nTR - 3D ANIMATION NC III Promulgated July 27, 2007\n/secjr\n\n27\nEVIDENCE GUIDE\n1.\nCritical aspects\nof Competency\n\nAssessment must confirm the candidate's ability to:\n1.1 utilize software\n1.2 navigate the desktop\n1.3 use system features to perform tasks\n1.4 save results of work.\n2.\nUnderpinning\nKnowledge\nKnowledge includes:\n2.1 Keyboard layout and functions\n2.2 Computer functions\n2.3 Basic parts of a computer and various hardware\ncomponents\n2.4 Storage devices and file concepts\n2.5 Basic software operation and functionalities\n3.\nUnderpinning\nSkills\nSkills include:\n3.1 Saving and retrieving files to and from various folders\nor disk storage\n3.2 Mouse and keyboarding skills for running software\napplications\n3.3 Reading and writing at a level where basic workplace\ndocuments are understood\n3.4 Clear ability to communicate with peers and\nsupervisors\n3.5 Interpretation of user manuals and help functions\n3.6 The ability to carry out written and verbal instructions\nusing a personal computer whether standalone or in\na networked environment\n4.\nResource\nImplications\nTo demonstrate competence in this unit access to the\nfollowing resources will be required:\n4.1 A personal computer\n4.2 A printer\n4.3 Mouse and keyboard\n4.4 Basic systems software\n5.\nMethods of\nAssessment\nCompetency may be assessed through:\n5.1 Observation in a workplace or simulated environment\n5.2 Third party reports\n5.3 Exams and tests\n5.4 Demonstration of required skills\n5.5 Interviews\n6.\nContext for\nAssessment\n6.1 Competency may be assessed in the workplace or in\na simulated work environment.\n\n--- PDF PAGE 30 ---\n__________________________________________________________________________________________\nTR - 3D ANIMATION NC III Promulgated July 27, 2007\n/secjr\n\n28\nCORE COMPETENCIES\n\nUNIT TITLE\n:\nPRODUCE KEY DRAWINGS FOR ANIMATION\nUNIT CODE\n: ICT 313316\nUNIT DESRIPTOR :\nThis unit covers the knowledge, skills and attitude required to\ninterpret the animation specifications to produce key\ndrawings for animation productions.\n\nELEMENT\n PERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Identify animation\nrequirements\n\n1.1 All relevant animation requirements from the\nstoryboard, layouts and director’s\ninstructions or camera sheet are identified.\n1.2 Animation requirements from the timings\nand soundtrack breakdown are identified.\n1.3 All necessary materials and equipment to\nbe used are identified and prepared\naccording to the task to be undertaken.\n2. Produce key drawings\n\n2.1 Key drawings produced are complete with\nrelevant details from material and styles.\n2.2 Drawings produced complied with\nsoundtrack breakdown.\n2.3 Quantity of key drawings produced is\nsufficient to establish the action and ensure\nthat they are within the standard set for the\nagreed design/model.\n2.4 Key drawings produced are within the\nconstraints and types of production.\n2.5 Line test is undertaken to ensure smooth\nflow of movement\n3. Edit/revise and\ncomplete key drawings\n3.1 Corrections to key drawings, animated\nelements and images are made after\nreview by relevant personnel.\n3.2 Key drawings with animation breakdowns\nare clearly labeled.\n3.3 Key drawings are clearly identified, safely\nand securely stored in accordance with\ncompany procedures.\n\n--- PDF PAGE 31 ---\n__________________________________________________________________________________________\nTR - 3D ANIMATION NC III Promulgated July 27, 2007\n/secjr\n\n29\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Equipment\n1.1\nanimation table/light box\n1.2\nanimation disc\n1.3\nphotocopying machine\n2. Key drawings\n2.1\n produced in a variety of graphic styles\n2.2\ninvolve a broad range of graphic styles and\ntechniques\n3. Material\n3.1\nstoryboard\n3.2\nlayout drawings\n3.3\ndirector’s instruction camera sheet\n3.4\nsoundtrack breakdown\n3.5\nmodel sheets\n4. Animated styles\n4.1\ndrawings\n4.2\ndigital imaging\n4.3\nbroad range of graphic styles and\ntechniques\n5. Animated elements\n\n5.1\ncharacter\n5.2\nbackground\n5.3\nprops\n5.4\nlength of animation\n5.5\ncamera movements\n5.6\ntechnical/digital\n6. Animated images\n6.1\nregistered hand drawn images\n6.2\ncomputer-generated forms and actions\n7. Appropriate personnel\n7.1\nProduction manager\n7.2\nAnimation director\n7.3\nTechnical director\n8. Animation breakdown\n8.1\nthe number of in-betweens required\n8.2\npath of action and pace\n\n--- PDF PAGE 32 ---\n__________________________________________________________________________________________\nTR - 3D ANIMATION NC III Promulgated July 27, 2007\n/secjr\n\n30\nEVIDENCE GUIDE\n\n1. Critical Aspect of\nCompetency\nAssessment must show that the candidate:\n\n1.1. Creatively interpreted animation specifications to\nmeet requirements.\n\n1.2. Calculated intermediate positions of figure along\na path that marks important visual\ntransitions/extremes of action.\n2. Underpinning\nKnowledge\n\n2.1 Visualization and interpretation of creative\nconcepts\n2.2 Interpreting scripts, specifications and\ninstructions\n2.3 Principles and techniques of animation\nproduction\n2.4 Principles and techniques of animation\n2.5 Current animation methods and techniques\n2.6 Life drawing and translation to animated\ncharacters\n2.7 Color theory, line, dimension, depth and their\napplication on the screen\n2.8 Character drawing\n2.9 Cartoon drawing\n2.10 Appropriate software application\n3. Underpinning Skills\n3.1 Drawing skills\n3.2 Communication skills\n3.3 Presentation skills\n4. Method of Assessment\n4.1 The assessor must select two of the following to\nobjectively assess the candidate:\n4.1.1 Direct Observation and oral questioning\n4.1.2 Third party report\n4.1.3 Portfolio\n5. Resource Implication\n5.1 Appropriate supplies and materials\n5.2 Applicable equipment\n6. Context of\nAssessment\n6.1 Assessment maybe conducted in the workplace\nor in a simulated environment\n\n--- PDF PAGE 33 ---\n__________________________________________________________________________________________\nTR - 3D ANIMATION NC III Promulgated July 27, 2007\n/secjr\n\n31\nUNIT TITLE\n:\nCREATE 3D DIGITAL ANIMATION\nUNIT CODE\n: ICT 313320\nUNIT DESRIPTOR :\nThis unit covers the knowledge, skills and attitude required to\ncreate 3D digital animation.\n\nELEMENT\n PERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Identify requirements\nfor 3D animation\n\n1.1 Design brief and storyboard are obtained and\ncreative requirements are discussed with relevant\npersonnel.\n1.2 All 3D animation requirements including technical\nand production specifications are identified and\ndiscussed with relevant personnel.\n1.3 Soundtrack requirements are identified and\ndiscussed with relevant personnel\n\n2. Identify and select 3D\nanimation software\n\n2.1 Range of industry standard 3D animation\nsoftware including computer-assisted techniques\nare identified for suitability\n2.2 Capability and compatibility of the computer\nhardware and software is assessed vis-à-vis\ncreative, production, technical requirements\nand specifications.\n2.3 Appropriate 3D animation software to be used is\nselected in consultation with the appropriate\npersonnel to ensure that output met requirements.\n2.4 Software selected is in accordance with the\nspecified delivery platform.\n3. Create models and\nimages\n3.1 Appropriate tools and features of the selected\nprogram is identified and applied to meet creative\nand technical requirements.\n3.2 Model and set-up environment layout for 3D\nproduction are created as appropriate to the\nrequired 3D model.\n3.3 Model different kinds of 3D characters for\nproduction.\n3.4 Pre-defined textures are applied using texture\nmapping parameters as required.\n3.5 Camera control options and appropriate rendering\nparameters are defined and applied to achieve the\nrequired creative outcome.\n3.6 Object motion hierarchies are used to achieve the\nrequired motion effect.\n3.7 Back-ups of models and images are prepared\nlabeled and stored in accordance with company\nprocedures and industry standards of\ndocumentation.\n\n--- PDF PAGE 34 ---\n__________________________________________________________________________________________\nTR - 3D ANIMATION NC III Promulgated July 27, 2007\n/secjr\n\n32\n\nELEMENT\n PERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n4. Test and evaluate\n3D models\n4.1 3D model motion is tested and combined with\nother media to create required digital animation\nsequence.\n4.2 Cross platform file transfers, digitized time coding\nand interface calibration is ensured to meet the\nrequirements of technical and creative\nspecifications.\n4.3 3D models and relevant digital animation\nsequence is presented to relevant personnel for\nreview, comments and recommendations.\n4.4 Identified changes, if any are discussed with the\nrelevant personnel and agreements are\nincorporated to the prepared models.\n4.5 Final agreement and approval is obtained from\nrelevant personnel for the finished models.\n5. Produce 3D\nanimation\n5.1 Construct rigid and non-rigid objects as required\nby the design brief and storyboard.\n5.2 Combine objects into a single animated steam\naccording to creative requirements and technical\nspecifications.\n5.3 Create simple and complex animated movements\ninto static or moving backgrounds according to\ncreative and technical requirements.\n5.4 Integrate animated objects or characters into\nstatic or moving backgrounds, using animation\ntechniques available within software as required,\nand as appropriate according to the software.\n5.5 Apply time stamping techniques to animation\nframes.\n5.6 Apply textures, lighting and rendering as required\nin production.\n5.7 Incorporate sound where necessary, referring to\nsoundtrack breakdown.\n5.8 3D animation is saved and stored using\nappropriate and adequate file formats.\n6. Evaluate 3D\nanimation\n6.1 3D animation sequences are presented to\nrelevant personnel for detailed responses and\nrecommendations.\n6.2 Design changes are discussed, identified and\nincorporated to complete the 3D animation and\nmeet the recommendations.\n6.3 Final agreement of finished 3D animation\nsequences is obtained from relevant personnel.\n\n--- PDF PAGE 35 ---\n__________________________________________________________________________________________\nTR - 3D ANIMATION NC III Promulgated July 27, 2007\n/secjr\n\n33\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Appropriate personnel\n1.1. Director\n1.2. Producer\n1.3. Project manager\n1.4. Technical Director\n1.5. Navigation designers\n1.6. Video producer\n1.7. Editing personnel\n1.8. 3D graphic, animation and modeling\nproduction personnel\n2. Production\nspecifications\nMay include:\n2.1. Timeline\n2.2. Budget\n2.3. Deadline\n\n2.4. Hardware\n2.5. Software\n2.6. Delivery platform\n2.7. Media form\n3. 3D animation software\nMay include:\n3.1. Maya\n3.2. 3Dmax\n3.3. Studio max\n3.4. Maxxon\n3.5. Blender\n\n3.6. Softimage\n3.7. Electric image\n3.8. Autocad\n3.9. Lightwave\n3.10. Animation master\n4. Creative, production,\ntechnical requirements\nand specifications.\n\nRelevant specifications may be found in:\n4.1. Storyboard\n4.2. Layout drawings\n4.3. Model Sheets\n4.4. Director’s instructions\n4.5. Camera sheet\n4.6. Soundtrack breakdown\n5. Delivery platform\nDelivery platform may include:\n5.1. World wide web\n5.2. CD-ROM\n5.3. DVD\n5.4. Film\n5.5. Broadcast format\n6. Texture mapping\nparameters\n6.1. Lighting\n6.2. Shadows\n7. Documentation\nDocumentation may be:\n7.1. Computer-generated\n7.2. Manually written\n7.3. Marked up transcripts\n7.4. Marked up scripts\n7.5. Production schedules\n\n--- PDF PAGE 36 ---\n__________________________________________________________________________________________\nTR - 3D ANIMATION NC III Promulgated July 27, 2007\n/secjr\n\n34\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment must show that the candidate:\n1.1 Applied various range of 3D model and image\nproduction methods and equipment\n1.2 Selected suitable software in relation to the\nspecified delivery platform\n1.3 Created 3D digital animation using appropriate\ntools and features of the selected software to meet\nrequirements\n2. Underpinning\nKnowledge\n2.1 Computer and computer operating system\n2.2\nInterpreting creative information, scripts and\nimages\n2.3 Principles of 3D modeling sequencing\n2.4 Application of different 3D modeling and digital\nimaging methods and formats\n2.5\nTechniques/Methods of 3D animation\n2.6\nLife drawing and translation to animated\ncharacters\n2.7 Creative elements of a production\n2.8\nMaintaining design integrity\n2.9 Color theory, line, dimension, depth and their\napplication on the screen\n2.10 Basic editing principles, e.g., composition, framing,\npacing, timing\n2.11 Copyright laws, regulations\n3. Underpinning Skills\n3.1 Design and Drawing skills\n3.2 Effective Communication skills\n3.3 Presentation skills\n3.4 Computer operation\n1. Method of\nAssessment\n1.1 The assessor must select two of the following to\nobjectively assess the candidate:\n1.1.1 Direct Observation and oral questioning\n1.1.2 Third party report\n1.1.3 Portfolio\n2. Resource\nImplication\n2.1 Appropriate materials\n2.2 Applicable software and equipment\n3. Context of\nAssessment\n3.1 Assessment maybe conducted in the workplace\nor in a simulated environment\n\n--- PDF PAGE 37 ---\n__________________________________________________________________________________________\nTR - 3D ANIMATION NC III Promulgated July 27, 2007\n/secjr\n\n35\nUNIT TITLE\n:\nUSE AN AUTHORING TOOL TO CREATE AN\nINTERACTIVE SEQUENCE\nUNIT CODE\n: ICT 313323\nUNIT DESRIPTOR :\nThis unit covers the knowledge, skills and attitude required to\nuse an authoring tool to create a discrete interactive\nsequence for a multimedia production.\n\nELEMENT\n PERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Plan use of authoring\ntool\n1.1 Range of authoring tools and their application to\nvarious multimedia projects are identified and\ndiscussed with relevant personnel.\n1.2 Purpose, scope, storyboard and design of\nmultimedia projects are discussed with relevant\npersonnel.\n1.3 The technical requirements of the multimedia\nproject and use of authoring program are discussed\nwith relevant personnel.\n2. Use authoring tool\n2.1 Use tools and features of software relevant to the\nauthoring process\n2.2 Create a new file for the specified task and name\nappropriately\n2.3 Multimedia components are imported into the\nauthoring tool.\n2.4 Design principles are applied to the screen design\nand layout.\n2.5 Screen and layout are designed according to\ncreative production requirements and technical\nspecifications.\n2.6 Buttons and other interactive elements are created.\n2.7 All components are linked according to storyboard.\n2.8 Data files, images, and audio are saved and stored\nin appropriate file format.\n3. Check functionality of\nmultimedia sequence\n3.1 All links function is checked and debugging is done\nto make sure that these are fully interactive and\npresented to relevant personnel.\n3.2 Required changes in the sequence are incorporated\nin the final delivery platform.\n\n--- PDF PAGE 38 ---\n__________________________________________________________________________________________\nTR - 3D ANIMATION NC III Promulgated July 27, 2007\n/secjr\n\n36\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Multimedia projects\n1.1 Interactive CD\n1.2 Corporate Audio-Visual Presentations (AVPs)\n1.3 Instructional materials in CD\n1.4 Online Gaming\n1.5 Computer Simulation\n1.6 Webpage Design & Development\n1.7 E-learning\n2. Relevant personnel\n2.1 Creative Director\n2.2 Project manager\n2.3 Technical Director\n2.4 Navigation designers\n2.5 Programmers\n2.6 Visual Designer\n2.7 Flash animator\n3. Software\nMay include:\n3.1 Macromedia Director/Flash\n3.2 Movie Works\n3.3 Web Authoring Software\n3.4 E-learning Software\n3.5 Slide Show Software\n4. Creative, production\nrequirements and\ntechnical specifications\nRelevant specifications may be found in:\n4.1 Storyboard\n4.2 Layout drawings\n4.3 Model Sheets\n4.4 Director’s instructions\n4.5 Camera sheet\n4.6 Soundtrack breakdown\n5. Delivery platform\nDelivery platform may include:\n5.1 World wide web\n5.2 CD-ROM\n5.3 DVD\n\n--- PDF PAGE 39 ---\n__________________________________________________________________________________________\nTR - 3D ANIMATION NC III Promulgated July 27, 2007\n/secjr\n\n37\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment must show that the candidate:\n1.1 Selected suitable software in relation to the\nspecified multimedia project\n1.2 Created a multimedia sequence using\nappropriate tools and features of the\nselected software to meet requirements\n2. Underpinning Knowledge\n2.1\nComputer and computer operating system\n2.2\nInterpreting creative information, scripts and\nimages\n2.3\nScope and elements of multimedia\n2.4\nDigital components of multimedia, their\ndistinguishing features and functions\n2.5\nBasic techniques/methods of graphics\ndesign\n2.6\nLife drawing and translation to animated\ncharacters\n2.7\nCreative elements of a production\n2.8\nMaintaining design integrity\n2.9\nColor theory, line, dimension, depth and\ntheir application on the screen\n2.10 Basic editing principles, e.g., composition,\nframing, pacing, timing\n2.11 Copyright laws, regulations\n3. Underpinning Skills\n3.1 Design and Drawing skills\n3.2 Use of appropriate authoring software\n3.3 Effective Communication skills\n3.4 Presentation skills\n3.5 Computer operation\n4. Method of Assessment\n4.1 The assessor must select two of the\nfollowing to objectively assess the\ncandidate:\n4.1.1 Direct Observation and oral\nquestioning\n4.1.2 Third party report\n4.1.3 Portfolio\n5. Resource Implication\n5.1 Appropriate materials\n5.2 Applicable software and equipment\n6. Context of Assessment\n6.1 Assessment maybe conducted in the\nworkplace or in a simulated environment\n\n--- PDF PAGE 40 ---\n__________________________________________________________________________________________\nTR - 3D ANIMATION NC III Promulgated July 27, 2007\n/secjr\n\n38"
