  "source_text": "Section 1. Successful candidates shall be awarded a National Certificate\nsigned by the Director General.\n\n4.1.2 Assessment shall focus on the core units of competency. The basic and common units\nshall be integrated or assessed concurrently with the core units.\n\n4.1.3 The following are qualified to apply for assessment and certification:\n\n- Graduates of training programs related to waste management\n- Experienced workers in sanitary landfill facilities and operations\n\n4.1.4 Reassessment is allowed only after one month from the date of assessment.\nReassessment for a National Certificate shall be done only on the task/s that the\ncandidate did not successfully achieve.\n\n4.1.5 A candidate who fails the assessment for two (2) consecutive times will be required to\ngo through a refresher course before taking another assessment.\n\n4.1.6 Only certified individuals in this Qualification may be nominated by the industry sector\nfor accreditation as competency assessor.\n\n4.2 COMPETENCY ASSESSMENT REQUISITE\n4.2.1\nSelf-Assessment Guide. The self-assessment guide (SAG) is accomplished by the\ncandidate prior to actual competency assessment. SAG is a pre-assessment tool\nto help the candidate and the assessor determine what evidence is available,\nwhere gaps exist, including readiness for assessment.\n\n This document can:\na. Identify the candidate’s skills and knowledge\nb. Highlight gaps in candidate’s skills and knowledge\n\n--- PDF PAGE 76 ---\nSANITARY LANDFILL OPERATIONS NC III (Amended) Promulgated June 16, -70-\nc. Provide critical guidance to the assessor and candidate on the evidence that\nneed to be presented\nd. Assist the candidate to identify key areas in which practice is needed or\nadditional information or skills that should be gained prior\n\n4.2.2\nAccredited Assessment Center. Only Assessment Center accredited by TESDA is\nauthorized to conduct competency assessment. Assessment centers undergo a\nquality assured procedure for accreditation before they are authorized by TESDA\nto manage the assessment for National Certification.\n4.2.3\nAccredited Competency Assessor. Only accredited competency assessor is\nauthorized to conduct assessment of competence. Competency assessors\nundergo a quality assured system of accreditation procedure before they are\nauthorized by TESDA to assess the competencies of candidates for National\nCertification.\n\n--- PDF PAGE 77 ---\nSANITARY LANDFILL OPERATIONS NC III (Amended) Promulgated June 16, -71-\n\nANNEX A - COMPETENCY MAP\nSANITARY LANDFILL OPERATIONS NC III\n\nBASIC COMPETENCIES\n\nReceive and respond to\nworkplace\ncommunication\nWork with Others\nDemonstrate work\nvalues\nPractice basic\nhousekeeping\nprocedures\nParticipate in workplace\ncommunication\nWork in a team\nenvironment\nPractice career\nprofessionalism\nPractice occupational\nhealth and safety\nprocedures\nLead workplace\ncommunication\nLead small team\nDevelop and practice\nnegotiation skills\nSolve problems related\nto work activities\nUse mathematical\nconcepts and\ntechniques\nUse relevant\ntechnologies\nUtilize specialist\ncommunication skills\nDevelop team and\nIndividuals\nApply problem solving\ntechniques in the\nworkplace\nCollect, analyze and\norganize information\nPlan and organize Work\nPromote environmental\nprotection\n\nCOMMON COMPETENCIES\n\nMaintain an effective\nrelationship with clients\nand customers\nManage own\nperformance\nDevelop and update\nindustry knowledge\nPerform workplace\nsecurity and safety\npractices\nMaintain environmental\nhealth and awareness in\nthe work place\n\nCORE COMPETENCIES\n\nSupervise in-coming\nwaste in the active cell\nSupervise and\nmaintain closed SLF\n\n--- PDF PAGE 78 ---\nSANITARY LANDFILL OPERATIONS NC III (Amended) Promulgated June 16, -72-\nDEFINITION OF COMMON TERMS\n\n1. Agricultural waste shall refer to waste generated from planting or harvesting of crops,\ntrimming or pruning of plants and wastes or run-off materials from farms or fields;\n2.\nBulky wastes shall refer to waste materials which cannot be appropriately placed in separate\ncontainers because of either its bulky size, shape or other physical attributes. These include\nlarge worn-out or broken household, commercial, and industrial items such as furniture,\nlamps, bookcases, filing cabinets, and other similar items;\n3.\nBuy-back center shall refer to a recycling center that purchases or otherwise accepts\nrecyclable materials from the public for the purpose of recycling such materials;\n4.\nCollection shall refer to the act of removing solid waste from the source or from a communal\nstorage point;\n5.\nComposting shall refer to the controlled decomposition of organic matter by micro-\norganisms, mainly bacteria and fungi, into a humus-like product;\n6.\nConsumer electronics shall refer to special waste that includes worn-out, broken, and other\ndiscarded items such as radios, stereos, and TV sets;\n7.\nControlled dump shall refer to a disposal site at which solid waste is deposited in\naccordance with the minimum prescribed standards of site operation;\n8.\nDepartment shall refer to the Department of Environment and Natural Resources;\n9.\nDisposal shall refer to the discharge, deposit, dumping, spilling, leaking or placing of any\nsolid waste into or in a land;\n10. Disposal site shall refer to a site where solid waste is finally discharged and deposited;\n11. Ecological solid waste management shall refer to the systematic administration of activities\nwhich provide for segregation at source, segregated transportation, storage, transfer,\nprocessing, treatment, and disposal of solid waste and all other waste management activities\nwhich do not harm the environment;\n12. Environmentally acceptable shall refer to the quality of being re-usable, biodegradable or\ncompostable, recyclable and not toxic or hazardous to the environment;\n13. Generation shall refer to the act or process of producing solid waste;\n14. Generator shall refer to a person, natural or juridical, who last uses a material and makes it\navailable for disposal or recycling;\n15. Hazardous waste shall refer to solid waste management or combination of solid waste which\nbecause of its quantity, concentration or physical, chemical or infectious characteristics may:\n(1) cause, or significantly contribute to an increase in mortality or an increase in serious\nirreversible, or incapacitating reversible, illness; or\n(2) pose a substantial present or potential hazard to human health or the environment when\nimproperly treated, stored, transported, or disposed of, or otherwise managed;\n16. Leachate shall refer to the liquid produced when waste undergo decomposition, and when\nwater percolate through solid waste undergoing decomposition. It is contaminated liquid that\ncontains dissolved and suspended materials;\n17. Materials recovery facility - includes a solid waste transfer station or sorting station, drop-off\ncenter, a composting facility, and a recycling facility;\n18. Municipal waste shall refer to wastes produced from activities within local government units\nwhich include a combination of domestic, commercial, institutional and industrial wastes and\nstreet litters;\n19. Open dump shall refer to a disposal area wherein the solid wastes are indiscriminately\nthrown or disposed of without due planning and consideration for environmental and Health\nstandards;\n\n--- PDF PAGE 79 ---\nSANITARY LANDFILL OPERATIONS NC III (Amended) Promulgated June 16, -73-\n20. Opportunity to recycle shall refer to the act of providing a place for collecting source-\nseparated recyclable material, located either at a disposal site or at another location more\nconvenient to the population being served, and collection at least once a month of source-\nseparated recyclable material from collection service customers and to providing a public\neducation and promotion program that gives notice to each person of the opportunity to\nrecycle and encourage source separation of recyclable material;\n21. Person(s) shall refer to any being, natural or judicial, susceptible of rights and obligations, or\nof being the subject of legal relations;\n22. Post-consumer material shall refer only to those materials or products generated by a\nbusiness or consumer which have served their intended end use, and which have been\nseparated or diverted from solid waste for the purpose of being collected, processed and\nused as a raw material in the manufacturing of recycled product, excluding materials and by-\nproducts generated from, and by-products generated from, and commonly used within an\noriginal manufacturing process, such as mill scrap;\n23. Receptacles shall refer to individual containers used for the source separation and the\ncollection of recyclable materials;\n24. Recovered material shall refer to material and by products that have been recovered or\ndiverted from solid waste for the purpose of being collected, processed and used as a raw\nmaterial in the manufacture of a recycled product;\n25. Recyclable material shall refer to any waste material retrieved from the waste stream and\nfree from contamination that can still be converted into suitable beneficial use or for other\npurposes, including, but not limited to, newspaper, ferrous scrap metal, non-ferrous scrap\nmetal, used oil, corrugated cardboard, aluminum, glass, office paper, tin cans and other\nmaterials as may be determined by the Commission;\n26. Recycled material shall refer to post-consumer material that has been recycled and returned\nto the economy;\n27. Recycling shall refer to the treating of used or waste materials through a process of making\nthem suitable for beneficial use and for other purposes, and includes any process by which\nsolid waste materials are transformed into new products in such a manner that the original\nproduct may lose their identity, and which may be used as raw materials for the production of\nother goods or services: Provided, That the collection, segregation and re-use of previously\nused packaging material shall be deemed recycling under this Act;\n28. Resource conversation shall refer to the reduction of the amount of solid waste that are\ngenerated or the reduction of overall resource consumption, and utilization of recovered\nresources;\n29. Resources recovery shall refer to the collection, extraction or recovery of recyclable\nmaterials from the waste stream for the purpose of recycling, generating energy or producing\na product suitable for beneficial use: Provided, that such resource recovery facilities exclude\nincineration;\n30. Re-use shall refer to the process of recovering materials intended for the same or different\npurpose without the alteration of physical and chemical characteristics;\n31. Sanitary landfill shall refer to a waste disposal site designed, constructed, operated and\nmaintained in a manner that exerts engineering control over significant potential environment\nimpacts arising from the development and operation of the facility;\n32. Schedule of Compliance shall refer to an enforceable sequence of actions or operations to\nbe accomplished within a stipulated time frame leading to compliance with a limitation,\nprohibition or standard set forth in this Act or any rule of regulation issued pursuant thereto;\n33. Secretary landfill shall refer to the Secretary of the Department of Environment and Natural\nResources;\n34. Segregation shall refer to a solid waste management practice of separating different\nmaterials found in solid waste in order to promote recycling and re-use of resources and to\nreduce the volume of waste for collection and disposal;\n\n--- PDF PAGE 80 ---\nSANITARY LANDFILL OPERATIONS NC III (Amended) Promulgated June 16, -74-\n35. Segregation at source shall refer to a solid waste management practice of separating, at the\npoint of origin, different materials found in solid waste in order to promote recycling and re-\nuse of resources and to reduce the volume of waste for collection and disposal;\n36. Solid waste shall refer to all discarded household, commercial waste, non-hazardous\ninstitutional and industrial waste, street sweepings, construction debris, agricultural waste,\nand other non-hazardous/non-toxic solid waste.\nUnless specifically noted otherwise, the term “solid waste” as used in this Act shall not include:\n(1) Waste identified or listed as hazardous waste of a solid, liquid, contained gaseous or semisolid\nform which may cause or contribute to an increase in mortality or in serious or incapacitating\nreversible illness, or acute/chronic effect on the health of persons and other organisms;\n(2) Infectious waste from hospitals such as equipment, instruments, utensils, and fomites of a\ndisposable nature from patients who are suspected to have or have been diagnosed as\nhaving communicable diseases and must therefore be isolated as required by public health\nagencies, laboratory wastes such as pathological specimens (i.e. all tissues, specimens of\nblood elements, excreta, and secretions obtained from patients or laboratory animals) and\ndisposable fomites that may harbor or transmit pathogenic organisms, and surgical operating\nroom pathologic materials from outpatient areas and emergency rooms; and\n(3) Waste resulting from mining activities, including contaminated soil and debris.\n37. Solid waste management shall refer to the discipline associated with the control of\ngeneration, storage, collection, transfer and transport, processing, and disposal of solid\nwastes in a manner that is in accord with the best principles of public health, economics,\nengineering, conservation, aesthetics, and other environmental considerations, and that is\nalso responsive to public attitudes;\n38. Solid waste management facility shall refer to any resource recovery system or component\nthereof; any system, program, or facility for resource conservation; any facility for the\ncollection, source separation, storage, transportation, transfer, processing, treatment, or\ndisposal of solid waste;\n39. Source reduction shall refer to the reduction of solid waste before it enters the solid waste\nstream by methods such as product design, materials substitution, materials re-use and\npackaging restrictions;\n40. Source separation shall refer to the sorting of solid waste into some or all of its component\nparts at the point of generation;\n41. Special wastes shall refer to household hazardous wastes such as paints, thinners,\nhousehold batteries, lead-acid batteries, spray canisters and the like. These include wastes\nfrom residential and commercial sources that comprise of bulky wastes, consumer\nelectronics, white goods, yard wastes that are collected separately, batteries, oil, and tires.\nThese wastes are usually handled separately from other residential and commercial wastes;\n42. Storage shall refer to the interim containment of solid wastes after generation and prior to\ncollection for ultimate recovery or disposal;\n43. Transfer stations shall refer to those facilities utilized to receive solid wastes, temporarily\nstore, separate, convert, or otherwise process the materials in the solid wastes, or to transfer\nthe solid wastes directly from smaller to larger vehicles for transport. This term does not\ninclude any of the following:\n(1) a facility whose principal function is to receive, store, separate, convert or otherwise process in\naccordance with national minimum standards, manure;\n(2) a facility, whose principal function is to receive, store, convert, or otherwise process wastes\nwhich have already been separated for re-use and are intended for disposals, and\n(3) the operations premises of a duly licensed solid waste handling operator who receives, stores,\ntransfers, or otherwise processes wastes as an activity incidental to the conduct of a refuse\ncollection and disposal business.\n44. Waste diversion shall refer to activities which reduce or eliminate the amount of solid waste\nfrom waste disposal facilities;\n\n--- PDF PAGE 81 ---\nSANITARY LANDFILL OPERATIONS NC III (Amended) Promulgated June 16, -75-\n45. White goods shall refer to large worn-out or broken household, commercial, and industrial\nappliances such as stoves, refrigerators, dishwashers, and clothes washers and dryers\ncollected separately. White goods are usually dismantled for the recovery of specific\nmaterials (e.g., copper, aluminum, etc.);\n46. Yard waste shall refer to wood, small or chipped branches, leaves, grass clippings, garden\ndebris, vegetable residue that is recognized as part of a plant or vegetable and other\nmaterials identified by the Commission.\n\n--- PDF PAGE 82 ---\nSANITARY LANDFILL OPERATIONS NC III (Amended) Promulgated June 16, -76-\nACKNOWLEDGEMENT\n\nThe Technical Education and Skills Development Authority (TESDA) wishes to extend thanks\nand appreciation to the many representatives of business, industry, academe and government\nagencies who rendered their time and expertise to the development and validation of these\nTraining Regulations.\nINITIATOR:\n\nTECHNICAL EXPERTS:\nOTHER EXPERTS:\n\nENGR. ELIGIO ILDEFONSO\nTechnical Experts\nRegulatory Requirements\nMS. JULIET MANLAPAZ\nTechnical Experts\nRegulatory requirements\nMR. RUPERTO AJON\nTechnical Experts\nTraining Regulations\nMS. RAQUEL REYES\nTechnical Experts\nRegulatory Requirements\nMR. CESAR V. TUAZON\nTechnical Experts\nTraining Regulations\n\n MS. LIZETTE C. CARDENAS\n Solid Waste Management Association of the Philippines\n7- A South J. Brgy. Sacred Heart, Quezon City\n\nENGR. ABRAHAM Q. GENUINO\nTechnical Experts\nSLF CONSTRUCTION & OPERATIONS\nMR. CELSO JUCUTAN\nTechnical Experts\nSLF OPERATIONS\nMR. JUNE LACABA\nTechnical Experts\nSLF SUPERVISION\nENGR. MARVIN MARQUEZ\nTechnical Experts\nSLF OPERATIONS\nENGR. ZALDY NEBRES\nTechnical Experts\nSLF OPERATIONS\nENGR. LOUIE SABATER\nTechnical Experts\nSLF OPERATIONS\nENGR. CALEB TAPNIO\nTechnical Experts\nSLF OPERATIONS\nIPM Construction and Dev’t Corporation\nRm 804 Ortigas Bldg., Ortigas, Pasig City\nENGR. REMBERTO G. TOLEDANO\nTechnical Experts\nSLF OPERATIONS\nBEST Incorporated\nMorong, Rizal\nMS. JOANNA M. PASCUAL\nTechnical Experts\nHAZCHEM\nBrgy. Makiling, Calamba City\nMR. ELMER F. PAGKALIWANGAN\nTechnical Experts\n SLF Operations\nPhilippine Ecology Systems Corp.\n136 Malakas St., Quezon City\nMR. RONEL PASCUAL\n SLF Operations\nPhilippine Ecology Systems Corp.\n136 Malakas St., Quezon City\n\n--- PDF PAGE 83 ---\nSANITARY LANDFILL OPERATIONS NC III (Amended) Promulgated June 16, -77-\n\nMEMBERS OF THE TESDA BOARD\n\nTESDA EXCOM\n\nThe MANAGEMENT and STAFF of the TESDA Secretariat\n\n• QSO\n• TESDA Regional Offices\n\n--- PDF PAGE 84 ---\nList of Published Training Regulations\n\n Animal Production NC II\n Aquaculture NC II\n Automotive Body Painting/Finishing NC II\n Automotive Body Repair NC II\n Automotive Engine Rebuilding NC II\n Automotive Servicing NC II\n Bartending NC II\n Building Wiring Installation NC II\n Carpentry NC II\n Commercial Cooking NC II\n Computer Hardware Servicing NC II\n Deck Seafaring NC II\n Dressmaking NC II\n Driving NC II\n Engine Seafaring NC II\n Food and Beverage Services NC II\n Footwear Making NC II\n Heavy Equipment Operation NC II\n Horticulture NC II\n Household Services NC II\n Housekeeping NC II\n Machining NC II\n Masonry NC II\n Motorcycle and Small Engine Servicing NC II\n Plumbing NC II\n Pyrotechnics NC II\n RAC Servicing NC I\n RAC Servicing NC II\n Security Services NC II\n Tailoring NC II\n Tour Guiding Services NC II\n Transport RAC Servicing NC II\n Travel Services NC II\n Welding NC II\n\nThese materials are available in both printed and electronic copies.\nFor more information please contact:\n\nTechnical Education and Skills Development Authority (TESDA)\nTelephone Nos.: 893-8303, 893-2139; 817-4076 to 82 loc. 615 to 617\nor visit our website: www.tesda.gov.ph"
