        "source_text": "UTL9611201\nUNIT DESCRIPTOR\n:\nThis unit covers skills and attitude required to apply best practices\nused in the industry and share knowledge gained through\nexperience with others in the industry.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1. Seek\ninformation on\nthe industry\n1.1 Sources\nof\ninformation on the\nindustry are correctly\nidentified\nand\naccessed.\n1.2 Information\nto\nassist\neffective\nwork performance\nis obtained in line\nwith\njob\nrequirements.\n1.3 Specific information\non sector of work is\naccessed\nand\nupdated.\n1.4 Industry information\nis correctly applied\nto day-to-day work\nactivities.\n1.1 Sources of\n information for\n industry updates\n1.2 Information to\n assist effective\n work\n performance\n1.3 Verbal and\n written\n communication\n1.4 Interaction with\n clients\n1.5 Occupational\n safety and\n health standards\n1.6 RA 9003\n1.7 RA 6969\n1.8 Local\n ordinances\n1.9 Company policy\n1.10 Safety- and –\n health\n consciousness\n1.11 Resourceful-\n ness\n1.12 Diligence\n1.13 Time-\n consciousness\n1.14 Cost –\n consciousness\n1.15 Personal\n integrity in\n doing routine\n management\n practices\n1.16 Perseverance\n1.1 Knowing the\n sources of\n information on\n the industry\n1.2 Assessing and\n updating industry\n information to\n effect improved\n work\n performance\n1.3 Applying industry\n information to\n day-to-day work\n activities\n1.4 Practicing\n communication\n skills\n\n--- PDF PAGE 29 ---\nTESDA-SOP-QSO-01-F08\n\nSANITARY LANDFILL OPERATIONS NC III (Amended) Promulgated June 16, 2015 -25-\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1.17 Ability to work\n with others\n harmoniously\n2. Update\nindustry\nknowledge\n2.1 Informal and/or\nformal research is\nused to update\ngeneral knowledge of\nthe industry.\n\n 2.2 Updated knowledge\nis shared with\ncustomers and\ncolleagues as\nappropriate and\nincorporated into day-\nto-day working\nactivities.\n2.1 Updated\n researches in\n industry sector\n2.2 Verbal and\n written\n communication\n2.3 Interaction with\n clients\n2.4 Sharing with\n customers and\n clients the\n updated industry\n information\n2.5 Company policy\n2.6 Safety- and-\n health\n consciousness\n2.7 Resourceful-\n ness\n2.8 Diligence\n2.9 Time-\n consciousness\n2.9 Cost –\n consciousness\n2.10 Perseverance\n2.11 Ability to work\n with others\n harmoniously\n2.1 Updating\n knowledge on\n industry through\n research\n2.2 Sharing updated\n knowledge with\n colleagues and\n customers as\n appropriate\n2.3 Practicing\n communication\n skills\n\n--- PDF PAGE 30 ---\nTESDA-SOP-QSO-01-F08\n\nSANITARY LANDFILL OPERATIONS NC III (Amended) Promulgated June 16, 2015 -26-\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Sources of\nInformation\nInformation sources may include but are not limited to:\n1.1 Media\n1.2 Reference books\n1.3 Libraries\n1.4 Industry association\n1.5 Industry journals\n1.6 Internet\n1.7 Seminars\n1.8 Forum\n1.9 Personal observation and experience\n\n2. Information to assist\neffective work\nperformance\n\n2.1Different sectors of the industry and the services available in\n each sector\n2.2 Relationship between the customer representatives and other\n personnel\n2.3 Relationship between the industry and other industries\n2.4 Industry working conditions\n2.5 Legislation that affects the industry\n2.5.1 drugs and liquor\n2.5.2 health and safety\n2.5.3 hygiene\n2.5.4 workers compensation\n2.5.5 consumer protection\n2.5.6 building regulations\n2.6 Industrial relations issues and major organizations\n2.7 Career opportunities within the industry\n2.8 Work ethic required to work in the industry and industry\n expectations of staff quality assurance\n\n--- PDF PAGE 31 ---\nTESDA-SOP-QSO-01-F08\n\nSANITARY LANDFILL OPERATIONS NC III (Amended) Promulgated June 16, 2015 -27-