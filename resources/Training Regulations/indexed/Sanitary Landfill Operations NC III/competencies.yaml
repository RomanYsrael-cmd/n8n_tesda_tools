LEDGE\n\nREQUIRED\nSKILLS\n\n2.3 Relevant\nequipment and\noperational\nprocesses\n2.4 Enterprise goals,\ntargets and\nmeasures\n2.5 Enterprise quality,\nOHS and\nenvironmental\nrequirement\n2.6 Enterprise\ninformation\nsystems and data\ncollation\n2.7 Industry codes and\nstandards\n2.8 Normal operating\nparameters and\nproduct quality\n\n3. Determine\nfundamental\ncauses of the\nproblem\n3.1 Possible causes are\nidentified based on\nexperience and the\nuse of problem\nsolving tools /\nanalytical\ntechniques.\n3.2 Possible cause\nstatements are\ndeveloped based on\nfindings.\n3.3 Fundamental\ncauses are identified\nper results of\ninvestigation\nconducted.\n3.1 Relevant\nequipment and\noperational\nprocesses\n3.2 Enterprise goals,\ntargets and\nmeasures\n3.3 Enterprise quality,\nOHS and\nenvironmental\nrequirements\n3.4 Enterprise\ninformation\nsystems and data\ncollation\n3.5 Industry codes and\nstandards\n3.1 Analysis of root\ncauses\n4. Determine\ncorrective\naction\n4.1 All possible options\nare considered for\nresolution of the\nproblem.\n4.2 Strengths and\nweaknesses of\npossible options are\nconsidered.\n4.1 Understand the\nprocedure in\nundertaking\ncorrective action\n4.2 Principles of\ndecision making\nstrategies and\ntechniques\n4.1 Identify and clarify\nthe nature of the\nproblem\n4.2 Devise the best\nsolution\n4.3 Evaluate the\nsolution\n4.4 Implement plan to\n\n--- PDF PAGE 19 ---\nTESDA-SOP-QSO-01-F08\n\nSANITARY LANDFILL OPERATIONS NC III (Amended) Promulgated June 16, 2015 -15-\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n\n4.3 Corrective actions\nare determined to\nresolve the problem\nand possible future\ncauses.\n4.4 Action plans are\ndeveloped\nidentifying\nmeasurable\nobjectives, resource\nneeds and timelines\nin accordance with\nsafety and operating\nprocedures.\n\n4.3 Enterprise\ninformation\nsystems and data\ncollation\n4.4 Action planning\n\nrectify 