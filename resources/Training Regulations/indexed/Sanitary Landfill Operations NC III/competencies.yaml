        "evidence_guide": {
          "source_text": "1. Critical Aspects of\nCompetency\n\nAssessment requires evidence that the candidate:\n1.1 Studied and selected appropriate technology consistent\nwith work requirements\n1.2 Applied relevant technology\n1.3 Maintained and enhanced operative ability of relevant\ntechnology\n2. Resource\nImplications\nThe following resources should be provided:\n2.1 Relevant technology\n2.2 Interview and demonstration questionnaires\n2.3 Assessment packages\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1 Written Examination\n3.2 Oral Questioning\n4. Context for\nAssessment\n4.1 Competency may be assessed in actual workplace or\nsimulated environment\n\n--- PDF PAGE 28 ---\nTESDA-SOP-QSO-01-F08\n\nSANITARY LANDFILL OPERATIONS NC III (Amended) Promulgated June 16, 2015 -24-\n\nCOMMON COMPETENCIES\n\nUNIT OF COMPETENCY :\nDEVELOP AND UPDATE INDUSTRY KNOWLEDGE\nUNIT CODE\n:"
        },
        "source_text": "500311114\n\nUNIT DESCRIPTOR\n:\nThis unit of competency covers the knowledge, skills, and attitude\nrequired in selecting, sourcing and applying appropriate and\naffordable technologies in the workplace\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n1. Study/select\nappropriate\ntechnology\n\n1.1 Usage of different\ntechnologies is\ndetermined based\non job\nrequirements.\n1.2 Appropriate\ntechnology is\nselected as per\nwork specification.\n\n1.1 Awareness on\ntechnology and\nits function\n1.2 Communication\ntechniques\n1.3 Health and safety\nprocedure\n1.4 Company policy\nin relation to\nrelevant\ntechnology\n1.5 Machineries/\nequipment and\ntheir application\n1.6 Software\nprograms\n1.1 Identifying\nrelevant\ntechnology on job\n\n2 Apply relevant\ntechnology\n\n2.1 Relevant\ntechnology is\neffectively used in\ncarrying out\nfunction.\n2.2 Applicable software\nand hardware are\nused as per task\nrequirement.\n2.3 Management\nconcepts are\nobserved and\npracticed as per\nestablished\nindustry practices.\n2.1 Knowledge on\noperating\ninstructions\n2.2 Understanding\nsoftware and\nhardware system\n2.3 Communication\ntechniques\n2.4 Health and safety\nprocedure\n2.5 Company policy\nin relation to\nrelevant\ntechnology\n2.6 Different\nmanagement\nconcepts\n2.7 Technology\nadaptability\n2.8 Office technology\n2.9 Industrial\ntechnology\n2.1 Applying relevant\ntechnology\n2.2 Communicating\nskills\n2.3 Using software\napplications skills\n2.4 Conducting risk\nassessment\n\n--- PDF PAGE 26 ---\nTESDA-SOP-QSO-01-F08\n\nSANITARY LANDFILL OPERATIONS NC III (Amended) Promulgated June 16, 2015 -22-\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n2.10 System\ntechnology\n2.11 Training\ntechnology\n2.12 Different\nsoftware/\nhardware\n2.13 5S (Proper\nhousekeeping)\n3 Maintain/\nenhance\nrelevant\ntechnology\n3.1 Maintenance of\ntechnology is\napplied in\naccordance with the\nindustry standard\noperating\nprocedure,\nmanufacturer’s\noperating\nguidelines and\noccupational\nhealth and safety\nprocedure to\nensure its operative\nability.\n3.2 Updating of\ntechnology is\nmaintained through\ncontinuing education\nor training in\naccordance with job\nrequirement.\n3.3 Technology failure/\ndefect is\nimmediately\nreported to the\nconcern/responsible\nperson or section for\nappropriate action.\n3.1 Awareness on\n technology and its\n function\n3.2 Repair and\n maintenance\n procedure\n3.3 Health and safety\n procedure\n3.4 Company policy in\nrelation to relevant\ntechnology\n3.5 Upgrading of\ntechnology\n3.6 Organizational set-\nup/work flow\n\n3.1 Performing basic\ntroubleshooting\nskills\n3.2 Identifying failures\nor defects\n3.3 Communication\nskills\n3.4 Applying\ncorrective and\npreventive\nmaintenance\n\n--- PDF PAGE 27 ---\nTESDA-SOP-QSO-01-F08\n\nSANITARY LANDFILL OPERATIONS NC III (Amended) Promulgated June 16, 2015 -23-\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Technology\nMay include:\n1.1 Office technology\n1.2 Industrial technology\n1.3 System technology\n1.4 Information technology\n1.5 Training technology\n2. Management concepts\nMay include:\n2.1 Real Time Management\n2.2 KAIZEN or continuous improvement\n2.3 5s\n2.4 Total Quality Management\n2.5 Other management/productivity tools\n3. Industry standard operating\nprocedure\n3.1 Written guidelines relative to the usage of\noffice technology/equipment\n3.2 Verbal advise/instruction from the co-worker\n4. Manufacturer’s operating\nguidelines/ instructions\n4.1 Written instruction/manuals of specific\ntechnology/ equipment\n4.2 General instruction manual\n4.3 Verbal advise from manufacturer relative to\nthe operation of equipment\n5. Occupational health and\nsafety procedure\n5.1 Relevant statutes on OHS\n5.2 Company guidelines in using\ntechnology/equipment\n6. Appropriate action\n6.1 Implementing preventive maintenance\nschedule\n6.2 Coordinating with manufacturer’s technician\n\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\n\nAssessment requires evidence that the candidate:\n1.1 Studied and selected appropriate technology consistent\nwith work requirements\n1.2 Applied relevant technology\n1.3 Maintained and enhanced operative ability of relevant\ntechnology\n2. Resource\nImplications\nThe following resources should be provided:\n2.1 Relevant technology\n2.2 Interview and demonstration questionnaires\n2.3 Assessment packages\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1 Written Examination\n3.2 Oral Questioning\n4. Context for\nAssessment\n4.1 Competency may be assessed in actual workplace or\nsimulated environment\n\n--- PDF PAGE 28 ---\nTESDA-SOP-QSO-01-F08\n\nSANITARY LANDFILL OPERATIONS NC III (Amended) Promulgated June 16, 2015 -24-\n\nCOMMON COMPETENCIES\n\nUNIT OF COMPETENCY :\nDEVELOP AND UPDATE INDUSTRY KNOWLEDGE\nUNIT CODE\n:"
