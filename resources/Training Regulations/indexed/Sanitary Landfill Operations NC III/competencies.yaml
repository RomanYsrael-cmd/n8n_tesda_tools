        "evidence_guide": {
          "source_text": "1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1.\nIdentified the problem\n1.2.\nDetermined the fundamental causes of the\n problem\n1.3.\nDetermined the correct / preventive action\n1.4.\nProvided recommendation to manager\nThese aspects may be best assessed using a\nrange of scenarios / case studies / what ifs as a\nstimulus with a walk through forming part of the\nresponse. These assessment activities should\ninclude a range of problems, including new,\nunusual and improbable situations that may have\nhappened.\n2. Resource Implications\n2.1.\nAssessment will require access to an\noperating plant over an extended period of time,\nor a suitable method of gathering evidence of\noperating ability over a range of situations. A bank\nof scenarios / case studies / what ifs will be\nrequired as well as bank of questions which will be\nused to probe the reason behind the observable\naction.\n3. Methods of Assessment\nCompetency in this unit may be assessed\nthrough:\n3.1. Written Examination\n3.2. Oral Questioning\n4. Context for Assessment\n4.1. In all workplace, it may be appropriate to\nassess this unit concurrently with relevant\nteamwork or operation units.\n\n--- PDF PAGE 22 ---\nTESDA-SOP-QSO-01-F08\n\nSANITARY LANDFILL OPERATIONS NC III (Amended) Promulgated June 16, 2015 -18-\nUNIT OF COMPETENCY : USE MATHEMATICAL CONCEPTS AND TECHIQUES\n\nUNIT CODE :"
