        "source_title": "SOLVE PROBLEMS RELATED TO WORK ACTIVITIES",
        "source_text": "--- PDF PAGE 17 ---\nTESDA-SOP-QSO-01-F08\n \n \n \nSANITARY LANDFILL OPERATIONS NC III (Amended)   Promulgated June 16, 2015                                               -13- \nUNIT OF COMPETENCY : \nSOLVE PROBLEMS RELATED TO WORK ACTIVITIES  \n \nUNIT CODE  \n \n:          500311112 \n \nUNIT DESCRIPTOR  \n: \nThis unit of covers the knowledge, skills and attitudes required  \nsolving problems in the workplace including the application of  \nproblem solving techniques and to determine and resolve the  \nroot cause of problems. \n \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \n \nREQUIRED \nKNOWLEDGE \n \nREQUIRED \nSKILLS \n1. Explain the \nanalytical \ntechniques \n1.1 All the analytical \ntechniques are \nidentified. \n1.2 Use of each \ntechnique is applied \nin real life situations. \n1.1 Problem \nidentification \ntechniques \n1.2 Observation, \ninvestigation and \nanalytical \ntechniques \n1.3 Cause and effect \ndiagrams \n1.4 PARETO analysis \n1.5 SWOT analysis \n1.6 GANT chart \n1.7 PERT CPM and \ngraph \n1.8 SCATTERGRAMS  \n1.1 Conduct \ninvestigation and \nroot cause analysis \n1.2 Implement \ncorrective actions  \n2. Identify the \nproblem \n2.1 Variances are \nidentified from \nnormal operating \nparameters; and \nproduct quality. \n2.2 Extent, cause and \nnature of the \nproblem are defined \nthrough observation, \ninvestigation and \nanalytical \ntechniques. \n2.3 Problems are \nclearly stated and \nspecified. \n2.1 Competence \nincludes a \nthorough \nknowledge and \nunderstanding of \nthe process, \nnormal operating \nparameters, and \nproduct quality to \nrecognize non-\nstandard situations \n2.2 Competence to \ninclude the ability \nto apply and \nexplain, sufficient \nfor the \nidentification of \nfundamental \ncause, determining \nthe corrective \naction and \nprovision of \nrecommendations \n2.1 Use range of formal \nproblem solving \ntechniques \n2.2 Identify and clarify \nthe nature of the \nproblem \n2.3 Evaluate the \neffectiveness of a \npresent process in \nthe galley \n2.4 Apply analytical \ntechniques\n\n--- PDF PAGE 18 ---\nTESDA-SOP-QSO-01-F08\n \n \n \nSANITARY LANDFILL OPERATIONS NC III (Amended)   Promulgated June 16, 2015                                               -14- \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \n \nREQUIRED \nKNOWLEDGE \n \nREQUIRED \nSKILLS \n \n2.3 Relevant \nequipment and \noperational \nprocesses \n2.4 Enterprise goals, \ntargets and \nmeasures \n2.5 Enterprise quality, \nOHS and \nenvironmental \nrequirement \n2.6 Enterprise \ninformation \nsystems and data \ncollation \n2.7 Industry codes and \nstandards \n2.8 Normal operating \nparameters and \nproduct quality \n \n3. Determine \nfundamental \ncauses of the \nproblem  \n3.1 Possible causes are \nidentified based on \nexperience and the \nuse of problem \nsolving tools / \nanalytical \ntechniques. \n3.2 Possible cause \nstatements are \ndeveloped based on \nfindings. \n3.3 Fundamental \ncauses are identified \nper results of \ninvestigation \nconducted. \n3.1 Relevant \nequipment and \noperational \nprocesses \n3.2 Enterprise goals, \ntargets and \nmeasures \n3.3 Enterprise quality, \nOHS and \nenvironmental \nrequirements \n3.4 Enterprise \ninformation \nsystems and data \ncollation \n3.5 Industry codes and \nstandards \n3.1 Analysis of root \ncauses \n4. Determine \ncorrective \naction \n4.1 All possible options \nare considered for \nresolution of the \nproblem. \n4.2 Strengths and \nweaknesses of \npossible options are \nconsidered. \n4.1 Understand the \nprocedure in \nundertaking \ncorrective action \n4.2 Principles of \ndecision making \nstrategies and \ntechniques \n4.1 Identify and clarify \nthe nature of the \nproblem \n4.2 Devise the best \nsolution \n4.3 Evaluate the \nsolution \n4.4 Implement plan to\n\n--- PDF PAGE 19 ---\nTESDA-SOP-QSO-01-F08\n \n \n \nSANITARY 