        "source_title": "DEVELOP AND PRACTICE NEGOTIATION SKILLS",
        "source_text": "--- PDF PAGE 13 ---\nTESDA-SOP-QSO-01-F08\n \n \n \nSANITARY LANDFILL OPERATIONS NC III (Amended)   Promulgated June 16, 2015                                               -9- \n \nUNIT OF COMPETENCY   :      DEVELOP AND PRACTICE NEGOTIATION SKILLS \n \nUNIT CODE                        :      500311111 \n \nUNIT DESCRIPTOR           :      This unit covers the skills, knowledge and attitudes required to  \n \ncollect information in order to negotiate to a desired outcome and  \n \nparticipate in the negotiation. \n \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \n \nREQUIRED \nKNOWLEDGE \n \nREQUIRED \nSKILLS \n1. Plan \nnegotiations \n1.1 Information on \npreparing for \nnegotiation is \nidentified and \nincluded in the plan. \n1.2 Information on \ncreating non-\nverbal \nenvironments for \npositive negotiating \nis identified and \nincluded in the plan. \n1.3 Information on \nactive listening is \nidentified and \nincluded in the plan. \n1.4 Information on \ndifferent \nquestioning \ntechniques is \nidentified and \nincluded in the plan. \n1.5 Information is \nchecked to ensure \nit is correct and up-\nto- date. \n1.1 Knowledge on \nCodes of practice \nand guidelines for \nthe organization   \n1.2 Knowledge of \norganizations \npolicy and \nprocedures for \nnegotiations   \n1.3 Decision making \nand conflict \nresolution \nstrategies \nprocedures   \n1.4 Concept of \nnegotiation \n \n1.1 Communication \nskills (verbal and \nlistening) \n1.2 Active listening  \n1.3 Setting conflict \n1.4 Preparing conflict \nresolution \n1.5 Problem solving \nstrategies on how \nto deal with \nunexpected \nquestions and \nattitudes during \nnegotiation \n1.6 Interpersonal skills \nto develop rapport \nwith other parties \n \n2. Participate in \nnegotiations  \n2.1 Criteria \nfor \nsuccessful outcome \nare agreed upon by \nall parties. \n2.2 Desired outcome of \nall parties are \nconsidered. \n2.3 Appropriate \nlanguage is used \nthroughout the \nnegotiation. \n \n2.1 Outcome of   \nnegotiation   \n2.2 Knowledge on \nLanguage \n2.3 Different \nQuestioning \ntechniques \n2.4 Problem solving \nstrategies on how \nto deal with \nunexpected \nquestions and \n2.1 Negotiating skill \n2.2 Communication \nskills (verbal and \nlistening) \n2.3 Observation skills  \n2.4 Interpersonal skills \nto develop rapport \nwith other parties \n2.5 Applying effective \nquestioning \ntechniques \n2.6 Setting conflict\n\n--- PDF PAGE 14 ---\nTESDA-SOP-QSO-01-F08\n \n \n \nSANITARY LANDFILL OPERATIONS NC III (Amended)   Promulgated June 16, 2015                                               -10- \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \n \nREQUIRED \nKNOWLEDGE \n \nREQUIRED \nSKILLS \n2.4 A variety of \nquestioning \ntechniques are \nused. \n2.5 The issues and \nprocesses are \ndocumented and \nagreed upon by all \nparties. \n2.6 Possible solutions \nare discussed and \ntheir viability \nassessed. \n2.7 Areas for \nagreement are \nconfirmed and \nrecorded. \n2.8 Follow-up action is \nagreed upon by all \nparties. \nattitudes during \nnegotiation  \n2.5 Flexibility \n2.6 Empathy   \n2.7 Decision making \nand conflict \nresolution \nstrategies \nprocedures \n2.8 Problem solving \nstrategies on how \nto deal with \nunexpected \nquestions and \nattitudes during \nnegotiation\n\n--- PDF PAGE 15 ---\nTESDA-SOP-QSO-01-F08\n \n \n \nSANITARY LANDFILL OPERATIONS NC III (Amended)   Promulgated June 16, 2015                                               -11- \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Preparing for \nnegotiation \n1.1 \n \n1.2 \n1.3 \n1.4 \n \n \n \n \n \n1.5 \n \n \n \n \n \n \n \n1.6  \nBackground information on other parties to the \nnegotiation \nGood understanding of topic to be negotiated \nClear understanding of desired outcome/s \nPersonal attributes \n1.4.1 self - awareness \n1.4.2 self esteem \n1.4.3 objectivity \n1.4.4 empathy \n1.4.5 respect for others \nInterpersonal skills \n1.5.1 listening/reflecting \n1.5.2 non- verbal communication \n1.5.3 assertiveness \n1.5.4 behavior labeling \n1.5.5 testing understanding \n1.5.6 seeking information \n1.5.7 self -disclosing \nAnalytic skills \n1.6.1 observing differences between content and \nprocess \n1.6.2 identifying bargaining information \n1.6.3 applying strategies to manage process \n1.6.4 applying steps in negotiating process \n1.6.5 strategies to manage conflict \n1.6.6 steps in negotiating process \n1.6.7 options within organization and externally \nfor resolving conflict \n \n2. Non - verbal \nenvironments \n2.1 \n2.2 \n2.3 \n2.4 \nFriendly reception \nWarm and welcoming room \nRefreshments offered \nLead in conversation before negotiation begins \n \n3. Active listening \n3.1 \n3.2 \n3.3 \n3.4 \n3.5 \nAttentive \nDon’t interrupt \nGood posture \nMaintain eye contact \nReflective listening\n\n--- PDF PAGE 16 ---\nTESDA-SOP-QSO-01-F08\n \n \n \nSANITARY LANDFILL OPERATIONS NC III (Amended)   Promulgated June 16, 2015                                               -12- \nEVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 Demonstrated sufficient knowledge of the factors \ninfluencing negotiation to achieve agreed outcome \n1.2 Participated in negotiation with at least one person to \nachieve an agreed outcome \n2. Resource \nImplications \nThe following resources should be provided:  \n2.1 Room with facilities necessary for the negotiation \nprocess \n2.2 Human resources (negotiators)  \n3. Methods of \nAssessment \nCompetency in this unit may be assessed through: \n3.1 Written Examination \n3.2 Oral Questioning \n3.3 Portfolio \n4. Context for \nAssessment \n4.1 Competency to be assessed in real work environment \nor in a simulated workplace setting.\n",
