        "source_title": "PERFORM WORKPLACE SECURITY AND SAFETY PRACTICES",
        "source_text": "--- PDF PAGE 32 ---\nTESDA-SOP-QSO-01-F08\n \n \n \nSANITARY LANDFILL OPERATIONS NC III (Amended)   Promulgated June 16, 2015                                               -28- \nUNIT OF COMPETENCY :    PERFORM WORKPLACE SECURITY AND SAFETY PRACTICES \nUNIT CODE \n: \nUTL9611202 \nUNIT DESCRIPTOR \n:    This unit of competency deals with the knowledge, skills and attitudes \nin following health, safety and security practices.  It includes dealing \nwith emergency situations and maintaining safe personal \npresentation standards. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range of \nVariables \nREQUIRED KNOWLEDGE \nREQUIRED SKILLS \n1. Follow \nworkplace \nprocedures \nfor health, \nsafety and \nsecurity \npractices \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n1.1 Correct health, \nsafety and \nsecurity \nprocedures are \nfollowed in line \nwith legislation \nand enterprise \nprocedures \n1.2 Breaches of \nhealth, safety and \nsecurity \nprocedures are \nidentified and \nreported in line \nwith enterprise \nprocedure. \n1.3 Suspicious \nbehavior or \nunusual \noccurrences are \nreported in line \nwith enterprise \nprocedure. \n1.1 Correct health, safety   \n      and security procedures \n1.2 Types of breaches of   \n       health, safety and   \n       security procedures \n1.3 Verbal and written   \n      communication \n1.4 Interaction with clients \n1.5 Personal Safety   \n      Equipment \n1.6 Work hazards \n1.7 Codes and Regulations \n1.8 Occupational safety and   \n      health standards \n1.9 RA 9003 \n1.10 RA 6969 \n1.11 Local ordinances \n1.12 Safety- and -health   \n        consciousness \n1.13 Resourcefulness \n1.14 Diligence \n1.15 Time-consciousness \n1.16 Cost -consciousness \n1.17 Perseverance  \n1.18 Ability to work with   \n        others harmoniously \n1.1 Knowing the             \n      sources of            \n      information on the   \n      industry \n1.2 Assessing and   \n      updating industry   \n      information to   \n      effect improved   \n      work performance \n1.3 Applying industry   \n      information to day-  \n      to-day work   \n      activities \n1.4 Practicing   \n      communication   \n      skills \n \n2. Deal with \nemergency \nsituations \n2.1 Emergency and \npotential \nemergency \nsituations are \nrecognized and \nappropriate \nactions are taken \nwithin individual’s  \nscope of \nresponsibility. \n2.2 Emergency \nprocedures are \nfollowed in line \n2.1Types of emergency     \n     situations and   \n     procedures \n2.2 Verbal and written   \n      communication \n2.3 Interaction with clients  \n2.4 Personal Safety   \n      Equipment \n2.5 Work hazards \n2.6 Occupational safety and   \n      health standards \n2.7 RA 9003 \n2.8 RA 6969 \n2.1 Practicing intra and  \n      interpersonal skills \n2.2 Applying           \n      appropriate actions   \n      to emergencies \n2.3 Reporting   \n      emergency   \n      situations\n\n--- PDF PAGE 33 ---\nTESDA-SOP-QSO-01-F08\n \n \n \nSANITARY LANDFILL OPERATIONS NC III (Amended)   Promulgated June 16, 2015                                               -29- \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range of \nVariables \nREQUIRED KNOWLEDGE \nREQUIRED SKILLS \nwith enterprise \nprocedures. \n2.3 Assistance is \nsought from \ncolleagues to \nresolve or \nrespond to \nemergency \nsituation. \n2.4 Details of \nemergency \nsituations are \nreported in line \nwith enterprise \nprocedures. \n2.9 Local ordinances \n2.10 Safety- and- health   \n        consciousness \n2.11 Resourcefulness \n2.12 Diligence \n2.13 Time-   \n        consciousness \n2.14 Cost-   \n        consciousness \n2.15 Perseverance  \n2.16 Ability to work with   \n       others harmoniously \n3. Maintain safe   \n    personal    \n    presentation   \n    standards \n3.1   Safe personal \nstandards are \nidentified and \nfollowed in line \nwith enterprise \nrequirements. \n3.1 Types of emergency   \n      situations and   \n      procedures \n3.2 Personal safety                 \n      standards \n3.3 Verbal and written \n communication \n3.4 Interaction with \n clients \n3.5 Personal Safety    \n      Equipment \n3.6 Work hazards \n3.7 Occupational safety and   \n      health standards \n3.8 RA 9003 \n3.9 RA 6969 \n3.10 Local ordinances \n3.11 Safety- and- health   \n        consciousness \n3.12 Resourcefulness \n3.13 Diligence \n3.14 Time -consciousness \n3.15 Cost -consciousness \n3.16 Perseverance  \n3.17 Ability to work with   \n       others harmoniously \n \n3.1 Practicing intra and  \n      interpersonal skills \n3.2 Following   \n      appropriate safety   \n      personal standards\n\n--- PDF PAGE 34 ---\nTESDA-SOP-QSO-01-F08\n \n \n \nSANITARY LANDFILL OPERATIONS NC III (Amended)   Promulgated June 16, 2015                                               -30- \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1 Health, Safety and Security \nProcedures \nMay include but are not limited to: \n1.1 Use of personal protective clothing and equipment \n1.2 Safe posture including sitting, standing, bending \n1.3 Manual handling including lifting, transferring \n1.4 Safe handling of chemicals, poisons and dangerous \nmaterials \n1.5 Ergonomically sound furniture and work stations \n1.6 Emergency fire and accident \n1.7 Hazard identification and control \n1.8 Security of documents, cash, equipment, people \n1.9 Key control systems \n \n2 Breaches of Procedure \nMay include but are not limited to: \n2.1 Loss of keys \n2.2 Strange or suspicious persons \n2.3 Broken or malfunctioning equipment \n2.4 Loss of property, goods or materials \n2.5 Damaged property or fittings \n2.6 Lack of suitable signage when required \n2.7 Lack of training on health and safety issues \n2.8 Unsafe work practices \n \n3 Emergency \nMay include but is not limited to: \n3.1   Personal injuries \n3.2 Fire \n3.3 Electrocution \n3.4 Natural calamity i.e. earthquake/flood \n3.5 Criminal acts i.e. robbery \n3.6 Bomb\n\n--- PDF PAGE 35 ---\nTESDA-SOP-QSO-01-F08\n \n \n \nSANITARY LANDFILL OPERATIONS NC III (Amended)   Promulgated June 16, 2015                                               -31- \n \nEVIDENCE GUIDE \n \n1. Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1 Complied with industry practices and procedures \n1.2 Used interactive communication with others \n1.3 Complied with workplace safety, security and hygiene practices \n1.4 Identified faults and problems and the necessary corrective \naction \n1.5 Promoted public relation among others \n1.6 Complied with quality standards \n1.7 Responded to emergency situations in line with enterprise \nguidelines \n1.8  Complied with proper dress code \n \n3 Resource   \nimplications \nThe following resources should be provided: \n2.1 Procedures manual on safety, security, health and emergency \n2.2 Availability of tools, equipment, supplies and materials \n \n3 Methods of \nassessment \nCompetency may be assessed through: \n3.1 Written examination \n3.2 Practical demonstration \n3.3 Interview \n \n4 Context of \nassessment \n4.1 Competency may be assessed in the work place or in a \nsimulated work place setting.\n",
