        "source_text": "--- PDF PAGE 41 ---\nTESDA-SOP-QSO-01-F08\n \n \n \nSANITARY LANDFILL OPERATIONS NC III (Amended)   Promulgated June 16, 2015                                               -37- \n \nCORE COMPETENCIES \n \nUNIT OF COMPETENCY : \nSUPERVISE IN-COMING WASTE IN THE ACTIVE CELL \nUNIT CODE \n: \nUTL325301 \nUNIT DESCRIPTOR \n: \nThis unit involves the overseeing of in-coming wastes at the active \ncell of the Sanitary Landfill Facility (SLF) \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range of \nVariables \nREQUIRED KNOWLEDGE \nREQUIRED SKILLS \n1. Confirm road \naccess to \nactive cell \n1.1 Road condition \nfor incoming trucks \nis inspected in \naccordance with \nestablished \nprocedures \n1.2 Readiness of the \nactive cell is \ninspected in \naccordance with \nestablished \nprocedures  \n1.3 The assigned \nequipment is \nchecked in \naccordance with \nestablished \nprocedures and \nroad condition. \n \n1.1 Adopted SLF   \n      operational systems  \n      and procedures \n1.2 Manual on  \n      Establishment and  \n      Operations for SLF \n1.3 Types and Uses of  \n      equipment \n1.4 Work schedule \n1.5 Protocol in area \n1.6 Verbal and written  \n      communication \n1.7 Interaction with  \n      clients  \n1.8 Personal Safety  \n      Equipment \n1.9 Work hazards \n1.10Occupational safety  \n       and health standards \n1.11 RA 9003 \n1.12 Safety- and -health  \n        consciousness \n1.13 Resourcefulness \n1.14 Diligence \n1.15 Time-consciousness \n1.16 Cost -consciousness \n1.17 Perseverance  \n1.18 Ability to work with  \n       others harmoniously \n1.1 Inspecting road   \n      conditions,           \n      cleanliness and  \n      passability of the  \n      road \n1.2 Following the  \n      operations SLF  \n      manual \n \n2. Monitor waste \ndisposal in cell \n2.1 Disposal \nprocedures are \nfollowed based on \nestablished \nprocedures.  \n2.2 Truck position is \nmonitored \n2.1 Disposal 