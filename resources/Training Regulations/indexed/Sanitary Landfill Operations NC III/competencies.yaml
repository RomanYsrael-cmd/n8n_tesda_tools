  "source_section_text": "SECTION 2 COMPETENCY STANDARDS\n\nThese guidelines are set to provide the Technical Vocational Education and Training (TVET)\nproviders with information and other important requirements to consider when designing training\nprograms for SANITARY LANDFILL OPERATIONS NC III.\n\nBASIC COMPETENCIES\n\nUNIT OF COMPETENCY : LEAD WORKPLACE COMMUNICATION\n\nUNIT CODE\n : 500311109\n\n UNIT DESCRIPTOR :\nThis unit covers the knowledge, skills and attitudes required to lead\nin the dissemination and discussion of ideas, information and issues\nin the workplace.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n1. Communicate\ninformation\nabout\nworkplace\nprocesses\n1.1 Appropriate\ncommunication\nmethod is selected\n1.2 Multiple operations\ninvolving several\ntopics areas are\ncommunicated\naccordingly\n1.3 Questions are used\nto gain extra\ninformation\n1.4 Correct sources of\ninformation are\nidentified\n1.5 Information is\nselected and\norganized correctly\n1.6 Verbal and written\nreporting is\nundertaken when\nrequired\n1.7 Communication\nskills are maintained\nin all situations\n1.1 Organization\nrequirements for\nwritten and\nelectronic\ncommunication\nmethods\n1.2 Effective verbal\ncommunication\nmethods\n1.3 Methods of\nCommunication\n1.4 Types of Question\n1.5 Communication\nTools\n1.6 Questioning\nTechniques\n1.1 Organizing\ninformation\n1.2 Understanding and\nconveying intended\nmeaning\n1.3 Participating in\nvariety of workplace\ndiscussions\n1.4 Complying with\norganization\nrequirements for\nthe use of written\nand electronic\ncommunication\nmethods\n1.5 Reporting\noccupational\nhazards during\nsafety meeting\n2. Lead\nworkplace\ndiscussions\n2.1 Response to\nworkplace issues\nare sought\n2.2 Response to\nworkplace issues\nare provided\n2.1 Leading as a\nmanagement\nfunction\n2.2 Barriers of\ncommunication\n\n2.1 Communicating\neffectively\n2.2 Consulting the crew\non the prepared\nmenu for the month\n\n--- PDF PAGE 7 ---\nTESDA-SOP-QSO-01-F08\n\nSANITARY LANDFILL OPERATIONS NC III (Amended) Promulgated June 16, 2015 -3-\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\nimmediately\n2.3 Constructive\ncontributions are\nmade to workplace\ndiscussions on such\nissues as\nproduction, quality\nand safety\n2.3 Effective verbal\ncommunication\nmethods\n2.4 Method/techniques\nof discussion\n2.5 How to lead\ndiscussion\n2.6 How to solicit\nresponse\n3. Identify and\ncommunicate\nissues arising\nin the\nworkplace\n3.1. Issues and\nproblems are\nidentified as they\narise\n3.2. Information\nregarding problems\nand issues are\norganized\ncoherently to ensure\nclear and effective\ncommunication\n3.3. Dialogue is initiated\nwith appropriate\npersonnel\n\n3.4. Communication\nproblems and\nissues are raised as\nthey arise\n3.1Types of issues and\n problems in the\n workplace\n3.2 Written and\n electronic\n communication\n methods\n3.3 Communication\n barriers affecting\n workplace\n discussions\n3.1 Identifying cause of\nproblems\n3.2 Communicating\nwith the Master of\nthe Ship on the\npossible shortage\nof the food supply\ndue to change of\nship’s port\n3.3 Identifying\nproblems and\nissues\n\n3.4 Organizing\ninformation on\nproblems and\nissues\n3.5 Relating problems\n and issues of call/\n voyage\n\n--- PDF PAGE 8 ---\nTESDA-SOP-QSO-01-F08\n\nSANITARY LANDFILL OPERATIONS NC III (Amended) Promulgated June 16, 2015 -4-\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Communication\nmethod\n1.1. Non-verbal gestures\n1.2. Verbal\n1.3. Face to face\n1.4. Two-way radio\n1.5. Speaking to groups\n1.6. Using telephone\n1.7. Written\n1.8. Internet\n\nEVIDENCE GUIDE\n\n1. Critical Aspects\nof Competency\nAssessment requires evidence that the candidate:\n1.1 Dealt with a range of communication/information at\none time\n1.2 Made constructive contributions in workplace issues\n1.3 Sought workplace issues effectively\n1.4 Responded to workplace issues promptly\n1.5 Presented information clearly and effectively written\nform\n1.6 Used appropriate sources of information\n1.7 Asked appropriate questions\n1.8 Provided accurate information\n2. Resource\nImplications\nThe following resources should be provided:\n2.1 Variety of Information\n2.2 Communication tools\n2.3 Simulated workplace\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1 Written Examination\n3.2 Oral Questioning\n4. Context for\nAssessment\n4.1 Competency may be assessed in the workplace or in\nsimulated workplace environment\n\n--- PDF PAGE 9 ---\nTESDA-SOP-QSO-01-F08\n\nSANITARY LANDFILL OPERATIONS NC III (Amended) Promulgated June 16, 2015 -5-\n\nUNIT OF COMPETENCY :\nLEAD SMALL TEAMS\n\n(Guide and lead others/ Be responsible to others)\n\nUNIT CODE\n: 500311110\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes to lead small\n\nteams including setting and maintaining team and individual\n\nperformance standards.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n1. Provide team\nleadership\n1.1 Work requirements\nare identified and\npresented to team\nmembers\n1.2 Reasons for\ninstructions and\nrequirements are\ncommunicated to\nteam members\n1.3 Team members’\nqueries and\nconcerns are\nrecognized,\ndiscussed and dealt\nwith\n\n1.1 Company policies\nand procedures\n1.2 How performance\nexpectations are\nset\n1.3 Methods of\nMonitoring\nPerformance\n1.4 Client\nexpectations\n1.5 Team member’s\nduties and\nresponsibilities\n1.6 Definition of Team\n1.7 Skills and\ntechniques in\npromoting team\nbuilding\n1.8 Up-to-date\ndissemination of\ninstructions and\nrequirements to\nmembers\n1.9 Art of listening\nand treating\nindividual team\nmembers concern\n1.1 Communication\nskills required for\nleading teams\n1.2 Team