n3. Implement \nmitigation \nmeasures to \neliminate the \nenvironment\nal risks and \nhazards in \nthe work \nplace \n \n3.1. Resources for the \noperation of the \nenvironmental \nhealth and \nawareness are \nidentified, seek and \nprovided, in a timely \nand consistent \nmanner according \nto workplace \nprocedures \n3.2. Environmental \nhealth and \nawareness \nmeasures are \ncommunicated to \nrelevant personnel \nas required \n3.3. Appropriate \ndevelopment and \ntraining on the \nenvironmental \nhealth and \nawareness are \nprovided or \narranged for \nrelevant personnel \nas required \n3.4. Known and \nintended process \nchanges and \nenhancements to \nthe environmental \nhealth management \nplan are \ncommunicated to \nrelevant personnel \n3.5. All environmental \nhealth and \nawareness records \nare confirmed and \nreports are \nproduced, \nprocessed and \nmaintained \n \n3.1 Correct waste collection   \n      and hauling procedures  \n      to assure     \n      environmental health  \n      and safety \n3.2 Identify types of   \n      breaches of health,   \n      safety and operational   \n      procedures that   \n      endanger environmental   \n      health \n3.3 Types of wastes and   \n       their characteristics and  \n      effects on the   \n      environment \n3.4 Ways that different   \n      waste affects the   \n      environment. \n3.5 Reasons for   \n      correct/proper use of   \n      PPEs. \n3.6 Verbal and written   \n      communication \n3.7 Interaction with clients  \n3.8 Personal Safety        \n      Equipment \n3.9 Work hazards \n3.10 Occupational safety   \n        and health standards \n3.11 RA 9003 \n3.12 RA 6969 \n3.13 Clean Air Act \n3.14 Clean Water Act \n3.15 Other Laws \n3.16 Local ordinances \n3.17 Safety- and -health        \n        consciousness \n3.18 Resourcefulness \n3.19 Diligence \n3.20 Time-consciousness \n3.21 Cost -consciousness \n3.22 Perseverance  \n3.23 Ability to work with   \n       others harmoniously \n3.1 Implementing    \n      mitigation  \n      measures to  \n      eliminate  \n      environmental risks  \n      and hazards in the  \n       work place  \n3.2 Understanding and   \n      following the       \n      proper procedures \n3.3 Identifying and   \n      reporting breaches  \n      of environmental  \n      safety and security  \n      procedures \n3.4 Reporting  \n      suspicious  \n      workplace  \n      conditions or  \n      unusual  \n      occurrences that  \n      are potential risks  \n      of hazards \n3.5 Practicing  \n      communication  \n      skills \n3.6 Writing reports \n3.7 Documentation \nskills\n\n--- PDF PAGE 39 ---\nTESDA-SOP-QSO-01-F08\n \n \n \nSANITARY LANDFILL OPERATIONS NC III (Amended)   Promulgated June 16, 2015                                               -35- \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Environmental risks and \nhazards   \nMay include but are not limited to: \n1.1 Physical hazards – impact, illumination, pressure, noise, \nvibration, temperature, radiation  \n1.2 Biological hazards- bacteria, viruses, plants, parasites, \nmites, molds, fungi, insects \n1.3 Chemical hazards – dusts, fibers, mists, fumes, smoke, \ngases, vapors \n1.4 Ergonomics \n1.4.1 Psychological factors – over exertion/ excessive \nforce, awkward/static positions, fatigue, direct \npressure, varying metabolic cycles \n1.4.2 Physiological factors – monotony, personal \nrelationship, work out cycle \n1.5  Presence of un-qualified and/or untrained persons in the \nworkplace \n \n2. Proper procedures \nMay include but are not limited to: \n2.1 The operational activity flows used in the job. \n2.2. Use of personal protective clothing and equipment \n2.3  The proper checking of equipment and tools before use \n2.4  Safe posture including sitting, standing, bending \n2.5  Manual handling of waste including lifting, transferring and \nstowing the waste in proper order \n2.6  Emergency fire and accident \n2.7  Hazard identification and control \n2.8  Proper procedures in handling waste accidents and/or \nspillage \n \n3. Breaches \nMay include but is not limited to: \n3.1  Continued use and/or operation of wrong and/or \nmalfunctioning tools and equipment \n3.2  Presence of un-qualified and/or untrained persons within \nthe work area \n3.3 Unsafe containment of waste. \n3.4  Improper system of operations in collection and hauling of \nwaste \n3.5  Lack of suitable signage when required \n3.6  Lack of training on health and safety issues \n3.7  Unsafe work practices\n\n--- PDF PAGE 40 ---\nTESDA-SOP-QSO-01-F08\n \n \n \nSANITARY LANDFILL OPERATIONS NC III (Amended)   Promulgated June 16, 2015                                               -36- \n \nEVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1. Complied with industry and company practices and procedures \n1.2. Used interactive communication with others \n1.3. Complied with workplace safety, security and hygiene practices \n1.4. Identified faults and problems and the necessary corrective \naction \n1.5. Maintained environmental health in the workplace \n2. Resource   \nImplications \nThe following resources should be provided: \n2.1 Procedures manual on safety, security, health and emergency \n2.2 Availability of tools, equipment, supplies and materials \n2.3 Availability of PPEs \n \n3. Methods of \nassessment \nCompetency may be assessed through: \n7.3 Written examination \n7.4 Practical demonstration \n7.5 Interview \n \n4. Context of \nassessment \n4.1 Competency may be assessed in the work place or in a \nsimulated work place setting.\n",
