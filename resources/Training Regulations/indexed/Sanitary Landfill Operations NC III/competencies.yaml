        "source_text": "--- PDF PAGE 22 ---\nTESDA-SOP-QSO-01-F08\n \n \n \nSANITARY LANDFILL OPERATIONS NC III (Amended)   Promulgated June 16, 2015                                               -18- \nUNIT OF COMPETENCY   :      USE MATHEMATICAL CONCEPTS AND TECHIQUES    \n \nUNIT CODE                        :       500311113 \n \nUNIT DESCRIPTOR           :       This unit covers the knowledge, skills and attitudes required in the \napplication of mathematical concepts and techniques. \n \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \n \nREQUIRED \nKNOWLEDGE \n \nREQUIRED \nSKILLS \n1. Identify \nmathematical \ntools and \ntechniques to \nsolve problem \n1.1 Problem areas are \nidentified based on \ngiven condition. \n1.2 Mathematical \ntechniques \nare \nselected based on \nthe given problem. \n \n \n1.1 Fundamental \noperation \n(addition, \nsubtraction, \ndivision, \nmultiplication) \n1.2 Units of \nmeasurement and \nits conversion \n1.3 Fundamental of \nunits \n1.4 Standard formulas \n1.5 Basic measuring \ntools/devices \n1.6 Measurement \nsystem \n1.7 Basic measuring \ntools/devices \n1.8 Steps in solving \nproblem  \n1.1 Identifying and \nselecting different \nmeasuring tools \n1.2 Applying different \nformulas in solving \nproblems \n1.3 Describing the units \nof measurement \nand fundamental \nunits \n1.4 Stating arithmetic \ncalculations \ninvolving the \nfollowing; addition, \nsubtraction, \ndivision, \nmultiplication  \n1.5 Stating arithmetic \ncalculations \ninvolving the \nfollowing:  addition, \nsubtraction, \ndivision, \nmultiplication \n1.6 Applying theory into \nactual application \non shipboard \ncatering processes \n2. Apply \nmathematical \nprocedure/ \nsolution \n2.1 Mathematical \ntechniques are \napplied based on \nthe problem \nidentified. \n2.2 Mathematical \ncomputations are \nperformed to the \nlevel of accuracy \nrequired for the \nproblem. \n \n2.1 Problem-based \nquestions \n2.2 Estimation \n2.3 Use of \nmathematical tools \nand standard \nformulas \n2.4 Mathematical \ntechniques \n \n2.1 Solving \nmathematical \ncomputations \n2.2 Converting Metric \nto English \n2.3 Selecting and using \nappropriate and \nefficient techniques \nand strategies to \nsolve problems\n\n--- PDF PAGE 23 ---\nTESDA-SOP-QSO-01-F08\n \n \n \nSANITARY LANDFILL OPERATIONS NC III (Amended)   Promulgated June 16, 2015                                               -19- \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \n \nREQUIRED \nKNOWLEDGE \n \nREQUIRED \nSKILLS \n2.3 Results of \nmathematical \ncomputation are \ndetermined and \nverified based on \njob requirements. \n3. Analyze \nresults  \n3.1 Result of \napplication is \nreviewed based on \nexpected and \nrequired \nspecifications and \noutcome. \n3.2 Appropriate \naction is applied in \ncase of error. \n \n3.1 Techniques in \nanalyzing the \nresults \n3.2 Process in \nreviewing the \nresults \n3.3 Precision and \naccuracy \n3.4 Four fundamental \noperations \n3.5 Steps in solving \nproblem \n3.6 Standard formulas \n3.7Conversion  \n     measurement \n3.1 Analyzing the result \nbased on the \nspecified \nrequirements \n3.2 Interpreting and \ncommunicating the \nresults of the \nanalysis\n\n--- PDF PAGE 24 ---\nTESDA-SOP-QSO-01-F08\n \n \n \nSANITARY LANDFILL OPERATIONS NC III (Amended)   Promulgated June 16, 2015                                               -20- \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Mathematical techniques \nMay include: \n1.1 Four fundamental operations \n1.2 Measurements \n1.3 Use/Conversion of units of measurements \n1.4 Use of standard formulas \n \n2. Appropriate action \n2.1 Review in the use of mathematical techniques (e.g. \nrecalculation, re-modeling) \n2.2 Report error to immediate superior for proper action \n \n \n \n \nEVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candi