aning of \nequipment \n5.1 Corrective actions \nare undertaken \nbased on \nequipment \nbreakdown  \n5.2 Equipment \noperator is \ninstructed to \ncheck if the \nequipment is \ncleaned properly \nand parked in the \n5.1 Procedure and   \n      guidelines in parking   \n      of equipment  \n5.2 OHS procedures and  \n      guidelines \n5.3 Types and uses of  \n      equipment  \n5.4 Protocol in area \n5.5 Incidence reporting \n5.6 Monitoring forms \n5.7 Verbal and written  \n      communication  \n5.8 Personal Safety  \n      Equipment \n5.1 Practicing verbal  \n      and written  \n      communications  \n5.2 Giving instructions\n\n--- PDF PAGE 44 ---\nTESDA-SOP-QSO-01-F08\n \n \n \nSANITARY LANDFILL OPERATIONS NC III (Amended)   Promulgated June 16, 2015                                               -40- \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range of \nVariables \nREQUIRED KNOWLEDGE \nREQUIRED SKILLS \ndesignated area. \n5.3 Inspection report \nis prepared based \non equipment \nstatus \n5.4 Daily equipment \nand site report is \naccomplished in \naccordance with \nenterprise \nrequirements. \n5.9 Work hazards \n5.10 Occupational safety  \n        and health    \n   standards \n5.11 RA 9003 \n5.12 Safety- and- health  \n        consciousness \n5.13 Resourcefulness \n5.14 Diligence \n5.15 Time-  \n         consciousness \n5.16 Cost -consciousness \n5.17 Perseverance  \n5.18 Ability to work with  \n        others harmoniously \n \n6. Monitor \nleachate \nproduction \n6.1 Leachate \nproduction is \nmonitored in \naccordance with \nestablished \nprocedures of \nSanitary Landfill \n(SLF) manual of \noperations. \n6.2 Water and \nleachate \nsampling is done \nin accordance \nwith established \nprocedures of \nSanitary Landfill \n(SLF) manual of \noperations \n6.3 Corrective \nmeasures for \ncontrolling \nseepage and \nspread of harmful \nleachate are \nundertaken \n6.1 SLF Operations    \n      Manual \n6.2 NSWMC Manual on  \n     