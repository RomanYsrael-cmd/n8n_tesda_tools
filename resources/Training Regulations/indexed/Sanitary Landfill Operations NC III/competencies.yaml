        "source_text": "--- PDF PAGE 9 ---\nTESDA-SOP-QSO-01-F08\n \n \n \nSANITARY LANDFILL OPERATIONS NC III (Amended)   Promulgated June 16, 2015                                               -5- \n \nUNIT OF COMPETENCY      : \nLEAD SMALL TEAMS  \n \n \n(Guide and lead others/ Be responsible to others) \n \nUNIT CODE \n:      500311110 \n \nUNIT DESCRIPTOR              :     This unit covers the knowledge, skills and attitudes to lead small  \n \n \nteams including setting and maintaining team and individual  \n \n \nperformance standards. \n \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \n \nREQUIRED \nKNOWLEDGE \n \nREQUIRED \nSKILLS \n1. Provide team \nleadership \n1.1 Work requirements \nare identified and \npresented to team \nmembers \n1.2 Reasons for \ninstructions and \nrequirements are \ncommunicated to \nteam members \n1.3 Team members’ \nqueries and \nconcerns are \nrecognized, \ndiscussed and dealt \nwith \n \n1.1 Company policies  \nand procedures \n1.2 How performance  \nexpectations are \nset \n1.3 Methods of   \nMonitoring  \nPerformance \n1.4 Client \nexpectations \n1.5 Team member’s \nduties and \nresponsibilities \n1.6 Definition of Team \n1.7 Skills and \ntechniques in \npromoting team \nbuilding \n1.8 Up-to-date \ndissemination of \ninstructions and \nrequirements to \nmembers  \n1.9 Art of listening \nand treating \nindividual team \nmembers concern \n1.1 Communication \nskills required for \nleading teams \n1.2 Team building skills \n1.3 Negotiating skills \n1.4 Evaluation skills \n2. Assign \nresponsibilities \n2.1 Duties and \nresponsibilities are \nallocated having \nregard to the skills, \nknowledge and \naptitude required to \nproperly undertake \nthe assigned task \nand according to \ncompany policy \n2.1 Concept of \ndelegation \n2.2 How to delegate \n2.3 Understanding \nindividual \ndifferences \n2.4 Methods of \nmonitoring \nperformance \n2.5 Duties and \n2.1 Delegating skills \n2.2 Identifying individual \nskills, knowledge \nand attitude as \nbasis for allocating \nresponsibilities \n2.3 Identifying each \nteam member \nduties and \nresponsibilities\n\n--- PDF PAGE 10 ---\nTESDA-SOP-QSO-01-F08\n \n \n \nSANITARY LANDFILL OPERATIONS NC III (Amended)   Promulgated June 16, 2015                                               -6- \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \n \nREQUIRED \nKNOWLEDGE \n \nREQUIRED \nSKILLS \n \n2.2 Duties are allocated \nhaving regard to \nindividual \npreference, \ndomestic and \npersonal \nconsiderations, \nwhenever possible \nresponsibilities of \neach team \nmember \n2.6 Knowledge in \nidentifying each \nteam member \nduties and \nresponsibilities  \n3. Set \nperformance \nexpectations \nfor team \nmembers \n3.1 Performance \nexpectations are \nestablished based \non client needs and \naccording to \nassignment \nrequirements \n3.2 Performance \nexpectations are \nbased on individual \nteam members \nduties and area of \nresponsibility \n3.3 Performance \nexpectations are \ndiscussed and \ndisseminated to \nindividual team \nmembers \n3.1 Definition of \nperformance \nindicators/ criteria \n3.2 Definition of team \ngoals and \nexpectations \n3.3 Methods of \nmonitoring \nperformance \n3.4 Client expectations \n3.5 Team members \nduties and \nresponsibilities \n3.6 Defining \nperformance \nexpectations \ncriteria \n3.1 Identifying \nperformance \nindicators \n3.2 Evaluating \nperformance \n3.3 Setting individual \nperformance target/ \nexpectation \nindicators \n4. Supervise \nteam \nperformance \n4.1 Monitoring of \nperformance takes \nplace against \ndefined performance \ncriteria and/or \nassignment \ninstructions and \ncorrective action \ntaken if required \n4.2 Team members are \nprovided with \nfeedback, positive \nsupport and advice \non strategies to \novercome any \ndeficiencies \n4.3 Performance \nissues which cannot \nbe rectified or \n4.1 Understanding, \nmonitoring of work \n4.2 How to undertake \ncorrective action \n4.3 Understanding \nfeedback and \nprocedure \n4.4 Feedback \nreporting \nprocedure \n4.5 Methods of \nmonitoring \nperformance \n4.6 Team member’s \nduties and \nresponsibilities \n4.7 Monitoring team \noperation to \nensure client \n4.1 Monitoring skills  \n4.2 Setting priorities \n4.3 Evaluating \nperformance \n4.4 Informal/ formal \ncounseling skill\n\n--- PDF PAGE 11 ---\nTESDA-SOP-QSO-01-F08\n \n \n \nSANITARY LANDFILL OPERATIONS NC III (Amended)   Promulgated June 16, 2015                                               -7- \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \n \nREQUIRED \nKNOWLEDGE \n \nREQUIRED \nSKILLS \naddressed within the \nteam are referenced \nto appropriate \npersonnel according \nto employer policy \n4.4 Team members are \nkept informed of any \nchanges in the \npriority allocated to \nassignments or \ntasks which might \nimpact on \nclient/customer \nneeds and \nsatisfaction \n4.5 Team operations are \nmonitored to ensure \nthat employer/client \nneeds and \nrequirements are \nmet \n4.6 Follow-up \ncommunication is \nprovided on all \nissues affecting the \nteam \n4.7 All relevant \ndocumentation is \ncompleted in \naccordance with \ncompany \nprocedures \nneeds and \nsatisfaction\n\n--- PDF PAGE 12 ---\nTESDA-SOP-QSO-01-F08\n \n \n \nSANITARY LANDFILL OPERATIONS NC III (Amended)   Promulgated June 16, 2015                                               -8- \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Work requirements \n1.1. Client Profile \n1.2. Assignment instructions \n2. Team member’s concerns \n2.1. Roster/shift details \n3. Monitor performance \n3.1. Formal process \n3.2. Informal process \n4. Feedback \n4.1. Formal process \n4.2. Informal process \n5. Performance issues \n5.1. Work output \n5.2. Work quality \n5.3. Team participation \n5.4. Compliance with workplace protocols \n5.5. Safety \n5.6. Customer service \n \n \nEVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency  \nAssessment requires evidence that the candidate: \n1.1. Maintained or improved individuals and/or team \nperformance given a variety of possible scenario \n1.2. Assessed and monitored team and individual \nperformance against set criteria \n1.3. Represented concerns of a team and individual to next \nlevel of management or appropriate specialist and to \nnegotiate on their behalf \n1.4. Allocated duties and responsibilities, having regard to   \nindividual’s knowledge, skills and aptitude and the \nneeds of the tasks to be performed \n1.5. Set and communicated performance expectations for a \nrange of tasks and duties within the team and provided \nfeedback to team members \n2. Resource \nImplications \nThe following resources should be provided: \n2.1. Access to relevant workplace or appropriately \nsimulated environment where assessment can take \nplace \n2.2. Materials relevant to the proposed activity or task \n \n3. Methods of \nAssessment \nCompetency in this unit may be assessed through: \n3.1. Written Examination \n3.2. Oral Questioning  \n3.3. Portfolio \n4. Context for \nAssessment \n4.1. Competency assessment may occur in workplace or \nany appropriately simulated environment \n4.2. Assessment shall be observed while task are being \nundertaken whether individually or in-group\n",
