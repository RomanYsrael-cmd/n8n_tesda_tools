design is based on competency standards set by the industry or recognized\nindustry sector; (Learning system is driven by competencies written to industry\nstandards)\n\nb. Training delivery is learner-centered and should accommodate individualized and\nself-paced learning strategies;\n\nc. Training can be done on an actual workplace setting, simulation of a workplace\nand/or through adoption of modern technology.\n\nd. Assessment is based in the collection of evidence of the performance of work to the\nindustry required standards;\n\ne. Assessment of competency takes the trainee’s knowledge and attitude into account\nbut requires evidence of actual performance of the competency as the primary\nsource of evidence.\n\nf. Training program allows for recognition of prior learning (RPL) or current\ncompetencies;\n\ng. Training completion is based on satisfactory performance of all specified\ncompetencies.\n\n2. The competency-based TVET system recognizes various types of delivery modes, both\non-and off-the-job as long as the learning is driven by the competency standards\nspecified by the industry. The following training modalities and their\nvariations/components may be adopted singly or in combination with other modalities\nwhen designing and delivering training programs:\n\n2.1.\nInstitution- Based:\n\n• The traditional classroom-based or in-center instruction may be enhanced\nthrough use of learner-centered methods as well as laboratory or field-work\ncomponents.\n\n--- PDF PAGE 72 ---\nSANITARY LANDFILL OPERATIONS NC III (Amended) Promulgated June 16, 2015 -66-\n\n3.3 TRAINEE ENTRY REQUIREMENTS\n\nTrainees or students wishing to gain entry into these qualifications should possess the\nfollowing requirements:\n\n• Can communicate in both oral and written form\n• Must be at least ten (10) years of basic education and/or;\n• Must have a 1 year work experience in a sanitary landfill operations\n\nThis list does not include specific institutional requirements such as educational attainment,\nappropriate work experience, and others that may be required of the trainees by the school or\ntraining center delivering the TVET program\n\n--- PDF PAGE 73 ---\nSANITARY LANDFILL OPERATIONS NC III (Amended) Promulgated June 16, -67-\n\n3.4 LIST OF TOOL, EQUIPMENT AND MATERIALS\nSANITARY LANDFILL OPERATIONS NC III\n\nRecommended list of tools, equipment and materials for the training of a maximum of 25\ntrainees for SANITARY LANDFILL OPERATIONS NC III are as follows:\n\nTOOLS\nEQUIPMENT\nMATERIALS\nQTY.\nITEM\nQTY.\nITEM\nQTY.\nITEM\n25\nMask (surgical)\n\n1\nSafety shoes\n(steel-toe/sole)\n1 unit\nFire Extinguishers\n5\nMarking Pens\n25\nHardhats\n\n2\nWhite\nBoards/Blackboard\n25\nClothe Gloves with\nrubber linings\n\n3\nWhiteboard\nMarkers/Chalk\n1\nPPE Mask\n1\nLaptop\n2\nWhiteboard /\nBlackboard\nErasers\n\n1\nProjector Screen\n\n1\nLCD Projector\n\n1\nSound System\n(microphone,\namplifier, speaker\nsystem)\n\n1 set\nWaste\nclassification\ngallery\n\n1 set\nScale model/cross-\nsection SLF in 4\ncategories\n\nTraining Materials:\n\n• Republic Act 9003 –\nEcological Solid Waste\nManagement Act of\n2000\n• Republic Act 6969 –\nToxic and Hazardous\nWaste\n• Technical Guidebook on\nSolid Wastes Disposal\nDesign Operation &\nManagement\n• Guidebook for Safe\nClosure of Disposal\nSites\n\n•\nSLF Operations\nManual\n\n•\n Handouts/ Pop sheets\n\n--- PDF PAGE 74 ---\nSANITARY LANDFILL OPERATIONS NC III (Amended) Promulgated June 16, -68-\n3.5 TRAINING FACILITIES\n\nThe areas indicated here are indicative for a class size of 25 students/trainees. For a\nsmaller class size, they may be reduced, provided that there should be at least 1.0 sq. m. or more\nspace per trainee.\n\nSpace Requirement\nSize in Meters\nArea in Sq.\nMeters\nTotal Area in Sq.\nMeters\nLecture Area\n8 x 5 m\n40 sq. meter\n40 sq. meter\nLearning Resource Area\n8x5 m\n40 sq. meter\n40 sq. meter\nFacilities/Equipment/Circulation\nArea\n\n30 sq. meter\nSLF(own or access to)\nCategory 3\n(min)\n(per DENR\napproved design)\n(per DENR\napproved design)\nWash Area\n\n30 sq. meter\n\nTotal workshop\narea\n140 ++sq. meter\n\n3.6 TRAINER’S QUALIFICATIONS FOR SANITARY LANDFILL OPERATIONS NC III\n\nTRAINER QUALIFICATION\n•\nMust be a holder of NTTC Level I in Sanitary Landfill Operations NC III\n•\nMust be able to communicate in English and Filipino/vernacular;\n•\nMust have at least 3-5 years relevant SLF industry experience; and\n•\nMust have attended relevant training and seminars on SLF operations.\n\n3.7 INSTITUTIONAL ASSESSMENT\n\nInstitutional assessment is undertaken by trainees to determine their achievement of units\nof competency. A certificate of achievement is issued for all units of competency.\n\n The result of the institutional assessment may be considered as evidence for the\nassessment for national certification. As a matter of policy, graduates of programs registered\nwith TESDA under these training regulations are required to undergo mandatory national\ncompetency assessment upon completion of the program.\n\n--- PDF PAGE 75 ---\nSANITARY LANDFILL OPERATIONS NC III (Amended) Promulgated June 16, -69-"
