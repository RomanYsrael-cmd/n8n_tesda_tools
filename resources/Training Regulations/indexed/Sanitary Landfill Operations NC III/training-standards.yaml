  "source_section_text": "SECTION 3 TRAINING ARRANGEMENTS\n\nThis set of standards provides Technical and Vocational Education and Training\n(TVET) providers with information and other important requirements to consider when\ndesigning training programs for SANITARY LANDFILL OPERATIONS NC III.\n\nThis includes information on curriculum design; training delivery; trainee entry\nrequirements, tools and equipment; training facilities; and trainer’s qualification and\ninstitutional assessment.\n\n3.1 CURRICULUM DESIGN\n\nCourse Title: SANITARY LANDFILL OPERATIONS\nNC Level: NC III\n\nNominal Training Duration: 28 hrs – Basic Competencies\n16 hrs – Common Competencies\n 116 hrs – Core Competencies\n 160 hrs – Total\nCourse Description:\n\nThis course is designed to enhance the knowledge, skills and attitude of Sanitary\nLandfill Operations in accordance to industry standards. It covers the basic, common, and\ncore competencies in managing in-coming waste in active cell and managing and\nmaintaining a closed sanitary landfill facility (SLF).\n\nThe training center has the option to partner with an operational SLF in providing\nfacilities and equipment in the conduct of training and assessment.\n\nTo obtain this, all units prescribed for this qualification must be achieved.\n\n--- PDF PAGE 54 ---\nSANITARY LANDFILL OPERATIONS NC III (Amended) Promulgated June 16, 2015 - 49-\nBASIC COMPETENCIES\n(28 Hours)\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Content\n(Required\nKnowledge)\nPractical Activities\n(Required Skills)\nMethodology\nAssessment\nApproach\nNominal\nDuration\n1. Lead workplace\ncommunication\n1.1. Communicate\ninformation about\nworkplace\nprocesses.\n1.2. Lead workplace\ndiscussions.\n1.3. Identify and\ncommunicate\nissues arising in\nthe workplace\n\n1.1. Communication\ns both in the\nformal and\ninformal\nmethods\n1.1.1. Verbal\n1.1.2. Written\n1.1.3. Wireless\n1.1.4. Non-verbal\n(standard signs\nand symbols of\nthe industry)\n1.2. Basic\nOrientati