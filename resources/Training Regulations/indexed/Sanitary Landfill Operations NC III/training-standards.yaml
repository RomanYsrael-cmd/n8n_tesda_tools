      "source_text": "3.3 TRAINEE ENTRY REQUIREMENTS\n\nTrainees or students wishing to gain entry into these qualifications should possess the\nfollowing requirements:\n\n• Can communicate in both oral and written form\n• Must be at least ten (10) years of basic education and/or;\n• Must have a 1 year work experience in a sanitary landfill operations\n\nThis list does not include specific institutional requirements such as educational attainment,\nappropriate work experience, and others that may be required of the trainees by the school or\ntraining center delivering the TVET program\n\n--- PDF PAGE 73 ---\nSANITARY LANDFILL OPERATIONS NC III (Amended) Promulgated June 16, -67-\n\n3.4 LIST OF TOOL, EQUIPMENT AND MATERIALS\nSANITARY LANDFILL OPERATIONS NC III\n\nRecommended list of tools, equipment and materials for the training of a maximum of 25\ntrainees for SANITARY LANDFILL OPERATIONS NC III are as follows:\n\nTOOLS\nEQUIPMENT\nMATERIALS\nQTY.\nITEM\nQTY.\nITEM\nQTY.\nITEM\n25\nMask (surgical)\n\n1\nSafety shoes\n(steel-toe/sole)\n1 unit\nFire Extinguishers\n5\nMarking Pens\n25\nHardhats\n\n2\nWhite\nBoards/Blackboard\n25\nClothe Gloves with\nrubber linings\n\n3\nWhiteboard\nMarkers/Chalk\n1\nPPE Mask\n1\nLaptop\n2\nWhiteboard /\nBlackboard\nErasers\n\n1\nProjector Screen\n\n1\nLCD Projector\n\n1\nSound System\n(microphone,\namplifier, speaker\nsystem)\n\n1 set\nWaste\nclassification\ngallery\n\n1 set\nScale model/cross-\nsection SLF in 4\ncategories\n\nTraining Materials:\n\n• Republic Act 9003 –\nEcological Solid Waste\nManagement Act of\n2000\n• Republic Act 6969 –\nToxic and Hazardous\nWaste\n• Technical Guidebook on\nSolid Wastes Disposal\nDesign Operation &\nManagement\n• Guidebook for Safe\nClosure of Disposal\nSites\n\n•\nSLF Operations\nManual\n\n•\n Handouts/ Pop sheets\n\n--- PDF PAGE 74 ---\nSANITARY LANDFILL OPERATIONS NC III (Amended) Promulgated June 16, -68-"
