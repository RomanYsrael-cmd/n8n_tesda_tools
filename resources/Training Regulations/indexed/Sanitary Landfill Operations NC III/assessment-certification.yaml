  "source_text": "SECTION 4 ASSESSSMENT AND CERTIFICATION ARRANGEMENT\n\nCompetency Assessment is the process of collecting evidence and making judgments\nwhether competency has been achieved. The purpose of assessment is to confirm that an\nindividual can perform to the standards expected at the workplace as expressed in relevant\ncompetency standards.\n\nThe assessment process is based on evidence or information gathered to prove\nachievement of competencies. The process may be applied to an employable unit(s) of\ncompetency in partial fulfillment of the requirements of the national qualification.\n\n4.1 NATIONAL ASSESSMENTAND CERTIFICATION ARRANGEMENTS\n\n4.1.1 To attain the National Qualification of SANITARY LANDFILL OPERATIONS NC\nIII, the candidate must demonstrate competence in all the units of competency\nlisted in Section 1. Successful candidates shall be awarded a National Certificate\nsigned by the Director General.\n\n4.1.2 Assessment shall focus on the core units of competency. The basic and common units\nshall be integrated or assessed concurrently with the core units.\n\n4.1.3 The following are qualified to apply for assessment and certification:\n\n- Graduates of training programs related to waste management\n- Experienced workers in sanitary landfill facilities and operations\n\n4.1.4 Reassessment is allowed only after one month from the date of assessment.\nReassessment for a National Certificate shall be done only on the task/s that the\ncandidate did not successfully achieve.\n\n4.1.5 A candidate who fails the assessment for two (2) consecutive times will be required to\ngo through a refresher course before taking another assessment.\n\n4.1.6 Only certified individuals in this Qualification may be nominated by the industry sector\nfor accreditation as competency assessor.\n\n4.2 COMPETENCY ASSESSMENT REQUISITE\n4.2.1\nSelf-Assessment Guide. The self-assessment guide (SAG) is accomplished by the\ncandidate prior to actual competency assessment. SAG is a pre-assessment tool\nto help the candidate and the assessor determine what evidence is available,\nwhere gaps exist, including readiness for assessment.\n\n This document can:\na. Identify the candidate’s skills and knowledge\nb. Highlight gaps in candidate’s skills and knowledge\n\n--- PDF PAGE 76 ---\nSANITARY LANDFILL OPERATIONS NC III (Amended) Promulgated June 16, -70-\nc. Provide critical guidance to the assessor and candidate on the evidence that\nneed to be presented\nd. Assist the candidate to identify key areas in which practice is needed or\nadditional information or skills that should be gained prior\n\n4.2.2\nAccredited Assessment Center. Only Assessment Center accredited by TESDA is\nauthorized to conduct competency assessment. Assessment centers undergo a\nquality assured procedure for accreditation before they are authorized by TESDA\nto manage the assessment for National Certification.\n4.2.3\nAccredited Competency Assessor. Only accredited competency assessor is\nauthorized to conduct assessment of competence. Competency assessors\nundergo a quality assured system of accreditation procedure before they are\nauthorized by TESDA to assess the competencies of candidates for National\nCertification.\n\n--- PDF PAGE 77 ---\nSANITARY LANDFILL OPERATIONS NC III (Amended) Promulgated June 16, -71-\n\n"
