      "number": "4.1",
      "text": "NATIONAL ASSESSMENTAND CERTIFICATION ARRANGEMENTS 4.1.1 To attain the National Qualification of SANITARY LANDFILL OPERATIONS NC III, the candidate must demonstrate competence in all the units of competency listed in Section 1. Successful candidates shall be awarded a National Certificate signed by the Director General. 4.1.2 Assessment shall focus on the core units of competency. The basic and common units shall be integrated or assessed concurrently with the core units. 4.1.3 The following are qualified to apply for assessment and certification: - Graduates of training programs related to waste management - Experienced workers in sanitary landfill facilities and operations 4.1.4 Reassessment is allowed only after one month from the date of assessment. Reassessment for a National Certificate shall be done only on the task/s that the candidate did not successfully achieve. 4.1.5 A candidate who fails the assessment for two (2) consecutive times will be required to go through a refresher course before taking another assessment. 4.1.6 Only certified individuals in this Qualification may be nominated by the industry sector for accreditation as competency assessor."
