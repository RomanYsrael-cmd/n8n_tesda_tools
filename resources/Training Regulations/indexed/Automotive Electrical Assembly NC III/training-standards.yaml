    "source_text": "3.1 CURRICULUM DESIGN\n\nCourse Title: AUTOMOTIVE ELECTRICAL ASSEMBLY NC Level NC III\n\nNominal Training Duration:\n20 Hours (Basic Competencies)\n\n20 Hours (Common Competencies)\n200 Hours (Core Competencies)\nCourse Description:\n\nThis course is designed to enhance the knowledge, skills and attitudes of an\nindividual in the field of automotive manufacturing in accordance with industry standards.\nIt covers core competencies such as; Rectify faults on installed electrical parts to engine\nassembly; Rectify faults on installed electrical parts and electronic units to body interior\ncompartment; Rectify faults on installed electrical parts and electronic units to dash\ninstrument panel; Rectify faults on installed electrical parts to exterior and engine\ncompartment; and Rectify faults on installed audio and video system to automotive\nvehicle\n\nThis course is also designed to enhance the basic and common knowledge,\nskills and attitudes of an individual in the field of automotive mechanical assembly.\n\nTo obtain this, all units prescribed for this qualification must be achieved.\n\nBASIC COMPETENCIES\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Lead workplace\ncommunication\n1.1 Communicate information\nabout workplace processes.\n1.2 Lead workplace discussions.\n1.3 Identify and communicate\nissues arising in the\nworkplace\n• Group\ndiscussion\n• Role Play\n• Brainstorming\n\n• Observation\n• Interviews\n2. Lead small\nteams\n2.1 Provide team leadership.\n2.2 Assign responsibilities\namong members.\n2.3 Set performance expectation\nfor team members.\n\n2.4 Supervise team performance\n• Lecture\n• Demonstration\n• Self-paced\n(modular)\n• Demonstration\n• Case studies\n3. Develop and\npractice\nnegotiation\nskills\n3.1 Identify relevant information\nin planning negotiations\n3.2 Participate in negotiations\n3.3 Document areas for\nagreement\n• Direct\nobservation\n• Simulation\n/\nrole playing\n• Case studies\n• Written test\n• Practical/\nperformance\ntest\n\n--- PDF PAGE 66 ---\nTR AUTOMOTIVE ELECTRICAL ASSEMBLY NC III\n\n57\n4. Solve\nworkplace\nproblem related\nto work\nactivities\n4.1 Explain the analytical\ntechniques.\n4.2 Identify the problem.\n4.3 Determine the possible\ncause/s of the problem.\n• Direct\nobservation\n• Simulation/role\nplaying\n•\nCase studies\n• Written test\n• Practical/\nperformance\ntest\n5. Use\nmathematical\nconcepts and\ntechniques\n5.1 Identify mathematical tools\nand techniques to solve\nproblem\n5.2 Apply mathematical\nprocedures/solution\n5.3\nAnalyze results\n• Direct\nobservation\n• Simulation/rol\ne playing\n• Case studies\n• Written test\n• Practical/\nperformance\ntest\n6. Use relevant\ntechnologies\n6.1 Identify appropriate\ntechnology\n6.2 Apply relevant technology\n6.3 Maintain/enhance relevant\ntechnology\n• Direct\nobservation\n• Simulation/rol\ne playing\n•\nCase studies\n• Written test\n• Practical/\nperformance\ntest\n\nCOMMON COMPETENCIES\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Perform\nmensuration and\ncalculation\n1.1 Select measuring instruments\n1.2 Carry out measurements and\ncalculation\n1.3 Maintain measuring\ninstruments\n• Lecture/\nDemonstration\n• Practical\nexercises\n• Simulation\n• Written test\n• Oral questioning\n• Direct\nobservation\n\n2. Read, interpret\nand apply\nengineering\nmanuals /\nspecifications\n2.1 Identify/access engineering\nmanuals / specification\n2.2 Interpret manual\n2.3 Apply information in manual\n2.4 Store manuals\n• Lecture/\nDemonstration\n• Dual training\n\n• Direct\nobservation\n• Interview\n3. Move and\nposition vehicle\n3.1 Prepare vehicle for driving\n3.2 Move and position vehicle\n3.3 Check the vehicle\n• Lecture/\nDemonstration\n• Practical\nexercises\n• Simulation\n• Written test\n• Oral questioning\n• Direct\nobservation\n\n--- PDF PAGE 67 ---\nTR AUTOMOTIVE ELECTRICAL ASSEMBLY NC III\n\n58\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n4. Apply\nappropriate\nsealant /\nadhesive\n4.1 Identify appropriate sealant/\nadhesive\n4.2 Prepare surface for sealant /\nadhesive application\n4.3 Store unused and dispose\nused sealant/adhesive\n• Lecture/\nDemonstration\n• Dual training\n• Distance\nlearning\n• Written test\n• Oral questioning\n• Direct\nobservation\n• Interview\n• Project method\n5. Perform shop\nmaintenance\n5.1 Inspect/clean tools and work\narea\n5.2 Store/arrange tools and shop\nequipment\n5.3 Dispose waste/used lubricants\n5.4 Report damaged\ntools/equipment\n• Lecture/\nDemonstration\n• Dual training\n• Self-paced\n(modular)\n\n• Written test\n• Direct\nobservation\n• Interview\n• Practical\nexercises\n\nCORE COMPETENCIES\n(200 Hours)\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Rectify faults on\nInstalled\nelectrical parts to\nengine assembly\n1.1 Plan and prepare work\n1.2 Diagnose and rectify\nelectrical faults\n1.3 Clean up work area\n\n• Lecture/\nDemonstration\n• Dualized\ntraining\n\n• Observation\nwith\nquestioning\n• Demonstration\nwith\nquestioning\n• Written test\n•\nPortfolio\n2. Rectify faults on\ninstalled\nelectrical parts\nand electronic\nunits to body\nInterior\ncompartment\n2.1 Plan and prepare work\n2.2 Diagnose and rectify\nelectrical faults\n2.3 Clean up work area\n• Lecture/\nDemonstration\n• Dualized\ntraining\n\n• Observation\nwith\nquestioning\n• Demonstration\nwith\nquestioning\n• Written test\n• Portfolio\n3. Rectify faults on\ninstalled\nelectrical parts\nand electronic\nunits to dash\ninstrument panel\n3.1 Plan and prepare work\n3.2 Diagnose and rectify\nelectrical faults\n3.3 Clean up work area\n• Lecture/\nDemonstration\n• Dualized\ntraining\n\n• Observation\nwith\nquestioning\n• Demonstration\nwith\nquestioning\n• Written test\n•\nPortfolio\n4. Rectify faults on\n4.1 Plan and prepare work\n•\nLecture/\n•\nObservation\n\n--- PDF PAGE 68 ---\nTR AUTOMOTIVE ELECTRICAL ASSEMBLY NC III\n\n