the industry. The following training modalities\nmay be adopted when designing training programs:\n\n• The dualized mode of training delivery is preferred and recommended. Thus\nprograms would contain both in-school and in-industry training or fieldwork\ncomponents. Details can be referred to the Dual Training System (DTS)\nImplementing Rules and Regulations.\n• Modular/self-paced learning is a competency-based training modality wherein\nthe trainee is allowed to progress at his own pace. The trainer facilitates the\ntraining delivery\n• Peer teaching/mentoring is a training modality wherein fast learners are given\nthe opportunity to assist the slow learners.\n• Supervised industry training or on-the-job training is an approach in training\ndesigned to enhance the knowledge and skills of the trainee through actual\nexperience in the workplace to acquire specific competencies prescribed in\nthe training regulations.\n• Distance learning is a formal education process in which majority of the\ninstruction occurs when the students and instructor are not in the same\nplace. Distance learning may employ correspondence study, or audio, video\nor computer technologies.\n\n--- PDF PAGE 70 ---\nTR AUTOMOTIVE ELECTRICAL ASSEMBLY NC III\n\n61\n3.3 TRAINEE ENTRY REQUIREMENTS\n\nTrainees or students should possess the following requirements:\n\n• can communicate both oral and written;\n• physically and mentally fit;\n• with experience in basic machining; and\n• must have undergone training in automotive electrical assembly NC II\n\nThis list does not include specific institutional requirements such as\neducational attainment, appropriate work experience, and others that may be\nrequired of the trainees by the school or training center delivering the TVET\nprogram.\n3.4 TOOLS, EQUIPMENT AND MATERIALS\nAUTOMOTIVE SERVICING – NC III\n\nRecommended list of tools, equipment and materials for the training of 20 trainees\nfor AUTOMTOIVE ELECTRICAL ASSEMBLY NC III\nTOOLS\nEQUIPMENT\nMATERIALS\nQty.\nDescription\nQty.\nDescription\nQty.\nDescription\n5\nsets\nHand Tools\n- Sockets\n(assorted)\n- Screw bits\n- Pliers\n- Screw drivers\n(+ / -)\n- Hammers\n- Extension\nsockets\n- Universal\nsockets\n\n2\nsets\n1 set\nLifting Equipment\n• Hoist (1 to 3 Tons)\n• Hangers and\ngears\n50 li.\n10 li\n5 tubes\n50 li\n\n50 li\n- Engine oil\n- Grease\n- Sealant /adhesive\n- Hydraulic oils/gear\n Oil\n- Automatic\n transmission fluid\n2\npcs\nImpact wrench\n¾ drive\n1\nunit\nForklift (2 to 3 Tons)\n1set\nParts for suspension\nassembly\n2\npcs\nImpact wrench\n½ drive\n2\nunits\nHand Pallet Truck\n1 set\nParts for power drive\nassembly\n2\npcs\nTorque wrench\n- click type\n1 set\nMechanized or\nmanual conveyors\n(optional)\n1 set\nParts for fuel tank\nassembly\n2\npcs\nTorque wrench\n– dial type\nI unit\nTow motor\n1 set\nParts for brake, clutch\nand pedal assembly\n2\nsets\nSpecial tools\n(assorted)\n1 set\nRobotic windshield\nsealer application\n(optional)\n1 set\nTrim parts and\ncomponents\n2\npcs\nRubber Mallet\n1 set\nWheel Alignment\nmachine\n1 set\nParts for radiator cooling\nassembly\n\n--- PDF PAGE 71 ---\nTR AUTOMOTIVE ELECTRICAL ASSEMBLY NC III\n\n62\n2\npcs\nPaint brush 1 in.\n1 set\nOil dispenser\n1 set\nParts for Air conditioning\nsystem\n1 set\nGrease gun\n1 set\nParts for bumpers\n\n1 set\nManual air and\nhydraulic pressurized\nlubrication\n1 set\nParts for wheel\nassembly\n\n1 lot Assorted Jigs/fixtures\n1 set\nParts for windshield and\ndoor glasses assembly\n\n1 set\nSealer gun –\npneumatic\n1 set\nParts for power drive\nsystem\n1 set\nJigs/fixtures\n1 set\nLubricants\n1 set\nSealants\n1 set\nAdhesives/tapes\n\n20\npairs\nGloves\n5 pcs.\nGoggles\n20pairs\nSafety shoes\n5 pcs.\nApron\n20pairs\nEar Plug\n\n5 pcs\nHard hat\n\n1 unit\nAutomotive vehicle body\n\n1 set\nTraining materials\n\npairs\nOffice supplies\n\nI lot\nHardware parts\n\n3.5 TRAINING FACILITIES\nAUTOMOTIVE ELECTRICAL ASSEMBLY NC III\n\nThe automotive workshop must be made of reinf