  "source_text": "SECTION 4 NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1 To attain the National Qualification of AUTOMOTIVE ELECTRICAL ASSEMBLY NC III,\nthe candidate must demonstrate competence through assessment covering all the\nunits of competency listed in Section 1. Successful candidates shall be awarded a\nNational Certificate signed by the TESDA Director General.\n\n4.2 Individual aspiring to be awarded the qualification of AUTOMOTIVE ELECTRICAL\nASSEMBLY NC III must acquire Certificates of Competency in all the following core\nunits of the Qualification. Candidates may apply for assessment in any accredited\nassessment center.\n\n4.2.1\nRectify Faults on Installed Electrical Parts to Engine Assembly\n4.2.2\nRectify Faults on Installed Electrical Parts and Electronic Units to Body\nInterior Compartment\n4.2.3\nRectify Faults on Installed Electrical Parts and Electronic Units to Dash\nInstrument Panel\n4.2.4\nRectify Faults on Installed Electrical Parts to Exterior and Engine\nCompartment\n4.2.5\nRectify Faults on Installed Audio and Video System to Automotive\nVehicle\n\n4.3 Accumulation and submission of all COCs acquired for the relevant units of\ncompetency comprising a qualification, an individual shall be issued the corresponding\nNational Certificate.\n\n4.4 Assessment shall focus on the core units of competency. The basic and common units\nshall be integrated or assessed concurrently with the core units.\n\n4.5 The following are qualified to apply for assessment and certification:\n\n4.5.1\nHolder of Foundry Molding NC II or equivalent qualification; or\n\n4.5.2\nGraduates of formal, non-formal and informal including enterprise-based\ntraining programs.\n\n4.5.3\nExperienced workers (wage employed or self employed)\n\n4.6 The guidelines on assessment and certification are discussed in detail in the\n“Procedures Manual on Assessment and Certification” and “Guidelines on the\nImplementation of the Philippine TVET Qualification and Certification System\n(PTQCS)”.\n\n--- PDF PAGE 74 ---\nTR AUTOMOTIVE ELECTRICAL ASSEMBLY NC III\n\n65\n\nCOMPETENCY MAP- AUTOMOTIVE SECTOR\nMANUFACTURING SUB SECTOR\n(PARTS ASSEMBLY)\nCOMMON\nCOMPETENCIES\nReceive and\nrespond workplace\ncommunication\nParticipate in\nworkplace\ncommunication\nLead in workplace\ncommunication\nUtilize specialist\ncommunication skills\nWork in team\nenvironment\nDevelop team\n and individual\nSolve workplace\nproblems related\nto work activities\nWork with Other\nLead small Team\nApply problem\nsolving techniques\nin the workplace\nPlan and\norganize work\nBASIC\nCOMPETENCIES\nAUTOMOTIVE ELECTRICAL ASSEMBLIES NC III\nLegend:\nCORE COMPETENCIES\nDemonstrate\nwork values\nPractice basic\n housekeeping\nprocedures\nPractice career\nprofessionalism\nPractice occupational\nhealth and safety\n procedures\nDevelop and\npractice negotiation\nskills\nUse mathematical\nconcepts and\n techniques\nUse relevant\n technologies\nPerform Mensuration\nand Calculation\nRead, Interpret and Apply\nEngineering Manual and\nSpecifications\nMove and Position\nVehicle\nApply Appropriate\nSealant/Adhesives\nInstall/Fit out Electrical\nParts to Engine\nAssembly\nANNEX A\nAssemble Mechanical\nAssemblies Using Jigs/\nFixtures\nMount/ Install Brake\nFuel System\nMount/ Install\nSuspension Drive\nSystem\nMount/ Install Power\nDrive System\nInstall/Fit Trim\nParts/Components\nPerform Final Engine\nRun\nPerform Wheel\nAlignment Operation\nPerform Shop\nMaintenance\nInstall/Fit out Electronic\nUnits to Body Interior\nComponents\nInstall/Fit out Electrical\nParts & Electronic Units to\nDash Board Instrument\nPanel\nInstall/Fit out Electrical\nParts to Exterior and\nEngine Compartment\nInstall/Fit out Audio and\nVideo Systems\nPerform Headlight\nFocus Aiming Operation\nPerform Engine Hot\nTest\nRectify Assembly Faults\non Assembled\nMechanical Assemblies\nRectify Faults on\nMounted/Installed Brake\nand Fuel System\nRectify Faults on\nMounted/Installed\nPower Drive System\nRectify Faults on\nMounted/Installed\nSuspension Drive Train\nRectify Faults on\nInstalled electrical Parts\nto Engine Assembly\nRectify Faults on\nInstalled Electrical Parts\nand Electronic Units to\nBody Interior\nRectify Faults on\nInstalled Electrical Parts\nand Electronic Units to\nDash Instrument Panel\nRectify Faults on\nInstalled Electrical Parts\nto Exterior and Engine\nCompartment\nRectify Faults on\nInstalled Audio and\nVideo System\n\n--- PDF PAGE 75 ---\nTR AUTOMOTIVE ELECTRICAL ASSEMBLY NC III\n\n66\nDEFINITION OF TERMS\n1. Automotive\nVehicles\nThese are motor vehicles whose gross vehicle weight is equal or\nless than 3,500 kgs. Powered by a gas or diesel engine. It could be\na passenger car or a light utility vehicle\n\n2. Automotive\nElectrical\nAssembly\nTechnician\nRefers to an all around auto electrical assembly man that can\nperform all electrical assembly works from assembling of electrical\nassemblies to mounting and installation to automotive vehicle\nbody.\n\n3. Adhesives\nSubstance used to hold gasket in place during assembly. It also\nmaintains a tight seal by filling in small irregularities on a surface\nand prevents gasket from shifting due to vibration.\n4. Point of Fit\n\nRefers to the assembly area where parts / materials / assemblies\nare used or consumed\n5. Electronics\nElectrical assemblies, circuit and system that use electronic\ndevices such as transistors and diodes\n6. Hardware Parts\nRefers to bolts, nuts, screws, washers and other small parts\n7. Catalytic\nConverter\n\nEmission The control device fitted in the exhaust system of an\ninternal combustion engine. The converter reduces the toxicity of\nproducts of combustion by catalytic re-combination\n\n8. Assembly\nManuals\nReference\nmanuals\nwith\nillustration\nor\ndrawings\nof\nparts/components and its direction on how they are mounted or\ninstalled on the automotive vehicle or certain assemblies.\n\n9. Quality\nInspection\nManuals\nReference manuals with explanation on what quality standards\nhave to be maintained in the conduct of assembling automotive\nvehicle\n10. Work Order\n A work order is a form of instruction that is broadcasted either by\nmanual or by electronic system by preceding stations to the next\nstations regarding on what model sequence to produce on a timely-\nstructured manner.\n11. Job\nRequirements\nRefers to specific specifications of model/variant to be assembled.\n\n12. Standard\nOperation\n Sheet\nIs a listing of process elements arrange according to the assembly\nsequence for a given job requirements\n\n13. Fuel Injection\nAn electronic system that increases the performance ad fuel\neconomy because it monitors engine conditions and provides the\ncorrect air/fuel mixture based on the engine’s demand. It injects\nfuel directly into the cylinder head enabling more precise control\nover the quantity used.\n15. Jigs/fixtures\nKind of equipment that is used for sub-assembly operations in\norder to meet the desired dimensions and outcome of a certain\nassembly.\n\n--- PDF PAGE 76 ---\nTR AUTOMOTIVE ELECTRICAL ASSEMBLY NC III\n\n67\n\nACKNOWLEDGEMENT\n\nThe Technical Education and Skills Development Authority (TESDA) wishes to\nextend thanks and appreciation to the many representatives of business, industry,\nacademe and government agencies who rendered their time and expertise to the\ndevelopment and validation of this Training Regulation.\n\nTHE TECHNICAL AND INDUSTRY EXPERT PANEL\nAutomotive Electrical Assembly\nNMPI / CATC/PAFI\nAntonio A. Gimenez-\nExecutive Director -\nCATC/PAFI\n\nRodolfo T. Nunez-\nPlant Manager-Nissan\nMotors Phils. Inc.(NMPI)\nCATC/PAFI\n\nRene Torres\n(Labor Representative)\nNissan Motors Philippines\nWorkers Union-AIWA\nNissan TechnoPark Bo.\nPulong, Sta. Cruz Laguna\nMr. Valentino de Leon\nVP- Plant Administration-\nNMPI\nEdgardo P. Zaragoza-\nPaint Shop Manager- NMPI\n(CATC/PAFI)\nCarina J. Bondad-\nAdministrative Support\nStaff, (CATC/PAFI)\n\nThe PARTICIPANTS in the National Validation of this Training Regulation\nROBERTS RADIATOR\nPILIPINAS HINO INC.\nNISSAN MOTOR PHILIPPINES\nINC.\nMembers of the TESDA Board\nThe MANAGEMENT and STAFF of the TESDA Secretariat\nTESDA EXCOM\nQualification and Standards Office\nFlorante P. Inoturan\nAgnes P. Panem\nAbel B. Elpedes"
