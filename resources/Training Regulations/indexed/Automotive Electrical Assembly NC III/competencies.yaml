        "source_text": "500311114\n\nUNIT DESCRIPTOR : This unit of competency covers the knowledge, skills, and\nattitude required in selecting, sourcing and applying\nappropriate and affordable technologies in the workplace.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n\n1. Study/select\nappropriate\ntechnology\n\n1.1 Usage of different technologies is determined based on job\nrequirements\n1.2 Appropriate technology is selected as per work\n specification\n\n2. Apply relevant\ntechnology\n\n2.1 Relevant technology is effectively used in carrying\n out function\n2.2 Applicable software and hardware are used as per\n task requirement\n2.3 Management concepts are observed and practiced as per\nestablished industry practices\n\n3.\nMaintain/enhanc\ne of relevant\ntechnology\n\n3.1 Maintenance of technology is applied in accordance with the\nindustry standard operating procedure, manufacturer’s\noperating guidelines and occupational health and safety\nprocedure to ensure its operative ability\n3.2 Updating of technology is maintained through continuing\neducation or training in accordance with job requirement\n3.3 Technology failure/ defect is immediately reported to the\nconcern/responsible person or section for appropriate\naction\n\n--- PDF PAGE 23 ---\nTR AUTOMOTIVE ELECTRICAL ASSEMBLY NC III\n\n19\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Technology\nMay include but are not limited to:\n1.1 Office technology\n1.2 Industrial technology\n1.3 System technology\n1.4 Information technology\n1.5 Training technology\n2. Management\nconcepts\nMay include but not limited to:\n2.1 Real Time Management\n2.2 KAIZEN or continuous improvement\n2.3 5s\n2.4 Total Quality Management\n2.5 Other management/productivity tools\n3. Industry standard\noperating\nprocedure\n3.1 Written guidelines relative to the usage of office\ntechnology/equipment\n3.2 Verbal advise/instruction from the co-worker\n4. Manufacturer’s\noperating\nguidelines/\ninstructions\n4.1 Written instruction/manuals of specific technology/ equipment\n4.2 General instruction manual\n4.3 Verbal advise from manufacturer relative to the operation of\nequipment\n5. Occupational\nhealth and safety\nprocedure\n5.1 Relevant statutes on OHS\n5.2 Company guidelines in using\n technology/equipment\n6. Appropriate\naction\n6.1 Implementing preventive maintenance schedule\n6.2 Coordinating with manufacturer’s technician\n\n--- PDF PAGE 24 ---\nTR AUTOMOTIVE ELECTRICAL ASSEMBLY NC III\n\n20\nEVIDENCE GUIDE\n\n2 1. Critical aspects\nof competency\nAssessment requires evidence that the candidate:\n1.1 Studied and selected appropriate technology consistent with\nwork requirements\n1.2 Applied relevant technology\n1.3 Maintained and enhanced operative ability of relevant\ntechnology\n2. Underpinning\nknowledge\n2.1 Awareness on technology and its function\n2.2 Repair and maintenance procedure\n2.3 Operating instructions\n2.4 Applicable software\n2.5 Communication techniques\n2.6 Health and safety procedure\n2.7 Company policy in relation to relevant technology\n2.8 Different management concepts\n2.9 Technology adaptability\n3. Underpinning\nskills\n3.1 Relevant technology application/implementation\n3.2 Basic communication skills\n3.3 Software applications skills\n3.4 Basic troubleshooting skills\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Relevant technology\n4.2 Interview and demonstration questionnaires\n4.3 Assessment packages\n5. Method of\nassessment\nCompetency must be assessed through:\n5.1 Interview\n5.2 Actual demonstration\n5.3 Authenticated portfolio (related certificates of\ntraining/seminar)\n6. Context of\nassessment\n6.1 Competency may be assessed in actual workplace or\nsimulated environment\n\n--- PDF PAGE 25 ---\nTR AUTOMOTIVE ELECTRICAL ASSEMBLY NC III\n\n21\n\nCOMMON COMPETENCIES\n\nUNIT OF COMPETENCY :\nPERFORM MENSURATION AND CALCULATION\n\nUNIT CODE\n:"
