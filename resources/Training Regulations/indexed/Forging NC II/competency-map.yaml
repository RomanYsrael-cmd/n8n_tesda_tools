  "source_text": "Section 1. Successful candidates\nshall be awarded a National Certificate signed by the TESDA Director General.\n\n4.2 Individual aspiring to be awarded the qualification of FORGING NC II must\ndemonstrate competency in all the following core units of the Qualification through a\nsingle project-type assessment. Candidates may apply for assessment in any\naccredited assessment center.\n\n4.2.1 Forge Basic Shapes\n Perform Hand Forging\n Perform Hammer Forging\n Perform Basic Incidental Heat/Quenching Tampering and Annealing\n\n4.3 Assessment shall focus on the core units of competency. The basic and common\nunits shall be integrated or assessed concurrently with the core units.\n\n4.4 The following are qualified to apply for assessment and certification:\n\n4.4.1 Graduates of formal, non-formal and informal including\nenterprise-based training programs.\n\n4.4.2 Experienced workers (wage employed or self-employed)\n\n4.5 The guidelines on assessment and certification are discussed in detail in the\nProcedures Manual on Assessment and Certification and Guidelines on the\nImplementation of the Philippine TVET Qualification and Certification System\n(PTQCS).\n\n--- PDF PAGE 46 ---\n________________________________________________________________________________________________________________\nTR - FORGING NC II Promulgated\n 44\n\nCOMPETENCY MAP- AUTOMOTIVE SECTOR\nMANUFACTURING SUB-SECTOR\nANNEX A\nFORGING NCII\nLegend:\nCOMMON\nCOMPETENCIES\nReceive and\nrespond workplace\ncommunication\nParticipate in\nworkplace\ncommunication\nLead in workplace\ncommunication\nUtilize specialist\ncommunication skills\nWork in team\nenvironment\nDevelop team\n and individual\nSolve workplace\nproblems related\nto work activities\nWork with Other\nLead small Team\nApply problem\nsolving techniques\nin the workplace\nPlan and\norganize work\nBASIC\nCOMPETENCIES\nDemonstrate\nwork values\nPractice basic\n housekeeping\nprocedures\nPractice career\nprofessionalism\nPractice occupational\nhealth and safety\n procedures\nDevelop and\npractice negotiation\nskills\nUse mathematical\nconcepts and\n techniques\nUse relevant\n technologies\nRead & Interpret\nEngineering Drawings\nPerform Mensuration\nand Calculation\nRead, Interpret and\nApply Specifications\nand Manuals\nPerform Shop\nMaintenance\n-\nCORE COMPETENCIES\nDevelop and\nManufacture Wood\nPattern\nDevelop and\nManufacture Polymer\nPattern\nDevelop and\nManufacture Assembled\nPlated Pattern\nDevelop and\nManufacture Production\nPattern\nPerform General\nWoodworking Machine\nOperations\nUse and Maintain\nMeasuring Instrument\nPrepare & Mix Sand for\nMetal Molding\nProduce Molds by Hand\nProduce Cores by Hand\nOperate Molding\nMachine\nOperate Core-Making\nMachine\nPour Molten Metal to\nMolds\nOperate Melting\nFurnaces (non-electric)\nOperate Cupola Melting\nFurnace\nOperate Electric\nInduction Melting\nFurnace\nFettle & Trim Metal\nCastings/Forgings\nPerform Refractory\nInstallation & Repair\nMelt Aluminum-\nSilicon Alloys for\nSafety Tested\nCastings\nMelt Metals Using\nCoreless Induction\nFurnace\nMelt Automotive Gray\nIron Castings in Cupola\nPrepare Sand Mixture\nfor Heavy Casting\nPour Molten Metal\nto Heavy Castings\n\nManufacture and\ndevelop corebox for\nShell Core Box\nDevelop and\nManufacture Gear,\nConveyor Screw and\nDevelop Gravity Die\nCasting Mold\nUse Comparison and Basic\nMeasuring Devices\nMeasure Components\nUsing Coordinate\nMeasuring Machines\nUse Graphical Techniques\nand Perform Simple\nStatistical Computations\nConduct Product\nand/or Process\nCapability Studies\nMaintain/Supervise the\nApplication of Quality\nProcedures\nPerform Mechanical\nPress Forming\nOperation\nChange\nEquipment Dies\nPerform Press Machine\nSetting\nMachine Parts\nPerform Precision\nAssembly\nPerform Mechanical\nShearing Operation\nApply Quality\nSystems\nPerform Hand Forging\nPerform Hammer Forging\nPerform Basic Incidental\nHeat/Quenching,\nTempering and\nAnnealing\nHammer Forge\nComplex Shapes\nPerform Drop and Upset\nForging\nSelect Heat\nTreatment Process\nPerform Heat\nTreatment Process\nHand Forge Complex\nShapes\nPerform Hand Molding\nto Produce Heavy\nCasting\nProduce Injection\nMolded Products\nProduce Blow\nMolded Products\nPrepare and Start\nEquipment for\nProduction\nSelect and Control\nInspection Processes\nand Procedures\nPerform Precision\nMechanical\nMeasurement\nCalibrate Measuring\nEquipment\nPerform Inspection\nPerform Engineering\nMeasurement\nPerform Basic\nStatistical Quality\nControl\nUse Improvement\nProcesses in Team\nActivities\nOperate injection\nMolding Equipment\nPrepare Materials for\nFormulae\n\nAssemble Materials and\nEquipment for\nProduction\nOperate Blow Molding\nEquipment\nPrepare Molds for\nComposites Production\nMonitor Process\nOperations\nFinish Products and\nComponents\n\n--- PDF PAGE 47 ---\n________________________________________________________________________________________________________________\nTR - FORGING NC II Promulgated\n\n45\nDEFINITION OF TERMS (FORGING)\n\n1. Forging\nForging is the term for shaping metal by using localized\ncompressive forces\n2. Cold forging\n\nCold forging is done at room temperature or near room\ntemperature.\n3. Hot forging\nHot forging is done at a high temperature, which makes\nmetal easier to shape and less likely to fracture.\n4. Warm forging\nWarm forging is done at intermediate temperature between\nroom temperature and hot forging temperatures.\n5. Hammer forging\nIn modern times, industrial forging is done either with\npresses or with hammers powered by compressed air,\nelectricity, hydraulics or steam. These hammers are large,\nhaving reciprocating weights in the thousands of pounds.\nSmaller power hammers, 500 lb (230 kg) or less\nreciprocating weight, and hydraulic presses are common in\nart smithies as well. Steam hammers are becoming\nobsolete.\n6. Open-die forging\nOpen-die forging is also known as smith forging.In open-die\nforging a hammer comes down and deforms the workpieces,\nwhich is placed on a stationary anvil. Open-die forging gets\nits name from the fact that the dies (the working surfaces of\nthe forge that contract the workpiece) do not enclose the\nworkpiece, allowing it to flow except where contacted by the\ndies. Therefore the operator needs to orient and position the\nworkpiece to get the desired shape. The dies are usually flat\nin shape, but some have a specially shaped surface for\nspecialized operations. For instance, the die may have a\nround, concave, or convex surface or be a tool to form holes\nor be a cut-off tool.\n7. Impression-die\nforging\nImpression-die forging is also called closed-die forging. In\nimpression-die work metal is placed in a die resembling a\nmold, which is attached to the anvil. Usually the hammer die\nis shaped as well. The hammer is then dropped on the\nworkpiece, causing the metal to flow and fill the die cavities.\nThe hammer is generally in contact with the workpiece on\nthe scale of milliseconds. Depending on the size and\ncomplexity of the part the hammer may be dropped multiple\ntimes in quick succession.\n8. Flash\nExcess metal is squeezed out of the die cavities; this is\ncalled flash. The flash cools more rapidly than the rest of\nthe material; this cool metal is stronger than the metal in the\n\n--- PDF PAGE 48 ---\n________________________________________________________________________________________________________________\nTR - FORGING NC II Promulgated\n\n46\ndie so it helps prevent more flash from forming. This also\nforces the metal to completely fill the die cavity. After forging\nthe flash is trimmed off\n9. Press forging\nPress forging is variation of drop-hammer forging. Unlike\ndrop-hammer forging, press forges work slowly by applying\ncontinuous pressure or force. The amount of time the dies\nare in contact with the workpiece is measured in seconds\n(as compared to the milliseconds of drop-hammer forges).\nThe press forging operation can be done either cold or hot.\n10. Upset forging\nUpset forging increases the diameter of the workpiece by\ncompressing its length.] Based on number of pieces\nproduced this is the most widely used forging process. A few\nexamples of common parts produced using the upset forging\nprocess are engine valves, couplings, bolts, screws, and\nother fasteners.\n\n--- PDF PAGE 49 ---\n________________________________________________________________________________________________________________\nTR - FORGING NC II Promulgated\n\n47\nACKNOWLEDGEMENT\n\nThe Technical Education and Skills Development Authority (TESDA) wishes to\nextend thanks and appreciation to the many representatives of business, industry,\nacademe and government agencies who rendered their time and expertise to the\ndevelopment and validation of this Training Regulation.\n\nTHE TECHNICAL AND INDUSTRY EXPERT PANEL\nFORGING\nAntonio A. Gimenez\nPhilippine Automotive\nFederation, Inc. (PAFI)\nCesar R. Leal\nPhilippine Automotive\nFederation, Inc. (PAFI)\nElmo N. Serbito\nPAFI (Samahan ng mga\nManggagawang Supercast)\n\nCarina J. Bondad\n(Administrative Staff)\nThe PARTICIPANTS in the National Validation of this Training Regulation\n• (Supercast Foundry &\nMachinery Corp.\nSFMC)\n\n• Philippine Aluminum Wheels\nInc. (PAWI)\n\n• Toyota Auto Parts Phils. Inc.\n\nMembers of the TESDA Board\nThe MANAGEMENT and STAFF of the TESDA Secretariat\nTESDA EXCOM\nQualification and Standards Office\nFlorante P. Inoturan\nAgnes P. Panem\nAbel B. Elpedes"
