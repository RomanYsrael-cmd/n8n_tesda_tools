        "source_text": "ALT722301\n\nUNIT DESCRIPTOR\n:\nThis unit covers using hand tools and formers, applying\nhand forging techniques and operating heat treatment\nequipment. The unit applies to hand forging low to medium\ncarbon and alloy steels using a variety of techniques, tools,\nformers and heating devices.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n\n1. Select material\n\n1.1 Job requirements are determined from engineering drawing,\njob sheet or verbal instructions\n1.2 Material calculations are made using volumes and weights\nthat include provision for oxidization and shrinkage.\n1.3 Material is selected according to the requirements of the job.\n\n2. Use hand tools\nand formers\n\n2.1 Hand tools and formers are selected for specific forging\ntechniques.\n2.2 Hand tools and formers are used according to the hand\nforging technique selected.\n\n3. Operate heating\nequipment\n\n3.1 Heating equipment is set up and operated in accordance\nwith company procedures and/or manufacturer’s instruction.\n3.2 Equipment is operated in a manner that minimizes\noxidization.\n3.3 Heat is controlled to specified areas.\n\n4. Hand-forge articles\n\n4.1 Hand forging technique is selected and applied according to\nthe requirements of the job\n4.2 Material is hand-forged to produce articles to specification.\n4.3 Forging temperatures and heat specifications are adhered to\nfor various materials.\n4.4 Allowance is made for material shrinkage and oxidization\nbased on the requirements of the job.\n\n--- PDF PAGE 30 ---\n________________________________________________________________________________________________________________\nTR - FORGING NC II Promulgated\n\n28\nRANGE OF VARIABLE\n\nVARIABLE\nRANGE\n1. Hand tools and\nformers\n\n1.1 Flatters\n1.2 Set hammers\n1.3 Hot/cold sets\n1.4 Ball peen hammer\n1.5 Swages\n2. Hand forging\ntechniques\n\n2.1 Drawing\n2.2 Swaging\n2.3 Bending\n2.4 Upsetting\n2.5 Spreading\n2.6 Punching\n2.7 Drifting\n3. Heating\nequipment\n\n3.1 Diesel\n3.2 Electric furnace\n3.3 Gas furnaces\n3.4 Coke fires\n3.5 Gaseous oxygen/fuel equipment\n4. Materials\n4.1 Low to medium carbon\n4.2 Alloy steels\n\n--- PDF PAGE 31 ---\n________________________________________________________________________________________________________________\nTR - FORGING NC II Promulgated\n\n29\nEVIDENCE GUIDE\n\n1. Critical aspect of\n competency\nAssessment requires evidence that the candidate\n1.1 Selected materials\n1.2 Selected and used hand tools and formers\n1.3 Determined correct forging temperatures\n1.4 Set-up and operated heating equipment\n1.5Hand-forged articles\n\n2. Underpinning\nknowledge and\nattitudes\n2.1 Types and properties of forging materials\n2.2 Different kinds of hand tools, formers used in hand forging\n2.3 Hand forging techniques (drawing, swaging, bending, upsetting,\nspreading, punching, drifting )\n2.4 How to calculate mean diameter, length, circumference\n2.5 Source of information on forging temperatures\n2.6 Heat specifications for various materials\n2.7 Effects of and allowances for material shrinkage and oxidization\n2.8 Application, set up, and means of adjustment of a range of\nheating equipment\n2.9 Use and application of personal protective equipment\n2.10 Safe work practices and procedures\n2.11 Hazards and control measures associated with hand forging,\nincluding housekeeping\n2.12 Use and application of personal protective equipment\n2.13 Safe work practices and procedures\n2.14\nHonesty and perseverance\n\n3. Underpinning\n skills\n\n3.1\nUsing hand tools and formers\n3.2\nSetting up and operating forging machines\n3.3\nFollowing job instructions, drawings, specifications\n3.4\nDetecting forging defects\n3.5\nRectifying forging techniques\n3.6\nSafely handling hot metal\n3.7\nCorrectly heating material being forged\n3.8\nCalculating volume and weight of material\n\n4. Resource\n implications\n\nThe following resources MUST be provided:\n3.6 Tools, equipment, materials and documentation required\nrelative to hand forging\n3.7 Job order, requisitions slip for materials\n3.8 Relevant workplace procedures, product and manufacturing\nspecifications, codes, standards, manuals and reference\nmaterials.\n\n5. Method of\nassessment\n\nCompetency MUST be assessed through:\n5.1 Observation with questioning\n5.2 Portfolio\n5.3 Third party report\n\n6. Context of\nassessment\n6.1 Assessment must be undertaken in accordance with\n the endorsed TESDA assessment guidelines\n6.2 Assessment may be conducted in the workplace or a\n simulated environment\n\n--- PDF PAGE 32 ---\n________________________________________________________________________________________________________________\nTR - FORGING NC II Promulgated\n\n30\nUNIT OF COMPETENCY :\nPERFORM HAMMER FORGING\n\nUNIT CODE\n\n:"
