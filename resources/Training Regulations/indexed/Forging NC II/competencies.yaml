  "source_section_text": "SECTION 2 COMPETENCY STANDARDS\n\nThis section gives the details of the contents of the basic, common and core units of\ncompetency required in FORGING NC II.\n\nBASIC COMPETENCIES\n\nUNIT OF COMPETENCY\n: PARTICIPATE IN WORKPLACE COMMUNICATION\nUNIT CODE\n\n: 500311105\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes required to\ngather, interpret and convey information in response to\nworkplace requirements.\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Obtain and\nconvey\nworkplace\ninformation\n1.1 Specific and relevant information is accessed from appropriate\nsources\n1.2 Effective questioning , active listening and speaking skills are\nused to gather and convey information\n1.3 Appropriate medium is used to transfer information and ideas\n1.4 Appropriate non- verbal communication is used\n1.5 Appropriate lines of communication with supervisors and\ncolleagues are identified and followed\n1.6 Defined workplace procedures for the location and storage of\ninformation are used\n1.7 Personal interaction is carried out clearly and concisely\n2. Participate in\nworkplace\nmeetings and\ndiscussions\n2.1 Team meetings are attended on time\n2.2 Own opinions are clearly expressed and those of others are\nlistened to without interruption\n2.3 Meeting inputs are consistent with the meeting purpose and\nestablished protocols\n2.4 Workplace interactions are conducted in a courteous manner\n2.5 Questions about simple routine workplace procedures and\nmaters concerning working conditions of employment are asked\nand responded to\n2.6 Meetings outcomes are interpreted and implemented\n3. Complete\nrelevant work\nrelated\ndocuments\n3.1 Range of forms relating to conditions of employment are\ncompleted accurately and legibly\n3.2 Workplace data is recorded on standard workplace forms and\ndocuments\n3.3 Basic mathematical processes are used for routine calculations\n3.4 Errors in recording information on forms/ documents are identified\nand properly acted upon\n3.5 Reporting requirements to supervisor are completed according to\norganizational guidelines\n\n--- PDF PAGE 5 ---\n________________________________________________________________________________________________________________\nTR - FORGING NC II Promulgated\n\n3\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Appropriate sources\n1.1\nTeam members\n1.2\nSuppliers\n1.3\nTrade personnel\n1.4\nLocal government\n1.5\nIndustry bodies\n2. Medium\n2.1\nMemorandum\n2.2\nCircular\n2.3\nNotice\n2.4\nInformation discussion\n2.5\nFollow-up or verbal instructions\n2.6\nFace to face communication\n3. Storage\n3.1\nManual filing system\n3.2\nComputer-based filing system\n4. Forms\n4.1\nPersonnel forms, telephone message forms, safety\nreports\n5. Workplace interactions\n5.1\nFace to face\n5.2\nTelephone\n5.3\nElectronic and two way radio\n5.4\nWritten including electronic, memos, instruction and\nforms, non-verbal including gestures, signals, signs\nand diagrams\n6. Protocols\n6.1\nObserving meeting\n6.2\nCompliance with meeting decisions\n6.3\nObeying meeting instructions\n\n--- PDF PAGE 6 ---\n________________________________________________________________________________________________________________\nTR - FORGING NC II Promulgated\n\n4\nEVIDENCE GUIDE\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Prepared written communication following standard format\nof the organization\n1.2 Accessed information using communication equipment\n1.3 Made use of relevant terms as an aid to transfer\ninformation effectively\n1.4 Conveyed information effectively adopting the formal or\ninformal communication\n2. Underpinning\nKnowledge and\nAttitudes\n\n2.1 Effective communication\n2.2 Different modes of communication\n2.3 Written communication\n2.4 Organizational policies\n2.5 Communication procedures and systems\n2.6 Technology relevant to the enterprise and the individual’s\nwork responsibilities\n3. Underpinning Skills\n3.1 Follow simple spoken language\n3.2 Perform routine workplace duties following simple written\nnotices\n3.3 Participate in workplace meetings and discussions\n3.4 Complete work related documents\n3.5 Estimate, calculate and record routine workplace\nmeasures\n3.6 Basic mathematical processes of addition, subtraction,\ndivision and multiplication\n3.7 Ability to relate to people of social range in the workplace\n3.8 Gather and provide information in response to workplace\nRequirements\n4. Resource\nImplications\n4.1 Fax machine\n4.2 Telephone\n4.3 Writing materials\n4.4 Internet\n5. Method of\nAssessment\n5.1 Direct Observation\n5.2 Oral interview and written test\n6. Context of\nAssessment\n6.1 Competency may be assessed individually in the actual\nworkplace or through accredited institution\n\n--- PDF PAGE 7 ---\n________________________________________________________________________________________________________________\nTR - FORGING NC II Promulgated\n\n5\n UNIT OF COMPETENCY :\nWORK IN TEAM ENVIRONMENT\n UNIT CODE\n :\n500311106\n UNIT DESCRIPTOR :\nThis unit covers the skills, knowledge and attitudes to\n\nidentify role and responsibility as a member of a team.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Describe team role\nand scope\n1.1\nThe role and objective of the team is identified from\navailable sources of information\n1.2\nTeam parameters, reporting relationships and\nresponsibilities are identified from team discussions and\nappropriate external sources\n2. Identify own role\nand responsibility\nwithin team\n2.1\nIndividual role and responsibilities within the team\nenvironment are identified\n2.2\nRoles and responsibility of other team members are\nidentified and recognized\n2.3\nReporting relationships within team and external to team\nare identified\n3. Work as a team\nmember\n3.1\nEffective and appropriate forms of communications used\nand interactions undertaken with team members who\ncontribute to known team activities and objectives\n3.2\nEffective and appropriate contributions made to\ncomplement team activities and objectives, based on\nindividual skills and competencies and workplace\ncontext\n3.3\nObserved protocols in reporting using standard operating\nprocedures\n3.4\nContribute to the development of team work plans based\non an understanding of team’s role and objectives and\nindividual competencies of the members.\n\n--- PDF PAGE 8 ---\n________________________________________________________________________________________________________________\nTR - FORGING NC II Promulgated\n\n6\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Role and objective\nof team\n1.1\nWork activities in a team environment with enterprise\nor specific sector\n1.2\nLimited discretion, initiative and judgment maybe\ndemonstrated on the job, either individually or in a team\nenvironment\n\n2. Sources of\ninformation\n2.1\nStandard operating and/or other workplace procedures\n2.2\nJob procedures\n2.3\nMachine/equipment manufacturer’s specifications and\ninstructions\n2.4\nOrganizational or external personnel\n2.5\nClient/supplier instructions\n2.6\nQuality standards\n2.7\nOHS and environmental standards\n3. Workplace context\n3.1\nWork procedures and practices\n3.2\nConditions of work environments\n3.3\nLegislation and industrial agreements\n3.4\nStandard work practice including the storage, safe\nhandling and disposal of chemicals\n3.5\nSafety, environmental, housekeeping and quality\nguidelines\n\n--- PDF PAGE 9 ---\n________________________________________________________________________________________________________________\nTR - FORGING NC II Promulgated\n\n7\n EVIDENCE GUIDE\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nOperated in a team to complete workplace activity\n1.2\nWorked effectively with others\n1.3\nConveyed information in written or oral form\n1.4\nSelected and used appropriate workplace language\n1.5\nFollowed designated work plan for the job\n1.6\nReported outcomes\n2. Underpinning\nKnowledge and\nAttitude\n2.1\nCommunication process\n2.2\nTeam structure\n2.3\nTeam roles\n2.4\nGroup planning and decision making\n3. Underpinning Skills\n3.1\nCommunicate appropriately, consistent with the culture\nof the workplace\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1\nAccess to relevant workplace or appropriately simulated\nenvironment where assessment can take place\n4.2\n Materials relevant to the proposed activity or tasks\n5. Method of\nAssessment\nCompetency may be assessed through:\n5.1\nObservation of the individual member in relation to the\nwork activities of the group\n5.2\nObservation of simulation and or role play involving the\nparticipation of individual member to the attainment of\norganizational goal\n5.3\nCase studies and scenarios as a basis for discussion of\nissues and strategies in teamwork\n6. Context of\nAssessment\n6.1\nCompetency may be assessed in workplace or in a\nsimulated workplace setting\n6.2\nAssessment shall be observed while task are being\nundertaken whether individually or in group\n\n--- PDF PAGE 10 ---\n________________________________________________________________________________________________________________\nTR - FORGING NC II Promulgated\n\n8\n\nUNIT OF COMPETENCY: PRACTICE CAREER PROFESSIONALISM\n\nUNIT CODE : 500311107\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes in promoting\ncareer growth and advancement.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1.\nIntegrate personal\nobjectives with\norganizational\ngoals\n1.1 Personal growth and work plans are pursued towards\nimproving the qualifications set for the profession\n1.2 Intra- and interpersonal relationships are maintained in the\ncourse of managing oneself based on performance\nevaluation\n1.3 Commitment to the organization and its goal is\ndemonstrated in the performance of duties\n2.\nSet and meet work\npriorities\n2.1 Competing demands are prioritized to achieve personal,\nteam and organizational goals and objectives.\n2.2 Resources are utilized efficiently and effectively to\nmanage work priorities and commitments\n2.3 Practices along economic use and maintenance of\nequipment and facilities are followed as per established\nprocedures\n3.\nMaintain\nprofessional growth\nand development\n3.1 Trainings and career opportunities are identified and\navailed of based on job requirements\n3.2 Recognitions are sought/received and demonstrated as\nproof of career advancement\n3.3 Licenses and/or certifications relevant to job and career\nare obtained and renewed\n\n--- PDF PAGE 11 ---\n________________________________________________________________________________________________________________\nTR - FORGING NC II Promulgated\n\n9\n RANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Evaluation\n1.1 Performance Appraisal\n1.2 Psychological Profile\n1.3 Aptitude Tests\n2. Resources\n2.1 Human\n2.2 Financial\n2.3 Technology\n2.3.1 Hardware\n2.3.2 Software\n3. Trainings and career\nopportunities\n3.1 Participation in training programs\n 3.1.1 Technical\n 3.1.2 Supervisory\n 3.1.3 Managerial\n 3.1.4 Continuing Education\n3.2 Serving as Resource Persons in conferences and\nworkshops\n4. Recognitions\n4.1 Recommendations\n4.2 Citations\n4.3 Certificate of Appreciations\n4.4 Commendations\n4.5 Awards\n4.6 Tangible and Intangible Rewards\n5. Licenses and/or\ncertifications\n5.1 National Certificates\n5.2 Certificate of Competency\n5.3 Support Level Licenses\n5.4 Professional Licenses\n\n--- PDF PAGE 12 ---\n________________________________________________________________________________________________________________\nTR - FORGING NC II Promulgated\n\n10\n\n EVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Attained job targets within key result areas (KRAs)\n1.2 Maintained intra - and interpersonal relationship in the\ncourse of managing oneself based on performance\nevaluation\n1.3 Completed trainings and career opportunities which are\nbased on the requirements of the industries\n1.4 Acquired and maintained licenses and/or certifications\naccording to the requirement of the qualification\n2. Underpinning\nKnowledge\n2.1 Work values and ethics (Code of Conduct, Code of Ethics,\netc.)\n2.2 Company policies\n2.3 Company operations, procedures and standards\n2.4 Fundamental rights at work including gender sensitivity\n2.5 Personal hygiene practices\n3. Underpinning Skills\n3.1 Appropriate practice of personal hygiene\n3.2 Intra and Interpersonal skills\n3.3 Communication skills\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1 Workplace or assessment location\n4.2 Case studies/scenarios\n5. Method of\nAssessment\nCompetency may be assessed through:\n5.1 Portfolio Assessment\n5.2 Interview\n5.3 Simulation/Role-plays\n5.4 Observation\n5.5 Third Party Reports\n5.6 Exams and Tests\n6. Context of\nAssessment\n6.1 Competency may be assessed in the work place or in a\nsimulated work place setting\n\n--- PDF PAGE 13 ---\n________________________________________________________________________________________________________________\nTR - FORGING NC II Promulgated\n\n11\n\nUNIT OF COMPETENCY: PRACTICE OCCUPATIONAL HEALTH AND SAFETY\nPROCEDURES\n\nUNIT CODE : 500311108\n\nUNIT DESCRIPTOR : This unit covers the outcomes required to comply with regulatory\nand organizational requirements for occupational health and\nsafety.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Identify hazards\nand risks\n1.1 Safety regulations and workplace safety and hazard control\npractices and procedures are clarified and explained based on\norganization procedures\n1.2 Hazards/risks in the workplace and their corresponding\nindicators are identified to minimize or eliminate risk to co-\nworkers, workplace and environment in accordance with\norganization procedures\n1.3 Contingency measures during workplace accidents, fire and\nother emergencies are recognized and established in\naccordance with organization procedures\n2. Evaluate hazards\nand risks\n2.1 Terms of maximum tolerable limits which when exceeded will\nresult in harm or damage are identified based on threshold limit\nvalues (TLV)\n2.2 Effects of the hazards are determined\n2.3 OHS issues and/or concerns and identified safety hazards are\nreported to designated personnel in accordance with workplace\nrequirements and relevant workplace OHS legislation\n3. Control hazards\nand risks\n3.1 Occupational Health and Safety (OHS) procedures for controlling\nhazards/risks in workplace are consistently followed\n3.2 Procedures for dealing with workplace accidents, fire and\nemergencies are followed in accordance with organization OHS\npolicies\n3.3 Personal protective equipment (PPE) is correctly used in\naccordance with organization OHS procedures and practices\n3.4 Appropriate assistance is provided in the event of a workplace\nemergency in accordance with established organization protocol\n\n4. Maintain OHS\nawareness\n4.1 Emergency-related drills and trainings are participated in as\nper established organization guidelines and procedures\n4.2 OHS personal records are completed and updated in\naccordance with workplace requirements\n\n--- PDF PAGE 14 ---\n________________________________________________________________________________________________________________\nTR - FORGING NC II Promulgated\n\n12\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Safety regulations\nMay include but are not limited to:\n1.1 Clean Air Act\n1.2 Building code\n1.3 National Electrical and Fire Safety Codes\n1.4 Waste management statutes and rules\n1.5 Philippine Occupational Safety and Health Standards\n1.6 DOLE regulations on safety legal requirements\n1.7 ECC regulations\n2. Hazards/Ri