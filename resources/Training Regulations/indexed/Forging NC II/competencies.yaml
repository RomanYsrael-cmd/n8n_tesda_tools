ations are adhered to\nfor various materials.\n4.4 Allowance is made for material shrinkage and oxidization\nbased on the requirements of the job.\n\n--- PDF PAGE 30 ---\n________________________________________________________________________________________________________________\nTR - FORGING NC II Promulgated\n\n28\nRANGE OF VARIABLE\n\nVARIABLE\nRANGE\n1. Hand tools and\nformers\n\n1.1 Flatters\n1.2 Set hammers\n1.3 Hot/cold sets\n1.4 Ball peen hammer\n1.5 Swages\n2. Hand forging\ntechniques\n\n2.1 Drawing\n2.2 Swaging\n2.3 Bending\n2.4 Upsetting\n2.5 Spreading\n2.6 Punching\n2.7 Drifting\n3. Heating\nequipment\n\n3.1 Diesel\n3.2 Electric furnace\n3.3 Gas furnaces\n3.4 Coke fires\n3.5 Gaseous oxygen/fuel equipment\n4. Materials\n4.1 Low to medium carbon\n4.2 Alloy steels\n\n--- PDF PAGE 31 ---\n________________________________________________________________________________________________________________\nTR - FORGING NC II Promulgated\n\n29\nEVIDENCE GUIDE\n\n1. Critical aspect of\n competency\nAssessment requires evidence that the candidate\n1.1 Selected materials\n1.2 Selected and used hand tools and formers\n1.3 Determined correct forging temperatures\n1.4 Set-up and operated heating equipment\n1.5Hand-forged articles\n\n2. Underpinning\nknowledge and\nattitudes\n2.1 Types and properties of forging materials\n2.2 Different kinds of hand tools, formers used in hand forging\n2.3 Hand forging techniques (drawing, swaging, bending, upsetting,\nspreading, punching, drifting )\n2.4 How to calculate mean diameter, length, circumference\n2.5 Source of information on forging temperatures\n2.6 Heat specifications for various materials\n2.7 Effects of and allowances for material shrinkage and oxidization\n2.8 Application, set up, and means of adjustment of a range of\nheating equipment\n2.9 Use and application of personal protective equipment\n2.10 Safe work practices and procedures\n2.11 Hazards and control measures associated with hand forging,\nincluding housekeeping\n2.12 Use and application of personal protective equipment\n2.13 Safe work practices and procedures\n2.14\nHonesty and perseverance\n\n3. Underpinning\n skills\n\n3.1\nUsing hand tools and formers\n3.2\nSetting up and operating forging machines\n3.3\nFollowing job instructions, drawings, specifications\n3.4\nDetecting forging defects\n3.5\nRectifying forging techniques\n3.6\nSafely handling hot metal\n3.7\nCorrectly heating material being forged\n3.8\nCalculating volume and weight of material\n\n4. Resource\n implications\n\nThe following resources MUST be provided:\n3.6 Tools, equipment, materials and documentation required\nrelative to hand forging\n3.7 Job order, requisitions slip for materials\n3.8 Relevant workplace procedures, product and manufacturing\nspecifications, codes, standards, manuals and reference\nmaterials.\n\n5. Method of\nassessment\n\nCompetency MUST be assessed through:\n5.1 Observation with questioning\n5.2 Portfolio\n5.3 Third party report\n\n6. Context of\nassessment\n6.1 Assessment must be undertaken in accordance with\n the endorsed TESDA assessment guidelines\n6.2 Assessment may be conducted in the workplace or a\n simulated environment\n\n--- PDF PAGE 32 ---\n________________________________________________________________________________________________________________\nTR - FORGING NC II Promulgated\n\n30\nUNIT OF COMPETENCY :\nPERFORM HAMMER FORGING\n\nUNIT CODE\n\n:\nALT722302\n\nUNIT DESCRIPTOR\n:\nThis unit covers using hammer tools and formers, selecting\nmaterial, and applying hammer forging techniques. The unit\napplies to the use of hammer forging techniques on carbon\nand alloy steels using various techniques, tools, formers,\npower hammers and heating devices. Equipment range\ndoes not include drop and upset machinery, vacuum\nfurnaces or rolling and extruding mill machinery.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n\n1. Select material\n\n1.1 Job requirements are determined from engineering drawing, job\nsheet or verbal instructions\n1.2 Material calculations are made using volumes and weights\nthat include provision for oxidization and shrinkage.\n1.3 Material is correctly selected for use with specific tools and\nformers.\n\n2. Use hammer\ntools and\nformers\n\n2.1 Hammer tools and formers are selected for specific forging\ntechnique.\n2.2 Hammer tools and formers are used in accordance with the\nforging technique selected.\n2.3 Forging machine is set up and operated in accordance with\ncompany procedures and/or manufacturer’s instruction.\n\n3. Hammer-forge\narticles\n\n3.1 Hammer forging technique is selected and applied according to\nthe requirements of the job.\n3.2 Material is hammer-forged to produce articles to specification\n3.3 Defects are recognized and appropriate rectification action is\ntaken.\n3.4 Correct techniques are applied to the handling of hot metal with\nregard to balancing and pivoting.\n3.5 Heating process is applied based on the material and/ or\nrequirements of the job.\n\n--- PDF PAGE 33 ---\n________________________________________________________________________________________________________________\nTR - FORGING NC II Promulgated\n\n31\n\nRANGE OF VARIABLE\n\nVARIABLE\nRANGE\n1 Material\ncalculations\n1.1 Thermal expansion/contraction\n1.2 Material wastage\n2 Hammer tools\nand formers\n\n2.1 Flatters\n2.2 Set hammers\n2.3 Hot/cold sets\n2.4 Ball peen hammer\n2.5 Swages\n3 Defects\n\n3.1 Galls\n3.2 Fins\n3.3 Shrinkage\n3.4Oxidization\n4 Heating process\n\n4.1 Diesel furnace\n4.2 Electric furnace\n4.3 Gas furnaces\n4.4 Coke-fired\n4.5 Gaseous oxygen-fuel equipment\n5 Material\n5.1 Low/high carbon steels\n5.2 Alloys\n5.3 Stainless steel\n5.4 Lead\n\n--- PDF PAGE 34 ---\n________________________________________________________________________________________________________________\nTR - FORGING NC II Promulgated\n\n32\nEVIDENCE GUIDE\n\n1. Critical aspect of\n competency\nAssessment requires evidence that the candidate\n1.1 Applied hammer forging techniques to carbon and alloy steels\nusing various techniques, tools, formers, power hammers and\nheating devices.\n\n2. Underpinning\nknowledge and\nattitudes\n2.1 Hammer forging techniques\n2.2 The set up and operation of forging machines\n2.3 Techniques for handling hot metal\n2.4 Oxidization/shrinkage allowances\n2.5 Numerical operations and formulae for determining the volume\nand weight of material\n2.6 Material specifications\n2.7 Hazards and control measures associated with hammer forging,\nincluding housekeeping\n2.8 Use and application of personal protective equipment\n2.9 Safe work practices and procedures\n2.10 Honesty and perseverance\n\n3. Underpinning\n skills\n\n3.1 Using hammer tools and formers\n3.2 Setting up and operating forging machines\n3.3 Following job instructions, drawings, specifications\n3.4 Detecting forging defects\n3.5 Rectifying forging techniques\n3.6 Safely handling hot metal\n3.7 Correctly heating material being forged\n3.8Calculating volume and weight of material\n\n4. Resource\n implications\n\nThe following resources MUST be provided:\n4.1 Tools, equipment, materials and documentation required\nrelative to hammer forging\n4.2 Job order, requisitions slip for materials\n4.3 Relevant workplace procedures, product and manufacturing\nspecifications, codes, standards, manuals and reference\nmaterials.\n\n5. Method of\nassessment\n\nCompetency MUST be assessed through:\n5.4 Observation with questioning\n5.5 Portfolio\n5.6 Third party report\n\n6. Context of\nassessment\n6.1 Assessment must be undertaken in accordance with\n the endorsed TESDA assessment guidelines\n6.2 Assessment may be conducted in the workplace or a\n simulated environment\n\n--- PDF PAGE 35 ---\n________________________________________________________________________________________________________________\nTR - FORGING NC II Promulgated\n\n33\nUNIT OF COMPETENCY :\nPERFORM BASIC INCIDENTAL HEAT/QUENCHING,\nTEMPERING AND ANNEALING\n\nUNIT CODE\n\n:\nALT722303\n\nUNIT DESCRIPTOR\n:\nThis unit covers performing straightforward heating/\nquenching, tempering and annealing of ferrous and non-\nferrous metals.\n\nThis unit applies to the heat treatment of ferrous and non-\nferrous metals of various types and thicknesses by a range\nof methods. These may include oxy acetylene, LPG gas\nequipment, forge etc. used to heat/quench, temper and\nanneal materials to specifications.\n\nWork would normally cover one-off processes or processes\nundertaken as incidental to trade work (e.g. tool making,\nmetal spinning etc.)\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Determine job\nrequirements\n1.1 Job requirements are determined from engineering drawing,\njob sheet or verbal instructions\n2. Set up equipment\nfor heat/quenching,\ntempering and\nannealing\n2.1 Appropriate heating process and/or procedure are selected\nfor the given job.\n2.2 Equipment is set up according to standard operating\nprocedures and manufacturers’ instructions.\n3. Operate heating\nequipment\n\n3.1 Safety procedures are observed in accordance with OH & S\nrequirements.\n3.2 Heating equipment is operated following standard operating\nprocedures and/or manufacturer’s instructions.\n3.3 Equipment adjustments are made in accordance with\nstandard operating procedures and/or manufacturer’s\ninstructions.\n3.4 Material is heat-treated to achieve required result.\n\n--- PDF PAGE 36 ---\n________________________________________________________________________________________________________________\nTR - FORGING NC II Promulgated\n\n34\nRANGE OF VARIABLE\n\nVARIABLE\nRANGE\n\n1. Heating process\n\n1.1 Heating/quenching\n1.2 Tempering\n1.3 Annealing\n2. Heating\nEquipment\n\n2.1 Oxy acetylene\n2.2 LPG gas equipment\n2.3 Forge\n\n3. Materials\n\n3.1 Ferrous metals of various types and thicknesses\n3.2 non-ferrous metals of various types and thicknesses\n\n--- PDF PAGE 37 ---\n________________________________________________________________________________________________________________\nTR - FORGING NC II Promulgated\n\n35\nEVIDENCE GUIDE\n\n1. Critical aspect of\n competency\nAssessment requires evidence that the candidate:\nPerformed basic incidental heat/quenching, tempering and\nannealing of ferrous and non-ferrous metals by a range of methods,\nwhich may include oxy acetylene, LPG gas equipment, forge, and\nuse to heat/quench temper and anneal materials to specifications.\n\n2. Underpinning\nknowledge and\nattitudes\n2.1 Characteristics and applications of heating/quenching,\ntempering, annealing processes\n2.2 Specifications for heating, quenching, tempering, and\nannealing\n2.3 Process for heating/quenching, tempering, annealing, different\nmaterials\n2.4 Operating/adjusting heating equipment\n2.5 Hazards and control measures associated with\nheating/quenching, tempering, annealing, including\nhousekeeping\n2.6 Use and application of personal protective equipment\n2.7 Safe work practices and procedures\n2.8 Honesty and perseverance\n\n3. Underpinning\n skills\n\n3.1 Reading, interpreting and following information on written job\ninstructions, specifications, standard operating procedures,\nmanufacturer instructions, charts, lists, drawings and other\napplicable reference documents\n3.2 Checking and clarifying task-related information\n3.3 Following verbal instructions\n3.4 Orally reporting routine information\n3.5 Selecting appropriate processes for heating/quenching,\ntempering, annealing\n3.6 Setting up, adjusting and operating equipment\n\n4 Resource\nimplications\n\nThe following resources MUST be provided:\n4.1 All tools, equipment, materials and documentation required\nrelative to the Performance of basic incidental heat/quenching,\ntempering and annealing of ferrous and non-ferrous metals\n4.2 Job order, requisitions slip for materials\n4.3 Relevant workplace procedures, product and manufacturing\nspecifications, codes, standards, manuals and reference\nmaterials.\n\n5 Method of\nassessment\n\nCompetency MUST be assessed through:\n5.1 Observation with questioning\n5.2 Portfolio\n5.3 Third party report\n\n6 Context of\nassessment\n6.1 Assessment must be undertaken in accordance with the\nendorsed TESDA assessment guidelines\n6.2 Assessment may be conducted in the workplace or a\nsimulated environment\n\n--- PDF PAGE 38 ---\n________________________________________________________________________________________________________________\nTR - FORGING NC II Promulgated\n\n36"
