        "source_text": "ALT722303\n\nUNIT DESCRIPTOR\n:\nThis unit covers performing straightforward heating/\nquenching, tempering and annealing of ferrous and non-\nferrous metals.\n\nThis unit applies to the heat treatment of ferrous and non-\nferrous metals of various types and thicknesses by a range\nof methods. These may include oxy acetylene, LPG gas\nequipment, forge etc. used to heat/quench, temper and\nanneal materials to specifications.\n\nWork would normally cover one-off processes or processes\nundertaken as incidental to trade work (e.g. tool making,\nmetal spinning etc.)\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Determine job\nrequirements\n1.1 Job requirements are determined from engineering drawing,\njob sheet or verbal instructions\n2. Set up equipment\nfor heat/quenching,\ntempering and\nannealing\n2.1 Appropriate heating process and/or procedure are selected\nfor the given job.\n2.2 Equipment is set up according to standard operating\nprocedures and manufacturers’ instructions.\n3. Operate heating\nequipment\n\n3.1 Safety procedures are observed in accordance with OH & S\nrequirements.\n3.2 Heating equipment is operated following standard operating\nprocedures and/or manufacturer’s instructions.\n3.3 Equipment adjustments are made in accordance with\nstandard operating procedures and/or manufacturer’s\ninstructions.\n3.4 Material is heat-treated to achieve required result.\n\n--- PDF PAGE 36 ---\n________________________________________________________________________________________________________________\nTR - FORGING NC II Promulgated\n\n34\nRANGE OF VARIABLE\n\nVARIABLE\nRANGE\n\n1. Heating process\n\n1.1 Heating/quenching\n1.2 Tempering\n1.3 Annealing\n2. Heating\nEquipment\n\n2.1 Oxy acetylene\n2.2 LPG gas equipment\n2.3 Forge\n\n3. Materials\n\n3.1 Ferrous metals of various types and thicknesses\n3.2 non-ferrous metals of various types and thicknesses\n\n--- PDF PAGE 37 ---\n________________________________________________________________________________________________________________\nTR - FORGING NC II Promulgated\n\n35\nEVIDENCE GUIDE\n\n1. Critical aspect of\n competency\nAssessment requires evidence that the candidate:\nPerformed basic incidental heat/quenching, tempering and\nannealing of ferrous and non-ferrous metals by a range of methods,\nwhich may include oxy acetylene, LPG gas equipment, forge, and\nuse to heat/quench temper and anneal materials to specifications.\n\n2. Underpinning\nknowledge and\nattitudes\n2.1 Characteristics and applications of heating/quenching,\ntempering, annealing processes\n2.2 Specifications for heating, quenching, tempering, and\nannealing\n2.3 Process for heating/quenching, tempering, annealing, different\nmaterials\n2.4 Operating/adjusting heating equipment\n2.5 Hazards and control measures associated with\nheating/quenching, tempering, annealing, including\nhousekeeping\n2.6 Use and application of personal protective equipment\n2.7 Safe work practices and procedures\n2.8 Honesty and perseverance\n\n3. Underpinning\n skills\n\n3.1 Reading, interpreting and following information on written job\ninstructions, specifications, standard operating procedures,\nmanufacturer instructions, charts, lists, drawings and other\napplicable reference documents\n3.2 Checking and clarifying task-related information\n3.3 Following verbal instructions\n3.4 Orally reporting routine information\n3.5 Selecting appropriate processes for heating/quenching,\ntempering, annealing\n3.6 Setting up, adjusting and operating equipment\n\n4 Resource\nimplications\n\nThe following resources MUST be provided:\n4.1 All tools, equipment, materials and documentation required\nrelative to the Performance of basic incidental heat/quenching,\ntempering and annealing of ferrous and non-ferrous metals\n4.2 Job order, requisitions slip for materials\n4.3 Relevant workplace procedures, product and manufacturing\nspecifications, codes, standards, manuals and reference\nmaterials.\n\n5 Method of\nassessment\n\nCompetency MUST be assessed through:\n5.1 Observation with questioning\n5.2 Portfolio\n5.3 Third party report\n\n6 Context of\nassessment\n6.1 Assessment must be undertaken in accordance with the\nendorsed TESDA assessment guidelines\n6.2 Assessment may be conducted in the workplace or a\nsimulated environment\n\n--- PDF PAGE 38 ---\n________________________________________________________________________________________________________________\nTR - FORGING NC II Promulgated\n\n36"
