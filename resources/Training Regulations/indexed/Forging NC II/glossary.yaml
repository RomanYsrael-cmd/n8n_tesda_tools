  "source_text": "(FORGING)\n\n1. Forging\nForging is the term for shaping metal by using localized\ncompressive forces\n2. Cold forging\n\nCold forging is done at room temperature or near room\ntemperature.\n3. Hot forging\nHot forging is done at a high temperature, which makes\nmetal easier to shape and less likely to fracture.\n4. Warm forging\nWarm forging is done at intermediate temperature between\nroom temperature and hot forging temperatures.\n5. Hammer forging\nIn modern times, industrial forging is done either with\npresses or with hammers powered by compressed air,\nelectricity, hydraulics or steam. These hammers are large,\nhaving reciprocating weights in the thousands of pounds.\nSmaller power hammers, 500 lb (230 kg) or less\nreciprocating weight, and hydraulic presses are common in\nart smithies as well. Steam hammers are becoming\nobsolete.\n6. Open-die forging\nOpen-die forging is also known as smith forging.In open-die\nforging a hammer comes down and deforms the workpieces,\nwhich is placed on a stationary anvil. Open-die forging gets\nits name from the fact that the dies (the working surfaces of\nthe forge that contract the workpiece) do not enclose the\nworkpiece, allowing it to flow except where contacted by the\ndies. Therefore the operator needs to orient and position the\nworkpiece to get the desired shape. The dies are usually flat\nin shape, but some have a specially shaped surface for\nspecialized operations. For instance, the die may have a\nround, concave, or convex surface or be a tool to form holes\nor be a cut-off tool.\n7. Impression-die\nforging\nImpression-die forging is also called closed-die forging. In\nimpression-die work metal is placed in a die resembling a\nmold, which is attached to the anvil. Usually the hammer die\nis shaped as well. The hammer is then dropped on the\nworkpiece, causing the metal to flow and fill the die cavities.\nThe hammer is generally in contact with the workpiece on\nthe scale of milliseconds. Depending on the size and\ncomplexity of the part the hammer may be dropped multiple\ntimes in quick succession.\n8. Flash\nExcess metal is squeezed out of the die cavities; this is\ncalled flash. The flash cools more rapidly than the rest of\nthe material; this cool metal is stronger than the metal in the\n\n--- PDF PAGE 48 ---\n________________________________________________________________________________________________________________\nTR - FORGING NC II Promulgated\n\n46\ndie so it helps prevent more flash from forming. This also\nforces the metal to completely fill the die cavity. After forging\nthe flash is trimmed off\n9. Press forging\nPress forging is variation of drop-hammer forging. Unlike\ndrop-hammer forging, press forges work slowly by applying\ncontinuous pressure or force. The amount of time the dies\nare in contact with the workpiece is measured in seconds\n(as compared to the milliseconds of drop-hammer forges).\nThe press forging operation can be done either cold or hot.\n10. Upset forging\nUpset forging increases the diameter of the workpiece by\ncompressing its length.] Based on number of pieces\nproduced this is the most widely used forging process. A few\nexamples of common parts produced using the upset forging\nprocess are engine valves, couplings, bolts, screws, and\nother fasteners.\n\n--- PDF PAGE 49 ---\n________________________________________________________________________________________________________________\nTR - FORGING NC II Promulgated\n\n47",
