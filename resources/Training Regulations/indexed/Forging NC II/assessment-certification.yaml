  "source_text": "SECTION 4 NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1 To attain the National Qualification of FORGING NC II, the candidate must\ndemonstrate competence in all the units listed in Section 1. Successful candidates\nshall be awarded a National Certificate signed by the TESDA Director General.\n\n4.2 Individual aspiring to be awarded the qualification of FORGING NC II must\ndemonstrate competency in all the following core units of the Qualification through a\nsingle project-type assessment. Candidates may apply for assessment in any\naccredited assessment center.\n\n4.2.1 Forge Basic Shapes\n Perform Hand Forging\n Perform Hammer Forging\n Perform Basic Incidental Heat/Quenching Tampering and Annealing\n\n4.3 Assessment shall focus on the core units of competency. The basic and common\nunits shall be integrated or assessed concurrently with the core units.\n\n4.4 The following are qualified to apply for assessment and certification:\n\n4.4.1 Graduates of formal, non-formal and informal including\nenterprise-based training programs.\n\n4.4.2 Experienced workers (wage employed or self-employed)\n\n4.5 The guidelines on assessment and certification are discussed in detail in the\nProcedures Manual on Assessment and Certification and Guidelines on the\nImplementation of the Philippine TVET Qualification and Certification System\n(PTQCS).\n\n--- PDF PAGE 46 ---\n________________________________________________________________________________________________________________\nTR - FORGING NC II Promulgated\n 44\n\n"
