  "source_section_text": "SECTION 3 TRAINING STANDARDS\n\nThese guidelines are set to provide the Technical and Vocational Education and\nTraining (TVET) providers with information and other important requirements to consider\nwhen designing training programs for Forging NC II\n\n3.1 CURRICULUM DESIGN\n\nCourse Title: FORGING\n\nNC Level: NC II\n\nNominal Training Duration:\n18 Hours (Basic Competencies)\n\n20 Hours (Common Competencies)\n68 Hours (Core Competencies)\nCourse Description:\n\nThis course is designed to enhance the knowledge, skills and attitudes of an individual\nin the field of FORGING NC II Qualification. It consists of competencies that a person must\nachieve to be able to perform hand and hammer forging of low to medium carbon and alloy\nup to steel carbon and alloy steels using a variety of techniques, tools, formers and heating\ndevices. It also include basic incidental heat/quenching, tempering and annealing of ferrous\nand non-ferrous metals of various types and thicknesses.\nBasic competencies such as: Participate in workplace communication; Work in a team\nenvironment; Practice career professionalism; and Practice occupational health and safety\nare included.\nIt also includes common competencies such as: Read, Interpret and Apply Engineering\nDrawings; Perform Mensuration and Calculation Read; Interpret and Apply Specifications and\nManuals and; Perform Shop Maintenance.\nTo obtain this, all units prescribed for this qualification must be achieved.\n\nBASIC COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and convey\nworkplace\n information.\n1.2 Participate in workplace\nmeeting and discussion.\n1.3 Complete relevant work-\nrelated documents\n• Group discussion\n• Interaction\n• Lecture\n• Reportorial\n• Written test\n• Practical/\nperformance\ntest\n• Interview\n2. Work in a team\nenvironment\n2.1 Describe and identify\nteam role and responsibility\nin a team.\n2.2 Describe work as a team\nmember.\n• Group discussion\n• Case studies\n• Simulation\n\n• Written test\n• Observation\n• Simulation\n• Role playing\n• Case studies\n\n--- PDF PAGE 39 ---\n________________________________________________________________________________________________________________\nTR - FORGING NC II Promulgated\n\n37\n3. Practice career\nprofessionalism\n3.1Integrate personal\nobjectives with\norganizational goals.\n3.2 Set and meet work\npriorities.\n3.3 Maintain professional\ngrowth and development.\n• Group Discussion\n• Interaction\n• Simulation\n• Demonstration\n• Self-paced\ninstruction\n• Structured activity\n•Film viewing\n• Role play\n• Interview\n• Written\nexamination\n• Portfolio\nassessment\n4. Practice\noccupational\nhealth and\nsafety\n4.1 Identify hazards and risks.\n4.2 Evaluate hazard and risks\n4.3 Control hazards and risks\n4.4 Maintain occupational\nhealth and safety\nawareness\n• Interactive-lecture\n• Simulation\n• Symposium\n• Group dynamics\n• Film viewing\n• Situation analysis\n• Self-paced\ninstruction\n• Situational\nanalysis\n• Interview\n• Practical\nexamination\n• Written exam\n• Portfolio\nassessment\n\nCOMMON COMPETENCIES\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Read, Interpret\nand Apply\nEngineering\nDrawings\n1.1 Identify and access\nengineering drawings/\nspecification\n1.2 Interpret drawings\n1.3 Apply information in the\ndrawings & specifications\n1.4 Store drawings\n• Lecture/\nDemonstration\n• Dual training\n\n• Direct\nobservation\n• Interview\n2. Perform\nMensuration\nand Calculation\n2.1 Select measuring\ninstrument and\n2.2 Carry out measurement\nand calculations.\n2.3 Maintain measuring\ninstruments\n• Lecture/\nDemonstration\n• Simulation\n• Exercises\n\n• Written test\n• Oral\nquestioning\n• Direct\nobservation\n3. Read, Interpret\nand Apply\nSpecifications\nand Manual\n3.1 Identify/accessed manuals\nand interpret data and\nspecification\n3.2 Apply information\naccessed in manual\n3.3 Store manual\n• Lecture/\nDemonstration\n• Dual training\n• Distance\nLearning\n• Written test\n• Direct\nobservation\n• Project method\n• Interview\n4. Perform Shop\nMaintenance\n\n4.1 Inspect/clean tools and\nwork area\n4.2 Store/arrange tools and\nshop equipment\n4.3 Dispose wastes/used\nlubricants\n4.4 Report damaged\ntools/equipment\n• Lecture/\nDemonstration\n• Dual training\n• Self paced\n(modular)\n• Simulation\n• Written test\n• Direct\nobservation\n• Demonstration\n• Interview\n\n--- PDF PAGE 40 ---\n________________________________________________________________________________________________________________\nTR - FORGING NC II Promulgated\n\n38\nCORE COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Perform hand\nforging\n1.1 Select material\n1.2 Use hand tools and formers\n1.3 Operate heating equipment\n1.4 Hand forge articles\n• Lecture\n• Demonstration\n• Dualized\ntraining\n• Distance\nlearning\n• Observation\nwith\nquestioning\n• Portfolio\n• Third party\nreport\n2. Perform\nhammer forging\n2.1 Select material\n2.2 Use hammer tools and\nformers\n2.3 Hammer-forge articles\n• Lecture\n• Demonstration\n• Dualized\ntraining\n• Distance\nlearning\n• Observation\nwith\nquestioning\n• Portfolio\n•\nThird party\nreport\n3. Perform Basic\nIncidental\nHeat/Quenching\nTampering and\nAnnealing\n3.1 Determine job requirements\n3.2 Set up equipment for\nheat/quenching, tempering\nand annealing\n3.3 Operate heating equipment\n• Lecture\n• Demonstration\n• Dualized\ntraining\n• Distance\nlearning\n• Observation\nwith\nquestioning\n• Portfolio\n•\nThird party\nreport\n\n--- PDF PAGE 41 ---\n________________________________________________________________________________________________________________\nTR - FORGING NC II Promulgated\n\n39\n3.2 TRAINING DELIVERY\n\nThe delivery of training should adhere to the design of the curriculum. Delivery\nshould be guided by the 10 basic principles of competency-based TVET.\n\n The training is based on curriculum developed from the competency standards;\n Learning is modular in its structure;\n Training delivery is learner-centered and should accommodate individualized\nand self-paced learning strategies;\n Training is based on work that must be performed;\n Training materials are directly related to the competency standards and the\ncurriculum modules;\n Assessment is based in the collection of evidence of the performance of work to\nthe industry required standard;\n Training is based on and off-the-job components;\n Allows for recognition of prior learning (RPL) or current competencies;\n Training allows for multiple entry and exit; and\n Approved training programs are nationally accredited.\n\nThe competency-based TVET system recognizes various types of delivery\nmodes, both on and off-the-job as long as the learning is driven by the competency\nstandards specified by the industry. The following training modalities may be adopted\nwhen designing training programs:\n\n The dualized mode of training delivery is preferred and recommended. Thus\nprograms would contain both in-school and in-industry training or fieldwork\ncomponents. Details can be referred to the Dual Training System (DTS)\nImplementing Rules and Regulations.\n Modular/self-paced learning is a competency-based training modality wherein\nthe trainee is allowed to progress at his own pace. The trainer facilitates the\ntraining delivery\n Peer teaching/mentoring is a training modality wherein fast learners are given\nthe opportunity to assist the slow learners.\n Supervised industry training or on-the-job training is an approach in training\ndesigned to enhance the knowledge and skills of the trainee through actual\nexperience in the workplace to acquire specific competencies prescribed in the\ntraining regulations.\n Distance learning is a formal education process in which majority of the\ninstruction occurs when the students and instructor are not in the same place.\nDistance learning may employ correspondence study, or audio, video or\ncomputer technologies.\n Project-Based Instruction is an authentic instructional model or strategy in which\nstudents plan, implement and evaluate projects that have real world\napplications.\n\n--- PDF PAGE 42 ---\n________________________________________________________________________________________________________________\nTR - FORGING NC II Promulgated\n\n40\n3.3 TRAINEE ENTRY REQUIREMENTS\n\nThis section specifies the qualifications of trainees and educational\nexperience. Other requirements like health and physical requirements are also\nstated. Passing entry written examinations may also be indicated if necessary.\n\n• With 2 year experience in basic foundry melting\n• Ability to communicate both orally and in writing; and\n• Physically and mentally fit\n\n 3.4 LIST OF TOOLS, EQUIPMENT AND MATERIALS\n FORGING NC II\n\nRecommended list of tools, equipment and materials for the training of 12 trainees for\nFORGING NC II\nTOOLS\nEQUIPMENT\nMATERIALS\nQTY\n\nQTY\n\nQTY\n\n4 pairs\nGloves\n\nForklift 2Tons\ncapacity\n4 gallon\nLubricant\n2 pairs\nSafety shoes\n\nPortable Lifter\n500Kgs capacity\n100Kgs\nLow/medium carbon\nsteel\n2 sets\nColored glass\n1 unit\nDrop hammer\n20Kgs\nAluminum rods\n1 Lot\nFlatters\n1 unit\nUpset machine\n40Kgs\nCopper Rods\n1 Lot\nTongs\n1 unit\nMechanical press\n50Kgs\nAlloy Steel Bars\n1 Lot\nSwaging dies\n1 unit\nHydraulic press\n3 tank\nOxygen\n1 Lot\nSet hammers\n1 set\nOxy-acetylene\ncutting outfit\n2 tank\nAcetylene\n1 Lot\nAssorted inserts\n1 unit\nGas Heating\nFurnace\n3 tank\nLPG\n4 pcs\nBall pein\nhammers\n1 unit\nElectric heating\nfurnace\n200 liter\nDiesel fuel\n4 pcs\nBoard hammer\n1 lot\nAssorted Dies\n10Kgs\nGraphite\n2 pcs\nAnvil\n1 Lot\nDie block\n50Kgs\nSilica sand\n1 Lot\nSplitters\n1 lot\nBenders\n2 Kgs\nGrease\n1 Lot\nBolster\n1 unit\nAir compressor\n2 Kgs\nWax\n1 Lot\nTrimmers\n1 lot\nTrimming dies\n1 Lot\nWood cushions\n1 unit\nPower shear\nmachine\n\n2 sets\nLubricant\ndispenser\n\n1 Lot\nPunch\n1 Lot\nDraw dies\n3 units Hand power\ntools\n\n2 units\nGrease gun\n4 pcs\nSteel brush\n4 pcs\nSledge hammer\n\n--- PDF PAGE 43 ---\n________________________________________________________________________________________________________________\nTR - FORGING NC II Promulgated\n\n41\n6 pcs\nClamps\n1 Lot\nAssorted keys\n1 Lot\nSpanners\n3 pcs\nScrew driver\n2 pcs\nSteel Tape /\nMeter\n\n2 pcs\nPipe Wrench\n3 pcs\nAdjustable\nwrench\n\n2 sets\nVernier caliper\n2 pairs\nApron\n2 pairs\nArm band\n\n3.5 TRAINING FACILITIES\n FORGING NC II\n Based on a class size of 12 students/trainees\n\nSPACE\nREQUIREMENT\nSIZE IN METERS\nAREA IN SQ.\nMETERS\nTOTAL AREA IN SQ.\nMETERS\nBuilding (permanent)\n26.00 x 28.00\n728.00\n728.00\nTrainee Working Space\n3.50 x 3.50 per\nstudent / trainee\n12.25 per\nstudent\n147\nLecture room\n9.00 x 10.00\n90.00\n90.00\nLearning resource\ncenter\n5.00 x 8.00\n40.00\n40.00\nFacilities / Equipment /\nCirculation area**\n-\n-\n302.00\n** Area requirement is equivalent to 30% of the total teaching/learning areas\n\n--- PDF PAGE 44 ---\n________________________________________________________________________________________________________________\nTR - FORGING NC II Promulgated\n\n42\n\n3.6 TRAINER’S QUALIFICATIONS FOR AUTOMOTIVE\nMANUFACTURING SUB SECTOR\n\nFORGING NC II\nTRAINER QUALIFICATION (TQ II)\n• Must be a holder of FORGING NC II\n• Must have undergone training on Training Methodology II (TM II) 1\n• Must be computer literate\n• Must be physically and mentally fit\n• Must have at least 2 years job/industry experience2\n• Must be a civil-service eligible or holder of appropriate professional license issued by\nthe Professional Regulatory Commission (for government positions\n\n1\nThis shall be changed to “:Must be a holder of Trainer Qualification Level II (TQII) or equivalent”\nupon promulgation by the TESDA Board of the TQ/AQ training regulations\n2\nOptional. Only when required by the hiring institution\n\nReference: TESDA Board Resolution No. 2004 03\n\n3.7 INSTITUTIONAL ASSESSMENT\n\nInstitutional assessment is undertaken by trainees to determine their achievement\nof units of competency. A certificate of achievement is issued for each unit of\ncompetency.\n\n--- PDF PAGE 45 ---\n________________________________________________________________________________________________________________\nTR - FORGING NC II Promulgated\n\n43"
