    "source_text": "3.1 CURRICULUM DESIGN\n\nCourse Title: FORGING\n\nNC Level: NC II\n\nNominal Training Duration:\n18 Hours (Basic Competencies)\n\n20 Hours (Common Competencies)\n68 Hours (Core Competencies)\nCourse Description:\n\nThis course is designed to enhance the knowledge, skills and attitudes of an individual\nin the field of FORGING NC II Qualification. It consists of competencies that a person must\nachieve to be able to perform hand and hammer forging of low to medium carbon and alloy\nup to steel carbon and alloy steels using a variety of techniques, tools, formers and heating\ndevices. It also include basic incidental heat/quenching, tempering and annealing of ferrous\nand non-ferrous metals of various types and thicknesses.\nBasic competencies such as: Participate in workplace communication; Work in a team\nenvironment; Practice career professionalism; and Practice occupational health and safety\nare included.\nIt also includes common competencies such as: Read, Interpret and Apply Engineering\nDrawings; Perform Mensuration and Calculation Read; Interpret and Apply Specifications and\nManuals and; Perform Shop Maintenance.\nTo obtain this, all units prescribed for this qualification must be achieved.\n\nBASIC COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and convey\nworkplace\n information.\n1.2 Participate in workplace\nmeeting and discussion.\n1.3 Complete relevant work-\nrelated documents\n• Group discussion\n• Interaction\n• Lecture\n• Reportorial\n• Written test\n• Practical/\nperformance\ntest\n• Interview\n2. Work in a team\nenvironment\n2.1 Describe and identify\nteam role and responsibility\nin a team.\n2.2 Describe work as a team\nmember.\n• Group discussion\n• Case studies\n• Simulation\n\n• Written test\n• Observation\n• Simulation\n• Role playing\n• Case studies\n\n--- PDF PAGE 39 ---\n________________________________________________________________________________________________________________\nTR - FORGING NC II Promulgated\n\n37\n3. Practice career\nprofessionalism\n3.1Integrate personal\nobjectives with\norganizational goals.\n3.2 Set and meet work\npriorities.\n3.3 Maintain professional\ngrowth and development.\n• Group Discussion\n• Interaction\n• Simulation\n• Demonstration\n• Self-paced\ninstruction\n• Structured activity\n•Film viewing\n• Role play\n• Interview\n• Written\nexamination\n• Portfolio\nassessment\n4. Practice\noccupational\nhealth and\nsafety\n4.1 Identify hazards and risks.\n4.2 Evaluate hazard and risks\n4.3 Control hazards and risks\n4.4 Maintain occupational\nhealth and safety\nawareness\n• Interactive-lecture\n• Simulation\n• Symposium\n• Group dynamics\n• Film viewing\n• Situation analysis\n• Self-paced\ninstruction\n• Situational\nanalysis\n• Interview\n• Practical\nexamination\n• Written exam\n• Portfolio\nassessment\n\nCOMMON COMPETENCIES\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Read, Interpret\nand Apply\nEngineering\nDrawings\n1.1 Identify and access\nengineering drawings/\nspecification\n1.2 Interpret drawings\n1.3 Apply information in the\ndrawings & specifications\n1.4 Store drawings\n• Lecture/\nDemonstration\n• Dual training\n\n• Direct\nobservation\n• Interview\n2. Perform\nMensuration\nand Calculation\n2.1 Select measuring\ninstrument and\n2.2 Carry out measurement\nand calculations.\n2.3 Maintain measuring\ninstruments\n• Lecture/\nDemonstration\n• Simulation\n• Exercises\n\n• Written test\n• Oral\nquestioning\n• Direct\nobservation\n3. Read, Interpret\nand Apply\nSpecifications\nand Manual\n3.1 Identify/accessed manuals\nand interpret data and\nspecification\n3.2 Apply information\naccessed in manual\n3.3 Store manual\n• Lecture/\nDemonstration\n• Dual training\n• Distance\nLearning\n• Written test\n• Direct\nobservation\n• Project method\n• Interview\n4. Perform Shop\nMaintenance\n\n4.1 Inspect/clean tools and\nwork area\n4.2 Store/arrange tools and\nshop equipment\n4.3 Dispose wastes/used\nlubricants\n4.4 Report damaged\ntools/equipment\n• Lecture/\nDemonstration\n• Dual training\n• Self paced\n(modular)\n• Simulation\n• Written test\n• Direct\nobservation\n• Demonstration\n• Interview\n\n--- PDF PAGE 40 ---\n________________________________________________________________________________________________________________\nTR - FORGING NC II Promulgated\n\n38\nCORE COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Perform hand\nforging\n1.1 Select material\n1.2 Use hand tools and formers\n1.3 Operate heating equipment\n1.4 Hand forge articles\n• Lecture\n• Demonstration\n• Dualized\ntraining\n• Distance\nlearning\n• Observation\nwith\nquestioning\n• Portfolio\n• Third party\nreport\n2. Perform\nhammer forging\n2.1 Select material\n2.2 Use hammer tools and\nformers\n2.3 Hammer-forge articles\n• Lecture\n• Demonstration\n• Dualized\ntraining\n• Distance\nlearning\n• Observation\nwith\nquestioning\n• Portfolio\n•\nThird party\nreport\n3. Perform Basic\nIncidental\nHeat/Quenching\nTampering and\nAnnealing\n3.1 Determine job requirements\n3.2 Set up equipment for\nheat/quenching, tempering\nand annealing\n3.3 Operate heating equipment\n• Lecture\n• Demonstration\n• Dualized\ntraining\n• Distance\nlearning\n• Observation\nwith\nquestioning\n• Portfolio\n•\nThird party\nreport\n\n--- PDF PAGE 41 ---\n________________________________________________________________________________________________________________\nTR - FORGING NC II Promulgated\n\n39"
