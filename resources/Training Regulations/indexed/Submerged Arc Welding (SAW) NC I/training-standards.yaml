  "source_section_text": "SECTION 3 TRAINING STANDARDS\n\nThese guidelines are set to provide the Technical and Vocational Education\nand Training (TVET) providers with information and other important requirements to\nconsider when designing training programs for SUBMERGED ARC WELDING\n(SAW).\n\n3.1 CURRICULUM DESIGN\n\nCourse Title: SUBMERGED ARC WELDING\nNC Level NC I\n\nSuggested Nominal Training Duration: 28 hrs. ( Basic Competencies)\n\n 56 hrs. ( Common Competencies)\n\n 40 hrs. ( Core Competencies)\n\nCourse Description:\n\nThis qualification is designed to develop knowledge, desirable attitudes and\nskills in setting up and operating automatic welding equipment used in welding\ncarbon steel plates.\n\n To obtain this, all units of competency prescribed for this qualification must be\nachieved.\n\nBASIC COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Receive and\nrespond to\nworkplace\ncommunicatio\nn\n1.1 Explain routinary\nspeaking & messages in\na workplace.\n1.2 Follow routinary speaking\n & message\n1.3 Perform work duties\n following written notices.\n• Group\ndiscussion\n• Interaction\n• Interviews/\nquestioning\n• Observation\n2. Work with\nothers\n2.1 Develop effective\n workplace relationship.\n2.2 Contribute to work group\n activities.\n• Group\ndiscussion\n• Interaction\n\n• Interviews/\nquestioning\n• Demonstration\n• Observation\n\n--- PDF PAGE 49 ---\nWeldncii11-3\n\n48\n3. Demonstrate\nwork values\n\n3.1 Define the purpose of\nwork\n3.2 Apply work values/ethics\n3.3 Deal with ethical problems\n3.4 Maintain integrity of\nconduct in the workplace\n• Group\ndiscussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n4. Practice\nhousekeeping\nprocedures\n4.1 Sort and remove\n unnecessary items\n4.2 Arrange items\n4.3 Maintain work areas,\n tools and equipment\n4.4 Follow standardize work\n process and procedures\n4.5 Perform work\n spontaneously\n• Group\ndiscussion\n• Int