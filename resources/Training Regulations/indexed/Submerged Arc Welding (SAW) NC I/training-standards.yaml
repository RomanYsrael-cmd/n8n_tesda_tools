  "source_section_text": "SECTION 3 TRAINING STANDARDS\n\nThese guidelines are set to provide the Technical and Vocational Education\nand Training (TVET) providers with information and other important requirements to\nconsider when designing training programs for SUBMERGED ARC WELDING\n(SAW).\n\n3.1 CURRICULUM DESIGN\n\nCourse Title: SUBMERGED ARC WELDING\nNC Level NC I\n\nSuggested Nominal Training Duration: 28 hrs. ( Basic Competencies)\n\n 56 hrs. ( Common Competencies)\n\n 40 hrs. ( Core Competencies)\n\nCourse Description:\n\nThis qualification is designed to develop knowledge, desirable attitudes and\nskills in setting up and operating automatic welding equipment used in welding\ncarbon steel plates.\n\n To obtain this, all units of competency prescribed for this qualification must be\nachieved.\n\nBASIC COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Receive and\nrespond to\nworkplace\ncommunicatio\nn\n1.1 Explain routinary\nspeaking & messages in\na workplace.\n1.2 Follow routinary speaking\n & message\n1.3 Perform work duties\n following written notices.\n• Group\ndiscussion\n• Interaction\n• Interviews/\nquestioning\n• Observation\n2. Work with\nothers\n2.1 Develop effective\n workplace relationship.\n2.2 Contribute to work group\n activities.\n• Group\ndiscussion\n• Interaction\n\n• Interviews/\nquestioning\n• Demonstration\n• Observation\n\n--- PDF PAGE 49 ---\nWeldncii11-3\n\n48\n3. Demonstrate\nwork values\n\n3.1 Define the purpose of\nwork\n3.2 Apply work values/ethics\n3.3 Deal with ethical problems\n3.4 Maintain integrity of\nconduct in the workplace\n• Group\ndiscussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n4. Practice\nhousekeeping\nprocedures\n4.1 Sort and remove\n unnecessary items\n4.2 Arrange items\n4.3 Maintain work areas,\n tools and equipment\n4.4 Follow standardize work\n process and procedures\n4.5 Perform work\n spontaneously\n• Group\ndiscussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n\nCOMMON COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Apply Safety\nPractices\n1.1 Identify hazardous areas\n1.2 Use protective clothing and\ndevices\n1.3 Perform safe handling of tools,\n equipment and materials\n1.4 Perform first aid\n1.5 Use fire extinguisher\n• Lecturette\n• Practical\n application\n\n• Oral\n questioning\n• Written\n• Demonstrati\non\n2. Interpret\nworking\ndrawings\nand\nsketches\n2.1 Identify standard alphabet of\nlines\n2.2 Identify orthographic/\nisometric views\n2.3 Interpret standard drawing\nsymbols, dimensional\ntolerances and notations\n• Lecturette\n• Practical\n application\n\n• Oral\n questioning\n• Written\n\n3. Perform\nIndustry\ncalculations\n3.1 Perform four fundamental\n operations\n3.2 Perform conversion of units\n3.3 Perform calculations on\nalgebraic expressions\n3.4 Compute percentage and ratio\n• Lecturette\n• Practical\n application\n\n• Oral\nquestioning\n• Written test\n\n4. Contribute to\n quality\n system\n4.1 Inspect work done\n4.2 Apply quality standards to\nwork\n4.3 Protect company property\n and customer interest\n• Lecturette\n• Practical\n application\n\n• Oral\n questioning\n• Written\n• Demonstrati\non\n\n--- PDF PAGE 50 ---\nWeldncii11-3\n\n49\n5. Use hand\ntools\n5.1 Select hand tools\n5.2 Use hand tools\n5.3 Maintain hand tools\n• Lecturette\n• Practical\n application\n\n• Oral\n questioning\n• Written\n• Demonstrati\non\n6. Prepare\nWeld\nMaterials\n\n6.1 Set-up cutting equipment\n6.2 Cut and prepare edge of\n materials\n6.3 Clean surfaces and edges\n6.4 Prepare welding consumables\n6.5 Prepare welding safety and\n protective equipment\n• Lecturette\n• Practical\n application\n\n• Observation\n• Demonstrati\non and oral\nquestioning\n• Written test\n\n7. Set-up\nWelding\nEquipment\n7.1 Set up welding machine\n7.2 Set up welding accessories\n7.3 Set up welding positioners,\njigs and fixtures\n7.4 Set up pre-heating\ntools/equipment as required\n\n• Lecturette\n• Demonstration\n\n• Observation\nand oral\nquestioning\n• Demonstrati\non and oral\nquestioning\n•Written test\n8. Fit up Weld\nMaterials\n8.1 Perform tack welding\n8.2 Check gap and alignment\n8.3 Set up welding positioner\n\n• Lecturette\n• Demonstration\n\n• Observation\nand oral\nquestioning\n• Demonstrati\non and oral\nquestioning\n•Written test\n9. Repair\n Welds\n9.1 Mark/locate weld defects\n9.2 Prepare tools and equipment\n9.3 Remove defects\n9.4 Perform re-welding\n\n• Lecturette\n• Demonstration\n\n• Observation\nand oral\nquestioning\n• Demonstrati\non and oral\nquestioning\n• Written test\n\n--- PDF PAGE 51 ---\nWeldncii11-3\n\n50\nCORE COMPETENCIES\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n\n1. Weld plates\nusing SAW\n\n1.1 Perform single pass fillet weld\nin different positions\n (1F and 2F)\n1.2 Perform multiple pass fillet\nweld in different positions\n (1F and 2F)\n1.3 Perform multiple pass groove\nweld in 1G position\n\n• Demonstration\n• Discussion /\nLecturette\n\n• Actual\nperformance\n• Direct\nObservation\n• Written or oral\n\n--- PDF PAGE 52 ---\nWeldncii11-3\n\n51\n3.2\nTRAINING DELIVERY\n\nThe delivery of training should adhere to the design of the curriculum.\nDelivery should be guided by the 10 basic principles of competency-based\nTVET.\n\n The training is based on curriculum developed from the competency\nstandards;\n Learning is modular in its structure;\n Training delivery is individualized and self-paced;\n Training is based on work that must be performed;\n Training materials are directly related to the competency standards and\nthe curriculum modules;\n Assessment is based in the collection of evidence of the performance of\nwork to the industry required standard;\n Training is based both on and off-the-job components;\n Allows for recognition of prior learning (RPL) or current competencies;\n Training allows for multiple entry and exit; and\n Approved training programs are Nationally Accredited\n\nThe competency-based TVET system recognizes various types of delivery\nmodes, both on and off-the-job as long as the learning is driven by the\ncompetency standards specified by the industry. The following training\nmodalities may be adopted when designing training programs:\n\n• The dualized mode of training delivery is preferred and recommended.\nThus programs would contain both in-school and in-industry training or\nfieldwork components. Details can be referred to the Dual Training System\n(DTS) Implementing Rules and Regulations.\n• Modular/self-paced learning is a competency-based training modality\nwherein the trainee is allowed to progress at his own pace. The trainer just\nfacilitates the training delivery.\n• Peer teaching/mentoring is a training modality wherein fast learners are\ngiven the opportunity to assist the slow learners.\n• Supervised industry training or on-the-job training is an approach in\ntraining designed to enhance the knowledge and skills of the trainee\nthrough actual experience in the workplace to acquire specific\ncompetencies prescribed in the training regulations.\n• Distance learning is a formal education process in which majority of the\ninstruction occurs when the students and instructor are not in the same\nplace. Distance learning may employ correspondence study, audio, video\nor computer technologies.\n\n--- PDF PAGE 53 ---\nWeldncii11-3\n\n52\n3.3 TRAINEE ENTRY REQUIREMENTS\n\nThis section specifies the qualifications of trainees and educational\nexperience. Other requirements like health and physical requirements are\nalso stated. Passing entry written examinations may also be indicated if\nnecessary.\n\n• completed training in SMAW NC I or a holder of SMAW NC I\n• can communicate either oral or written\n• physically and mentally fit\n• can perform basic mathematical computation\n\n3.5 LIST OF TOOLS, EQUIPMENT AND MATERIALS\n\n SUBMERGED ARC WELDING – NC I\n\nRecommended list of tools and materials per trainee for SAW – NC I\n\nTOOLS\n(for 25 trainees)\nEQUIPMENT\n(for 25 trainees)\nMATERIALS\n(per trainee)\nQTY\n\nQTY\n\nQTY\n\n25 pcs.\nChipping\nHammer\n12\nunits\nSAW machine\nAC/DC and\naccessories\n10\npcs.\nMild steel plate\n10mm X 150mm X\n500mm\n75 pcs.\nSteel brush\n12 pcs. Welding positioners\n20\npcs.\nMild steel plate 12\nmm X 150mm X\n500mm\n25 pcs.\nFlash shield\n1 unit\nAutomatic gas\ncutting machine\n1\ntube\nMetal marker\n25 sets\nWorking clothes/\noverall\n1 unit\nFlux oven\n1 reel\nFiller wire 2.4 / 3.2 mm\ndia. EL8, EM12, or EH14\n50 sets Leather gloves,\nlong\n12\nunits\nPortable disc grinder\n1 bag\nF6A0 or F7A0\n12 pcs.\nSteel square\n300 mm. long\n1 unit\nExhaust fan\n1 kg\n3.2mmØ electrode\nfor tacking (E60XX/\nE70XX)\n12 pcs. Files-half round\n2 units\nWork bench w/\nbench vice on 4\ncorners\n\n5 pcs.\nFillet gauge\n\nNote : One(1) reel filler & one(1) bag flux good for 2-3 trainees\n\n--- PDF PAGE 54 ---\nWeldncii11-3\n\n53\n3.5 TRAINING FACILITIES\n\nSUBMERGED ARC WELDING – NC I\n\nThe welding workshop must be of concrete structure. Based on class size of 25\nstudents/trainees the space requirements for the teaching/learning and circulation\nareas are as follows:\n\nSPACE\nREQUIREMENT\nSIZE IN\nMETERS\nAREA IN\nSQ. M\n\nQTY.\n\nTOTAL AREA\nIN SQ. M\nWelding Area\n2 X 2\n4\n5\n20\nMaterials/Preparation\nArea*\n2 X 2\n4\n\n4\nBench work Area\n1.5 X 2.5\n4\n2\n8\nTool Room & S/M\nStorage Area\n4 X 5\n20\n\n20\nLearning Resource\nArea*\n5 X 9\n45\n\n45\nWash Area /Comfort\nRoom (male and\nfemale) *\n2.5 X 4\n10\n\n10\nTotal\n\n107\nCirculation Area**\n\n35\nTotal Workshop Area\n\n142\n\n* This area can also be used by other welding courses.\n** Area requirement is equivalent to 30% of the total teaching/learning areas\n\n--- PDF PAGE 55 ---\nWeldncii11-3\n\n54\n3.6 TRAINER’S QUALIFICATIONS FOR WELDER\n\nSUBMERGED ARC WELDING – NC I\nTRAINER QUALIFICATION (TQ I)\n\n•\n Must be a holder of SAW NC I\n•\n Must have undergone training on Training Methodology I (TM I)\n•\n Must be computer literate\n•\n Must be physically and mentally fit\n•\n *Must have at least 2 years job/industry experience\n•\n Must be a civil service eligible (for government position or appropriate\nprofessional license issued by the Professional Regulatory\nCommission)\n\n* Optional. Only when required by the hiring institution.\n\nReference: TESDA Board Resolution No. 2004 03\n\n3.7 INSTITUTIONAL ASSESSMENT\n\nInstitutional Assessment is to be undertaken by trainees to determine the\nachievement of units of competency. A certificate of achievement is issued for\neach unit of competency.\n\n--- PDF PAGE 56 ---\nWeldncii11-3\n\n55"
