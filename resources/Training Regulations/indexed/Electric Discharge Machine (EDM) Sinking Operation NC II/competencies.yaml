        "source_text": "MEE722204\n\nUNIT DESCRIPTOR\n:\nThis unit covers the competencies required to perform\nbasic calculations using the four fundamental operation.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Perform four\nfundamental\noperations.\n1.1 Simple calculations\nperformed using four\nfundamental\noperations.\n1.2 Simple calculations\nperformed involving\nfractions and mixed\nnumbers using four\nfundamental operations\n1.1 English and metric\nsystem of\nmeasurement\n\n1.1 Performing\ncalculation using\nfour fundamental\noperation\n\n2. Perform basic\ncalculations\ninvolving\nfractions and\ndecimals\n2.1 Simple calculations are\nperformed involving\nfractions and decimals\nusing the four\nfundamental operations.\n2.2 Decimal are converted\ninto fraction (and vice\nversa) accurately\n2.1 English and metric\nsystem of\nmeasurement\n\n2.1 Identifying die\nmaterial\nrequirements\n2.2 Determining\nproduction\nvolume\n2.3 Identifying\ndesign\nparameters\n3. Perform basic\ncalculations\ninvolving\npercentages.\n3.1 Simple calculations are\nperformed to obtain\npercentages from\ninformation expressed in\neither fractional or\ndecimal format\n3.1 English and metric\nsystem of\nmeasurement\n\n3.1 Performing\ncalculation\n\n4. Perform basic\ncalculation\ninvolving ration\nand proportion\n4.1 Simple calculations are\nperformed involving\nratios and proportion\nusing whole numbers,\nfractions and decimal\nfractions.\n\n4.1 English and metric\nsystem of\nmeasurement\n\n4.1 Performing\ncalculation\n5. Perform\ncalculations on\nalgebraic\nexpressions\n5.1 Simple calculations are\nperformed on algebraic\nexpressions using the\nfour fundamental\noperations.\n5.2 Simple transposition of\nformulae is carried out to\nisolate the variable\nrequired, involving the\nfour fundamental\noperations.\n\n5.1 English and metric\nsystem of\nmeasurement\n\n5.1 Performing\ncalculation\n\n--- PDF PAGE 52 ---\nElectric Discharge Machine (EDM)-Sinking Operation NC II Revision 00 Promulgated (05/21/2019) 48\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Four fundamental\noperations\nMay include:\n1.1 Addition\n1.2 Subtraction\n1.3 Multiplication\n1.4 Division\n\n2. Algebraic expressions Calculation using formula for determining:\n2.1 tap drill size\n2.2 feed\n2.3 speed\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Using four fundamental operations\n1.2 Involving fractions and mixed numbers\n1.3 Involving fractions and decimals\n1.4 Involving percentages\n1.5 Involving ratio and proportion\n1.6 On algebraic expressions\n1.7 of simple formulae\n\n2. Resource\nimplications\nThe following resources should be provided:\n2.1 Tools, equipment and facilities appropriate to processes\nor activity\n2.2 Materials relevant to the proposed activity\n\n3. Method of\nassessment\nCompetency in this unit may be assessed through:\n3.1 Written or oral short answer questions\n3.2 Practical exercises\n\n4. Context for\nassessment\n4.1 Competency may be assessed in actual workplace or at\nthe designated TESDA Accredited Assessment Center\n\n--- PDF PAGE 53 ---\nElectric Discharge Machine (EDM)-Sinking Operation NC II Revision 00 Promulgated (05/21/2019) 49\n\nUNIT OF COMPETENCY\n:\nMEASURE WORKPIECE (BASIC)\n\nUNIT CODE\n\n:"
