ITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n\n3.7 switches of the\nmachine\n3.8 Handling and\nstorage of tools\nChecklist of safe\nworking conditions\n\n4. Maintain hand\ntools\n4.1 Tool cutting ground to\nrecommended\nspecifications\n4.2 Hand tools lubricated\nand stored according\nto prescribed\nprocedure\n\n4.1 Proper cleaning\nand oiling\n4.2 Kinds of oil\n4.3 Handling and\nstorage of tools\n4.4 Procedures in\ncleaning and\ndisposal of waste\nmaterials\n\n4.1 Recommending\n cutting tool\n4.2 Lubricating hand\n tools\n\n--- PDF PAGE 66 ---\nElectric Discharge Machine (EDM)-Sinking Operation NC II Revision 00 Promulgated (05/21/2019) 62\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Inspected\nInspected machine parts include:\n1.1 V-belt\n1.2 Bearing\n1.3 Gears\n1.4 Clutch\n1.5 Drive pulley\n\n2. Machines\nMay include:\n2.1 Lathe machine\n2.2 Milling machine\n2.3 Grinding machine\n\n3. Tools and materials\nMay include:\n3.1 Lubricants\n3.2 Oil can\n3.3 Grease gun\n3.4 Oil\n3.5 Coolant or compound\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\n competency\nAssessment requires evidence that the candidate:\n1.1 Performed inspection of machine\n1.2 Performed cleaning and lubricating of machine\n1.3 Performed minor machine repairs and adjustments\n\n2. Resource Implications\nThe following resources should be provided:\n2.1 Tools, equipment and facilities appropriate to\nprocesses or activity\n2.2 Materials relevant to the proposed activity\n\n3. Method of Assessment\nCompetency in this unit may be assessed through:\n3.1 Direct observation of activities\n3.2 Oral or written questioning\n\n4. Context for Assessment\n4.1 Competency may be assessed in actual workplace or\nat the designated TESDA Accredited Assessment\nCenter\n\n--- PDF PAGE 67 ---\nElectric Discharge Machine (EDM)-Sinking Operation NC II Revision 00 Promulgated (05/21/2019) 63\n\nCORE COMPETENCIES\n\nUNIT OF COMPETENCY\n:\nSET-UP ELECTRIC DISCHARG