        "evidence_guide": {
          "source_text": "1. Critical aspects\nof competency\n\nAssessment requires evidence that the candidate:\n1.1 Set-up EDM-Sinking\n1.2 Set-up electrode\n1.3 Set-up workpiece\n1.4 Observed safety measures applicable to worksite operation\n1.5 Communicated effectively with others to ensure effective work\noperation\n2. Resource\nimplications\n\nThe following resources should be provided:\n2.1 Tools, equipment and facilities\n2.2 Consumable materials\n\n3. Method of\nassessment\n\nCompetency in this unit may be assessed through:\n3.1 Direct observation\n3.2 Demonstration with Oral Questioning\n\n4. Context for\nassessment\n4.1 Competency may be assessed in actual workplace or at the\ndesignated TESDA Accredited Assessment Center\n\n--- PDF PAGE 71 ---\nElectric Discharge Machine (EDM)-Sinking Operation NC II Revision 00 Promulgated (05/21/2019) 67\n\nUNIT OF COMPETENCY\n:\nPERFORM ELECTRIC DISCHARGE MACHINE (EDM)-\nSINKING OPERATION\n\nUNIT CODE\n:"
        },
        "source_text": "MEE821314\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes\nrequired to set-up electric discharge machine\n(sinking), electrode and workpiece.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are elaborated\nin the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1. Prepare EDM-\nSinking\n1.1 EDM sinking type and\ncapacity is selected\naccording to job\nrequirement\n1.2 Oil, grease and\ndielectric fluid is\nchecked according to\nmanufacturer’s\nspecification.\n1.3 Electrical settings and\nparameters are set\naccording to\nmanufacturer’s\nspecification.\n1.4 Work holding and\nclamping devices are\nmounted according to\nstandard operating\nprocedures.\n1.5 Operate dielectric fluid\npump and set working\npressure according to\nmanufacturer’s\nspecification\n1.6 Safety procedures are\napplied following OSHS\n\n1.1 Procedures in\nsetting up EDM\n1.2 Types and\ncapacity of EDM\n1.3 Types of oil,\ngrease and\ndielectric fluids\n1.4 Setting and\nchecking of\nparameters\naccording to\nreference table\n1.5 Types of work\nholding and\nclamping device\n1.6 OSH Rule No.\n1080 – Personal\nProtective\nEquipment &\nDevices\n1.7 OSH Rule No.\n1150 –\nMaterials\nHandling &\nStorage\n1.8 Air pollution\n1.9 Quality control\nOSH Rule No.\n1080 – Personal\nProtective\nEquipment &\nDevices\n1.1 Communication\nskills\n1.2 Selecting EDM\n1.3 Setting up of\nEDM parameters\n1.4 Selecting work\nholding devices\n1.5 Applying safety\nprocedures\n\n--- PDF PAGE 68 ---\nElectric Discharge Machine (EDM)-Sinking Operation NC II Revision 00 Promulgated (05/21/2019) 64\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are elaborated\nin the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n2. Prepare electrode\n\n2.1 Electrode is selected\naccording to job\nrequirement\n2.2 Electrode is mounted\non EDM platen and\nholder according to\nmanufacturer’s\nspecification.\n2.3 Electrode is aligned\nperpendicularly to the\nmagnetic table\naccording to standard\noperating procedures.\n2.4 Safety procedures are\napplied following OSHS\n\n2.1 Types of electrode\n2.2 Spark gap\nallowance of\nelectrode\n2.3 Electrode\nfabrication\n2.4 Metrology\n2.5 Procedure in\nmounting electrode\n2.6 Types of electrode\nholding and\nclamping device\n2.7 Quality control\nOSH Rule No.\n1080 – Personal\nProtective\nEquipment &\nDevices\n2.1 Selecting\nelectrode\n2.2 Mounting of\nelectrode\n2.3 Applying safety\nprocedures\n\n3. Prepare workpiece\n\n3.1 Clamping device is\nselected based on\nworkpiece material\n 3.2 Workpiece is mounted\non clamping device\naccording to standard\nindustry procedures\n3.3 Workpiece is centered\nto required level of\naccuracy using tools\nand instruments in\naccordance with\nworkplace procedures.\n3.4 Zero reference point of\nX, Y. Z axes is set\naccording to standard\noperating procedures.\n3.5 Front wall of tank is\nclamped to enclose\nand seal working tank\naccording to industry\nstandard procedures.\n3.6 Safety procedures are\napplied following OSHS\n.\n\n3.1 Procedures in\nmounting\nworkpiece\n3.2 Types of\nworkpiece\n3.3 Types of\nworkpiece holding\nand clamping\ndevice\n3.4 Procedures in\nenclosing tank\n3.5 OSH Rule No.\n1080 – Personal\nProtective\nEquipment &\nDevices\n3.6 OSH Rule No.\n1150 – Materials\nHandling &\nStorage\n3.7 Air pollution\n3.8 Quality control\nOSH Rule No.\n1080 – Personal\nProtective\nEquipment &\nDevices\n3.1 Mounting of\nworkpiece\n3.2 Centering of\nworkpiece\n3.3 Selecting\nclamping device\n3.4 Setting of zero\nreference point\n3.5 Applying safety\nprocedures\n\n--- PDF PAGE 69 ---\nElectric Discharge Machine (EDM)-Sinking Operation NC II Revision 00 Promulgated (05/21/2019) 65\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. EDM sinking\ntype\nMay include:\nAccording to capacity\n1.1 30 amperes capacity\n1.2 50 amperes capacity\n\nAccording to circuit\n1.3 Pulse type\n1.4 Relaxation type\n\n2. Dielectric fluid\nMay include:\n2.1 Petroleum base\n2.2 Full synthetic\n2.3 Vegetable based\n\n3. Work holding\nand clamping\ndevices\nMay include:\n3.1 Magnetic table\n3.2 Precision vise\n3.3 Punch former\n3.4 Sine magnetic table\n3.5 Angular/ parallel bars\n3.6 3R system or equivalent\n3.7 Drill chuck\n\n4. Electrode\nMay include:\n4.1 Copper\n4.2 Copper tungsten alloys\n4.3 Silver tungsten alloys / Silver tungsten Carbide alloys\n4.4 Graphite\n4.5 Steel\n4.6 Brass\n4.7 Aluminum alloys\n4.8 Zinc base die casting alloys\n4.9 Tellerium copper alloys\n5. Workpiece\nMay include:\n5.1 Aluminum\n5.2 Carbide\n5.3 Steel\n5.4 Copper\n5.5 Brass\n5.6 Stainless steel\n\n--- PDF PAGE 70 ---\nElectric Discharge Machine (EDM)-Sinking Operation NC II Revision 00 Promulgated (05/21/2019) 66\n\n6. Tools and\nInstruments\nMay include:\n6.1 Combination wrench\n6.2 Allen wrench\n6.3 Adjustable wrench\n6.4 Dial gage indicator\n6.5 Vernier caliper\n6.6 Micrometer\n6.7 Depth gage\n6.8 Pin gage\n6.9 Gauge block\n\nEVIDENCE GUIDE\n\n1. Critical aspects\nof competency\n\nAssessment requires evidence that the candidate:\n1.1 Set-up EDM-Sinking\n1.2 Set-up electrode\n1.3 Set-up workpiece\n1.4 Observed safety measures applicable to worksite operation\n1.5 Communicated effectively with others to ensure effective work\noperation\n2. Resource\nimplications\n\nThe following resources should be provided:\n2.1 Tools, equipment and facilities\n2.2 Consumable materials\n\n3. Method of\nassessment\n\nCompetency in this unit may be assessed through:\n3.1 Direct observation\n3.2 Demonstration with Oral Questioning\n\n4. Context for\nassessment\n4.1 Competency may be assessed in actual workplace or at the\ndesignated TESDA Accredited Assessment Center\n\n--- PDF PAGE 71 ---\nElectric Discharge Machine (EDM)-Sinking Operation NC II Revision 00 Promulgated (05/21/2019) 67\n\nUNIT OF COMPETENCY\n:\nPERFORM ELECTRIC DISCHARGE MACHINE (EDM)-\nSINKING OPERATION\n\nUNIT CODE\n:"
