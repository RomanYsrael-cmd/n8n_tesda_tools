        "source_text": "MEE821316\n\nUNIT DESCRIPTOR\n\n:\nThis unit involves the knowledge, skills and attitudes\nto perform post-electric discharge machine-sinking\noperations.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nBold and Italicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1. Conduct post-EDM-\n Sinking operation\n\n1.1 EDM flushing is shut off\nor gate valve is opened\nin accordance to\noperation manual\n1.2 EDM tank front wall is\nopened according to\n the operating manual\n1.3 Workpiece is removed\n from work holding and\nclamping devices\naccording to job\nrequirement\n 1.4 Workpiece is cleaned\nand dried according to\njob requirement\n 1.5 Safety procedures are\n applied following OSHS\n\n1.1 Procedures in\nopening of tank\nfront wall\n1.2 Procedures in\nremoving\nworkpiece\n1.3 Procedures in\ncleaning\nworkpiece\n1.4 OSH Rule No.\n1080 – Personal\nProtective\nEquipment &\nDevices\n1.5 OSH Rule No.\n1150 – Materials\nHandling &\nStorage\n1.6 Air pollution\n1.7 Quality control\nOSH Rule No.\n1080 – Personal\nProtective\nEquipment &\nDevices\n1.1 Removing\nworkpiece\n1.2 Cleaning\nworkpiece\n1.3 Applying safety\nprocedures\n2. Final check of\n workpiece\n2.1 Workpiece is\nchecked and measured\nusing measuring tools\nfollowing standard\noperating procedures\n2.2 Inspected workpiece is\napplied with anti-\ncorrosion agents\n2.3 Inspected workpiece\nand accomplishment\nreport are submitted to\nimmediate supervisor\nfollowing workplace\n2.1 Procedures in\nchecking and\nmeasuring\nworkpiece\n2.2 Application of\nanti-corrosion\nagents\n2.3 Submission of\ninspected\nworkpiece and\naccomplishment\nreport\n2.4 OSH Rule No.\n2.1 Checking and\nmeasuring\nworkpiece\n2.2 Applying anti-\ncorrosion agents\n2.3 Submitting\nworkpiece\nand accomplish\nment report\n2.4 Applying safety\nprocedures\n\n--- PDF PAGE 76 ---\nElectric Discharge Machine (EDM)-Sinking Operation NC II Revision 00 Promulgated (05/21/2019) 72\n\nELEMENT\nPERFORMANCE\nCRITERIA\nBold and Italicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n\n procedures\n2.4 Safety procedures\nare applied following\nOSHS\n\n 1080 – Personal\nProtective\nEquipment &\nDevices\n2.5 OSH Rule No.\n1150 – Materials\nHandling &\nStorage\n2.6 Air pollution\n2.7 Quality control\nOSH Rule No.\n1080 – Personal\nProtective\nEquipment &\nDevices\n\n3 EDM-Sinking\nshutdown and\nhousekeeping\n3.1 Electrical, pneumatic\nand hydraulic switches\nare turned off according\nto manufacturers’\noperating manual\n3.2 Tools are maintained\nand stored based on\nestablished procedures\n3.3 Defective tools are\ntagged and reported\naccording to workplace\nprocedures\n3.4 Good housekeeping is\nperformed following 5S\n3.5 Wastes are disposed\naccording to waste\nmanagement\nprocedures and\nenvironmental\nregulations\n3.6 Safety procedures are\napplied following OSHS\n\n3.1 Procedure of\nshutting down\nEDM\n3.2 Maintaining and\nstoring of tools\n3.3 Tagging of\ndefective tools\n3.4 5S and good\nhousekeeping\n3.5 Waste\nmanagement\n3.6 Environmental\nlaws related to\npost EDM\n(sinking)\nactivities\n3.7 OSH Rule No.\n1080 – Personal\nProtective\nEquipment &\nDevices\n3.8 OSH Rule No.\n1150 – Materials\nHandling &\nStorage\n3.9 Air pollution\n3.10 Quality control\nOSH Rule No.\n1080 – Personal\nProtective\nEquipment &\nDevices\n\n3.1 Shutting down\nEDM\n3.2 Maintaining and\nstoring tools\n3.3 Performing good\nhousekeeping\n3.4 Managing wastes\n3.5 Applying safety\nprocedures\n\n--- PDF PAGE 77 ---\nElectric Discharge Machine (EDM)-Sinking Operation NC II Revision 00 Promulgated (05/21/2019) 73\n\n RANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Work holding and\nclamping devices\nMay include:\n1.1 Magnetic table\n1.2 Precision vise\n1.3 Punch former\n1.4 Sine magnetic table\n1.5 Angular/ parallel bars\n1.6 3R system or equivalent\n1.7 Drill chuck\n\n2.Workpiece\nMay include:\n2.1 Aluminum\n2.2 Carbide\n2.3 Steel\n2.4 Copper\n2.5 Brass