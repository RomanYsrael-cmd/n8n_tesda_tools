          "source_text": "1. Critical aspects of\ncompetency\nAssessment requires evidence that the\ncandidate:\n1.1 Demonstrated ability to identify and sustain\ncost-effective activities in the workplace\n1.2 Demonstrated ability to practice\nentrepreneurial knowledge, skills and\nattitudes in the workplace.\n\n2. Resource Implications\nThe following resources should be\nprovided:\n2.1 Simulated or actual workplace\n2.2 Tools, materials and supplies needed to\ndemonstrate the required tasks\n2.3 References and manuals\n2.3.1 Enterprise procedure\n2.3.2 manuals\n2.4 Company quality policy\n\n3. Methods of Assessment\nCompetency in this unit should be\nassessed through:\n3.1 Interview\n3.2 Third-party report\n\n4.Context of Assessment\n4.1 Competency may be assessed in\nworkplace or in a simulated workplace\nsetting\n4.2 Assessment shall be observed while tasks\nare being undertaken whether individually\nor in-group\n\n--- PDF PAGE 41 ---\nElectric Discharge Machine (EDM)-Sinking Operation NC II Revision 00 Promulgated (05/21/2019) 37\n\nCOMMON COMPETENCIES\n\nUNIT OF COMPETENCY :\nAPPLY SAFETY PRACTICES\n\nUNIT CODE\n\n:"
