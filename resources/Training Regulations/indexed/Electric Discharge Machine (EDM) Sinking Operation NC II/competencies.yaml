ing to\nthe level of accuracy\nrequired.\n1.2 Measurements\ntaken are accurate\nto the finest\ngraduation of the\nselected measuring\ninstrument.\n1.3 Measuring\ntechnique used is\ncorrect and\nappropriate to the\ndevice used.\n1.1 Types, purposes\nand accuracy of\nmeasuring\ninstruments\n1.2 Capability of\nmeasuring\ninstruments\n1.3 Part dimensions\nand tolerances\n1.4 Techniques for\nmeasuring\ndimensions\n1.5 Care and storage\nprocedure of\nmeasuring tools\n\n1.1 Selecting\nmeasuring tools\n1.2 Obtaining\naccurate\nmeasurements\n1.3 Determining\nmeasuring\ntechnique\n\n2. Clean and store\nmeasuring tools\n2.1 Cleaning of devices\nundertaken\naccording to\nstandard operating\nprocedures.\n2.2 Care of devices\nundertaken\naccording to\nmanufacturer’s\nspecifications.\n2.3 Storage of devices\nundertaken\naccording to\nstandard operating\nprocedures.\n2.1 Types, purposes\nand accuracy of\nmeasuring\ninstruments\n2.2 Capability of\nmeasuring\ninstruments\n2.3 Part dimensions\nand tolerances\n2.4 Techniques for\nmeasuring\ndimensions\n2.5 Care and storage\nprocedure of\nmeasuring tools\n\n2.1 Determining\nproper care and\nstorage of\nmeasuring tools.\n\n--- PDF PAGE 54 ---\nElectric Discharge Machine (EDM)-Sinking Operation NC II Revision 00 Promulgated (05/21/2019) 50\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Measuring tools\nMay include\n1.1 Steel tape\n1.2 Steel rule\n1.3 Straight edge\n1.4 Combination square\n1.5 Steel square\n1.6 Divider or trammel\n1.7 Caliper\n1.8 Protractor\n1.9 Vernier caliper\n1.10 Micrometer\n\n2. Measurements\nMay include:\n2.1 Length\n2.2 Diameter\n2.3 Depth\n2.4 Flatness\n2.5 Straightness\n2.6 Squareness\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Selected and used measuring instruments\n1.2 Cleaned and stored measuring instruments\n\n2. Resource\nimplications\nThe following resources should be provided:\n2.1 Tools, equipment and facilities appropriate to the activity\