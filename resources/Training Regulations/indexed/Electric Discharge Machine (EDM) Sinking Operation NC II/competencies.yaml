        "source_text": "400311210\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes\nrequired to gather, interpret and convey information in\nresponse to workplace requirements.\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n1. Obtain and\nconvey\nworkplace\ninformation\n1.1 Specific and\nrelevant information\nis accessed from\nappropriate\nsources\n1.2 Effective\nquestioning, active\nlistening and\nspeaking skills are\nused to gather and\nconvey information\n1.3 Appropriate\nmedium is used to\ntransfer information\nand ideas\n1.4 Appropriate non-\nverbal\ncommunication is\nused\n1.5 Appropriate lines of\ncommunication with\nsupervisors and\ncolleagues are\nidentified and\nfollowed\n1.6 Defined workplace\n procedures for the\nlocation and\nstorage of\ninformation are\nused\n1.7 Personal interaction\nis carried out\nclearly and\nconcisely\n1.1 Effective verbal\nand nonverbal\ncommunication\n1.2 Different modes of\ncommunication\n1.3 Medium of\ncommunication in\nthe workplace\n1.4 Organizational\npolicies\n1.5 Communication\nprocedures and\nsystems\n1.6 Lines of\nCommunication\n1.7 Technology\nrelevant to the\nenterprise and the\nindividual’s work\nresponsibilities\n1.8 Workplace\netiquette\n\n1.1 Following simple\nspoken language\n1.2 Performing routine\nworkplace duties\nfollowing simple\nwritten notices\n1.3 Participating in\nworkplace meetings\nand discussions\n1.4 Preparing work-\nrelated documents\n1.5 Estimating,\ncalculating and\nrecording routine\nworkplace\nmeasures\n1.6 Relating/ Interacting\nwith people of\nvarious levels in the\nworkplace\n1.7 Gathering and\nproviding basic\ninformation in\nresponse to\nworkplace\nrequirements\n1.8 Basic business\nwriting skills\n19 Interpersonal skills\nin the workplace\n2.0 Active-listening skills\n\n--- PDF PAGE 7 ---\nElectric Discharge Machine (EDM)-Sinking Operation NC II Revision 00 Promulgated (05/2