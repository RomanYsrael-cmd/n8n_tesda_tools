        "source_text": "MEE821315\n\nUNIT DESCRIPTOR\n:\nThis unit involves the knowledge, skills and attitudes\nrequired in performing electric discharge machine\n(sinking) operations.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nBold and Italicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1. Operate EDM -\nSinking\n\n1.1 Dry run is conducted\nand adjustments are\nmade if required\naccording to EDM\noperating manual\nWorkpiece is pressure\nflushed /submerged\nwith dielectric fluid\naccording to EDM\noperating manual\n1.2 EDM is operated to\nmeet dimensions,\ntolerances, limits ,fits\nand surface texture\naccording to job\nrequirements\n1.3 EDM accessories are\nused according to job\nrequirements\n1.4 Worn out electrode is\nreplaced according to\njob requirements\n1.5 Safety procedures are\napplied following OSHS\n\n1.1 Procedures in\noperating EDM\n1.2 Kinds of EDM\naccessories\n1.3 Procedures in\nsetting\nparameters\n1.4 Kinds of\ntolerances,\nlimits, fits and\nsurface Texture\n1.5 Procedures in\nreplacing worn\nout electrode\n1.6 Metrology\n1.7 OSH Rule No.\n1080 – Personal\nProtective\nEquipment &\nDevices\n1.8 OSH Rule No.\n1150 – Materials\nHandling &\nStorage\n1.9 Air pollution\n1.10 Quality control\nOSH Rule No.\n1080 – Personal\nProtective\nEquipment &\nDevices\n\n1.1 Operating EDM\n1.2 Using EDM\naccessories\n1.3 Replacing worn\nout electrode\n1.4 Identifying surface\nfinish\n1.5 Applying safety\nprocedures\n\n--- PDF PAGE 72 ---\nElectric Discharge Machine (EDM)-Sinking Operation NC II Revision 00 Promulgated (05/21/2019) 68\n\nELEMENT\nPERFORMANCE\nCRITERIA\nBold and Italicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n2. Monitor performance\nof machine and\nelectrode\n2.1 Machine and electrode\nperformance is\nmonitored and adjusted\nwith the aid of power\ncontrol\nunit based on the\naccepted industry\nstandards\n2.2 Dielectric fluid level is\n maintained according to\n machine operating\nmanual\n2.3 Flushing pressure is\n progressively increased\nbased on job\nrequirements\n2.4 Depth of cut is\nthoroughly maintained\naccording to standard\nwork procedures\n2.5 Safety procedures are\napplied following OSHS\n2.1 Procedures in\nmonitoring and\nadjusting EDM\nparameters\n2.2 Procedures in\nmaintaining level of\ndielectric fluid\n2.3 Procedures in\nmonitoring flushing\npressure\n2.4 Procedures in\nmaintaining depth of\ncut\n2.5 Procedure of\ncomparing surface\nfinish\n2.6 OSH Rule No. 1080 –\nPersonal Protective\nEquipment & Devices\n2.7 OSH Rule No. 1150 –\nMaterials Handling &\nStorage\n2.8 Air pollution\n2.9 Quality control OSH\nRule No. 1080 –\nPersonal Protective\nEquipment & Devices\n2.1 Monitoring EDM\nperformance\n2.2 Maintaining\ndielectric fluid\nlevel\n2.3 Monitoring\nflushing pressure\n2.4 Maintaining depth\nof cut\n2.5 Comparing\nsurface finish to\nsurface\ncomparator\n2.6 Applying safety\nprocedures\n3. Visual inspection\n of workpiece and\nelectrode\n\n3.1 Working table is\nemptied of dielectric\nfluid according to\noperating manual\n3.2 Surface of\n workpiece is cleaned\n according to job\n requirement\n 3.3 Surface texture of\nworkpiece is visually\ninspected while on its\nholder according to\njob requirements\n3.4 Electrode is inspected\nfor wear according to\njob requirements\n3.5 Safety procedures are\n applied following OSHS\n\n3.1 Procedures in\nemptying working\ntable from dielectric\nfluid\n3.2 Procedures in\ncleaning workpiece\n3.3 Procedures in visual\ninspection of\nworkpiece surface\nfinish\n3.4 OSH Rule No. 1080 –\nPersonal Protective\nEquipment & Devices\n3.5 OSH Rule No. 1150 –\nMaterials Handling &\nStorage\n3.6 Air pollution\n3.7 Quality control OSH\nRule No. 1080 –\nPersonal Protective\nEquipment & Devices\n3.1 Emptying of\ndielectric fluid\n3.2 .Cleaning of\nworkpiece\n3.3 Visual inspection\nof workpiece and\nelectrode\n3.4 Comparing\nsurface finish to\nsurface\ncomparator\n3.5 Applying safety\nprocedures\n\n--- PDF PAGE 73 ---\nElectric Discharge Machine (EDM)-Sinking Operation NC II Revision 00 Promulgated (05/21/2019) 69\n\n RANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Surface texture\nMay include:\nValues\n1.1. nr.12 = 0.40 Ra(um)\n1.2. nr.15 = 0.56 Ra(um)\n1.3. nr.18 = 0.80 Ra(um)\n1.4 nr.21= 1.12 Ra(um)\n1.5.nr.24 = 1.60 Ra(um)\n1.6.nr.27 = 2.24 Ra(um)\n1.7. nr.30 = 3.15 Ra(um)\n1.8. nr.33 = 4.50 Ra(um)\n1.9. nr.36 = 6.30 Ra(um)\n1.10. nr.39 = 9.00 Ra(um)\n1.11. nr.42 = 12.5 Ra(um)\n1.12. nr.45 = 18.0 Ra(um)\n\n2. EDM\naccessories\nMay include:\n2.1 Electrode platen and holder\n2.2 Flush nozzles\n2.3 Dither / Audio sensors\n2.4 Sensor with fire extinguisher\n\n3.Power Control unit May include:\n Knob, toggle, switches and buttons for:\n3.1 Gap\n3.2 Feed rate\n3.3 Vibration Control System (VCS) or Arc Sensor\n3.4 Pulse\n3.5 Frequency\n3.6 Suppress Control\n3.7 Timer\n3.8 Dielectric fluid height meter\n3.9 Dielectric fluid pressure gauge\n\n4. Dielectric fluid\nMay include:\n4.1 Petroleum based\n4.2 Full synthetic\n4.3 Vegetable based\n\n--- PDF PAGE 74 ---\nElectric Discharge Machine (EDM)-Sinking Operation NC II Revision 00 Promulgated (05/21/2019) 70\n\nEVIDENCE GUIDE\n\n1. Critical aspects\nof competency\n\nAssessment requires evidence that the candidate:\n1.1 Operated electric discharge machine-sinking\n1.2 Monitored performance of machine and electrode\n1.3 Visually inspected workpiece and electrode\n1.4 Observed safety measures applicable to worksite\noperation\n1.5 Communicated effectively with others to ensure effective\nwork operation\n2. Resource\nimplications\n\nThe following resources should be provided:\n2.1 Tools, equipment and facilities\n2.2 Consumable materials\n2.3 Charts and tables\n3. Method of\nassessment\n\nCompetency in this unit may be assessed through:\n3.1 Written Examination\n3.2 Direct observation\n3.3 Demonstration with Oral Questioning\n4. Context for\nassessment\n\n4.1 Competency may be assessed in actual workplace or at\nthe designated TESDA Accredited Assessment Center.\n\n--- PDF PAGE 75 ---\nElectric Discharge Machine (EDM)-Sinking Operation NC II Revision 00 Promulgated (05/21/2019) 71\n\nUNIT OF COMPETENCY\n :\nPERFORM POST-ELECTRIC DISCHARGE MACHINE\n (EDM)-SINKING OPERATION\n\nUNIT CODE\n\n:"
