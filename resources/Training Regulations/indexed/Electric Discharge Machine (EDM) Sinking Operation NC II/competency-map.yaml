  "source_text": "SECTION 1 ELECTRIC DISCHARGE MACHINE (EDM)-SINKING OPERATION NC II\n QUALIFICATION\n\nThe Electric Discharge Machine (EDM)-Sinking Operation NC II Qualification\nconsists of competencies that a person must achieve to set-up EDM, electrode and\nworkpiece, perform EDM-sinking operations and perform post EDM -sinking operations.\n\nThe units of competency comprising this qualification include the following:\n\nCODE NO.\nBASIC COMPETENCIES\n400311210\nParticipate in workplace communication\n400311211\n400311212\n400311213\n400311214\n400311215\n400311216\n400311217\n\n400311218\nWork in a team environment\nSolve/address general workplace problems\nDevelop career and life decisions\nContribute to workplace innovation\nPresent relevant information\nPractice occupational safety and health policies and procedures\nExercise efficient and effective sustainable practices in the\nworkplace\nPractice entrepreneurial skills in the workplace\n\nCODE NO.\nCOMMON COMPETENCIES\nMEE722201\nApply safety practices\nMEE722202\nInterpret working drawings and sketches\nMEE722203\nSelect/ cut workshop materials\nMEE722204\nPerform shop computations (Basic)\nMEE722205\nMEE722206\nMeasure workpiece (Basic)\nPerform routine housekeeping\nMEE722207\nPerform shop computations (Intermediate)\nMEE722208\nMeasure workpiece using angular measuring instruments\nMEE722210\nMeasure workpiece using gages and surface texture comparator\nMEE722211\n\nPerform preventive and corrective maintenance\nCODE NO.\nCORE COMPETENCIES\nMEE 821314\nSet-up Electric Discharge Machine, electrode and workpiece\nMEE 821315\nPerform Electric Discharge Machine-sinking operations\nMEE 821316\nPerform post Electric Discharge Machine-sinking operations\n\nA person who has achieved this Qualification is competent to be a –\n• Electric Discharge Machine-Sinking Operator\n\n--- PDF PAGE 6 ---\nElectric Discharge Machine (EDM)-Sinking Operation NC II Revision 00 Promulgated (05/21/2019) 2"
}
