    },
    {
      "source_text": "2.1 Types of electrode 2.2 Spark gap allowance of electrode 2.3 Electrode fabrication 2.4 Metrology 2.5 Procedure in mounting electrode 2.6 Types of electrode holding and clamping device 2.7 Quality control OSH Rule No. 1080 – Personal Protective Equipment & Devices 2.1 Selecting electrode 2.2 Mounting of electrode 2.3 Applying safety procedures"
    },
    {
      "source_text": "3. Prepare workpiece"
    },
    {
      "source_text": "3.1 Clamping device is selected based on workpiece material 3.2 Workpiece is mounted on clamping device according to standard industry procedures 3.3 Workpiece is centered to required level of accuracy using tools and instruments in accordance with workplace procedures. 3.4 Zero reference point of X, Y. Z axes is set according to standard operating procedures. 3.5 Front wall of tank is clamped to enclose and seal working tank according to industry standard procedures. 3.6 Safety procedures are applied following OSHS ."
