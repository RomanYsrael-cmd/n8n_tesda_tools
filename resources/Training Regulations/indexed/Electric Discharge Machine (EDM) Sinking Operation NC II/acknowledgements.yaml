      "source_text": "GOLASSARY OF TERMS"
    },
    {
      "source_text": "1. Electric discharge machine (EDM) operation is the operation of removing metal thru electric discharge of short duration and high current density between the tool and workpiece"
    },
    {
      "source_text": "2. Electrode a formed cutting tool usually made of electrically conductive material usually carbon (graphite)"
    },
    {
      "source_text": "3. Dielectric fluid mostly of light lubricating oil of low viscosity and a non- conductor of electricity, able to rapidly ionize(vaporize) and deionize metal by removing it by flushing"
    },
    {
      "source_text": "4. Flushing process of removing eroded particles from the spark gap thru the rapid passage of dielectric fluid on a pipe or nozzle or thru electrode"
    },
    {
      "source_text": "5. Surface texture Is the surface finish on workpiece resulting from the spark duration, ie. Longer spark duration, rougher surface finish"
    },
    {
      "source_text": "6. Wear refers to the tool or electrode’s microscopic particles being carried on every spark, ie. More spark, more wear"
    },
    {
      "source_text": "7. Spark gap The distance between the face and sides of the workpiece and the electrode during machining operation"
    },
    {
      "source_text": "8. Duty cycle"
    },
    {
      "source_text": "9. Relaxation type circuit"
    },
    {
      "source_text": "10. Pulse type circuit"
    },
    {
      "source_text": "11. Dither/Audio"
    },
    {
      "source_text": "12. Gap Monitor Meter"
    },
    {
      "source_text": "13.Servo head"
    },
    {
      "source_text": "Is the measure of efficiency from the relationship between the on-time to the off-time of machine operation"
    },
    {
      "source_text": "Depends upon the capacitor and resistance to provide the spark discharge. It gives higher electrode wear rate and lower metal removal"
    },
    {
      "source_text": "A valve or transistorized circuit to switch power into the working gap under accurate control, enabling precise amounts of energy to be measured in each spark discharge"
    },
    {
      "source_text": "Attachments designed to give visual or audible signal if proximity of electrode and workpiece is less than the spark gap"
    },
    {
      "source_text": "It indicates deviation of spark gap; arching will cause a voltage increase and poor ionization of fluid will decrease the voltage"
    },
    {
      "source_text": "It controls the advancement of the electrode into the workpiece. Correct spark gap is maintained when voltages at the working gap and the reference on the servo head are balance"
    },
    {
