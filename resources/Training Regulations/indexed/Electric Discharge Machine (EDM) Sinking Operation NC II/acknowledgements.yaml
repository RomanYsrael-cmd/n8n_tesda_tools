advanced CNC lathe\nmachine operations\nWrite basic CNC milling\nmachine program\nSet-up CNC milling machine,\nworkpiece and cutting tools\nPerform basic CNC milling\nmachine operations\nWrite advanced CNC milling\nmachine program\nSet-up multiple-axis CNC\nmilling machine, workpiece and\ncutting tools\nPerform advanced CNC\nmilling machine operations\nWeld Carbon Steel Plates\nUsing FCAW\nWeld Carbon Steel Pipes\nUsing FCAW\nWeld Alloy Steel Plates Using\nFCAW\nWeld Alloy Steel Pipes Using\nFCAW\nPerform Gas Welding in\nCarbon Steel Plates and\nTubes\nPerform Gas Welding in Alloy\nSteel Plates and Tubes\nWeld Carbon Steel Plates\nUsing GMAW\n\nWeld Carbon Steel Pipes\nUsing GMAW\nWeld Alloy Steel Plates Using\nGMAW\nWeld Alloy Steel Pipes Using\nGMAW\nWeld Carbon Steel Plates\nUsing GTAW\nWeld Carbon Steel Pipes\nUsing GTAW\nWeld Alloy Steel Plates Using\nGTAW\nWeld Alloy Steel Pipes Using\nGTAW\nPerform bench work (Basic)\nTurn workpiece\nMill workpiece\nGrind workpiece\nShape workpiece\nRepair workpiece\nPerform bench work (Basic)\nPerform bench work\n(Complex)\nTurn workpiece (Basic)\nTurn workpiece\n(Intermediate)\nMill workpiece (Basic)\nMill workpiece (Intermediate)\n\nCORE COMPETENCIES\n\n--- PDF PAGE 109 ---\nElectric Discharge Machine (EDM)-Sinking Operation NC II Revision 00 Promulgated (05/21/2019)\n105\n\nGrind workpiece (Basic)\nGrind workpiece (Complex)\nTurn workpiece (Advanced)\nMill workpiece (Advanced)\nPrepare basic engineering\ndrafting\nPerform basic engineering\ndetail drafting\nPerform Preventive\nMaintenance\nPerform Planned and\nUnplanned (Emergency)\nMaintenance\nFabricate Simple Items\nInstall Machinery\n Perform press machine\nsetting\n Perform mechanical press\noperation\nWeld Plates Using SAW\nWeld Pipes Using SAW\nWeld Carbon Steel Plates\nUsing SMAW\nWeld Carbon Steel Plates\nand Pipes Using SMAW\nWeld Alloy Steel Plates Using\nSMAW\nWeld Alloy Steel Pipes Using\nSMAW\nMachine Die Components\nFit and Assemble Dies\nTest and Try Die\nMachine mold components\n\nImplement surface finishing\n\nFit and assemble mold\n\nRectify mold flaws\nSet-up Electric Discharge\nMachine, electrode and\nworkpiece\nPerform Electric Discharge\nMachine-sinking operations\nPerform post Electric\nDischarge Machine-sinking\noperations\n\n--- PDF PAGE 110 ---\nElectric Discharge Machine (EDM)-Sinking Operation NC II Revision 00 Promulgated (05/21/2019) 106\n\nGOLASSARY OF TERMS\n\n1. Electric discharge\n machine (EDM) operation\nis the operation of removing metal thru electric discharge of\nshort duration and high current density between the tool and\nworkpiece\n\n2. Electrode\na formed cutting tool usually made of electrically conductive\nmaterial usually carbon (graphite)\n\n3. Dielectric fluid\nmostly of light lubricating oil of low viscosity and a non-\nconductor of electricity, able to rapidly ionize(vaporize) and\ndeionize metal by removing it by flushing\n\n4. Flushing\nprocess of removing eroded particles from the spark gap thru\nthe rapid passage of dielectric fluid on a pipe or nozzle or thru\nelectrode\n\n5. Surface texture\nIs the surface finish on workpiece resulting from the spark\nduration, ie. Longer spark duration, rougher surface finish\n\n6. Wear\nrefers to the tool or electrode’s microscopic particles being\ncarried on every spark, ie. More spark, more wear\n\n7. Spark gap\nThe distance between the face and sides of the workpiece and\nthe electrode during machining operation\n\n8. Duty cycle\n\n9. Relaxation type circuit\n\n10. Pulse type circuit\n\n11. Dither/Audio\n\n12. Gap Monitor Meter\n\n13.Servo head\n\nIs the measure of efficiency from the relationship between the\non-time to the off-time of machine operation\n\nDepends upon the capacitor and resistance to provide the\nspark discharge. It gives higher electrode wear rate and lower\nmetal removal\n\nA valve or transistorized circuit to switch power into the working\ngap under accurate control, enabling precise amounts of energy\nto be measured in each spark discharge\n\nAttachments designed to give visual or audible signal if\nproximity of electrode and workpiece is less than the spark gap\n\nIt indicates deviation of spark gap; arching will cause a voltage\nincrease and poor ionization of fluid will decrease the voltage\n\nIt controls the advancement of the electrode into the workpiece.\nCorrect spark gap is maintained when voltages at the working\ngap and the reference on the servo head are balance\n\n--- PDF PAGE 111 ---\nElectric Discharge Machine (EDM)-Sinking Operation NC II Revision 00 Promulgated (05/21/2019)\n107\n\nTRAINING REGULATIONS (TR)\nDOCUMENT REVISION HISTORY\n\nQualification Title:\nELECTRIC DISCHARGE MACHINE (EDM)-SINKING\nOPERATION NC II\n\nQualification Code:\nMEEESO219\n\nRevision\nNo.\nDocument\nTypes*\nQualification Title\nTESDA Board\nResolution No./\nDate\nDeployment\n(TESDA\nCircular/\nImplementing\nGuidelines)\n00\nDocument Created\n\nElectric Discharge\nMachine (EDM)\nSinking- Operation\nNC II\n2019-28 /\n05-21-2019\n\nLegend: *Description Types\n- Document Created\n\n--- PDF PAGE 112 ---\nElectric Discharge Machine (EDM)-Sinking Operation NC II Revision 00 Promulgated (05/21/2019)\n108\nACKNOWLEDGMENTS\n\nThe Technical Education and Skills Development Authority (TESDA) wishes to extend\nthanks and appreciation to the many representatives of business, industry, academe and\ngovernment agencies who donated their time and expertise to the development and validation of\nthese Training Regulations.\n\nTECHNICAL EXPERTS / TESDA EXPERTS PANEL\n\nMR. HECTOR D. MALONZO\nHDM TECHNOLOGIES INC.,\nCHAIRMAN\nMetalworking Industry Association of\nthe Phil. (MIAP), Treasurer\n\nMR. ERNESTO C. LAURENTE, JR.\nMetalworking Industry Association of\nthe Phil. (MIAP) Manila Chapter\nTESDA Accredited Trainer\n\nMR. VALENTIN P. CACHO\nMetalworking Industry Association of\nthe Phil. (MIAP) Manila Chapter\nWorkshop Instructor\nMR. RAUL B. SAMSON\nFamous Secret Precision Machining\nInc. Department Hea