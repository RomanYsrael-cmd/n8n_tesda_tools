      "source_text": "ELEMENT PERFORMANCE CRITERIA Italicized terms are elaborated in the Range of Variables REQUIRED KNOWLEDGE REQUIRED SKILLS 1. Prepare EDM- Sinking 1.1 EDM sinking type and capacity is selected according to job requirement 1.2 Oil, grease and dielectric fluid is checked according to manufacturer’s specification. 1.3 Electrical settings and parameters are set according to manufacturer’s specification. 1.4 Work holding and clamping devices are mounted according to standard operating procedures. 1.5 Operate dielectric fluid pump and set working pressure according to manufacturer’s specification 1.6 Safety procedures are applied following OSHS"
    },
    {
      "source_text": "1.1 Procedures in setting up EDM 1.2 Types and capacity of EDM 1.3 Types of oil, grease and dielectric fluids 1.4 Setting and checking of parameters according to reference table 1.5 Types of work holding and clamping device 1.6 OSH Rule No. 1080 – Personal Protective Equipment & Devices 1.7 OSH Rule No. 1150 – Materials Handling & Storage 1.8 Air pollution 1.9 Quality control OSH Rule No. 1080 – Personal Protective Equipment & Devices 1.1 Communication skills 1.2 Selecting EDM 1.3 Setting up of EDM parameters 1.4 Selecting work holding devices 1.5 Applying safety procedures"
