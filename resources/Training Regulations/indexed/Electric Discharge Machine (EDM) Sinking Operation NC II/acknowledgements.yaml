      "source_text": "SECTION 1 ELECTRIC DISCHARGE MACHINE (EDM)-SINKING OPERATION NC II QUALIFICATION"
    },
    {
      "source_text": "The Electric Discharge Machine (EDM)-Sinking Operation NC II Qualification consists of competencies that a person must achieve to set-up EDM, electrode and workpiece, perform EDM-sinking operations and perform post EDM -sinking operations."
    },
    {
      "source_text": "The units of competency comprising this qualification include the following:"
    },
    {
      "source_text": "CODE NO. BASIC COMPETENCIES 400311210 Participate in workplace communication 400311211 400311212 400311213 400311214 400311215 400311216 400311217"
    },
    {
      "source_text": "400311218 Work in a team environment Solve/address general workplace problems Develop career and life decisions Contribute to workplace innovation Present relevant information Practice occupational safety and health policies and procedures Exercise efficient and effective sustainable practices in the workplace Practice entrepreneurial skills in the workplace"
    },
    {
      "source_text": "CODE NO. COMMON COMPETENCIES MEE722201 Apply safety practices MEE722202 Interpret working drawings and sketches MEE722203 Select/ cut workshop materials MEE722204 Perform shop computations (Basic) MEE722205 MEE722206 Measure workpiece (Basic) Perform routine housekeeping MEE722207 Perform shop computations (Intermediate) MEE722208 Measure workpiece using angular measuring instruments MEE722210 Measure workpiece using gages and surface texture comparator MEE722211"
    },
    {
      "source_text": "Perform preventive and corrective maintenance CODE NO. CORE COMPETENCIES MEE 821314 Set-up Electric Discharge Machine, electrode and workpiece MEE 821315 Perform Electric Discharge Machine-sinking operations MEE 821316 Perform post Electric Discharge Machine-sinking operations"
    },
    {
      "source_text": "A person who has achieved this Qualification is competent to be a –"
    },
    {
      "source_text": "Electric Discharge Machine-Sinking Operator"
    },
