      "term": "Electric discharge machine (EDM) operation",
      "definition": "is the operation of removing metal thru electric discharge of short duration and high current density between the tool and workpiece"
    },
    {
      "term": "Electrode",
      "definition": "a formed cutting tool usually made of electrically conductive material usually carbon (graphite)"
    },
    {
      "term": "Dielectric fluid",
      "definition": "mostly of light lubricating oil of low viscosity and a non- conductor of electricity, able to rapidly ionize(vaporize) and deionize metal by removing it by flushing"
    },
    {
      "term": "Flushing",
      "definition": "process of removing eroded particles from the spark gap thru the rapid passage of dielectric fluid on a pipe or nozzle or thru electrode"
    },
    {
      "term": "Surface texture",
      "definition": "Is the surface finish on workpiece resulting from the spark duration, ie. Longer spark duration, rougher surface finish"
    },
    {
      "term": "Wear",
      "definition": "refers to the tool or electrode’s microscopic particles being carried on every spark, ie. More spark, more wear"
    },
    {
      "term": "Spark gap",
      "definition": "The distance between the face and sides of the workpiece and the electrode during machining operation"
    },
    {
      "term": "Duty cycle",
      "definition": "Is the measure of efficiency from the relationship between the on-time to the off-time of machine operation"
    },
    {
      "term": "Relaxation type circuit",
      "definition": "Depends upon the capacitor and resistance to provide the spark discharge. It gives higher electrode wear rate and lower metal removal"
    },
    {
      "term": "Pulse type circuit",
      "definition": "A valve or transistorized circuit to switch power into the working gap under accurate control, enabling precise amounts of energy to be measured in each spark discharge"
    },
    {
      "term": "Dither/Audio",
      "definition": "Attachments designed to give visual or audible signal if proximity of electrode and workpiece is less than the spark gap"
    },
    {
      "term": "Gap Monitor Meter",
      "definition": "It indicates deviation of spark gap; arching will cause a voltage increase and poor ionization of fluid will decrease the voltage"
    },
