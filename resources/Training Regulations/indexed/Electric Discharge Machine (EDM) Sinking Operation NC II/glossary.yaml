  "source_text": "1. Electric discharge\n machine (EDM) operation\nis the operation of removing metal thru electric discharge of\nshort duration and high current density between the tool and\nworkpiece\n\n2. Electrode\na formed cutting tool usually made of electrically conductive\nmaterial usually carbon (graphite)\n\n3. Dielectric fluid\nmostly of light lubricating oil of low viscosity and a non-\nconductor of electricity, able to rapidly ionize(vaporize) and\ndeionize metal by removing it by flushing\n\n4. Flushing\nprocess of removing eroded particles from the spark gap thru\nthe rapid passage of dielectric fluid on a pipe or nozzle or thru\nelectrode\n\n5. Surface texture\nIs the surface finish on workpiece resulting from the spark\nduration, ie. Longer spark duration, rougher surface finish\n\n6. Wear\nrefers to the tool or electrode’s microscopic particles being\ncarried on every spark, ie. More spark, more wear\n\n7. Spark gap\nThe distance between the face and sides of the workpiece and\nthe electrode during machining operation\n\n8. Duty cycle\n\n9. Relaxation type circuit\n\n10. Pulse type circuit\n\n11. Dither/Audio\n\n12. Gap Monitor Meter\n\n13.Servo head\n\nIs the measure of efficiency from the relationship between the\non-time to the off-time of machine operation\n\nDepends upon the capacitor and resistance to provide the\nspark discharge. It gives higher electrode wear rate and lower\nmetal removal\n\nA valve or transistorized circuit to switch power into the working\ngap under accurate control, enabling precise amounts of energy\nto be measured in each spark discharge\n\nAttachments designed to give visual or audible signal if\nproximity of electrode and workpiece is less than the spark gap\n\nIt indicates deviation of spark gap; arching will cause a voltage\nincrease and poor ionization of fluid will decrease the voltage\n\nIt controls the advancement of the electrode into the workpiece.\nCorrect spark gap is maintained when voltages at the working\ngap and the reference on the servo head are balance\n\n--- PDF PAGE 111 ---\nElectric Discharge Machine (EDM)-Sinking Operation NC II Revision 00 Promulgated (05/21/2019)\n107",
