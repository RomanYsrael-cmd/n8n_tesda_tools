      "source_text": "3.1\nCURRICULUM DESIGN\n\nTESDA shall provide the training on the development of competency-based\ncurricula to enable training providers develop their own curricula with the\ncomponents mentioned below.\n\nDelivery of knowledge requirements for the basic, common and core units of\ncompetency specifically in the areas of mathematics, science/technology,\ncommunication/language and other academic subjects shall be contextualized. To\nthis end, TVET providers shall develop a Contextual Learning Matrix (CLM) to\naccompany their curricula.\n\nCourse Title: EDM OPERATION (SINKING) NC II\n\nNominal Training Duration:\n 37 Hours Basic Competencies\n104 Hours Common Competencies\n 160 Hours Core Competencies\n Total 301 Hours\n\nCourse Description:\n\nThis course is designed to enhance the knowledge, skill and attitudes of ELECTRIC\nDISCHARGE MACHINE(EDM)-SINKING OPERATION NC II in accordance with industry\nstandards. This covers competencies that a person must achieve in performing set-up of\nEDM, electrode and workpiece, perform operation procedures, and post-EDM operations.\n\nUpon completion of the course, the learners are expected to demonstrate the\nabove-mentioned competencies to be employed. To obtain this, all units prescribed for\nthis qualification must be achieve\n\n--- PDF PAGE 80 ---\nElectric Discharge Machine (EDM)-Sinking Operation NC II Revision 00 Promulgated (05/21/2019)\n76\n\nBASIC COMPETENCIES\n(37 HOURS)\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n1. Participate in\nworkplace\ncommunication\n1.1. Obtain and convey\nworkplace\ninformation\n•\nDescribe Organizational policies\n•\nRead:\no Effective communication\no Written communication\no Communication procedures and\nsystems\n•\nIdentify:\no Different modes of communication\no Medium of communication\no Flow of communication\no Available technology relevant to the\nenterprise and the individual’s work\nres