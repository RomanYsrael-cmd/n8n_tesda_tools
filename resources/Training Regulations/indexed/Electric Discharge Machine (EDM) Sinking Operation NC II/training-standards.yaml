n 00 Promulgated (05/21/2019)\n90\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n\n10.3 Perform minor\nmachine repair\nand adjustments\n\n•\nKnow how to perform minor\nmachine repair according to\nworksite procedure\n•\nKnow how to adjust machine\nmoving parts according to\nmanufacturer’s specification\n• Lecture-Discussion\n• Practical exercise\n• Interaction\n• Demonstration\n\n• Written\nExamination\n• Oral Questioning\n\n10.4 Maintain hand\ntools\n•\nKnow how to grind cutting tools\naccording to recommended\nspecification\n\n• Lecture-Discussion\n• Practical exercise\n• Interaction\n• Demonstration\n• Written\nExamination\n• Oral Questioning\n10.5 Shut down\ncomputer\n•\nKnow how to properly shut down\ncomputer and peripheral devices\n\n• Lecture-Discussion\n• Practical exercise\n• Interaction\n• Demonstration\n\n• Written\nExamination\n• Oral Questioning\n\n--- PDF PAGE 95 ---\nElectric Discharge Machine (EDM)-Sinking Operation NC II Revision 00 Promulgated (05/21/2019)\n91\n\nCORE COMPETENCIES\n (160 HOURS)\n\nUnit of Competency\nLearning Outcomes\nLearning Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n1. Set-up EDM -Sinking,\nelectrode and\nworkpiece\n 1.1 Prepare EDM-Sinking\n• Select EDM type and capacity\n• Identify and explain types of\noil, grease and dielectric fluids\n• Explain electrical settings and\nparameters\n• Identify work holding devices\n• Operate dielectric fluid pump\nand set working pressure\n\n• Lecture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nwith oral\nquestioning\n\n24 Hours\n1.2 Prepare electrode\n• Identify and explain types of\nelectrode\n• Select and explain mounting of\nelectrode\n• Perform aligning of electrode\n\n• Lecture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nwith oral\nquestioning\n8 Hours\n1.3 Prepare workpiece\n\n• Identify and explain types of\nclamping device\n• Explain and perform mounting\nand centering of workpiece\n• Explain and perform setting of\nzero reference point\n• Enclose working tank\n\n• Lecture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nwith oral\nquestioning\n\n8 Hours\n\n--- PDF PAGE 96 ---\nElectric Discharge Machine (EDM)-Sinking Operation NC II Revision 00 Promulgated (05/21/2019)\n92\n\nUnit of Competency\nLearning Outcomes\nLearning Activities\nMethodologies\n• Assessment\nMethods\nNominal\nDuration\n2. Perform EDM -\nsinking operation\n\n2.1 Operate EDM - Sinking\n\n• Perform and explain\nsubmerging of workpiece\n• Conduct dry run and explain\nadjustments made\n• Operate EDM(sinking) and\nexplain tolerances, limits, fits\nand surface texture of\nworkpiece required\n• Explain importance of\nreplacing worn out electrode\n• Explain types of EDM\naccessories\n\n• Lecture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nwith oral\nquestioning\n\n80 hours\n\n2.2 Monitor performance of\nmachine and electrode\n•\nEnumerate power control\nunit knobs and switches\n•\nExplain importance of\nmaintaining level of dielectric\nfluid\n•\nExplain importance of\nprogressively increasing\nflushing pressure\n•\nExplain importance of\nmaintaining depth of cut\n\n• Lecture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nwith oral\nquestioning\n\n2.3 Visual inspection of\n of workpiece and\nelectrode\n\n•\nPerform the draining of\ndielectric fluid of working\ntable\n•\nExplain cleanliness of\nworkpiece\n•\nPerform visual inspection of\nworkpiece and electrode\n\n• Lecture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nwith oral\nquestioning\n\n--- PDF PAGE 97 ---\nElectric Discharge Machine (EDM)-Sinking Operation NC II Revision 00 Promulgated (05/21/2019)\n93\n\nUnit of Competency\nLearning Outcomes\nLearning Activities\nMethodologies\n• Assessment\nMethods\nNominal\nDuration\n3. Perform post-EDM-\nsinking operation\n\n3.1 Conduct post-EDM –\nsinking operation\n\n•\nPerform procedures of\nopening tank\n•\nPerform procedures of\nworkpiece removal\n•\nPerform and explain cleaning\nand drying of workpiece\nthoroughly\n\n• Lecture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nwith oral\nquestioning\n\n 40 hours\n3.2 Final check of workpiece\n\n•\nExplain kinds of precision\nmeasuring tools\n•\nPerform and explain\nprocedures of using\nmeasuring tools\n•\nExplain importance of anti-\ncorrosion agents application\n•\nExplain process of\naccomplishing report\n•\nExplain process of\nsubmitting workpiece and\naccomplishment report\n\n• Lecture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nwith oral\nquestioning\n\n3.1 EDM shutdown and\n housekeeping\n\n•\nPerform EDM shutdown\n•\nExplain proper maintenance\nand storing of tools\n•\nExplain importance of\ntagging and reporting of\ndefective tools\n•\nExplain and perform 5s\n•\nExplain and perform proper\ndisposal of waste\n\n• Lecture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nwith oral\nquestioning\n\n--- PDF PAGE 98 ---\nElectric Discharge Machine (EDM)-Sinking Operation NC II Revision 00 Promulgated (05/21/2019)\n94",
