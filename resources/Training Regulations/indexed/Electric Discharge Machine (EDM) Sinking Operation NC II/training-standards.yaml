n\n• Practical exercise\n• Interaction\n• Demonstration\n\n• Written\nExamination\n• Oral Questioning\n8 Hrs\n10.2 Perform cleaning\nand lubricating of\nmachine\n•\nKnow how to lubricate machines\nusing appropriate tools\n•\nKnow when to lubricate machines\naccording prescribe schedule\n• Lecture-Discussion\n• Practical exercise\n• Interaction\n• Demonstration\n\n• Written\nExamination\n• Oral Questioning\n\n--- PDF PAGE 94 ---\nElectric Discharge Machine (EDM)-Sinking Operation NC II Revision 00 Promulgated (05/21/2019)\n90\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n\n10.3 Perform minor\nmachine repair\nand adjustments\n\n•\nKnow how to perform minor\nmachine repair according to\nworksite procedure\n•\nKnow how to adjust machine\nmoving parts according to\nmanufacturer’s specification\n• Lecture-Discussion\n• Practical exercise\n• Interaction\n• Demonstration\n\n• Written\nExamination\n• Oral Questioning\n\n10.4 Maintain hand\ntools\n•\nKnow how to grind cutting tools\naccording to recommended\nspecification\n\n• Lecture-Discussion\n• Practical exercise\n• Interaction\n• Demonstration\n• Written\nExamination\n• Oral Questioning\n10.5 Shut down\ncomputer\n•\nKnow how to properly shut down\ncomputer and peripheral devices\n\n• Lecture-Discussion\n• Practical exercise\n• Interaction\n• Demonstration\n\n• Written\nExamination\n• Oral Questioning\n\n--- PDF PAGE 95 ---\nElectric Discharge Machine (EDM)-Sinking Operation NC II Revision 00 Promulgated (05/21/2019)\n91\n\nCORE COMPETENCIES\n (160 HOURS)\n\nUnit of Competency\nLearning Outcomes\nLearning Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n1. Set-up EDM -Sinking,\nelectrode and\nworkpiece\n 1.1 Prepare EDM-Sinking\n• Select EDM type and capacity\n• Identify and explain types of\noil, grease and dielectric fluids\n• Explain electrical settings and\nparameters\n• Identify work holding devices\n• Operate dielectric fluid