g\ntable\n•\nExplain cleanliness of\nworkpiece\n•\nPerform visual inspection of\nworkpiece and electrode\n\n• Lecture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nwith oral\nquestioning\n\n--- PDF PAGE 97 ---\nElectric Discharge Machine (EDM)-Sinking Operation NC II Revision 00 Promulgated (05/21/2019)\n93\n\nUnit of Competency\nLearning Outcomes\nLearning Activities\nMethodologies\n• Assessment\nMethods\nNominal\nDuration\n3. Perform post-EDM-\nsinking operation\n\n3.1 Conduct post-EDM –\nsinking operation\n\n•\nPerform procedures of\nopening tank\n•\nPerform procedures of\nworkpiece removal\n•\nPerform and explain cleaning\nand drying of workpiece\nthoroughly\n\n• Lecture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nwith oral\nquestioning\n\n 40 hours\n3.2 Final check of workpiece\n\n•\nExplain kinds of precision\nmeasuring tools\n•\nPerform and explain\nprocedures of using\nmeasuring tools\n•\nExplain importance of anti-\ncorrosion agents application\n•\nExplain process of\naccomplishing report\n•\nExplain process of\nsubmitting workpiece and\naccomplishment report\n\n• Lecture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nwith oral\nquestioning\n\n3.1 EDM shutdown and\n housekeeping\n\n•\nPerform EDM shutdown\n•\nExplain proper maintenance\nand storing of tools\n•\nExplain importance of\ntagging and reporting of\ndefective tools\n•\nExplain and perform 5s\n•\nExplain and perform proper\ndisposal of waste\n\n• Lecture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nwith oral\nquestioning\n\n--- PDF PAGE 98 ---\nElectric Discharge Machine (EDM)-Sinking Operation NC II Revision 00 Promulgated (05/21/2019)\n94\n\n3.2\nTRAINING DELIVERY\n\n1. The delivery of training shall adhere to the design of the curriculum. Delivery shall be\nguided by the principles of competency-based TVET.\n\na. Course design is based on competency standards set by the industry or recognized\nindustry sector; (Learning system is driven by competencies written to industry\nstandards)\n\nb. Training delivery is learner-centered and should accommodate individualized and\nself-paced learning strategies;\n\nc. Training can be done on an actual workplace setting, simulation of a workplace\nand/or through adoption of modern technology.\n\nd. Assessment is based in the collection of evidence of the performance of work to the\nindustry required standards;\n\ne. Assessment of competency takes the trainee’s knowledge and attitude into account\nbut requires evidence of actual performance of the competency as the primary\nsource of evidence.\n\nf. Training program allows for recognition of prior learning (RPL) or current\ncompetencies;\n\ng. Training completion is based on satisfactory performance of all specified\ncompetencies.\n\n2. The competency-based TVET system recognizes various types of delivery modes, both on-\nand off-the-job as long as the learning is driven by the competency standards specified by the\nindustry. The following training modalities and their variations/components may be adopted\nsingly or in combination with other modalities when designing and delivering training\nprograms:\n\n2.1 Institution-Based:\n\n•\nDual Training System (DTS)/Dualized Training Program (DTP) which contain\nboth in-school and in-industry training or fieldwork components. Details can\nbe referred to the Implementing Rules and Regulations of the DTS Law and\nthe TESDA Guidelines on the DTP;\n\n• Distance learning is a formal education process in which majority of the\ninstruction occurs when the students and instructor are not in the same place.\nDistance learning may employ correspondence study, audio, video, computer\ntechnologies or other modern technology that can be used to facilitate learning\nand formal and non-formal training. Specific guidelines on this mode shall be\nissued by the TESDA Secretariat.\n• The classroom-based or in-center instruction uses of learner-centered methods\nas well as laboratory or field-work components.\n\n--- PDF PAGE 99 ---\nElectric Discharge Machine (EDM)-Sinking Operation NC II Revision 00 Promulgated (05/21/2019)\n95\n\n2.2 Enterprise-Based:\n• Formal Apprenticeship – Training within employment involving a contract\nbetween an apprentice and an enterprise on an approved apprenticeable\noccupation.\n• Informal Apprenticeship - is based on a training (and working) agreement\nbetween an apprentice and a master craftsperson wherein the agreement may\nbe written or oral and the master craftsperson commits to training the\napprentice in all the skills relevant to his or her trade over a significant period of\ntime, usually between one and four years, while the apprentice commits to\ncontributing productively to the work of the business. Training is integrated into\nthe production process and apprentices learn by working alongside the\nexperienced craftsperson.\n\n• Enterprise-based Training- where training is implemented within the company in\naccordance with the requirements of the specific company. Specific guidelines\non this mode shall be issued by the TESDA Secretariat.\n2.3 Community-Based – Community-Based – short term programs conducted by non-\ngovernment organizations (NGOs), LGUs, training centers and other TVET\nproviders which are intended to address the specific needs of a community. Such\nprograms can be conducted in informal settings such as barangay hall, basketball\ncourts, etc. These programs can also be mobile training program (MTP).\n\n--- PDF PAGE 100 ---\nElectric Discharge Machine (EDM)-Sinking Operation NC II Revision 00 Promulgated (05/21/2019)\n96\n\n3.3 TRAINEE ENTRY REQUIREMENTS\n\nTrainees or students who wish to enter this training should possess the following\nrequirements:\n\n• Holder of any Certificate of Competency in Machining NC I or 1-year industry\n experience in machining\n• Must have completed the 10-year basic education or an Alternative Learning System\n(ALS) Certificate of Completion with grade 10 equivalent holder\n• Can communicate orally or in writing\n• Can perform basic mathematical computation\n\n3.4 LIST OF TOOLS, EQUIPMENT AND MATERIALS\n\nList of tools, equipment and materials for the training of a maximum of 20 trainees for\nElectric Discharge Machine (EDM)- Sinking Operation NC II are as follows:\n\nEQUIPMENT\nQTY\nDescription\nQTY\nDescription\n2 units Electric Discharge Machine with\ncomplete standard accessories,\n30 Amp., pulse type\n1 unit\nOverhead/LCD Projector\n1 unit\nPower Hack saw, 230 watts/ 220\nvolts, single phase\n1 set\nTable with drawer and chair\n2 units Exhaust fan, 12 x 12 inches, 220\nvolts\n\n--- PDF PAGE 101 ---\nElectric Discharge Machine (EDM)-Sinking Operation NC II Revision 00 Promulgated (05/21/2019)\n97\n\nSUPPLIES AND MATERIALS\n\nQTY\nDescription\nQTY\nDescription\nQTY\nDescription\n1 pc.\n\n20 pcs.\n\n1 pc.\n\n1 pc.\n\n1 pc.\n\n1 pc.\nGraphite Electrode\n100 x50 x50mm\n\nCopper Electrode\n100 x50 x50mm\n\nSteel Electrode\n100 x50 x50mm\n\nCarbide Electrode\n100 x50 x50mm\n\nAluminum\nElectrode\n100 x50 x50mm\n\nTungsten\nElectrode\n100 x50 x50mm\n\n20\npcs.\n\n5 pcs.\n\n5 pcs.\n\nMild Steel (MS)\nPlate\n100mm x 100mm x\n6mm\n\nAluminum Plate\n100mm x 100mm x\n6mm\n\nStainless Steel\nplate\n100mm x 100 x\n6mm\n\n400\nliters\nPetroleum based\n(dielectric fluid)\n1 set\nFirst aid kit\n5 pcs.\nPaint brush 50mm\nwidth\n5 kgs.\nRags\nTRAINING MATERIALS\n\nQTY\nDescription\nQTY\nDescription\n\nManual\n\nBrochures\n\nReference books\n\nTOOLS\n\nQTY\nDescription\nQTY\nDescription\nQTY\nDESCRIPTION\n1 set\nCombination\nwrench, Size 6mm\nto 21mm\n1 set\nNeedle file 6”\n1 set\nSpanner (for 3R\nclamping devise)\n\n1 pc.\nRubber mallet 250g\n\n1 set\nAllen wrench, Size\n4mm to 12mm\n1 pc.\nAdjustable wrench,\n150mm\n\n5 pcs.\nFlat File, 2nd cut,\n150 mm\n1 pc.\nBall peen hammer,\n500 grams\n\n--- PDF PAGE 102 ---\nElectric Discharge Machine (EDM)-Sinking Operation NC II Revision