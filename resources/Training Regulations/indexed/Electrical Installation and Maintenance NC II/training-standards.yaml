skills)\n• Practical Lab/\nExercises\n4 hours\n\n--- PDF PAGE 66 ---\nTR – Electrical Installation and Maintenance NC II (Amended) Promulgated Dec. 16, 2015 62\nUnit of Competency\nLearning Outcomes\nLearning Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n3. Install wiring\ndevices of floor\nand wall mounted\noutlets, lighting\nfixtures/switches\nand auxiliary\noutlets\n3.1 Select wiring\ndevices\n• Determine materials specification\n• Identify types and usage of electrical wiring\ndevices and consumable items\n• Interpret electrical drawing and wiring\ndiagram.\n• Describe function of every devices used in\nthe line/job requirements\n• Check and quantify the item needed in the\njob requirement.\n• Check the required rating based on its\nspecification in accordance with standard.\n\n• Lecture\n• Demonstration\n• Modular (self-\npaced)\n• Dualized-training\n• Group discussion\n• PowerPoint/Video\npresentation\n\n• Written test or\nexamination\n• Direct\nobservation and\nquestioning\n• Demonstration\n(able to impart\nknowledge and\nskills)\n• Project method\n• Practical Lab/\nExercises\n4 hours\n3.2 Install wiring\ndevices\n• Read and familiarize:\no Setting of lay-out and dimension of\nelectrical drawing or wiring diagram.\no Materials specification as per job\nrequirements.\no Proper installation of wiring devices.\no Good housekeeping.\n• Apply methods and techniques in\ninstallation of various type of wiring\ndevices\n• Practice proper handling of materials,\ntools and equipment\n• Perform the installation economically.\n\n• Lecture\n• Demonstration\n• Modular (self-\npaced)\n• Dualized-training\n• Group discussion\n• PowerPoint/Video\npresentation\n\n• Written test or\nexamination\n• Direct\nobservation and\nquestioning\n• Demonstration\n(able to impart\nknowledge and\nskills)\n• Project method\n• Practical Lab/\nExercises\n16 hours\n\n--- PDF PAGE 67 ---\nTR – Electrical Installation and Maintenance NC II (Amended) Promulgated Dec. 16, 2015 6