  "source_section_text": "SECTION 3 TRAINING ARRANGEMENTS\n\nThese standard arrangement are developed to give technical and\nvocational education and training (TVET) provides information and guidance on\nimportant requirements needed when designing training programs for Electrical\nInstallation and Maintenance NC II.\n\nThese include information on curriculum design, training delivery, trainee\nentry requirements, tools and equipment, training facilities and trainer’s\nqualification.\n\n3.1\nCURRICULUM DESIGN\n\nTESDA shall provide the training on the development of competency-\nbased curricula to training providers. This will equip them with needed knowledge\nand skills in developing their own curricula based on the components mentioned\nbelow.\n\nDelivery of knowledge requirements for the basic, common and core units\nof competency specifically in the areas of mathematics, science/technology,\ncommunication/language and other academic subjects shall be contextualized.\nTo this end, TVET providers shall develop a Contextual Learning Matrix (CLM) to\naccompany their curricula.\n\nCourse Title: Electrical Installation and Maintenance NC Level: NC II\n\nNominal Training Hours:\n\n18 Hours (Basic competencies)\n\n24 Hours (Common competencies)\n\n 154 Hours (Core competencies)\n\n Total: 196 Hours\n\nCourse Description:\n\nThis course is designed to equip individuals with operational skills in\nElectrical Installation & Maintenance NC level II particularly in installing and\nmaintaining electrical wiring, lighting and related equipment/systems in residential\nhouses/buildings where the voltage does not exceed 600 volts.\n\nTo complete the course, all units prescribed for this qualification must be\nachieved:\n\n--- PDF PAGE 50 ---\nTR – Electrical Installation and Maintenance NC II (Amended) Promulgated Dec. 16, 2015 46\nBASIC COMPETENCIES (18 Hours)\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and\nconvey workplace\ninformation\n• Describe Organizational policies\n• Group\ndiscussion\n• Oral evaluation\n2 Hours\n• Read:\no Effective communication\n• Lecture\n• Written\nexamination\n\no Written communication\n\no Communication procedures and\nsystems\n\n• Identify:\no Different modes of communication\n\no Medium of communication\no Flow of communication\n\no Available technology relevant to the\nenterprise and the individual’s work\nresponsibilities\n\n•Prepare different Types of question\n• Demonstration\n• Observation\n\n•Gather different sources of information\n\n• Apply storage system in establishing\nworkplace information\n\n• Demonstrate Telephone courtesy\n\n1.2 Complete relevant\nwork related\ndocuments\n• Describe Communication procedures and\nsystems\n• Group\ndiscussion\n• Oral evaluation\n1 hour\n\n• Read:\no Meeting protocols\n• Lecture\n• Written\nexamination\n\no Nature of workplace meetings\n\no Workplace interactions\n\no Barriers of communication\n\n--- PDF PAGE 51 ---\nTR – Electrical Installation and Maintenance NC II (Amended) Promulgated Dec. 16, 2015 47\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\n• Complete work related documents\n• Demonstration\n• Observation\n\n• Read instructions on work related\nforms/documents\n• Lecture\n• Written\nexamination\n\n• Practice:\n\no Estimate, calculate and record routine\nworkplace measures\n• Demonstration\n• Observation\n\no Basic mathematical processes of\naddition, subtraction, division and\nmultiplication\n\n• Demonstrate office activities in:\no workplace meetings and discussions\nscenario\n• Role play\n• Oral evaluation\n• Observation\n\n• Perform workplace duties scenario following\nsimple written notices\n\n• Follow simple spoken language\n• Demonstration\n• Observation\n\n• Identify the different Non-verbal\ncommunication\n• Lecture\n• Written\nexamination\n\n• Demonstrate ability to relate to people of\nsocial range in the workplace\n• Demonstration\n• Observation\n\n• Gather and provide information in response\nto workplace requirements\n\n1.3 Participate in\nworkplace\nmeeting and\ndiscussion\n• Identify:\no types of workplace documents and forms\n• Lecture\n• Written\nexamination\n1 hour\n\no kinds of workplace report\n\no Available technology relevant to the\nenterprise and the individual’s work\nresponsibilities\n\n--- PDF PAGE 52 ---\nTR – Electrical Installation and Maintenance NC II (Amended) Promulgated Dec. 16, 2015 48\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\n• Read and follow instructions in applying\nbasic mathematical concepts\n\n• Follow simple spoken language\n\n• Demonstrate ability to relate to people of\nsocial range in the workplace\n• Demonstration\n• Observation\n\n• Gather and provide information in response\nto workplace requirements\n\n2. Work in a team\nenvironment\n2.1 Describe and\nidentify team role\nand responsibility\nin a team.\n• Describe the team role and scope\n• Group\ndiscussion\n• Oral evaluation\n2 Hours\n\n• Read\no Definition of Team\n• Lecture\n• Written\nexamination\n\no Difference between team and group\n\no Objectives and goals of team\n\n• Identify different sources of information\n\n2.2 Describe work as\na team\n• Describe team goals and objectives\n• Group\ndiscussion\n• Oral evaluation\n2 Hours\n\n• Perform exercises in setting team goals and\nexpectations scenario\n• Role play\n• Oral evaluation\n• Observation\n\n• Identify:\no individual role and responsibility\n• Lecture\n• Written\nexamination\n\n• Practice Interacting effectively with others\n• Read:\no Fundamental rights at work including\ngender sensitivity\no Understanding individual competencies\nrelative to teamwork\n• Group\ndiscussion\n• Lecture\n• Oral evaluation\n• Written\nexamination\n\n--- PDF PAGE 53 ---\nTR – Electrical Installat