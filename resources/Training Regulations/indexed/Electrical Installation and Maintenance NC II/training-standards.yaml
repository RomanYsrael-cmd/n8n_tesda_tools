es and ethics (Code of\nConduct, Code of Ethics, etc.)\n\no Understanding personal objectives\n\no Understanding organizational goals\n\n• Demonstrate Intra and Interpersonal skills at\nwork\n• Demonstration\n• Observation\n\n• Demonstrate personal commitment in work\n\n3.2 Set and meet\nwork priorities\n• Describe company policies, operations,\nprocedures and standards\n• Group\ndiscussion\n• Oral evaluation\n2 Hours\n• Read:\no Time Management\no Basic strategic planning concepts\no Resource utilization and management\n\n• Lecture\n• Written\nexamination\n\n• Apply managing goals and time\n• Demonstration\n• Observation\n\n• Practice:\no economic use of resources and facilities\no time management\n\n--- PDF PAGE 54 ---\nTR – Electrical Installation and Maintenance NC II (Amended) Promulgated Dec. 16, 2015 50\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\n3.3 Maintain\nprofessional\ngrowth and\ndevelopment\n• Describe company recognition and\nincentives\n• Group\ndiscussion\n• Oral evaluation\n2 Hours\n\n• Read:\n• Lecture\n• Written\nexamination\n\no Career development opportunities\no Information on relevant licenses and or\ncertifications\no personal career development needs\n\n• Identify career opportunities\n\n• Determine personal career development\nneeds\n• Group\ndiscussion\n\n• Oral evaluation\n\n4. Practice\noccupational\nhealth and\nsafety\n4.1 Identify hazard\nand risks\n• Describe OHS procedures, practices and\nregulations\n• Group\ndiscussion\n• Oral evaluation\n1 hour\n\n•Read\n• Lecture\n• Written\nexamination\n\no OHS indicators\n\no Organizational contingency practices\n\n• Practice hazards/risks identification and\ncontrol\n\n4.2 Evaluate hazard\nand risks\n• Describe effects of safety hazards\n• Group\ndiscussion\n• Oral evaluation\n1 hour\n\n•Read\n• Lecture\n• Written\nexamination\n\no Threshold Limit Value –TLV\n\n• Practice reporting safety hazards\n• Role play\n• Observa