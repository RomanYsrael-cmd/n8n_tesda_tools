      "number": "4.1",
      "text": "NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS 4.1.1. To attain the National Qualification of Electrical Installation & Maintenance NC II, the candidate must demonstrate competence in all the units listed in Section 1. Successful candidates shall be awarded a National Certificate II signed by the TESDA Director General. 4.1.2. The qualification of Electrical Installation & Maintenance NC II can be attained through demonstration of competence through project-type assessment covering all the required units of the qualification. 4.1.3. Assessment shall focus on the core units of competency. The basic and common units shall be integrated or assessed concurrently with the core units. 4.1.4. The following are qualified to apply for assessment and certification:  Graduate of formal, non-formal and informal including enterprise- based education/training programs/courses.  Experienced workers (wage employed or self-employed) 4.1.5. For those holders of existing National Certificate (NC) of individuals in Electrical Installation and Maintenance NC II, automatic conversion will be implemented. 4.1.6. Clustering of competencies is not applicable. 4.1.7. Individuals who already possess Certificate of Competency (COC) in Electrical Installation & Maintenance NC II are advised to take the assessment for this amended TR on or before the expiration of their COCs. 4.1.8. The guidelines on assessment and certification are discussed in detail in the “Procedures Manual on Assessment and Certification” and “Guidelines on the Implementation of the Philippine TVET Competency Assessment and Certification System (PTCACS)”."
    },
    {
      "number": "4.2",
      "text": "COMPETENCY ASSESSMENT REQUISITE 4.2.1 Self-Assessment Guide. The self-assessment guide (SAG) is accomplished by the candidate prior to actual competency assessment. SAG is a pre-assessment tool to help the candidate and the assessor determine what evidence is available, where gaps exist, including readiness for assessment. This document can: a. Identify the candidate’s skills and knowledge b. Highlight gaps in candidate’s skills and knowledge c. Provide critical guidance to the assessor and candidate on the evidence that need to be presented d. Assist the candidate to identify key areas in which practice is needed or additional information or skills that should be gained prior` 4.2.2 Accredited Assessment Center. Only Assessment Center accredited by TESDA is authorized to conduct competency assessment. Assessment centers undergo a quality assured procedure for accreditation before they are authorized by TESDA to manage the assessment for National Certification. 4.2.3 Accredited Competency Assessor. Only accredited competency assessor is authorized to conduct assessment of competence. Competency assessors undergo a quality assured system of accreditation procedure before they are authorized by TESDA to assess the competencies of candidates for National Certification. ELECTRICAL INSTALLATION & MAINTENANCE NC II"
