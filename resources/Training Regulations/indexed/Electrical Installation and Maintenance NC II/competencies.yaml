d\nenvironmental\naspects of production\nprocesses\n• Fault identification\nand reporting\n• Workplace procedure\nin documenting\ncompleted work\n• Workplace Quality\nIndicators\n• Carry out work in\naccordance with\nOHS policies\nand procedures\n\n--- PDF PAGE 28 ---\nTESDA-SOP-QSO-01-F08\nTR – Electrical Installation and Maintenance NC II (Amended) Promulgated Dec. 16, 2015 24\nELEMENT\nPERFORMANCE CRITERIA\nItalicized Bold terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n3. Engage in\nquality\nimprovement\n3.1. Process improvement\nprocedures are participated\nin relation to workplace\nassignment\n3.2. Work is carried out in\naccordance with process\nimprovement procedures\n3.3. Performance of operation or\nquality of product or service\nto ensure customer\nsatisfaction is monitored\n• Quality improvement\nprocesses\n• Company customers\ndefined\n• Solution\nproviding and\ndecision-making\n• Practice\ncompany\nprocess\nimprovement\nprocedure\n\n--- PDF PAGE 29 ---\nTESDA-SOP-QSO-01-F08\nTR – Electrical Installation and Maintenance NC II (Amended) Promulgated Dec. 16, 2015 25\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Materials/components\n1.1. Materials may include but not limited to:\n1.1.1. wires\n1.1.2. cables, soldering lead\n1.1.3. electrical tape\n1.2. Components may include but not limited to:\n1.2.1. ICs\n1.2.2. Diodes\n2. Faults\nFaults may include but not limited to:\n2.1. Components/materials not according to specification\n2.2. Components/materials contain manufacturing\ndefects\n2.3. Components/materials do not conform with\ngovernment regulation i.e., PEC, environmental\ncode\n2.4. Components/materials have safety defect\n3. Documentation\n3.1. Organization work procedures\n3.2. Manufacturer’s instruction manual\n3.3. Customer requirements\n3.4. Forms\n4. Quality standards\n4.1. Quality standards may relate but not limited to the\nfollowing:\n4.1.1. materials\n4.1.2. component parts\n4.1.3. final product\n4.1.4. production processes\n5. Customer\n5.1. Co-worker\n5.2. Supplier\n5.3. Client\n5.4. Organization receiving the product or service\n\n--- PDF PAGE 30 ---\nTESDA-SOP-QSO-01-F08\nTR – Electrical Installation and Maintenance NC II (Amended) Promulgated Dec. 16, 2015 26\nEVIDENCE GUIDE\n\n1. Critical aspect of\ncompetency\nAssessment must show that the candidate:\n\n1.1. Carried out work in accordance with the\ncompany’s standard operating procedures\n1.2. Performed task according to specifications\n1.3. Reported defects detected in accordance with\nstandard operating procedures\n1.4. Carried out work in accordance with the process\nimprovement procedures\n2. Method of assessment\n2.1. The assessor may select two (2) of the following\nassessment methods to objectively assess the\ncandidate:\n2.1.1. Observation\n2.1.2. Questioning\n2.1.3. Practical demonstration\n3. Resource implication\n\n3.1. Materials and component parts and equipment to\nbe used in a real or simulated electronic\nproduction situation\n4. Context of Assessment\n\n4.1. Assessment may be conducted in the workplace\nor in a simulated environment.\n\n--- PDF PAGE 31 ---\nTESDA-SOP-QSO-01-F08\nTR – Electrical Installation and Maintenance NC II (Amended) Promulgated Dec. 16, 2015 27\nUNIT TITLE\n:\nTERMINATE AND CONNECT ELECTRICAL WIRING AND\nELECTRONICS CIRCUIT\nUNIT CODE\n:"
