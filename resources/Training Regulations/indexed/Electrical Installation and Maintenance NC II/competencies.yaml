        },
        "source_text": "ELC741303\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes on\nselecting and installing wiring devices, installing lighting\nfixtures/switches and notifying completion of work of floor\nand wall mounted outlets and auxiliary outlets.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Select\nwiring\ndevices\n\n1.1 Drawings are read and\ninterpreted to determine job\nrequirements\n1.2 Correct type and quantity of\nwiring devices and\nconsumable items are\nidentified in line with job\nrequirements\n1.3 Tools and equipment are\nselected in line with job\nrequirements\n1.4 Correct PPE are identified\nand selected in line with\nsafety requirements\n• Blue print reading\n• Materials\nspecification\n• Types and uses of\nelectrical wiring\ndevices, tools and\nequipment\n• Proper PPEs\n\n• Interpreting plans\nand details\n• Handling of\nmaterials, tools and\nequipment\n• Communication\n(written and oral)\n• Selecting wiring\ndevices\n\n2. Install wiring\ndevices\n\n2.1 Safety procedures are\nfollowed based on safety\nregulations\n2.2 Correct procedures for\ninstallation of wiring\ndevices are performed in\nline with job requirements\n2.3 Schedule of work is followed\nbased on agreed time,\nquality standard and\nminimum wastage\n2.4 Further instructions are\nsought if unplanned\nevents or conditions occur\n2.5 On-going checking of quality\nof work is done in\naccordance with instructions\nand requirements.\n\n• Installation\nprocedures of\nvarious wiring\ndevices\n• DOLE Department\nOrder No. 13 s.\n1998 Guidelines\nGoverning\nOccupational Safety\nand Health in the\nConstruction\nIndustry\n• PEC requirement\nregarding installation\nof wiring devices\n• Applying methods\nand techniques in\nvarious type of\nwiring devices\n• Checking and\nconforming the\ninstallation based\non job\nrequirement\n\n--- PDF PAGE 46 ---\nTESDA-SOP-QSO-01-F08\nTR – Electrical Installation and Maintenance NC II (Amended) Promulgated Dec. 16, 2015 42\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n3. Install\nlighting\nfixture/\nswitches\n3.1 Safety procedures are\nfollowed\n3.2 Correct procedures for\ninstallation of lighting\nfixtures/switches are\nperformed in line with job\nrequirements\n3.3 Schedule of work is followed\nto ensure work is completed\nin an agreed time, to a\nquality standard and with a\nminimum waste\n3.4 Further instructions are\nsought from a supervisor if\nunplanned events or\nconditions occur\n3.5 On-going checks of quality of\nwork are undertaken in\naccordance with instructions\nand requirements\n\n• Types of lighting\nfixtures and\ninstallation\ntechnique\n• Installation\nprocedures of\nvarious lighting\nfixtures/switches\n• Ratings of lighting\nfixture\n• DOLE Department\nOrder No. 13 s.\n1998 Guidelines\nGoverning\nOccupational Safety\nand Health in the\nConstruction\nIndustry\n• PEC requirement\nregarding installation\nof various lighting\nfixtures/switches\n\n• Applying methods\nand techniques in\nvarious type of\nlighting fixtures/\nswitches\n• Checking and\nconforming the\ninstallation based\non job\nrequirement\n• Installing lighting\nfixture and switches\n\n4. Notify\ncompletion\nof work\n\n4.1 Final checks are made to\nensure that work conforms\nwith instructions and to\nrequirements\n4.2 Supervisor is notified upon\ncompletion of work\n4.3 Tools, equipment and any\nsurplus resources and\nmaterials are, where\nappropriate, cleaned,\nchecked and returned to\nstorage in accordance with\nestablished procedures\n4.4 Work area is cleaned and\nmade safe\n\n• Processes,\nOperations, Systems\no Maintenance of\ntools\no Storage of tools\n• Checked and\nconformed the\ninstallation based on\njob requirement\n• Good housekeeping\n\n• Performing\ncommissioning\nactivity\n\n--- PDF PAGE 47 ---\nTESDA-SOP-QSO-01-F08\nTR – Electrical Installation and Maintenance NC II (Amended) Promulgated Dec. 16, 2015 43\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Wiring devices and\nconsumable items\n\n1.1 Wiring devices\n1.1.1 Floor outlet\n1.1.2 Ground fault current interrupting device\n1.1.3 Grounding type convenience outlet\n1.1.4 Light switches\n1.2 Consumable items\n1.2.1 Wire nut\n1.2.2 Electrical tape\n1.2.3 rubber tape\n2. Tools and equipment\n2.1 Pliers\n2.2 Screwdrivers\n2.3 Wire splicers\n2.4 Electrician knives\n3. Personal protective\nequipment (PPE)\n\nMay include but not limited to:\n3.1 Working gloves\n3.2 Safety shoes\n3.3 Hard hat\n4. Safety procedures\nIncludes Safety procedures in:\n4.1 Philippine Electrical Code\n4.2 Safety standards\n5. Installation of wiring\ndevices\n5.1 Horizontally and vertically aligned\n5.2 No gap between plate cover and wall\n5.3 Wire cut to requirement\n5.4 All bolts tightened for rigid mounting\n6\nInstallation of lighting\nfixtures/switches\n6.1 Lamps\n-\nHorizontally aligned against wall\n-\nNo gap between ceiling and lighting fixture\nbase\n-\nWiring at junction box cut to requirement as\nrequired\n-\nLamps securely mounted\n6.2 Spotlights\n-\nHorizontally aligned against wall\n-\nNo gap between ceiling and lighting fixture\nbase\n-\nWiring at junction box cut to requirement as\nrequired\n-\nFloodlights/spotlights securely mounted\n6.3 Track Lights\n-\nWiring at junction box cut to requirement as\nrequired\n-\nTrack light mounted securely\n6.4 Perimeter Lighting\n-\nPerimeter lighting installed as per plan/shop\n-\nFoundation constructed as per plan\n-\nFixture wired and tested\n-\nFixture mounted to pole\n\n--- PDF PAGE 48 ---\nTESDA-SOP-QSO-01-F08\nTR – Electrical Installation and Maintenance NC II (Amended) Promulgated Dec. 16, 2015 44\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Correctly interpreted work instructions\n1.1 Selected appropriate tools, equipment and\nmaterials for installing wiring devices and lighting\nfixtures/switches and auxiliary outlet\n1.3 Selected and used correct PPE\n1.2 Demonstrated correct procedures for installation\nof wiring devices and lighting fixtures/switches\n1.5 Followed safety procedures/protocol\n1.6 Cleaned worksite, tools and equipment\n1.7 Stored surplus materials\n2. Resource Implications\nThe following resources MUST be provided:\n2.1 Workplace location\n2.2 Tools and equipment appropriate for installation of\nwiring devices and lighting fixtures/switches\n2.3 Materials relevant to the proposed activity\n2.4 Drawings and specifications relevant to the task\n3. Methods of\nAssessment\nCompetency must be assessed through:\n3.1 Direct observation of application of tasks\n3.2 Questions related to underpinning knowledge\n3.3 Demonstration/Practical activity\n3.4 Written test\n4. Context for\nAssessment\n4.1 Competency may be assessed in the workplace or\nin a simulated workplace setting\n4.2 Assessment shall be observed while the tasks are\nbeing undertaken either individually or as part of a\nteam under limited supervisions\n\n--- PDF PAGE 49 ---\nTR – Electrical Installation and Maintenance NC II (Amended) Promulgated Dec. 16, 2015 45"
