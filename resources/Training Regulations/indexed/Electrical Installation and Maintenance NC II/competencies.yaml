        "evidence_guide": {
          "source_text": "1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Explained clearly established workplace safety\nand hazard control practices and procedures\n1.2 Identified hazards/risks in the workplace and its\ncorresponding indicators in accordance with\ncompany procedures\n1.3 Recognized contingency measures during\nworkplace accidents, fire and other\nemergencies\n1.4 Identified terms of maximum tolerable limits\nbased on threshold limit value- TLV.\n1.5 Followed Occupational Health and Safety\n(OHS) procedures for controlling hazards/risks\nin workplace\n1.6 Used Personal Protective Equipment (PPE) in\naccordance with company OHS procedures\nand practices\n1.7 Completed and updated OHS personal records\nin accordance with workplace requirements\n2. Resource Implications\nThe following resources must be provided:\n2.1 Workplace or assessment location\n2.2 OHS personal records\n2.3 PPE\n4.4 Health records\n3. Methods of\nAssessment\nCompetency may be assessed through:\n3.1 Portfolio Assessment\n3.2 Interview\n3.3 Case Study/Situation\n4. Context for\nAssessment\nCompetency may be assessed in the work place or\nin a simulated work place setting\n\n--- PDF PAGE 19 ---\nTESDA-SOP-QSO-01-F08\nTR – Electrical Installation and Maintenance NC II (Amended) Promulgated Dec. 16, 2015 15\n COMMON COMPETENCIES\n\nUNIT TITLE\n: USE HAND TOOLS\nUNIT CODE\n:"
        },
        "source_text": "500311108\nUNIT DESCRIPTOR : This unit covers the outcomes required to comply with\nregulatory and organizational requirements for\nOccupational health and safety.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Identify\nhazards and\nrisks\n1.1 Safety regulations and\nworkplace safety and hazard\ncontrol practices and\nprocedures are clarified and\nexplained based on\norganization procedures\n1.2 Hazards/risks in the workplace\nand their corresponding\nindicators are identified to\nminimize or eliminate risk to co-\nworkers, workplace and\nenvironment in accordance with\norganization procedures\n1.3 Contingency measures during\nworkplace accidents, fire and\nother emergencies are\nrecognized and established in\naccordance with organization\nprocedures\n• OHS procedures\nand practices and\nregulations\n• Hazards/risks\nidentification and\ncontrol\n• OHS indicators\n• Organizational\ncontingency\npractices\n\n• Hazards/risks\nidentification and\ncontrol skills\n• Practice of safety\nand health\nprocedures and\npersonal hygiene\n\n2. Evaluate\nhazards and\nrisks\n2.1 Terms of maximum tolerable\nlimits which when exceeded will\nresult in harm or damage are\nidentified based on threshold\nlimit values (TLV)\n2.2 Effects of the hazards are\ndetermined\n2.3 OHS issues and/or concerns\nand identified safety hazards\nare reported to designated\npersonnel in accordance with\nworkplace requirements and\nrelevant workplace OHS\nlegislation\n• Threshold Limit\nValue (TLV)\n• Effects of safety\nhazards\n\n• Communication\nskills\n• Reporting safety\nhazards\n3. Control\nhazards and\nrisks\n3.1 Occupational Health and Safety\n(OHS) procedures for\ncontrolling hazards/risks in\nworkplace are consistently\nfollowed\n3.2 Procedures for dealing with\nworkplace accidents, fire and\nemergencies are followed in\naccordance with organization\nOHS policies\n• Personal hygiene\npractices\n• Organization safety\nand health protocol\n• Company\nemergency\nprocedure practices\n• Practice of\npersonal hygiene\n• Respond to\nemergency\n\n--- PDF PAGE 16 ---\nTESDA-SOP-QSO-01-F08\nTR – Electrical Installation and Maintenance NC II (Amended) Promulgated Dec. 16, 2015 12\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n\n3.3 Personal protective\nequipment (PPE) is correctly\nused in accordance with\norganization OHS procedures\nand practices\n3.4 Appropriate assistance is\nprovided in the event of a\nworkplace emergency in\naccordance with established\norganization protocol\n4. Maintain\nOHS\nawareness\n4.1 Emergency-related drills and\ntrainings are participated in as\nper established organization\nguidelines and procedures\n4.2 OHS personal records are\ncompleted and updated in\naccordance with workplace\nrequirements\n\n• Workplace OHS\npersonal records\n• Information on\nemergency-related\ndrills\n• Practice\nemergency-\nrelated drill skills\nin the workplace\n\n--- PDF PAGE 17 ---\nTESDA-SOP-QSO-01-F08\nTR – Electrical Installation and Maintenance NC II (Amended) Promulgated Dec. 16, 2015 13\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1.\nSafety\nregulations\nMay include but are not limited to:\n1.1 Clean Air Act\n1.2 Building code\n1.3 National Electrical and Fire Safety Codes\n1.4 Waste management statutes and rules\n1.5 Philippine Occupational Safety and Health Standards\n1.6 DOLE regulations on safety legal requirements\n1.7 ECC regulations\n2.\nHazards/Risks\nMay include but are not limited to:\n2.1 Physical hazards – impact, illumination, pressure,\nnoise, vibration, temperature, radiation\n2.2 Biological hazards- bacteria, viruses, plants, parasites,\nmites, molds, fungi, insects\n2.3 Chemical hazards – dusts, fibers, mists, fumes, smoke,\ngasses, vapors\n2.4 Ergonomics\n• Psychological factors – over exertion/ excessive\nforce, awkward/static positions, fatigue, direct\npressure, varying metabolic cycles\n• Physiological factors – monotony, personal\nrelationship, work out cycle\n3. Contingency\nmeasures\nMay include but are not limited to:\n3.1 Evacuation\n3.2 Isolation\n3.3 Decontamination\n3.4 (Calling designed) emergency personnel\n4.\nPPE\nMay include but are not limited to:\n4.1 Mask\n4.2 Gloves\n4.3 Goggles\n4.4 Hard Hat\n\n4.5 Face mask/shield\n4.6 Ear muffs\n4.7 Reflectorized vest\n4.8 Safety shoes\n4.9 Safety harness\n5. Emergency-related\ndrills and training\n5.1 Fire drill\n5.2 Earthquake drill\n5.3 Basic life support/CPR\n5.4 First aid\n5.5 Spillage control\n5.6 Decontamination of chemical and toxic\n5.7 Disaster preparedness/management\n6. OHS personal\nrecords\n6.1 Medical/Health records\n6.2 Incident reports\n6.3 Accident reports\n6.4 OHS-related training completed\n\n--- PDF PAGE 18 ---\nTESDA-SOP-QSO-01-F08\nTR – Electrical Installation and Maintenance NC II (Amended) Promulgated Dec. 16, 2015 14\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Explained clearly established workplace safety\nand hazard control practices and procedures\n1.2 Identified hazards/risks in the workplace and its\ncorresponding indicators in accordance with\ncompany procedures\n1.3 Recognized contingency measures during\nworkplace accidents, fire and other\nemergencies\n1.4 Identified terms of maximum tolerable limits\nbased on threshold limit value- TLV.\n1.5 Followed Occupational Health and Safety\n(OHS) procedures for controlling hazards/risks\nin workplace\n1.6 Used Personal Protective Equipment (PPE) in\naccordance with company OHS procedures\nand practices\n1.7 Completed and updated OHS personal records\nin accordance with workplace requirements\n2. Resource Implications\nThe following resources must be provided:\n2.1 Workplace or assessment location\n2.2 OHS personal records\n2.3 PPE\n4.4 Health records\n3. Methods of\nAssessment\nCompetency may be assessed through:\n3.1 Portfolio Assessment\n3.2 Interview\n3.3 Case Study/Situation\n4. Context for\nAssessment\nCompetency may be assessed in the work place or\nin a simulated work place setting\n\n--- PDF PAGE 19 ---\nTESDA-SOP-QSO-01-F08\nTR – Electrical Installation and Maintenance NC II (Amended) Promulgated Dec. 16, 2015 15\n COMMON COMPETENCIES\n\nUNIT TITLE\n: USE HAND TOOLS\nUNIT CODE\n:"
