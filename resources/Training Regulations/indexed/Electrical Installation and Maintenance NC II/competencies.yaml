        "source_text": "--- PDF PAGE 6 ---\nTESDA-SOP-QSO-01-F08 \nTR – Electrical Installation and Maintenance NC II (Amended)    Promulgated Dec. 16, 2015          2 \nSECTION 2 \nCOMPETENCY STANDARDS \n \nThis section gives the details of the contents of the units of competency required \nin ELECTRICAL INSTALLATION & MAINTENANCE NC II.  These units of competency \nare categorized into basic, common and core competencies. \n \nBASIC COMPETENCIES \n \nUNIT OF COMPETENCY :    PARTICIPATE IN WORKPLACE COMMUNICATION \nUNIT CODE \n     :    500311105 \nUNIT DESCRIPTOR      : This unit covers the knowledge, skills and attitudes   \nrequired to gather, interpret and convey information in \nresponse to workplace requirements. \nELEMENT \nPERFORMANCE CRITERIA\nItalicized terms are elaborated in \nthe Range of Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS\n1. Obtain and \nconvey \nworkplace \ninformation \n1.1 Specific and  relevant \ninformation is accessed \nfrom appropriate sources \n1.2 Effective questioning , \nactive listening and \nspeaking skills are used to \ngather and convey \ninformation \n1.3 Appropriate medium is \nused to transfer information \nand ideas \n1.4 Appropriate non- verbal \ncommunication is used \n1.5 Appropriate lines of \ncommunication with \nsupervisors and colleagues \nare identified and followed \n1.6 Defined workplace \nprocedures for the location \nand storage of information \nare used \n1.7 Personal interaction is \ncarried out clearly and \nconcisely \n Effective \ncommunication \n Different modes of \ncommunication  \n Written \ncommunication \n Organizational \npolicies \n Sources of \ninformation \n Types of question \n Medium of \ncommunication \n Flow of \ncommunication \n Storage system \n Telephone courtesy \n Follow simple \nspoken language \n Performing routine \nworkplace duties \nfollowing simple \nwritten notices \n Ability to relate to \npeople of social \nrange in the \nworkplace \n Gather and provide \ninformation in \nresponse to \nworkplace \nrequirements \n Listening skills \n Questioning skills \n Workplace \nlanguage skills \n2. Participate \nin workplace \nmeetings \nand \ndiscussions \n2.1 Team meetings are \nattended on time \n2.2 Own opinions are clearly \nexpressed and those of \nothers are listened to \nwithout interruption \n2.3 Meeting inputs are \nconsistent with the meeting \npurpose and established \nprotocols \n2.4 Workplace interactions \nare conducted in a \ncourteous manner  \n Communication \nprocedures and \nsystems \n Meeting protocols \n Nature  of \nworkplace meetings \n Barriers of \ncommunication \n Workplace \ninteractions \n Non-verbal \ncommunication \n Ability to relate to \npeople of social \nrange in the \nworkplace  \n Interpersonal \ncommunication skill \n Observing meeting \nprotocols\n\n--- PDF PAGE 7 ---\nTESDA-SOP-QSO-01-F08 \nTR – Electrical Installation and Maintenance NC II (Amended)    Promulgated Dec. 16, 2015          3 \nELEMENT \nPERFORMANCE CRITERIA\nItalicized terms are elaborated in \nthe Range of Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS\n2.5 Questions about simple \nroutine workplace \nprocedures and maters \nconcerning working \nconditions of employment \nare asked and responded \nto \n2.6 Meetings outcomes are \ninterpreted and \nimplemented \n3. Complete \nrelevant \nwork related \ndocuments \n3.1 Range of forms relating to \nconditions of employment \nare completed accurately \nand legibly \n3.2 Workplace data is recorded \non standard workplace \nforms and documents \n3.3 Basic mathematical \nprocesses                             \nare used for routine \ncalculations \n3.4 Errors in recording \ninformation on forms/ \ndocuments are identified \nand properly acted upon \n3.5 Reporting requirements to \nsupervisor are completed \naccording to organizational \nguidelines \n Technology \nrelevant to the \nenterprise and the \nindividual’s work \n Types of workplace  \ndocuments and \nforms \n Basic mathematical \nconcepts \n Kinds of workplace \nreport \n \n \n Apply basic \nmathematical \nprocesses of \naddition, \nsubtraction, division \nand multiplication \n Data recording \n Report writing\n\n--- PDF PAGE 8 ---\nTESDA-SOP-QSO-01-F08 \nTR – Electrical Installation and Maintenance NC II (Amended)    Promulgated Dec. 16, 2015          4 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Appropriate sources \n1.1. \nTeam members \n1.2. \nSuppliers \n1.3. \nTrade personnel \n1.4. \nLocal government \n1.5.\nIndustry bodies\n2. Medium \n2.1. \nMemorandum \n2.2. \nCircular \n2.3. \nNotice \n2.4. \nInformation discussion \n2.5. \nFollow-up or verbal  instructions \n2.6.\nFace to face communication\n3. Storage \n3.1. \nManual filing system \n3.2.\nComputer-based filing system\n4. Forms \n4.1. \nPersonnel forms, telephone message forms, safety \nreports \n5. Workplace \ninteractions \n5.1. \nFace to face \n5.2. \nTelephone \n5.3. \nElectronic and two way radio \n5.4. \nWritten including electronic, memos, instruction and \nforms, non-verbal including gestures, signals, signs \nand diagrams\n6. Protocols \n6.1. \nObserving meeting \n6.2. \nCompliance with meeting decisions \n6.3.\nObeying meeting instructions\n \n \nEVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1. Prepared written communication following standard \nformat  of the organization \n1.2. Accessed information using communication equipment \n1.3. Made use of relevant terms as an aid to transfer \ninformation effectively \n1.4. Conveyed information effectively adopting the formal \nor informal communication\n2. Resource \nImplications \n2.1. Fax machine \n2.2. Telephone \n2.3. Writing materials \n2.4.\nInternet\n3. Methods of \nAssessment \n3.1. Direct Observation \n3.2. Oral interview and written test \n4. Context of \nAssessment \nCompetency may be assessed individually in the actual \nworkplace or through accredited institution\n",
