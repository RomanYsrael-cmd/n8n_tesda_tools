uality \nstandard and with a minimum \nwaste \n2.4 Further instructions are \nsought from a supervisor if \nunplanned events or \nconditions occur \n2.5 On-going checks of quality of \nwork are done in accordance \nwith instructions and \nrequirements \n \n DOLE Department  \nOrder No. 13 s. 1998 \nGuidelines Governing \nOccupational Safety \nand Health  in the \nConstruction  Industry \n Philippine Electrical \nCode (PEC) \nrequirements \nregarding installation \nof electrical protection \ndevices \n Uses of different \nprotective devices-  \no panelboard;  \no circuit breaker;  \no safety switch;  \no ground fault \ncurrent interrupting \ndevice (GFCI); and \no conventional \natmospheric \nlightning protection \nand grounding \nsystem \n \n Interpreting \nplans and details \ndrawing. \n Applying \nmethods and \ntechniques in \ninstallation of \nvarious type of \nprotective \ndevices and \nlightning \nprotection and \ngrounding \nsystems \n Performing the      \ninstallation       \neconomically.\n\n--- PDF PAGE 42 ---\nTESDA-SOP-QSO-01-F08 \nTR – Electrical Installation and Maintenance NC II (Amended)    Promulgated Dec. 16, 2015          38 \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the \nRange of Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n3. Install \nlighting \nfixture and \nauxiliary \noutlet. \n3.1 Safety procedures are \nfollowed \n3.2 Correct procedures for \ninstallation of lighting fixture \nand auxiliaries are performed \nin line with job requirements \n3.3 Schedule of work is followed \nto ensure work is completed \nin an agreed time, to a quality \nstandard and with a minimum \nwaste \n3.4 Further instructions are \nsought from a supervisor if \nunplanned events or \nconditions occur. \n3.5 On-going checks of quality of \nwork are undertaken in \naccordance with instructions \nand requirements. \n DOLE Department  \nOrder No. 13 s. 1998 \nGuidelines Governing \nOccupational Safety \nand Health  in the \nCons