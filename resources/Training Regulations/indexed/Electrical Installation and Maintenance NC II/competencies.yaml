        "source_title": "TERMINATE AND CONNECT ELECTRICAL WIRING AND ELECTRONICS CIRCUIT",
        "source_text": "--- PDF PAGE 31 ---\nTESDA-SOP-QSO-01-F08 \nTR – Electrical Installation and Maintenance NC II (Amended)    Promulgated Dec. 16, 2015          27 \nUNIT TITLE \n: \nTERMINATE AND CONNECT ELECTRICAL WIRING AND \nELECTRONICS CIRCUIT \nUNIT CODE \n: \nELC311206 \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge, skills, (and) attitudes and \nvalues needed to terminate and connect electrical wiring and \nelectronic circuits \n \n \nELEMENT \nPERFORMANCE CRITERIA\nItalicized terms are elaborated in \nthe Range of Variables \n \nREQUIRED \nKNOWLEDGE \n \nREQUIRED \nSKILLS \n1. Plan and \nprepare for \ntermination/ \nconnection of \nelectrical \nwiring/electronic\ns circuits \n1.1. Materials are checked \naccording to specifications \nand tasks \n1.2. Appropriate tools and \nequipment are selected \naccording to tasks \nrequirements \n1.3. Task is planned to ensure \nOH & S guidelines and \nprocedures are followed \n1.4. Electrical wiring/electronic \ncircuits are correctly \nprepared for \nconnecting/termination in \naccordance with \ninstructions and work site \nprocedures \n Use of tools \n Use of test \ninstruments/ \nequipment \n Electrical theory \n Principals of AC and \nDC \n OH & S guidelines and \nprocedures  \n Basic electrical and \nelectronic devices \n Reading skills \nrequired to \ninterpret work \ninstruction \n Checking \nmaterials for \nconformance to \nspecifications \n Checking existing \nand new \ninstallation site for \ncorrect location \nand specification \n2. Terminate/ \nconnect \nelectrical wiring/ \nelectronic \ncircuits \n2.1. Safety procedures in using \ntools are observed at all \ntimes and appropriate \npersonal protective \nequipment are used \n2.2. Work is undertaken safely \nin accordance with the \nworkplace and standard \nprocedures \n2.3. Appropriate range of \nmethods in termination/ \nconnection are used \naccording to specifications, \nmanufacturer’s \nrequirements and safety \n2.4. Correct sequence of \noperation is followed \n2.5. Accessories used are \nadjusted, if necessary \n2.6. Confirmed \ntermination/connection is \nundertaken successfully in \naccordance with job \nspecification \n \n Wiring techniques \n OH & S principles \n Use of lead-free \nsoldering technology \n Surface mount \nsoldering techniques \n Specifications and \nmethods for \nterminating different \nmaterials \n Communication \nskills \n Marking, tagging \nand labeling \nrequirements for \ncables, wires, \nconductors and \nconnections \n Soldering \ntechniques \n Adjusting and \nfixing wiring \nsupports\n\n--- PDF PAGE 32 ---\nTESDA-SOP-QSO-01-F08 \nTR – Electrical Installation and Maintenance NC II (Amended)    Promulgated Dec. 16, 2015          28 \nELEMENT \nPERFORMANCE CRITERIA\nItalicized terms are elaborated in \nthe Range of Variables \n \nREQUIRED \nKNOWLEDGE \n \nREQUIRED \nSKILLS \n3. Test \ntermination/ \nconnections of \nelectrical wiring/ \nelectronics \ncircuits \n3.1. Testing of all completed \ntermination/ connections \nof electric wiring/electronic \ncircuits is conducted for \ncompliance with \nspecifications and \nregulations using \nappropriate procedures \nand equipment \n3.2. Wiring and circuits are \nchecked using specified \ntesting procedures \n3.3. Unplanned events or \nconditions are responded \nto in accordance with \nestablished procedures \n AC and DC power \nsupplies \n Uses of diagnostic \nequipment \n Tests for wiring and \nconnections  \n Wiring support \ntechniques and \nalternatives  \n Printed circuit \nboard repair and \ntechniques \n Electronic \nassembly \nfunctional and \nquality testing \n Testing of wiring \nand connections \nfor conformance \nto specification\n\n--- PDF PAGE 33 ---\nTESDA-SOP-QSO-01-F08 \nTR – Electrical Installation and Maintenance NC II (Amended)    Promulgated Dec. 16, 2015          29 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Materials \n1.1 \nMaterials included the following but not limited to: \n1.1.1 Soldering lead \n1.1.2 Cables \n1.1.3 Wires \n2. Tools and equipment \n2.1 \nTools for measuring, cutting, drilling, \nassembling/disassembling.  Tool set includes the \nfollowing but not limited to: \n2.1.1 Pliers \n2.1.2 Cutters \n2.1.3 Screw drivers \n2.2 \nEquipment \n2.2.1 Soldering gun \n2.2.2 Multi-tester \n3. Personal protective \nequipment \n3.1 \ngoggles \n3.2 \ngloves \n3.3 \napron/overall \n4. Methods \n4.1 \nClamping \n4.2 \nPin connection \n4.3 \nSoldered joints \n4.4 \nPlugs \n5. Accessories \n5.1 \nAccessories may include the following but not \nlimited to: \n5.1.1 brackets \n5.1.2 clamps\n\n--- PDF PAGE 34 ---\nTESDA-SOP-QSO-01-F08 \nTR – Electrical Installation and Maintenance NC II (Amended)    Promulgated Dec. 16, 2015          30 \nEVIDENCE GUIDE \n \n1. Critical aspect of \ncompetency \nAssessment requires evidence that the candidate: \n \n1.1. Undertook work safely and according to workplace \nand standard procedures \n1.2. used appropriate termination/ connection methods \n1.3. followed correct sequence in termination / \nconnection process \n1.4. conducted testing of terminated connected \nelectrical wiring/electronic circuits using appropriate \nprocedures and standards \n2. Method of assessment \n2.1. The assessor may select two (2) of the following \nassessment methods to objectively assess the \ncandidate: \n2.1.1. Observation \n2.1.2. Oral Questioning \n2.1.3. Practical demonstration \n3. Resource implication \n3.1. Tools for measuring, cutting, drilling, \nassembling/disassembling, connecting. Tool set \nincludes the following but not limited to: \n3.1.1. screw drivers \n3.1.2. pliers \n3.1.3. cutters \n4. Context of Assessment \n4.1. Assessment may be conducted in the workplace or \nin a simulated work environment\n",
