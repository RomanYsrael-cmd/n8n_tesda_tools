        "source_title": "PERFORM ROUGHING-IN ACTIVITIES, WIRING AND CABLING WORKS FOR SINGLE-PHASE DISTRIBUTION, POWER, LIGHTING AND AUXILIARY SYSTEMS",
        "source_text": "--- PDF PAGE 35 ---\nTESDA-SOP-QSO-01-F08 \nTR – Electrical Installation and Maintenance NC II (Amended)    Promulgated Dec. 16, 2015          31 \nCORE COMPETENCIES \n \n \nUNIT OF COMPETENCY:    PERFORM ROUGHING-IN ACTIVITIES, WIRING AND \nCABLING WORKS FOR SINGLE-PHASE DISTRIBUTION, \nPOWER, LIGHTING AND AUXILIARY SYSTEMS \n \nUNIT CODE  \n        :    ELC741301  \n \nUNIT DESCRIPTOR       :  This unit covers the knowledge, skills and attitudes on \ninstalling electrical metallic and non-metallic conduit, wire \nways and cable clamp, auxiliary terminal cabinet and \ndistribution frame panel board/safety switch and used in \nroughing-in based on the required performance standards.  \n \n   This unit also covers the outcomes required in preparing for \ncable pulling and installation, performing wiring and cabling \nlay-out and notifying completion of work for single-phase \ndistribution, power, lighting and auxiliary systems. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in \nthe  Range of Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Install \nelectrical \nmetallic /non- \nmetallic (PVC \nconduit) \n \n \n \n1.1 Correct drawings are \ninterpreted based on job  \nrequirements \n1.2 Correct quantities of \nconduit, fittings and \naccessories are determined \nas per job requirements \n1.3 Tools and equipment are \nselected as per job \nrequirements \n1.4 Conduit is assembled \nensuring that fittings are fully \ninserted and tightened as per \njob requirements \n1.5 Conduit is bent with bends \nnot exceeding 90° as  per job \nrequirements  \n1.6 Conduit couplings and \nelbows are installed as per  \njob requirements \n1.7 Conduit is threaded in line \nwith job requirements \n1.8 Safety procedures are \nfollowed in line with standard \noperating procedures (SOPs) \n \n Interpretation of \no electrical wiring \ndiagrams  \no mechanical \ndrawings \n Types of electrical \nconduits \n Proper uses and \ninstallation of conduits \n Technics in installing \nand bending of \nconduits and fittings \n Proper Installation for \nmaintenance \naccessibility \n Safe use of  adhesives\n Proper use of safety \nharness (PPE) \n \n \n \n \n Reading skills \nrequired to \ninterpret work \ninstructions \n Handling of \nmaterials and \ntools and \nequipment \n Lay-outing \nconduits \n Bending \nelectrical metallic \nconduits \n Cutting conduits \n Performing the \ninstallation  \n       economically\n\n--- PDF PAGE 36 ---\nTESDA-SOP-QSO-01-F08 \nTR – Electrical Installation and Maintenance NC II (Amended)    Promulgated Dec. 16, 2015          32 \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in \nthe  Range of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n2. Install wire \nways and \ncable tray \n2.1 Correct drawings are \ninterpreted to determine job \nrequirements \n2.2 Correct quantities of \nmaterials are selected as per  \njob requirements \n2.3 Tools and equipment are \nselected as per job  \nrequirements \n2.4 Wire ways and cable trays \nare installed as per job \nrequirements.  \n2.5 Safety procedures are \nfollowed in line with SOPs \n \n Mensuration \n Blue print reading \n Materials specification \n Use of materials, tools \nand equipment \n Interpretation of an \nelectrical and \nmechanical drawing. \n Proper uses and \ninstallation of wire \nways and cable trays \n Suitability for \ninstallation and used \nof bus way, cable tray, \nfittings and panels in \nconformity with the \nprovision of the PEC. \n Proper use of safety \nharness (PPE) \n Interpreting \ntechnical plan \n Effective \ncommunication \nskills (written and \noral ) \n Effective use of \nmeasuring \ndevices \n Installing wire \nways and cable \ntray \n \n \n3. Install \nauxiliary  \nterminal \ncabinet and \ndistribution \npanel \n3.1 Correct drawings are \ninterpreted to determine job \nrequirements \n3.2 Correct quantities of \nmaterials are selected as per \njob requirements \n3.3 Tools and equipment are \nselected as per job \nrequirements \n3.4 Auxiliary terminal cabinet is \ninstalled as per job \nrequirements \n3.5 Auxiliary main distribution \nframe is installed as per job \nrequirements \n3.6 Safety procedures are \nfollowed in line with SOPs \n Mensuration \n Blue print reading and \nmaterials  specification\n Use of wires and \ncables and tools,  \n Interpretation of        \nelectrical and \nmechanical drawing \n Proper procedure in      \ninstallation of auxiliary \nterminal cabinet and \ndistribution panels. \n Proper use of safety \nharness and PPE \n Interpreting \ntechnical plan \n Effective \ncommunication \nskills (written and \noral ) \n Effective use of \nmeasuring \ndevices \n Installing \ndifferent types of \npanel/frame \n \n4. Prepare for \ncable pulling \nand \ninstallation \n \n \n \n \n \n4.1 Necessary tools, equipment, \nmaterials and personal \nprotective equipment (PPE) \nare prepared in line with job \nrequirements. \n4.2 Cable pulling & installation \nrequirements and constraints \nfrom plan and site inspection \nare identified as per job \nrequirements. \n4.3 Cable lay out & installation \nequipment is set up in \naccordance with \n Mensuration \n Blue print reading and \nmaterials  specification\n Use of wires, cables \nand tools \n Preparation of \nrequired size of cable \nbased on PEC Wire \nTable \n Cable pulling and \ninstallation \nrequirements \n Cable lay out and \n Interpreting \ntechnical plan \n Effective \ncommunication \nskills (written and \nOral ) \n Effective use of \nmeasuring \ndevices \n Interpreting \nplans and \ndrawings \n Handling of\n\n--- PDF PAGE 37 ---\nTESDA-SOP-QSO-01-F08 \nTR – Electrical Installation and Maintenance NC II (Amended)    Promulgated Dec. 16, 2015          33 \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in \nthe  Range of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \nmanufacturer's and job \nrequirements. \n4.4 Site is made safe and secure \nfor cable installation. \n4.5 Suitable protective clothing \nis selected and required \nsafety devices are used \n4.6 Support structure is \nassessed as safe for normal \nworking conditions. \n \n \ninstallation \n \n \n \n \nmaterials, tools      \nand equipment  \n Applying \nmethods and \ntechniques in \nvarious type of \nwiring wires and \ncables \n Pulling of \nconductors  \n5. Perform wiring \nand cabling \nlay out \n \n5.1 Safety procedures are \nfollowed based on safety \nregulations PPE are identified \nand selected in line with \nsafety requirements \n5.2 Tools, equipment, pulling \ncompound and safety \nrequirements are identified \nand obtained for the lay out \nand installation. \n5.3 Pulling materials is properly \ninstalled and tensioned to \nrequired specifications \n5.4 Cable is secured permanently \nto support structure in \naccordance with standard \ninstallation procedures \n5.5 Bending radius and loops \ntolerance is observed for \ncable materials at all times \n5.6 Schedule of wire cutting lists \nis followed based on \nestimates, quantity and sizes \nto avoid wastage. \n5.7 Further instructions are \nsought if unplanned events or \nconditions occur \n5.8 Checking of quality of work is \ndone in accordance with \ninstructions and \nrequirements. \n \n \n \n \n \n \n DOLE Department \nOrder No. 13 s. 1998 \nGuidelines Governing \nOccupational Safety \nand Health  in the       \nConstruction Industry \n Wiring procedure such \nas cable lay-out, \npulling splicing and \ntermination of wire. \n Uses of different type \nof wires and cables \nand its applications  \n Markings of Circuit \nhomeruns. \n Application of pulling \ncompound \n Bundling of wire size \nas per job \nrequirement. \n \n Applying \nmethods and       \ntechniques in \nvarious type       \nof wiring wires \nand cables \n Wiring-up the \nrequired \nelectrical control \nbased on the \nstandard. \n Connecting and \nterminating of \nmotor terminal/ \nleads out and the \ncontrol devices. \n Checking for \ncontinuity test or \nohmmeter test of \nmotor terminal. \n Terminating \nwires \n Performing the      \ninstallation       \neconomically.\n\n--- PDF PAGE 38 ---\nTESDA-SOP-QSO-01-F08 \nTR – Electrical Installation and Maintenance NC II (Amended)    Promulgated Dec. 16, 2015          34 \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in \nthe  Range of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n6. Notify \ncompletion of \nwork \n \n6.1 Final checks are made to \nensure that work  conforms \nwith instructions and job \nrequirements \n6.2 Supervisor is notified upon \ncompletion of work \n6.3 Tools, equipment and any \nsurplus resources and        \nmaterials are, where \nappropriate, cleaned,       \nchecked and returned to \nstorage in accordance with \nestablished procedures \n6.4 Work area is cleaned up and \nmade safe according to \nOHSA regulations \n Processes, \nOperations, Systems \no Maintenance of \ntools \no Storage of tools \n Checking and \nConforming \nprocedures in \ninstallation based on \njob requirement  \n Good housekeeping \n \n \n \n Skills in \ncontinuity test or \nohmmeter test of \nmotor terminal. \n commissioning      \nskills \n Documentation \nand reporting \nskills\n\n--- PDF PAGE 39 ---\nTESDA-SOP-QSO-01-F08 \nTR – Electrical Installation and Maintenance NC II (Amended)    Promulgated Dec. 16, 2015          35 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Metallic conduits/non- \nmetallic conduit \n \n1.1 Rigid Steel Conduits (RSC) \n1.2 Intermediate Metallic Conduit (IMC) \n1.3 Electrical Metallic Tubing (EMT) \n1.4 Polyvinyl Chloride Pipe (PVC)\n2. Fittings \n2.1 Condulets and Reducers  \n2.2 lock nut and bushing \n2.3 Entrance cap \n2.4 Nipple \n2.5 Elbow\n3. Accessories \n \n2.1 Boxes \n Utility Box \n Junction Box \n Pull box/Splice box \n2.2 Conduit supports ( e.g. hangers ) \n2.3 Conduit Strap \n2.4 Connectors (straight and angle)\n4. Tools and equipment \n \nIncluding but not limited to: \n3.1 Spirit level, hack saw, pipe cutter, plumb bob, pipe \nreamer, pipe threader, pipe bender, bolt cutter, \nelectric drill \n3.2 Electrical power tools \n- \nPower drills \n-\nPortable grinder\n4.  Installation \n4.1 Electrical Metallic conduit \n- Fitting/coupling/connector fully inserted and tightened\n- Elbows with clamps/supports for mounting \n- Conduit rigidly anchored to building structure \n- Smooth field off-set bends \n- Conduit bend not to exceed 90° \n- Standard distance between supports \n- Conduit ends reamed and without sharp edges \n- Conduit cut to length requirement \n4.2 Wire ways and cable tray \n- \nBoxes plumb to ground and rigidly anchored to walls \nbuilding structure \n- \nConduit rigidly clamp to building structure \n- \nCouplings fully inserted \n- \nGround wire bonding jumper each joint. \n4.3 Auxiliary terminal cabinet and distribution panel. \n- \nConduit ends reamed and cleaned of burrs and \nrough edges \n- \nFitting fully inserted and applied with adhesive \nsolvent \n- \nConduit cut to length requirement \n- \nPVC coupling with adhesive solvent\n\n--- PDF PAGE 40 ---\nTESDA-SOP-QSO-01-F08 \nTR – Electrical Installation and Maintenance NC II (Amended)    Promulgated Dec. 16, 2015          36 \nEVIDENCE GUIDE \n \n1.  Critical aspects  \n     of competency \nAssessment requires evidence that the candidate: \n1.1 Installed electrical metallic /non- metallic (PVC \nconduit) \n1.2 Installed wire ways and cable tray \n1.3 Installed auxiliary  terminal cabinet and distribution \npanel \n1.4 Prepared for cable pulling and installation \n1.5 Performed wiring and cabling lay out \n1.6 Notified completion of work \n2. Resource Implications \nThe following resources MUST be provided: \n2.1 Workplace location \n2.2 Tools and equipment appropriate to roughing-in, \nwiring and cabling works and  installation processes \n2.3 Materials relevant to the proposed activity \n2.4 Drawings and specifications relevant to the task \n3. Methods of  \nAssessment \nCompetency must be assessed through: \n3.1  Direct observation of application to tasks. \n3.2  Questions related to underpinning knowledge \n3.3  Demonstration \n3.4  Written test \n4. Context for \nAssessment \n4.1  Competency may be assessed in the workplace or \nin a simulated workplace setting \n4.2  Assessment shall be done while the tasks are being \nundertaken either individually or as part of a team \nunder limited supervision\n",
