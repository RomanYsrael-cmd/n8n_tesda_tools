  "source_section_text": "SECTION 2\nCOMPETENCY STANDARDS\n\nThis section gives the details of the contents of the units of competency required\nin ELECTRICAL INSTALLATION & MAINTENANCE NC II. These units of competency\nare categorized into basic, common and core competencies.\n\nBASIC COMPETENCIES\n\nUNIT OF COMPETENCY : PARTICIPATE IN WORKPLACE COMMUNICATION\nUNIT CODE\n : 500311105\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes\nrequired to gather, interpret and convey information in\nresponse to workplace requirements.\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1. Obtain and\nconvey\nworkplace\ninformation\n1.1 Specific and relevant\ninformation is accessed\nfrom appropriate sources\n1.2 Effective questioning ,\nactive listening and\nspeaking skills are used to\ngather and convey\ninformation\n1.3 Appropriate medium is\nused to transfer information\nand ideas\n1.4 Appropriate non- verbal\ncommunication is used\n1.5 Appropriate lines of\ncommunication with\nsupervisors and colleagues\nare identified and followed\n1.6 Defined workplace\nprocedures for the location\nand storage of information\nare used\n1.7 Personal interaction is\ncarried out clearly and\nconcisely\n• Effective\ncommunication\n• Different modes of\ncommunication\n• Written\ncommunication\n• Organizational\npolicies\n• Sources of\ninformation\n• Types of question\n• Medium of\ncommunication\n• Flow of\ncommunication\n• Storage system\n• Telephone courtesy\n• Follow simple\nspoken language\n• Performing routine\nworkplace duties\nfollowing simple\nwritten notices\n• Ability to relate to\npeople of social\nrange in the\nworkplace\n• Gather and provide\ninformation in\nresponse to\nworkplace\nrequirements\n• Listening skills\n• Questioning skills\n• Workplace\nlanguage skills\n2. Participate\nin workplace\nmeetings\nand\ndiscussions\n2.1 Team meetings are\nattended on time\n2.2 Own opinions are clearly\nexpressed and those of\nothers are listened to\nwithout interruption\n2.3 Meeting inputs are\nconsistent with the meeting\npurpose and established\nprotocols\n2.4 Workplace interactions\nare conducted in a\ncourteous manner\n• Communication\nprocedures and\nsystems\n• Meeting protocols\n• Nature of\nworkplace meetings\n• Barriers of\ncommunication\n• Workplace\ninteractions\n• Non-verbal\ncommunication\n• Ability to relate to\npeople of social\nrange in the\nworkplace\n• Interpersonal\ncommunication skill\n• Observing meeting\nprotocols\n\n--- PDF PAGE 7 ---\nTESDA-SOP-QSO-01-F08\nTR – Electrical Installation and Maintenance NC II (Amended) Promulgated Dec. 16, 2015 3\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n2.5 Questions about simple\nroutine workplace\nprocedures and maters\nconcerning working\nconditions of employment\nare asked and responded\nto\n2.6 Meetings outcomes are\ninterpreted and\nimplemented\n3. Complete\nrelevant\nwork related\ndocuments\n3.1 Range of forms relating to\nconditions of employment\nare completed accurately\nand legibly\n3.2 Workplace data is recorded\non standard workplace\nforms and documents\n3.3 Basic mathematical\nprocesses\nare used for routine\ncalculations\n3.4 Errors in recording\ninformation on forms/\ndocuments are identified\nand properly acted upon\n3.5 Reporting requirements to\nsupervisor are completed\naccording to organizational\nguidelines\n• Technology\nrelevant to the\nenterprise and the\nindividual’s work\n• Types of workplace\ndocuments and\nforms\n• Basic mathematical\nconcepts\n• Kinds of workplace\nreport\n\n• Apply basic\nmathematical\nprocesses of\naddition,\nsubtraction, division\nand multiplication\n• Data recording\n• Report writing\n\n--- PDF PAGE 8 ---\nTESDA-SOP-QSO-01-F08\nTR – Electrical Installation and Maintenance NC II (Amended) Promulgated Dec. 16, 2015 4\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Appropriate sources\n1.1.\nTeam members\n1.2.\nSuppliers\n1.3.\nTrade personnel\n1.4.\nLocal government\n1.5.\nIndustry bodies\n2. Medium\n2.1.\nMemorandum\n2.2.\nCircular\n2.3.\nNotice\n2.4.\nInformation discussion\n2.5.\nFollow-up or verbal instructions\n2.6.\nFace to face communication\n3. Storage\n3.1.\nManual filing system\n3.2.\nComputer-based filing system\n4. Forms\n4.1.\nPersonnel forms, telephone message forms, safety\nreports\n5. Workplace\ninteractions\n5.1.\nFace to face\n5.2.\nTelephone\n5.3.\nElectronic and two way radio\n5.4.\nWritten including electronic, memos, instruction and\nforms, non-verbal including gestures, signals, signs\nand diagrams\n6. Protocols\n6.1.\nObserving meeting\n6.2.\nCompliance with meeting decisions\n6.3.\nObeying meeting instructions\n\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1. Prepared written communication following standard\nformat of the organization\n1.2. Accessed information using communication equipment\n1.3. Made use of relevant terms as an aid to transfer\ninformation effectively\n1.4. Conveyed information effectively adopting the formal\nor informal communication\n2. Resource\nImplications\n2.1. Fax machine\n2.2. Telephone\n2.3. Writing materials\n2.4.\nInternet\n3. Methods of\nAssessment\n3.1. Direct Observation\n3.2. Oral interview and written test\n4. Context of\nAssessment\nCompetency may be assessed individually in the actual\nworkplace or through accredited institution\n\n--- PDF PAGE 9 ---\nTESDA-SOP-QSO-01-F08\nTR – Electrical Installation and Maintenance NC II (Amended) Promulgated Dec. 16, 2015 5\n\nUNIT OF COMPETENCY: WORK IN TEAM ENVIRONMENT\nUNIT CODE\n : 500311106\nUNIT DESCRIPTOR :\nThis unit covers the skills, knowledge and attitudes to\nidentify role and responsibility as a member of a team.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Describe\nteam role\nand scope\n1.1. The role and objective of the\nteam is identified from available\nsources of information\n1.2. Team parameters, reporting\nrelationships and\nresponsibilities are identified\nfrom team discussions and\nappropriate external sources\n• Team roles\n• Definition of Team\n• Difference between\nteam and group\n• Different source of\ninformation\n• Objectives and\ngoals of team\n• Describing the\nteam role and\nscope\n2. Identify own\nrole and\nresponsibility\nwithin team\n2.1. Individual role and\nresponsibilities within the team\nenvironment are identified\n2.2. Roles and responsibility of other\nteam members are identified\nand recognized\n2.3. Reporting relationships within\nteam and external to team are\nidentified\n• Team structure\n• Roles and\nresponsibility of\nteam members\n• Teams in work\nenvironment\n• Fundamental rights\nat work including\ngender sensitivity\n• Communicate\nappropriately,\nconsistent with\nthe culture of the\nworkplace\n• Identifying\nindividual role and\nresponsibility\n• Identifying\nexternal\nrelationship\n3. Work as a\nteam\nmember\n3.1. Effective and appropriate forms\nof communications used and\ninteractions undertaken with\nteam members who contribute\nto known team activities and\nobjectives\n3.2. Effective and appropriate\ncontributions made to\ncomplement team activities and\nobjectives, based on individual\nskills and competencies and\nworkplace context\n3.3. Observed protocols in reporting\nusing standard operating\nprocedures\n3.4. Contribute to the development\nof team work plans based on an\nunderstanding of team’s role\nand objectives and individual\ncompetencies of the members.\n• Communication\nprocess\n• Group planning and\ndecision making\n• Team goals and\nobjectives\n• Understanding\nindividual\ncompetencies\nrelative to\nteamwork\n• Types of individuals\n• Role of leaders\n• Interacting\neffectively with\nothers\n• Setting team\ngoals and\nexpectations\n\n--- PDF PAGE 10 ---\nTESDA-SOP-QSO-01-F08\nTR – Electrical Installation and Maintenance NC II (Amended) Promulgated Dec. 16, 2015 6\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Role and objective of\nteam\n1.1.\nWork activities in a team environment with\nenterprise or specific sector\n1.2.\nLimited discretion, initiative and judgment\nmaybe demonstrated on the job, either\nindividually or in a team environment\n\n2. Sources of information\n2.1.\nStandard operating and/or other workplace\nprocedures\n2.2.\nJob procedures\n2.3.\nMachine/equipment manufacturer’s\nspecifications and instructions\n2.4.\nOrganizational or external personnel\n2.5.\nClient/supplier instructions\n2.6.\nQuality standards\n2.7.\nOHS and environmental standards\n3. Workplace context\n3.1.\nWork procedures and practices\n3.2.\nConditions of work environments\n3.3.\nLegislation and industrial agreements\n3.4.\nStandard work practice including the\nstorage, safe handling and disposal of\nchemicals\n3.5.\nSafety, environmental, housekeeping and\nquality guidelines\n\n--- PDF PAGE 11 ---\nTESDA-SOP-QSO-01-F08\nTR – Electrical Installation and Maintenance NC II (Amended) Promulgated Dec. 16, 2015 7\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1.\nOperated in a team to complete workplace\nactivity\n1.2.\nWorked effectively with others\n1.3.\nConveyed information in written or oral\nform\n1.4.\nSelected and used appropriate workplace\nlanguage\n1.5.\nFollowed designated work plan for the job\n1.6.\nReported outcomes\n2. Resource Implications\nThe following resources MUST be provided:\n2.1.\nAccess to relevant workplace or\nappropriately simulated environment where\nassessment can take place\n2.2.\nMaterials relevant to the proposed activity\nor tasks\n3. Methods of Assessment\nCompetency may be assessed through:\n3.1.\nObservation of the individual member in\nrelation to the work activities of the group\n3.2.\nObservation of simulation and or role play\ninvolving the participation of individual\nmember to the attainment of organizational\ngoal\n3.3.\nCase studies and scenarios as a basis for\ndiscussion of issues and strategies in\nteamwork\n4. Context for Assessment\n4.1.\nCompetency may be assessed in\nworkplace or in a simulated workplace\nsetting\n4.2.\nAssessment shall be observed while task\nare being undertaken whether individually\nor in group\n\n--- PDF PAGE 12 ---\nTESDA-SOP-QSO-01-F08\nTR – Electrical Installation and Maintenance NC II (Amended) Promulgated Dec. 16, 2015 8\nUNIT OF COMPETENCY: PRACTICE CAREER PROFESSIONALISM\nUNIT CODE : 500311107\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes in\npromoting career growth and advancement.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Integrate\npersonal\nobjectives\nwith\norganizational\ngoals\n1.1. Personal growth and work\nplans are pursued\ntowards improving the\nqualifications set for the\nprofession\n1.2. Intra- and interpersonal\nrelationships are\nmaintained in the course\nof managing oneself\nbased on performance\nevaluation\n1.3. Commitment to the\norganization and its goal\nis demonstrated in the\nperformance of duties\n• Work values and\nethics (Code of\nConduct, Code of\nEthics, etc.)\n• Understanding\npersonal objectives\n• Understanding\norganizational goals\n• Difference between\nintra and\ninterpersonal\nrelationship\n• Performance\nevaluation\n• Demonstrate Intra\nand Interpersonal\nskills at work\n• Demonstrate\npersonal\ncommitment in\nwork\n2. Set and meet\nwork priorities\n2.1 Competing demands are\nprioritized to achieve\npersonal, team and\norganizational goals and\nobjectives.\n2.2 Resources are utilized\nefficiently and effectively\nto manage work priorities\nand commitments\n2.3 Practices along economic\nuse and maintenance of\nequipment and facilities\nare followed as per\nestablished procedures\n• Company policies\n• Company\noperations,\nprocedures and\nstandards\n• Time management\n• Basic strategic\nplanning concepts\n• Resource utilization\nand management\n• Managing goals\nand time\n• Practice economic\nuse of resources\nand facilities\n• Setting work\npriorities\n• Practice time\nmanagement\n3. Maintain\nprofessional\ngrowth and\ndevelopment\n3.1 Trainings and career\nopportunities are\nidentified and availed of\nbased on job\nrequirements\n3.2 Recognitions are\nsought/received and\ndemonstrated as proof of\ncareer advancement\n3.3 Licenses and/or\ncertifications relevant to\njob and career are\nobtained and renewed\n• Career\ndevelopment\nopportunities\n• Company\nrecognition and\nincentives\n• Information on\nrelevant licenses\nand or certifications\n• Determining\npersonal career\ndevelopment\nneeds\n• Identifying career\nopportunities\n\n--- PDF PAGE 13 ---\nTESDA-SOP-QSO-01-F08\nTR – Electrical Installation and Maintenance NC II (Amended) Promulgated Dec. 16, 2015 9\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Evaluation\n1.1 Performance Appraisal\n1.2 Psychological Profile\n1.3 Aptitude Tests\n2. Resources\n2.1 Human\n2.2 Financial\n2.3 Technology\n2.3.1 Hardware\n2.3.2 Software\n3. Trainings and career\nopportunities\n3.1 Participation in training programs\n 3.1.1 Technical\n 3.1.2 Supervisory\n 3.1.3 Managerial\n 3.1.4 Continuing Education\n3.2 Serving as Resource Persons in conferences\nand workshops\n4. Recognitions\n4.1 Recommendations\n4.2 Citations\n4.3 Certificate of Appreciations\n4.4 Commendations\n4.5 Awards\n4.6 Tangible and Intangible Rewards\n5. Licenses and/or\ncertifications\n5.1 National Certificates\n5.2 Certificate of Competency\n5.3 Support Level Licenses\n5.4 Professional Licenses\n\n--- PDF PAGE 14 ---\nTESDA-SOP-QSO-01-F08\nTR – Electrical Installation and Maintenance NC II (Amended) Promulgated Dec. 16, 2015 10\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n\n1.1 Attained job targets within key result areas\n(KRAs)\n1.2 Maintained intra - and interpersonal\nrelationship in the course of managing oneself\nbased on performance evaluation\n1.3 Completed trainings and career opportunities\nwhich are based on the requirements of the\nindustries\n1.4 Acquired and maintained licenses and/or\ncertifications according to the requirement of\nthe qualification\n2. Resource Implications\nThe following resources MUST be provided:\n\n2.1 Workplace or assessment location\n2.2 Case studies/scenarios\n3. Methods of Assessment Competency may be assessed through:\n\n3.1 Portfolio Assessment\n3.2 Interview\n3.3 Simulation/Role-plays\n3.4 Observation\n3.5 Third Party Reports\n3.6 Exams and Tests\n4 Context of Assessment\nCompetency may be assessed in the work place or\nin a simulated work place setting\n\n--- PDF PAGE 15 ---\nTESDA-SOP-QSO-01-F08\nTR – Electrical Installation and Maintenance NC II (Amended) Promulgated Dec. 16, 2015 11\nUNIT OF COMPETENCY: PRACTICE OCCUPATIONAL HEALTH AND SAFETY\nPROCEDURES\nUNIT CODE : 500311108\nUNIT DESCRIPTOR : This unit covers the outcomes required to comply with\nregulatory and organizational requirements for\nOccupational health and safety.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Identify\nhazards and\nrisks\n1.1 Safety regulations and\nworkplace safety and hazard\ncontrol practices and\nprocedures are clarified and\nexplained based on\norganization procedures\n1.2 Hazards/risks in the workplace\nand their corresponding\nindicators are identified to\nminimize or eliminate risk to co-\nworkers, workplace and\nenvironment in accordance with\norganization procedures\n1.3 Contingency measures during\nworkplace accidents, fire and\nother emergencies are\nrecognized and established in\naccordance with organization\nprocedures\n• OHS procedures\nand practices and\nregulations\n• Hazards/risks\nidentification and\ncontrol\n• OHS indicators\n• Organizational\ncontingency\npractices\n\n• Hazards/risks\nidentification and\ncontrol skills\n• Practice of safety\nand health\nprocedures and\npersonal hygiene\n\n2. Evaluate\nhazards and\nrisks\n2.1 Terms of maximum tolerable\nlimits which when exceeded will\nresult in harm or damage are\nidentified based on threshold\nlimit values (TLV)\n2.2 Effects of the hazards are\ndetermined\n2.3 OHS issues and/or concerns\nand identified safety hazards\nare reported to designated\npersonnel in accordance with\nworkplace requirements and\nrelevant workplace OHS\nlegislation\n• Threshold Limit\nValue (TLV)\n• Effects of safety\nhazards\n\n• Communication\nskills\n• Reporting safety\nhazards\n3. Control\nhazards and\nrisks\n3.1 Occupational Health and Safety\n(OHS) procedures for\ncontrolling hazards/risks in\nworkplace are consistently\nfollowed\n3.2 Procedures for dealing with\nworkplace accidents, fire and\nemergencies are followed in\naccordance with organization\nOHS policies\n• Personal hygiene\npractices\n• Organization safety\nand health protocol\n• Company\nemergency\nprocedure practices\n• Practice of\npersonal hygiene\n• Respond to\nemergency\n\n--- PDF PAGE 16 ---\nTESDA-SOP-QSO-01-F08\nTR – Electrical Installation and Maintenance NC II (Amended) Promulgated Dec. 16, 2015 12\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n\n3.3 Personal protective\nequipment (PPE) is correctly\nused in accordance with\norganization OHS procedures\nand practices\n3.4 Appropriate assistance is\nprovided in the event of a\nworkplace emergency in\naccordance with established\norganization protocol\n4. Maintain\nOHS\nawareness\n4.1 Emergency-related drills and\ntrainings are participated in as\nper established organization\nguidelines and procedures\n4.2 OHS personal records are\ncompleted and updated in\naccordance with workplace\nrequirements\n\n• Workplace OHS\npersonal records\n• Information on\nemergency-related\ndrills\