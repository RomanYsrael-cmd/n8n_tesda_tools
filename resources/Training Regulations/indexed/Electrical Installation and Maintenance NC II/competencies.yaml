        "evidence_guide": {
          "source_text": "1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Correctly interpreted work instructions\n1.2 Selected appropriate tools, equipment and\nmaterials for installation of electrical protection\nsystem\n1.3 Selected and used correct PPE\n1.4 Demonstrated correct procedures on installation\nof electrical protective devices\n1.5 Demonstrated correct procedures on installation\nof lighting fixture and auxiliary outlet\n1.5 Followed safety procedures/protocol\n1.6 Cleaned worksite, tools and equipment\n1.7 Stored surplus materials\n2. Resource Implications\nThe following resources MUST be provided:\n2.1 Workplace location\n2.2 Tools and equipment appropriate for installation of\nelectrical protection systems\n2.3 Materials relevant to the proposed activity\n2.4 Drawings and specifications relevant to the task\n3. Methods of\nAssessment\nCompetency must be assessed through:\n3.1 Direct observation of candidate's application of\nknowledge to tasks.\n3.2 Questions related to underpinning knowledge\n3.3 Demonstration/Practical activity\n3.4 Written test\n4. Context for\nAssessment\n4.1 Competency may be assessed in the workplace or\nin simulated workplace setting\n4.2 Assessment shall be observed while the tasks are\nbeing undertaken either individually or as part of a\nteam under limited supervision\n\n--- PDF PAGE 45 ---\nTESDA-SOP-QSO-01-F08\nTR – Electrical Installation and Maintenance NC II (Amended) Promulgated Dec. 16, 2015 41\nUNIT OF COMPETENCY : INSTALL WIRING DEVICES OF FLOOR AND WALL\nMOUNTED OUTLETS, LIGHTING FIXTURE/SWITCHES\nAND AUXILLIARY OUTLETS\n\nUNIT CODE\n\n :"
        },
        "source_text": "ELC7413302\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes on\nplanning and preparing work, installing electrical protective\ndevices, lightning fixture and auxiliary outlet and notifying\ncompletion of work for distribution, power, lighting, auxiliary,\nlightning protection and grounding systems.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Plan and\nprepare work\n\n1.1 Instructions for the preparation\nof the work activity are\ncommunicated and confirmed\nto ensure clear understanding\n1.2 Tools, equipment and PPE\nneeded to install electrical\nwiring are identified, checked\nto ensure they work correctly\nas intended and are safe to\nuse in accordance with\nestablished procedures\n1.3 Materials needed for work are\nobtained in accordance with\nestablished procedures.\n• Types of protective\ndevices and its\napplications/\napplications\n• Identification of\nstandard drawing\nbased on standard\n(ANSI or IEC)\n• Protective devices\nspecifications\n• Electrical protection\nsystem components\n• Interpreting\nplans and details\ndrawing.\n• Handling of\nmaterials, tools\nand equipment\n\n2. Install\nelectrical\nprotective\ndevices\n2.1 Safety procedures are\nfollowed in line with job\nrequirements\n2.2 Correct procedures for\ninstallation of electrical\nprotective devices are\nperformed in line with job\nrequirements and PEC\n2.3 Schedule of work is followed\nto ensure work is completed\nin an agreed time, to a quality\nstandard and with a minimum\nwaste\n2.4 Further instructions are\nsought from a supervisor if\nunplanned events or\nconditions occur\n2.5 On-going checks of quality of\nwork are done in accordance\nwith instructions and\nrequirements\n\n• DOLE Department\nOrder No. 13 s. 1998\nGuidelines Governing\nOccupational Safety\nand Health in the\nConstruction Industry\n• Philippine Electrical\nCode (PEC)\nrequirements\nregarding installation\nof electrical protection\ndevices\n• Uses of different\nprotective devices-\no panelboard;\no circuit breaker;\no safety switch;\no ground fault\ncurrent interrupting\ndevice (GFCI); and\no conventional\natmospheric\nlightning protection\nand grounding\nsystem\n\n• Interpreting\nplans and details\ndrawing.\n• Applying\nmethods and\ntechniques in\ninstallation of\nvarious type of\nprotective\ndevices and\nlightning\nprotection and\ngrounding\nsystems\n• Performing the\ninstallation\neconomically.\n\n--- PDF PAGE 42 ---\nTESDA-SOP-QSO-01-F08\nTR – Electrical Installation and Maintenance NC II (Amended) Promulgated Dec. 16, 2015 38\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n3. Install\nlighting\nfixture and\nauxiliary\noutlet.\n3.1 Safety procedures are\nfollowed\n3.2 Correct procedures for\ninstallation of lighting fixture\nand auxiliaries are performed\nin line with job requirements\n3.3 Schedule of work is followed\nto ensure work is completed\nin an agreed time, to a quality\nstandard and with a minimum\nwaste\n3.4 Further instructions are\nsought from a supervisor if\nunplanned events or\nconditions occur.\n3.5 On-going checks of quality of\nwork are undertaken in\naccordance with instructions\nand requirements.\n• DOLE Department\nOrder No. 13 s. 1998\nGuidelines Governing\nOccupational Safety\nand Health in the\nConstruction Industry\n• Philippine Electrical\nCode (PEC)\nrequirements\nregarding installation\nof lighting fixture and\nauxiliary outlet\n• Types of lighting\nfixtures and\ninstallation technique\n• Ratings of lighting\nfixture\n\n• Interpreting\nplans and\ndetails\n• Handling of\nmaterials, tools\nand equipment\n• Interpreting\nproduct technical\nbrochure\n• Applying\nmethods and\ntechniques in\ninstallation of\nvarious type of\nlighting fixture\nand auxiliary\noutlet\n4. Notify\ncompletion of\nwork.\n4.1 Final checks are made to\nensure the work conforms\nwith instructions and\nrequirements\n4.2 Supervisor is notified upon\ncompletion of work\n4.3 Tools, equipment and any\nsurplus resources and\nmaterials are, where\nappropriate, cleaned, checked\nand returned to storage in\naccordance with established\nprocedures\n4.4 Work area is cleaned and\nmade safe\n• Processes,\nOperations, Systems\no Maintenance of\ntools\no Storage of tools\n• Checking and\nconforming\nprocedures for\ninstallation based on\njob requirement\n• Good housekeeping\n• Skills in\ncontinuity test or\nohmmeter test of\nmotor terminal.\n• commissioning\nskills\n• Documentation\nand reporting\nskills\n\n--- PDF PAGE 43 ---\nTESDA-SOP-QSO-01-F08\nTR – Electrical Installation and Maintenance NC II (Amended) Promulgated Dec. 16, 2015 39\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Tools and equipment\nTools and equipment may include but not limited\nto:\n5.1 Pliers\n5.2 Screwdrivers\n5.3 Wrenches\n5.4 Wire splicers\n5.5 Electrician knives\n5.6 electric drill\n5.7 Ball hammer\n\n2. Personal protective\nequipment (PPE)\n\n2.1 Working gloves\n2.2 Safety shoes\n2.3 Hard hat\n\n3. Safety procedures\n\nSafety procedures included in:\n3.1 Philippine Electrical Code\n3.2 Safety standards\n\n4. Installation\n\n4.1 Horizontally and vertically aligned\n4.2 Rigidly anchored to wall\n4.3 Installed with clearance to wall/other boxes for\ncover to open freely\n4.4 Enough clearance for cover opening for flush\nmounted\n\n5. Electrical protection\nsystem component\n\n5.1 Safety switch\n5.2 Earth Leakage Circuit Breaker (ELCB)\n5.3 Conventional atmospheric lightning protection\n5.4 Grounding system\n6. lighting fixture\n6.1 Lamps\n6.2 Spotlights\n6.3 Track lights\n6.4 Perimeter lighting\n\n--- PDF PAGE 44 ---\nTESDA-SOP-QSO-01-F08\nTR – Electrical Installation and Maintenance NC II (Amended) Promulgated Dec. 16, 2015 40\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Correctly interpreted work instructions\n1.2 Selected appropriate tools, equipment and\nmaterials for installation of electrical protection\nsystem\n1.3 Selected and used correct PPE\n1.4 Demonstrated correct procedures on installation\nof electrical protective devices\n1.5 Demonstrated correct procedures on installation\nof lighting fixture and auxiliary outlet\n1.5 Followed safety procedures/protocol\n1.6 Cleaned worksite, tools and equipment\n1.7 Stored surplus materials\n2. Resource Implications\nThe following resources MUST be provided:\n2.1 Workplace location\n2.2 Tools and equipment appropriate for installation of\nelectrical protection systems\n2.3 Materials relevant to the proposed activity\n2.4 Drawings and specifications relevant to the task\n3. Methods of\nAssessment\nCompetency must be assessed through:\n3.1 Direct observation of candidate's application of\nknowledge to tasks.\n3.2 Questions related to underpinning knowledge\n3.3 Demonstration/Practical activity\n3.4 Written test\n4. Context for\nAssessment\n4.1 Competency may be assessed in the workplace or\nin simulated workplace setting\n4.2 Assessment shall be observed while the tasks are\nbeing undertaken either individually or as part of a\nteam under limited supervision\n\n--- PDF PAGE 45 ---\nTESDA-SOP-QSO-01-F08\nTR – Electrical Installation and Maintenance NC II (Amended) Promulgated Dec. 16, 2015 41\nUNIT OF COMPETENCY : INSTALL WIRING DEVICES OF FLOOR AND WALL\nMOUNTED OUTLETS, LIGHTING FIXTURE/SWITCHES\nAND AUXILLIARY OUTLETS\n\nUNIT CODE\n\n :"
