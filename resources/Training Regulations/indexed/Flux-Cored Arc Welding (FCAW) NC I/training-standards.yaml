  "source_section_text": "SECTION 3 TRAINING STANDARDS\n\nThese guidelines are set to provide the Technical and Vocational Education and\nTraining (TVET) providers with information and other important requirements to consider\nwhen designing training programs for FLUX CORED ARC WELDING (FCAW) NCl.\n\n3.1 CURRICULUM DESIGN\n\nCourse Title: FLUX CORED ARC WELDING\n\nNC Level I\n\nSuggested Nominal Training Hours: 28 hrs. ( Basic Competencies)\n\n 56 hrs. ( Common Competencies)\n\n 72 hrs. ( Core Competencies)\n\nCourse Description:\n\nThis course is designed to enhance the knowledge, skills and attitudes in Flux\nCored Arc Welding NCl in accordance with industry standards. It covers core\ncompetencies such as Welding Carbon Steel Plates Using FCAW.\n\nBASIC COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Receive and\nrespond to\nworkplace\ncommunication\n1.1 Explain routinary\n speaking & messages\n in a workplace.\n1.2 Follow routinary\n speaking & message\n1.3 Perform work duties\n following written\n notices.\n• Group\ndiscussion\n• Interaction\n• Interviews/\nquestioning\n• Observation\n2. Work with\nothers\n2.1 Develop effective\n workplace relationship.\n2.2 Contribute to work\ngroup activities.\n• Group\ndiscussion\n• Interaction\n• Interviews/\nquestioning\n• Demonstration\n• Observation\n\n--- PDF PAGE 49 ---\nFcaw nc i 47\n 091605\n3. Demonstrate\nwork values\n\n3.1 Define the purpose of\nwork\n3.2 Apply work\nvalues/ethics\n3.3 Deal with ethical\nproblems\n3.4 Maintain integrity of\nconduct in the\nworkplace\n• Group\ndiscussion\n• Interaction\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n4. Practice\nhousekeeping\nprocedures\n4.1 Sort and remove\n unnecessary items\n4.2 Arrange items\n4.3 Maintain work areas,\n tools and equipment\n4.4 Follow standardize\n work process and\n procedures\n4.5 Perform work\nspontaneously\n• Group\ndiscussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n\n--- PDF PAGE 50 ---\nFcaw nc i 48\n 091605\nCOMMON COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n\n1. Apply Safety\nPractices\n\n1.1 Identify hazardous areas\n1.2 Use protective clothing\nand devices\n1.3 Perform safe handling of\ntools,\n equipment and materials\n1.4 Perform first aid\n1.5 Use fire extinguisher\n\n• Lecturette\n• Practical\n application\n\n• Oral\n questioning\n• Written\n• Demonstration\n2. Interpret\nworking\ndrawings and\nsketches\n2.1 Identify standard alphabet\nof lines\n2.2 Identify orthographic/\nisometric views\n2.3 Interpret standard drawing\nsymbols, dimensional\ntolerances and notations\n• Lecturette\n• Practical\n application\n\n• Oral\n questioning\n• Written\n\n3. Perform\nIndustry\ncalculations\n3.1 Perform four fundamental\n operations\n3.2 Perform conversion of\nunits\n3.3 Perform calculations on\nalgebraic expressions\n3.4 Compute percentage and\nratio\n• Lecturette\n• Practical\n application\n\n• Oral questioning\n• Written test\n\n4. Contribute to\n quality\n system\n4.1 Inspect work done\n4.2 Apply quality standards to\nwork\n4.3 Protect company\nproperty\n and customer interest\n• Lecturette\n• Practical\n application\n\n• Oral\n questioning\n• Written\n• Demonstration\n5. Use hand tools\n5.1 Select hand tools\n5.2 Use hand tools\n5.3 Maintain hand tools\n• Lecturette\n• Practical\n application\n\n• Oral\n questioning\n• Written\n•Demonstration\n6. Prepare Weld\nMaterials\n\n6.1 Set-up cutting equipment\n6.2 Cut and prepare edge of\n materials\n6.3 Clean surfaces and edges\n6.4 Prepare welding\n consumables\n6.5 Prepare welding safety\n and protective equipment\n\n• Lecturette\n• Practical\n application\n\n• Observation\n• Demonstration\nand oral\nquestioning\n• Written test\n\n--- PDF PAGE 51 ---\nFcaw nc i 49\n 091605\n7. Set-up Welding\nEquipment\n7.1 Set up welding machine\n7.2 Set up welding\naccessories\n7.3 Set up welding\npositioners, jigs and\nfixtures\n7.4 Set up pre-heating\ntools/equipment as\nrequired\n• Lecturette\n• Demonstration\n• Observation and\noral questioning\n• Demonstration\nand oral\nquestioning\n• Written test\n8. Fit up Weld\nMaterials\n8.1 Perform tack welding\n8.2 Check gap and alignment\n8.3 Set up welding positioner\n\n• Lecturette\n• Demonstration\n\n• Observation and\noral questioning\n• Demonstration\nand oral\nquestioning\n• Written test\n9. Repair\n Welds\n9.1 Mark/locate weld defects\n9.2 Prepare tools and\n equipment\n9.3 Remove defects\n9.4 Perform re-welding\n\n• Lecturette\n• Demonstration\n\n• Observation and\noral questioning\n• Demonstration\nand oral\nquestioning\n•Written test\n\nCORE COMPETENCY\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n\n1. Weld Carbon\nSteel Plates\nUsing FCAW\n\n1.1 Perform single pass fillet\n weld in different positions\n (1F-4F)\n1.2 Perform multiple pass\n fillet weld in different\n positions (1F-4F)\n1.3 Perform multiple pass\ngroove weld in different\npositions (1G-3G)\n• Lecturette\n• Demonstration\n\n• Observation and\noral questioning\n• Demonstration\nand oral\nquestioning\n• Written test\n\n--- PDF PAGE 52 ---\nFcaw nc i 50\n 091605\n3.2 TRAINING DELIVERY\n\nThe delivery of training should adhere to the design of the curriculum. Delivery\nshould be guided by the 10 basic principles of competency-based TVET.\n\n• The training is based on curriculum developed from the competency standards;\n• Learning is modular in its structure;\n• Training delivery is individualized and self-paced;\n• Training is based on work that must be performed;\n• Training materials are directly related to the competency standards and the\ncurriculum modules;\n• Assessment is based in the collection of evidence of the performance of work to\nthe industry required standard;\n• Training is based both on and off-the-job components;\n• Allows for recognition of prior learning (RPL) or current competencies;\n• Training allows for multiple entry and exit; and\n• Approved training programs are Nationally Accredited\n\nThe competency-based TVET system recognizes various types of delivery\nmodes, both on and off-the-job as long as the learning is driven by the competency\nstandards specified by the industry. The following training modalities may be\nadopted when designing training programs:\n• The dualized mode of training delivery is preferred and recommended. Thus\nprograms would contain both in-school and in-industry training or fieldwork\ncomponents. Details can be referred to the Dual Training System (DTS)\nImplementing Rules and Regulations.\n• Modular/self-paced learning is a competency-based training modality wherein\nthe trainee is allowed to progress at his own pace. The trainer just facilitates the\ntraining delivery.\n• Peer teaching/mentoring is a training modality wherein fast learners are given\nthe opportunity to assist the slow learners.\n• Supervised industry training or on-the-job training is an approach in training\ndesigned to enhance the knowledge and skills of the trainee through actual\nexperience in the workplace to acquire specific competencies prescribed in the\ntraining regulations.\n• Distance learning is a formal education process in which majority of the\ninstruction occurs when the students and instructor are not in the same place.\nDistance learning may employ correspondence study, audio, video or computer\ntechnologies.\n\n--- PDF PAGE 53 ---\nFcaw nc i 51\n 091605\n3.3 TRAINEE ENTRY REQUIREMENTS\nTrainees or students wishing to gain entry into this course should possess the\nfollowing requirements:\n\n•\ncompleted training in SMAW NC I or holder of SMAW NC I\n•\ncan communicate either oral and written\n•\nphysically and mentally fit\n•\ncan perform basic mathematical computation\n\n3.4 LIST OF TOOLS, EQUIPMENT AND MATERIALS\nFLUX CORED ARC WELDING - NC I\n\nRecommended list of tools and materials per trainee for FLUX CORED ARC\nWELDING - NC I\n\nTOOLS\n(for 25 trainees)\nEQUIPMENT\n(for 25 trainees)\nMATERIAL\n(per trainee)\nQty.\nDescription\nQty.\nDescription\nQty.\nDescription\n25 pcs.\nChipping\nHammer\n12 units\nFCAW Welding\nmachine, FCAW\ngun and\naccessories\n1 reel\nFiller wire E71T-I\n(or equivalent)\n1mm dia.\n75 pcs.\nSteel brush\n12 pcs.\nWelding\npositioners\n38 pcs.\n\nMild steel sheet\n3.2mm X 50mm\nX 150mm\n12 pcs.\nPlier/tongs\n12 units\nPortable disc\ngrinder\n40 pcs\nMild steel plate\n10mm X 100mm\nX 150mm\n20 pcs. Files-bastard\ncut\n1 unit\nExhaust fan\n27 pcs\nCutting disc\n3/32” x 5/8\" x 4”\ndia.\n25 pcs.\nWelding Mask\n2 units\nWork bench w/\nbench vice on 4\ncorners\n19 pcs.\nGrinding disc\n1/4” x 5/8\" x 4\"\ndia.\n25 sets\nLeather\napron/jacket\n2 sets\nOxy-\nacetylene/Oxy-\nLPG cutting outfit\n5 cyl.\nShielding gas\n(75% argon 25%\nCO2)\n50 sets\nLeather gloves,\nlong\n1 unit\nPedestal /bench\ngrinding machine\n1 cyl.\noxygen\n5 pcs.\nSafety goggles,\nwide vision,\nclear\n1 unit\nIndustrial fan\n1 cyl.\nLPG or\nAcetylene\n5 pcs.\nOxy-acetylene\nGoggles\n\n3 pcs.\nDark glass\n12 pcs.\nTry square 300\nmm. Long\n\n46 pcs.\nLens clear glass\n\n--- PDF PAGE 54 ---\nFcaw nc i 52\n 091605\n12 pcs.\nSteel square\n300 mm. long\n\n1 tube\nMetal marker\n12 pcs. Files-half round\n5 pcs.\nFillet gauge\n1 pc.\nWire Cutter\n1 pc.\nHand Hacksaw\n\n3.5 TRAINING FACILITIES\n\nThe welding workshop must be of concrete structure. Based on class size of 25\nstudents/trainees the space requirements for the teaching/learning and circulation areas\nare as follows:\n\nTEACHING/LEARNING\nAREAS\nSIZE IN\nMETERS\nAREA IN SQ.\nMETERS\nQTY\nTOTAL AREA\nIN SQ.\nMETERS\nWelding Booth\n2 X 1.5\n3\n5\n15\nGrinding Booth*\n2 X 1.5\n3\n2\n6\nMaterials/Preparation\nArea*\n2 X 2\n4\n\n4\nBench work Area*\n1.5 X 2.5\n4\n2\n8\nTool Room & S/M Storage\nArea*\n4 X 5\n20\n\n20\nLearning Resource Area*\n5 X 9\n45\n\n45\nWash Area /Comfort\nRoom (male & female) *\n2.5 X 4\n10\n\n10\nTotal\n\n108\nCirculation Area**\n\n32\nTotal Workshop Area\n\n140\n* This area can also be used by other welding courses.\n** Area requirement is equivalent to 30% of the total teaching/learning areas\n\n--- PDF PAGE 55 ---\nFcaw nc i 53\n 091605\n3.6 TRAINERS QUALIFICATIONS FOR FCAW WELDER\n\nFLUX CORED ARC WELDING - NC I\n\nTRAINER QUALIFICATION (TQ I)\n\n• Must be a holder of FCAW NC I\n• Must have undergone training on Training Methodology I (TM I)\n• Must be physically and mentally fit\n• *Must have at least 2 years job/industry experience\n• Must be a civil service eligible (for government position or appropriate\nprofessional license issued by the Professional Regulatory Commission)\n\n* Optional. Only when required by the hiring institution\n\nReference: TESDA Board Resolution No. 2004 03\n\n3.7 INSTITUTIONAL ASSESSMENT\n\nInstitutional Assessment is to be undertaken by trainees to determine the\nachievement of units of competencies. A certificate of achievement is issued for\neach unit of competency.\n\n--- PDF PAGE 56 ---\nFcaw nc i 54\n 091605"
