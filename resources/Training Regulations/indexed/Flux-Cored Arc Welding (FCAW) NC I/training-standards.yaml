        "source_text": "51\n 091605\n3.3 TRAINEE ENTRY REQUIREMENTS\nTrainees or students wishing to gain entry into this course should possess the\nfollowing requirements:\n\n•\ncompleted training in SMAW NC I or holder of SMAW NC I\n•\ncan communicate either oral and written\n•\nphysically and mentally fit\n•\ncan perform basic mathematical computation\n\n3.4 LIST OF TOOLS, EQUIPMENT AND MATERIALS\nFLUX CORED ARC WELDING - NC I\n\nRecommended list of tools and materials per trainee for FLUX CORED ARC\nWELDING - NC I\n\nTOOLS\n(for 25 trainees)\nEQUIPMENT\n(for 25 trainees)\nMATERIAL\n(per trainee)\nQty.\nDescription\nQty.\nDescription\nQty.\nDescription\n25 pcs.\nChipping\nHammer\n12 units\nFCAW Welding\nmachine, FCAW\ngun and\naccessories\n1 reel\nFiller wire E71T-I\n(or equivalent)\n1mm dia.\n75 pcs.\nSteel brush\n12 pcs.\nWelding\npositioners\n38 pcs.\n\nMild steel sheet\n3.2mm X 50mm\nX 150mm\n12 pcs.\nPlier/tongs\n12 units\nPortable disc\ngrinder\n40 pcs\nMild steel plate\n10mm X 100mm\nX 150mm\n20 pcs. Files-bastard\ncut\n1 unit\nExhaust fan\n27 pcs\nCutting disc\n3/32” x 5/8\" x 4”\ndia.\n25 pcs.\nWelding Mask\n2 units\nWork bench w/\nbench vice on 4\ncorners\n19 pcs.\nGrinding disc\n1/4” x 5/8\" x 4\"\ndia.\n25 sets\nLeather\napron/jacket\n2 sets\nOxy-\nacetylene/Oxy-\nLPG cutting outfit\n5 cyl.\nShielding gas\n(75% argon 25%\nCO2)\n50 sets\nLeather gloves,\nlong\n1 unit\nPedestal /bench\ngrinding machine\n1 cyl.\noxygen\n5 pcs.\nSafety goggles,\nwide vision,\nclear\n1 unit\nIndustrial fan\n1 cyl.\nLPG or\nAcetylene\n5 pcs.\nOxy-acetylene\nGoggles\n\n3 pcs.\nDark glass\n12 pcs.\nTry square 300\nmm. Long\n\n46 pcs.\nLens clear glass\n\n--- PDF PAGE 54 ---\nFcaw nc i 52\n 091605\n12 pcs.\nSteel square\n300 mm. long\n\n1 tube\nMetal marker\n12 pcs. Files-half round\n5 pcs.\nFillet gauge\n1 pc.\nWire Cutter\n1 pc.\nHand Hacksaw\n\n3.5 TRAINING FACILITIES\n\nThe welding workshop must be of concrete structure. Based on class size of 25\nstudents/trainees the space requirements for the teaching/learning and circulation areas\nare as follows:\n\nTEACHING/LEARNING\nAREAS\nSIZE IN\nMETERS\nAREA IN SQ.\nMETERS\nQTY\nTOTAL AREA\nIN SQ.\nMETERS\nWelding Booth\n2 X 1.5\n3\n5\n15\nGrinding Booth*\n2 X 1.5\n3\n2\n6\nMaterials/Preparation\nArea*\n2 X 2\n4\n\n4\nBench work Area*\n1.5 X 2.5\n4\n2\n8\nTool Room & S/M Storage\nArea*\n4 X 5\n20\n\n20\nLearning Resource Area*\n5 X 9\n45\n\n45\nWash Area /Comfort\nRoom (male & female) *\n2.5 X 4\n10\n\n10\nTotal\n\n108\nCirculation Area**\n\n32\nTotal Workshop Area\n\n140\n* This area can also be used by other welding courses.\n** Area requirement is equivalent to 30% of the total teaching/learning areas\n\n--- PDF PAGE 55 ---\nFcaw nc i"
