    "source_text": "SECTION 3 TRAINING STANDARDS\n\nThese guidelines are set to provide the Technical and Vocational Education and\nTraining (TVET) providers with information and other important requirements to consider\nwhen designing training programs for FLUX CORED ARC WELDING (FCAW) NCl.\n\n3.1 CURRICULUM DESIGN\n\nCourse Title: FLUX CORED ARC WELDING\n\nNC Level I\n\nSuggested Nominal Training Hours: 28 hrs. ( Basic Competencies)\n\n 56 hrs. ( Common Competencies)\n\n 72 hrs. ( Core Competencies)\n\nCourse Description:\n\nThis course is designed to enhance the knowledge, skills and attitudes in Flux\nCored Arc Welding NCl in accordance with industry standards. It covers core\ncompetencies such as Welding Carbon Steel Plates Using FCAW.\n\nBASIC COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Receive and\nrespond to\nworkplace\ncommunication\n1.1 Explain routinary\n speaking & messages\n in a workplace.\n1.2 Follow routinary\n speaking & message\n1.3 Perform work duties\n following written\n notices.\n• Group\ndiscussion\n• Interaction\n• Interviews/\nquestioning\n• Observation\n2. Work with\nothers\n2.1 Develop effective\n workplace relationship.\n2.2 Contribute to work\ngroup activities.\n• Group\ndiscussion\n• Interaction\n• Interviews/\nquestioning\n• Demonstration\n• Observation\n\n--- PDF PAGE 49 ---\nFcaw nc i 47\n 091605\n3. Demonstrate\nwork values\n\n3.1 Define the purpose of\nwork\n3.2 Apply work\nvalues/ethics\n3.3 Deal with ethical\nproblems\n3.4 Maintain integrity of\nconduct in the\nworkplace\n• Group\ndiscussion\n• Interaction\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n4. Practice\nhousekeeping\nprocedures\n4.1 Sort and remove\n unnecessary items\n4.2 Arrange items\n4.3 Maintain work areas,\n tools and equipment\n4.4 Follow standardize\n work process and\n procedures\n4.5 Perform work\nspontaneously\n• Group\ndiscussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\