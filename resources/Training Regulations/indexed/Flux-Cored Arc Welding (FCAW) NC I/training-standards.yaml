      "source_text": "Course Title: FLUX CORED ARC WELDING\n\nNC Level I\n\nSuggested Nominal Training Hours: 28 hrs. ( Basic Competencies)\n\n 56 hrs. ( Common Competencies)\n\n 72 hrs. ( Core Competencies)\n\nCourse Description:\n\nThis course is designed to enhance the knowledge, skills and attitudes in Flux\nCored Arc Welding NCl in accordance with industry standards. It covers core\ncompetencies such as Welding Carbon Steel Plates Using FCAW.\n\nBASIC COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Receive and\nrespond to\nworkplace\ncommunication\n1.1 Explain routinary\n speaking & messages\n in a workplace.\n1.2 Follow routinary\n speaking & message\n1.3 Perform work duties\n following written\n notices.\n• Group\ndiscussion\n• Interaction\n• Interviews/\nquestioning\n• Observation\n2. Work with\nothers\n2.1 Develop effective\n workplace relationship.\n2.2 Contribute to work\ngroup activities.\n• Group\ndiscussion\n• Interaction\n• Interviews/\nquestioning\n• Demonstration\n• Observation\n\n--- PDF PAGE 49 ---\nFcaw nc i 47\n 091605\n3. Demonstrate\nwork values\n\n3.1 Define the purpose of\nwork\n3.2 Apply work\nvalues/ethics\n3.3 Deal with ethical\nproblems\n3.4 Maintain integrity of\nconduct in the\nworkplace\n• Group\ndiscussion\n• Interaction\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n4. Practice\nhousekeeping\nprocedures\n4.1 Sort and remove\n unnecessary items\n4.2 Arrange items\n4.3 Maintain work areas,\n tools and equipment\n4.4 Follow standardize\n work process and\n procedures\n4.5 Perform work\nspontaneously\n• Group\ndiscussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n\n--- PDF PAGE 50 ---\nFcaw nc i 48\n 091605\nCOMMON COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n\n1. Apply Safety\nPractices\n\n1.1 Identify hazardous areas\n1.2 Use protective clothing\nand devices\n1.3 Perform safe handling of\ntools,\n equipment and materials\n1.4 Perform first aid\n1.5 Use fire extinguisher\n\n• Lecturette\n• Practical\n application\n\n• Oral\n questioning\n• Written\n• Demonstration\n2. Interpret\nworking\ndrawings and\nsketches\n2.1 Identify standard alphabet\nof lines\n2.2 Identify orthographic/\nisometric views\n2.3 Interpret standard drawing\nsymbols, dimensional\ntolerances and notations\n• Lecturette\n• Practical\n application\n\n• Oral\n questioning\n• Written\n\n3. Perform\nIndustry\ncalculations\n3.1 Perform four fundamental\n operations\n3.2 Perform conversion of\nunits\n3.3 Perform calculations on\nalgebraic expressions\n3.4 Compute percentage and\nratio\n• Lecturette\n• Practical\n application\n\n• Oral questioning\n• Written test\n\n4. Contribute to\n quality\n system\n4.1 Inspect work done\n4.2 Apply quality standards to\nwork\n4.3 Protect company\nproperty\n and customer interest\n• Lecturette\n• Practical\n application\n\n• Oral\n questioning\n• Written\n• Demonstration\n5. Use hand tools\n5.1 Select hand tools\n5.2 Use hand tools\n5.3 Maintain hand tools\n• Lecturette\n• Practical\n application\n\n• Oral\n questioning\n• Written\n•Demonstration\n6. Prepare Weld\nMaterials\n\n6.1 Set-up cutting equipment\n6.2 Cut and prepare edge of\n materials\n6.3 Clean surfaces and edges\n6.4 Prepare welding\n consumables\n6.5 Prepare welding safety\n and protective equipment\n\n• Lecturette\n• Practical\n application\n\n• Observation\n• Demonstration\nand oral\nquestioning\n• Written test\n\n--- PDF PAGE 51 ---\nFcaw nc i 49\n 091605\n7. Set-up Welding\nEquipment\n7.1 Set up welding machine\n7.2 Set up welding\naccessories\n7.3 Set up welding\npositioners, jigs and\nfixtures\n7.4 Set up pre-heating\ntools/equipment as\nrequired\n• Lecturette\n• Demonstration\n• Observation and\noral questioning\n• Demonstration\nand oral\nquestioning\n• Written test\n8. Fit up Weld\nMaterials\n8.1 Perform tack welding\n8.2 Check gap and alignment\n8.3 Set up welding positioner\n\n• Lecturette\n• Demonstration\n\n• Observation and\noral questioning\n• Demonstration\nand oral\nquestioning\n• Written test\n9. Repair\n Welds\n9.1 Mark/locate weld defects\n9.2 Prepare tools and\n equipment\n9.3 Remove defects\n9.4 Perform re-welding\n\n• Lecturette\n• Demonstration\n\n• Observation and\noral questioning\n• Demonstration\nand oral\nquestioning\n•Written test\n\nCORE COMPETENCY\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n\n1. Weld Carbon\nSteel Plates\nUsing FCAW\n\n1.1 Perform single pass fillet\n weld in different positions\n (1F-4F)\n1.2 Perform multiple pass\n fillet weld in different\n positions (1F-4F)\n1.3 Perform multiple pass\ngroove weld in different\npositions (1G-3G)\n• Lecturette\n• Demonstration\n\n• Observation and\noral questioning\n• Demonstration\nand oral\nquestioning\n• Written test\n\n--- PDF PAGE 52 ---\nFcaw nc i 50\n 091605",
