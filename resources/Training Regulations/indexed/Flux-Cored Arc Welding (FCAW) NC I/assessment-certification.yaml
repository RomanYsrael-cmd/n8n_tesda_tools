  "source_text": "SECTION 4 NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1\nTo attain the National Qualification of FCAW NC I, the candidate must\ndemonstrate competence in all the units of competency listed in Section 1.\nSuccessful candidates shall be awarded a National Certificate signed by the\nTESDA Director General.\n\n4.2\nAssessment shall focus on the core units of competency, weld carbon steel\nplates using FCAW. The basic and common units shall be integrated or assessed\nconcurrently with the core units.\n\n4.3 The following are qualified to apply for assessment and certification:\n\n4.3.1 Graduates of formal, non-formal and informal including enterprise-based\n training programs.\n\n4.3.2 Experienced workers (wage employed or self employed)\n\n4.4\nThe guidelines on assessment and certification are discussed in detail in the\n\"Procedures Manual on Assessment and Certification\" and \"Guidelines on the\nImplementation of the Philippine TVET Qualification and Certification System\n(PTCQS)\".\n\n--- PDF PAGE 57 ---\nFcaw nc i 55\n 091605\n\nBASIC\nCOMPETENCIES\nCOMMON\nCOMPETENCIES\nCORE COMPETENCIES\n "
