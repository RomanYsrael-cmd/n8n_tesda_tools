      "term": "66",
      "definition": "10. Axis - In 3D space, the axis most commonly refers to a dimension on the X,Y,Z coordinate system, but it can also be described as directional traits of an object in local space. 11. Background - the part of a scene or view furthest from the point of interest thus giving further impression on the subject. 12. Browser - a software package that provides the user interface for accessing Internet, intranet and extranet Web sites. 13. Break - a common term used in game development to describe the process in decomposing, cutting, slicing, or modify an asset for a 2D Artist. 14. Color Map - is a neatly arranged and index of color pallets that are based on a specific image requirement. Some color maps, contain corresponding RBG code, CMYK code, HTML code, etc. near it’s respected color swatch. 15. Compiler - is a program that translates (compiles) source code(s) written in a high- level language into a set of machine-language instructions that can be understood and executed by a digital computer's Central Processing Unit (CPU). This can also directly pertain to the process of compressing text, images, and other data into one specific file format. 16. Computer - a device that has the ability to accept data; internally store and execute a program of instructions; perform mathematical, logical, and manipulative operations on data; and report the results. 17. Computer Terminal - any input/output device connected by telecommunications links to a computer. 18. Construct - Refers to any specific characteristic, trait, detail or reference used by an artist in the visual development of a single whole game object or each of its combining/building parts, which will be found in the model sheet and/or the game environment. Objects in the game environment may refer to a character, props, background, or any other object in game development. Example, character construct, facial construct, weapon construct, etc. 19. Concept - Something formed in the mind; a thought or notion. 20. Concept Art - is a form of illustration where the main goal is to convey a visual representation of a design, idea, and/or mood for use in films, video games, animation, or comic books before it is put into the final product. Concept art is also referred to as visual development and/or concept design. This term can also be applied to retail design, set design, fashion design and architectural design. 21. Critical Thinking - is the process of thinking that questions assumptions. It is a way of deciding whether a claim is true, false; sometimes true, or partly true. 22. Cut Scenes - A cutscene (sometimes in-game cinematic or in-game movie) is a sequence in a video game over which the player has no or only limited control, breaking up the gameplay and used to advance the plot, strengthen the main character's development, introduces enemy characters, and provide background information, atmosphere, dialogue, and clues. Cutscenes often feature on the fly rendering, using the gameplay graphics to create scripted events. Cutscenes can also be animated, live action, or pre-rendered computer graphics streamed from a video file. 23. Data - objective measurements of the attributes (characteristics) of entities such as people, places, things, and events. 24. Diffuse Map - is a texture that is used to define the surface's main color. 25. Documentation - a collection of documents or information. 26. Edit - to modify the form or format of data 27. Encryption - to scramble data or convert it, prior to transmission, to a secret code that masks the meaning of he data to unauthorized recipients. 28. End-User - the consumer or player of the end-product for a video game. 29. Ergonomics - the science and technology emphasizing the safety, comfort, and ease of use of human-operated machines. The goal of ergonomics is to produce systems that are user-friendly: safe, comfortable and easy to use."
