      "term": "68",
      "definition": "technology. It encompasses such services as telecommunications, posts, multimedia, electronic commerce, broadcasting, and information technology. 46. Integrated Development Environment (IDE) - A software that provides comprehensive features and user interface for more efficient software development. Features usually include but not limited to: single input compile, execute, and debug; convenient source code display; library links for programming language reference. 47. Inverse Kinematics Animation - Also known as IK Animation, it is the processed method in 3D Animation that consist on positioning the ending limb of an articulated “chain” to obtain an automatic pose or articulation of the whole chain. Inverse kinematics is based on the following principles: 1. Joints are constrained with specific positional and rotational properties. 2. Position and orientation of parent objects is determined by the position and orientation of child objects. 48. Keyframe - is a single still image in an animated sequence that occurs at an important point in that sequence; key frames are defined throughout an animated sequence, in order to define pivotal points of motion before the frames in between are drawn or otherwise created to \"tween\" the motion between the two key frames. 49. Line-Work - A finalized art work that is normally not colored but has been cleaned and has been readied for final rendering. 50. Local Area Network (LAN) - a communications network that typically connects computers, terminals, and other computerized devices within a limited physical area such as an office, building, manufacturing plant and other work sites. 51. Microsoft DirectX - is a collection of application programming interfaces (APIs) for handling tasks related to multimedia, especially game programming and video, on Microsoft platforms. 52. Mesh - The entire surface of a 3D model that is referred as. 53. Normal (Surface Normal) - is a three-dimensional vector which is perpendicular to a surface. 54. NURBS - Also known as Non-uniform rational basis spline, is a mathematical model used in 3D modeling to generate and represent curves and surfaces which allow flexibility and precision for both analytic and modeled shapes. 55. Object code - Output files resulting from compiling the source code. These files contains the machine instructions used upon program execution. 56. Object Library - a consolidated collection of assets developed through the timeline that will be used for production. 57. Object Priority - a component in game development that focuses on the various developed objects and assets to be given an assigned responsibility for the game engine and other development tools within your develop environment. 58. Outsourcing - is when a major business process is contracted with another company. 59. Production - is the main stage of development, when assets and source code for the game are assembled and tested. 60. Programmer - write codes or instructions to make the computer do specific tasks. These instructions are called programs. 61. Prototype - an experimental model that illustrates the typical qualities of the person, animal, object or any element from which it is based on. 62. Prototyping - the method of experimenting on the model that illustrates the typical qualities of the person, animal, object or any element from which it is based on. 63. Quality Assurance - is an implemented process that ensures that a product or service meets a set of documented standards. This process guarantees that the product is free from errors, bugs, and other forms of glitches. 64. Raster - a raster graphics image, or bitmap, is a data structure representing a generally rectangular grid of pixels, or points of color. These images are stored in image files with varyious formats."
