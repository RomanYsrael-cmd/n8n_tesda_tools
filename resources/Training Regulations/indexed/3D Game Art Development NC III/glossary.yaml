      "term": "67",
      "definition": "30. Flag - refer to one or more bits that are used to store a binary value or code that has an assigned meaning, but can refer to uses of other data types. 31. Flash - can manipulate vector and raster graphics and supports bi-directional streaming of audio and video. It contains a scripting language called Action-Script. It is available in most common web browsers and some mobile phones and other electronic devices. Several software products, systems, and devices are able to create or display Flash, including the Adobe Flash Player. The Adobe Flash Professional multimedia authoring program is used to create content for the Adobe Engagement Platform, such as web applications, games and movies, and content for mobile phones and other embedded devices. 32. Forward Kinematics Animation - Also known as FK Animation, it is the processed method in 3D Animation where the position of a child object in an articulated “chain” are determined by the position and orientation of its parent object. For example, in a hierarchical linkage of a human figure, when the torso (the parent) bends over, the head (the child) moves along with it, but the head can be turned without affecting the torso. 33. Game - any medium of entertainment that involves manipulating a device in response to an interface that views a hypothetical visual world created by a combination of assets. 34. Game Artist (2D/3D) - an artist who creates art for one or more types of games. Game artists are responsible for all of the aspects of game development that call for visual art. 35. Game Designer - an individual who provides a direction to the visual and technical aspect of the game. Making sure the development from start to finish is according to the theme and manner of approach that matches the genre of the game. 36. Game Design Document (GDD) - A body of writing that an be used to furnish decisive instructional and definitive information covering the over all technicalities and range of a game in order to mold and achieve a certain standard. 37. Game Programmer - a software developer who uses programming languages and tools to implement game mechanics and parameters ranging from simple input responses, object physics, and artificial intelligence. 38. Global illumination - a global light source in the 3D space and world determining the light falling onto a surface, it maybe light which has taken a path directly from a light source (direct illumination), or light which has undergone reflection from other surfaces in the world (indirect illumination). 39. Graphic Composition - is when the use of digital graphic formats, styles, renders, modes, and outputs are selected and put together for a dedicated output for various digital media. Such as Raster Graphics and Vector Graphics. 40. Graphical User Interface (GUI) - is a type of user interface that allows the users to interact with electronic devices through images rather than text commands. 41. Graphic Application - any software or collection of programs that enable a person to manipulate visual images on a device or media. 42. Heightmap - is a digital gray-scale image used to store three-dimensional data. It´s usually used in bump mapping, displacement mapping and for terrain mesh generation, the intensity of a pixel's color represents the height displacement of the mesh's corresponding coordinate. A white pixel represents the highest point in the map while a black pixel marks the lowest point in the map. 43. In-Game Animation - any representation of action, may it be minor (limited loop sequenced) or major (cinematic) as long as it is integrated within the proper game flow . 44. Information - data placed in a meaningful and useful context for an end user. 45. Information and Communication Technology (ICT) - refers to technologies associated with the transmission and exchange of data in the form of sound, text, visual images, signals or any combination of those forms through the use of digital"
