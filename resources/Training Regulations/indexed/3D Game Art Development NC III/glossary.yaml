  "source_text": "DEFINITION OF TERMS \n \n \nGENERAL \n \n1) Certification - is the process of verifying and validating the competencies of a \nperson through assessment \n \n2) Certificate of Competency (COC) - is a certification issued to individuals who pass \nthe assessment for a single unit or cluster of units of competency \n \n3) Common Competencies - are the skills and knowledge needed by all people \nworking in a particular industry \n \n4) Competency - is the possession and application of knowledge, skills and attitudes to \nperform work activities to the standard expected in the workplace \n \n5) Competency Assessment - is the process of collecting evidence and making \njudgments on whether competency has been achieved \n \n6) Competency Standard (CS) - is the industry-determined specification of \ncompetencies required for effective work performance \n \n7) Context of Assessment - refers to the place where assessment is to be conducted \nor carried out \n \n8) Core Competencies - are the specific skills and knowledge needed in a particular \narea of work - industry sector/occupation/job role \n \n9) Critical aspects of competency - refers to the evidence that is essential for \nsuccessful performance of the unit of competency \n \n10) Elective Competency - are the additional skills and knowledge required by the \nindividual or enterprise for work \n \n11) Elements - are the building blocks of a unit of competency. They describe in \noutcome terms the functions that a person perform in the workplace \n \n12) Evidence Guide - is a component of the unit of competency that defines or identifies \nthe evidences required to determine the competence of the individual. It provides \ninformation on critical aspects of competency, Required Knowledge, required skills, \nresource implications, assessment method and context of assessment \n \n13) Level - refers to the category of skills and knowledge required to do a job \n \n14) Method of Assessment - refers to the ways of collecting evidence and when \nevidence should be collected \n \n15) National Certificate (NC) - is a certification issued to individuals who achieve all the \nrequired units of competency for a national qualification defined under the Training \nRegulations. NCs are aligned to specific levels within the PTQF \n \n16) Performance Criteria - are evaluative statements that specify what is to be \nassessed and the required level of performance \n \n17) Qualification - is a cluster of units of competencies that meets job roles and is \nsignificant in the workplace. It is also a certification awarded to a person on \nsuccessful completion of a course in recognition of having demonstrated \ncompetencies in an industry sector\n\n--- PDF PAGE 67 ---\n_____________________________________________________________________________ \nTR - 3D GAME ART DEVELOPMENT NC III \n \n \n65\n \n18) Range of Variables - describes the circumstances or context in which the work is to \nbe performed \n \n19) Recognition of Prior Learning (RPL) - is the acknowledgement of an individual’s \nskills, knowledge and attitudes gained from life and work experiences outside \nregistered training programs \n \n20) Resource Implications - refers to the resources needed for the successful \nperformance of the work activity described in the unit of competency. It includes work \nenvironment and conditions, materials, tools and equipment \n \n21) Basic Competencies - are the skills and knowledge that everyone needs for work \n \n22) Training Regulations (TR) - refers to the document promulgated and issued by \nTESDA consisting of competency standards, national qualifications and training \nguidelines for specific sectors/occupations. The TR serves as basis for establishment \nof qualification and certification under the PTQF. It also serves as guide for \ndevelopment of competency-based curricula and instructional materials including \nregistration of TVET programs offered by TVET providers \n \n23) Required Knowledge - refers to the competency that involves in applying knowledge \nto perform work activities. It includes specific knowledge that is essential to the \nperformance of the competency \n \n24) Required Skills - refers to the list of the skills needed to achieve the elements and \nperformance criteria in the unit of competency. It includes generic and industry \nspecific skills \n \n25) Unit of Competency - is a component of the competency standards stating a specific \nkey function or role in a particular job or occupation; it is the smallest component of \nachievement that can be assessed and certified under the PTQF \n \nSECTOR SPECIFIC \n \n1. 3D Model - a mathematical representation of any visible three-dimensional object. \n2. 3D Modeling - is the process of creating a three-dimensional representation of any \nsurface and/or object by manipulating polygons, edges, elements, boarders and \nvertices in simulated 3D space. \n3. Aliasing - Artifact or distortion, often referred to as 'jaggies', that occurs in a digital \nimage. \n4. Ambient Occlusion - is a shading method that is often used as a replacement to \nGlobal Illumination. \n5. Anti-aliasing - Techniques to remove aliasing artifacts. Some examples are \noversampling/super-sampling and filtering \n6. Art \nStyle \n- \nDrawn \nor \nimplied \nvisual \ncharacteristics \nand \nelements \ncombined then expressed in a particular (often unique) and consistent manner. \n7. Art Document - A written instrument that can be used to furnish visual instruction and \ndefinitive information in order to achieve a certain trend and standard. \n8. Animation - is the rapid display of a sequence of images of 2-D or 3-D artwork or \nmodel positions in order to create an illusion of movement. The effect is an optical \nillusion of motion due to the phenomenon of persistence of vision, and can be created \nand demonstrated in several ways. \n9. Asset List - A series of created resources categorized into a organized medium for \nreference.\n\n--- PDF PAGE 68 ---\n_____________________________________________________________________________ \nTR - 3D GAME ART DEVELOPMENT NC III \n \n \n66\n10. Axis - In 3D space, the axis most commonly refers to a dimension on the X,Y,Z \ncoordinate system, but it can also be described as directional traits of an object in \nlocal space. \n11. Background - the part of a scene or view furthest from the point of interest thus \ngiving further impression on the subject. \n12. Browser - a software package that provides the user interface for accessing Internet, \nintranet and extranet Web sites. \n13. Break - a common term used in game development to describe the process in \ndecomposing, cutting, slicing, or modify an asset for a 2D Artist. \n14. Color Map - is a neatly arranged and index of color pallets that are based on a \nspecific image requirement. Some color maps, contain corresponding RBG code, \nCMYK code, HTML code, etc. near it’s respected color swatch. \n15. Compiler - is a program that translates (compiles) source code(s) written in a high-\nlevel language into a set of machine-language instructions that can be understood \nand executed by a digital computer's Central Processing Unit (CPU). This can also \ndirectly pertain to the process of compressing text, images, and other data into one \nspecific file format. \n16. Computer - a device that has the ability to accept data; internally store and execute a \nprogram of instructions; perform mathematical, logical, and manipulative operations \non data; and report the results. \n17. Computer Terminal - any input/output device connected by telecommunications links \nto a computer. \n18. Construct - Refers to any specific characteristic, trait, detail or reference used by an \nartist in the visual development of a single whole game object or each of its \ncombining/building parts, which will be found in the model sheet and/or the game \nenvironment. Objects in the game environment may refer to a character, props, \nbackground, or any other object in game development. Example, character construct, \nfacial construct, weapon construct, etc. \n19. Concept - Something formed in the mind; a thought or notion. \n20. Concept Art - is a form of illustration where the main goal is to convey a visual \nrepresentation of a design, idea, and/or mood for use in films, video games, \nanimation, or comic books before it is put into the final product. Concept art is also \nreferred to as visual development and/or concept design. This term can also be \napplied to retail design, set design, fashion design and architectural design. \n21. Critical Thinking - is the process of thinking that questions assumptions. It is a way \nof deciding whether a claim is true, false; sometimes true, or partly true. \n22. Cut Scenes - A cutscene (sometimes in-game cinematic or in-game movie) is a \nsequence in a video game over which the player has no or only limited control, \nbreaking up the gameplay and used to advance the plot, strengthen the main \ncharacter's development, introduces enemy characters, and provide background \ninformation, atmosphere, dialogue, and clues. Cutscenes often feature on the fly \nrendering, using the gameplay graphics to create scripted events. Cutscenes can also \nbe animated, live action, or pre-rendered computer graphics streamed from a video \nfile. \n23. Data - objective measurements of the attributes (characteristics) of entities such as \npeople, places, things, and events. \n24. Diffuse Map - is a texture that is used to define the surface's main color. \n25. Documentation - a collection of documents or information. \n26. Edit - to modify the form or format of data \n27. Encryption - to scramble data or convert it, prior to transmission, to a secret code \nthat masks the meaning of he data to unauthorized recipients. \n28. End-User - the consumer or player of the end-product for a video game. \n29. Ergonomics - the science and technology emphasizing the safety, comfort, and ease \nof use of human-operated machines. The goal of ergonomics is to produce systems \nthat are user-friendly: safe, comfortable and easy to use.\n\n--- PDF PAGE 69 ---\n_____________________________________________________________________________ \nTR - 3D GAME ART DEVELOPMENT NC III \n \n \n67\n30. Flag - refer to one or more bits that are used to store a binary value or code that has \nan assigned meaning, but can refer to uses of other data types. \n31. Flash - can manipulate vector and raster graphics and supports bi-directional \nstreaming of audio and video. It contains a scripting language called Action-Script. It \nis available in most common web browsers and some mobile phones and other \nelectronic devices. Several software products, systems, and devices are able to \ncreate or display Flash, including the Adobe Flash Player. The Adobe Flash \nProfessional multimedia authoring program is used to create content for the Adobe \nEngagement Platform, such as web applications, games and movies, and content for \nmobile phones and other embedded devices. \n32. Forward Kinematics Animation - Also known as FK Animation, it is the processed \nmethod in 3D Animation where the position of a child object in an articulated “chain” \nare determined by the position and orientation of its parent object. For example, in a \nhierarchical linkage of a human figure, when the torso (the parent) bends over, the \nhead (the child) moves along with it, but the head can be turned without affecting the \ntorso. \n33. Game - any medium of entertainment that involves manipulating a device in response \nto an interface that views a hypothetical visual world created by a combination of \nassets. \n34. Game Artist (2D/3D) - an artist who creates art for one or more types of games. \nGame artists are responsible for all of the aspects of game development that call for \nvisual art. \n35. Game Designer - an individual who provides a direction to the visual and technical \naspect of the game. Making sure the development from start to finish is according to \nthe theme and manner of approach that matches the genre of the game. \n36. Game Design Document (GDD) - A body of writing that an be used to furnish \ndecisive instructional and definitive information covering the over all technicalities and \nrange of a game in order to mold and achieve a certain standard. \n37. Game Programmer - a software developer who uses programming languages and \ntools to implement game mechanics and parameters ranging from simple input \nresponses, object physics, and artificial intelligence. \n38. Global illumination - a global light source in the 3D space and world determining the \nlight falling onto a surface, it maybe light which has taken a path directly from a light \nsource (direct illumination), or light which has undergone reflection from other \nsurfaces in the world (indirect illumination). \n39. Graphic Composition - is when the use of digital graphic formats, styles, renders, \nmodes, and outputs are selected and put together for a dedicated output for various \ndigital media. Such as Raster Graphics and Vector Graphics. \n40. Graphical User Interface (GUI) - is a type of user interface that allows the users to \ninteract with electronic devices through images rather than text commands. \n41. Graphic Application - any software or collection of programs that enable a person to \nmanipulate visual images on a device or media. \n42. Heightmap - is a digital gray-scale image used to store three-dimensional data. It´s \nusually used in bump mapping, displacement mapping and for terrain mesh \ngeneration, the intensity of a pixel's color represents the height displacement of the \nmesh's corresponding coordinate. A white pixel represents the highest point in the \nmap while a black pixel marks the lowest point in the map. \n43. In-Game Animation - any representation of action, may it be minor (limited loop \nsequenced) or major (cinematic) as long as it is integrated within the proper game \nflow . \n44. Information - data placed in a meaningful and useful context for an end user. \n45. Information and Communication Technology (ICT) - refers to technologies \nassociated with the transmission and exchange of data in the form of sound, text, \nvisual images, signals or any combination of those forms through the use of digital\n\n--- PDF PAGE 70 ---\n_____________________________________________________________________________ \nTR - 3D GAME ART DEVELOPMENT NC III \n \n \n68\ntechnology. It encompasses such services as telecommunications, posts, \nmultimedia, electronic commerce, broadcasting, and information technology. \n46. Integrated Development Environment (IDE) - A software that provides \ncomprehensive features and user interface for more efficient software development. \nFeatures usually include but not limited to: single input compile, execute, and debug; \nconvenient source code display; library links for programming language reference. \n47. Inverse Kinematics Animation - Also known as IK Animation, it is the processed \nmethod in 3D Animation that consist on positioning the ending limb of an articulated \n“chain” to obtain an automatic pose or articulation of the whole chain. Inverse \nkinematics is based on the following principles: 1. Joints are constrained with specific \npositional and rotational properties. 2. Position and orientation of parent objects is \ndetermined by the position and orientation of child objects. \n48. Keyframe - is a single still image in an animated sequence that occurs at an \nimportant point in that sequence; key frames are defined throughout an animated \nsequence, in order to define pivotal points of motion before the frames in between are \ndrawn or otherwise created to \"tween\" the motion between the two key frames. \n49. Line-Work - A finalized art work that is normally not colored but has been cleaned \nand has been readied for final rendering. \n50. Local Area Network (LAN) - a communications network that typically connects \ncomputers, terminals, and other computerized devices within a limited physical area \nsuch as an office, building, manufacturing plant and other work sites. \n51. Microsoft DirectX - is a collection of application programming interfaces (APIs) for \nhandling tasks related to multimedia, especially game programming and video, on \nMicrosoft platforms. \n52. Mesh - The entire surface of a 3D model that is referred as. \n53. Normal (Surface Normal) - is a three-dimensional vector which is perpendicular to a \nsurface. \n54. NURBS - Also known as Non-uniform rational basis spline, is a mathematical model \nused in 3D modeling to generate and represent curves and surfaces which allow \nflexibility and precision for both analytic and modeled shapes. \n55. Object code - Output files resulting from compiling the source code. These files \ncontains the machine instructions used upon program execution. \n56. Object Library - a consolidated collection of assets developed through the timeline \nthat will be used for production. \n57. Object Priority - a component in game development that focuses on the various \ndeveloped objects and assets to be given an assigned responsibility for the game \nengine and other development tools within your develop environment. \n58. Outsourcing - is when a major business process is contracted with another \ncompany. \n59. Production - is the main stage of development, when assets and source code for the \ngame are assembled and tested. \n60. Programmer - write codes or instructions to make the computer do specific tasks. \nThese instructions are called programs. \n61. Prototype - an experimental model that illustrates the typical qualities of the person, \nanimal, object or any element from which it is based on. \n62. Prototyping - the method of experimenting on the model that illustrates the typical \nqualities of the person, animal, object or any element from which it is based on. \n63. Quality Assurance - is an implemented process that ensures that a product or \nservice meets a set of documented standards. This process guarantees that the \nproduct is free from errors, bugs, and other forms of glitches. \n64. Raster - a raster graphics image, or bitmap, is a data structure representing a \ngenerally rectangular grid of pixels, or points of color. These images are stored in \nimage files with varyious formats.\n\n--- PDF PAGE 71 ---\n_____________________________________________________________________________ \nTR - 3D GAME ART DEVELOPMENT NC III \n \n \n69\n65. References - is an item from which a work is based on. This may include: an existing \nartwork, a reproduction (i.e., photo), a directly observed object (i.e., person), a \ndocumented description, or the artist's memory. \n66. Resource Asset List - a registry of resources that is being kept and completed. \n67. Rigging - is the process to prepare and create a 3D model ready for animation. \n68. Roughs/Thumbnails - A non-formal form of expressing ideas to simple easy to \nunderstand sketches for planning the main artwork or scene. \n69. Script - a text that contains organized flow of scenes captioned from a root story that \nis expressed as interaction of characters, object movement and dialogue. \n70. Shader - is a process within an application and rendering to determine the final \nsurface properties of an object or image. This often includes arbitrarily complex \ndescriptions of light absorption, diffusion, texture mapping, reflection, refraction, \nshadowing, surface displacement and post-processing effects. \n71. Simulation - the process of imitating a real phenomenon. Advanced computer \nprograms can simulate weather conditions, chemical reactions, atomic reactions, \neven biological processes. \n72. Software - computer programs and procedures concerned with the operation of an \ninformation system \n73. Sound Designer - an individual that manipulates the composition of the songs, \neffects, voice and music that will be used in each event. \n74. Source code - a text or set system instruction used in a programming language. \n75. Spline - is a Bezier-type curve that can be shaped and manipulated with a set \nnumber of control points, called CVs. Splines are used frequently in NURBS \nmodeling, where a three dimensional mesh can be \"lofted\" between two or more \nsplines to create a smooth surface. \n76. Standards - A criteria to which results are set upon. \n77. Story Board - are graphic organizers in the form of illustrations or images displayed \nin sequence for the purpose of pre-visualizing a motion picture, animation, motion \ngraphic or interactive media sequence. \n78. Style Guide - is a set of written design documents, which contain gathered \nreferences and key concepts used for a specific publication, organization, metrics, \nstyle, approach or field. The implementation of a style guide provides uniformity in \nstyle and formatting of a document for compiling concepts for a game. \n79. System - an assembly of methods, procedures, or techniques unified by regulated \ninteraction to form an organized whole. \n80. Texel - is a Texture element, as it is just a pixel that is part of a texture map. \n81. Texture mapping - the process of adding detail to surfaces of a 3D model. These \ndetails may be in the form of a raster image (texture) or color. \n82. Topology - Is the geometric surface characteristics of a 3D object, characterized by \npolygon distribution and edge-flow. \n83. User-friendly - also known as “Usability” is the ease of use and learn-ability of a \nhuman-made object. The object of use can be a software application, website, book, \ntool, machine, process, or anything a human interacts with. A usability study may be \nconducted as a primary job function by a usability analyst or as a secondary job \nfunction by designers, technical writers, marketing personnel, and others. \n84. UV Mapping - is a process in 3D modeling in making and flatting a 2D image \nrepresentation of a 3D model, with this process it allows a texture map to be placed \nonto a 3D object. The letters \"U\" and \"V\" are used to describe the 2D mesh because \n\"X\", \"Y\" and \"Z\" are already used to describe the 3D object in model/3D space. \n85. Vector - is a line or a movement defined by end-points or, essentially, the distance \nbetween point A and point B. Vectors can be used to calculate animated motion \nmathematically instead of through the use of manual key frames. \n86. Vertex - a point where two lines intersect that forms an angle. \n87. Video Game - is a game that involves interaction with an electronic user interface to \ngenerate visual feedback on a video device.\n\n--- PDF PAGE 72 ---\n_____________________________________________________________________________ \nTR - 3D GAME ART DEVELOPMENT NC III \n \n \n70"
}
