    {
      "term": "69",
      "definition": "65. References - is an item from which a work is based on. This may include: an existing artwork, a reproduction (i.e., photo), a directly observed object (i.e., person), a documented description, or the artist's memory. 66. Resource Asset List - a registry of resources that is being kept and completed. 67. Rigging - is the process to prepare and create a 3D model ready for animation. 68. Roughs/Thumbnails - A non-formal form of expressing ideas to simple easy to understand sketches for planning the main artwork or scene. 69. Script - a text that contains organized flow of scenes captioned from a root story that is expressed as interaction of characters, object movement and dialogue. 70. Shader - is a process within an application and rendering to determine the final surface properties of an object or image. This often includes arbitrarily complex descriptions of light absorption, diffusion, texture mapping, reflection, refraction, shadowing, surface displacement and post-processing effects. 71. Simulation - the process of imitating a real phenomenon. Advanced computer programs can simulate weather conditions, chemical reactions, atomic reactions, even biological processes. 72. Software - computer programs and procedures concerned with the operation of an information system 73. Sound Designer - an individual that manipulates the composition of the songs, effects, voice and music that will be used in each event. 74. Source code - a text or set system instruction used in a programming language. 75. Spline - is a Bezier-type curve that can be shaped and manipulated with a set number of control points, called CVs. Splines are used frequently in NURBS modeling, where a three dimensional mesh can be \"lofted\" between two or more splines to create a smooth surface. 76. Standards - A criteria to which results are set upon. 77. Story Board - are graphic organizers in the form of illustrations or images displayed in sequence for the purpose of pre-visualizing a motion picture, animation, motion graphic or interactive media sequence. 78. Style Guide - is a set of written design documents, which contain gathered references and key concepts used for a specific publication, organization, metrics, style, approach or field. The implementation of a style guide provides uniformity in style and formatting of a document for compiling concepts for a game. 79. System - an assembly of methods, procedures, or techniques unified by regulated interaction to form an organized whole. 80. Texel - is a Texture element, as it is just a pixel that is part of a texture map. 81. Texture mapping - the process of adding detail to surfaces of a 3D model. These details may be in the form of a raster image (texture) or color. 82. Topology - Is the geometric surface characteristics of a 3D object, characterized by polygon distribution and edge-flow. 83. User-friendly - also known as “Usability” is the ease of use and learn-ability of a human-made object. The object of use can be a software application, website, book, tool, machine, process, or anything a human interacts with. A usability study may be conducted as a primary job function by a usability analyst or as a secondary job function by designers, technical writers, marketing personnel, and others. 84. UV Mapping - is a process in 3D modeling in making and flatting a 2D image representation of a 3D model, with this process it allows a texture map to be placed onto a 3D object. The letters \"U\" and \"V\" are used to describe the 2D mesh because \"X\", \"Y\" and \"Z\" are already used to describe the 3D object in model/3D space. 85. Vector - is a line or a movement defined by end-points or, essentially, the distance between point A and point B. Vectors can be used to calculate animated motion mathematically instead of through the use of manual key frames. 86. Vertex - a point where two lines intersect that forms an angle. 87. Video Game - is a game that involves interaction with an electronic user interface to generate visual feedback on a video device."
