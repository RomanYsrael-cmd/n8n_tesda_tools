      "term": "1. 3D Model - a mathematical representation of any visible three-dimensional object.",
      "definition": "2. 3D Modeling - is the process of creating a three-dimensional representation of any surface and/or object by manipulating polygons, edges, elements, boarders and vertices in simulated 3D space. 3. Aliasing - Artifact or distortion, often referred to as 'jaggies', that occurs in a digital image. 4. Ambient Occlusion - is a shading method that is often used as a replacement to Global Illumination. 5. Anti-aliasing - Techniques to remove aliasing artifacts. Some examples are oversampling/super-sampling and filtering 6. Art Style - Drawn or implied visual characteristics and elements combined then expressed in a particular (often unique) and consistent manner. 7. Art Document - A written instrument that can be used to furnish visual instruction and definitive information in order to achieve a certain trend and standard. 8. Animation - is the rapid display of a sequence of images of 2-D or 3-D artwork or model positions in order to create an illusion of movement. The effect is an optical illusion of motion due to the phenomenon of persistence of vision, and can be created and demonstrated in several ways. 9. Asset List - A series of created resources categorized into a organized medium for reference."
