        "source_title": "APPLY RIGGED IN-GAME ANIMATION",
        "source_text": "--- PDF PAGE 51 ---\n_____________________________________________________________________________ \nTR - 3D GAME ART DEVELOPMENT NC III                                                              \n \n \n49\nUNIT OF COMPETENCY : \nAPPLY RIGGED IN-GAME ANIMATION \n \nUNIT CODE \n:        ICT313351 \n \nUNIT DESCRIPTOR \n: \nThis unit defines the knowledge, skills and attitudes \nrequired to create or develop a rig to be used in \ndeveloping key-frame animation using 3D graphic \nsoftware. \n                                                      \nELEMENT \nPERFORMANCE CRITERIA \nBold and Italicized terms are elaborated in the Range of Variables\n1. Import textured \nmodel asset \n1.1. Textured model is imported in accordance with the style \nguide. \n1.2.  All assets & textures are checked in accordance with \nthe style guide. \n1.3. Any additional assets are grouped in accordance with \nthe style guide. \n2. Create \nbones/joints \n2.1. Bones are added in accordance with the style guide. \n2.2. Kinematics is set in accordance with the style guide. \n2.3. Naming conventions are checked in accordance with the \nstyle guide. \n3. Apply rig to   \ntextured model \n3.1. Bone Linking techniques are observed and \nestablished based on industry practices.  \n3.2. Envelopes & weights are set in accordance with the \nstyle guide. \n3.3. Imperfections are checked in accordance with the style \nguide. \n4. Apply In-game \nanimation \n4.1.  Rigged model is tested in accordance with the style \nguide. \n4.2.  Basic animation key frames are applied with rigged \nmodel in accordance to the style guide. \n4.3. Animation sequence is finalized in accordance with the \nstyle guide. \n4.4. Animation is rendered and exported in accordance with \nthe style guide. \n4.5. Motion File is exported in accordance with the style \nguide.\n\n--- PDF PAGE 52 ---\n_____________________________________________________________________________ \nTR - 3D GAME ART DEVELOPMENT NC III                                                              \n \n \n50\nRANGE OF VARIABLES \n \nVARIABLE\nRANGE\n1. Style Guide \nMay include but not limited: \n1.1 \nGame art style \n1.2 \nGame engine specifications \n1.3 \nGame metrics \n2. Assets \nMay include but not limited: \n2.1. 3D models \n2.2. UV maps \n2.3. Proxy objects \n3. Textures \nMay include but not limited: \n3.1. Bump map \n3.2. Diffuse map \n3.3. Specular map \n3.4. Normal map \n4. Bones \nMay include but not limited: \n4.1 \nSplines \n4.2 \nJoints \n4.3 \nChain \n4.4 \nNodes \n5. Bone linking \ntechniques \nMay include but not limited: \n4.5 \nAdd Bones \n4.6 \nSkin  \n4.7 \nConnecting \n4.8 \nGrouping \n4.9 \nMerging  \n4.10 Physique \n6. Kinematics \n5.1 \nInverse (IK) \n5.2 \nForward (FK) \n7. Imperfections \nMay include but not limited: \n6.1 \nStretching \n6.2 \nWeighting \n6.3 \nJoint influences\n\n--- PDF PAGE 53 ---\n_____________________________________________________________________________ \nTR - 3D GAME ART DEVELOPMENT NC III                                                              \n \n \n51\nEVIDENCE GUIDE \n \n1. Critical aspects of   \n    competency \nAssessment requires evidence that the candidate: \n1.1 \nImported textured model asset \n1.2 \nCreated bones / joints \n1.3 \nApplied rig to textured model \n1.4 \nApplied in-game animation \n2. Required \nKnowledge and \nAttitude \n2.1 \nGraphic manipulation \n2.2 \nObservation \n2.3 \nLearning with others \n2.4 \nDeductive reasoning \n2.5 \nHuman, animal, objects and background drawing \nprinciples \n2.6 \nPerspective, proportion, volume, camera fielding, timing \ntechnicalities \n2.7 \nActing, observation of movements and deductive \nreasoning \n2.8 \nBasic animation principles \n2.9 \nRigging knowledge \n2.10 Graphic software \n2.11 Animation software \n2.12 Phonetics knowledge \n2.13 Creative/Drawing and composition \n2.14 Storyboard and layout \n2.15 Problem solving \n2.16 Project management \n3. Required Skills \n3.1 \nSpatial visualization ability \n3.2 \nActive listening \n3.3 \nNarrative Skills \n3.4 \nSoftware manipulation \n3.5 \nDrawing skills \n3.6 \nOrganizational skills \n3.7 \nAnalytical Skills \n3.8 \nAble to read and interpret storyboard and layout \n3.9 \nTiming, space, weight analysis skills to animate actions \neffectively \n3.10 3D Graphic software manipulation skills \n3.11 Animation software manipulation skills \n3.12 Communication Skills \n3.13 Composition of elements and staging skills/eye for \ndetails \n3.14 Adherence to instructions \n3.15 Research \n3.16 Decision making exercise \n3.17 Implement execution plan\n\n--- PDF PAGE 54 ---\n_____________________________________________________________________________ \nTR - 3D GAME ART DEVELOPMENT NC III                                                              \n \n \n52\n \n4. Resource \nImplications \nThe following resources must be provided \n4.1 \nComputer with 3D software with peripherals \n4.2 \nElectronic pen and tablet \n4.3 \nMouse \n5. Methods of  \n    Assessment \nCompetency may be assessed through \n5.1 \nPortfolio \n5.2 \nDemonstration \n5.3 \nInterview \n6. Context of  \n    Assessment \n6.1 \nCompetency may be assessed in workplace or \nsimulated environment\n",
