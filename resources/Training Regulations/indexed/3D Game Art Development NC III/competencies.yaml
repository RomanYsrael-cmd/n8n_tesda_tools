        "source_title": "PREPARE ART DOCUMENT",
        "source_text": "--- PDF PAGE 41 ---\n_____________________________________________________________________________ \nTR - 3D GAME ART DEVELOPMENT NC III                                                              \n \n \n39\nUNIT OF COMPETENCY \n: \nPREPARE ART DOCUMENT \n \nUNIT CODE \n: \nICT313346 \n \nUNIT DESCRIPTOR \n: \nThis unit defines the knowledge, skills and attitudes \nrequired to develop concept art for character, \nprops/objects and background layout constructs. It \nalso involves concepts for special effects. \n \n \nELEMENT \nPERFORMANCE CRITERIA \nBold and Italicized terms are elaborated in the Range of \nVariables\n1. Prepare concept for \ncharacters \n1.1. Character model sheets are made with \nconstructs in line with GDD \n1.2. Functionality and detail of character construct are \nnoted in line with enterprise procedures. \n1.3. Object priority is assigned based on character \nmodel sheets \n2. Prepare concept art for \nprops/objects \n2.1. Prop/Object model sheets are made with \nconstructs in line with GDD \n2.2. Functionality and detail of object constructs are \nnoted in line with enterprise procedures  \n2.3. Object priority is assigned based on prop/object \nmodel sheets \n3. Prepare concept art for \nbackground layout \n3.1. Background model sheets are made with \nconstructs in line with GDD \n3.2. Functionality and detail of object constructs are \nnoted in line with enterprise procedures. \n4. Prepare concepts for \nspecial effects \n4.1. Type of effect is established in line with \nstoryboard and script \n4.2. Special effects studies are created based on the \nestablished type of effect \n4.3. Reference frames are drawn based on approved \nspecial effects studies \n4.4. Mock color is added to the effects based on given \nspecial effects studies \n4.5. Object priority is assigned based on given \nspecial effects studies \n5. Prepare concept arts \nfor GUI \n5.1 \nProp/Object model sheets are made with \nconstructs in line with GDD \n5.2 \nFunctionality and detail of object constructs are \nnoted in line with enterprise procedures  \n5.3 \nObject priority is assigned based on prop/object \nmodel sheets\n\n--- PDF PAGE 42 ---\n_____________________________________________________________________________ \nTR - 3D GAME ART DEVELOPMENT NC III                                                              \n \n \n40\nRANGE OF VARIABLES \n \nVARIABLE\nRANGE\n1. Constructs  \nMay include but are not limited: \nCharacters: \n1.1 \nExpressions \n1.2 \nTurnaround \n1.3 \nPoses \n1.4 \nCharacter physical attributes \n1.5 \nClothing and accessories \n1.6 \nMock colors \n \nProps/objects \n1.7 \nTurnaround \n1.8 \nPerspective \n1.9 \nFunctionality \n1.10 Size comparison \n1.11 Mock color \n1.12 References \n \nBackground layout \n1.13 Form \n1.14 Perspective \n1.15 Scale of objects within the background \n1.16 Layout of the map and functionality of the elements \nin the map such as doors, traps, stairs, trees, etc \n1.17 Setting (morning, dusk, etc.) - add to definition of \nterms \n1.18 Mock color and texture of each element in the \nbackground and the background itself \n1.19 Visual appeal \n2. Object Priority \nMay include but are not limited: \n2.1 \nAssign responsibility \n2.2 \nAssign relationship \n2.3 \nAssign limitations \n2.4 \nAssign layer\n\n--- PDF PAGE 43 ---\n_____________________________________________________________________________ \nTR - 3D GAME ART DEVELOPMENT NC III                                                              \n \n \n41\nEVIDENCE GUIDE \n \n1. Critical aspects of  \ncompetency \nAssessment requires evidence that the candidate: \n1.1 Prepared concept art for characters \n1.2 Prepared concept art for props/objects \n1.3 Prepared concept art for background layout \n1.4 Prepared concepts for special effects \n1.5 Prepared concepts for GUI \n2. Required Knowledge \nand Attitude \n2.1 \nKnowledge of Constructs \n2.2 \nCharacters \n2.3 \nObjects \n2.4 \nBackgrounds & Layouts \n2.5 \nSpecial Effects \n2.6 \nResearching using library and printed literature \n2.7 \nCoping with stress \n2.8 \nProblem solving \n2.9 \nProject management \n2.10 Observation \n2.11 Estimation (for scaling/perspective/volume) \n2.12 Color coordination \n2.13 Basic animation \n2.14 Composition and Layout \n3. Required Skills \n3.1 \nDrawing Skills \n3.2 \nConceptualize \n3.3 \nConduct a simple research \n3.4 \nSetting realistic goals \n3.5 \nDraft a mind map \n3.6 \nActive listening \n3.7 \nDecision making exercise \n3.8 \nDiscussion \n3.9 \nImplement execution plan \n3.10 Research Skills \n3.11 Organization Skills \n3.12 Basic problem solving Skills \n3.14 Adherence to instructions \n4. Resource \nImplications \nThe following resources must be provided \n4.1 \nPC with drawing application with peripherals \n4.2 \nMouse \n4.3 \nPencil \n4.4 \nPaper \n4.5 \nPen\n\n--- PDF PAGE 44 ---\n_____________________________________________________________________________ \nTR - 3D GAME ART DEVELOPMENT NC III                                                              \n \n \n42\n \n5. Methods of \nAssessment \nCompetency may be assessed through \n5.1 \nDemonstration / Practical exam  \n5.2 \nPresentation with questioning \n5.3 \nPortfolio of work samples \n5.4 \nGroup interview \n5.5 \nIndividual interview \n6. Context of \nAssessment \n6.1 \nCompetency may be assessed in workplace or \nsimulated environment\n",
