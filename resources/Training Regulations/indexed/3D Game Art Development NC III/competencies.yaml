        "source_title": "CREATE STORYBOARD AND ASSET LIST",
        "source_text": "--- PDF PAGE 38 ---\n_____________________________________________________________________________ \nTR - 3D GAME ART DEVELOPMENT NC III                                                              \n \n \n36\nUNIT OF COMPETENCY    \n: \nCREATE STORYBOARD AND ASSET LIST \n \nUNIT CODE \n: \nICT313345 \n \nUNIT DESCRIPTOR \n: \nThis unit defines the knowledge, skills and attitudes \nrequired to create storyboard and asset list based \non the identified key references and storyline.    \n \n \nELEMENT \nPERFORMANCE CRITERIA \nBold and Italicized terms are elaborated in the Range of Variables\n1. Develop storyboard \n    panels \n1.1 \nStoryline is identified based on GDD \n1.2 \nKey references are identified based on GDD \n1.3 \nCreate Thumbnails/Roughs based on Storyline. \n1.4 \nCreate Asset list based on GDD  \n2. Create narrative   \n    devices \n1.1 \nNarrative elements are prepared based on GDD \n1.2 \nStoryline elements are documented based on \nstoryboard and given script \n1.3 \nItems are improve d and added to the previously \ncreated asset list based on GDD \n3. Create cut scenes \n1.1 \nCut scenes are identified based on storyboard and \nscript \n1.2 \nIndividual storyboards are drawn using proxies for \neach cut scene based on the style guide  \n1.3 \n Asset list is finalize based on GDD\n\n--- PDF PAGE 39 ---\n_____________________________________________________________________________ \nTR - 3D GAME ART DEVELOPMENT NC III                                                              \n \n \n37\nRANGE OF VARIABLES \n \nVARIABLE\nRANGE\n1. Key references \nMay include but are not limited: \n1.1 Scenes \n1.2 Duration \n1.3 Characters \n1.4 Backgrounds \n1.5 Props \n1.6 Special Effects \n1.7 Angles \n2. Narrative elements \nMay include but are not limited: \n1.1 Story outline \n1.2 Scenario matrix \n1.3 Dialogues \n3. Storyline \nMay include but are not limited: \n1.1 Scenes \n1.2 Characters \n1.3 Backgrounds \n1.4 Props \n1.5 Special Effects \n1.6 Angles/Shots  \n1.7 Triggers/Flag\n\n--- PDF PAGE 40 ---\n_____________________________________________________________________________ \nTR - 3D GAME ART DEVELOPMENT NC III                                                              \n \n \n38\nEVIDENCE GUIDE \n \n1. Critical aspects of   \n    competency \nAssessment requires evidence that the candidate: \n1.1 \nDeveloped storyboard panels  \n1.2 \nCreated narrative devices \n1.3\nCreated cut-scenes\n1. Required \nKnowledge and \nAttitude \n2.1 \nCreating narrative devices \n2.2 \nIP knowledge \n2.3 \nPerspective \n2.11 Composition/Layout \n2.12 Dynamic Anatomy \n2. Required Skills \n3.1 \nDrawing Skills \n3.2 \nResearch Skills \n3.3 \nOrganization Skills \n3.4 \nCommunication Skills \n3.5 \nCreative Skills \n3.6 \nStory Telling Skills \n3.7 \nCombine previous skills and knowledge \n3.13 Adherence to instructions \n4. Resource \nImplications \nThe following resources must be provided \n4.1 \nMock theme, model sheets, and script \n4.2 \nPen and paper \n5. Methods of  \n    Assessment \nCompetency may be assessed through \n4.3 \nDemonstration / Practical exam  \n4.4 \nPresentation with questioning \n4.5 \nPortfolio of work samples \n4.6 \nGroup interview \n4.7 \nIndividual interview \n6. Context of  \n    Assessment \n6.1 \nCompetency may be assessed in workplace or \nsimulated environment\n",
