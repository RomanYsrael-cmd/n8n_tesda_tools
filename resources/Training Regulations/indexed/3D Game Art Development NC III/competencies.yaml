          "source_text": "1. Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1 \nDeveloped look-&-feel \n1.2 \nDrawn and compiled characters \n1.3 \nDrawn the game world \n1.4 \nDrawn and compiled other assets \n1.5 \nDeveloped game interface \n2. Required \nKnowledge and \nAttitude \n2.1 \nTime management \n2.2 \nUnderstanding the subject matter \n2.3 \nUnderstanding the expectation \n2.4 \nOrganizing your thoughts \n2.5 \nStudying together \n2.6 \nPerspective \n2.7 \nComposition/Layout \n2.8 \nIP knowledge \n2.9 \nBasic Anatomy \n2.10 Art Style/Genre \n3. Required Skills \n3.1 \nDrawing skills & techniques \n3.2 \nCreating a project timetable \n3.3 \nUnderstanding key terminology \n3.4 \nDraft a mind map \n3.5 \nResearch skills \n3.6 \nOrganization skills \n3.7 \nDiscussion skills \n3.8 \nCommunication skills \n3.9 \nCreative skills \n3.10 Adherence to instructions \n3.11 Preparing Style Guide documentation \n3.12 Interpreting Style Guide specifications and user \nrequirements\n\n--- PDF PAGE 37 ---\n_____________________________________________________________________________ \nTR - 3D GAME ART DEVELOPMENT NC III \n \n \n35\n \n4. Resource \nImplications \nThe following resources must be provided \n4.1 \nPC with drawing application with peripherals \n4.2 \nMouse \n4.3 \nPencil \n4.4 \nPaper \n4.5 \nPen \n5. Methods of \nAssessment \nCompetency may be assessed through \n5.1 \nDemonstration / Practical exam \n5.2 \nPresentation with questioning \n5.3 \nPortfolio of work samples \n5.4 \nGroup interview \n5.5 \nIndividual interview \n6. Context of \nAssessment \n6.2 \nCompetency may be assessed in workplace or \nsimulated environment.\n\n--- PDF PAGE 38 ---\n_____________________________________________________________________________ \nTR - 3D GAME ART DEVELOPMENT NC III \n \n \n36\nUNIT OF COMPETENCY \n: \nCREATE STORYBOARD AND ASSET LIST \n \nUNIT CODE \n:"
