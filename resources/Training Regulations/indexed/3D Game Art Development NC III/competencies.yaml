        "source_text": "--- PDF PAGE 45 ---\n_____________________________________________________________________________ \nTR - 3D GAME ART DEVELOPMENT NC III                                                              \n \n \n43\nUNIT OF COMPETENCY : \nDEVELOP 3D MODEL USING 3D GRAPHIC \nAPPLICATION \n \nUNIT CODE \n:       ICT313349 \n \nUNIT DESCRIPTOR \n:    \nThis unit defines the knowledge, skills and attitudes \nrequired to develop a 3D model and details based on \napproved modifications using 3D graphic application. \n \n \nELEMENT \nPERFORMANCE CRITERIA \nBold and Italicized terms are elaborated in the Range of Variables\n1.Preparing 3D   \n   document \n1.1 Unit of measurements and orientations are set in \naccordance with the style guide.  \n1.2 Image Plane is prepared based on approved visual \nreferences. \n1.3 Art work on each 3D Plane is in accordance with the \nstyle guide. \n2. Prepare base mesh \n2.1 Models are made with constructs in line with style \nguide \n2.2 Object priority is assigned in accordance with the style \nguide. \n3. Develop mesh \n3.1 Topology is checked in accordance with the style \nguide. \n3.2 Model is cleaned up based on style guide.  \n3.3 Implement UV Unwrap in accordance with the style \nguide.  \n4. Finalize mesh \n4.1 Touch-up is made on model in accordance with the style \nguide. \n4.2 UV is checked for stretching in accordance with the style \nguide. \n4.3 Re-UV Unwrap in accordance with the style guide. \n4.4  Proper formats are exported in accordance with the \nstyle guide.\n\n--- PDF PAGE 46 ---\n_____________________________________________________________________________ \nTR - 3D GAME ART DEVELOPMENT NC III                                                              \n \n \n44\nRANGE OF VARIABLES \n \nVARIABLE\nRANGE\n1. Style guide \nMay include but not limited: \n1.1 \nGame art style \n1.2 \nGame engine specifications \n1.3\nGame metrics\n2. Visual References \nMay include but not limited: \n2.1    Model Sheets \n2.2    Style Guide \n2.3   Concept art\n3. Constructs  \nMay include but not limited: \n3.1 \nCharacters: \n Expressions \n Turnaround \n Poses \n Character physical attributes \n Clothing and accessories \n Mock colors \n Scale/proportion \n3.2 \nProps/objects \n Turnaround \n Perspective \n Functionality \n Size comparison \n Mock color \n References \n3.3 \nBackground layout \n Form \n Perspective \n Scale of objects within the background \n Layout of the map and functionality of the elements in \nthe map such as doors, traps, stairs, trees, etc \n Setting (morning, dusk, etc.) –add to definition of terms\n Mock color and texture of each element in the \nbackground and the background itself \nVisual appeal\n4. Object priority \nMay include but are not limited: \n4.1 \nAssign responsibility \n4.2 \nAssign relationship \n4.3 \nAssign limitations \n4.4\nAssign layer\n5. Topology \nMay include but are not limited: \n5.1 \nPolygon count \n5.2 \nEdge loops \n5.3 \nDirection of normals \n5.4 \nN-gons\n\n--- PDF PAGE 47 ---\n_____________________________________________________________________________ \nTR - 3D GAME ART DEVELOPMENT NC III                                                              \n \n \n45\nEVIDENCE GUIDE \n \n1. Critical aspects of  \n    competency \nAssessment requires evidence that the candidate: \n1.1 Prepare 3D workspace \n1.2 Prepared base mesh \n1.3 Develop mesh \n1.4 Finalized mesh \n \n2. Required \nKnowledge and \nAttitude \n2.1 IP Knowledge \n2.2 Coping with stress \n2.3 Problem solving \n2.4 Object Library knowledge \n2.5 Coping with stress \n2.6 Problem solving \n2.7 Project management \n2.8 Organizing your thoughts \n2.9 Knowledge of File Types & Formats \n2.10 Project management \n2.11 Use of Appropriate 3D Software/Tools \n2.12 Perspective \n2.13 Interpretation Skills \n3.  Required Skills \n3.1 Spatial visualization ability \n3.2 Implement execution plan \n3.3 Setting realistic goals \n3.4 Draft a mind map \n3.5 Decision making exercise \n3.6 Coloring \n3.7 Applying Various Graphical Composition (Vector/Raster) \n3.8 Research Skills \n3.9 Organization Skills \n3.10 3D Graphic Software manipulation \n3.11 Adherence to instructions \n3.12 Eye for Detail \n3.13 Modeling Skills \n3.14 Drawing skills \n3.15 UV manipulation skills \n3.16 Software manipulation \n \n4. Resource \nImplications \nThe following resources must be provided \n4.1 Computer with 3D software with peripherals \n4.2 Electronic pen and tablet \n4.3 Mouse \n \n5. Methods of  \n    Assessment \nCompetency may be assessed through \n5.1 Portfolio \n5.2 Demonstration \n5.3\nInterview\n6. Context of  \n    Assessment \n6.1 Competency may be assessed in workplace or simulated \nenvironment\n",
