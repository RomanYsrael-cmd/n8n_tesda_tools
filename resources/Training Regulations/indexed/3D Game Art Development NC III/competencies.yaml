        "source_text": "--- PDF PAGE 22 ---\n_____________________________________________________________________________ \nTR - 3D GAME ART DEVELOPMENT NC III                                                              \n \n \n20\nCOMMON COMPETENCIES \n \n \nUNIT TITLE \n: \nAPPLY CRITICAL THINKING AND THOUGHT \nORGANIZATION  \n \nUNIT CODE \n: \nICT315203 \n \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge, skills, attitudes and values \nneeded to develop the ability to extract and use relevant data. \nThis unit will enhance the ability to critically assess the data or \ninformation gathered in order to make sound arguments, \ninformed decisions and problem solving. \n \nELEMENTS \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables\n1. Identify the \ntheoretical \nfoundations of \ncritical thinking  \n1.1. Assess and choose one of the study methods to \neffective data gathering, decision-making and problem \nsolving. \n1.2. Identify the components of critical thinking.  \n1.3. Identify the impediments of critical thinking to avoid them \nin data gathering and decision making situations. \n1.4. Identify the types of claims.  \n2. Develop \nconstructive \narguments \n2.1. Establish the premise and possible conclusion based on \nthe information provided from a job or industry scenario. \n2.2. Use methods of careful analysis to make constructive \narguments based on a job or industry scenario. \n3. Apply methods of \nreasoning  \n3.1. Analogies are used to support reasoning. \n3.2. Identify the cause and effects based on the criteria or \ninformation provided to support reasoning. \n3.3. Identify and avoid the common mistakes in reasoning \nabout causes.  \n3.4. Make evaluations based on the criteria or information \nprovided. \n4. Affirm \ngeneralization \n \n4.1. Use past experiences to come up with a good \ngeneralization. \n4.2. Use appropriate samples to support generalization. \n4.3. Validate the generalization with margin of errors, variation \nin population and risk.  \n5. Arrive at a \nconclusion \n5.1. Make rational arguments using the elements of  \nreasoning.  \n5.2. Clarify conceptual ideas using organized gathered data \nand evidences  \n5.3. Alternatives are worked out to place argument in the \ncontext of study. \n5.4. Challenge or validate the position of the conclusion and \nmake counter responses to emphasize a viewpoint.\n\n--- PDF PAGE 23 ---\n_____________________________________________________________________________ \nTR - 3D GAME ART DEVELOPMENT NC III                                                              \n \n \n21\n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Study methods \nMay include but are not limited to: \n1.1 Creating schedules \n1.2 Prioritizing tasks \n1.3 Researching on resources \n2. Components of \ncritical thinking \nMay include but are not limited to: \n2.1 Motivation \n2.2 Set of information \n2.3 Belief generating \n2.4 Processing skills \n2.5 Intellectual commitment \n2.6 Using skills to guide behavior \n2.7 Possession of a set of skills \n2.8 Skillful manipulation of ideas  \n2.9 Exercise without acceptance of skill results \n \n3. Types of claims \n3.1 Objective \n3.2 Subjective \n3.3 Moral claims \n \n4. methods of careful \nanalysis \nMay include but are not limited to: \n4.1 Clarity  \n4.2 Fill in connecting premises \n4.3 Thought organization \n \n5. Common mistakes in \nreasoning about \ncauses \nMay include but are not limited to: \n5.1  Logical fallacies \n5.2 Over-analysis \n5.3 Biased Thinking \n5.4 Unawareness/Decisions made based on incomplete \ninformation \n5.5 Bandwagon Mentality \n5.6 Reversing cause and effect \n6. Appropriate samples \nMay pertain but are not limited to: \n6.1 Representative of the population being studied \n6.2 Sample size \n6.3 Depth of the study conducted using the sample\n\n--- PDF PAGE 24 ---\n_____________________________________________________________________________ \nTR - 3D GAME ART DEVELOPMENT NC III                                                              \n \n \n22\n \n7. Elements of \nreasoning \nMay pertain but are not limited to: \n7.1 Purpose \n7.2 Question at issue \n7.3 Assumptions \n7.4 Implications \n7.5 Consequences \n7.6 Information \n7.7 Concept \n7.8 Conclusions interpretations \n7.9 Point of view \n7.10 \nAlternatives \n7.11 \nContext \n8. Alternatives \nMay include but are not limited to: \n8.1 Role playing \n8.2 Viewing of media clips \n8.3 Questioning \n8.4 Mind mapping \n8.5 Simulation \n8.6 Demonstration\n\n--- PDF PAGE 25 ---\n_____________________________________________________________________________ \nTR - 3D GAME ART DEVELOPMENT NC III                                                              \n \n \n23\nEVIDENCE GUIDE \n \n1. Critical aspects of \ncompetency \nAssessment must show that the candidate: \n1.1 \nExtract and processed relevant data  \n1.2 \nRecognize fact from fiction  \n1.3 \nReason with constructive arguments \n1.4 \nReason using analogies, and cause and effect as part \nof the argument \n1.5 \nEvaluate scenarios and explanations \n1.6 \nRecognize and evaluated assumptions \n1.7 \nIdentify the theoretical foundations of critical thinking  \n2. Required \nKnowledge and \nAttitude \n \n2.1 \nThought organization \n2.2 \nLogic \n2.3 \nBasic statistics \n2.4 \nReasoning \n3. Required skills \n \n3.1 \nWriting skills \n3.2 \nThought organization \n3.3 \nNegotiation skills \n4. Method of \nassessment \nCompetency may be assessed through: \n4.1 \nDirect Observation and Oral Questioning \n4.2 \nProficiency in doing written analysis \n4.3 \nPractical demonstration \n4.4 \nIndirect observation through coaching \n5. Resource \nimplication \nThe following resources MUST be provided: \n5.1 \nCase studies \n5.2 \nPaper and pen \n6. Context of \nAssessment \n \n6.1 Competency may be assessed in the work place or in a \nsimulated work place setting\n",
