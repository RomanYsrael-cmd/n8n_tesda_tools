  "source_text": "Section 1\n3D GAME ART DEVELOPMENT NC III QUALIFICATIONS\n\nThe 3D GAME ART DEVELOPMENT NC III Qualification consists of\ncompetencies that are required for digital 3D art for video games.\n\nThe units of competency comprising this qualification include the following:\n\nUNIT CODE\nBASIC COMPETENCIES\n5 00 311 1 09\nLead workplace communication\n5 00 311 1 10\nLead small teams\n5 00 311 1 11\nDevelop and practice negotiation skills\n5 00 311 1 12\nSolve problems related to work activities\n5 00 311 1 13\nUse mathematical concepts and techniques\n5 00 311 1 14\nUse relevant technologies\nCOMMON COMPETENCIES\n\n ICT315203 Apply critical thinking and thought organization\n ICT315202 Apply quality standards\n ICT311203 Perform computer operations\nCode\nCORE COMPETENCIES\nICT313344\nDevelop and conceptualize art style\nICT313346\nCreate storyboard and asset list\nICT313346\nPrepare art document\nICT313349\nDevelop 3D model using 3D graphic application\nICT313350\nICT313351\nDevelop 3D textures using graphic application\nApply rigged in-game animation\nA person who has achieved this Qualification is competent to be:\n•\n3D game artist\n•\nGame concept / visual artist\n•\nGame animator\n•\nModeler\n•\nRigger\n•\nTexture artist\n\n--- PDF PAGE 4 ---\n_____________________________________________________________________________\nTR - 3D GAME ART DEVELOPMENT NC III\n\n\n2"
