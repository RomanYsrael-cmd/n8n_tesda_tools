    "source_text": "Course Title: 3D Game Art Development \n \n NC Level: NC III \n \nNominal Training Duration: \n 64 hrs. \n- Basic Competencies \n 70 hrs. \n- Common Competencies \n1,230 hrs. \n- Core Competencies \n ------------- \n 1,364 hrs. \n \nCourse Description: \n \n \nThis course is designed to develop & enhance the knowledge, skills, & attitudes of 3D \nGame Artist in accordance with industry standards. It covers the basic & common \ncompetencies in addition to the core competencies such as preparing art document, \ncreating storyboard and asset list, developing concept art, developing 3D model \nusing 3D graphic software, develop 3D textures using graphic software and applying \nrigged in-game animation. TVET providers can however, offer a longer, ladderized \ncourse covering the NC III basic, common and core units. \n \n \nBASIC COMPETENCIES \n64 hrs. \n \nUnit of \nCompetency \nLearning Outcomes \nMethodology \nAssessment \nApproach \n1. Lead workplace \ncommunication \n1.1 Communicate information \nabout workplace \nprocesses. \n1.2 Lead workplace \ndiscussions. \n1.3 Identify and communicate \nissues arising in the \nworkplace \n• Group discussion \n• Role Play \n• Brainstorming \n \n• Observation \n• Interviews\n\n--- PDF PAGE 56 ---\n_____________________________________________________________________________ \nTR - 3D GAME ART DEVELOPMENT NC III \n \n \n54\n \nUnit of \nCompetency\nLearning Outcomes \nMethodology \nAssessment \nApproach\n2. Lead small \nteams \n2.1 Provide team leadership. \n2.2 Assign responsibilities \namong members. \n2.3 Set performance \nexpectation for team \nmembers. \n \n2.4 Supervise team \nperformance \n• Lecture \n• Demonstration \n• Self-paced \n(modular) \n• Demonstration \n• Case studies \n3. Develop and \npractice \nnegotiation \nskills \n3.1 Identify relevant \ninformation in planning \nnegotiations \n3.2 Participate in negotiations \n3.3 Document areas for \nagreement \n• Direct \nobservation \n• Simulation/role \nplaying \n• Case studies \n• Written test \n• Practical/ \nperformance \ntest \n4. Solve \nworkplace \nproblem related \nto work \nactivities \n4.1 Explain the analytical \ntechniques. \n4.2 Identify the problem. \n4.3 Determine the possible \ncause/s of the problem. \n• Direct observation \n• Simulation/role \nplaying \n• Case studies \n• Written test \n• Practical/ \nperformance \ntest \n5. Use \nmathematical \nconcepts and \ntechniques \n5.1 Identify mathematical \ntools and techniques to \nsolve problem \n5.2 Apply mathematical \nprocedures/solution \n5.3 Analyze results \n• Direct observation \n• Simulation/role \nplaying \n• Case studies \n• Written test \n• Practical/ \nperformance \ntest \n6. Use relevant \ntechnologies \n6.1 Identify appropriate \ntechnology \n6.2 Apply relevant technology \n6.3 Maintain/enhance \nrelevant technology \n• Direct observation \n• Simulation/role \nplaying \n• Case studies \n• Written test \n• Practical/ \nperformance \ntest\n\n--- PDF PAGE 57 ---\n_____________________________________________________________________________ \nTR - 3D GAME ART DEVELOPMENT NC III \n \n \n55\nCOMMON COMPETENCIES \n70 hrs. \n \nUnit of \nCompetency\nLearning Outcomes \nMethodology \nAssessment \nApproach\n1. Apply critical \nthinking and \nthought \norganization \n1.1. Identify the theoretical \nfoundations of critical thinking \n1.2. Develop constructive \narguments \n1.3. Apply methods of reasoning \n1.4. Affirm generalization \n1.5. Arrive at a conclusion \n \n \n Field trip \n Symposium \n Film showing \n Simulation \n Supervised \nindustry \ntraining \n Demonstration \n& questioning \n Observation & \nquestioning \n Third party \nreport \n2. Apply Quality \nStandards \n2.1. Asses quality of received \nmaterials \n2.2. Assess own work \n2.3. Engage in quality improvement\n Field trip \n Symposium \n Film showing \n Simulation \n Supervised \nindustry \ntraining \n Demonstration \n& questioning \n Observation & \nquestioning \n Third party \nreport \n \n3. Perform \ncomputer \noperations \n3.1. Plan and prepare for task to be \ntaken undertaken \n3.2. Input data into computer \n3.3. Access information using \ncomputer \n3.4. Produce output/ data using \ncomputer system \n3.5. Use basic functions of a www-\nbrowser to locate information \n3.6. Maintain computer equipment \nand systems \n \n Modular \n Film showing \n Computer \nbased \ntraining (e-\nlearning) \n Project \nmethod \n Supervised \nindustry \ntraining \n Demonstration \n& questioning \n Observation & \nquestioning \n Third party \nreport \n Assessment of \noutput product \n Portfolio \n Computer \nbased \nassessment\n\n--- PDF PAGE 58 ---\n_____________________________________________________________________________ \nTR - 3D GAME ART DEVELOPMENT NC III \n \n \n56\nCORE COMPETENCIES \n1230 hrs. \n \n \nUnit of \nCompetency \nLearning Outcomes \nMethodology \nAssessment \nApproach \n1. Prepare art \ndocument \n \n \n \n \n \n \n96 hrs. \n \n1.1. Develop “look and feel” \n1.2. Draw and compile \ncharacters \n1.3. Draw the game world \n1.4. Draw and compile other \nassets \n1.5. Develop game interface \n \n• Lecture/ \nDiscussion \n• Workshop \n• Demonstration \n• Supervised \nindustry \ntraining \n \n• Demonstration \n/ Practical \nexam \n• Presentation \nwith \nquestioning \n• Portfolio of \nwork samples \n• Individual \ninterview \n2. Create \nstoryboard \nand asset list \n \n \n \n \n \n50 hrs. \n \n2.1. Develop storyboard panels \nand scripts \n2.2. Create Narrative devices \n2.3. Create cut scenes \n• Lecture/ \nDiscussion \n• Workshop \n• Demonstration \n• Supervised \nindustry \ntraining \n• Demonstration \n/ Practical \nexam \n• Presentation \nwith \nquestioning \n• Portfolio of \nwork samples \n• Individual \ninterview \n3. Develop \nconcept art \n \n \n \n \n \n \n112 hrs. \n3.1. Develop concept art for \ncharacters \n3.2. Develop concept art for \nprops/objects \n3.3. Develop concept art for \nbackground layout \n3.4. Develop concept art for \nspecial effects \n \n• Lecture/ \nDiscussion \n• Workshop \n• Demonstration \n• Supervised \nindustry \ntraining \n• Demonstration \n/ Practical \nexam \n• Presentation \nwith \nquestioning \n• Portfolio of \nwork samples \n• Individual \ninterview \n4. Develop 3D \nmodel using \n3D graphic \napplication \n \n \n \n \n294 hrs. \n4.1. Prepare 3D document \n4.2. Prepare Base Mesh \n4.3. Develop Mesh \n \n \n• Lecture/ \nDiscussion \n• Workshop \n• Demonstration \n• Supervised \nindustry \ntraining \n \n• Demonstration \n/ Practical \nexam \n• Presentation \nwith \nquestioning \n• Portfolio of \nwork samples \n• Individual \ninterview\n\n--- PDF PAGE 59 ---\n_____________________________________________________________________________ \nTR - 3D GAME ART DEVELOPMENT NC III \n \n \n57\n \nUnit of \nCompetency\nLearning Outcomes \nMethodology \nAssessment \nApproach\n5. Develop 3D \ntextures \nusing graphic \napplication \n \n \n \n \n184 hrs. \n \n5.1. Prepare UV-Map \n5.2. Apply color to UV-Map \n5.3. Prepare final palette / \ncolor map sheet \n5.4. Export UV-Map \n5.5. Import UV-Texture \n \n• Lecture/ \nDiscussion \n• Workshop \n• Demonstration \n• Supervised \nindustry \ntraining \n• Demonstration \n/ Practical \nexam \n• Presentation \nwith \nquestioning \n• Portfolio of \nwork samples \n• Individual \ninterview \n6. Apply rigged \nIn-Game \nanimation \n \n \n \n \n \n294 hrs. \n6.1. Import textured model \nassets \n6.2. Create Bones/Joints \n6.3. Apply rig to textured model\n6.4. Apply basic animation \n \n• Lecture/ \nDiscussion \n• Workshop \n• Exercises \n• Demonstration \n• Supervised \nindustry \ntraining \n \n• Demonstration \n/ Practical \nexam \n• Presentation \nwith \nquestioning \n• Portfolio of \nwork samples \n• Individual \ninterview \n \nNote: \nThe Supervised Industry Training (SIT) component may be implemented in \nflexible manner. It may be integrated within various modules or units of \ncompetency or at the end of the in-school or classroom training.\n\n--- PDF PAGE 60 ---\n_____________________________________________________________________________ \nTR - 3D GAME ART DEVELOPMENT NC III \n \n \n58"
