  "source_section_text": "SECTION 3 TRAINING STANDARDS\n\n\n3.1\nCURRICULUM DESIGN\n\nCourse Title: 3D Game Art Development\n\n NC Level: NC III\n\nNominal Training Duration:\n 64 hrs.\n- Basic Competencies\n 70 hrs.\n- Common Competencies\n1,230 hrs.\n- Core Competencies\n -------------\n 1,364 hrs.\n\nCourse Description:\n\n\nThis course is designed to develop & enhance the knowledge, skills, & attitudes of 3D\nGame Artist in accordance with industry standards. It covers the basic & common\ncompetencies in addition to the core competencies such as preparing art document,\ncreating storyboard and asset list, developing concept art, developing 3D model\nusing 3D graphic software, develop 3D textures using graphic software and applying\nrigged in-game animation. TVET providers can however, offer a longer, ladderized\ncourse covering the NC III basic, common and core units.\n\n\nBASIC COMPETENCIES\n64 hrs.\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Lead workplace\ncommunication\n1.1 Communicate information\nabout workplace\nprocesses.\n1.2 Lead workplace\ndiscussions.\n1.3 Identify and communicate\nissues arising in the\nworkplace\n• Group discussion\n• Role Play\n• Brainstorming\n\n• Observation\n• Interviews\n\n--- PDF PAGE 56 ---\n_____________________________________________________________________________\nTR - 3D GAME ART DEVELOPMENT NC III\n\n\n54\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n2. Lead small\nteams\n2.1 Provide team leadership.\n2.2 Assign responsibilities\namong members.\n2.3 Set performance\nexpectation for team\nmembers.\n\n2.4 Supervise team\nperformance\n• Lecture\n• Demonstration\n• Self-paced\n(modular)\n• Demonstration\n• Case studies\n3. Develop and\npractice\nnegotiation\nskills\n3.1 Identify relevant\ninformation in planning\nnegotiations\n3.2 Participate in negotiations\n3.3 Document areas for\nagreement\n• Direct\nobservation\n• Simulation/role\nplaying\n• Case studies\n• Written test\n• Practical/\nperformance\ntest\n4. Solve\nworkplace\nproblem related\nto work\nactivities\n4.1 Explain the analytical\ntechniques.\n4.2 Identify the problem.\n4.3 Determine the possible\ncause/s of the problem.\n• Direct observation\n• Simulation/role\nplaying\n• Case studies\n• Written test\n• Practical/\nperformance\ntest\n5. Use\nmathematical\nconcepts and\ntechniques\n5.1 Identify mathematical\ntools and techniques to\nsolve problem\n5.2 Apply mathematical\nprocedures/solution\n5.3 Analyze results\n• Direct observation\n• Simulation/role\nplaying\n• Case studies\n• Written test\n• Practical/\nperformance\ntest\n6. Use relevant\ntechnologies\n6.1 Identify appropriate\ntechnology\n6.2 Apply relevant technology\n6.3 Maintain/enhance\nrelevant technology\n• Direct observation\n• Simulation/role\nplaying\n• Case studies\n• Written test\n• Practical/\nperformance\ntest\n\n--- PDF PAGE 57 ---\n_____________________________________________________________________________\nTR - 3D GAME ART DEVELOPMENT NC III\n\n\n55\nCOMMON COMPETENCIES\n70 hrs.\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Apply critical\nthinking and\nthought\norganization\n1.1. Identify the theoretical\nfoundations of critical thinking\n1.2. Develop constructive\narguments\n1.3. Apply methods of reasoning\n1.4. Affirm generalization\n1.5. Arrive at a conclusion\n\n\n Field trip\n Symposium\n Film showing\n Simulation\n Supervised\nindustry\ntraining\n Demonstration\n& questioning\n Observation &\nquestioning\n Third party\nreport\n2. Apply Quality\nStandards\n2.1. Asses quality of received\nmaterials\n2.2. Assess own work\n2.3. Engage in quality improvement\n Field trip\n Symposium\n Film showing\n Simulation\n Supervised\nindustry\ntraining\n Demonstration\n& questioning\n Observation &\nquestioning\n Third party\nreport\n\n3. Perform\ncomputer\noperations\n3.1. Plan and prepare for task to be\ntaken undertaken\n3.2. Input data into computer\n3.3. Access information using\ncomputer\n3.4. Produce output/ data using\ncomputer system\n3.5. Use basic functions of a www-\nbrowser to locate information\n3.6. Maintain computer equipment\nand systems\n\n Modular\n Film showing\n Computer\nbased\ntraining (e-\nlearning)\n Project\nmethod\n Supervised\nindustry\ntraining\n Demonstration\n& questioning\n Observation &\nquestioning\n Third party\nreport\n Assessment of\noutput product\n Portfolio\n Computer\nbased\nassessment\n\n--- PDF PAGE 58 ---\n_____________________________________________________________________________\nTR - 3D GAME ART DEVELOPMENT NC III\n\n\n56\nCORE COMPETENCIES\n1230 hrs.\n\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Prepare art\ndocument\n\n\n\n\n\n\n96 hrs.\n\n1.1. Develop “look and feel”\n1.2. Draw and compile\ncharacters\n1.3. Draw the game world\n1.4. Draw and compile other\nassets\n1.5. Develop game interface\n\n• Lecture/\nDiscussion\n• Workshop\n• Demonstration\n• Supervised\nindustry\ntraining\n\n• Demonstration\n/ Practical\nexam\n• Presentation\nwith\nquestioning\n• Portfolio of\nwork samples\n• Individual\ninterview\n2. Create\nstoryboard\nand asset list\n\n\n\n\n\n50 hrs.\n\n2.1. Develop storyboard panels\nand scripts\n2.2. Create Narrative devices\n2.3. Create cut scenes\n• Lecture/\nDiscussion\n• Workshop\n• Demonstration\n• Supervised\nindustry\ntraining\n• Demonstration\n/ Practical\nexam\n• Presentation\nwith\nquestioning\n• Portfolio of\nwork samples\n• Individual\ninterview\n3. Develop\nconcept art\n\n\n\n\n\n\n112 hrs.\n3.1. Develop concept art for\ncharacters\n3.2. Develop concept art for\nprops/objects\n3.3. Develop concept art for\nbackground layout\n3.4. Develop concept art for\nspecial effects\n\n• Lecture/\nDiscussion\n• Workshop\n• Demonstration\n• Supervised\nindustry\ntraining\n• Demonstration\n/ Practical\nexam\n• Presentation\nwith\nquestioning\n• Portfolio of\nwork samples\n• Individual\ninterview\n4. Develop 3D\nmodel using\n3D graphic\napplication\n\n\n\n\n294 hrs.\n4.1. Prepare 3D document\n4.2. Prepare Base Mesh\n4.3. Develop Mesh\n\n\n• Lecture/\nDiscussion\n• Workshop\n• Demonstration\n• Supervised\nindustry\ntraining\n\n• Demonstration\n/ Practical\nexam\n• Presentation\nwith\nquestioning\n• Portfolio of\nwork samples\n• Individual\ninterview\n\n--- PDF PAGE 59 ---\n_____________________________________________________________________________\nTR - 3D GAME ART DEVELOPMENT NC III\n\n\n57\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n5. Develop 3D\ntextures\nusing graphic\napplication\n\n\n\n\n184 hrs.\n\n5.1. Prepare UV-Map\n5.2. Apply color to UV-Map\n5.3. Prepare final palette /\ncolor map sheet\n5.4. Export UV-Map\n5.5. Import UV-Texture\n\n• Lecture/\nDiscussion\n• Workshop\n• Demonstration\n• Supervised\nindustry\ntraining\n• Demonstration\n/ Practical\nexam\n• Presentation\nwith\nquestioning\n• Portfolio of\nwork samples\n• Individual\ninterview\n6. Apply rigged\nIn-Game\nanimation\n\n\n\n\n\n294 hrs.\n6.1. Import textured model\nassets\n6.2. Create Bones/Joints\n6.3. Apply rig to textured model\n6.4. Apply basic animation\n\n• Lecture/\nDiscussion\n• Workshop\n• Exercises\n• Demonstration\n• Supervised\nindustry\ntraining\n\n• Demonstration\n/ Practical\nexam\n• Presentation\nwith\nquestioning\n• Portfolio of\nwork samples\n• Individual\ninterview\n\nNote:\nThe Supervised Industry Training (SIT) component may be implemented in\nflexible manner. It may be integrated within various modules or units of\ncompetency or at the end of the in-school or classroom training.\n\n--- PDF PAGE 60 ---\n_____________________________________________________________________________\nTR - 3D GAME ART DEVELOPMENT NC III\n\n\n58\n3.2 TRAINING DELIVERY\n\nThe delivery of training shall adhere to the design of the curriculum.\nDelivery shall be guided by the 10 basic principles of competency-based TVET.\n• The training is based on curriculum developed from the competency\nstandards;\n• Learning is modular in its structure;\n• Training delivery is learner-centered and should accommodate\nindividualized and self-paced learning strategies;\n• Training is based on work that must be performed;\n• Training materials are directly related to the competency standards\nand the curriculum modules;\n• Assessment is based in the collection of evidence of the\nperformance of work to the industry required standard;\n• Training is based on both on- and off-the-job components\n• Training program allows for recognition of prior learning (RPL) or\ncurrent competencies;\n• Training allows for multiple entry and exit; and\n• Training programs are registered with the UTPRAS.\n\nThe competency-based TVET system recognizes various types of\ndelivery modes, both on and off-the-job as long as the learning is driven by the\ncompetency standards specified by the industry. The following training\nmodalities may be adopted when designing training programs:\n\n• The dualized mode of training delivery is preferred and\nrecommended. Thus programs would contain both in - school and\nin-industry training or fieldwork components. Details can be referred\nto the Dual Training System (DTS) Implementing Rules and\nRegulations.\n\n• Modular/self-paced learning is a competency-based training\nmodality wherein the trainee is allowed to progress at his own pace.\nThe trainer just facilitates the training delivery.\n\n• Peer teaching/mentoring is a training modality wherein fast learners\nare given the opportunity to assist the slow learners.\n\n• Supervised industry training or on-the-job training is an approach in\ntraining designed to enhance the knowledge and skills of the trainee\nthrough actual experience in the workplace to acquire specific\ncompetencies prescribed in the training regulations.\n\n• Distance learning is a formal education process in which majority of\nthe instruction occurs when the students and instructor are not in the\nsame place. Distance learning may employ correspondence study,\nor audio, video or computer technologies.\n\n• Project-based instruction is an authentic instructional model or\nstrategy in which students plan, implement and evaluate projects\nthat have real world applications.\n\n--- PDF PAGE 61 ---\n_____________________________________________________________________________\nTR - 3D GAME ART DEVELOPMENT NC III\n\n\n59\n3.3\nTRAINEE ENTRY REQUIREMENTS\n\nThe trainees who wish to enter the course should possess the following\nrequirements:\n• High school level or equivalent.\n• With artistic and drawing skills which will be validated through:\n-\na talent entrance exam to be administered by the training\ninstitution using a tool devised by the Technical Experts Panel\n(TEP) and Participants in the National Validation of these Training\nRegulations\n-\nthe submission of a portfolio (hard & soft copy should be provided)\n• Has the capacity to communicate in both oral and written forms.\n• Physically able to manipulate a mouse, track-ball, electronic pen, etc.\n\n\nThis list does not include specific institutional requirements such as\neducational attainment, appropriate work experience and others that may be\nrequired from the trainees by the school or training center delivering the TVET\nprogram.\n\n\n3.4\nLIST OF TOOLS, EQUIPMENT AND MATERIALS\n\nRecommended list of tools, equipment and materials for the conduct of training in\n3D Game Art NC III:\n\nTOOLS\nEQUIPMENT\nMATERIALS\nQty.\nDescription\nQty\n.\nDescription\nQty.\nDescription\n15\nElectronic pen\nand tablet\n15\nErgonomic computer\ntables and chairs\n15\nMock theme\nand script\n15\nMouse\n2\nScanner\n15\nPen and\npaper\n15\nEraser\n1\nLCD Projector\n15\nLearning\nelements\n1\nInternet access/\nLAN connected\n1\nInk-jet Printer\n15\nPrintable\nstoryboard\n15\nlicenses\nper\nsoftware\nComputer\nApplication e.g.\n- Maya\n- 3D Studio Max\n- Softimage\n- Lightwave\n- Maxxon\n- Blender\n1\nLCD Monitor/TV, 42 inches\n15\nHand-outs\n15\nComputer (with\nperipherals)\nWindows PC or Mac\n- 19in. LCD monitor,\n- multi-core 2GHz\nCPU,\n- Direct X10, open GL\ncapable video card,\n- 4GB memory,\n- 500 GB hard disk\n15\nPractice\nmaterials\n15\nReference\nbooks\n15\nLearning\nmaterials/\nguide\n\n\n2\nWhite board and / or glass\nboard\n\n--- PDF PAGE 62 ---\n_____________________________________________________________________________\nTR - 3D GAME ART DEVELOPMENT NC III\n\n\n60\nThe quantity of tools and equipment to be used for the conduct of training for\nthis qualification shall depend on the number of students, size of the class, and/or\nmodality of training. The most important consideration is to make sure that tools and\nequipment are adequately provided to all trainees when needed. The actual list of\ntools, equipment, machines, supplies and other materials to be used shall be\nidentified and detailed in the Competency Based Curriculum (CBC) to be submitted\nby the TVET provider when registering a course or training program with TESDA.\n\nDue to the fast-changing nature of the Information and Communications\nTechnology (ICT) sector, TVET providers are reminded to use and provide their\ntrainees with the latest technology tools, equipment and materials where appropriate\nand applicable.\n\nIn cases where there are specialized tools, equipment and facilities that are\nnot generally considered standard requirements or not absolute requisites for\ntraining, the industry working group or TESDA may provide guidelines or specific\nadvice on such matters.\n\n3.5 TRAINING FACILITIES\n\n\nBased on class size of 15 students/trainees the space requirements for\n\nthe teaching/learning and circulation areas are as follows:\n\nTEACHING/LEARNING\nAREAS\nSIZE IN\nMETERS\nAREA IN SQ.\nMETERS\nQTY\nTOTAL AREA IN\nSQ. METERS\nLecture Area\n5 x 8\n40\n1\n40\nComputer Lab\n\n50\n1\n60\nLearning Resource Area\n4 x 5\n20\n1\n20\nWash ,Toilet & Locker Room\n2 x 5\n10\n2\n20\n Total\n80\nFacilities / Equipment /\nCirculation**\n\n\n\n30\nTotal Area\n110\n\n** Area requirement is equivalent to 30% of the total teaching/learning areas\n\nAppropriate consideration should be given in providing and allocating work\nspace, communications facilities, and the usual workplace amenities to ensure a\nproper learning environment. Where applicable, training shall be held or conducted in\nlearning facilities in accordance with generally accepted industry standards and\npractice.\n\n--- PDF PAGE 63 ---\n_____________________________________________________________________________\nTR - 3D GAME ART DEVELOPMENT NC III\n\n\n61\n3.6\nTRAINERS QUALIFICATIONS\n\n\n•\nHolder of National TVET Trainer’s Certificate (NTTC) Level 1\n•\n* Must have at least 2-years relevant industry experience.\n•\nMust be physically & mentally fit.\n\n* Optional: Only when required by the hiring institution.\n\n\n\n3.7\nINSTITUTIONAL ASSESSMENT\n\nInstitutional Assessment is undertaken by trainees to determine their\nachievement of units of competency. A certificate of achievement is issued for\neach unit of competency.\n\nAs a matter of policy, graduates of programs registered with TESDA under\nthese training regulations are required to undergo mandatory national\ncompetency assessment upon completion of the program.\n\n--- PDF PAGE 64 ---\n_____________________________________________________________________________\nTR - 3D GAME ART DEVELOPMENT NC III\n\n\n62"
