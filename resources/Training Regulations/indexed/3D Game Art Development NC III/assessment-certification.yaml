    {
      "number": "4.2",
      "text": "The qualification of 3D Game Art Development NC III may be attained through: 4.2.1 Accumulation of Certificates of Competency (COC) in all the following units of competency: 4.2.1.1 Develop initial art assets • Prepare art document • Create storyboard and asset list • Develop and conceptualize art style 4.2.1.2 Develop 3D model using 3D graphic software 4.2.1.3 Develop 3D Textures using Graphic Software 4.2.1.4 Apply rigged In-Game animation"
    },
    {
      "number": "4.3",
      "text": "Upon accumulation and submission of all COCs acquired for all the relevant units of competency comprising this qualification, an individual shall be issued the corresponding National Certificate (NC)."
    },
    {
      "number": "4.4",
      "text": "Assessment shall focus on the core units of competency. The basic and common units shall be integrated or assessed concurrently with the core units."
    },
    {
      "number": "4.5",
      "text": "The following are qualified to apply for assessment and certification: 4.5.1. Graduates of formal, non-formal and informal including enterprise- based training programs. 4.5.2. Experienced workers (wage-employed or self-employed)"
    },
    {
      "number": "4.6",
      "text": "The guidelines on assessment and certification are discussed in detail in the \"Procedures Manuals on Assessment and Certification\" and \"Guidelines on the Implementation of the Philippine TVET Qualification and Certification System (PTQCS)\"."
    }
  ],
  "source_text": "section\n4.2.1 of this Training Regulations. Successful candidates shall be\nawarded a National Certificate signed by the TESDA Director-General.\n\n4.2\nThe qualification of 3D Game Art Development NC III may be attained\nthrough:\n4.2.1\nAccumulation of Certificates of Competency (COC) in all the\nfollowing units of competency:\n4.2.1.1\nDevelop initial art assets\n• Prepare art document\n• Create storyboard and asset list\n• Develop and conceptualize art style\n4.2.1.2\nDevelop 3D model using 3D graphic software\n4.2.1.3\nDevelop 3D Textures using Graphic Software\n4.2.1.4\nApply rigged In-Game animation\n\n4.3\nUpon accumulation and submission of all COCs acquired for all the\nrelevant units of competency comprising this qualification, an individual\nshall be issued the corresponding National Certificate (NC).\n\n4.4\nAssessment shall focus on the core units of competency. The basic and\ncommon units shall be integrated or assessed concurrently with the core\nunits.\n\n4.5\nThe following are qualified to apply for assessment and certification:\n\n4.5.1. Graduates of formal, non-formal and informal including enterprise-\nbased training programs.\n4.5.2. Experienced workers (wage-employed or self-employed)\n\n4.6\nThe guidelines on assessment and certification are discussed in detail in\nthe \"Procedures Manuals on Assessment and Certification\" and\n\"Guidelines on the Implementation of the Philippine TVET Qualification\nand Certification System (PTQCS)\".\n\n--- PDF PAGE 65 ---\n_____________________________________________________________________________\nTR - 3D GAME ART DEVELOPMENT NC III\n\n\n63\n"
