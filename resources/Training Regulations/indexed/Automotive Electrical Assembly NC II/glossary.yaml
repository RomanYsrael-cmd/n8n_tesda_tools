  "source_text": "DEFINITION OF TERMS\n\n1. Automotive Vehicles\nThese are motor vehicles whose gross vehicle weight is\nequal or less than 3,500 kgs. Powered by a gas or diesel\nengine. It could be a passenger car or a light utility vehicle\n2. Automotive\nElectrical Assembly\nTechnician\nRefers to an all around auto electrical assembly man that can\nperform all electrical assembly works from assembling of\nelectrical assemblies to mounting and installation to\nautomotive vehicle body.\n3. Adhesives\nSubstance used to hold gasket in place during assembly. It\nalso maintains a tight seal by filling in small irregularities on a\nsurface and prevents gasket from shifting due to vibration.\n4. Point of Fit\n\nRefers to the assembly area where parts / materials /\nassemblies are used or consumed\n5. Electronics\nElectrical assemblies, circuit and system that use electronic\ndevices such as transistors and diodes\n\n6. Hardware Parts\nRefers to bolts, nuts, screws, washers and other small parts\n7. Catalytic Converter\n\nEmission The control device fitted in the exhaust system of\nan internal combustion engine. The converter reduces the\ntoxicity of products of combustion by catalytic re-combination\n8. Assembly Manuals\nReference\nmanuals\nwith\nillustration\nor\ndrawings\nof\nparts/components and its direction on how they are mounted\nor installed on the automotive vehicle or certain assemblies.\n9. Quality Inspection\nManuals\nReference manuals with explanation on what quality\nstandards have to be maintained in the conduct of\nassembling automotive vehicle\n\n10. Work Order\n A work order is a form of instruction that is broadcasted\neither by manual or by electronic system by preceding\nstations to the next stations regarding on what model\nsequence to produce on a timely-structured manner.\n11. Job Requirements\nRefers to specific specifications of model/variant to be\nassembled.\n12. Standard Operation\n Sheet\nIs a listing of process elements arrange according to the\nassembly sequence for a given job requirements\n13. Fuel Injection\nAn electronic system that increases the performance ad fuel\neconomy because it monitors engine conditions and provides\nthe correct air/fuel mixture based on the engine’s demand. It\ninjects fuel directly into the cylinder head enabling more\nprecise control over the quantity used.\n15. Jigs/fixtures\nKind of equipment that is used for sub-assembly operations in\norder to meet the desired dimensions and outcome of a\ncertain assembly.\n\n--- PDF PAGE 69 ---\nTR-Automotive Electrical Assembly NC II Promulgated\n65"
}
