      "source_text": "SECTION 3\nTRAINING STANDARDS\n\n These standards are set to provide technical and vocational education and training\n(TVET) providers with information and other important requirements to consider when\ndesigning training programs for AUTOMOTIVE ELECTRICAL ASSEMBLY NC II.\n\n3.1 CURRICULUM DESIGN\n\nCourse Title: AUTOMOTIVE ELECTRICAL ASSEMBLY NC Level NC II\n\nNominal Training Duration:\n18 Hours (Basic Competencies)\n\n20 Hours (Common Competencies)\n 105 Hours (Core Competencies)\n\nCourse Description:\n\n This course is designed to enhance the knowledge, skills and attitudes of an\nindividual in the field of automotive manufacturing in accordance with industry\nstandards. It covers competencies such as: install/fit out electrical parts and electronic\nunits to engine assembly, dash panel instruments, interior, exterior and engine room\ncompartment of automotive vehicle body in accordance with manufacturer’s\nspecification. It also covers competencies to install audio and video systems and\nperform headlight focus aiming operations.\n\nTo obtain this, all units prescribed for this qualification must be achieved.\n\nBASIC COMPETENCIES\n(18 Hours)\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and convey\nworkplace information\n1.2 Participate in workplace\nmeeting and discussions\n1.3 Complete relevant work\nrelated documents\n• Group\ndiscussion\n• Interaction\n• Lecture\n• Reportorial\n• Written test\n• Practical/\nperformance\ntest\n• Interview\n2. Work in a team\nenvironment\n2.1 Describe and identify team\nrole and responsibility in a\nteam.\n2.2 Describe work as a team\nmember.\n• Group\ndiscussion\n• Case studies\n• Simulation\n\n• Written test\n• Observation\n• Simulation\n• Role playing\n\n--- PDF PAGE 60 ---\nTR-Automotive Electrical Assembly NC II Promulgated\n56\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n3. Practice career\nprofessionalism\n3.1 Integrate personal\nobjectives with\norganizational goals\n3.2 Set and meet work\npriorities\n3.3 Maintain professional\ngrowth and development\n• Interactive\nlecture\n• Structure\nactivity\n• Simulation\n• Demonstration\n• Self-paced\ninstruction\n• Role play\n• Interview\n• Written\nexamination\n4. Practice\noccupational\nhealth and\nsafety\nprocedures\n4.1 Evaluate hazards and\nrisks\n4.2 Control hazards and risks\n4.3 Maintain occupational\nhealth and safety\nawareness\n• Interactive\nlecture\n• Simulation\n• Symposium\n• Group\ndynamics\n• Film viewing\n• Situational\nanalysis\n• Interview\n• Practical\nexamination\n• Written exam\n• Portfolio\nassessment\n\nCOMMON COMPETENCIES\n(20 Hours)\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Perform\nmensuration\nand\ncalculation\n1.1 Select measuring instruments\n1.2 Carry out measurements and\ncalculation\n1.3 Maintain measuring\ninstruments\n• Lecture/\nDemonstration\n• Practical\nexercises\n• Simulation\n• Written test\n• Oral\nquestioning\n• Direct\nobservation\n\n2. Read,\ninterpret and\napply\nengineering\nmanuals/spec\nifications\n2.1 Identify/access engineering\nmanuals / specification\n2.2 Interpret manual\n2.3 Apply information in manual\n2.4 Store manuals\n• Lecture/\nDemonstration\n• Dual training\n• Direct\nobservation\n• Interview\n3. Move and\nposition\nvehicle\n3.1 Prepare vehicle for driving\n3.2 Move and position vehicle\n3.3 Check the vehicle\n• Lecture/\nDemonstration\n• Practical\nexercises\n• Simulation\n• Written test\n• Oral\nquestioning\n• Direct\nobservation\n\n4. Apply\nappropriate\nsealant/\nadhesive\n4.1 Identify appropriate sealant/\nadhesive\n4.2 Prepare surface for sealant /\nadhesive application\n4.3 Store unused and dispose\nused sealant/adhesive\n• Lecture/\nDemonstration\n• Dual training\n• Distance\nlearning\n• Written test\n• Oral\nquestioning\n• Direct\nobservation\n• Interview\n\n--- PDF PAGE 61 ---\nTR-Automotive Electrical Assembly NC II Promulgated\n57\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n• Project\nmethod\n5. Perform shop\nmaintenance\n5.1 Inspect/clean tools and work\narea\n5.2 Store/arrange tools and shop\nequipment\n5.3 Dispose waste/used lubricants\n5.4 Report damaged\ntools/equipment\n• Lecture/\nDemonstration\n• Dual training\n• Self-paced\n(modular)\n• Written test\n• Direct\nobservation\n• Interview\n• Practical\nexercises\n\nCORE COMPETENCIES\n(105 Hours)\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Install/fit out\nelectrical parts\nto engine\nassembly\n1.1\nObtain materials/parts for\njob\n1.2 Select and use tools and\nequipment\n1.3 Load and unload parts\ninto assembly\njigs/fixtures\n1.4 Select and use hardware\nparts\n1.5 Mount/install electrical\nparts\n1.6 Route service lines\n•Lecture/\nDemonstration\n• Dual training\n\n•Demonstration\nw / questioning\n• Observation w/\nquestioning\n• Interview\n• Portfolio\n2. Install/fit out\nelectrical parts\nand electronic\nunits to body\ninterior\ncompartment\n\n2.1\nObtain materials/parts for\njob\n2.2 Select and use tools and\nequipment\n2.3 Select and use hardware\nparts\n2.4 Mount/install parts and\nelectronic units\n2.5 Route service lines\n•Lecture/\nDemonstration\n• Dual training\n\n•Demonstration\nw/ questioning\n• Observation w/\nquestioning\n• Interview\n• Portfolio\n3. Install/fit out of\nelectrical parts\nand electronic\nunits to dash\npanel\ninstrument\n3.1 Obtain materials/parts for\njob\n3.2 Select and use tools and\nequipment\n3.3 Select and use hardware\nparts\n3.4 Mount/install parts and\nelectronic units\n3.5 Route service lines\n•Lecture/\nDemonstration\n• Dual training\n•Demonstration\nw/ questioning\n• Observation w/\nquestioning\n• Interview\n• Portfolio\n4. Install/fit out of\nelectrical parts\nto exterior and\nengine room\ncompartment\n4.1 Obtain materials/parts for\njob\n4.2 Select and use tools and\nequipment\n4.3 Select and use hardware\nparts\n4.4 Mount/install parts and\n•Lecture/\nDemonstration\n• Dual training\n•Demonstration\nw/ questioning\n• Observation w/\nquestioning\n• Interview\n• Portfolio\n\n--- PDF PAGE 62 ---\nTR-Automotive Electrical Assembly NC II Promulgated\n58\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\nelectronic units\n4.5 Route service lines\n5. Install/fit out\naudio and video\nsystems\n5.1 Obtain materials/parts for\njob\n5.2 Select and use tools and\nequipment\n5.3 Select and use hardware\nparts\n5.4 Mount/install parts and\nelectronic units\n5.5 Route service lines\n•Lecture/\nDemonstration\n• Dual training\n•Demonstration\nw/ questioning\n• Observation w/\nquestioning\n• Interview\n• Portfolio\n6. Perform\nheadlight focus\naiming\noperations\n6.1 Prepare for the job\n6.2 Perform headlight focus\naiming operations\n\n•Lecture/\nDemonstration\n• Dual training\n•Demonstration\nw/ questioning\n• Observation w/\nquestioning\n• Interview\n•Portfolio\n\n--- PDF PAGE 63 ---\nTR-Automotive Electrical Assembly NC II Promulgated\n59\n3.2 TRAINING DELIVERY\n\nThe delivery of training should adhere to the design of the curriculum.\nDelivery should be guided by the 10 basic principles of competency-based\nTVET.\n\n• The training is based on curriculum developed from the competency\nstandards;\n• Learning is modular in its structure;\n• Training delivery is individualized and self-paced;\n• Training is based on work that must be performed;\n• Training materials are directly related to the competency standards and the\ncurriculum modules;\n• Assessment is based in the collection of evidence of the performance of\nwork to the industry required standard;\n• Training is based both on and off-the-job components;\n• Allows for recognition of prior learning (RPL) or current competencies;\n• Training allows for multiple entry and exit; and\n• Approved training programs are nationally accredited.\n\nThe competency-based TVET system recognizes various types of\ndelivery modes, both on and off-the-job as long as the learning is driven by the\ncompetency standards specified by the industry. The following training\nmodalities may be adopted when designing training programs:\n\n• The dualized mode of training delivery is preferred and recommended.\nThus programs would contain both in-school and in-industry training or\nfieldwork components. Details can be referred to the Dual Training System\n(DTS) Implementing Rules and Regulations.\n• Modular/self-paced learning is a competency-based training modality\nwherein the trainee is allowed to progress at his own pace. The trainer\nfacilitates the training delivery\n• Peer teaching/mentoring is a training modality wherein fast learners are\ngiven the opportunity to assist the slow learners.\n• Supervised industry training or on-the-job training is an approach in training\ndesigned to enhance the knowledge and skills of the trainee through actual\nexperience in the workplace to acquire specific competencies prescribed in\nthe training regulations.\n• Distance learning is a formal education process in which majority of the\ninstruction occurs when the students and instructor are not in the same\nplace. Distance learning may employ correspondence study, or audio,\nvideo or computer technologies.\n\n--- PDF PAGE 64 ---\nTR-Automotive Electrical Assembly NC II Promulgated\n60\n3.3 TRAINEE ENTRY REQUIREMENTS\n\nTrainees or students should possess the following requirements:\n\n• can communicate both oral and written;\n• physically and mentally fit;\n• with good moral character; and\n\nThis list does not include specific institutional requirements such as\neducational attainment, appropriate work experience, and others that may be\nrequired of the trainees by the school or training center delivering the TVET\nprogram.\n\n3.4 TOOLS, EQUIPMENT AND MATERIALS\nAUTOMOTIVE ELECTRICAL ASSEMBLY NC II\n\nRecommended list of tools, equipment and materials for the training of