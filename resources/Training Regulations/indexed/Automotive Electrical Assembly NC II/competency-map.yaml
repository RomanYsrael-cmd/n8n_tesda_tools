  "source_text": "Section 1. Successful candidates shall be awarded\na National Certificate signed by the TESDA Director General.\n\n4.2 Individual aspiring to be awarded the qualification of AUTOMOTIVE ELECTRICAL\nASSEMBLY NC II must acquire Certificates of Competency in all the following core\nunits of the Qualification. Candidates may apply for assessment in any accredited\nassessment center.\n\n4.2.1\nInstall/Fit Out Electrical Parts to Engine Assembly\n• Install/Fit Out Electrical Parts Engine Assembly\n\n4.2.2\nInstall/Fit Out Electrical Parts and Electronic Unit to Body Interior/\nExterior and Engine Compartments\n• Install/Fit Out Electrical Parts and Electronic Unit to Body Interior\nCompartment\n• Install/Fit Out Electrical Parts and Electronic Units to Dash\nInstrument Panel\n• Install/Fit Out Electrical Parts to Exterior and Engine\nCompartment\n• Install/Fit Out Audio and Video Systems\n\n4.2.3\nPerform Headlight Focus Aiming Operations\n• Perform Headlight Focus Aiming Operations\nSuccessful candidates shall be awarded Certificates of Competency (COC).\n\n4.3 Accumulation and submission of all COCs acquired for the relevant units of\ncompetency comprising a qualification, an individual shall be issued the\ncorresponding National Certificate.\n\n4.4 Assessment shall focus on the core units of competency. The basic and common\nunits shall be integrated or assessed concurrently with the core units.\n\n4.5 The following are qualified to apply for assessment and certification:\n\n4.5.1 Graduates of formal, non-formal and informal including enterprise-based\ntraining programs.\n\n4.5.2 Experienced workers (wage employed or self employed)\n\n4.6 The guidelines on assessment and certification are discussed in detail in the\n“Procedures Manual on Assessment and Certification” and “Guidelines on the\nImplementation of the Philippine TVET Qualification and Certification System\n(PTOQCS)”.\n\n--- PDF PAGE 67 ---\nTR-Automotive Electrical Assembly NC II Promulgated\n63\nCOMPETENCY MAP- AUTOMOTIVE SECTOR\nMANUFACTURING SUB SECTOR\n(ASSEMBLY)\n\nAUTOMOTIVE ELECTRICAL ASSEMBLY NC II\nCOMMON\nCOMPETENCIES\nReceive and\nrespond workplace\ncommunication\nParticipate in\nworkplace\ncommunication\nLead in workplace\ncommunication\nUtilize specialist\ncommunication skills\nWork in team\nenvironment\nDevelop team\n and individual\nSolve workplace\nproblems related\nto work activities\nWork with Other\nLead small Team\nApply problem\nsolving techniques\nin the workplace\nPlan and\norganize work\nBASIC\nCOMPETENCIES\nAUTOMOTIVE ELECTRICAL ASSEMBLIES NC II\nLegend:\nCORE COMPETENCIES\nDemonstrate\nwork values\nPractice basic\n housekeeping\nprocedures\nPractice career\nprofessionalism\nPractice occupational\nhealth and safety\n procedures\nDevelop and\npractice negotiation\nskills\nUse mathematical\nconcepts and\n techniques\nUse relevant\n technologies\nPerform Mensuration\nand Calculation\nRead, Interpret and Apply\nEngineering Manual and\nSpecifications\nMove and Position\nVehicle\nApply Appropriate\nSealant/Adhesives\nInstall/Fit out Electrical\nParts to Engine\nAssembly\nANNEX A\nAssemble Mechanical\nAssemblies Using Jigs/\nFixtures\nMount/ Install Brake\nFuel System\nMount/ Install\nSuspension Drive\nSystem\nMount/ Install Power\nDrive System\nInstall/Fit Trim\nParts/Components\nPerform Final Engine\nRun\nPerform Wheel\nAlignment Operation\nPerform Shop\nMaintenance\nInstall/Fit out Electronic\nUnits to Body Interior\nComponents\nInstall/Fit out Electrical\nParts & Electronic Units to\nDash Board Instrument\nPanel\nInstall/Fit out Electrical\nParts to Exterior and\nEngine Compartment\nInstall/Fit out Audio and\nVideo Systems\nPerform Headlight\nFocus Aiming Operation\n\n--- PDF PAGE 68 ---\nTR-Automotive Electrical Assembly NC II Promulgated\n64\n\nDEFINITION OF TERMS\n\n1. Automotive Vehicles\nThese are motor vehicles whose gross vehicle weight is\nequal or less than 3,500 kgs. Powered by a gas or diesel\nengine. It could be a passenger car or a light utility vehicle\n2. Automotive\nElectrical Assembly\nTechnician\nRefers to an all around auto electrical assembly man that can\nperform all electrical assembly works from assembling of\nelectrical assemblies to mounting and installation to\nautomotive vehicle body.\n3. Adhesives\nSubstance used to hold gasket in place during assembly. It\nalso maintains a tight seal by filling in small irregularities on a\nsurface and prevents gasket from shifting due to vibration.\n4. Point of Fit\n\nRefers to the assembly area where parts / materials /\nassemblies are used or consumed\n5. Electronics\nElectrical assemblies, circuit and system that use electronic\ndevices such as transistors and diodes\n\n6. Hardware Parts\nRefers to bolts, nuts, screws, washers and other small parts\n7. Catalytic Converter\n\nEmission The control device fitted in the exhaust system of\nan internal combustion engine. The converter reduces the\ntoxicity of products of combustion by catalytic re-combination\n8. Assembly Manuals\nReference\nmanuals\nwith\nillustration\nor\ndrawings\nof\nparts/components and its direction on how they are mounted\nor installed on the automotive vehicle or certain assemblies.\n9. Quality Inspection\nManuals\nReference manuals with explanation on what quality\nstandards have to be maintained in the conduct of\nassembling automotive vehicle\n\n10. Work Order\n A work order is a form of instruction that is broadcasted\neither by manual or by electronic system by preceding\nstations to the next stations regarding on what model\nsequence to produce on a timely-structured manner.\n11. Job Requirements\nRefers to specific specifications of model/variant to be\nassembled.\n12. Standard Operation\n Sheet\nIs a listing of process elements arrange according to the\nassembly sequence for a given job requirements\n13. Fuel Injection\nAn electronic system that increases the performance ad fuel\neconomy because it monitors engine conditions and provides\nthe correct air/fuel mixture based on the engine’s demand. It\ninjects fuel directly into the cylinder head enabling more\nprecise control over the quantity used.\n15. Jigs/fixtures\nKind of equipment that is used for sub-assembly operations in\norder to meet the desired dimensions and outcome of a\ncertain assembly.\n\n--- PDF PAGE 69 ---\nTR-Automotive Electrical Assembly NC II Promulgated\n65\n\nACKNOWLEDGEMENT\n\nThe Technical Education and Skills Development Authority (TESDA) wishes to extend\nthanks and appreciation to the many representatives of business, industry, academe and\ngovernment agencies who rendered their time and expertise to the development and\nvalidation of this Training Regulation.\n\nTHE TECHNICAL AND INDUSTRY EXPERT PANEL\nAutomotive Electrical Assembly\nNMPI / CATC/PAFI\nAntonio A. Gimenez-\nExecutive Director -\nCATC/PAFI\n\nRodolfo T. Nunez-\nPlant Manager-Nissan\nMotors Phils. Inc.(NMPI)\nCATC/PAFI\n\nRene Torres\n(Labor Representative)\nNissan Motors Philippines\nWorkers Union-AIWA\nNissan TechnoPark Bo.\nPulong, Sta. Cruz Laguna\nMr. Valentino de Leon\nVP- Plant Adminstration-\nNMPI\nEdgardo P. Zaragoza-\nPaint Shop Manager- NMPI\n(CATC/PAFI)\nCarina J. Bondad-\nAdministrative Support Staff,\n(CATC/PAFI)\n\nThe PARTICIPANTS in the National Validation of this Training Regulation\nROBERTS RADIATOR\nPILIPINAS HINO INC.\nNISSAN MOTOR PHILIPPINES\nINC.\nMembers of the TESDA Board\nThe MANAGEMENT and STAFF of the TESDA Secretariat\nTESDA EXCOM\nQualification and Standards Office\nFlorante P. Inoturan\nAgnes P. Panem\nAbel B. Elpedes\n\n--- PDF PAGE 70 ---\nTR-Automotive Electrical Assembly NC II Promulgated\n66\nList of Published Training Regulations\n\n Animal Production NC II\n Aquaculture NC II\n Automotive Body Painting/Finishing NC II\n Automotive Body Repair NC II\n Automotive Engine Rebuilding NC II\n AUTOMOTIVE ELECTRICAL ASSEMBLY NC II\n Bartending NC II\n Building Wiring Installation NC II\n Carpentry NC II\n Commercial Cooking NC 