        "evidence_guide": {
          "source_text": "1 Critical aspects of\ncompetency\n\nAssessment requires evidence that the candidate:\n1.1. Selected measuring instruments\n1.2. Carried-out measurements and calculations.\n1.3. Maintained measuring instruments\n2. Underpinning\nknowledge and\nattitudes\n2.1 Types of measuring instruments and its uses\n2.2 Safe handling procedures in using measuring\ninstruments\n2.3 Four fundamental operation of mathematics\n2.2 Formula for Volume, Area, Perimeter and other\ngeometric figures\n3 Underpinning\n skills\n3.1 Caring and handling measuring instruments\n3.2 Calibrating and using measuring instruments\n3.1 Performing calculation by Addition, Subtraction,\nMultiplication and Division\n3.2 Visualizing objects and shapes\n3.3 Interpreting formula for volume, area, perimeter and\nother geometric figures\n3 Resource\n implications\nThe following resources must be provided:\n4.1 Workplace location\n4.2 Measuring instrument appropriate to servicing\nprocesses\n4.3 Instructional materials relevant to the propose activity\n5. Method of\n assessment\n\nCompetency must be assessed through:\n5.1 Observation with questioning\n5.2 Written or oral examination\n5.3 Interview\n5.4 Demonstration with questioning\n6. Context for\n assessment\n\n6.1 Competency elements must be assessed in a safe\nworking environment\n6.2 Assessment may be conducted in a workplace or\nsimulated environment\n\n--- PDF PAGE 23 ---\nTR Automotive Electrical Assembly NC II Promulgated\n\n19\nEVIDENCE GUIDE\n\n1 Critical aspects of\ncompetency\n\nAssessment requires evidence that the candidate:\n1.1 Selected measuring instruments\n1.2 Carried-out measurements and calculations.\n1.3 Maintained measuring instruments\n2. Underpinning\nknowledge and\nattitudes\n2.1 Types of Measuring instruments and its uses\n2.2 Safe handling procedures in using measuring\ninstruments\n2.3 Four fundamental operation of mathematics\n2.3 Formula for Volume, Area, Perimeter and other\ngeometric figures\n3. Unde