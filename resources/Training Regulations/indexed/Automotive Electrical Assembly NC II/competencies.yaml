        "source_title": "INSTALL/ FIT OUT ELECTRICAL PARTS TO EXTERIOR AND ENGINE ROOM COMPARTMENT",
        "source_text": "--- PDF PAGE 48 ---\nTR-Automotive Electrical Assembly NC II         Promulgated                                            \n44\nUNIT OF COMPETENCY :    INSTALL/ FIT OUT ELECTRICAL PARTS TO \nEXTERIOR AND ENGINE ROOM COMPARTMENT \nUNIT CODE \n         :    ALT827304 \nUNIT DESCRIPTOR        : \nThis unit identifies the competence required for the \npreparation, delivery and installation/fitting out of \nelectrical parts to exterior and engine room compartment \nof automotive vehicle body in accordance with company \nstandards.  \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables\n1. Obtain parts \nfor job. \n1.1 \nMaterials/parts list is read and interpreted to establish \nrequirements for the job. \n1.2 \nParts and materials are picked by matching part numbers and \nstacked in the warehouse bin/container and floor stack areas. \n1.3 \nParts/components and materials are delivered to respective \npoint of fit to ensure smooth and continuous production.\n2. Select and \nuse tools \nand \nequipment \n2.1 \nTools and equipment are selected to meet job requirements. \n2.2 \nTools and equipment are checked to ensure they are in good \nworking order. \n3. Select and \nuse \nhardware \nparts \n3.1 \nHardware parts are identified and selected to meet the job \nrequirements as stated in the materials/parts list. \n3.2 \nHardware parts are fitted in the required number to the \ndesignated positions stated in the materials/parts list and \nengineering manuals.\n4. Mount/ \ninstall \nelectrical \nparts \n4.1 \nMaterials/parts list and engineering drawings are correctly read \nand interpreted. \n4.2 \nParts are matched with the materials/parts list for the particular \nrequirements of the job. \n4.3 \nParts are positioned and secured into automotive vehicle \nbody as per the relevant drawings/instructions. \n4.4 \nSpecified nuts, bolts and screws are tensioned to the specified \ntorque requirements stated in the engineering manuals and \nstandard operating sheet.  \n4.5 \nIdentified faults are recorded, reported and rectified/scrapped in \naccordance with company procedures.\n5. Route \nservice \nlines \n5.1 \nMaterials/parts list and engineering manuals are correctly read \nand interpreted. \n5.2 \nAppropriate hardware parts are selected and used according to \nspecifications. \n5.3 \nService lines are routed, tied and clipped to specification. \n5.4\nWorkflow and production output are recorded and maintained.\n\n--- PDF PAGE 49 ---\nTR-Automotive Electrical Assembly NC II         Promulgated                                            \n45\nRANGE OF VARIABLES \nVARIABLE \nRANGE \n1. Requirements for the \nJob \n1.1. \nProduction schedule per assembly lines per day \n1.2. \nWork Order \nNote:  A work order is a form of instruction that is \nbroadcasted either by manual or by electronic \nsystem by preceding stations to the next stations \nregarding on what model sequence to produce on a \ntimely-structured manner. \n2. Point of fit \nThis includes the different work stations in the assembly line \nlike: \n2.1. \nMain stream lines or on-line assembly stations \n2.2. \nOff-line assembly stations \n3. Tools and equipment \n3.1. \nHand tools \n3.2. \nTorque wrenches \n3.3. \nPower or pneumatic impact guns/wrenches \n3.4. \nMechanized or manual Conveyors \n3.5. \nTow motors \n3.6. \nForklifts \n3.7. \nHand pallet truck (manual and mechanized) \n4. Hardware parts \nHardware parts may include and but not limited to: \n4.1. \nNuts \n4.2. \nBolts \n4.3. \nScrews \n4.4. \nFasteners \n4.5. \nWashers \n5. Engineering manuals \n5.1. \nVehicle assembly manuals per model-variant  \n5.2. \nVehicle quality standard manuals per model-variant \n5.3. \nProcess control Chart/sheets \n5.4. \nVehicle Specification sheets \n5.5. \nMaterials/Parts list  \n6. Parts  \nParts may include and but not limited to: \n6.1. \nEngine room wiring harness with fuse/relay box \n6.2. \nWiper motor assembly \n6.3. \nRelays \n6.4. \nFuses \n6.5. \nVoltage regulator \n6.6. \nBattery \n6.7. \nHeadlights\n\n--- PDF PAGE 50 ---\nTR-Automotive Electrical Assembly NC II         Promulgated                                            \n46\n6.8. \nPark lights \n6.9. \nRear combination lamps \n6.10. Front turn signal lights \n6.11. Third brake lamp  \n7. Automotive vehicle \nbody \n7.1. \nPassenger car \n7.2. \nUtility vehicle \n8. Standard operation \nsheet \nType of standard operation sheet may include: \n8.1. \nProcedural  \n8.2. \nElemental \n9. Service lines \n9.1. \nElectrical Wiring harness \n9.2. \nCables\n\n--- PDF PAGE 51 ---\nTR-Automotive Electrical Assembly NC II         Promulgated                                            \n47\nEVIDENCE GUIDE \n1. Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1 Obtained parts and materials for the job. \n1.2 Interpreted materials/parts list and engineering drawings \nwith the requirements for the job. \n1.3 Selected appropriate parts, materials and set of tools and \nequipment. \n1.4 Mounted/Installed electrical parts to exterior and engine \nroom compartment to specification. \n1.5 Ensured specified nuts, bolts and screws are tensioned to \nthe specified torque requirements.  \n1.6 Routed service lines in accordance with engineering \ndrawings/manuals. \n1.7 Employed safe working practices.\n2 Underpinning \nknowledge and \nattitudes \n \n2.1 Parts/materials differentiation and classification \n2.2 Components and their purpose within the assembly  \n2.3 Particular application or use of material handling equipment \n2.4 Company policies and procedures \n2.5 Company OH&S procedures \n2.6 Maintenance and calibration of Torque wrench  \n2.7 Work values and ethics  \n2.8 Punctuality at workplace area\n3 Underpinning \nskills \n3.1 Read and interpret engineering drawings \n3.2 Proper use of pneumatic impact guns and torque wrenches \n3.3 Participate in workplace meetings and discussions \n3.4 Compute basic mathematical operation of addition, \nsubtraction, division and multiplication \n3.5 Gather and provide information in response to workplace \nrequirements\n4 Resource \nimplications \nThe following resource MUST be provided: \n4.1 Parts/materials relevant with the requirements for the job. \n4.2 Tools, equipment and workplace relevant with the \nrequirements for the job. \n4.3 Supplies and consumable materials \n4.4 Engineering manuals and drawings\n5 Method of \nassessment \nCompetency MUST be assessed through: \n5.1 Direct Observation with questioning \n5.2 Oral interview and written test \n5.3 Portfolio \n6 Context of \nassessment \n6.1 Competency may be assessed individually in the actual \nworkplace or a simulated workplace environment. \n6.2 Practical skills must take place only after a period of \nsupervised practice and repetitive experience. \n6.3 Prescribe outcome must be able to achieve without direct \nsupervision.\n",
