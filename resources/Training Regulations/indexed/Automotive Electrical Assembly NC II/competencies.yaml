        "evidence_guide": {
          "source_text": "1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1. Obtained parts and materials for the job.\n1.2. Interpreted materials/parts list and engineering drawings\nwith the requirements for the job.\n1.3. Selected appropriate parts, materials and set of tools and\nequipment.\n1.4. Mounted/Installed electrical parts into engine assembly in\naccordance with the specification.\n1.5. Ensured specified nuts, bolts and screws are tensioned to\nthe specified torque requirements.\n1.6. Routed service lines in accordance with engineering\ndrawings/manuals.\n1.7. Employed safe working practices.\n2. Underpinning\nknowledge and\nattitudes\n\n2.1. Read and interpret engineering manuals\n2.2. Components and their purpose within the assembly\n2.3. Particular application or use of material handling\nequipment\n2.4. Company policies and procedures\n2.5. Company OH&S procedures\n2.6. Maintenance and calibration of Torque wrench\n2.7. Work values and ethics\n2.8. Punctuality at workplace area\n3. Underpinning\nskills\n3.1. Parts/materials differentiation and classification\n3.2. Proper use of pneumatic impact guns and torque wrenches\n3.3. Participate in workplace meetings and discussions\n3.4. Complete work related documents\n3.5. Basic mathematical processes of addition, subtraction,\ndivision and multiplication\n3.6. Gather and provide information in response to workplace\nrequirements\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1. Parts/materials relevant with the requirements for the job.\n4.2. Tools, equipment and workplace relevant with the\nrequirements for the job.\n4.3. Supplies and consumable materials\n4.4. Engineering manuals\n5. Methods of\nAssessment\nCompetency MUST be assessed through:\n5.1. Direct Observation with questioning\n5.2. Oral interview and written test\n5.3. Portfolio assessment\n6. Context of\nassessment\n6.1. Competency may be assessed individually in the actual\nworkplace or a simulated workplace environment.\n6.2. Practical skills must take place only after a period of\nsupervised practice and repetitive experience.\n6.3. Prescribe outcome must be able to achieve without direct\nsupervision.\n\n--- PDF PAGE 40 ---\nTR-Automotive Electrical Assembly NC II Promulgated\n36\nUNIT OF COMPETENCY : INSTALL / FIT OUT ELECTRICAL PARTS AND\nELECTRONIC UNITS TO BODY INTERIOR\nCOMPARTMENT\nUNIT CODE\n :"
        },
        "source_text": "ALT827301\nUNIT DESCRIPTOR :\nThis unit identifies the competence required for the\npreparation, delivery and installation/fitting out of\nelectrical parts to engine assembly in accordance with\ncompany standards.\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Obtain materials\n/ parts for job.\n1.1 Materials/parts list is read and interpreted to establish\nrequirements for the job.\n1.2 Parts/materials are picked by matching part numbers and\nstacked in the warehouse bin/container and floor stack\nareas.\n1.3 Parts/materials are delivered to respective point of fit to\nensure smooth and continuous production.\n2. Select and use\ntools and\nequipment\n2.1 Tools and equipment are selected to meet job\nrequirements.\n2.2 Tools and equipment are checked to ensure they are in\ngood working order.\n2.3 Appropriate lifting hangers/gears are selected and used in\naccordance with OH&S requirements.\n3. Load and unload\nengine into\nassembly jigs\n3.1 Engine is matched to the jigging equipment reference to\npart numbers and codes.\n3.2 Engine is securely clamped to prevent movement and\ndistortion during the assembly operation as specified in the\nstandard operation sheet\n4. Select and use\nhardware parts\n4.1 Hardware parts are identified and selected to meet the job\nrequirements as stated in the materials/parts list.\n4.2 Hardware parts are fitted in the required number to the\ndesignated positions stated in the materials/parts list and\nassociated engineering manuals.\n5. Mount/install\nelectrical parts\n5.1 Materials/parts list and engineering drawings are correctly\nread and interpreted.\n5.2 Parts are matched with the materials/parts list for the\nparticular requirements for the job.\n5.3 Parts are positioned and secured into engine assembly as\nper the relevant drawings and standard operation sheet.\n5.4 Specified nuts, bolts and screws are tensioned to the\nspecified torque requirements stated in the engineering\nmanuals and standard operating sheet\n5.5 Identified faults are recorded, reported and\nrectified/scrapped in accordance with company procedures.\n6. Route service\nlines\n6.1 Materials/parts list and engineering manuals are correctly\nread and interpreted.\n6.2 Appropriate hardware parts are selected and used\naccording to specifications.\n6.3 Service lines are routed, tied and clipped to specification.\n6.4 Workflow and production output are recorded and\nmaintained.\n\n--- PDF PAGE 37 ---\nTR-Automotive Electrical Assembly NC II Promulgated\n33\n\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Requirements for the\nJob\n1.1.\nProduction schedule\n1.2.\nWork Order\nNote: A work order is a form of instruction that is\nbroadcasted either by manual or by electronic\nsystem by preceding stations to the next stations\nregarding on what model sequence to produce on a\ntimely-structured manner.\n2. Parts and materials\nParts may include and but not limited to:\n2.1.\nStarter assembly\n2.2.\nAlternator Assembly\n2.3.\nEngine wiring harness\n2.4.\nElectronic fuel injection unit\n2.5.\nIgnition system\nMaterials may include but not limited to:\nSealants, adhesive, tapes and consumables\n3. Point of fit\nThis includes the different work stations in the assembly line\nlike:\n3.1.\nMain stream lines or on-line assembly stations\n3.2.\nOff-line assembly stations\n4. Tools and equipment\n4.1.\nHand tools\n4.2.\nTorque wrenches\n4.3.\nPower or pneumatic impact guns/wrenches\n4.4.\nMechanized or manual Conveyors\n4.5.\nTow motors\n4.6.\nForklifts\n4.7.\nHand pallet truck (manual and mechanized)\n5. Engine\n 5.1. Gasoline engine\n 5.2. Diesel engine\n6. Hardware parts\nHardware parts may include and but not limited to:\n6.1.\nNuts\n6.2.\nBolts\n6.3.\nScrews\n6.4.\nFasteners\n6.5.\nWashers\n\n--- PDF PAGE 38 ---\nTR-Automotive Electrical Assembly NC II Promulgated\n34\n\n7. Engineering manuals\n7.1.\nVehicle assembly manuals per model-variant\n7.2.\nVehicle quality standard manuals per model-variant\n7.3.\nProcess control Chart/sheets\n7.4.\nVehicle Specification sheets\n7.5.\nMaterials/Parts list\n8. Standard operation\nsheet\nType of standard operation sheet may include:\n8.1.\nProcedural\n8.2.\nElemental\n9. Service lines\n9.1.\nEngine Wiring harness\n9.2.\nCable speedometer\n\n--- PDF PAGE 39 ---\nTR-Automotive Electrical Assembly NC II Promulgated\n35\nEVIDENCE GUIDE\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1. Obtained parts and materials for the job.\n1.2. Interpreted materials/parts list and engineering drawings\nwith the requirements for the job.\n1.3. Selected appropriate parts, materials and set of tools and\nequipment.\n1.4. Mounted/Installed electrical parts into engine assembly in\naccordance with the specification.\n1.5. Ensured specified nuts, bolts and screws are tensioned to\nthe specified torque requirements.\n1.6. Routed service lines in accordance with engineering\ndrawings/manuals.\n1.7. Employed safe working practices.\n2. Underpinning\nknowledge and\nattitudes\n\n2.1. Read and interpret engineering manuals\n2.2. Components and their purpose within the assembly\n2.3. Particular application or use of material handling\nequipment\n2.4. Company policies and procedures\n2.5. Company OH&S procedures\n2.6. Maintenance and calibration of Torque wrench\n2.7. Work values and ethics\n2.8. Punctuality at workplace area\n3. Underpinning\nskills\n3.1. Parts/materials differentiation and classification\n3.2. Proper use of pneumatic impact guns and torque wrenches\n3.3. Participate in workplace meetings and discussions\n3.4. Complete work related documents\n3.5. Basic mathematical processes of addition, subtraction,\ndivision and multiplication\n3.6. Gather and provide information in response to workplace\nrequirements\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1. Parts/materials relevant with the requirements for the job.\n4.2. Tools, equipment and workplace relevant with the\nrequirements for the job.\n4.3. Supplies and consumable materials\n4.4. Engineering manuals\n5. Methods of\nAssessment\nCompetency MUST be assessed through:\n5.1. Direct Observation with questioning\n5.2. Oral interview and written test\n5.3. Portfolio assessment\n6. Context of\nassessment\n6.1. Competency may be assessed individually in the actual\nworkplace or a simulated workplace environment.\n6.2. Practical skills must take place only after a period of\nsupervised practice and repetitive experience.\n6.3. Prescribe outcome must be able to achieve without direct\nsupervision.\n\n--- PDF PAGE 40 ---\nTR-Automotive Electrical Assembly NC II Promulgated\n36\nUNIT OF COMPETENCY : INSTALL / FIT OUT ELECTRICAL PARTS AND\nELECTRONIC UNITS TO BODY INTERIOR\nCOMPARTMENT\nUNIT CODE\n :"
      }
