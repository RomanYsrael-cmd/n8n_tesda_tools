        "source_title": "PERFORM MENSURATION AND CALCULATION",
        "source_text": "--- PDF PAGE 20 ---\nTR Automotive Electrical Assembly NC II                Promulgated \n \n           \n16\nCOMMON COMPETENCIES \n \n \nUNIT OF COMPETENCY:     PERFORM MENSURATION AND CALCULATION \n \nUNIT CODE                     :      ALT311202 \n \nUNIT DESCRIPTOR   :   This unit includes identifying caring, handling and use of  \nmeasuring instruments. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables\n1.  Select   \nmeasuring     \n \ninstruments \n1.1  Object or component to be measured is identified \n1.2  Correct specifications are obtained from relevant source \n1.3 Appropriate measuring instrument is selected according to  \njob requirements \n2.  Carry out  \n     measurements  \n     and calculation \n \n2.1  Measuring tools are selected in line with job requirements \n2.2  Accurate measurements are obtained to job \n2.3  Calculation needed to complete work tasks are performed  \n       using the four basic process of addition (+), subtraction (-),  \n       multiplication (x) and division (/). \n2.4  Calculations involving fractions, percentages and mixed  \n       numbers are used to complete workplace tasks. \n2.5  Numerical computation is self-checked and corrected for  \n       accuracy \n2.6  Instruments are read to the limit of accuracy of the tool. \n3. Maintain  \nmeasuring \ninstruments \n3.1  Measuring instruments must kept free from corrosion \n3.2  Measuring instruments not dropped to avoid damage \n3.3  Measuring instruments cleaned before and after using.\n\n--- PDF PAGE 21 ---\nTR Automotive Electrical Assembly NC II                Promulgated \n \n           \n17\nRANGE OF VARIABLES \nVARIABLE \nRANGE \n1.  Measuring \ninstruments \nMeasuring instruments includes: \n1.1  Multi-tester \n1.2  Vernier caliper (Out,inside) \n1.3  Push-pull gage. \n1.4  Thickness gauge  \n1.5  Steel ruler \n1.6  Torque Gauge \n2. Calculation \n \nKinds of Part Mensuration include: \n2.1     Area \n2.2     Inside diameter \n2.3     Circumference \n2.5     Length \n2.6     Thickness \n2.7     Outside diameter \n2.8     Taper \n2.9     Out of roundness \n2. 10  Oil clearance \n2.11   Oil clearance\n\n--- PDF PAGE 22 ---\nTR Automotive Electrical Assembly NC II                Promulgated \n \n           \n18\nEVIDENCE GUIDE \n1 Critical aspects of \ncompetency \n \nAssessment requires evidence that the candidate: \n1.1.  Selected measuring instruments \n1.2.  Carried-out measurements and calculations. \n1.3. Maintained measuring instruments\n2.  Underpinning  \nknowledge and \nattitudes \n2.1  Types of measuring instruments and its uses \n2.2   Safe handling procedures in using measuring \ninstruments \n2.3   Four fundamental operation of mathematics \n2.2 Formula for Volume, Area, Perimeter and other  \ngeometric figures\n3 Underpinning      \n      skills \n3.1   Caring and handling measuring instruments \n3.2   Calibrating and using measuring instruments \n3.1 Performing calculation by  Addition, Subtraction, \nMultiplication and Division \n3.2    Visualizing objects and shapes \n3.3 Interpreting formula for volume, area, perimeter and  \nother geometric figures\n3 Resource     \n      implications \nThe following resources must be provided: \n4.1   Workplace location \n4.2   Measuring instrument appropriate to servicing \nprocesses \n4.3  Instructional materials relevant to the propose activity\n5.  Method of  \n     assessment \n \n \nCompetency must be assessed through: \n5.1   Observation with questioning \n5.2   Written or oral examination \n5.3   Interview \n5.4  Demonstration with questioning\n6.  Context for  \n     assessment \n \n6.1   Competency elements must be assessed in a safe \nworking environment \n6.2   Assessment may be conducted in a workplace or \nsimulated environment\n\n--- PDF PAGE 23 ---\nTR Automotive Electrical Assembly NC II                Promulgated \n \n           \n19\nEVIDENCE GUIDE \n \n1  Critical aspects of \ncompetency \n \nAssessment requires evidence that the candidate: \n1.1   Selected measuring instruments \n1.2   Carried-out measurements and calculations. \n1.3   Maintained measuring instruments\n2.  Underpinning  \nknowledge and \nattitudes \n2.1   Types of Measuring instruments and its uses \n2.2   Safe handling procedures in using measuring \ninstruments \n2.3   Four fundamental operation of mathematics \n2.3 Formula for Volume, Area, Perimeter and other  \ngeometric figures\n3.   Underpinning      \n      skills \n3.1   Caring and Handling measuring instruments \n3.2   Calibrating and using measuring instruments \n3.4 Performing calculation by  Addition, Subtraction,  \nMultiplication and Division \n3.5    Visualizing objects and shapes \n3.6 Interpreting formula for volume, area, perimeter and \nother geometric figures\n4.   Resource     \n      implications \nThe following resources must be provided: \n4.1   Workplace location \n4.2   Measuring instrument appropriate to servicing \nprocesses \n4.3  Instructional materials relevant to the propose activity\n5.  Method of  \n     assessment \n \n \nCompetency must be assessed through: \n5.1   Observation with questioning \n5.2   Written or oral examination \n5.3   Interview \n5.4 Demonstration with questioning\n6.  Context for  \n     assessment \n \n6.1   Competency elements must be assessed in a safe  \nworking environment \n6.2   Assessment may be conducted in a workplace or \nsimulated environment\n",
