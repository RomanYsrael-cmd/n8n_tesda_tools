fications\n1.1 Appropriate manuals are identified and accessed as\nper job requirements.\n1.2 Version and date of manual is checked to ensure\ncorrect specification and procedure are identified.\n2. Interpret manuals\n2.1 Relevant sections, chapters of manuals/specifications\nare located in relations to the work to be conducted\n2.2 Information and procedure in the manual are\ninterpreted in accordance to industry practices\n3. Apply information in\nmanual\n\n3.1 Manual is interpreted according to job requirements\n3.2 Work steps are correctly identified in accordance with\nmanufacturer specification\n3.3 Manual data is applied according to the given task\n3.4 All correct sequencing and adjustments are interpreted\nin accordance with information contained on the\nmanual or specifications\n4. Store manuals\n4.1 Manual or specification are stored appropriately to\n ensure prevention of damage, ready access and\n updating of information when required in accordance\n with company requirements\n\n--- PDF PAGE 25 ---\nTR Automotive Electrical Assembly NC II Promulgated\n\n21\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Manuals\n\nKinds of manuals:\n1.1 Manufacturer’s specification\nmanual\n1.2 Vehicle assembly manual\n1.3 Vehicle quality standard manual\n1.4 Vehicle specification manual\n\n--- PDF PAGE 26 ---\nTR Automotive Electrical Assembly NC II Promulgated\n\n22\nEVIDENCE GUIDE\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Identified and accessed manual/specification\n1.2 Interpreted manuals\n1.3 Applied information in manuals\n1.4 Stored manuals\n2. Underpinning\nknowledge and\nattitudes\n2.1 Types of manuals used in automotive industry\n2.2 Identification of symbols used in the manuals\n3.1 Identification of units of measurements\n3.2 Unit conversion\n3. Underpinning skills\n\n3.1 Reading and comprehension skills required to identify\nand interpret automotive manuals and specifications\n3.2 Accessing information and data\n4. Resource\nImplications\n\nThe following resources must be provided:\n4.1 All manuals/catalogues relative to Automotive\n4.2 Work order\n4.3 Actual vehicle or simulator\n\n5. Method of\nassessment\nCompetency must be assessed through:\n5.1 Observation with questioning\n5.2 Interview\n6. Context for\nassessment\n\n6.1 Assessment must be undertaken in accordance with\n the endorsed TESDA assessment guidelines\n6.2 Assessment may be conducted in the workplace or a\n simulated environment.\n\n--- PDF PAGE 27 ---\nTR Automotive Electrical Assembly NC II Promulgated\n\n23\nUNIT OF COMPETENCY : MOVE AND POSITION VEHICLE\n\nUNIT CODE : ALT723202\nUNIT DESCRIPTOR : This competency unit covers the knowledge, skills and\nattitude needed to move and position vehicle in a\nworkshop.\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of\nVariables\n1. Prepare vehicle for\n driving\n1.1 Correct check-up procedures performed based on\n vehicle manufacturer standard\n2. Move and position\n vehicle\n2.1 Select vehicle to be moved or re-positioned.\n2.2 Drive the vehicle to appropriate location\n2.3 Park vehicle following parking safety techniques\nand procedure\n3. Check vehicle\n3.1 Vehicle position is checked as per required\n3.2 Vehicle is checked for external damages\n\n--- PDF PAGE 28 ---\nTR Automotive Electrical Assembly NC II Promulgated\n\n24\nRANGE OF VARIABLE\nVARIABLE\nRANGE\n\n1. Check-up procedure\nCheck-up procedures include the following:\n1.1 Oil level\n1.2 Brake fluid\n1.3 Clutch fluid\n1.4 Coolant level\n1.5 Battery (electrolyte)\n1.6 Tire pressure\n1.7 Position of driving gear\n1.8 Lighting and warning devices\n\n2. Vehicles\n\n2.1 Vehicles with automatic transmission\n2.2 Vehicles with manual transmission\n\n3. Parking safety\n techniques\n\n3.1 Engaging of park brake\n3.2 Vehicle parking position\n3.3 Front wheel position\n\n--- PDF PAGE 29 ---\nTR Automotive Electrical Assembly NC II Promulgated\n\n25\nEVIDENCE GUIDE\n1.Critical aspects of\n competency\n\nAssessment requires evidence that the candidate:\n1.1 Prepared vehicle for driving.\n1.2 Moved and positioned vehicle\n1.3 Checked the vehicle.\n2. Underpinning\n knowledge and\n attitudes\n2.1 Driver’s Code of conduct\n2.2 Workshop signs and symbols\n2.3 Driving skills\n2.4Vehicle accessories for safe driving and parking\n3. Underpinning skills\n3.1 Ability to handle vehicle/maneuver vehicle the easiest\nway\n3.2 Immediate response to accident\n3.3 Preparing vehicle for driving\n3.4 Parking Downhill, Uphill, Parallel\n3.5 Shifting Gears\n3.6 Maneuvering\n4. Resource\n implications\nThe following resources must be provided:\n4.1 Driving range/area\n4.2 Appropriate vehicle for driving\n4.3 Vehicle accessories\n5. Method of\nassessment\nCompetency must be assessed through:\n5.1 Observation with questioning\n5.2 Written or oral examination\n6. Context for\n assessment\n6.1 Assessment must be undertaken in accordance with the\n endorsed TESDA assessment guidelines\n6.2 Assessment of practical skills must be done in a\nworkplace or simulated environment.\n\n--- PDF PAGE 30 ---\nTR Automotive Electrical Assembly NC II Promulgated\n\n26\nUNIT OF COMPETENCY : APPLY APPROPRIATE SEALANT/ADHESIVE\n\nUNIT CODE : ALT723201\n\nUNIT DESCRIPTOR : This competency unit covers the selection and application\nof sealant/adhesives.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Identify appropriate\nSealant/adhesive\n\n1.1Sealant/adhesive is selected in line with job\n requirements and manufacturer’s specification\n1.2 Sealant/adhesive checking is performed to ensure\nthat product is fit for use.\n2. Prepare surface for\nSealant/adhesive\napplication\n2.1 Surface materials are identified as per construction\n2.2 Surface is cleaned and free of moisture, dust and other\n foreign matters to ensure maximum adhesion or seal.\n3. Apply\nsealant/adhesive\n evenly\n3.1 Sealant/adhesive is applied evenly on the surface in\nline with manufacturer’s specification\n3.2 Excess sealant/adhesive is removed by sanding or\n scrapping\n\n3.3Tools and equipment used to apply sealant/adhesive\nare appropriate to job requirements\n3.4 Safety are observed and PPE are worn in accordance\nwith industry SOP\n3.5 Hazards associated with the use of sealant and\nadhesives are identified.\n4. Store/Dispose of\nsealant/adhesive\n4.1 Sealant/adhesive are stored as per prescribed\nprocedure\n4.2 Waste are disposed as per workshop SOP\n\n--- PDF PAGE 31 ---\nTR Automotive Electrical Assembly NC II Promulgated\n\n27\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Sealant/Adhesive\nSealant/adhesive includes:\n1.1Form in Place Gasket (FIPG)\n1.2 Ribbon Sealer\n1.3Hametite\n1.4Silicon Body sealer\n1.5 Prestite for Auto and Auto Aircon\n2.Adhesive/Sealant\n checking\n\nAdhesive/Sealant checking includes:\n2.1 Expiry date\n2.2 Free of contamination\n2.3 Cap/Covers\n2.4 Tightly closed\n2.5 Concentration\n3. Tools and equipment\nTools and equipment include:\n3.1 Putty knife\n3.2 Scraper\n3.3 Compressor\n3.4 Steel brush\n3.5 Paint brush\n3.6 Rubber hammer\n3.7 Hand tools\nPersonal protective equipment include:\n3.8 Gloves\n3.9 Apron\n3.10 Safety shoes\n3.11Goggles\n3.12Gas mask\n4. Safety\nSafety includes:\n4.1 Ventilation\n4.2 Handling of Flammable/Irritating substances\n4.3 Use of Personal Protective Equipment\n5. Hazards\nHazard includes:\n5.1 Fumes\n5.2 Skin irritation\n5.3 Burns\n\n--- PDF PAGE 32 ---\nTR Automotive Electrical Assembly NC II Promulgated\n\n28\nEVIDENCE GUIDE\n1. Critical aspects of\ncompetency\n\nAssessment requires evidence that the candidate:\n1.1 Identified appropriate sealant/adhesives\n1.2 Prepared surface for sealant/adhesive\n1.3 Applied sealant/adhesive\n1.4 Stored unused or dispose of used sealant/adhesive\n2. Underpinning\nknowledge and\nattitude\n2.1 OH & S regulations\n2.2 Safe handling of sealant/adhesive\n2.3 Industry code of practice\n2.4 Procedures in sealant/adhesive application\n2.5 Procedures in interpreting manuals\n3. Underpinning skills\n3.1 Handling sealant/adhesive\n3.2 Applying sealant/adhesive\n3.3.Sanding the surface\n3.4 Use of tools, equipment\n3.5 Mixing of body filler and epoxy base and hardener\n4. Resource\n implications\nThe following resources must be provided:\n4.1 Materials relevant to the activity\n4.2 Appropriate tools and equipment\n4.3 Real or simulated workplace\n5. Method of\n assessment\n\nCompetency must be assessed through\n5.1 Observation with questioning\n5.2 Interview related to:\n• Safe and correct use of tools and equipment\n•Application of adhesive/sealant\n6. Context of\n assessment\n\n6.1 Competency elements must be assessed in a safe\n working environment\n6.2 Assessment may be done in a workplace or simulated\nenvironment\n\n--- PDF PAGE 33 ---\nTR Automotive Electrical Assembly NC II Promulgated\n\n29\nUNIT OF COMPETENCY : PERFORM SHOP MAINTENANCE\n\nUNIT CODE : ALT723205\n\nUNIT DESCRIPTOR : This unit deals with inspecting and cleaning of work area\nincluding tools, equipment and facilities. Storage and\nchecking of tools/ equipment and disposal of used\nmaterials are also incorporated in this competency\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of\nVariables\n1. Inspect/clean tools and work area\n1.1 Cleaning solvent used as per\nworkshop/tools\n cleaning requirement\n1.2 Work area is checked and cleaned\n1.3 Wet surface/spot in work area is wiped and\ndried\n2. Store/arrange tools and shop\nequipment\n\n2.1 Tools/equipment are checked and stored in\ntheir\n respective shelves/location\n2.2 Corresponding labels are posted and visible\n2.3 Tools are safely secured and logged in the\nrecords\n3. Dispose wastes/used lubricants\n3.1 Containers for used lubricants are visibly\nlabeled\n3.2 Wastes/used lubricants are disposed as per\n workshop SOP\n4. Report damaged tools/equipment\n\n4.1 Complete inventory of tools/equipment is\nmaintained\n4.2 Damaged tools/equipment/facilities are\nidentified and repair recommendation is\ngiven\n4.3 Reports prepared has no error/discrepancy\n\n--- PDF PAGE 34 ---\nTR Automotive Electrical Assembly NC II Promulgated\n\n30\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Cleaning\n requirement\n1.1 Cleaning solvent\n1.2 Inventory of supplies, tools, equipment, facilities\n1.3 List of electricians/technicians\n1.4 Rags\n1.5 Broom\n1.6 Map\n1.7 Pail\n1.8 Used oil container\n1.9 Oiler\n1.10 Dust/waste bin\n2. Work Area\nWork areas include:\n2.1 Workshop areas for assembly of automotive vehicle\nand/or outdoor power equipment\n2.2 Open workshop and enclosed, ventilated office area\n2.3 Other variables may include workshop with:\n• Mess hall\n• Wash room\n• Comfort room\n\n--- PDF PAGE 35 ---\nTR Automotive Electrical Assembly NC II Promulgated\n\n31\nEVIDENCE GUIDE\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Cleaned workshop tools/facilities\n1.2 Maintained equipment, tools and facilities\n1.3 Disposed wastes and used lubricants/fluid as per\nrequired\n procedure\n2. Underpinning\nknowledge and\nattitudes\n2.1 5S or TQM\n2.2 Service procedures\n2.3 Relevant technical information\n2.4 Safe handling of Equipment and tools\n2.5 Vehicle safety requirements\n2.6 Workshop policies\n2.7 Personal safety procedures\n2.8 Fire Extinguishers and prevention\n2.9 Storage/Disposal of Hazardous/flammable materials\n2.10 Positive Work Values (Perseverance, Honesty, Patience,\n Attention to Details)\n3. Underpinning skills\n3.1 Handling/Storing of tools/equipment/supplies and\nmaterial\n3.2 Cleaning grease/lubricants\n3.3 Disposing of wastes and fluid\n3.4 Preparing inventory of s/m and tools and equipment\n3.5 Monitoring of s/m and tools/equipment\n4. Resource\nimplications\nThe following resources must be provided:\n4.1 Workplace: Real or simulated work area\n4.2 Appropriate Tools & equipment\n4.3 Materials relevant to the activity\n5. Method of\nassessment\nCompetency must be assessed through:\n5.1 Written/Oral Questioning\n5.2 Demonstration\n5.3 Assessment of underpinning knowledge and practical\nskills may be combined.\n6. Context of\nassessment\n6.1 Competency must be assessed on the job or\n simulated environment.\n6.2 The assessment of practical skills must take place after a\n period of supervised practice and repetitive experience.\n\n--- PDF PAGE 36 ---\nTR-Automotive Electrical Assembly NC II Promulgated\n32\nCORE COMPETENCIES\n\nUNIT OF COMPETENCY : INSTALL/FIT OUT ELECTRICAL PARTS TO ENGINE\nASSEMBLY\nUNIT CODE\n : ALT827301\nUNIT DESCRIPTOR :\nThis unit identifies the competence required for the\npreparation, delivery and installation/fitting out of\nelectrical parts to engine assembly in accordance with\ncompany standards.\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Obtain materials\n/ parts for job.\n1.1 Materials/parts list is read and interpreted to establish\nrequirements for the job.\n1.2 Parts/materials are picked by matching part numbers and\nstacked in the warehouse bin/container and floor stack\nareas.\n1.3 Parts/materials are delivered to respective point of fit to\nensure smooth and continuous production.\n2. Select and use\ntools and\nequipment\n2.1 Tools and equipment are selected to meet job\nrequirements.\n2.2 Tools and equipment are checked to ensure they are in\ngood working order.\n2.3 Appropriate lifting hangers/gears are selected and used in\naccordance with OH&S requirements.\n3. Load and unload\nengine into\nassembly jigs\n3.1 Engine is matched to the jigging equipment reference to\npart numbers and codes.\n3.2 Engine is securely clamped to prevent movement and\ndistortion during the assembly operation as specified in the\nstandard operation sheet\n4. Select and use\nhardware parts\n4.1 Hardware parts are identified and selected to meet the job\nrequirements as stated in the materials/parts list.\n4.2 Hardware parts are fitted in the required number to the\ndesignated positions stated in the materials/parts list and\nassociated engineering manuals.\n5. Mount/install\nelectrical parts\n5.1 Materials/parts list and engineering drawings are correctly\nread and interpreted.\n5.2 Parts are matched with the materials/parts list for the\nparticular requirements for the job.\n5.3 Parts are positioned and secured into engine assembly as\nper the relevant drawings and standard operation sheet.\n5.4 Specified nuts, bolts and screws are tensioned to the\nspecified torque requirements stated in the engineering\nmanuals and standard operating sheet\n5.5 Identified faults are recorded, reported and\nrectified/scrapped in accordance with company procedures.\n6. Route service\nlines\n6.1 Materials/parts list and engineering manuals are correctly\nread and interpreted.\n6.2 Appropriate hardware parts are selected and used\naccording to specifications.\n6.3 Service lines are routed, tied and clipped to specification.\n6.4 Workflow and production output are recorded and\nmaintained.\n\n--- PDF PAGE 37 ---\nTR-Automotive Electrical Assembly NC II Promulgated\n33\n\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Requirements for the\nJob\n1.1.\nProduction schedule\n1.2.\nWork Order\nNote: A work order is a form of instruction that is\nbroadcasted either by manual or by electronic\nsystem by preceding stations to the next stations\nregarding on what model sequence to produce on a\ntimely-structured manner.\n2. Parts and materials\nParts may include and but not limited to:\n2.1.\nStarter assembly\n2.2.\nAlternator Assembly\n2.3.\nEngine wiring harness\n2.4.\nElectronic fuel injection unit\n2.5.\nIgnition system\nMaterials may include but not limited to:\nSealants, adhesive, tapes and consumables\n3. Point of fit\nThis includes the different work stations in the assembly line\nlike:\n3.1.\nMain stream lines or on-line assembly stations\n3.2.\nOff-line assembly stations\n4. Tools and equipment\n4.1.\nHand tools\n4.2.\nTorque wrenches\n4.3.\nPower or pn