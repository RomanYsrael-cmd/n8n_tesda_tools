        "source_text": "500311105\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes required\nto gather, interpret and convey information in response to\nworkplace requirements.\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Obtain and\nconvey\nworkplace\ninformation\n1.1\nSpecific and relevant information is accessed from\nappropriate sources\n1.2\nEffective questioning , active listening and speaking skills are\nused to gather and convey information\n1.3\nAppropriate medium is used to transfer information and\nideas\n1.4\nAppropriate non- verbal communication is used\n1.5\nAppropriate lines of communication with supervisors and\ncolleagues are identified and followed\n1.6\nDefined workplace procedures for the location and storage\nof information are used\n1.7\nPersonal interaction is carried out clearly and concisely\n2. Participate in\nworkplace\nmeetings and\ndiscussions\n2.1\nTeam meetings are attended on time\n2.2\nOwn opinions are clearly expressed and those of others are\nlistened to without interruption\n2.3\nMeeting inputs are consistent with the meeting purpose and\nestablished protocols\n2.4\nWorkplace interactions are conducted in a courteous\nmanner\n2.5\nQuestions about simple routine workplace procedures and\nmaters concerning working conditions of employment are\nasked and responded to\n2.6\nMeetings outcomes are interpreted and implemented\n3. Complete\nrelevant work\nrelated\ndocuments\n3.1\nRange of forms relating to conditions of employment are\ncompleted accurately and legibly\n3.2\nWorkplace data is recorded on standard workplace forms\nand documents\n3.3\nBasic mathematical processes are used for routine\ncalculations\n3.4\nErrors in recording information on forms/ documents are\nidentified and properly acted upon\n3.5\nReporting requirements to supervisor are completed\naccording to organizational guidelines\n\n--- PDF PAGE 7 ---\nTR Automotive Electrical Assembly NC II Promulgated\n\n3\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Appropriate sources\n1.1.\nTeam members\n1.2.\nSuppliers\n1.3.\nTrade personnel\n1.4.\nLocal government\n1.5.\nIndustry bodies\n2. Medium\n2.1.\nMemorandum\n2.2.\nCircular\n2.3.\nNotice\n2.4.\nInformation discussion\n2.5.\nFollow-up or verbal instructions\n2.6.\nFace to face communication\n3. Storage\n3.1.\nManual filing system\n3.2.\nComputer-based filing system\n4. Forms\n4.1.\nPersonnel forms, telephone message forms,\nsafety reports\n5. Workplace interactions\n5.1.\nFace to face\n5.2.\nTelephone\n5.3.\nElectronic and two way radio\n5.4.\nWritten including electronic, memos,\ninstruction and forms, non-verbal including\ngestures, signals, signs and diagrams\n6. Protocols\n6.1.\nObserving meeting\n6.2.\nCompliance with meeting decisions\n6.3.\nObeying meeting instructions\n\n--- PDF PAGE 8 ---\nTR Automotive Electrical Assembly NC II Promulgated\n\n4\nEVIDENCE GUIDE\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1. Prepared written communication following\nstandard format of the organization\n1.2. Accessed information using communication\nequipment\n1.3. Made use of relevant terms as an aid to transfer\ninformation effectively\n1.4. Conveyed information effectively adopting the\nformal or informal communication\n2. Underpinning knowledge\nand attitudes\n\n2.1. Effective communication\n2.2. Different modes of communication\n2.3. Written communication\n2.4. Organizational policies\n2.5. Communication procedures and systems\n2.6. Technology relevant to the enterprise and the\nindividual’s work responsibilities\n3. Underpinning skills\n3.1. Follow simple spoken language\n3.2. Perform routine workplace duties following simple\nwritten notices\n3.3. Participate in workplace meetings and\ndiscussions\n3.4. Complete work related documents\n3.5. Estimate, calculate and record routine workplace\nmeasures\n3.6. Basic mathematical processes of addition,\nsubtraction, division and multiplication\n3.7. Ability to relate to people of social range in the\nworkplace\n3.8. Gather and provide information in response to\nworkplace Requirements\n4. Resource implications\n4.1. Fax machine\n4.2. Telephone\n4.3. Writing materials\n4.4. Internet\n5. Methods of assessment\n5.1. Direct Observation\n5.2. Oral interview and written test\n6. Context for assessment\n6.1. Competency may be assessed individually in the\nactual workplace or through accredited institution\n\n--- PDF PAGE 9 ---\nTR Automotive Electrical Assembly NC II Promulgated\n\n5\nUNIT OF COMPETENCY\n: WORK IN TEAM ENVIRONMENT\nUNIT CODE\n :"
