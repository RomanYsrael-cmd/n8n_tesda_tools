        "source_title": "MOVE AND POSITION VEHICLE",
        "source_text": "--- PDF PAGE 27 ---\nTR Automotive Electrical Assembly NC II                Promulgated \n \n           \n23\nUNIT OF COMPETENCY   :     MOVE AND POSITION VEHICLE \n \nUNIT CODE                        :     ALT723202 \nUNIT DESCRIPTOR      :   This competency unit covers the knowledge, skills and \nattitude needed to move and position vehicle in a \nworkshop. \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of \nVariables\n1. Prepare vehicle for   \n     driving\n1.1  Correct check-up procedures performed based on \n      vehicle manufacturer standard\n2. Move and position  \n      vehicle \n2.1 Select vehicle to be moved or re-positioned. \n2.2 Drive the vehicle to appropriate location \n2.3 Park vehicle following parking safety techniques \nand procedure \n3. Check vehicle \n3.1  Vehicle position is checked as per required \n3.2  Vehicle is checked for external damages\n\n--- PDF PAGE 28 ---\nTR Automotive Electrical Assembly NC II                Promulgated \n \n           \n24\nRANGE OF VARIABLE \nVARIABLE \nRANGE \n \n1.  Check-up procedure \nCheck-up procedures include the following: \n1.1 Oil level \n1.2 Brake fluid \n1.3 Clutch fluid \n1.4 Coolant level \n1.5 Battery (electrolyte) \n1.6 Tire pressure \n1.7 Position of  driving gear \n1.8 Lighting and warning devices\n \n2.  Vehicles \n \n2.1 Vehicles with automatic transmission \n2.2 Vehicles with manual transmission\n \n3. Parking safety  \n    techniques \n \n3.1 Engaging of park brake \n3.2 Vehicle parking position \n3.3 Front wheel position\n\n--- PDF PAGE 29 ---\nTR Automotive Electrical Assembly NC II                Promulgated \n \n           \n25\nEVIDENCE GUIDE \n1.Critical aspects of  \n    competency \n \nAssessment requires evidence that the candidate: \n1.1 Prepared vehicle for driving. \n1.2 Moved and positioned vehicle \n1.3 Checked the vehicle.\n2. Underpinning  \n     knowledge and  \n     attitudes \n2.1 Driver’s Code of conduct \n2.2 Workshop signs and symbols \n2.3 Driving skills \n2.4Vehicle accessories for safe driving and parking\n3. Underpinning skills \n3.1 Ability to handle vehicle/maneuver vehicle the easiest \nway  \n3.2 Immediate response to accident \n3.3 Preparing vehicle for driving \n3.4 Parking Downhill, Uphill, Parallel \n3.5 Shifting Gears \n3.6 Maneuvering\n4. Resource   \n      implications \nThe following resources must be provided: \n4.1 Driving range/area \n4.2 Appropriate vehicle for driving \n4.3 Vehicle accessories\n5. Method of  \nassessment \nCompetency must be assessed through: \n5.1 Observation with questioning \n5.2 Written or oral examination\n6. Context for  \n      assessment \n6.1 Assessment must be undertaken in accordance with the \n       endorsed TESDA  assessment guidelines \n6.2 Assessment of practical skills must be done in a \nworkplace or simulated environment.\n",
