        "source_text": "HCS341302\nUNIT DESCRIPTOR :\nThis unit covers the basic knowledge, skill and\nattitudes\nrequired\nin\nthe\npromotion\nand\nmarketing of MFI’s products and services.\n\nELEMENT\nPERFORMANCE CRITERIA\nPromote Microfinance Products and Services is performed using the\nappropriate work processes, tools, equipment, quality assurance\nand occupational health and safety (OH&S) requirement and\npersonal protective equipment\n1. Introduce loan\nproducts and\nservices\n1.1 Marketing/promotional materials prepared\n1.2 Potential market identified\n1.3 Loan products, savings product, micro insurance and\nother services introduced\n1.4 MFIs savings standards, policies and procedures well\nexplained to prospective clients\n1.5\nAdvantage introduced\n2. Conduct orientation\nand briefings on\nmicrofinance\nproducts and\nservices\n2.1 Orientation/briefing materials prepared\n2.2 Features of loan, savings and insurance products well\nexplained\n2.3 Orientation and briefing on loan products, savings\nproduct, micro insurance and other services conducted\n3. Facilitate/Coordinate\nmicrofinance training\nprogram\n3.1 Promotional training materials prepared/gathered\n3.2 Capacity development (e.g. Advantages of business\ndevelopment services/community development\nservices) are discussed well with MFI clients\n3.3 Microfinance program and value-added services\npromoted\n4. Assist clients in\npromoting their\nproducts\n4.1 Quality products identified and endorsed\n4.2 Product requirements/accreditation is coordinated\n4.3 Advice on product development/enhancement is\nprovided\n4.4 Market networking/linkaging done with other member/s\nand MFI/s\n4.5 Advice on clients’ product promotion is provided\nthrough trade fair/exhibits and other venues\n5. Administer survey on\nenhancement of MFI\nproducts and\nservices\n5.1 Survey instrument secured\n5.2 Survey conducted\n5.3 Survey data collated and processed\n5.4\nSurvey results is submitted to immediate supervisor\n\n--- PDF PAGE 34 ---\nTR -Microfinance Technology NC II\n\n29\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Promotional\nMaterials\n1.1 Brochures\n1.2 Flyers\n1.3 Posters\n1.4 Streamers\n1.5 Client’s Sample Products\n1.6 Metacards\n1.7 Flip Chart\n1.8\nVisual Aids\n2. Work processes\n2.1 Promotional and marketing processes\n2.2 Survey process\n2.3\nRelevant policies and procedures\n3. Tools and equipment 3.1 Computer\n3.2 Printer\n3.3 Paper copier\n3.4 Fax machine\n3.5 Telephone/cell phone\n3.6 Ball pen\n3.7 Posting materials\n3.8 Pencil and eraser\n3.9\nMotorcycle\n4. Quality Assurance\nrequirements\n4.1 Relevant provision of MFI operational manual\nconcerning products and services\n4.2 Compliance to requirements of appropriate\ngovernment agencies\n5. Occupational Health\nand Safety (OHS)\nrequirements\n5.1 First aid treatment\n5.2 Awareness of LGU (city/municipal/barangay)\nordinances relating to OHS\n5.3 Avoiding high risk areas\n5.4 Respecting local customs and traditions\n5.5 Seeking assistance from appropriate authorities during\nemergency situation\n5.6 Safety precautions on the use of tools and equipment\n5.7 Regulations on environmental protection\n5.8\nObservance of traffic and road safety\n6. Personal protective\nequipment\n6.1\nPPE for use of motorcycle (e.g., helmet, elbow, knee &\nlegs protector)\n6.2 Safety protective devices (e.g. raincoats, umbrella,\nboots and the likes)\n\n--- PDF PAGE 35 ---\nTR -Microfinance Technology NC II\n\n30\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that candidate:\n1.1 Demonstrated ability in promoting MFI products and\nservices and networking/linkaging\n1.2 Demonstrated the ability to assist clients in the\nenhancement and promotion of their products and\nservices\n2. Underpinning\nknowledge and\nattitude\n2.1 Knowledge of MFI products and services\n2.2 Knowledge of promotion of products and services\n2.3 Knowledge in establishing linkages and rapport with\norganizations and people\n2.4 Knowledge of survey and interview procedures\n2.5 Work ethics and positive work habits\n2.6 Attitude: commitment/dedication, love of work,\ncompetence, courteous, honesty, sincerity, sensitivity\nto others, sense of responsibility, caring\nattitude/compassion, and charity\n3. Underpinning skills\n3.1 Communication skills\n3.2 Presentation skills\n3.3 Networking/linkaging skills\n3.4 Skill in promoting products and services, and MFI\nprograms\n3.5 Skill in conducting surveys and interviews\n3.6 Skill in making reports\n3.7\nInterpersonal skills\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Promotional materials appropriate for type of products\nand services\n4.2 Sample of products to be promoted/enhanced\n4.3 Potential target area for promotion of products and\nservices\n4.4\nSurvey instruments and interview guides\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1 Demonstration with oral questioning\n5.2 Direct observation with oral questioning\n5.3 Portfolio\n5.4\nWritten test\n6. Context for\nassessment\n6.1 Competency may be assessed in the workplace or in a\nsimulated workplace environment\n\n--- PDF PAGE 36 ---\nTR -Microfinance Technology NC II\n\n31\nUNIT OF COMPETENCY\n:\nFORM GROUP OF MICROFINANCE CLIENTS\nUNIT CODE\n :"
