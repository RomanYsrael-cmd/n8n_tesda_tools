        "source_text": "--- PDF PAGE 36 ---\nTR -Microfinance Technology NC II \n                                                                                                           \n \n \n31\nUNIT OF COMPETENCY  \n: \nFORM GROUP OF MICROFINANCE CLIENTS \nUNIT CODE \n                  :   \nHCS341303 \nUNIT DESCRIPTOR                     : \nThis unit covers the knowledge, skill and \nattitudes required in forming, evaluating, \norganizing and developing group clients for \nservice delivery. \nELEMENT \nPERFORMANCE CRITERIA \nForm Group of Microfinance Clients is performed using the appropriate \ncommunication process in consideration with communication \nbarriers, non-verbal communication, supplies materials, and \nequipment/facility and following meeting protocols.\n1. Meet with  barangay \nofficial/s \n1.1 Letter of request/courtesy is prepared  \n1.2 Letter of request/courtesy given to concerned \nBarangay Official \n1.3 Meeting with Barangay Official scheduled and \nconducted\n2. Orient target clients \n2.1 Target clients informed \n2.2 Material for orientation prepared/secured \n2.3 Venue, schedule for orientation announced \n2.4 Target clients gathered \n2.5 MFIs products and services introduced and explained \n2.6\nOrientation is conducted \n3. Schedule and \nconduct family \nbackground \ninvestigation/CCI /BI \n3.1 Complete requirements of clients are gathered \n3.2 Efficient plan of visit based on geographical location \nand proximity of the scheduled family for CCI/BI is \nprepared \n3.3 Checklist/form for CCI/BI is prepared  \n3.4 List of target clients and other resource person/s \nprepared \n3.5 Credit Investigation and Background Investigation \n(CCI/BI) conducted in accordance with the \norganization’s practices and standards \n3.6 Critical/Questionable clients information from CCI/BI \nare validated through revisits, and feedback from \nalternate informants \n4. Organize \ngroup/center/ cluster \n4.1 Potential clients identified \n4.2 Group/center identified \n4.3 Venue and schedule of meetings, collections and \nother activities selected \n4.4 Election of group/center officers facilitated in \naccordance with MFI procedures \n4.5 Group/center officers identified \n4.6\nGroup/center organized\n5. Orient group officers/ \ncenter officer on their \nroles and \nresponsibilities \n5.1 Orientation materials prepared/secured \n5.2 Group officers/center officers roles and responsibilities \nare discussed and agreed\n\n--- PDF PAGE 37 ---\nTR -Microfinance Technology NC II \n                                                                                                           \n \n \n32\nELEMENT \nPERFORMANCE CRITERIA \nForm Group of Microfinance Clients is performed using the appropriate \ncommunication process in consideration with communication \nbarriers, non-verbal communication, supplies materials, and \nequipment/facility and following meeting protocols.\n6. Facilitate group \n/center officer \nmeetings  \n6.1 Group/Center meeting agenda prepared \n6.2 Group/Center meeting processes observed \n6.3 Active clients’ participation on discussion/activities is \nencouraged \n6.4 Clients facilitation of meetings are supervised \n6.5\nGroup/Center meetings facilitated\n\n--- PDF PAGE 38 ---\nTR -Microfinance Technology NC II \n                                                                                                           \n \n \n33\nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Communication \nprocess \n \n \n1.1 Effective communication skills \n1.2 Facilitation skills \n1.3 Counseling skills  \n1.4 Interaction among clients  \n1.5 Communication techniques (e.g. Good working \ncondition, Art of questioning and listening)\n2. \nCommunication \nbarriers \n \n2.1 Workplace \n2.2 Facilities \n2.3 Dialects \n2.4\nUnexpected interruptions\n3. \nNon-verbal \ncommunication  \n \n3.1 Visual aid \n3.2 Facial expression \n3.3 Sign language \n3.4 Body language \n3.5\nClear calligraphy \n4. \nSupplies, \nmaterials, \nequipment and \nfacility \n \nMay include but are not limited to: \n4.1 Bible (optional)/transformational handbook \n4.2 Forms \n4.2.1 \nMembership application \n4.2.2 \nLoan application \n4.2.3 \nSurvey Instruments \n4.2.4 \nCCI/BI checklist \n4.3 Calculator \n4.4 Logbook/class record \n4.5 Manila paper \n4.6 Permanent markers  \n4.7 Masking tape/board pins \n4.8 Visual aids \n4.9\nVenue  with chairs and table\n5. \nClients  \n5.1 Potential clients \n5.2\nExisting clients (with loans)\n6. \nMeeting protocols \n \n6.1 Punctuality of starting and ending meetings \n6.2 Agenda prepared in advance \n6.3 Observance of standard MFI meeting protocol/ \nprocedures\n\n--- PDF PAGE 39 ---\nTR -Microfinance Technology NC II \n                                                                                                           \n \n \n34\n \nEVIDENCE GUIDE \n \n1. Critical aspects of \ncompetency \nAssessment requires evidence that candidate: \n1.1 Communicated with others to ensure safe and \neffective workplace operation \n1.2 Maintained active participation of clients \n1.3 Carried out procedures in forming groups (e.g. \nprocedure in election of officers and laying-out \nlocalized group policies) \n1.4 Scheduled and conducted family background \ninvestigation/CCI/BI\n2. Underpinning \nknowledge and \nattitude \n2.1 Meeting agenda, schedule and workflow \n2.2 Knowledge of MFI Character/Credit Investigation \nand Background Investigation (CCI/BI) Procedure \n2.3 Knowledge of  forming group of clients/ \ncenters/clusters \n2.4 Procedure and requirements in conducting the \norientation of clients \n2.5 Roles and responsibilities of Group Officers/ \nCenter/ Cluster Officer  \n2.6 Knowledge of adult learning and team building \n2.7 Effective presentation skills (Utilization of training \naids and materials training methods and \nstrategies,  \nTraining equipment usage and care) \n2.8 Attitude: commitment/dedication, love of work, \ncompetence, courteous, honesty, sincerity, \nsensitivity to others, sense of responsibility, caring \nattitude/compassion, and  charity\n3. Underpinning skills \n3.1 Application of procedures and techniques in \nforming groups/center/cluster \n3.2 Ability to communicate verbally and non-verbally \n3.3 Skill in conducting CCI/BI \n3.4 Skill in conducting clients’ orientation \n3.5 Instructional delivery skills (Good facilitation skills) \n3.6 Motivation skills \n3.7 Preparing training aids and materials \n3.8 Leadership skills \n3.9 Conflict management skills \n3.10 Negotiation skills \n3.11 Stress management skills \n3.12 Time management skills\n4. Resource \nimplications \nThe following resources MUST be provided: \n4.1 Appropriate visual aids and materials for forming \ngroups  \n4.2 Suitable venue\n\n--- PDF PAGE 40 ---\nTR -Microfinance Technology NC II \n                                                                                                           \n \n \n35\n5. Method of \nassessment \nCompetency may be assessed through: \n5.1 Demonstration with questioning \n5.2 Direct observation with questioning \n5.3 Portfolio \n5.4\nWritten test\n6. Context for \nassessment\n6.1  Competency may be assessed in the workplace or \nin a simulated workplace environment\n",
