l and professional ethics\n4.13 Training program design and delivery\n4.14 Value added services/product innovations\n4.15 Organization’s policies and procedures manual\n5. Client\nIncludes the following but are not limited to:\n5.1 External clients (customers, partners, members,\nsubscribers, end users, investors/funders, service\nproviders, agencies)\n5.2 Internal clients (within the organization/co-employees,\nimmediate superiors, board of trustees)\n\nEVIDENCE GUIDE\n\n--- PDF PAGE 25 ---\nTR -Microfinance Technology NC II\n\n20\n1.\nCritical\naspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Performed work in accordance with the organization’s standard\noperating procedures and specifications\n1.2 Identified and reported defects in accordance with standard\noperating procedures\n1.3 Carried out work in accordance with the process improvement\nprocedures\n2.\nUnderpinning\nknowledge\nand attitude\n2.1\nKnowledge of organization’s vision, mission and values\n2.2 Knowledge of product, services and programs\n2.3 Operational standards and procedures\n2.4 Quality checking procedures\n2.5 Workplace procedures\n2.6 Occupational health and safety procedures\n2.7 Characteristics of hardware, software and materials used in\nrendering quality service\n2.8 Defect/irregularities identification and reporting\n2.9 Quality improvement processes\n2.10 Quality consciousness\n2.11 Values orientation\n2.12 Market-driven/client-focused\n3. Underpinning\nskills\n3.1\nComprehension skills\n3.2 Communication skills\n3.3 Critical thinking, problem solving and decision-making skills\n3.4 Technical skills\n3.5 Interpersonal skills\n3.6 Community organizing skills\n3.7 Analytical skills\n3.8 Quantitative skills\n3.9\nQualitative skills\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Product manuals and brochures\n4.2 Marketing and promotional materials\n4.3 Orientation and presentation materials\n4.4 Office standard forms and documentation\n4.5 Operational handbook/manuals\n4.6 Work plans and schedules\n4.7 Hardware\n4.8\nSoftware\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1 Written examination\n5.2 Interviews\n5.3 Audit report\n5.4 Monthly reports\n5.5 Practical demonstration\n5.6\nPerformance evaluation\n6. Context for\nassessment\n6.1 Assessment may be conducted in the workplace or in a\nsimulated workplace environment\n\n--- PDF PAGE 26 ---\nTR -Microfinance Technology NC II\n\n21\nUNIT OF COMPETENCY:\nPERFORM COMPUTER OPERATIONS\nUNIT CODE\n\n : HCS311201\nUNIT DESCRIPTOR\n :\nThis unit covers the knowledge, skills and\nattitudes needed to perform computer operations\nwhich include encoding, accessing, decoding,\ntransferring and storing data and information\nusing the appropriate hardware and software.\n\nELEMENT\nPERFORMANCE CRITERIA\n1. Plan and prepare for\nassigned task\n1.1 Tasks are determined according to required output\n1.2 Appropriate hardware and software are selected\n1.3 OHS standards are complied with\n1.4 Appropriate guidelines and procedures are identified\n1.5\nRequired data security guidelines are determined\n2. Encode data\n2.1 Accuracy of data/information is validated\n2.2 Data are encoded using appropriate application\n2.3 Information is saved in storage devices according to\nrequirements\n2.4\nWork is performed within OHS guidelines\n3. Access information\n\n3.1 Appropriate application is selected based on job\nrequirements\n3.2 Proper use of navigation keys and icons is observed\n3.3 Proper use of computer and other peripherals is\nobserved\n4. Produce data\n4.1 Processed data using appropriate applications by\nauthorized personnel\n4.2 Data are printed according to standard operating\nprocedures\n4.3 Data are analyzed\n4.4 Files and data are transferred according to standard\noperating procedures\n4.5\nFiles and data are securely stored\n5. Use the internet to\naccess information\n5.1 Required information is identified\n5.2 Appropriate browser and search engine are used in\naccordance with the organization’s standards and\nprocedures\n5.3\nRelevant links are utilized to access information\n6. Maintain computer\nequipment and\nsystems\n6.1 Procedures for system security such as virus check,\ndata back-up, and system defragmentation are\nimplemented\n6.2 Appropriate basic equipment maintenance procedures\nand MIS requirements are implemented\n\n--- PDF PAGE 27 ---\nTR -Microfinance Technology NC II\n\n22\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\nHardware and peripheral\ndevices\nHardware includes the following but are not limited to:\n1.1 Computer set-up\n1.2 Network systems\n1.3 Communication equipment\n1.4 Printer and scanner\n1.5 Built-in cameras\n1.6 Multimedia projector\nSoftware\nSoftware includes the following but are not limited to :\n2.1 Microsoft Office applications\n2.2 Database applications\n2.3 Web browser\n2.4\nClient specific software\nOHS guidelines\nTypes of equipment used\nErgonomic furniture\nRadiation barrier for monitors\nSitting posture\nLifting posture\nOrganization’s policies and procedures\nStorage devices\nStorage devices include the following but are not limited\nto :\nDiskettes\nZip disks\nLocal and remote hard disk drives\nOptical drives (CDs)\nUSB flash drives\nMaintenance\nConducting file management\nUpdating of applications\nStoring back up files\nMaintaining equipment cleanliness\nSecurity system/password\nMIS Requirements\nAuthorized IT security officer\nUpdating of programs/systems\n\n--- PDF PAGE 28 ---\nTR -Microfinance Technology NC II\n\n23\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that candidate has:\n1.1 Used appropriate hardware\n1.2 Used appropriate software applications\n1.3 Processed required data\n1.4 Maintained security measures, e.g., passwords\n1.5 Practiced troubleshooting procedures\n1.6\nApplied basic computer maintenance activities\n2. Underpinning\nknowledge and\nattitude\n2.1 Basic fundamentals for computer use\n2.2 Basic knowledge of computer system\n2.3 Basics of computer operating system\n2.4 Categories of storage devices and memories\n2.5 Types and uses of software applications\n2.6 Intellectual property rights\n2.7 Virus information, detection and elimination\n2.8 OHS principles and practices\n2.9 Concern for details in accordance with\norganization’s guidelines\n2.10 Patience in handling challenging/difficult tasks\n2.11 Quality consciousness\n2.13 Safety consciousness\n3. Underpinning skills\n3.1 Computer keyboarding skills\n3.2 Internet browsing/networking skills\n3.3 Skill in English grammar\n3.4 Basic computer software and hardware\nmaintenance/troubleshooting skills\n3.5\nAnalytical skills\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Computer hardware and peripherals\n4.2 Appropriate software applications\n4.3 Computer printer/scanner ink\n4.4 Stationeries\n4.5\nCDs, DVDs and USBs\n5. Method of\nassessment\nCompetency may be assessed through:\n4.1 Direct observation\n4.2 Oral questioning\n4.3 Written test\n4.4 Practical demonstration\n4.5\nWork outputs\n6. Context for\nassessment\n6.1 The Assessment may be conducted in the\nworkplace or in a simulated workplace environment\n\n--- PDF PAGE 29 ---\nTR -Microfinance Technology NC II\n\n24\nCORE COMPETENCY\nUNIT OF COMPETENCY\n:\nSELECT POTENTIAL AREA FOR\n\nMICROFINANCE OPERATION\n\nUNIT CODE\n\n:\nHCS341301\n\nUNIT DESCRIPTOR :\nThis unit covers the knowledge, skill and\nattitudes\nrequired\nin\nconducting\narea\nscanning/mapping, surveying and interviewing.\n\nELEMENT\nPERFORMANCE CRITERIA\nSelect Potential Area for Microfinance Operation is performed using\nthe appropriate materials, work processes, tools, equipment,\nquality assurance and occupational health and safety (OH&S)\nrequirements\n1. Conduct area\nscanning/mapping\n1.1 Area’s socio-economic profile gathered from\nconcerned government agencies\n1.2\nOcular visit of target area/s conducted\n2. Coordinate with\nconcerned\ngovernment office\n2.1 Courtesy call with concerned government official/s\nconducted\n2.2 Marketing/promotional materials and documents\ngiven to concerned government official/s\n2.3 MFI program orientation to Barangay Council\ndelivered/presented\n3. Review barangay\nprofile\n3.1 Barangay profile reviewed\n3.2 Documents from area scanning/mapping confirmed\nthrough area survey and from concerned Barangay\nofficials for updated information\n4. Conduct area survey\n4.1 MFI survey forms/instruments and materials are\nutilized\n4.2 Respondents from potential areas identified based on\nbarangay profile and MFI operational manual\n4.3 Area risks, distance travel and fare identified in\naccordance with prevailing conditions\n4.4 Survey of target area/s conducted in accordance with\nestablished survey guidelines and procedures\n5. Conduct interviews\n5.1 Questionnaires secured\n5.2 Respondent visited at place of business\n5.3 Interview conducted in accordance with MFI\ninterview guidelines and procedures\n6. Process survey and\ninterview data\n6.1 Survey and interview data collated\n6.2 Survey and interview report prepared\n6.3 Survey and interview report submitted to immediate\nsuperior\n\n--- PDF PAGE 30 ---\nTR -Microfinance Technology NC II\n\n25\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Materials to be used Materials may include but are not limited to:\n1.1 Map\n1.2\nArea profile\n1.3\nSurvey instrument and interview guide\n1.4\nFare matrix\n1.5\nCourtesy letter\n1.6\nCompany Identification\n1.7\nPaper\n2. Work processes\n2.1 Report preparation\n2.2 Survey and Interview process\n2.3\nComputer application\n3. Tools and equipment 3.1 Motorcycle\n3.2 Computer and printer\n3.3 Permanent markers\n3.4 Ball pen\n3.5\nPencil w/ eraser\n4. Quality Assurance\nrequirements\n4.1 Survey and interview procedures\n4.2 Concerned government office protocol\n4.3\nMFI operation manual\n5. Occupational Health\nand Safety (OHS)\nrequirements\n5.1 Traffic and road safety\n5.2 Acquisition/renewal of driver’s license\n5.3 Regulations on environmental protection\n5.4\nStress and time management\n6. Personal protective\nequipment may\ninclude\n6.1 PPE for use of motorcycle (e.g., helmet, elbow, knee &\nlegs protector)\n6.2 Safety protective devices (e.g. raincoats, umbrella,\nboots and the likes)\n\n--- PDF PAGE 31 ---\nTR -Microfinance Technology NC II\n\n26\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that candidate:\n1.1 Demonstrated ability to conduct survey and interview\n1.2 Read and interpreted map and road signs\n1.3 Demonstrated compliance with regulations applicable\nin the area\n1.4 Demonstrated ability to communicate in oral and in\nwritten forms\n1.5 Demonstrated ability to process survey and interview\ndata\n2. Underpinning\nknowledge and\nattitude\n2.1 Area scanning/mapping(sense of direction)\n2.2 Survey and interview procedures\n2.3 Basic Statistics for survey interview and works\n2.4 Survey report writing\n2.5 Safety practices and guidelines in doing fieldwork\n2.6 Effective oral and written communication\n2.7 Knowledge in computer operation\n2.8 Familiarity of the area\n2.9 Knowledge in map reading\n2.10 Knowledge of the Barangay ordinances\n2.11 Knowledge of tools and equipment safety precautions\n2.12 Knowledge of traffic rules and regulations\n2.13 Attitude: commitment/dedication, love of work,\ncompetence, courteous, honesty, sincerity, sensitivity\nto others, sense of responsibility, caring\nattitude/compassion, and charity\n3. Underpinning skills\n3.1 Observing environmental safety\n3.2 Practicing work ethics and habits\n3.3 Reading and understanding work instructions\n3.4 Conducting surveys and interviews\n3.5 Oral and written communication skills\n3.6 Skills in networking with the different\noffices/organizations and people\n3.7 Applying proper procedures in conducting field survey\nand interview\n3.8 Preparing survey and interview reports\n3.9\nProcessing survey and interview data\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Mode of transportation\n4.2 Endorsement letter from MFI\n4.3 Survey instruments and interview guides\n4.4 Area Maps\n4.5 Barangay profile\n4.6 Computer set with appropriate application software\nand printer\n4.7 Company ID\n4.8\nPersonal Protective Equipment (PPE)\n\n--- PDF PAGE 32 ---\nTR -Microfinance Technology NC II\n\n27\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1 Demonstration with oral questioning\n5.2 Direct observation with oral questioning\n5.3 Portfolio\n5.4\nWritten test\n6. Context for\nassessment\n6.1 Competency may be assessed in the workplace or in a\nsimulated workplace environment\n\n--- PDF PAGE 33 ---\nTR -Microfinance Technology NC II\n\n28\nUNIT OF COMPETENCY\n :\nPROMOTE MICROFINANCE PRODUCTS AND\nSERVICES\nUNIT CODE\n\n:\nHCS341302\nUNIT DESCRIPTOR :\nThis unit covers the basic knowledge, skill and\nattitudes\nrequired\nin\nthe\npromotion\nand\nmarketing of MFI’s products and services.\n\nELEMENT\nPERFORMANCE CRITERIA\nPromote Microfinance Products and Services is performed using the\nappropriate work processes, tools, equipment, quality assurance\nand occupational health and safety (OH&S) requirement and\npersonal protective equipment\n1. Introduce loan\nproducts and\nservices\n1.1 Marketing/promotional materials prepared\n1.2 Potential market identified\n1.3 Loan products, savings product, micro insurance and\nother services introduced\n1.4 MFIs savings standards, policies and procedures well\nexplained to prospective clients\n1.5\nAdvantage introduced\n2. Conduct orientation\nand briefings on\nmicrofinance\nproducts and\nservices\n2.1 Orientation/briefing materials prepared\n2.2 Features of loan, savings and insurance products well\nexplained\n2.3 Orientation and briefing on loan products, savings\nproduct, micro insurance and other services conducted\n3. Facilitate/Coordinate\nmicrofinance training\nprogram\n3.1 Promotional training materials prepared/gathered\n3.2 Capacity development (e.g. Advantages of business\ndevelopment services/community development\nservices) are discussed well with MFI clients\n3.3 Microfinance program and value-added services\npromoted\n4. Assist clients in\npromoting their\nproducts\n4.1 Quality products identified and endorsed\n4.2 Product requirements/accreditation is coordinated\n4.3 Advice on product development/enhancement is\nprovided\n4.4 Market networking/linkaging done with other member/s\nand MFI/s\n4.5 Advice on clients’ product promotion is provided\nthrough trade fair/exhibits and other venues\n5. Administer survey on\nenhancement of MFI\nproducts and\nservices\n5.1 Survey instrument secured\n5.2 Survey conducted\n5.3 Survey data collated and processed\n5.4\nSurvey results is submitted to immediate supervisor\n\n--- PDF PAGE 34 ---\nTR -Microfinance Technology NC II\n\n29\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Promotional\nMaterials\n1.1 Brochures\n1.2 Flyers\n1.3 Posters\n1.4 Streamers\n1.5 Client’s Sample Products\n1.6 Metacards\n1.7 Flip Chart\n1.8\nVisual Aids\n2. Work processes\n2.1 Promotional and marketing processes\n2.2 Survey process\n2.3\nRelevant policies and procedures\n3. Tools and equipment 3.1 Computer\n3.2 Printer\n3.3 Paper copier\n3.4 Fax machine\n3.5 Telephone/cell phone\n3.6 Ball pen\n3.7 Posting materials\n3.8 Pencil and eraser\n3.9\nMotorcycle\n4. Quality Assurance\nrequirements\n4.1 Relevant provision of MFI operational manual\nconcerning products and services\n4.2 Compliance to requirements of appropriate\ngovernment agencies\n5. Occupational Health\nand Safety (OHS)\nrequirements\n5.1 First aid treatment\n5.2 Awareness of LGU (city/municipal/barangay)\nordinances relating to OHS\n5.3 Avoiding high risk areas\n5.4 Respecting local customs and traditions\n5.5 Seeking assistance from appropriate authorities during\nemergency situation\n5.6 Safety precautions on the use of tools and equipment\n5.7 Regulations on environmental protection\n5.8\nObservance of traffic and road safety\n6. Personal protective\nequipment\n6.1\nPPE for use of motorcycle (e.g., helmet, elbow, knee &\nlegs protector)\n6.2 Safety protective devices (e.g. raincoats, umbrella,\nboots and the likes)\n\n--- PDF PAGE 35 ---\nTR -Microfinance Technology NC II\n\n30\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that candidate:\n1.1 Demonstrated ability in promoting MFI products and\nservices and networking/linkaging\n1.2 Demonstrated the ability to assist clients in the\nenhancement and promotion of their products and\nservices\n2. Underpinning\nknowledge and\nattitude\n2.1 Knowledge of MFI products and services\n2.2 Knowledge of promotion of products and services\n2.3 Knowledge in establishing linkages and rapport with\norganizations and people\n2.4 Knowledge of survey and interview procedures\n2.5 Work ethics and positive work habits\n2.6 Attitude: commitment/dedication, love of work,\ncompetence, courteous, honesty, sincerity, sensitivity\nto others, sense of responsibility, caring\nattitude/compassion, and charity\n3. Underpinning skills\n3.1 Communication skills\n3.2 Presentation skills\n3.3 Networking/linkaging skills\n3.4 Skill in promoting products and services, and MFI\nprograms\n3.5 Skill in conducting surveys and interviews\n3.6 Skill in making reports\n3.7\nInterpersonal skills\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Promotional materials appropriate for type of products\nand services\n4.2 Sample of products to be promoted/enhanced\n4.3 Potential target area for promotion of products and\nservices\n4.4\nSurvey instruments and interview guides\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1 Demonstration with oral questioning\n5.2 Direct observation with oral questioning\n5.3 Portfolio\n5.4\nWritten test\n6. Context for\nassessment\n6.1 Competency may be assessed in the workplace or in a\nsimulated workplace environment\n\n--- PDF PAGE 36 ---\nTR -Microfinance Technology NC II\n\n31\nUNIT OF COMPETENCY\n:\nFORM GROUP OF MICROFINANCE CLIENTS\nUNIT CODE\n :\nHCS341303\nUNIT DESCRIPTOR :\nThis unit covers the knowledge, skill and\nattitudes required in forming, evaluating,\norganizing and developing group clients for\nservice delivery.\nELEMENT\nPERFORMANCE CRITERIA\nForm Group of Microfinance Clients is performed using the appropriate\ncommunication process in consideration with communication\nbarriers, non-verbal communication, supplies materials, and\nequipment/facility and following meeting protocols.\n1. Meet with barangay\nofficial/s\n1.1 Letter of request/courtesy is prepared\n1.2 Letter of request/courtesy given to concerned\nBarangay Official\n1.3 Meeting with Barangay Official scheduled and\nconducted\n2. Orient target clients\n2.1 Target clients informed\n2.2 Material for orientation prepared/secured\n2.3 Venue, schedule for orientation announced\n2.4 Target clients gathered\n2.5 MFIs products and services introduced and explained\n2.6\nOrientation is conducted\n3. Schedule and\nconduct family\nbackground\ninvestigation/CCI /BI\n3.1 Complete requirements of clients are gathered\n3.2 Efficient plan of visit based on geographical location\nand proximity of the scheduled family for CCI/BI is\nprepared\n3.3 Checklist/form for CCI/BI is prepared\n3.4 List of target clients and other resource person/s\nprepared\n3.5 Credit Investigation and Background Investigation\n(CCI/BI) conducted in accordance with the\norganization’s practices and standards\n3.6 Critical/Questionable clients information from CCI/BI\nare validated through revisits, and feedback from\nalternate informants\n4. Organize\ngroup/center/ cluster\n4.1 Potential clients identified\n4.2 Group/center identified\n4.3 Venue and schedule of meetings, collections and\nother activities selected\n4.4 Election of group/center officers facilitated in\naccordance with MFI procedures\n4.5 Group/center officers identified\n4.6\nGroup/center organized\n5. Orient group officers/\ncenter officer on their\nroles and\nresponsibilities\n5.1 Orientation materials prepared/secured\n5.2 Group officers/center officers roles and responsibilities\nare discussed and agreed\n\n--- PDF PAGE 37 ---\nTR -Microfinance Technology NC II\n\n32\nELEMENT\nPERFORMANCE CRITERIA\nForm Group of Microfinance Clients is performed using the appropriate\ncommunication process in consideration with communication\nbarriers, non-verbal communication, supplies materials, and\nequipment/facility and following meeting protocols.\n6. Facilitate group\n/center officer\nmeetings\n6.1 Group/Center meeting agenda prepared\n6.2 Group/Center meeting processes observed\n6.3 Active clients’ participation on discussion/activities is\nencouraged\n6.4 Clients facilitation of meetings are supervised\n6.5\nGroup/Center meetings facilitated\n\n--- PDF PAGE 38 ---\nTR -Microfinance Technology NC II\n\n33\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Communication\nprocess\n\n1.1 Effective communication skills\n1.2 Facilitation skills\n1.3 Counseling skills\n1.4 Interaction among clients\n1.5 Communication techniques (e.g. Good working\ncondition, Art of questioning and listening)\n2.\nCommunication\nbarriers\n\n2.1 Workplace\n2.2 Facilities\n2.3 Dialects\n2.4\nUnexpected interruptions\n3.\nNon-verbal\ncommunication\n\n3.1 Visual aid\n3.2 Facial expression\n3.3 Sign language\n3.4 Body language\n3.5\nClear calligraphy\n4.\nSupplies,\nmaterials,\nequipment and\nfacility\n\nMay include but are not limited to:\n4.1 Bible (optional)/transformational handbook\n4.2 Forms\n4.2.1\nMembership application\n4.2.2\nLoan application\n4.2.3\nSurvey Instruments\n4.2.4\nCCI/BI checklist\n4.3 Calculator\n4.4 Logbook/class record\n4.5 Manila paper\n4.6 Permanent markers\n4.7 Masking tape/board pins\n4.8 Visual aids\n4.9\nVenue with chairs and table\n5.\nClients\n5.1 Potential clients\n5.2\nExisting clients (with loans)\n6.\nMeeting protocols\n\n6.1 Punctuality of starting and ending