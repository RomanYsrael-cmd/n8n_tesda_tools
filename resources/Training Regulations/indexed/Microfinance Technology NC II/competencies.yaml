        "source_text": "--- PDF PAGE 16 ---\nTR -Microfinance Technology NC II \n                                                                                                           \n \n \n11\nUNIT OF COMPETENCY : \nPRACTICE OCCUPATIONAL HEALTH AND SAFETY   \nPROCEDURES  \nUNIT CODE \n: \n      500311108 \nUNIT DESCRIPTOR \n: \nThis unit covers the outcomes required to comply with \nregulatory \nand \norganizational \nrequirements \nfor \noccupational health and safety.  \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1. Identify hazards and \nrisks \n1.1 \nSafety regulations and workplace safety and \nhazard control practices and procedures are \nclarified and explained based on organization \nprocedures \n1.2 \nHazards/risks in the workplace and their \ncorresponding indicators are identified to minimize \nor eliminate risk to co-workers, workplace and \nenvironment in accordance with organization \nprocedures \n1.3 \nContingency measures during workplace \naccidents, fire and other emergencies are \nrecognized and established in accordance with \norganization procedures\n2. Evaluate hazards and \nrisks \n2.1     Terms of maximum tolerable limits which when \nexceeded will result in harm or damage are \nidentified based on threshold limit values (TLV) \n2.2      Effects of the hazards are determined \n2.3     OHS issues and/or concerns and identified safety \nhazards are reported to designated personnel in \naccordance with workplace requirements and \nrelevant workplace OHS legislation \n3. Control hazards and \nrisks  \n3.1     Occupational health and safety (OHS) procedures \nfor controlling hazards/risks in workplace are \nconsistently followed \n3.2      Procedures for dealing with workplace accidents, \nfire and emergencies are followed in accordance \nwith organization OHS policies \n3.3      Personal protective equipment (PPE) is correctly \nused in accordance with organization OHS \nprocedures and practices  \n3.4     Appropriate assistance is provided in the event of a \nworkplace emergency in accordance with \nestablished organization protocol\n4. Maintain Occupational \nHealth and Safety \n(OHS) awareness \n4.1    Emergency-related drills and trainings are \nparticipated in as per established organization \nguidelines and procedures  \n4.2   OHS personal records are completed and updated \nin accordance with workplace requirements\n\n--- PDF PAGE 17 ---\nTR -Microfinance Technology NC II \n                                                                                                           \n \n \n12\nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Safety regulations \nMay include but are not limited to: \n1.1 \nClean air act \n1.2 \nBuilding code \n1.3 \nNational electrical and fire safety codes \n1.4 \nWaste management statutes and rules \n1.5 \nPhilippine occupational safety and health standards \n1.6 \nDOLE regulations on safety legal requirements \n1.7\nECC regulations\n2. Hazards/Risks \nMay include but are not limited to: \n2.1 \nPhysical hazards – impact, illumination, pressure, \nnoise,  vibration, temperature, radiation  \n2.2 \nBiological hazards- bacteria, viruses, plants, parasites,  \nmites, molds, fungi, insects \n2.3 \nChemical hazards – dusts, fibers, mists, fumes, \nsmoke, gasses, vapors \n2.4 \nErgonomics \n Psychological factors – over exertion/ excessive \nforce, awkward/static positions, fatigue, direct \npressure, varying metabolic cycles \n Physiological factors – monotony, personal \nrelationship, work out cycle\n3. Contingency \nmeasures \nMay include but are not limited to: \n3.1 \nEvacuation \n3.2 \nIsolation \n3.3 \nDecontamination \n3.4\nCalling designated emergency personnel\n4. PPE \nMay include but are not limited to: \n4.1 \nMask \n4.2 \nGloves \n4.3 \nGoggles \n4.4 \nHair Net/cap/bonnet \n4.5 \nFace mask/shield \n4.6 \nEar muffs \n4.7 \nApron/gown/coverall/jump suit \n4.8\nAnti-static suits\n5. Emergency-related \ndrills and training \n5.1 \nFire drill \n5.2 \nEarthquake drill  \n5.3 \nBasic life support/cardiopulmonary resuscitation (CPR)\n5.4 \nFirst aid \n5.5 \nSpillage control  \n5.6 \nDecontamination of chemical and toxic \n5.7\nDisaster preparedness/management\n6. OHS personal \nrecords \n6.1  \nMedical/health records \n6.2  \nIncident reports \n6.3  \nAccident reports \n6.4\nOHS-related training completed\n\n--- PDF PAGE 18 ---\nTR -Microfinance Technology NC II \n                                                                                                           \n \n \n13\nEVIDENCE GUIDE \n \n1. Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1 \nExplained clearly established workplace safety and \nhazard control practices and procedures \n1.2 \nIdentified hazards/risks in the workplace and its \ncorresponding indicators in accordance with  \ncompany  procedures \n1.3 \nRecognized contingency measures during \nworkplace accidents, fire and other emergencies \n1.4 \nIdentified terms of maximum tolerable limits based \non threshold limit value (TLV) \n1.5 \nFollowed Occupational Health and Safety (OHS) \nprocedures for controlling hazards/risks in \nworkplace \n1.6 \nUsed Personal Protective Equipment (PPE) in \naccordance with company OHS procedures and \npractices  \n1.7 \nCompleted and updated OHS personal records in \naccordance with workplace requirements  \n2. Underpinning \nknowledge and \nattitude \n2.1 \nOHS procedures and practices and regulations \n2.2 \nPPE types and uses \n2.3 \nPersonal hygiene practices \n2.4 \nHazards/risks identification and control \n2.5 \nThreshold limit value (TLV) \n2.6 \nOHS indicators  \n2.7 \nOrganization safety and health protocol \n2.8 \nSafety consciousness \n2.9\nHealth consciousness\n3. Underpinning skills \n3.1 \nPractice of personal hygiene  \n3.2 \nHazards/risks identification and control skills \n3.3 \nInterpersonal skills \n3.4\nCommunication skills\n4. Resource   \nimplications \nThe following resources MUST be provided: \n4.1 \nWorkplace or assessment location \n4.2 \nOHS personal records \n4.3 \nPPE \n4.4\nHealth records\n5. Method of \nassessment \nCompetency may be assessed through: \n5.1 \nPortfolio assessment  \n5.2 \nInterview \n5.3\nCase study/situation\n6. Context of \nassessment\n6.1 \nCompetency may be assessed in the work place or \nin a simulated work place setting\n",
        "required_knowledge": null,
        "required_skills": null
      }
