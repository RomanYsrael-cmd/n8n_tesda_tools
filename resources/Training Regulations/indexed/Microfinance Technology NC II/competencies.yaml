        "evidence_guide": {
          "source_text": "1. Critical aspects of\ncompetency\nAssessment requires evidence that candidate:\n1.1 Analyzed transactions\n1.2 Recorded transaction on standard forms\n1.3 Complied with the guidelines for record-keeping in\naccordance with MFIs standards and procedures\n1.4 Handled materials with utmost care to avoid\nwastage\n1.5\nDemonstrated accurate record-keeping\n2. Underpinning\nknowledge and\nattitude\n2.1 Record-keeping concepts and principles\n2.2 Record-keeping procedures and practices in\naccordance with the MFIs methodology\n2.3 Confidentiality and security of records\n2.4 Filing system\n2.5 Knowledge in analyzing transactions\n2.6 Knowledge of fundamental mathematical\noperations\n2.7 Knowledge of basic statistics\n2.8 Familiarity with record-keeping processes\n2.9 Attitude: quality /cost consciousness, honesty,\nfriendliness/firmness/fairness, consistency, team\nplayer, prudence, keen for details\n3. Underpinning skills\n3.1 Ability to read and understand record-keeping\nterminologies and instructions\n3.2 Ability to identify account titles for every\ntransaction\n3.3 Performing record-keeping in accordance with the\norganization’s rules and regulations\n3.4\nReading and understanding work instructions\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Working table\n4.2 Basic record-keeping Forms/documents\n4.3 Calculators\n4.4 Computer and printer\n4.5\nSupplies and materials\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1 Demonstration with questioning\n5.2 Direct observation with questioning\n5.3 Portfolio\n5.4\nWritten test\n6. Context for\nassessment\n6.1 Competency may be assessed in the workplace or\nin a simulated workplace environment\n\n--- PDF PAGE 56 ---\nTR -Microfinance Technology NC II\n\n51"
        },
        "source_text": "HCS341307\nUNIT DESCRIPTOR :\nThis unit covers the knowledge, skill and attitudes\nrequired in updating financial records, accomplishing\nnecessary forms for specific transactions and budget\nprojections.\n\nELEMENT\nPERFORMANCE CRITERIA\nUpdating Financial Records is performed using the appropriate\nforms, work processes, tools, equipment, quality assurance\nand occupational health and safety (OH&S) requirements\n1. Review transaction\nreport\n1.1 Collection report is reviewed\n1.2 Cash receipt slip/collection summary report\naccomplished and reviewed\n2. Prepare loan\ndisbursement master\nroll\n2.1 Client’s name and loan information listed\n2.2 Loan disbursement master roll prepared\n2.3\nClients signature affixed\n3. Record daily\ncollection on daily\ncollection sheet\n3.1 Collection consolidated and recorded\n3.2 Collections on loan amortization, capital build-up\n/savings and other fees identified and recorded\n3.3\nReport submitted to immediate superior\n4. Submit daily\nmonitoring report\n4.1 Daily activity schedule prepared\n4.2 Daily activities output and total collection recorded,\nsummarized and submitted to immediate superior\n5. Summarize collect-\nion on Loan Officer’s\nsummary book\n5.1 Collection on loan amortization, capital build-up\nand other fees are summarized\n5.2\nSummary report submitted to immediate superior\n6. Prepare monthly\nplan\n6.1 Budget for administrative and operational\nexpenses prepared\n6.2 Collection on capital build-up and loan amortization\nprojected\n6.3 Performance commitment on outreach and loan\nportfolio signed and submitted to immediate\nsuperior\n6.4\nMonthly plan prepared\n7. Prepare annual\ndevelopment action\nplan\n7.1 Budget for branch expenses prepared\n7.2 Collection on capital build-up and loan\namortization projected\n7.3 Performance commitment on outreach and loan\nportfolio signed and submitted to immediate\nsuperior\n7.4 Next year’s amount of loan disbursement projected\n7.5\nAnnual plan prepared\n\n--- PDF PAGE 54 ---\nTR -Microfinance Technology NC II\n\n49\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Forms\nForms may include but are not limited to:\n1.1 Cash receipt slip\n1.2 Daily collection sheet\n1.3 Debit voucher\n1.4 Loan projection sheet\n1.5 Loan disbursement master roll\n1.6 Cash book\n1.7\nGeneral/subsidiary ledger\n2. Work Processes\n2.1 Loan projection process\n2.2\nRecord-keeping process\n3. Tools and\nequipment\nMay include but are not limited to:\n3.1 Calculator\n3.2 Computer\n3.3 Printer\n3.4 Ruler\n3.5\nBall pens\n4. Quality Assurance\nrequirements\n4.1 MFI Operation Manual\n4.2 Standards and Procedures (e.g. ASA, Grameen,\nVillage banking and other Microfinance\nmethodologies)\n5. Occupational Health\nand Safety (OHS)\nrequirements\n5.1\nKnowledge of organization’s business policy\n5.2\nOHS rules and regulations in the workplace\n5.3\nKnowledge of tools and equipment safety\nprecautions\n5.4\nRegulations on environmental protection\n\n--- PDF PAGE 55 ---\nTR -Microfinance Technology NC II\n\n50\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that candidate:\n1.1 Analyzed transactions\n1.2 Recorded transaction on standard forms\n1.3 Complied with the guidelines for record-keeping in\naccordance with MFIs standards and procedures\n1.4 Handled materials with utmost care to avoid\nwastage\n1.5\nDemonstrated accurate record-keeping\n2. Underpinning\nknowledge and\nattitude\n2.1 Record-keeping concepts and principles\n2.2 Record-keeping procedures and practices in\naccordance with the MFIs methodology\n2.3 Confidentiality and security of records\n2.4 Filing system\n2.5 Knowledge in analyzing transactions\n2.6 Knowledge of fundamental mathematical\noperations\n2.7 Knowledge of basic statistics\n2.8 Familiarity with record-keeping processes\n2.9 Attitude: quality /cost consciousness, honesty,\nfriendliness/firmness/fairness, consistency, team\nplayer, prudence, keen for details\n3. Underpinning skills\n3.1 Ability to read and understand record-keeping\nterminologies and instructions\n3.2 Ability to identify account titles for every\ntransaction\n3.3 Performing record-keeping in accordance with the\norganization’s rules and regulations\n3.4\nReading and understanding work instructions\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Working table\n4.2 Basic record-keeping Forms/documents\n4.3 Calculators\n4.4 Computer and printer\n4.5\nSupplies and materials\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1 Demonstration with questioning\n5.2 Direct observation with questioning\n5.3 Portfolio\n5.4\nWritten test\n6. Context for\nassessment\n6.1 Competency may be assessed in the workplace or\nin a simulated workplace environment\n\n--- PDF PAGE 56 ---\nTR -Microfinance Technology NC II\n\n51"
      }
