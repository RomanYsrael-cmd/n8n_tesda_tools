        "source_text": "--- PDF PAGE 13 ---\nTR -Microfinance Technology NC II \n                                                                                                           \n \n \n8\nUNIT OF COMPETENCY : \nPRACTICE CAREER PROFESSIONALISM \nUNIT CODE \n: \n500311107 \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge, skills and attitudes in \npromoting career growth and advancement. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1. Integrate personal \nobjectives with \norganizational goals \n1.1 \nPersonal growth and work plans are pursued \ntowards improving the qualifications set for the \nprofession \n1.2 \nIntra and interpersonal relationships is are \nmaintained in the course of managing oneself \nbased on performance evaluation \n1.3 \nCommitment to the organization and its goal is \ndemonstrated in the performance of duties\n2. Set and meet work \npriorities \n2.1 \nCompeting demands are prioritized to achieve \npersonal, team and organizational goals and \nobjectives. \n2.2 \nResources are utilized efficiently and effectively to \nmanage work priorities and commitments \n2.3 \nPractices along economic use and maintenance of \nequipment and facilities are followed  as per \nestablished procedures\n3. Maintain professional \ngrowth and \ndevelopment \n3.1 \nTrainings and career opportunities are identified \nand availed of  based on job requirements \n3.2 \nRecognitions are  sought/received and \ndemonstrated as proof of career advancement \n3.3 \nLicenses and/or certifications relevant to job and \ncareer are obtained and renewed\n\n--- PDF PAGE 14 ---\nTR -Microfinance Technology NC II \n                                                                                                           \n \n \n9\nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.  Evaluation \n1.1 \nPerformance appraisal \n1.2 \nPsychological profile \n1.3      Aptitude tests\n2.  Resources \n2.1 \nHuman \n2.2 \nFinancial \n2.3 \nTechnology \n2.3.1 Hardware \n2.3.2 Software\n3.  Trainings and career \nopportunities \n3.1 \nParticipation in training programs \n3.1.1 Technical \n3.1.2 Supervisory \n3.1.3 Managerial \n3.1.4 Continuing education \n3.2 \nServing as resource persons in conferences and \nworkshops\n4.  Recognitions \n4.1 \nRecommendations \n4.2 \nCitations \n4.3 \nCertificate of appreciations \n4.4 \nCommendations \n4.5 \nAwards \n4.6\nTangible and intangible rewards\n5.  Licenses and/or \ncertifications \n5.1 \nNational certificates \n5.2 \nCertificate of competency \n5.3 \nSupport level licenses \n5.4\nProfessional licenses\n\n--- PDF PAGE 15 ---\nTR -Microfinance Technology NC II \n                                                                                                           \n \n \n10\nEVIDENCE GUIDE \n       \n1.  Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \nAttained job targets within key result areas (KRAs) \nMaintained intra and interpersonal relationship in the \ncourse of managing oneself based on performance \nevaluation \nCompleted trainings and career opportunities which are \nbased on the requirements of the industries \nAcquired and maintained licenses and/or certifications \naccording to the requirement of the qualification \n2.  Underpinning \nknowledge and \nattitude \n2.1 \nWork values and ethics (code of conduct, code of \nethics, etc.) \n2.2 \nCompany policies \n2.3 \nCompany operations, procedures and standards  \n2.4 \nFundamental rights at work including gender \nsensitivity \n2.5 \nPersonal hygiene practices \n3.  Underpinning skills \n3.1 \nAppropriate practice of personal hygiene \n3.2 \nIntra and Interpersonal skills \n3.3 \nCommunication skills \n4.  Resource \nimplications \nThe following resources MUST be provided: \n4.1 \nWorkplace or assessment location \n4.2 \nCase studies/scenarios \n5.  Method of \nassessment \nCompetency may be assessed through: \n5.1 \nPortfolio assessment \n5.2 \nInterview \n5.3 \nSimulation/role-plays \n5.4 \nObservation \n5.5 \nThird party reports \n5.6 \nExams and tests \n6.  Context of \nassessment \n6.1 \nCompetency may be assessed in the work place or \nin a simulated work place setting\n",
