        "source_text": "HCS341305\nUNIT DESCRIPTOR :\nThis unit covers the knowledge, skill and attitudes\nrequired in evaluating/screening, recommending and\nprocessing clients’ application for loans and other\nproducts/services for approval of immediate superior.\n\nELEMENT\nPERFORMANCE CRITERIA\nProcess Application for Loans and Other Products/Services is\nperformed using prescribed forms and materials, work\nprocesses, tools and equipment, OHS, quality assurance\n1. Issue applications for\nloans and other\nproducts/services\n1.1 Application forms requested from immediate\nsuperior\n1.2 Serial number of application forms logged for\ncontrol and monitoring\n1.3 Application form issued in accordance with\nMicrofinance Institution’s (MFI) practices\n2. Gather applications\nfor loan and other\nproducts/services\n2.1 Application forms gathered for appraisal\n2.2 Application loan verified and checked for data\ncompletion\n3. Evaluate loan\napplicant and /or\ninsurance\napplicant/claimant\n3.1\nLoan appraisal is conducted in accordance with\nMFI’s standards\n3.2\nLoan applicant and/or insurance\napplicant/claimant is interviewed in accordance\nwith MFI’s procedures\n4. Evaluate loan and /or\ninsurance documents\n4.1\nData accuracy verified in accordance with MFI’s\noperational manual\n4.2\nSupporting documents checked and attached\nfor completeness and correctness\n5. Prepare summary of\nloan applications\nand/or insurance\n5.1\nSummary of loan applications and insurance\nclaims accomplished\n5.2\nSignature of loan officer affixed on application\nforms for loans and/or insurance claims\n6. Recommend qualified\nloan applicants and/or\ninsurance claimant\n6.1\nMFI’s performance standards on loan and/or\ninsurance application/claim qualifications are\nfollowed\n6.2\nSignature of supervisor is secured on loan\napplication and insurance claim forms\n6.3\nQualified loan applicants and insurance claimant\nare recommended to immediate superior\n7. Inform clients about\nloan application and/or\ninsurance status\n7.1\nLoan approval and schedule of release\nannounced to clients\n7.2\nClients individually informed on loan and/or\ninsurance status\n\n--- PDF PAGE 45 ---\nTR -Microfinance Technology NC II\n\n40\nELEMENT\nPERFORMANCE CRITERIA\nProcess Application for Loans and Other Products/Services is\nperformed using prescribed forms and materials, work\nprocesses, tools and equipment, OHS, quality assurance\n8. Check loan utilization\n8.1\nMFI’s performance standards on loan utilization\nfollowed\n8.2\nLoan utilization/monitoring form accomplished\nand signed\n8.3\nSupporting documents/evidence on loan\nutilization checked\n\n--- PDF PAGE 46 ---\nTR -Microfinance Technology NC II\n\n41\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Forms\nForms may include but are not limited to:\n1.1\nApplication forms\n1.2\nCash flow analysis form\n1.3\nLoan utilization form\n1.4\nCredit and background investigation form\n1.5\nBusiness/project proposal form\n1.6\nOther required MFI’s forms\n1.7\nInsurance application forms\n2. Work processes\nMay include but are not limited to:\n2.1\nLoan processing procedure\n2.2\nCredit and Background Investigation procedure\n2.3\nEvaluation/monitoring process\n2.4\nLoan recommendation and approval process\n3. Tools and\nequipment\nMay include but are not limited to:\n3.1\nTypewriter\n3.2\nComputer\n3.3\nCalculators\n3.4\nStapler\n3.5\nBallpen\n3.6\nCamera\n4. Quality Assurance\nrequirements\n4.1\nEffective oral communication\n4.2\nThorough knowledge and skills in loan processing\n4.3\nReading and understanding instructions\n4.4\nPractice of work ethics and habits\n4.5\nObservance of environmental safety\n4.6\nFamiliarity of the designated area\n4.7\nEffective client selection and Credit and Background\nInvestigation\n5. Occupational Health\nand Safety (OHS)\nrequirements\n5.1\nKnowledge of organization’s business policy\n5.2\nOHS rules and regulations in the workplace\n5.3\nKnowledge of tools and equipment safety precautions\n5.4\nRegulations on environmental protection\n6. Personal protective\nequipment\n6.1\nSafety protective devices (e.g., raincoats, umbrella,\nboots and the likes)\n6.2\nPPE for use of motorcycle (e.g., helmet, elbow, knee &\nlegs protector)\n7. Loan appraisal\nMay include but not limited to:\n7.1\nCash flow analysis\n7.2\nCharacter/Credit Investigation/Background\nInvestigation\n7.3\nPoverty Index\n7.4\nMeans Test\n7.5\nCredit history within/outside MFI\n\n--- PDF PAGE 47 ---\nTR -Microfinance Technology NC II\n\n42\nVARIABLE\nRANGE\n8. Supporting\ndocuments\nSupporting documents may include but not limited to:\n\nLoan application\n8.1\nBarangay clearance for loan purposes\n8.2\nResidence certificates\n8.3\nBusiness permit (barangay/municipal/city, DTI)\n8.4\nPhotocopy of valid ID (co-maker/co-borrower)\n\nInsurance application\n8.5\nBirth certificate\n8.6\nMarriage Contract\n8.7\nWaiver (Optional)\n8.8\nDeclaration of Good Health and Insurability\n\nInsurance claim\n8.9\nDeath certificate\n8.10\nPhysician statements\n\n--- PDF PAGE 48 ---\nTR -Microfinance Technology NC II\n\n43\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that candidate:\n1.1 Demonstrated on time processing of loan\napplication\n1.2 Demonstrated compliance with MFIs loan\nstandards and procedures\n1.3 Demonstrated the ability to evaluate/assess credit-\nworthiness\n1.4 Handled forms and materials with utmost care to\navoid wastage\n2. Underpinning\nknowledge and\nattitude\n2.1 Knowledge of Microfinance product, services and\nprograms\n2.2 Loan processing procedures\n2.3 Character/Credit Investigation and Background\nInvestigation (CCI/BI) procedures\n2.4 Loan evaluation/monitoring process\n2.5 Loan recommendation and approval process\n2.6 Standard forms, supplies and materials\n2.7 Basic mathematics related to loan assessment\n2.8 Segregation and filing of loan documents\n2.9 Client/customer service\n2.10 Attitude: quality /cost consciousness, honesty,\nfriendliness/firmness/fairness, consistency, team\nplayer, prudence, keen for details\n3. Underpinning skills\n3.1 Ability to read and understand verbal and non-\nverbal instructions\n3.2 Conducting CCI/BI\n3.3 Evaluating/monitoring client’s loan\n3.4 Numeracy/computational skills\n3.5 Interpersonal skills\n3.6 Group facilitation skills\n3.7\nUse and analyze loan document\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Standard forms for different loan programs\n4.2 Checklist of requirements\n4.3\nMFI loan protocol/procedures\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1 Demonstration with questioning\n5.2 Direct observation with questioning\n5.3 Portfolio\n5.4\nWritten test\n6.\nContext for\nassessment\n6.1 Competency may be assessed in the workplace or\nin a simulated workplace environment\n\n--- PDF PAGE 49 ---\nTR -Microfinance Technology NC II\n\n44\nUNIT OF COMPETENCY\n: COLLECT DUES\nUNIT CODE\n\n:"
