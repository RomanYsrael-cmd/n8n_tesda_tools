  "source_section_text": "Section 1. Successful candidates shall be awarded a\nNational Certificate signed by the TESDA Director General.\n\n4.2 Individual\naspiring\nto\nbe\nawarded\nthe\nqualification\nof\nMICROFINANCE\nTECHNOLOGY NC II must demonstrate competency in all the following core units of\nthe Qualification through a single project-type assessment. Candidates may apply\nfor assessment in any accredited assessment center.\n\n•\nSelect Potential Area for Microfinance Operation\n•\nPromote Microfinance Products and Other Services\n•\nForm Group of Microfinance Clients\n•\nFacilitate Center Meeting\n•\nProcess Application for Loans and Other Services\n•\nCollect Dues\n•\nUpdate Financial Records\n\nSuccessful candidates shall be awarded National Certificate Level II in\nMICROFINANCE TECHNOLOGY.\n\n4.3 Assessment shall focus on the core units of competency. The basic and common\nunits shall be integrated or assessed concurrently with the core units.\n\n4.4 The following are qualified to apply for assessment and certification\n\n4.5.1 Graduates of formal, non-formal and informal including enterprise-\nbased training programs\n\n4.5.2 Experienced workers (wage employed or self employed)\n\n4.5 The guidelines on assessment and certification are discussed in detail in the\n\"Procedures Manual on Assessment and Certification\" and \"Guidelines on the\nImplementation of the Philippine TVET Qualification and Certification System\n(PTQCS)\".\n\n--- PDF PAGE 67 ---\nTR -Microfinance Technology NC II Date Promulgated\n\n62\nCOMPETENCY MAP\n\nMICROFINANCE TECHNOLOGY NC II\n\nCORE UNITS OF COMPETENCY\n\nSelect potential area for\nmicrofinance operation\n\nPromote microfinance\nproducts and other services\n\nForm group of microfinance\nclients\n\nFacilitate center meetings\n\nProcess application for loans\nand other services\nCollect dues\n\nUpdate financial records\n\nPerform goal setting and\nplanning\n\nPerform monitoring and\nevaluation\n\nProvide/facilitate remittance\nservices\nMaintain records\n\nPerform HR-related activities\n(hiring, training, benefits and\nwelfare)\n\nDevelop center/clients\nentrepreneurial skills\n\nEstablish linkages or network\nwith different sectors\n\nCOMMON UNITS OF COMPETENCY\n\nProvide quality customer\nservices\n\nComply with quality and\nethical standards\n\nPerform computer operation\n\nBASIC UNITS OF COMPETENCY\nParticipate in workplace\ncommunication\n\nWork in team environment\n\nPractice career professionalism\n\nPractice occupational health\nand safety procedures\n\n--- PDF PAGE 68 ---\nTR -Microfinance Technology NC II Date Promulgated\n\n63\nDEFINITION OF TERMS:\nMicrofinance\n\nThe provision of the broad range of financial services such as –\nloans, savings and other non-financial services such as micro-\ninsurance and capacity building programs for the poor and low-\nincome households to assist their micro-enterprises so as to enable\nthem to raise their income levels and improve their living standard.\nClients\nBorrower or individual who availed loans which includes active,\nresting and savers.\nLoan/credit\nMajor service of the microfinance institution being rendered to\ninterested entrepreneurial poor.\nSavings\nRefers to Capital Build-Up (CBU), Savings Build-Up (SBU) which is\neither compulsory or voluntary (money set aside by the client for\nemergency and additional capital purposes which is kept in the MFI)\nPassbook\nClient’s document that shows their financial transactions with the\nMFI\nRegisters\nBooks where all financial transactions and other information about\nthe client are recorded\nCenter/Group/\nCluster\nRefers to an assembly of clients where the microfinance products\nand services are provided\nCenter/Group/\nCluster/ Meeting\nRefers to an activity conducted regularly/periodically such as\ncollection of dues, dissemination of information and some topic.\nPotential Area\nRefers to a location where the formation of center/group/cluster is\npossible.\nPast Due\nuncollected payments\nSit-down\nrefers to a strategy of collecting past dues from a delinquent client\nby literally sitting down in the client’s premises(e.g., house or\nbusiness location) and waiting for the payment\nAbbreviations:\nCCI\nCharacter and Credit Investigation\nBI\nBackground Investigation\nMFI\nMicrofinance Institution\n\n--- PDF PAGE 69 ---\nTR -Microfinance Technology NC II Date Promulgated\n\n64\nACKNOWLEDGEMENTS\n\nThe Technical Education and Skills Development Authority (TESDA) wishes\nto extend thanks and appreciation to the many representatives of microfinance\ncouncils, microfinance institutions, cooperatives, rural banks, educational\ninstitutions and non-government organizations who shared their time and expertise\nto the development and validation of these Training Regulations.\n\nThe participants in the development of the draft Training Regulations\nMicrofinance Institutions\n\nOrganizations\nName\nDesignation\nAlalay sa Kaunlaran\nIncorporated (ASKI)\nMr. Marcelino Diamat\nProject Officer\nMs. Joe Marie Bote\nHR Supervisor\nMr. Melvin Villaluz\nProject Officer\nMs. Irma Santos\nBranch Manager\nMr. Jeffrey dela Cruz\nBranch Manager\nMr. Gregorio Macapagal III\nBranch Manager\nMs. Alicia Caliwag\nCorporate Secretary\nMs. May Garlitos\nTraining Specialist\nMs. Ma. Veronica Navales\nBranch Head\nMs. Aurora Mangalili\nAdvisory Board\n\nASA Philippines\nFoundation\nMs. Richel Imbing\nLoan Officer\nMs. Leonilyn Pabia\nLoan Officer\nMr. Anjer Juraini\nRegional Monitor\nMr. Alfonso Ramil Bolante\nTeam Leader\nMr. Ricky Egay\nTeam Leader\nMr. Nilo Cellon Jr.\nTeam Leader\nMr. Joemar Aligato\nBranch Manager\nMs. Ariane Longgakit\nBranch Manager\nMs. Faida Abing\nBranch Manager\nMs. Ma.Regina Pacifico\nSam-HRD\nMs. Argie Caguil\nBranch Manager\n\nSimbag sa Pag Asenso Inc.\n(SEDP Inc.)\nMs. Grace Corteza\nHR Coordinator\nMs. Fe Bataller\nProgram Officer Trainee\n\nCenter for Community\nTransformation (CCT)\nMs. Jackie Atanacio\nBranch Manager\nMr. Renato de Jesu