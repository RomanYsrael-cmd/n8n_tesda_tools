e record-keeping\n2. Underpinning \nknowledge and \nattitude \n2.1 Record-keeping concepts and principles  \n2.2 Record-keeping procedures and practices in \naccordance with the MFIs methodology \n2.3 Confidentiality and security of records \n2.4 Filing system \n2.5 Knowledge in analyzing transactions \n2.6 Knowledge of fundamental mathematical \noperations \n2.7 Knowledge of basic statistics \n2.8 Familiarity with record-keeping processes \n2.9 Attitude: quality /cost consciousness, honesty, \nfriendliness/firmness/fairness, consistency, team \nplayer, prudence, keen for details\n3. Underpinning skills \n3.1 Ability to read and understand record-keeping \nterminologies and instructions \n3.2 Ability to identify account titles for every \ntransaction \n3.3 Performing record-keeping in accordance with the \norganization’s rules and regulations  \n3.4\nReading and understanding  work instructions\n4. Resource \nimplications \nThe following resources MUST be provided: \n4.1 Working table  \n4.2 Basic record-keeping Forms/documents \n4.3 Calculators \n4.4 Computer and printer \n4.5\nSupplies and materials\n5. Method of \nassessment \nCompetency may be assessed through: \n5.1 Demonstration with questioning \n5.2 Direct observation with questioning \n5.3 Portfolio \n5.4\nWritten test\n6. Context for \nassessment\n6.1  Competency may be assessed in the workplace or \nin a simulated workplace environment\n",
