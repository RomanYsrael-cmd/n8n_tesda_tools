        "evidence_guide": {
          "source_text": "1. Critical aspects of\ncompetency\nAssessment requires evidence that candidate:\n1.1 Demonstrated on time processing of loan\napplication\n1.2 Demonstrated compliance with MFIs loan\nstandards and procedures\n1.3 Demonstrated the ability to evaluate/assess credit-\nworthiness\n1.4 Handled forms and materials with utmost care to\navoid wastage\n2. Underpinning\nknowledge and\nattitude\n2.1 Knowledge of Microfinance product, services and\nprograms\n2.2 Loan processing procedures\n2.3 Character/Credit Investigation and Background\nInvestigation (CCI/BI) procedures\n2.4 Loan evaluation/monitoring process\n2.5 Loan recommendation and approval process\n2.6 Standard forms, supplies and materials\n2.7 Basic mathematics related to loan assessment\n2.8 Segregation and filing of loan documents\n2.9 Client/customer service\n2.10 Attitude: quality /cost consciousness, honesty,\nfriendliness/firmness/fairness, consistency, team\nplayer, prudence, keen for details\n3. Underpinning skills\n3.1 Ability to read and understand verbal and non-\nverbal instructions\n3.2 Conducting CCI/BI\n3.3 Evaluating/monitoring client’s loan\n3.4 Numeracy/computational skills\n3.5 Interpersonal skills\n3.6 Group facilitation skills\n3.7\nUse and analyze loan document\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Standard forms for different loan programs\n4.2 Checklist of requirements\n4.3\nMFI loan protocol/procedures\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1 Demonstration with questioning\n5.2 Direct observation with questioning\n5.3 Portfolio\n5.4\nWritten test\n6.\nContext for\nassessment\n6.1 Competency may be assessed in the workplace or\nin a simulated workplace environment\n\n--- PDF PAGE 49 ---\nTR -Microfinance Technology NC II\n\n44\nUNIT OF COMPETENCY\n: COLLECT DUES\nUNIT CODE\n\n:"
