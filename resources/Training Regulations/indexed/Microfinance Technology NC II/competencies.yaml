        "source_title": "SELECT POTENTIAL AREA FOR MICROFINANCE OPERATION",
        "source_text": "--- PDF PAGE 29 ---\nTR -Microfinance Technology NC II \n                                                                                                           \n \n \n24\nCORE COMPETENCY \nUNIT OF COMPETENCY \n: \nSELECT POTENTIAL AREA FOR  \n \n  \n \nMICROFINANCE OPERATION \n \nUNIT CODE \n  \n \n:   \nHCS341301 \n \nUNIT DESCRIPTOR                    : \nThis unit covers the knowledge, skill and \nattitudes \nrequired \nin \nconducting \narea \nscanning/mapping, surveying and interviewing.  \n \nELEMENT \nPERFORMANCE CRITERIA \nSelect Potential Area for Microfinance Operation is performed using \nthe appropriate materials, work processes, tools, equipment, \nquality assurance and occupational health and safety (OH&S) \nrequirements\n1. Conduct area \nscanning/mapping \n1.1 Area’s socio-economic profile gathered from \nconcerned government agencies  \n1.2\nOcular visit of target area/s conducted\n2. Coordinate with \nconcerned \ngovernment office   \n2.1 Courtesy call with concerned government official/s \nconducted \n2.2 Marketing/promotional materials and documents \ngiven to concerned government official/s \n2.3 MFI program orientation to Barangay Council \ndelivered/presented\n3. Review barangay \nprofile \n3.1 Barangay profile reviewed  \n3.2 Documents from area scanning/mapping confirmed \nthrough area survey and from concerned Barangay \nofficials for updated information\n4. Conduct area survey \n4.1 MFI survey forms/instruments and materials are \nutilized \n4.2 Respondents from potential areas identified based on \nbarangay profile and MFI operational manual \n4.3 Area risks, distance travel and fare identified in \naccordance with prevailing conditions \n4.4 Survey of target area/s conducted in accordance with \nestablished survey guidelines and procedures\n5. Conduct interviews \n5.1 Questionnaires secured \n5.2 Respondent visited at place of business \n5.3 Interview conducted in accordance with MFI \ninterview guidelines and procedures\n6. Process survey and \ninterview data \n6.1 Survey and interview data collated \n6.2 Survey and interview report prepared \n6.3 Survey and interview report submitted to immediate \nsuperior\n\n--- PDF PAGE 30 ---\nTR -Microfinance Technology NC II \n                                                                                                           \n \n \n25\nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Materials to be used  Materials may include but are not limited to: \n1.1 Map \n1.2 \nArea profile \n1.3 \nSurvey instrument and interview guide \n1.4 \nFare matrix \n1.5 \nCourtesy letter \n1.6 \nCompany Identification \n1.7\nPaper\n2. Work processes  \n2.1 Report preparation \n2.2 Survey and Interview process \n2.3\nComputer application\n3. Tools and equipment 3.1 Motorcycle  \n3.2 Computer and printer \n3.3 Permanent markers \n3.4 Ball pen \n3.5\nPencil w/ eraser\n4. Quality Assurance \nrequirements  \n4.1 Survey and interview procedures \n4.2 Concerned government office protocol \n4.3\nMFI operation manual\n5. Occupational Health \nand Safety (OHS) \nrequirements \n5.1 Traffic and road safety \n5.2 Acquisition/renewal of driver’s license \n5.3 Regulations on environmental protection \n5.4\nStress and time management\n6. Personal protective \nequipment may \ninclude \n6.1 PPE for use of motorcycle (e.g., helmet, elbow, knee & \nlegs protector)  \n6.2 Safety protective devices (e.g. raincoats, umbrella, \nboots and the likes)\n\n--- PDF PAGE 31 ---\nTR -Microfinance Technology NC II \n                                                                                                           \n \n \n26\nEVIDENCE GUIDE \n \n1. Critical aspects of \ncompetency \nAssessment requires evidence that candidate: \n1.1 Demonstrated ability to conduct survey and interview  \n1.2 Read and interpreted map and road signs  \n1.3 Demonstrated compliance with regulations applicable \nin the area \n1.4 Demonstrated ability to communicate in oral and in \nwritten forms \n1.5 Demonstrated ability to process survey and interview \ndata\n2. Underpinning \nknowledge and \nattitude \n2.1 Area scanning/mapping(sense of direction) \n2.2 Survey and interview procedures \n2.3 Basic Statistics for survey interview and works \n2.4 Survey report writing \n2.5 Safety practices and guidelines in doing fieldwork \n2.6 Effective oral and written communication \n2.7 Knowledge in computer operation \n2.8 Familiarity of the area \n2.9 Knowledge in map reading   \n2.10 Knowledge of the Barangay ordinances \n2.11 Knowledge of tools and equipment safety precautions \n2.12 Knowledge of traffic rules and regulations  \n2.13 Attitude: commitment/dedication, love of work, \ncompetence, courteous, honesty, sincerity, sensitivity \nto others, sense of responsibility, caring \nattitude/compassion, and  charity\n3. Underpinning skills \n3.1 Observing environmental safety \n3.2 Practicing work ethics and habits \n3.3 Reading and understanding work instructions \n3.4 Conducting surveys and interviews  \n3.5 Oral and written communication skills \n3.6 Skills in networking with the different \noffices/organizations and people  \n3.7 Applying proper procedures in conducting field survey \nand interview \n3.8 Preparing survey and interview reports \n3.9\nProcessing survey and interview data\n4. Resource \nimplications \nThe following resources MUST be provided: \n4.1 Mode of transportation \n4.2 Endorsement letter from MFI \n4.3 Survey instruments and interview guides \n4.4 Area Maps \n4.5 Barangay profile \n4.6 Computer set with appropriate application software \nand printer \n4.7 Company ID \n4.8\nPersonal Protective Equipment (PPE)\n\n--- PDF PAGE 32 ---\nTR -Microfinance Technology NC II \n                                                                                                           \n \n \n27\n5. Method of \nassessment \nCompetency may be assessed through: \n5.1 Demonstration with oral questioning \n5.2 Direct observation with oral questioning \n5.3 Portfolio \n5.4\nWritten test\n6. Context for \nassessment\n6.1  Competency may be assessed in the workplace or in a \nsimulated workplace environment\n",
