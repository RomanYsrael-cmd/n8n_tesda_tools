  "source_section_text": "SECTION 2 COMPETENCY STANDARDS\n\nThis section gives the details of the contents of the basic, common and core units\nof competency required in MICROFINANCE TECHNOLOGY NC II.\n\nBASIC COMPETENCIES\n\nUNIT OF COMPETENCY :\nPARTICIPATE IN WORKPLACE COMMUNICATION\nUNIT CODE\n:\n500311105\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes\nrequired to gather, interpret and convey information in\nresponse to workplace requirements.\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Obtain and convey\nworkplace\ninformation\n1.1\nSpecific and relevant information is accessed from\nappropriate sources\n1.2\nEffective questioning , active listening and speaking\nskills are used to gather and convey information\n1.3\nAppropriate medium is used to transfer information and\nideas\n1.4\nAppropriate non- verbal communication is used\n1.5\nAppropriate lines of communication with supervisors\nand colleagues are identified and followed\n1.6\nDefined workplace procedures for the location and\nstorage of information are used\n1.7\nPersonal interaction is carried out clearly and concisely\n2. Participate in\nworkplace meetings\nand discussions\n2.1\nTeam meetings are attended on time\n2.2\nOwn opinions are clearly expressed and those of others\nare listened to without interruption\n2.3\nMeeting inputs are consistent with the meeting purpose\nand established protocols\n2.4\nWorkplace interactions are conducted in a courteous\nmanner\n2.5\nQuestions about simple routine workplace procedures\nand matters concerning working conditions of\nemployment are tasked and responded to\n2.6\nMeetings outcomes are interpreted and implemented\n3. Complete relevant\nwork related\ndocuments\n3.1\nRange of forms relating to conditions of employment\nare completed accurately and legibly\n3.2\nWorkplace data are recorded on standard workplace\nforms and documents\n3.3\nBasic mathematical processes are used for routine\ncalculations\n3.4\nErrors in recording information on forms/ documents are\nidentified and properly acted upon\n3.5\nReporting requirements to supervisor are completed\naccording to organizational guidelines\n\n--- PDF PAGE 8 ---\nTR -Microfinance Technology NC II\n\n3\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Appropriate sources\n1.1\nTeam members\n1.2\nSuppliers\n1.3\nTrade personnel\n1.4\nLocal government\n1.5\nIndustry bodies\n2. Medium\n2.1\nMemorandum\n2.2\nCircular\n2.3\nNotice\n2.4\nInformation discussion\n2.5\nFollow-up or verbal instructions\n2.6\nFace to face communication\n3. Storage\n3.1\nManual filing system\n3.2\nComputer-based filing system\n4. Forms\n4.1\nPersonnel forms, telephone message forms, safety\nreports\n5. Workplace\ninteractions\n5.1\nFace-to-face interactions\n5.2\nTelephone conversation\n5.3\nElectronic and two-way radio communication\n5.4\nWritten communication including electronic mail,\nmemos, instruction and forms\n5.5\nNon-verbal communication including gestures,\nsignals, signs and diagrams\n6. Protocols\n6.1\nObserving meeting\n6.2\nCompliance with meeting decisions\n6.3\nObeying meeting instructions\n\n--- PDF PAGE 9 ---\nTR -Microfinance Technology NC II\n\n4\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nPrepared written communication following standard\nformat of the organization\n1.2\nAccessed information using communication\nequipment\n1.3\nMade use of relevant terms as an aid to transfer\ninformation effectively\n1.4\nConveyed information effectively adopting the\nformal or informal communication\n2. Underpinning\nknowledge\n\n2.1\nEffective communication\n2.2\nDifferent modes of communication\n2.3\nWritten communication\n2.4\nOrganizational policies\n2.5\nCommunication procedures and systems\n2.6\nTechnology relevant to the enterprise and the\nindividual’s work responsibilities\n3. Underpinning skills\n3.1\nFollow simple spoken language\n3.2\nPerform routine workplace duties following simple\nwritten notices\n3.3\nParticipate in workplace meetings and discussions\n3.4\nComplete work related documents\n3.5\nEstimate, calculate and record routine workplace\nmeasures\n3.6\nBasic mathematical processes of addition,\nsubtraction, division and multiplication\n3.7\nAbility to relate to people of social range in the\nworkplace\n3.8\nGather and provide information in response to\nworkplace requirements\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nFax machine\n4.2\nTelephone\n4.3\nWriting materials\n4.4\nInternet\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1\nDirect Observation\n5.2\nOral interview\n5.3\nWritten examination\n6. Context of\nassessment\n6.1\nCompetency may be assessed individually in the\nactual workplace or through accredited institution\n\n--- PDF PAGE 10 ---\nTR -Microfinance Technology NC II\n\n5\nUNIT OF COMPETENCY :\nWORK IN A TEAM ENVIRONMENT\nUNIT CODE\n:\n\n500311106\nUNIT DESCRIPTOR\n:\n\nThis unit covers the skills, knowledge and attitudes to\n\nidentify role and responsibility as a member of a team.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Describe team’s role\nand scope\n1.1\nThe role and objective of the team is identified\nfrom available sources of information\n1.2\nTeam parameters, reporting relationships and\nresponsibilities are identified from team discussions\nand appropriate external sources\n2. Identify own role and\nresponsibility within\nthe team\n2.1\nIndividual role and responsibilities within the team\nenvironment are identified\n2.2\nRoles and responsibility of other team members are\nidentified and recognized\n2.3\nReporting relationships within team and external to\nteam are identified\n3. Work as a team\nmember\n3.1\nEffective and appropriate forms of communications\nused and interactions undertaken with team\nmembers who contribute to known team activities\nand objectives\n3.2\nEffective and appropriate contributions made to\ncomplement team activities and objectives, based\non individual skills and competencies and\nworkplace context\n3.3\nObserved protocols in reporting using standard\noperating procedures\n3.4\nContribute to the development of team work plans\nbased on an understanding of team’s role and\nobjectives and individual competencies of the\nmembers.\n\n--- PDF PAGE 11 ---\nTR -Microfinance Technology NC II\n\n6\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Role and objective of\nteam\n1.1\nWork activities in a team environment with\nenterprise or specific sector\n1.2\nLimited discretion, initiative and judgement may be\ndemonstrated on the job, either individually or in a\nteam environment\n2. Sources of\ninformation\n2.1\nStandard operating and/or other workplace\nprocedures\n2.2\nJob procedures\n2.3\nMachine/equipment manufacturer’s specifications\nand instructions\n2.4\nOrganizational or external personnel\n2.5\nClient/supplier instructions\n2.6\nQuality standards\n2.7\nOccupational health and safety (OHS) and\nenvironmental standards\n3. Workplace context\n3.1\nWork procedures and practices\n3.2\nConditions of work environments\n3.3\nLegislation and industrial agreements\n3.4\nStandard work practice including the storage, safe\nhandling and disposal of chemicals\n3.5\nSafety, environmental, housekeeping and quality\nguidelines\n\n--- PDF PAGE 12 ---\nTR -Microfinance Technology NC II\n\n7\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nOperated in a team to complete workplace activity\n1.2\nWorked effectively with others\n1.3\nConveyed information in written or oral form\n1.4\nSelected and used appropriate workplace language\n1.5\nFollowed designated work plan for the job\n1.6\nReported outcomes\n2. Underpinning\nknowledge\n2.1\nCommunication process\n2.2\nTeam structure\n2.3\nTeam roles\n2.4\nGroup planning and decision making\n3. Underpinning skills\n3.1\nCommunicate appropriately, consistent with the\nculture of the workplace\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nAccess to relevant workplace or appropriately\nsimulated environment where assessment can take\nplace\n4.2. Materials relevant to the proposed activity or tasks\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1\nObservation of the individual member in relation to\nthe work activities of the group\n5.2\nObservation of simulation and or role play involving\nthe participation of individual member to the\nattainment of organizational goal\n5.3\nCase studies and scenarios as a basis for\ndiscussion of issues and strategies in teamwork\n6. Context of\nassessment\n6.1\nCompetency may be assessed in workplace or in a\nsimulated workplace setting\n6.2\nAssessment shall be observed while task are being\nundertaken whether individually or in group\n\n--- PDF PAGE 13 ---\nTR -Microfinance Technology NC II\n\n8\nUNIT OF COMPETENCY :\nPRACTICE CAREER PROFESSIONALISM\nUNIT CODE\n:\n500311107\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes in\npromoting career growth and advancement.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Integrate personal\nobjectives with\norganizational goals\n1.1\nPersonal growth and work plans are pursued\ntowards improving the qualifications set for the\nprofession\n1.2\nIntra and interpersonal relationships is are\nmaintained in the course of managing oneself\nbased on performance evaluation\n1.3\nCommitment to the organization and its goal is\ndemonstrated in the performance of duties\n2. Set and meet work\npriorities\n2.1\nCompeting demands are prioritized to achieve\npersonal, team and organizational goals and\nobjectives.\n2.2\nResources are utilized efficiently and effectively to\nmanage work priorities and commitments\n2.3\nPractices along economic use and maintenance of\nequipment and facilities are followed as per\nestablished procedures\n3. Maintain professional\ngrowth and\ndevelopment\n3.1\nTrainings and career opportunities are identified\nand availed of based on job requirements\n3.2\nRecognitions are sought/received and\ndemonstrated as proof of career advancement\n3.3\nLicenses and/or certifications relevant to job and\ncareer are obtained and renewed\n\n--- PDF PAGE 14 ---\nTR -Microfinance Technology NC II\n\n9\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Evaluation\n1.1\nPerformance appraisal\n1.2\nPsychological profile\n1.3 Aptitude tests\n2. Resources\n2.1\nHuman\n2.2\nFinancial\n2.3\nTechnology\n2.3.1 Hardware\n2.3.2 Software\n3. Trainings and career\nopportunities\n3.1\nParticipation in training programs\n3.1.1 Technical\n3.1.2 Supervisory\n3.1.3 Managerial\n3.1.4 Continuing education\n3.2\nServing as resource persons in conferences and\nworkshops\n4. Recognitions\n4.1\nRecommendations\n4.2\nCitations\n4.3\nCertificate of appreciations\n4.4\nCommendations\n4.5\nAwards\n4.6\nTangible and intangible rewards\n5. Licenses and/or\ncertifications\n5.1\nNational certificates\n5.2\nCertificate of competency\n5.3\nSupport level licenses\n5.4\nProfessional licenses\n\n--- PDF PAGE 15 ---\nTR -Microfinance Technology NC II\n\n10\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\nAttained job targets within key result areas (KRAs)\nMaintained intra and interpersonal relationship in the\ncourse of managing oneself based on performance\nevaluation\nCompleted trainings and career opportunities which are\nbased on the requirements of the industries\nAcquired and maintained licenses and/or certifications\naccording to the requirement of the qualification\n2. Underpinning\nknowledge and\nattitude\n2.1\nWork values and ethics (code of conduct, code of\nethics, etc.)\n2.2\nCompany policies\n2.3\nCompany operations, procedures and standards\n2.4\nFundamental rights at work including gender\nsensitivity\n2.5\nPersonal hygiene practices\n3. Underpinning skills\n3.1\nAppropriate practice of personal hygiene\n3.2\nIntra and Interpersonal skills\n3.3\nCommunication skills\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nWorkplace or assessment location\n4.2\nCase studies/scenarios\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1\nPortfolio assessment\n5.2\nInterview\n5.3\nSimulation/role-plays\n5.4\nObservation\n5.5\nThird party reports\n5.6\nExams and tests\n6. Context of\nassessment\n6.1\nCompetency may be assessed in the work place or\nin a simulated work place setting\n\n--- PDF PAGE 16 ---\nTR -Microfinance Technology NC II\n\n11\nUNIT OF COMPETENCY :\nPRACTICE OCCUPATIONAL HEALTH AND SAFETY\nPROCEDURES\nUNIT CODE\n:\n 500311108\nUNIT DESCRIPTOR\n:\nThis unit covers the outcomes required to comply with\nregulatory\nand\norganizational\nrequirements\nfor\noccupational health and safety.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Identify hazards and\nrisks\n1.1\nSafety regulations and workplace safety and\nhazard control practices and procedures are\nclarified and explained based on organization\nprocedures\n1.2\nHazards/risks in the workplace and their\ncorresponding indicators are identified to minimize\nor eliminate risk to co-workers, workplace and\nenvironment in accordance with organization\nprocedures\n1.3\nContingency measures during workplace\naccidents, fire and other emergencies are\nrecognized and established in accordance with\norganization procedures\n2. Evaluate hazards and\nrisks\n2.1 Terms of maximum tolerable limits which when\nexceeded will result in harm or damage are\nidentified based on threshold limit values (TLV)\n2.2 Effects of the hazards are determined\n2.3 OHS issues and/or concerns and identified safety\nhazards are reported to designated personnel in\naccordance with workplace requirements and\nrelevant workplace OHS legislation\n3. Control hazards and\nrisks\n3.1 Occupational health and safety (OHS) procedures\nfor controlling hazards/risks in workplace are\nconsistently followed\n3.2 Procedures for dealing with workplace accidents,\nfire and emergencies are followed in accordance\nwith organization OHS policies\n3.3 Personal protective equipment (PPE) is correctly\nused in accordance with organization OHS\nprocedures and practices\n3.4 Appropriate assistance is provided in the event of a\nworkplace emergency in accordance with\nestablished organization protocol\n4. Maintain Occupational\nHealth and Safety\n(OHS) awareness\n4.1 Emergency-related drills and trainings are\nparticipated in as per established organization\nguidelines and procedures\n4.2 OHS personal records are completed and updated\nin accordance with workplace requirements\n\n--- PDF PAGE 17 ---\nTR -Microfinance Technology NC II\n\n12\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Safety regulations\nMay include but are not limited to:\n1.1\nClean air act\n1.2\nBuilding code\n1.3\nNational electrical and fire safety codes\n1.4\nWaste management statutes and rules\n1.5\nPhilippine occupational safety and health standards\n1.6\nDOLE regulations on safety legal requirements\n1.7\nECC regulations\n2. Hazards/Risks\nMay include but are not limited to:\n2.1\nPhysical hazards – impact, illumination, pressure,\nnoise, vibration, temperature, radiation\n2.2\nBiological hazards- bacteria, viruses, plants, parasites,\nmites, molds, fungi, insects\n2.3\nChemical hazards – dusts, fibers, mists, fumes,\nsmoke, gasses, vapors\n2.4\nErgonomics\n• Psychological factors – over exertion/ excessive\nforce, awkward/static positions, fatigue, direct\npressure, varying metabolic cycles\n• Physiological factors – monotony, personal\nrelationship, work out cycle\n3. Contingency\nmeasures\nMay include but are not limited to:\n3.1\nEvacuation\n3.2\nIsolation\n3.3\nDecontamination\n3.4\nCalling designated emergency personnel\n4. PPE\nMay include but are not limited to:\n4.1\nMask\n4.2\nGloves\n4.3\nGoggles\n4.4\nHair Net/cap/bonnet\n4.5\nFace mask/shield\n4.6\nEar muffs\n4.7\nApron/gown/coverall/jump suit\n4.8\nAnti-static suits\n5. Emergency-related\ndrills and training\n5.1\nFire drill\n5.2\nEarthquake drill\n5.3\nBasic life support/cardiopulmonary resuscitation (CPR)\n5.4\nFirst aid\n5.5\nSpillage control\n5.6\nDecontamination of chemical and toxic\n5.7\nDisaster preparedness/management\n6. OHS personal\nrecords\n6.1\nMedical/health records\n6.2\nIncident reports\n6.3\nAccident reports\n6.4\nOHS-related training completed\n\n--- PDF PAGE 18 ---\nTR -Microfinance Technology NC II\n\n13\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nExplained clearly established workplace safety and\nhazard control practices and procedures\n1.2\nIdentified hazards/risks in the workplace and its\ncorresponding indicators in accordance with\ncompany procedures\n1.3\nRecognized contingency measures during\nworkplace accidents, fire and other emergencies\n1.4\nIdentified terms of maximum tolerable limits based\non threshold limit value (TLV)\n1.5\nFollowed Occupational Health and Safety (OHS)\nprocedures for controlling hazards/risks in\nworkplace\n1.6\nUsed Personal Protective Equipment (PPE) in\naccordance with company OHS procedures and\npractices\n1.7\nCompleted and updated OHS personal records in\naccordance with workplace requirements\n2. Underpinning\nknowledge and\nattitude\n2.1\nOHS procedures and practices and regulations\n2.2\nPPE types and uses\n2.3\nPersonal hygiene practices\n2.4\nHazards/risks identification and control\n2.5\nThreshold limit value (TLV)\n2.6\nOHS indicators\n2.7\nOrganization safety and health protocol\n2.8\nSafety consciousness\n2.9\nHealth consciousness\n3. Underpinning skills\n3.1\nPractice of personal hygiene\n3.2\nHazards/risks identification and control skills\n3.3\nInterpersonal skills\n3.4\nCommunication skills\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nWorkplace or assessment location\n4.2\nOHS personal records\n4.3\nPPE\n4.4\nHealth records\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1\nPortfolio assessment\n5.2\nInterview\n5.3\nCase study/situation\n6. Context of\nassessment\n6.1\nCompetency may be assessed in the work place or\nin a simulated work place setting\n\n--- PDF PAGE 19 ---\nTR -Microfinance Technology NC II\n\n14\nCOMMON COMPETENCY\n\nUNIT OF COMPETENCY :\nPROVIDE QUALITY CUSTOMER SERVICE\nUNIT CODE\n\n : HCS421201\nUNIT DESCRIPTOR :\nThis unit covers the knowledge, skill and\nattitudes required to provide effective and\nefficient\nservices\nto\nthe\nclients\nof\nthe\nmicrofinance industry.\n\nELEMENT\nPERFORMANCE CRITERIA\n1. Update knowledge\nof products and\nservices\n1.1 Products and/or services to be marketed are\nidentified, familiarized with and fully understood\n1.2 Information on programs is accessed\n1.3 Knowledge on products, services and programs\nare updated\n1.4 Additional information on products, services and\nprograms are prepared\n2. Assess needs of\nnew and existing\nclients\nActive listening is used to gather information from\nclients\nOrientation on products/services, program and policies\nare conducted\nIdentified related or applicable needs of clients based\non the products/services and program being\noffered\nProvided clients with courteous and professional\ntreatment throughout the interaction using\ninteractive communication\nInquiries, concerns and comments are responded to\npromptly and accurately in accordance with\norganization’s policies\nRecorded all the gathered information given by the\nclients\n3. Conduct client\nsatisfaction survey\nClient satisfaction survey is administered\nSurvey results are collated and analyzed\nPositive and negative results are defined\nNegative feedbacks are well addressed immediately\nthrough appropriate communication strategies\n\nRANGE OF VARIABLES\n\n--- PDF PAGE 20 ---\nTR -Microfinance Technology NC II\n\n15\nVARIABLE\nRANGE\n1. Product/services and\nprograms\nIncludes the following but are not limited to:\n1.1 Financial services\n1.2\nNon-financial services\n2.\nClients\n2.1\nEntrepreneurial poor\n3. Needs\n3.1 Designing clients satisfaction survey instruments\n3.2 Procedure in administering clients satisfaction\nsurvey\n3.3 Processing clients satisfaction survey data\n3.4 Product/service knowledge\n3.5\nKnowledge of programs\n4. Interactive\ncommunication\n4.1 Information is gathered in a courteous and\nprofessional manner\n4.2 Probing skills\n4.3 Skills in effective questioning\n4.4 Consistent service quality for all types of\ncustomers\n4.5 Avoiding controversial issues like politics and\nreligion\n5. Communication\nstrategies\n5.1 One-on-one interaction\n5.2 Group meetings\n\nEVIDENCE GUIDE\n\n--- PDF PAGE 21 ---\nTR -Microfinance Technology NC II\n\n16\n1. Critical aspects\nof competency\nAssessment requires evidence that the candidate:\n1.1 Received, assessed and responded to client needs\n1.2 Applied organizational quality procedures and processes\nin providing quality service\n2. Underpinning\nknowledge and\nattitude\n2.1 Understanding client’s nature, motivation, expectations\nand needs\n2.2 Knowledge of how to determine client needs and\nexpectations related to the product/services and programs\n2.3 Knowledge of appropriate marketing and promotional\nstrategies\n2.4 Knowledge of designing, administering and processing\nclients’ satisfaction survey\n2.5 Knowledge of confidentiality and company standards for\nobtaining, using and protecting information obtained from\nclients\n2.6 Knowledge of company standards on how to interact with\nclients\n2.7 Knowledge of organization’s vision, mission and values\n2.8 Commitment/dedication, love of work, competence,\ncourteous, honesty, sincerity, sensitivity to others, sense of\nresponsibility, caring attitude/compassion, and charity\n3. Underpinning\nskills\n3.1 Effective oral communication skills\n3.2 Listening skills\n3.3 Motivational skills\n3.4 Interpersonal skills\n3.5 Presentation skills\n3.6 Skill in demonstrating cost/benefits/value to clients based\non client’s expectations and needs\n3.7 Skill in generating several alternative solutions that will\nmeet customer’s needs\n3.8 Data gathering skills\n3.9\nComputer literacy\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Meeting venue/s\n4.2 Equipment and furnishings appropriate to a microfinance\nset-up\n4.3 Complete information on products, services and programs\n4.4 Products, services and programs brochures\n4.5\nOrganization’s standard forms for clients\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1 Oral questioning\n5.2 Written test\n5.3\nPractical demonstration\n6. Context for\nassessment\n6.1 Competency may be assessed in the workplace or in a\nsimulated workplace environment\nUNIT OF COMPETENCY : COMPLY WITH QUALITY AND ETHICAL STANDARDS\n\n--- PDF PAGE 22 ---\nTR -Microfinance Technology NC II\n\n17\nUNIT CODE\n: HCS315202\n\nUNIT DESCRIPTOR\n:\n This unit covers the knowledge, skills and attitudes\nneeded to apply quality and ethical standards in the\nworkplace. The unit also includes the application of\nrelevant safety procedures and regulations, organization\nprocedures, client and industry requirements.\n\nELEMENT\nPERFORMANCE CRITERIA\n1. Assess quality\nof received\nmaterials\n1.1 Work instruction is obtained and carried out in accordance\nwith standard operating procedures\n1.2 Received materials are checked against workplace\nstandards and specifications\n1.3 Defective materials are identified, reported and isolated\n1.4 Defective materials are repaired/replaced in accordance\nwith workplace procedures\n1.5 Defects and any identified causes are recorded and/or\nreported to the concerned personnel in accordance with\nworkplace procedures\n2. Assess own\nwork/output\n2.1 Documentation relative to quality within the company is\nidentified and used\n2.2 Completed work is checked against workplace standards\n2.3 Defects are identified and corrected in accordance with the\ncompany quality standards\n3. Submit oneself\nto third party\nassessment\n3.1 Information on the quality and other indicators of\nperformance are recorded in accordance with workplace\nprocedures\n3.2 In cases of deviations from specific quality standards,\ncauses are documented and reported in accordance with\nthe workplace’s standards operating procedures\n3.3 In cases of objections/disagreements, reasons are\nexpressed thru written documentation\n3.4\nSettlements are sought in accordance with company policies\n4. Engage in\nquality\nimprovement\n4.1 Process improvement procedures are participated in relative\nto workplace assignment\n4.2 Work is carried out in accordance with process improvement\nprocedures\n4.3 Services are delivered in accordance with ethical standards\n4.4 Quality service is monitored to ensure client satisfaction\n4.5 Client’s needs are assessed through conduct of researches,\nfocus group discussions, and satisfaction surveys/interviews\n4.6 Trainings, orientations, and exposures are rendered to\nensure their understanding/ familiarization on products,\nservices and programs\n\n--- PDF PAGE 23 ---\nTR -Microfinance Technology NC II\n\n18\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Materials\nMaterials may include but are not limited to:\n1.1 Manuals, brochures, flyers, flipcharts, signages and\ntarpaulin\n1.2 Work orders\n1.3 Standard forms\n1.4 Recorded voice files/audio video presentations\n1.5 PowerPoint presentation materials\n1.6 Documentations\n1.7 Software\n1.8 Hardware\n1.9 Office supplies\n1.10 Office equipment\n1.11 Holy Scriptures\n2. Defects/Irregularities\nDefects may include but are not limited to:\n2.1 Deviation from the requirements of the client\n2.2 Deviation from the requirements and standard\noperating procedures of the organization/institution\n2.3 Manuals containing incorrect/outdated information\