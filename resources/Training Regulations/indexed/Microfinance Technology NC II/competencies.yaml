        "source_text": "--- PDF PAGE 41 ---\nTR -Microfinance Technology NC II \n                                                                                                           \n \n \n36\nUNIT OF COMPETENCY: \nFACILITATE CENTER MEETINGS \nUNIT CODE \n  \n         :    HCS341304 \nUNIT DESCRIPTOR                : \nThis unit covers the basic knowledge, skill and \nattitudes required in conducting and facilitating center \nmeetings, and performance of standard meeting flow. \n \nELEMENT \nPERFORMANCE CRITERIA \nFacilitate center meeting following appropriate communication processes \nand techniques, using supplies , materials /equipment and non-verbal \ncommunication aids while dealing with communication barriers\n1. Lead opening and \nclosing prayers\n1.1 \nOpening and closing prayers delivered in accordance with \nMicrofinance Institution (MFI) practices\n2. Present \nscheduled topic/s \n2.1 Meeting agenda prepared \n2.2 Meeting support materials distributed \n2.3\nTopics presented according to meeting agenda\n3. Facilitate group \ndiscussion \n3.1 Preparation for group discussion made \n3.2 Focus of group members attention maintained \n3.3\nGroup discussion well facilitated\n4. Check clients \nattendance \n4.1 Names of clients listed/counter checked \n4.2 Clients arrival logged \n4.3 Attendance logbook signed \n4.4\nClients attendance checked\n5. Facilitate \ncenter/cluster \nmeetings  \n5.1 Preparation for group meetings made \n5.2 Focus of group members attention in center/cluster  \nmeetings maintained \n5.3 Center/cluster meetings is facilitated following meeting \nprotocols\n6. Facilitate open \nforum  \n6.1 Preparation for open forum regarding clients issues and \nconcerns made \n6.2 Focus of group members attention in open forum \nmaintained \n6.3 Minor issues and concerns leveled-off/addressed \n6.4 Major issues and concerns noted \n6.5\nOpen forum is facilitated \n7. Counsel clients \non \npersonal/family \nproblem/s\n7.1 Clients’ problem inquired \n7.2 Clients’ problem understood and analyzed \n7.3 Appropriate advice/recommendation given \n7.4\nCounseled clients with personal/family problem/s \n8. Resolve conflict \namong clients \n8.1 Clients concern determined \n8.2 Conflict among clients identified \n8.3 Appropriate solution to conflict given \n8.4\nConflict among clients resolved\n\n--- PDF PAGE 42 ---\nTR -Microfinance Technology NC II \n                                                                                                           \n \n \n37\nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Communication \nprocess \n \n \n1.1 Effective communication skills \n1.2 Facilitation skills \n1.3 Counseling skills  \n1.4 Interaction among clients  \n1.5 Communication techniques (e.g. Good working \ncondition, Art of questioning and listening)\n2. Communication \nbarriers \n \n2.1 Workplace \n2.2 Facilities \n2.3 Dialects \n2.4\nUnexpected interruptions\n3. Non-verbal \ncommunication  \n \n3.1 Visual aid \n3.2 Facial expression \n3.3 Sign language \n3.4 Body language \n3.5\nClear calligraphy \n4. Meeting protocols \n \n4.1 Punctuality in starting and ending meetings \n4.2 Prepared agenda \n4.3 Adherence to standard MFI meeting \nprotocol/procedures\n5. Clients  \n \n5.1 Potential clients \n5.2 Existing clients (with loans) \n5.3 Resigned clients \n5.4 Returning/revive clients \n5.5\nResting clients/saver’s clients\n6. Supplies, materials \nand equipment \n \n6.1 Bible (optional) \n6.2 Calculator \n6.3 Logbook/class record \n6.4 Ball pen \n6.5 Manila paper \n6.6 Masking tape/board pins \n6.7 Markers \n6.8 Visual aids \n6.9 IDs \n6.10 Facilities\n\n--- PDF PAGE 43 ---\nTR -Microfinance Technology NC II \n                                                                                                           \n \n \n38\nEVIDENCE GUIDE \n \n1. Critical aspects of \ncompetency \nAssessment requires evidence that candidate has: \n1.1 Demonstrated correct use of words \n1.2 Maintained active participation of clients \n1.3 Communicated with others to ensure safe and \neffective workplace operation \n1.4\nCarried out procedures in handling meeting\n2. Underpinning \nknowledge and \nattitude \n2.1 Meeting agenda, schedule and workflow \n2.2 Focus Group Discussion (FGD) guidelines and \nprocedures \n2.3 Guidelines and procedures in conducting \ncenter/cluster meetings \n2.4 Guidelines and procedures in facilitating open \nforum \n2.5 Counseling procedures and techniques \n2.6 Standard forms, supplies and materials used in \ncenter meeting   \n2.7 Equipment usage and care \n2.8 Attitude: commitment/dedication, love of work, \ncompetence, courteous, honesty, sincerity, \nsensitivity to others, sense of responsibility, caring \nattitude/compassion, and  charity\n3. Underpinning skills \n3.1 Mastery of the meeting topic \n3.2 Ability to read and understand verbal and non-\nverbal instructions \n3.3 Apply procedures and techniques in conducting \ncenter/cluster meetings, FGD and open forum \n3.4 Good facilitation skills \n3.5 Effective use of presentation materials \n3.6 Effective presentation skills \n3.7 Effective counseling skills \n3.8\nProper use of equipment\n4. Resource \nimplications \nThe following resources MUST be provided: \n4.1 Actual or simulated workplace condition  \n4.2 Forms, Tools and equipment suitable for field work \nat various centers \n4.3 Visual aids/presentation materials appropriate for \nthe center/cluster meetings \n5. Method of \nassessment \nCompetency may be assessed through: \n5.1 Demonstration with questioning \n5.2 Direct observation with questioning \n5.3 Portfolio \n5.4\nWritten test\n6. Context for \nassessment\n6.1  Competency may be assessed in the workplace or \nin a simulated workplace environment\n",
