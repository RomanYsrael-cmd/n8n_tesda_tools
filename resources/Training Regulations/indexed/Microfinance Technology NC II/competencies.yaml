        "source_title": "PERFORM COMPUTER OPERATIONS",
        "source_text": "--- PDF PAGE 26 ---\nTR -Microfinance Technology NC II \n                                                                                                           \n \n \n21\nUNIT OF COMPETENCY: \nPERFORM COMPUTER OPERATIONS \nUNIT CODE  \n \n \n    :     HCS311201 \nUNIT DESCRIPTOR \n               : \nThis unit covers the knowledge, skills and \nattitudes needed to perform computer operations \nwhich include encoding, accessing, decoding, \ntransferring and storing data and information \nusing the appropriate hardware and software. \n \nELEMENT\nPERFORMANCE CRITERIA\n1. Plan and prepare for \nassigned task \n1.1 Tasks are determined according to required output \n1.2 Appropriate hardware and software are selected \n1.3 OHS standards are complied with \n1.4 Appropriate guidelines and procedures are identified \n1.5\nRequired data security guidelines are determined\n2. Encode data \n2.1 Accuracy of data/information is validated \n2.2 Data are encoded using appropriate application \n2.3 Information is saved in storage devices according to \nrequirements \n2.4\nWork is performed within OHS guidelines\n3. Access information \n \n \n3.1 Appropriate application is selected based on job \nrequirements \n3.2 Proper use of navigation keys and icons is observed \n3.3 Proper use of computer and other peripherals is \nobserved\n4. Produce data \n4.1 Processed data using appropriate applications by \nauthorized personnel \n4.2 Data are printed according to standard operating \nprocedures \n4.3 Data are analyzed  \n4.4 Files and data are transferred according to standard \noperating procedures \n4.5\nFiles and data are securely stored\n5. Use the internet to \naccess information \n5.1 Required information is identified \n5.2 Appropriate browser and search engine are used in \naccordance with the organization’s standards and \nprocedures \n5.3\nRelevant links are utilized to access information\n6. Maintain computer \nequipment and \nsystems \n6.1 Procedures for system security such as virus check, \ndata back-up, and system defragmentation are \nimplemented  \n6.2 Appropriate basic equipment maintenance procedures \nand MIS requirements are implemented\n\n--- PDF PAGE 27 ---\nTR -Microfinance Technology NC II \n                                                                                                           \n \n \n22\nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \nHardware and peripheral \ndevices \nHardware includes the following but are not limited to: \n1.1 Computer set-up  \n1.2 Network systems \n1.3 Communication equipment \n1.4 Printer and scanner \n1.5 Built-in cameras \n1.6 Multimedia projector\nSoftware \nSoftware includes the following but are not limited to : \n2.1 Microsoft Office applications \n2.2 Database applications \n2.3 Web browser \n2.4\nClient specific software\nOHS guidelines \nTypes of equipment used \nErgonomic furniture \nRadiation barrier for monitors \nSitting posture \nLifting posture \nOrganization’s policies and procedures\nStorage devices \nStorage devices include the following but are not limited \nto : \nDiskettes \nZip disks \nLocal and remote hard disk drives  \nOptical drives (CDs) \nUSB flash drives\nMaintenance \nConducting file management  \nUpdating of applications \nStoring back up files \nMaintaining equipment cleanliness \nSecurity system/password\nMIS Requirements \nAuthorized IT security officer \nUpdating of programs/systems\n\n--- PDF PAGE 28 ---\nTR -Microfinance Technology NC II \n                                                                                                           \n \n \n23\nEVIDENCE GUIDE \n \n1. Critical aspects of \ncompetency \nAssessment requires evidence that candidate has: \n1.1 Used appropriate hardware  \n1.2 Used appropriate software applications \n1.3 Processed required data \n1.4 Maintained security measures, e.g., passwords \n1.5 Practiced troubleshooting procedures \n1.6\nApplied basic computer maintenance activities\n2. Underpinning \nknowledge and \nattitude \n2.1 Basic fundamentals for computer use \n2.2 Basic knowledge of computer system \n2.3 Basics of computer operating system \n2.4 Categories of storage devices and memories \n2.5 Types and uses of software applications \n2.6 Intellectual property rights \n2.7 Virus information, detection and elimination \n2.8 OHS principles and practices \n2.9 Concern for details in accordance with \norganization’s guidelines \n2.10 Patience in handling challenging/difficult tasks \n2.11 Quality consciousness \n2.13 Safety consciousness\n3. Underpinning skills \n3.1 Computer keyboarding skills \n3.2 Internet browsing/networking skills \n3.3 Skill in English grammar \n3.4 Basic computer software and hardware \nmaintenance/troubleshooting skills \n3.5\nAnalytical skills\n4. Resource \nimplications \nThe following resources MUST be provided: \n4.1 Computer hardware and peripherals \n4.2 Appropriate software applications \n4.3 Computer printer/scanner ink \n4.4 Stationeries  \n4.5\nCDs, DVDs and USBs\n5. Method of \nassessment \nCompetency may be assessed through: \n4.1 Direct observation \n4.2 Oral questioning \n4.3 Written test \n4.4 Practical demonstration \n4.5\nWork outputs\n6. Context for \nassessment\n6.1  The Assessment may be conducted in the \nworkplace or in a simulated workplace environment\n",
