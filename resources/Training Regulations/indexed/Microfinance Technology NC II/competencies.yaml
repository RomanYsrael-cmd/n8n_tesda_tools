or forming\ngroups\n4.2 Suitable venue\n\n--- PDF PAGE 40 ---\nTR -Microfinance Technology NC II\n\n35\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1 Demonstration with questioning\n5.2 Direct observation with questioning\n5.3 Portfolio\n5.4\nWritten test\n6. Context for\nassessment\n6.1 Competency may be assessed in the workplace or\nin a simulated workplace environment\n\n--- PDF PAGE 41 ---\nTR -Microfinance Technology NC II\n\n36\nUNIT OF COMPETENCY:\nFACILITATE CENTER MEETINGS\nUNIT CODE\n\n : HCS341304\nUNIT DESCRIPTOR :\nThis unit covers the basic knowledge, skill and\nattitudes required in conducting and facilitating center\nmeetings, and performance of standard meeting flow.\n\nELEMENT\nPERFORMANCE CRITERIA\nFacilitate center meeting following appropriate communication processes\nand techniques, using supplies , materials /equipment and non-verbal\ncommunication aids while dealing with communication barriers\n1. Lead opening and\nclosing prayers\n1.1\nOpening and closing prayers delivered in accordance with\nMicrofinance Institution (MFI) practices\n2. Present\nscheduled topic/s\n2.1 Meeting agenda prepared\n2.2 Meeting support materials distributed\n2.3\nTopics presented according to meeting agenda\n3. Facilitate group\ndiscussion\n3.1 Preparation for group discussion made\n3.2 Focus of group members attention maintained\n3.3\nGroup discussion well facilitated\n4. Check clients\nattendance\n4.1 Names of clients listed/counter checked\n4.2 Clients arrival logged\n4.3 Attendance logbook signed\n4.4\nClients attendance checked\n5. Facilitate\ncenter/cluster\nmeetings\n5.1 Preparation for group meetings made\n5.2 Focus of group members attention in center/cluster\nmeetings maintained\n5.3 Center/cluster meetings is facilitated following meeting\nprotocols\n6. Facilitate open\nforum\n6.1 Preparation for open forum regarding clients issues and\nconcerns made\n6.2 Focus of group members attention in open forum\nmaintained\n6.3 Minor issues and concerns leveled-off/addressed\n6.4 Major issues and concerns noted\n6.5\nOpen forum is facilitated\n7. Counsel clients\non\npersonal/family\nproblem/s\n7.1 Clients’ problem inquired\n7.2 Clients’ problem understood and analyzed\n7.3 Appropriate advice/recommendation given\n7.4\nCounseled clients with personal/family problem/s\n8. Resolve conflict\namong clients\n8.1 Clients concern determined\n8.2 Conflict among clients identified\n8.3 Appropriate solution to conflict given\n8.4\nConflict among clients resolved\n\n--- PDF PAGE 42 ---\nTR -Microfinance Technology NC II\n\n37\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Communication\nprocess\n\n1.1 Effective communication skills\n1.2 Facilitation skills\n1.3 Counseling skills\n1.4 Interaction among clients\n1.5 Communication techniques (e.g. Good working\ncondition, Art of questioning and listening)\n2. Communication\nbarriers\n\n2.1 Workplace\n2.2 Facilities\n2.3 Dialects\n2.4\nUnexpected interruptions\n3. Non-verbal\ncommunication\n\n3.1 Visual aid\n3.2 Facial expression\n3.3 Sign language\n3.4 Body language\n3.5\nClear calligraphy\n4. Meeting protocols\n\n4.1 Punctuality in starting and ending meetings\n4.2 Prepared agenda\n4.3 Adherence to standard MFI meeting\nprotocol/procedures\n5. Clients\n\n5.1 Potential clients\n5.2 Existing clients (with loans)\n5.3 Resigned clients\n5.4 Returning/revive clients\n5.5\nResting clients/saver’s clients\n6. Supplies, materials\nand equipment\n\n6.1 Bible (optional)\n6.2 Calculator\n6.3 Logbook/class record\n6.4 Ball pen\n6.5 Manila paper\n6.6 Masking tape/board pins\n6.7 Markers\n6.8 Visual aids\n6.9 IDs\n6.10 Facilities\n\n--- PDF PAGE 43 ---\nTR -Microfinance Technology NC II\n\n38\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that candidate has:\n1.1 Demonstrated correct use of words\n1.2 Maintained active participation of clients\n1.3 Communicated with others to ensure safe and\neffective workplace operation\n1.4\nCarried out procedures in handling meeting\n2. Underpinning\nknowledge and\nattitude\n2.1 Meeting agenda, schedule and workflow\n2.2 Focus Group Discussion (FGD) guidelines and\nprocedures\n2.3 Guidelines and procedures in conducting\ncenter/cluster meetings\n2.4 Guidelines and procedures in facilitating open\nforum\n2.5 Counseling procedures and techniques\n2.6 Standard forms, supplies and materials used in\ncenter meeting\n2.7 Equipment usage and care\n2.8 Attitude: commitment/dedication, love of work,\ncompetence, courteous, honesty, sincerity,\nsensitivity to others, sense of responsibility, caring\nattitude/compassion, and charity\n3. Underpinning skills\n3.1 Mastery of the meeting topic\n3.2 Ability to read and understand verbal and non-\nverbal instructions\n3.3 Apply procedures and techniques in conducting\ncenter/cluster meetings, FGD and open forum\n3.4 Good facilitation skills\n3.5 Effective use of presentation materials\n3.6 Effective presentation skills\n3.7 Effective counseling skills\n3.8\nProper use of equipment\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Actual or simulated workplace condition\n4.2 Forms, Tools and equipment suitable for field work\nat various centers\n4.3 Visual aids/presentation materials appropriate for\nthe center/cluster meetings\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1 Demonstration with questioning\n5.2 Direct observation with questioning\n5.3 Portfolio\n5.4\nWritten test\n6. Context for\nassessment\n6.1 Competency may be assessed in the workplace or\nin a simulated workplace environment\n\n--- PDF PAGE 44 ---\nTR -Microfinance Technology NC II\n\n39\nUNIT OF COMPETENCY :\nPROCESS APPLICATION FOR LOANS AND OTHER\nPRODUCTS/SERVICES\nUNIT CODE\n\n:\nHCS341305\nUNIT DESCRIPTOR :\nThis unit covers the knowledge, skill and attitudes\nrequired in evaluating/screening, recommending and\nprocessing clients’ application for loans and other\nproducts/services for approval of immediate superior.\n\nELEMENT\nPERFORMANCE CRITERIA\nProcess Application for Loans and Other Products/Services is\nperformed using prescribed forms and materials, work\nprocesses, tools and equipment, OHS, quality assurance\n1. Issue applications for\nloans and other\nproducts/services\n1.1 Application forms requested from immediate\nsuperior\n1.2 Serial number of application forms logged for\ncontrol and monitoring\n1.3 Application form issued in accordance with\nMicrofinance Institution’s (MFI) practices\n2. Gather applications\nfor loan and other\nproducts/services\n2.1 Application forms gathered for appraisal\n2.2 Application loan verified and checked for data\ncompletion\n3. Evaluate loan\napplicant and /or\ninsurance\napplicant/claimant\n3.1\nLoan appraisal is conducted in accordance with\nMFI’s standards\n3.2\nLoan applicant and/or insurance\napplicant/claimant is interviewed in accordance\nwith MFI’s procedures\n4. Evaluate loan and /or\ninsurance documents\n4.1\nData accuracy verified in accordance with MFI’s\noperational manual\n4.2\nSupporting documents checked and attached\nfor completeness and correctness\n5. Prepare summary of\nloan applications\nand/or insurance\n5.1\nSummary of loan applications and insurance\nclaims accomplished\n5.2\nSignature of loan officer affixed on application\nforms for loans and/or insurance claims\n6. Recommend qualified\nloan applicants and/or\ninsurance claimant\n6.1\nMFI’s performance standards on loan and/or\ninsurance application/claim qualifications are\nfollowed\n6.2\nSignature of supervisor is secured on loan\napplication and insurance claim forms\n6.3\nQualified loan applicants and insurance claimant\nare recommended to immediate superior\n7. Inform clients about\nloan application and/or\ninsurance status\n7.1\nLoan approval and schedule of release\nannounced to clients\n7.2\nClients individually informed on loan and/or\ninsurance status\n\n--- PDF PAGE 45 ---\nTR -Microfinance Technology NC II\n\n40\nELEMENT\nPERFORMANCE CRITERIA\nProcess Application for Loans and Other Products/Services is\nperformed using prescribed forms and materials, work\nprocesses, tools and equipment, OHS, quality assurance\n8. Check loan utilization\n8.1\nMFI’s performance standards on loan utilization\nfollowed\n8.2\nLoan utilization/monitoring form accomplished\nand signed\n8.3\nSupporting documents/evidence on loan\nutilization checked\n\n--- PDF PAGE 46 ---\nTR -Microfinance Technology NC II\n\n41\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Forms\nForms may include but are not limited to:\n1.1\nApplication forms\n1.2\nCash flow analysis form\n1.3\nLoan utilization form\n1.4\nCredit and background investigation form\n1.5\nBusiness/project proposal form\n1.6\nOther required MFI’s forms\n1.7\nInsurance application forms\n2. Work processes\nMay include but are not limited to:\n2.1\nLoan processing procedure\n2.2\nCredit and Background Investigation procedure\n2.3\nEvaluation/monitoring process\n2.4\nLoan recommendation and approval process\n3. Tools and\nequipment\nMay include but are not limited to:\n3.1\nTypewriter\n3.2\nComputer\n3.3\nCalculators\n3.4\nStapler\n3.5\nBallpen\n3.6\nCamera\n4. Quality Assurance\nrequirements\n4.1\nEffective oral communication\n4.2\nThorough knowledge and skills in loan processing\n4.3\nReading and understanding instructions\n4.4\nPractice of work ethics and habits\n4.5\nObservance of environmental safety\n4.6\nFamiliarity of the designated area\n4.7\nEffective client selection and Credit and Background\nInvestigation\n5. Occupational Health\nand Safety (OHS)\nrequirements\n5.1\nKnowledge of organization’s business policy\n5.2\nOHS rules and regulations in the workplace\n5.3\nKnowledge of tools and equipment safety precautions\n5.4\nRegulations on environmental protection\n6. Personal protective\nequipment\n6.1\nSafety protective devices (e.g., raincoats, umbrella,\nboots and the likes)\n6.2\nPPE for use of motorcycle (e.g., helmet, elbow, knee &\nlegs protector)\n7. Loan appraisal\nMay include but not limited to:\n7.1\nCash flow analysis\n7.2\nCharacter/Credit Investigation/Background\nInvestigation\n7.3\nPoverty Index\n7.4\nMeans Test\n7.5\nCredit history within/outside MFI\n\n--- PDF PAGE 47 ---\nTR -Microfinance Technology NC II\n\n42\nVARIABLE\nRANGE\n8. Supporting\ndocuments\nSupporting documents may include but not limited to:\n\nLoan application\n8.1\nBarangay clearance for loan purposes\n8.2\nResidence certificates\n8.3\nBusiness permit (barangay/municipal/city, DTI)\n8.4\nPhotocopy of valid ID (co-maker/co-borrower)\n\nInsurance application\n8.5\nBirth certificate\n8.6\nMarriage Contract\n8.7\nWaiver (Optional)\n8.8\nDeclaration of Good Health and Insurability\n\nInsurance claim\n8.9\nDeath certificate\n8.10\nPhysician statements\n\n--- PDF PAGE 48 ---\nTR -Microfinance Technology NC II\n\n43\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that candidate:\n1.1 Demonstrated on time processing of loan\napplication\n1.2 Demonstrated compliance with MFIs loan\nstandards and procedures\n1.3 Demonstrated the ability to evaluate/assess credit-\nworthiness\n1.4 Handled forms and materials with utmost care to\navoid wastage\n2. Underpinning\nknowledge and\nattitude\n2.1 Knowledge of Microfinance product, services and\nprograms\n2.2 Loan processing procedures\n2.3 Character/Credit Investigation and Background\nInvestigation (CCI/BI) procedures\n2.4 Loan evaluation/monitoring process\n2.5 Loan recommendation and approval process\n2.6 Standard forms, supplies and materials\n2.7 Basic mathematics related to loan assessment\n2.8 Segregation and filing of loan documents\n2.9 Client/customer service\n2.10 Attitude: quality /cost consciousness, honesty,\nfriendliness/firmness/fairness, consistency, team\nplayer, prudence, keen for details\n3. Underpinning skills\n3.1 Ability to read and understand verbal and non-\nverbal instructions\n3.2 Conducting CCI/BI\n3.3 Evaluating/monitoring client’s loan\n3.4 Numeracy/computational skills\n3.5 Interpersonal skills\n3.6 Group facilitation skills\n3.7\nUse and analyze loan document\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Standard forms for different loan programs\n4.2 Checklist of requirements\n4.3\nMFI loan protocol/procedures\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1 Demonstration with questioning\n5.2 Direct observation with questioning\n5.3 Portfolio\n5.4\nWritten test\n6.\nContext for\nassessment\n6.1 Competency may be assessed in the workplace or\nin a simulated workplace environment\n\n--- PDF PAGE 49 ---\nTR -Microfinance Technology NC II\n\n44\nUNIT OF COMPETENCY\n: COLLECT DUES\nUNIT CODE\n\n: HCS341306\n\nUNIT DESCRIPTOR\n: This unit covers the basic knowledge, skill and attitudes\nrequired in collecting dues such as loan payments,\nsaving and insurances premium using a wide range of\ncollection system from different microfinance\nmethodologies.\n\nELEMENT\nPERFORMANCE CRITERIA\nCollection of dues are performed according to OHS using the\nnecessary forms, tools/equipment and PPE\n1. Receive collection\nreports\n\n1.1 Accuracy of clients’ name and amount of payments\ndue are verified\n1.2 Maturity date of loan checked\n1.3\nCollection reports are signed\n2. Receive Payments\n\n2.1 Cash payment is sorted according to currency\ndenomination\n2.2 Deposit slip validated against collection reports\n2.3 Total amount receive recounted\n2.4 Counterfeit bills and coins are identified\n2.5\nCash payment /deposit slip secured\n3. Sign repayment\nschedule\n3.1 Schedule date of payment/repayment verified\n3.2\nSchedule signed\n4. Record collection on\ngroup treasurer’s\nregister\n4.1 Cash payment verified\n4.2 Treasurer’s register signed\n5. Record collection on\nclients passbook\n5.1 Cash payment/deposit slip verified\n5.2 Cash payment/ deposit slip secured\n5.3 Payment accurately computed\n5.4\nPassbook updated and signed\n6. Record collection on\nloan officer’s register\n6.1 Cash payment/deposit slip verified\n6.2 Cash payment/deposit slip secured\n6.3\nLoan Officer’s register signed\n7. Consolidate total\ncollection\n7.1 Collection reports consolidated\n7.2\nTotal cash payments/deposit slips consolidated\n8. Issue cash\nreceipts/official\nreceipts\n8.1 Clients’ names, date, amount paid in words, & figures\ncorrectly written\n8.2 Pre-numbered Official Receipts (OR) are counter\nchecked\n8.3\nOR signed and issued\n9. Turnover/deposit\ncollection\n9.1 Collection reports consolidated\n9.2 Total cash payments/deposit slips consolidated\n9.3 Official receipts consolidated and attached\n9.4\nOfficial receipts payment breakdown tallied\n\n--- PDF PAGE 50 ---\nTR -Microfinance Technology NC II\n\n45\nELEMENT\nPERFORMANCE CRITERIA\nCollection of dues are performed according to OHS using the\nnecessary forms, tools/equipment and PPE\n9.5 Collection receipts and reports turned-over/deposited\n9.6\nCashier collection log book signed\n10. Investigate\nReason/s for\nDelayed Payments\n10.1 Clients visited to determine reason for\n delayed/remedied (abono) payments\n10.2 Delayed/remedied payments is reported to superior\n10.3 First delayed payment notice issued and duly signed\n11. Deal with\ndelinquent\nmembers\n11.1 Delinquency management strategy is implemented\n11.2 Delinquent members reported to immediate superior\n11.3 Investigation reports submitted\n11.4 Demand letter issued to delinquent client/s in\naccordance with existing policies and procedures\n11.5 Receiving copy submitted to immediate superior and\nfiled\n12. Recommend/execu\nte plan of actions\nto settle delinquent\naccount/s\n12.1 Payments options identified and discussed with\n client/s and immediate superior\n12.2 Plan of action prepared and submitted to immediate\nsuperior\n12.3 Plan of action executed\n13. Submit incident\nreport\n13.1 Initial incident report submitted to immediate\nsuperior\n13.2 Incident investigated\n13.3 Incident report with attachment submitted to\nimmediate superior in accordance with existing\npolicies and procedures\n\n--- PDF PAGE 51 ---\nTR -Microfinance Technology NC II\n\n46\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Forms\nForms may include but are not limited to:\n1.1 Collection report form\n1.2 Official receipt\n1.3 Denomination slip\n1.4\nDeposit slip\n2. Tools and equipment 2.1 Motorcycle\n2.2 Calculator\n2.3 Computer\n2.4 Printer\n2.5 Camera\n2.6 Cellular phone\n2.7 Stapler\n2.8 Ballpen\n2.9 Money detector\n2.10 Magnet\n2.11 Collection bag\n3. Occupational Health\nand Safety (OHS)\nrequirements\n\n3.1\nKnowledge of organization business policy\n3.2\nOHS rules and regulations of workplace\n3.3\nKnowledge of tools and equipment safety\nprecautions\n3.4\nKnowledge of first aid treatment\n3.5\nRegulations on environmental protection\n4. Personal protective\nequipment\n4.1 Safety protective devices (e.g., raincoats, umbrella,\nboots and the likes)\n4.2 PPE for use of motorcycle (e.g., helmet, elbow, knee\n& legs protector)\n5. Incidents\n5.1\nHold-up\n5.2\nDefalcation\n5.3\nFraud\n5.4\nKiting\n\n--- PDF PAGE 52 ---\nTR -Microfinance Technology NC II\n\n47\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that candidate has:\n1.1 Assured on-time repayment of clients\n1.2 Demonstrated compliance with the organization’s\ncollection policies and regulations\n1.3 Demonstrated proper handling and safety\nprocedures of collections\n1.4\nIssued Official receipts accurately\n2. Underpinning\nknowledge and\nattitude\nMay include but are not limited to:\n2.1 OHS guidelines and practices\n2.2 Basic mathematical concepts and techniques\n2.3 Simple accounting procedures\n2.4 Basic computer operation\n2.5 Effective reading and oral communication\n2.6 Knowledge of adult learning\n2.7 Knowledge on loan processing\n2.8 Work ethics and habits\n2.9 Knowledge of products, services and programs\n2.10 Environmental safety\n2.11 Knowledge on client selection and credit\nInvestigation and background investigation\n2.12 Knowledge in center management\n2.13 Attitude: commitment/dedication, love of work,\ncompetence, courteous, honesty, sincerity, sensitivity\nto others, sense of responsibility, caring\nattitude/compassion, and charity\n3. Underpinning skills\n3.1 Reading and comprehending work instructions\n3.2 Ability to read and understand verbal instructions\n3.3 Ability to detect counterfeit bills and coins\n3.4 Use of office equipment\n3.5 Apply procedures and techniques in collection\n3.6 Observing environmental safety\n3.7\nFamiliarity of the designated area\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Actual or simulated workplace condition\n4.2 Forms, tools and equipment appropriate to the\ncollection method\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1 Demonstration with questioning\n5.2 Direct observation with questioning\n5.3 Portfolio\n5.4\nWritten test\n6. Context for\nassessment\n6.1 Competency may be assessed in the actual or\nsimulated workplace environment\n\n--- PDF PAGE 53 ---\nTR -Microfinance Technology NC II\n\n48\nUNIT OF COMPETENCY :\nUPDATE FINANCIAL RECORDS\nUNIT CODE\n\n:\nHCS341307\nUNIT DESCRIPTOR :\nThis unit covers the knowledge, skill and attitudes\nrequired in updating financial records, accomplishing\nnecessary forms for specific transactions and budget\nprojections.\n\nELEMENT\nPERFORMANCE CRITERIA\nUpdating Financial Records is performed using the appropriate\nforms, work processes, tools, equipment, quality assurance\nand occupational health and safety (OH&S) requirements\n1. Review transaction\nreport\n1.1 Collection report is reviewed\n1.2 Cash receipt slip/collection summary report\naccomplished and reviewed\n2. Prepare loan\ndisbursement master\nroll\n2.1 Client’s name and loan information listed\n2.2 Loan disbursement master roll prepared\n2.3\nClients signature affixed\n3. Record daily\ncollection on daily\ncollection sheet\n3.1 Collection consolidated and recorded\n3.2 Collections on loan amortization, capital build-up\n/savings and other fees identified and recorded\n3.3\nReport submitted to immediate superior\n4. Submit daily\nmonitoring report\n4.1 Daily activity schedule prepared\n4.2 Daily activities output and total collection recorded,\nsummarized and submitted to immediate superior\n5. Summarize collect-\nion on Loan Officer’s\nsummary book\n5.1 Collection on loan amortization, capital build-up\nand other fees are summarized\n5.2\nSummary report submitted to immediate superior\n6. Prepare monthly\nplan\n6.1 Budget for administrative and operational\nexpenses prepared\n6.2 Collection on capital build-up and loan amortization\nprojected\n6.3 Performance commitment on outreach and loan\nportfolio signed and submitted to immediate\nsuperior\n6.4\nMonthly plan prepared\n7. Prepare annual\ndevelopment action\nplan\n7.1 Budget for branch expenses prepared\n7.2 Collection on capital build-up and loan\namortization projected\n7.3 Performance commitment on outreach and loan\nportfolio signed and submitted to immediate\nsuperior\n7.4 Next year’s amount of loan disbursement projected\n7.5\nAnnual plan prepared\n\n--- PDF PAGE 54 ---\nTR -Microfinance Technology NC II\n\n49\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Forms\nForms may include but are not limited to:\n1.1 Cash receipt slip\n1.2 Daily collection sheet\n1.3 Debit voucher\n1.4 Loan projection sheet\n1.5 Loan disbursement master roll\n1.6 Cash book\n1.7\nGeneral/subsidiary ledger\n2. Work Processes\n2.1 Loan projection process\n2.2\nRecord-keeping process\n3. Tools and\nequipment\nMay include but are not limited to:\n3.1 Calculator\n3.2 Computer\n3.3 Printer\n3.4 Ruler\n3.5\nBall pens\n4. Quality Assurance\nrequirements\n4.1 MFI Operation Manual\n4.2 Standards and Procedures (e.g. ASA, Grameen,\nVillage banking and other Microfinance\nmethodologies)\n5. Occupational Health\nand Safety (OHS)\nrequirements\n5.1\nKnowledge of organization’s business policy\n5.2\nOHS rules and regulations in the workplace\n5.3\nKnowledge of tools and equipment safety\nprecautions\n5.4\nRegulations on environmental protection\n\n--- PDF PAGE 55 ---\nTR -Microfinance Technology NC II\n\n50\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that candidate:\n1.1 Analyzed transactions\n1.2 Recorded transaction on standard forms\n1.3 Complied with the guidelines for record-keeping in\naccordance with MFIs standards and procedures\n1.4 Handled materials with utmost care to avoid\nwastage\n1.5\nDemonstrated accurate record-keeping\n2. Underpinning\nknowledge and\nattitude\n2.1 Record-keeping concepts and principles\n2.2 Record-keeping procedures and practices in\naccordance with the MFIs methodology\n2.3 Confidentiality and security of records\n2.4 Filing system\n2.5 Knowledge in analyzing transactions\n2.6 Knowledge of fundamental mathematical\noperations\n2.7 Knowledge of basic statistics\n2.8 Familiarity with record-keeping processes\n2.9 Attitude: quality /cost consciousness, honesty,\nfriendliness/firmness/fairness, consistency, team\nplayer, prudence, keen for details\n3. Underpinning skills\n3.1 Ability to read and understand record-keeping\nterminologies and instructions\n3.2 Ability to identify account titles for every\ntransaction\n3.3 Performing record-keeping in accordance with the\norganization’s rules and regulations\n3.4\nReading and understanding work instructions\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Working table\n4.2 Basic record-keeping Forms/documents\n4.3 Calculators\n4.4 Computer and printer\n4.5\nSupplies and materials\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1 Demonstration with questioning\n5.2 Direct observation with questioning\n5.3 Portfolio\n5.4\nWritten test\n6. Context for\nassessment\n6.1 Competency may be assessed in the workplace or\nin a simulated workplace environment\n\n--- PDF PAGE 56 ---\nTR -Microfinance Technology NC II\n\n51"
