        "source_text": "--- PDF PAGE 49 ---\nTR -Microfinance Technology NC II \n                                                                                                           \n \n \n44\nUNIT OF COMPETENCY \n:  COLLECT DUES \nUNIT CODE \n  \n:  HCS341306  \n \nUNIT DESCRIPTOR   \n:  This unit covers the basic knowledge, skill and attitudes \nrequired in collecting dues such as loan payments, \nsaving and insurances premium using a wide range of \ncollection system from different microfinance \nmethodologies. \n \nELEMENT \nPERFORMANCE CRITERIA \nCollection of dues are performed according to OHS using the \nnecessary forms, tools/equipment and PPE\n1. Receive collection \nreports \n \n1.1 Accuracy of clients’ name and amount of payments \ndue are verified \n1.2 Maturity date of loan checked \n1.3\nCollection reports are signed\n2. Receive Payments \n \n2.1 Cash payment is sorted according to currency \ndenomination \n2.2 Deposit slip validated against collection reports \n2.3 Total amount receive recounted \n2.4 Counterfeit bills and coins are identified \n2.5\nCash payment /deposit slip secured\n3. Sign repayment \nschedule\n3.1 Schedule date of payment/repayment verified \n3.2\nSchedule signed\n4. Record collection on \ngroup treasurer’s \nregister\n4.1 Cash payment verified \n4.2 Treasurer’s register signed \n5. Record collection on \nclients passbook \n5.1 Cash payment/deposit slip verified \n5.2 Cash payment/ deposit slip secured \n5.3 Payment accurately computed \n5.4\nPassbook updated and signed\n6. Record collection on \nloan officer’s register \n6.1 Cash payment/deposit slip verified \n6.2 Cash payment/deposit slip secured \n6.3\nLoan Officer’s register signed\n7. Consolidate total \ncollection\n7.1 Collection reports consolidated \n7.2\nTotal cash payments/deposit slips  consolidated\n8. Issue cash \nreceipts/official \nreceipts \n8.1 Clients’ names, date, amount paid in words, & figures \ncorrectly written \n8.2 Pre-numbered Official Receipts (OR) are counter \nchecked \n8.3\nOR signed and issued\n9. Turnover/deposit \ncollection  \n9.1 Collection reports consolidated \n9.2 Total cash payments/deposit slips consolidated \n9.3 Official receipts consolidated and attached \n9.4\nOfficial receipts payment breakdown tallied\n\n--- PDF PAGE 50 ---\nTR -Microfinance Technology NC II \n                                                                                                           \n \n \n45\nELEMENT \nPERFORMANCE CRITERIA \nCollection of dues are performed according to OHS using the \nnecessary forms, tools/equipment and PPE\n9.5 Collection receipts and reports turned-over/deposited \n9.6\nCashier collection log book signed\n10. Investigate \nReason/s for \nDelayed Payments \n10.1 Clients visited to determine reason for  \n         delayed/remedied (abono) payments \n10.2  Delayed/remedied payments is reported to superior \n10.3  First delayed payment notice issued and duly signed\n11. Deal with \ndelinquent \nmembers \n11.1 Delinquency management strategy is implemented \n11.2 Delinquent members reported to immediate superior \n11.3 Investigation reports submitted  \n11.4 Demand letter issued to delinquent client/s in \naccordance with existing policies and procedures \n11.5 Receiving copy submitted to immediate superior and \nfiled\n12. Recommend/execu\nte plan of actions \nto settle delinquent \naccount/s  \n12.1 Payments options identified and discussed with   \n        client/s and immediate superior \n12.2 Plan of action prepared and submitted to immediate \nsuperior \n12.3 Plan of action executed\n13. Submit incident \nreport  \n13.1 Initial incident report submitted to immediate \nsuperior \n13.2 Incident investigated \n13.3 Incident report with attachment submitted to \nimmediate superior in accordance with existing \npolicies and procedures\n\n--- PDF PAGE 51 ---\nTR -Microfinance Technology NC II \n                                                                                                           \n \n \n46\nRANGE OF VARIABLES  \n \nVARIABLE \nRANGE \n1. Forms  \nForms may include but are not limited to: \n1.1 Collection report form  \n1.2 Official receipt \n1.3 Denomination slip \n1.4\nDeposit slip\n2. Tools and equipment 2.1 Motorcycle \n2.2 Calculator \n2.3 Computer  \n2.4 Printer \n2.5 Camera \n2.6 Cellular phone  \n2.7 Stapler \n2.8 Ballpen \n2.9 Money detector \n2.10 Magnet  \n2.11 Collection bag\n3. Occupational Health \nand Safety (OHS) \nrequirements \n \n \n3.1 \nKnowledge of organization business policy \n3.2 \nOHS rules and regulations of workplace \n3.3 \nKnowledge of tools and equipment safety \nprecautions \n3.4 \nKnowledge of first aid treatment \n3.5\nRegulations on environmental protection\n4. Personal protective \nequipment  \n4.1 Safety protective devices (e.g., raincoats, umbrella, \nboots and the likes) \n4.2 PPE for use of motorcycle (e.g., helmet, elbow, knee \n& legs protector)\n5. Incidents \n5.1 \nHold-up \n5.2 \nDefalcation \n5.3 \nFraud \n5.4\nKiting\n\n--- PDF PAGE 52 ---\nTR -Microfinance Technology NC II \n                                                                                                           \n \n \n47\nEVIDENCE GUIDE \n \n1. Critical aspects of \ncompetency \nAssessment requires evidence that candidate has: \n1.1 Assured on-time repayment of clients  \n1.2 Demonstrated compliance with the organization’s \ncollection policies and regulations \n1.3 Demonstrated proper handling and safety \nprocedures of collections  \n1.4\nIssued Official receipts accurately \n2. Underpinning \nknowledge and \nattitude \nMay include but are not limited to: \n2.1 OHS guidelines and practices \n2.2 Basic mathematical concepts and techniques \n2.3 Simple accounting procedures \n2.4 Basic computer operation \n2.5 Effective reading and oral communication \n2.6 Knowledge of adult learning \n2.7 Knowledge on loan processing \n2.8 Work ethics and habits \n2.9 Knowledge of products, services and programs \n2.10 Environmental safety \n2.11 Knowledge on client selection and credit \nInvestigation and background investigation \n2.12 Knowledge in center management \n2.13 Attitude: commitment/dedication, love of work, \ncompetence, courteous, honesty, sincerity, sensitivity \nto others, sense of responsibility, caring \nattitude/compassion, and  charity\n3. Underpinning skills \n3.1 Reading and comprehending work instructions \n3.2 Ability to read and understand verbal instructions \n3.3 Ability to detect counterfeit bills and coins  \n3.4 Use of office equipment \n3.5 Apply procedures and techniques in collection \n3.6 Observing environmental safety  \n3.7\nFamiliarity of the designated area\n4. Resource \nimplications \nThe following resources MUST be provided: \n4.1 Actual or simulated workplace condition  \n4.2 Forms, tools and equipment appropriate to the \ncollection method\n5. Method of \nassessment \nCompetency may be assessed through: \n5.1 Demonstration with questioning \n5.2 Direct observation with questioning \n5.3 Portfolio  \n5.4\nWritten test\n6. Context for \nassessment\n6.1  Competency may be assessed in the actual or \nsimulated workplace environment\n",
