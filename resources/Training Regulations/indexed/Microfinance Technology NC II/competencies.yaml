        "evidence_guide": {
          "source_text": "--- PDF PAGE 25 ---\nTR -Microfinance Technology NC II\n\n20\n1.\nCritical\naspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Performed work in accordance with the organization’s standard\noperating procedures and specifications\n1.2 Identified and reported defects in accordance with standard\noperating procedures\n1.3 Carried out work in accordance with the process improvement\nprocedures\n2.\nUnderpinning\nknowledge\nand attitude\n2.1\nKnowledge of organization’s vision, mission and values\n2.2 Knowledge of product, services and programs\n2.3 Operational standards and procedures\n2.4 Quality checking procedures\n2.5 Workplace procedures\n2.6 Occupational health and safety procedures\n2.7 Characteristics of hardware, software and materials used in\nrendering quality service\n2.8 Defect/irregularities identification and reporting\n2.9 Quality improvement processes\n2.10 Quality consciousness\n2.11 Values orientation\n2.12 Market-driven/client-focused\n3. Underpinning\nskills\n3.1\nComprehension skills\n3.2 Communication skills\n3.3 Critical thinking, problem solving and decision-making skills\n3.4 Technical skills\n3.5 Interpersonal skills\n3.6 Community organizing skills\n3.7 Analytical skills\n3.8 Quantitative skills\n3.9\nQualitative skills\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Product manuals and brochures\n4.2 Marketing and promotional materials\n4.3 Orientation and presentation materials\n4.4 Office standard forms and documentation\n4.5 Operational handbook/manuals\n4.6 Work plans and schedules\n4.7 Hardware\n4.8\nSoftware\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1 Written examination\n5.2 Interviews\n5.3 Audit report\n5.4 Monthly reports\n5.5 Practical demonstration\n5.6\nPerformance evaluation\n6. Context for\nassessment\n6.1 Assessment may be conducted in the workplace or in a\nsimulated workplace environment\n\n--- PDF PAGE 26 ---\nTR -Microfinance Technology NC II\n\n21\nUNIT OF COMPETENCY:\nPERFORM COMPUTER OPERATIONS\nUNIT CODE\n\n :"
        },
        "source_text": "HCS315202\n\nUNIT DESCRIPTOR\n:\n This unit covers the knowledge, skills and attitudes\nneeded to apply quality and ethical standards in the\nworkplace. The unit also includes the application of\nrelevant safety procedures and regulations, organization\nprocedures, client and industry requirements.\n\nELEMENT\nPERFORMANCE CRITERIA\n1. Assess quality\nof received\nmaterials\n1.1 Work instruction is obtained and carried out in accordance\nwith standard operating procedures\n1.2 Received materials are checked against workplace\nstandards and specifications\n1.3 Defective materials are identified, reported and isolated\n1.4 Defective materials are repaired/replaced in accordance\nwith workplace procedures\n1.5 Defects and any identified causes are recorded and/or\nreported to the concerned personnel in accordance with\nworkplace procedures\n2. Assess own\nwork/output\n2.1 Documentation relative to quality within the company is\nidentified and used\n2.2 Completed work is checked against workplace standards\n2.3 Defects are identified and corrected in accordance with the\ncompany quality standards\n3. Submit oneself\nto third party\nassessment\n3.1 Information on the quality and other indicators of\nperformance are recorded in accordance with workplace\nprocedures\n3.2 In cases of deviations from specific quality standards,\ncauses are documented and reported in accordance with\nthe workplace’s standards operating procedures\n3.3 In cases of objections/disagreements, reasons are\nexpressed thru written documentation\n3.4\nSettlements are sought in accordance with company policies\n4. Engage in\nquality\nimprovement\n4.1 Process improvement procedures are participated in relative\nto workplace assignment\n4.2 Work is carried out in accordance with process improvement\nprocedures\n4.3 Services are delivered in accordance with ethical standards\n4.4 Quality service is monitored to ensure client satisfaction\n4.5 Client’s needs are assessed through conduct of researches,\nfocus group discussions, and satisfaction surveys/interviews\n4.6 Trainings, orientations, and exposures are rendered to\nensure their understanding/ familiarization on products,\nservices and programs\n\n--- PDF PAGE 23 ---\nTR -Microfinance Technology NC II\n\n18\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Materials\nMaterials may include but are not limited to:\n1.1 Manuals, brochures, flyers, flipcharts, signages and\ntarpaulin\n1.2 Work orders\n1.3 Standard forms\n1.4 Recorded voice files/audio video presentations\n1.5 PowerPoint presentation materials\n1.6 Documentations\n1.7 Software\n1.8 Hardware\n1.9 Office supplies\n1.10 Office equipment\n1.11 Holy Scriptures\n2. Defects/Irregularities\nDefects may include but are not limited to:\n2.1 Deviation from the requirements of the client\n2.2 Deviation from the requirements and standard\noperating procedures of the organization/institution\n2.3 Manuals containing incorrect/outdated information\n2.4 Software/hardware defects\n2.5 Poor employee interpersonal relationships/conflicts\namong employees\n2.6 Loose implementation of organizational policies and\nprocedures\n2.7 Poor/inappropriate training designs\n2.8 Non-compliance of selection and recruitment\nprocedures of employees\n2.9 Work fatigue and lost of interest to work being\nexperience by the employee/s\n2.10 Lack of clear understanding about one’s role and\nresponsibilities\n2.11 Non-compliance of selection and recruitment\nprocedures of clients\n2.12 Undesirable work behavior of employees\n2.13 Breakdown of/barriers to communication\n2.14 Outdated work plans and schedules\n3. Documentation\nIncludes the following but are not limited to:\n3.1 Standard Operating Procedures\n3.2 Quality checklist\n3.3 Monitoring feedback sheet\n3.4 Forms such as Loan Applications, CCI/BI, Cash Flows,\nLoan Utilization Checks, Client Exits/Withdrawals,\nWork/Job Order, Client Feedback Notice, Material\nRequisition Form, Performance Appraisal Report,\nTraining Evaluation Forms\n3.5\nReports such as Financial Statements, Operational\n\n--- PDF PAGE 24 ---\nTR -Microfinance Technology NC II\n\n19\nVARIABLE\nRANGE\nAssessments/Highlights and Plans, Cash Position\nReports\n3.6 Minutes of meetings (Board, Branch,\nDepartment/Units/Groups)\n3.7 Special orders, memorandums, notices,\nannouncements\n3.8 Employee movements (promotion, demotion,\ndischarge, termination, suspension)\n3.9 Linkages such as Loan Verification, SSS and\nPhilhealth dues.\n3.10 Organizational Profile (Vision, Mission, Goals and\nObjectives)\n3.11 Electronic documentations e.g. Website\n3.12 Files/Employees’ Profile\n4. Quality standards\nQuality standards may be related but are not limited to the\nfollowing:\n4.1 Materials\n4.2 Software\n4.3 Office supplies\n4.4 Office facilities\n4.5 Office equipment\n4.6 Office standard forms\n4.7 Work processes\n4.8 Customer service\n4.9 Products and services\n4.10 Work outputs\n4.11 Communication process\n4.12 Ethical and professional ethics\n4.13 Training program design and delivery\n4.14 Value added services/product innovations\n4.15 Organization’s policies and procedures manual\n5. Client\nIncludes the following but are not limited to:\n5.1 External clients (customers, partners, members,\nsubscribers, end users, investors/funders, service\nproviders, agencies)\n5.2 Internal clients (within the organization/co-employees,\nimmediate superiors, board of trustees)\n\nEVIDENCE GUIDE\n\n--- PDF PAGE 25 ---\nTR -Microfinance Technology NC II\n\n20\n1.\nCritical\naspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Performed work in accordance with the organization’s standard\noperating procedures and specifications\n1.2 Identified and reported defects in accordance with standard\noperating procedures\n1.3 Carried out work in accordance with the process improvement\nprocedures\n2.\nUnderpinning\nknowledge\nand attitude\n2.1\nKnowledge of organization’s vision, mission and values\n2.2 Knowledge of product, services and programs\n2.3 Operational standards and procedures\n2.4 Quality checking procedures\n2.5 Workplace procedures\n2.6 Occupational health and safety procedures\n2.7 Characteristics of hardware, software and materials used in\nrendering quality service\n2.8 Defect/irregularities identification and reporting\n2.9 Quality improvement processes\n2.10 Quality consciousness\n2.11 Values orientation\n2.12 Market-driven/client-focused\n3. Underpinning\nskills\n3.1\nComprehension skills\n3.2 Communication skills\n3.3 Critical thinking, problem solving and decision-making skills\n3.4 Technical skills\n3.5 Interpersonal skills\n3.6 Community organizing skills\n3.7 Analytical skills\n3.8 Quantitative skills\n3.9\nQualitative skills\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Product manuals and brochures\n4.2 Marketing and promotional materials\n4.3 Orientation and presentation materials\n4.4 Office standard forms and documentation\n4.5 Operational handbook/manuals\n4.6 Work plans and schedules\n4.7 Hardware\n4.8\nSoftware\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1 Written examination\n5.2 Interviews\n5.3 Audit report\n5.4 Monthly reports\n5.5 Practical demonstration\n5.6\nPerformance evaluation\n6. Context for\nassessment\n6.1 Assessment may be conducted in the workplace or in a\nsimulated workplace environment\n\n--- PDF PAGE 26 ---\nTR -Microfinance Technology NC II\n\n21\nUNIT OF COMPETENCY:\nPERFORM COMPUTER OPERATIONS\nUNIT CODE\n\n :"
