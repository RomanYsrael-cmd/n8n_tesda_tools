uppliers \n1.3 \nTrade personnel \n1.4 \nLocal government \n1.5 \nIndustry bodies \n2. Medium \n2.1 \nMemorandum \n2.2 \nCircular \n2.3 \nNotice \n2.4 \nInformation discussion \n2.5 \nFollow-up or verbal  instructions \n2.6 \nFace to face communication \n3. Storage \n3.1 \nManual filing system \n3.2 \nComputer-based filing system \n4. Forms \n4.1 \nPersonnel forms, telephone message forms, safety \nreports \n5. Workplace \ninteractions \n5.1 \nFace-to-face interactions \n5.2 \nTelephone conversation \n5.3 \nElectronic and two-way radio communication \n5.4 \nWritten communication including electronic mail, \nmemos, instruction and forms \n5.5 \nNon-verbal communication including gestures, \nsignals, signs and diagrams \n6. Protocols \n6.1 \nObserving meeting \n6.2 \nCompliance with meeting decisions \n6.3 \nObeying meeting instructions\n\n--- PDF PAGE 9 ---\nTR -Microfinance Technology NC II \n                                                                                                           \n \n \n4"
