  "source_text": "COMPETENCY MAP\n\nMICROFINANCE TECHNOLOGY NC II\n\nCORE UNITS OF COMPETENCY\n\nSelect potential area for\nmicrofinance operation\n\nPromote microfinance\nproducts and other services\n\nForm group of microfinance\nclients\n\nFacilitate center meetings\n\nProcess application for loans\nand other services\nCollect dues\n\nUpdate financial records\n\nPerform goal setting and\nplanning\n\nPerform monitoring and\nevaluation\n\nProvide/facilitate remittance\nservices\nMaintain records\n\nPerform HR-related activities\n(hiring, training, benefits and\nwelfare)\n\nDevelop center/clients\nentrepreneurial skills\n\nEstablish linkages or network\nwith different sectors\n\nCOMMON UNITS OF COMPETENCY\n\nProvide quality customer\nservices\n\nComply with quality and\nethical standards\n\nPerform computer operation\n\nBASIC UNITS OF COMPETENCY\nParticipate in workplace\ncommunication\n\nWork in team environment\n\nPractice career professionalism\n\nPractice occupational health\nand safety procedures\n\n--- PDF PAGE 68 ---\nTR -Microfinance Technology NC II Date Promulgated\n\n63",
