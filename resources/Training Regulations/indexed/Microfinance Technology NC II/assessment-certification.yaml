      "number": "4.1",
      "text": "To attain the National Qualification of MICROFINANCE TECHNOLOGY NC II, the candidate must demonstrate competence through assessment covering all the units of competency listed in Section 1. Successful candidates shall be awarded a National Certificate signed by the TESDA Director General."
    },
    {
      "number": "4.2",
      "text": "Individual aspiring to be awarded the qualification of MICROFINANCE TECHNOLOGY NC II must demonstrate competency in all the following core units of the Qualification through a single project-type assessment. Candidates may apply for assessment in any accredited assessment center. • Select Potential Area for Microfinance Operation • Promote Microfinance Products and Other Services • Form Group of Microfinance Clients • Facilitate Center Meeting • Process Application for Loans and Other Services • Collect Dues • Update Financial Records Successful candidates shall be awarded National Certificate Level II in MICROFINANCE TECHNOLOGY."
    },
    {
      "number": "4.3",
      "text": "Assessment shall focus on the core units of competency. The basic and common units shall be integrated or assessed concurrently with the core units."
    },
    {
      "number": "4.4",
      "text": "The following are qualified to apply for assessment and certification 4.5.1 Graduates of formal, non-formal and informal including enterprise- based training programs 4.5.2 Experienced workers (wage employed or self employed)"
    },
    {
      "number": "4.5",
      "text": "The guidelines on assessment and certification are discussed in detail in the \"Procedures Manual on Assessment and Certification\" and \"Guidelines on the Implementation of the Philippine TVET Qualification and Certification System (PTQCS)\"."
