  "source_section_text": "SECTION 3 TRAINING STANDARDS\n\nThese guidelines are set to provide the Technical and Vocational Education and\nTraining (TVET) providers with information and other important requirements to consider\nwhen designing training programs for MICROFINANCE TECHNOLOGY NC II.\n\n3.1\nCURRICULUM DESIGN\n\nCourse Title\n:\nMICROFINANCE TECHNOLOGY COURSE\n\nNominal Duration\n: Basic\n-\n18 Hours\n\nCommon\n-\n74 Hours\n\nCore\n-\n311 Hours\n\nQualification Level\n: NC II\n\nCourse Description:\n\n This course is designed to provide basic knowledge, skills and desirable attitudes to\nindividual who would like to become a Microfinance Loan Officer and be competent to\ninteract with clients in providing microfinance loan and other services for start-\nup/expansion of a small or micro enterprise. It covers competencies such as selecting\npotential area for microfinance operation, promoting products and other services, forming\ngroup of microfinance clients, facilitating center meeting, processing application for loans\nand other services, collecting dues, and updating financial records.\n Basic competencies such as: Participate in workplace communication; Work in a\nteam environment; Practice career professionalism; Practice occupational health and\nsafety are included.\n It also includes common competencies such as: Provide quality customer service;\nComply with quality and ethical standards; and Perform computer operations.\n To obtain this, all units prescribed for this qualification must be achieved.\n\nBASIC COMPETENCIES\n(18 Hours)\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and convey\nworkplace information\n1.2 Complete relevant work\nrelated documents\n1.3 Participate in workplace\nmeeting and discussion\n• Group\ndiscussion\n• Interaction\n• Lecture\n• Reportorial\n• Written test\n• Practical/\nperformance\ntest\n• Interview\n\n--- PDF PAGE 57 ---\nTR -Microfinance Technology NC II\n\n52\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n2. Work in a team\nenvironment\n2.1 Describe and identify team\nrole and responsibility in a\nteam.\n2.2 Describe work as a team\nmember.\n• Group\ndiscussion\n• Interaction\n• Lecture\n• Case studies\n• Simulation\n• Written test\n• Practical/\nperformance\ntest\n• Interview\n• Observation of\nwork activities\n• Observation\nthrough\nsimulation or\nrole play\n• Case studies\nand scenarios\n3. Practice career\nprofessionalism\n3.1 Integrate personal\nobjectives with\norganizational goals\n3.2 Set and meet work\nproblems\n3.3 Maintain professional\ngrowth and development\n• Interactive\nlecture\n• Simulation\n• Demonstration\n• Self paced\ninstruction\n• Group\ndiscussion\n• Structured\nactivity\n• Film viewing\n•Role play\n• Role play\n• Interviews\n• Written test\n• Demonstration\n• Portfolio\nassessment\n\n4. Practice\noccupational\nhealth and\nsafety\n4.1 Identify hazards and risks\n4.2 Evaluate hazards and\nrisks\n4.3 Control hazards and risks\n4.4 Maintain occupational\nhealth and safety (OHS)\nawareness\n• Interactive-\nlecture\n• Simulation\n• Symposium\n• Group\nDynamics\n• Situation\nanalysis\n• Film viewing\n• Self pace\ninstruction\n• Case/Situation\nanalysis\n• Interview\n• Practical\nexamination\n• Written exam\n• Simulation\n• Demonstration\n• Portfolio\nassessment\n\n--- PDF PAGE 58 ---\nTR -Microfinance Technology NC II\n\n53\nCOMMON COMPETENCIES\n(74 Hours)\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Provide\nQuality\nCustomer\nService\n\n1.1 Update knowledge of\nproducts and services\n1.2 Assess needs of new and\nexisting clients\n1.3 Conduct client satisfaction\nsurvey\n•\nSelf-pace\nmodular\n•\nLecture\n•\nDiscussion\n•\nCase studies\n•\nDemonstration\n•\nSimulation\n•\nRole play\n•\nPracticum\n• Written\nExamination\n• Demonstration\nof Practical\nSkills\n• Assertion &\nReason\n• Checklist\n•\nLogbook\n2. Comply with\nQuality and\nEthical\nstandards\n2.1 Assess quality of received\nmaterials\n2.2 Assess own work/output\n2.3 Submit oneself to third\nparty assessment\n•\nSelf-pace\nmodular\n•\nLecture\n•\nDiscussion\n•\nCase studies\n•\nDemonstration\n•\nSimulation\n•\nRole play\n•\nPracticum\n• Written\nExamination\n• Demonstration\nof Practical\nSkills\n• Assertion &\nReason\n• Checklist\n•\nLogbook\n3. Performing\nComputer\nOperations\n3.1 Plan and prepare for\nassigned task\n3.2 Encode data\n3.3 Access information\n3.4 Produce data\n3.5 Use the internet to access\ninformation\n3.6 Maintain computer\nequipment and systems\n•\nSelf-pace\nmodular\n•\nLecture\n•\nDiscussion\n•\nCase studies\n•\nDemonstration\n•\nSimulation\n•\nRole play\n•\nPracticum\n• Written\nExamination\n• Demonstration\nof Practical\nSkills\n• Assertion &\nReason\n• Checklist\n•\nLogbook\n\n--- PDF PAGE 59 ---\nTR -Microfinance Technology NC II\n\n54\nCORE COMPETENCIES\n(311 Hours)\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Select potential\narea for\n1.1 Conduct area scanning /\nmapping\n1.2 Coordinate with concerned\ngovernment office\n1.3 Review barangay profile\n1.4 Conduct area survey\n1.5 Conduct interviews\n1.6 Process survey and\ninterview data\n•\nSelf-pace\nmodular\n•\nLecture\n•\nDemonstration\n•\nDiscussion\nwith class\ninteractions\n•\nSimulation\n•\nCase\nstudy/case\nanalysis\n•\nPracticum/Wor\nk integrated\nlearning\n•\nBrainstorming\nby\ngroup/group\ndynamics\n•\nRole playing\n•\nBuzz sessions\n• Written\nExamination\n• Demonstration\nof Practical\nSkills\n• Assertion &\nReason\n• Checklist\n• Logbook\n2. Promote\nmicrofinance\nproducts and\nother services\n2.1 Introduce loan products and\nservices\n2.2 Conduct orientation and\nbriefings on microfinance\nproducts and services\n2.3 Facilitate/Coordinate\nmicrofinance training\nprogram\n2.4 Assist clients ion promoting\ntheir products\n2.5 Administer survey on\nenhancement of MFI\nproducts and services\n•\nSelf-pace\nmodular\n•\nLecture\n•\nDemonstration\n•\nDiscussion\nwith class\ninteractions\n•\nSimulation\n•\nCase\nstudy/case\nanalysis\n•\nPracticum/Wor\nk integrated\nlearning\n•\nBrainstorming\nby\ngroup/group\ndynamics\n•\nRole playing\n•\nBuzz sessions\n• Written\nExamination\n• Demonstration\nof Practical\nSkills\n• Assertion &\nReason\n• Checklist\n• Logbook\n3. Form group of\nmicrofinance\nclients\n3.1 Meet with barangay official/s\n3.2 Orient target clients\n3.3 Schedule and conduct\nfamily background\ninvestigation/CCI/BI\n• Self-pace\nmodular\n• Lecture\n• Demonstration\n• Discussion with\n• Written\nExamination\n• Demonstration\nof Practical\nSkills\n\n--- PDF PAGE 60 ---\nTR -Microfinance Technology NC II\n\n55\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n3.4 Organize\ngroup/center/cluster\n3.5 Orient group\nofficers/center/officer on\ntheir roles and\nresponsibilities\n3.6 Facilitate group/center\nofficer meetings\nclass\ninteractions\n• Simulation\n• Case\nstudy/case\nanalysis\n• Practicum/Wor\nk integrated\nlearning\n• Brainstorming\nby group/group\ndynamics\n• Role playing\n• Buzz sessions\n• Assertion &\nReason\n• Checklist\n• Logbook\n4. Facilitate center\nmeetings\n4.1 Lead opening and closing\nprayers\n4.2 Present scheduled topic/s\n4.3 Facilitate group discussion\n4.4 Check clients attendance\n4.5 Facilitate center/cluster\nmeeting\n4.6 Facilitate open forum\n4.7 Counsel clients on\npersonal/family problems\n4.8 Resolve conflict among\nclients\n• Self-pace\nmodular\n• Lecture\n• Demonstration\n• Discussion with\nclass\ninteractions\n• Simulation\n• Case\nstudy/case\nanalysis\n• Practicum/Wor\nk integrated\nlearning\n• Brainstorming\nby group/group\ndynamics\n• Role playing\n• Buzz sessions\n• Written\nExamination\n• Demonstration\nof Practical\nSkills\n• Assertion &\nReason\n• Checklist\n• Logbook\n5. Process\napplication for\nloans and other\nproducts/servic\nes\n5.1 Issue applications for loans\nand other products/services\n5.2 Gather applications for loans\nand other products/services\n5.3 Evaluate loan applicant\nand/or insurance\napplicant/claimant\n5.4 Evaluate loan and/or\ninsurance documents\n5.5 Prepare summary of loan\napplications and/or\ninsurance\n5.6 Recommend qualified loan\napplicants and/or insurance\n• Self-pace\nmodular\n• Lecture\n• Demonstration\n• Discussion with\nclass\ninteractions\n• Simulation\n• Case\nstudy/case\nanalysis\n• Practicum/\nWork\nintegrated\n• Written\nExamination\n• Demonstration\nof Practical\nSkills\n• Assertion &\nReason\n• Checklist\n• Logbook\n\n--- PDF PAGE 61 ---\nTR -Microfinance Technology NC II\n\n56\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\nclaimant\n5.7 Inform clients about loan\napplication and/or insurance\nstatus\n5.8 Check loan utilization\nlearning\n• Brainstorming\nby group/group\ndynamics\n• Role playing\n• Buzz sessions\n6. Collect dues\n\n6.1 Receive collection reports\n6.2 Receive payment\n6.3 Sign repayment schedule\n6.4 Record collection on group\ntreasurer’s register\n6.5 Record collection on client’s\npassbook\n6.6 Record collection on loan\nofficer’s register\n6.7 Consolidate total collection\n6.8 Issue cash receipts/official\nreceipts\n6.9 Turnover/deposit collection\n6.10 Investigate Reason/s for\ndelayed payments\n6.11 Deal with delinquent\nmembers\n6.12 Recommend/execute\nplan of actions to settle\ndelinquent account/s\n6.13\nSubmit incident report\n• Self-pace\nmodular\n• Lecture\n• Demonstration\n• Discussion with\nclass\ninteractions\n• Simulation\n• Case\nstudy/case\nanalysis\n• Practicum/Wor\nk integrated\nlearning\n• Brainstorming\nby group/group\ndynamics\n• Role playing\n• Buzz sessions\n• Written\nExamination\n• Demonstration\nof Practical\nSkills\n• Assertion &\nReason\n• Checklist\n• Logbook\n7. Update\nfinancial\nrecords\n7.1 Review transaction report\n7.2 Prepare loan disbursement\nmaster roll\n7.3 Record daily collection on\ndaily collection sheet\n7.4 Submit daily monitoring\nreport\n7.5 Summarize collection on\nloan officer’s summary book\n7.6 Prepare monthly plan\n7.7 Prepare annual\ndevelopment action plan\n•\nSelf-pace\nmodular\n•\nLecture\n•\nDemonstration\n•\nDiscussion\nwith class\ninteractions\n•\nSimulation\n•\nCase\nstudy/case\nanalysis\n•\nPracticum/Wor\nk integrated\nlearning\n•\nBrainstorming\nby group/\ngroup\ndynamics\n•\nRole playing\n•\nBuzz sessions\n• Written\nExamination\n• Demonstration\nof Practical\nSkills\n• Assertion &\nReason\n• Checklist\n• Logbook\n\n--- PDF PAGE 62 ---\nTR -Microfinance Technology NC II\n\n57\n3.2\nTRAINING DELIVERY\n\nThe delivery of training should adhere to the design of the curriculum.\nDelivery should be guided by the 10 basic principles of the competency-based\nTVET.\n\n•\nThe training is based on curriculum developed from the competency\nstandards;\n•\nLearning is modular in its structure;\n•\nTraining delivery is individualized and self-paced;\n•\nTraining is based on work that must be performed;\n•\nTraining materials are directly related to the competency standards and the\ncurriculum modules;\n•\nAssessment is based in the collection of evidence of the performance of\nwork to the industry required standards;\n•\nTraining is based both on and off-the-job components;\n•\nAllows for recognition of prior learning (RPL) or current competencies;\n•\nTraining allows for multiple entry and exit; and\n•\nApproved training programs are nationally accredited.\n\nThe competency-based TVET system recognizes various types of delivery\nmodes, both on and off-the-job as long as the learning is driven by the competency\nstandards specified by the industry. The following training modalities may be\nadopted when designing training programs:\n\n•\nThe dual training system mode of training delivery is preferred and\nrecommended. Thus programs would contain both in-school and in-plant\ntraining or workplace components. Details can be referred to the Dual\nTraining System Law (R.A.6786) Implementing Rules and Regulations;\n•\nModular/self-paced learning is a competency-based training modality\nwherein the trainee is allowed to progress at his own pace. The\ninstructor/trainer facilitates the training delivery;\n•\nPeer teaching/mentoring is a training modality wherein fast learners are\ngiven the opportunity to assist the slow learners;\n•\nSupervised industry training or on-the-job training is an approach in training\ndesigned to enhance the knowledge and skills of the trainee through actual\nexperience in the workplace to acquire specific competencies prescribed in\nthe training regulations; and\n•\nDistance learning is a formal education process in which majority of the\ninstruction occurs when the students and instructors/trainers are not in the\nsame place. Distance learning may employ correspondence study, or\naudio, video or computer technologies;\n\n--- PDF PAGE 63 ---\nTR -Microfinance Technology NC II\n\n58\n3.3\nTRAINEE ENTRY REQUIREMENTS\n\nTrainees or students wishing to gain entry into this course should possess\nthe following requirements:\n\n•\n can communicate both in oral and in written;\n•\nmust be physically and mentally fit;\n•\nwith good moral character;\n•\nhigh school graduate; and\n•\nat least 16 years old.\n\nThis list does not include specific institutional requirements such as\neducational attainment, appropriate work experience, and others that may be\nrequired of the students/trainees by the educational institution or training center\ndelivering the TVET program.\n\n3.4\nLIST OF TOOLS, EQUIPMENT AND MATERIALS\n\nMICROFINANCE TECHNOLOGY – NC II\n\nRecommended list of tools, equipment and materials for the training of 30 trainees\nfor Microfinance Technology – NC II\nQUANTITY\nTOOLS, EQUIPMENT and FURNITURES\n30 sets\nComputer sets w/ MS office application software\n1 unit\nLaptop computer\n1 units\nWireless G Router, up to 54Mbps\n30 pcs\nCalculator, hand-held type\n15 units\nMechanical typewriter, portable type\n2 units\nMultimedia projector\n2 units\nProjection screen\n 2 pcs\nLaser pointer\n2 units\nPrinter, deskjet\n2 units\nPrinter, laserjet\n2 units\nScanner\n2 units\nFax machine\n1 unit\nPhotocopier, heavy duty-type\n1 unit\nColored television 24-inch\n1 unit\nDVD player recorder\n1 unit\nKaraoke set with AM/FM, cassette & CD/DVD\nplayers, with 2 microphones\n1 unit\nLapel microphone w/ receiver/transmitter\n2 sets\nTelephones with 2 external lines\n30 pcs\nStorage Device, USB flash drives\n30 pcs\nStorage device, CD-R optical drives\n1 pc.\nStapler, big size\n1 pc.\nMasking/scotch tape dispenser\n1 unit\nMoney Detector\n10 pcs\nMagnet, U-type or bar-type\n10 pcs\nMagnifier, hand-held\n2 units\nWhite board 4ft x 8ft, wall-mounted\n\n--- PDF PAGE 64 ---\nTR -Microfinance Technology NC II\n\n59\nQUANTITY\nTOOLS, EQUIPMENT and FURNITURES\n1 unit\nWhite board 4ft x 4ft, portable w/ wheels\n30 units\nArmchair with steel framing, fiberglass sit & backrest\n15 units\nComputer table good for 2 units per table, wooden\n2 units\nComputer workstation, single-type w/ metal framing\n30 units\nOffice chairs for computer laboratory\n2 sets\nTeacher’s table w/ office chair w/ rollers\n2 sets\nOffice wooden table w/ office chair w/ rollers\n2 units\nSteel filing cabinet, 4-layer type\n\nQUANTITY\nSUPPLIES and MATERIALS\n5 reams\nBond papers, short size\n5 reams\nBond papers, A4 size\n2 rolls\nThermal paper for fax machine\n12 pcs\nPrinter inkjet print cartridge, black\n4 pcs\nPrinter inkjet print cartridge, colored\n2 pcs\nPrinter toner\n300 pcs\nMeta plan cards, assorted colors\n2 rolls\nMasking tape 1-inch width\n2 rolls\nScotch tape 1-inch width\n8 pcs\nWhiteboard markers: black, blue, red & green\n2 pcs\nBoard eraser\n1 box\nStaple wires, No.35 (5,000 wires per box)\n50 sheets\nManila Paper\n15 pcs\nPermanent markers: black, blue, & red\n15 pcs\nRuler 12 inches\n60 pcs\nBallpen: black & red\n60 pcs\nFolders, long size\n60 pcs\nEnvelope, short size\n\nQUANTITY\nOFFICE FORMS/DOCUMENTS\n2 sets\nMFI Operational Handbook/Manual\n100 pcs\nDeposit slips\n100 pcs\nDenomination slips\n200 pcs\nOfficial Receipts\n100 pcs\nDebit voucher\n31 pcs\nGeneral/Subsidiary Ledger\n500 pcs\nLoan application sheets\n15 pcs\nLocation Map\n500 pcs\nSurvey questionnaires and interview guides\n30 pcs\nLogbook/class record\n200 pcs\nForms (Collection report forms, , insurance form and\nother standard forms)\n31 pcs\nBible (Old and New Testaments, handy size), and\nother inspirational reading materials\n500 pcs\nPromotional materials (flyers, posters, brochures,\nstreamers)\n\n--- PDF PAGE 65 ---\nTR -Microfinance Technology NC II\n\n60\n\n3.5\nTRAINING FACILITIES\n\nMICROFINANCE TECHNOLOGY - NC II\n\nThe microfinance training venue must be concrete structure. Based on class size\nof 30 students/trainees the space requirements for the teaching/learning and\ncirculation areas are as follows:\n\nTEACHING/\nLEARNING AREAS\nSIZE\n(in meter)\nAREA\n(in sq. meters)\nTOTAL AREA\n(in sq. meters)\n• Lecture area\n6 x 8\n48\n48\n• Computer room\n7 x 8\n56\n56\n• Virtual office\n4 x 5\n20\n20\n• Learning\nresources/storage\n5 x 7\n35\n35\n• Wash room\n2 x 5\n10x2\n20\n• Circulation area **\n54\n54\nTotal Floor Area\n233\n** Area requirement is equivalent to 30% of the total teaching learning areas\n\n3.6\nTRAINER’S QUALIFICATION\n\nMICROFINANCE TECHNOLOGY NC II\n\n•\nMust be a holder of Microfinance Technology NC II;\n•\nMust have undergone training on Training Methodology II (TM II) 1\n•\nMust be computer literate;\n•\nMust be physically and mentally fit;\n•\nWith good moral character;\n•\nHave good communication skills;\n•\nMust be a holder of B.S. in Business Administration, B.S. in Accountancy or\nany related course;*\n•\nMust have passed appropriate Civil Service eligibility (for government training\ninstitutions)*\n•\nPreferably having 18 education units*\n\n1 This shall be changed to “Must be a holder of Trainer Qualification Level II (TQ II)\nor equivalent “upon promulgation by the TESDA Board of the TQ/AQ training\nregulations\n\n*Optional. Only when required by the hiring institution\n\nReference: TESDA Board Resolution No. 2004-03\n\n--- PDF PAGE 66 ---\nTR -Microfinance Technology NC II\n\n61"
