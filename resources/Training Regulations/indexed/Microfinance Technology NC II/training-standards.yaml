    "source_text": "3.1\nCURRICULUM DESIGN\n\nCourse Title\n:\nMICROFINANCE TECHNOLOGY COURSE\n\nNominal Duration\n: Basic\n-\n18 Hours\n\nCommon\n-\n74 Hours\n\nCore\n-\n311 Hours\n\nQualification Level\n: NC II\n\nCourse Description:\n\n This course is designed to provide basic knowledge, skills and desirable attitudes to\nindividual who would like to become a Microfinance Loan Officer and be competent to\ninteract with clients in providing microfinance loan and other services for start-\nup/expansion of a small or micro enterprise. It covers competencies such as selecting\npotential area for microfinance operation, promoting products and other services, forming\ngroup of microfinance clients, facilitating center meeting, processing application for loans\nand other services, collecting dues, and updating financial records.\n Basic competencies such as: Participate in workplace communication; Work in a\nteam environment; Practice career professionalism; Practice occupational health and\nsafety are included.\n It also includes common competencies such as: Provide quality customer service;\nComply with quality and ethical standards; and Perform computer operations.\n To obtain this, all units prescribed for this qualification must be achieved.\n\nBASIC COMPETENCIES\n(18 Hours)\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and convey\nworkplace information\n1.2 Complete relevant work\nrelated documents\n1.3 Participate in workplace\nmeeting and discussion\n• Group\ndiscussion\n• Interaction\n• Lecture\n• Reportorial\n• Written test\n• Practical/\nperformance\ntest\n• Interview\n\n--- PDF PAGE 57 ---\nTR -Microfinance Technology NC II\n\n52\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n2. Work in a team\nenvironment\n2.1 Describe and identify team\nrole and responsibility in a\nteam.\n2.2 Describe work as a team\nmember.\n• Group\ndiscussion\n• Interaction\n• Lecture\n• Case studies\n• Simulation\n• Written test\n• Practical/\nperformance\ntest\n• Interview\n• Observation of\nwork activities\n• Observation\nthrough\nsimulation or\nrole play\n• Case studies\nand scenarios\n3. Practice career\nprofessionalism\n3.1 Integrate personal\nobjectives with\norganizational goals\n3.2 Set and meet work\nproblems\n3.3 Maintain professional\ngrowth and development\n• Interactive\nlecture\n• Simulation\n• Demonstration\n• Self paced\ninstruction\n• Group\ndiscussion\n• Structured\nactivity\n• Film viewing\n•Role play\n• Role play\n• Interviews\n• Written test\n• Demonstration\n• Portfolio\nassessment\n\n4. Practice\noccupational\nhealth and\nsafety\n4.1 Identify hazards and risks\n4.2 Evaluate hazards and\nrisks\n4.3 Control hazards and risks\n4.4 Maintain occupational\nhealth and safety (OHS)\nawareness\n• Interactive-\nlecture\n• Simulation\n• Symposium\n• Group\nDynamics\n• Situation\nanalysis\n• Film viewing\n• Self pace\ninstruction\n• Case/Situation\nanalysis\n• Interview\n• Practical\nexamination\n• Written exam\n• Simulation\n• Demonstration\n• Portfolio\nassessment\n\n--- PDF PAGE 58 ---\nTR -Microfinance Technology NC II\n\n53\nCOMMON COMPETENCIES\n(74 Hours)\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Provide\nQuality\nCustomer\nService\n\n1.1 Update knowledge of\nproducts and services\n1.2 Assess needs of new and\nexisting clients\n1.3 Conduct client satisfaction\nsurvey\n•\nSelf-pace\nmodular\n•\nLecture\n•\nDiscussion\n•\nCase studies\n•\nDemonstration\n•\nSimulation\n•\nRole play\n•\nPracticum\n• Written\nExamination\n• Demonstration\nof Practical\nSkills\n• Assertion &\nReason\n• Checklist\n•\nLogbook\n2. Comply with\nQuality and\nEthical\nstandards\n2.1 Assess quality of received\nmaterials\n2.2 Assess own work/output\n2.3 Submit oneself to third\nparty assessment\n•\nSelf-pace\nmodular\n•\nLecture\n•\nDiscussion\n•\nCase studies\n•\nDemonstration\n•\nSimulation\n•\nRole play\n•\nPracticum\n• Written\nExamination\n• Demonstration\nof Practical\nSkills\n• Assertion &\nReason\n• Checklist\n•\nLogbook\n3. Performing\nComputer\nOperations\n3.1 Plan and prepare for\nassigned task\n3.2 Encode data\n3.3 Access information\n3.4 Produce data\n3.5 Use the internet to access\ninformation\n3.6 Maintain computer\nequipment and systems\n•\nSelf-pace\nmodular\n•\nLecture\n•\nDiscussion\n•\nCase studies\n•\nDemonstration\n•\nSimulation\n•\nRole play\n•\nPracticum\n• Written\nExamination\n• Demonstration\nof Practical\nSkills\n• Assertion &\nReason\n• Checklist\n•\nLogbook\n\n--- PDF PAGE 59 ---\nTR -Microfinance Technology NC II\n\n54\nCORE COMPETENCIES\n(311 Hours)\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Select potential\narea for\n1.1 Conduct area scanning /\nmapping\n1.2 Coordinate with concerned\ngovernment office\n1.3 Review barangay profile\n1.4 Conduct area survey\n1.5 Conduct interviews\n1.6 Process survey and\ninterview data\n•\nSelf-pace\nmodular\n•\nLecture\n•\nDemonstration\n•\nDiscussion\nwith class\ninteractions\n•\nSimulation\n•\nCase\nstudy/case\nanalysis\n•\nPracticum/Wor\nk integrated\nlearning\n•\nBrainstorming\nby\ngroup/group\ndynamics\n•\nRole playing\n•\nBuzz sessions\n• Written\nExamination\n• Demonstration\nof Practical\nSkills\n• Assertion &\nReason\n• Checklist\n• Logbook\n2. Promote\nmicrofinance\nproducts and\nother services\n2.1 Introduce loan products and\nservices\n2.2 Conduct orientation and\nbriefings on microfinance\nproducts and services\n2.3 Facilitate/Coordinate\nmicrofinance training\nprogram\n2.4 Assist clients ion promoting\ntheir products\n2.5 Administer survey on\nenhancement of MFI\nproducts and services\n•\nSelf-pace\nmodular\n•\nLecture\n•\nDemonstration\n•\nDiscussion\nwith class\ninteractions\n•\nSimulation\n•\nCase\nstudy/case\nanalysis\n•\nPracticum/Wor\nk integrated\nlearning\n•\nBrainstorming\nby\ngroup/group\ndynamics\n•\nRole playing\n•\nBuzz sessions\n• Written\nExamination\n• Demonstration\nof Practical\nSkills\n• Assertion &\nReason\n• Checklist\n• Logbook\n3. Form group of\nmicrofinance\nclients\n3.1 Meet with barangay official/s\n3.2 Orient target clients\n3.3 Schedule and conduct\nfamily background\ninvestigation/CCI/BI\n• Self-pace\nmodular\n• Lecture\n• Demonstration\n• Discussion with\n• Written\nExamination\n• Demonstration\nof Practical\nSkills\n\n--- PDF PAGE 60 ---\nTR -Microfinance Technology NC II\n\n55\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n3.4 Organize\ngroup/center/cluster\n3.5 Orient group\nofficers/center/officer on\ntheir roles and\nresponsibilities\n3.6 Facilitate group/center\nofficer meetings\nclass\ninteractions\n• Simulation\n• Case\nstudy/case\nanalysis\n• Practicum/Wor\nk integrated\nlearning\n• Brainstorming\nby group/group\ndynamics\n• Role playing\n• Buzz sessions\n• Assertion &\nReason\n• Checklist\n• Logbook\n4. Facilitate center\nmeetings\n4.1 Lead opening and closing\nprayers\n4.2 Present scheduled topic/s\n4.3 Facilitate group discussion\n4.4 Check clients attendance\n4.5 Facilitate center/cluster\nmeeting\n4.6 Facilitate open forum\n4.7 Counsel clients on\npersonal/family problems\n4.8 Resolve conflict among\nclients\n• Self-pace\nmodular\n• Lecture\n• Demonstration\n• Discussion with\nclass\ninteractions\n• Simulation\n• Case\nstudy/case\nanalysis\n• Practicum/Wor\nk integrated\nlearning\n• Brainstorming\nby group/group\ndynamics\n• Role playing\n• Buzz sessions\n• Written\nExamination\n• Demonstration\nof Practical\nSkills\n• Assertion &\nReason\n• Checklist\n• Logbook\n5. Process\napplication for\nloans and other\nproducts/servic\nes\n5.1 Issue applications for loans\nand other products/services\n5.2 Gather applications for loans\nand other products/services\n5.3 Evaluate loan applicant\nand/or insurance\napplicant/claimant\n5.4 Evaluate loan and/or\ninsurance documents\n5.5 Prepare summary of loan\napplications and/or\ninsurance\n5.6 Recommend qualified loan\napplicants and/or insurance\n• Self-pace\nmodular\n• Lecture\n• Demonstration\n• Discussion with\nclass\ninteractions\n• Simulation\n• Case\nstudy/case\nanalysis\n• Practicum/\nWork\nintegrated\n• Written\nExamination\n• Demonstration\nof Practical\nSkills\n• Assertion &\nReason\n• Checklist\n• Logbook\n\n--- PDF PAGE 61 ---\nTR -Microfinance Technology NC II\n\n56\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\nclaimant\n5.7 Inform clients about loan\napplication and/or insurance\nstatus\n5.8 Check loan utilization\nlearning\n• Brainstorming\nby group/group\ndynamics\n• Role playing\n• Buzz sessions\n6. Collect dues\n\n6.1 Receive collection reports\n6.2 Receive payment\n6.3 Sign repayment schedule\n6.4 Record collection on group\ntreasurer’s register\n6.5 Record collection on client’s\npassbook\n6.6 Record collection on loan\nofficer’s register\n6.7 Consolidate total collection\n6.8 Issue cash receipts/official\nreceipts\n6.9 Turnover/deposit collection\n6.10 Investigate Reason/s for\ndelayed payments\n6.11 Deal with delinquent\nmembers\n6.12 Recommend/execute\nplan of actions to settle\ndelinquent account/s\n6.13\nSubmit incident report\n• Self-pace\nmodular\n• Lecture\n• Demonstration\n• Discussion with\nclass\ninteractions\n• Simulation\n• Case\nstudy/case\nanalysis\n• Practicum/Wor\nk integrated\nlearning\n• Brainstorming\nby group/group\ndynamics\n• Role playing\n• Buzz sessions\n• Written\nExamination\n• Demonstration\nof Practical\nSkills\n• Assertion &\nReason\n• Checklist\n• Logbook\n7. Update\nfinancial\nrecords\n7.1 Review transaction report\n7.2 Prepare loan disbursement\nmaster roll\n7.3 Record daily collection on\ndaily collection sheet\n7.4 Submit daily monitoring\nreport\n7.5 Summarize collection on\nloan officer’s summary book\n7.6 Prepare monthly plan\n7.7 Prepare annual\ndevelopment action plan\n•\nSelf-pace\nmodular\n•\nLecture\n•\nDemonstration\n•\nDiscussion\nwith class\ninteractions\n•\nSimulation\n•