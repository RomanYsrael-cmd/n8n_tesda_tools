        "source_text": "ALT823303\nUNIT DESCRIPTOR : This competency covers the interpretation of product\nspecifications, selection of required materials and equipment,\norganizing delivery and confirmation of material/equipment\ndelivery to the production area in preparation for production.\n This competency is typically performed by operators working\neither independently or as a part of a work team\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Identify required\nmaterials and\nequipment\n1.1\nProduct specifications is interpreted according to job\nrequirement and work instruction\n1.2\nRequired materials including additives are identified based on\nthe given specifications\n1.3\nTrade names for required product is identified according to job\norder\n1.4\nQuantity of materials required for product is determined without\nerror\n1.5\nRequired equipment including handling, control and material\npreparation equipment and tools are identified based on the\ngiven work instruction\n2. Select materials\nand equipment\n2.1\nRequired materials, equipment and machinery are located and\nmade available\n2.2\nItems are marked-off on checklist as required and without error\n2.3\nHolding area is identified and prepared according to work\nrequirements.\n3. Assemble\nmaterials and\nequipment\n3.1\nGood manual handling practices are used in accordance with\ncompany standard operating procedures\n3.2\nRequired procedures, particularly OHS procedures, codes and\npractices is followed and observed per identified hazards.\n3.3\nMaterials are collected and organized in a manner that ensures\nstorage compatibility\n3.4\nMaterials are checked visually according to enterprise\nrequirements\n3.5\nHolding sample are collected according to enterprise\nrequirements\n3.6\nDetails of specification and sample are recorded as required\n4. Organize internal\nworkplace\ndelivery of\nmaterials/\nequipment\n4.1\nPlacement of material are organize to required locations using\nenterprise procedures\n4.2\nDelivery is notified and confirmed as per enterprise\nrequirements/procedures\n4.3\nWorkplace procedures is followed as required by enterprise\n5. Store materials\nfor production\n5.1\nStorage requirements is identified according to job requirement\n5.2\nHolding area conditions is checked to meet material\nrequirements\n5.3\nMaterials are stored as required for production and to meet\nhealth and safety needs\n5.4\nRequired workplace documentation/records are completed\n\n--- PDF PAGE 37 ---\nTR-PLASTIC MACHINE OPERATION NC II Promulgated\n\n33\n RANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Equipment and tools\n1.1.\nHand carts and trolleys\n1.2.\nBung spanners and similar\n1.3.\nKnives and other bag opening equipment\n1.4.\nHoists/lifting equipment\n1.5.\nHand tools\n2. Hazards\nTypical hazards include:\n2.1.\nSpills\n2.2.\nDusts/vapors\n2.3.\nHazardous materials\n2.4.\nManual handling hazards\n2.5.\nKnife hazards\n3. Procedures\n3.1.\nWorkplace procedures\n3.2.\nWork instructions\n3.3.\nInstructions and relevant industry and government\ncodes and standards\n\n--- PDF PAGE 38 ---\nTR-PLASTIC MACHINE OPERATION NC II Promulgated\n\n34\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1. Identified required materials and equipment\n1.2. Selected materials and equipment\n1.3. Assembled materials and equipment\n1.4. Organized internal workplace delivery of materials/\nequipment\n1.5. Stored materials for production\n2. Underpinning\nknowledge and\nattitudes\n\n2.1. Formulas of common plastics\n2.2. Knowledge and application of polymer materials\n2.3. Production workflow sequences and materials demand\n2.4. Different trade names of common plastic materials\n2.5. Kinds of end use examples of plastics by type and common\nfamily names\n2.6. Materials safety data sheets\n2.7. Safety and emergency procedures in handling and storing\nproducts\n2.8.Positive work values, honesty in the workplace\n3. Underpinning skills\n3.1. Ability to read and interpret typical product specifications,\njob sheets and material labels as provided to operators\n3.2. Proper use of measuring equipment\n3.3. Participate in workplace meetings and discussions\n3.4. Complete work related documents\n3.5. Computing basic mathematical processes of addition,\nsubtraction, division and multiplication\n3.6. Gather and provide information in response to workplace\nRequirements\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1. Suitable access to an operating plant or equipment that\nallows for appropriate and realistic simulation\n4.2. A bank of case studies/scenarios\n4.3. Supplies and consumable materials\n4.4.Engineering manuals\n5. Method of\nassessment\nCompetency MUST be assessed through:\n5.1. Direct Observation with questioning\n5.2. Oral interview and written test\n5.3. Portfolio assessment\n6. Context of\nassessment\n6.1. Competency may be assessed individually in the actual\nworkplace or a simulated workplace environment.\n6.2. Practical skills must take place only after a period of\nsupervised practice and repetitive experience.\n6.3. Prescribe outcome must be able to achieve without direct\nsupervision.\n\n--- PDF PAGE 39 ---\nTR-PLASTIC MACHINE OPERATION NC II Promulgated\n\n35\n\nUNIT OF COMPETENCY: OPERATE INJECTION MOLDING EQUIPMENT\nUNIT CODE\n :"
