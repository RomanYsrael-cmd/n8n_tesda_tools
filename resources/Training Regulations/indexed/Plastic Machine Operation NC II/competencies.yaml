        "source_title": "PREPARE MATERIALS TO FORMULAE",
        "source_text": "--- PDF PAGE 33 ---\nTR-PLASTIC MACHINE OPERATION NC II         Promulgated                                            \n \n29\n \n \nUNIT OF COMPETENCY:    PREPARE MATERIALS TO FORMULAE \nUNIT CODE \n     :    ALT823302 \nUNIT DESCRIPTOR      : This competency covers preparing materials to formulate for \nproduction or product finishing.  \nThis competency is typically performed by operators working \neither independently or as a part of a work team. \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables\n1. Identify \nrequirements to \nhandle \nmaterials \n1.1 \nSpecifications are read and interpreted and materials are \nidentified \n1.2 \nUnits of measurement and matching measuring equipment and \ntools are identified  \n1.3 \nTolerances of measuring equipment is determined the and \nrelated them to the impact of over/under measurement of \ningredients on production process and quality \n1.4 \nProcedures are followed to prevent/control the identified \nhazards \n1.5 \nWorkplace procedures is read, understood and used to plan \nwork sequence.\n2. Prepare for \nassembly of \ningredients \n2.1 \nAppropriate measurement scales are identified  \n2.2 \nEquipment for measurement is calibrated to zero  \n2.3 \nRequired personal protection equipment is worn according to \ncompany standard operating procedure \n2.4 \nEquipment for assembly undergone pre-start checking and \nensured safe guards for emergencies situations are in place. \n2.5 \nWork area is checked for cleanliness \n2.6 \nSources of potential contamination are identified and steps to \nminimize/eliminate contamination risk are taken\n3. Assemble \ningredients \n3.1 \nIngredients are collected, weighed/measured according to \nprocedure and formula sheet \n3.2 \nCorrectness of color is checked if conforms to standard  \n3.3 \nAction is taken in procedures if materials/assembled ingredients \ndo not appear to meet requirements \n3.4 \nStandard operating procedures and appropriate safety \nmeasures is followed and observed when conducting work \n3.5 \nAppropriate workplace-approved sequence is follow for \ncombination of materials \n3.6 \nWorkplace records is complete according to company standard \noperating procedures  \n3.7\nUnused ingredients are cleaned and stored,\n\n--- PDF PAGE 34 ---\nTR-PLASTIC MACHINE OPERATION NC II         Promulgated                                            \n \n30\n \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Equipment and tools \n1.1. \nMeasuring equipment \n1.2. \nKnives and other bag opening equipment \n1.3. \nHoists/lifting equipment \n1.4.\nHand tools\n2. Hazards \nTypical hazards include: \n2.1. \nSpills \n2.2. \nDusts/vapors \n2.3. \nHazardous materials \n2.4. \nManual handling hazards \n2.5.\nKnife hazards\n3. Procedures \n3.1. \nWorkplace procedures   \n3.2. \nWork instructions  \n3.3. \nInstructions and relevant industry and government \ncodes and standards\n4. Personal protective \nequipment \n4.1. \nRespiratory mask \n4.2. \nFace shield \n4.3. \nSafety shoes \n4.4.\nApron\n5. Potential contaminants \n5.1. \nOil/grease \n5.2. \nDust \n5.3. \nDirt \n5.4.\nMetal burrs\n\n--- PDF PAGE 35 ---\nTR-PLASTIC MACHINE OPERATION NC II         Promulgated                                            \n \n31\nEVIDENCE GUIDE \n \n1. Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1. Used measuring scales equipment and tools. \n1.2. Identified, used, interpreted and applied relevant formulae \nand information \n1.3. Maintained workplace records for materials used and mixes \nproduced \n1.4. Identified and safely handled products and materials \napplying safety precautions appropriate to the task \nincluding safe storage of materials \n1.5. Took precautionary measures in handling material with \ncritical properties and quantities \n2. Underpinning \nknowledge and \nattitudes \n \n2.1. Understand potential situations requiring action result in \nimplementing appropriate action manuals \n2.2. Particular application or use of material handling equipment \n2.3. Company policies and procedures \n2.4. Company OH&S procedures \n2.5. Maintenance and calibration of measuring equipment \n3. Underpinning skills \n3.1. Ability to read and interpret typical product specifications, \njob sheets and material labels as provided to operators \n3.2. Proper use of measuring equipment \n3.3. Participate in workplace meetings and discussions \n3.4. Complete work related documents \n3.5. Basic mathematical processes of addition, subtraction, \ndivision and multiplication \n3.6. Gather and provide information in response to workplace \nrequirements\n4. Resource \nimplications \nThe following resources MUST be provided: \n4.1. Suitable access to an operating plant or equipment that \nallows for appropriate and realistic simulation \n4.2. A bank of case studies/scenarios \n4.3. Supplies and consumable materials \n4.4. Engineering manuals \n5. Method of \nassessment \nCompetency MUST be assessed through: \n5.1. Direct Observation with questioning \n5.2. Oral interview and written test \n5.3. Portfolio assessment\n6. Context of \nassessment \n6.1. Competency may be assessed individually in the actual \nworkplace or a simulated workplace environment. \n6.2. Practical skills must take place only after a period of \nsupervised practice and repetitive experience. \n6.3. Prescribe outcome must be able to achieve without direct \nsupervision.\n",
