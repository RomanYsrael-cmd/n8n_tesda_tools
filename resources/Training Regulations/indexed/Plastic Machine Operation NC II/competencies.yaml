        "source_title": "PREPARE MOLDS FOR COMPOSITES PRODUCTION",
        "source_text": "--- PDF PAGE 30 ---\nTR-PLASTIC MACHINE OPERATION NC II         Promulgated                                            \n \n26\nCORE COMPETENCIES \n \nUNIT OF COMPETENCY:    PREPARE MOLDS FOR COMPOSITES PRODUCTION \nUNIT CODE \n     :    ALT823301 \nUNIT DESCRIPTOR      : This competency covers the demolding and preparation of \ncomposites molds (single and multi-cavity molds) for the \napplication by hand or machine of gel coating, or other first \ncoat, in preparation for composites production. It also covers \nthe inspection and temporary repair of minor mold surface \ndefects.  \nThis competency is typically performed by operators working \neither independently or as part of a work team. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables\n1 \nPrepare \nsurfaces \n1.1 Surfaces are prepared according to industry standard \nprocedures \n1.2 Temporary repairs are made as needed \n1.3 Tools and equipment and work area are cleaned up when \nsurface preparation is completed\n2 \nApply mold \nrelease \nsystem \n2.1 Mold release system is selected for the job \n2.2 Mold release system is applied to mold surfaces as per \nmanufacturer’s specifications \n2.3 Surface release system undergone tape-test according to \nworkplace standard operating procedure.\n3 \nMask-up mold \n3.1 Suitable masking tape is selected  \n3.2 Masking tape and other materials is applied to mold according to \nstandard operating procedures.\n\n--- PDF PAGE 31 ---\nTR-PLASTIC MACHINE OPERATION NC II         Promulgated                                            \n \n27\nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Industry Standard \nProcedures \nProcedure means all relevant: \n1.1. \nWorkplace procedures \n1.2. \nWork instruction \n1.3. \nTemporary instructions \n1.4.\nIndustry and government codes and standards\n2. Tools and equipment \n2.1. \nHand finishing tools \n2.2. \nPlastic scrapers \n2.3. \nBuffs and polishes \n2.4. \nPPE like gloves, respirator mask, face shield, safety \nshoes\n3. Mold release system \n3.1. \nOperation of all relevant additional equipment that is \nintegral to the surface preparation process \n3.2. \nDemolding of a previous product or protective \nsurface to procedures \n4. Mold \nMold in terms of product size such as below but excluding \ndash panel boards and the likes: \n4.1. \nLight housing \n4.2. \nConsole box \n4.3. \nWasher tank \n4.4.\nBottle\n\n--- PDF PAGE 32 ---\nTR-PLASTIC MACHINE OPERATION NC II         Promulgated                                            \n \n28\nEVIDENCE GUIDE \n \n1. Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1. Prepared surfaces  \n1.2. Identified repairs and appropriate action is taken. \n1.3. Applied mold release system \n1.4. Masked-up mold \n1.5. Followed all safety procedures\n2. Underpinning \nknowledge and \nattitudes \n \n2.1. Understand effects of contamination on surface quality \n2.2. Kinds of equipment, tools and consumables required to \ndeliver the specified mold surface  \n2.3. Different types of mold release systems \n2.4. Different application techniques for the mold release \nsystems used \n2.5. Typical problems with each mold release system \n2.6. Faults caused by materials, contaminants and equipment \n2.7. Safety and emergency procedures in the workplace\n3. Underpinning skills \n3.1. Monitor equipment operation and surface quality \n3.2. Plan own work including predicting consequences and \nidentifying improvements \n3.3. Use PPE, safely handle products and materials, read \nrelevant safety information and apply safety precautions \nappropriate to the task. \n3.4. Perform routine workplace duties following simple written \nnotices  \n3.5. Select and use correctly equipment, materials, processes \nand procedures \n3.6. Participate in workplace meetings and discussions \n3.7. Complete work related documents \n3.8. Compute basic mathematical processes of addition, \nsubtraction, division and multiplication \n3.9. Gather and provide information in response to workplace \nrequirements\n4. Resource \nimplications \nThe following resources MUST be provided: \n4.1. Access to a range of mold release system and equipment. \n4.2. Tools, equipment and workplace relevant with the \nrequirements for the job. \n4.3. Supplies and consumable materials \n4.4. Engineering manuals \n5. Method of \nassessment \nCompetency MUST be assessed through: \n5.1. Direct Observation with questioning \n5.2. Written assessment \n5.3. Portfolio\n6. Context of \nassessment \n6.1. Competency may be assessed individually in the actual \nworkplace or a simulated workplace environment. \n6.2. Practical skills must take place only after a period of \nsupervised practice and repetitive experience. \n6.3. Prescribe outcome must be able to achieve without direct \nsupervision.\n",
