        "source_title": "FINISH PRODUCTS AND COMPONENTS",
        "source_text": "--- PDF PAGE 51 ---\nTR-PLASTIC MACHINE OPERATION NC II         Promulgated                                            \n \n47\nUNIT OF COMPETENCY   :   FINISH PRODUCTS AND COMPONENTS \n \nUNIT CODE \n         :    ALT823307 \n \nUNIT DESCRIPTOR           : This competency covers a range of processes subsequent to \nthe actual making of the product which have been grouped \ntogether under the heading of “finishing”. It applies to the \nfinishing of products for customer use and the finishing \ncomponents \nfor \nuse \nby \na \nsubsequent \nprocess \nor \norganization which may then further process or assemble \nthese components into a finished product, and similar \nactivities. It applies across all sectors of the industry.  \nThis competency is typically performed by personnel working \neither independently or as part of a work team.  \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables\n1. Establish \nrequirements for the \nfinishing process \n1.1 Work requirements are identify from procedures \n1.2 Equipment and consumables for the finishing process are \nassemble  \n1.3 Workplace procedures and materials safety data sheets are \nconsulted to confirm the work planning process \n1.4 Safety equipment are checked and ensured to be  available \nand in sound condition \n1.5 Products are removed from equipment if required using \nenterprise standard handling methods \n1.6 End-of-product run are recognize.\n2. Check quality of \nproduct \n2.1 Products are inspected to identify for routine or non-routine \nfinishing requirements. \n2.2 Significant fining, flash or other quality problems are \nidentified and reported to appropriate person for \ninvestigation of mold/die closure/alignment. \n2.3 Modifications are check with appropriate personnel \nregarding to finishing process. \n2.4 Non-conforming products are identified and processed in \naccordance with workplace procedures.\n3. Undertake the \nfinishing operation \n3.1 Products are trimmed as required \n3.2 Other secondary process operations are undertaken as \nrequired \n3.3 Waste and recycling procedures are followed according to \ncompany standard operating procedures  \n3.4 Finished products are inspected and compared to \nspecifications for suitability for further processing or for \ncustomer delivery \n3.5 Finished products are assembled and sorted in accordance \nwith procedures \n3.6 Products are packed as required and according to \npackaging/stacking specifications \n3.7 Product data are recorded as required \n3.8 Work area are cleaned up and housekeeping is performed\n\n--- PDF PAGE 52 ---\nTR-PLASTIC MACHINE OPERATION NC II         Promulgated                                            \n \n48\n \n \n4. Identify and rectify \nroutine product \nimperfections \n4.1 Range of routine imperfections that can occur during the \nproduction process are identified  \n4.2 Routine product imperfections are determined and \nrectified in accordance with procedures \n4.3 Appropriate records and log books are maintained and \nensure to meet procedures/work instructions. \n4.4 \nNon-routine product imperfections are identified and \nreported to designated person.\n\n--- PDF PAGE 53 ---\nTR-PLASTIC MACHINE OPERATION NC II         Promulgated                                            \n \n49\nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Equipment and \nconsumables \n1.1. Electric and/or air powered routers, saws, drills, drivers \nand sanders \n1.2. Hoist/jigs/lifting equipment \n1.3. Handling aids such as jigs and gantries \n1.4. Hand carts and trolleys \n1.5. Knives, files and scrapers \n1.6.\nBand saws, hand saws\n2. Safety equipment \nPersonal safety equipment include but not limited to: \n2.1. Gloves \n2.2. Goggles or face shields \n2.3. Safety shoes \n2.4. Apron \n2.5.\nRespiratory mask\n3. Routine imperfections \n3.1. Movement of jigs or fixtures \n3.2. Power failure \n3.3. Non-supply of materials \n3.4. Broken cords \n3.5.\nDamaged or inoperable equipment\n4. Routine product \nimperfections \n4.1. Variations in materials \n4.2. Temperature of product to be finished \n4.3. Movement of inserts, reinforcements or fittings \n4.4.\nSize of some products\n\n--- PDF PAGE 54 ---\nTR-PLASTIC MACHINE OPERATION NC II         Promulgated                                            \n \n50\nEVIDENCE GUIDE \n1. Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1. Established requirements for the finishing process and \nrecognized the importance of critical material properties \nand quantities to the finishing process \n1.2. Checked quality of product  \n1.3. Undertaken the finishing operation  \n1.4. Identified and rectified routine product imperfections and \nensured production standards are met consistently \n1.5. Followed safety procedures.\n2. Underpinning \nknowledge and \nattitudes \n \n2.1. Different selection and application of finishing process  \n2.2. Different tools and equipment for the process \n2.3. Safe handling of products \n2.4. Procedure in waste and recycling management \n2.5. Causes of faults such as :  \n flashing, distortion, stress marks, sinks, voids, short shot, \npoor color distribution, moisture marks, gassing, burn \nmarks \n inappropriate selection and use of finishing \nequipment/processes \n poor surface finish \n fining or shuts \n variations in section thickness  \n3. Underpinning skills \n3.1. Ability to read and interpret typical product specifications, \njob sheets and material labels as provided to operators \n3.2. Perform routine workplace duties following simple written \nnotices \n3.3. Participate in workplace meetings and discussions \n3.4. Complete work related documents \n3.5. Basic mathematical processes of addition, subtraction, \ndivision and multiplication \n3.6. Gather and provide information in response to workplace \nRequirements\n4. Resource \nimplications \nThe following resources MUST be provided: \n4.1. Suitable access to an operating plant or equipment for \nsimulation. \n4.2. Tools, equipment and workplace relevant with the \nrequirements for the job. \n4.3. Supplies and consumable materials \n4.4. Engineering manuals and drawings\n5. Method of \nassessment \nCompetency MUST be assessed through: \n5.1. Direct Observation with questioning \n5.2. Written examination\n6. Context of \nassessment \n6.1. Competency may be assessed individually in the actual \nworkplace or a simulated workplace environment. \n6.2. Practical skills must take place only after a period of \nsupervised practice and repetitive experience. \n6.3. Prescribe outcome must be able to achieve without direct \nsupervision.\n",
