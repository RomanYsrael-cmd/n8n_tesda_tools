          "source_text": "1 \nPrepare \nsurfaces \n1.1 Surfaces are prepared according to industry standard \nprocedures \n1.2 Temporary repairs are made as needed \n1.3 Tools and equipment and work area are cleaned up when \nsurface preparation is completed\n2 \nApply mold \nrelease \nsystem \n2.1 Mold release system is selected for the job \n2.2 Mold release system is applied to mold surfaces as per \nmanufacturer’s specifications \n2.3 Surface release system undergone tape-test according to \nworkplace standard operating procedure.\n3 \nMask-up mold \n3.1 Suitable masking tape is selected  \n3.2 Masking tape and other materials is applied to mold according to \nstandard operating procedures.\n\n--- PDF PAGE 31 ---\nTR-PLASTIC MACHINE OPERATION NC II         Promulgated                                            \n \n27\nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Industry Standard \nProcedures \nProcedure means all relevant: \n1.1. \nWorkplace procedures \n1.2. \nWork instruction \n1.3. \nTemporary instructions \n1.4.\nIndustry and government codes and standards\n2. Tools and equipment \n2.1. \nHand finishing tools \n2.2. \nPlastic scrapers \n2.3. \nBuffs and polishes \n2.4. \nPPE like gloves, respirator mask, face shield, safety \nshoes\n3. Mold release system \n3.1. \nOperation of all relevant additional equipment that is \nintegral to the surface preparation process \n3.2. \nDemolding of a previous product or protective \nsurface to procedures \n4. Mold \nMold in terms of product size such as below but excluding \ndash panel boards and the likes: \n4.1. \nLight housing \n4.2. \nConsole box \n4.3. \nWasher tank \n4.4.\nBottle\n\n--- PDF PAGE 32 ---\nTR-PLASTIC MACHINE OPERATION NC II         Promulgated                                            \n \n28"
