        "source_title": "OPERATE INJECTION MOLDING EQUIPMENT",
        "source_text": "--- PDF PAGE 39 ---\nTR-PLASTIC MACHINE OPERATION NC II         Promulgated                                            \n \n35\n \nUNIT OF COMPETENCY:    OPERATE INJECTION MOLDING EQUIPMENT \nUNIT CODE \n     :    ALT823304 \nUNIT DESCRIPTOR      : This competency covers the operation of injecting molding \nequipment and the resolving routine problems to produce \nplastic products. \n                                              This competency is typically performed by operators working \neither independently or as a part of a work team \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables\n1. Check work \nrequirements \n1.1 Work requirements are identified based on procedures \n1.2 Product, materials and equipment requirements are identified \nbased on the job requirements. \n1.3 Hazards are recognize and precautionary steps are adopted to \nensure safety \n1.4 Requirements are checked with supervisor/appropriate person if \nfound not in accordance with normal practice\n2. Conduct pre-\nstart checks as \nrequired \n2.1. Safety gates and guards are checked if in position and in working \ncondition \n2.2. Raw materials are checked for correctness based on product \nspecifications. \n2.3. Other pre-start checks are undertaken in accordance with \nprocedures\n3. Operate \nequipment \n3.1. Machine is started safely and correctly when required based on \nequipment operating instruction \n3.2. Process is check if within the required limits based on product \nspecifications \n3.3. Mold products are collected and stored as required \n3.4. Product/process are checked if within specification/ as to required \nquality standard \n3.5. Supply of materials is maintain as required \n3.6. Logs and records are completed when required \n3.7. Collection  and reprocessing/discarding scrapping/trimming of \nmaterials are undertaken in accordance with procedures \n3.8. Equipment and work area are cleaned up in accordance with \ncompany procedures \n3.9. Equipment is stopped/paused in an emergency, following \nworkplace and emergency procedures\n4. Resolve \nroutine \nproblems \n4.1. Routine problems/ faults likely to occur are identified during the \noperation and appropriate precautionary measures are readied \naccording to company standard operating procedures. \n4.2. Appropriate records and log books of equipment operations are  \nensure and maintained according to company procedures \n4.3. Non-routine problems are identified and reported to designated \nperson\n\n--- PDF PAGE 40 ---\nTR-PLASTIC MACHINE OPERATION NC II         Promulgated                                            \n \n36\nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Procedures \n1.1. Workplace procedures \n1.2. Work instructions \n1.3. Temporary instructions \n1.4. Industry and government codes and standards\n2. Equipment and tools \nEquipment and tools may include and but not limited to: \n2.1. Electrical, pneumatic, mechanical Electromechanical \nand hydraulic injection molding machines and \ncomponents such as base, frame, feed hoppers and \nmaterial supply mechanisms \n2.2. Die/tool \n2.3. Injection units \n2.4. Chillers/cooling towers  \n2.5. Die heating equipment  \n2.6. Hopper driers, mixing hoppers, dehumidifying driers \n2.7. Air compressors \n2.8. Dosing and Brushing machines \n2.9. Color blending equipment and conveyors \n2.10. Barrel and screw plastification unit \n2.11. Material loading equipment used for loading of raw \nmaterials \n2.12. Hand tools used in the injection molding process \n2.13. Personal protective equipment\n3. Hazards \nTypical hazards include: \n3.1. Spills \n3.2. Dusts vapors \n3.3. Slip and fall, particularly due to split granules \n3.4. Temperature \n3.5.  Hazardous substances \n3.6. Moving equipment \n3.7. Manual handling hazards\n4. Mold \nMold in terms of product size such as below but excluding \ndash panel boards and the likes: \n4.1 Light housing \n4.2 Console box \n4.3 Washer tank \n4.4 Bottle\n5. Routine problems/faults \nTypical routine process problems include: \n5.1. Equipment malfunction \n5.2. Variations in temperature, pressure, speed, injection \ndwell and clamp times \n5.3. Variations in materials or contamination of materials \n5.4. Die damage \nTypical routine product problems include: \n5.5. Routine injection molding faults \n5.6. Machine malfunction \n5.7. Die/tooling problem \n5.8. Splits, scorch, lack of bond \n5.9. Variations in material and/or contamination of materials\n\n--- PDF PAGE 41 ---\nTR-PLASTIC MACHINE OPERATION NC II         Promulgated                                            \n \n37\nEVIDENCE GUIDE \n \n1. Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1. Checked work requirements  \n1.2. Conducted pre-start checks as required  \n1.3. Operated equipment  \n1.4. Resolved routine problems  \n1.5. Took  appropriate action to resolve faults or report faults \nto appropriate personnel \n1.6. Explained and implemented emergency shutdown \nprocedures \n1.7. Ensured Injection molding production standards are met \nconsistently \n1.8. Ensured upstream and downstream communication is \ntimely and effective \n1.9. Read and interpreted correctly the operating procedures \nand work instructions  \n1.10. Identified problems and appropriate action is taken  \n1.11. Followed all safety procedures \n2. Underpinning \nknowledge and \nattitudes \n \n2.1. Operation of injection molding equipment and \ncomponents \n2.2. Production workflow sequences and materials demand \n2.3. Different reasons for checking process control panels and \nreporting readings which do not conform to the work \ninstructions \n2.4. Potential effects of variations in raw materials and \nequipment operation in relation to quality of product \n2.5. Waste management and importance of reusing non-\nconforming products wherever possible \n2.6. Correct selection and use of equipment, materials, \nprocesses and procedures \n2.7. Factors which may affect product quality or production \noutput and appropriate \n2.8. Possible causes of routine injection moulding faults \n2.9. Approved hazard control and safety procedures and the \nuse of PPE in relation to handling materials, equipment \noperation and cleanup\n3. Underpinning skills \n3.1. Plan own work including predicting consequences and \nidentifying improvements \n3.2. Monitor equipment operation and product quality \n3.3. Handle safely products and materials, read relevant safety \ninformation and apply safety precautions appropriate to \nthe task \n3.4. Pause equipment, or shut down equipment in abnormal \ncircumstances \n3.5. Participate in workplace meetings and discussions \n3.6. Complete work related documents \n3.7. Basic mathematical processes of addition, subtraction, \ndivision and multiplication \n3.8. Gather and provide information in response to workplace \nRequirements\n\n--- PDF PAGE 42 ---\nTR-PLASTIC MACHINE OPERATION NC II         Promulgated                                            \n \n38\n \n \n \n4. Resource \nimplications \nThe following resources MUST be provided: \n4.1. A bank of scenarios and questions \n4.2. Tools, equipment and workplace relevant with the \nrequirements for the job. \n4.3. Supplies and consumable materials \n4.4.\nEngineering manuals \n5. Method of \nassessment \nCompetency MUST be assessed through: \n5.1. Direct Observation with questioning \n5.2. Oral interview and written test \n5.3.\nPortfolio assessment\n6. Context of \nassessment \n6.1. Competency may be assessed individually in the actual \nworkplace or a simulated workplace environment. \n6.2. Practical skills must take place only after a period of \nsupervised practice and repetitive experience. \n6.3. Prescribe outcome must be able to achieve without direct \nsupervision.\n",
