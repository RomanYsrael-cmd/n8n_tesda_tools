quipment \n1.2. \nKnives and other bag opening equipment \n1.3. \nHoists/lifting equipment \n1.4.\nHand tools\n2. Hazards \nTypical hazards include: \n2.1. \nSpills \n2.2. \nDusts/vapors \n2.3. \nHazardous materials \n2.4. \nManual handling hazards \n2.5.\nKnife hazards\n3. Procedures \n3.1. \nWorkplace procedures   \n3.2. \nWork instructions  \n3.3. \nInstructions and relevant industry and government \ncodes and standards\n4. Personal protective \nequipment \n4.1. \nRespiratory mask \n4.2. \nFace shield \n4.3. \nSafety shoes \n4.4.\nApron\n5. Potential contaminants \n5.1. \nOil/grease \n5.2. \nDust \n5.3. \nDirt \n5.4.\nMetal burrs\n\n--- PDF PAGE 35 ---\nTR-PLASTIC MACHINE OPERATION NC II         Promulgated                                            \n \n31"
