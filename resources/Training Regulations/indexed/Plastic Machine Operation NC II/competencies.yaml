        "source_title": "OPERATE BLOW MOLDING EQUIPMENT",
        "source_text": "--- PDF PAGE 43 ---\nTR-PLASTIC MACHINE OPERATION NC II         Promulgated                                            \n \n39\n \n \nUNIT OF COMPETENCY:    OPERATE BLOW MOLDING EQUIPMENT \n \nUNIT CODE \n      :   ALT823305 \n \nUNIT DESCRIPTOR         : This competency covers the operation of blow molding \nequipment and the resolving of routine problems to procedure. \nThis competency is typically performed by operators working \neither independently or as part of a work team. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables\n1. Check work \nrequirements \n1.1 Work requirements is identified based on procedures \n1.2 Product, materials and tools and equipment  are identified \nbased on job requirements  \n1.3 Hazards are recognized and steps required to ensure safety are \nadopted and considered.  \n1.4 Requirements are checked with supervisor/appropriate person if \nfound not in accordance with normal practice\n2. Conduct pre-\nstart checks as \nrequired \n2.1 Safety gates and guards are checked if  in position and in \nworking condition \n2.2 Raw materials are check based on listed specification  \n2.3 Other pre-start checks are undertaken in accordance with \nprocedures\n3. Operate \nequipment \n3.1 Condition of equipment is checked and raw materials are \nintroduced as required by procedures \n3.2 Product/process is checked  if within required limits based on \nwork instruction \n3.3 Mold products are collected and stored as required \n3.4 Product/process is checked if within specification/ as to required \nquality standard \n3.5 Supply of materials is maintain as required \n3.6 Logs and records are completed as required and in accordance \nwith company standard operating procedure \n3.7 Materials are collected, reprocessed/discarded, scraped/trimmed \nin accordance with procedures \n3.8 Equipment and work area is clean up in accordance with \nprocedures \n3.9 Equipment operation is stopped/paused in an emergency, \nfollowing workplace and emergency procedures\n4. Resolve routine \nproblems \n4.1 Faults that likely to occur are identified during the operation \n4.2 Causes of routine problems/faults are identify and actions are \ntaken on in accordance with procedures \n4.3 Appropriate records and log books of equipment operations are \nmaintained to meet procedures \n4.4 Non-routine problems and report are identified including persons \ndesignated to respond to problems.\n\n--- PDF PAGE 44 ---\nTR-PLASTIC MACHINE OPERATION NC II         Promulgated                                            \n \n40\nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Procedures \n1.1. \nWorkplace procedures \n1.2. \nWork instructions \n1.3. \nTemporary instructions \n1.4.\nIndustry and government codes and standards\n2. Equipment and tools \nEquipment and tools may include and but not limited to: \n2.1. \nBottom blow, top blow, needle blow, tail to tail blow, \nparison pre-blow and pre-squeeze, parison \nstretching and parison orientation type machines  \n2.2. \nDie/tool \n2.3. \nChillers/cooling towers  \n2.4. \nDie heating equipment  \n2.5. \nHopper driers, mixing hoppers, dehumidifying driers \n2.6. \nAir compressors \n2.7. \nDosing machines \n2.8. \nColor blending equipment and conveyors \n2.9. \nMaterial loading equipment used for loading of raw \nmaterials \n2.10. Hand tools used in the blow moulding process \n2.11. Personal protective equipment\n3. Hazards \nTypical hazards include: \n3.1. \nSpills \n3.2. \nDusts vapors \n3.3. \nSlip and fall, particularly due to split granules \n3.4. \nTemperature \n3.5. \n Hazardous substances \n3.6. \nMoving equipment \n3.7.\nManual handling hazards\n4. Mold  \nMold in terms of product size such as below but excluding \ndash panel boards and the likes: \n4.1 Light housing \n4.2 Console box \n4.3 Washer tank \n4.4Bottle\n5. Routine problems \nTypical routine process problems include: \n5.1. \nEquipment malfunction \n5.2. \nVariations in temperature, pressure, speed, inflation \n5.3. \nVariations in materials or contamination of materials \n5.4. \nDie damage \nTypical routine product problems include: \n5.5. \nMachine malfunction \n5.6. \nVariations in materials and/or contamination of \nmaterials \n5.7. \nDie/tooling problems \n5.8. \nWall thinning, holes \n5.9. \nPoor surface finish, warping \n5.10. Poor color dispersion \n5.11. Ejection damage \n5.12. Color contamination \n5.13. Black spots\n\n--- PDF PAGE 45 ---\nTR-PLASTIC MACHINE OPERATION NC II         Promulgated                                            \n \n41\nEVIDENCE GUIDE \n \n1. Critical aspects \nof competency \nAssessment requires evidence that the candidate: \n1.12. Checked work requirements and recognized importance of \nmaterial properties and qualities  \n1.13. Applied approved procedures \n1.14. Took  appropriate action to resolve faults or report faults to \nappropriate personnel \n1.15. Explained and implemented emergency shutdown procedures \n1.16. Ensured blow molding production standards are met consistently \n1.17. Ensured upstream and downstream communication is timely and \neffective \n1.18. Read and interpreted correctly the operating procedures and \nwork instructions  \n1.19. Identified problems and appropriate action is taken  \n1.20. Followed all safety procedures \n2. Underpinning \nknowledge and \nattitudes \n \n2.1. Procedure in operation of blow molding equipment and \ncomponents \n2.2. Production workflow sequences and materials demand \n2.3. Reasons for checking process control panels and reporting \nreadings which do not conform to the work instructions \n2.4. Approved hazard control and safety procedures and the use of \nPPE in relation to handling materials, equipment operation and \ncleanup \n2.5. Potential effects of variations in raw materials and equipment \noperation in relation to quality of product \n2.6. Waste management and importance of reusing non-conforming \nproducts wherever possible \n2.7. Correct selection and use of equipment, materials, processes \nand procedures \n2.8. Different factors which may affect product quality or production \noutput and appropriate \n2.9. Possible causes of routine blow molding faults \n2.10. Honesty in the workplace, perseverance and safety awareness\n3. Underpinning \nskills \n3.1. Plan own work including predicting consequences and identifying \nimprovements \n3.2. Monitor equipment operation and product quality \n3.3. Handle safely products and materials, read relevant safety \ninformation and apply safety precautions appropriate to the task \n3.4. Pause equipment, or shut down equipment in abnormal \ncircumstances \n3.5. Participate in workplace meetings and discussions \n3.6. Complete work related documents \n3.7. Basic mathematical processes of addition, subtraction, division \nand multiplication \n3.8. Gather and provide information in response to workplace \nRequirements\n4. Resource \nimplications \nThe following resources MUST be provided: \n4.1. A bank of scenarios and questions \n4.2. Tools, equipment and workplace relevant with the requirements \nfor the job. \n4.3. Supplies and consumable materials \n4.4.\nEngineering manuals\n\n--- PDF PAGE 46 ---\nTR-PLASTIC MACHINE OPERATION NC II         Promulgated                                            \n \n42\n \n \n \n5. Method of \nassessment \nCompetency MUST be assessed through: \n5.1. Direct Observation with questioning \n5.2. Written examination \n5.3.\nPortfolio \n6. Context of \nassessment \n6.1. Competency may be assessed individually in the actual \nworkplace or a simulated workplace environment. \n6.2. Practical skills must take place only after a period of supervised \npractice and repetitive experience. \n6.3. Prescribe outcome must be able to achieve without direct \nsupervision.\n",
