ribe outcome must be able to achieve without direct\nsupervision.\n\n--- PDF PAGE 39 ---\nTR-PLASTIC MACHINE OPERATION NC II Promulgated\n\n35\n\nUNIT OF COMPETENCY: OPERATE INJECTION MOLDING EQUIPMENT\nUNIT CODE\n :"
