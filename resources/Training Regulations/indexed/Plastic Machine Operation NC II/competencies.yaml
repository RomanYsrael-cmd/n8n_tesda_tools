        "source_title": "MONITOR PROCESS OPERATIONS",
        "source_text": "--- PDF PAGE 47 ---\nTR-PLASTIC MACHINE OPERATION NC II         Promulgated                                            \n \n43\nUNIT OF COMPETENCY:    MONITOR PROCESS OPERATIONS \n \nUNIT CODE \n     :    ALT823306 \n \nUNIT DESCRIPTOR        :   This competency covers the use of production processing \nequipment. This competency is typically performed by all \noperators working either independently or as part of a work \nteam. \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables\n1. Identify \nequipment \ncontrol and \nprocedures \n1.1 \nWork requirements are identified from workplace operating \nprocedures. \n1.2 \nOperating procedures and controls are checked and approved \nadjustments are made based on company operating parameters\n1.3 \nActions to be used in the event of faulty production is \nestablished according to company operating procedures \n1.4 \nProcedures for obtaining materials for the process is identified \nand approved according to company standard operating \nprocedure  \n1.5 \nHazards and environmental issue that might surround the \noperation are identified and dealt with according to company \nstandard operating procedure on safety and emergency, \nprovision on Philippine Clean Air Act  and other existing \nenvironmental legislations\n2. Prepare for \nwork/job \n2.1 \nAncillary tools and equipment are assembled based on \nequipment operating instruction  \n2.2 \nInspection procedures are identified  \n2.3 \nFinishing activities are identify  \n2.4 \nAny hazards connected with materials and process are \nidentified and appropriate safety procedures are readied in \naccordance with equipment operating instruction, workplace \nreference materials including materials safety data sheets and \nequipment instructions  \n2.5 \nRisks from the identified hazards are considered and \nappropriate measures are taken to minimize them.  \n2.6 \nLocation and function of equipment emergency stops and \nensure guards are establish the and appropriate inspection are \nundertaken to ensure that they are in place \n2.7 \nRequirements are identified and noted or checking: \n             2.7.1. materials inputs and outputs \n             2.7.2. ancillary supplies and equipment \n             2.7.3. product quality requirements for the relevant process \nstage(s) \n2.8 \nAccess to any required supplementary equipment for product \nquality testing or routine lubrication and adjustment are obtained \nor arranged according to company standard operating \nprocedure\n\n--- PDF PAGE 48 ---\nTR-PLASTIC MACHINE OPERATION NC II         Promulgated                                            \n \n44\n \n \n \n \n \n3. Maintain \noperations \n3.1 \nProcess operations is checked, including noting product quality, \nproduction outputs and waste, in accordance with workplace \npractices  \n3.2 \nProduct outputs are collected, checked for conformity/stored, \nand necessary adjustments to the equipment are made (where \nappropriate)  \n3.3 \nMaterial which is able to be reprocessed and reused are \ncollected, and procedure for  waste and scrap management is \nundertaken in accordance with workplace procedures (where \napplicable) \n3.4 \nCheck readouts against standard statistical process information \nand enter production data into the control system \n3.5 \nClean up equipment and work area and manage waste in \naccordance with workplace procedures\n4. Identify product \nquality \nrequirements \n4.1 \nMonitor process and note conditions which may affect product \nquality standards \n4.2 \nReport process variations within workplace procedures \n4.3 \nNote and implement authorized changes in standard operating \nprocedures and specifications\n\n--- PDF PAGE 49 ---\nTR-PLASTIC MACHINE OPERATION NC II         Promulgated                                            \n \n45\n \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Procedures \n1.1. \nWorkplace procedures \n1.2. \nWork instructions \n1.3. \nTemporary instructions \n1.4.\nIndustry and government codes and standards\n2. Equipment and tools \nEquipment and tools may include and but not limited to: \n2.1. \nHand carts and trolleys \n2.2. \nKnives and other bag opening equipment \n2.3. \nHoists/lifting equipment \n2.4. \nBasic hand tools required for opening of material \npackaging  \n2.5.\nPersonal protective equipment\n3. Hazards \nTypical hazards include: \n3.1. \nAutomated or rotating equipment \n3.2. \nDusts/vapors \n3.3. \nHazardous materials \n3.4. \nKnife hazards \n3.5.\nManual handling hazards\n4. Routine problems \nTypical routine process problems include: \n4.1. \nEquipment malfunction \n4.2. \nProduct jamming or sticking \n4.3. \nPower failure \n4.4. \nAir, oil or lubricant difficulties \nTypical routine product problems include: \n4.5. \nVariations in materials  \n4.6. \nContamination of materials \n4.7.\nMalformed or incomplete products\n\n--- PDF PAGE 50 ---\nTR-PLASTIC MACHINE OPERATION NC II         Promulgated                                            \n \n46\nEVIDENCE GUIDE \n \n1. Critical aspects \nof competency \nAssessment requires evidence that the candidate: \n1.1. Identified equipment control and procedures and understood the \nimportance of critical material properties and quantities  \n1.2. Prepared for work/job  \n1.3. Maintained operations and recognized potential faulty situations \nrequiring action and implemented appropriate action \n1.4. Identified product quality requirements and ensured that \nproduction standards are met consistently \n2. Underpinning \nknowledge and \nattitudes \n \n2.1. Impact of incorrect or faulty materials  \n2.2. Production workflow sequences and materials demand  \n2.3. Operation of work systems and equipment  \n2.4. Selection and use of equipment, materials, processes and \nprocedures  \n2.5. Hazards of the materials and process and appropriate hazard \ncontrol procedures \n2.6. Safety and emergency procedures and OHS and use of \npersonal protective equipment \n2.7.Honesty in work, Perseverance and Alertness\n3. Underpinning \nskills \n3.1. Read and interpret typical product specifications, job sheets, \nprocedures, material labels and safety information as provided \nto operators \n3.2. Distinguish between causes of faults such as: \n• wrong raw materials/additives  \n• incorrect quantity of materials/additives  \n• contaminated materials/additives \n• product variations from specification   \n3.3. Participate in workplace meetings and discussions \n3.4. Complete work related documents \n3.5. Computing basic mathematical processes of addition, \nsubtraction, division and multiplication \n3.6. Gather and provide information in response to workplace \nrequirements\n4. Resource \nimplications \nThe following resources MUST be provided:  \n4.1. Suitable access to an operating plant or equipment that allows \nfor appropriate and realistic simulation \n4.2. Tools, equipment and workplace relevant with the requirements \nfor the job. \n4.3. Supplies and consumable materials \n4.4.A bank of case studies/scenarios and questions \n5. Method of \nassessment \nCompetency MUST be assessed through: \n5.1. Direct Observation with questioning \n5.2. Oral interview and written test \n5.3.\nPortfolio assessment\n6. Context of \nassessment \n6.1. Competency may be assessed individually in the actual \nworkplace or a simulated workplace environment. \n6.2. Practical skills must take place only after a period of \nsupervised practice and repetitive experience. \n6.3. Prescribe outcome must be able to achieve without direct \nsupervision.\n",
