  "source_text": "SECTION 4 NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1 To attain the National Qualification of PLASTIC MACHINE OPERATION NC II, the\ncandidate must demonstrate competence through assessment covering all the units of\ncompetency listed in Section 1. Successful candidates shall be awarded a National\nCertificate signed by the TESDA Director General.\n\n4.2 Individual aspiring to be awarded the qualification of PLASTIC MACHINE\nOPERATION NC II must acquire Certificates of Competency in all the following core\nunits of the Qualification. Candidates may apply for assessment in any accredited\nassessment center.\n4.2.1\nOperate Injection Molding Equipment\n\n• Prepare Molds for Composite Production\n• Prepare Materials to Formulae\n• Assemble Materials and Equipment for Production\n• Operate Injection Molding Equipment\n• Monitor Process Operations\n• Finish Products and Components\n\n4.2.2\nOperate Blow Molding Equipment\n• Prepare Molds for Composite Production\n• Prepare Materials to Formulae\n• Assemble Materials and Equipment for Production\n• Operate Blow Moulding Equipment\n• Monitor Process Operations\n• Finish Products and Components\n\nSuccessful candidates shall be awarded Certificates of Competency (COC).\n\n4.3 Accumulation and submission of all COCs acquired for the relevant units of\ncompetency comprising a qualification, an individual shall be issued the corresponding\nNational Certificate.\n\n4.4 Assessment shall focus on the core units of competency. The basic and common\nunits shall be integrated or assessed concurrently with the core units.\n\n4.5 The following are qualified to apply for assessment and certification:\n\n4.5.1 Graduates of formal, non-formal and informal including enterprise-based training\nprograms.\n\n4.5.2 Experienced workers (wage employed or self employed)\n\n4.6 The guidelines on assessment and certification are discussed in detail in the\n“Procedures Manual on Assessment and Certification” and “Guidelines on the\nImplementation of the Philippine TVET Qualification and Certification System\n(PTOQCS)”\n\n--- PDF PAGE 63 ---\nTR-PLASTIC MACHINE OPERATION NC II Promulgated\n\n59\n"
}
