      "source_text": "3.4 TOOLS, EQUIPMENT AND MATERIALS\nPLASTIC MACHINE OPERATIONS NC II\n\nRecommended list of tools, equipment and materials for the training of 20\ntrainees for PLASTIC MACHINE OPERATION NC II\n\nTOOLS\nEQUIPMENT\nMATERIALS\nQty.\nDescription\nQty.\nDescription\nQty.\nDescription\n10 sets\nKnives\nFiles\nScrapers\nBand saw, Hand\nsaw\n5 sets\nElectric and/or powered\nrouters, saw, drills\ndrivers and sanders\n1 set\nWorkplace procedure\nWork instruction\nTemporary instruction\n\n1 set\nHoist/jigs/lifting\nequipment\n1 lot\nOffice supplies\n\n2 sets\nHand carts and trolley\n\n10 sets\nHand tools\n• Screw drivers\n• Pliers\n• Wrenches\n• Sockets and\ndrivers\n1 set\nBottom blow, top blow,\nneedle blow, tail to tail\nblow, parison pre-blow\nand pre-squeeze,\nparison stretching and\nparison orientation type\nmachines\n20\nsets\nPPE\n•\nGloves\n•\nRespiratory mask\n•\nFace shield\n•\nSafety shoes\n\n1 set\nDie\n\n1 set\nChillers/cooling towers\n\n1 set\nDie heating equipment\n\n1 set\nHopper driers, mixing\nhoppers, dehumidifying\ndriers\n\n1 set\nAir compressors\n\n1 set\nDosing machines\nColor blending\nequipment and\nconveyors\n\n1 set\nInjection unit\n\n1 set\nBarrel and screw\n\n--- PDF PAGE 60 ---\nTR-PLASTIC MACHINE OPERATION NC II Promulgated\n\n56\nplastification unit\n\n1 set\nMaterial loading\nequipment\n\n1 set\nElectrical, pneumatic,\nmechanical\nElectromechanical and\nhydraulic injection\nmoulding machines\nand components such\nas base, frame, feed\nhoppers and material\nsupply mechanisms\n\n1 set\nMeasuring equipment\n\n2 sets\nBuffs and polishers"
