      "source_text": "SECTION 3 TRAINING STANDARDS\n\nThese standards are set to provide technical and vocational education and training\n(TVET) providers with information and other important requirements to consider when\ndesigning training programs for PLASTIC MACHINE OPERATION NC II.\n\n3.1 CURRICULUM DESIGN\n\nCourse Title: PLASTIC MACHINE OPERATION\n\nNC Level NC II\n\nNominal Training Duration:\n18 Hours (Basic Competencies)\n\n20 Hours (Common Competencies)\n105 Hours (Core Competencies)\n\nCourse Description:\n\nThis course is designed to enhance the knowledge, skills and attitudes of an\nindividual in the field of automotive manufacturing in accordance with industry standards.\nIt covers competencies such as: Prepare molds for composites production, prepare\nmaterials to formulae, assemble materials and equipment for production, operate injection\nand blow molding equipment, monitor process operations and finish products and\ncomponents.\n.\n\nTo obtain this, all units prescribed for this qualification must be achieved.\n\nBASIC COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and convey workplace\ninformation\n1.2 Complete relevant work\nrelated documents\n1.3 Participate in workplace\nmeeting and discussion\n• Group\ndiscussion\n• Interaction\n• Lecture\n• Reportorial\n• Written test\n• Practical/\nperformance\ntest\n• Interview\n2. Work in a team\nenvironment\n2.1 Describe and identify team role\nand responsibility in a team.\n2.2 Describe work as a team\nmember.\n• Group\ndiscussion\n• Case studies\n• Simulation\n\n• Written test\n• Observation\n• Simulation\n• Role playing\n3. Practice career\nprofessionalism\n3.1 Integrate personal objectives\nwith organizational goals\n3.2 Set and meet work problems\n3.3 Maintain professional growth\nand development\n• Interactive\nlecture\n• Structure\nactivity\n• Simulation\n• Demonstration\n• Self-paced\ninstruction\n• Role play\n• Interview\n• Written\nexamination\n\n--- PDF PAGE 56 ---\nTR-PLASTIC MACHINE OPERATION NC II Promulgated\n\n52\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n4. Practice\noccupational\nhealth and\nsafety\n4.1 Evaluate hazards and risks\n4.2 Control hazards and risks\n4.3 Maintain occupational health\nand safety awareness\n• Interactive\nlecture\n• Simulation\n• Symposium\n• Group\ndynamics\n• Film viewing\n• Situational\nanalysis\n• Interview\n• Practical\nexamination\n• Written exam\n• Portfolio\nassessment\n\nCOMMON COMPETENCIES\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Read, Interpret\nand Apply\nEngineering\nDrawings\n1.1 Identify and access\nengineering drawings/\nspecification\n1.2.Interpret drawings\n1.3.Apply information in the\ndrawings & specifications\n1.4 Store drawings\n• Lecture/\nDemonstration\n• Dual training\n\n• Direct\nobservation\n• Interview\n2. Perform\nMensuration\nand Calculation\n2.1. Select measuring instrument\nand\n2.2 Carry out measurement and\ncalculations.\n2.3. Maintain measuring\ninstruments\n• Lecture/\nDemonstration\n• Simulation\n• Exercises\n\n• Written test\n• Oral\nquestioning\n• Direct\nobservation\n3. Read, Interpret\nand Apply\nSpecifications\nand Manual\n4.1. Identify/accessed manuals\nand interpret data and\nspecification\n4.2 Apply information accessed\nin manual\n4.3 Store manual\n• Lecture/\nDemonstration\n• Dual training\n• Distance\nLearning\n\n• Written test\n• Direct\nobservation\n• Project\nmethod\n•Interview\n4. Perform Shop\nMaintenance\n\n4.1 Inspect/clean tools and work\narea\n4.2 Store/arrange tools and shop\nequipment\n4.3 Dispose wastes/used\nlubricants\n4.4 Report damaged\ntools/equipment\n• Lecture/\nDemonstration\n• Dual training\n• Self paced\n(modular)\n• Simulation\n• Written test\n• Direct\nobservation\n• Demonstration\n• Interview\n\n--- PDF PAGE 57 ---\nTR-PLASTIC MACHINE OPERATION NC II Promulgated\n\n53\nCORE COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Prepare molds\nfor composites\nproduction\n1.1\nPrepare surfaces\n1.2 Apply mold release system\n1.3 Mask up mold\n•Lecture/\nDemonstration\n• Dual training\n\n•Demonstration\nw/ questioning\n• Observation w/\nquestioning\n• Interview\n•Portfolio\n2. Prepare\nmaterials to\nformulae\n\n2.1\nIdentify requirements to\nhandle materials\n2.2 Prepare for assembly of\ningredients\n2.3 Assemble ingredients\n•Lecture/\nDemonstration\n• Dual training\n\n•Demonstration\nw/ questioning\n• Observation w/\nquestioning\n• Interview\n• Portfolio\n3. Assemble\nMaterials and\nEquipment for\nProduction\n3.1 Identify required materials and\nequipment\n3.2 Select materials and\nequipment\n3.3 Assemble materials and\nequipment\n3.4 Organize internal workplace\ndelivery of materials/\nequipment\n3.5 Store materials for production\n•\nLecture/\nDemonstration\n• Dual training\n\n•Demonstration\nw/ questioning\n• Observation w/\nquestioning\n• Interview\n• Portfolio\n4. Operate\ninjection\nmolding\nequipment\n4.1 Check work requirements\n4.2 Conduct pre-start checks as\nrequired\n4.3 Operate equipment\n4.4 Resolve routine problems\n•Lecture/\nDemonstration\n• Dual training\n•Demonstration\nw/ questioning\n• Observation w/\nquestioning\n• Interview\n• Portfolio\n5. Operate blow\nmolding\nequipment\n5.1 Check work requirements\n5.2 Conduct pre-start checks as\nrequired\n5.3 Operate equipment\n5.4 Resolve routine problems\n•Lecture/\nDemonstration\n• Dual training\n•Demonstration\nw/ questioning\n• Observation w/\nquestioning\n• Interview\n•Portfolio\n6. Monitor process\noperations\n6.1 Identify equipment control\nand procedures\n6.2 Get ready for work/job\n6.3 Maintain operations\n6.4 Identify product quality\nrequirements\n•Lecture/\nDemonstration\n• Dual training\n•Demonstration\nw/ questioning\n• Observation w/\nquestioning\n• Interview\n• Portfolio\n7. Finish products\nand components\n7.1 Establish requirements for\nthe finishing process\n7.2 Check quality of product\n7.3 Undertake the finishing\noperation\n7.4 Identify and rectify routine\nproduct imperfections\n•Lecture/\nDemonstration\n• Dual training\n•Demonstration\nw/ questioning\n• Observation w/\nquestioning\n• Interview\n• Portfolio\n\n--- PDF PAGE 58 ---\nTR-PLASTIC MACHINE OPERATION NC II Promulgated\n\n54\n3.2 TRAINING DELIVERY\n\nThe delivery of training should adhere to the design of the curriculum.\nDelivery should be guided by the 10 basic principles of competency-based TVET.\n\n• The training is based on curriculum developed from the competency\nstandards;\n• Learning is modular in its structure;\n• Training delivery is individualized and self-paced;\n• Training is based on work that must be performed;\n• Training materials are directly related to the competency standards and the\ncurriculum modules;\n• Assessment is based in the collection of evidence of the performance of work\nto the industry required standard;\n• Training is based both on and off-the-job components;\n• Allows for recognition of prior learning (RPL) or current competencies;\n• Training allows for multiple entry and exit; and\n• Approved training programs are nationally accredited.\n\nThe competency-based TVET system recognizes various types of delivery\nmodes, both on and off-the-job as long as the learning is driven by the\ncompetency standards specified by the industry. The following training modalities\nmay be adopted when designing training programs:\n\n• The dualized mode of training delivery is preferred and recommended. Thus\nprograms would contain both in-school and in-industry training or fieldwork\ncomponents. Details can be referred to the Dual Training System (DTS)\nImplementing Rules and Regulations.\n• Modular/self-paced learning is a competency-based training modality wherein\nthe trainee is allowed to progress at his own pace. The trainer facilitates the\ntraining delivery\n• Peer teaching/mentoring is a training modality wherein fast learners are given\nthe opportunity to assist the slow learners.\n• Supervised industry training or on-the-job training is an approach in training\ndesigned to enhance the knowledge and skills of the trainee through actual\nexperience in the workplace to acquire specific competencies prescribed in\nthe training regulations.\n• Distance learning is a formal education process in which majority of the\ninstruction occurs when the students and instructor are not in the same place.\nDistance learning may employ correspondence study, or audio, video or\ncomputer technologies.\n\n--- PDF PAGE 59 ---\nTR-PLASTIC MACHINE OPERATION NC II Promulgated\n\n55\n3.3 TRAINEE ENTRY REQUIREMENTS\n\nTrainees or students should possess the following requirements:\n\n• can communicate both oral and written;\n• physically and mentally fit;\n• with good moral character; and\n• with experience in basic machining\n\nThis list does not include specific institutional requirements such as\neducational attainment, appropriate work experience, and others that may be\nrequired of the trainees by the school or training center delivering the TVET\nprogram.\n\n3.4 TOOLS, EQUIPMENT AND MATERIALS\nPLASTIC MACHINE OPERATIONS NC II\n\nRecommended list of tools, equipment and materials for the training of 20\ntrainees for PLASTIC MACHINE OPERATION NC II\n\nTOOLS\nEQUIPMENT\nMATERIALS\nQty.\nDescription\nQty.\nDescription\nQty.\nDescription\n10 sets\nKnives\nFiles\nScrapers\nBand saw, Hand\nsaw\n5 sets\nElectric and/or powered\nrouters, saw, drills\ndrivers and sanders\n1 set\nWorkplace procedure\nWork instruction\nTemporary instruction\n\n1 set\nHoist/jigs/lifting\nequipment\n1 lot\nOffice supplies\n\n2 sets\nHand carts and trolley\n\n10 sets\nHand tools\n• Screw drivers\n• Pliers\n• Wrenches\n• Sockets and\ndrivers\n1 set\nBottom blow, top blow,\nneedle blow, tail to tail\nblow, parison pre-blow\nand pre-squeeze,\nparison stretching and\nparison orientation type\nmachines\n20\nsets\nPPE\n•\nGloves\n•\nRespiratory mask\n•\nFace shield\n•\nSafety shoes\n\n1 set\nDie\n\n1 set\nChillers/cooling towers\n\n1 set\nDie heating equipment\n\n1 set\nHopper driers, mixing\nhoppers, dehumidifying\ndriers\n\n1 set\nAir compressors\n\n1 set\nDosing machines\nColor blending\nequipment and\nconveyors\n\n1 set\nInjection unit\n\n1 set\nBarrel and screw\n\n--- PDF PAGE 60 ---\nTR-PLASTIC MACHINE OPERATION NC II Promulgated\n\n56\nplastification unit\n\n1 set\nMaterial loading\nequipment\n\n1 set\nElectrical, pneumatic,\nmechanical\nElectromechanical and\nhydraulic injection\nmoulding machines\nand components such\nas base, frame, feed\nhoppers and material\nsupply mechanisms\n\n1 set\nMeasuring equipment\n\n2 sets\nBuffs and polishers\n\n3.5 TRAINING FACILITIES\nPLASTIC MACHINE OPERATION NC II\n\nThe automotive workshop must be made of reinforced concrete or steel\nstructure. The size must be suited on the requirements of the competencies. The class\nsize of 25 students/trainees is reserved for the lecture room and the practical\ndemonstration area for carrying out plastic machine operation training. Most of the\nlearning activities such as plastic machine operation are performed in the workshop.\n\nSPACE REQUIREMENT\nSIZE IN METERS\nAREA IN SQ.\nMETERS\nTOTAL AREA IN\nSQ. METERS\n•\nBuilding (permanent)\n12.00 x 32.00\n-\n384.00\n• Student/Trainee\nWorking Space\n2.50 x 2.50 per\nstudent/trainee\n6.25 per student\n156.25\n• Contextual Learning\nLaboratory\n4.00 x 5.00\n20.00\n20.00\n•\nLecture Room\n4.00 x 7.00\n28.00\n28.00\n• Learning Resource\nCenter\n4.00 x 5.00\n20.00\n20.00\n• Facilities/Equipment/\nCirculation Area\n-\n-\n159.75\n\n3.6 TRAINERS’ QUALIFICATION\n\nAUTOMOTIVE/LAND TRANSPORT SECTOR\n\nPLASTIC MACHINE OPERATION NC II\nTRAINER QUALIFICATION (TQ II)\n• Must be a holder of PLASTIC MACHINE OPERATION NC II or equivalent\nqualification\n• Must have undergone training on Training Methodology II (TM II) or equivalent\nin training/experience\n• Must be computer literate\n• Must be physically and mentally fit\n• *Must have at least 2 years job/industry experience\n\n--- PDF PAGE 61 ---\nTR-PLASTIC MACHINE OPERATION NC II Promulgated\n\n57\n• Must be a civil service eligible (for government position) or holder of\nappropriate professional license issued by the Professional Regulatory\nCommission\n\n*\nOptional. Only when required by the hiring institution.\n\nReference: TESDA Board Resolution No. 2004 03\n\n3.7 INSTITUTIONAL ASSESSMENT\n\nInstitutional assessment is undertaken by trainees to determine their\nachievement of units of competency. A certificate of achievement is issued for\neach unit of competency.\n\n--- PDF PAGE 62 ---\nTR-PLASTIC MACHINE OPERATION NC II Promulgated\n\n58"
