    "source_text": "3.1 CURRICULUM DESIGN\n\nCourse Title: PLASTIC MACHINE OPERATION\n\nNC Level NC II\n\nNominal Training Duration:\n18 Hours (Basic Competencies)\n\n20 Hours (Common Competencies)\n105 Hours (Core Competencies)\n\nCourse Description:\n\nThis course is designed to enhance the knowledge, skills and attitudes of an\nindividual in the field of automotive manufacturing in accordance with industry standards.\nIt covers competencies such as: Prepare molds for composites production, prepare\nmaterials to formulae, assemble materials and equipment for production, operate injection\nand blow molding equipment, monitor process operations and finish products and\ncomponents.\n.\n\nTo obtain this, all units prescribed for this qualification must be achieved.\n\nBASIC COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and convey workplace\ninformation\n1.2 Complete relevant work\nrelated documents\n1.3 Participate in workplace\nmeeting and discussion\n• Group\ndiscussion\n• Interaction\n• Lecture\n• Reportorial\n• Written test\n• Practical/\nperformance\ntest\n• Interview\n2. Work in a team\nenvironment\n2.1 Describe and identify team role\nand responsibility in a team.\n2.2 Describe work as a team\nmember.\n• Group\ndiscussion\n• Case studies\n• Simulation\n\n• Written test\n• Observation\n• Simulation\n• Role playing\n3. Practice career\nprofessionalism\n3.1 Integrate personal objectives\nwith organizational goals\n3.2 Set and meet work problems\n3.3 Maintain professional growth\nand development\n• Interactive\nlecture\n• Structure\nactivity\n• Simulation\n• Demonstration\n• Self-paced\ninstruction\n• Role play\n• Interview\n• Written\nexamination\n\n--- PDF PAGE 56 ---\nTR-PLASTIC MACHINE OPERATION NC II Promulgated\n\n52\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n4. Practice\noccupational\nhealth and\nsafety\n4.1 Evaluate hazards and risks\n4.2 Control hazards and risks\n4.3 Maintain occupational health\nand safety awareness\n• Interactive\nlecture\n• Simulation\n• Symposium\n• Group\ndynamics\n• Film viewing\n• Situational\nanalysis\n• Interview\n• Practical\nexamination\n• Written exam\n• Portfolio\nassessment\n\nCOMMON COMPETENCIES\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Read, Interpret\nand Apply\nEngineering\nDrawings\n1.1 Identify and access\nengineering drawings/\nspecification\n1.2.Interpret drawings\n1.3.Apply information in the\ndrawings & specifications\n1.4 Store drawings\n• Lecture/\nDemonstration\n• Dual training\n\n• Direct\nobservation\n• Interview\n2. Perform\nMensuration\nand Calculation\n2.1. Select measuring instrument\nand\n2.2 Carry out measurement and\ncalculations.\n2.3. Maintain measuring\ninstruments\n• Lecture/\nDemonstration\n• Simulation\n• Exercises\n\n• Written test\n• Oral\nquestioning\n• Direct\nobservation\n3. Read, Interpret\nand Apply\nSpecifications\nand Manual\n4.1. Identify/accessed manuals\nand interpret data and\nspecification\n4.2 Apply information accessed\nin manual\n4.3 Store manual\n• Lecture/\nDemonstration\n• Dual training\n• Distance\nLearning\n\n• Written test\n• Direct\nobservation\n• Project\nmethod\n•Interview\n4. Perform Shop\nMaintenance\n\n4.1 Inspect/clean tools and work\narea\n4.2 Store/arrange tools and shop\nequipment\n4.3 Dispose wastes/used\nlubricants\n4.4 Report damaged\ntools/equipment\n• Lecture/\nDemonstration\n• Dual training\n• Self paced\n(modular)\n• Simulation\n• Written test\n• Direct\nobservation\n• Demonstration\n• Interview\n\n--- PDF PAGE 57 ---\nTR-PLASTIC MACHINE OPERATION NC II Promulgated\n\n53\nCORE COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Prepare molds\nfor composites\nproduction\n1.1\nPrepare surfaces\n1.2 Apply mold release system\n1.3 Mask up mold\n•Lecture/\nDemonstration\n• Dual training\n\n•Demonstration\nw/ questioning\n• Observation w/\nquestioning\n• Interview\n•Portfolio\n2. Prepare\nmaterials to\nformulae\n\n2.1\nIdentify requirements to\nhandle materials\n2.2 Prepare for assembly of\ningredients\n2.3 Assemble ingredients\n•Lecture/\nDemonstration\n• Dual training\n\n•Demonstration\nw/ questioning\n• Observation w/\nquestioning\n• Interview\n• Portfolio\n3. Assemble\nMaterials and\nEquipment for\nProduction\n3.1 Identify required materials and\nequipment\n3.2 Select materials and\nequipment\n3.3 Assemble materials and\nequipment\n3.4 Organize internal workplace\ndelivery of materials/\nequipment\n3.5 Store materials for production\n•\nLecture/\nDemonstration\n• Dual training\n\n•Demonstration\nw/ questioning\n• Observation w/\nquestioning\n• Interview\n• Portfolio\n4. Operate\ninjection\nmolding\nequipment\n4.1 Check work requirements\n4.2 Conduct pre-start checks as\nrequired\n4.3 Operate equipment\n4.4 Resolve routine problems\n•Lecture/\nDemonstration\n• Dual training\n•Demonstration\nw/ questioning\n• Observation w/\nquestioning\n• Interview\n• Portfolio\n5. Operate blow\nmolding\nequipment\n5.1 Check work requirements\n5.2 Conduct pre-start checks as\nrequired\n5.3 Operate equipment\n5.4 Resolve routine problems\n•Lecture/\nDemonstration\n• Dual training\n•Demonstration\nw/ questioning\n• Observation w/\nquestioning\n• Interview\n•Portfolio\n6. Monitor process\noperations\n6.1 Identify equipment control\nand procedures\n6.2 Get ready for work/job\n6.3 Maintain operations\n6.4 Identify product quality\nrequirements\n•Lecture/\nDemonstration\n• Dual training\n•Demonstration\nw/ questioning\n• Observation w/\nquestioning\n• Interview\n• Portfolio\n7. Finish products\nand components\n7.1 Establish requirements for\nthe finishing process\n7.2 Check quality of product\n7.3 Undertake the finishing\noperation\n7.4 Identify and rectify routine\nproduct imperfections\n•Lecture/\nDemonstration\n• Dual training\n•Demonstration\nw/ questioning\n• Observation w/\nquestioning\n• Interview\n• Portfolio\n\n--- PDF PAGE 58 ---\nTR-PLASTIC MACHINE OPERATION NC II Promulgated\n\n54"
