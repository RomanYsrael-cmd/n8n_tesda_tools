    "source_text": "SECTION 3. TRAINING STANDARDS\n\nThese guidelines are set to provide the Technical and Vocational Education\nand Training (TVET) providers with information and other important requirements to\nconsider when designing training programs for ARTIFICIAL INSEMINATION\n(SWINE) NC II.\n\n3.1 CURRICULUM DESIGN\n\nCourse Title: ARTIFICIAL INSEMINATION (SWINE) NC Level NC II\n\nNominal Training Duration:\n18 hrs Basic Competencies\n14 hrs Common Competencies\n95 hrs Core Competencies\n127 hrs\nTotal training duration\n48 hrs\nElective Competencies\n\nCourse Description:\n\nThis course is designed to enhance the knowledge, desirable attitudes and skills of\nartificial insemination technician (student/learner) in accordance with industry\nstandards. It includes core competencies in confirming readiness of animal for\nartificial insemination, collecting boar semen, performing artificial insemination (AI)\non sow/gilt and preparing documentations and reports on sow/gilt artificial\ninsemination (AI) activities. It has an elective competencies on conduct of community\nawareness program on artificial insemination and rendering assistance to veterinary\nprocedures related to productive problems. It also includes competencies in\nworkplace communication, teamwork, practicing professionalism, safety in the use of\nhand tools and equipment, housekeeping and basic mathematical operations and\ncalculations.\n\nBASIC COMPETENCIES\n(18 hrs.)\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and convey\nworkplace information.\n1.2 Complete relevant work\nrelated documents.\n1.3 Participate in workplace\nmeeting and discussion.\n\n• Group\ndiscussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n\n--- PDF PAGE 44 ---\nTR-ARTIFCIAL INSEMINATION (SWINE)\n42\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n2. Work in a team\nenvironment\n2.1 Describe and identify\nteam role and\nresponsibility in a team.\n2.2 Describe work as a team\nmember.\n• Discussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n3. Practice career\nprofessionalism\n3.1 Integrate personal\nobjectives with\norganizational goals.\n3.2 Set and meet work\npriorities.\n3.3 Maintain professional\ngrowth and\ndevelopment.\n• Discussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n4. Practice\noccupational\nhealth and\nsafety\n4.1. Identify hazards and\nrisks\n4.2. Evaluate hazard and\nrisks\n4.3. Control hazards and\nrisks\n4.4. Maintain occupational\nhealth and safety\nawareness\n• Discussion\n• Plant tour\n• Symposium\n• Observation\n• Interview\n\nCOMMON COMPETENCIES\n(14hrs.)\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Apply safety\nmeasures in\nfarm operations\n1.1. Apply appropriate safety\nmeasures\n1.2. Safekeep/ maintain/\ndispose tools, materials\nand outfit.\n• Self-paced/\nmodular\n• Lecture/\nDiscussion\n• Interaction\n• Practical\nDemonstration\n•\nVisit/tour\n• Oral/Written\nInterviews\n• Direct\nObservation\n• Practical\nDemonstration\n2. Use farm tools\nand equipment\n2.1. Select and use farm\ntools\n2.2. Select and operate farm\nequipment\n2.3. Perform preventive\nmaintenance\nprocedures/practices\n• Self-paced /\nmodular\n• Lecture/\nDiscussion\n• Interaction\n• Practical\nDemonstration\n• Visit/tour\n• Oral/Written\nInterviews\n• Direct\nObservation\n• Practical\nDemonstration\n\n--- PDF PAGE 45 ---\nTR-ARTIFCIAL INSEMINATION (SWINE)\n43\n3. Perform\nestimation and\nbasic calculation\n\n3.1. Perform estimation\n3.2. Perform basic workplace\ncalculation\n\n• Self-paced/\nmodular\n• Lecture/\nDiscussion\n• Interaction\n• Practical\nExercise\n• Oral/Written\nexamination\n• Practical\nexercise\n\nCORE COMPETENCIES\n(95 hrs.)\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Confirm\nreadiness of\nsow/gilt for\nartificial\ninsemination\n\n1.1. Validate information on\nanimals for artificial\ninsemination\n1.2. Assess animal\ncondition for artificial\ninsemination\n• Lectures\n• Role playing\n• Hands- on\n• Lectures/\nDiscussion\n• Videos/\nIllustrations\n• Demonstration\n• Oral interview\n• Demonstration\nwith\nquestioning\n• Observation\nwith\nquestioning\n\n2. Collect boar\nsemen\n2.1. Carry out preparatory\nactivities\n2.2. Perform collection of\nboar semen\n2.3. Handle boar semen for\ntransport\n• Lecture\n• Laboratory\nexercise\n• Demonstration\n• Hands-on\n• Demonstration\nwith questions\n• Oral evaluation\n• Oral Interview\n\n3. Perform artificial\ninsemination\n(AI) on sow/gilt\n3.1. Conduct preparatory\nactivities\n3.2. Deposit semen\n3.3. Perform post – artificial\ninsemination (AI)\nactivities\n• Lecture\n/discussion\n• Demonstration\n• Hands-on\n\n• Demonstration\nwith questions\n• Oral\nevaluation\n• Oral Interview\n4. Prepare\ndocumentations\nand reports on\nsow/gilt artificial\ninsemination(AI)\nactivities\n4.1. Collect\nand\nprocess\ndata\n4.2. Accomplish and submit\nforms\n\n• Lecture/demo\n• Group\nDiscussion\n• Hands-on\n\n• Written\nexamination\n• Demonstration\n\n--- PDF PAGE 46 ---\nTR-ARTIFCIAL INSEMINATION (SWINE)\n44\nELECTIVE COMPETENCY\n(48 hrs.)\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Conduct\ncommunity\nawareness\nprogram on\nartificial\ninsemination\n1.1 Prepare for the conduct\nof community\nawareness programs\n1.2 Carry-out community\nawareness programs\n\n• Lecture/\ndemo\n• Group\nDiscussion\n• Hands-on\n• Written\nexamination\n• Demonstration\n\n2. Render\nassistance to\nveterinary\nprocedures\nrelated to\nreproductive\nproblems\n2.1 Identify visual signs\nsuggestive of\nreproductive problems.\n2.2 Report the identified\nvisual signs of\nreproductive problems\nto a licensed\nveterinarian.\n2.3 Administer treatment\nand preventive\nprocedures as duly\nrecommended in\nwriting by a licensed\nveterinarian\n• Lecture/\ndemo\n• Group\nDiscussion\n• Hands-on\n\n• Written\nexamination\n• Demonstration\n• Workshop\n\n--- PDF PAGE 47 ---\nTR-ARTIFCIAL INSEMINATION (SWINE)\n45\n3.2 TRAINING DELIVERY\n\nThe delivery of training should adhere to the design of the curriculum.\nDelivery should be guided by the 10 basic principles of competency-based\nTVET.\n\no The training is based on curriculum developed from the\ncompetency standards;\no Learning is modular in its structure;\no Training delivery is learner-centered and should accommodate\nindividualized and self-paced learning strategies;\no Training is based on work that must be performed;\no Training materials are directly related to the competency\nstandards and the curriculum modules;\no Assessment is based in the collection of evidence of the\nperformance of work to the industry required standard;\no Training program allows for recognition of prior learning (RPL)\nor current competencies;\no Training allows for multiple entry and exit; and\no Training programs are registered with UTPRAS.\n\nThe competency-based TVET system recognizes various types of\ndelivery modes, both on and off-the-job as long as the learning is driven by\nthe competency standards specified by the industry. The following training\nmodalities may be adopted when designing training programs:\n\no The dualized mode of training delivery is preferred and\nrecommended. Thus programs would contain both in-school and\nin-industry training or fieldwork components. Details can be\nreferred to the Dual Training System (DTS) Implementing Rules\nand Regulations.\no Modular/self-paced learning is a competency-based training\nmodality wherein the trainee is allowed to progress at his own\npace. The trainer facilitates the training delivery\no Peer teaching/mentoring is a training modality wherein fast\nlearners are given the opportunity to assist the slow learners.\no Supervised industry training or on-the-job training is an\napproach in training designed to enhance the knowledge and\nskills of the trainee through actual experience in the workplace\nto acquire specific competencies prescribed in the training\nregulations.\no Distance learning is a formal education process in which\nmajority of the instruction occurs when the students and\ninstructor are not in the same place. Distance learning may\nemploy correspondence study, or audio, video or computer\ntechnologies.\no Project-Based Instruction is an authentic instructional model or\nstrategy in which students plan, implement and evaluate\nprojects that have real world applications.\n\n--- PDF PAGE 48 ---\nTR-ARTIFCIAL INSEMINATION (SWINE)\n46\n3.3 TRAINEE ENTRY REQUIREMENTS\n\nTrainees or students wishing to enroll in this course should possess\nthe following requirements:\n\n•\nAble to read and write;\n•\nWith good moral character;\n•\nAbility to communicate, both oral and written; and\n•\nPhysically fit and mentally healthy as certified by a Public Health\nOfficer\n\n3.1 LIST OF TOOLS, EQUIPMENT AND MATERIALS\n\n ARTIFICIAL INSEMINATION (SWINE) NC II\n\nRecommended list of tools, equipment and materials for the training of 12\ntrainees for Artificial Insemination (Swine) NC II\n\nQTY\nTOOLS\nQTY\nEQUIPMENT\nQTY\nMATERIALS\n100\npcs.\nCatheters\n4\nMicroscope\n50\nbottles\nSemen bottles\n1 set\nFirst aid kit\n12 sets\nPersonal\nProtective\nParaphernalia(scru\nb suits, powder-\nfree vinyl gloves,\nrubber boots)\n1pc\nFemale\nReproductive\nOrgan\nSpecimens\n12 pcs.\nTraining bag\n12\nLaboratory gown\n2 sets\nPail and dipper\n1\nShovel\n1\nVehicle\n10 m\nHose\n1\nsandbag\n1\nCamera\n6 bottles\nIsopropyl alcohol\n(70%)\n\n6 pcs.\nGermicidal Soap\n\n1\nPower sprayer\n6 packs\nPaper towels\n\n1\nGenerator set\n5 boxes\nGlass slides\n\n1\nRefrigerator (16 to\n17 degree C)\n5 boxes\nCover slips\n\n1\nFire extinguisher\n2\nTrash can\n\n1\nSet Audio visuals\nwith screen\n50 pcs.\nDisposal waste\nbags\n\n1\nWhite board\n2 pcs.\nBroomstick\n\n12 sets\nChairs and tables\n2 pcs.\nBrooms\n\n2 Units\nComputer\n6 pcs.\nBrush\n\n1\nPrinter\n6\nBoard marker\n\n1\nPhotocopier\n2 rolls\nMaskingTapes\n\n1 unit\nDryer-Sterilizer\n12 pcs\nPencil/ballpen\n\n--- PDF PAGE 49 ---\nTR-ARTIFCIAL INSEMINATION (SWINE)\n47\n\nQTY\nTOOLS\nQTY\nEQUIPMENT\nQTY\nMATERIALS\n\n1\nSemen transport\nbox\n5 reams\nBond paper\n\n2 spray\nbottles\nPheromones\n\n2 bottles\nSemen (for the\nsnout for heat\ndetection)\n\n100\nbottles\nSemen (for AI)\n\n4 pcs\nPre-warmed\ncollecting cup\n\n1 box\nSemen filter\n\n1 box\nRubber band\n\n30 L.\nDistilled water\n\n1 box\nPlastic gloves\n\n12 pcs.\nNutrient agar plates\n\n2 bottles\nLubricant\n\n4\nLaboratory\nthermometer\n\nIce\n\nDamp cloth/ used\nnewspaper\n\n6 rolls\nTissue paper\n\nModels/actual\nobjects\n\nLearning Materials\n\n6\nPractice animals\n(boar)\n12 pcs\nTraining manuals\n\n5\nPractice animals\n(Sow/gilt)\n1\nAnimal charts\n\n1\nDummy sow\n1\nAnimal breeds\n\n1\nVideo materials\n\n12 pcs\nForms(animal\ninformation sheets,\nsow card, boar\ncard)\n\n--- PDF PAGE 50 ---\nTR-ARTIFCIAL INSEMINATION (SWINE)\n48\n3.5 TRAINING FACILITIES\n\n ARTIFICIAL INSEMINATION (SWINE) NC II\n\nBased on a class size of 12 students/trainees\n\nSPACE\nREQUIREMENT\nSIZE IN METERS\nTOTAL AREA IN SQ.\nMETERS\n•\nCollecting pen\n2 x 3\n6\n• Boar pen\n3 x 4 per animal x 6\n72\n•\nSow/gilt stall\n2 x 0.65 x5 animal\n6.6\n•\nGilt’s pen\n1 .1 sq.m. per head x 5\n5.5\n•\nLecture Room\n7.00 x 5.00\n35.00\n•\nAI Laboratory room\n6 x 8\n48\n• Storage room\n4 x 3\n12\n• Learning resource\ncenter\n3 x 4\n12\n\n3.6 TRAINER’S QUALIFICATIONS FOR AGRICULTURE SECTOR\n\nARTIFICIAL INSEMINATION (SWINE) NC II\nTRAINER QUALIFICATION (TM I)\n•\nMust be a holder of Artificial Insemination NC II or Animal Science\nGraduate\n•\n Must have undergone training on Training Methodology I (TM I)\n•\n *Must be computer literate\n•\n Must be physically and mentally fit\n•\n *Must have at least 2 years job/industry experience\n\n*\nOptional. Only when required by the hiring institution.\n\nReference: TESDA Board Resolution No. 2004 03\n\n3.7.\nINSTITUTIONAL ASSESSMENT\n\nInstitutional assessment is undertaken by trainees to determine their\nachievement of units of competency . A certificate of achievement is issued for each\nunit of competency.\n\n--- PDF PAGE 51 ---\nTR-ARTIFCIAL INSEMINATION (SWINE)\n49"
