se litter has been weaned but which has not yet been bred or is not pregnant Purebreeding – is the mating of the unrelated individuals in the same breed Ration – the total amount of feeds taken in by an animal during a 24 hour period Selection – refers to the process of choosing males and females with desirable characteristics either for breeding or replacement stocks Semen- is an organic fluid from male animals, also known as seminal fluid, that may contain spermatozoa; a male secretion that consists of the seminal fluid and sperm cells Sow – a mature female hog that had given birth Swine – a collective term for hogs --- PDF PAGE 54 --- TR-ARTIFCIAL INSEMINATION (SWINE) 52 The Technical Education and Skills Development Authority (TESDA) wishes to extend gratitude and appreciation to the many representatives of business, industry, academe and government agencies and labor groups who donated their time and expertise to the development and validation of these Training Regulations. THE TECHNICAL EXPERT PANEL (TEP) Gil Austria, DVM Veterinarian/Manager Pork Producers Federation of the Philippines Editha E. Cabilitazan, DVM Training Specialist III International Training Center on Pig Husbandry Lipa City, Batangas Amy G. Eguia Training Specialist II International Training Center on Pig Husbandry Lipa City, Batangas Angel S. Morcozo, Jr. Senior Agriculturist Department of Agriculture, Agricultural Training Institute Servillano M. Javier Agriculturist I Lipa City Agriculture Office Noel L. Dimzon Veterinarian Technician Lipa City Veterinary Office Alvin M. Mojares Swine Technician/Farm Owner Mojares Farm Aldrin E. Pagcaliwangan Agriculturist Lipa City Agriculture Office The Participants in the National Validation of these Training Regulations: Alexander C. Castillo Center Director International Training Center on Pig Husbandry Lipa City, Batangas Hilario B. Azurin, Jr. Agriculturist I Municipal Agriculture Office, Local Government Unit Casiguran, Quezon Floro B. Agno Agricu