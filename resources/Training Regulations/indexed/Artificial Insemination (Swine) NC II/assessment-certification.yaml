  "source_text": "SECTION 4\nASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1.\nTo attain the National Qualification of Artificial Insemination (Swine) NC\nII, the candidate must demonstrate competence in all the units listed in\nSection 1. Successful candidates shall be awarded a National\nCertificate signed by the TESDA Director General.\n\n4.2.\nAssessment shall focus on the core units of competency. The basic\nand common units shall be integrated or assessed concurrently with\nthe core units.\n\n4.3.\nThe following are qualified to apply for assessment and certification:\n\n4.4.1 Graduates of formal, non-formal and informal including\nenterprise-based training programs with six (6) months work\nexposure, with consideration of success in conception and\nfarrowing rate.\n\n4.4.2 Experienced Workers (wage employed or self-employed)\n\n4.4.\nThe guidelines on assessment and certification are discussed in detail\nin the Procedures Manual on Assessment and Certification and\nGuidelines on the Implementation of the Philippine TVET Qualification\nand Certification System (PTQCS).\n\n--- PDF PAGE 52 ---\nTR-ARTIFCIAL INSEMINATION (SWINE)\n50\n\nSupermarket of Competencies\nAGRI-FISHERY Sector\nConduct\nAwareness\nProgram on\nArtificial\nInsemination\nEstablish\nreadiness of\nanimal for\nartificial\ninsemination\nCollect swine\nsemne\nPerform artificial\ninsemination (AI)\nPrepare artificial\ninsemination (AI)\ndocumentations\nand reports\nCORE\nCOMPETENCIES\n\nCOMMON\nCOMPETENCIES\nApply Safely\nMeasures in\nfarm\noperations\nUse Farm Tools\nand Equipment\nPerform\nEstimation and\nBasic Calculation\nWork in team\nenvironment\nParticipate in\nworkplace\ncommunication\nBASIC\nCOMPETENCIES\nPractice career\nprofessionalism\n\nPractice occupational\nhealth and safety\nprocedures\n\n--- PDF PAGE 53 ---\nTR-ARTIFCIAL INSEMINATION (SWINE)\n51\nDEFINITION OF TERMS\n\nArtificial Insemination – introduction of sperm cells into the female’s reproductive\ntract (cervix) artificially using a plastic or rubber catheter\n\nBarrow – a male swine, castrated (testicles removed) before it reaches sexual\nmaturity\n\nBoar – uncastrated male swine usually kept for breeding\n\nCrossbreed – a group of animals produced by mating two or more different breeds\nor strains of animals\n\nCulling – is the removal of undesirable or inferior animals in the herd based on\nimportant economic traits and overall performance\n\nEstrus – period of time when the female will accept male. Also known as heat period\n\nFarrowing – the act of giving birth in pigs or swine\n\nGestation Period – refers to the period of carrying the young in the womb\n\nGilt – a young female hog that has not given birth yet\n\nInbreeding – mating of closely related animals in a herd\n\nLivestock – domestic animals kept for use on a farm and raised for sale and profit\n\nLitter – the offsprings at one birth of a multiparous or animal like swine\n\nLitter Size – refers to the aggregate number of piglets per farrowing\n\nDry sow – a sow whose litter has been weaned but which has not yet been bred or\nis not pregnant\n\nPurebreeding – is the mating of the unrelated individuals in the same breed\n\nRation – the total amount of feeds taken in by an animal during a 24 hour period\n\nSelection – refers to the process of choosing males and females with desirable\ncharacteristics either for breeding or replacement stocks\n\nSemen- is an organic fluid from male animals, also known as seminal fluid, that may\ncontain spermatozoa; a male secretion that consists of the seminal fluid and\nsperm cells\n\nSow – a mature female hog that had given birth\n\nSwine – a collective term for hogs\n\n--- PDF PAGE 54 ---\nTR-ARTIFCIAL INSEMINATION (SWINE)\n52\nACKNOWLEDGEMENTS\n\nThe Technical Education and Skills Development Authority (TESDA) wishes\nto extend gratitude and appreciation to the many representatives of business,\nindustry, academe and government agencies and labor groups who donated their\ntime and expertise to the development and validation of these Training Regulations.\n\nTHE TECHNICAL EXPERT PANEL (TEP)\n\nGil Austria, DVM\nVeterinarian/Manager\nPork Producers Federation of the\nPhilippines\n Editha E. Cabilitazan, DVM\nTraining Specialist III\nInternational Training Center on Pig\nHusbandry\nLipa City, Batangas\n\nAmy G. Eguia\nTraining Specialist II\nInternational Training Center on Pig\nHusbandry\nLipa City, Batangas\nAngel S. Morcozo, Jr.\nSenior Agriculturist\nDepartment of Agriculture, Agricultural\nTraining Institute\n\nServillano M. Javier\nAgriculturist I\nLipa City Agriculture Office\nNoel L. Dimzon\nVeterinarian Technician\nLipa City Veterinary Office\nAlvin M. Mojares\nSwine Technician/Farm Owner\nMojares Farm\nAldrin E. Pagcaliwangan\nAgriculturist\nLipa City Agriculture Office\n\nThe Participants in the National Validation of these Training Regulations:\n\nAlexander C. Castillo\nCenter Director\nInternational Training Center on Pig\nHusbandry\nLipa City, Batangas\nHilario B. Azurin, Jr.\nAgriculturist I\nMunicipal Agriculture Office,\nLocal Government Unit\nCasiguran, Quezon\nFloro B. Agno\nAgricultural Center Chief I\nProvincial Veterinary Office\nBatangas\nAries P. Garcia\nCity Veterinarian\nCity Veterinary Office, Tanauan\nBatangas\nLorena M. Briones\nAgriculturist\nMunicipality Agriculture Office\nLocal Government Unit\nSto. Tomas, Batangas\n\nMariefe I. Ariate, DVM\nVeterinarian\nLocal Government Unit\nMunicipal Agriculture Office\nSto. Tomas, Batangas\n\n--- PDF PAGE 55 ---\nTR-ARTIFCIAL INSEMINATION (SWINE)\n53\n\nElena V. Bencito\nAgricultural Center Chief I\nProvincial Veterinary Office\nBatangas\n\nMelchor B. Lingga\nArtificial Insemination Technician\nOffice of the City Veterinary and\nAgriculture Services\nBolbok, Batangas City\n\nJefferson P. Endenerio\nAgriculturist\nMunicipal Agriculturist Office\nSto. Tomas, Batangas\n\nFelix C. Lingao\nPara Vet/Artificial Insemination\nTechnician\nCity Veterinary Office, Pangyao,\nLipa City, Batangas\nNestor A. Maderazo\nArtificial Insemination Technician\nDagatan, San Jose, Batangas\nRomelito R. Marasigan, DVM\nAgricultural Center Chief II\nProvincial Veterinary Office\nBatangas\nCarlito V. Lorzano\nAgricultural Center Chief I\nProvincial Veterinary Office\nBatangas\nVicente M. Jaceos\nArtificial Insemination Technician\nLocal Government Unit\nPadre Garcia, Batangas\nNorita S. Escandor, DVM\nSection Chief\nTraining Section\nInternational Training Center on Pig\nHusbandry\nLipa City, Batangas\n\nPatricio Coniendo\nAgriculturist\nMunicipal Agriculture Office\nLocal Government Unit\nPadre Garcia, Batangas\nJade B. Castaño\nArtificial Insemination Technician\nLocal Government Unit\nPadre Garcia, Batangas\n\nThe Management and Staff of the TESDA Secretariat\n\n•\nQualifications and Standards Office\n•\nCompetency Assessment and Certification Office"
