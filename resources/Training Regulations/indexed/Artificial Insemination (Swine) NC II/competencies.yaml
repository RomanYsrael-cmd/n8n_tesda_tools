          "source_text": "1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1. Demonstrated semen collection and handling.\n2. Required\nKnowledge and\nAttitudes\n\n2.1. Frequency of semen collection based on age of boar\n2.2. Collection techniques\n2.3. Semen quality\n2.4. Semen handling\n2.5. Animal handling\n2.6. Use and function of simple microscope\n2.7. Safety precautionary measures on handling boars\n2.8. Practicing 5S and 3Rs\n2.9. Communication\n2.4.1. Preparation of records.\n2.10. Safety Practices\n2.5.1. Wear rubber boots as safety measure\n2.5.2. Wear gloves to prevent zoonotic disease\ntransmission\n2.11. Codes and Regulations\n2. 6.1. Animal Welfare Act (RA 8485)\n2. 6.2. Environmental regulations (ex. waste management\nact)\n2.12. Attitudes\n2.7.1. Agility\n2.7.2. Patience\n2.7.3. Humane handling of animals\n3. Required Skills\n3.1. Using Personal Protective Equipment\n3.2. Record keeping\n3.3. Animal handling skills\n3.4. Communication skills\n3.5. Using microscope\n4. Method of\nAssessment\n\nmpetency in this unit must be assessed through:\n4.1. Oral interview\n4.2. Practical demonstration with questioning\n4.3. Observation with questioning\n4.4. Third party report\n4.5. Portfolio\n5. Resource\nImplication\n5.1. Practice Animals\n5.2. Microscope\n5.3. Farm facilities\n5.4. Ice or styrofoam box\n5.5. AI paraphernalia and other supplies\n5.6. Personal protective paraphernalia and devices\n5.7. Forms and logbook\n6. Context of\nAssessment\n6.1. Competency may be assessed individually in the actual\nworkplace or through accredited farms/institution.\n\n--- PDF PAGE 31 ---\nTR-ARTIFCIAL INSEMINATION (SWINE)\n29\n\nUNIT OF COMPETENCY\n:\nPERFORM ARTIFICIAL INSEMINATION ON\nSOW/GILT\n\nUNIT CODE\n:"
