        "source_text": "AGR621213\n\nUNIT DESCRIPTOR\n:\nThis unit covers the required documentation for\ntechnicians in the conduct of artificial insemination and\nrelated activities.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalized terms are elaborated in the Range of Variable\n1. Collect and process data\n1.1. Necessary forms are secured.\n1.2. Data is collected and processed as required in the\nforms.\n1.3. Evidence for breed registry is secured (applicable\nto technicians of private farms)\n2. Accomplish and submit\nforms\n2.1. Forms are accomplished and submitted to local\ngovernment unit.\n2.2. Summary report is prepared and submitted using\nrequired forms.\n2.3. File copies of accomplished forms and summary\nreport are kept and compiled by technicians\naccording to required filing procedures.\n\n--- PDF PAGE 35 ---\nTR-ARTIFCIAL INSEMINATION (SWINE)\n33\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Data\nThis refers to the following:\n1.1. Date and time of AI\n1.2. Boar ID\n1.3. Client’s name, address and contact number\n1.4. Number of parities\n1.5. Breed\n1.6. Name of Technician\n1.7. Body score\n1.8. Litter size and born alive\n2. Summary of report\nThis may include, but not limited to:\n2.1. Summary of AI service data\n2.2. Litter size\n2.3. Farrowing rate\n2.4. Conception rate\n\n--- PDF PAGE 36 ---\nTR-ARTIFCIAL INSEMINATION (SWINE)\n34\nEVIDENCE GUIDE\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1. Demonstrate data collection and processing.\n1.2. Made entries to required forms for submission.\n1.3. Prepare summary report for submission.\n2. Required\nKnowledge and\nAttitudes\n\n2.1. Familiarity with all the necessary forms.\n2.2. Familiarity with gestation lengths of swine\n2.3. Familiarity with breeds of swine\n2.4. Knowledge on basic animal husbandry practices\n2.5. Practicing 5S and 3Rs\n2.6. Systematic, thorough, and prompt in the accomplishment\nand submission of reports\n2.7. Accuracy of data entries in the forms\n2.8. Ability to meet deadlines\n3. Required Skills\n3.1. Basic record-keeping\n3.2. Arithmetic (Multiplication, Division, Addition and\nSubtraction)\n3.3. Communication skills\n4. Method of\nAssessment\n\nCompetency in this unit must be assessed through:\n4.1. Oral interview\n4.2. Written examination\n4.3. Demonstration with questioning\n4.4. Third party report\n4.5. Portfolio\n5. Resource\nImplication\n\n5.1. Required forms\n5.2. Calculator\n5.3. Breeding calendars\n5.4. Ballpens/Pencils\n6. Context of\nAssessment\n\n6.1. Competency may be assessed individually in the actual\nworkplace or through accredited farms/institution.\n\n--- PDF PAGE 37 ---\nTR-ARTIFCIAL INSEMINATION (SWINE)\n35\nELECTIVE COMPETENCY\n\nUNIT OF COMPETENCY: CONDUCT COMMUNITY AWARENESS PROGRAM ON\nARITIFICIAL INSEMINATION\n\nUNIT CODE :"
