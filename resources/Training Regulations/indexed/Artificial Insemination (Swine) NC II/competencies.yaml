          "source_text": "VARIABLE \nRANGE \n1. AI paraphernalia \nThis may include, but not limited to  \n1.1. Catheter \n1.2. Lubricant \n1.3. Semen \n1.4. Transport box \n1.5. Clean damp cloth or paper towel \n2. Preparatory \nactivities \nThis may include, but not limited to: \n2.1. Wear rubber boots \n2.2. Practice hygienic procedures for AI technician \n2.3. Cleaning of vulvar area of sow  \n2.4. Ensure cleanliness of insemination area \n2.5. Pre-warm semen \n3. Stimulated \nThis refers to the following techniques: \n3.1. Back pressure  \n3.2. Riding the back  \n3.3. Use of weights on the back of the sow (such as sandbag, \nbreeding saddle) \n3.4. Clitorial stimulation \n3.5. Haunch pressure  \n3.6. Use of pheromones (eg. boar saliva, sex odors, aerosol)  \n3.7. Semen on snout \n4. Environmental \nregulations \nThis may include but not limited to the following: \n4.1. Water \n4.1.1. RA 9275 ( Clean Water Act) \n4.1.2. DAO 1990-35 ( Revised effluent regulation) \n4.1.3. DAO 2004-25 ( Discharge permit) \n4.2. Solid \n4.2.1. RA 9003 ( Ecological Solid Waste Management Act \nof 2000 IRR RA 9003)\n5. Management of \nanimals \nThis includes the following: \n5.1. Minimize stress (eg. trauma, movement) \n5.2. Proper feeding  \n5.3. Perform heat detection after 18-24 days \n5.4. Humane handling of animals\n\n--- PDF PAGE 33 ---\nTR-ARTIFCIAL INSEMINATION (SWINE)   \n31"
