        "source_title": "COLLECT BOAR SEMEN",
        "source_text": "--- PDF PAGE 28 ---\nTR-ARTIFCIAL INSEMINATION (SWINE)   \n26 \n \nUNIT OF COMPETENCY\n:\nCOLLECT BOAR SEMEN\n \n \nUNIT CODE\n:\nAGR621211\nUNIT DESCRIPTOR \n: \nThis unit covers the outcomes in the preparation and \ntransport  of AI equipment, tools, supplies and \nmaterials, including hygiene and safety requirements to \nensure the integrity and quality of the semen prior to the \nAI procedure.\n \nELEMENT \nPERFORMANCE CRITERIA \nItalized terms are elaborated in the Range of Variable \n1. Carry-out preparatory \nactivities  \n \n1.1 \nBoar is cleaned and  dried  in accordance with the \nhygiene and safety requirements. \n1.2 \nAI Paraphernalia are  prepared according to \nstandard procedure.  \n1.3 \nPreparatory activities is performed for semen \ncollection in accordance with the hygiene and \nsafety requirements.  \n2. Perform collection of board \nsemen \n2.1 \nBoar is led to the collecting pen \n2.2 \nPreputial fluid is  removed according to procedure.\n2.3 \nPenile area is massaged to encourage ejaculation \nof semen.  \n2.4 \nSemen is collected according to standard \nprocedures. \n2.5 \nSemen evaluated to determine semen quality. \n2.6 \nRequired form for semen collection is \naccomplished and filed. \n2.7 \nSemen collection is  performed to ensure safety of \nthe boar, technician and other individuals. \n3. Handle boar semen for \ntransport \n3.1 \nCollected semen is transfer to pre-warmed semen \nbottles. \n3.2 \nSemen is properly packed according to required \ntemperature.\n\n--- PDF PAGE 29 ---\nTR-ARTIFCIAL INSEMINATION (SWINE)   \n27 \nRANGE OF VARIABLES \nVARIABLE \nRANGE \n1. AI Paraphernalia\nThis may include, but not limited to:\n1.1. Collecting cup \n1.2. Semen filter \n1.3. Distilled water \n1.4. Gloves (Powder -free  vinyl and plastic gloves) \n1.5. Disposable hand towel \n1.6. Neutral pH soap \n2. Preparatory \nactivities \nThese refer to the following:\n2.1 Wear personal protective paraphernalia( i.e. farm clothes/ \nand rubber boots) \n2.2 Penile area is clean and dry \n2.3 Trim sheath hair when necessary \n2.4 Wear powder-free vinyl and plastic gloves \n2.5 Pre-warm sterilized collecting cups prior to collection(to \navoid thermal shock) \n2.6 Adjust dummy height \n3. Evaluated\nThis includes the following:\n3.1. Visually \n3.2. Microscopically \n4. Semen quality\nThis refers to the following:\n4.1 Volume of semen  \n4.2 Color of semen \n4.3 Smell of semen \n4.4 Microscopic(sperm motility) \n5. Semen bottles\nThis may include, but not limited to:\n5.1 Squeeze bottles \n5.2 Flexi- tube \n5.3 Flat pack \n6. Packed\nThis refers to the following methods of handling semen after \nextraction: \n6.1 Wrapped with wet paper or cloth inside ice box without ice (if \nshort distance, that is within 30 minutes travel). \n6.2 Put in an ice or stryfoam box with ice (if long distance, that is \nmore than 30 minutes travel). \n7. Required form\nRequired form containing data such as:\n7.1 Breed and age of boar \n7.2 Date of collection \n7.3 Semen quality  \n7.4 Number of doses produced \n7.5 Source \n7.6 Boar ID\n8. Hygiene and safety \nrequirements \nThis refers to the following:\n8.1 Personal Hygiene(eg. no long nails, washing hands with \nneutral pH soap) \n8.2 Discard preputial fluid prior to collection \n8.3 Cleanliness and sanitation of collection area\n\n--- PDF PAGE 30 ---\nTR-ARTIFCIAL INSEMINATION (SWINE)   \n28 \nEVIDENCE GUIDE \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1. Demonstrated semen collection and handling.  \n2. Required \nKnowledge and \nAttitudes \n \n \n2.1. Frequency of semen collection based on age of boar  \n2.2. Collection techniques  \n2.3. Semen quality \n2.4. Semen handling \n2.5. Animal handling \n2.6. Use and function of simple microscope \n2.7. Safety precautionary measures on handling boars \n2.8. Practicing 5S and 3Rs \n2.9. Communication \n2.4.1. Preparation of records.  \n2.10. Safety Practices \n2.5.1. Wear rubber boots as safety measure \n2.5.2. Wear gloves to prevent zoonotic disease \ntransmission \n2.11. Codes and Regulations \n2. 6.1. Animal Welfare Act (RA 8485) \n2. 6.2. Environmental regulations (ex. waste management \nact) \n2.12. Attitudes \n2.7.1. Agility  \n2.7.2. Patience \n2.7.3. Humane handling of animals \n3. Required Skills \n3.1.  Using Personal Protective Equipment  \n3.2.  Record keeping \n3.3. Animal handling skills \n3.4. Communication skills \n3.5. Using microscope \n4. Method of \nAssessment \n \nmpetency in this unit must be assessed through: \n4.1. Oral interview \n4.2. Practical demonstration with questioning  \n4.3. Observation with questioning \n4.4. Third party report  \n4.5. Portfolio \n5. Resource \nImplication \n5.1. Practice Animals \n5.2. Microscope \n5.3. Farm facilities  \n5.4. Ice or styrofoam box  \n5.5.  AI paraphernalia and other supplies  \n5.6. Personal protective paraphernalia and devices \n5.7. Forms and logbook \n6. Context of \nAssessment \n6.1. Competency may be assessed individually in the actual \nworkplace or through accredited farms/institution.\n",
