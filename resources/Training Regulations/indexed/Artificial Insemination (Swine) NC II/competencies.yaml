        "source_text": "AGR621214\n\nUNIT DESCRIPTOR : This unit involves the skills, knowledge and attitudes\nrequired to conduct community awareness program on\nartificial insemination to the wider public. It includes\ncompetencies in gathering of information, approaching\nthe target clients and promoting artificial insemination.\n\nELEMENT\n\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Prepare for the\nconduct of\ncommunity\nawareness\nprograms\n1.1. Community consultation is conducted to ensure that\nprograms meet their needs.\n1.2. Coordination with local government and relevant\npersonnel is carried-out to determine objectives of the\nprogram.\n1.3. Programs are structured and finalized with reference to\nthe objectives.\n1.4. Relevant equipment, aids and other materials to be\nused are sourced and organized.\n2. Carry-out\ncommunity\nawareness\nprograms\n2.1. Information on artificial insemination is presented to the\ntarget clients in a clear and logical sequence.\n2.2. Programs are conducted using effective public speaking\ntechniques.\n2.3. Effective approach is used to assist the community in\nunderstanding the program.\n2.4. Opportunities are provided for the community to seek\nclarification on important points.\n2.5. Routine clients questions are answered and\nsupplemented with relevant information as needed.\n2.6. Queries outside the area of responsibility or expertise are\nreferred to appropriate personnel/area.\n2.7. Objections and adverse reactions are handled fittingly.\n\n--- PDF PAGE 38 ---\nTR-ARTIFCIAL INSEMINATION (SWINE)\n36\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Community\nThis may include, but not limited to:\n1.1 Individuals\n•\nFarmers\n•\nAnimal enthusiasts/hobbyists\n•\nOther interested individuals\n1.2 Groups and institutions:\n•\nFarmer’s Cooperatives\n•\nCommunity groups\n•\nSchools and Training Providers\n•\nLocal Government Units\n•\nNon-government institutions\n•\nPrivate associations\n2. Community\nconsultation\nCommunity consultation is done :\n2.1 To determine community expectations and needs\n2.2 To raise community awareness on existing programs\n3. Equipment, aids and\nother materials\nThese may include the following but not limited to:\n3.1 Equipment:\n•\nvideo and audio materials\n•\nwhiteboard\n•\nDVD player and monitor\n3.2 Aids and materials:\n•\ncharts and posters\n•\ndiagrams\n•\nhandouts\n•\ninformation kits\n•\nmodels (ex. Model of Reproductive tract)\n•\npamphlets\n•\nvideos\n4. Public speaking\ntechnique\nThis may include, but not limited to:\n4.1 audience interaction\n4.2 body language\n4.3 eye contact\n4.4 inflection\n4.5 pace of speech\n4.6 tone of voice\n\n5. Approach\nMay include but are not limited to:\n5.1 personal visitation\n5.2 film viewing/visual presentation\n5.3 information materials (eg. Pamphlets)\n5.4 over the telephone and text messaging\n5.5 demonstration/orientation\n6. Routine clients\nquestions\n\nRoutine clients questions may relate to:\n6.1 price\n6.2 features\n6.3 advantages and benefits\n\n--- PDF PAGE 39 ---\nTR-ARTIFCIAL INSEMINATION (SWINE)\n37\nEVIDENCE PLAN\n\n1. Critical aspects of\nCompetency\n\nAssessment requires evidence that the candidate:\n1.1 Prepared for the conduct of the community aware\n1.2 Carry-out community awareness programs\n2. Required\nKnowledge and\nAttitudes\n2.1. Data collection methods to support the development of\nmaterials\n2.2. Legislation relevant to the subject matter of the presentation\n2.3. Organisational policies and procedures relating to presenting\ninformation to the public\n2.4. Principles of animal welfare and ethics\n2.5. Practicing 5S and 3Rs\n2.6. Range of presentation aids and materials available to support\nthe presentation\n2.7. Range of communication strategies\n2.8. Relevant and current community awareness programs\n2.9. Technical information relevant to the presentation or subject\nmatter.\n2.10. Attitude\n• Courtesy\n• Patience\n• Innovative\n• Resourceful\n3. Required Skills\n3.1.Listening-questioning techniques.\n3.2. Verbal and non-verbal communication skills\n• negotiation techniques.\n• types and clients needs\n• handling clients objections\n3.3. Public speaking skills to include\n• opening techniques to awaken clients interest\n• strategies to focus clients specific needs\n• answering clients questions\n• handling customer objections and adverse reactions\n3.4. Skills in making simple visual aids (eg. drawing)\n4. Resource\nImplications\nThe following resource MUST be provided:\n4.1 a work environment\n4.2 relevant documentation, such as procedures manuals\n4.3 a range of clients with different requirements\n4.4 promotional materials (pamphlets)\n4.5 communication equipment (telephone, cellphone)\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1. Observation\n5.2. Demonstration with questioning\n5.3. Third-party reports\n5.4. Oral questioning/Interview\n5.5. Portfolio assessment\n6. Context of\nAssessment\n6.1.Assessment may be performed in the workplace or simulated\nworkplace situation\n6.2 Assessment activities are carried out through TESDA's\naccredited assessment center\n\n--- PDF PAGE 40 ---\nTR-ARTIFCIAL INSEMINATION (SWINE)\n38\n\nUNIT OF COMPETENCY\n:\nRENDER ASSISTANCE TO VETERINARY\nPROCEDURES RELATED TO REPRODUCTIVE\nPROBLEMS\n\nUNIT CODE\n:"
      }
