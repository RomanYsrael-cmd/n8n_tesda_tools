        "source_title": "CONFIRM READINESS OF SOW/GILT FOR ARTIFICIAL INSEMINATION",
        "source_text": "--- PDF PAGE 25 ---\nTR-ARTIFCIAL INSEMINATION (SWINE)   \n23 \nCORE COMPETENCIES \n   \nUNIT OF COMPETENCY \n: \nCONFIRM READINESS OF SOW/GILT FOR \nARTIFICIAL INSEMINATION\n \n \nUNIT CODE\n:\nAGR621210\n \n \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge, skills and attitudes \nrequired to confirm the readiness of sow/gilt for artificial \ninsemination. It includes validation information on \nanimal and assessing animal condition.\n \nELEMENT \nPERFORMANCE CRITERIA \nItalized terms are elaborated in the Range of Variable \n1. Validate information on \nanimal  \n1.1. Information on confirming   readiness of sow/gilt \nfor artificial insemination was collected in clear \nand logical sequence. \n1.2. Client’s and animal’s profile are recorded using \nthe prescribed forms and in accordance with \nstandard operating procedures. \n1.3. Transactions and coordination is made in \naccordance to communication etiquette. \n1.4. Accurate interpretation  and decision is made \nbased on the  gathered information. \n2. Assess animal condition \n2.1 \nPhysical condition of the animal is evaluated \nbased on recommended standards.  \n2.2 \nSigns of estrus are confirmed. \n2.3 \nHeat detection is conducted to determine the \nanimal is on standing heat.  \n2.4 \nTask is performed without causing injuries to the \nanimal, technician and others. \n2.5 \nAccurate interpretation  and decision is made \nbased on the  result of the actual heat detection.\n\n--- PDF PAGE 26 ---\nTR-ARTIFCIAL INSEMINATION (SWINE)   \n24 \nRANGE OF VARIABLES \nVARIABLE \nRANGE \n1. Animal profile \nThis includes the following information: \n1.1 Identification number(ID number) \n1.2 Age/date of birth \n1.3 Approximate weight \n1.4 Breed/Strain \n1.5 Number of parities \n1.6 Date of last weaning \n1.7 Dam and sire \n1.8 Date of last estrus \n1.9 Date of last breeding \n2. Transactions and \ncoordination \nThis refers to the following: \n2.1 Face to face \n2.2 Telephone/Cellphone conversation \n2.3 Text messaging \n3. Communication \netiquette \nThis may include, but not limited to: \n3.1 Politeness \n3.2 Courtesy \n3.3 Maintain composure \n3.4 Patience \n4. Recommended \nstandards \nThis includes the following: \n4.1 Body weight \n4.2 Body condition score \n4.3 Apparently healthy \n4.4 Age \n4.5 At least 2nd estrus (for gilt) \n5. Signs of estrus \nThis includes the following: \n5.1 Swelling and redness of vulvar lips \n5.2 Frequent urination \n5.3 Standing still when mounted \n5.4 Mucus discharge from the vagina \n5.5 Restlessness \n5.6 Loss of appetite \n5.7 Mounting other animals \n5.8 Number of days in estrus \n6. Heat detection \nThis includes the following: \n6.1 Back pressure test \n6.2 Riding on the back test \n6.3 Use of teaser boar \n6.4 Use of pheromones (eg. boar saliva, boar semen, \nsynthetic pheromones)\n\n--- PDF PAGE 27 ---\nTR-ARTIFCIAL INSEMINATION (SWINE)   \n25 \nEVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1. Made accurate estrus detection  \n2. Required \nKnowledge and \nAttitudes \n \n \n2.1 Signs of estrus \n2.2 Breeds  \n2.3 Animal conditions \n2.4 Heat detection techniques \n2.5 Practicing 5S and 3Rs \n2.6 Communication \n2. 5.1. Preparation of inventory reports, production and \nperformance records.  \n2.7 Safety practices \n2. 6.1. Personal protective paraphernalia or device (Rubber \nboots) \n2.8 Breeding calendar \n2.9 Codes and Regulations \n2. 8.1. Animal Welfare Act (RA 8485) \n2. 8.2. Environmental regulations (waste management act, \netc.) \n2.9 Attitudes \n2.9.1. Punctuality  \n2.9.2. Personal hygiene \n2.9.3. Ability to work well with others harmoniously \n3. Required Skills \n3.1. Using Personal Protective Equipment  \n3.2. Arithmetic (Multiplication, Division, Addition and Subtraction) \n3.3. Communicate effectively \n3.4. Usage of communication equipment \n4. Method of \nAssessment \n \nCompetency in this unit must be assessed through: \n4.1. Oral interview \n4.2. Practical demonstration with questioning  \n4.3. Observation with questioning \n4.4. Third party report  \n4.5. Portfolio \n5. Resource \nImplication \n \n5.1. Practice animals \n5.2. Farm facilities  \n5.3. Rubber boots and scrub suits \n5.4. Communication equipment \n5.5. Forms \n6. Context of \nAssessment \n6.1. Competency may be assessed individually in the actual \nworkplace or through accredited farms/institution.\n",
