        "source_text": "AGR621215\n\nUNIT DESCRIPTOR\n:\n This unit covers the required knowledge, skills and\nattitude to perform assistance of veterinary procedures\nrelated to swine reproductive problems, through\nidentification, reporting and administering of treatment\nand preventive procedures under the supervision of a\nLicensed Veterinarian.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalized terms are elaborated in the Range of Variable\n1. Recognize swine\nreproductive\nproblems/diseases\n1.1. Forms are secured from veterinarian\n1.2. Swine assessment/observation is made and\nfindings are noted on the prescribed forms\n1.3. Accomplished forms are submitted to veterinarian.\n1.4. Safety precautionary measures are observed using\nthe prescribed PPEs\n\n2. Administer drugs and\nbiologics connected with\nreproductive problems or\ndisease.\n2.1. Recommendations/prescriptions from the\nveterinarian are obtained\n2.2. Drugs and biologics are secured according to\nveterinarian’s prescription\n2.3. Drugs and biologics are administered according to\nveterinarian’s instructions\n2.4. Client are given advice after administration of drugs\nand biologics\n2.5. Veterinarian is given feedback regarding the\nservices rendered\n2.6. Daily/Monthly accomplishment report is prepared\nand submitted using required forms.\n2.7. File copies of accomplished forms and summary\nreport are kept and compiled by technicians\naccording to required filing procedures.\n\n--- PDF PAGE 41 ---\nTR-ARTIFCIAL INSEMINATION (SWINE)\n39\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. PPE\nMay include the following, but not limited to:\n1.1. Rubber boots\n1.2. Surgical gloves\n1.3. Face mask\n2. Drugs and\nbiologics\nThis includes the following:\n2.1. Antibiotics\n2.2. Vaccines\n2.3. Vitamins\n2.4. Parasiticides (external and internal)\n2.5. Hormones\n3. Advice\nThis includes the following:\n3.1. Observe after treatment of recommended dose of\nantibiotics\n3.2. Observe adverse reactions after vaccinations\n3.3. Observe for response after vitamin administration\n3.4. Observe for presence of internal and external parasites\nafter treatment dose.\n\n--- PDF PAGE 42 ---\nTR-ARTIFCIAL INSEMINATION (SWINE)\n40\nEVIDENCE GUIDE\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1. Recognized swine reproductive problems/diseases.\n1.2. Administered drugs and biologics.\n2. Required\nKnowledge and\nAttitudes\n\n2.1. Familiarity with all the necessary forms.\n2.2. Familiarity with administration techniques of drugs and\nbiologics\n2.3. Familiarity with symptoms of swine reproductive problems\n2.4. Systematic, thorough, and prompt in the accomplishment\nand submission of reports\n2.5. Practicing 5S and 3Rs\n2.6. Accuracy of data entries in the forms\n2.7. Ability to meet deadlines\n3. Required Skills\n3.1. Basic record-keeping\n3.2. Arithmetic (Multiplication, Division, Addition and\nSubtraction)\n3.3. Visual estimation of weight\n3.4. Skills in administration techniques of drugs and biologics\n3.5. Communication skills\n4. Method of\nAssessment\n\nCompetency in this unit must be assessed through:\n4.1. Oral interview\n4.2. Written examination\n4.3. Demonstration with questioning\n4.4. Third party report\n4.5. Portfolio\n5. Resource\nImplication\n\n5.1. Required forms\n5.2. Veterinary prescription\n5.3. Calculator\n5.4. Veterinary drugs and biologics\n5.5. Veterinary tools (syringe, needles, forceps, etc.)\n5.6. PPE (rubber boots, rubber gloves, face mask)\n5.7. Ballpens/Pencils\n5.8. Practice animals\n6. Context of\nAssessment\n\n6.1. Competency may be assessed individually in the actual\nworkplace or through accredited farms/institution.\n\n--- PDF PAGE 43 ---\nTR-ARTIFCIAL INSEMINATION (SWINE)\n41"
