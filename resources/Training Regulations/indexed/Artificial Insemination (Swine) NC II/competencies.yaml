is made\nbased on the gathered information.\n2. Assess animal condition\n2.1\nPhysical condition of the animal is evaluated\nbased on recommended standards.\n2.2\nSigns of estrus are confirmed.\n2.3\nHeat detection is conducted to determine the\nanimal is on standing heat.\n2.4\nTask is performed without causing injuries to the\nanimal, technician and others.\n2.5\nAccurate interpretation and decision is made\nbased on the result of the actual heat detection.\n\n--- PDF PAGE 26 ---\nTR-ARTIFCIAL INSEMINATION (SWINE)\n24\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Animal profile\nThis includes the following information:\n1.1 Identification number(ID number)\n1.2 Age/date of birth\n1.3 Approximate weight\n1.4 Breed/Strain\n1.5 Number of parities\n1.6 Date of last weaning\n1.7 Dam and sire\n1.8 Date of last estrus\n1.9 Date of last breeding\n2. Transactions and\ncoordination\nThis refers to the following:\n2.1 Face to face\n2.2 Telephone/Cellphone conversation\n2.3 Text messaging\n3. Communication\netiquette\nThis may include, but not limited to:\n3.1 Politeness\n3.2 Courtesy\n3.3 Maintain composure\n3.4 Patience\n4. Recommended\nstandards\nThis includes the following:\n4.1 Body weight\n4.2 Body condition score\n4.3 Apparently healthy\n4.4 Age\n4.5 At least 2nd estrus (for gilt)\n5. Signs of estrus\nThis includes the following:\n5.1 Swelling and redness of vulvar lips\n5.2 Frequent urination\n5.3 Standing still when mounted\n5.4 Mucus discharge from the vagina\n5.5 Restlessness\n5.6 Loss of appetite\n5.7 Mounting other animals\n5.8 Number of days in estrus\n6. Heat detection\nThis includes the following:\n6.1 Back pressure test\n6.2 Riding on the back test\n6.3 Use of teaser boar\n6.4 Use of pheromones (eg. boar saliva, boar semen,\nsynthetic pheromones)\n\n--- PDF PAGE 27 ---\nTR-ARTIFCIAL INSEMINATION (SWINE)\n25\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1. Made accurate estrus detection\n2. Required\nKnowledge and\nAttitudes\n\n2.1 Signs of estrus\n2.2 Breeds\n2.3 Animal conditions\n2.4 Heat detection techniques\n2.5 Practicing 5S and 3Rs\n2.6 Communication\n2. 5.1. Preparation of inventory reports, production and\nperformance records.\n2.7 Safety practices\n2. 6.1. Personal protective paraphernalia or device (Rubber\nboots)\n2.8 Breeding calendar\n2.9 Codes and Regulations\n2. 8.1. Animal Welfare Act (RA 8485)\n2. 8.2. Environmental regulations (waste management act,\netc.)\n2.9 Attitudes\n2.9.1. Punctuality\n2.9.2. Personal hygiene\n2.9.3. Ability to work well with others harmoniously\n3. Required Skills\n3.1. Using Personal Protective Equipment\n3.2. Arithmetic (Multiplication, Division, Addition and Subtraction)\n3.3. Communicate effectively\n3.4. Usage of communication equipment\n4. Method of\nAssessment\n\nCompetency in this unit must be assessed through:\n4.1. Oral interview\n4.2. Practical demonstration with questioning\n4.3. Observation with questioning\n4.4. Third party report\n4.5. Portfolio\n5. Resource\nImplication\n\n5.1. Practice animals\n5.2. Farm facilities\n5.3. Rubber boots and scrub suits\n5.4. Communication equipment\n5.5. Forms\n6. Context of\nAssessment\n6.1. Competency may be assessed individually in the actual\nworkplace or through accredited farms/institution.\n\n--- PDF PAGE 28 ---\nTR-ARTIFCIAL INSEMINATION (SWINE)\n26\n\nUNIT OF COMPETENCY\n:\nCOLLECT BOAR SEMEN\n\nUNIT CODE\n:\nAGR621211\nUNIT DESCRIPTOR\n:\nThis unit covers the outcomes in the preparation and\ntransport of AI equipment, tools, supplies and\nmaterials, including hygiene and safety requirements to\nensure the integrity and quality of the semen prior to the\nAI procedure.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalized terms are elaborated in the Range of Variable\n1. Carry-out preparatory\nactivities\n\n1.1\nBoar is cleaned and dried in accordance with the\nhygiene and safety requirements.\n1.2\nAI Paraphernalia are prepared according to\nstandard procedure.\n1.3\nPreparatory activities is performed for semen\ncollection in accordance with the hygiene and\nsafety requirements.\n2. Perform collection of board\nsemen\n2.1\nBoar is led to the collecting pen\n2.2\nPreputial fluid is removed according to procedure.\n2.3\nPenile area is massaged to encourage ejaculation\nof semen.\n2.4\nSemen is collected according to standard\nprocedures.\n2.5\nSemen evaluated to determine semen quality.\n2.6\nRequired form for semen collection is\naccomplished and filed.\n2.7\nSemen collection is performed to ensure safety of\nthe boar, technician and other individuals.\n3. Handle boar semen for\ntransport\n3.1\nCollected semen is transfer to pre-warmed semen\nbottles.\n3.2\nSemen is properly packed according to required\ntemperature.\n\n--- PDF PAGE 29 ---\nTR-ARTIFCIAL INSEMINATION (SWINE)\n27\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. AI Paraphernalia\nThis may include, but not limited to:\n1.1. Collecting cup\n1.2. Semen filter\n1.3. Distilled water\n1.4. Gloves (Powder -free vinyl and plastic gloves)\n1.5. Disposable hand towel\n1.6. Neutral pH soap\n2. Preparatory\nactivities\nThese refer to the following:\n2.1 Wear personal protective paraphernalia( i.e. farm clothes/\nand rubber boots)\n2.2 Penile area is clean and dry\n2.3 Trim sheath hair when necessary\n2.4 Wear powder-free vinyl and plastic gloves\n2.5 Pre-warm sterilized collecting cups prior to collection(to\navoid thermal shock)\n2.6 Adjust dummy height\n3. Evaluated\nThis includes the following:\n3.1. Visually\n3.2. Microscopically\n4. Semen quality\nThis refers to the following:\n4.1 Volume of semen\n4.2 Color of semen\n4.3 Smell of semen\n4.4 Microscopic(sperm motility)\n5. Semen bottles\nThis may include, but not limited to:\n5.1 Squeeze bottles\n5.2 Flexi- tube\n5.3 Flat pack\n6. Packed\nThis refers to the following methods of handling semen after\nextraction:\n6.1 Wrapped with wet paper or cloth inside ice box without ice (if\nshort distance, that is within 30 minutes travel).\n6.2 Put in an ice or stryfoam box with ice (if long distance, that is\nmore than 30 minutes travel).\n7. Required form\nRequired form containing data such as:\n7.1 Breed and age of boar\n7.2 Date of collection\n7.3 Semen quality\n7.4 Number of doses produced\n7.5 Source\n7.6 Boar ID\n8. Hygiene and safety\nrequirements\nThis refers to the following:\n8.1 Personal Hygiene(eg. no long nails, washing hands with\nneutral pH soap)\n8.2 Discard preputial fluid prior to collection\n8.3 Cleanliness and sanitation of collection area\n\n--- PDF PAGE 30 ---\nTR-ARTIFCIAL INSEMINATION (SWINE)\n28\nEVIDENCE GUIDE\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1. Demonstrated semen collection and handling.\n2. Required\nKnowledge and\nAttitudes\n\n2.1. Frequency of semen collection based on age of boar\n2.2. Collection techniques\n2.3. Semen quality\n2.4. Semen handling\n2.5. Animal handling\n2.6. Use and function of simple microscope\n2.7. Safety precautionary measures on handling boars\n2.8. Practicing 5S and 3Rs\n2.9. Communication\n2.4.1. Preparation of records.\n2.10. Safety Practices\n2.5.1. Wear rubber boots as safety measure\n2.5.2. Wear gloves to prevent zoonotic disease\ntransmission\n2.11. Codes and Regulations\n2. 6.1. Animal Welfare Act (RA 8485)\n2. 6.2. Environmental regulations (ex. waste management\nact)\n2.12. Attitudes\n2.7.1. Agility\n2.7.2. Patience\n2.7.3. Humane handling of animals\n3. Required Skills\n3.1. Using Personal Protective Equipment\n3.2. Record keeping\n3.3. Animal handling skills\n3.4. Communication skills\n3.5. Using microscope\n4. Method of\nAssessment\n\nmpetency in this unit must be assessed through:\n4.1. Oral interview\n4.2. Practical demonstration with questioning\n4.3. Observation with questioning\n4.4. Third party report\n4.5. Portfolio\n5. Resource\nImplication\n5.1. Practice Animals\n5.2. Microscope\n5.3. Farm facilities\n5.4. Ice or styrofoam box\n5.5. AI paraphernalia and other supplies\n5.6. Personal protective paraphernalia and devices\n5.7. Forms and logbook\n6. Context of\nAssessment\n6.1. Competency may be assessed individually in the actual\nworkplace or through accredited farms/institution.\n\n--- PDF PAGE 31 ---\nTR-ARTIFCIAL INSEMINATION (SWINE)\n29\n\nUNIT OF COMPETENCY\n:\nPERFORM ARTIFICIAL INSEMINATION ON\nSOW/GILT\n\nUNIT CODE\n:\nAGR621212\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes on\nthe performance of artificial insemination (AI). It\nincludes preparation and deposition of semen and the\nperforming of post-artificial insemination (AI) activities.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalized terms are elaborated in the Range of Variable\n1. Conduct preparatory\nactivities\n1.1. Semen to be used is secured in accordance with\nclients’ requirements/requests.\n1.2. AI paraphernalia is prepared in accordance to\nestablished procedures.\n1.3. Preparatory activities is performed for AI in\naccordance with the hygiene and safety\nrequirements.\n2. Deposit semen\n3.1.\nSow/gilt is stimulated prior to AI.\n3.2.\nSemen is deposited into the female reproductive\ntract following recommended procedure.\n3.3.\nTask is performed without causing injuries to the\nanimal, technician and others.\n3. Perform post-artificial\ninsemination (AI) activities\n\n4.1.\nCleaning of the external genitalia is performed\nusing suitable materials.\n4.2.\nWastes disposal is performed according to\nexisting environmental regulations.\n4.3.\nTask is performed without causing injuries to the\nanimal, technician and others\n4.4.\nClients are advised about the management of\nanimals after AI.\n4.5.\nAI activities are documented using prescribed\nforms.\n\n--- PDF PAGE 32 ---\nTR-ARTIFCIAL INSEMINATION (SWINE)\n30\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. AI paraphernalia\nThis may include, but not limited to\n1.1. Catheter\n1.2. Lubricant\n1.3. Semen\n1.4. Transport box\n1.5. Clean damp cloth or paper towel\n2. Preparatory\nactivities\nThis may include, but not limited to:\n2.1. Wear rubber boots\n2.2. Practice hygienic procedures for AI technician\n2.3. Cleaning of vulvar area of sow\n2.4. Ensure cleanliness of insemination area\n2.5. Pre-warm semen\n3. Stimulated\nThis refers to the following techniques:\n3.1. Back pressure\n3.2. Riding the back\n3.3. Use of weights on the back of the sow (such as sandbag,\nbreeding saddle)\n3.4. Clitorial stimulation\n3.5. Haunch pressure\n3.6. Use of pheromones (eg. boar saliva, sex odors, aerosol)\n3.7. Semen on snout\n4. Environmental\nregulations\nThis may include but not limited to the following:\n4.1. Water\n4.1.1. RA 9275 ( Clean Water Act)\n4.1.2. DAO 1990-35 ( Revised effluent regulation)\n4.1.3. DAO 2004-25 ( Discharge permit)\n4.2. Solid\n4.2.1. RA 9003 ( Ecological Solid Waste Management Act\nof 2000 IRR RA 9003)\n5. Management of\nanimals\nThis includes the following:\n5.1. Minimize stress (eg. trauma, movement)\n5.2. Proper feeding\n5.3. Perform heat detection after 18-24 days\n5.4. Humane handling of animals\n\n--- PDF PAGE 33 ---\nTR-ARTIFCIAL INSEMINATION (SWINE)\n31\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1. Demonstrated preparation and deposition of semen in the\nfemale reproductive tract within the time frame.\n\n2. Required\nKnowledge and\nAttitudes\n\n2.1. Procedures of semen preparation and deposition.\n2.2. Reproductive system and cycle of swine\n2.3. Waste management (ex. 3Rs)\n2.4. Practicing 5S\n2.5. Communication\n2. 4.1. Preparation of inventory reports, production and\nperformance records.\n2.6. Safety Practices\n2. 5.1. Personal protective paraphernalia or device\n2. 5.2. Humane handling of the animal\n2.7. Codes and Regulations\n2. 6.1. Animal Welfare Act (RA 8485)\n2. 6.2. Environmental regulations\n2.8. Values\n2.7.1. Punctuality\n2.7.2. Personal hygiene\n2.7.3. Ability to work well with others harmoniously\n3. Required Skills\n3.1.\nUsing Personal Protective Equipment\n3.2.\nArithmetic\n3.3.\nCommunication skills\n4. Method of\nAssessment\n\nCompetency in this unit must be assessed through:\n4.1. Oral interview\n4.2. Practical demonstration with questioning\n4.3. Observation with questioning\n4.4. Third party report\n4.5. Portfolio\n5. Resource\nImplication\n\n5.1 Practice animals\n5.2 Farm facilities\n5.3 Artificial Insemination paraphernalia and supplies\n5.4 Personal Protective Paraphernalia\n5.5 Forms\n6. Context of\nAssessment\n\n6.1 Competency may be assessed individually in the actual\nworkplace or through accredited farms/institution.\n\n--- PDF PAGE 34 ---\nTR-ARTIFCIAL INSEMINATION (SWINE)\n32\n\nUNIT OF COMPETENCY\n:\nPREPARE DOCUMENTATIONS AND REPORTS ON\nSOW/GILT ARTIFICIAL INSEMINATION (AI)\nACTIVITIES\n\nUNIT CODE\n:\nAGR621213\n\nUNIT DESCRIPTOR\n:\nThis unit covers the required documentation for\ntechnicians in the conduct of artificial insemination and\nrelated activities.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalized terms are elaborated in the Range of Variable\n1. Collect and process data\n1.1. Necessary forms are secured.\n1.2. Data is collected and processed as required in the\nforms.\n1.3. Evidence for breed registry is secured (applicable\nto technicians of private farms)\n2. Accomplish and submit\nforms\n2.1. Forms are accomplished and submitted to local\ngovernment unit.\n2.2. Summary report is prepared and submitted using\nrequired forms.\n2.3. File copies of accomplished forms and summary\nreport are kept and compiled by technicians\naccording to required filing procedures.\n\n--- PDF PAGE 35 ---\nTR-ARTIFCIAL INSEMINATION (SWINE)\n33\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Data\nThis refers to the following:\n1.1. Date and time of AI\n1.2. Boar ID\n1.3. Client’s name, address and contact number\n1.4. Number of parities\n1.5. Breed\n1.6. Name of Technician\n1.7. Body score\n1.8. Litter size and born alive\n2. Summary of report\nThis may include, but not limited to:\n2.1. Summary of AI service data\n2.2. Litter size\n2.3. Farrowing rate\n2.4. Conception rate\n\n--- PDF PAGE 36 ---\nTR-ARTIFCIAL INSEMINATION (SWINE)\n34\nEVIDENCE GUIDE\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1. Demonstrate data collection and processing.\n1.2. Made entries to required forms for submission.\n1.3. Prepare summary report for submission.\n2. Required\nKnowledge and\nAttitudes\n\n2.1. Familiarity with all the necessary forms.\n2.2. Familiarity with gestation lengths of swine\n2.3. Familiarity with breeds of swine\n2.4. Knowledge on basic animal husbandry practices\n2.5. Practicing 5S and 3Rs\n2.6. Systematic, thorough, and prompt in the accomplishment\nand submission of reports\n2.7. Accuracy of data entries in the forms\n2.8. Ability to meet deadlines\n3. Required Skills\n3.1. Basic record-keeping\n3.2. Arithmetic (Multiplication, Division, Addition and\nSubtraction)\n3.3. Communication skills\n4. Method of\nAssessment\n\nCompetency in this unit must be assessed through:\n4.1. Oral interview\n4.2. Written examination\n4.3. Demonstration with questioning\n4.4. Third party report\n4.5. Portfolio\n5. Resource\nImplication\n\n5.1. Required forms\n5.2. Calculator\n5.3. Breeding calendars\n5.4. Ballpens/Pencils\n6. Context of\nAssessment\n\n6.1. Competency may be assessed individually in the actual\nworkplace or through accredited farms/institution.\n\n--- PDF PAGE 37 ---\nTR-ARTIFCIAL INSEMINATION (SWINE)\n35\nELECTIVE COMPETENCY\n\nUNIT OF COMPETENCY: CONDUCT COMMUNITY AWARENESS PROGRAM ON\nARITIFICIAL INSEMINATION\n\nUNIT CODE : AGR621214\n\nUNIT DESCRIPTOR : This unit involves the skills, knowledge and attitudes\nrequired to conduct community awareness program on\nartificial insemination to the wider public. It includes\ncompetencies in gathering of information, approaching\nthe target clients and promoting artificial insemination.\n\nELEMENT\n\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Prepare for the\nconduct of\ncommunity\nawareness\nprograms\n1.1. Community consultation is conducted to ensure that\nprograms meet their needs.\n1.2. Coordination with local government and relevant\npersonnel is carried-out to determine objectives of the\nprogram.\n1.3. Programs are structured and finalized with reference to\nthe objectives.\n1.4. Relevant equipment, aids and other materials to be\nused are sourced and organized.\n2. Carry-out\ncommunity\nawareness\nprograms\n2.1. Information on artificial insemination is presented to the\ntarget clients in a clear and logical sequence.\n2.2. Programs are conducted using effective public speaking\ntechniques.\n2.3. Effective approach is used to assist the community in\nunderstanding the program.\n2.4. Opportunities are provided for the community to seek\nclarification on important points.\n2.5. Routine clients questions are answered and\nsupplemented with relevant information as needed.\n2.6. Queries outside the area of responsibility or expertise are\nreferred to appropriate personnel/area.\n2.7. Objections and adverse reactions are handled fittingly.\n\n--- PDF PAGE 38 ---\nTR-ARTIFCIAL INSEMINATION (SWINE)\n36\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Community\nThis may include, but not limited to:\n1.1 Individuals\n•\nFarmers\n•\nAnimal enthusiasts/hobbyists\n•\nOther interested individuals\n1.2 Groups and institutions:\n•\nFarmer’s Cooperatives\n•\nCommunity groups\n•\nSchools and Training Providers\n•\nLocal Government Units\n•\nNon-government institutions\n•\nPrivate associations\n2. Community\nconsultation\nCommunity consultation is done :\n2.1 To determine community expectations and needs\n2.2 To raise community awareness on existing programs\n3. Equipment, aids and\nother materials\nThese may include the following but not limited to:\n3.1 Equipment:\n•\nvideo and audio materials\n•\nwhiteboard\n•\nDVD player and monitor\n3.2 Aids and materials:\n•\ncharts and posters\n•\ndiagrams\n•\nhandouts\n•\ninformation kits\n•\nmodels (ex. Model of Reproductive tract)\n•\npamphlets\n•\nvideos\n4. Public speaking\ntechnique\nThis may include, but not limited to:\n4.1 audience interaction\n4.2 body language\n4.3 eye contact\n4.4 inflection\n4.5 pace of speech\n4.6 tone of voice\n\n5. Approach\nMay include but are not limited to:\n5.1 personal visitation\n5.2 film viewing/visual presentation\n5.3 information materials (eg. Pamphlets)\n5.4 over the telephone and text messaging\n5.5 demonstration/orientation\n6. Routine clients\nquestions\n\nRoutine clients questions may relate to:\n6.1 price\n6.2 features\n6.3 advantages and benefits\n\n--- PDF PAGE 39 ---\nTR-ARTIFCIAL INSEMINATION (SWINE)\n37\nEVIDENCE PLAN\n\n1. Critical aspects of\nCompetency\n\nAssessment requires evidence that the candidate:\n1.1 Prepared for the conduct of the community aware\n1.2 Carry-out community awareness programs\n2. Required\nKnowledge and\nAttitudes\n2.1. Data collection methods to support the development of\nmaterials\n2.2. Legislation relevant to the subject matter of the presentation\n2.3. Organisational policies and procedures relating to presenting\ninformation to the public\n2.4. Principles of animal welfare and ethics\n2.5. Practicing 5S and 3Rs\n2.6. Range of presentation aids and materials available to support\nthe presentation\n2.7. Range of communication strategies\n2.8. Relevant and current community awareness programs\n2.9. Technical information relevant to the presentation or subject\nmatter.\n2.10. Attitude\n• Courtesy\n• Patience\n• Innovative\n• Resourceful\n3. Required Skills\n3.1.Listening-questioning techniques.\n3.2. Verbal and non-verbal communication skills\n• negotiation techniques.\n• types and clients needs\n• handling clients objections\n3.3. Public speaking skills to include\n• opening techniques to awaken clients interest\n• strategies to focus clients specific needs\n• answering clients questions\n• handling customer objections and adverse reactions\n3.4. Skills in making simple visual aids (eg. drawing)\n4. Resource\nImplications\nThe following resource MUST be provided:\n4.1 a work environment\n4.2 relevant documentation, such as procedures manuals\n4.3 a range of clients with different requirements\n4.4 promotional materials (pamphlets)\n4.5 communication equipment (telephone, cellphone)\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1. Observation\n5.2. Demonstration with questioning\n5.3. Third-party reports\n5.4. Oral questioning/Interview\n5.5. Portfolio assessment\n6. Context of\nAssessment\n6.1.Assessment may be performed in the workplace or simulated\nworkplace situation\n6.2 Assessment activities are carried out through TESDA's\naccredited assessment center\n\n--- PDF PAGE 40 ---\nTR-ARTIFCIAL INSEMINATION (SWINE)\n38\n\nUNIT OF COMPETENCY\n:\nRENDER ASSISTANCE TO VETERINARY\nPROCEDURES RELATED TO REPRODUCTIVE\nPROBLEMS\n\nUNIT CODE\n:\nAGR621215\n\nUNIT DESCRIPTOR\n:\n This unit covers the required knowledge, skills and\nattitude to perform assistance of veterinary procedures\nrelated to swine reproductive problems, through\nidentification, reporting and administering of treatment\nand preventive procedures under the supervision of a\nLicensed Veterinarian.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalized terms are elaborated in the Range of Variable\n1. Recognize swine\nreproductive\nproblems/diseases\n1.1. Forms are secured from veterinarian\n1.2. Swine assessment/observation is made and\nfindings are noted on the prescribed forms\n1.3. Accomplished forms are submitted to veterinarian.\n1.4. Safety precautionary measures are observed using\nthe prescribed PPEs\n\n2. Administer drugs and\nbiologics connected with\nreproductive problems or\ndisease.\n2.1. Recommendations/prescriptions from the\nveterinarian are obtained\n2.2. Drugs and biologics are secured according to\nveterinarian’s prescription\n2.3. Drugs and biologics are administered according to\nveterinarian’s instructions\n2.4. Client are given advice after administration of drugs\nand biologics\n2.5. Veterinarian is given feedback regarding the\nservices rendered\n2.6. Daily/Monthly accomplishment report is prepared\nand submitted using required forms.\n2.7. File copies of accomplished forms and summary\nreport are kept and compiled by technicians\naccording to required filing procedures.\n\n--- PDF PAGE 41 ---\nTR-ARTIFCIAL INSEMINATION (SWINE)\n39\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. PPE\nMay include the following, but not limited to:\n1.1. Rubber boots\n1.2. Surgical gloves\n1.3. Face mask\n2. Drugs and\nbiologics\nThis includes the following:\n2.1. Antibiotics\n2.2. Vaccines\n2.3. Vitamins\n2.4. Parasiticides (external and internal)\n2.5. Hormones\n3. Advice\nThis includes the following:\n3.1. Observe after treatment of recommended dose of\nantibiotics\n3.2. Observe adverse reactions after vaccinations\n3.3. Observe for response after vitamin administration\n3.4. Observe for presence of internal and external parasites\nafter treatment dose.\n\n--- PDF PAGE 42 ---\nTR-ARTIFCIAL INSEMINATION (SWINE)\n40\nEVIDENCE GUIDE\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1. Recognized swine reproductive problems/diseases.\n1.2. Administered drugs and biologics.\n2. Required\nKnowledge and\nAttitudes\n\n2.1. Familiarity with all the necessary forms.\n2.2. Familiarity with administration techniques of drugs and\nbiologics\n2.3. Familiarity with symptoms of swine reproductive problems\n2.4. Systematic, thorough, and prompt in the accomplishment\nand submission of reports\n2.5. Practicing 5S and 3Rs\n2.6. Accuracy of data entries in the forms\n2.7. Ability to meet deadlines\n3. Required Skills\n3.1. Basic record-keeping\n3.2. Arithmetic (Multiplication, Division, Addition and\nSubtraction)\n3.3. Visual estimation of weight\n3.4. Skills in administration techniques of drugs and biologics\n3.5. Communication skills\n4. Method of\nAssessment\n\nCompetency in this unit must be assessed through:\n4.1. Oral interview\n4.2. Written examination\n4.3. Demonstration with questioning\n4.4. Third party report\n4.5. Portfolio\n5. Resource\nImplication\n\n5.1. Required forms\n5.2. Veterinary prescription\n5.3. Calculator\n5.4. Veterinary drugs and biologics\n5.5. Veterinary tools (syringe, needles, forceps, etc.)\n5.6. PPE (rubber boots, rubber gloves, face mask)\n5.7. Ballpens/Pencils\n5.8. Practice animals\n6. Context of\nAssessment\n\n6.1. Competency may be assessed individually in the actual\nworkplace or through accredited farms/institution.\n\n--- PDF PAGE 43 ---\nTR-ARTIFCIAL INSEMINATION (SWINE)\n41"
