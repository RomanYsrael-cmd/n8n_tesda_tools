          "source_text": "VARIABLE \nRANGE \n1. AI Paraphernalia\nThis may include, but not limited to:\n1.1. Collecting cup \n1.2. Semen filter \n1.3. Distilled water \n1.4. Gloves (Powder -free  vinyl and plastic gloves) \n1.5. Disposable hand towel \n1.6. Neutral pH soap \n2. Preparatory \nactivities \nThese refer to the following:\n2.1 Wear personal protective paraphernalia( i.e. farm clothes/ \nand rubber boots) \n2.2 Penile area is clean and dry \n2.3 Trim sheath hair when necessary \n2.4 Wear powder-free vinyl and plastic gloves \n2.5 Pre-warm sterilized collecting cups prior to collection(to \navoid thermal shock) \n2.6 Adjust dummy height \n3. Evaluated\nThis includes the following:\n3.1. Visually \n3.2. Microscopically \n4. Semen quality\nThis refers to the following:\n4.1 Volume of semen  \n4.2 Color of semen \n4.3 Smell of semen \n4.4 Microscopic(sperm motility) \n5. Semen bottles\nThis may include, but not limited to:\n5.1 Squeeze bottles \n5.2 Flexi- tube \n5.3 Flat pack \n6. Packed\nThis refers to the following methods of handling semen after \nextraction: \n6.1 Wrapped with wet paper or cloth inside ice box without ice (if \nshort distance, that is within 30 minutes travel). \n6.2 Put in an ice or stryfoam box with ice (if long distance, that is \nmore than 30 minutes travel). \n7. Required form\nRequired form containing data such as:\n7.1 Breed and age of boar \n7.2 Date of collection \n7.3 Semen quality  \n7.4 Number of doses produced \n7.5 Source \n7.6 Boar ID\n8. Hygiene and safety \nrequirements \nThis refers to the following:\n8.1 Personal Hygiene(eg. no long nails, washing hands with \nneutral pH soap) \n8.2 Discard preputial fluid prior to collection \n8.3 Cleanliness and sanitation of collection area\n\n--- PDF PAGE 30 ---\nTR-ARTIFCIAL INSEMINATION (SWINE)   \n28"
