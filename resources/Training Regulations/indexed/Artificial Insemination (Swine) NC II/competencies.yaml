        "source_text": "AGR621210\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes\nrequired to confirm the readiness of sow/gilt for artificial\ninsemination. It includes validation information on\nanimal and assessing animal condition.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalized terms are elaborated in the Range of Variable\n1. Validate information on\nanimal\n1.1. Information on confirming readiness of sow/gilt\nfor artificial insemination was collected in clear\nand logical sequence.\n1.2. Client’s and animal’s profile are recorded using\nthe prescribed forms and in accordance with\nstandard operating procedures.\n1.3. Transactions and coordination is made in\naccordance to communication etiquette.\n1.4. Accurate interpretation and decision is made\nbased on the gathered information.\n2. Assess animal condition\n2.1\nPhysical condition of the animal is evaluated\nbased on recommended standards.\n2.2\nSigns of estrus are confirmed.\n2.3\nHeat detection is conducted to determine the\nanimal is on standing heat.\n2.4\nTask is performed without causing injuries to the\nanimal, technician and others.\n2.5\nAccurate interpretation and decision is made\nbased on the result of the actual heat detection.\n\n--- PDF PAGE 26 ---\nTR-ARTIFCIAL INSEMINATION (SWINE)\n24\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Animal profile\nThis includes the following information:\n1.1 Identification number(ID number)\n1.2 Age/date of birth\n1.3 Approximate weight\n1.4 Breed/Strain\n1.5 Number of parities\n1.6 Date of last weaning\n1.7 Dam and sire\n1.8 Date of last estrus\n1.9 Date of last breeding\n2. Transactions and\ncoordination\nThis refers to the following:\n2.1 Face to face\n2.2 Telephone/Cellphone conversation\n2.3 Text messaging\n3. Communication\netiquette\nThis may include, but not limited to:\n3.1 Politeness\n3.2 Courtesy\n3.3 Maintain composure\n3.4 Patience\n4. Recommended\nstandards\nThis includes the following:\n4.1 Body weight\n4.2 Body condition 