        "source_text": "AGR621212\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes on\nthe performance of artificial insemination (AI). It\nincludes preparation and deposition of semen and the\nperforming of post-artificial insemination (AI) activities.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalized terms are elaborated in the Range of Variable\n1. Conduct preparatory\nactivities\n1.1. Semen to be used is secured in accordance with\nclients’ requirements/requests.\n1.2. AI paraphernalia is prepared in accordance to\nestablished procedures.\n1.3. Preparatory activities is performed for AI in\naccordance with the hygiene and safety\nrequirements.\n2. Deposit semen\n3.1.\nSow/gilt is stimulated prior to AI.\n3.2.\nSemen is deposited into the female reproductive\ntract following recommended procedure.\n3.3.\nTask is performed without causing injuries to the\nanimal, technician and others.\n3. Perform post-artificial\ninsemination (AI) activities\n\n4.1.\nCleaning of the external genitalia is performed\nusing suitable materials.\n4.2.\nWastes disposal is performed according to\nexisting environmental regulations.\n4.3.\nTask is performed without causing injuries to the\nanimal, technician and others\n4.4.\nClients are advised about the management of\nanimals after AI.\n4.5.\nAI activities are documented using prescribed\nforms.\n\n--- PDF PAGE 32 ---\nTR-ARTIFCIAL INSEMINATION (SWINE)\n30\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. AI paraphernalia\nThis may include, but not limited to\n1.1. Catheter\n1.2. Lubricant\n1.3. Semen\n1.4. Transport box\n1.5. Clean damp cloth or paper towel\n2. Preparatory\nactivities\nThis may include, but not limited to:\n2.1. Wear rubber boots\n2.2. Practice hygienic procedures for AI technician\n2.3. Cleaning of vulvar area of sow\n2.4. Ensure cleanliness of insemination area\n2.5. Pre-warm semen\n3. Stimulated\nThis refers to the following techniques:\n3.1. Back pressure\n3.2. Riding the back\n3.3. Use of weights on the back of the sow (such as sandbag,\nbreeding saddle)\n3.4. Clitorial stimulation\n3.5. Haunch pressure\n3.6. Use of pheromones (eg. boar saliva, sex odors, aerosol)\n3.7. Semen on snout\n4. Environmental\nregulations\nThis may include but not limited to the following:\n4.1. Water\n4.1.1. RA 9275 ( Clean Water Act)\n4.1.2. DAO 1990-35 ( Revised effluent regulation)\n4.1.3. DAO 2004-25 ( Discharge permit)\n4.2. Solid\n4.2.1. RA 9003 ( Ecological Solid Waste Management Act\nof 2000 IRR RA 9003)\n5. Management of\nanimals\nThis includes the following:\n5.1. Minimize stress (eg. trauma, movement)\n5.2. Proper feeding\n5.3. Perform heat detection after 18-24 days\n5.4. Humane handling of animals\n\n--- PDF PAGE 33 ---\nTR-ARTIFCIAL INSEMINATION (SWINE)\n31\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1. Demonstrated preparation and deposition of semen in the\nfemale reproductive tract within the time frame.\n\n2. Required\nKnowledge and\nAttitudes\n\n2.1. Procedures of semen preparation and deposition.\n2.2. Reproductive system and cycle of swine\n2.3. Waste management (ex. 3Rs)\n2.4. Practicing 5S\n2.5. Communication\n2. 4.1. Preparation of inventory reports, production and\nperformance records.\n2.6. Safety Practices\n2. 5.1. Personal protective paraphernalia or device\n2. 5.2. Humane handling of the animal\n2.7. Codes and Regulations\n2. 6.1. Animal Welfare Act (RA 8485)\n2. 6.2. Environmental regulations\n2.8. Values\n2.7.1. Punctuality\n2.7.2. Personal hygiene\n2.7.3. Ability to work well with others harmoniously\n3. Required Skills\n3.1.\nUsing Personal Protective Equipment\n3.2.\nArithmetic\n3.3.\nCommunication skills\n4. Method of\nAssessment\n\nCompetency in this unit must be assessed through:\n4.1. Oral interview\n4.2. Practical demonstration with questioning\n4.3. Observation with questioning\n4.4. Third party report\n4.5. Portfolio\n5. Resource\nImplication\n\n5.1 Practice animals\n5.2 Farm facilities\n5.3 Artificial Insemination paraphernalia and supplies\n5.4 Personal Protective Paraphernalia\n5.5 Forms\n6. Context of\nAssessment\n\n6.1 Competency may be assessed individually in the actual\nworkplace or through accredited farms/institution.\n\n--- PDF PAGE 34 ---\nTR-ARTIFCIAL INSEMINATION (SWINE)\n32\n\nUNIT OF COMPETENCY\n:\nPREPARE DOCUMENTATIONS AND REPORTS ON\nSOW/GILT ARTIFICIAL INSEMINATION (AI)\nACTIVITIES\n\nUNIT CODE\n:"
