      "number": "4.1",
      "text": "NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS 4.1.1 To attain the National Qualification of RAC Servicing (DomRAC) NC II, the candidate must demonstrate competence in all the units listed in Section 1. Successful candidates shall be awarded a National Certificate NC II signed by the TESDA Director General. 4.1.2 The qualification of RAC Servicing (DomRAC) NC II may be attained through demonstration of competence through a single comprehensive project-type assessment covering all required units of competency of this qualification. 4.1.3 Assessment shall cover all competencies, with basic and common integrated or assessed concurrently with the core units of competency. 4.1.4 Any of the following are qualified to apply for assessment and certification: 4.1.4.1 Graduates of formal, non-formal and informal including enterprise- based training programs 4.1.4.2 Experienced Workers in RAC servicing for at least 2 years (wage employed or self-employed) 4.1.5 Recognition of Prior Learning (RPL). Candidates who have gained competencies through previous work or life experiences, education, and informal training related to all the core competencies may apply for recognition in the qualification through Portfolio Assessment in accordance with the provision of TESDA Circular No. 59, Series of 2020. 4.1.6 The existing National Certificate (NC) of individuals in RAC Servicing (DomRAC) NC II shall be in effect until the said NC have expired. Individuals are advised to take the assessment for this amended/updated 4.1.7 The guidelines on assessment and certification are discussed in detail in the \"Operating Procedures on Assessment and Certification\" and \"Guidelines on the Implementation of the Philippine TVET Competency Assessment and Certification System (PTCACS)\". TR–RAC Servicing (DomRAC) NC II (HVCDRA221) Promulgated: June 8, 2021 101"
    },
    {
      "number": "4.2",
      "text": "COMPETENCY ASSESSMENT REQUISITE 4.2.1 Self-Assessment Guide. The self-assessment guide (SAG) is accomplished by the candidate prior to actual competency assessment. SAG is a pre-assessment tool to help the candidate and the assessor determine what evidence is available, where gaps exist, including readiness for assessment. This document can: a. Identify the candidate’s skills and knowledge b. Highlight gaps in candidate’s skills and knowledge c. Provide critical guidance to the assessor and candidate on the evidence that need to be presented d. Assist the candidate to identify key areas in which practice is needed or additional information or skills that should be gained prior to assessment. 4.2.2 Accredited Assessment Center. Only Assessment Center accredited by TESDA is authorized to manage the assessment activities of candidates for national certification. 4.2.3 Accredited Competency Assessor. Only competency assessor accredited by TESDA is authorized to assess the competencies of candidates for national certification. TR–RAC Servicing (DomRAC) NC II (HVCDRA221) Promulgated: June 8, 2021 102"
    }
  ],
  "source_text": "SECTION 4. ASSESSMENT AND CERTIFICATION ARRANGEMENT\n\nCompetency Assessment is the process of collecting evidence and making\njudgments whether competency has been achieved. The purpose of assessment is to\nconfirm that an individual can perform to the standards expected at the workplace as\nexpressed in relevant competency standards.\n\nThe assessment process is based on evidence or information gathered to prove\nachievement of competencies. The process may be applied to an employable unit(s) of\ncompetency in partial fulfillment of the requirements of the national qualification.\n\n4.1\nNATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1.1 To attain the National Qualification of RAC Servicing (DomRAC) NC II, the\ncandidate must demonstrate competence in all the units listed in Section 1.\nSuccessful candidates shall be awarded a National Certificate NC II\nsigned by the TESDA Director General.\n\n4.1.2 The qualification of RAC Servicing (DomRAC) NC II may be attained\nthrough demonstration of competence through a single comprehensive\nproject-type assessment covering all required units of competency of this\nqualification.\n\n4.1.3 Assessment shall cover all competencies, with basic and common\nintegrated or assessed concurrently with the core units of competency.\n\n4.1.4 Any of the following are qualified to apply for assessment and certification:\n\n4.1.4.1 Graduates of formal, non-formal and informal including enterprise-\nbased training programs\n\n4.1.4.2 Experienced Workers in RAC servicing for at least 2 years (wage\nemployed or self-employed)\n\n4.1.5 Recognition of Prior Learning (RPL). Candidates who have gained\ncompetencies through previous work or life experiences, education, and\ninformal training related to all the core competencies may apply for\nrecognition in the qualification through Portfolio Assessment in accordance\nwith the provision of TESDA Circular No. 59, Series of 2020.\n\n4.1.6 The existing National Certificate (NC) of individuals in RAC Servicing\n(DomRAC) NC II shall be in effect until the said NC have expired.\nIndividuals are advised to take the assessment for this amended/updated\nTR on or before the expiration of such certificates.\n\n4.1.7 The guidelines on assessment and certification are discussed in detail in the\n\"Operating Procedures on Assessment and Certification\" and \"Guidelines\non the Implementation of the Philippine TVET Competency Assessment and\nCertification System (PTCACS)\".\n\n--- PDF PAGE 105 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR–RAC Servicing (DomRAC) NC II (HVCDRA221) Promulgated: June 8, 2021 101\n\n4.2\nCOMPETENCY ASSESSMENT REQUISITE\n\n4.2.1 Self-Assessment\nGuide.\nThe\nself-assessment\nguide\n(SAG)\nis\naccomplished by the candidate prior to actual competency assessment.\nSAG is a pre-assessment tool to help the candidate and the assessor\ndetermine what evidence is available, where gaps exist, including\nreadiness for assessment.\n\nThis document can:\n\na. Identify the candidate’s skills and knowledge\nb. Highlight gaps in candidate’s skills and knowledge\nc. Provide critical guidance to the assessor and candidate on the\nevidence that need to be presented\nd. Assist the candidate to identify key areas in which practice is\nneeded or additional information or skills that should be gained prior to\nassessment.\n\n4.2.2 Accredited Assessment Center. Only Assessment Center accredited by\nTESDA is authorized to manage the assessment activities of candidates\nfor national certification.\n\n4.2.3 Accredited Competency Assessor. Only competency assessor accredited\nby TESDA is authorized to assess the competencies of candidates for\nnational certification.\n\n--- PDF PAGE 106 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR–RAC Servicing (DomRAC) NC II (HVCDRA221) Promulgated: June 8, 2021 102\n"
