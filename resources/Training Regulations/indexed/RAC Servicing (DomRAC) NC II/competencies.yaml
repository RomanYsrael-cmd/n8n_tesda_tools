        "source_text": "HVC713202\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes in\npreparing materials, tools and equipment, lay-outing\ndimensions and performing basic benchwork based on the\nrequired performance standards.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized fonts are elaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1. Prepare\nmaterials,\ntools and\nequipment\n\n1.1. Work plan is interpreted to\ndetermine job requirements\n1.2. Materials, tools and\nequipment are identified and\nprepared according to job\nrequirements\n1.3. Materials are checked\naccording to the required\nspecifications\n1.4. Tools and equipment\nconditions are checked\nfollowing the standard\noperating procedures (SOPs)\n1.1. Communication\nskills\n1.2. Materials, tools\nand equipment;\nuses and\nspecifications\n1.3. Material\nestimation\n1.4. Mensuration\n1.1. Interpretation\nskills\n1.2. Handling of tools\nand materials\n2. Lay-out and\nmark\ndimensions/\nfeatures on\nworkplace\n2.1. Metallic and non-metallic\nmaterials are selected\naccording to the requirements\nspecified in the blueprint\n2.2. Dimensions/features are laid-\nout/marked according to job\nspecifications/blueprint and\nwithin the required tolerance\n2.3. Dimensions are checked\nagainst the actual work plan\n2.1. Metallic and non-\nmetallic materials\n2.2. Measuring tools,\nfunctions and use\n2.3. Trade\nmathematics\n2.4. Mensuration\n2.5. Calculation\n2.6. Conversion\n2.7. Plan\nspecifications\n2.8. Quality assurance\n2.1. Measuring and\nlay-outing\n2.2. Blueprint reading\n2.3. Communication\nskills\n3. Perform\nrequired\nbasic metal\nworks\n3.1. Work instructions are\nfollowed to ensure work\nsafety\n3.2. Basic metal works are\nperformed applying knowledge\non safety procedures and\naccording to job requirements\n3.3. Workpieces are clamped in\nworkholding device to avoid\ndamage and accidents\n3.4. Work pieces are cut, chipped\nor filed according to required\nmeasurements, tolerance\nspecified in the blueprint and\nfree from burrs and sharp\nedges\n3.5. Drilling is performed according\nto recommended sequence\nand specifications\n3.6. Proper usage of materials,\ntools and equipment is\n3.1. Tools and\nequipment: use\nand specifications\n3.2. Grinding, cutting,\ndrilling, filing\ntechniques\n3.3. Basic welding\nprinciples and\napplication\n3.4. Applied\noccupational\nhealth and safety\n(OH&S)\n3.1. Using tools and\nequipment\n3.2. Basic metal works\nskills\no Grinding\no Cutting\no Drilling\no Filing\no Threading\no Reaming\no Welding\n3.3. Practice safety\nskills\n\n--- PDF PAGE 45 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR–RAC Servicing (DomRAC) NC II (HVCDRA221) Promulgated: June 8, 2021 41\nELEMENT\nPERFORMANCE CRITERIA\nItalicized fonts are elaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\nobserved\n3.7. Appropriate PPE and safety\nprocedures are applied\n3.8. Worksite is cleaned and\ncleared of all debris and left in\nsafe state in accordance with\nOHS regulations\n\n--- PDF PAGE 46 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR–RAC Servicing (DomRAC) NC II (HVCDRA221) Promulgated: June 8, 2021 42\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Work plan\n1.1 Job requirements\n1.2 Schedule of work\n\n2. Materials\n\n2.1 Steel brackets\n2.2 Grinding disc\n2.3 Drill bit\n2.4 Flat/angle bars\n2.5 Fastening screws\n2.6 Masonry\n\n3. Tools and equipment\n\n3.1 Portable grinder\n3.2 Hacksaw\n3.3 File\n3.4 Markers\n3.5 Screw drivers\n3.6 Ballpein hammer\n3.7 L-square/steel square\n3.8 Steel rule\n3.9 Measuring tools\n3.10 PPE\n3.11 Portable electric drill\n3.12 Bench wire\n3.13 Tri-square\n3.14 Flaring tool\n3.15 Swa