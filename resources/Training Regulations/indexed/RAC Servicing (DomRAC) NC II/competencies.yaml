        "source_text": "HVC724201\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes in\npreparing materials, tools and equipment, testing electrical\ncomponents and basic repairing in electricity based on the\nrequired performance standards.\n\nELEMENT\nPERFORMANCE CRITERIA\nBold & Italicized fonts are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1. Prepare\nelectrical\ntools, test\ninstruments\nand materials\n\n1.1. Work plan is interpreted to\ndetermine job requirements\n1.2. Electrical tools, instruments\nand materials are identified\nand prepared according to job\nrequirements\n1.3. Electrical tools and\ninstruments are checked for\nconditions and calibrated as\nrequired\n1.1. Uses of tools\nand testing\ninstruments\n1.2. Calibration of\ntesting\ninstruments\n1.3. Safe handling\nand proper care\nof tools and\ntesting\ninstruments\n1.1. Interpretation\nskills\n1.2. Handling of tools\nand materials\n1.3. Calibration skills\n1.4. Communication\nskills (oral and\nwritten)\n2. Test power\nsupply and\nelectrical\ncomponents\n2.1. Instruments are tested in\naccordance with PEC\n2.2. Power supply and electrical\ncomponents are checked in\naccordance with\nmanufacturer’s\nspecifications/PEC\n2.3. Defects of power supply and\nelectrical components are\nidentified and recorded\n2.4. Safe working habits is\nobserved\n2.1. Functions and\nuses of testing\ninstruments\n2.2. Basic electricity\n2.3. Electrical safety\nand hazards\n2.4. Testing\nprocedures\n2.1. Usage of testing\ninstruments\n2.2. Basic\ntroubleshooting\nskills\n2.3. Practice safety\nskills\n3. Perform basic\nelectrical\nrepair\n3.1. Work instructions are\nfollowed to ensure safety work\n3.2. Loose connections are\ntightened in accordance with\nPEC\n3.3. Defective electrical\ncomponents are replaced and\ntested in accordance with PEC\n3.4. Work place is cleaned and in\nsafe state in line with OHSA\nregulations\n3.1. Types of\nelectrical parts\nand fixtures\n3.2. Testing\nprocedures\n3.3. Electrical safety\nand hazards\n3.4. Applied\noccupational\nhealth & safety\n(OH & S)\n3.5. Electrical joints\nand splices\n3.1. Basic electrical\nservicing and\ntroubleshooting\nskills\n3.2. Wire splicing\nskills\n3.3. Practice safety\nskills\n\n--- PDF PAGE 49 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR–RAC Servicing (DomRAC) NC II (HVCDRA221) Promulgated: June 8, 2021 45\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Work plan\nMay include:\n1.1. Job requirements\n1.2. Schedule of work\n\n2. Materials\n\nMay include:\n2.1. Solid, stranded wire\n2.2. Service plug/outlet\n2.3. HVAC/R electrical components\n2.4. Soldering lead\n2.5. Terminal clips\n2.6. Moulding\n2.7. Fuses\n2.8. PVC/Mold flux\n2.9. Electrical tape\n\n3. Tools and equipment\n\nMay include:\n3.1. Clamp ammeter\n3.2. Multi tester\n3.3. Insulation tester\n3.4. PPE\n3.5. Soldering gun/iron\n3.6. Wire stripper\n3.7. Measuring tool\n3.8. Markers\n3.9. Crimping tools\n3.10. Screw drivers\n3.11. Electrician pliers\n3.12. Electric drill\n3.13. Long nose\n\n4. Work instructions\nMay include:\n4.1. Work plan\n4.2. Schematic diagrams\n4.3. Installation instruction\n\n--- PDF PAGE 50 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR–RAC Servicing (DomRAC) NC II (HVCDRA221) Promulgated: June 8, 2021 46\nEVIDENCE GUIDE\n\n1. Critical aspects\n of competency\nAssessment requires that the candidate:\n1.1 Interpreted work plan to determine job requirements\n1.2 Selected and used appropriate processes, tools and\nequipment to carry out task\n1.3 Identified electrical tools and instruments are tested in\naccordance with PEC\n1.4 Replaced defective tools and instruments\n1.5 Checked power supply and electrical components in\naccordance with PEC\n1.6 Cleaned work place and left in safe state in line with OHSA\nregulations\n1.7 Completed electrical wiring in HVAC/R units based in\nmanufacturer’s specifications and PEC\n1.8 Communicated effectively to ensure safety works\n2. Resource\nImplications\nThe following resources should be provided:\n2.1 Work place\n2.2 Work plan\n2.3 Materials, tools and equipment relevant to the proposed\nactivity/task\n3. Methods of\nAssessment\nCompetency should be assessed through:\n3.1 Direct observation\n3.2 Written test/questioning relevant to required knowledge\n4. Context of\nAssessment\n4.1 Competency assessment may occur in workplace or any\nappropriate simulated environment\n4.2 Assessment shall be observed while task are being\nundertaken whether individually or in group\n4.3 Competency assessment must be undertaken in accordance\nwith the endorsed TESDA assessment guidelines\n\n--- PDF PAGE 51 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR–RAC Servicing (DomRAC) NC II (HVCDRA221) Promulgated: June 8, 2021 47\nUNIT OF COMPETENCY : MAINTAIN TOOLS, INSTRUMENTS AND EQUIPMENT\n\nUNIT CODE\n\n:"
