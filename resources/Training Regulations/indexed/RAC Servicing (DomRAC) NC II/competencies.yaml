          "source_text": "REQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n1. Describe \nteam role and \nscope \n1.1. The role and objective of \nthe team is identified from \navailable sources of \ninformation \n1.2. Team parameters, reporting \nrelationships and \nresponsibilities are identified \nfrom team discussions and \nappropriate external \nsources  \n \n1.1 Group structure \n1.2 Group \ndevelopment \n1.3 Sources of \ninformation \n1.1 Communicating with \nothers, appropriately \nconsistent with the \nculture of the \nworkplace \n1.2 Developing ways in \nimproving work \nstructure and \nperforming \nrespective roles in \nthe group or \norganization \n2. Identify one’s \nrole and \nresponsibility \nwithin team \n2.1. Individual role and \nresponsibilities within the \nteam environment are \nidentified \n2.2. Roles and objectives of the \nteam is identified from \navailable source of \ninformation \n2.3. Team parameters, reporting \nrelationships and \nresponsibilities are identified \nbased on team discussions \nand appropriate external \nsources \n2.1. Team roles and \nobjectives  \n2.2. Team structure \nand parameters \n2.3. Team \ndevelopment \n2.4. Sources of \ninformation \n2.1. Communicating \nwith others, \nappropriately \nconsistent with the \nculture of the \nworkplace \n2.2. Developing ways in \nimproving work \nstructure and \nperforming \nrespective roles in \nthe group or \norganization \n3. Work as a \nteam member \n3.1. Effective and appropriate \nforms of communications \nare used and interactions \nundertaken with team \nmembers based on \ncompany practices \n3.2. Effective and appropriate \ncontributions is made to \ncomplement team activities \nand objectives based on \nworkplace context \n3.3. Protocols in reporting are \nobserved based on \nstandard company practices \n3.4. Contribute to the \ndevelopment of team work \nplans based on an \nunderstanding of team’s \nrole and objectives  \n3.1. Communication \nprocess \n3.2. Workplace \ncommunication \nprotocol \n3.3. Team planning \nand decision \nmaking \n3.4. Team thinking \n3.5. Team roles \n3.6.  Process of team \ndevelopment \n3.7. Workplace \ncontext \n3.1. Communicating \nwith others, \nappropriately \nconsistent with the \nculture of the \nworkplace \n3.2. Interacting \neffectively with \nothers \n3.3. Deciding as an \nindividual and as a \ngroup using group \nthink strategies and \ntechniques \n3.4. Contributing to \nResolution of \nissues and \nconcerns\n\n--- PDF PAGE 11 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ \nTR–RAC Servicing (DomRAC) NC II       (HVCDRA221)             Promulgated: June 8, 2021                   7                  \nRANGE OF VARIABLES \nVARIABLE \nRANGE \n1. Role and objective of \nteam  \nMay include but not limited to: \n1.1. \nWork activities in a team environment with \nenterprise or specific sector \n1.2. \nLimited discretion, initiative and judgement \nmaybe demonstrated on the job, either \nindividually or in a team environment \n2. Sources of \ninformation \nMay include but not limited to: \n2.1. \nStandard operating and/or other workplace \nprocedures \n2.2. \nJob procedures \n2.3. \nMachine/equipment manufacturer’s \nspecifications and instructions \n2.4. \nOrganizational or external personnel \n2.5. \nClient/supplier instructions \n2.6. \nQuality standards \n2.7. \nOHS and environmental standards \n3. Workplace context \nMay include but not limited to: \n3.1. \nWork procedures and practices \n3.2. \nConditions of work environments \n3.3. \nLegislation and industrial agreements \n3.4. \nStandard work practice including the storage, \nsafe handling and disposal of chemicals \n3.5. \nSafety, environmental, housekeeping and \nquality guidelines\n\n--- PDF PAGE 12 ---\n-------------------------------------------------------------------------------------------------------------