        "source_text": "HVC723337\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes required\nto safely and properly install and test domestic refrigeration\nand air-conditioning units. It includes conducting survey for\ninstallation, installing DomRAC unit and conducting\nperformance testing.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized fonts are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1. Conduct\nsurvey\n1.1. Site conditions and\ninstallation requirements\nare assessed according to\nmanufacturer’s specification,\nexisting layout and prevailing\ncodes and ordinances*\n1.2. Tools, equipment and\nmaterials needed for\ninstallation are determined\naccording to site conditions\nand site installation\nrequirements *\n1.3. Cost and estimate of\nmaterials are determined\naccording to site conditions\nand site installation\nrequirements\n1.4. Survey result is reported in\naccordance with enterprise\npolicies and procedures\n\n1.1. Electrical plans,\nsymbols and\nabbreviations\n1.2. Site conditions and\ninstallation\nrequirements\n1.3. Codes and\nordinances\n1.4. Tools, equipment\nand materials\nneeded for\ninstallation\n1.5. Basic electrical\ninstallation\n1.6. Heat load\ncalculations and\nestimate\n1.7. RA 11058\nprovisions\n1.1. Interpreting plans and\ndetails\n1.2. Preparing materials\n1.3. Inspection skills\n1.4. Identifying tools,\nequipment and\nmaterials\n1.5. Basic Mathematical\nskills\n1.6. Communicating\neffectively\n2. Check\nDomRAC\nelectrical\ncircuit *\n2.1. Electrical cabling and wiring\ndevices of correct load\ncarrying capacity are\nchecked in accordance with\nequipment electrical\nrequirements *\n2.2. Electrical circuit is tested in\naccordance with applicable\nPhilippine Electrical Code\n(PEC) provisions*\n2.1. Protective\npersonal\nequipment/safety\ngears\n2.2. Handling of tools,\nequipment and\naccessories\n2.3. Safety signs and\nsymbols\n2.4. Good\nhousekeeping\n2.5. Basic electricity\n2.6. 