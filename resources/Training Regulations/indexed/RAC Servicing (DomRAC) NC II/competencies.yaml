        "evidence_guide": {
          "source_text": "1. Critical aspects\nof competency\nAssessment requires evidence that the candidate:\n\n1.1\nPlanned and prepared for troubleshooting and repair\n1.2\nDiagnosed and repaired DomRAC faults/problems\n1.3\nRecover/Recycle refrigerants\n1.4\nTested Unit\n1.5\nAccomplished Service Report\n\n2. Resource\nImplications\n\nThe following resources must be provided:\n2.1. Access to work place location and mockup unit\n2.2. Tools and equipment appropriate to troubleshooting and\nrepair\n2.3. Materials relevant to the proposed activity\n2.4. Drawings and specifications relevant to the task\n3. Methods of\nAssessment\nCompetency must be assessed through:\n3.1. Demonstration/Direct observation with oral questioning\n3.2. Portfolio with interview\n3.3. Third party report\n\n4. Context for\nAssessment\n4.1. Competency may be assessed in actual workplace or at\nthe designated TESDA Accredited Assessment Center.\n\n--- PDF PAGE 75 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR–RAC Servicing (DomRAC) NC II (HVCDRA221) Promulgated: June 8, 2021 71"
        },
        "source_text": "HVC723339\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes to identify\nand analyze faults and troubles found in domestic refrigeration\nand air-conditioning (DomRAC) systems. It also covers\nidentifying and repairing faults/troubles, performing refrigerant\nrecovery/ recycling on DomRAC unit as well as performing\ntest-run on repaired DomRAC units.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized fonts are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1. Plan and\nprepare for\ntroubleshooting\nand repair\n1.1. Appropriate wiring\ndiagrams, charts and\nmanuals are interpreted in\nline with the job\nrequirements\n1.2. Appropriate materials,\ntools and equipment are\nselected based on job\nrequirements\n1.3. Nameplates are\ninterpreted as per\nmanufacturer’s\nspecifications\n1.1 Schematic and wiring\ndiagrams\n1.2 Tools, materials,\ninstruments and\nequipment for\ntroubleshooting and\nrepair\n1.3 Nameplates\nspecifications\n1.4 Electronic control\nsystems including\ninverters\n1.5 Troubleshooting and\nrepair procedures\n1.6 Manufacturer’s service\nmanuals\n1.1 Interpreting\nschematic and\nwiring diagram\n1.2 Preparing tools,\nmaterials,\ninstruments and\nequipment for\ntroubleshooting\nand repair\n1.3 Interpreting\nnameplates\n2. Identify and\nrepair faults/\ntroubles\n2.1. Appropriate PPE are\nselected and used in line\nwith job requirements\n2.2. Components are tested\nfollowing manufacturer’s\nmanual, RAC Code of\nPractice and/or enterprise\ntroubleshooting policy\n2.3. Faults/problems with\ncomponents are\ndiagnosed in line with\nmanufacturer’s manual,\nRAC Code of Practice\nand/or enterprise\ntroubleshooting policy\n2.4. Remedial action is taken\nto overcome\nfaults/problems in line\nmanufacturer’s manual,\nRAC Code of Practice\nand/or enterprise\ntroubleshooting policy\n2.5. Work is completed safely\nin line with workplace\nsafety guidelines\n2.1. Protective personal\nequipment/safety\ngears\n2.2. Proper handling of\ntools, instruments,\nequipment and\naccessories\n2.3. Electrical and\nmechanical\ncomponents\n2.4. Electronic control\nsystems including\ninverters\n2.5. Different faults and\nproblems in DomRAC\nsystem\n2.6. Errors codes as per\nmanufacturer’s\nspecifications\n2.7. Enterprise\ntroubleshooting policy\n2.8. workplace safety\nguidelines\n2.9. RAC Code of\nPractice\n2.1. Interpreting\nschematic\ndiagram\n2.2. Preparing\nmaterials\n2.3. Proper handling\nof electrical\ntools/instruments\n/ equipment\n2.4. Testing electrical\nsystem\n2.5. Testing\nmechanical\nsystem\n2.6. Tube processing\n2.7. Proper handling\nof refrigerant and\nrefrigeration oil\n2.8. Performing\nrecovery/recyclin\ng refrigerants\n2.9. Performing\nsystem\nreprocess\n2.10. Brazing and\n\n--- PDF PAGE 72 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR–RAC Servicing (DomRAC) NC II (HVCDRA221) Promulgated: June 8, 2021 68\nELEMENT\nPERFORMANCE CRITERIA\nItalicized fonts are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n2.6. Report on testing\nprocedure, including faults\nand minor repair, is\ncompleted in line with\nmanufacturer’s manual,\nRAC Code of Practice\nand/or enterprise\ntroubleshooting policy\n\n2.10. Testing of electrical\nsystem\n2.11. Testing of mechanical\nsystem\n2.12. Handling of\nrefrigerant and\nrefrigeration oil\n2.13. Recovery/recycling of\nrefrigerants\n2.14. System reprocess\n2.15. Brazing and soldering\nprocess\n2.16. RA 11058 provisions\nsoldering skills\n\n3. Perform\nrefrigerant\nrecovery/\nrecycling on\nDomRAC unit\n3.1. Safe working practices are\nobserved throughout the\ntask as per enterprise\nprocedure\n3.2. Suitable tools and\nequipment are selected\nand used based on job\nrequirement\n3.3. Optimum\nrecovery/recycling of\nrefrigerant is performed in\nline with RAC Code of\nPractice\n3.4. Flammable refrigerants\nare handled properly\naccording to international\nstandards\n\n3.1. Protective personal\nequipment/safety\ngears\n3.2. Handling of tools,\ninstruments,\nequipment and\naccessories\n3.3. workplace safety\nguidelines\n3.4. electrical parameters\n3.5. RAC Code of Practice\n3.6. Handling of refrigerant\nand refrigeration oil\n3.7. Proper handling of\nflammable refrigerants\nper international\nstandards\n3.8. Recovery/recycling of\nrefrigerants\n3.9. System reprocess\n3.10. Kigali agreement\nprovisions\n3.11. RA 11058 provisions\n3.1. Preparing\nmaterials\n3.2. Proper handling\nof electrical\ntools/\ninstruments/\nequipment\n3.3. Checking\nelectrical\nparameters\n3.4. Handling\nrefrigerant and\nrefrigeration oil\n3.5. Handling of\nFlammable\nrefrigerants\n3.6. Performing\nrecovery/recyclin\ng refrigerants\n3.7. Performing\nsystem\nreprocess\n\n4. Test-run\nrepaired unit\n\n4.1. Unit is tested in line with\ntroubleshooting/repair\nprocedures\n4.2. Operating parameters are\nmeasured based on\nmanufacturer’s\nspecifications\n4.3. Report on repair and\ntesting of unit is prepared\nin line with enterprise\nprocedures\n\n4.1. Measurement of\noperational\nparameters\n4.2. Testing procedures\n4.3. Preparation of repair\nand testing report\n4.4. RA 11058 provisions\n4.5. 5S/housekeeping\n4.1. Measuring\noperating\nparameters\n4.2. Using testing\ninstrument\n4.3. Data gathering\nskills\n4.4. Preparing repair\nand testing\nreport\n4.5. Communication\nskills\n\n--- PDF PAGE 73 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR–RAC Servicing (DomRAC) NC II (HVCDRA221) Promulgated: June 8, 2021 69\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Components\nMay include but not limited to:\n1.1. Electrical controls\n- Thermostat\n- Defrost timer\n- Relay\n- Thermo disc/Defrost thermostat\n- Switches\n- Overload protector\n1.2. Compressor motor\n1.3. Fan motors\n1.4. Refrigerator defrost heater\n1.5. Capacitor\n1.6. Electronic controls\n\n2. PPE\nIncludes but not limited to:\n2.1. Mask\n2.2. Safety shoes\n2.3. Safety goggles\n2.4. Apron/coverall\n2.5. Gloves\n\n3. Remedial action\n3.1. Repair\n3.2. Replace\n\n4. Test\nTesting may include:\n4.1. Insulation\n4.2. Resistance\n4.3. Mechanical\n4.4. Continuity\n4.5. Timing Sequence\n4.6. Leak\n\n--- PDF PAGE 74 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR–RAC Servicing (DomRAC) NC II (HVCDRA221) Promulgated: June 8, 2021 70\n\n EVIDENCE GUIDE\n\n1. Critical aspects\nof competency\nAssessment requires evidence that the candidate:\n\n1.1\nPlanned and prepared for troubleshooting and repair\n1.2\nDiagnosed and repaired DomRAC faults/problems\n1.3\nRecover/Recycle refrigerants\n1.4\nTested Unit\n1.5\nAccomplished Service Report\n\n2. Resource\nImplications\n\nThe following resources must be provided:\n2.1. Access to work place location and mockup unit\n2.2. Tools and equipment appropriate to troubleshooting and\nrepair\n2.3. Materials relevant to the proposed activity\n2.4. Drawings and specifications relevant to the task\n3. Methods of\nAssessment\nCompetency must be assessed through:\n3.1. Demonstration/Direct observation with oral questioning\n3.2. Portfolio with interview\n3.3. Third party report\n\n4. Context for\nAssessment\n4.1. Competency may be assessed in actual workplace or at\nthe designated TESDA Accredited Assessment Center.\n\n--- PDF PAGE 75 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR–RAC Servicing (DomRAC) NC II (HVCDRA221) Promulgated: June 8, 2021 71"
