        "source_text": "--- PDF PAGE 30 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ \nTR–RAC Servicing (DomRAC) NC II       (HVCDRA221)             Promulgated: June 8, 2021                   26                  \n \nUNIT OF COMPETENCY : PRACTICE ENTREPRENEURIAL SKILLS IN THE \nWORKPLACE  \n \n \n \nUNIT CODE \n: 400311218 \n \n \n \nUNIT DESCRIPTOR \n: This unit covers the outcomes required to apply \nentrepreneurial workplace best practices and implement \ncost-effective operations \n \nELEMENTS \nPERFORMANCE CRITERIA \nItalicized terms are elaborated \nin the Range of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Apply \nentrepreneurial   \nworkplace best    \npractices  \n1.1. Good practices relating \nto workplace operations \nare observed and selected \nfollowing workplace policy. \n1.2. Quality procedures and \npractices are complied \nwith according to \nworkplace requirements.  \n1.3. Cost-conscious habits in \nresource utilization are \napplied based on industry \nstandards.  \n1.1. Workplace best practices, \npolicies and criteria \n1.2. Resource utilization \n1.3. Ways in fostering \nentrepreneurial attitudes: \n1.3.1. Patience \n1.3.2. Honesty \n1.3.3. Quality-consciousness \n1.3.4. Safety-consciousness \n1.3.5. Resourcefulness \n1.1. Communication \nskills \n1.2. Complying with \nquality \nprocedures \n2. Communicate \nentrepreneurial \nworkplace best \npractices  \n2.1. Observed good practices \nrelating to workplace \noperations are \ncommunicated to \nappropriate person. \n2.2. Observed quality \nprocedures and practices \nare communicated to \nappropriate person \n2.3. Cost-conscious habits in \nresource utilization are \ncommunicated based on \nindustry standards.  \n2.1. Workplace best practices, \npolicies and criteria \n2.2. Resource utilization \n2.3. Ways in fostering \nentrepreneurial attitudes: \n2.3.1. Patience \n2.3.2. Honesty \n2.3.3. Quality-consciousness \n2.3.4. Safety-consciousness \n2.3.5. Resourcefulness \n2.1. Communication \nskills \n2.2. Complying with \nquality \nprocedures \n2.3. Following \nworkplace \ncommunication \nprotocol  \n3. Implement \ncost-effective \noperations \n3.1. Preservation and \noptimization of workplace \nresources is implemented \nin accordance with \nenterprise policy \n3.2. Judicious use of \nworkplace tools, \nequipment and materials \nare observed according to \nmanual and work \nrequirements. \n3.3. Constructive contributions \nto office operations are \nmade according to \nenterprise requirements. \n3.4. Ability to work within one’s \nallotted time and finances \nis sustained. \n3.1. Optimization of workplace \nresources \n3.2. 5S procedures and \nconcepts \n3.3. Criteria for cost-\neffectiveness \n3.4. Workplace productivity \n3.5. Impact of entrepreneurial \nmindset to workplace \nproductivity \n3.6. Ways in fostering \nentrepreneurial attitudes: \n3.6.1. Quality-\nconsciousness \n3.6.2. Safety-\nconsciousness \n3.1. Implementing \npreservation and \noptimizing \nworkplace \nresources \n3.2. Observing \njudicious use of \nworkplace tools, \nequipment and \nmaterials \n3.3. Making \nconstructive \ncontributions to \noffice operations \n3.4. Sustaining ability \nto work within \nallotted time and \nfinances\n\n--- PDF PAGE 31 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ \nTR–RAC Servicing (DomRAC) NC II       (HVCDRA221)             Promulgated: June 8, 2021                   27                  \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Good practices \nMay include: \n1.1.  Economy in use of resources \n1.2.  Documentation of quality practices  \n \n2. Resource utilization \nMay include: \n2.1.  Consumption/ use of consumables \n2.2.  Use/Maintenance of assigned equipment and \nfurniture \n2.3.  Optimum use of allotted /available time \n \n \nEVIDENCE GUIDE \n \n1. Critical aspects \nof competency  \nAssessment requires evidence that the candidate: \n1.1. Demonstrated ability to identify and sustain cost-effective \nactivities in the workplace  \n1.2. Demonstrated ability to practice entrepreneurial \nknowledge, skills and attitudes in the workplace. \n \n2. Resource \nImplications \nThe following resources should be provided: \n2.1. Simulated or actual workplace \n2.2. Tools, materials and supplies needed to demonstrate the \nrequired tasks  \n2.3. References and manuals \n2.3.1 Enterprise procedures manuals \n2.3.2 Company quality policy \n \n3. Methods of \nAssessment \nCompetency in this unit should be assessed through: \n3.1. Interview \n3.2. Third-party report \n \n4. Context of \nAssessment \n4.1. Competency may be assessed in workplace or in a \nsimulated workplace setting \n4.2. Assessment shall be observed while tasks are being \nundertaken whether individually or in-group\n",
