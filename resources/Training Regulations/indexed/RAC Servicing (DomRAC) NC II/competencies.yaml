nt\nCompetency in this unit may be assessed through:\n3.1 Demonstration or simulation with oral questioning\n3.2 Case problems involving work improvement and\nsustainability issues\n3.3 Third-party report\n4 Context for\nAssessment\n4.1 Competency may be assessed individually in the actual\nworkplace or simulation environment in TESDA accredited\ninstitutions\n\n--- PDF PAGE 19 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR–RAC Servicing (DomRAC) NC II (HVCDRA221) Promulgated: June 8, 2021 15\nUNIT OF COMPETENCY :\nCONTRIBUTE TO WORKPLACE INNOVATION\n\nUNIT CODE\n:\n400311214\n\nUNIT DESCRIPTOR :\nThis unit covers the knowledge, skills and attitudes\nrequired to make a pro-active and positive contribution\nto workplace innovation.\n\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Identify\nopportunities\nto do things\nbetter.\n1.1. Opportunities for\nimprovement are\nidentified proactively in\nown area of work.\n1.2. Information is gathered\nand reviewed which may\nbe relevant to ideas and\nwhich might assist in\ngaining support for idea.\n1.1. Roles of\nindividuals in\nsuggesting and\nmaking\nimprovements.\n1.2. Positive impacts\nand challenges in\ninnovation.\n1.3. Types of changes\nand responsibility.\n1.4. Seven habits of\nhighly effective\npeople.\n1.1. Identifying opportunities to\nimprove and to do things\nbetter. Involvement.\n1.2. Identifying the positive\nimpacts and the challenges\nof change and innovation.\n1.3. Identifying examples of the\ntypes of changes that are\nwithin and outside own\nscope of responsibility\n2. Discuss and\ndevelop\nideas with\nothers\n2.1. People who could\nprovide input to ideas for\nimprovements are\nidentified.\n2.2. Ways of approaching\npeople to begin sharing\nideas are selected.\n2.3. Meeting is set with relevant\npeople.\n2.4. Ideas for follow up are\nreview and selected based\non feedback.\n2.5. Critical inquiry method is\nused to discuss and\ndevelop ideas with others.\n2.1. Roles of\nindividuals in\nsuggesting and\nmaking\nimprovements.\n2.2. Positive impacts\nand challenges in\ninnovation.\n2.3. Types of changes\nand responsibility.\n2.4. Seven habits of\nhighly effective\npeople.\n2.1. Identifying opportunities to\nimprove and to do things\nbetter. Involvement.\n2.2. Identifying the positive\nimpacts and the challenges\nof change and innovation.\n2.3. Providing examples of the\ntypes of changes that are\nwithin and outside own\nscope of responsibility\n2.4. Communicating ideas for\nchange through small group\ndiscussions and meetings.\n3. Integrate\nideas for\nchange in the\nworkplace.\n3.1. Critical inquiry method is\nused to integrate different\nideas for change of key\npeople.\n3.2. Summarizing, analyzing\nand generalizing skills are\nused to extract salient\npoints in the pool of ideas.\n3.3. Reporting skills are\nlikewise used to\ncommunicate results.\n3.4. Current issues and\nconcerns on the systems,\nprocesses and procedures,\nas well as the need for\nsimple innovative practices\nare identified.\n3.1. Roles of\nindividuals in\nsuggesting and\nmaking\nimprovements.\n3.2. Positive impacts\nand challenges in\ninnovation.\n3.3. Types of changes\nand responsibility.\n3.4. Seven habits of\nhighly effective\npeople.\n3.5. Basic research\nskills.\n3.1. Identifying opportunities to\nimprove and to do things\nbetter. Involvement.\n3.2. Identifying the positive\nimpacts and the challenges\nof change and innovation.\n3.3. Providing examples of the\ntypes of changes that are\nwithin and outside own\nscope of responsibility.\n3.4. Communicating ideas for\nchange through small group\ndiscussions and meetings.\n3.5. Demonstrating skills in\nanalysis and interpretation\nof data.\nRANGE OF VARIABLES\n\n--- PDF PAGE 20 ---\n-----------------------------------------