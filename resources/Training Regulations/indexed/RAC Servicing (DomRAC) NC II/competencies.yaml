        "source_text": "--- PDF PAGE 6 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ \nTR–RAC Servicing (DomRAC) NC II       (HVCDRA221)             Promulgated: June 8, 2021                   2                  \n \n \nSECTION 2 COMPETENCY STANDARDS \n \nThis section gives the details of the contents of the basic, common and core units \nof competency required in RAC Servicing (DomRAC) NC II. \n \n \n \nBASIC COMPETENCIES \n \nUNIT OF COMPETENCY :    PARTICIPATE IN WORKPLACE COMMUNICATION \nUNIT CODE \n     :    400311210 \nUNIT DESCRIPTOR \n     : \nThis unit covers the knowledge, skills and attitudes   required \nto gather, interpret and convey information in response to \nworkplace requirements. \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated \nin the Range of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n1. Obtain and \nconvey \nworkplace \ninformation \n1.1 Specific and relevant \ninformation is accessed \nfrom appropriate \nsources  \n1.2 Effective questioning, \nactive listening and \nspeaking skills are used \nto gather and convey \ninformation \n1.3 Appropriate medium is \nused to transfer \ninformation and ideas \n1.4 Appropriate non- verbal \ncommunication is used \n1.5 Appropriate lines of \ncommunication with \nsupervisors and \ncolleagues are identified \nand followed \n1.6 Defined workplace \nprocedures for the \nlocation and storage of \ninformation are used \n1.7 Personal interaction is \ncarried out clearly and \nconcisely \n1.1 Effective \ncommunication \n1.2 Different modes \nof communication  \n1.3 Medium of \ncommunication in \nthe workplace \n1.4 Organizational \npolicies \n1.5 Communication \nprocedures and \nsystems  \n1.6 Lines of \ncommunication \n1.7 Technology \nrelevant to the \nenterprise and the \nindividual’s work \nresponsibilities \n1.8 Workplace \netiquette \n1.1 Following simple \nspoken language \n1.2 Performing routine \nworkplace duties \nfollowing simple \nwritten notices \n1.3 Participating in \nworkplace meetings \nand discussions \n1.4 Preparing work- \nrelated documents \n1.5 Estimating, \ncalculating and \nrecording routine \nworkplace measures \n1.6 Relating/ Interacting \nwith people of \nvarious levels in the \nworkplace \n1.7 Gathering and \nproviding basic \ninformation in \nresponse to \nworkplace \nrequirements \n1.8 Basic business \nwriting skills \n1.9 Interpersonal skills in \nthe workplace \n1.10 Active-listening skills \n2. Perform \nduties \nfollowing \nworkplace \ninstructions \n2.1 Written notices and \ninstructions are read \nand   interpreted in \naccordance with \norganizational \nguidelines \n2.2 Routine written \ninstruction are followed \n2.1 Effective verbal \nand non-verbal \ncommunication \n2.2 Different modes \nof communication  \n2.3 Medium of \ncommunication in \nthe workplace \n2.1 Following simple \nspoken instructions  \n2.2 Performing routine \nworkplace duties \nfollowing simple \nwritten notices \n2.3 Participating in \nworkplace meetings\n\n--- PDF PAGE 7 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ \nTR–RAC Servicing (DomRAC) NC II       (HVCDRA221)             Promulgated: June 8, 2021                   3                  \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated \nin the Range of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \nbased on HVAC \nestablished procedures \n2.3 Feedback is given to \nworkplace supervisor-\nbased instructions/ \ninformation received \n2.4 Workplace \ninteractions are \nconducted in a \ncourteous manner \n2.5 Where necessary, \nclarifications about \nroutine workplace \nprocedures and matters \nconcerning conditions of \nemployment are sought \nand asked from \nappropriate sources  \n2.6 Meeting’s outcomes are \ninterpreted and \nimplemented \n2.4 Organizational/ \nWorkplace \npolicies \n2.5 Communication \nprocedures and \nsystems \n2.6 Lines of \ncommunication \n2.7 Technology \nrelevant to the \nenterprise and \nthe individual’s \nwork \nresponsibilities \n2.8 Effective \nquestioning \ntechniques \n(clarifying and \nprobing) \n2.9 Workplace \netiquette \nand discussions \n2.4 Completing work- \nrelated documents \n2.5 Estimating, \ncalculating and \nrecording routine \nworkplace measures \n2.6 Relating/ Responding \nto people of various \nlevels in the \nworkplace \n2.7 Gathering and \nproviding information \nin response to \nworkplace \nrequirements \n2.8 Basic questioning/ \nquerying \n2.9 Skills in reading for \ninformation  \n2.10 Skills in locating \n3. Complete \nrelevant \nwork-related \ndocuments \n3.1 Range of forms relating \nto conditions of \nemployment are \ncompleted accurately \nand legibly \n3.2 Workplace data is \nrecorded on standard \nworkplace forms and \ndocuments \n3.3 Errors in recording \ninformation on forms/ \ndocuments are identified \nand properly acted upon \n3.4 Reporting requirements \nto supervisor are \ncompleted according to \norganizational \nguidelines \n3.1 Effective verbal \nand non-verbal \ncommunication \n3.2 Different modes \nof communication  \n3.3 Workplace forms \nand documents \n3.4 Organizational/ \nWorkplace \npolicies \n3.5 Communication \nprocedures and \nsystems \n3.6 Technology \nrelevant to the \nenterprise and \nthe individual’s \nwork \nresponsibilities  \n3.1 Completing work- \nrelated documents \n3.2 Applying operations \nof addition, \nsubtraction, division \nand multiplication \n3.3 Gathering and \nproviding information \nin response to \nworkplace \nrequirements \n3.4 Effective record \nkeeping skills\n\n--- PDF PAGE 8 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ \nTR–RAC Servicing (DomRAC) NC II       (HVCDRA221)             Promulgated: June 8, 2021                   4                  \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Appropriate sources \nMay include: \n1.1. \nTeam members \n1.2. \nSuppliers \n1.3. \nTrade personnel \n1.4. \nLocal government \n1.5. \nIndustry bodies \n2. Medium \nMay include: \n2.1. \nMemorandum \n2.2. \nCircular \n2.3. \nNotice \n2.4. \nInformation discussion \n2.5. \nFollow-up or verbal instructions \n2.6. \nFace to face communication \n3. Storage \nMay include: \n3.1. \nManual filing system \n3.2. \nComputer-based filing system \n4. Workplace interactions \nMay include: \n4.1. \nFace to face \n4.2. \nTelephone \n4.3. \nElectronic and two-way radio \n4.4. \nWritten including electronic, memos, instruction \nand forms,  \n4.5. \nNon-verbal including gestures, signals, signs and \ndiagrams \n5. Forms \nMay include: \n5.1. \nHR/Personnel forms, telephone message forms, \nsafety reports\n\n--- PDF PAGE 9 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ \nTR–RAC Servicing (DomRAC) NC II       (HVCDRA221)             Promulgated: June 8, 2021                   5                  \n \n \nEVIDENCE GUIDE \n \n1. Critical aspects \nof Competency \nAssessment requires evidence that the candidate: \n1.1. Prepared written communication following standard format of \nthe organization \n1.2. Accessed information using workplace communication \nequipment/systems \n1.3. Made use of relevant terms as an aid to transfer information \neffectively \n1.4. Conveyed information effectively adopting the formal or \ninformal communication \n2. Resource \nImplications \nThe following resources should be provided: \n2.1. Fax machine \n2.2. Telephone \n2.3. Notebook  \n2.4. Writing materials \n2.5. Computer with internet connection \n3. Methods of \nAssessment \nCompetency in this unit may be assessed through: \n3.1. Demonstration with oral questioning  \n3.2. Interview  \n3.3. Written test \n3.4. Third-party report \n4. Context for \nAssessment \n4.1. Competency may be assessed in actual workplace or at the \ndesignated TESDA Accredited Assessment Center\n",
