        "source_title": "EXERCISE EFFICIENT AND EFFECTIVE SUSTAINABLE PRACTICES IN THE WORKPLACE",
        "source_text": "--- PDF PAGE 28 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ \nTR–RAC Servicing (DomRAC) NC II       (HVCDRA221)             Promulgated: June 8, 2021                   24                  \n \nUNIT OF COMPETENCY \n \n: \nEXERCISE EFFICIENT AND EFFECTIVE SUSTAINABLE \nPRACTICES IN THE WORKPLACE \n \nUNIT CODE \n: \n400311217 \n \nUNIT DESCRIPTOR \n: \nThis unit covers knowledge, skills and attitude to identify \nthe efficiency and effectiveness of resource utilization, \ndetermine causes of inefficiency and/or ineffectiveness of \nresource utilization and convey inefficient and ineffective \nenvironmental practices \n \nELEMENTS \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Identify the \nefficiency and \neffectiveness \nof resource \nutilization \n \n1.1. Required resource utilization \nin the workplace is measured \nusing appropriate techniques \n1.2. Data are recorded in \naccordance with workplace \nprotocol \n1.3. Recorded data are compared \nto determine the efficiency \nand effectiveness of resource \nutilization according to \nestablished environmental \nwork procedures \n1.1. Importance of \nEnvironmental \nLiteracy \n1.2. Environmental \nWork Procedures \n1.3. Waste \nMinimization \n1.4. Efficient Energy \nConsumptions \n1.1 Recording Skills \n1.2 Writing Skills \n1.3 Innovation Skills \n \n2. Determine \ncauses of \ninefficiency \nand/or \nineffectiveness \nof resource \nutilization \n2.1.  Potential causes of \ninefficiency and/or \nineffectiveness are listed \n2.2. Causes of inefficiency and/or \nineffectiveness are identified \nthrough deductive reasoning \n2.3.  Identified causes of \ninefficiency and/or \nineffectiveness are validated \nthru established \nenvironmental procedures \n2.1. Causes of \nenvironmental \ninefficiencies \nand \nineffectiveness \n \n2.1. Deductive \nReasoning Skills \n2.2. Critical thinking \n2.3. Problem Solving \n2.4. Observation \nSkills \n \n3. Convey \ninefficient and \nineffective \nenvironmental \npractices  \n \n3.1. Efficiency and effectiveness of \nresource utilization are \nreported to appropriate \npersonnel \n3.2. Concerns related resource \nutilization are discussed with \nappropriate personnel \n3.3. Feedback on information/ \nconcerns raised are clarified \nwith appropriate personnel \n3.1. Appropriate \nPersonnel to \naddress the \nenvironmental \nhazards \n3.2. Environmental \ncorrective \nactions \n3.1. Written and Oral \nCommunication \nSkills \n3.2. Critical thinking \n3.3. Problem Solving \n3.4. Observation \nSkills \n3.5. Practice \nEnvironmental \nAwareness\n\n--- PDF PAGE 29 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ \nTR–RAC Servicing (DomRAC) NC II       (HVCDRA221)             Promulgated: June 8, 2021                   25                  \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Environmental \nWork Procedures \nMay include: \n1.1. Utilization of Energy, Water, Fuel Procedures \n1.2. Waster Segregation Procedures \n1.3. Waste Disposal and Reuse Procedures \n1.4. Waste Collection Procedures \n1.5. Usage of Hazardous Materials Procedures \n1.6. Chemical Application Procedures \n1.7. Labeling Procedures \n2. Appropriate \nPersonnel \nMay include: \n2.1. Manager \n2.2. Safety Officer \n2.3. EHS Offices \n2.4. Supervisors \n2.5. Team Leaders \n2.6. Administrators \n2.7. Stakeholders \n2.8. Government Official \n2.9. Key Personnel \n2.10. Specialists \n2.11. Himself \n \n \nEVIDENCE GUIDE \n \n1. Critical aspects of \nCompetency  \nAssessment requires evidence that the candidate: \n1.1. Measured required resource utilization in the workplace \nusing appropriate techniques \n1.2. Recorded data in accordance with workplace protocol \n1.3. Identified causes of inefficiency and/or ineffectiveness \nthrough deductive reasoning \n1.4. Validate the identified causes of inefficiency and/or \nineffectiveness thru established environmental \nprocedures \n1.5. Report efficiency and effectives of resource utilization to \nappropriate personnel \n1.6. Clarify feedback on information/concerns raised with \nappropriate personnel \n2. Resource \nImplications \nThe following resources should be provided: \n2.1 \nWorkplace  \n2.2 \nTools, materials and equipment relevant to the tasks  \n2.3 \nPPE \n2.4 \nManuals and references \n \n3. Methods of \nAssessment \nCompetency in this unit may be assessed through: \n3.1 \nDemonstration  \n3.2 \nOral questioning \n3.3 \nWritten examination \n \n4. Context for \nAssessment \n4.1 Competency assessment may occur in workplace or any \nappropriately simulated environment \n4.2 Assessment shall be observed while task are being \nundertaken whether individually or in-group\n",
