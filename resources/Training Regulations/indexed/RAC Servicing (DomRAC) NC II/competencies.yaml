 Case Formulation\n3.2 Life Narrative Inquiry\n3.3 Standardized test\nThe unit will be assessed in a holistic manner as is practical\nand may be integrated with the assessment of other relevant\nunits of competency. Assessment will occur over a range of\nsituations, which will include disruptions to normal, smooth\noperation. Simulation may be required to allow for timely\nassessment of parts of this unit of competency. Simulation\nshould be based on the actual workplace and will include walk\nthrough of the relevant competency components.\n\n4. Context for\nAssessment\n4.1 Competency may be assessed individually in the actual\nworkplace or simulation environment in TESDA accredited\ninstitutions.\n\n--- PDF PAGE 16 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR–RAC Servicing (DomRAC) NC II (HVCDRA221) Promulgated: June 8, 2021 12\n\nUNIT OF COMPETENCY : DEVELOP CAREER AND LIFE DECISIONS\n\nUNIT CODE : 400311213\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills, and attitudes in\nmanaging one’s emotions, developing reflective practice,\nand boosting self-confidence and developing self-regulation.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1. Manage\none’s\nemotion\n1.1. Self-management\nstrategies are identified\n1.2. Skills to work independently\nand to show initiative, to be\nconscientious, and\npersevering in the face of\nsetbacks and frustrations are\ndeveloped\n1.3. Techniques for effectively\nhandling negative emotions\nand unpleasant situation in\nthe workplace are examined\n\n1.1. Self-management\nstrategies that assist\nin regulating behavior\nand achieving\npersonal and learning\ngoals (e.g. Nine self-\nmanagement\nstrategies according\nto Robert Kelley)\n1.2. Enablers and barriers\nin achieving personal\nand career goals\n1.3. Techniques in\nhandling negative\nemotions and\nunpleasant situation\nin the workplace such\nas frustration, anger,\nworry, anxiety, etc.\n1.1. Managing properly\none’s emotions and\nrecognizing\nsituations that\ncannot be changed\nand accept them\nand remain\nprofessional\n1.2. Developing self-\ndiscipline, working\nindependently and\nshowing initiative to\nachieve personal\nand career goals\n1.3. Showing\nconfidence, and\nresilience in the\nface of setbacks\nand frustrations and\nother negative\nemotions and\nunpleasant\nsituations in the\nworkplace\n\n2. Develop\nreflective\npractice\n2.1. Personal strengths and\nachievements, based on\nself-assessment strategies\nand teacher feedback are\ncontemplated\n2.2. Progress when seeking and\nresponding to feedback from\nteachers to assist them in\nconsolidating strengths,\naddressing weaknesses and\nfulfilling their potential are\nmonitored\n2.3. Outcomes of personal and\nacademic challenges by\nreflecting on previous\nproblem solving and\ndecision-making strategies\nand feedback from peers\nand teachers are predicted\n\n2.1. Basic SWOT analysis\n2.2. Strategies to improve\none’s attitude in the\nworkplace\n2.3. Gibbs’ Reflective\nCycle/Model\n(Description,\nFeelings, Evaluation,\nAnalysis, Conclusion,\nand Action plan)\n2.1. Using the basic\nSWOT analysis as\nself-assessment\nstrategy\n2.2. Developing\nreflective practice\nthrough realization\nof limitations, likes/\ndislikes; through\nshowing of self-\nconfidence\n2.3. Demonstrating self-\nacceptance and\nbeing able to\naccept challenges\n\n--- PDF PAGE 17 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR–RAC Servicing (DomRAC) NC II (HVCDRA221) Promulgated: June 8, 2021 13\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n3. Boost self-\nc