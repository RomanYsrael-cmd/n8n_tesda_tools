ter is cleaned using\nthe correct tools and\ncleaning procedures*\n1.1 Protective personal\nequipment/ safety\ngears\n1.2 Cleaning agents\n1.3 Air filter cleaning\nprocedures\n1.4 RAC Code of\nPractice\n1.5 RA 11058 provisions\n1.6 5s / housekeeping\n\n1.1 Proper handling of\ntools and equipment\n1.2 Removing air filter\nproperly\n1.3 Cleaning skills\n1.4 Following cleaning\nprocedures\n1.5 Interpersonal skills\n\n2. Service\nevaporator/\ncondenser\n2.1 Tools are selected in\ndismantling the\nevaporator/ condensing\nunit as per standard\noperating procedures\n(SOPs)\n2.2 High pressure washer\nand compressed air are\nused in cleaning\nevaporator/ condensing\ncoil based on\nestablished procedures*\n2.3 Evaporator/condenser\ncoil fins are straightened\nin accordance with\nservice procedure\n2.4 Cleaning agent or non-\ncorrosive chemical is\nused in cleaning and\nmaintaining evaporator/\ncondensing coil, fins and\nother body accessories\nas per standard\noperating procedures\n(SOPs)*\n2.1 Protective personal\nequipment/ safety\ngears\n2.2 Cleaning agents\n2.3 evaporator/\ncondenser cleaning\nprocedures\n2.4 RAC Code of\nPractice\n2.5 RA 11058 provisions\n2.6 5s / housekeeping\n2.1 Preparing materials\n2.2 Proper handling of\ntools and equipment\n2.3 Cleaning and\nmaintaining\nDomRAC units\n2.4 Skills in using high\npressure washer and\ncompressed air\n2.5 Interpersonal skills\n\n3. Maintain fan\nmotor\nassembly\n3.1 Fan motor is maintained\nin line with\nmanufacturer’s\ninstructions\n3.1 Principle and\noperation of motors\n3.2 Types of fan motors\n3.3 Fan motor terminals\n3.1 Interpreting diagrams\n3.2 Preparing materials\n3.3 Proper handling of\ntools and equipment\n\n--- PDF PAGE 68 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR–RAC Servicing (DomRAC) NC II (HVCDRA221) Promulgated: June 8, 2021 64\nELEMENT\nPERFORMANCE CRITERIA