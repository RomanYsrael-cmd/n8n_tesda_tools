        "source_text": "--- PDF PAGE 55 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ \nTR–RAC Servicing (DomRAC) NC II       (HVCDRA221)             Promulgated: June 8, 2021                   51                  \nUNIT OF COMPETENCY  :  PERFORM HOUSEKEEPING AND SAFETY   \n                                              PRACTICES FOR RAC SERVICING \n \n UNIT CODE  \n        :   HVC7315201 \n \nUNIT DESCRIPTOR        :  This unit covers the knowledge, skills and attitudes needed to \nwork safely in the workplace including sorting, cleaning and \ndispensing materials, tools, instruments and equipment, \nidentifying and minimizing hazards, responding and recording \naccidents and following basic security. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized fonts are elaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Sort \nmaterials, \ntools, \ninstruments \nand \nequipment \n \n \n1.1. Materials, tools, instruments \nand equipment are classified \naccording to its kinds \n1.2. Appropriate areas for materials, \ntools, instruments and \nequipment are designated \n \n1.1. Classification of tools, \ninstruments equipment \nand materials \n1.2. Selection of \nappropriate areas for \nstoring materials, \ntools, instruments and \nequipment \n1.3. Sorting procedures \nand considerations \n1.4. 5S principles \n1.1. Applying 5S \n(sorting) \n1.2. Identifying tools \nand materials \n \n2. Clean \nworkplace \narea, \nmaterials, \ntools, \ninstruments \nand \nequipment \n \n2.1. Cleaning materials are \nidentified and used as per \nprocedure \n2.2. Workplace areas, materials, \ntools, instruments and \nequipment are cleaned as per \ncompany practices \n2.3. Workplace are in safe state in \naccordance with safety \nregulations/company practices \n2.1. Cleaning materials, \ntypes and \napplications. \n2.2. Procedures in \ncleaning workplace \narea, tools, \ninstruments and \nequipment. \n2.3. Consideration of a \nsafe workplace area, \ntools, instruments and \nequipment \n2.1. Applying 5S \n(cleaning) \n3. Systematize \ndispensing \nand      \nretrieval of \nmaterials, \ntools, \ninstruments \nand \nequipment  \n3.1. Systems for requesting, \nborrowing and returning of \nmaterials, tools, instruments \nand equipment is in-place and \nimplemented \n3.2. Forms used are completely \nfilled-up and filed \n3.3. Borrowed tools, instruments \nand equipment are returned to \ndesignated area \n3.4. Consumable materials are \nrequested in exact quantity \n3.1. Procedures in \ndispensing and \nretrieval of materials; \ntools, instruments \nand equipment \n3.2. Things to be \nconsidered in \nreturning the \nborrowed tools, \ninstruments and \nequipment. \n3.1. Applying 5S \n(systematize) \n3.2. documentation \nskills \n4. Identify and \nminimize/ \neliminate \nhazards \n \n4.1. Hazards in the work area are \nrecognized and reported to \ndesignated personnel and \nappropriate control actions are \ntaken \n4.2. Workplace policies and \nprocedures for controlling risks \nare established and followed \n4.1. Composition of safety \ncommittee \n4.2. Policies and \nprocedures in \ncontrolling risk \n4.3. Safety signs and first \naid \n4.4. Safety signs and \n4.1. Hazard \nidentification \nskills \n4.2. Practice safety \nskills \n4.3. Identifying \nsafety signs \nand symbols\n\n--- PDF PAGE 56 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ \nTR–RAC Servicing (DomRAC) NC II       (HVCDRA221)             Promulgated: June 8, 2021                   52                  \nELEMENT \nPERFORMANCE CRITERIA \nItalicized fonts are elaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \naccurately \n4.3. Workplace procedures for \ndealing with emergencies are \nfollowed whenever necessary \nwithin the scope of \nresponsibilities and \ncompetencies \n4.4. Safety signs and hazard \nwarnings are displayed and \nobserved at all times in line with \nworkplace health and safety \nregulations  \n4.5. Equipment and safety \ndevices/PPE are used/handled \naccording to company or \nmanufacturer's procedures and \nguidelines \n4.6. Work areas are kept clean, free \nfrom obstacles and emergency \nexits are known and kept clear \nat all times \n4.7. Safe manual handling/fighting \ntechniques and safe equipment \noperation techniques are \nemployed at all times \nhazards warning \npreparation \n4.5. Equipment and safety \ndevices \n4.6. Safe handling \ntechnique in using \nequipment and safe \ndevices. \n4.7. Identification of \nSafety Signs and \nSymbols \n \n \n5. Respond \nand record \naccidents \n5.1. Workplace accidents are \nidentified \n5.2. Workplace emergency first-\naid procedures/ treatment \nare followed/carried out \ncorrectly in accordance with \nstandards/regulations and \nenterprise procedures/policies \n5.3. Medical assistance/rescue is \ncoordinated with concerned \npersonnel in line with \norganizational policies \n5.4. Accident/incident records \nmaintained in accordance with \nstandard operating procedures \n5.1. Types of accidents \n5.2. Procedures in \napplying first aid/ \ntreatment \n5.3. First aid supplies \n5.4. Steps in responding \nto and recording \naccidents \n5.1. First aid \napplication \nskills \n5.2. Coordination \nskills \n5.3. Documentation \nskills \n6. Follow basic \nsecurity \n6.1. Security policies/ procedures \nare followed according to \nenterprise practices and \nappropriate legislation \n6.2. Security related events are \nrecorded/reported on the \nrelevant forms \n6.3. Staff are advised of enterprise \nsecurity procedures and \ncorrect methods of \nimplementation \n6.1. Basic security \nprocedures \n6.2. Security signs and \nsymbols \n6.3. Loss control \nmanagement \n6.3.1. Hazards \n6.3.2. Safety signs \n \n6.1. Coordination \nskills \n6.2. Reporting skills \n6.3. Documentation \nskills \n6.4. Practice safety \nskills\n\n--- PDF PAGE 57 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ \nTR–RAC Servicing (DomRAC) NC II       (HVCDRA221)             Promulgated: June 8, 2021                   53                  \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Hazards \nHazards that may be present in the workplace include but \nnot limited to: \n1.1. Flammable materials \n1.2. Running machinery/equipment \n1.3. Toxic substances  \n1.4. Debris \n1.5. Open flames \n1.6. Loose objects/fixtures \n1.7. Chemicals \n1.8. Electrical faults \n1.9. Hot metals \n2. Emergencies \nEmergencies may include but  not limited to: \n2.1. Fire \n2.2. Explosion \n2.3. Spills \n2.4. Falls \n2.5. Electrocution \n2.6. Injuries caused by falling objects \n2.7. Injuries caused by sharp objects \n2.8. Injuries caused by wrong usage of tools \n3. Safety signs, symbols \nand hazard warnings \nSafety signs and symbols include but not limited to: \n3.1. Industry recognized hazard warning signs and safety \nsymbols \n- \nDanger-High Voltage \n- \nUnauthorized Persons Keep Out \n- \nNo Smoking \n- \nPoisonous Gases \n- \nCaution - Men working on live wires \n- \nFlammable Materials \n3.2. Internationally recognized hazard warning signs and \nsafety symbols \n4. Personal Protective \nEquipment (PPE) \nPPE may include but not limited to: \n4.1. Goggles \n4.2. Gas mask \n4.3. Working gloves \n4.4. Safety shoes \n4.5. Face shield \n4.6. Insulating mat \n4.7. Over-all apron \n4.8. Hard hat \n4.9. Safety belt \n4.10. Protective eyewear \n5. First-aid Treatment \nFirst-aid treatment includes but is not limited to: \n5.1. CPR \n5.2. Mouth to mouth resuscitation \n5.3. Application of tourniquet \n5.4. Application of pressure to bleeding wounds or cuts \n5.5. First-aid treatment for burned victims \n6. Standards and \n6.1. Philippine Electrical Code\n\n--- PDF PAGE 58 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ \nTR–RAC Servicing (DomRAC) NC II       (HVCDRA221)             Promulgated: June 8, 2021                   54                  \nVARIABLE \nRANGE \nRegulations \n6.2. Philippine OH&S Standards \n6.3. Building Code \n6.4. Philippine Environmental Standards \n6.5. Welding Procedures Specifications \n6.6. Clean Air Act \n \n7. Security policies \n7.1. Wearing of ID \n7.2. Logging-in and out \n7.3. Wearing of uniform \n7.4. Observance of safety/security signs and symbols\n\n--- PDF PAGE 59 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ \nTR–RAC Servicing (DomRAC) NC II       (HVCDRA221)             Promulgated: June 8, 2021                   55                  \nEVIDENCE GUIDE \n \n1. Critical aspects of  \nCompetency \nAssessment requires that the candidate: \n1.1. \nClassified materials, tools and equipment according to kind \n1.2. \nCleaned workplace areas, materials, tools and equipment \nas per standard procedures \n1.3. \nImplemented systematize dispensing and retrieval of \nmaterials, tools and equipment \n1.4. \nIdentified and described safety working practices relating to \nall tasks undertaken in the workplace \n1.5. \nIdentified and selected appropriate equipment and safety \ndevices for particular workplace tasks and activities \n1.6. \nInterpreted hazard warnings and safety signs correctly and \ndescribed the application of these warnings and signs in the \nwork activities \n1.7. \nWorkplace emergency first-aid procedures/treatment are \ncarried out in accordance with OHSA standards/legislation \nand enterprise procedures \n1.8. \nResponded/maintained accidents/incidents records in \naccordance with SOPs \n1.9. \nFollowed security procedures/policies in accordance with \nenterprise practices and legislation \n1.10. Workplace kept in safe state in accordance with safety \nregulations \n2. Resource \nImplications \nThe following resources should be provided: \n2.1. \nWork place \n2.2. \nMaterials, tools and equipment relevant to the proposed \nactivity/task \n2.3. \nSafety signs \n2.4. \nSafety devices \n2.5. \nAccident reporting procedures \n2.6. \nFirst-aid materials and guidelines \n \n3. Methods of \nAssessment \nCompetency should be assessed through: \n3.1. \nDirect observation while task is being undertaken \n3.2. \nWritten test/questioning relevant to required knowledge \n \nAssessment of required knowledge and practical skills may be \ncombined \n \n4. Context for \nAssessment \n4.1. \nCompetency assessment may occur in workplace or any \nappropriate simulated environment \n4.2. \nAssessment shall be observed while task are being \nundertaken whether individually or in group in accordance \nwith the approved industry OHSA regulations \n4.3. \nCompetency assessment must be undertaken in \naccordance with the endorsed TESDA assessment \nguidelines\n",
