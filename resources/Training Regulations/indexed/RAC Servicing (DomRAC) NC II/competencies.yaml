        "source_text": "400311214\n\nUNIT DESCRIPTOR :\nThis unit covers the knowledge, skills and attitudes\nrequired to make a pro-active and positive contribution\nto workplace innovation.\n\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Identify\nopportunities\nto do things\nbetter.\n1.1. Opportunities for\nimprovement are\nidentified proactively in\nown area of work.\n1.2. Information is gathered\nand reviewed which may\nbe relevant to ideas and\nwhich might assist in\ngaining support for idea.\n1.1. Roles of\nindividuals in\nsuggesting and\nmaking\nimprovements.\n1.2. Positive impacts\nand challenges in\ninnovation.\n1.3. Types of changes\nand responsibility.\n1.4. Seven habits of\nhighly effective\npeople.\n1.1. Identifying opportunities to\nimprove and to do things\nbetter. Involvement.\n1.2. Identifying the positive\nimpacts and the challenges\nof change and innovation.\n1.3. Identifying examples of the\ntypes of changes that are\nwithin and outside own\nscope of responsibility\n2. Discuss and\ndevelop\nideas with\nothers\n2.1. People who could\nprovide input to ideas for\nimprovements are\nidentified.\n2.2. Ways of approaching\npeople to begin sharing\nideas are selected.\n2.3. Meeting is set with relevant\npeople.\n2.4. Ideas for follow up are\nreview and selected based\non feedback.\n2.5. Critical inquiry method is\nused to discuss and\ndevelop ideas with others.\n2.1. Roles of\nindividuals in\nsuggesting and\nmaking\nimprovements.\n2.2. Positive impacts\nand challenges in\ninnovation.\n2.3. Types of changes\nand responsibility.\n2.4. Seven habits of\nhighly effective\npeople.\n2.1. Identifying opportunities to\nimprove and to do things\nbetter. Involvement.\n2.2. Identifying the positive\nimpacts and the challenges\nof change and innovation.\n2.3. Providing examples of the\ntypes of changes that are\nwithin and outside own\nscope of responsibility\n2.4. Communicating ideas for\nchange through small group\ndiscussions and meetings.\n3. Integrate\nideas for\nchange in the\nworkplace.\n3.1. Critical inquiry method is\nused to integrate different\nideas for change of key\npeople.\n3.2. Summarizing, analyzing\nand generalizing skills are\nused to extract salient\npoints in the pool of ideas.\n3.3. Reporting skills are\nlikewise used to\ncommunicate results.\n3.4. Current issues and\nconcerns on the systems,\nprocesses and procedures,\nas well as the need for\nsimple innovative practices\nare identified.\n3.1. Roles of\nindividuals in\nsuggesting and\nmaking\nimprovements.\n3.2. Positive impacts\nand challenges in\ninnovation.\n3.3. Types of changes\nand responsibility.\n3.4. Seven habits of\nhighly effective\npeople.\n3.5. Basic research\nskills.\n3.1. Identifying opportunities to\nimprove and to do things\nbetter. Involvement.\n3.2. Identifying the positive\nimpacts and the challenges\nof change and innovation.\n3.3. Providing examples of the\ntypes of changes that are\nwithin and outside own\nscope of responsibility.\n3.4. Communicating ideas for\nchange through small group\ndiscussions and meetings.\n3.5. Demonstrating skills in\nanalysis and interpretation\nof data.\nRANGE OF VARIABLES\n\n--- PDF PAGE 20 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR–RAC Servicing (DomRAC) NC II (HVCDRA221) Promulgated: June 8, 2021 16\n\nVARIABLES\nRANGE\n1. Opportunities for\nimprovement\nMay include:\n1.1 Systems.\n1.2 Processes.\n1.3 Procedures.\n\n1.4 Protocols.\n1.5 Codes.\n1.6 Practices.\n2. Information\nMay include:\n2.1 Workplace communication problems.\n2.2 Performance evaluation results.\n2.3 Team dynamics issues and concerns.\n2.4 Challenges on return of investment\n2.5 New tools, processes and procedures.\n2.6 New people in the organization.\n3. People who could\nprovide input\nMay include:\n3.1 Leaders\n3.2 Managers\n3.3 Specialists\n3.4 Associates\n3.5 Researchers\n3.6 Supervisors\n3.7 Staff\n3.8 Consultants (external)\n3.9 People outside the\norganization in the same\nfield or similar\nexpertise/industry.\n3.10 Clients\n4. Critical inquiry\nmethod\nMay include:\n4.1\nPreparation.\n4.2\nDiscussion.\n4.3\nClarification of goals.\n4.4\nNegotiate towards a Win-Win outcome.\n4.5\nAgreement.\n4.6\nImplementation of a course of action.\n4.7\nEffective verbal communication. See pages: Verbal\nCommunication and Effective Speaking.\n4.8\nListening.\n4.9\nReducing misunderstandings is a key part of effective\nnegotiation.\n4.10 Rapport Building.\n4.11 Problem Solving.\n4.12 Decision Making.\n4.13 Assertiveness.\n4.14 Dealing with Difficult Situations.\n5. Reporting skills\nMay include:\n5.1\nData management.\n5.2\nCoding.\n5.3\nData analysis and interpretation.\n5.4\nCoherent writing.\n5.5\nSpeaking.\n\n--- PDF PAGE 21 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR–RAC Servicing (DomRAC) NC II (HVCDRA221) Promulgated: June 8, 2021 17\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nIdentified opportunities to do things better.\n1.2\nDiscussed and developed ideas with others on how to\ncontribute to workplace innovation.\n1.3\nIntegrated ideas for change in the workplace.\n1.4\nAnalyzed and reported rooms for innovation and\nlearning in the workplace.\n2. Resource\nImplications\nThe following resources should be provided:\n2.1\nPens, papers and writing implements.\n2.2\nCartolina.\n2.3\nManila papers.\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1\nPsychological and behavioral Interviews.\n3.2\nPerformance Evaluation.\n3.3\nLife Narrative Inquiry.\n3.4\nReview of portfolios of evidence and third-party\nworkplace reports of on-the-job performance.\n3.5\nSensitivity analysis.\n3.6\nOrganizational analysis.\n3.7\nStandardized assessment of character strengths and\nvirtues applied.\n4. Context for\nAssessment\n4.1 Competency may be assessed individually in the actual\nworkplace or simulation environment in TESDA\naccredited institutions.\n\n--- PDF PAGE 22 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR–RAC Servicing (DomRAC) NC II (HVCDRA221) Promulgated: June 8, 2021 18\nUNIT OF COMPETENCY : PRESENT RELEVANT INFORMATION\n\nUNIT CODE\n:"
