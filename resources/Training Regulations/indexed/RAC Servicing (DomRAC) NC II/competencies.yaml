        "evidence_guide": {
          "source_text": "1. Critical aspects of\nCompetency\nAssessment requires that the candidate:\n1.1.\nClassified materials, tools and equipment according to kind\n1.2.\nCleaned workplace areas, materials, tools and equipment\nas per standard procedures\n1.3.\nImplemented systematize dispensing and retrieval of\nmaterials, tools and equipment\n1.4.\nIdentified and described safety working practices relating to\nall tasks undertaken in the workplace\n1.5.\nIdentified and selected appropriate equipment and safety\ndevices for particular workplace tasks and activities\n1.6.\nInterpreted hazard warnings and safety signs correctly and\ndescribed the application of these warnings and signs in the\nwork activities\n1.7.\nWorkplace emergency first-aid procedures/treatment are\ncarried out in accordance with OHSA standards/legislation\nand enterprise procedures\n1.8.\nResponded/maintained accidents/incidents records in\naccordance with SOPs\n1.9.\nFollowed security procedures/policies in accordance with\nenterprise practices and legislation\n1.10. Workplace kept in safe state in accordance with safety\nregulations\n2. Resource\nImplications\nThe following resources should be provided:\n2.1.\nWork place\n2.2.\nMaterials, tools and equipment relevant to the proposed\nactivity/task\n2.3.\nSafety signs\n2.4.\nSafety devices\n2.5.\nAccident reporting procedures\n2.6.\nFirst-aid materials and guidelines\n\n3. Methods of\nAssessment\nCompetency should be assessed through:\n3.1.\nDirect observation while task is being undertaken\n3.2.\nWritten test/questioning relevant to required knowledge\n\nAssessment of required knowledge and practical skills may be\ncombined\n\n4. Context for\nAssessment\n4.1.\nCompetency assessment may occur in workplace or any\nappropriate simulated environment\n4.2.\nAssessment shall be observed while task are being\nundertaken whether individually or in group in accordance\nwith the approved industry OHSA regulations\n4.3.\nCompetency assessment must be undertaken in\naccordance with the endorsed TESDA assessment\nguidelines\n\n--- PDF PAGE 60 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR–RAC Servicing (DomRAC) NC II (HVCDRA221) Promulgated: June 8, 2021 56\n\nUNIT OF COMPETENCY : DOCUMENT WORK ACCOMPLISHED\nUNIT CODE\n\n: HVC311205\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes in\ndocumenting work accomplished.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized fonts are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1. Identify forms\nand collect\ndata\n1.1. Forms are selected based\non the reports to be\nprepared\n1.2. Data are collected based\non the reports to be\nprepared\n\n1.1. Selecting and\ninterpreting forms\n1.2. Interpreting work\naccomplished\n1.3. Data gathering\ntechniques\n1.1. Documentation\nskills\n1.2. Interpretation\nskills\n1.3. Data gathering\nskills\n2. Prepare\nreports\n2.1. Reports are completed\nusing standard form as per\ncompany procedures\n2.2. Reports are prepared\nproviding details of work\ncompleted, further action to\nbe taken and other details\nas per company\nprocedures\n2.3. Reports are completed and\nsubmitted within specified\ntime to the concerned\npersonnel/supervisor\n\n2.1. Details of work\ncompletion\n2.2. Kinds of reports\n2.3. Preparation of\nreports\n\n2.1. Documentation\nskills\n2.2. Report\npreparation\nskills\n\n--- PDF PAGE 61 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR–RAC Servicing (DomRAC) NC II (HVCDRA221) Promulgated: June 8, 2021 57\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Forms\n1.1 Warranty Paper Request\n1.2 Operating Log Sheet\n1.3 Requisition Forms\n1.4 Start-up data sheet\n\n2. Data\n\n2.1 Current drawn\n2.2 Operating data\n2.3 Unit specifications\n2.4 Records of work accomplished\n2.5 Further work required\n2.6 Spare parts used\n\n3. Reports\n\n3.1 Start-up commissioning Report\n3.2 Warranty Paper Request\n3.3 Turn-over Report\n3.4 Operating Log Sheet\n3.5 Service Report\n3.6 Requisition\n\nEVIDENCE GUIDE\n\n1. Critical aspects\nof Competency\nCompetency requires evidence that the candidate:\n1.1 Prepared reports used terminology and language\nappropriate to all users\n1.2 Prepared reports to include alternatives, views, approaches\nand other findings and recommendations for consideration\nby the supervisor\n1.3 Prepared reports are coherent and based on actual\nfindings/analysis/results\n1.4 Prepared reports are accomplished, completed as per\nstandard format and submitted within specified time to the\nconcerned supervisor\n2. Resource\nImplications\nThings necessary to conduct method of assessment:\n2.1 Work place location\n2.2 Materials relevant to the proposed activity\n3. Methods of\nAssessment\nCompetency in this unit must be assessed through:\n3.1 Direct observation\n3.2 Questions related to required knowledge\n4. Context for\nAssessment\n4.1 Competency may be assessed in the work place or in a\nsimulated work place setting\n\n--- PDF PAGE 62 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR–RAC Servicing (DomRAC) NC II (HVCDRA221) Promulgated: June 8, 2021 58\n\nCORE COMPETENCIES\n\nUNIT OF COMPETENCY: INSTALL DOMESTIC REFRIGERATION AND AIR-\nCONDITIONING (DomRAC) UNITS\n\nUNIT CODE :"
