          "source_text": "1. Critical aspects of  \nCompetency \nAssessment requires that the candidate: \n1.1. \nClassified materials, tools and equipment according to kind \n1.2. \nCleaned workplace areas, materials, tools and equipment \nas per standard procedures \n1.3. \nImplemented systematize dispensing and retrieval of \nmaterials, tools and equipment \n1.4. \nIdentified and described safety working practices relating to \nall tasks undertaken in the workplace \n1.5. \nIdentified and selected appropriate equipment and safety \ndevices for particular workplace tasks and activities \n1.6. \nInterpreted hazard warnings and safety signs correctly and \ndescribed the application of these warnings and signs in the \nwork activities \n1.7. \nWorkplace emergency first-aid procedures/treatment are \ncarried out in accordance with OHSA standards/legislation \nand enterprise procedures \n1.8. \nResponded/maintained accidents/incidents records in \naccordance with SOPs \n1.9. \nFollowed security procedures/policies in accordance with \nenterprise practices and legislation \n1.10. Workplace kept in safe state in accordance with safety \nregulations \n2. Resource \nImplications \nThe following resources should be provided: \n2.1. \nWork place \n2.2. \nMaterials, tools and equipment relevant to the proposed \nactivity/task \n2.3. \nSafety signs \n2.4. \nSafety devices \n2.5. \nAccident reporting procedures \n2.6. \nFirst-aid materials and guidelines \n \n3. Methods of \nAssessment \nCompetency should be assessed through: \n3.1. \nDirect observation while task is being undertaken \n3.2. \nWritten test/questioning relevant to required knowledge \n \nAssessment of required knowledge and practical skills may be \ncombined \n \n4. Context for \nAssessment \n4.1. \nCompetency assessment may occur in workplace or any \nappropriate simulated environment \n4.2. \nAssessment shall be observed while task are being \nundertaken whether individually or in group in accordance \nwith the approved industry OHSA regulations \n4.3. \nCompetency assessment must be undertaken in \naccordance with the endorsed TESDA assessment \nguidelines",
