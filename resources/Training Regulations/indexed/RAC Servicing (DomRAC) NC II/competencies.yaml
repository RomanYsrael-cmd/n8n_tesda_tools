ruments,\nequipment and accessories are\ninspected and replaced\naccording to manufacturer’s\nspecifications\n2.1. Safety Practices\no Use of PPE\no Handling of tools,\ninstruments and\nequipment\no Good housekeeping\n2.2. Materials, Tools and\nEquipment\no Types and uses of\nlubricants\no Types and uses of\ncleaning materials\n2.3. Preventive\nMaintenance\no Methods and\ntechniques\no Procedures\n\n2.1. Handling of\ntools,\ninstruments\nand\nequipment\n2.2. Performing\npreventive\nmaintenance\n\n--- PDF PAGE 52 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR–RAC Servicing (DomRAC) NC II (HVCDRA221) Promulgated: June 8, 2021 48\nELEMENT\nPERFORMANCE CRITERIA\nItalicized fonts are elaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n2.6. Tools are inspected, repaired\nand replaced every after use\n2.7. Work place are cleaned and in\nsafe state in line with OHSA\nregulations\n3. Store tools,\ninstruments\nand\nequipment\n\n3.1. Inventory of tools, instruments\nand equipment are conducted\nand recorded as per company\npractices\n3.2. Tools, instruments and\nequipment are stored safely in\nappropriate locations in\naccordance with manufacturer's\nspecifications or company\nprocedures\n\n3.1. Safety Practices\no Use of PPE\no Handling of tools,\ninstruments and\nequipment\no Storing procedures\nand techniques\no Storage conditions/\nlocations\n\n3.1. Storing tools,\ninstruments\nand\nequipment\n3.2. Handling of\ntools,\ninstruments\nand\nequipment\n\n--- PDF PAGE 53 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR–RAC Servicing (DomRAC) NC II (HVCDRA221) Promulgated: June 8, 2021 49\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Materials\nMay include:\n1.1. Lubricants\n