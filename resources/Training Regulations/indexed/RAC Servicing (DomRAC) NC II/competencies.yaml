        "evidence_guide": {
          "source_text": "1. Critical aspects \nof Competency \nAssessment requires evidence that the candidate: \n1.1. Prepared written communication following standard format of \nthe organization \n1.2. Accessed information using workplace communication \nequipment/systems \n1.3. Made use of relevant terms as an aid to transfer information \neffectively \n1.4. Conveyed information effectively adopting the formal or \ninformal communication \n2. Resource \nImplications \nThe following resources should be provided: \n2.1. Fax machine \n2.2. Telephone \n2.3. Notebook  \n2.4. Writing materials \n2.5. Computer with internet connection \n3. Methods of \nAssessment \nCompetency in this unit may be assessed through: \n3.1. Demonstration with oral questioning  \n3.2. Interview  \n3.3. Written test \n3.4. Third-party report \n4. Context for \nAssessment \n4.1. Competency may be assessed in actual workplace or at the \ndesignated TESDA Accredited Assessment Center",
