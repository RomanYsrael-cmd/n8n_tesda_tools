        "source_text": "HVC311202\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes in analyzing\nand interpreting symbols, data and work plan based on the\nrequired performance standards.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized fonts are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Analyze\nsigns,\nsymbols\nand data\n\n1.1 Technical plans are\nobtained according to job\nrequirements\n1.2 Signs, symbols and data\nare identified according to\njob specifications\n1.3 Signs symbols and data\nare determined according\nto classification or as\nappropriate in drawing\n\n1.1 Trade Mathematics\n1.1.1 Linear\nmeasurement\n1.1.2 Dimension\n1.1.3 Unit conversion\n1.2 Blueprint Reading and\nPlan Specification\n1.2.1 Electrical,\nmechanical plan,\nsymbols and\nabbreviations\n1.2.2 Drawing\nstandard\nsymbols\n1.3 Basic Technical\nDrawing\n1.4 Types Technical Plans\n1.5 Various Types of\nDrawings\n1.6 Notes and\nSpecifications\n1.1 Interpreting\ndrawing/\northographic\ndrawing\n1.2 Interpreting\ntechnical plans\n1.3 Matching\nspecification\ndetails with\nexisting\nresources\n1.4 Following\ninstructions\n1.5 Handling of\ndrawing\ninstruments\n2. Interpret\ntechnical\ndrawings and\nplans\n2.1 Necessary tools,\nmaterials and equipment\nare identified according to\nthe plan\n2.2 Supplies and materials are\nlisted according to\nspecifications\n2.3 Components, assemblies\nor objects are recognized\nas required\n2.4 Dimensions are identified\nas appropriate to the plan\n2.5 Specification details are\nmatched with\nexisting/available\nresources in line with job\nrequirements\n2.6 Work plan is drawn\nfollowing the specifications\n\n2.1 Trade Mathematics\n2.1.1 Linear\nmeasurement\n2.1.2 Dimension\n2.1.3 Unit conversion\n2.2 Blueprint Reading and\nPlan Specification\n2.2.1 Electrical,\nmechanical plan,\nsymbols and\nabbreviations\n2.2.2 Drawing standard\nsymbols\n2.3 Basic Technical\nDrawing\n2.4 Types Technical Plans\n2.5 Various Types of\nDrawings\n2.6 Notes and\nSpecifications\n2.1 Interpreting\ndrawing/\northographic\ndrawing\n2.2 Interpreting\ntechnical plans\n2.3 Matching\nspecification\ndetails with\nexisting\nresources\n2.4 Following\ninstructions\n2.5 Handling of\ndrawing\ninstruments\n3. Apply\nfreehand\nsketching\n3.1 Where applicable, correct\nfreehand sketching is\nproduced in accordance\nwith the job requirements\n\n3.1 Trade Mathematics\n3.1.1 Linear\nmeasurement\n3.1.2 Dimension\n3.1.3 Unit conversion\n3.2 Blueprint Reading and\n3.1 Interpreting\ndrawing/\northographic\ndrawing\n3.2 Interpreting\ntechnical plans\n\n--- PDF PAGE 35 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR–RAC Servicing (DomRAC) NC II (HVCDRA221) Promulgated: June 8, 2021 31\nELEMENT\nPERFORMANCE CRITERIA\nItalicized fonts are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\nPlan Specification\n3.2.1 Electrical,\nmechanical plan,\nsymbols and\nabbreviations\n3.2.2 Drawing\nstandard\nsymbols\n3.3 Basic Technical\nDrawing\n3.4 Types Technical Plans\n3.5 Various Types of\nDrawings\n3.6 Notes and\nSpecifications\n3.3 Matching\nspecification\ndetails with\nexisting\nresources\n3.4 Following\ninstructions\n3.5 Handling of\ndrawing\ninstruments\n\n--- PDF PAGE 36 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR–RAC Servicing (DomRAC) NC II (HVCDRA221) Promulgated: June 8, 2021 32\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Technical plans\nIncluding but not limited to:\n1.1. Electrical Plans\n1.2. Architectural Plans\n1.3. Welding Procedures Specifications (WPS)\n\n2. Classification\n\nIncluding but not limited to:\n2.1. Electrical\n2.2. Mechanical\n\n3. Drawing\nIncluding but not limited to:\n3.1. Drawing symbols\n3.2. Alphabet of lines\n3.3. Orthographic views\n-\nFront view\n-\nRight side view/left side view\n-\nTop view\n-\nPictorial\n3.4. Schematic diagram\n3.5. Electrical drawings\n3.6. Structural drawings\n3.7. Welding symbols\n4. Tools and materials\nIncluding but not limited to:\n4.1. Compass\n4.2. Divider\n4.3. Rulers\n4.4. Triangles\n4.5. Drawing tables\n4.6. Computer\n\n5. Work plan\n\nIncluding but not limited to:\n5.1. Job requirements\n5.2. Installation instructions\n5.3. Components instruction\n\n--- PDF PAGE 37 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR–RAC Servicing (DomRAC) NC II (HVCDRA221) Promulgated: June 8, 2021 33\nEVIDENCE GUIDE\n\n1. Critical aspects\nof Competency\nAssessment requires that the candidate:\n1.1 Identified and determined signs, symbols and data\naccording to work plan, job requirements and classifications\n1.2 Identified tools and equipment in accordance with job\nrequirements\n1.3 Listed supplies and materials according to blueprint\nspecifications\n1.4 Drawn work plan following specifications\n1.5 Demonstrated ability to determine job specifications based\non working/technical drawing\n2. Resource\nimplications\nThe following resources should be provided:\n2.1 Workplace\n2.2 Drawings and specification relevant to task\n2.3 Materials and instrument relevant to proposed activity\n3. Methods of\nassessment\nCompetency should be assessed through:\n3.1 Direct Observation\n3.2 Questions/Interview\n3.3 Written test related to required knowledge\n4. Context of\nassessment\n4.1 Competency assessment may occur in workplace or any\nappropriate simulated environment\n4.2 Assessment shall be observed while tasks are being\nundertaken whether individually or in group\n4.3 Competency assessment must be undertaken in accordance\nwith the endorsed TESDA assessment guidelines\n\n--- PDF PAGE 3