        "source_text": "HVC7315201\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes needed to\nwork safely in the workplace including sorting, cleaning and\ndispensing materials, tools, instruments and equipment,\nidentifying and minimizing hazards, responding and recording\naccidents and following basic security.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized fonts are elaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Sort\nmaterials,\ntools,\ninstruments\nand\nequipment\n\n1.1. Materials, tools, instruments\nand equipment are classified\naccording to its kinds\n1.2. Appropriate areas for materials,\ntools, instruments and\nequipment are designated\n\n1.1. Classification of tools,\ninstruments equipment\nand materials\n1.2. Selection of\nappropriate areas for\nstoring materials,\ntools, instruments and\nequipment\n1.3. Sorting procedures\nand considerations\n1.4. 5S principles\n1.1. Applying 5S\n(sorting)\n1.2. Identifying tools\nand materials\n\n2. Clean\nworkplace\narea,\nmaterials,\ntools,\ninstruments\nand\nequipment\n\n2.1. Cleaning materials are\nidentified and used as per\nprocedure\n2.2. Workplace areas, materials,\ntools, instruments and\nequipment are cleaned as per\ncompany practices\n2.3. Workplace are in safe state in\naccordance with safety\nregulations/company practices\n2.1. Cleaning materials,\ntypes and\napplications.\n2.2. Procedures in\ncleaning workplace\narea, tools,\ninstruments and\nequipment.\n2.3. Consideration of a\nsafe workplace area,\ntools, instruments and\nequipment\n2.1. Applying 5S\n(cleaning)\n3. Systematize\ndispensing\nand\nretrieval of\nmaterials,\ntools,\ninstruments\nand\nequipment\n3.1. Systems for requesting,\nborrowing and returning of\nmaterials, tools, instruments\nand equipment is in-place and\nimplemented\n3.2. Forms used are completely\nfilled-up and filed\n3.3. Borrowed tools, instruments\nand equipment are returned to\ndesignated area\n3.4. Consumable materials are\nrequested in exact quantity\n3.1. Procedures in\ndispensing and\nretrieval of materials;\ntools, instruments\nand equipment\n3.2. Things to be\nconsidered in\nreturning the\nborrowed tools,\ninstruments and\nequipment.\n3.1. Applying 5S\n(systematize)\n3.2. documentation\nskills\n4. Identify and\nminimize/\neliminate\nhazards\n\n4.1. Hazards in the work area are\nrecognized and reported to\ndesignated personnel and\nappropriate control actions are\ntaken\n4.2. Workplace policies and\nprocedures for controlling risks\nare established and followed\n4.1. Composition of safety\ncommittee\n4.2. Policies and\nprocedures in\ncontrolling risk\n4.3. Safety signs and first\naid\n4.4. Safety signs and\n4.1. Hazard\nidentification\nskills\n4.2. Practice safety\nskills\n4.3. Identifying\nsafety signs\nand symbols\n\n--- PDF PAGE 56 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR–RAC Servicing (DomRAC) NC II (HVCDRA221) Promulgated: June 8, 2021 52\nELEMENT\nPERFORMANCE CRITERIA\nItalicized fonts are elaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\naccurately\n4.3. Workplace procedures for\ndealing with emergencies are\nfollowed whenever necessary\nwithin the scope of\nresponsibilities and\ncompetencies\n4.4. Safety signs and hazard\nwarnings are displayed and\nobserved at all times in line with\nworkplace health and safety\nregulations\n4.5. Equipment and safety\ndevices/PPE are used/handled\naccording to company or\nmanufacturer's procedures and\nguidelines\n4.6. Work areas are kept clean, free\nfrom obstacles and emergency\nexits are known and kept clear\nat all times\n4.7. Safe manual handling/fighting\ntechniques and safe equipment\noperation techniques are\nemployed at all times\nhazards warning\npreparation\n4.5. Equipment and safety\ndevices\n4.6. Safe handling\ntechnique in using\nequipment and safe\ndevices.\n4.7. Identification of\nSafety Signs and\nSymbols\n\n5. Respond\nand record\naccidents\n5.1. Workplace accidents are\nidentified\n5.2. Workplace emergency first-\naid procedures/ treatment\nare followed/carried out\ncorrectly in accordance with\nstandards/regulations and\nenterprise procedures/policies\n5.3. Medical assistance/rescue is\ncoordinated with concerned\npersonnel in line with\norganizational policies\n5.4. Accident/incident records\nmaintained in accordance with\nstandard operating procedures\n5.1. Types of accidents\n5.2. Procedures in\napplying first aid/\ntreatment\n5.3. First aid supplies\n5.4. Steps in responding\nto and recording\naccidents\n5.1. First aid\napplication\nskills\n5.2. Coordination\nskills\n5.3. Documentation\nskills\n6. Follow basic\nsecurity\n6.1. Security policies/ procedures\nare followed according to\nenterprise practices and\nappropriate legislation\n6.2. Security related events are\nrecorded/reported on the\nrelevant forms\n6.3. Staff are advised of enterprise\nsecurity procedures and\ncorrect methods of\nimplementation\n6.1. Basic security\nprocedures\n6.2. Security signs and\nsymbols\n6.3. Loss control\nmanagement\n6.3.1. Hazards\n6.3.2. Safety signs\n\n6.1. Coordination\nskills\n6.2. Reporting skills\n6.3. Documentation\nskills\n6.4. Practice safety\nskills\n\n--- PDF PAGE 57 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR–RAC Servicing (DomRAC) NC II (HVCDRA221) Promulgated: June 8, 2021 53\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Hazards\nHazards that may be present in the workplace include but\nnot limited to:\n1.1. Flammable materials\n1.2. Running machinery/equipment\n1.3. Toxic substances\n1.4. Debris\n1.5. Open flames\n1.6. Loose objects/fixtures\n1.7. Chemicals\n1.8. Electrical faults\n1.9. Hot metals\n2. Emergencies\nEmergencies may include but not limited to:\n2