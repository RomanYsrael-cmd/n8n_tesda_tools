          "source_text": "1. Critical aspects\nof competency\nAssessment requires evidence that the candidate:\n1.1. Cleaned and/or replaced air filter parts/components\n1.2. Cleaned evaporator/condensing coil\n1.3. Maintained fan motor assembly\n1.4. Serviced electrical power and control circuits\n1.5. Accomplished service report.\n\n2. Resource\nImplications\nThe following resources must be provided:\n2.1. Access to work place location\n2.2. Tools and equipment\n2.3. Materials relevant to the proposed activity\n2.4. service manual\n\n3. Methods of\nAssessment\nCompetency must be assessed through:\n3.1. Direct observation/demonstration with oral questioning\n3.2. Portfolio with interview\n3.3. Third party results\n\n4. Context for\nAssessment\n4.1. Competency may be assessed in actual workplace or at\nthe designated TESDA Accredited Assessment Center.\n\n--- PDF PAGE 71 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR–RAC Servicing (DomRAC) NC II (HVCDRA221) Promulgated: June 8, 2021 67\n\nUNIT OF COMPETENCY: TROUBLESHOOT AND REPAIR DOMESTIC\nREFRIGERATION AND AIR-CONDITIONING (DomRAC)\nSYSTEMS\n\nUNIT CODE\n :"
        },
        "source_text": "HVC723338\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes in\nservicing and maintaining domestic refrigeration and air-\nconditioning units. Specifically, it includes cleaning and\nreplacing air filters, servicing evaporator/ condenser,\nmaintaining fan motor assembly, servicing electrical power\nand control circuits as well as accomplishing service and\nmaintenance report.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized fonts are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1. Clean air\nfilter\n1.1 Air filter is identified\nand removed following\nstandard procedures\n1.2 Air filter is checked for\ndamage and replaced, if\nrequired, in accordance\nwith air filter\nspecifications*\n1.3 Air filter is cleaned using\nthe correct tools and\ncleaning procedures*\n1.1 Protective personal\nequipment/ safety\ngears\n1.2 Cleaning agents\n1.3 Air filter cleaning\nprocedures\n1.4 RAC Code of\nPractice\n1.5 RA 11058 provisions\n1.6 5s / housekeeping\n\n1.1 Proper handling of\ntools and equipment\n1.2 Removing air filter\nproperly\n1.3 Cleaning skills\n1.4 Following cleaning\nprocedures\n1.5 Interpersonal skills\n\n2. Service\nevaporator/\ncondenser\n2.1 Tools are selected in\ndismantling the\nevaporator/ condensing\nunit as per standard\noperating procedures\n(SOPs)\n2.2 High pressure washer\nand compressed air are\nused in cleaning\nevaporator/ condensing\ncoil based on\nestablished procedures*\n2.3 Evaporator/condenser\ncoil fins are straightened\nin accordance with\nservice procedure\n2.4 Cleaning agent or non-\ncorrosive chemical is\nused in cleaning and\nmaintaining evaporator/\ncondensing coil, fins and\nother body accessories\nas per standard\noperating procedures\n(SOPs)*\n2.1 Protective personal\nequipment/ safety\ngears\n2.2 Cleaning agents\n2.3 evaporator/\ncondenser cleaning\nprocedures\n2.4 RAC Code of\nPractice\n2.5 RA 11058 provisions\n2.6 5s / housekeeping\n2.1 Preparing materials\n2.2 Proper handling of\ntools and equipment\n2.3 Cleaning and\nmaintaining\nDomRAC units\n2.4 Skills in using high\npressure washer and\ncompressed air\n2.5 Interpersonal skills\n\n3. Maintain fan\nmotor\nassembly\n3.1 Fan motor is maintained\nin line with\nmanufacturer’s\ninstructions\n3.1 Principle and\noperation of motors\n3.2 Types of fan motors\n3.3 Fan motor terminals\n3.1 Interpreting diagrams\n3.2 Preparing materials\n3.3 Proper handling of\ntools and equipment\n\n--- PDF PAGE 68 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR–RAC Servicing (DomRAC) NC II (HVCDRA221) Promulgated: June 8, 2021 64\nELEMENT\nPERFORMANCE CRITERIA\nItalicized fonts are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n3.2 Fan blades and blower\nare serviced and\nmaintained in line with\nmanufacturer’s\ninstructions.\n3.3 Fan motor terminals’\ncondition are checked\nand serviced in line with\nSOP.\n3.4 Fan motor\nbearing/bushing is\nchecked and lubricated\nbased on\nmanufacturer’s\ninstruction\n3.5 Fan motor mounting is\nchecked and serviced in\nline with manufacturer’s\ninstruction\n\n3.4 Fan motor diagram\n3.5 Fan motor assembly\n3.6 Types of fan blades\nand blower\n3.7 Manufacturer’s\ninstructions\n3.8 RAC Code of\nPractice\n3.9 RA 11058 provisions\n3.10 5s / housekeeping\n3.4 Testing electrical\nsystem\n3.5 Fan motor terminal\nidentification skills\n3.6 Maintaining fan motor\nassembly\n\n4. Service\nelectrical\npower and\ncontrol\ncircuits\n4.1 Proper instrument is\nused in checking power\nsupply and diagnosing\nelectrical control\n4.2 Loose connections/\nwirings are checked,\nrepaired and reported in\nline with SOP\n4.3 Plugs and outlets are\nchecked in line with\nSOP\n4.4 Grounding is checked in\nline with SOP\n4.1 Protective personal\nequipment/safety\ngears\n4.2 Handling of tools,\ninstruments,\nequipment and\naccessories\n4.3 Electrical power and\ncontrol circuits\n4.4 Electronic control\nsystems including\ninverters\n4.5 RA 11058 provisions\n4.1 Interpreting diagrams\n4.2 Preparing materials\n4.3 Proper handling of\ntools, instruments\nand equipment\n4.4 Testing electrical\nsystem\n4.5 Diagnostic skills\n4.6 Interpersonal skills\n5. Accomplish\nservice and\nmaintenance\nreport\n5.1 All defects and problems\nencountered are\nreported in line with\nenterprise policies and\nprocedures.\n5.2 Observation and\nrecommendation are\nproperly reported in line\nwith enterprise policies\nand procedures\n5.1 Preparation of\nservice and\nmaintenance report\n5.2 Types of defects and\nproblems\nencountered\n5.1 Preparing service\nand maintenance\nreport\n5.2 Communicating\neffectively\n\n--- PDF PAGE 69 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR–RAC Servicing (DomRAC) NC II (HVCDRA221) Promulgated: June 8, 2021 65\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Air filter\nMay include:\n1.1. Disposable\n1.2. Reusable\n\n2. Cleaning agent\nMay include:\n2.1. Soap powder\n2.2. Liquid soap\n2.3. Alkaline-based chemical\n\n3. Other body accessories\nMay include:\n3.1. base pan\n3.2. drip tray\n3.3. shroud\n3.4. face cover\n3.5. housing\n3.6. propeller blade\n3.7. centrifugal fan (blower)\n\n4. proper instrument\nMay include:\n4.1. clamp meter\n4.2. VOM multi-tester\n\n--- PDF PAGE 70 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR–RAC Servicing (DomRAC) NC II (HVCDRA221) Promulgated: June 8, 2021 66\n\nEVIDENCE GUIDE\n\n1. Critical aspects\nof competency\nAssessment requires evidence that the candidate:\n1.1. Cleaned and/or replaced air filter parts/components\n1.2. Cleaned evaporator/condensing coil\n1.3. Maintained fan motor assembly\n1.4. Serviced electrical power and control circuits\n1.5. Accomplished service report.\n\n2. Resource\nImplications\nThe following resources must be provided:\n2.1. Access to work place location\n2.2. Tools and equipment\n2.3. Materials relevant to the proposed activity\n2.4. service manual\n\n3. Methods of\nAssessment\nCompetency must be assessed through:\n3.1. Direct observation/demonstration with oral questioning\n3.2. Portfolio with interview\n3.3. Third party results\n\n4. Context for\nAssessment\n4.1. Competency may be assessed in actual workplace or at\nthe designated TESDA Accredited Assessment Center.\n\n--- PDF PAGE 71 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR–RAC Servicing (DomRAC) NC II (HVCDRA221) Promulgated: June 8, 2021 67\n\nUNIT OF COMPETENCY: TROUBLESHOOT AND REPAIR DOMESTIC\nREFRIGERATION AND AIR-CONDITIONING (DomRAC)\nSYSTEMS\n\nUNIT CODE\n :"
