        "source_title": "INSTALL DOMESTIC REFRIGERATION AND AIR- CONDITIONING (DomRAC) UNITS",
        "source_text": "--- PDF PAGE 62 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ \nTR–RAC Servicing (DomRAC) NC II       (HVCDRA221)             Promulgated: June 8, 2021                   58                  \n \nCORE COMPETENCIES \n \n \nUNIT OF COMPETENCY:  INSTALL DOMESTIC REFRIGERATION AND AIR-\nCONDITIONING (DomRAC) UNITS \n \nUNIT CODE                     :  HVC723337 \n \n \nUNIT DESCRIPTOR        :  This unit covers the knowledge, skills and attitudes required \nto safely and properly install and test domestic refrigeration \nand air-conditioning units. It includes conducting survey for \ninstallation, installing DomRAC unit and conducting \nperformance testing. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized fonts are elaborated in \nthe Range of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n1. Conduct \nsurvey \n1.1. Site conditions and \ninstallation requirements \nare assessed according to \nmanufacturer’s specification, \nexisting layout and prevailing \ncodes and ordinances* \n1.2. Tools, equipment and \nmaterials needed for \ninstallation are determined \naccording to site conditions \nand site installation \nrequirements * \n1.3. Cost and estimate of \nmaterials are determined \naccording to site conditions \nand site installation \nrequirements \n1.4. Survey result is reported in \naccordance with enterprise \npolicies and procedures \n \n1.1. Electrical plans, \nsymbols and \nabbreviations \n1.2. Site conditions and \ninstallation \nrequirements \n1.3. Codes and \nordinances \n1.4. Tools, equipment \nand materials \nneeded for \ninstallation \n1.5. Basic electrical \ninstallation  \n1.6. Heat load \ncalculations and \nestimate \n1.7. RA 11058 \nprovisions \n1.1. Interpreting plans and \ndetails \n1.2. Preparing materials \n1.3. Inspection skills \n1.4. Identifying tools, \nequipment and \nmaterials \n1.5. Basic Mathematical \nskills \n1.6. Communicating \neffectively \n2. Check \nDomRAC \nelectrical \ncircuit * \n2.1. Electrical cabling and wiring \ndevices of correct load \ncarrying capacity are \nchecked in accordance with \nequipment electrical \nrequirements * \n2.2. Electrical circuit is tested in \naccordance with applicable \nPhilippine Electrical Code \n(PEC) provisions* \n2.1. Protective \npersonal \nequipment/safety \ngears \n2.2. Handling of tools, \nequipment and \naccessories \n2.3. Safety signs and \nsymbols \n2.4. Good \nhousekeeping \n2.5. Basic electricity \n2.6. Electrical cabling \nand wiring \ndevices \n2.7. PEC provisions \n(Testing electrical \ncircuits) \n2.1. Interpreting plans and \ndetails \n2.2. Preparing materials \n2.3. Proper handling of \ntools and equipment \n2.4. Working safely \n2.5. Testing power supply \n2.6. Connecting power \ncircuit \n2.7. Communicating \neffectively\n\n--- PDF PAGE 63 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ \nTR–RAC Servicing (DomRAC) NC II       (HVCDRA221)             Promulgated: June 8, 2021                   59                  \nELEMENT \nPERFORMANCE CRITERIA \nItalicized fonts are elaborated in \nthe Range of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n2.8. RA 11058 \nprovisions \n \n \n3. Install \nDomRAC \nunit * \n3.1. Unit and equipment/ \ncomponents are prepared \nbased on work procedures \n3.2. Bracket, hangers and frames \nare installed in accordance \nwith manufacturer’s \nrecommendation and/or RAC \nCode of Practice \n3.3. Unit is positioned and \nleveled in line with \nmanufacturer's instructions \nand/or RAC Code of Practice \n3.4. Sealing materials are \napplied to ensure an air tight \nseal around the unit in line \nwith manufacturer's \ninstructions and/or RAC \nCode of Practice \n3.5. Condensate drain is \ninstalled in accordance with \nmanufacturer’s \nrecommendation and/or RAC \nCode of Practice \n3.6. Safe manual handling \ntechniques are employed in \nline with enterprise OH&S \nprocedures \n3.7. 5’s principles is applied in \nline with enterprise policy \n3.1. Protective \npersonal \nequipment/safety \ngears \n3.2. Handling of tools, \nequipment and \naccessories \n3.3. Safety signs and \nsymbols \n3.4. Good \nhousekeeping \n3.5. RAC Code of \nPractice \n3.6. Safe manual \nhandling \ntechniques  \n3.7. Application of \nsealing materials \n3.8. Types of sealant \n3.9. \nInstallation of \ncondensate drain \n3.10. 5’s principles \n3.11. RA 11058 \nprovisions \n3.1. Interpreting plans and \ndetails \n3.2. Preparing materials \n3.3. Proper handling of \ntools and equipment \n3.4. Working safely \n3.5. Installing  window-\ntype air-conditioning \nand domestic \nrefrigeration unit \n3.6. Testing power supply \n3.7. Connecting power \ncircuit \n3.8. Operating window-\ntype air-conditioning \nunit and domestic \nrefrigeration unit \n3.9. Communicating \neffectively \n4. Conduct \nperformance \ntest* \n4.1. Voltage and current are \nmeasured according to unit \npower requirements. \n4.2. Air temperature and velocity \nare measured based on unit \nspecifications. \n4.3. Sounds and vibration are \nchecked based on unit \nspecifications \n4.4. Service report is \naccomplished in line with \nenterprise policies and \nprocedures \n4.1. Protective \npersonal \nequipment/safety \ngears \n4.2. Operations and \ninstallation \nmanuals \n4.3. Usage of \nmeasuring \ninstruments \n4.4. Measurement \nparameters \n4.5. Preparation of \nservice report \n4.6. RA 11058 \nprovisions \n \n4.1. Proper handling of \nmeasuring \ninstruments \n4.2. Working safely \n4.3. Operating window-\ntype air-conditioning \nunit and domestic \nrefrigeration unit \n4.4. Measuring \nparameters \n4.5. Communicating \neffectively\n\n--- PDF PAGE 64 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ \nTR–RAC Servicing (DomRAC) NC II       (HVCDRA221)             Promulgated: June 8, 2021                   60                  \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Site conditions \n \nSite conditions may include: \n1.1. Assessment of structural and architectural \ninstallation provisions \n1.2. Assessment of availability of power source and \nunit’s electrical provisions \n1.3. Assessment of wall finishing provisions \n1.4. Assessment of drainage provisions \n1.5. Assessment of air circulation/ ventilation \nprovisions \n2. Installation requirements \nInstallation requirements may include: \n2.1. Installation location requirements \n2.2. Wall finishing requirements \n2.3. Electrical requirements  \n• A/C plug and outlet \n• Wire size \n• Protection devices \n• Grounding \n2.4. Drain pipe requirements \n3. Tools and equipment \nTools and equipment may include: \n3.1. Measuring tools \n3.2. Spirit level \n3.3. Plumb bob \n3.4. Clear/Transparent water hose \n3.5. Screw driver, flat and philips \n3.6. Chisel \n3.7. Hammer (claw and ballpein) \n3.8. Hacksaw \n3.9. Electric drill \n3.10. Drill bits \n3.11. Cross cut/Rip saw \n3.12. Welding equipment \n3.13. Masonry tools (e.g. trowel, spade, level, etc.) \n3.14. Calculator/Cellphone \n \n4. Materials  \nMaterials includes: \n4.1. Expansion bolt \n4.2. Welding electrode (rod) \n4.3. Sealant \n4.4. Masonry materials (e.g. cement, sand, etc.) \n4.5. Drain pipe/tube / PVC pipe  \n5. Wiring devices \nMay include: \n5.1. Service grounding \n5.2. Service outlet \n5.3. Service plug \n5.4. Circuit breaker  \n \n6. Unit \nUnit includes:\n\n--- PDF PAGE 65 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ \nTR–RAC Servicing (DomRAC) NC II       (HVCDRA221)             Promulgated: June 8, 2021                   61                  \nVARIABLE \nRANGE \n6.1. Window type air-conditioner  \n6.2. Domestic Refrigeration unit (e.g. refrigerator, \nwater cooler, household freezer, etc. \n7. Sealing materials \nMay include: \n7.1. Rubber gasket \n7.2. Foam \n7.3. Silicone \n8. Condensate drain \nMay include: \n8.1.  PVC pipe/clamp \n8.2. Plastic tubing/clamp \n8.3. G.I. or metal tubing/clamp \n9. OH&S procedures \nMay include: \n9.1. Wearing of PPE \n9.2. Lifting procedures \n9.3. Ladder safety \n9.4. Housekeeping \n10. Service report \nMay include: \n10.1. Survey report \n10.2. Installation report \n10.3. Testing report \n10.4. Commissioning report\n\n--- PDF PAGE 66 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ \nTR–RAC Servicing (DomRAC) NC II       (HVCDRA221)             Promulgated: June 8, 2021                   62                  \n \n EVIDENCE GUIDE \n1. Critical aspects \nof competency \nAssessment requires evidence that the candidate: \n1.1 Assessed site conditions for DomRAC installation \n1.2 Installed electrical circuit \n1.3 Installed unit \n1.4 Tested unit \n1.5 Performed housekeeping \n2. Resource \nImplications \nThe following resources should be provided: \n2.1 Access to work place location/installation area \n2.2 Tools and equipment appropriate to installation \n2.3 Materials relevant to the proposed activity/task \n2.4 Drawings and specifications relevant to the task \n3. Methods of \nAssessment \nCompetency must be assessed through: \n3.1 Demonstration/Direct observation with oral questioning \n3.2 Portfolio with interview \n3.3 Third party report \n4. Context for \nAssessment \n4.1 Competency may be assessed in actual workplace or at \nthe designated TESDA Accredited Assessment Center.\n",
