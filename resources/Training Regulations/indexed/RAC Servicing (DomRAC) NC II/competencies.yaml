ely \nand legibly \n3.2 Workplace data is \nrecorded on standard \nworkplace forms and \ndocuments \n3.3 Errors in recording \ninformation on forms/ \ndocuments are identified \nand properly acted upon \n3.4 Reporting requirements \nto supervisor are \ncompleted according to \norganizational \nguidelines \n3.1 Effective verbal \nand non-verbal \ncommunication \n3.2 Different modes \nof communication  \n3.3 Workplace forms \nand documents \n3.4 Organizational/ \nWorkplace \npolicies \n3.5 Communication \nprocedures and \nsystems \n3.6 Technology \nrelevant to the \nenterprise and \nthe individual’s \nwork \nresponsibilities  \n3.1 Completing work- \nrelated documents \n3.2 Applying operations \nof addition, \nsubtraction, division \nand multiplication \n3.3 Gathering and \nproviding information \nin response to \nworkplace \nrequirements \n3.4 Effective record \nkeeping skills\n\n--- PDF PAGE 8 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ \nTR–RAC Servicing (DomRAC) NC II       (HVCDRA221)             Promulgated: June 8, 2021                   4                  \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Appropriate sources \nMay include: \n1.1. \nTeam members \n1.2. \nSuppliers \n1.3. \nTrade personnel \n1.4. \nLocal government \n1.5. \nIndustry bodies \n2. Medium \nMay include: \n2.1. \nMemorandum \n2.2. \nCircular \n2.3. \nNotice \n2.4. \nInformation discussion \n2.5. \nFollow-up or verbal instructions \n2.6. \nFace to face communication \n3. Storage \nMay include: \n3.1. \nManual filing system \n3.2. \nComputer-based filing system \n4. Workplace interactions \nMay include: \n4.1. \nFace to face \n4.2. \nTelephone \n4.3. \nElectronic and two-way radio \n4.4. \nWritten including electronic, memos, instruction \nand forms,  \n4.5. \nNon-verbal including gestures, signals, signs and \ndiagrams \n5. Forms \nMay include: \n5