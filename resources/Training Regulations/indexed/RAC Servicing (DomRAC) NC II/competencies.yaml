        "source_text": "HVC311203\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes in\nidentifying and measuring objects, pressure, temperature,\ncurrent, voltage resistance and power based on the required\nperformance standards.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized fonts are elaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Select\nmeasuring\ninstruments\n\n1.2 Object or component to be\nmeasured is identified, classified\nand interpreted to the appropriate\nregular geometric shape\n1.3 Measuring tools are selected/\nidentified as per object to be\nmeasured or job requirements\n1.4 Correct specifications are obtained\nfrom relevant sources\n1.5 Appropriate measuring\ninstruments are selected\naccording to job requirements\n1.6 Alternative measuring tools are\nused without sacrificing cost and\nquality of work\n\n1.1. Category of\nmeasuring\ninstruments\n1.2. Types and uses\nof measuring\ninstruments\n1.3. Shapes and\nDimensions\n1.4. Formulas for\nvolume, areas,\nperimeters of\nplane and\ngeometric figures\n1.1. Identifying\nand selecting\nmeasuring\ninstruments\n1.2. Visualizing\nobjects and\nshapes\n2. Carry out\nmeasurements\nand\ncalculations\n\n2.1 Accurate measurements and\ncalculations are obtained to job\nrequirements\n2.2 Alternative measuring tools are\nused without sacrificing cost and\nquality of work\n2.3 Calculation needed to complete\nwork tasks are performed using\nthe four basic process of addition\n(+), subtraction (-), multiplication\n(x) and division (/) including but not\nlimited to: trigonometric functions,\nalgebraic computations\n2.4 Calculations involving fractions,\npercentages and mixed numbers\nare used to complete workplace\ntasks\n2.5 Numerical computation is self-\nchecked and corrected for\naccuracy\n2.6 Instruments are read to the limit of\naccuracy of the tool\n2.7 Systems of measurement\nidentified and converted according\nto job requirements/ISO\n2.8 Work pieces are measured\naccording to job requirements\n2.1. Calculation &\nmeasurement\n2.2. Four fundamental\noperation\n2.3. Linear\nmeasurement\n2.4. Dimensions\n2.5. Unit conversion\n2.6. Ratio and\nproportion\n2.1. Performing\ncalculation by\naddition,\nsubtraction,\nmultiplication\nand division;\n2.2. Interpreting\nformulas for\nvolume,\nareas,\nperimeters of\nplane and\ngeometric\nfigures\n2.3. Handling of\nmeasuring\ninstruments\n\n--- PDF PAGE 41 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR–RAC Servicing (DomRAC) NC II (HVCDRA221) Promulgated: June 8, 2021 37\nELEMENT\nPERFORMANCE CRITERIA\nItalicized fonts are elaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n3. Maintain\nmeasuring\ninstruments\n3.1. Measuring instruments are\ncarefully handled to avoid damage\n3.2. Measuring instruments are\ncleaned before and after using.\n3.3. Proper storage of instruments\nundertaken according to\nmanufacturer’s specifications and\nstandard operating procedures.\n\n3.1. Types of\nmeasuring\ninstruments and\ntheir uses\n3.2. Safe handling\nprocedures in\nusing measuring\ninstruments\n3.3. Four\nfundamental\noperation of\nmathematics\n3.4. Formula for\nvolume, area,\nperimeter and\nother geometric\nfigures\n3.1. Handling and\nmaintaining\nmeasuring\ninstruments\n3.2. Properly\nstoring\nmeasuring\ninstruments\n\n--- PDF PAGE 42 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR–RAC Servicing (DomRAC) NC II (HVCDRA221) Promulgated: June 8, 2021 38\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Geometric Shape\n\n Including but I not limited to:\n1.1 Round\n1.2 Square\n1.3 Rectangular\n1.4 Triangle\n1.5 Sphere\n1.6 Conical\n\n2. Measuring\ninstruments\nIncluding but not limited to:\n2.