        "source_text": "HVC311201\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes in\nidentifying, interpreting, applying services to specifications\nand manuals, and storing manuals.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized fonts are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1. Identify and\naccess\nspecification/\nmanuals\n\n1.1 Appropriate manuals are\nidentified and accessed as\nper job requirements\n1.2 Version and date of manual\nis checked to ensure correct\nspecification and procedure\nare identified\n\n1.1 Types of\nmanuals used in\nHVAC/R sector\n1.2 Identification of\nsymbols used in\nthe manuals\n1.1 Reading and\ncomprehension\nskills required to\nidentify and interpret\nconstruction\nmanuals and\nspecifications\n1.2 Identifying manuals\nand specifications\n1.3 Accessing\ninformation and data\n2. Interpret\nmanuals\n2.1 Relevant sections, chapters\nof specifications/ manuals\nare located in relations to\nthe work to be conducted\n2.2 Information and procedure\nin the manual are\ninterpreted in accordance to\nindustry practices\n\n2.1 Types of\nmanuals used in\nHVAC/R sector\n2.2 Types of\nsymbols used in\nthe manuals\n2.3 System of\nmeasurements\n2.4 Unit conversion\n2.1 Interpreting symbols\nand specifications\n2.2 Accessing\ninformation and data\n2.3 Applying conversion\nof units of\nmeasurements\n3. Apply\ninformation in\nmanual\n3.1 Manual is interpreted\naccording to job\nrequirements\n3.2 Work steps are correctly\nidentified in accordance\nwith manufacturer's\nspecification\n3.3 Manual data is applied\naccording to the given task\n3.4 All correct sequencing and\nadjustments are interpreted\nin accordance with\ninformation contained on\nthe manual or specifications\n3.1 Types of\nmanuals used in\nHVAC/R sector\n3.2 Types and\napplication of\nsymbols in\nmanuals\n3.3 Unit conversion\n3.1 Applying\ninformation from\nmanuals\n4. Store\nmanuals\n4.1 Manual or specification are\nstored appropriately to\nensure prevention of\ndamage and for easy\naccess\n4.2 Updating of information\nwhen required is performed\nin accordance with\ncompany requirements\n4.1 Types of\nmanuals used in\nHVAC/R sector\n4.2 Manual storing\nand maintaining\nprocedures\n4.1 Storing and\nmaintaining manuals\n\n--- PDF PAGE 39 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR–RAC Servicing (DomRAC) NC II (HVCDRA221) Promulgated: June 8, 2021 35\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Manual\n\nKinds of Manuals:\n1.1 Installation Manual\n1.1.1 Manufacturer's Specification Manual\n1.2 Owner’s Manual\n1.2.1 Maintenance Procedure Manual\n1.2.2 Periodic Maintenance Manual\n\nEVIDENCE GUIDE\n1. Critical aspects\n of Competency\nAssessment requires that the candidate:\n1.1 Identified and accessed specification/manuals as per\njob requirements\n1.2 Interpreted manuals in accordance to industry\npractices\n1.3 Applied information in manuals according to the given\ntask\n1.4 Stored manuals in accordance with company\nrequirements\n\n2. Resource Implications\nThe following resources should be provided:\n2.1 All manuals/catalogues relative to HVAC/R sector\n\n3. Methods of Assessment\nCompetency should be assessed through:\n3.1 Direct Observation\n3.2 Questions/Interview\n\nAssessment of required knowledge and practical skills\nmay be combined\n\n4. Context for Assessment\n4.1 Competency assessment must be undertaken in\naccordance with the endorsed TESDA assessment\nguidelines\n4.2 Assessment may be conducted in the workplace or a\nsimulated environment\n\n--- PDF PAGE 40 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR–RAC Servicing (DomRAC) NC II (HVCDRA221) Promulgated: June 8, 2021 36\n\nUNIT OF COMPETENCY: PERFORM MENSURATIONS AND CALCULATIONS\n\nUNIT CODE\n :"
