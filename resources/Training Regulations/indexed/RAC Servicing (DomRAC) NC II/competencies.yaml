        "source_text": "400311213\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills, and attitudes in\nmanaging one’s emotions, developing reflective practice,\nand boosting self-confidence and developing self-regulation.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1. Manage\none’s\nemotion\n1.1. Self-management\nstrategies are identified\n1.2. Skills to work independently\nand to show initiative, to be\nconscientious, and\npersevering in the face of\nsetbacks and frustrations are\ndeveloped\n1.3. Techniques for effectively\nhandling negative emotions\nand unpleasant situation in\nthe workplace are examined\n\n1.1. Self-management\nstrategies that assist\nin regulating behavior\nand achieving\npersonal and learning\ngoals (e.g. Nine self-\nmanagement\nstrategies according\nto Robert Kelley)\n1.2. Enablers and barriers\nin achieving personal\nand career goals\n1.3. Techniques in\nhandling negative\nemotions and\nunpleasant situation\nin the workplace such\nas frustration, anger,\nworry, anxiety, etc.\n1.1. Managing properly\none’s emotions and\nrecognizing\nsituations that\ncannot be changed\nand accept them\nand remain\nprofessional\n1.2. Developing self-\ndiscipline, working\nindependently and\nshowing initiative to\nachieve personal\nand career goals\n1.3. Showing\nconfidence, and\nresilience in the\nface of setbacks\nand frustrations and\nother negative\nemotions and\nunpleasant\nsituations in the\nworkplace\n\n2. Develop\nreflective\npractice\n2.1. Personal strengths and\nachievements, based on\nself-assessment strategies\nand teacher feedback are\ncontemplated\n2.2. Progress when seeking and\nresponding to feedback from\nteachers to assist them in\nconsolidating strengths,\naddressing weaknesses and\nfulfilling their potential are\nmonitored\n2.3. Outcomes of personal and\nacademic challenges by\nreflecting on previous\nproblem solving and\ndecision-making strategies\nand feedback from peers\nand teachers are predicted\n\n2.1. Basic SWOT analysis\n2.2. Strategies to improve\none’s attitude in the\nworkplace\n2.3. Gibbs’ Reflective\nCycle/Model\n(Description,\nFeelings, Evaluation,\nAnalysis, Conclusion,\nand Action plan)\n2.1. Using the basic\nSWOT analysis as\nself-assessment\nstrategy\n2.2. Developing\nreflective practice\nthrough realization\nof limitations, likes/\ndislikes; through\nshowing of self-\nconfidence\n2.3. Demonstrating self-\nacceptance and\nbeing able to\naccept challenges\n\n--- PDF PAGE 17 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR–RAC Servicing (DomRAC) NC II (HVCDRA221) Promulgated: June 8, 2021 13\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n3. Boost self-\nconfidence\nand\ndevelop\nself-\nregulation\n3.1. Efforts for continuous self-\nimprovement are\ndemonstrated\n3.2. Counter-productive\ntendencies at work are\neliminated\n3.3. Positive outlook in life is\nmaintained.\n\n3.1. Four components of\nself-regulation based\non Self-Regulation\nTheory (SRT)\n3.2. Personality\ndevelopment\nconcepts\n3.3. Self-help concepts\n(e. g., 7 Habits by\nStephen Covey,\ntransactional\nanalysis, psycho-\nspiritual concepts)\n3.1. Performing effective\ncommunication\nskills – reading,\nwriting, conversing\nskills\n3.2. Showing affective\nskills – flexibility,\nadaptability, etc.\n3.3. Self-assessment for\ndetermining one’s\nstrengths and\nweaknesses\n\n--- PDF PAGE 18 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR–RAC Servicing (DomRAC) NC II (HVCDRA221) Promulgated: June 8, 2021 14\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Self-management\nstrategies\nMay include but not limited to:\n1.1 Seeking assistance in the form of job coaching or\nmentoring\n1.2 Continuing dialogue to tackle workplace grievances\n1.3 Collective negotiation/bargaining for better working\nconditions\n1.4 Share your goals to improve with a trusted co-worker or\nsupervisor\n1.5 Make a negativity log of every instance when you catch\nyourself complaining to others\n1.6 Make lists and schedules for necessary activities\n2. Unpleasant situation\nMay include but not limited to:\n2.1 Job burn-out\n2.2 Drug dependence\n2.3 Sulking\n\nEVIDENCE GUIDE\n\n1 Critical aspects\nof Competency\nAssessment requires evidence that the candidate:\n1.1 Express emotions appropriately\n1.2 Work independently and show initiative\n1.3 Consistently demonstrate self-confidence and self-\ndiscipline\n2 Resource\nImplications\nThe following resources should be provided:\n2.1 Access to workplace and resource s\n2.2 Case studies\n3 Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1 Demonstration or simulation with oral questioning\n3.2 Case problems involving work improvement and\nsustainability issues\n3.3 Third-party report\n4 Context for\nAssessment\n4.1 Competency may be assessed individually in the actual\nworkplace or simulation environment in TESDA accredited\ninstitutions\n\n--- PDF PAGE 19 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR–RAC Servicing (DomRAC) NC II (HVCDRA221) Promulgated: June 8, 2021 15\nUNIT OF COMPETENCY :\nCONTRIBUTE TO WORKPLACE INNOVATION\n\nUNIT CODE\n:"
