al and\nbehavioral\nInterviews\n• Performance\nEvaluation\n• Life Narrative\nInquiry\n• Review of\nportfolios of\nevidence and third-\nparty workplace\nreports of on-the-\njob performance.\n• Standardized\nassessment of\ncharacter strengths\nand virtues applied\n5.2 Generate\npractical action\nplans for\nimproving work\nprocedures,\nprocesses\n• Show mastery of the following practical\nconcepts (e.g., 7 habits of highly effective\npeople, character strengths that foster\nlearning and innovation, five minds of the\nfuture, adaptation concepts and\ntranstheoretical model of behavior change)\n• Demonstrate collaboration and networking\nskills\n• Show basic skills in research\n• Generate practical insights on how to\nimprove organizational procedures,\nprocesses and systems\n• Set up action plans on how to apply\ninnovative procedures in the organization\n• Set up action plans on how to apply\ninnovative procedures in the organization\n• Interactive Lecture\n• Appreciative Inquiry\n• Demonstration\n• Group work\n• Psychological and\nbehavioral\nInterviews\n• Performance\nEvaluation\n• Life Narrative\nInquiry\n• Review of\nportfolios of\nevidence and third-\nparty workplace\nreports of on-the-\njob performance.\n• Standardized\nassessment of\n1 hour\n2 hours\n\n--- PDF PAGE 150 ---\nTR – Emergency Medical Services NC III Revision 00 Promulgated (10/13/2020)) 146\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n• Generate practical insights on how to\nimprove organizational procedures,\nprocesses and systems\ncharacter strengths\nand virtues applied\n5.3 Evaluate the\neffectiveness of\nthe proposed\naction plans\n• Show mastery of the following practical\nconcepts (e.g., 7 habits of highly effective\npeople, character strengths that foster\nlearning and innovation, five minds of the\nfuture, adaptation concepts and\ntranstheoretical model of behavior change)\n• Demonstrate collaboration and networking\nskills\n• Show basic skills in research\n• Generate practical insights on continuous\nimprovement\n• Interactive Lecture\n• Appreciative Inquiry\n• Demonstration\n• Group work\n• Psychological and\nbehavioral\nInterviews\n• Performance\nEvaluation\n• Life Narrative\nInquiry\n• Review of\nportfolios of\nevidence and third-\nparty workplace\nreports of on-the-\njob performance.\n• Standardized\nassessment of\ncharacter strengths\nand virtues applied\n6. Use\ninformation\nsystematically\n\n6.1 Use technical\ninformation\n• Lecture and discussion on:\no Application in collating information\no Procedures for inputting, maintaining and\narchiving information\no Guidance to people who need to find and\nuse information\n• Organizing information into a suitable form\nfor reference and use\n• Classify stored information for identification\nand retrieval\n• Operate the technical information system by\nusing agreed procedures\n• Lecture\n• Group Discussion\n• Hands on\n• Demonstration\n• Oral evaluation\n• Written Test\n• Observation\n• Presentation\n4 hours\n1 hour\n\n--- PDF PAGE 151 ---\nTR – Emergency Medical Services NC III Revision 00 Promulgated (10/13/2020)) 147\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n6.2 Apply\ninformation\ntechnology (IT)\n• Lecture and discussion on:\no Attributes and limitations of available\nsoftware tool\no Procedures and work instructions for the\nuse of IT\no Operational requirements for IT systems\no Sources and flow paths of data\no Security systems and measures that can\nbe used\no Methods of entering and processing\ninformation\n• Use procedures and work instructions for the\nuse of IT\n• Extract data and format reports\n• Use WWW applications\n• Lecture\n• Group Discussion\n• Self-paced handout/\nmodule\n• Hands on\n• Demonstration\n• Oral evaluation\n• Written Test\n• Observation\n• Presentation\n2 hours\n6.3 Edit, format and\ncheck\ninformation\n• Lecture and discussion on:\no Basic file-handling techniques\no Techniques in checking documents\no Techniques in editing and formatting\no Proof reading techniques\n• Use different techniques in checking\ndocuments\n• Edit and format information applying different\ntechniques\n• Proof read information applying different\ntechniques\n• Lecture\n• Group Discussion\n• Self-paced\nhandout/ module\n• Hands on\n• Demonstration\n• Oral evaluation\n• Written Test\n• Observation\n• Presentation\n1 hour\n7. Evaluate\nOccupational\nSafety And\nHealth Work\nPractices\n7.1 Interpret\nOccupational\nSafety and\nHealth practices\n• Discuss the OSH standards, principles and\nlegislations\n• Identify OSH work practices issues\n• Discuss standard safety requirements\n•\nLecture\n•\nGroup Discussion\n\n•\nWritten Exam\n•\nDemonstration\n•\nObservation\n•\nInterviews /\nQuestioning\n1.5 hours\n\n--- PDF PAGE 152 ---\nTR – Emergency Medical Services NC III Revision 00 Promulgated (10/13/2020)) 148\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n7.2 Set OSH work\ntargets\n• Discussion in actions plans that are\nnecessary in achieving the OSH target\n• Lecture\n• Group Discussion\n\n•\nWritten Exam\n•\nDemonstration\n•\nObservation\n•\nInterviews /\nQuestioning\n1 hour\n7.3 Evaluate\neffectiveness of\nOccupational\nSafety and\nHealth work\ninstructions\n• Practice evaluating safety data (Historical or\nSimulated)\n• Lecture\n• Group Discussion\n\n•\nWritten Exam\n•\nDemonstration\n•\nObservation\n•\nInterviews /\nQuestioning\n1.5 hours\n8. Evaluate\nEnvironmental\nWork\nPractices\n8.1 Interpret\nenvironmental\npractices,\npolicies and\nprocedures\n• Discussion Environmental Issues regarding\n- Water Quality\n- National and Local Government Issues\n- Safety\n- Endangered Species\n- Noise\n- Air Quality\n- Historic\n- Waste\n- Cultural\n• Updating of existing occupation practices\n• Lecture\n• Group Discussion\n• Demonstration\n\n•\n