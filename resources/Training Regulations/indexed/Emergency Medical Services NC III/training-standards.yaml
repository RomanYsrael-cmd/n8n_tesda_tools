ssment\nApproach\nNominal\nDuration\n•\nDiscuss and explain reporting,\ndocumentation and use of non-verbal and\nverbal communication\n•\nIdentify the abnormal vital signs of patient /\nclient\n•\nIdentify the mode of communication\n•\nMake use of appropriate modes of\ncommunication\n•\nDemonstrate resuscitation skills\n•\nUtilize operating equipment as required for\nthe assessment of patient / client\n•\nApply safe manual handling of casualty\n•\nAdapt OSH, infection control,\nenvironmental and institutional, rules,\nguidelines, policies and procedures\n•\nReporting preparation\n•\nMake use of intra and Interpersonal skills\n•\nDemonstrate appropriate incident reporting\nand documenting\n3.2 Apply basic first\naid techniques\n•\nLecture and discussion about training\napplication of first aid\n•\nDiscuss and explain the proper use of\nequipment for first aid response (ambubag,\noxygen etc.)\n•\nCompare the normal and abnormal vital\nsigns\n•\nAnalyze the needs for first aid\n•\nDemonstrate first aid procedures\n•\nUtilize operating equipment as required for\nthe assessment of patient / client\n• Lecture (online /\nface to face)\n• Discussion (online /\nface to face)\n• Self-Learning\n• Video Presentation\n(offline / face to\nface)\n• Demonstration\n• Role play\n\n• Written test\n(online / face to\nface)\n• Interview\n• Portfolio\nassessment\n• Observation\n• Demonstration\nwith questioning\n12 hours\n\n--- PDF PAGE 159 ---\nTR – Emergency Medical Services NC III Revision 00 Promulgated (10/13/2020)) 155\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n•\nIllustrate OHS, infection control,\nenvironmental and institutional, rules,\nguidelines, policies and procedures\n•\nMake use of verbal and non-verbal\ncommunication\n•\nMake use of intra and interpersonal skills\n•\nDemonstrate appropriate incident reporting\nand documenting\n3.3 Communicate\ndetails of the\nincident\n•\nLecture and discussion about concepts of\ncommunication in an accident/incident\nsituation\n•\nRead and explain the use of equipment for\ncommunication (computer, cellphone,\nradio, network, etc.)\n•\nClassify the mode of communication in an\naccident/incident situation\n•\nSelect appropriate tools, supplies and\nequipment in communication\n•\nMake use of intra and interpersonal skills\n•\nDemonstrate appropriate communication\nskills reporting and documenting\n• Lecture (online /\nface to face)\n• Discussion (online /\nface to face)\n• Self-Learning\n• Video Presentation\n(offline / face to\nface)\n• Demonstration\n• Role play\n\n• Written test\n(online / face to\nface)\n• Interview\n• Portfolio\nassessment\n• Observation\n• Demonstration\nwith questioning\n4 hours\n\n--- PDF PAGE 160 ---\nTR – Emergency Medical Services NC III Revision 00 Promulgated (10/13/2020)) 156\n\n4. Maintain high\nstandards of\npatient / client\nservices\n(32 hours)\n4.1 Communicate\nappropriately\nwith patients /\nclients\n•\nLecture and discussion on:\n-\nMathematical operations such as\naddition, subtraction, division,\nmultiplication\n-\nConcepts on modes of communication\n-\nEquipment needed for communication\n(computer, cell phone, and other forms of\nmedia)\n-\nRoles and responsibilities of self and\nother workers within the organization\n-\nOrganizational / institutional policies and\nprocedures for privacy and confidentiality\nof information provided by patients /\nclients and others\n-\nInstitutional policy on patient / client rights\nand responsibilities\n-\nReporting and documentation with\naccuracy\n•\nApply mathematical operations such as\naddition, subtraction, division, multiplication\n•\nRead and understand client handling and\ninteraction\n•\nDefine concepts and mode of\ncommunication\n•\nDemonstrate following instructions and\nguidance of health professionals involved\nwith the care of patient / client\n•\nShow how to deal with conflict\n•\nParticipate in the discussion of client\nhandling and interaction\n•\nParticipate in the demonstration in\ncommunicating properly with different types\nof clients, and of different nationalities\n•\nParticipate in the demonstration in\ndelivering correct information to the client\n• Lecture (online /\nface to face)\n• Discussion (online /\nface to face)\n• Self-Learning\n• Video Presentation\n(offline / face to\nface)\n• Demonstration\n• Role play\n\n• Written test\n(online / face to\nface)\n• Interview\n• Portfolio\nassessment\n• Observation\n• Demonstration\nwith questioning\n12 hours\n\n--- PDF PAGE 161 ---\nTR – Emergency Medical Services NC III Revision 00 Promulgated (10/13/2020)) 157\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n•\nDemonstrate empathy with patient / client\nand relatives\n•\nApply intra and Interpersonal skills\n\n--- PDF PAGE 162 ---\nTR – Emergency Medical Services NC III Revision 00 Promulgated (10/13/2020)) 158\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n4.2 Establish and\nmaintain good\ninterpersonal\nrelationship\nwith patients /\nclients\n•\nLecture and discussion on:\n-\nCultural differences of patient / client\nincluding rules and policies as necessary\n-\nInstitutional policy on patient / client rights\nand responsibilities\n-\nManagement of conflict\n•\nIdentify the mode on communication\nappropriate for the situation\n•\nEstablish and maintain relationships, taking\ninto account individual differences\n•\nFollow the instructions and guidance of\nhealth professionals involved with the care\nof patient / client\n•\nShow how to respect patient / client rights\n•\nUse effective listening techniques\n•\nApply appropriate verbal and non-verbal\ncommunication styles\n•\nApply oral and written communication\n•\nDemonstrate working with others and\ndisplaying empathy with patient / client and\nrelatives\n•\nApply conflict management\n•\nApply intra