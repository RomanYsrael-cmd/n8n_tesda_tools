00 Promulgated (10/13/2020)) 218\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n• Knowledge on how to use lights and siren,\ncommunication devices and\ndocumentations\n• Elements that dictate the use of lights and\nsiren to the scene, and to the hospital\n• Specific and limited privileges that are\nprovided to emergency vehicles and drivers\n• Additional risks and special considerations\nrelated to using police escorts and crossing\nintersections pose to EMS personnel during\ntransport\nPerform the following tasks:\n• Communicate patient information through\ncommunication system to the dispatch\ncenter to ensure coordination with the\nreceiving facility\n• Communicate integrated health service\nnetwork\n• Notify hospital for pre arrival arrangements\n• Endorse patient Information to the medical\nauthorities\n• Use lights and sirens appropriately\n• Utilize modes of transport appropriately\n• Demonstrate effective communication\ntechniques\n• Demonstrate use of two-way radios\n• Demonstrate communication skills used in\nMobile Phones\n• Demonstrate how to fill out patient care\nreport\n\n--- PDF PAGE 223 ---\nTR – Emergency Medical Services NC III Revision 00 Promulgated (10/13/2020)) 219\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n• Demonstrate how to write a written report\nthat includes all pertinent patient information\nfollowing patient transfer to the hospital\n\n10.3 Perform\nprocedure in\nloading,\nunloading and\nendorsement\nof patient\n\nLecture and discussion on the following topics:\n•\nVerbal Non-verbal communication\n•\nUse of Simple Commands for lifting the\npatient\n•\nKnowledge on the use of body mechanics\nand power grip\n•\nPhysiology of the body movement to do\nproper body mechanics\n•\nIdentify the risk and hazards during\ntransport\n•\nDifference between cleaning, disinfection,\nhigh-level disinfection, and sterilization\n•\nProtocols and guidelines for driving an\nambulance safely and defensively\n•\nKey steps that EMT can use to identify\nsafety improvement while enroute to the\nscene, the hospital and the station\n•\nComputation of Weight and capacity to lift\na patient\n•\nIdentify the modes of transportation\nPerform the following tasks:\n•\nUse transport equipment appropriately\n•\nLoad patient without exacerbated by\nunnecessary movement of illness/injury\n•\nTransport patient appropriately based on\npatient condition\n•\nFacilitate physical handover based on\npatient safety protocol\n•\nUndertake tasks of the EMT after patient\nconduction is complete\n• Lecture\n• Group Discussion\n• Demonstration\n• Role Play\n• Written Test\n• Oral Evaluation\n• Interview\n• Observation\n9\nhours\n\n--- PDF PAGE 224 ---\nTR – Emergency Medical Services NC III Revision 00 Promulgated (10/13/2020)) 220\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n•\nDemonstrate lifting using commercial\nstretcher\n•\nDemonstrate lifting using folding stretcher\n•\nDemonstrate lifting using spine board\n•\nDemonstrate lifting using scoop stretcher\n•\nDemonstrate lifting using blanket\n•\nDemonstrate Transfer from commercial\nstretcher to Bed\n•\nDemonstrate manual lifting\n•\nDemonstrate how to present verbal report\nthat would be given to arrival personnel at\nthe receiving facility upon patient transfer\n\n10.4 Conduct post-\ntransport\nprocedures\nLecture and discussion on the following topics:\n•\nApplicable regulations in waste\nmanagement\n•\nProper doffing protocols\n•\nAdministrative guidelines in the\nmanagement of COVID-19 in EMS\n•\nDecontamination area requirements and\ndisinfecting procedures\n•\nAmbulance supplies and procedures\nPerform the following tasks:\n•\nFollow post transport protocols on waste\nhandling and disposal\n•\nPerform proper documentation and\ndebriefing procedures\n•\nIdentify decontamination area\n•\nHandle waste properly\n•\nDoffing of PPE’s\n•\nClean and conduct infection control in the\nEMS Agency\n•\nDisinfect the ambulance unit\n•\nReplenish supplies\n• Lecture\n• Group Discussion\n• Demonstration\n• Role Play\n• Written Test\n• Oral Evaluation\n• Interview\n• Observation\n4 hours\n\n--- PDF PAGE 225 ---\nTR – Emergency Medical Services NC III Revision 00 Promulgated (10/13/2020)) 221\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n11 Deliver basic\npre-hospital\ncommunication\nskills\n(32 hours)\n11.1 Exercise\neffective\ncommunication\ntechniques\nLecture and discussion on the following topics:\n•\nFactors and strategies to consider for\ntherapeutic communication with patients\n•\nTechniques of effective verbal\ncommunication\n•\nSkills used to communicate with family\nmembers, bystanders, people from other\nagencies, and hospital personnel\n•\nSystem maintenance forms\n•\nEMS audit forms\n•\nBasic knowledge on communication\nprotocols and equipment handling and\nmaintenance\n•\nBroadcast regulations\n•\nNTC requirements\n•\nBasic principles of the various types of\ncommunications equipment used in EMS.\n•\nDescribe the use radio communications\n•\nProper methods of initiating and\nterminating a radio call\n•\nCorrect radio procedures in the phases of\ncall\n•\nProper sequence of information to\ncommunicate in radio delivery of a patient\nreport\n•\nSpecifications of Base radios, Mobile\nradios, Handheld Radios and wireless\nphones\nPerform the following tasks:\n•\nDemonstrate effective interviewing\ntechniques\n•\nDemonstrate EMS system communication\n• Lecture\n• Group Discussion\n• Demonstration\n• Role Play\n• Written Test\n• Oral Evaluation\n• Interview\n• Observation\n8 hours\n\n--- PDF PAGE 226 ---\nTR – Emergency Medical Services NC III Revision 00 Promulgated (10/13/2020)) 222\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n•\nSeek medical direction as needed\n•\nDemonstrate proper sequence of patient\ninformation communicated via radio\n•\nDemonstrate techniques of successful\ncross-cultural communication\n•\nDemonstrate effective radio\ncommunication skills\n•\nDemonstrate concise radio transmission\nwith dispatch\n\n11.2 Record\nassessment\nand findings\n\nLecture and discussion on the following topics:\nKnowledge\n•\nPrehospital care report/ patient care form\n•\nUse of written communication and\ndocumentation\n•\nRules on prehospital documentation\n•\nInformation required in a patient care\nreport (PCR)\n•\nLegal implications of the patient care\nreport (Data Privacy Act)\n•\nHow to document refusal of care and its\nlegal implications\n•\nBasic Knowledge on\n•\nHuman Anatomy and Physiology\n•\nDocumentation and paraphernalia\n•\nDigital documenting tools\nPerform the following tasks:\n•\nRecord patient information is in\naccordance with standard operating\nprocedures.\n•\nRecord assessment in accordance with\nstandard operating procedures\n• Lecture\n• Group Discussion\n• Demonstration\n• Role Play\n• Self-Learning\n\n• Written Test\n• Oral Evaluation\n• Interview\n• Observation\n12 hours\n\n--- PDF PAGE 227 ---\nTR – Emergency Medical Services NC III Revision 00 Promulgated (10/13/2020)) 223\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n•\nDocument patient care intervention based\non patient assessment protocol\n•\nDemonstrate encoding skills\n•\nDemonstrate the completion of the patient\ncare report\n\n11.3 Hand over\npatient\nLecture and discussion on the following topics:\n•\nCommunicating with dispatch\n•\nCommunicating with medical direction\n•\nRadio codes\n•\nBroadcast regulations\n•\nBasic knowledge in communication\nprotocols, equipment handling and\nmaintenance\n•\nOperation of Base radios\n•\nMobile radios\n•\nRepeaters\n•\nDigital equipment\n•\nPortable Radios\n•\nWireless phones\nPerform the following tasks:\n•\nProvide pre-arrival information to receiving\nfacility to dispatch\n•\nNotify dispatch that EMS is at the receiving\nfacility\n•\nEndorse patient care report to the medical\nauthority at the receiving facility\n•\nRelay departure time from the receiving\nfacility to the dispatcher.\n•\nDemonstrate basic communication skills\n(encoding, decoding, feedback)\n• Lecture\n• Group Discussion\n• Demonstration\n• Role Play\n• Written Test\n• Oral Evaluation\n• Interview\n• Observation\n12 hours\n\n--- PDF PAGE 228 ---\nTR – Emergency Medical Services NC III Revision 00 Promulgated (10/13/2020)) 224\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n•\nDemonstrate basic communication\nresponse skills (clarification, summary,\nexplanation, silence)\n•\nDemonstrate effective patient handover\ncommunication skills\n\n--- PDF PAGE 229 ---\nTR – Emergency Medical Services NC III Revision 00 Promulgated (10/13/2020) 225\n3.2 TRAINING DELIVERY\n\n1. The delivery of training shall adhere to the design of the curriculum. Delivery shall\nbe guided by the principles of competency based TVET.\n\na. Course design is based on competency standards set by the industry or\nrecognized industry sector; (Learning system is driven by competencies\nwritten to industry standards)\nb. Training delivery is learner-centered and should accommodate individualized\nand self-paced learning strategies;\nc. Training can be done on actual workplace setting, simulation of a workplace\nand/or through adoption of modern technology;\nd. Assessment is based in the collection of evidence of the performance of work\nto the industry required standards;\ne. Assessment of competency takes the trainee’s knowledge and attitude into\naccount but requires evidence of actual performance of the competency as\nthe primary source of evidence;\nf. Training program allows for Recognition of Prior Learning (RPL) or current\ncompetencies;\ng. Training completion is based on satisfactory performance of all specified\ncompetencies.\n\n2. The competency – based TVET system recognizes various types of delivery\nmodes, both on and off-the-job as long as the learning is driven by the competency\nstandards specified by the industry. The following training modalities and their\nvariations/components may be adopted singly or combination with other modalities\nwhen designing and delivering training programs:\n\n 2.1 Institution-Based:\n\n•\nDual Training System (DTS)/Dualized training Program (DTP) which\ncontain both in-school and in-industry training or fieldwork components.\nDetails can be referred to the Implementing Rules and Regulations of\nthe DTS Law and the TESDA Guidelines on the DTP;\n\n•\nDistance learning is formal education process in which majority of the\ninstruction occurs when the students and instructor are not in the same\nplace. Distance learning may employ correspondence study, audio,\nvideo, computer technologies or other modern technology that can be\nused to facilitate learning and formal and non-formal training. Specific\nguidelines on this mode shall be issued by the TESDA Secretariat.\n\n•\nThe traditional classroom-based or in-center instruction may be\nenhanced through use of learner-centered methods as well as\nlaboratory or field-work components.\n\n--- PDF PAGE 230 ---\nTR – Emergency Medical Services NC III Revision 00 Promulgated (10/13/2020)) 226\n\n2.2 Enterprise-Based:\n\n• Formal Apprenticeship – Training within employment involving a\ncontract between an apprentice and an enterprise on an approved\napprentice able occupation.\n\n• Informal Apprenticeship – is based on training (and working) agreement\nbetween an apprentice and a master craftsperson wherein the\nagreement may be written or oral and the master craftsperson commits\nto training the apprentice in all the skills relevant to his or her trade over\na significant period of time, usually between one and four years, while\nthe apprentice commits to contributing productively to the work of the\nbusiness. Training is integrated into the production process and\napprentices learn by working alongside the experienced craftsperson.\n\n• Enterprise-based Training – where training is implemented within the\ncompany in accordance with the requirements of the specific company.\nSpecific guidelines on this mode shall be issued by the TESDA\nSecretariat.\n\n2.3 Community-Based – short term programs conducted by Non-\nGovernment Organizations (NGOs), LGUs, training centers and other\nTVET providers which are intended to address the specific needs of a\ncommunity. Such programs can be conducted in informal settings such\nas barangay hall, basketball courts, etc. These programs can also be\nMobile Training Programs (MTP).\n\n3.3 TRAINEE ENTRY REQUIREMENTS:\n\nTrainees or students wishing to enroll in this qualification must possess the\nfollowing requirements:\n\n• Completed at least ten (10) years of basic education or Holder of Alternative\nLearning System (ALS) certificate of completion with grade ten (10) equivalent;\n• At least 18 years old;\n• Must possess good communication skills;\n• Physically fit*\n\n*Note: Certified by a duly licensed physician which include CBC, Urinalysis, X-ray\n\n--- PDF PAGE 231 ---\nTR – Emergency Medical Services NC III Revision 00 Promulgated (10/13/2020)) 227\n\n3.4 TOOLS, MATERIALS AND EQUIPMENT\n\nRecommended list of tools, equipment and materials for the training of 25\ntrainees for EMERGENCY MEDICAL SERVICES NC III.\n\nUp-to-date tools, materials, and equipment of equivalent functions can be used\nas alternatives. This also applies in consideration of community practices and their\navailability in the local market.\n\nTOOLS\nQTY\n UNIT\nDESCRIPTION/SPECIFICATION\n2\nUNITS\nMobile Phones\n4\nUNITS\nHandheld Portable Radio\n1\nUNIT\nBase Radio with setup (optional)\n1\nPAIR\nLaser Flare Flasher Warning Emergency Lights\n1\nUNIT\nThermometer (Thermal Scanner)\n4\nUNITS\nThermometer (Digital)\n2\nUNITS\nPulse Oxymeter\n1\nUNIT\nGlucometer\n3\nPCS\nPocket Mask\n3\nPCS\nSafety Helmets\n2\nPCS\nFull Face Motorcycle Helmet\n3\nUNITS\nGoggles\n3\nPCS\nFace Shield\n1\nPC\nRolled blanket (8 ft in length)\n2\nPCS\nSpider Strap\n3\nPCS\nBelt Type Straps\n1\nSET\nRigid Splints\n2\nPCS.\nMalleable Splint (e.g. Sam)\n1\nPC\nTraction Splint\n1\nPC\nPelvic Splint\n2\nSETS\nSlings (small, medium, large)\n1\nSET\nBandages (triangular/elastic/rolled)\n25\nPCS\nDisposable Gown\n25\nPCS\nCoverall\n1\nBOX\nDisposable Hair Net\n2\nPCS\nCervical Collar (Adjustable)\n1\nPC\nRing Cutter\n1\nPC\nTrauma Shears\n1\nPC\nExamination Penlight\n\n--- PDF PAGE 232 ---\nTR – Emergency Medical Services NC III Revision 00 Promulgated (10/13/2020)) 228\n\nEQUIPMENT\nQTY\n UNIT\nDESCRIPTION/SPECIFICATION\n2\nUNITS\nSphygmomanometer\n2\nUNITS\nStethoscope\n1\nCYL\nPortable Oxygen Cylinder (5 lbs.)\n1\nCYL\nOxygen Cylinder (20 lbs.)\n2\nUNITS\nOxygen Gauge\n1\nUNIT\nAutomated External Defibrillator (AED) Trainer\n1\nUNIT\nScoop Stretcher\n1\nUNIT\nLong Board with Head Immobilizers (Spine board)\n1\nUNIT\nShort Board\n1\nUNIT\nSpinal Immobilization Device\n1\nUNIT\nAmbulance Collapsible Stretcher (Cot/Gurney) with\nStraps\n1\nUNIT\nKendrick’s Extrication Device (KED)\n1\nSET\nEACH\nBag-Valve-Mask Device (Adult, Child, Infant)\n1\nUNIT\nSuction Machine, Portable\n1\nUNIT\nNebulizer\n1\nEACH\nBLS Mannequins (Adult, Child and Infant)\n1\nPC\nOB Mannequin (Torso, Optional)\n1\nUNIT\nStair Chair\n1\nUNIT\nAmbulance Simulator* (A mock-up patient compartment\nwith provisions of cabinet appropriate for storage of tools,\nmaterials and equipment, oxygen container storage, chair\nof responder with safety features, mobile stretcher with\nlocking system) *Refer to Annex A for a sample drawing\n1\nUNIT\nAmbulance Vehicle (owned or thru agency affiliation)\nRegistered as Type 1 with DOH\n1\nUNIT\nMultimedia Set Up for Training\n1\nUNIT\nLaptop/Desktop\n\n--- PDF PAGE 233 ---\nTR – Emergency Medical Services NC III Revision 00 Promulgated (10/13/2020)) 229\n\nMATERIALS\nQTY\n UNIT\nDESCRIPTION/SPECIFICATION\n1\nUNIT\nFirst Aid Kit\n1\nSET\nOB Kit\n1\nSET\nTrauma Kit\n1\nPC\nEyewash\n1\nPC\nThermal Blanket\n2\nPCS\nO2 Non Re-Breather Masks\n2\nPAIRS\nHeavy Duty Gloves\n1\nSET\nAmbulance Dressing Set\n1\nUNIT\nSharps Disposable Container\n1\nSET\nBasic Airway Adjuncts (Oropharyngeal and\nNasopharyngeal)\n1\nSET\nSuction Catheters (French 12, 14, 16 flexible and rigid)\n1\nBOX\nHEPA/Surgical Masks\n5\nPCS\nMouthpiece for Pocket Masks\n1\nBOX\nDisposable Gloves\n\n--- PDF PAGE 234 ---\nTR – Emergency Medical Services NC III Revision 00 Promulgated (10/13/2020) 230\nAnnex A. Ambulance Simulator Sample Design\n\n--- PDF PAGE 235 ---\nTR – Emergency Medical Services NC III Revision 00 Promulgated (10/13/2020)) 231\n\n--- PDF PAGE 236 ---\nTR – Emergency Medical Services NC III Revision 00 Promulgated (10/13/2020)) 232\n\n--- PDF PAGE 237 ---\nTR – Emergency Medical Services NC III Revision 00 Promulgated (10/13/2020)) 233\n\n3.5 TRAINING FACILITIES\n\nA. The Emergency Medical Services Learning Facility must be of concrete\nstructure. Based on class size of 25 students / trainees, the space\nrequirements for the teaching / learning and curriculum areas are as follows:\n\nSPACE REQUIREMENT\nSIZE IN\nMETERS\nAREA IN SQ.\nMETERS\nTOTAL AREA IN\nSQ. METERS\nLaboratory Area\n4 X 5\n20\n20\nTool Room and S/M storage Area\n3 X 5\n15\n15\nLearning Resources Area*\n5 X 7\n35\n35\nWash Area/Comfort Room (male &\nfemale)*\n2.5 X 4\n10\n10\nAdmin and Staff Room\n4 X 5\n20\n20\nCirculation Area**\n\n30\nTotal Workshop Area\n130 sq. m.\n\nB. An Ambulance Simulator Mock-Up is required in the laboratory area;\nC. In the absence of an institution owned ambulance unit, an affiliation to\nagencies with ambulance is required.\n\n3.6 TRAINER’S QUALIFICATION\n\n• Must be a holder of a National TVET Trainer’s Certificate (NTTC) Level I in\nEmergency Medical Services NC III\n• Must have undergone training on Emergency Medical Services NC III or any\nother similar training for Emergency Medical Technicians;\n• A college graduate either:\na. of any Allied Medical Course with at least 2 years of active EMS field\nexperience with direct patient handling and management; or\nb. a College Graduate of any course with a minimum of 3 years active\nEMS field experience with direct patient handling and management.\n\nNOTE:\nEMS field experience should be evidenced by a Certificate of\nEmployment or Service Record and one letter of recommendation from\na direct superior\n3.7 INSTITUTIONAL ASSESSMENT\n\nInstitutional assessment is undertaken by trainees to determine their\nachievement of units of competency. A certificate of achievement is issued for each\nunit of competency.\nIt is recommended that a comprehensive written examination covering the basic,\ncommon and core competencies be administered at the end of the training.\n\n--- PDF PAGE 238 ---\nTR – Emergency Medical Services NC III Revision 00 Promulgated (10/13/2020)) 234"
