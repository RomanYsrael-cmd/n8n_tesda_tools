      "source_text": "A. The Emergency Medical Services Learning Facility must be of concrete\nstructure. Based on class size of 25 students / trainees, the space\nrequirements for the teaching / learning and curriculum areas are as follows:\n\nSPACE REQUIREMENT\nSIZE IN\nMETERS\nAREA IN SQ.\nMETERS\nTOTAL AREA IN\nSQ. METERS\nLaboratory Area\n4 X 5\n20\n20\nTool Room and S/M storage Area\n3 X 5\n15\n15\nLearning Resources Area*\n5 X 7\n35\n35\nWash Area/Comfort Room (male &\nfemale)*\n2.5 X 4\n10\n10\nAdmin and Staff Room\n4 X 5\n20\n20\nCirculation Area**\n\n30\nTotal Workshop Area\n130 sq. m.\n\nB. An Ambulance Simulator Mock-Up is required in the laboratory area;\nC. In the absence of an institution owned ambulance unit, an affiliation to\nagencies with ambulance is required.\n\n3.6 TRAINER’S QUALIFICATION\n\n• Must be a holder of a National TVET Trainer’s Certificate (NTTC) Level I in\nEmergency Medical Services NC III\n• Must have undergone training on Emergency Medical Services NC III or any\nother similar training for Emergency Medical Technicians;\n• A college graduate either:\na. of any Allied Medical Course with at least 2 years of active EMS field\nexperience with direct patient handling and management; or\nb. a College Graduate of any course with a minimum of 3 years active\nEMS field experience with direct patient handling and management.\n\nNOTE:\nEMS field experience should be evidenced by a Certificate of\nEmployment or Service Record and one letter of recommendation from\na direct superior",
