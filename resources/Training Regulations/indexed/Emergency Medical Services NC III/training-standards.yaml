 and discussion on:\no Basic file-handling techniques\no Techniques in checking documents\no Techniques in editing and formatting\no Proof reading techniques\n• Use different techniques in checking\ndocuments\n• Edit and format information applying different\ntechniques\n• Proof read information applying different\ntechniques\n• Lecture\n• Group Discussion\n• Self-paced\nhandout/ module\n• Hands on\n• Demonstration\n• Oral evaluation\n• Written Test\n• Observation\n• Presentation\n1 hour\n7. Evaluate\nOccupational\nSafety And\nHealth Work\nPractices\n7.1 Interpret\nOccupational\nSafety and\nHealth practices\n• Discuss the OSH standards, principles and\nlegislations\n• Identify OSH work practices issues\n• Discuss standard safety requirements\n•\nLecture\n•\nGroup Discussion\n\n•\nWritten Exam\n•\nDemonstration\n•\nObservation\n•\nInterviews /\nQuestioning\n1.5 hours\n\n--- PDF PAGE 152 ---\nTR – Emergency Medical Services NC III Revision 00 Promulgated (10/13/2020)) 148\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n7.2 Set OSH work\ntargets\n• Discussion in actions plans that are\nnecessary in achieving the OSH target\n• Lecture\n• Group Discussion\n\n•\nWritten Exam\n•\nDemonstration\n•\nObservation\n•\nInterviews /\nQuestioning\n1 hour\n7.3 Evaluate\neffectiveness of\nOccupational\nSafety and\nHealth work\ninstructions\n• Practice evaluating safety data (Historical or\nSimulated)\n• Lecture\n• Group Discussion\n\n•\nWritten Exam\n•\nDemonstration\n•\nObservation\n•\nInterviews /\nQuestioning\n1.5 hours\n8. Evaluate\nEnvironmental\nWork\nPractices\n8.1 Interpret\nenvironmental\npractices,\npolicies and\nprocedures\n• Discussion Environmental Issues regarding\n- Water Quality\n- National and Local Government Issues\n- Safety\n- Endangered Species\n- Noise\n- Air Quality\n- Historic\n- Waste\n- Cultural\n• Updating of existing occupation practices\n• Lecture\n• Group Discussion\n• Demonstration\