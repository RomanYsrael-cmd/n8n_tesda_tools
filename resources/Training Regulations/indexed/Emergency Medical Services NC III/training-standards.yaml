st\n2 hours\n\n9.3 Apply budgeting\nand financial\nmanagement\nskills\n• Discussion on:\n- Basic cost-benefit analysis\n- Basic financial management\n- Basic financial accounting\n- Business internal controls\n• Role Play\n• Lecture Discussion\n• Group work\n• Written Test\n• Case problem\n1 hour\n\n--- PDF PAGE 154 ---\nTR – Emergency Medical Services NC III Revision 00 Promulgated (10/13/2020)) 150\n\nCOMMON COMPETENCIES\n(112 HOURS)\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n1\nImplement\nand monitor\ninfection\ncontrol\npolicies and\nprocedures\n(32 hours)\n1.1 Provide\ninformation to\nthe work group\nabout the\norganization's\ninfection control\npolicies and\nprocedures\n•\nLecture and discussion on:\n-\nUse of personal protective equipment\n(PPE)\n-\nTransmission of infectious diseases\n-\nConcepts and modes of communication\n-\nCommunication equipment (computer,\ntelephone, cell phone etc.)\n-\nOSH, infection control, environmental and\ninstitutional, rules, guidelines, policies and\nprocedures\n-\nRespecting for patient / client rights\n-\nLiteracy levels and communication skills\nof work group members and consequent\nsuitable communication techniques\n•\nDemonstrate proper use of personal\nprotective equipment (PPE)\n•\nDemonstrate proper hand washing (WHO\nStandard)\n•\nApply Body Substance Isolation (BSI) by\nusing PPE (Personal Protective\nEquipment)\n•\nDemonstrate use of disinfectant\n•\nApply social distancing\n•\nDemonstrate operating equipment for\ncommunication\n•\nApply effective communicating and\ninterpersonal skills including:\n-\nlanguage competence\n• Lecture (online /\nface to face)\n• Discussion (online /\nface to face)\n• Self-Learning\n• Video Presentation\n(offline / face to\nface)\n• Demonstration\n• Role play\n\n• Written test (online\n/ face to face)\n• Interview\n• Portfolio\nassessment\n• Observation\n• Demonstration\nwith questioning\n12 hours\n\n--- PDF PAGE 155 ---\nTR – Emergency Medical Services NC III Revision 00 Promulgated (10/13/2020)) 151\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n-\nliteracy and reading competence\n-\nnegotiating Skills\n-\nintra and Interpersonal skills\n1.2 Integrate the\norganization's\ninfection control\npolicy and\nprocedure into\nwork practices\n•\nLecture and discussion on:\n-\nUse of verbal and non-verbal therapeutic\ncommunication\n-\nRA 11058 – OSH Law\n-\nRA 9008 – Ecological Solid Waste\nManagement Act\n-\nRA 856 – Sanitation Code of the Phil.\n-\nHazards and infectious risk\n-\nSafe work procedures\n-\nUse of computer for documentation and\nreporting\n•\nDemonstrate appropriate wearing, removal\nand disposal of PPE (Personal Protective\nEquipment)\n•\nEncourage employees to report hazards\nand risks in the work place\n•\nRecognize suggestions of employees to\nimprove infection control practices\n• Lecture (online /\nface to face)\n• Discussion (online /\nface to face)\n• Self-Learning\n• Video Presentation\n(offline / face to\nface)\n• Demonstration\n• Role play\n\n• Written test (online\n/ face to face)\n• Interview\n• Portfolio\nassessment\n• Observation\n• Demonstration\nwith questioning\n12 hours\n\n1.3 Monitor infection\ncontrol\nperformance and\nimplement\nimprovements in\npractices\n•\nLecture and discussion on:\n-\nKey performance indicators of infection\ncontrol and prevention\n-\nMonitoring, surveillance and investigation\nof infection risks and hazardous events\n-\nAggregate infection control information\nreports\n•\nDemonstrate identification, correction and\nreporting inadequacies in work procedures\nand infection control measures\n• Lecture (online /\nface to face)\n• Discussion (online /\nface to face)\n• Self-Learning\n• Video Presentation\n(offline / face to\nface)\n• Demonstration\n• Written test\n(online / face to\nface)\n• Interview\n• Portfolio\nassessment\n• Demonstration\nwith oral\nquestioning\n8 hours\n\n--- PDF PAGE 156 ---\nTR – Emergency Medical Services NC III Revision 00 Promulgated (10/13/2020)) 152\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n2. Respond\neffectively to\ndifficult/\nchallenging\nbehavior\n(24 hours)\n2.1 Plan responses\n•\nLecture and discussion on:\n-\nConcepts and modes of communication\n-\nEnvironmental and institutional, rules,\nguidelines, policies and procedures\n-\nIssues relating to difficult and challenging\nbehavior\n-\nPatient / client issues which need to be\nreferred to an appropriate health\nprofessional\n-\nPolicies and rules of health professionals\ninvolved with the care of patient / client\n-\nLiteracy levels and communication skills\nof work group members and consequent\nsuitable communication techniques\n-\nModes of verbal, non-verbal, and written\ncommunication\n•\nApply thinking and responding quickly and\nstrategically\n•\nRemain alert to potential incidents of\ndifficult or challenging behavior\n•\nDemonstrate working with others and\ndisplay empathy with patient / client and\nrelatives\n•\nApply intra and interpersonal skills\n•\nDemonstrate reporting and documentation\nwith accuracy\n• Lecture (online /\nface to face)\n• Discussion (online /\nface to face)\n• Self-Learning\n• Video Presentation\n(offline / face to\nface)\n• Demonstration\n• Written test\n(online / face to\nface)\n• Interview\n• Portfolio\nassessment\n• Demonstration\nwith oral\nquestioning\n12 hours\n2.2 Apply response\n•\nLecture and discussion on:\n-\nSuitable communication techniques to\nachieve the desired outcomes in\nresponding to difficult or challenging\nbehavior\n• Lecture (online /\nface to face)\n• Discussion (online /\nface to face)\n• Self-Learning\n• Written test (online\n/ face to face)\n• Interview\n• Portfolio\nassessment\n8 hours\n\n--- PDF PAGE 157 ---\nTR – Emergency Medical Services NC III Revision 00 Promulgated (10/13/2020)) 153\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n•\nApply thinking and responding quickly and\nstrategically\n•\nRemain alert to potential incidents of\ndifficult or challenging behavior\n•\nDemonstrate working with others and\ndisplay empathy with patient / client and\nrelatives\n•\nApply intra and interpersonal skills\nDemonstrate reporting and documentation\nwith accuracy\n• Video Presentation\n(offline / face to\nface)\n• Demonstration\n• Role play\n\n• Observation\n• Demonstration\nwith questioning\n2.3 Report and\nreview incidents\n•\nLecture and discussion about the concepts\nof incident reports and documentations\n•\nOutline organizational policies in reporting\nand reviewing workplace incidents\n•\nMake use of questioning and debriefing\ntechniques\n•\nDemonstrate appropriate incident reporting\nand documenting in the workplace\n• Lecture\n• Demonstration\n\n• Written test\n• Demonstration\n\n4 hours\n3. Apply basic\nfirst aid\n(24 hours)\n\n3.1 Assess the\nsituation\n•\nDiscuss and explain basic anatomy and\nphysiology (parts of the human body)\n•\nClassify the mode of communication in an\nassessing the situation\n•\nDiscuss and explain first aid principles\n•\nDiscuss, identify and explain the use of\nequipment (BP apparatus, pulse oxymeter,\ndigital thermometer etc.)\n•\nDiscuss and explain OSH, infection control,\nenvironmental and institutional, rules,\nguidelines, policies and procedures\n• Lecture (online /\nface to face)\n• Discussion (online /\nface to face)\n• Self-Learning\n• Video Presentation\n(offline / face to\nface)\n• Demonstration\n• Role play\n\n• Written test (online\n/ face to face)\n• Interview\n• Portfolio\nassessment\n• Observation\n• Demonstration\nwith questioning\n8 hours\n\n--- PDF PAGE 158 ---\nTR – Emergency Medical Services NC III Revision 00 Promulgated (10/13/2020)) 154\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n•\nDiscuss and explain reporting,\ndocumentation and use of non-verbal and\nverbal communication\n•\nIdentify the abnormal vital signs of patient /\nclient\n•\nIdentify the mode of communication\n•\nMake use of appropriate modes of\ncommunication\n•\nDemonstrate resuscitation skills\n•\nUtilize operating equipment as required for\nthe assessment of patient / client\n•\nApply safe manual handling of casualty\n•\nAdapt OSH, infection control,\nenvironmental and institutional, rules,\nguidelines, policies and procedures\n•\nReporting preparation\n•\nMake use of intra and Interpersonal skills\n•\nDemonstrate appropriate incident reporting\nand documenting\n3.2 Apply basic first\naid techniques\n•\nLecture and discussion about training\napplication of first aid\n•\nDiscuss and explain the proper use of\nequipment for first aid response (ambubag,\noxygen etc.)\n•\nCompare the normal and abnormal vital\nsigns\n•\nAnalyze the needs for first aid\n•\nDemonstrate first aid procedures\n•\nUtilize operating equipment as required for\nthe assessment of patient / client\n• Lecture (online /\nface to face)\n• Discussion (online /\nface to face)\n• Self-Learning\n• Video Presentation\n(offline / face to\nface)\n• Demonstration\n• Role play\n\n• Written test\n(online / face to\nface)\n• Interview\n• Portfolio\nassessment\n• Observation\n• Demonstration\nwith questioning\n12 hours\n\n--- PDF PAGE 159 ---\nTR – Emergency Medical Services NC III Revision 00 Promulgated (10/13/2020)) 155\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n•\nIllustrate OHS, infection control,\nenvironmental and institutional, rules,\nguidelines, policies and procedures\n•\nMake use of verbal and non-verbal\ncommunication\n•\nMake use of intra and interpersonal skills\n•\nDemonstrate appropriate incident reporting\nand documenting\n3.3 Communicate\ndetails of the\nincident\n•\nLecture and discussion about concepts of\ncommunication in an accident/incident\nsituation\n•\nRead and explain the use of equipment for\ncommunication (computer, cellphone,\nradio, network, etc.)\n•\nClassify the mode of communication in an\naccident/incident situation\n•\nSelect appropriate tools, supplies and\nequipment in communication\n•\nMake use of intra and interpersonal skills\n•\nDemonstrate appropriate communication\nskills reporting and documenting\n• Lecture (online /\nface to face)\n• Discussion (online /\nface to face)\n• Self-Learning\n• Video Presentation\n(offline / face to\nface)\n• Demonstration\n• Role play\n\n• Written test\n(online / face to\nface)\n• Interview\n• Portfolio\nassessment\n• Observation\n• Demonstration\nwith questioning\n4 hours\n\n--- PDF PAGE 160 ---\nTR – Emergency Medical Services NC III Revision 00 Promulgated (10/13/2020)) 156\n\n4. Maintain high\nstandards of\npatient / client\nservices\n(32 hours)\n4.1 Communicate\nappropriately\nwith patients /\nclients\n•\nLecture and discussion on:\n-\nMathematical operations such as\naddition, subtraction, division,\nmultiplication\n-\nConcepts on modes of communication\n-\nEquipment needed for communication\n(computer, cell phone, and other forms of\nmedia)\n-\nRoles and responsibilities of self and\nother workers within the organization\n-\nOrganizational / institutional policies and\nprocedures for privacy and confidentiality\nof information provided by patients /\nclients and others\n-\nInstitutional policy on patient / client rights\nand responsibilities\n-\nReporting and documentation with\naccuracy\n•\nApply mathematical operations such as\naddition, subtraction, division, multiplication\n•\nRead and understand client handling and\ninteraction\n•\nDefine concepts and mode of\ncommunication\n•\nDemonstrate following instructions and\nguidance of health professionals involved\nwith the care of patient / client\n•\nShow how to deal with conflict\n•\nParticipate in the discussion of client\nhandling and interaction\n•\nParticipate in the demonstration in\ncommunicating properly with different types\nof clients, and of different nationalities\n•\nParticipate in the demonstration in\ndelivering correct information to the client\n• Lecture (online /\nface to face)\n• Discussion (online /\nface to face)\n• Self-Learning\n• Video Presentation\n(offline / face to\nface)\n• Demonstration\n• Role play\n\n• Written test\n(online / face to\nface)\n• Interview\n• Portfolio\nassessment\n• Observation\n• Demonstration\nwith questioning\n12 hours\n\n--- PDF PAGE 161 ---\nTR – Emergency Medical Services NC III Revision 00 Promulgated (10/13/2020)) 157\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n•\nDemonstrate empathy with patient / client\nand relatives\n•\nApply intra and Interpersonal skills\n\n--- PDF PAGE 162 ---\nTR – Emergency Medical Services NC III Revision 00 Promulgated (10/13/2020)) 158\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n4.2 Establish and\nmaintain good\ninterpersonal\nrelationship\nwith patients /\nclients\n•\nLecture and discussion on:\n-\nCultural differences of patient / client\nincluding rules and policies as necessary\n-\nInstitutional policy on patient / client rights\nand responsibilities\n-\nManagement of conflict\n•\nIdentify the mode on communication\nappropriate for the situation\n•\nEstablish and maintain relationships, taking\ninto account individual differences\n•\nFollow the instructions and guidance of\nhealth professionals involved with the care\nof patient / client\n•\nShow how to respect patient / client rights\n•\nUse effective listening techniques\n•\nApply appropriate verbal and non-verbal\ncommunication styles\n•\nApply oral and written communication\n•\nDemonstrate working with others and\ndisplaying empathy with patient / client and\nrelatives\n•\nApply conflict management\n•\nApply intra and I