      "source_text": "TESDA shall provide the training on the development of competency-based\ncurricula to enable training providers develop their own curricula with the components\nmentioned below.\n\nDelivery of knowledge requirements for the basic, common and core units of\ncompetency\nspecifically\nin\nthe\nareas\nof\nmathematics,\nscience/technology,\ncommunication/language and other academic subjects shall be contextualized. To this\nend, TVET providers shall develop a Contextual Learning Matrix (CLM) to accompany\nthe curricula.\n\nCourse Title:\nEMERGENCY MEDICAL\nSERVICES\nNC Level: NC III\n\nNominal Training Duration:\n\n40 hours\nBasic Competencies\n\n112 hours\nCommon Competencies\n\n528 hours\nCore Competencies\n\n680 hours\n\n264 hours\nSupervised Industry Learning (SIL)\n\n944 hours TOTAL\n\nCourse Description:\n\nThis course is designed to provide the learner with knowledge, practical skills\nand attitude, applicable in performing work activities involve in carrying out response\nintegration and coordination in a mass casualty incident, performing patient\nassessment, providing emergency care for suspected spine injury, providing pre-\nhospital intervention for trauma patients, providing intervention for shock patients,\nproviding pre-hospital intervention for medical patients, providing basic life support and\nuse of airway adjuncts, providing pre-hospital intervention for special patient\npopulations, performing patient packaging, conducting patient transport and delivering\nbasic pre-hospital communication skills.\nUpon completion of the course, the learners are expected to demonstrate the\nabove-mentioned competencies to be employed. To obtain this, all units prescribed for\nthis qualification must be achieved.\n\n--- PDF PAGE 143 ---\nTR – Emergency Medical Services NC III Revision 00 Promulgated (10/13/2020) 139\nBASIC COMPETENCIES\n(40 HOURS)\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n1. Lead workplace\ncommunication\n1.1 Communicate\ninformation\nabout workplace\nprocesses\n• Read\no Effective verbal communication methods\no Sources of information\n• Practice organizing information\n• Identify organization requirements for written\nand electronic communication methods\n• Follow organization requirements for the use\nof written and electronic communication\nmethods\n• Perform exercises on understanding and\nconveying intended meaning scenario\n• Lecture\n• Demonstration\n• Practical exercises\n• Role Play\n• Written Test\n• Observation\n2 hours\n\n1.2 Lead workplace\ndiscussions\n• Describe:\no Organizational policy on production,\nquality and safety\no Goals/ objectives and action plan setting\n• Read\no Effective verbal communication methods\n• Prepare/set action plans based on\norganizational goals and objectives\n• Group discussion\n• Lecture\n• Demonstration\n• Oral evaluation\n• Written Test\n• Observation\n2 hours\n\n1.3 Identify and\ncommunicate\nissues arising in\nthe workplace\n• Describe:\no Organizational policy in dealing with\nissues and problems\n• Read\n• Effective verbal communication methods\n• Group discussion\n• Lecture\n• Oral evaluation\n• Written Test\n2 hours\n2. Lead small\nteams\n2.1 Provide team\nleadership\n\n• Discussion of Company policies and\nprocedures\n• Read web pages on situational leadership\n• Role play on situational leadership\n•\nGroup work\n•\nRole Play\n•\nLecture/ Discussion\n•\nIndividual Work\n• Role Play\n• Written Test\n\n1 hour\n\n--- PDF PAGE 144 ---\nTR – Emergency Medical Services NC III Revision 00 Promulgated (10/13/2020)) 140\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n2.2 Assign\nresponsibilities\n• Read web pages on performance\nmanagement\n• Case study on allocating roles and\nresponsibilities based on competencies of\ncurrent staff\n\n• Individual Work\n• Case Study\n• Role Play\n• Written Test\n\n1 hour\n2.3 Set\nperformance\nexpectations for\nteam members\n• Role play to communicate performance\nexpectations with staff\n• Discussion on performance issues\n\n• Lecture/ Discussion\n• Role Play\n• Role Play\n• Written Test\n\n1 hour\n2.4 Supervise team\nperformance\n• Discussion on performance monitoring\n• Role play on providing feedback on\nperformance\n• Role play on performance coaching\n• Discussion on keeping the team informed of\nteam performance\n• Case study on Team performance monitoring\nand feedback\n• Lecture/ Discussion\n• Role Play\n• Case Study\n• Role Play\n• Written Test\n\n1 hour\n3. Apply critical\nthinking and\nproblem-\nsolving\ntechniques in\nthe workplace\n\n3.1 Examine specific\nworkplace\nstrategies\n\n• Show thorough knowledge and\nunderstanding of the process, normal\noperating parameters, and product quality to\nrecognize non-standard situations\n• Show mastery of the current industry\nhardware and software products and services\n• Discuss process of identification of\nfundamental causes of specific workplace\nchallenges\n• Show mastery of knowledge and\nunderstanding of the process, normal\noperating parameters, and product quality to\nrecognize non-standard situations\n• Group discussion\n• Lecture\n• Demonstration\n• Role playing\n• Case Formulation\n• Life Narrative\nInquiry (Interview)\n• Standardized test\n1 hour\n\n--- PDF PAGE 145 ---\nTR – Emergency Medical Services NC III Revision 00 Promulgated (10/13/2020)) 141\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\n- Relevant equipment and operational\nprocesses\n- Enterprise goals, targets and measures\n- Enterprise quality OHS and\nenvironmental requirement\n- Enterprise information systems and data\ncollation\n- Industry codes and standards\n3.2 Analyze the\ncauses of\nspecific\nworkplace\nchallenges\n\n• Show thorough knowledge and\nunderstanding of the process, normal\noperating parameters, and product quality to\nrecognize non-standard situations\n• Show mastery of the current industry\nhardware and software products and services\n• Discuss process of identification of\nfundamental causes of specific workplace\nchallenges\n• Show mastery of knowledge and\nunderstanding of the process, normal\noperating parameters, and product quality to\nrecognize non-standard situations\n- Relevant equipment and operational\nprocesses\n- Enterprise goals, targets and measures\n- Enterprise quality OHS and\nenvironmental requirement\n- Enterprise information systems and data\ncollation\n- Industry codes and standards\n• Identify extent and causes of specific\nchallenges in the workplace\n• Use of range of analytical problem-solving\ntechniques\n• Group discussion\n• Lecture\n• Demonstration\n• Role playing\n• Case Formulation\n• Life Narrative\nInquiry (Interview)\n• Standardized test\n1 hour\n\n--- PDF PAGE 146 ---\nTR – Emergency Medical Services NC III Revision 00 Promulgated (10/13/2020)) 142\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n• Formulate clear-cut findings on the nature of\neach identified workplace challenges\n3.3 Formulate\nresolutions to\nspecific\nworkplace\nchallenges\n\n• Show thorough knowledge and\nunderstanding of the process, normal\noperating parameters, and product quality to\nrecognize non-standard situations\n• Show mastery of the current industry\nhardware and software products and services\n• Discuss process of identification of\nfundamental causes of specific workplace\nchallenges\n• Show mastery of knowledge and\nunderstanding of the process, normal\noperating parameters, and product quality to\nrecognize non-standard situations\n- Relevant equipment and operational\nprocesses\n- Enterprise goals, targets and measures\n- Enterprise quality OHS and\nenvironmental requirement\n- Enterprise information systems and data\ncollation\n- Industry codes and standards\n• Identify extent and causes of specific\nchallenges in the workplace\n• Use of range of analytical problem-solving\ntechniques\n• Formulate clear-cut findings on the nature of\neach identified workplace challenges\n• Discus strategies on devising,\ncommunicating, implementing and evaluating\nstrategies and techniques in addressing\nspecific workplace challenges\n• Group discussion\n• Lecture\n• Demonstration\n• Role playing\n• Case Formulation\n• Life Narrative\nInquiry (Interview)\n• Standardized test\n1 hour\n\n--- PDF PAGE 147 ---\nTR – Emergency Medical Services NC III Revision 00 Promulgated (10/13/2020)) 143\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n3.4 Implement\naction\nplans and\ncommunicate\nresults\n• Identify extent and causes of specific\nchallenges in the workplace\n• Use of range of analytical problem-solving\ntechniques\n• Formulate clear-cut findings on the nature of\neach identified workplace challenges\n• Discus strategies on devising,\ncommunicating, implementing and evaluating\nstrategies and techniques in addressing\nspecific workplace challenges\n• Group discussion\n• Lecture\n• Demonstration\n• Role playing\n• Case Formulation\n• Life Narrative\nInquiry (Interview)\n• Standardized test\n1 hour\n4. Work in a\ndiverse\nenvironment\n\n4.1 Develop an\nindividual’s\ncultural\nawareness and\nsensitivity\n• Show understanding of cultural diversity in\nthe workplace\n• Recognize norms of behavior for interacting\nand dialogue with specific groups (e. g.,\nMuslims and other non-Christians, non-\nCatholics, tribes/ethnic groups, foreigners)\n• Demonstrate different methods of verbal and\nnon-verbal communication in a multicultural\nsetting\n• Apply cross-cultural communication skills (i.e.\ndifferent business customs, beliefs,\ncommunication strategies)\n• Show affective skills – establishing rapport\nand empathy, understanding, etc.\n• Demonstrate openness and flexibility in\ncommunication\n• Recognize diverse groups in the workplace\nand community as defined by divergent\nculture, religion, traditions and practices\n• Small Group\nDiscussion\n• Interactive Lecture\n• Brainstorming\n• Demonstration\n• Role-playing\n• Demonstration or\nsimulation with oral\nquestioning\n• Group discussions\nand interactive\nactivities\n• Case studies/\nproblems involving\nworkplace diversity\nissues\n• Written\nexamination\n• Role Playing\n1 hour\n\n--- PDF PAGE 148 ---\nTR – Emergency Medical Services NC III Revision 00 Promulgated (10/13/2020)) 144\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n4.2 Work effectively\nin an\nenvironment\nthat\nacknowledges\nand values\ncultural diversity\n• Explain the value of diversity in the economy\nand society in terms of Workforce\ndevelopment\n• Discuss the importance of inclusiveness in a\ndiverse environment\n• Discuss the importance of shared vision and\nunderstanding of and commitment to team,\ndepartmental, and organizational goals and\nobjectives\n• Identify and exhibit strategies for customer\nservice excellence\n• Demonstrate cross-cultural communication\nskills and active listening\n• Recognize diverse groups in the workplace\nand community as defined by divergent\nculture, religion, traditions and practices\n• Demonstrate collaboration skills\n• Small Group\nDiscussion\n• Interactive Lecture\n• Brainstorming\n• Demonstration\n• Role-playing\n• Demonstration or\nsimulation with oral\nquestioning\n• Group discussions\nand interactive\nactivities\n• Case studies/\nproblems involving\nworkplace diversity\nissues\n• Written\nexamination\n• Role Playing\n1 hour\n4.3 Identify common\nissues in a\nmulticultural and\ndiverse\nenvironment\n• Explain the value, and leverage of cultural\ndiversity\n• Discuss the inclusivity and conflict resolution\n• Describe the workplace harassment\n• Explain the change management and cite\nways to overcome resistance to change\n• Demonstrate advanced strategies for\ncustomer service excellence\n• Address diversity-related conflicts in the\nworkplace\n• Eliminate discriminatory behavior towards\ncustomers and co-workers\n• Utilize change management policies in the\nworkplace\n• Small Group\nDiscussion\n• Interactive Lecture\n• Brainstorming\n• Demonstration\n• Role-playing\n• Demonstration or\nsimulation with oral\nquestioning\n• Group discussions\nand interactive\nactivities\n• Case studies/\nproblems involving\nworkplace diversity\nissues\n• Written\nexamination\n• Role Playing\n1 hour\n\n--- PDF PAGE 149 ---\nTR – Emergency Medical Services NC III Revision 00 Promulgated (10/13/2020)) 145\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n5. Propose\nmethods of\napplying\nlearning and\ninnovation in\nthe organization\n5.1 Assess work\nprocedures,\nprocesses and\nsystems in\nterms of\ninnovative\npractices\n\n• Show mastery of the following practical\nconcepts (e.g., 7 habits of highly effective\npeople, character strengths that foster\nlearning and innovation, five minds of the\nfuture, adaptation concepts and\ntranstheoretical model of behavior change)\n• Demonstrate collaboration and networking\nskills\n• Show basic skills in research\n• Generate practical insights on how to\nimprove organizational procedures,\nprocesses and systems\n\n• Interactive Lecture\n• Appreciative Inquiry\n• Demonstration\n• Group work\n• Psychological and\nbehavioral\nInterviews\n• Performance\nEvaluation\n• Life Narrative\nInquiry\n• Review of\nportfolios of\nevidence and third-\nparty workplace\nreports of on-the-\njob performance.\n• Standardized\nassessment of\ncharacter strengths\nand virtues applied\n5.2 Generate\npractical action\nplans for\nimproving work\nprocedures,\nprocesses\n• Show mastery of the following practical\nconcepts (e.g., 7 habits of highly effective\npeople, character strengths that foster\nlearning and innovation, five minds of the\nfuture, adaptation concepts and\ntranstheoretical model of behavior change)\n• Demonstrate collaboration and networking\nskills\n• Show basic skills in research\n• Generate practical insights on how to\nimprove organizational procedures,\nprocesses and systems\n• Set up action plans on how to apply\ninnovative procedures in the organization\n• Set up action plans on how to apply\ninnovative procedures in the organization\n• Interactive Lecture\n• Appreciative Inquiry\n• Demonstration\n• Group work\n• Psychological and\nbehavioral\nInterviews\n• Performance\nEvaluation\n• Life Narrative\nInquiry\n• Review of\nportfolios of\nevidence and third-\nparty workplace\nreports of on-the-\njob performance.\n• Standardized\nassessment of\n1 hour\n2 hours\n\n--- PDF PAGE 150 ---\nTR – Emergency Medical Services NC III Revision 00 Promulgated (10/13/2020)) 146\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n• Generate practical insights on how to\nimprove organizational procedures,\nprocesses and systems\ncharacter strengths\nand virtues applied\n5.3 Evaluate the\neffectiveness of\nthe proposed\naction plans\n• Show mastery of the following practical\nconcepts (e.g., 7 habits of highly effective\npeople, character strengths that foster\nlearning and innovation, five minds of the\nfuture, adaptation concepts and\ntranstheoretical model of behavior change)\n• Demonstrate collaboration and networking\nskills\n• Show basic skills in research\n• Generate practical insights on continuous\nimprovement\n• Interactive Lecture\n• Appreciative Inquiry\n• Demonstration\n• Group work\n• Psychological and\nbehavioral\nInterviews\n• Performance\nEvaluation\n• Life Narrative\nInquiry\n• Review of\nportfolios of\nevidence and third-\nparty workplace\nreports of on-the-\njob performance.\n• Standardized\nassessment of\ncharacter strengths\nand virtues applied\n6. Use\ninformation\nsystematically\n\n6.1 Use technical\ninformation\n• Lecture and discussion on:\no Application in collating information\no Procedures for inputting, maintaining and\narchiving information\no Guidance to people who need to find and\nuse information\n• Organizing information into a suitable form\nfor reference and use\n• Classify stored information for identification\nand retrieval\n• Operate the technical information system by\nusing agreed procedures\n• Lecture\n• Group Discussion\n• Hands on\n• Demonstration\n• Oral evaluation\n• Written Test\n• Observation\n• Presentation\n4 hours\n1 hour\n\n--- PDF PAGE 151 ---\nTR – Emergency Medical Services NC III Revision 00 Promulgated (10/13/2020)) 147\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n6.2 Apply\ninformation\ntechnology (IT)\n• Lecture and discussion on:\no Attributes and limitations of available\nsoftware tool\no Procedures and work instructions for the\nuse of IT\no Operational requirements for IT systems\no Sources and flow paths of data\no Security systems and measures that can\nbe used\no Methods of entering and processing\ninformation\n• Use procedures and work instructions for the\nuse of IT\n• Extract data and format reports\n• Use WWW applications\n• Lecture\n• Group Discussion\n• Self-paced handout/\nmodule\n• Hands on\n• Demonstration\n• Oral evaluation\n• Written Test\n• Observation\n• Presentation\n2 hours\n6.3 Edit, format and\ncheck\ninformation\n• Lecture and discussion on:\no Basic file-handling techniques\no Techniques in checking documents\no Techniques in editing and formatting\no Proof reading techniques\n• Use different techniques in checking\ndocuments\n• Edit and format information applying different\ntechniques\n• Proof read information applying different\ntechniques\n• Lecture\n• Group Discussion\n• Self-paced\nhandout/ module\n• Hands on\n• Demonstration\n• Oral evaluation\n• Written Test\n• Observation\n• Presentation\n1 hour\n7. Evaluate\nOccupational\nSafety And\nHealth Work\nPractices\n7.1 Interpret\nOccupational\nSafety and\nHealth practices\n• Discuss the OSH standards, principles and\nlegislations\n• Identify OSH work practices issues\n• Discuss standard safety requirements\n•\nLecture\n•\nGroup Discussion\n\n•\nWritten Exam\n•\nDemonstration\n•\nObservation\n•\nInterviews /\nQuestioning\n1.5 hours\n\n--- PDF PAGE 152 ---\nTR – Emergency Medical Services NC III Revision 00 Promulgated (10/13/2020)) 148\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n7.2 Set OSH work\ntargets\n• Discussion in actions plans that are\nnecessary in achieving the OSH target\n• Lecture\n• Group Discussion\n\n•\nWritten Exam\n•\nDemonstration\n•\nObservation\n•\nInterviews /\nQuestioning\n1 hour\n7.3 Evaluate\neffectiveness of\nOccupational\nSafety and\nHealth work\ninstructions\n• Practice evaluating safety data (Historical or\nSimulated)\n• Lecture\n• Group Discussion\n\n•\nWritten Exam\n•\nDemonstration\n•\nObservation\n•\nInterviews /\nQuestioning\n1.5 hours\n8. Evaluate\nEnvironmental\nWork\nPractices\n8.1 Interpret\nenvironmental\npractices,\npolicies and\nprocedures\n• Discussion Environmental Issues regarding\n- Water Quality\n- National and Local Government Issues\n- Safety\n- Endangered Species\n- Noise\n- Air Quality\n- Historic\n- Waste\n- Cultural\n• Updating of existing occupation practices\n• Lecture\n• Group Discussion\n• Demonstration\n\n•\nWritten Exam\n•\nDemonstration\n•\nObservation\n•\nInterviews /\nQuestioning\n1 hour\n8.2 Establish targets\nto evaluate\nenvironmental\npractices\n• Discussion on\n-\nlower production costs and energy\nconsumption\n-\nEnvironmentally Sound Processes\n-\nResource Efficient\n-\nRecycling and Waste Management\n• Simple case study regarding energy\nefficiency\n• Lecture\n• Group Discussion\n• Demonstration\n\n• Written Exam\n• Demonstration\n• Observation\n• Interviews /\nQuestioning\n1 hour\n\n--- PDF PAGE 153 ---\nTR – Emergency Medical Services NC III Revision 00 Promulgated (10/13/2020)) 149\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n8.3 Evaluate\neffectiveness of\nenvironmental\npractices\n• Identifying effective environmental practices\nrelevant to the industry/occupation\n-\nImplementation of energy efficiency\n\n• Lecture\n• Group Discussion\n• Demonstration\n• Case Study\n\n• Written Exam\n• Demonstration\n• Observation\n• Interviews /\nQuestioning\n• Third Party\nReports\n9. Facilitate\nEntrepreneurial\nSkills for Micro-\nSmall-Medium\nEnterprises\n(MSMEs)\n9.1 Develop and\nmaintain micro-\nsmall-medium\nenterprise\n(MSMEs) skills in\nthe organization\n• Discussions on business models and\nstrategies\n• Discussion on Types and categories of\nbusinesses and business internal control\n• Discussion on Relevant National and local\nlegislations affecting businesses\n• Prepare promotional materials\n• Practice basic bookkeeping\n• Lecture/ Discussion\n• Case Study\n• Demonstration\n• Written Test\n• Portfolio\n• Work Related\nProject\n2 hours\n\n9.2 Establish and\nmaintain client-\nbase/market\n• Role play on customer and employee\nrelations\n• Discussion on Basic product promotion\nstrategies\n• Preparation of Basic Feasibility study\n• Case studies on Basic Business ethics\n• Prepare basic advertising materials\n• Role Play\n• Lecture Discussion\n• Case study\n• Case problem\n• Written Test\n2 hours\n\n9.3 Apply budgeting\nand financial\nmanagement\nskills\n• Discussion on:\n- Basic cost-benefit analysis\n- Basic financial management\n- Basic financial accounting\n- Business internal controls\n• Role Play\n• Lecture Discussion\n• Group work\n• Written Test\n• Case problem\n1 hour\n\n--- PDF PAGE 154 ---\nTR – Emergency Medical Services NC III Revision 00 Promulgated (10/13/2020)) 150\n\nCOMMON COMPETENCIES\n(112 HOURS)\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n1\nImplement\nand monitor\ninfection\ncontrol\npolicies and\nprocedures\n(32 hours)\n1.1 Provide\ninformation to\nthe work group\nabout the\norganization's\ninfection control\npolicies and\nprocedures\n•\nLecture and discussion on:\n-\nUse of personal protective equipment\n(PPE)\n-\nTransmission of infectious diseases\n-\nConcepts and modes of communication\n-\nCommunication equipment (computer,\ntelephone, cell phone etc.)\n-\nOSH, infection control, environmental and\ninstitutional, rules, guidelines, policies and\nprocedures\n-\nRespecting for patient / client rights\n-\nLiteracy levels and communication skills\nof work group members and consequent\nsuitable communication techniques\n•\nDemonstrate proper use of personal\nprotective equipment (PPE)\n•\nDemonstrate proper hand washing (WHO\nStandard)\n•\nApply Body Substance Isolation (BSI) by\nusing PPE (Personal Protective\nEquipment)\n•\nDemonstrate use of disinfectant\n•\nApply social distancing\n•\nDemonstrate operating equipment for\ncommunication\n•\nApply effective communicating and\ninterpersonal skills including:\n-\nlanguage competence\n• Lecture (online /\nface to face)\n• Discussion (online /\nface to face)\n• Self-Learning\n• Video Presentation\n(offline / face to\nface)\n• Demonstration\n• Role play\n\n• Written test (online\n/ face to face)\n• Interview\n• Portfolio\nassessment\n• Observation\n• Demonstration\nwith questioning\n12 hours\n\n--- PDF PAGE 155 ---\nTR – Emergency Medical Services NC III Revision 00 Promulgated (10/13/2020)) 151\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n-\nliteracy and reading competence\n-\nnegotiating Skills\n-\nintra and Interpersonal skills\n1.2 Integrate the\norganization's\ninfection control\npolicy and\nprocedure into\nwork practices\n•\nLecture and discussion on:\n-\nUse of verbal and non-verbal therapeutic\ncommunication