 face)\n• Discussion (online /\nface to face)\n• Self-Learning\n• Video Presentation\n(offline / face to\nface)\n• Demonstration\n• Role play\n\n• Written test\n(online / face to\nface)\n• Interview\n• Portfolio\nassessment\n• Observation\n• Demonstration\nwith questioning\n6 hours\n\n--- PDF PAGE 164 ---\nTR – Emergency Medical Services NC III Revision 00 Promulgated (10/13/2020)) 160\n\nCORE COMPETENCIES\n(528 HOURS)\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n1. Carry out\nresponse\nintegration and\ncoordination in\na mass\ncasualty\nincident\n(32 hours)\n1.1 Identify the\nincident type\nLecture and discussion on the following topics:\n• National Disaster Risk Reduction and\nManagement Council structure and policies\n• Organizational Policies and Procedures\n• Principles of incident command system\no Incident management\no EMS response structure within the\nincident command system\n• Hazards\n• Resources\n• Communication Protocols\n• Use of communication Equipment\n\nPerform the following tasks:\n• Access communications network.\n• Carry-out initial assessment of the incident\npromptly.\n• Assess and monitor hazards or potential\nhazards\n• Identify number of patients in accordance\nwith mass casualty incident protocol\n• Determine resources to deal with the\nincident.\n• Identify and request additional resources\nneeded in accordance with SOP\n• Take actions to protect, secure and\npreserve incident scene as required\n• Demonstrate communication skills\n• Access communications network\n• Use communications equipment\n• Lecture\n• Group Discussion\n• Video Viewing\n• Demonstration\n• Role Play\n• Reading Group\n• Self-Learning\n• Brainstorming\n• Written Test\n• Oral Evaluation\n• Interview\n• Observation\n4 hours\n\n--- PDF PAGE 165 ---\nTR – Emergency Medical Services NC III Revision 00 Promulgated (10/13/2020)) 161\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n• Conduct initial incident assessment\n• Follow safety protocols and guidelines\n\n1.2 Establish initial\ncontrol and\ncommand\nLecture and discussion on the following topics:\nKnowledge\n•\nOrganizational policies and policies\nprocedures\no Medical Direction\n•\nOperational briefing\n• Agency procedures for establishing control\nand communicating to relevant authorities\n• Agency protocols for liaising with\nstakeholders and media on scene\n• Republic Act 10121\n• National Disaster Response Plan\n•\nPrinciples of Basic Incident Command\nSystem\n•\nEMS response concept within the incident\ncommand system\nPerform the following tasks:\n•\nEstablish control and command in\naccordance with organizational policies\nand procedures.\n•\nReceive and implement operational\nbriefing based on Incident Action Plan\n(IAP)\n•\nProvide leadership, supervision and team\nwelfare to ensure safety and performance\non operational standards.\n•\nFollow the operational briefing in the\nIncident Action Plan (IAP)\n•\nMaintain incident situational awareness\n• Lecture/discussion\n• Demonstration\n• Group Discussion\n• Brainstorming\n• Self-Learning\n\n• Written Test\n• Oral Evaluation\n• Interview\n• Observation\n4 hours\n\n--- PDF PAGE 166 ---\nTR – Emergency Medical Services NC III Revision 00 Promulgated (10/13/2020)) 162\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\n1.3 Participate in\noperational\nresponse\nLecture and discussion on the following topics:\n•\nNational Disaster Risk Reduction and\nManagement Council Incident\nManagement System structure and\npolicies\n•\nOrganizational policies and procedures\nrelating to operations\n•\nPurpose and structure of medical incident\ncommand within the incident management\nsystem\n•\nMass casualty incident (MCI) and triage\ncategories\n•\nRisks and responsibilities of operating on\nscene of a natural or man-made disaster\n•\nDisaster management and hazardous\nmaterials\n•\nEmergency medical technician’s role under\nthe incident command system (ICS)\n•\nHazardous material incidents identification\n•\nMass casualty incidents due to terrorism\nand disaster recognition\nPerform the following tasks:\n•\nConduct operational briefings\n•\nDeploy personnel and equipment to deal\nwith the incident\n•\nPerform triage in mass casualty incident\nmanagement\n•\nInitiate start triage system\n•\nConduct jumpstart triage system for\npediatric patients\n•\nIdentify labels, placards, and markings\nused to designate hazardous materials\n• Lecture\n• Demonstration\n• Group Discussion\n\n• Oral Evaluation\n• Interview\n• Observation\n\n16 hours\n\n--- PDF PAGE 167 ---\nTR – Emergency Medical Services NC III Revision 00 Promulgated (10/13/2020)) 163\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n•\nAbility to use a variety of reference\nmaterials to identify a hazardous material\n\n1.4 Conclude\noperational task\nand perform\npost response\nactivities\nLecture and discussion on the following topics:\n• Incident situational awareness report\n• Procedures for protecting and preserving an\nincident scene and recording requirements\n• Demobilization procedures\n• Recording and schedule procedures for\nequipment cleaning, repair, storage and\nreplenishment\n• Critical incident stress debriefing\n• Briefing/ debriefing requirements and\nprotocols\n• Prepare and submit reports\n• Recommend and attend debriefing sessions\nPerform the following tasks:\n• Conduct final incident assessment\n• Record incident actions and decisions\n• Conclude and coordinate incident\n• Prepare and submit\n• Post incident reports\n• Lecture\n• Group Discussion\n• Demonstration\n• Role Play\n\n• Written Test\n• Oral Evaluation\n• Interview\n• Observation\n\n8 hours\n2. Perform patient\nassessment\n2.1 Conduct scene\nsize up\nLecture and discussion on the following topics\n• Communication for the need of additional\nresources\n• Protocols and Training for COVID-19\nguidelines\n• Call management screening procedures as\na preliminary identification for COVID-19\npatients\n• Activation and pre-notification from dispatch\n• Pre-arrival instructions from dispatch\n• Lecture\n• Group Discussion\n• Video Viewing\n• Demonstration\n\n• Written Test\n• Oral Evaluation\n• Observation\n\n3 hours\n\n--- PDF PAGE 168 ---\nTR – Emergency Medical Services NC III Revision 00 Promulgated (10/13/2020)) 164\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n• Recognition, precautions and personal\nsafety protection to environmental,\nchemical, and biological hazards present at\nan emergency scene\n• Standard precautions to be followed and\npersonal protective equipment to be worn at\nan emergency scene\n• Importance of identifying the number of\npatients in an emergency scene\n• Initiation of incident management and triage\n• Components of patient assessment process\n• Mass Casualty Incident (MCI) management\n• Different types of emergencies that an EMT\nneeds to be familiar with\no\nProcedures in determining mechanism\nof injury and nature of illness\no\nDifferentiation of trauma and non-\ntrauma patients\n• Scene safety evaluation\nPerform the following tasks:\n•\nEnsure scene safety\n•\nDetermine mechanism of injury or nature\nof illness\n•\nFollow standard precautions\n•\nFollow specific guidelines in a potential\nCOVID-19 contaminated environment\nbased on the Department of Health Policy\nand the World Health precautionary\nrecommendations\n•\nConfirm suspected patient through\ndispatch screening process based on the\nestablished EMS protocols specific to\nCOVID-19 patient handling\n\n--- PDF PAGE 169 ---\nTR – Emergency Medical Services NC III Revision 00 Promulgated (10/13/2020)) 165\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n•\nDetermine number of patients\n•\nConduct field triage based on SOP\n•\nConsider additional or specialized\nresources\n•\nPerform scene size up procedures\n•\nPerform triage procedures\n•\nProper communication techniques\n\n2.2 Perform primary\nassessment\nLecture and discussion on the following topics:\n•\nGoals of the patient assessment\n•\nIdentify and manage life threatening\nconditions\n•\nProcess of forming a general impression\n•\nThe Detect-Isolate and Report Process\n•\nPrecautionary measures to prevent\ncontamination or infection\n•\nPPE preparation appropriate for handling\npotential COVID-19 patients\n•\nHand hygiene as part of standard of care\n•\nDirect contact restrictions during patient\nengagement\n•\nImmediate transport requirement criteria\n•\nAirway assessment status in patients who\nare both responsive and unresponsive\n•\nAssessment of breathing status of the\npatient, information to obtain in the process\nand care required for both patients with\nadequate and inadequate breathing\n•\nSigns of respiratory distress and failure\n•\nAssessment of a patient’s circulatory\nstatus, different methods of obtaining pulse\nand appropriate management\n•\nAssessing for and methods for controlling\nexternal bleeding\n• Lecture\n• Group Discussion\n• Video Viewing\n• Demonstration\n• Role Play\n• Written Test\n• Oral Evaluation\n• Interview\n• Observation\n5 hours\n\n--- PDF PAGE 170 ---\nTR – Emergency Medical Services NC III Revision 00 Promulgated (10/13/2020)) 166\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n•\nSteps to identify and treat life-threatening\nconditions\n•\nSteps to follow during rapid scan of a\ntrauma patient\n•\nProcess of determining the priority of\npatient care and transport at an emergency\nscene\n•\nImportance of protecting the trauma\npatient’s spine and identify fractured\nextremities during patient packaging for\ntransport