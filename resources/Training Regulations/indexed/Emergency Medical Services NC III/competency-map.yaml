  "source_text": "SECTION 1 DEFINITION OF QUALIFICATION\n\nThe EMERGENCY MEDICAL SERVICES NC III Qualification consists of competencies\nthat a person must achieve that prepares the emergency medical technician to provide\nprehospital assessment and care for patients of all ages with a variety of medical conditions\nand traumatic injuries.\n\nThe Units of Competency comprising this Qualification include the following:\n\nUnit Code\nBASIC COMPETENCIES\n400311319\nLead workplace communication\n400311320\nLead small teams\n400311321\nApply critical thinking and problem-solving techniques in the workplace\n400311322\nWork in a diverse environment\n400311323\n\nPropose methods of applying learning and innovation in the\norganization\n400311324\nUse information systematically\n400311325\nEvaluate occupational safety and health work practices\n400311326\nEvaluate environmental work practices\n400311327\nFacilitate entrepreneurial skills for micro-small-medium enterprises\n(MSMEs)\n\nUnit Code\nCOMMON COMPETENCIES\nHHC325201\nImplement and monitor infection control policies and procedures\nHHC325202\nRespond effectively to difficult/challenging behavior\nHHC325203\nApply basic first aid\nHHC325204\nMaintain high standard of patient/client services\n\nUnit Code\nCORE COMPETENCIES\nHHC325301\nCarry out response integration and coordination in a mass casualty\nincident\nHHC325302\nPerform patient assessment\nHHC325303\nProvide emergency care for suspected spine injury\nHHC325304\nProvide pre-hospital interventions for trauma patients\nHHC325305\nProvide pre-hospital interventions for shock patients\nHHC325306\nProvide pre-hospital interventions for medical patients\nHHC325307\nPerform basic life support and use airway adjuncts\nHHC325308\nProvide pre-hospital interventions for special patient populations\nHHC325309\nPerform patient packaging\nHHC325310\nConduct patient transport\nHHC325311\nDeliver basic pre-hospital communication skills\n\nA person who has achieved this Qualification is competent to be:\n\n❑ Emergency Medical Technician\n\n--- PDF PAGE 6 ---\nTR – Emergency Medical Services NC III Revision 00 Promulgated (10/13/2020)) 2"
