  "source_text": "COMPETENCY MAP – HUMAN HEALTH/HEALTH CARE SECTOR\nEMERGENCY MEDICAL SERVICES NC III\nBASIC\nCOMPETENCIES\n\n--- PDF PAGE 242 ---\nTR – Emergency Medical Services NC III Revision 00 Promulgated (10/13/2020)) 238\n\nMaintain\ninstruments and\nequipment in\nwork area\nAssist in dental\nlaboratory\nprocedures\nAssist with\nadministration\nin dental\nlaboratory\npractice\nImplement and\nmonitor infection\ncontrol policies\nand procedures\nRespond\neffectively to\ndifficult/\nchallenging\nbehavior\nApply basic\nfirst aid\nMaintain high\nstandard of\npatient / client\nservices\nApply quality\nstandards\nMaintain a\nsafe, clean\nand efficient\nenvironment\nMaintain an\neffective\nrelationship\nwith clients/\ncustomers\n(marketing)\n\nUpdate industry\nknowledge and\npractice through\ncontinuing\neducation\nUse\npharmaceutical\ncalculation\ntechniques and\nterminologies\nMaintain an\neffective\nrelationship\nwith customers\nand clients\nManage own\nperformance\nFollow\noccupational\nhealth and\nsafety policies in\ndental laboratory\nfacilities\nMaintain\ninfection\ncontrol in\ndental\npractice\nOperate a\npersonal\ncomputer\nPerform\nworkplace\nsecurity and\nsafety\npractices\nPerform\ncomputer\noperations\n\nPrepare and\nmaintain beds\nCollect and\nmaintain linen\nstocks at end-\nusers location\nAssist in\npatient\nmobility\nAssist in\ntransporting\npatients\nAssist in bio-\npsychosocial\nsupport care of\npatients\nHandle waste\nin a health\ncare\nenvironment\nPlan the hilot\nwellness program\nof client/s\nProvide pre-\nservice to hilot\nclient/s\nApply hilot\nwellness\nmassage\ntechniques\nProvide post\nadvice and\npost-services\nto hilot clients\nPractice good\nhousekeeping\nMonitor supply/\ninventory of\npharmaceutical\nproducts\nHandle and\ncontrol\npharmaceutical\nproducts\nArrange and\ndisplay\npharmaceutical\nproducts\nPerform good\nlaboratory\npractices\nAdhere to\ngood\nmanufacturing\npractices\nDemonstrate\nproduct knowledge\non medicines\nDispense\npharmaceutical\nproducts\nPerform\nhealth\npromotion\neducation,\nvigilance\nInstall\nbiomedical\nequipment\nPerform\ncorrective\nmaintenance\non biomedical\nequipment\nPerform\npreventive\nmaintenance\non biomedical\nequipment\nRepair\nbiomedical\nequipment\nAssess and\nrefer\nbiomedical\nequipment\nDevelop\nmassage\npractice\nPerform client\nconsultation\nPerform body\nmassage and work\narea\nMaintain and\norganize tools,\nequipment,\nsupplies\nPerform basic\nlife support\nMaintain life\nsupport\nequipment and\nresources\nImplement\nsafe access\nand extrication\nprocedures in\nan emergency\nManage\nrequest for\nambulance\nservice\nAllocate\nambulance\nservice\nresources\nCoordinate\nemergency\nresources\nDeliver basic\nambulance\ncommunication\nskills\nSupervise on-\nroad\noperations\nManage the scene\nof an emergency\nManage the\nscene of a\nspecial event\nManage\nroutine scene\nDeliver pre-\nhospital patient\ncare\nCORE\nCOMPETENCIES\nCOMMON\nCOMPETENCIES\n\n--- PDF PAGE 243 ---\nTR – Emergency Medical Services NC III Revision 00 Promulgated (10/13/2020)) 239\n\nDeliver\nintensive pre-\nhospital patient\ncare\nManage\nambulance\noperations\nTransport\nemergency\npatients\nTransport non-\nemergency\npatients\nDrive vehicles\nunder\noperational\nconditions\nAssist the\nhousehold to\nidentify health\nproblems to\npromote health\nand well-being\nShare knowledge\nand skills among\nmembers to\nprovide information,\neducation and\ncommunication\n(IEC) and/or\nhousehold teaching\nin disease\nprevention and\ncontrol\nEnsure the\nproper\nmaintenance\nof health\nstation and\nsafe custody of\nits equipment,\nmedical\nsupplies,\nmaterials, and\nhealth records\nMonitor\nhealth status\nof household\nmembers\nunder his/her\narea of\nservice\ncoverage\nMaintain\nupdated\nlist/records of\nhealth\nactivities\nAnalyze and\ninterpret\nophthalmic\nlens\nprescription\nEdge and\nmount\nophthalmic\nappliances\nApply UV\ncoat/ tint to\nophthalmic\nlenses\nFabricate\nmodels\nFabricate\ncustom\nimpression\ntrays\nFabricate\nregistration\nbite rims\nArticulate models\nand transfer\nrecords\nFabricate\nmouthguard\nFabricate\nmetal crown\nand bridge\nstructures\nFabricate\nceramic\nrestorations\nFabricate\nindirect\ncomposite/\npolymer fixed\nrestorations\nJoin alloy\nstructures\nArrange\nartificial teeth\nfor complete\ndentures\nSet-up and\nwax\nremovable\npartial\ndentures\nWax, process\nand finish\nacrylic\ndentures and\nappliances\nFabricate\nthermo formed\nbases and\nappliances\nRepair and modify\ndentures and\nappliances\nFabricate oral\nsplints\nFabricate\northodontic\nappliances\nFabricate cast\nmetal\nremovable\npartial denture\nframework\nPerform oral\nexamination\nPromote oral\nhealth and\nhygiene\nOperate a\ndental\nradiographic\nequipment\nApply the\nprinciple of\nradiology\nbiology and\nprotection in\ndental practice\nPerform\nscaling and\npolishing\nMaintain\ndental records\nand resources\nProvide effective\npatient/client\nservice\nManage dental\nlaboratory\nproduction and\noperation\nPerform\nadministrative\nfunctions\nContinue\nprofessional\ngrowth and\ndevelopment\nParticipate in\nthe\nimplementation\nand monitoring\nof newborn’s\ncare plan\nDevelop the\nability to\nrecognize\nnewborn’s\ngrowth and\ndevelopment\nPerform\ncaring skills\nfor newborn\nParticipate in the\nimplementation\nand monitoring of\ninfant’s care plan\nProvide\nphysical\nneeds, care\nand support to\ninfant\nFoster social,\nintellectual and\nemotional\ndevelopment\nof infant\nParticipate in the\nimplementation and\nmonitoring of\ntoddler’s care plan\nDevelop the\nability to\nrecognize\ntoddler’s\ngrowth and\ndevelopment\nPerform\ncaring skills\nfor toddler\nParticipate in the\nimplementation\nand monitoring of\npre- schooler’s\ncare plan\nDevelop the\nability to\nrecognize pre-\nschooler’s\ngrowth and\ndevelopment\nPerform caring\nskills for pre-\nschooler\nProvide\nassistance\nand care to\npersonal\nneeds of\ngrade\nschooler\nFoster\nphysiological\nneeds and\ncognitive\ndevelopment\nof grade\nschooler\nFoster\nphysical\ngrowth and\ndevelopment\nof grade\nschooler\nRespond to\nemergency for\ngrade schooler\nFoster physical\ngrowth and\ndevelopment of\nadolescent\nPromote\ndevelopmental\ntasks for\nadolescent\nRespond to\nemergency\nfor\nadolescent\nDevelop the\nability to\nrecognize\naging process\n\n--- PDF PAGE 244 ---\nTR – Emergency Medical Services NC III Revision 00 Promulgated (10/13/2020)) 240\n\nParticipate in\nthe\nimplementation\nand monitoring\nof client’s care\nplan\nPerform caring\nskills\nPerform\nspecialty\ncare\nprocedures\nAssist client in\nadministering\nprescribed\nmedication\nParticipate in\nthe\nimplementation\nand monitoring\nof client’s care\nplan\nProvide\nassistance and\nsupport on\nenvironment\nand\nbiopsychosoci\nal needs of\nclients\nDevelop the ability\nto recognize\nhealthy body\nsystems and apply\nmedical\nterminologies\nProvide care\nand support to\nactivities of\ndaily living\n(ADL) of\nclients\nProvide\nassistance in\nadministering\nprescribed\nmedications\nto clients\nProvide care\nand support to\nclients with\nspecial needs\nRespond to\nemergency\nsituations\nProvide\nimmediate\ncare and\nsupport to\nchildren with\nspecial needs\nProvide\nimmediate\ncare and\nsupport to\nadults and\nelderly with\nspecial\nneeds\nCarry out\nresponse\nintegration and\ncoordination in\na mass\ncasualty\nincident\nPerform\npatient\nassessment\nProvide\nemergency\ncare for\nsuspected\nspine injury\nProvide pre-\nhospital\ninterventions for\ntrauma patients\nProvide pre-\nhospital\ninterventions\nfor shock\npatients\nProvide pre-\nhospital\ninterventions\nfor medical\npatients\nPerform basic\nlife support\nand use airway\nadjuncts\nProvide pre-\nhospital\ninterventions\nfor special\npatient\npopulations\nPerform\npatient\npackaging\nConduct\npatient\ntransport\nDeliver basic\npre-hospital\ncommunication\nskills\n\n--- PDF PAGE 245 ---\nTR – Emergency Medical Services NC III Revision 00 Promulgated (10/13/2020) 241\nGLOSSARY OF TERMS\n\n1)\nAspiration – the entry of secretions or foreign material into the trachea and lungs\n2)\nAssault – refers to a violent physical or verbal attack\n3)\nBag Valve Mask with reservoir – refers to a supplemental oxygen device used to\nprovide positive pressure ventilation to patients who are not breathing or not\nbreathing adequately.\n4)\nAED (Automated External Defibrillator) – a device that analyzes heart rhythms and\ndelivers electrical shock in a patient suffering from sudden cardiac arrest.\n5)\nBody Mechanics – refers to using the body in an efficient and careful way\n6)\nCardiopulmonary Resuscitation (CPR)- refers to good quality of external chest\ncompression and adequate rescue breaths\n7)\nChoking – refers to a person having difficulty in breathing due to foreign body airway\nobstruction\n8)\nCapnography (End Tidal CO2) - a device measures the exhaled carbon dioxide\nlevel.\n9)\nFirst Aid Kit – emergency tools used to administer immediate treatment to an injured\nperson.\n10) Hazardous Waste – refers to items contaminated with blood, body fluids, or body\nsubstances that maybe harmful to others\n11) HEPA (High Efficient Particulate Air Respirator Mask) – special personal\nprotective equipment for airborne diseases\n12) LOC- means Level of consciousness\n13) OSHA – means Occupational Safety and Health Act\n14) PPE – means personal protective equipment\n15) Pulse Oximeter – a device that measures the percentage of oxygen in the\nhemoglobin\n16) Pressure or Elastic Bandage – refers to a piece of material used to cover a wound\nand to immobilize a part of the body or restrict the movement\n17) Sling – refers to a material or a piece of cloth used to support the upper extremities\n18) Splint – refers to a hard plastic or piece of wood used to immobilize a limb in the case\nof fractures or deformity.\n19) SPO2- saturation of peripheral oxygen\n20) Stressors – refers to an agent or factor that produces stress\n21) Scoop Stretchers – refers to a device used in transferring patients in a lying position.\n22) Stair Chair - refers to an equipment used to transfer patient either by lifting or rolling\nfrom one place to another in a sitting position\n23) Suffocation – refers to suppression of one’s breathing due to lack of oxygen\n24) Suicide – refers to the act of intentionally killing or injuring oneself\n25) Thermal Blanket – refers to a material used to decrease the body temperature or\nkeep the patient warm\n26) Triangular Bandage- refers to a tool used to hold the dressing in place and/or to\nimmobilize an injured body parts.\n\n--- PDF PAGE 246 ---\nTR – Emergency Medical Services NC III Revision 00 Promulgated (10/13/2020) 242\nACKNOWLEDGMENTS\n\nThe Technical Education and Skills Development Authority (TESDA) wishes to extend\nsincerest thank you and appreciation to the representatives of business, industry,\nacademe, government agencies and non-government organizations including professional\nassociations who provided their time and expertise to the development and validation of\nthis Training Regulations.\n\nTHE TECHNICAL/INDUSTRY EXPERT AND REVIEW PANEL\n\nMR. RENANTE D. LIWANAG\nPhilippine International EMS Registry (IEMSR-P), Prompt C.A.R.E. Learning\nCenter, Inc., Prompt Ambulance Philippines\n\n MR. JULIUS T. QUIJANO\nEccumenical Christian College, Tarlac City\n\n DR. JEREMY A. CORDERO, MD\nPhilippine College of Emergency Medicine (PCEM), OSMAK, Red Cross\n\nDR. IRVIN MIRANDA, MD\nHealth Emergency Management Bureau-DOH\n\nMR. JOSE A. JUAN JR, RN, MHPNP, MPA\nHealth Emergency Management Bureau-DOH\n\nMR. FRANCIS RAIZE NICHOLAS L. BAUTISTA\nHealth Emergency Management Bureau-DOH\n\nMR. VON RYAN C. ONG\nPhilippine Red Cross\n\nFO2 JAZER P. TUNGOL\nBureau of Fire Protection-National Headquarters\n\n--- PDF PAGE 247 ---\nTR – Emergency Medical Services NC III Revision 00 Promulgated (10/13/2020)) 243\n\nThe PARTICIPANTS in the National Validation of this Training Regulation\nLUZON\nName\nOrga