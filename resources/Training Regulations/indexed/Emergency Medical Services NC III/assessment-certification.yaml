  "source_text": "SECTION 4 ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\nCompetency Assessment is the process of collecting evidence and making\njudgments whether competency has been achieved. The purpose of assessment is to\nconfirm that an individual can perform to the standards expected at the workplace as\nexpressed in relevant competency standards.\n\nThe assessment process is based on evidence or information gathered to prove\nachievement of competencies. The process may be applied to an employable unit(s) of\ncompetency in partial fulfillment of the requirements of the national qualification.\n\n4.1. NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1.1 To attain the EMERGENCY MEDICAL SERVICES, National Certificate (NC III)\nthe candidate must demonstrate competence in all unit/s of competency of the\nqualification of the promulgated Training Regulations.\n\n4.1.2 Individuals wanting to be certified will have to be assessed in accordance with\nthe requirements identified in the evidence guide of the relevant unit/s of\ncompetency.\n\n4.1.3 Recognition of Prior Learning (RPL).\nCandidates who have gained competencies through education, informal\ntraining, and previous work or life experiences may apply for recognition in a\nparticular qualification through competency assessment.\n\n4.1.4 Any of the following are qualified to apply for assessment and certification:\n\n4.1.4.1 Graduates from a WTR-registered Emergency Medical Services\nprograms.\n\n4.1.4.2 Graduates of non-formal and/or informal training including enterprise-\nbased training programs. Proof and verifiable documents such as but\nnot limited to proof of service issued by the facility, EMS Agency\nand/or training certificate equivalent from any other similar training\ninstitute must be provided.\n\n4.1.4.3 Experienced workers (wage employed or self-employed) in the Local\nGovernment Units, NGOs, industry-based services with least 2 years\nof field experience in the emergency medical services unit. A\ndocument or proof of service issued by the EMS Agency and a proof\nof training from any other similar training provider must be shown.\n\n4.1.5 Current holders of National Certificate (NC) in Emergency Medical Services NC\nII are required to undergo assessment under the promulgated Training\nRegulations (TR) for Emergency Medical Services NC III.\n\n--- PDF PAGE 239 ---\nTR – Emergency Medical Services NC III Revision 00 Promulgated (10/13/2020)) 235\n\n4.1.6 Reassessment is allowed only after one month from the date of assessment.\nReassessment for a National Certificate shall be done only on the task/s that\nthe candidate did not successfully achieve.\n\n4.1.7 A candidate rated as “not yet competent” in the assessment for two (2)\nconsecutive times will be required to go through a refresher course before taking\nanother assessment.\n\n4.1.8 Only certified individuals in this Qualification may be nominated by the industry\nsector for accreditation as competency assessor.\n\n4.1.8 Only accredited competency assessors are allowed to conduct competency\nassessment, however trainers who are accredited competency assessors are\nnot allowed to assess their trainees.\n\n4.1.9 Assessment of competence must be undertaken only in the TESDA accredited\nassessment center. The performance assessment (demonstration of\ncompetence), however, may be done in any venue or workplace duly\ndesignated by an accredited assessment center.\n\n4.1.10 The guidelines on assessment and certification are discussed in detail in the\nProcedures Manual on Assessment and Certification.\n4.1.10.1 The industry shall determine assessment and certification\nrequirements for each qualification with promulgated Training\nRegulations. It includes the following:\na. Entry requirements for candidates\nb. Evidence gathering methods\nc. Qualification requirements of competency assessors\nd. Specific assessment and certification arrangements as\nidentified by industry\n4.1.10.2 Recognition of Prior Learning (RPL). Candidates who have\ngained competencies through informal training, previous work\nor life experiences may apply for recognition in a qualification\nthrough a recognition/assessment process.\n\n4.2.\nCOMPETENCY ASSESSMENT REQUISITE\n\n4.2.1 Self-Assessment Guide. The self-assessment guide (SAG) is accomplished\nby the candidate prior to actual competency assessment. SAG is a pre-\nassessment tool to help the candidate and the assessor determine what\nevidence is available, where gaps exist, including readiness for assessment.\n\nThis document can:\na) Identify the candidate’s skills and knowledge\nb) Highlight gaps in candidate’s skills and knowledge\nc) Provide critical guidance to the assessor and candidate on the evidence\nthat need to be presented\nd) Assist the candidate to identify key areas in which practice is needed or\nadditional information or skills that should be gained prior to assessment\n\n--- PDF PAGE 240 ---\nTR – Emergency Medical Services NC III Revision 00 Promulgated (10/13/2020)) 236\n\n4.2.2 Accredited Assessment Center. Only Assessment Center accredited by\nTESDA is authorized to conduct competency assessment. Assessment\ncenters undergo a quality assured procedure for accreditation before they are\nauthorized by TESDA to manage the assessment for National Certification.\n\n4.2.3 Accredited Competency Assessor. Only accredited competency assessor\nis authorized to conduct assessment of competence. Competency assessors\nundergo a quality assured system of accreditation procedure before they are\nauthorized by TESDA to assess the competencies of candidates for National\nCertification.\n\n--- PDF PAGE 241 ---\nTR – Emergency Medical Services NC III Revision 00 Promulgated (10/13/2020) 237\n\nReceive and\nrespond to\nworkplace\ncommunication\nWork with\nothers\nSolve/address\nroutine problems\nEnhance self-\nmanagement\nskills\nSupport\nInnovation\nAccess and\nmaintain\ninformation\nFollow occupational\nsafety and health\npolicies