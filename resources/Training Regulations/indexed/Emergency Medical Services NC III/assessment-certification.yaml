      "number": "4.1",
      "text": "NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS 4.1.1 To attain the EMERGENCY MEDICAL SERVICES, National Certificate (NC III) the candidate must demonstrate competence in all unit/s of competency of the qualification of the promulgated Training Regulations. 4.1.2 Individuals wanting to be certified will have to be assessed in accordance with the requirements identified in the evidence guide of the relevant unit/s of competency. 4.1.3 Recognition of Prior Learning (RPL). Candidates who have gained competencies through education, informal training, and previous work or life experiences may apply for recognition in a particular qualification through competency assessment. 4.1.4 Any of the following are qualified to apply for assessment and certification: 4.1.4.1 Graduates from a WTR-registered Emergency Medical Services programs. 4.1.4.2 Graduates of non-formal and/or informal training including enterprise- based training programs. Proof and verifiable documents such as but not limited to proof of service issued by the facility, EMS Agency and/or training certificate equivalent from any other similar training institute must be provided. 4.1.4.3 Experienced workers (wage employed or self-employed) in the Local Government Units, NGOs, industry-based services with least 2 years of field experience in the emergency medical services unit. A document or proof of service issued by the EMS Agency and a proof of training from any other similar training provider must be shown. 4.1.5 Current holders of National Certificate (NC) in Emergency Medical Services NC II are required to undergo assessment under the promulgated Training Regulations (TR) for Emergency Medical Services NC III. 4.1.6 Reassessment is allowed only after one month from the date of assessment. Reassessment for a National Certificate shall be done only on the task/s that the candidate did not successfully achieve. 4.1.7 A candidate rated as “not yet competent” in the assessment for two (2) consecutive times will be required to go through a refresher course before taking another assessment. 4.1.8 Only certified individuals in this Qualification may be nominated by the industry sector for accreditation as competency assessor. 4.1.8 Only accredited competency assessors are allowed to conduct competency assessment, however trainers who are accredited competency assessors are not allowed to assess their trainees. 4.1.9 Assessment of competence must be undertaken only in the TESDA accredited assessment center. The performance assessment (demonstration of competence), however, may be done in any venue or workplace duly designated by an accredited assessment center. 4.1.10 The guidelines on assessment and certification are discussed in detail in the Procedures Manual on Assessment and Certification. 4.1.10.1 The industry shall determine assessment and certification requirements for each qualification with promulgated Training Regulations. It includes the following: a. Entry requirements for candidates b. Evidence gathering methods c. Qualification requirements of competency assessors d. Specific assessment and certification arrangements as identified by industry 4.1.10.2 Recognition of Prior Learning (RPL). Candidates who have gained competencies through informal training, previous work or life experiences may apply for recognition in a qualification through a recognition/assessment process."
