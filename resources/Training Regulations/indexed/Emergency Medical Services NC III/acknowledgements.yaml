      "source_text": "ELEMENT PERFORMANCE CRITERIA Italicized terms are elaborated in the Range of Variables REQUIRED KNOWLEDGE REQUIRED SKILLS 1. Plan responses 1.1 Responses are planned to instances of difficult or challenging behavior to maximize the availability of other appropriate staff and resources based on established standard practice 1.2 Specific manifestations of difficult or challenging behavior are identified and strategies appropriate to these behaviors are planned as required based on established procedure 1.3 Safety of self and others is given priority in responding to difficult or challenging behavior according to institutional policies and procedures 1.1 Use of therapeutic communication 1.2 RA 11058 - OSH Law 1.3 Reporting and documentation 1.4 Environmental RA 9003 (Ecological Solid Waste Management Act) 1.5 Difficult and challenging behavior 1.6 Client issues which need to be referred to an appropriate health professional 1.7 Rules of health professionals involved with the care of client 1.1 Applying therapeutic communication 1.2 Implementing environmental and institutional, rules, guidelines, policies and procedures 1.3 Identifying issues relating to difficult and challenging behavior 1.4 Identifying client issues which need to be referred to an appropriate health professional 1.5 Thinking and responding quickly and strategically 1.6 Remaining alert to potential incidents of difficult or challenging behavior 1.7 Working with others and display empathy with client and relatives 1.8 Applying intra and interpersonal skills 1.9 Reporting and documentation with accuracy"
