      "source_text": "SECTION 3 TRAINING ARRANGEMENTS"
    },
    {
      "source_text": "These standards are set to provide Technical and Vocational Education and Training (TVET) providers with information and other important requirements to consider when designing training programs for EMERGENCY MEDICAL SERVICES NC III."
    },
    {
      "source_text": "This includes information on curriculum design; training delivery; trainee entry requirements; tools and equipment; training facilities, trainer’s qualification and institutional assessment."
    },
    {
      "source_text": "3.1 CURRICULUM DESIGN"
    },
    {
      "source_text": "TESDA shall provide the training on the development of competency-based curricula to enable training providers develop their own curricula with the components mentioned below."
    },
    {
      "source_text": "Delivery of knowledge requirements for the basic, common and core units of competency specifically in the areas of mathematics, science/technology, communication/language and other academic subjects shall be contextualized. To this end, TVET providers shall develop a Contextual Learning Matrix (CLM) to accompany the curricula."
    },
