      "source_text": "VARIABLE RANGE 1. Scene Safety May include: 1.1 Traffic Safety 1.2 Weather and Light Conditions 1.3 Highway designs 1.4 Violence 1.5 Blood borne pathogens 1.6 Hazardous materials 1.7 Mitigation strategies 2. Scene Situation May include: 2.1 Crime scenes 2.2 Weapons of mass destruction 2.3 Decontamination 2.4 Scene control zones 2.5 Command structure 2.6 Incident Action plans 2.7 Patient assessment and triage 2.8 Mechanism of injury 3. Kinematics of Trauma May include: 3.1 Physics of Trauma 3.2 Blunt trauma 3.3 Falls 3.4 Penetrating Trauma 3.5 Newton’s law 4. Classification of Hemorrhage 4.1 Class 1: Blood loss (ml): <750; Blood loss (%): <15% Pulse rate (beats/min): <100 Blood Pressure: Normal Respiratory Rate (breaths/min): 14-20 Urine output (ml/hour): >30 CNS symptoms: Normal 4.2 Class 2: Blood loss (ml): 750-1500 Blood loss (%): 15-30% Pulse rate (beats/min): >100 Blood Pressure: Decreased Respiratory Rate (breaths/min): 20-30 Urine output (ml/hour): 20-30 CNS symptoms: Anxious 4.3 Class 3: Blood loss (ml): 1500-2000 Blood loss (%): 30-40% Pulse rate (beats/min): >120 Blood Pressure: Decreased Respiratory Rate (breaths/min): 30-40 Urine output (ml/hour): 5-15 CNS symptoms: Confused 4.4 Class 4: Blood loss (ml): >2000 Blood loss (%): >40% Pulse rate (beats/min): >140"
