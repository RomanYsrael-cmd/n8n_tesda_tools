ines for an infant\n6. Proper body posture\nMay include:\n6.1 Bend on your knees squarely at the patient’s side\n6.2 Position the one hand with other hand over the first (and\ninterlock your fingers) at center of chest\n6.3 Elbows maintained straight and perpendicular to patient\nchest\n7. Pulse and breathing\nMay include:\n7.1 Not breathing or lack of spontaneous breathing\n7.2 Apnea\n7.3 Choking\n7.4 Drug overdose\n7.5 Near-drowning\n7.6 Head injury\n7.7 Heart irregularities (arrhythmia, fibrillation) or cardiac\narrest, nervous system disorders, or metabolic disorders\n7.8 Prematurity\n\n--- PDF PAGE 110 ---\nTR – Emergency Medical Services NC III Revision 00 Promulgated (10/13/2020)) 106\n\nVARIABLE\nRANGE\n7.9 Bronchial disturbances or pneumonia\n7.10 Holding the breath\n7.11 Seizures\n7.12 Meningitis\n7.13 Regurgitating food\n7.14 Asthma attacks.\n7.15 Improper technique by the rescuer\n7.16 Shock\n8. Transitioned\nMay include:\n8.1 After 2 minutes or 5 cycles\n8.2 First EMT assesses patient and\n8.3 Second rescuer resumes compressions while first EMT\noperates AED\n9. Airway adjunct\nMay include:\n9.1 Oropharyngeal airway\n9.2 Nasopharyngeal airway\n9.3 Laryngeal mask airway\n\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1. Conducted scene size up\n1.2. Conducted patient assessment\n1.3. Performed CPR\n1.4. Used AED\n1.5. Integrated resources\n2. Resource Implications\nThe following resources should be provided:\n2.1 Access to relevant workplace or appropriately simulated\nenvironment where assessment can take place.\n2.2 Relevant government and organizational policy,\nguidelines, procedures and protocols.\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1 Written Examination\n3.2 Practical examination\n3.3 Demonstration with Questioning\n3.4 Skills Return Demonstration\n3.5 Case Scenario Simulation with Questioning\n4. Context of Assessment 4.1 Competency may be asse