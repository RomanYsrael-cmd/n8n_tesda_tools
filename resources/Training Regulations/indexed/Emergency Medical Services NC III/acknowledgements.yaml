      "source_text": "-- PDF PAGE 126 --- TR – Emergency Medical Services NC III Revision 00 Promulgated (10/13/2020)) 122"
    },
    {
      "source_text": "ELEMENT PERFORMANCE CRITERIA Italicized terms are elaborated in the Range of Variables REQUIRED KNOWLEDGE REQUIRED SKILLS 3.14 Use scoop stretcher 3.15 Demonstrate the correct use of medical restraints 4. Package patient with special considerations 4.1 Patient packaged before arrival is augmented utilizing team equipment 4.2 Decision to package the patient as per the standard packaging procedure is clearly communicated and the rationale explained to the attending crews. 4.3 Moving a very large patient is recognized 4.4 Patients with suspected head injuries is packaged with cervical collar loosened and with a head up tilted up on the trolley 4.5 Loosen straps across the torso to improve ventilation in patients with difficulty of breathing is considered 4.1 Patients fully packaged before arrival on an extrication board or in their current packaged state 4.2 Special considerations related to moving and transporting geriatric patients and guidelines to follow during their lifting and moving 4.3 Guidelines for lifting and moving bariatric patients 4.4 Guidelines for lifting and moving trauma patients 4.5 Guidelines for lifting and moving medical patients 4.6 EMS bariatric protocol 4.7 Managing the bariatric patient as one of the most complex challenges for the EMS providers to encounter 4.8 Patient and provider safe care principles 4.9 EMS agencies consideration for equipment, personnel and process guidelines to ensure timely and high-quality emergency care and movement for the very large patient 4.1 Handling patient following EMS bariatric protocol 4.2 Performing patient extrication and immobilization 4.3 Performing appropriate carry procedures with special needs patients"
    },
    {
      "source_text": "-- PDF PAGE 127 --- TR – Emergency Medical Services NC III Revision 00 Promulgated (10/13/2020)) 123"
    },
    {
      "source_text": "ELEMENT PERFORMANCE CRITERIA Italicized terms are elaborated in the Range of Variables REQUIRED KNOWLEDGE REQUIRED SKILLS 4.10 Situations that require the use of physical restraints on a patient"
    },
    {
      "source_text": "RANGE OF VARIABLES VARIABLE RANGE 1. Standard packaging May include: 1.1 Remove clothing in order to facilitate assessment, treatment and packaging. 1.2 Ensure adequate protection from exposure and maintenance of patient dignity using standard ambulance blankets. 1.3 Prepare the transport mattress by placing it open on top of an ambulance trolley with the straps un-fastened. 1.4 Place the patient onto the ‘scoop’ stretcher. A slight log roll or bracing the patient may be required. 1.5 Ensure the clips at each end are securely fastened. If a pelvic splint is required apply this during the log roll in order to mitigate further movement. 1.6 Secure the patient to the scoop stretcher using the appropriate straps (minimum of 3). 1.7 Apply the head blocks and tape into place. Place at least one standard ambulance blanket over the patient. 1.8 The patient can now be loaded on the land ambulance. 2. Effectively packaged May include: 2.1 Minimize spinal movement 2.2 Minimize clot disturbance and further blood loss 2.3 Maintain normothermia 3. Patient is secured May include: 3.1 Mechanical restraints 3.2 Spider straps 3.3 Wrist and ankle straps 4. Lifting procedures May include: 4.1 Guidelines for carrying a patient on a stretcher 4.2 Lifting guidelines 5. Moving procedures May include: 5.1 Carrying guidelines 5.2 Principles of safe reaching and pulling 5.3 Emergency moves 5.4 Urgent moves"
    },
    {
      "source_text": "-- PDF PAGE 128 --- TR – Emergency Medical Services NC III Revision 00 Promulgated (10/13/2020)) 124"
    },
    {
      "source_text": "EVIDENCE GUIDE 1. Critical Aspects of Competency Assessment requires evidence that the candidate: 1.1 Prepared patient for packaging 1.2 Packaged patient 1.3 Prepared patient for transport 1.4 Packaged patient with special considerations 2. Resource Implications The following resources should be provided: 2.1 Access to relevant workplace or appropriately simulated environment where assessment can take place. 2.2 Relevant government and organizational policy, guidelines, procedures and protocols. 3. Methods of Assessment Competency in this unit may be assessed through: 3.1 Demonstration with questioning 3.2 Observations with questioning 3.3 Third Party Report 3.4 Written Examination 4. Context of Assessment 4.1 Competency may be assessed in the actual workplace or at the designated TESDA Accredited Assessment Center."
    },
