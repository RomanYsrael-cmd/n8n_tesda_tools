ect-Isolate and Report Process\n•\nPrecautionary measures to prevent\ncontamination or infection\n•\nPPE preparation appropriate for handling\npotential COVID-19 patients\n•\nHand hygiene as part of standard of care\n•\nDirect contact restrictions during patient\nengagement\n•\nImmediate transport requirement criteria\n•\nAirway assessment status in patients who\nare both responsive and unresponsive\n•\nAssessment of breathing status of the\npatient, information to obtain in the process\nand care required for both patients with\nadequate and inadequate breathing\n•\nSigns of respiratory distress and failure\n•\nAssessment of a patient’s circulatory\nstatus, different methods of obtaining pulse\nand appropriate management\n•\nAssessing for and methods for controlling\nexternal bleeding\n• Lecture\n• Group Discussion\n• Video Viewing\n• Demonstration\n• Role Play\n• Written Test\n• Oral Evaluation\n• Interview\n• Observation\n5 hours\n\n--- PDF PAGE 170 ---\nTR – Emergency Medical Services NC III Revision 00 Promulgated (10/13/2020)) 166\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n•\nSteps to identify and treat life-threatening\nconditions\n•\nSteps to follow during rapid scan of a\ntrauma patient\n•\nProcess of determining the priority of\npatient care and transport at an emergency\nscene\n•\nImportance of protecting the trauma\npatient’s spine and identify fractured\nextremities during patient packaging for\ntransport\n•\nProper use of PPE’s for the management\nof COVID-19 patients\nPerform the following tasks:\n•\nForm general impression\n•\nPerform specific guidelines in a potential\nCOVID-19 patient contact based on the\nDepartment of Health Policy and the World\nHealth precautionary recommendations\n•\nPerform primary assessment procedures\n•\nConfirm suspected patient based on\nDepartment of Health Guidelines and\nWorld Health Organization’s precautionary\nguidelines\n•\nPerform rapid scan\n•\nDetermine patient care and transport\nprioritization\n•\nAssess patient properly and efficiently\n•\nUse of appropriate PPE’s\n•\nPerform proper hand hygiene technique\n•\nUse AVPU Scale\n•\nEvaluate patient’s orientation\n•\nAssess patient’s Airway\n\n--- PDF PAGE 171 ---\nTR – Emergency Medical Services NC III Revision 00 Promulgated (10/13/2020)) 167\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\no Head tilt-chin lift for non-trauma\no Jaw-thrust maneuver for trauma\n•\nDetermine adequacy and depth of\nbreathing\n•\nAssess radial or carotid pulse for both\nresponsive and unresponsive patient\n•\nAssess carotid pulse of an unresponsive\npatient\n•\nPalpate brachial pulse of a child who is\nyounger than 1 year\n•\nObtain patient’s pulse rate\n•\nAssess capillary refill of an adult or child\nolder than 6 years\n•\nAssess capillary refill of an infant or child\nyounger than 6 years and explain\nvariations required in assessing a newborn\n•\nPerform rapid scan in a patient\n•\nIf needed, perform cervical immobilization\n•\nUse spine board\n\n2.3 Gather Patient\nHistory\nLecture and discussion on the following topics:\n•\nDifferent techniques used to obtain\ninformation from patients during history\ntaking process\n•\nScreening protocols training\n•\nDocumentation and debriefing process\n•\nDifferent challenges in taking patient\nhistory on sensitive topics and strategies to\nfacilitate for each situation\n•\nDecontamination, proper waste handling\nand disposal\n•\nProcess of taking focused history, its key\ncomponents and its relationship to the\nprimary assessment process\n• Lecture\n• Group Discussion\n• Demonstration\n• Role Play\n\n• Written Test\n• Oral Evaluation\n• Observation\n2 hours\n\n--- PDF PAGE 172 ---\nTR – Emergency Medical Services NC III Revision 00 Promulgated (10/13/2020)) 168\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\nPerform the following tasks:\n•\nGather patient Information\n•\nInvestigate Chief complaint and history of\npresent illness\n•\nObtain SAMPLE history\n•\nConfirm suspected patient through verbal\ninterview in accordance to screening\ncriteria of the Department of Health\n•\nDocument patient information\n•\nObtain information using the mnemonic\nSAMPLE\n•\nAssess pain using the mnemonic OPQRST\n•\nApply proper communication techniques\n•\nApply doffing techniques in an appropriate\narea\n•\nDecontaminate properly the ambulance\nand the EMS base\n•\nAttend debriefing sessions\n•\nPerform precautionary measures in dealing\nwith patients with special needs\n\n2.4 Perform\nSecondary\nAssessment\nLecture and discussion on the following topics\n•\nPurpose of performing a physical exam\nduring secondary assessment\n•\nComponents, special patient\nconsiderations, and methods to use to\ndetermine aspects of the physical\nexamination\n•\nPurpose and process of full body scan\n•\nSituations of patients that may receive\nfocused assessment and body system to\ninclude based on chief complaint\n• Lecture\n• Group Discussion\n• Video Viewing\n• Demonstration\n• Role Play\n\n• Written Test\n• Oral Evaluation\n• Observation\n4 hours\n\n--- PDF PAGE 173 ---\nTR – Emergency Medical Services NC III Revision 00 Promulgated (10/13/2020)) 169\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n•\nNormal blood pressure ranges for adults,\nchildren and infants\n•\nSAMPLE History taking\n•\nPrinciples and use of Monitoring devices\nPerform the following tasks:\n•\nAssess vital signs using the appropriate\nmonitoring device\n•\nAssess patient systematically\n•\nPerform full-body scan\n•\nConduct focused assessment\n•\nEvaluate body regions using the mnemonic\nDCAP-BTLS\n•\nUse pulse oximetry device\n•\nAssist in blood pressure measurement\n•\nPerform full body scan\n•\nMeasure blood pressure by auscultat