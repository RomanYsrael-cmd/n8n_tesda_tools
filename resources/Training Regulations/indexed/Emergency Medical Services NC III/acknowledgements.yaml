 and\ncoordination in\na mass\ncasualty\nincident\nPerform\npatient\nassessment\nProvide\nemergency\ncare for\nsuspected\nspine injury\nProvide pre-\nhospital\ninterventions for\ntrauma patients\nProvide pre-\nhospital\ninterventions\nfor shock\npatients\nProvide pre-\nhospital\ninterventions\nfor medical\npatients\nPerform basic\nlife support\nand use airway\nadjuncts\nProvide pre-\nhospital\ninterventions\nfor special\npatient\npopulations\nPerform\npatient\npackaging\nConduct\npatient\ntransport\nDeliver basic\npre-hospital\ncommunication\nskills\n\n--- PDF PAGE 245 ---\nTR – Emergency Medical Services NC III Revision 00 Promulgated (10/13/2020) 241\nGLOSSARY OF TERMS\n\n1)\nAspiration – the entry of secretions or foreign material into the trachea and lungs\n2)\nAssault – refers to a violent physical or verbal attack\n3)\nBag Valve Mask with reservoir – refers to a supplemental oxygen device used to\nprovide positive pressure ventilation to patients who are not breathing or not\nbreathing adequately.\n4)\nAED (Automated External Defibrillator) – a device that analyzes heart rhythms and\ndelivers electrical shock in a patient suffering from sudden cardiac arrest.\n5)\nBody Mechanics – refers to using the body in an efficient and careful way\n6)\nCardiopulmonary Resuscitation (CPR)- refers to good quality of external chest\ncompression and adequate rescue breaths\n7)\nChoking – refers to a person having difficulty in breathing due to foreign body airway\nobstruction\n8)\nCapnography (End Tidal CO2) - a device measures the exhaled carbon dioxide\nlevel.\n9)\nFirst Aid Kit – emergency tools used to administer immediate treatment to an injured\nperson.\n10) Hazardous Waste – refers to items contaminated with blood, body fluids, or body\nsubstances that maybe harmful to others\n11) HEPA (High Efficient Particulate Air Respirator Mask) – special personal\nprotective equipment for airborne diseases\n12) LOC- means Level of consciousness\n13) OSHA – means Occupational Safety and Health Act\n14) PPE – means personal protective equipment\n15) Pulse Oximeter – a device that measures the percentage of oxygen in the\nhemoglobin\n16) Pressure or Elastic Bandage – refers to a piece of material used to cover a wound\nand to immobilize a part of the body or restrict the movement\n17) Sling – refers to a material or a piece of cloth used to support the upper extremities\n18) Splint – refers to a hard plastic or piece of wood used to immobilize a limb in the case\nof fractures or deformity.\n19) SPO2- saturation of peripheral oxygen\n20) Stressors – refers to an agent or factor that produces stress\n21) Scoop Stretchers – refers to a device used in transferring patients in a lying position.\n22) Stair Chair - refers to an equipment used to transfer patient either by lifting or rolling\nfrom one place to another in a sitting position\n23) Suffocation – refers to suppression of one’s breathing due to lack of oxygen\n24) Suicide – refers to the act of intentionally killing or injuring oneself\n25) Thermal Blanket – refers to a material used to decrease the body temperature or\nkeep the patient warm\n26) Triangular Bandage- refers to a tool used to hold the dressing in place and/or to\nimmobilize an injured body parts.\n\n--- PDF PAGE 246 ---\nTR – Emergency Medical Services NC III Revision 00 Promulgated (10/13/2020) 242\nACKNOWLEDGMENTS\n\nThe Technical Education and Skills Development Authority (TESDA) wishes to extend\nsincerest thank you and appreciation to the representatives of business, industry,\nacademe, government agencies and non-government organizations including professional\nassociations who provided their time and expertise to the development and validation of\nthis Training Regulations.\n\nTHE TECHNICAL/INDUSTRY EXPERT AND REVIEW PANEL\n\nMR. RENANTE D. LIWANAG\nPhilippine International EMS Registry (IEMSR-P), Prompt C.A.R.E. Learning\nCenter, Inc., Prompt Ambulance Philippines\n\n MR. JULIUS T. QUIJANO\nEccumenical Christian Coll