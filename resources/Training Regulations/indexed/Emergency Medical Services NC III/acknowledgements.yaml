      "source_text": "A. The Emergency Medical Services Learning Facility must be of concrete structure. Based on class size of 25 students / trainees, the space requirements for the teaching / learning and curriculum areas are as follows:"
    },
    {
      "source_text": "SPACE REQUIREMENT SIZE IN METERS AREA IN SQ. METERS TOTAL AREA IN SQ. METERS Laboratory Area 4 X 5 20 20 Tool Room and S/M storage Area 3 X 5 15 15 Learning Resources Area* 5 X 7 35 35 Wash Area/Comfort Room (male & female)* 2.5 X 4 10 10 Admin and Staff Room 4 X 5 20 20 Circulation Area**"
    },
