    },
    {
      "source_text": "ELEMENT PERFORMANCE CRITERIA Italicized terms are elaborated in the Range of Variables REQUIRED KNOWLEDGE REQUIRED SKILLS 3. Perform procedure in loading, unloading and endorsement of patient"
    },
    {
      "source_text": "3.1 Transport Equipment is used appropriately 3.2 Patient's illness/injury is not exacerbated by unnecessary movement during loading 3.3 Patient's illness/injury is not exacerbated by unnecessary movement during unloading 3.4 Patient is transported appropriately based on patient condition 3.5 Physical handover is facilitated based on patient safety protocol 3.6 Tasks of the EMT after patient conduction is complete are undertaken 3.7 Post-transport procedures are followed based on EMS protocols 3.8 Precautionary measures in the Emergency operations center and EMS base are strictly imposed 3.9 Additional or Special considerations are given to patients that have special needs that may affect EMS protocol"
    },
    {
      "source_text": "3.1 Communication with the designated point of contact at the receiving facility with updates on the patient’s condition to facilitate reception of the patient immediately upon arrival 3.2 Verbal Non-verbal communication 3.3 Use of Simple Commands for lifting the patient 3.4 Knowledge on the use of body mechanics and power grip 3.5 Physiology of the body movement to do proper body mechanics 3.6 Identify the risk and hazards during transport 3.7 Difference between cleaning, disinfection, high- level disinfection, and sterilization 3.8 Protocols and guidelines for driving an ambulance safely and defensively 3.9 Key steps that EMT can use to identify safety improvement while enroute to the scene, the hospital and the station 3.10 Computation of Weight and capacity to lift a patient 3.11 Identify the modes of transportation 3.1 Demonstrate lifting using commercial stretcher 3.2 Demonstrate lifting using folding stretcher 3.3 Demonstrate lifting using spine board 3.4 Demonstrate lifting using scoop stretcher 3.5 Demonstrate lifting using blanket 3.6 Demonstrate Transfer from commercial stretcher to Bed 3.7 Demonstrate manual lifting 3.8 Demonstrate how to present verbal report that would be given to arrival personnel at the receiving facility upon patient transfer 3.9 Perform proper endorsement procedures"
