      "source_text": "-- PDF PAGE 245 --- TR – Emergency Medical Services NC III Revision 00 Promulgated (10/13/2020) 241 GLOSSARY OF TERMS"
    },
    {
      "source_text": "1) Aspiration – the entry of secretions or foreign material into the trachea and lungs 2) Assault – refers to a violent physical or verbal attack 3) Bag Valve Mask with reservoir – refers to a supplemental oxygen device used to provide positive pressure ventilation to patients who are not breathing or not breathing adequately. 4) AED (Automated External Defibrillator) – a device that analyzes heart rhythms and delivers electrical shock in a patient suffering from sudden cardiac arrest. 5) Body Mechanics – refers to using the body in an efficient and careful way 6) Cardiopulmonary Resuscitation (CPR)- refers to good quality of external chest compression and adequate rescue breaths 7) Choking – refers to a person having difficulty in breathing due to foreign body airway obstruction 8) Capnography (End Tidal CO2) - a device measures the exhaled carbon dioxide level. 9) First Aid Kit – emergency tools used to administer immediate treatment to an injured person. 10) Hazardous Waste – refers to items contaminated with blood, body fluids, or body substances that maybe harmful to others 11) HEPA (High Efficient Particulate Air Respirator Mask) – special personal protective equipment for airborne diseases 12) LOC- means Level of consciousness 13) OSHA – means Occupational Safety and Health Act 14) PPE – means personal protective equipment 15) Pulse Oximeter – a device that measures the percentage of oxygen in the hemoglobin 16) Pressure or Elastic Bandage – refers to a piece of material used to cover a wound and to immobilize a part of the body or restrict the movement 17) Sling – refers to a material or a piece of cloth used to support the upper extremities 18) Splint – refers to a hard plastic or piece of wood used to immobilize a limb in the case of fractures or deformity. 19) SPO2- saturation of peripheral oxygen 20) Stressors – refers to an agent or factor that produces stress 21) Scoop Stretchers – refers to a device used in transferring patients in a lying position. 22) Stair Chair - refers to an equipment used to transfer patient either by lifting or rolling from one place to another in a sitting position 23) Suffocation – refers to suppression of one’s breathing due to lack of oxygen 24) Suicide – refers to the act of intentionally killing or injuring oneself 25) Thermal Blanket – refers to a material used to decrease the body temperature or keep the patient warm 26) Triangular Bandage- refers to a tool used to hold the dressing in place and/or to immobilize an injured body parts."
    },
