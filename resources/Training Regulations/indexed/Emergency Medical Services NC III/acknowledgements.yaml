tion\nskills\n1.2 Interpersonal skills\n1.3 Critical thinking\nskills\n1.4 Observation skills\n2. Set OSH\nwork targets\n\n2.1 Relevant work information\nis gathered necessary to\ndetermine OSH work\ntargets\n2.2 OSH Indicators based on\ngathered information are\nagreed upon to measure\neffectiveness of workplace\nOSH policies and\nprocedures\n2.3 Agreed OSH indicators\nare endorsed for approval\nfrom appropriate\npersonnel\n2.4 OSH work instructions\nare received in\naccordance with\nworkplace policies and\nprocedures*\n2.1 OSH work targets\n2.2 OSH Indicators\n2.3 OSH work\ninstructions\n2.4 Safety and health\nrequirements of\ntasks\n2.5 Workplace\nguidelines on\nproviding feedback\non OSH and security\nconcerns\n2.6 OSH regulations\nHazard control\nprocedures\n2.7 OSH trainings\nrelevant to work\n2.1 Communication\nskills\n2.2 Collaborating\nskills\n2.3 Critical thinking\nskills\n2.4 Observation skills\n\n--- PDF PAGE 30 ---\nTR – Emergency Medical Services NC III Revision 00 Promulgated (10/13/2020)) 26\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n3. Evaluate\neffectiveness\nof\nOccupational\nSafety and\nHealth work\ninstructions\n\n3.1 OSH Practices are\nobserved based on\nworkplace standards\n3.2 Observed OSH practices\nare measured against\napproved OSH metrics\n3.3 Findings regarding\neffectiveness are\nassessed and gaps\nidentified are\nimplemented based on\nOSH work standards\n3.1 OSH Practices\n3.2 OSH metrics\n3.3 OSH Evaluation\nTechniques\n3.4 OSH work\nstandards\n3.1 Critical thinking\nskills\n3.2 Evaluating skills\n\n--- PDF PAGE 31 ---\nTR – Emergency Medical Services NC III Revision 00 Promulgated (10/13/2020)) 27\n\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. OSH Work Practices\nIssues\nMay include but not limited to:\n1.1 Workers’ experience/observance on presence of work\nhazards\n1.2 Unsafe/unhealthy administrative arrangements\n(prolonged work hours, no break-time, constant\novertime, scheduling of tasks)\n1.3 Reasons for compliance/non-compliance to use of\nPPEs or other OSH procedures/policies/ guidelines\n2. OSH Indicators\nMay include but not limited to:\n2.1\nIncreased of incidents of accidents, injuries\n2.2\nIncreased occurrence of sickness or health\ncomplaints/symptoms\n2.3\nCommon complaints of workers related to OSH\n2.4\nHigh absenteeism for work-related reasons\n3. OSH Work Instructions May include but not limited to:\n3.1 Preventive and control measures, and targets\n3.2 Eliminate the hazard (i.e., get rid of the dangerous\nmachine\n3.3 Isolate the hazard (i.e. keep the machine in a closed\nroom and operate it remotely; barricade an unsafe area\noff)\n3.4 Substitute the hazard with a safer alternative (i.e.,\nreplace the machine with a safer one)\n3.5 Use administrative controls to reduce the risk (i.e. give\ntrainings on how to use equipment safely; OSH-related\ntopics, issue warning signages, rotation/shifting work\nschedule)\n3.6 Use engineering controls to reduce the risk (i.e. use\nsafety guards to machine)\n3.7 Use personal protective equipment\n3.8 Safety, Health and Work Environment Evaluation\n3.9 Periodic and/or special medical examinations of workers\n4. OSH metrics\nMay include but not limited to:\n4.1 Statistics on incidence of accidence and injuries\n4.2 Morbidity (Type and Number of Sickness)\n4.3 Mortality (Cause and Number of Deaths)\n4.4 Accident Rate\n\n--- PDF PAGE 32 ---\nTR – Emergency Medical Services NC III Revision 00 Promulgated (10/13/2020)) 28\n\nEVIDENCE GUIDE\n1. Critical aspects of\nCompetency\n\nAssessment requires evidence that the candidate:\n1.1 Identify OSH work practices issues relevant to work\nrequirements\n1.2 Identify gaps in work practices related to relevant OSH\nwork standards\n1.3 Agree upon OSH Indicators based on gathered\ninformation to measure effectiveness of workplace\nOSH policies and procedures\n1.4 Receive OSH work instructions in accordance with\nworkplace policies and procedures\n1.5 Compare Observed OSH practices with against\napproved OSH work instructions\n1.6 Assess findings regarding effectiveness based on OSH\nwork standards\n2. Resource Implications\nThe following resources should be provided:\n2.1 Facilities, materials, tools and equipment necessary for\nthe activity\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1 Observation/Demonstration with oral questioning\n3.2 Third party report\n3.3 Written exam\n4. Context for\nAssessment\n4.1 Competency may be assessed in the actual workplace\nor at the designated TESDA Accredited Assessment\nCenter.\n\n--- PDF PAGE 33 ---\nTR – Emergency Medical Services NC III Revision 00 Promulgated (10/13/2020)) 29\n\nUNIT OF COMPETENCY : EVALUATE ENVIRONMENTAL WORK PRACTICES\n\nUNIT CODE\n: 400311326\n\nUNIT DESCRIPTOR\n: This unit covers the knowledge, skills and attitude to interpret\nenvironmental\nIssues,\nestablish\ntargets\nto\nevaluate\nenvironmental practices and evaluate effectiveness of\nenvironmental practices.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Interpret\nenvironment\nal practices,\npolicies and\nprocedures\n1.1 Environmental work\npractices issues are\nidentified relevant to\nwork requirements\n1.2 Environmental Standards\nand Procedures nature\nof work are determined\nbased on Applicability to\nnature of work\n1.3 Gaps in work practices\nrelated to Environmental\nStandards and\nProcedures are identified\n1.1 Environmental\nIssues\n1.2 Environmental\nWork Procedures\n1.3 Environmental\nLaws\n1.4 Environmental\nHazardous and\nNon-Hazardous\nMaterials\n1.5 Environmental\nrequired license,\nregistration or\ncertification\n1.1 Analyzing\nEnvironmental\nIssues and\nConcerns\n1.2 Critical thinking\n1.3 Problem Solving\n1.4 Observation Skills\n\n2. Establish\ntargets to\nevaluate\nenvironment\nal practices\n\n2.1 Relevant information