essment.\n\n3.1 CURRICULUM DESIGN\n\nTESDA shall provide the training on the development of competency-based\ncurricula to enable training providers develop their own curricula with the components\nmentioned below.\n\nDelivery of knowledge requirements for the basic, common and core units of\ncompetency\nspecifically\nin\nthe\nareas\nof\nmathematics,\nscience/technology,\ncommunication/language and other academic subjects shall be contextualized. To this\nend, TVET providers shall develop a Contextual Learning Matrix (CLM) to accompany\nthe curricula.\n\nCourse Title:\nEMERGENCY MEDICAL\nSERVICES\nNC Level: NC III\n\nNominal Training Duration:\n\n40 hours\nBasic Competencies\n\n112 hours\nCommon Competencies\n\n528 hours\nCore Competencies\n\n680 hours\n\n264 hours\nSupervised Industry Learning (SIL)\n\n944 hours TOTAL\n\nCourse Description:\n\nThis course is designed to provide the learner with knowledge, practical skills\nand attitude, applicable in performing work activities involve in carrying out response\nintegration and coordination in a mass casualty incident, performing patient\nassessment, providing emergency care for suspected spine injury, providing pre-\nhospital intervention for trauma patients, providing intervention for shock patients,\nproviding pre-hospital intervention for medical patients, providing basic life support and\nuse of airway adjuncts, providing pre-hospital intervention for special patient\npopulations, performing patient packaging, conducting patient transport and delivering\nbasic pre-hospital communication skills.\nUpon completion of the course, the learners are expected to demonstrate the\nabove-mentioned competencies to be employed. To obtain this, all units prescribed for\nthis qualification must be achieved.\n\n--- PDF PAGE 143 ---\nTR – Emergency Medical Services NC III Revision 00 Promulgated (10/13/2020) 139\nBASIC COMPETENCIES\n(40 HOURS)\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessme