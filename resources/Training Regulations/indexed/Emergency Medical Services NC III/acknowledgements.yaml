ns\nrelated to moving\nand transporting\ngeriatric patients\nand guidelines to\nfollow during their\nlifting and moving\n4.3 Guidelines for\nlifting and moving\nbariatric patients\n4.4 Guidelines for lifting\nand moving trauma\npatients\n4.5 Guidelines for lifting\nand moving medical\npatients\n4.6 EMS bariatric\nprotocol\n4.7 Managing the\nbariatric patient as\none of the most\ncomplex challenges\nfor the EMS\nproviders to\nencounter\n4.8 Patient and provider\nsafe care principles\n4.9 EMS agencies\nconsideration for\nequipment,\npersonnel and\nprocess guidelines\nto ensure timely and\nhigh-quality\nemergency care\nand movement for\nthe very large\npatient\n4.1 Handling patient\nfollowing EMS\nbariatric protocol\n4.2 Performing patient\nextrication and\nimmobilization\n4.3 Performing\nappropriate carry\nprocedures with\nspecial needs\npatients\n\n--- PDF PAGE 127 ---\nTR – Emergency Medical Services NC III Revision 00 Promulgated (10/13/2020)) 123\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n4.10 Situations that\nrequire the use of\nphysical restraints\non a patient\n\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Standard packaging\nMay include:\n1.1 Remove clothing in order to facilitate assessment, treatment\nand packaging.\n1.2 Ensure adequate protection from exposure and maintenance\nof patient dignity using standard ambulance blankets.\n1.3 Prepare the transport mattress by placing it open on top of an\nambulance trolley with the straps un-fastened.\n1.4 Place the patient onto the ‘scoop’ stretcher. A slight log roll or\nbracing the patient may be required.\n1.5 Ensure the clips at each end are securely fastened. If a pelvic\nsplint is required apply this during the log roll in order to\nmitigate further movement.\n1.6 Secure the patient to the scoop stretcher using the\nappropriate straps (minimum of 3).\n1.7 Apply the head blocks and tape into place. Place at least one\nstandard ambulance blanket over the patient.\n1.8 The patient can now be loaded on the land ambulance.\n2. Effectively packaged May include:\n2.1 Minimize spinal movement\n2.2 Minimize clot disturbance and further blood loss\n2.3 Maintain normothermia\n3. Patient is secured\nMay include:\n3.1 Mechanical restraints\n3.2 Spider straps\n3.3 Wrist and ankle straps\n4. Lifting procedures\nMay include:\n4.1 Guidelines for carrying a patient on a stretcher\n4.2 Lifting guidelines\n5. Moving procedures\nMay include:\n5.1 Carrying guidelines\n5.2 Principles of safe reaching and pulling\n5.3 Emergency moves\n5.4 Urgent moves\n\n--- PDF PAGE 128 ---\nTR – Emergency Medical Services NC III Revision 00 Promulgated (10/13/2020)) 124\n\nEVIDENCE GUIDE\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Prepared patient for packaging\n1.2 Packaged patient\n1.3 Prepared patient for transport\n1.4 Packaged patient with special considerations\n2. Resource Implications The following resources should be provided:\n2.1 Access to relevant workplace or appropriately simulated\nenvironment where assessment can take place.\n2.2 Relevant government and organizational policy,\nguidelines, procedures and protocols.\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1 Demonstration with questioning\n3.2 Observations with questioning\n3.3 Third Party Report\n3.4 Written Examination\n4. Context of\nAssessment\n4.1 Competency may be assessed in the actual workplace or\nat the designated TESDA Accredited Assessment\nCenter.\n\n--- PDF PAGE 129 ---\nTR – Emergency Medical Services NC III Revision 00 Promulgated (10/13/2020)) 125\n\nUNIT OF COMPETENCY\n: CONDUCT PATIENT TRANSPORT\n\nUNIT CODE\n: HHC325310\n\nUNIT DESCRIPTOR\n: This unit defines the competency required to recognize\nemergency and non-emergency transport it includes perform\ntransport decision, convey and receive information relating to\nthe transport, and perform procedure