      "source_text": "3.1 Perform Lifting and moving 3.2 Perform a power lift to lift patient 3.3 Demonstrate using power lift 3.4 Perform diamond carry 3.5 Perform one handed carrying technique in lifting the patient 3.6 Perform a patient carry using a stair chair 3.7 Demonstrate proper body mechanics and principles for safe reaching and pulling 3.8 Perform log rolls 3.9 Perform an emergency and non-emergency moves 3.10 Perform the direct ground lift 3.11 Perform the extremity lift 3.12 Perform the direct carry 3.13 Demonstrate how the use the draw sheet method to transfer a patient onto a stretcher"
