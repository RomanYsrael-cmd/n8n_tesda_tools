    },
    {
      "source_text": "UNIT CODE : HHC325310"
    },
    {
      "source_text": "UNIT DESCRIPTOR : This unit defines the competency required to recognize emergency and non-emergency transport it includes perform transport decision, convey and receive information relating to the transport, and perform procedure in loading, unloading and endorsement of patient."
    },
    {
      "source_text": "ELEMENT PERFORMANCE CRITERIA Italicized terms are elaborated in the Range of Variables REQUIRED KNOWLEDGE REQUIRED SKILLS 1. Perform transport decision 1.1 Pre-transport procedures are followed based on EMS protocols 1.2 Pre-transport guidelines for a potential COVID-19 patient contact are strictly followed 1.3 EMS transport protocol guidelines are implemented 1.4 EMS Personnel are prepared 1.5 Patient care contact during transport is minimized 1.6 Patient is identified based on triage and on the patient condition 1.7 Emergency Patient is transported based on the patient condition 1.8 Non-Emergency Patient is transported based on the patient condition"
    },
    {
      "source_text": "1.1 Verbal and nonverbal communications 1.2 Anatomy and Physiology of the Human Body to recognize life- threatening condition and non- threatening condition 1.3 Competencies of EMS Personnel in the management of COVID-19 patients 1.4 Inter-facility Transfer established protocols 1.5 Passenger transport prohibitions 1.6 Appropriate interventions for patient deterioration before and/or during patient transport 1.7 Nine phases of an ambulance call and examples of key tasks the EMT performs during each phase 1.8 Medical equipment carried on an 1.1 Perform a daily inspection of an ambulance 1.2 Prepare the ambulance ventilation settings 1.3 Perform emergency and non-emergency moves 1.4 Provide necessary patient care during transport 1.5 Care for Pediatric and Geriatric patient with special needs 1.6 Perform dead body management 1.7 Demonstrate cleaning and disinfecting the ambulance and equipment before and during the post run phase"
    },
