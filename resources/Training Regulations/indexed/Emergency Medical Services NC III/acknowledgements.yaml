    {
      "source_text": "RANGE OF VARIABLES VARIABLE RANGE 1. OSH Work Practices Issues May include but not limited to: 1.1 Workers’ experience/observance on presence of work hazards 1.2 Unsafe/unhealthy administrative arrangements (prolonged work hours, no break-time, constant overtime, scheduling of tasks) 1.3 Reasons for compliance/non-compliance to use of PPEs or other OSH procedures/policies/ guidelines 2. OSH Indicators May include but not limited to: 2.1 Increased of incidents of accidents, injuries 2.2 Increased occurrence of sickness or health complaints/symptoms 2.3 Common complaints of workers related to OSH 2.4 High absenteeism for work-related reasons 3. OSH Work Instructions May include but not limited to: 3.1 Preventive and control measures, and targets 3.2 Eliminate the hazard (i.e., get rid of the dangerous machine 3.3 Isolate the hazard (i.e. keep the machine in a closed room and operate it remotely; barricade an unsafe area off) 3.4 Substitute the hazard with a safer alternative (i.e., replace the machine with a safer one) 3.5 Use administrative controls to reduce the risk (i.e. give trainings on how to use equipment safely; OSH-related topics, issue warning signages, rotation/shifting work schedule) 3.6 Use engineering controls to reduce the risk (i.e. use safety guards to machine) 3.7 Use personal protective equipment 3.8 Safety, Health and Work Environment Evaluation 3.9 Periodic and/or special medical examinations of workers 4. OSH metrics May include but not limited to: 4.1 Statistics on incidence of accidence and injuries 4.2 Morbidity (Type and Number of Sickness) 4.3 Mortality (Cause and Number of Deaths) 4.4 Accident Rate"
    },
