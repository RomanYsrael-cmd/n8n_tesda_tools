estioning\n3.2. Interview\n3.3. Third party report\n4. Context of\nAssessment\n4.1. Competency maybe assessed in actual workplace or at\nthe designated TESDA Accredited Assessment Center.\n\n--- PDF PAGE 65 ---\nTR – Emergency Medical Services NC III Revision 00 Promulgated (10/13/2020)) 61\n\nCORE COMPETENCIES\n\nUNIT OF COMPETENCY\n: CARRY OUT RESPONSE INTEGRATION AND\nCOORDINATION IN A MASS CASUALTY INCIDENT\n\nUNIT CODE\n: HHC325301\n\nUNIT DESCRIPTOR\n: This unit covers the competency required to initiate incident\nmanagement in an EMS setting with the use of local initial\nresponse resources in a mass casualty incident that includes\nidentify incident type, establish initial control and command,\nparticipate in operational response, conclude operational task\nand perform post-response activities.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Identify the\nincident type\n1.1 Communications\nnetwork are accessed.\n1.2 Initial assessment of the\nincident is carried out\npromptly.\n1.3 Hazards or potential\nhazards are assessed\nand monitored\n1.4 Number of patients\nidentified in accordance\nwith mass casualty\nincident protocol\n1.5 Resources are\ndetermined to deal with\nthe incident.\n1.6 Additional resources\nneeded are identified\nand requested in\naccordance with SOP\n1.7 Actions are taken to\nprotect, secure and\npreserve incident scene\nas required.\n1.1 National Disaster\nRisk Reduction and\nManagement\nCouncil structure\nand policies\n1.2 Organizational\nPolicies and\nProcedures\n1.3 Principles of\nincident command\nsystem\n1.3.1 Incident\nmanagement\n1.3.2 EMS response\nstructure within\nthe incident\ncommand\nsystem\n1.4 Hazards\n1.5 Resources\n1.6 Communication\nProtocols\n1.7 Use of\nCommunication\nequipment\n1.1 Communication\nskills\n1.2 Access\ncommunications\nnetwork\n1.3 Use\ncommunications\nequipment\n1.4 Conduct initial\nincident\nassessment\n1.5 Follo