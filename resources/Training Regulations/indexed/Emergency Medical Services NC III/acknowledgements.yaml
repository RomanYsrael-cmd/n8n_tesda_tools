    },
    {
      "source_text": "The EMERGENCY MEDICAL SERVICES NC III Qualification consists of competencies that a person must achieve that prepares the emergency medical technician to provide prehospital assessment and care for patients of all ages with a variety of medical conditions and traumatic injuries."
    },
    {
      "source_text": "The Units of Competency comprising this Qualification include the following:"
    },
    {
      "source_text": "Unit Code BASIC COMPETENCIES 400311319 Lead workplace communication 400311320 Lead small teams 400311321 Apply critical thinking and problem-solving techniques in the workplace 400311322 Work in a diverse environment 400311323"
    },
    {
      "source_text": "Propose methods of applying learning and innovation in the organization 400311324 Use information systematically 400311325 Evaluate occupational safety and health work practices 400311326 Evaluate environmental work practices 400311327 Facilitate entrepreneurial skills for micro-small-medium enterprises (MSMEs)"
    },
    {
      "source_text": "Unit Code COMMON COMPETENCIES HHC325201 Implement and monitor infection control policies and procedures HHC325202 Respond effectively to difficult/challenging behavior HHC325203 Apply basic first aid HHC325204 Maintain high standard of patient/client services"
    },
    {
      "source_text": "Unit Code CORE COMPETENCIES HHC325301 Carry out response integration and coordination in a mass casualty incident HHC325302 Perform patient assessment HHC325303 Provide emergency care for suspected spine injury HHC325304 Provide pre-hospital interventions for trauma patients HHC325305 Provide pre-hospital interventions for shock patients HHC325306 Provide pre-hospital interventions for medical patients HHC325307 Perform basic life support and use airway adjuncts HHC325308 Provide pre-hospital interventions for special patient populations HHC325309 Perform patient packaging HHC325310 Conduct patient transport HHC325311 Deliver basic pre-hospital communication skills"
    },
    {
