    {
      "source_text": "B. An Ambulance Simulator Mock-Up is required in the laboratory area; C. In the absence of an institution owned ambulance unit, an affiliation to agencies with ambulance is required."
    },
    {
      "source_text": "3.6 TRAINER’S QUALIFICATION"
    },
    {
      "source_text": "Must be a holder of a National TVET Trainer’s Certificate (NTTC) Level I in Emergency Medical Services NC III"
    },
    {
      "source_text": "Must have undergone training on Emergency Medical Services NC III or any other similar training for Emergency Medical Technicians;"
    },
    {
      "source_text": "A college graduate either: a. of any Allied Medical Course with at least 2 years of active EMS field experience with direct patient handling and management; or b. a College Graduate of any course with a minimum of 3 years active EMS field experience with direct patient handling and management."
    },
    {
      "source_text": "NOTE: EMS field experience should be evidenced by a Certificate of Employment or Service Record and one letter of recommendation from a direct superior 3.7 INSTITUTIONAL ASSESSMENT"
    },
    {
      "source_text": "Institutional assessment is undertaken by trainees to determine their achievement of units of competency. A certificate of achievement is issued for each unit of competency. It is recommended that a comprehensive written examination covering the basic, common and core competencies be administered at the end of the training."
    },
    {
      "source_text": "-- PDF PAGE 238 --- TR – Emergency Medical Services NC III Revision 00 Promulgated (10/13/2020)) 234"
    },
    {
      "source_text": "SECTION 4 ASSESSMENT AND CERTIFICATION ARRANGEMENTS"
    },
    {
      "source_text": "Competency Assessment is the process of collecting evidence and making judgments whether competency has been achieved. The purpose of assessment is to confirm that an individual can perform to the standards expected at the workplace as expressed in relevant competency standards."
    },
    {
      "source_text": "The assessment process is based on evidence or information gathered to prove achievement of competencies. The process may be applied to an employable unit(s) of competency in partial fulfillment of the requirements of the national qualification."
    },
    {
      "source_text": "4.1. NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS"
    },
    {
      "source_text": "4.1.1 To attain the EMERGENCY MEDICAL SERVICES, National Certificate (NC III) the candidate must demonstrate competence in all unit/s of competency of the qualification of the promulgated Training Regulations."
    },
    {
      "source_text": "4.1.2 Individuals wanting to be certified will have to be assessed in accordance with the requirements identified in the evidence guide of the relevant unit/s of competency."
    },
    {
      "source_text": "4.1.3 Recognition of Prior Learning (RPL). Candidates who have gained competencies through education, informal training, and previous work or life experiences may apply for recognition in a particular qualification through competency assessment."
    },
    {
      "source_text": "4.1.4 Any of the following are qualified to apply for assessment and certification:"
    },
    {
      "source_text": "4.1.4.1 Graduates from a WTR-registered Emergency Medical Services programs."
    },
    {
      "source_text": "4.1.4.2 Graduates of non-formal and/or informal training including enterprise- based training programs. Proof and verifiable documents such as but not limited to proof of service issued by the facility, EMS Agency and/or training certificate equivalent from any other similar training institute must be provided."
    },
    {
      "source_text": "4.1.4.3 Experienced workers (wage employed or self-employed) in the Local Government Units, NGOs, industry-based services with least 2 years of field experience in the emergency medical services unit. A document or proof of service issued by the EMS Agency and a proof of training from any other similar training provider must be shown."
    },
    {
      "source_text": "4.1.5 Current holders of National Certificate (NC) in Emergency Medical Services NC II are required to undergo assessment under the promulgated Training Regulations (TR) for Emergency Medical Services NC III."
    },
    {
      "source_text": "-- PDF PAGE 239 --- TR – Emergency Medical Services NC III Revision 00 Promulgated (10/13/2020)) 235"
    },
    {
      "source_text": "4.1.6 Reassessment is allowed only after one month from the date of assessment. Reassessment for a National Certificate shall be done only on the task/s that the candidate did not successfully achieve."
    },
    {
      "source_text": "4.1.7 A candidate rated as “not yet competent” in the assessment for two (2) consecutive times will be required to go through a refresher course before taking another assessment."
    },
    {
      "source_text": "4.1.8 Only certified individuals in this Qualification may be nominated by the industry sector for accreditation as competency assessor."
    },
    {
      "source_text": "4.1.8 Only accredited competency assessors are allowed to conduct competency assessment, however trainers who are accredited competency assessors are not allowed to assess their trainees."
    },
    {
      "source_text": "4.1.9 Assessment of competence must be undertaken only in the TESDA accredited assessment center. The performance assessment (demonstration of competence), however, may be done in any venue or workplace duly designated by an accredited assessment center."
    },
    {
      "source_text": "4.1.10 The guidelines on assessment and certification are discussed in detail in the Procedures Manual on Assessment and Certification. 4.1.10.1 The industry shall determine assessment and certification requirements for each qualification with promulgated Training Regulations. It includes the following: a. Entry requirements for candidates b. Evidence gathering methods c. Qualification requirements of competency assessors d. Specific assessment and certification arrangements as identified by industry 4.1.10.2 Recognition of Prior Learning (RPL). Candidates who have gained competencies through informal training, previous work or life experiences may apply for recognition in a qualification through a recognition/assessment process."
    },
    {
      "source_text": "4.2. COMPETENCY ASSESSMENT REQUISITE"
    },
    {
      "source_text": "4.2.1 Self-Assessment Guide. The self-assessment guide (SAG) is accomplished by the candidate prior to actual competency assessment. SAG is a pre- assessment tool to help the candidate and the assessor determine what evidence is available, where gaps exist, including readiness for assessment."
    },
    {
      "source_text": "This document can: a) Identify the candidate’s skills and knowledge b) Highlight gaps in candidate’s skills and knowledge c) Provide critical guidance to the assessor and candidate on the evidence that need to be presented d) Assist the candidate to identify key areas in which practice is needed or additional information or skills that should be gained prior to assessment"
    },
    {
      "source_text": "-- PDF PAGE 240 --- TR – Emergency Medical Services NC III Revision 00 Promulgated (10/13/2020)) 236"
    },
    {
      "source_text": "4.2.2 Accredited Assessment Center. Only Assessment Center accredited by TESDA is authorized to conduct competency assessment. Assessment centers undergo a quality assured procedure for accreditation before they are authorized by TESDA to manage the assessment for National Certification."
    },
    {
      "source_text": "4.2.3 Accredited Competency Assessor. Only accredited competency assessor is authorized to conduct assessment of competence. Competency assessors undergo a quality assured system of accreditation procedure before they are authorized by TESDA to assess the competencies of candidates for National Certification."
    },
