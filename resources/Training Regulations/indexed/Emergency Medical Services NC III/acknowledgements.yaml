      "source_text": "ELEMENT PERFORMANCE CRITERIA Italicized terms are elaborated in the Range of Variables REQUIRED KNOWLEDGE REQUIRED SKILLS 1.17 Importance in considering of having the patient compartment vent on high while performing aerosol generating procedures 2. Convey and receive information relating to the transport 2.1 Patient Information is communicated through communication system to the dispatch center to ensure coordination with the receiving facility 2.2 Integrated Health Service Network is communicated 2.3 Hospital is notified for pre arrival arrangements 2.4 Patient Information is endorsed to the medical authorities 2.5 Lights and Sirens are used appropriately 2.6 Modes of transport is utilized appropriately 2.1 A safe channel to share sensitive information as a method of communication 2.2 Verbal and non- verbal communication 2.3 Establishing secure routes 2.4 Utilization of Lights and Sirens 2.5 Knowledge in accessing air and sea ambulance 2.6 Knowledge on how to use lights and siren, communication devices and documentations 2.7 Elements that dictate the use of lights and siren to the scene, and to the hospital 2.8 Specific and limited privileges that are provided to emergency vehicles and drivers 2.9 Additional risks and special considerations related to using police escorts and crossing intersections pose to EMS personnel during transport 2.1 Effective communication techniques 2.2 Demonstrate use of two-way radios 2.3 Demonstrate communication skills used in Mobile Phones 2.4 Demonstrate how to fill out patient care report 2.5 Demonstrate how to write a written report that includes all pertinent patient information following patient transfer to the hospital"
    },
