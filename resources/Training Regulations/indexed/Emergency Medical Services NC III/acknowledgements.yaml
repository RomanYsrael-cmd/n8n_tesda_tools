e\nnature of each\nidentified\nworkplace\nchallenges\n\n--- PDF PAGE 14 ---\nTR – Emergency Medical Services NC III Revision 00 Promulgated (10/13/2020)) 10\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n3.5 Principles of\ndecision-making\nstrategies and\ntechniques\n3.6 Enterprise\ninformation systems\nand data collation\n3.7 Industry codes and\nstandards\n3.4 Devising,\ncommunicating,\nimplementing and\nevaluating\nstrategies and\ntechniques in\naddressing specific\nworkplace\nchallenges\n4 Implement\naction plans\nand\ncommunicate\nresults\n4.1 Action plans are\nimplemented and\nevaluated\n4.2 Results of plan\nimplementation and\nrecommendations are\nprepared\n4.3 Recommendations are\npresented to appropriate\npersonnel\n4.4 Recommendations are\nfollowed-up, if required\n4.1 Competence to\ninclude the ability to\napply and explain,\nsufficient for the\nidentification of\nfundamental cause,\ndetermining the\ncorrective action\nand provision of\nrecommendations\n4.2 Relevant equipment\nand operational\nprocesses\n4.3 Enterprise goals,\ntargets and\nmeasures\n4.4 Enterprise quality,\nOSH and\nenvironmental\nrequirement\n4.5 Principles of\ndecision-making\nstrategies and\ntechniques\n4.6 Enterprise\ninformation systems\nand data collation\n4.7 Industry codes and\nstandards\n4.1 Using range of\nanalytical\ntechniques (e.g.,\nplanning,\nattention,\nsimultaneous and\nsuccessive\nprocessing of\ninformation) in\nexamining\nspecific\nchallenges in the\nworkplace\n4.2 Identifying extent\nand causes of\nspecific\nchallenges in the\nworkplace\n4.3 Providing clear-\ncut findings on\nthe nature of\neach identified\nworkplace\nchallenges\n4.4 Devising,\ncommunicating,\nimplementing\nand evaluating\nstrategies and\ntechniques in\naddressing\nspecific\nworkplace\nchallenges\n\n--- PDF PAGE 15 ---\nTR – Emergency Medical Services NC III Revision 00 Promulgated (10/13/2020)) 11\n\nRANGE OF VARIABLES\n\nVARIABLES\nRANGE\n1. Parameters\nMay include:\n1.1 Processes\n1.2 Procedures\n1.3 Systems\n2. Analytical techniques\nMay include:\n2.1. Brainstorming\n2.2. Intuitions/Logic\n2.3. Cause and effect diagrams\n2.4. Pareto analysis\n2.5. SWOT analysis\n2.6. Gant chart, Pert CPM and graphs\n2.7. Scatter grams\n3. Problems\n\nMay include:\n3.1. Routine, non – routine and complex workplace and\nquality problems\n3.2. Equipment selection, availability and failure\n3.3. Teamwork and work allocation problem\n3.4. Safety and emergency situations and incidents\n3.5. Risk assessment and management\n4. Action plans\n\nMay include:\n4.1. Priority requirements\n4.2. Measurable objectives\n4.3. Resource requirements\n4.4. Timelines\n4.5. Co-ordination and feedback requirements\n4.6. Safety requirements\n4.7. Risk assessment\n4.8. Environmental requirements\n\n--- PDF PAGE 16 ---\nTR – Emergency Medical Services NC III Revision 00 Promulgated (10/13/2020)) 12\n\nEVIDENCE GUIDE\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1. Examined specific workplace challenges.\n1.2. Analyzed the causes of specific workplace challenges.\n1.3. Formulated resolutions to specific workplace challenges.\n1.4. Implemented action plans and communicated results\n2. Resource Implications 2.1. Assessment will require access to an operating plant over\nan extended period of time, or a suitable method of gathering\nevidence of operating ability over a range of situations. A\nbank of scenarios / case studies / what ifs will be required as\nwell as bank of questions which will be used to probe the\nreason behind the observable action.\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1 Observation\n3.2 Case Formulation\n3.3 Life Narrative Inquiry\n3.4 Standardized test\nThe unit will be assessed in a holistic manner as is practical and\nmay be integrated with the assessment of other relevant units of\ncompetency. Assessment will occur over a range of situations,\nwhich will include disruptions to normal, smooth operation.\nSimulation may be required to allow for timely assessment of\nparts of this unit of competency. Simulation should be based on\nthe actual workplace and will include walk through of the\nrelevant competency components.\nThese assessment activities should include a range of\nproblems, including new, unusual and improbable situations that\nmay have happened.\n4. Context for\nAssessment\n4.1 In all workplace, it may be appropriate to assess this unit\nconcurrently with relevant teamwork or operation units.\n\n--- PDF PAGE 17 ---\nTR – Emergency Medical Services NC III Revision 00 Promulgated (10/13/2020)) 13\n\nUNIT OF COMPETENCY : WORK IN A DIVERSE ENVIRONMENT\n\nUNIT CODE\n: 400311322\n\nUNIT DESCRIPTOR\n: This unit covers the outcomes required to work effectively in\na workplace characterized by diversity in terms of religions,\nbeliefs, races, ethnicities and other differences.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Develop an\nindividual’s\ncultural\nawareness\nand\nsensitivity\n1.1 Individual differences with\nclients, customers and\nfellow workers are\nrecognized and respected\nin accordance with\nenterprise policies and\ncore values.\n1.2 Differences are\nresponded to in a\nsensitive and considerate\nmanner\n1.3 Diversity is\naccommodated using\nappropriate verbal and\nnon-verbal\ncommunication.\n1.1 Understanding\ncultural diversity in\nthe workplace\n1.2 Norms of behavior\nfor interacting and\ndialogue with\nspecific groups\n(e. g., Muslims and\nother non-\nChristians, non-\nCatholics,\ntribes/ethnic\ngroups, foreigners)\n1.3 Different methods\nof verbal and non-\nverbal\ncommunication in a\nmulticultural setting\n1.1 Applying cross-\ncultural\ncommunication\nskills (i.e. different\nbusiness customs,\nbeliefs,\ncommunication\nstrategies)\n1.2 Showing affective\nskills – establishing\nrapport and\nempathy,\nunderstanding, etc.\n1.3 Demonstrating\nopenness and\nflexibility in\ncommunication\n1.4 Recognizing\ndiverse groups in\nthe workplace and\ncommunity as\ndefined by\ndivergent culture,\nreligion, traditions\nand practices\n2. Work\neffectively in\nan\nenvironment\nthat\nacknowledge\ns and values\ncultural\ndiversity\n2.1 Knowledge, skills and\nexperiences of others are\nrecognized and\ndocumented in relation to\nteam objectives.\n2.2 Fellow workers are\nencouraged to utilize and\nshare their specific\nqualities, skills or\nbackgrounds with other\nteam members and\nclients to enhance work\noutcomes.\n2.3 Relations with customers\nand clients are maintained\n2.1 Value of diversity in\nthe economy and\nsociety in terms of\nWorkforce\ndevelopment\n2.2 Importance of\ninclusiveness in a\ndiverse\nenvironment\n2.3 Shared vision and\nunderstanding of\nand commitment to\nteam, departmental,\nand organizational\ngoals and\nobjectives\n2.1 Demonstrating\ncross-cultural\ncommunication\nskills and active\nlistening\n2.2 Recognizing\ndiverse groups in\nthe workplace and\ncommunity as\ndefined by\ndivergent culture,\nreligion, traditions\nand practices\n2.3 Demonstrating\ncollaboration skills\n\n--- PDF PAGE 18 ---\nTR – Emergency Medical Services NC III Revision 00 Promulgated (10/13/2020)) 14\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\nto show that diversity is\nvalued by the business.\n2.4 Strategies for\ncustomer service\nexcellence\nExhibiting customer\nservice excellence\n\n3. Identify\ncommon\nissues in a\nmulticultural\nand diverse\nenvironment\n3.1 Diversity-related\nconflicts within the\nworkplace are effectively\naddressed and resolved.\n3.2 Discriminatory behaviors\ntowards\ncustomers/stakeholders\nare minimized and\naddressed accordingly.\n3.3 Change management\npolicies are in place within\nthe organization.\n3.1 Value, and\nleverage of\ncultural diversity\n3.2 Inclusivity and\nconflict resolution\n3.3 Workplace\nharassment\n3.4 Change\nmanagement and\nways to overcome\nresistance to\nchange\n3.5 Advanced\nstrategies for\ncustomer service\nexcellence\n3.1 Addressing\ndiversity-related\nconflicts in the\nworkplace\n3.2 Eliminating\ndiscriminatory\nbehavior towards\ncustomers and co-\nworkers\n3.3 Utilizing change\nmanagement\npolicies in the\nworkplace\n\n--- PDF PAGE 19 ---\nTR – Emergency Medical Services NC III Revision 00 Promulgated (10/13/2020)) 15\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Diversity\nThis refers to diversity in both the workplace and the\ncommunity and may include divergence in:\n1.1\nReligion\n1.2\nEthnicity, race or nationality\n1.3\nCulture\n1.4\nGender, age or personality\n1.5\nEducational background\n2. Diversity-related\nconflicts\nMay include conflicts that result from:\n2.1 Discriminatory behaviors\n2.2 Differences of cultural practices\n2.3 Differences of belief and value systems\n2.4 Gender-based violence\n2.5 Workplace bullying\n2.6 Corporate jealousy\n2.7 Language barriers\n2.8 Individuals being differently-abled persons\n2.9 Ageism (negative attitude and behavior towards old\npeople)\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Adjusted language and behavior as required by\ninteractions with diversity\n1.2 Identified and respected individual differences in\ncolleagues, clients and customers\n1.3 Applied relevant regulations, standards and codes of\npractice\n2. Resource Implications\nThe following resources should be provided:\n2.1 Access to workplace and resources\n2.2 Manuals and policies on Workplace Diversity\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1 Demonstration or simulation with oral questioning\n3.2 Group discussions and interactive activities\n3.3 Third-party report\n3.4 Written examination\n3.5 Role Plays\n4. Context for\nAssessment\n4.1 Competency assessment may occur in workplace or any\nappropriately simulated environment\n\n--- PDF PAGE 20 ---\nTR – Emergency Medical Services NC III Revision 00 Promulgated (10/13/2020)) 16\n\nUNIT OF COMPETENCY\n: PROPOSE METHODS OF APPLYING LEARNING AND\nINNOVATION IN THE ORGANIZATION\n\nUNIT CODE\n: 400311323\n\nUNIT DESCRIPTOR\n: This unit covers the knowledge, skills and attitudes required\nto assess general obstacles in the application of learning\nand innovation in the organization and to propose practical\nmethods of such in addressing organizational challenges.\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Assess work\nprocedures,\nprocesses\nand systems\nin terms of\ninnovative\npractices\n1.1 Reasons for innovation\nare incorporated to work\nprocedures\n1.2 Models of innovation\nare researched\n1.3 Gaps or barriers to\ninnovation in one’s work\narea are analyzed\n1.4 Staff who can support\nand foster innovation in\nthe work procedure are\nidentified\n\n1.1 Seven habits of\nhighly effective\npeople\n1.2 Character\nstrengths that\nfoster innovation\nand learning\n(Christopher\nPeterson and\nMartin Seligman,\n2004)\n1.3 Five minds of the\nfuture concepts\n(Gardner, 2007)\n1.4 Adaptation\nconcepts in\nneuroscience\n(Merzenich, 2013)\n1.5 Transtheoretical\nmodel of behavior\nchange\n(Prochaska,\nDiClemente, &\nNorcross, 1992)\n1.1 Demonstrating\ncollaboration and\nnetworking skills\n1.2 Applying basic\nresearch and\nevaluation skills\n1.3 Generating\ninsights on how to\nimprove\norganizational\nprocedures,\nprocesses and\nsystems through\ninnovation\n\n--- PDF PAGE 21 ---\nTR – Emergency Medical Services NC III Revision 00 Promulgated (10/13/2020)) 17\n\n2. Generate\npractical\naction plans\nfor\nimproving\nwork\nprocedures,\nprocesses\n2.1 Ideas for innovative work\nprocedure to foster\ninnovation using\nindividual and group\ntechniques are\nconceptualized\n2.2 Range of ideas with\nother team members and\ncolleagues are evaluated\nand discussed\n2.3 Work procedures and\nprocesses subject to\nchange are selected\nbased on workplace\nrequirements (feasible\nand innovative)\n2.4 Practical action plans are\nproposed to facilitate\nsimple changes in the\nwork procedures,\nprocesses and systems\n2.5 Critical inquiry is\napplied and used to\nfacilitate discourse on\nadjustments in the\nsimple work procedures,\nprocesses and systems\n2.1 Seven habits of\nhighly effective\npeople\n2.2 Character\nstrengths that\nfoster innovation\nand learning\n(Christopher\nPeterson and\nMartin Seligman,\n2004)\n2.3 Five minds of the\nfuture concepts\n(Gardner, 2007)\n2.4 Adaptation\nconcepts in\nneuroscience\n(Merzenich, 2013)\n2.5 Transtheoretical\nmodel of behavior\nchange\n(Prochaska,\nDiClemente, &\nNorcross, 1992)\n2.1 Assessing\nreadiness for\nchange on simple\nwork procedures,\nprocesses and\nsystems\n2.2 Generating\ninsights on how to\nimprove\norganizational\nprocedures,\nprocesses and\nsystems through\ninnovation\n2.3 Facilitating action\nplans on how to\napply innovative\nprocedures in the\norganization\n\n--- PDF PAGE 22 ---\nTR – Emergency Medical Services NC III Revision 00 Promulgated (10/13/2020)) 18\n\n3. Evaluate the\neffectivenes\ns of the\nproposed\naction plans\n3.1 Work structure is\nanalyzed to identify the\nimpact of the new work\nprocedures\n3.2 Co-workers/key\npersonnel is consulted\nto know who will be\ninvolved with or affected\nby the work procedure\n3.3 Work instruction\noperational plan of the\nnew work procedure is\ndeveloped and\nevaluated\n3.4 Feedback and\nsuggestion are recorded\n3.5 Operational plan is\nupdated\n3.6 Results and impact on\nthe developed work\ninstructions are\nreviewed\n3.7 Results of the new work\nprocedure are\nevaluated\n3.8 Adjustments are\nrecommended based on\nresults gathered\n3.1 Five minds of the\nfuture concepts\n(Gardner, 2007)\n3.2 Adaptation\nconcepts in\nneuroscience\n(Merzenich, 2013)\n3.3 Transtheoretical\nmodel of behavior\nchange\n(Prochaska,\nDiClemente, &\nNorcross, 1992)\n3.1 Generating\ninsights on how\nto improve\norganizational\nprocedures,\nprocesses and\nsystems through\ninnovation\n3.2 Facilitating\naction plans on\nhow to apply\ninnovative\nprocedures in\nthe organization\n3.3 Communicating\nresults of the\nevaluation of the\nproposed and\nimplemented\nchanges in the\nworkplace\nprocedures and\nsystems\n3.4 Developing\naction plans for\ncontinuous\nimprovement on\nthe basic\nsystems,\nprocesses and\nprocedures in\nthe organization\n\n--- PDF PAGE 23 ---\nTR – Emergency Medical Services NC III Revision 00 Promulgated (10/13/2020)) 19\n\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Reasons\nMay include:\n1.1 Strengths and weaknesses of the current systems,\nprocesses and procedures.\n1.2 Opportunities and threats of the current systems,\nprocesses and procedures.\n2. Models of innovation\nMay include:\n2.1 Seven habits of highly effective people.\n2.2 Five minds of the future concepts (Gardner, 2007).\n2.3 Neuroplasticity and adaptation strategies.\n3. Gaps or barriers\nMay include:\n3.1 Machine\n3.2 Manpower\n3.3 Methods\n3.4 Money\n4. Critical Inquiry\nMay include:\n4.1 Preparation\n4.2 Discussion\n4.3 Clarification of goals\n4.4 Negotiate towards a Win-Win outcome\n4.5 Agreement\n4.6 Implementation of a course of action\n4.7 Effective verbal communication. See our pages:\nVerbal Communication and Effective Speaking\n4.8 Listening\n4.9 Reducing misunderstandings is a key part of effective\nnegotiation\n4.10 Rapport Building\n4.11 Problem Solving\n4.12 Decision Making\n4.13 Assertiveness\n4.14 Dealing with Difficult Situations\n\n--- PDF PAGE 24 ---\nTR – Emergency Medical Services NC III Revision 00 Promulgated (10/13/2020)) 20\n\nEVIDENCE GUIDE\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Established the reasons why innovative systems are\nrequired.\n1.2 Established the goals of a new innovative system\n1.3 Analyzed current organizational systems to identify\ngaps and barriers to innovation.\n1.4 Assessed work procedures, processes and systems in\nterms of innovative practices.\n1.5 Generate practical action plans for improving work\nprocedures, and processes.\n1.6 Reviewed the trial innovative work system and adjusted\nreflect evaluation feedback, knowledge management\nsystems and future planning.\n1.7 Evaluated the effectiveness of the proposed action\nplans.\n2. Resource Implications\nThe following resources should be provided:\n2.1 Pens, papers and writing implements\n2.2 Cartolina\n2.3 Manila papers\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1 Psychological and behavioral Interviews\n3.2 Performance Evaluation\n3.3 Life Narrative Inquiry\n3.4 Review of portfolios of evidence and third-party\nworkplace reports of on-the-job performance\n3.5 Sensitivity analysis\n3.6 Organizational analysis\n3.7 Standardized assessment of character strengths and\nvirtues applied\n4. Context for\nAssessment\n4.1 Competency may be assessed individually in the actual\nworkplace or simulation environment in TESDA\naccredited institutions.\n\n--- PDF PAGE 25 ---\nTR – Emergency Medical Services NC III Revision 00 Promulgated (10/13/2020)) 21\n\nUNIT OF COMPETENCY : USE INFORMATION SYSTEMATICALLY\n\nUNIT CODE\n: 400311324\n\nUNIT DESCRIPTOR\n: This unit covers the knowledge, skills and attitudes required\nto use technical information systems, apply information\ntechnology (IT) systems and edit, format and check\ninformation.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Use\ntechnical\ninformation\n1.1 Information are\ncollated and organized\ninto a suitable form for\nreference and use\n1.2 Stored information is\nclassified so that it can\nbe quickly identified and\nretrieved when needed\n1.3 Guidance are advised\nand offered to people\nwho need to find and\nus