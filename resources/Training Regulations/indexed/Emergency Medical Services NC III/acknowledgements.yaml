      "source_text": "Course Description:"
    },
    {
      "source_text": "This course is designed to provide the learner with knowledge, practical skills and attitude, applicable in performing work activities involve in carrying out response integration and coordination in a mass casualty incident, performing patient assessment, providing emergency care for suspected spine injury, providing pre- hospital intervention for trauma patients, providing intervention for shock patients, providing pre-hospital intervention for medical patients, providing basic life support and use of airway adjuncts, providing pre-hospital intervention for special patient populations, performing patient packaging, conducting patient transport and delivering basic pre-hospital communication skills. Upon completion of the course, the learners are expected to demonstrate the above-mentioned competencies to be employed. To obtain this, all units prescribed for this qualification must be achieved."
