    "source_text": "3.1 CURRICULUM DESIGN\n\nCourse Title: SHIELDED METAL ARC WELDING\n\nNC Level I\n\nSuggested Nominal Training Hours: 28 hrs. ( Basic Competencies)\n\n56 hrs. ( Common Competencies)\n\n184 hrs. ( Core Competencies)\n\nCourse Description:\n\nThis course is designed to enhance the knowledge, skills and attitudes\nin Shielded Metal Arc Welding in accordance with industry standards. It covers\ncore competencies such as Setting-up Welding Equipment, Preparing Weld\nMaterials, Fitting up Weld Materials, Welding Carbon Steel Plates Using SMAW\nand Repairing Welds.\n\nBASIC COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Receive and\nrespond to\nworkplace\ncommunication\n1.1 Follow routine spoken\n message\n1.2 Perform work duties\n following written notices.\n• Group\ndiscussion\n• Interaction\n• Interviews/\n questioning\n• Observation\n2. Work with\nothers\n2.1 Develop effective\n workplace relationship.\n2.2 Contribute to work group\n activities.\n\n• Group\ndiscussion\n• Interaction\n\n• Interviews/\n questioning\n• Demonstration\n• Observation\n\n--- PDF PAGE 49 ---\nWeldncii11-3\n\n48\n3. Demonstrate\nwork values\n\n3.1 Define the purpose of work\n3.2 Apply work values/ethics\n3.3 Deal with ethical problems\n3.4 Maintain integrity of conduct\n in the workplace\n• Group\ndiscussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\nQuestioning\n\n4. Practice\nhousekeeping\nprocedures\n4.1 Sort and remove\n unnecessary items\n4.2 Arrange items\n4.3 Maintain work areas,\n tools and equipment\n4.4 Follow standardize work\n process and procedures\n4.5 Perform work spontaneously\n• Group\ndiscussion\n• Interaction\n• Demonstration\n• Observation\n• Interviews/\n questioning\n\nCOMMON COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Apply Safety\nPractices\n1.1 Identify hazardous areas\n1.2 Use protective clothing and\ndevices\n1.3 Perform safe handling of\ntools, equipment and\n materials\n1.4 Perform first aid\n1.5 Use fire extinguisher\n• Lecturette\n• Practical\n application\n\n• Oral\n questioning\n• Written\n• Demonstration\n2. Interpret\nworking\ndrawings and\nsketches\n2.1 Identify standard alphabet of\nlines\n2.2 Identify orthographic/\nisometric views\n2.3 Interpret standard drawing\nsymbols, dimensional\ntolerances and notations\n• Lecturette\n• Practical\n application\n\n• Oral\n questioning\n• Written\n\n3. Perform\nIndustry\ncalculations\n3.1 Perform four fundamental\n operations\n3.2 Perform conversion of units\n3.3 Perform calculations on\nalgebraic expressions\n3.4 Compute percentage and\nratio\n• Lecturette\n• Practical\n application\n\n• Oral\nquestioning\n• Written test\n\n4. Contribute to\n quality\n system\n4.1 Inspect work done\n4.2 Apply quality standards to\nwork\n4.3 Protect company property\n and customer interest\n• Lecturette\n• Practical\n application\n\n• Oral\n questioning\n• Written\n• Demonstration\n\n--- PDF PAGE 50 ---\nWeldncii11-3\n\n49\n5. Use hand tools\n5.1 Select hand tools\n5.2 Use hand tools\n5.3 Maintain hand tools\n• Lecturette\n• Practical\n application\n\n• Oral\n questioning\n• Written\n• Demonstration\n6. Prepare Weld\nMaterials\n\n6.1 Set-up cutting equipment\n6.2 Cut and prepare edge of\n materials\n6.3 Clean surfaces and edges\n6.4 Prepare welding\nconsumables\n6.5 Prepare welding safety and\n protective equipment\n• Lecturette\n• Practical\n application\n\n• Observation\n• Demonstration\nand oral\nquestioning\n• Written test\n\n7. Set-up Welding\nEquipment\n7.1 Set up welding machine\n7.2 Set up welding accessories\n7.3 Set up welding positioners,\njigs and fixtures\n7.4 Set up pre-heating\ntools/equipment as required\n\n• Lecturette\n• Demonstration\n\n• Observation\nand oral\nquestioning\n• Demonstration\nand oral\nquestioning\n•Written test\n8. Fit up Weld\nMaterials\n8.1 Perform tack welding\n8.2 Check gap and alignment\n8.3 Set up welding positioner\n\n• Lecturette\n• Demonstration\n\n• Observation\nand oral\nquestioning\n• Demonstration\nand oral\nquestioning\n•Written test\n9. Repair\n Welds\n9.1 Mark/locate weld defects\n9.2 Prepare tools and\nequipment\n9.3 Remove defects\n9.4 Perform re-welding\n\n• Lecturette\n• Demonstration\n\n• Observation\nand oral\nquestioning\n• Demonstration\nand oral\nquestioning\n• Written test\n\n--- PDF PAGE 51 ---\nWeldncii11-3\n\n50\nCORE COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Weld Carbon\nSteel Plates\nUsing SMAW\n1.1 Perform single pass fillet\nweld in different positions\n (1F-4F )\n1.2 Perform multiple pass fillet\nweld in different positions\n ( 1F-4F )\n1.3 Perform multiple pass\n groove weld in different\n positions ( 1G-3G )\n• Lecturette\n• Demonstration\n\n• Observation\nand oral\nquestioning\n• Demonstration\nand oral\nquestioning\n• Written test\n\n--- PDF PAGE 52 ---\nWeldncii11-3\n\n51"
