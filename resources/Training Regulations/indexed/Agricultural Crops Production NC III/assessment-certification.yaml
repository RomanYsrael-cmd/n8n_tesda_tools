  "source_text": "SECTION 4 NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS \n \n4.1. \nTo attain the National Qualification of Agricultural Crops Production NC III, the \ncandidate must demonstrate competence through project type assessment covering \nall the units listed in Section 1. Successful candidates shall be awarded a National \nCertificate signed by the TESDA Director General. \n4.2. \nThe qualification of Agricultural Crops Production NC III may be attained through: \n4.2.1. Accumulation of Certificates of Competency (COCs) in the following areas: \n4.2.1.1 Prepare land for agricultural crop production \n4.2.1.2 Implement post-harvest program \n4.2.1.3 Implement plant nutrition program \n4.2.1.4 Control weeds \n4.2.1.5 Prepare and apply chemicals \n4.2.1.6 Establish agronomic crops \n4.2.1.7 Undertake agronomic crop maintenance program \n4.2.1.8 Undertake agronomic crop harvesting activities \n4.2.1.9 Save, prepare and store agricultural seed \n4.2.2.0 Implement vertebrate pest control program \nSuccessful candidates shall be awarded Certificates of Competency (COCs) \n4.3. \nUpon accumulation and submission of all COCs acquired for the relevant units of \ncompetency comprising a qualification, an individual shall be issued the \ncorresponding National Certificate. \n4.4. \nAssessment shall focus on the core units of competency. The basic and common \nunits shall be integrated or assessed concurrently with the core units. \n4.5. \nElective units may be selected from the list below depending on workplace \nrequirements and/or specialization. To increase flexibility and enhance employability, \nelective units of competency may also be chosen from any other promulgated \nTraining Regulations at the same NC level or one level higher (NC IV), including \nAgricultural Crops Production NC IV. Certificates of Competency shall be issued for \neach additional unit undertaken. The candidate however may be awarded the \nqualification of Agricultural Crops Production NC III based on the accumulation of \ncore units as specified in 4.2.1., even without these electives: \n4.5.1. Follow site quarantine procedures \n4.5.2. Collect samples for a rural production or horticultural monitoring program \n4.5.3. Handle bulk materials in storage area \n4.5.4. Prepare grain storages \n4.5.5. Comply with industry quality assurance requirements \n4.5.6. Maintain and monitor environmental work practices \n4.5.7. Keep records for farm business \n4.5.8. Perform specialized machinery maintenance \n4.5.9. Install irrigation system \n4.5. \nThe following are qualified to apply for assessment and certification: \n4.5.1. Graduates of formal, non-formal and informal including enterprise-based \ntraining programs. \n4.5.2. Experienced workers (wage employed or self-employed) \n4.6. \nThe guidelines on assessment and certification are discussed in detail in the \nProcedures manual on Assessment and Certification and Guidelines on the \nimplementation of the Philippine TVET Qualification and Certification System.\n\n--- PDF PAGE 142 ---\n_____________________________________________________________________________________ \nTR - Agricultural Crops Production NC III Promulgated April 2006 \n- 138 - \n \n \nCOMPETENCY MAP FOR AGRI-FISHERY SECTOR \nAGRICULTURAL CROPS PRODUCTION SUB-SECTOR \nCORE UNITS OF COMPETENCY \nImplement a plant \nestablishment program \nTransport, handle and store \nchemicals \nSupervise agricultural crop \nestablishment \n \nImplement and monitor quality \nassurance procedures \nSupport and review business \nstructures and relationships \nPromote plant health \nImplement and monitor a \nproperty improvement plan \nSupervise maintenance of \nmachinery and equipment \nDevelop a horticultural crop \nmaintenance program \nAnalyze and interpret \nproduction data \n \n \n \n \n \n \n \n \n \n \n \nImplement vertebrate pest \ncontrol program \nEstablish agronomic crops \nCollect samples for a rural \nproduction of horticulture \nmonitori