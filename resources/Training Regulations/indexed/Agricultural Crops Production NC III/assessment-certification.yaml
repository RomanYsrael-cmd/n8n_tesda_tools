ing Medium – mixture of different materials such as soil, sand, compost, coir dust, \nrice hull, perlite, peat, etc. for growing seedlings \n• HACCP – Hazard Analysis Critical Control Points \n• Hardening – the process of gradually withholding water and exposing to direct sunlight to \nprevent seedlings from transplanting stress/shock \n• Harrowing – breaking of large soil clods that are caused by plowing \n• Hilling-Up – the process of covering the applied fertilizer material by raising the soil \ntowards the base of the plant to further stabilize its stand for better plant growth. \n• Hygrometer – an instrument that measures humidity. \n• Insect pest – a destructive or harmful insect. \n• Irrigation - any method of supplying water to sustain plant growth \n• Off-Baring- process of cultivating the soil away from the base of the plants \n• Pricking-Off- methods of transferring of seedling to avoid overcrowding \n• Larvae – the first stage of the life cycle of insects after leaving the egg. \n• Manometer – an instrument that measures air pressure. \n• Maturity – the quality or state of ripeness, or of being fully developed grain. \n• Maturity index – signs or indications that a commodity is mature and is ready to be \nharvested. \n• Moisture content – the conventional index used to determine whether the seed is dry \nenough for safe storage or for milling usually expressed in percent (% M.C.). \n• Molds – superficial often woolly growth produced on various forms of organic matter, \nespecially when damp or decaying. \n• NFA – National Food Authority \n• Packaging – technology or process to ensure adequate protection and safe delivery of a \nproduct from the produces to the ultimate consumer. \n• Packing – act of putting commodities in a container. \n• Packinghouse – place where the preparatory steps for storage or marketing are done. \n• Pallet – low portable platform made of wood or metal or in combination to facilitate \nhandling, storage or transport of materials as a unit load using forklift. \n• Perishables – food crops for which value and/or quality is maintained over a short period \nof time after harvest. These include fruits, vegetables, flowers, young coconut, nursery \nstocks and some staple root crops such as sweet potato, cassava and yam. \n• Postharvest disease – disease observed after harvest regardless of when or where initial \ninfestation took place. \n• Post harvest handling – specific term used for the movement of commodities and \noperations through which a commodity undergoes from harvest to possession of the fixed \nconsumer, includes the technological aspects of marketing and distribution. \n• Post harvest infection – infection that takes place after harvest.\n\n--- PDF PAGE 146 ---\n_____________________________________________________________________________________ \nTR - Agricultural Crops Production NC III Promulgated April 2006 \n- 142 - \n• Post harvest life – period of time during which a commodity is still acceptable for its \nintended purpose. \n• Pre cooling – strictly, it means the rapid cooling (48 hours or less) of a commodity to a \ndesired transit or storage temperature soon after harvest before it is stored or moved in \ntransit. \n• Pupa – an intermediate stage of an insect that preys on one or more plants and animals \nthat man wishes to preserve for his own use. \n• Refrigeration – process of removing heat from a compartment or substance so that \ntemperature is lowered and then maintained at a desirable level, usually refers to \nrefrigeration by mechanical means. \n• Relative humidity – the actual vapor pressure of the air relative to saturation. \n• Respiration – biological process by which organic materials are broken down to simpler \nforms accompanied by the release of energy and heat. \n• Ripening – the state of development of a fruit when it becomes soft and edible applies \nstrictly to climacteric type fruit. \n• Rodents – refer to rats and mice which destroy grains and other stored products. \n• Senescence – final phase in the life of an organ in which a series of normally irreversible \nevents are initiated leading to cellular breakdown or death of the organ. \n• Side-Dress Fertilizer – additional amount of any fertilizer materials applied at the onset of \nflowering to complete the nutritional requirement of the crop \n• Sprinkler Irrigation – a mechanical method of supplying water over the standing crop by \nmeans of a nozzle which is rotated by water pressure \n• Synthetic Mulch – mulching materials made either of polyethylene or non-woven fabric \n• Sorting – the process of classifying into groups designated by the person classifying crops \nor commodities the produce either according to a set criteria. \n• Standard – the set of criteria and specifications of quality determining the grades, \ndescribed as product characteristics such as maturity, color, cleanliness, shape, free from \ndecay and blemishes and uniformity of size. \n• Storage – process of keeping horticultural crops in a structure designed to protect the \nstored products from inclement weather and pests for a short or long period of time to await \nprocessing or movement to other location. \n• Storage life – the longest time produce can be kept in a sound marketable condition. \n• Tachometer – an instrument that measures revolutions per minute \n• Tillage – the mechanical manipulation of the soil \n• Transplants – vegetable seedlings produced for transplanting \n• Trellis – a support structure for vinyl crops and can either be T, I, Y, A shaped \n• Velometer – an instrument that measures velocity of air flow \n• Waxing – application of a thin film of surface coating to fruits and vegetables. \n• Wet-bulb temperature – temperature of moist air indicated by a thermometer whose bulb \nis covered with a moist wick which the air flow passing over has a velocity of 15 ft per \nsecond.\n\n--- PDF PAGE 147 ---\nACKNOWLEDGEMENTS \n \nThe Technical Education and Skills Development Authority (TESDA) wishes to extend \ngratitude and appreciation to the many representatives of business, industry, academe and \ngovernment agencies who donated their time and expertise to the development and validation of \nthese Training Regulations. \n \n• \nTHE TECHNICAL ADVISORY PANEL (TAP) \n \nDr. RODOLFO P. ESTIGOY \nMr. ALEJANDRO T. ESCANO \nChief\nPresident \nBureau of Post Harvest Research and \nExtension \nCentral Luzon State University, Science City of \nMuñoz, Nueva Ecija \nPhilippine Chamber of Agriculture and Food \n(PCAFI) \nMFI Bldg. Otigas Avenue Extension, Pasig City \n \n \nMr. EDWIN ANDOT \nDr. ALMA M. DELA CRUZ \nPresident \nChamber of Agriculture, Fisheries and Food in \nNorthern Mindanao \n2nd floor, United Way Bldg. \nCapitol Cmpd., Cagayan de Oro City \nProfessor \nCentral Luzon State University \nMuñoz, Nueva Ecija \n \n• \nTHE TECHNICAL EXPERT PANEL (TEP) \n \n \nMr. ROLANDO SIANGHIO \nMs. PILIPINAS BALANTAC \nPresident \nInstructor \nLacto Asia Pacific Corporation \nRizal Experimental Station and Pilot School \nCottage Industries (RESPSCI) \n \nPasig City \nMs. MIRIAM A. ACDA \nMr. JAIME R. RACHO SR. \nChief \nAssistant Professor \nBureau of Post Harvest Research and \nExtension\nQuezon National Agricultural School \n( QNAS)\nCLSU Compound \nMuñoz, Nueva Ecija \n \nMalicboy, Pagbilao, Quezon \nMr. EDUARDO T. CAYABYAB \nMr. LITO BULAONG\nChief \nChief \nBureau of Post Harvest Research and \nExtension \nBureau of Post Harvest Research and Extension \nCLSU Compound \nMuñoz, Nueva Ecija \n \n \nCLSU Compound \nMuñoz, Nueva Ecija \n \nMr. LORENZO A. BELINO \n \nBenguet Farmers Multipurpose Cooperative \n \n The Participants in the national validation of this Training Regulation \n• \nRegion 1 \n• \n Region 8 \n• \nRegion 2 \n• \n Region 11 \n• \nRegion 3 \n• \n Region 12 \n• \nRegion 5 \n• \n Cordillera Autonomy Region \n \nThe Management and Staff of the TESDA Secretariat \n• QSO\n\n--- PDF PAGE 148 ---\nList of Published Training Reg