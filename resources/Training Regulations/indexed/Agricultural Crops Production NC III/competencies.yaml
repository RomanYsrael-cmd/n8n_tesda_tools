        "evidence_guide": {
          "source_text": "1. Critical Aspects of \nCompetency \nAssessment requires evidences that the candidate : \n1.1. \nselected and utilized various features and controls of a range \nof specialised application equipment to seed and fertilise a \ngrains crop \n1.2. \nprepared and serviced machinery and equipment \n1.3. \nassessed soil and weather conditions and determined \nappropriate seeding methods \n1.4. \nprepared seeds for planting, seed to plan ensuring optimum \nrange of depth and density \n1.5. \nrecognized and controlled hazards \n1.6. \nevaluated seeding operations and maintain records. \nThe skills and knowledge required to establish agronomic crops must \nbe transferable to a different work environment. For example this \nmay include different crops, planting techniques, machinery and \nfarms.\n2. Underpinning \nKnowledge and \nAttitudes \nKnowledge and understanding are essential to apply this standard in \nthe workplace, to transfer the skills to other contexts, and to deal with \nunplanned events. The knowledge requirements for this competency \nstandard are listed below: \n2.1. \ncrop types, preparation of seeds, seeding methods and \napplication techniques \n2.2. \nfertilizer types, rates of application and crop nutrient \nrequirements \n2.3. \ntypes of herbicides, insecticides and other pesticides, and \nalternative pest control methods (non-chemical) \n2.4. \neffects of weather conditions (normal and adverse) on seeding \nand fertilising applications \n2.5. \noperating principles and operating methods for machinery and \nequipment \n2.6. \nprinciples of weight distribution with regard to load shifting and \nvehicle movement \n2.7. \nsustainable land management and soil conservation \ntechniques \n2.8. \npositive environmental practices, negative environmental \nimpacts and minimisation measures associated with seeding \noperations \n2.9. \nrelevant provincial/municipal legislation, regulations and codes \nof practice with regard to workplace OHS and the use and \ncontrol of hazardous substances \n2.10. relevant provincial/municipal legislation and regulations with \nregard to licensing requirements and the use and control of \nmachinery and equipment \n2.11. personal protective clothing and equipment and when and \nhow it should be used \n2.12. procedures for cleaning, securing and storing machinery, \nequipment and materials\n\n--- PDF PAGE 67 ---\n_____________________________________________________________________________________ \nTR - Agricultural Crops Production NC III Promulgated April 2006 \n- 63 - \n2.13. farm policies with regard to seeding operations, and recording \nand reporting routines. \n3. Underpinning Skills \nTo achieve the performance criteria, some complementary skills are \nrequired. These include the ability to: \n3.1. \napply fertilizer, herbicides, insecticides, other pesticides and \nhazardous substances safely \n3.2. \nidentify types of weeds and insects harmful to crops \n3.3. \nidentify beneficial insects \n3.4. \nperform pre-operational and safety checks, servicing and \nmaintenance on machinery and equipment \n3.5. \ncalibrate, operate machinery and attach/detach equipment \n3.6. \ndemonstrate emergency operating procedures in normal and \nadverse conditions \n3.7. \nrecognize and report machinery damage, faults or \nmalfunctions and perform minor repairs \n3.8. \ndemonstrate safe, environmentally responsible and \nsustainable land management practices \n3.9. \nmonitor and minimize impacts to the environment associated \nwith sowing operations \n3.10. read and interpret manufacturers specifications, work and \nmaintenance plans, and MSDS \n3.11. clean, secure and store machinery and equipment \n3.12. interpret and apply task instructions, communicate with work \nteam and supervisor, and record and report equipment faults, \nworkplace hazards and accidents \n3.13. assess and calculate the application of fertilizer/pesticide \nrequirements and application rates, calibrate equipment and \ncalculate volumes, consumption and servicing requirements. \n4. Resource \nImplications \n \nThe following resources must be provided: \n4.1. \nworkplace where agronomic crops are to be established \n4.2. \nworkplace information relating to crop establishment \n4.3. \nfarm procedures relating to crop establishment \n5. Methods of \nAssessment \nCompetency should be assessed: \n5.1. \nthrough direct observation / demonstration \n5.2. \nportfolio assessment \n6. Context of \nAssessment \n6.1. \nAssessment should be in a workplace or a simulated \nworkplace. \n6.2. \nDemonstration of competency over time and on a number of \noccasions.\n\n--- PDF PAGE 68 ---\n_____________________________________________________________________________________ \nTR - Agricultural Crops Production NC III Promulgated April 2006 \n- 64 - \nUNIT OF COMPETENCY : \nUNDERTAKE AGRONOMIC CROP MAINTENANCE ACTIVITIES \nUNIT CODE \n:"
