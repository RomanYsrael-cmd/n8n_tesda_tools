        "evidence_guide": {
          "source_text": "1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 \nCorrectly identified appropriate farm tools and equipment \n1.2 \nOperated farm equipment according to manual specification \n1.3 \nPerformed preventive maintenance \n2. Underpinning \nKnowledge and \nAttitudes \n \n2.1 \nSafety Practices \n2.1.1 Ideal good work habits to demonstrate to workers easy \nand safety standards during operation of farm \nequipment \n2.2 \nCodes and Regulations \n2.2.1 Environmental Compliance Certificate (ECG) \n2.2.2 Effective work supervision in the operations of farm \nequipment \n2.3 \nTools & Equipment: Uses and Specification \n2.3.1 Knowledge in calibrating and use of equipment \n2.3.2 Safety keeping of equipments every after use \n2.4 \nMaintenance \n2.4.1 Regular upkeep of equipments \n2.4.2 Preventive maintenance skills \n2.5 \nValues \n2.5.1 Positive outlook towards work \n2.5.2 Possesses pre-emptive/anticipatory skills \n3. Underpinning Skills \n3.1 \nAbility to recognized defective farm equipment \n3.2 \nPerform proper management practices of safety measures \n4. Method of \nAssessment \n \nCompetency in this unit must be assessed through: \n4.1 \nDirect observation with oral questioning \n4.2 \nPractical demonstration with oral questioning \n4.3 \nThird-party report \n5. Resource \nImplications \n5.1 \nService/operational manual of farm tools and equipment \n5.2 \nTools and equipment \n5.3 \nFarm implements \n6. Context of \nAssessment \n6.1 \nAssessment may occur in the workplace or in a simulated \nworkplace or as part of a team under limited supervision\n\n--- PDF PAGE 30 ---\n_____________________________________________________________________________________ \nTR - Agricultural Crops Production NC III Promulgated April 2006 \n- 26 - \nUNIT OF COMPETENCY : \nPERFORM ESTIMATION AND BASIC CALCULATION \nUNIT CODE \n:"
