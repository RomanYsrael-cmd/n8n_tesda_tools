        "source_text": "AGR611313 \nUNIT DESCRIPTOR : \nThis unit covers the skills and knowledge required to control weeds, \ntaking into consideration Integrated Pest Management (IPM) \noptions. Implementation is likely to be under limited supervision \nfrom others with checking only related to overall progress. \nResponsibility for and limited organization of the work of others may \nbe involved. Implementation requires the application of knowledge \nin areas such as weed recognition, biology and control, and the \nlifecycles of weed predators and hosts. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables\n1. Assess weed \ninfestation \n1.1 \nScope, density and size of the infestation is assessed. \n1.2 \nWeeds and beneficial organisms are identified and reported \nor recorded in field notes. \n1.3 \nLevels of weed infestations tolerated by the client, market or \nenvironment are identified from the integrated pest \nmanagement (IPM) strategy. \n1.4 \nInfestation levels, above which plant health or growth \nobjectives are compromised are identified. \n1.5 \nProfessional advice is obtained as required according to \nenterprise guidelines.\n2. Plan the \nimplementation of \ncontrol measures \n2.1 \nControl measures suitable for the infestation are selected \nfrom IPM strategy. \n2.2 \nTools, equipment and implements are selected for each \nwork activity according to enterprise work procedures. \n2.3 \nOHS hazards are identified, risks assessed, controls \nimplemented and reported to the supervisor. \n2.4 \nSuitable safety equipment and personal protective \nequipment (PPE) are selected, used, maintained and stored. \n2.5 \nControl measures selected need to be in full consideration of \nenvironmental implications \n2.6 Control of harmful weeds with the use of cover crops\n3. Implement control \nmeasures \n3.1 \nEnterprise work team, contractors and IPM product suppliers \nare coordinated in a sequential, timely and effective manner in \nconsultation with the supervisor. \n3.2 \nControl measures are implemented according to the IPM \nprinciples (e.g. water management for rice). \n3.3 \nImplementation of IPM activities is undertaken according to \nOHS requirements. \n3.4 \nA clean and safe work area is maintained throughout and on \ncompletion of each work activity. \n3.5 Land is prepared to ensure weed elimination. \n3.6 \nRecords are maintained as required by legislation and \nenterprise guidelines.\n4. Monitor control \nmethods \n4.1 \nControl methods are monitored to identify side effects to other \nplants, animals or external environment. \n4.2 \nEffectiveness of control methods are assessed in reference to \nspecified industry and enterprise standards. \n4.3 \nAdjustments to IPM control methods are implemented where \nnecessary to meet enterprise specifications.\n\n--- PDF PAGE 52 ---\n_____________________________________________________________________________________ \nTR - Agricultural Crops Production NC III Promulgated April 2006 \n- 48 - \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Weeds \n1.1. \nThese may include weeds which present a potential risk for \nthe enterprise, industry or environment. \n2. Beneficial \norganisms \n2.1. \nThese may include volunteer or cultivated plants that out-\ncompete the weed, insects and other non-vertebrates, and \nmicro organisms that attack the weed. \n3. Control measures \n3.1. \nThese may include targeted chemical application, the \napplication of non-chemical controls including organically or \nnaturally ingredient based sprays, controlled release of \npredatory organisms, or the application of cultural control \nmethods including removal and disposal of weeds. \n4. Tools, equipment \nand implements \n4.1. \nStandard horticultural tools such as gardening implements, \nmechanised and manually operated spray applicators and \ncultivators, tractors and trailed equipment may be required. \nMonitoring equipment for the implementation of an IPM \nprogram may include insect traps, soil, fertilizer and plant \ntissue test kits and sampling equipment. \n5. OHS hazards \n5.1. \nHazards may include chemicals and hazardous substances, \nmanual handling, operating machinery tools and equipment, \nnoise, dust, solar radiation, falls and tripping. \n6. Personal protective \nequipment \n6.1. \nPPE may include hat, boots, overalls, gloves, goggles, \nrespirator or face mask, hearing protection, sunscreen lotion. \n7. Environmental \nimplications \n7.1. \nBeneficial environmental impacts may occur where reduced \nand informed targeting of chemicals, fertilizers and water to \nthe site and recycling within the system, result in minimal \nescape of contaminants to the external environment. \nBeneficial impacts may also result from improved production, \nhealthier ecosystems, more efficient water and nutrient \nutilization and reduced weed numbers. \n7.2. \nDetrimental environmental impacts may arise where IPM \nactivities produce excess noise, dust or water, or the systems \ndo not function effectively because of inadequate \nimplementation techniques. \n8. IPM principles \n8.1. \nStandards may include those established by registered \nindustry associations, clients or markets of the enterprise, land \nmanagement agencies or quality assurance program. \n9. OHS requirements \n9.1. \nOHS requirements may include identifying hazards, assessing \nrisks and implementing controls, cleaning, maintaining and \nstoring tools, equipment and machinery, appropriate use, \nmaintenance and storage of PPE including sun protection, \nsafe operation of tools, equipment and machinery, safe \nhandling, use and storage of chemicals, organically based \nmaterials and hazardous substances, correct manual \nhandling, basic first aid, safety procedures for protection of \nothers, personal hygiene, and reporting problems to \nsupervisors.\n\n--- PDF PAGE 53 ---\n_____________________________________________________________________________________ \nTR - Agricultural Crops Production NC III Promulgated April 2006 \n- 49 - \nVARIABLE \nRANGE \n10. Clean and safe \nwork area \n10.1. Tasks may include disabling unused tools, equipment and \nmachinery and storing neatly out of the way of IPM activities, \ncorrect storage of personal protective equipment, safely \nstoring materials on site, and swiftly and efficiently removing \nand processing debris and waste from the work area. \n11. Records \n11.1. Records may include types of weeds and beneficial organisms \npresent, numbers of weeds and beneficials present, \ntreatments applied, date of application, application rates, \nsuccess of treatments, economic thresholds.\n\n--- PDF PAGE 54 ---\n_____________________________________________________________________________________ \nTR - Agricultural Crops Production NC III Promulgated April 2006 \n- 50 - \nEVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency \nAssessment requires evidences that the candidate : \n1.1. \nplanned, implemented and monitored weed control \nsuccessfully according to enterprise guidelines and industry \nbest practice \nThe skills and knowledge required to control weeds must be \ntransferable to a different work environment. For example, this could \ninclude different weed species, enterprise situations and control \nmethods. \n2. Underpinning \nKnowledge and \nAttitudes \nKnowledge and understanding are essential to apply this standard in \nthe workplace, to transfer the skills to other contexts and to deal with \nunplanned events. The knowledge requirements for this competency \nstandard are listed below. \n2.1. \nWeed recognition and IPM concepts \n2.2. \nEconomic, aesthetic or environmental thresholds for a range \nof weeds \n2.3. \nChemical, biological and cultural control methods and \ntreatments available to the enterprise within the parameters of \nan IPM program \n2.4. \nRange and use of tools, equipment and machinery available \nto the enterprise for implementing the control measures \n2.5. \nRange of site monitoring and analysis techniques that may be \nused to implement an IPM program \n2.6. \nAssociation of IPM methods with site limitations, \nenvironmental implications, end market and horticultural \nobjectives for the site \n2.7. \nOHS issues and legislative requirements associated with \nhazardous substances. regulations and Codes of Practice \n2.8. \nOHS responsibilities of employers and employees \n2.9. \nCorrect wearing/fit of personal protective equipment \n3. Underpinning Skills \nTo achieve the performance criteria, appropriate literacy and \nnumeracy levels as well as some complementary skills are required. \nThese include the ability to: \n3.1. \nrecognise of a range of weeds and beneficial organisms within \na particular enterprise \n3.2. \ncommunicate with work team members, supervisors, \ncontractors and consultants \n3.3. \nutilize proforma reporting, analysis and work procedure \ndocuments \n3.4. \nunderstand IPM symbols and information \n3.5. \ninterpret and apply IPM program spatial and logistical \nspecifications \n3.6. \ncorrect fitting, cleaning and storage of personal protective \nequipment \n3.7. \ninterpret and apply test results and calculate the quantities \nand applications rates of control materials\n\n--- PDF PAGE 55 ---\n_____________________________________________________________________________________ \nTR - Agricultural Crops Production NC III Promulgated April 2006 \n- 51 - \n \n3.8. \ncoordinate work group, contractors and own activities to \nsequentially and effectively complete IPM activities in a timely \nand cost effective manner \n4. Resource \nImplications \n \nThe following resources must be provided: \n4.1. \nworkplace with a range of weeds \n4.2. \ntools, equipment and materials for controlling weeds \n4.3. \nenterprise procedures, work plans relevant to weed control \n5. Methods of \nAssessment \nCompetency should be assessed: \n5.1. \nthrough direct observation / demonstration \n5.2. \nportfolio assessment \n6. Context of \nAssessment \n6.1. \nAssessment should be in a workplace. or in a simulated \nworkplace \n6.2. \nDemonstration of competency over time and on a number of \noccasions\n\n--- PDF PAGE 56 ---\n_____________________________________________________________________________________ \nTR - Agricultural Crops Production NC III Promulgated April 2006 \n- 52 - \nUNIT OF COMPETENCY : \nPREPARE AND APPLY CHEMICALS \nUNIT CODE \n:"
