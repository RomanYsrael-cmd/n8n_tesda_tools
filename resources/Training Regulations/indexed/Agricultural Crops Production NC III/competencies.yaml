        "source_text": "AGR321203 \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge, skills and attitudes required to \nperform basic workplace calculations relating to feeds, fertilizer and \nrelated quantities. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1. Perform estimation \n1.1 \nJob requirements are identified from written or oral \ncommunications \n1.2 \nQuantities of materials and resources required to complete a \nwork task are estimated \n1.3 \nThe time needed to complete a work activity is estimated \n1.4 \nAccurate estimate for work completion are made \n1.5 \nEstimate of materials and resources are reported to \nappropriate person \n2. Perform basic \nworkplace calculation \n2.1 \nCalculations to be made are identified according to job \nrequirements \n2.2 \nCorrect method of calculation identified \n2.3 \nSystem and units of measurement to be followed are \nascertained \n2.4 \nCalculation needed to complete work tasks are performed \nusing the four basic process of addition, division, multiplication \nand subtraction \n2.5 \nCalculate whole fraction, percentage and mixed when are \nused to complete the instructions \n2.6 \nNumber computed in self checked and completed for \nalignment\n\n--- PDF PAGE 31 ---\n_____________________________________________________________________________________ \nTR - Agricultural Crops Production NC III Promulgated April 2006 \n- 27 - \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Calculation \n1.1 \nQuantity of feeds \n1.2 \nAmount of fertilizer \n1.3 \nAmount of medicines \n2. Method of calculation \n \n2.1 \nAddition \n2.2 \nSubtraction \n2.3 \nMultiplication \n2.4 \nDivision \n2.5\nRatio and proportion\n3. System of \nmeasurement \n3.1 \nEnglish \n3.2 \nMetric \n4. Units of \nmeasurement \n4.1 \nArea Units \n4.2 \nVolume Units \n4.3 \nWeight Units\n\n--- PDF PAGE 32 ---\n_____________________________________________________________________________________ \nTR - Agricultural Crops Production NC III Promulgated April 2006 \n- 28 - \nEVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 \nPerformed estimation \n1.2 \nPerformed basic workplace calculation \n1.3 \nApplied corrective measures as maybe necessary \n2. Underpinning \nKnowledge and \nAttitudes \n \n2.1 \nMathematics \n2.1.1 Basic mathematical operations \n2.1.2 Percentage and ratios \n2.1.3 Unit Conversion \n2.1.4 Basic accounting principles and procedures \n2.1.4.1 Production cost \n2.1.4.2 Sales \n2.1.4.3 Accounts receivables/payables \n2.2 \nSystems, Processes and Operations \n2.2.1 Knowledge in different management practices and \noperational procedures \n2.3 Values \n2.3.1 Safety-consciousness \n2.3.2 Time-consciousness and management \n2.3.3 Cost-consciousness \n2.3.4 Precision \n3. Underpinning Skills \n3.1 \nAbility to perform basic calculation \n3.2 \nCommunicate effectively \n4. Method of \nAssessment \n \nCompetency in this unit must be assessed through: \n4.1 \nPractical demonstration \n4.2 \nWritten examination \n5. Resource \nImplications \n5.1 Relevant tools and equipment for basic calculation \n5.2 Recommended data \n6. Context of \nAssessment \n6.1 \nAssessment may occur in the workplace or in a simulated \nworkplace or as part of a team under limited supervision\n\n--- PDF PAGE 33 ---\n_____________________________________________________________________________________ \nTR - Agricultural Crops Production NC III Promulgated April 2006 \n- 29 - \nCORE COMPETENCIES \n \n \nUNIT OF COMPETENCY : \nPREPARE LAND FOR AGRICULTURAL CROP PRODUCTION \nUNIT CODE \n:"
