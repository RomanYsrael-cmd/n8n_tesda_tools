        "source_text": "AGR611320 \nUNIT DESCRIPTOR \n: \nThis unit covers the skills and knowledge required for establishing \nagronomic crops. It includes preparing machinery and equipment, \nploughing/cultivating, seeding, applying any pre-planting \ntreatments, maintaining machinery and equipment, relevant record \nkeeping, and it requires the application of skills and knowledge to \nuse specialised equipment to carry out seeding and fertilizer \noperations appropriate to soil and weather conditions. Equipment \nand machinery may be animal-powered. In addition, it requires an \nawareness of licensing requirements, safe workplace and positive \nenvironmental practices associated with seeding operations \nincluding sustainable land management. The work functions in this \nstandard involve the application of some judgement and discretion \nand are likely to be carried out under minimal supervision within \nfarm guidelines. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables\n1. Prepare machinery \nand equipment for \nuse \n1.1 \nMachinery and equipment is selected and confirmed against \nthe work plan and prepared to manufacturers specifications. \n1.2 \nEquipment is securely attached and calibrated for operation to \nmanufacturers specifications. \n1.3 \nExisting and potential OHS hazards in the workplace are \nidentified, risks assessed and controlled in line with farm \nrequirements. \n2. Prepare for \nagronomic crop \nestablishment \n2.1 \nSoil and weather conditions are monitored for optimal \nseeding conditions. \n2.2 \nSoil conservation and sustainable land management practices \nand procedures are recognized and confirmed in accordance \nwith farm requirements and environmental concerns. \n2.3 \nSeeding, fertilizer, and pest and weed control requirements \nare confirmed against the work plan and prepared to \nmanufacturers specifications using safe handling procedures. \n2.4 \nContingency plans are prepared for unusual seasonal \nconditions and pest/disease outbreaks. \n3. Sow the crop \n3.1 \nSuitable personal protective clothing and equipment is \nselected, used and maintained in accordance with OHS \nrequirements. \n3.2 \nSeeding and fertilizer applications are carried out in line with \nthe work plan. \n3.3 \nPest and weed control treatment is co-ordinated with seeding \nand fertilizer applications as required. \n3.4 \nEnvironmental implications associated with sowing \noperations are identified, assessed and controlled in line with \nfarm requirements.\n\n--- PDF PAGE 63 ---\n_____________________________________________________________________________________ \nTR - Agricultural Crops Production NC III Promulgated April 2006 \n- 59 - \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables\n4. Complete seeding \noperations \n4.1 \nSeeding, machinery and equipment operation records are \nmaintained in accordance with farm requirements. \n4.2 \nMachinery and equipment damage, malfunctions or irregular \nperformance are reported in line with farm requirements. \n4.3 \nMachinery and equipment is cleaned, secured and stored in \nline with manufacturer’s specifications and farm requirements.\n\n--- PDF PAGE 64 ---\n_____________________________________________________________________________________ \nTR - Agricultural Crops Production NC III Promulgated April 2006 \n- 60 - \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Machinery and \nequipment \n1.1. \nTractors, seed drills, air seeders, plough, harrows, cultivators, \nscarifiers, trucks, augers and bins. Equipment and machinery \nmay be animal-powered. \n1.2. \nManual sowing is likely to be used in a number of situations \nand there would be basic equipment associated with this \nmethod of crop establishment. \n2. Work plan \n2.1. \nLocation, crop type (cereals, legumes, cotton,) and seeding \nmethod, soil condition (structure, moisture), seeding practices \n(sowing time, sowing rate, optimal depth of sowing, seed \ndressing, tilth to match seed size), fertilizer type and \napplication, pest and weed control type and application, \nmachinery, equipment, resources and materials requirements, \nsupervisors instructions, timeframe for work completion, crop \nlay-out and crop design and reporting requirements. \n3. Preparation of \nmachinery and \nequipment \n3.1. \nPreparation may include safe transporting, inspection, pre-\nstart and safety checks, routine servicing and maintenance, \ncalibration, checking and monitoring machinery settings. \n4. OHS \n \n \nSystems and procedures for: \n4.1. \nthe safe operation and maintenance of machinery and \nequipment including hydraulics and guarding of exposed \nmoving parts. \n4.2. \nidentify hazards, assessing and reporting risks. \n4.3. \nemergency operating procedures. \n4.4. \nsafe lifting, carrying and handling techniques. \n4.5. \nmanual handling systems and procedures, handling and \nstorage of hazardous substances and grain, and the \nappropriate use of personal protective clothing and \nequipment. \n4.6. \nSafe systems and procedures for outdoor work including \nprotection from solar radiation, protection of people in the \nworkplace, protection from hazardous noise, mechanical \nvibration, organic and other dusts, and protection from fire \nrisk. \n5. OHS hazards \n5.1. \nExposure to loud noise and fumes, solar radiation, dust, \nergonomic hazards associated with posture and vibration, \nhazardous substances, the presence of bystanders, slippery \nor uneven terrain, potholes, stumps, ditches, gullies, \nembankments, obstacles (rocks, logs, fences, debris), \nadverse weather conditions, mechanical malfunctions and \nexposed moving parts, and other machinery including \nhydraulics.\n\n--- PDF PAGE 65 ---\n_____________________________________________________________________________________ \nTR - Agricultural Crops Production NC III Promulgated April 2006 \n- 61 - \nVARIABLE \nRANGE \n6. Farm requirements \n6.1. \nStandard operating procedures (SOPs), industry standards, \nproduction schedules, Material Safety Data Sheets (MSDS), \nwork notes, product labels, manufacturers specifications, \noperators manuals, farm policies and procedures (including \nwaste disposal, recycling and re-use guidelines), OHS \nprocedures, supervisors oral or written instructions, and work \nplans. \n7. Agronomic crops \n7.1. \nAgronomic crops covered by this unit include coarse grains, \ngrain legumes, coffee, coconuts, cotton, soya beans, peanuts \nand sugar cane. \n \n8. Optimal seeding \nconditions \n \n8.1. \nThis may be based on the history of seasonal weather \nproviding a reasonable risk for dry seeding, and soil moisture \nconditions appropriate for grains crop germination. \n9. Personal \nprotective clothing \nand equipment \n9.1. \nBoots, hat/hard hat, overalls, gloves, protective eyewear, \nhearing protection, respirator or face mask, and sun protection \n(sun hat, sunscreen). \n10. Environmental \nimplications \n10.1. Positive environmental impacts may result from the conduct of \nsustainable land use practices including stubble retention, \nminimum tillage, and contour sowing to reduce erosion risks. \nIt may also include the use of non-chemical alternatives for \npesticides and cleaning agents, effective water re-use \nsystems, and the reduction of noise and exhaust emissions. \n10.2. Negative environmental impacts may result from high activity \nvehicle traffic and over-cultivation practices causing erosion, \nincreased water run-off speeds, soil compaction, soil \ndisturbance and loss, soil degradation, dust, contamination of \nsoil and water through the use of fertilizer and chemicals, \nspray drift, incorrect use and disposal of chemicals and \nresidues, oils and containers, greases, and detergents used in \ncleaning and maintenance procedures.\n\n--- PDF PAGE 66 ---\n_____________________________________________________________________________________ \nTR - Agricultural Crops Production NC III Promulgated April 2006 \n- 62 - \nEVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency \nAssessment requires evidences that the candidate : \n1.1. \nselected and utilized various features and controls of a range \nof specialised application equipment to seed and fertilise a \ngrains crop \n1.2. \nprepared and serviced machinery and equipment \n1.3. \nassessed soil and weather conditions and determined \nappropriate seeding methods \n1.4. \nprepared seeds for planting, seed to plan ensuring optimum \nrange of depth and density \n1.5. \nrecognized and controlled hazards \n1.6. \nevaluated seeding operations and maintain records. \nThe skills and knowledge required to establish agronomic crops must \nbe transferable to a different work environment. For example this \nmay include different crops, planting techniques, machinery and \nfarms.\n2. Underpinning \nKnowledge and \nAttitudes \nKnowledge and understanding are essential to apply this standard in \nthe workplace, to transfer the skills to other contexts, and to deal with \nunplanned events. The knowledge requirements for this competency \nstandard are listed below: \n2.1. \ncrop types, preparation of seeds, seeding methods and \napplication techniques \n2.2. \nfertilizer types, rates of application and crop nutrient \nrequirements \n2.3. \ntypes of herbicides, insecticides and other pesticides, and \nalternative pest control methods (non-chemical) \n2.4. \neffects of weather conditions (normal and adverse) on seeding \nand fertilising applications \n2.5. \noperating principles and operating methods for machinery and \nequipment \n2.6. \nprinciples of weight distribution with regard to load shifting and \nvehicle movement \n2.7. \nsustainable land management and soil conservation \ntechniques \n2.8. \npositive environmental practices, negative environmental \nimpacts and minimisation measures associated with seeding \noperations \n2.9. \nrelevant provincial/municipal legislation, regulations and codes \nof practice with regard to workplace OHS and the use and \ncontrol of hazardous substances \n2.10. relevant provincial/municipal legislation and regulations with \nregard to licensing requirements and the use and control of \nmachinery and equipment \n2.11. personal protective clothing and equipment and when and \nhow it should be used \n2.12. procedures for cleaning, securing and storing machinery, \nequipment and materials\n\n--- PDF PAGE 67 ---\n_____________________________________________________________________________________ \nTR - Agricultural Crops Production NC III Promulgated April 2006 \n- 63 - \n2.13. farm policies with regard to seeding operations, and recording \nand reporting routines. \n3. Underpinning Skills \nTo achieve the performance criteria, some complementary skills are \nrequired. These include the ability to: \n3.1. \napply fertilizer, herbicides, insecticides, other pesticides and \nhazardous substances safely \n3.2. \nidentify types of weeds and insects harmful to crops \n3.3. \nidentify beneficial insects \n3.4. \nperform pre-operational and safety checks, servicing and \nmaintenance on machinery and equipment \n3.5. \ncalibrate, operate machinery and attach/detach equipment \n3.6. \ndemonstrate emergency operating procedures in normal and \nadverse conditions \n3.7. \nrecognize and report machinery damage, faults or \nmalfunctions and perform minor repairs \n3.8. \ndemonstrate safe, environmentally responsible and \nsustainable land management practices \n3.9. \nmonitor and minimize impacts to the environment associated \nwith sowing operations \n3.10. read and interpret manufacturers specifications, work and \nmaintenance plans, and MSDS \n3.11. clean, secure and store machinery and equipment \n3.12. interpret and apply task instructions, communicate with work \nteam and supervisor, and record and report equipment faults, \nworkplace hazards and accidents \n3.13. assess and calculate the application of fertilizer/pesticide \nrequirements and application rates, calibrate equipment and \ncalculate volumes, consumption and servicing requirements. \n4. Resource \nImplications \n \nThe following resources must be provided: \n4.1. \nworkplace where agronomic crops are to be established \n4.2. \nworkplace information relating to crop establishment \n4.3. \nfarm procedures relating to crop establishment \n5. Methods of \nAssessment \nCompetency should be assessed: \n5.1. \nthrough direct observation / demonstration \n5.2. \nportfolio assessment \n6. Context of \nAssessment \n6.1. \nAssessment should be in a workplace or a simulated \nworkplace. \n6.2. \nDemonstration of competency over time and on a number of \noccasions.\n\n--- PDF PAGE 68 ---\n_____________________________________________________________________________________ \nTR - Agricultural Crops Production NC III Promulgated April 2006 \n- 64 - \nUNIT OF COMPETENCY : \nUNDERTAKE AGRONOMIC CROP MAINTENANCE ACTIVITIES \nUNIT CODE \n:"
