        "evidence_guide": {
          "source_text": "1. Critical Aspects of \nCompetency \nAssessment requires evidences that the candidate : \n1.1 \nPrepared safely land for crop production to the requirements \nof the organization, and to the needs of the crop. \nThe skills and knowledge required to prepare land for crop \nproduction must be transferable to a different work environment. \nFor example, this could include different crop types, machinery and \nequipment, and farm procedures.\n2. Underpinning \nKnowledge and \nAttitudes \nKnowledge and understanding are essential to apply this standard in \nthe workplace, to transfer the skills to other contexts, and to deal with \nunplanned events. The knowledge requirements for this competency \nstandard are listed below: \n2.1 \nmethods of cultivating a range of soil types \n2.2 \nenvironmental issues of cultivating soil for planting, such as \ndrainage and irrigation systems, soil amelioration and waste \ndisposal procedures \n2.3 \na range of pre-planting treatments, their purpose and method \nof application \n2.4 \nOHS guidelines, procedures, and principles including manual \nhandling.\n3. Underpinning Skills \nTo achieve the performance criteria, appropriate literacy and \nnumeracy levels as well as some complementary skills are required. \nThese include the ability to: \n3.1 \ninterpret production/planting plans, produce standards, quality \nspecifications, work procedure documents \n3.2 \nimplement cropping pattern \n3.3 \nmeasure materials and site plan specifications \n3.4 \noperate, adjust and calibrate cultivation equipment safely \n3.5 \ncomplete pre- and post-operational checks on tools, vehicles \nand equipment \n3.6 \nperform routine safety, service and maintenance procedures \non tools, harvester and equipment \n3.7 \nread and interpret manufacturers specifications, work and \nmaintenance plans, and Material Safety Data Sheets \n3.8 \ninterpret and apply task instructions, communicate with work \nteam and supervisor, and record and report faults, workplace \nhazards and accidents.\n4. Resource Implication \n \nThe following resources must be provided: \n4.1 \nworkplace with vegetables or fruits that require regulating \nplant growth, crop yield and/or quality \n4.2 \nworkplace information relating to crop regulation \n4.3\nfarm procedures relating to crop regulation \n5. Methods of \nAssessment \nCompetency should be assessed: \n5.1 \nthrough direct observation / demonstration \n5.2\nportfolio assessment.\n6. Context of \nAssessment \n6.1 \nAssessment should be in a workplace or in a simulated \nworkplace. \n6.2 \nDemonstration of competency over time and on a number of \noccasions.\n\n--- PDF PAGE 38 ---\n_____________________________________________________________________________________ \nTR - Agricultural Crops Production NC III Promulgated April 2006 \n- 34 - \nUNIT OF COMPETENCY : \nIMPLEMENT POST-HARVEST PROGRAM \nUNIT CODE \n:"
        },
        "source_text": "AGR611310 \nUNIT DESCRIPTOR \n: \nThis unit covers the skills and knowledge required to prepare \nequipment, cultivate the site, apply any pre-planting treatments, and \ncare for the vehicles and equipment on completing the activity. \nEquipment and machinery may be animal-powered. It includes the \ncompletion of documentation and logbooks for the operation. \n \n \nPreparing land for crop production is likely to be carried out under \nlimited supervision from others with checking only related to overall \nprogress. Preparing land for crop production is usually done within \nestablished routines, methods and procedures. Some discretion \nand judgement is required in the selection of equipment and \nmaterials, organization of work and services. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables\n1 Prepare for \ncultivation \n1.1 \nRequirements for the work to be undertaken are interpreted \nfrom the planting plan and confirmed with the manager. \n1.2 \nThe method and order of cultivation is identified and \ninterpreted from the planting plan. \n1.3 \nOHS hazards are identified, risks assessed and suitable \ncontrols are implemented. \n1.4 \nSuitable personal protective equipment is selected, used \nand maintained. \n1.5 \nThe environmental implications of cultivating the site are \nidentified, likely outcomes assessed and, if necessary, \nresponsible action is taken. \n2 Prepare the \ncultivating equipment \n2.1 \nThe vehicles and equipment required for site cultivation are \nselected according to the planting plan and organization \nguidelines. \n2.2 \nThe vehicles and equipment are serviced, adjusted for the \nconditions and worn parts are replaced to ensure reliability \nduring cultivation. \n2.3 \nAll containers, leftover fluids, waste and debris from the \nmaintenance and servicing work are disposed of safely and \nappropriately. \n2.4 \nAll maintenance and servicing is documented according to \nthe requirements of the organization’s record keeping system.\n\n--- PDF PAGE 34 ---\n_____________________________________________________________________________________ \nTR - Agricultural Crops Production NC III Promulgated April 2006 \n- 30 - \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables\n3 Cultivate soil \n3.1 \nPrevious crop or land clearance debris is removed, \nincorporated or burnt according to the organizations \nguidelines. \n3.2 \nThe cultivation plan is followed and completed for each site. \n3.3 \nOHS hazards are identified, risks assessed and suitable \ncontrols are implemented. \n3.4 \nSuitable personal protective equipment is selected, used and \nmaintained. \n3.5 \nVehicles and equipment are operated in a safe, effective and \nefficient manner and at speeds to suit the conditions. \n3.6 \nThe quality of cultivation is maximized by continually checking \nand adjusting the vehicles and equipment as necessary. \n3.7 \nAll time, resource and quality requirements of the planting \nplan are met. \n4 Prepare site for \nplanting \n4.1 \nThe planting layout and soil profiles are completed as \nrequired by the planting plan. \n4.2 \nWeed and pest control measures are taken as required by \nthe planting plan. \n4.3 \nFertilizers, ameliorants, and/or other pre-planting treatments \nare applied as required by the planting plan \n4.4 \nThe environmental implications of site preparation are \nidentified, likely outcomes assessed and, if necessary, \nresponsible action is taken. \n5 Complete land \npreparation \noperations \n5.1 \nEquipment is cleaned in accordance with manufacturers \nspecifications, organizational procedures and regulations. \n5.2 \nVehicles and equipment are cleaned and stored to minimize \ndamage according to manufacturers specifications, \norganizational procedures and regulations. \n5.3 \nAll containers, leftover fluids, waste and debris from the \ncleaning and maintenance work are disposed of safely and \nappropriately. \n5.4 \nAll required records and documentation are completed \naccurately and promptly according to organizational \nrequirements.\n\n--- PDF PAGE 35 ---\n_____________________________________________________________________________________ \nTR - Agricultural Crops Production NC III Promulgated April 2006 \n- 31 - \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Planting plan \nAny crop grown by the organization for production or pasture. \n1.1. \nCereals \n1.2. \nLegumes \n1.3. \nPulses \n1.4. \nOilseeds \n1.5. \npasture seeds \n1.6. \ncotton \n1.7. \nsugar cane. \n2. Occupational \nHealth and Safety \n(OHS) \nThe range of actions are both systemic and at an operational level. \nThese are listed below: \n2.1 \nSystems should be in place to ensure the safe operation and \nmaintenance of machinery and equipment. Precautions \nshould also be in place to minimize exposure to noise and \norganic and other dusts, and to external elements, including \nsolar radiation. Systems and procedures for preparing sites \nfor planting, as well as working with and around electricity, \nshould also be in place. Safe systems should be in place for \nstubble and grass burning, and for storing, handling and \ntransporting hazardous substances. \n2.2 \nFixtures should be in place in all storage sheds, including \nappropriate access ladders, hand rails and ladder cages. \n2.3 \nPersonal protective equipment should be selected, used and \nmaintained. \n2.4 \nEnvironmental conditions should be controlled e.g., keeping \nmoisture levels as low as possible will reduce the likelihood of \nfire. \n2.5 \nProcedures should be in place and used for working with \nmoving vehicles and equipment. \n2.6 \nRecord keeping should ensure that requirements in relation to \nproperly observing and using product labels and MSDS \nsheets, instruction manuals and written organizational \nprocedures.\n3. Personal \nprotective \nequipment \n3.1 \nBoots \n3.2 \nhat/hard hat \n3.3 \noveralls, gloves \n3.4 \nprotective eyewear \n3.5 \nhearing protection \n3.6 \nrespirator or face mask \n3.7\nsun protection (sun hat, sun screen).\n4. Environmental \nimplications \n4.1 \nDetrimental environmental impacts may result from excessive \nnoise and exhaust emissions, the incorrect use and disposal \nof maintenance debris (oils, containers, chemical residues), \ndust, and hazardous substances (fuel). Impacts may also \ninclude run-off flows of water and cleaning agents from \nservicing, maintenance and cleaning activities.\n\n--- PDF PAGE 36 ---\n_____________________________________________________________________________________ \nTR - Agricultural Crops Production NC III Promulgated April 2006 \n- 32 - \nVARIABLE \nRANGE \n5. Site conditions \n5.1 \nIt might be the site of a previous years crop or have been \nused for grazing or laid fallow for a period prior to cultivation. \nIt may also be land cleared of virgin forest, low lying land \nverging on mangroves, sloping high land, existing cleared \nland, and may have soil or surface water. \n6. Vehicles and \nequipment \n6.1 \nVehicles might include tractors, trucks and four-wheel drive \nvehicles. Alternatively animal power may be used to pull or \ntow equipment. \n6.2 \nEquipment might be mounted or trailing and may include \nploughs, cultivators, scarifiers, fertilizer spreaders, spraying \nequipment, crop/stick puller, cultivators, buster, disc, lister, \nripper, mulcher, tandem or offset discs, or rakes. \n7. Documented \ninformation \n7.1 \nRecord keeping systems used may be either paper-based or \ndigital, and information will be recorded into logbooks or other \nrecords. \n8. Previous crop or \nland clearance \ndebris \n8.1 \nThe planting plan might require that such debris is removed \n(or sprayed), incorporated (smashing, cultivating, mulching, \nslashing), burnt or used for grazing for a period. \n9. Equipment is \noperated safely \n9.1 \nThe speeds used should be appropriate for the equipment, \nground and the crop conditions, and all pre- and post-start up \nchecks should be undertaken. \n10. Soil profile \n10.1 Where laser levelling is required, assistance may be required \nfor contractors in surveying and pegging. Also soil testing and \nanalysis may be required. \n11. Weed and pest \ncontrol measures \n11.1 Weeds may be controlled by using an integrated pest \nmanagement program including the application of herbicides \nand biological control agents, grazing, slashing, burning or \nhay cutting. . Weeds may be controlled at various times, in \nthe preceding year, pre-sowing, post-sowing, pre-emergent, at \nvarious stages of crop and weed growth, as recommended. \n11.2 Insect pests may be controlled by using an integrated pest \nmanagement program including cultural means – cultivation, \netc., insecticides, biological control agents, or removal of food \nsupply using weed control techniques. \n12. Treatments \n12.1 Use of insecticides, fertilizers and physical agents should \nmeet legislative, manufacturers and organization \nrequirements. \n13. Environmental \nimpacts \n13.1 Detrimental effects such as erosion, loss of moisture, \ndebilitating germination rates, elimination of beneficial and \nindigenous microbes and polluting water bodies. \n14. Documentation \n14.1 All chemical usage should be recorded as well as any \nnecessary recording of site size, and vehicle and equipment \nuse. Additionally, any assessment of pests and weeds, OHS \nhazards, or other observations should be recorded \nappropriately.\n\n--- PDF PAGE 37 ---\n_____________________________________________________________________________________ \nTR - Agricultural Crops Production NC III Promulgated April 2006 \n- 33 - \nEVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency \nAssessment requires evidences that the candidate : \n1.1 \nPrepared safely land for crop production to the requirements \nof the organization, and to the needs of the crop. \nThe skills and knowledge required to prepare land for crop \nproduction must be transferable to a different work environment. \nFor example, this could include different crop types, machinery and \nequipment, and farm procedures.\n2. Underpinning \nKnowledge and \nAttitudes \nKnowledge and understanding are essential to apply this standard in \nthe workplace, to transfer the skills to other contexts, and to deal with \nunplanned events. The knowledge requirements for this competency \nstandard are listed below: \n2.1 \nmethods of cultivating a range of soil types \n2.2 \nenvironmental issues of cultivating soil for planting, such as \ndrainage and irrigation systems, soil amelioration and waste \ndisposal procedures \n2.3 \na range of pre-planting treatments, their purpose and method \nof application \n2.4 \nOHS guidelines, procedures, and principles including manual \nhandling.\n3. Underpinning Skills \nTo achieve the performance criteria, appropriate literacy and \nnumeracy levels as well as some complementary skills are required. \nThese include the ability to: \n3.1 \ninterpret production/planting plans, produce standards, quality \nspecifications, work procedure documents \n3.2 \nimplement cropping pattern \n3.3 \nmeasure materials and site plan specifications \n3.4 \noperate, adjust and calibrate cultivation equipment safely \n3.5 \ncomplete pre- and post-operational checks on tools, vehicles \nand equipment \n3.6 \nperform routine safety, service and maintenance procedures \non tools, harvester and equipment \n3.7 \nread and interpret manufacturers specifications, work and \nmaintenance plans, and Material Safety Data Sheets \n3.8 \ninterpret and apply task instructions, communicate with work \nteam and supervisor, and record and report faults, workplace \nhazards and accidents.\n4. Resource Implication \n \nThe following resources must be provided: \n4.1 \nworkplace with vegetables or fruits that require regulating \nplant growth, crop yield and/or quality \n4.2 \nworkplace information relating to crop regulation \n4.3\nfarm procedures relating to crop regulation \n5. Methods of \nAssessment \nCompetency should be assessed: \n5.1 \nthrough direct observation / demonstration \n5.2\nportfolio assessment.\n6. Context of \nAssessment \n6.1 \nAssessment should be in a workplace or in a simulated \nworkplace. \n6.2 \nDemonstration of competency over time and on a number of \noccasions.\n\n--- PDF PAGE 38 ---\n_____________________________________________________________________________________ \nTR - Agricultural Crops Production NC III Promulgated April 2006 \n- 34 - \nUNIT OF COMPETENCY : \nIMPLEMENT POST-HARVEST PROGRAM \nUNIT CODE \n:"
