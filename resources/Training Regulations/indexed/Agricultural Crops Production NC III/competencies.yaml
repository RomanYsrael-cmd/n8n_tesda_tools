        "evidence_guide": {
          "source_text": "1. Critical Aspects of \nCompetency \nAssessment requires evidences that the candidate : \n1.1. \nCoordinated post-harvest operations \n1.2. \nimplemented post-harvest treatments \n1.3. \ndisposed hazardous wastes according to guidelines \nThe skills and knowledge required to implement a post-harvest \nprogram must be transferable to a different work environment. For \nexample, this could include different crops, harvesting methods and \nfarms.\n2. Underpinning \nKnowledge and \nAttitudes \nKnowledge and understanding are essential to apply this standard in \nthe workplace, to transfer the skills to other contexts, and to deal with \nunplanned events. The knowledge requirements for this competency \nstandard are listed below: \n2.1. \nthe attributes of produce in relation to the desired quality of \nproduce to be presented to the client \n2.2. \nIntegrated Pest Management principles and farm policy \n2.3. \nthe importance of maintaining the quality of produce including \nhandling and cooling requirements \n2.4. \nthe relationship between the quality attributes of produce and \npacking techniques and packaging \n2.5. \ncool chain principles and practices \n2.6. \ncharacteristics and procedures for the use of cold storage \nrooms \n2.7. \nthe correct storage temperatures for a range of produce \n2.8. \nhumidity levels and their effect on the quality of produce \n2.9. \nhygiene issues in the handling and storage of plant produce \n2.10. environmental effects of post-harvest treatments and \nhazardous waste disposal methodologies, application and \npurpose \n2.11. farm confined spaces policy and safety procedures. \n3. Underpinning Skills \nTo achieve the performance criteria, appropriate literacy and \nnumeracy levels as well as some complementary skills are required. \nThese include the ability to: \n3.1. \ncommunicate orally and in writing with team members and \nsupervisors \n3.2. \ninterpret and confirm chemical labels, MSDS, work \ninstructions and farm work procedures \n3.3. \nrecord information about work activities on proformas \n3.4. \nparticipate in teams and contribute to team objectives \n3.5. \ncount and calculate quantities, treatment application rates and \nstorage requirements \n3.6. \ncorrectly dispose of chemical substances, their containers and \nother waste materials to minimize environmental impact \n3.7. \nimplement farm OHS policy and procedures.\n\n--- PDF PAGE 44 ---\n_____________________________________________________________________________________ \nTR - Agricultural Crops Production NC III Promulgated April 2006 \n- 40 - \n4. Resource Implication \n \nThe following resources must be provided: \n4.1. \nworkplace with vegetables or fruits that require regulating \nplant growth, crop yield and/or quality \n4.2. \nworkplace information relating to crop regulation \n4.3. \nfarm procedures relating to crop regulation \n5. Methods of \nAssessment \nCompetency should be assessed: \n5.1. \nthrough direct observation / demonstration \n5.2. \nportfolio assessment \n6. Context of \nAssessment \n6.1. \nAssessment should be in a workplace or in a simulated \nworkplace. \n6.2. \nDemonstration of competency over time and on a number of \noccasions.\n\n--- PDF PAGE 45 ---\n_____________________________________________________________________________________ \nTR - Agricultural Crops Production NC III Promulgated April 2006 \n- 41 - \nUNIT OF COMPETENCY : \nIMPLEMENT PLANT NUTRITION PROGRAM \nUNIT CODE \n:"
        },
        "source_text": "AGR611311 \nUNIT DESCRIPTOR \n: \nThis unit covers the skills and knowledge required for the process of \nimplementing a post-harvest program for horticultural crops \nincluding grading, treating, packing and storing harvested produce. \n \n \nImplementing a post-harvest program is likely to be carried out \nunder limited supervision from others with checking only related to \noverall progress. The work requires the application of extensive \nhorticultural knowledge and a broad range of horticultural skills. \nThe post-harvest program usually follows established routines, \nmethods and procedures where some discretion and judgment is \nrequired. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables\n1 Prepare for \nimplementation of \npost-harvest \noperations \n1.1 \nPost-harvest operations to be performed are identified \naccording to farm work procedures, the marketing plan and \nindustry guidelines and confirmed with the supervisor. \n1.2 \nMaterials, tools, equipment and machinery are selected \naccording to farm work procedures. \n1.3 \nPre-operational and safety checks are carried out on tools, \nequipment and machinery according to manufacturers \nspecifications and farm work procedures. \n1.4 \nOHS hazards are identified, risks assessed, controls \nimplemented and reported to the supervisor. \n1.5 \nSuitable safety and personal protective equipment (PPE) \nare selected, used and maintained. \n2 Coordinate post-\nharvest work \n2.1 \nFarm work team is identified and tasks are co-ordinated in a \nsequential, timely and effective manner in consultation with \nthe supervisor. \n2.2 \nPost-harvest operations are undertaken according to OHS \nrequirements and with due consideration of the \nenvironmental implications. \n2.3 \nA clean, safe and hygienic work area is maintained \nthroughout and on completion of work.\n\n--- PDF PAGE 39 ---\n_____________________________________________________________________________________ \nTR - Agricultural Crops Production NC III Promulgated April 2006 \n- 35 - \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables\n3 \nImplement post-\nharvest treatments \n3.1 \nHarvested produce is graded and labelled according to the \nmarketing plan and farm work procedures. \n3.2 \nProduce that does not meet specifications and farm standards \nis identified and disposed of according to farm environmental \nprocedures. \n3.3 \nPost-harvest treatments are selected according to harvested \nproduce requirements, the farm integrated pest management \nstrategy and the marketing plan. \n3.4 \nTiming, rate, application method, environmental requirements \nand handling techniques conform to the requirements of the \nharvested produce, farm work procedures and industry best \npractice. \n3.5 \nPost-harvest practices are economical, methodical, meet \nestablished work schedules and with minimum damage to \nproduce. \n3.6 \nTools, equipment and machinery are cleaned and maintained \naccording to farm work procedures. \n4 \nImplement \nhazardous waste \ndisposal guidelines \n4.1 \nWaste disposal requirements of the farm are reviewed and \noperational tasks determined. \n4.2 \nCollection and disposal of waste are monitored according to \nfarm environmental procedures. \n4.3 \nConditions likely to impact on business viability are reported \npromptly to the supervisor. \n5 \nImplement \npackaging \nrequirements of \nproduce \n5.1 \nPackaging requirements specified in the marketing plan and \nfarm work procedures are reviewed and operational tasks \ndetermined. \n5.2 \nPackaging of produce conform to the requirements of the \nharvested produce, the marketing plan and industry best \npractice. \n5.3 \nPackaging materials are selected based on environmentally \nsound principles. \n5.4 \nPackaging processes are recorded according to farm work \nprocedures. \n6 \nImplement storage \nrequirements of \nproduce \n6.1 \nStorage requirements specified in the marketing plan and \nfarm work procedures are reviewed and operational tasks \ndetermined. \n6.2 \nStorage and handling of produce conform to the requirements \nof the harvested produce, the marketing plan and industry \nbest practice. \n6.3 \nStorage processes and facilities are monitored and remedial \naction taken where necessary. \n6.4 \nStorage processes and conditions are recorded according to \nfarm work procedures.\n\n--- PDF PAGE 40 ---\n_____________________________________________________________________________________ \nTR - Agricultural Crops Production NC III Promulgated April 2006 \n- 36 - \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Post-harvest \noperations \n1.1. \nPost-harvest operations may include handling and transport of \nharvested produce from the field to processing or storage \nfacilities, grading, applying treatments, and packing, labelling \nand storing harvested produce, handling and transport from \nstorage facility to market. \n2. Marketing plan \n2.1. \nThe marketing plan will address client specifications that may \ninclude quality of plant produce (and various grades) such as \nvariety, shape, size, weight, length, colour, maturity, moisture \ncontent, ripeness, texture, skin condition, and blemishes \nwhich are subject to seasonal and market forces. Client \npreferences may also specify packaging materials, containers, \nfilling techniques, labelling and storage requirements from \nfield to client such as the cold chain concept. \n3. Farm work \nprocedures \n3.1. \nWork procedures will be based on sound horticultural \nprinciples and practices and may include supervisors oral or \nwritten instructions, post-harvest program or production \nschedule, marketing plan, farm standard operating procedures \n(SOPs), specifications, routine maintenance schedules, work \nnotes; industry best practice guidelines on quality, food safety \nand hygiene; product labels and Material Safety Data Sheets \n(MSDS), manufacturers service specifications and operators \nmanuals, waste disposal, recycling and re-use guidelines, and \nOHS procedures. \n4. Materials, tools, \nequipment and \nmachinery \n4.1. \nMaterials may include preservatives, chemicals, gases, \ncleaning agents, packaging materials and containers, labels, \nadhesives and proformas. \n4.2. \nTools, equipment and machinery may include tractors, trailers, \nlight trucks, forklifts, snips, knives, gloves, containers, grading \nmachinery, washers, brushes, dryers, chemical applicators, \ngassing chambers, labelling devices, packing tools, scales, \npallets, hand trolleys and lifting aids, cold storage rooms and \ndedicated storage facilities. Machinery and equipment may be \nanimal-powered, modified atmosphere equipments, sealing \nmachine, reefer vans/trucks. \n5. OHS hazards \n5.1. \nHazards may include a wet working environment including \nelectricity, solar radiation, dust, pollen, soil-borne micro-\norganisms, noise, chemicals and hazardous substances, \nconfined spaces, sharp hand tools and equipment, manual \nhandling, slippery or uneven surfaces, and moving equipment, \nmachinery and vehicles. \n6. Safety equipment \n6.1. \nSafety equipment may include signage and barriers, and \noperational safety exits from cold storage rooms and gassing \nchambers. \n7. Personal protective \nequipment \n7.1. \nPPE may include hat, boots, overalls, gloves, apron, \nwaterproof clothing, spray clothing, goggles, respirator or face \nmask, face guard, self-contained breathing apparatus, hearing \nprotection, sunscreen lotion and hard hat.\n\n--- PDF PAGE 41 ---\n_____________________________________________________________________________________ \nTR - Agricultural Crops Production NC III Promulgated April 2006 \n- 37 - \nVARIABLE \nRANGE \n8. OHS requirements \n8.1. \nOHS requirements may include identifying hazards, assessing \nand reporting risks, cleaning, maintaining and storing tools, \nequipment and machinery; appropriate use of PPE, safe \noperation of tools, equipment and machinery, ensuring \noperational safety exits from cold storage rooms and gassing \nchambers, confined spaces policy and procedures, safe \nhandling, use and storage of chemicals and hazardous \nsubstances, correct manual handling, basic first aid, personal \nhygiene and reporting problems to supervisors. \n9. Environmental \nimplications \n9.1. \nDetrimental environmental impacts may arise where post-\nharvest activities produce excess noise, dust or water run-off, \ndisposal of unwanted or waste plant material that produces \nodour and attracts pests, and risks infecting healthy crops, or \non- and off-site ground water or soils that are contaminated \nfrom solids, debris, nutrients, chemicals and water run-off, use \nof CFCs for cooling and propellant and improper disposal of \ncleansing and toxic agents. \n10. Clean, safe and \nhygienic work \narea \n10.1. Tasks may include disabling unused tools, equipment and \nmachinery and storing neatly out of the way of post-harvest \nactivities, safely storing materials including chemicals on-site, \nusing signage and safety barriers during and removing after \npost-harvest activities are completed, cleaning, fumigating or \nsterilising post-harvest equipment and storage facilities, and \nswiftly and efficiently removing and processing debris and \nwaste from the work area. \n11. Farm \nenvironmental \nprocedures \n11.1. Farm environmental procedures may include procedures for \nthe disposal of out-of-standard produce, waste material such \nas chemicals and hazardous substances used in post-harvest \ntreatments, their containers, plant debris, litter, processing and \ncleaning water run-off, and broken components and \npackaging. \n11.2. Waste may be removed to designated areas for recycling, \nreuse, return to the manufacturer or disposal. \n12. Post-harvest \ntreatments \n12.1. Post-harvest treatments may include removal of dirt and \nforeign material, stripping excess leaves and/or trimming, \nbrushing, washing/hydration, drying, applying preservatives, \napplying fungicides and insecticides by spraying or dipping, \nwaxing and polishing, ripening or de-greening with ethylene \ngas, observing quarantine requirements and storing in a \ncontrolled environment. \n13. Minimize damage \nto produce \n13.1. Field handling practices may include observing the fill level of \ncontainers, lifting rather than dragging containers to avoid \ncontact with dirt, correctly stacking containers on transport to \nreduce the risk of bruising, squashing or damaging the \nproduce, and smoothly transporting the harvested produce to \nthe post-harvest processing or storage facility. \n13.2. Harvested crops may need to be stored in the shade, in water-\nfilled or covered containers in the field. In the shed storage \nmay occur in a temperature-controlled environment such as a\n\n--- PDF PAGE 42 ---\n_____________________________________________________________________________________ \nTR - Agricultural Crops Production NC III Promulgated April 2006 \n- 38 - \nVARIABLE \nRANGE \ncold storage room. These may include forced air cold storage \nrooms for table grapes, hydro cold storage rooms for stone \nfruit and vacuum cold storage rooms for mushrooms. \n13.3. Produce damage may be minimized by wearing gloves, \nmaintaining sharp tools, placing rather than dropping produce \ninto containers, cutting fingernails, observing fill heights, \narrangement of produce and packing instructions for \ncontainers, and correctly stacking containers on transport. \n14. Packaging \nrequirements \n14.1. Packaging requirements for specific produce and clients may \ninclude specifications for packaging materials and containers, \nfilling techniques and arrangement of produce within the \ncontainer, and for labelling. \n15. Storage \nrequirements \n15.1. Storage requirements for specific produce and clients may \ninclude specifications for storage facilities, environmental \nconditions such as temperature, humidity and light, length of \nstorage, position in the storage facility and cleaning processes \nto ensure a level of hygiene that protects the quality and \nhealth status of the stored produce.\n\n--- PDF PAGE 43 ---\n_____________________________________________________________________________________ \nTR - Agricultural Crops Production NC III Promulgated April 2006 \n- 39 - \nEVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency \nAssessment requires evidences that the candidate : \n1.1. \nCoordinated post-harvest operations \n1.2. \nimplemented post-harvest treatments \n1.3. \ndisposed hazardous wastes according to guidelines \nThe skills and knowledge required to implement a post-harvest \nprogram must be transferable to a different work environment. For \nexample, this could include different crops, harvesting methods and \nfarms.\n2. Underpinning \nKnowledge and \nAttitudes \nKnowledge and understanding are essential to apply this standard in \nthe workplace, to transfer the skills to other contexts, and to deal with \nunplanned events. The knowledge requirements for this competency \nstandard are listed below: \n2.1. \nthe attributes of produce in relation to the desired quality of \nproduce to be presented to the client \n2.2. \nIntegrated Pest Management principles and farm policy \n2.3. \nthe importance of maintaining the quality of produce including \nhandling and cooling requirements \n2.4. \nthe relationship between the quality attributes of produce and \npacking techniques and packaging \n2.5. \ncool chain principles and practices \n2.6. \ncharacteristics and procedures for the use of cold storage \nrooms \n2.7. \nthe correct storage temperatures for a range of produce \n2.8. \nhumidity levels and their effect on the quality of produce \n2.9. \nhygiene issues in the handling and storage of plant produce \n2.10. environmental effects of post-harvest treatments and \nhazardous waste disposal methodologies, application and \npurpose \n2.11. farm confined spaces policy and safety procedures. \n3. Underpinning Skills \nTo achieve the performance criteria, appropriate literacy and \nnumeracy levels as well as some complementary skills are required. \nThese include the ability to: \n3.1. \ncommunicate orally and in writing with team members and \nsupervisors \n3.2. \ninterpret and confirm chemical labels, MSDS, work \ninstructions and farm work procedures \n3.3. \nrecord information about work activities on proformas \n3.4. \nparticipate in teams and contribute to team objectives \n3.5. \ncount and calculate quantities, treatment application rates and \nstorage requirements \n3.6. \ncorrectly dispose of chemical substances, their containers and \nother waste materials to minimize environmental impact \n3.7. \nimplement farm OHS policy and procedures.\n\n--- PDF PAGE 44 ---\n_____________________________________________________________________________________ \nTR - Agricultural Crops Production NC III Promulgated April 2006 \n- 40 - \n4. Resource Implication \n \nThe following resources must be provided: \n4.1. \nworkplace with vegetables or fruits that require regulating \nplant growth, crop yield and/or quality \n4.2. \nworkplace information relating to crop regulation \n4.3. \nfarm procedures relating to crop regulation \n5. Methods of \nAssessment \nCompetency should be assessed: \n5.1. \nthrough direct observation / demonstration \n5.2. \nportfolio assessment \n6. Context of \nAssessment \n6.1. \nAssessment should be in a workplace or in a simulated \nworkplace. \n6.2. \nDemonstration of competency over time and on a number of \noccasions.\n\n--- PDF PAGE 45 ---\n_____________________________________________________________________________________ \nTR - Agricultural Crops Production NC III Promulgated April 2006 \n- 41 - \nUNIT OF COMPETENCY : \nIMPLEMENT PLANT NUTRITION PROGRAM \nUNIT CODE \n:"
