        "source_text": "AGR611330 \nUNIT DESCRIPTOR \n: \nThis unit covers the skills and knowledge required to maintain and \nmonitor positive environmental work practices. It requires the ability \nto recognize basic environmental hazards and threats. It includes \nthe ability to follow and give workplace directions and instructions \nby communicating accurately with supervisors and workplace \ncolleagues, and to keep records. Maintaining and monitoring \nenvironmental work practices requires awareness of, and an ability \nto implement relevant environmental legislation, policies and \nworkplace/industry practices. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables\n1. Maintain workplace \nenvironmental \nprocedures \n1.1 Workplace procedures and work instructions for integrated \nenvironmental work practices for own work area are \nrecognized, followed and conveyed to team members. \n1.2 Relevant legislation, codes and national standards that \nimpact on workplace environmental practices are recognized, \nconveyed to team members and followed. \n2. Recognize and report \non potential \nenvironmental threats\n2.1 Existing and potential environmental risks and hazards are \nidentified, reported to designated personnel and dealt with. \n2.2 Location and extent of the potential environmental threat are \naccurately recorded. \n2.3 Reports on the potential environmental threat are completed \naccording to enterprise guidelines. \n3. Support continuous \nimprovement of \nenvironmental work \npractices \n3.1 Information is gathered and improvements are suggested to \nsupport the development of improved environmental workplace \npractices. \n3.2 Environmental issues and their relationship to workplace \npractices are discussed in the workplace. \n3.3 Changes to workplace approaches to environmental \npractices are responded to positively and promptly in \naccordance with enterprise requirements. \n3.4 Individuals/teams are informed of the results of environmental \nimprovements in the workplace. \n3.5 Environmental training needs of the work team are identified, \nand training is sought where required. \n4. Maintain \nenvironmental \nrecords \n4.1 Environmental records are accurately and legibly maintained \nand stored securely in a form accessible for reporting purposes.\n4.2 Internal and external reporting procedures are identified and \nmaintained.\n\n--- PDF PAGE 113 ---\n_____________________________________________________________________________________ \nTR - Agricultural Crops Production NC III Promulgated April 2006 \n- 109 - \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Workplace \nprocedures \n1.1. \nThese could include written procedures or work instructions \nfor environmental hazard and risk identification, avoiding or \nminimising environmental risks, improving environmental \nperformance, waste minimisation and segregation, \nenvironmental monitoring, signs and labels (e.g. chemical \nlabels), emergency procedures, hazard and incident recording \nand reporting procedures, and environmental data recording \nand reporting procedures where applicable. Verbal \ninstructions from persons with responsibility related to \nenvironmental work practices are also included in this \ndefinition.\n2. Environmental \npolicies \n2.1. \nWaste minimization and management, sustainability, local, \nregional, State and National strategies on weed and pest \nmanagement, protection of land and habitat and the \nconservation of resources, energy use, greenhouse gas \nemissions, use of chemicals, and plant and equipment.\n3. Recognize and follow \nmean \n3.1. \nThat a person will acknowledge that environmental impacts, \nhazards and risks exist, and that they have a responsibility to \nwork in a manner which will minimize the impact on the \nenvironment within the guidelines established by the \nworkplace.\n4. Legislation, codes \nand national \nstandards \n4.1. \nAward and enterprise agreements, relevant environmental \nlegislation from all levels of government, Philippine standards, \ninternational agreements and relevant industry codes of \npractice.\n5. Report \n5.1. \nVerbally (face-to-face or through communication equipment) \nand in writing (notes, faxes, email or electronic messages).\n6. Environmental risks \nand hazards \n6.1. \nThese could include spills, leaks, pollution, planned and \nunplanned emissions, soil compaction, disturbance and \nerosion, accidents and disposal of waste, and damage or \ndisruption to ecosystems resulting from work practices. Also \nincludes plants, animals or diseases that are classified as an \nenvironmental threat or problem in an area, unauthorised \nchanges in land use, fire risks and threats, and inappropriate \nhuman interaction on the environment. This may include \ndamage to habitat resources, disruption of animal behaviour \nand territorial use, illegal vegetation clearance, seed \ncollection, firewood gathering, nest disturbance and egg \ncollecting.\n7. Designated \npersonnel in a \nworkplace \n7.1. \nManager, supervisor, and people who are responsible for \nwork area or who may be assigned to act as a mentor/trainer \nto a person under instruction.\n8. Suggestions \n8.1. \nIdeas to minimize hazards and risks, reduce waste, make \nmore efficient use of resources and improve environmental \nperformance, reduce soil disturbance and improve habitat \nresources.\n\n--- PDF PAGE 114 ---\n_____________________________________________________________________________________ \nTR - Agricultural Crops Production NC III Promulgated April 2006 \n- 110 - \nVARIABLE \nRANGE \n9. Environmental issues 9.1. \nSustainability, reduction and disposal of waste, water quality, \nenergy efficiency, biodiversity and habitat protection, \nconservation of natural resources, air quality, land \ncontamination, noise, soil and salinity management, and fire \nmanagement.\n10. Workplace \napproaches to \nenvironmental \npractices \n10.1. Preventing and minimising the production of pollution (e.g. \ndischarges to air, land and water, hazardous waste, reducing \n‘burning off’, composting, recycling materials, conservation \npractices), and improving workplace maintenance practices \n(e.g. using a broom instead of a hose, using environment-\nfriendly cleaning agents). \n11. Environmental \nrecords \n11.1. Environmental data, maintenance and inspection reports, \nincident or accident reports, and complaints from the public.\n\n--- PDF PAGE 115 ---\n_____________________________________________________________________________________ \nTR - Agricultural Crops Production NC III Promulgated April 2006 \n- 111 - \nEVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency \nAssessment requires evidences that the candidate : \n1.1. \nmonitored and maintained environmental work practices - that \nskills and knowledge have been successfully and \nappropriately applied and demonstrated in a work place or \nequivalent situation \n \nThe skills and knowledge required to monitor and maintain \nenvironmental work practices must be transferable to a range of \nwork environments and contexts. For example, this could include \ndifferent workplaces, environmental hazards and risks, and \nworkplace practices and procedures.\n2. Underpinning \nKnowledge and \nAttitudes \nKnowledge and understanding are essential to apply this standard in \nthe workplace, to transfer the skills to other contexts, and to deal with \nunplanned events. The knowledge requirements for this unit are \nlisted below: \n2.1. \nrelevant legislation from all levels of government on \nenvironmental issues \n2.2. \nrelevant environmental policies and workplace/industry \npractices and procedures \n2.3. \ngood practice approaches relevant to work area particularly in \nregard to minimising environment hazards and risks, and \nimproving environmental performance \n2.4. \nenvironmental issues, especially in regard to water \ncatchments, air, noise, ecosystems, habitat, efficient use of \nresources, sustainability and waste minimisation \n2.5. \npotential environmental threats and problems relevant to a \ngiven region and occupation \n2.6. \ngeneral work place practices and their potential impact on the \nenvironment.\n3. Underpinning Skills \nTo achieve the performance criteria, some complementary skills are \nrequired. These skills include the ability to: \n3.1. \ncommunicate with supervisors and workplace colleagues \n3.2. \nrecognize environmental hazards and threats \n3.3. \nact upon environmental hazards and threats by following \nenterprise procedures legislative requirements \n3.4. \ninstruct/advise others to follow enterprise procedures and \nlegislative requirements \n3.5. \nfollow workplace directions and instructions \n3.6.\nkeep environmental records.\n4. Resource \nImplications \nThe following resources must be provided: \n4.1. \nworkplace \n4.2.\nenterprise policies and environment related procedures \n5. Methods of \nAssessment \nCompetency should be assessed: \n5.1. \nthrough direct observation / demonstration \n5.2.\nchecking workplace records and production plans\n6. Context of \nAssessment\n6.1. \nAssessment should be in a workplace. \n6.2.\nDemonstration of competency over time\n\n--- PDF PAGE 116 ---\n_____________________________________________________________________________________ \nTR - Agricultural Crops Production NC III Promulgated April 2006 \n- 112 - \nUNIT OF COMPETENCY : \nKEEP RECORDS FOR A FARM BUSINESS \nUNIT CODE \n:"
