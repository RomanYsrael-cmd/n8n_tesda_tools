        "source_text": "AGR321202 \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge, skills and attitudes required to use \nfarm tools and equipment. It includes selection, operation and \npreventive maintenance of farm tools and equipment. \n \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables\n1. Select and use farm \ntools \n \n1.1 \nIdentified appropriate farm tools according to requirement/use \n1.2 \nFarm tools are checked for faults and defective tools reported \nin accordance with farm procedures \n1.3 \nAppropriate tools and equipment are safely used according to \njob requirements and manufacturers conditions \n2. Select and operate \nfarm equipment \n2.1 \nIdentify appropriate farm equipment \n2.2 \nInstructional manual of the farm tools and equipment are \ncarefully read prior to operation \n2.3 \nPre-operation check-up is conducted in line with \nmanufacturers manual \n2.4 \nFaults in farm equipment are identified and reported in line \nwith farm procedures \n2.5 \nFarm equipment used according to its function \n2.6 \nFollowed safety procedures \n3. Perform preventive \nmaintenance \n3.1 \nTools and equipment are cleaned immediately after use in line \nwith farm procedures \n3.2 \nRoutine check-up and maintenance are performed \n3.3 \nTools and equipment are stored in designated areas in line \nwith farm procedures\n\n--- PDF PAGE 28 ---\n_____________________________________________________________________________________ \nTR - Agricultural Crops Production NC III Promulgated April 2006 \n- 24 - \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Farm equipment \n \n1.1 \nEngine \n1.2 \nPumps \n1.3 \nGenerators \n1.4 \nSprayers \n2. Farm tools \n2.1 \nSickle \n2.2 \nCutters \n2.3 \nWeighing scales \n2.4 \nHand tools \n2.5 \nMeasuring tools \n2.6 \nGarden tools \n3. Pre-operation check-\nup \n3.1 \nTires \n3.2 \nBrake fluid \n3.3 \nFuel \n3.4 \nWater \n3.5 \nOil \n3.6 \nLubricants \n3.7 \nBattery\n\n--- PDF 