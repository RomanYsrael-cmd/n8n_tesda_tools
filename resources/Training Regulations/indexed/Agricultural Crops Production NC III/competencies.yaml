        "evidence_guide": {
          "source_text": "1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 \nDetermined areas of concern for safety measures \n1.2 \nApplied appropriate safety measures according to industry \nrequirements \n1.3 \nPrepared tools, materials and outfit needed \n1.4 \nPerformed proper disposal of used materials \n1.5 \nSafekeep/cleaned tools, materials and outfit in designated \nfacilities \n2. Underpinning \nKnowledge and \nAttitudes \n \n2.1 \nSafety Practices \n2.1.1 Implementation of regulatory controls and policies \nrelative to treatment of area and application of \nchemicals \n2.1.2 Proper disposal of waste materials \n2.2 \nCodes and Regulations \n2.2.1 Compliance with health program of DOH and DENR \n2.2.2 Hazard identification \n2.2.3 Emergency procedures \n2.3 \nTools & Equipment: Uses and Specification \n2.3.1 Masks, gloves, boots, overall coats for health protection\n2.4 \nMaintenance \n2.4.1 Regular check-up and repair of tools, materials and \noutfit before and after use \n3. Underpinning Skills \n3.1 \nAbility to recognize effective tools, materials and outfit \n3.2 \nReady skills required to read labels, manuals and other basic \nsafety information \n4. Method of \nAssessment \nCompetency in this unit must be assessed through: \n4.1 \nPractical demonstration with oral questioning \n4.2 \nThird-party report \n5. Resource \nImplications \n5.1 \nFarm location \n5.2 \nTools, equipment and outfits appropriate in applying safety \nmeasures \n6. Context of \nAssessment \n6.1 Assessment may occur in the workplace or in a simulated \nworkplace or as part of a team under limited supervision\n\n--- PDF PAGE 27 ---\n_____________________________________________________________________________________ \nTR - Agricultural Crops Production NC III Promulgated April 2006 \n- 23 - \n \nUNIT OF COMPETENCY : \nUSE FARM TOOLS AND EQUIPMENT \nUNIT CODE \n:"
        },
        "source_text": "AGR321201 \n \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge, skills and attitudes required to \nperform safety measures effectively and efficiently. It includes \nidentifying areas, tools, materials, time and place in performing \nsafety measures. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1. Determine areas of \nconcern for safety \nmeasures \n1.1 \nWork tasks are identified in line with farm operations \n1.2 \nPlace for safety measures are determined in line with farm \noperations \n1.3 \nTime for safety measures are determined in line with farm \noperations \n1.4 \nAppropriate tools, materials and outfits are prepared in line \nwith job requirements \n2. Apply appropriate \nsafety measures \n2.1 \nTools and materials are used according to specifications and \nprocedures \n2.2 \nOutfits are worn according to farm requirements \n2.3 \nEffectivity/shelf life/expiration of materials are strictly observed\n2.4 \nEmergency procedures are known and followed to ensure a \nsafework requirement \n2.5 \nHazards in the workplace are identified and reported in line \nwith farm guidelines \n3. Safekeep/dispose of \ntools, materials and \noutfit \n3.1 \nUsed tools and outfit are cleaned after use and stored in \ndesignated areas \n3.2 \nUnused materials are properly labeled and stored according \nto manufacturers recommendation and farm requirements \n3.3 \nWaste materials are disposed according to manufacturers, \ngovernment and farm requirements\n\n--- PDF PAGE 25 ---\n_____________________________________________________________________________________ \nTR - Agricultural Crops Production NC III Promulgated April 2006 \n- 21 - \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Work tasks \nWork task may be selected from any of the following sectors: \n1.1 \nAquaculture \n1.2 \nAnimal Production \n1.3 \nCrop Production \n1.4 \nPost-harvest \n1.5 \nAgri-marketing \n1.6\nFarm Equipment\n2. Place \n2.1 \nAnimal pens, cages, barns \n2.2 \nFish ponds, cages \n2.3 \nStock room/storage areas/warehouse \n2.4 \nField/farm/orchard \n3. Time \n3.1 \nVaccination and medication period \n3.2 \nFertilizer and pesticides application \n3.3 \nFeed mixing and feeding \n3.4 \nHarvesting and hauling \n3.5 \nCleaning, sanitizing and disinfecting \n3.6\nDressing, butchering and castration\n4. Tools, materials and \noutfits \n4.1 \nTools \n4.1.1 Wrenches \n4.1.2 Screw driver \n4.1.3 Pliers \n4.2 \nMaterials \n4.2.1 Bottles \n4.2.2 Plastic \n4.2.3 Bags \n4.2.4 Syringe \n4.3 \nOutfit \n4.3.1 Masks \n4.3.2 Gloves \n4.3.3 Boots \n4.3.4 Overall coats \n4.3.5 Hat \n4.3.6 Eye goggles\n5. Emergency \nprocedures \n5.1 \nLocation of first aid kit \n5.2 \nEvacuation \n5.3 \nAgencies contract \n5.4\nFarm emergency procedures\n6. Waste materials \n6.1 \nAnimal manure \n6.2 \nWaste water \n6.3 \nSyringes \n6.4 \nUnused farm chemicals e.g. pesticides, chemicals, fertilizers \n6.5 \nExpired reagents \n6.6\nDead animals\n7. Hazards \n7.1 \nChemical \n7.2 \nElectrical \n7.3\nFalls\n\n--- PDF PAGE 26 ---\n_____________________________________________________________________________________ \nTR - Agricultural Crops Production NC III Promulgated April 2006 \n- 22 - \nEVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 \nDetermined areas of concern for safety measures \n1.2 \nApplied appropriate safety measures according to industry \nrequirements \n1.3 \nPrepared tools, materials and outfit needed \n1.4 \nPerformed proper disposal of used materials \n1.5 \nSafekeep/cleaned tools, materials and outfit in designated \nfacilities \n2. Underpinning \nKnowledge and \nAttitudes \n \n2.1 \nSafety Practices \n2.1.1 Implementation of regulatory controls and policies \nrelative to treatment of area and application of \nchemicals \n2.1.2 Proper disposal of waste materials \n2.2 \nCodes and Regulations \n2.2.1 Compliance with health program of DOH and DENR \n2.2.2 Hazard identification \n2.2.3 Emergency procedures \n2.3 \nTools & Equipment: Uses and Specification \n2.3.1 Masks, gloves, boots, overall coats for health protection\n2.4 \nMaintenance \n2.4.1 Regular check-up and repair of tools, materials and \noutfit before and after use \n3. Underpinning Skills \n3.1 \nAbility to recognize effective tools, materials and outfit \n3.2 \nReady skills required to read labels, manuals and other basic \nsafety information \n4. Method of \nAssessment \nCompetency in this unit must be assessed through: \n4.1 \nPractical demonstration with oral questioning \n4.2 \nThird-party report \n5. Resource \nImplications \n5.1 \nFarm location \n5.2 \nTools, equipment and outfits appropriate in applying safety \nmeasures \n6. Context of \nAssessment \n6.1 Assessment may occur in the workplace or in a simulated \nworkplace or as part of a team under limited supervision\n\n--- PDF PAGE 27 ---\n_____________________________________________________________________________________ \nTR - Agricultural Crops Production NC III Promulgated April 2006 \n- 23 - \n \nUNIT OF COMPETENCY : \nUSE FARM TOOLS AND EQUIPMENT \nUNIT CODE \n:"
