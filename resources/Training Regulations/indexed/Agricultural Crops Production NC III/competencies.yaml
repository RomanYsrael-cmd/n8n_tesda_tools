        "evidence_guide": {
          "source_text": "1. Critical Aspects of \nCompetency \nAssessment requires evidences that the candidate : \n1.1. \ncollected and preserved biological samples for a given site \naccording to prescribed enterprise procedures, standards and \nprinciples, collecting schedules and industry best practice \nThe skills and knowledge required to collect and preserve samples \nmust be transferable to a range of work environments and contexts. \nFor example, this could include different locations, environments, \nsamples and collecting techniques or sample collection for different \npurposes. \n2. Underpinning \nKnowledge \nKnowledge and understanding are essential to apply this standard in \nthe workplace, to transfer the skills to other contexts, and to deal with \nunplanned events. The knowledge requirements for this unit are \nlisted below: \n2.1. \nhydrological cycle \n2.2. \nfield procedures for sampling and preservation \n2.3. \ncollecting equipment and methods \n2.4. \npreservation equipment and processes \n2.5. \nbasic habitat assessment \n2.6. \nwater quality issues \n2.7. \nfauna and flora recognition relevant to sampling activities \n2.8. \nrelevant legislation. \n3. Underpinning Skills \nTo achieve the performance criteria, some complementary skills are \nrequired. These skills include the ability to: \n3.1. \nunderstand and carry out instructions \n3.2. \nuse and operate relevant tools and equipment \n3.3. \nprepare and package samples for transport to laboratory \n4. Resource \nImplications \n \nThe following resources must be provided: \n4.1. \nworkplace with livestock or cropping production \n4.2. \nequipment and materials used collecting and storing samples \n4.3. \nsampling plan \n4.4. \nenterprise procedures relating to sampling procedures. \n5. Methods of \nAssessment \nCompetency should be assessed: \n5.1. \nthrough direct observation / demonstration \n5.2. \nportfolio assessment \n6. Context of \nAssessment \n6.1. \nAssessment should be in a workplace or in a simulated \nworkplace. \n6.2. \nDemonstration of competency over time\n\n--- PDF PAGE 96 ---\n_____________________________________________________________________________________ \nTR - Agricultural Crops Production NC III Promulgated April 2006 \n- 92 - \nUNIT OF COMPETENCY : \nHANDLE BULK MATERIALS IN STORAGE AREA \nUNIT CODE \n:"
        },
        "source_text": "AGR611326 \nUNIT DESCRIPTOR : \nThis unit covers the skills and knowledge required to collect \nsamples as part of a rural production or horticulture monitoring \nprogram or while conducting post-mortem examination of livestock or \nother animals. It requires the ability to plan for collecting, prepare \nequipment and resources, carry out collecting, and complete \ncollecting activities. Collecting samples requires knowledge of \nindustry sampling and preserving guidelines and protocols, types of \ntissue that might be collected, environmental legislation, and \nsampling and preserving methods. \n Samples collected will usually be analyzed by laboratory staff, \nalthough collection staff may undertake some tests. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables\n1. Plan for collection of \nsamples \n1.1 \nPurpose and scope of sample collection activity is confirmed \nfrom discussion with supervisor or work instructions. \n1.2 \nSample collection schedule is read/heard and confirmed with \nsupervisor. \n1.3 \nSampling site location is confirmed and, where required, \napproval obtained for site access following enterprise \nguidelines. \n1.4 \nSamples to be collected and preserved are identified in \nconjunction with supervisor or by reference to enterprise \nguidelines. \n1.5 \nRange of likely operating conditions, hazards and \ndifficult/sensitive environments are assessed for impact on \nsampling and testing. \n2. Prepare equipment \nand resources \n2.1 \nEquipment required for sampling and preserving is sourced \naccording to sampling procedures. \n2.2 \nEquipment is checked for availability and serviceability in \naccordance with enterprise procedures. \n2.3 \nData or record sheets/books are collected for use. \n2.4 \nEquipment, data sheets and personnel are moved to sampling \nsites without injury or damage and readied for use.\n\n--- PDF PAGE 93 ---\n_____________________________________________________________________________________ \nTR - Agricultural Crops Production NC III Promulgated April 2006 \n- 89 - \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables\n3. Carry out sampling \nand preserving \nprocedures \n3.1 \nSamples are collected in accordance with sampling plan and \nenterprise procedures and industry protocols/guidelines. \n3.2 \nSamples are preserved and recorded in accordance with \nsampling standards and guidelines. \n3.3 \nSamples for external analysis are prepared, packaged and \nsent to laboratory in accordance with sampling schedule and \nlaboratory standards. \n3.4 \nHazardous materials are packaged and transported in \naccordance with legislative requirements. \n3.5 \nObservations including information on the surrounding area \nand environmental conditions are made in accordance with \nmonitoring schedule. \n3.6 \nEquipment operation and work practices conform to OHS \nrequirements. \n3.7 \nCollection outcomes including presentation of samples are \nreported and delivered in accordance to enterprise guidelines. \n4 Complete sample \ncollection activities \n4.1 \nEquipment and clothing is cleaned, sanitised, repaired and \nstored in accordance with enterprise procedures. \n4.2 \nDamaged or malfunctioning equipment is repaired on site or \nsent to manufacturer or specialist. \n4.3 \nSampling results and observations are accurately recorded on \ndata sheets and forwarded in accordance with enterprise \nprocedures. \n4.4 \nChanges in field conditions and equipment are conveyed to \nsupervisor according to enterprise procedures.\n\n--- PDF PAGE 94 ---\n_____________________________________________________________________________________ \nTR - Agricultural Crops Production NC III Promulgated April 2006 \n- 90 - \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Locations \n1.1. \nRural production or horticultural sites, such as paddocks, farm \nbuildings, worksites, nurseries, playing fields, dams, etc. \n2. Samples \n2.1. \nA very wide variety of items may be sampled for testing, \nincluding animal tissue or fluids, plants, moulds, pests, water, \nsoil, effluent, and emissions. Samples will generally be taken \nas part of an on-going monitoring program, such as an animal \nhealth program or as part of a post-mortem examination of \nlivestock. \n3. Environmental \nlegislation \n3.1. \nActs and regulations pertaining to environment, including \nthreatened species. \n4. Equipment \n4.1. \nElectronic machines, probes, grabs, nets, dredges, plankton \nnets, water sample bottles, bailer, still and video cameras, \nspecialised machinery, identification keys and preserving \nequipment, kick seines, containers for holding and sorting \nsamples, plastic buckets, blood/saliva sampling equipment, \nhand-held magnifying glasses, tweezers or forceps, small \nvegetable brushes, wading boots, rubber gloves, \nthermometer, yardstick, sample record and assessment form, \npencils, and clipboard, and relevant field guides. \n5. OHS requirements \n \n5.1. \nCodes of practice, regulations and/or guidance notes, which \nmay apply in a jurisdiction, and enterprise-specific OHS \nprocedures, policies or standards.\n\n--- PDF PAGE 95 ---\n_____________________________________________________________________________________ \nTR - Agricultural Crops Production NC III Promulgated April 2006 \n- 91 - \nEVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency \nAssessment requires evidences that the candidate : \n1.1. \ncollected and preserved biological samples for a given site \naccording to prescribed enterprise procedures, standards and \nprinciples, collecting schedules and industry best practice \nThe skills and knowledge required to collect and preserve samples \nmust be transferable to a range of work environments and contexts. \nFor example, this could include different locations, environments, \nsamples and collecting techniques or sample collection for different \npurposes. \n2. Underpinning \nKnowledge \nKnowledge and understanding are essential to apply this standard in \nthe workplace, to transfer the skills to other contexts, and to deal with \nunplanned events. The knowledge requirements for this unit are \nlisted below: \n2.1. \nhydrological cycle \n2.2. \nfield procedures for sampling and preservation \n2.3. \ncollecting equipment and methods \n2.4. \npreservation equipment and processes \n2.5. \nbasic habitat assessment \n2.6. \nwater quality issues \n2.7. \nfauna and flora recognition relevant to sampling activities \n2.8. \nrelevant legislation. \n3. Underpinning Skills \nTo achieve the performance criteria, some complementary skills are \nrequired. These skills include the ability to: \n3.1. \nunderstand and carry out instructions \n3.2. \nuse and operate relevant tools and equipment \n3.3. \nprepare and package samples for transport to laboratory \n4. Resource \nImplications \n \nThe following resources must be provided: \n4.1. \nworkplace with livestock or cropping production \n4.2. \nequipment and materials used collecting and storing samples \n4.3. \nsampling plan \n4.4. \nenterprise procedures relating to sampling procedures. \n5. Methods of \nAssessment \nCompetency should be assessed: \n5.1. \nthrough direct observation / demonstration \n5.2. \nportfolio assessment \n6. Context of \nAssessment \n6.1. \nAssessment should be in a workplace or in a simulated \nworkplace. \n6.2. \nDemonstration of competency over time\n\n--- PDF PAGE 96 ---\n_____________________________________________________________________________________ \nTR - Agricultural Crops Production NC III Promulgated April 2006 \n- 92 - \nUNIT OF COMPETENCY : \nHANDLE BULK MATERIALS IN STORAGE AREA \nUNIT CODE \n:"
