        "evidence_guide": {
          "source_text": "1. Critical Aspects of \nCompetency \nAssessment requires evidences that the candidate : \n1.1. \nharvested crops safely and efficiently while continually \nmaintaining the highest degree of hygiene and quality \npossible. \nThe skills and knowledge required to harvest the grain crop must be \ntransferable to a different work environment. For example, the way \nin which the harvesting operations will occur will vary depending on \nthe moisture levels of the crop, the crop type, and the equipment \navailable.\n2. Underpinning \nKnowledge \nKnowledge and understanding are essential to apply this standard in \nthe workplace, to transfer the skills to other contexts, and to deal with \nunplanned events. The knowledge requirements for this competency \nstandard are listed below: \n2.1. \nappropriate legislative requirements, manufacturers \ninstructions and organization procedures/instructions \n2.2. \npre-operational and safety checks, servicing and maintenance \nprocedures for tools and equipment \n2.3. \npotential hazards associated with the operation of basic tools \nand equipment \n2.4. \ngeneral machine maintenance procedures \n2.5. \nmachinery operating principles and operating methods \n2.6. \nenvironmental impacts associated with the operation of \nmachinery and equipment in a harvesting context \n2.7. \norganization recording and reporting procedures \n2.8. \npests and signs of pest infestation in the crop \n2.9. \norganization moisture and hygiene requirements for the crop \nand equipment that comes into contact with the crop \n2.10. operational procedures and standards for harvesting and \nancillary equipment. \n2.11. knowledge of crop maturity \n2.12. knowledge of post-harvest handling and packaging. \n3. Underpinning Skills \nTo achieve the performance criteria, appropriate literacy and \nnumeracy levels as well as some complementary skills are required. \nThese include the ability to: \n3.1. \nuse communication systems \n3.2. \nhandle and manoeuvre harvesting equipment \n3.3. \ncomplete pre- and post-operational checks on tools, harvester \nand equipment \n3.4. \nperform routine safety, service and maintenance procedures \non tools, harvester and equipment \n3.5. \nread and interpret manufacturers specifications, work and \nmaintenance plans, and Material Safety Data Sheets \n3.6. \ninterpret and apply task instructions, communicate with work \nteam and supervisor, and record and report faults, workplace \nhazards and accidents.\n\n--- PDF PAGE 78 ---\n_____________________________________________________________________________________ \nTR - Agricultural Crops Production NC III Promulgated April 2006 \n- 74 - \n4. Resource \nImplications \n \nThe following resources must be provided: \n4.1. \nworkplace with agronomic crops coming into harvest time \n4.2. \nworkplace information relating to crop harvesting \n4.3. \nenterprise procedures relating to crop harvesting \n5. Methods of \nAssessment \nCompetency should be assessed: \n5.1. \nthrough direct observation / demonstration \n5.2. \nportfolio assessment \n6. Context of \nAssessment \n6.1. \nAssessment should be in a workplace or in a simulated \nworkplace. \n6.2. \nDemonstration of competency over time and on a number of \noccasions.\n\n--- PDF PAGE 79 ---\n_____________________________________________________________________________________ \nTR - Agricultural Crops Production NC III Promulgated April 2006 \n- 75 - \nUNIT OF COMPETENCY : \nSAVE, PREPARE AND STORE AGRICULTURAL SEED \nUNIT CODE \n:"
        },
        "source_text": "AGR611322 \nUNIT DESCRIPTOR : \nThis unit covers the skills and knowledge required for the process of \nharvesting agronomic crops. It includes preparing machinery and \nequipment, supplies and materials needed, harvesting, cleaning \nand maintaining machinery and equipment and completing \nworkplace records. Harvesting may also be carried out using \nmanually or animal-powered tools and equipment. Harvesting is \nlikely to be carried out under limited supervision. Overall progress \nmay be checked periodically and will usually follow set routines, \nmethods and procedures. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables\n1. Prepare to harvest \nagronomic crops \n1.1 \nRequirements for the work to be undertaken, method and \norder of harvesting is interpreted from the harvest strategy \nand confirmed with the supervisor. \n1.2 \nOHS hazards are identified, risks assessed and suitable \ncontrols are implemented. \n1.3 \nSuitable personal protective equipment is selected, used \nand maintained. \n1.4 \nThe environmental implications of harvesting the crop are \nidentified, likely outcomes assessed and, if necessary, \nresponsible action is taken. \n1.5 \nWindrowing/swathing is completed to the standard required by \nthe harvest strategy. \n1.6 \nCrop is sampled for moisture content against the \nclassification standards. \n1.7 \nThe hygiene standards for the crop and the site are identified \nfrom the harvest strategy and/or the crop storage plan. \n2. Prepare the \nharvesting equipment\n2.1 \nHarvesting machinery and other equipment are cleaned of \npests and other contaminants to maintain crop and site \nhygiene standards, as required by the harvest strategy. \n2.2 \nAll machinery and equipment are serviced, assessed for \nreliability, adjusted for harvesting conditions and appropriate \nparts are replaced to ensure reliability during the harvest. \n2.3 \nAll containers, leftover fluids, waste and debris from the \nmaintenance and servicing work are disposed of safely and \nappropriately. \n2.4 \nAll maintenance and servicing is documented according to \nthe requirements of the organizations record keeping system.\n\n--- PDF PAGE 74 ---\n_____________________________________________________________________________________ \nTR - Agricultural Crops Production NC III Promulgated April 2006 \n- 70 - \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables\n3. Harvest crops \n3.1 \nThe harvest strategy is followed and completed for each site. \n3.2 \nOHS hazards are identified, risks assessed and suitable \ncontrols are implemented. \n3.3 \nSuitable personal protective equipment is selected, used and \nmaintained. \n3.4 \nThe environmental implications of harvesting are identified, \nlikely outcomes assessed and, if necessary, responsible \naction is taken. \n3.5 \nHarvesting machinery and ancillary equipment is operated in \na safe manner and at speeds to suit crop conditions. \n3.6 \nThe quality of the crop is maximized by maintaining the \nhygiene of all surfaces that come into contact with the crop. \n3.7 \nThe quality of the crop is maximized by continually checking \nand, where necessary, adjusting the harvester and ancillary \nequipment, including their height and other settings. \n4. Complete harvesting \noperations \n4.1 \nEquipment is cleaned in accordance with manufacturer’s \nspecifications, organizational procedures and regulations. \n4.2 \nAttachments and other ancillary equipment are cleaned and \nstored to minimize damage and to maximize hygiene \naccording to manufacturer’s specifications, organizational \nprocedures and regulations. \n4.3 \nInsecticides are applied as required by the organization and \nthe harvest strategy. \n4.4 \nAll containers, leftover fluids, waste and debris from the \nmaintenance and servicing work are disposed of safely and \nappropriately. \n4.5 \nAll required records and documentation are completed \naccurately and promptly in accordance with organizational \nrequirements.\n\n--- PDF PAGE 75 ---\n_____________________________________________________________________________________ \nTR - Agricultural Crops Production NC III Promulgated April 2006 \n- 71 - \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Agronomic crops \n1.1. \nAgronomic crops covered by this unit include coarse grains, \ngrain legumes, coffee, coconuts, cotton, soya beans, peanuts \nand sugar cane.\n2. OHS \nThe range of actions are both systemic and at an operational level. \nThese are listed below. \n2.1. \nSystems should be in place to ensure the safe operation and \nmaintenance of machinery and equipment. Precautions \nshould also be in place to minimize exposure to noise and \norganic and other dusts. Systems and procedures for \nharvesting and handling the crop, as well as working with and \naround electricity should also be in place. \n2.2. \nFixtures should be in place in all silos and storage sheds, \nincluding appropriate access ladders, handrails and ladder \ncages. \n2.3. \nPersonal protective equipment should be selected, used and \nmaintained. \n2.4. \nEnvironmental conditions should be controlled e.g., keeping \nmoisture levels as low as possible will reduce the likelihood of \nfire. \n2.5. \nProcedures should be in place and used for working on \nharvesters, working with grain mass movement and stability, \nworking within confined working spaces, moving vehicles, and \nworking at height. \n2.6. \nRecord keeping practices should ensure that requirements are \nmet in relation to properly observing and using product labels \nand MSDS sheets, instruction manuals and written \norganizational procedures. \n3. Personal \nprotective \nequipment \n3.1. \nBoots, hat/hard hat, overalls, gloves, protective eyewear, \nhearing protection, respirator or facemask, and sun protection \n(sun hat, sun screen). \n4. Environmental \nimplications \n4.1. \nDetrimental environmental impacts may result from excessive \nnoise and exhaust emissions, the incorrect use and disposal \nof maintenance debris (oils, containers, chemical residues), \nand hazardous substances (fuel). Impacts may also include \nrun-off flows of water and cleaning agents from servicing, \nmaintenance and cleaning activities. \n5. Classification \nstandards \n5.1. \nThese are the standards for the measurement of moisture in \nthe crop and are produced and available from receival \nauthorities. \n6. Equipment \n6.1. \nA range of equipment from grain augers and field and chaser \nbins to towing vehicles, tarpaulins, fire control equipment, \nconveyors, communication equipment, and crop treatment \nequipment.\n\n--- PDF PAGE 76 ---\n_____________________________________________________________________________________ \nTR - Agricultural Crops Production NC III Promulgated April 2006 \n- 72 - \nVARIABLE \nRANGE \n7. Cleaned in \npreparation for \nand subsequent to \nthe harvest \n7.1. \nAll surfaces of harvesters, and any equipment that comes into \ncontact with the crop should be cleaned, using one of the \nfollowing methods: compressed air, water wash, vacuum and \nwater, and/or brush. \n8. Documented \ninformation \n8.1. \nRecord keeping systems used may be either paper-based or \ndigital, and information will be recorded into logbooks or other \nrecords. \n9. Operated safely \nequipment \n9.1. \nThe speeds used should be appropriate for the equipment, \nground and the crop conditions. All pre- and post-start up \nchecks should be undertaken. The machine is positioned and \nadjusted during use according to the height of the crop and \naccording to weather conditions. \n10. Fire prevention \nmeasures \n10.1. These will be outlined in the harvest strategy. The measures \nplanned for and taken will address fire risks and hazards and \nwill meet legislative requirements. \n11. Actions required \nfor documentation \n11.1. All chemical usage should be recorded as well as any \nnecessary recording of vehicle and equipment use in \nlogbooks, for example. Additionally, any assessment of pests \nand weeds, grain protein levels, quality and yield should be \nrecorded appropriately.\n\n--- PDF PAGE 77 ---\n_____________________________________________________________________________________ \nTR - Agricultural Crops Production NC III Promulgated April 2006 \n- 73 - \nEVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency \nAssessment requires evidences that the candidate : \n1.1. \nharvested crops safely and efficiently while continually \nmaintaining the highest degree of hygiene and quality \npossible. \nThe skills and knowledge required to harvest the grain crop must be \ntransferable to a different work environment. For example, the way \nin which the harvesting operations will occur will vary depending on \nthe moisture levels of the crop, the crop type, and the equipment \navailable.\n2. Underpinning \nKnowledge \nKnowledge and understanding are essential to apply this standard in \nthe workplace, to transfer the skills to other contexts, and to deal with \nunplanned events. The knowledge requirements for this competency \nstandard are listed below: \n2.1. \nappropriate legislative requirements, manufacturers \ninstructions and organization procedures/instructions \n2.2. \npre-operational and safety checks, servicing and maintenance \nprocedures for tools and equipment \n2.3. \npotential hazards associated with the operation of basic tools \nand equipment \n2.4. \ngeneral machine maintenance procedures \n2.5. \nmachinery operating principles and operating methods \n2.6. \nenvironmental impacts associated with the operation of \nmachinery and equipment in a harvesting context \n2.7. \norganization recording and reporting procedures \n2.8. \npests and signs of pest infestation in the crop \n2.9. \norganization moisture and hygiene requirements for the crop \nand equipment that comes into contact with the crop \n2.10. operational procedures and standards for harvesting and \nancillary equipment. \n2.11. knowledge of crop maturity \n2.12. knowledge of post-harvest handling and packaging. \n3. Underpinning Skills \nTo achieve the performance criteria, appropriate literacy and \nnumeracy levels as well as some complementary skills are required. \nThese include the ability to: \n3.1. \nuse communication systems \n3.2. \nhandle and manoeuvre harvesting equipment \n3.3. \ncomplete pre- and post-operational checks on tools, harvester \nand equipment \n3.4. \nperform routine safety, service and maintenance procedures \non tools, harvester and equipment \n3.5. \nread and interpret manufacturers specifications, work and \nmaintenance plans, and Material Safety Data Sheets \n3.6. \ninterpret and apply task instructions, communicate with work \nteam and supervisor, and record and report faults, workplace \nhazards and accidents.\n\n--- PDF PAGE 78 ---\n_____________________________________________________________________________________ \nTR - Agricultural Crops Production NC III Promulgated April 2006 \n- 74 - \n4. Resource \nImplications \n \nThe following resources must be provided: \n4.1. \nworkplace with agronomic crops coming into harvest time \n4.2. \nworkplace information relating to crop harvesting \n4.3. \nenterprise procedures relating to crop harvesting \n5. Methods of \nAssessment \nCompetency should be assessed: \n5.1. \nthrough direct observation / demonstration \n5.2. \nportfolio assessment \n6. Context of \nAssessment \n6.1. \nAssessment should be in a workplace or in a simulated \nworkplace. \n6.2. \nDemonstration of competency over time and on a number of \noccasions.\n\n--- PDF PAGE 79 ---\n_____________________________________________________________________________________ \nTR - Agricultural Crops Production NC III Promulgated April 2006 \n- 75 - \nUNIT OF COMPETENCY : \nSAVE, PREPARE AND STORE AGRICULTURAL SEED \nUNIT CODE \n:"
