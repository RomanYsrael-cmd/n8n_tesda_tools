          "source_text": "1. Critical Aspects of \nCompetency \nAssessment requires evidences that the candidate :\n1.1. \nsaved, prepared, grown and stored seed in a hygienic \nenvironment to ensure a successful crop the following year \nThe skills and knowledge required to save, prepare and store seed \nmust be transferable to a different work environment. For example, \nacross the range of grains grown, and in a range of different \ngeographic environments.\n2. Underpinning \nKnowledge and \nAttitudes \nKnowledge and understanding are essential to apply this standard in \nthe workplace, to transfer the skills to other contexts, and to deal with \nunplanned events. The knowledge requirements for this competency \nstandard are listed below: \n2.1. \nidentification of varieties \n2.2. \nseed treatment and cleaning measures \n2.3. \nsources of purchased seed \n2.4. \ninoculation treatments and seed dressings used within the \norganization \n2.5. \nrecords and documentation required for tracking and handling \nof seed \n2.6. \nstorage techniques and requirements for seed and grain \n2.7. \nenvironmental controls and codes of practice applicable to the \nenterprise \n2.8. \nrelevant legislation and regulations relating to OHS, contractor \nengagement, chemical use and application, vehicle and plant \nuse, and to the use, handling and sale of seed \n2.9. \nsound management practices and processes to minimize \nnoise, odours, and debris from sowing operations.\n3. Underpinning Skills\nTo achieve the performance criteria, appropriate literacy and \nnumeracy levels as well as some complementary skills are required. \nThese include the ability to: \n3.1. \nselect appropriate seed tests \n3.2. \napply pre and post-harvest treatments for seed \n3.3. \nidentify varieties from growth patterns \n3.4. \nidentify weed seeds and contaminants \n3.5. \nidentify pests in stored grain and initiate control measures \n3.6. \ncalculate volumes, capacities, areas, ratios for seed, storages, \nand chemicals \n3.7. \nkeep, update and maintain records relating to test results, \nprovenance, varieties, pest control measures, and other \nrelevant information about the seed \n3.8. \nobserve, identify and react appropriately to environmental \nimplications and OHS hazards.\n4. Resource \nImplications \n \nThe following resources must be provided:\n4.1. \nworkplace with saves, prepares and stores grain. \n4.2. \nworkplace information relating to grain storage \n4.3.\nenterprise procedures relating to grain storage\n5. Methods of \nAssessment \nCompetency should be assessed:\n5.1. \nthrough direct observation / demonstration \n5.2.\nportfolio assessment\n6. Context of \nAssessment \n6.1.\nAssessment should be in a workplace or in a simulated \nworkplace. \n6.2. \nDemonstration of competency over time and on a number of \noccasions at least three (3) different types of crops.\n\n--- PDF PAGE 84 ---\n_____________________________________________________________________________________ \nTR - Agricultural Crops Production NC III Promulgated April 2006 \n- 80 - \nUNIT OF COMPETENCY : \nIMPLEMENT VERTEBRATE PEST CONTROL PROGRAM \nUNIT CODE \n:"
        },
        "source_text": "AGR611323 \nUNIT DESCRIPTOR \n: \nThis unit covers the skills and knowledge required for selecting \ngrain and other seed from agricultural crops for use as seed, to \ncalculate the quantity required, to grade and test it, and \nsubsequently to store the seed for use in the following season. \nSeed stocks are selected and stored to ensure maximum quality \nand yield when used. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables\n1 Select seed from \nagricultural crops \n1.1 \nThe quantity of seed required to sow the following season’s \ncrop is calculated. \n1.2 \nThe area of crop needed to produce the required quantity of \nseed for the following season’s crop is calculated. \n1.3 \nA portion of the crop to be used as seed is selected, based on \nthe calculated requirements and its health, vigour, and grain \nsize. \n1.4 \nThe soil type and elevation/climatic conditions in the selected \nportion of the crop are noted for potential input to \nmanagement decision-making. \n1.5 \nMeasures are taken to preserve seed and plant health, \nvigour and uniformity within the selected area. \n1.6 \nThe application of any chemicals to the crop is undertaken in \nfull consideration of detrimental environmental impacts. \n1.7 \nAll work carried out is done using the appropriate personal \nprotective equipment and is within OHS guidelines. \n2 Evaluate and grade \nseed \n2.1 \nAfter harvest, the grain variety saved is assessed for its \nsuitability for the location, the soil, and the organization’s \ncurrent marketing requirements. \n2.2 \nInformation regarding new varieties or trial results and \nprogress is sourced for input to management decision-making.\n2.3 \nThe seed is graded to the required size either on or off-site. \n2.4 \nFungicidal and insecticidal dressings are applied to the seed \nwhere appropriate and according to the organizations \nproduction and marketing requirements. \n2.5 \nTest samples are taken, prepared and forwarded to the \nanalyzing body, according to the guidelines of that body. \n2.6 \nRecords of observations, information gathered, and results of \ntests and grading are kept, updated, and maintained \naccording to the requirements of the organization and the \nindustry. \n2.7 \nThe records kept are forwarded to the appropriate person for \nanalysis and decision-making.\n\n--- PDF PAGE 80 ---\n_____________________________________________________________________________________ \nTR - Agricultural Crops Production NC III Promulgated April 2006 \n- 76 - \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables\n3 Store seed \n3.1 \nThe storage facilities to be used are selected and hygienically \nprepared. \n3.2 \nSeed is transferred to the storage facility according to the \norganizations OHS and hygiene guidelines. \n3.3 \nSeed is stored under conditions that maintain its quality and \ngermination capacity. \n3.4 \nPeriodical checks of seed in long-term storage are conducted \nfor quality factors and viability according to enterprise \nrequirements. \n3.5 \nSeed samples for laboratory testing are taken as required. \n3.6 \nTest samples are taken, prepared and forwarded for analysis \naccording to prescribed guidelines. \n3.7 \nClear and accurate records of seed storage, tests and \ninspections are created, maintained and kept as described in \nthe seed storage program. \n3.8 \nThe condition of storage facilities is monitored using the \nschedule and methods outlined in the seed storage program. \n3.9 \nWhere it is required, appropriate corrective action is taken to \nmaintain seed quality. \n3.10 Activities around the seed storage facilities are undertaken \naccording to the OHS guidelines detailed in the grain storage \nprogram. \n4 Collect and deliver \nseed \n4.1 \nDelivery or supply terms are established and applied when \ncollecting or delivering seed. \n4.2 \nSeed sold or purchased conforms to local State and Federal \nlegislation and regulations. \n4.3 \nRegulations relating to the interstate movement of seeds are \nobserved.\n\n--- PDF PAGE 81 ---\n_____________________________________________________________________________________ \nTR - Agricultural Crops Production NC III Promulgated April 2006 \n- 77 - \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Seeds \n1.1.\nThey may be from both horticultural and agronomic crops. \n2. Agricultural crops \n2.1. \nAgricultural crops covered by this unit include both \nhorticultural and agronomic crops. \n2.2. \nAgronomic crops covered by this unit include coarse grains, \ngrain legumes, coffee, coconuts, cotton, soya beans, peanuts \nand sugar cane. \n2.3. \nCrops may include fruit, vegetables, herbs, flowers, foliage, \nbulbs, tubers, nuts, mushrooms, wild harvest plants and oils.\n3. Measures may be \ntaken to improve \nseed \n3.1. \nMeasures taken can include removing pests and weeds, as \nwell as enhancing the nutrients of the area. Specifically, this \nmay include roguing of off-types and undesirable weeds, \ngrading out weed seeds and small grains and other impurities, \nenhancing the nutrient levels with pre-harvest applications, \nand careful harvesting to prevent cracked and damaged grain.\n4. Detrimental \nenvironmental \nimpacts \n4.1. \nPersistent application of chemicals to a particular area of soil \nover time can lead to a change in the soil performance, and \nany inappropriate disposal of containers or chemicals can \ncontaminate soils, crops and water.\n5. Personal protective \nequipment \n5.1. \nBoots, hat/hard hat, overalls, gloves, protective eyewear, \nhearing protection, respirator or face mask, and sun protection \n(sun hat, sunscreen).\n6. OHS \n6.1. \nThey include safe systems and procedures for storage, \nhandling and transportation of hazardous substances, \nchemicals selected taking into account toxicity levels and \nenvironmental effects, systems and procedures for the safe \noperation and maintenance of machinery and equipment, \nincluding hydraulics and guarding of exposed moving parts, \nsafe manual handling systems and procedures, safe systems \nand procedures for outdoor work, including protection from \nsolar radiation, selection, use and maintenance of relevant \npersonal protective clothing and equipment, and fire risk.\n7. Current marketing \n7.1. \nThey can be found in the plan itself, and through discussion \nwith management.\n8. Information regarding \nnew varieties or trial \nresults \n8.1. \nThis information would generally be sourced informally \nthrough discussion with operators in other techno-demo farms \n& research institutes, seed companies and organizations or \nthrough media outlets. Information may also be sourced \nthrough recommendations or directly through suppliers.\n9. Seed to be tested \n9.1. \nIt might be tested for purity, germination, vigour, seed weight, \nand disease identification.\n\n--- PDF PAGE 82 ---\n_____________________________________________________________________________________ \nTR - Agricultural Crops Production NC III Promulgated April 2006 \n- 78 - \nVARIABLE \nRANGE \n10. Records \n10.1. Information from each season will be useful in building a \nhistory for the organization, and for input into subsequent \nyears decision-making. Record keeping is essential. Records \nof each step along the way should be kept: results of \ncalculations, location of the area used for seed growing, \nvarieties used, soil types used for growing seed, seed \nimprovement methods used, water availability and time of \nharvest. \n10.2. Once harvested, records need to be kept of type, condition, \nand length of time in storage. Also of where it is to be sown, \nand the origin of the seed.\n11. Appropriate person \nfor analysis and \ndecision-making\n11.1. This is the person who will make decisions on the production \nand operations planning for sowing. \n12. Seed history \n12.1. Yields of parent crop, trueness to type, age, storage \ntreatments, source and type of parent crop and pathogens in \nparent crop.\n13. Seed quality \n13.1. Test weights per thousand grains or similar assessment, even \nsized grain, and nutrient enhanced grain.\n14. Seed storage \ncontrols \n14.1. Moisture and humidity, temperature, pesticide concentrations, \nand gas tightness.\n15. Seed selection, \nstorage, purchase \nand treatment \nprocedures \n15.1. Maintain high germination rate, minimize disease transmission \non farm and between farms, and ensure pest free status of \ncertified seed and should be free from impurities. \n16. Conditions that \nmaintain a high \ngermination \npercentage \n16.1. Low moisture levels, appropriate temperatures, and freedom \nfrom pests. \n17. Seed saved has the \nfollowing known \nfeatures \n17.1. Trueness to type, pest status, and insect free determine seed \nto be saved. \n18. OHS guidelines \n18.1. They might be to alert others in the organization, including \nworkers and family members, of planned presence of \ntransport, putting in place systems and procedures for \n18.2. the safe operation and maintenance of machinery and \nequipment, including hydraulics and guarding of exposed \nmoving parts \n18.3. the protection from organic and other dusts \n18.4. the safe systems and procedures for handling and storage of \ngrain and seed \n18.5. the protection against electrical hazards, especially over head \npower lines \n18.6. storage, handling and transportation of hazardous substances \n(pesticides) \n18.7. the selection, use and maintenance of relevant personal \nprotective clothing and equipment \n18.8. lifting and carrying. \n18.9. Safe systems and procedures should also be in place for \nworking in confined spaces, at height and on the grain mass.\n\n--- PDF PAGE 83 ---\n_____________________________________________________________________________________ \nTR - Agricultural Crops Production NC III Promulgated April 2006 \n- 79 - \nEVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency \nAssessment requires evidences that the candidate :\n1.1. \nsaved, prepared, grown and stored seed in a hygienic \nenvironment to ensure a successful crop the following year \nThe skills and knowledge required to save, prepare and store seed \nmust be transferable to a different work environment. For example, \nacross the range of grains grown, and in a range of different \ngeographic environments.\n2. Underpinning \nKnowledge and \nAttitudes \nKnowledge and understanding are essential to apply this standard in \nthe workplace, to transfer the skills to other contexts, and to deal with \nunplanned events. The knowledge requirements for this competency \nstandard are listed below: \n2.1. \nidentification of varieties \n2.2. \nseed treatment and cleaning measures \n2.3. \nsources of purchased seed \n2.4. \ninoculation treatments and seed dressings used within the \norganization \n2.5. \nrecords and documentation required for tracking and handling \nof seed \n2.6. \nstorage techniques and requirements for seed and grain \n2.7. \nenvironmental controls and codes of practice applicable to the \nenterprise \n2.8. \nrelevant legislation and regulations relating to OHS, contractor \nengagement, chemical use and application, vehicle and plant \nuse, and to the use, handling and sale of seed \n2.9. \nsound management practices and processes to minimize \nnoise, odours, and debris from sowing operations.\n3. Underpinning Skills\nTo achieve the performance criteria, appropriate literacy and \nnumeracy levels as well as some complementary skills are required. \nThese include the ability to: \n3.1. \nselect appropriate seed tests \n3.2. \napply pre and post-harvest treatments for seed \n3.3. \nidentify varieties from growth patterns \n3.4. \nidentify weed seeds and contaminants \n3.5. \nidentify pests in stored grain and initiate control measures \n3.6. \ncalculate volumes, capacities, areas, ratios for seed, storages, \nand chemicals \n3.7. \nkeep, update and maintain records relating to test results, \nprovenance, varieties, pest control measures, and other \nrelevant information about the seed \n3.8. \nobserve, identify and react appropriately to environmental \nimplications and OHS hazards.\n4. Resource \nImplications \n \nThe following resources must be provided:\n4.1. \nworkplace with saves, prepares and stores grain. \n4.2. \nworkplace information relating to grain storage \n4.3.\nenterprise procedures relating to grain storage\n5. Methods of \nAssessment \nCompetency should be assessed:\n5.1. \nthrough direct observation / demonstration \n5.2.\nportfolio assessment\n6. Context of \nAssessment \n6.1.\nAssessment should be in a workplace or in a simulated \nworkplace. \n6.2. \nDemonstration of competency over time and on a number of \noccasions at least three (3) different types of crops.\n\n--- PDF PAGE 84 ---\n_____________________________________________________________________________________ \nTR - Agricultural Crops Production NC III Promulgated April 2006 \n- 80 - \nUNIT OF COMPETENCY : \nIMPLEMENT VERTEBRATE PEST CONTROL PROGRAM \nUNIT CODE \n:"
