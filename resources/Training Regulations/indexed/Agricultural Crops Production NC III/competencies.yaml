        "evidence_guide": {
          "source_text": "1. Critical aspects \nof competency \nAssessment requires evidences that the candidate \n1.1. \nprepared bulk material storage - that the storage facility, the \nsurrounding area, and the bulk material handling equipment \nare cleaned, operable, and within the hygiene standards \nrequired by the organization. \nThe skills and knowledge required to prepare bulk material storage \nmust be transferable to a different work environment. For example, \nacross a range of storage facility types, materials and enterprise \nguidelines. \n2. Underpinning \nKnowledge and \nAttitudes \n \nKnowledge and understanding are essential to apply this standard in \nthe workplace, to transfer the skills to other contexts, and to deal with \nunplanned events. The knowledge requirements for this competency \nstandard are listed below: \n2.1. \nrange of construction methods, potential hazards, safety and \nstructural requirements for storage \n2.2. \nerection/dismantling for types of temporary storage used by \norganization \n2.3. \norganization and commodity quality requirements \n2.4. \n.organization hygiene requirements \n2.5. \ntypical signs of damage to be documented and reported \n2.6. \nappropriate legislative requirements, manufacturers \ninstructions and organization procedures/ instructions \n2.7. \nappropriate action in contingency situations \n2.8. \norganization requirements for protective equipment and safe \npractices in relation to OHS \n2.9. \npre-operational and safety checks, servicing and maintenance \nprocedures for tools and equipment \n2.10. potential hazards associated with the operation of basic tools \nand equipment \n2.11. general machine maintenance procedures \n2.12. machinery operating principles and operating methods/manual \nof operational procedures. \n2.13. machinery storage and protection methods \n2.14. relevant Provincial/municipal legislation, regulations and \ncodes of practice with regard to workplace OHS, and the use \nand control of machinery and equipment \n2.15. environmental impacts associated with the operation of \nmachinery and equipment \n2.16. personal protective clothing and equipment and when and \nhow it should be used \n2.17. cleaning and storage of machinery, equipment and materials \n2.18. organization recording and reporting procedures. \n3. Underpinning Skills \nTo achieve the performance criteria, appropriate literacy and \nnumeracy levels as well as some complementary skills are required. \nThese skills are: \n3.1. \nerect simple temporary bulk material storages \n3.2. \nuse communication systems \n3.3. \ncheck equipment and storage facilities, and identify current or \nimpending faults \n3.4.\nhandle and manoeuvre equipment\n\n--- PDF PAGE 108 ---\n_____________________________________________________________________________________ \nTR - Agricultural Crops Production NC III Promulgated April 2006 \n- 104 - \n3.5. \ncomplete pre-operational checks on basic tools and \nequipment \n3.6. \nperform routine safety, service and maintenance procedures \non tools, equipment and machinery \n3.7. \noperate hand and independently powered tools and cleaning \nequipment to industry standards \n3.8. \nclean, secure and store machinery and equipment \n3.9. \nperform basic trouble shooting \n3.10. recognize and rectify minor operational faults \n3.11. handle hazardous substances (fuels) safely \n3.12. read and interpret manufacturers specifications, work and \nmaintenance plans, and Material Safety Data Sheets \n3.13. interpret and apply task instructions, communicate with work \nteam and supervisor, and record and report faults, workplace \nhazards and accidents.\n4. Resource \nImplications \n \nThe following resources must be provided: \n4.1. \nworkplace with grain storage facilities \n4.2. \nmechanical or manual aids for load shifting \n4.3.\nenterprise procedures.\n5. Methods of \nAssessment \nCompetency should be assessed: \n5.1. \nThrough direct observation / demonstration \n5.2.\nPortfolio assessment\n6. Context of \nassessment \n6.1. \nAssessment should be in a workplace or in a simulated \nworkplace. \n6.2. \nDemonstration of competency over time and on a number of \noccasions.\n\n--- PDF PAGE 109 ---\n_____________________________________________________________________________________ \nTR - Agricultural Crops Production NC III Promulgated April 2006 \n- 105 - \nUNIT OF COMPETENCY : \nCOMPLY WITH INDUSTRY QUALITY ASSURANCE \nREQUIREMENTS \nUNIT CODE \n:"
        },
        "source_text": "AGRA611328 \nUNIT DESCRIPTOR \n: \nThis unit covers the skills and knowledge required to safely \nmaintain the site, the storage and equipment for handling, and \nstorage of bulk materials. At the completion of the work described \nin this standard, storages, surrounding areas and equipment are \nprepared in readiness for receiving grain at an acceptable level of \nhygiene. \n \n \nWork is likely to be under routine supervision with intermittent \nchecking. Responsibility for some roles and co-ordination within a \nteam may be required. Preparing bulk material storages is usually \nwithin established routines, methods and procedures. Competency \nat this level involves the application of knowledge and skills in the \nmaintenance of facilities, tools and equipment. \n \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1. Prepare to work in \nbulk material storage \narea \n1.1 \nWork to be undertaken is understood from work program \nwhere necessary, and confirmed with supervisor. \n1.2 \nOHS hazards are identified, risk assessed and suitable \ncontrols implemented. \n1.3 \nSuitable personal protective equipment is selected, used \nand maintained. \n1.4 \nTools and equipment suitable for the work to be undertaken \nare selected, checked and maintained, if necessary. \n1.5 \nEnvironmental implications of undertaking work in the bulk \nmaterial storage area are identified, likely outcomes assessed \nand, if necessary, responsible action taken. \n2. Prepare storage area 2.1 \nStorage site is cleaned of weeds, dust and spillage to \norganization requirements. \n2.2 \nRefuse is disposed of according to regulatory requirements. \n2.3 \nSite is maintained in a clean and tidy condition according to \norganization requirements. \n2.4 \nStorage site is prepared according to OHS standards. \n3. Prepare storages \n3.1 \nStorages are prepared according to OHS standards. \n3.2 \nBulk material storages are cleaned of all residues according to \norganization requirements. \n3.3 \nBulk material storages are checked for structural safety, \ndamage or deterioration, and repaired or reported as required \naccording to organization requirements. \n3.4 \nTemporary storages are prepared and erected to meet the \nneeds of the organization according to OHS standards.\n\n--- PDF PAGE 104 ---\n_____________________________________________________________________________________ \nTR - Agricultural Crops Production NC III Promulgated April 2006 \n- 100 - \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n4. Prepare bulk material \nhandling machinery \n4.1 \nBulk material handling machinery is cleaned free of \ncontamination and residues according to organization \nrequirements. \n4.2 \nBulk material handling equipment is adjusted and set \naccording to organization requirements. \n4.3 \nBulk material handling equipment is prepared ready for use \naccording to manufacturer’s instructions and OHS standards. \n5. Complete \nmaintenance \noperations \n5.1 \nWorkplace information is recorded clearly and accurately in \nthe format and at the time required by the organization. \n5.2 \nWaste is collected and disposed of or recycled to minimise \ndamage to the external environment. \n5.3 \nTools and equipment are cleaned and stored according to \norganization work procedures.\n\n--- PDF PAGE 105 ---\n_____________________________________________________________________________________ \nTR - Agricultural Crops Production NC III Promulgated April 2006 \n- 101 - \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. OHS hazards \n1.1. \nAmong the risks are operating and maintaining machinery and \nequipment, including hydraulics and exposed moving parts, \nnoise, organic and other dusts, working with, transporting and \nstoring hazardous substances (such as pesticides), using \nfumigants, working at heights, and working on the bulk \nmaterial mass. \n2. OHS risk \nThe range of actions are both systemic and at an operational level. \nThese are listed below. \n2.1. \nSystems should be in place to ensure the safe operation and \nmaintenance of machinery and equipment. Precautions \nshould also be in place to minimise exposure to noise and \norganic and other dusts. Systems and procedures for \nhandling and storing bulk material, as well as working with and \naround electricity, should also be in place. \n2.2. \nFixtures should be in place in all silos and storage sheds, \nincluding appropriate access ladders, hand rails and ladder \ncages and fine control equipment. \n2.3. \nEnvironmental conditions should be controlled. For example, \nkeeping moisture levels as low as possible will reduce the \nlikelihood of fire and silo collapse. \n2.4. \nProcedures should be in place and used for working on top of \nstored bulk material, working with bulk material mass \nmovement and stability, working within confined working \nspaces, moving vehicles, and working at height. \n2.5. \nRecord keeping should ensure that requirements in relation to \nproperly observing and using product labels and MSDS \nsheets, instruction manuals and written organizational \nprocedures. \n3. Personal protective \nclothing and \nequipment \n3.1. \nBoots, hat/hard hat, overalls, gloves, protective eyewear, \nhearing protection, respirator or face mask, and sun protection \n(sun hat, sun screen). \n4. Equipment \n4.1. \nCleaning equipment for hand use, air compressors, vacuum \ncleaners, mobile load handling plant, mowers/slashers, \nloading and unloading equipment, tractors, and portable \naugers, fire suits and hydrants should be in place. \n5. Preparation for \ncleaning and mobile \nequipment \n5.1. \nSite cleaning and mobile equipment use includes pre-\noperational checks, start-up, shutdown, and minor servicing to \norganization requirements. \n6. Bulk materials \n6.1. \nBulk materials stored may include the entire range produced \nor used by the organization and may include grains (cereals, \nlegumes, pulses, oilseeds, or pasture seeds), animal feed \n(e.g. meal), flour and fertilizers. \n7. Storage \n7.1. \nThey may be permanent and/or temporary storages, fixed \nand/or portable commodity handling equipment, the \nsurrounding areas, entry, exit and site roads. \n8. Cleaning activities \n8.1. \nThey are the handling of equipment, storage facilities, \nbuildings and surrounding grounds.\n\n--- PDF PAGE 106 ---\n_____________________________________________________________________________________ \nTR - Agricultural Crops Production NC III Promulgated April 2006 \n- 102 - \nVARIABLE \nRANGE \n9. Cleaning and \nmaintenance \n9.1. \nOn the storage site, it will be aspects of site tidiness and \ncleanliness, weed control, and cleaning of spilled materials \nand rubbish. \n10. Maintained \n10.1. The presence of water or water damage, presence and \nactivity of pests including insects, moulds, birds and rodents, \ndead vertebrate pest in storage, breakdown of storage \nsecurity and integrity, e.g. holes, cracks, poor sealing or \ngeneral physical deterioration, storm damage, and/or level of \nhygiene will need to be seen to. \n11. Workplace \ninformation \n11.1. Records may include environmental parameters, date of \nmaintenance work, and what has been checked/maintained. \n12. Waste \n12.1. Waste may include left over treatments, unused containers, \ngeneral debris, or discarded components. \n13. External environment 13.1. Environmental implications may include the contamination of \noff-site ground water or soils from solids, debris, nutrients or \nchemicals, foul smell should be reduced, air pollution. \n14. Organizations and \nstatutory instructions \n14.1. They might be those relating to health and safety, quality \ncontrol, administrative reporting, commodity storage and \nmovement control, residual fumigants and confined space \nentry. \n15. Potential emergency \nsituations \n15.1. Inclement weather during operations, machinery breakdowns, \nand storm damage to equipment and site & workers not in \ngood condition to work.\n\n--- PDF PAGE 107 ---\n_____________________________________________________________________________________ \nTR - Agricultural Crops Production NC III Promulgated April 2006 \n- 103 - \nEVIDENCE GUIDE \n \n1. Critical aspects \nof competency \nAssessment requires evidences that the candidate \n1.1. \nprepared bulk material storage - that the storage facility, the \nsurrounding area, and the bulk material handling equipment \nare cleaned, operable, and within the hygiene standards \nrequired by the organization. \nThe skills and knowledge required to prepare bulk material storage \nmust be transferable to a different work environment. For example, \nacross a range of storage facility types, materials and enterprise \nguidelines. \n2. Underpinning \nKnowledge and \nAttitudes \n \nKnowledge and understanding are essential to apply this standard in \nthe workplace, to transfer the skills to other contexts, and to deal with \nunplanned events. The knowledge requirements for this competency \nstandard are listed below: \n2.1. \nrange of construction methods, potential hazards, safety and \nstructural requirements for storage \n2.2. \nerection/dismantling for types of temporary storage used by \norganization \n2.3. \norganization and commodity quality requirements \n2.4. \n.organization hygiene requirements \n2.5. \ntypical signs of damage to be documented and reported \n2.6. \nappropriate legislative requirements, manufacturers \ninstructions and organization procedures/ instructions \n2.7. \nappropriate action in contingency situations \n2.8. \norganization requirements for protective equipment and safe \npractices in relation to OHS \n2.9. \npre-operational and safety checks, servicing and maintenance \nprocedures for tools and equipment \n2.10. potential hazards associated with the operation of basic tools \nand equipment \n2.11. general machine maintenance procedures \n2.12. machinery operating principles and operating methods/manual \nof operational procedures. \n2.13. machinery storage and protection methods \n2.14. relevant Provincial/municipal legislation, regulations and \ncodes of practice with regard to workplace OHS, and the use \nand control of machinery and equipment \n2.15. environmental impacts associated with the operation of \nmachinery and equipment \n2.16. personal protective clothing and equipment and when and \nhow it should be used \n2.17. cleaning and storage of machinery, equipment and materials \n2.18. organization recording and reporting procedures. \n3. Underpinning Skills \nTo achieve the performance criteria, appropriate literacy and \nnumeracy levels as well as some complementary skills are required. \nThese skills are: \n3.1. \nerect simple temporary bulk material storages \n3.2. \nuse communication systems \n3.3. \ncheck equipment and storage facilities, and identify current or \nimpending faults \n3.4.\nhandle and manoeuvre equipment\n\n--- PDF PAGE 108 ---\n_____________________________________________________________________________________ \nTR - Agricultural Crops Production NC III Promulgated April 2006 \n- 104 - \n3.5. \ncomplete pre-operational checks on basic tools and \nequipment \n3.6. \nperform routine safety, service and maintenance procedures \non tools, equipment and machinery \n3.7. \noperate hand and independently powered tools and cleaning \nequipment to industry standards \n3.8. \nclean, secure and store machinery and equipment \n3.9. \nperform basic trouble shooting \n3.10. recognize and rectify minor operational faults \n3.11. handle hazardous substances (fuels) safely \n3.12. read and interpret manufacturers specifications, work and \nmaintenance plans, and Material Safety Data Sheets \n3.13. interpret and apply task instructions, communicate with work \nteam and supervisor, and record and report faults, workplace \nhazards and accidents.\n4. Resource \nImplications \n \nThe following resources must be provided: \n4.1. \nworkplace with grain storage facilities \n4.2. \nmechanical or manual aids for load shifting \n4.3.\nenterprise procedures.\n5. Methods of \nAssessment \nCompetency should be assessed: \n5.1. \nThrough direct observation / demonstration \n5.2.\nPortfolio assessment\n6. Context of \nassessment \n6.1. \nAssessment should be in a workplace or in a simulated \nworkplace. \n6.2. \nDemonstration of competency over time and on a number of \noccasions.\n\n--- PDF PAGE 109 ---\n_____________________________________________________________________________________ \nTR - Agricultural Crops Production NC III Promulgated April 2006 \n- 105 - \nUNIT OF COMPETENCY : \nCOMPLY WITH INDUSTRY QUALITY ASSURANCE \nREQUIREMENTS \nUNIT CODE \n:"
