  "source_section_text": "SECTION 3 TRAINING STANDARDS \n \nThis set of standards provides Technical and Vocational Education and Training (TVET) \nproviders with information and other important requirements to consider when designing training \nprograms for Agricultural Crops Production NC III. \n \nThis includes information on curriculum design; training delivery; trainee entry requirements; \ntools and equipment; training facilities; and trainers qualification. \n \n3.1 CURRICULUM DESIGN \n \nCourse Title: AGRICULTURAL CROPS PRODUCTION \nNC Level: NC III \n \nNominal Training Duration: 445 Hours \n \n \n \n \n \nCourse Description: \n \nThis course is designed to enhance the knowledge, skills and attitude of Tailor in accordance \nwith industry standards. In general, it covers core competencies on undertaking preparation of \nland for agricultural crop production, implementing a post-harvest program, implementing a plant \nnutrition program, controlling weeds and preparing and applying chemicals. In agronomic, it covers \ncore competencies on establishing agronomic crops, undertaking agronomic crop maintenance \nactivities, undertaking agronomic crop harvesting activities, saving, preparing and storing \nagricultural seed and implementing vertebrate pest control program. \n \nTo obtain this, all units prescribed for this qualification must be achieved: \n \n \nBASIC COMPETENCIES \n18 Hours \n \nUnit of \nCompetency\nLearning Outcomes \nMethodology \nAssessment \nApproach\n1. Lead workplace \ncommunication. \n1.1. Communicate information \nabout workplace processes \n1.2. Lead workplace discussions \n1.3. Identify and communicate \nissues arising in the \nworkplace\n Group \ndiscussion \n Role play \n Brainstorming \n \n Observation \n Interviews \n2. Lead small \nteams. \n \n2.1. Provide team leadership \n2.2. Assign responsibilities \namong members \n2.3. Set performance expectation \nfor team members \n2.4.\nSupervise team performance\n Lecture \n Demonstration \n Self-paced \n(modular) \n Demonstration \n Case studies \n3. Develop and \npractice \nnegotiation skills\n \n3.1. Identify relevant information \nin planning negotiations \n3.2. Participate in negotiations \n3.3. Document areas for \nagreement\n Direct \nobservation \n Simulation/ \n role playing \nCase studies\n Written test \n Practical/ \nperformance \ntest\n\n--- PDF PAGE 133 ---\n_____________________________________________________________________________________ \nTR - Agricultural Crops Production NC III Promulgated April 2006 \n- 129 - \nUnit of \nCompetency \nLearning Outcomes \nMethodology \nAssessment \nApproach \n4. Solve problems \nrelated to work \nactivities \n \n4.1. Explain the analytical \ntechniques \n4.2. Identify the problem \n4.3. Determine the possible \ncause/s of the problem\n Direct \nobservation \n Simulation/Rol\ne playing \nCase studies\n Written test \n Practical/perfor\nmance test \n5. Use \nmathematical \nconcepts and \ntechniques \n5.1. Identify mathematical tools \nand techniques to solve \nproblem \n5.2. Apply mathematical \nprocedures/solution \n5.3. Analyze results\n Direct \nobservation \n Simulation/ \nrole playing \n Case studies \n Written test \n Practical/ \nperformance \ntest \n6. Use relevant \ntechnologies \n6.1. Identify appropriate \ntechnology \n6.2. Apply relevant technology \n6.3. Maintain/enhance relevant \ntechnology\n Direct \nobservation \n Simulation/ \nrole playing \nCase Studies\n Written test \n Practical/ \nperformance \ntest \n \n \nCOMMON COMPETENCIES \n14 Hours \n \nUnit of \nCompetency\nLearning Outcomes \nMethodology \nAssessment \nApproach\n1. Apply safety \nmeasures in \nfarm operations \n1.1. Determine areas of concern \nfor safety measures \n1.2. Apply appropriate safety \nmeasures \n1.3. Safekeep/maintain/ dispose \ntools, materials and outfit. \n Self-paced/ \nmodular \n Lecture/ \nDiscussion \n Interaction \n Practical \nDemonstration \nVisit/tour\n Oral/Written \nInterviews \n Direct \nObservation \n Practical \nDemonstration \n2. Use farm tools \nand equipment \n2.1. Prepare and use farm tools \n2.2. Prepare and operate farm \nequipment \n2.3. Perform preventive \nmaintenance \nprocedures/practices \n Self-paced/ \nmodular \n Lecture/ \nDiscussion \n Interaction \n Practical \nDemonstration \nVisit/tour\n Oral/Written \nInterviews \n Direct \nObservation \n Practical \nDemonstration \n3. Perform \nestimation and \nbasic calculation\n \n \n \n3.1. Perform estimation \n3.2. Perform basic workplace \ncalculation \n3.3. Apply corrective measures \nas necessary \n Self-\npaced/modular \n Lecture/Discus\nsion \n Interaction \n Practical \nExercise\n Oral/Written \nexamination \n Practical \nexercise\n\n--- PDF PAGE 134 ---\n_____________________________________________________________________________________ \nTR - Agricultural Crops Production NC III Promulgated April 2006 \n- 130 - \nCORE COMPETENCIES \n413 Hours \nGeneral \n \nUnit of \nCompetency \nLearning Outcomes \nMethodology \nAssessment \nApproach \n1. Undertake \npreparation of \nland for \nagricultural crop \nproduction \n1.1 Prepare for cultivation \n \n Discussion \n Written exam \n Actual \nDesigning\n1.2 Prepare the cultivating \nequipment \n Discussion \n Demonstration \n Written exam \n Actual \nDemonstration \n Observation \n1.3 Cultivate soil \n Discussion \n Demonstration \n Written exam \n Actual \nDemonstration \n Observation \n1.4 Prepare site for planting \n Demonstration \n \n Actual \nDemonstration \nQuestioning\n1.5 Complete land preparation \noperations \n Demonstration \n \n Actual \nDemonstration \nQuestioning\n2. Implement a \npost-harvest \nprogram \n2.1 \nPrepare for implementation \nof post-harvest operations \n Discussion \n Written exam \n \n2.2 \nCo-ordinate post-harvest \nwork \n Demonstration \n \n Actual \n Demonstration \nQuestioning\n2.3 \nImplement post-harvest \ntreatments \n Demonstration \n ctual \nDemonstration \nQuestioning\n2.4 \nImplement hazardous waste \ndisposal guidelines \n Demonstration \n Actual \nDemonstration \nQuestioning\n2.5 \nImplement packaging \nrequirements of produce \n Demonstration \n Actual \nDemonstration \nQuestioning\n2.6 \nImplement storage \nrequirements of produce \n Demonstration \n Demonstration \nwith \nQuestioning\n3. Implement a \nplant nutrition \nprogram \n3.1 \nPrepare for implementation \nof the plant nutrition program \n Demonstration \n Field visit \n Direct \nObservation \nand Interview\n3.2 \nMonitor soil pH \n Demonstration \n Simulation \n Direct \nObservation \nand Interview\n3.3 \nDetermine nutritional \nproblems in plants \n Demonstration \n Simulation \n Direct \nObservation \nand Interview\n3.4 \nPrepare to use fertilizers \n \n Demonstration \n Simulation \n Direct \nObservation \nand Interview\n\n--- PDF PAGE 135 ---\n_____________________________________________________________________________________ \nTR - Agricultural Crops Production NC III Promulgated April 2006 \n- 131 - \nUnit of \nCompetency \nLearning Outcomes \nMethodology \nAssessment \nApproach \n3.5 \nPrepare application \nequipment \n Demonstration \n Simulation \n Direct \nObservation \nand Interview\n3.6 \nApply specific products at \nappropriate rates \n Demonstration \n Simulation \n Direct \nObservation \nand Interview\n4. Control weeds \n4.1 \nAssess weed infestation \n Demonstration \n Simulation \n Direct \nObservation \nand Interview\n4.2 \nPlan the implementation of \ncontrol measures \n Demonstration \n Simulation \n Direct \nObservation \nand Interview\n4.3 \nImplement control measures \n Demonstration \n Simulation \n Direct \nObservation \nand Interview\n4.4 \nMonitor control weeds \n Demonstration \n Simulation \n Direct \nObservation \nand Interview\n5. Prepare and \napply chemicals \n5.1 \nDetermine the need for \nchemical use \n Demonstration \n Simulation \n Direct \nObservation \nand Interview\n5.2 \nPrepare appropriate \nchemical \n Demonstration \n Simulation \n Direct \nObservation \nand Interview\n5.3 \nPrepare to use chemicals \naccording to the label and \nMSDS\n Demonstration \n Simulation \n Direct \nObservation \nand Interview\n5.4 \nApply chemicals \n Demonstration \n Simulation \n Direct \nObservation \nand Interview\n5.5 \nClean up following chemical \napplication \n Demonstration \n Simulation \n Direct \nObservation \nand Interview\n5.6 \nRecord application details \n Demonstration \n Simulation \n Direct \nObservation \nand Interview\n \nAgronomic \n \nUnit of \nCompetency \nLearning Outcomes \nMethodology \nAssessment \nApproach \n1. Establish \nagronomic \ncrops \n1.1 \nPrepare machinery and \nequipment for use \n1.2 \nPrepare for agronomic crop \nestablishment \n1.3 \nSow the crop \n1.4\nComplete seeding operations\n Demonstration \n Simulation \n Direct \nObservation \nand Interview\n\n--- PDF PAGE 136 ---\n_____________________________________________________________________________________ \nTR - Agricultural Crops Production NC III Promulgated April 2006 \n- 132 - \nUnit of \nCompetency \nLearning Outcomes \nMethodology \nAssessment \nApproach \n2. Undertake \nagronomic crop \nmaintenance \nactivities \n2.1 Assess agronomic crop \ncondition, growth and \nrequirements \n2.2 Apply fertilizer and \namendments \n2.3 Monitor crop condition, growth \nand requirements \n2.4 Complete cleaning and \nhygiene operations\n Demonstration \n Simulation \n Direct \nObservation \n Interview \n3. Undertake \nagronomic crop \nharvesting \nactivities \n3.1 Prepare to harvest agronomic \ncrops \n3.2 Prepare the harvesting \nequipment \n3.3 Harvest crops \n3.4 Complete harvesting \noperations\n Demonstration \n Simulation \n Direct \nObservation \n Interview \n4. Save, prepare \nand store \nagricultural \nseed \n4.1 Select seed from agricultural \ncrops \n4.2 Evaluate and grade seed \n4.3 Store seed \n4.4\nCollect and deliver seed\n Demonstration \n Simulation \n Direct \nObservation \n Interview \n5. Implement \nvertebrate pest \ncontrol \nprogram \n \n5.1 Assess requirements for pest \ncontrol \n5.2 Prepare to implement control \nprogram \n5.3 Control vertebrate pests \n5.4\nComplete control program\n Demonstration \n Simulation \n Direct \nObservation \n Interview \n \n \n3.2 TRAINING DELIVERY \n \nThe delivery of training should adhere to the design of the curriculum. Delivery should be \nguided by the 10 basic principles of competency-based TVET. \n \n• The training is based on curriculum developed from the competency standards; \n• Learning is modular in its structure; \n• Training delivery is individualized and self-paced; \n• Training is based on work that must be performed; \n• Training materials are directly related to the competency standards and the curriculum \nmodules; \n• Assessment is based in the collection of evidence of the performance of work to the \nindustry required standard; \n• Training is based both on and off-the-job components; \n• Allows for recognition of prior learning (RPL) or current competencies; \n• Training allows for multiple entry and exit; and \n• Approved training programs are Nationally Accredited \n \nThe competency-based TVET system recognizes various types of delivery modes, both \non and off-the-job as long as the learning is driven by the competency standards specified by\n\n--- PDF PAGE 137 ---\n_____________________________________________________________________________________ \nTR - Agricultural Crops Production NC III Promulgated April 2006 \n- 133 - \nthe industry. The following training modalities may be adopted when designing training \nprograms: \n• The dualized mode of training delivery is preferred and recommended. Thus programs \nwould contain both in-school and in-industry training or fieldwork components. Details can \nbe referred to the Dual Training System (DTS) Implementing Rules and Regulations. \n• Modular/self-paced learning is a competency-based training modality wherein the trainee \nis allowed to progress at his own pace. The trainer just facilitates the training delivery. \n• Peer teaching/mentoring is a training modality wherein fast learners are given the \nopportunity to assist the slow learners. \n• Supervised industry training or on-the-job training is an approach in training designed to \nenhance the knowledge and skills of the trainee through actual experience in the \nworkplace to acquire specific competencies prescribed in the training regulations. \n• Distance learning is a formal education process in which majority of the instruction occurs \nwhen the students and instructor are not in the same place. Distance learning may \nemploy correspondence study, audio, video or computer technologies. \n \n \n3.3 TRAINEE ENTRY REQUIREMENTS \n \nTrainees or students wishing to gain entry into this course should possess the following \nrequirements: \n \n• can communicate either oral and written \n• physically and mentally fit \n• with good moral character \n• can perform basic mathematical computation \n \nThis list does not include specific institutional requirements such as educational \nattainment, appropriate work experience, and others that may be required of the trainees by \nthe school or training center delivering the TVET program. \n \n \n3.4 TOOLS AND EQUIPMENT AND MATERIALS \nAGRICULTURAL CROPS PRODUCTION NC III \n \nRecommended list of tools, equipment and materials for the training of 25 trainees for \nAgricultural Crops NC III \n \nTOOLS \nEQUIPMENT \nMATERIALS \nQTY \nDESCRIPTION \nQTY \nDESCRIPTION \nQTY \nDESCRIPTION \n25 pcs • Bolos \n2 \n• Booth/temporary \nshed\n250 pcs. \n• Agri bags, plastic \n10 pcs • Broomstick \n5 \n• Cart (Kariton & \nparagus)\n500 pcs. \n• Bamboo stick \n5 pcs \n• Calculator \n1 \n• Coolroom \n5 pcs. \n• Basket \n5 pcs \n• Container \n1 \n• Comb-tooth harrow \n5 rims \n• Bond paper \n5 sets \n• Cutting tools \n5 \n• Computer with \nrecord keeping \n5 pcs. \n• Catching nets\n\n--- PDF PAGE 138 ---\n_____________________________________________________________________________________ \nTR - Agricultural Crops Production NC III Promulgated April 2006 \n- 134 - \nTOOLS\nEQUIPMENT\nMATERIALS\nQTY\nDESCRIPTION\nQTY\nDESCRIPTION\nQTY\nDESCRIPTION\nsoftware \napplications\n5 sets \n• Digging tools \n1 \n• Crates \n3 dozen \n• Clips \n2 pcs \n• Drying meter \n1 \n• Drying oven \n5 sacks \n• Coconut dust \n10 pcs \n• Dulos \n1 \n• Farm/ field \n5 sacks \n• Compost \n5 pcs \n• Fruit crate \n1 \n• Greenhouse/ \nnursery\n1 sack of \neach \n• Fertilizers-various \n5 sets \n• Harvesting tools \n1 \n• Harvesting \nequipment \n1 kit \n• First aide \nsupplies/medicine \n25 pcs • Hat \n1 \n• Irrigation system \n(sprinkler, mist/drip \nirrigation)\n5 bottles \n• Flower inducer \n5 pcs \n• Knapsack \nsprayer \n1 \n• Mower (grass \ncutter)\n5 bottles \n• Fungicides \n5 sets \n• Knife \n1 \n• Over head \nprojector (OHP)\n25 pairs \n• Gloves \n5 pcs \n• Light hoe \n1 \n• Portable chain saw \n5 sacks \n• Growing media \n(garden soil, \nsewed sand, \ncompost, soil, \nmanure and \nsawdust/rice\n2 pcs \n• Moisture meter \n1 \n \n• Post-Harvest \ntreatment \nequipment\n5 pcs. \n• Killing bottles \n5 \n• Personal \nprotection \nequipment\n1 \n• Power sprayer \n \n \n2 pcs \n• Petri-dish \n1 \n• Propagation \nEquipment\n5 pcs. \n• Marking pens \n3 pcs \n• pH meter \n1 \n• Pump for irrigation \n25 pcs. \n• Masks \n5 pcs \n• Pick mattock \n1 \n• \nRotavator \n25 pcs. \n• Material Safety \nData Sheets\n5 pcs \n• Picking knife \n1 \n• \nService vehicle \n5 sacks \n• Mulching material\n5 pcs \n• Plow \n1 \n• \nSorting /Grading \nequipment\n25 m \n• Hair nets \n2 sets \n \n• Plumbing tools \n2 \n• \nSpike tooth \nharrow \n20 \n• Packaging \nmaterials, \nassorted\n5 sets \n• Post-Harvest \ntreatment tools \n1 \n• \nStorage room \n5 \n• Pail \n25 pcs • Protective coat \n1 \n• \nSurface irrigation \