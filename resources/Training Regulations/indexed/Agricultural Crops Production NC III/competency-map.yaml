  "source_text": "COMPETENCY MAP FOR AGRI-FISHERY SECTOR \nAGRICULTURAL CROPS PRODUCTION SUB-SECTOR \nCOMMON UNITS OF COMPETENCY \n \n \nBASIC UNITS OF COMPETENCY \n \nDevelop Team and Individual \nApply Problem Solving \nTechniques in the Workplace \nPlan and Organize Work \n \n \n \n \n \n \nApply basic first aid \n \nUse relevant technologies \nSolve problems related to \nwork activities \nUse mathematical \nconcepts and techniques \n \n \n \n \n \nPerform estimation and \ncalculation \n \nLead Workplace \nCommunication \nLead Small Team \nDevelop and practice \nnegotiation skills \n \n \n \n \n \nUse farm tools and \nequipment \n \nParticipate in Workplace \nCommunication \nWork in a Team \nEnvironment \nDemonstrate work values \n \n \n \n \n \nApply safety measures in \nfarm operations \n \nReceive and Respond to \nWorkplace Communication \nWork With Others \n \nPractice basic housekeeping \nprocedures\n\n--- PDF PAGE 144 ---\n_____________________________________________________________________________________ \nTR - Agricultural Crops Production NC III Promulgated April 2006 \n- 140 -",
