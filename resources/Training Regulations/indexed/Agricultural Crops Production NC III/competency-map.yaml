  "source_text": "Section 1. Successful candidates shall be awarded a National\nCertificate signed by the TESDA Director General.\n4.2.\nThe qualification of Agricultural Crops Production NC III may be attained through:\n4.2.1. Accumulation of Certificates of Competency (COCs) in the following areas:\n4.2.1.1 Prepare land for agricultural crop production\n4.2.1.2 Implement post-harvest program\n4.2.1.3 Implement plant nutrition program\n4.2.1.4 Control weeds\n4.2.1.5 Prepare and apply chemicals\n4.2.1.6 Establish agronomic crops\n4.2.1.7 Undertake agronomic crop maintenance program\n4.2.1.8 Undertake agronomic crop harvesting activities\n4.2.1.9 Save, prepare and store agricultural seed\n4.2.2.0 Implement vertebrate pest control program\nSuccessful candidates shall be awarded Certificates of Competency (COCs)\n4.3.\nUpon accumulation and submission of all COCs acquired for the relevant units of\ncompetency comprising a qualification, an individual shall be issued the\ncorresponding National Certificate.\n4.4.\nAssessment shall focus on the core units of competency. The basic and common\nunits shall be integrated or assessed concurrently with the core units.\n4.5.\nElective units may be selected from the list below depending on workplace\nrequirements and/or specialization. To increase flexibility and enhance employability,\nelective units of competency may also be chosen from any other promulgated\nTraining Regulations at the same NC level or one level higher (NC IV), including\nAgricultural Crops Production NC IV. Certificates of Competency shall be issued for\neach additional unit undertaken. The candidate however may be awarded the\nqualification of Agricultural Crops Production NC III based on the accumulation of\ncore units as specified in 4.2.1., even without these electives:\n4.5.1. Follow site quarantine procedures\n4.5.2. Collect samples for a rural production or horticultural monitoring program\n4.5.3. Handle bulk materials in storage area\n4.5.4. Prepare grain storages\n4.5.5. Comply with industry quality assurance requirements\n4.5.6. Maintain and monitor environmental work practices\n4.5.7. Keep records for farm business\n4.5.8. Perform specialized machinery maintenance\n4.5.9. Install irrigation system\n4.5.\nThe following are qualified to apply for assessment and certification:\n4.5.1. Graduates of formal, non-formal and informal including enterprise-based\ntraining programs.\n4.5.2. Experienced workers (wage employed or self-employed)\n4.6.\nThe guidelines on assessment and certification are discussed in detail in the\nProcedures manual on Assessment and Certification and Guidelines on the\nimplementation of the Philippine TVET Qualification and Certification System.\n\n--- PDF PAGE 142 ---\n_____________________________________________________________________________________\nTR - Agricultural Crops Production NC III Promulgated April 2006\n- 138 -\n\n\nCOMPETENCY MAP FOR AGRI-FISHERY SECTOR\nAGRICULTURAL CROPS PRODUCTION SUB-SECTOR\nCORE UNITS OF COMPETENCY\nImplement a plant\nestablishment program\nTransport, handle and store\nchemicals\nSupervise agricultural crop\nestablishment\n\nImplement and monitor quality\nassurance procedures\nSupport and review business\nstructures and relationships\nPromote plant health\nImplement and monitor a\nproperty improvement plan\nSupervise maintenance of\nmachinery and equipment\nDevelop a horticultural crop\nmaintenance program\nAnalyze and interpret\nproduction data\n\n\n\n\n\n\n\n\n\n\n\nImplement vertebrate pest\ncontrol program\nEstablish agronomic crops\nCollect samples for a rural\nproduction of horticulture\nmonitoring program\n\nSave, prepare and store\nagricultural seed\nUndertake agronomic crop\nmaintenance activities\nCoordinate machinery and\nequipment maintenance\nand repair for agricultural\ncrops\nOperate pertigation\nequipment\nOperate within a budget\nframework\nPlan a propagation\nprogram\nSupervise agronomic crop\nharvesting\n\n\n\n\n\n\n\n\n\n\n\n\nUndertake agronomical crop\nmaintenance activities\nUndertake agronomic crop\nharvesting activities\nSave, prepare and store\nagricultural seed\n\nUndertake field budding and\ngrafting\nKeep records for a farm\nbusiness\nMonitor and operate water\ntreatment processes\nComply with industry quality\nassurance requirements\nTransport farm produce or\nbulk materials\nSupervise horticultural crop\nharvesting\nControl weeds, pests and /or\ndiseases in crops\n\n\n\n\n\n\n\n\n\n\n\nProduce fruit bearing crops\nPerform post harvest\noperations of major tropical\nfruits\nPerform post harvest\noperation of major lowland\nand semi-temperate\nvegetable crops\n\nPrepare land for\nagricultural crop production\nPrepare and apply\nchemicals\nimplement a plant nutrition\nprogram\nControl weeds\nImplement a post-harvest\nprogram\nEstablish agronomic crops\nImplement vertebrate pest\ncontrol program\n\n\n\n\n\n\n\n\n\n\n\nSupervise agronomic crop\nmaintenance\nMaintain the workplace\nSupport agronomic crop work\n\nSupport horticultural crop work\nSupport irrigation\nwork\n\nSupport nursery\nwork\nConduct pre-horticultural\nfarm operations\nProduce vegetables\nPlan & implement a chemical\nuse program\nApply basic first aid\n\n--- PDF PAGE 143 ---\n_____________________________________________________________________________________\nTR - Agricultural Crops Production NC III Promulgated April 2006\n- 139 -\n\nContinuation ….. Competency Map for Agri Fishery Sector ( Agricultural Crops Sub-Sector)\n\nCOMPETENCY MAP FOR AGRI-FISHERY SECTOR\nAGRICULTURAL CROPS PRODUCTION SUB-SECTOR\nCOMMON UNITS OF COMPETENCY\n\n\nBASIC UNITS OF COMPETENCY\n\nDevelop Team and Individual\nApply Problem Solving\nTechniques in the Workplace\nPlan and Organize Work\n\n\n\n\n\n\nApply basic first aid\n\nUse relevant technologies\nSolve problems related to\nwork activities\nUse mathematical\nconcepts and techniques\n\n\n\n\n\nPerform estimation and\ncalculation\n\nLead Workplace\nCommunication\nLead Small Team\nDevelop and practice\nnegotiation skills\n\n\n\n\n\nUse farm tools and\nequipment\n\nParticipate in Workplace\nCommunication\nWork in a Team\nEnvironment\nDemonstrate work values\n\n\n\n\n\nApply safety measures in\nfarm operations\n\nReceive and Respond to\nWorkplace Communication\nWork With Others\n\nPractice basic housekeeping\nprocedures\n\n--- PDF PAGE 144 ---\n_____________________________________________________________________________________\nTR - Agricultural Crops Production NC III Promulgated April 2006\n- 140 -\nDEFINITION OF TERMS\n\nFor the purpose of this standard, the word\n• Aflatoxin – the toxin produced by some strains of the fungi ASPERGILUS FLAVUS and\nASPERGILUS PARASTICUS; the most potent carcinogen yet discovered.\n• Agronomy – the application of the various soil and plant sciences to soil management and\nraising of crops.\n• Agronomic crops – may include coarse grains, grain legumes, coffee, coconuts, cotton,\nsoya beans, peanuts and sugar cane.\n• Agricultural crops – may include fruits, vegetables, herbs, flowers, foliage, bulbs, tubers,\nnuts, mushrooms, wild harvest plants and oils.\n• Ambient condition– ordinary room temperature and relative humidity.\n• Ambient air – the surrounding air (atmospheric).\n• Ambient storage – any treatment or practice extending post harvest life of harvested\ncommodity beyond that of similar commodity held under ambient conditions without\ntreatment.\n• Airflow rate – the amount of air passing through an obstruction per unit of time.\n• ACIAR – Australian Center for International Agricultural Research\n• AFHB – ASEAN Food Handling Bureau\n• BPRE – Bureau of Post harvest Research & Extension\n• Curing – process of toughening and self-healing of bruises and skinned areas in root and\ntubes crops or the rapid closing of the neck of bulb crops under favourable conditions\n• Driller – a machine for sowing in furrows\n• Drip Irrigation – application of water through small tubes and orifices or emitters which\ndischarge small quantity of water to the base of the plant\n• Dry-bulb temperature – the temperature of air indicated by a standard temperature\n• Equilibrium moisture content – the moisture content at which moisture in a product is in\nequilibrium with the surrounding air. The product does not gain or loss moisture.\n• Fogging – to cover or envelope with fog\n• Foliar Fertilizer – fertilizer formulation containing nitrogen, phosphorous and potassium\nplus selected micronutrient element such as (Ca, Mg, Mn, Fe, Zn, Cl, B, Cu, S) applied by\nspraying on the leaves\n• Fumigant – a chemical compound which acts in the gaseous state to destroy insects and\ntheir larvae.\n• Fumigation – the process of treating stored products with insecticides/pesticides and the\nlike in fumes or vapor form.\n• Furrow Irrigation – a method of supplying water through a canal system wherein water\nflows down or across the slope of the field\n• Furrowing – final step in land preparation by making furrows or beds for planting\n• GATT – General Agreement on Tariff and Trade\n\n--- PDF PAGE 145 ---\n_____________________________________________________________________________________\nTR - Agricultural Crops Production NC III Promulgated April 2006\n- 141 -\n• Grading – the process of classifying into groups according to a set of recognized criteria of\nquality and size, each group bearing an accepted name and size grouping.\n• Growing Medium – mixture of different materials such as soil, sand, compost, coir dust,\nrice hull, perlite, peat, etc. for growing seedlings\n• HACCP – Hazard Analysis Critical Control Points\n• Hardening – the process of gradually withholding water and exposing to direct sunlight to\nprevent seedlings from transplanting stress/shock\n• Harrowing – breaking of large soil clods that are caused by plowing\n• Hilling-Up – the process of covering the applied fertilizer material by raising the soil\ntowards the base of the plant to further stabilize its stand for better plant growth.\n• Hygrometer – an instrument that measures humidity.\n• Insect pest – a destructive or harmful insect.\n• Irrigation - any method of supplying water to sustain plant growth\n• Off-Baring- process of cultivating the soil away from the base of the plants\n• Pricking-Off- methods of transferring of seedling to avoid overcrowding\n• Larvae – the first stage of the life cycle of insects after leaving the egg.\n• Manometer – an instrument that measures air pressure.\n• Maturity – the quality or state of ripeness, or of being fully developed grain.\n• Maturity index – signs or indications that a commodity is mature and is ready to be\nharvested.\n• Moisture content – the conventional index used to determine whether the seed is dry\nenough for safe storage or for milling usually expressed in percent (% M.C.).\n• Molds – superficial often woolly growth produced on various forms of organic matter,\nespecially when damp or decaying.\n• NFA – National Food Authority\n• Packaging – technology or process to ensure adequate protection and safe delivery of a\nproduct from the produces to the ultimate consumer.\n• Packing – act of putting commodities in a container.\n• Packinghouse – place where the preparatory steps for storage or marketing are done.\n• Pallet – low portable platform made of wood or metal or in combination to facilitate\nhandling, storage or transport of materials as a unit load using forklift.\n• Perishables – food crops for which value and/or quality is maintained over a short period\nof time after harvest. These include fruits, vegetables, flowers, young coconut, nursery\nstocks and some staple root crops such as sweet potato, cassava and yam.\n• Postharvest disease – disease observed after harvest regardless of when or where initial\ninfestation took place.\n• Post harvest handling – specific term used for the movement of commodities and\noperations through which a commodity undergoes from harvest to possession of the fixed\nconsumer, includes the technological aspects of marketing and distribution.\n• Post harvest infection – infection that takes place after harvest.\n\n--- PDF PAGE 146 ---\n_____________________________________________________________________________________\nTR - Agricultural Crops Production NC III Promulgated April 2006\n- 142 -\n• Post harvest life – period of time during which a commodity is still acceptable for its\nintended purpose.\n• Pre cooling – strictly, it means the rapid cooling (48 hours or less) of a commodity to a\ndesired transit or storage temperature soon after harvest before it is stored or moved in\ntransit.\n• Pupa – an intermediate stage of an insect that preys on one or more plants and animals\nthat man wishes to preserve for his own use.\n• Refrigeration – process of removing heat from a compartment or substance so that\ntemperature is lowered and then maintained at a desirable level, usually refers to\nrefrigeration by mechanical means.\n• Relative humidity – the actual vapor pressure of the air relative to saturation.\n• Respiration – biological process by which organic materials are broken down to simpler\nforms accompanied by the release of energy and heat.\n• Ripening – the state of development of a fruit when it becomes soft and edible applies\nstrictly to climacteric type fruit.\n• Rodents – refer to rats and mice which destroy grains and other stored products.\n• Senescence – final phase in the life of an organ in which a series of normally irreversible\nevents are initiated leading to cellular breakdown or death of the organ.\n• Side-Dress Fertilizer – additional amount of any fertilizer materials applied at the onset of\nflowering to complete the nutritional requirement of the crop\n• Sprinkler Irrigation – a mechanical method of supplying water over the standing crop by\nmeans of a nozzle which is rotated by water pressure\n• Synthetic Mulch – mulching materials made either of polyethylene or non-woven fabric\n• Sorting – the process of classifying into groups designated by the person classifying crops\nor commodities the produce either according to a set criteria.\n• Standard – the set of criteria and specifications of quality determining the grades,\ndescribed as product characteristics such as maturity, color, cleanliness, shape, free from\ndecay and blemishes and uniformity of size.\n• Storage – process of keeping horticultural crops in a structure designed to protect the\nstored products from inclement weather and pests for a short or long period of time to await\nprocessing or movement to other location.\n• Storage life – the longest time produce can be kept in a sound marketable condition.\n• Tachometer – an instrument that measures revolutions per minute\n• Tillage – the mechanical manipulation of the soil\n• Transplants – vegetable seedlings produced for transplanting\n• Trellis – a support structure for vinyl crops and can either be T, I, Y, A shaped\n• Velometer – an instrument that measures velocity of air flow\n• Waxing – application of a thin film of surface coating to fruits and vegetables.\n• Wet-bulb temperature – temperature of moist air indicated by a thermometer whose bulb\nis covered with a moist wick which the air flow passing over has a velocity of 15 ft per\nsecond.\n\n--- PDF PAGE 147 ---\nACKNOWLEDGEMENTS\n\nThe Technical Education and Skills Development Authority (TESDA) wishes to extend\ngratitude and appreciation to the many representatives of business, industry, academe and\ngovernment agencies who donated their time and expertise to the development and validation of\nthese Training Regulations.\n\n•\nTHE TECHNICAL ADVISORY PANEL (TAP)\n\nDr. RODOLFO P. ESTIGOY\nMr. ALEJANDRO T. ESCANO\nChief\nPresident\nBureau of Post Harvest Research and\nExtension\nCentral Luzon State University, Science City of\nMuñoz, Nueva Ecija\nPhilippine Chamber of Agriculture and Food\n(PCAFI)\nMFI Bldg. Otigas Avenue Extension, Pasig City\n\n\nMr. EDWIN ANDOT\nDr. ALMA M. DELA CRUZ\nPresident\nChamber of Agriculture, Fisheries and Food in\nNorthern Mindanao\n2nd floor, United Way Bldg.\nCapitol Cmpd., Cagayan de Oro City\nProfessor\nCentral Luzon State University\nMuñoz, Nueva Ecija\n\n•\nTHE TECHNICAL EXPERT PANEL (TEP)\n\n\nMr. ROLANDO SIANGHIO\nMs. PILIPINAS BALANTAC\nPresident\nInstructor\nLacto Asia Pacific Corporation\nRizal Experimental Station and Pilot School\nCottage Industries (RESPSCI)\n\nPasig City\nMs. MIRIAM A. ACDA\nMr. JAIME R. RACHO SR.\nChief\nAssistant Professor\nBureau of Post Harvest Research and\nExtension\nQuezon National Agricultural School\n( QNAS)\nCLSU Compound\nMuñoz, Nueva Ecija\n\nMalicboy, Pagbilao, Quezon\nMr. EDUARDO T. CAYABYAB\nMr. LITO BULAONG\nChief\nChief\nBureau of Post Harvest Research and\nExtension\nBureau of Post Harvest Research and Extension\nCLSU Compound\nMuñoz, Nueva Ecija\n\n\nCLSU Compound\nMuñoz, Nueva Ecija\n\nMr. LORENZO A. BELINO\n\nBenguet Farmers Multipurpose Cooperative\n\n The Participants in the national validation of this Training Regulation\n•\nRegion 1\n•\n Region 8\n•\nRegion 2\n•\n Region 11\n•\nRegion 3\n•\n Region 12\n•\nRegion 5\n•\n Cordillera Autonomy Region\n\nThe Management and Staff of the TESDA Secretariat\n• QSO\n\n--- PDF PAGE 148 ---\nList of Published Training Regulations\n\n Agricultural Crops NC I\n Agricultural Crops NC III\n Animal Production NC II\n Aquaculture NC II\n Automotive Body Painting/Finishing NC II\n Automotive Body Repair NC II\n Automotive Engine Rebuilding NC II\n Automotive Servicing NC II\n Bartending NC II\n Building Wiring Installation NC II\n Carpentry NC II\n Commercial Cooking NC II\n Computer Hardware Servicing NC II\n Deck Seafaring NC II\n Dressmaking NC II\n Driving NC II\n Engine Seafaring NC II\n Fish Capture NC I\n Food and Beverage Services NC II\n Footwear Making NC II\n Heavy Equipment Operation NC II\n Horticulture NC II\n Household Services NC II\n Housekeeping NC II\n Machining NC II\n Masonry NC II\n Motorcycle and Small Engine Servi