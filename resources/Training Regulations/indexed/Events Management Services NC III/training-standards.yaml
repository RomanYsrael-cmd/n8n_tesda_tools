    "source_text": "3.1 CURRICULUM DESIGN\n\nBASIC COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Lead\nworkplace\ncommunication\n1.1 Communicate information\nabout workplace processes.\n1.2 Lead workplace\ndiscussions.\n1.3 Identify and communicate\nissues arising in the\nworkplace\n• Group\ndiscussion\n• Role Play\n• Brainstorming\n\n• Observation\n• Interviews\n\n--- PDF PAGE 86 ---\n________________________________________________________________________________________________84\nEVENTS MANAGEMENT SERVICES NCIII Promulgated November 2007\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n2. Lead small\nteams\n2.1\nProvide team leadership.\n2.2\nAssign responsibilities\namong members.\n2.3\nSet performance expectation\nfor team members.\n\n2.4\nSupervise team performance\n• Lecture\n• Demonstration\n• Self-paced\n(modular)\n• Demonstration\n• Case studies\n3. Develop and\npractice\nnegotiation\nskills\n3.1\nIdentify relevant information\nin planning negotiations\n3.2 Participate in negotiations\n3.3 Document areas for\nagreement\n• Direct\nobservation\n• Simulation/role\nplaying\n•Case studies\n• Written test\n• Practical/\nperformance\ntest\n4. Solve\nworkplace\nproblems\nrelated to\nwork activities\n4.1 Explain the analytical\ntechniques.\n4.2 Identify the problem.\n4.3 Determine the possible\ncause/s of the problem.\n• Direct\nobservation\n• Simulation/role\nplaying\n• Case studies\n• Written test\n• Practical/\nperformance\ntest\n5. Use\nmathematical\nconcepts and\ntechniques\n5.1 Identify mathematical tools\nand techniques to solve\nproblem\n5.2 Apply mathematical\nprocedures/solution\n5.3\nAnalyze results\n• Direct\nobservation\n• Simulation/role\nplaying\n• Case studies\n• Written test\n• Practical/\nperformance\ntest\n6. Use relevant\ntechnologies\n6.1\nStudy/select appropriate\ntechnology\n6.2\nApply relevant technology\n6.3\nMaintain/enhance relevant\ntechnology\n• Direct\nobservation\n• Simulation/role\nplaying\n•Case studies\n• Written test\n• Practical/\nperformance\ntest\n\n--- PDF PAGE 87 ---\n________________________________________________________________________________________________85\nEVENTS MANAGEMENT SERVICES NCIII Promulgated November 2007\n\nCOMMON COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Roster staff\n1.1 Develop and implement\nstaff rosters\n1.2 Maintain staff records\n• Discussion\n• Case study\n• Observation\n• Interview\n• Written test\n2. Control and\norder stock\n2.1\nMaintain stock levels and\nrecords\n2.2\nProcess stock orders\n2.3\nManage stock losses\n2.4\nFollow-up orders\n2.5\nOrganize and administer\nstocks\n• Discussion\n• Lecture\n• Simulation\n• Written test\n• Review of\ndocuments\n3. Train small\ngroups\n3.1 Prepare for training\n3.2 Deliver training\n3.3 Provide opportunities for\npractices\n3.4 Review training\n• Lecture/\n• Discussion\n• Demonstration\n• Hands-on\n• Video Viewing\n• Written Test\n• Oral\nQuestioning\n•\nReview of\ndocuments\n•\nDirect\nobservation\n4. Establish and\nconduct\nbusiness\nrelationships\n4.1 Establish and conduct\nbusiness relationships\n4.2 Conduct negotiations\n4.3 Make formal business\nagreements\n4.4 Foster and maintain business\nrelationships\n• Lecture/\n• Discussion\n• Demonstration\n• Hands-on\n• Video Viewing\n• Written Test\n• Oral\nQuestioning\n• Review of\ndocuments\n• Direct\nobservation\n• Case studies\n\n--- PDF PAGE 88 ---\n________________________________________________________________________________________________86\nEVENTS MANAGEMENT SERVICES NCIII Promulgated November 2007\n\nCORE COMPETENCIES\n\nEVENT PLANNING SERVICES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Plan and\ndevelop event\nproposal or bid\n\n1.1 Interpret event brief\n1.2 Develop proposal and bid\ndetails\n1.3 Develop bid materials\n1.4 Submit or present the bid or\nproposal on time\n• Lecture\n• Discussion\n• Demonstration\n• Practical\nExercises\n• Oral or written\ntest\n• Direct\n observation\n•\nEvaluation of\nwork done by\nlearner\n2. Develop an\nevent concept\n2.1 Identify overall event\nobjectives and scope\n2.2 Establish event concept theme\nand format\n• Lecture\n• Discussion\n• Demonstration\n• Practical\nExercises\n• Oral or written\ntest\n• Direct\n observation\n• Practical test\n• Evaluation of\nwork done by\nlearner\n3. Develop\nevent\nprogram\n3.1 Identify conference objectives\n3.2 Design event program\n3.3 Finalize program details\n• Lecture\n• Discussion\n• Demonstration\n• Practical\nExercises\n• Oral or written\ntest\n• Direct\n observation\n• Practical test\n• Evaluation of\nwork done by\nlearner\n4. Select event\nvenue and\nsite\n4.1 Analyze venue or site\nrequirements\n4.2 Source event venues or sites\n4.3 Confirm venue or site\narrangements\n• Lecture\n• Discussion\n• Demonstration\n• Practical\nExercises\n• Oral or written\ntest\n• Direct\n observation\n• Practical test\n• Evaluation of\nwork done by\nlearner\n5. Develop and\nupdate event\nindustry\nknowledge\n5.1 Source and apply information\non the structure and operation\nof the event industry\n5.2 Source and apply information\non ethical and legal issues for\nthe event industry\n5.3 Source and apply information\non event industry technology\n5.4 Update event industry\nknowledge\n• Lecture\n• Discussion\n• Demonstration\n• Practical\nExercises\n• Oral or written\ntest\n• Direct\n observation\n• Practical test\n• Evaluation of\nwork done by\nlearner\n\n--- PDF PAGE 89 ---\n________________________________________________________________________________________________87\nEVENTS MANAGEMENT SERVICES NCIII Promulgated November 2007\n\nON-SITE EVENT MANAGEMENT SERVICES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Provide on-\nsite event\nmanagement\nservices\n\n1.1 Prepare for on-site\nmanagement\n1.2 Oversee meeting/event set up\n1.3 Monitor meeting/event\noperation\n1.4 Oversee meeting/event\nbreakdown\n• Lecture\n• Discussion\n• Demonstration\n• Practical\nExercises\n• Oral or written\ntest\n• Direct\n observation\n• Practical test\n• Evaluation of\nwork done by\nlearner\n2. Manage\ncontractors\nfor indoor\nevents\n2.1 Identify event operational\nrequirements\n2.2 Source contractors\n2.3 Monitor contractors\n• Lecture\n• Discussion\n• Demonstration\n• Practical\nExercises\n• Oral or written\ntest\n• Direct\n observation\n• Practical test\n• Evaluation of\nwork done by\nlearner\n3. Develop and\nupdate\nknowledge on\nprotocol\n3.1 Seek information on\nappropriate protocol\n3.2 Integrate appropriate protocol\nprocedures into work activities\n3.3 Update knowledge on protocol\n• Lecture\n• Discussion\n• Demonstration\n• Practical\nExercises\n• Oral or written\ntest\n• Direct\n observation\n• Practical test\n• Evaluation of\nwork done by\nlearner"
