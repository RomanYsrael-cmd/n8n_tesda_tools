  "source_section_text": "SECTION 3 TRAINING STANDARDS\n\nThese guidelines are set to provide the Technical and Vocational Education and\nTraining (TVET) providers with information and other important requirements to\nconsider when designing training programs for EVENTS MANAGEMENT SERVICES\nNC III.\n\nThe guidelines include information on curriculum design, training delivery,\ntrainee entry requirements, tools and equipment, training facilities, and trainer’s\nqualification among others.\n\nCourse Title: EVENTS MANAGEMENT SERVICES NC Level: III\n\nNominal Training Duration:\n20 Hrs. (Basic)\n\n24 Hrs. (Common)\n\n 64 Hrs. (Core)\n\nCourse Description:\nThis course is designed to enhance the knowledge, skills, behavior and\nmotivations in accordance with industry standards. It covers the basic, common and\ncore competencies required for the NCIII level in coordinating events. The\ncompetencies for event planning include planning and developing an event proposal,\nbid, concept, and program, selecting event venue and site, and developing and\nupdating event industry knowledge. The competencies for onsite management include\nproviding onsite management services, managing contractors for indoor events, and\ndeveloping and updating knowledge on protocol. It also includes competencies on\nleading workplace communication and small teams, controlling and ordering stock, and\nestablishing business relationships.\n\n3.1 CURRICULUM DESIGN\n\nBASIC COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Lead\nworkplace\ncommunication\n1.1 Communicate information\nabout workplace processes.\n1.2 Lead workplace\ndiscussions.\n1.3 Identify and communicate\nissues arising in the\nworkplace\n• Group\ndiscussion\n• Role Play\n• Brainstorming\n\n• Observation\n• Interviews\n\n--- PDF PAGE 86 ---\n________________________________________________________________________________________________84\nEVENTS MANAGEMENT SERVICES NCIII Promulgated November 2007\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n2. Lead small\nteams\n2.1\nProvide team leadership.\n2.2\nAssign responsibilities\namong members.\n2.3\nSet performance expectation\nfor team members.\n\n2.4\nSupervise team performance\n• Lecture\n• Demonstration\n• Self-paced\n(modular)\n• Demonstration\n• Case studies\n3. Develop and\npractice\nnegotiation\nskills\n3.1\nIdentify relevant information\nin planning negotiations\n3.2 Participate in negotiations\n3.3 Document areas for\nagreement\n• Direct\nobservation\n• Simulation/role\nplaying\n•Case studies\n• Written test\n• Practical/\nperformance\ntest\n4. Solve\nworkplace\nproblems\nrelated to\nwork activities\n4.1 Explain the analytical\ntechniques.\n4.2 Identify the problem.\n4.3 Determine the possible\ncause/s of the problem.\n• Direct\nobservation\n• Simulation/role\nplaying\n• Case studies\n• Written test\n• Practical/\nperformance\ntest\n5. Use\nmathematical\nconcepts and\ntechniques\n5.1 Identify mathematical tools\nand techniques to solve\nproblem\n5.2 Apply mathematical\nprocedures/solution\n5.3\nAnalyze results\n• Direct\nobservation\n• Simulation/role\nplaying\n• Case studies\n• Written test\n• Practical/\nperformance\ntest\n6. Use relevant\ntechnologies\n6.1\nStudy/select appropriate\ntechnology\n6.2\nApply relevant technology\n6.3\nMaintain/enhance relevant\ntechnology\n• Direct\nobservation\n• Simulation/role\nplaying\n•Case studies\n• Written test\n• Practical/\nperformance\ntest\n\n--- PDF PAGE 87 ---\n________________________________________________________________________________________________85\nEVENTS MANAGEMENT SERVICES NCIII Promulgated November 2007\n\nCOMMON COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Roster staff\n1.1 Develop and implement\nstaff rosters\n1.2 Maintain staff records\n• Discussion\n• Case study\n• Observation\n• Interview\n• Written test\n2. Control and\norder stock\n2.1\nMaintain stock levels and\nrecords\n2.2\nProcess stock orders\n2.3\nManage stock losses\n2.4\nFollow-up orders\n2.5\nOrganize and administer\nstocks\n• Discussion\n• Lecture\n• Simulation\n• Written test\n• Review of\ndocuments\n3. Train small\ngroups\n3.1 Prepare for training\n3.2 Deliver training\n3.3 Provide opportunities for\npractices\n3.4 Review training\n• Lecture/\n• Discussion\n• Demonstration\n• Hands-on\n• Video Viewing\n• Written Test\n• Oral\nQuestioning\n•\nReview of\ndocuments\n•\nDirect\nobservation\n4. Establish and\nconduct\nbusiness\nrelationships\n4.1 Establish and conduct\nbusiness relationships\n4.2 Conduct negotiations\n4.3 Make formal business\nagreements\n4.4 Foster and maintain business\nrelationships\n• Lecture/\n• Discussion\n• Demonstration\n• Hands-on\n• Video Viewing\n• Written Test\n• Oral\nQuestioning\n• Review of\ndocuments\n• Direct\nobservation\n• Case studies\n\n--- PDF PAGE 88 ---\n________________________________________________________________________________________________86\nEVENTS MANAGEMENT SERVICES NCIII Promulgated November 2007\n\nCORE COMPETENCIES\n\nEVENT PLANNING SERVICES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Plan and\ndevelop event\nproposal or bid\n\n1.1 Interpret event brief\n1.2 Develop proposal and bid\ndetails\n1.3 Develop bid materials\n1.4 Submit or present the bid or\nproposal on time\n• Lecture\n• Discussion\n• Demonstration\n• Practical\nExercises\n• Oral or written\ntest\n• Direct\n observation\n•\nEvaluation of\nwork done by\nlearner\n2. Develop an\nevent concept\n2.1 Identify overall event\nobjectives and scope\n2.2 Establish event concept theme\nand format\n• Lecture\n• Discussion\n• Demonstration\n• Practical\nExercises\n• Oral or written\ntest\n• Direct\n observation\n• Practical test\n• Evaluation of\nwork done by\nlearner\n3. Develop\nevent\nprogram\n3.1 Identify conference objectives\n3.2 Design event program\n3.3 Finalize program details\n• Lecture\n• Discussion\n• Demonstration\n• Practical\nExercises\n• Oral or written\ntest\n• Direct\n observation\n• Practical test\n• Evaluation of\nwork done by\nlearner\n4. Select event\nvenue and\nsite\n4.1 Analyze venue or site\nrequirements\n4.2 Source event venues or sites\n4.3 Confirm venue or site\narrangements\n• Lecture\n• Discussion\n• Demonstration\n• Practical\nExercises\n• Oral or written\ntest\n• Direct\n observation\n• Practical test\n• Evaluation of\nwork done by\nlearner\n5. Develop and\nupdate event\nindustry\nknowledge\n5.1 Source and apply information\non the structure and operation\nof the event industry\n5.2 Source and apply information\non ethical and legal issues for\nthe event industry\n5.3 Source and apply information\non event industry technology\n5.4 Update event industry\nknowledge\n• Lecture\n• Discussion\n• Demonstration\n• Practical\nExercises\n• Oral or written\ntest\n• Direct\n observation\n• Practical test\n• Evaluation of\nwork done by\nlearner\n\n--- PDF PAGE 89 ---\n________________________________________________________________________________________________87\nEVENTS MANAGEMENT SERVICES NCIII Promulgated November 2007\n\nON-SITE EVENT MANAGEMENT SERVICES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Provide on-\nsite event\nmanagement\nservices\n\n1.1 Prepare for on-site\nmanagement\n1.2 Oversee meeting/event set up\n1.3 Monitor meeting/event\noperation\n1.4 Oversee meeting/event\nbreakdown\n• Lecture\n• Discussion\n• Demonstration\n• Practical\nExercises\n• Oral or written\ntest\n• Direct\n observation\n• Practical test\n• Evaluation of\nwork done by\nlearner\n2. Manage\ncontractors\nfor indoor\nevents\n2.1 Identify event operational\nrequirements\n2.2 Source contractors\n2.3 Monitor contractors\n• Lecture\n• Discussion\n• Demonstration\n• Practical\nExercises\n• Oral or written\ntest\n• Direct\n observation\n• Practical test\n• Evaluation of\nwork done by\nlearner\n3. Develop and\nupdate\nknowledge on\nprotocol\n3.1 Seek information on\nappropriate protocol\n3.2 Integrate appropriate protocol\nprocedures into work activities\n3.3 Update knowledge on protocol\n• Lecture\n• Discussion\n• Demonstration\n• Practical\nExercises\n• Oral or written\ntest\n• Direct\n observation\n• Practical test\n• Evaluation of\nwork done by\nlearner\n\n3.2\nTRAINING DELIVERY\nThe delivery of training should follow the design of the curriculum.\nDelivery should be guided by the 10 basic principles of competency-based\nTVET.\n•\nThe training is based on curriculum developed from the competency\nstandards;\n•\nLearning is modular in its structure;\n•\nTraining delivery is individualized and self-paced;\n•\nTraining is based on work that must be performed;\n•\nTraining materials are directly related to the competency standards\nand the curriculum modules;\n•\nAssessment is based on the collection of evidence of the performance\nof work to the industry required standard;\n•\nTraining is based both on and off-the-job components;\n•\nAllows for recognition of prior learning (RPL) or current competencies;\n•\nTraining allows for multiple entry and exit; and\n•\nApproved training programs are Nationally Accredited\n\n--- PDF PAGE 90 ---\n________________________________________________________________________________________________88\nEVENTS MANAGEMENT SERVICES NCIII Promulgated November 2007\n\nThe competency-based TVET system recognizes various types of\ndelivery modes, both on and off-the-job as long as the learning is driven by the\ncompetency standards specified by the industry. The following training\nmodalities may be adopted when designing training programs:\n\n• The dualized mode of training delivery is preferred and recommended,\nthus, programs would contain both in-school and in-industry training or\nfieldwork components. Details can be referred to the Dual Training\nSystem (DTS) Implementing Rules and Regulations\n• Modular/self-paced learning is a competency-based training modality\nwhere the trainee is allowed to progress at his own pace. The trainer\nonly facilitates the training delivery\n• Peer teaching/mentoring is a training modality wherein fast learners\nare given the opportunity to assist the slow learners\n• Supervised industry training or on-the-job training is a training\napproach designed to enhance the knowledge and skills of the trainee\nthrough actual experience in the workplace to acquire specific\ncompetencies prescribed in the training regulations\n• Distance learning is a formal education process in which majority of the\ninstruction occurs when the students and instructor are not in the same\nplace. Distance learning may employ correspondence study, audio,\nvideo or computer technologies\n\n3.3\nTRAINEE ENTRY REQUIREMENTS\n\nTrainees or students who wish to enter this training should possess the\nfollowing requirements:\n\n• can communicate in basic English in both oral and written form\n• physically and mentally fit\n• with good moral character\n• can perform basic mathematical computation\n\nThis list does not include specific institutional requirements such as\neducational attainment, appropriate work experience, and others that may be\nrequired of the trainees by the school or training center delivering the TVET\nprogram.\n\n--- PDF PAGE 91 ---\n________________________________________________________________________________________________89\nEVENTS MANAGEMENT SERVICES NCIII Promulgated November 2007\n\n3.4\nLIST OF TOOLS, EQUIPMENT AND MATERIALS\n\nRecommended list of tools, equipment and materials for the training of a\nmaximum of 25 trainees for EVENTS MANAGEMENT SERVICES NC III are as\nfollows:\n\nTOOLS\nEQUIPMENT\nMATERIALS\nQTY\n\nQTY\n\nQTY\n\n5 units\nComputer with\ninternet connection\n1 set\nTelephone Directory\n\n1 unit\nLCD projector\n\n2 units\nTwo-way radio\n\n2 units\nMobile phone\n\n1 unit\nTelephone\n\n1 unit\nFax machine\n\n1 unit\nDigital camera\n\n1 unit\nVideo camera\n\n1 unit\nMicrophone\n\n1 unit\nSound system\n\n1 unit\nMegaphone\n\n5 sets\nFirst aid kit\n\n*NOTE: Implementation of the training program can be facilitated through a\nMemorandum of Agreement between the training provider and industry\npartner/s regarding the use of facilities. This is in response to the high cost of\nfacilities and equipment. Airconditioned vehicles can be hired on a per trip\nbasis subject to requirement.\n\n--- PDF PAGE 92 ---\n________________________________________________________________________________________________90\nEVENTS MANAGEMENT SERVICES NCIII Promulgated November 2007\n\n3.5\nTRAINING FACILITIES\n\nBased on a class intake of 25 students/trainees.\n\nSpace Requirement\n\nSize in Meters\n\nArea in Sq.\nMeters\n\nTotal Area in Sq.\nMeters\nStudent/Trainee\nWorking Space\n1 x 1 m.\n1 sq. m.\n25 sq. m\nLecture/Demo Room\n8 x 5 m.\n40 sq. m.\n40 sq. m.\nLearning Resource\nCenter\n3 x 5 m.\n15 sq. m.\n15 sq. m.\nFacilities/Equipment/\nCirculation Area\n\n24 sq. m.\nTotal workshop area:\n104 sq. m.\n\n3.6\nTRAINER’S QUALIFICATIONS FOR TOURISM SECTOR\n\nEVENTS MANGEMENT SERVICES NC III\n\nTRAINER’S QUALIFICATIONS (TQ III)\n\n• Must have completed a Trainer’s Training Methodology Course\n (TM III) or its equivalent\n• Must be physically and mentally fit\n• Must have at least 3-5 years job/industry experience\n• Must be a holder of Events Management Services NC Level III Certificate or\nequivalent qualification\n• Must be of good moral character\n• With pleasing personality\n• Must have attended relevant training and seminars\n\n3.7\nINSTITUTIONAL ASSESSMENT\n\nInstitutional assessment is undertaken by trainees to determine their\nachievement of units of competency. A certificate of achievement is issued for\neach unit of competency.\n\n--- PDF PAGE 93 ---\n________________________________________________________________________________________________91\nEVENTS MANAGEMENT SERVICES NCIII Promulgated November 2007"
