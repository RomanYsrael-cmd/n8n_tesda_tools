        "evidence_guide": {
          "source_text": "1. Critical aspects of\n competency\nAssessment requires evidences that the candidate:\n1.1 Demonstrated • general knowledge of the events industry.\n1.2 Demonstrated understanding of how industry knowledge\ncan be applied to work activities to maximize effective\nperformance.\n1.3 Demonstrated • knowledge of ways to maintain currency of\nknowledge.\n2. Underpinning\n knowledge\n2.1 Main types of events including the following for different\nevent types:\n• Objectives/roles\n• Scope\n• Nature of audience\n• Key stakeholders\n• Key elements of staging an event\n2.2 Structure and function of the events industry, including:\n• Relationships between the events industry and other\nindustries such as entertainment\n• Businesses and organizations involved in the\nindustry\n• Key motivations for hosting events\n2.3 Role and impact of events on local economies\n2.4 • Legal and ethical issues that impact on event\nmanagement including overview of relevant legislation\n2.5 Current and emerging technology for different aspects of\nthe event management process\n3. Underpinning\n skills\n3.1 Deciding whether to join an industry association based on\nevaluation of promotional materials\n3.2 Coordinating with clients on protocol requirements for a\ngiven event\n3.3 Organizing a personal program of professional\ndevelopment activities for the upcoming year\n3.4 Discussing industry developments with colleagues\n3.5 Responding to a situation at a particular type of event\nwhere candidate has no knowledge of its components\n3.6 Using the internet to source information on the events\nindustry\n\n--- PDF PAGE 68 ---\n________________________________________________________________________________________________66\nEVENTS MANAGEMENT SERVICES NCIII Promulgated November 2007\n\n4. Resource\n implications\nThe following resources MUST be provided:\n4.1 Standard office electronic equipment\n5. Methods of\n assessment\nCompetency may be assessed through:\n5.1 Oral questioning to assess knowledge of different aspects\nof the events industry.\n5.2 • Review of portfolios of evidence of on-the-job\nperformance by the candidate.\n 5.3 Third-party workplace reports of on-the-job performance by\nthe candidate.\n6. Context for\n assessment\n6.1 Competency assessment may occur in workplace or any\nappropriately simulated environment.\n6.2 Assessment may be performed on multiple occasions\ninvolving a combination of direct, indirect and\nsupplementary forms of evidence.\n\n--- PDF PAGE 69 ---\n________________________________________________________________________________________________67\nEVENTS MANAGEMENT SERVICES NCIII Promulgated November 2007\n\nON-SITE EVENT MANAGEMENT SERVICES\n\nUNIT OF COMPETENCY : PROVIDE ON-SITE EVENT MANAGEMENT SERVICES\nUNIT CODE\n\n :"
        },
        "source_text": "TRS342319\nUNIT DESCRIPTOR\n: This unit covers the knowledge, skills, behavior and\nmotivations required to develop and update general\nknowledge of the meetings and events industry including\nindustry structure, legal issues and current technology. This\nknowledge underpins effective performance in all meeting\nand event organization and management roles.\n\nELEMENT\n\nPERFORMANCE CRITERIA\nBold and italicized terms are elaborated in the Range of\nVariables\n1. Source and apply information\non the structure and\noperation of the event\nindustry\n1.1 Sources of information on the event industry\nare identified correctly.\n1.2 Knowledge of the event industry is used I the\ncorrect context to enhance the quality of work\nperformance.\n2. Source and apply information\non ethical and legal issues for\nthe event industry\n2.1 Information on legal and ethical issues are\nobtained to assist effective work performance.\n2.2 Day-to-day event organization activities are\nconducted in accordance with legal obligations\nand ethical industry practices.\n3. Source and apply information\non event industry technology\n3.1 Information on current and emerging\ntechnologies that impact on the event\norganization process are obtained.\n3.2 The potential effects of different technologies on\nthe event organization process are assessed.\n3.3 Knowledge of current and emerging technology\nis applied in day-to-day work activities.\n4. Update event industry\nknowledge\n4.1 A range of opportunities is identified and used\nto update knowledge of the events industry.\n4.2 Current issues of concern to the industry are\nmonitored.\n4.3 Updated knowledge is shared with customers\nand colleagues as appropriate, and incorporated\ninto day-to-day work activities.\n\n--- PDF PAGE 65 ---\n________________________________________________________________________________________________63\nEVENTS MANAGEMENT SERVICES NCIII Promulgated November 2007\n\nRANGE OF VARIABLES\n\nVARIABLE\n\nRANGE\n1. Information\nMay include but is not limited to:\n1.1 Industry structure\n1.2 Different event types and staging elements\n1.3 Event protocols\n1.4 Major industry bodies/associations\n1.5 Impacts of events on local economies\n1.6 Trends\n1.7 Career opportunities\n2. Event\nMay include but is not limited to:\n2.1 Conferences\n2.2 Symposia\n2.3 Exhibitions\n2.4 Festivals\n2.5 Promotions\n2.6 Shows\n2.7 Sporting events\n2.8 Parades\n2.9 Cultural celebrations\n2.10 Trade and consumer shows\n2.11 Social events\n2.12 Public events\n2.13 Corporate events\n2.14 Charitable, fund-raising events\n3. Legal and ethical issues\nMay include but are not limited to:\n3.1 Public liability\n3.2 Duty of care\n3.3 Licensing\n3.4 Risk management\n3.5 Occupational health and safety\n\n--- PDF PAGE 66 ---\n________________________________________________________________________________________________64\nEVENTS MANAGEMENT SERVICES NCIII Promulgated November 2007\n\nVARIABLE\n\nRANGE\n4. Ethical industry practices\nMay include but are not limited to:\n4.1 Commission procedures\n4.2 Bookings at venues\n4.3 Confidentiality\n4.4 Overbooking\n4.5 Sub-contracting\n4.6 Pricing\n5. Technologies\nMay include but are not limited to:\n5.1 Project management systems\n5.2 Delegate registration and tracking systems\n5.3 CAD systems\n5.4 Internal venue booking systems\n6. Opportunities\nMay include but are not limited to:\n6.1 Industry seminars\n6.2 Training course\n6.3 Industry association membership\n6.4 Participation in events industry association\nactivities\n6.5 Informal networking with colleagues\n6.6 Reading industry journals\n6.7 Web search\n\n--- PDF PAGE 67 ---\n________________________________________________________________________________________________65\nEVENTS MANAGEMENT SERVICES NCIII Promulgated November 2007\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\n competency\nAssessment requires evidences that the candidate:\n1.1 Demonstrated • general knowledge of the events industry.\n1.2 Demonstrated understanding of how industry knowledge\ncan be applied to work activities to maximize effective\nperformance.\n1.3 Demonstrated • knowledge of ways to maintain currency of\nknowledge.\n2. Underpinning\n knowledge\n2.1 Main types of events including the following for different\nevent types:\n• Objectives/roles\n• Scope\n• Nature of audience\n• Key stakeholders\n• Key elements of staging an event\n2.2 Structure and function of the events industry, including:\n• Relationships between the events industry and other\nindustries such as entertainment\n• Businesses and organizations involved in the\nindustry\n• Key motivations for hosting events\n2.3 Role and impact of events on local economies\n2.4 • Legal and ethical issues that impact on event\nmanagement including overview of relevant legislation\n2.5 Current and emerging technology for different aspects of\nthe event management process\n3. Underpinning\n skills\n3.1 Deciding whether to join an industry association based on\nevaluation of promotional materials\n3.2 Coordinating with clients on protocol requirements for a\ngiven event\n3.3 Organizing a personal program of professional\ndevelopment activities for the upcoming year\n3.4 Discussing industry developments with colleagues\n3.5 Responding to a situation at a particular type of event\nwhere candidate has no knowledge of its components\n3.6 Using the internet to source information on the events\nindustry\n\n--- PDF PAGE 68 ---\n________________________________________________________________________________________________66\nEVENTS MANAGEMENT SERVICES NCIII Promulgated November 2007\n\n4. Resource\n implications\nThe following resources MUST be provided:\n4.1 Standard office electronic equipment\n5. Methods of\n assessment\nCompetency may be assessed through:\n5.1 Oral questioning to assess knowledge of different aspects\nof the events industry.\n5.2 • Review of portfolios of evidence of on-the-job\nperformance by the candidate.\n 5.3 Third-party workplace reports of on-the-job performance by\nthe candidate.\n6. Context for\n assessment\n6.1 Competency assessment may occur in workplace or any\nappropriately simulated environment.\n6.2 Assessment may be performed on multiple occasions\ninvolving a combination of direct, indirect and\nsupplementary forms of evidence.\n\n--- PDF PAGE 69 ---\n________________________________________________________________________________________________67\nEVENTS MANAGEMENT SERVICES NCIII Promulgated November 2007\n\nON-SITE EVENT MANAGEMENT SERVICES\n\nUNIT OF COMPETENCY : PROVIDE ON-SITE EVENT MANAGEMENT SERVICES\nUNIT CODE\n\n :"
