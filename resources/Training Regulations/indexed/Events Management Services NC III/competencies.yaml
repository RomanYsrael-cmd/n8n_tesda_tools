  "source_section_text": "SECTION 2 COMPETENCY STANDARDS\n\nThis section details the contents of the basic, common and core units of competency\nrequired in EVENTS MANAGEMENT SERVICES NC III.\n\nBASIC COMPETENCIES\n\nUNIT OF COMPETENCY : LEAD WORKPLACE COMMUNICATION\nUNIT CODE\n : 500311109\n UNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes\nrequired to lead in the dissemination and discussion of\nideas, information and issues in the workplace.\nELEMENT\nPERFORMANCE CRITERIA\nBold and italicized terms are elaborated in the\nRange of Variables\n1. Communicate\ninformation about\nworkplace processes\n1.1 Appropriate communication method is\nselected\n1.2 Multiple operations involving several topics\nareas are communicated accordingly\n1.3 Questions are used to gain extra information\n1.4 Correct sources of information are identified\n1.5 Information is selected and organized correctly\n1.6 Verbal and written reporting is undertaken when\nrequired\n1.7 Communication skills are maintained in all\nsituations\n2. Lead workplace\ndiscussions\n2.1 Response to workplace issues are sought\n2.2 Response to workplace issues are provided\nimmediately\n2.3 Constructive contributions are made to\nworkplace discussions on such issues as\nproduction, quality and safety\n2.4 Goals/objectives and action plan undertaken in\nthe workplace are communicated\n3. Identify and\ncommunicate issues\narising in the workplace\n3.1 Issues and problems are identified as they arise\n3.2 Information regarding problems and issues are\norganized coherently to ensure clear and\neffective communication\n3.3 Dialogue is initiated with appropriate personnel\n3.4 Communication problems and issues are raised\nas they arise\n\n--- PDF PAGE 6 ---\n________________________________________________________________________________________________4\nEVENTS MANAGEMENT SERVICES NCIII Promulgated November 2007\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Methods of\ncommunication\nMay include but not limited to:\n1.1. Non-verbal gestures\n1.2. Verbal\n1.3. Face to face\n1.4. Two-way radio\n1.5. Speaking to groups\n1.6. Using telephone\n1.7. Written\n1.8. Internet\n\n--- PDF PAGE 7 ---\n________________________________________________________________________________________________5\nEVENTS MANAGEMENT SERVICES NCIII Promulgated November 2007\n\nEVIDENCE GUIDE\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1.\nDealt with a range of communication/information at\none time\n1.2.\nMade constructive contributions in workplace issues\n1.3.\nSought workplace issues effectively\n1.4.\nResponded to workplace issues promptly\n1.5.\nPresented information clearly and effectively written\nform\n1.6.\nUsed appropriate sources of information\n1.7.\nAsked appropriate questions\n1.8.\nProvided accurate information\n2. Underpinning\nknowledge\n2.1.\nOrganization requirements for written and electronic\ncommunication methods\n2.2.\nEffective verbal communication methods\n3. Underpinning\nskills\n3.1.\nOrganize information\n3.2.\nUnderstand and convey intended meaning\n3.3.\nParticipate in variety of workplace discussions\n3.4.\nComply with organization requirements for the use\nof written and electronic communication methods\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1.\nVariety of Information\n4.2.\nCommunication tools\n4.3.\nSimulated workplace\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1.\nCompetency in this unit must be assessed through\n5.2.\nDirect Observation\n5.3.\nInterview\n6. Context of\nassessment\n6.1.\nCompetency may be assessed in the workplace or\nin simulated workplace environment\n\n--- PDF PAGE 8 ---\n________________________________________________________________________________________________6\nEVENTS MANAGEMENT SERVICES NCIII Promulgated November 2007\n\nUNIT OF COMPETENCY\n: LEAD SMALL TEAMS\n\nUNIT CODE\n : 500311110\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes required\nto lead small teams including setting and maintaining\nteam and individual performance standards.\n\nELEMENT\nPERFORMANCE CRITERIA\nBold and italicized terms are elaborated in the\nRange of Variables\n1. Provide team\nleadership\n1.1.\nWork requirements are identified and\npresented to team members\n1.2.\nReasons for instructions and requirements are\ncommunicated to team members\n1.3.\nTeam members’ queries and concerns are\nrecognized, discussed and dealt with\n2. Assign responsibilities\n2.1.\nDuties, and responsibilities are allocated\nhaving regard to the skills, knowledge and\naptitude required to properly undertake the\nassigned task and according to company\npolicy\n2.2.\nDuties are allocated having regard to individual\npreference, domestic and personal\nconsiderations, whenever possible\n3. Set performance\nexpectations for team\nmembers\n3.1.\nPerformance expectations are established\nbased on client needs and according to\nassignment requirements\n3.2.\nPerformance expectations are based on\nindividual team members duties and area of\nresponsibility\n3.3.\nPerformance expectations are discussed and\ndisseminated to individual team members\n\n--- PDF PAGE 9 ---\n________________________________________________________________________________________________7\nEVENTS MANAGEMENT SERVICES NCIII Promulgated November 2007\n\nELEMENT\nPERFORMANCE CRITERIA\nBold and italicized terms are elaborated in the\nRange of Variables\n4. Supervise team\nperformance\n4.1.\nMonitoring of performance takes place\nagainst defined performance criteria and/or\nassignment instructions and corrective action\ntaken if required\n4.2.\nTeam members are provided with feedback,\npositive support and advice on strategies to\novercome any deficiencies\n4.3.\nPerformance issues which cannot be rectified\nor addressed within the team are referenced to\nappropriate personnel according to employer\npolicy\n4.4.\nTeam members are kept informed of any\nchanges in the priority allocated to assignments\nor tasks which might impact on client/customer\nneeds and satisfaction\n4.5.\nTeam operations are monitored to ensure that\nemployer/client needs and requirements are\nmet\n4.6.\nFollow-up communication is provided on all\nissues affecting the team\n4.7.\nAll relevant documentation is completed in\naccordance with company procedures\n\n--- PDF PAGE 10 ---\n________________________________________________________________________________________________8\nEVENTS MANAGEMENT SERVICES NCIII Promulgated November 2007\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Work requirements\nMay include but not limited to:\n1.1. Client Profile\n1.2. Assignment instructions\n2. Team member’s concerns\nMay include but not limited to:\n2.1. Roster/shift details\n3. Monitor performance\nMay include but not limited to:\n3.1. Formal process\n3.2. Informal process\n4. Feedback\nMay include but not limited to:\n4.1. Formal process\n4.2. Informal process\n5. Performance issues\nMay include but not limited to:\n5.1. Work output\n5.2. Work quality\n5.3. Team participation\n5.4. Compliance with workplace protocols\n5.5. Safety\n5.6. Customer service\n\n--- PDF PAGE 11 ---\n________________________________________________________________________________________________9\nEVENTS MANAGEMENT SERVICES NCIII Promulgated November 2007\n\nEVIDENCE GUIDE\n\n1. Critical aspects\nof competency\nAssessment requires evidence that the candidate:\n1.1. Maintained or improved individuals and/or team\nperformance given a variety of possible scenario\n1.2. Assessed and monitored team and individual\nperformance against set criteria\n1.3. Represented concerns of a team and individual to\nnext level of management or appropriate specialist\nand to negotiate on their behalf\n1.4. Allocated duties and responsibilities, having regard to\nindividual’s knowledge, skills and aptitude and the\nneeds of the tasks to be performed\n1.5. Set and communicated performance expectations for\na range of tasks and duties within the team and\nprovided feedback to team members\n2. Underpinning\nknowledge\n2.1. Company policies and procedures\n2.2. Relevant legal requirements\n2.3. How performance expectations are set\n2.4. Methods of Monitoring Performance\n2.5. Client expectations\n2.6.\nTeam member’s duties and responsibilities\n3. Underpinning\nskills\n3.1. Communication skills required for leading teams\n3.2. Informal performance counseling skills\n3.3. Team building skills\n3.4.\nNegotiating skills\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1. Access to relevant workplace or appropriately\nsimulated environment where assessment can take\nplace\n4.2.\nMaterials relevant to the proposed activity or task\n\n--- PDF PAGE 12 ---\n________________________________________________________________________________________________10\nEVENTS MANAGEMENT SERVICES NCIII Promulgated November 2007\n\n5. Methods of\nassessment\nCompetency may be assessed through:\n5.1. Direct observations of work activities of the individual\nmember in relation to the work activities of the group\n5.2. Observation of simulation and/or role play involving\nthe participation of individual member to the\nattainment of organizational goal\n5.3. Case studies and scenarios as a basis for discussion\nof issues and strategies in teamwork\n6. Context of\nassessment\n6.1. Competency assessment may occur in workplace or\nany appropriately simulated environment\n6.2. Assessment may be performed while tasks are being\nundertaken whether individually or in-group\n\n--- PDF PAGE 13 ---\n________________________________________________________________________________________________11\nEVENTS MANAGEMENT SERVICES NCIII Promulgated November 2007\n\nUNIT OF COMPETENCY: DEVELOP AND PRACTICE NEGOTIATION SKILLS\n\nUNIT CODE : 500311111\n\nUNIT DESCRIPTOR : This unit covers the skills, knowledge and attitudes required\nto collect information in order to negotiate to a desired\noutcome and participate in the negotiation.\n\nELEMENT\nPERFORMANCE CRITERIA\nBold and italicized terms are elaborated in the\nRange of Variables\n1. Plan negotiations\n1.1 Information on preparing for negotiation is\nidentified and included in the plan\n1.2 Information on active listening is identified and\nincluded in the plan\n1.3 Information on different questioning techniques is\nidentified and included in the plan\n1.4 Information is checked to ensure it is correct and up-\nto- date\n2. Participate in\nnegotiations\n2.1 Criteria for successful outcome are agreed upon by all\nparties\n2.2 Desired outcome of all parties are considered\n2.3 Appropriate language is used throughout the\nnegotiation\n2.4 Variety of questioning techniques are used\n2.5 Issues and processes are documented and agreed\nupon by all parties\n2.6 Possible solutions are discussed and their viability\nassessed\n2.7 Areas for agreement are confirmed and recorded\n2.8 Follow-up action is agreed upon by all parties\n\n--- PDF PAGE 14 ---\n________________________________________________________________________________________________12\nEVENTS MANAGEMENT SERVICES NCIII Promulgated November 2007\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Preparing for\nnegotiation\nMay include but not limited to:\n1.1 Background information on other parties to the\nnegotiation\n1.2 Good understanding of topic to be negotiated\n1.3 Clear understanding of desired outcome/s\n1.4 Personal attributes\n1.4.1 self awareness\n1.4.2 self esteem\n1.4.3 objectivity\n1.4.4 empathy\n1.4.5 respect for others\n1.5 Interpersonal skills\n1.5.1 listening/reflecting\n1.5.2 non verbal communication\n1.5.3 assertiveness\n1.5.4 behavior labeling\n1.5.5 testing understanding\n1.5.6 seeking information\n1.5.7 self disclosing\n1.6 Analytic skills\n1.6.1 observing differences between content\nand process\n1.6.2 identifying bargaining information\n1.6.3 applying strategies to manage process\n1.6.4 applying steps in negotiating process\n1.6.5 strategies to manage conflict\n1.6.6 steps in negotiating process\n1.6.7 options within organization and\nexternally for resolving conflict\n2. Non verbal\nenvironments\nMay include but not limited to:\n2.1 Friendly reception\n2.2 Warm and welcoming room\n2.3 Refreshments offered\n2.4 Lead in conversation before negotiation begins\n\n--- PDF PAGE 15 ---\n________________________________________________________________________________________________13\nEVENTS MANAGEMENT SERVICES NCIII Promulgated November 2007\n\nVARIABLE\nRANGE\n3. Active listening\nMay include but not limited to:\n3.1 Attentive\n3.2 Don’t interrupt\n3.3 Good posture\n3.4 Maintain eye contact\n3.5 Reflective listening\n4. Questioning\ntechniques\nMay include but not limited to:\n4.1 Direct\n4.2 Indirect\n4.3 Open-ended\n\n--- PDF PAGE 16 ---\n________________________________________________________________________________________________14\nEVENTS MANAGEMENT SERVICES NCIII Promulgated November 2007\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\n Competency\nAssessment requires evidence that the candidate:\n1.1 Demonstrated sufficient knowledge of the factors\ninfluencing negotiation to achieve agreed outcome\n1.2 Participated in negotiation with at least one person to\nachieve an agreed outcome\n2. Underpinning\nknowledge and\nattitude\n2.1 Codes of practice and guidelines for the organization\n2.2 Organizations policy and procedures for negotiations\n2.3 Decision making and conflict resolution strategies\nprocedures\n2.4 Problem solving strategies on how to deal with\nunexpected questions and attitudes during negotiation\n2.5 Flexibility\n2.6 Empathy\n3. Underpinning\nskills\n3.1 Interpersonal skills to develop rapport with other parties\n3.2 Communication skills (verbal and listening)\n3.3 Observation skills\n3.1 Negotiation skills\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Room with facilities necessary for the negotiation\nprocess\n4.2 Human resources (negotiators)\n5. Methods of\nassessment\nCompetency may be assessed through:\n5.1 Observation/demonstration and questioning\n5.2 Portfolio assessment\n5.3 Oral and written questioning\n5.4 Third party report\n6. Context of\nassessment\n6.1 Competency to be assessed in real work environment or\nin a simulated workplace setting.\n\n--- PDF PAGE 17 ---\n________________________________________________________________________________________________15\nEVENTS MANAGEMENT SERVICES NCIII Promulgated November 2007\n\nUNIT OF COMPETENCY :\nSOLVE PROBLEMS RELATED TO WORK ACTIVITIES\nUNIT CODE\n: 500311112\nUNIT DESCRIPTOR\n:\nThis unit of competencies covers the knowledge, skills\nand attitudes required to solve problems in the workplace\nincluding the application of problem solving techniques\nand to determine and resolve the root cause of problems.\n\nELEMENT\nPERFORMANCE CRITERIA\nBold and italicized terms are elaborated in the\nRange of Variables\n1.\nIdentify the problem\n1.1.\nVariances are identified from normal operating\nparameters; and product quality\n1.2.\nExtent, cause and nature are of the problem\nare defined through observation, investigation\nand analytical techniques\n1.3.\nProblems are clearly stated and specified\n2.\nDetermine\nfundamental causes\nof the problem\n2.1.\nPossible causes are identified based on\nexperience and the use of problem solving\ntools / analytical techniques.\n2.2.\nPossible cause statements are developed\nbased on findings\n2.3.\nFundamental causes are identified per results\nof investigation conducted\n3.\nDetermine corrective\naction\n3.1.\nAll possible options are considered for\nresolution of the problem\n3.2.\nStrengths and weaknesses of possible options\nare considered\n3.3.\nCorrective actions are determined to resolve\nthe problem and possible future causes\n3.4.\nAction plans are developed identifying\nmeasurable objectives, resource needs and\ntimelines in accordance with safety and\noperating procedures\n4.\nProvide\nrecommendation/s to\nmanager\n4.1.\nReport on recommendations are prepared\n4.2.\nRecommendations are presented to\nappropriate personnel.\n4.3.\nRecommendations are followed-up, if required\n\n--- PDF PAGE 18 ---\n________________________________________________________________________________________________16\nEVENTS MANAGEMENT SERVICES NCIII Promulgated November 2007\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Analytical techniques\nMay include but not limited to:\n1.1.\nBrainstorming\n1.2.\nIntuitions/Logic\n1.3.\nCause and effect diagrams\n1.4.\nPareto analysis\n1.5.\nSWOT analysis\n1.6.\nGantt chart, Pert CPM and graphs\n1.7.\nScatter grams\n2. Problem\n\nMay include but not limited to:\n2.1.\nNon – routine process and quality problems\n2.2.\nEquipment selection, availability and failure\n2.3.\nTeamwork and work allocation problem\n2.4.\nSafety and emergency situations and\nincidents\n3. Action plans\n\nMay include but not limited to:\n3.1.\nPriority requirements\n3.2.\nMeasurable objectives\n3.3.\nResource requirements\n3.4.\nTimelines\n3.5.\nCo-ordination and feedback requirements\n3.6.\nSafety requirements\n3.7.\nRisk assessment\n3.8.\nEnvironmental requirements\n\n--- PDF PAGE 19 ---\n________________________________________________________________________________________________17\nEVENTS MANAGEMENT SERVICES NCIII Promulgated November 2007\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1.\nIdentified the problem\n1.2.\nDetermined the fundamental causes of the problem\n1.3.\nDetermined the correct / preventive action\n1.4.\nProvided recommendation to manager\nThese aspects may be best assessed using a range of\nscenarios / case studies / what ifs as a stimulus with a\nwalk through forming part of the response. These\nassessment activities should include a range of problems,\nincluding new, unusual and improbable situations that may\nhave happened.\n2. Underpinning\nknowledge\n2.1.\nCompetence includes a thorough knowledge and\nunderstanding of the process, normal operating\nparameters, and product quality to recognize non-\nstandard situations\n2.2.\nCompetence to include the ability to apply and\nexplain, sufficient for the identification of\nfundamental cause, determining the corrective\naction and provision of recommendations\n2.2.1.\nRelevant equipment and operational\nprocesses\n2.2.2.\nEnterprise goals, targets and measures\n2.2.3.\nEnterprise quality, OHS and environmental\nrequirement\n2.2.4.\nPrinciples of decision making strategies\nand techniques\n2.2.5.\nEnterprise information systems and data\ncollation\n2.2.6.\nIndustry codes and standards\n\n--- PDF PAGE 20 ---\n________________________________________________________________________________________________18\nEVENTS MANAGEMENT SERVICES NCIII Promulgated November 2007\n\n3. Underpinning\nskills\n3.1.\nUsing range of formal problem solving techniques\n3.2.\nIdentifying and clarifying the nature of the problem\n3.3.\nDevising the best solution\n3.4.\nEvaluating the solution\n3.5.\nImplementation of a developed plan to rectify the\nproblem\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1.\nAssessment will require access to an operating\nplant over an extended period of time, or a suitable\nmethod of gathering evidence of operating ability\nover a range of situations. A bank of scenarios /\ncase studies / what ifs will be required as well as\nbank of questions which will be used to probe the\nreason behind the observable action.\n5. Methods of\nassessment\nCompetency may be assessed through:\n5.1. Case studies on solving problems in the workplace\n5.2. Observation\nThe unit will be assessed in a holistic manner as is\npractical and may be integrated with the assessment of\nother relevant units of competency. Assessment will occur\nover a range of situations, which will include disruptions to\nnormal, smooth operation. Simulation may be required to\nallow for timely assessment of parts of this unit of\ncompetency. Simulation should be based on the actual\nworkplace and will include walk through of the relevant\ncompetency components.\n6. Context of\nassessment\n6.1.\nIn all workplaces, it may be appropriate to assess\nthis unit concurrently with relevant teamwork or\noperation units.\n\n--- PDF PAGE 21 ---\n________________________________________________________________________________________________19\nEVENTS MANAGEMENT SERVICES NCIII Promulgated November 2007\n\nUNIT OF COMPETENCY: USE MATHEMATICAL CONCEPTS AND\n TECHNIQUES\n\nUNIT CODE : 500311113\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes\nrequired in the application of mathematical concepts and\ntechniques.\n\nELEMENT\nPERFORMANCE CRITERIA\nBold and italicized terms are elaborated in the\nRange of Variables\n1. Identify mathematical\ntools and techniques to\nsolve problem\n1.1 Problem areas are identified based on given\ncondition\n1.2 Mathematical techniques are selected based\non the given problem\n2. Apply mathematical\nprocedure/solution\n2.1 Mathematical techniques are applied based on\nthe problem identified\n2.2 Mathematical computations are performed to the\nlevel of accuracy required for the problem\n2.3 Results of mathematical computation is\ndetermined and verified based on job\nrequirements\n3. Analyze results\n3.1 Result of application is reviewed based on\nexpected and required specifications and\noutcome\n3.2 Appropriate action is applied in case of error\n\n--- PDF PAGE 22 ---\n________________________________________________________________________________________________20\nEVENTS MANAGEMENT SERVICES NCIII Promulgated November 2007\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Mathematical techniques\nMay include but are not limited to:\n1.1 Four fundamental operations\n1.2 Measurements\n1.3 Use/Conversion of units of measurements\n1.4 Use of standard formulas\n2. Appropriate action\nMay include but not limited to:\n2.1 Review in the use of mathematical\ntechniques (e.g. recalculation, re-modeling)\n2.2 Report error to immediate superior for proper\naction\n\n--- PDF PAGE 23 ---\n________________________________________________________________________________________________21\nEVENTS MANAGEMENT SERVICES NCIII Promulgated November 2007\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Identified, applied and reviewed the use of\nmathematical concepts and techniques to workplace\nproblems\n2. Underpinning\nknowledge\n2.1 Fundamental operation (addition, subtraction, division,\nmultiplication)\n2.2 Measurement system\n2.3 Precision and accuracy\n2.4 Basic measuring tools/devices\n3. Underpinning\nskills\n3.1 Applying mathematical computations\n3.2 Using calculator\n3.3 Using different measuring tools\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Calculator\n4.2 Basic measuring tools\n4.3 Case Problems\n5. Methods of\nassessment\nCompetency may be assessed through:\n5.1 Authenticated portfolio\n5.2 Written Test\n5.3 Interview/Oral Questioning\n5.4 Demonstration\n6. Context of\nassessment\n6.1 Competency may be assessed in the work place or in a\nsimulated work place setting\n\n--- PDF PAGE 24 ---\n________________________________________________________________________________________________22\nEVENTS MANAGEMENT SERVICES NCIII Promulgated November 2007\n\nUNIT OF COMPETENCY: USE RELEVANT TECHNOLOGIES\n\nUNIT CODE : 500311114\n\nUNIT DESCRIPTOR : This unit of competency covers the knowledge, skills, and\nattitude required in selecting, sourcing and applying\nappropriate and affordable technologies in the workplace.\n\nELEMENT\nPERFORMANCE CRITERIA\nBold and italicized terms are elaborated in the\nRange of Variables\n\n1. Study/select appropriate\ntechnology\n\n1.1 Usage of different technologies is determined\nbased on job requirements\n1.2 Appropriate technology is selected as per work\n specification\n\n2. Apply relevant\ntechnology\n\n2.1 Relevant technology is effectively used in carrying\n out function\n2.2 Applicable software and hardware are used as per\n task requirement\n2.3 Management concepts are observed and\npracticed as per established industry practices\n\n3. Maintain/enhance\nrelevant technology\n\n3.1 Maintenance of technology is applied in\naccordance with the industry standard operating\nprocedure, manufacturer’s operating\nguidelines and occupational health and safety\nprocedure to ensure its operative ability\n3.2 Updating of technology is maintained through\ncontinuing education or training in accordance with\njob requirement\n3.3 Technology failure/ defect is immediately reported\nto the concern/responsible person or section for\nappropriate action\n\n--- PDF PAGE 25 ---\n________________________________________________________________________________________________23\nEVENTS MANAGEMENT SERVICES NCIII Promulgated November 2007\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Technology\nMay include but are not limited to:\n1.1 Office technology\n1.2 Industrial technology\n1.3 System technology\n1.4 Information technology\n1.5 Training technology\n2. Management concepts\nMay include but not limited to:\n2.1 Real Time Management\n2.2 KAIZEN or continuous improvement\n2.3 5s\n2.4 Total Quality Management\n2.5 Other management/productivity tools\n3. Industry standard operating\nprocedure\nMay include but are not limited to:\n3.1 Written guidelines relative to the usage of\noffice technology/equipment\n3.2 Verbal advise/instruction from the co-worker\n4. Manufacturer’s operating\nguidelines/ instructions\nMay include but are not limited to:\n4.1 Written instruction/manuals of specific\ntechnology/ equipment\n4.2 General instruction manual\n4.3 Verbal advise from manufacturer relative to\nthe operation of equipment\n5. Occupational health and\nsafety procedure\nMay include but are not limited to:\n5.1 Relevant statutes on OHS\n5.2 Company guidelines in using\n technology/equipment\n6. Appropriate action\nMay include but are not limited to:\n6.1 Implementing preventive maintenance\nschedule\n6.2 Coordinating with manufacturer’s technician\n\n--- PDF PAGE 26 ---\n________________________________________________________________________________________________24\nEVENTS MANAGEMENT SERVICES NCIII Promulgated November 2007\n\n EVIDENCE GUIDE\n\n2 1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Studied and selected appropriate technology\nconsistent with work requirements\n1.2 Applied relevant technology\n1.3 Maintained and enhanced operative ability of relevant\ntechnology\n2. Underpinning\nknowledge\n2.1 Awareness on technology and its function\n2.2 Repair and maintenance procedure\n2.3 Operating instructions\n2.4 Applicable software\n2.5 Communication techniques\n2.6 Health and safety procedure\n2.7 Company policy in relation to relevant technology\n2.8 Different management concepts\n2.9 Technology adaptability\n3. Underpinning skills\n3.1 Relevant technology application/implementation\n3.2 Basic communication skills\n3.3 Software applications skills\n3.4 Basic troubleshooting skills\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Relevant technology\n4.2 Interview and demonstration questionnaires\n4.3 Assessment packages\n5. Methods of\nassessment\nCompetency must be assessed through:\n5.1 Interview\n5.2 Actual demonstration\n5.3 Authenticated portfolio (related certificates of\ntraining/seminar)\n6. Context of\nassessment\n6.1 Competency may be assessed in actual workplace or\nsimulated environment\n\n--- PDF PAGE 27 ---\n________________________________________________________________________________________________25\nEVENTS MANAGEMENT SERVICES NCIII Promulgated November 2007\n\nCOMMON COMPETENCIES\n\nUNIT OF COMPETENCY : ROSTER STAFF\n\nUNIT CODE\n : TRS5311206\n\n UNIT DESCRIPTOR\n: This unit covers the knowledge, skills, behavior and\nmotivations required to develop staff rosters. This role\nmay be carried out by operational supervisors and\nmanagers.\n\nELEMENT\nPERFORMANCE CRITERIA\nBold and italicized terms are elaborated in the\nRange of Variables\n1. Develop and implement\nstaff rosters\n1.1 Staff rosters are developed in accordance with\ncompany agreements and wage budgets.\n1.2 Operational efficiency and customer service levels\nare maximized while wage costs are minimized in\nroster development.\n1.3 Duties are combined where appropriate to ensure\neffective use of staff.\n1.4 The available skills base is utilized appropriately to\nroster the most effective mix of staff and to meet\ndifferent operational requirements.\n1.5 Rosters are presented in required formats to\nensure clarity of information in accordance with\ncompany standards.\n1.6 Rosters are communicated to appropriate\ncolleagues within designated timelines.\n2. Maintain staff records\n2.1 Time sheets and other documentation are\ncompleted accurately and within designated\ntimelines.\n2.2 Staff records are updated accurately and\nmaintained or stored in accordance with\nestablishment procedures.\n\n--- PDF PAGE 28 ---\n________________________________________________________________________________________________26\nEVENTS MANAGEMENT SERVICES NCIII Promulgated November 2007\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Staff rosters\nMay be for but are not limited to:\n1.1 An individual department\n1.2 A whole establishment\n1.3 A specific project\n2. Company agreements\nMay include but are not limited to:\n2.1 Number of hours worked in a given shift\n2.2 Overall number of hours allocated to different\nstaff members\n2.3 Breaks between shifts\n2.4 Nature of duties allocated\n2.5 Use of permanent or casual staff\n\n--- PDF PAGE 29 ---\n________________________________________________________________________________________________27\nEVENTS MANAGEMENT SERVICES NCIII Promulgated November 2007\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Demonstrated knowledge and understanding of the\nfactors and issues which impact upon staff rostering\n1.2 Demonstrated familiarity with typical staff roster\nformats and the key information to be included\n1.3 Demonstrated the ability to prepare staff rosters which\nmeet wage budgets and which provide a level of\nstaffing sufficient to ensure the delivery of high quality\ncustomer service.\n2. Underpinning\nknowledge\n2.1 The role of staff rosters and their importance in\ncontrolling staff costs\n2.2 Factors to be considered when developing rosters\n2.3 Formats for the presentation of staff rosters and details\nto be included\n2.4 Knowledge on area of operation for which roster is\nbeing developed.\n3. Underpinning skills\n3.1 Organizing information\n3.2 Preparing staff rosters\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Project or work activities which allow the candidate to\nprepare rosters for a workplace and to evaluate their\ncost efficiency and operational effectiveness against\nnominated standards\n4.2 Preparation of more than one roster to meet the\nstaffing requirements of more than one operational\nsituation\n5. Methods of\nassessment\nCompetency may be assessed through:\n5.1.\nEvaluation of the staffing costs and service levels at\nan event for which the candidate has prepared\nrosters\n5.2.\nOral or written questions to assess knowledge of\nspecific factors which affect the design of rosters\n5.3.\nReview of portfolios of evidence and third party\nworkplace reports of on-the-job performance by the\ncandidate\n6. Context for\nassessment\n6.1.\nCompetency may be assessed in the workplace or\nin simulated workplace environment\n6.2.\nAssessment may be performed while tasks are\nbeing undertaken whether individually or in a group\n\n--- PDF PAGE 30 ---\n________________________________________________________________________________________________28\nEVENTS MANAGEMENT SERVICES NCIII Promulgated November 2007\n\nUNIT OF COMPETENCY\n: CONTROL AND ORDER STOCK\n\nUNIT CODE\n : TRS311207\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills, behavior and\nmotivations required to control and order stock in a\nrange of hospitality establishments. This role is\ngenerally carried out by supervisors and team leaders.\n\nELEMENT\nPERFORMANCE CRITERIA\nBold and italicized terms are elaborated in the\nRange of Variables\n1. Maintain stock levels\nand records\n1.1 Stock levels are monitored and maintained\naccording to company requirements.\n1.2 Stock security is monitored and systems are\nadjusted as required.\n1.3 Stock reorder cycles are monitored and adjusted\nas required.\n1.4 Colleagues are informed of their individual\nresponsibilities in regard to the reordering of stock.\n1.5 Records of stock storage and movement are\nmaintained in accordance with company\nprocedures.\n1.6 Stock performance is monitored and fast/slow-\nselling items are identified and reported in\naccordance with company procedures.\n2. Process stock orders\n2.1 Orders for stock are processed accurately and in\naccordance with company procedures.\n2.2 Stock levels are maintained and recorded\nensuring information is complete, correct and\ncurrent.\n2.3 Incoming stock is checked against purchase and\nsupply agreements and all necessary details are\nrecorded.\n3. Minimize stock losses\n3.1 Stock losses are identified and recorded\naccording to company procedures.\n3.2 Losses are reported in accordance with company\nprocedures.\n3.3 Avoidable losses are identified and reasons\nbehind these losses are established.\n3.4 Solutions to loss situations are recommended and\nrelated procedures are implemented to prevent\nfuture avoidable losses.\n\n--- PDF PAGE 31 ---\n________________________________________________________________________________________________29\nEVENTS MANAGEMENT SERVICES NCIII Promulgated November 2007\n\nELEMENT\nPERFORMANCE CRITERIA\nBold and italicized terms are elaborated in the\nRange of Variables\n4. Follow-up orders\n4.1 The delivery process is monitored to ensure\nagreed deadlines are met.\n4.2 Continuity of supply is ensured by liaising with\ncolleagues and suppliers.\n4.3 Routine supply problems are followed up or\nreferred to the appropriate person in accordance\nwith company policy.\n4.4 Stock is distributed to agreed locations.\n5. Organize and\nadminister stocks\n5.1 Stocks are organized at appropriate intervals\naccording to company policy and procedures.\n5.2 Stocktaking responsibilities are allocated to staff.\n5.3 Accurate stock reports are produced within\ndesignated timelines.\n\n--- PDF PAGE 32 ---\n________________________________________________________________________________________________30\nEVENTS MANAGEMENT SERVICES NCIII Promulgated November 2007\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Stock\nMay include but is not limited to:\n1.1 Food\n1.2 Beverages\n1.3 Equipment such as maintenance and cleaning\nequipment, office equipment\n1.4 Linen\n1.5 Stationery\n1.6 Brochures and promotional materials\n1.7 Cleaning supplies and chemicals\n1.8 Vouchers and tickets\n1.9 Souvenir products\n2. Stock losses\nMay be due to the following:\n2.1 Lack of rotation leading to product\ndeterioration\n2.2 Inappropriate storage conditions\n2.3 Access by pests or vermin\n2.4 Theft\n2.5 Overstocking\n\n--- PDF PAGE 33 ---\n________________________________________________________________________________________________31\nEVENTS MANAGEMENT SERVICES NCIII Promulgated November 2007\n\nEVIDENCE GUIDE\n\n1. Critical aspects\nof competency\nAssessment requires evidence that the candidate:\n1.1 Demonstrated the ability to maintain continuous stock\nsupply within a specific hospitality industry environment\n1.2 Demonstrated the ability to meet accuracy and speed\nrequirements for completion and maintenance of stock\nrecords\n2. Underpinning\nknowledge\n2.1 Stock level maintenance techniques as appropriate to\nthe industry sector\n2.2 Typical stocktaking procedures as appropriate to the\nindustry sector\n2.3 Stock recording systems\n2.4 Stock security systems\n2.5 Types of stock control documentation and systems\nthat may be applied in the hospitality industry\n2.6 Reasons for stock loss and damage\n3. Underpinning\nskills\n3.1\nCollect, organize and analyze information\n3.2\nPlan and organize activities\n3.3\nApplication of underpinning knowledge\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nProject or work activities that allow the candidate to\ndemonstrate stock control and monitoring over a\nperiod of time\n4.2\nUse of real stock items\n4.3\nUse of industry-current stock control technology or\ndocumentation\n4.4\nInvolvement of internal/external suppliers\n5. Methods of\nassessment\nCompetency may be assessed through:\n5.1\nReview of activities undertaken by the candidate to\nmonitor stock for a given period of time for a specific\noutlet\n5.2\nWritten or oral questions to test knowledge of\nreasons for procedures\n5.3\nReview of workplace reports and records related to\nstock control, prepared by the candidate\n5.4\nReview of portfolios of evidence and third party\nworkplace reports of on-the-job performance by the\ncandidate\n\n--- PDF PAGE 34 ---\n________________________________________________________________________________________________32\nEVENTS MANAGEMENT SERVICES NCIII Promulgated November 2007\n\n6. Context for\nassessment\n6.1\nCompetency assessment may occur in workplace or\nany appropriately simulated environment\n6.2\nAssessment may be performed while tasks are being\nundertaken whether individually or in a group\n\n--- PDF PAGE 35 ---\n________________________________________________________________________________________________33\nEVENTS MANAGEMENT SERVICES NCIII Promulgated November 2007\n\nUNIT OF COMPETENCY\n: TRAIN SMALL GROUPS\n\nUNIT CODE\n : TRS311208\n\nUNIT DESCRIPTOR : This unit covers the requirements for planning, delivering\nand reviewing training provided for the purposes of\ndeveloping competency on a one-to-one or small group\nbasis.\n\nELEMENT\nPERFORMANCE CRITERIA\nBold and italicized terms are elaborated in the\nRange of Variables\n1. Prepare for trainings\n1.1 Specific training needs are identified and\nconfirmed through consultation with appropriate\npersonnel.\n1.2 Training objectives are matched to identify to\nidentify competency development needs.\n1.3 Training\napproaches\nare\nplanned\nand\ndocumented.\n2. Deliver training\n2.1 Training is conducted in a safe and accessible\nenvironment.\n2.2 Training delivery methods appropriate to the\nparticipant(s) needs, trainer availability, location\nand resources are selected.\n2.3 Strategies and techniques which facilitate the\nlearning process are employed.\n2.4 Training objectives, sequence of activities and\nassessment processes are discussed with training\nparticipant(s).\n2.5 Systematic approach to training is undertaken to\nmeet specific needs of training participant(s).\n3. Provide opportunities for\npractices\n3.1 Practice opportunities are provided to ensure that\nthe participants achieve the components of\ncompetency.\n3.2 Variety of methods for encouraging learning is\nimplemented to meet the individual needs of\nparticipants.\n\n--- PDF PAGE 36 ---\n________________________________________________________________________________________________34\nEVENTS MANAGEMENT SERVICES NCIII Promulgated November 2007\n\nELEMENT\nPERFORMANCE CRITERIA\nBold and italicized terms are elaborated in the\nRange of Variables\n4. Review training\n4.1 Participants are encouraged to self evaluate\nperformance and areas for improvement are\nidentified.\n4.2 Participants’\nreadiness\nfor\nassessment\nis\nmonitored and assistance is provided with the\ncollection\nof\nevidence\nfor\nsatisfactory\nperformance.\n4.3 Training is evaluated against objectives in the\ncontext of self-assessment, participant feedback,\nsupervisor comments and measurements.\n4.4 Training details are\nrecorded according to\nenterprise and legislative requirements.\n4.5 Results of evaluation are utilized to guide further\ntraining.\n\n--- PDF PAGE 37 ---\n________________________________________________________________________________________________35\nEVENTS MANAGEMENT SERVICES NCIII Promulgated November 2007\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Training needs\nMay include but are not limited to:\n1.1 Industry/enterprise or other performance\ncompetency standards\n1.2 Industry/workplace training practices\n1.3 Job descriptions\n1.4 Results of training needs analysis\n1.5 Business plans of the organization which\nidentify skill development requirements\n1.6 Standard operating and/or other workplace\nprocedures\n2. Appropriate personnel\nMay include but are not limited to:\n2.1 Team leaders/supervisors/technical experts\n2.2 Managers/employers\n2.3 Training and assessment coordinators\n2.4 Training participants\n2.5 Representative from government regulatory\nbodies\n2.6 Union/employee representatives\n3. Training delivery methods\nMay include but are not limited to:\n3.1 Presentations\n3.2 Demonstrations\n3.3 Explanations\n3.4 Problem solving\n3.5 Mentoring\n3.6 Experiential learning\n3.7 Group work\n3.8 Job rotation\n4. Strategies and techniques\nMay include but are not limited to:\n4.1 Active listening\n4.2 Targeted questioning\n4.3 Points of clarification\n4.4 Group discussions\n\n--- PDF PAGE 38 ---\n________________________________________________________________________________________________36\nEVENTS MANAGEMENT SERVICES NCIII Promulgated November 2007\n\nVARIABLE\nRANGE\n5.Components of competency\nMay include but are not limited to:\n5.1 Task skill\n5.2 Task management skills\n5.3 Contingency management skills\n5.4 Job/role environment skills\n5.5 Transfer and application of skills and\nknowledge of new contents\n6. Needs of participants\nCharacteristics of training participants may include\nbut are not limited to:\n6.1. Cultural, language, and educational\nbackground\n6.2. Gender\n6.3. Physical ability\n6.4. Level of confidence, nervousness or anxiety\n6.5. Age\n6.6. Previous experience with the topic\n6.7. Experience in training and assessment\n\n--- PDF PAGE 39 ---\n________________________________________________________________________________________________37\nEVENTS MANAGEMENT SERVICES NCIII Promulgated November 2007\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1. Demonstrated the ability to identify specific training\nneeds and required competency outcomes.\n1.2. Demonstrated the ability to outline the training approach\nand steps to be followed.\n1.3. Demonstrated the ability to identify training participant(s)\nand delivery method(s) to be used\n1.4. Demonstrated the ability to organize and conduct the\ntraining.\n 2. Underpinning\nknowledge\n2.1. Identification of evidence of competency\n2.2. Competency in the units being taught\n2.3.Training delivery methods\n3. Underpinning\nskills\n3.1. Planning and documenting training approaches\n3.2. Training delivery methods\n3.3. Training strategies and techniques which facilitate\nlearning process\n3.4. Correct use of equipment and presentation skills\nappropriate for the training\n3.5. Communication skills (written and oral)\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1. Project or work activities that allow the candidate to\ndemonstrate planning, conducting and review of training\non a one-to-one or small group basis.\n4.2. Access to records, logbooks, reports and other sources\nof information about the operation and/or the personnel.\n5. Methods of\nassessment\nCompetency may be assessed through:\n5.1 Direct observation of performance in the conduct of the\ntraining\n5.2 Evaluation of the training plans and documents prepared\nby the candidate\n5.3 Oral or written questions to assess knowledge in training\nneeds analysis\n6. Context for\nassessment\n6.1 Competency assessment may occur in workplace or any\nappropriately simulated environment\n6.2 Assessment may be performed on multiple occasions\ninvolving a combination of direct, indirect and\nsupplementary forms of evidence.\n\n--- PDF PAGE 40 ---\n________________________________________________________________________________________________38\nEVENTS MANAGEMENT SERVICES NCIII Promulgated November 2007\n\nUNIT OF COMPETENCY\n: ESTABLISH AND CONDUCT BUSINESS\nRELATIONSHIPS\n\nUNIT CODE\n : TRS311209\n\nUNIT DESCRIPTOR : This unit covers the skills and knowledge required to\nmanage business relationships with customers or\nsuppliers within a tourism or hospitality context. It focuses\non the relationship building and negotiation skills.\n\nELEMENT\nPERFORMANCE CRITERIA\nBold and italicized terms are elaborated in the\nRange of Variables\n1. Establish and conduct\nbusiness relationships\n1.1 Relationships are established in a manner that\npromotes goodwill and trust between the\nenterprise, its customers and suppliers.\n1.2 Trust and respect are built in business\nrelationships through use of effective\ncommunication skills and techniques\n1.3 Opportunities to maintain regular contact with\ncustomers and suppliers are identified and taken\nup.\n2. Conduct negotiations\n2.1 Negotiations are conducted in a business-like\nand professional manner within the relevant\ncultural context.\n2.2 Negotiations are conducted in the context of the\ncurrent enterprise marketing focus.\n2.3 Benefits for all parties in the negotiation are\nmaximized through use of established techniques\nand in the context of establishing long term\nrelationships.\n2.4 Feedback and input from colleagues are\nincorporated into the negotiation.\n2.5 The results of negotiations are communicated to\nappropriate colleagues and stakeholders within\nthe appropriate timeframes.\n\n--- PDF PAGE 41 ---\n________________________________________________________________________________________________39\nEVENTS MANAGEMENT SERVICES NCIII Promulgated November 2007\n\nELEMENT\nPERFORMANCE CRITERIA\nBold and italicized terms are elaborated in the\nRange of Variables\n3. Make formal business\nagreements\n3.1 Agreements are confirmed in writing using formal\ncontracts and in accordance to enterprise\nrequirements.\n3.2 Appropriate approvals for all aspects of formal\nagreements are checked and obtained in\naccordance with enterprise procedures.\n3.3 The need for specialist advice in the development\nof contracts is identified and sought where\nappropriate.\n4.Foster and maintain\nbusiness relationships\n4.1 Information needed to maintain sound business\nrelationships are pro-actively sought, reviewed\nand acted upon.\n4.2 Agreements are honored within the scope of\nindividual responsibility.\n4.3 Adjustments to agreements are made in\nconsultation with the customer/supplier and\ninformation is shared with appropriate colleagues.\n4.4 Relationships are nurtured through regular\ncontact.\n\n--- PDF PAGE 42 ---\n________________________________________________________________________________________________40\nEVENTS MANAGEMENT SERVICES NCIII Promulgated November 2007\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Business relationships\nMay include but are not limited to:\n1.1 Customers\n1.2 Suppliers\n1.3 Government agencies\n1.4 Concessionaires\n2. Opportunities\nMay include but are not limited to:\n2.1 Informal social occasions\n2.2 Industry functions\n2.3 Association membership\n2.4 Co-operative promotions\n2.5 Program of regular telephone contact\n3. Negotiations\nMay include but are not limited to:\n3.1 Corporate accounts\n3.2 Service contacts\n3.3 Agency agreements\n3.4 Venue contracts\n3.5 Rate negotiations\n3.6 Marketing agreements\n3.7 Preferred product agreements\n4. Techniques\nMay include but are not limited to:\n4.1. Identification of goals, limits\n4.2. Clarification of needs of all parties\n4.3. Identifying points of agreement and points of\ndifference\n4.4. Preparatory research of facts\n4.5. Active listening and questioning\n4.6. Non-verbal communication techniques\n4.7. Appropriate language\n4.8. Bargaining\n4.9. Developing options\n4.10. Confirming agreements\n4.11. Appropriate cultural behavior\n\n--- PDF PAGE 43 ---\n________________________________________________________________________________________________41\nEVENTS MANAGEMENT SERVICES NCIII Promulgated November 2007\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Demonstrated the ability to conduct successfully business\nnegotiations\n1.2 Demonstrated the ability to build and maintain relationships\no achieve successful business outcomes\n1.3 Demonstrated the knowledge and understanding of the\ncurrent environment and major industry issues in which\ntourism and/or hospitality businesses operate.\n 2. Underpinning\nknowledge\n2.1 Business environment including major industry issues in\nwhich the tourism and hospitality industry operates.\n2.2 Legal issues that affect negotiations and contracts\n2.3 General knowledge about contracts.\n3. Underpinning\nskills\n3.1 Negotiation and communication techniques appropriate to\nnegotiations.\n3.2 Interpersonal skills\n3.3 Mathematical skills i.e. calculating profit margins for the\ncontract\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1. Project or work activities conducted over a period of time so\nthat all aspects of the unit can be assessed.\n4.2. Relationship-building and negotiation activities with a range\nof individuals with whom the candidate has an actual or\npotential business relationship.\n5. Methods of\nassessment\nCompetency may be assessed through:\n5.1. Evaluation of negotiation and business relationships or\nagreements conducted or made by the candidate\n5.2. Evaluation of reports prepared by the candidate detailing\nhow the negotiation aspects of a project were managed.\n5.3. Case studies to assess application of knowledge to\nbusiness situations.\n6. Context for\nassessment\n6.1. Competency assessment may occur in workplace or any\nappropriately simulated environment\n6.2. Assessment may be performed on multiple occasions\ninvolving a combination of direct, indirect and\nsupplementary forms of evidence.\n\n--- PDF PAGE 44 ---\n________________________________________________________________________________________________42\nEVENTS MANAGEMENT SERVICES NCIII Promulgated November 2007\n\nCORE COMPETENCIES\n\nEVENT PLANNING SERVICES\n\nUNIT OF COMPETENCY:\nPLAN AND DEVELOP EVENT PROPOSAL OR BID\n\nUNIT CODE\n : TRS342315\n\nUNIT DESCRIPTOR\n: This unit covers the knowledge, skills, behavior and\nmotivations required to plan and develop proposals and\nbids for the staging of meetings and events. Depending on\nthe context, this role could be performed by a wide range of\nindividuals including event managers, local or regional\ntourism managers,\nvenue managers and\nmarketing\nmanagers.\n\nELEMENT\nPERFORMANCE CRITERIA\nBold and italicized terms are elaborated in the\nRange of Variables\n1. Interpret event brief\n1.1 Contents of the event brief are accurately\ninterpreted and the company’s capacity to\nmeet stated requirements is assessed.\n1.2 Action required for the development of the\nproposal or bid is identified and planned.\n1.3 Liaison with customer is undertaken to\nclarify requirements when appropriate.\n2. Develop proposal and bid details\n\n2.1 Details for inclusion in the proposal/bid are\ndeveloped after consultation with suppliers\nand other relevant agencies.\n2.2 Options to meet and, where possible,\nexceed the expectations of the customer\nare developed, including integration of\ncurrent and emerging technology.\n2.3 Possible competitors are evaluated and\nstrategies to address competitive issues are\ndeveloped.\n3. Develop bid materials\n3.1 Bid materials are prepared within the\ndesignated time lines in accordance with\nthe requirements of the brief.\n3.2 Materials are presented in a format that\nmaximizes the use of presentation and\npromotional techniques.\n\n--- PDF PAGE 45 ---\n________________________________________________________________________________________________43\nEVENTS MANAGEMENT SERVICES NCIII Promulgated November 2007\n\nELEMENT\nPERFORMANCE CRITERIA\nBold and italicized terms are elaborated in the\nRange of Variables\n4. Submit or present the bid or\nproposal on time\n4.1 The proposal/bid is delivered within the\nprescribed time line.\n4.2 Proposal/bid presentation is conducted with\nmaximum visual/retention impact.\n\n--- PDF PAGE 46 ---\n________________________________________________________________________________________________44\nEVENTS MANAGEMENT SERVICES NCIII Promulgated November 2007\n\nRANGE OF VARIABLES\n\nVARIABLE\n\nRANGE\n\n1. Details\n May include but are not limited to:\n1.1\nGeneral concepts and themes\n1.2\nBusiness program / Conference program\n1.3\nSocial program\n1.4\nCosts\n1.5\nTouring (Pre-and post-tours, spouse program)\n1.6\nAccommodation\n1.7\nEntertainment\n1.8\nStaging\n1.9\nSpecial features\n1.10 Sample promotional materials\n1.11 References and details of other successful\nundertakings\n1.12 Company information (e.g. structure, personnel)\n1.13 Support statements, endorsement from previous\nclients\n1.14 Approach to environmental impacts and issues\n1.15 Proposals relating to use of technology\n\n--- PDF PAGE 47 ---\n________________________________________________________________________________________________45\nEVENTS MANAGEMENT SERVICES NCIII Promulgated November 2007\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\n competency\nAssessment requires evidences that the candidate:\n1.1 Demonstrated ability to undertake the proposal/bidding\nprocess for a specific meeting/event, including effective\nassessment of the event brief, coordination of all details\nand resources to meet the bid requirements and\nprofessional presentation of bid materials and\ndocuments.\n1.2 Demonstrated knowledge of typical bid/proposal\nrequirements and formats.\n2. Underpinning\n knowledge\n2.1 Components required for meeting/event proposals and\nbids and product knowledge in relation to those\ncomponents\n2.2 Networks and interrelationships of different industry\nsectors in relation to meeting/event proposal/bids\n2.3 Presentation techniques for proposal and bid materials,\nincluding current technology\n3. Underpinning\n skills\n3.1 Assessing quotes and product information from suppliers\nto make an effective selection\n3.2 Creating an effective presentation format for the bid\ndocument\n3.3 Allocating responsibilities to team members and\nmonitoring progress on bid preparations\n3.4 Running team meetings to monitor progress\n3.5 Making cost estimates for inclusion in the bid document\n3.6 Creating a proposal from scratch within an extremely\nshort timeframe\n3.7 Designing an animated computer presentation\n4. Resource\n implications\nThe following resources MUST be provided:\n4.1 Bid documents, event brief and/or case studies relevant\nto events planning and bidding\n4.2 Office equipment and materials, including equipment for\noral and visual presentations\n4.3 Liaison with the customer and potential suppliers\n\n--- PDF PAGE 48 ---\n________________________________________________________________________________________________46\nEVENTS MANAGEMENT SERVICES NCIII Promulgated November 2007\n\n5. Methods of\n assessment\nCompetency may be assessed through:\n5.1 Oral questioning or interview\n5.2 Review of portfolios of evidence of on-the-job\nperformance by the candidate\n5.3 Third-party workplace reports of on-the-job performance\nby the candidate\n6. Context for\n assessment\n6.1 Competency assessment may occur in workplace or any\nappropriately simulated environment\n6.2 Assessment may be performed on multiple occasions\ninvolving a combination of direct, indirect and\nsupplementary forms of evidence.\n\n--- PDF PAGE 49 ---\n________________________________________________________________________________________________47\nEVENTS MANAGEMENT SERVICES NCIII Promulgated November 2007\n\nUNIT OF COMPETENCY: DEVELOP AN EVENT CONCEPT\n\nUNIT CODE\n : TRS342316\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills, behavior and\nmotivations required to develop the overall concept, theme\nand format for a major event comprising multiple\ncomponents. An event manager would generally undertake\nthis process at the commencement of the event\nmanagement cycle in consultation with the stakeholders,\nincluding PR/advertising people. Sometimes the concept\ndevelopment phase is undertaken as part of the bidding\nprocess.\n\nELEMENT\n\nPERFORMANCE CRITERIA\nBold and italicized terms are elaborated in the\nRange of Variables\n1. Identify overall event\nobjectives and scope\n1.1. Key objectives and components of the event\nare identified, clarified and agreed in consultation\nwith the stakeholder.\n1.2. Key information is analyzed and stakeholders are\nconsulted to determine the scope of the event.\n1.3. Internal and external factors which may impact\non the event are analyzed.\n2. Establish event concept\ntheme and format\n2.1. Overall event concept, theme and format are\ndeveloped which reflect key objectives and meet\nthe needs of the potential audience.\n2.2. Creative elements are incorporated into the event\nconcept and theme.\n2.3. Operational practicality and cohesiveness of the\nconcept, theme and format are verified through\nconsultation and analysis.\n2.4. Summary of key logistical requirements is\ndeveloped based on the overall concept, theme\nand format.\n2.5. Accurate and complete information on the\nconcept, theme, and format are provided to all\nrelevant stakeholders to facilitate timely and\neffective planning and implementation.\n2.6. Approval from relevant stakeholders is obtained\nprior to implementation.\n\n--- PDF PAGE 50 ---\n________________________________________________________________________________________________48\nEVENTS MANAGEMENT SERVICES NCIII Promulgated November 2007\n\nRANGE OF VARIABLES\n\nVARIABLE\n\nRANGE\n\n1. Key objectives and\ncomponents of the event\nMay include but are not limited to:\n1.1 Multiple contractors\n1.2 Substantial catering (not simply afternoon snacks)\n1.3 Multiple speakers, performers or exhibitors\n1.4 Requirement for display, decoration or theming\n2. Stakeholder\nMay include but is not limited to:\n2.1 Event principal\n2.2 Local community\n2.3 Organizing committees\n2.4 Local authorities\n2.5 Customers\n2.6 Colleagues\n2.7 Staging contractors\n2.8 Entertainers\n3. Scope\nMay include but is not limited to:\n3.1 Theme/Motif of Event\n3.2 Size and number of guests/delegates\n3.3 Audience/participant needs\n3.4 Location(s)\n3.5 Duration\n3.6 Financial investment and other resourcing issues\n\n--- PDF PAGE 51 ---\n________________________________________________________________________________________________49\nEVENTS MANAGEMENT SERVICES NCIII Promulgated November 2007\n\nVARIABLE\n\nRANGE\n\n4. Internal and external factors\nMay include but are not limited to:\n4.1 Resource availability (e.g. human, financial,\nphysical)\n4.2 Potential for attraction of additional resources\n(e.g. sponsorship, co-hosting)\n4.3 Level of management commitment\n4.4 Restrictions on lead time\n4.5 Potential levels of participation and interest\n4.6 Competitive environment\n4.7 Timing and duration factors (e.g. impact of public\nholidays and other public events)\n4.8 Potential contributors\n4.9 Talent requirements\n4.10 Climate\n4.11 Access factors\n4.12 Marketing and promotional issues (e.g.\npotential for media coverage)\n 5. Key logistical requirements\nMay include but are not limited to:\n5.1 Venue decoration\n5.2 Talent\n5.3 Stage set-up and design\n5.4 Catering\n5.5 Technical effects (e.g. sound, lighting, audio-\nvisual)\n5.6 Collateral materials\n\n--- PDF PAGE 52 ---\n________________________________________________________________________________________________50\nEVENTS MANAGEMENT SERVICES NCIII Promulgated November 2007\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\n competency\nAssessment requires evidences that the candidate:\n1.1 Demonstrated ability to develop a concept and format that\nreflects event objectives.\n1.2 Demonstrated ability to develop concept that is\noperationally practical and which results in the achievement\nof objectives.\n1.3 Demonstrated knowledge of typical formats for different\nstyles of events.\n1.4 Demonstrated knowledge of the creative options to be\nconsidered when developing an event concept.\n2. Underpinning\n knowledge\n2.1. Key stakeholders for different types of events\n2.2. Internal and external factors to be considered when\ndeveloping an event concept\n2.3. Key management issues that impact on development of an\nevent concept\n2.4. Creative options for different types of event\n3. Underpinning\n skills\n3.1 Completing and reporting on an internal research process\nto determine key factors affecting a corporate event\n3.2 Developing concept, theme and format proposals for\npresentation to an event organizing committee\n3.3 Liaising with multiple potential contractors to develop an\nevent concept within a very short timeframe\n3.4 Coordinating a brainstorming session to develop the\ncreative elements of an event\n3.5 Estimating costs for particular concepts and formats\n3.6 Developing a solution to a situation where the event\nprincipal’s desire for a particular creative component does\nnot fit with the overall concept\n3.7 Using computer software to develop an animated\npresentation on an event concept\n4. Resource\n implications\nThe following resources MUST be provided:\n4.1 Standard office electronic equipment\n4.2 Event brief and requirements\n4.3 Access to and interaction with event industry suppliers\n4.4 Involvement of and interaction with an event principal or\norganizing group\n\n--- PDF PAGE 53 ---\n________________________________________________________________________________________________51\nEVENTS MANAGEMENT SERVICES NCIII Promulgated November 2007\n\n5. Methods of\n assessment\nCompetency may be assessed through:\n5.1 • Evaluation of concept through a review of candidate’s\noutput/s.\n5.2 Oral questions to assess knowledge of the range of key\nmarket factors and management issues to be considered in\nthe concept development phase.\n5.3 • Review of portfolios of evidence and third-party workplace\nreports of on-the-job performance by the candidate.\n6. Context for\n assessment\n6.1 Competency assessment may occur in workplace or any\nappropriately simulated environment\n6.2 Assessment may be performed on multiple occasions\ninvolving a combination of direct, indirect and\n supplementary forms of evidence.\n\n--- PDF PAGE 54 ---\n________________________________________________________________________________________________52\nEVENTS MANAGEMENT SERVICES NCIII Promulgated November 2007\n\nUNIT OF COMPETENCY: DEVELOP EVENT PROGRAM\n\nUNIT CODE\n : TRS342317\n\nUNIT DESCRIPTOR\n: This unit covers the knowledge, skills, behavior and\nmotivations required to design an event program. Event\nmanagers, either internal or external to the sponsoring\norganization, would generally undertake this role.\n\nELEMENT\n\nPERFORMANCE CRITERIA\nBold and italicized terms are elaborated in the Range of\nVariables\n1. Identify conference objectives\n1.1 Overall context and scope of the conference are\nidentified.\n\n1.2 Specific conference objectives are developed\nand agreed on in consultation with relevant\ncolleagues and/or customers.\n2. Design event program\n2.1 Dates and times are set to meet agreed\nobjectives.\n2.2 Theme is developed to complement event\nobjectives.\n2.3 Overall event format is developed within known\nbudget, venue and staging constraints.\n2.4 Relevant components for the program are\nidentified, designed and integrated.\n2.5 Use of appropriate technological options are\nidentified and integrated in program\ndevelopment.\n2.6 Business program based on principles of adult\nlearning is developed to incorporate an\nappropriate range of activities.\n3. Finalize program details\n3.1 Proposed event program is presented to the\nappropriate people within required timeframe.\n3.2 Approval of program details is obtained in\naccordance with agreed procedures.\n3.3 Appropriate actions are initiated in relation to the\ndissemination and publication of event program.\n\n--- PDF PAGE 55 ---\n________________________________________________________________________________________________53\nEVENTS MANAGEMENT SERVICES NCIII Promulgated November 2007\n\nRANGE OF VARIABLES\n\nVARIABLE\n\nRANGE\n1. Relevant components\nMay include but are not limited to:\n1.1 Business program\n1.2 Breaks\n1.3 Food and beverage\n1.4 Social program\n1.5 Pre and post touring elements\n2. Business program\nIssues may include but are not limited to:\n2.1 Workshops\n2.2 Plenary sessions\n2.3 Break-out sessions\n2.4 Keynote speakers\n2.5 Facilitators\n2.6 Speaker availability\n2.7 Venue-related issues\n2.8 Technology\n\n--- PDF PAGE 56 ---\n________________________________________________________________________________________________54\nEVENTS MANAGEMENT SERVICES NCIII Promulgated November 2007\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\n competency\nAssessment requires evidences that the candidate:\n1.1 Demonstrated ability to design a practical event program to\nmeet overall objectives and the needs of the target\naudience within budget guidelines.\n1.2 Demonstrated detailed knowledge of the range of options\navailable to conference organizers in terms of venues,\nstaging, format and pre/post touring components.\n2. Underpinning\n knowledge\n2.1 Typical conference session formats\n2.2 Range of options for event staging and venue set-ups\n2.3 Principles of adult learning\n2.4 Needs of different segments o the market in relation to\nconference activities (e.g. corporate, associations,\ngovernment)\n3. Underpinning\n skills\n3.1 Assessing and selecting optimum pre-and post-touring\noptions or social events for a given event\n3.2 Presenting a draft event proposal to the sponsoring\norganization\n3.3 Developing a precise schedule for all event activities\n3.4 Running a mind-mapping session with colleagues to\nsource ideas for an event program\n3.5 Calculating costs to ensure they remain within budget\nguidelines\n3.6 Adjusting a draft program to meet a 20% budget cutback\n3.7 Using a computer to calculate costs\n4. Resource\n implications\nThe following resources MUST be provided:\n4.1 Office equipment and materials, including equipment for\noral and visual presentations\n4.2 Project or work activities that allow the candidate to\ndevelop a program for an event that is actually held\n4.3 Involvement of a sponsoring organization or individual with\nwhom the candidate must liaise\n4.4 Involvement of a team in event program development\n\n--- PDF PAGE 57 ---\n________________________________________________________________________________________________55\nEVENTS MANAGEMENT SERVICES NCIII Promulgated November 2007\n\n5. Methods of\n assessment\nCompetency may be assessed through:\n5.1 Oral questioning to assess knowledge of programming for\ndifferent types of conferences and/or events.\n5.2 Review of portfolios of evidence of on-the-job performance\nby the candidate.\n5.3 Third-party workplace reports of on-the-job performance\nby the candidate.\n6. Context for\n assessment\n6.1 Competency assessment may occur in workplace or any\nappropriately simulated environment\n6.2 Assessment may be performed on multiple occasions\ninvolving a combination of direct, indirect and\n supplementary forms of evidence.\n\n--- PDF PAGE 58 ---\n________________________________________________________________________________________________56\nEVENTS MANAGEMENT SERVICES NCIII Promulgated November 2007\n\nUNIT OF COMPETENCY : SELECT EVENT VENUE AND SITE\nUNIT CODE\n\n : TRS342318\nUNIT DESCRIPTOR\n: This unit covers the knowledge, skills, behavior and\nmotivations required to undertake the venue/site selection\nprocess for a major event comprising multiple components.\nIt requires the application of significant analytical and\nresearch skills to complete the process of matching an\nevent to a particular site or venue.\n\nELEMENT\n\nPERFORMANCE CRITERIA\nBold and italicized terms are elaborated in the Range of\nVariables\n1. Analyze venue or site\nrequirements\n1.1 Event-specific venue or site requirements are\nanalyzed based on detailed review of all aspects\nof the proposed event, including multiple\ncomponents.\n1.2 Accurate and complete venue or site\nspecifications are developed to facilitate the\nresearch process.\n1.3 Needs of all stakeholders, including those with\ndisabilities, are integrated into venue or site\nspecifications.\n2. Source event venues or sites\n2.1 Potential venues or sites are researched, using\nappropriate information sources and research\nmethods.\n2.2 Suitability of venues or sites is assessed based\non comparison of services offered with\nspecifications.\n2.3 Need for and the nature of contingency planning\nrequired by specific venues or sites are assessed.\n2.4 Venue or site capacity to deliver quality outcomes\nin relation to customer service, cooperative\nmanagement, and past experience is assessed.\n2.5 Negotiation and liaising with personnel from\npotential venues or sites are undertaken to\nensure all event requirements can be met and to\naddress potential problem areas.\n2.6 Need for tentative bookings is assessed and\nprompt action is taken.\n2.7 Multiple site and venue selection is coordinated in\na logical manner when required.\n\n--- PDF PAGE 59 ---\n________________________________________________________________________________________________57\nEVENTS MANAGEMENT SERVICES NCIII Promulgated November 2007\n\nELEMENT\n\nPERFORMANCE CRITERIA\nBold and italicized terms are elaborated in the Range of\nVariables\n2.8 Clear and accurate briefings on venue or site\noptions are provided to colleagues and key\nstakeholders to include recommendations and\nrationale.\n3. Confirm venue or site\narrangements\n3.1 Venue or site arrangements are accurately\nconfirmed in writing when the selection process is\nfinalized.\n3.2 Venue or site contracts are reviewed and signed\nwithin appropriate timeframes and within the\nscope of individual responsibility.\n3.3 Specific venue and site planning issues are\nintegrated into overall event management\nsystems promptly.\n\n--- PDF PAGE 60 ---\n________________________________________________________________________________________________58\nEVENTS MANAGEMENT SERVICES NCIII Promulgated November 2007\n\nRANGE OF VARIABLES\n\nVARIABLE\n\nRANGE\n1. Aspects\nMay include but are not limited to:\n1.1 Overall theme and image\n1.2 Estimated numbers\n1.3 Facilities and services to be provided\n1.4 Budget\n1.5 Audience/delegate profile and location\n2. Multiple components\nMay include but are not limited to:\n2.1 Multiple contractors\n2.2 Substantial catering (i.e. not simply afternoon\nsnacks)\n2.3 Multiple speakers, performers or exhibitors\n2.4 Requirement for display, decoration or theming\n3. Venue or site specifications\nMay include but are not limited to:\n3.1 Availability\n3.2 Facilities and services (e.g. catering, size of area,\nprotection from the elements, equipment)\n3.3 Staging\n3.4 Capacity\n3.5 Budget parameters\n3.6 Entry and exit points\n3.7 Access and timing (set-up and breakdown)\n4. Stakeholders\nMay include but are not limited to:\n4.1 Attendees/delegates/guests\n4.2 Host organization\n4.3 Contractors/suppliers\n4.4 Sponsors\n4.5 Emergency services\n4.6 Regulatory authorities\n\n--- PDF PAGE 61 ---\n________________________________________________________________________________________________59\nEVENTS MANAGEMENT SERVICES NCIII Promulgated November 2007\n\nVARIABLE\n\nRANGE\n5. Information sources\nMay include but are not limited to:\n5.1 Local/regional/municipal tourism organizations\n5.2. Philippine Convention and Visitors Corporation\n(PCVC)\n5.3 Venue publications and directories\n5.4 Destination brochures\n5.5 Trade journals\n5.6 Internet\n6. Research methods\nMay include but are not limited to:\n6.1 Using personal event industry networks\n6.2 Desk research\n6.3 Calling for tenders\n6.4 Personal venue or site inspection\n\n--- PDF PAGE 62 ---\n________________________________________________________________________________________________60\nEVENTS MANAGEMENT SERVICES NCIII Promulgated November 2007\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\n competency\nAssessment requires evidences that the candidate:\n1.1 Researched evaluated and selected an appropriate venue\nor site for a nominated event comprising multiple\ncomponents.\n1.2 Interpreted the range of information used in the venue and\nsite selection process.\n1.3 Demonstrated knowledge of the different venue and site\noptions within the local area.\n2. Underpinning\n knowledge\n2.1 Different styles of venues and sites, services offered and\ntheir suitability for particular event types\n2.2 Venue and site options within a given locality\n2.3 Presentation styles for venue and site information and\ninterpretation of this information\n2.4 Sources for information on venue and site\n2.5 • Features and requirements of a typical venue or site\ncontracts\n2.6 • Typical operational structures within a venue including\nrelevant personnel, internal networks and interrelationships\nand reporting structures.\n3. Underpinning\n skills\n3.1 Analyzing information from a range of venues or sites and\nassessing suitability\n3.2 Developing an event specification document\n3.3 Selecting and booking venues for an event\n3.4 Running a venue sub-committee meeting to assess venue\noptions\n3.5 Calculating floor space requirements for a given event\n3.6 Adjusting venues and dates when venue availability is\nlimited\n4. Resource\n implications\nThe following resources MUST be provided:\n4.1 Office equipment and material, including equipment for\noral and visual presentations\n4.2 Venue/site selection process for an event which becomes\nan event managed by the candidate\n4.3 Access to venues and sites relevant to different types of\nevents\n4.4 Current industry documentation and publications relating to\nvenues and sites\n4.5 Access to and liaison with venue personnel during the\nselection process\n4.6 Involvement of and consultation with event stakeholders\n\n--- PDF PAGE 63 ---\n________________________________________________________________________________________________61\nEVENTS MANAGEMENT SERVICES NCIII Promulgated November 2007\n\n5. Methods of\n assessment\nCompetency may be assessed through:\n5.1 Oral questioning/Interview\n5.2 Evaluation of candidate’s output/s showing documentation\nand specifications.\n5.3 Third-party workplace reports of on-the-job performance\nby the candidate.\n6. Context for\n assessment\n6.1 Competency assessment may occur in workplace or any\nappropriately simulated environment\n6.2 Assessment may be performed on multiple occasions\ninvolving a combination of direct, indirect and\nsupplementary forms of evidence.\n\n--- PDF PAGE 64 ---\n________________________________________________________________________________________________62\nEVENTS MANAGEMENT SERVICES NCIII Promulgated November 2007\n\nUNIT OF COMPETENCY : DEVELOP AND UPDATE EVENT INDUSTRY\n KNOWLEDGE\n\nUNIT CODE\n\n : TRS342319\nUNIT DESCRIPTOR\n: This unit covers the knowledge, skills, behavior and\nmotivations required to develop and update general\nknowledge of the meetings and events industry including\nindustry structure, legal issues and current technology. This\nknowledge underpins effective performance in all meeting\nand event organization and management roles.\n\nELEMENT\n\nPERFORMANCE CRITERIA\nBold and italicized terms are elaborated in the Range of\nVariables\n1. Source and apply information\non the structure and\noperation of the event\nindustry\n1.1 Sources of information on the event industry\nare identified correctly.\n1.2 Knowledge of the event industry is used I the\ncorrect context to enhance the quality of work\nperformance.\n2. Source and apply information\non ethical and legal issues for\nthe event industry\n2.1 Information on legal and ethical issues are\nobtained to assist effective work performance.\n2.2 Day-to-day event organization activities are\nconducted in accordance with legal obligations\nand ethical industry practices.\n3. Source and apply information\non event industry technology\n3.1 Information on current and emerging\ntechnologies that impact on the event\norganization process are obtained.\n3.2 The potential effects of different technologies on\nthe event organization process are assessed.\n3.3 Knowledge of current and emerging technology\nis applied in day-to-day work activities.\n4. Update event industry\nknowledge\n4.1 A range of opportunities is identified and used\nto update knowledge of the events industry.\n4.2 Current issues of concern to the industry are\nmonitored.\n4.3 Updated knowledge is shared with customers\nand colleagues as appropriate, and incorporated\ninto day-to-day work activities.\n\n--- PDF PAGE 65 ---\n________________________________________________________________________________________________63\nEVENTS MANAGEMENT SERVICES NCIII Promulgated November 2007\n\nRANGE OF VARIABLES\n\nVARIABLE\n\nRANGE\n1. Information\nMay include but is not limited to:\n1.1 Industry structure\n1.2 Different event types and staging elements\n1.3 Event protocols\n1.4 Major industry bodies/associations\n1.5 Impacts of events on local economies\n1.6 Trends\n1.7 Career opportunities\n2. Event\nMay include but is not limited to:\n2.1 Conferences\n2.2 Symposia\n2.3 Exhibitions\n2.4 Festivals\n2.5 Promotions\n2.6 Shows\n2.7 Sporting events\n2.8 Parades\n2.9 Cultural celebrations\n2.10 Trade and consumer shows\n2.11 Social events\n2.12 Public events\n2.13 Corporate events\n2.14 Charitable, fund-raising events\n3. Legal and ethical issues\nMay include but are not limited to:\n3.1 Public liability\n3.2 Duty of care\n3.3 Licensing\n3.4 Risk management\n3.5 Occupational health and safety\n\n--- PDF PAGE 66 ---\n________________________________________________________________________________________________64\nEVENTS MANAGEMENT SERVICES NCIII Promulgated November 2007\n\nVARIABLE\n\nRANGE\n4. Ethical industry practices\nMay include but are not limited to:\n4.1 Commission procedures\n4.2 Bookings at venues\n4.3 Confidentiality\n4.4 Overbooking\n4.5 Sub-contracting\n4.6 Pricing\n5. Technologies\nMay include but are not limited to:\n5.1 Project management systems\n5.2 Delegate registration and tracking systems\n5.3 CAD systems\n5.4 Internal venue booking systems\n6. Opportunities\nMay include but are not limited to:\n6.1 Industry seminars\n6.2 Training course\n6.3 Industry association membership\n6.4 Participation in events industry association\nactivities\n6.5 Informal networking with colleagues\n6.6 Reading industry journals\n6.7 Web search\n\n--- PDF PAGE 67 ---\n________________________________________________________________________________________________65\nEVENTS MANAGEMENT SERVICES NCIII Promulgated November 2007\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\n competency\nAssessment requires evidences that the candidate:\n1.1 Demonstrated • general knowledge of the events industry.\n1.2 Demonstrated understanding of how industry knowledge\ncan be applied to work activities to maximize effective\nperformance.\n1.3 Demonstrated • knowledge of ways to maintain currency of\nknowledge.\n2. Underpinning\n knowledge\n2.1 Main types of events including the following for different\nevent types:\n• Objectives/roles\n• Scope\n• Nature of audience\n• Key stakeholders\n• Key elements of staging an event\n2.2 Structure and function of the events industry, including:\n• Relationships between the events industry and other\nindustries such as entertainment\n• Businesses and organizations involved in the\nindustry\n• Key motivations for hosting events\n2.3 Role and impact of events on local economies\n2.4 • Legal and ethical issues that impact on event\nmanagement including overview of relevant legislation\n2.5 Current and emerging technology for different aspects of\nthe event management process\n3. Underpinning\n skills\n3.1 Deciding whether to join an industry association based on\nevaluation of promotional materials\n3.2 Coordinating with clients on protocol requirements for a\ngiven event\n3.3 Organizing a personal program of professional\ndevelopment activities for the upcoming year\n3.4 Discussing industry developments with colleagues\n3.5 Responding to a situation at a particular type of event\nwhere candidate has no knowledge of its components\n3.6 Using the internet to source information on the events\nindustry\n\n--- PDF PAGE 68 ---\n________________________________________________________________________________________________66\nEVENTS MANAGEMENT SERVICES NCIII Promulgated November 2007\n\n4. Resource\n implications\nThe following resources MUST be provided:\n4.1 Standard office electronic equipment\n5. Methods of\n assessment\nCompetency may be assessed through:\n5.1 Oral questioning to assess knowledge of different aspects\nof the events industry.\n5.2 • Review of portfolios of evidence of on-the-job\nperformance by the candidate.\n 5.3 Third-party workplace reports of on-the-job performance by\nthe candidate.\n6. Context for\n assessment\n6.1 Competency assessment may occur in workplace or any\nappropriately simulated environment.\n6.2 Assessment may be performed on multiple occasions\ninvolving a combination of direct, indirect and\nsupplementary forms of evidence.\n\n--- PDF PAGE 69 ---\n________________________________________________________________________________________________67\nEVENTS MANAGEMENT SERVICES NCIII Promulgated November 2007\n\nON-SITE EVENT MANAGEMENT SERVICES\n\nUNIT OF COMPETENCY : PROVIDE ON-SITE EVENT MANAGEMENT SERVICES\nUNIT CODE\n\n : TRS342320\nUNIT DESCRIPTOR\n: This unit covers the knowledge, skills, behavior and\nmotivations required to coordinate the final preparation and\nset-up of a major event comprising multiple components\nand to manage all aspects of the on-site operation.\n\nELEMENT\n\nPERFORMANCE CRITERIA\nBold and italicized terms are elaborated in the Range of\nVariables\n1. Prepare for on-site\nmanagement\n1.1 Plans for on-site management are developed in\naccordance with agreed procedures for the\nmeeting or event.\n1.2 Final arrangements for all aspects of the meeting\nor event are checked and any discrepancies are\nattended to.\n1.3 Materials are created and collated to facilitate\neffective on-site management.\n1.4 Accurate briefing is provided to operational staff\nand contractors prior to the meeting or event in\nan appropriate format including clarification of\nroles and responsibilities.\n2. Oversee meeting/event set-\nup\n2.1 Contact with the nominated contractor personnel\nis established at the appropriate time and all\nrequirements are reconfirmed and agreed to.\n2.2 Necessary adjustments are made and agreed to\nwith the contractors.\n2.3 All aspects of the event or meeting set up are\nchecked against the pre-arranged agreements.\n2.4 Venue space and set up of equipment are\nchecked to allow for easy access, especially for\nthose with disabilities, and to avoid risk of injury\nto guests, delegates and colleagues.\n2.5 Any deficiencies and discrepancies are\nidentified and prompt action is taken to rectify the\nsituation.\n2.6 Additional on-site staff are briefed on the full\ndetails of the meeting or event operation including\ncommunication and control mechanisms.\n\n--- PDF PAGE 70 ---\n________________________________________________________________________________________________68\nEVENTS MANAGEMENT SERVICES NCIII Promulgated November 2007\n\nELEMENT\n\nPERFORMANCE CRITERIA\nBold and italicized terms are elaborated in the Range of\nVariables\n3. Monitor meeting/event\noperation\n3.1 Sessions and activities are monitored throughout\nthe meeting or event through observation and\nappropriate reporting processes.\n3.2 Problems are identified as they arise and prompt\naction is taken to resolve the situation.\n3.3 Additional requirements are identified and\npromptly organized.\n3.4 Customer is liaised with throughout the meeting\nor event to ensure it is progressing to his/her\nsatisfaction.\n3.5 All contractors are liaised with on an ongoing\nbasis to ensure effective delivery of services.\n4. Oversee meeting/event\nbreakdown\n4.1 Breakdown of the meeting or event is checked to\nensure it is completed in accordance with\nagreements.\n4.2 The packing and removal of all materials and\nequipment are coordinated in accordance with\npre-arranged details.\n4.3 Venue is checked to ensure items and belongings\nare not left behind.\n4.4 Debriefing is conducted with contractors and\nstaff, if necessary, to discuss any difficulties or\nsuggestions for future improvements.\n4.5 Accounts are checked and signed in accordance\nwith contractor agreements.\n4.6 Outstanding items requiring post-event action are\nnoted.\n\n--- PDF PAGE 71 ---\n________________________________________________________________________________________________69\nEVENTS MANAGEMENT SERVICES NCIII Promulgated November 2007\n\nRANGE OF VARIABLES\n\nVARIABLE\n\nRANGE\n1. Procedures\nMay include but are not limited to:\n1.1 Registrations\n1.2 Organizing committee\n1.3 Record-keeping and reporting\n1.4 Special needs\n1.5 Risk management\n1.6 Crowd control\n1.7 Event timings\n1.8 Contractor communication\n2. Materials\nMay include but are not limited to:\n2.1 Running sheets\n2.2 Copies of agreements with clients\n2.3 Copies of agreements with all contractors\n2.4 Contact numbers for all contractors and staff\n2.5 Briefing papers\n3. Contractors\nMay include but are not limited to:\n3.1 Venues\n3.2 Speakers\n3.3 Staging and audio visual suppliers\n3.4 Display suppliers\n3.5 Caterers\n3.6 Entertainers\n3.7 Equipment hire companies\n4. Aspects of the event or\nmeeting\nMay include but are not limited to:\n4.1 Availability of all materials and equipment\n4.2 Room set up\n4.3 Staging\n4.4 Technical equipment\n4.5 Display and signage\n4.6 Food and beverage arrangements\n4.7 Registration areas\n\n--- PDF PAGE 72 ---\n________________________________________________________________________________________________70\nEVENTS MANAGEMENT SERVICES NCIII Promulgated November 2007\n\nVARIABLE\n\nRANGE\n5. Deficiencies and\ndiscrepancies\nMay include but are not limited to:\n5.1 Incorrect room set ups\n5.2 Incorrect staging\n5.3 Faulty or non availability of technical equipment\n5.4 Lack of equipment to manage displays and\nsignage\n5.5 Shortage of food and beverage\n5.6 Inappropriate space at registration areas\n6. Communication and control\nmechanisms\nMay include but are not limited to:\n6.1 Guidelines on reporting lines during the event\n6.2 Regularity of updates to event managers\n6.3 Specific performance indicators\n6.4 Contingency plans\n7. Breakdown\nMay include but is not limited to:\n7.1 Packing and removal of all materials and\nequipment\n7.2 Final check of venue\n7.3 Checking and signing of accounts with contractors\n\n--- PDF PAGE 73 ---\n________________________________________________________________________________________________71\nEVENTS MANAGEMENT SERVICES NCIII Promulgated November 2007\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\n competency\nAssessment requires evidences that the candidate:\n1.1 Demonstrated ability to manage the on-site operation of a\nmeeting or event including all aspects of preparation, set\nup, operation and move out.\n1.2 Demonstrated knowledge of the range of issues and\nproblems that may arise during the conduct of\nmeetings/events.\n2. Underpinning\n knowledge\n2.1 Typical on-site events management systems and\nprocedures\n2.2 Logistics for on-site management including contractor\ncommunication mechanisms and protocols (e.g. main\nliaison person within a venue, hierarchy of control, walkie-\ntalkie options)\n2.3 • Running sheets and how they are used\n2.4 • Importance of and techniques for managing stress and\ntime during the operation of an event\n2.5 Characteristics of written contractor documentation\nincluding event order and other technical specifications\n2.6 Safety/risk issues associated with the movement of\nnumbers of people at meeting and event venues\n3. Underpinning\n skills\n3.1 Negotiation skills in specific relation to time constraints of\non-site activities\n3.2 Checking all aspects of the event or meeting set up against\nthe pre-arranged agreements\n3.3 Providing a pre-event briefing to operational staff and\nsuppliers\n3.4 Discussing problems with operational staff and providing\nadvice on how to solve them\n3.5 Developing plans for on-site management\n3.6 Preparing service reconfirmation checklists\n3.7 Providing instructions to operational team members,\nbriefing and debriefing suppliers and staff\n3.8 Checking capacity of venue outlets against numbers of\nregistrations\n3.9 Checking and signing accounts in accordance with supplier\nagreements\n3.10\nIdentifying room set up deficiencies and discrepancies in\nsupply of equipment and taking prompt action to rectify the\nsituation\n3.11\nCreating and collating a computerized running sheet\n\n--- PDF PAGE 74 ---\n________________________________________________________________________________________________72\nEVENTS MANAGEMENT SERVICES NCIII Promulgated November 2007\n\n4. Resource\n implications\nThe following resources MUST be provided:\n4.1 Project or work activities that allow the candidate to\nmanage the on-site aspects of a meeting or event within an\nappropriate venue on more than one occasion to ensure\nthat skills in dealing with a range of circumstances are\ndemonstrated\n4.2 Involvement of a team of operational staff involved in\ndelivering a meeting or event\n4.3 • Involvement of suppliers of equipment and services\n4.4 Realistic ratios of operational staff to delegates and guests\n4.5 Presence of commercially-realistic time pressures related\nto the operation of an event\n4.6 Use of meeting and event operational documents and\nequipment\n5. Methods of\n assessment\nCompetency may be assessed through:\n5.1 Direct observation with Oral Questioning of actual event\nmanaged by candidate\n5.2 • Evaluation of candidate’s outputs such as running sheets,\nsite management plans, review of staff or supplier briefing\ndocuments and reconfirmation checklists.\n5.3 Review of portfolios of evidence and third party workplace\nreports of on-the-job performance by the candidate.\n5.4 Third Party Report\n6. Context for\n assessment\n6.1 Competency assessment may occur in workplace or any\nappropriately simulated environment.\n6.2 Assessment may be performed on multiple occasions\ninvolving a combination of direct, indirect and supplementary\nforms of evidence.\n\n--- PDF PAGE 75 ---\n________________________________________________________________________________________________73\nEVENTS MANAGEMENT SERVICES NCIII Promulgated November 2007\n\nUNIT OF COMPETENCY : MANAGE CONTRACTORS FOR INDOOR EVENTS\nUNIT CODE\n\n : TRS342321\nUNIT DESCRIPTOR\n: This unit covers the knowledge, skills, behavior and\nmotivations required to manage the staging and operation\nof a major indoor event comprising multiple components. It\ndoes not cover the high levels of technical expertise\nrequired to actually provide these services, but focuses on\nthe key knowledge and skills required to oversee the\nprocess from an organizational and contractor management\nperspective.\n\nELEMENT\n\nPERFORMANCE CRITERIA\nBold and italicized terms are elaborated in the Range of\nVariables\n1. Identify event operational\nrequirements\n1.1 Event staging requirements are analyzed\nbased on detailed review of all aspects of the\nproposed event with multiple components.\n1.2 An accurate summary of staging requirements is\ndeveloped for each event component in\nconsultation with key stakeholders.\n1.3 Safety and risk management issues are\nincorporated into all planning documentation and\nprocesses.\n2. Source contractors\n2.1 Appropriate contractors are identified and\nsourced to provide services for the event.\n2.2 Accurate briefings or specifications on precise\nstaging requirements are provided to contractors.\n2.3 Complete and timely quotations for the provision\nof services are obtained.\n2.4 Quotations are analyzed and contractors are\nselected in consultation with key stakeholders.\n2.5 Agreements with contractors are confirmed in\nwriting to include details and costs of all services.\n3. Monitor contractors\n3.1 Progress, including safety issues, is monitored at\nregular intervals through ongoing liaison with\ncontractors and other stakeholders.\n3.2 Need for adjustments is identified and\nappropriate changes are organized with\nconfirmation in writing.\n3.3 Adjustments are negotiated to maintain the\nintegrity and quality of the event.\n\n--- PDF PAGE 76 ---\n________________________________________________________________________________________________74\nEVENTS MANAGEMENT SERVICES NCIII Promulgated November 2007\n\nELEMENT\n\nPERFORMANCE CRITERIA\nBold and italicized terms are elaborated in the Range of\nVariables\n\n3.4 Work completed is evaluated against event\nrequirements and time schedules and appropriate\naction is taken to address delays.\n\n--- PDF PAGE 77 ---\n________________________________________________________________________________________________75\nEVENTS MANAGEMENT SERVICES NCIII Promulgated November 2007\n\nRANGE OF VARIABLES\n\nVARIABLE\n\nRANGE\n1. Staging requirements\nMay include but are not limited to:\n1.1 Exhibition set-up\n1.2 Audio-visual\n1.3 Display and decoration\n1.4 Furniture\n1.5 Special effects\n1.6 Entertainment\n1.7 Lighting\n1.8 Sound\n1.9 Stage design\n1.10 Rigging\n1.11 Catering and catering set-up\n1.12 Security\n2. Multiple components\nMay include but are not limited to:\n2.1 Multiple contractors\n2.2 Substantial catering (not simply afternoon snacks)\n2.3 Multiple speakers, performers or exhibitors\n2.4 Requirement for display, decoration or theming\n3. Contractors\nMay include but are not limited to:\n3.1 Venues\n3.2 • Speakers\n3.3 • Staging and audio visual suppliers\n3.4 • Display suppliers\n3.5 • Caterers\n3.6 • Entertainers\n3.7 Equipment hire companies\n4. Specifications\nMay include but are not limited to:\n4.1 Price\n4.2 Performance standards\n4.3 Timelines\n4.4 Technical specifications for equipment\n4.5 Theme-related requirements\n\n--- PDF PAGE 78 ---\n________________________________________________________________________________________________76\nEVENTS MANAGEMENT SERVICES NCIII Promulgated November 2007\n\nVARIABLE\n\nRANGE\n4.6 Regulatory requirements\n4.7 Previous experience\n\n--- PDF PAGE 79 ---\n________________________________________________________________________________________________77\nEVENTS MANAGEMENT SERVICES NCIII Promulgated November 2007\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\n competency\nAssessment requires evidence that the candidate:\n1.1. Demonstrated general knowledge of all event staging\nservices and terminology.\n1.2. Demonstrated ability to organize and coordinate multiple\ncontractors as part of the overall event management\nprocess.\n2. Underpinning\n knowledge\n2.1 Roles and responsibilities of organizations involved in event\nstaging\n2.2 Fundamentals of Obligations and Contracts\n2.3 Suppliers of staging services and sources of information on\nstaging services\n2.4 Risk management issues to be considered for key areas of\nevent staging\n2.5 Knowledge of terminology, services and key technology in\nkey areas of staging including:\n• Catering\n• Venue decoration\n• Audio-visual options\n• Sound amplification\n• Lighting\n• Rigging\n• Live entertainment\n• Registration areas\n• Display\n• Security\n• Electronic media coverage of events\n• Safety equipment\n2.6 The key inclusions for contractor briefing or specification\ndocuments\n3. Underpinning\n skills\n3.1 Assessing competitive quotes from staging suppliers\n3.2 Developing a tender brief for staging suppliers\n3.3 Appointing and managing multiple suppliers before, during\nand after an event\n3.4 Negotiating with suppliers on changing requirements\n3.5 Calculating numbers of exhibition panels required for a\ntrade show\n\n--- PDF PAGE 80 ---\n________________________________________________________________________________________________78\nEVENTS MANAGEMENT SERVICES NCIII Promulgated November 2007\n\n3.6 Negotiating with a supplier who is failing to meet contract\nobligations\n3.7 Creating different staging scenarios\n4. Resource\n implications\nThe following resources MUST be provided:\n4.1 Standard office electronic equipment\n4.2 Access to venues for staging of an indoor event\n4.3 • Access to all equipment required for the staging of an\nevent\n4.4 Liaison with and involvement of multiple contractors\n5. Methods of\n assessment\nCompetency may be assessed through:\n5.1 Evaluation of candidate’s output to review documentation\nused to manage contractors.\n5.2 Oral questioning to assess knowledge of key staging\nservices and relevant terminology.\n5.3 Review of third-party workplace reports of on-the-job\nperformance by the candidate.\n6. Context for\n assessment\n6.1 Competency assessment may occur in workplace or any\nappropriately simulated environment.\n6.2 Assessment may be performed on multiple occasions\ninvolving a combination of direct, indirect and supplementary\nforms of evidence.\n\n--- PDF PAGE 81 ---\n________________________________________________________________________________________________79\nEVENTS MANAGEMENT SERVICES NCIII Promulgated November 2007\n\n UNIT OF COMPETENCY : DEVELOP AND UPDATE KNOWLEDGE ON PROTOCOL\nUNIT CODE\n : TRS342322\nUNIT DESCRIPTOR\n: This unit covers the knowledge, skills, behavior and\nmotivations required to develop and apply knowledge of\nprotocol to a range of tourism related activities. It is\nparticularly relevant to those involved in the management\nand operation of events, including functions.\n\nELEMENT\n\nPERFORMANCE CRITERIA\nBold and italicized terms are elaborated in the Range of\nVariables\n1. Seek information on\nappropriate protocol\n1.1 Sources of accurate information on protocol are\nidentified.\n1.2 Relevant protocol information is accessed in\nresponse to workplace needs.\n2. Integrate appropriate protocol\nprocedures into work activities\n2.1 Areas of work activity and/or functions that\nrequire appropriate use of protocol are identified\nin a timely manner.\n2.2 Correct use of protocol is integrated into work\nactivities.\n2.3 Appropriate protocol requirements are determined\nby liaising with colleagues and other\nstakeholders.\n2.4 Appropriate information on protocol is provided to\nrelevant colleagues and stakeholders.\n3. Update knowledge on\nprotocol\n3.1 Opportunities to update protocol knowledge are\nidentified and used.\n3.2 Updated knowledge is shared with customers and\ncolleagues as appropriate and incorporated into\nday-to-day working activities.\n\n--- PDF PAGE 82 ---\n________________________________________________________________________________________________80\nEVENTS MANAGEMENT SERVICES NCIII Promulgated November 2007\n\nRANGE OF VARIABLES\n\nVARIABLE\n\nRANGE\n1. Sources of accurate\ninformation\nMay include but are not limited to:\n1.1 • Libraries\n1.2 Internet\n1.3 Department of Foreign Affairs\n1.4 Department of Interior and Local Government\n1.5 National Council of Culture and Arts\n1.6 Office of the United Nations\n2. Functions\nMay include but are not limited to:\n2.1 Civic receptions\n2.2 • Formal parades\n2.3 City ceremonies\n2.4 National holiday receptions\n2.5 Independence ceremonies\n2.6 Private functions\n2.7 Functions with VIPs and/or government officials in\nattendance\n3. Work activities\nMay include but are not limited to:\n3.1 Issuing invitations\n3.2 Preparing running sheets\n3.3 Preparation of briefing papers\n3.4 Liaison with dignitaries and officials\n3.5 Correspondence to dignitaries and officials\n3.6 Providing various services during the conduct of\non-site management, service of food and beverage\n\n--- PDF PAGE 83 ---\n________________________________________________________________________________________________81\nEVENTS MANAGEMENT SERVICES NCIII Promulgated November 2007\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\n competency\nAssessment requires evidence that the candidate:\n1.1 Demonstrated knowledge of where to source accurate\ninformation on protocol for specific situations.\n1.2 Demonstrated knowledge of protocols.\n2. Underpinning\n knowledge\n2.1 • Importance and role of protocol in different events and\nsituations\n2.2 Key sources of information on protocol\n2.3 Main types of civic functions held in the Philippines\n2.4 Philippine ranking system including order of precedence,\nranks and forms of address and wearing of honors and\nmedals\n2.5 Appropriate protocols for the involvement of indigenous\npeoples and other cultural groups in events\n2.6 Correct use of national symbols including flags, anthems\nand military salutes\n2.7 Forms of address for different VIPs and dignitaries, both\nfor written correspondence and in oral communication\n2.8 Protocol procedures for different types of function including:\n2.81 Invitations to VIPs\n2.82 Arrival procedures, including for government\nofficials\n 2.83 Introduction protocols and order of speakers\n 2.84 Order of precedence for official guests\n 2.85 Seating arrangements\n 2.86 Dress styles\n3. Underpinning\n skills\n3.1 Determining the protocol information required for a\nparticular event\n3.2 Advising colleagues about protocol requirements for a\ngiven event\n3.3 Integrating protocol into event organization activities\n3.4 Liaising with protocol officers from a government\ndepartment\n3.2 Finding protocol information in relation to a totally unknown\nsituation\n3.3 Using the internet to source protocol information\n\n--- PDF PAGE 84 ---\n________________________________________________________________________________________________82\nEVENTS MANAGEMENT SERVICES NCIII Promulgated November 2007\n\n4. Resource\n implications\nThe following resources MUST be provided:\n4.1 Standard office electronic equipment\n5. Methods of\n assessment\nCompetency may be assessed through:\n5.1 Oral questions to assess knowledge of protocol for\ndifferent situations.\n5.2 Review of portfolios of evidence of on-the-job performance\nby the candidate.\n5.3 Third party workplace reports of on-the-job performance by\nthe candidate.\n6. Context for\n assessment\n6.1 Competency assessment may occur in workplace or any\nappropriately simulated environment.\n6.2 Assessment may be performed on multiple occasions\ninvolving a combination of direct, indirect and\nsupplementary forms of evidence.\n\n--- PDF PAGE 85 ---\n________________________________________________________________________________________________83\nEVENTS MANAGEMENT SERVICES NCIII Promulgated November 2007"
