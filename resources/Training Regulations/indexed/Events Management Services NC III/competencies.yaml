                "text": "Necessary adjustments are made and agreed to with the contractors."
              },
              {
                "number": "2.3",
                "text": "All aspects of the event or meeting set up are checked against the pre-arranged agreements."
              },
              {
                "number": "2.4",
                "text": "Venue space and set up of equipment are checked to allow for easy access, especially for those with disabilities, and to avoid risk of injury to guests, delegates and colleagues."
