                "number": "3.4",
                "text": "Customer is liaised with throughout the meeting or event to ensure it is progressing to his/her satisfaction."
              },
              {
                "number": "3.5",
                "text": "All contractors are liaised with on an ongoing basis to ensure effective delivery of services."
