          "source_text": "1. Critical aspects of\n competency\nAssessment requires evidences that the candidate:\n1.1 Demonstrated ability to develop a concept and format that\nreflects event objectives.\n1.2 Demonstrated ability to develop concept that is\noperationally practical and which results in the achievement\nof objectives.\n1.3 Demonstrated knowledge of typical formats for different\nstyles of events.\n1.4 Demonstrated knowledge of the creative options to be\nconsidered when developing an event concept.\n2. Underpinning\n knowledge\n2.1. Key stakeholders for different types of events\n2.2. Internal and external factors to be considered when\ndeveloping an event concept\n2.3. Key management issues that impact on development of an\nevent concept\n2.4. Creative options for different types of event\n3. Underpinning\n skills\n3.1 Completing and reporting on an internal research process\nto determine key factors affecting a corporate event\n3.2 Developing concept, theme and format proposals for\npresentation to an event organizing committee\n3.3 Liaising with multiple potential contractors to develop an\nevent concept within a very short timeframe\n3.4 Coordinating a brainstorming session to develop the\ncreative elements of an event\n3.5 Estimating costs for particular concepts and formats\n3.6 Developing a solution to a situation where the event\nprincipal’s desire for a particular creative component does\nnot fit with the overall concept\n3.7 Using computer software to develop an animated\npresentation on an event concept\n4. Resource\n implications\nThe following resources MUST be provided:\n4.1 Standard office electronic equipment\n4.2 Event brief and requirements\n4.3 Access to and interaction with event industry suppliers\n4.4 Involvement of and interaction with an event principal or\norganizing group\n\n--- PDF PAGE 53 ---\n________________________________________________________________________________________________51\nEVENTS MANAGEMENT SERVICES NCIII Promulgated November 2007\n\n5. Methods of\n assessment\nCompetency may be assessed through:\n5.1 • Evaluation of concept through a review of candidate’s\noutput/s.\n5.2 Oral questions to assess knowledge of the range of key\nmarket factors and management issues to be considered in\nthe concept development phase.\n5.3 • Review of portfolios of evidence and third-party workplace\nreports of on-the-job performance by the candidate.\n6. Context for\n assessment\n6.1 Competency assessment may occur in workplace or any\nappropriately simulated environment\n6.2 Assessment may be performed on multiple occasions\ninvolving a combination of direct, indirect and\n supplementary forms of evidence.\n\n--- PDF PAGE 54 ---\n________________________________________________________________________________________________52\nEVENTS MANAGEMENT SERVICES NCIII Promulgated November 2007\n\nUNIT OF COMPETENCY: DEVELOP EVENT PROGRAM\n\nUNIT CODE\n :"
        },
        "source_text": "TRS342316\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills, behavior and\nmotivations required to develop the overall concept, theme\nand format for a major event comprising multiple\ncomponents. An event manager would generally undertake\nthis process at the commencement of the event\nmanagement cycle in consultation with the stakeholders,\nincluding PR/advertising people. Sometimes the concept\ndevelopment phase is undertaken as part of the bidding\nprocess.\n\nELEMENT\n\nPERFORMANCE CRITERIA\nBold and italicized terms are elaborated in the\nRange of Variables\n1. Identify overall event\nobjectives and scope\n1.1. Key objectives and components of the event\nare identified, clarified and agreed in consultation\nwith the stakeholder.\n1.2. Key information is analyzed and stakeholders are\nconsulted to determine the scope of the event.\n1.3. Internal and external factors which may impact\non the event are analyzed.\n2. Establish event concept\ntheme and format\n2.1. Overall event concept, theme and format are\ndeveloped which reflect key objectives and meet\nthe needs of the potential audience.\n2.2. Creative elements are incorporated into the event\nconcept and theme.\n2.3. Operational practicality and cohesiveness of the\nconcept, theme and format are verified through\nconsultation and analysis.\n2.4. Summary of key logistical requirements is\ndeveloped based on the overall concept, theme\nand format.\n2.5. Accurate and complete information on the\nconcept, theme, and format are provided to all\nrelevant stakeholders to facilitate timely and\neffective planning and implementation.\n2.6. Approval from relevant stakeholders is obtained\nprior to implementation.\n\n--- PDF PAGE 50 ---\n________________________________________________________________________________________________48\nEVENTS MANAGEMENT SERVICES NCIII Promulgated November 2007\n\nRANGE OF VARIABLES\n\nVARIABLE\n\nRANGE\n\n1. Key objectives and\ncomponents of the event\nMay include but are not limited to:\n1.1 Multiple contractors\n1.2 Substantial catering (not simply afternoon snacks)\n1.3 Multiple speakers, performers or exhibitors\n1.4 Requirement for display, decoration or theming\n2. Stakeholder\nMay include but is not limited to:\n2.1 Event principal\n2.2 Local community\n2.3 Organizing committees\n2.4 Local authorities\n2.5 Customers\n2.6 Colleagues\n2.7 Staging contractors\n2.8 Entertainers\n3. Scope\nMay include but is not limited to:\n3.1 Theme/Motif of Event\n3.2 Size and number of guests/delegates\n3.3 Audience/participant needs\n3.4 Location(s)\n3.5 Duration\n3.6 Financial investment and other resourcing issues\n\n--- PDF PAGE 51 ---\n________________________________________________________________________________________________49\nEVENTS MANAGEMENT SERVICES NCIII Promulgated November 2007\n\nVARIABLE\n\nRANGE\n\n4. Internal and external factors\nMay include but are not limited to:\n4.1 Resource availability (e.g. human, financial,\nphysical)\n4.2 Potential for attraction of additional resources\n(e.g. sponsorship, co-hosting)\n4.3 Level of management commitment\n4.4 Restrictions on lead time\n4.5 Potential levels of participation and interest\n4.6 Competitive environment\n4.7 Timing and duration factors (e.g. impact of public\nholidays and other public events)\n4.8 Potential contributors\n4.9 Talent requirements\n4.10 Climate\n4.11 Access factors\n4.12 Marketing and promotional issues (e.g.\npotential for media coverage)\n 5. Key logistical requirements\nMay include but are not limited to:\n5.1 Venue decoration\n5.2 Talent\n5.3 Stage set-up and design\n5.4 Catering\n5.5 Technical effects (e.g. sound, lighting, audio-\nvisual)\n5.6 Collateral materials\n\n--- PDF PAGE 52 ---\n________________________________________________________________________________________________50\nEVENTS MANAGEMENT SERVICES NCIII Promulgated November 2007\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\n competency\nAssessment requires evidences that the candidate:\n1.1 Demonstrated ability to develop a concept and format that\nreflects event objectives.\n1.2 Demonstrated ability to develop concept that is\noperationally practical and which results in the achievement\nof objectives.\n1.3 Demonstrated knowledge of typical formats for different\nstyles of events.\n1.4 Demonstrated knowledge of the creative options to be\nconsidered when developing an event concept.\n2. Underpinning\n knowledge\n2.1. Key stakeholders for different types of events\n2.2. Internal and external factors to be considered when\ndeveloping an event concept\n2.3. Key management issues that impact on development of an\nevent concept\n2.4. Creative options for different types of event\n3. Underpinning\n skills\n3.1 Completing and reporting on an internal research process\nto determine key factors affecting a corporate event\n3.2 Developing concept, theme and format proposals for\npresentation to an event organizing committee\n3.3 Liaising with multiple potential contractors to develop an\nevent concept within a very short timeframe\n3.4 Coordinating a brainstorming session to develop the\ncreative elements of an event\n3.5 Estimating costs for particular concepts and formats\n3.6 Developing a solution to a situation where the event\nprincipal’s desire for a particular creative component does\nnot fit with the overall concept\n3.7 Using computer software to develop an animated\npresentation on an event concept\n4. Resource\n implications\nThe following resources MUST be provided:\n4.1 Standard office electronic equipment\n4.2 Event brief and requirements\n4.3 Access to and interaction with event industry suppliers\n4.4 Involvement of and interaction with an event principal or\norganizing group\n\n--- PDF PAGE 53 ---\n________________________________________________________________________________________________51\nEVENTS MANAGEMENT SERVICES NCIII Promulgated November 2007\n\n5. Methods of\n assessment\nCompetency may be assessed through:\n5.1 • Evaluation of concept through a review of candidate’s\noutput/s.\n5.2 Oral questions to assess knowledge of the range of key\nmarket factors and management issues to be considered in\nthe concept development phase.\n5.3 • Review of portfolios of evidence and third-party workplace\nreports of on-the-job performance by the candidate.\n6. Context for\n assessment\n6.1 Competency assessment may occur in workplace or any\nappropriately simulated environment\n6.2 Assessment may be performed on multiple occasions\ninvolving a combination of direct, indirect and\n supplementary forms of evidence.\n\n--- PDF PAGE 54 ---\n________________________________________________________________________________________________52\nEVENTS MANAGEMENT SERVICES NCIII Promulgated November 2007\n\nUNIT OF COMPETENCY: DEVELOP EVENT PROGRAM\n\nUNIT CODE\n :"
