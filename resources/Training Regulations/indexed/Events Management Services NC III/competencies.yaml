                "number": "2.6",
                "text": "Additional on-site staff are briefed on the full details of the meeting or event operation including communication and control mechanisms. --- PDF PAGE 70 --- ________________________________________________________________________________________________68 EVENTS MANAGEMENT SERVICES NCIII Promulgated November 2007 Bold and italicized terms are elaborated in the Range of Variables"
