        "evidence_guide": {
          "source_text": "1. Critical aspects of\n competency\nAssessment requires evidences that the candidate:\n1.1 Researched evaluated and selected an appropriate venue\nor site for a nominated event comprising multiple\ncomponents.\n1.2 Interpreted the range of information used in the venue and\nsite selection process.\n1.3 Demonstrated knowledge of the different venue and site\noptions within the local area.\n2. Underpinning\n knowledge\n2.1 Different styles of venues and sites, services offered and\ntheir suitability for particular event types\n2.2 Venue and site options within a given locality\n2.3 Presentation styles for venue and site information and\ninterpretation of this information\n2.4 Sources for information on venue and site\n2.5 • Features and requirements of a typical venue or site\ncontracts\n2.6 • Typical operational structures within a venue including\nrelevant personnel, internal networks and interrelationships\nand reporting structures.\n3. Underpinning\n skills\n3.1 Analyzing information from a range of venues or sites and\nassessing suitability\n3.2 Developing an event specification document\n3.3 Selecting and booking venues for an event\n3.4 Running a venue sub-committee meeting to assess venue\noptions\n3.5 Calculating floor space requirements for a given event\n3.6 Adjusting venues and dates when venue availability is\nlimited\n4. Resource\n implications\nThe following resources MUST be provided:\n4.1 Office equipment and material, including equipment for\noral and visual presentations\n4.2 Venue/site selection process for an event which becomes\nan event managed by the candidate\n4.3 Access to venues and sites relevant to different types of\nevents\n4.4 Current industry documentation and publications relating to\nvenues and sites\n4.5 Access to and liaison with venue personnel during the\nselection process\n4.6 Involvement of and consultation with event stakeholders\n\n--- PDF PAGE 63 ---\n________________________________________________________________________________________________61\nEVENTS MANAGEMENT SERVICES NCIII Promulgated November 2007\n\n5. Methods of\n assessment\nCompetency may be assessed through:\n5.1 Oral questioning/Interview\n5.2 Evaluation of candidate’s output/s showing documentation\nand specifications.\n5.3 Third-party workplace reports of on-the-job performance\nby the candidate.\n6. Context for\n assessment\n6.1 Competency assessment may occur in workplace or any\nappropriately simulated environment\n6.2 Assessment may be performed on multiple occasions\ninvolving a combination of direct, indirect and\nsupplementary forms of evidence.\n\n--- PDF PAGE 64 ---\n________________________________________________________________________________________________62\nEVENTS MANAGEMENT SERVICES NCIII Promulgated November 2007\n\nUNIT OF COMPETENCY : DEVELOP AND UPDATE EVENT INDUSTRY\n KNOWLEDGE\n\nUNIT CODE\n\n :"
        },
        "source_text": "TRS342318\nUNIT DESCRIPTOR\n: This unit covers the knowledge, skills, behavior and\nmotivations required to undertake the venue/site selection\nprocess for a major event comprising multiple components.\nIt requires the application of significant analytical and\nresearch skills to complete the process of matching an\nevent to a particular site or venue.\n\nELEMENT\n\nPERFORMANCE CRITERIA\nBold and italicized terms are elaborated in the Range of\nVariables\n1. Analyze venue or site\nrequirements\n1.1 Event-specific venue or site requirements are\nanalyzed based on detailed review of all aspects\nof the proposed event, including multiple\ncomponents.\n1.2 Accurate and complete venue or site\nspecifications are developed to facilitate the\nresearch process.\n1.3 Needs of all stakeholders, including those with\ndisabilities, are integrated into venue or site\nspecifications.\n2. Source event venues or sites\n2.1 Potential venues or sites are researched, using\nappropriate information sources and research\nmethods.\n2.2 Suitability of venues or sites is assessed based\non comparison of services offered with\nspecifications.\n2.3 Need for and the nature of contingency planning\nrequired by specific venues or sites are assessed.\n2.4 Venue or site capacity to deliver quality outcomes\nin relation to customer service, cooperative\nmanagement, and past experience is assessed.\n2.5 Negotiation and liaising with personnel from\npotential venues or sites are undertaken to\nensure all event requirements can be met and to\naddress potential problem areas.\n2.6 Need for tentative bookings is assessed and\nprompt action is taken.\n2.7 Multiple site and venue selection is coordinated in\na logical manner when required.\n\n--- PDF PAGE 59 ---\n________________________________________________________________________________________________57\nEVENTS MANAGEMENT SERVICES NCIII Promulgated November 2007\n\nELEMENT\n\nPERFORMANCE CRITERIA\nBold and italicized terms are elaborated in the Range of\nVariables\n2.8 Clear and accurate briefings on venue or site\noptions are provided to colleagues and key\nstakeholders to include recommendations and\nrationale.\n3. Confirm venue or site\narrangements\n3.1 Venue or site arrangements are accurately\nconfirmed in writing when the selection process is\nfinalized.\n3.2 Venue or site contracts are reviewed and signed\nwithin appropriate timeframes and within the\nscope of individual responsibility.\n3.3 Specific venue and site planning issues are\nintegrated into overall event management\nsystems promptly.\n\n--- PDF PAGE 60 ---\n________________________________________________________________________________________________58\nEVENTS MANAGEMENT SERVICES NCIII Promulgated November 2007\n\nRANGE OF VARIABLES\n\nVARIABLE\n\nRANGE\n1. Aspects\nMay include but are not limited to:\n1.1 Overall theme and image\n1.2 Estimated numbers\n1.3 Facilities and services to be provided\n1.4 Budget\n1.5 Audience/delegate profile and location\n2. Multiple components\nMay include but are not limited to:\n2.1 Multiple contractors\n2.2 Substantial catering (i.e. not simply afternoon\nsnacks)\n2.3 Multiple speakers, performers or exhibitors\n2.4 Requirement for display, decoration or theming\n3. Venue or site specifications\nMay include but are not limited to:\n3.1 Availability\n3.2 Facilities and services (e.g. catering, size of area,\nprotection from the elements, equipment)\n3.3 Staging\n3.4 Capacity\n3.5 Budget parameters\n3.6 Entry and exit points\n3.7 Access and timing (set-up and breakdown)\n4. Stakeholders\nMay include but are not limited to:\n4.1 Attendees/delegates/guests\n4.2 Host organization\n4.3 Contractors/suppliers\n4.4 Sponsors\n4.5 Emergency services\n4.6 Regulatory authorities\n\n--- PDF PAGE 61 ---\n________________________________________________________________________________________________59\nEVENTS MANAGEMENT SERVICES NCIII Promulgated November 2007\n\nVARIABLE\n\nRANGE\n5. Information sources\nMay include but are not limited to:\n5.1 Local/regional/municipal tourism organizations\n5.2. Philippine Convention and Visitors Corporation\n(PCVC)\n5.3 Venue publications and directories\n5.4 Destination brochures\n5.5 Trade journals\n5.6 Internet\n6. Research methods\nMay include but are not limited to:\n6.1 Using personal event industry networks\n6.2 Desk research\n6.3 Calling for tenders\n6.4 Personal venue or site inspection\n\n--- PDF PAGE 62 ---\n________________________________________________________________________________________________60\nEVENTS MANAGEMENT SERVICES NCIII Promulgated November 2007\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\n competency\nAssessment requires evidences that the candidate:\n1.1 Researched evaluated and selected an appropriate venue\nor site for a nominated event comprising multiple\ncomponents.\n1.2 Interpreted the range of information used in the venue and\nsite selection process.\n1.3 Demonstrated knowledge of the different venue and site\noptions within the local area.\n2. Underpinning\n knowledge\n2.1 Different styles of venues and sites, services offered and\ntheir suitability for particular event types\n2.2 Venue and site options within a given locality\n2.3 Presentation styles for venue and site information and\ninterpretation of this information\n2.4 Sources for information on venue and site\n2.5 • Features and requirements of a typical venue or site\ncontracts\n2.6 • Typical operational structures within a venue including\nrelevant personnel, internal networks and interrelationships\nand reporting structures.\n3. Underpinning\n skills\n3.1 Analyzing information from a range of venues or sites and\nassessing suitability\n3.2 Developing an event specification document\n3.3 Selecting and booking venues for an event\n3.4 Running a venue sub-committee meeting to assess venue\noptions\n3.5 Calculating floor space requirements for a given event\n3.6 Adjusting venues and dates when venue availability is\nlimited\n4. Resource\n implications\nThe following resources MUST be provided:\n4.1 Office equipment and material, including equipment for\noral and visual presentations\n4.2 Venue/site selection process for an event which becomes\nan event managed by the candidate\n4.3 Access to venues and sites relevant to different types of\nevents\n4.4 Current industry documentation and publications relating to\nvenues and sites\n4.5 Access to and liaison with venue personnel during the\nselection process\n4.6 Involvement of and consultation with event stakeholders\n\n--- PDF PAGE 63 ---\n________________________________________________________________________________________________61\nEVENTS MANAGEMENT SERVICES NCIII Promulgated November 2007\n\n5. Methods of\n assessment\nCompetency may be assessed through:\n5.1 Oral questioning/Interview\n5.2 Evaluation of candidate’s output/s showing documentation\nand specifications.\n5.3 Third-party workplace reports of on-the-job performance\nby the candidate.\n6. Context for\n assessment\n6.1 Competency assessment may occur in workplace or any\nappropriately simulated environment\n6.2 Assessment may be performed on multiple occasions\ninvolving a combination of direct, indirect and\nsupplementary forms of evidence.\n\n--- PDF PAGE 64 ---\n________________________________________________________________________________________________62\nEVENTS MANAGEMENT SERVICES NCIII Promulgated November 2007\n\nUNIT OF COMPETENCY : DEVELOP AND UPDATE EVENT INDUSTRY\n KNOWLEDGE\n\nUNIT CODE\n\n :"
