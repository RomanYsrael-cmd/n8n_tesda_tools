        "evidence_guide": {
          "source_text": "1. Critical aspects of\n competency\nAssessment requires evidences that the candidate:\n1.1 Demonstrated ability to undertake the proposal/bidding\nprocess for a specific meeting/event, including effective\nassessment of the event brief, coordination of all details\nand resources to meet the bid requirements and\nprofessional presentation of bid materials and\ndocuments.\n1.2 Demonstrated knowledge of typical bid/proposal\nrequirements and formats.\n2. Underpinning\n knowledge\n2.1 Components required for meeting/event proposals and\nbids and product knowledge in relation to those\ncomponents\n2.2 Networks and interrelationships of different industry\nsectors in relation to meeting/event proposal/bids\n2.3 Presentation techniques for proposal and bid materials,\nincluding current technology\n3. Underpinning\n skills\n3.1 Assessing quotes and product information from suppliers\nto make an effective selection\n3.2 Creating an effective presentation format for the bid\ndocument\n3.3 Allocating responsibilities to team members and\nmonitoring progress on bid preparations\n3.4 Running team meetings to monitor progress\n3.5 Making cost estimates for inclusion in the bid document\n3.6 Creating a proposal from scratch within an extremely\nshort timeframe\n3.7 Designing an animated computer presentation\n4. Resource\n implications\nThe following resources MUST be provided:\n4.1 Bid documents, event brief and/or case studies relevant\nto events planning and bidding\n4.2 Office equipment and materials, including equipment for\noral and visual presentations\n4.3 Liaison with the customer and potential suppliers\n\n--- PDF PAGE 48 ---\n________________________________________________________________________________________________46\nEVENTS MANAGEMENT SERVICES NCIII Promulgated November 2007\n\n5. Methods of\n assessment\nCompetency may be assessed through:\n5.1 Oral questioning or interview\n5.2 Review of portfolios of evidence of on-the-job\nperformance by the candidate\n5.3 Third-party workplace reports of on-the-job performance\nby the candidate\n6. Context for\n assessment\n6.1 Competency assessment may occur in workplace or any\nappropriately simulated environment\n6.2 Assessment may be performed on multiple occasions\ninvolving a combination of direct, indirect and\nsupplementary forms of evidence.\n\n--- PDF PAGE 49 ---\n________________________________________________________________________________________________47\nEVENTS MANAGEMENT SERVICES NCIII Promulgated November 2007\n\nUNIT OF COMPETENCY: DEVELOP AN EVENT CONCEPT\n\nUNIT CODE\n :"
        },
        "source_text": "TRS342315\n\nUNIT DESCRIPTOR\n: This unit covers the knowledge, skills, behavior and\nmotivations required to plan and develop proposals and\nbids for the staging of meetings and events. Depending on\nthe context, this role could be performed by a wide range of\nindividuals including event managers, local or regional\ntourism managers,\nvenue managers and\nmarketing\nmanagers.\n\nELEMENT\nPERFORMANCE CRITERIA\nBold and italicized terms are elaborated in the\nRange of Variables\n1. Interpret event brief\n1.1 Contents of the event brief are accurately\ninterpreted and the company’s capacity to\nmeet stated requirements is assessed.\n1.2 Action required for the development of the\nproposal or bid is identified and planned.\n1.3 Liaison with customer is undertaken to\nclarify requirements when appropriate.\n2. Develop proposal and bid details\n\n2.1 Details for inclusion in the proposal/bid are\ndeveloped after consultation with suppliers\nand other relevant agencies.\n2.2 Options to meet and, where possible,\nexceed the expectations of the customer\nare developed, including integration of\ncurrent and emerging technology.\n2.3 Possible competitors are evaluated and\nstrategies to address competitive issues are\ndeveloped.\n3. Develop bid materials\n3.1 Bid materials are prepared within the\ndesignated time lines in accordance with\nthe requirements of the brief.\n3.2 Materials are presented in a format that\nmaximizes the use of presentation and\npromotional techniques.\n\n--- PDF PAGE 45 ---\n________________________________________________________________________________________________43\nEVENTS MANAGEMENT SERVICES NCIII Promulgated November 2007\n\nELEMENT\nPERFORMANCE CRITERIA\nBold and italicized terms are elaborated in the\nRange of Variables\n4. Submit or present the bid or\nproposal on time\n4.1 The proposal/bid is delivered within the\nprescribed time line.\n4.2 Proposal/bid presentation is conducted with\nmaximum visual/retention impact.\n\n--- PDF PAGE 46 ---\n________________________________________________________________________________________________44\nEVENTS MANAGEMENT SERVICES NCIII Promulgated November 2007\n\nRANGE OF VARIABLES\n\nVARIABLE\n\nRANGE\n\n1. Details\n May include but are not limited to:\n1.1\nGeneral concepts and themes\n1.2\nBusiness program / Conference program\n1.3\nSocial program\n1.4\nCosts\n1.5\nTouring (Pre-and post-tours, spouse program)\n1.6\nAccommodation\n1.7\nEntertainment\n1.8\nStaging\n1.9\nSpecial features\n1.10 Sample promotional materials\n1.11 References and details of other successful\nundertakings\n1.12 Company information (e.g. structure, personnel)\n1.13 Support statements, endorsement from previous\nclients\n1.14 Approach to environmental impacts and issues\n1.15 Proposals relating to use of technology\n\n--- PDF PAGE 47 ---\n________________________________________________________________________________________________45\nEVENTS MANAGEMENT SERVICES NCIII Promulgated November 2007\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\n competency\nAssessment requires evidences that the candidate:\n1.1 Demonstrated ability to undertake the proposal/bidding\nprocess for a specific meeting/event, including effective\nassessment of the event brief, coordination of all details\nand resources to meet the bid requirements and\nprofessional presentation of bid materials and\ndocuments.\n1.2 Demonstrated knowledge of typical bid/proposal\nrequirements and formats.\n2. Underpinning\n knowledge\n2.1 Components required for meeting/event proposals and\nbids and product knowledge in relation to those\ncomponents\n2.2 Networks and interrelationships of different industry\nsectors in relation to meeting/event proposal/bids\n2.3 Presentation techniques for proposal and bid materials,\nincluding current technology\n3. Underpinning\n skills\n3.1 Assessing quotes and product information from suppliers\nto make an effective selection\n3.2 Creating an effective presentation format for the bid\ndocument\n3.3 Allocating responsibilities to team members and\nmonitoring progress on bid preparations\n3.4 Running team meetings to monitor progress\n3.5 Making cost estimates for inclusion in the bid document\n3.6 Creating a proposal from scratch within an extremely\nshort timeframe\n3.7 Designing an animated computer presentation\n4. Resource\n implications\nThe following resources MUST be provided:\n4.1 Bid documents, event brief and/or case studies relevant\nto events planning and bidding\n4.2 Office equipment and materials, including equipment for\noral and visual presentations\n4.3 Liaison with the customer and potential suppliers\n\n--- PDF PAGE 48 ---\n________________________________________________________________________________________________46\nEVENTS MANAGEMENT SERVICES NCIII Promulgated November 2007\n\n5. Methods of\n assessment\nCompetency may be assessed through:\n5.1 Oral questioning or interview\n5.2 Review of portfolios of evidence of on-the-job\nperformance by the candidate\n5.3 Third-party workplace reports of on-the-job performance\nby the candidate\n6. Context for\n assessment\n6.1 Competency assessment may occur in workplace or any\nappropriately simulated environment\n6.2 Assessment may be performed on multiple occasions\ninvolving a combination of direct, indirect and\nsupplementary forms of evidence.\n\n--- PDF PAGE 49 ---\n________________________________________________________________________________________________47\nEVENTS MANAGEMENT SERVICES NCIII Promulgated November 2007\n\nUNIT OF COMPETENCY: DEVELOP AN EVENT CONCEPT\n\nUNIT CODE\n :"
      }
