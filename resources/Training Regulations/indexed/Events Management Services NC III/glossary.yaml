  "source_text": "1. BID – a price proposed in exchange for events management services\n\n2. CATERING – the business of providing food and food service at a remote site\n\n3. CONTRACTOR - a person, business or corporation which provides goods or\nservices to another entity under terms specified in a contract\n\n4. EGRESS – human evacuation of a building during an emergency\n\n5. EVENT - refers to a social gathering or activity, such as a festival, ceremony,\ncompetition, party, convention or meeting\n\n6. EVENT MANAGEMENT - the application of the management science of\nproject management to the creation and development of festivals and events.\nIt involves identifying the target audience, devising the event concept, planning\nthe logistics and coordinating the technical aspects before actually executing\nthe modalities of the proposed event.\n\n7. PCVC – Philippine Convention and Visitors Corporation\n\n8. PROPOSAL - a business proposition\n\n9. PROTOCOL - a rule which guides how an activity should be performed,\nespecially in the field of diplomacy. In the diplomatic and government fields of\nendeavor protocols are often unwritten guidelines. Protocols specify the proper\nand generally-accepted behavior in matters of state and diplomacy, such as\nshowing appropriate respect to a head of state, ranking diplomats in\nchronological order of their accreditation at court, and so on.\n\n10. RISK MANAGEMENT - the process of measuring, or assessing, risk that may stem\nfrom natural disasters, fire or accidents, and developing strategies to manage it.\nStrategies include transferring the risk to another party, avoiding the risk, reducing\nthe negative effect of the risk, and accepting some or all of the consequences of a\nparticular risk.\n\n11. SPONSOR – the individual or group that provides support to an event, whether\nfinancially or through the provision of products or services\n\n--- PDF PAGE 97 ---\n_____________________________________________________________________