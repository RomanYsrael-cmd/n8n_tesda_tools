  "source_text": "SECTION 4 NATIONAL ASSESSMENT AND CERTIFICATION\n ARRANGEMENTS\n\n4.1\nTo attain the National Qualification of EVENTS MANAGEMENT\nSERVICES NC III, the candidate must demonstrate competence in all the\nunits of competency listed in Section l. Successful candidates shall be\nawarded a National Certificate signed by the TESDA Director General.\n\n4.2\nIndividuals aspiring to be awarded the qualification of EVENTS\nMANAGEMENT SERVICES NC III must acquire Certificates of\nCompetency in all the following groups/cluster of core units of the\nQualification. Candidates may apply for assessment in any accredited\nassessment center.\n\n4.2.1 Event Planning Services\n\n4.1.1.1 Plan and develop event proposal and bid\n4.1.1.2 Develop an event concept\n4.1.1.3 Develop event program\n4.1.1.4 Select event venue and site\n4.1.1.5 Develop and update event industry knowledge\n\n4.2.2 On-Site Event Management Services\n\n4.2.2.1 Provide on-site event management services\n4.2.2.2 Manage contractors for indoor events\n4.2.2.3 Develop and update knowledge on protocol\n\n Successful candidates shall be awarded Certificates of Competency\n(COC).\n\n4.3\nAfter accumulation and submission of all COCs acquired for the relevant\nunits of competency comprising a qualification, an individual shall be\nissued the corresponding National Certificate.\n\n4.4\nAssessment shall focus on the core units of competency. The basic and\ncommon units shall be integrated or assessed concurrently with the core\nunits.\n\n--- PDF PAGE 94 ---\n________________________________________________________________________________________________92\nEVENTS MANAGEMENT SERVICES NCIII Promulgated November 2007\n\n4.5\nThe following are qualified to apply for assessment and certification:\n\n4.5.1 Graduates of formal, non-formal and informal including\n enterprise-based training programs.\n\n4.5.2 Experienced Workers (wage employed or self-employed)\n\n4.6\nThe guidelines on assessment and certification are discussed in detail in\nthe \"Procedures Manual on Assessment and Certification\" and \"Guidelines\non the Implementation of the Philippine TVET Qualification and\nCertification System (PTQCS)\".\n\n--- PDF PAGE 95 ---\n________________________________________________________________________________________________93\nEVENTS MANAGEMENT SERVICES NCIII Promulgated November 2007\n\nCOMPETENCY MAP - TOURISM Sector\nEVENTS MANAGEMENT SERVICES NC III\nANNEX A\nCollect,\nanalyze and\norganize\ninformation\nPlan and\norganize work\nPromote\nenvironmental\nprotection\nUtilize\nspecialized\ncommunication\nskills\nDevelop teams\nand individuals\nApply problem-\nsolving\ntechniques in\nthe workplace\nUse\nmathematical\nconcepts and\ntechniques\nUse relevant\ntechnologies\nLead small\nteams\nDevelop and\npractice\nnegotiation\nskills\nSolve\nproblems\nrelated to work\nactivities\nPractice career\nprofessionalism\nPractice\noccupational\nhealth and safety\npractices\nLead\nworkplace\ncommunication\nParticipate in\nworkplace\ncommunication\nWork in team\nenvironment\nRoster staff\nControl and\norder stock\nPerform\ncomputer\noperations\nPerform\nworkplace and\nsafety practices\nProvide\neffective\ncustomer\nservice\nDevelop and\nupdate\nindustry\nknowledge\nObserve\nworkplace\nhygiene\nprocedures\n\nBASIC\nCOMPETENCIES\nCOMMON\nCOMPETENCIES\nCORE\nCOMPETENCIES\nEstablish and\nconduct\nbusiness\nrelationships\nTrain small\ngroups\nConduct\nassessment\nManage\nworkplace\ndiversity\nManage\nfinances within\na budget\nManage\nquality\ncustomer\nservice\n\nDevelop an\nevent concept\nDevelop event\nprogram\nSelect event\nvenue and site\nProvide porter\nservices\nPlan and develop\nevent proposal\nand bid\nConduct night\naudit\nProvide club\nreception\nservices\nManage\ncontractors for\nindoor events\nDevelop and\nupdate\nknowledge on\nprotocol\nProvide on-site\nevent\nmanagement\nservices\nDevelop and\nupdate event\nindustry\nknowledge\n\nAccompany and\nguide visitors in\naccordance with\nthe tour itinerary\nReceive and\nprocess\nreservations\nOperate\ncomputerized\nreservations\nsystem\nIssue air sea\nland tickets and\nmulti-purpose\ndocuments\nResearch\ninformation\nrelevant to tour\nitinerary\nBook travel-\nrelated\nreservation\nAdminister\nbilling and\nsettlement\nplan\nProvide\naccommodation\nreception\nservices\nManage\narrangements for\nvisitors\n\n--- PDF PAGE 96 ---\n________________________________________________________________________________________________94\nEVENTS MANAGEMENT SERVICES NCIII Promulgated November 2007\n\nDEFINITION OF TERMS\n\n1. BID – a price proposed in exchange for events management services\n\n2. CATERING – the business of providing food and food service at a remote site\n\n3. CONTRACTOR - a person, business or corporation which provides goods or\nservices to another entity under terms specified in a contract\n\n4. EGRESS – human evacuation of a building during an emergency\n\n5. EVENT - refers to a social gathering or activity, such as a festival, ceremony,\ncompetition, party, convention or meeting\n\n6. EVENT MANAGEMENT - the application of the management science of\nproject management to the creation and development of festivals and events.\nIt involves identifying the target audience, devising the event concept, planning\nthe logistics and coordinating the technical aspects before actually executing\nthe modalities of the proposed event.\n\n7. PCVC – Philippine Convention and Visitors Corporation\n\n8. PROPOSAL - a business proposition\n\n9. PROTOCOL - a rule which guides how an activity should be performed,\nespecially in the field of diplomacy. In the diplomatic and government fields of\nendeavor protocols are often unwritten guidelines. Protocols specify the proper\nand generally-accepted behavior in matters of state and diplomacy, such as\nshowing appropriate respect to a head of state, ranking diplomats in\nchronological order of their accreditation at court, and so on.\n\n10. RISK MANAGEMENT - the process of measuring, or assessing, risk that may stem\nfrom natural disasters, fire or accidents, and developing strategies to manage it.\nStrategies include transferring the risk to another party, avoiding the risk, reducing\nthe negative effect of the risk, and accepting some or all of the consequences of a\nparticular risk.\n\n11. SPONSOR – the individual or group that provides support to an event, whether\nfinancially or through the provision of products or services\n\n--- PDF PAGE 97 ---\n________________________________________________________________________________________________95\nEVENTS MANAGEMENT SERVICES NCIII Promulgated November 2007\n\nACKNOWLEDGMENTS\n\nThe Technical Education and Skills Development Authority (TESDA) wishes\nto extend thanks and appreciation to the many representatives of business, industry,\nacademe and government agencies who donated their time and expertise to the\ndevelopment and validation of these Training Regulations.\n\n TOURISM INDUSTRY BOARD FOUNDATION, INC. (TIBFI) - EXECUTIVE\n COMMITTEE\n\nMR. DANIEL L. EDRALIN\nChairman\n\nSEC. AUGUSTO BOBOY SYJUCO\nTrustee\nDirector General, TESDA\n\nMR. HUMPHREY O’LEARY\nDeputy Chairman\n\nATTY. MA. VICTORIA V. JASMIN\nTrustee\n\nMR. PAUL LIM SO\nTreasurer\n\nDR. IGNACIO S. PABLO\nExecutive Director\n\nDR. CORAZON R. RODRIGUEZ\nSecretary\n\nINDUSTRY WORKING GROUP (IWG)\n\nMR. HUMPHREY O’LEARY\nMS. ANABELLE MORENO\nCo-Chairs\nIndustry Working Committee\n\nMR. BIENVENIDO CLARAVALL\nAssessment and Certification\nSub-Committee\n\nMS. SYLVIA SANGCO\nChair, Planning Sub-Committee\n\nAdvocacy Sub-Committee\n\nMS. YAEL FERNANDEZ\nMS. SUSAN EDILO\nStandards Development Sub-Committee\n\nVIC ALCUAZ\nPlacement Sub-Committee\n\nMR. SANTOS BUENVENIDA\nENGR. EVELYN PANTIG\nProfessional and Programs Development Sub-\nCommittee\n\n--- PDF PAGE 98 ---\n________________________________________________________________________________________________96\nEVENTS MANAGEMENT SERVICES NCIII Promulgated November 2007\n\nIWG - EXPERTS\n\nEVENTS MANAGEMENT\n\nMR. BIENVENIDO CLARAVALL\nUniversity of the Philippines – Asian\nInstitute of Tourism\n\nMS. HAZEL ANCHETA-JOVER\nWedding Talks\nMS. ELOISA A. ROMERO\nPhilippine Convention and Visitors\nCorporation\nMS. CLAIRE PESEBRE\nCP Gold Events\nMS. MA. TERESA SARABIA\nLa Fiesta Hotel\n\nThe TESDA Board Members and Secretariat\n\nThe Management and Staff of the TESDA Secretariat\n\n• QSO"
