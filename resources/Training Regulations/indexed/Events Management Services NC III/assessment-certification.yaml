  "source_text": "SECTION 4 NATIONAL ASSESSMENT AND CERTIFICATION\n ARRANGEMENTS\n\n4.1\nTo attain the National Qualification of EVENTS MANAGEMENT\nSERVICES NC III, the candidate must demonstrate competence in all the\nunits of competency listed in Section l. Successful candidates shall be\nawarded a National Certificate signed by the TESDA Director General.\n\n4.2\nIndividuals aspiring to be awarded the qualification of EVENTS\nMANAGEMENT SERVICES NC III must acquire Certificates of\nCompetency in all the following groups/cluster of core units of the\nQualification. Candidates may apply for assessment in any accredited\nassessment center.\n\n4.2.1 Event Planning Services\n\n4.1.1.1 Plan and develop event proposal and bid\n4.1.1.2 Develop an event concept\n4.1.1.3 Develop event program\n4.1.1.4 Select event venue and site\n4.1.1.5 Develop and update event industry knowledge\n\n4.2.2 On-Site Event Management Services\n\n4.2.2.1 Provide on-site event management services\n4.2.2.2 Manage contractors for indoor events\n4.2.2.3 Develop and update knowledge on protocol\n\n Successful candidates shall be awarded Certificates of Competency\n(COC).\n\n4.3\nAfter accumulation and submission of all COCs acquired for the relevant\nunits of competency comprising a qualification, an individual shall be\nissued the corresponding National Certificate.\n\n4.4\nAssessment shall focus on the core units of competency. The basic and\ncommon units shall be integrated or assessed concurrently with the core\nunits.\n\n--- PDF PAGE 94 ---\n________________________________________________________________________________________________92\nEVENTS MANAGEMENT SERVICES NCIII Promulgated November 2007\n\n4.5\nThe following are qualified to apply for assessment and certification:\n\n4.5.1 Graduates of formal, non-formal and informal including\n enterprise-based training programs.\n\n4.5.2 Experienced Workers (wage employed or self-employed)\n\n4.6\nThe guidelines on assessment and certification are discussed in detail in\nthe \"Procedures Manual on Assessment and Certification\" and \"Guidelines\non the Implementation of the Philippine TVET Qualification and\nCertification System (PTQCS)\".\n\n--- PDF PAGE 95 ---\n________________________________________________________________________________________________93\nEVENTS MANAGEMENT SERVICES NCIII Promulgated November 2007\n\n"
}
