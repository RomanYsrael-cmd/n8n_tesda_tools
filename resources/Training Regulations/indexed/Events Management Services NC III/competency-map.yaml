  "source_text": "SECTION 1 EVENTS MANAGEMENT SERVICES NC III QUALIFICATION\n\nThe EVENTS MANAGEMENT SERVICES NC III Qualification consists of\ncompetencies that a person must achieve to coordinate events, functions and/or\nconferences which may be held in conference centers, hotels, motels, restaurants,\nclubs, resorts and luxury liners. It includes competencies on event planning such as\nplanning and developing an event proposal, concept, and program, selecting a venue\nand site, and updating event industry knowledge, as well as competencies on on-site\nevent management such as providing onsite management services, managing\ncontractors and updating knowledge on protocol.\n\nThis Qualification is packaged from the competency map of the Tourism Sector\nas shown in Annex A.\n\nThe Units of Competency comprising this Qualification include the following:\n\nCODE NO.\nBASIC COMPETENCIES\n\n500311109\nLead workplace communication\n500311110\n\nLead small teams\n500311111\n\nDevelop and practice negotiation skills\n500311112\n\nSolve problems related to work activities\n500311113\n\nUse mathematical concepts and techniques\n500311114\n\nUse relevant technologies\n\nCODE NO.\nCOMMON COMPETENCIES\n\nTRS311206\nRoster staff\nTRS311207\nControl and order stock\nTRS311208\nTrain small groups\nTRS311209\nEstablish and conduct business relationships\n\n--- PDF PAGE 4 ---\n________________________________________________________________________________________________2\nEVENTS MANAGEMENT SERVICES NCIII Promulgated November 2007\n\nCODE NO.\nCORE COMPETENCIES\n\nEVENT PLANNING SERVICES\n\nTRS342315\nPlan and develop event proposal or bid\nTRS342316\nDevelop an event concept\nTRS342317\nDevelop event program\nTRS342318\nSelect event venue and site\nTRS342319\nDevelop and update event industry knowledge\n\nON-SITE EVENT MANAGEMENT SERVICES\n\nTRS342320\nProvide on-site event management services\nTRS342321\nManage contractors for indoor events\nTRS342322\nDevelop and update knowledge on protocol\n\nA person who has achieved this Qualification is competent to be a:\n\n Events Coordinator\n Conference Coordinator\n Function Coordinator\n\n--- PDF PAGE 5 ---\n________________________________________________________________________________________________3\nEVENTS MANAGEMENT SERVICES NCIII Promulgated November 2007"
}
