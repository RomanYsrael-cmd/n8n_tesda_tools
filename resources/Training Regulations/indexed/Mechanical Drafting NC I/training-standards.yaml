rvation\n•\nInterviews/\nquestioning\n\nCOMMON COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Apply safety\n practices\n\n1.1 Identify hazards\n1.2 Use protective\n clothing and devices\n1.3 Perform safe handling\n of tools, equipment\n and materials\n1.4 Perform first aid\n1.5 Use fire extinguisher\n• Lecture\n• Group\n discussion\n• Interaction\n• Role\n playing /\n Simulation\n\n• Observation\n• Demonstration\n• Interview /\n Questioning\n\n2. Interpret\nworking\ndrawing and\nsketches\n\n2.1 Interpret technical\ndrawing\n2.2 Prepare freehand\nsketch of parts\n2.3 Interpret details from\nfreehand sketch\n• Lecture\n• Group\n discussion\n• Interaction\n• Observation\n• Interview /\n Questioning\n3. Perform\n shop\n computations\n (Basic)\n3.1 Perform four\n fundamental operations\n3.2 Perform basic\n calculations involving\n fractions and decimals\n3.3 Perform basic\n calculations involving\n percentages\n3.4 Perform basic\n calculations involving\n ration and proportion\n3.5 Perform calculations on\n algebraic expressions\n• Lecture\n• Demonstration\n• Practical\n exercise\n• Demonstration\n• Observation\n• Performance\n test\n• Interview /\n Questioning\n\n--- PDF PAGE 38 ---\nechanical drafting\n11/20/07\n36\n4. Measure\n workpiece\n (Basic)\n\n4.1 Select and use\n measuring tools\n4.2 Clean and store\n measuring tools\n\n• Lecture\n• Demonstration\n• Practical\n exercise\n• Demonstration\n• Observation\n• Performance\n test\n• Interview /\n Questioning\n\nCORE COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n\n1. Prepare basic\nengineering\ndrafting\n\n1.1 Identify drawing\nrequirements\n1.2 Prepare engineering\ndrawing or make\nchanges to existing\ndrawings\n\n1.3 Prepare engineering\nparts list\n\n• Lecture/\n discussion\n• Self-paced\ninstructions\n• Demonstration\n\n• Written or oral\n\n• Demonstratio\nn\n\n2. Perform basic\nengineering\ndetail drafting\n\n2.1 Prepare assembly,\nlayout and detail\ndrawings\n2.2 Determine component\nand/or material\nrequirement and issue\napproved drawing\n\n• Lecture/\n discussion\n• Self-paced\ninstructions\n• Demonstration\n\n• Written or oral\n\n• Demonstratio\nn\n\n--- PDF PAGE 39 ---\nechanical drafting\n11/20/07\n37\n3.2 TRAINING DELIVERY\n\n The delivery of training should adhere to the design of the curriculum.\nDelivery should be guided by the 10 basic principles of Competency-Based TVET.\n\n The training is based on curriculum developed from the competency standards;\n\n Learning is modular in its structure;\n\n Training delivery is individualized and self-paced;\n\n Training is based on work that must be performed;\n\n Training materials are directly related to the competency standards and curriculum\nmodules;\n\n Assessment is based in the collection of evidence of the performance of work to the\nindustry required standard;\n\n Training is based both on and off-the –job component;\n\n Allows for the recognition of prior learning ( RPL ) or current competencies;\n\n Training allows for multiple entry and exit ; and\n\n Approved training programs are nationally accredited.\n\n--- PDF PAGE 40 ---\nechanical drafting\n11/20/07\n38\n The competency-based TVET system recognizes various types of delivery\nmodes, both on and off-the–job as long as the learning is driven by the competency\nstandards specified by the industry. The following training modalities may be adopted\nwhen designing training programs:\n\n The dualized mode of training delivery is preferred and recommended. Thus\nprograms would contain both in school and in-industry training of fieldwork\ncomponents. Details can be referred to the Dual Training System ( DTS )\nImplementing Rules and Regulations\n\n Modular / self-paced learning is a competency- based training modality wherein the\ntrainee is allowed to progress at his own pace. The trainer facilitates the training\ndelivery\n\n Peer teaching / mentoring is training modality wherein fast learners are given the\nopportunity to assist the slow learners.\n\n Supervised industry training or on-the-hob training is an approach in training\ndesigned to enhance the knowledge and skills of the trainee through actual\nexperience in the workplace to acquire specific competencies prescribed in the\ntraining regulations.\n\n Distance learning is formal education process in which majority of the instruction\noccurs when the students and instructor are not in the same place. Distance learning\nmay employ correspondence study, or audio, video or computer technologies.\n\n3.3 TRAINEE ENTRY REQUIREMENTS\n\nThis section specifies the qualifications of trainees and educational\nexperience. Other requirements like health and physical requirements are\nalso stated. Passing entry written examinations may also be indicated if\nnecessary.\n\n•\nMust be high school graduate\n•\nWith good moral character\n•\nAbility to communicate\n•\nPhysically and mentally fit\n\n--- PDF PAGE 41 ---\nechanical drafting\n11/20/07\n39\n 3.4 LIST OF TOOLS, EQUIPMENT AND MATERIALS\n MECHANICAL DRAFTING NC I\n\nRecommended list of tools, equipment and materials for the training of 25\ntrainees for Mechanical Drafting NC I\n\n TOOLS\nQTY\n\nQTY\n\nQTY\n\n Drawing Instruments:\n25\npcs.\n• Drawing table\n25\npcs.\n• Protractor\n25\npcs\n• Compass\n25\npcs.\n• 30 x 60 degrees\ntriangle\n25\npcs\n• Ruler\n2\n5set\n• Drawing pencil\n25\npcs.\n• 45 degrees triangle\n25\npcs.\n• Scale Ruler 12 “\n25\npcs\n• Triangular scale\n\n Measuring Tools:\n25\npcs\n• Scale\n15\npcs.\n• Vernier caliper\n200mm\n15\npcs.\n• Micrometer 50-\n75\n25\npcs.\n• Protractor\n10\npcs.\n• Gauges\n10\npcs.\n• Sine bars\n\n Safety Device:\n1\nbox\n• First –Aid kit\n25\npcs\n• Safety shoes\n\n4 cyl\n• Fire extinguisher\n\nEQUIPMENT\nQTY\n\nQTY\n\nQTY\n\n1\nunit\nPhotocopier machine\n\nMATERIALS\n\n• Drawing paper\n\n\nA4 folders\n\n\nDrawing\nbinders\n\n•White prints\n\n\n\n\n\nTraining Materials:\n\n Reference books\n Manuals\n\n Catalogs\n Brochures /\n\n CD s / Video\ntape\n\n--- PDF PAGE 42 ---\nechanical drafting\n11/20/07\n40\n\nHousekeeping materials:\n20\npcs\n Brooms\n10\npcs\n Mops\n2\npcs.\n Trash can\n10\npcs\n Scrapers\n2\nbars\n Soap\n\n\n10 k\n Clean rags\n5 pcs\n Dustpan\n\n3.5 TRAINING FACILITIES\n MECHANICAL DRAFTING NC I\n\nThe Drafting workshop must be of concrete structure. Based on class size of 25\nstudents/trainees the space requirements for the teaching/learning and circulation areas\nare as follows:\nSPACE\nREQUIREMENT\nSIZE IN METERS\nAREA IN SQ.\nMETERS\nTOTAL AREA IN\nSQ. METERS\n•\nBuilding\n(permanent)\n\n 10 M X 30 M\n\n 300 Sq. M\n Trainee working\nspace\n\n 2 M X 2 M\n\n 4 Sq.M / trainee\n\n 100 sq. M.\n Lecture Room\n 8 M X 10 M\n 80 Sq. M.\n 80 Sq. M\n Learning\nResource Center\n\n 4 M X 8 M.\n\n 32 Sq. M\n\n 32 Sq. M\n Facilities/\nEquipment/\nCirculation Area\n\n 88 Sq. M.\n\n--- PDF PAGE 43 ---\nechanical drafting\n11/20/07\n41\n3.6 TRAINER’S QUALIFICATIONS FOR METALS AND ENGINEERING\n SECTOR\n\n TRAINER QUALIFICATION (TQ I)\n\n• Must be a holder of Mechanical Drafting NC I\n• Must have undergone training on Training Methodology I (TM I)\n• Must be computer literate\n• Must be physically and mentally fit\n• *Must have at least 2 years job/industry experience\n• Must be a civil service eligible (for government position or appropriate\nprofessional license issued by the Professional Regulatory Commission)\n\n* Optional. Only when required by the hiring institution.\n\nReference: TESDA Board Resolution No. 2004 03\n\n3.7 INSTITUTIONAL ASSESSMENT\n\nInstitutional assessment is undertaken by trainees to determine their\nachievement of units of competency. A certificate of achievement is issued for\neach unit of competency.\n\n--- PDF PAGE 44 ---\nechanical drafting\n11/20/07\n42"
