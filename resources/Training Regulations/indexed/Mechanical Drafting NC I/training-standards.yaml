      "source_text": "3.1 CURRICULUM DESIGN\n\nCourse Title: MECHANICAL DRAFTING NC Level: NC I\n\nNominal Training Duration : 218 Hours\n\nThis qualification is designed to develop knowledge, desirable attitudes and skills\nin Mechanical Drafting NC I.\n It covers the competencies required to Prepare Basic Engineering Drawing and\nPerform Basic Engineering Detail Drafting.\n To obtain this, all units of competency prescribed for this qualification must be\nachieved.\n\nBASIC COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Receive and\nrespond to\nworkplace\ncommunication\n1.1 Explain routinary\n speaking & messages\n in a workplace\n1.2 Follow routinary\n speaking & messages\n1.3 Perform work duties\n following written notices\n• Group\ndiscussion\n• Interaction\n\n•\nInterviews/\nquestioning\n•\nObservation\n2. Work with\nothers\n2.1 Develop effective\n workplace relationship\n2.2 Contribute to work\n group activities\n\n• Group\ndiscussion\n• Interaction\n\n•\nInterviews/\nquestioning\n•\nDemonstration\n•\nObservation\n3. Demonstrate\nwork values\n\n3.1 Define the purpose of\n work\n3.2 Apply work values/\n ethics\n3.3 Deal with ethical\n problems\n3.4 Maintain integrity of\n conduct in the\n workplace\n• Group\ndiscussion\n• Interaction\n\n•\nDemonstration\n•\nObservation\n•\nInterviews/\nquestioning\n\n--- PDF PAGE 37 ---\nechanical drafting\n11/20/07\n35\n4. Practice\nhousekeeping\nprocedures\n4.1 Sort and remove\n unnecessary items\n4.2 Arrange items\n4.3 Maintain work areas,\n tools and equipment\n4.4 Follow standardize work\n process and procedures\n4.5 Perform work\n spontaneously\n• Group\ndiscussion\n• Interaction\n\n•\nDemonstration\n•\nObservation\n•\nInterviews/\nquestioning\n\nCOMMON COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Apply safety\n practices\n\n1.1 Identify hazards\n1.2 Use protective\n clothing and devices\n1.3 Perform safe handling\n of tools, equipment\n and materials\n1.4 Perform first aid\n1.5 Use fire extinguisher\n• Lecture\n• Group\n discussion\n• Interaction\n• Role\n playing /\n Simulation\n\n• Observation\n• Demonstration\n• Interview /\n Questioning\n\n2. Interpret\nworking\ndrawing and\nsketches\n\n2.1 Interpret technical\ndrawing\n2.2 Prepare freehand\nsketch of parts\n2.3 Interpret details from\nfreehand sketch\n• Lecture\n• Group\n discussion\n• Interaction\n• Observation\n• Interview /\n Questioning\n3. Perform\n shop\n computations\n (Basic)\n3.1 Perform four\n fundamental operations\n3.2 Perform basic\n calculations involving\n fractions and decimals\n3.3 Perform basic\n calculations involving\n percentages\n3.4 Perform basic\n calculations involving\n ration and proportion\n3.5 Perform calculations on\n algebraic expressions\n• Lecture\n• Demonstration\n• Practical\n exercise\n• Demonstration\n• Observation\n• Performance\n test\n• Interview /\n Questioning\n\n--- PDF PAGE 38 ---\nechanical drafting\n11/20/07\n36\n4. Measure\n workpiece\n (Basic)\n\n4.1 Select and use\n measuring tools\n4.2 Clean and store\n measuring tools\n\n• Lecture\n• Demonstration\n• Practical\n exercise\n• Demonstration\n• Observation\n• Performance\n test\n• Interview /\n Questioning\n\nCORE COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n\n1. Prepare basic\nengineering\ndrafting\n\n1.1 Identify drawing\nrequirements\n1.2 Prepare engineering\ndrawing or make\nchanges to existing\ndrawings\n\n1.3 Prepare engineering\nparts list\n\n• Lecture/\n discussion\n• Self-paced\ninstructions\n• Demonstration\n\n• Written or oral\n\n• Demonstratio\nn\n\n2. Perform basic\nengineering\ndetail drafting\n\n2.1 Prepare assembly,\nlayout and detail\ndrawings\n2.2 Determine component\nand/or material\nrequirement and issue\napproved drawing\n\n• Lecture/\n discussion\n• Self-paced\ninstructions\n• Demonstration\n\n• Written or oral\n\n• Demonstratio\nn\n\n--- PDF PAGE 39 ---\nechanical dra