  "source_section_text": "Section 1.\nSuccessful candidates shall be awarded a National Certificate signed by the\nTESDA Director General.\n\n4.2\nAssessment shall focus on the core units of competency. The basic and common\nunits shall be integrated or assessed concurrently with the core units.\n\n4.3 The following are qualified to apply for assessment and certification:\n\n4.3.1 Graduates of formal, non-formal and informal including enterprise-based\ntraining programs.\n\n4.3.2 Experienced workers (wage employed or self employed)\n\n4.4 The guidelines on assessment and certification are discussed in detail in the\n\"Procedures Manual on Assessment and Certification\" and \"Guidelines on the\nImplementation of the Philippine TVET Qualification and Certification System\n(PTOQS)\".\n\n--- PDF PAGE 45 ---\nechanical drafting\n11/20/07\n43\nTurn workpiece\n(Basic)\nPerform bench work\n(Basic)\nPerform bench work\nComplex)\nTurn workpiece\n(Intermediate)\nCORE\nCOMPETENCIES\nMill workpiece\n(Basic)\nMill workpiece\n(Intermediate)\nMill workpiece\n(Advanced)\nGrind workpiece\n(Basic)\nGrind workpiece\n(Complex)\nSupermarket of Competencies\nMetals and Engineering Sector\nMACHINING\nTurn workpiece\n(Advanced)\nReceive and respond\nto workplace\ncommunication\nLead in workplace\ncommunication\nWork with others\nLead small teams\nSolve problems\nrelated to\nworkplace activities\nParticipate in\nworkplace\ncommunication\nUtilize specialist\ncommunication skills\nWork in team\nenvironment\nDevelop team and\nindividual\nApply problem-solving\ntechniques in the\nworkplace\nDemonstrate\nwork values\nBASIC\nCOMPETENCIES\nCOMMON\nCOMPETENCIES\nApply safety\npractices\nPerform routine\nhousekeeping\nMeasure workpiece\n(Basic)\nInterpret working\ndrawings and\nsketches\nSelect and cut\nworkshop materials\nPerform shop\ncomputations (Basic)\nPerform preventive\nand corrective\nmaintenance\nPerform shop\ncomputations\n(Advanced)\nPerform shop\ncomputations\n(Intermediate)\nMeasure workpiece\nusing gages and\ncomparators\nMeasure workpiece\nusing angular\nmeasuring\ninstruments\nLegend\nMechanical Drafting NC I\nPractice occupational\nhealth and\nsafety procedures\nDevelop and practice\nnegotiation skills\nUse relevant\ntechnologies\nCollect, analyze\nand organize\ninformation\nPlan and\norganize work\nPractice career\nprofessionalism\nUse mathematical\nconcepts and\ntechniques\nPromote\nenvironmental\nprotection\nPractice\nhousekeeping\nprocedures\nPerform basic\nengineering drafting\nPrepare basic\nengineering\ndrawing)\n\n--- PDF PAGE 46 ---\n\n--- PDF PAGE 47 ---\nechanical drafting\n11/20/07\n45\nDefinition of Terms\n\nDrafting\nThe making of drawings of objects, structures or systems that\nhave been visualized by engineers and others\n\nMechanical\ndrawing\nDrawing with the aid of instruments\n\nDrafting\nmachine\nA mechanical device to aid in drafting, having two straight\nedges fixed perpendicularly to each other\n\nIsometric\nprojection\nA drawing that shows an object’s inclined position with\nrespect to the planes of projection\n\nOrthographic\nprojection\nA perspective projection of one hemisphere produced by\nstraight parallel lines from any point desired from an infinite\ndistance\n\nScale drawing\nA drawing of an object or structure showing all parts in the\nsame proportion of their actual size\n\nTolerance\nA permissible deviation from a specified value, expressed in\nactual values or more often as a percentage of the nominal\nvalue\n\nLimits\nThe maximum and minimum values prescribed for a specific\ndimension; the limits may be of size if dimension concerned is\nsize dimension, or may be of location if the dimension\nconcerned is a location dimension\n\nFit\nThe dimensional relationship between mating parts, such as\npress, shrink or sliding fit\n\n--- PDF PAGE 48 ---\nechanical drafting\n11/20/07\n46\nACKNOWLEDGEMENTS\n\n The Technical Education and Skills Development Authority (TESDA) wishes to extend\n thanks and appreciation to the many representatives of business, industry, academe and\n government agencies who donated their time and expertise to the development and\n validation of this Training Regulation.\nWe particularly thank the following members of the Expert Committee and the respondents\nof the National Validation that was conducted for MECHANICAL DRAFTING NC I\n\nEXPERT PANEL\n RESPONDENTS IN THE VALIDATION\n OF THIS TRAINING REGULATIONS\n\nMR. JAIME PALLASIGUE\nTUP- Taguig\nReyland Pancho\nDon Bosco - Makati\nJOHN PLAZA\nFormerly of Meralco Foundation, Inc.\nPaul Altillo\nTUP – Manila\nMR. AGUSTIN M. PAYAD\nTechnological University of the Philippines\nRegin Lanzuela\nVL Industech\nMR. TIMOTEO C. INTALAN\nMIAP Consultant\nNorberto Bautista\nHDM Technologies\n\nMR. Elso Clarete\nDon BOSCO Technical College\n\nMechanical Drafting Committee of\n MIAP – Davao\n MIAP – Metro Cebu\n MIAP – Metro Manila\n MIAP – Northern Mindanao"
