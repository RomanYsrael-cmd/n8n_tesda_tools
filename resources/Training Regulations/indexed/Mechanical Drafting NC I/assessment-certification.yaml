  "source_text": "SECTION 4\nNATIONAL ASSESSMENT AND CERTIFICATION\nARRANGEMENTS\n\n4.1\nTo attain the National Qualification of Mechanical Drafting NC I, the candidate\nmust demonstrate competence in all the units of competency listed in Section 1.\nSuccessful candidates shall be awarded a National Certificate signed by the\nTESDA Director General.\n\n4.2\nAssessment shall focus on the core units of competency. The basic and common\nunits shall be integrated or assessed concurrently with the core units.\n\n4.3 The following are qualified to apply for assessment and certification:\n\n4.3.1 Graduates of formal, non-formal and informal including enterprise-based\ntraining programs.\n\n4.3.2 Experienced workers (wage employed or self employed)\n\n4.4 The guidelines on assessment and certification are discussed in detail in the\n\"Procedures Manual on Assessment and Certification\" and \"Guidelines on the\nImplementation of the Philippine TVET Qualification and Certification System\n(PTOQS)\".\n\n--- PDF PAGE 45 ---\nechanical drafting\n11/20/07\n43\nTurn workpiece\n(Basic)\nPerform bench work\n(Basic)\nPerform bench work\nComplex)\nTurn workpiece\n(Intermediate)\nCORE\nCOMPETENCIES\nMill workpiece\n(Basic)\nMill workpiece\n(Intermediate)\nMill workpiece\n(Advanced)\nGrind workpiece\n(Basic)\nGrind workpiece\n(Complex)\nSupermarket of Competencies\nMetals and Engineering Sector\nMACHINING\nTurn workpiece\n(Advanced)\nReceive and respond\nto workplace\ncommunication\nLead in workplace\ncommunication\nWork with others\nLead small teams\nSolve problems\nrelated to\nworkplace activities\nParticipate in\nworkplace\ncommunication\nUtilize specialist\ncommunication skills\nWork in team\nenvironment\nDevelop team and\nindividual\nApply problem-solving\ntechniques in the\nworkplace\nDemonstrate\nwork values\nBASIC\nCOMPETENCIES\nCOMMON\nCOMPETENCIES\nApply safety\npractices\nPerform routine\nhousekeeping\nMeasure workpiece\n(Basic)\nInterpret working\ndrawings and\nsketches\nSelect and cut\nworkshop materials\nPerform shop\ncomputations (Basic)\nPerform preventive\nand corrective\nmaintenance\nPerform shop\ncomputations\n(Advanced)\nPerform shop\ncomputations\n(Intermediate)\nMeasure workpiece\nusing gages and\ncomparators\nMeasure workpiece\nusing angular\nmeasuring\ninstruments\nLegend\nMechanical Drafting NC I\nPractice occupational\nhealth and\nsafety procedures\nDevelop and practice\nnegotiation skills\nUse relevant\ntechnologies\nCollect, analyze\nand organize\ninformation\nPlan and\norganize work\nPractice career\nprofessionalism\nUse mathematical\nconcepts and\ntechniques\nPromote\nenvironmental\nprotection\nPractice\nhousekeeping\nprocedures\nPerform basic\nengineering drafting\nPrepare basic\nengineering\ndrawing)\n\n--- PDF PAGE 46 ---\n\n--- PDF PAGE 47 ---\nechanical drafting\n11/20/07\n45\n"
