een visualized by engineers and others Mechanical drawing Drawing with the aid of instruments Drafting machine A mechanical device to aid in drafting, having two straight edges fixed perpendicularly to each other Isometric projection A drawing that shows an object’s inclined position with respect to the planes of projection Orthographic projection A perspective projection of one hemisphere produced by straight parallel lines from any point desired from an infinite distance Scale drawing A drawing of an object or structure showing all parts in the same proportion of their actual size Tolerance A permissible deviation from a specified value, expressed in actual values or more often as a percentage of the nominal value Limits The maximum and minimum values prescribed for a specific dimension; the limits may be of size if dimension concerned is size dimension, or may be of location if the dimension concerned is a location dimension Fit The dimensional relationship between mating parts, such as press, shrink or sliding fit --- PDF PAGE 48 --- echanical drafting 11/20/07 46 The Technical Education and Skills Development Authority (TESDA) wishes to extend thanks and appreciation to the many representatives of business, industry, academe and government agencies who donated their time and expertise to the development and validation of this Training Regulation. We particularly thank the following members of the Expert Committee and the respondents of the National Validation that was conducted for MECHANICAL DRAFTING NC I MR. JAIME PALLASIGUE TUP- Taguig Reyland Pancho Don Bosco - Makati Formerly of Meralco Foundation, Inc. Paul Altillo TUP – Manila MR. AGUSTIN M. PAYAD Technological University of the Philippines Regin Lanzuela VL Industech MR. TIMOTEO C. INTALAN MIAP Consultant Norberto Bautista HDM Technologies MR. Elso Clarete Don BOSCO Technical College Mechanical Drafting Committee of MIAP – Davao MIAP – Metro Cebu MIAP – Metro Manila MIAP – Northern Mindanao"
