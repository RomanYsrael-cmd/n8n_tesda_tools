and should accommodate individualized\nand self-paced learning strategies;\nc. Training can be done on an actual workplace setting, simulation of a\nworkplace and/or through adoption of modern technology.\nd. Assessment is based in the collection of evidence of the performance of work\nto the industry required standards;\ne. Assessment of competency takes the trainee’s knowledge and attitude into\naccount but requires evidence of actual performance of the competency as\nthe primary source of evidence.\nf. Training program allows for recognition of prior learning (RPL) or current\ncompetencies;\ng. Training completion is based on satisfactory performance of all specified\ncompetencies.\n\n2. The competency-based TVET system recognizes various types of delivery\nmodes, both on-and off-the-job as long as the learning is driven by the\ncompetency standards specified by the industry. The following training modalities\nand their variations/components may be adopted singly or in combination with\nother modalities when designing and delivering training programs:\n\n2.1 School/Institution- Based:\n\n• Dual Training System (DTS)/Dualized Training Program (DTP) which\ncontain both in-school and in-industry training or fieldwork components.\nDetails can be referred to the Implementing Rules and Regulations of the\nDTS Law and the TESDA Guidelines on the DTP;\n\n• Distance learning is a formal education process in which majority of the\ninstruction occurs when the students and instructor are not in the same\nplace. Distance learning may employ correspondence study, audio, video,\ncomputer technologies or other modern technology that can be used to\nfacilitate learning and formal and non-formal training. Specific guidelines\non this mode shall be issued by the TESDA Secretariat.\n\n--- PDF PAGE 102 ---\nTR - Aquaculture (Hatchery Operation) NC II Revision 00 Promulgated (06/09/2020) 98\n\n• Supervised Industry Training (SIT) or on-the-job training (OJT) is an\napproach in training designed to enhance the knowledge and skills of the\ntrainee through actual experience in the workplace to acquire specific\ncompetencies as prescribed in the training regulations. It is imperative that\nthe deployment of trainees in the workplace is adhered to training\nprograms agreed by the institution and enterprise and status and progress\nof trainees are closely monitored by the training institutions to prevent\nopportunity for work exploitation.\n\n• The classroom-based or in-center instruction uses of learner-centered\nmethods as well as laboratory or field-work components.\n\n2.2 Enterprise-Based:\n\n• Formal Apprenticeship – Training within employment involving a\ncontract between an apprentice and an enterprise on an approved\napprenticeable occupation.\n\n• Informal Apprenticeship - is based on a training (and working)\nagreement between an apprentice and a master craftsperson wherein the\nagreement may be written or oral and the master craftsperson commits to\ntraining the apprentice in all the skills relevant to his or her trade over a\nsignificant period of time, usually between one and four years, while the\napprentice commits to contributing productively to the work of the\nbusiness. Training is integrated into the production process and\napprentices learn by working alongside the experienced craftsperson.\n\n• Enterprise-based Training- where training is implemented within the\ncompany in accordance with the requirements of the specific company.\nSpecific guidelines on this mode shall be issued by the TESDA\nSecretariat.\n\n2.3 Community-Based – short term program conducted by non-government\norganizations (NGOs), LGUs, training centers and other TVET providers\nwhich are intended to address the specific needs of a community. Such\nprograms can be conducted in informal settings such as barangay hall,\nbasketball courts, etc. These programs can also be mobile training program\n(MTP).\n\n--- PDF PAGE 103 ---\nTR - Aquaculture (Hatchery Operation) NC II Revision 00 Promulgated (06/09/2020) 99\n3.3\nTRAINEE ENTRY REQUIREMENTS\n\nTrainees or students who would like to enroll in this program must possess the\nfollowing requirements:\n\n•\nBasic communication skills\n•\nBasic mathematical skills\n\n3.4\nLIST OF TOOLS, EQUIPMENT, AND MATERIALS\n\nAQUACULTURE (HATCHERY OPERATION) NC II\n\nRecommended list of tools, equipment and materials for the training of 25 trainees\nfor Aquaculture (Hatchery Operation) NC II.\n\nUp-to-date tools, materials, and equipment of equivalent functions can be used as\nalternatives. This also applies in consideration of community practices and their availability\nin the local market.\n\nA.\nFULL QUALIFICATION\n\nTOOLS\nQTY\nDESCRIPTION\n5 pcs\nCalculator\n5 pcs\nContainers glass or clear polycarbonate, 1 Liter cap.\n5 pcs\nContainers glass or clear polycarbonate: 1 gallon cap.\n5 pcs\nContainers glass or clear polycarbonate: 20 Liter cap.\n5 pcs\nContainers glass or clear polycarbonate: 500 Liter cap.\n5 pcs\nScissors\n5 pcs\nPail with handle, 16 L cap.\n5 pcs\nBeakers, 500 ml cap.\n5 pcs\nBeaker, 200ml cap.\n5 pcs\nPlastic scoop\n5 pcs\nPlastic basin\n5 pcs\nDipper\n5 pcs\nPlastic bowl\n\nEQUIPMENT\nQTY\nDESCRIPTION\n1 unit\nBreeding tank, 100-tons cap.\n1 unit\nAeration system\n2 units\nDO meter\n2 units\npH meter\n2 units\nRefractometer\n1unit\nOzonator\n1unit\nUV filter\n2 units\nWeighing scale, .01 readability, 1 Kg cap.\n2 units\nWeighing scale, .01 readability, 10 Kg cap.\n5 units\nMicroscope\n5 units\nCounting chamber\n\n--- PDF PAGE 104 ---\nTR - Aquaculture (Hatchery Operation) NC II Revision 00 Promulgated (06/09/2020) 100\nEQUIPMENT\nQTY\nDESCRIPTION\n5 pcs\nTally counter\n5 units\n1-ton mass culture tank, PE\n1 unit\nConical tank, 300L cap.\n2 cans\nArtemia cyst\n1 unit\nDigital microscope\n2 units\nHemacytometer\n\nMATERIALS\nQTY\nDESCRIPTION\n5 Kg\nCalcium hypochlorite\n5 Kg\nSodium thiosulfate\n1 unit\nRapid sand filter\n½ Kg\nEDTA\n2 units\nChlorine test kit\n5 pcs\nGog