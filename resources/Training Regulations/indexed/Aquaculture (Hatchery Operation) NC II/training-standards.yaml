uirement\n• Kind of feeds\n• Growth stages\n• Procedure in feeding\nbreeders\n• Measures in managing\nhealth of breeders\n• Lecture\n• Discussion\n• Demonstration\n• Interviews\n• Written\n• Demonstration\n3 hours\n\n--- PDF PAGE 98 ---\nTR - Aquaculture (Hatchery Operation) NC II Revision 00 Promulgated (06/09/2020) 94\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n4.1.2 Maintain breeders\n\n4.2 Rear larvae and\nfry\n4.2.1 Discuss and explain the\nfollowing:\n• Periodic changing of larval\nrearing water\n• Good Aquaculture Practices\n(GAqP)\n• Larval stages per species\n• Natural foods\n- Density computation\n- Density adjustment\n- Monitoring procedure\n• Procedure in stocking\nacclimatized post-larvae\n• Rearing requirements and\nprocedure\n• Monitoring growth of fry\n• Fry counting and stocking\n4.2.2 Rear larvae and fry\n• Lecture\n• Discussion\n• Demonstration\n• Interviews\n• Written\n• Demonstration\n10 hours\n\n4.3 Conduct water\nmanagement\n4.3.1 Discuss and explain the\nfollowing:\n• Water quality parameters\n• Monitoring procedure\n• Remedial actions\n• Procedure in water\nreplenishment\n• Maintenance of aeration\n• Good Aquaculture Practices\n(GAqP)\n4.3.2 Conduct water management\n• Lecture\n• Discussion\n• Demonstration\n• Interviews\n• Written\n• Demonstration\n6 hours\n\n--- PDF PAGE 99 ---\nTR - Aquaculture (Hatchery Operation) NC II Revision 00 Promulgated (06/09/2020) 95\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n5. Complete\nhatchery\noperation\n5.1 Harvest post-\nlarvae and fry\n5.1.1 Discuss and explain the\nfollowing:\n• Hatchery harvesting\nequipment and\nparaphernalia\n• Morphological features\n• Procedure in collecting post-\nlarvae and fry\n• Good Aquaculture Practices\n(GAqP)\n• Procedure in conditioning\nand counting post-larvae and\nfry\n• Procedure in packing and\ntransporting post-larvae and\