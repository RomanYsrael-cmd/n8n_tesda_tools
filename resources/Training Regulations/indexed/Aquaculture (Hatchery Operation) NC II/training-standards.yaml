easurement\n• Lecture\n• Discussion\n• Demonstration\n• Written exam\n• Oral questioning\n4 hrs\n\n--- PDF PAGE 93 ---\nTR - Aquaculture (Hatchery Operation) NC II Revision 00 Promulgated (06/09/2020) 89\nCORE COMPETENCIES\n77 Hours\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n1. Conduct\npreparatory\nactivities\n1.1 Prepare\nhatchery tanks\n1.1.1 Discuss and explain the\nfollowing:\n• Proper aeration (water\nmovement and bubbles)\n• Types filter bags and screen\n(with different mesh size)\n• Installation procedure of filter\nbags and drainage pipes\n• Filling-up tank based on\nspecies requirement\n• Operation of aeration system\n• Water depth based on\nspecies requirements\n• Estimation of airstone\n• Following guidelines in\nGAqP\n• GAqP on cleaning and\ndisinfection of tanks\n• OSHS on hatchery tank\npreparation\n• Attitude:\n- Honest\n- Patient\n- Time-conscious\n- Resourceful\n- Obedient\n- Focus\n1.1.2 Prepare hatchery tanks\n• Lecture\n• Discussion\n• Demonstration\n• Interviews\n• Written\n• Demonstration\n2 hours\n\n--- PDF PAGE 94 ---\nTR - Aquaculture (Hatchery Operation) NC II Revision 00 Promulgated (06/09/2020) 90\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\n1.2 Prepare\nhatchery\nfacilities\n1.2.1 Discuss and explain the\nfollowing:\n• Preparation of tools and\nmaterials\n• Inspection and calibration of\ntools and instruments\n• Inspection of facilities\n• GAqP\n• Minor repairs of facilities\n• Major breakdowns\n• Water quality monitoring\ninstruments\n• OSHS\n1.2.2 Prepare hatchery facilities\n• Lecture\n• Discussion\n• Demonstration\n• Interviews\n• Written\n• Demonstration\n2 hours\n\n1.3 Perform water\nfiltration and\ntreatment\n1.3.1 Discuss and explain the\nfollowing:\n• Water filtration technique\n• Water treatment technique\n• Procedure in chlorine testing\nfiltered water\n• UV treatment procedure\