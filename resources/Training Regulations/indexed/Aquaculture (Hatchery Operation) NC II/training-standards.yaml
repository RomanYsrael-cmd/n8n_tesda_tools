      "source_text": "3.1\nCURRICULUM DESIGN\n\nTESDA shall provide the training on the development of competency-based curricula\nto enable training providers develop their own curricula with the components mentioned\nbelow.\n\nDelivery of knowledge requirements for the basic, common and core units of\ncompetency\nspecifically\nin\nthe\nareas\nof\nmathematics,\nscience/technology,\ncommunication/language and other academic subjects shall be contextualized. To this end,\nTVET providers shall develop a Contextual Learning Matrix (CLM) to accompany the\ncurricula.\n\nCourse Title: AQUACULTURE (HATCHERY OPERATION)\nNC II\n\nNominal Training Duration:\n37 Hours (Basic Competencies)\n\n72 Hours (Common Competencies)\n\n77 Hours (Core Competencies)\n\n186\n\n80 Supervised Industry Learning (SIL)\n\n266 TOTAL HOURS\n\nCourse Description:\n\nThis course is designed to develop and enhance the knowledge, desirable attitudes\nand skills of a conducting preparatory activities, producing natural foods, conducting\nbroodstock management and spawning, managing feeding and maintaining good health of\nstocks, and completing hatchery operation.\n\nUpon completion of the course, the learners are expected to demonstrate the above-\nmentioned competencies to be employed. To obtain this, all units prescribed for this\nqualification must be achieve.\n\n--- PDF PAGE 70 ---\nTR - Aquaculture (Hatchery Operation) NC II Revision 00 Promulgated (06/09/2020) 66\n\nBASIC COMPETENCIES\n37 Hours\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and\nconvey\nworkplace\ninformation\n•\nDescribe Organizational policies\n•\nRead:\no Effective communication\no Written communication\no Communication procedures\nand systems\n•\nIdentify:\no Different modes of\ncommunication\no Medium of communication\no Flow of communication\no Available technology relevant\nto the enterprise and the\nindividual’s work\nresponsibilities\n•\nPrepare different Types of\nquestion\n•\nGather different sources of\ninformation\n•\nApply storage system in\nestablishing workplace\ninformation\n•\nDemonstrate Telephone courtesy\n• Group discussion\n• Lecture\n• Demonstration\n• Oral evaluation\n• Written\nexamination\n• Observation\n2 Hours\n\n1.2 Perform duties\nfollowing\nworkplace\ninstructions\n•\nRead:\no Written notices and\ninstructions\no Workplace interactions and\nprocedures\n• Group discussion\n• Lecture\n• Demonstration\n• Oral evaluation\n• Written\nexamination\n• Observation\n2 Hours\n\n--- PDF PAGE 71 ---\nTR - Aquaculture (Hatchery Operation) NC II Revision 00 Promulgated (06/09/2020) 67\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n•\nRead instructions on work related\nforms/documents\n•\nPerform workplace duties\nscenario following workplace\ninstructions\n\n1.3 Complete\nrelevant work\nrelated\ndocuments\n•\nDescribe Communication\nprocedures and systems\n•\nRead:\no Meeting protocols\no Nature of workplace meetings\no Workplace interactions\no Barriers of communication\n•\nRead instructions on work related\nforms/documents\n•\nPractice:\no Estimate, calculate and\nrecord routine workplace\nmeasures\no Basic mathematical\nprocesses of addition,\nsubtraction, division and\nmultiplication\n•\nDemonstrate office activities in:\no workplace meetings and\ndiscussions scenario\n•\nPerform workplace duties\nscenario following simple written\nnotices\n•\nFollow simple spoken language\n•\nIdentify the different Non-verbal\ncommunication\n• Group discussion\n• Lecture\n• Demonstration\n• Role play\n• Oral evaluation\n• Written\nexamination\n• Observation\n2 Hours\n\n--- PDF PAGE 72 ---\nTR - Aquaculture (Hatchery Operation) NC II Revision 00 Promulgated (06/09/2020) 68\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n•\nDemonstrate ability to relate to\npeople of social range in the\nworkplace\n•\nGather and provide information in\nresponse to workplace\nrequirements\n•\nComplete work related\ndocuments\n2. Work in a team\nenvironment\n2.1 Describe team\nrole and scope\n•\nDiscussion on team roles and\nscope\n•\nParticipate in the discussion:\no\nDefinition of Team\no\nDifference between team\nand group\no\nObjectives and goals of team\n•\nLocate needed information from\nthe different sources of\ninformation\n• Lecture/\nDiscussion\n• Group Work\n• Individual Work\n• Role Play\n• Role Play\n• Case Study\n• Written Test\n1 Hour\n\n2.2 Identify one’s\nrole and\nresponsibility\nwithin team\n•\nRole play:\no individual role and\nresponsibility\n•\nRole Play\no Understanding Individual\ndifferences\n•\nDiscussion on gender sensitivity\n• Role Play\n• Lecture/\nDiscussion\n• Role Play\n• Written Test\n1 Hour\n\n2.3 Work as a team\nmember\n• Participate in group planning\nactivities\n• Role play: Communication\nprotocols\n• Participate in the discussion of\nstandard work procedures and\npractices\n• Group work\n• Role Play\n• Lecture/\nDiscussion\n• Role Play\n• Written Test\n1 Hour\n\n--- PDF PAGE 73 ---\nTR - Aquaculture (Hatchery Operation) NC II Revision 00 Promulgated (06/09/2020) 69\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n3. Solve/address\nroutine problems\n3.1 Identify routine\nproblems\n• Determine the current industry\nhardware and software products\nand services\n• Identify correctly the industry\nmaintenance, service and\nhelpdesk practices, processes and\nprocedures\n• Make use of the industry standard\ndiagnostic tools\n• Share best practices in\ndetermining basic malfunctions\nand resolutions to general\nproblems in the workplace\n• Analyze routine/procedural\nproblems\n• Group discussion\n• Lecture\n• Demonstration\n• Role playing\n• Case\nFormulation\n• Life Narrative\nInquiry\n(Interview)\n• Standa