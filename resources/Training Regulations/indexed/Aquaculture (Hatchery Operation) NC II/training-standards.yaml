ements\n• Lecture\n• Discussion\n• Demonstration\n• Interviews\n• Written\n• Demonstration\n3 hours\n\n--- PDF PAGE 96 ---\nTR - Aquaculture (Hatchery Operation) NC II Revision 00 Promulgated (06/09/2020) 92\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n• Good Aquaculture Practices\n(GAqP)\n• Density monitoring and\nrecording\n• Procedure in gathering and\nseparating artemia nauplii\n2.4.2 Hatch and harvest artemia\nnauplii\n3. Conduct\nbroodstock\nmanagement and\nspawning\n3.1 Source and\nmaintain\nbroodstock\n3.1.1 Discuss and explain the\nfollowing:\n• Broodstock\n• Reputable sources of\nbroodstock\n• Sex determination technique\n• Segregation of breeders\n• Selection of breeders\n• Reproductive maturity of\nbreeders\n• Proper handling of breeders\n3.1.2 Source and maintain\nbroodstock\n• Lecture\n• Discussion\n• Demonstration\n• Interviews\n• Written\n• Demonstration\n10 hours\n\n3.2 Induce\nspawning\n3.2.1 Discuss and explain the\nfollowing:\n• Pre-spawning activities\n• Work requirements\n• Spawn induction techniques\n• Species requirement\n• Procedure in spawning\nbreeder\n• Procedure in separating and\ntransferring breeder\n• Lecture\n• Discussion\n• Demonstration\n• Interviews\n• Written\n• Demonstration\n8 hours\n\n--- PDF PAGE 97 ---\nTR - Aquaculture (Hatchery Operation) NC II Revision 00 Promulgated (06/09/2020) 93\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n• Good Aquaculture Practices\n(GAqP)\n• Quality assessment of\nspawns\n3.2.2 Induce spawning\n\n3.3 Collect eggs/\nlarvae/fry\n3.3.1 Discuss and explain the\nfollowing:\n• Procedure in collecting egg\nper species\n• Estimation\n• Fertilization rate\n• Hatching rate\n• Procedure in transferring\nnewly hatched larvae\n• Larval rearing tanks\n• Procedure in stocking\nbreeders\n• Conditioning breeders\n• Good Aquaculture Practices\n(GAqP)\n• Recordkeeping\n3.3.2