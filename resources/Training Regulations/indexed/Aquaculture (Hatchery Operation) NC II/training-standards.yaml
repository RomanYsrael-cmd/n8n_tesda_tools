valuation\n• Written Test\n• Observation\n• Presentation\n3 Hours\n\n6.3 Record and\npresent\ninformation\n• Lecture and discussion on:\n- Reporting requirements to a\nrange of audiences\n- Recommendations for\npossible improvements\n• Comparison of interim and final\nreports’ outcomes\n• Reporting of data findings\n• Group discussion\n• Lecture\n• Demonstration\n• Role Play\n• Practical exercises\n• Oral evaluation\n• Written Test\n• Observation\n• Presentation\n3 Hours\n7. Practice\nOccupational\nSafety And Health\nPolicies And\nProcedures\n7.1 Identify OSH\ncompliance\nrequirements\n• Discussion regarding:\n- Hierarchy of Controls\n- Hazard Prevention and Controls\n- Work Standards and Procedures\n- Personal Protective Equipment\n• Lecture\n• Group Discussion\n• Written Exam\n• Demonstration\n• Observation\n• Interviews /\n• Questioning\n1 Hour\n\n--- PDF PAGE 79 ---\nTR - Aquaculture (Hatchery Operation) NC II Revision 00 Promulgated (06/09/2020) 75\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\n7.2 Prepare OSH\nrequirements\nfor compliance\n• Identification of required safety\nmaterials, tools and equipment\n• Handling of safety control\nresources\n• Lecture\n• Group Discussion\n• Written Exam\n• Demonstration\n• Observation\n• Interviews /\n• Questioning\n1 Hour\n\n7.3 Perform tasks in\naccordance\nwith relevant\nOSH policies\nand procedures\n•\nDiscussion of General OSH\nStandards and Principles\n• Performing industry related work\nactivities in accordance with OSH\nStandards\n• Lecture\n• Group Discussion\n• Written Exam\n• Demonstration\n• Observation\n• Interviews /\n• Questioning\n2 Hours\n8. Exercise Efficient\nand Effective\nSustainable\nPractices in the\nWorkplace\n8.1 Identify the\nefficiency and\neffectiveness of\nresource\nutilization\n- Discussion on the process how\nEnvironmental Policies coherence\nis achieved\n•\nDiscussion on Necessary Skills in\nresponse to changing\nenvir