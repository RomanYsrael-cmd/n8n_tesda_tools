  "source_text": "COMPETENCY MAP FOR AGRICULTURE, FORESTRY AND FISHERY SECTOR\nAQUACULTURE (HATCHERY OPERATION) NC II\nBASIC COMPETENCIES\n\n--- PDF PAGE 113 ---\nTR - Aquaculture (Hatchery Operation) NCII Revision 00 (06/09//2020) 109\n\nApply deckhand skills aboard\na fishing vessel\nLoad and unload goods /\ncargo\nAssemble and repair\ndamaged netting\nOperate a vessel of up to 3.0\nGT\nMonitor condition and seaworthiness\nof a vessel\nPerform routine maintenance\ntasks on a small coastal\nvessel\nOperate and troubleshoot\nlow powered marine\nengines\nApply weather information\nwhen navigating a vessel\nContribute to safe navigation\nApply basic food handling and safety\npractices\nSupervise unloading and\nloading of net\nEvaluate net mending\nAdminister and monitor net\nmending\nUnload and load fish and fish\nproducts\nClassify fish and fish products\nOperate Seaweed Nursery\nGrow-out seaweed\nProduce raw dried seaweed\nMarket seaweed\nConduct site selection and pond\npreparation\nPerform nursery operations\nProduce aquaculture\ncommodities\nCarry out post production\nactivities\nConduct pre-operational\naquaculture activities\nOperate tilapia hatchery and nursery\nPerform tilapia grow-out\nConduct preparatory\nactivities\nProduce natural foods\nConduct broodstock\nmanagement and spawning\nManage feeding and maintain good\nhealth of stock\nComplete hatchery operation\n\nApply safety measures in\nfarm operation\nUse farm tools and equipment\nPerform estimation and\nbasic calculation\nApply basic first aid\nProcess farm wastes\nPerform record keeping\nMaintain service records\nConduct Diagnosis\nPerform Shop Maintenance\nProvide Quality Customer Service\nComply with Quality and\nEthical Standards\nPerform mensuration and\ncalculations\nMaintain tools and\nequipment\nApply food safety and\nsanitation\nPrevent and fight fire\nComply with Quality and\nEthical Standards\nPerform mensuration and\ncalculations\nMaintain tools and\nequipment\nApply food safety and\nsanitation\nPrevent and fight fire\nProvide first aid treatment\non board\nProtect marine environment\nComply with emergency\nprocedures\nApply safety measures in\nfarm and nursery operations\nUse farm and nursery tools and\nequipment\nDevelop and update\nindustry knowledge\n\nCORE COMPETENCIES\nCOMMON COMPETENCIES\n\n--- PDF PAGE 114 ---\nTR - Aquaculture (Hatchery Operation) NCII Revision 00 (06/09//2020) 110\n\nGLOSSARY OF TERMS\n\nArtificial Incubation\nSystem\n\na system used for artificial incubation of eggs.\nBreeder\nthe fish kept for propagation\n\nBroodstock\nthe fish used for breeding\n\nEgg\nfertilized or unfertilized eggs release by the fish in the breeding\nprocess.\n\nFin Clip\nis the basic method for marking fish, used for identifying a small\nnumber or large group of fish.\n\nFingerlings\na fish larger than a fry but not of marketable table size.\nFingerlings of different fish species varies in sizes.\n\nFry\nnewly hatched fish exhibiting the external characteristics of the\nadults\n\nHapa\nan inverted mosquito net like structure where fish can be\nspawned, temporarily stocked.\n\nNatural foods\n\nlive foods\nPond\nan area of water that is surrounded by land where fish can be\nbred, spawned and grown.\n\nTank\na relatively small chamber. It may be round, rectangular,\nsquare or another shape.\n\n--- PDF PAGE 115 ---\nTR - Aquaculture (Hatchery Operation) NCII Revision 00 (06/09//2020) 111\n\nTRAINING REGULATIONS (TR)\nDOCUMENT REVISION HISTORY\n\nQualification Title:\nAquaculture (Hatchery Operation) NC II\nQualification Code:\nAFFAHO220\n\nRevision\nNo.\nDocument\nTypes*\nQualification Title\nTESDA Board\nResolution No./\nDate\nDeployment Circular\n(TESDA Circular/\nImplementing Guidelines)\n00\nDocument\nCreated\nAquaculture NC II\nTBR No. 2004-21/\n12/09/2004\nNot applicable\n\nDocument\nSuperseded\nAquaculture NC II\nTBR No. 2004-21/\n12/09/2004\nNot applicable\n00\nDocument\nAmended\nAquaculture (Hatchery\nOperation) NC II\nTBR No. 2020-23/\n06/09/2020\nTESDA Circular\nNo. 106 series of 2020\n00\nDocument\nAmended\nAquaculture (Grow-out\nOperation) NC II\nTBR No. 2020-24/\n06/09/2020\nTESDA Circular\nNo. 101 series of 2020\n00\nDocument\nAmended\nAquaculture (Tilapia\nCulture) NC II\nTBR No. 2020-25/\n06/09/2020\nTESDA Circular\nNo. 107 series of 2020\nLegend: *Description Types\n-\nDocument Created\n-\nDocument Amended\n-\nDocument Superseded\n\n--- PDF PAGE 116 ---\nTR - Aquaculture (Hatchery Operation) NCII Revision 00 (06/09//2020) 112",
