        "source_title": "CONTRIBUTE TO WORKPLACE INNOVATION",
        "source_text": "--- PDF PAGE 23 ---\nTR - Aquaculture (Hatchery Operation) NC II Revision 00       Promulgated       (06/09/2020)       19 \n \nUNIT OF COMPETENCY \n: \nCONTRIBUTE TO WORKPLACE INNOVATION \n \n \n \nUNIT CODE \n: \n400311214 \n \n \n \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge, skills and attitudes \nrequired to make a pro-active and positive \ncontribution to workplace innovation. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1.  Identify \nopportunities to do \nthings better \n1.1  Opportunities for \nimprovement are \nidentified \nproactively in own \narea of work. \n1.2  Information are \ngathered and \nreviewed which \nmay be relevant to \nideas and which \nmight assist in \ngaining support for \nidea. \n1.1  Roles of \nindividuals in \nsuggesting and \nmaking \nimprovements. \n1.2  Positive impacts \nand challenges in \ninnovation. \n1.3  Types of changes \nand responsibility. \n1.4  Seven habits of \nhighly effective \npeople. \n1.1  Identifying \nopportunities to \nimprove and to \ndo things better. \nInvolvement \n1.2  Identifying the \npositive impacts \nand the \nchallenges of \nchange and \ninnovation \n1.3  Identifying \nexamples of the \ntypes of changes \nthat are within \nand outside own \nscope of \nresponsibility \n2.  Discuss and \ndevelop ideas with \nothers \n2.1  People who could \nprovide input to \nideas for \nimprovements are \nidentified. \n2.2  Ways of \napproaching people \nto begin sharing \nideas are selected. \n2.3  Meeting is set with \nrelevant people. \n2.4  Ideas for follow up \nare review and \nselected based on \nfeedback. \n2.5  Critical inquiry \nmethod is used to \ndiscuss and \ndevelop ideas with \nothers. \n2.1  Roles of \nindividuals in \nsuggesting and \nmaking \nimprovements \n2.2  Positive impacts \nand challenges in \ninnovation \n2.3  Types of changes \nand responsibility. \n2.4  Seven habits of \nhighly effective \npeople \n2.1  Identifying \nopportunities to \nimprove and to \ndo things better. \nInvolvement \n2.2  Identifying the \npositive impacts \nand the \nchallenges of \nchange and \ninnovation \n2.3  Providing \nexamples of the \ntypes of changes \nthat are within \nand outside own \nscope of \nresponsibility \n2.4  Communicating \nideas for change \nthrough small\n\n--- PDF PAGE 24 ---\nTR - Aquaculture (Hatchery Operation) NC II Revision 00       Promulgated       (06/09/2020)       20 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \ngroup \ndiscussions and \nmeetings \n3.  Integrate ideas for \nchange in the \nworkplace \n3.1  Critical inquiry \nmethod is used to \nintegrate different \nideas for change of \nkey people. \n3.2  Summarizing, \nanalyzing and \ngeneralizing skills \nare used to extract \nsalient points in the \npool of ideas. \n3.3  Reporting skills \nare likewise used to \ncommunicate \nresults. \n3.4  Current Issues \nand concerns on \nthe systems, \nprocesses and \nprocedures, as well \nas the need for \nsimple innovative \npractices are \nidentified. \n3.1  Roles of \nindividuals in \nsuggesting and \nmaking \nimprovements \n3.2  Positive impacts \nand challenges in \ninnovation \n3.3  Types of changes \nand responsibility \n3.4  Seven habits of \nhighly effective \npeople \n3.5  Basic research \nskills \n3.1  Identifying \nopportunities to \nimprove and to \ndo things better. \nInvolvement \n3.2  Identifying the \npositive impacts \nand the \nchallenges of \nchange and \ninnovation \n3.3  Providing \nexamples of the \ntypes of changes \nthat are within \nand outside own \nscope of \nresponsibility \n3.4  Communicating \nideas for change \nthrough small \ngroup \ndiscussions and \nmeetings \n3.5  Demonstrating \nskills in analysis \nand \ninterpretation of \ndata\n\n--- PDF PAGE 25 ---\nTR - Aquaculture (Hatchery Operation) NC II Revision 00       Promulgated       (06/09/2020)       21 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.  Opportunities for \nimprovement \nMay include: \n1.1   Systems \n1.2   Processes \n1.3   Procedures \n1.4   Protocols \n1.5   Codes \n1.6   Practices \n2.  Information \nMay include: \n2.1   Workplace communication problems \n2.2   Performance evaluation results \n2.3   Team dynamics issues and concerns \n2.4   Challenges on return of investment \n2.5   New tools, processes and procedures \n2.6   New people in the organization \n3.  People who could provide \ninput \nMay include: \n3.1   Leaders \n3.2   Managers \n3.3   Specialists \n3.4   Associates \n3.5   Researchers \n3.6   Supervisors \n3.7   Staff \n3.8   Consultants (external) \n3.9   People outside the organization in the same field or \nsimilar expertise/industry \n3.10 Clients \n4.  Critical inquiry method \nMay include: \n4.1   Preparation \n4.2   Discussion \n4.3   Clarification of goals \n4.4   Negotiate towards a Win-Win outcome \n4.5   Agreement \n4.6   Implementation of a course of action \n4.7   Effective verbal communication. See our pages: \nVerbal Communication and Effective Speaking \n4.8   Listening \n4.9   Reducing misunderstandings is a key part of \neffective negotiation \n4.10 Rapport Building \n4.11 Problem Solving \n4.12 Decision Making \n4.13 Assertiveness \n4.14 Dealing with Difficult Situations \n5.  Reporting skills \nMay include: \n5.1   Data management \n5.2   Coding \n5.3   Data analysis and interpretation\n\n--- PDF PAGE 26 ---\nTR - Aquaculture (Hatchery Operation) NC II Revision 00       Promulgated       (06/09/2020)       22 \nVARIABLE \nRANGE \n5.4   Coherent writing \n5.5   Speaking \n \n \nEVIDENCE GUIDE \n \n1.  Critical aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1   Identified opportunities to do things better. \n1.2   Discussed and developed ideas with others on how to \ncontribute to workplace innovation. \n1.3   Integrated ideas for change in the workplace. \n1.4   Analyzed and reported rooms for innovation and learning \nin the workplace. \n2.  Resource \nImplications \nThe following resources should be provided: \n2.1   Pens, papers and writing implements \n2.2   Cartolina \n2.3   Manila papers \n3.  Methods of \nAssessment \nCompetency in this unit may be assessed through: \n3.1   Psychological and behavioral Interviews \n3.2   Performance Evaluation \n3.3   Life Narrative Inquiry \n3.4   Review of portfolios of evidence and third-party workplace \nreports of on-the-job performance \n3.5   Sensitivity analysis \n3.6   Organizational analysis \n3.7   Standardized assessment of character strengths and \nvirtues applied \n4.  Context for \nAssessment \n4.1   Competency may be assessed individually in the actual \nworkplace or simulation environment in TESDA \naccredited institutions.\n",
