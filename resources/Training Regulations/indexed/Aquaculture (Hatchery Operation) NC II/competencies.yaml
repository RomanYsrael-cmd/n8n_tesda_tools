        "evidence_guide": {
          "source_text": "1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Identified opportunities to do things better.\n1.2 Discussed and developed ideas with others on how to\ncontribute to workplace innovation.\n1.3 Integrated ideas for change in the workplace.\n1.4 Analyzed and reported rooms for innovation and learning\nin the workplace.\n2. Resource\nImplications\nThe following resources should be provided:\n2.1 Pens, papers and writing implements\n2.2 Cartolina\n2.3 Manila papers\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1 Psychological and behavioral Interviews\n3.2 Performance Evaluation\n3.3 Life Narrative Inquiry\n3.4 Review of portfolios of evidence and third-party workplace\nreports of on-the-job performance\n3.5 Sensitivity analysis\n3.6 Organizational analysis\n3.7 Standardized assessment of character strengths and\nvirtues applied\n4. Context for\nAssessment\n4.1 Competency may be assessed individually in the actual\nworkplace or simulation environment in TESDA\naccredited institutions.\n\n--- PDF PAGE 27 ---\nTR - Aquaculture (Hatchery Operation) NC II Revision 00 Promulgated (06/09/2020) 23\n\nUNIT OF COMPETENCY\n:\nPRESENT RELEVANT INFORMATION\n\nUNIT CODE\n:"
        },
        "source_text": "400311214\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes\nrequired to make a pro-active and positive\ncontribution to workplace innovation.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Identify\nopportunities to do\nthings better\n1.1 Opportunities for\nimprovement are\nidentified\nproactively in own\narea of work.\n1.2 Information are\ngathered and\nreviewed which\nmay be relevant to\nideas and which\nmight assist in\ngaining support for\nidea.\n1.1 Roles of\nindividuals in\nsuggesting and\nmaking\nimprovements.\n1.2 Positive impacts\nand challenges in\ninnovation.\n1.3 Types of changes\nand responsibility.\n1.4 Seven habits of\nhighly effective\npeople.\n1.1 Identifying\nopportunities to\nimprove and to\ndo things better.\nInvolvement\n1.2 Identifying the\npositive impacts\nand the\nchallenges of\nchange and\ninnovation\n1.3 Identifying\nexamples of the\ntypes of changes\nthat are within\nand outside own\nscope of\nresponsibility\n2. Discuss and\ndevelop ideas with\nothers\n2.1 People who could\nprovide input to\nideas for\nimprovements are\nidentified.\n2.2 Ways of\napproaching people\nto begin sharing\nideas are selected.\n2.3 Meeting is set with\nrelevant people.\n2.4 Ideas for follow up\nare review and\nselected based on\nfeedback.\n2.5 Critical inquiry\nmethod is used to\ndiscuss and\ndevelop ideas with\nothers.\n2.1 Roles of\nindividuals in\nsuggesting and\nmaking\nimprovements\n2.2 Positive impacts\nand challenges in\ninnovation\n2.3 Types of changes\nand responsibility.\n2.4 Seven habits of\nhighly effective\npeople\n2.1 Identifying\nopportunities to\nimprove and to\ndo things better.\nInvolvement\n2.2 Identifying the\npositive impacts\nand the\nchallenges of\nchange and\ninnovation\n2.3 Providing\nexamples of the\ntypes of changes\nthat are within\nand outside own\nscope of\nresponsibility\n2.4 Communicating\nid