        },
        "source_text": "400311212\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes\nrequired to apply problem-solving techniques to\ndetermine the origin of problems and plan for their\nresolution. It also includes addressing procedural\nproblems through documentation, and referral.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Identify routine\nproblems\n1.1 Routine problems\nor procedural\nproblem areas are\nidentified.\n1.2 Problems to be\ninvestigated are\ndefined and\ndetermined.\n1.3 Current conditions\nof the problem are\nidentified and\ndocumented.\n1.1 Current industry\nhardware and\nsoftware products\nand services\n1.2 Industry\nmaintenance,\nservice and\nhelpdesk\npractices,\nprocesses and\nprocedures\n1.3 Industry standard\ndiagnostic tools\n1.4 Malfunctions and\nresolutions\n1.1 Identifying\ncurrent industry\nhardware and\nsoftware\nproducts and\nservices\n1.2 Identifying\ncurrent industry\nmaintenance,\nservices and\nhelpdesk\npractices,\nprocesses and\nprocedures.\n1.3 Identifying\ncurrent industry\nstandard\ndiagnostic tools\n1.4 Describing\ncommon\nmalfunctions and\nresolutions.\n1.5 Determining the\nroot cause of a\nroutine\nmalfunction\n2. Look for solutions\nto routine\nproblems\n2.1 Potential solutions\nto problem are\nidentified.\n2.2 Recommendations\nabout possible\nsolutions are\ndeveloped,\ndocumented,\nranked and\npresented to\n2.1 Current industry\nhardware and\nsoftware products\nand services\n2.2 Industry service\nand helpdesk\npractices,\nprocesses and\nprocedures\n2.1 Identifying\ncurrent industry\nhardware and\nsoftware\nproducts and\nservices\n2.2 Identifying\nservices and\nhelpdesk\npractices,\n\n--- PDF PAGE 17 ---\nTR - Aquaculture (Hatchery Operation) NC II Revision 00 Promulgated (06/09/2020) 13\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\nappropriate\nperson for\ndecision.\n2.3 Operating\nsystems\n2.4 Industry standard\ndiagnostic tools\n2.5 Malfunctions and\nresolutions.\n2.6 Root cause\nanalysis\nprocesses and\nprocedures.\n\n2.3 Identifying\noperating system\n2.4 Identifying\ncurrent industry\nstandard\ndiagnostic tools\n2.5 Describing\ncommon\nmalfunctions and\nresolutions.\n2.6 Determining the\nroot cause of a\nroutine\nmalfunction\n3. Recommend\nsolutions to\nproblems\n3.1 Implementation of\nsolutions are\nplanned.\n3.2 Evaluation of\nimplemented\nsolutions are\nplanned.\n3.3 Recommended\nsolutions are\ndocumented and\nsubmit to\nappropriate person\nfor confirmation.\n3.1 Standard\nprocedures\n3.2 Documentation\nproduce\n3.1 Producing\ndocumentation\nthat\nrecommends\nsolutions to\nproblems\n3.2 Following\nestablished\nprocedures\n\n--- PDF PAGE 18 ---\nTR - Aquaculture (Hatchery Operation) NC II Revision 00 Promulgated (06/09/2020) 14\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Problems/Procedural\nProblem\nMay include:\n1.1 Routine/non – routine processes and quality\nproblems\n1.2 Equipment selection, availability and failure\n1.3 Teamwork and work allocation problem\n1.4 Safety and emergency situations and incidents\n1.5 Work-related problems outside of own work area\n2. Appropriate person\nMay include:\n2.1 Supervisor or manager\n2.2 Peers/work colleagues\n2.3 Other members of the organization\n3. Document\nMay include:\n3.1 Electronic mail\n3.2 Briefing notes\n3.3 Written report\n3.4 Evaluation report\n4. Plan\nMay include:\n4.1 Priority requirements\n4.2 Co-ordination and feedback requirements\n4.3 Safety requirements\n4.4 Risk assessment\n4.5 Environmental requirements\n\n--- PDF PAGE 19 ---\nTR - Aquaculture (Hatchery Operation) NC II Revision 00 Promulgated (06/09/2020) 15\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Determined the root cause of a routine problem\n1.2 Identified solutions to procedural problems.\n1.3 Produced documentation that recommends solutions to\nproblems.\n1.4 Followed established procedures.\n1.5 Referred unresolved problems to support persons.\n2. Resource\nImplications\n2.1 Assessment will require access to a workplace over an\nextended period, or a suitable method of gathering\nevidence of operating ability over a range of situations.\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1 Case Formulation\n3.2 Life Narrative Inquiry\n3.3 Standardized test\nThe unit will be assessed in a holistic manner as is practical and\nmay be integrated with the assessment of other relevant units of\ncompetency. Assessment will occur over a range of situations,\nwhich will include disruptions to normal, smooth operation.\nSimulation may be required to allow for timely assessment of\nparts of this unit of competency. Simulation should be based on\nthe actual workplace and will include walk through of the\nrelevant competency components.\n4. Context for\nAssessment\n4.1 Competency may be assessed individually in the actual\nworkplace or simulation environment in TESDA accredited\ninstitutions.\n\n--- PDF PAGE 20 ---\nTR - Aquaculture (Hatchery Operation) NC II Revision 00 Promulgated (06/09/2020) 16\n\nUNIT OF COMPETENCY\n:\nDEVELOP CAREER AND LIFE DECISIONS\n\nUNIT CODE\n:"
