re is\nmonitored following\nGAqP.\n1.3 Fertilizers are\nweighed for natural\nfood based on the\nscale of culture.\n1.1 Starter culture\n1.2 Density of culture\n1.3 Procedure in\nmonitoring\ndensity of culture\n1.4 Good Aquaculture\nPractices (GAqP)\n1.5 Kinds of Fertilizer\n1.6 Kinds of Natural\nFood\n1.1 Sourcing and\nacquiring starter\nculture\n1.2 Preparing stock\nsolution of\nnutrients for\nmicro-algae\n1.3 Preparing light\nbank\n1.4 Producing new\nbatch of starter\nculture\n2. Conduct mass\nculture of natural\nfood\n2.1 Required density of\nnatural food is\nstocked according\nto instructions from\nimmediate\nauthority.\n2.2 Methods of mass\nculture production\nare employed\naccording to\nindustry practices\nand species.\n2.3 Natural food\nproduction is\nmonitored following\nworkplace\nrequirement.\n2.4 Containers are\nprepared following\nindustry\nprocedures.\n2.5 Cultures are\ntransferred\nprogressively to\nbigger containers to\n2.1 Density of natural\nfood\n2.2 Stocking\nprocedure\n2.3 Methods of mass\nculture production\n2.4 Production of\nnatural food\nproduction\n2.5 Procedure in\ntransferring\nmicro-algae\n2.1 Preparing algal\ntank\n2.2 Inoculating algal\ntank with micro-\nalgae\n2.3 Transferring\nmicro-algae to\nrotifer tank\n2.4 Inoculating rotifer\ntank with\nbrachionus\n\n--- PDF PAGE 56 ---\nTR - Aquaculture (Hatchery Operation) NC II Revision 00 Promulgated (06/09/2020) 52\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\nincrease the\nvolume.\n3. Provide quality\nwater condition\n3.1 Aeration is provided\nto maintain water\ncirculation and\noxygenation\naccording to GAqP.\n3.2 Water temperature\nis maintained\nfollowing industry\nprocedures.\n3.3 Water salinity is\nadjusted following\nindustry practices.\n3.1 Aeration\n3.2 Maintenance of\nwater circulation\nand oxygenation\n3.3 Maintenance of\nwater\ntemperature\n3.4 Procedure in\nadjusting water\nsalinity\n3.1 Providing\naeration for\nwater circulation\nand oxygenation\n3.2 Maintaining\nwater\ntemperature\n3.3 Adjusting water\nsalinity\n4. Hatch and harvest\nartemia nauplii\n4.1 Artemia hatching is\nprepared following\nworkplace\nrequirement.\n4.2 Artemia cysts\nrequirement is\ncomputed following\nestablished\naquaculture\npractices.\n4.3 Density is\nmonitored and\nrecorded following\nworkplace\nprocedures.\n4.4 Artemia nauplii are\ngathered and\nseparated for\nfeeding based on\nGAqP.\n4.1 Preparation of\nartemia hatching\n4.2 Artemia cysts\nrequirements\n4.3 Good Aquaculture\nPractices (GAqP)\n4.4 Density\nmonitoring and\nrecording\n4.5 Procedure in\ngathering and\nseparating\nartemia nauplii\n4.1 Preparing\nartemia hatching\ntank\n4.2 Computing\nartemia\nrequirement\n4.3 Disinfecting\nartemia cyst\n4.4 Aerating and\nhatching artemia\ncyst\n4.5 Separating\nnauplii\n\n--- PDF PAGE 57 ---\nTR - Aquaculture (Hatchery Operation) NC II Revision 00 Promulgated (06/09/2020) 53\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Fertilizers\nFertilizers may include but not limited to:\n1.1 Urea 46-0-0\n1.2 Ammonium phosphate 16-20-0\n1.3 Ammonium sulfate 21-0-0\n2. Natural food\nNatural food includes:\n2.1 Micro-algae\n2.1.1 Green algae\n2.1.2 Brown algae (diatoms)\n2.2 Brachionus sp. (marine)\n2.3 Moina sp. (freshwater)\n3. Preparation of containers\nPreparation of containers may include but not limited to:\n2.1 Cleaning\n2.2 Sanitation\n2.3 Labeling of volume and date\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Prepared hatchery tanks.\n1.1.1 Cleaned and disinfected tanks.\n1.1.2 Installed filter bags in water inlet.\n1.1.3 Installed screen on drainage pipes.\n1.1.4 Filled tank with water.\n1.1.5 Installed aeration system.\n1.2 Prepared hatchery facilities.\n1.2.1 Prepared tools and materials.\n1.2.2 Conducted inspection activities of facilities.\n1.2.3 Performed minor repairs.\n1.2.4 Reported major breakdowns in the facilit