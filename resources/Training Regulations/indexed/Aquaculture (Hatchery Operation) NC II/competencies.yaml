        "source_text": "AFF321203\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes\nrequired to perform basic workplace calculations.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Perform estimation\n1.1 Job requirements\nare identified from\nwritten or oral\ncommunications.\n1.2 Quantities of\nmaterials and\nresources required\nto complete a work\ntask are estimated.\n1.3 The time needed to\ncomplete a work\nactivity is\nestimated.\n1.4 Accurate estimate\nfor work completion\nare made.\n1.5 Estimate of\nmaterials and\nresources are\nreported to\nappropriate person.\n1.1 Job requirements/\nlabor needs\n1.2 Calculation of\nquantities of\nmaterials and\nresources\nrequired\n1.3 Calculation of\ntime for job\ncompletion\n1.4 Preparation of\nestimate report\n1.5 Basic\nmathematical\noperations\n1.6 Percentage and\nratios\n1.7 Unit Conversion\n1.1 Identifying job\nrequirements/\nlabor\n1.2 Estimating\nquantities of\nmaterials and\nresources\nrequired\n1.3 Estimating time\nfor job\ncompletion\n1.4 Performing basic\ncalculation\n1.5 Compute\npercentage\n1.6 Convert English\nto metric\nsystems of\nmeasurement\n1.7 Preparing\nestimate report\n2. Perform basic\nworkplace\ncalculation\n1.1 System and units\nof measurement to\nbe followed are\nascertained.\n1.2 Calculation needed\nto complete work\ntasks are performed\nusing the four\nbasic\nmathematical\noperation.\n1.3 Calculate whole\nfraction, percentage\nand mixed when\nare used to\ncomplete the\ninstructions.\n2.1 Four basic\nmathematical\noperation\n2.2 System and units\nof measurement\n2.3 Fraction,\npercentage and\nratio\n2.4 Material take-off\n2.5 Materials costing\n2.1 Compute bill of\nmaterials\n2.2 Compute project\ncost\n\n--- PDF PAGE 49 ---\nTR - Aquaculture (Hatchery Operation) NC II Revision 00 Promulgated (06/09/2020) 45\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\n