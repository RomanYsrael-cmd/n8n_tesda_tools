        "source_title": "WORK IN TEAM ENVIRONMENT",
        "source_text": "--- PDF PAGE 12 ---\nTR - Aquaculture (Hatchery Operation) NC II Revision 00       Promulgated       (06/09/2020)       8 \n \nUNIT OF COMPETENCY \n: \nWORK IN TEAM ENVIRONMENT \n \n \n \nUNIT CODE \n: \n400311211 \n \n \n \nUNIT DESCRIPTOR \n: \nThis unit covers the skills, knowledge and attitudes \nto identify one’s roles and responsibilities as a \nmember of a team. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1.  Describe team role \nand scope \n1.1  The role and \nobjective of the \nteam is identified \nfrom available \nsources of \ninformation. \n1.2  Team parameters, \nreporting \nrelationships and \nresponsibilities are \nidentified from team \ndiscussions and \nappropriate external \nsources. \n1.1  Group structure \n1.2  Group \ndevelopment \n1.3  Sources of \ninformation \n1.1  Communicating \nwith others, \nappropriately \nconsistent with \nthe culture of the \nworkplace \n1.2  Developing ways \nin improving \nwork structure \nand  performing \nrespective roles \nin the group or \norganization \n2.  Identify one’s role \nand responsibility \nwithin a team \n2.1  Individual roles and \nresponsibilities \nwithin the team \nenvironment are \nidentified. \n2.2  Roles and \nobjectives of the \nteam is identified \nfrom available \nsources of \ninformation. \n2.3  Team parameters, \nreporting \nrelationships and \nresponsibilities are \nidentified based on \nteam discussions \nand appropriate \nexternal sources. \n2.1  Team roles and \nobjectives  \n2.2  Team structure \nand parameters \n2.3  Team \ndevelopment \n2.4  Sources of \ninformation \n2.1  Communicating \nwith others, \nappropriately \nconsistent with \nthe culture of the \nworkplace \n2.2  Developing ways \nin improving \nwork structure \nand performing \nrespective roles \nin the group or \norganization \n3.  Work as a team \nmember \n3.1  Effective and \nappropriate forms \nof communications \nare used and \ninteractions \nundertaken with \n3.1  Communication \nProcess \n3.2  Workplace \ncommunication \nprotocol \n3.1  Communicating \nappropriately, \nconsistent with \nthe culture of the \nworkplace\n\n--- PDF PAGE 13 ---\nTR - Aquaculture (Hatchery Operation) NC II Revision 00       Promulgated       (06/09/2020)       9 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \nteam members \nbased on company \npractices. \n3.2  Effective and \nappropriate \ncontributions made \nto complement \nteam activities and \nobjectives, based \non workplace \ncontext. \n3.3  Protocols in \nreporting are \nobserved based on \nstandard company \npractices. \n3.4  Contribute to the \ndevelopment of \nteam work plans \nbased on an \nunderstanding of \nteam’s role and \nobjectives. \n3.3  Team planning \nand decision \nmaking \n3.4  Team thinking \n3.5  Team roles \n3.6  Process of team \ndevelopment \n3.7  Workplace \ncontext \n3.2  Interacting \neffectively with \nothers \n3.3  Deciding as an \nindividual and as \na group using \ngroup think \nstrategies and \ntechniques \n3.4  Contributing to \nResolution of \nissues and \nconcerns\n\n--- PDF PAGE 14 ---\nTR - Aquaculture (Hatchery Operation) NC II Revision 00       Promulgated       (06/09/2020)       10 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.  Role and objective of \nteam \nMay include: \n1.1   Work activities in a team environment with \nenterprise or specific sector \n1.2   Limited discretion, initiative and judgement maybe \ndemonstrated on the job, either individually or in a \nteam environment \n2.  Sources of information \nMay include: \n2.1   Standard operating and/or other workplace \nprocedures \n2.2   Job procedures \n2.3   Machine/equipment manufacturer’s specifications \nand instructions \n2.4   Organizational or external personnel \n2.5   Client/supplier instructions \n2.6   Quality standards \n2.7   OHS and environmental standards \n3.  Workplace context \nMay include: \n3.1   Work procedures and practices \n3.2   Conditions of work environments \n3.3   Legislation and industrial agreements \n3.4   Standard work practice including the storage, safe \nhandling and disposal of chemicals \n3.5   Safety, environmental, housekeeping and quality \nguidelines\n\n--- PDF PAGE 15 ---\nTR - Aquaculture (Hatchery Operation) NC II Revision 00       Promulgated       (06/09/2020)       11 \nEVIDENCE GUIDE \n \n1.  Critical aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1   Worked in a team to complete workplace activity \n1.2   Worked effectively with others \n1.3   Conveyed information in written or oral form \n1.4   Selected and used appropriate workplace language \n1.5   Followed designated work plan for the job \n2.  Resource \nImplications \nThe following resources should be provided: \n2.1   Access to relevant workplace or appropriately simulated \nenvironment where assessment can take place \n2.2   Materials relevant to the proposed activity or tasks \n3.  Methods of \nAssessment \nCompetency in this unit may be assessed through: \n3.1   Role play involving the participation of individual member \nto the attainment of organizational goal \n3.2   Case studies and scenarios as a basis for discussion of    \nissues and strategies in teamwork \n3.3   Socio-drama and socio-metric methods \n3.4   Sensitivity techniques \n3.5   Written Test \n4.   Context for \nAssessment \n4.1   Competency may be assessed in workplace or in a \nsimulated workplace setting \n4.2   Assessment shall be observed while task are being \nundertaken whether individually or in group\n",
