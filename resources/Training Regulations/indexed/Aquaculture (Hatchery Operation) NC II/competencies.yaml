ills and attitudes\nrequired to perform safety measures effectively and\nefficiently. It includes identifying areas, tools,\nmaterials, time and place in performing safety\nmeasures.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Determine areas of\nconcern for safety\nmeasures\n1.1 Work tasks are\nidentified in line\nwith farm\noperations.\n1.2 Place for safety\nmeasures are\ndetermined in line\nwith farm\noperations.\n1.3 Time for safety\nmeasures are\ndetermined in line\nwith farm\noperations.\n1.4 Appropriate tools,\nmaterials and\noutfits are\nprepared in line\nwith job\nrequirements.\n1.1 Different work\ntasks in farm\noperations\n1.2 Place and time for\nimplementation of\nsafety measures\n1.3 Different hazards\nin the workplace\n1.4 Types of tools,\nmaterials and\noutfits\n1.5 Preparation of\ntools, materials\nand outfits\n1.1 Identifying work\ntasks in farm\noperations\n1.2 Determining\nplace and time\nfor\nimplementation\nof safety\nmeasures\n1.3 Reading labels,\nmanuals and\nother basic\nsafety\ninformation\n1.4 Identifying\neffective/\nfunctional tools,\nmaterials and\noutfit\n1.5 Preparing tools,\nmaterials and\noutfits\n1.6 Discarding\ndefective tools,\nand materials\n2. Apply appropriate\nsafety measures\n2.1 Tools and materials\nare used according\nto specifications\nand procedures.\n2.2 Outfits are worn\naccording to farm\nrequirements.\n2.3 Effectivity/shelf\nlife/expiration of\n2.1 Uses and\nfunctions of tools\n2.2 Outfits and how to\nwear it\n2.3 Expiration/shelf\nlife of materials\n2.4 Proper disposal of\nexpired materials\n2.1 Using tools and\nmaterials in the\nworkplace\n2.2 Wearing of\noutfits\n2.3 Observing\nexpiration/shelf\nlife of materials\n2.4 Disposing of\nexpired materials\n\n--- PDF PAGE 42 ---\nTR - Aquaculture (Hatchery Operation) NC II Revision 00 Promulgated (06/09/2020) 38\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in