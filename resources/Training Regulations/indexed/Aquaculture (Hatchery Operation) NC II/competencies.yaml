06/09/2020)       64 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.  Hatchery produce \nHatchery produce includes: \n1.1   Eggs \n1.2   Fry \n1.3   Post-larvae \n \n \nEVIDENCE GUIDE \n \n1.  Critical aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1   Harvested larvae and fry. \n1.1.1   Prepared hatchery harvesting equipment, \nparaphernalia appropriate to stage of stock. \n1.1.2   Monitored morphological features. \n1.1.3   Collected post-larvae and fry. \n1.1.4   Conditioned and counted post-larvae and fry. \n1.1.5   Performed recordkeeping. \n1.2   Coordinated dispersal of hatchery produce. \n1.2.1   Confirmed dispersal transactions. \n1.2.2   Arranged pick-up and delivery schedule. \n1.2.3   Secured forms and documents on dispersal \narrangements. \n1.2.4   Handled hatchery produce. \n1.2.5   Performed basic bookkeeping. \n1.3   Restored aquaculture hatchery facilities. \n1.3.1   Cleaned and stored tools. \n1.3.2   Disinfected equipment and facilities. \n1.3.3   Applied safety practices. \n1.3.4   Performed waste management. \n2.  Resource \nImplications \nThe following resources should be provided: \n2.1   Actual or simulated Hatchery facilities \n2.2   Tools, materials and equipment needed to perform \nrequired tasks \n2.3   References and manuals \n2.4   PPE \n3.  Methods of \nAssessment \nCompetency in this unit may be assessed through: \n3.1   Written examination \n3.2   Demonstration \n3.3   Oral questioning \n4.  Context for \nAssessment \n4.1   Competency may be assessed individually in the actual \nworkplace or simulation environment in TESDA accredited \ninstitutions.\n",
