es contract\n5.4 Farm emergency procedures\n6. Hazards\n6.1 Chemical\n6.2 Electrical\n6.3 Falls\n\n--- PDF PAGE 44 ---\nTR - Aquaculture (Hatchery Operation) NC II Revision 00 Promulgated (06/09/2020) 40\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Determined areas of concern for safety measures\n1.2 Applied appropriate safety measures according to industry\nrequirements\n1.3 Prepared tools, materials and outfit needed\n1.4 Performed proper disposal of used materials\n1.5 Cleaned and stored tools, materials and outfit in\ndesignated facilities\n2. Resource\nImplications\nThe following resources should be provided:\n2.1 Farm location\n2.2 Tools, equipment and outfits appropriate in applying safety\nmeasures\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1 Practical demonstration\n3.2 Third Party Report\n4. Context for\nAssessment\n4.1 Competency may be assessed individually in the actual\nworkplace or simulation environment in TESDA accredited\ninstitutions.\n\n--- PDF PAGE 45 ---\nTR - Aquaculture (Hatchery Operation) NC II Revision 00 Promulgated (06/09/2020) 41\n\nUNIT OF COMPETENCY\n:\nUSE FARM TOOLS AND EQUIPMENT\n\nUNIT CODE\n:\nAFF321202\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes\nrequired to use farm tools and equipment. It includes\nselection, operation and preventive maintenance of\nfarm tools and equipment.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Select and use\nfarm tools\n1.1 Appropriate farm\ntools are identified\naccording to\nrequirement/use.\n1.2 Farm tools are\nchecked for faults\nand defective tools\nreported in\naccordance with\nfarm procedures.\n1.3 Appropriate tools\nare safely used\naccording to job\nrequirements and\nmanufacturers\nconditions.\n1.1 Types and uses\nof farm tools\n1.2 Characteristics of\nfunctional tools\