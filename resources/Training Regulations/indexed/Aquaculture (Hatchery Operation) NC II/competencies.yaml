        "evidence_guide": {
          "source_text": "1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Prepared hatchery tanks.\n1.1.1 Cleaned tanks.\n1.1.2 Installed aeration.\n1.2 Prepared hatchery facilities.\n1.2.1 Performed minor repairs.\n1.2.2 Inspected and calibrated water quality monitoring\ninstruments.\n1.2.3 Applied safety practices.\n1.3 Performed water filtration and treatment.\n1.3.1 Used measuring instruments and equipment.\n1.3.2 Applied water filtration technique.\n1.3.3 Applied water treatment technique.\n2. Resource\nImplications\nThe following resources should be provided:\n2.1 Actual or simulated workplace\n2.2 Tools, instruments, supplies materials and equipment\nneeded to perform required tasks\n2.3 References and manuals\n2.4 PPEs\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1 Demonstration\n3.2 Written exam\n3.3 Oral questioning\n4. Context for\nAssessment\n4.1 Competency maybe assessed in actual workplace or at the\ndesignated TESDA accredited Assessment Center.\n\n--- PDF PAGE 55 ---\nTR - Aquaculture (Hatchery Operation) NC II Revision 00 Promulgated (06/09/2020) 51\n\nUNIT OF COMPETENCY\n:\nPRODUCE NATURAL FOODS\n\nUNIT CODE\n:"
        },
        "source_text": "AFF622309\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes\nrequired to prepare hatchery tanks and facilities,\nfilter water, chlorinate and dechlorinate water.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Prepare hatchery\ntanks\n1.1 Tanks are cleaned\nand disinfected\nfollowing GAqP.\n1.2 Filter bags are\ninstalled in water\ninlet according to\nestablished\npractices.\n1.3 Screen on drainage\npipes are installed\nbased on industry\nstandards.\n1.4 Tank is filled with\nwater according to\nstandard industry\nprocedures.\n1.5 Aeration system is\ninstalled based\nfrom GAqP.\n1.1 Proper aeration\n(water movement\nand bubbles)\n1.2 Types filter bags\nand screen (with\ndifferent mesh size)\n1.3 Installation\nprocedure of filter\nbags and drainage\npipes\n1.4 Filling-up tank\nbased on species\nrequirement\n1.5 Operation of\naeration system\n1.6 Water depth based\non species\nrequirements\n1.7 Estimation of\nairstone\n1.8 Following\nguidelines in GAqP\n1.9 GAqP on cleaning\nand disinfection of\ntanks\n1.10 OSHS on hatchery\ntank preparation\n1.11 Attitude:\n1.11.1 Honest\n1.11.2 Patient\n1.11.3 Time-\nconscious\n1.11.4 Resource-ful\n1.11.5 Obedient\n1.11.6 Focus\n1.1 Cleaning and\ndisinfecting\ntanks\n1.2 Installing filter\nbags\n1.3 Installing\nscreen on\ndrainage pipes\n1.4 Filling tank with\nwater\n1.5 Installing\naeration\nsystem\n1.6 Following\nGAqP\n1.7 Practicing\nOSHS\n\n--- PDF PAGE 52 ---\nTR - Aquaculture (Hatchery Operation) NC II Revision 00 Promulgated (06/09/2020) 48\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n2. Prepare hatchery\nfacilities\n2.1 Tools and\nmaterials are\nprepared for\nhatchery activities\naccording to work\nrequirements.\n2.2 Inspection activities\nof facilities are\nconducted for\nfunctionality\naccording to GAqP.\n2.3 Minor repairs are\nperformed\naccording to\nmanual following\nindustry practices.\n2.4 Major breakdowns\nin the facilities are\nreported to\nimmediate\nauthorities.\n2.5 Water quality\nmonitoring\ninstruments are\ninspected and\ncalibrated\naccording to\nmanual.\n2.6 Safety practices are\napplied according\nto OSHS.\n2.1 Preparation of tools\nand materials\n2.2 Inspection and\ncalibration of tools\nand instruments\n2.3 Inspection of\nfacilities\n2.4 GAqP\n2.5 Minor repairs of\nfacilities\n2.6 Major breakdowns\n2.7 Water quality\nmonitoring\ninstruments\n2.8 OSHS\n2.1 Conducting\ninspection\nactivities\n2.2 Installing\naeration\naccessories\n2.3 Performing\nminor repairs\n2.4 Reporting\nmajor\nbreakdowns in\nthe facilities\n2.5 Inspecting and\ncalibrating\nwater quality\nmonitoring\ninstruments\n2.6 Applying safety\npractices\n3. Perform water\nfiltration and\ntreatment\n3.1 Water filtration\ntechnique is applied\nfollowing GAqP.\n3.2 Water treatment\ntechnique is\napplied following\nGAqP.\n3.3 Chlorine test for\nfiltered water is\nperformed\naccording to\nindustry practices.\n3.4 Safety practices are\napplied following\nOSHS\n3.5 Filtered water is UV\ntreated.\n3.1 Water filtration\ntechnique\n3.2 Water treatment\ntechnique\n3.3 Procedure in\nchlorine testing\nfiltered water\n3.4 UV treatment\nprocedure\n3.5 OSHS\n3.6 GAqP\n3.1 Filtering sea\nwater using\nrapid sand filter\n3.2 Back washing\nrapid sand filter\n3.3 Chlorinating\nand\ndechlorinating\nfiltered sea\nwater in\nreservoir\n3.4 Use chlorine\ntest kit\n3.5 Conducting\nozonation and\nUV treatment\nto filtered sea\nwater\n\n--- PDF PAGE 53 ---\nTR - Aquaculture (Hatchery Operation) NC II Revision 00 Promulgated (06/09/2020) 49\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Tools and materials\nTools and materials may include:\n\n1.1 Tools\n1.1.1 Filter bags\n1.1.2 Scoop nets\n1.1.3 Basin\n1.1.4 Pail\n1.1.5 Fish tubs\n1.1.6 Small bowl\n1.1.7 Screen\n1.1.8 Air hose\n1.1.9 Air stone\n1.1.10 Air connector\n1.1.11 Seine net\n1.1.12 Thermometer\n1.1.13 Microscope\n1.1.14 Haemocythometer\n1.1.15 Counting chamber\n1.1.16 Glass slides\n1.1.17 Hatching jar\n\n1.2 Materials for cleaning and disinfection:\n1.2.1 Push brush\n1.2.2 Chlorine powder and liquid\n1.2.3 Bleach\n1.2.4 Sponge\n1.2.5 Scouring pads\n1.2.6 Detergent bar and powder\n2. Facilities\nFacilities includes:\n2.1 Water line\n2.2 Aeration line\n2.3 Filter system\n2.4 Water pumps\n2.5 Air blowers\n2.6 Emergency power system\n2.7 Culture tanks\n2.8 drainage system\n2.9 Lighting system\n3. Minor repairs\nMinor repairs may include:\n3.1 Centrifugal pumps repair\n3.2 Minor electrical repair\n3.3 Minor plumbing repair\n3.4 Net mending and patching\n3.5 Minor carpentry\n4. Water quality monitoring\ninstruments\nWater quality monitoring instruments may include but not\nlimited to:\n4.1 DO meter\n\n--- PDF PAGE 54 ---\nTR - Aquaculture (Hatchery Operation) NC II Revision 00 Promulgated (06/09/2020) 50\nVARIABLE\nRANGE\n4.2 pH meter\n4.3 Refractometer\n5. Water treatment\ntechnique\nWater treatment technique may include:\n5.1 Chlorination\n5.2 Dechlorination\n5.3 Ozonation\n5.4 UV treatment\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Prepared hatchery tanks.\n1.1.1 Cleaned tanks.\n1.1.2 Installed aeration.\n1.2 Prepared hatchery facilities.\n1.2.1 Performed minor repairs.\n1.2.2 Inspected and calibrated water quality monitoring\ninstruments.\n1.2.3 Applied safety practices.\n1.3 Performed water filtration and treatment.\n1.3.1 Used measuring instruments and equipment.\n1.3.2 Applied water filtration technique.\n1.3.3 Applied water treatment technique.\n2. Resource\nImplications\nThe following resources should be provided:\n2.1 Actual or simulated workplace\n2.2 Tools, instruments, supplies materials and equipment\nneeded to perform required tasks\n2.3 References and manuals\n2.4 PPEs\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1 Demonstration\n3.2 Written exam\n3.3 Oral questioning\n4. Context for\nAssessment\n4.1 Competency maybe assessed in actual workplace or at the\ndesignated TESDA accredited Assessment Center.\n\n--- PDF PAGE 55 ---\nTR - Aquaculture (Hatchery Operation) NC II Revision 00 Promulgated (06/09/2020) 51\n\nUNIT OF COMPETENCY\n:\nPRODUCE NATURAL FOODS\n\nUNIT CODE\n:"
      }
