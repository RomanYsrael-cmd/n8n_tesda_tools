  "source_section_text": "SECTION 1 AQUACULTURE (HATCHERY OPERATION) NC II QUALIFICATION\n\nThe AQUACULTURE (HATCHERY OPERATION) NC II Qualification consists of\ncompetencies that a person must achieve to operate an aquaculture hatchery with the\nfollowing species: milk fish (bangus), carp, silver perch (apahap), snapper, freshwater prawn\n(ulang), tiger shrimp, and pompano. It consists of preparing culture tanks and hatchery\nfacilities, chlorinating and dechlorinating filtered sea water, conducting ozonation and UV\ntreatment, sourcing and acquiring starter culture, scaling-up culture, harvesting brachionus,\nseparating nauplii, sourcing broodstock, collecting eggs, feeding broodstock, practicing\nhealth management, introducing natural foods and artificial feeds, monitoring morphological\nfeatures, transferring and harvesting fry, disposing fry and restoring workplace.\n\nThis Qualification is packaged from the competency map of the Agriculture, Forestry\nand Fishery Sector as shown in Annex A.\n\nThe Units of Competency comprising this Qualification include the following:\n\nCODE NO.\nBASIC COMPETENCIES\n400311210\nParticipate in workplace communication\n400311211\nWork in team environment\n400311212\nSolve/address general workplace problems\n400311213\nDevelop career and life decisions\n400311214\nContribute to workplace innovation\n400311215\nPresent relevant information\n400311216\nPractice occupational safety and health policies and procedures\n400311217\nExercise efficient and effective sustainable practices in the\nworkplace\n400311218\nPractice entrepreneurial skills in the workplace\n\nCODE NO.\nCOMMON COMPETENCIES\nAFF321201\nApply safety measures in farm operations\nAFF321202\nUse farm tools and equipment\nAFF321203\nPerform estimation and basic calculation\n\nCODE NO.\nCORE COMPETENCIES\nAFF622309\nConduct preparatory activities\nAFF622310\nProduce natural foods\nAFF622311\nConduct broodstock management and spawning\nAFF622312\nManage feeding and maintain good health of stock\nAFF622313\nComplete hatchery operation\n\n--- PDF PAGE 6 ---\nTR - Aquaculture (Hatchery Operation) NC II Revision 00 Promulgated (06/09/2020) 2\nA person who has achieved this Qualification is competent to be:\n\n Hatchery farm worker\n Hatchery operator\n Hatchery technician\n\n--- PDF PAGE 7 ---\nTR - Aquaculture (Hatchery Operation) NC II Revision 00 Promulgated (06/09/2020) 3"
