        "source_text": "AFF622312\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes\nrequired to feed broodstock, practice health\nmanagement, introduce natural foods and artificial\nfeeds, and count, stock, and transfer fry.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Maintain breeders\n1.1 Stocking density is\ncomputed based on\nindustry practice.\n 1.2 Daily feed\nrequirement of\nbreeders are\ncomputed\naccording to growth\nstages.\n1.3 Kind of feeds\nappropriate to\ngrowth stages of\nare determined\naccording to\nindustry practice.\n1.4 Breeders are fed\nbased on weight\nand growth stages\n1.5 Measures to\nmanage health of\nbreeders are\napplied following\nindustry standards.\n1.1 Stocking density\n1.2 Daily feed\nrequirement\n1.3 Kind of feeds\n1.4 Growth stages\n1.5 Procedure in\nfeeding breeders\n1.6 Measures in\nmanaging health\nof breeders\n1.1 Computing\nstocking density\n1.2 Computing feed\nration\n1.3 Feeding\nbroodstock\n1.4 Treating lesions\nand wounds\n1.5 Practicing health\nmanagement\n2. Rear larvae, fries\nand fingerlings\n2.1 Larval stages are\ndetermined per\nspecies according\nto industry\nstandards.\n2.2 Natural foods are\nintroduced to larval\nrearing tanks\n2.3 Natural food density\nis monitored\nfollowing industry\npractice.\n2.1 Good Aquaculture\nPractices (GAqP)\n2.2 Larval stages per\nspecies\n2.3 Natural foods\n2.3.1 Density\ncomputation\n2.3.2 Density\nadjustment\n2.3.3 Monitoring\nprocedure\n2.4 Procedure in\nstocking\n2.1 Determining\nlarval stages\n2.2 Introducing\nnatural foods to\nlarval rearing\ntanks\n2.3 Monitoring\nnatural food\ndensity\n2.4 Adjusting feeding\n2.5 Introducing\nartificial feeds\n2.6 Perform\nacclimatization\n\n--- PDF PAGE 64 ---\nTR - Aquaculture (Hatchery Operation) NC II Revision 00 Promulgated (06/09/2020) 60\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n2.4 Feed size is\nadjusted based on\nlarval size.\n2.5 Artificial feeds are\nintroduced based\non requirements.\n2.5 Acclimatized post-\nlarvae are stocked\nbased species.\n2.6 Growth of fry is\nmonitored following\nindustry established\npractices.\n2.8 Fries are counted\nand stocked at\nappropriate density.\n2.9 Fries are transferred\nto nursery tanks\naccording to\nindustry practice.\n\nacclimatized post-\nlarvae\n2.6 Rearing\nrequirements and\nprocedure\n2.7 Monitoring\nprocedures for\ngrowth of fries\n2.8 Fry counting and\nstocking\n2.9 Transfer of fry\nfrom larval rearing\ntanks to nursery\ntanks\n\n2.7 Stocking\nacclimatized\npost-larvae\n2.8 Rearing fries\n2.9 Monitoring growth\nof fries\n2.10 Counting and\nstocking fry\n2.11 Transferring fry\nto nursery tanks\n\n3. Conduct water\nmanagement\n3.1 Water quality\nparameters are\nmonitored following\nindustry practices.\n3.2 Remedial actions\nare applied based\non results of water\nquality monitoring.\n3.3 Water are\nreplenished\naccording to GAqP.\n3.4 Aeration are\nmaintained\nfollowing GAqP.\n3.5 Rearing water is\nchanged following\nGAqP.\n3.1 Water quality\nparameters\n3.2 Monitoring\nprocedure\n3.3 Remedial actions\n3.4 Procedure in\nwater\nreplenishment\n3.5 Maintenance of\naeration\n3.6 Good Aquaculture\nPractices (GAqP)\n3.7 Periodic changing\nof rearing water\n3.1 Monitoring water\nquality\n3.2 Applying\nremedial actions\n3.3 Reading results\nof water quality\nmonitoring\n3.4 Replenishing\nwater\n3.5 Applying GAqP\n3.6 Maintaining\naeration\n3.7 Changing rearing\nwater\n\n--- PDF PAGE 65 ---\nTR - Aquaculture (Hatchery Operation) NC II Revision 00 Promulgated (06/09/2020) 61\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Natural foods\nNatural foods may include but not limited to:\n1.1 Artemia cyst\n1.2 Rotifers\n2. Artificial feeds\nArtificial feeds include:\n2.1 Micro pellet\n2.2 Fry booster\n3. Post-larvae\nPost larvae may include:\n3.1 Fry\n3.2 Seedlings\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Maintained breeders.\n1.1.1 Computed stocking density.\n1.1.2 Computer daily feed requirement.\n1.1.3 Determined appropriate feeds.\n1.1.4 Fed breeders.\n1.1.5 Identified measures to manage health.\n1.2 Rear larvae and fry.\n1.2.1 Changed larval rearing water.\n1.2.2 Determined larval stages.\n1.2.3 Introduced natural/live foods.\n1.2.4 Monitored natural/lived food.\n1.2.5 Shifted natural/live food to bigger sizes.\n1.2.6 Stocked acclimatized post-larvae.\n1.2.7 Reared fry.\n1.2.8 Monitored growth of fry.\n1.2.9 Counted and stocked fry.\n1.3 Conducted water management.\n1.3.1 Monitored water quality parameters.\n1.3.2 Applied remedial actions.\n1.3.3 Replenished water.\n1.3.4 Maintained aeration.\n2. Resource\nImplications\nThe following resources should be provided:\n2.1 Actual or simulated workplace\n2.2 Tools, materials and equipment needed to perform required\ntasks\n2.3 References and manuals\n2.4 PPE\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1 Written examination\n3.2 Demonstration\n3.3 Oral questioning\n4. Context for\nAssessment\n4.1 Competency may be assessed individually in the actual\nworkplace or simulation environment in TESDA accredited\ninstitutions.\n\n--- PDF PAGE 66 ---\nTR - Aquaculture (Hatchery Operation) NC II Revision 00 Promulgated (06/09/2020) 62\n\nUNIT OF COMPETENCY\n:\nCOMPLETE HATCHERY OPERATION\n\nUNIT CODE\n:"
