CE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n2.2  Analysis \ntechniques are \napplied to assess \ndata/ information. \n2.3  Trends and \nanomalies are \nidentified. \n \n2.4  Data analysis \ntechniques and \nprocedures are \ndocumented. \n2.5  \nRecommendation\ns are made on \nareas of possible \nimprovement. \n2.2  Data analysis \ntechniques/ \nprocedures \n2.3  Reporting \nrequirements to \na range of \naudiences \n \n2.4  Legislation, \npolicy and \nprocedures \nrelating to the \nconduct of \nevaluations \n2.5  Organisational \nvalues, ethics \nand codes of \nconduct \n2.2  Describing \ndata analysis \ntechniques/ \nprocedures \n2.3  Reporting \nrequirements to \na range of \naudiences \n2.4  Stating \nlegislation, \npolicy and \nprocedures \nrelating to the \nconduct of \nevaluations \n2.5  Stating \norganisational \nvalues, ethics \nand codes of \nconduct \n3.  Record and \npresent \ninformation \n3.1  Studied data/ \ninformation are \nrecorded. \n3.2  \nRecommendation\ns are analysed for \naction to ensure \nthey are \ncompatible with \nthe project’s \nscope and terms \nof reference. \n3.3  Interim and final \nreports are \nanalysed and \noutcomes are \ncompared to the \ncriteria \nestablished at the \noutset. \n3.4  Findings are \npresented to \nstakeholders. \n3.1  Data analysis \ntechniques/ \nprocedures \n3.2  Reporting \nrequirements to \na range of \naudiences \n3.3  Legislation, \npolicy and \nprocedures \nrelating to the \nconduct of \nevaluations \n3.4  Organisational \nvalues, ethics \nand codes of \nconduct \n3.1  Describing \ndata analysis \ntechniques/ \nprocedures \n3.2  Reporting \nrequirements to \na range of \naudiences \n3.3  Stating \nlegislation, \npolicy and \nprocedures \nrelating to the \nconduct of \nevaluations \n3.4  Stating \norganisational \nvalues, ethics \nand codes of \nconduct \npractices\n\n--- PDF PAGE 29 ---\nTR - Aquaculture (Hatchery Operation) NC