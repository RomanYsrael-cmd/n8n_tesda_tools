        "evidence_guide": {
          "source_text": "1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Harvested larvae and fry.\n1.1.1 Prepared hatchery harvesting equipment,\nparaphernalia appropriate to stage of stock.\n1.1.2 Monitored morphological features.\n1.1.3 Collected post-larvae and fry.\n1.1.4 Conditioned and counted post-larvae and fry.\n1.1.5 Performed recordkeeping.\n1.2 Coordinated dispersal of hatchery produce.\n1.2.1 Confirmed dispersal transactions.\n1.2.2 Arranged pick-up and delivery schedule.\n1.2.3 Secured forms and documents on dispersal\narrangements.\n1.2.4 Handled hatchery produce.\n1.2.5 Performed basic bookkeeping.\n1.3 Restored aquaculture hatchery facilities.\n1.3.1 Cleaned and stored tools.\n1.3.2 Disinfected equipment and facilities.\n1.3.3 Applied safety practices.\n1.3.4 Performed waste management.\n2. Resource\nImplications\nThe following resources should be provided:\n2.1 Actual or simulated Hatchery facilities\n2.2 Tools, materials and equipment needed to perform\nrequired tasks\n2.3 References and manuals\n2.4 PPE\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1 Written examination\n3.2 Demonstration\n3.3 Oral questioning\n4. Context for\nAssessment\n4.1 Competency may be assessed individually in the actual\nworkplace or simulation environment in TESDA accredited\ninstitutions.\n\n--- PDF PAGE 69 ---\nTR - Aquaculture (Hatchery Operation) NC II Revision 00 Promulgated (06/09/2020) 65"
        },
        "source_text": "AFF622313\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes\nrequired to harvest post larvae and fries, coordinate\ndispersal of hatchery produce and restore aquaculture\nhatchery facilities. Specifically, it includes functions such\nas monitoring morphological features, transporting,\ndisposing fry and restoring workplace.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Harvest post-larvae\nand fries\n1.1 Hatchery harvesting\nequipment and\nparaphernalia are\nprepared based on\nof stock to be\nharvested.\n1.2 Morphological\nfeatures are\nmonitored to\ndetermine stage.\n1.3 Post-larvae and\nfries are collected\nfollowing GAqP.\n1.4 Post-larvae and\nfries are\nconditioned and\ncounted for packing\nand transporting.\n1.5 Recordkeeping is\nperformed following\nworkplace\nprocedures.\n1.1 Hatchery\nharvesting\nequipment and\nparaphernalia\n1.2 Morphological\nfeatures\n1.3 Procedure in\ncollecting post-\nlarvae and fry\n1.4 Good Aquaculture\nPractices (GAqP)\n1.5 Procedure in\nconditioning and\ncounting post-\nlarvae and fry\n1.6 Procedure in\npacking and\ntransporting post-\nlarvae and fry\n1.7 Recordkeeping\nprocedure\n1.1 Monitoring\nmorphological\nfeatures\n1.2 Collecting fully\nmetamorphosed\nlarvae (fry)\n1.3 Sorting\nharvested fry\n1.4 Conditioning and\ncounting fry for\npacking\n2. Coordinate\ndispersal of\nhatchery produce\n2.1 Dispersal\ntransactions are\nconfirmed with the\nimmediate superior\nfollowing industry\nestablished\npractices.\n2.2 Pick-up and\ndelivery schedule is\narranged according\nto established\n2.1 Dispersal\ntransactions\n2.2 Procedure in\nsecuring forms\nand documents\non dispersal\narrangements\n2.3 Procedure in\narranging pick-up\nand delivery\nschedule\n2.1 Confirming\ndispersal\ntransactions\n2.2 Scheduling pick-\nup and delivery\n2.3 Securing forms\nand documents\n2.4 Handing\nhatchery\nproduce\n\n--- PDF PAGE 67 ---\nTR - Aquaculture (Hatchery Operation) NC II Revision 00 Promulgated (06/09/2020) 63\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\nenterprise\nprocedures.\n2.3 Forms and\ndocuments on\ndispersal\narrangements are\nsecured according\nto established\nindustry\nprocedures.\n2.4 Hatchery produce\nis handled during\ndispersal according\nto industry\nprocedures.\n2.5 Basic bookkeeping\nis performed\naccording to\nworkplace\nprocedures.\n2.4 Handling of\nhatchery produce\n2.5 Basic\nbookkeeping\n2.5 Conducting\nsimple book-\nkeeping\n3. Restore\naquaculture\nhatchery facilities\n3.1 Tools are cleaned\nand stored following\nenterprise\nprocedures.\n3.2 Equipment and\nfacilities are\ndisinfected based\non instructional\nmanuals and\nstanding operating\nprocedures.\n3.3 Safety practices are\napplied based on\nOSHS.\n3.4 Waste\nmanagement is\nperformed\naccording\nenvironmental rules\nand regulations.\n3.1 Procedure in\ncleaning and\nstoring tools\n3.2 Procedure in\ndisinfecting\nequipment and\nfacilities\n3.3 Instructional\nmanuals and\nstandard\noperating\nprocedures\n3.4 Occupational\nSafety and Health\nStandards\n(OSHS)\n3.5 Waste\nmanagement\n3.1 Cleaning and\nstoring tools are\ncleaned\n3.2 Disinfecting\nequipment and\nfacilities\n3.3 Applying safety\npractices\n3.4 Performing\nwaste\nmanagement\n\n--- PDF PAGE 68 ---\nTR - Aquaculture (Hatchery Operation) NC II Revision 00 Promulgated (06/09/2020) 64\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Hatchery produce\nHatchery produce includes:\n1.1 Eggs\n1.2 Fry\n1.3 Post-larvae\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Harvested larvae and fry.\n1.1.1 Prepared hatchery harvesting equipment,\nparaphernalia appropriate to stage of stock.\n1.1.2 Monitored morphological features.\n1.1.3 Collected post-larvae and fry.\n1.1.4 Conditioned and counted post-larvae and fry.\n1.1.5 Performed recordkeeping.\n1.2 Coordinated dispersal of hatchery produce.\n1.2.1 Confirmed dispersal transactions.\n1.2.2 Arranged pick-up and delivery schedule.\n1.2.3 Secured forms and documents on dispersal\narrangements.\n1.2.4 Handled hatchery produce.\n1.2.5 Performed basic bookkeeping.\n1.3 Restored aquaculture hatchery facilities.\n1.3.1 Cleaned and stored tools.\n1.3.2 Disinfected equipment and facilities.\n1.3.3 Applied safety practices.\n1.3.4 Performed waste management.\n2. Resource\nImplications\nThe following resources should be provided:\n2.1 Actual or simulated Hatchery facilities\n2.2 Tools, materials and equipment needed to perform\nrequired tasks\n2.3 References and manuals\n2.4 PPE\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1 Written examination\n3.2 Demonstration\n3.3 Oral questioning\n4. Context for\nAssessment\n4.1 Competency may be assessed individually in the actual\nworkplace or simulation environment in TESDA accredited\ninstitutions.\n\n--- PDF PAGE 69 ---\nTR - Aquaculture (Hatchery Operation) NC II Revision 00 Promulgated (06/09/2020) 65"
