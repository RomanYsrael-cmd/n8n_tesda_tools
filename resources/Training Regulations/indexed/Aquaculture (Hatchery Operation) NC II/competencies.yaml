        "source_text": "AFF622311\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes\nrequired to source and maintain broodstock, induce\nspawning and collect eggs, larvae and fry.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Source and\nmaintain\nbroodstock\n1.1 Future broodstock\nare purchased from\nreputable sources.\n1.2 Marking of\nbroodstock is\nperformed.\n1.3 Sex determination\ntechnique is\nperformed following\nindustry practices.\n1.4 Breeders are\nsegregated\naccording to sex.\n1.5 Breeders are\nselected based on\nreproductive\nmaturity.\n1.6 Breeders are\nhandled during\ntransport to\nhatchery site.\n1.1 Broodstock\n1.2 Reputable\nsources of\nbroodstock\n1.3 Sex determination\ntechnique\n1.4 Segregation of\nbreeders\n1.5 Selection of\nbreeders\n1.6 Reproductive\nmaturity of\nbreeders\n1.7 Proper handling\nof breeders\n1.1 Purchasing\nfuture\nbroodstock\n1.2 Fin clipping\nbroodstock\n1.3 Cannulating and\nsegregating\nbroodstock\n1.4 Selecting and re-\nclipping\nbroodstock\n1.5 Sedating\nbroodstock\n1.6 Transporting\nbroodstock\n2. Induce spawning\n2.1 Pre-spawning\nactivities are\nperformed following\nwork requirements.\n2.2 Spawn induction\ntechniques are\napplied based on\nthe species\nrequirement.\n2.3 Spawning of\nbreeder is\nmonitored\naccording to\nindustry\nprocedures.\n2.4 Breeder is\nseparated and\n2.1 Pre-spawning\nactivities\n2.2 Work\nrequirements\n2.3 Spawn induction\ntechniques\n2.4 Species\nrequirement\n2.5 Procedure in\nspawning breeder\n2.6 Procedure in\nseparating and\ntransferring\nbreeder\n2.7 Good Aquaculture\nPractices (GAqP)\n2.1 Selecting and\nacquiring\nhormone\n2.2 Preparing\nhormone\n2.3 Sedating fish\n2.4 Injecting\nhormone\n2.5 Returning\nsedated fish to\nspawning tank\n2.6 Monitoring brood\nstock\n2.7 Monitoring\nspawning\nactivities\n\n--- PDF PAGE 60 ---\nTR - Aquaculture (Hatchery Operation) NC II Revision 