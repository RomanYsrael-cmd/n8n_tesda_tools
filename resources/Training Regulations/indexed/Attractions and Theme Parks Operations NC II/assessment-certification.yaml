  "source_text": "SECTION 4 NATIONAL ASSESSMENT AND CERTIFICATION\n ARRANGEMENTS\n\n4.1 The qualification of ATTRACTIONS AND THEME PARKS OPERATIONS NC\nII (with cognate) may be attained through demonstration of competence in the\nfollowing Certificate of Competency (COC):\n\n4.1.1 Promoting Attractions and Theme Parks\n4.1.1.1 Provide on-site information and assistance\n4.1.1.2 Monitor entry to venue\n4.1.1.3 Provide a site briefing or scripted commentary\n\nPlus one or more of the following Certificates of Competency (COCs):\n\n4.1.2 Operating Rides\n4.1.2.1 Operate a ride location\n4.1.2.2 Load and unload a ride\n\n4.1.3 Operating Water-Based Rides\n4.1.3.1 Operate a ride location\n4.1.3.2 Load and unload a ride\n4.1.3.3 Maintain safety in water-based rides\n\n4.1.4 Operating Games\n4.1.4.1 Operate a games location\n4.1.4.2 Promote at a games location\n\n4.1.5 Operating Animal Exhibits\n4.1.5.1 Operate animal enclosure/exhibit\n4.1.5.2 Provide general animal care\n4.1.5.3 Rescue animals\n4.1.5.4 Provide customers with information on animals\n\n4.2 Successful candidates shall be awarded either of the following National\nCertificates bearing the signature of the Director General:\n\nATTRACTIONS AND THEME PARKS OPERATIONS NCII (RIDES)\nATTRACTIONS AND THEME PARKS OPERATIONS NCII\n(WATER-BASED RIDES)\nATTRACTIONS AND THEME PARKS OPERATIONS NCII (GAMES)\nATTRACTIONS AND THEME PARKS OPERATIONS NCII\n(ANIMAL EXHIBITS)\n\n4.3 Assessment shall focus on the core units of competency. The basic and\ncommon units shall be integrated or assessed concurrently with the core\nunits.\n\n--- PDF PAGE 111 ---\n_____________________________________________________________________________________________________\nATTRACTIONS AND THEME PARKS OPERATIONS NCII Promulgated November 2007 109\n\n4.4 The following are qualified to apply for assessment and certification:\n\n 4.4.1 Graduates of formal, non-formal and informal institutions\n\n including enterprise-based training programs\n\n4.4.2 Experienced workers (wage employed or self employed)\n\n4.6 The guidelines on assessment and certification are discussed in detail in the\n\"Procedures Manual on Assessment and Certification\" and \"Guidelines on\nthe Implementation of the Philippine TVET Qualification and Certification\nSystem (PTQCS)\".\n\n--- PDF PAGE 112 ---\n_____________________________________________________________________________________________________\nATTRACTIONS AND THEME PARKS OPERATIONS NCII Promulgated November 2007 110\n\nProvide\ncustomers with\ninformation on\nanimals\nProvide\ngeneral\nanimal\ncare\nCOMPETENCY MAP - TOURISM Sector\nATTRACTIONS AND THEME PARKS OPERATIONS NC II\nANNEX A\nCollect,\nanalyze and\norganize\ninformation\nPlan and\norganize work\nPromote\nenvironmental\nprotection\nUtilize\nspecialized\ncommunication\nskills\nDevelop teams\nand individuals\nApply problem-\nsolving\ntechniques in\nthe workplace\nUse\nmathematical\nconcepts and\ntechniques\nUse relevant\ntechnologies\nLead small\nteams\nDevelop and\npractice\nnegotiation\nskills\nSolve\nproblems\nrelated to work\nactivities\nPractice career\nprofessionalism\nPractice\noccupational\nhealth and safety\npractices\nLead\nworkplace\ncommunication\nParticipate in\nworkplace\ncommunication\nWork in team\nenvironment\nRoster staff\nControl and\norder stock\nPerform\ncomputer\noperations\nPerform\nworkplace and\nsafety practices\nProvide\neffective\ncustomer\nservice\nDevelop and\nupdate\nindustry\nknowledge\nObserve\nworkplace\nhygiene\nprocedures\nBASIC\nCOMPETENCIES\nCOMMON\nCOMPETENCIES\nCORE\nCOMPETENCIES\nEstablish and\nconduct\nbusiness\nrelationships\nTrain small\ngroups\nConduct\nassessment\nManage\nworkplace\ndiversity\nManage\nfinances within\na budget\nManage\nquality\ncustomer\nservice\n\nDevelop an\nevent concept\nDevelop event\nprogram\nSelect event\nvenue and site\nProvide porter\nservices\nPlan and develop\nevent proposal\nand bid\nConduct night\naudit\nProvide club\nreception\nservices\nManage\ncontractors for\nindoor events\nDevelop and\nupdate\nknowledge on\nprotocol\nProvide on-site\nevent\nmanagement\nservices\nDevelop and\nupdate event\nindustry\nknowledge\n\nAccompany and\nguide visitors in\naccordance with\nthe tour itinerary\nReceive and\nprocess\nreservations\nOperate\ncomputerized\nreservations\nsystem\nIssue air sea\nland tickets and\nmulti-purpose\ndocuments\nResearch\ninformation\nrelevant to tour\nitinerary\nBook travel-\nrelated\nreservation\nAdminister\nbilling and\nsettlement\nplan\nProvide\naccommodation\nreception\nservices\nManage\narrangements for\nvisitors\n\nProvide a site\nbriefing or\nscripted\ncommentary\nOperate a ride\nlocation\nLoad and\nunload a ride\nProvide on-site\ninformation and\nassistance\nMonitor entry to\nvenue\nOperate a\ngames location\nMaintain safety\nin water-based\nrides\n Operate animal\nenclosure/\nexhibit\nPromote at a\ngames location\nRescue\nanimals\n\n--- PDF PAGE 113 ---\n_____________________________________________________________________________________________________\nATTRACTIONS AND THEME PARKS OPERATIONS NCII Promulgated November 2007 111\n\nDEFINITION OF TERMS\n\n1. ANIMAL HUSBANDRY – breeding and raising livestock\n\n2. BOLLARDS – short, vertical posts\n\n3. DUTY OF CARE - may be considered a formalization of the implicit\nresponsibilities held by an individual towards another individual within society\n\n4. OHS – Occupational Heath and Safety\n\n5. PNRC – Philippine National Red Cross\n\n--- PDF PAGE 114 ---\n_____________________________________________________________________________________________________\nATTRACTIONS AND THEME PARKS OPERATIONS NCII Promulgated November 2007 112\n\nACKNOWLEDGMENTS\n\nThe Technical Education and Skills Development Authority (TESDA) wishes\nto extend thanks and appreciation to the many representatives of business, industry,\nacademe and government agencies who donated their time and expertise to the\ndevelopment and validation of these Training Regulations.\n\