ormance by the candidate.\n6. Context for\nassessment\n6.1 Competency assessment may occur in workplace or any\nappropriately simulated environment.\n6.2 Assessment may be performed on multiple occasions\ninvolving a combination of direct, indirect and supplementary\nforms of evidence.\n\n--- PDF PAGE 83 ---\n_____________________________________________________________________________________________________\nATTRACTIONS AND THEME PARKS OPERATIONS NCII Promulgated November 2007 81\n\nUNIT OF COMPETENCY : OPERATE ANIMAL ENCLOSURE/EXHIBIT\n\nUNIT CODE\n\n :"
