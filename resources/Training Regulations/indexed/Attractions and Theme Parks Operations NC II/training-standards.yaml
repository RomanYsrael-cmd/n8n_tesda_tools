    "source_text": "3.1 CURRICULUM DESIGN\n\nBASIC COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and convey\nworkplace\ninformation\n1.2 Complete relevant\nwork related\ndocuments\n1.3 Participate in\nworkplace meeting\nand discussion\n• Group\ndiscussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n\n--- PDF PAGE 100 ---\n_____________________________________________________________________________________________________\nATTRACTIONS AND THEME PARKS OPERATIONS NCII Promulgated November 2007 98\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n2. Work in a team\nenvironment\n2.1 Describe and identify\nteam role and\nresponsibility in a\nteam.\n2.2 Describe work as a\nteam member\n\n• Discussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n3. Practice career\nprofessionalism\n3.1 Integrate personal\nobjectives with\norganizational goals\n3.2 Set and meet work\npriorities\n3.3 Maintain professional\ngrowth and\ndevelopment\n• Discussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n4. Practice\noccupational\nhealth and\nsafety\n4.1 Evaluate hazard and\nrisks\n4.2 Control hazards and\nrisks\n4.3 Maintain\noccupational health\nand safety\nawareness\n• Discussion\n• Plant tour\n• Symposium\n• Observation\n• Interview\n\nCOMMON COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Develop and\nupdate industry\nknowledge\n1.1 Identify and access\nkey sources of\ninformation on the\nindustry\n1.2 Access, apply and\nshare industry\ninformation\n1.3 Update continuously\nrelevant industry\nknowledge\n• Lecture\n• Group\nDiscussion\n• Individual/Group\nAssignment\n\n• Interviews/\nQuestioning\n• Individual/Gro\nup Project or\nReport\n\n--- PDF PAGE 101 ---\n_____________________________________________________________________________________________________\nATTRACTIONS AND THEME PARKS OPERATIONS NCII Promulgated November 2007 99\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n2. Observe\nworkplace\nhygiene\nprocedures\n2.1 Practice personal\ngrooming and\nhygiene\n2.2 Practice safe and\nhygienic handling,\nstorage and disposal\nof food, beverage\nand materials\n\n• Lecture\n• Demonstration\n• Role-play\n• Demonstration\n• Written\nExamination\n• Interviews/\nQuestioning\n3. Perform\ncomputer\noperations\n3.1 Identify and explain\nthe functions,\ngeneral features and\ncapabilities of both\nhardware and\nsoftware\n3.2 Prepare and use\nappropriate\nhardware and\nsoftware according\nto task requirement\n3.3 Use appropriate\ndevices and\nprocedures to\ntransfer files/data\n3.4 Produce accurate\nand complete data\naccording to the\nrequirements\n3.5 Maintain computer\nsystem\n• Lecture\n• Group\nDiscussion\n• Tutorial or self-\npace\n\n• Interviews/\nQuestioning\n• Demonstration\n• Observation\n\n--- PDF PAGE 102 ---\n_____________________________________________________________________________________________________\nATTRACTIONS AND THEME PARKS OPERATIONS NCII Promulgated November 2007 100\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n4. Perform\nworkplace and\nsafety practices\n4.1 Practice workplace\nsafety, security and\nhygiene systems,\nprocesses and\noperations\n4.2 Respond\nappropriately to\nfaults, problems and\nemergency situations\nin line with enterprise\nguidelines\n4.3 Maintain safe\npersonal\npresentation\nstandards\n• Lecture\n• Demonstration\n• Role-play\n• Simulation\n• Demonstration\n• Interviews/\nQuestioning\n• Written\nExamination\n5. Provide\neffective\ncustomer\nservice\n5.1 Apply effective\nverbal and non-\nverbal\ncommunication skills\nto respond to\ncustomer needs\n5.2 Provide prompt and\nquality service to\ncustomer\n5.3 Handle queries\npromptly and\ncorrectly in line with\nenterprise\nproce