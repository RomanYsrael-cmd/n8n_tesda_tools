  "source_section_text": "SECTION 3 TRAINING STANDARDS\n\nThese guidelines are set to provide the Technical and Vocational Education and\nTraining (TVET) providers with information and other important requirements to consider\nwhen designing training programs for ATTRACTIONS AND THEME PARKS\nOPERATIONS NC II.\n\nThe guidelines include information on curriculum design, training delivery, trainee\nentry requirements, tools and equipment, training facilities, and trainer’s qualification\namong others.\n\nCourse Title: ATTRACTIONS AND THEME PARKS OPERATIONS\nNC Level: II\n\nNominal Training Duration:\n20 Hrs. (Basic)\n\n28 Hrs. (Common)\n\n 16 Hrs. (Core)\n\n62 Hrs. (Elective)\n\nCourse Description:\nThis course is designed to enhance the knowledge, skills, behavior and\nmotivations in accordance with industry standards. It covers the basic, common and core\ncompetencies required for the NCII level in attractions and theme parks. The\ncompetencies for attractions and theme parks include providing on-site information and\nassistance, monitoring entry to venue and providing a site briefing or scripted\ncommentary. It provides elective competencies on preparing, operating and closing down\nrides, water-based rides, games, and animal exhibits. It also includes competencies on\nperforming workplace and safety practices, providing effective customer service,\nobserving workplace hygiene procedures, developing and updating industry knowledge\nand performing computer operations.\n\n3.1 CURRICULUM DESIGN\n\nBASIC COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and convey\nworkplace\ninformation\n1.2 Complete relevant\nwork related\ndocuments\n1.3 Participate in\nworkplace meeting\nand discussion\n• Group\ndiscussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n\n--- PDF PAGE 100 ---\n_____________________________________________________________________________________________________\nATTRACTIONS AND THEME PARKS OPERATIONS NCII Promulgated November 2007 98\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n2. Work in a team\nenvironment\n2.1 Describe and identify\nteam role and\nresponsibility in a\nteam.\n2.2 Describe work as a\nteam member\n\n• Discussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n3. Practice career\nprofessionalism\n3.1 Integrate personal\nobjectives with\norganizational goals\n3.2 Set and meet work\npriorities\n3.3 Maintain professional\ngrowth and\ndevelopment\n• Discussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n4. Practice\noccupational\nhealth and\nsafety\n4.1 Evaluate hazard and\nrisks\n4.2 Control hazards and\nrisks\n4.3 Maintain\noccupational health\nand safety\nawareness\n• Discussion\n• Plant tour\n• Symposium\n• Observation\n• Interview\n\nCOMMON COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Develop and\nupdate industry\nknowledge\n1.1 Identify and access\nkey sources of\ninformation on the\nindustry\n1.2 Access, apply and\nshare industry\ninformation\n1.3 Update continuously\nrelevant industry\nknowledge\n• Lecture\n• Group\nDiscussion\n• Individual/Group\nAssignment\n\n• Interviews/\nQuestioning\n• Individual/Gro\nup Project or\nReport\n\n--- PDF PAGE 101 ---\n_____________________________________________________________________________________________________\nATTRACTIONS AND THEME PARKS OPERATIONS NCII Promulgated November 2007 99\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n2. Observe\nworkplace\nhygiene\nprocedures\n2.1 Practice personal\ngrooming and\nhygiene\n2.2 Practice safe and\nhygienic handling,\nstorage and disposal\nof food, beverage\nand materials\n\n• Lecture\n• Demonstration\n• Role-play\n• Demonstration\n• Written\nExamination\n• Interviews/\nQuestioning\n3. Perform\ncomputer\noperations\n3.1 Identify and explain\nthe functions,\ngeneral features and\ncapabilities of both\nhardware and\nsoftware\n3.2 Prepare and use\nappropriate\nhardware and\nsoftware according\nto task requirement\n3.3 Use appropriate\ndevices and\nprocedures to\ntransfer files/data\n3.4 Produce accurate\nand complete data\naccording to the\nrequirements\n3.5 Maintain computer\nsystem\n• Lecture\n• Group\nDiscussion\n• Tutorial or self-\npace\n\n• Interviews/\nQuestioning\n• Demonstration\n• Observation\n\n--- PDF PAGE 102 ---\n_____________________________________________________________________________________________________\nATTRACTIONS AND THEME PARKS OPERATIONS NCII Promulgated November 2007 100\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n4. Perform\nworkplace and\nsafety practices\n4.1 Practice workplace\nsafety, security and\nhygiene systems,\nprocesses and\noperations\n4.2 Respond\nappropriately to\nfaults, problems and\nemergency situations\nin line with enterprise\nguidelines\n4.3 Maintain safe\npersonal\npresentation\nstandards\n• Lecture\n• Demonstration\n• Role-play\n• Simulation\n• Demonstration\n• Interviews/\nQuestioning\n• Written\nExamination\n5. Provide\neffective\ncustomer\nservice\n5.1 Apply effective\nverbal and non-\nverbal\ncommunication skills\nto respond to\ncustomer needs\n5.2 Provide prompt and\nquality service to\ncustomer\n5.3 Handle queries\npromptly and\ncorrectly in line with\nenterprise\nprocedures\n5.4 Handle customer\ncomplaints,\nevaluation and\nrecommendations\n5.5 Provide prompt and\nquality service to\ncustomer\n5.6 Handle queries\npromptly and\ncorrectly in line with\nenterprise\nprocedures\n5.7 Handle customer\ncomplaints,\nevaluation and\nrecommendations\n• Lecture\n• Demonstration\n• Role-play\n• Simulation\n• Demonstration\n• Interviews/\nQuestioning\n• Observation\n\n--- PDF PAGE 103 ---\n_____________________________________________________________________________________________________\nATTRACTIONS AND THEME PARKS OPERATIONS NCII Promulgated November 2007 101\n\nCORE COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Provide on-site\ninformation and\nassistance\n1.1 Access and update\nattraction/theme\npark information\n1.2 Provide assistance\nand information\n1.3 Resolve guest\ncomplaints and\nconcerns\n• Group\nDiscussion\n• Interaction\n• Lecture\n• Role-Play\n• Demonstration\n• Observation\n• Interviews/\nQuestioning\n• Written tests\n2. Monitor entry to\nvenue\n2.1 Monitor and\nmaintain access to\nattraction areas\n2.2 Monitor crowds\n• Group\nDiscussion\n• Interaction\n• Lecture\n• Interviews/\nQuestioning\n• Written tests\n3. Provide a site\nbriefing or\nscripted\ncommentary\n3.1 Present information\nto customers\n3.2 Enhance the\npresentation of\ninformation\n3.3 Liaise with team\nmembers\n• Group\nDiscussion\n• Interaction\n• Lecture\n• Presentation\n• Demonstration\n• Observation\n• Interviews/\nQuestioning\n• Written tests\n\n--- PDF PAGE 104 ---\n_____________________________________________________________________________________________________\nATTRACTIONS AND THEME PARKS OPERATIONS NCII Promulgated November 2007 102\n\nELECTIVE COMPETENCIES\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Operate a ride\nlocation\n1.1 Prepare and\ninspect rides\nlocation\n1.2 Prepare to start\nthe ride cycle\n1.3 Operate and\nmonitor ride\n1.4 Close down ride\n1.5 Close and secure\nride\n1.6 Prepare ride\ndocumentation\nand reports\n\n• Group\nDiscussion\n• Interaction\n• Lecture\n• Simulation\n• Demonstration\n• Observation\n• Interviews/\nQuestioning\n• Written tests\n2. Load and unload a\nride\n2.1 Load the ride\n2.2 Observe the ride\n2.3 Unload the ride\n• Group\nDiscussion\n• Interaction\n• Lecture\n• Simulation\n• Demonstration\n• Observation\n• Interviews/\nQuestioning\n• Written tests\n3. Maintain safety in\nwater-based rides\n3.1 Monitor safety\naround water\n3.2 Assist and rescue\ncustomers\n3.3 Provide\nemergency care\n3.4 Provide reports on\nemergencies\n• Group\nDiscussion\n• Interaction\n• Lecture\n• Simulation\n• Demonstration\n• Observation\n• Interviews/\nQuestioning\n• Written tests\n\n--- PDF PAGE 105 ---\n_____________________________________________________________________________________________________\nATTRACTIONS AND THEME PARKS OPERATIONS NCII Promulgated November 2007 103\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n4. Operate a games\nlocation\n4.1 Prepare games\nlocation for\ncustomers\n4.2 Inspect games\nprior to opening\n4.3 Conduct games\noperations\n4.4 Clean and\nmaintain games\n4.5 Close games\nlocation\n4.6 Complete reports\nand\ndocumentation\n• Group\nDiscussion\n• Interaction\n• Lecture\n• Simulation\n• Demonstration\n• Observation\n• Interviews/\nQuestioning\n• Written tests\n5. Promote at a\ngames location\n5.1 Make games\nannouncements\n5.2 Present and\nconduct games\n• Lecture\n• Role-Play\n\n• Demonstration\n• Observation\n• Interviews/\nQuestioning\n6. Operate animal\nenclosure/exhibit\n6.1 Prepare animal\nenclosure/exhibit\nfor customers\n6.2 Monitor the\nenclosure/exhibit\n6.3 Clean and\nmaintain\nenclosure/exhibit\n6.4 Close down\nenclosure/exhibit\n6.5 Use and care for\nequipment\n6.6 Complete reports\nand\ndocumentation\n• Lecture\n• Simulation\n• Demonstration\n• Observation\n• Interviews/\nQuestioning\n• Written tests\n\n--- PDF PAGE 106 ---\n_____________________________________________________________________________________________________\nATTRACTIONS AND THEME PARKS OPERATIONS NCII Promulgated November 2007 104\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n7. Provide general\nanimal care\n7.1 Feed and water\nanimals\n7.2 Assist with general\nanimal care\n7.3 Assist with animal\nhealth care\n7.4 Identify and act on\npotential risks in\nanimal\nenclosures\n7.5 Update and\nmaintain animal\nrecords\n• Lecture\n• Simulation\n• Demonstration\n• Observation\n• Interviews/\nQuestioning\n• Written tests\n8. Rescue animals\n8.1 Identify animals\nrequiring rescue\n8.2 Participate in\nanimal rescue\n• Lecture\n• Simulation\n• Demonstration\n• Observation\n• Interviews/\nQuestioning\n• Written tests\n9. Provide customers\nwith information on\nanimals\n9.1 Offer information\nto customers\n9.2 Respond to\ncustomer\nquestions about\nanimals\n• Group\nDiscussion\n• Interaction\n• Lecture\n• Role-Play\n• Demonstration\n• Observation\n• Interviews/\nQuestioning\n• Written tests\n\n3.2\nTRAINING DELIVERY\n\nThe delivery of training should follow the design of the curriculum. Delivery\nshould be guided by the 10 basic principles of competency-based TVET.\n\n•\nThe training is based on curriculum developed from the competency\nstandards;\n•\nLearning is modular in its structure;\n•\nTraining delivery is individualized and self-paced;\n•\nTraining is based on work that must be performed;\n•\nTraining materials are directly related to the competency standards and\nthe curriculum modules;\n•\nAssessment is based on the collection of evidence of the performance of\nwork to the industry required standard;\n•\nTraining is based both on and off-the-job components;\n•\nAllows for recognition of prior learning (RPL) or current competencies;\n\n--- PDF PAGE 107 ---\n_____________________________________________________________________________________________________\nATTRACTIONS AND THEME PARKS OPERATIONS NCII Promulgated November 2007 105\n\n•\nTraining allows for multiple entry and exit; and\n•\nApproved training programs are Nationally Accredited\n\nThe competency-based TVET system recognizes various types of delivery\nmodes, both on and off-the-job as long as the learning is driven by the\ncompetency standards specified by the industry. The following training modalities\nmay be adopted when designing training programs:\n\n• The dualized mode of training delivery is preferred and recommended,\nthus, programs would contain both in-school and in-industry training or\nfieldwork components. Details can be referred to the Dual Training\nSystem (DTS) Implementing Rules and Regulations\n• Modular/self-paced learning is a competency-based training modality\nwhere the trainee is allowed to progress at his own pace. The trainer\nonly facilitates the training delivery\n• Peer teaching/mentoring is a training modality wherein fast learners are\ngiven the opportunity to assist the slow learners\n• Supervised industry training or on-the-job training is a training approach\ndesigned to enhance the knowledge and skills of the trainee through\nactual experience in the workplace to acquire specific competencies\nprescribed in the training regulations\n• Distance learning is a formal education process in which majority of the\ninstruction occurs when the students and instructor are not in the same\nplace. Distance learning may employ correspondence study, audio,\nvideo or computer technologies\n\n3.3\nTRAINEE ENTRY REQUIREMENTS\n\nTrainees or students who wish to enter this training should possess the\nfollowing requirements:\n\n• can communicate in basic English in both oral and written form\n• physically and mentally fit\n• with good moral character\n• can perform basic mathematical computation\n\nThis list does not include specific institutional requirements such as\neducational attainment, appropriate work experience, and others that may be\nrequired of the trainees by the school or training center delivering the TVET\nprogram.\n\n--- PDF PAGE 108 ---\n_____________________________________________________________________________________________________\nATTRACTIONS AND THEME PARKS OPERATIONS NCII Promulgated November 2007 106\n\n3.4\nLIST OF TOOLS, EQUIPMENT AND MATERIALS\n\nRecommended list of tools, equipment and materials for the training of a\nmaximum of 25 trainees for ATTRACTIONS AND THEME PARKS OPERATIONS\nNC II are as follows:\n\nTOOLS\nEQUIPMENT\nMATERIALS\nQTY\n\nQTY\n\nQTY\n\n2\nsets\nRescue kit\n(toolbox)\n5 units Computer with\ninternet connection\n1 set\nTelephone Directory\n2\nsets\nFirst aid kit\n1 unit\nLCD projector\n1 set\nCleaning materials\n\n2 units Two-way radio\n\n2 units Mobile phone\n\n1 unit\nTelephone\n\n1 unit\nFax machine\n\n1 unit\nDigital camera\n\n1 unit\nVideo camera\n\n1 unit\nMicrophone\n\n1 unit\nSound system\n\n1 unit\nMegaphone\n\n1 unit\nPhotocopier\n\n2 sets\nPersonal protective\nequipment and\nclothing\n\n1 unit\nFire extinguisher\n\n1 set\nCleaning equipment\n\n*NOTE: Implementation of the training program can be facilitated through a\nMemorandum of Agreement between the training provider and industry partner/s\nregarding the use of facilities. This is in response to the high cost of facilities\nand equipment. Airconditioned vehicles can be hired on a per trip basis subject\nto requirement.\n\n--- PDF PAGE 109 ---\n_____________________________________________________________________________________________________\nATTRACTIONS AND THEME PARKS OPERATIONS NCII Promulgated November 2007 107\n\n3.5\nTRAINING FACILITIES\n\nBased on a class intake of 25 students/trainees.\n\nSpace Requirement\n\nSize in Meters\n\nArea in Sq.\nMeters\n\nTotal Area in Sq.\nMeters\nStudent/Trainee\nWorking Space\n1 x 1 m.\n1 sq. m.\n25 sq. m\nLecture/Demo Room\n8 x 5 m.\n40 sq. m.\n40 sq. m.\nLearning Resource\nCenter\n3 x 5 m.\n15 sq. m.\n15 sq. m.\nFacilities/Equipment/\nCirculation Area\n\n24 sq. m.\nTotal workshop area:\n104 sq. m.\n\n3.6\nTRAINER’S QUALIFICATIONS FOR TOURISM SECTOR\n\nATTRACTIONS AND THEME PARKS OPERATIONS NCII\n\nTRAINER’S QUALIFICATIONS (TQ II)\n\n• Must have completed a Trainer’s Training Methodology Course\n (TM II) or its equivalent\n• Must be physically and mentally fit\n• Must have at least 3-5 years job/industry experience\n• Must be a holder of Attractions and Theme Parks Operations NC Level II\nCertificate or equivalent qualification\n• Must be of good moral character\n• With pleasing personality\n• Must have attended relevant training and seminars\n\n3.7\nINSTITUTIONAL ASSESSMENT\n\nInstitutional assessment is undertaken by trainees to determine their\nachievement of units of competency. A certificate of achievement is issued for\neach unit of competency.\n\n--- PDF PAGE 110 ---\n_____________________________________________________________________________________________________\nATTRACTIONS AND THEME PARKS OPERATIONS NCII Promulgated November 2007 108"
