  "source_section_text": "SECTION 3 TRAINING STANDARDS\n\nThis set of standards provides Technical and Vocational Education and\nTraining (TVET) providers with information and other important requirements to\nconsider when designing training programs for BARBERING NC II.\n\nThis includes information on curriculum design; training delivery; trainee entry\nrequirements; tools and equipment; training facilities; trainers qualification and\ninstitutional assessment.\n\n3.1\nCURRICULUM DESIGN\n\nCourse Title: BARBERING\n\nNC Level: NC II\n\nNominal Training Duration: _18 Hrs (Basic)\n\n _18 Hrs (Common)\n\n 420 Hrs (Core)\n\n 200 Hrs (Elective)\n\n 656 Total Hrs\nCourse Description:\n\nThis course is designed to enhance the knowledge, skills and attitudes of\nhairdressers in accordance with industry standards. It covers the basic, common and\ncore competencies in Barbering NC II.\n\nBASIC COMPETENCIES\n(18 Hours)\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Participate in\nworkplace\ncommunication\n\n1.1 Obtain and convey\nworkplace information\n1.2 Complete relevant work\nrelated documents\n1.3 Participate in workplace\nmeeting and discussion\n•Group\ndiscussion\n• Interaction\n\n•Written test\n• Practical/\nperformance\ntest\n• Interview\n2. Work in a\nteam\n environment\n2.1 Describe and identify team\nrole and responsibility in a\nteam.\n2.2 Describe work as a team\nmember.\n•Group\ndiscussion\n• Interaction\n\n•Observation\n• Simulation\n• Role playing\n3. Practice career\n professionalism\n3.1 Integrate personal objectives\nwith organizational goals\n3.2 Set and meet work priorities\n3.3 Maintain professional growth\nand development\n•Group\ndiscussion\n• Interaction\n•Demonstration\n• Observation\n• Interviews/\nquestioning\n4. Practice\noccupational\nhealth and\nsafety\n4.1 Evaluate hazards and risks\n4.2 Control hazards and risks\n4.3 Maintain occupational health\nand safety awareness\n•Group\nDiscussion\n• Plant tour\n• Symposium\n•Observation\n• Interviews\n\n--- PDF PAGE 59 ---\nTR – Barbering NC II\nPromulgated November 2010 55\n COMMON COMPETENCIES\n (18 Hours)\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Apply quality\nstandards\n\n1.1 Assess clients service needs\n1.2 Assess own work\n1.3 Engage in quality\nimprovement\n• Group\nDiscussion\n• Interaction\n\n• Written Test\n• Practical/\n Performance\n Test\n•Interview\n2. Maintain a\nsafe, clean\nand efficient\nwork\nenvironment\n2.1 Comply with health\nregulations\n2.2 Prepare and maintain work\narea\n2.3 Check and maintain tools\nand equipment\n2.4 Check and maintain stocks\n2.5 Provide a relaxed and caring\nenvironment\n• Group\nDiscussion\n• Interaction\n• Written Test\n• Practical/\nPerformance\nTest\n• Interview\n3. Maintain an\neffective\nrelationship\nwith clients/\ncustomers\n3.1 Maintain a professional\nimage\n3.2 Build credibility with\ncustomers/clients\n• Group\nDiscussion\n• Interaction\n• Written Test\n• Practical/\n Performance\n Test\n•Interview\n4. Manage own\nperformance\n4.1 Plan completion of own\nworkload\n4.2 Maintain quality of own\nperformance\n• Group\nDiscussion\n• Interaction\n• Written Test\n• Practical/\nPerformance\nTest\n• Interview\n\n--- PDF PAGE 60 ---\nTR – Barbering NC II\nPromulgated November 2010 56\n CORE COMPETENCIES\n(420 Hours)\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Perform pre-\nand post- hair\ncare activities\n1.1 Prepare client\n1.2 Apply shampoo and/or\nconditioner to client\n1.3 Blow-dry hair\n• Lecture\n• Discussion\n• Demonstration\n• Written Test\n• Practical/\nPerformance\nTest\n•Interview\n2. Perform hair\nand scalp\ntreatment\n2.1 Prepare client\n2.2 Treat hair and scalp\n condition\n2.3 Perform post-service\n activities\n• Lecture\n• Discussion\n• Demonstration\n• Written Test\n• Practical/\nPerformance\nTest\n• Interview\n3. Perform basic\nhair coloring\n3.1 Prepare client\n3.2 Apply hair color\n3.3 Perform post-service\nactivities\n• Lecture/\nDemonstration\n• OJT\n• Written\nExamination\n• Demonstration\n4. Perform\nhaircut\n4.4 Prepare client\n4.5 Perform hair cut\n4.6 Perform final styling\n4.7 Perform post service\nsanitation activity\n• Lecture/\n Demonstration\n• OJT\n• Written\nExamination\n• Demonstration\n• Observation\n5. Shave and\nstyle beard\nand mustache\n5.4 Prepare client\n5.5 Shave/design/style beard or\nmoustache\n5.6 Perform post -service\nactivities\n• Lecture/\nDemonstration\n• OJT\n• Written\nExamination\n• Demonstration\n• Observation\n6. Perform chair\nspot massage\n 6.1 Prepare client for chair\nmassage services\n 6.2 Perform chair massage\nactivity\n 6.3 Perform post -service\nactivities\n• Lecture/\nDemonstration\n• OJT\n• Written\nExamination\n• Demonstration\n• Observation\n\n--- PDF PAGE 61 ---\nTR – Barbering NC II\nPromulgated November 2010 57\n\nELECTIVE COMPETENCIES\n(200 Hours)\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Perform basic\nhair perming\n1.1 Prepare client\n 1.2 Perm hair\n 1.3 Apply finishing touches\n 1.4 Perform post-service\n activities\n• Lecture/\n Demonstration\n• OJT\n• Written\nExamination\n• Demonstration\n• Observation\n2. Perform hair\nrelaxing\n 2.1 Prepare client\n 2.2 Apply hair relaxing\n product\n 2.3 Apply fixing solution\n 2.4 Perform post-service\nactivities\n• Lecture/\nDemonstration\n• OJT\n• Written\nExamination\n• Demonstration\n• Observation\n3. Perform\nmen’s\nhairpiece\nattachment,\nstyling and\nmaintenance\n 3.1 Prepare client\n 3.2 Attach and style\n hairpieces\n 3.3 Maintain hairpieces\n4.5 Perform post-service\nactivities\n• Lecture/\nDemonstration\n• OJT\n• Written\nExamination\n• Demonstration\n• Observation\n\n--- PDF PAGE 62 ---\nTR – Barbering NC II\nPromulgated November 2010 58\n3.2 TRAINING DELIVERY\n\nThe delivery of training should adhere to the design of the curriculum. Delivery\nshould be guided by the 10 basic principles of competency-based TVET.\n\n• The training is based on curriculum developed from the competency\nstandards;\n• Learning is modular in its structure;\n• Training delivery is individualized and self-paced;\n• Training is based on work that must be performed;\n• Training materials are directly related to the competency standards and the\ncurriculum modules;\n• Assessment is based in the collection of evidence of the performance of work\nto the industry required standard;\n• Training is based both on and off-the-job components;\n• Allows for recognition of prior learning (RPL) or current competencies;\n• Training allows for multiple entry and exit; and\n• Approved training programs are nationally accredited.\n\nThe competency-based TVET system recognizes various types of delivery\nmodes, both on and off-the-job as long as the learning is driven by the competency\nstandards specified by the industry. The following training modalities may be adopted\nwhen designing training programs:\n\n• The dualized mode of training delivery is preferred and recommended. Thus\nprograms would contain both in-school and in-industry training or fieldwork\ncomponents. Details can be referred to the Dual Training System (DTS)\nImplementing Rules and Regulations.\n• Modular/self-paced learning is a competency-based training modality wherein\nthe trainee is allowed to progress at his own pace. The trainer just facilitates\nthe training delivery.\n• Peer teaching/mentoring is a training modality wherein fast learners are given\nthe opportunity to assist the slow learners.\n• Supervised industry training or on-the-job training is an approach in training\ndesigned to enhance the knowledge and skills of the trainee through actual\nexperience in the workplace to acquire specific competencies prescribed in\nthe training regulations.\n• Distance learning is a formal education process in which majority of the\ninstruction occurs when the students and instructor are not in the same place.\nDistance learning may employ correspondence study, audio, video or\ncomputer technologies.\n• Project-based instruction is an authentic instructional model strategy in which\nstudents plan, implement and evaluate projects that have real world\napplications.\n\n--- PDF PAGE 63 ---\nTR – Barbering NC II\nPromulgated November 2010 59\n3.3 TRAINEE ENTRY REQUIREMENTS\n\nTrainees or students wishing to gain entry into these qualifications should\npossess the following requirements:\n\n-\nMust be able to communicate effectively both orally and in writing\n-\nMust be physically, emotionally and mentally fit\n-\nMust be able to perform basic mathematical computations\n-\nMust secure medical certificate for fitness to handle chemicals\n\nNote to students: Because many chemical sprays and airborne pollutants are found in this\noccupation, students are advised to consult their physicians as to possible\nproblems (i.e., allergies, asthma, dermatitis, etc.) before enrolling.\n\n3.4 TOOLS, EQUIPMENT AND MATERIALS\n BARBERING – NC II\n\nRecommended list of tools, equipment and materials for the training of a\nminimum of 25 trainees for Barbering NC II are as follows:\n\nQTY.\nTOOLS\nQTY.\nEQUIPMENT\nQTY.\nMATERIALS\nBRUSH\n2 unit\nInfrared\n1 btl.\nShampoo, gal\n12 pcs.\nHair brush\n6 unit\nSteamer\n1btl.\nConditioner, 1\ngal\n12 pcs.\nbarber brush\n3 unit\nIron\n1 doz\nWhite towel\n2 unit\nTimer\n6 unit\nHair Dryer / Blower\n1 doz\nNeck band\n12 pcs.\nSkeleton brush\n1 doz\nColored towel\n12 pcs.\nRoller brush\n6 unit\nTrolley\n1 doz l\nShoulder pad\n12pcs.\nPaddle brush\n2\nShampooing bowl\n6 pcs\nEar pad\n6 pcs.\nApplicator\n3 pcs.\nHead band\n12 pcs.\nTinting brush\n1 unit Sterilizer\n3 pcs.\nFlannel\nheadband\n\n1 unit\nNioscope (optional)\n3 pcs.\nGauze mask\nModel/Mannequin\n1 btl.\nMousse\n6 pcs.\nSqueezer\n1 btl.\nGel, 500 ml.\n2 pcs\nHigh chair (for\nchildren)\n1 btl.\nHair\nspray500\nml.\nCOMB\n\nShamp\noo\nchair\nHair polish\n25 pcs.\nBarber comb\n6 unit\nHydraulic\nChair/Barber Chair\n1 roll\nAluminum foil\n25 pcs\nWide tooth comb\n1 unit\nRoller ball\n1 box\nTissue paper\n25 pcs\nLarge tooth comb\n25 pcs.\nMetal Tail comb\n1 unit\nElectric massager\n1 doz\nTissue roll\n25 pcs.\ncutting comb\n6pcs\nStool\n1 btl.\nBaby powder,\n500 grams\n50 pcs.\nRubber gloves\n1 pack\nCotton, 500\ngrams\n1 box\nDisposable gloves\n1 roll\nCling Wrap, roll\n3 pcs.\nMirrors\n3 pcs\nFrosting cap\n6 pcs\nSpatula\n3 pcs\nFosting cap with\nhook\n1 doz\nShaving foam\n\n--- PDF PAGE 64 ---\nTR – Barbering NC II\nPromulgated November 2010 60\nQTY.\nTOOLS\nQTY.\nEQUIPMENT\nQTY.\nMATERIALS\n1 bot\nEmollient cream\n50 pcs.\nHair clips, 1 doz.\nSingle prong clip\n(optional)\n1 btl.\nDeveloper, 6%\n20 volumes; 9%\n30 volumes; 12%\n40 volumes, 500\nml. each\n1 btl.\nWeightless\nreconstructive\nhair mask\n25\npcs\nrazor\n1 btl.\nHair gum\n50 pcs\nClamps\n1 btl.\nHair polish\n60 pcs.\nClips\n1 btl.\nFiber gum\n1 box\nHairpin\n2 bot.\nFixing solution\n1 box\nRoller pin\n5\nbundle\nEnd paper\n1 box\nInvisible pins\n25 set\nPerming rod\n50 pcs\nDuck bill clamp\n12 pcs\nTail comb\n12 pcs\nScissor/shears\n12 pcs\napplicator\n4 pcs\nThinning scissor\n12 pcs\nshower cap\n12 pcs\nTinting bowl\n12 pcs\nmask\n2 pcs\nTape measure\n5 pcs\nToupee\n5 pcs\nWig\n1 box\nRubberband\n10 pcs\nNeedle\n5 pcs\nGarter thread\n\n3 pcs.\nSmock gown\n1 jar\nGel\n3 pcs.\nApron\n1 set\nColor product\nform\n 5 pcs. Cape\n3 pcs.\nNeck strip (cloth)\n3 pcs.\nPlastic cape\n1 set\nCream, Liquid &\nPowder\n3 pcs.\nMixing bowls\n1 pc.\nWeighing scale\n3 pcs.\nPlastic applicator\n6 pcs.\nMeasuring cup\n1 btl.,\nLotion,500 ml\n3 pcs.\nPlastic scoop\n1 set\nColorants\n 2\npcs.\nDrip pan\n1 set\nColormate\n1 set\nTreatment\nproduct\nSCISSORS\n3 pcs.\nPress spray\nplastic dispenser\nbottle\n1 pc.\n1 set\nThinning scissor\n1 pc.\nWig\nCutting scissor /\nCutting Shear\n(different sizes)\n1 pc.\nHairpiece\n1 set\nRazor/Blade\n1 btl.\nAlcohol, 500 ml.\n3 pcs.\nHydraulic chair\n6 bars\nSoap\n1 pc.\nRazors\n1 pc.\nBath robe\n2 pcs.\nClippers\n1 pair\nSlippers\n3 pcs.\nSpatula\n3 btl.\nSanitizer\n1 pc.\nSqueezer\n3 btl.\nDisinfectant\n3 pcs.\nSpray gun\n3 btl.\nAntiseptic\nsolutions\n3 pcs.\nPlastic scoop\n\n3 pcs.\nCleaning clothes\n\n--- PDF PAGE 65 ---\nTR – Barbering NC II\nPromulgated November 2010 61\n2 pcs.\nShampoo bowl\n1 doz.\nGarbage bin/bag\nTraining Materials:\nCATALOG\n1\nMen’s Cut\nCatalog\n1\nLadies Cut\nCatalog\n1\nKid’s Cut Catalog\n6\nMagazines\n3\nTextbooks\n\n3.5 TRAINING FACILITIES\n\n Based on a class intake of 25 students/trainees\n\nSpace Requirement\nSize in Meters\nArea in Sq.\nMeters\nTotal Area in\nSq. Meters\n\nStudent/Trainee Working\nSpace\n\n1 x 1 m.\n\n1 sq. m.\n\n25 sq. m\n\nLecture/Demo Room\n\n8 x 5 m.\n\n40 sq. m.\n\n40 sq. m.\n\nLearning Resource Center\n\n3 x 5 m.\n\n15 sq. m.\n\n15 sq. m.\n\nFacilities/Equipment/\nCirculation Area\n\n6 x 4 m.\n\n24 sq. m.\n\n24 sq. m.\nTotal :\n104 sq. m.\n\n3.6 TRAINER’S QUALIFICATIONS FOR BARBERING NC II\n\n TRAINER QUALIFICATION (TQ II)\n\n• Must have completed Trainer’s Methodology Course\n• Must be a holder of Barbering NC II\n• Must be able to communicate effectively both orally and in writing\n• Must be physically, emotionally and mentally fit\n• Must have at least two (2) years relevant teaching experience\n• Must possess good moral character\n\n3.7 INSTITUTIONAL ASSESSMENT\n\nInstitutional Assessment is undertaken by trainees to determine their\nachievement of units of competency. A certificate of achievement is issued for\neach unit of competency.\n\n--- PDF PAGE 66 ---\nTR – Barbering NC II\nPromulgated November 2010 62"
