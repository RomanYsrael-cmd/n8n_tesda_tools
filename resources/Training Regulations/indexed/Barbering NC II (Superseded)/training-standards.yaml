    "source_text": "3.1\nCURRICULUM DESIGN\n\nCourse Title: BARBERING\n\nNC Level: NC II\n\nNominal Training Duration: _18 Hrs (Basic)\n\n _18 Hrs (Common)\n\n 420 Hrs (Core)\n\n 200 Hrs (Elective)\n\n 656 Total Hrs\nCourse Description:\n\nThis course is designed to enhance the knowledge, skills and attitudes of\nhairdressers in accordance with industry standards. It covers the basic, common and\ncore competencies in Barbering NC II.\n\nBASIC COMPETENCIES\n(18 Hours)\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Participate in\nworkplace\ncommunication\n\n1.1 Obtain and convey\nworkplace information\n1.2 Complete relevant work\nrelated documents\n1.3 Participate in workplace\nmeeting and discussion\n•Group\ndiscussion\n• Interaction\n\n•Written test\n• Practical/\nperformance\ntest\n• Interview\n2. Work in a\nteam\n environment\n2.1 Describe and identify team\nrole and responsibility in a\nteam.\n2.2 Describe work as a team\nmember.\n•Group\ndiscussion\n• Interaction\n\n•Observation\n• Simulation\n• Role playing\n3. Practice career\n professionalism\n3.1 Integrate personal objectives\nwith organizational goals\n3.2 Set and meet work priorities\n3.3 Maintain professional growth\nand development\n•Group\ndiscussion\n• Interaction\n•Demonstration\n• Observation\n• Interviews/\nquestioning\n4. Practice\noccupational\nhealth and\nsafety\n4.1 Evaluate hazards and risks\n4.2 Control hazards and risks\n4.3 Maintain occupational health\nand safety awareness\n•Group\nDiscussion\n• Plant tour\n• Symposium\n•Observation\n• Interviews\n\n--- PDF PAGE 59 ---\nTR – Barbering NC II\nPromulgated November 2010 55\n COMMON COMPETENCIES\n (18 Hours)\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Apply quality\nstandards\n\n1.1 Assess clients service needs\n1.2 Assess own work\n1.3 Engage in quality\nimprovement\n• Group\nDiscussion\n• Interaction\n\n• Written Test\n• Practical/\n Performance\n Test\n•Interview\n2. Maintain a\nsafe, clean\nand efficient\nwork\nenvironment\n2.1 Comply with health\nregulations\n2.2 Prepare and maintain work\narea\n2.3 Check and maintain tools\nand equipment\n2.4 Check and maintain stocks\n2.5 Provide a relaxed and caring\nenvironment\n• Group\nDiscussion\n• Interaction\n• Written Test\n• Practical/\nPerformance\nTest\n• Interview\n3. Maintain an\neffective\nrelationship\nwith clients/\ncustomers\n3.1 Maintain a professional\nimage\n3.2 Build credibility with\ncustomers/clients\n• Group\nDiscussion\n• Interaction\n• Written Test\n• Practical/\n Performance\n Test\n•Interview\n4. Manage own\nperformance\n4.1 Plan completion of own\nworkload\n4.2 Maintain quality of own\nperformance\n• Group\nDiscussion\n• Interaction\n• Written Test\n• Practical/\nPerformance\nTest\n• Interview\n\n--- PDF PAGE 60 ---\nTR – Barbering NC II\nPromulgated November 2010 56\n CORE COMPETENCIES\n(420 Hours)\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Perform pre-\nand post- hair\ncare activities\n1.1 Prepare client\n1.2 Apply shampoo and/or\nconditioner to client\n1.3 Blow-dry hair\n• Lecture\n• Discussion\n• Demonstration\n• Written Test\n• Practical/\nPerformance\nTest\n•Interview\n2. Perform hair\nand scalp\ntreatment\n2.1 Prepare client\n2.2 Treat hair and scalp\n condition\n2.3 Perform post-service\n activities\n• Lecture\n• Discussion\n• Demonstration\n• Written Test\n• Practical/\nPerformance\nTest\n• Interview\n3. Perform basic\nhair coloring\n3.1 Prepare client\n3.2 Apply hair color\n3.3 Perform post-service\nactivities\n• Lecture/\nDemonstration\n• OJT\n• Written\nExamination\n• Demonstration\n4. Perform\nhaircut\n4.4 Prepare client\n4.5 Perform hair cut\n4.6 Perform final styling\n4.7 Perform post service\nsanitation activity\n• Lecture/\n Demonstration\n• OJT\n• Written\nExamination\n• Demonstration\n• Observation\n5. Shave and\nstyle beard\nand mustache\n5.4 Prepare client\n5.5 Shave/design/style beard or\nmoustache\n5.6 Perform post -service\nactivities\n• Lecture/\nDemonstration\n• OJT\n• Written\nExamination\n• Demonstration\n• Observation\n6. Perform chair\nspot massage\n 6.1 Prepare client for chair\nmassage services\n 6.2 Perform chair massage\nactivity\n 6.3 Perform post -service\nactivities\n• Lecture/\nDemonstration\n• OJT\n• Written\nExamination\n• Demonstration\n• Observation\n\n--- PDF PAGE 61 ---\nTR – Barbering NC II\nPromulgated November 2010 57\n\nELECTIVE COMPETENCIES\n(200 Hours)\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Perform basic\nhair perming\n1.1 Prepare client\n 1.2 Perm hair\n 1.3 Apply finishing touches\n 1.4 Perform post-service\n activities\n• Lecture/\n Demonstration\n• OJT\n• Written\nExamination\n• Demonstration\n• Observation\n2. Perform hair\nrelaxing\n 2.1 Prepare client\n 2.2 Apply hair relaxing\n product\n 2.3 Apply fixing solution\n 2.4 Perform post-service\nactivities\n• Lecture/\nDemonstration\n• OJT\n• Written\nExamination\n• Demonstration\n• Observation\n3. Perform\nmen’s\nhairpiece\nattachment,\nstyling and\nmaintenance\n 3.1 Prepare client\n 3.2 Attach and style\n hairpieces\n 3.3 Maintain hairpieces\n4.5 Perform post-service\nactivities\n• Lecture/\nDemonstration\n• OJT\n• Written\nExamination\n• Demonstration\n• Observation\n\n--- PDF PAGE 62 ---\nTR – Barbering NC II\nPromulgated November 2010 58"
