ith OHS policies and\nprocedures\n3.4\nCritical thinking\n3.5\nSolution providing and decision making\n3.6\nInterpersonal skills or dealing with varied type of clients\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nMaterials\n4.2\nProduct\n4.3\nEquipment\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1\nObservation with questioning\n5.2\nThird Party Report\n5.3\nDemonstration with questioning\n6. Context of\nassessment\n6.1 Assessment may be conducted in the workplace or in a\nsimulated environment.\n\n--- PDF PAGE 27 ---\nTR – Barbering NC II\nPromulgated November 2010 23\nUNIT OF COMPETENCY :\nMAINTAIN A SAFE, CLEAN AND EFFICIENT WORK\nENVIRONMENT\nUNIT CODE\n:"
