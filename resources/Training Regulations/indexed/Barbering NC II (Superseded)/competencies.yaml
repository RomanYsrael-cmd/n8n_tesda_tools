        "source_title": "PERFORM MEN’S HAIRPIECE ATTACHMENT, STYLING AND MAINTENANCE",
        "source_text": "--- PDF PAGE 55 ---\nTR – Barbering NC II \nPromulgated November 2010                            51 \nUNIT OF COMPETENCY : \nPERFORM MEN’S HAIRPIECE ATTACHMENT, \nSTYLING AND MAINTENANCE \nUNIT CODE \n: \nHCS515406 \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge, skills and attitude \nrequired in hairpiece attachment for men, styling and \ncarrying out cleaning and maintenance of hairpiece. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1.   Prepare client \n1.1 \nClient is consulted according to his/her needs and \nexpectations \n1.2 \nClient is draped with styling cape \n1.3 \nHairpiece and style  is selected in accordance \nwith client’s facial features, natural hair  and \npersonal attributes \n1.4 \nAppropriate equipment,  tools, supplies/materials \nand techniques are selected and used according to \nclient’s requirements \n1.5     Cost, maintenance requirements, features and \nbenefits of the service are identified and explained \nto client\n2.   Attach and style \nhairpieces \n2.1    Client’s head circumference is measured for wig \nfitting \n2.2    Selected hairpiece is attached securely to client’s \nhead following manufacturer’s specifications and \ndesired result \n2.2    Hairstyle is created following elements of design \nand client’s requirements  \n2.3    Client’s satisfaction is confirmed and adjustments \nare made if required \n3.   Maintain hairpieces \n \n \n3.1    Hairpiece’s condition is checked and adjustments \nare made if required \n3.2     Suitable product is identified and selected \nappropriate for type of hairpiece to be cleaned and \nmaintained \n3.3    Manufacturer’s instructions in using product is \nfollowed accordingly\n4.    Perform post-service \nactivities \n4.1   Tools and materials are cleaned, sterilized and  \n         stored in accordance with salon policy \n4.2    Wastes items are properly disposed in accordance  \n         with OH&S required practice \n4.3    Working area is cleaned in preparation for the next \n        client\n\n--- PDF PAGE 56 ---\nTR – Barbering NC II \nPromulgated November 2010                            52 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.  Hairpiece \n1.1  Full head wigs \n1.2  Toupees/wiglets \n2.  Hairpiece style \n2.1   Straight \n2.2   Wavy \n2.3  Curly\n3.  Personal attributes \n3.1   Age \n3.2   Personal image \n3.3   Job or career   \n4.  Tools  \n4.1   Blow dryers \n4.2   Brushes \n4.3   Combs \n5.  Supplies/Materials \n5.1   Pins \n5.2   Duckbill \n5.3   Measuring tape \n5.4   Neck strip \n5.5   Styling cape \n5.6   Towel \n5.7   Tissues \n5.8   Styling product \n        -  Gel/Styling gel \n       - Spray net \n6.  Desired result \n6.1   Symmetry/Balance \n6.2   Evenness \n6.3   Wig/toupee blends with natural hair \n6.4   No visible hair implements and attachments\n7.  Elements of design  \n7.1    Line \n7.2    Color \n7.3    Texture \n7.4    Shape \n7.5    Size\n\n--- PDF PAGE 57 ---\nTR – Barbering NC II \nPromulgated November 2010                            53 \nEVIDENCE GUIDE  \n1. Critical aspects \nof competency \nAssessment requires evidence that the candidate: \n1.1 \nConsulted and prepared client on hairpiece attachment and \nstyling and its procedures \n1.2 \nPrepared tools, equipment and supplies/materials \naccording to client’s requirements and OH&S requirements \n1.3 \nPerformed hairpiece attachment and  styling procedures \nand techniques according to client desired results, \nmanufacturer’s specifications \n1.4 \nPerformed cross checking and applied appropriate finishing \ntouches \n1.5 \nMaintained hairpieces according to manufacturer’s \ninstructions \n1.6 \nUsed protective clothing according to health and sanitation \nregulations \n1.7 \nFollowed safety precautions to clients during the entire \nprocess \n1.8 \nPerformed post-service activities according to OH&S \nrequirements \n2. Underpinning \nknowledge  \n2.1     Kinds and types of hairpiece \n2.2     Procedures on taking wig measurements \n2.3 \nDifferent hairpiece attachment, styling procedures and \ntechniques \n2.4 \nElements and principles of hair design \n2.5 \nBalancing hair length and volume \n2.6 \nProcedures in cleaning and maintenance of wigs/toupee \n2.7 \nDifferent types of tools and materials in hairpiece \nattachment,  styling and maintenance  \n2.8 \nFirst aid treatment \n2.9 \nDOH and OH&S requirements \n2.10  Code of ethics   \n3. Underpinning \nskills \n3.1 \nPerforming hairpiece attachment and styling procedures \nand techniques \n3.2     Using appropriate tools and materials \n3.3     Interpreting manufacturer’s specifications \n3.4     Performing hairpiece maintenance \n3.5     Applying first-aid treatment \n3.6     Compliance to DOH-IRR \n3.7     Observing code of ethics \n3.8   Demonstrating sanitation\n4. Resource \nimplications \nThe following resources MUST be provided: \n4.1   Model \n4.2   Tools, equipment and supplies/materials relevant to the \nactivity to be performed \n4.3 Working area / facilities \n5. Method of \nassessment \nCompetency may be assessed through: \n5.1   Demonstration with  Oral Questioning \n5.2   Third-Party Report \n5.3 Portfolio\n6. Context of \nassessment\nCompetency may be assessed in the workplace or TESDA \naccredited assessment center\n",
