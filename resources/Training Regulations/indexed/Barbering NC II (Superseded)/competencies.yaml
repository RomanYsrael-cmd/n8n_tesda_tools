        "source_text": "HCS515302\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge and skills required to\ntreat a range of hair and scalp conditions of clients. It\ninvolves preparation of client, tools and equipment,\nactual treatment of hair and scalp and performance of\npost- treatment activities.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Prepare client\n1.1\nClient’s health and restrictions are determined\nthrough consultation\n1.2\nClient’s scalp and hair condition are analyzed\nfollowing salon safety policies and procedures\n1.3\nProtective clothing is prepared and used according\nto OH&S requirements and salon procedures\n2. Treat hair condition\n2.1\nSupplies/materials and hair treatment product are\nselected and prepared according to client’s hair\ncondition\n2.2\nHair treatment is performed in accordance with\nestablished or acceptable procedures\n2.3 Result is checked according to client’s desired\noutcome\n2.4 Client’s safety and comfort is ensured during the\nprocess\n2.5 Where necessary, first-aid treatment is provided to the\nclient or referred to health personnel\n3. Treat scalp condition\n3.1\nScalp treatment product is selected and prepared\nbased on client’s scalp condition\n3.2\nScalp treatment is performed in accordance with\nestablished or acceptable procedures\n3.3 Result is checked according to client desired outcome\n3.4 Clients’ comfort and safety is ensured during the\nprocess\n3.5 Where necessary, first-aid treatment is provided to the\nclient or referred to health personnel\n4. Perform post-service\nactivities\n4.1\nTreatment products used are stored following salon\nprocedures\n4.2\nTools and equipment are cleaned, sanitized and\nstored according to OH&S requirements\n4.3\nWaste materials are segregated and disposed\naccording to OH&S requirements\n4.4\nClient is advised on appropriate hair and scalp\nmaintenance\n\n--- PDF PAGE 34 ---\nTR – Barbering NC II\nPromulgated November 2010 30\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Type of Client\n\n1.1\nAdult\n1.2\nYoung Adult\n1.3 Teenager\n2. Scalp Condition\n2.1 Normal\n2.2 Oily\n2.3 Dry\n3. Hair Condition\n3.1 Dry/Oily\n3.2 Dandruff\n3.3 Greasy\n3.4 Waxy\n3.5 Scaly\n4. Protective clothing\n4.1 Facial mask\n4.2\nApron\n4.3\nBath Towel\n4.4\nHead Band\n4. Tools and equipment\n4.1 Steamer\n4.1\nBlower\n4.2\nHair brush\n4.4 Mixing bowls\n4.3\nSpatula\n5. Supplies and\nmaterials\n5.1\nAluminum Foil\n5.2\nTissue Papers\n5.3 Cling Wrap\n5.4 Towels\n5.5 Different Treatment products\n6. Hair and scalp\ntreatment product\nform\n6.1\nCream Form\n6.2\nLiquid Form\n6.3\nGel Form\n7. Established or\nacceptable\nprocedures in hair\nand scalp treatment\nMay include but are not limited to:\n7.1 Apply treatment product according to product\nspecifications and massage hair and/or scalp\n7.2 Expose hair or scalp to heat if necessary, according to\nproduct specifications\n7.3 Follow correct timeline according to product\n specification\n7.4 Rinse hair thoroughly, towel or blow-dry\n8. Waste\n8.1 Biodegradable\n8.2 Non-Biodegradable\n9. Hair and scalp care\nand maintenance\n9.1 Hair and Scalp Frequent Treatment\n9.2 Use of Hair and Scalp Treatment Product\n\n--- PDF PAGE 35 ---\nTR – Barbering NC II\nPromulgated November 2010 31\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nPrepared client through consultation according to salon\npolicies and procedures\n1.2\nPrepared and used tools, equipment, supplies and\nmaterials for hair and scalp treatment according to\nspecifications and OH&S requirements\n1.3\nUsed appropriate protective clothing and gadget following\nsalon policies and procedure\n1.4\nPerformed hair and scalp treatment according to product\nspecifications and established or acceptable procedures\n1.5 Ensured client’s safety and comfort during the entire\n process\n1.6 Performed post-service activities according to salon\n policies and procedures, and OH&S requirements\n2. Underpinning\nknowledge\n2.1\nSafety Practices\n2.2\nDifferent Treatment Products\n2.3\nMeasurements/Ratios and Proportions\n2.4\nCode of Ethics\n2.5\nSalon Policies and Procedures\n2.6\nHair and Scalp Treatment Procedures and Processes\n2.7\nHair Analysis\n2.8\nHair Types and Condition\n2.9\nTime Management\n2.10 DOH and OH&S requirements\n3. Underpinning\nskills\n3.1\nProper Handling of Tools\n3.2\nOperation of Equipment\n3.3\nCommunication Skills\n3.4\nApplication of Treatment Product\n3.5\nApplication of Massage Technique\n3.6\nChecking of Hair and Scalp Condition\n3.7\nCompliance to DOH and OH&S Requirements\n3.8\nSafekeeping of Equipment and Tools\n3.9\nCompliance to Target Treatment Timeline\n3.10 Observing Code of Ethics\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Model\n4.2 Tools, equipment and supplies/materials relevant to the\nactivity to be performed\n4.3 Work area/facilities\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1 Demonstration with Oral Questioning\n5.2 Third-Party Report\n5.3 Portfolio\n6. Context of\nassessment\nAssessment may be conducted in the actual workplace or\nTESDA accredited assessment center\n\n--- PDF PAGE 36 ---\nTR – Barbering NC II\nPromulgated November 2010 32\nUNIT OF COMPETENCY :\nPERFORM BASIC HAIR COLORING\nUNIT CODE\n:"
