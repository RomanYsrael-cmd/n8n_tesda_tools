        "source_text": "HCS515303\nUNIT DESCRIPTOR :\nThis unit covers the knowledge, skills and attitude in\nperforming basic hair perming. It involves assessing and\npreparing the client, actual performance of hair perming,\nchecking of result and doing necessary finishing touches\nto achieve optimum result.\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Prepare client\n1.1\nClient is advised to remove all personal\naccessories\n1.2\nClient is provided with protective clothing\n1.3\nCondition and type of hair is checked and\nanalyzed\n1.4\nPrevious chemical treatment applied on hair is\ndetermined\n1.5\nScalp condition is checked if free from scratches\nand open wounds\n1.6\nTypes of hair curls is confirmed with client\n2. Perm hair\n2.1\nTools and equipment, supplies/ materials are\nprepared and used according to salon policies and\nprocedures and OH&S requirements\n2.2\nPerm solution is selected and prepared according\nto client’s hair types, texture/condition and product\nspecifications\n2.3\nHair perming is performed in accordance with\nestablished or acceptable procedures and\nproduct specifications\n2.4 Clients’ safety and comfort is ensured during the\nentire process\n2.5 Where necessary, first-aid treatment is provided to\nthe client or referred to health personnel\n3. Apply finishing touches\n3.1\nHair is tampered / trimmed and styled, if\nnecessary\n3.2 Client’s satisfaction is confirmed and adjustment\nare made if required\n4\nPerform post-service\nactivities\n4.1\nClient is advised on hair and care maintenance\n4.2\nTools, equipment, supplies and materials are\ncleaned and stored after use in accordance with\nsalon procedures\n4.3\nWastes items are properly disposed in accordance\nwith OH&S requirements\n4.4\nWorkstation is cleaned and prepared for next\nactivity\n\n--- PDF PAGE 50 ---\nTR – Barbering NC II\nPromulgated November 2010 46\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1.\nHair Conditions\n1.1\nDamaged\n1.2\nTinted\n1.3\nLightened\n1.4\nPorous\n1.5\nDry\n1.6\nGreasy or Oily\n1.7\nNormal\n2.\nScalp Condition\n2.1\nDry/Oily\n2.2\nDandruff\n2.3\nGreasy\n2.4\nWaxy\n2.5\nScaly\n3\nTypes of hair curls\n3.1\nWavy\n3.2\nCurly\n4\nTools and Equipment\n4.1.1 Dryer (Handheld, Hood, Infrared)\n4.2\nCurler\n4.2.1 Small, Medium, Large, Extension, Extra Large, Jumbo\n4.2.2 Wooden Spindle, Nooping, Spiral, Zigzag, Telephone Wire\n4.3\nApplicator\n4.4\nShower Cap\n4.5\nFlannel Headband\n4.6\nDrip Pan\n4.7\nCape\n4.8\nBath Towel\n4.9\nBath Comb\n4.10 Razor/Scissor\n4.11 Hairclips\n4.12 Apron\n4.13 End Paper\n4.14 Ear Pads\n4.15 Tail Comb\n4.16 Rubber Band\n4.17 Rubber Gloves\n5\nSupplies Materials\n5.1\nShampoo\n5.2\nPerm Lotion\n5.3\nNeutralizer\n5.4\nConditioner\n5.5\nEnd Paper\n5.6\nTalcum Powder\n5.7\nTissue Roll\n5.8\nCotton\n5.9\nRubber Band\n5.10\n Disposable Gloves\n6. Established or\nacceptable procedures\nin hair perming\nMay include but are not limited to:\n6.1\nShampoo hair with conditioner and without scratching the scalp\n6.2\nTowel-dry, section and wind hair according to types of hair curls and\napply selected perm solution\n6.3\nCover wounded hair with plastic cap/cling wrap or expose to dry heat\nand check from time to time to determine progress of wave\n6.4\nRinse hair thoroughly without removing curlers and towel-blot\n6.5 Apply neutralizer to the hair and leave-on on specified time\n6.6 Remove curlers / rollers and slightly massage hair and scalp\n6.7 Shampoo and condition hair, rinser thoroughly and towel-dry\n7.\nHair care and\nmaintenance\n7.1\nUse of wide toothed comb\n7.2\nApplication of hair polishing products\n7.3\nDaily hair wash with mild shampoo and conditioner\n7.4\nRegular hair treatment\n\n--- PDF PAGE 51 ---\nTR – Barbering NC II\nPromulgated November 2010 47\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nConsulted and prepared client on the type of curls\nrequired and its procedures\n1.2 Prepared and used tools, supplies/materials and\nprotective clothing according to job requirements and\nOH&S requirements\n1.3 Selected and prepared perming products according to\nclient’s requirements and manufacturer’s specifications\n1.4 Performed hair perming in accordance with established or\nacceptable procedures\n1.5 Ensured clients safety and comfort throughout the whole\n process\n1.6 Applied final touch on hair according to client’s\nrequirements\n1.7 Applied appropriate measures in response to\nemergencies or unavoidable circumstances\n1.8 Performed post-service activities according to salon\n policies and procedures, and OH&S requirements\n2. Underpinning\nknowledge and\nattitudes\n2.1\nCode of Ethics\n2.2\nOH & S Requirements\n2.3\nHair Texture / Condition\n2.4\nDifferent Scalp Condition\n2.5\nHeating Procedures\n2.6\nDifferent Perm Maintenance Program\n2.7\nTime Management\n2.8\nPrinciples of Customer Relations\n2.9\nDifferent Perming Products\n2.10 DOH – IRR and OH&S rules and regulations\n2.11 First-aid treatments\n3. Underpinning\nskills\n3.1\nListening and Questioning Skills\n3.2\nCustomer Relation\n3.3\nHair Sectioning\n3.4\nApplying Winding Technique\n3.5\nApplying Massage Technique\n3.6\nTrimming\n3.7\nProper Shampoo and Blow-dry Technique\n3.8\nHandling Tools and Equipment\n3.9\nUsing Perming Product\n3.10 Observing code of ethics\n3.11 Applying first-aid treatments\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nModel\n4.2\nTools, equipment and supplies/materials relevant to the\nactivity to be performed\n4.3\nWork are/facilities\n5. Methods of\nassessment\nCompetency may be assessed through:\n5.1\nDemonstration with Oral Questioning\n5.2\nPortfolio\n5.3\nThird-Party Report\n6. Context of\nassessment\nCompetency may be assessed in the workplace or TESDA\naccredited assessment center\n\n--- PDF PAGE 52 ---\nTR – Barbering NC II\nPromulgated November 2010 48\nUNIT OF COMPETENCY : PERFORM HAIR RELAXING\n\nUNIT CODE\n:"
