  Greasy \n3.4     Waxy \n3.5   Scaly\n4. Protective clothing \n4.1    Facial mask \n4.2 \nApron \n4.3 \nBath Towel \n4.4\nHead Band\n4. Tools and equipment \n4.1    Steamer \n4.1 \nBlower \n4.2 \nHair brush \n4.4     Mixing bowls \n4.3\nSpatula\n5. Supplies and \nmaterials \n5.1 \nAluminum Foil \n5.2 \nTissue Papers \n5.3     Cling Wrap \n5.4    Towels \n5.5     Different Treatment products\n6. Hair and scalp \ntreatment product \nform \n6.1 \nCream Form \n6.2 \nLiquid Form \n6.3\nGel Form\n7.  Established or \nacceptable \nprocedures in hair \nand scalp treatment  \nMay include but are not limited to: \n7.1   Apply treatment product according to product \nspecifications and massage hair and/or scalp  \n7.2   Expose hair or scalp to heat if necessary, according to \nproduct specifications  \n7.3   Follow correct timeline according to product  \n        specification \n7.4  Rinse hair thoroughly, towel or blow-dry  \n8. Waste \n8.1    Biodegradable \n8.2    Non-Biodegradable\n9. Hair  and scalp  care \nand maintenance \n9.1    Hair and Scalp Frequent Treatment \n9.2   Use of Hair and Scalp Treatment Product\n\n--- PDF PAGE 35 ---\nTR – Barbering NC II \nPromulgated November 2010                            31"
