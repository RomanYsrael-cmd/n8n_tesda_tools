riables\n1. Prepare client\n1.1\nClient is advised to remove all personal\naccessories\n1.2\nClient hair texture and condition together with\nscalp are checked and analyzed\n1.3\nPrevious hair treatment is confirmed with the client\nbefore doing the desired service\n1.4\nClient is draped and shampooed without scratching\nthe scalp\n1.5\nProtective clothing and gadgets are used to\nensure clients safety and comfort\n2. Apply hair relaxing\nproduct\n2.1\nNecessary tools and supplies are prepared and\nused according to OH &S requirements\n2.2\nDifferent form of products are identified and/or\nmixed based on types of hair in accordance with\nmanufacturer’s instructions\n2.3\nHair relaxing is performed according to\nestablished or acceptable procedures and\nproduct specifications\n2.4\nClient’s safety and comfort is observed during the\nentire process\n2.5 Where necessary, first-aid treatment is provided to\nthe client or referred to health personnel\n3. Apply fixing solution\n3.1\nFixing solution is applied on the hair in accordance\nwith manufacturer’s instructions\n3.2\nHair is rinsed thoroughly and necessary post-\ntreatment product is applied in accordance with\nmanufacturer’s instructions and salon procedures\n3.3\nResult is checked and hair is styled according to\nclient’s desired outcome\n4. Perform post- service\nactivities\n4.1 Client is advised with appropriate hair care and\nmaintenance\n4.2 Tools, implements and equipments are cleaned,\nsterilized/sanitized and stored after use in\naccordance with salon policies\n4.3\nWastes items are properly disposed in accordance\nwith OH&S requirements\n4.4\nWorking area is cleaned in preparation for the next\nclient\n\n--- PDF PAGE 53 ---\nTR – Barbering NC II\nPromulgated November 2010 49\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Personal accessories\n1.1\nEarrings\n1.2\nNecklace\n2. Hair Texture\n2.1 Fine\n2.2 Medium\n2.3 Coarse\n2.4 Wiry\n3. Hair Condition\n3.1 Damaged\n3.2 Tinted\n3.3 Lightened\n3.4 Porous\n3.5 Dry