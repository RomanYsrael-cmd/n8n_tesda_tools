        "evidence_guide": {
          "source_text": "1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nPrepared client according to salon policies and\nprocedures\n1.2\nPrepared and used of tools, supplies/materials according\nto type of service and OH&S requirements\n1.3\nApplied correct techniques in draping, shampooing and/or\nconditioning and blow-drying of hair in accordance with\nservice requirements and established or acceptable\nprocedures\n1.4\nEnsured client’s safety and comfort during the entire\nprocess\n1.5\nApplied questioning and listening skills in assessing the\nneed of clients\n2. Underpinning\nknowledge\n2.1\nSalon Policies and Procedures\n2.2\nDifferent Types of Shampoo and Conditioner\n2.3\nProper Use of Tools, Supplies and Materials\n2.4\nCode of Ethics\n2.5\nDifferent Types and Condition of Hair\n2.6\nOH & S Rules and Regulations\n2.7\nHair Analysis\n2.8\nWater Temperature\n2.9\nProper Hygiene\n2.10 Hair Finishing Products\n2.11 Different Salon Services\n3. Underpinning\nskills\n3.1\nConducting Hair Analysis\n3.2\nCommunication Skills\n3.3\nDraping Technique\n3.4\nShampooing and Conditioning Techniques\n3.5\nHair Blow-drying Technique\n3.6\nSetting and Using of Tools and Equipment\n3.7\nUsing of Supplies/Materials and Implements\n3.8\nHair Sectioning\n3.9\nFollowing Salon Policies and Procedures\n3.10 Observing Code of Ethics\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Model\n4.2 Tools, equipment and supplies/materials relevant to the\nactivity to be performed\n4.3\nWork area/facilities\n5. Method of\nassessment\nCompetency MUST be assessed through:\n5.1 Demonstration with Oral Questioning\n5.2 Third-Party Report\n5.3 Portfolio\n6. Context of\nassessment\nCompetency may be assessed in the workplace or TESDA\naccredited assessment center\n\n--- PDF PAGE 33 ---\nTR – Barbering NC II\nPromulgated November 2010 29\nUNIT OF COMPETENCY :\nPERFORM HAIR AND SCALP TREATMENT\nUNIT CODE\n:"
        },
        "source_text": "HCS515301\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitude in\nperforming pre- and post- hair care activities. These\ninclude the draping of the client, preparing client,\napplying shampoo and/or conditioner on hair and blow-\ndrying of hair.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Prepare client\n1.1\nClient is assisted in accordance with salon procedures\n1.2\nBuilt of the client is assessed to determine\nappropriate size of drapery to be used\n1.3\nAppropriate clothing is provided according to the\ndesired type of service and size and built of the client\n1.4\nClient is advised to remove all jewelries and\naccessories\n2. Apply shampoo\nand/or conditioner on\nthe client\n2.1\nNecessary tool, supplies and materials are selected\nand prepared according to the type of service\n2.2\nHair is checked and analyzed to determine appropriate\nshampoo and/or conditioner to be used in accordance\nwith the type of hair damage\n2.3\nHair is shampooed and or/conditioned in accordance\nwith the type of service and established or\nacceptable procedures\n2.4 Where necessary, first-aid treatment is provided to the\nclient or referred to health personnel\n2.5 Client’s safety and comfort is ensured during the\nentire process\n3. Blow-dry hair\n3.1\nHair is toweled, dried and combed according to service\nrequirements\n3.2\nBlow-drying is performed according to service\nrequirements and established or acceptable\nprocedures\n3.3 Finishing product is applied on blow-dried hair\naccording to product specifications\n3.4 Client’s safety and comfort is ensured during the entire\nprocess\n4. Perform post-service\nactivities\n4.1\nTools and equipment are cleaned, sanitized and\nstored according to OH&S requirements\n4.2\nWaste materials are segregated and disposed\naccording to OH&S requirements\n\n--- PDF PAGE 31 ---\nTR – Barbering NC II\nPromulgated November 2010 27\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Clients’ Built\n1.1 Small\n1.2 Medium\n1.3 Large\n1.4 Extra Large\n2. Types of Services\n2.1 Hair Treatment\n2.2 Hair Coloring\n2.3 Hair Perming\n2.4 Hair Relaxing\n2.5 Hair Cut\n3. Tools\n3.1 Comb\n3.2 Blower\n3.3 Brush\n3.4 Mirror\n4. Supplies/Materials\n4.1 Shampoo\n4.2 Conditioner\n4.3 Towel\n4.4 Neck Band\n4.5 Tissue\n5. Established or\nacceptable\nprocedures in hair\nshampooing and/or\nconditioning\nMay include but are not limited to:\n5.1 Comb/brush hair to free from entanglement before\nactual shampooing and/or conditioning\n5.2 Apply amount of shampoo and/or conditioner according\nto clients’ hair length and volume, and type of service\n5.3 Apply appropriate water temperature\n5.4 Follow shampooing and/or conditioning technique and\n procedures\n5.5 Rinse hair thoroughly and towel-dry\n6. Established or\nacceptable\nprocedures in blow-\ndrying hair\nMay include but are not limited to:\n6.1 Set correct temperature\n6.2 Apply appropriate sectioning using hair implements to\n achieve optimum results\n6.3 Apply blow-dry technique according to service\n requirements\n7. Hair finishing\nproducts\n7.1 Setting Lotion/Gel\n7.2 Hair wax (Wet and Dry)\n7.3 Hair serum\n7.4 Hair spray\n7.5 Mousse\n7.6 Leave-on conditioner\n\n--- PDF PAGE 32 ---\nTR – Barbering NC II\nPromulgated November 2010 28\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nPrepared client according to salon policies and\nprocedures\n1.2\nPrepared and used of tools, supplies/materials according\nto type of service and OH&S requirements\n1.3\nApplied correct techniques in draping, shampooing and/or\nconditioning and blow-drying of hair in accordance with\nservice requirements and established or acceptable\nprocedures\n1.4\nEnsured client’s safety and comfort during the entire\nprocess\n1.5\nApplied questioning and listening skills in assessing the\nneed of clients\n2. Underpinning\nknowledge\n2.1\nSalon Policies and Procedures\n2.2\nDifferent Types of Shampoo and Conditioner\n2.3\nProper Use of Tools, Supplies and Materials\n2.4\nCode of Ethics\n2.5\nDifferent Types and Condition of Hair\n2.6\nOH & S Rules and Regulations\n2.7\nHair Analysis\n2.8\nWater Temperature\n2.9\nProper Hygiene\n2.10 Hair Finishing Products\n2.11 Different Salon Services\n3. Underpinning\nskills\n3.1\nConducting Hair Analysis\n3.2\nCommunication Skills\n3.3\nDraping Technique\n3.4\nShampooing and Conditioning Techniques\n3.5\nHair Blow-drying Technique\n3.6\nSetting and Using of Tools and Equipment\n3.7\nUsing of Supplies/Materials and Implements\n3.8\nHair Sectioning\n3.9\nFollowing Salon Policies and Procedures\n3.10 Observing Code of Ethics\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Model\n4.2 Tools, equipment and supplies/materials relevant to the\nactivity to be performed\n4.3\nWork area/facilities\n5. Method of\nassessment\nCompetency MUST be assessed through:\n5.1 Demonstration with Oral Questioning\n5.2 Third-Party Report\n5.3 Portfolio\n6. Context of\nassessment\nCompetency may be assessed in the workplace or TESDA\naccredited assessment center\n\n--- PDF PAGE 33 ---\nTR – Barbering NC II\nPromulgated November 2010 29\nUNIT OF COMPETENCY :\nPERFORM HAIR AND SCALP TREATMENT\nUNIT CODE\n:"
