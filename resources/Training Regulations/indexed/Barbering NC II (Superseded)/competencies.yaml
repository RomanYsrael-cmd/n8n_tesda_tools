        "source_text": "HCS515329\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitude in\nperforming chair spot massage in a barber shop.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Prepare client\n1.1\nClient is consulted on the desired type of chair spot\nmassage and massage products are used\naccording to client’s body condition\n1.2\nClient is provided with protective clothing material\nin accordance with the type of massage to be\nperformed\n1.3\nAll products, tools and equipment are selected and\nprepared according to OH & S requirements\n1.4\nClient is advised to remove all personal accessories\nand kept in a safe place\n2. Massage client\n2.1\nClient is laid in a position ensuring the safety and\ncomfort during the entire process\n2.2\nRequired strokes are applied according to type of\nmassage, and salon standards and procedures\n2.3\nAppropriate timeline is observed according to salon\npolicies and procedures\n2.4\nAny pain / complain made by the client is\nimmediately acknowledged and responded to\n2.5\nTools and equipment are used according to OH&S\nrequirements\n3. Perform post -service\nactivities\n3.1\nTools and cubicle is sanitized and prepared for the\nnext salon activity\n3.2\nMassage products are cleaned and stored in\ndesignated cabinets\n3.3\nMassage activity is recorded according to salon\npolicies and procedures\n\n--- PDF PAGE 47 ---\nTR – Barbering NC II\nPromulgated November 2010 43\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Chair spot massage\n1.1 Head and scalp\n1.2 Arms and back\n2. Massage products\n2.1 Lotion\n2.2 Aromatic Oil\n2.3 Olive Oil\n2.4 Powder\n2.5 Mentholated Oil\n2.6 Herbal Oil\n3. Protective clothing\nmaterials\n3.1 Face Towel\n3.2 Gauze Mask\n3.3 Head Band\n3.4 Apron\n4. Movements/Stroke\n4.1 Spreading (Effleurage)\n4.2 Pressing\n4.3 Sliding (Friction)\n4.4 Circular\n4.5 Tapping (Tapotement)\n4.6 Kneading (Petrissage)\n4.7 Stretching\n4.8 Vibration\n5. Massage Technique\n5.1 Soft Pressure\n5.2 Hard Pressure\n\n--- PDF PAGE 48 ---\nTR – Barbering NC II\nPromulgated November 2010 44\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nConsulted client on the desired chair spot massage\n1.2\nPrepared and used tools, supplies and materials\naccording to OH & S requirements\n1.3\nMassage products are used according to client’s body\ncondition\n1.4\nPerformed chair spot massage chosen and applied\nappropriate strokes according to prescribed direction\n1.5\nObserved timeline according to salon policies and\nprocedures\n1.6\nEnsured client’s comfort and safety during the entire\nprocess\n1.7\nAdvised clients on safety precautions after the\nmassage\n1.8\nAcknowledged and responded to any pain or\ncomplains made by the client\n1.9\nPerformed post-service activities in accordance with\nsalon policies and OH&S requirements\n2. Underpinning\nknowledge\n2.1\nDifferent types of chair spot massage\n2.2\nOH&S policies and procedures\n2.3\nProtective clothing\n2.4\nSalon policies and procedures\n2.5\nClient relations\n2.6\nDifferent massage products\n2.7\nCode of ethics\n2.8\nFirst-aid treatments\n3. Underpinning skills\n3.1\nObserving personal hygiene\n3.2\nApplying different types of chair spot massage\n3.3\nUsing of tools and equipment\n3.4\nUsing of appropriate strokes / movements\n3.5\nUsing of different massage product\n3.6\nApplying first-aid treatment\n3.7\nObserving code of ethics\n3.8\nApplying first-aid treatments\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nModel\n4.2\nTools, equipment and supplies/materials relevant to\nthe activity to be performed\n4.3 Work area/facilities\n5. Method of\nassessment\nCompetency MUST be assessed through:\n5.1\nDemonstration with Questioning\n5.2 Third-Party Report\n5.3 Portfolio\n6. Context of\nassessment\nCompetency may be assessed in the simulated work area or\nTESDA accredited assessment center\n\n--- PDF PAGE 49 ---\nTR – Barbering NC II\nPromulgated November 2010 45\nELECTIVE COMPETENCIES\n\nUNIT OF COMPETENCY :\nPERFORM BASIC HAIR PERMING\nUNIT CODE :"
