          "source_text": "1.   Prepare client \n1.1  Appropriate courtesy is extended to the client at all   \n        times \n1.2  Shaving and style for beard or mustache is   \n        consulted and assessed according to client’s desire \n1.3   Protective clothing are selected and prepared  \n         according to client’s requirements,  workplace \nsafety and hygiene procedures  \n2. Shave beard or   \n      mustache \n2.1  Tools and gadgets are prepared and used   \n        according to OH&S requirements \n2.2    Wet lather or shaving cream is applied and   \n         massaged to the area to be shaved \n2.3   Shaving is performed according to client’s   \n         requirements and established or acceptable    \nprocedures \n2.4    Blood spots are treated according to OH&S   \n        requirements and workplace practices   \n3.   Design/style beard or     \n      mustache \n3.1     Over-comb techniques are applied in a logical \nsequence to remove bulk and to shape beard and \nmustache \n3.2     Beard and moustache lines are defined according \nto agreed design using scissors and/or clippers \n3.3     Client comfort, safety and hygiene are maintained \nthroughout the service according to OH&S \nrequirements \n3.4     Excess hair is removed from client and disposed of \naccording to relevant workplace policies and \nprocedures  \n4.  Perform post- service \nactivities \n4.1 \nClient is advised on beard and moustache care and \nmaintenance  \n4.2 \nTools, implements and equipments are cleaned, \nsterilized and stored in accordance with salon \npolicy \n4.3     Wastes items are properly disposed in accordance \nwith OH&S required practice \n4.4     Working area is cleaned in preparation for the next \nclient\n\n--- PDF PAGE 44 ---\nTR – Barbering NC II \nPromulgated November 2010                            40 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.  Shaving and style \n1.1  Lessen the volume \n1.2  Totally shave \n1.3  Re-shape \n2.   Protective clothing  \n2.1   Mask \n2.2   Smock Gown \n2.3   Apron \n3.   Established or \nacceptable procedures \nin shaving \nMay include but are not limited to: \n3.1  Apply shaving strokes with razor at the appropriate \nangle and to a predetermined pattern with the skin \nstretched taut \n3.2  Shave face area to a predetermined pattern and \nagainst the grain for a smooth shave \n3.3  Shave neck area to a predetermined pattern and in \nthe direction of hair growth to avoid tearing skin\n3.  Over-comb techniques \n3.1  Scissor over-comb \n3.2  Clipper over-comb \n3.3  Clippers with comb-guards\n\n--- PDF PAGE 45 ---\nTR – Barbering NC II \nPromulgated November 2010                            41"
