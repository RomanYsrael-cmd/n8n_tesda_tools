        "source_title": "PERFORM HAIR RELAXING",
        "source_text": "--- PDF PAGE 52 ---\nTR – Barbering NC II \nPromulgated November 2010                            48 \nUNIT OF COMPETENCY :    PERFORM HAIR RELAXING  \n \nUNIT CODE \n: \nHCS515405 \n \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge, skills and attitude in the \nperformance of hair relaxing in barber’s salon.  This includes \npreparing the client, applying hair relaxing product, and \nperforming final touches. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1.  Prepare client \n1.1 \nClient is advised to remove all personal \naccessories \n1.2 \nClient hair texture and condition together with \nscalp are checked and analyzed \n1.3 \nPrevious hair treatment is confirmed with the client \nbefore doing the desired service \n1.4 \nClient is draped and shampooed without scratching \nthe scalp \n1.5 \nProtective clothing  and gadgets are used to \nensure clients safety and comfort \n2.  Apply hair relaxing \nproduct \n2.1 \nNecessary tools and supplies are prepared and \nused according to OH &S requirements \n2.2 \nDifferent form of products are identified and/or \nmixed based on  types of hair in accordance with \nmanufacturer’s instructions \n2.3 \nHair relaxing is performed according to \nestablished or acceptable procedures and \nproduct specifications \n2.4 \nClient’s safety and comfort is observed during the \nentire process \n2.5    Where necessary, first-aid treatment is provided to \nthe client or referred to health personnel\n3.  Apply fixing solution \n3.1 \nFixing solution is applied on the hair in accordance \nwith manufacturer’s instructions  \n3.2 \nHair is rinsed thoroughly and necessary post-\ntreatment product is applied in accordance with \nmanufacturer’s instructions and salon procedures \n3.3 \nResult is checked and hair is styled according to \nclient’s desired outcome  \n4.  Perform post- service \nactivities \n4.1    Client is advised with appropriate hair care and \nmaintenance  \n4.2    Tools, implements and equipments are cleaned,  \nsterilized/sanitized and stored after use in \naccordance with salon policies \n4.3 \nWastes items are properly disposed in accordance \nwith OH&S requirements \n4.4 \nWorking area is cleaned in preparation for the next \nclient\n\n--- PDF PAGE 53 ---\nTR – Barbering NC II \nPromulgated November 2010                            49 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.  Personal accessories\n1.1\nEarrings\n1.2\nNecklace \n2. Hair Texture\n2.1    Fine \n2.2    Medium \n2.3    Coarse \n2.4    Wiry \n3.  Hair Condition\n3.1   Damaged\n3.2     Tinted \n3.3     Lightened \n3.4     Porous \n3.5     Dry \n3.6     Greasy or Oily \n3.7   Normal\n4.\nProtective Materials and \nClothing \n4.1\nRubber Cape\n4.2 \nBath Towel \n4.3 \nEar Pads \n4.4 \nApron \n4.5 \nGloves \n4.6 \nMask \n \n5. Tools \n5.1\nMixing Bowl\n5.2 \nScoop or Spatula \n5.3 \nTail Comb \n5.4 \nHand Blower \n5.5 \nHair Brush \n5.6 \nClips or Clamps \n5.7 \nWide Toothed Comb  \n6. Supplies \n6.1\nShampoo\n6.2 \nStraightening \n6.3 \nConditioner \n6.4 \nStyling Products \n6.5 \nFixing Solution \n6.6\nTissue\n7.\nDifferent Forms of Relaxing \nProduct \n7.1\nCream\n7.2 \nLiquid \n7.3\nGel\n8. Types of Hair\n8.1\nWavy\n8.2 \nCurly \n8.3     Straight    \n9.\nEstablished or acceptable \nprocedures in hair relaxing \nMay include but are not limited to:\n9.1    Apply protection product on hairline and scalp \n9.2    Section hair  \n9.3    Apply product on the hair  \n9.4    Check hair randomly to monitor progress of hair \nrelaxing \n9.5    Follow development time according to product \nspecifications and hair condition \n9.6   Rinse hair thoroughly\n10.Hair care and maintenance \n10.1\nShampoo\n10.2 Conditioner \n10.3\nTreatment\n\n--- PDF PAGE 54 ---\nTR – Barbering NC II \nPromulgated November 2010                            50 \nEVIDENCE GUIDE \n \n1. Critical aspects \nof competency \nAssessment requires evidence that the candidate: \n1.1     Consulted and prepared client on hair relaxing procedures \n1.2     Prepared and used protective clothing and gadgets, tools  \nand equipment according to OH&S requirements \n1.3     Identified and mixed relaxing product based on client’s type \nof hair in accordance with manufacturer’s specifications \n1.4    Applied protection product on hairline and scalp according  \n          to manufacturer’s specifications  \n1.5     Performed hair relaxing in accordance with established or \nacceptable procedures and product specifications \n1.6    Ensured client’s safety and comfort during the entire \nprocess \n1.7    Applied appropriate measures in response to emergencies \nor unavoidable circumstances \n1.8      Performed post-service activities in accordance with          \n          standard procedures and salon policies\n2. Underpinning \nknowledge  \n2.1 \nCode of ethics \n2.2 \nSalon procedures/policies \n2.3 \nHuman relations \n2.4 \nHair and scalp analysis \n2.5 \nHair sectioning \n2.6 \nDifferent tools and materials: Their uses and specifications \n2.7 \nDifferent relaxing products \n2.8 \nHair relaxing procedures and techniques \n2.9 \nDOH – IRR and OH&S rules and regulations \n2.10    First-aid treatments   \n3. Underpinning \nskills \n3.1 \nCommunication skills \n3.2 \nConducting hair and scalp analysis \n3.3 \nUsing tools and materials \n3.4 \nApplying relaxing products \n3.5 \nPerforming relaxing procedures \n3.6 \nApplying hair and scalp protective products \n3.7 \nPerforming hair sectioning \n3.8 \nBlow-drying technique \n3.9 \nApplying shampooing technique \n3.10 Checking of results \n3.11 Draping clients \n3.12 Applying first-aid procedures \n3.13\nObserving code of ethics\n4. Resource \nimplications \nThe following resources MUST be provided: \n4.1 \nModel \n4.2     Tools, equipment and supplies/materials relevant to the \nactivity to be performed \n4.3     Work area/facilities\n5. Method of \nassessment \nCompetency may be assessed through: \n5.1 \nDemonstration with Oral Questioning \n5.2  \nPortfolio \n5.3 \nThird-Party Report\n6. Context of \nassessment\nCompetency may be assessed in the workplace or TESDA \naccredited assessment center\n",
