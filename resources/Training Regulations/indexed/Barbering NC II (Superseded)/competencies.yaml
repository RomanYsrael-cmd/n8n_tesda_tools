  "source_section_text": "Section 1. Successful candidates shall be awarded a National Certificate\nsigned by the TESDA Director General.\n\n4.2 The Qualification of BARBERING NC II may be attained through\ndemonstration of competence in a project-type assessment covering the\nfollowing core units of the Qualification:\n\n4.2.1 Perform pre- and post- hair care activities\n4.2.2 Perform hair and scalp treatment\n4.2.3 Perform basic hair coloring\n4.2.4 Perform haircut\n4.2.5 Shave and style beard and mustache\n4.2.6 Perform chair spot massage\n\n4.3 Certificate of Competency (COC) can be issued in the following cluster or\ngroup of core units of the qualification.\n\n 4.3.1 Performing hair coloring services\n 4.3.1.1 Perform pre and post- hair care activities\n\n4.3.1.2 Perform basic hair coloring\n\n4.4 Assessment shall focus on the core units of competency. The basic and\ncommon units shall be integrated or assessed concurrently with the core\nunits.\n\n4.5 The following are qualified to apply for assessment and certification:\n\n4.5.1 Graduates of formal and non-formal including enterprise-based\ntraining programs.\n4.5.2 Experienced workers (wage-employed or self-employed)\n\n4.6 The guidelines on assessment and certification are discussed in detail in the\n“Procedures Manual on Assessment and Certification” and “Guidelines on\nthe Implementation of the Philippine TVET Qualification and Certification\nSystem (PTQCS)”.\n\n--- PDF PAGE 67 ---\nTR – Barbering NC II\nPromulgated November 2010 63\n\n--- PDF PAGE 68 ---\nTR – Barbering NC II\nPromulgated November 2010 64\n\nDEFINITION OF TERMS\n\nAnalysis Hair\n-\nan examination to determine the condition of the hair prior to a hair\ntreatment\nAniline\nDerivative\nTints\n-\nare also known as penetrating tints, synthetic, organic tints and\nperoxide or oxidation tints and are commonly called tints in the\nindustry\nBack Combing -\ncombing the short hair toward the scalp while the hair strand is held\nin a vertical position also called teasing\nBarbering\n-\nshould be done at eye level starting at the hairline. A method used\nin cutting the hair closed to the scalp and refer to as scissor over\ncomb\nBaseline\n-\nthe first/foundation line to be cut which subsequent sections are cut\nto\nBasic\nHairshaping\n-\nShaping the hair that is not too long or too short to different head\nshape\nBleaching\n-\nremoving the natural pigmentation\nBlunt cutting\n-\nall hair strands must direct at the same point. The hair appears to be\nthe same length\nBob\n-\na level haircut above the shoulders\nBraid\n-\nto weave interlace or entwine together\nChemical\ndamage\n-\ndamage to the hair fibre through the overuse of chemicals such as\npermanent waves, colour, hydrogen peroxide, ammonia\nClippers\n-\nare like electric razors mostly used to smoothen the back of the neck\nCoiffure\n-\nan arrangement or dressing of the hair\nCold waving\n-\na system of permanent waving involving the use of chemicals,\nwithout the application of heat\nColor Fillers\n-\nare used if the hair is in damaged condition and there is doubt that\nthe color result will be an even shade\nColor\nstripping\n-\nremoving artificial color by bleaching or chemical color stripper\nColor test/tint\n-\na method of determining the action of color on a small strand of hair\nConditioner\n-\ncreams, waxes and oils which help protect and maintain the health\nand condition of the hair\nConditioning\n-\nthe application of special chemical agents to the hair to help restore\nits strength and give it body in order to protect it against possible\nbreakage\nContour\nwinding\n-\na loose wave, winding the perm rods to the contour of the head -\nshape\nCuticle\n-\nthe outer layer of the hair; the hard skin at the base of the fingernail\nDesign\n-\na plan or arrangement of a hairstyle\nDiffuser\n-\nan attachment on a blow dryer that “shatters’ the flow of air so that\nthe hair can be soft styled\nDye\n-\nto color or stain the hair with tint\n\n--- PDF PAGE 69 ---\nTR – Barbering NC II\nPromulgated November 2010 65\n\nElasticity\n-\nthe ability of the hair to stretch and return to its original form without\nbreaking\nEmulsifying\nagent\n-\na substance used to form an emulsion, e.g. shampoo\nEnd paper\n-\na small paper tissue used at the end of a strand of hair to assist the\nwinding of the perm rod\nFrosting\n-\nto lighten or darken small selected strands of hair over the entire\nhead to blend with the root of the hair\nGraduation\n-\nthe grade at which the hair is cut by degrees\nGuideline\n-\na line to follow when shaping the balance of the hair\nHair analysis\n-\nan examination to determine the condition of the hair prior to a hair\ntreatment\nHair Density\n-\nthe amount of hair strands per square inch on the scalp\nHair Cutting\n-\na process to thinning, tapering and shortening of the hair into a\nbecoming shapes or styles\nHair Extension -\nprocess used to add volume or length to your hair by bonding\nsynthetic or real hair at your roots.\nHairstyling\n-\na process of arranging the hair into a temporary design\n\n-\nInvolves arranging the hair in a particular style, appropriately suited\nto the cut, and may require the use of hairstyling aid such as hair\nspray, gel or mousse\nHair stylist\n-\na person who designs and dresses the hair\nHot oil\ntreatment\n-\na process of treating hair and scalp\nIrons\n-\none of the most important hair tool inventions in the last 20 years.\nCreates poker straight hair as well as beautiful curls depending on\nwhich technique you use\nKeratin\n-\nkeratin is a protein that your hair is made up of.\nLayer/Layering\n-\nholding the hair out from the head at a 90 degree angle and then\nremoving a defined amount to remove volume, give movement, and\nadded texture\nLysine\n-\nan animo acid found in hair\nMedulla\n-\na hollow pith or core of the hair fibre.\nMelanin\n-\n the dark or black pigment in the epidermis and hair, and in the\nchoroids or coat of the eye\nNeutralizer\n-\nan agent capable of neutralizing another substance\nNormal hair\nshedding\n-\na certain amount of hair is shed daily. This is nature’s method to\nmake way for new hair. The average daily shedding is estimated at\n50-80 hairs. Hair loss beyond this estimated average indicates some\nscalp or hair trouble.\nLayering\n-\nis a technique used by hairdressers to change the thickness of the\nhair, creating either a thinning or thicker appearance. In this way the\nhair can be given a fuller appearance, more texture and movement.\nPatch or skin\ntest\n-\ntest to prove that chemicals will have no allergic reaction on scalp\nPerm\n-\nabbreviation for permanent wave\n\n--- PDF PAGE 70 ---\nTR – Barbering NC II\nPromulgated November 2010 66\nPorosity\n-\nability of the hair to absorb moisture\nRebonding\n-\nrejoining the lines and bonds on the keratin chais – neutralizing\nRelaxer\n-\na chemical applied to the hair to remove the natural curl\nRetouch\n-\nto recolor the regrowth\nSectioning\n-\nsectioning your hair allows you to only pay attention to a particular\narea or panel of hair. You or your hairdresser will do this when blow-\ndrying, cutting or colouring your hair, and will section your hair by\ntaking a panel of hair and pinning or ignoring the rest.\nSetting lotion\n-\na liquid used to facilitate setting, retaining the holding power of the\nset (or blow dry) by coating the hair fibre and thereby resisting the\nabsorption of moisture\nSerum\n-\na serum is a smoothing product to stop your hair from frizzing,\nkeeping it smooth and straight. You’ll be able to find a serum that is\nspecifically designed to your own hair type.\nShimmering\n-\nshading or tinting parts of the hair to enhance the style\nShingling\n-\nis cutting the hair close to the nape and gradually longer toward the\ncrown, without showing a definite line\nSlithering\n-\ntapering the hair to graduated length with scissors\nSpiral winding\n-\nwinding the hair from roots to points.\nStack winding\n-\na method of permanent waving whereby the perm rod are built up on\ntop of each other, in a pile\nStreaking\n-\nlayers or strands of hair with a contrasting color, usually placed so as\nto enhance the appearance\nSymmetrical\n-\nhair equally distributed on both sides of the head\nTaper\n-\nto diminish a strand of hair gradually toward the points by cutting.\nRemoving bulk from the ends of the hair\nThinning\n-\nremoving bulk from the hair\nToners\n-\nthe colors applied to hair which has been lightened – delicate pastel\nshades, e.g. champagne, beige, silver\nTexture\n-\ncoarseness and fineness of the hair\nTexturizing\n-\nis performed after the over all cut has been completed. Thinning or\nnotching are used to create wispy or spiky effect.\nTreatment\n-\na treatment is used in between Shampoo and Conditioner to put\nprotein back into the hair. You should leave the treatment in your hair\nfor approximately 5 minutes before using your conditioner. You’ll be\nable to find a treatment designed for your hair type.\nTrichologist\n-\na person trained in the science of caring for the hair\nTrichology\n-\nthe study of the structure and functions of the hair\nToupee\n-\nis a small wig used to cover the top and crown of the head\nVent brush\n-\na brush with widely spaced plastic bristles designed to be used while\nblow drying\nWig\n-\nan artificial covering for the head consisting of a newtwork of\ninterwoven hair\n\n--- PDF PAGE 71 ---\nACKNOWLEDGEMENTS\n\nThe Technical Education and Skills Development Authority (TESDA)\nwishes to extend thanks and appreciation to the many representatives of\nbusiness, industry, academe and government agencies who donated their\ntime and expertise to the development and validation of these Training\nRegulations.\nINDUSTRY EXPERTS\n\nREVIEW PANEL (2010)\nEMMA P. ALBIOR\nMARIA EVANGELINE V. BERTUMEN\nPhilippine International Haircutters\nPhilippine International Haircutters Association\nAssociation (PIHA)\n(PIHA)\n#2 Anonas St., Project 3, Quezon City\n#2 Anonas