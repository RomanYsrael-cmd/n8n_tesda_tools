s/materials\nand techniques are selected and used according to\nclient’s requirements\n1.5 Cost, maintenance requirements, features and\nbenefits of the service are identified and explained\nto client\n2. Attach and style\nhairpieces\n2.1 Client’s head circumference is measured for wig\nfitting\n2.2 Selected hairpiece is attached securely to client’s\nhead following manufacturer’s specifications and\ndesired result\n2.2 Hairstyle is created following elements of design\nand client’s requirements\n2.3 Client’s satisfaction is confirmed and adjustments\nare made if required\n3. Maintain hairpieces\n\n3.1 Hairpiece’s condition is checked and adjustments\nare made if required\n3.2 Suitable product is identified and selected\nappropriate for type of hairpiece to be cleaned and\nmaintained\n3.3 Manufacturer’s instructions in using product is\nfollowed accordingly\n4. Perform post-service\nactivities\n4.1 Tools and materials are cleaned, sterilized and\n stored in accordance with salon policy\n4.2 Wastes items are properly disposed in accordance\n with OH&S required practice\n4.3 Working area is cleaned in preparation for the next\n client\n\n--- PDF PAGE 56 ---\nTR – Barbering NC II\nPromulgated November 2010 52\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Hairpiece\n1.1 Full head wigs\n1.2 Toupees/wiglets\n2. Hairpiece style\n2.1 Straight\n2.2 Wavy\n2.3 Curly\n3. Personal attributes\n3.1 Age\n3.2 Personal image\n3.3 Job or career\n4. Tools\n4.1 Blow dryers\n4.2 Brushes\n4.3 Combs\n5. Supplies/Materials\n5.1 Pins\n5.2 Duckbill\n5.3 Measuring tape\n5.4 Neck strip\n5.5 Styling cape\n5.6 Towel\n5.7 Tissues\n5.8 Styling product\n - Gel/Styling gel\n - Spray net\n6. Desired result\n6.1 Symmetry/Balance\n6.2 Evenness\n6.3 Wig/toupee blends with natural hair\n6.4 No visible hair implements and attachments\n7. Elements of design\n7.1 Line\n7.2 Color\n7.3 Texture\n7.4 Shape\n7.5 Size\n\n--- PDF PAGE 57 ---\nTR – Barbering NC II\nPromulgated November 2010 53\nEVIDENCE GUIDE\n1. Criti