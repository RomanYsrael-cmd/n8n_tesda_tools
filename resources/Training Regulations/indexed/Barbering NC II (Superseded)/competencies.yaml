        "evidence_guide": {
          "source_text": "1. Critical aspects\nof competency\nAssessment requires evidence that the candidate:\n1.1 Consulted client on color options and performed skin test\nprior to hair coloring\n1.2 Checked and analyzed hair condition and scalp\n1.3 Selected, prepared and used tools, materials and\nimplements according to client’s requirements and OH&S\nrequirements\n1.4 Selected and mixed color products and developer based on\nclient’s desired outcome and hair condition following\nproduct specifications\n1.5 Performed hair coloring following established or acceptable\n procedures and product specifications\n1.6 Ensured client’s safety and comfort during the entire\n Process\n1.7 Applied appropriate measures in response to emergencies\nor unavoidable circumstances\n1.8\nPerformed post-service activities in accordance with\n standard procedures and salon policies\n2. Underpinning\nknowledge\n2.1\nSkin Test (Patch test as per client safety precautions)\n2.2\nHair Analysis (Consultation)\n2.3 Fundamentals and Principles in Hair Coloring\n2.4 Classification of Hair Coloring\n2.5\nColor Product Knowledge\n2.6 Kinds of Developer\n2.7 Chemical Mixtures\n2.8\nMixing Procedures\n2.9\nColor Development Timeline\n2.10 Mensuration, Mixing Ratio and Proportion\n2.11 Basic Mathematics (Computation)\n2.12 Color Harmony\n2.13 Basic Color Selection\n2.14 Basic Application of Hair Coloring\n2.15 Hair Maintenance Program\n2.16 DOH-IRR and OH&S Requirements\n2.17 Code of Ethics\n3. Underpinning\nskills\n3.1\nApplication Technique on Hair Coloring\n3.2\nShampooing Technique\n3.3\nHandling Tools\n3.4\nHair Sectioning\n3.5\nProper Storage of Products and Tools\n3.6\nDraping Procedure\n3.7\nPerforming Skin Test Procedure\n3.8\nMixing Procedures\n3.9\nObserving Code of Ethics\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nModel\n4.2\nTools, equipment/supplies and materials relevant to the\nactivity to be performed\n4.3\nWork area/facilities\n5. Method of\nassessment\nCompetency MUST be assessed through:\n5.1\nDemonstration with Oral Questioning\n5.2\nThird-Party Report\n5.3 Portfolio\n6. Context of\nassessment\nCompetency may be assessed in the workplace or\nTESDA accredited assessment center\n\n--- PDF PAGE 40 ---\nTR – Barbering NC II\nPromulgated November 2010 36\nUNIT OF COMPETENCY :\nPERFORM HAIRCUT\nUNIT CODE\n:"
        },
        "source_text": "HCS515304\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes in the\nperformance of basic hair coloring. This involves\npreparing the client prior to treatment, the actual\napplication of color and up to post-coloring activity.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Prepare client\n1.1\nClient is consulted and advised on color options and\nchecked for possible skin allergies\n1.2\nCondition of the hair and scalp are checked and\nanalyzed\n1.3 Protecting clothing and materials are prepared and\nused according to OH&S requirements\n1.4\nClient is draped following established procedures to\navoid stains from hair coloring\n1.5 Where necessary, client’s hair is shampooed to\nremove remaining conditioners and styling products,\nmaking sure the scalp is not scratched\n2. Apply color\n2.1\nTools, materials, implements are prepared and used\nfollowing OH&S requirements\n2.2\nColor and developer are selected and mixed\naccording to client’s hair condition and desired\noutcome\n2.3 Color is applied according to product specifications\nand established or acceptable procedures\n2.4 Where necessary, hair is styled according to client’s\nrequirements\n2.5 Client’s safety and comfort is ensured during the\nprocess\n3. Perform post- service\nactivities\n3.1\nClient is advised on hair care and maintenance for\ncolored/dyed hair\n3.2\nTools, materials, implements are cleared, sanitized\nand stored according to OH&S rules and regulations\n3.3 Wastes are disposed of according to OH&S\nrequirements\n3.4 Workstation is cleaned and prepared for next activity\n\n--- PDF PAGE 37 ---\nTR – Barbering NC II\nPromulgated November 2010 33\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Color Options\n1.1 Penetrating Tint\n1.1.1 Semi - permanent\n1.1.2 Permanent\n1.2 Coating Dyes\n8.2.1 Liquid (Blackening Shampoo)\n8.2.2 Powder\n1.3 Temporary\n2. Hair condition\n2.1 Damaged\n2.2 Tinted\n2.3 Lightened\n2.4 Porous\n2.5 Dry\n2.6 Greasy or Oily\n2.7 Normal\n3. Scalp condition\n3.1 Dry/Oily\n3.2 Dandruff\n3.3 Greasy\n3.4 Waxy\n3.5 Scaly\n4. Protective clothings\nand materials\n4.1 Ear Pads\n4.2 Coloring Pads\n4.3 Towels\n4.4 Apron\n4.5 Cape\n4.6 Gloves\n5. Established\nprocedures in draping\nMay include but are not limited to:\n5.1 Client is draped with bath towel with horizontal edge\n folded 2 inches outward\n5.2 Protective material is wrapped around the neck\n5.3 Coloring cape is wrapped around the shoulder\n6. Styling products\n6.1 Gel/Setting Lotion\n6.2 Hair wax (Wet and Dry)\n6.3 Hair serum\n6.4 Hair spray\n6.5 Mousse\n6.6 Leave-on conditioner\n7. Tools, materials and\nImplements\n7.1 Tinting Brush\n7.2 Mixing Bowl\n7.3 Measuring Cap\n7.4 Timer\n7.5 Clips\n7.6 Clamps\n7.7 Blower\n7.8 Infrared\n7.9 Frosting Cap w/ Hook\n7.10 Squeezer\n7.11 Tissue\n7.12 Foil\n\n--- PDF PAGE 38 ---\nTR – Barbering NC II\nPromulgated November 2010 34\nVARIABLE\nRANGE\n7.13 Cotton\n7.14 Colorants\n7.15 Kinds of Developers (depending on the brands)\n8. Mixing Formula for\ncolor and developer\n8.1 1:1 ratio\n8.2 1:2 ratio\n8.3 Other ratio as may be prescribed by the color product\n9. Color Applications\n\n9.1 Fullhead Color\n9.2 Highlights (Frosting, Streaking, Wearing, Slicing)\n9.3 Regrower\n9.4 Retouch\n9.5 Color Correction\n9.6 Pre – pigmentation\n10. Established or\n acceptable\n procedures in hair\n coloring application\nMay include but are not limited to:\n10.1 Section hair\n10.2 Follow application techniques\n10.3 Emulsify product to achieve color balance\n10.4 Check evenness of color through hair strand test and\nexposure to proper lighting following the required\ndevelopment time\n10.5 Rinse hair to remove impurities\n10.6 Shampoo and condition hair\n10.7 Rinse hair and towel-dry\n11. Hair care and\nmaintenance products\n11.1 Shampoo and conditioner for colored hair\n11.2 Finishing Product\n11.3 Hot Oil\n11.4 Hair Spa\n11.5 Styling Aids\n\n--- PDF PAGE 39 ---\nTR – Barbering NC II\nPromulgated November 2010 35\nEVIDENCE GUIDE\n\n1. Critical aspects\nof competency\nAssessment requires evidence that the candidate:\n1.1 Consulted client on color options and performed skin test\nprior to hair coloring\n1.2 Checked and analyzed hair condition and scalp\n1.3 Selected, prepared and used tools, materials and\nimplements according to client’s requirements and OH&S\nrequirements\n1.4 Selected and mixed color products and developer based on\nclient’s desired outcome and hair condition following\nproduct specifications\n1.5 Performed hair coloring following established or acceptable\n procedures and product specifications\n1.6 Ensured client’s safety and comfort during the entire\n Process\n1.7 Applied appropriate measures in response to emergencies\nor unavoidable circumstances\n1.8\nPerformed post-service activities in accordance with\n standard procedures and salon policies\n2. Underpinning\nknowledge\n2.1\nSkin Test (Patch test as per client safety precautions)\n2.2\nHair Analysis (Consultation)\n2.3 Fundamentals and Principles in Hair Coloring\n2.4 Classification of Hair Coloring\n2.5\nColor Product Knowledge\n2.6 Kinds of Developer\n2.7 Chemical Mixtures\n2.8\nMixing Procedures\n2.9\nColor Development Timeline\n2.10 Mensuration, Mixing Ratio and Proportion\n2.11 Basic Mathematics (Computation)\n2.12 Color Harmony\n2.13 Basic Color Selection\n2.14 Basic Application of Hair Coloring\n2.15 Hair Maintenance Program\n2.16 DOH-IRR and OH&S Requirements\n2.17 Code of Ethics\n3. Underpinning\nskills\n3.1\nApplication Technique on Hair Coloring\n3.2\nShampooing Technique\n3.3\nHandling Tools\n3.4\nHair Sectioning\n3.5\nProper Storage of Products and Tools\n3.6\nDraping Procedure\n3.7\nPerforming Skin Test Procedure\n3.8\nMixing Procedures\n3.9\nObserving Code of Ethics\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nModel\n4.2\nTools, equipment/supplies and materials relevant to the\nactivity to be performed\n4.3\nWork area/facilities\n5. Method of\nassessment\nCompetency MUST be assessed through:\n5.1\nDemonstration with Oral Questioning\n5.2\nThird-Party Report\n5.3 Portfolio\n6. Context of\nassessment\nCompetency may be assessed in the workplace or\nTESDA accredited assessment center\n\n--- PDF PAGE 40 ---\nTR – Barbering NC II\nPromulgated November 2010 36\nUNIT OF COMPETENCY :\nPERFORM HAIRCUT\nUNIT CODE\n:"
