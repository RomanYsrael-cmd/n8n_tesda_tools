ipment\n4.1.1 Dryer (Handheld, Hood, Infrared) \n4.2 \nCurler \n4.2.1 Small, Medium, Large, Extension, Extra Large, Jumbo \n4.2.2 Wooden Spindle, Nooping, Spiral, Zigzag, Telephone Wire \n4.3 \nApplicator \n4.4 \nShower Cap \n4.5 \nFlannel Headband \n4.6 \nDrip Pan \n4.7 \nCape \n4.8 \nBath Towel \n4.9 \nBath Comb \n4.10 Razor/Scissor \n4.11   Hairclips \n4.12   Apron \n4.13   End Paper \n4.14   Ear Pads \n4.15   Tail Comb \n4.16   Rubber Band \n4.17    Rubber Gloves \n5\nSupplies Materials\n5.1 \nShampoo \n5.2 \nPerm Lotion \n5.3 \nNeutralizer \n5.4 \nConditioner \n5.5 \nEnd Paper \n5.6 \nTalcum Powder \n5.7 \nTissue Roll \n5.8 \nCotton \n5.9 \nRubber Band \n5.10 \n Disposable Gloves \n6.   Established or \nacceptable procedures \nin hair perming \nMay include but are not limited to: \n6.1 \nShampoo hair with conditioner and without scratching the scalp \n6.2 \nTowel-dry, section and wind hair according to types of hair curls and \napply selected perm solution \n6.3 \nCover wounded hair with plastic cap/cling wrap or expose to dry heat \nand check from time to time to determine progress of wave \n6.4 \nRinse hair thoroughly without removing curlers and towel-blot  \n6.5     Apply neutralizer to the hair and leave-on on specified time \n6.6     Remove curlers / rollers and slightly massage hair and scalp  \n6.7     Shampoo and condition hair, rinser thoroughly and towel-dry  \n7.\nHair care and\nmaintenance  \n7.1\nUse of wide toothed comb \n7.2 \nApplication of hair polishing products \n7.3 \nDaily hair wash with mild shampoo and conditioner \n7.4\nRegular hair treatment\n\n--- PDF PAGE 51 ---\nTR – Barbering NC II \nPromulgated November 2010                            47"
