        "source_text": "HCS515327\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitude in\ncutting hair. It involves conducting initial consultation\nwith the client, assessing their needs, actual cutting of\nthe hair, checking and applying finishing touches and\nperforming post-hair cutting activities.\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Prepare client\n1.1\nAppropriate courtesy is extended to the client at all\ntimes\n1.2\nHaircut needs of client are assessed according to\njob requirements\n1.3\nTexture of hair is analyzed according to types s of\nhair cut styles\n1.4\nHair catalog is presented to the client for selection\nof hair cut style\n1.5\nHaircut styles and kind of cutting is agreed by\nboth client and hairdresser\n1.6\nProtective clothing are used according to health\nand sanitation regulations\n2. Cut hair\n2.1\nAppropriate materials, tools and hair implements\nare prepared and used according to client desired\nhaircut and OH&S requirements\n2.2 Haircutting is performed according to haircut style\nand established or acceptable procedures\n2.3 Client’s safety and comfort is ensured during the\nentire process\n2.4 Where necessary, first-aid treatment is provided to\nthe client or referred to health personnel\n3. Check and apply\nfinishing touches\n3.1 Where necessary, hair is blow dried and checked\n for finishing touches\n3.2 Finishing cutting tools is used according to\ndesired haircut style\n3.3 Hair finishing product is applied as per client’s\n requirements\n3.4 Desired result is checked according to haircut style\n4. Perform post-service\nactivities\n4.1\nClient is advised with proper hair care and\nmaintenance\n4.2\nTools, implements and equipments are cleaned,\nsterilized and stored in accordance with salon\npolicy\n4.3\nWastes items are properly disposed in accordance\nwith OH&S required practice\n4.4\nWorking area is cleaned in preparation for the next\nclient\n\n--- PDF PAGE 41 ---\nTR – Barbering NC II\nPromulgated November 2010 37\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Hair Texture\n1.1 Fine\n1.2 Medium\n1.3 Coarse\n1.4 Wiry\n2. Hair catalog\n2.1 Men’s Cut Catalog\n2.2 Kid’s Cut Catalog\n3. Hair cut styles\n3.1 Barber’s Cut\n3.1.1 Under Cut\n3.1.2 Crew Cut\n3.1.3 Flat Top\n3.1.4 Semi-barbers Cut\n3.1.5 Oasis Cut\n3.1.6 Semi-Bald Cut/Skin Head\n3.1.7 Executive/Corporate Cut\n4. Protective clothing\n4.1 Mask\n4.2 Smock Gown\n4.3 Apron\n5. Materials, Tools and\nImplements\n5.1 Materials\n5.1.1 Clamps and Clips\n\n5.1.2 Tissue\n5.1.3 Powder\n\n5.1.4 Blade\n5.1.6 Bath Towel\n5.2\nImplements\n5.2.1 Cape\n5.2.2 Spray Gun\n5.2.3 Powder\n5.2.4 Barber Brush\n5.2.5 Blower\n5.2.6 Tissue Paper or Towel\n5.2.7 Hair Brush\n5.2.8 Clamps\n5.2.9 Clips\n5.3 Tools\n5.3.1 Combs\n5.3.2 Spray Gun\n5.3.3 Hair brush\n5.3.4 Barber brush\n6. Established or\nacceptable procedures\nin haircutting\nMay include but are not limited to:\n6.1 Shampoo hair and towel dry\n6.2 Section hair (if necessary)\n6.3 Apply cutting technique and style to achieve\n desired haircut\n6.4 Blow-dry or towel dry hair\n7. Finishing Cutting Tools\n7.1 Thinning Scissor\n7.2 Cutting Scissor\n7.3 Clippers\n7.4 Razor blades (Labaha)\n8. Hair Finishing Products/\n\n8.1 Setting Lotion/Gel\n8.2 Hair wax (Wet and Dry)\n8.3 Hair serum\n8.4 Hair spray\n8.5 Mousse\n8.6 Leave-on conditioner\n\n--- PDF PAGE 42 ---\nTR – Barbering NC II\nPromulgated November 2010 38\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nConsulted and prepared client according to desired\nhaircut\n1.2\nPrepared and used appropriate tools, equipments and\nimplements according to OH & S requirements\n1.3\nUsed protective clothing according to health and\nsanitation regulations\n1.4\nPerformed haircutting and techniques according to\ndesired hair cut and established or acceptable procedures\n1.5\nPerformed cross checking and applied appropriate\nfinishing touches\n1.6\nClient’s safety and comfort is ensured during the entire\nprocess\n1.7\nApplied appropriate measures in response to\nemergencies or unavoidable circumstances\n1.8 Performed post-service activities in accordance with\nstandard procedures and salon policies\n2. Underpinning\nknowledge\n2.1\nDifferent hair cut styles and techniques\n2.2\nPrinciples of hair analysis\n2.3\nTricology (Anatomy of Hair/Hair Theory)\n2.4\nDifferent types equipments and cutting tools: Their uses\nand specifications\n2.5\nFirst-aid treatment\n2.6\nDOH-IRR and OH&S requirements\n2.7\nClient relation and handling and consultation technique\n2.8\nPrinciple of sanitation procedures\n2.9\nCode of ethics\n3. Underpinning\nskills\n3.1\nUsing appropriate cutting tools, equipment implements\n3.2\nApplying first aid treatment\n3.3\nConducting client facial shape and hair analysis\n3.4\nCompliance to DOH-IRR and OH&S requirements\n3.5\nPerforming different haircut and styling procedure and\ntechniques\n3.6\nPerforming different clients relation and consultation\n3.7\nDemonstrating sanitation\n3.8\nObserving code of ethics\n3.9\nApplying first-aid treatment\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nLive model\n4.2\nTools, equipment and supplies/materials relevant to the\nactivity to be performed\n4.3\nWork area/facilities\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1\nDemonstration with Oral Questioning\n5.2\nThird-Party Report\n5.3\nPortfolio\n6. Context of\nassessment\nCompetency may be assessed in the workplace or TESDA\naccredited assessment centers\n\n--- PDF PAGE 43 ---\nTR – Barbering NC II\nPromulgated November 2010 39\nUNIT OF COMPETENCY :\nSHAVE AND STYLE BEARD AND MUSTACHE\nUNIT CODE\n:"
