        "source_text": "HCS515328\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitude\nrequired to shave or design/style beard and mustache.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Prepare client\n1.1 Appropriate courtesy is extended to the client at all\n times\n1.2 Shaving and style for beard or mustache is\n consulted and assessed according to client’s desire\n1.3 Protective clothing are selected and prepared\n according to client’s requirements, workplace\nsafety and hygiene procedures\n2. Shave beard or\n mustache\n2.1 Tools and gadgets are prepared and used\n according to OH&S requirements\n2.2 Wet lather or shaving cream is applied and\n massaged to the area to be shaved\n2.3 Shaving is performed according to client’s\n requirements and established or acceptable\nprocedures\n2.4 Blood spots are treated according to OH&S\n requirements and workplace practices\n3. Design/style beard or\n mustache\n3.1 Over-comb techniques are applied in a logical\nsequence to remove bulk and to shape beard and\nmustache\n3.2 Beard and moustache lines are defined according\nto agreed design using scissors and/or clippers\n3.3 Client comfort, safety and hygiene are maintained\nthroughout the service according to OH&S\nrequirements\n3.4 Excess hair is removed from client and disposed of\naccording to relevant workplace policies and\nprocedures\n4. Perform post- service\nactivities\n4.1\nClient is advised on beard and moustache care and\nmaintenance\n4.2\nTools, implements and equipments are cleaned,\nsterilized and stored in accordance with salon\npolicy\n4.3 Wastes items are properly disposed in accordance\nwith OH&S required practice\n4.4 Working area is cleaned in preparation for the next\nclient\n\n--- PDF PAGE 44 ---\nTR – Barbering NC II\nPromulgated November 2010 40\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Shaving and style\n1.1 Lessen the volume\n1.2 Totally shave\n1.3 Re-shape\n2. Protective clothing\n2.1 Mask\n2.2 Smock Gown\n2.3 Apron\n3. Established or\nacceptable procedures\nin shaving\nMay include but are not limited to:\n3.1 Apply shaving strokes with razor at the appropriate\nangle and to a predetermined pattern with the skin\nstretched taut\n3.2 Shave face area to a predetermined pattern and\nagainst the grain for a smooth shave\n3.3 Shave neck area to a predetermined pattern and in\nthe direction of hair growth to avoid tearing skin\n3. Over-comb techniques\n3.1 Scissor over-comb\n3.2 Clipper over-comb\n3.3 Clippers with comb-guards\n\n--- PDF PAGE 45 ---\nTR – Barbering NC II\nPromulgated November 2010 41\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Consulted and prepared client according to job\nrequirements\n1.2 Prepared and used appropriate tools, equipments and\nimplements according to OH&S requirements\n1.1 Prepared and used protective clothing according to health\n and sanitation regulations\n1.2\nPerformed shaving according to client’s desired outcome\nand established or acceptable procedures\n1.3 Designed beard or moustache according to client’s\n desired outcome and set procedures\n1.4 Performed cross checking and applied appropriate\n finishing touches\n1.5 Followed safety precautions to clients during the entire\n process\n1.8 Applied appropriate measures in response to\nemergencies or unavoidable circumstances\n1.9 Performed post-service activities in accordance with salon\npolicies and procedures, and OH&S requirements\n2. Underpinning\nknowledge\n2.1 Shaving procedures/techniques\n2.2 Different beard and moustache designs/ styles\n2.3 Pre-service consultation\n2.4 Identify different types equipments and tools\n2.5 First-aid treatment\n2.6 DOH-IRR and OH&S rules and regulations\n2.7 Principle of sanitation procedures\n2.8 Code of ethics\n3. Underpinning\nskills\n3.1 Client consultation\n3.2 Beard design skills\n3.3 Over-comb techniques\n3.4 Shaving techniques/Outline shaving\n3.5 Using appropriate tools, equipment and implements\n3.6 Applying first-aid treatment\n3.7 Compliance to DOH-IRR and OH&S rules and regulations\n3.8 Performing different beard designs and moustache styles\n3.9 Demonstrating sanitation\n3.10 Observing code of ethics\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Model\n4.2 Supplies, materials, tools and implements relevant to the\n activity to be performed\n4.3 Working area / facilities\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1 Demonstration with Oral Questioning\n5.2 Third-Party Report\n5.3 Portfolio\n6. Context of\nassessment\nCompetency may be assessed in the workplace or TESDA\naccredited assessment centers\n\n--- PDF PAGE 46 ---\nTR – Barbering NC II\nPromulgated November 2010 42\nUNIT OF COMPETENCY :\nPERFORM CHAIR SPOT MASSAGE\nUNIT CODE\n:"
