text of\nassessment\nCompetency may be assessed in the workplace or TESDA\naccredited assessment centers\n\n--- PDF PAGE 46 ---\nTR – Barbering NC II\nPromulgated November 2010 42\nUNIT OF COMPETENCY :\nPERFORM CHAIR SPOT MASSAGE\nUNIT CODE\n:"
