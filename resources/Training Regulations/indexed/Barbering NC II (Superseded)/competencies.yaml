        "source_text": "HCS515205\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes needed to\nmaintain client relations. The unit incorporates the work safety\nguidelines. It encompasses competencies necessary to maintain a\nsafe workplace for staff, clients and others. It also involves the\napplication of health regulations, including personal hygiene\npracticed by staff members, provision of a caring client environment\nand the efficient operation of the salon.\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Comply with health\nregulations\n\n1.1 Salon policies and procedures for personal hygiene\napplied\n1.2 Procedures and practices implemented in a variety of\nsalon situations in accordance with national and local\ngovernment health regulations\n2. Assess own work\n2.1 Reception, work areas and walkways maintained in a\nsafe, uncluttered and organized manner according to\nsalon policy\n2.2 All routines carried out safely, effectively with minimum\ninconvenience to clients and staff\n2.3 Waste is stored and disposed of according to OH & S\nrequirements\n2.4 Spills, food, waste, hair or other potential hazards\npromptly removed from floors according to salon policy.\n2.5 Linen is stored, cleaned and disinfected in line with\nOHS requirements and salon procedures\n3. Check and maintain\ntools and equipment\n3.1 Tools and equipment are stored safely and in position\nto comply with salon requirements and local health\nregulations\n3.2 Tools and equipment are prepared for specific services\nas required\n3.3 Tools and equipment are checked for maintenance\nrequirements\n3.4\nTools and equipment are referred for repair as required\n4. Check and maintain\nstocks\n\n4.1 Stock rotation procedures are carried out routinely and\naccurately according to salon procedures\n4.2 Stock levels are accurately recorded according to salon\nprocedures\n4.3 Under or over supplied stock items are notified\nimmediately to the salon supervisor\n4.4 Incorrectly ordered or delivered stock is referred to the\nsalon supervisor for return to supplier\n4.5 Safe lifting and carrying techniques maintained in line\nwith salon occupational health and safety policy and\ngovernment legislation\n5. Provide a relaxed and\ncaring environment\n5.1 Clients are made to feel comfortable according to salon\npolicy\n5.2 Clients’ needs are attended to promptly\n5.3\nClients are consulted on specific desired service\n\n--- PDF PAGE 28 ---\nTR – Barbering NC II\nPromulgated November 2010 24\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Relevant Salon Policies\nand Procedures\n\nMay include but not limited to:\n1.1\nHazard Policies and Procedures\n1.2\nEmergency, Fire and Accident Procedures\n1.3\nPersonal Safety Procedures\n1.4\nProcedures for the use of Personal protective\nClothing and Equipment\n1.5\nHazard Identification\n1.6\nJob Procedures\n2. Occupational Health and\nSafety Procedures\nMay include but not limited to:\n2.1\nClient\n2.2\nStaff\n2.3\nEquipment/Tools\n2.4\nPremises\n2.5\nStock\n3. Potential Hazards\nMay include but are not limited to:\n3.1\nDamaged Packaging Material or Containers\n3.2\nBroken or Damaged Equipment\n3.3\nInflammable Materials and Fire Hazards\n3.4\nLifting Practices\n3.5\nSpillages\n3.6\nWaste including hair especially on floors\n3.7\nTrolleys\n\n--- PDF PAGE 29 ---\nTR – Barbering NC II\nPromulgated November 2010 25\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nGenerated information on different client requirements\nand needs\n1.2\nSelected and used strategies to accurately analyzed the\nclient requirements\n1.3\nAssessed current product and services as against client\ndemand\n1.4\nIdentified avenues to establish relevant linkage\n1.5\nSelected promotional activities relevant to enhance\ncompetitiveness of salon\n1.6\nAssisted clients on specific desired services\n1.7\nChecked and prepared tools for the specific salon\nactivities\n2. Underpinning\nknowledge and\nattitudes\n2.1\nMedia Options\n2.2\nData Gathering\n2.3\nSalon Policies\n2.4\nInternational Market\n2.5\nSkills Competition Rules and Procedures\n2.6\nNew Trends in Products and Services\n2.7\nEthical Limitations\n3. Underpinning skills\n3.1\nCommunication skills to identify lines of communication,\nrequest advice, follow instructions and receive feedback.\n3.2\nTechnology Skills\n3.3\nInterpersonal Skills\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nClient\n4.3\nRelevant Information\n4.4\nAppropriate Products\n5. Method of\nassessment\nCompetency MUST be assessed through:\n5.1\nObservation with questioning\n5.2\nDemonstration with questioning\n6. Context of\nassessment\n6.1 Assessment may be conducted in the workplace or in a\n simulated environment.\n\n--- PDF PAGE 30 ---\nTR – Barbering NC II\nPromulgated November 2010 26\nCORE COMPETENCIES\n\nUNIT OF COMPETENCY :\nPERFORM PRE- AND POST- HAIR CARE ACTIVITIES\nUNIT CODE\n:"
