  "source_section_text": "SECTION 2 COMPETENCY STANDARDS\n\nThis section gives the details of the contents of the basic, common and core units\nof competency required in BARBERING NC II.\n\nBASIC COMPETENCIES\n\nUNIT OF COMPETENCY : PARTICIPATE IN WORKPLACE COMMUNICATION\nUNIT CODE\n: 500311105\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes\nrequired to gather, interpret and convey information in\nresponse to workplace requirements.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Obtain and convey\nworkplace\ninformation\n1.1\nSpecific and relevant information is accessed from\nappropriate sources\n1.2\nEffective questioning , active listening and speaking\nskills are used to gather and convey information\n1.3\nAppropriate medium is used to transfer information and\nideas\n1.4\nAppropriate non- verbal communication is used\n1.5\nAppropriate lines of communication with supervisors and\ncolleagues are identified and followed\n1.6\nDefined workplace procedures for the location and\nstorage of information are used\n1.7\nPersonal interaction is carried out clearly and concisely\n2. Participate in\nworkplace meetings\nand discussions\n2.1\nTeam meetings are attended on time\n2.2\nOwn opinions are clearly expressed and those of others\nare listened to without interruption\n2.3\nMeeting inputs are consistent with the meeting purpose\nand established protocols\n2.4\nWorkplace interactions are conducted in a courteous\nmanner\n2.5\nQuestions about simple routine workplace procedures\nand maters concerning working conditions of\nemployment are asked and responded to\n2.6\nMeetings outcomes are interpreted and implemented\n3. Complete relevant\nwork related\ndocuments\n3.1\nRange of forms relating to conditions of employment are\ncompleted accurately and legibly\n3.2\nWorkplace data is recorded on standard workplace\nforms and documents\n3.3\nBasic mathematical processes are used for routine\ncalculations\n3.4\nErrors in recording information on forms/ documents are\nidentified and properly acted upon\n3.5\nReporting requirements to supervisor are completed\naccording to organizational guidelines\n\n--- PDF PAGE 7 ---\nTR – Barbering NC II\nPromulgated November 2010 3\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Appropriate sources\n1.1\nTeam members\n1.2\nSuppliers\n1.3\nTrade personnel\n1.4\nLocal government\n1.5\nIndustry bodies\n2. Medium\n2.1\nMemorandum\n2.2\nCircular\n2.3\nNotice\n2.4\nInformation discussion\n2.5\nFollow-up or verbal instructions\n2.6\nFace to face communication\n3. Storage\n3.1\nManual filing system\n3.2\nComputer-based filing system\n4. Forms\n4.1\nPersonnel forms, telephone message forms, safety\nreports\n5. Workplace interactions\n5.1\nFace to face\n5.2\nTelephone\n5.3\nElectronic and two way radio\n5.4\nWritten including electronic, memos, instruction and\nforms, non-verbal including gestures, signals, signs\nand diagrams\n6. Protocols\n6.1\nObserving meeting\n6.2\nCompliance with meeting decisions\n6.3\nObeying meeting instructions\n\n--- PDF PAGE 8 ---\nTR – Barbering NC II\nPromulgated November 2010 4\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nPrepared written communication following standard\nformat of the organization\n1.2\nAccessed information using communication\nequipment\n1.3\nMade use of relevant terms as an aid to transfer\ninformation effectively\n1.4\nConveyed information effectively adopting the formal\nor informal communication\n2. Underpinning\nknowledge and\nattitudes\n\n2.1\nEffective communication\n2.2\nDifferent modes of communication\n2.3\nWritten communication\n2.4\nOrganizational policies\n2.5\nCommunication procedures and systems\n2.6\nTechnology relevant to the enterprise and the\nindividual’s work responsibilities\n3. Underpinning skills\n3.1\nFollow simple spoken language\n3.2\nPerform routine workplace duties following simple\nwritten notices\n3.3\nParticipate in workplace meetings and discussions\n3.4\nComplete work related documents\n3.5\nEstimate, calculate and record routine workplace\nmeasures\n3.6\nBasic mathematical processes of addition,\nsubtraction, division and multiplication\n3.7\nAbility to relate to people of social range in the\nworkplace\n3.8\nGather and provide information in response to\nworkplace Requirements\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nFax machine\n4.2\nTelephone\n4.3\nWriting materials\n4.4\nInternet\n5. Method of\nassessment\nCompetency MUST be assessed through:\n5.1\nDirect Observation\n5.2\nOral interview and written test\n6. Context of\nassessment\n6.1\nCompetency may be assessed individually in the\nactual workplace or through accredited institution\n\n--- PDF PAGE 9 ---\nTR – Barbering NC II\nPromulgated November 2010 5\nUNIT OF COMPETENCY :\nWORK IN TEAM ENVIRONMENT\nUNIT CODE\n: 500311106\nUNIT DESCRIPTOR\n:\nThis unit covers the skills, knowledge and attitudes to\nidentify role and responsibility as a member of a team.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Describe team role\nand scope\n1.1\nThe role and objective of the team is identified from\navailable sources of information\n1.2\nTeam parameters, reporting relationships and\nresponsibilities are identified from team discussions\nand appropriate external sources\n2. Identify own role and\nresponsibility within\nteam\n2.1\nIndividual role and responsibilities within the team\nenvironment are identified\n2.2\nRoles and responsibility of other team members are\nidentified and recognized\n2.3\nReporting relationships within team and external to\nteam are identified\n3. Work as a team\nmember\n3.1\nEffective and appropriate forms of communications\nused and interactions undertaken with team members\nwho contribute to known team activities and\nobjectives\n3.2\nEffective and appropriate contributions made to\ncomplement team activities and objectives, based on\nindividual skills and competencies and workplace\ncontext\n3.3\nObserved protocols in reporting using standard\noperating procedures\n3.4\nContribute to the development of team work plans\nbased on an understanding of team’s role and\nobjectives and individual competencies of the\nmembers\n\n--- PDF PAGE 10 ---\nTR – Barbering NC II\nPromulgated November 2010 6\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Role and objective of\nteam\n1.1\nWork activities in a team environment with\nenterprise or specific sector\n1.2\nLimited discretion, initiative and judgement maybe\ndemonstrated on the job, either individually or in a\nteam environment\n2. Sources of information\n2.1\nStandard operating and/or other workplace\nprocedures\n2.2\nJob procedures\n2.3\nMachine/equipment manufacturer’s specifications\nand instructions\n2.4\nOrganizational or external personnel\n2.5\nClient/supplier instructions\n2.6\nQuality standards\n2.7\nOHS and environmental standards\n3. Workplace context\n3.1\nWork procedures and practices\n3.2\nConditions of work environments\n3.3\nLegislation and industrial agreements\n3.4\nStandard work practice including the storage, safe\nhandling and disposal of chemicals\n3.5\nSafety, environmental, housekeeping and quality\nguidelines\n\n--- PDF PAGE 11 ---\nTR – Barbering NC II\nPromulgated November 2010 7\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nOperated in a team to complete workplace activity\n1.2\nWorked effectively with others\n1.3\nConveyed information in written or oral form\n1.4\nSelected and used appropriate workplace language\n1.5\nFollowed designated work plan for the job\n1.6\nReported outcomes\n2. Underpinning\nknowledge and\nattitudes\n2.1\nCommunication process\n2.2\nTeam structure\n2.3\nTeam roles\n2.4\nGroup planning and decision making\n3. Underpinning\nskills\n3.1\nCommunicate appropriately, consistent with the culture\nof the workplace\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nAccess to relevant workplace or appropriately simulated\nenvironment where assessment can take place\n4.2\nMaterials relevant to the proposed activity or tasks\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1\nObservation of the individual member in relation to the\nwork activities of the group\n5.2\nObservation of simulation and or role play involving the\nparticipation of individual member to the attainment of\norganizational goal\n5.3\nCase studies and scenarios as a basis for discussion of\nissues and strategies in teamwork\n6. Context of\nassessment\n6.1\nCompetency may be assessed in workplace or in a\nsimulated workplace setting\n6.2\nAssessment shall be observed while task are being\nundertaken whether individually or in group\n\n--- PDF PAGE 12 ---\nTR – Barbering NC II\nPromulgated November 2010 8\nUNIT OF COMPETENCY :\nPRACTICE CAREER PROFESSIONALISM\n\nUNIT CODE\n:\n500311107\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes in\npromoting career growth and advancement.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Integrate personal\nobjectives with\norganizational goals\n1.1\nPersonal growth and work plans are pursued towards\nimproving the qualifications set for the profession\n1.2\nIntra- and interpersonal relationships are maintained\nin the course of managing oneself based on\nperformance evaluation\n1.3\nCommitment to the organization and its goal is\ndemonstrated in the performance of duties\n2. Set and meet work\npriorities\n2.1\nCompeting demands are prioritized to achieve\npersonal, team and organizational goals and\nobjectives\n2.2\nResources are utilized efficiently and effectively to\nmanage work priorities and commitments\n2.3\nPractices along economic use and maintenance of\nequipment and facilities are followed as per\nestablished procedures\n3. Maintain professional\ngrowth and\ndevelopment\n3.1\nTrainings and career opportunities are identified\nand availed of based on job requirements\n3.2\nRecognitions are sought/received and\ndemonstrated as proof of career advancement\n3.3\nLicenses and/or certifications relevant to job and\ncareer are obtained and renewed\n\n--- PDF PAGE 13 ---\nTR – Barbering NC II\nPromulgated November 2010 9\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Evaluation\n1.1\nPerformance Appraisal\n1.2\nPsychological Profile\n1.3\nAptitude Tests\n2. Resources\n2.1\nHuman\n2.2\nFinancial\n2.3\nTechnology\n2.3.1 Hardware\n2.3.2 Software\n3. Trainings and career\nopportunities\n3.1\nParticipation in training programs\n3.1.1 Technical\n3.1.2 Supervisory\n3.1.3 Managerial\n3.1.4 Continuing Education\n3.2\nServing as Resource Persons in conferences and\nworkshops\n4. Recognitions\n4.1\nRecommendations\n4.2\nCitations\n4.3\nCertificate of Appreciations\n4.4\nCommendations\n4.5\nAwards\n4.6\nTangible and Intangible Rewards\n5. Licenses and/or\ncertifications\n5.1\nNational Certificates\n5.2\nCertificate of Competency\n5.3\nSupport Level Licenses\n5.4\nProfessional Licenses\n\n--- PDF PAGE 14 ---\nTR – Barbering NC II\nPromulgated November 2010 10\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nAttained job targets within key result areas (KRAs)\n1.2\nMaintained intra - and interpersonal relationship in the\ncourse of managing oneself based on performance\nevaluation\n1.3\nCompleted trainings and career opportunities which are\nbased on the requirements of the industries\n1.4\nAcquired and maintained licenses and/or certifications\naccording to the requirement of the qualification\n2. Underpinning\nknowledge and\nattitudes\n2.1\nWork values and ethics (Code of Conduct, Code of\nEthics, etc.)\n2.2\nCompany policies\n2.3\nCompany operations, procedures and standards\n2.4\nFundamental rights at work including gender sensitivity\n2.5\nPersonal hygiene practices\n3. Underpinning\nskills\n3.1\nAppropriate practice of personal hygiene\n3.2\nIntra and Interpersonal skills\n3.3\nCommunication skills\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nWorkplace or assessment location\n4.2\nCase studies/scenarios\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1\nPortfolio Assessment\n5.2\nInterview\n5.3\nSimulation/Role-plays\n5.4\nObservation\n5.5\nThird Party Reports\n5.6\nExams and Tests\n6. Context of\nassessment\n6.1\nCompetency may be assessed in the work place or in a\nsimulated work place setting.\n\n--- PDF PAGE 15 ---\nTR – Barbering NC II\nPromulgated November 2010 11\nUNIT OF COMPETENCY :\nPRACTICE OCCUPATIONAL HEALTH AND SAFETY\nPROCEDURES\n\nUNIT CODE\n:\n500311108\n\nUNIT DESCRIPTOR\n:\nThis unit covers the outcomes required to comply with\nregulatory\nand\norganizational\nrequirements\nfor\noccupational health and safety.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Identify hazards and\nrisks\n1.1\nSafety regulations and workplace safety and\nhazard control practices and procedures are\nclarified and explained based on organization\nprocedures\n1.2\nHazards/risks in the workplace and their\ncorresponding indicators are identified to minimize\nor eliminate risk to co-workers, workplace and\nenvironment in accordance with organization\nprocedures\n1.3\nContingency measures during workplace\naccidents, fire and other emergencies are\nrecognized and established in accordance with\norganization procedures\n2. Evaluate hazards and\nrisks\n2.1\nTerms of maximum tolerable limits which when\nexceeded will result in harm or damage are\nidentified based on threshold limit values (TLV)\n2.2\nEffects of the hazards are determined\n2.3\n OHS issues and/or concerns and identified safety\nhazards are reported to designated personnel in\naccordance with workplace requirements and\nrelevant workplace OHS legislation\n3. Control hazards and\nrisks\n3.1\nOccupational Health and Safety (OHS)\nprocedures for controlling hazards/risks in\nworkplace are consistently followed\n3.2\nProcedures for dealing with workplace accidents,\nfire and emergencies are followed in accordance\nwith organization OHS policies\n3.3\nPersonal protective equipment (PPE) is\ncorrectly used in accordance with organization\nOHS procedures and practices\n3.4\nAppropriate assistance is provided in the event of\na workplace emergency in accordance with\nestablished organization protocol\n4. Maintain OHS\nawareness\n4.1\nEmergency-related drills and trainings are\nparticipated in as per established organization\nguidelines and procedures\n4.2\nOHS personal records are completed and\nupdated in accordance with workplace\nrequirements\n\n--- PDF PAGE 16 ---\nTR – Barbering NC II\nPromulgated November 2010 12\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Safety regulations\nMay include but are not limited to:\n1.1\nClean Air Act\n1.2\nBuilding code\n1.3\nNational Electrical and Fire Safety Codes\n1.4\nWaste management statutes and rules\n1.5\nPhilippine Occupational Safety and Health Standards\n1.6\nDOLE regulations on safety legal requirements\n1.7\nECC regulations\n2. Hazards/Risks\nMay include but are not limited to:\n2.1\nPhysical hazards – impact, illumination, pressure, noise,\nvibration, temperature, radiation\n2.2\nBiological hazards- bacteria, viruses, plants, parasites,\nmites, molds, fungi, insects\n2.3\nChemical hazards – dusts, fibers, mists, fumes, smoke,\ngasses, vapors\n2.4\nErgonomics\n•\nPsychological factors – over exertion/ excessive\nforce, awkward/static positions, fatigue, direct\npressure, varying metabolic cycles\n•\nPhysiological factors – monotony, personal\nrelationship, work out cycle\n3. Contingency measures\nMay include but are not limited to:\n3.1\nEvacuation\n3.2\nIsolation\n3.3\nDecontamination\n3.4\nCalling designated emergency personnel\n4. PPE\nMay include but are not limited to:\n4.1\nMask\n4.2\nGloves\n4.3\nGoggles\n4.4\nHair Net/cap/bonnet\n4.5\nFace mask/shield\n4.6\nEar muffs\n4.7\nApron/Gown/coverall/jump suit\n4.8\nAnti-static suits\n5. Emergency-related\ndrills and training\n5.1\nFire drill\n5.2\nEarthquake drill\n5.3\nBasic life support/CPR\n5.4\nFirst aid\n5.5\nSpillage control\n5.6\nDecontamination of chemical and toxic\n5.7\nDisaster preparedness/management\n6. OHS personal records\n6.1\nMedical/Health records\n6.2\nIncident reports\n6.3\nAccident reports\n6.4\nOHS-related training completed\n\n--- PDF PAGE 17 ---\nTR – Barbering NC II\nPromulgated November 2010 13\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nExplained clearly established workplace safety and\nhazard control practices and procedures\n1.2\nIdentified hazards/risks in the workplace and its\ncorresponding indicators in accordance with company\nprocedures\n1.3\nRecognized contingency measures during workplace\naccidents, fire and other emergencies\n1.4\nIdentified terms of maximum tolerable limits based on\nthreshold limit value- TLV.\n1.5\nFollowed Occupational Health and Safety (OHS)\nprocedures for controlling hazards/risks in workplace\n1.6\nUsed Personal Protective Equipment (PPE) in\naccordance with company OHS procedures and\npractices\n1.7\nCompleted and updated OHS personal records in\naccordance with workplace requirements\n2. Underpinning\nknowledge and\n attitudes\n2.1\nOHS procedures and practices and regulations\n2.2\nPPE types and uses\n2.3\nPersonal hygiene practices\n2.4\nHazards/risks identification and control\n2.5\nThreshold Limit Value -TLV\n2.6\nOHS indicators\n2.7\nOrganization safety and health protocol\n2.8\nSafety consciousness\n2.9\nHealth consciousness\n3. Underpinning\n skills\n3.1\n Practice of personal hygiene\n3.2\nHazards/risks identification and control skills\n3.3\nInterpersonal skills\n3.4\nCommunication skills\n2. Resource\nimplications\nThe following resources MUST be provided:\n4.1\n Workplace or assessment location\n4.2\nOHS personal records\n4.3\nPPE\n4.4\nHealth records\n3. Method of\nassessment\nCompetency may be assessed through:\n5.1\nPortfolio Assessment\n5.2\nInterview\n5.3\nCase Study/Situation\n4. Context of\nassessment\n6.1\nCompetency may be assessed in the work place or in a\nsimulated work place setting\n\n--- PDF PAGE 18 ---\nTR – Barbering NC II\nPromulgated November 2010 14\nCOMMON COMPETENCIES\n\nUNIT OF COMPETENCY :\nMAINTAIN EFFECTIVE RELATIONSHIP WITH\nCLIENTS/CUSTOMERS\nUNIT CODE\n:\nHCS516201\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes\nrequired in building and maintaining an effective\nrelationship with clients, customers and the public.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Maintain professional\nimage\n\n1.1\nUniform and personal grooming maintained to\nassignment requirements\n1.2\nPersonal presence maintained according to\nemployer standards\n1.3\nVisible work area kept tidy and uncluttered in\naccordance with company procedures\n1.4\nEquipment stored according to assignment\nrequirements\n2. Meet client/customer\nrequirements\n2.1\nClient requirements identified and understood by\nreferral to the assignment instructions\n2.2\nClient requirements met according to the\nassignment instructions\n2.3\nChanges to client’s needs and requirements\nmonitored and appropriate action taken\n2.4\nAll communication with the client or customer is\nclear and complies with assignment requirements.\n2.5\nClients are made comfortable and relaxed before,\nduring and after service\n3. Build credibility with\ncustomers/clients\n3.1\nClient expectations for reliability, punctuality and\nappearance adhered to\n3.2\nPossible causes of client/customer dissatisfaction\nidentified, dealt with and recorded according to\nemployer policy\n3.3\nClient fully informed of all relevant security matters\nin a timely manner and according to agreed\nreporting procedures\n\n--- PDF PAGE 19 ---\nTR – Barbering NC II\nPromulgated November 2010 15\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Personal Presence\nMay include:\n1.1\nStance\n1.2\nPosture\n1.3\nBody Language\n1.4\nDemeanour\n1.5 Grooming\n2. Employer Standards\nMay include:\n2.1\nStanding Orders\n2.2\nCompany Policies and Procedures\n3. Client Requirements\nMay include:\n3.1\nAssignment Instructions\n3.2\nPost Orders\n3.3\nScope to modify instructions/orders in light of\nchanged situations\n4. Assignment Instructions\nMay be conveyed:\n4.1\nIn Writing\n4.2\nVerbally\n4.3\nElectronically\n5. Client’s Needs and\nRequirements\nMay be determined by:\n5.1\nReview of the client brief and/or assignment\ninstructions\n5.2\nDiscussion with the client/customer\n6. Appropriate Action\nMay include:\n6.1\nImplementing required changes\n6.2\nReferral to appropriate employer personnel\n6.3\nClarification of client needs and instructions\n7. Customers\nMay include:\n7.1\nAll members of the public\n\n--- PDF PAGE 20 ---\nTR – Barbering NC II\nPromulgated November 2010 16\nEVIDENCE GUIDE\n\n1. Critical aspects\nof competency\nAssessment requires evidence that the candidate:\n1.1\nMaintained professional image\n1.2\nInterpreted client/customer requirements from information\ncontained in the client brief and/or assignment instructions\n1.3\nDealt successfully with a variety of client/customer interactions\n1.4\nMonitored and acted on changing client or customer needs\n1.5\nMet client/customer requirements\n1.6\nBuilt credibility with customers/clients\n2. Underpinning\nknowledge and\nattitudes\n2.1\nUniform and personal grooming requirements of the employer\nand the client\n2.2\nOccupational Health and safety requirement for the\nassignment\n2.3\nAssignment Instructions\n3. Underpinning\nskills\n3.1\nAttention to detail when completing client/employer\ndocumentation\n3.2\nInterpersonal and communication skills required in client\ncontact assignments\n3.3\nCustomer service skills required to meet c