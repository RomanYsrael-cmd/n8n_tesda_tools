  "source_text": "SECTION 4 NATIONAL ASSESSMENT AND CERTIFICATION\nARRANGEMENTS\n\n4.1 To attain the National Qualification of BARBERING NC II, the candidate\nmust demonstrate competence in all the units of competency listed in\nSection 1. Successful candidates shall be awarded a National Certificate\nsigned by the TESDA Director General.\n\n4.2 The Qualification of BARBERING NC II may be attained through\ndemonstration of competence in a project-type assessment covering the\nfollowing core units of the Qualification:\n\n4.2.1 Perform pre- and post- hair care activities\n4.2.2 Perform hair and scalp treatment\n4.2.3 Perform basic hair coloring\n4.2.4 Perform haircut\n4.2.5 Shave and style beard and mustache\n4.2.6 Perform chair spot massage\n\n4.3 Certificate of Competency (COC) can be issued in the following cluster or\ngroup of core units of the qualification.\n\n 4.3.1 Performing hair coloring services\n 4.3.1.1 Perform pre and post- hair care activities\n\n4.3.1.2 Perform basic hair coloring\n\n4.4 Assessment shall focus on the core units of competency. The basic and\ncommon units shall be integrated or assessed concurrently with the core\nunits.\n\n4.5 The following are qualified to apply for assessment and certification:\n\n4.5.1 Graduates of formal and non-formal including enterprise-based\ntraining programs.\n4.5.2 Experienced workers (wage-employed or self-employed)\n\n4.6 The guidelines on assessment and certification are discussed in detail in the\n“Procedures Manual on Assessment and Certification” and “Guidelines on\nthe Implementation of the Philippine TVET Qualification and Certification\nSystem (PTQCS)”.\n\n--- PDF PAGE 67 ---\nTR – Barbering NC II\nPromulgated November 2010 63\n\n--- PDF PAGE 68 ---\nTR – Barbering NC II\nPromulgated November 2010 64\n\n"
}
