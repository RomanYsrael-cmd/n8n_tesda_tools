      "term": "For the purpose of this Competency Standard, the words",
      "definition": "1. Discharge Refers to the act of discharging ready mixed concrete and disposing drum sediments. 2. Admixture It is a chemical or substance added to concrete mix to maintain its desired quality. 3. Transit mixer It refers to equipment used to transport ready mixed concrete from batching plant to the job site. 4. Quality controller Refers to a person responsible to receive and check the quality of mixed concrete. 5. Mixing It is a process to maintain the quality of ready mixed concrete. 6. Truck scale receipt It is a document that certifies the total volume of ready mixed concrete loaded on Transit Mixer. 7. Batching plant It is the central plant where the raw materials in the preparation of concrete are blended."
