se studies on Preservation,\noptimization and judicious use of\nworkplace resources\n• Case Study\n• Lecture/Discussion\n• Case Study\n• Written Test\n• Interview\n2 Hours\n\n--- PDF PAGE 107 ---\nTR-Automotive Servicing (Engine Repair) NC II Revision 01 Promulgated (08/11/2020) 103\nCOMMON COMPETENCIES\n162 Hours\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n1. Validate vehicle\nspecification\n1.1 Check body\ntype of the\nvehicle\n1.1.1 Enumerate the different kinds\nof vehicle\n1.1.2 Explain the difference of each\nkind of vehicle\n1.1.3 Identify the measuring points of\nthe vehicle\n1.1.4 Explain the procedures in\nmeasuring vehicle dimension\nand weight\n1.1.5 Describe the different body\nshapes of the vehicle\n1.1.6 Differentiate kinds of power\ntrain\n1.1.7 Explain the function of each\npower train\n1.1.8 Discuss occupational safety\nand health standard in\nchecking the body type of a\nvehicle\n1.1.9 Identify different kinds of\nvehicle\n1.1.10 Measure vehicle dimensions\nand weight\n1.1.11 Identify vehicle body shapes\n1.1.12 Identify vehicle power train\n1.1.13 Apply safety practices\n• Lecture\n• Demonstration\n• Video presentation\n• Written exam\n• Demonstrate\n7 Hours\n\n1.2 Check vehicle\nengine type\n1.2.1 Discuss the different kinds of\nengine\n1.2.2 Enumerate the different kinds\nof fuel/energy system\n• Lecture\n• Demonstration\n• Video presentation\n• Written exam\n• Demonstrate\n3 Hours\n\n--- PDF PAGE 108 ---\nTR-Automotive Servicing (Engine Repair) NC II Revision 01 Promulgated (08/11/2020) 104\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n1.2.3 Describe the different engine\ncomponents\n1.2.4 Identify different kinds of\nengine\n1.2.5 Identify different types of\nfuel/energy system\n1.2.6 Identify different engine\ncomponents\n\n1.3 Check vehicle\nspecifications\n1.3.1 Inspect VIN plate of the vehicle\n