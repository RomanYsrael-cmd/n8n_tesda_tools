Discussion\n• PowerPoint\npresentation\n• Demonstration\n• Visual aids\n• E-learning\n• Written exam\n• Demonstration\n• Oral questioning\n• Direct\nobservation\n3 hours\n\n--- PDF PAGE 125 ---\nTR-Automotive Servicing (Engine Repair) NC II Revision 01 Promulgated (08/11/2020) 121\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n3. Diagnose and\noverhaul engine\nmechanical\nsystem\n3.1 Prepare to\ndiagnose\nengine\nmechanical\nsystem\n3.1.1 Discuss and explain the\nfollowing:\n• Sourcing out and\ninterpretation of diagnostic\ninformation\n• Basic engine removal and\ninstallation sequence\n• Service/ Repair manual\n• Troubleshooting guide\n• Tools, equipment and\nmaterials in diagnose and\nrepair engine mechanical\nsystem\n• Interpretation of job\nrequirements\n• Different job requirements\n• Serviceability of tools and\nequipment\n• OSHS\n• Wearing of PPEs\n• 3Rs\n• 5S\n• Attitude:\n- Patience\n- Attention to details\n- Time conscious\n- Honest\n3.1.2 Prepare to diagnose engine\nmechanical system\n• Lecture/Discussion\n• Powerpoint\npresentation\n• Demonstration\n• Visual aids\n• E-learning\n• Written exam\n• Demonstration\n• Oral questioning\n• Direct\nobservation\n10 hours\n\n--- PDF PAGE 126 ---\nTR-Automotive Servicing (Engine Repair) NC II Revision 01 Promulgated (08/11/2020) 122\n\n3.2 Diagnose\nengine\nmechanical\nsystem\n3.2.1 Discuss and explain the\nfollowing:\n• Four stroke cycles\n• Industry criteria\n• Faults of engine mechanical\nsystem\n• Procedure in accomplishing\nforms\n• Arithmetic operation\n• Mensuration and\ncomputation\n• Inspection procedure\n• Selection of parts\n- Crankshaft bearing\nselection\n- Gasket selection\n- Shim selection\n- Piston and piston ring\nselection\n• Power balance test\n• Compression test\n• Operating principles of\ngasoline and diesel engines\n• OSHS\n• Wearing of PPEs\n• 3Rs\n• 5S\n• Attitude:\n- Patient\n- Attention to details\n- Time conscious\n- Honest\n- Confidence\n• Lecture/Discussion\n• Powerpoint\npresentation\n• Demonstration\n• Visual aids\n• E-learning\n• Written exam\n• Demonstration\n• Oral questioning\n• Direct\nobservation\n10 hours\n\n--- PDF PAGE 127 ---\nTR-Automotive Servicing (Engine Repair) NC II Revision 01 Promulgated (08/11/2020) 123\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n3.2.2 Diagnose engine mechanical\nsystem\n\n3.3 Repair engine\nmechanical\nsystem\n3.3.1 Discuss and explain the\nfollowing:\n• Sourcing out and\ninterpretation of repair\ninformation\n• Repair options\n• Tools, equipment, and\nmaterials\n• Repair options\n• Post-repair testing\n• Basic engine principles\n• Arithmetic operation\n• Mensuration\n• Disassembly and assembly\nprocedures of engine\ncomponent\n• OSHS\n• Arithmetic operation\n• Valve clearance adjustment\n• Timing setting\n• Gap and oil clearances\n• Procedure in accomplishing\nchecklists\n• Attitude:\n- Patience\n- Attention to details\n- Time conscious\n- Honest\n3.3.2 Repair engine mechanical\nsystem\n• Lecture/Discussion\n• Powerpoint\npresentation\n• Demonstration\n• Visual aids\n• E-learning\n• Written exam\n• Demonstration\n• Oral questioning\n• Direct\nobservation\n24 hours\n\n--- PDF PAGE 128 ---\nTR-Automotive Servicing (Engine Repair) NC II Revision 01 Promulgated (08/11/2020) 124\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\n3.4 Complete work\nprocesses\n3.4.1 Discuss and explain the\nfollowing:\n• OSHS\n• Wearing of PPEs\n• 3Rs\n• 5S of good housekeeping\n• Waste management\n• Final inspection procedure\n• Vehicle turn-over procedure\n• Accomplishment of\nworkplace documents\n3.4.2 Complete work processes\n• Lecture/Discussion\n• Powerpoint\npresentation\n• Demonstration\n• Visual aids\n• E-learning\n• Written exam\n• Demonstration\n• Oral questioning\n• Direct\nobservation\n6 hours\n\n--- PDF PAGE 129