y training which\nincludes structured training program inclusive of hands-on activities,\nobservation in a workshop, and training certificates with number of hours)\n\n3.7\nINSTITUTIONAL Assessment\n\nInstitutional Assessment is gathering of evidences to determine the\nachievements of the requirements of the qualification to enable the trainer make\njudgement whether the trainee is competent or not competent.\n\n--- PDF PAGE 135 ---\nTR-Automotive Servicing (Engine Repair) NC II Revision 01 Promulgated (08/11/2020) 131"
