        "source_text": "ALT723212\n\nUNIT DESCRIPTOR\n:\nThis unit involves the skills and knowledge and\nattitudes required to move and position vehicle safely\nincluding systematic and efficient control of all\nvehicle functions.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Prepare vehicle for\noperation\n1.1 Vehicle multi point\ninspection is\nconducted\naccording to\nindustry practice.\n1.2 Cockpit Drill is\nperformed\naccording to\nindustry practice.\n1.3 Vehicle is start-up\nfollowing owner’s\nmanual.\n1.4 Parking brake is\nengaged according\nto industry practice.\n1.1 Revolutions per\nminute during idle\n1.2 Manual,\nautomatic and\nCVT\nTransmission\n1.3 Vehicle parts,\ncomponents and\nfunctions\n1.4 Inspection\nprocedures\n1.5 Owner’s manual\n1.6 Safety procedures\n1.1 Performing\nCockpit Drill\n1.2 Conducting\nVehicle Multi\npoint inspection\n1.3 Starting the\nengine\n1.4 Using owner’s\nmanual\n2. Position vehicle\n2.1 Workshop hazards\nare identified and\navoided as per\nstandard operating\nprocedures.\n2.2 Vehicle is moved\naccording to\nOccupational\nHealth and Safety\nStandards.\n2.3 Workshop rules and\nregulations are\nrecognized\naccording to\nstandard\nprocedures.\n2.1 Revolutions per\nminute in running\ncondition\n2.2 Kilometer per\nhour\n2.3 Estimation/ timing\n2.4 Manual,\nautomatic and\nCVT\nTransmission\n2.5 Diesel, Gasoline\nand EV engines\n2.6 Vehicle parts,\ncomponents and\nfunctions\n2.7 Defensive driving\n2.8 Owner’s Manual\n2.9 Safety procedures\n2.1 Skills in\npositioning\nvehicle\n2.2 Vehicle\npositioning\nestimation skill\n2.3 Identifying\nworkshop signs\nand markings\n3. Park and stop the\nvehicle\n3.1 Vehicle is\npositioned\naccording to\nparking rules and\nregulations.\n3.1 Vehicle parts,\ncomponents and\nfunctions\n3.2 Inspection\nprocedures\n31 Vehicle\npositioning\nestimation skills\n\n--- PDF PAGE 47 ---\nTR-Automotive Servicing (Engine Repair) NC II Revision 01 Promulgated (08/11/2020) 43\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n3.2 Parking brake is\nengaged according\nto industry practice.\n3.3 Electrical devices\nare turned off\nbased on\nmanufacturer’s\nspecification.\n3.4 Vehicle is shut-off\nfollowing owner’s\nmanual.\n3.3 Owner’s Manual\n3.4 Procedure in\nshutting-off\nvehicle\n3.5 Safety procedures\n3.6 Parking rules and\nregulations\n3.2 Identifying\nparking signs\nand markings\n\n--- PDF PAGE 48 ---\nTR-Automotive Servicing (Engine Repair) NC II Revision 01 Promulgated (08/11/2020) 44\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Multi point inspection\nMay include:\n1.1 Check for any obstruction\n1.2 Check external condition\n1.3 Check internal condition\n1.3.1 Manual transmission\n1.3.2 Automatic transmission\n1.4 Check vehicle drivability\n2. Cockpit Drill\nMay include:\n2.1 Car mirror adjustments\n2.2 Steering the car\n2.3 How to change gears\n2.4 Use of parking brake\n2.5 Doors, Seat, Steering, Seat belt and Mirrors\n2.6 Foot controls\n2.7 Hand controls\n2.8 Auxiliary controls (indicators)\n3. Workshop hazards\nMay include:\n3.1 Workshop tools and materials\n3.2 Workshop equipment\n3.3 Other vehicles\n3.4 Other people\n3.5 Oil spills\n3.6 Loose parts\n4. Parking rules and\nregulation\nMay include:\n4.1 Parallel parking\n4.2 Horizontal parking\n4.3 Park facing the wall\n5. Electrical devices\nMay include:\n5.1 Lights\n5.2 Air conditioning\n5.3 Wiper\n5.4 Radio\n\n--- PDF PAGE 49 ---\nTR-Automotive Servicing (Engine Repair) NC II Revision 01 Promulgated (08/11/2020) 45\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Prepared vehicle for operation\n1.2 Positioned the vehicle\n1.3 Parked and stopped the vehicle\n1.4 Used owner’s manual\n2. Resource\nimplication\nThe following resources MUST be provided:\n2.1 Workshop range/area\n2.2 Service working bay\n2.3 Appropriate vehicle for moving and positioning\n2.4 Owner’s manual\n3. Method of\nassessment\nCompetency MUST be assessed through:\n3.1 Demonstration with oral questioning\n3.2 Written exam\n3.3 Interview\n3.4 Direct observation\n4. Context of\nassessment\n4.1 Competency may be assessed individually in the actual\nworkplace or through accredited institution.\n\n--- PDF PAGE 50 ---\nTR-Automotive Servicing (Engine Repair) NC II Revision 01 Promulgated (08/11/2020) 46\n\nUNIT OF COMPETENCY\n:\nUTILIZE AUTOMOTIVE TOOLS\n\nUNIT CODE\n:"
