        "evidence_guide": {
          "source_text": "1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Prepared to diagnose and repair intake and exhaust\nsystem.\n1.1.1 Determined job requirements.\n1.1.2 Sourced and interpreted diagnostic information.\n1.1.3 Verified symptoms.\n1.1.4 Identified hazards associated with the work and\nmanaged risks.\n1.1.5 Selected and checked tools, equipment, and\nmaterials.\n1.1.6 Reported defective and damaged tools and\nequipment.\n1.1.7 Checked and reported availability of materials.\n\n1.2 Diagnosed intake and exhaust system.\n1.2.1 Performed diagnostic tests.\n1.2.2 Carried out inspection.\n1.2.3 Compared inspection results.\n1.2.4 Identified faults and its causes.\n1.2.5 Reported findings.\n1.2.6 Applied safety practices.\n\n1.3 Repaired intake and exhaust system.\n1.3.1 Sourced and interpreted repair information.\n1.3.2 Analyzed repair options.\n1.3.3 Selected and checked repair tools, equipment, and\nmaterials.\n1.3.4 Carried out repairs.\n1.3.5 Carried out post-repair testing.\n1.3.6 Applied safety practices.\n\n1.4 Completed work processes.\n1.4.1 Made final inspection.\n1.4.2 Turned-over vehicle.\n1.4.3 Restored work area.\n1.4.4 Managed wastes.\n1.4.5 Checked and stored tools and equipment.\n1.4.6 Processed workplace documents.\n2. Resource\nimplications\nThe following resources MUST be provided:\n2.1 Workplace: Real or simulated work area\n2.2 Tools, materials, and equipment relevant to perform\nrequired tasks\n2.3 Manufacturer’s repair manual\n2.4 PPEs\n2.5 Training vehicle\n2.6 CPE\n2.7 First aid kit\n\n--- PDF PAGE 86 ---\nTR-Automotive Servicing (Engine Repair) NC II Revision 01 Promulgated (08/11/2020) 82\n3. Method of\nassessment\nCompetency in this unit may be assessed through:\n3.1 Demonstration with Oral questioning\n3.2 Written exam\n3.3 Direct Observation\n4. Context for\nassessment\n4.1 Competency may be assessed individually in the actual\nworkplace or simulation environment in TESDA accredited\ninstitutions.\n\n--- PDF PAGE 87 ---\nTR-Automotive Servicing (Engine Repair) NC II Revision 01 Promulgated (08/11/2020) 83\n\nUNIT OF COMPETENCY\n:\nDIAGNOSE AND OVERHAUL ENGINE MECHANICAL\nSYSTEM\n\nUNIT CODE\n:"
