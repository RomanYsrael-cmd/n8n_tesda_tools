        "source_text": "ALT233101\n\nUNIT DESCRIPTOR\n:\nThis unit describes the performance outcomes required in\nengine faults diagnoses, overhaul, and engine component\nreplacement such as timing belt, timing chain, timing gear,\ncylinder head assembly and cylinder block assembly. It\ncovers the knowledge, skills and attitude required to\nprepare to diagnose engine mechanical system, diagnose\nand repair engine mechanical system and complete work\nprocesses.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Prepare to\ndiagnose engine\nmechanical\nsystem\n1.1 Job requirements\nare determined\nfrom workplace\ninstructions.\n1.2 Diagnostic\ninformation is\nsourced and\ninterpreted\naccording to\nworkplace\nprocedures.\n1.3 Symptoms are\nverified using\ntroubleshooting\nguide.\n1.4 Hazards associated\nwith the work are\nidentified and risks\nare managed.\n1.5 Tools, equipment,\nand materials are\nselected and\nchecked for\nserviceability.\n1.6 Non-serviceable\ntools and\nequipment are\nreported following\nworkplace\nprocedures.\n1.7 Availability of\nmaterials are\nchecked and\n1.1 Sourcing out and\ninterpretation of\ndiagnostic\ninformation\n1.2 Basic engine\nremoval and\ninstallation\nsequence\n1.3 Service/ Repair\nmanual\n1.4 Troubleshooting\nguide\n1.5 Tools, equipment\nand materials in\ndiagnose and\nrepair engine\nmechanical\nsystem\n1.6 Interpretation of\njob requirements\n1.7 Different job\nrequirements\n1.8 Serviceability of\ntools and\nequipment\n1.9 OSHS\n1.10 Wearing of PPEs\n1.11 Health protocols\nissued by\ngovernment on\nprevention of\nspread of and\nprotection from\n1.1 Interpreting job\nrequirements\nfrom workplace\ninstructions\n1.2 Clarifying\ninstructions\n1.3 Locating\nappropriate\nsources of\ninformation\n1.4 Sourcing and\ninterpreting\ndiagnostic\ninformation\n1.5 Analyzing\ndiagnostic\nsymptoms\n1.6 Using\ntroubleshooting\nguide\n1.7 Selecting and\nchecking