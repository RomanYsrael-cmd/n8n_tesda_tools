        "source_text": "ALT233100\n\nUNIT DESCRIPTOR\n:\nThis unit describes the performance outcomes required\nto diagnose and repair faults in the conventional intake\nand exhaust systems of vehicles such as intake and\nexhaust manifold, and throttle system, turbocharger and\nintercooler system. It covers the knowledge, skills and\nattitude required to prepare to diagnose and repair intake\nand exhaust system, diagnose and repair intake and\nexhaust system and complete work processes.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Prepare to\ndiagnose and\nrepair intake and\nexhaust system\n1.1 Job requirements\nare determined\nfrom workplace\ninstructions.\n1.2 Diagnostic\ninformation is\nsourced and\ninterpreted\naccording to\nworkplace\nprocedures.\n1.3 Symptoms are\nverified using\ntroubleshooting\nguide.\n1.4 Hazards associated\nwith the work are\nidentified and risks\nare managed.\n1.5 Tools, equipment,\nand materials are\nselected and\nchecked for\nserviceability.\n1.6 Defective and\ndamaged tools and\nequipment are\nreported following\nworkplace\nprocedures and\nOSH procedures.\n1.7 Availability of\nmaterials are\n1.1 Different job\nrequirements\n1.2 Diagnostic\ninformation\n1.3 Troubleshooting\nguide\n1.4 Industry criteria\n1.5 Tools, equipment,\nand materials in\ndiagnosing and\nrepairing intake\nand exhaust\nsystem\n1.6 Procedure in\naccomplishing\nforms\n1.7 OSHS\n1.8 Wearing of PPEs\n1.9 Health protocols\nissued by\ngovernment on\nprevention of\nspread of and\nprotection from\ninfectious disease\nin the workplace\n1.10 The 3Rs\n1.11 The 5S\n1.11 Attitude:\n1.11.1 Patient\n1.11.2 Attention\nto details\n1.1 Interpreting job\nrequirements\nfrom workplace\ninstructions\n1.2 Clarifying\ninstructions\n1.3 Sourcing and\ninterpreting\ndiagnostic\ninformation\n1.4 Analyzing\ndiagnostic\noptions\n1.5 Using\ntroubleshooting\nguide\n1.6 Identifying\nhazards\n1.7 Managing risks\n1.8 Selecting and\nchecking tools,\nequipment and\nmaterials\n1.9 Reporting\ndefective and\ndamaged tools\nand equipment\n1.10 Checking and\nreporting the\navailability of\nmaterials\n\n--- PDF PAGE 81 ---\nTR-Automotive Servicing (Engine Repair) NC II Revision 01 Promulgated (08/11/2020) 77\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\nchecked and\nreported following\nworkplace\nprocedures.\n1.11.3 Time\nconscious\n1.11.4 Honest\n2. Diagnose intake\nand exhaust\nsystem\n2.1 Diagnostic tests are\nperformed\naccording to\nindustry criteria.\n2.2 Inspection is\ncarried out\naccording to\nindustry criteria.\n2.3 Inspection results\nare compared with\nmanufacturer\nspecifications.\n2.4 Faults are identified\nfrom diagnostic test\nresults and causes\nof faults are\ndetermined.\n2.5 Findings are\nreported according\nto industry\ncriteria.\n2.6 Safety practices are\napplied following\nOccupational\nSafety and Health\nStandards (OSHS)\nprocedure.\n2.1 Basic diesel\nengine intake\nsystem\n2.2 Basic petrol\nengine intake\nsystem\n2.3 Industry criteria\n2.4 Faults of intake\nand exhaust\nsystem\n2.5 Procedure in\naccomplishing\nforms\n2.6 Mensuration\n2.7 Diagnostic testing\nprocedures for\nintake/ exhaust\nsystems,\nincluding: exhaust\nleak testing,\nvibration and\nnoise locating\nprocedure, and\nback pressure\ntesting\n2.8 Application,\npurpose and\noperation of\nintake and\nexhaust systems\nand components,\nincluding:\n2.8.1 Intake\nsystem, basic\nidle control\nsystem, basic\nfuel injection\nsystem, basic\nturbo charger\nand intercooler\nsystem\n2.8.2 Exhaust\nsystem,\nmufflers,\ncatalytic\n2.1 Locating\nappropriate\nsources of\ninformation\n2.2 Interpreting\ninformation from\nmanufacturer\nand workshop\nliterature\n2.3 Performing\ndiagnostic tests\n2.4 Carrying out\ninspection\n2.5 Comparing\ninspection\nresults\n2.6 Identifying faults\nand its causes\n2.7 Reporting\nfindings\n2.8 Applying safety\npractices\n\n--- PDF PAGE 82 ---\nTR-Automotive Servicing (Engine Repair) NC II Revision 01 Promulgated (08/11/2020) 78\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\nconverters,\ndiesel\nparticulate\nfilters, exhaust\ngas re-circulator\n(EGR)\n2.9 OSHS\n2.10 Wearing of PPEs\n2.11 Health protocols\nissued by\ngovernment on\nprevention of\nspread of and\nprotection from\ninfectious disease\nin the workplace\n2.12 The 3Rs\n2.13 5S\n2.14 Attitude:\n2.14.1 Patient\n2.14.2 Attention\nto details\n2.14.3 Time\nconscious\n2.14.3 Honest\n3. Repair intake and\nexhaust system\n3.1 Repair information\nis sourced and\ninterpreted\naccording to\nindustry criteria.\n3.2 Repair options are\nanalyzed and those\nmost appropriate to\nthe circumstances\nare selected.\n3.3 Repair tools,\nequipment and,\nmaterials are\nselected and\nchecked based on\nindustry criteria.\n3.4 Repairs are carried\nout according to\nindustry criteria.\n3.5 Post-repair testing\nis carried out\naccording to\nworkplace\nprocedures.\n3.1 Sourcing out and\ninterpretation of\nrepair information\n3.2 Repair options\n3.3 Tools, equipment,\nand materials\n3.4 Replacements\nand adjustments\nof components\n3.5 Post-repair testing\n3.6 OSHS\n3.7 Health protocols\nissued by\ngovernment on\nprevention of\nspread of and\nprotection from\ninfectious disease\nin the workplace\n3.8 Operation of\ninternal\ncombustion\nengine\n3.1 Interpreting\ninformation from\nmanufacturer\nand workshop\nliterature\n3.2 Sourcing and\ninterpreting\nrepair\ninformation\n3.3 Analyzing and\nselecting repair\noptions\n3.4 Selecting and\nchecking repair\ntools, equipment,\nand materials\n3.5 Carrying out\nrepairs and\ncomponent\nreplacements\nand adjustments\n3.6 Carrying out\npost-repair\ntesting\n\n--- PDF PAGE 83 ---\nTR-Automotive Servicing (Engine Repair) NC II Revision 01 Promulgated (08/11/2020) 79\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n3.6 Safety practices are\napplied following\nOccupational\nSafety and Health\nStandards (OSHS)\nprocedure.\n3.9 Specifications in\nthe repair manual\n3.10 Product of\ncombustion\n3.11 Basic of turbo-\ncharged engine\n3.12 Intercooler\nsystem\n3.13 Procedure in\naccomplishing\nchecklists\n3.14Job/Work done\n3.15 Attitude:\n3.15.1 Patience\n3.15.2 Attention\nto details\n3.15.3 Time\nconscious\n3.15.4 Honest\n3.7 Applying safety\npractices\n4. Complete work\nprocesses\n4.1 Final inspection is\nmade based on\nworkplace\nprocedure.\n4.2 Vehicle is turned-\nover to immediate\nsuperior for quality\ncontrol following\nworkplace\nprocedure.\n4.3 Work area is\nrestored following\n5S of good\nhousekeeping.\n4.4 Wastes are\nmanaged following\nenvironmental rules\nand regulations.\n4.5 Tools and\nequipment are\nchecked and stored\naccording to\nworkplace\nprocedures.\n4.6 Workplace\ndocuments are\nprocessed\naccording to\nworkplace\nprocedures.\n4.1 OSHS\n4.2 Wearing of PPEs\n4.3 3Rs\n4.4 5S of good\nhousekeeping\n4.5 Waste\nmanagement\n4.6 Final inspection\nprocedure\n4.7 Vehicle turn-over\nprocedure\n4.8 Accomplishment\nof workplace\ndocuments\n4.1 Conducting final\ninspection\n4.2 Performing\nvehicle turn-over\n4.3 Restoring work\narea\n4.4 Managing\nwastes\n4.5 Checking and\nstoring tools and\nequipment\n4.6 Accomplishing\nworkplace\ndocuments\n\n--- PDF PAGE 84 ---\nTR-Automotive Servicing (Engine Repair) NC II Revision 01 Promulgated (08/11/2020) 80\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Job requirements\nMay include:\n1.1 Inspect and replace intake system components\n1.2 Inspect and replace exhaust system components\n2. Tools, equipment, and\nmaterials\nMay include:\n2.1 Tools (Basic Hand Tools)\n2.1.1 Torque wrench\n2.1.2 Straight edge\n2.1.3 Feeler gauge\n2.1.4 Vacuum gauges\n2.1.5 Mechanic stethoscope\n\n2.2 Equipment\n2.2.1 Vehicle Lifter\n2.2.2 Crocodile jack\n2.2.3 Jack stand\n\n2.3 Materials\n2.3.1 Rags\n2.3.2 Degreaser\n2.3.3 Penetrating oil\n2.3.4 Wheel wedge\n2.3.5 Sealant\n2.3.6 Gasket\n3. Industry criteria\nMay include:\n3.1 Manufacturer specifications\n3.2 Repair manual\n3.3 Workplace procedures\n3.4 Safety and environmental requirements\n3.5 Service history\n4. Inspection of intake and\nexhaust system\nMay include:\n4.1 Visual inspection for leak\n4.2 Vacuum inspection for leak\n4.3 Noise of intake and exhaust system\n4.4 Vibration of intake and exhaust system\n5. Repair options\nMay include:\n5.1 Adjustment\n5.2 Cleaning\n5.3 Repair and Replacement\n6. Post-repair testing\nMay include:\n6.1 Visual inspection of emission leaks\n6.2 Check unusual engine noise\n7. Workplace documents\nMay include:\n7.1 Repair order\n7.2 Inspection form\n7.3 Diagnostic sheet\n\n--- PDF PAGE 85 ---\nTR-Automotive Servicing (Engine Repair) NC II Revision 01 Promulgated (08/11/2020) 81\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Prepared to diagnose and repair intake and exhaust\nsystem.\n1.1.1 Determined job requirements.\n1.1.2 Sourced and interpreted diagnostic information.\n1.1.3 Verified symptoms.\n1.1.4 Identified hazards associated with the work and\nmanaged risks.\n1.1.5 Selected and checked tools, equipment, and\nmaterials.\n1.1.6 Reported defective and damaged tools and\nequipment.\n1.1.7 Checked and reported availability of materials.\n\n1.2 Diagnosed intake and exhaust system.\n1.2.1 Performed diagnostic tests.\n1.2.2 Carried out inspection.\n1.2.3 Compared inspection results.\n1.2.4 Identified faults and its causes.\n1.2.5 Reported findings.\n1.2.6 Applied safety practices.\n\n1.3 Repaired intake and exhaust system.\n1.3.1 Sourced and interpreted repair information.\n1.3.2 Analyzed repair options.\n1.3.3 Selected and checked repair tools, equipment, and\nmaterials.\n1.3.4 Carried out repairs.\n1.3.5 Carried out post-repair testing.\n1.3.6 Applied safety practices.\n\n1.4 Completed work processes.\n1.4.1 Made final inspection.\n1.4.2 Turned-over vehicle.\n1.4.3 Restored work area.\n1.4.4 Managed wastes.\n1.4.5 Checked and stored tools and equipment.\n1.4.6 Processed workplace documents.\n2. Resource\nimplications\nThe following resources MUST be provided:\n2.1 Workplace: Real or simulated work area\n2.2 Tools, materials, and equipment relevant to perform\nrequired tasks\n2.3 Manufacturer’s repair manual\n2.4 PPEs\n2.5 Training vehicle\n2.6 CPE\n2.7 First aid kit\n\n--- PDF PAGE 86 ---\nTR-Automotive Servicing (Engine Repair) NC II Revision 01 Promulgated (08/11/2020) 82\n3. Method of\nassessment\nCompetency in this unit may be assessed through:\n3.1 Demonstration with Oral questioning\n3.2 Written exam\n3.3 Direct Observation\n4. Context for\nassessment\n4.1 Competency may be assessed individually in the actual\nworkplace or simulation environment in TESDA accredited\ninstitutions.\n\n--- PDF PAGE 87 ---\nTR-Automotive Servicing (Engine Repair) NC II Revision 01 Promulgated (08/11/2020) 83\n\nUNIT OF COMPETENCY\n:\nDIAGNOSE AND OVERHAUL ENGINE MECHANICAL\nSYSTEM\n\nUNIT CODE\n:"
