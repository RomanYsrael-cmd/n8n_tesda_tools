lities\nfunctionalities are\nmonitored following\nworkplace\nprocedures.\n2.5 Safety practices are\napplied following\nOSHS.\n2.1 Operate\nEquipment\n2.2 Identify facilities\nrequired for task\n2.3 Evaluate\nequipment\noperation\n2.4 Inspect facility\nfunctionalities\n2.5 OSHS practices\nrelated to\noperation of\nfacilities and\nequipment\n2.6 Manuals in\nutilizing facility\nand equipment\n2.7 Monitoring\nprocedure of\nequipment’s\nperformance\n2.8 Evaluate\nequipment\noperation\n2.9 Inspection of\nfacility\nfunctionalities\n2.1 Operating\nequipment\n2.2 Utilizing facility\n2.3 Monitoring\nequipment\nperformance\n2.4 Monitoring\nfunctionalities of\nfacility\n2.5 Practicing safety\n2.6 Following\nmanual\n3. Conduct post-\noperation activities\n3.1 Workshop facilities\nare restored\naccording to 5S of\ngood\nhousekeeping.\n3.2 Equipment are\ncleaned and stored\naccording to good\nhousekeeping.\n3.3 Wastes are\ndisposed following\nwaste management\nprocedure and\nOSHS.\n3.4 PPEs and Safety\npractices are\napplied following\nOSHS.\n3.5 Report is prepared\nbased on workshop\nprocedure.\n3.1 5S of Good\nhousekeeping\n3.2 3Rs/ Waste\nsegregation and\ndisposal\n3.3 Restoration of the\nfacilities\n3.4 Maintenance and\nstorage of\nEquipment\n3.5 OSHS\n3.6 Preparation of\nreport\n3.1 Restoring\nworkshop\nfacilities properly\n3.2 Cleaning\nEquipment\n3.3 Storing\nequipment in\nproper location\n3.4 Disposing waste\nmaterials\n3.5 Reporting\nfacilities and\nequipment\ncondition\n3.6 Practicing safety\n3.7 Practicing 5S\nand 3Rs\n\n--- PDF PAGE 62 ---\nTR-Automotive Servicing (Engine Repair) NC II Revision 01 Promulgated (08/11/2020) 58\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Equipment\nMay include:\n1.1 Lifter (Two Post Lifter / Four Post Lifter/ Scissor\ntype)\n1.2 Crocodile Jack\n1.3 Jack Stand\n1.4 Air Compressor\n1.5 Oil drain\n2. Workshop facilities\nMay include:\n2.1 Service Stall / Working Bay / Workshop areas for\nservicing/repairing light and/or heavy vehicle and/or\n