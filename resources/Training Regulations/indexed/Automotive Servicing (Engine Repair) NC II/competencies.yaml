nd installers\n2.1.11 Special tools based on manufacturer’s\nstandards*\n2.1.12 Compression tester\n2.1.13 Ridge reamer\n2.1.14 Valve spring compressor\n2.1.15 Oiler\n2.1.16 Steel square\n2.1.17 Mechanic stethoscope\n2.1.18 V-block\n2.2 Equipment:\n2.2.1 Engine hydraulic crane\n2.2.2 Chain block\n2.2.3 Engine stand\n2.2.4 Vehicle Lifter\n2.2.5 Crocodile jack\n2.2.6 Jack stand\n2.2.7 Press machine\n2.2.8 Honing\n2.2.9 Valve grinder\n2.2.10 Valve refacer\n2.2.11 Water heater\n2.2.12 Surface plate\n2.2.13 Pressure gauge\n2.2.14 Bench vise\n2.2.15 Bench grinder with steel brush\n2.2.16 Wash basin\n\n--- PDF PAGE 92 ---\nTR-Automotive Servicing (Engine Repair) NC II Revision 01 Promulgated (08/11/2020) 88\nVARIABLE\nRANGE\n2.2.17 Parts tray\n2.2.18 Overhauling table\n2.2.19 Trolley\n2.2.20 Oil bucket\n2.2.21 Hydraulic Press\n2.3 Materials:\n2.3.1 Rags\n2.3.2 Degreaser\n2.3.3 Engine oil\n2.3.4 Penetrating oil\n2.3.5 Plastigauge\n2.3.6 Valve lap\n2.3.7 Grinding compound\n2.3.8 Overhauling gasket\n2.3.9 Adhesive and sealant\n2.3.10 Sanding paper\n2.3.11 Sealant\n2.3.12 Grinding stick\n2.3.13 Crocus cloth\n2.3.14 Kerosene\n3. Industry criteria\nMay include:\n3.1 Manufacturer specifications\n3.2 Repair manual\n3.3 Workplace procedures\n3.4 Safety and environmental requirements\n3.5 Service history\n4. Inspection of engine\nmechanical system\nMay include:\n4.1 Visual inspection for leak\n4.2 Checking and measuring of dimensions/clearances\n4.3 Visual inspection for wear and tear\n4.4 Noise of engine mechanical components\n4.5 Compression test\n4.6 Engine oil and fuel consumption history\n4.7 Smoke emissions (blow-by and exhaust gas)\n4.8 Starting condition\n5. Repair options\nMay include:\n5.1 Overhauling\n5.2 Adjustment\n5.3 Cleaning\n5.4 Replacement\n5.5 Referral to machine shops\n6. Post-repair testing\nMay include:\n6.1 Check mechanical operation by hand\n6.2 Check idle performance\n6.3 Visual inspection of exhaust smoke\n6.4 Check unusual engine noise\n6.5 Check engine oil pressure\n6.6 Inspection of oil and water leakage\n\n--- PDF PAGE 93 ---\nTR-Automotive Servicing (Engine Repair) NC II Revision 01 Promulgated (08/11/2020) 89\nVARIABLE\nRANGE\n7. Workplace documents\nMay include:\n7.1 Repair order\n7.2 Inspection form\n7.3 Diagnostic sheet\n7.4 Customer Interview sheet\n\n--- PDF PAGE 94 ---\nTR-Automotive Servicing (Engine Repair) NC II Revision 01 Promulgated (08/11/2020) 90\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Prepared to diagnose engine mechanical system.\n1.1.1 Determined job requirements.\n1.1.2 Sourced and interpreted diagnostic information.\n1.1.3 Verified symptoms.\n1.1.4 Identified hazards associated with work and\nmanaged risks.\n1.1.5 Selected and checked tools, equipment, and\nmaterials.\n1.1.6 Reported non-serviceable tools and equipment.\n1.1.7 Checked and reported availability materials.\n1.2 Diagnosed engine mechanical system.\n1.2.1 Performed diagnostic tests.\n1.2.2 Carried out inspection.\n1.2.3 Compared inspection results.\n1.2.4 Identified faults and its causes.\n1.2.5 Reported findings and recommendations.\n1.2.6 Applied safety practices.\n1.3 Repaired engine mechanical system.\n1.3.1 Sourced and interpreted repair information.\n1.3.2 Analyzed repair options.\n1.3.3 Selected and checked repair tools, equipment, and\nmaterials.\n1.3.4 Carried out repair options.\n1.3.5 Carried out post-repair testing.\n1.3.6 Applied safety practices.\n1.4 Completed work processes.\n1.4.1 Made final inspection.\n1.4.2 Turned-over vehicle.\n1.4.3 Restored work area.\n1.4.4 Managed wastes.\n1.4.5 Checked and stored tools and equipment.\n1.4.6 Processed workplace documents.\n2. Resource\nimplications\nThe following resources MUST be provided:\n2.1 Workplace: Real or simulated work area\n2.2 Tools, materials, and equipment relevant to perform\nrequired tasks\n2.3 Manufacturer’s repair manual\n2.4 PPEs\n2.5 Training vehicle\n3. Method of\nassessment\nCompetency in this unit may be assessed through:\n3.1 Demonstration with Oral questioning\n3.2 Written exam\n3.3 Direct Observation\n4. Context for\nassessment\n4.1 Competency may be assessed individually in the actual\nworkplace or simulation environment in TESDA accredited\ninstitutions.\n\n--- PDF PAGE 95 ---\nTR-Automotive Servicing (Engine Repair) NC II Revision 01 Promulgated (08/11/2020) 91"
