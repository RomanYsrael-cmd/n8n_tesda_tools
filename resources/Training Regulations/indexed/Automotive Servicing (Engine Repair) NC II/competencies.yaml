          "source_text": "1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Received vehicle\n1.2 Prepared vehicle for servicing\n1.3 Prepared vehicle for releasing\n1.4 Applied safety practices\n2. Resource\nimplications\nThe following resources MUST be provided:\n2.1 Workplace: Real or simulated work area\n2.2 Appropriate Tools & Equipment\n2.3 Materials relevant to the activity\n2.4 Manuals and references\n3. Method of\nassessment\nCompetency may be assessed through:\n3.1 Direct observation\n3.2 Demonstration with Oral questioning\n3.3 Interview\n3.4 Written Evaluation\n3.5 Third Party Report\n4. Context of\nassessment\n4.1 Competency may be assessed individually in the actual\nworkplace or through accredited institution.\n\n--- PDF PAGE 72 ---\nTR-Automotive Servicing (Engine Repair) NC II Revision 01 Promulgated (08/11/2020) 68\n\nCORE COMPETENCY\n\nUNIT OF COMPETENCY\n:\nDIAGNOSE AND REPAIR ENGINE COOLING AND\nLUBRICATION SYSTEM\n\nUNIT CODE\n:\nALT23399\n\nUNIT DESCRIPTOR\n:\nThis unit describes the performance outcomes required\nto diagnose and repair faults in the cooling systems of\nvehicles such as radiator, water pump, and thermostat\nand lubrication systems such as oil pump, oil cooler,\nhoses and oil pressure switch. It covers the knowledge,\nskills, and attitudes required to prepare to diagnose and\nrepair engine cooling and lubrication systems, diagnose\nand repair engine cooling and lubrication system and\ncomplete work processes.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Prepare to\ndiagnose and\nrepair engine\ncooling and\nlubrication\nsystems\n1.1 Job requirements\nare determined\nfrom workplace\ninstructions.\n1.2 Diagnostic\ninformation is\nsourced and\ninterpreted using\nindustry criteria.\n1.3 Symptoms are\nverified using\ntroubleshooting\nguide.\n1.4 Hazards associated\nwith the work are\nidentified and risks\nare managed\naccording to\nindustry criteria.\n1.5 Tools, equipment,\nand materials are\nselected and\nchecked for\nserviceability\naccording industry\ncriteria.\n1.6 Defective and\ndamaged tools and\nequipment are\nreported following\n1.1 Operating\nprinciples of the\ncooling system\n1.2 Different job\nrequirements\n1.3 Diagnostic\ninformation\n1.4 Troubleshooting\nguide\n1.5 Industry criteria\n1.6 Tools, equipment,\nand materials in\ndiagnosing and\nrepairing engine\ncooling and\nlubricating system\n1.7 Procedure in\naccomplishing\nforms\n1.8 OSHS\n1.9 Wearing of PPEs\n1.10 Health protocols\nissued by\ngovernment on\nprevention of\nspread of and\nprotection from\ninfectious disease\nin the workplace\n 1.11 3Rs\n1.1 Determining job\nrequirements\nfrom workplace\ninstructions\n1.2 Clarifying\ninstructions\n1.3 Sourcing and\ninterpreting\ndiagnostic\ninformation\n1.4 Analyzing\ndiagnostic\noptions\n1.5 Using\ntroubleshooting\nguide\n1.6 Identifying\nhazards\n1.7 Managing risks\n1.8 Selecting and\nchecking tools,\nequipment and\nmaterials\n1.9 Reporting\ndefective and\ndamaged tools\nand equipment\n1.10 Checking and\nreporting the\n\n--- PDF PAGE 73 ---\nTR-Automotive Servicing (Engine Repair) NC II Revision 01 Promulgated (08/11/2020) 69\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\nworkplace\nprocedures and\nOccupational\nSafety and Health\nprocedure.\n1.7 Availability of\nmaterials are\nchecked and\nreported following\nworkplace\nprocedures.\n1.12 5S\n1.13 Attitude:\n1.13.1 Patience\n1.13.2 Attention to\ndetails\n1.13.3 Time\nconscious\n1.13.4 Honest\n1.13.5 Resourceful\navailability of\nmaterials\n2. Diagnose engine\ncooling and\nlubrication system\n2.1 Diagnostic tests are\nperformed\naccording to\nindustry criteria.\n2.2 Inspection is\ncarried out\naccording to\nindustry criteria.\n2.3 Inspection results\nare compared with\nmanufacturer\nspecifications.\n2.4 Faults are identified\nfrom diagnostic test\nresults and causes\nof faults are\ndetermined\naccording to\nindustry criteria.\n2.5 Findings are\nreported according\nto workplace\nprocedures,\nincluding\nrecommendations\nfor necessary\nrepairs and\nadjustments.\n2.6 Safety practices are\napplied following\nOccupational\nSafety and Health\nStandards (OSHS)\nprocedure.\n2.1 Industry criteria\n2.2 Faults of cooling\nand lubricating\nsystem\n2.3 Procedure in\naccomplishing\nforms\n2.4 Mensuration\n2.5 Inspection\nprocedure\n2.6 Diagnostic testing\nprocedures for\ncooling and\nlubricating\nsystems\n2.7 Radiator leak\npressure test\n2.8 Oil pressure test\n2.9 Effects of\ncorrosion,\ncavitation,\ncontamination\nand electrolysis\n2.10 Engine coolant\n2.11 Cooling system\npressure\n2.12 Coolant leak\n2.13 Cooling fan\nsystem\n2.14 Thermostat\n2.15 Cooling system\nhose\n2.16 Water pump\n2.17 Belt tension\n2.18 Engine oil\n2.19 Oil galleries\n2.20 Oil cooler\n2.21 OSHS\n2.22 Wearing of PPEs\n2.1 Interpreting\ninformation from\nmanufacturer\nand workshop\nliterature\n2.2 Interpreting\ngauges and\nmetric units of\npressure and\ntemperature\n2.3 Performing\ndiagnostic tests\n2.4 Carrying out\ninspection\n2.5 Comparing\ninspection\nresults\n2.6 Identifying faults\nand its causes\n2.7 Reporting\nfindings\n2.8 Applying safety\npractices\n\n--- PDF PAGE 74 ---\nTR-Automotive Servicing (Engine Repair) NC II Revision 01 Promulgated (08/11/2020) 70\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n2.23 Health protocols\nissued by\ngovernment on\nprevention of\nspread of and\nprotection from\ninfectious disease\nin the workplace\n2.24 The 3Rs\n2.25 5S\n2.26 Attitude:\n2.26.1 Patience\n2.26.2 Attention\nto details\n2.26.3 Time\nconscious\n2.26.4 Honest\n2.26.5 Organize\n3. Repair engine\ncooling and\nlubrication system\n3.1 Repair information\nis sourced and\ninterpreted\nfollowing industry\ncriteria.\n3.2 Repair options are\nanalyzed and those\nmost appropriate to\nthe circumstances\nare selected.\n3.3 Repair tools,\nequipment, and\nmaterials are\nselected and\nchecked according\nto industry criteria.\n3.4 Repairs and\ncomponent\nreplacements and\nadjustments are\ncarried out\naccording to\nindustry criteria.\n3.5 Post-repair testing\nis carried out\naccording to\nworkplace\nprocedures.\n3.6 Safety practices are\napplied following\nOccupational\nSafety and Health\n3.1 Sourcing out and\ninterpretation of\nrepair information\n3.2 Repair options\n3.3 Repair tools,\nequipment, and\nmaterials\n3.4 Replacements\nand adjustments\nof components\n3.5 Post-repair testing\n3.6 Engine coolant\ntypes and\ncomposition\n3.7 Water pumps\n3.8 Thermostats and\nbypass systems\n3.9 Mechanical,\nhydraulic,\npneumatic and\nelectric cooling\nfan systems\n3.10 Heat exchangers/\nradiators and\nradiator caps\n3.11 Heat exchangers\n3.12 Expansion tanks/\ncoolant reservoir\n3.13 Hoses\n3.14 Drive belts\n3.1 Interpreting\ninformation from\nmanufacturer\nand workshop\nliterature\n3.2 Sourcing and\ninterpreting\nrepair\ninformation\n3.3 Analyzing and\nselecting repair\noptions\n3.4 Selecting and\nchecking\nrepairing tools,\nequipment, and\nmaterials\n3.5 Carrying out\nrepairs and\ncomponent\nreplacements\nand adjustments\n3.6 Carrying out\npost-repair\ntesting\n3.7 Applying safety\npractices\n\n--- PDF PAGE 75 ---\nTR-Automotive Servicing (Engine Repair) NC II Revision 01 Promulgated (08/11/2020) 71\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\nStandards (OSH)\nprocedure.\n3.15 Temperature\nsensors and\ngauges\n3.16 Engine oil types\nand composition\n3.17 Oil pump\n3.18 Attitude:\n3.18.1 Patient\n3.18.2 Attention\nto details\n3.18.3 Time\nconscious\n3.18.4 Honest\n4. Complete work\nprocesses\n4.1 Final inspection is\nmade based on\nworkplace\nprocedure.\n4.2 Vehicle is turned-\nover to immediate\nsuperior for quality\ncontrol following\nworkplace\nprocedure.\n4.3 Work area is\nrestored following\n5S of good\nhousekeeping.\n4.4 Wastes are\nmanaged following\nenvironmental rules\nand regulations.\n4.5 Tools and\nequipment are\nchecked and stored\naccording to\nworkplace\nprocedures.\n4.6 Workplace\ndocuments are\naccomplished\naccording to\nworkplace\nprocedures.\n4.1 OSHS\n4.2 Wearing of PPEs\n4.3 3Rs\n4.4 5S of good\nhousekeeping\n4.5 Waste\nmanagement\n4.6 Final inspection\nprocedure\n4.7 Vehicle turn-over\nprocedure\n4.8 Accomplishment\nof workplace\ndocuments\n4.1 Conducting final\ninspection\n4.2 Performing\nvehicle turn-over\n4.3 Restoring work\narea\n4.4 Managing\nwastes\n4.5 Checking and\nstoring tools and\nequipment\n4.6 Accomplishing\nworkplace\ndocuments\n\n--- PDF PAGE 76 ---\nTR-Automotive Servicing (Engine Repair) NC II Revision 01 Promulgated (08/11/2020) 72\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Job requirements\nMay include:\n1.1 Cooling system:\n1.1.1 Inspection, repair, and replacement of radiator\n1.1.2 Inspection and replacement of radiator cap\n1.1.3 Inspection, testing and replacement of\nthermostat\n1.1.4 Inspection and replacement of water pump\n1.1.5 Inspection and replacement of reservoir\n1.1.6 Inspection and adjustment of belt tension\n1.1.7 Inspection and replacement of radiator hoses\n1.1.8 Inspection and replacement of radiator fan\n1.1.9 Inspection and replacement of radiator fan\nmotor\n1.2 Lubrication system:\n1.2.1 Inspection and replacement of oil pump\n1.2.2 Inspection and replacement of oil pan\n1.2.3 Inspection and replacement oil cooler and\nhoses\n1.2.4 Inspection and replacement of oil pressure\nsensor\n1.2.5 Inspection and replacement of oil regulating\nvalve\n2. Workplace instructions\nMay include:\n2.1 Instruction from immediate superior\n2.2 Instruction in repair order\n2.3 Instruction from interview sheet\n3. Industry criteria\nMay include:\n3.1 Manufacturer specifications\n3.2 Repair manual\n3.3 Workplace procedures\n3.4 Safety and environmental requirements\n3.5 Service history\n4. Tools\nMay include:\n4.1 Radiator and cap pressure tester\n4.2 Belt tension gauge\n4.3 Basic hand tools\n4.4 Thermometer\n4.5 Multi-tester\n4.6 Torque wrench\n4.7 Vernier caliper\n4.8 Water heater\n4.9 Oil pressure gauge\n5. Equipment\nEquipment may include:\n5.1 Vehicle lifter\n5.2 Jack stand\n5.3 Trouble light\n5.4 Creeper\n\n--- PDF PAGE 77 ---\nTR-Automotive Servicing (Engine Repair) NC II Revision 01 Promulgated (08/11/2020) 73\nVARIABLE\nRANGE\n6. Materials\nMay include:\n6.1 Rags\n6.2 Engine coolant\n6.3 PPEs\n6.4 Sealant\n6.5 Steel brush\n6.6 Belt dressing\n7. Inspection of engine\ncooling and lubrication\nsystem components\nMay include:\n7.1 Visual\n7.2 Auditory\n7.3 Smell\n7.4 Touch\n8. Repair options\nMay include:\n8.1 Replacement\n8.2 Adjustment\n8.3 Tightening\n9. Post-repair testing\nMay include:\n9.1 Inspect for engine coolant leaks\n9.2 Inspect engine coolant level\n9.3 Inspect for proper bleeding of coolant\n9.4 Inspect for abnormal noise\n9.5 Verify for normal operating temperature\n9.6 Inspect proper radiator fan operation\n9.7 Inspect belt tension\n9.8 Inspect fluid clutch fan\n9.9 Inspect engine oil level\n10. Workplace documents\nMay include:\n10.1 Repair order\n10.2 Inspection form\n10.3 Diagnostic sheet\n10.4 Customer interview sheet\n\n--- PDF PAGE 78 ---\nTR-Automotive Servicing (Engine Repair) NC II Revision 01 Promulgated (08/11/2020) 74\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Prepared to diagnose and repair engine cooling and\nlubrication systems.\n1.1.1 Determined job requirements\n1.1.2 Sourced and interpreted diagnostic information.\n1.1.3 Verified symptoms.\n1.1.4 Identified hazards associated with the work and\nmanaged risks.\n1.1.5 Selected and checked tools, equipment, and\nmaterials.\n1.1.6 Reported defective and damaged tools and\nequipment.\n1.1.7 Checked and reported availability of materials.\n\n1.2 Diagnosed engine cooling and lubrication system.\n1.2.1 Performed diagnostic tests.\n1.2.2 Carried out inspection.\n1.2.3 Compared inspection results.\n1.2.4 Identified faults and its causes.\n1.2.5 Reported findings.\n1.2.6 Applied safety practices.\n\n1.3 Repaired engine cooling and lubrication system.\n1.3.1 Sourced and interpreted repair information.\n1.3.2 Analyzed repair options.\n1.3.3 Selected and checked repair tools, equipment, and\nmaterials.\n1.3.4 Carried out repairs and component replacements\nand adjustments.\n1.3.5 Carried out post-repair testing.\n1.3.6 Applied safety practices.\n\n1.4 Completed work processes.\n1.4.1 Made final inspection.\n1.4.2 Turned-over vehicle.\n1.4.3 Restored work area.\n1.4.4 Managed wastes.\n1.4.5 Checked and stored tools and equipment.\n1.4.6 Accomplished workplace documentations.\n2. Resource\nimplications\nThe following resources MUST be provided:\n2.1 Workplace: Real or simulated work area\n2.2 Tools, materials, and equipment relevant to perform\nrequired tasks\n2.3 Manufacturer’s repair manual\n2.4 PPEs\n2.5 Training vehicle\n2.6 CPE\n2.7 First aid kit\n\n--- PDF PAGE 79 ---\nTR-Automotive Servicing (Engine Repair) NC II Revision 01 Promulgated (08/11/2020) 75\n3. Method of\nassessment\nCompetency in this unit may be assessed through:\n3.1 Demonstration with Oral questioning\n3.2 Written exam\n3.3 Direct Observation\n4. Context for\nassessment\n4.1 Competency may be assessed individually in the actual\nworkplace or simulation environment in TESDA accredited\ninstitutions.\n\n--- PDF PAGE 80 ---\nTR-Automotive Servicing (Engine Repair) NC II Revision 01 Promulgated (08/11/2020) 76\n\nUNIT OF COMPETENCY\n:\nDIAGNOSE AND REPAIR INTAKE AND EXHAUST\nSYSTEM\n\nUNIT CODE\n:"
