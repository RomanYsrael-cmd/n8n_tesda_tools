      "term": "A correction or modification to reflect actual conditions",
      "definition": "2. DIAGNOSE To analyze the cause or nature of problem. 3. INSPECT To examine, view closely or look at carefully in order to determine fault or failure. 4. MACHINING Is any of various processes in which a piece of raw material is cut into a desired final shape and size by a controlled material-removal process. 5. OVERHAUL To renovate, remake, revise or renew thoroughly to meet the standard specification. To look at every part of (something) and repair or replace the parts that do not work. 6. REPAIR To restore by replacing or putting together a part of components to return to its original specification. 7. REPLACE"
    },
    {
      "term": "To install something in place of it",
      "definition": "8. SECURE To put in a place or position so that it will not move. 9. TIGHTENING A process of securing a part of engine such as bolts or nuts with the used of hand tools or torque wrenches. 10. TROUBLESHOOTING is a systematic approach to problem solving that is often used to find and correct faults. 11. WATER HEATER a part of water heating system which is for a vehicle using an engine-independent heater, and generates hot water through exhaust heat of the engine-independent heater mounted for heating a vehicle. 12. VEHICLE LIFTER a device or machine part used for lifting another part, as a cam used for lifting a valve in an engine. 13. ENGINE HOIST also known as engine lifter is a tool that is used for lifting up heavy objects, mostly car parts like engines and transmissions 14. PIT a naturally formed or excavated hole or cavity in the ground and a pit makes it possible to work underneath a vehicle at the same time as above the vehicle. 15. CROCODILE JACK is mechanical lifting device used to apply great forces or lift heavy loads. 16. REPAIR refers to restoration, adjustment and repair 17. INTAKE MANIFOLD inlet manifold or intake manifold (in American English) is the part of an engine that supplies the fuel/air mixture to the cylinders. Designed to run on three timed components, air mixed fuel, spark, and combustion; the internal combustion engine relies upon the intake manifold to help it breathe. Featuring a series of tubes, the intake manifold ensures that the air coming into the engine is evenly distributed to all the cylinders. 18. EXHAUST MANIFOLD The exhaust manifold is the first part of your vehicle’s exhaust system. It is connected to your vehicle’s engine and collects your engine’s emissions. The exhaust manifold receives the air/fuel mixture from the multiple cylinders in your vehicle’s engine. It collects the fuel/air mixture from each cylinder, whether you have four, six, or eight cylinders. Not only does the exhaust manifold receive all of the burnt engine gases, but also it completely burns any unused or incomplete burnt gases using its very high temperature. The manifold also houses the first oxygen sensor in your exhaust system to inspect the amount of oxygen entering the system. 19. CYLINDER BLOCK also known as engine block , the cylinder block is one of your engine's central components. It plays a key role in the lubrication, temperature control and stability of the engine and it has to be of the highest quality so there is no room for short cuts. A typical cylinder block unit is made up of a number of cylinders, depending on the type and specification of the engine model being built, and it will include cylinder walls, coolant passages and cylinder sleeves. It maintains the engine's stability and lubrication while withstanding a variety of temperatures and loads. It also transfers oil to all parts of the engine, lubricating all the critical components, via a number of oil galleries. 20. OIL PRESSURE"
