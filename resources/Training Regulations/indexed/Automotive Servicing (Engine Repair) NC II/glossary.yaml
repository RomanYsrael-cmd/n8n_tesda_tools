  "source_text": "1. ADJUSTMENT\nA correction or modification to reflect actual conditions.\n\n2. DIAGNOSE\nTo analyze the cause or nature of problem.\n\n3. INSPECT\nTo examine, view closely or look at carefully in order to\ndetermine fault or failure.\n\n4. MACHINING\nIs any of various processes in which a piece of raw material\nis cut into a desired final shape and size by a controlled\nmaterial-removal process.\n\n5. OVERHAUL\n\nTo renovate, remake, revise or renew thoroughly to meet\nthe standard specification. To look at every part of\n(something) and repair or replace the parts that do not work.\n\n6. REPAIR\nTo restore by replacing or putting together a part of\ncomponents to return to its original specification.\n\n7. REPLACE\n\nTo install something in place of it.\n8. SECURE\nTo put in a place or position so that it will not move.\n\n9. TIGHTENING\nA process of securing a part of engine such as bolts or nuts\nwith the used of hand tools or torque wrenches.\n\n10. TROUBLESHOOTING\nis a systematic approach to problem solving that is often\nused to find and correct faults.\n\n11. WATER HEATER\na part of water heating system which is for a vehicle using\nan engine-independent heater, and generates hot water\nthrough exhaust heat of the engine-independent heater\nmounted for heating a vehicle.\n\n12. VEHICLE LIFTER\na device or machine part used for lifting another part, as a\ncam used for lifting a valve in an engine.\n\n13. ENGINE HOIST\nalso known as engine lifter is a tool that is used for lifting\nup heavy objects, mostly car parts like engines and\ntransmissions\n\n14. PIT\na naturally formed or excavated hole or cavity in the ground\nand a pit makes it possible to work underneath a vehicle at\nthe same time as above the vehicle.\n\n15. CROCODILE JACK\nis mechanical lifting device used to apply great forces or lift\nheavy loads.\n\n--- PDF PAGE 143 ---\nTR-Automotive Servicing (Engine Repair) NC II Revision 01 Promulgated (08/11/2020) 139\n16. REPAIR\nrefers to restoration, adjustment and repair\n\n17. INTAKE MANIFOLD\ninlet manifold or intake manifold (in American English) is the\npart of an engine that supplies the fuel/air mixture to the\ncylinders. Designed to run on three timed components, air\nmixed fuel, spark, and combustion; the internal combustion\nengine relies upon the intake manifold to help it breathe.\nFeaturing a series of tubes, the intake manifold ensures that\nthe air coming into the engine is evenly distributed to all the\ncylinders.\n\n18. EXHAUST MANIFOLD\nThe exhaust manifold is the first part of your vehicle’s\nexhaust system. It is connected to your vehicle’s engine and\ncollects your engine’s emissions. The exhaust manifold\nreceives the air/fuel mixture from the multiple cylinders in\nyour vehicle’s engine. It collects the fuel/air mixture from\neach cylinder, whether you have four, six, or eight cylinders.\nNot only does the exhaust manifold receive all of the burnt\nengine gases, but also it completely burns any unused or\nincomplete burnt gases using its very high temperature. The\nmanifold also houses the first oxygen sensor in your exhaust\nsystem to inspect the amount of oxygen entering the\nsystem.\n\n19. CYLINDER BLOCK\nalso known as engine block , the cylinder block is one of\nyour engine's central components. It plays a key role in the\nlubrication, temperature control and stability of the engine\nand it has to be of the highest quality so there is no room for\nshort cuts. A typical cylinder block unit is made up of a\nnumber of cylinders, depending on the type and\nspecification of the engine model being built, and it will\ninclude cylinder walls, coolant passages and cylinder\nsleeves. It maintains the engine's stability and lubrication\nwhile withstanding a variety of temperatures and loads. It\nalso transfers oil to all parts of the engine, lubricating all the\ncritical components, via a number of oil galleries.\n\n20. OIL PRESSURE\nSENSOR\nAn oil pressure sensor is a device used to measure the oil\npressure on an engine. Oil pressure sensor is actually a\nterm that covers at least two different and distinct types\nof sensor - an oil pressure switch and oil pressure sender.\n\n--- PDF PAGE 144 ---\nTR-Automotive Servicing (Engine Repair) NC II Revision 01 Promulgated (08/11/2020) 140",
  "document_id": "tesda:tr:automotive-servicing-engine-repair-nc-ii:d867c8a338"
