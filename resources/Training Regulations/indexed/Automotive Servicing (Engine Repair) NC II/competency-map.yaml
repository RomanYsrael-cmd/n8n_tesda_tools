  "source_text": "SECTION 1 AUTOMOTIVE SERVICING (ENGINE REPAIR) NC II\nQUALIFICATION\n\nThe AUTOMOTIVE SERVICING (ENGINE REPAIR) NC II Qualification\nconsists of competencies that a person must achieve to diagnose and repair engine\ncooling and lubrication system and intake and exhaust system and diagnose and\noverhaul engine mechanical system.\n\nThis Qualification is packaged from the competency map of the Automotive and\nLand Sector as shown in Annex A.\n\nThe Units of Competency comprising this Qualification include the following:\n\nCODE NO.\nBASIC COMPETENCIES\n400311210\nParticipate in workplace communication\n400311211\nWork in team environment\n400311212\nSolve/address general workplace problems\n400311213\nDevelop career and life decisions\n400311214\nContribute to workplace innovation\n400311215\nPresent relevant information\n400311216\nPractice occupational safety and health policies and procedures\n400311217\nExercise efficient and effective sustainable practices in the\nworkplace\n400311218\nPractice entrepreneurial skills in the workplace\n\nCODE NO.\nCOMMON COMPETENCIES\nALT723211\nValidate vehicle specification\nALT723212\nMove and position vehicle\nALT723213\nUtilize automotive tools\nALT723214\nPerform mensuration and calculation\nALT723215\nUtilize workshop facilities and equipment\nALT723216\nPrepare servicing parts and consumables\nALT723217\nPrepare vehicle for servicing and releasing\n\nCODE NO.\nCORE COMPETENCIES\nALT23399\nDiagnose and repair engine cooling and lubrication system\nALT233100\nDiagnose and repair intake and exhaust system\nALT233101\nDiagnose and overhaul engine mechanical system\n\nA person who has achieved this Qualification is competent to be:\n\n❑ Engine Repair Specialist\n❑ Engine Repair Technician\n❑ Engine Technician\n\n--- PDF PAGE 6 ---\nTR-Automotive Servicing (Engine Repair) NC II Revision 01 Promulgated (08/11/2020) 2"
}
