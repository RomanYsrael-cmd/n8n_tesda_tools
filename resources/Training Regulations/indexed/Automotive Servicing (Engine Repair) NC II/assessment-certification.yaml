  "source_text": "SECTION 4 ASSESSMENT AND CERTIFICATION ARRANGEMENT\n\nCompetency Assessment is the process of collecting evidence and making\njudgments whether competency has been achieved. The purpose of assessment is\nto confirm that an individual can perform to the standards expected at the workplace\nas expressed in relevant competency standards.\n\nThe assessment process is based on evidence or information gathered to prove\nachievement of competencies. The process may be applied to a full qualification or\nemployable unit(s) of competency in partial fulfillment of the requirements of the\nnational qualification.\n\n4.1.\nNATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1.1 The\nNational\nCertificate\nQualification\nfor\nAUTOMOTIVE\nSERVICING (ENGINE REPAIR) NC II shall be obtained when a\ncandidate\ndemonstrates\ncompetence\nthrough\nproject-type\nassessment covering all units of competency listed in Section 1.\nSuccessful candidates shall be awarded a National Certificate\nsigned by the TESDA Director General\n\n4.1.2 Assessment shall cover all competencies, with basic and common\nintegrated or assessed concurrently with the core units of\ncompetency.\n\n4.1.3 The following are qualified to apply for assessment and certification,\nas long as they are holders of National Certificate in the amended\nAutomotive Servicing NC I:\n\n4.1.3.1 Graduates of WTR-registered program on Automotive\nServicing (Engine Repair) NC II, or graduates of NTR\nprograms or of enterprise-based training programs related\nto automotive servicing (engine repair) ; or\n\n4.1.3.2 Candidates who gained competencies in implementing\nautomotive servicing (engine repair) or any related field\nthrough informal training or previous work experiences for\nat least two (2) years; or\n\n4.1.4 Current holders of National Certificate (NC) in AUTOMOTIVE\nSERVICING NC II shall have their certificates renewed and\nconverted to the amended TR provided he/she has accumulated at\nleast 2 years (for the last five years) work experience, practicing the\ncompetencies prescribed in his/her certificate. A Certificate of\nEmployment and Job Description must be provided as proof.\nHe/she must be a holder of National Certificate in the amended\nAutomotive Servicing NC I.\n\n4.1.5 Current\nholders\nof\nCertificate\nof\nCompetency\n(COC)\nin\nAUTOMOTIVE SERVICING NC II, shall have to undergo\n\n--- PDF PAGE 136 ---\nTR-Automotive Servicing (Engine Repair) NC II Revision 01 Promulgated (08/11/2020) 132\nassessment in the amended Training Regulations upon expiration of\ntheir Certificates. He or she must be a holder of National Certificate\nin the amended Automotive Servicing NC I.\n\n4.1.6 Current holders of NTTC Level I in AUTOMOTIVE SERVICING NCII\nshall have their NCII converted to the amended TR provided that\nthey have forty-eight (48) hours industry immersion within the last\ntwo (2) years. He or she must be a holder of National Certificate in\nthe amended Automotive Servicing NC I.\n\n4.2.\nCOMPETENCY ASSESSMENT REQUISITE\n\n4.2.1 Self-Assessment Guide. The self-assessment guide (SAG) is\naccomplished by the candidate prior to actual competency\nassessment. SAG is a pre-assessment tool to help the candidate and\nthe assessor determine what evidence is available, where gaps exist,\nincluding readiness for assessment.\n\nThis document can:\na) Identify the candidate’s skills and knowledge\nb) Highlight gaps in candidate’s skills and knowledge\nc) Provide critical guidance to the assessor and candidate on the\nevidence that need to be presented\nd) Assist the candidate to identify key areas in which practice is\nneeded or additional information or skills that should be gained prior\nto assessment\n\n4.2.2 Accredited\nAssessment\nCenter.\nOnly\nAssessment\nCenter\naccredited by TESDA is authorized to conduct competency\nassessment. Assessment centers undergo a quality assured\nprocedure for accreditation before they are authorized by TESDA to\nmanage the assessment 