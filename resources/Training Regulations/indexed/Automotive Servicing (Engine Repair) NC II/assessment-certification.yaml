    {
      "number": "17",
      "text": "INTAKE MANIFOLD inlet manifold or intake manifold (in American English) is the part of an engine that supplies the fuel/air mixture to the cylinders. Designed to run on three timed components, air mixed fuel, spark, and combustion; the internal combustion engine relies upon the intake manifold to help it breathe. Featuring a series of tubes, the intake manifold ensures that the air coming into the engine is evenly distributed to all the cylinders."
    },
    {
      "number": "18",
      "text": "EXHAUST MANIFOLD The exhaust manifold is the first part of your vehicle’s exhaust system. It is connected to your vehicle’s engine and collects your engine’s emissions. The exhaust manifold receives the air/fuel mixture from the multiple cylinders in your vehicle’s engine. It collects the fuel/air mixture from each cylinder, whether you have four, six, or eight cylinders. Not only does the exhaust manifold receive all of the burnt engine gases, but also it completely burns any unused or incomplete burnt gases using its very high temperature. The manifold also houses the first oxygen sensor in your exhaust system to inspect the amount of oxygen entering the system."
    },
    {
      "number": "19",
      "text": "CYLINDER BLOCK also known as engine block , the cylinder block is one of your engine's central components. It plays a key role in the lubrication, temperature control and stability of the engine and it has to be of the highest quality so there is no room for short cuts. A typical cylinder block unit is made up of a number of cylinders, depending on the type and specification of the engine model being built, and it will include cylinder walls, coolant passages and cylinder sleeves. It maintains the engine's stability and lubrication while withstanding a variety of temperatures and loads. It also transfers oil to all parts of the engine, lubricating all the critical components, via a number of oil galleries."
    },
