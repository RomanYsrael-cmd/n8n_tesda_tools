      "source_text": "SECTION 3 TRAINING STANDARDS\n\nThese guidelines are set to provide the Technical and Vocational Education and\nTraining (TVET) providers with information and other important requirements to consider\nwhen designing training programs for Bartending NC II\n\nThey include information on curriculum design; training delivery; trainee entry\nrequirements; tools and equipment; training facilities; and trainer’s qualification, among\nothers.\n\n3.1\nCURRICULUM DESIGN\n\nCourse Title: BARTENDING\n\nNC Level: NC ll\n\nNominal Training Duration:\n 18 Hrs (Basic)\n\n 18 Hrs (Common)\n\n290 Hrs (Core)\n 112 Hrs (Elective)\n\nCourse Description:\n\nThis course is designed to enhance the knowledge, skills and attitude of a\nbartender/ barkeeper in cleaning bar areas, operating bar, preparing and mixing cocktails,\nnon alcoholic concoctions, hot drinks and provide wine service in accordance with industry\nstandards. It covers the basic, common and core competencies.\n\nBASIC COMPETENCIES\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Participate in\nworkplace\ncommunication\n\n1.1 Obtain and convey\nworkplace information\n1.2 Complete relevant\nwork related documents\n1.3 Participate in\nworkplace meeting and\ndiscussion\nGroup\nDiscussion\nInteraction\n\n• Demonstration\n• Observation\n• Interviews/\nQuestioning\n2. Work in a team\nenvironment\n2.1 Describe and identify\nteam role and\nresponsibility in a team\n2.2 Describe work as a\nteam member\nDiscussion\nInteraction\n\n• Demonstration\n• Observation\n• Interviews/\nQuestioning\n3. Practice career\nprofessionalism\n3.1 Integrate personal\nobjectives with\norganizational goals\n3.2 Set and meet work\npriorities\n3.3 Maintain professional\ngrowth and\ndevelopment\nDiscussion\nInteraction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n4. Practice\noccupational\nhealth and\nsafety\n4.1 Evaluate hazard and\nrisks\n4.2 Control hazards and\nrisks\n4.3 Maintain occupational\nhealth and safety\nawareness\nDiscussion\nPlant tour\nSymposium\n• Observation\n• Interview\n\n--- PDF PAGE 64 ---\nTR-Bartending NC II (Amended) Promulgated December 2013\n- 62-\nCOMMON COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Develop and\nupdate industry\nknowledge\n1.1\nSeek information on\nthe industry\n1.2\nUpdate continuously\nrelevant industry\nknowledge\n\nLecture\nGroup\nDiscussion\nIndividual/Group\nAssignment\n\nInterviews/\nQuestioning\nIndividual/Group\nProject or Report\n2. Observe\nworkplace\nhygiene\nprocedures\n2.1\nFollow hygiene\nprocedures\n2.2\nIdentify and prevent\nhygiene risk\n\nLecture\nDemonstration\nRole-play\nDemonstration\nWritten\nExamination\nInterviews/\nQuestioning\n3. Perform\ncomputer\noperations\n3.1\nPlan and prepare task\nto be undertaken\n3.2\nInput data into a\ncomputer\n3.3\nAssess information\nusing computer\n3.4\nProduce/ output data\nusing computer system\n3.5\nMaintain computer\nsystem\n\nLecture\nGroup\nDiscussion\nTutorial or self-\npace\n\nInterviews/\nQuestioning\nDemonstration\nObservation\n4. Perform\nworkplace and\nsafety practices\n1.1\nPractice workplace\nprocedures for\nhealth,safety and\nsecurity practices\n1.2\nDeal with emergency\nsituations\n1.3\nMaintain safe personal\npresentation standards\n\nLecture\nDemonstration\nRole-play\nSimulation\nDemonstration\nInterviews/\nQuestioning\nWritten\nExamination\n5. Provide\neffective\ncustomer\nservice\n1.1\nGreet customers\n1.2\nIdentify customer\nneeds\n1.3\nDeliver service to\ncustomer\n1.4\nHandle queries through\ntelephone, fax\nmachine, internet and\nemail\n1.5\nHandle complaints,\nevaluation and\nrecommendations\n\nLecture\nDemonstration\nRole-play\nSimulation\nDemonstration\nInterviews/\nQuestioning\nObservation\n\n--- PDF PAGE 65 ---\nTR-Bartending NC II (Amended) Promulgated December 2013\n- 63-\nCORE COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Clean Bar\nAreas\n1.1 Clean bar, equipment and\nTools\n1.2 Clean and maintain public\nareas\n\nDemonstration\nLecture\nDiscussion\nSelf-paced\ninstruction\nModular\nWritten\nexamination\nPractical\nDemonstration\nOral\nExamination\n2. Operate bar\n2.2 Prepare bar for service\n\nSelf-Pace\nInstruction\nModular\nDiscussion\nLecture\nDemonstration\nWritten\nexamination\nPractical\nDemonstration\nOral\nExamination\n2.3 Take drink orders\n2.4 Serve drinks\n2.5 Identify and deals customer\naffected with alcohol\n\nSelf-paced\ninstruction\nModular\nDiscussion\nLecture\nDemonstration\nRole Playing\nWritten\nexamination\nPractical\nDemonstration\nOral\nExamination\n\n2.6 Maintain proper bar\noperation control\nprocedures\n\nSelf-paced\ninstruction\nModular\nDiscussion\nLecture\nDemonstration\nWritten\nexamination\nPractical\nDemonstration\nOral\nExamination\n2.7 Close/turn over bar\noperations\nSelf-paced\ninstruction\nModular\nLecture\nDemonstration\nWritten\nexamination\nPractical\nDemonstration\nOral\nExamination\n3\nPrepare and\nmix cocktails\nand non-\nalcoholic\nconcoctions\n3.2 Prepare and mix a range of\ncocktails\n3.3 Prepare and mix a variety of\nnon-alcoholic concoctions\n\nSelf-paced\ninstruction\nModular\nLecture\nDemonstration\nFilm viewing\nWritten\nexamination\nPractical\nDemonstration\nOral\nExamination\n3.4 Use, clean and maintain bar\ntools, equipment and\nmachineries for mixing\ncocktails and non alcoholic\nconcoctions\nSelf-paced\ninstruction\nModular\nLecture\nDemonstration\nFilm viewing\nWritten\nexamination\nPractical\ndemonstration\n\n4\nProvide basic\nwine service\n4.2 Explain different types of\nwines to customer\n4.3 Recommend appropriate\nwine and food combinations\nto customers\nSelf-paced\ninstruction\nModular\nLecture\nDemonstration\nFilm viewing\nRole Play\nWritten\nexamination\nPractical\ndemonstration\nOral\nExamination\n4.4 Prepare wine glasses and\naccessories for service\n4.5 Open and serve wine\n4.6 Check wine for faults\nSelf-paced\ninstruction\nModular\nLecture\nDemonstration\nFilm viewing\nWritten\nexamination\nPractical\ndemonstration\nOral\nExamination\n\n--- PDF PAGE 66 ---\nTR-Bartending NC II (Amended) Promulgated December 2013\n- 64-\nELECTIVE COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Prepare\nespresso\n1.1 Set up and prepare\nmachine and equipment\n1.2 Dose and tamp coffee\n1.3. Extract espresso\nLecture/\ndiscussion\nDemonstration\nHands-on\nVideo viewing\nPicture/photos/\ndrawings\n\nWritten exercise/\nPractical test\nOral questioning\nObservation\n\n2. Texture milk\n2.1 Prepare milk and\nequipment\n2.2 Foam milk\n2.3 Texture milk\nLecture/\ndiscussion\nDemonstration\nHands-on/\nPractice\nsessions\nVideo viewing\nPicture/photos/\ndrawings\n\nPractical\ntest/simulation\nObservation\nOral questioning\nPortfolio\n\n3. Prepare and\nserve coffee\nbeverages\n3.1 Take orders of guests\n3.2 Prepare espresso based\nbeverages\n3.3 Prepare and serve\nbrewed coffee\nLecture/\ndiscussion\nDemonstration\nHands-on/\nPractice\nsessions\nVideo viewing\nPicture/photos/\ndrawings\n\nWritten test\nPractical\ntest/simulation\nObservation\nOral questioning\nPortfolio\n\n--- PDF PAGE 67 ---\nTR-Bartending NC II (Amended) Promulgated December 2013\n- 65-\n3.2\nTRAINING DELIVERY\n\nThe delivery of training should adhere to the design of the curriculum. Delivery\nshould be guided by the 10 basic principles of competency-based TVET.\n\n•\nThe training is based on curriculum developed from the competency standards;\n•\nLearning is modular in its structure;\n•\nTraining delivery is individualized and self-paced;\n•\nTraining is based on work that must be performed;\n•\nTraining materials are directly related to the competency standards and the\ncurriculum modules;\n•\nAssessment is based in the collection of evidence of the performance of work\nto the industry required standard;\n•\nTraining is based both on and off-the-job components;\n•\nAllows for recognition of prior learning (RPL) or current competencies;\n•\nTraining allows for multiple entry and exit; and\n•\nApproved training programs are Nationally Accredited\n\nThe competency-based TVET system recognizes various types of delivery\nmodes, both on and off-the-job as long as the learning is driven by the competency\nstandards specified by the industry. The following training modalities may be adopted\nwhen designing training programs:\n\n•\nThe dualized mode of training delivery is preferred and recommended. Thus\nprograms would contain both in-school and in-industry training or fieldwork\ncomponents. Details can be referred to the Dual Training System (DTS)\nImplementing Rules and Regulations.\n•\nModular/self-paced learning is a competency-based training modality wherein\nthe trainee is allowed to progress at his own pace. The trainer just facilitates\nthe training delivery.\n•\nPeer teaching/mentoring is a training modality wherein fast learners are given\nthe opportunity to assist the slow learners.\n•\nSupervised industry training or on-the-job training is an approach in training\ndesigned to enhance the knowledge and skills of the trainee through actual\nexperience in the workplace to acquire specific competencies prescribed in the\ntraining regulations.\n•\nDistance learning is a formal education process in which majority of the\ninstruction occurs when the students and instructor are not in the same place.\nDistance learning may employ correspondence study, audio, video or\ncomputer technologies.\n\n3.3\nTRAINEE ENTRY REQUIREMENTS\n\nTrainees or students who wish to enter training leading to these qualifications\nshould possess the following requirements:\n\n•\ncan communicate in basic English either oral and written\n•\nat least 10-year basic education graduate\n•\ncan perform basic mathematical computation\n\n--- PDF PAGE 68 ---\nTR-Bartending NC II (Amended) Promulgated December 2013\n- 66-\n3.4\nLIST OF TOOL, EQUIPMENT AND MATERIALS FOR BARTENDING NC II\