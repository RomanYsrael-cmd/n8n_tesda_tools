  "source_text": "COMPETENCY MAP - TOURISM Sector\n\n--- PDF PAGE 76 ---\nTR-Bartending NC II (Amended) Promulgated December 2013\n- 74-\n\n19.\nLONG OR TALL DRINK - is a mixed drinks that are served in tall glasses\n\n20.\nMENU - a list in specific order of the dishes to be served at a given meal\n\n21.\nMISE EN PLACE - French term for “put in place” having all ingredients in ready to\nuse. Preparation before service\n\n22.\nPRE-DINNER - short mixed drinks that are basically dry in taste and are usually\nserved before a meal to wet the appetite\n\n23.\nSPIRITS - are drinks obtained by distillation after fermentation from vegetables,\ngrains, fruits, plants and other substance with sugar or starch-based\n\n24.\nSILVERWARE - tableware made of solid silver, silver gilt or silver metal. Silver\nplate made from single strip of plated metal\n\n25. TABLE NAPKIN - an individual piece of linen which is used to protect the clothing\nor wipe the mouth during a meal\n\nOther Terms Used:\n\n• Captain Waiter – Chef de Etage\n• Chef – a person who prepares food as an occupation in restaurant,\nprivate house, hotel\n• Dining Room Attendant – Commis de Rang (busboy)\n• Director of Service – Chef de Service\n• Head Waiter – Chef de Salle\n• Waiter – Chef de Rang/Demi Chef de Rang\n• Wine Steward – Chef de Vin/Sommelier/Wine waiter\n• Bar Keeper – Bartender, Barman\n\n--- PDF PAGE 77 ---",
