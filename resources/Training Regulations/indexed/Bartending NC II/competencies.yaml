        "evidence_guide": {
          "source_text": "1. Critical aspects of\nCompetency\nAssessment requires evidences that the candidate:\n1.1\nApplied workplace operations and procedures\n1.2\nMaintained the cleanliness and tidiness of bar area\n1.3\nPerformed bar cleaning procedures safely and\nhygienically\n\n2. Required Knowledge\n2.1\nTrade theory\n2.1.1 Knowledge on bar operations\n2.1.2 Logical and efficient work flow\n2.2\nSafety\n2.2.1 Safe work practices and first aid regulations\n2.2.2 Hygienic and sanitary practices specific on bar\noperations\n2.2.3 Health Act related to basic hygiene\nrequirements in bar area\n\n3. Required Skills\n3.1\nCommunication skills\n3.2\nUse of cleaning equipment and chemicals\n3.3\nBar tools and equipment operations including glass\nwasher and coffee maker\n3.4\nTime management skills\n\n4. Resource Implications The following resources should be provided:\n4.1\nWorkplace location\n4.2\nAccess to a range of bar cleaning equipment , tools and\nmaterials / chemicals\n4.3\nAccess to a fully equipped bar including current industry\nequipment and tools\n\n5. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n5.1\nDemonstration of the proper operation of the appropriate\ncleaning equipment\n5.2\nWritten or oral questions to test knowledge on proper\nhygiene and procedures in maintaining cleanliness of\nthe bar\n5.3\nReview of portfolios of evidence relevant to legislation\nand OH&S issues and third-party reports to evaluate on-\nthe-job and/or workplace performance by the candidate\n\n6. Context of\nAssessment\n\n6.1\nFully-equipped workplace or simulated environment\nwith current bar tools, equipment and materials /\nproducts (assessment centers)\n6.2\nTESDA accredited assessment center/venue with expert\nand accredited assessor.\n\n--- PDF PAGE 34 ---\nTESDA-SOP-QSO-01-F08\n\nTR-Bartending NC II (Amended) Promulgated December 2013\n- 32-\nUNIT OF COMPETENCY\n:\nOPERATE BAR\n\nUNIT CODE\n:"
        },
        "source_text": "TRS512395\n\nUNIT DESCRIPTOR\n:\nThis unit deals with the knowledge, skills and attitude\nrequired to provide general assistance in maintaining\ncleanliness of bar area, related equipment and tools. It\nreflects the role of a “bartender” and/or a bar utility/back\nand may be part of the role of a bar attendant.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Clean bar, equipment\nand tools\n1.1\nBar surfaces, equipment and tools are cleaned in\naccordance with industry standard and hygiene\nregulations\n1.2\nWorking condition of equipment is checked in\naccordance with manufacturer’s manual and instructions\n1.3\nCondition of utensils and glassware is checked for dirt\nand damages\n1.4\nBroken, cracked items and other waste are safely\ndisposed in accordance with environmental\nconsiderations\n1.5\nReports are prepared in accordance with\nestablishments policy procedures\n1.6\n“Closing up” procedures of glassware and other\nequipment are accomplished based on enterprise\nstandards\n\n2. Clean and maintain\npublic areas\n2.1\nIdentified public areas are promptly cleaned and\nmaintained in accordance with industry and/or\nenterprise standards\n2.2\nEmpty and unwanted glasses are removed on a regular\nbasis with minimum disruption to customers\n2.3\nTables and service counter are cleaned hygienically in\naccordance with enterprise requirements and standards\n2.4\nAdherence to customer service is maintained in\naccordance with industry and/or enterprise standards\n\n--- PDF PAGE 32 ---\nTESDA-SOP-QSO-01-F08\n\nTR-Bartending NC II (Amended) Promulgated December 2013\n- 30-\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Bar surfaces,\nequipment and tools\nMay include:\n1.1\nservice counters\n1.2\nservice stations\n1.3\nback bar mirrors\n1.4\ndisplay counter / shelves\n1.5\nflooring\n1.6\nbeverage storages\n1.7\npost mix service points\n1.8\nrefrigeration equipment\n1.9\nglass washers\n1.10 glass racks\n1.11 ice maker\n1.12 ice bin\n1.13 trash bin\n1.14 blenders\n1.15 fruit juicers / extractors\n1.16 coffee machines\n1.17 glassware\n1.18 food containers for garnishes, chips\n1.19 bar tools\n1.20 utensils\n1.20.1 cutleries\n1.20.2 cups and saucers\n\n2. Reports\nMay include:\n2.1\nMaterials inventory\n2.2\nBreakage report\n2.3\nDamage report\n2.4\nMaintenance report\n\n3. Public areas\nMay include:\n3.1\nbar areas\n3.2\nrestaurant areas\n3.3\nfunction areas\n3.4\ngaming areas\n\n--- PDF PAGE 33 ---\nTESDA-SOP-QSO-01-F08\n\nTR-Bartending NC II (Amended) Promulgated December 2013\n- 31-\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidences that the candidate:\n1.1\nApplied workplace operations and procedures\n1.2\nMaintained the cleanliness and tidiness of bar area\n1.3\nPerformed bar cleaning procedures safely and\nhygienically\n\n2. Required Knowledge\n2.1\nTrade theory\n2.1.1 Knowledge on bar operations\n2.1.2 Logical and efficient work flow\n2.2\nSafety\n2.2.1 Safe work practices and first aid regulations\n2.2.2 Hygienic and sanitary practices specific on bar\noperations\n2.2.3 Health Act related to basic hygiene\nrequirements in bar area\n\n3. Required Skills\n3.1\nCommunication skills\n3.2\nUse of cleaning equipment and chemicals\n3.3\nBar tools and equipment operations including glass\nwasher and coffee maker\n3.4\nTime management skills\n\n4. Resource Implications The following resources should be provided:\n4.1\nWorkplace location\n4.2\nAccess to a range of bar cleaning equipment , tools and\nmaterials / chemicals\n4.3\nAccess to a fully equipped bar including current industry\nequipment and tools\n\n5. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n5.1\nDemonstration of the proper operation of the appropriate\ncleaning equipment\n5.2\nWritten or oral questions to test knowledge on proper\nhygiene and procedures in maintaining cleanliness of\nthe bar\n5.3\nReview of portfolios of evidence relevant to legislation\nand OH&S issues and third-party reports to evaluate on-\nthe-job and/or workplace performance by the candidate\n\n6. Context of\nAssessment\n\n6.1\nFully-equipped workplace or simulated environment\nwith current bar tools, equipment and materials /\nproducts (assessment centers)\n6.2\nTESDA accredited assessment center/venue with expert\nand accredited assessor.\n\n--- PDF PAGE 34 ---\nTESDA-SOP-QSO-01-F08\n\nTR-Bartending NC II (Amended) Promulgated December 2013\n- 32-\nUNIT OF COMPETENCY\n:\nOPERATE BAR\n\nUNIT CODE\n:"
