g \npitcher etc.) \n4.5 \nMilk \n4.6 \nChiller/ref or ice box with ice \n \n5. Methods of \nAssessment     \n \nCompetency in this unit may be assessed through : \n5.1 \nWritten and/or oral questions to test candidate’s \nknowledge on the step by step procedure of steaming \nmilk; chemistry or composition of milk; its effect on the \ntexture and sweetness of the steamed milk etc. \n5.2 \nPractical/Demonstration on steaming milk \n \n6. Context of \nAssessment \nAssessment must be conducted in  \n6.1 \nWorkplace or simulated environment or \n6.2 \nTESDA accredited assessment center/venue\n",
