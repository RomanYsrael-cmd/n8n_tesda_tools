  "source_section_text": "Section 1.\nSuccessful candidates shall be awarded a National Certificate signed by the\nTESDA Director General.\n\n4.2\nThe qualification of BARTENDING NC II may be attained through demonstration of\ncompetence covering all the required core units of qualification.\n\n4.3 Assessment shall focus on the core units of competency. The basic and common\nunits shall be integrated or assessed concurrently with the core units.\n\n4.4 The following are qualified to apply for assessment and certification:\n\n4.4.1 Graduates of formal, non-formal and informal including enterprise- based\ntraining programs\n 4.4.2 Experienced workers (wage employed or self employed)\n\n4.5 The guidelines on assessment and certification are discussed in detail in the\n\"Procedures Manual on Assessment and Certification\" and \"Guidelines on the\nImplementation of the Philippine TVET Qualification and Certification System\n(PTQCS)\".\n\n--- PDF PAGE 74 ---\nTR-Bartending NC II (Amended) Promulgated December 2013\n- 72-\n\n--- PDF PAGE 75 ---\nTR-Bartending NC II (Amended) Promulgated December 2013\n- 73-\nDEFINITION OF TERMS\n\n1.\nAPERITIF - is any drink taken before meals, to improve your appetite\n\n2.\nAFTER DINNER DRINK (COCKTAIL) - a mixed drinks that are basically\nsweet and/or creamy in taste and are usually served after a meal\n\n3.\nBREWING - a stage in making beer in which worth is boiled with hops\n\n4.\nBUSBOY - refers to the dining room helper and runner, title given to a Food\nand Beverage Service Attendant, National Certificate I\n\n5.\nBUSSED OUT - taking out soiled plates/dishes from the dining area to\ndishwashing area\n\n6.\nCAPTAIN FOOD AND BEVERAGE SERVICE ATTENDANT - refers to the\nsupervisor of The Food and Beverage Service Attendant, also refers to Food and\nBeverage Service Attendant, National Certificate Level I.\n\n7.\nCOCKTAIL - is a well-mixed drink made up of base liquor, a modifying ingredient\nas a modifier and special flavoring of coloring agents. It is usually an aperitif taken\nat leisure before a meal to whet the appetite.\n\n8.\nCOMMIS - refers to the category according to the extent of difficulty and complexity\nof skills and knowledge required for the job.\n\n9.\nCOMMUNICATION - the transfer of ideas through verbal and non-verbal\ncommunication\n\n10.\nCORDIAL/ LIQUEUR - a spirits that are sweetened and flavor with natural flavor’s\n\n11.\nDISH OUT - food taken from the kitchen to the dining area\n\n12.\nDISTILLATION - a process involving continuous evaporation and condensation of\nliquid wherein higher alcohol content could be obtained\n\n13.\nFERMENTATION - an action of yeast upon a sugar in solution, which breaks\ndown the sugar into carbon dioxide and alcohol\n\n14.\nFLAMBE’ - flamed with spirit or liqueur\n\n15.\nFOOD AND BEVERAGE SERVICE ATTENDANT - refers to the workers assigned\nin the service of food and beverage to the guests, also known as waiter.\n\n16.\nGARNISH - an ingredient which decorates, accompanies or completes a dish.\nMany dishes are identified by the name of their garnishes\n\n17.\nHIGHBALL DRINK - is a tall drink consisting of a shot of specified spirit with mixers\nsuch as sodas, water, etc. serve with cube ice in a highball glass\n\n18.\nLEVEL / CLASS - refers to the category according to the extent of difficulty and\ncomplexity of skills and knowledge required of the jobs.\nCOMPETENCY MAP - TOURISM Sector\n\n--- PDF PAGE 76 ---\nTR-Bartending NC II (Amended) Promulgated December 2013\n- 74-\n\n19.\nLONG OR TALL DRINK - is a mixed drinks that are served in tall glasses\n\n20.\nMENU - a list in specific order of the dishes to be served at a given meal\n\n21.\nMISE EN PLACE - French term for “put in place” having all ingredients in ready to\nuse. Preparation before service\n\n22.\nPRE-DINNER - short mixed drinks that are basically dry in taste and are usually\nserved before a meal to wet the appetite\n\n23.\nSPIRITS - are drinks obtained by distillation after fermentation from vegetables,\ngrains, fruits, plants and other substance with sugar or starch-based\n\n24.\nSILVERWARE - tableware made of solid silver, silver gilt or silver metal. Silver\nplate made from single strip of plated metal\n\n25. TABLE NAPKIN - an individual piece of linen which is used to protect the clothing\nor wipe the mouth during a meal\n\nOther Terms Used:\n\n• Captain Waiter – Chef de Etage\n• Chef – a person who prepares food as an occupation in restaurant,\nprivate house, hotel\n• Dining Room Attendant – Commis de Rang (busboy)\n• Director of Service – Chef de Service\n• Head Waiter – Chef de Salle\n• Waiter – Chef de Rang/Demi Chef de Rang\n• Wine Steward – Chef de Vin/Sommelier/Wine waiter\n• Bar Keeper – Bartender, Barman\n\n--- PDF PAGE 77 ---\nACKNOWLEDGEMENTS\n\nThe Technical Education and Skills Development Authority (TESDA) wishes to extend\nthanks and appreciation to the many representatives of business, industry, academe and\ngovernment agencies who donated their time and expertise to the development and validation of\nthese Training Regulations.\n\nINDUSTRY EXPERTS\n\nReview Panel (2011- 2012)\n\nLILIBETH C. ARAGON\nChairperson, Bartending/\n Food and Beverage\nLyceum of the Philippines University (LPU)\n\nCELSO V. CONCEPCION, JR.\nBar Supervisor\nCandy Shop Superclub\nMember, Philippine Bartenders’ League (PBL)\nMA. CHRISTINA G. AQUINO\nCHED Technical Panel Member for\n Tourism\nPresident, Council of Hotel and\nRestaurant Educators of the Philippines\n(COHREP)\nLyceum of the Philippines University\n(LPU)\n\nRICO A. MANLANGIT\nCo-Chairman\nPhilippine Bartenders’ League (PBL)\n\nANABELLE OCHOA-MORENO\nMember\nAssociation of Human Resource Managers (AHRM)\n for Hospitality Industry\nFLORENTINO”MUTLEY” MATILLA, JR.\nNational President\nPhilippine Bartenders’ League (PBL)\n\nRICHARD P. SULLANO\nFood and Beverage Supervisor (Bar)\nMaxim Hotel\nChair, Technical Working Group (TWG)\nTourism Industry Board Foundation, Inc. (TIBFI)\n\nMA. CRISTINA Q. TRINIDAD\nChairperson\nHospitality Management Department\n Polytechnic University of the Philippines\n (PUP)\n\nDANIEL L. EDRALIN\nBoard Member\nTourism Industry Board Foundation, Inc.\n (TIBFI)\n\nNational Union of Workers in Hotels and\n Restaurant and Allied Industries\n (NEWHRAIN-APL)\n\nThe Participants in the Validation of these Training Regulations\n\nThe Members of the TESDA Board and Secretariat\n\nThe Management and Staff of the TESDA Secretariat\n• Qualifications and Standards Office (QSO)"
