        "source_title": "PARTICIPATE IN WORKPLACE COMMUNICATION",
        "source_text": "--- PDF PAGE 4 ---\nTR-Bartending NC II (Amended)                                            Promulgated   December 2013 \n- 2- \n \nSECTION 2 \nCOMPETENCY STANDARDS \n \nThis section gives the details of the contents of the basic, common and core units of \ncompetency required in BARTENDING NC II. \n \nBASIC COMPETENCIES \n \nUNIT OF COMPETENCY : \nPARTICIPATE IN WORKPLACE COMMUNICATION \n \nUNIT CODE \n: \n500311105 \n \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge, skills and attitudes   \nrequired to gather, interpret and convey information in \nresponse to workplace requirements. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1. Obtain and convey \nworkplace information \n1.1 Specific and  relevant information is accessed from \nappropriate sources  \n1.2 Effective questioning , active listening and speaking skills \nare used to gather and convey information \n1.3 Appropriate medium is used to transfer information and \nideas \n1.4 Appropriate non- verbal communication is used \n1.5 Appropriate lines of communication with supervisors and \ncolleagues are identified and followed \n1.6 Defined workplace procedures for the location and \nstorage of information are used \n1.7 Personal interaction is carried out clearly and concisely \n \n2. Participate in \nworkplace meetings \nand discussions \n2.1 Team meetings are attended on time \n2.2 Own opinions are clearly expressed and those of others \nare listened to without interruption \n2.3 Meeting inputs are consistent with the meeting purpose \nand established protocols \n2.4 Workplace interactions are conducted in a courteous \nmanner  \n2.5 Questions about simple routine workplace procedures \nand maters concerning working conditions of \nemployment are asked and responded to \n2.6 Meetings outcomes are interpreted and implemented \n \n3. Complete relevant \nwork related \ndocuments \n3.1 Range of forms relating to conditions of employment are \ncompleted accurately and legibly \n3.2 Workplace data is recorded on standard workplace forms \nand documents \n3.3 Basic mathematical processes are used for routine \ncalculations \n3.4 Errors in recording information on forms/ documents are \nidentified and properly acted upon \n3.5 Reporting requirements to supervisor are completed \naccording to organizational guidelines\n\n--- PDF PAGE 5 ---\nTR-Bartending NC II (Amended)                                            Promulgated   December 2013 \n- 3- \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Appropriate sources \n1.1 \nTeam members \n1.2 \nSuppliers \n1.3 \nTrade personnel \n1.4 \nLocal government \n1.5 \nIndustry bodies \n \n2. Medium \n2.1 \nMemorandum \n2.2 \nCircular \n2.3 \nNotice \n2.4 \nInformation discussion \n2.5 \nFollow-up or verbal  instructions \n2.6 \nFace to face communication \n \n3. Storage \n3.1 \nManual filing system \n3.2 \nComputer-based filing system \n \n4. Forms \n4.1 \nPersonnel forms, telephone message forms, safety \nreports \n \n5. Workplace \ninteractions \n5.1 \nFace to face \n5.2 \nTelephone \n5.3 \nElectronic and two way radio \n5.4 \nWritten including electronic, memos, instruction and \nforms, non-verbal including gestures, signals, signs and \ndiagrams \n \n6. Protocols \n6.1 \nObserving meeting \n6.2 \nCompliance with meeting decisions \n6.3 \nObeying meeting instructions\n\n--- PDF PAGE 6 ---\nTR-Bartending NC II (Amended)                                            Promulgated   December 2013 \n- 4- \nEVIDENCE GUIDE \n \n1. Critical aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 \nPrepared written communication following standard \nformat of the organization \n1.2 \nAccessed information using communication equipment \n1.3 \nMade use of relevant terms as an aid to transfer \ninformation effectively \n1.4 \nConveyed information effectively adopting the formal or \ninformal communication \n \n2. Required knowledge \n \n2.1 \nEffective communication \n2.2 \nDifferent modes of communication  \n2.3 \nWritten communication \n2.4 \nOrganizational policies \n2.5 \nCommunication procedures and systems \n2.6 \nTechnology relevant to the enterprise and the \nindividual’s work responsibilities \n \n3. Required Skills \n3.1 \nFollow simple spoken language \n3.2 \nPerform routine workplace duties following simple \nwritten notices \n3.3 \nParticipate in workplace meetings and discussions \n3.4 \nComplete work related documents \n3.5 \nEstimate, calculate and record routine workplace \nmeasures \n3.6 \nBasic mathematical processes of addition, subtraction, \ndivision and multiplication \n3.7 \nAbility to relate to people of social range in the \nworkplace \n3.8 \nGather and provide information in response to \nworkplace requirements \n \n4. Resource \nImplications \n4.1 \nFax machine \n4.2 \nTelephone \n4.3 \nWriting materials \n4.4 \nInternet \n \n5. Methods of \nAssessment \n5.1 \nDirect Observation \n5.2 \nOral interview and written test \n \n6. Context of \nAssessment \n6.1 \nCompetency may be assessed individually in the actual \nworkplace or through accredited institution\n",
