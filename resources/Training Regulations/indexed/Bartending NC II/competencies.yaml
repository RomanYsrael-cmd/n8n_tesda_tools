          "source_text": "1.  Follow hygiene \nprocedures \n1.1 \nWorkplace hygiene procedures are implemented in \nline with enterprise and legal requirements \n1.2 \nHandling and storage of items are undertaken in line \nwith enterprise and legal requirements \n2.  Identify and prevent \nhygiene risks \n2.1 \nPotential hygiene risks are identified in line with \nenterprise procedures \n2.2 \nAction to minimize  and remove risks are taken within \nscope of individual responsibility of enterprise/legal \nrequirements  \n2.3 \nHygiene risks beyond the control of individual staff \nmembers are reported to the appropriate person for \nfollow up\n\n--- PDF PAGE 20 ---\nTESDA-SOP-QSO-01-F08 \n \nTR-Bartending NC II (Amended)                                            Promulgated   December 2013 \n- 18- \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.  Hygiene procedures \nMay include : \n1.1 \nsafe and hygienic handling of food and beverage \n1.2 \nregular hand washing \n1.3 \ncorrect food storage \n1.4 \nappropriate and clean clothing \n1.5 \navoidance of cross-contamination \n1.6 \nsafe handling disposal of linen and laundry \n1.7 \nappropriate handling and disposal of garbage \n1.8 \ncleaning and sanitizing procedures \n1.9 \npersonal hygiene \n \n2.  Hygiene risk \nMay include: \n2.1 \nbacterial and other contamination arising from poor \nhandling of food \n2.2 \ninappropriate storage of foods \n2.3 \nstorage at incorrect temperatures \n2.4 \nfoods left uncovered \n2.5 \npoor personal hygiene practices \n2.6 \npoor work practices \n2.6.1 cleaning \n2.6.2 housekeeping \n2.6.3 food handling \n2.6.4 vermin \n2.6.5 airborne dust \n2.7 \ncross-contamination through cleaning inappropriate \ncleaning practices \n2.8 \ninappropriate handling of potentially infectious linen \n2.9 \ncontaminated wastes such as blood and body \nsecretions \n2.10 disposal of garbage and contaminated or potentially \ncontaminated wastes \n \n3.  Minimizing or \nremoving risk \nMay include: \n3.1 \nauditing staff skills and providing training \n3.2 \nensuring policies and procedures are followed strictly \n3.3 \naudits or incidents with follow up actions\n\n--- PDF PAGE 21 ---\nTESDA-SOP-QSO-01-F08 \n \nTR-Bartending NC II (Amended)                                            Promulgated   December 2013 \n- 19-"
