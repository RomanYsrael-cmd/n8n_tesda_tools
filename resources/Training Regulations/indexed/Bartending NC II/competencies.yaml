ter\n\n--- PDF PAGE 28 ---\nTESDA-SOP-QSO-01-F08\n\nTR-Bartending NC II (Amended) Promulgated December 2013\n- 26-\nUNIT OF COMPETENCY :\nPROVIDE EFFECTIVE CUSTOMER SERVICE\n\nUNIT CODE\n:\nTRS311205\n\nUNIT DESCRIPTOR\n:\nThis unit of competency deals with the knowledge, skills\nand attitudes in providing effective customer service. It\nincludes greeting customer, identifying customer needs,\ndelivering service to customer, handling queries through\ntelephone, fax machine, internet and email and handling\ncomplaints, evaluation and recommendation.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized items are elaborated in the Range of Variables\n1. Greet customer\n1.1\nGuests are greeted in line with enterprise procedure\n1.2\nVerbal and non-verbal communications are appropriate\nto the given situation\n1.3\nNon verbal communication of customer is observed\nresponding to customer\n1.4\nSensitivity to cultural and social differences is\ndemonstrated\n\n2. Identify customer\nneeds\n2.1\nAppropriate interpersonal skills are used to ensure\nthat customer needs are accurately identified\n2.2\nCustomer needs are assessed for urgency so that\npriority for service delivery can be identified\n2.3\nCustomers are provided with information\n2.4\nPersonal limitation in addressing customer needs is\nidentified and where appropriate, assistance is sought\nfrom supervisor\n\n3. Deliver service to\ncustomer\n3.1\nCustomer needs are promptly attended to in line with\nenterprise procedure\n3.2\nAppropriate rapport is maintained with customer to\nenable high quality service delivery\n3.3\nOpportunity to enhance the quality of service and\nproducts are taken wherever possible\n\n4. Handle queries\nthrough telephone, fax\nmachine, internet and\nemail\n4.1\nUse telephone, computer, fax machine, internet\nefficiently to determine customer requirements\n4.2\nQueries/ information are recorded in line with enterprise\nprocedure\n4.3\nQueries are acted upon promptly and correctly in line\nwith enterprise procedure\n\n5. Handle complaints,\nevaluation and\nrecommendations\n5.1\nGuests are greeted with a smile and eye-to-eye contact\n5.2\nResponsibility for resolving the complaint is taken within\nlimit of responsibility\n5.3\nNature and details of complaint are established and\nagreed with the customer\n5.4\nAppropriate action is taken to resolve the complaint to\nthe customers satisfaction wherever possible\n\n--- PDF PAGE 29 ---\nTESDA-SOP-QSO-01-F08\n\nTR-Bartending NC II (Amended) Promulgated December 2013\n- 27-\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Non-verbal\ncommunication\nMay include:\n1.1\nbody language\n1.2\ndress and accessories\n1.3\ngestures and mannerisms\n1.4\nvoice tonality and volume\n1.5\nuse of space\n1.6\nculturally specific communication customs and practices\n\n2. Cultural and social\ndifferences\nMay include:\n2.1\nmodes of greeting, farewelling and conversation\n2.2\nbody language/ use of body gestures\n2.3\nformality of language\n\n3. Interpersonal skills\nMay include:\n3.1\ninteractive communication\n3.2\npublic relation\n3.3\ngood working attitude\n3.4\nsincerity\n3.5\npleasant disposition\n3.6\neffective communication skills\n\n4. Customer needs\nMay include :\n4.1\nthose with a disability\n4.2\nthose with special cultural or language needs\n4.3\nunaccompanied children\n4.4\nparents with young children\n4.5\npregnant women\n4.6\nsingle women\n\n5. Enterprise procedure\nMay include :\n5.1\nmodes of greeting and farewell\n5.2\naddressing the person by name\n5.3\ntime-lapse before a response\n5.4\nstyle manual requirements\n5.5\nstandard letters and proforma\n\n--- PDF PAGE 30 ---\nTESDA-SOP-QSO-01-F08\n\nTR-Bartending NC II (Amended) Promulgated December 2013\n- 28-\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate :\n1.1\nComplied with industry practices and procedures\n1.2\nUsed interactive communication with others\n1.3\nComplied with occupational, health and safety practices\n1.4\nPromoted public relation among others\n1.5\nComplied with service manual standards\n1.6\nDemonstrated familiarity with company facilities,\nproducts and services\n1.7\nApplied company rules and standards\n1.8\nApplied telephone ethics\n1.9\nApplied correct procedure in using telephone, fax\nmachine, internet\n1.10 Handled customer complaints\n\n2. Required Knowledge\nand Attitude\n2.1\nCommunication\n2.1.1 Interactive communication with others\n2.1.2 Interpersonal skills/ social graces with\nsincerity\n2.2\nSafety Practices\n2.2.1 Safe work practices\n2.2.2 Personal hygiene\n2.3\nAttitude\n2.3.1 Attentive, patient and cordial\n2.3.2 Eye-to-eye contact\n2.3.3 Maintain teamwork and cooperation\n2.4\nTheory\n2.4.1 Selling/upselling techniques\n2.4.2 Interview techniques\n2.4.3 Conflict resolution\n2.4.4 Communication process\n2.4.5 Communication barriers\n\n3. Required Skills\n3.1\nEffective communication skills\n3.2\nNon-verbal communication - body language\n3.3\nGood time management\n3.4\nAbility to work calmly and unobtrusively effectively\n3.5\nAbility to handle telephone inquiries and conversations\n3.6\nCorrect procedure in handling telephone inquiries\n3.7\nProper way of handling complaints\n\n4. Resource Implications The following resources should be provided:\n4.1\nAvailability of telephone, fax machine, internet, etc.\n4.2\nAvailability of data on projects and services; tariff and\nrates, promotional activities in place etc.\n4.3\nAvailability of office supplies\n\n5. Methods of\nAssessment\nCompetency in this unit must be assessed through:\n5.1\nWritten examination\n5.2\nPractical demonstration\n\n6. Context for\nAssessment\n6.1\nAssessment may be done in the workplace or in a\nsimulated workplace setting (assessment centers)\n6.2\nAssessment activities are carried out through TESDA's\naccredited assessment center\n\n--- PDF PAGE 31 ---\nTESDA-SOP-QSO-01-F08\n\nTR-Bartending NC II (Amended) Promulgated December 2013\n- 29-\nCORE COMPETENCIES\n\nUNIT OF COMPETENCY :\nCLEAN BAR AREAS\n\nUNIT CODE\n:\nTRS512395\n\nUNIT DESCRIPTOR\n:\nThis unit deals with the knowledge, skills and attitude\nrequired to provide general assistance in maintaining\ncleanliness of bar area, related equipment and tools. It\nreflects the role of a “bartender” and/or a bar utility/back\nand may be part of the role of a bar attendant.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Clean bar, equipment\nand tools\n1.1\nBar surfaces, equipment and tools are cleaned in\naccordance with industry standard and hygiene\nregulations\n1.2\nWorking condition of equipment is checked in\naccordance with manufacturer’s manual and instructions\n1.3\nCondition of utensils and glassware is checked for dirt\nand damages\n1.4\nBroken, cracked items and other waste are safely\ndisposed in accordance with environmental\nconsiderations\n1.5\nReports are prepared in accordance with\nestablishments policy procedures\n1.6\n“Closing up” procedures of glassware and other\nequipment are accomplished based on enterprise\nstandards\n\n2. Clean and maintain\npublic areas\n2.1\nIdentified public areas are promptly cleaned and\nmaintained in accordance with industry and/or\nenterprise standards\n2.2\nEmpty and unwanted glasses are removed on a regular\nbasis with minimum disruption to customers\n2.3\nTables and service counter are cleaned hygienically in\naccordance with enterprise requirements and standards\n2.4\nAdherence to customer service is maintained in\naccordance with industry and/or enterprise standards\n\n--- PDF PAGE 32 ---\nTESDA-SOP-QSO-01-F08\n\nTR-Bartending NC II (Amended) Promulgated December 2013\n- 30-\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Bar surfaces,\nequipment and tools\nMay include:\n1.1\nservice counters\n1.2\nservice stations\n1.3\nback bar mirrors\n1.4\ndisplay counter / shelves\n1.5\nflooring\n1.6\nbeverage storages\n1.7\npost mix service points\n1.8\nrefrigeration equipment\n1.9\nglass washers\n1.10 glass racks\n1.11 ice maker\n1.12 ice bin\n1.13 trash bin\n1.14 blenders\n1.15 fruit juicers / extractors\n1.16 coffee machines\n1.17 glassware\n1.18 food containers for garnishes, chips\n1.19 bar tools\n1.20 utensils\n1.20.1 cutleries\n1.20.2 cups and saucers\n\n2. Reports\nMay include:\n2.1\nMaterials inventory\n2.2\nBreakage report\n2.3\nDamage report\n2.4\nMaintenance report\n\n3. Public areas\nMay include:\n3.1\nbar areas\n3.2\nrestaurant areas\n3.3\nfunction areas\n3.4\ngaming areas\n\n--- PDF PAGE 33 ---\nTESDA-SOP-QSO-01-F08\n\nTR-Bartending NC II (Amended) Promulgated December 2013\n- 31-\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidences that the candidate:\n1.1\nApplied workplace operations and procedures\n1.2\nMaintained the cleanliness and tidiness of bar area\n1.3\nPerformed bar cleaning procedures safely and\nhygienically\n\n2. Required Knowledge\n2.1\nTrade theory\n2.1.1 Knowledge on bar operations\n2.1.2 Logical and efficient work flow\n2.2\nSafety\n2.2.1 Safe work practices and first aid regulations\n2.2.2 Hygienic and sanitary practices specific on bar\noperations\n2.2.3 Health Act related to basic hygiene\nrequirements in bar area\n\n3. Required Skills\n3.1\nCommunication skills\n3.2\nUse of cleaning equipment and chemicals\n3.3\nBar tools and equipment operations including glass\nwasher and coffee maker\n3.4\nTime management skills\n\n4. Resource Implications The following resources should be provided:\n4.1\nWorkplace location\n4.2\nAccess to a range of bar cleaning equipment , tools and\nmaterials / chemicals\n4.3\nAccess to a fully equipped bar including current industry\nequipment and tools\n\n5. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n5.1\nDemonstration of the proper operation of the appropriate\ncleaning equipment\n5.2\nWritten or oral questions to test knowledge on proper\nhygiene and procedures in maintaining cleanliness of\nthe bar\n5.3\nReview of portfolios of evidence relevant to legislation\nand OH&S issues and third-party reports to evaluate on-\nthe-job and/or workplace performance by the candidate\n\n6. Context of\nAssessment\n\n6.1\nFully-equipped workplace or simulated environment\nwith current bar tools, equipment and materials /\nproducts (assessment centers)\n6.2\nTESDA accredited assessment center/venue with expert\nand accredited assessor.\n\n--- PDF PAGE 34 ---\nTESDA-SOP-QSO-01-F08\n\nTR-Bartending NC II (Amended) Promulgated December 2013\n- 32-\nUNIT OF COMPETENCY\n:\nOPERATE BAR\n\nUNIT CODE\n:\nTRS512396\n\nUNIT DESCRIPTOR\n:\nThis unit covers the skills and knowledge required to\ncarry out bar operations. It includes preparing bar for\nservice, taking drink orders, serving drinks, maintaining\nbar control procedures, closing the bar and dealing with\nintoxicated persons in all Food and Beverage Service\n\nproviders, except for “Specialty Coffee Shops”.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Prepare bar for\nservice\n\n1.1\nBasic parts of the bar are identified according to\nservice operation requirements.\n1.2\nBar display and work area are set up in accordance\nwith industry and/or enterprise requirements and bar\nservice style\n1.3\nBar products and materials are checked and re-\nstocked in accordance with industry and/or enterprise\npolicy and procedures\n1.4\nAll obtained items are stored in accordance with\nestablished storing procedures and techniques\n1.5\nSuitable kinds of decorations, coasters, edible and\nnon-edible garnishes are prepared in accordance with\nindustry and/or enterprise requirements\n1.6\nAppropriate ice supplies are prepared in accordance\nwith enterprise volume requirement for a days’\noperation.\n1.7\nNecessary Bar tools, equipment and utensils are\nchecked and ready for service operation.\n\n2. Take drink orders\n2.1\nProduct and brand preferences are checked with the\ncustomer courteously\n2.2\nSelection of drinks are politely recommended to\ncustomer in accordance with enterprise policy and\nprocedures\n2.3\nSpecific customer preferences are identified in\naccordance with orders taken\n2.4\nCustomer’s order are promptly recapped in accordance\nenterprise service standard policy\n\n3. Serve drinks\n3.1\nOrdered drinks are promptly and courteously served, in\naccordance with customer preferences, using required\nglassware and garnishes\n3.2\nAlcoholic and non-alcoholic beverages are served\naccording to customer preferences\n3.3\nWaste and spillage are avoided\n3.4\nBeverage quality is checked during service and\ncorrections are made if necessary\n3.5\nBeverage and service issues are reported promptly\nto the appropriate person in accordance with industry\nand/or enterprise policy\n3.6\nDrinks are served using service tray, where\nappropriate in accordance with enterprise procedures\n3.7\nProper handling of glassware are observed at all\ntimes\n3.8\nAny unexpected situations are attended to\npromptly and safely in accordance with industry\n\n--- PDF PAGE 35 ---\nTESDA-SOP-QSO-01-F08\n\nTR-Bartending NC II (Amended) Promulgated December 2013\n- 33-\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\nand/or enterprise policy\n\n4. Deals with customers\naffected with alcohol\n4.1\nResponsible service of alcohol is practiced in\naccordance with relevant legislations and licensing\nrequirements\n4.2\nBehavioral warning signs of intoxication are identified,\nrecognized and monitored\n4.3\nIntoxicated persons are dealt with courteously and\npromptly in accordance with the enterprise service\npolicy and guidelines\n4.4\nIntoxicated customers are refused service of alcoholic\nbeverage in a diplomatic and suitable manner\n4.6\nWhere practicable, appropriate food and non-alcoholic\nbeverages are offered to intoxicated persons\n4.7\nIntoxicated customer misdemeanor are recorded in\nappropriate record book for future guest service\nreference\n\n5. Maintain proper bar\noperation control\nprocedures\n5.1\nOpening and ending inventory are performed according\nto enterprise prescribed form and operating procedures\n5.2\nOrder slip are checked and taken according to\nenterprise operating policy\n5.3\nPOS system procedures are observed according to\nenterprise standard policy, when necessary\n5.4\nOrder count are recorded in accordance with the\nenterprise standard form and policy\n5.5\nAppropriate control system forms are used, when\nnecessary\n5.6\nProper par stock level is maintained at all time.\n5.7\nReplenishment of consumed items is performed.\n\n6. Close/turn over bar\noperations\n6.1\nBeverage display are kept and set up of bar area are\nremoved and cleaned in accordance with industry\nand/or enterprise procedures\n6.2\nLeftover garnishes suitable for next-day operations are\nhygienically stored at recommended temperature\n6.3\nMaterials, tools and glasses are properly kept in suitable\ncabinets\n6.4\nStocks are checked and replenished in accordance with\nindustry and/or enterprise procedures\n6.5\nWhen appropriate, equipment are shut down in\naccordance with enterprise safety procedures and\nmanufacturer’s instructions\n6.6\nBar set up and stocks are maintained for the next shift of\nservice, ensuring equipment and glasses are in the\ncorrect place, whenever necessary\n6.7\nTurnover of bar operations to the next shift is done in\naccordance with enterprise procedure\n6.8\nBar service concerns and issues are properly recorded\nin the enterprise communication logbook for information\nand appropriate action\n\n--- PDF PAGE 36 ---\nTESDA-SOP-QSO-01-F08\n\nTR-Bartending NC II (Amended) Promulgated December 2013\n- 34-\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Bar Areas\nMay include:\n1.1\nFront bar area\n1.2\nBack bar area\n1.3\nUnder bar area\n1.4\nBar floor area\n1.5\nBar storage\n\n2. Bar service\n2.1\nMust include the service of a variety drinks including:\n2.1.1\nMixed drinks and cocktails\n2.1.2\nBeers\n2.1.3\nSpirits\n2.1.4\nWines\n2.1.5\nNon-alcoholic beverages\n2.2\nMay include set-up requirements and procedures for:\n2.2.1\ninclusive packages\n2.2.2\ncash bar\n2.2.3\nset limits\n2.2.4\npre-set drinks\n2.2.5\nopen bar\n\n3. Bar products and\nmaterials\nMay include:\n3.1\ndifferent types of alcoholic and non-alcoholic beverages\n3.2\nflavored syrups\n3.3\ngarnishes, both edible and non-edible\n3.4\naccompaniments\n3.5\nserviettes\n3.6\ncoasters\n3.7\nbar towels\n3.8\nBar mats\n3.9\nStirrers\n3.10 Straws\n3.11 Fruit picks\n3.12 display items including brochures, bar menus, price lists\nand other promotional materials\n\n4. Alcoholic beverages\n\nMay include:\n4.1\nDistilled spirits\n4.1.1 whiskies (scotch, american, canadian, irish,\njapanese)\n4.1.2 brandies / cognacs\n4.1.3 rums\n4.1.4 vodkas\n4.1.5 tequilas\n4.1.6 lambanog(other locally made spirits)\n\n--- PDF PAGE 37 ---\nTESDA-SOP-QSO-01-F08\n\nTR-Bartending NC II (Amended) Promulgated December 2013\n- 35-\n\nVARIABLE\nRANGE\n\n4.2\nCompounded\n4.2.1 gins\n4.2.2 liqueurs/cordials\n4.3\nFermented\n4.3.1 Beer\n4.3.2 Wines\n4.3.2.1 Wines(Imported)\n4.3.2.1.1 Still or natural wine\n4.3.2.1.1.1 white wine\n4.3.2.1.1.2 red wine\n4.3.2.1.1.3 rose wine\n4.3.2.1.1.4 blush wine\n4.3.2.1.2 Sparkling wines\n4.3.2.1.3 Fortified wines\n4.3.2.1.4 Aromatic wines\n4.3.2.2 Wines (local)\n4.3.2.2.1 Rice wines\n4.3.2.2.2 Assorted Fruit wines\n\n5. Non-alcoholic\nbeverages\nMay include:\n5.1\ntea\n5.2\ncoffee\n5.3\nmilk\n5.4\ncarbonated drinks / sodas\n5.5\nFruit juices\n5.6\nFruit purees\n5.7\nbottled waters\n5.8\nenergy drinks\n\n6. Ice Supplies\nMay include:\n6.1\nCleaned tube ice\n6.2\nCleaned cube ice\n6.3\nCracked ice\n6.4\nCleaned shaved / crushed ice\n\n7. Specific customer\npreferences\nMay include:\n7.1\nIce\n7.2\nGarnishes\n7.3\nGlassware\n7.4\nMixers\n7.5\nTemperature\n7.6\nAlcoholic Strength\n\n8. Control system forms\nMay include:\n8.1\nInventory Form\n8.2\nOrder Slip\n8.3\nFull Bottle Sales Report\n8.4\nInter Bar/Outlet Form\n8.5\nRequisition Forms\n8.6\nSpoilage Report Form\n8.7\nBin Cards\n\n--- PDF PAGE 38 ---\nTESDA-SOP-QSO-01-F08\n\nTR-Bartending NC II (Amended) Promulgated December 2013\n- 36-\n\nVARIABLE\nRANGE\n9. Equipment and\nutensils\nMay include:\n9.1\nblenders, juicers and shakers\n9.2\nCoffee Brewing Equipment\n9.3\nCleaning Equipment\n9.4\nRefrigeration Equipment\n9.5\nGlass Washers\n9.6\nBeer Dispensing System\n9.7\nPost Mix Systems\n9.8\nIce Machines\n9.9\nManual And Electronic Cash Registers, Credit Card and\nPOS Equipment\n9.10 Utensils\n9.10.1 Cutleries\n9.10.2 Cups and saucers\n\n10. Bar service concerns\nMay include:\n10.1 Incident report\n10.2 Guest comments\n10.3 Items for maintenance and repair\n\n11. Unexpected situations May include:\n11.1 Spillages\n11.2 Breakages\n11.3 Unruly customers\n\n12. Behavioral signs of\nintoxication\nMay include:\n12.1 Relaxing of inhibition\n12.2 Slowing of reaction\n12.3 Impairment of judgment\n12.4 Decrease in coordination\n12.5 Mumbling or incomprehensible speech\n\n--- PDF PAGE 39 ---\nTESDA-SOP-QSO-01-F08\n\nTR-Bartending NC II (Amended) Promulgated December 2013\n- 37-\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidences that the candidate:\n1.1\nApplied workplace operations and procedures\n1.2\nSet up and operated bar in accordance with established\nprocedures and systems\n1.3\nUsed accurate measures and appropriate glassware\nand garnish for drinks\n1.4\nServed a variety of standard drinks, both alcoholic and\nnon-alcoholic\n1.5\nServed alcohol in accordance with the provisions of\nrelevant legislations, licensing requirements and\nresponsible alcohol service\n1.6\nDemonstrated enterprise standard procedures in making\nbeverage inventory system\n1.7\nClosed/turned-over bar operations to next shift\n\n2. Required Knowledge\nand Attitude\n\n2.1\nTrade theory\n2.1.1 Different types of bars and bar service\n2.1.2 Proper uses of different bar equipment and tools\n2.1.3 Variety of beverage products and an overview of\ncommonly requested drinks\n2.1.4 Types, origins, nature and characteristics of the\ndifferent alcoholic beverages (wines, spirits,\nbeers, etc)\n2.1.5 Types and characteristics of non alcoholic\nbeverages and its respective flavors\n2.1.6 Serving techniques for different types of\nbeverages and Cocktails\n2.1.7 Bar operation control procedures and POS\nsystem\n2.2\nTools\n2.2.1 Tools and equipment specifications and uses\n2.3\nSafety\n2.3.1 Safe work practices and first aid regulations\n2.3.2 Hygienic practices specific to bar operations\nnational/local government laws related to service\nof alcohol\n2.3.3 Waste minimization and environmental\nconsiderations\n\n3. Required Skills\n3.1\nCommunication skills\n3.2\nPreparation and service techniques\n3.3\nProper selling techniques\n3.4\nShowmanship skills\n3.5\nTime management\n3.6\nOpening and serving beverage techniques\n\n--- PDF PAGE 40 ---\nTESDA-SOP-QSO-01-F08\n\nTR-Bartending NC II (Amended) Promulgated December 2013\n- 38-\n\n4. Resource Implications The following resources should be provided:\n4.1\nAccess to workplace location\n4.2\nAccess to a fully-equipped bar including current industry\nequipment\n4.3\nWork activities under industry-realistic conditions\n4.4\nAccess to different beverage products and service under\nindustry-realistic conditions\n4.5\nMaterials relevant to the proposed activities and tasks\n4.6\nAccess o different types of bar control forms\n\n5. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n5.1\nObservation on the proper set up of the bar including\nclassification of alcoholic beverages, glasses and proper\nservice of beverage\n5.2\nDemonstration on the classification of beverage and\npreparation of garnish presentations\n5.3\nWritten and/or oral questions on general knowledge on\nbeverage products, material and appropriate\ncharacteristics and service procedures\n5.4\nThird-party report from the supervisor and/or competent\nemployer’s representative on the candidate's actual\nwork performance\n5.5\nPortfolio of relevant subjects attended\n\n6. Context of\nAssessment\n6.1\nAssessment may be done in a fully-equipped workplace\nor in a simulated workplace setting with current bar\ntools, equipment and materials / products (assessment\ncenters)\n6.2\nAssessment activities are carried out through TESDA’s\naccredited assessment center with accompanying\nexpert and accredited assessor\n\n--- PDF PAGE 41 ---\nTESDA-SOP-QSO-01-F08\n\nTR-Bartending NC II (Amended) Promulgated December 2013\n- 39-\nUNIT OF COMPETENCY\n:\nPREPARE AND MIX COCKTAILS AND NON-\nALCOHOLIC CONCOCTIONS\n\nUNIT CODE\n:\nTRS512397\n\nUNIT DESCRIPTOR\n:\nThe unit deals with the knowledge and skills required to\nprepare and mix different types of cocktails and non-\nalcoholic concoctions in all food and beverage service\nproviders, except for “Specialty Coffee Shops”. It includes\nthe proper use, cleaning and maintaining tools and\nequipment and machineries for mixing drinks.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Prepare and mix a\nrange of cocktails\n\n1.1\nClassification of alcoholic beverages are determined\naccording to ingredients used, process and\ncharacteristics\n1.2\nNon-alcoholic beverages and mixers used as\nmodifiers are identified in accordance with the flavoring\ningredients and process forms\n1.3\nDifferent types of bar tools and equipment are\nidentified and used in accordance with manufacturer’s\nmanual and instruction\n1.4\nDifferent types of glasses are identified and handled\nin accordance with enterprise standard and sanitary\npractices\n1.5\nIce supplies are prepared and used according to\nhygiene and sanitary practices\n1.6\nAppropriate mixing methods and procedures are\napplied based on international standards\n1.7\nNecessary garnish, edible and non-edible fruits and\nvegetables are prepared and used based on cocktail\npresentation\n1.8\nDifferent categories of cocktails are identified\naccording to international standard\n1.9\nCocktail recipes are mixed using appropriate method\nand established international standard within the\nrequired time frame and customer reference\n1.10 Specialty drink concoction are prepared and mixed in\naccordance with industry and/or enterprise recipe and\nservice procedure\n1.11 Appropriate product substitutes for out of stock liquor\ningredients are utilized based on appropriate product\nstandard\n1.12 Broken and chip glasses are identified and removed\n1.13 Occupational health and sanitary practices in mixing\ncocktails are observed according to enterprise standard\nprocedures\n1.14 Safety practices in using mechanical equipment are\nobserved according to manufacturers guidelines\n\n2. Prepare and mix a\nvariety of non-\nalcoholic concoctions\n2.1\nNon-alcoholic beverages are identified in accordance\nwith industry standard classification\n2.2\nModifiers in flavored syrups and other forms are\nidentified in accordance with ingredients used and\nprocess\n2.3\nEdible fruits and vegetables used in mixing non-\nalcoholic cocktails are determined and prepared\naccording to enterprise standards.\n\n--- PDF PAGE 42 ---\nTESDA-SOP-QSO-01-F08\n\nTR-Bartending NC II (Amended) Promulgated December 2013\n- 40-\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n\n2.4\nIngredients, equipment and tools are prepared prior to\nservice\n2.5\nAppropriate name and style of non-alcoholic drinks are\nproperly identified according to customer request\n2.6\nCorrect ingredients are selected and mixed in\naccordance with enterprise service practice\n2.7\nDrinks are prepared appropriately in accordance with\nstandard recipe and required time frame\n2.8\nCorrect glasses and garnish are used attractively where\nappropriate\n2.9\nOccupational health and sanitary practices are observed\nin mixing drinks according to enterprise operating\nprocedures\n2.10 Safety practices in using mechanical equipment are\nobserved according to manufacturers guidelines\n\n3. Use, clean and\nmaintain bar tools and\nequipment and\nmachineries for\nmixing cocktails and\nnon-alcoholic\nconcoctions\n\n3.1\nBar tools are used and cleaned immediately after using\nin accordance with industry and/or enterprise safety and\nsanitary procedures\n3.2\nEquipment and machineries are used in accordance\nwith manufacturer’s specifications and hygiene/safety\nrequirements\n3.3\nMachineries and equipment are maintained in\naccordance with maintenance schedule and\nmanufacturer’s specifications\n3.4\nProblems are promptly identified, reported to and acted\nupon immediately\n\n--- PDF PAGE 43 ---\nTESDA-SOP-QSO-01-F08\n\nTR-Bartending NC II (Amended) Promulgated December 2013\n- 41-\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Alcoholic beverage\nMay include:\n1.1\nDistilled spirits\n1.1.1 whiskies (scotch, american, canadian, irish,\njapanese)\n1.1.2 brandies / cognacs\n1.1.3 rums\n1.1.4 vodkas\n1.1.5 tequilas\n1.1.6 Lambanog (other locally made spirits)\n1.2\nCompounded\n1.2.1 Gins\n1.2.2 liqueurs/cordials\n1.3\nFermented\n1.3.1 Beers\n1.3.2 Wines(Imported)\n1.3.2.1 Still or natural wine\n1.3.2.1.1 white wine\n1.3.2.1.2 red wine\n1.3.2.1.3 rose wine\n1.3.2.1.4 blush wine\n1.3.2.2 Sparkling wines\n1.3.2.3 Fortified wines\n1.3.2.4 Aromatic wines\n1.3.3 Wines (local)\n1.3.3.1 Rice wines\n1.3.3.2 Assorted Fruit wines\n\n2. Non-alcoholic\nbeverages and mixers\n\nMay include:\n2.1\nFruit Juices\n2.2\nFruit Purees\n2.3\nSodas / carbonated drinks\n2.4\nMineral water\n2.5\nDistilled water\n2.6\nMilk / creams\n2.7\nEnergy drinks\n2.8\nSyrups\n\n3. Flavored syrups\nMay include:\n3.1\nFruit Flavors\n3.2\nCitrus Flavors\n3.3\nSingle and mixed Herbs Flavors\n3.4\nBean and kernel Flavors\n\n--- PDF PAGE 44 ---\nTESDA-SOP-QSO-01-F08\n\nTR-Bartending NC II (Amended) Promulgated December 2013\n- 42-\n\nVARIABLE\nRANGE\n4. Bar tools\nMay include:\n4.1\nChopping board\n4.2\nJigger\n4.3\nFruit Juicer / squeezer\n4.4\nBar spoon\n4.5\nBar spill mat\n4.6\nBar caddy\n4.7\nDecanter\n4.8\nBar Strainer (Hawthorn)\n4.9\nCork screw with foil cutter\n4.10 Cocktail Shakers\n4.11 Bottle and can opener\n4.12 Mixing glass\n4.13 Tin can\n4.14 Canulator\n4.15 Straw dispenser\n4.16 Ice bucket\n4.17 Ice scooper\n4.18 Pitcher\n4.19 Ice tong\n4.20 Ice Pick\n4.21 Speed pourer\n4.22 Funnel\n4.23 Bar knife\n4.24 Fruit molder\n4.25 Muddler\n4.26 Juice jugs\n4.27 Measuring Cup\n4.28 Garnish dispenser\n4.29 Cocktail/Bar tray\n4.30 Wine bucket\n4.31 Wine basket\n4.32 Wine stopper/ re-sealer\n4.33 Glass-rimmer\n4.34 utensils\n4.34.1 cutleries\n4.34.2 cups and saucers\n\n5. Bar equipment\n\nMay include:\n5.1\nIce bin\n5.2\nSpeed rail\n5.3\nElectric Blender\n5.4\nPost mix system\n5.5\nGlass chiller\n5.6\nUnderbars’ refrigerator\n5.7\nWine chiller\n5.8\nElectric mixer\n5.9\nWine Humidor\n5.10 Glass brushes\n\n--- PDF PAGE 45 ---\nTESDA-SOP-QSO-01-F08\n\nTR-Bartending NC II (Amended) Promulgated December 2013\n- 43-\n\nVARIABLES\nRANGE\n\n5.11 Beer dispenser\n5.12 Mechanical Glass washer\n5.13 Soda gun\n5.14 Fruit extractor\n5.15 Ice crusher\n\n6. Glasses\nMay include:\n6.1\nstem wares\n6.2\nfooted wares\n6.3\ntumblers\n6.4\nmugs\n6.5\nSpecialty designed glass\n\n7. Ice Supply\nMay include:\n7.1\nCleaned tube ice\n7.2\nCleaned cube ice\n7.3\nCracked ice\n7.4\nCleaned shaved / crushed ice\n\n8. Mixing Methods and\nProcedures\nMay include:\n8.1\nto build\n8.2\nto shake\n8.3\nto stir\n8.4\nto blend\n8.5\nto muddle\n\n9. Categories of\ncocktails\nMay include:\n9.1\nPre-dinner\n9.2\nAfter dinner\n9.3\nLong drinks\n9.4\nFancy drinks\n9.5\nSparkling drinks\n\n10. Garnishes\nMay include:\n10.1 Fresh and unblemished\n10.1.1 Vegetables\n10.1.2 Fruits\n10.1.3 Herbs\n10.1.4 spices\n10.2 Preserved fruits and vegetables\n10.2.1 red cherries\n10.2.2 green olives\n10.2.3 cocktail onions\n10.2.4 other preserved fruits\n\n11. Cocktail recipes\nMay include:\n11.1 Name of the Cocktail\n11.2 Ingredients\n11.3 Measurements\n11.4 Proper procedures\n11.5 Appropriate glass\n11.6 Appropriate garnish\n\n--- PDF PAGE 46 ---\nTESDA-SOP-QSO-01-F08\n\nTR-Bartending NC II (Amended) Promulgated December 2013\n- 44-\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidences that the candidates:\n1.1\nApplied workplace operations and procedures\n1.2\nPrepared materials, equipment/utensils, glasses and\ngarnishes for mixing drinks\n1.3\nPrepared and mixed a variety of internationally-known\ncocktails and non-alcoholic concoctions according to\nspecific industry standards\n1.4\nPrepared quantities of cocktails and non-alcoholic mixed\ndrinks according to acceptable timeframe\n\n2. Required Knowledge\nand Attitude\n2.1\nTrade theory\n2.1.1 Types, origins, nature and characteristics of\ndifferent alcoholic beverages (wines, spirits,\nbeers, etc)\n2.1.2 Types and characteristics of non alcoholic\nbeverages and its respective flavors\n2.1.3 Alcoholic and non-alcoholic ingredients of\nCocktails\n2.1.4 Recipes of popular international standard Mix\ndrinks\n2.1.5 Mixing tools and equipment specifications and\nuses\n2.1.6 Glassware and garnitures required for different\ntypes of cocktails\n2.1.7 Serving techniques for different types of\nbeverages, cocktails and non-alcoholic\nconcoctions\n2.2\nMathematics\n2.2.1 Portion and control\n2.3\nSafety\n2.3.1 Safe work practices and first aid regulations\n2.3.2 Workplace safety environment\n2.3.3 Hygienic and sanitation practices\n2.4\nSafe/Territory Act related to alcohol service\n\n3. Required Skills\n\n3.1\nCommunication skills\n3.2\nProper preparation and mixing procedures\n3.3\nPresentation methods for different cocktails\n3.4\nGarnish preparation creativity\n3.5\nShowmanship skills\n3.6\nTime Management\n3.7\nOpening and serving beverage techniques\n\n--- PDF PAGE 47 ---\nTESDA-SOP-QSO-01-F08\n\nTR-Bartending NC II (Amended) Promulgated December 2013\n- 45-\n\n4. Resource\nImplications\nThe following resources should be provided:\n4.1\nAccess to workplace location\n4.2\nAccess to relevant tools, equipment/utensils and\nglassware\n4.3\nStandards that would allow the candidate to\ndemonstrate and apply knowledge of specific cocktail\nrecipes and non-alcoholic concoction\n4.4\nMaterials relevant to the proposed activities and tasks\n4.5\nAccess to different beverage products and service under\nindustry-realistic conditions\n\n5. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n5.1\nObservation shall be done on the proper classification of\nalcoholic beverages and glasses; proper mixing\nprocedures on several cocktails and the uses and\nmaintenance of different bar tools and equipment\n5.2\nDemonstration of skills on mixing different (in quantity)\ninternational cocktails in a prescribed timeframe; utilizing\nsystematic liquor pouring and proper bar measurement;\nmixing of non-alcoholic concoction showmanship skill\ntechniques\n5.3\nWritten or oral questions on beverage products, their\ncharacteristics and materials used in preparing and\nserving beverages\n5.4\nThird-party report on some relevant criteria from the\nsupervisor and/or competent employer’s representative\non the candidate's actual work performance\n5.5\nPortfolio of relevant subjects being attended\n\n6. Context of\nAssessment\n6.1\nAssessment may be done in a fully-equipped workplace\nor in a simulated work place setting with current bar\ntools, equipment and materials / products (assessment\ncenters)\n6.2\nAssessment activities are carried out in TESDA’s\naccredited assessment center with accompanying\nexpert and accredited assessor\n\n--- PDF PAGE 48 ---\nTESDA-SOP-QSO-01-F08\n\nTR-Bartending NC II (Amended) Promulgated December 2013\n- 46-\n\nUNIT OF COMPETENCY\n:\nPROVIDE BASIC WINE SERVICE\n\nUNIT CODE\n:\nTRS512398\n\nUNIT OF DESCRIPTOR\n:\nThis unit deals with the skills and knowledge on\nproviding wine service. It focuses on basic knowledge\non wines; its attributes and characteristics, proper\npresentation and opening, serving, and the ability to\nfurther develop and update wine knowledge. It may\napply to a Bar Supervisor, Bartender and Food &\nBeverage Attendant.\nThe essential knowledge base for this unit will vary\naccording to industry need. Training must reflect the in-\ndepth of knowledge required to meet the specific\nrequirements of industry employers.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Explain different types\nof wines to customer\n1.1\nWine list is presented to customer in accordance with\nindustry and/or enterprise established service\nprocedures.\n1.2\nAppropriate wine types, names, characteristic, origin\nand or regions are explained to guest\n1.3\nProper wine making process and storage are\nexplained to customer, when necessary\n1.4\nAppropriate wine labels and terminologies are properly\ninterpreted\n1.5\nCustomers are assisted in selecting wine according to\nhis/her taste\n\n2. Recommend\nappropriate wine and\nfood combinations to\ncustomers\n2.1\nCompatible wine and food combinations are\nrecommended based on customer's preferences\n2.2\nAppropriate wine for special occasions are\nrecommended based on customer's needs\n2.3\nSpecial/featured wines of the month are recommended\nin accordance with enterprise policy\n\n3. Prepare wine, glasses\nand accessories for\nservice\n3.1\nNecessary order slip is prepared according to\nestablishment's procedures\n3.2\nWine is carefully taken out from the cellar/storage\n3.3\nWine is presented to the customer according to\nestablished industry wine service procedures\n3.4\nAppropriate glassware is set up according to established\nindustry service and hygienic practices\n3.5\nAppropriate wine service accessories are prepared\n\n--- PDF PAGE 49 ---\nTESDA-SOP-QSO-01-F08\n\nTR-Bartending NC II (Amended) Promulgated December 2013\n- 47-\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n4. Open and serve wine\n4.1\nCustomer is queried as when to open the wine\n4.2\nWine bottle is opened according to industry standard\nopening procedures\n4.3\nSmall amount of wine is poured to the glass for guest’s\ntasting and approval\n4.4\nSensory evaluation of wine is performed, if necessary\n4.5\nFaulty wine is replaced with new one should the guest\ndisapproved its taste\n4.6\nWine is served to the guest according to established\nindustry service procedures\n4.7\nMultiple wine service sequence is applied according\nto established industry service procedures, when\nnecessary\n4.8\nCustomers' glass is refilled, when necessary\n4.9\nAdditional wine order is inquired politely from the host,\nwhen needed\n4.10 Used and empty glasses are cleared according to\nsanitary and safety procedures.\n\n5. Check wine for faults\n5.1\nCork is inspected for any faults\n5.2\nWine is examined for clarity and limpidity\n5.3\nWine is smelled for any possible fault\n5.4\nSensory evaluation of wine is performed, if necessary\n5.5\nSmall amount of wine is tasted to identify other fault\n5.6\nBasic faults of wine are recognized and reported\n\n--- PDF PAGE 50 ---\nTESDA-SOP-QSO-01-F08\n\nTR-Bartending NC II (Amended) Promulgated December 2013\n- 48-\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Wine sensory\nevaluation\nMay include:\n1.1\nSight, to check the wine for clarity and\nbrightness/intensity in terms of shade or color.\n1.2\nSmell or nose, for aroma and bouquet\n1.3\nTaste component, bitter, spicy, salty and sweet\n\n2. Wine types\nMay include:\n2.1\nStill / Natural Wines\n2.1.1\nRed wine\n2.1.2\nWhite wine\n2.1.3\nRosé wine\n2.1.4\nBlush wine\n2.2\nSparkling wines\n2.3\nFortified wines\n2.4\nAromatized wines\n\n3. Wine making process\nand storage\nMay include:\n3.1\nviticulture (vine growing)\n3.2\nvinification (wine making)\n3.3\nproper storing\n3.4\nproper handling\n\n4. Compatibility of wines\nwith different food\nitems\nMay include:\n4.1\nWhite wine with white meat\n4.2\nRed wine for red meat\n4.3\nSparkling wines with any types of Food\n4.4\nFortified wines with appetizer and/or dessert\n4.5\nAromatized wines with appetizer\n\n5. Names of wines\nMay include:\n5.1\nGeneric name of wines\n5.2\nVarietal name of wines\n5.3\nBranded name of wines\n5.4\nPlace of origin wine names\n\n6. Characteristics of\nwine\nMay include:\n6.1\nsweetness\n6.2\ndryness\n6.3\nbitterness\n6.4\ntartness\n6.5\nsaltiness\n6.6\nacidity\n6.7\nfreshness\n6.8\nfruitiness\n\n--- PDF PAGE 51 ---\nTESDA-SOP-QSO-01-F08\n\nTR-Bartending NC II (Amended) Promulgated December 2013\n- 49-\n\nVARIABLE\nRANGE\n\n6.9\nflowery\n6.10 spicyness\n6.11 woodiness\n6.12 yeasty\n6.13 crispiness\n6.14 full-bodied\n6.15 light-bodied\n\n7. Multiple wine service\nsequence\n\nMay include:\n7.1\nLight before full bodied\n7.2\nDry before sweet\n7.3\nYoung before old\n7.4\nDry white before red\n\n8. Special occasion\nwhere wine could be\noffered\nMay include:\n8.1\nBirthday Party\n8.2\nAnniversary\n8.3\nReception\n8.4\nNew Year\n8.5\nBaptismal\n8.6\nVictory celebration\n\n9. Appropriate glassware 9.1\nWhite wine glass for white wine\n9.2\nRed wine glass for red wine\n9.3\nChampagne glass for sparkling wine\n9.4\nSherry / Port wine glass for Fortified wines\n9.5\nAll Purposed wine glass for any types of wines\n\n10. Wine service\naccessories\nMay include:\n10.1 Cork screw with foil cutter\n10.2 Wine bucket with stand\n10.3 Wine basket\n10.4 Wine decanter / carafe\n10.5 Table napkins\n10.6 Wine Stopper/re-sealer\n\n11. Wine Faults\nMay include:\n11.1 Dried cork\n11.2 Defaced wine labels\n11.3 Heavy sediments/deposits\n11.4 Musty or foul odor\n11.5 Loose cork\n11.6 Rotten cork\n11.7 Vinegary\n11.8 Chipped bottle\n\n--- PDF PAGE 52 ---\nTESDA-SOP-QSO-01-F08\n\nTR-Bartending NC II (Amended) Promulgated December 2013\n- 50-\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidences that the candidate:\n1.1\nUpdated and maintained basic and relevant knowledge on\nwines and apply them in the workplace\n1.2\nInterpreted relevant information on wine labels and\nterminologies.\n1.3\nRecommended appropriate wine combination to a\nparticular food item\n1.4\nAnswered customer queries on general information about\nwines\n1.5\nMerchandised wine that is suitable and pleasing to the\ncustomer\n1.6\nDemonstrated established standard technique in opening\nwine\n1.7\nDemonstrated established procedures in serving wine\naccording to types of wine\n\n2. Required Knowledge\n2.1\nStructure, history, health benefits and trends related to\nwines\n2.2\nCharacteristic of wines including:\n2.2.1\nDifferent wine types and their styles\n2.2.2\nDifferent production methods\n2.2.3\nLabel terminology and interpretation\n2.2.4\nWine producing countries and regional variations\n2.2.5\nPrincipal grape varieties used in the production of\ndifferent wine types\n2.2.6\nApplicable wine classifications that govern\nproduction in the old and new world wine countries\n2.3\nVariations in wine production techniques include :\n2.3.1\nWhite wine processes e.g. Fermentation without\nskins Additional clarification process before and\nafter fermentation process, pressing, malolactic\nfermentation, oak usage, etc.\n2.3.2\nRed wine processes e.g. Fermentation of with the\nskins, maceration techniques such as pumping\nover, plunging down, heading down and rotary\nfermenting vat\n2.3.3\nRosé wine e.g. Partial fermentation with skins\n2.3.4\nSparkling wines e.g. with second fermentation of\ndifferent process, as méthode champenoise /\ntradicionale, transfer process, tank fermentation,\ncarbonation/ impregnation\n2.3.5\nFortified wines e.g. Different processes applied to\ndifferent types with addition of brandy before or\nafter fermentation. Fino/Oloroso Sherry, Port and\nMadeira, Marsala\n2.3.6\nAromatized wine e.g. addition of aromatic herbs\nand spices e.g. Sweet/Dry Vermouth, Bitter, Anise\n2.4\nImpact of the wine production techniques to the style and\ntaste of wine\n2.5\nKey structural components of wine including\n2.5.1\nAlcohol\n2.5.2\nTannin\n2.5.3\nAcid\n2.5.4\nSugar\n2.5.5\nFruit flavor\n\n--- PDF PAGE 53 ---\nTESDA-SOP-QSO-01-F08\n\nTR-Bartending NC II (Amended) Promulgated December 2013\n- 51-\n\n2.6\nFactors affecting the style and quality of wine\n2.7\nGuidelines for successful wine and food matching\nincluding:\n2.7.1\nCommonly known food and wine Marriages\n2.7.2\nUsing wine in cooking\n2.7.3\nInteraction of primary flavors of food and wine\n2.7.4\nWines for seasons and social occasions\n2.8\nRequirements of the applicable laws related to responsible\nservice of alcohol.\n2.9\nInternational trends in wine style and production methods\n2.10 Knowledge on wine tasting terminologies\n\n3. Required Skills\n3.1\nIndicators of wines quality, analysis and diagnosis of wine\nfaults and impairments\n3.2\nProper opening techniques of wine bottle\n3.3\nWine service techniques including serving aged wines and\nprocesses for decanting wine\n3.4\nSuggestive wine pairing and selling techniques\n3.5\nSpecialized wine sensory evaluation techniques\n3.6\nCork troubleshooting\n3.7\nGood grooming and hygienic practices relevant to\nbeverage service.\n\n4. Resource Implications\nThe following resources should be provided:\n4.1\nStandards that would allow the candidate to demonstrate\nand apply knowledge on wine to meet the establishment\nservice procedures\n4.2\nAccess to a wide range of wines and to information of\nwines\n4.3\nAccess to suitable facilities complete with the required\nequipment , tools, storage system for wine service\n\n5. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n5.1\nDirect observation of candidate providing advice to\ncustomers or colleagues on wine and its proper serving\nprocedures\n5.2\nOral and written questioning to assess on the general\nknowledge of wine\n5.3\nDemonstration of wine presentation and the proper\nopening and serving of wine using the necessary\naccessories to service\n5.4\nReview of portfolio of evidence on relevant subjects\nattended and third party workplace reports of on-the-job\nperformance by candidate\n\n6. Context of\nAssessment\n6.1\nAssessment may be done in the workplace or in a\nsimulated workplace setting (assessment centers) with\ncurrent bar tools, equipment and materials / products such\nas different types of wines.\n6.2\nAssessment activities are carried out through TESDA’s\naccredited assessment center and certified assessors\n\n--- PDF PAGE 54 ---\nTR-Bartending NC II (Amended) Promulgated December 2013\n- 52-\nELECTIVE COMPETENCIES\n\nUNIT OF COMPETENCY\n:\nPREPARE ESPRESSO\n\nUNIT CODE\n:\nTRS3113100\n\nUNIT DESCRIPTOR\n:\nThis unit deals with the knowledge and skills of\npreparing the perfect shot of espresso based on the\nparameters provided herein.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized items are elaborated in the Range of Variables\n1. Set up and prepare\nmachine and\nequipment\n1.1\nCups are pre-heated in accordance with enterprise\nstandards.\n1.2\nPortafilter is wiped clean and dry before dosing.\n1.3\nGrind of coffee is checked.\n1.4\nEnough coffee is ground for the shot of espresso\n1.5\nDrip tray is cleaned and dried.\n1.6\nRags are prepared and used properly.\n\n2. Dose and Tamp\nCoffee\n2.1\nThe appropriate amount of ground coffee is dosed in\nthe portafilter.\n2.2\nAppropriate amount of pressure is applied to tamp\nthe ground beans\n2.3\nGround coffee is tamped evenly.\n2.4\nPortafilter sides and spouts are wiped and cleaned\nbefore inserting to the brew head\n2.5\nSpillage and wastage of ground beans are minimized\nduring dosing and grinding.\n\n3. Extract espresso\n3.1\nGroup head is flushed before inserting the portafilter\n3.2\nPorta filter is inserted and coffee is brewed immediately\n3.3\nVolume of espresso is checked\n3.4\nExtraction time of shot is monitored.\n3.5\nCrema of shot is inspected.\n3.6\nEspresso is served or used in a beverage immediately\n\n--- PDF PAGE 55 ---\nTR-Bartending NC II (Amended) Promulgated December 2013\n- 53-\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Grind of coffee\nMay include:\n1.1\nCourse\n1.2\nMedium\n1.3\nFine\n1.4\nPulverized\n\n2. Rags\nMay include:\n2.1\nFor portafilter basket\n2.2\nSteam wand\n2.3\nDrip tray\n2.4\nCups\n\n3. Appropriate amount of\nground coffee\nMay be between\n3.1 7-9 grams for single shot and\n3.2 14-18 grams for a double shot\n\n4. Appropriate amount of\npressure\n\nMay be between 30-50 lbs pressure\n5. Portafilter\nMay include:\n5.1\nSingle spout portafilter\n5.2\nDouble spout portafilter\n5.3\nBlind portafilter\n\n6. Volume of espresso\nshot\nVolume of a shot of espresso may be between\n.85- 1.2 ounce ( 25-35ml)\n\n7. Extraction time\nExtraction time of shots is between 20-30 seconds\n\n--- PDF PAGE 56 ---\nTR-Bartending NC II (Amended) Promulgated December 2013\n- 54-\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate\n1.1\nPre-heated cups before making the shot of espresso\n1.2\nWiped the portafilter clean and dry before dosing\n1.3\nDosed the correct amount and tamped coffee properly\n1.4\nWiped and cleaned portafilter sides and spouts before\ninserting to the brew head\n1.5\nFlushed the group head before inserting the portafilter\n1.6\nInserted portafilter and brewed coffee immediately\n1.7\nChecked volume of espresso\n1.8\nMonitored extraction time of shot.\n1.9\nInspected the crema of the espresso.\n1.10 Served or used the espresso immediately\n\n2. Required Knowledge\n2.1\nTypes of coffee grind\n2.2\nTypes of commercially viable coffee beans\n2.3\nRoast levels\n2.4\nEspresso extraction\n2.5\nParts of an espresso\n2.6\nEspresso machine parts\n\n3. Required Skills\n3.1\nGrinder calibration\n3.2\nDosing and tamping\n3.3\nExtracting a perfect shot of espresso\n\n4. Resource\nImplications\n\nThe following resources should be provided:\n4.1 Commercial espresso machine\n4.2 Institutional coffee grinder\n4.3 Coffee beans\n4.4 Coffee bar tools and supplies (tamper, brush etc.)\n\n5. Methods of\nAssessment\n\nCompetency in this unit may be assessed through :\n5.1 Written and/or oral questions to test candidate’s\nknowledge on coffee beans, types of grind, espresso\nextraction etc\n5.2 Practical/Demonstration on extracting a perfect shot of\nespresso.\n\n6. Context of\nAssessment\nAssessment must be conducted in\n6.1 Workplace or simulated environment or\n6.2 TESDA accredited assessment center/venue\n\n--- PDF PAGE 57 ---\nTR-Bartending NC II (Amended) Promulgated December 2013\n- 55-\nUNIT OF COMPETENCY\n:\nTEXTURE MILK\n\nUNIT CODE\n:\nTRS3113101\n\nUNIT DESCRIPTOR\n:\nThis unit covers the skills and knowledge required to\nsteam milk which is essential in the preparation of\nespresso-based beverages with milk like cappuccino\nand latte. It covers the two stages of steaming milk:\nfoaming and heating, at the desired temperature and\nconsistency.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized items are elaborated in the Range of Variables\n1. Prepare milk and\nequipment\n1.1\nMilk is chilled in accordance to appropriate temperature.\n1.2\nAdequate amount of milk is measured according to the\nkind of drink to be prepared.\n1.3\nCorrect (size of ) steaming pitcher is selected in\naccordance with enterprise standards\n1.4\nSteaming pitcher is chilled in accordance to appropriate\ntemperature.\n1.5\nSteam wand is flushed to remove condensed water.\n1.6\nSteam wand is wiped before steaming.\n1.7\nRags for the steam wand are kept clean and moist\n\n2. Foam milk\n2.1\nSteam wand is positioned at the right depth of the milk.\n2.2\nFull steam is applied when introducing air into the milk.\n2.3\nThe sound of air being drawn into the milk is\njudged/evaluated thru the hissing sound.\n2.4\nMilk is stretched according to the desired volume of\nfoam.\n2.5\nMilk is converted into microfoam.\n\n3. Steam milk\n3.1\nSteam wand is angled as appropriate to create a\nwhirlpool effect.\n3.2\nMilk is spun to achieve the desired consistency.\n3.3\nMilk is steamed at the ideal temperature for immediate\nconsumption.\n3.4\nSteam wand is shut off some 5 degrees before the\ndesired temperature.\n3.5\nSteam wand is flushed and wiped after steaming.\n3.6\nBig bubbles are removed by swirling and knocking the\npitcher on the counter.\n\n--- PDF PAGE 58 ---\nTR-Bartending NC II (Amended) Promulgated December 2013\n- 56-\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Steaming pitcher\nSize may include:\n1.1\n10 oz\n1.2\n12 oz\n1.3\n20 oz\n1.4\n32 oz\n\n2. Selection factors\nMay include but not limited to:\n2.1\nAmount of milk\n2.2\nSteam pressure/steam capacity of machine\n2.3\nSteam wand tip\n\n3. Desired volume of foam Volume of milk would have expanded to about\n3.1 1/3 of original volume for latte and\n3.2 Doubled for cappuccino\n\n4. Desired consistency\n4.1\nSilky\n4.2\nVelvety\n4.3\nPouring consistency\n4.4\nNaturally sweet\n4.5\nGlossy\n4.6\nMicrofoam bubbles\n\n5. Ideal temperature\nIdeal temperature for steaming milk is between 140 to 160\ndegrees Fahrenheit\n\n--- PDF PAGE 59 ---\nTR-Bartending NC II (Amended) Promulgated December 2013\n- 57-\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate.\n1.1\nMeasured the adequate amount of milk according to the\nkind of drink to be prepared.\n1.2\nUsed chilled milk.\n1.3\nSelected the correct size of steaming pitcher\n1.4\nFlushed and wiped the steam wand before and after\nsteaming milk\n1.5\nKept rags clean and moist.\n1.6\nListened to the sound of air being drawn into the milk.\n1.7\nStretched the milk according to the desired volume of\nfoam.\n1.8\nSteamed the milk to its desired texture\n1.9\nSteamed the milk at the ideal temperature.\n\n2. Required Knowledge\n2.1\nMilk types and Chemistry of milk\n2.2\nEspresso machine parts\n2.3\nMilk based coffee beverages\n\n3. Required Skills\n3.1\nMilk texturing and steaming\n\n4. Resource\nImplications\n\nThe following resources should be provided:\n4.1\nCommercial espresso machine\n4.2\nInstitutional coffee grinder\n4.3\nCoffee beans\n4.4\nCoffee bar tools and supplies (tamper, steaming\npitcher etc.)\n4.5\nMilk\n4.6\nChiller/ref or ice box with ice\n\n5. Methods of\nAssessment\n\nCompetency in this unit may be assessed through :\n5.1\nWritten and/or oral questions to test candidate’s\nknowledge on the step by step procedure of steaming\nmilk; chemistry or composition of milk; its effect on the\ntexture and sweetness of the steamed milk etc.\n5.2\nPractical/Demonstration on steaming milk\n\n6. Context of\nAssessment\nAssessment must be conducted in\n6.1\nWorkplace or simulated environment or\n6.2\nTESDA accredited assessment center/venue\n\n--- PDF PAGE 60 ---\nTR-Bartending NC II (Amended) Promulgated December 2013\n- 58-\nUNIT OF COMPETENCY\n:\nPREPARE AND SERVE COFFEE BEVERAGES\n\nUNIT CODE\n:\nTRS3113102\n\nUNIT DESCRIPTOR\n:\nThis unit covers the skills and knowledge required in the\npreparation of standard coffee beverages, both hot and\ncold using the espresso machine and the other brewing\nmethods like syphon, pour over and French press.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized items are elaborated in the Range of Variables\n1. Take orders of guests\n1.1\nOrders are taken and verified with guests or dining\nservice crew.\n1.2\nRecommendations are offered to the guest on selection\nof coffee beverages.\n1.3\nGeneral information about the coffee beans are\nprovided to guests\n1.4\nMise-en-place for coffee service is completed\naccording to establishment’s standards and procedures.\n\n2. Prepare espresso-\nbased beverages\n2.1\nHot and cold espresso-based beverages are\nprepared according to standard recipes of the\nestablishments\n2.2\nOnly good/perfect shots of espresso are served or\nused in the beverages.\n2.3\nAppropriate cups/glasses and accessories are selected\naccording to the beverage ordered.\n2.4\nEspresso beverages are served immediately.\n\n3. Prepare and serve\nbrewed coffee\n3.1\nBrewed coffee is prepared according to the brewing\nmethod desired by the guest.\n3.2\nCoffee is brewed according to ideal brewing time of the\nmethod\n3.3\nCoffee beans are weighed or measured according to\nbrewing method.\n3.4\nBrewed coffee is served immediately.\n\n--- PDF PAGE 61 ---\nTR-Bartending NC II (Amended) Promulgated December 2013\n- 59-\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Coffee beans\ninformation\nMay include :\n1.1\nVariety\n1.2\nOrigin\n1.3\nCoffee Blend\n1.4\nRoast level\n1.5\nCoffee grind\n\n2. Mis-en-place\nMay include:\n2.1\n Preparing machine or brewing equipment\n2.2\n Setting cups, saucers, accessories\n2.3\n Supplies/condiments\n\n3. Hot and cold espresso-\nbased beverages\nMay include:\nHot\n3.1\nEspresso\n3.2\nAmericano\n3.3\nCappuccino\n3.4\nCafé Latte\n3.5\nCafé Mocha\nCold\n3.6\nMocha Frappe\n3.7\nIce Café Latte\n3.8\nIced Café Mocha\n\n4. Perfect shot of\nespresso\n4.1 Espresso shot within the parameters:\n4.2 Amount of ground coffee: Between 7-9 grams\n4.3 Volume: .Between 25-35 ml\n4.4 Water temperature: Between 195-205 degrees F\n4.5 Atm pressure: Between 9-10 bars\n4.6 Extraction time: 20-30 seconds\n\n5. Coffee cups/glasses\nMay include:\n5.1\nEspresso cups/demitasse\n5.2\nCappuccino cups\n5.3\nLatte cups\n5.4\nIrish glass\n5.5\nParfait glass\n\n6. Brewing method\nMay include:\n6.1\nFrench Press/Plunger\n6.2\nSyphon\n6.3\nPour over\n\n--- PDF PAGE 62 ---\nTR-Bartending NC II (Amended) Promulgated December 2013\n- 60-\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate\n1.1\nProvided general information about the coffee beans to\nthe guest\n1.2\nPrepared hot and cold espresso-based beverages\n1.3\nServed beverages immediately\n1.4\nBrewed coffee with the used of the different brewing\nmethods\n\n2. Required Knowledge\n2.1\nCoffee growing countries\n2.2\nCoffee varieties\n2.3\nBasic espresso beverages\n2.4\nBrewing methods\n\n3. Required Skills\n3.1\nExtracting espresso\n3.2\nBrewing coffee\n\n4. Resource\nImplications\n\nThe following resources should be provided:\n4.1\nCommercial espresso machine\n4.2\nInstitutional coffee grinder\n4.3\nCoffee beans\n4.4\nCoffee bar tools and supplies\n4.5\nMilk\n4.6\nBrewing equipment\n\n5. Methods of\nAssessment\n\nCompetency in this unit may be assessed through :\n5.1\nWritten and/or oral questions to test candidate’s\nknowledge on espresso and espresso based\nbeverages; brewing methods\n5.2\nPractical/Demonstration on preparing the basic\nespresso-based beverages and brewing coffee using\nthe different brewing methods\n\n6. Context of\nAssessment\nAssessment must be conducted in\n6.1\nWorkplace or simulated environment or\n6.2\nTESDA accredited assessment center/venue\n\n--- PDF PAGE 63 ---\nTR-Bartending NC II (Amended) Promulgated December 2013\n- 61-"
