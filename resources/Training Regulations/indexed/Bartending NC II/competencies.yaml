        "source_title": "PROVIDE BASIC WINE SERVICE",
        "source_text": "--- PDF PAGE 48 ---\nTESDA-SOP-QSO-01-F08 \n \nTR-Bartending NC II (Amended)                                            Promulgated   December 2013 \n- 46- \n \nUNIT OF COMPETENCY \n: \nPROVIDE BASIC WINE SERVICE \n \nUNIT CODE \n: \nTRS512398 \n \nUNIT OF DESCRIPTOR \n: \nThis unit deals with the skills and knowledge on \nproviding wine service.  It focuses on basic knowledge \non wines; its attributes and characteristics, proper \npresentation and opening, serving, and the ability to \nfurther develop and update wine knowledge. It may \napply to a Bar Supervisor, Bartender and Food & \nBeverage Attendant. \nThe essential knowledge base for this unit will vary \naccording to industry need. Training must reflect the in-\ndepth of knowledge required to meet the specific \nrequirements of industry employers. \n \nELEMENT \nPERFORMANCE CRITERIA  \nItalicized terms are elaborated in the Range of Variables \n1. Explain different types \nof wines to customer  \n1.1 \nWine list is presented to customer in accordance with \nindustry and/or enterprise established service \nprocedures. \n1.2 \nAppropriate wine types, names, characteristic, origin \nand or regions are explained to guest  \n1.3 \nProper wine making process and storage are \nexplained to customer, when necessary  \n1.4 \nAppropriate wine labels and terminologies are properly \ninterpreted \n1.5 \nCustomers are assisted in selecting wine according to \nhis/her taste \n \n2. Recommend \nappropriate wine and \nfood combinations to \ncustomers \n2.1 \nCompatible wine and food combinations are \nrecommended based on customer's preferences \n2.2 \nAppropriate wine for special occasions are \nrecommended based on customer's needs \n2.3 \nSpecial/featured wines of the month are recommended \nin accordance with enterprise policy \n \n3. Prepare wine, glasses \nand accessories for \nservice \n3.1 \nNecessary order slip is prepared according to \nestablishment's procedures \n3.2 \nWine is carefully taken out from the cellar/storage \n3.3 \nWine is presented to the customer according to \nestablished industry wine service procedures \n3.4 \nAppropriate glassware is set up according to established \nindustry service and hygienic practices \n3.5 \nAppropriate wine service accessories are prepared\n\n--- PDF PAGE 49 ---\nTESDA-SOP-QSO-01-F08 \n \nTR-Bartending NC II (Amended)                                            Promulgated   December 2013 \n- 47- \n \nELEMENT \nPERFORMANCE CRITERIA  \nItalicized terms are elaborated in the Range of Variables \n4. Open and serve wine \n4.1 \nCustomer is queried as when to open the wine \n4.2 \nWine bottle is opened according to industry standard \nopening procedures \n4.3 \nSmall amount of wine is poured to the glass for guest’s \ntasting and approval \n4.4 \nSensory evaluation of wine is performed, if necessary \n4.5 \nFaulty wine is replaced with new one should the guest \ndisapproved its taste  \n4.6 \nWine is served to the guest according to established \nindustry service procedures \n4.7 \nMultiple wine service sequence is applied according \nto established industry service procedures, when \nnecessary \n4.8 \nCustomers' glass is refilled, when necessary \n4.9 \nAdditional wine order is inquired politely from the host, \nwhen needed \n4.10 Used and empty glasses are cleared according to \nsanitary and safety procedures. \n \n5. Check wine for faults \n5.1 \nCork is inspected for any faults  \n5.2 \nWine is examined for clarity and limpidity \n5.3 \nWine is smelled for any possible fault  \n5.4 \nSensory evaluation of wine is performed, if necessary \n5.5 \nSmall amount of wine is tasted to identify other fault \n5.6 \nBasic faults of wine are recognized and reported\n\n--- PDF PAGE 50 ---\nTESDA-SOP-QSO-01-F08 \n \nTR-Bartending NC II (Amended)                                            Promulgated   December 2013 \n- 48- \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Wine sensory \nevaluation \nMay include: \n1.1 \nSight, to check the wine for clarity and \nbrightness/intensity in terms of shade or color. \n1.2 \nSmell or nose, for aroma and bouquet \n1.3 \nTaste component, bitter, spicy, salty and sweet \n \n2. Wine types  \nMay include: \n2.1 \nStill / Natural Wines \n2.1.1 \nRed wine \n2.1.2 \nWhite wine \n2.1.3 \nRosé wine \n2.1.4 \nBlush wine \n2.2 \nSparkling wines \n2.3 \nFortified wines \n2.4 \nAromatized wines \n \n3. Wine making process \nand storage \nMay include: \n3.1 \nviticulture (vine growing) \n3.2 \nvinification (wine making) \n3.3 \nproper storing \n3.4 \nproper handling \n \n4. Compatibility of wines \nwith different food \nitems  \nMay include: \n4.1 \nWhite wine with white meat \n4.2 \nRed wine for red meat \n4.3 \nSparkling wines with any types of Food \n4.4 \nFortified wines with appetizer and/or dessert  \n4.5 \nAromatized wines with appetizer \n \n5. Names of wines \nMay include: \n5.1 \nGeneric name of wines  \n5.2 \nVarietal  name of wines  \n5.3 \nBranded name of wines \n5.4 \nPlace of origin wine names \n \n6. Characteristics of \nwine \nMay include: \n6.1 \nsweetness \n6.2 \ndryness \n6.3 \nbitterness \n6.4 \ntartness \n6.5 \nsaltiness \n6.6 \nacidity \n6.7 \nfreshness \n6.8 \nfruitiness\n\n--- PDF PAGE 51 ---\nTESDA-SOP-QSO-01-F08 \n \nTR-Bartending NC II (Amended)                                            Promulgated   December 2013 \n- 49- \n \nVARIABLE \nRANGE \n \n6.9 \nflowery \n6.10 spicyness \n6.11 woodiness \n6.12 yeasty \n6.13 crispiness \n6.14 full-bodied \n6.15 light-bodied \n \n7. Multiple wine service \nsequence \n \nMay include: \n7.1 \nLight before full bodied \n7.2 \nDry before sweet \n7.3 \nYoung before old \n7.4 \nDry white before red \n \n8. Special occasion \nwhere wine could be \noffered \nMay include: \n8.1 \nBirthday Party \n8.2 \nAnniversary  \n8.3 \nReception \n8.4 \nNew Year  \n8.5 \nBaptismal \n8.6 \nVictory celebration \n \n9. Appropriate glassware 9.1 \nWhite wine glass for white wine \n9.2 \nRed wine glass for red wine \n9.3 \nChampagne glass for sparkling wine \n9.4 \nSherry / Port wine glass for Fortified wines \n9.5 \nAll Purposed wine glass for any types of wines \n \n10. Wine service \naccessories \nMay include: \n10.1 Cork screw with foil cutter \n10.2 Wine bucket with stand \n10.3 Wine basket \n10.4 Wine decanter / carafe \n10.5 Table napkins \n10.6 Wine Stopper/re-sealer \n \n11. Wine Faults \nMay include: \n11.1 Dried cork \n11.2 Defaced wine labels \n11.3 Heavy sediments/deposits \n11.4 Musty or foul odor \n11.5 Loose  cork \n11.6 Rotten cork \n11.7 Vinegary \n11.8 Chipped bottle\n\n--- PDF PAGE 52 ---\nTESDA-SOP-QSO-01-F08 \n \nTR-Bartending NC II (Amended)                                            Promulgated   December 2013 \n- 50- \nEVIDENCE GUIDE \n \n1. Critical aspects of \nCompetency \nAssessment requires evidences that the candidate: \n1.1 \nUpdated and maintained basic and relevant knowledge on \nwines and apply them in the workplace \n1.2 \nInterpreted relevant information on wine labels and \nterminologies. \n1.3 \nRecommended appropriate wine combination to a \nparticular food item \n1.4 \nAnswered customer queries on general information about \nwines \n1.5 \nMerchandised wine that is suitable and pleasing to the \ncustomer \n1.6 \nDemonstrated established standard technique in opening \nwine \n1.7 \nDemonstrated established procedures in serving wine \naccording to types of wine \n \n2.  Required Knowledge  \n2.1 \nStructure, history, health benefits and trends related to \nwines \n2.2 \nCharacteristic of wines including: \n2.2.1 \nDifferent wine types and their styles \n2.2.2 \nDifferent production methods \n2.2.3 \nLabel terminology and interpretation \n2.2.4 \nWine producing countries and regional variations \n2.2.5 \nPrincipal grape varieties used in the production of \ndifferent wine types \n2.2.6 \nApplicable wine classifications that govern \nproduction in the old and new world wine countries \n2.3 \nVariations in wine production techniques include : \n2.3.1 \nWhite wine processes e.g. Fermentation without \nskins Additional clarification process before and \nafter fermentation process, pressing, malolactic \nfermentation, oak usage, etc. \n2.3.2 \nRed wine processes e.g. Fermentation of with the \nskins, maceration techniques such as pumping \nover, plunging down, heading down and rotary \nfermenting vat \n2.3.3 \nRosé wine e.g. Partial fermentation with skins \n2.3.4 \nSparkling wines e.g. with second fermentation of \ndifferent process, as méthode champenoise / \ntradicionale, transfer process, tank fermentation, \ncarbonation/ impregnation \n2.3.5 \nFortified wines e.g. Different processes applied to \ndifferent types with addition of brandy before or \nafter fermentation. Fino/Oloroso Sherry, Port and \nMadeira, Marsala \n2.3.6 \nAromatized wine e.g. addition of aromatic herbs \nand spices e.g. Sweet/Dry Vermouth, Bitter, Anise \n2.4 \nImpact of the wine production techniques to the style and \ntaste of wine \n2.5 \nKey structural components of wine including  \n2.5.1 \nAlcohol \n2.5.2 \nTannin \n2.5.3 \nAcid \n2.5.4 \nSugar \n2.5.5 \nFruit flavor\n\n--- PDF PAGE 53 ---\nTESDA-SOP-QSO-01-F08 \n \nTR-Bartending NC II (Amended)                                            Promulgated   December 2013 \n- 51- \n \n \n2.6 \nFactors affecting the style and quality of wine \n2.7 \nGuidelines for successful wine and food matching \nincluding: \n2.7.1 \nCommonly known food and wine Marriages \n2.7.2 \nUsing wine in cooking \n2.7.3 \nInteraction of primary flavors of food and wine \n2.7.4 \nWines for seasons and social occasions \n2.8 \nRequirements of the applicable laws related to responsible \nservice of alcohol. \n2.9 \nInternational trends in wine style and production methods \n2.10 Knowledge on wine tasting terminologies \n \n3. Required Skills \n3.1 \nIndicators of wines quality,  analysis and diagnosis of wine \nfaults and impairments \n3.2 \nProper opening techniques of wine bottle  \n3.3 \nWine service techniques including serving aged wines and \nprocesses for decanting  wine \n3.4 \nSuggestive wine pairing and selling techniques  \n3.5 \nSpecialized wine sensory evaluation techniques  \n3.6 \nCork troubleshooting \n3.7 \nGood grooming and hygienic practices relevant to \nbeverage service. \n \n4. Resource Implications \nThe following resources should be provided: \n4.1 \nStandards that would allow the candidate to demonstrate \nand apply knowledge on wine to meet the establishment \nservice procedures \n4.2 \nAccess to a wide range of wines and to information of \nwines \n4.3 \nAccess to suitable facilities complete with the required \nequipment , tools, storage system for wine service  \n \n5. Methods of  \nAssessment \nCompetency in this unit may be assessed through: \n5.1 \nDirect observation of candidate providing advice to \ncustomers or colleagues on wine and its proper serving \nprocedures \n5.2 \nOral and written questioning to assess on the general \nknowledge of wine \n5.3 \nDemonstration of wine presentation and the proper \nopening and serving of wine using the necessary \naccessories to service \n5.4 \nReview of portfolio of evidence on relevant subjects \nattended and third party workplace reports of on-the-job \nperformance by candidate \n \n6. Context of \nAssessment \n6.1 \nAssessment may be done in the workplace or in a \nsimulated workplace setting (assessment centers) with \ncurrent bar tools, equipment and materials / products such \nas different types of wines. \n6.2 \nAssessment activities are carried out through TESDA’s \naccredited assessment center and certified assessors\n",
