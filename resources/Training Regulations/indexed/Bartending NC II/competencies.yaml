          "source_text": "1. Prepare bar for \nservice \n \n1.1 \nBasic parts of the bar are identified according to \nservice operation requirements. \n1.2 \nBar display and work area are set up in accordance \nwith industry and/or enterprise requirements and bar \nservice style \n1.3 \nBar products and materials are checked and re-\nstocked in accordance with industry and/or enterprise \npolicy and procedures  \n1.4 \nAll obtained items are stored in accordance with \nestablished storing procedures and techniques  \n1.5 \nSuitable kinds of decorations, coasters, edible and \nnon-edible garnishes are prepared in accordance with \nindustry and/or enterprise requirements \n1.6 \nAppropriate ice supplies are prepared in accordance \nwith enterprise volume requirement for a days’ \noperation. \n1.7 \nNecessary Bar tools, equipment and utensils are \nchecked and ready for service operation. \n \n2. Take drink orders \n2.1 \nProduct and brand preferences are checked with the \ncustomer courteously \n2.2 \nSelection of drinks are politely recommended to \ncustomer in accordance with enterprise policy and \nprocedures \n2.3 \nSpecific customer preferences are identified in \naccordance with orders taken \n2.4 \nCustomer’s order are promptly recapped in accordance \nenterprise service standard policy \n \n3. Serve drinks \n3.1 \nOrdered drinks are promptly and courteously served, in \naccordance with customer preferences, using required \nglassware and garnishes \n3.2 \nAlcoholic and non-alcoholic beverages are served \naccording to customer preferences \n3.3 \nWaste and spillage are avoided  \n3.4 \nBeverage quality is checked during service and \ncorrections are made if necessary \n3.5 \nBeverage and service issues are reported promptly \nto the appropriate person in accordance with industry \nand/or enterprise policy \n3.6 \nDrinks are served using service tray, where \nappropriate in accordance with enterprise procedures \n3.7 \nProper handling of glassware are observed at all \ntimes \n3.8 \nAny unexpected situations are attended to \npromptly and safely in accordance with industry\n\n--- PDF PAGE 35 ---\nTESDA-SOP-QSO-01-F08 \n \nTR-Bartending NC II (Amended)                                            Promulgated   December 2013 \n- 33- \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \nand/or enterprise policy \n \n4. Deals with customers \naffected with alcohol \n4.1 \nResponsible service of alcohol is practiced in \naccordance with relevant legislations and licensing \nrequirements \n4.2 \nBehavioral warning signs of intoxication are identified, \nrecognized and monitored \n4.3 \nIntoxicated persons are dealt with courteously and \npromptly in accordance with the enterprise service \npolicy and guidelines \n4.4 \nIntoxicated customers are refused service of alcoholic \nbeverage in a diplomatic and suitable manner \n4.6 \nWhere practicable, appropriate food and non-alcoholic \nbeverages are offered to intoxicated persons \n4.7 \nIntoxicated customer misdemeanor are recorded in \nappropriate record book for future guest service \nreference \n \n5. Maintain proper bar \noperation control \nprocedures \n5.1 \nOpening and ending inventory are performed according \nto enterprise prescribed form and operating procedures \n5.2 \nOrder slip are checked and taken according to \nenterprise operating policy \n5.3 \nPOS system procedures are observed according to \nenterprise standard policy, when necessary \n5.4 \nOrder count are recorded in accordance with the  \nenterprise standard form and policy \n5.5 \nAppropriate control system forms are used, when \nnecessary \n5.6 \nProper par stock level is maintained at all time. \n5.7 \nReplenishment of consumed items is performed. \n \n6. Close/turn over bar \noperations \n6.1 \nBeverage display are kept and set up of bar area are \nremoved and cleaned in accordance with industry \nand/or enterprise procedures \n6.2 \nLeftover garnishes suitable for next-day operations are \nhygienically stored at recommended temperature \n6.3 \nMaterials, tools and glasses are properly kept in suitable \ncabinets \n6.4 \nStocks are checked and replenished in accordance with \nindustry and/or enterprise procedures \n6.5 \nWhen appropriate, equipment are shut down in \naccordance with enterprise safety procedures and \nmanufacturer’s instructions \n6.6 \nBar set up and stocks are maintained for the next shift of \nservice, ensuring equipment and glasses are in the \ncorrect place, whenever necessary \n6.7 \nTurnover of bar operations to the next shift is done in \naccordance with enterprise procedure \n6.8 \nBar service concerns and issues are properly recorded \nin the enterprise communication logbook for information \nand appropriate action\n\n--- PDF PAGE 36 ---\nTESDA-SOP-QSO-01-F08 \n \nTR-Bartending NC II (Amended)                                            Promulgated   December 2013 \n- 34- \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Bar Areas \nMay include: \n1.1 \nFront bar area \n1.2 \nBack bar area \n1.3 \nUnder bar area \n1.4 \nBar floor area \n1.5 \nBar storage \n \n2. Bar service \n2.1 \nMust include the service of a variety drinks including:   \n2.1.1 \nMixed drinks and cocktails \n2.1.2 \nBeers \n2.1.3 \nSpirits \n2.1.4 \nWines \n2.1.5 \nNon-alcoholic beverages \n2.2 \nMay include set-up requirements and procedures for: \n2.2.1 \ninclusive packages \n2.2.2 \ncash bar \n2.2.3 \nset limits \n2.2.4 \npre-set drinks \n2.2.5 \nopen bar \n \n3. Bar products and \nmaterials  \nMay include: \n3.1 \ndifferent types of alcoholic and non-alcoholic beverages \n3.2 \nflavored syrups \n3.3 \ngarnishes, both edible and non-edible \n3.4 \naccompaniments \n3.5 \nserviettes \n3.6 \ncoasters \n3.7 \nbar towels \n3.8 \nBar mats \n3.9 \nStirrers \n3.10 Straws \n3.11 Fruit picks \n3.12 display items including brochures, bar menus, price lists \nand other promotional materials \n \n4. Alcoholic beverages  \n \nMay include: \n4.1 \nDistilled spirits \n4.1.1 whiskies (scotch, american, canadian, irish, \njapanese) \n4.1.2 brandies / cognacs \n4.1.3 rums \n4.1.4 vodkas  \n4.1.5 tequilas \n4.1.6 lambanog(other locally made spirits)\n\n--- PDF PAGE 37 ---\nTESDA-SOP-QSO-01-F08 \n \nTR-Bartending NC II (Amended)                                            Promulgated   December 2013 \n- 35- \n \nVARIABLE \nRANGE \n \n4.2 \nCompounded \n4.2.1 gins \n4.2.2 liqueurs/cordials \n4.3 \nFermented \n4.3.1 Beer \n4.3.2 Wines \n4.3.2.1 Wines(Imported) \n4.3.2.1.1 Still or natural wine \n4.3.2.1.1.1 white wine \n4.3.2.1.1.2 red wine \n4.3.2.1.1.3 rose wine \n4.3.2.1.1.4 blush wine \n4.3.2.1.2 Sparkling wines \n4.3.2.1.3 Fortified wines \n4.3.2.1.4 Aromatic wines \n4.3.2.2 Wines (local) \n4.3.2.2.1 Rice wines \n4.3.2.2.2 Assorted Fruit wines \n \n5. Non-alcoholic \nbeverages  \nMay include: \n5.1 \ntea \n5.2 \ncoffee \n5.3 \nmilk \n5.4 \ncarbonated drinks / sodas \n5.5 \nFruit juices \n5.6 \nFruit purees \n5.7 \nbottled waters \n5.8 \nenergy drinks \n \n6. Ice Supplies \nMay include: \n6.1 \nCleaned tube ice \n6.2 \nCleaned cube ice \n6.3 \nCracked ice \n6.4 \nCleaned shaved / crushed ice \n \n7. Specific customer \npreferences \nMay include: \n7.1 \nIce \n7.2 \nGarnishes \n7.3 \nGlassware \n7.4 \nMixers \n7.5 \nTemperature \n7.6 \nAlcoholic Strength \n \n8. Control system forms \nMay include: \n8.1 \nInventory Form \n8.2 \nOrder Slip \n8.3 \nFull Bottle Sales Report \n8.4 \nInter Bar/Outlet Form \n8.5 \nRequisition Forms \n8.6 \nSpoilage Report Form \n8.7 \nBin Cards\n\n--- PDF PAGE 38 ---\nTESDA-SOP-QSO-01-F08 \n \nTR-Bartending NC II (Amended)                                            Promulgated   December 2013 \n- 36- \n \nVARIABLE \nRANGE \n9. Equipment and \nutensils \nMay include: \n9.1 \nblenders, juicers and shakers \n9.2 \nCoffee Brewing Equipment \n9.3 \nCleaning Equipment \n9.4 \nRefrigeration Equipment \n9.5 \nGlass Washers \n9.6 \nBeer Dispensing System  \n9.7 \nPost Mix Systems \n9.8 \nIce Machines \n9.9 \nManual And Electronic Cash Registers, Credit Card  and \nPOS Equipment \n9.10 Utensils \n9.10.1 Cutleries \n9.10.2 Cups and saucers \n \n10. Bar service concerns \nMay include: \n10.1 Incident report \n10.2 Guest comments \n10.3 Items for maintenance and repair \n \n11. Unexpected situations May include: \n11.1 Spillages \n11.2 Breakages \n11.3 Unruly customers \n \n12. Behavioral signs of \nintoxication \nMay include: \n12.1 Relaxing of inhibition \n12.2 Slowing of reaction \n12.3 Impairment of judgment \n12.4 Decrease in coordination \n12.5 Mumbling or incomprehensible speech\n\n--- PDF PAGE 39 ---\nTESDA-SOP-QSO-01-F08 \n \nTR-Bartending NC II (Amended)                                            Promulgated   December 2013 \n- 37-"
