        "source_text": "TRS512397\n\nUNIT DESCRIPTOR\n:\nThe unit deals with the knowledge and skills required to\nprepare and mix different types of cocktails and non-\nalcoholic concoctions in all food and beverage service\nproviders, except for “Specialty Coffee Shops”. It includes\nthe proper use, cleaning and maintaining tools and\nequipment and machineries for mixing drinks.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Prepare and mix a\nrange of cocktails\n\n1.1\nClassification of alcoholic beverages are determined\naccording to ingredients used, process and\ncharacteristics\n1.2\nNon-alcoholic beverages and mixers used as\nmodifiers are identified in accordance with the flavoring\ningredients and process forms\n1.3\nDifferent types of bar tools and equipment are\nidentified and used in accordance with manufacturer’s\nmanual and instruction\n1.4\nDifferent types of glasses are identified and handled\nin accordance with enterprise standard and sanitary\npractices\n1.5\nIce supplies are prepared and used according to\nhygiene and sanitary practices\n1.6\nAppropriate mixing methods and procedures are\napplied based on international standards\n1.7\nNecessary garnish, edible and non-edible fruits and\nvegetables are prepared and used based on cocktail\npresentation\n1.8\nDifferent categories of cocktails are identified\naccording to international standard\n1.9\nCocktail recipes are mixed using appropriate method\nand established international standard within the\nrequired time frame and customer reference\n1.10 Specialty drink concoction are prepared and mixed in\naccordance with industry and/or enterprise recipe and\nservice procedure\n1.11 Appropriate product substitutes for out of stock liquor\ningredients are utilized based on appropriate product\nstandard\n1.12 Broken and chip glasses are identified and removed\n1.13 Occupational health and sanitary practices in mixing\ncocktails are observed according to enterprise standard\nprocedures\n1.14 Safety practices in using mechanical equipment are\nobserved according to manufacturers guidelines\n\n2. Prepare and mix a\nvariety of non-\nalcoholic concoctions\n2.1\nNon-alcoholic beverages are identified in accordance\nwith industry standard classification\n2.2\nModifiers in flavored syrups and other forms are\nidentified in accordance with ingredients used and\nprocess\n2.3\nEdible fruits and vegetables used in mixing non-\nalcoholic cocktails are determined and prepared\naccording to enterprise standards.\n\n--- PDF PAGE 42 ---\nTESDA-SOP-QSO-01-F08\n\nTR-Bartending NC II (Amended) Promulgated December 2013\n- 40-\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n\n2.4\nIngredients, equipment and tools are prepared prior to\nservice\n2.5\nAppropriate name and style of non-alcoholic drinks are\nproperly identified according to customer request\n2.6\nCorrect ingredients are selected and mixed in\naccordance with enterprise service practice\n2.7\nDrinks are prepared appropriately in accordance with\nstandard recipe and required time frame\n2.8\nCorrect glasses and garnish are used attractively where\nappropriate\n2.9\nOccupational health and sanitary practices are observed\nin mixing drinks according to enterprise operating\nprocedures\n2.10 Safety practices in using mechanical equipment are\nobserved according to manufacturers guidelines\n\n3. Use, clean and\nmaintain bar tools and\nequipment and\nmachineries for\nmixing cocktails and\nnon-alcoholic\nconcoctions\n\n3.1\nBar tools are used and cleaned immediately after using\nin accordance with industry and/or enterprise safety and\nsanitary procedures\n3.2\nEquipment and machineries are used in accordance\nwith manufacturer’s specifications and hygiene/safety\nrequirements\n3.3\nMachineries and equipment are maintained in\naccordance with maintenance schedule and\nmanufacturer’s specifications\n3.4\nProblems are promptly identified, reported to and acted\nupon immediately\n\n--- PDF PAGE 43 ---\nTESDA-SOP-QSO-01-F08\n\nTR-Bartending NC II (Amended) Promulgated December 2013\n- 41-\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Alcoholic beverage\nMay include:\n1.1\nDistilled spirits\n1.1.1 whiskies (scotch, american, canadian, irish,\njapanese)\n1.1.2 brandies / cognacs\n1.1.3 rums\n1.1.4 vodkas\n1.1.5 tequilas\n1.1.6 Lambanog (other locally made spirits)\n1.2\nCompounded\n1.2.1 Gins\n1.2.2 liqueurs/cordials\n1.3\nFermented\n1.3.1 Beers\n1.3.2 Wines(Imported)\n1.3.2.1 Still or natural wine\n1.3.2.1.1 white wine\n1.3.2.1.2 red wine\n1.3.2.1.3 rose wine\n1.3.2.1.4 blush wine\n1.3.2.2 Sparkling wines\n1.3.2.3 Fortified wines\n1.3.2.4 Aromatic wines\n1.3.3 Wines (local)\n1.3.3.1 Rice wines\n1.3.3.2 Assorted Fruit wines\n\n2. Non-alcoholic\nbeverages and mixers\n\nMay include:\n2.1\nFruit Juices\n2.2\nFruit Purees\n2.3\nSodas / carbonated drinks\n2.4\nMineral water\n2.5\nDistilled water\n2.6\nMilk / creams\n2.7\nEnergy drinks\n2.8\nSyrups\n\n3. Flavored syrups\nMay include:\n3.1\nFruit Flavors\n3.2\nCitrus Flavors\n3.3\nSingle and mixed Herbs Flavors\n3.4\nBean and kernel Flavors\n\n--- PDF PAGE 44 ---\nTESDA-SOP-QSO-01-F08\n\nTR-Bartending NC II (Amended) Promulgated December 2013\n- 42-\n\nVARIABLE\nRANGE\n4. Bar tools\nMay include:\n4.1\nChopping board\n4.2\nJigger\n4.3\nFruit Juicer / squeezer\n4.4\nBar spoon\n4.5\nBar spill mat\n4.6\nBar caddy\n4.7\nDecanter\n4.8\nBar Strainer (Hawthorn)\n4.9\nCork screw with foil cutter\n4.10 Cocktail Shakers\n4.11 Bottle and can opener\n4.12 Mixing glass\n4.13 Tin can\n4.14 Canulator\n4.15 Straw dispenser\n4.16 Ice bucket\n4.17 Ice scooper\n4.18 Pitcher\n4.19 Ice tong\n4.20 Ice Pick\n4.21 Speed pourer\n4.22 Funnel\n4.23 Bar knife\n4.24 Fruit molder\n4.25 Muddler\n4.26 Juice jugs\n4.27 Measuring Cup\n4.28 Garnish dispenser\n4.29 Cocktail/Bar tray\n4.30 Wine bucket\n4.31 Wine basket\n4.32 Wine stopper/ re-sealer\n4.33 Glass-rimmer\n4.34 utensils\n4.34.1 cutleries\n4.34.2 cups and saucers\n\n5. Bar equipment\n\nMay include:\n5.1\nIce bin\n5.2\nSpeed rail\n5.3\nElectric Blender\n5.4\nPost mix system\n5.5\nGlass chiller\n5.6\nUnderbars’ refrigerator\n5.7\nWine chiller\n5.8\nElectric mixer\n5.9\nWine Humidor\n5.10 Glass brushes\n\n--- PDF PAGE 45 ---\nTESDA-SOP-QSO-01-F08\n\nTR-Bartending NC II (Amended) Promulgated December 2013\n- 43-\n\nVARIABLES\nRANGE\n\n5.11 Beer dispenser\n5.12 Mechanical Glass washer\n5.13 Soda gun\n5.14 Fruit extractor\n5.15 Ice crusher\n\n6. Glasses\nMay include:\n6.1\nstem wares\n6.2\nfooted wares\n6.3\ntumblers\n6.4\nmugs\n6.5\nSpecialty designed glass\n\n7. Ice Supply\nMay include:\n7.1\nCleaned tube ice\n7.2\nCleaned cube ice\n7.3\nCracked ice\n7.4\nCleaned shaved / crushed ice\n\n8. Mixing Methods and\nProcedures\nMay include:\n8.1\nto build\n8.2\nto shake\n8.3\nto stir\n8.4\nto blend\n8.5\nto muddle\n\n9. Categories of\ncocktails\nMay include:\n9.1\nPre-dinner\n9.2\nAfter dinner\n9.3\nLong drinks\n9.4\nFancy drinks\n9.5\nSparkling drinks\n\n10. Garnishes\nMay include:\n10.1 Fresh and unblemished\n10.1.1 Vegetables\n10.1.2 Fruits\n10.1.3 Herbs\n10.1.4 spices\n10.2 Preserved fruits and vegetables\n10.2.1 red cherries\n10.2.2 green olives\n10.2.3 cocktail onions\n10.2.4 other preserved fruits\n\n11. Cocktail recipes\nMay include:\n11.1 Name of the Cocktail\n11.2 Ingredients\n11.3 Measurements\n11.4 Proper procedures\n11.5 Appropriate glass\n11.6 Appropriate garnish\n\n--- PDF PAGE 46 ---\nTESDA-SOP-QSO-01-F08\n\nTR-Bartending NC II (Amended) Promulgated December 2013\n- 44-\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidences that the candidates:\n1.1\nApplied workplace operations and procedures\n1.2\nPrepared materials, equipment/utensils, glasses and\ngarnishes for mixing drinks\n1.3\nPrepared and mixed a variety of internationally-known\ncocktails and non-alcoholic concoctions according to\nspecific industry standards\n1.4\nPrepared quantities of cocktails and non-alcoholic mixed\ndrinks according to acceptable timeframe\n\n2. Required Knowledge\nand Attitude\n2.1\nTrade theory\n2.1.1 Types, origins, nature and characteristics of\ndifferent alcoholic beverages (wines, spirits,\nbeers, etc)\n2.1.2 Types and characteristics of non alcoholic\nbeverages and its respective flavors\n2.1.3 Alcoholic and non-alcoholic ingredients of\nCocktails\n2.1.4 Recipes of popular international standard Mix\ndrinks\n2.1.5 Mixing tools and equipment specifications and\nuses\n2.1.6 Glassware and garnitures required for different\ntypes of cocktails\n2.1.7 Serving techniques for different types of\nbeverages, cocktails and non-alcoholic\nconcoctions\n2.2\nMathematics\n2.2.1 Portion and control\n2.3\nSafety\n2.3.1 Safe work practices and first aid regulations\n2.3.2 Workplace safety environment\n2.3.3 Hygienic and sanitation practices\n2.4\nSafe/Territory Act related to alcohol service\n\n3. Required Skills\n\n3.1\nCommunication skills\n3.2\nProper preparation and mixing procedures\n3.3\nPresentation methods for different cocktails\n3.4\nGarnish preparation creativity\n3.5\nShowmanship skills\n3.6\nTime Management\n3.7\nOpening and serving beverage techniques\n\n--- PDF PAGE 47 ---\nTESDA-SOP-QSO-01-F08\n\nTR-Bartending NC II (Amended) Promulgated December 2013\n- 45-\n\n4. Resource\nImplications\nThe following resources should be provided:\n4.1\nAccess to workplace location\n4.2\nAccess to relevant tools, equipment/utensils and\nglassware\n4.3\nStandards that would allow the candidate to\ndemonstrate and apply knowledge of specific cocktail\nrecipes and non-alcoholic concoction\n4.4\nMaterials relevant to the proposed activities and tasks\n4.5\nAccess to different beverage products and service under\nindustry-realistic conditions\n\n5. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n5.1\nObservation shall be done on the proper classification of\nalcoholic beverages and glasses; proper mixing\nprocedures on several cocktails