        "source_text": "--- PDF PAGE 54 ---\nTR-Bartending NC II (Amended)                                            Promulgated   December 2013 \n- 52- \nELECTIVE COMPETENCIES \n \n \nUNIT OF COMPETENCY \n: \nPREPARE ESPRESSO \n \nUNIT CODE \n: \nTRS3113100 \n \nUNIT DESCRIPTOR \n: \nThis unit deals with the knowledge and skills of \npreparing the perfect shot of espresso based on the \nparameters provided herein.  \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized  items are elaborated in the Range of Variables \n1. Set up and prepare \nmachine and \nequipment \n1.1 \nCups are pre-heated in accordance with enterprise \nstandards. \n1.2 \nPortafilter is wiped clean and dry before dosing. \n1.3 \nGrind of coffee is checked. \n1.4 \nEnough coffee is ground for the shot of espresso \n1.5 \nDrip tray is cleaned and dried. \n1.6 \nRags are prepared and used properly. \n \n2. Dose and Tamp \nCoffee \n2.1 \nThe appropriate amount of ground coffee is dosed in \nthe portafilter. \n2.2 \nAppropriate amount of pressure is applied to tamp \nthe ground beans \n2.3 \nGround coffee is tamped evenly. \n2.4 \nPortafilter sides and spouts are wiped and cleaned \nbefore inserting to the brew head \n2.5 \nSpillage and wastage of ground beans are minimized \nduring dosing and grinding. \n \n3. Extract espresso \n3.1 \nGroup head is flushed before inserting the portafilter \n3.2 \nPorta filter is inserted and coffee is brewed immediately \n3.3 \nVolume of espresso is checked  \n3.4 \nExtraction time of shot is monitored. \n3.5 \nCrema of shot is inspected. \n3.6 \nEspresso is served or used in a beverage immediately\n\n--- PDF PAGE 55 ---\nTR-Bartending NC II (Amended)                                            Promulgated   December 2013 \n- 53- \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Grind of coffee \nMay include: \n1.1 \nCourse \n1.2 \nMedium \n1.3 \nFine \n1.4 \nPulverized \n \n2. Rags \nMay include: \n2.1 \nFor portafilter basket \n2.2 \nSteam wand \n2.3 \nDrip tray \n2.4 \nCups \n \n3. Appropriate amount of \nground coffee \nMay be between  \n3.1   7-9 grams for single shot and  \n3.2   14-18 grams for a double shot \n \n4. Appropriate amount of \npressure \n \nMay be between 30-50 lbs pressure \n5. Portafilter \nMay include: \n5.1 \nSingle spout portafilter \n5.2 \nDouble spout portafilter \n5.3 \nBlind portafilter \n \n6. Volume of espresso \nshot \nVolume of a shot of espresso may be between \n.85- 1.2 ounce ( 25-35ml)  \n \n7. Extraction time \nExtraction time of shots is between 20-30 seconds\n\n--- PDF PAGE 56 ---\nTR-Bartending NC II (Amended)                                            Promulgated   December 2013 \n- 54- \nEVIDENCE GUIDE \n \n1. Critical aspects of \ncompetency \nAssessment requires evidence that the candidate \n1.1 \nPre-heated cups before making the shot of espresso \n1.2 \nWiped the portafilter clean and dry before dosing  \n1.3 \nDosed the correct amount and tamped coffee properly \n1.4 \nWiped and cleaned portafilter sides and spouts before \ninserting to the brew head \n1.5 \nFlushed the group head before inserting the portafilter \n1.6 \nInserted portafilter and brewed coffee immediately \n1.7 \nChecked volume of espresso \n1.8 \nMonitored extraction time of shot. \n1.9 \nInspected the crema of the espresso. \n1.10 Served or used the espresso immediately \n \n2. Required Knowledge \n2.1 \nTypes of coffee grind \n2.2 \nTypes of commercially viable coffee beans \n2.3 \nRoast levels \n2.4 \nEspresso extraction \n2.5 \nParts of an espresso \n2.6 \nEspresso machine parts \n \n3. Required Skills \n3.1 \nGrinder calibration \n3.2 \nDosing and tamping \n3.3 \nExtracting a perfect shot of espresso \n \n4. Resource  \nImplications \n \nThe following resources should be provided: \n4.1  Commercial espresso machine \n4.2 Institutional coffee grinder \n4.3 Coffee beans \n4.4 Coffee bar tools and supplies (tamper, brush etc.) \n \n5. Methods of \nAssessment     \n \nCompetency in this unit may be assessed through : \n5.1 Written and/or oral questions to test candidate’s \nknowledge on coffee beans, types of grind, espresso \nextraction etc \n5.2 Practical/Demonstration on extracting a perfect shot of \nespresso. \n \n6. Context of \nAssessment \nAssessment must be conducted in  \n6.1 Workplace or simulated environment or \n6.2 TESDA accredited assessment center/venue\n",
