          "source_text": "1. Prepare milk and \nequipment \n1.1 \nMilk is chilled in accordance to appropriate temperature. \n1.2 \nAdequate amount of milk is measured according to the \nkind of drink to be prepared. \n1.3 \nCorrect (size of ) steaming pitcher is selected in \naccordance with enterprise standards \n1.4 \nSteaming pitcher is chilled in accordance to appropriate \ntemperature. \n1.5 \nSteam wand is flushed to remove condensed water. \n1.6 \nSteam wand is wiped before steaming. \n1.7 \nRags for the steam wand are kept clean and moist \n \n2. Foam milk \n2.1 \nSteam wand is positioned at the right depth of the milk. \n2.2 \nFull steam is applied when introducing air into the milk. \n2.3 \nThe sound of air being drawn into the milk is \njudged/evaluated thru the hissing sound. \n2.4 \nMilk is stretched according to the desired volume of \nfoam. \n2.5 \nMilk is converted into microfoam. \n \n3. Steam milk \n3.1 \nSteam wand is angled as appropriate to create a \nwhirlpool effect. \n3.2 \nMilk is spun to achieve the desired consistency. \n3.3 \nMilk is steamed at the ideal temperature for immediate \nconsumption. \n3.4 \nSteam wand is shut off some 5 degrees before the \ndesired temperature. \n3.5 \nSteam wand is flushed and wiped after steaming. \n3.6 \nBig bubbles are removed by swirling and knocking the \npitcher on the counter.\n\n--- PDF PAGE 58 ---\nTR-Bartending NC II (Amended)                                            Promulgated   December 2013 \n- 56- \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Steaming pitcher \nSize may include: \n1.1 \n10 oz \n1.2 \n12 oz \n1.3 \n20 oz \n1.4 \n32 oz \n \n2. Selection factors \nMay include but not limited to: \n2.1 \nAmount of milk \n2.2 \nSteam pressure/steam capacity of machine \n2.3 \nSteam wand tip \n \n3. Desired volume of foam Volume of milk would have expanded to about \n3.1   1/3  of original volume for latte and \n3.2   Doubled for cappuccino \n \n4. Desired consistency \n4.1 \nSilky \n4.2 \nVelvety \n4.3 \nPouring consistency \n4.4 \nNaturally sweet \n4.5 \nGlossy \n4.6 \nMicrofoam bubbles \n \n5. Ideal temperature \nIdeal temperature for steaming milk is between 140 to 160 \ndegrees Fahrenheit\n\n--- PDF PAGE 59 ---\nTR-Bartending NC II (Amended)                                            Promulgated   December 2013 \n- 57-"
