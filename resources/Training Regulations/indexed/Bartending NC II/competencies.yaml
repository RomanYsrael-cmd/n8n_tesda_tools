        "evidence_guide": {
          "source_text": "1. Critical aspects of \nCompetency \nAssessment requires evidences that the candidate: \n1.1 \nApplied workplace operations and procedures \n1.2 \nSet up and operated bar in accordance with established \nprocedures and systems \n1.3 \nUsed accurate measures and appropriate glassware  \nand garnish for drinks \n1.4 \nServed a variety of standard drinks, both alcoholic and \nnon-alcoholic  \n1.5 \nServed alcohol in accordance with the provisions of \nrelevant legislations, licensing requirements and \nresponsible alcohol service  \n1.6 \nDemonstrated enterprise standard procedures in making \nbeverage inventory system  \n1.7 \nClosed/turned-over bar operations to next shift \n \n2. Required Knowledge \nand Attitude \n \n2.1 \nTrade theory \n2.1.1 Different types of bars and bar service \n2.1.2 Proper uses of different bar equipment and tools  \n2.1.3 Variety of beverage products and an overview of \ncommonly requested drinks  \n2.1.4 Types, origins, nature and characteristics of the \ndifferent alcoholic beverages (wines, spirits, \nbeers, etc)  \n2.1.5 Types and characteristics of non alcoholic \nbeverages and its respective flavors \n2.1.6 Serving techniques for different types of \nbeverages and Cocktails \n2.1.7 Bar operation control procedures and POS \nsystem \n2.2 \nTools  \n2.2.1 Tools and equipment specifications and uses \n2.3 \nSafety \n2.3.1 Safe work practices and first aid regulations \n2.3.2 Hygienic practices specific to bar operations \nnational/local government laws related to service \nof alcohol  \n2.3.3 Waste minimization and environmental \nconsiderations \n \n3. Required Skills \n3.1 \nCommunication skills \n3.2 \nPreparation and service techniques \n3.3 \nProper selling techniques \n3.4 \nShowmanship skills \n3.5 \nTime management \n3.6 \nOpening and serving beverage techniques\n\n--- PDF PAGE 40 ---\nTESDA-SOP-QSO-01-F08 \n \nTR-Bartending NC II (Amended)                                            Promulgated   December 2013 \n- 38- \n \n4. Resource Implications  The following resources should be provided: \n4.1 \nAccess to workplace location \n4.2 \nAccess to a fully-equipped bar including current industry \nequipment  \n4.3 \nWork activities under industry-realistic conditions  \n4.4 \nAccess to different beverage products and service under \nindustry-realistic conditions \n4.5 \nMaterials relevant to the proposed activities and tasks \n4.6 \nAccess o different types of bar control forms \n \n5. Methods of \nAssessment \nCompetency in this unit may be assessed through: \n5.1 \nObservation on the proper set up of the bar including \nclassification of alcoholic beverages, glasses and proper \nservice of beverage \n5.2 \nDemonstration on the classification of beverage and \npreparation of garnish presentations \n5.3 \nWritten and/or oral questions on general knowledge on \nbeverage products, material and appropriate \ncharacteristics and service procedures \n5.4 \nThird-party report from the supervisor and/or competent \nemployer’s representative on the candidate's actual \nwork performance  \n5.5 \nPortfolio of relevant subjects attended \n \n6. Context of \nAssessment \n6.1 \nAssessment may be done in a fully-equipped workplace \nor in a simulated  workplace setting with current bar \ntools, equipment and materials / products (assessment \ncenters) \n6.2 \nAssessment activities are carried out through TESDA’s \naccredited assessment center with accompanying \nexpert and accredited assessor",
