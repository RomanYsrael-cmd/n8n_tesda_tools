        "evidence_guide": {
          "source_text": "1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate\n1.1\nProvided general information about the coffee beans to\nthe guest\n1.2\nPrepared hot and cold espresso-based beverages\n1.3\nServed beverages immediately\n1.4\nBrewed coffee with the used of the different brewing\nmethods\n\n2. Required Knowledge\n2.1\nCoffee growing countries\n2.2\nCoffee varieties\n2.3\nBasic espresso beverages\n2.4\nBrewing methods\n\n3. Required Skills\n3.1\nExtracting espresso\n3.2\nBrewing coffee\n\n4. Resource\nImplications\n\nThe following resources should be provided:\n4.1\nCommercial espresso machine\n4.2\nInstitutional coffee grinder\n4.3\nCoffee beans\n4.4\nCoffee bar tools and supplies\n4.5\nMilk\n4.6\nBrewing equipment\n\n5. Methods of\nAssessment\n\nCompetency in this unit may be assessed through :\n5.1\nWritten and/or oral questions to test candidate’s\nknowledge on espresso and espresso based\nbeverages; brewing methods\n5.2\nPractical/Demonstration on preparing the basic\nespresso-based beverages and brewing coffee using\nthe different brewing methods\n\n6. Context of\nAssessment\nAssessment must be conducted in\n6.1\nWorkplace or simulated environment or\n6.2\nTESDA accredited assessment center/venue\n\n--- PDF PAGE 63 ---\nTR-Bartending NC II (Amended) Promulgated December 2013\n- 61-"
        },
        "source_text": "TRS3113102\n\nUNIT DESCRIPTOR\n:\nThis unit covers the skills and knowledge required in the\npreparation of standard coffee beverages, both hot and\ncold using the espresso machine and the other brewing\nmethods like syphon, pour over and French press.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized items are elaborated in the Range of Variables\n1. Take orders of guests\n1.1\nOrders are taken and verified with guests or dining\nservice crew.\n1.2\nRecommendations are offered to the guest on selection\nof coffee beverages.\n1.3\nGeneral information about the coffee beans are\nprovided to guests\n1.4\nMise-en-place for coffee service is completed\naccording to establishment’s standards and procedures.\n\n2. Prepare espresso-\nbased beverages\n2.1\nHot and cold espresso-based beverages are\nprepared according to standard recipes of the\nestablishments\n2.2\nOnly good/perfect shots of espresso are served or\nused in the beverages.\n2.3\nAppropriate cups/glasses and accessories are selected\naccording to the beverage ordered.\n2.4\nEspresso beverages are served immediately.\n\n3. Prepare and serve\nbrewed coffee\n3.1\nBrewed coffee is prepared according to the brewing\nmethod desired by the guest.\n3.2\nCoffee is brewed according to ideal brewing time of the\nmethod\n3.3\nCoffee beans are weighed or measured according to\nbrewing method.\n3.4\nBrewed coffee is served immediately.\n\n--- PDF PAGE 61 ---\nTR-Bartending NC II (Amended) Promulgated December 2013\n- 59-\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Coffee beans\ninformation\nMay include :\n1.1\nVariety\n1.2\nOrigin\n1.3\nCoffee Blend\n1.4\nRoast level\n1.5\nCoffee grind\n\n2. Mis-en-place\nMay include:\n2.1\n Preparing machine or brewing equipment\n2.2\n Setting cups, saucers, accessories\n2.3\n Supplies/condiments\n\n3. Hot and cold espresso-\nbased beverages\nMay include:\nHot\n3.1\nEspresso\n3.2\nAmericano\n3.3\nCappuccino\n3.4\nCafé Latte\n3.5\nCafé Mocha\nCold\n3.6\nMocha Frappe\n3.7\nIce Café Latte\n3.8\nIced Café Mocha\n\n4. Perfect shot of\nespresso\n4.1 Espresso shot within the parameters:\n4.2 Amount of ground coffee: Between 7-9 grams\n4.3 Volume: .Between 25-35 ml\n4.4 Water temperature: Between 195-205 degrees F\n4.5 Atm pressure: Between 9-10 bars\n4.6 Extraction time: 20-30 seconds\n\n5. Coffee cups/glasses\nMay include:\n5.1\nEspresso cups/demitasse\n5.2\nCappuccino cups\n5.3\nLatte cups\n5.4\nIrish glass\n5.5\nParfait glass\n\n6. Brewing method\nMay include:\n6.1\nFrench Press/Plunger\n6.2\nSyphon\n6.3\nPour over\n\n--- PDF PAGE 62 ---\nTR-Bartending NC II (Amended) Promulgated December 2013\n- 60-\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate\n1.1\nProvided general information about the coffee beans to\nthe guest\n1.2\nPrepared hot and cold espresso-based beverages\n1.3\nServed beverages immediately\n1.4\nBrewed coffee with the used of the different brewing\nmethods\n\n2. Required Knowledge\n2.1\nCoffee growing countries\n2.2\nCoffee varieties\n2.3\nBasic espresso beverages\n2.4\nBrewing methods\n\n3. Required Skills\n3.1\nExtracting espresso\n3.2\nBrewing coffee\n\n4. Resource\nImplications\n\nThe following resources should be provided:\n4.1\nCommercial espresso machine\n4.2\nInstitutional coffee grinder\n4.3\nCoffee beans\n4.4\nCoffee bar tools and supplies\n4.5\nMilk\n4.6\nBrewing equipment\n\n5. Methods of\nAssessment\n\nCompetency in this unit may be assessed through :\n5.1\nWritten and/or oral questions to test candidate’s\nknowledge on espresso and espresso based\nbeverages; brewing methods\n5.2\nPractical/Demonstration on preparing the basic\nespresso-based beverages and brewing coffee using\nthe different brewing methods\n\n6. Context of\nAssessment\nAssessment must be conducted in\n6.1\nWorkplace or simulated environment or\n6.2\nTESDA accredited assessment center/venue\n\n--- PDF PAGE 63 ---\nTR-Bartending NC II (Amended) Promulgated December 2013\n- 61-"
