  "source_text": "1.\nAPERITIF - is any drink taken before meals, to improve your appetite\n\n2.\nAFTER DINNER DRINK (COCKTAIL) - a mixed drinks that are basically\nsweet and/or creamy in taste and are usually served after a meal\n\n3.\nBREWING - a stage in making beer in which worth is boiled with hops\n\n4.\nBUSBOY - refers to the dining room helper and runner, title given to a Food\nand Beverage Service Attendant, National Certificate I\n\n5.\nBUSSED OUT - taking out soiled plates/dishes from the dining area to\ndishwashing area\n\n6.\nCAPTAIN FOOD AND BEVERAGE SERVICE ATTENDANT - refers to the\nsupervisor of The Food and Beverage Service Attendant, also refers to Food and\nBeverage Service Attendant, National Certificate Level I.\n\n7.\nCOCKTAIL - is a well-mixed drink made up of base liquor, a modifying ingredient\nas a modifier and special flavoring of coloring agents. It is usually an aperitif taken\nat leisure before a meal to whet the appetite.\n\n8.\nCOMMIS - refers to the category according to the extent of difficulty and complexity\nof skills and knowledge required for the job.\n\n9.\nCOMMUNICATION - the transfer of ideas through verbal and non-verbal\ncommunication\n\n10.\nCORDIAL/ LIQUEUR - a spirits that are sweetened and flavor with natural flavor’s\n\n11.\nDISH OUT - food taken from the kitchen to the dining area\n\n12.\nDISTILLATION - a process involving continuous evaporation and condensation of\nliquid wherein higher alcohol content could be obtained\n\n13.\nFERMENTATION - an action of yeast upon a sugar in solution, which breaks\ndown the sugar into carbon dioxide and alcohol\n\n14.\nFLAMBE’ - flamed with spirit or liqueur\n\n15.\nFOOD AND BEVERAGE SERVICE ATTENDANT - refers to the workers assigned\nin the service of food and beverage to the guests, also known as waiter.\n\n16.\nGARNISH - an ingredient which decorates, accompanies or completes a dish.\nMany dishes are identified by the name of their garnishes\n\n17.\nHIGHBALL DRINK - is a tall drink consisting of a shot of specified spirit with mixers\nsuch as sodas, water, etc. serve with cube ice in a highball glass\n\n18.\nLEVEL / CLASS - refers to the category according to the extent of difficulty and\ncomplexity of skills and knowledge required of the jobs.\nCOMPETENCY MAP - TOURISM Sector\n\n--- PDF PAGE 76 ---\nTR-Bartending NC II (Amended) Promulgated December 2013\n- 74-\n\n19.\nLONG OR TALL DRINK - is a mixed drinks that are served in tall glasses\n\n20.\nMENU - a list in specific order of the dishes to be served at a given meal\n\n21.\nMISE EN PLACE - French term for “put in place” having all ingredients in ready to\nuse. Preparation before service\n\n22.\nPRE-DINNER - short mixed drinks that are basically dry in taste and are usually\nserved before a meal to wet the appetite\n\n23.\nSPIRITS - are drinks obtained by distillation after fermentation from vegetables,\ngrains, fruits, plants and other substance with sugar or starch-based\n\n24.\nSILVERWARE - tableware made of solid silver, silver gilt or silver metal. Silver\nplate made from single strip of plated metal\n\n25. TABLE NAPKIN - an individual piece of linen which is used to protect the clothing\nor wipe the mouth during a meal\n\nOther Terms Used:\n\n• Captain Waiter – Chef de Etage\n• Chef – a person who prepares food as an occupation in restaurant,\nprivate house, hotel\n• Dining Room Attendant – Commis de Rang (busboy)\n• Director of Service – Chef de Service\n• Head Waiter – Chef de Salle\n• Waiter – Chef de Rang/Demi Chef de Rang\n• Wine Steward – Chef de Vin/Sommelier/Wine waiter\n• Bar Keeper – Bartender, Barman\n\n--- PDF PAGE 77 ---",
