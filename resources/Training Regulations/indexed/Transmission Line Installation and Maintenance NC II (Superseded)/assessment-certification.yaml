      "number": "20",
      "text": "Overhead power line - is an electric power transmission line suspended by towers or poles. Since most of the insulation is provided by air, overhead power lines are generally the lowest-cost method of transmission for large quantities of electric power. Towers for support of the lines are made of wood (as-grown or laminated), steel (either lattice structures or tubular poles), concrete, aluminum, and occasionally reinforced plastics. The bare wire conductors on the line are generally made of aluminum (either plain or reinforced with steel or sometimes composite materials), though some copper wires are used in medium-voltage distribution and low-voltage connections to customer premises."
