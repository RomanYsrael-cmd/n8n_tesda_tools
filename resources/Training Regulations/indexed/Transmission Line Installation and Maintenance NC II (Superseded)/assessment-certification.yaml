      "text": "Unit of Competency – is a component of the competency standards stating a specific key function or role in a particular job or occupation; it is the smallest component of achievement that can be assessed and certified under the --- PDF PAGE 60 --- ------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ TRAINING REGULATIONS – TRANSMISSION LINE INSTALLATION AND MAINTENANCE NC II Page 58 1. ACSR - abbreviation of Aluminum Cable Steel Reinforced, a cable type having aluminum strands and a core of one or more steel strands. ACSR are primarily used for medium and high voltage lines and may also be used for overhead services to individual customers. 2. Aerial Cable- insulated cable usually supported by a bare cable, for power transmission above ground. 3. Air Gap - the shortest air space between two contacts exposed above an insulating barrier. 4. Armor Rod - an outer metal layer applied to a cable for mechanical protection. Armor rods are comprised of factory formed wire, designed to be applied to a range of conductor sizes 5. Armor Rod (preformed) - a spiral-formed aluminum rod, a group of which is placed around a conductor at the point of suspension to minimize vibration and to protect the conductor from burning in case of a flashover. 6. Block and tackle - an apparatus of pulley blocks and ropes or cables used for hauling and hoisting heavy objects. 7. Conductor - 1) a wire or combination of wires suitable for carrying an electrical current. Conductors may be insulated or bare. 2) any material that allows electrons to flow through it. 8. Damper - a device used to inhibit the vibration of conductors on a transmission line. 9. Groundman - a person working at ground level in support of a lineman working aloft."
