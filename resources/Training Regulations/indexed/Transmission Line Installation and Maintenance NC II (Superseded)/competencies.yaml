        "source_text": "UTL724601\nDESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitude\nrequired to erect pole. This involves working with a\nteam. This unit includes competencies for installing new\npole and/or replacement of old or damaged poles.\nELEMENT\nPERFORMANCE CRITERIA\n(Italicized Bold terms are elaborated in the range of variables)\n1. Plan and prepare\nfor work\n1.1 Work instruction is secured and interpreted according to job\nrequirements\n1.2 Relevant occupational health and safety requirements are\nidentified following job specifications\n1.3 Relevant transmission line tools, equipment and hardware\nare identified and requested in accordance with job\nspecifications\n2. Prepare hardware,\ntransmission line\ntools and equipment\n2.1 Personal protective equipment (PPE) are obtained following job\nrequirements\n2.2 Transmission line tools, equipment and hardware are acquired\nand secured in line with job requirements\n3. Transport pole to\njob site\n3.1 Transmission line tools, equipment and hardware are used in\nline with job requirements\n3.2 Personal protective equipment (PPE) are used following\n job requirements\n3.3 Loading procedure for poles is performed following safety\nrequirements\n3.4 Unloading procedure for poles is performed in line with safety\nrequirements\n3.5 Poles are hauled and dragged following established\nprocedures\n4. Perform pole-setting\nand excavation\n4.1 Transmission line tools, equipment and hardware are used in\nline with job requirements\n4.2 Personal protective equipment (PPE) are used following\n job requirements\n4.3 Pole setting procedure is performed in line with job\nrequirements\n4.4 Pole grounding is installed, if necessary.\n4.5 Excavation procedure is performed following established\nsafety requirements\n5. Erect and / or retire\npole\n5.1 Transmission line tools, equipment and hardware used in line\nwith job requirements\n5.2 Personal protective equipment (PPE) are used following\n job requirements\n5.3 Pole erection procedure is performed in line with job\nrequirements\n5.4 Pole retiring procedure is performed in line with job\n requirement\n5.4 Housekeeping procedure is performed following power\nindustry procedure\n\n--- PDF PAGE 30 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS – TRANSMISSION LINE INSTALLATION AND MAINTENANCE NC II\n\n Page 28\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Pole erection job\nrequirements\n1.1 Methods of erection\n1.1.1 Derrick truck\n1.1.2 Piking\n1.1.3 Gin pole\n1.1.4 Salagunting\n\n2. Occupational\nhealth and safety\nrequirements\nMay include but not limited to:\n2.1 Personal protective equipment (PPE)\n2.1.1 Safety hat\n2.1.2 Safety goggles\n2.1.3 Safety gloves\n2.1.4 Safety shoes\n2.2 Safety harness/strap\n3. Transmission\nline tools,\nequipment and\nhardware\nMay include but not limited to:\n3.1 Tools\n3.1.1 Rope\n3.1.2 Load tongue pole\n3.1.3 Sling\n3.1.4 Snatch blocks\n3.1.5 Auger bit\n3.1.6 Climbing gear\n3.1.7 Turning hook/cant hook\n3.1.8 Digging tools\n3.1.9 Adjustable wrench\n3.1.10 Ball peen hammer\n3.2 Equipment\n3.2.1 Trailer\n3.2.2 Line truck\n3.2.3 Binder\n3.2.4 Winch\n3.2.5 Boom truck\n3.2.6 Crane\n3.2.7 Ratchet hoist\n3.2.8 Block and tackle\n3.2.9 Butting board\n3.3\nHardware\n3.3.1 Machine bolts\n3.3.2 Grounding wire\n3.3.3 Staple wire\n3.3.4 Pole\n\n4. Loading\nprocedure\n4.1 Mechanical (with boom truck)\n4.2 Manual\n\n--- PDF PAGE 31 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS – TRANSMISSION LINE INSTALLATION AND MAINTENANCE NC II\n\n Page 29\n\n5. Loading safety\nrequirements\n5.1 Weight of the pole is established\n5.2 Poles securely fastened\n5.3 Warning devices are installed\n\n6. Hauling and\ndragging\nprocedures\n6.1 Manual\n6.2 Mechanical (with winch)\n7. Pole- setting\nprocedure\n7.1 Determine depth of excavation\n7.2 Pole orientation\n7.3 Steel segments are joined together\n\n8. Excavation\nprocedure\n8.1 Determine stake\n8.2 Outline hole\n8.3 Dig hole following specified recommended depth\n8.4 Cover hole\n8.5 Cave in\n\n9. Pole erection\nprocedure\n9.1 Derrick method\n9.2 Gin pole method\n9.3 Salagunting method\n9.3.1 Knot tying / splicing\n9.4 Pole alignment\n\n--- PDF PAGE 32 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS – TRANSMISSION LINE INSTALLATION AND MAINTENANCE NC II\n\n Page 30\n\nEVIDENCE GUIDE\n\n1. Critical aspects\nof competency\nAssessment requires evidence that the candidate:\n1.1. Demonstrates knowledge of different pole erection methods\n1.2. Demonstrates ability to identify and follow lineman’s\noccupational health and safety standards\n1.3 Demonstrates ability to identify and use transmission line\ntools, equipment and hardware\n1.4 Demonstrates ability to perform pole hauling, pole setting and\npole erection\n1.5 Demonstrates ability to communicate and work in a team\nenvironment\n\n2. Underpinning\nknowledge and\nattitude\n\n2.1 Uses and functions of rigging equipment (1)\n2.2 Lineman’s occupational safety and health standards (3)\n2.2 Hand signal communication (4)\n2.4 Uses and specifications of transmission line tools, equipment\nand hardware (6)\n2.5 Safety procedures for pole hauling, pole setting and pole\nerection (5)\n2.6 Different pole erection methods (2)\n2.7 Power industry standards (7)\n2.8 Desirable work values and attitudes (cost conscious, safety\nconscious, quality conscious, etc.)\n\n3. Underpinning\nskills\n3.1 Using rigging equipment\n3.2 Identifying and following lineman’s occupational health and\nsafety standards\n3.3 Using transmission line tools, equipment and hardware\n3.4 Following safety procedures for pole hauling, pole setting and\n pole erection\n3.5 Communication skills\n3.6 Working in a team environment\n3.7 Interpreting and following power industry standards\n4. Resource\nimplications\nThe following resources should be available:\n4.1 Tools, equipment, hardware and PPE (see range of variables)\n4.2 Load tongue pole\n4.3 Line truck\n5. Method of\nassessment\n5.1 Direct observation with oral questioning\n5.2 Demonstration of skills with oral questioning\n5.3 Written test\n\n6. Context of\nassessment\n6.1 Competency maybe assessed in the workplace or in a\nsimulated workplace setting\n6.2 Assessment shall be undertaken either individually or part of\nteam under limited supervision\n\n--- PDF PAGE 33 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS – TRANSMISSION LINE INSTALLATION AND MAINTENANCE NC II\n\n Page 31\n\nUNIT OF COMPETENCY :\nPERFORM CONSTRUCTION OF OVERHEAD\nTRANSMISSION LINE\nUNIT CODE\n:"
