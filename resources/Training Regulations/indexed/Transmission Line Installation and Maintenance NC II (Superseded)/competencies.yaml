        "source_text": "--- PDF PAGE 44 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ \nTRAINING REGULATIONS – TRANSMISSION LINE INSTALLATION AND MAINTENANCE NC II \n \n                         Page 42  \n \n \n       \n \n \n \n \n \n \n \n \n \nUNIT OF COMPETENCY   :    PERFORM GROUND LINE MAINTENANCE WORK  \nUNIT CODE \n:    UTL723216   \nDESCRIPTOR                    : This unit covers the knowledge, skills and attitude required \nto perform ground line maintenance work. This unit also \nincludes working in a team environment. \n \nELEMENT \nPERFORMANCE CRITERIA \n(Italicized Bold terms are elaborated in the range of variables) \n1. Plan and prepare for \nwork  \n1.1  Work instruction is secured and interpreted according to  \n       job requirements \n1.2  Relevant occupational health and safety requirements \nare identified following job specifications \n1.3  Relevant transmission line tools, equipment and \nhardware are identified and requested in accordance with \njob specifications \n \n3. Prepare hardware, \ntools and equipment \n3.1 Personal protective equipment (PPE) are obtained \nfollowing job requirements  \n3.2 Transmission line tools, equipment and hardware are \nacquired and secured in line with job requirements \n \n5. Perform ground line  \n      maintenance    \n      procedure \n3.1  Transmission line tools, equipment and hardware are used \nin line with job requirements \n3.2  Personal protective equipment (PPE) are used following  \njob requirements \n3.3  Ground line maintenance work procedure is performed \nfollowing job requirements. \n3.4  Housekeeping procedure is performed in line with power \nindustry procedure\n\n--- PDF PAGE 45 ---\n----------------------------------------------------------------------------------------------------------------------------------------------------------------------