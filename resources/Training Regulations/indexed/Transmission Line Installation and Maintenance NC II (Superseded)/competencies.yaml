        "source_title": "PERFORM CONSTRUCTION OF OVERHEAD TRANSMISSION LINE",
        "source_text": "--- PDF PAGE 33 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ \nTRAINING REGULATIONS – TRANSMISSION LINE INSTALLATION AND MAINTENANCE NC II \n \n                         Page 31  \n \n \n       \n \n \n \n \n \n \n \nUNIT OF COMPETENCY : \nPERFORM CONSTRUCTION OF OVERHEAD \nTRANSMISSION LINE  \nUNIT CODE \n:    UTL723213 \nDESCRIPTOR \n: \nThis unit covers the outcomes required for performing \nconstruction of overhead transmission line. This \ninvolves working with a team. The scope of this unit \ncovers installation of new transmission line which is 69 \nKV and above.  \nELEMENT \nPERFORMANCE CRITERIA \n(Italicized Bold terms are elaborated in the range of variables) \n1. Plan and prepare \nfor work \n \n1.1 Work instruction is secured and interpreted according to job \nrequirements \n1.2 Relevant occupational health and safety requirements \nare identified following job specifications \n1.3 Relevant transmission line tools, equipment and \nhardware are identified and requested in accordance with \njob specifications \n  \n2. Prepare \nhardware, tools \nand equipment \n2.1 Personal protective equipment (PPE) are obtained following \njob requirements  \n2.2 Transmission line tools, equipment and hardware are \nacquired and secured in line with job requirements \n \n3. Perform \noverhead line \nconstruction work \n \n5.3 Transmission line tools, equipment and hardware are used \nin line with job requirements \n5.4 Personal protective equipment (PPE) are used following job \nrequirements \n5.5 Confirmation to proceed to work is secured from \nappropriate personnel in accordance with power industry \nprocedure. \n5.6 Overhead line construction work procedures is \nperformed according to job specifications \n5.7 Housekeeping procedure is performed in line with power \nindustry procedure\n\n--- PDF PAGE 34 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ \nTRAINING REGULATIONS – TRANSMISSION LINE INSTALLATION AND MAINTENANCE NC II \n \n                         Page 32  \n \n \n       \n \n \n \n \n \n \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Overhead \ntransmission line \nconstruction job \nrequirements \n1.1 Guys and anchors \n1.2 Pole dressing \n           1.2.1 Cross-arm/hardware \n           1.2.2 Insulators/attachments \n1.3 Conductor/overhead(OHGW) stringing \n1.3.1 Conductor splicing \n1.3.2 Armoring/Vibration damper \n2. Occupational \nhealth and safety \nrequirements \nMay include but not limited to: \n2.1 Personal protective equipment (PPE) \n2.1.1 Safety hat \n2.1.2 Safety goggles \n2.1.3 Safety gloves \n2.1.4 Safety shoes \n2.1.5 Safety harness/strap \n2.2 Installation of grounding cluster \n3. Transmission \nline tools, \nequipment and \nhardware \nMay include but not limited to: \n3.1 Tools  \n3.1.1 Pliers \n3.1.2 Screwdrivers \n3.1.3 Adjustable wrenches \n3.1.4 Ball peen hammer \n3.1.5 Auger bit \n3.1.6 Hacksaw/cutting tools \n3.2 Equipment \n3.2.1 Ratchet hoist \n3.2.2 Capstan/Hand winch \n3.2.3 Block and tackle \n3.2.4 Compression tool \n3.2.5 Snatch block \n3.2.6 Climbing gears \n3.2.7 Hydraulic cutter \n3.2.8 Line truck/Boom truck \n3.3 Hardware \n3.3.1 Insulator \n3.3.2 Machine bolts \n3.3.3 Suspension clamps \n3.3.4 Strain clamp \n3.3.5 Overhead ground wires \n3.3.6 Cross-arms and braces \n3.3.7 Conductors and accessories \n3.3.8 Tower parts \n3.3.1.1 Lattices \n3.3.2.1 Step bolts \n3.3.3.2 Bolts and nuts \n3.3.4.1 Plates and back plates \n3.3.5.1 Grounding cables\n\n--- PDF PAGE 35 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ \nTRAINING REGULATIONS – TRANSMISSION LINE INSTALLATION AND MAINTENANCE NC II \n \n                         Page 33  \n \n \n       \n \n \n \n \n \n \n \n4. Overhead line \nconstruction \nwork procedure \nOverhead line construction work may include procedures for: \n4.1 Guys and anchors \n4.2 Pole dressing  \n4.2.1 Cross-arm/hardware \n4.2.2 Insulators/attachments \n4.3 Conductor/overhead(OHGW) stringing \n4.3.1 Conductor splicing \n4.4 Armoring \n4.5 Vibration damper \n4.6 Structural grounding\n\n--- PDF PAGE 36 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ \nTRAINING REGULATIONS – TRANSMISSION LINE INSTALLATION AND MAINTENANCE NC II \n \n                         Page 34  \n \n \n       \n \n \n \n \n \n \n EVIDENCE GUIDE \n1. Critical aspects \nof competency \nAssessment requires evidence that the candidate: \n1.1 Demonstrates ability to interpret job requirements  \n1.2 Demonstrates ability to identify and comply with lineman  \n      occupational health and safety requirements \n1.3 Demonstrates ability to identify and use transmission line tools, \nequipment and hardware \n1.4 Demonstrates ability to perform and follow overhead line work  \n      procedures \n1.5 Demonstrates ability to communicate and work with authorities  \n      and personnel concerned  \n2. Underpinning \nknowledge and \nattitude \n \n \n \n \n2.1 Standards and specifications for construction of overhead \ntransmission lines structures  \n2.2 Occupational health and safety standards \n2.3 Uses and specifications of transmission line tools, equipment \nand hardware \n2.4 Uses and functions of rigging equipment  \n2.5 Conductor riding technique \n2.6 Hand signal communication \n2.7 Structural drawings and symbols \n2.8 Electrical drawings and symbols \n2.9 Desirable work values and attitudes (cost conscious, safety \nconscious, quality conscious, etc.) \n2.10 Power industry standards \n3. Underpinning \nskills \n3.1 Understanding standards and specifications for construction \noverhead transmission lines structures  \n3.2 Complying lineman’s occupational health and safety standards  \n3.3 Identifying and understanding the uses and specifications of \ntransmission line tools, equipment and hardware  \n3.4 Using transmission line tools, equipment and hardware \n3.5 Using rigging equipment \n3.6 Performing conductor riding technique \n3.7 Using hand signal communication \n3.8 Working efficiently and systematically \n3.9 First aid skills \n3.9  Interpreting and following power industry standards \n4. Resource \nimplications \nThe following resources should be available: \n4.1 Tools, equipment, hardware and PPE (see range of variables) \n4.2 Work area  \n4.3 Line truck  \n5. Method of \nassessment \n5.1 Direct observation with oral questioning \n5.2 Demonstration with oral questioning \n5.3 Written test \n6 Context of \nassessment \n6.1 Competency maybe assessed in the workplace or in a \nsimulated workplace setting \n6.2 Assessment shall be undertaken either individually or part of \nteam under limited supervision\n",
