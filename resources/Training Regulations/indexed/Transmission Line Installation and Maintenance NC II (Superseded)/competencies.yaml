        "source_title": "PERFOM COLD LINE MAINTENANCE WORK",
        "source_text": "--- PDF PAGE 37 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ \nTRAINING REGULATIONS – TRANSMISSION LINE INSTALLATION AND MAINTENANCE NC II \n \n                         Page 35  \n \n \n       \n \n \n \n \n \n \n \n \nUNIT OF COMPETENCY   :    PERFOM COLD LINE MAINTENANCE WORK \nUNIT CODE \n:    UTL723214 \nDESCRIPTOR                    : This unit covers the outcome required to perform cold line \nmaintenance on any existing transmission line hardwares \nand materials. \n \nELEMENT \nPERFORMANCE CRITERIA \n(Italicized Bold terms are elaborated in the range of variables) \n1.  Plan and prepare for  \n     work \n1.1 Work instruction is secured and interpreted according to  \n       job requirements \n1.2  Relevant occupational health and safety \nrequirements are identified following job specifications \n1.3  Relevant transmission line tools, equipment and \nhardware are identified and requested in accordance \nwith job specifications \n \n2. Prepare hardware, \ntools and equipment \n2.1 Personal protective equipment (PPE) are obtained       \nfollowing job requirements  \n2.2 Transmission line tools, equipment and hardware are       \nacquired and secured in line with job requirements \n \n \n3. Perform cold-line  \n      maintenance    \n      procedure \n3.1 Transmission line tools, equipment and hardware are \nused in line with job requirements \n3.2  Personal protective equipment (PPE) are used following \n       job requirements \n3.3 Confirmation to proceed to work is secured from   \nappropriate personnel in accordance with power industry \nprocedure  \n3.4 Cold-line maintenance work procedure is performed \nfollowing job requirements \n3.5 Housekeeping procedure is performed in line with power \nindustry procedure\n\n--- PDF PAGE 38 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ \nTRAINING REGULATIONS – TRANSMISSION LINE INSTALLATION AND MAINTENANCE NC II \n \n                         Page 36  \n \n \n       \n \n \n \n \n \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Cold line \nmaintenance job \nrequirements  \nMay include but not limited to: \n1.1 \nReplacement of rotten wood pole \n1.2 \nReplacement of rotten cross arm \n1.3 \nReplacement of broken/corroded insulator \n1.4 \nReplacement of corroded line hardware \n1.5 \nReplacement of rotten x-brace \n1.6 \nReplacement of armor rod \n1.7 \nRepair of damaged conductor \n \n2. Occupational \nhealth and safety \nstandards \nMay include but not limited to: \n2.1 \nPersonal protective equipment (PPE) \n2.1.1 Safety hat \n2.1.2 Safety goggles \n2.1.3 Safety gloves \n2.1.4 Safety shoes \n2.1.5 Safety harness/strap \n2.2 \nInstallation of grounding cluster \n \n3. Transmission line \ntools, equipment \nand hardware \nMay include but not limited to: \n3.1 \nTools  \n3.1.1 Pliers \n3.1.2 Screwdrivers \n3.1.3 Adjustable wrenches \n3.1.4 Ball peen hammer \n3.1.5 Auger bit \n3.1.6 Hacksaw/cutting tools \n3.1.7 Steel tape \n3.2 \nEquipment \n3.2.1 Ratchet hoist \n3.2.2 Capstan/Hand winch \n3.2.3 Block and tackle \n3.2.4 Compression tool \n3.2.5 Wire grip/cumalong \n3.2.6 Snatch block \n3.2.7 Climbing gears \n3.2.8 Hydraulic cutter \n3.2.9 Line truck/Boom truck \n3.2.10 Wire rope/nylon \n3.3 \nHardware \n3.3.1 Insulator \n3.3.2 Machine bolts \n3.3.3 Suspension clamp assembly (ACSR/OHGW) \n3.3.4 Strain clamp assembly(ACSR/OHGW) \n3.3.5 Overhead ground wires \n3.3.6 Cross-arms and braces \n3.3.7 Conductors and accessories \n3.3.8 Poles (wood, steel or concrete)\n\n--- PDF PAGE 39 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ \nTRAINING REGULATIONS – TRANSMISSION LINE INSTALLATION AND MAINTENANCE NC II \n \n                         Page 37  \n \n \n       \n \n \n \n \n \n \n3.3.8 Tower parts \n3.3.8.1 Lattices \n3.3.8.2 Step bolts \n3.3.8.3 Bolts and nuts \n3.3.8.4 Plates and back plates \n3.3.8.5 Grounding cables \n4. Cold-line \nmaintenance \nprocedure \n4.1 \nSafe procedure for: \n4.1.1 Replacing rotten wood pole \n4.1.2 Replacing rotten cross arm \n4.1.3 Replacing broken / corroded insulator \n4.1.4 Replacing corroded line hardwares \n4.1.5 Replacing rotten x-brace \n4.1.6 Replacing armor rod \n4.1.7 Repairing damaged conductor\n\n--- PDF PAGE 40 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ \nTRAINING REGULATIONS – TRANSMISSION LINE INSTALLATION AND MAINTENANCE NC II \n \n                         Page 38  \n \n \n       \n \n \n \n \n \n \nEVIDENCE GUIDE \n1. Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1 \nDemonstrates ability to interpret cold-line maintenance job \nrequirements \n1.2 \nDemonstrates ability to identify and comply with lineman’s \noccupational health and safety standards \n1.3 \nDemonstrates ability to identify and use transmission line \ntools, equipment and hardware \n1.4 \nDemonstrates ability to perform cold-line maintenance \nwork or procedure \n1.6 \nDemonstrates ability to communicate and work in a team \nenvironment \n \n2. Underpinning \nknowledge and \nattitude \n2.1   Line hardware, materials and design structures &  \n        specifications \n2.2   Lineman’s occupational health and safety standards \n2.3   Uses and specifications of transmission line tools and  \n        equipment \n2.4   Uses and functions of rigging equipment \n2.5   Safety procedure to perform cold-line maintenance work  \n2.6   Hand signal communication   \n2.7  Desirable work values and attitudes (cost conscious, safety  \n   conscious, quality conscious, etc.) \n2.8  Power industry standards  \n3. Underpinning skills \n3.1 Identifying line hardware, materials and design structures \nand specifications \n3.2 Identifying and complying occupational health and safety \nstandards \n3.3 Using transmission line tools, equipment and hardware \n3.4 Following safety procedures for cold-line maintenance work \n3.5 Work efficiently and systematically \n3.6 Communicating skills  \n3.7 First aid skills \n3.8 Interpreting and following power industry standards \n \n4. Resource \nimplications \nThe following resources must be available: \n4.1 Transmission line tools, equipment and hardwares and PPE \n(see range of variables) \n4.2 Work area  \n4.3 Climbing gears and safety belt \n \n5. Method of \nassessment \n5.1 Direct observation with questioning \n5.2 Demonstration with oral questioning \n5.3 Written test \n6. Context of \nassessment \n6.1 Competency may be assessed in the workplace or in a \nsimulated workplace setting \n6.2 Assessment shall be undertaken either individually or part \nof team under limited supervision\n",
