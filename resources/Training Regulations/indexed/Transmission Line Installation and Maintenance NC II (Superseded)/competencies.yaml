        "evidence_guide": {
          "source_text": "1. Critical aspects of\n competency\nAssessment requires evidence that the candidate:\n1.1 Demonstrates ability to interpret live-line maintenance job\nrequirements\n1.2 Demonstrates ability to identify and comply with lineman’s\noccupational health and safety standards\n1.3 Demonstrates ability to identify and use transmission line\ntools, equipment, hardware and hot line trailer\n1.4 Demonstrates ability to perform live-line maintenance work\nor procedure\n1.5 Demonstrates ability to communicate and work in a team\n environment\n2. Underpinning\nknowledge and attitude\n2.1 Line hardware, materials and design structures &\n Specifications\n2.2 Lineman’s occupational health and safety standards\n2.3 Uses and specifications of transmission line tools,\n equipment and hot line trailer\n2.4 Safety procedure to perform live-line maintenance work\n2.5 Hand signal communication\n2.6 Desirable work values and attitudes (cost conscious,\n safety conscious, quality conscious, etc.)\n2.7 Power industry standards\n2.8 Uses and functions of rigging gears\n3. Underpinning skills\n3.1 Identifying line hardware, materials and design structures\n and specifications\n3.2 Identifying and complying occupational health and safety\n standards\n3.3 Using transmission line tools, equipment, hardware and\n hot line trailer\n3.4 Following safety procedures for live-line maintenance\n work\n3.5 Work efficiently and systematically\n3.6 Communicating skills\n3.7 First aid skills\n3.8 Interpreting and following power industry standards\n3.9 Using rigging equipment\n4. Resource Implications\nThe following resources must be available:\n4.1 Transmission line tools, equipment, hardwares and PPE\n and hot line trailer(see range of variables)\n4.2 Work area\n4.3 Climbing gears and safety belt\n5. Method of assessment\n5.1 Observation and Oral questioning\n5.2 Demonstration with oral questioning\n5.3 Written test\n6. Context of assessment\n6.1 Competency may be assessed in the workplace or in a\n simulated workplace setting\n6.2 Assessment shall be undertaken either individually or part\n of team under limited supervision\n\n--- PDF PAGE 44 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS – TRANSMISSION LINE INSTALLATION AND MAINTENANCE NC II\n\n Page 42\n\nUNIT OF COMPETENCY : PERFORM GROUND LINE MAINTENANCE WORK\nUNIT CODE\n:"
        },
        "source_text": "UTL723215\nDESCRIPTOR : This unit covers the outcome required to perform live-line\nmaintenance on any existing transmission line hardware\nand materials using both hot sticks method and bare hand\nmethod.\n\nELEMENT\nPERFORMANCE CRITERIA\n(Italicized Bold terms are elaborated in the range of variables)\n1. Plan and prepare for\nwork\n1.1 Work instruction is secured and interpreted according to\n job requirements\n1.2 Relevant occupational health and safety requirements\nare identified following job specifications\n1.3 Relevant transmission line tools, equipment and\nhardware are identified and requested in accordance with\njob specifications\n\n2. Prepare hardware,\ntransmission line\ntools and equipment\n2.1 Personal protective equipment (PPE) are obtained\nfollowing job requirements\n2.2 Transmission line tools, equipment and hardware are\nacquired and secured in line with job requirements\n2.3 Hotstick cleaning and testing procedures are performed\nbased on manufacturer’s standards\n\n4. Perform live-line\n maintenance\n procedure\n3.1 Transmission line tools, equipment and hardware are used\nin line with job requirements\n3.2 Personal protective equipment (PPE) are used following\njob requirements\n3.3 Live-line maintenance work procedure is performed\nfollowing job requirements.\n3.4 Housekeeping procedure is performed in line with power\nindustry procedure\n\n--- PDF PAGE 42 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS – TRANSMISSION LINE INSTALLATION AND MAINTENANCE NC II\n\n Page 40\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Live-line maintenance\njob requirements\nMay include but not limited to:\n1.1 Replacement of rotten wood pole\n1.2 Replacement of rotten cross arm\n1.3 Replacement of broken/corroded insulator\n1.4 Replacement of corroded line hardwares\n1.5 Replacement of rotten x-brace\n1.6 Repair of armor rod\n1.7 Repair of damaged conductor\n1.8 Installation of vibration damper\n\n2. Occupational health\nand safety standards\nMay include but not limited to:\n2.1. Personal protective equipment (PPE)\n2.1.1. Safety hat\n2.1.2. Safety goggles\n2.1.3. Safety gloves\n2.1.4. Safety shoes (without steel toe)\n2.1.5. Safety harness/strap\n2.2 Ladder monitoring kit\n2.3 Hot stick tester\n3. Transmission line\ntools, equipment and\nhardware\nMay include but not limited to:\n3.1 Hand tools\n3.1.1 Pliers\n3.1.2 Screwdrivers\n3.1.3 Adjustable wrenches\n3.1.4 Ball peen hammer\n3.1.5 Auger bit\n3.1.6 Hacksaw/cutting tools\n3.1.7 Steel tape\n3.2 Equipment\n3.2.1 Motorized capstan\n3.2.2 Climbing gears\n3.2.3 Line truck/Boom truck\n3.3 Set of hot line trailer\n3.4 Hardware\n3.4.1 Insulator\n3.4.2 Machine bolts\n3.4.3 Suspension clamp assembly (ACSR/OHGW)\n3.4.4 Strain clamp assembly(ACSR/OHGW)\n3.4.5 Overhead ground wires\n3.4.6 Cross-arms and braces\n3.4.7 Conductors and accessories\n\n4. Live line maintenance\nwork procedure\n4.1 Hot stick method\n4.2 Bare hand method\n\n--- PDF PAGE 43 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS – TRANSMISSION LINE INSTALLATION AND MAINTENANCE NC II\n\n Page 41\n\nEVIDENCE GUIDE\n1. Critical aspects of\n competency\nAssessment requires evidence that the candidate:\n1.1 Demonstrates ability to interpret live-line maintenance job\nrequirements\n1.2 Demonstrates ability to identify and comply with lineman’s\noccupational health and safety standards\n1.3 Demonstrates ability to identify and use transmission line\ntools, equipment, hardware and hot line trailer\n1.4 Demonstrates ability to perform live-line maintenance work\nor procedure\n1.5 Demonstrates ability to communicate and work in a team\n environment\n2. Underpinning\nknowledge and attitude\n2.1 Line hardware, materials and design structures &\n Specifications\n2.2 Lineman’s occupational health and safety standards\n2.3 Uses and specifications of transmission line tools,\n equipment and hot line trailer\n2.4 Safety procedure to perform live-line maintenance work\n2.5 Hand signal communication\n2.6 Desirable work values and attitudes (cost conscious,\n safety conscious, quality conscious, etc.)\n2.7 Power industry standards\n2.8 Uses and functions of rigging gears\n3. Underpinning skills\n3.1 Identifying line hardware, materials and design structures\n and specifications\n3.2 Identifying and complying occupational health and safety\n standards\n3.3 Using transmission line tools, equipment, hardware and\n hot line trailer\n3.4 Following safety procedures for live-line maintenance\n work\n3.5 Work efficiently and systematically\n3.6 Communicating skills\n3.7 First aid skills\n3.8 Interpreting and following power industry standards\n3.9 Using rigging equipment\n4. Resource Implications\nThe following resources must be available:\n4.1 Transmission line tools, equipment, hardwares and PPE\n and hot line trailer(see range of variables)\n4.2 Work area\n4.3 Climbing gears and safety belt\n5. Method of assessment\n5.1 Observation and Oral questioning\n5.2 Demonstration with oral questioning\n5.3 Written test\n6. Context of assessment\n6.1 Competency may be assessed in the workplace or in a\n simulated workplace setting\n6.2 Assessment shall be undertaken either individually or part\n of team under limited supervision\n\n--- PDF PAGE 44 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS – TRANSMISSION LINE INSTALLATION AND MAINTENANCE NC II\n\n Page 42\n\nUNIT OF COMPETENCY : PERFORM GROUND LINE MAINTENANCE WORK\nUNIT CODE\n:"
