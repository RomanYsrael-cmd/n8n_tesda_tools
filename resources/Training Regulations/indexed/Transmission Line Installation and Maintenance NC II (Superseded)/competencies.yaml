  \n    competency \nAssessment requires evidence that the candidate: \n1.1 Demonstrates ability to interpret ground line maintenance job \nrequirements \n1.2 Demonstrates ability to identify and comply with lineman’s \noccupational health and safety standards \n1.3 Demonstrates ability to identify and use transmission line \ntools, equipment, hardware  \n1.4 Demonstrates ability to perform ground line maintenance work \nor procedure \n1.3 Demonstrates ability to communicate and work in a team \nenvironment \n2. Underpinning  \nknowledge and attitude \n2.1  Line hardware, materials and design structures &  \n       specifications \n2.2  Illegal structures and vegetation within the right of way \n2.3  Lineman’s occupational health and safety standards \n2.4  Uses and specifications of transmission line tools, and  \n       equipment  \n2.5  Safety procedure to perform ground line maintenance work  \n2.6  Hand signal communication \n2.7  Desirable work values and attitudes (cost conscious,   \n       safety conscious, quality conscious, etc.)  \n2.8 Power industry standards \n2.9 Uses and functions of rigging gears \n3. Underpinning skills \n3.1 Identifying line hardware, materials and design structures \n      and specifications \n3.2 Identifying and complying occupational health and safety \n      Standards \n3.3 Identifying illegal structures and vegetation within the right  \n      of way \n3.4 Using transmission line tools, equipment, and hardware  \n3.5 Following safety procedures for ground line maintenance work \n3.6 Work efficiently and systematically \n3.2  Communicating skills  \n3.3  First aid skills \n3.9 Interpreting and following power industry standards \n3.10 Using rigging equipment \n4. Resource Implications \nThe following resources must be available: \n3.1 Transmission line tools, equipment,  hardwares and PPE  \n      (see range of variables) \n3.2 Work area  \n3.3 Line truck  \n5. Method of assessment \n5.1 Observation and Oral questioning \n5.2 Demonstration with oral questioning \n5.3 Written test \n6. Context of assessment \n6.1 Competency may be assessed in the workplace or in a   \n      simulated workplace setting \n6.2 Assessment shall be undertaken either individually or part  \n      of team under limited supervision\n",
