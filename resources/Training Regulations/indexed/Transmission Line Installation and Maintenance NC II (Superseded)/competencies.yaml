        "source_text": "UTL724602\nDESCRIPTOR : This unit covers the knowledge, skills and attitude to install\nemergency restoration structure (ERS). This unit will\ninvolve working in a team environment.\nELEMENT\nPERFORMANCE CRITERIA\n(Italicized Bold terms are elaborated in the range of variables)\n1. Plan and prepare for\nwork\n1.1 Work instruction is secured and interpreted according to\n job requirements\n1.2 Relevant occupational health and safety requirements\nare identified following job specifications\n1.3 Relevant transmission line tools, equipment and\nhardware are identified and requested in accordance with\njob specifications\n\n2. Prepare hardware,\n tools and equipment\n2.1 Personal protective equipment (PPE) are obtained\n following job requirements\n2.2 Transmission line tools, equipment and hardware are\n acquired and secured in line with job requirements\n\n3. Erect ERS\n3.1 Transmission line tools, equipment and hardware are used\n in line with job requirements\n3.2 Personal protective equipment (PPE) are used following\n job requirements\n3.3 ERS erection procedure is performed in line with job\n requirements\n3.4 Stringing procedure is performed in line with job\n requirements\n3.5 Housekeeping procedure is performed following power\n industry procedure\n\n--- PDF PAGE 48 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS – TRANSMISSION LINE INSTALLATION AND MAINTENANCE NC II\n\n Page 46\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. ERS job requirements\nMay include but not limited to:\n1.1 Toppled tower structure\n1.2 Leaning structure\n1.3 Intermediary structure\n\n2. Occupational health\n and safety\n requirements\nMay include but not limited to:\n2.1 Personal protective equipment (PPE)\n2.1.1 Safety hat\n2.1.2 Safety goggles\n2.1.3 Safety gloves\n2.1.4 Safety shoes\n2.1.5 Safety harness/strap\n2.2 Installation of grounding cluster\n3. Transmission line\n tools, equipment and\n hardware\nMay include but not limited to:\n3.1 Tools\n 3.1.1 Rope\n 3.1.2 Sling\n 3.1.3 Snatch blocks\n 3.1.4 Adjustable wrench\n 3.1.5 Spud wrench\n 3.1.6 Socket wrench\n 3.1.7 Ball peen hammer\n 3.1.8 Safety belt\n3.2 Equipment\n 3.2.1 Line truck\n 3.2.2 Binder\n 3.2.3 Hydraulic-powered unit (HPU) or capstan\n 3.2.4 Boom truck\n 3.2.5 Ratchet hoist\n 3.2.6 Block and tackle\n3.3 Hardware\n 3.3.1 Anchor shackle\n 3.3.2 Bolts and nuts\n 3.3.3 Anchor rod/manta ray\n 3.3.4 Guy wires\n 3.3.5 Guy grips pre formed\n 3.3.6 Post insulator\n 3.3.7 Polymer\n 3.3.8 Set of ERS\n\n--- PDF PAGE 49 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS – TRANSMISSION LINE INSTALLATION AND MAINTENANCE NC II\n\n Page 47\n\nEVIDENCE GUIDE\n1. Critical aspects of\n competency\nAssessment requires evidence that the candidate:\n1.1 Demonstrates ability to interpret ERS job requirements\n1.2 Demonstrates ability to comply with lineman’s\n occupational health and safety standards\n1.3 Demonstrates ability to identify and use transmission line\n tools, equipment and hardware\n1.4 Demonstrates ability to perform ERS erection and\n stringing procedures\n1.5 Demonstrates ability to communicate and work in a team\n environment\n2. Underpinning\n knowledge and attitude\n2.1 Line hardware, materials and design structures &\n specifications\n2.2 Lineman’s occupational health and safety standards\n2.3 Uses and specifications of transmission line tools and\n equipment\n2.4 Safety procedure to perform ERS erection and stringing\n procedures\n2.5 Hand signal communication\n2.6 Desirable work values and attitudes (cost conscious,\nsafety conscious, quality conscious, etc.)\n2.7 Power industry standards\n2.8 Uses and functions of rigging gears\n3. Underpinning skills\n3.1 Identifying line hardware, materials and design structures\nand specifications\n3.2 Identifying and complying occupational health and safety\nstandards\n3.3 Using transmission line tools, equipment and hardware\n3.4 Following safety procedures for performing ERS erection\nand stringing\n3.5 Working efficiently and systematically\n3.6 Communicating skills\n3.7 First aid skills\n3.8 Interpreting and following power industry standards\n3.9 Using rigging equipment\n4. Resource Implications\nThe following resources must be available:\n4.1 Transmission line tools, equipment and hardwares and\nPPE (see range of variables)\n4.2 Work area\n5. Method of assessment\n5.1 Observation and Oral questioning\n5.2 Demonstration with oral questioning\n5.3 Written test\n6. Context of assessment\n6.1 Competency may be assessed in the workplace or in a\n simulated workplace setting\n6.2 Assessment shall be undertaken either individually or part\n of team under limited supervision\n\n--- PDF PAGE 50 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS – TRANSMISSION LINE INSTALLATION AND MAINTENANCE NC II\n\n Page 48"
