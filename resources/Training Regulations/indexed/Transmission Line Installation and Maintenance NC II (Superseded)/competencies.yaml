        "source_text": "UTL311205\nDESCRIPTOR : This unit covers the knowledge, skills and attitude to\noperate and maintain transmission line tools and\nequipment. This unit will involve working in a team\nenvironment.\nELEMENT\nPERFORMANCE CRITERIA\n(Italicized Bold terms are elaborated in the range of variables)\n1. Plan and prepare for\nwork\n1.1 Work instruction is secured and interpreted according to\n job requirements\n1.2 Relevant occupational health and safety requirements\nare identified following job specifications\n1.3 Relevant transmission line tools, equipment and\nhardware are identified and requested in accordance with\njob specifications\n2. Prepare\ntransmission line\ntools and equipment\n\n2.1 Personal protective equipment (PPE) are obtained\n following job requirements\n2.2 Transmission line tools, equipment and hardware are\n acquired and secured in line with job requirements\n2.3 Transmission hot line tools are tested/set following\n manufacturer’s standards or recommendation\n3. Operate\ntransmission line\ntools and equipment\n3.1 PPE are used in line with job requirements\n3.2 Transmission line tools and equipment are used in line\n with job requirements\n4. Check condition of\ntransmission line\ntools and equipment\n\n4.1 Transmission line tools and equipment are identified\n according to classification and job requirements\n4.2 Non-functional transmission line tools and equipment are\n segregated and labeled according to classification\n4.3 Safety of transmission line tools and equipment are\n observed in accordance with manufacturer's instructions\n4.4 Condition of PPE are checked in accordance with\n manufacturer's instructions\n5. Perform basic\npreventive\nmaintenance\n5.1 Appropriate lubricants are identified according to\n types of equipment\n5.2 Equipment are lubricated according to preventive\n maintenance schedule or manufacturer's specifications\n5.3 Transmission line tools are cleaned and tested according\n to standard procedures\n5.4 Transmission line tools and equipment are inspected, and\n repaired and replaced, if necessary, after use\n5.5 Work place is cleaned and kept in safe state in line with\n OHSA regulations\n6. Store tools and\nequipment\n\n6.1 Inventory of transmission line tools and equipment are\n conducted and recorded as per company practices\n6.2 Transmission line tools and equipment are stored safely in\n appropriate locations in accordance with manufacturer's\n specifications or company procedures\n\n--- PDF PAGE 27 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS – TRANSMISSION LINE INSTALLATION AND MAINTENANCE NC II\n\n Page 25\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Job requirements\n1.1 Perform overhead transmission line work\n1.2 Erect pole\n1.3 Perform live-line maintenance work\n1.4 Perform cold-line maintenance work\n1.5 Perform ground line maintenance work\n1.6 Perform emergency restoration structure\n\n2. Occupational health\n and safety\n requirements\nMay include but not limited to:\n2.1 Personal protective equipment (PPE)\n2.1.1 Safety hat\n2.1.2 Safety goggles\n2.1.3 Safety gloves\n2.1.4 Safety shoes\n2.1.5 Safety harness/strap\n2.2 Installation of grounding cluster\n\n3. Transmission line\n tools, equipment and\n hardware\nMay include but not limited to:\n3.1 Hand tools\n3.1.1 Pliers\n3.1.2 Screwdrivers\n3.1.3 Adjustable wrenches\n3.1.4 Ball peen hammer\n3.1.5 Auger bit\n3.1.6 Hacksaw/cutting tools\n3.1.7 Steel tape\n3.2 Equipment\n3.2.1 Motorized capstan\n3.2.2 Climbing gears\n3.2.3 Line truck/Boom truck\n3.3 Set of hot line trailer\n3.4 Hardware\n3.4.1 Insulator\n3.4.2 Machine bolts\n3.4.3 Suspension clamp assembly (ACSR/OHGW)\n3.4.4 Strain clamp assembly(ACSR/OHGW)\n3.4.5 Overhead ground wires\n3.4.6 Cross-arms and braces\n3.4.7 Conductors and accessories\n\n--- PDF PAGE 28 ---\n-------------