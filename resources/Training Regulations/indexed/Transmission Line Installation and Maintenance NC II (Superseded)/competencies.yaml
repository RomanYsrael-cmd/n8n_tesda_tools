        "evidence_guide": {
          "source_text": "1. Critical aspects of\n competency\nAssessment requires evidence that the candidate:\n1.1 Demonstrates ability to interpret ground line maintenance job\nrequirements\n1.2 Demonstrates ability to identify and comply with lineman’s\noccupational health and safety standards\n1.3 Demonstrates ability to identify and use transmission line\ntools, equipment, hardware\n1.4 Demonstrates ability to perform ground line maintenance work\nor procedure\n1.3 Demonstrates ability to communicate and work in a team\nenvironment\n2. Underpinning\nknowledge and attitude\n2.1 Line hardware, materials and design structures &\n specifications\n2.2 Illegal structures and vegetation within the right of way\n2.3 Lineman’s occupational health and safety standards\n2.4 Uses and specifications of transmission line tools, and\n equipment\n2.5 Safety procedure to perform ground line maintenance work\n2.6 Hand signal communication\n2.7 Desirable work values and attitudes (cost conscious,\n safety conscious, quality conscious, etc.)\n2.8 Power industry standards\n2.9 Uses and functions of rigging gears\n3. Underpinning skills\n3.1 Identifying line hardware, materials and design structures\n and specifications\n3.2 Identifying and complying occupational health and safety\n Standards\n3.3 Identifying illegal structures and vegetation within the right\n of way\n3.4 Using transmission line tools, equipment, and hardware\n3.5 Following safety procedures for ground line maintenance work\n3.6 Work efficiently and systematically\n3.2 Communicating skills\n3.3 First aid skills\n3.9 Interpreting and following power industry standards\n3.10 Using rigging equipment\n4. Resource Implications\nThe following resources must be available:\n3.1 Transmission line tools, equipment, hardwares and PPE\n (see range of variables)\n3.2 Work area\n3.3 Line truck\n5. Method of assessment\n5.1 Observation and Oral questioning\n5.2 Demonstration with oral questioning\n5.3 Written test\n6. Context of assessment\n6.1 Competency may be assessed in the workplace or in a\n simulated workplace setting\n6.2 Assessment shall be undertaken either individually or part\n of team under limited supervision\n\n--- PDF PAGE 47 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS – TRANSMISSION LINE INSTALLATION AND MAINTENANCE NC II\n\n Page 45\n\nUNIT OF COMPETENCY : INSTALL EMEREGENCY RESTORATION\n STRUCTURE (ERS)\nUNIT CODE\n:"
        },
        "source_text": "UTL723216\nDESCRIPTOR : This unit covers the knowledge, skills and attitude required\nto perform ground line maintenance work. This unit also\nincludes working in a team environment.\n\nELEMENT\nPERFORMANCE CRITERIA\n(Italicized Bold terms are elaborated in the range of variables)\n1. Plan and prepare for\nwork\n1.1 Work instruction is secured and interpreted according to\n job requirements\n1.2 Relevant occupational health and safety requirements\nare identified following job specifications\n1.3 Relevant transmission line tools, equipment and\nhardware are identified and requested in accordance with\njob specifications\n\n3. Prepare hardware,\ntools and equipment\n3.1 Personal protective equipment (PPE) are obtained\nfollowing job requirements\n3.2 Transmission line tools, equipment and hardware are\nacquired and secured in line with job requirements\n\n5. Perform ground line\n maintenance\n procedure\n3.1 Transmission line tools, equipment and hardware are used\nin line with job requirements\n3.2 Personal protective equipment (PPE) are used following\njob requirements\n3.3 Ground line maintenance work procedure is performed\nfollowing job requirements.\n3.4 Housekeeping procedure is performed in line with power\nindustry procedure\n\n--- PDF PAGE 45 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS – TRANSMISSION LINE INSTALLATION AND MAINTENANCE NC II\n\n Page 43\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Ground line\n maintenance work job\n requirements\nMay include but not limited to:\n1.1 Replacement of rusty and corroded guy wires\n1.2 Replacement of pilfered guy wires and anchor rod and\n attachments\n1.3 Replacement and repair of structural ground\n1.4 Correction of pole alignment\n1.5 Cutting of obstructive vegetations\n1.6 Re-tensioning of loosed guy wires\n1.7 Reinforced structure’s stability of slope protection\n\n2. Occupational health\n and safety standards\nMay include but not limited to:\n2.2. Personal protective equipment (PPE)\n2.2.1. Safety hat\n2.2.2. Safety goggles\n2.2.3. Safety gloves\n2.2.4. Safety shoes (without steel toe)/rain boots\n\n3. Transmission line\ntools, equipment and\nhardware\nMay include but not limited to:\n3.1 Hand tools\n3.1.1 Pliers\n3.1.2 Screwdrivers\n3.1.3 Adjustable wrenches\n3.1.4 Ball peen hammer\n3.1.5 Hacksaw/cutting tools\n3.1.6 Bolo or power saw/axe\n3.2 Equipment\n3.2.1 Ratchet hoist\n3.2.2 Cum-along or wire grip\n3.2.2 Climbing gears/ladder\n3.2.3 Rope\n3.2.4 Line truck\n3.3 Hardware\n3.4.1 Guy wire\n3.4.2 Anchor rod/anchor screw\n3.4.3 Three bolts clamp/perform guy grip\n\n4. Ground line\nmaintenance work\nprocedure\nMay include but not limited to:\n4.1 Pruning/cutting\n4.2 Re-tightening of guy wires\n4.3 Replacement of pilfered hardware\n\n--- PDF PAGE 46 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS – TRANSMISSION LINE INSTALLATION AND MAINTENANCE NC II\n\n Page 44\n\nEVIDENCE GUIDE\n1. Critical aspects of\n competency\nAssessment requires evidence that the candidate:\n1.1 Demonstrates ability to interpret ground line maintenance job\nrequirements\n1.2 Demonstrates ability to identify and comply with lineman’s\noccupational health and safety standards\n1.3 Demonstrates ability to identify and use transmission line\ntools, equipment, hardware\n1.4 Demonstrates ability to perform ground line maintenance work\nor procedure\n1.3 Demonstrates ability to communicate and work in a team\nenvironment\n2. Underpinning\nknowledge and attitude\n2.1 Line hardware, materials and design structures &\n specifications\n2.2 Illegal structures and vegetation within the right of way\n2.3 Lineman’s occupational health and safety standards\n2.4 Uses and specifications of transmission line tools, and\n equipment\n2.5 Safety procedure to perform ground line maintenance work\n2.6 Hand signal communication\n2.7 Desirable work values and attitudes (cost conscious,\n safety conscious, quality conscious, etc.)\n2.8 Power industry standards\n2.9 Uses and functions of rigging gears\n3. Underpinning skills\n3.1 Identifying line hardware, materials and design structures\n and specifications\n3.2 Identifying and complying occupational health and safety\n Standards\n3.3 Identifying illegal structures and vegetation within the right\n of way\n3.4 Using transmission line tools, equipment, and hardware\n3.5 Following safety procedures for ground line maintenance work\n3.6 Work efficiently and systematically\n3.2 Communicating skills\n3.3 First aid skills\n3.9 Interpreting and following power industry standards\n3.10 Using rigging equipment\n4. Resource Implications\nThe following resources must be available:\n3.1 Transmission line tools, equipment, hardwares and PPE\n (see range of variables)\n3.2 Work area\n3.3 Line truck\n5. Method of assessment\n5.1 Observation and Oral questioning\n5.2 Demonstration with oral questioning\n5.3 Written test\n6. Context of assessment\n6.1 Competency may be assessed in the workplace or in a\n simulated workplace setting\n6.2 Assessment shall be undertaken either individually or part\n of team under limited supervision\n\n--- PDF PAGE 47 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS – TRANSMISSION LINE INSTALLATION AND MAINTENANCE NC II\n\n Page 45\n\nUNIT OF COMPETENCY : INSTALL EMEREGENCY RESTORATION\n STRUCTURE (ERS)\nUNIT CODE\n:"
