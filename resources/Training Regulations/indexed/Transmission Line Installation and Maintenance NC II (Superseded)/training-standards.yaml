    "source_text": "SECTION 3 TRAINING STANDARDS\n\n3.1\nCURRICULUM DESIGN\n\nCourse Title: TRANSMISSION LINE INSTALLATION AND MAINTENANCE NC II\n\nNominal Training Duration:\n 18 hrs – Basic Competencies\n\n 48 hrs – Common Competencies\n\n 580 hrs – Core Competencies\n\nCourse Description:\n\nThis course is designed to develop & enhance the knowledge, skills, & attitudes\nof a transmission line lineman, in accordance with industry standards. It covers the\nbasic and common competencies in addition to the core competencies such as\nerecting pole, performing overhead transmission line work, performing cold-, live- and\nground maintenance works as well as installing emergency restoration structure\n(ERS).\n.\n\nBASIC COMPETENCIES\n18 hrs\n\nUnit of\nCompetency\nLearning Outcome\nMethodology\nAssessment\nApproach\n1. Participate in\nWorkplace\nCommunication\n1.1 Obtain and convey workplace\ninformation\n1.2 Participate in workplace\nmeetings and discussions\n1.3 Complete relevant work\nrelated documents\n• Group\ndiscussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n2. Work in a Team\nEnvironment\n2.1 Describe and identify team role\nand responsibility in a team\n2.2 Describe work as a team member\n• Discussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n3. Practice Career\nProfessionalism\n3.1 Integrate personal objectives\nwith organizational goals\n3.2 Set and meet work priorities\n3.3 Maintain professional growth\nand development\n• Discussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n4. Practice\nOccupational\nHealth and Safety\nProcedures\n4.1 Identify hazards and risks\n4.2 Evaluate hazards and risks\n4.3 Control hazards and risks\n4.4 Maintain occupational health\nand safety awareness\n• Discussion\n• Plant tour\n• Symposium\n• Observation\n• Interview\n\n--- PDF PAGE 51 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS – TRANSMISSION LINE INSTALLATION AND MAINTENANCE NC II\n\n Page 49\n\nCOMMON COMPETENCIES\n48 hrs\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Apply Quality\nStandards\n1.1 Check materials and replace\nfaulty ones in accordance\nwith workplace standards\nand requirements\n1.2 Carry out work assignments\nin accordance with standard\noperating procedures\n1.3 Check completed work\nagainst standards and\nspecifications\n1.4 Document and prepare a\nreport on deviations from\nspecific quality standards\n▪ Lecture\n▪ Discussion\n▪ Demonstration\n▪ Viewing\nmultimedia\n▪ Hands on\npractice\n\n▪ Observation in\nworkplace\n▪ Demonstration\n▪ Oral questioning\n▪ Third Party\nReport\n\n2. Comply with\nenvironmental\nprotection\nprocedures\n2.1 Access information\nconcerning environmental\nprotection regulations and\nprocedures\n2.2 Implement and monitor\nprocedures concerning\nenvironmental hazards\n2.3 Implement and monitor\nenvironmental control\nprocedures\n▪ Lecture\n▪ Discussion\n▪ Demonstration\n▪ Viewing\nmultimedia\n▪ Hands on\npractice\n\n▪ Observation in\nworkplace\n▪ Demonstration\n▪ Oral questioning\n▪ Third Party\nReport\n\n3. Observe\nprocedures,\nSpecifications\nand Manuals\nof Instructions\n3.1 Identify and access\nspecification/ manuals\n3.2 Interpret and apply\ninformation in manuals\n▪ Lecture\n▪ Discussion\n▪ Demonstration\n▪ Viewing\nmultimedia\n▪ Hands on\npractice\n▪ Observation in\nworkplace\n▪ Demonstration\n▪ Oral questioning\n▪ Third Party\nReport\n\n4. Maintain and\noperate\ntransmission\nline tools and\nequipment\n4.1 Plan and prepare for work to\noperate and maintain T/L\ntools and equipment\n4.2 Prepare T/L hardware, tools\nand equipment for operation\nand maintenance\n4.3 Operate T/L tools and\nequipment\n4.4 Check condition of T/L tools\nand equipment\n4.5 Perform basic preventive\nmaintenance\n4.6 Store tools and equipment\n▪ Lecture\n▪ Discussion\n▪ Demonstration\n▪ Viewing\nmultimedia\n▪ Hands on\npractice\n\n▪ Observation in\nworkplace\n▪ Demonstration\n▪ Oral questioning\n▪ Third Party\nReport\n\n--- PDF PAGE 52 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS – TRANSMISSION LINE INSTALLATION AND MAINTENANCE NC II\n\n Page 50\n\nCORE COMPETENCIES\n580 hrs\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Perform T/L\npole erection\n\n1.1 Plan and prepare for pole erection\nwork\n1.2 Prepare T/L hardware, tools and\nequipment for pole erection\n1.3 Transport pole to job site\n1.4 Perform pole-siting and excavation\n1.5 Erect and/or retire pole\n▪ Lecture\n▪ Discussion\n▪ Demonstration\n▪ Viewing\nmultimedia\n▪ Hands on\npractice\n▪ Observation in\nworkplace\n▪ Demonstration\n▪ Oral\nquestioning\n▪ Third Party\nReport\n\n2. Perform\noverhead\ntransmission\nline work\n\n2.1 Plan and prepare for overhead T/L\nwork.\n2.2 Prepare T/L hardware, tools and\nequipment for overhead T/L\nmaintenance\n2.3 Perform overhead line work\n▪ Lecture\n▪ Discussion\n▪ Demonstration\n▪ Viewing\nmultimedia\n▪ Hands on\npractice\n▪ Observation in\nworkplace\n▪ Demonstration\n▪ Oral\nquestioning\n▪ Third Party\nReport\n\n3. Perform cold-\nline\nmaintenance\nwork\n\n3.1 Plan and prepare for cold-line\nmaintenance work\n3.2 Prepare T/L hardware, tools and\nequipment for cold-line maintenance\n3.3 Perform cold-line maintenance\nprocedure\n\n▪ Lecture\n▪ Discussion\n▪ Demonstration\n▪ Viewing\nmultimedia\n▪ Hands on\npractice\n▪ Observation in\nworkplace\n▪ Demonstration\n▪ Oral\nquestioning\n▪ Third Party\nReport\n\n4. Perform\nground line\nmaintenance\nwork\n\n4.1 Plan and prepare for ground line\nmaintenance work\n4.2 Prepare T/L hardware, tools and\nequipment for ground line\nmaintenance\n4.3 Perform ground-line maintenance\nprocedure\n▪ Lecture\n▪ Discussion\n▪ Demonstration\n▪ Viewing\nmultimedia\n▪ Hands on\npractice\n▪ Observation in\nworkplace\n▪ Demonstration\n▪ Oral\nquestioning\n▪ Third Party\nReport\n\n5. Perform live-\nline\nmaintenance\nwork\n\n5.1 Plan and prepare for live-line\nmaintenance work\n5.2 Prepare T/L hardware, tools and\nequipment for live-line maintenance\n5.3 Perform live-line maintenance\nprocedure\n▪ Lecture\n▪ Discussion\n▪ Demonstration\n▪ Viewing\nmultimedia\n▪ Observation in\nworkplace\n▪ Demonstration\n▪ Oral\nquestioning\n▪ Third Party\nReport\n\n6. Install\nemergency\nrestoration\nstructure\n\n6.1. Plan and prepare for ERS installation\n6.2. Prepare T/L hardware, tools and\nequipment for ERS installation\n6.3. Erect emergency restoration structure\n(ERS)\n\n▪ Lecture\n▪ Discussion\n▪ Demonstration\n▪ Viewing\nmultimedia\n▪ Hands on\npractice\n▪ Observation in\nworkplace\n▪ Demonstration\n▪ Oral\nquestioning\n▪ Third Party\nReport\n\n--- PDF PAGE 53 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS – TRANSMISSION LINE INSTALLATION AND MAINTENANCE NC II\n\n Page 51\n\n3.2\nTRAINING DELIVERY\n\nThe delivery of training should adhere to the design of the curriculum.\nDelivery should be guided by the 10 basic principles of the competency-based\nTechnical and Vocational Education and Training (TVET).\n• The training is based on curriculum developed from the competency\nstandards;\n• Learning is modular in its structure;\n• Training delivery is individualized and self-paced;\n• Training is based on work that must be performed;\n• Training materials are directly related to the competency standards\nand the curriculum modules;\n• Assessment is based in the collection of evidence of the performance\nof work to the industry required standard;\n• Training is based both on and off-the-job components;\n• Allows for recognition of prior learning (RPL) or current\ncompetencies;\n• Training allows for multiple entry and exit; and\n• Approved training programs are nationally accredited.\n\nThe competency-based TVET system recognizes various types of\ndelivery modes, both on and off-the-job as long as the learning is driven by the\ncompetency standards specified by the industry. The following training\nmodalities may be adopted when designing training programs:\n• The dualized mode of training delivery is preferred and recommended.\nThus programs would contain both in-school and in-industry training or\nfieldwork components. Details can be referred to the Dual Training\nSystem (DTS) Implementing Rules and Regulations.\n• Modular/self-paced learning is a competency-based training modality\nwherein the trainee is allowed to progress at his own pace. The\ntrainer only facilitates the training delivery.\n• Peer teaching/mentoring is a training modality wherein fast learners\nare given the opportunity to assist the slow learners.\n• Supervised industry training or on-the-job training is an approach in\ntraining designed to enhance the knowledge and skills of the trainee\nthrough actual experience in the workplace to acquire a specific\ncompetencies prescribed in the training regulations.\n• Distance learning is a formal education process in which majority of\nthe instruction occurs when the students and instructors are not in\nthe same place. Distance learning may employ correspondence\nstudy, or audio, video or computer technologies.\n\n--- PDF PAGE 54 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS – TRANSMISSION LINE INSTALLATION AND MAINTENANCE NC II\n\n Page 52\n\n3.3\nTRAINEE ENTRY REQUIREMENTS\n\nThe trainees who wish to enter the course should possess the following\nrequirements:\n\n•\nAt least high school graduate or equivalent\n•\nCan communicate in oral and written language\n•\nMust be physically and mentally fit to undergo training e.g. no fear\nof working in height\n\nThis list does not include specific institutional requirements, such as\nheight and age requirements, educational attainment, appropriate work\nexperience and others that may be required from the trainees by the school or\ntraining center delivering the TVET program.\n\n*\n\n3.4 LIST OF TOOLS, EQUIPMENT AND MATERIALS (Institution-based)\n\nRecommended list of tools, equipment and materials required for a class size\nof 20 trainees for Transmission Line Installation and Maintenance NC II:\n\nTOOLS\nEQUIPMENT\nHARDWARE/\nACCESSORIES\nQTY\nITEM\nQTY ITEM\nQTY\nITEM\n20\npcs.\nPliers\n6\nsets\nRatchet hoist\n190\npcs.\nT/L Insulator\n20\npcs.\nBallpeen hammers\n2\nsets\nCapstan/Hand winch\n(includes tightener)\n1 lot\nMachine bolts\n20\npcs.\nScrewdrivers\n6\nsets\nBlock and tackle\n12\nsets\nSuspension clamps\n4\nsets\nHacksaw\n2\nsets\nCompression tool\n30\nsets\nStrain clamp\n20\npcs.\nAdjustable wrenches\n6\nsets\nSnatch block\n1 lot\nOverhead ground wires\n4\npcs.\nAuger bit\n20\nsets\nClimbing gears set\n12\npcs.\nCross-arms and braces\n(of various lengths)\n4\nsets\nCutting tools\n(hydraulic, acetylene,\nbolo)\n1 set Dynamometer/\nTension meter\n1 lot\nConductors and\naccessories\n1\nunit\nHotline trailer\n6\nsets\nWire grip/cum-along\n1 lot\nTower parts\n4\nsets\nDigging tools\n(straight shovel,\nspoon, digging bar,\nhole digger, garden\nshovel)\n2\nsets\nHydraulic cutter\n2\nsets\nEmergency Restoration\nStructure (ERS)\n20\npcs.\nSteel tape\n1\nunit\nLeakage-current\nmonitoring kit (hot\nstick tester/la\n16\npcs.\nPoles (assorted)\n\n--- PDF PAGE 55 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS – TRANSMISSION LINE INSTALLATION AND MAINTENANCE NC II\n\n Page 53\n\n2\npcs\nTele-height meter\n1\nunit\nLine truck\n\n1unit Boom truck\n\n2\nsets\nERS gin pole (with\ncomplete\naccessories)\n\n5\nrolls\nNylon rope\n\n21\npcs.\nStringing roller\n\n25\npcs.\nWebbing sling/nylon\n\n1\nunit\nSplicing machine\n\nPPE\n\n20\npcs.\nHard hat\n\n20\npairs\nSafety shoes\n\n20\npcs.\nSafety goggles\n\n2\nsets\nConductive suit\n\n20\npcs.\nSafety gloves\n\n2\nsets\nFirst-aid kit set\n\n--- PDF PAGE 56 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS – TRANSMISSION LINE INSTALLATION AND MAINTENANCE NC II\n\n Page 54\n\n3.5 TRAINING FACILITIES\n\nRecommended space requirements for the various teaching/learning areas\nare as follows:\n\nTEACHING/LEARNING AREAS\nSIZE IN\nMETERS (M)\nAREA IN\nSQ. M\nQTY\nTOTAL AREA\nIN SQ. M\nLecture Area\n6 x 8\n48\n1\n48\nLaboratory Area (field-based)\n7 X 8\n56\n1\n56\nLearning Resource Area\n4 x 5\n20\n1\n20\nWash ,Toilet & Locker Room\n3 x 5\n15\n1\n15\n Total\n139\nFacilities / Equipment / Circulation*\n\n35\n Total Area\n\n174\n\n3.6 TRAINERS QUALIFICATIONS\n\nTRANSMISSION LINE INSTALLATION AND MAINTENANCE NC II\n\nTrainer’s Qualification TQ II\n\n•\nMust be a holder of Transmission Line Installation and Maintenance NCII or\nequivalent\n•\nMust have completed Training Methodology II (TM II) course or equivalent\n•\nMust have at least 5-years relevant industry experience.\n•\nMust be physically & mentally fit.\n\n* Optional:\nOnly when required by the hiring institution.\n\n3.7 INSTITUTIONAL ASSESSMENT\n\nInstitutional assessment is undertaken by trainees to determine their\n\nachievement of units of competency. A certificate of achievement is issued for\n\neach unit of competency.\n\n--- PDF PAGE 57 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS – TRANSMISSION LINE INSTALLATION AND MAINTENANCE NC II\n\n Page 55"
