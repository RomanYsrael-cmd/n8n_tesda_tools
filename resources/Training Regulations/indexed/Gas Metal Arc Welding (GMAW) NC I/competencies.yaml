        "evidence_guide": {
          "source_text": "1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1. Demonstrated knowledge of organizational procedures\nfor handling verbal and written communications\n1.2. Received and acted on verbal messages and\ninstructions\n1.3. Demonstrated competency in recording\ninstructions/information\n\n2. Underpinning\nknowledge and\nattitudes\n2.1. Knowledge of organizational policies/guidelines in\nregard to processing internal/external information\n2.2. Ethical work practices in handling communications\n2.3. Communication process\n3. Underpinning\nskills\n3.1. Conciseness in receiving and clarifying\nmessages/information/communication\n3.2. Accuracy in recording messages/information\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1. Pens\n4.2. Note pads\n5. Methods of\nassessment\nCompetency may be assessed through:\n5.1. Direct Observation\n5.2. Oral interview\n5.3. Written Evaluation\n5.4. Third Party Report\n\n6. Context of\nassessment\n6.1. Competency may be assessed individually in the actual\nworkplace or simulation environment in TESDA\naccredited institutions\n\n--- PDF PAGE 7 ---\n11/03/04\nWeldncii11-3\n\n6\nUNIT OF COMPETENCY : WORK WITH OTHERS\n\nUNIT CODE\n:"
        },
        "source_text": "500311101\nUNIT DESCRIPTOR\n: This unit covers the knowledge, skills and attitudes\n\n required to receive, respond and act on verbal and\n\n written communication.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Follow routine spoken\nmessages\n1.1.\nRequired information is gathered by listening\nattentively and correctly interpreting or\nunderstanding information/instructions\n1.2.\nInstructions/information are properly recorded\n1.3.\nInstructions are acted upon immediately in\naccordance with information received\n1.4.\nClarification is sought from workplace supervisor\non all occasions when any instruction/information\nis not clear\n2. Perform workplace\nduties following written\nnotices\n2.1 Written notices and instructions are read and\ninterpreted correctly in accordance with\norganizational guidelines\n2.2 Routine written instruction are followed in\nsequence\n2.3 Feedback is given to workplace supervisor based\non the instructions/information received\n\n--- PDF PAGE 5 ---\n11/03/04\nWeldncii11-3\n\n4\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Written notices and\ninstructions\nIt refers to :\n1.1. Handwritten and printed material\n1.2. Internal memos\n1.3. External communications\n1.4. Electronic mail\n1.5. Briefing notes\n1.6. General correspondence\n1.7. Marketing materials\n1.8. Journal articles\n2. Organizational guidelines\nIt may include:\n2.1. Information documentation procedures\n2.2. Company policies and procedures\n2.3. Organization manuals\n2.4. Service manual\n\n--- PDF PAGE 6 ---\n11/03/04\nWeldncii11-3\n\n5\nEVIDENCE GUIDE\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1. Demonstrated knowledge of organizational procedures\nfor handling verbal and written communications\n1.2. Received and acted on verbal messages and\ninstructions\n1.3. Demonstrated competency in recording\ninstructions/information\n\n2. Underpinning\nknowledge and\nattitudes\n2.1. Knowledge of organizational policies/guidelines in\nregard to processing internal/external information\n2.2. Ethical work practices in handling communications\n2.3. Communication process\n3. Underpinning\nskills\n3.1. Conciseness in receiving and clarifying\nmessages/information/communication\n3.2. Accuracy in recording messages/information\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1. Pens\n4.2. Note pads\n5. Methods of\nassessment\nCompetency may be assessed through:\n5.1. Direct Observation\n5.2. Oral interview\n5.3. Written Evaluation\n5.4. Third Party Report\n\n6. Context of\nassessment\n6.1. Competency may be assessed individually in the actual\nworkplace or simulation environment in TESDA\naccredited institutions\n\n--- PDF PAGE 7 ---\n11/03/04\nWeldncii11-3\n\n6\nUNIT OF COMPETENCY : WORK WITH OTHERS\n\nUNIT CODE\n:"
